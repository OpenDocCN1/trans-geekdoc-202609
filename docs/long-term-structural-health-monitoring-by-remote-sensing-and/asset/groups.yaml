    In statistics, Markov Chain Monte Carlo methods are comprised of a class of probabilistic
    algorithms for systematic random sampling from a probability distribution. In
    contrast to Monte Carlo sampling techniques that are capable of drawing independent
    samples from the distribution of interest, Markov Chain Monte Carlo methods can
    draw samples where the next sample is dependent on the existing sample, called
    a Markov chain. Markov Chain Monte Carlo algorithms, as their names indicate,
    consists of two parts of Monte Carlo and Markov Chain. In probability theory,
    Monte Carlo is an approach to randomly sampling a probability distribution and
    approximating a desired quantity. On this basis, Monte Carlo techniques typically
    suppose that it is possible to efficiently draw samples from a target distribution,
    in which case, from the samples that are drawn, one can estimate the sum or integral
    quantity as the mean or variance of the drawn samples. On the other hand, Markov
    Chain is a systematic stochastic procedure for generating a sequence of random
    samples, where the current sample is probabilistically dependent on the value
    of the previous sample. In case of combining these two methodologies (i.e., Markov
    Chain and Monte Carlo), it allows us to draw random samples for high-dimensional
    distributions that hold the probabilistic dependence between samples by constructing
    a Markov Chain that comprises the Monte Carlo sample. For this aim, it suffices
    to build a Markov chain that contains the desired distribution as its equilibrium
    distribution and then gain a sample of that distribution by recording states from
    the chain (Van Ravenzwaaij et al. 2018). The successful performance of data augmentation
    in SHM has been studied by Entezami et al. (2022) regarding damage localization
    and threshold estimation with a small number of anomaly indices.


    ### 2.3.1.1 Hamiltonian Monte Carlo Sampling


    The HMC sampling is a Markov Chain Monte Carlo technique for obtaining a sequence
    of random samples from a target probability distribution when the direct sampling
    process is intractable (Neal 2011). This method corresponds to an instance of
    the Metropolis–Hastings algorithm with a Hamiltonian dynamics evolution that can
    be simulated by using a time-reversible and volume-preserving numerical integrator
    to provide a move to a new sample. Unlike the Metropolis–Hastings algorithm, the
    HMC method decreases the correlation between successive sampled states by performing
    moves to far states that can provide a high probability of acceptance owing to
    having approximate energy conserving characteristics of the simulated Hamiltonian
    dynamic. Simply speaking, the reduced correlation makes sense that fewer Markov
    chain samples are required to approximate integrals with respect to the target
    probability distribution.


    Assume that \( f(\mathbf{x}) \) is the target distribution that is supposed to
    be sampled by using a chain of samples \( \{\mathbf{x}_0, \mathbf{x}_1, \mathbf{x}_2,
    ...\} \). Accordingly, the Hamilton’s equations are written in the following forms:


    ```

    \frac{\mathrm{d}x_i}{\mathrm{d}t} = \frac{\partial H}{\partial w_i} \quad (2.22)

    \frac{\mathrm{d}w_i}{\mathrm{d}t} = \frac{\partial H}{\partial x_i} \quad (2.23)

    ```


    where \( x_i \) and \( w_i \) denote the \( i \)th element of the parameter and
    momentum vector, respectively. Moreover, \( H \) refers to the Hamiltonian function.
    Suppose that \( \mathbf{M} \) is a symmetric and positive definite (mass) matrix.
    On this basis, the Hamiltonian is expressed as follows:


    ```

    H(\mathbf{x}, \mathbf{w}) = U(\mathbf{x}) + \frac{1}{2}\mathbf{w}^T \mathbf{M}^{-1}
    \mathbf{w} \quad (2.24)

    ```


    where


    ```

    U(\mathbf{x}) = - \ln f(\mathbf{x}) \quad (2.25)

    ```


    From Eq. (2.25), one can understand that the sampling method under the algorithm
    of HMC relies on the logarithmic function related to the target distribution.
    Moreover, this sampler exploits the leap-frog technique (Neal 2011), which is
    an approximate solution to the motion of non-interacting classical particles,
    to determine the parameter and momentum components at any time. For this purpose,
    the sampling algorithm needs a positive integer for the number of leap-frog steps
    \( L \) and a positive number for the step size \( \Delta t \). Subsequently,
    it draws a random Gaussian momentum \( \mathbf{w}(0) \) from a Gaussian distribution
    with zero mean and covariance equal to the mass matrix \( \mathbf{M} \). In the
    next step, the particle runs under Hamiltonian dynamics for time \(L\Delta t\).
    It should be noted that this procedure is carried out by the leap-frog technique
    by numerically solving the Hamilton''s equations. In this regard, the parameter
    and momentum vectors after time \(\Delta t\) are given by:


    \(\mathbf{w}\left(t + \frac{\Delta t}{2}\right) = \mathbf{w}(t) - \frac{\Delta
    t}{2} \nabla U(\mathbf{x})|_{\mathbf{x}=\mathbf{x}(t)}\) (2.26)


    \(\mathbf{x}(t + \Delta t) = \mathbf{x}(t) - \Delta t \mathbf{M}^{-1} \mathbf{w}\left(t
    + \frac{\Delta t}{2}\right)\) (2.27)


    \(\mathbf{w}(t + \Delta t) = \mathbf{w}\left(t + \frac{\Delta t}{2}\right) - \frac{\Delta
    t}{2} \nabla U(\mathbf{x})|_{\mathbf{x}=\mathbf{x}(t+\Delta t)}\) (2.28)


    The above-mentioned equations should be applied to \(\mathbf{x}(0)\) and \(\mathbf{w}(0)\)
    \(L\) times to determine \(\mathbf{x}(L\Delta t)\) and \(\mathbf{w}(L\Delta t)\).
    Let \(\mathbf{d} \in \mathbb{R}^{p \times 1}\) denotes a set of displacement points
    of \(p\) target points from a SAR image. Note that each \(\mathbf{d}\) is equivalent
    to \(\mathbf{x}\). On this basis, the underlying goal of the HMC sampler is to
    forecast the vector \(\mathbf{d}\) under \(C\) chains and \(N\) sample numbers.
    This means that the HMC technique makes attempt to generate \(N\) points of the
    vector \(\mathbf{d}\) from a target distribution (i.e., Gaussian distribution
    in this research) in an effort to make a set of augmented displacement points
    in a new matrix \(\mathbf{D} \in \mathbb{R}^{p \times N}\), under \(C\) chains
    in an iterative algorithm. In other words, for the \(j\)th chain and \(k\)th sample,
    where \(j = 1, ..., C\) and \(k = 1, ..., N-1\), one can derive an augmented matrix
    \(\mathbf{D}_{k+1}^{(j)}\). Using a hypothesis based on the Gelman-Rubin statistic
    (Gelman and Rubin 1992), if the statistic converges on the hypothesis criterion,
    one can fix the simulated parameter at the \((k + 1)\)th iteration; unless, one
    should choose the simulated parameter of the previous at the \(k\)th iteration.
    After determining all \(C\) augmented matrices, their average is used as the final
    set of the augmented displacement points. Eventually, the matrix of the augmented
    displacement points (**D**) is divided into the training set (matrix) \(\mathbf{X}
    \in \mathbb{R}^{p \times n}\) and test set (matrix) \(\mathbf{Z} \in \mathbb{R}^{p
    \times m}\), where \(n < N\) and \(m < N\).


    ### 2.3.1.2 Slice Sampling


    The SLS is the other algorithm of Markov chain Monte Carlo for generating random
    data points on the basis of their previous states. The fundamental principle of
    the SLS lies in the idea that a random variable can be sampled uniformly from
    the area under the graph of a uniform probability distribution and then only observe
    the horizontal coordinates of the samples. For this purpose, one needs to construct
    a Markov chain that can meet the uniform distribution of interest via uniformly
    sampling from the vertical interval represented by the density at the current
    sample and from the union of intervals that comprises the horizontal slice.


    More precisely, the SLS originates from this idea that sampling from a distribution
    \(p(x)\), whose density is proportional to \(f(x)\), is comparable to uniformly
    sampling from the region under the graph of \(f(x)\). From a univariate viewpoint,
