    ## 前言


    对土木结构进行持续健康监测是评估其健康与安全的有效方法。在大多数基于接触式传感器的结构健康监测（SHM）应用中，长期策略包含来自相对密集传感器网络的大量测量数据。在这种情况下，大数据带来的维度灾难是
    SHM 的主要挑战之一。得益于卫星系统的发展以及通过合成孔径雷达（SAR）图像进行遥感技术，已有可能利用卫星图像对土木结构进行健康监测。SAR 辅助 SHM
    方法的巨大优势在于，有可能获得有关结构在未受损状态下的先前信息或存档图像。此外，使用 SAR 图像进行长期过程是可行的。因此，应从这些图像中提取位移数据并进行分析。然而，有些问题限制了提供足够位移点的能力，在这种情况下，SAR
    辅助 SHM 面临 *小数据* 的挑战。另一方面，大多数长期 SHM 中的另一个主要挑战与 *环境和/或运行变化*（EOCs）相关。这个问题具有挑战性，因为此类变化可能导致类似于损伤的不可预测的土木结构变化。因此，在长期监测过程中会出现严重的假阳性和假阴性。当数据量较少时，此问题在
    SAR 辅助 SHM 中会更加严重。因为假阳性和假阴性直接与经济和人类问题相关，因此必须考虑所有可能的 EOCs，可视化其在数据中的变化，并从位移点中将其删除。


    因此，本书的主要目标是提出 **新型混合无监督学习方法** 来解决上述挑战；即在小数据和 EOCs 条件下的长期 SHM。由于这些问题的重要性，本研究基于人工智能、数据采样以及概率和统计分析的概念，提出了
    **七种混合方法**。（1）第一种方法建议一种基于无监督最近邻搜索（NNS）和极值理论（EVT）思想的概率混合无监督学习器，用于相对大量数据和 EOCs 下的
    SHM。（2）第二种技术称为 HMC-MD，依赖于基于哈密顿蒙特卡罗（HMC）采样的数据增强方法，并通过其平方形式中著名的马氏距离（MD）进行特征判别。其他方法包含三个主要部分：(i)
    通过 HMC 采样或切片采样（SLS）对小位移数据进行增强，(ii) 对增强数据进行归一化以消除 EOCs，(iii) 通过 MD 指标进行基于无监督特征判别的损伤检测。这些方法分为两类：(i)
    基于离线学习的方法，(ii) 依赖于在线学习框架的方法。（3）第三种方法称为 HMC-DAE-MD，通过利用深度自编码器（DAE）将一种数据归一化方法添加到所提议的
    HMC-MD 技术中。在这方面，提出了一种简单而有效的迭代超参数优化方法，以选择 DAE 隐藏层的神经元大小，重点放在减轻 EOC 的影响。（4）第四种方法称为
    HMC-UTSL-MD，通过结合欠完备 DAE 和过完备浅层自编码器（AE），提出了一种创新的无监督教师-学生学习（UTSL）算法。（5）第五种方法称为 HMC-DTL-MD，通过开发连续
    DAE 提出了一种深度迁移学习（DTL）策略。所有上述方法都依赖于固定训练期内的离线学习。（6, 7）为了进行实时 SHM，第六种和第七种方法，HMC-ODTL-EMD
    和 SLS-ODTL-EMD，利用 HMC 和 SLS 先对小数据进行增强，随后开发在线深度迁移学习（ODTL）方法，最后通过计算马氏距离（EMD）的欧几里得范数提出一个新颖指标或损伤指数。总之，本书提出了多种创新方法，包括七种混合无监督学习器以及四种超参数优化算法。首两种提出的技术，NNS-EVT
    和 HMC-MD，通过美国 I-40 桥的全规模桥梁模拟数值位移数据进行了验证。其余技术通过英国 Tadcaster 桥的实世界长期位移数据点进行了验证，这些数据点由少量
    TerraSAR-X 图像获得。结果表明，所提议的混合技术有望解决 SAR 辅助 SHM 中的棘手问题，并且是解决实际问题的有效工具。


    意大利米兰

    Alireza Entezami

    Bahareh Behkamal

    Carlo De Michele


    '
