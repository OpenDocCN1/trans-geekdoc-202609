    0\)）和弗雷歇（\(\xi > 0\)）模型。此外，式 (2.16) 中关于 \(\xi = 0\) 的第二个（底部）表达式指的是半参数冈贝尔分布。因此，主要工作是通过某些估计量来估计
    EVI 参数。\(\xi > 0\) 最著名的估计量是 Hill 估计量。给定 \(X_1, \dots, X_n\) 的阶统计量，即 \(X_{n:n}
    > \dots > X_{1:n}\)，Hill 估计量表示如下（Hill 1975）：


    \(\hat{\xi}_H = \frac{1}{k} \sum_{i=1}^k (\log X_{n-i+1:n} - \log X_{n-k:n}) \quad
    (2.17)\)


    其中 \(k\) 是一个数值（样本比例），用于在半参数极值建模中将极值与其他值分开。Hill 估计量的主要局限性是仅适用于正 EVI。由于这一条件限制了该估计量在一般
    \(\xi\) 情况下的应用，因此提出了一些广义 EVI 估计量来解决此问题。其中之一是 Dekkers 等人（Dekkers and De Haan 1989）提出的矩估计量，表示如下：


    \(\hat{\xi}_M = \hat{\xi}_H - \frac{1}{2} \left( 1 - \frac{\left(M_{k,n}^{(1)}\right)^2}{M_{k,n}^{(2)}}
    \right)^{-1} + 1 \quad (2.18)\)


    因此，


    \(M_{k,n}^{(j)} = \frac{1}{k} \sum_{i=1}^k (\log X_{n-i+1:n} - \log X_{n-k:n})^j
    \quad (2.19)\)


    其中 \(j=1,2\)。矩估计量的巨大优点是适用于所有 EVI 情况；即，\(\xi \in \mathbb{R}\)。换句话说，取决于选定为极值样本的数据点数量，可以获得负或正
    EVI。这与经典 Hill 估计量相反，后者对于每种样本选择情况仅给出正 EVI。


    ## 2.2.3 分位数建模


    本节的主要目标是为所提出的 NNS-EVT 方法中的无监督新奇检测器定义一个索引。该新奇索引可以提供一种准则，用于区分异常（损坏）状态和正常（未损坏）状态。出于此原因，选定极值的分位数被定义为
    SHM 的新奇得分或损伤指标。在统计学和概率论中，CDF 的逆函数定义为在给定显著性水平下的抽样数据（即极值数据）的分位数。随机变量的分位数是以特定概率（即所谓的显著性水平）被超过的值。就
    EVT 而言，分位数建模是指估计极值样本的分位数，以量化尾部分布中的风险。当此过程依赖于非常小的概率（即 EVT 中发生的情况）时，建模的目的是估计一个高分位数。在考虑了来自阶统计量
