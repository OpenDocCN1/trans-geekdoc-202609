    ## 3.5 章节总结


    本章介绍了I-40桥数值研究的主要结果。在这项研究中，试图模拟从结构上某些目标点获得的SAR图像的大位移和小位移数据集。随后，所提概率无监督学习方法NNS-EVT和混合学习方法HMC-MD已被应用于在大位移和小位移数据点下检测不同严重程度的各种损伤情况。两种技术都成功检测了I-40桥上的模拟损伤情况。虽然所提NNS-EVT方法适用于不同EOC条件下的SHM，因为利用了NNS概念（这是一种减轻EOC的有效方法（Sarmadi
    et al. 2021a, 2022, 2023; Sarmadi and Karamodin 2020; Entezami et al. 2018, 2020,
    2023a, b, c; Entezami and Shariatmadar 2018; Esfehani et al. 2023; Heravi et al.
    2022）），所提HMC-MD方法在这些条件下的性能尚不明确。由于对I-40桥的数值研究没有在模拟位移样本中考虑EOC，因此评估HMC-MD在这方面至关重要。为此，下一章将使用真实结构的真实世界小位移数据来评估这一问题。


