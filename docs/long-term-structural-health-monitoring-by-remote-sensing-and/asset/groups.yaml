    8%。在短期监测中，变化率约为 2.6–3.8%。Jang 和 Smyth (2020) 对温度分布对斜拉桥全尺寸有限元模型结构响应的影响进行了数值研究，并通过考虑在单元层面施加的热预应力和温度相关的杨氏模量，对此研究建模了两种方法。他们的研究表明，结构构件上的热预应力是桥梁固有频率发生显著变化的关键原因。类似地，Teng
