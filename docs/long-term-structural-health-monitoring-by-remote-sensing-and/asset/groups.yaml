    Accordingly, online/incremental learning provides a more realistic and reliable
    condition for real-time SHM of civil structures. Here, the term real-time means
    implementing the data analysis, updating the trained model, and making a decision
    in an online fashion as the new measurement becomes available. In the online learning,
    the training procedure is carried out in an incremental manner by continually
    utilizing new data and updating the trained model. In most cases, an online learning
    strategy begins by applying an initial small set of measured data to develop an
    initial model. Once the new data is measured, it feeds into the initially trained
    model for updating or making decision. On this basis, in the problem of SHM, it
    is necessary to define a criterion or standard for terminating the updating step
