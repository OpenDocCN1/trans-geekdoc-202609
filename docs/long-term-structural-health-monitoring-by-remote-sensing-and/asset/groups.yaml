  - '[PAGE 82]


    # # Chapter 3 Simulating Reality: Numerical Assessments of a Bridge Health Monitoring


    **Abstract** In contrast to conventional sensing technologies, the preparation
    and extraction of displacement data from a large number of SAR images are not
    trivial. Notably, this process is difficult and time-consuming for long-term monitoring.
    For this issue, this chapter aims to validate the proposed probabilistic unsupervised
    learning method via simulated displacement responses of a numerical model of a
    real-world bridge structure. On this basis, the numerical model of this bridge
    was developed in MATLAB environment. To simulate remote sensing-based SHM, a few
    points in the bridge deck are selected as the target areas for extracting structural
    responses. Three damage scenarios in the vicinity of one the bridge piers are
    simulated to assess whether the proposed probabilistic unsupervised learning method
    can effectively detect such scenarios.


    **Keywords** Numerical model · Displacement simulation · Real-world bridge · Probabilistic
    unsupervised learning · Extreme value theory · Large data


    # ## 3.1 I-40 Bridge: A Box-Girder Bridge


    This section conducts a numerical study for validation of some proposed methods.
    This study is based on a numerical model of a full-scale bridge called the I-40
    Bridge, over the Rio Grande River in Albuquerque, New Mexico, US (Farrar et al.
    2000), as shown in Fig. 3.1a. The finite element model of this bridge was constructed
    to simulate different displacement points and investigate some SHM methods. Because
    the numerical model of the I-40 Bridge has recently been constructed and updated
    (Rezaiee-Pajand et al. 2021), it is considered for validating the proposed NNS-EVT
    and HMC-MD methods.'
  - '[PAGE 83]


    ![](img/3d323f4db48c9242205a3db747902f6d_83_0.png)


    Fig. 3.1 a The image of the I-40 Bridge, b the cross-section (Daneshvar et al.
    2023), c the elevation view


    # 3.2 The Numerical Model of the I-40 Bridge


    The I-40 Bridge was built from a steel girder and concrete deck with the width
    of 13.3 m and the thickness of 0.178 m. The deck was connected with two steel
    plate girders and three steel stringers as depicted in Fig. 3.1b. The stringers
    and the floor beams undertook the load transformation from the deck to the girders.
    Additionally, cross-bracing was considered to join the floor beams. Figure 3.1c
    shows'
  - '[PAGE 84]


    a part of the I-40 Bridge, where was selected to equip with some SHM systems for
    the numerical and experimental studies such as finite model updating (Rezaiee-Pajand
    et al. 2021) and model-based damage detection (Daneshvar et al. 2023). Therefore,
    the numerical model of this part is incorporated here to verify the proposed NNS-EVT
    and HMC-MD methods.


    The part of interest comprised three spans of the total length of 129.5 m including
    the middle span of the length of 49.7 m and two side spans of the lengths of 39.9
    m. The finite element model of this part of the I-40 Bridge was built in MATLAB
    by utilizing the shell and 3D beam elements (Rao 2011). Figure 3.2 displays the
    schematic forms and element numbers of the bridge regarding the deck, girder webs
    and the piers. For the concrete deck and girders, the numerical modeling is based
    on 144 and 48 shell elements with four nodes in terms of the membrane and rectangular
    plate elements. More precisely, as Fig. 3.2a indicates, the elements 1–144 are
    concerned with the deck shell components. Additionally, in Fig. 3.2b and c, the
    elements of the girder webs in the north and south sides are labeled by 145–168
    and 169–192. The 3D beam elements are considered to build the top and bottom piers,
    which are labeled by the numbers 193–204. Steel and concrete were the major materials
    for the numerical modeling of the I-40 Bridge. Table 3.1 lists the main mechanical
    properties of these materials used in the numerical modeling of the bridge. To
    simulate damage, it is assumed that the stiffness values of Elements 47, 54, 152,
    153, and 194 in the vicinity of the second pier are uniformly reduced by 2%, 10%,
    and 15% leading to total reductions in the structural stiffness equal to 10%,
    50%, and 75%, respectively (i.e., the total stiffness reduction 10% is determined
