    图 4.12 所提UTSL算法在特征歧视中数据归一化影响的评估：a HMC-MD，b HMC-UTSL-MD


    在仅考虑CLT辅助的阈值确定器的情况下，图4.13说明了通过所提HMC-UTSL-MD方法进行的特征歧视的最终结果。观察到，基于UTSL的数据归一化大大有助于MD指标产生具有歧视性的新奇性指数。与与HMC-DAE-MD相关的图4.9相比，可以看出即使在CLT辅助的阈值确定器下，UTSL算法也能更好地降低假阳性和假阴性的比率。因此，使用稍复杂的神经网络开发数据归一化可以为SAR辅助的SHM提供更可靠的输出。


    ## 4.3.3 HMC-DTL-MD


    与之前的混合方法类似，HMC-DTL-MD旨在在不可预测的EOC条件下，在倒塌发生之前检测早期损伤或预测倒塌。为此，它需要获得最佳数量的连续DAEs，使每个DAE分别包含三个隐藏层，大小为10、2、10个神经元，用于映射层、编码层和解映射层。根据所提超参数优化（参见Sect.
    2.3.4.1），在此过程中仅需要确定迭代算法中的迭代次数（即停止条件）。图4.14指示了使用10次试验对示例神经网络所获得的准确度。如所观察到的，第七个示例提供了接近100%的最佳准确率。因此，用于数据归一化的DTL算法需要七个DAEs。在这方面，输入到第一个DAE的第一个输入是实际的增强训练数据X，其余输入（E_x1,
    ..., E_x6）输入到接下来的六个DAE中，是前一个DAE的每个输入和输出之间的残差样本。


