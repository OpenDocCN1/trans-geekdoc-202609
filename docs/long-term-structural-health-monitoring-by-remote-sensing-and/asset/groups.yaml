    随后，两种混合方法得到的最终模型用于在线损伤检测。与其他所提技术相比，这些方法的一个优势是不需要基于训练和测试数据点新奇性指标与阈值比较的经典特征判别和损伤检测。简单来说，HMC-ODTL-EMD
    或 SLS-ODTL-EMD 的每个输出都有助于我们对任何图像做出决策。另一方面，无需以离线方式收集一些信息（图像），然后开发无监督学习器来进行损伤评估。在所提出的混合方法中，可以以在线或实时方式分析结构的状态。值得注意的是，从第一阶段（在线学习）转移到第二阶段（在线损伤检测）意味着结构中已发生损伤。


