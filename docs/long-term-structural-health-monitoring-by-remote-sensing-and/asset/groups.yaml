    # # Chapter 2

    Advanced MIL Methods: Bridging SAR Images and Structural Health Monitoring


    **Abstract** The classical SAR-aided SHM directly analyzes displacement data obtained
    from SAR images. Although the extraction of displacement responses from SAR images
    via various interferometric techniques is of paramount importance to remote sensing-based
    SHM, the direct use and analysis of SAR-based displacement responses for monitoring
    and damage assessment of complex and critical civil structures is not a reliable
    and effective approach, especially in long-term monitoring with various uncertainties
    and variability in measured data. On this basis, this chapter proposes various
    machine learning methods in terms of unsupervised learning for SHM under environmental
    and operational conditions and different types of structural displacement responses
    retrieved from SAR images in terms of their sizes. In case of a large set of displacement
    data, an innovative probabilistic unsupervised learning method is proposed. For
    a small set of displacement data, this chapter proposes two unsupervised hybrid
    learning methods and mainly consists of three parts of data augmentation for expanding
    the size of small displacement responses, data normalization for removing the
    effects of environmental and operational conditions, and anomaly detection.


    **Keywords** Machine learning · Unsupervised learning · Hybrid learning · Online
    learning · Data normalization · Markov Chain Monte Carlo · Anomaly detection


    # ## 2.1 Introduction


    Most of the SHM programs via remote sensing are based on direct analyses of structural
    displacements retrieved from SAR images. Although this strategy is simple and
    efficient, it may not be reliable and effective for damage assessment of important
    and complex civil structures under EOCs (Behkamal et al. 2023a, b). To address
    the major limitations and shortcomings of this strategy, this book intends to
    propose more rigorous methods for health monitoring of civil structures, with
    the focus on bridges, by the same SAR images and displacement data used in the
    classical SAR-aided SHM technique. On this basis, depending upon the size of displacement
    data, this book'
  - '[PAGE 43]


    proposes two types of innovative methods for SHM under relatively large data and
    small data. In this regard, the proposed NNS-EVT is developed to assess the health
    of civil structures by considering a relatively large displacement set. Although
    the preparation of a large number of SAR images may encounter the Big Data problem
    and storage limitations, some research studies exploited many images for SHM tasks
    (Farneti et al. 2022; Bayik et al. 2021; Militello et al. 2016). The great advantage
    of the proposed probabilistic machine learning method is to simultaneously deal
    with the challenges of variability in measured (displacement/deformation) data
    and reliable feature discrimination by a new novelty index or damage indicator.
    Therefore, Sect. 2.2 describes this method. One of the great advantages of the
    proposed probabilistic method is its capacity for developing various anomaly detectors
    based on different extreme value distributions. However, in this book, the proposed
    methodology is based on the semi-parametric concept of the EVT and the quantile
    modeling of the semi-parametric extreme value distribution.


    For the SAR-aided SHM applications with a small number of images, leading to few
    displacement data, this book mainly concentrates on this challenge by proposing
    various offline and online hybrid learning methods; that is: (i) HMC-MD, (ii)
    HMC-DAE-MD, (iii) HMC-UTSL-MD, (iv) HMC-DTL-MD, (v) HMC-ODLT-EMD, and (vi) SLS-ODLT-EMD.
    Accordingly, Sects. 2.3 and 2.4 fully describe the offline and online hybrid learning
    methods, respectively, along with some hyperparameter optimization algorithms
    needed for learning these techniques.


    # 2.2 Tackling Big Data Challenges: A Probabilistic Unsupervised Learning Method


    The proposed probabilistic machine learning method called NNS-EVT aims to perform
    a long-term SHM process when the size of data is relatively large. The main elements
    of this method consist of a feature selection approach based on NNS and a novelty
    detector under the extreme value machine (EVM) and semi-parametric EVT. The feature
    selection approach is based on the nearest neighbor search for choosing the most
    appropriate and relevant samples, called representative features. For this reason,
    this step can be considered as a dimensionality reduction strategy and also a
    data normalization method. The second element of the proposed machine learning
    method is to propose a novelty detector for distinguishing normal samples, regarding
    the undamaged condition of the structure, from abnormal ones, associated with
    the possibly damaged state. In this method, a novel probabilistic method is proposed
    by considering the concepts of the EVT, semi-parametric extreme value distribution,
    and quantile modeling.'
