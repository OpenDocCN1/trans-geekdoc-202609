    (SLC), ground range detected (GRD), Raw images, bands, polarizations, orders (i.e.,
    descending or ascending), etc.

    - Applying interferometric methods such as InSAR, DInSAR, SqueeSAR, etc. to extracting
    displacement data points

    - Analyzing displacement data for SHM.¹


