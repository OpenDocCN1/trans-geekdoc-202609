    realize the aim and scope of this book. In the following, brief descriptions of
    all proposed methods have been presented. Eventually, the major innovations of
    this work have been disclosed properly. With these descriptions and literature
    reviews discussed in this chapter, one can conclude that the classical SAR-aided
    SHM techniques may not provide reliable frameworks for damage assessment of large-scale
    civil structures by directly analyzing displacement data. For long-term monitoring
    programs via SAR images, it is essential to develop robust machine learning techniques
    for alleviating the negative effects of the EOCs.


