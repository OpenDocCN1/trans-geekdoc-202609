    ## 第5章 结构健康监测的结论与展望


    **摘要** 在本书中，已试图解决基于遥感技术和机器学习的土木结构长期健康监测相关的一些主要挑战性问题。为此，提出了各种无监督学习方法，以利用从 SAR 图像中获得的小规模和大规模位移响应集，检测土木结构在未知环境与运行条件（EOCs）下的任何异常状况。本章旨在阐述所提方法在数值验证和实验验证阶段的主要结论。鉴于结构健康监测（SHM）的重要性及遥感技术的优势，本文为未来研究活动提出了一些进一步评估的建议。


    **关键词** 长期健康监测 • 结论 • 环境与运行变化 • 遥感 • 机器学习


    ### 5.1 引言


    本研究的主要动机是改进经典的 SAR 辅助结构健康监测，并解决该过程的主要局限性。在此基础上，开发了以无监督学习模式为特征的新型混合方法，旨在在未知且不可预测的环境与运行条件（EOCs）下报警任何异常变化和损坏（尤其是坍塌）。在应用相对较大的位移数据时，本研究提出了一种基于最近邻搜索（NNS）和极值理论（EVT）的混合概率无监督学习方法。当仅有少量位移样本时，所提混合学习方法通过哈密顿蒙特卡洛（HMC）或切片采样（SLS）技术进行数据增强，采用不同的基于去噪自编码器（DAE）的新颖数据归一化方法，并利用马氏距离（MD）和经验模态分解（EMD）进行特征判别。在针对小数据的混合学习方法的第二部分，本研究利用了深层和浅层配置的各种自编码器（AE）。在
    HMC-DAE-MD 方法中，考虑了三隐藏层去噪自编码器的直接应用，以减轻增强数据中环境与运行条件（EOCs）的影响。为此目的，开发了一种侧重于解决 EOC
    挑战的超参数优化。在 HMC-UTSL-MD 方法中，提出了一种新的 UTSL 算法，该算法基于具有七个隐藏层的欠完备去噪自编码器（用于教师模型学习）和过完备浅层自编码器（用于学生学习模型）。设计了一种新的超参数优化，以确定去噪自编码器的七个隐藏层和浅层自编码器的唯一编码层的神经元数量。所提
    HMC-DTL-MD 方法充分利用了迁移学习的思想，考虑了具有预定义 10、2 和 10 个神经元的去噪自编码器，分别用于映射、编码和解映射层。对于该技术，设计了一种迭代超参数优化，以查找连续去噪自编码器的数量。由于上述混合方法的核心集中在离线学习的思想上，本研究试图提出两种在线学习方法。因此，本书还建议了
    HMC-ODTL-EMD 和 SLS-ODTL-EMD 方法，用于实时结构健康监测。这些方法的主要改进在于 DLT 算法，该算法被改进为其在线版本（ODLT），用于数据归一化，并利用经验模态分解（EMD）进行特征判别。


    为验证所提方法的有效性和可靠性，考虑了两个全尺寸桥梁结构。对于 NNS-EVT 和 HMC-MD 方法，基于 I-40 桥位移点模拟进行了数值研究。此外，通过使用与塔加斯特桥（Tadjaster
    Bridge）相关的少量位移数据点，对其他方法进行了现实世界案例研究验证。这些数据点从有限数量的 TerraSar-X 合成孔径雷达图像中提取。


    ### 5.2 主要结论


    基于专著中展示的广泛研究，很明显，传统的直接位移数据分析对土木结构（特别是长期结构健康监测）的健康监测是次优的。数据变化的不可预测性和固有的不确定性使得这些常规技术不适合可靠和长期的分析。相比之下，本专著中所提方法解决了这些挑战，并提供了基于机器学习的创新替代方案。


    NNS-EVT 和 HMC-MD 方法在低变异性条件下表现良好。对于较大的数据集，NNS-EVT 是一种有效的方法。然而，在高水平环境与运行变化（EOCs）的影响下，HMC-MD
    方法显示出局限性，强调了数据归一化在获得可靠结果中的关键作用。这为混合无监督学习方法的引入奠定了基础，这些方法结合了数据采样、人工智能和统计分析。


    本专著强烈推荐哈密顿蒙特卡洛（HMC）和切片采样（SLS）等数据增强技术用于较小的位移样本，以更好地理解环境与运行条件（EOCs）对结构响应（即位移）的影响。尽管两种方法都展示了考虑
    EOCs 的能力，但 HMC 在通过箱线图（Box plot）进行图形比较评估时表现出更优性能。尽管如此，当基于马氏距离（MD）度量进行数值评估时，HMC
    和 SLS 均被证明有效。因此，建议在 EOCs 评估中考虑基于中位数绝对偏差（MAD）的数据分析。


    先进的混合方法，如 HMC-DAE-MD 和 HMC-UTSL-MD，在应对环境与运行条件（EOCs）挑战性方面展示了其鲁棒性。HMC-DAE-MD 方法能够通过在正常和损坏条件之间获取判别性新奇指数来应对
    EOCs 挑战。可以看出，去噪自编码器辅助的数据归一化及其超参数优化最大限度地减少了 EOCs 的影响。在这方面，该方法优于 HMC-MD。


    在考虑基于中央极限定理（CLT）和极值理论（EVT）的两个阈值估计器时，人们发现与基于 CLT 的技术相比，HMC-DAE-MD 通过极值理论辅助的阈值确定器给出了更少的假阳性。尽管该方法在极值理论辅助下比中央极限定理产生更多的假阴性，但其输出是合理的。总体而言，极值理论辅助的阈值确定器优于基于中央极限定理的技术。然而，它包含更多细节和参数，在这种情况下，基于中央极限定理的阈值确定器更高效。


    增加另一层复杂性和有效性，HMC-UTSL-MD 和 HMC-DTL-MD 方法在结构损坏早期检测方面取得了显著结果，即使在高水平环境与运行条件（EOCs）下也是如此。HMC-UTSL-MD
    中所提的基于 UTSL 的数据归一化相比于 HMC-DAE-MD 和 HMC-MD 更好地最大限度地减少了环境与运行条件（EOCs）的影响。为了实现这一目标，HMC-UTSL-MD
    成功地通过中央极限定理辅助的阈值确定器准确检测早期损坏或预测坍塌的发生。所提 HMC-DTL-MD 方法通过具有预定义神经元的三个隐藏层的去噪自编码器和迁移学习概念，能够更好地解决环境与运行条件（EOC）问题。即使在经典标准置信区间下，该方法也产生了较低的假阳性和误分类错误率。


    最后，所提在线混合学习方法不仅以在线学习方式设计了一种新的结构健康监测策略，而且通过停止学习过程并准确检测损坏出现和预测部分坍塌，提供了损坏早期检测的合理结果。在线混合方法在事件发生前合理地触发了损坏和坍塌风险的发生。


    总之，本专著对长期结构健康监测提供了全面而严谨的调查，整合了遥感和机器学习技术的见解。通过批判性地评估常规方法的局限性，这项工作引入了代表土木结构（特别是长期结构健康监测）健康监测领域显著进步的开创性方法。


