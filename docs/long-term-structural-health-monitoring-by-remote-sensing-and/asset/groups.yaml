    monitoring/inspection phases (Entezami et al. 2020d; Entezami et al. 2021). The
    main objective is to learn an automated computational model via training data
    in the first phase and then assess the current structural condition in the second
    phase via test data and the learned model. According to the concept of machine
    learning, these steps can be carried out by supervised learning and unsupervised
    learning techniques. In the context of SHM, supervised learning refers to the
    technique that requires fully labeled data from both the normal/undamaged and
    damaged conditions. In other words, one needs to prepare damage-sensitive features
    of both conditions in order to learn a classifier (i.e., the computational model
    in supervised learning) for classifying new features (test samples) and predicting
    their labels. On the contrary, unsupervised learning depends only on the features
    of the normal conditions; hence, one attempts to evaluate the status of the current
    state of the structure using new features (test data) by a novelty (anomaly) detector
    (i.e., the computational model in unsupervised learning). An important note is
    that the preparation of fully labeled data in the problem of health monitoring
    of civil structures is not only difficult, time-consuming, and labor-intensive,
    but also illogical. This is because there is no justification to impose intentional
    damages on complex and vital civil structures in order to prepare limited and
    controlled damaged data (e.g., the SHM problems of the Z24 and S101 Bridges Maeck
    and De Roeck 2003; Döhler et al. 2014). To cope with this limitation, in some
    case, one can construct the numerical model of the real structure and simulate
    various damage patterns to provide damaged data (Figueiredo et al. 2019; Torzioni
    et al. 2022; Daneshvar et al. 2023a; Entezami et al. 2020c). However, the major
    obstacle to perform this approach pertains to the inevitable differences between
    the numerical and real modes due to idealization, simple assumptions, wrong modeling,
    and noisy data. In this case, finite element model updating is mandatory (Ereiz
    et al. 2022; Rezaiee-Pajand et al. 2021, 2020), which may impose additional challenges.
    Therefore, one can realize that unsupervised learning is a better solution to
    SHM of civil structures.


