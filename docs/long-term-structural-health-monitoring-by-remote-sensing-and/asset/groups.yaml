    conclusion emphasizes the importance of measuring futher and other EOC conditions.
    All the aforementioned studies confirm the negative point of the EOCs that these
    conditions can lead to alterations in any structure similar to damage. Under such
    circumstances, false positive (Type I) and false negative (Type II) are two major
    errors that are directly relevant to the economic and human losses, respectively
    (Giglioni et al. 2021). In the context of SHM, false positive makes sense that
    the structure is undamaged but the SHM method incorrectly alarms the occurrence
    of damage. By contrast, false negative means that the structure suffered from
    damage but the method of interest does not alarm the occurrence of damage. Therefore,
    since the EOCs are inevitable in real-world SHM projects, it is indispensable
    to discard any variability from features.


    Removal of the effects of EOCs in SHM is often carried out by data normalization
    techniques (Farrar and Worden 2013: Chapter 12; Wang et al. 2022). Generally,
    there are two kinds of data normalization techniques called input–output and output-only
    frameworks. The first approach is based on entire information about the structural
    response/damage-sensitive features and variability data (e.g., temperature). Indeed,
    this technique is dependent on the regression problem. In this regard, Hu et al.
    (2016) compared different regression models such as multiple linear regression,
    polynomial regression model, and principal component regression by using modal
    data as the main damage-sensitive feature (i.e., output) and temperature data
    (i.e., input). Dervilis et al. (2015) proposed a robust regression model as a
    least trimmed square estimator to remove the influence of temperature-induced
    variations in an input–output framework, where the input and output were the temperature
    data and modal frequencies, respectively. Ferreras-Alcover et al. (2015) utilized
    a weighted least squares regression model to eliminate daily-averaged pavement
    temperature variations from vibration responses (stain data) of a bridge. Buckley
    et al. (2021) proposed a dynamic harmonic regression time-series model to detect
    damage in a bridge by considering the temperature as the environmental data (input)
    in the regression model. From these references, one can realize that the implementation
    of an input–output data normalization technique depends on the measurement of
    environmental and/or operational data and the consideration of a regression model
    for defining the relationship between structural responses and variability data.
    Nonetheless, the major drawback of the input–output technique returns its dependency
    on measuring the variability data. In most cases, environmental data, particularly
    temperature, is the main information. However, as Meas et al. (2022) indicated,
    the output data (i.e., structural responses or damage-sensitive features) can
    be influenced by other variability conditions, which differ from those are measured.
    Thus, the development of an output-only data normalization method can ignore this
    limitation.


    Totally, the output-only data normalization depends on the structural responses
    (measured data) and damage-sensitive features without any information about the
    variability data. In other works, an output-only approach aims to find the variability
    pattern in the data/features and develop a more robust and rigorous strategy than
    the input–output framework for removing the EOCs. In most cases, this strategy
    can be implemented by statistical and artificial neural networks (ANNs) algorithms.
