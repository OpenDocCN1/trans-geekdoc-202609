    已提到，所提出的在线混合方法 HMC-ODTL-EMD 和 SLS-ODTL-EMD 为同时进行数据归一化和特征判别提供了绝佳机会。在数据归一化步骤中，关键动机是通过所提出的
    ODTL 方法开发一个在线模型，ODTL 是先前提出的 DTL 算法的在线版本。根据图 2.12，ODTL 的第一阶段从在 β = 20% 下使用第一张图像的第一组增强位移（X1）开始。为
    β 选择该百分比意味着，当误正率大于 20% 时，ODTL 的在线学习会拒绝结构处于健康状态的假设。换句话说，如果特定日期的任何 SAR 图像及其增强位移数据使误正率（百分比）大于该数值，则该结构很可能在该日期遭受了损伤。


    在这方面，图 4.17 说明了连续应用 SAR 图像及其增强位移数据时误正率百分比的演变。请注意，ODTL 的迭代算法中考虑了 10 个样本神经网络。如图
    4.17 所示，在接收图像 #44 之前，先前图像的误正率（百分比）均小于 β。在某些情况下，误正率为零，尤其是在图 4.17b 中。但是，一旦使用了图像
    #44 及其来自 HMC 和 SLS 的增强位移数据集，误差率就超过了 β，这意味着在线学习和更新 DAE 应结束，而在线损伤检测通过接收任何新数据继续该过程，新数据应被视为测试数据。因此，在第
    43 次迭代中更新的 DAE 被选为用于在线损伤检测的最后更新网络。另一方面，HMC-ODTL-EMD 和 SLS-ODTL-EMD 每次迭代中连续 DAE
    的最优数量如图 4.18 所示。例如，可以在图 4.18a 中观察到，与图像 #43 相关的第 43 次迭代的最后更新模型在 HMC-ODTL-EMD 算法中需要六个连续的
