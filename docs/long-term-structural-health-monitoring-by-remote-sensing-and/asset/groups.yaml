    optical fibers, etc.) (Wang et al. 2014b; a) to non-contact-based sensors (Feng
    and Feng 2018). Although the use of non-contact sensing technology via common
    and accessible devices (e.g., commercial cameras, video devices, smartphones,
    etc.) is prevalent in academic and industrial SHM activities (Sony et al. 2019;
    Dong and Catbas 2021), some limitations do not allow civil engineers and researchers
    to achieve reasonable outcomes. One of them is that this type of sensing technology
    cannot provide a simple routine for monitoring of large-scale structures. On the
    other hand, pre-collapse investigation of some vital structural systems such as
    bridges and dams constructed in large-scale areas may be problematic. This limitation
    becomes worse in continuous long-term SHM programs. Apart from these limitations,
    the great obstacle to easily apply non-contact sensors for SHM applications is
    the devoid of rich information about initial undamaged states of many constructed
    civil structures. Even though, the optimal sensing technology has brought an important
    opportunity to detect surface damages (e.g., concrete crack Kim et al. 2019; Kang
    et al. 2020; Dung and Anh 2019) and spalling (Cao et al. 2021; Dawood et al. 2017),
    steel corrosion (Yao et al. 2019), fatigue cracks (Dung et al. 2019; Kong and
    Li 2018; Xu et al. 2019), etc.), some important damage patterns are not simply
    visible. In order to cope with these limitations, synthetic aperture radar (SAR)
    images acquired from remote sensing from space and satellites has brought a new
    technology for health assessment of civil structural systems. The great benefits
    of the SAR-aided SHM include but are not limited to:


    - Evaluating large-scale structural systems in wide regions without any concern
    about sensor placement, deployment, and installation

    - Accessing initial information of undamaged states of civil structures

    - Observing wide zones around civil structures

    - Capturing SAR images in the presence of clouds and tough weather

    - In general, a SAR-aided SHM strategy is divided into three main parts:

    - Selecting the types of satellites such as Sentinel-1, COSMO-SkyMed, TerraSAR-X,
