  md: 'may be time-consuming and complex. In order to develop an efficient and effective
    SAR-aided SHM strategy, this section proposes a new deep transfer learning (DTL)
    method under consecutive DAEs. In machine learning perspective, transfer learning
    is an improvement of a learning process in a new task via the transfer of knowledge
    from a related task that has been learned previously (Yang et al. 2020). In other
    words, in the new domain, it is not necessary to implement the same steps of the
    source domain or estimate new parameters. Instead, one can apply all or part of
    the information of the source domain in the new domain. A well-known example is
    the application of some popular deep neural networks with high general performances
    to other engineering fields (Gao and Mosalam 2018; Azimi and Pekcan 2020).


    Having considered this concept in machine learning, the fundamental principle
    of data normalization in HMC-DTL-MD is to exploit the concept of transfer learning
    and ignore a rigorous hyperparameter optimization for obtaining the neurons of
    the hidden layers. The key idea of the proposed DTL is that an undercomplete three-hidden-layer
    DAE (L = 1), see Fig. 2.6a, with pre-determined neurons for the mapping, encoding,
    and de-mapping layers suffices to eliminate the EOC effects without any hyperparameter
    optimization. In other words, the main intention of proposing the DTL is to ignore
    determining the neurons of the DAE hidden layers. According to Kramer''s recommendation
    (Kramer 1991; Figueiredo et al. 2011), it is feasible to exploit an undercomplete
    DAE containing 10, 2, and 10 neurons for the mapping, encoding, and de-mapping
    layers in order to mitigate the influences of the


    Fig. 2.10 The undercomplete DAE in the proposed DTL algorithm containing 10, 2,
    and 10 neurons for the mapping, encoding, and de-mapping layers


    ![](img/3d323f4db48c9242205a3db747902f6d_70_0.png)'
