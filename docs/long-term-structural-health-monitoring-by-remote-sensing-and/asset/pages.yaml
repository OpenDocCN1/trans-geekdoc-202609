  md: '# About the Authors


    **Prof. Alireza Entezami** has been an Assistant Professor in the Department of
    Civil and Environmental Engineering (DICA) at Politecnico di Milano, Italy, since
    November 2022. His current role also includes co-supervision of a research project
    granted by the European Space Agency (ESA), which employs data mining and machine
    learning techniques for monitoring the structural integrity of large infrastructures
    using earth observation.


    Prior to joining the DICA department as a faculty member, he was a postdoctoral
    research fellowship selected by ESA, working in the DICA at Politecnico di Milano
    since May 2021. In April 2020, He received a Ph.D. in Structural, Seismic, and
    Geotechnical Engineering from Politecnico di Milano with *Cum Laude* degree. In
    addition, He holds a Ph.D. in Civil Engineering—Structure from Ferdowsi University
    of Mashhad with Summa *Cum Laude* degree. In September 2014, he obtained the M.Sc.
    in the same discipline from Ferdowsi University of Mashhad with *Summa Cum Laude*
    degree.


    He has a history of securing substantial research funds and fostering collaborations
    across the academia and industry. Notably, he was awarded a three-year postdoctoral
    fellowship by the European Space Agency. He also won two medals for one of his
    inventions regarding a structural smart portable device dealing with structural
    health monitoring problem, at the IWIS exhibition, supported by the International
    Federation of Inventors’ Associations. Furthermore, the European Commission (EC),
    Horizon Europe Program has supported his research, selected by NGI Enrichers and
    the Agency for the Promotion of European Research (APRE), to implement his approved
    research proposal.


    His research interests span from model-driven structural damage detection to data-driven
    structural health monitoring, with the focus on large civil infrastructures. Most
    of his research activities focus on artificial intelligence, machine learning,
    statistical pattern recognition, deep learning, image processing, big data analytics,
    information fusion, time series analysis, and remote sensing. His research has
    resulted in 41 international journal papers, 21 conference proceedings, 8 book
    chapters, and two book publications in Springer.'
