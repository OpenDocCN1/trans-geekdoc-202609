  md: '# Chapter 4

    From Theory to Reality: Advanced SHM Methods to the Tadcaster Bridge


    **Abstract** Experimental validation of SHM methods is a critical process in evaluating
    the accuracy and reliability of such methods for damage assessment, especially
    in long-term monitoring programs. In this chapter, real-world applications of
    the proposed unsupervised learning methods (i.e., HMC-DAE-MD, HMC-UTSL-MD, HMC-DTL-MD,
    HMC-ODTL-EMD and SLS-ODTL-EMD) developed for coping with the limitation of small
    data are investigated by using a small set of displacement responses of a masonry
    bridge called the Tadcaster Bridge located in Tadcaster, UK. Because this bridge
    experienced a partial collapse, it is an appropriate case study for verifying
    the proposed methods. This chapter also indicates how a data augmentation process
    can help to better observe the EOCs in augmented displacement responses.


    **Keywords** Pre-collapse detection • Masonry bridge • Small data • Data augmentation
    • Machine learning • Unsupervised learning


    # 4.1 The Tadcaster Bridge: A Masonry Bridge


    The real-world application of the other proposed methods is based on the valuable
    small displacement dataset of the Tadcaster Bridge, Tadcaster, UK (Selvakumaran
    et al. 2018). For some important reasons, we believe that this dataset provides
    the best condition for validating the proposed methods. The major motives for
    considering this structure are: (i) it brings a realistic condition of a partial
    collapse event in a real structure, (ii) the sample displacement data comes from
    a continuous long-term monitoring plan, (iii) similar to the installation of contact-based
    sensors, appropriate target points were incorporated and distributed to extract
    the displacement points.'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'This structure is a famous masonry bridge with seven piers belonging to the
    date around 1700 (i.e., built between 1698 and 1699 based on documentary evidence).
    The bridge crosses the “River Wharfe” in the town Tadcaster, North Yorkshire,
    UK and connects the Tadcaster to the town York. The transportation characteristic
    of this bridge is based on carrying a single lane of vehicles at each way and
    a pedestrian corridor on each side. The main dimensions of the Tadcaster Bridge
    include the length of roughly 100 m and the width of 10 m. The present structure
    of the Tadcaster Bridge consists of joining two structures in different dates.
    This scenario was considered to develop the width the elderly bridge. Floods are
    the main events that endanger the safety and integrity of the Tadcaster Bridge.


    Due to the historic form of this bridge and the devoid of installing any SHM system
    for intelligent monitoring, visual inspections via divers were conducted to evaluate
    the scour in the bridge piers and observe the movement of the river bed. Nevertheless,
    the Tadcaster Bridge suffered from a partial collapse on 29 December 2015 after
    a flood caused by Storm Eva. Figure 4.1a, b displays actual pictures of the collapsed
    zone of this bridge. After a major reconstruction and widening, the Tadcaster
    Bridge reopened to traffic on 3 February 2017. Figure 4.1c displays the retrofitted
    structure of this bridge. Recently, Selvakumaran et al. (2018) studied on this
    structure by taking advantage of remote sensing and considering a few SAR images
    for continuous long-term SHM. The main objective of their research was to extract
    displacement samples from these images and directly analyze them. As the occurrence
    of partial collapse in a structure is often a rarity, the Tadcaster Bridge is
    a proper case study for further research on SHM by advanced machine learning methods,
    which is considered in this research.


    Before the partial collapse, 45 SAR images from TerraSAR-X between 9 March 2014
    to 26 November 2015 were captured to extract a limited number of displacements
    at eight target areas for a roughly one-year monitoring program. The last image
    belonged to 26 November 2015, approximately one month before the partial collapse.
    Therefore, the extracted displacement samples and the outputs of the machine learning
    method in this book can significantly help authorities and bridge’s owners to
    avoid catastrophic and economic losses caused by any collapse. Applying the SAR
    images, the DInSAR methodology and Small Baseline Subset (SBAS) technique were
    applied to extract 45 displacement samples at eight points labeled as “P1”, “P2”,
    “P3”, “P4”, “P5”, “P6”, “P7”, and “P8”. Figure 4.2 illustrates the locations of
    these target points in an image of the Tadcaster Bridge. It should be clarified
    that the point “P2” is the partial collapse location (Selvakumaran et al. 2018).
    In this case, the other points refer to the undamaged regions of the bridge. Moreover,
    Fig. 4.3 displays the extracted displacements of the eight points.'
