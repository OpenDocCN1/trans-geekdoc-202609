- pgno: 31
  md: '+   • Category II—Innovations for dealing with the challenge of novelty indices


    **Category I**: Although HMC and SLS are well-known Markov Chain Monte Carlo algorithms
    for the generation of random samples, the first parts of the proposed hybrid learning
    methods exploit these algorithms for expanding the small displacement data. The
    important innovation of data augmentation via HMC and SLS is that this process
    not only expands the small set of displacements but also reveals the variability
    in extracted displacement data samples better than the original data. In this
    case, it is possible to better analyze the level of variability and decide whether
    data normalization is needed or it can be ignored it.


    **Category II**: Without any doubt, one can declare that the great innovations
    of the proposed hybrid learning method are related to various novel data normalization
    algorithms. The central core of data normalization is based on deep and shallow
    AEs, especially DAEs. As the first innovation, the proposed hybrid learning technique
    called HMC-MD is developed by adding an undercomplete DAE with three hidden layers
    for data normalization. The key novel part of this process is to propose a hyperparameter
    optimization for finding the optimum neuron numbers of the three hidden layers
    of the undercomplete DAE with the focus on alleviating the negative effects of
    the EOCs. Although different hyperparameter optimization algorithms such as cross-validation
    are appilable, this book suggests a new algorithm based on an engineering justification;
    that is, the removal or reduction of the EOC influences. On this basis, the hyperparameters
    obtained from this algorithm allow the undercomplete DAE to exclusively address
    the challenge related to the EOCs. Concentrating on this challenge, this book
    proposes the other data normalization method based on the concept of teacher-student
    learning. Even though this concept is well-known, we develop two novel ANNs for
    creating teacher and student models in an unsupervised learning fashion. The key
    innovative part of the second data normalization method is related to proposing
    an undercomplete DAE with seven hidden layers as the teacher model and an overcomplete
    shallow AE as the student model. In other words, the proposed data normalization
    method creates **a novel hybrid ANN** strategy. The other innovation of this method
    is to propose a new hyperparameter optimization for selecting the neuron numbers
    of the seven hidden layers of the DAE and the encoding layer of the shallow AE.
    In the following, the other data normalization method is proposed by taking advantage
    of the idea of transfer learning (Yang et al. 2020; Weiss et al. 2016). Unlike
    the other well-known transfer learning algorithms, which mainly rely upon supervised
    deep neural networks in the configuration of convolutional neural networks (Dhillon
    and Verma 2020), this book suggests a novel deep transfer learning algorithm that
    is based on an individual ANN in terms of an undercomplete three-hidden-layer
    DAE. The key novel part of the third data normalization method is to design an
    iterative algorithm using consecutive DAEs. For this algorithm, the other hyperparameter
    optimization is suggested to find the optimum number of consecutive DAEs without
    any effort for selecting the neuron numbers. In order to take advantage of the
    capacity of online learning for real-time SHM, this book provides the other innovation
    in data normalization. In this regard, an online deep transfer learning method
    is proposed to extend the previously proposed deep transfer learning. The'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'great innovation of this online learning method is to develop a novel two-stage
    algorithm by using the undercomplete three-hidden-layer DAE. The other innovation
    of this method pertains to its learning and damage detection mechanisms that are
    entirely different from the previously proposed hybrid learning techniques, all
    of which are based on offline learning strategies. In this regard, the termination
    of the first stage of the online hybrid learning is representative of the occurrence
    of damage, which brings a great innovation in SHM.


    **Category III.** The underlying goal of an SHM process is to determine the difference
    between at least two structural state conditions (i.e., an undamaged state versus
    a current state, which can be undamaged or damaged). Accordingly, one should only
    find the discrepancy between these conditions via various novelty detectors (Sarmadi
    and Karamodin 2020; Sarmadi and Yuen 2021, 2022; Daneshvar and Sarmadi 2022; Entezami
    et al. 2020d; Bigoni and Hesthaven 2020; Turrisi et al. 2022) or statistical distance
    metrics (Deza and Deza 2013; Entezami 2021; Entezami and Shariatmadar 2018; Entezami
    et al. 2022d, e). The main objective of these methods is to yield discriminative
    novelty indices or damage indicators for discriminating the possible damaged state
    from the undamaged one. Having considered a relatively large displacement data
    points, this book initially proposes a probabilistic novelty detector with the
    aid of the NNS, EVT, and quantile modeling. The great innovation in this methodology
    (NNS-EVT) is to define a new probabilistic novelty index that is a quantile value
    from some extreme samples. One of the great benefits of this methodology is that
    one can develop different novelty detectors by using various extreme value distribution
    models, their quantile values, and two different techniques for extreme value
    modeling, that is, block maxima and peak-over-threshold. This means that although
    the NNS-EVT presents a single algorithm for novelty detection, it is possible
    to use it with different extreme value distributions and frameworks. In relation
    to small displacement data, although the proposed hybrid learning methods in offline
    manners (i.e., HMC-MD, HMC-DAE-MD, HMC-UTSL-MD, and HMC-DTL-MD) utilize the tried-and-tested
    Mahalanobis distance metric, the online hybrid learning methods (i.e., HMC-ODTL-EMD
    and SLS-ODTL-EMD) propose a new novelty index. The key innovation pertains to
    the mechanism of deriving a univariate distance value from a multivariate distance
    metric.


    # 1.5 Organization of This Book


    The organization of this book can be described as follows. Chapter 2 presents
    the full discussions of all proposed methods. In Chap. 3, the proposed NNS-EVT
    and HMC-MD techniques are evaluated and verified by a numerical model of a full-scale
    bridge. In this numerical study, the displacement data is simulated by a finite
    element method. To validate the other proposed methods, Chap. 4 presents a real-world
    civil structure with a realistic partial collapse. For this reason, small displacement
    data points extracted from limited SAR images are used to verify the proposed
    hybrid'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'learning methods via real-world data. Eventually, the conclusions of this book
    along with some suggestions for further research are mentioned in Chap. 5.


    # 1.6 Chapter Summary


    This chapter has aimed to present the introduction to health monitoring of civil
    structures by using the technology of remote sensing and SAR images. The main
    focus has been on the collapse phenomenon. After mentioning the advantages of
    the SAR-aided SHM by remote sensing, the major challenges and limitations in this
    strategy have been discussed in detail. For better explanation, the main motivations
    for conducting this book have been mentioned, which highly aid readers to better
    realize the aim and scope of this book. In the following, brief descriptions of
    all proposed methods have been presented. Eventually, the major innovations of
    this work have been disclosed properly. With these descriptions and literature
    reviews discussed in this chapter, one can conclude that the classical SAR-aided
    SHM techniques may noy provide reliable frameworks for damage assessment of large-scale
    civil structures by directly analyzing displacement data. For long-term monitoring
    programs via SAR images, it is essential to develop robust machine learning techniques
    for alleviating the negative effects of the EOCs.


