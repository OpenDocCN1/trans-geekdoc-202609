    # 2.3.3.1 Hyperparameter Optimization of UTSL


    The proposed UTSL methods consists of two AE networks with different configurations.
    In these neural networks, the only hyperparameters are the neurons of the seven
    hidden layers of the undercomplete DAE and the single encoding layer of the overcomplete
    shallow AE. Recently, Entezami et al. (2020) proposed an effective algorithm based
    on a controlled grid search for finding the neuron numbers of an AE based on the
    reconstruction error of the network training and the final prediction error (FPE)
    function. Inspired by that technique, this research takes advantage of the Akaike
    information criterion (AIC) for hyperparameter optimization of the teacher and
    student models. In this regard, Table 2.1 lists the sample neuron numbers for
    the hidden layers of the undercomplete DAE.


    Using these sample neurons, it only suffices to design ten different undercomplete
    DAEs and implement the first step of the proposed UTSL algorithm regarding the
    teacher model learning and calculate the sum of residual data points. Assume that
    \(N_{H_i}\) is the number of neurons of the \(i\)th hidden layer, where \(i =
    1, ..., 7\). On this basis, the AIC metric is written in the following equation:


    \(AIC = \ln(\varepsilon) + \frac{2N_v}{pn}\) (2.35)'
