  md: '# 2.3.1.1 Hamiltonian Monte Carlo Sampling


    The HMC sampling is a Markov Chain Monte Carlo technique for obtaining a sequence
    of random samples from a target probability distribution when the direct sampling
    process is intractable (Neal 2011). This method corresponds to an instance of
    the Metropolis–Hastings algorithm with a Hamiltonian dynamics evolution that can
    be simulated by using a time-reversible and volume-preserving numerical integrator
    to provide a move to a new sample. Unlike the Metropolis–Hastings algorithm, the
    HMC method decreases the correlation between successive sampled states by performing
    moves to far states that can provide a high probability of acceptance owing to
    having approximate energy conserving characteristics of the simulated Hamiltonian
    dynamic. Simply speaking, the reduced correlation makes sense that fewer Markov
    chain samples are required to approximate integrals with respect to the target
    probability distribution.


    Assume that \( f(\mathbf{x}) \) is the target distribution that is supposed to
    be sampled by using a chain of samples \( \{\mathbf{x}_0, \mathbf{x}_1, \mathbf{x}_2,
    ...\} \). Accordingly, the Hamilton’s equations are written in the following forms:


    ```

    \frac{\mathrm{d}x_i}{\mathrm{d}t} = \frac{\partial H}{\partial w_i} \quad (2.22)

    \frac{\mathrm{d}w_i}{\mathrm{d}t} = \frac{\partial H}{\partial x_i} \quad (2.23)

    ```


    where \( x_i \) and \( w_i \) denote the \( i \)th element of the parameter and
    momentum vector, respectively. Moreover, \( H \) refers to the Hamiltonian function.
    Suppose that \( \mathbf{M} \) is a symmetric and positive definite (mass) matrix.
    On this basis, the Hamiltonian is expressed as follows:


    ```

    H(\mathbf{x}, \mathbf{w}) = U(\mathbf{x}) + \frac{1}{2}\mathbf{w}^T \mathbf{M}^{-1}
    \mathbf{w} \quad (2.24)

    ```


    where


    ```

    U(\mathbf{x}) = - \ln f(\mathbf{x}) \quad (2.25)

    ```


    From Eq. (2.25), one can understand that the sampling method under the algorithm
    of HMC relies on the logarithmic function related to the target distribution.
    Moreover, this sampler exploits the leap-frog technique (Neal 2011), which is
    an approximate solution to the motion of non-interacting classical particles,
    to determine the parameter and momentum components at any time. For this purpose,
    the sampling algorithm needs a positive integer for the number of leap-frog steps
    \( L \) and a positive number for the step size \( \Delta t \). Subsequently,
    it draws a random Gaussian momentum \( \mathbf{w}(0) \) from a Gaussian distribution
    with zero mean and covariance equal to the mass matrix \( \mathbf{M} \). In the
    next step, the particle runs under Hamiltonian'
  merge: -1
  img_proc: true
- pgno: 56
  md: 'dynamics for time \(L\Delta t\). It should be noted that this procedure is
    carried out by the leap-frog technique by numerically solving the Hamilton''s
    equations. In this regard, the parameter and momentum vectors after time \(\Delta
    t\) are given by:


    \(\mathbf{w}\left(t + \frac{\Delta t}{2}\right) = \mathbf{w}(t) - \frac{\Delta
    t}{2} \nabla U(\mathbf{x})|_{\mathbf{x}=\mathbf{x}(t)}\) (2.26)


    \(\mathbf{x}(t + \Delta t) = \mathbf{x}(t) - \Delta t \mathbf{M}^{-1} \mathbf{w}\left(t
    + \frac{\Delta t}{2}\right)\) (2.27)


    \(\mathbf{w}(t + \Delta t) = \mathbf{w}\left(t + \frac{\Delta t}{2}\right) - \frac{\Delta
    t}{2} \nabla U(\mathbf{x})|_{\mathbf{x}=\mathbf{x}(t+\Delta t)}\) (2.28)


    The above-mentioned equations should be applied to \(\mathbf{x}(0)\) and \(\mathbf{w}(0)\)
    \(L\) times to determine \(\mathbf{x}(L\Delta t)\) and \(\mathbf{w}(L\Delta t)\).
    Let \(\mathbf{d} \in \mathbb{R}^{p \times 1}\) denotes a set of displacement points
    of \(p\) target points from a SAR image. Note that each \(\mathbf{d}\) is equivalent
    to \(\mathbf{x}\). On this basis, the underlying goal of the HMC sampler is to
    forecast the vector \(\mathbf{d}\) under \(C\) chains and \(N\) sample numbers.
    This means that the HMC technique makes attempt to generate \(N\) points of the
    vector \(\mathbf{d}\) from a target distribution (i.e., Gaussian distribution
    in this research) in an effort to make a set of augmented displacement points
    in a new matrix \(\mathbf{D} \in \mathbb{R}^{p \times N}\), under \(C\) chains
    in an iterative algorithm. In other words, for the \(j\)th chain and \(k\)th sample,
    where \(j = 1, ..., C\) and \(k = 1, ..., N-1\), one can derive an augmented matrix
    \(\mathbf{D}_{k+1}^{(j)}\). Using a hypothesis based on the Gelman-Rubin statistic
    (Gelman and Rubin 1992), if the statistic converges on the hypothesis criterion,
    one can fix the simulated parameter at the \((k + 1)\)th iteration; unless, one
    should choose the simulated parameter of the previous at the \(k\)th iteration.
    After determining all \(C\) augmented matrices, their average is used as the final
    set of the augmented displacement points. Eventually, the matrix of the augmented
    displacement points (**D**) is divided into the training set (matrix) \(\mathbf{X}
    \in \mathbb{R}^{p \times n}\) and test set (matrix) \(\mathbf{Z} \in \mathbb{R}^{p
    \times m}\), where \(n < N\) and \(m < N\).


    # 2.3.1.2 Slice Sampling


    The SLS is the other algorithm of Markov chain Monte Carlo for generating random
    data points on the basis of their previous states. The fundamental principle of
    the SLS lies in the idea that a random variable can be sampled uniformly from
    the area under the graph of a uniform probability distribution and then only observe
    the horizontal coordinates of the samples. For this purpose, one needs to construct
    a Markov chain that can meet the uniform distribution of interest via uniformly
    sampling from the vertical interval represented by the density at the current
    sample and from the union of intervals that comprises the horizontal slice.


    More precisely, the SLS originates from this idea that sampling from a distribution
    \(p(x)\), whose density is proportional to \(f(x)\), is comparable to uniformly
    sampling from the region under the graph of \(f(x)\). From a univariate viewpoint,
    it is possible'
  merge: -1
  img_proc: true
- pgno: 57
  md: 'to introduce an auxiliary variable (i.e., the height y) and define the joint
    distribution p(x, y), which is uniform over the region G = {(x, y): 0 < y < f(x)}.
    To sample from the marginal density for x (i.e., p(x)), it needs to sample from
    p(x, y) and then ignore the y values. Since the generation of random samples from
    p(x, y) is not tractable, it is necessary to define a Markov chain to enable us
    to converge to that distribution. Given the current sample x, one should generate
    y from the conditional distribution of y given x, in which case one can sample
    the new x from the slice S = {x: y < f(x)}. Because the sample generation from
    the slice S is difficult due to the lack of exact information and form of S, one
    can exploit the algorithm proposed by Neal (2003), which updates x through a process
    that leaves the uniform distribution of S invariant. Given the current state x0,
    the next one is generated in the following steps:


    +   (1) Draw y0 uniformly from (0, f(x0)) and define the horizontal slice S =
    {x: y0 < f(x)}.

    +   (2) Find an interval that consists of all or much of S using the stepping-out
    procedure described in Neal (2003).

    +   (3) Generate and draw a new sample within the interval of Step 2.

    +   (4) Update the step i to i + 1 and repeat the previous steps to terminate
    the process by a desired number of samples.


    Similar to the HMC algorithm, the main goal of the SLS is to obtain the augmented
    matrix D \in R^{p x N} under N sample numbers from the initial set d. Finally,
    the augmented matrix is split into the training dataset X \in R^{p x n} and the
    test dataset Z \in R^{p x m}.


    # 2.3.2 Data Normalization by Deep Auto-encoder


    In the proposed HMC-DAE-MD method, a data normalization strategy based on the
    DAE is added to the previously proposed HMC-MD method to enhance its performance
    in reducing the EOC effects. Data normalization in SHM is a technique for eliminating
    the level of changes in data caused by any kind of non-damage conditions; that
    is, environmental and operational, and sometimes noisy conditions. In most cases,
    one attempts to construct a computational/statistical model by using training
    data, which serves as an input applied to that model, and then predict it as the
    model output. On this basis, data normalization intends to perform a residual
    extraction process by computing the direct difference between the input and output.
    To better indicate the difference between the HMC-MD and HMC-DAE-MD, Fig. 2.4
    depicts the general flowchart of SHM by these methods. It should be clarified
    that the main rationale for selecting each of them relies upon the extent of variability
    conditions in the augmented data. In the step of feature discrimination, the MD
    metric takes either the real augmented data points or their residual samples (i.e.,
    normalized data points) after data normalization. From Fig. 2.4, one can realize
    that the process starts by using a limited number of displacement samples from
    a few images. In the next step, the HMC algorithm is employed to expand these
    samples'
  merge: -1
  img_proc: true
- pgno: 58
  md: 'and produce a larger dataset of displacements. As the EOCs depend strongly
    on choosing between HMC-MD and HMC-DAE-MD, an investigation is implemented to
    recognize the level of EOCs in the augmented data by graphical (e.g., Box plot)
    or numerical analyses. In case of low EOC, one can ignore the data normalization.
    In this circumstance, the expanded data is decomposed into the training, validation,
    and test subsets.


    Using the augmented training data points, their mean vector and covariance matrix
    are estimated and considered the main elements of the MD-based novelty detector.
    In this regard, all augmented displacement data points are applied to this detector
    to calculate their distance quantities (i.e., novelty indices) and make a decision
    in the step of feature discrimination. In case of high EOC, it needs to use the
    data normalization, which is developed by a DAE and using the expanded training
    set. Hence, the main goal is to perform the residual extraction by calculating
    the direct difference between the DAE input and output (prediction). The trained
    DAE is then considered to extract the residuals of the augmented validation and
    test sets. Accordingly, one can obtain new training, validation, and test datasets,
    which are insensitive to the EOCs. These datasets are finally applied to the MD-based
    novelty detector to calculate their distance quantities.


    Having considered the novelty indices or distance amounts of the augmented training
    set, a threshold is estimated to make the final decision on the unknown test data
    points. It should be mentioned that as the training and validation datasets belongs
    to the undamaged condition of the structure, their labels are known. In this regard,
    the main attempt is to classify the test data points regarding the unknown or
    current state of the structure. Once the threshold has been determined, the novelty
    indices of the training and validation data should be fell below the threshold,
    as shown Fig. 2.4. On the other hand, if any novelty index of the test sample
    is over the threshold, HMC-MD or HMC-DAE-MD alarms the occurrence of damage; otherwise,
    the structure is still undamaged.


    # 2.3.2.1 Autoencoders


    The autoencoders (AEs) are nonlinear unsupervised classes of ANNs that mainly
    intend to learn generative models for regenerating or reconstructing unlabeled
    data points (Charte et al. 2018; Liu et al. 2017; Karhunen et al. 2015; Larochelle
    et al. 2009). More specifically, the AEs are often trained to encode the inputs
    into some representations in an effort to reconstruct them. In this regard, an
    AE consists of an encoder, an encoding layer, and a decoder (Charte et al. 2018).
    The encoder and decoder are two key parts of an AE. The encoder aims to encode
    the inputs and maps them into a new feature space. The decoder uses the coded
    data to reconstruct the inputs. The great advantages of the AEs include extracting
    useful features continually during the propagation process and particularly filtering
    the useless features (Liu et al. 2017). However, the key merit of the AEs is to
    filter out noisy data or sampling data with outliers (Kramer 1992). For this reason,
    this kind of ANN is an appropriate choice for data normalization (Pathirage et
    al. 2018; Entezami et al. 2020).'
  merge: -1
  img_proc: true
