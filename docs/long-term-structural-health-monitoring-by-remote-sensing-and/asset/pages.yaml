    # 4.3 Early Damage Detection by Hybrid Learning Methods


    This section presents the results of early damage detection or pre-collapse prediction
    in the Tadcaster Bridge by using the proposed HMC-DAE-MD, HMC-UTSL-MD, and HMC-DTL-MD
    methods. As the main outputs of data augmentation via the HMC technique have been
    presented and discussed in the previous section, one attempts to indicate the
    outputs of SHM and the effects of various data normalization approaches proposed
    in this book.


    It is important to describe that these methods need training and test datasets.
    According to the case study, the augmented displacement samples have been extracted
    from the eight target points, in which case \( p = 8 \). Moreover, the HMC sampling
    technique generates 1000 displacement points for each image; hence, the total
    number of augmented samples correspond to 4500. Among them, the first 4100 augmented
    points (\( n = 4100 \)) regarding the first 41 images, which are related to the
    undamaged state of the bridge, are employed to produce the training set \( \mathbf{X}
    \in \mathbb{R}^{8 \times 4100} \). The remaining 2000 augmented data samples concerning
    Images 42 and 43 are taken as the validation data or known test data. Here, it
    is assumed that Images 44 and 45 pertain to the unknown state of the bridge and
    one attempts to detect their states. Accordingly, the 2000 augmented samples related
    to these images are labeled as the unknown test points. Totally, the test data
    is comprised of 4000 samples (\( m = 4000 \)) from the eight target points; that
    is, \( \mathbf{Z} \in \mathbb{R}^{8 \times 4000} \).'
