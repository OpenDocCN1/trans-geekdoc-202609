- pgno: 15
  md: '# # Chapter 1

    # Pioneering Remote Sensing in Structural Health Monitoring


    **Abstract** Recently, long-term structural health monitoring (SHM) of civil structures
    by using the technology of remote sensing has received increasing attention by
    civil engineers. This is because such technology can facilitate SHM by introducing
    useful products such as synthetic aperture radar (SAR) images acquired from some
    satellites suitable for monitoring of large-scale civil structures in wide areas.
    In contrast to conventional contact-based and next-generation vision-based sensors,
    a long-term monitoring program via space borne remote sensing cannot provide high-dimensional
    structural responses. On this basis, it is feasible to conduct the program with
    a few SAR images. Using such products, one can extract structural responses in
    terms of displacements at different areas of a civil structure and monitor the
    responses for detecting any abnormal change. Because the long-term monitoring
    process is based on analyzing structural displacement responses, the main focus
    is on machine learning. For this process, environmental and operational changes
    seriously affect the performance of data-driven machine learning-aided techniques.
    Due to the importance of SHM in every society, this chapter intends to explain
    the main parts of remote sensing-based health monitoring of civil structures through
    SAR images and machine learning.


    **Keywords** Structural health monitoring · Remote sensing · Synthetic aperture
    radar image · Environmental and operational change · Machine learning


    # ## 1.1 Introduction


    Civil structures such as high-rise buildings, bridges, dams, offshore oil platforms,
    hospitals, nuclear power plants, railways and subways systems are of paramount
    importance to every society due to their significant influences on human social
    life, transportation networks, medicine services, economics, etc. Most of the
    constructed facilities were designed by different codes and guidelines and were
    constructed by various construction techniques, which may be outdated. Some of
    them were built several years or decades ago, in which case aging and material
    deterioration are two'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'major factors for their undesirable separability. On the other hand, in reality,
    any civil structure may encounter unpredictable excitation sources such as earthquake,
    strong wind, hurricane, typhoon, flood, etc. with different magnitudes, or a sequence/combination
    of these sources. Under such circumstances, structural damage can emerge leading
    to adverse changes in the structural performance and serviceability, and dramatically
    partial and global collapses (Li et al. 2016; Mesquita et al. 2016; Webb et al.
    2015; Modares and Waksmanski 2013; Deng et al. 2016; Chen 2017; Sassu et al. 2017;
    Alencar et al. 2019).


    In civil engineering, the practical process of evaluation of integrity and safety
    of civil structures is called structural health monitoring (SHM). This methodology
    is often based on equipping civil structures with various sensors, measuring useful
    data (i.e., vibration responses such as acceleration time histories or new responses
    such as images and videos), analyzing measured data, and implementing an SHM method
    (Gharehbaghi et al. 2022; Rizzo and Enshaeian 2021; Sun et al. 2020). The main
    tasks of this methodology include but are not limited to early alarming of damage
    occurrence or declaring a safe condition, localization of damaged areas after
    ensuring the occurrence of damage, recognition of damage type, and estimation
    of damage severity (Heravi et al. 2022; Esfehani et al. 2023; Entezami et al.
    2023b; Sarmadi et al. 2023c). After these tasks, the damaged areas should be repaired
    or replaced to enhance the structural performance and serviceability.


    A damaged structure can experience different damage patterns with various severity
    levels. Generally, these levels are classified as minor, moderate, and major cases.
    Regardless of minor damage, a damaged structure may sustain partial or global
    collapses under moderate and major damage patterns (Deng et al. 2016; Chen 2017;
    Abdelwahed 2019). Collapse in a civil structure is a phenomenon that all or parts
    of the structure may be destroyed by serious damages caused by natural hazards
    or fatigue loads so that the structure no longer operates and services normally.
    Human deaths and injuries as well as huge economic losses are two catastrophic
    consequences of the collapse phenomenon. Some tragedies caused by collapses occurred
    in Minnesota I-35W Bridge (Minneapolis, Minnesota, USA) with 13 deaths in 2007
    (Astaneh-Asl 2008), Morandi Bridge (Genova, Italy) with 43 deaths in 2018 (Rania
    et al. 2019), Champlain Towers South Condominium (Miami, USA) with 98 deaths in
    2021 (Kong and Smyl 2022), and Abadan Metropol Building (Abadan, Iran) with 31
    deaths in 2022.


    Collapses in civil structures can occur in global and partial conditions. During
    a global collapse, the entire structure demolishes that causes much more tragic
    deaths and injuries along with considerable economic losses due to rebuilding
    the destroyed structure. In contrast, a partial collapse leads to a lower level
    of a collapse by most likely fewer casualties than the global collapse. In this
    case, a small part or some parts of a structure fall down; nonetheless, the structure
    may keep up its stability somehow. Under such circumstances, there may be chance
    to conserve the entire stability of the structure by repairing or replacing the
    partially collapsed area. The main reasons for a partial collapse include (Deng
    et al. 2016; Chen 2017):'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 1.1 Introduction


    +   (1) Inappropriate design and construction;

    +   (2) Natural hazards such as earthquake, wind, flood, etc.;

    +   (3) Aging, material deterioration, erosion, fatigue, etc.;

    +   (4) Neglecting automated and continuous SHM;

    +   (5) Neglecting detecting and identifying minor or moderate damage patterns;

    +   (6) Inability of classical visual inspections to effectively monitor civil
    structures;

    +   (7) Less attention to automated monitoring schemes by new sensing technologies
    based on non-contact based sensors via optical cameras or satellites.


    On the other hand, the major reasons for a global collapse can be summarized as:


    +   (1) Extremely strong natural disasters such as earthquake, typhoon, flood,
    etc.;

    +   (2) Extraordinary loads applied to the civil structure;

    +   (3) Aging, material deterioration, erosion, fatigue, failure, etc.;

    +   (4) Neglecting automated and continues SHM.


    To avoid such catastrophic events, SHM provides a practical and effective technology
    to protect civil structures against any type of damage and collapse by taking
    advantages from advanced data-based techniques under the concepts of artificial
    intelligence and machine learning. In general, a data-based SHM strategy is decomposed
    into some preliminary steps including: (i) sensing and data acquisition systems,
    (ii) data transformation and storage, and (iii) initial data analysis. Subsequently,
    it is necessary to apply feature extraction tools for extracting damage-sensitive
    features (i.e., those are only dependent on the structural properties and damage
    information and not variability sources, noises, and outliers) and develop advanced
    computational/statistical models in the view of the concept of machine learning
    for decision-making or feature discrimination. This step sets out to firstly determine
    novelty indices or damage indicators of the training and test data points and
    subsequently differentiate the obtained indications of the damaged condition from
    the undamaged one through an alarming threshold.


    In general, a data-based SHM method is implemented in the training/baseline and
    monitoring/inspection phases (Ente zami et al. 2020d; Ente zami et al. 2021).
    The main objective is to learn an automated computational model via training data
    in the first phase and then assess the current structural condition in the second
    phase via test data and the learned model. According to the concept of machine
    learning, these steps can be carried out by supervised learning and unsupervised
    learning techniques. In the context of SHM, supervised learning refers to the
    technique that requires fully labeled data from both the normal/undamaged and
    damaged conditions. In other words, one needs to prepare damage-sensitive features
    of both conditions in order to learn a classifier (i.e., the computational model
    in supervised learning) for classifying new features (test samples) and predicting
    their labels. On the contrary, unsupervised learning depends only on the features
    of the normal conditions; hence, one attempts to evaluate the status of the current
    state of the structure using new features (test data) by a novelty (anomaly) detector
    (i.e., the computational model in unsupervised learning). An important note is
    that the preparation of fully labeled data in the problem of health monitoring
    of civil structures is not only difficult, time-consuming, and'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'labor-intensive, but also illogical. This is because there is no justification
    to impose intentional damages on complex and vital civil structures in order to
    prepare limited and controlled damaged data (e.g., the SHM problems of the Z24
    and S101 Bridges Maeck and De Roeck 2003; Döhler et al. 2014). To cope with this
    limitation, in some case, one can construct the numerical model of the real structure
    and simulate various damage patterns to provide damaged data (Figueiredo et al.
    2019; Torzoni et al. 2022; Daneshvar et al. 2023a; Entezami et al. 2020c). However,
    the major obstacle to perform this approach pertains to the inevitable differences
    between the numerical and real modes due to idealization, simple assumptions,
    wrong modeling, and noisy data. In this case, finite element model updating is
    mandatory (Ereiz et al. 2022; Rezaiee-Pajand et al. 2021, 2020), which may impose
    additional challenges. Therefore, one can realize that unsupervised learning is
    a better solution to SHM of civil structures.


    Sensing technology is a broad field in SHM that contains various kinds of sensors
    and data acquisition systems from contact sensors (e.g., stain gages, accelerometers,
    optical fibers, etc.) (Wang et al. 2014b; a) to non-contact-based sensors (Feng
    and Feng 2018). Although the use of non-contact sensing technology via common
    and accessible devices (e.g., commercial cameras, video devices, smartphones,
    etc.) is prevalent in academic and industrial SHM activities (Sony et al. 2019;
    Dong and Catbas 2021), some limitations do not allow civil engineers and researchers
    to achieve reasonable outcomes. One of them is that this type of sensing technology
    cannot provide a simple routine for monitoring of large-scale structures. On the
    other hand, pre-collapse investigation of some vital structural systems such as
    bridges and dams constructed in large-scale areas may be problematic. This limitation
    become worse in continuous long-term SHM programs. Apart from these limitations,
    the great obstacle to easily apply non-contact sensors for SHM applications is
    the devoid of rich information about initial undamaged states of many constructed
    civil structures. Even though, the optimal sensing technology has brought an important
    opportunity to detect surface damages (e.g., concrete crack Kim et al. 2019; Kang
    et al. 2020; Dung and Anh 2019) and spalling (Cao et al. 2021; Dawood et al. 2017),
    steel corrosion (Yao et al. 2019), fatigue cracks (Dung et al. 2019; Kong and
    Li 2018; Xu et al. 2019), etc.), some important damage patterns are not simply
    visible. In order to cope with these limitations, synthetic aperture radar (SAR)
    images acquired from remote sensing from space and satellites has brought a new
    technology for health assessment of civil structural systems. The great benefits
    of the SAR-aided SHM include but are not limited to:


    +   * Evaluating large-scale structural systems in wide regions without any concern
    about sensor placement, deployment, and installation

    +   * Accessing initial information of undamaged states of civil structures

    +   * Observing wide zones around civil structures

    +   * Capturing SAR images in the presence of clouds and tough weather

    +   * In general, a SAR-aided SHM strategy is divided into three main parts:

    +   * Selecting the types of satellites such as Sentinel-1, COSMO-SkyMed, TerraSAR-X,
    downloading SAR products based on different formats in terms of single look'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'complex (SLC), ground range detected (GRD), Raw images, bands, polarizations,
    orders (i.e., descending or ascending), etc.


    +   * Applying interferometric methods such as InSAR, DInSAR, SqueeSAR, etc. to
    extracting displacement data points

    +   * Analyzing displacement data for SHM.¹


    # 1.2 Literature Review: Existing Knowledge and Existing Gaps


    In relation to the SAR-aided SHM applications, one can refer to the research conducted
    by Selvakumaran et al. (2018) who assessed the partial collapse in a masonry bridge
    caused by the scour of one of the bridge piers by utilizing 45 SAR images acquired
    from TerraSar-X. They directly analyzed the displacements from these images and
    predicted the occurrence of the partial collapse by finding anomalies in the displacement
    distribution. Milillo et al. (2019) carried out a research on evaluating the structural
    conditions of the Morandi Bridge before its partial collapse by applying relatively
    several SAR images from various satellites. They only observed displacements in
    the proximity of the damaged region and investigated the feasibility of alarming
    the partial collapse. Giordano et al. (2022) performed a long-term damage assessment
    strategy for evaluating possible damage in a historic iron bridge by using SAR
    images acquired by COSMO-SkyMed between 2011 and 2019. They emphasized the serious
    influences of the EOCs on displacement data of civil structures gained by SAR
    images. For this issue, the classical PCA method was applied to remove possible
    EOCs in the measured displacement data points and the control charts were considered
    for anomaly detection. They finally concluded that the removal of the EOCs from
    displacement data enabled them to detect the settlement of the bridge piers up
    to 2 mm. Biondi et al. (2020) proposed a vibration-based early damage warning
    method in terms of modal analysis by using SAR images without displacement sample
    extraction. In particular, they examined the possibility of their methodology
    on the Morandi Bridge. Farneti et al. (2022) conducted a long-term monitoring
    process on the Albiano-Magra Bridge in Italy, which was globally collapsed on
    April 2020, between 2015 and 2020 using a relatively large set of SAR images from
    COSMO-SkyMed. For this issue, they extracted two-dimensional displacement samples
    obtained from 121 SAR images in the ascending orbit from January 2013 to April
    2020 and 64 SAR images in the descending orbit between March 2015 to March 2020.
    Their major engineering goal was to quantify uncertainties in the two-dimensional
    displacement measurements gained by the InSAR techniques.


    ¹ In most cases, the research activities have focused on direct analyses of the
    displacements extracted from SAR images.'
