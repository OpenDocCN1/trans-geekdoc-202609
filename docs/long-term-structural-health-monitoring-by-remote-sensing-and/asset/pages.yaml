    # 2.3.2.2 Hyperparameter Optimization in DAE


    In machine learning, the unknown elements of a machine or model that control how
    it learns from data are called hyperparameters (Yang and Shami 2020; Sarmadi 2021).
    These elements should be optimized or selected so that the model of interest can
    minimize modeling or learning errors and increase generality. Because hyperparameters
    significantly influence overall performances of machine learning models, it is
    indispensably to choose them before the learning process. On the other hand, there
    are other kinds of unknown elements in machine learning called model-parameters.
    In contrast to hyperparameters, model-parameters can be estimated during the learning
    process, in which case it is not necessary to elaborately select them prior to
    learning.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '![](img/3d323f4db48c9242205a3db747902f6d_64_0.png)


    Fig. 2.7 The graphical representation of the unsupervised data normalization by
    ANN


    For instance, the numbers of hidden layers and their neurons are the key hyperparameters
    of an ANN, while the weight matrices and bias vectors of these layers are its
    model-parameters (Sarmadi 2021).


    In the proposed HMC-DAE-MD method, the process of data normalization is carried
    out by an undercomplete DAE with three hidden layers, as shown in Fig. 2.6a, in
    which case the number of hidden layers is known. This means that the neurons of
    the mapping, encoding, and de-mapping layers are the main hyperparameters of this
    ANN. Typically, the error reconstruction based on the mean-square-error (MSE)
    is the major criterion for this hyperparameter optimization. As the undercomplete
    DAE is suggested to mitigate the negative effects of the EOCs, this research proposes
    a simple but effective grid search approach to optimize the neurons of the DAE
    hidden layers. The underlying reason for suggesting this grid search approach
    is the strong influence of EOCs on SHM results. Therefore, the proposed hyperparameter
    optimization of the DAE is developed so that this ANN can significantly alleviate
    the EOC effects.


    The major rationale behind the grid search approach is to examine a relatively
    large trials for the main hyperparameters and evaluate the feedback of the SHM
    method (i.e., the proposed HMC-DAE-MD) in terms of the effects of the EOCs on
    the method outputs by using the only training data. In other words, after using
    the sample hyperparameters, the method yields novelty indices (distances) for
    each trial. On this basis, one can measure the variance of novelty indices. The
    optimal hyperparameter is one that gives the minimum rate of variance. The main
    idea of this criterion comes from this fact that a robust SHM method under unknown
    EOCs in the training phase should yield smooth outputs (novelty indices) with
    a low variance amount (Sarmadi and Yuen 2021).


    Algorithm 1 presents the main steps and the pseudo-code of the proposed gird search
    technique for hyperparameter optimization of the undercomplete DAE. The'
