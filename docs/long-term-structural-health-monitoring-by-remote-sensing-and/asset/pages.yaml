  md: 'Based on these motivations, the main objective is to improve the classical
    SAR-aided SHM in three categories and aspects:


    +   - Data augmentation (expansion) for supplying a wealth of information from
    small displacement points

    +   - Removal and mitigation of the EOC effects from augmented displacement data

    +   - Feature discrimination by innovative and advanced machine learning methods
    for SHM, especially pre-collapse prediction


    For the sake of convenience, Fig. 1.1 illustrates the general flowchart of the
    proposed SAR-aided SHM method. On this basis, this book proposes seven hybrid
    methods in an unsupervised learning fashion along with four hyperparameter optimization
    algorithms to not only address the key demanding issues in the SAR-aided SHM but
    also provide a practical strategy for other long-term SHM projects with small
    data. The first method called NNS-EVT proposes a probabilistic hybrid unsupervised
    learner based on the concepts of unsupervised nearest neighbor searching (NNS)
    and extreme value theory (EVT) for SHM under relatively large data and EOC. The
    second technique called HMC-MD relies on a data augmentation approach based on
    the Hamiltonian Monte Carlo (HMC) sampling and feature discrimination through
    the tried-and-tested Mahalanobis distance (MD) it its squared form. The other
    methods are divided into two groups of either offline learning or online learning
    frameworks. Accordingly, the third method named as HMC-DAE-MD is an improvement
    of the second technique by adding a data normalization approach based on a DAE
    for minimizing the EOC influences on the augmented or expanded displacement samples.
    After the procedure of data normalization, the normalized augmented features are
    applied to the MD-based novelty detector for feature discrimination. In this technique,
    a simple but effective iterative algorithm for hyperparameter optimization is
    designed to choose the neuron numbers of the hidden layers of the DAE with the
    focus on mitigating the EOC effects. The fourth method namely HMC-UTSL-MD suggests
    an innovative unsupervised teacher-student learning (UTSL) by merging an undercomplete
    DAE with seven hidden layers (teacher) and an overcomplete shallow AE (student).
    Both the teacher and student models need hyperparameters to configure their networks.
    Hence, a new hyperparameter optimization is proposed to determine their unknown
    elements. The fifth method named as HMC-DTL-MD develops a deep transfer learning
    (DTL) strategy by developing consecutive DAEs. Although this method utilizes some
    prior information (i.e., transferred hyperparameters), it needs to determine the
    number of consecutive neural networks. For this issue, a new hyperparameter optimization
    is also designed. All the previous methods rely upon offline learning within a
    fixed training period. In order to perform real-time SHM, the sixth and seventh
    methods HMC-ODTL-EMD and SLS-ODTL-EMD consider the HMC and SLS to initially augment
    small data, subsequently develop an online deep transfer learning (ODTL) approach,
    and finally propose a damage indicator by computing the Euclidean norm of the
    MD values. The first two proposed techniques, NNS-EVT and HMC-MD, are validated
    by simulated numerical displacement data from the I-40 Bridge (Rezaiee-Pajand
    et al. 2021). The remaining techniques are verified by a set of continuous and
    few displacement samples extracted from a few'
