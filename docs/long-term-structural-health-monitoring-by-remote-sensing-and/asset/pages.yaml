    \( N_e < 2N_m < \frac{p(n - N_e)}{p + N_e + 1} \) (2.33)


    \( (N_m + N_d) < n \) (2.34)


    # **Algorithm 1. Hyperparameter optimization of the undercomplete DAE**


    | Content |

    | --- |

    | **Inputs:** Input data X, and the sample neuron numbers N<sub>m0</sub>, N<sub>e0</sub>,
    and N<sub>d0</sub> for the mapping, encoding, and de-mapping layers, respectively
    |

    | **Initialization:** N<sub>m0</sub> = N<sub>d0</sub> and N<sub>m0</sub> > N<sub>e0</sub>
    |

    | **For** i = 1 to N<sub>m0</sub> |

    | **For** j = 1 to N<sub>e0</sub> |

    | 1. Train a DAE via the ith and jth trials for the neurons of the mapping and
    encoding layers |

    | 2. Predict the network output X̂ |

    | 3. Extract the residual matrix E<sub>x</sub> = |X − X̂| |

    | 4. Use the residual matrix E<sub>x</sub> as new training data in the MD metric
    (see Sect. 2.3.5) |

    | 5. Obtain distance values using all samples of E<sub>x</sub> |

    | 6. Compute the variance of the calculated distance values regarding the ith
    and jth trials |

    | 7. Store this value in the i<sup>th</sup> row and the j<sup>th</sup> column
    of a matrix |

    | **End** |

    | **End** |

    | 8. Select the minimum variance amount in the rows and columns of the matrix
    of Step 7 |

    | 9. Check the overfitting problem. If the overfitting problem is inevitable,
    return to Step 8 and choose the next minimum variance value and check the overfitting
    problem. Continue this process until the DAE satisfy the overfitting conditions
    |

    | 10. The row and column numbers of the stored matrix regarding the minimum variance
    value are indicative of the optimal neuron sizes of the mapping or de-mapping
    (N<sub>m</sub>) and encoding (N<sub>e</sub>) layers, respectively |

    | **Outputs:** The optimal neuron numbers N<sub>m</sub> = N<sub>d</sub> and N<sub>e</sub>
    |'
