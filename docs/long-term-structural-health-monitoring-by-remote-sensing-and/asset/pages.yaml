- pgno: 22
  md: 'Despite many successful applications of SAR-aided SHM on different civil structures,
    particularly bridges, this technology has its limitations and challenges (Behkamal
    et al. 2023a, b). One of these challenges is the impossibility of providing rich
    and adequate information (measurements) as same as vibration-based SHM (Entezami
    et al. 2022a, b). To put it another way, any vibration-based SHM may contain many
    contact- and non-contact vision-based sensors to measure vibration responses (e.g.,
    acceleration time histories or displacements from images or videos) in a long-term
    monitoring program. Under such circumstances, one can obtain huge volume of useful
    information and responses regarding the behavior of the structure under study.
    In contrast, this strategy is not feasible in SAR-aided SHM. For example, Sarmadi
    et al. (2021b) exploited 5956 natural frequencies of a three-span bridge to detect
    damage in a one-year monitoring scheme. Entezami et al. (2020a) applied the total
    of 1,010,880,000 time series data concerning a cable-style bridge for only 12
    days. Because the preparation of such large data is not often possible in SAR-aided
    SHM, the major challenge is the problem of small data. Simply speaking, even though
    one can implement a long-term monitoring program for SHM of civil structures via
    remote sensing, a limited number of SAR images are usually applied to find out
    displacement data points. On the other hand, extremely large sizes of SAR images
    due to covering wide areas in the unit of km, and memory space restrictions for
    collecting many images are other limitations of this process. The other key challenge
    of SAR-aided SHM pertains to directly analyzing displacements extracted from satellite
    images regarding bridges (Selvakumaran et al. 2018; Miliello et al. 2019, 2016;
    Qin et al. 2017, 2018), buildings (Zhu et al. 2018; Macchiarulo et al. 2021; Giardina
    et al. 2019; Cigna et al. 2014; Di Carlo et al. 2021), and dams (Bayik et al.
    2021; Mura et al. 2018; Miliello et al. 2016; Di Martire et al. 2014; Gama et
    al. 2020; Jänichen et al. 2022). An important note is that the direct utilization
    of measured data is not a robust way for SHM. Undoubtedly, apart from the size
    and complexity of civil structures compared with other structural systems, those
    are expensive and critical. This means that any erroneous decision on SHM by directly
    analyzing measured data may cause irreparable events such as human deaths and
    injuries and economic losses. Therefore, the direct application of small data
    is not a reliable and robust technique for SHM of prominent civil structures,
    especially in long-term monitoring.


    Apart from this limitation, most of the unsupervised learning methods are susceptible
    to erroneous results due to severe variability in data and damage-sensitive features
    regardless of the type of sensing and features. In reality, ambient and environmental
    changes are inevitable in every civil structure built in outdoor environment.
    Daily and seasonal temperature fluctuations, wind speed and direction changes,
    humidity and moisture variations, and excitation amplitude alternations are prevalent
    environmental variability conditions. Moreover, operational variations in outdoor
    and indoor environment significantly affect civil structures. Dead and live load
    alterations, excessive loading, sudden accidents and collisions, explosions, human
    and vehicle traffic are some common operational variability conditions (Farrar
    and Worden 2013: Chapter 12; Wang et al. 2022). Even though the EOCs are not adverse
    phenomena like structural damage, those can alter the mass, stiffness, and damping
    properties of a structural system, as well as its materials, geometry, connectivity,
    and responses'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# 1.2 Literature Review: Existing Knowledge and Existing Gaps


    (Farrar and Worden 2013; Han et al. 2020; Xia et al. 2012). For this issue, many
    research studies on different civil structures were conducted to analyze the effects
    of EOCs (Moser and Moaveni 2011; Zhou and Sun 2019; Zonno et al. 2019; Entezami
    et al. 2019, 2022c, e; Sarmadi and Karamodin 2020; Jang and Smyth 2020; Sousa
    Tomé et al. 2020; Sarmadi 2021; Sarmadi et al. 2021a; Sarmadi and Yuen 2021; Daneshvar
    and Sarmadi 2022).


    Moster and Moaveni (2011) studied the effects of temperature on modal data of
    a steel footbridge in order to analyze the structural behavior under temperature
    fluctuations in steel frame, concrete deck, and the footbridge piers. Their study
    demonstrated that ambient temperature could change structural responses (natural
    frequencies) by 4–8%. Zhou and Sun (2019) evaluated the influences of both environmental
    and operational variability caused by wind loading, structural temperature (i.e.,
    the effect of ambient temperature on structural elements), humidity, sea levels,
    and traffic on modal frequencies of a long-span sea-crossing bridge. Their investigations
    indicated that structural temperature and traffic loads were the main factors
    for significant changes in the vibration responses of the bridge so that the influence
    of temperature on yearly scale was greater than the traffic. In contrast, the
    traffic load was dominant on the weekly and daily scales. Zonno et al. (2019)
    assessed the structural behavior of adobe buildings under long and short-term
    impacts of temperature and humidity. They concluded that the modal frequencies
    of the building in the long-term monitoring varied up to 8% due to the environmental
    variations, especially relative and absolute humidity. In short-term monitoring,
    the rates of variability was about 2.6–3.8%. Jang and Smyth (Jang and Smyth 2020)
    performed a numerical study on the effect of temperature distribution on structural
    responses of a full-scale finite element model of a cable-stayed bridge and modeled
    two approaches for this study by considering thermal prestress imposed at an element
    level and temperature-dependent Young''s modulus. Their research demonstrated
    that the thermal prestress at the structural elements was the key reason for significantly
    variability in the natural frequencies of the bridge. In a similar manner, Teng
    et al. (2021) analyzed the mechanism of the influence of temperature on the frequency
    of a steel arch bridge in terms of internal force, geometric size, elastic modulus,
    and boundary condition. On the daily scale, the temperature distribution on the
    steel arch and gider behaved differently, while the frequencies of both elements
    decreased by increasing temperature on the yearly scale. Sarmadi (2021) conducted
    a comparative study on the effect of various EOC conditions on different structural
    responses. In that study, he utilized two types of features including time-series-based
    features obtained from time series modeling and dynamic features from operational
    modal analysis. He also suggested an effective approach to predict the level of
    EOCs by using the median absolute deviation. The results of that study indicated
    that EOCs had more impacts on the dynamic features rather time-series features.
    Maes et al. (2022) studied the influences of different environmental variability
    on the structural responses of a retrofitted steel bridge. They observed sudden
    increases in the natural frequencies of this steel bridge when the temperature
    reached around 0 °C. Moreover, it was observed that temperature was not the main
    factor for the environmental variability, in which case this'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'conclusion emphasizes the importance of measuring futher and other EOC conditions.
    All the aforementioned studies confirm the negative point of the EOCs that these
    conditions can lead to alterations in any structure similar to damage. Under such
    circumstances, false positive (Type I) and false negative (Type II) are two major
    errors that are directly relevant to the economic and human losses, respectively
    (Giglioni et al. 2021). In the context of SHM, false positive makes sense that
    the structure is undamaged but the SHM method incorrectly alarms the occurrence
    of damage. By contrast, false negative means that the structure suffered from
    damage but the method of interest does not alarm the occurrence of damage. Therefore,
    since the EOCs are inevitable in real-world SHM projects, it is indispensable
    to discard any variability from features.


    Removal of the effects of EOCs in SHM is often carried out by data normalization
    techniques (Farrar and Worden 2013: Chapter 12; Wang et al. 2022). Generally,
    there are two kinds of data normalization techniques called input–output and output-only
    frameworks. The first approach is based on entire information about the structural
    response/damage-sensitive features and variability data (e.g., temperature). Indeed,
    this technique is dependent on the regression problem. In this regard, Hu et al.
    (2016) compared different regression models such as multiple linear regression,
    polynomial regression model, and principal component regression by using modal
    data as the main damage-sensitive feature (i.e., output) and temperature data
    (i.e., input). Dervilis et al. (2015) proposed a robust regression model as a
    least trimmed square estimator to remove the influence of temperature-induced
    variations in an input–output framework, where the input and output were the temperature
    data and modal frequencies, respectively. Ferreras-Alcover et al. (2015) utilized
    a weighted least squares regression model to eliminate daily-averaged pavement
    temperature variations from vibration responses (stain data) of a bridge. Buckley
    et al. (2021) proposed a dynamic harmonic regression time-series model to detect
    damage in a bridge by considering the temperature as the environmental data (input)
    in the regression model. From these references, one can realize that the implementation
    of an input–output data normalization technique depends on the measurement of
    environmental and/or operational data and the consideration of a regression model
    for defining the relationship between structural responses and variability data.
    Nonetheless, the major drawback of the input–output technique returns its dependency
    on measuring the variability data. In most cases, environmental data, particularly
    temperature, is the main information. However, as Meas et al. (2022) indicated,
    the output data (i.e., structural responses or damage-sensitive features) can
    be influenced by other variability conditions, which differ from those are measured.
    Thus, the development of an output-only data normalization method can ignore this
    limitation.


    Totally, the output-only data normalization depends on the structural responses
    (measured data) and damage-sensitive features without any information about the
    variability data. In other works, an output-only approach aims to find the variability
    pattern in the data/features and develop a more robust and rigorous strategy than
    the input–output framework for removing the EOCs. In most cases, this strategy
    can be implemented by statistical and artificial neural networks (ANNs) algorithms.
    Principal component analysis (PCA) and its advanced versions (Comanducci et al.
    2016;'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'Yan et al. 2005; Soo Lon Wah et al. 2019; Deramaeker and Worden 2018; Reynders
    et al. 2014), nearest neighbor searching (Sarmadi and Karamodin 2020; Sarmadi
    et al. 2021a, 2022, 2023a; Sarmadi and Yuen 2022), and some linear approaches
    based on singular value decomposition (SVD) and Gaussian mixture model (GMM) (Figueiredo
    and Cross 2013; Figueiredo et al. 2011) are some well-known statistical output-only
    data normalization techniques. The ANN-based data normalization lies in learning
    an unsupervised ANN by using the structural responses or damage-sensitive features
    and computing the residuals between inputs applied to the network (i.e., the same
    structural responses or damage-sensitive features) and the network outputs (predictions).
    This algorithm can be carried out by shallow neural networks (Figueiredo et al.
    2011; Chang et al. 2018; Sarmadi 2021) or deep neural networks (e.g., autoencoders)
    (Wang and Cha 2021; Shang et al. 2021; Silva et al. 2021). The other approaches
    are based on advanced machine learning methods. In this regard, Daneshvar et al.
    (2023b) proposed a novel locally unsupervised learning method through a discriminative
    reconstruction-based dictionary learning model for removing the environmental
    effects from modal data. Sarmadi et al. (2023b) proposed a novel hybrid feature
    weighting-selection algorithm in conjunction with a new nearest neighbor searching
    call natural nearest neighbor selection to implement an unsupervised (output-only)
    data normalization on modal data of full-scale bridge structures. Entezami et
    al. (2023a) put forward the idea of unsupervised meta-learning for eliminating
    the effects of the EOCs from dynamic data of concrete and steel bridges with missing
    data. In another study on advanced machine learning, Entezami et al. (2023c) proposed
    an innovative unsupervised multi-task learning method for unsupervised data normalization.
    All of these techniques can be classified as non-parametric and parametric algorithms.
    Although the first algorithm does not need any unknown components that should
    be estimated before the model development, parametric methods can yield more reliable
    outputs regarding the removal of the variability conditions by estimating their
    hyperparameters (Sarmadi 2021).


    The other challenge in machine learning-aided SHM is related to the learning strategy.
    Depending upon the type of processing and acquiring measured data, the learning
    process can be carried out in offline or online manners. The central idea behind
    the offline learning is to handle and analyze an approximately large set of measurements
    at once. Indeed, this strategy brings a systematic approach to process numerous
    data points, which are gathered over a period of time. One of the advantages of
    this approach is the possibility of capturing all potential EOCs in long-term
    monitoring. In this regard, one supposes that adequate training data is available
    to develop a plausible computational/statistical model in terms of machine learning.
    By contrast, online learning is the process of being able to almost instantaneously
    analyze data, update the initial model, and the learning strategy in an online
    manner by receiving new data (Hoi et al. 2021).


    In context of SHM, the offline learning is highly prevalent (Sarmadi and Karamodin
    2020; Sarmadi et al. 2021a; Reynders et al. 2014; Magalhães et al. 2012; Shi et
    al. 2018; Entezami et al. 2021). Occasionally, one attempts to capture long-term
    measurements of vibration data along with all possible EOCs in a fixed period
    [e.g., the SHM problems of the Z24 Bridge in a daily one-year measurement Maeck'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'and De Roeck 2003; Reynders and De Roeck 2009 or the Infante Bridge in an hourly
    two-year measurement (Magalhães et al. 2012)]. The main premise lies in the fact
    that if adequate environmental, operational, and structural data is measurable,
    this enables civil engineers to model the most appropriate machine learning model
    in a fixed training period, in which case it is possible to cover all possible
    EOCs. On the other hand, it is supposed that no damage emerges in the training
    stage. However, this strategy is confronted with two major obstacles. Firstly,
    there is no guarantee that the same variability pattern caused by the EOCs occurs
    in new measurements, even the structure is undamaged. In other words, it is probable
    that newly unpredictable EOCs will occur out of the learning period, which do
    not capture and consider by the trained model. In this case, the false alarm is
    a probable consequence. Secondly, it is not logical to assume that no damage or
    abnormal change occurred in the structure during the training period.


    Accordingly, online/incremental learning provides a more realistic and reliable
    condition for real-time SHM of civil structures. Here, the term real-time means
    implementing the data analysis, updating the trained model, and making a decision
    in an online fashion as the new measurement becomes available. In the online learning,
    the training procedure is carried out in an incremental manner by continually
    utilizing new data and updating the trained model. In most cases, an online learning
    strategy begins by applying an initial small set of measured data to develop an
    initial model. Once the new data is measured, it feeds into the initially trained
    model for updating or making decision. On this basis, in the problem of SHM, it
    is necessary to define a criterion or standard for terminating the updating step
    and starting a new step for decision-making. If the standard makes sure of a healthy
    or undamaged structural state, it needs to continue the learning procedure by
    updating the developed machine learning model; unless, this procedure should be
    ended by choosing the new measurement as test data. In other words, it is not
    necessary to update the model. Hence, any new data is only fed into the last updated
    model to make a decision.


    In relation to the applications of online learning to SHM, one can mention the
    study by Krishnan et al. (2018) who proposed an online damage detection method
    with the aids of the recursive PCA and a time-varying linear autoregressive (AR)
    model. In their work, the main components of the recursive PCA including the eigenvector
    (principal component) and eigenvalue matrix were updated by receiving new data
    (i.e., acceleration time histories from accelerometers). The time-varying AR model
    was then fitted to the principal components of the recursive PCA in order to track
    the changes in the AR coefficients as an indicator for damage detection. Yu (2017)
    presented an online learning fault detection in mechanical machines via adaptive
    hidden Markov model along with a healthy index that measured the similarity between
    two density distributions regarding the baseline and current system conditions.
    Jin et al. (2015) proposed an output-only data normalization technique based on
    a novel adaptive PCA in an online manner. The main objective was to capture the
    intrinsic structural behavior by continuously updating a reference (PCA) model
    before damage detection. The conventional Euclidean distance between the original
    feature samples and their reconstructed values (i.e., the residual samples) was
    then'
