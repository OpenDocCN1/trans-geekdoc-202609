    # ## 4.3.2 HMC-UTSL-MD


    The central core of the proposed HMC-UTSL-MD method concentrates on data normalization
    by the proposed UTSL algorithm. As explained in §0, this algorithm consists of
    a teacher model consisting of an undercomplete seven-hidden-layer DAE and a student
    model based on an overcomplete shallow AE. To remove the EOC effects, it suffices
    to feed the augmented training data into these models to initially train them
    and subsequently extract the augmented residual matrix concerning the training
    data. In the next step, the expanded test data points are used to the trained'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'teacher and student models for residual extraction. Both residual matrices
    of the training and test datasets are considered in the MD-based novelty detector
    for feature normalization.


    The first step of data normalization by UTSL is to gain the neurons of the seven
    hidden layers of the undercomplete DAE (teacher) and the single encoding layer
    of the overcomplete shallow AE. According to the proposed hyperparameter optimization
    presented in Sect. 2.3.3.1 and the sample neuron collections from Table 2.1, Fig.
    4.11 displays the AIC values of 10 sets of the sample neurons. As this figure
    discloses, the AIC values of the 4th, 5th, and 6th sets are smaller compared to
    the other ones. This means that each of them can yield reliable outputs. However,
    the average of these values calculated to apply this averaged number to be the
    optimum set of the neurons. Hence, the seven hidden layers of the DAE need 10,
    8, 6, 3, 6, 8, and 10 neurons, respectively. For the overcomplete shallow AE,
    the number of neurons of the encoding layer is equal to 51.


    Similar to the previous section, it is initially evaluated the effect of UTSL-based
