  md: '# Chapter 5 Conclusions and Prospects for Structural Health Monitoring


    **Abstract** In this book, it has been attempted to address some major challenging
    issues related to long-term health monitoring of civil structures based on the
    technology of remote sensing and machine learning. For this reason, various unsupervised
    learning methods have been proposed to detect any abnormal conditions in civil
    structures under unknown EOCs using small and large sets of displacement responses
    obtained from SAR images. This chapter aims to mention the main conclusions of
    the proposed methods in both numerical and experimental validation stages. Due
    to the importance of SHM and the benefits of remote sensing, some suggestions
    are given to further evaluate in future research activities.


    **Keywords** Long-term health monitoring • Conclusions • Environmental and operational
    changes • Remote sensing • Machine learning


    # 5.1 Introduction


    The main motivation for conducting this research is to improve the classical SAR-aided
    SHM and address the major limitations of this process. On this basis, new hybrid
    methods in an unsupervised learning fashion were developed to alarm the emergence
    of any abnormal change and damage, especially collapse, under unknown and unpredictable
    EOCs. In case of apply relatively large displacement data, this research proposed
    a hybrid probabilistic unsupervised learning method based on the NNS and EVT.
    When a small number of displacement samples is available, the proposed hybrid
    learning methods entailed data augmentation via either HMC or SLS techniques,
    different novel DAE-based data normalization approaches, and feature discrimination
    by the MD and EMD. In the second part of the hybrid learning methods for small
    data, this research exploited various AE in deep and shallow configurations. In
    the HMC-DAE-MD method, a direct application of the three-hidden-layer DAE was
    considered to mitigate the EOC influences from the augmented data. For this purpose,
