    The same strategy can be considered for the GPD model in order to estimate its
    parameters. Given the maximum samples $X_1, ..., X_t$ over the threshold $u$,
    the log-likelihood function of the GPD under $\xi_P \neq 0$ is defined as follows:


    $$ L_P(\delta_P, \xi_P) = -t \log(\delta_P) - \left(1 + \frac{1}{\xi_P}\right)
    \sum_{i=1}^t \log\left(1 + \frac{\xi_P X_i}{\delta_P}\right) $$


    provided that


    $$ 1 + \frac{\xi_P X_i}{\delta_P} > 0 $$


    where $i = 1, ..., t$. If $\xi_P = 0$, the log-likelihood function of the GPD
    is rewritten in the following form:


    $$ L_P(\delta_P) = -t \log(\delta_P) - \frac{1}{\delta_P} \sum_{i=1}^t X_i $$


    Similar to the GEVD, the maximization of Eqs. (2.13) and (2.15) can be carried
    out by differentiating the log-likelihood functions with respect to the unknown
    GPD parameters, from which one can derive the maximum likelihood estimators by
    means of numerical techniques (Coles et al. 2001).


    # ## 2.2.2 Semi-parametric Extreme Value Model


    All of the above-mentioned extreme value distributions are parametric models.
    This means that modeling of the extreme samples depends on the unknown shape,
    scale, and location, which should be obtained by one of the parameter estimation
    techniques such as the maximum likelihood estimation. The other issue is related
    to the model selection. In other words, unlike the generalized distribution function,
    one needs to use an additional technique to choose the most appropriate function
    among the Weibull, Fréchet, and Gumbel distributions. To address these issues,
    it is possible to consider the concept of the semi-parametric EVT and its single
    distribution function. The great advantage of this theory and function lies in
    the fact that one does not require allocate a parametric model to extreme values.
    Moreover, no parameter estimation technique is needed. To put it another way,
    the semi-parametric distribution modeling depends only on some extreme samples
    by estimating the extreme value index (EVI) from the same samples without any
    parameter estimation technique (Gomes and Guillou 2015). Given the $n$-dimensional
    data $X_1, ..., X_n$, the cumulative distribution function (CDF) of the semi-parametric
    extreme value model is defined as follows:'
  merge: -1
  img_proc: true
- pgno: 49
  md: '\( F(x) = \left\{ \begin{array}{ll} exp\left(-(1+\xi x)^{-\frac{1}{\xi}}\right),
    & \text{if } \xi \neq 0 \\ exp(-exp(-x)) & \text{if } \xi = 0 \end{array} \right.
    \quad (2.16) \)


    where \(\xi\) denotes the so-called the EVI, which is the primary parameter in
    the semi-parametric modeling of the extreme value samples. When \(\xi \neq 0\),
    one can derive the semi-parametric Weibull (\(\xi < 0\)) and Frechet (\(\xi >
    0\)) models. Moreover, the second (bottom) expression in Eq. (2.16) regarding
    \(\xi = 0\) refers to the semi-parametric Gumbel distribution. Therefore, the
    most effort is to estimate the EVI parameter by some estimators. The most famous
    estimator for \(\xi > 0\) is the Hill estimator. Given the order statistics of
    \(X_1, \dots, X_n\), that is, \(X_{n:n} > \dots > X_{1:n}\), the Hill estimator
    is expressed as follows (Hill 1975):


    \(\hat{\xi}_H = \frac{1}{k} \sum_{i=1}^k (\log X_{n-i+1:n} - \log X_{n-k:n}) \quad
    (2.17)\)


    where \(k\) is a number (sample fraction) that separates the extreme values from
    the other ones for the semi-parametric extreme value modeling. The major limitation
    of the Hill estimator is its only applicability to the positive EVI. Since this
    condition limits this estimator for general cases of \(\xi\), some generalized
    EVI estimators were proposed to address this problem. One of them is the moment
    estimator proposed by Dekkers et al. (Dekkers and De Haan 1989), which is expressed
    as follows:


    \(\hat{\xi}_M = \hat{\xi}_H - \frac{1}{2} \left( 1 - \frac{\left(M_{k,n}^{(1)}\right)^2}{M_{k,n}^{(2)}}
    \right)^{-1} + 1 \quad (2.18)\)


    so that


    \(M_{k,n}^{(j)} = \frac{1}{k} \sum_{i=1}^k (\log X_{n-i+1:n} - \log X_{n-k:n})^j
    \quad (2.19)\)


    where \(j=1,2\). The great merit of the moment estimator is its suitability for
    all cases of the EVI; that is, \(\xi \in \mathbb{R}\). In other words, depending
    upon the number of data points selected as the extreme samples, one can obtain
    negative or positive EVIs. This is opposite to the classical Hill estimator, which
    only gives the positive EVI for each case of the sample selection.'
