    one that leads to the smallest AIC amount.


    After selecting the optimum neuron collection, the remaining hyperparameter is
    the neuron number of the encoding layer of the shallow AE in the student learning.
    In this case, it should be mentioned that the choice of a small neuron number
    may not affect positively the learning process. For this issue, the lower bound
    of the neuron size should be greater than \( p \) to allow us to design an overcomplete
    shallow AE. On the other hand, a very large neuron number arises the risk of an
    overfitting problem. Hence, the sum of the optimum neuron collection concerning
    the undercomplete DAE in the teacher learning is set as the optimum value for
    the neuron size of the shallow AE; that is, \( N_S = \sum_{i=1}^7 N_{H_i} \).


