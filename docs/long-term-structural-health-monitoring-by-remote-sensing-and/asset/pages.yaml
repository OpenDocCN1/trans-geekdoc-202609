    # ## 3.4 Early Damage Detection by NNS-EVT and HMC-MD


    Using the training and test matrices of both scenarios, the proposed NNS-EVT and
    HMC-MD methods are applied to assess the current status of the I-40 Bridge. For
    the first scenario, the main steps of NNS-EVT are performed to obtain the absolute
    values of the quantile vector q. Based on the concept of the order statistic and
    confidence interval, the probability of 5% of the SDVs is empirically considered
