    can realize that the augmentation of small displacement points can better show
    the variations in the structure by either the EOCs or damage. Regardless of the
    augmented samples related to Images #44 and #45, a simple graphical comparison
    reveals that the HMC with a fewer sample number than the SLS can better indicate
    the EOCs in the displacement samples, especially their seasonal variability in
    the one-year monitoring program. Nonetheless, the augmented displacement points
    of the two last images obtained from both HMC and SLS techniques clearly differ
    from the other images.'
