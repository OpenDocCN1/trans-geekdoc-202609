    # 4.4 Early Damage Detection by Online Hybrid Learning Methods


    It was mentioned that the proposed online hybrid methods HMC-ODTL-EMD and SLS-ODTL-EMD
    bring a great opportunity to simultaneously carry out the steps of data normalization
    and feature discrimination. In the step of data normalization, the key motivation
    is to develop an online model via the proposed ODTL approach, which is an online
    version of the previously proposed DTL algorithm. According to Fig. 2.12, the
    first stage of ODTL starts by using the first set of augmented displacements (X1)
    regarding the first image under β = 20%. The choice of this percentage'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'for β means that the online learning of ODTL rejects the assumption of the
    healthy state of the structure if the rate of false positive is larger than 20%.
    To put in another way, if any SAR image and its augmented displacement data on
    a specific date makes a false positive rate (percentage) greater than this amount,
    the structure most likely suffered from damage on that date.


    In this regard, Fig. 4.17 illustrates the evolution of the percentage of false
    positive by consecutively applying a SAR image and its augmented displacement
    data. Note that 10 sample neural networks are considered in the iterative algorithm
    of the ODTL. As can be seen in Fig. 4.17, before receiving Image #44, the false
    positive rates (percentages) of the previous images are smaller than β. In some
    cases, the rates correspond to zero, especially in Fig. 4.17b. However, once Image
    #44 and its augmented displacement datasets from HMC and SLS have been used, the
    error rates exceed β in the sense that the online learning and updating the DAEs
    should be ended and online damage detection continues the process by receiving
    any new data, which should treat as test data. Therefore, the DAE updated at the
    43rd iteration is chosen as the last updated network for using in online damage
    detection. On the other hand, the optimal number of consecutive DAEs at each iteration
    of HMC-ODTL-EMD and SLS-ODTL-EMD is depicted in Fig. 4.18. For example, one can
    observe in Fig. 4.18a that the last updated model at the 43rd iteration related
    to Image #43 requires six consecutive DAEs in the HMC-ODTL-EMD algorithm. Additionally,
    as Fig. 4.18b appears, the last updated model at the same 43rd iteration needs
    nine consecutive DAEs from the SLS-ODTL-EMD.


    The last models obtained from both hybrid methods are then used in online damage
    detection. One of the advantages of these methods compared to the other proposed
    techniques is the devoid of classical feature discrimination and damage detection
    based on the comparisons of the novelty indices of training and test data points
    with a threshold. Simply speaking, each of outputs of the HMC-ODTL-EMD or SLS-ODTL-EMD
    helps us to make a decision on any image. On the other hand, it is not necessary
    to collect some information (images) in an offline way and then develop an unsupervised
    learner for damage assessment. In the proposed hybrid methods, it is possible
    to analyze the status of the structure in an online or real-time manner. It is
    worth remarking that the movement from the first stage (online learning) to the
    second (online damage detection) means that the damage occurred in the structure.


    To better demonstrate the process of online feature discrimination for pre-collapse
    prediction or damage detection, Fig. 4.19 indicates the evolution of the EMD quantities
    from the HMC-ODTL-EMD and SLS-ODTL-EMD methods. As this figure reveals, the EMD
    values of Images #44 and #45 are larger than the corresponding values regarding
    the other images. This makes sense that the proposed hybrid methods could accurately
    alarm the occurrence of abnormal changes on 15 and 26 November 2015, roughly one
    month to the partial collapse of the Tadcaster Bridge. Apart from this conclusion,
    one should state that the EMD quantities of Image #45 on 26 December 2015 are
    greater than the corresponding value related to Image #44. This makes sense that
    the proposed online hybrid methods could also estimate the severity of damage
    and trigger the growth of damage (i.e., the scour under the pier close to the
    location “P2”).'
