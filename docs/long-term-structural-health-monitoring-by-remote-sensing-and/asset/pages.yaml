    To obtain the test residual data samples, the learned DAE from the training data
    is used here to predict the network output Ẑ = [ẑ₁ ... ẑₘ]. As such, the new residual
    matrix can be expressed as follows:


    $$ \mathbf{E}_z = |\mathbf{Z} - \hat{\mathbf{Z}}| $$ (2.32)


    For the sake of convenience, Fig. 2.7 illustrates the graphical representation
