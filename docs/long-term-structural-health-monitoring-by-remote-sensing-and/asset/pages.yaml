    # 1.4 Novel Approaches and Contributions


    Despite valuable studies on SHM of various civil structures by using the remote
    sensing technology and SAR images, this book mainly intends to address the major
    limitations and shortcomings of the classical SAR-aided SHM and particularly concentrates
    on long-term monitoring by small displacement data. In this regard, various innovative
    methods in terms of machine learning are proposed as discussed above. Here, it
    is attempted to clarify the major innovations of these methods in an effort to
    facilitate readers to better realize the significance and novelty of this book.
    As the implementation of the classical SAR-aided SHM strategy in a long-term monitoring
    manner consists of three major challenges of small displacement data, the negative
    effects of EOCs, and discriminative damage or novelty2 indices, the underlying
    innovation of this book is to propose hybrid learning methods in terms of unsupervised
    learning. Based on the three major challenges, the innovations of these methods
    can be divided into three categories:


    +   - Category I—Innovations for dealing with the challenge of small data

    +   - Category II—Innovations for dealing with the challenge of EOCs


    2 In machine learning, the term “novelty” refers to an abnormal change in data.
    In some literature, it is defined as “anomaly” or “outlier” (Pimentel et al. 2014).
    However, in this research, a novelty value is representative of a damage index,
    which can represent the difference between two datasets or structural state conditions.'
