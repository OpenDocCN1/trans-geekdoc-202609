- pgno: 46
  md: '(i.e., extreme samples) and model them. Having considered the BM technique
    and random samples X1, ..., Xn, the function G can have three forms: Gumbel, Fréchet,
    and Weibull (Coles et al. 2001; Salvadori et al. 2007):


    ```

    Gumbel: \( G(x) = exp\left(-exp\left(-\frac{x-\lambda}{\delta}\right)\right) -\infty
    < x < \infty \& \delta > 0 \) (2.5)

    ```


    ```

    Frechet \( G(x) = \begin{cases} exp\left(-\left(\frac{\delta}{x-\lambda}\right)^{\xi}\right),
    & \text{if } x \ge \lambda \\ 0 & \text{otherwise} \end{cases} \) (2.6)

    ```


    ```

    Weibull: \( G(x) = \begin{cases} 1 & \text{if } x \ge \lambda \\ exp\left(-\left(\frac{\lambda-x}{\delta}\right)^{\xi}\right),
    & \text{otherwise} \end{cases} \) (2.7)

    ```


    where \(\xi\), \(\delta\), and \(\lambda\) are the shape, scale (i.e., standard
    deviation), and location (i.e., mean) parameters, which are the main unknown parameters
    of the Gumbel, Fréchet, and Weibull distribution models. Hence, it is important
    to properly estimate them in order to have correct extreme value modeling. One
    of the important limitations in applying these functions is the necessity for
    selecting the most appropriate distribution model, which may arise the complexity
    of the process. Note that, it is possible to integrate these extreme value functions
    and reach a single model called generalized extreme value distribution (GEVD),
    which is expressed in the following equation:


    ```

    \( G(x) = exp\left( - \left( 1 + \xi_G \left( \frac{x - \lambda_G}{\delta_G} \right)
    \right) ^{-\frac{1}{\xi_G}} \right) \) (2.8)

    ```


    where \(\xi_G\), \(\delta_G\), and \(\lambda_G\) represent the shape, scale, and
    location associated with the generalized function. The key property of the GEVD
    is the capability of recognizing the type of the classical extreme value distributions.
    In other words, as the GEVD is an integration of the Gumbel, Fréchet, Weibull
    distribution functions, one can define their relationships by using the shape
    parameter. In this regard, if \(\xi_G < 0\), the GEVD is the Weibull-type distribution.
    When \(\xi_G > 0\), the GEVD is based on the Fréchet-type distribution. Finally,
    if \(\xi_G = 0\), it is compatible with the Gumbel-type distribution (Coles et
    al. 2001; Salvadori et al. 2007).


    All the above-mentioned distribution functions are used to model maximum samples
    under the Fisher-Tippet theorem and the BM technique. The other important and
    widely-used extreme value function is based on the generalized Pareto distribution
    (GPD). Similar to the other extreme value distribution models, the GPD is often
    used to represent the tails of extreme samples based on a threshold-based strategy.
    This probability distribution resembles the GEVD in terms of a single model function.
    Generally, the GPD is considered to model extreme samples over a threshold under
    the concept of the POT technique. On this basis, once the adequate extreme samples
    above the threshold have been selected, the GPD model is fitted to such data points
    by estimating the model shape and scale parameters. Let X1, ..., Xt denote t maximum
    samples from n data samples above a threshold level, the GPD model is'
