- pgno: 20
  md: 'Regarding the other types of civil structures, Zhu et al. (2018) explored slow
    ground surface movements regarding building-type structures by extracting and
    interpreting information from InSAR images. In their research, the authors intended
    to directly analyze the persistent scatterer deformations in an effort to find
    anomalies for detecting potential instability risks affecting buildings and infrastructures.
    Macchiarulo et al. (2021) and Giardina et al. (2019) performed damage assessment
    analyses for identifying early signs of tunnelling-induced damage to adjacent
    buildings with different structures, foundations, and position relative to the
    tunnels by using SAR images from COSMO-SkyMed between 2011 and 2015. They extracted
    the vertical displacement/deformation samples from multi-temporal InSAR techniques
    and analyzed them in order to detect the settlement-type damage patterns. Cigna
    et al. (2014) exploited the InSAR methodology based on persistent scatterer interferometry
    (PSI) and the technology of remote sensing via SAR images of COSMO-SkyMed for
    deformation monitoring of historical buildings in the Historic Centre of Rome,
    Italy. Di Carlo et al. (2021) merged multi-temporal DInSAR products and historical
    survey data for health monitoring of building structures in Italy by applying
    SAR images of COSMO-SkyMed between 2011 and 2019. In their work, the authors aimed
    to follow three main tasks including: (i) the displacement extraction from SAR
    images collected over the city of Rome during 2011–2019, (ii) accurate three-dimensional
    geometrical modeling of the external volume of the buildings under monitoring
    and consistent positioning of the identified and investigated persistent scatterers,
    and (iii) analysis and interpretation of the displacement samples of some buildings
    for possible damage detection. They demonstrated that the analysis of displacements
    and mean deformation velocity values enables them to identify possible critical
    conditions for buildings to be monitored.


    In relation to dam structures, Bayık et al. (2021) conducted long-term SAR-aided
    SHM on the Atatürk Dam in Turkey by using different images from ERS, ENVISAT,
    and Sentinel-1. In their long-term monitoring study, the authors utilized 24 and
    33 images of ERS and ENVISAT in the descending orbit between 1992–1999 and 2003–2010,
    114 and 111 SAR images in both ascending and descending orbits between 2016–2019.
    As Sentinel-1 could provide images in both orbits, the main objective of their
    research was to estimate the surface displacements of the dam in the vertical
    and east–west directions by utilizing both line-of-sight displacements. Moreover,
    they studied the relationship between the measured displacements and water levels.
    As their results indicated, there was not considerable relation between these
    parameters and most of the variations in displacements occurred at the dam crest.
    Mura et al. (2018) exploited the remote sensing technology and DInSAR techniques
    for risk assessment and vulnerability analysis of some tailings dams in Brazil
    after a catastrophic collapse in a tailings dam in the vicinity of mining structures
    on November 2015 causing spilling around 32.6 million cubic meters of mining waste.
    In their research, the authors merged small baseline subset (SBAS) and persistent
    scatterer interferometry (PSI) to detect linear and nonlinear ground displacements
    in these structures. For this procedure, they used 48 SAR images from TerraSAR-X
    between 11 November 2015 to 15 May 2017. Miliello et al. (2016) carried out continuous
    long-term monitoring on a dam (i.e., the Pertusillo Dam in Italy) by 198 SAR images
    from'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# 1.2 Literature Review: Existing Knowledge and Existing Gaps


    both COSMO-SkyMed and TerraSAR-X between 2010 and 2015. The main objective was
    to use hydrostatic-seasonal-temporal and hydrostatic-temperature-temporal models
    to interpret the nonlinear deformation at the dam wall through the ground measurements
    together with SAR time-series analysis. In this regard, the authors could find
    that most of the deformation at the dam can be explained by taking into account
    only thermal seasonal dilation and hydrostatic pressure. Di Martire et al. (2014)
    proposed a new DInSAR technique for ground displacement monitoring of an embankment
    dam called the Conza Dam in Italy. The authors utilized 51 SAR images belonging
    to ENVIRonmental SATellite-Advanced Synthetic Aperture Radar (ENVISAT-ASAR) to
    extract the SAR-based ground displacements. Because the ground displacements recorded
    by a network of conventional ground-based sensors installed in the dam were also
    available, they could perform a comparative study in terms of statistical analysis
    to realize the superiority of remote sensing over the traditional contact-based
    sensing. Gama et al. (2020) exploited SBAS and PSI techniques for relatively short-term
    deformation monitoring of the Brumadinho Dam located in Brazil before its collapse
    via 21 SAR images of Sentinel-1 in the descending orbit from 03 March 2018 to
    22 January 2019. During such a relatively short-term monitoring program, the direct
    analysis of the 21 displacement samples regarding the crest, middle, and bottom
    sectors of the dam indicated serious variability, which was an alarm of an adverse
    change (collapse). Jänichen et al. (2022) implemented a study on long-term deformation
    monitoring of the Moehne gravity dam located in Germany and also the radial deformation
    of the dam. In their gravity, the authors exploited the PSI technique for extracting
    the deformation samples from SAR images of Sentinel-1 between 2015 and 2020. They
    concluded that the displacements or deformations of the dam followed a seasonal
    pattern and the PSI technique could achieve reasonable accuracy for health monitoring
    of the dam of interest.


    Due to the important influences of environmental and operational changes (EOCs)
    on civil structures, some authors studied these conditions by using SAR images.
    In this regard, Qin et al. (2017) assessed the impacts of air temperature on displacements
    of two arch bridges with different materials using several SAR images from COSMO-SkyMed,
    TerraSAR-X, and Sentinel 1. Haung et al. (2017) utilized 29 SAR images acquired
    by Sentinel 1 for the health monitoring of a long-term bridge by analyzing longitudinal
    displacement samples alongside thermal analysis under temperature fluctuations.
    Ma et al. (2019) analyzed the dynamic behavior of a high-speed railway bridge
    and investigated the feasibility of measuring settlement and uplift in the unit
    of millimeter by applying SAR images from COSMO-SkyMed. They also modeled the
    temperature variability and attempted to separate the thermal expansion and linear
    deformation. Schlögl et al. (2021) analyzed a relatively large displacement data
    samples of 719 SAR images from Sentinel-1 in both ascending and descending orbits
    regarding a side harbor bridge in Austria (i.e., called Seitenhafenbrücke). In
    their research, the authors performed structural deformation monitoring between
    October 2016 to October 2019 by using many post-processing tools such as cleaning
    and smoothing for reducing outliers in measured displacement samples and also
    seasonal trend decomposition for separating deformation trends from seasonal deformation.'
