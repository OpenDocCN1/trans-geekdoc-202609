    To validate the effectiveness and reliability of the proposed methods, two full-scale
    bridge structures were considered. For the NNS-EVT and HMC-MD methods, a numerical
    study based on the simulation of displacement points of the I-40 Bridge was conducted.
    Furthermore, the other methods were verified in a real-world case study by using
    a small number of displacement data points associated with the Tadjaster Bridge.
    These data points were extracted from a limited number of SAR images of TerraSar-X.


    # 5.2 Main Conclusions


    Drawing from the extensive research presented in the monograph, it becomes evident
    that the traditional direct analysis of displacement data is suboptimal for health
    monitoring of civil structures, particularly long-term SHM. The unpredictability
    in data variation and inherent uncertainties make these conventional techniques
    unsuitable for a reliable and long-term analysis. In contrast, the proposed methods
    in this monograph address these challenges and offer innovative, machine-learning
    based alternatives.


    The NNS-EVT and HMC-MD methods perform well under low variability conditions.
    For larger datasets, NNS-EVT shines as an effective approach. However, when subjected
    to high levels of Environmental and Operational Changes (EOCs), the HMC-MD method
    showed limitations, emphasizing the crucial role of data normalization in yielding
    reliable results. This sets the stage for the introduction of hybrid unsupervised
    learning methods, which combine data sampling, artificial intelligence, and statistical
    analysis.


    The monograph strongly recommends data augmentation techniques such as Hamiltonian
    Monte Carlo (HMC) and Slice Sampling (SLS) for smaller displacement samples to
    better understand the impacts of EOCs on structural responses (i.e., displacements).
    While both approaches demonstrated their ability to account for EOCs, HMC exhibited
    superior performance when assessed through graphical'
  merge: -1
  img_proc: true
- pgno: 119
  md: 'comparisons via Box plot. Nonetheless, when evaluated numerically based on
    the MD measure, both HMC and SLS proved effective. Therefore, it is recommended
    to consider the MAD-based data analysis for the EOC evaluation.


    The advanced hybrid methods, such as HMC-DAE-MD and HMC-UTSL-MD, demonstrated
    their robustness in tackling the challenging aspects of EOCs. The HMC-DAE-MD method
    could deal with the challenge of the EOCs by obtaining discriminative novelty
    indices between the normal and damaged conditions. It was discerned that the DAE-aided
    data normalization along with its hyperparameter optimization minimized the influences
    of the EOCs. In this regard, this method was superior to the HMC-MD.


    In case of considering two threshold estimators based on the CLT and EVT, it was
    perceived that the HMC-DAE-MD gave fewer false positives via the EVT-aided threshold
    determinant in comparison with the CLT-based technique. Although this method with
    the aid of the EVT yielded more false negatives than the CLT, its output was reasonable.
    Totally, the EVT-aided threshold determinant is superior to the CLT-based technique.
    However, it contains more details and parameters, in which case the CLT-based
    threshold determinant is more efficient.


    Adding another layer of complexity and effectiveness, the HMC-UTSL-MD and HMC-DTL-MD
    methods achieved remarkable results in the early detection of structural damage,
    even under high levels of EOCs. The proposed UTSL-based data normalization in
    HMC-UTSL-MD could better minimize the EOC influences compared to HMC-DAE-MD and
    HMC-MD. For this achievement, HMC-UTSL-MD succeeded in accurately detecting early
    damage or predicting the occurrence of collapse even by CLT-aided threshold determinant.
    The proposed HMC-DTL-MD method through the DAE with pre-determined neurons for
    its three hidden layers and the concept of transfer learning could better address
    the problem of the EOC. Even under the classical standard confidence interval,
    this method yielded smaller rate of the false positive and misclassification errors.


    Finally, the proposed online hybrid learning methods not only designed a new SHM
    strategy in an online learning manner but also provided reasonable results of
    early damage detection by stopping the learning process and accurately detecting
    the emergence of damage and predicting the partial collapse. The online hybrid
    methods reasonably triggered the occurrence of damage and the risk of collapse
    before its event.


    In summary, this monograph delivers a comprehensive and rigorous investigation
    of long-term SHM, integrating insights from remote sensing and machine learning
    techniques. By critically assessing the limitations of conventional approaches,
    this work introduces pioneering methodologies that represent a noteworthy advancement
    in the field of health monitoring of civil structures, particularly long-term
    SHM.'
