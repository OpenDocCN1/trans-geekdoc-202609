  md: 'defined as follows:


    \( H(y) = \left\{ \begin{array}{ll} 1 - \left(1 + \frac{\xi_p}{\delta_p}(y-u)\right)^{-\frac{1}{\xi_p}},
    & \xi_p \neq 0 \\ 1 - \exp\left(-\frac{1}{\delta_p}(y-u)\right), & \xi_p = 0 \end{array}
    \right. \)


    where \( u \) is the threshold value for distinguishing the main extreme samples
    from the other data points. Furthermore, \( \xi_p \) and \( \delta_p \) are the
    shape and scale parameters of the GPD, respectively. An important note about this
    probability distribution is that it is modeled by these two parameters, whereas
    the GEVD requires the three parameters (i.e., the shape, scale, and location).
    This makes sense that the extreme value modeling via the GPD needs fewer parameters
    than the GEVD. As the other note, similar to the GEVD, it is feasible to reach
    the classical extreme value distributions based on the shape parameter of the
    GPD. Accordingly, if \( \xi_p = 0 \), \( \xi_p > 0 \), and \( \xi_p < 0 \), the
    GPD is equivalent to the Gumbel, Fréchet, and Weibull models, respectively (Coles
    et al. 2001).


    Maximum likelihood estimation (MLE) is one of the main and important techniques
    for estimating the parameters of the extreme value distribution models. This technique
    is based on defining maximum likelihood estimators and maximizing likelihood functions
    of the mentioned distribution models. For this purpose, logarithmic transformations
    of likelihood functions are often incorporated. Having considered the \( b \)
    maximum samples \( X_1, ..., X_b \) from \( b \) blocks, the log-likelihood function
    of the GEVD under \( \xi_G \neq 0 \) is written as follows (Coles et al. 2001):


    \( L_G(\lambda_G, \delta_G, \xi_G) = -b \log(\delta_G) - \left(1 + \frac{1}{\xi_G}\right)
    \sum_{i=1}^b \log\left(1 + \xi_G \left(\frac{X_i - \lambda_G}{\delta_G}\right)\right)
    - \sum_{i=1}^b \left(1 + \xi_G \left(\frac{X_i - \lambda_G}{\delta_G}\right)\right)^{-\frac{1}{\xi_G}}
    \)


    provided that


    \( 1 + \xi_G \left(\frac{X_i - \lambda_G}{\delta_G}\right) > 0 \)


    where \( i = 1, ..., b \). On the other hand, when \( \xi_G = 0 \), the log-likelihood
    function is formulated as follows (Coles et al. 2001):


    \( L_G(\lambda_G, \delta_G) = -b \log(\delta_G) - \sum_{i=1}^b \log\left(\frac{X_i
    - \lambda_G}{\delta_G}\right) - \sum_{i=1}^b \exp\left(-\left(\frac{X_i - \lambda_G}{\delta_G}\right)\right)
    \)


    The maximization of Eqs. (2.10) and (2.12) with respect to the parameters of the
    GEVD leads to the maximum likelihood estimate of the GEVD. Since there is no'
