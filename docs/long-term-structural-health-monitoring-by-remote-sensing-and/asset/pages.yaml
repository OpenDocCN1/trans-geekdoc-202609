  md: '# # Chapter 3 Simulating Reality: Numerical Assessments of a Bridge Health
    Monitoring


    **Abstract** In contrast to conventional sensing technologies, the preparation
    and extraction of displacement data from a large number of SAR images are not
    trivial. Notably, this process is difficult and time-consuming for long-term monitoring.
    For this issue, this chapter aims to validate the proposed probabilistic unsupervised
    learning method via simulated displacement responses of a numerical model of a
    real-world bridge structure. On this basis, the numerical model of this bridge
    was developed in MATLAB environment. To simulate remote sensing-based SHM, a few
    points in the bridge deck are selected as the target areas for extracting structural
    responses. Three damage scenarios in the vicinity of one the bridge piers are
    simulated to assess whether the proposed probabilistic unsupervised learning method
    can effectively detect such scenarios.


    **Keywords** Numerical model · Displacement simulation · Real-world bridge · Probabilistic
    unsupervised learning · Extreme value theory · Large data


    # ## 3.1 I-40 Bridge: A Box-Girder Bridge


    This section conducts a numerical study for validation of some proposed methods.
    This study is based on a numerical model of a full-scale bridge called the I-40
    Bridge, over the Rio Grande River in Albuquerque, New Mexico, US (Farrar et al.
    2000), as shown in Fig. 3.1a. The finite element model of this bridge was constructed
    to simulate different displacement points and investigate some SHM methods. Because
    the numerical model of the I-40 Bridge has recently been constructed and updated
    (Rezaiee-Pajand et al. 2021), it is considered for validating the proposed NNS-EVT
    and HMC-MD methods.'
