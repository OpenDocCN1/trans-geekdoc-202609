- raw: 'As a consequence of this distinction, an action or a governance system can
    be perceived as legitimate—at least by a segment of the population—even when it
    is explicitly unlawful. Consider the case of exchanging copyrighted content over
    the Internet, which some may view as legitimate despite its illegality. The same
    holds true in the context of blockchain-based systems; many activities there are
    regarded as legitimate even if they violate the protocol’s rules. For instance,
    a hard fork can be considered legitimate because it allows for the possibility
    of innovation and evolution within a particular blockchain ecosystem. Essentially,
    forking is a way for a blockchain community to decide (i.e., to vote) on how the
    blockchain should be upgraded and what direction it should take. Hence, even if
    the resulting network does not adhere to the original protocol, it can still be
    perceived as legitimate because it represents the community’s will. Of course,
    as The DAO attack (chapter 5) has shown, not everyone might agree that a fork
    is legitimate, particularly those who equate legitimacy with legality and consider
    that such an action is an unlawful demonstration of political power. Contentious
    forks might thus result in the emergence of two separate networks (e.g., Ethereum
    versus Ethereum Classic) that compete with each other to acquire the highest level
    of legitimacy and therefore adoption.


    When government actions and decision-making processes are open and accessible
    to the public, it fosters trust and accountability in the governance process,
    thus increasing the likelihood that its outcomes will be accepted.


    Another interesting example that illustrates the potential disparities between
    legality and legitimacy in the blockchain space is the case of MEV, which refers
    to the total value that can be extracted from a set of transactions in a blockchain
    network. MEV arises due to the presence of various economic incentives and opportunities
    that can be exploited by miners and validators in the network. It can become a
    significant challenge in public, permissionless blockchain networks like Ethereum,
    where multiple actors with varying degrees of power and autonomy interact. These
    include miners, validators, searchers, and users—each with their own goals and
    incentives. If these actors compete with each other to extract MEV, this can lead
    to suboptimal outcomes for the network as a whole. For instance, a block producer
    may prioritize certain transactions over others based on their potential for MEV.
    While this is consistent with the rules of the underlying blockchain protocol,
    it can create a sense of unfairness for those who submitted transactions that
    were deprioritized. Additionally, the pursuit of MEV can incentivize block producers
    to engage in activities that may undermine the network’s overall security, such
    as reordering transactions to maximize their gains.


    The legality of MEV practices is generally clear—at least within the legal orders
    of blockchain systems—as they operate within their established rules and protocols.
    However, its legitimacy is a subject of ongoing debate and controversy.


    To address these challenges, various solutions have been proposed among the Ethereum
    ecosystem, including implementing MEV-focused protocols such as Flashbots and
    adopting gas auction systems that allow users to bid for priority in transaction
    processing.


    ## Different Shades of Legitimacy


    In the context of blockchain systems, distinguishing between endogenous and exogenous
    legitimacy is essential for understanding how these networks are adopted. Endogenous
    legitimacy refers to legitimacy that arises from within the blockchain ecosystem
    itself. It is based on the network’s internal mechanisms, consensus protocols,
    and adherence to predefined rules and governance structures. When participants
    within the blockchain community collectively agree on the network’s governing
    rules and processes and have confidence in its security and reliability, endogenous
    legitimacy is established.


    Conversely, exogenous legitimacy pertains to legitimacy that arises from interactions
    with actors outside the blockchain ecosystem. This form of legitimacy is often
    influenced by external factors, such as the need for regulatory compliance and
    legal recognition by traditional institutions. Exogenous legitimacy can be vital
    for bridging the gap between blockchain technology and broader socioeconomic and
    legal systems. When blockchain projects work within established legal frameworks,
    obtain regulatory approvals, and collaborate with recognized institutions, they
    can enhance their exogenous legitimacy, which can in turn boost confidence and
    adoption among a wider audience. At the same time, if the blockchain community
    were to compromise on the ecosystem’s fundamental rules and social norms (e.g.,
    with regard to privacy or decentralization) to comply with external rules and
    regulations, the gain in exogenous legitimacy could result in an erosion of endogenous
    legitimacy.


    Balancing both endogenous and exogenous legitimacy is therefore crucial for blockchain
    systems to thrive and gain acceptance in a rapidly evolving and interconnected
    world. In turn, acceptance and adoption is crucial as blockchain networks depend
    on the existence of network effects for their value and security. In this section,
    we will analyze the various ways in which blockchain systems might enhance their
    endogenous and exogenous legitimacy.


    First, as proposed by Mittiga, it may be useful to distinguish between two separate
    forms of legitimacy: *foundational* and *contingent* legitimacy. Foundational
    legitimacy pertains to a government’s ability to ensure the safety and security
    of its citizens, whereas contingent legitimacy subsists in situations in which
    governments “exercise power in acceptable ways.”


    Applying these concepts in the context of blockchain technology can shed light
    on the multifaceted nature of legitimacy in these polycentric systems. Foundational
    legitimacy in a blockchain system relates to the system’s ability to guarantee
    a secure and effective technological infrastructure. This comprises a blockchain’s
    technical aspects, such as its cryptographic security, consensus mechanisms, and
    resistance to attacks. A blockchain with strong foundational legitimacy is one
    where participants have full confidence in the safety and integrity of the network—that
    is, one that can be successfully assimilated to a “confidence machine.”


    In essence, while foundational legitimacy is concerned with the technical decentralization,
    robustness, and security of the blockchain system, contingent legitimacy addresses
    political decentralization and how power and authority are wielded within the
    network. A blockchain network with both foundational and contingent legitimacy
    is more likely to be accepted, and therefore adopted by the masses, because in
    such networks the underlying governance of the network is addressed to ensure
    that the technological guarantees of the network are not compromised.


    Yet, even if there is evidence of endogenous legitimacy, at the exogenous level,
    more normative conceptions of legitimacy might require evidence that blockchain
    systems guarantee the protection of basic human rights.


    To an extent, norms are evolving and market pressures are emerging that encourage
    tackling environmental harm and creating sustainable energy markets. A large proportion
    of PoW miners have shifted to using renewable energies, and some are arguably
    helping balance loads on electricity grids and reducing energy waste.'
