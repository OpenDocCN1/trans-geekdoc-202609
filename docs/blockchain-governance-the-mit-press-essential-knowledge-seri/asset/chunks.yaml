    这些方面共同确保了高度的可预测性，从而对系统建立了信心。正如尼克·萨博所言，区块链旨在用“公共计算普遍不可变行为的可验证信心”来取代“私人计算中隐秘且任意可变活动的锈蚀”。


    ## 重引信任入场


    正如任何其他社会技术系统一样，自动售货机也难逃骗子的伎俩。存在彻头彻尾的破坏行为，自动售货机可以对此加以防范，但也存在更为复杂的欺骗手段。汤米·格伦·卡迈克尔的例子生动地说明了自动售货机仍然容易受到信任骗局的侵害。


    卡迈克尔的故事传递了一个信息：尽管老虎机（像智能合约一样）似乎提供了完全可预测的程序化动作执行，但它们仍可能被攻破。虽然攻破老虎机只需要一个物理工具，但攻破区块链网络却有多种途径，这揭示了信任与信心之间的相互依存关系。Steem
    区块链的案例便可以说明这一点。


    贾斯汀·孙登场了，这位张扬且精明的中国区块链企业家、创始人兼波场（Tron）区块链网络 CEO。当孙决定收购 Steem 时，他获得了“预挖代币”的权利，这使他在
    Steem 区块链的治理中拥有了重大影响力。作为回应，Steem 社区投票实施了一次软分叉，以阻止孙访问并使用这些预挖代币进行投票，作为一种防止恶意收购的保护机制。然而，孙还有一招杀手锏。利用他在几大加密货币交易所的个人影响力，他调动这些交易所托管的
    Steem 代币选举他信任的见证人，从而有效地夺取了对 Steem 区块链的控制权。


    这是一个引人入胜的插曲：一个区块链社区试图阻止一位有影响力的个人接管区块链网络，却遭遇了“帝国的反击”。


    其次，代币持有者可以对区块链网络施加重大影响，孙持有的大量代币便赋予了他影响区块链治理和选举新见证人的手段。最后，政策制定者和监管机构等外部方可以影响围绕基于区块链的网络运行的行动者网络中的信任关系。例如，监管机构可以打击孙等个别行动者的行为。


    有人可能会辩称，Steem 区块链之所以脆弱，是因为它是一个不完美的“信心机器”。其弱点在于其共识机制的设计。它采用委托制系统而非比特币的 `PoW` 系统，从一开始就依赖信任关系。然而，正如我们将在第
    5 章进一步探讨的那样，即使是以太坊区块链（当时使用 `PoW` 共识机制）也在被称为“The DAO 攻击”的事件后遭遇了严重的信心危机。此外，在以太坊等更健壮的生态系统中，上述不同类型行动者之间的信任关系也会影响信心机器的运行。


    因此，虽然区块链技术显然减少了对信任的需求并增加了对系统的信心，但将其描述为“无信任”系统是错误的，因为信任永远无法被消除。相反，信任分布在一个行动者网络中，使得任何单一行动者都难以单方面违反系统规则。像
    Steem 被接管这样的特殊事件将潜在的信任关系暴露了出来。与其否认这些信任关系的存在，区块链支持者不如正视信任在这些系统中扮演的角色——这既可以被视为一种优势，也可以被视为一种负债。当信任关系破坏区块链网络的完整性时（例如孙利用其在大型交易所的关系），信任就是一种负债。然而，它也有助于拯救和加强网络的完整性，例如为社区对抗攻击提供基础（将在第
    5 章讨论）。


    故事的寓意是，对基于区块链的系统治理的信任是其成为合格“信心机器”的必要条件。为了管理这种信任，区块链社区必须利用链上和链下治理策略及解决方案。改善治理信任的链上解决方案可能涉及实施新型共识机制或更稳健的投票系统，而链下解决方案可能涉及程序性和实质性的社区治理模式。例如，可以建立程序性保障措施，以确定核心开发者和主要代币持有者等关键行动者在推荐协议升级时的行动方针。


    ---


    第 4 章通过从社会学和政治理论的角度探讨信任与信心，质疑了区块链技术所谓的“无信任”本质。章节表明，区块链技术应被视为一种“信心机器”，它置换了信任，但并未消除信任。章节详细阐述了参与区块链治理的行动者的文化价值观和政治信仰如何影响新形成的信任关系。事实证明，信任在区块链治理中仍扮演着重要角色，并强调了区块链治理的重要性。在接下来的章节中，我们将探讨这些及其他形式的区块链治理，它们旨在管理潜在的信任关系，以使信心机器更有效地运行。


    # 5. 例外状态


    > 例外比规则更有趣。规则什么也证明不了；例外证明一切。

    >

    > ——卡尔·施米特，《政治神学》


    ## 等待蛮族


    这位长官统治着广袤帝国边缘一个沉闷的边境定居点。就他记忆所及，该定居点一直和平繁荣。然而有一天，一位名为约尔上校的人到来了，他代表帝国强大的情报机构。长官回忆起他们的初次会面：“我们不讨论他来此的原因。他依据紧急权力而来，这就足够了。”


    诗歌的转折揭示了重要的一点：帝国不仅仅是为了保护自己免受外部危险而应对紧急状态；相反，紧急状态那种可感知的风险构成了其持续存在的权力。正如长官沉思道：“帝国沉没的头脑中只有一个念头：如何不终结，如何不消亡，如何延续其时代。”


    紧急状态要求*暂停*法律，以处理正常法律秩序据称无法应对的情况。


    但什么是例外？这个问题没有直接的答案。也许，用塔勒布的话说，


    汉斯·凯尔森，一位有影响力的奥地利法律哲学家，将法律视为一个涵盖世界上可能发生之事的法律规范体系。它以“如果-那么”的方式运作。如果你偷窃，那么你将受到制裁。该体系具有等级制度：针对特定事件的低层级法律从属于更高层级、更普遍的法律。在最高层级，凯尔森假设存在一个“基本规范”。


    2016 年夏天，一场不那么学术版本的辩论因建立在以太坊区块链上的第一个 DAO——被称为 The DAO——而在互联网上激烈展开。The DAO 旨在成为一个不可阻挡的组织，一台自我运行的机器。它不由公司章程和法典统治，而是由自我执行的智能合约和区块链代码治理。


    ## 代码自我运行


    '
