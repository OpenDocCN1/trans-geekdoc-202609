  trans: '

    紧随其后的是加密货币交易所和托管钱包。由于 Coinbase 或 Binance 等强大的交易所控制着用户的私钥，它们能够有效地监管交易。政府已意识到交易所的这一关键职能，并已为加密货币交易所的合法运营实施了
    KYC（了解你的客户）、AML（反洗钱）和 CTF（反恐融资）法规。未来，这甚至可能导致这样的局面：特定地址或区块链钱包被“白名单”化，而其他地址则被“黑名单”化。在
    FTX 丑闻之后，预计将会出现对加密货币交易所更全面的监管。然而，这种监管方式也有其局限性，因为不同意这些规则的客户可以选择在监管较宽松的司法管辖区运营的交易所，甚至去中心化交易所进行交易。


    第三，甚至人也可能成为区块链监管的目标，最著名的便是开发者和最终用户。第 6 章讨论的 Tornado Cash 制裁已将这一问题明确提上日程。Tornado
    Cash 的开发者不仅在美国和荷兰遭到起诉和监禁，美国公民、居民和注册公司与 Tornado Cash 智能合约进行交易也已成为非法。任何被发现违反这些制裁的人都将承担刑事责任。当然，由于区块链网络的假名性质，通常很难（但并非不可能）识别出谁与智能合约进行了交易。这些法规的另一个局限性在于它们受限于特定司法管辖区，开发者只需搬到监管制度较宽松的地方即可。然而，当美国等强国实施这些规则时，其影响力可能超越当地司法管辖区，正如
    Tornado Cash 制裁导致全球的出块者和交易所审查来自或指向这些智能合约的交易所表明的那样。


    因此，国家可以间接但相当有效地监管基于区块链的系统。但代价何在？正如我们在第 7 章讨论的那样，严格的监管可能会影响基于区块链的系统的合法性，这可能会促使人们退出某些系统，在别处寻找更好的监管制度。这也引发了公平性问题。与在大公司工作的开发者不同，从事开源软件开发的区块链开发者可以提出变更，但对哪些变更被纳入代码库几乎没有决定权。因此，让单个开发者为一个开源项目的变更负责，是否公平？该项目的代码源于许多人的许多决策。正如匿名用户开始从
    Tornado Cash 智能合约向知名公众人物（如电视主持人 Jimmy Fallon）的钱包发送少量以太币所证明的那样，个人责任也存在结构性局限。这些行为表明，尽管
    Fallon 在形式上承担责任，但他无法控制发往其账户的交易，这使得归责变得极具挑战性。


    最终，遵循“代码即监管”模式的日益严格的监管可能会破坏基于区块链的系统的创新潜力。首先，它可能推动向更中心化的方向发展，并抑制治理实验和创新，因为社区将经历更少的自主权。例如，人们作为代币持有者可能不太倾向于支持区块链治理流程，因为他们可能害怕承担责任负担。其次，它也可能产生不利的“逐底竞争”效应，因为人们可能选择退出监管更严格的系统，在网络国家这片冒险的自由天堂中寻找新的“乐土”，使更激进的系统进一步远离监管审视。


    上述困境迫使我们思考：区块链治理是否挑战了监管技术的既定方式？如果“代码即监管”被证明适得其反，区块链社区、法律和政治学者以及政策制定者是否需要寻找更好的监管环境？也许区块链在控制论系统庇护下提出了监管的核心问题：监管仍然是法律制度纪律的职能，还是正在成为分布式控制的职能？这将意味着区块链系统和国家立法相互适应，作为两个不同的有机体运作，需要建立新的协调和控制关系。


    一个促进这一相互适应过程的有前景的方法是建立监管沙箱，允许对新颖的治理形式进行受控实验。想想古希腊的联邦结构，许多较小的城邦实例可以尝试激进的新政府形式。监管沙箱意味着一个限定范围的监管制度，例如，仅限于特定的地域或领域，允许在治理领域拥有更大的灵活性和实验空间。它允许在一个受控环境中，人们可以尝试新技术和商业模式，同时豁免某些现有的金融法规和法律要求。例如，在沙箱中，首次代币发行（ICO）可能被合法化，前提是它们满足特定标准，这邀请从业者进行创新以满足这些标准，同时给予法规时间去适应以容纳这些技术创新。


    监管沙箱有助于寻找在“代码规则”和“法律规则”下的法规之间建立“功能等效性”和“监管等效性”的方法。功能等效性确立两个技术工件的等效性，一个受法律规则管辖，另一个尚未受法律规则管辖。一个相关的例子是确立纸质合同与电子合同的等效性。监管等效性意味着确立一个监管制度与该监管制度政策目标的技术实现之间的等效性。例如，部署在公共区块链上的
    DAO，拥有图形用户界面使外行能够监控关键智能合约变量和交易，并通过公共网页访问通俗易懂的“章程”，可以被认定等同于公司注册处的商业备案。可以说，这种技术实现可以满足公司治理制度中所体现的公开性和透明度政策目标。


    因此，监管沙箱可以带来国家法规与区块链治理之间更具建设性的相互调整形式。然而，鉴于区块链社区无法被强迫进行这种相互调整，应创造激励其参与的条件。这种基于激励而非强制的方法，可能在不抹杀其创新潜力的前提下，驯服区块链治理的潜在危险。


    这里的一个重要杠杆点是塑造基于区块链的系统链上和链下治理的社会规范，这些规范可能受到外生因素的影响。社会规范对治理的强烈影响可以通过 Bitcoin 和 Ethereum
    的差异来证明。Bitcoin 社区强调不可篡改性和“代码即法律”原则的价值，而 Ethereum 社区已演变为将分布式共识置于前台，使系统能更灵活地适应新环境。

