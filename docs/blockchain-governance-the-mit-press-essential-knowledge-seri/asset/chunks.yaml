  fmt: '

    # Bitcoin''s Decentralized Ledger


    Bitcoin’s decentralized ledger comes with specific features that enable the establishment
    of a shared history between all network nodes. The problem in most peer-to-peer
    networks is that there is no agreed-upon notion of time, making it impossible
    for network participants to agree upon the order of messages they receive. To
    avoid double spending, where the same transaction is sent to two different users
    at the same time, Bitcoin introduces a mechanism to collectively keep track of
    the order of transactions by linking blocks one after the other. Every block of
    transactions is uniquely identified through its cryptographic hash (i.e., a digital
    fingerprint unique to that block) ![Figure 2 Diagram of a blockchain.](`images/14994__000_fig_002.jpg`)


    Figure 2 Diagram of a blockchain.


    ## Immutability and Security


    The content of the Bitcoin blockchain can only be updated in an append-only manner,
    by adding information to it, but it cannot be retroactively altered or modified,
    at least in theory. The combination of cryptographic hashes and Merkle trees,
    along with other cryptographic primitives such as public-private key cryptography
    and digital signatures, makes it virtually impossible for anyone to tamper with
    the data recorded on the Bitcoin blockchain. If a malicious user were to try and
    modify the content of a Bitcoin transaction, this would invalidate the digital
    signature associated with such a transaction, which will therefore be rejected
    by the network. Moreover, even if the user could recreate a valid digital signature
    (by controlling the corresponding private key), modifying any transactions in
    a block would necessarily require recalculating the hash of the block in which
    the transaction has been stored—and therefore also the hash of all the following
    blocks in the chain, whose reference to the previous block would otherwise be
    broken. This makes blockchain-based applications particularly well suited for
    applications where data integrity is of paramount importance, such as in the case
    of financial transactions.


    ## Proof of Work and Mining


    In practice, however, a malicious user could still modify a blockchain’s history
    by recalculating the hashes of all the following blocks in the chain. While the
    exercise might be tedious, it could be potentially achieved with a limited amount
    of computational power. In Bitcoin, this problem is solved by means of the PoW
    algorithm. Nakamoto introduced a particular implementation of PoW, in which network
    participants compete to solve a cryptographic puzzle, whose difficulty is adjusted
    based on the amount of computational resources currently engaged in the network.
    Solving that puzzle is a precondition for anyone to be able to submit a new block
    to the network.


    Hence, even though all network participants are responsible for verifying and
    validating transactions, only some of these participants—called miners—are also
    responsible for creating blocks of transactions (figure 3) that will be added
    to the Bitcoin blockchain. In order to propose a new block to the network, miners
    need to find the solution to a mathematical puzzle that requires an increasing
    amount of computational power, as the number of miners increases. The puzzle consists
    in finding a particular “nonce” to insert in the header of a block, in order to
    ensure that the resulting hash for that block is sufficiently small. The difficulty
    of this puzzle is determined by the Bitcoin protocol and evolves over time in
    order to ensure that a new block is added, on average, every ten minutes. If blocks
    are created too fast, the Bitcoin protocol will increase the difficulty of the
    puzzle; vice versa, if blocks take too long to be created, the Bitcoin protocol
    will automatically decrease the difficulty. Miners engage in this computational
    effort because the first one to solve the mathematical puzzle, and therefore to
    create a new block, is rewarded with a specified amount of Bitcoin (the block
    reward), as well as the transaction fees for all transactions included into the
    block, as a compensation for their efforts. This creates a race among miners,
    who are economically incentivized to expend significant amounts of computational
    power in order to be the first to find a new block.


    ![Figure 3 Diagram of a block of transactions.](`images/14994__000_fig_003.jpeg`)


    Figure 3 Diagram of a block of transactions.


    ## Decentralization and Pseudonymity


    As a consequence of these features, blockchain systems are described as being
    *technically distributed* across numerous nodes instead of centralized in servers
    controlled by a single operator. As all transactions are replicated and distributed
    across the network participants, there is no single point of failure, and consequently
    the network is resilient against attacks and censorship. Instead of an operator
    being able to unilaterally change software without the authorization of users,
    blockchain networks are noncoercive as participants must actively accept any proposed
    changes and can decide to fork a protocol rather than accept changes. Relatedly,
    as network nodes verify and validate all transactions submitted to the network,
    the existence of transactions is transparent and traceable. At the same time,
    despite this transparency of transactions, participants can engage with a network
    without using their real-world identities. In other words, these networks allow
    for pseudonymous participation.


    Bitcoin is a new form of digital cash whose “production and transaction is constrained
    by expenditure” of computational energy.


    ## 51% Attack Vulnerability


    Finally, while Bitcoin is decentralized at the infrastructural level, it is not
    necessarily so at the operational level since it is difficult to know who ultimately
    controls the nodes in the network. Yet, the degree of decentralization of a blockchain
    network is crucial to its overall security and sustainability. Both PoW and PoS
    blockchains are vulnerable to the so-called 51 percent attack, where an attack
    to the network can be executed by a single entity controlling over 50 percent
    of the computational power (in the case of PoW) or over 50 percent of the overall
    stake in the network (in the case of PoS).


    ## Ethereum and Smart Contracts


    The rise of Bitcoin spurred the emergence of other blockchain-based networks like
    LiteCoin (2011), NameCoin (2011), and, most notably, Ethereum (2014)—the brainchild
    of Vitalik Buterin. As the teenager editor of *Bitcoin Magazine*, one of the first
    publications dedicated to cryptocurrency and blockchain technology, Buterin realized
    that blockchain technology could be used not only as a ledger for cryptocurrency
    transactions but also as a means to deploy software code that could be used to
    automate these transactions. This opened up the possibility for any type of decentralized
    applications (DApps), even ones that could manage entire organizations of people.


    Buterin designed Ethereum as the underlying infrastructure for a “world computer,”
    where anyone could deploy code that could be used to power many different types
    of DApps. The particularity of Ethereum is that it features a built-in Turing-complete
    programming language allowing for code to be executed, in a distributed manner,
    by all nodes on the Ethereum blockchain.


    Ethereum’s core idea is the closest implementation of what cypherpunk Nick Szabo
    had originally characterized as a “smart contract.”

    '
  trans: '

    # 比特币的去中心化账本


    比特币的去中心化账本具有特定功能，可在所有网络节点之间建立共享历史。大多数点对点网络的问题在于，缺乏商定的时间概念，这使得网络参与者无法就他们接收到的消息顺序达成一致。为了避免双重支付（即同一笔交易同时发送给两个不同用户），比特币引入了一种机制，通过将区块一个接一个地链接起来，共同记录交易顺序。每个交易区块都通过其加密哈希（即该区块独有的数字指纹）进行唯一标识
    ![图 2 区块链示意图.](img/14994__000_fig_002.jpg`)


    图 2 区块链示意图。


    ## 不变性与安全性


    比特币区块链的内容只能以仅追加的方式更新，即通过添加信息，但至少在理论上不能追溯性地更改或修改。加密哈希和梅克尔树的结合，以及公私钥加密和数字签名等其他加密原语，使得任何人几乎不可能篡改记录在比特币区块链上的数据。如果恶意用户试图修改比特币交易的内容，这将使与该交易关联的数字签名失效，因此该交易将被网络拒绝。此外，即使用户能够重新创建一个有效的数字签名（通过控制相应的私钥），修改区块中的任何交易也必然需要重新计算存储该交易的区块的哈希值——从而也需要重新计算链中所有后续区块的哈希值，否则它们对前一个区块的引用将会中断。这使得基于区块链的应用程序特别适合数据完整性至关重要的应用场景，例如金融交易。


    ## 工作量证明与挖矿


    然而在实践中，恶意用户仍然可以通过重新计算链中所有后续区块的哈希值来修改区块链的历史。虽然这项工作可能很繁琐，但理论上可以用有限的算力来完成。在比特币中，这个问题通过
    PoW 算法得以解决。中本聪引入了一种特定的 PoW 实现，其中网络参与者竞争解决一个加密谜题，其难度根据网络中当前投入的计算资源量进行调整。解决该谜题是任何人向网络提交新区块的前提条件。


    因此，尽管所有网络参与者都负责验证和确认交易，但只有其中一部分参与者——称为矿工——还负责创建将被添加到比特币区块链中的交易区块（图 3）。为了向网络提议一个新区块，矿工需要找到一个数学谜题的解，随着矿工数量的增加，该谜题需要越来越多的算力。该谜题在于找到一个特定的“随机数”插入区块头中，以确保该区块产生的哈希值足够小。该谜题的难度由比特币协议决定，并随时间变化，以确保平均每十分钟添加一个新区块。如果区块创建得太快，比特币协议将增加谜题的难度；反之，如果区块创建耗时太长，比特币协议将自动降低难度。矿工投入算力进行竞争，因为最先解出数学谜题、从而创建新区块的人，将获得特定数量的比特币（区块奖励），以及该区块中所有交易的手续费，作为对其付出的补偿。这在矿工之间形成了一场竞赛，他们受到经济激励，投入大量算力以争取成为第一个找到新区块的人。


    ![图 3 交易区块示意图.](img/14994__000_fig_003.jpeg`)


    图 3 交易区块示意图。


    ## 去中心化与假名性


    由于这些特性，区块链系统被描述为在技术上*分布*在众多节点上，而不是集中在由单一运营商控制的服务器中。由于所有交易都在网络参与者之间复制和分发，因此不存在单点故障，因此网络能抵御攻击和审查。区块链网络是非强制性的，参与者必须主动接受任何提议的更改，并可以决定分叉协议而不是接受更改，这与运营商能够在未经用户授权的情况下单方面更改软件形成对比。相关地，由于网络节点验证和确认提交给网络的所有交易，交易的存在是透明且可追溯的。同时，尽管交易具有透明性，参与者仍可以在不使用真实身份的情况下参与网络。换句话说，这些网络允许假名参与。


    比特币是一种新形式的数字现金，其“生产和交易受到计算能量支出的制约”。


    ## 51% 攻击漏洞


    最后，虽然比特币在基础设施层面是去中心化的，但在操作层面未必如此，因为很难知道究竟是谁控制了网络中的节点。然而，区块链网络的去中心化程度对其整体安全性和可持续性至关重要。PoW
    和 PoS 区块链都容易受到所谓的 51% 攻击，即单一实体控制超过 50% 的算力（在 PoW 情况下）或网络中超过 50% 的总权益（在 PoS 情况下）时，可以对网络发起攻击。


    ## 以太坊与智能合约


    比特币的崛起刺激了其他基于区块链的网络的出现，如莱特币（2011）、域名币（2011），以及最著名的以太坊（2014）——这是 Vitalik Buterin
    的心血结晶。作为*比特币杂志*的少年编辑，该杂志是最早专注于加密货币和区块链技术的出版物之一，Buterin 意识到区块链技术不仅可以用作加密货币交易的账本，还可以作为部署软件代码的一种手段，用于自动化这些交易。这为任何类型的去中心化应用（DApps）打开了大门，甚至包括那些能够管理整个人类组织的应用。


    Buterin 将以太坊设计为“世界计算机”的底层基础设施，任何人都可以在其中部署代码，用于驱动许多不同类型的 DApps。以太坊的特殊之处在于，它内置了一种图灵完备的编程语言，允许代码以分布式方式由以太坊区块链上的所有节点执行。


    以太坊的核心理念是密码朋克 Nick Szabo 最初定义的“智能合约”最近的实现。

    '
