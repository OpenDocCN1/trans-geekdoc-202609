    # 作者


    ## 普里马韦拉·德·菲利皮


    普里马韦拉·德·菲利皮是巴黎国家科学研究中心的研究主任，以及哈佛大学伯克曼-克莱因互联网与社会中心的教职研究员。她的研究聚焦于元宇宙、Web3、区块链技术和人工智能的法律挑战与机遇。她是*区块链与法律*一书的合著者，该书于
    2018 年由哈佛大学出版社出版，她最近还获得了欧洲研究委员会 200 万欧元的资助，以研究区块链技术如何通过增强信心和信任来改善制度治理。


    ## 瓦塞尔·赖耶斯


    瓦塞尔·赖耶斯是维也纳大学哲学系的博士后研究员。瓦塞尔目前的研究探讨新兴技术对公民身份的影响，尤其是来自社会信用体系的影响。此外，他探索分布式治理的本质，调查其潜力及其陷阱。他是*叙事与技术伦理*的合著者和*诠释技术*编著卷的联合编辑。


    ## 莫谢德·马南


    莫谢德·马南是欧洲大学院罗伯特·舒曼高等研究中心的博士后研究员。莫谢德目前正在开展关于区块链治理与监管、平台合作社和数据合作社的跨学科研究。他目前正在探索宪法和公司治理理论在区块链治理中的应用。他是*登出
    _ 技术抵抗与去中心化词汇表*编著卷的联合编辑、*COALA DAO 示范法*的合著者，以及*欧洲公司设立自由 (EU/EEA)*的合著者。


