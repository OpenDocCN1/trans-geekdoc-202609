    One of the first attempts at creating anonymous digital cash can be traced back
    to David Chaum, one of the most influential members of the cypherpunk movement.
    Chaum’s doctoral dissertation explored the use of cryptography to create trusted
    networks of untrusted nodes. In 1989, he attempted to operationalize his theoretical
    insights through the development of a new digital currency system—which he called
    DigiCash—using cryptographic techniques to allow for anonymous and untraceable
    transactions. DigiCash came with many significant benefits for users interested
    in financial privacy and merchants interested in a secure way to engage in commercial
    transactions online. However, as opposed to today’s cryptocurrencies, DigiCash
    required a central authority to act as a trusted intermediary for all electronic
    transactions. Chaum managed to enter into commercial partnerships with a few banks,
    but DigiCash failed to gain greater traction.


    DigiCash enabled users to anonymously withdraw digital notes from their bank so
    that they could subsequently be exchanged off market, or directly send payments
    of any value to third parties. The project gained attention among the cypherpunk
    community, but governments and merchants were concerned about the anonymity it
    provided. Many banks saw it as a competitive product rather than as an opportunity
    to improve their services to their clients, and most consumers simply did not
    understand the need for digitally mediated transactions. As the project failed
    to gain more mainstream adoption, Chaum’s company went bankrupt in 1998.


    The cypherpunks were undeterred by this setback. Other attempts were made at creating
    decentralized digital cash. Wei Dai and Nick Szabo proposed alternative implementations
    of digital currencies (known as b-money and BitGold, respectively) using proof
    of computation (proof of work, PoW) to secure the issuance of new currency. Yet,
    both approaches suffered from the double-spending problem, enabling users to fool
    the network to spend the same money twice. Building upon these initial developments,
    in 2004, Hal Finney created an anonymous currency called RPOW, where users could
    only be identified through their cryptographic keys. However, like Chaum’s DigiCash,
    RPOW also relied on a centralized system in charge of ensuring that no one could
    spend more money than they actually have. As such, it failed to fulfill the requirement
    of being completely autonomous and independent from any central authority.


    While the cypherpunks were still working on the design of secure and anonymous
    digital cash, the world went through a period of great turmoil. The global financial
    system had expanded the range of new financial products, like collateralized debt
    obligations, whose collaterals had become increasingly risky. The whole edifice
    of globalized finance came tumbling down on September 15, 2008, when the large
    American investment bank Lehman Brothers filed for bankruptcy. This triggered
    a series of bailouts, as governments decided to inject billions of dollars of
    public money to prevent the collapse of the global financial system. This reinforced
    the convictions of the extropians and cypherpunks: centralized powers—be they
    banks or governments—could and should not be trusted. The cypherpunk revolution
    was about to be unleashed.


    On October 31, 2008, Finney’s attention was drawn to an email sent to the cypherpunk
    mailing list, by an anonymous contributor known as Satoshi Nakamoto. “I’ve been
    working on a new electronic cash system that’s fully peer-to-peer, with no trusted
    third party,” Nakamoto wrote, with a reference to a paper titled “Bitcoin: A Peer-to-Peer
    Electronic Cash System.”


    Bitcoin also built upon the work of physicist Scott Stornetta and cryptographer
    Stuart Haber, who—already in the 1990s—had devised a system relying on a network
    of dispersed but interconnected copies of a shared ledger in order to solve the
    problem of time stamping and authenticity in the digital realm. Their solution
    was to record data into a series of time-stamped digital “blocks,” each referencing
    the “hash” (i.e., the digital digest) of the previous block so that altering information
    in one block would require altering all the blocks connected afterwards. They
    called this technology a “blockchain”—and they went on to create the first blockchain
    that ever existed.


    Nakamoto combined all these primitives together with advanced peer-to-peer technologies,
    cryptography, and game theoretical incentives to generate a decentralized, secure,
    verifiable, and immutable ledger for financial transactions.


    A few months after Nakamoto’s email, the ideas described within his white paper
    had been translated into software. Nakamoto launched the Bitcoin network on January
    3, 2009, with the creation of the first genesis block, which generated the first
    set of Bitcoins allocated to Nakamato’s address. Embedded within the first block
    was the headline of an article from *The Times* newspaper: “Chancellor on brink
    of second bailout for banks”—a message revealing the motivations behind the creation
    of Bitcoin while also providing proof regarding the network’s launch date.


    Today, Finney is known as the person who received the first Bitcoin transaction,
    on January 12, 2009. Perhaps more than anyone else, he immediately saw the great
    promise of Nakamoto’s invention.


    Over the years, Bitcoin gained increased popularity, and—despite its volatility—by
    2011 there were already a few businesses accepting Bitcoin as a form of payment
    as well as a few organizations, like Wikileaks, accepting donations in Bitcoin.
    This is also the year in which Nakamoto retired from the Bitcoin project, and
    the community has since been led by a small number of core developers. With its
    ability to provide a global, decentralized, and censorship-resistant monetary
    system that operates outside of any governmental control, Bitcoin is an important
    step toward realizing the vision of both the cypherpunks and the extropians. Nakamoto’s
    association with these groups suggests that they may have influenced the creation
    of Bitcoin. At the same time, while Nakamoto was an early adopter and supporter
    of both movements, there is no evidence that Satoshi is still active in either
    community.


    ## The Technology


    By cleverly combining existing innovations, Nakamoto’s Bitcoin solved three problems
    all at once. First, it eliminated the need for a centralized issuing authority
    (the mint) by introducing a protocol of decentralized money issuance based on
    individual contributions to a peer-to-peer network (figure 1). Second, it solved
    the need of having a centralized authority to address the double-spending problem
    by means of a decentralized ledger with a guaranteed, tamper-resistant, and shared
    history of time-stamped transactions. Third, it solved the security problem by
    means of an incentivization system (PoW) that automatically increases the security
    of the network as the network’s value increases. Simply put, Bitcoin combines
    the functionalities of a mint, a bank, and a currency in one decentralized network.


    ![Figure 1 Client server architecture and peer-to-peer architecture.](images/14994__000_fig_001.jpg)


    Figure 1 Client server architecture and peer-to-peer architecture.

