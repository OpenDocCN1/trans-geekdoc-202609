- raw: 'The Parity bug was a vulnerability in the library smart contract code of Parity
    multisig wallets (i.e., wallets that require multiple signatures to authorize
    transactions). In November 2017, an anonymous attacker exploited this vulnerability
    to gain control over the library smart contract with the sole purpose of destroying
    it by calling the *self-destruct* function. All multisig wallets that depended
    on this library thus became inoperative, resulting in the freezing of more than
    USD 150 million worth of Ether at the time. The incident significantly impacted
    Ethereum governance as it highlighted the importance of code audits and security
    measures in blockchain technology. It also led to a debate within the Ethereum
    community about the best way to handle such incidents and whether or not it would
    make sense to again intervene by means of a hard fork to bring the smart contract
    library back to life, thereby enabling the frozen funds to be returned to their
    rightful owners. Ultimately, in contrast to the decision taken in the aftermath
    of The DAO attack, the Ethereum community decided not to implement a hard fork,
    thus preventing anyone from retrieving the frozen funds.


    The reasons for this decision are multifaceted. First, the actual amount of Ether
    involved in the Parity incident was much lower than in The DAO attack (500,000
    ETH versus 3.6 million ETH). Second, while a decision on The DAO attack had to
    be taken within a short time frame, the community had a longer time frame to consider
    their approach to the Parity bug. Third, and perhaps most importantly, the Parity
    bug didn’t affect Ethereum overall but was a more isolated security failure regarding
    a particular smart contract. But who is to decide on the severity of a network
    crisis? Who has the power to decide whether the execution of a smart contract,
    albeit perfectly compliant with the rule of code, should be reverted in the name
    of rule of law concepts like theft or protection of private property?


    A more robust, formalized, and transparent governance system appears to be desirable
    as it could specify an appropriate mechanism for deciding and resolving exceptions.
    A range of governance approaches could be adopted, from preserving the informal
    status quo to implementing forms of delegation. In the latter, a community agrees
    on the rules and constraints that establish an “emergency regime.” This assigns
    a narrow set of powers to a predefined group of delegates to frame approaches
    to resolving an exception, which network actors will then consider and implement.


    However, formalizing such a procedure comes with problems if not approached carefully.
    For instance, if the Ethereum community were to establish a particular regime
    for fund recovery, assigning broad powers to a predefined group of delegates over
    whether or not to reverse a transaction, this would mean officially giving up
    on the immutability guarantees of the Ethereum blockchain. While these powers
    could be formally limited in terms of time (e.g., emergency decision-making powers
    for a defined period, extended by majority vote of community) and scope (e.g.,
    excluding particular types of decisions), this would only tame but not prevent
    the emergence of a new latent sovereign power in a system that was precisely designed
    to be devoid of any sovereign. It would also involve abandoning commitments to
    decentralization since such a mechanism would, by design, involve coercing other
    network actors.


    It is for this reason that several blockchain communities have begun adopting
    off-chain governance mechanisms that are substantive in nature, most notably drafting
    “constitutions” and “codes of ethics” to articulate shared values that they agree
    to be bound by even in the absence of coercion. A commitment to features like
    decentralization and ethical approaches like “inclusiveness” not only help cultivate
    “civic values” but also involve substantive processes that require moving beyond
    preserving the positivist legal order encoded in a blockchain protocol or DAO.


    * * *


    \* \* \*


    Departing from a discussion of blockchain as a code-based legal order that “runs
    itself,” this chapter turned to legal theory to expose the challenges raised by
    states of exception in blockchain-based systems. It outlined the scholarship on
    sovereignty and the state of exception, focusing on the works of Kelsen and Schmitt.
    It continued with an exposition of The DAO attack, elaborating on the events and
    actors involved in this state of exception. Blockchain technology—despite its
    promises—does not eliminate all risks of centralization through coalescence of
    private interests, meaning that the specter of the exception remains. The next
    chapters will delve deeper into the kind of legal order generated by blockchain
    technology, questioning the extent to which it is alegal and how it may produce
    both legal and legitimate forms of governance.


    # 6


    # Alegality


    Every command slaps liberty in the face.


    —Mikhail Bakunin, *Oeuvres*


    ## Pax Bitcoinica


    What would it be like to live in a libertarian utopia? Imagine you are a digital
    nomad, living in what Balaji Srinivasan calls the network state of Bitcoinica.
    You wake up in an apartment belonging to Bitcoinica and decide to fly to another
    property owned by this network state in the city of Berlin. At the airport, you
    identify yourself to the authorities with your Bitcoinica passport, which uses
    zero-knowledge proofs to verify your Bitcoinica citizenship without requiring
    you to reveal other personal details. You then travel to the Bitcoinica makers’
    hub in the neighborhood of Kreuzberg, where you make payments to a Bitcoinica
    smart contract to reserve desk space and buy coffee. At your desk, you use your
    private key to enter the Bitcoinica metaverse, where you can work and unwind with
    Bitcoinica citizens from all over the world.


    In the summer of 2022, the former chief technology officer of Coinbase, Balaji
    Srinivasan, captured this futuristic idea in a manifesto. Srinivasan argues that
    we find ourselves in a pivotal moment, in which humankind should shed the nation
    state in favor of the network state.


    Srinivasan’s audacious call for an online community to bootstrap an entire state
    could be dismissed as a form of speculative fiction. Yet, the new political imaginary
    it invokes is only possible due to the substrate provided by blockchain networks.
    The intuition is that if the creation and circulation of Bitcoin can wrest control
    over monetary and financial policy, then “self-sovereignty” in other domains could
    also be attainable—including the eventual creation of entirely new states. That
    he considers Bitcoin to be a type of global sovereign is clear from his coining
    of the term *Pax Bitcoinica* to describe how Bitcoin, through its very existence,
    becomes a government of governments, as it “sits above every state and constrains
    it from printing infinite quantities of money, from lawlessly seizing the funds
    of its citizens, and from waging forever war. In doing so, it limits that which
    will never limit itself.”


    ## The Notion of Alegality


    In 2014, Gavin Wood delivered a presentation on the concept of alegality. After
    having asked the audience what they understood by the term, he explained that
    it was “something which just doesn’t care . . . cannot care . . . as to whether
    its actions might be interpreted as legal or might be interpreted as illegal.”


    In the years since Wood’s talk, the term “alegal” has quietly been adopted by
    crypto enthusiasts and interpreted in different ways. It has been used to explain
    the ambiguous or silent position of states to the legality of Bitcoin as well
    as to contend that alegality can be leveraged to achieve political objectives.
    Most significantly, the concept of alegality inspired the creation of The DAO
    a few years down the line.'
