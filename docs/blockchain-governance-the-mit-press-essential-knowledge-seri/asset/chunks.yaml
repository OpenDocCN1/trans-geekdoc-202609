    and severally liable, in the case of Ooki DAO, given that many token holders were
    not active participants in the DAO, the court considered that liability would
    only be imputed to token holders who effectively exercised the governance rights
    associated with these tokens. Using their tokens to influence the activities of
    the DAO means that they are voluntarily becoming a member of the unincorporated
    association that governs the Ooki protocol. As a result, even though only the
    founders were held responsible for violating laws in the Ooki DAO case, the case
    suggests that in the future, all active token holders of a DAO could be held personally
    accountable for any illegal actions taken by the DAO, not just the founders. Because
    of these measures, anyone who interacts with the smart contract addresses will
    be held strictly liable, meaning there is no need to prove ill-intention or even
    awareness of the sanctions.


