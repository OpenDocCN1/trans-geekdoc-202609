- raw: "> Indeed, while data recorded on a blockchain will remain forever accessible\
    \ to all (at least as long as the blockchain network remains operative), it is\
    \ also possible to record information on a blockchain through the use of hashes.\
    \ This digital fingerprint constitutes an incorruptible proof that the file existed\
    \ at that point in time in which the hash has been recorded on the blockchain\
    \ and that the person initiating the transaction was most likely in possession\
    \ of that file. The benefit of this approach is that no one accessing the blockchain\
    \ will ever be able to retrieve the content of the information associated with\
    \ the hash. Yet, anyone possessing the original file will be able to verify ex\
    \ post that the file is authentic and its content has not been tampered with.\n\
    \n> \n\n> More recently, new modalities of certification or attestations have\
    \ been brought forward in the blockchain space through the popularization of nontransferable\
    \ tokens. These tokens are issued to a particular account by a recognized entity\
    \ or peer in order to certify that the account holder fulfills specific requirements—whether\
    \ such a system is used by a governmental authority to attest that someone is\
    \ a US citizen or by a community member to declare that someone is a recognized\
    \ member of a particular community. Because these tokens are nontransferable,\
    \ they can be used to ensure that the account holder does indeed exhibit the relevant\
    \ attributes or characteristics associated with those tokens. This opens a new\
    \ window of opportunities for governance experimentation in blockchain-based systems\
    \ that are not bound to a plutocratic tendency (where people can purchase tokens\
    \ to acquire more voting power) but rather to a meritocratic tendency (where people\
    \ have to earn tokens based on their attributes or skills, or according to their\
    \ contributions to a particular initiative).\n\n> \n\n> Ensuring the reliability\
    \ and trustworthiness of blockchain-based attestations and certifications is not\
    \ devoid of any challenges. While the blockchain eliminates the possibility of\
    \ forging a certificate or tampering with a previously issued credential, it does\
    \ not as such guarantee the accuracy of the information stored within—also known\
    \ as the problem of *garbage in, garbage out*. To the extent that they relate\
    \ to information off-chain, for these blockchain-based credentials to be recognized\
    \ as legitimate, they must demonstrate a rigorous verification and validation\
    \ process, ideally undertaken by a trusted actor. Trusted actors who act as intermediaries\
    \ between the on- and off-chain world are usually referred to as *oracles*, recording\
    \ real-world information into the blockchain so that such information becomes\
    \ available to smart contracts and other blockchain-based applications to act\
    \ upon. The more real-world information a blockchain system needs, the greater\
    \ the influence of oracles in ensuring the proper operations of that system. Therefore,\
    \ it is increasingly more important to ensure that these oracles provide accurate\
    \ and reliable data.\n\n> \n\n> ### Decision-Making\n\n> \n\n> The most advanced\
    \ blockchains that support the deployment of smart contracts also make it possible\
    \ to create more sophisticated technological arrangements, using software code\
    \ to ensure that specific transactions are automatically executed whenever specific\
    \ conditions are met. The traditional way to think about smart contracts is by\
    \ analogy with a vending machine.\n\n> \n\n> The programmability of blockchains\
    \ and associated smart contracts enabled the creation of so-called DApps, which\
    \ are pieces of software running on a blockchain that anyone can transact with.\
    \ The use of DApps has also been proposed, more explicitly, as a way to create\
    \ new organizational structures enabling people to coordinate themselves through\
    \ a set of self-executing rules deployed on a blockchain. These are usually referred\
    \ to as DAOs.\n\n> \n\n> There are many types of DAOs, which can fulfill different\
    \ functions: from the management of a common treasury among people who do not\
    \ necessarily know or trust each other, to operating a crowdfunding or investment\
    \ platform where contributors are granted with a governance right over the project\
    \ they contributed to, to administering an organization of people with a codified\
    \ decision-making apparatus and a more decentralized governance structure.\n\n\
    > \n\n> There are now several successful DAOs: Moloch DAO, for decentralized investments\
    \ in blockchain infrastructure; Decentraland DAO, operating a decentralized planning\
    \ committee in the metaverse; Mirror DAO, running the curation for a decentralized\
    \ blogging platform; Lex DAO, gathering a group of legally minded engineers providing\
    \ services for other DAOs; and the Friends with Benefits DAO, operating a members-only\
    \ social club for crypto enthusiasts. There are even a few projects that see DAOs\
    \ as an opportunity to create new self-sovereign structures that could effectively\
    \ bypass or replace nation-states, thereby creating new “blockchain-based virtual\
    \ nations”\n\n> \n\n> * * *\n\n> \n\n> \\* \\* \\*\n\n> \n\n> After having outlined\
    \ the development of blockchain technology as it evolved from a platform for digital\
    \ cash to a more general purpose technology, chapter 2 has shown how its distinctive\
    \ features—such as decentralization, immutability, pseudonymity, and verifiability—have\
    \ enabled the emergence of new DApps with their own governance models, culminating\
    \ in the advent of DAOs: decentralized organizations that operate in a distributed\
    \ manner through collective governance. These emergent technologies present both\
    \ challenges and opportunities in the field of governance. On the one hand, they\
    \ offer the promise of enhanced transparency, trust, and efficiency in various\
    \ sectors, from finance to supply chain management. On the other hand, they introduce\
    \ novel complexities related to legal frameworks, security vulnerabilities, and\
    \ decision-making processes that require careful examination and innovative solutions.\
    \ In the chapters that follow, we delve deeper into the multifaceted landscape\
    \ of blockchain-based governance, exploring the intricacies, successes, and ongoing\
    \ debates in this rapidly evolving field.\n\n# 3\n\n# Rule of Code\n\nOn behalf\
    \ of the future, I ask you of the past to leave us alone. You are not welcome\
