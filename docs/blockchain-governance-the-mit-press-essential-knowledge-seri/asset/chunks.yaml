- raw: 'Third, the blockchain confidence machine functions well under normal circumstances
    but can be significantly challenged by crises. Such a crisis can emerge when a
    vulnerability in the code is exploited, which in the worst case can lead to an
    existential threat to a blockchain-based system. When such a threat emerges, private
    interests in a blockchain network may coalesce and organize themselves as a sovereign
    power that can decide on whether a state of exception exists and how to resolve
    it. We can draw lessons about this vulnerability from scholars like Kelsen and
    Schmitt. Possible responses to the state of exception’s vulnerability include
    strengthening on-chain governance, such as by using PoW instead of segregated
    witnesses, as well as enhancing off-chain governance, which could involve making
    rules for the temporary delegation of executive powers to particular actors in
    a blockchain network.


    Fourth, even in normal times blockchain technology is somewhat of a strange regulatory
    beast because it resists being regulated. As a more potent successor of the claim
    to “unregulability” of the early Internet, a blockchain network cannot be coerced
    or simply shut down by any agency, like a state. That is why blockchain proponents
    have called it an alegal technology, beyond the grasp of the law. Drawing from
    the legal theory of Lindahl, this claim is warranted to some extent—but not in
    the same sense as blockchain advocates suggest. Blockchain indeed enables “alegality
    by design” by configuring actions that may transgress legal boundaries. Yet, states
    have ways to deal with this alegality, which in some cases involves regulating
    important intermediaries like exchanges, and in other cases finding functional
    or regulatory equivalences to shape the legality of blockchain systems.


    Fifth, blockchain systems only function when they enjoy legitimacy. Legitimacy,
    which Buterin called the most important scarce resource of blockchain systems,
    is needed for a blockchain community to maintain itself and to thrive. It justifies
    the power vested in the network, which is derived from adherence to specific rules
    (e.g., those governing blockchain updates), respect for shared beliefs (e.g.,
    immutability), and is usually evidenced by the consent of its participants. Blockchain
    systems are special in that they allow for relatively easy exit (people can simply
    leave or fork the blockchain) but depend on the existence of network effects.
    This raises the importance of voice and loyalty. In most political communities,
    these aspects are promoted by means of a constitution, a formal document supported
    by a set of legal norms that justifies the authoritative use of power. Like states,
    blockchains have constitutions that sit between on-chain (i.e., the protocol)
    and off-chain governance. Building legitimacy in blockchain systems may be achieved
    through efforts to draft off-chain constitutions, as some blockchain communities
    are experimenting with now, but this process entails its own risks.


    ## Policy


    Given this TL;DR, there are many challenges of blockchain governance faced by
    both policymakers and blockchain communities. How can trust be raised through
    better governance practices? How can blockchain systems be made less vulnerable
    to states of exception? How can the inherent alegality of blockchain’s design
    be integrated into existing legal systems without undermining decentralization?
    How can good governance be formulated and implemented for polycentric blockchain-based
    systems? And, the most important question, how can the legitimacy of blockchain
    governance be ensured? Given these myriad questions, different avenues exist for
    policymakers to respond to the challenges of regulation and governance raised
    by blockchain technology. On the whole, there are two dominant pathways.


    First, governments may pursue “regulation by code,” which would follow the dominant
    approach to Internet governance. Second, governments may pursue a more unconventional
    but possibly more promising “regulation via governance” approach. Let us look
    at these two paradigms.


    The rise of large Internet platforms has made it apparent that governments can
    use the codebase of these platforms to implement regulations. Perhaps the most
    influential case would be the European Union’s GDPR. Because this regulation sets
    standards and limits for the potential configurations of the code developed by
    centralized organizations, it uses the law-like nature of code to its own advantage.
    This also allows for code to be audited, to assess whether it incorporates the
    proper regulatory safeguards, and for organizations to be penalized if these are
    absent. The centralized nature of players like Google and Meta is a regulatory
    advantage here because these organizations can function as extensions of the arm
    of the law. This also becomes apparent, for instance, in criminal investigations,
    when agencies like the FBI can pressure companies into disclosing users’ personal
    information. Companies, to be sure, still maintain positions of relative autonomy.
    This was clearly demonstrated by the conflict between Apple and the FBI, where
    the former refused to provide a “backdoor” into an iPhone’s code to give law enforcement
    access to this phone during a criminal investigation. Yet even though sovereignty
    in these matters isn’t exclusively tied to the state, it is tied to centralized
    entities and divorced from the user base. X users, for instance, will have to
    abide either to the rule of law enforced by a state like the United States or
    to the rule of Elon Musk, who can unilaterally change the codebase (e.g., by taking
    away the “right” of users to have a blue checkmark).


    Blockchain problematizes and challenges this picture. As we saw in chapters 3
    and 6, blockchain-based systems introduce the rule of code, which raises the possibility
    of alegality by design, that is, the potential of these systems to enable acts
    that transgress legal boundaries. Unlike a centralized platform like X, blockchain-based
    systems execute code without the possibility of coercion by any single operator.
    Moreover, they are transnational and (to some extent) decentralized, meaning that
    shutting down part of a network will not affect the operations of the overall
    network. This poses significant challenges to regulators, and states have been
    busy finding ways to reel in the anarchic potential of blockchain-based systems.
    To be sure, some of these efforts are backed by good reasons, for instance, in
    cases of cyber criminality and theft. Yet, there is also a risk of throwing out
    the baby with the bathwater and undoing some of the innovative potentials of blockchain
    technology.


    It is tempting for governments to focus on the low-hanging fruit, which means
    regulating powerful intermediaries in blockchain networks. Indeed, blockchain
    governance is not purely decentralized but rather functions according to the dynamics
    of a polycentric system. Many of the stakeholders in a blockchain network are
    incorporated as legal entities in specific jurisdictions, and are thus susceptible
    to government regulation. First, mining activities achieved by small businesses
    or large mining pools are an easy target of state regulation. A case in point
    is Iran, where commercial mining licenses were initially granted in the years
    2019–2020. Later on, however, the political situation changed, and under the surging
    “climate of fear” in the country, all mining operations were banned to protect
    against potential energy blackouts. These types of repressive mining regulations
    can have a negative impact on local businesses, but do not significantly affect
    the overall functioning of a blockchain, as long as there are sufficient mining
    activities carried out elsewhere.'
