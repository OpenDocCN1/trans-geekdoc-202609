- raw: 'Second in line are cryptocurrency exchanges and custodian wallets. Because
    powerful exchanges like Coinbase or Binance control the private keys of their
    users, they can effectively regulate transactions. Governments have become aware
    of this crucial function of exchanges, having already implemented KYC, AML, and
    CTF regulations for the legal operation of crypto exchanges. In the future, this
    may even lead to a situation where specific addresses or blockchain wallets can
    be “whitelisted,” while others may be “blacklisted.” In the wake of the FTX scandal,
    more comprehensive regulation of cryptocurrency exchanges can be expected. Yet,
    this regulatory approach also has its limitations, as customers who might not
    agree with these rules can opt for exchanges operating in jurisdictions with less
    stringent regulations, or even decentralized exchanges.


    Third, even people can become a target of blockchain regulation, most notably
    developers and end users. The Tornado Cash sanctions, discussed in chapter 6,
    have put this issue firmly on the agenda. Not only have Tornado Cash developers
    been prosecuted and imprisoned in the United States and the Netherlands, it has
    also become illegal for US citizens, residents, and incorporated companies to
    transact with the Tornado Cash smart contract. Anyone who is caught violating
    these sanctions will be held criminally liable. Of course, because of the pseudonymous
    nature of blockchain networks, it is often difficult (but not impossible) to identify
    who transacts with a smart contract. Another limitation of these regulations is
    that they are bound to particular jurisdictions and developers can simply move
    to places with less stringent regulatory regimes. However, when powerful countries
    like the United States implement these rules, their impact can extend beyond the
    local jurisdiction, as shown by the fact that the Tornado Cash sanctions have
    led block producers and exchanges around the world to censor transactions coming
    from or directed toward these smart contracts.


    Thus, states can, albeit indirectly, regulate blockchain-based systems quite effectively.
    But at what cost? As we discussed in chapter 7, stringent regulation can affect
    the legitimacy of blockchain-based systems, which may motivate people to exit
    some systems and look for a better regulatory regime elsewhere. It also raises
    the question of fairness. Unlike developers working in large companies, blockchain
    developers working on open-source software can propose changes but have very limited
    power to decide which changes are incorporated in the codebase. Is it therefore
    fair to hold a single developer responsible for a change to an open-source project
    in which pieces of code result from many decisions by many people? There are also
    structural limitations to personal responsibility as was demonstrated when anonymous
    users started to send small amounts of Ether from the Tornado Cash smart contract
    to the wallets of famous public figures, like television host Jimmy Fallon. These
    actions showed that even though Fallon would be formally liable, his inability
    to control the transaction directed to his account makes it challenging to attribute
    responsibility.


    Eventually, increasingly stringent regulation that follows the “regulation by
    code” model may undermine the very innovative potential of blockchain-based systems.
    First, it may propel the movement toward greater centralization and disincentivize
    governance experimentation and innovation since communities will experience less
    autonomy. For instance, people will feel less inclined to support processes of
    blockchain governance as token holders, as they may fear the burden of liability.
    And second, it may also have an adverse “race to the bottom” effect because people
    may choose to exit more strictly regulated systems and look for a new “land” in
    the buccaneering free haven of the network state, moving the more radical systems
    even further away from regulatory scrutiny.


    The dilemma pictured above forces us to think: does blockchain governance challenge
    the established ways of regulating technology? If regulation by code proves counterproductive,
    might blockchain communities, legal and political scholars, and policymakers need
    to seek out better regulatory environments? Perhaps blockchain raises the core
    question of regulation under the aegis of cybernetic systems: is regulation still
    a function of institutional discipline through the law, or is it becoming a function
    of distributed control? This would mean that blockchain systems and state legislation
    mutually adapt to one another, functioning as two distinct organisms that need
    to establish new relationships of coordination and control.


    A promising approach to enable this process of mutual adaptation is the establishment
    of regulatory sandboxes that allow for controlled experimentation with novel governance
    forms. Think about the federated structure of ancient Greece, where many smaller
    instances of the polis could experiment with radically new forms of government.
    A regulatory sandbox implies a scoped regulatory regime, for instance, limited
    to a particular locality or domain, that allows for greater flexibility and experimentation
    in the field of governance. It allows for a controlled environment in which people
    can experiment with new technologies and business models alike, while being exempt
    from some existing financial regulations and legal requirements. In a sandbox,
    for instance, initial coin offerings (ICOs) could be made legal provided that
    they meet specific criteria, inviting practitioners to innovate in order to match
    these criteria, while giving time for regulations to adapt in order to accommodate
    these technological innovations.


    Regulatory sandboxes are helpful for finding ways to establish “functional equivalence”
    and “regulatory equivalence” between regulations in the rule of code and those
    of the rule of law. Functional equivalence establishes the equivalence of two
    technological artifacts, one that is covered by a legal rule and one that is not
    yet covered by a legal rule. A relevant example is establishing the equivalence
    of a paper contract with an electronic contract. Regulatory equivalence means
    establishing the equivalence of a regulatory regime with a technological implementation
    of the policy objectives of said regulatory regimes. For instance, DAOs deployed
    on a public blockchain, having a graphical user interface that enable laypersons
    to monitor key smart contract variables and transactions, along with plain-language
    “bylaws” accessible through a public webpage, could be recognized as equivalent
    to business filings at a corporate registrar. Arguably, this technological implementation
    can meet the publicity and transparency policy objectives embodied in a corporate
    governance regime.


    As such, regulatory sandboxes can bring about a more constructive form of mutual
    adjustment between state regulations and blockchain governance. However, given
    that blockchain communities cannot be forced into this mutual adjustment, conditions
    should be created that incentivize their engagement. Such an approach, not based
    on coercion but on incentives, might tame the potential dangers of blockchain
    governance while not undoing its innovative potential.


    An important point of leverage here are the social norms that shape the on- and
    off-chain governance of blockchain-based systems, which can be influenced by exogenous
    factors. The strong influence of social norms on governance can be demonstrated
    by the difference between Bitcoin and Ethereum. While the Bitcoin community emphasizes
    the value of immutability and the code-is-law principle, the Ethereum community
    has evolved into foregrounding distributed consensus, making it easier for the
    system to flexibly adapt to new circumstances.'
