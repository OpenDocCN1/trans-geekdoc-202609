  trans: '

    # 区块链治理与代码法则


    尽管早期互联网倡导者曾做出承诺，但今天的互联网并未摆脱政府控制。它通过一系列由民族国家强加给中心化中介和在线运营商的法律法规受到严格监管。这些法规包括但不限于欧盟的《信息社会指令》和《通用数据保护条例》（GDPR）、美国的《数字千年版权法》和《儿童在线隐私保护法》，以及更为严厉的措施，如中国政府用于审查在线内容的“防火长城”。所有这些措施旨在规范在线企业如何收集和使用个人数据、其对所托管内容负有何种责任，以及每个国家可访问何种类型的内容。有时，这一大堆法规可能导致跨司法管辖区的法律义务相互冲突（例如，版权保护与言论自由的冲突）。


    ## 代码法则


    我们引入`rule of code`（代码法则）的概念——类比`rule of law`（法治）——来说明区块链技术的核心特性如何为基于区块链的网络和应用程序提供一组基本特征，使它们区别于传统的在线应用程序（由代码统治），并继承了`rule
    of law`（法治）的一些特征（就可追溯性、可验证性、可预测性和问责制而言）。虽然传统在线平台和基于区块链的系统都依赖代码来规范在线行为，但这两种系统的运作方式存在根本差异。因为没有中心化权威控制公共且无许可的区块链网络（即不存在主权者），区块链技术为建立难以被少数人利用谋利的基于代码的规则提供了可能。因此，这些网络的运作需要一个更加分布式和多中心的治理系统，其中多方行动者需要（通过分布式共识）就特定行动方案达成一致。这与
    2000 年代初期的互联网治理讨论形成鲜明对比，后者主要集中在中心化机构或在线运营商以及信任他们的必要性上。


    区块链技术最具革命性的方面之一——这在公共且无许可的区块链网络背景下最为明显——是其多中心特性。根据 McGinnis 的说法，


    公共且无许可的区块链网络的治理受制于多个决策中心，这些中心既包括网络内生的，也包括外生的。以太坊生态系统中内生决策中心的例子包括全节点（含验证者节点）、质押池、ETH
    持有者、最大可提取价值（MEV）搜索者、以太坊核心开发者、以太坊创始人和以太坊基金会。外生决策中心的例子包括加密货币交易所、竞争性区块链网络（如 Tezos、Cosmos、Cardano、EOS）、监管机构、决策者、监管者以及各类与以太坊网络对接的创业者。


    这些多个决策中心处于持续的互动和相互调整过程中。例如，每当网络提出升级提案时，以太坊核心开发者和以太坊节点就会相互交互，因为后者负责更新其客户端以实施升级。同时，更新这些客户端的过程可能会影响以太坊网络的计划开发和路线图。同样，运营加密货币交易所的公司会受到允许或限制其活动的法律法规的影响，而加密货币日益增长的采用和需求（由交易所使用量的增长表明）可能导致相关立法发生变化。这些内生和外生决策中心也在网络边缘相互交互。例如，国家当局对一系列智能合约地址实施制裁，导致一些验证者审查与这些地址交互的交易。同时，核心开发者的行动和行为可以塑造监管机构和决策者对开发者单方面更改协议某些方面能力的看法。


    最后，谈到最后一个标准，区块链协议及其共识算法规定了一组所有网络成员必须遵守的规则。这些链上规则的公开性为结果提供了相当程度的透明度，并有助于确保激励与规则保持一致。除了直接编码在区块链协议中的规则（链上）之外，还存在一个总体规范体系，概述了不同决策中心关于必须遵循的链下操作程序和规则的角色，例如各种比特币或以太坊改进提案（BIP
    和 EIP）。此外，多方利益相关者重复的互动模式往往会体现出大多数网络参与者遵守的一些总体规范和原则，例如对不可变性、不可逆性和可信中立性的追求。


    将区块链网络视为多中心治理系统，有助于我们认识到这些网络依据一组特定规则运行，这些规则的定义和执行不受任何单一行为主体的随意摆布，而是源于多个相互依存的施加影响于系统的主体。正如
    Aligica 和 Tarko 所解释的，多中心系统是“法治系统”，因为权力不集中在单一行为主体手中，且行为主体受到`rule of law`（法治）的约束。


    总之，`rule of law`（法治）是指一种治理人类行为的制度，其中法律被成文并平等地适用于所有人，包括仍需在法律下负责的主权者。


    `rule of code`（代码法则）的概念最早由 De Filippi 和 Wright 于 2018 年在其著作 `Blockchain and the
    Law`（《区块链与法律》）中提出。近年来，随着区块链技术的日益普及，这一概念获得了新的显著地位。`rule of code`（代码法则）与 `rule by
    code`（代码统治）相比，一个关键含义是它消除了对统治代码的中心化机构或在线中介的信任需求。在一个由`rule of code`（代码法则）治理的世界里，代码代替主权者进行统治——正如在`rule
    of law`（法治）中，法律最终统治着主权者一样。没有政府能干预基于区块链的系统，也没有公司能随意修改区块链应用的代码，因为没有人拥有单方面修改这些系统运行规则的权力——至少在理论上是这样。


    规则被编码在代码本身中，每个人都受相同规则约束。然而，这并不意味着`rule of code`（代码法则）不能被改变。关键不在于让`rule of code`（代码法则）不可变，而在于它只能在特定情况下、以去中心化和透明的方式进行更改。也就是说，任何人都可以提议修改代码，社区可以投票决定是否实施该更改。这类似于在`rule
    of law`（法治）下法律本应被修正的方式。


    早期的区块链倡导者认为，基于区块链系统中的代码至上将把人类的低效和腐败抛在身后。

