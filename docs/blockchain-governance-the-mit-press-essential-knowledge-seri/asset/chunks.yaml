- raw: 'Rule by code The rule by code, by analogy to the rule by law, refers to the
    idea that rules encoded in a digital platform can be used to dictate the affordances
    and constraints for that platform’s users. Yet, the operator of the platform is
    not itself bound by this regulation by code and can therefore instrumentalize
    the code to further its own interests.


    Rule of code The rule of code, by analogy to the rule of law, refers to the idea
    that rules encoded in smart contracts and blockchain protocols are autonomously
    and impartially enforced by the technological infrastructure of the blockchain.
    This reduces the possibility for any single actor to unilaterally affect the operations
    of the code unless the code specifically provides for that.


    Smart contract A smart contract is a piece of code deployed on a blockchain network
    that defines a series of possible actions based on a set of rules and conditions.
    When predefined conditions are met, the blockchain network automatically executes
    the smart contract’s code in a deterministic manner. Because it does not run on
    a centralized server, no single actor can influence or terminate the execution
    of a smart contract.


    State of exception State of exception refers to a legal or political condition
    where normal legal procedures and civil liberties are temporarily suspended, often
    during emergencies or crises, granting the government or ruling authority extraordinary
    powers to address the situation. In a blockchain context, it refers to situations
    where a blockchain protocol or smart contract does not operate as expected, therefore
    requiring an extraordinary intervention that violates the protocol rules.


    Time stamp In the blockchain context, a time stamp is a cryptographic record of
    the exact date and time when a transaction or block is added to the blockchain,
    ensuring chronological order and data integrity, which is essential for auditability,
    verification, and consensus in distributed ledger systems.


    Trust Trust involves the expectation that others will act in a manner consistent
    with one’s expectations, commitments, and shared values, even if they have the
    opportunity not to. Trust constitutes the basis for cooperation, relationships,
    and social cohesion. It can manifest in various forms, including interpersonal
    trust, institutional trust, and trust in the functioning of systems and processes.


