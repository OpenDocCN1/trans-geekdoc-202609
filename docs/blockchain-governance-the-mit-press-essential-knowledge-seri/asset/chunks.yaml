    to reflect on the questions of governance: What should a government look like?
    What is the role of a citizen and of the state? How does political change occur?
    How can political communities improve a citizen''s happiness and well-being? How
    should citizens be encouraged to be just and virtuous? Now, `blockchain` communities
    around the world are experimenting with different consensus algorithms, innovative
    voting systems, dispute resolution systems, and community covenants that are meant
    to act like written constitutions. And similar questions of governance arise:
    Should `blockchain` communities adhere to the "`rule of code`" or allow human
    interference in the administration of the protocol? Should a `blockchain` governance
    system adhere to democratic principles, or could it adopt a plutocratic form of
    governance? How should `blockchain` communities preserve the polycentric nature
    of public permissionless `blockchain` networks?


    `Blockchain` governance captures the dual aspects of governance by the technology
    (`on-chain` governance) and governance of the technology (`off-chain` governance).


    Answering these questions is not straightforward. As Vili Lehdonvirta argued in
    2016, `blockchain` governance is inherently a "paradox." He asked, Isn''t it the
    point of `blockchain` technologies to obviate the need for (human) governance?
    And if it is not, and (human) governance is needed, why is a `blockchain` required
    at all, if people are going to ultimately trust a third party?


    Why is it important to investigate `blockchain` governance? First, `blockchain`
    technology has become a consequential force in the world. Back in 2010, `Bitcoin`
    was still unknown to most people, its nascent community celebrated when someone
    used the cryptocurrency to buy a pizza. Only one decade later, `blockchain` technology
    has disrupted virtually every sector. It has become a trillion-dollar industry,
    with millions of people around the world developing `Web3` applications, investing
    in new crypto projects, or chatting about the latest crypto crisis with colleagues
    over coffee. `Blockchain` has become a topic discussed by heads of state, central
    bankers, and the CEOs of the world''s largest companies. This growing relevance
    of `blockchain` technology automatically raises concerns of governance. `Blockchain`
    developers have started asking questions about their relationship with regulators,
    while policymakers have started to explore new pathways to formulating effective
    regulations. To do this wisely, an understanding of `blockchain` governance, in
    terms of its promises and challenges, is indispensable.

    '
  trans: '


    技术的这一新角色在二十一世纪变得日益明确。技术不再仅仅是一个赋能因素，或是治理乌托邦构想的灵感来源，而是正在获得政治力量，并成为一种治理形式本身。在机械时代，情况尚非如此——正如牛顿所信，即使是完美的钟表装置般的宇宙，也需要一个除自身之外的原动力：钟表匠（即上帝）。然而，自从`图灵机`发明以来，符号机器如今共享了一种被视为人类专属的能力，即做决策的能力。今天，机器做出的决策无处不在，推动着我们、引导着我们，有时甚至强制着我们。推荐算法决定我们在网上能看到什么内容或广告，而内容审核系统决定什么将被隐藏。


    然而，正如牛顿的钟表宇宙背后有“钟表匠”一样，这些由机器驱动的决策系统背后，坐着一群“原动力”，他们不具备神格，而是血肉之躯的人类，无论是马克·扎克伯格还是习近平。本书讲述的是一种新的赛博钟表，它声称要将其钟表匠推向一边，而其首个实例化便是加密货币`比特币`。在福山的论题提出三十年后，`区块链`技术正推动着新治理系统的“寒武纪大爆发”。激进的新治理概念被推向前台：从分布式共识到去中心化自治组织（`DAO`），以及其他许多即将到来的概念。


    这些激进的新治理形式并非凭空出现，而是乘着一波社会技术想象的浪潮，通过投机性科幻小说和政治愿景来解读技术进步。赛博空间的概念——一个源于街机游戏的虚拟、开放式矩阵——本身就诞生于科幻小说，著名地被威廉·吉布森在《神经漫游者》中命名。


    这些源自科幻小说的愿景表明，一个拥有不同哲学和不同政治的世界是可能的。这个世界是仁慈的还是邪恶的，仍是一个开放性问题。然而，在这些社会技术想象中，似乎存在一种与我们实际生活的世界产生共鸣的运动。首先，是技术重要性的日益增长。在
    20 世纪 50 年代，人们仍想象行星文明的运行方式与他们自己的时代和地点颇为相似；我们已转向由植入大脑芯片的群体思维驱动的想象，它们通过自愿的`点对点`网络协调经济活动。其次，是远离帕尔默所描述的“老蜘蛛”，即民族国家。我们想象中的政治存在正在去领土化、去物质化，并移入赛博空间无垠的广阔天地。我们无处不在，又无处可寻，但政治权力和物理躯体依然存续，制造着拥有者与非拥有者之间的分裂，并提醒我们自身存在的暂时性。第三，正如马歇尔·麦克卢汉所预见，我们回溯遥远的过去，以理解当下并展望未来的可能性。


    这三大发展——技术的革命性作用、远离民族国家、以及对过往政治思想的复兴——不仅助推了科幻小说，也推动了技术领域的具体发展。早在 20 世纪 70 年代，斯图尔特·布兰德等有影响力的人物便利用想象力将迷幻药、先进电子网络和原始社区生活的理想融合在一起，点燃了驱动硅谷及其`加利福尼亚意识形态`的愿景。


    在那一天，`比特币`白皮书的发布确立了一种新的技术基础设施——`区块链`技术——人们可以通过它以`点对点`的方式进行交互和交易。`区块链`技术是一种新型的经济和政治制度，它运行在由可信中介构成的现有政治结构之外，


    ## 为什么要研究区块链治理？


    本书关注`区块链`治理，涵盖对`区块链`技术的监管与治理，以及由`区块链`技术进行的监管与治理。它涉及广泛的议题，从政策制定者如何应对`区块链`带来的挑战，到`区块链`开发者如何应对协议设计中的张力，再到像不可篡改性这样的基本原则如何既赋能又阻碍治理替代方案。`区块链`治理捕捉了技术治理（`链上`治理）和技术的治理（`链下`治理）这双重层面。这两个层面之间的动态互动是本书的主要主题，并将贯穿各章——例如，在探讨所谓“`无需信任`”网络中信任与信心概念的张力，以及评估外生和内生压力如何塑造对`区块链`治理合法性的认知时。


    在接下来的章节中，我们将追随亚里士多德的脚步，他在当时见证了希腊城邦中新治理形式的大量涌现：从僭主制到贵族制、寡头制和民主制。正是在此背景下，法学和政治学学科首次诞生，以反思治理问题：政府应是什么样？公民与国家的角色是什么？政治变革如何发生？政治共同体如何提升公民的幸福与福祉？应如何鼓励公民公正且有德？如今，世界各地的`区块链`社区正在尝试不同的共识算法、创新的投票系统、争议解决系统，以及旨在充当成文宪法的社区公约。并出现了类似的治理问题：`区块链`社区应坚持“`代码即法律`”还是允许人为干预协议管理？`区块链`治理体系应遵循民主原则，还是可采用寡头政治形式？`区块链`社区应如何维护公共无许可`区块链`网络的多中心特性？


    `区块链`治理捕捉了技术治理（`链上`治理）和技术的治理（`链下`治理）这双重层面。


    回答这些问题并非易事。正如维利·莱多维尔塔在 2016 年所言，`区块链`治理本质上是一个“悖论”。他问道：`区块链`技术的初衷，难道不是为了消除（人类）治理的必要性吗？如果并非如此，且需要（人类）治理，如果人们最终仍要信任第三方，那为什么还需要`区块链`呢？


    为什么研究`区块链`治理很重要？首先，`区块链`技术已成为世界上一股重要的力量。回溯 2010 年，`比特币`对大多数人仍是未知的，其萌芽社区曾因有人用加密货币买披萨而庆祝。仅十年后，`区块链`技术已颠覆了几乎每个领域。它已成为一个万亿美元级的产业，全球数百万人正在开发`Web3`应用、投资新加密项目，或在咖啡间与同事闲聊最新的加密危机。`区块链`已成为国家元首、央行行长和世界最大公司首席执行官讨论的话题。`区块链`技术的这种日益增长的相关性，自动引发了治理关切。`区块链`开发者开始询问他们与监管者的关系，而政策制定者开始探索制定有效法规的新途径。为此，理解`区块链`治理的承诺与挑战，是必不可少的。


    '
