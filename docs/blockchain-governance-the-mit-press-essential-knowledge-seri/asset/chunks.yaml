- raw: 'Despite the promises of early Internet advocates, today’s Internet is not
    free from governmental control. It is heavily regulated through a set of laws
    and regulations that are imposed by nation-states upon centralized intermediaries
    and online operators. These include, among others, the European Union’s Information
    Society Directive and the General Data Protection Regulation (GDPR), the US Digital
    Millennium Copyright Act, and the Children’s Online Privacy Protection Act as
    well as more draconian measures such as the Chinese government’s Great Firewall
    for the censorship of online content. All these measures are intended to regulate
    how online businesses can collect and use personal data, what their responsibilities
    are with regard to the content they host, and what type of content is accessible
    in each country. Sometimes, this plethora of regulations may lead to conflicting
    legal obligations across jurisdictions (e.g., copyright protection versus freedom
    of expression).


    ## Rule of Code


    We introduce the notion of the rule of code—by analogy to the rule of law—to illustrate
    how the core features of blockchain technology provide a set of fundamental features
    for blockchain-based networks and applications that distinguish them from traditional
    online applications (ruled by code) by inheriting some of the characteristics
    of the rule of law (in terms of traceability, verifiability, predictability, and
    accountability). While both traditional online platforms and blockchain-based
    systems rely on code to regulate online behaviors, there is nonetheless a fundamental
    difference in the way these two systems operate. Because there is no centralized
    authority controlling a public and permissionless blockchain network (i.e., there
    is no sovereign), blockchain technology provides for the establishment of code-based
    rules that are difficult to co-opt for the benefits of a few. The operations of
    these networks therefore require a much more distributed and polycentric governance
    system, where a multiplicity of actors need to agree (through distributed consensus)
    toward a particular course of action. This stands in contrast to the Internet
    governance discussions of the early 2000s, which were largely focused on centralized
    institutions or online operators and the need to trust them.


    One of the most revolutionary aspects of blockchain technology—which is the most
    apparent in the context of public and permissionless blockchain networks—is its
    polycentric character. According to McGinnis,


    The governance of public and permissionless blockchain networks is subject to
    multiple centers of decision-making, both endogenous and exogenous to the network.
    Examples of endogenous decision-making centers in the Ethereum ecosystem are full
    nodes (including validator nodes), staking pools, ETH holders, maximum extractable
    value (MEV) searchers, Ethereum core developers, Ethereum founders, and the Ethereum
    Foundation. Examples of exogenous decision-making centers are crypto exchanges,
    competing blockchain networks (e.g., Tezos, Cosmos, Cardano, EOS), regulatory
    bodies, policymakers, regulators, and a variety of entrepreneurs interfacing with
    the Ethereum network.


    These multiple decision-making centers are in a constant process of interaction
    and mutual adjustment. For instance, Ethereum core developers and Ethereum nodes
    interact with one another whenever an upgrade is proposed for the network, as
    the latter are responsible for updating their clients to implement the upgrade.
    At the same time, the process of updating these clients can affect the planned
    development and roadmap of the Ethereum network. Similarly, companies that operate
    crypto exchanges are affected by laws and regulations that permit or restrict
    their activities, while the growing adoption and demand for cryptocurrencies,
    as indicated by growing crypto-exchange usage, can lead to changes in the relevant
    legislation. These endogenous and exogenous centers of decision-making also interact
    with one another across the edges of the network. For example, sanctions by state
    authorities on a series of smart contract addresses have caused some validators
    to censor transactions interacting with those addresses. At the same time, the
    actions and behavior of core developers can shape the perceptions of regulatory
    bodies and policymakers about the ability of developers to unilaterally change
    aspects of the protocol.


    Finally, when it comes to the last criterion, blockchain protocols and their consensus
    algorithms stipulate a set of rules that all members of the network must abide
    by. The public nature of these on-chain rules provides a considerable degree of
    transparency about outcomes and helps ensure that incentives and rules align.
    In addition to the rules encoded directly in the protocol of a blockchain (on-chain),
    there also exists an overarching system of norms outlining the role of different
    decision-making centers with regard to the procedures and rules that must be followed
    to perform an operation off-chain, as for the various Bitcoin or Ethereum Improvement
    Proposals (BIPs and EIPs). Moreover, it often happens that the repeated patterns
    of interaction among multiple stakeholders give expression to a number of overarching
    norms and principles that most network participants abide by, such as the aspiration
    of immutability, irreversibility, and credible neutrality.


    Looking at blockchain networks as polycentric governance systems helps us shed
    light on the fact that these networks operate according to a specific set of rules,
    where both the definition and the execution of these rules is not subject to the
    whims of any single actor but rather emerge from a multiplicity of interdependent
    agents exerting influence on the system. As Aligica and Tarko explain, polycentric
    systems are “rule of law systems” as power is not centralized in the hands of
    a single actor and agents are constrained by the rule of law.


    In sum, the *rule of law* refers to a system for governing human behavior whereby
    the laws are written down and applied equally to everyone, including the sovereign
    who remains accountable under the law.


    The notion of the rule of code was first introduced in 2018 by De Filippi and
    Wright in their book *Blockchain and the Law*. It has acquired new prominence
    in recent years with the progressive rise in popularity of blockchain technology.
    One key implication of the rule of code, as opposed to the rule by code, is that
    it removes the need for trust in centralized institutions or online intermediaries
    who rule over the code. In a world governed by the rule of code, the code rules
    in place of the sovereign—just as in the rule of law, the law ultimately rules
    over the sovereign. No government can interfere with a blockchain-based system,
    and no corporation can arbitrarily modify the code of a blockchain application
    because no one has the power to unilaterally modify the rules by which these systems
    operate—at least in theory.


    The rules are encoded in the code itself, and everyone is subject to the same
    rules. Yet, this is not to say that the rule of code cannot be changed. The point
    is not for the rule of code to be immutable but rather for it to only be changeable
    in specific circumstances, in a decentralized and transparent way. That is, anyone
    can propose a change to the code, and the community can vote on whether to implement
    the change. This is similar to the way that laws are supposed to be amended under
    the rule of law.


    Early blockchain advocates believed that the supremacy of code in blockchain-based
    systems would leave human inefficiencies and corruption behind.'
