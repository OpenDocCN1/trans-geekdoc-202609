    # 7. 合法性


    至少表面上看似乎是这种情况。2022 年 8 月 8 日和 2022 年 11 月 8 日，美国财政部外国资产控制办公室（OFAC）因龙卷风现金协助朝鲜黑客组织洗钱而对其实施制裁。由于这些制裁，任何美国公民、居民或公司与该基于区块链的服务相关的智能合约地址进行交易均属非法，当时这些地址持有价值超过
    4 亿美元的以太币。虽然 OFAC 声称该制裁针对的是龙卷风现金“实体”，包括其创始人、开发者和 DAO，但在当时看来，它似乎针对的是一份智能合约地址清单。这意味着没有人，包括开发团队，能够控制其运行，因此也无法修改或关闭它。代码可以被制裁吗？制裁令发布后，中心化的
    GitHub 代码库被移除，龙卷风现金 DAO 沉寂，一名开发者在荷兰被捕。然而，龙卷风现金的智能合约地址仍继续自主处理发送给它的交易。因此，这些制裁受到严厉批评，尤其是在区块链社区内，因为它们实际上针对的是技术产物，而非法律实体。


    一方面，龙卷风现金的案例展示了法律边界如何成为断层线。有人称这是针对一群人的制裁，而另一些人则将其视为对自主代码的制裁。因此，该制裁可能违背了将软件代码视为言论进行监管的现有自由主义方法，而该言论受美国宪法赋予的言论自由权保护。


    另一方面，制裁通知展示了合法性的局限。法律确实无法直接修改区块链上的代码。然而，很明显，制裁可以间接监管与被制裁地址互动的人员。在龙卷风现金案例中，这些监管对象包括处理网络交易的出块者以及加密货币交易所。制裁通知发布后不久，超过
    50% 的以太坊出块者默认开始审查源自龙卷风现金的交易，无论它们在法律上是否受制裁约束。


    与 Srinivasan 设想的基于区块链的系统作为超越任何法律秩序的“政府的政府”形成对比的是，像龙卷风现金这样设计上属于非法律的技术表明，此类系统以复杂的方式与国家法律秩序纠缠在一起。虽然法律秩序可以监禁开发者、恐吓验证者和加密货币交易所，并扼制隐私增强技术的发展，但龙卷风现金的智能合约本身仍在运行。虽然有人希望制裁和监管能瘫痪这个自主的“ゴーレ姆”，但不清楚这些措施将如何执行，也不确定所有利益相关者是否会自愿遵守。如果这些系统继续逐步变得更加去中心化和多样化，要“囚禁”这个“ゴーレ姆”将变得更难。一个典型案例是，在大多数出块者审查源自龙卷风现金的交易数月后，到
    2023 年 4 月，尽管 OFAC 制裁仍然有效，但大多数出块者已能使用非美国软件——客户端和中继器——来处理这些交易。


    ---


    第 6 章借助关于非法律性的法律理论，探讨了区块链技术的设计如何使其能够抵抗法律秩序的强制力、跨越法律边界，甚至重绘边界。对于技术乐观主义者来说，区块链技术的非法律性值得保留，因为它允许某些自由和权利得以延伸，例如金融隐私权。区块链的非法律性似乎提供了一种摆脱法律命令的途径——正如无政府主义者巴枯宁所言，这些命令*打着自由的旗号扼杀自由*。


    > 最重要的稀缺资源是合法性。

    >

    > ——Vitalik Buterin, "The Most Important Scarce Resource Is Legitimacy"


    ## 多重危机


    2022 年，随着俄罗斯发动对乌克兰的战争，全球经济经历 COVID-19 大流行的余震，加密货币世界也经历了一场“多重危机”。在一些主要稳定币崩盘后，NFT
    市场崩溃，大多数公共区块链的市值大幅缩水。最大的冲击来自加密货币神童 Sam Bankman-Fried 及其 FTX 帝国的倒台。加密寒冬来临。


    在这些不稳定的时期，当前治理实践的合法性受到质疑，考验着人们对现有制度安排的信心。加密寒冬也引发了关于区块链领域合法治理的问题。关于这一话题的辩论早在 2021
    年加密货币繁荣的顶峰时期就已由以太坊创始人 Vitalik Buterin 发起。在他的个人博客上，Buterin 认为区块链支持者忽视了治理中一个非常重要的因素：他称为合法性的更高阶接受模式。


    Buterin 认为，无论区块链系统在技术上多么复杂，它仍需要一定程度的接受才能运行。Buterin 声称，合法性可以根据语境从各种来源获得——包括暴力、延续性、公平性、程序、绩效和参与。然而，他指出，基于区块链的系统的合法性特别依赖于所有网络参与者对系统结果的更高阶接受，他辩称这主要建立在这样的预期之上：其他人也会接受这些结果为合法。


    在试图定义合法性时，Buterin 无意中与许多研究合法性的学者展开了对话，其中最著名的是德国社会学家马克斯·韦伯。


    ## 合法性与合法性


    韦伯将合法性视为*对权威的接受*和*服从命令的要求*。他发展了一种合法性概念，更关注政治系统如何依据这些规则设计规则和授权权力，而非这些规则在实质上说了什么。政治系统的合法性源于人们习惯其惯例和风俗（即传统）、他们对领导者非凡品质的信任（即魅力），或他们对一套理性规则和规范被遵循的信心（即合法性）。从这个意义上说，源自合法性的合法性取决于对程序规则和“技术选择，而非意识形态选择”的遵从。


    对于其他学者如 Dyzenhaus 而言，合法性与合法性是交织在一起的概念，但后者的存在并不必然意味着前者的存在。


