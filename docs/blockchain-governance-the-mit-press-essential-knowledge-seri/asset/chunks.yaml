    \ required a central authority to act as a trusted intermediary for all electronic\
    \ transactions. Chaum managed to enter into commercial partnerships with a few\
    \ banks, but DigiCash failed to gain greater traction.\n\n> \n\n> DigiCash enabled\
    \ users to anonymously withdraw digital notes from their bank so that they could\
    \ subsequently be exchanged off market, or directly send payments of any value\
    \ to third parties. The project gained attention among the cypherpunk community,\
    \ but governments and merchants were concerned about the anonymity it provided.\
