    ## Legal Tensions


    While the rule of code presents a variety of benefits in terms of governance and
    resilience, when it comes to compliance with the law, there is a fundamental tension
    between the rule of code and the rule of law.


    This is particularly visible in the context of property and contract law. Property
    is defined by law and can therefore also be taken away by the law. This means
    that anyone who acquires a particular asset in a way that is deemed to be illegitimate
    by the law will not be regarded as the legal owner of that asset and could potentially
    get it taken away by a court order. Conversely, in the context of blockchain-based
    assets, like cryptocurrencies or tokens, ownership is defined by the code of the
    blockchain-based system, and regardless of what the law says, no one has the power
    to seize these assets unless the code specifically provides for such a possibility.
    Similarly, in the context of contracts, legal contracts must be enforced by a
    third-party authority following the interpretation of the contractual terms in
    light of the provisions of contract law. In contrast, the code of a smart contract
    is automatically executed by the underlying blockchain infrastructure in a deterministic
    manner. This execution occurs regardless of whether the code properly reflects
    the parties’ intentions or is compatible with the provisions of contract law.


    This discrepancy with existing legal rules may be leveraged deliberately by some
    actors, purposely deploying blockchain-based applications to evade existing regulations
    (e.g., taxation and securities laws). Given that in the context of a permissionless
    blockchain network, or in the case of a decentralized blockchain-based application
    or DAO, no centralized entity can be held accountable for the activities undertaken
    on these blockchain-based systems, it becomes difficult to impute liability for
    any illicit act achieved through or via these systems. In other words, if the
    offender is not a legal entity but an actual piece of smart contract code, who
    should be held accountable for the offense?


    As opposed to other technologies that can be more easily shut down by governmental
    authorities, it is relatively harder to effectively sanction blockchain-based
    systems (except in some rare situations, as described in the following section)—although
    those who publish or interact with the code might be incriminated. Because all
    transactions on a blockchain are recorded on a public ledger, these transactions
    can be traced back to the digital addresses of the participants in the network.
    Consequently, when an illicit transaction is made on a blockchain network, the
    transaction is visible on the public ledger, and the pseudonymous identity of
    the participant who made the transaction is also recorded. In principle, this
    could be used to trace an offender’s real-world identity. In practice, however,
    it is very difficult to trace the identity of an offender in a blockchain network
    due to the pseudonymous nature of digital addresses. This challenge did not prevent
    regulators from enforcing the law in an emerging battle for supremacy between
    the rule of code and the rule of law.


    Take the infamous case of Silk Road, which was a dark web marketplace that was
    used to buy and sell illegal drugs and other illegal items. The marketplace was
    only accessible through the Tor network, a network that allows users to remain
    anonymous. Silk Road’s payment system was operated via the pseudonymous Bitcoin
    blockchain. Hence, Silk Road users could buy and sell illegal items without revealing
    their real-world identities.


    In 2013, the FBI shut down Silk Road and arrested Ross Ulbricht, the individual
    operating under the pseudonym “Dread Pirate Roberts.” Despite the pseudonymous
    nature of the Bitcoin blockchain used for transactions on the site, it is not
    completely anonymous. This allowed the FBI to analyze the blockchain and link
    the digital addresses used by Dread Pirate Roberts to Ulbricht’s identity.


    Silk Road demonstrates that blockchain-based systems are not immune to law enforcement
    agencies. Although it can be very difficult to trace the real-world identity of
    a blockchain user, it is not impossible. In addition, it is important to note
    that the FBI was only able to arrest Ross Ulbricht because Silk Road was not a
    truly decentralized marketplace. Although it was using the Bitcoin blockchain
    for payments, it was not fully decentralized in its operation. As the operator
    of Silk Road, Pirate Robert was thus held responsible for the illicit activities
    that were undertaken onto the platform.


    Another example of legal enforcement over a blockchain-based system is the case
    of Ooki DAO. The CFTC filed a complaint against the operations of Ooki DAO,'
