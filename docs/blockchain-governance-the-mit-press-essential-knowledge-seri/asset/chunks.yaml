    # Conceptualizing Legitimacy in Blockchain Systems


    ## Schmidt''s Framework: Input, Throughput, and Output Legitimacy


    Another way of conceptualizing different types of legitimacy was provided by Schmidt,
    who distinguished between *input legitimacy*, *throughput legitimacy*, and *output
    legitimacy*. Input legitimacy is based on a governance system’s responsiveness
    to citizens’ concerns (i.e., governance by the people), and output legitimacy
    is determined by the effectiveness of a governance system’s policy outcomes (i.e.,
    governance for the people). Throughput legitimacy depends on the quality of governance,
    as determined by the responsiveness of a governance system to “citizens’ input
    demands while ensuring the best possible policy outputs.”


    ## Output Legitimacy in Blockchain Systems


    Regarding output legitimacy in blockchain systems, participants may find pragmatic
    reasons to consider the system legitimate as long as it consistently delivers
    on its promised functionality. Block producers, for instance, receive economic
    rewards for their participation in maintaining the network, aligning with their
    financial self-interest. In exceptional situations, such as The DAO attack, participants
    may opt to endorse one fork over the other based on moral reasons (e.g., the belief
    that theft should not go unpunished). Additionally, they may cognitively accept
    a fork as an inevitable intervention that is necessary to preserve the network’s
    security and sustainability.


    ## Input and Throughput Legitimacy in Blockchain Systems


    A blockchain system may be perceived as having input legitimacy to the extent
    it can adapt and respond to the changing needs and concerns of the various stakeholders
    involved. The system may also have throughput legitimacy when it not only incorporates
    its participants’ voices and preferences but in doing so also effectively adapts
    to the changing technological and economic landscape.


    Blockchain systems do not always enjoy throughput legitimacy. The Bitcoin scaling
    debate has shown the difficulty for a blockchain network to implement a significant
    protocol change, thereby failing to respond to the demands for a greater throughput
    of transactions.


    # Blockchain Constitutions


    ## Constitutionalism and Blockchain Legitimacy


    The use of the constitutionalism lens to explore the legitimacy of blockchain-based
    systems may appear surprising at first, but it is less so when we consider how
    conformity with higher-order rules is one of the essential sources of these systems’
    legitimacy. As discussed above, beliefs about how others will act in a given situation
    are shaped by the technical and game theoretical rules embedded in a blockchain-based
    system. Protocol rules, such as consensus mechanisms, provide the basis on which
    the validity of new blocks can be tested. However, these on-chain rules may sometimes
    lack instructions about rulemaking on certain issues and principles that articulate
    a community’s shared values and norms—a gap that can make these systems less adaptable
    to change and emergencies. Without expressly articulating a system’s shared values
    and core principles, predictions about how others will act becomes more fragile
    and harder to anticipate. On-chain governance can become unreflective of developments
    off-chain, and the existence of Schelling points cannot be taken for granted.
    For several blockchain projects, the solution was articulating a constitution
    in an off-chain written document, stipulating a series of secondary rules on how
    primary (on-chain) rules are to be made, amended, or removed, along with a set
    of guiding principles. A constitution can serve several purposes, including the
    design of governance institutions,


    ## Non-State Actors and Constitutional Orders


    While states are the ones typically associated with constitutions, nonstate actors
    are also progressively adopting these documents. The ICANN (Internet Corporation
    for Assigned Names and Numbers) is a prominent example in this regard. To assign
    domain names, ICANN brings together a constellation of state and nonstate actors
    within a governance system that has its own dispute resolution system as well
    as its own set of secondary rules (i.e., rules on how to make rules). As a consequence,
    some scholars argue that ICANN has created its own constitutional order.


    ## On-Chain Constitutions and Forking


    Some scholars argue that blockchain networks already have constitutional rule
    sets and constraints enshrined into the protocols.


    The on-chain constitution is not set in stone as there is always the opportunity
    to fork a blockchain protocol, thereby exerting a “competitive pressure” on the
    previous protocol.


    ## Bridging On-Chain and Off-Chain Governance


    As with state constitutions—where the formal constitution always faces pressures
    to represent the “actual relations of forces” in the state (i.e., forces exerted
    by the interests of capital, the working class)


    A written constitution, in an ideal sense, would bridge the on- and off-chain
    elements of blockchain governance and enable a tighter and more responsive connection
    between the formal constitution recorded on-chain and the more tacit material
    constitution that mostly subsists off-chain. For instance, the Ethereum Naming
    Service (ENS) protocol (i.e., Ethereum’s equivalent of the Internet’s Domain Name
    Service system) is governed by a constitution that provides “binding rules that
    determine what governance actions are legitimate for the [ENS] DAO to take” as
    well as the quorum and supermajority voting requirements needed to amend the constitution.


    ## Community Values and Principles


    As Tan and colleagues show, many of these documents also articulate more general
    principles and values held by the community (with openness, inclusivity, and decentralization
    being common themes).


    ## Optimistic and Pessimistic Outlooks


    As with political governance, there is more than one path toward enhancing a blockchain
    system’s legitimacy. Optimistically, the drafting of such constitutions would
    enhance the endogenous legitimacy of blockchain systems as they would explicitly
    articulate shared values. These shared values, and being able to collectively
    enforce these values, can contribute to strengthening the pattern of higher-order
    acceptance that is central to Buterin’s vision of legitimacy. More ambitiously,
    this development can shape new normative conceptions of legitimacy that further
    people’s freedom and human rights.


    A more pessimistic outlook would be that such constitutions are aspirational at
    best and dead letters at worst. In lieu of more blockchain constitutions having
    robust, yet distributed, enforcement mechanisms, value statements could potentially
    create new sources of community discord (e.g., for not being sufficiently representative)
    or even legal risk (i.e., for potentially creating new types of liabilities on
    the participants to the network). This could, perversely, undermine the legitimacy
    of a blockchain-based system.


    ## Competitive Dynamics and Best Practices


    However, as Alston and colleagues argue, these different approaches to, and debates
    about, constitutionalization open up competitive dynamics among different governance
    systems. In competing to offer legitimate governance systems, we anticipate that
    best practices will emerge on the design of blockchain constitutions.


