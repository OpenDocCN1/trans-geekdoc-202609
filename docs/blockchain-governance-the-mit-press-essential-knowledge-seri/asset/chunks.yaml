    one or more blockchain systems while nonetheless abiding by the *rule by code*.
    This is the case, for instance, of many cryptocurrency exchanges, like Coinbase,
    Kraken, Binance, or the now infamous FTX, which are intended to facilitate the
    trading of various digital assets. Despite interfacing with a blockchain, these
