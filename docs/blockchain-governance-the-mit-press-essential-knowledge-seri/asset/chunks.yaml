- raw: 'The DAO was a first-of-its-kind experiment in on-chain governance, which refers
    to rules and decision-making procedures that are encoded into the infrastructure
    of blockchain-based systems. An example of such a rule is the cap on Bitcoin quantity,
    which ensures that no more than 21 million Bitcoins will ever be created. Similarly,
    an on-chain decision-making procedure can be illustrated by Bitcoin’s PoW consensus
    mechanism, which is used to validate transactions on the blockchain. The DAO was
    designed to operate as a distributed crowdfunding platform that would replace
    the arbitrary coercive power vested in traditional platform operators like Kickstarter
    with what we characterized in chapter 3 as the *rule of code*. Any of the globally
    distributed token holders of The DAO would be able to propose new projects that
    people could invest in, and the decisions made through this decentralized governance
    system would be executed “autonomously” through smart contracts.


    To envision how this might work, take the example of an apartment rented through
    a DAO that simulates the Airbnb platform. When renting a place on Airbnb, you
    need to use a centralized payment system such as PayPal to transfer funds to the
    host. Then, you must receive a physical key or an apartment code, which can occasionally
    become problematic. For instance, if the key isn’t handed over upon arrival, you
    would have to find alternate accommodation and possibly enter into an arbitration
    procedure to recoup any costs and damages. When operated through a DAO, you would
    instead enter into a smart contract linked to a physical “smart lock” attached
    to the property. Once you enter into an agreement through The DAO to rent the
    place, everything would happen automatically: an amount would be deposited from
    your account on a smart contract, allowing you to unlock the smart lock when you
    arrive. At the end of your stay, the deposit would automatically be returned to
    you minus the rent, and you would no longer be able to unlock the door.


    In fact, this type of solution was the one proposed by the developer team of Slock.it,
    the company that proposed and built The DAO. Beyond automating access to a property,
    The DAO could do much more. Using a combination of on- and off-chain governance
    tools, token holders could even directly make decisions that are usually taken
    by a board of directors, like how to distribute dividends from profits made through
    the platform. In short, it could potentially encompass all governance functions
    of a platform like Airbnb by means of self-executing rules of code.


    What type of “legal order” does a DAO implement, and what would establish the
    validity of a “law” in such an order? Striking similarities can be established
    between the legal positivism established by Kelsen and the principles underlying
    a DAO’s design. According to Kelsen, the validity of a law cannot be derived from
    its content. The description of “John opens the cash machine in the neighborhood
    shop, takes out $200, and runs away” does not by itself qualify as an act of *theft*.
    For this, one needs a norm that forbids stealing. Conveniently, software code
    is both descriptive and performative, being able to combine a statement with a
    normative, deontic operation (e.g., allowing, forbidding, restricting). Similar
    to Kelsen’s test of validity, the validity of a transaction on a DAO is not derived
    from the transaction’s content. Instead, it is derived from the norm encoded in,
    for instance, a smart contract that determines whether a transaction can or cannot
    be made.


    But if the validity of a rule is derived from a norm, where does the validity
    of that norm itself come from? Kelsen argues that “the reason for the validity
    of a norm can only be the validity of another norm.”


    If blockchain-based systems like The DAO implement a legal regime similar to Kelsen’s
    characterization of a positive legal order, would they also be vulnerable to Schmitt’s
    critique? Schmitt contended that by its very nature, an exception cannot be legally
    determined in advance. Hence, decisions must first establish whether there indeed
    is an exception and, second, determine how to manage it. According to Schmitt,
    the issue is that legal positivism attempts to dissolve these political decisions
    in an impersonal system, like the system of parliamentarism that subjects all
    decisions to procedures that have to be followed (e.g., majority requirements
    in voting). These procedures could allow decision-making to dissolve into endless
    discussion, affecting the effectiveness of governance. This is fine in normal
    situations, which allow for lengthy negotiations between particular interests
    (e.g., child safety advocates versus gun rights advocates in the US). Yet, when
    an emergency arises—such as an insurrection—we don’t have the luxury of channeling
    decision-making through such a system because an urgent decision becomes *necessary*.
    And such a decision, Schmitt contends, is taken by a personal agency that arises
    out of the impersonal system, a latent sovereign power that cannot be cast aside.


    Schmitt’s claim has an empirical basis. Most states have constitutional provisions
    that allow for the executive to suspend the normal legal order by declaring a
    state of emergency. Consider, for instance, the emergency powers enacted in France
    after the 2015 terrorist attacks, which, according to some, led to a “permanent
    state of emergency,” suspending the basic rights of certain groups.


    As Dyzenhaus explained, right-wing conservative forces in Germany coalesced to
    turn the country from a democracy into an authoritarian state.


    ## The DAO Attack


    The DAO attack has been a pivotal event in the Ethereum community because it brought
    out a tension that goes right to the core of the underlying blockchain technology,
    namely whether its presumed immutability can or should prevail over human agency.
    Immutability, it turned out, is not an inherent feature of a blockchain but rather
    a norm underpinning its management and operations. This norm is similar to what
    Dyzenhaus claimed is the underlying concept of Kelsen’s legal positivism, namely
    “that no individual should be subject to the will of any other individual or group
    of individuals,”


    What precisely occurred during The DAO attack? Let us turn to a chronological
    depiction of events. On April 30, 2016, The DAO was deployed on the Ethereum blockchain
    and a four-week crowdfunding period followed in which funds were raised through
    an ICO. Anyone could send Ether to The DAO and receive The DAO’s native tokens
    in exchange. During this time, the community also discussed proposals for ways
    that DAO funds might be spent.


    Well before The DAO went live, concerns were raised about potential vulnerabilities
    in the code base and its governance. A proposal was published on May 26 by the
    Slock.it team itself for updating The DAO’s security and appointing a security
    expert. Despite these concerns, at the end of the crowdfunding period on May 28,
    The DAO went live. It had amassed a staggering capital contribution, worth approximately
    USD 150 million in cryptocurrency. On June 5, a new technical vulnerability was
    discovered in The DAO’s code that would enable a potential attacker to repeatedly
    call a vulnerable withdrawal function and siphon assets before the smart contract’s
    balance could be updated. In light of this discovery, the Slock.it team started
    to work on an update of The DAO that would solve this vulnerability as well as
    other security issues. On June 12, the company released a statement stating that
    “no funds were at risk.” Yet, on June 17, an anonymous user exploited this vulnerability
    to drain The DAO’s funds, siphoning 3.6 million ETH (approximately USD 60 million
    at the time) from The DAO’s smart contract to another DAO controlled by the attacker.'
