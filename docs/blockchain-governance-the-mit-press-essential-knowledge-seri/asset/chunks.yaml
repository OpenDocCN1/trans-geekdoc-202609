    the former refused to provide a "backdoor" into an iPhone''s code to give law
    enforcement access to this phone during a criminal investigation. Yet even though
    sovereignty in these matters isn''t exclusively tied to the state, it is tied
    to centralized entities and divorced from the user base. `X` users, for instance,
    will have to abide either to the rule of law enforced by a state like the United
    States or to the rule of Elon Musk, who can unilaterally change the codebase (e.g.,
    by taking away the "right" of users to have a blue checkmark).


    ### Regulation via Governance


    Blockchain problematizes and challenges this picture. As we saw in chapters 3
    and 6, blockchain-based systems introduce the rule of code, which raises the possibility
    of alegality by design, that is, the potential of these systems to enable acts
    that transgress legal boundaries. Unlike a centralized platform like `X`, blockchain-based
    systems execute code without the possibility of coercion by any single operator.
    Moreover, they are transnational and (to some extent) decentralized, meaning that
    shutting down part of a network will not affect the operations of the overall
    network. This poses significant challenges to regulators, and states have been
    busy finding ways to reel in the anarchic potential of blockchain-based systems.
    To be sure, some of these efforts are backed by good reasons, for instance, in
    cases of cyber criminality and theft. Yet, there is also a risk of throwing out
    the baby with the bathwater and undoing some of the innovative potentials of blockchain
    technology.


    ### Targeting Intermediaries: Mining Regulation


    It is tempting for governments to focus on the low-hanging fruit, which means
    regulating powerful intermediaries in blockchain networks. Indeed, blockchain
    governance is not purely decentralized but rather functions according to the dynamics
    of a polycentric system. Many of the stakeholders in a blockchain network are
    incorporated as legal entities in specific jurisdictions, and are thus susceptible
    to government regulation. First, mining activities achieved by small businesses
    or large mining pools are an easy target of state regulation. A case in point
    is `Iran`, where commercial mining licenses were initially granted in the years
    2019–2020. Later on, however, the political situation changed, and under the surging
    "climate of fear" in the country, all mining operations were banned to protect
    against potential energy blackouts. These types of repressive mining regulations
    can have a negative impact on local businesses, but do not significantly affect
    the overall functioning of a blockchain, as long as there are sufficient mining
    activities carried out elsewhere.

    '
  trans: '

    ## 第三部分：区块链信任机器与危机


    第三，区块链信任机器在正常情况下运作良好，但可能会受到危机的严重挑战。当代码中的漏洞被利用时，就会出现此类危机，在最坏的情况下，这可能导致基于区块链的系统面临生存威胁。当此类威胁出现时，区块链网络中的私人利益可能会凝聚并组织成一种主权力量，能够决定例外状态是否存在以及如何解决它。我们可以从凯尔森和施米特等学者那里汲取关于这种脆弱性的教训。应对例外状态脆弱性的可能措施包括加强链上治理（例如使用
    `PoW` 而非隔离见证），以及加强链下治理（这可能涉及制定规则，暂时将行政权力委托给区块链网络中的特定参与者）。


    ## 第四部分：区块链作为一种监管怪兽


    第四，即使在正常时期，区块链技术也是一种奇怪的监管怪兽，因为它抗拒被监管。作为早期互联网“不可监管性”主张的更强有力继承者，区块链网络无法被任何机构（如国家）强制或直接关闭。这就是为什么区块链支持者称其为“非法律技术”，即超越法律掌控的技术。依据林达尔的法律理论，这一主张在一定程度上是成立的——但并非区块链倡导者所建议的那种意义上。区块链确实通过配置可能越过法律界限的行为，实现了“设计上的非法律性”。然而，国家有办法应对这种非法律性，在某些情况下涉及监管交易所等重要中介，在其他情况下则寻找功能或监管等价物来塑造区块链系统的合法性。


    ## 第五部分：区块链系统中的合法性


    第五，区块链系统只有在享有合法性时才能运作。合法性是布特林称为区块链系统最重要稀缺资源的东西，区块链社区维持自身和繁荣发展都需要它。它证明了赋予网络的权力是正当的，这种权力源于对特定规则的遵守（例如管理区块链更新的规则）、对共同信念的尊重（例如不可篡改性），且通常由参与者的同意来证明。区块链系统的特殊之处在于，它们允许相对容易地退出（人们可以直接离开或分叉区块链），但又依赖于网络效应的存在。这提高了“发声”和“忠诚”的重要性。在大多数政治共同体中，这些方面通过宪法来促进，宪法是由一套法律规范支持的正式文件，证明了权威使用权力的正当性。与国家一样，区块链也有宪法，它们位于链上（即协议）和链下治理之间。区块链系统中的合法性建设可以通过起草链下宪法的努力来实现，一些区块链社区正在尝试这一点，但这一过程本身也伴随着风险。


    ## 政策


    鉴于此 TL;DR（太长不看版本），政策制定者和区块链社区都面临着许多区块链治理挑战。如何通过更好的治理实践来建立信任？如何使区块链系统对例外状态的脆弱性降低？如何将区块链设计固有的非法律性融入现有法律体系而不破坏去中心化？如何为多中心区块链系统制定和实施良好的治理？以及，最重要的问题，如何确保区块链治理的合法性？鉴于这些无数问题，政策制定者有不同的途径来应对区块链技术带来的监管和治理挑战。总体而言，有两条主要路径。


    ### 代码监管


    首先，政府可以追求“代码监管”，这将遵循互联网治理的主流方法。其次，政府可以追求一种更非传统但可能更有前景的“通过治理进行监管”方法。让我们看看这两种范式。


    大型互联网平台的崛起表明，政府可以利用这些平台的代码库来实施监管。也许最具影响力的案例是欧盟的 `GDPR`（通用数据保护条例）。因为该法规为中心化组织开发的代码的潜在配置设定了标准和限制，它利用了代码的类法本质为自己谋利。这也允许对代码进行审计，以评估其是否包含适当的监管保障措施，如果缺失，则对组织进行处罚。`Google`
    和 `Meta` 等参与者的中心化本质在此是一种监管优势，因为这些组织可以充当法律长臂的延伸。这在刑事调查中也变得显而易见，例如当 `FBI` 等机构施压公司披露用户个人信息时。当然，公司仍保持相对自主的地位。`Apple`
    和 `FBI` 之间的冲突清楚地证明了这一点，前者拒绝为 iPhone 代码提供“后门”，以便执法部门在刑事调查期间访问该手机。然而，尽管在这些事务中主权不完全属于国家，但它属于中心化实体，而与用户群体脱节。例如，`X`
    用户将不得不遵守美国等国家实施的法治，或遵守埃隆·马斯克的统治，后者可以单方面更改代码库（例如，取消用户拥有蓝色认证标记的“权利”）。


    ### 通过治理进行监管


    区块链使这一图景问题化并提出了挑战。正如我们在第 3 章和第 6 章所见，基于区块链的系统引入了代码统治，这引发了“设计上的非法律性”可能性，即这些系统使越过法律界限的行为成为可能。与
    `X` 等中心化平台不同，基于区块链的系统在执行代码时，不存在被任何单一运营商强制的可能性。此外，它们是跨国的且（在一定程度上）去中心化的，这意味着关闭网络的一部分不会影响整个网络的运行。这给监管者带来了重大挑战，国家一直在忙于寻找方法来收拢基于区块链的系统的无政府主义潜力。当然，其中一些努力有正当理由支持，例如网络犯罪和盗窃案件。然而，也存在“倒掉洗澡水连婴儿一起倒掉”的风险，从而抵消了区块链技术的一些创新潜力。


    ### 瞄准中介：挖矿监管


    政府很容易专注于“触手可及的果实”，即监管区块链网络中的强力中介。确实，区块链治理并非纯粹去中心化，而是根据多中心系统的动态运作。区块链网络中的许多利益相关者在特定司法管辖区注册为法律实体，因此容易受到政府监管。首先，小企业或大型矿池进行的挖矿活动是国家监管的易攻击目标。典型案例是
    `Iran`（伊朗），该国在 2019-2020 年最初授予了商业挖矿许可证。然而，后来政治局势发生变化，在该国涌动的“恐惧氛围”下，所有挖矿业务被禁止，以防止潜在的能源停电。这类压制性的挖矿监管可能对当地企业产生负面影响，但只要其他地方有足够的挖矿活动，就不会显著影响区块链的整体运行。

    '
