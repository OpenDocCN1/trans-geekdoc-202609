- raw: 'Second, blockchain is surrounded by significant legal and regulatory uncertainty.
    Even though states have started formulating policies and regulations for blockchain
    technologies, several of these efforts are often plagued by both a lack of expertise
    and a lack of foresight. Blockchain technology confronts us with the Collingridge
    dilemma. On the one hand, as long as the technology is still emerging, its consequences
    will be uncertain and therefore difficult to control. For instance, The DAO attack
    in 2016 (discussed in chapter 5) had significant impact but was unforeseen—and
    even unintelligible—for most policymakers. On the other hand, as soon as blockchain
    technology gets entrenched in established institutions or ways of life, its consequences
    might be predictable, but the technology will be hard to control or steer. Projects
    are currently underway that aim to make blockchain the underlying technology for
    the governance of social media, global supply chain management, and global identity
    registries. Whether these projects succeed remains to be seen, but if they do,
    their consequences will be widespread, and it will become increasingly difficult
    to address or revert them. An important way to deal with this legal uncertainty
    is to analyze the potential regulation and governance challenges through the lens
    of legal and political theory, which is what this book intends to do.


    Third, blockchain is increasingly challenging our conceptual understanding of
    law and regulation. It does so in different ways. To start, it challenges and
    extends the concerns raised by scholars of Internet governance, related to the
    adage that “code is law.” While most people and organizations operating on the
    Internet continue to be subject to state laws, blockchain adds a new dynamic by
    promoting the autonomy of code. Blockchain systems purport to generate their own
    legal reality that is independent of the will of human participants interacting
    through them—and can therefore not be instrumentalized by centralized authorities—which
    in this book is captured as the rule of code, by way of analogy to the “rule of
    law.” The rules enshrined in blockchain-based systems are such that they share
    certain features with state and nonstate constitutional law systems. Moreover,
    by operating transnationally, blockchain systems are, to some extent, detached
    from the sovereignty of particular nation-states. They thus bring to the forefront
    a challenge earlier identified by scholars in the fields of societal, global,
    and digital constitutionalism, namely that constitutional orders are not limited
    to the sovereignty of nation-states. Instead, transnational organizations, large
    platforms, and now also quasi-autonomous blockchain systems generate constitutional
    orders that are simultaneously compatible and in tension with established laws
    and regulations (discussed in chapter 7).


    Fourth, because of their inherent characteristics, blockchain systems introduce
    new modes of governance that urge us to rethink established political concepts.
    Political philosophy has revolved around certain key questions concerning political
    authority and sovereignty (e.g., what is the basis of sovereign power?), legitimacy
    (e.g., why do citizens accept and obey a system of governance?), and democracy
    (e.g., what are good procedures for democratic decision-making, how are citizens
    represented by political bodies?). Blockchain governance adds new dynamics to
    each of these questions, thereby also challenging established political concepts.


    For instance, while in traditional organizations authority is ultimately vested
    in human decision makers, the authority of blockchain-based systems is vested
    in a (purportedly) immutable code-based protocol, which will execute as planned
    regardless of the intent of the parties involved. Besides, even where human governance
    is involved, the pseudonymity inherent in most blockchain networks precludes an
    important set of governance dynamics (including the “one person, one vote” principle
    in traditional democracies), ultimately favoring more plutocratic or meritocratic
    modes of governance. Legitimacy also increasingly acquires a crucial role in blockchain
    systems, not as a means to justify the coercive actions of a sovereign—as in more
    traditional centralized governance structures—but as a mechanism to ensure loyalty
    to a system that is ultimately driven by voluntary participation. Finally, to
    the extent that blockchain systems can be regarded as “polycentric” governance
    systems (i.e., systems characterized by multiple overlapping centers of decision-making
    under an overarching shared set of rules), new questions emerge concerning the
    appropriate scale(s) at which these networks should (or can) be governed—from
    the individual core developer, via the multinational cryptocurrency exchange,
    to the globe-spanning technical infrastructure of the network itself.


    For some scholars, corporate governance offers a more appropriate theoretical
    lenses with which to analyze blockchain systems than political governance, as
    these systems rely on “voluntary cooperation” (like corporations) and act “more
    like markets than hierarchies.”


    Yet, the lens of corporate governance alone is insufficient to understand the
    complexity of blockchain governance. First, the status of permissionless blockchains
    as a shared infrastructural technology—a common good—calls for insights from political
    science and political economy (e.g., commons management).


    While some of these reasons for studying blockchain governance might seem abstract
    at first, this book will show, by means of examples, that they have real consequences.
    Our selection of examples is based on a desire to illustrate the implications
    of different governance choices on the operations of blockchain systems with canonical
    cases, while also providing an account of more recent cases, which might eventually
    become landmark cases in the history of blockchain governance. For instance, the
    example of Steem (chapter 4) shows how a neglect of the role of trust in blockchain
    networks can lead to problematic centralized dynamics, including hostile takeovers.
    The DAO attack (chapter 5) illustrates how blockchain networks can suffer emergency
    crises, which might lead to violations of their core principles. The recent examples
    of Ooki DAO (chapter 3) and the Tornado Cash (chapter 6) show how even relatively
    simple blockchain applications can challenge the boundaries of legal systems,
    leading lawmakers to take drastic and sometimes draconian countermeasures. These
    concrete examples demonstrate the relevance of discussing blockchain governance
    in the light of legal and political theory, and hence the relevance of this book
    for blockchain developers, policymakers, and anyone with a general interest or
    stake in the technology.


    ## This Book


    *Blockchain Governance* places itself at the heart of a burgeoning global conversation
    between academics, developers, and policymakers. The book starts with an in-depth
    introduction to the technical aspects of blockchain and the particular governance
    forms it enables (chapter 2). From there, it embeds the discussion on blockchain
    governance within the broader context of Internet governance. It argues that blockchain
    technology has enabled a shift from the *rule by code* model of traditional Internet
    platforms to a new *rule of code* model, with particular implications for the
    interaction with traditional *rule of law* systems (chapter 3).'
