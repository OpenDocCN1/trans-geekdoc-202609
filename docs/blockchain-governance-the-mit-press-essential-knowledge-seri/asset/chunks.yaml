    # Series Foreword


    The MIT Press Essential Knowledge series offers accessible, concise, beautifully
    produced pocket-size books on topics of current interest. Written by leading thinkers,
    the books in this series deliver expert overviews of subjects that range from
    the cultural and the historical to the scientific and the technical.


    In today’s era of instant information gratification, we have ready access to opinions,
    rationalizations, and superficial descriptions. Much harder to come by is the
    foundational knowledge that informs a principled understanding of the world. Essential
    Knowledge books fill that need. Synthesizing specialized subject matter for nonspecialists
    and engaging critical topics through fundamentals, each of these compact volumes
    offers readers a point of access to complex ideas.


    # Preface


    In the spring of 2023, when we were wrapping up the book that you are now reading,
    a remarkable gathering happened on the coast of the Adriatic, in a resort near
    Tivat in Montenegro. A few hundred people, including two of us, assembled in Zuzalu,
    a pop-up city initiated by (among others) the visionary founder of the Ethereum
    blockchain, Vitalik Buterin. People from all kinds of backgrounds—blockchain engineers
    and computer scientists, artists and philosophers, entrepreneurs and lawyers,
    and so forth—came together to discuss a variety of topics, from artificial intelligence
    to human longevity and the future of the nation-state.


    Zuzalu was home to a variety of ideologies and interests. Some residents were
    involved in establishing zones that were beyond the jurisdiction of any state’s
    legal system so that they could test life extension treatments. For them, Zuzalu
    was a tentative manifestation of the “network state,” a concept introduced by
    Silicon Valley tech entrepreneur Balaji Srinivasan, which envisions dispersed
    networks of people and capital ultimately gaining recognition as sovereign entities.
    The idea of the network state builds on libertarian visions that have a long history.
    This ranges from the secretive Galt’s Gulch, an enclave in Ayn Rand’s *Atlas Shrugged*
    that survives the collapse of ineffective government, to seaborne platforms in
    the high seas that, according to Peter Thiel, would allow humankind to escape
    politics and secure spaces safe for capitalism and freedom. Yet, for many other
    residents, the appeal of Zuzalu was the opportunity it provided for imagining
    postcapitalist futures within existing nation-states and developing new tools
    and practices for societal transformation. In this sense, its ethos was more like
    Calafou, a self-managed eco-industrial colony in Catalonia where Buterin spent
    time in the months leading to the drafting of the Ethereum white paper.


    A shared interest of Zuzalu residents was that the world’s established institutions,
    and governance as we now know it, are not the only tools we have to govern society.
    We don’t need to be citizens of nation-states with defined territories and the
    rights and duties that traditional citizenship entails. Instead, we can move between
    “digital tribes” and “network archipelagos,” which may exist anywhere, at any
    time. We would have multiple citizenships and belong to multiple networks, all
    based on our personal interests that would sometimes converge and sometimes diverge.
    For some, the network state promises a do-over, an opportunity to dismantle the
    regulations, red tape, and bureaucracy that characterize modern states and to
    rebuild societies as bastions of human autonomy, political liberty, and economic
    freedom. For others, the network state is a buzzword that is being used to market
    wild colonial enterprises, from Central America to the South Pacific, that operate
    without democratic oversight, threaten hard-won statutory protections, and place
    local communities and institutions at risk. In this way, some have tried to turn
    Puerto Rico into a crypto tax haven and test bed for experimenting with new technologies,
    while leeching on to the local population.


    In contrast, other visions do not see *exit* as the central organizing principle
    of global governance but rather *interdependence*. In the sessions two of us convened
    at Zuzalu, we discussed the ideas of “coordi-nations” and “new network sovereignties,”
    which can leverage blockchains and other technologies (e.g., for identity management)
    but are primarily intended to foster human cooperation at local and global levels
    through the cultivation of shared values, participatory governance, and the mutualization
    of resources. Instead of privatizing public goods or gnawing away at the sovereignty
    of the state, coordi-nations would coexist with the state and meet needs that
    states do not. Whatever your views on this subject may be, for us Zuzalu was akin
    to an ancient Greek agora, a place where people could freely exchange utopian
    ideas through agreement and contestation.'
