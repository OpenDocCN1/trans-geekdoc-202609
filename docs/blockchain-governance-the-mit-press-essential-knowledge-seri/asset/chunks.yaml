- raw: 'Written in 1941, Speedy’s story highlights the potential dangers of relying
    too heavily on AI without fully understanding how it works or being able to fully
    predict its behavior. Most importantly, it illustrates how—regardless of the robot’s
    actual intentions—any attempt at regulating AI systems with human laws will always
    lead to confusion due to the inherent ambiguity and flexibility of natural language.


    When combined with a blockchain-based infrastructure, these challenges become
    even more problematic. Even if they do not come with sophisticated AI (yet), blockchain-based
    systems have already been deployed, operating autonomously on a distributed ledger,
    independently of any centralized authority. By virtue of their technical characteristics,
    these systems can be created in such a way that no one has the power to shut them
    down (i.e., there is no kill switch). They will continue to operate as long as
    there are enough nodes maintaining the underlying blockchain on which they run.
    As we will see later in the chapter, some of these systems have already proven
    to be capable of harm, most notably financial harm, money laundering, and terrorism
    financing.


    While it may be difficult to codify the laws of robotics into blockchain systems,
    which are incapable of comprehending human language, the alternative is to codify
    human laws into the strict and formal language of code. Yet, what computer code
    provides in terms of accuracy and precision, it loses in terms of flexibility
    and granularity. As such, it cannot adequately capture the nuances of human values,
    ethical principles, and morality that can only be expressed in natural language.
    Hence the paradox arises: on the one hand, blockchain-based systems cannot be
    expected to abide by the rule of law, which is formulated as general principles
    rather than specific instructions codified into code; on the other hand, any attempt
    at codifying Asimov’s laws into the rule of code, with specific instructions based
    on if-then conditionals, will necessarily reduce them to a form that is too simplistic
    to be sufficiently meaningful.


    ## Rule by Code


    “Governments of the Industrial World, you weary giants of flesh and steel, I come
    from Cyberspace, the new home of Mind.” Thus begins the Declaration of Independence
    of Cyberspace, written in 1996 by American author and political activist John
    Perry Barlow. Barlow continues: “You are not welcome among us. You have no sovereignty
    where we gather. . . . You have no moral right to rule us nor do you possess any
    methods of enforcement we have true reason to fear.” Barlow regarded cyberspace
    as a place where individual sovereignty is neither derived from nor subordinate
    to the sovereignty of any state. Indeed, he believed that governments simply did
    not have the right, nor the effective capacity to, control this new world, saying
    “cyberspace does not lie within your borders.”


    Barlow saw the Internet as an infrastructure governed by a set of protocols and
    standards (e.g., TCP/IP, HTTP, SMTP) encoded in the software and hardware layers
    of the network. Initially developed by the Defense Advanced Research Projects
    Agency, many of these protocols were subsequently developed through an open and
    decentralized process, thanks to the voluntary efforts of developers, researchers,
    and engineers—and later standardized by nonprofit organizations such as the Internet
    Engineering Task Force or the World Wide Web Consortium. This process of open-source
    development and standardization allowed for rapid and permissionless innovation,
    where anyone with a computer and an Internet connection can develop and deploy
    new applications without having to seek authorization from anyone.


    Yet, Barlow’s vision of a new digital space that escapes from governmental control
    failed to anticipate the role that code could play in governing the digital realm.
    He did not foresee that this new independent space could easily be co-opted by
    a new set of (private) actors, eager to establish their own (technical) rules
    into the digital domain.


    The concentration of traffic in the hands of a few large online operators—chokepoints—is
    a threat to the open and decentralized nature of the Internet as originally envisioned
    by Barlow. Indeed, as companies like Google and Meta have grown in size and power,
    they have also come to exercise an increasingly large degree of control over the
    way we use the Internet. They have done this in a number of ways, including through
    the development of proprietary software and platforms that are not compatible
    with each other, through the use of algorithms that favor their own products and
    services over those of their competitors, and through the use of terms of service
    that give them the right to censor or delete content that they deem to be objectionable.
    Most importantly, these companies are leveraging code to precisely stipulate what
    users can or cannot do on their own platform, in ways that often go beyond


    Barlow’s vision of a new digital space that escapes from governmental control
    failed to anticipate the role that code could play in governing the digital realm.


    In his book *Code and Other Laws of Cyberspace*, Lawrence Lessig analyzed the
    various ways in which the architecture of the Internet—including both the software
    and hardware layers—can shape and govern our behaviors in the digital space. ![Figure
    4 Lessig’s four modes of regulation.](images/14994__000_fig_004.jpg)


    Figure 4 Lessig’s four modes of regulation.


    In recent years, the development of the Internet has become increasingly dominated
    by a small number of large companies, which control large parts of the Internet
    infrastructure. These include the servers that host our data (e.g., Amazon), the
    social media platforms that connect us (e.g., Facebook/Meta), the web browsers
    that we use and the operating systems that run our devices (e.g., Google/Android)—in
    addition to all the applications that we use to access our email, browse the web,
    use social media, and shop online. As a result, these online operators dictate
    what can or cannot be *technically done* on their platforms, independently of
    what can or cannot be *legally done*.


    This has led to the emergence of cloud empires


    This new form of sovereignty presents a challenge to traditional forms of governance,
    as the rules that govern digital platforms are not always transparent or accountable
    to their “citizens.”


    Conversely, some countries—mostly those under authoritarian regimes—operate according
    to the “rule by law.”


    When it comes to the regulation of Internet platforms, online operators generally
    have full discretionary power over the rules they chose to codify into their platforms,
    often with no accountability to any external authority nor any checks and balances.
    We introduce the concept of the “rule by code” to describe the governance of these
    online platforms: a regime where online operators have the power (and the tendency)
    to design and amend the code and technological infrastructure of their online
    platforms, primarily as a means to serve their own economic or political interests.
    The rule by code, characterized by the instrumentalization of computer code to
    serve the interests of powerful tech companies, thus presents itself as the software
    equivalent of the rule by law, characterized by the arbitrary wielding of laws
    to serve the interests of powerful sovereigns.


    But the rule by code is not only instrumental to the interests of online operators.
    It can also serve the interest of governmental actors, insofar as the online operators
    that control the code are themselves under the jurisdiction of a sovereign authority.
    Indeed, many of the online platforms that are ruled by code can be (and have been)
    co-opted by established powers to serve their own political interests—as clearly
    shown by the successful efforts of US security services to collect data from large
    online platform operators at the expense of user privacy.'
