    By revisiting the core properties of blockchain technology described in the previous
    chapters, chapter 3 focused on assessing their compatibility with established
    legal principles rooted in the rule of law. On the one hand, the chapter discussed
    how blockchain-based systems endeavor to emulate certain aspects of the rule of
    law by introducing what we refer to as the *rule of code*, made of predefined,
    automated, and transparent rules encoded directly into the technological fabric.
    This represents a fundamental shift from the more traditional *rule by code* of
    centralized online platforms as it guarantees that the code applies equally to
    everyone and no one stands “above the code.” On the other hand, the chapter has
    shed light on some of the inherent limitations of this emerging paradigm of code-driven
    regulation, which might potentially come into conflict with existing regulatory
    frameworks. The insights from this chapter will inform the regulatory strategies
    and discussion in chapters 6 and 7.


    # 4


    # Problem of Trust


    Oh, you have trusted somebody? Glad to hear of any instance of that sort. Reflects
    well upon all men.


    —Herman Melville, *The Confidence Man*


    ## Con Men


    On a day in April, in nineteenth-century America, a stranger boards a boat traveling
    along the Mississippi. Unbeknownst to his fellow passengers, he is a “confidence
    man.” He plays psychological tricks on them, gaining their confidence to have
    a personal advantage. This central premise of Herman Melville’s novel *The Confidence
    Man* popularized an infamous figure in American society. The confidence man (commonly
    abbreviated as “con man”),


    America in the mid-nineteenth century was a special place because it was an eminent
    example of a society of strangers. People came from everywhere, from all backgrounds.
    Especially in sprawling metropolises like New York City, no one could be fully
    trusted outside of one’s close-knit community because the place lacked what Simmel
    calls “organic” connections, built on shared histories and rituals of small communities
    or friends and family ties. Instead, America had to rely on “inorganic” connections:
    a shared language (English), monetary system (the dollar), civic education, and
    a set of social etiquettes. Many of these connections are mediated via sociotechnical
    systems, involving the interaction of social and technical components and subsystems.
    They also include things like credit reporting, which established a common, if
    very biased, measure of moral character.


    The protagonist of *The Confidence Man* was, in all likelihood, modeled on a swindler
    named Thompson, who had been apprehended in New York City in 1849. He was found
    in possession of a great number of stolen watches that he had obtained from random
    strangers. One day later, his arrest was mentioned in the *New York Herald*: “For
    the last few months a man has been traveling about the city, known as the ‘Confidence
    Man’; that is, he would go up to a perfect stranger in the street, and being a
    man of genteel appearance, would easily command an interview. Upon this interview
    he would say, after some little conversation, ‘have you confidence in me to trust
    me with your watch until tomorrow.’”


    Three days later, the newspaper opened with a new piece. It wrote that the idea
    of the confidence man has to be extended beyond that of the individual swindler,
    for there are also confidence men of merchandise and politics. The real confidence
    men, the *Herald* claimed, are the people high up in the palaces of society: the
    bankers, the politicians, the financiers. The real “confidence man” is the one
    who lives and works on Wall Street.


    More than 150 years later, Satoshi Nakamoto had a similar epiphany. He lamented
    the “trust-based model” underlying the financial system, whose credibility had
    eroded in the wake of the 2008 financial crisis. Like the swindler Thompson, the
    bankers had exploited people’s confidence, albeit not in systems of etiquette
    and fashion but in the financial system. What had seemed to be an “objective”
    system that people took for granted with an unquestioning attitude had suddenly
    become highly questionable. People realized that without noticing it, they had
    confided in the banking sector as a third party that would take care of their
    finances. Contrary to the public’s expectation, investment bankers had engaged
    in mind-blowing swindling, selling garbage-grade financial products, and eventually
    burdened the public with their imprudence through an unprecedented bailout. Nakamoto
    believed that in a society of strangers, trust can be a liability. It had to be
    done away with.


    The real “confidence man” is the one who lives and works on Wall Street.


    This thought is not foreign to political philosophy. In writing *The Confidence
    Man*, Melville had been inspired by Thomas Hobbes.


    ## Trust, Confidence, and Systems


    Sociologists have extensively discussed trust, particularly in response to the
    well-known reflections on trust by systems theorist Niklas Luhmann.


    Perhaps the most important takeaway from the academic discussion on trust and
    confidence is that these are rich and ambiguous notions, with no single established
    definition. Rather than trying to come up with a reductive account of these terms,
    let us try here to delineate the differences between the two terms.


    From Luhmann’s systems theory perspective, humans, groups, and societies are systems
    interacting with their respective environments. These interactions are characterized
    by a sense of familiarity—everything that humans recognize as part of their lifeworld—and
    unfamiliarity, the strange. The unfamiliar entails a certain degree of uncertainty,
    requiring mechanisms to cope with this uncertainty. As Luhmann describes, medieval
    Christian societies accomplished this by means of religion, whose function was
    to bring the unfamiliar within the theological worldview that was more familiar
    to believers. Even accidents would be regarded as fate or as the will of God.
    This changed with the secular notion of *risk*, which turned uncertainty from
    a matter of fate into something that would potentially lie within the control
    of human agency. What scholars generally agree upon is that both trust and confidence
    are means to cope with uncertainty in terms of risk. However, the former involves
    accepting the risk and engaging in a situation of vulnerability toward the trustee,
    whereas the latter involves creating systems to reduce uncertainty and therefore
    decrease the risk associated with a particular situation.


    Hence, while the two phenomena share a common basis and are, to some extent, interdependent,
    they remain significantly distinct from one another. The most extreme form of
    trust exists between people with strong ties, especially family members and friends.
    People who benefit from those ties can take conscious risks by establishing trust
    dependencies and acting altruistically, making themselves vulnerable to betrayal.'
