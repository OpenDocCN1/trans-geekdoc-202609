  trans: '

    # 区块链对法律边界的挑战


    ## 物质边界：透明性与抗篡改性


    然而，当聚焦于区块链网络的核心设计时，关于其**超法律性**的主张变得更加可信。以区块链协议的透明性和抗篡改特性为例。由于这些特性，无论内容是有害的（如儿童色情制品）、存疑的（如盗版内容），还是被认为有益于公众的（如受制裁俄罗斯寡头的链上金融交易），要从广泛使用的公共无许可区块链中移除内容都变得呈指数级困难。更重要的是，区块链的透明性和抗篡改性可以彻底改变金融透明度等问题的监管方式。想象一下，法律当局利用区块链分析追踪其怀疑用于犯罪目的的加密资产转移，从而强制实施一种新的金融透明度制度，例如欧盟于
    2023 年通过《资金转移法规》引入的制度。无论这好坏如何，这都呼应了 Wood 所指的区块链系统的**超法律性**，促使我们重新构想如何监管非法活动。区块链技术因此促使我们检验法律的**物质边界**，并可能促使法律秩序中权利和义务分配方式的重新配置。


    ## 主观边界：加密资产的新型财产制度


    区块链还挑战了法律的**主观边界**。请考虑加密资产的新型“财产制度”。在传统财产制度中，所有权由法律定义和授予，国家负责强制执行这些法律，以应对关于所有权的虚假主张。物理占有虽重要，但并非决定谁拥有法律上所有权的唯一标准。相比之下，区块链系统中的新型财产制度被格言“**私钥不在你手中，币就不属于你**”所概括。拥有与加密钱包关联的私钥，使得一个人在技术上成为该钱包中加密货币的所有者，因为这允许行使通常与完全所有权相关的权利，如访问、转移和使用。正如
    FTX 崩盘事件所揭示的，拥有加密资产并不一定能享有所有权权利。FTX 在 FTX 钱包中持有许多用户的加密资产，当交易所倒闭时，许多用户失去了对其加密资产的访问权。对许多人来说，他们是否能重新获得对加密资产的控制权变得不确定。毕竟，法院不一定会强制执行法律上的所有权。例如，加利福尼亚州
    2020 年的一起案件涉及一名用户的主张，称其加密资产分叉产生的财务收益未被其加密托管人转交给他们。法院未支持该主张，因为托管人持有代币，且用户与托管人之间的合同协议赋予了后者决定是否转交分叉资产财务收益的自由裁量权。


    ## 空间边界：DAO 与去领土化


    此外，区块链挑战了法律的**空间边界**。正如 The DAO（见第 5 章）未由中心化运营者控制，也未在任何国家注册，它同时存在于无处不在和无处可寻。在这方面，基于区块链的系统不同于依赖于在某一领土管辖区注册，或至少获得其承认的传统实体。即使在无处不在的跨国公司时代，实体与领土之间的这种联系仍决定了实体与物理世界互动的能力。在不要求在国家注册的情况下承认未注册
    DAO 的独立法律人格，将等同于重绘法律的**空间边界**，并需要重大的政治和行政变革。


    自动化法律应用联盟（COALA）制定的《DAO 示范法》呼吁采取这种方法，要求司法管辖区摒弃本地注册要求，转而承认实现注册政策目标的替代性功能等效和监管等效手段。是否会采纳这种去领土化方法仍有待观察。犹他州基于《DAO
    示范法》颁布的《DAO 法案》确实豁免了注册要求，并承认满足特定条件的未注册 DAO 等同于本地有限责任公司（LLC）。然而，它通过要求注册代理人必须亲自在犹他州，保留了与该司法管辖区的物理联系。


    ## 时间边界：硬分叉与历史的重写


    最后，区块链挑战了法律的**时间边界**。请考虑在 The DAO 遭受攻击后，决定对底层以太坊协议进行硬分叉的决定。虽然在设定的时间点追溯撤销不良过往交易，解决了将
    The DAO 攻击视为一种盗窃行为者的担忧，但其他人认为此举侵犯了“代码即法律”的原则。此举具有**超法律性**，因为它引发了关于行为如何及何时适当发生的顺序的根本问题。恰巧的是，硬分叉的协调行动导致了一个让盗窃受害者得到补偿的结果。在随后的几起区块链协议黑客攻击中，这种协调未再发生，法律也无法命令发生硬分叉。


    ## 区块链系统能否在设计上具有超法律性？


    这些例子展示了区块链网络的设计如何使其能够以特定方式抵抗法律秩序的强制力，甚至促使法律边界的重绘。尽管存在局限性，Wood 关于区块链技术**超法律性**的主张提出了一个有趣的问题：区块链系统能否在设计上具有**超法律性**？在某种程度上，这似乎是成立的。虽然大多数**超法律性**学者将该概念限制在纯粹的政治行动上，但正如
    Winner 所著名论证的，区块链等系统确实具有政治性。


    区块链系统能否在设计上具有**超法律性**？在某种程度上，这似乎是成立的。


    ## 案例研究：Tornado Cash


    一个例子是 Tornado Cash，一种基于区块链的软件系统，用于增强金融隐私。用户可以从一个地址向 Tornado Cash 智能合约发送加密货币，然后提取到另一个地址，从而切断两个地址之间的联系，模糊持有者的身份，并保留对加密货币的控制权。该服务可用于合法和非法目的，范围从匿名慈善捐款到资助黑客。Tornado
    Cash 的独特之处在于，它是以太坊区块链上的一组智能合约，没有中心化运营者可以停止或干预其操作。这是创始开发团队的刻意选择，因为他们希望保持智能合约的不可变性，并使
    Tornado Cash 成为无需信任且自主的——一台真正的“置信机器”——从而维护“**代码即法律**”的信条。


    Tornado Cash 的技术功能使其能够实施超越法律四大边界的**超法律行为**。自部署以来，它通过一种新颖的、更抗审查的金融隐私保护系统，挑战了法律的**时间边界**。同时，在金融隐私权受到威胁之际，该系统通过强化该权利，挑战了法律的**物质边界**。通过隐藏金融交易的来源，Tornado
    Cash 使个人能够进行原本不可行的交易，例如在对外汇支付有严格限制的司法管辖区进行对外汇款，从而挑战了法律关于谁可以或不可以采取某些金融行动的权威。最后，与未注册
    DAO 类似，由于 Tornado Cash 是一组同时存在于无处不在和无处可寻的智能合约，它通过挑战任何国家对其主张管辖权的能力，越过了法律的**空间边界**。

