  trans: '

    # The DAO：链上治理与法律实证主义


    The DAO 是一项首创的链上治理实验，链上治理是指将规则和决策程序编码到基于区块链的系统基础设施中。此类规则的一个例子是比特币数量上限，它确保比特币总量永远不会超过
    2100 万枚。同样，链上决策程序可以用比特币的 PoW 共识机制来说明，该机制用于验证区块链上的交易。The DAO 旨在作为一个分布式众筹平台运行，它将取代赋予
    Kickstarter 等传统平台运营者的任意强制权力，转而采用我们在第 3 章中所描述的*代码即法则*。The DAO 的全球分布式代币持有者中的任何人都可以提出新项目供人们投资，而通过这种去中心化治理系统做出的决策将通过智能合约“自主”执行。


    为了设想其运作方式，以通过模拟 Airbnb 平台的 DAO 租赁公寓为例。在 Airbnb 上租房时，你需要使用 PayPal 等中心化支付系统向房东转账。然后，你必须收到实体钥匙或公寓密码，这偶尔会出现问题。例如，如果到达时钥匙未交接，你将不得不寻找替代住宿，并可能启动仲裁程序以追回费用和损失。如果通过
    DAO 运作，你将改为签订一个与物业上安装的物理“智能锁”相连的智能合约。一旦你通过 The DAO 达成租赁协议，一切将自动发生：一定金额将从你的账户存入智能合约，让你在到达时解锁智能锁。住宿结束时，押金将自动退还给你（扣除租金），你将无法再解锁开门。


    事实上，这种解决方案是由提出并构建 The DAO 的公司 Slock.it 的开发团队提出的。除了自动化物业访问权限，The DAO 还能做更多事情。通过结合链上和链下治理工具，代币持有者甚至可以直接做出通常由董事会决定的事项，例如如何分配平台盈利的股息。简而言之，它有可能通过自执行的代码规则涵盖像
    Airbnb 这样的平台的所有治理功能。


    DAO 实施哪种类型的“法律秩序”，以及什么会确立此类秩序中“法律”的效力？可以在凯尔森确立的法律实证主义与 DAO 设计的底层原则之间建立显著的相似性。根据凯尔森的观点，法律的效力不能从其内容中推导出来。“约翰打开邻里商店的取款机，取出
    200 美元并逃跑”这一描述本身并不构成*盗窃*行为。为此，需要一条禁止偷窃的规范。方便的是，软件代码既是描述性的又是执行性的，能够将陈述与规范性、道义性操作（如允许、禁止、限制）结合起来。类似于凯尔森的效力检验，DAO
    上交易的效力并非源于交易内容本身。相反，它源于编码在（例如）智能合约中的规范，该规范决定一笔交易能否进行。


    但如果规则的效力源于规范，那么该规范本身的效力又来自何处？凯尔森认为，“规范效力的理由只能是另一个规范的效力。”


    如果像 The DAO 这样的基于区块链的系统实施了一种类似于凯尔森所描述的实证法律秩序的法律制度，它们也会容受施米特的批判吗？施米特主张，从其本质上讲，例外状态无法在法律上被预先确定。因此，决策必须首先确认是否确实存在例外，其次确定如何处理它。根据施米特的观点，问题在于法律实证主义试图在一个非人格化的系统中消解这些政治决策，例如议会制系统，它将所有决策置于必须遵循的程序之下（如投票中的多数决要求）。这些程序可能导致决策陷入无休止的讨论，影响治理的有效性。这在正常情况下无可厚非，正常情况下允许特定利益群体进行漫长谈判（例如美国的儿童安全倡导者与持枪权利倡导者）。然而，当紧急情况出现时——例如叛乱——我们没有奢侈地将决策引导通过这样的系统，因为紧急决策变得*必要*。施米特主张，这种决策是由从非人格化系统中产生的个人能动性做出的，是一种潜在的主权力量，无法被抛诸脑后。


    施米特的主张有实证基础。大多数国家都有宪法规定，允许行政部门通过宣布紧急状态来中止正常法律秩序。例如，考虑 2015 年恐怖袭击后法国颁布的紧急权力，据一些人说，这导致了“永久紧急状态”，中止了某些群体的基本权利。正如迪岑豪斯所解释的，德国的右翼保守势力合流，将该国从民主国家变成了威权国家。


    ## The DAO 攻击


    The DAO 攻击是以太坊社区的一个关键事件，因为它暴露出一种直指底层区块链技术核心的张力，即其假定的不可篡改性能否或是否应该凌驾于人类能动性之上。事实证明，不可篡改性并非区块链的固有特征，而是支撑其管理和运营的一种规范。这一规范类似于迪岑豪斯所称的凯尔森法律实证主义的底层概念，即“任何个人都不应服从于任何其他个人或群体的意志。”


    The DAO 攻击期间究竟发生了什么？让我们按时间顺序梳理事件。2016 年 4 月 30 日，The DAO 在以太坊区块链上部署，随后进行了为期四周的众筹期，通过
    ICO 募集资金。任何人都可以向 The DAO 发送以太币，并获得 The DAO 的原生代币作为交换。在此期间，社区还讨论了 DAO 资金可能的用途提案。在
    The DAO 上线前很久，就有人对代码库和治理中的潜在漏洞提出了担忧。5 月 26 日，Slock.it 团队本身发布了一项提案，旨在更新 The DAO
    的安全性并任命一位安全专家。尽管存在这些担忧，但在 5 月 28 日众筹期结束时，The DAO 仍然上线了。它积累了惊人的资本投入，价值约 1.5 亿美元的加密货币。6
    月 5 日，The DAO 代码中发现了一个新的技术漏洞，该漏洞可能让攻击者反复调用一个脆弱的提款函数，在智能合约余额更新前窃取资产。鉴于这一发现，Slock.it
    团队开始着手更新 The DAO，以解决此漏洞以及其他安全问题。6 月 12 日，公司发布声明称“资金不存在风险”。然而，6 月 17 日，一名匿名用户利用该漏洞耗尽了
    The DAO 的资金，从 The DAO 的智能合约中窃取了 360 万 ETH（当时约合 6000 万美元）转移到攻击者控制的另一个 DAO 中。

    '
