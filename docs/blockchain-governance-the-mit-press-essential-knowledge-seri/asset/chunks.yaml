- raw: 'Policymakers can try to influence the social norms that codetermine the governance
    processes of blockchain-based systems by means of incentives. How this works can
    be illustrated by the case of the Parity bug, as discussed in chapter 5. As a
    solution to the freezing of over USD 300 million worth of Ether at the time, the
    Ethereum community decided not to intervene. This decision was partly motivated
    by the potential exogenous pressures that community members might have faced had
    intervention occurred. If a standardized procedure for fund recovery had been
    enabled, some feared, members might have found themselves liable as fiduciaries.
    Even though it is not clear whether the regulatory environment had a positive
    impact on the governance process in this particular case, it illustrates the power
    of states to nudge blockchain communities to adapt new standards, engage in constitutionalizing,
    and develop governance innovations in particular directions.


    ## Building Cryptopia


    The Cambrian explosion of governance structures spurred by blockchain technology
    is in full swing. It is probable that many new forms of governance will emerge
    over time as the space progressively matures. But what will the future of blockchain
    governance look like? Just as Aristotle saw the revolution of governance models
    eventually consolidate into the unified empire of Alexander the Great, might we
    expect a consolidation of blockchain governance structures? Or will blockchain
    technology help us come up with new governance systems that we cannot even conceive
    of today?


    The answers that this book presented to these questions perhaps generate more,
    rather than less, complexity and uncertainty regarding the possible futures of
    blockchain governance. But this may also be its core lesson. Blockchain governance
    is not just a matter of building better rule-of-code systems, with an improved
    code base and incentive mechanisms. Rather, it also involves grappling with the
    complex interplay between on- and off-chain governance, trust and confidence building,
    normal times and emergencies, regulatory oversight and innovative power, dimensions
    of polycentricity, as well as formal and material constitutional constraints.
    This is a vast area of investigation, and we are only getting started. What is
    clear, however, is that building a Cryptopia for realists is urgent and requires
    collective action, involving crypto communities, scientists, and policymakers.


    # Glossary


    Alegality Alegality refers to a state where an action exists in a legal gray area,
    neither explicitly allowed nor expressly prohibited by existing laws and regulations
    but by its very existence seeks to change how the distinction between legal and
    illegal is drawn. In the context of blockchain systems, alegality may pertain
    to activities or innovations that operate on the edge of legality, often challenging
    traditional legal frameworks and prompting the need for regulatory clarification.


    Bitcoin Bitcoin is the first cryptocurrency and decentralized payment network
    created by an anonymous entity known as Satoshi Nakamoto in 2009. It operates
    on a blockchain, using a proof-of-work consensus mechanism, and serves as a store
    of value and medium of exchange without the need for intermediaries, central authorities,
    or physical representation.


    Blockchain A blockchain is a distributed and append-only digital ledger technology
    that records transactions across a network of computers, ensuring transparency,
    security, and verifiability. It relies on cryptographic techniques and consensus
    mechanisms to enable decentralized and tamper-resistant data storage and verification.


    Confidence Confidence refers to the expectations that people hold with regard
    to how things or systems operate. In the context of blockchain systems, confidence
    arises from the systems’ resiliency and reliability, the immutability and tamper-resistance
    attributes of the blockchain, and the predictability of its operations grounded
    in deterministic computation.


    Cryptocurrency Cryptocurrency is a digital form of currency that relies on a blockchain
    network and cryptographic techniques to secure transactions, control the creation
    of new units, and verify the transfer of these digital assets, often used as a
    means of exchange within decentralized ecosystems.


    Cypherpunks Cypherpunks are individuals who advocate for strong cryptography and
    the use of privacy-enhancing technologies to protect individual freedoms and privacy
    in the digital age. Their ideas and ideologies have significantly influenced the
    development of blockchain technology.


    Decentralized autonomous organization (DAO) A decentralized autonomous organization,
    or DAO, is a blockchain-based organization that operates through code and smart
    contracts. This structure enables members to make collective decisions and manage
    shared resources without centralized control, often with voting mechanisms that
    determine governance decisions and resource allocation.


    Ethereum Ethereum is a blockchain platform and cryptocurrency created by Vitalik
    Buterin in 2015. It enables the development of smart contracts and decentralized
    applications on its network, providing a versatile platform for various blockchain-based
    projects and governance mechanisms beyond simple value transfer.


    Hash In cryptography, a hash is a fixed-length string of characters generated
    from input data of arbitrary size using a mathematical one-way function called
    a hash function. This process produces a unique digital fingerprint, or hash value,
    for each unique set of input data. In the blockchain context, hashes are used
    to represent the content of a block or transaction, serving as a unique identifier
    for data integrity and security purposes.


    Legitimacy Legitimacy refers to the perception and acceptance of a governance
    system’s authority and adherence to established rules and principles by its participants
    and stakeholders. Legitimacy is essential for the long-term sustainability of
    a blockchain network characterized by low exit costs and significant network effects.


    Merkle tree A Merkle tree is a data structure that organizes and efficiently verifies
    the integrity of a large dataset by breaking it down into smaller, interconnected
    datasets, where each set is represented by a cryptographic hash. This hierarchical
    structure enables quick and secure verification of specific data elements without
    needing to process the entire dataset, enhancing data integrity and efficiency
    in blockchain transactions and validation.


    Mining Mining in the blockchain context refers to the process by which network
    participants, known as miners, use computational power to solve complex mathematical
    puzzles and validate transactions on the blockchain. Miners play a crucial role
    in securing the network and are generally rewarded with cryptocurrency for their
    efforts.


    Polycentricity Polycentricity refers to a governance system where multiple interdependent
    centers of decision-making and authority coexist, each trying to influence each
    other to promote their own interests while nonetheless abiding by a shared set
    of commonly agreed-upon norms.


    Proof of stake (PoS) Proof of stake, or PoS, is a consensus algorithm employed
    in blockchain networks where validators, chosen based on the amount of cryptocurrency
    they hold and are willing to “stake” as collateral, take turns validating transactions
    and creating new blocks, thereby reducing the energy consumption associated with
    mining in proof-of-work systems while maintaining a similar level of security.


    Proof of work (PoW) Proof of work, or PoW, is a consensus algorithm used in blockchain
    networks where participants, known as miners, compete to solve complex mathematical
    puzzles using computational power to validate and add new blocks to the blockchain,
    thereby ensuring network security and integrity.'
