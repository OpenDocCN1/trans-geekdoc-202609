- raw: 'Moving away from this extreme form of interpersonal trust, we encounter trust
    between citizens of a political community, conceptualized by Pettit


    We move on to what Luhmann calls “confidence.” Confidence rests on shared expectations,
    which are not simply the result of a leap of faith—as in the case of trust—but
    are supported by a particular understanding of the world that is regarded as sufficiently
    predictable as to remove any sense of uncertainty and therefore risk. Confidence
    can emerge both from general or embodied knowledge (e.g., our confidence in cryptography
    is based on our understanding of mathematics) or repeated experiences (e.g., our
    confidence that the sun will rise every morning is grounded on the fact that we
    have experienced it all our life). Confidence can also be intentionally constructed
    by creating sociotechnical systems specifically designed to constrain or regulate
    parts of the environment in order to make them controllable—like through the use
    of law enforcement or the physical walls of a prison. Often, these two mechanisms
    overlap. Consider, for instance, the monetary system. Confidence is key to this
    system as people will only accept money if they expect it to constitute an effective
    means of payment and that its value will be relatively stable to acquire goods
    and services over time. At the same time, the monetary system is a sociotechnical
    system with central banks controlling the issuance of currency and setting bank
    interest rates, among other things, and regulators ensuring that loans are sufficiently
    collateralized and clients’ funds are properly held in custody. As such, the monetary
    system, along with its key players and regulatory authorities, allows strangers
    to interact with one another—even without any prior trust relationships—because
    it builds up confidence based on a set of shared expectations of a (seemingly)
    predictable system.


    Yet, as the 2008 global financial crisis has shown, confidence in the monetary
    system is still based on underlying trust relations. Some of these relations are
    akin to a problematic form of encapsulated interests (e.g., reputation of bankers
    depending on extreme risk-taking behavior); others are linked to specific trust
    relations between bankers and politicians. This seemingly predictable system can
    suddenly breach our expectations or even *betray* us when we realize that we have
    made ourselves vulnerable to the whims of corruptible or unreliable financial
    institutions or other trusted authorities.


    This underlying layer of trust has become fairly visible, for instance, when payments
    toward Wikileaks were blocked by the major American payment providers in 2011,


    ## The Confidence Machine


    What the Wikileaks episode suggests is that Bitcoin is a technology that produces
    confidence without the need for underlying trust relations. While it has often
    been stated that blockchain is a “trustless” technology that purports to eliminate
    the “need” for trust,


    While the technical features of blockchain technology have been explored in chapter
    2, we need to consider how these produce the confidence implied in the notion
    of a confidence machine. The question thus becomes how blockchain technology maintains
    a high degree of predictability in its operations, without trusted intermediaries.
    Answering this question revolves around considering three aspects of the workings
    of blockchain technologies: (1) cryptographic primitives, (2) deterministic computing,
    and (3) distributed consensus (figure 5).


    ![Figure 5 The confidence machine. Source: Primavera De Filippi, Morshed Mannan,
    and Wessel Reijers, “Blockchain as a Confidence Machine: The Problem of Trust
    and Challenges of Governance,” Technology in Society 62 (August 2020): 101284,
    https://doi.org/10.1016/j.techsoc.2020.101284.](images/14994__000_fig_005.jpg)


    Figure 5 The confidence machine. *Source:* Primavera De Filippi, Morshed Mannan,
    and Wessel Reijers, “Blockchain as a Confidence Machine: The Problem of Trust
    and Challenges of Governance,” *Technology in Society* 62 (August 2020): 101284,
    [https://doi.org/10.1016/j.techsoc.2020.101284](https://doi.org/10.1016/j.techsoc.2020.101284).


    First, blockchain technology relies on cryptographic primitives (well-established,
    low-level cryptographic algorithms commonly used in cryptographic protocols) to
    create predictability. This predictability comes from the asymmetric nature of
    public-key cryptography as well as the verifiability and nonreversibility of hash
    functions (see chapter 2). Public-private key cryptography is an essential component
    of blockchain technology that helps to establish confidence in the system. In
    a blockchain-based system, every user has a unique public-private key pair, which
    is used to securely conduct transactions on the network. When a user initiates
    a transaction, they use their private key to digitally sign the transaction, which
    serves as proof of origin and authenticity. The transaction is then broadcasted
    to the network, and other users can verify the transaction’s validity using the
    sender’s public key. The public key acts as an address that is visible to everyone
    on the network, while the private key is kept secret and known only to the owner.
    This asymmetrical relationship ensures that transactions can be securely conducted
    without revealing the owner’s identity. By using public-private key cryptography,
    blockchain-based systems ensure that only the rightful owner of a digital asset
    can initiate transactions and prove their ownership. This feature adds a layer
    of security and confidence to the system as users can be assured that their assets
    are protected from unauthorized access or fraudulent activity.


    Hash functions are another fundamental component of the confidence machine as
    they generate a high level of predictability concerning the immutability of data
    recorded on a blockchain. Hash functions are mathematical algorithms that take
    an input of any length and produce a fixed-size output known as a hash, or a “digital
    fingerprint.” In a blockchain-based system, each block contains a hash of all
    the transactions included in the block as well as a hash of the previous block
    in the chain. This creates an unbreakable link between blocks and ensures the
    immutability of transactions recorded into a blockchain, as any change in a single
    block would result in a different hash, invalidating the entire chain’s integrity.


    Second, deterministic computation suggests there is a one-to-one relation between
    the inputs and outputs of any blockchain transaction. This stems from the fact
    that computer code deployed on a blockchain executes in a formal, nonambiguous,
    and deterministic manner. As such, it brings a degree of predictability that is
    absent from natural language: a message transmitted to blockchain code leaves
    no room for interpretation and will always result in the exact same outcome. This
    is a critical feature of blockchain technology as it ensures that all nodes on
    the network can independently verify the validity of transactions and maintain
    the blockchain’s integrity.


    Third, blockchain technology relies on distributed consensus to extend the determinacy
    from a single computer to that of a network of nodes, ensuring that every node
    will produce the same order of transactions. This generates a high level of predictability
    that transactions are unambiguous not only in terms of their content but also
    in terms of their chronological order. Distributed consensus algorithms constitute
    the basis for a decentralized peer-to-peer validation of transactions, leveraging
    economic incentives to ensure that all peers in the network cooperate toward maintaining
    and operating the network, with no incentives to free ride. To be sure, this only
    works under the assumption that all miners are rational, utility-maximizing economic
    agents who only act to maximize their profits and are therefore highly predictable
    in their behaviors.'
