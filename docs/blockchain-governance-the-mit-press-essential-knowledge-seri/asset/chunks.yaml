  trans: '


    # The DAO Attack and Ethereum''s Response


    一旦以太坊生态系统中的参与者意识到这次攻击——这是在 Reddit 上发布的一条令人震惊的消息之后——他们开始在一个封闭的 Slack 频道中聚集，讨论应对策略。当务之急是让主要的加密货币交易所同意暂停交易
    The DAO 的原生代币。由于 The DAO 智能合约的一项安全功能，新 DAO 中的资金被“冻结”了大约二十七天。


    在攻击发生后的几周里，以太坊社区提出了不同的解决方案。其中一些是“软分叉”，这不会违反以太坊区块链的协议，而是指示客户端忽略任何源自攻击者 DAO 的交易。然而，这些解决方案被发现存在严重的安全风险，因为它们会使恶意用户能够向以太坊区块链发送垃圾交易。另一种选择是“硬分叉”，这将有效地违反以太坊协议的规则，使分叉链与原链不再向后兼容。硬分叉包含强制将资金从攻击者的
    DAO 转移到一个新创建的智能合约中，该合约的功能仅是允许原始代币持有者提取他们的资金。许多人的认为，后一种方案是补救这起“盗窃”最安全的方式，并得到了 Vitalik
    Buterin 和以太坊基金会其他核心成员的积极支持。


    7 月 20 日，以太坊网络发生了硬分叉。大多数挖矿节点采用了新客户端，表明支持这个新创建的、已补救盗窃问题的以太坊版本。然而，一些节点继续为原始的以太坊区块链挖掘区块，该链现已更名为“以太坊经典”。关于分叉的合法性展开了激烈的讨论。有人认为，这是对网络协议毫无理由的违反，因为攻击完全按照代码规定执行，对以太坊区块链本身没有任何后果。然而，其他人则认为，The
    DAO 攻击是一次现实检验，敦促社区在无数潜在的智能合约漏洞面前重新思考其治理。


    ## Philosophical Implications: State of Exception


    围绕 The DAO 攻击的辩论，以一种初步的方式，与近一个世纪前法律哲学家之间发生的类似辩论产生了共鸣。首先， هناك“例外状态”的问题。The DAO
    攻击是否具有足够的破坏性，足以证明以太坊宣布进入例外状态是正当的？这个问题的答案不应仅仅是描述性的，而应当是规范性的，包括考虑以太坊网络是否按照它*应有*的方式运行。正如施米特所预见的，这个问题无法由系统本身来回答，因为它要求主权焦点行使能动性。有影响力的代理人聚集在一起，就应对这种例外情况的策略达成一致，然后再制定解决该例外情况的策略。主张硬分叉的大多数人主动提出了一种处理例外情况的方式.
    鉴于其缺乏向后兼容性，硬分叉类似于一种确立新宪法的宪法变革。然而，与关于例外状态的经典辩论截然不同的是，分叉导致了两个替代版本的以太坊区块链的建立。这类似于魏玛宪法的支持者尽管面对希特勒单独建立的恐怖统治，仍然维持了他们自己的共和国。然而，在物理世界中，这根本不是一个选项。


    ## Taming the Specter of Private Interests


    在“正常”的硬分叉情况下，会遵循一个标准化程序，该程序依赖于一个具有制衡机制的正式化链下提案流程。即使不完美，这一工作流程也符合法律实证主义的理想，即没有任何个人或群体可以武断地将其决定强加于网络。然而，The
    DAO 攻击后的硬分叉是未经计划的，并且由于例外情况的紧迫性，无法遵循正常程序。虽然节点仍然无法被强迫加入某条链而放弃另一条链，但它们面临着有限的选择范围，且其选择上承担着巨大的经济利益。这从而揭示了一个潜在的网络主权者的存在，即分布在少数有影响力的个人和群体中的能动性焦点，他们有效地限制了可用的选择。归根结底，The
    DAO 攻击表明，区块链系统也容易受到施米特所描述的“私人利益的聚合”影响。


    谈到自由民主制，施米特认为，“自我运行的机器”（即实证主义法律秩序）更关注法律的效力，包括那些确立共同体共享价值观的法律，而不是法律的实质内容。例如，这样的秩序规定了提案发布的正式要求、批准提案的投票机制以及提案通过的门槛。在一个自由、多元的社会中，任何价值都与其他价值一样值得被考量；共同善的共同概念是缺失的。只要通过适当的程序渠道表达观点，并制定出有效的法律来实施这些观点，人们可以持有废除公共教育、将所有公共资金用于应对气候变化，甚至废除民主的观点。因此，施米特认为，尽管该系统确实为形式合法性奠定了基础，但它未能为实质合法性提供依据——作为其自身规则的额外正当性理由。法律秩序可以区分有效与无效的规则和决策程序，但无法区分源于对共同善实质理解的“正确”与“错误”。


    正是由于这个原因，自由民主制中的法律秩序要想产生共同善，唯一的途径就是通过私人当事人与国家之间的谈判和讨论，随后通过法律程序予以实施。私人利益必须聚合以在谈判中获得权力，形成从基金会到游说团体等各种配置。区块链网络面临着同样的根本挑战。每当出现超越单纯技术细节、涉及某种共同善概念的问题时，私人利益可能会聚合在一起，形成一个主权焦点，在极端情况下，甚至可能破坏区块链本身的完整性。因此，尽管声称具有不可篡改性，区块链技术从根本上无法忽视治理（特别是链下治理）在其运作中所扮演的角色。为了避免因不可见权力的聚合而导致的潜在滥用，区块链社区最好认识到链下治理作为一种互补且强大力量的作用，并理想地建立具体机制来约束治理。


    一种可能的变革将是新的程序机制。这意味着建立一个处理例外情况的正式化治理流程，就像传统政治秩序和宪法中存在的那样。建立这种程序性解决方案的含义，可以通过被称为“Parity
    漏洞”的事件来说明。


    '
