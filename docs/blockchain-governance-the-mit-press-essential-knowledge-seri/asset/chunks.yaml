  trans: '

    确实，虽然记录在区块链上的数据将永远对所有人保持可访问（至少只要区块链网络保持运行），但也可以通过使用哈希值在区块链上记录信息。这种数字指纹构成了一项不可篡改的证明，证明该文件在哈希值被记录在区块链上的那个时间点已经存在，且发起交易的人极有可能持有该文件。这种方法的好处是，访问区块链的任何人永远无法检索与哈希值关联的信息内容。然而，任何持有原始文件的人都将能够事后验证该文件是真实的，且其内容未被篡改。


    最近，随着不可转让代币的普及，区块链领域出现了新的认证或证明模式。这些代币由公认的实体或同伴发放给特定账户，以证明账户持有者满足特定要求——无论该系统是被政府机关用来证明某人是美国公民，还是被社区成员用来声明某人是特定社区的认可成员。因为这些代币不可转让，它们可用于确保账户持有者确实具备与这些代币相关的相关属性或特征。这为基于区块链的系统中的治理实验打开了新的机遇之窗，这些系统不再受寡头政治倾向（人们可以购买代币以获得更多投票权）的束缚，而是趋向于精英政治倾向（人们必须根据其属性或技能，或根据其对特定计划的贡献来赚取代币）。


    确保基于区块链的证明和认证的可靠性和可信度并非没有挑战。虽然区块链消除了伪造证书或篡改先前发布凭证的可能性，但它本身并不能保证存储信息的准确性——这也被称为*垃圾进，垃圾出*的问题。就涉及链下信息而言，为了使这些基于区块链的凭证被视为合法，它们必须展示严格的验证和确认过程，理想情况下由受信任的参与者执行。充当链上和链下世界中介的受信任参与者通常被称为*预言机*，它们将现实世界的信息记录到区块链中，以便智能合约和其他基于区块链的应用程序能够根据这些信息采取行动。区块链系统需要的现实世界信息越多，预言机在确保该系统正常运行方面的影响力就越大。因此，确保这些预言机提供准确可靠的数据变得越来越重要。


    ## 决策制定


    支持智能合约部署的最先进区块链还使创建更复杂的技术安排成为可能，利用软件代码确保在满足特定条件时自动执行特定交易。理解智能合约的传统方式是通过与自动售货机的类比。


    区块链的可编程性及其相关智能合约促成了所谓 DApp 的创建，DApp 是运行在区块链上的软件片段，任何人都可以与之交易。DApp 的使用也被更明确地提议为一种创建新组织结构的方式，使人们能够通过部署在区块链上的一套自我执行规则来协调自身。这些通常被称为
    DAO。


    DAO 有多种类型，可以履行不同职能：从管理不一定相互认识或信任的人们之间的共同金库，到运营众筹或投资平台，贡献者获得对其贡献项目的治理权，再到管理一个拥有成文化决策机制和更去中心化治理结构的人员组织。


    现在已有多个成功的 DAO：Moloch DAO，用于区块链基础设施的去中心化投资；Decentraland DAO，在元宇宙中运营去中心化规划委员会；Mirror
    DAO，运行去中心化博客平台的策展；Lex DAO，汇聚一群懂法律的工程师为其他 DAO 提供服务；以及 Friends with Benefits DAO，为加密货币爱好者运营会员制社交俱乐部。甚至有一些项目将
    DAO 视为创建新的自主主权结构的机会，这些结构可以有效绕过或取代民族国家，从而创建新的“基于区块链的虚拟国家”。


    ---


    在概述了区块链技术从数字现金平台演变为通用技术的发展历程后，第 2 章展示了其独特特性——如去中心化、不可篡改性、假名性和可验证性——如何催生了拥有自身治理模式的新
    DApp，并最终迎来了 DAO 的出现：通过集体治理以分布式方式运作的去中心化组织。这些新兴技术在治理领域既带来了挑战，也带来了机遇。一方面，它们承诺在从金融到供应链管理的各个领域提供增强的透明度、信任和效率。另一方面，它们引入了与法律框架、安全漏洞和决策过程相关的新复杂性，这些都需要仔细审视和创新解决方案。在接下来的章节中，我们将深入探讨基于区块链的治理的多面图景，探索这一快速发展领域的复杂性、成功经验和持续辩论。


    # 代码即法则


    > 代表未来，我请求过去的你们别来打扰我们。你们不受欢迎。在我们聚集的地方，你们没有主权。

    >

    > ——约翰·佩里·巴洛，《网络空间独立宣言》


    ## 绕道而行


    在银河系遥远角落的一颗遥远星球上，一台孤独的机器人正在一个人类无法生存的环境中辛苦劳作。它的任务是采集一种稀有矿物——硒，这对维持星球上的运营至关重要。Speedy
    和同类的许多其他机器人一样，被编程为遵守机器人三定律。这些定律规定：机器人（1）不得伤害人类，（2）必须服从人类的命令，除非该命令与第一定律冲突，（3）只要不与第一或第二定律冲突，必须保护自己的存在。


    在阿西莫夫的《我，机器人》故事中，这三条定律旨在作为防止机器人伤害人类的安全措施。然而，正如故事所展示的，尽管它们表面上看似一致，但在某些罕见情况下，这三条定律可能导致意想不到且看似不合逻辑的行为。确实，当
    Speedy 意识到硒源会对其机电结构造成伤害（从而威胁其自身存在），而保护其机电结构又是完成任务（即服从人类命令）的必要条件时，Speedy 陷入了循环逻辑死循环，开始表现出反常行为，最终危及任务和相关人类。

    '
