- raw: 'Together, these aspects ensure a high level of predictability and therefore
    confidence in the system. As Nick Szabo argued, blockchains seek to substitute
    “rust in the secret and arbitrarily mutable activities of a private computation”
    with “verifiable confidence in the behavior of a generally immutable public computation.”


    ## Bringing Trust Back In


    Just as any other sociotechnical system, vending machines are liable to the tricks
    of confidence men. There is outright vandalism, which vending machines can be
    protected against, but there are also much more sophisticated ways to cheat on
    them. The point that vending machines are still vulnerable to confidence tricks
    is brought home by the example of Tommy Glen Carmichael,


    Carmichael’s story brings home the message that even though slot machines, like
    smart contracts, appear to offer fully predictable executions of programmed actions,
    they can be compromised. And while only a physical tool is needed to compromise
    the slot machine, there are multiple ways to compromise a blockchain network,
    which reveal the interdependency between trust and confidence. This can be illustrated
    by the case of the Steem blockchain,


    Enter Justin Sun, a flamboyant and savvy Chinese blockchain entrepreneur, founder,
    and CEO of the Tron blockchain network. As Sun decided to purchase Steem, he became
    entitled to the ninjamined tokens, which gave him a significant influence in the
    governance of the Steem blockchain. As a response, the Steem community voted to
    implement a soft fork to prevent Sun from accessing and voting with these premined
    tokens, as a protection mechanism to avoid a hostile takeover. Yet, Sun had a
    trick up his sleeve. Using his personal influence at some of the major crypto
    exchanges, he leveraged the Steem tokens held in custody by those crypto exchanges
    to elect his own trusted witnesses, thereby effectively seizing control over the
    Steem blockchain.


    This is a fascinating episode of a blockchain community trying to prevent one
    influential individual from taking over a blockchain network, with the “empire
    striking back.”


    Second, token holders can exert significant influence on a blockchain network,
    as illustrated by Sun’s large amount of tokens holding, which gave him the means
    to influence the blockchain governance and elect new witnesses. Finally, external
    parties like policymakers and regulators can impact the trust relations in the
    nexus of actors orbiting around a blockchain-based network. For instance, regulators
    could crack down on the behavior of individual actors like Sun,


    It could well be argued that the Steem blockchain was vulnerable because it was
    an imperfect version of the confidence machine. Its weakness was the design of
    its consensus mechanism. Leveraging a delegated system instead of Bitcoin’s PoW
    system, it relied on trust relations from the outset. Yet, as we will further
    explore in chapter 5, even the Ethereum blockchain (which at the time used a PoW
    consensus mechanism) has encountered a significant breach of confidence, in the
    aftermath of an incident known as The DAO attack. Also, in more robust ecosystems
    like Ethereum, trust relations between the different typologies of actors mentioned
    above impact the functioning of the confidence machine.


    Accordingly, while it is clearly the case that blockchain technologies reduce
    the need for trust and increase confidence in the system, it is wrong to describe
    them as trustless systems since trust can never be eliminated. Rather, trust is
    distributed among a network of actors, making it difficult for any single actor
    to unilaterally breach the rules of the system. Exceptional events like the Steem
    takeover have brought the underlying trust relations to the surface. Instead of
    denying the existence of these trust relations, blockchain proponents would therefore
    do better to account for the role that trust plays in these systems—which can
    be seen as both a strength and a liability. Trust is a liability when trust relations
    undermine the integrity of a blockchain network, for instance, in the way that
    Sun leveraged his connections at major exchanges. Yet, it can also help saving
    and strengthening the integrity of a network, for instance, by providing the basis
    for a community to react against an attack (as will be discussed in chapter 5).


    The moral of the story is that trust in the governance of a blockchain-based system
    is necessary for it to qualify as a proper confidence machine. To manage this
    trust, blockchain communities must leverage both on- and off-chain governance
    strategies and solutions. On-chain solutions to improve trust in governance may
    involve implementing new types of consensus mechanisms or more robust voting systems,
    which off-chain solutions may involve procedural and substantive modes of community
    governance. For instance, procedural safeguards could be put in place to determine
    the course of action of key actors like core developers and major token holders
    deciding on a recommended protocol update.


    * * *


    \* \* \*


    By way of a discussion of trust and confidence in sociology and political theory,
    chapter 4 questioned the alleged trustless nature of blockchain technology. It
    showed that blockchain technology should rather be regarded as a confidence machine
    that displaces trust without, however, eliminating it. The chapter elaborated
    how the cultural values and political beliefs of actors involved in the governance
    of a blockchain can impact newfound trust relations. Trust, it turns out, still
    plays an important role in—and emphasizes the importance of—blockchain governance.
    In the next chapters, we will explore these and other forms of blockchain governance,
    which are aimed at managing the underlying trust relations for the sake of making
    the confidence machine operate more effectively.


    # 5


    # States of Exception


    The exception is more interesting than the rule. The rule proves nothing; the
    exception proves everything.


    —Carl Schmitt, *Political Theology*


    ## Waiting for Barbarians


    The magistrate rules over a sleepy frontier settlement at the edge of a vast empire.
    For as long as he can remember, the settlement had been peaceful and prosperous.
    One day, however, a man by the name of Colonel Joll arrives, who represents the
    empire’s powerful intelligence service. The magistrate recounts their first meeting:
    “We do not discuss the reason for his being here. He is here under the emergency
    powers, that is enough.”


    The poem’s twist reveals something important: the empire does not merely respond
    to an emergency to protect itself from outside danger; rather, the palpable risk
    of an emergency constitutes its power to continue to exist. As the magistrate
    muses, “one thought alone preoccupies the submerged mind of empire: how not to
    end, how not to die, how to prolong its era.”


    The state of emergency necessitates *suspending* the law to deal with a situation
    that the normal legal order is supposedly incapable of addressing.


    But what is the exception? There is no straightforward answer to this question.
    Perhaps, with Taleb,


    Hans Kelsen, an influential Austrian legal philosopher, considered the law as
    a system of legal norms that cover things that might happen in the world. It operates
    in an “if-then” fashion. If you steal, then you will be sanctioned. This system
    knows a hierarchy: lower-level laws about particular events are subsumed under
    higher-level, more general laws. At the highest level, Kelsen hypothesized the
    existence of a “basic norm,”


    In the summer of 2016, a less scholarly version of this debate raged on the Internet
    about the first DAO built on the Ethereum blockchain, known as The DAO. The DAO
    was intended to be an unstoppable organization, a machine that runs itself. It
    was not ruled by corporate statutes and codes but rather was governed by self-executing
    smart contracts and blockchain code.


    ## The Code Runs Itself'
