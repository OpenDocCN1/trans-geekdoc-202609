- raw: 'Once actors in the Ethereum ecosystem became aware of this attack—following
    an alarming message posted on Reddit—they started to coalesce behind a closed
    Slack channel to discuss counterstrategies. The immediate step was to get the
    main cryptocurrency exchanges to agree to halt trading of The DAO native tokens.
    Due to a safety feature of The DAO’s smart contract, the funds in the new DAO
    were “frozen” for approximately twenty-seven days,


    In the weeks following the attack, different solutions were brought forward by
    the Ethereum community. Some of these were “soft forks” that would not violate
    the protocol of the Ethereum blockchain but would rather instruct clients to ignore
    any transaction originating from the attacker’s DAO. Yet, these solutions were
    found to have serious security risks, because they would enable malicious users
    to spam the Ethereum blockchain. The other option was a “hard fork,” which would
    effectively violate the rules of the Ethereum protocol, making the forked chain
    backward-incompatible with the original chain. The hard fork consisted of forcing
    a transfer of funds from the attacker’s DAO to a newly created smart contract,
    whose function was only to enable the original token holders to withdraw their
    funds. This latter option was considered by many as the safest way to remediate
    the “theft” and was actively supported by Vitalik Buterin and other core members
    of the Ethereum Foundation.


    On July 20, the hard fork of the Ethereum network occurred. Most mining nodes
    adopted the new client, indicating support for the newly created version of Ethereum
    that had remediated the theft. Some, however, kept mining blocks for the original
    Ethereum blockchain, which had now been renamed as “Ethereum classic.” Heated
    discussion ensued about the fork’s legitimacy. Some argued that it was an unjustified
    violation of the network protocol because the attack had executed exactly as prescribed
    in the code, with no consequences for the Ethereum blockchain. Others, however,
    argued that The DAO attack had been a reality check, urging the community to rethink
    its governance in light of myriad potential smart contract vulnerabilities.


    The debate surrounding The DAO attack, in a rudimentary way, resonates with similar
    debates occurring almost a century earlier between legal philosophers. First,
    there is the question of the state of exception. Was The DAO attack sufficiently
    disruptive for Ethereum to justify the declaration of a state of exception? The
    answer to this question should not be merely descriptive but also normative, including
    consideration of whether the Ethereum network had operated as it *ought* to. As
    Schmitt foresaw, this question cannot be answered by the system itself as it requires
    the exercise of agency by a focal point of sovereignty. Influential agents came
    together to agree on a strategy to address such an exception, before strategizing
    on tackling the exception. The majority advocating for a hard fork proactively
    proposed a way to handle the exception. Given its lack of backward compatibility,
    the hard fork is comparable to a constitutional change that establishes a new
    constitution. Yet, a radical departure from the classical debate on the state
    of exception is the fact that the fork led to the establishment of two alternative
    versions of the Ethereum blockchain. This would be similar to supporters of the
    original Weimar constitution having maintained their own republic despite Hitler’s
    separate regime of terror. In the physical world, however, this is simply not
    an option.


    ## Taming the Specter of Private Interests


    In the case of a “normal” hard fork, a standardized procedure is followed that
    relies on a formalized off-chain proposal process with checks and balances. Even
    if imperfect, this workflow is in line with legal positivism’s ideal that no individual
    or group of individuals can arbitrarily force their decision upon the network.
    The hard fork in the aftermath of The DAO attack, however, was unplanned and could
    not—due to the urgency of the exception—follow normal procedures. While nodes
    still could not be coerced into joining one chain over another, they were confronted
    with a narrow range of choices to choose from and high economic stakes resting
    on their choice. It thus revealed the existence of a latent network sovereign,
    a focal point of agency distributed among a few influential individuals and groups,
    who effectively limited the choices available. Ultimately, what The DAO attack
    has shown is that blockchain systems are also vulnerable to what Schmitt described
    as the “coalescence of private interests.”


    Speaking of liberal democracies, Schmitt argued that the “machine that runs itself”
    (i.e., the positivist legal order) is concerned more with the validity of laws,
    including those that establish a community’s shared values, than with the substance
    of those laws. For instance, such an order lays down formal requirements for a
    proposal to be issued, the voting mechanism to approve proposals, and thresholds
    for a proposal to pass. In a liberal, pluralist society, any value is as worthy
    of being considered as any other; a shared conception of the common good is absent.
    One can hold the opinion to want to abolish public education, spend all public
    funds on combating climate change, or even abolish democracy as long as this opinion
    is directed through the proper procedural channels and the laws enacting these
    views are valid. Thus, Schmitt argued that even though the system does lay down
    a basis for formal legality, it fails to provide a ground for substantive legitimacy—as
    an additional justification of its own rules. The legal order can distinguish
    between valid and invalid rules and decision-making procedures but not between
    “right” and “wrong” that derive from a substantive understanding of the common
    good.


    For this reason, the only way that the legal order in a liberal democracy can
    produce a common good is through negotiations and discussions between private
    parties and the state, which is subsequently enacted through legal procedures.
    Private interests have to coalesce to gain power in this negotiation, in configurations
    ranging from foundations to lobby groups. A blockchain network faces the same
    fundamental challenge. Whenever questions arise that go beyond mere technicalities
    and involve some notion of the common good, private interests may come together,
    creating a focal point of sovereignty that in extreme situations might even undo
    the integrity of the blockchain itself. Hence, despite its claim to immutability,
    blockchain technology cannot fundamentally ignore the role that governance, particularly
    off-chain governance, plays in its operations. To avoid potential abuses resulting
    from the coalescence of invisible powers, blockchain communities would do well
    to recognize the role of off-chain governance as a complementary and powerful
    force and ideally put in place specific mechanisms for constraining governance.


    One possible change would be a new procedural mechanism. This means establishing
    a formalized governance process for handling exceptions, as exists in traditional
    political orders and constitutions. The implications of establishing such a procedural
    solution can be illustrated with reference to the event known as the “Parity bug.”'
