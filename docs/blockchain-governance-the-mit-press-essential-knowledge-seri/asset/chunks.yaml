    Primavera De Filippi is a research director at the National Center of Scientific
    Research in Paris, and faculty associate at the Berkman-Klein Center for Internet
    & Society at Harvard. Her research focuses on the legal challenges and opportunities
    of the metaverse, Web3, blockchain technology, and artificial intelligence. She
    is the coauthor of the book *Blockchain and the Law*, published in 2018 by Harvard
    University Press, and she was recently awarded a €2 million grant from the European
    Research Council to investigate how blockchain technology can help improve institutional
    governance through greater confidence and trust.


    Wessel Reijers is a postdoctoral researcher at the Department of Philosophy, University
    of Vienna. Wessel’s current research explores the impacts of emerging technologies
    on citizenship, most notably coming from social credit systems. Additionally,
    he explores the nature of distributed governance, investigating its potential
    as well as its pitfalls. He is the coauthor of *Narrative and Technology Ethics*
    and coeditor of the edited volume *Interpreting Technology*.


    Morshed Mannan is a postdoctoral research fellow at the Robert Schuman Centre
    for Advanced Studies, European University Institute. Morshed is currently conducting
    interdisciplinary research on blockchain governance and regulation, platform cooperatives,
    and data cooperatives. He is currently exploring the application of constitutional
    and corporate governance theories to blockchain governance. He is the coeditor
    of the edited volume *Log Out\_A Glossary of Technological Resistance and Decentralization*,
    a coauthor of the *COALA DAO Model Law*, and a coauthor of *Freedom of Establishment
    for Companies in Europe (EU/EEA)*.'
