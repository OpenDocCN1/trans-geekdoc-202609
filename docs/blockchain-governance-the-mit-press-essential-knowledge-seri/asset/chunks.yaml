- raw: 'At least this is what appeared to be the case. On August 8, 2022, and November
    8, 2022, the US Treasury’s Office of Foreign Assets Control (OFAC) sanctioned
    Tornado Cash for facilitating a North Korean hacker group to launder proceeds
    from their activities. As a result of these sanctions, it became unlawful for
    any US citizen, resident, or company to conduct transactions with the smart contract
    addresses linked to this blockchain-based service, which held more than USD 400
    million worth of Ether at the time. While OFAC claimed that this sanction targets
    the Tornado Cash “entity,” comprised of its founders, developers, and DAO, at
    the time it appeared to target a list of smart contract addresses. This means
    that no one, including the development team, has control over its operations,
    and therefore there is no way to modify or shut it down. Can code be sanctioned?
    Following the sanction order, centralized GitHub repositories were removed, the
    Tornado Cash DAO went dark, and a developer was arrested in the Netherlands. However,
    the Tornado Cash smart contract addresses continue to autonomously process transactions
    that are sent to it. As a result, these sanctions were heavily criticized, especially
    within the blockchain community, as they effectively apply to a technological
    artifact rather than to a legal entity.


    On the one hand, the example of Tornado Cash shows how legal boundaries can become
    fault lines. What some claim as being a sanction that targets a group of persons,
    others perceive as being a sanction of autonomous code. Thus, the sanction could
    potentially fall foul of existing liberal approaches to regulating software code
    as speech, which is protected by the constitutional right to freedom of speech
    in the United States.


    On the other hand, the sanction notices demonstrate the limits of alegality. It
    is true that the law cannot directly alter code on the blockchain. Yet, it is
    clear that sanctions can indirectly regulate the persons who interact with sanctioned
    addresses. In the case of Tornado Cash, these targets of regulation include the
    block producers who process network transactions as well as cryptocurrency exchanges.
    Soon after the sanction notices were announced, more than 50 percent of Ethereum
    block producers were, by default, censoring transactions that originated from
    Tornado Cash irrespective of whether they were legally subject to the sanction.


    In contrast to Srinivasan’s vision of blockchain-based systems acting as a government
    of governments beyond the reach of any legal order, technologies that are alegal
    by design like Tornado Cash show that such systems are entangled with state legal
    orders in complex ways. While legal orders can imprison developers, frighten validators
    and cryptocurrency exchanges, and stifle the development of privacy-enhancing
    technologies, the Tornado Cash smart contracts themselves continue to function.
    While some hope that sanctions and regulation will disable this autonomous Golem,
    it is unclear how these will be enforced, and it is uncertain that all stakeholders
    will otherwise voluntarily comply. If these systems continue to progressively
    become more decentralized and diverse, it will become harder to imprison the Golem.
    As a case in point, after months of most block producers censoring transactions
    emanating from Tornado Cash, by April 2023, the majority of them could use non-US
    software—clients and relayers—to process these transactions despite the OFAC sanctions
    remaining in place.


    * * *


    \* \* \*


    Drawing on legal theories concerning alegality, chapter 6 explored how the design
    of blockchain technologies enables them to resist the force of legal orders, transgress
    legal boundaries, and even redraw them. For techno-optimists, the alegal nature
    of blockchain technologies is worth preserving as it allows certain freedoms and
    rights to be extended, such as the right to financial privacy. Blockchain alegality
    seemingly offers a way to be free from legal commands that—as the anarchist Bakunin
    put it—“slap liberty in the face.”


    # 7


    # Legitimacy


    The most important scarce resource is legitimacy.


    —Vitalik Buterin, “The Most Important Scarce Resource Is Legitimacy”


    ## Polycrisis


    In 2022, as Russia launched its war on Ukraine and the global economy experienced
    the aftershocks of the COVID-19 pandemic, the world of crypto also experienced
    a “polycrisis.” After some major stablecoins collapsed, the NFT market crashed
    and the market cap of most public blockchains dropped dramatically. The biggest
    shock would come with the downfall of the crypto wunderkind Sam Bankman-Fried
    and his FTX empire. Enter the crypto winter.


    In these precarious times, the legitimacy of current governance practices come
    into question, testing confidence in existing institutional arrangements. The
    crypto winter has also raised questions about legitimate governance in the blockchain
    space. The debate on this topic was already initiated in 2021, at the height of
    the crypto boom, by Ethereum founder Vitalik Buterin. On his personal blog, Buterin
    argued that blockchain proponents had overlooked a very important factor in governance:
    the pattern of higher-order acceptance that he called legitimacy.


    What Buterin argued is that as technically sophisticated as a blockchain system
    might be, it still requires a certain degree of acceptance to function at all.
    Buterin claimed that legitimacy can derive from various sources depending on context—including
    brute force, continuity, fairness, process, performance, and participation. Yet,
    he noted that the legitimacy of blockchain-based systems was particularly dependent
    on higher-order acceptance by all network participants of the outcomes of the
    system, which he argued was mainly built around the expectation that others will
    also accept these outcomes as being legitimate.


    In seeking to define legitimacy, Buterin unwittingly entered into conversation
    with the many scholars who have theorized legitimacy, the German sociologist Max
    Weber being the most notable one.


    ## Legitimacy and Legality


    Weber considered legitimacy to be the *acceptance of authority* and the *requirement
    to obey commands*. He developed a conception of legitimacy that was concerned
    more with how a political system designs rules and delegates power in line with
    these rules than with what these rules substantively say. The legitimacy of a
    political system arose from people being accustomed to its practices and mores
    (i.e., tradition), their trust in the exceptional qualities of a leader (i.e.,
    charisma), or their confidence in a rational set of rules and norms being followed
    (i.e., legality). In this sense, legitimacy derived from legality depends on conformity
    with procedural rules and “technological choices, not ideological ones.”


    For other scholars, like Dyzenhaus, legitimacy and legality are intertwined concepts,
    but the existence of the latter does not necessarily entail the existence of the
    former.'
