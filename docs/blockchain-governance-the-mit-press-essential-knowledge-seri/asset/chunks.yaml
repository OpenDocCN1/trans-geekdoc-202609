    ![Figure 4 Lessig’s four modes of regulation.](images/14994__000_fig_004.jpg)


    Figure 4 Lessig’s four modes of regulation.


    In recent years, the development of the Internet has become increasingly dominated
    by a small number of large companies, which control large parts of the Internet
    infrastructure. These include the servers that host our data (e.g., Amazon), the
    social media platforms that connect us (e.g., Facebook/Meta), the web browsers
    that we use and the operating systems that run our devices (e.g., Google/Android)—in
    addition to all the applications that we use to access our email, browse the web,
    use social media, and shop online. As a result, these online operators dictate
    what can or cannot be *technically done* on their platforms, independently of
    what can or cannot be *legally done*.


    ## Cloud Empires and Rule by Code


    This has led to the emergence of cloud empires.


    This new form of sovereignty presents a challenge to traditional forms of governance,
    as the rules that govern digital platforms are not always transparent or accountable
    to their “citizens.”


    Conversely, some countries—mostly those under authoritarian regimes—operate according
    to the “rule by law.”


    When it comes to the regulation of Internet platforms, online operators generally
    have full discretionary power over the rules they chose to codify into their platforms,
    often with no accountability to any external authority nor any checks and balances.
    We introduce the concept of the “rule by code” to describe the governance of these
    online platforms: a regime where online operators have the power (and the tendency)
    to design and amend the code and technological infrastructure of their online
    platforms, primarily as a means to serve their own economic or political interests.
    The rule by code, characterized by the instrumentalization of computer code to
    serve the interests of powerful tech companies, thus presents itself as the software
    equivalent of the rule by law, characterized by the arbitrary wielding of laws
    to serve the interests of powerful sovereigns.


    But the rule by code is not only instrumental to the interests of online operators.
    It can also serve the interest of governmental actors, insofar as the online operators
    that control the code are themselves under the jurisdiction of a sovereign authority.
    Indeed, many of the online platforms that are ruled by code can be (and have been)
    co-opted by established powers to serve their own political interests—as clearly
    shown by the successful efforts of US security services to collect data from large
    online platform operators at the expense of user privacy.

    '
  trans: '

    # 代码统治


    1941 年写成的 Speedy 的故事凸显了过度依赖 AI 而不完全了解其工作原理或无法完全预测其行为的潜在危险。最重要的是，它说明了——无论机器人的实际意图如何——任何试图用人类法律监管
    AI 系统的尝试，都将因自然语言固有的歧义性和灵活性而导致混乱。


    当与基于区块链的基础设施相结合时，这些挑战变得更加棘手。即使它们尚未配备复杂的 AI，基于区块链的系统已经部署，在分布式账本上自主运行，独立于任何中心化权威。凭借其技术特性，这些系统可以被创建为没有人有权关闭它们（即不存在“熔断开关”）。只要有足够的节点维护其运行所依赖的底层区块链，它们就会继续运行。正如我们稍后在本章中将看到的，其中一些系统已被证明能够造成危害，最著名的包括金融损害、洗钱和恐怖主义融资。


    虽然将机器人定律编纂进无法理解人类语言的区块链系统可能很困难，但另一种选择是将人类法律编纂为严格且正式的代码语言。然而，计算机代码在提供准确性和精确性的同时，失去了灵活性和颗粒度。因此，它无法充分捕捉只能用自然语言表达的人类价值观、伦理原则和道德的细微差别。由此产生了悖论：一方面，不能指望基于区块链的系统遵守法治，因为法治是以一般原则而非编纂为代码的具体指令来制定的；另一方面，任何试图将阿西莫夫定律编纂为代码统治、并基于
    `if-then` 条件语句制定具体指令的尝试，必然会将它们简化为一种过于简单而不足以具有足够意义的形式。


    ## 巴洛对网络空间的愿景


    “工业世界的政府们，你们这些血肉与钢铁铸就的疲惫巨人，我来自网络空间，心智的新家园。”这就是 1996 年由美国作家兼政治活动家约翰·佩里·巴洛撰写的《网络空间独立宣言》的开篇。


    巴洛继续写道：“你们不受我们欢迎。在我们聚集的地方，你们没有主权。……你们无权统治我们，也不具备任何我们真正有理由恐惧的强制手段。”


    巴洛将网络空间视为一个个人主权既不源于也不从属于任何国家主权的地方。确实，他认为政府根本没有权利，也没有有效能力控制这个新世界，他说“网络空间不在你们的国界之内。”


    巴洛将互联网视为一种由一组协议和标准（例如 `TCP/IP`、`HTTP`、`SMTP`）治理的基础设施，这些协议和标准编码在网络的软件和硬件层中。这些协议最初由国防高级研究计划局开发，随后许多协议通过开放和去中心化的过程得以发展，这得益于开发者、研究人员和工程师的自愿努力——后来由互联网工程任务组或万维网联盟等非营利组织进行标准化。这种开源开发和标准化的过程允许快速且无需许可的创新，任何拥有计算机和互联网连接的人都可以开发和部署新应用程序，而无需寻求任何人的授权。


    然而，巴洛关于逃避政府控制的新数字空间的愿景，未能预见到代码在治理数字领域中可能发挥的作用。他没有预见到，这个新的独立空间很容易被一群渴望在数字领域建立自己（技术）规则的新（私人）行为体所攫取。


    ## 莱西格的四种调节模式


    流量集中在少数大型在线运营商——瓶颈点——手中，这威胁到了巴洛最初设想的互联网开放和去中心化的本质。确实，随着谷歌和 Meta 等公司规模和权力的增长，它们也开始对我们使用互联网的方式行使越来越大的控制权。它们通过多种方式做到了这一点，包括开发彼此不兼容的专有软件和平台，使用偏向自家产品和服务而非竞争对手的算法，以及使用服务条款赋予自己审查或删除其认为令人反感内容的权利。最重要的是，这些公司正在利用代码精确规定用户在其平台上可以或不可以做什么，其方式往往超出了


    巴洛关于逃避政府控制的新数字空间的愿景，未能预见到代码在治理数字领域中可能发挥的作用。


    在其著作《代码：网络空间的法律》中，劳伦斯·莱西格分析了互联网架构（包括软件和硬件层）塑造和治理我们在数字空间中行为的各种方式。


    ![Figure 4 Lessig’s four modes of regulation.](img/14994__000_fig_004.jpg)


    图 4 莱西格的四种调节模式。


    近年来，互联网的发展越来越由少数大公司主导，它们控制着互联网基础设施的大部分。这些包括托管我们数据的服务器（如亚马逊）、连接我们的社交媒体平台（如 Facebook/Meta）、我们使用的网络浏览器和运行我们设备的操作系统（如谷歌/安卓）——此外还有我们用来访问电子邮件、浏览网页、使用社交媒体和网上购物的所有应用程序。结果，这些在线运营商规定了其平台上在技术上可以或不可以做什么，而独立于法律上可以或不可以做什么。


    ## 云端帝国与代码统治


    这导致了云端帝国的出现。


    这种新形式的主权给传统治理形式带来了挑战，因为治理数字平台的规则并不总是对其“公民”透明或负责。


    相反，一些国家——主要是威权政权下的国家——依据“以法治国”运作。


    在互联网平台监管方面，在线运营商通常对其选择编纂进平台的规则拥有完全的自由裁量权，往往无需对任何外部权威负责，也不受任何制衡。我们引入“代码统治”概念来描述这些在线平台的治理：一种在线运营商拥有权力（和倾向）设计和修改其在线平台的代码和技术基础设施的制度，主要作为服务其自身经济或政治利益的手段。代码统治的特点是将计算机代码工具化以服务于强大科技公司的利益，因此它呈现为“以法治国”的软件等价物，后者的特点是任意挥舞法律以服务于强大统治者的利益。


    但代码统治不仅服务于在线运营商的利益。只要控制代码的在线运营商本身处于主权权威的管辖之下，它也可以服务于政府行为体的利益。确实，许多由代码统治的在线平台可以（并且已经被）既得权力攫取，以服务于其自身的政治利益——美国安全部门成功从大型在线平台运营商处收集数据、牺牲用户隐私的努力清楚地证明了这一点。

    '
