    23. 23. “预挖份额”是指由 Steem 的两位创始人在约定日期之前启动网络时挖掘的一定数量的加密货币。这让他们在挖掘原生代币方面抢占了先机，这些代币后来来代表网络总代币供应量的
    30%，当时孙宇晨以 800 万美元购买了该份额。


