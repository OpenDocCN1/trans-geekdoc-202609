  trans: '

    Parity 漏洞是 Parity 多签钱包（即需要多重签名授权交易的钱包）库智能合约代码中的一个漏洞。2017 年 11 月，一名匿名攻击者利用该漏洞控制了库智能合约，其唯一目的是通过调用
    `self-destruct()` 函数来销毁它。所有依赖该库的多签钱包因此失效，导致当时价值超过 1.5 亿美元的以太币被冻结。该事件对以太坊治理产生了重大影响，因为它凸显了代码审计和安全措施在区块链技术中的重要性。它还引发了以太坊社区内部关于处理此类事件的最佳方式的辩论，以及是否应该再次通过硬分叉干预以使智能合约库恢复运行，从而让冻结的资金返还给其合法所有者。最终，与
    The DAO 攻击事件后的决定形成对比，以太坊社区决定不实施硬分叉，从而阻止任何人取回冻结的资金。


    做出这一决定的原因是多方面的。首先，Parity 事件涉及的以太币实际数量远低于 The DAO 攻击事件（50 万 ETH 对比 360 万 ETH）。其次，虽然
    The DAO 攻击事件要求在短时间内做出决定，但社区有更长的时间来考虑应对 Parity 漏洞的方法。第三，也许最重要的是，Parity 漏洞并未影响以太坊整体，而只是针对特定智能合约的一个相对孤立的安全故障。但谁来决定网络危机的严重程度？谁有权力决定智能合约的执行——尽管完全符合代码规则——是否应以盗窃或保护私有财产等法治概念为由而被撤销？


    一个更健壮、正式化且透明的治理系统似乎是可取的，因为它可以规定决定和解决例外情况的适当机制。可以采用一系列治理方法，从维持非正式现状到实施授权形式。在后者中，社区就建立“紧急机制”的规则和约束达成一致。这将一组有限的权力分配给预先定义的代表群体，以制定解决例外情况的方案，随后由网络参与者考虑并实施。


    然而，如果不谨慎处理，正式化此类程序会带来问题。例如，如果以太坊社区建立一个特定的资金恢复机制，赋予预定义代表群体广泛的权力来决定是否撤销交易，这将意味着正式放弃以太坊区块链的不可篡改保证。虽然这些权力可以在时间上（例如，特定时期的紧急决策权，可由社区多数投票延长）和范围上（例如，排除特定类型的决定）受到正式限制，但这只能驯服而不能防止一种新的潜在主权力量在一个原本设计为无主权的系统中出现。这也将涉及放弃去中心化承诺，因为这种机制在设计上就会强制其他网络参与者。


    正是出于这个原因，一些区块链社区开始采用实质性的链下治理机制，最著名的是起草“宪法”和“伦理准则”，以阐述它们同意遵守的共同价值观，即使在没有强制力的情况下也是如此。对去中心化等特性和包容性等伦理方法的承诺，不仅有助于培养“公民价值观”，还涉及实质性过程，要求超越区块链协议或
    DAO 中编码的实证主义法律秩序的维护。


    ---


    # 6. Alegality


    > 每一条命令都是对自由的掌掴。

    >

    > —米哈伊尔·巴枯宁，*作品集*


    ## Pax Bitcoinica


    生活在自由意志主义乌托邦中会是什么样子？想象你是一位数字游民，生活在 Balaji Srinivasan 所称的 Bitcoinica 网络国家中。你在属于
    Bitcoinica 的公寓醒来，决定飞往该网络国家在柏林拥有的另一处房产。在机场，你用 Bitcoinica 护照向当局证明身份，该护照使用零知识证明验证你的
    Bitcoinica 公民身份，而无需透露其他个人详细信息。随后你前往 Kreuzberg 街区的 Bitcoinica 创客中心，在那里你向 Bitcoinica
    智能合约付款以预订工位和购买咖啡。在工位上，你使用私钥进入 Bitcoinica 元宇宙，可以与来自世界各地的 Bitcoinica 公民一起工作和放松。


    2022 年夏天，Coinbase 前首席技术官 Balaji Srinivasan 在一份宣言中捕捉了这一未来构想。Srinivasan 认为，我们正处于一个关键时刻，人类应摒弃民族国家，转而支持网络国家。


    Srinivasan 号召在线社区引导建立一个完整的国家，这种大胆的呼吁可能被视为一种投机性小说。然而，它所唤起的新政治想象，只有在区块链网络提供的基础设施下才成为可能。其直觉是：如果比特币的创造和流通能夺取货币和金融政策的控制权，那么其他领域的“自我主权”也可能实现——包括最终创建全新的国家。他将比特币视为一种全球主权的看法，从他创造的术语
    *Pax Bitcoinica* 中可见一斑，该术语描述了比特币如何通过其存在本身成为政府的政府，因为它“凌驾于每个国家之上，限制其无限印钞、非法没收公民资金和发动永久战争。在此过程中，它限制了永不自我限制的事物。”


    ## The Notion of Alegality


    2014 年，Gavin Wood 就 alegality（非法/超法）概念进行了演示。在询问观众对该术语的理解后，他解释说，它是“某种根本不在乎……无法在乎……其行为可能被解释为合法，也可能被解释为非法的东西。”


    自 Wood 演讲以来的几年里，“alegal”一词已被加密货币爱好者悄然采纳，并有不同解读。它被用来解释国家对比特币合法性的模棱两可或保持沉默的立场，也被用来主张可以利用非法性实现政治目标。最重要的是，alegality
    的概念在几年后启发了 The DAO 的创建。

    '
