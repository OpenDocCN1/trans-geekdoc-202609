    # 区块链治理的挑战与意义


    ## 第二：法律与监管的不确定性


    区块链技术面临着显著的法律和监管不确定性。尽管各国已开始为区块链技术制定政策和法规，但这些努力往往受到专业知识匮乏和缺乏前瞻性的困扰。区块链技术使我们面临
    **Collingridge 困境**：


    - 一方面，只要技术仍处于萌芽阶段，其后果就会不确定，因此难以控制。例如，2016 年的 **The DAO 攻击**（第 5 章讨论）影响重大，但对大多数决策者而言是不可预见的——甚至是难以理解的。

    - 另一方面，一旦区块链技术扎根于既有制度或生活方式中，其后果可能变得可预测，但技术将难以控制或引导。


    目前有项目旨在使区块链成为社交媒体治理、全球供应链管理和全球身份注册系统的底层技术。这些项目能否成功仍有待观察，但如果成功，其后果将是广泛的，且将越来越难以应对或逆转。应对这种法律不确定性的一个重要途径，是透过法律和政治理论的视角分析潜在的监管和治理挑战，这正是本书的意图所在。


    ## 第三：对法律与监管概念理解的挑战


    区块链正日益挑战我们对法律和监管的概念理解，具体表现为：


    首先，它挑战并延伸了互联网治理学者提出的担忧，涉及“代码即法律”这句格言。虽然在互联网上运作的大多数人和组织仍受国家法律约束，但区块链通过推动代码的自主性增加了新的动态。区块链系统宣称生成独立于通过它们互动的人类参与者意志的自身法律现实——因此不能被中心化权威工具化——本书将其称为
    **代码统治**，以类比“法治”。区块链系统中铭刻的规则与国家和非国家宪法体系共享某些特征。此外，由于跨国运作，区块链系统在一定程度上脱离了特定民族国家的主权。它们因此将社会、全球和数字宪法主义学者早先识别的挑战推向前台：宪法秩序不局限于民族国家的主权。相反，跨国组织、大型平台，以及现在的准自治区块链系统，生成的宪法秩序与既有法律法规既兼容又张力并存（第
    7 章讨论）。


    ## 第四：新治理模式促使重新思考政治概念


    由于其固有特性，区块链系统引入了新的治理模式，迫使我们重新思考既定的政治概念。政治哲学围绕某些关键问题展开，涉及政治权威与主权（如：主权力量的基础是什么？）、合法性（如：公民为何接受并服从一种治理体系？）、民主（如：民主决策的良好程序是什么，政治机构如何代表公民？）。区块链治理为这些问题中的每一个都增加了新的动态，从而也挑战了既定的政治概念。


    例如，在传统组织中，权威最终归属于人类决策者；而在基于区块链的系统中，权威归属于一个（据称）不可变的基于代码的协议，无论相关方意图如何，它都将按计划执行。此外，即使涉及人类治理，大多数区块链网络固有的假名性也排除了重要的一套治理动态（包括传统民主中的“一人一票”原则），最终偏向更寡头制或精英制的治理模式。合法性在区块链系统中也日益获得关键作用，不是作为证明主权强制行为正当的手段——如在更传统的中心化治理结构中那样——而是作为确保对最终由自愿参与驱动的系统忠诚度的机制。最后，只要区块链系统可被视为“多中心”治理系统（即在一个总体共享规则集下，以多个重叠决策中心为特征的系统），就会出现新问题：这些网络应在何种适当尺度上（或能够被）治理——从个体核心开发者、跨国加密货币交易所，到网络本身横跨全球的技术基础设施。


    一些学者认为，公司治理比政治治理提供了更合适的理论透镜来分析区块链系统，因为这些系统依赖“自愿合作”（如公司）且“更像市场而非等级制”。


    然而，仅凭公司治理的透镜不足以理解区块链治理的复杂性。首先，无许可区块链作为共享基础设施技术——一种公共品——的地位，呼吁政治学和政治经济学的见解（如公地管理）。


    虽然这些研究区块链治理的理由乍看似抽象，但本书将通过实例表明，它们具有现实后果。我们选择实例旨在通过经典案例说明不同治理选择对区块链系统运作的影响，同时也记录较新的案例，这些案例最终可能成为区块链治理史上的里程碑案例。例如，**Steem**
    案例（第 4 章）展示了忽视信任在区块链网络中的作用如何导致有问题的中心化动态，包括敌意收购。**The DAO 攻击**（第 5 章）说明了区块链网络如何遭遇紧急危机，可能导致违背其核心原则。最近的
    **Ooki DAO**（第 3 章）和 **Tornado Cash**（第 6 章）案例展示了即使是相对简单的区块链应用也能挑战法律体系的边界，导致立法者采取激烈且有时严苛的反制措施。这些具体实例证明了在法律和政治理论视角下讨论区块链治理的相关性，从而证明了本书对区块链开发者、决策者以及对该技术有普遍兴趣或利益相关者的相关性。


    # 本书简介


    《区块链治理》置身于学者、开发者和决策者蓬勃发展的全球对话核心。本书以区块链技术方面的深度介绍及其所赋能的特定治理形式开篇（第 2 章）。随后，它将区块链治理的讨论置于更广泛的互联网治理背景中。本书论证区块链技术已使传统互联网平台的
    **代码统治** 模式转向新的 **代码统治** 模式，这对与传统 **法治** 体系的互动有特定含义（第 3 章）。

    '
  trans: '

    # 区块链治理的挑战与意义


    ## 第二：法律与监管的不确定性


    区块链技术面临着显著的法律和监管不确定性。尽管各国已开始为区块链技术制定政策和法规，但这些努力往往受到专业知识匮乏和缺乏前瞻性的困扰。区块链技术使我们面临
    **科林格里奇困境**：


    - 一方面，只要技术仍处于萌芽阶段，其后果就会不确定，因此难以控制。例如，2016 年的 **The DAO 攻击**（第 5 章讨论）影响重大，但对大多数决策者而言是不可预见的——甚至是难以理解的。

    - 另一方面，一旦区块链技术扎根于既有制度或生活方式中，其后果可能变得可预测，但技术将难以控制或引导。


    目前有项目旨在使区块链成为社交媒体治理、全球供应链管理和全球身份注册系统的底层技术。这些项目能否成功仍有待观察，但如果成功，其后果将是广泛的，且将越来越难以应对或逆转。应对这种法律不确定性的一个重要途径，是透过法律和政治理论的视角分析潜在的监管和治理挑战，这正是本书的意图所在。


    ## 第三：对法律与监管概念理解的挑战


    区块链正日益挑战我们对法律和监管的概念理解，具体表现为：


    首先，它挑战并延伸了互联网治理学者提出的担忧，涉及“代码即法律”这句格言。虽然在互联网上运作的大多数人和组织仍受国家法律约束，但区块链通过推动代码的自主性增加了新的动态。区块链系统宣称生成独立于通过它们互动的人类参与者意志的自身法律现实——因此不能被中心化权威工具化——本书将其称为
    **代码统治**，以类比“法治”。区块链系统中铭刻的规则与国家和非国家宪法体系共享某些特征。此外，由于跨国运作，区块链系统在一定程度上脱离了特定民族国家的主权。它们因此将社会、全球和数字宪法主义学者早先识别的挑战推向前台：宪法秩序不局限于民族国家的主权。相反，跨国组织、大型平台，以及现在的准自治区块链系统，生成的宪法秩序与既有法律法规既兼容又张力并存（第
    7 章讨论）。


    ## 第四：新治理模式促使重新思考政治概念


    由于其固有特性，区块链系统引入了新的治理模式，迫使我们重新思考既定的政治概念。政治哲学围绕某些关键问题展开，涉及政治权威与主权（如：主权力量的基础是什么？）、合法性（如：公民为何接受并服从一种治理体系？）、民主（如：民主决策的良好程序是什么，政治机构如何代表公民？）。区块链治理为这些问题中的每一个都增加了新的动态，从而也挑战了既定的政治概念。


    例如，在传统组织中，权威最终归属于人类决策者；而在基于区块链的系统中，权威归属于一个（据称）不可变的基于代码的协议，无论相关方意图如何，它都将按计划执行。此外，即使涉及人类治理，大多数区块链网络固有的假名性也排除了重要的一套治理动态（包括传统民主中的“一人一票”原则），最终偏向更寡头制或精英制的治理模式。合法性在区块链系统中也日益获得关键作用，不是作为证明主权强制行为正当的手段——如在更传统的中心化治理结构中那样——而是作为确保对最终由自愿参与驱动的系统忠诚度的机制。最后，只要区块链系统可被视为“多中心”治理系统（即在一个总体共享规则集下，以多个重叠决策中心为特征的系统），就会出现新问题：这些网络应在何种适当尺度上（或能够被）治理——从个体核心开发者、跨国加密货币交易所，到网络本身横跨全球的技术基础设施。


    一些学者认为，公司治理比政治治理提供了更合适的理论透镜来分析区块链系统，因为这些系统依赖“自愿合作”（如公司）且“更像市场而非等级制”。


    然而，仅凭公司治理的透镜不足以理解区块链治理的复杂性。首先，无许可区块链作为共享基础设施技术——一种公共品——的地位，呼吁政治学和政治经济学的见解（如公地治理）。


    虽然这些研究区块链治理的理由乍看似抽象，但本书将通过实例表明，它们具有现实后果。我们选择实例旨在通过经典案例说明不同治理选择对区块链系统运作的影响，同时也记录较新的案例，这些案例最终可能成为区块链治理史上的里程碑案例。例如，**Steem**
    案例（第 4 章）展示了忽视信任在区块链网络中的作用如何导致有问题的中心化动态，包括敌意收购。**The DAO 攻击**（第 5 章）说明了区块链网络如何遭遇紧急危机，可能导致违背其核心原则。最近的
    **Ooki DAO**（第 3 章）和 **Tornado Cash**（第 6 章）案例展示了即使是相对简单的区块链应用也能挑战法律体系的边界，导致立法者采取激烈且有时严苛的反制措施。这些具体实例证明了在法律和政治理论视角下讨论区块链治理的相关性，从而证明了本书对区块链开发者、决策者以及对该技术有普遍兴趣或利益相关者的相关性。


    # 本书简介


    《区块链治理》置身于学者、开发者和决策者蓬勃发展的全球对话核心。本书以区块链技术方面的深度介绍及其所赋能的特定治理形式开篇（第 2 章）。随后，它将区块链治理的讨论置于更广泛的互联网治理背景中。本书论证区块链技术已使传统互联网平台的
    **代码统治** 模式转向新的 **代码统治** 模式，这对与传统 **法治** 体系的互动有特定含义（第 3 章）。

