- raw: "> Ethereum first extended the functionality of Bitcoin beyond the cryptocurrency\
    \ use case, and now many other blockchains have followed suit—including Hyperledger,\
    \ Tezos, and Solana. Most of these blockchain systems, which are central to this\
    \ book, are so-called public, permissionless blockchains. A public, permissionless\
    \ blockchain is a decentralized, distributed ledger that is open to anyone. Public\
    \ blockchains generally operate with pseudonymous identities, giving users means\
    \ to preserve their (financial) privacy online. In contrast, so-called private\
    \ blockchains are permissioned ledgers that are only accessible to approved participants.\
    \ Participants are required to identify themselves in order to access and interact\
    \ with private ledgers. The latter are generally adopted by large enterprises\
    \ developing internal blockchain solutions to automate certain business processes.\
    \ Enterprise blockchains are also being developed by consortia of companies in\
    \ a wide range of industries, including finance, health care, supply chain management,\
    \ and energy. Because most of the governance innovations are occurring in the\
    \ context of public blockchains, this book focuses on them over private or enterprise\
    \ blockchain systems.\n\n> \n\n> ## Tools for Governance\n\n> \n\n> Since the\
    \ advent of Bitcoin, blockchain technology has been developed and used for a variety\
    \ of applications beyond cryptocurrencies. While initially geared toward the creation\
    \ of digital scarcity, blockchain technology has become a new institutional technology\n\
    \n> \n\n> ### Digital Scarcity\n\n> \n\n> Blockchains enable the exchange of various\
    \ digital assets in a peer-to-peer fashion. While people have been distributing\
    \ digital files over peer-to-peer networks like BitTorrent for many years now,\
    \ distributing digital files over the Internet network always and necessarily\
    \ implies a reproduction of these files: if I send you a digital song over the\
    \ Internet, I still retain my digital copy of the song. This is what has led economists\
    \ to qualify the digital realm as nonrival, meaning that consumption of a digital\
    \ file by one person does not preclude the consumption of the same digital file\
    \ by another person. The technological guarantees of blockchain technology make\
    \ it impossible for any given actor to reproduce blockchain-based digital assets.\
    \ We can now talk about “digital scarcity” (as opposed to the “artificial scarcity”\
    \ introduced by intellectual property) regarding all digital assets that subsist\
    \ on a blockchain.\n\n> \n\n> These digital assets can assume a variety of functions.\
    \ Cryptocurrencies, like Bitcoin or Ethereum, are necessary for the use of the\
    \ underlying blockchain network. Bitcoins are needed to pay the transaction fees\
    \ to use the Bitcoin network, and Ether is needed to pay for the cost of executing\
    \ transactions on the Ethereum blockchain. These cryptocurrencies can also be\
    \ traded for other cryptocurrencies or traditional fiat currencies on specialized\
    \ exchanges. Exchanges can be either centralized, like Coinbase or Kraken, or\
    \ decentralized, like Uniswap or Sushiswap.\n\n> \n\n> Blockchain tokens are another\
    \ type of digital assets issued on a blockchain that represent a specific resource\
    \ or utility. Today, there are a variety of different blockchain platforms used\
    \ for the issuance of digital tokens. The most well-known is probably Ethereum,\
    \ which supports the issuance and exchange of a wide variety of token-based digital\
    \ assets. Most blockchain tokens provide the ability to access a certain service\
    \ or use a certain blockchain application: these are usually referred to as utility\
    \ tokens.\n\n> \n\n> Sometimes, tokens represent fractional ownership in a project\
    \ or asset that has been tokenized on a blockchain. These are called security\
    \ tokens and often resemble more traditional investments, like equity or debt.\
    \ Oftentimes, these tokens are offered to the public by the means of token sales,\
    \ also known as initial coin offerings (ICOs), used to raise funds to develop\
    \ a particular blockchain-based initiative. Whether they refer to shares in a\
    \ company or in a blockchain-based entity, the sale of these tokens is commonly\
    \ assimilated to an investment contract, where the purchasers expect some financial\
    \ return on their investment through the efforts of others. As a result, the issuance\
    \ and trading of these tokens are generally highly regulated because they typically\
    \ fall within the scope of securities regulations.\n\n> \n\n> Some blockchain\
    \ tokens are also associated with the possibility to participate in the governance\
    \ of a particular blockchain system. By acquiring a token, one thus automatically\
    \ acquires the possibility to cast a vote regarding a particular issue—and the\
    \ more tokens one holds, the more influence one has in the decision-making process.\
    \ Thus, as opposed to the democratic principle of “one person, one vote,” blockchain\
    \ systems typically implement a plutocratic governance system based on “one token,\
    \ one vote,” more akin to shareholder voting. This essentially means that those\
    \ with more economic power have the possibility of swaying the decision-making\
    \ process to their own advantage by purchasing more tokens. A variety of solutions\
    \ have been elaborated to mitigate this problem. For instance, *quadratic voting*\n\
    \n> \n\n> Tokens can also be used to represent certificates of ownerships for\
    \ physical assets (e.g., gold) or digital assets (e.g., works of art). The latter\
    \ are usually referred to as NFTs (nonfungible tokens). NFTs are a type of digital\
    \ asset that are unique and nonfungible (meaning they cannot be replaced by another\
    \ identical asset) as they each have their own distinct value. For the first time\
    \ in history, artists have the ability to monetize their digital artworks without\
    \ having to transfer the copyright in these works, for what they are selling is\
    \ not the intellectual property associated with the work but rather unique digital\
    \ copies of that work. One of the most well-known NFTs is Beeple’s “Everydays:\
    \ The First 5,000 Days,” which was sold for USD 69 million at a Christie’s auction\
    \ in March 2021. Following that sale, the NFT market has seen a boom in both the\
    \ number of NFTs being created and the prices being paid for them. The digital\
    \ scarcity inherent in these tokens has resulted in significant speculative dynamics\
    \ in the NFT market, leading to an overall market capitalization of over USD 20\
    \ billion in 2022. And even though the speculative bubble has eventually burst,\
    \ NFTs remain today a powerful means for the trading of (scarce) digital assets.\n\
    \n> \n\n> NFTs are also increasingly used to create new types of virtual communities,\
    \ whose membership is defined by the ownership of NFTs from a particular collection.\
    \ The Bored Ape Yacht Club is perhaps the most representative example of this\
    \ trend. This NFT collection of 10,000 Bored Apes has become one of the most expensive\
    \ and influential NFT projects due to its focus on community benefits. Every Bored\
    \ Ape NFT is not only an expensive collectible but also a community pass, enabling\
    \ token holders to access exclusive community meetups all over the world and hang\
    \ out with other Bored Apes. As such, NFTs are also being turned into a governance\
    \ tool, with the advent of token-gated communities or forums, where ownership\
    \ of an NFT becomes a precondition to access a particular type of community’s\
    \ resources or even to engage with the governance of such a community.\n\n> \n\
    \n> ### Authentication\n\n> \n\n> Blockchain technology provides new ways to verify\
    \ and authenticate content as well as to gain secure and verifiable attestations\
    \ or certifications. Instead of a digital notary service, with a blockchain, the\
    \ authenticity of digital documents can be verified by simply consulting the information\
    \ recorded on the chain. This functionality has been used already for a variety\
    \ of applications, including the issuance of university diplomas and birth certificates.\n\
    \n> "
  fmt: '

    # 区块链治理工具


    以太坊首次将比特币的功能扩展到了加密货币用例之外，现在许多其他区块链也纷纷效仿——包括 Hyperledger、Tezos 和 Solana。这些区块链系统大多是所谓的公共、无许可区块链，也是本书的核心关注对象。公共、无许可区块链是一种去中心化、分布式账本，对任何人开放。公共区块链通常以假名身份运行，使用户能够在线保护其（金融）隐私。相比之下，所谓的私有区块链是有许可的账本，仅经批准的参与者才能访问。参与者必须验证身份才能访问和与私有账本交互。后者通常被大型企业采用，用于开发内部区块链解决方案以自动化特定业务流程。企业区块链也由跨金融、医疗、供应链管理和能源等广泛行业的公司联盟开发。由于大多数治理创新都发生在公共区块链的背景下，本书重点关注公共区块链，而非私有或企业区块链系统。


    ## 治理工具


    自比特币问世以来，区块链技术已被开发并用于加密货币以外的各种应用。虽然最初旨在创造数字稀缺性，但区块链技术已成为一种新的制度技术。


    ### 数字稀缺性


    区块链支持以点对点方式交换各种数字资产。虽然人们多年来一直通过 BitTorrent 等点对点网络分发数字文件，但通过互联网分发数字文件总是且必然意味着这些文件的复制：如果我通过互联网发送一首数字歌曲给你，我仍然保留该歌曲的数字副本。这导致经济学家将数字领域定性为非竞争性的，即一个人对数字文件的消费不会妨碍另一个人对同一文件的消费。区块链技术的技术保证使得任何行为者都无法复制基于区块链的数字资产。我们现在可以谈论“数字稀缺性”（相对于知识产权引入的“人为稀缺性”），关于所有存在于区块链上的数字资产。


    这些数字资产可以承担多种功能。加密货币（如比特币或以太坊）是使用底层区块链网络所必需的。比特币用于支付使用比特币网络的交易费，以太币用于支付在以太坊区块链上执行交易的成本。这些加密货币也可以在专业交易所兑换其他加密货币或传统法定货币。交易所可以是中心化的（如
    Coinbase 或 Kraken），也可以是去中心化的（如 Uniswap 或 Sushiswap）。


    区块链代币是另一种在区块链上发行的数字资产，代表特定资源或效用。如今，有各种不同的区块链平台用于发行数字代币。最知名的可能是以太坊，它支持发行和交换各种基于代币的数字资产。大多数区块链代币提供访问特定服务或使用特定区块链应用的能力：这些通常被称为效用代币。


    有时，代币代表已在区块链上代币化的项目或资产的部分所有权。这些被称为证券代币，往往更类似于传统投资，如股权或债务。这些代币通常通过代币销售（也称为首次代币发行
    ICO）向公众发售，用于筹集资金开发特定的基于区块链的计划。无论它们指的是公司股份还是基于区块链实体的股份，这些代币的销售通常被视为投资合同，购买者期望通过他人的努力获得某种财务回报。因此，这些代币的发行和交易通常受到高度监管，因为它们通常属于证券法规的范围。


    一些区块链代币还与参与特定区块链系统治理的可能性相关联。通过获取代币，人们自动获得就特定问题投票的可能性——持有的代币越多，在决策过程中的影响力就越大。因此，与民主原则“一人一票”相反，区块链系统通常实施基于“一币一票”的寡头制治理系统，更类似于股东投票。这本质上意味着拥有更多经济权力的人可以通过购买更多代币将决策过程引向有利于自己的方向。已经开发出多种解决方案来缓解这一问题。例如
    `quadratic voting`


    代币也可用于代表实物资产（如黄金）或数字资产（如艺术品）的所有权证书。后者通常被称为 NFT（非同质化代币）。NFT 是一种独特且非同质化的数字资产（意味着它们不能被另一个相同的资产替代），因为它们各自都有独特的价值。历史上第一次，艺术家无需转让作品的版权即可将其数字艺术品货币化，因为他们出售的不是与作品相关的知识产权，而是该作品的独特数字副本。最著名的
    NFT 之一是 Beeple 的《Everydays: The First 5,000 Days》，于 2021 年 3 月在佳士得拍卖会上以 6900 万美元售出。此后，NFT
    市场在创建的 NFT 数量和支付价格方面都经历了繁荣。这些代币固有的数字稀缺性导致 NFT 市场出现显著的投机动态，2022 年总市值超过 200 亿美元。尽管投机泡沫最终破裂，NFT
    如今仍是交易（稀缺）数字资产的有力手段。


    NFT 也越来越多地用于创建新型虚拟社区，其成员资格由拥有特定收藏的 NFT 定义。Bored Ape Yacht Club 或许是这一趋势最具代表性的例子。这个包含
    10,000 只无聊猿的 NFT 收藏，因其专注于社区福利，已成为最昂贵和最有影响力的 NFT 项目之一。每个无聊猿 NFT 不仅是昂贵的收藏品，还是社区通行证，使代币持有者能够参加世界各地的独家社区聚会，与其他无聊猿持有者交流。因此，NFT
    也正在成为一种治理工具，随着代币门控社区或论坛的出现，拥有 NFT 成为访问特定社区资源甚至参与此类社区治理的前提条件。


    ### 认证


    区块链技术提供了验证和认证内容的新方式，以及获得安全且可验证的证明或认证。区块链不是数字公证服务，只需查阅链上记录的信息即可验证数字文档的真实性。此功能已用于多种应用，包括大学文凭和出生证明的发放。

    '
