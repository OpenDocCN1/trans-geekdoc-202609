- raw: 'This new role of technology is becoming increasingly explicit in the twenty-first
    century. Rather than being an enabling factor, or an inspiration for utopian ideas
    of governance, technology is gaining political force and is becoming a form of
    governance in and of itself. This was not yet the case in the mechanical age,
    for—as Newton believed—even the perfect clockwork that was the universe needed
    a prime mover other than itself: the watchmaker (i.e., God). Since the invention
    of the Turing machine, however, symbolic machines now share a faculty that was
    deemed exclusively human, namely the ability to make decisions. Today, machine-made
    decisions are all around us, nudging us, guiding us, and sometimes even coercing
    us. Recommendation algorithms decide what content or ads we get to see online,
    while content moderation systems decide what will be hidden from view.


    Yet, as with Newton’s clockwork universe, behind these machine-powered decision-making
    systems sit a group of “prime movers” who do not qualify as gods but as humans
    made of flesh and blood, be they Mark Zuckerberg or Xi Jinping. This book is about
    a new cybernetic watch that purports to push aside its watchmaker(s) and whose
    first instantiation was the cryptocurrency, Bitcoin. Three decades after Fukuyama’s
    thesis, blockchain technologies are propelling a Cambrian explosion of new governance
    systems. Radically new governance concepts are being brought to the forefront:
    from distributed consensus to decentralized autonomous organizations (DAOs), with
    many others on the horizon.


    These radical new forms of governance do not emerge out of a vacuum but instead
    ride on a wave of sociotechnical imaginaries that interpret technological advancements
    in light of speculative science fiction and political visions. The idea of cyberspace—a
    virtual, open-ended matrix having its roots in arcade games—itself emerged in
    science fiction, famously being coined in William Gibson’s *Neuromancer*.


    Such visions, emerging from science fiction, suggest that a different world, with
    a different philosophy and a different politics, is possible. Whether this world
    is benign or evil remains an open question. Yet, there seems to be a movement
    visible in these sociotechnical imaginaries, one that resonates with the world
    we actually live in. First, there is the growing importance of technology. In
    the 1950s, people still imagined planetary civilization to be run quite similarly
    to their own places and times; we have moved to imaginaries of brain-chip-empowered
    hiveminds that coordinate economic activities through voluntary peer-to-peer networks.
    Second, there is a move away from what Palmer described as the “old spider,” the
    nation state. Our political existence, we imagine, is deterritorializing, dematerializing,
    and moving into the boundless expanse of cyberspace. We are both everywhere and
    nowhere, but political power and physical bodies still persist, generating divisions
    between the haves and the have nots and reminding us of the temporality of our
    own existence. Third, as anticipated by Marshall McLuhan, we reach back into the
    distant past to understand our present and envision our possibilities for the
    future.


    These three developments—the revolutionary role of technology, moving away from
    the nation state, and a revival of political ideas from the past—have fueled not
    only science fiction but also concrete developments in technology. Already in
    the 1970s, influential figures like Steward Brand used their imaginations to fuse
    drugs, advanced electronic networks, and ideals of living in primitive communities
    to fuel the vision that powered Silicon Valley and its Californian Ideology.


    On that day, the publication of the Bitcoin white paper established a new technological
    infrastructure—blockchain technology—through which people can interact and transact
    in a peer-to-peer manner. Blockchain technology is a new type of economic and
    political institution that works outside of the existing political fabric made
    up of trusted intermediaries,


    ## Why Blockchain Governance?


    This book is about blockchain governance, which covers the regulation and governance
    *of* and *by* blockchain technology. It is concerned with a wide range of issues,
    from how policymakers may respond to challenges raised by blockchain, via how
    blockchain developers can grapple with tensions in protocol design, to how fundamental
    principles like immutability both enable and hinder governance alternatives. Blockchain
    governance captures the dual aspects of governance *by* the technology (*on-chain*
    governance) and governance *of* the technology (*off-chain* governance). The dynamic
    between these two aspects of blockchain governance is a major theme of this book
    and will reappear throughout the chapters—for instance, in exploring the tension
    between the concepts of trust and confidence in an ostensibly “trustless” network
    and in assessing the impact of exogenous and endogenous pressures in shaping perceptions
    about the legitimacy of blockchain governance.


    In the following chapters, we find ourselves in the footsteps of Aristotle, who
    in his time witnessed a proliferation of new forms of governance in the Greek
    city states: from tyrannies to aristocracies, oligarchies, and democracies. It
    is in this context that the disciplines of law and political science first emerged
    to reflect on the questions of governance: What should a government look like?
    What is the role of a citizen and of the state? How does political change occur?
    How can political communities improve a citizen’s happiness and well-being? How
    should citizens be encouraged to be just and virtuous? Now, blockchain communities
    around the world are experimenting with different consensus algorithms, innovative
    voting systems, dispute resolution systems, and community covenants that are meant
    to act like written constitutions. And similar questions of governance arise:
    Should blockchain communities adhere to the “rule of code” or allow human interference
    in the administration of the protocol? Should a blockchain governance system adhere
    to democratic principles, or could it adopt a plutocratic form of governance?
    How should blockchain communities preserve the polycentric nature of public permissionless
    blockchain networks?


    Blockchain governance captures the dual aspects of governance *by* the technology
    (*on-chain* governance) and governance *of* the technology (*off-chain* governance).


    Answering these questions is not straightforward. As Vili Lehdonvirta argued in
    2016, blockchain governance is inherently a “paradox.” He asked, Isn’t it the
    point of blockchain technologies to obviate the need for (human) governance? And
    if it is not, and (human) governance is needed, why is a blockchain required at
    all, if people are going to ultimately trust a third party?


    Why is it important to investigate blockchain governance? First, blockchain technology
    has become a consequential force in the world. Back in 2010, Bitcoin was still
    unknown to most people, its nascent community celebrated when someone used the
    cryptocurrency to buy a pizza. Only one decade later, blockchain technology has
    disrupted virtually every sector. It has become a trillion-dollar industry, with
    millions of people around the world developing Web3 applications, investing in
    new crypto projects, or chatting about the latest crypto crisis with colleagues
    over coffee. Blockchain has become a topic discussed by heads of state, central
    bankers, and the CEOs of the world’s largest companies. This growing relevance
    of blockchain technology automatically raises concerns of governance. Blockchain
    developers have started asking questions about their relationship with regulators,
    while policymakers have started to explore new pathways to formulating effective
    regulations. To do this wisely, an understanding of blockchain governance, in
    terms of its promises and challenges, is indispensable.'
