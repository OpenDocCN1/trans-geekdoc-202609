- raw: 'Yet, when focusing on the core design of blockchain networks, the claim to
    alegality becomes more credible. Take, for instance, the transparency and tamper-resistant
    qualities of blockchain protocols. Because of these features, it is exponentially
    difficult for content to be removed from a widely used public permissionless blockchain
    regardless of whether that content is harmful (e.g., child pornography), questionable
    (e.g., pirated content), or considered publicly beneficial (e.g., on-chain financial
    transactions of sanctioned Russian oligarchs). More importantly, blockchain transparency
    and tamper-resistance can transform how issues like financial transparency are
    regulated altogether. Imagine, for instance, legal authorities using blockchain
    analytics to trace the transfer of crypto assets that they suspect of being used
    for criminal purposes and thereby enforcing a new regime of financial transparency,
    such as the one introduced in the EU through the Transfer of Funds Regulation
    in 2023. Whether desirable or not, this resonates with what Wood meant by the
    alegal nature of blockchain systems prompting the reimagination of how illegal
    activities are regulated. Blockchain technology thereby prompts us to test the
    material boundaries of the law and can prompt a reconfiguration of how rights
    and obligations are distributed in a legal order.


    Blockchain also challenges the law’s subjective boundaries. Consider the novel
    “property regime” of crypto assets. In traditional property regimes, ownership
    titles are defined and granted by the law, with the state acting to enforce those
    laws should a false claim be made about ownership. Physical possession, while
    important, is not the be-all and end-all of determining who has legal ownership.
    In contrast, the novel property regime in blockchain systems is captured by the
    aphorism “not your keys, not your coins.” It is possession of one’s private key
    associated with a crypto wallet that makes one *technically* the owner of the
    cryptocurrency in that wallet, as it allows one to exercise the rights typically
    associated with full ownership, such as access, transfer, and use. As the FTX
    debacle revealed, ownership of a crypto asset does not necessarily lead to the
    enjoyment of ownership rights. FTX held many users’ crypto assets in FTX wallets,
    and when the exchange went under, many users lost access to their crypto holdings.
    It became unclear for many whether they would be able to regain control over their
    crypto assets. After all, there is no guarantee that a court will enforce legal
    ownership. For instance, a 2020 case in California involved a claim by a user
    alleging that financial gains from the forking of their crypto assets were not
    passed on to them by their crypto custodian. This claim was not upheld by the
    court as the custodian held the tokens, and the contractual agreement between
    the user and the custodian gave the latter discretion in passing on financial
    gains from forked assets.


    Moreover, blockchain challenges the spatial boundaries of the law. As The DAO
    (see chapter 5) was not controlled by a centralized operator and was not registered
    in any state, it existed simultaneously everywhere and nowhere. In this respect,
    blockchain-based systems differ from traditional entities that depend on registration
    in, or at least recognition by, a territorial jurisdiction. Even in this age of
    ubiquitous multinational corporations, this connection between an entity and a
    territory determines an entity’s capacity to interact with the physical world.
    The recognition of the separate legal personality of unregistered DAOs without
    requiring registration in a state would amount to a redrawing of the law’s spatial
    boundaries and require significant political and administrative changes.


    The DAO Model Law developed by the Coalition of Automated Legal Applications (COALA)
    calls for this approach, asking jurisdictions to eschew local registration requirements
    and instead recognize alternative functionally and regulatorily equivalent means
    for achieving the policy objectives of registration. Whether such a deterritorial
    approach is adopted remains to be seen. The state of Utah’s DAO Act, based on
    The DAO Model Law, does waive registration requirements and recognizes unregistered
    DAOs meeting certain conditions as equivalent to domestic LLCs. However, it maintains
    a physical link to the jurisdiction by requiring that a registered agent be physically
    present in the state of Utah.


    Finally, blockchain challenges the law’s temporal boundaries. Consider the decision
    to pursue a hard fork of the underlying Ethereum protocol in the wake of the attack
    on The DAO. While the retroactive unwinding of undesirable past transactions at
    a set point in time addressed the concerns of those who considered The DAO attack
    to be a form of theft, others believed this act infringed the code-is-law approach.
    This act was alegal as it raised fundamental questions about the sequence of how
    and when acts are appropriately done. It just so happens that the coordinated
    action to hard fork led to an outcome that made victims of theft whole. In several
    subsequent hacks of blockchain protocols, such coordination did not occur, and
    the law could not command a hard fork to occur either.


    These examples show how the design of blockchain networks enables them to resist
    the force of legal orders in certain ways and even prompt the redrawing of legal
    boundaries. Despite its limitations, Wood’s claim regarding the alegality of blockchain
    technology raised an interesting question: can blockchain systems be alegal by
    design? To some extent, this seems to be the case. While most scholars of alegality
    have limited the concept to purely political actions, it seems that systems like
    blockchain do have politics, as Winner famously argued.


    Can blockchain systems be alegal by design? To some extent, this seems to be the
    case.


    One example of this is Tornado Cash, a blockchain-based software system used to
    enhance financial privacy. Users can send cryptocurrency to Tornado Cash smart
    contracts from one address and then withdraw it to another, thereby severing the
    link between the two addresses, obfuscating the holder’s identity, and retaining
    control of the cryptocurrency. This service can be used for both legitimate and
    illegitimate purposes, ranging from anonymous charitable donations to the funding
    of hackers. What makes Tornado Cash distinct is that it is a collection of smart
    contracts on the Ethereum blockchain without a centralized operator that can stop
    or intervene in its operations. This was a deliberate choice by the founding team
    of developers, as they wished to preserve the immutability of the smart contracts
    and enable Tornado Cash to be trustless and autonomous—a true confidence machine—thereby
    upholding the “precepts that code is law.”


    The technological affordances of Tornado Cash allow it to perform alegal acts
    that transgress all four boundaries of the law. Since its deployment, it has challenged
    the temporal boundary of the law by a novel, more censorship-resistant system
    of preserving financial privacy. Simultaneously, this system challenges the law’s
    material boundaries by strengthening the right to financial privacy at a time
    when it is threatened. By concealing the origins of financial transactions, Tornado
    Cash enables individuals to perform otherwise unfeasible transactions, such as
    making outward remittances in jurisdictions with strict foreign payments restrictions,
    thereby challenging the law’s authority on who may or may not take certain financial
    actions. Finally, as with unregistered DAOs, since Tornado Cash is a collection
    of smart contracts that exist everywhere and nowhere, it transgresses the spatial
    boundaries of the law by challenging any state’s ability to claim jurisdiction
    over it.'
