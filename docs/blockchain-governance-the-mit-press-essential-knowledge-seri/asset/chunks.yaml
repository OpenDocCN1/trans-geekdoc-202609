    In essence, while foundational legitimacy is concerned with the technical decentralization,
    robustness, and security of the blockchain system, contingent legitimacy addresses
    political decentralization and how power and authority are wielded within the
    network. A blockchain network with both foundational and contingent legitimacy
    is more likely to be accepted, and therefore adopted by the masses, because in
