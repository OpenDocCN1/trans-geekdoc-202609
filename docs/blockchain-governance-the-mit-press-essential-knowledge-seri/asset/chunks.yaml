    and coercive control, offers an alternative to this rule by code: the rule of
    code. Just as with the rule of law, this raises important legal and political
    questions: what procedural and substantive rules should define the rule of code?


    Second, blockchain at its core raises the issues of trust and trustlessness. It
    is meant to do away with trust in third parties, but what does it give us in return?
    In sociology, we find the helpful distinction between trust—requiring, among others,
    an addressee and conscious risk-taking—and confidence—requiring, among others,
