  trans: '


    然而，尽管非法人协会的所有成员通常承担连带责任，但在 Ooki DAO 一案中，鉴于许多代币持有者并非 DAO 的活跃参与者，法院认为只有那些实际行使与这些代币相关治理权的代币持有者才应承担责任。使用他们的代币来影响
    DAO 的活动，意味着他们自愿成为了管理 Ooki 协议的非法人协会的成员。因此，尽管在 Ooki DAO 一案中只有创始人被追究违法责任，但该案例表明，未来一个
    DAO 的所有活跃代币持有者都可能因 DAO 的任何非法行为而被追究个人责任，而不仅仅是创始人。由于这些措施，任何与智能合约地址交互的人都将被严格追究责任，这意味着无需证明恶意意图，甚至无需证明知晓制裁的存在。


