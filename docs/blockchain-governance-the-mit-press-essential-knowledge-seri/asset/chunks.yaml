- raw: 'In short, the future of governance was a core theme of the discussions that
    took place in the assemblies and salons at Zuzalu. It is also a subject that we
    collectively, and individually, have been researching for several years within
    various contexts. While blockchain communities love to experiment and speculate
    about the modes of governance of the future—invariably powered by blockchain—we
    wanted to put ourselves at the intersection of theory and practice. On the one
    hand, researching blockchain inevitably means getting one’s hands dirty and engaging
    with the world of practice—for instance, by applying ethnographic methods and
    actively engaging with blockchain communities. While we do not have a significant
    stake in any of the blockchain projects that feature in this book, we have embedded
    ourselves in blockchain communities as a way of conducting research, to understand
    this world and its working from the inside out. On the other hand, writing this
    book required us to maintain a critical distance. Delving into political and legal
    theory, we engaged with old and contemporary ideas derived from the literature
    to critically assess the claims of blockchain proponents concerning the revolutionary
    new forms of governance this technology offers and the sweeping implications it
    may have. What does it mean, we ask, for blockchain technology to be “trustless”
    and “alegal”? Are these technical systems immune to political challenges like
    states of emergency, and can the governance of these systems ever be made legitimate?


    At the time of writing this preface, in March 2024, the ecosystem of blockchain
    technology seems to have moved to a new stage. In the wake of the scandals surrounding
    some of the major exchanges, FTX and Binance, and the spectacular fall of industry-leading
    figures like Sam Bankman-Fried, a crypto winter set in. After years of attention
    and hype, blockchain technology is somewhat out of the limelight, with the big
    boom in artificial intelligence applications dominating global attention. This,
    however, has also opened up two new pathways for the maturity of blockchain technology
    and blockchain governance. First, as Buterin stressed on multiple occasions, without
    the burden of the speculative bubble, blockchain projects may finally return (or
    perhaps, progress) to their roots in cypherpunk ideology. Perhaps more generally,
    without having to commit to a particular ideology, blockchain communities and
    policymakers may find the space and time to reflect on the deeper political and
    legal issues faced by blockchain ecosystems. We hope that this book will provide
    a starting point for these reflections. Second, and relatedly, ongoing legislative
    and regulatory activity has provided greater clarity about the rules applicable
    to this technology and the crypto-industry and has provided insight into the attitudes
    of policymakers toward both. On the one hand, through legislation such as the
    EU’s recent Markets in Crypto-Assets regulation, we have greater certainty about
    the terms under which certain crypto asset services can be provided. On the other
    hand, new regulations or the application of existing laws may be poorly suited
    for the development of this technological innovation or even ineffective in achieving
    their intended purposes. Cases concerning economic sanctions on blockchain-based
    software systems and the liability of members of decentralized autonomous organizations
    (DAOs) that are discussed in this book reveal some of the shortcomings of the
    prevailing “regulation by enforcement” approach. Instead, we elaborate on a “regulation
    by governance” approach that seeks to meet important public policy objectives
    through technical (e.g., new governance technologies) and social means (e.g.,
    social norms cultivation) that are compatible with the particular features of
    blockchain technology and the industry as a whole. As regulatory activity continues
    to grow apace, we hope that the concerns and recommendations we mention also receive
    consideration.


    This book results from years of close collaboration, and we, the authors, have
    equally contributed to the research and writing of this manuscript. We would like
    to take this opportunity to thank the many people without whom this book would
    not have been possible. First, these include members of the ERC project BlockchainGov,
    especially Kelsie Nabben, Sofia Cossar, Silke Noa, and Tara Merk. Second, we have
    gained valuable input from colleagues, most notably Nathan Schneider, Eric Alston,
    Liav Orgad, Ellie Rennie, and Jason Potts. We would not have had the time and
    resources to finish the book without the generous support of the European Research
    Council (grant number 865856 under the European Union’s Horizon 2020 Research
    and Innovation Programme) and the supportive environments of CERSA, the Berkman
    Klein Center for Internet & Society at Harvard University, the European University
    Institute, and the University of Vienna. Finally, we would like to thank our families
    and friends for their patience and support while we worked on this manuscript.


    # 1


    # New Cambrian Explosion


    We have sealed ourselves away behind our money, growing inward, generating a seamless
    universe of self.


    —William Gibson, *Neuromancer*


    ## Cambrian Explosion


    In 1992, Francis Fukuyama announced the “end of history,” signaling the end of
    an evolutionary process in terms of governance structures.


    Two thousand years earlier, the philosopher Aristotle painted a very different
    picture about the possibility of realizing an ideal system of governance. Criticizing
    his mentor Plato, he lamented the preoccupation of philosophers with the “ideal
    state” such as Plato’s utopian vision of a republic governed by philosopher-citizens.
    Instead, he believed, one should start inquiring into politics empirically, by
    simply looking around. Ancient Greece had witnessed a unique historical moment
    with the emergence of the polis, the city state. Rather than being characterized
    by uniformity, city states were extremely diverse.


    In *The Politics*, Aristotle surveyed the actual constitutions of the city states
    and the hugely diverse ways in which they organize property rights, establish
    citizenship rights, and make decisions. Phaleas of Chalcedon, for instance, proposed
    an extremely egalitarian property regime, where the rich would donate their inheritance
    to the poor.


    At that time, ancient Greece experienced a “Cambrian explosion” of forms of governance.
    This is a metaphorical reference to an interval of a few million years about 500
    million years ago in which the geological records show an extremely quick and
    prolific diversification of organic life. Biological evolution, it appears, is
    not linear; it moves dynamically between greater diversification and greater homogenization.
    The same, at times, applies to the ways humans govern their societies. As Graeber
    and Wengrow recently argued, our modern understanding of how governance evolved
    is still very much in line with Fukuyama’s thesis.


    Certainly, many factors play a role in Cambrian explosions of human governance,
