- raw: 'Drawing from debates concerning the distinction between legitimacy and legality,
    and the political conception of legitimacy, chapter 7 critically analyzed the
    claim that legitimacy is the most important scarce resource of blockchain-based
    systems. Yet, the role that legitimacy plays in a blockchain system is very different
    from the role it plays in more traditional, coercive governance structures. By
    showing that blockchain systems can foster their legitimacy by integrating both
    on- and off-chain governance processes, this chapter has illustrated the significance
    of legitimacy in blockchain networks, emphasizing the importance of rules that
    are not only being legally defined (on- or off-chain) but also genuinely accepted
    and respected by the community. This was further demonstrated by recent efforts
    to formalize procedural and substantive constitutional rules in an off-chain document,
    with a view to improving the overall governance and legitimacy of blockchain systems.
    As these off-chain constitutional texts proliferate, we argue that it is important
    for drafters to carefully consider the trade-offs that exist in seeking both endogenous
    and exogenous legitimacy.


    # 8


    # Cryptopia


    Man is born free but everywhere is in chains.


    —Jean-Jacques Rousseau, *The Social Contract*


    ## (Un)chained


    “The car decelerated at the turn. Alina knew how it saw the world: lidar point
    clouds, IoT sensor oracle feeds, chain IDs—with algorithms predicting where everything
    was going to be seconds, minutes, days from now.” In this snapshot from a short
    story titled *Unchained*,


    The story captures some of the core directions of travel for the future of blockchain
    technology. To start, blockchain technology is poised to become an infrastructural
    technology, much like the Internet protocols. This will result from a symbiosis
    and synthesis with other emerging technologies, most notably with smart devices
    and AI. Smart devices will allow for blockchains to be integrated into the physical
    environment, from cars to passports. This also means that physical devices directly
    become contractual devices. For instance, your future car might be directly governed
    by a car insurance policy—stored on a smart contract—that keeps track of your
    driving habits. Integration with AI will then allow smart contracts to not only
    execute pregiven rules but also condition execution on the machine learning’s
    interpretation of data.


    Moreover, this merging of emerging technologies signals the use of blockchain
    technology beyond the first use case of money. To be sure, this tendency has already
    been convincingly demonstrated by the use of blockchain for financial products,
    social media, prediction markets, and so forth. Yet, some of the biggest promises
    of blockchain—for instance, its use in supply chain management—are, at the moment
    of writing, still exactly that: mere promises. Once the linking and integration
    of technologies becomes increasingly successful, the reality depicted by Rajaniemi
    becomes more likely. This would open the gates toward a society that organizes
    many of its contractual relations, from commerce to marriage, by means of blockchain
    technology. It would further accelerate the demise of the ownership society and
    usher in contractual societies that foster a new sociolegal and political worldview
    and ideology. As Rajaniemi shows, it may alter our understanding of institutions
    like marriage and also impact our judgment as humans—given that judgments will
    increasingly be the function of the execution of a smart contract rather than
    of our own observations and considerations.


    Would this future be a good or a bad one, and what would Cryptopia look like?
    The answer to these questions is uncertain, but at least three pathways have become
    discernible. First, blockchain technology might turn out to become the ultimate
    technology of control, able to put all human relationships not into proverbial,
    but effective, digital chains. In this tyranny of code, all human activities are
    liable to rules encoded in one or a few blockchains controlled by plutocratic
    elites. In this world, there will be a widening gap between the haves and the
    have nots. Second, the state system might do everything in its power to reel in
    blockchain technology, diminishing its decentralizing efforts and making it part
    of the state structure. The clearest example here is the rise of central bank
    digital currencies, which are now pursued by all major economies. Third, there
    is the vision of a pluralist world of DAOs, one that echoes some of the utopian
    ideals of anarchists and cypherpunks like Barlow. In this future, DAOs could both
    help preserve privacy from surveillance and be responsible for providing various
    public goods and services, such as health care, education, and environmental sustainability.


    ## TL;DR


    As this book has shown, blockchain governance engages core concepts and challenges
    that feature in sociology, legal theory, and political philosophy. These become
    relevant through the practical and material realities of blockchain technologies:
    the on-chain configurations of protocols, the off-chain governance practices of
    blockchain communities, and so on. These practices of on- and off-chain governance
    in turn challenge established political and legal concepts. For instance, our
    understanding of trust in organizations is challenged by the feature of blockchain
    being a confidence machine. And similarly, our understanding of measures to enhance
    legitimacy is challenged by the limitations of coercion, and the role played by
    exit strategies, in blockchain-based systems.


    Blockchain technology might turn out to become the ultimate technology of control,
    able to put all human relationships not into proverbial, but effective, digital
    chains.


    For those readers in a hurry, here comes the TL;DR (“too long, didn’t read”).
    First, blockchain technology plunges us into a new chapter of the discourse on
    law and technology. At first, the field was shaped by the emergence of the Internet.
    The Internet fostered an architectural mode of regulation, according to which
    code would shape the possibilities of a user’s action, thereby encoding equivalences
    of legal rights, duties, privileges, and prohibitions. In other words, code is
