    # Preface


    The book then investigates a concept central to the political and legal visions
    of blockchain, its purportedly “trustless” character (chapter 4). Responding to
    sociological work on trust, it argues that blockchain technology could best be
    understood as a “confidence machine” even though the need for trust is not eliminated
    but rather dispersed within a distributed network of actors. Drawing from the
    historical event of The DAO attack, the book subsequently turns to the question
    of sovereignty in blockchain systems (chapter 5). It argues that blockchain systems
    are organized as positivist legal orders and that, like the legal orders of nation-states,
    they are vulnerable to the states of exception that urge the emergence of sovereign
    decision-making.


    Subsequently, the book investigates two avenues to further develop and expand
    thinking about blockchain governance. The first avenue is centered around the
    concept of *alegality* taken from legal philosophy (chapter 6), which implies
    that legal orders have distinct boundaries that can be transgressed. The book
    argues that blockchain technology sometimes transgresses the boundaries of existing
    legal orders. Although regulators still have the means to address these transgressions
    in many cases (e.g., through enforcement of existing law or amendments to the
    law), certain alegal acts put into question how a legal order draws the legal/illegal
    boundary. The second avenue addresses the pivotal political concept of “legitimacy”
    (chapter 7), which in recent years has also become a focal point in discussions
    about blockchain governance. The book lays out a comparative discourse, distinguishing
    between the concepts of social constitutionalism and digital constitutionalism
    and providing a new concept that has been referred to as “blockchain constitutionalism.”
    It discusses several understandings of legitimacy in this context, ranging from
    a thin understanding of “legitimacy as legality” to a thicker understanding of
    legitimacy as including substantive concerns, such as human rights and environmental
    justice.


    The book concludes by laying out possible futures for blockchain governance (chapter
    8). In light of the potential fields of application of blockchain technology,
    it investigates possible legal or regulatory regimes that might be developed to
    support or suppress the technology as well as possible future configurations of
    blockchain governance. As it draws to a close, it is our hope that the book will
    have persuaded the reader to think about the ways in which legal and political
    theory on the one hand, and blockchain governance on the other, can enrich one
    another. This might turn out to be of great importance, once the speculative blockchain
    hype dies out and the technology becomes part of the infrastructure of our everyday
    lives and politics.


    # Chapter 2: Blockchain


    > A specter is haunting the modern world, the specter of crypto-anarchy.

    >

    > —Timothy May, *Crypto-Anarchist Manifesto*


    ## Cash for Eternity


    “Who wants to live forever?” Queen’s evocative song echoes through the centuries,
    for humans have always been obsessed with the prospect of immortality. Yet, the
    means at our disposal to achieve immortality have changed over time. In ancient
    civilizations, immortality could only be achieved by performing great deeds that
    would be remembered throughout history. This is the case, for instance, with Tutankhamun,
    Alexander the Great, and Qin Shi Huang, whose lives endure in the history books
    of modern societies. But this type of immortality does not satisfy everyone. Like
    the medieval alchemists, humans have long been searching for another form of immortality,
    more closely related to biological life. This type of immortality is not about
    being forever remembered but rather about extending biological life.


    Hannah Arendt argued that our understanding of time and history is intimately
    connected with our scientific understanding of the universe: an immeasurable expanse
    of moving particles, indifferent to human affairs.


    Hal Finney, an influential American software developer and cryptographer, pondered
    upon the prospects of immortality: “If you accept that it is possible in principle
    for medicine to give us an unlimited healthy lifespan, then all you really need
    to do is to live in a universe where that medical technology is discovered, and
    then avoid accidents.”


    Finney described the “self” as a lucky arrangement of billions of atoms in the
    brain. Hence, according to him, immortality simply requires preserving the brain’s
    hardwiring. In 2009, Finney was diagnosed with a deadly disease: amyotrophic lateral
    sclerosis (ALS). Confronted with his imminent death in 2014, he underwent a medical
    procedure where his body was cryogenized at a low temperature to ensure preservation
    of the tissues. His hope was that if one day the tissues’ physical conditions
    could be solved by medical science, they would be awakened so that they can continue
    living.


    Finney was part of the extropian movement.


    While cryogenics purported to preserve individual lives, extropians were also
    interested in sustaining a certain form of collective life. They believed that
    technological progress and innovation could only flourish in a free market environment,
    liberated from hierarchic control. As claimed by More, “societies with pervasive
    and coercively enforced centralized control cannot allow dissent and diversity,”
    as “no group of experts can understand and control the endless complexity of an
    economy and society composed of other individuals like themselves.”


    These ideas were shared with an adjacent and somewhat overlapping movement: the
    *cypherpunks*—a loose group of anarchists, libertarians, cryptographers, and software
    developers interested in exploring the use of cryptography to protect individual
    privacy and online liberties. Like the extropians, the cypherpunks were fiercely
    antigovernment and regarded centralized institutions as the source of all worldly
    corruption. The prominent cypherpunk Timothy C. May wrote in the *Crypto-Anarchist
    Manifesto*, back in 1989:


    > A specter is haunting the modern world, the specter of crypto anarchy. Computer
    technology is on the verge of providing the ability for individuals and groups
    to communicate and interact with each other in a totally anonymous manner. Two
    persons may exchange messages, conduct business, and negotiate electronic contracts
    without ever knowing the true name, or legal identity, of the other. . . . Just
    as the technology of printing altered and reduced the power of medieval guilds
    and the social power structure, so too will cryptologic methods fundamentally
    alter the nature of corporations and of government interference in economic transactions.


    The saying goes that death and taxes are the two things you can’t escape, yet
    that is precisely what the extropians were trying to do.


    Thus, while the extropians looked for ways to extend life, the cypherpunks focused
    on letting go of governmental institutions or any other corruptible intermediary
    authority. Despite their different ambitions, both groups were concerned with
    improving individual and collective autonomy. What they had in common was the
    need for a shared record of accounts, an uncensorable, immutable, and immortal
    digital currency not controlled by any single individual or group and that could
    persist for generations, independently of any single institutional framework.


    ## Digital Cash

