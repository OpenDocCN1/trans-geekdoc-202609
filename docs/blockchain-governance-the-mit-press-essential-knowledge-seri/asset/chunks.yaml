- raw: 'As Wood readily concedes, he was not the first to coin the term alegality
    or develop it conceptually. Legal scholars have developed the concept of alegality
    to argue how an act can be irreducible to the legal/illegal binary that is maintained
    by the state apparatus. Hamzić describes this as the capacity to “exist and act
    in the interstices, or perhaps beyond or outside, the dominant modes of . . .
    legal production.”


    To better appreciate this line of thinking, it is necessary to understand what
    Lindahl means by legal order. He defines legal orders as “institutionalised and
    authoritatively mediated collective action.”


    According to Lindahl, legal orders possess temporal, spatial, material, and subjective
    boundaries that establish the distinction between legality and illegality.


    Laws are temporally bounded in the sense that they specify *when* acts can be
    done and when they cannot. This is most clearly seen in the general legal principle
    that laws should only apply prospectively, not retrospectively. Relatedly, despite
    laws striving to be “future proof,” in reality they cannot account for all possible
    future acts and developments. Thus, an alegal act that would breach the temporal
    boundary of the law would be one that initiates something new and unprecedented
    in that legal order—such as the creation of Bitcoin or the founding and recognition
    of Bitcoinica as a network state.


    The spatial boundaries of the law demarcate the physical territories *where* acts
    can and cannot be carried out. These territories may be contiguous to the territorial
    boundaries of a nation state or may be archipelagos distributed across the globe,
    subject to the authority of a multinational corporation.


    Material boundaries of the law circumscribe *what* acts can be carried out in
    a certain time and place and are usually articulated as sets of rights and obligations.


    Finally, the law’s subjective boundaries set *whose* acts can be permitted or
    sanctioned. A citizen is the most obvious example of someone who can be subject
    to a legal order, but even the nature of their status may differ based on their
    residence or criminal record. If a citizen is resident outside of their home country
    or possesses a criminal record, they may be excluded from certain rights of citizenship,
    like standing in a national election for an official post. These subjective boundaries
    can be challenged by an alegal act that questions existing prohibitions or restrictions
    on who can act in a given context, with the intention of changing the terms of
    these prohibitions or restrictions. The storied legacy of brave slaves who participated
    in the slavery abolition movement—at great risk to their own lives—is a powerful
    example of people taking actions to have their personality and subjecthood recognized
    by an existing legal order.


    Alegal acts not only test boundaries but also affirm the role of boundaries as
    *limits* of a legal order, limits between the “collective self and other-than-self.”


    Boundary transgression occurs through three broad categories of alegal acts. First,
    there are acts that are alegal in Wood’s sense in that they are practically not
    possible to include within a legal order, for example, the biological process
    of thinking. Second, there are alegal acts that are intelligible to a legal order
    and can be addressed through legal reform to adjust the law’s boundaries. For
    instance, copyright law reform can tackle digital piracy. Third, there are alegal
    acts that create fault lines because they are unintelligible to an existing legal
    order; attempting to incorporating them would require a wholesale overhaul of
    both the law’s boundaries and norms. Blockchain systems provide an illuminating
    example of the latter two categories, which will be discussed more fully in the
    next section.


    ## Destructive Golems


    To what extent do blockchain networks facilitate alegal acts that create fault
    lines? Initially, the answer seems to be that blockchain networks are not alegal
    in this sense if we consider the actions of some powerful actors in blockchain
    networks. Intermediaries, like centralized cryptocurrency exchanges, have been
    subject to significant legal and regulatory action. This is partly because these
    intermediaries, operated by corporations and executives, can readily be brought
    within a state’s jurisdiction (e.g., through injunctions, arrests), and partly
    because they engage in activities that are already governed by the law (e.g.,
    money transmitter regulations). Their actions can therefore more readily be classified
    as being legal or illegal, as can be seen in the spate of litigation against various
    crypto exchanges over the years, from Mt. Gox to FTX.


    Similarly, ICOs and other broad-based fundraising schemes have long been a feature
    of blockchain networks. These ICOs have typically been organized by a centralized
    entity and involve activities that are analogous to fundraising schemes of the
    past. Thus, when allegations of securities fraud or other criminal acts arise,
    it is trivial to frame charges and pursue legal action against them. The application
    of the long-standing *Howey* test in the United States—derived from a case concerning
    whether the sale of interests in an orange grove amounted to an investment contract—to
    contemporary token offerings, to ascertain if they are investment contracts and
    thus unregistered securities, indicates that regulators and courts can pierce
    through the technical and financial complexities of a case to grasp the economic
    realities of a transaction. In other words, merely using new packaging for an
    investment does not qualify it as being an alegal act, as legal interpretation
    can be used to reinforce the law’s boundaries.


    Even more elaborate crypto businesses, like Celsius Network, which pays interest
    to users who deposit cryptocurrencies with them, fail to be alegal in this third,
    stricter sense as they have centralized operators. These operators can be charged
    with crimes that can be committed in a wide and open-ended variety of ways. For
    instance, in 2022, Celsius Network’s operator was charged with grossly mismanaging
    funds and fraud for artificially setting the price of its native token and not
    managing risk properly. Because of this, users have not been able to withdraw
    their deposited cryptocurrencies but, as of November 2023, a reorganization plan
    has been confirmed by the US Southern District of New York Bankruptcy Court pursuant
    to which account holders will (according to Celsius) eventually receive about
    USD 2 billion. Some of the allegations made about businesses like Celsius Network
    and FTX include activities already regulated by well-established bodies of law.
    While illegal acts can, in some instances, be alegal if they strive to change
    the boundaries of a legal order, this intention is not present in many of these
    cases. In short, many of the activities popularly associated with the running
    of a blockchain-based system, from initiating an ICO to operating a crypto exchange,
    do not create fault lines.'
