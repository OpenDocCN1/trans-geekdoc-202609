    ## 第 3 章 参考文献


    16. 16. Michael McGinnis, “理论与实践中的多中心治理：愿景维度与现实局限”（工作论文，印第安纳大学布鲁明顿分校政治学系，布鲁明顿，印第安纳州，2016
    年 2 月），第 4 页，[`dx.doi.org/10.2139/ssrn.3812455`](https://dx.doi.org/10.2139/ssrn.3812455)。


