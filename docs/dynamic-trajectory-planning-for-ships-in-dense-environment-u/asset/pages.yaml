    be defined: the actor-network, which assigns weight to each action, and the critic-network,
    which evaluates the value of the agent’s actions. Both networks have the same
    internal structure and the same number of inputs, namely, 3 hidden layers of 512
    fully connected neurons. The input size is determined by the number of'
