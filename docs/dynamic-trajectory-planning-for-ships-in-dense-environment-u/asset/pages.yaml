    # 6. Conclusion


    In this study, we demonstrate that using a collision grid within an agent''s observation
    horizon as an input structure enables the agent to navigate through dense environments
    and accomplish its objectives. The grid is created based on the agent''s observation
    horizon and is updated at each iteration to reflect changes in the surrounding
    objects. Additionally, the potential future movements of mobile objects are considered
    to evaluate the collision risks, allowing the agent to anticipate movements and
    ensure its safety throughout its journey. To train the agent, we employed the
    PPO learning algorithm, which has been proven effective in solving similar navigation
    problems. In a dense environment, the agent was trained to reach its goal while
    avoiding collisions with randomly behaving objects. The results indicate that
    this learning approach enabled our agent to develop a behavior that yielded outstanding
    performance and a low risk of collision with its environment.


    Having successfully overcome random behavior, the agent has acquired the ability
    to navigate safely in space while avoiding objects that may collide with it. During
    the evaluation phase, irrelevant episodes that did not represent the agent''s
    behavior were removed, but collisions with mobile objects still occurred. It was
    observed that in some instances, the agent was unable to make a decision to prevent
    collisions, such as when a ship changed course at the last moment, and the agent
    was physically incapable of reacting quickly enough to avoid impact. Additionally,
    collisions occurred when objects approached the agent too quickly for it to react.
    In general, collisions with the environment happened when the agent was unable
    to avoid them. However, the collision grid facilitated efficient implementation
    of COLREGs, enabling the agent''s behavior to be explained in situations where
    it may have been challenging to incorporate these rules into a complex reward
    function and ensure that they were accounted for.


    There is potential for the model to be improved to reinforce the agent''s behavior
    and enhance its realism. One possible improvement is to test the model on other
    training algorithms. It would also be relevant to make the model more robust and
    less sensitive to various adversarial attacks and potential data losses. Although
    the model has not experienced any data losses or sensor failures due to filling
    a whole grid square with a single point, such incidents could occur in real-world
    situations. As a result, additional sensors, such as LiDAR, could'
