    obtained at the end of the episode is considered. Although it is common to apply
    a modified reward to all observed states to accelerate learning and to evaluate
    certain states more accurately, it is not advisable in this study. The trajectory
    (time, speed, etc.) is not intended to be constrained too much, as it may lead
    to convergence towards dangerous states. Instead, the agent is taught to develop
    collision avoidance strategies even if it means taking longer paths.


    The first justification is that a collision grid is used to evaluate the states’
    value, which clearly delimits the danger zones with negative weights and the interesting
    zones with positive or zero weights. This evaluation will be reflected in the
    network’s updates, and the discounted reward will still assess the relevance of
    each transition leading to either a successful or a failed episode, even in the
    absence of a passive reward. Thus, a correlation can be made between the grid,
    its weights, and a discounted reward. The second justification is the complexity
    of constructing a passive reward function. It is difficult and ambiguous to determine
    the impact of each part of this function on the agent’s convergence towards its
    goal. For instance, if the objective is too far away, a relative objective is
    displayed at 50% of the horizon, which further complicates the passive reward
    function. In the absence of obstacles, it is impossible to differentiate between
    a positive action towards the goal and a neutral or negative one when the grid
    remains unchanged. Thus, for such a transition, the reward becomes ambiguous,
    and providing a fixed reward would not align with the actual occurrence. Attempting
    to resolve this ambiguity by relying on the agent’s heading is also insufficient
    since the rate of turn may not change the relative objective from one box to another.
    Even if a good evaluation of goal achievement was determined, it would still be
    necessary to assess the distance, potential collisions, and any violation of COLREG
    to establish a global reward. Since this information has already been considered
    in the grid at each step, including it in the reward would be redundant. Moreover,
    the weighting of different components is a significant disadvantage of passive
    rewards, and it is challenging to determine the appropriate weight for each component.
    The process of weighting the reward can be difficult as it involves a significant
    amount of hyperparameterization. Additionally, it may only be applicable to the
    particular problem at hand, making it difficult to reproduce with any modifications
    to the environment or actions taken by the agent. As a result, the agent can only
    receive a reward that is a constant value among three possibilities, which is
    determined by the type of collision. For instance, if the agent collides with
    the goal, it receives a reward of +5. However, if it collides with an obstacle
    or border, it receives a reward of −1, and in all other situations, the reward
    is 0. The equation for the reward function is shown in Eq. (4), and at the end
