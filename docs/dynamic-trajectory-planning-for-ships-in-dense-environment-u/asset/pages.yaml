  md: '# Dynamic trajectory planning for ships in dense environment using collision
    grid with deep reinforcement learning


    R. Teitgen a,b,*, B. Monsuez a, R. Kukla b, R. Pasquier c, G. Foinet c


    a ENSTA Paris, 828 Bd des Maréchaux, 91120, Palaiseau, France

    b Naval Group, Technopole de la Mer, 83190, Ollioules, France

    c SIREHNA, Technocampus Ocean, 44340, Bouguenais, France


    # ARTICLE INFO


    +   Keywords:

    +   - Reinforcement learning

    +   - Collision grid

    +   - Collision avoidance

    +   - COLREGs

    +   - Proximal Policy Optimization


    # ABSTRACT


    In areas with high maritime traffic, ship safety is of utmost importance when
    validating autonomous navigation models. While exact methods exist for specific
    situations, they are inadequate in a global context. This study employs an approximate
    deep reinforcement learning method to solve the navigation problem in a dense
    environment with numerous static and moving obstacles. Our model prioritizes ship
    integrity by enabling the agent to dynamically adapt its kinematics to its surroundings
    to reach a designated goal without colliding with obstacles. To achieve this,
    we incorporate collision grids in the form of danger zones as input to our model
    and train it using the proximal policy optimization algorithm. Additionally, we
    propose implementing the International Regulations for Preventing Collisions at
    Sea (COLREGs) in the collision grid as these navigation rules are necessary to
    obtain realistic behavior of an autonomous agent. The agent''s performance is
    evaluated on a set of randomly generated scenarios operating in an environment
    complexity similar to the one used during training. These tests demonstrate that
    this type of data structure allows a trained agent to navigate in a dense environment
    while adhering to the COLREGs with a success rate of 94.69%.


    # 1. Introduction


    The primary goal of a ship is to ensure its safety. According to Baker and McCafferty
    (2005), human errors account for 80% of collisions and, therefore, there is a
    growing interest in developing autonomous navigation systems to perform parts
    of the navigation tasks. In dynamic environments where quick actions are required,
    autonomous systems must make effective decisions to ensure the safety of the ship.


    Previous research, such as Statheros et al. (2008), has already shown that autonomous
    ship navigation is possible. To make relevant decisions, these systems had to
    consider various factors, including the COLREGs, ship properties, intentions,
    environment, and neighboring objects. These systems must solve several sub-problems,
    such as collision avoidance models that predict the trajectories of surrounding
    objects to build safe trajectory and avoid danger zones. However, the complexity
    of the environment and the number of objects make it challenging to consider all
    the objects, and exact methods struggle to cope with less ordinary situations.


    In this context, we decided to use reinforcement learning (RL) (Sutton and Barto,
    2018; Kaelbling et al., 1996) as an approximate method to improve existing algorithms.
    RL is a technique that enables an agent


    to learn how to navigate an environment by receiving rewards based on its actions
    and improving its behavior over time by maximizing the rewards it obtains. RL
    has been proven effective in playing video games such as GVGAI (Torrado et al.,
    2018) or Atari (Kaiser et al., 2019), mastering chess (Silver et al., 2017), performing
    network optimization (Luong et al., 2019), or cooperative robot navigation (Hu
    et al., 2020). Training algorithms have also evolved over time, with the Deep
    Q Neural Network (DQN) method taking over Q-learning by using neural networks
    to generalize the states of an environment with too many states to use a Q-table.
    Another significant development in RL is the Asynchronous Actor–Critic (A3C) algorithm
    (Mnih et al., 2016), which employs multiple agents simultaneously to optimize
    a global neural network. The Trust Region Policy Optimization (TRPO) (Schulman
    et al., 2015) can use a large number of experiments to improve behavior without
    compromising performance by optimizing the variation between the old and new policies.
    The Proximal Policy Optimization (PPO) (Schulman et al., 2017) is an enhanced
    version of TRPO, which simplifies the estimation of the gain of a new policy compared
    to the old one without reducing performance. In this paper, we will use the PPO
    method as the training algorithm. PPO has proven'
