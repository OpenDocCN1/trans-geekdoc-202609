    # 5. Model validation


    # 5.1. Agent training


    The generation of our model will occur in two phases. The first phase involves
    the training of our model, while the second phase involves the evaluation of its
    performance. The training process will comprise one million episodes, each with
    a maximum duration of 300 time steps. The total training time will be approximately
    52 h, which primarily depends on the number of squares in the grid and the number
    of obstacles in the environment. At the start of each episode, the agent’s starting
    position, objective, and various obstacles in the environment will be randomly
    initialized. Thus, the learning environment will not remain static, and the parameters
    of the environment are summarized in Table 1. During both the learning and evaluation
    phases, at the start of each new episode, the position of all obstacles, as well
    as the rudder angle and direction for moving obstacles, are randomly reset, along
    with the position of the ship piloted by the agent and its target. This randomization
    of the environment allows us to observe the agent’s ability to generalize its
    policy and perform well in previously unseen scenarios. The size of the environment
    is limited to 350 × 350 meters, with a maximum of three obstacles of each type.
    This constraint is expected to accelerate the learning process by enabling faster
    convergence and shorter episode durations. Additionally, limiting the number of
    obstacles should help the agent learn to avoid them without solely focusing on
    obstacle avoidance. Finally, since the input data is limited to a grid with a
    horizon, the size of the environment does not significantly impact the model’s
    performance. While we can test the model on environments with varying sizes and
    obstacle densities, a restricted size during learning should result in faster
    convergence, albeit at the expense of partial observability of the environment
    by the agent.


