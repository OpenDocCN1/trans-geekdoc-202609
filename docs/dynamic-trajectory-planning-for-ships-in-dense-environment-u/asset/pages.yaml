    Fig. 3. Schematic diagrams of the four implemented Collision Regulations (COLREGs)
    when two ships are within each other''s line of sight. The ship controlled by
    our agent is denoted as “Ego”, and the arrow indicates the path that the agent
    must follow to comply with the observed COLREG.


    to note that unlike our agent, the other ships in the environment do not adhere
    to the COLREGs and have random behaviors, meaning some maneuvers may not occur
    during this stage of the study.


    To implement the COLREGs in our agent''s behavior, there are various methods at
    our disposal. One way is to constrain the agent''s actions at the operational
    level, meaning we block actions that would lead to a violation of the COLREGs
    or favor actions that lead to a safer trajectory. Another method is to modify
    the reward function by changing the reward the agent receives from observing the
    environment at each state change. Although there is a rich literature on implementing
    the COLREGs in this way, we decided against it. Tuning the reward function can
    be complicated and could introduce biases that weaken the learning process or
    even produce erroneous results. Instead, we considered modifying the agent''s
    observation structure by incorporating the various COLREGs summarized in Fig.
    3 into the inputs. In this figure, (a) and (b) represent the “crossing” rule where
    the rule in force is “priority to starboard”: if two ships are crossing paths,
    the ship approaching from the starboard side maintains its course, and the ship
    on the port side must alter its course to pass behind the prioritized ship or
    turn around. Rule (c) is the “head-on” rule: when two ships approach each other
    from opposite directions, they both turn to starboard to pass each other on their
    port side. Lastly, rule (d) is the “overtaking” rule: if a ship intends to pass
    another ship and has sufficient speed, it must follow a parallel course or position
    itself far enough upstream of the overtaken ship so that the latter does not have
    to modify its course or speed. The figures presented here are intended only to
    illustrate what will be implemented later. Such maneuvers must be set up well
    in advance to limit changes in trajectory whenever possible.


    The proposed approach aims to implement the COLREGs within the collision grid
    to address multiple constraints. Firstly, by not integrating the COLREGs into
    the reward function, we can handle each piece of information individually, rather
    than merging observations into a reward that is typically a sum of sub-rewards.
    This could cause the agent to overlook a COLREG if other information overrides
    the corresponding sub-reward with a positive sub-reward. Incorporating these rules
    into the inputs also brings clarity to the different actions the agent will take.
    As we enhance the observations with an overlay of information,


    the agent is constrained upstream of its decision-making, rather than downstream.


    To implement each COLREG, we predict the future positions of ships to alter where
    the agent can navigate. By assigning weights to the cells associated with the
    projected tracks, we can affect the agent''s perception of the environment and
    its danger level. For instance, let us assume an agent has learned that entering
    a weighted area results in a negative reward. If the same weight is assigned to
    the projected path of a neighboring ship, the agent will perceive an obstacle
    line ahead and avoid these coordinates, even if they are just potential dangers.
    This is how the COLREGs are implemented by adjusting the weights linked to the
    ships'' projections, enabling the agent to learn how to recognize safe and hazardous
    areas while adhering to the navigation rules.


    Fig. 4 illustrates the application of the COLREGs to the observations after modifying
    the weights. In the general case, the weight of each projection decreases linearly
    from the initial position of the ship, meaning that the danger decreases the further
    away from the obstacle. This applies to the three directions of the different
    projections d for a ship n. For the ith projection cell, the intensity of the
    danger zone is calculated using the equation f_{n,dir20-20}(i)=0.85^i. For the
    “crossing” situation (a), where the agent does not have priority, all ships appearing
    in the upper right part of the agent''s horizon, i.e. within the interval [0°,
    90°], should be taken into consideration. This first condition ensures that only
    ships in a position where they have priority are considered. The second condition
    is that the ship can potentially collide with the agent. If the intersection between
    the two paths is in front of the agent, i.e. under the horizon and in an angle
    included in the interval [0°, 180°], we assign a maximum intensity of 1 to each
    projection. This creates zones of absolute danger in front of the agent, resulting
    in f_{n,dir0-20}(i)=1. In the “crossing” case (b) where the agent has priority,
    we keep the initial weighting without reducing it to prevent the agent from taking
    riskier paths. Additionally, since the other ships have unpredictable intentions
    and do not respect COLREGs, the agent cannot ignore them. For the “head-on” rule
    (c), in case of crossing, the two ships must cross each other by their port side.
    The first step is to estimate whether the two ships are in a position to pass
    each other, and if so, the intensity of the danger zones concerned will be adapted.
    We check if their direction is opposite within a range of [−20°, +20°], which
    is calculated with Eq. (1) where dir is the direction of an object in degrees.
    If the result is in the interval [160°, 200°], we must also check that the position
    of the ship is in front of the agent, i.e. in the interval [0°, 180°]. If this
    condition is satisfied, then there is an intersection, and we modify the weights
    to minimize those on the port side of the obstacle ship and maximize those on
    the starboard side of the ship. This results in the following 3 equations: f_{n,dir0}(i)=0.85^i
    for the front projection, f_{n,dir20}(i)=0.7^i for the projection on the port
    side, and finally f_{n,dir-20}(i)=1 for the projection on the starboard side.
    Finally, the last COLREG “overtaking” (d) does not modify the initial weights
    because we want to be able to pass the overtaken ship without cutting its trajectory.


