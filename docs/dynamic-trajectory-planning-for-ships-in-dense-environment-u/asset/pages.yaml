    # ### 4.1. Simulator


    The simulator used for training the agent is a 2-dimensional space that measures
    $sizeMax \times sizeMax$ meters, where $sizeMax = 350$ m. The agent, which is
    a ship, operates in this environment with a variable direction expressed in degrees
    and a variable speed expressed in m s$^{-1}$. In each episode, a new objective
    is generated for the agent, which is a point in space that it must reach. The
    initial position of the agent and its objective are randomly generated, but we
    restrict the possibility of either element appearing too close to the edge. To
    ensure this, the coordinates $x$ or $y$ are generated within the interval $[20,
    sizeMax - 20]$ at the beginning of each episode. This constraint prevents episodes
    that are impossible to solve because the ship or the objective is generated within
    the hitbox boundaries. In this 2D space, there are two types of obstacles: static
    obstacles and moving obstacles. The position of static obstacles remains fixed
    throughout the episode. Moving obstacles have the same physical constraints as
    the agent but have no intention or objective. They follow a constant trajectory
    and have a probability of 5% of changing their heading at each time step. The
    behavior of these obstacles is not correlated to the agent and they can freely
    collide with or move away from it. If a moving obstacle touches an edge, it will
    reappear at a random position on the opposite edge. Collisions between obstacles
    or between an obstacle and a ship are ignored by the environment.


    We added dynamics to the agent’s behavior to make the simulator more realistic
    and incorporate constraints that affect moving objects. To achieve this, we used
    the first-order Nomoto model, as shown in Eq. (2), which provides an estimate
    of the rotation rate of the ship during maneuvers when it changes its heading.
    We modified this equation to apply it in discrete time to our simulator. The constants
    $K$ and $T$ in the equation affect the ship’s dynamics, where $T$ determines the
    stability of the rudder and $K$ changes the difficulty of turning the ship.


    $$\frac{\dot{r}(s)}{\delta(s)} = \frac{K}{1 + Ts} \tag{2}$$


