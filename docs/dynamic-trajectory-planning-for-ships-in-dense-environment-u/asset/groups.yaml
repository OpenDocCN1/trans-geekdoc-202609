    ```\n\n### 3.2. 避碰规则（COLREGs）的实现\n\n《国际海上避碰规则》（COLREGs）在 IMO（1972）中有总结，是一套旨在防止海上碰撞的规则。这些规则规定了船舶在不同环境中应如何行事，并要求使用灯光和声音信号或船舶控制等工具来限制与其他船舶碰撞的风险。它们是适用于所有类型船舶的国际规则，无论其用途或动力如何，以确保海上行为的一致性。然而，个别国家可根据自身视角对这些规则进行本地调整，以增强安全。完整的\
