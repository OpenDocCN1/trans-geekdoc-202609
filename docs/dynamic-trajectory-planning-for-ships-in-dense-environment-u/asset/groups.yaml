    \n要在我们的智能体行为中实现 COLREGs，有各种方法可供选择。一种方法是在操作层面约束智能体的行为，即阻止会导致违反 COLREGs 的行为，或倾向于产生更安全轨迹的行为。另一种方法是修改奖励函数，即改变智能体在每个状态变化时观察环境所获得的奖励。尽管以这种方式实现\
