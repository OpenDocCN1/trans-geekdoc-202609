    avoid a collision rather than crossing to starboard and then resuming its course.
    In frame 4, there are no more obstacles to alter its trajectory, so the agent
    reaches its goal without any further dodging maneuvers.


    In the second scenario, one can observe that in frame 1, the agent has to maneuver
    because the random generation of its direction is opposite to its objective. Thus,
    it tries to place itself on course. Frame 2 shows that the agent encounters many
    collision risks and operates accordingly. First, a ship approaches the agent from
    starboard, so it deviates slightly to starboard to pass behind it with a safety
    margin. Afterward, it meets another ship that is spiraling, making it difficult
    to attempt a starboard maneuver, so it turns drastically to port, almost making
    a half-turn. Frame 3 shows the rectification of its trajectory due to the previous
    maneuver, and it finds its course. In the last frame, due to the absence of collision
    risk, it maintains its course almost constantly to reach its objective.


    In this example, Fig. 9 demonstrates how the agent reacts and respects each COLREG.
    The agent starts from a large red dot and must reach a green dot, with its trajectory
    depicted in yellow and its last position represented by a small red dot. A blue
    ship appears on the horizon and causes the activation of a COLREG. The initial
    positions of the moving obstacle, the agent, and its goal were manually set to
    force the activation of the desired COLREG. In this case, the obstacle ship maintains
    a fixed speed and cannot change its direction. These examples do not validate
    that the COLREGs will be respected in all situations, but demonstrate that the
    proposed implementation is consistent. In the “Head-on” case, we observe that
    the agent changes its course to starboard to avoid the oncoming ship. In the “Overtaking”
    case, the agent attempts to overtake the ship, but realizes that it cannot place
    itself too early in front of the overtaken ship, so it changes its trajectory
    to move further away from the ship. In the “Crossing” case, where both priority
    situations are proposed, we observe that the agent does not maneuver too much
    when it has priority. However, it gets closer to the other ship, probably due
    to the fact that the target was no longer in its axis, and it attempted to turn
    to recalibrate but was too far away. The graph of the average episode duration
    shows that the agent tries to reach the target as quickly as possible, and a recalibration
    of its direction seems consistent with this but takes precedence over safety.
    Finally, the last case is when the agent does not have priority, and we can observe
    that it turns 90° to ensure that the other ship passes before continuing to its
    goal. Further work can be done to validate the agent’s behavior in more complex
    and diverse situations.


    ## 6. Conclusion


    In this study, we demonstrate that using a collision grid within an agent''s observation
    horizon as an input structure enables the agent to navigate through dense environments
    and accomplish its objectives. The grid is created based on the agent''s observation
    horizon and is updated at each iteration to reflect changes in the surrounding
    objects. Additionally, the potential future movements of mobile objects are considered
    to evaluate the collision risks, allowing the agent to anticipate movements and
    ensure its safety throughout its journey. To train the agent, we employed the
    PPO learning algorithm, which has been proven effective in solving similar navigation
    problems. In a dense environment, the agent was trained to reach its goal while
    avoiding collisions with randomly behaving objects. The results indicate that
    this learning approach enabled our agent to develop a behavior that yielded outstanding
    performance and a low risk of collision with its environment.


    Having successfully overcome random behavior, the agent has acquired the ability
    to navigate safely in space while avoiding objects that may collide with it. During
    the evaluation phase, irrelevant episodes that did not represent the agent''s
    behavior were removed, but collisions with mobile objects still occurred. It was
    observed that in some instances, the agent was unable to make a decision to prevent
    collisions, such as when a ship changed course at the last moment, and the agent
    was physically incapable of reacting quickly enough to avoid impact. Additionally,
    collisions occurred when objects approached the agent too quickly for it to react.
    In general, collisions with the environment happened when the agent was unable
    to avoid them. However, the collision grid facilitated efficient implementation
    of COLREGs, enabling the agent''s behavior to be explained in situations where
    it may have been challenging to incorporate these rules into a complex reward
    function and ensure that they were accounted for.


    There is potential for the model to be improved to reinforce the agent''s behavior
    and enhance its realism. One possible improvement is to test the model on other
    training algorithms. It would also be relevant to make the model more robust and
    less sensitive to various adversarial attacks and potential data losses. Although
    the model has not experienced any data losses or sensor failures due to filling
    a whole grid square with a single point, such incidents could occur in real-world
    situations. As a result, additional sensors, such as LiDAR, could be integrated
    to compensate for any information losses or improve the collision grid’s informational
    quality. The hitboxes for detecting possible collisions could be refined to better
    adapt to the trajectories of moving obstacles. Furthermore, the values within
    the collision grid could be propagated to their surroundings with weighted intensity,
    so that areas too close to ships are not considered safe by the agent. An evaluation
    of the model’s performance with actual data from AIS could also be considered
    to validate the agent’s maneuvers in real conditions and compare the approaches
    of different autonomous ships under the same conditions.


