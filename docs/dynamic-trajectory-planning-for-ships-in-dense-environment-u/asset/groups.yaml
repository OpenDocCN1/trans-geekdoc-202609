  mdcn: "\n# 基于深度强化学习的碰撞网格在密集环境中船舶动态轨迹规划\n\nR. Teitgen a,b,*, B. Monsuez a, R. Kukla\
    \ b, R. Pasquier c, G. Foinet c\n\na ENSTA Paris, 828 Bd des Maréchaux, 91120,\
    \ Palaiseau, 法国  \nb Naval Group, Technopole de la Mer, 83190, Ollioules, 法国 \
    \ \nc SIREHNA, Technocampus Ocean, 44340, Bouguenais, 法国\n\n## 文章信息\n\n- 关键词:\n\
    \  - 强化学习\n  - 碰撞网格\n  - 碰撞避免\n  - COLREGs\n  - 近端策略优化\n\n## 摘要\n\n在海运交通繁忙的区域，在验证自主导航模型时，船舶安全至关重要。虽然针对特定情况存在精确方法，但在全局背景下它们是不够的。本研究采用近似的深度强化学习方法来解决在存在大量静态和移动障碍物的密集环境中的导航问题。我们的模型通过使智能体能够动态地根据周围环境调整其运动学，以在不与障碍物碰撞的情况下到达指定目标，从而优先考虑船舶完整性。为此，我们将碰撞网格以危险区域的形式作为模型的输入，并使用近端策略优化算法对其进行训练。此外，我们建议在碰撞网格中实施《海上避碰规则》（COLREGs），因为这些航行规则对于获得自主智能体的现实行为是必要的。智能体的性能是在一组随机生成的场景上进行评估的，这些场景运行的环境复杂程度与训练期间使用的环境相似。这些测试表明，这种类型的数据结构使训练有素的智能体能够在遵守\
    \ COLREGs 的同时在密集环境中导航，成功率为 94.69%。\n\n## 1. 引言\n\n船舶的主要目标是确保其安全。根据 Baker 和 McCafferty（2005）的研究，人为错误占碰撞的\
    \ 80%，因此，人们对开发自主导航系统以执行部分导航任务的兴趣日益增长。在需要快速行动的动态环境中，自主系统必须做出有效的决策以确保船舶的安全。\n\n\
    先前的研究，例如 Statheros 等人（2008），已经表明自主船舶导航是可行的。为了做出相关决策，这些系统必须考虑各种因素，包括 COLREGs、船舶特性、意图、环境和邻近物体。这些系统必须解决几个子问题，例如预测周围物体的轨迹以构建安全轨迹并避免危险区域的碰撞避免模型。然而，环境的复杂性和物体的数量使得考虑所有物体具有挑战性，而精确方法难以应对不太常见的情况。\n\
    \n在此背景下，我们决定使用强化学习（RL）（Sutton and Barto, 2018; Kaelbling et al., 1996）作为一种近似方法来改进现有算法。RL\
    \ 是一种技术，使智能体能够通过根据其行动获得奖励并通过最大化获得的奖励随着时间的推移改善其行为来学习如何在环境中导航。RL 已被证明在玩视频游戏（如 GVGAI（Torrado\
    \ et al., 2018）或 Atari（Kaiser et al., 2019））、掌握国际象棋（Silver et al., 2017）、执行网络优化（Luong\
    \ et al., 2019）或协作机器人导航（Hu et al., 2020）方面有效。训练算法也随着时间的推移而发展，其中深度 Q 神经网络（DQN）方法通过使用神经网络来概括状态过多而无法使用\
    \ Q 表的环境的状态，从而取代了 Q 学习。RL 中的另一个重要发展是异步 Actor-Critic（A3C）算法（Mnih et al., 2016），它同时使用多个智能体来优化全局神经网络。信任区域策略优化（TRPO）（Schulman\
    \ et al., 2015）可以通过优化旧策略和新策略之间的变化，在不影响性能的情况下使用大量实验来改进行为。近端策略优化（PPO）（Schulman et\
    \ al., 2017）是 TRPO 的增强版本，它简化了与旧策略相比新策略增益的估计，而不会降低性能。在本文中，我们将使用 PPO 方法作为训练算法。PPO\
    \ 已证明在到达目标或与障碍物碰撞之前采取行动。相对目标被放置在连接智能体位置与目标精确位置的线段上，位于视距的中程位置。该位置是基于在 10% 到 100%\
    \ 范围内变化的位置进行的实验确定的，以找到最佳点。实验表明，如果位置离智能体太近，智能体对周围障碍物不够谨慎，只专注于到达目标。这导致模型学会了到达目标，但碰撞率高于可接受的百分比。当位置离视距太近时，会出现几个问题。首先，如果位置在\
    \ 90% 到 100% 之间，由于网格构造不允许对观测圆进行完美铺砌，目标可能会从观测中消失。如果一个物体没有被网格单元覆盖，即使它在视距之下，也不会被考虑。观察到的第二个问题是，离圆心越远，相同距离上的铺砌方格数量越多。在相对目标可能出现的视距\
    \ 90% 处，方格数量将比视距 50% 处更多。这种增加导致学习复杂性更大，因为需要处理的信息更多。将相对目标放置在中距离，在考虑周围障碍物和追求目标之间取得了平衡，从而提高了智能体的整体性能。\n\
    \n我们的智能体必须考虑的几条信息包括碰撞点。首先，我们必须考虑环境的边界以及静态障碍物。智能体将把边界，或“墙”，感知为其无法进入的绝对危险区域。静态障碍物是空间中的不动点，将由一个点表示。移动障碍物也很重要，将不仅由其在给定时间的位置表示，还将由其在三个不同方向\
    \ 0°、−20°、+20° 的下一个潜在位置表示。然而，只有满足 n mod 3 = 0 的位置才会被保留，以防止碰撞网格生成算法过载。可能的碰撞点集合仅在其位置在视距内或等于视距时才会被考虑。此外，我们决定在网格上将智能体定位在\
    \ [0,0]，方向为 0°，视距内的其他物体的相对位置和方向将根据智能体的位置重新计算。因此，智能体只能使用观测视距内的空间点，并且不知道其他物体的方向、速度或轨迹意图。换句话说，轨迹外推不被视为真实意图，而是线性预测。\n\
    \n神经网络接收来自雷达式网格的输入数据。Boschian 和 Pruski（1993）曾研究过使用网格表示环境的方法，他们提出了一种使用网格表示机器人二维交互空间的方法。我们的工作将这种方法扩展到包括动态可适应的网格。Elfes（1989）也提出了使用网格进行自动船舶控制的路径规划解决方案，用于从机器人传感器创建占用网格，该网格可通过评估安全和危险区域用于轨迹规划算法。此外，Kim\
    \ 等人（2014）使用 Theta* 算法根据网格地图确定船舶的最佳路径。Woo 和 Kim（2020）改编了占用网格的概念，用于使用 RL 的船舶导航。他们将观测空间分为三个部分，每个部分都是用于路径跟踪、固定障碍物和移动障碍物的网格。这种方法允许使用\
    \ CNN 对信息源进行单独处理，然后再合并在一起。\n\n碰撞网格是基于智能体所做的所有观测生成的。智能体的圆形观测视距被划分为大小相等的正方形。每个正方形的状态是根据填充坐标确定的，填充坐标是正方形的边缘。如果任何元素落在正方形内，其状态将被更改。正方形的大小是在为智能体提供准确信息和生成网格的计算性能之间权衡确定的。具有大正方形的网格可能会导致精度损失，因为放置在正方形内的任何船舶都会导致整个正方形被填满。另一方面，具有小正方形的网格会增加输入数据的大小，并使算法收敛花费更长时间。因此，对于半径为\
    \ r_h = 120 m 的观测视距，选择了边长为 d_c = 15 m 的正方形，从而得到包含 208 个正方形的网格。诸如环境中物体的碰撞区域或船舶未来位置的间距等附加约束可以添加到铺砌过程中。\n\
    \n为观测视距生成完美的网格是不可行的，尤其是在使用大正方形时。此外，只有当视距直径与正方形长度的比率为偶数整数时，才能实现对称网格。为了生成网格，我们从左下边缘开始（即坐标\
    \ [−r_h, −r_h]），从左到右、从下到上移动，步长等于正方形的大小。如果正方形的中心位于圆的区域内，则该正方形被包含在网格中。圆的填充率可能会根据正方形大小而变化。生成网格的算法在算法\
    \ 1 中给出。\n\n```\nAlgorithm 1 Generating the grid\nGrid = []\nr_h ← horizon\nd_c\
    \ ← sizeof square\ni ← −r_h\nwhile i < r_h do\n  j ← −r_h\n  while j < r_h do\n\
    \    if euclidean(0, i + d_c/2, 0, j + d_c/2) < r_h then\n      Grid.append([i,\
    \ j])\n    end if\n    j ← j + d_c\n  end while\n  i ← i + d_c\nend while\n```\n\
    \n网格在实验开始时构建，并在环境状态每次变化时重置为 null 值。然后由环境生成的每个物体都会被处理并映射到相应的网格正方形（如果它在观测范围内）。此信息存储在表“Objects_environment”中，其中表的每个索引都是一个子数组，包含三元组\
    \ x_i, y_i, weight_i，其中 i 是表的索引，x、y 是坐标，weight 表示正方形的吸引力水平。较高的权重表示智能体到达该正方形的兴趣更大，而较低的权重表示更大的危险。目标被赋予权重\
    \ 1，墙壁和静态物体被赋予权重 0.9，船舶的权重为 0.8，其线性预测在预测的每个时间步的权重为 −0.8×0.85^j，其中 j 表示时间步。该加权应用于反映船舶未来位置的锥体。锥体中权重的强度取决于与初始位置的距离，随着距离原点的增加，强度减小。锥体是通过将未来船舶位置投影到三个方向创建的，即方向\
    \ dir_n + [0°、+20°、−20°] 的修改，其中 dir_n 表示船舶 n 的航向（以度为单位）。这些投影之间的区域不需要加权，因为假设智能体不会尝试进入锥体中的空隙。[-20°、+20°]\
    \ 的振幅还使智能体能够预见移动障碍物轨迹的未来变化，从而提前适应潜在变化。基于物体位置填充网格的过程可能计算密集，尤其是在使用视距上的循环时。为此，我们开发了算法\
    \ 3，它将物体坐标投影到正方形大小的最接近的倍数，以确定物体属于哪个网格正方形，同时考虑负位置。我们还在实验开始时生成一个名为 GridDict 的字典，其中包含网格的附加填充信息\
    \ for grid\n"
