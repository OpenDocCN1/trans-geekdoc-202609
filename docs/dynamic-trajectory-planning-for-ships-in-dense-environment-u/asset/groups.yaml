  - "[PAGE 2]\n\nactions before reaching the objective or colliding with an obstacle.\
    \ The relative objective is placed at mid-range to the horizon on the segment\
    \ connecting the agent's position to the exact position of the objective. This\
    \ position was determined based on experiments carried out with positions varying\
    \ from 10% to 100% of the range, to find the optimal point. The experiments showed\
    \ that if the position is too close to the agent, the agent is not cautious enough\
    \ with surrounding obstacles and only focuses on reaching the objective. This\
    \ results in models that have learned to reach the goal, but with a collision\
    \ rate higher than an acceptable percentage. When the position is too close to\
    \ the horizon, there are several problems. Firstly, if the position is between\
    \ 90% and 100%, the objective may disappear from the observations due to the grid\
    \ construction, which does not allow perfect tiling of the observation circle.\
    \ If an object is not covered by a grid cell, even if it is below the horizon,\
    \ it will not be considered. The second problem observed is that the further away\
    \ from the center of the circle one goes, the greater the number of squares in\
    \ the paving at the same distance. There will be more squares at 90% of the horizon\
    \ where the relative target can appear than at 50% of the horizon. This increase\
    \ leads to larger learning complexity as there is more information to process.\
    \ Placing the relative objective at mid-distance strikes a balance between taking\
    \ into account surrounding obstacles and pursuing the objective, resulting in\
    \ better overall agent performance.\n\nThere are several pieces of information\
    \ that our agent must consider, including collision points. First, we must take\
    \ into account the environment's boundaries as well as static obstacles. The agent\
    \ will perceive the borders, or “walls”, as areas of absolute danger that it cannot\
    \ access. Static obstacles are immobile points in space and will be represented\
    \ by a single point. Moving obstacles are also important to consider and will\
    \ be represented not only by their position at a given time but also by their\
    \ next potential positions in three different directions 0°, −20°, +20°. However,\
    \ only positions that satisfy n mod 3 = 0 will be retained to prevent overloading\
    \ the collision grid generating algorithm. The set of possible collision points\
    \ is taken into account only if their position is within or equal to the horizon.\
    \ Furthermore, we decided to position the agent at [0,0] with a direction of 0°\
    \ on the grid, and the relative position and direction of other objects within\
    \ the horizon will be recalculated according to the agent's position. Therefore,\
    \ the agent can only use points in space within the observation horizon and has\
    \ no knowledge of the directions, speeds, or trajectory intentions of other objects.\
    \ In other words, trajectory extrapolations are not considered real intentions,\
    \ but rather linear predictions.\n\nThe neural network receives input data from\
    \ a radar-like grid. The use of grids to represent environments has been previously\
    \ studied by Boschian and Pruski (1993), who presented a method for representing\
    \ a robot's 2D interaction space using a grid. This approach is extended in our\
    \ work to include dynamically adaptable grids. Path planning solutions for automatic\
    \ ship control using grids have also been proposed by Elfes (1989) for creating\
    \ an occupancy grid from a robot's sensors, which can be used for trajectory planning\
    \ algorithms by evaluating safe and dangerous areas. Additionally, Kim et al.\
    \ (2014) used the Theta* algorithm to determine the optimal path for a ship based\
    \ on a grid map. Woo and Kim (2020) adapted the idea of an occupancy grid for\
    \ ship navigation using RL. They divided the observation space into three components,\
    \ each of which is a grid for path tracking, fixed obstacles, and mobile obstacles.\
    \ This approach allows for separate processing of information sources with CNN,\
    \ which can then be merged together.\n\nThe collision grid is generated based\
    \ on all the observations made by the agent. The circle-shaped observation horizon\
    \ of the agent is divided into equally sized squares. The status of each square\
    \ is determined based on the filling coordinates, which are the edges of the squares.\
    \ If any element falls within the square, its status is changed. The size of the\
    \ squares is determined by a trade-off between providing accurate information\
    \ to the agent and computational performance in generating the grid. A grid with\
    \ large squares could result in loss of accuracy, as\n\nany ship placed within\
    \ a square would result in the entire square being filled. On the other hand,\
    \ a grid with small squares would increase the size of input data and take much\
    \ longer for the algorithm to converge. Therefore, for an observation horizon\
    \ of radius r_h = 120 m, squares of side length d_c = 15 m were chosen, resulting\
    \ in a grid containing 208 squares. Additional constraints, such as the collision\
    \ zone of objects in the environment or the spacing of the ships' future positions,\
    \ can be added to the tiling process.\n\nGenerating a perfect grid for the observation\
    \ horizon is not feasible, especially with large squares. Additionally, a symmetrical\
    \ grid can only be achieved if the ratio of the diameter of the horizon to the\
    \ length of the square is an even integer. To generate the grid, we start from\
    \ the lower left edge (i.e., coordinates [−r_h, −r_h]) and move from left to right\
    \ and bottom to top with a step equal to the size of a square. If a square's center\
    \ lies within the circle's area, the square is included in the grid. The filling\
    \ ratio of the circle may vary depending on the square size. The algorithm for\
    \ generating the grid is presented in Algorithm 1.\n\n```\nAlgorithm 1 Generating\
    \ the grid\nGrid = []\nr_h ← horizon\nd_c ← sizeof square\ni ← −r_h\nwhile i <\
    \ r_h do\n  j ← −r_h\n  while j < r_h do\n    if euclidean(0, i + d_c/2, 0, j\
    \ + d_c/2) < r_h then\n      Grid.append([i, j])\n    end if\n    j ← j + d_c\n\
    \  end while\n  i ← i + d_c\nend while\n```\n\nThe grid is constructed at the\
    \ beginning of the experiment and is reset to null values at every change of the\
    \ environment state. Every object generated by the environment is then processed\
    \ and mapped to the corresponding grid square (if it lies within the observation\
    \ range). This information is stored in the table “Objects_environment”, where\
    \ each index of the table is a sub-array containing a triplet x_i, y_i, weight_i,\
    \ where i is the index of the table, x, y are the coordinates and weight represents\
    \ the level of attractiveness of the square. A higher weight indicates greater\
    \ interest for the agent to reach that square, while a lower weight indicates\
    \ a greater danger. The objective is assigned a weight of 1, walls and static\
    \ objects are assigned a weight of 0.9, ships are weighted 0.8, and their linear\
    \ predictions are weighted −0.8×0.85^j at each time step of the prediction, where\
    \ j represents the time step. This weighting is applied in a cone that reflects\
    \ the future positions of the ship. The intensity of the weights in the cone depends\
    \ on the distance from the initial position, with the intensity decreasing as\
    \ the distance from the origin increases. The cone is created by projecting the\
    \ future ship positions in three directions, i.e., a modification of the direction\
    \ of dir_n + [0°, +20°, −20°], where dir_n represents the heading of ship n in\
    \ degrees. The areas between these projections do not require weighting since\
    \ it is assumed that the agent will not try to fit into empty spaces in the cone.\
    \ An amplitude of [−20°, +20°] also enables the agent to anticipate future changes\
    \ in the trajectories of moving obstacles and thus adapt in advance to potential\
    \ changes. The process of filling the grid based on object positions can be computationally\
    \ intensive, especially when using a loop over the horizon. To optimize this,\
    \ we developed Algorithm 3 which projects object coordinates onto the nearest\
    \ multiple of the square size to determine which grid square the object belongs\
    \ to, taking negative positions into account. We also generate a dictionary named\
    \ GridDict at the beginning of the experiment, which contains additional filling\
    \ information for grid"
