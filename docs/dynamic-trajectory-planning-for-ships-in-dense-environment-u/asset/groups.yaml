    y_i$以及以弧度表示的方向$dir_i$，我们使用式(3)计算新位置。


    $$

    \begin{aligned}

    x_i &= s_i \times \cos(dir_i) + x_{i-1}\\

    y_i &= s_i \times \sin(dir_i) + y_{i-1}

    \end{aligned} \tag{3}

    $$


    ### 4.2. 奖励评估


    除非受到学习或验证阶段定义的回合时长限制，否则智能体终止回合的唯一方式是与环境中的物体（如目标、边界或障碍物）碰撞。到达边界时，只需越过空间边界即可结束回合；而对于其他物体，则需要进入碰撞区域（即碰撞箱）。目标的最大欧几里得碰撞距离（15米）略大于其他类型障碍物的碰撞距离（13米）。本研究不使用奖励塑形（Ng等，1999），这意味着只考虑回合结束时获得的奖励。尽管常见的做法是对所有观测到的状态应用修改后的奖励以加速学习并更准确地评估某些状态，但在本研究中不建议这样做。轨迹（时间、速度等）不应被过度约束，因为这可能导致收敛到危险状态。相反，智能体被教导制定碰撞避免策略，即使这意味着要走更长的路径。


    第一个理由是使用碰撞网格来评估状态值，该网格清晰地用负权重划分危险区域，用正权重或零权重划分感兴趣区域。这种评估将反映在网络的更新中，并且即使没有被动奖励，折扣奖励仍将评估每次导致成功或失败回合的转移的相关性。因此，可以在网格、其权重和折扣奖励之间建立关联。第二个理由是构建被动奖励函数的复杂性。确定该函数各部分对智能体向其目标收敛的影响是困难且模糊的。例如，如果目标太远，目标相对位置会显示在视界的50%处，这进一步使被动奖励函数复杂化。在没有障碍物的情况下，当网格保持不变时，无法区分朝向目标的正向动作与中性或负向动作。因此，对于这样的转移，奖励变得模糊，提供固定奖励与实际发生情况不符。试图依赖智能体的航向来解决这种模糊性也是不够的，因为转向率可能不会将目标相对位置从一个格子改变到另一个格子。即使确定了良好的目标达成评估，仍然需要评估距离、潜在碰撞以及对COLREG的任何违反，以建立全局奖励。由于这些信息在每个步骤的网格中已得到考虑，将其纳入奖励将是冗余的。此外，不同组件的加权是被动奖励的一个显著缺点，并且很难确定为每个组件分配适当的权重。奖励加权过程可能很困难，因为它涉及大量的超参数化。此外，它可能仅适用于当前特定问题，使得在环境或智能体采取的动作发生任何修改时难以复现。因此，智能体只能获得由碰撞类型决定的三种可能恒定奖励值之一。例如，如果智能体与目标碰撞，则获得+5的奖励；如果它与障碍物或边界碰撞，则会获得-1的奖励；在所有其他情况下，奖励为0。奖励函数的方程如式(4)所示。在每个持续t个时间步的回合结束时，我们使用折扣因子γ从i
    = t − 1到i = 0计算每个时间步的累积奖励：$rW_i = \gamma \times rW_{i+1}$。对于回合中花费的时间步数没有惩罚，因此智能体不会因使用较长或较短的轨迹到达目标而受到惩罚。因此，主要目标是在不与任何障碍物碰撞的情况下到达目标，唯一的非零奖励来自结束回合的正碰撞或负碰撞。


    **表1.** 用于训练和评估模型的环境配置详情。


    | 名称 | 数值 |

    |------|------|

    | 移动障碍物数量 | 3 |

    | 静态障碍物数量 | 3 |

    | 正奖励 | 5 |

    | 负奖励 | -1 |

    | 零奖励 | 0 |

    | 主船视界（米） | 120 |

    | 方格大小（米） | 15 |

    | 障碍物碰撞箱半径（米） | 13 |

    | 目标碰撞箱半径（米） | 15 |


    $$

    rW_{\text{final}} =

    \begin{cases}

    5, & \text{如果碰撞=目标}\\

    -1, & \text{如果碰撞=（船舶或障碍物或墙壁）}\\

    0, & \text{其他}

    \end{cases} \tag{4}

    $$


    ## 5. 模型验证


    ### 5.1. 智能体训练


    我们的模型生成将分两个阶段进行。第一阶段涉及模型的训练，第二阶段涉及对其性能的评估。训练过程将包含100万个回合，每个回合的最大持续时间为300个时间步。总训练时间约为52小时，主要取决于网格中方格的数量和环境中的障碍物数量。在每个回合开始时，智能体的起始位置、目标和环境中的各种障碍物将被随机初始化。因此，学习环境不会保持静态，环境参数汇总在表1中。在学习阶段和评估阶段，每个新回合开始时，所有障碍物的位置，以及移动障碍物的舵角和方向，都会与智能体驾驶的船舶及其目标的位置一起随机重置。这种环境的随机化使我们能够观察智能体泛化其策略并在以前未见过的场景中表现良好的能力。环境大小限制为350
    × 350米，每种类型的障碍物最多三个。这一约束预计将通过加快收敛和缩短回合持续时间来加速学习过程。此外，限制障碍物数量应帮助智能体学会避开它们，而不仅仅关注避障。最后，由于输入数据仅限于带有视界的网格，环境大小对模型性能的影响不大。虽然我们可以在不同大小和障碍物密度的环境中测试模型，但在学习过程中限制大小应该会带来更快的收敛，尽管代价是智能体对环境的可观测性降低。


