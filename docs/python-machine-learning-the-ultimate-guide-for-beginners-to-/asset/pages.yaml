- pgno: 7
  md: '# Introduction


    Machine learning is a fairly new domain, however it quickly became the latest
    trend on which every IT specialist is trying to jump, and rightly so. This technical
    field can be used to solve a wide variety of today''s problems. The purpose of
    *Python Machine Learning* is to guide you step by step through all the basic concepts
    of machine learning.


    Throughout the course of this book you will learn about all the specialised tools
    you will need on your journey. In addition, you will learn a variety of machine
    learning algorithms and techniques by combining theory with practice. You will
    be applying everything you learn on real datasets and learn the practical use
    of every concept you study.


    Keep in mind that in order to benefit the most from using this ultimate guide
    for beginners, you will have to go through every practical application and dissect
    it until you understand it. In addition, you will have to start practicing on
    your own in order to build a proper foundation. You don''t have to be a computer
    science major to understand machine learning, however you do need a great deal
    of determination and most importantly, practice!'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# # Chapter 1: Why Machine Learning?


    So you''re interested in IT, programming, or all that is tech and recently you
    keep hearing about machine learning. Wherever you turn your head to explore something
    new, this concept keeps coming up. At this point you probably expect some shady
    guy wearing a trench coat to approach you in a dark alley and ask you, “Hey kid,
    interested in some machine learning?” You probably thought that there must be
    something worth studying here if everyone who knows how to write a few lines in
    Python keeps talking about it. So what is machine learning and why is everyone
    so crazy about it?


    In this chapter we will address these questions and more. It''s important to understand
    why machine learning is such a hot topic and why many see it as the future in
    all that is technology. You already took the first step in exploring this field,
    but if you get a better idea about the application of machine learning, you will
    definitely become more motivated to study it and learn it.


    # ## The Importance of Machine Learning


    Machine learning started out as a component of Artificial Intelligence, and therefore
    its definition is somewhat tied to it. In essence, machine learning software learns
    from experience, almost like humans. Keep in mind that in this case experience
    refers to data and the ability to learn does not involve direct programming. When
    a machine learning application is exposed to data it will absorb it, learn from
    it, adapt itself based on it and evolve. In other words, systems that are powered
    by machine learning doesn''t need to be instructed by someone how to search for
    something and where to find it. Instead, it relies on its own algorithms to learn
    from the data and then apply what it learned in order to perform better and repeat
    the cycle. See? It''s almost human, but no this is not from the realm of science
    fiction. Machine learning has been here for quite some time'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'and it''s becoming more and more of an industry standard in research

    as well as product design.


    In fact, the idea of machine learning is at least as old as the Enigma

    Machine, however its ability to perform a massive number of fully

    automated mathematical operations became possible only in the

    past couple of decades due to the massive leaps in computer

    processing power. Furthermore, a number of new technologies were

    developed in recent years and they are the ones that take advantage

    of machine learning the most.


    To get a better idea why machine learning is so important, you need

    to know where it''s actually applied. Are you aware of Google''s fully

    automated, self-driving car? You have machine learning to thank for

    that. Do you use Facebook, Amazon, or Netflix? Check, check and

    check, they all rely on machine learning to power their ability to

    recommend you things you may be interested in. That''s how they

    know you love funny cat videos. Computer systems can learn all of

    this by running all the data you generate through a filter, keep only

    what is relevant to you and what fits your pattern, and then give you

    the accurate results you don''t even know you''re looking for.


    Machine learning seems to have evolved so suddenly, even though it

    had been theorized by the great mathematicians who lived centuries

    ago (yes, even before the invention of the computer), only because

    of market demand and its real world application for mass

    consumption. For instance, you may have also heard about machine

    learning in the same sentence as Big Data. That''s because it is

    highly sophisticated nowadays and it allows us to process and

    analyse massive amounts of data that no human could handle

    otherwise. Furthermore, machine learning has led to a revolution in

    the way we extract and analyze data because it allows us to

    automate the algorithms and therefore replace the slow,

    cumbersome statistical methods that used to be the norm.


    # # Applied Machine Learning'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'Machine learning has been lately integrated in pretty much everything that
    is tech and you will often not even notice it or think of it. Earlier we mentioned
    the more obvious sectors where machine learning algorithms take over. However,
    you will also encounter them in anything that has to do with web search results,
    real time online ads, email spam protection, network protection, image recognition
    software, and much more. All of these products or services have one thing in common.
    They all take advantage of machine learning because of the massive amounts of
    data that need to be processed and analyzed.


    Data analysis used to be quite tricky before the implementation of machine learning
    algorithms. It involved a trial and error approach, and it might’ve worked two
    decades ago. However, today data is produced at such a staggering speed that it
    is impossible to keep up with its exponential growth. The more the computer processing
    power advances, the more tech we devise, and the more data and information we
    generate. For instance, even your smart home devices generate huge quantities
    of data that is collected for analysis in order to improve those devices further.
    Machine learning is the only alternative to the traditional techniques. It provides
    us with fast and powerful algorithms that produce accurate results. Machine learning
    will not go anywhere anytime soon, quite the contrary.


    # Popular Machine Learning Methods


    Now that you understand why machine learning is part of your life, you need to
    understand how it is capable of learning.


    Generally, there are two major machine learning techniques, namely supervised
    learning and unsupervised. Most of machine learning, around seventy percent, is
    in fact supervised learning. Another ten to twenty percent is unsupervised learning.
    There are other techniques as well, such as semi-supervised learning and reinforcement
    learning, but they aren’t used as often. Here’s a brief introduction to what these
    techniques achieve:'
  merge: -1
  img_proc: true
- pgno: 11
  md: '+   1. Supervised learning: This machine learning method can be implemented
    only when we can identify the inputs and outputs and we have labeled data to work
    with. The algorithm will obtain its inputs together with the matching output in
    order to detect the errors. Based on the inputs, the model will be adapted. This
    entire process is in fact pattern recognition and these algorithms always rely
    on techniques such as regression, classification, prediction, or gradient boosting.
    Keep in mind that you will also have to deal with unlabeled data, and this is
    where pattern recognition fills in these blanks. Once a pattern is established,
    the algorithm can predict a label''s values. Supervised machine learning is normally
    used in applications that have to predict the future. One such example is finding
    credit card transaction frauds.


    +   2. Unsupervised learning: Supervised learning involves historical data in
    order to predict future events, however, that''s not the case with unsupervised
    learning. This type of algorithm analyses the collected data in order to determine
    its structure. This is why unsupervised learning is used to understand customer
    categories without any attributes that stand out, or to give you online recommendations.
    Some of the most popular unsupervised machine learning techniques include nearest-neighbour
    and k-means clustering.


    Machine learning is here to stay and that is why everyone is talking about it.
    It is one of the biggest trends in tech today because it serves a day to day purpose.
    It is used in so many areas that without a doubt include your daily life as well.
    This makes machine learning one of the most lucrative tech sectors with a wide
    array of career opportunities at your disposal. So if you want to get a piece
    of the action, you have all the resources you need.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Chapter 2: The Basics of Working with Python


    Before we start working with machine algorithms, you should first understand the
    basics of working with Python. However, if you are already familiar with Python
    or you have experience programming in other languages such as C++ or C# you can
    probably skip this chapter or simply use it to refresh your memory.


    In this chapter we are going to briefly discuss the basic concepts of working
    with Python. Machine learning and Python go hand in hand due to the simple fact
    that Python is a simple, but powerful and versatile language. Furthermore, there
    are many modules, packages and tools designed to expand Python''s functionality
    to specifically work with machine learning algorithms, as well as data science.


    Keep in mind that this is a brief introduction to Python, and therefore we will
    not be using any IDE''s or fancy tools. All you need is the Python shell, in order
    to test and experiment with your code as you learn. You don''t even need to install
    anything on your computer because you can simply head to Python''s official website
    and use their online shell. You can find it here: https://www.python.org/shell/.


    # Data Types


    Knowing the basic data types and how they work is a must. Python has several data
    types and in this section we will go through a brief description of each one and
    then see them in practice. Don''t forget to also practice on your own, especially
    if you know nothing or very little about Python.


    With that in mind, let''s explore strings, numbers, dictionaries, lists and more!'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# # Numbers


    In Python, just like in math in general, you have several categories of numbers
    to work with and when you work them into code, you have to specify which one you''re
    referring to. For instance, there are integers, floats, longs and others. However,
    the most commonly used ones are integers and floats.


    Integers, written int for short, are whole numbers that can either be positive
    or negative. So make sure that when you declare a number as an integer you don''t
    type a float instead. Floats are decimal or fractional numbers.


    Now let''s discuss the mathematical operators. Just like in elementary school,
    you will often work using basic mathematical operators such as adding, subtracting,
    multiplication and so on. Keep in mind that these are different from the comparison
    operators, such as greater than or less than or equal to. Now let''s see some
    examples in code:


    ```

    x = 99

    y = 26

    print (x + y)

    ```


    This basic operation simply prints the sum of x and y. You can use this syntax
    for all the other mathematical operators, no matter how complex your calculation
    is. Now let''s type a command using a comparison operator instead:


    ```

    x = 99

    y = 26

    print (x > 100)

    ```


    As you can see, the syntax is the same, however, we aren''t performing a calculation.
    Instead we are verifying whether the value of x is greater than 100. The result
    you will get is "false" because 99 is not greater than 100.'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'Next, you will learn what strings are and how you can work with them.


    # Strings


    Strings have everything to do with text, whether it’s a letter, number or punctuation
    mark. However, take note that numbers written as strings are not the same as the
    numbers data type. Anything can be defined as a string, but to do so you need
    to place quotation marks before and after your declaration. Let’s take a look
    at the syntax:


    ```

    n = "20"

    x = 10

    ```


    Notice that our n variable is a string data type and not a number, while x is
    defined as an integer because it lacks the quotation marks. There are many operations
    you can do on strings. For instance you can verify how long a string is, or you
    can concatenate several strings. Let’s see how many characters there are in the
    word “hello” by using the following function:


    ```

    len ("Hello")

    ```


    The “len” function is used to determine the number of characters, which in this
    case is five. Here’s an example of string concatenation. You’ll notice that it
    looks similar to a mathematical operation, but with text:


    ```

    ''42 '' + ''is '' + ''the '' + ''answer''

    ```


    The result will be “42 is the answer”. Pay attention to the syntax, because you
    will notice we left a space after each string, minus the last one. Spaces are
    taken into consideration when writing strings. If we didn’t add them, all of our
    strings would be concatenated into one word.


    Another popular operation is the string iteration. Here’s an example:


    ```

    bookTittle = "Lord of the Rings"

    for x in book: print c

    ```'
