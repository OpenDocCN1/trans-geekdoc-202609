  md: '# # Chapter 3: Environment Setup


    In this chapter you will learn all about setting up the appropriate environment
    for your machine learning needs. Keep in mind that while all you truly need is
    Python, working with machine learning algorithms and techniques without any other
    tool would be extremely difficult. That is why in this chapter you will build
    your machine learning toolkit which includes Python libraries, modules, packages,
    scientific distributions, and more.


    You will learn how to create an optimal environment with the help of modules such
    as NumPy, Pandas, Jupyter, and how to use tools such as Scikit-learn and TensorFlow
    to greatly improve your productivity.


    # ## Python Distributions


    Before you jump in head first, you should prepare your work environment in order
    to have an easier time pre-processing and analyzing your data. Working with algorithms,
    large datasets, and even just programming can be extremely time consuming without
    the right tools.


    Installing Python and various libraries and modules will certainly give you the
    flexibility and power you need, however, there''s an even more efficient way of
    getting started. The answer is Python scientific distributions. These distributions
    are Python installations packaged together with a number of tools that machine
    learners and data scientists need to work with data sets and specific algorithms.


    One of the most popular scientific distributions is Anaconda and we will be discussing
    it briefly in the next section. However, keep in mind that it is only one of the
    many distributions which contains the modules and tools needed for machine learning.
    You can always explore as you study in order to find what suits your needs.'
