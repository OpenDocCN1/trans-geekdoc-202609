  img_proc: true
- pgno: 16
  md: 'mind that while in this example our keys are in fact strings, they can be other
    data types as well.


    # Tuples


    This data type is similar to a list, except its elements cannot be changed once
    defined. Here''s an example of a tuple:


    ```

    n = (1, 43, ''someText'', 99, [1, 2, 3])

    ```


    A tuple is defined between parentheses and in this case, we have three different
    data types, namely a few integers, a string, and a list. You can perform a number
    of operations on a tuple, and most of them are the same as for the lists and strings.
    They are similar data types, except that once you declare the tuple, you cannot
    change it later.


    # Conditional Statements


    Now that you know the basic data types, it''s time to take a crash course on more
    complex operations that involve conditional statements. A conditional statement
    is used to give an application a limited ability to think for itself and make
    a decision based on their assessment of the situation. In other words, it analyzes
    the condition required by a variable in order to tell the program to react based
    on the outcome of that analysis.


    Python statements are simple to understand because they are logical and the syntax
    reflect human thinking. For instance, the syntax written in English looks something
    like this “If I don’t feel well, I won’t go anywhere, else I will have to go to
    work”. In this example, we instruct the program to check whether you feel well.
    If the statement is valued as false, it means you feel well and therefore it will
    progress to the next line which is an “else” statement. Both “if” and “if else”
    conditionals are frequently used when programming in general. Here''s an example
    of the syntax:'
  merge: -1
  img_proc: true
- pgno: 17
  md: "```\nx = 100\nif (x < 100):\n    print(\"x is small\")\n```\n\nThis is the\
    \ most basic form of the statement. It checks whether it’s true, and if it is\
    \ then something will happen and if it’s not, then nothing will happen. Here’s\
    \ an example using the else statement as well:\n\n```\nx = 100\nif (x < 100):\n\
    \    print(\"x is small\")\nelse:\n    print(\"x is large\")\n\nprint (\"Print\
    \ this no matter what\")\n```\n\nWith the added “else” keyword, we instruct the\
