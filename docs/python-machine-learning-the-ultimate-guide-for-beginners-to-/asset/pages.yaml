  md: '# Chapter 5: Machine Learning Algorithms


    Now that you understand the concept of machine learning and you’ve assembled all
    of your tools, it’s time to start exploring the most powerful algorithms. Keep
    in mind that while you will learn about each algorithm and technique individually,
    they are rarely used like this in a real world scenario. When dealing with complex
    datasets you will often combine supervised machine learning techniques with unsupervised
    machine learning techniques, as well as a number of other processes.


    In this chapter we are going to focus on a number of algorithms that work well
    separately when working with ideal data sets, and even better when combined to
    achieve high accuracy and efficiency. Some of the algorithms we’ll explore include
    linear regression, decision trees, and support vector machines.


    # Linear Regression


    Many machine learning problems, such as prediction analysis, are handled using
    linear regression. This technique is powerful in predicting an outcome with high
    accuracy as long as the training data is valuable and doesn’t contain too much
    noise. Keep in mind that this is why you need to perform data pre-processing,
    to clear out some of the noise and outliers that can affect the results.


    One of the characteristics of linear regression is calculating the prediction
    value based on independent variables. In other words, you should opt for this
    algorithm whenever you have to calculate the link between a number of variables.
    However, take note that linear regression can only handle regression problems,
    and not classification problems. There are other algorithms for that.'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'Now let''s see an example on how to apply linear regression using Scikit-learn
    and an open source dataset. We will use the Scikit library because it contains
    a number of machine learning specific algorithms, as well as certain public datasets.
    One such dataset is the Boston housing market dataset, which is well-documented
    and clean. In order to use linear regression efficiently, we will divide the whole
    set into a training set (80%) and a testing set (20%). Let''s get to work:


    ```

    from sklearn.datasets import load_boston

    boston = load_boston()

    from sklearn.cross_validation import train_test_split

    X_train, X_test, Y_train, Y_test = train_test_split(boston.data,

    boston.target, test_size=0.2, random_state=0)

    ```


    As you can see, the Python code is easy to read and quite understandable without
    much explanation. We have imported our dataset and have performed a split in order
    to obtain a training set and a test set. The splitting function is a perfect example
    of the tools that the Scikit-learn library contains. You will notice that we have
    declared the percentages by stating the target test dataset should have a value
    of 0.2. This means that it will contain 20% of the data. Furthermore, we have
    a random state parameter which is needed to define the value which will handle
    the random number generating during the split. Basically, it randomly selects
    the data that will be categorized as training data or testing data.


    In the next phase, we need to apply a regressor in order for our linear regression
    algorithm to make an accurate prediction. Once it''s implemented all we need to
    do is measure the results to see how it performed. Keep in mind that there are
    many factors that can influence the accuracy, such as random errors, mislabeled
    data, outliers, noise, and so on. That is why the pre-processing you perform is
    rarely enough, and you will have to apply other algorithms to improve the result.
    This is something you need to keep in mind for the near future when you practice
    on your own. Now let''s see our regressor and the results we obtain:'
  merge: -1
  img_proc: true
- pgno: 37
  md: '```

    In: from sklearn.linear_model import LinearRegression

    regression = LinearRegression()

    regression.fit(X_train, Y_train)

    Y_pred = regression.predict(X_test)

    from sklearn.metrics import mean_absolute_error

    print ("MAE", mean_absolute_error(Y_test, Y_pred))

    Out: MAE 3.9318708224346

    ```


    That''s it! As you can see linear regression is easy to implement as long as you
    use Scikit-learn to lessen the burden. The result we obtained, however, while
    not bad, is not exactly good either. It shows that even when we have fairly clean
    data, there is always room for improvement with other algorithms and techniques.
    Furthermore, whenever you have to make a choice between machine learning algorithms,
    you will actually be balancing prediction accuracy with speed. In essence, it
    comes down to those two factors. Whenever you opt for one, the other one is sacrificed.
    With time and experience you will learn how to balance them based on the type
    of data you are working with and what kind of results you need to obtain.


    Now, let''s see another type of algorithm, namely the support vector machine.


    # Support Vector Machines


    If you need a versatile algorithm that can handle nearly everything for you, then
    a support vector machine is precisely what you''re looking for. While the linear
    regression algorithm we discussed earlier is only used for regression problems,
    support vector machines can handle both regression, as well as classification,
    and even the detection of outliers. This technique is one of the foundational
    algorithms every machine learner needs to study and learn how to implement.'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'Support vector machines are popular because they are powerful without being
    resource intensive. Usually, the more you push for accuracy, the slower the data
    processing will go because it will require more from your computer system. However,
    support vector machines require a lot less power without affecting the prediction
    accuracy. Furthermore, you can use this algorithm to also clean most of the noise
    within the dataset, thus reducing the amount of steps you need to perform during
    the pre-processing phase (though it''s still advisable to perform all of them).


    So why are support vector machines so important? Where are they used? Because
    of their power and versatility they are implemented in a variety of fields. For
    instance, they are used for facial recognition software, text classification,
    handwriting recognition, and in the medical industry as well for classifying genes.
    There are many more uses for this algorithm because it separates the data points
    within the dataset with great efficiency and that allows for accurate enough results
    to make it usable in complex applications.


    We will go through an example to see how a support vector machine is implemented
    and how it works. Keep in mind that you will again have to make use of the Scikit-learn
    library in order to reduce the time it takes to implement the algorithm. As you
    can see, this tool is irreplaceaceable whether you''re interested in machine learning,
    data science, or even data mining. With that being said, we will use a support
    vector machine in order to predict how valid a bancnote is. This implies image
    classification, and as mentioned earlier, this algorithm is ideal for this process.
    The algorithm implementation will be simple because the classification will be
    binary. All we need to establish is whether a bancnote is authentic or fake, therefore
    true or false.


    Take note that we will have a number of attributes that describe the banknote.
    In addition, we need to establish the separation line between the two dimensions
    in order to avoid any miss-classifications. While other classification algorithms
    can perform the same process, support vector machines have a unique approach.
    This technique determines the decision limit by calculating the maximum distance
    between certain data points that are in close'
  merge: -1
  img_proc: true
