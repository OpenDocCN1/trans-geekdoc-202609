    used in the machine learning field. Some of them are included inside many scientific
    distributions, however, you need to be aware of them in order to know what to
    import. Some of the most important tools include Scikit-learn, Pandas, NumPy,
    and Tensorflow, among many others. Let''s briefly discuss the modules and libraries
    you''ll be using and then explore tools like Tensorflow in more detail:


    +   1. Pandas: This is a library that is designed to be used specifically with
    Python for the purpose of analysing and manipulating data. What defines it is
    the fact that it gives you functionality to work with numerical tables, as well
    as time series.


    +   2. NumPy: This is another library meant to be used with Python because it
    extends the programming language with the ability to manipulate large multi-dimensional
    matrices.'
