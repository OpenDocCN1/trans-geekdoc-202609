    # Anaconda


    Anaconda is an open source Python scientific distribution which has risen in popularity
    due to the many useful packages and libraries it contains, along with the fact
    that it is a free application that anyone can use. There are close to 200 Python
    packages that come with Anaconda, including NumPy, Scikit-learn, and Pandas, to
    name a few of the most valuable ones. Furthermore, Anaconda is also a package
    management application which makes the import and installation of any package
    or tool a breeze. You can download, install, or remove anything you need and you
    can also keep everything up to date with the click of a button. You can even setup
    a virtual environment if you prefer them over working directly on your system.


    Anaconda can be downloaded and installed as the basic version or the premium one.
    Keep in mind that for most projects you won’t need anything more than the free
    version. It includes everything you need for data pre-processing, exploration,
    or analysis. In addition, it is available for all computer systems, so you shouldn’t
    encounter any issues when moving a project from one system to another.


    In order to install or update anything with Anaconda you need to know a set of
    commands. It would probably be best for you to check the distribution’s online
    documentation in order to familiarize yourself with all of its features. Now,
    let’s go through some basic commands to get you started. Here’s how to install
    a Python package:


    ```

    conda install < my_package>

    ```


    The syntax for removing or deleting a package is the same, just replace “install”
    with the appropriate keyword. Furthermore, you can install, update, or remove
    multiple packages at the same time instead of going one by one. Here’s how that
    works:


    ```

    conda install < my_package1 > < my_package2 > < my_package3 > < my_package233>

    ```'
