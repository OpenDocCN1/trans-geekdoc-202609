    ## Chapter 1: Why Machine Learning?


    So you''re interested in IT, programming, or all that is tech and recently you
    keep hearing about machine learning. Wherever you turn your head to explore something
    new, this concept keeps coming up. At this point you probably expect some shady
    guy wearing a trench coat to approach you in a dark alley and ask you, “Hey kid,
    interested in some machine learning?” You probably thought that there must be
    something worth studying here if everyone who knows how to write a few lines in
    Python keeps talking about it. So what is machine learning and why is everyone
    so crazy about it?


    In this chapter we will address these questions and more. It''s important to understand
    why machine learning is such a hot topic and why many see it as the future in
    all that is technology. You already took the first step in exploring this field,
    but if you get a better idea about the application of machine learning, you will
    definitely become more motivated to study it and learn it.


    ### The Importance of Machine Learning


    Machine learning started out as a component of Artificial Intelligence, and therefore
    its definition is somewhat tied to it. In essence, machine learning software learns
    from experience, almost like humans. Keep in mind that in this case experience
    refers to data and the ability to learn does not involve direct programming. When
    a machine learning application is exposed to data it will absorb it, learn from
    it, adapt itself based on it and evolve. In other words, systems that are powered
    by machine learning doesn''t need to be instructed by someone how to search for
    something and where to find it. Instead, it relies on its own algorithms to learn
    from the data and then apply what it learned in order to perform better and repeat
    the cycle. See? It''s almost human, but no this is not from the realm of science
    fiction. Machine learning has been here for quite some time and it''s becoming
    more and more of an industry standard in research as well as product design.


    In fact, the idea of machine learning is at least as old as the Enigma Machine,
    however its ability to perform a massive number of fully automated mathematical
    operations became possible only in the past couple of decades due to the massive
    leaps in computer processing power. Furthermore, a number of new technologies
    were developed in recent years and they are the ones that take advantage of machine
    learning the most.


    To get a better idea why machine learning is so important, you need to know where
    it''s actually applied. Are you aware of Google''s fully automated, self-driving
    car? You have machine learning to thank for that. Do you use Facebook, Amazon,
    or Netflix? Check, check and check, they all rely on machine learning to power
    their ability to recommend you things you may be interested in. That''s how they
    know you love funny cat videos. Computer systems can learn all of this by running
    all the data you generate through a filter, keep only what is relevant to you
    and what fits your pattern, and then give you the accurate results you don''t
    even know you''re looking for.


    Machine learning seems to have evolved so suddenly, even though it had been theorized
    by the great mathematicians who lived centuries ago (yes, even before the invention
    of the computer), only because of market demand and its real world application
    for mass consumption. For instance, you may have also heard about machine learning
    in the same sentence as Big Data. That''s because it is highly sophisticated nowadays
    and it allows us to process and analyse massive amounts of data that no human
    could handle otherwise. Furthermore, machine learning has led to a revolution
    in the way we extract and analyze data because it allows us to automate the algorithms
    and therefore replace the slow, cumbersome statistical methods that used to be
    the norm.


    ### Applied Machine Learning


