    ## Tensorflow


    This is another open source Python-focused library that is designed specifically
    for machine learning. Keep in mind that machine learning is a complex field and
    it can be difficult to implement algorithms and training models manually. Fortunately,
    we have tools like Tensorflow to make our job a whole lot easier. Tensorflow isn’t
    just a simple machine learning library. It is in fact a framework that simplifies
    nearly every aspect of machine learning, such as data acquisition, model training,
    serving predictions, and refining results until they are as accurate as possible.


    Tensorflow was designed by Google, with the purpose of creating an open source
    library for complex, large scale machine learning problems. This tool is actually
    packaged together with a number of machine learning models, as well as neural
    network models, and a number of algorithms. In other words, TensorFlow provides
    you with everything you need to train neural networks to classify handwritten
    digits, perform accurate image recognition, build recurrent neural networks, handle
    natural language processing and more.


    Tensorflow also allows you to create graphs that represent the flow of data. In
    essence, each graph is a visual structure that shows how the information goes
    through a number of data processing nodes. Every single node is represented by
    an operation, and the link between the nodes is a multi-dimensional array, also
    known as a tensor.


    All of this functionality is provided through Python. As you already know, this
    is one of the easiest and most flexible programming languages you can use, and
    it suits all of your machine learning tasks due to its ability to express how
    to connect complex abstractions together. The tensors and nodes we mentioned earlier
    are in fact Python objects. Therefore we can determine that Tensorflow programs
    are Python programs. However, take note that the mathematical operations are not
    performed using Python. Why? Because Tensorflow uses C++ binaries to write the
    transformations libraries for optimal performance. Python is only used to connect
    the dots and allow us to use complex programming operations to link all the components
    together.


    Another advantage of working with Tensorflow is that any application you develop
    with it can run on any computer system. It can run on a local system, the cloud,
    Android systems, and so on. For instance, you can use Google''s cloud service
    to run the framework together with Google''s Tensorflow processing unit. However,
    the resulting machine learning prediction models will have to be installed on
    the system they''re supposed to run.


    Keep in mind that the largest advantage by far is that Tensorflow provides abstraction
    for our machine learning development projects. This means that you don''t have
    to manually handle the implementation of a machine learning algorithm. You don''t
    even need to know how to set up one function''s output to become the input of
    another function. While you should know how to do all of this because you want
    to become a machine learner, after all, Tensorflow provides you with the ability
    to simply place all of your attention on the application itself and not its inner
    workings. In other words, you deal with the big picture, while Tensorflow works
    behind the curtain.


    In addition, Tensorflow is all about making the developer''s life easier. If you
    develop any applications through this framework you will benefit from debugging
    them by evaluating every operation individually. You''ll be able to analyze the
    graphs and then edit them as needed instead of reconstructing them from scratch
    and then performing the analysis again. This way graph visualisation is incredibly
    interactive and user-friendly, especially when you have full access to the graph
    and the way it runs through an easy to understand user interface.


    A final advantage to this industry standard machine learning library and framework
    is the fact that Google continues to fuel its development and therefore makes
    it easier to work with and more powerful with each new version. Furthermore, it
    becomes much less time consuming to launch it into your development pipeline.


    As you can see, there are many advantages to using this tool, however, like any
    other tool it has its drawbacks. One of the biggest issues is caused by the way
    Tensorflow is implemented. Some training model results are difficult to extract
    and we can see this when we train a model on one system and then on another system.
    The results will vary to some degree. The problem is that the reason for this
    is a complicated matter and therefore we can''t find a fix-all solution. That
    is why, to achieve optimal performance and accuracy, you need to know which machine
    learning techniques to apply, even if you don''t do all the dirty work yourself.


