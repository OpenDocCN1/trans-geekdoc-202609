    - 3. Picky algorithms: The algorithm doesn''t always choose the most accurate
    and efficient decision tree from which you draw your conclusion. This is simply
    the nature of the technique. However, the solution is simple. All you need to
    do is train multiple trees in order to sample a larger number of features randomly
