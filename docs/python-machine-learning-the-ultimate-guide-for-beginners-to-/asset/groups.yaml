    two different categories, namely the regression trees and classification trees.
    The basics are still the same for both categories, however, there are a number
    of differences you should be aware of:


    - 1. Regression trees are specifically applied for tasks that involve continuous
    dependent variables. At the same time classification trees are needed when dealing
    with categorical dependent variables.


    - 2. The values that we extract as the result from the training data are determined
    differently for each category of decision trees. In the case of classification
    trees the value is calculated as the mode value of the total observation. This
    means that if we have an unknown data observation, we can predict with the help
    of the mode value. Keep in mind that mode values are the values that we find the
    most frequently in a given set of values. On the other hand, regression trees
    extract the value from the training data in the form of the mean of the total
    observations. This mean value is then used to calculate any missing data observations.


    - 3. Regression and classification trees rely on binary splitting. This concept
    involves going from the top of the tree to the bottom. This means that when we
    have observations in one region of the tree, there are a number of branches below
    it that are divided. The division happens within the predictor space. This concept
    is also often referred to as greedy because the algorithm seeks the variable that
    is needed for the current split that is being analyzed. The operation does not
    take any future splits in consideration and that is why sometimes we don''t have
    the most accurate results. This issue needs to be taken into consideration in
