    One point that should be noted is that the error correction algorithm involves
    random value generation within preset limits. Hence it is possible to model a
    better NN with another error-corrected output set. Therefore, it is possible to
    automate this part to produce multiple output sets and multiple NN trainings in
    parallel, then to select the one giving the lowest error.


    The ML-estimated HMD distribution for different pH, incubation time and metal
    concentration values is shown graphically in Figure 3. This type of graph provides
    insight for optimization studies, where the objective is finding the inputs that
    minimize the output. Therefore, the range of the output is colored from green
    (smallest, desired) to red (biggest, unwanted).


    Both BBD and NN are considered powerful data modeling tools for the systems in
    which there is no exact information on the mathematical relationship between the
    inputs and outputs. These can capture and represent complex nonlinear relationships.[21]
    When reviewing the literature on ML and nanoparticles, it was found that there
    were few articles on applying experimental results. The existing articles either
    only used RSM or only provided estimated data on size and color association with
    ML.[18,22,32,43] The results presented here show that combining BBD and NN gives
    even better estimations for NPS, in an approach that requires less cost, labor,
    and less time, and is greener. This approach has not been reported in the literature
    before.


    # Conclusions


    This is a model study created with both statistical experimental design and ML,
    showing the potential of effective


    green synthesis nanoparticle production. Utilizing ML in the process of NPS shows
    potential, but an obstacle is obtaining sufficient data. This study attempts to
    overcome this bottleneck, and presents promising results with a two-stage approach.
    In the first stage, BBD was used for experimental setup, quadratic model formulation
    and data generation. In the second stage, an ML model, namely a Neural Network
    structure was trained with the data generated in the previous stage.


    An automated and fast data generation method using BBD formulation that is based
    on real experiment results is proposed so that ML could be fed with these data
    to learn the relationship between the nanoparticle size and several affecting
    factors.


    Obtained results showed that the proposed combined BBD & ML strategy with enhanced
    data provided better nanoparticle size estimations than the statistical BBD approach
    alone. When the experiments were performed with completely new and unseen values,
    BBD’s prediction was poor with 21.92% average error, pointing to a generalization
    problem. However, BBD & ML combined approach with error correction gave 8.49%
    average error for the same input set. This result clearly represents an improvement
    in favor of ML usage.


    This two-stage BBD & ML idea is not limited to the NPS process; it can be applied
    to any area where statistical methods such as RSM and BBD are used for modeling
    but data availability is limited, such as the production of valuable biotechnological
    products (enzymes, polysaccharides, bacterial cellulose, glycan etc.), the removal
    of pollutants, the synthesis of microorganisms, the calculation of hydrogen production
    yields. The benefits of this approach is that it is low cost, fast, and environment
    friendly, and shows improved performance as compared to using BBD alone.


    In this study, 5,000 was determined as the amount of generated data required for
    the NPS process. As a comparison, NN training can be repeated with both greater
    and lesser amounts and results can be observed. For other processes using a different
    number of variables, data generation could have a different sampling set. Moreover,
    an automated process can be introduced to produce multiple output sets with different
    random error correction values. In this way, multiple NN trainings can be performed
    in parallel, and then the optimum NN with the lowest prediction error can be selected.


    It is desirable to create common and accessible public pools for the data produced
    in similar researches, but not possible at the moment. Until such possibilities,
    data generation with BBD and ML usage idea proposed here could be a solution.


