    First, this Validation Set was given to the BBD’s quadratic formula (Equation
    (7)) to assess its performance with previously unseen inputs. Results are given
    in the “BBD-only Output” column of Table 4. The average prediction error (21.92%)
    is not low, and even gives a negative prediction. When the pH, incubation time
    and metal concentration were 3, 20 min and 7 mM, respectively as in the second
    experiment shown in Table 4, the actual HMD measurement was 25.00 nm, whereas
    BBD’s formula gave −3.86 nm for these inputs, which is an impossible result for
    size measurement. This yields to a prediction error of 115.44%, but it was not
    unexpected, as BBD’s formula was constructed only for the values in the Control
    Set (Table 1) and had not previously used the values in the validation set (Table
    4). However, machine learning can give better results with unseen input values
    due to its generalization ability.


    Therefore as the next attempt, the NN model trained with BBD’s outputs was tested
    with this Validation Set. Results can be seen in the “BBD & ML” column of Table
    4. Average prediction error (10.79%) was considerably lowered as compared to the
    average prediction error of BBD-only case (21.92%). This shows the advantage of
    using two-stage modeling.


    As the final trial, the Validation Set was applied to the NN model trained with
    the BBD’s error-corrected outputs. Table 4’s “BBD & ML & Err. Cor.” column lists
    the results for this case. The average prediction error was further reduced to
    8.49%, showing the performance improvement by two-stage modeling and error correction.


