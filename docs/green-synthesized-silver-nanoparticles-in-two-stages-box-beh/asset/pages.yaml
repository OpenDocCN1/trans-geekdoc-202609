    B + 3.8 × A × C + 0.026531 × B × C − 0.64875 × A² − 0.00339637 × B² + 0.88612
    × C²  (7)


    where A, B and C used as pH, incubation time and metal concentration, respectively.


    This equation shows that the positive values have a synergistic effect on NPS,
    whereas negative means the opposite. Compared with others, the metal concentration
    produces a'
