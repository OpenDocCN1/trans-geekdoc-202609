    # Materials and methods


    The proposed method consists of two stages: BBD for experimental design, statistical
    formulation, and data generation; and ML for learning the input/output relationship
    and generalization. NPS was chosen as the application domain: the aim was to predict
    nanoparticle size using the proposed model for the specified inputs. Once this
    model is trained, it can be used for various purposes, such as in the optimization
    problems where the input values for the optimal nanoparticle size can be determined.
    In addition, different environmental conditions could be confirmed to achieve
    a higher desirability. The details are given in the following subsections.


    # Experimental design with BBD and data generation


    Experiments of NPS have been performed to evaluate the effects of selected variables,
    namely metal concentration, incubation time and pH on a small scale with 25 mL
    working volume in the Erlenmeyer system. Relevant experimental designs for optimization
    processes have been carried out using the Design-Expert® software (version 7.0.0,
    Stat-Ease Inc., Minneapolis, MN). The process has been followed by statistical
    analysis using BBD that uses minimum-maximum levels and one point at the center
    of the experimental region to fit quadratic polynomials as in Figure 1.[20]


