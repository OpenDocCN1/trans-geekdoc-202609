    In this way, a new data set with error corrected desired outputs is formed. The
    results for both cases are given below.


    # Training results with no error correction


    In this case, the model was trained with the generated data, where no error correction
    is applied to the output. The resulting train error was achieved as 2.96% and
    the test error as 2.85%. Furthermore, the same model was tested with the Control
    Set having 17 real experiments, for which the input and output values are given
    in Table 1. The average prediction error was obtained as 3.70% for this set.


    # Training results with error correction


    The same model underwent a new training with the error-corrected outputs. In this
    case, the training error was 5.94%, and the test error, 5.16%. Greater error values
    than the previous case were expected, since the outputs were altered and perturbed
    from the data generated by BBD (Equation (7)). Nevertheless, when this model is
    compared with the actual outputs of the Control Set given in Table 2, there was
    a slightly reduced average prediction error, 3.62%.


    # Validation results


    In order to validate the performance of the model, eight new NPS experiments with
    new input values that were not used before were conducted, and the outputs were
    measured. In these experiments, some input values were selected from the outside
    of the previous limits given to BBD the in order to see the generalization performance.
    For example, pH limits were between 4 and 8 before and now 3 and 10 were chosen.
    Similarly, for incubation time, 15 min and 20 min, which are less than the previous
    minimum value of 30 min, were chosen. For metal concentration, 3 mM and 10 mM
    were chosen where 1 mM and 8 mM were the previous limits.


    Furthermore, new figures which were within the limits, but not in the Control
    Set (for instance, 5 and 7 for pH, 45 min and 60 min for incubation time, and
    3 mM and 7 mM for metal concentration) were selected. These new input values and
    the measured outputs can be seen in the “Inputs” and “Actual Output” columns of
    Table 4.


