    The values of the input parameters used in the 17 runs suggested by Design-Expert
    software are given in the second, third, and fourth columns of Table 1. The corresponding
    output measurements are shown in the fifth column. Based on these BBD results
    and statistical analysis performed on the HMD as a response, equation of the quadratic
    statistical model has been created as:


