    ## 两阶段绿色合成银纳米粒子：Box-Behnken 设计到机器学习


    Gulizar Caliskan and Ayca Kumluca Topalli


    a 工程学院，遗传与生物工程系，伊兹密尔经济大学，伊兹密尔，土耳其；b 工程学院，电气与电子工程系，伊兹密尔经济大学，伊兹密尔，土耳其


    ## ABSTRACT


    为了解决在利用统计近似的学科中由于数据稀缺问题导致的建模问题，提出了一种新颖的两阶段思路。作为用例，选择了纳米粒子生物合成，其环境友好过程至关重要。首先，使用
    Box-Behnken 设计进行实验设置、二次模型公式化和数据生成。第二阶段包括机器学习，其中前一阶段生成的数据被输入到神经网络中以确定参数之间的关系。获得的结果表明，所提出的组合策略比单独的统计方法提供了更好的纳米粒子尺寸估计。在缺乏公开数据库的情况下，如本文提出的利用实验设计和机器学习进行数据生成，可能是一种更快、成本更低且更环保的解决方案。我们提出的方法可以应用于具有显著先进知识的广泛生物技术和生物工程应用。


    ## ARTICLE HISTORY


    收到：2023年7月13日

    接受：2024年5月5日


    ## KEYWORDS


    响应面方法；数据生成；深度学习；神经网络；银纳米粒子生物合成


    ## Introduction


    纳米技术已成为应用于科学许多领域的最有前景的技术之一，例如医学、农业应用、制药工业、能源、电子和航空航天工业。最近，人们对纳米尺度材料的新型合成方法越来越感兴趣，例如纳米薄膜、纳米粒子等，它们越来越多地用于纳米科学，并有望在未来带来许多不同的创新。纳米技术的巨大优势源于其特定的性质，例如高表面体积比、量子尺寸效应、增强的磁性、生物相容性、化学稳定性、可生物降解性、低毒性以及结构多样性和仿生特征。


    通常，由于其在大批量生产中成本低，物理和化学方法被优先用于纳米粒子的生产。然而，这些方法必然需要使用有毒化学品，例如有机溶剂、还原剂、稳定剂以及纳米粒子合成（NPS）过程中的极端反应条件。由于金属纳米粒子广泛用于与人体接触的应用中，开发环境友好的
    NPS 工艺的需求日益增加。用于制备纳米粒子的化学和物理方法中使用有毒溶剂限制了它们在基于生物的产品中的潜在应用。因此，开发一种更安全、无毒的合成方法很重要，以便纳米粒子能够在更广泛的行业中使用。


    最近，纳米技术向绿色合成发展的趋势日益明显，绿色合成成本低、可持续、环境友好、易于放大且相对易于合成。此外，绿色合成的产量更高，其使用各种生物来源如植物提取物、细菌、微藻和真菌作为还原剂。由于没有有毒的还原和稳定剂，生物合成的纳米粒子被认为比化学合成的纳米粒子更安全、更具生物相容性，可用于组织工程、制药工业、医学等生物技术领域。


    纳米粒子的合成受许多因素影响，例如温度、pH、溶液浓度、原料的用量和比例。可以使用各种统计程序来设计实验，以了解这些因素各自及其相互作用对 NPS 的有效性。任何统计设计都应涉及对结果的分析以得出客观结论，并确保合成的可持续性以供进一步研究。


    响应面方法论（RSM）是基于各种统计和数学技术（如线性、平方多项式函数等）用于优化的实验设计方法之一。这些技术能够使用少量实验识别允许高效生产的条件。Box
    Behnken 设计（BBD）为 RSM 提出实验，采用三水平分数编码为 −1（低）、0（中）和 +1（高），以将设计拟合到适用于二次模型的二阶多项式方程。[16,19]


    BBD 是一种经济的方法，因子水平较少，已被广泛用于 NPS 过程；然而，它不允许极高或极低的水平。[19,20] BBD 由于缺乏极值和区域、仅允许模型用二阶多项式拟合的限制以及需要至少三个实验因子，其预测质量较差。[21]
    此外，增加过程中的变量数量和生成实验数据成本高且耗时，尤其是在生物技术和材料科学中。[22]


    这些困难可以通过结合机器学习（ML）来克服。ML 是人工智能的一个分支，是数据驱动的模型，可以在不显式编程的情况下利用可用数据以显著的准确性学习知识。[23–25]
    它是支持决策和解决问题的强大工具，其中输入和输出之间的关系并不精确已知。


    近年来，ML 已应用于许多领域，包括制药和药物递送系统。[26–30] 这些通常用于预测 NPS 的输出：尺寸、形状、颜色及其相互作用等。[18,31,32]
    先前报道的工作集中在银纳米粒子的预测上，[33,34] 微流控装置中的液滴尺寸，[35] 以及微流控装置中操作参数的识别。[36–38] 此外，在 Ocampo
    等人的研究中比较了人工神经网络（ANN）和数据分析（DA）方法用于周期性扰动微混合器中脂质体尺寸的预测。根据他们的结果，ANN 的均方误差低于 DA。[39]
    另一项研究将贝叶斯优化与深度神经网络（DNN）结合，以优化银纳米棱镜的合成，使用高通量实验平台提供的数据。[22] Ban 等人使用随机森林算法学习纳米粒子性质与其冠状结构之间的复杂关系。复杂冠状中的功能蛋白以
    R² = 0.80 的准确度被预测。[32] 此外，Abhishek 等人应用卷积神经网络（CNN），即机器学习技术的一个分支，以减少传统上用于纳米粒子识别的非常昂贵、耗时、重复且繁琐的扫描电子显微镜（SEM）分析。在他们的工作中，CNN
    模型根据其颜色对胶体银和金纳米粒子溶液的图像进行分类，这些颜色基于其尺寸和表面等离子体共振。然后使用先前加载的图像通过数据增强生成合适的 SEM 图像，并使用图像处理算法确定样品中纳米粒子的近似尺寸。由于纳米粒子的识别及其尺寸是纳米粒子形成优化研究中的常见任务，他们提出的方法改善了样品制备和表征阶段的延迟。[18]


    与函数由多项式表示的传统 RSM 相比，ML 模型提供更灵活的估计。由于 ML 的特性，实验重复运行和三步循环重复的需求减少，从而实现过程加速并降低人力/设备成本。[40]
    从这个意义上说，ML 为 BBD 提供了时间和成本效益的替代方案；然而，与 RSM 和 BBD 类似，ML 也需要迭代以实现成功的估计。这意味着 ML 也需要足够数量的预先获取的数据。[40]


    数据不可用的问题已在先前的工作中通过多种变通方法得到解决。例如，用于 ML 辅助 NPS 的实验数据通常从报道结果和实验室笔记本中收集，或通过新实验生成，无论是手动还是通过机器人设置。[31]
    除了进行新实验的困难外，从文献中收集数据也有其自身的问题。将文献信息转化为训练数据集会带来挑战，因为来自不同来源的数据质量和一致性存在差异，并且数据通常来源于科学文献，而不是中央或
    curated 数据库。[31]


    例如，在 Wang 的工作中，[41] 目标是建立一个 ML 模型来预测用于抗病毒 mRNA 疫苗的脂质纳米粒子配方，并从在 Web of Science
    和 Scopus 中搜索多个关键词后确定的出版物中收集数据；他们从 65 项研究中检索了 325 个样本。同样，Ban 等人使用 ML 寻找纳米粒子性质与冠状组成之间的复杂关系，然后用从
    56 篇论文中提取的数据预测蛋白冠状的形成和相关的细胞反应。[32] 从这些例子可以看出，解析未格式化的文献并找到相同设置的有用数据具有挑战性，因此，不同研究小组之间的数据共享工具和数据收集计划将极大地造福于
    ML 辅助 NPS 领域，以克服数据稀缺问题。[31]


    本研究提出了一种新的低成本、简单且环境友好的方法来解决数据不可用的问题，并提出结合两种方法：


    - BBD 用于统计和实验拟合模型，然后生成输入/输出数据；以及

    - ML 用于学习这些输入/输出关系以实现泛化。


    由于 BBD 可以为给定的输入范围拟合多项式方程，因此被视为生成用于 ML 阶段的数据样本的起点。然后在下一阶段形成神经网络（NN）进行训练和测试。该提出的方法适用于任何使用
    RSM 方法的领域。为了显示其适用性，选择了 NPS 过程，并使用真实实验数据验证了系统的性能，结果显示出巨大的潜力。


