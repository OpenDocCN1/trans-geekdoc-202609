    ![](img/ceee3949c03b1c37ef76fff8972659a7_7_0.png)


    **图 3.** 不同 pH、孵育时间和金属浓度值下的 HMD 分布。


    具体针对该数据集。然而，当该模型用于新的、未见过的数据输入时，如验证集，误差显著增加，表明存在泛化问题。“BBD & ML & Err. Cor.” 案例在验证集的输入值上产生了最佳输出，显示利用
    BBD、ML 和误差校正方法可获得更好的泛化和近似。


    需要指出的一点是，误差校正算法涉及在预设限制内生成随机值。因此，有可能用另一组经误差校正的输出集来建模更好的 NN。因此，可以自动化此部分以并行生成多组输出集和多组
    NN 训练，然后选择误差最低的那一个。


    ML 估计的 HMD 分布随不同 pH、孵育时间和金属浓度值变化在图 3 中以图形方式显示。此类图表为优化研究提供洞见，其目标是找到使输出最小化的输入。因此，输出范围从绿色（最小，期望）到红色（最大，不期望）着色。


    BBD 和 NN 都被认为是当输入与输出之间数学关系没有确切信息时系统的强大数据建模工具。这些可以捕捉和表示复杂的非线性关系。[21] 在回顾 ML 和纳米颗粒文献时，发现应用实验结果的文章很少。现有文章要么仅使用
    RSM，要么仅提供与 ML 相关的尺寸和颜色关联的估计数据。[18,22,32,43] 本文提出的结果表明，结合 BBD 和 NN 可为 NPS 提供更准确的估计，采用的方法成本更低、劳动量更少、时间更短，且更绿色。该方法在文献中尚未报道。


    ## 结论


    这是一项采用统计实验设计和 ML 创建的模型研究，展示了有效绿色合成纳米颗粒生产潜力。利用 ML 在 NPS 过程中显示出潜力，但障碍是获取足够数据。本研究试图克服这一瓶颈，并提出了一种两阶段方法展示了有希望的结果。第一阶段，使用
    BBD 进行实验设置、二次模型构建和数据生成。第二阶段，使用前一阶段生成的数据训练 ML 模型，即神经网络结构。


    提出了一种基于真实实验结果的 BBD 公式自动化快速数据生成方法，以便 ML 可利用这些数据学习纳米颗粒尺寸与若干影响因素之间的关系。


    所得结果表明，所提出的带增强数据的 BBD & ML 组合策略比单独的统计 BBD 方法提供了更好的纳米颗粒尺寸估计。当实验使用完全新的、未见过的值进行时，BBD
    的预测很差，平均误差为 21.92%，指向泛化问题。然而，带误差校正的 BBD & ML 组合方法对同一输入集的平均误差为 8.49%。该结果清楚地表明了有利于
    ML 使用的改进。


    这种两阶段 BBD & ML 思想不仅限于 NPS 过程；它可应用于任何使用 RSM 和 BBD 等统计方法进行建模但数据可用性有限的领域，例如有价值生物技术产品的生产（酶、多糖、细菌纤维素、糖苷等）、污染物去除、微生物合成、氢产量计算。该方法的优点是成本低、速度快、环境友好，与单独使用
    BBD 相比性能更优。


    在本研究中，5,000 被确定为 NPS 过程所需的生成数据量。作为比较，NN 训练可以用更大和更少的数量重复并观察结果。对于使用不同数量变量的其他过程，数据生成可能具有不同的采样集。此外，可以引入自动化过程以产生具有不同随机误差校正值的多组输出集。这样可以并行执行多次
    NN 训练，然后选择预测误差最低的最优 NN。


    期望为类似研究中产生的 data 创建通用且可访问的公共池，但目前尚不可行。在此之前，这里提出的基于 BBD 和 ML 使用的数据生成思想可能是一种解决方案。


