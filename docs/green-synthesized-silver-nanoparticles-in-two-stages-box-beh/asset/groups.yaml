    8 之间。批次培养的初始 pH 值已调整，并在过程中未进行监测。孵育时间根据实验设计的配方调整为 30–240 min。金属溶液以 1–8 mM 的不同浓度配制，并以每秒
    1 滴的速度借助 burette 加入到 Erlenmeyer 系统中。在此设计中，实验共设置 17 次运行，如表 1 的前四列所示。设计的响应是使用 Malvern
    ZetaSizer Analyzer 提供的纳米颗粒的谐波平均直径（HMD）。结果由多次扫描的三个循环的平均值确定（由设备自动计算），平均尺寸以平均值 ±
    平均标准误差的形式呈现。[42] 应用这些设计后，BBD 建议了一个二次多项式方程。


    ## 材料与方法


    所提出的方法包括两个阶段：BBD 用于实验设计、统计公式化和数据生成；以及 ML 用于学习输入/输出关系和泛化。NPS 被选为应用领域：目标是使用所提出的模型根据指定输入预测纳米颗粒尺寸。一旦该模型训练完成，它可用于各种目的，例如在优化问题中可确定获得最佳纳米颗粒尺寸的输入值。此外，还可以确认不同的环境条件以实现更高的期望值。细节在以下小节中给出。


