    Using BBD’s quadratic polynomial formula obtained by Design-Expert software, hypothetical
    outputs (HMD) were generated for the given inputs (pH, incubation time and metal
    concentration). The minimum and the maximum values of the inputs were selected
    as in the second and third columns of Table 2, considering their most common ranges
    regardless of the ranges used in the previous experiments. The amount of distinct
    values between the minimum and the maximum values to be generated are given in
    the “Quantity” column of Table 2. The combination of 10 distinct pH values between
    4 and 10; 50 distinct values of incubation time between 10 min and 240 min; and
    10 distinct values of metal concentration between 1 mM and 10 mM resulted in 5,000
    (10 × 50 × 10) data samples. Interval is the increment value for the inputs that
    is calculated from Min, Max, and Quantity values as in Equation (1):


    Interval = (Max-Min)/(Quantity − 1)  (1)


    These data were generated for utilization in the training and testing of the NN
    model in the ML stage. As can be seen from Table 2, with 5,000 samples, which
    should be an adequate number for ML, interval values become small enough and representative.
    If necessary, for other types of NPS and inputs, quantities can be increased and
    more data points can be generated.


    # ML for predicting the output of the NPS


    A deep NN as shown in Figure 2 has been constructed to be trained and tested in
    this stage using the data generated in the previous stage.


    In this architecture, there are three input variables: x1 is pH value, x2 is incubation
    time, and x3 is metal concentration. The desired output d is the HMD value generated
    in the previous stage, and y is the predicted value of d by the NN model. The
    forward propagation equations Equations (2) and (3) give the neuron outputs. According
    to the terms used in Figure 2, the neuron output z_i^[l] is calculated as:


    z_i^[l] = Σ_{j=1}^{n_{l-1}} w_{ij}^{[l]} · u_j^{[l-1]} + b_i^{[l]}   ∀i = 1,2,...,n_l,
    ∀l = 1,2,...,L  (2)


    where l represents the layer number, w_{ij} represents weights between the i^{th}
    neuron and the j^{th} input u_j, b_i represents the bias associated with the i^{th}
    neuron, n_{l-1} represents the number of neurons in the (l−1)^{th} layer, n_l
    represents the number of neurons in the l^{th} layer, and L represents the number
    of layers.


    Then this output is undergone to a nonlinear activation function as:


    u_i^[l] = a^[l](z_i^[l])   ∀i = 1,2,...,n_l, ∀l = 1,2,...,L  (3)


    where a can be a sigmoid, ReLU, tanh, etc. In these formulas, the input variable
    x_j is represented as u_j^{[0]}, and the NN output y as u^{[L]}.


    The weight updates based on the gradient descent algorithm are calculated by backward
    propagation equations, as shown below:


    w_{ij}^{[l]} = w_{ij}^{[l]} − α ∂J/∂w_{ij}^{[l]}   ∀i = 1,2,...,n_l, ∀i = 1,2,...,n_l,
