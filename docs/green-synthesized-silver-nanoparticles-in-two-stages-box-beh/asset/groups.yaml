    with a three-level fraction coded as −1 (low), 0 (middle) and +1 (high) to fit
    the design to a second order polynomial equation suitable for quadratic models.[16,19]


    BBD, an economical approach with fewer factor levels, has been widely used in
    NPS process; however, it does not permit extremely high or low levels.[19,20]
    BBD has poor prediction quality due to lack of extreme values and regions, restrictions
    that only allow the model to be fitted with second order polynomials, and its
    need to use at least three experimental factors.[21] Moreover, increasing the
    number of variables in the process, and the generation of experimental data are
    costly and time consuming, especially in biotechnology and materials sciences.[22]


    These difficulties can be overcome by incorporating Machine Learning (ML). ML,
    a branch of artificial intelligence, is a data-driven model that can learn knowledge
    without being explicitly programmed, using available data with remarkable accuracy.[23–25]
    It is a powerful tool for supporting decision-making and problem-solving tasks
    in which the relationship between the inputs and outputs is not precisely known.


    ML has been applied to many fields in recent years, including pharmaceuticals
    and drug delivery systems.[26–30] These are generally used to predict the output
    of the NPS: size, shape, color, and their interactions, etc.[18,31,32] Previously
    reported works focused on the prediction of silver NPs,[33,34] droplet size in
    microfluidic devices,[35] and identification of operating parameters in microfluidic
    devices.[36–38] Furthermore, in Ocampo et al. compare ANNs and data analysis (DA)
    methods for predicting liposome size in a periodic disturbance micromixer. According
    to their results, ANN has a lower MSE than the DA.[39] Another study combines
    Bayesian optimization with DNN to optimize the synthesis of silver nanoprisms,
    using data provided by an high-throughput experimental platform.[22] Ban et al.
    used a random forest algorithm to learn the complex relationships between nanoparticle
    properties and their corona structure. The functional protein in complex coronas
    was accurately predicted with R² = 0.80.[32] In addition, Abhishek et al. applied
    convolutional neural networks (CNN), a branch of machine learning techniques,
    to reduce the traditional use of very expensive, time-consuming, repetitive and
    cumbersome scanning electron microscopy (SEM) analysis for nanoparticle identification.
    In their work, a CNN model classifies images of colloidal silver and gold nanoparticle
    solutions according to their colors, which are based on their size and surface
    plasmon resonance. A suitable SEM image is then generated by augmentation using
    the previously loaded images, and image processing algorithms are used to determine
    the approximate size of the nanoparticles in the sample. As the identification
    of nanoparticles along with their sizes is a common task in optimization studies
    for nanoparticle formation, their proposed approach improves the delays in the
    sample preparation and characterization phase.[18]


    Compared to traditional RSM, where the function is represented by a polynomial,
    the ML model provides a more flexible estimation. Due to the nature of ML, the
    need for


    experimental re-runs and three-step cycle repetitions is reduced, resulting in
    process acceleration and a reduction in labor/equipment costs.[40] In this sense,
    ML provides a time and cost effective alternative to BBD; however, similar to
    RSM and BBD, ML also performs iterations to achieve successful estimates. This
    means that the ML also requires a satisfactory amount of pre-acquired data.[40]


    This problem of data unavailability has been addressed in the previous works by
    several workarounds. For example, experimental data for ML-assisted NPS are typically
    collected from reported results and laboratory notebooks, or generated by new
    experiments, either manually or by robotic setups.[31] In addition to the difficulties
    of performing new experiments, data collection from the literature has its own
    issues. Transforming literature information into training datasets poses challenges,
    due to variation in the quality and consistency of data from different sources,
    and data are sourced generally from the scientific literature, rather than central
    or curated databases.[31]


    For instance, in Wang’s work,[41] the aim was to build an ML model to predict
    lipid nanoparticle formulations for mRNA vaccines against viruses, and data were
    collected from publications identified by searching several keywords in Web of
    Science and Scopus; they retrieved 325 samples from 65 studies. Similarly, Ban
    et al. used ML to find the complex relationships between nanoparticle properties
    and corona composition, and then to predict the formation of protein coronas and
    related cell responses with data extracted from 56 papers.[32] As can be seen
    from these examples, it is challenging to parse the unformatted literature and
    find useful data for the same setup, and therefore, data sharing tools and data
    collection initiatives between different research groups would greatly benefit
    the field of ML-assisted NPS, to overcome the data scarcity problem.[31]


    This study brings a new low cost, simple, and environmentally friendly approach
    to resolve this issue of data unavailability and proposes combining two methods:


    +   - BBD to fit the model statistically and experimentally and then to generate
    input/output data; and

    +   - ML to learn these input/output relationships for generalization.


    Since BBD can fit a polynomial equation for the given input ranges, it is considered
    as a starting point for the generating of data samples to be used in the ML stage.
    A neural network (NN) is then formed for training and testing in the next stage.
    This proposed method is appropriate for any field using RSM approaches. In order
    to show its applicability, the NPS process was selected, and the performance of
    the system was validated with real experimental data, leading to results showing
    great potential.


    In the current study, the reduction potential of the plant extract for the green
    synthesis of silver nanoparticles was investigated. Firstly, the biosynthesis
