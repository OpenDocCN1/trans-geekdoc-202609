    # Green synthesized silver nanoparticles in two stages: Box Behnken Design to
    machine learning


    Gulizar Caliskan and Ayca Kumluca Topalli


    aFaculty of Engineering, Department of Genetics and Bioengineering, Izmir University
    of Economics, Izmir, Turkey; bFaculty of Engineering, Department of Electrical
    and Electronics Engineering, Izmir University of Economics, Izmir, Turkey


    # ABSTRACT


    In order to solve the modeling issues due to data scarcity problems in the disciplines
    utilizing statistical approximations, a novel two-stage idea is proposed. As a
    use case, nanoparticle biosynthesis was selected, for which an environmentally
    friendly process is of vital importance. First, Box Behnken Design was used for
    experimental setup, quadratic model formulation and data generation. The second
    stage consists of Machine Learning, in which the data generated in the previous
    stage were fed into a Neural Network to determine the relationship between the
    parameters. Obtained results showed that the proposed combined strategy provided
    better nanoparticle size estimations than the statistical approach alone. In the
    absence of publicly available databases, data generation using experimental design
    and machine learning, as proposed here, could be a faster, lower-cost, and greener
    solution. Our proposed method can be applied to a wide range of biotechnology
    and bioengineering applications with significant advanced knowledge.


    # ARTICLE HISTORY


    Received 13 July 2023

    Accepted 5 May 2024


    # KEYWORDS


    Response surface methodology; data generation; deep learning; neural networks;
    silver nanoparticle biosynthesis


    # Introduction


    Nanotechnology has become one of the most promising technologies applied in many
    areas of science, such as medicine, agricultural applications, pharmaceutical
    industries, energy, electronics and aerospace industries. Recently, there has
    been growing interest in novel synthesis approaches for nano-scale materials,
    such as nanofilms, nanoparticles, etc., which are increasingly being used in nanoscience,
    and are expected to lead to many different innovations in the future. The great
    advantages of nanotechnology stem from specific properties, such as high surface
    to volume ratio, quantum size effects, enhanced magnetic properties, biocompatibility,
    chemical stability, biodegradability, low toxicity, and structural diversity and
    biomimetic character.


    Generally, physical and chemical methods are preferred for the production of nanoparticles
    due to their low cost at high volumes. However, these methods necessarily require
    the use of toxic chemicals, such as organic solvents, reducing agents, stabilizers
    and extreme reaction conditions during nanoparticle synthesis (NPS). As metal
    nanoparticles are widely used in human contact applications, there is an increasing
    need to develop environmentally friendly NPS processes. The use of toxic solvents
    in the chemical and physical methods used to prepare nanoparticles limits their
    potential applications in bio-based products. Therefore, it is important to develop
    a safer, nontoxic synthesis method to allow nanoparticles to be used in a wider
    range of industries.


    Recently, there has been a trend in nanotechnology toward green synthesis, which
    is low-cost, sustainable, environmentally friendly, cost-effective to scale up
    and relatively easy to synthesize. In addition, the yield is higher in green synthesis,
    which uses various biological sources such as plant extracts, bacteria, microalgae
    and fungi as reducing agents. Due to the absence of toxic reducing and stabilizing
    agents, biosynthesized nanoparticles are considered safer and more biocompatible
    than chemically synthesized nanoparticles and could be used in biotechnological
    fields such as tissue engineering, pharmaceutical industry, medicine etc.


    The synthesis of nanoparticles is affected by many factors, such as temperature,
    pH, solution concentration, amount and ratio of the source material. Various statistical
    programmes can be used to design experiments to understand the effectiveness of
    each of these factors and their interaction on NPS. Any statistical design should
    involve the analysis of results to draw objective conclusions, and ensure the
    sustainability of the synthesis for further studies.


    Response Surface Methodology (RSM) is one of the experimental design methods used
    for optimization based on various statistical and mathematical techniques, such
    as linear, square polynomial functions, and others. These techniques are able
    to identify conditions that allow high efficiency production using a small number
    of experiments. Box Behnken Design (BBD) proposes experiments for RSM'
