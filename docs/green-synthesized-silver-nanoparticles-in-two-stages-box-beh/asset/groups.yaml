    2 的第二和第三列所示，选择考虑了其最常见的范围，而不考虑之前实验中使用的范围。要生成的最小值和最大值之间的不同值的数量在表 2 的“数量”列中给出。10
    个介于 4 和 10 之间的不同 pH 值；50 个介于 10 min 和 240 min 之间的不同孵育时间值；以及 10 个介于 1 mM 和 10 mM
    之间的不同金属浓度值的组合产生了 5,000（10 × 50 × 10）个数据样本。间隔是输入的增量值，根据 Min、Max 和 Quantity 值按公式（1）计算：


    Interval = (Max-Min)/(Quantity − 1)  (1)


    这些数据用于 ML 阶段 NN 模型的训练和测试。如表 2 所示，5,000 个样本应为 ML 提供足够的数量，间隔值变得足够小且具有代表性。如有必要，对于其他类型的
    NPS 和输入，可以增加数量并生成更多数据点。


    ### 用于预测 NPS 输出的 ML


    已构建如图 2 所示的深度 NN，使用前一阶段生成的数据进行训练和测试。


    在此架构中，有三个输入变量：x1 为 pH 值，x2 为孵育时间，x3 为金属浓度。期望输出 d 为前一阶段生成的 HMD 值，y 为 NN 模型对 d 的预测值。公式（2）和（3）给出了前向传播方程。根据图
    2 中使用的术语，神经元输出 z_i^[l] 计算为：


    z_i^[l] = Σ_{j=1}^{n_{l-1}} w_{ij}^{[l]} · u_j^{[l-1]} + b_i^{[l]}   ∀i = 1,2,...,n_l,
    ∀l = 1,2,...,L  (2)


    其中 l 表示层数，w_{ij} 表示 i^{th} 神经元与 j^{th} 输入 u_j 之间的权重，b_i 表示与 i^{th} 神经元相关的偏置，n_{l-1}
    表示第 (l−1)^{th} 层的神经元数，n_l 表示第 l^{th} 层的神经元数，L 表示层数。


    然后该输出经过非线性激活函数处理为：


    u_i^[l] = a^[l](z_i^[l])   ∀i = 1,2,...,n_l, ∀l = 1,2,...,L  (3)


    其中 a 可以是 sigmoid、ReLU、tanh 等。在这些公式中，输入变量 x_j 表示为 u_j^{[0]}，NN 输出 y 表示为 u^{[L]}。


    基于梯度下降算法的权重更新由以下反向传播方程计算，如下所示：


    w_{ij}^{[l]} = w_{ij}^{[l]} − α ∂J/∂w_{ij}^{[l]}   ∀i = 1,2,...,n_l, ∀j = 1,2,...,n_{l-1},
    ∀l = 1,2,...,L  (4)


    b_i^[l] = b_i^[l]} − α ∂J/∂b_i^[l]}   ∀i = 1,2,...,n_l, ∀l = 1,2,...,L  (5)


    其中 α 为学习率，J 为要最小化的均方误差代价函数：


    J = 1/2 (y − d)^2  (6)


    通过这种两阶段方法，可以在没有任何最小值和最大值限制的情况下，即时估算任意 pH、孵育时间和金属浓度的纳米颗粒 HMD。


