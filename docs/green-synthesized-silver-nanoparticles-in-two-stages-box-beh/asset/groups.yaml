    b_i^{[l]} = b_i^{[l]} − α ∂J/∂b_i^{[l]}   ∀i = 1,2,...,n_l, ∀l = 1,2,...,L  (5)


    where α is the learning rate and J is the mean squared error cost function to
    be minimized:


    J = 1/2 (y − d)^2  (6)


    With this two-stage method, HMD of the nanoparticle can instantly be estimated
    for any pH, incubation time, and metal concentration, without any restrictions
    on their minimum and maximum values.


