    # V. CONCLUSION


    In this survey we have identified various security threats which exist at different
    levels of an IoT device. We have emphasized the thorough study on various solutions
    to IoT security using Machine Learning technology. Machine learning security methods
    like Support Machine, Random Forest, Decision Tree, Artificial Neural Net etc.
    have the potential for security improvement for various IoT applications


