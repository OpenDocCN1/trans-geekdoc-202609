    J. Canada and A. Skjellum (2016) used Artificial Neural Network (ANN) network
    to identify intruders in the edge devices from the gateway level in IoT. This
    approach includes IoT detection by creating Arduino devices acting as edge devices
    and Raspberry Pi 1 model acting as gateway [9]. R statistical language was used
    to create a neural network. Proposed architecture 5-layer network with 3 hidden
    layers. The system was able to predict valid and invalid attacks with false negatives
    < 1%.


    # B. Deep Learning Algorithms


    Deep Learning (DL) is a part of Machine Learning from Artificial Neural Networks.
    The network consists of several neurons connected through weighted connections.
    It utilizes multiple layers of hidden layers for extracting higher features from
    input. Deep learning includes Recurrent Neural Network (RNN), Generative adversarial
    networks (GAN), Convolutional Neural Network (CNN) [5].


    Diro A and Chilamkar S (2018) proposed Deep Learning for the detection of small
    network attacks because of its self-thought and compression capabilities. Fog
    IoT architecture is implemented to reduce the storage and complex complexities
    from resource constraints IoT devices. Author focus is to explore the performance
    of classes of attacks (DoS, DOS, probe...). The proposed model achieved an accuracy
    of 98.27%, detection rate of 96.5% and false alarm rate of 2.57%. Deep learning
    also found better than Shannon Learning in terms of performance metrics [10].


