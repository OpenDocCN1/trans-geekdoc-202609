    The Internet of Things (IoT) facilitates connecting massive group of devices into
    networks for an ever-growing number of applications. There has been a rapidly
    increasing number of devices in years which is expected to reach 24 billion by
    2022 [1]. IoT exists over vast spectrum of applications like smart cities, smart-grids,
    smart-farming smart environment which touch every aspect of our present day life.
    With a broad range of IoT applications comes issue of privacy and security. Without
    securing IoT, there will be special security challenges throughout many areas
    of life from home, automobiles and critical infrastructure.


    TABLE I. DESCRIPTION OF CRITICAL SECURITY ATTACKS THAT EXIST AT I LAYERS


    | Critical attacks that exist at IoT layers | Description |

    |---|---|

    | Denial of Service (DoS) | The attacker overwhelms the server with redundant
    requests which IoT devices in getting response |

    | Man-in-the-Middle | The attacker-in-middle intercepts the communication or alters
    data communication between IoT devices by jamming and spoofing signals |

    | Spoofing | Attacker impersonates an IoT device with selfish identity to gain
    illegal access and crashes the server by DoS and man in middle |

    | Jamming | A DoS attack ,which malicious nodes send fake signals to interrupt
    the learning, causing communication interference |

    | Eavesdropping | When unauthorized party senses, modifies and deletes the information
    transmitted over a network |

    | Software attacks | Malicious software such as Malware, Trojans, and worms use
    user personal information or causes malicious damage leading to performance degradation
    of IoT systems |


    Machine learning is a branch of Artificial intelligence that enables systems to
    learn from experience and improve performance without being explicitly programmed.
    Machine learning promises to secure IoT devices from various security more efficiently
    compared to traditional methods.


    This paper describes architecture of IoT and gives information about the security
    attacks affecting the various IoT layers. Machine learning algorithms for prediction
    of attacks and for enhancing IoT security has been discussed in this paper.


