    **Abstract—** Internet of Things facilitates connecting massive group of devices
    into networks for an ever-growing number of applications. The current and future
    IoT holdings promise to improve convenience and comfort for the user by various
    types of threats namely Denial of Service (DoS), Man-in-the-Middle spoofing, Eavesdropping
    and software attacks. These threats present serious challenges. We discuss major
    security threats that exist at IoT and review Machine Learning based IoT systems
    with Supervised Learning.


