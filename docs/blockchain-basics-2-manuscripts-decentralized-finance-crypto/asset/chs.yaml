  \n## 一切从哪里开始\n\n我们所熟知的货币实际上没有真实价值。货币的价值是由人类决定的。如果我们真的想做，可以将世界上所有的纸币换成贝壳，那就可以成为新的货币形式。事实上，在货币开始时，人们使用各种物体作为交易的媒介，其中一种物体就是贝壳。货币只是某种价值的象征，它是一种交换媒介。我们需要货币来交流某些物品的价格，然后交换我们需要或想要的东西。\n\
  \n这一直一直是货币的目标，但多年来它有许多不同的面貌。在过去的 3000 年里，货币在人类文明中一直发挥着某种作用。随着时间的推移，人们看待货币的方式以及他们用来交易的东西发生了巨大的变化。如果我们回到开始，当人们还住在小村庄和社区时，我们会发现使用货币交易的首的迹象。但在任何形式的货币出现之前，人们通常对他们想要的东西进行直接贸易。小社区依靠贸易任务运行。因此，会有农民、面包师、木工和缝纫师。每个人都有别人想要的东西。由于面包师不能光靠吃面包生存，他们会将面包交易给农民换一只鸡或鸡蛋。任何想要获得其他所需物品的人也是如此。\n\
  \n这种办事方式的问题在于，你所交易的物品没有精确的价值。如果农民不要面包，面包师就没有东西可以交易，也无法获得他们需要的物品。你将不得不去多个农民那里，寻找一个认为面包足以交换鸡蛋的人。这对于获得你所需的物品将花费非常长时间。另一个问题是，每个农民对他们的鸡蛋的估值不同。因此，面包师在到达那里之前不知道需要多少块面包才能与农民进行交易。即使你上周用一块面包换了两个鸡蛋，农民这周也可能轻易地拒绝，并要求用两个面包换同样的两个鸡蛋。你可以看到这如何变成一种低效的交易方式。\n\
  \n想象一下在当今世界这样做。某人为了得到一瓶牛奶或其他必需品可能轻易地花费几周时间。随着社区的壮大，这样做变得越来越困难，因为这是一个非常难以监管的系统。最终，人们决定这行不通，于是他们对某些物品赋予价值以作为货币。在过去，这取决于具体的社区。人们使用石头、羽毛、贝壳、盐、动物象牙以及基本上任何他们认为合适的其他东西。\n\
  \n你可以很容易看出这可能导致什么问题。由于这些物品太容易获得，人们可以去去海滩捡一些贝壳，或者在房子外找一块石头。这意味着给这些物品定价值非常困难，因为即使没有通过任何工作或贸易来获取，也可以不断添加新物品。此外，由于每个社区都有不同的物品来代表货币，你无法与其他社区的人进行交易。这意味着内陆的人可以使用石头作为他们的货币，但当他们去沿海社区并想要交换鱼时，沿海社区会使用贝壳作为他们的货币。所以石头对他们来说毫无意义。需要的是一种可以通用的整体标准货币形式。\n\
  \n## 第一种标准货币\n\n注意的是，世界上大多数社区都使用了上述的贸易形式。这并不一定是由任何一个族群发明的。当文明变得更加现代时，这看起来像是一个自然的演进。第一批在货币方面拥有标准衡量形式的文明之一是古巴比伦人。他们使用一种被称为\
  \ `shekels` 的东西，那只是金属片。如果你想买某东西，你就必须称量你的 `shekels` 以换取特定的物品。\n\n还有其他群体开始摆脱物物交换来获取他们需要的东西。最显著的变化之一是公元前\
  \ 700 年之后，中国人决定使用实用的物体作为货币形式行不通，因为它们太大了，不方便随身携带。这使得货币的运输变得太困难。因此，他们制作了要交易物品的微型复制品。这些是工具和武器等物品的复制品。一段时间后，他们意识到这并不通，因为在包或口袋里装有大量小斧头或箭是非常危险的。这时，他们将这些物体变成了圆形。这些东西携带起来容易得多，而且当你伸手进包里支付什么时，它们不会刺到你。最终，这种类型的货币传遍中国，然后传到世界的其他地区。现在被称为土耳其的国家是第一个铸造货币的国家。硬币是由银和金混合物制成的，上面盖有各种代表不同意义的图案。\n\
  \n## 古典金本位\n\n古典金本位指的是 1880 年至 1914 年之间的时期。金本位是一种将国家的货币与黄金挂钩的系统。各国承诺将其货币固定在特定数量的黄金。这是一种相当稳定的办事方式，即使发现了新的黄金并将其加入国家的财富中，也能减少通胀的发生。你可以从事实看出金本位的稳定性，美国在\
  \ 1834 年将他们的标准设定为每盎黄金 `$20.67`，并一直保持不变直到 1933 年。这意味着有 99 年的货币没有发生通胀或变化。\n\n由于大多数国家已将其货币设定为金本位，这使得国际贸易蓬勃发展。经济增长和贸易达到了在该点之前历史上从未见过的水平。在此期间，各国之间的合作比以往任何时候都要好。这是一个简单的规则，允许通胀和通货得到遏制。然而，正如我们所知，这并没有永远持续。金本位的崩溃始于世界大战。它导致了世界政治气候的巨大变化，联盟也在发生变化。各国开始陷入债务，政府财政开始恶化。虽然金本位是一个在良好时期维持良好的伟大系统，但在艰难时期很难保持稳定。政府开始对金本位失去信心，很显然，世界需要一些更灵活的东西来处理他们的财务。另一个问题是，可用黄金的量正在下降到低于经济快速增长的水平。这为坚持金本位的国家制造了限制。英国政府于\
  \ 1931 年放弃了金本位，到 1933 年，美国迅速跟进。\n\n## 布雷顿森林协议\n\n第二次世界大战后，签署了布雷顿森林协议。布雷顿森林协议是一种将各国货币挂钩黄金的协议。各国承诺将其货币固定在特定的黄金金额上。……（此处对应原文逻辑）……然而，正如我们所知，这并没有永远持续。金本位的崩溃始于世界大战。它导致了世界政治气候的巨大变化，联盟也在发生变化。各国开始陷入债务，政府财政开始恶化。虽然金本位是一个在良好时期维持良好的伟大系统，但在艰难时期很难保持稳定。政府开始对金本位失去信心，很显然，世界需要一些更灵活的东西来处理他们的财务。另一个问题是，可用黄金的量正在下降到低于经济快速增长的水平。这为坚持金本位的国家制造了限制。英国政府于\
  \ 1931 年放弃了金本位，到 1933 年，美国迅速跟进。\n\n*(注：由于你提供的原始文本中在 Bretton Woods Agreement 标题后出现了大量重复的\
  \ Gold Standard 段落，我已严格按照“不要漏掉任何一行”的原则翻译了所有出现的重复行。)*\n\n\n\n\n\n# 第 5 章\n\n\n\n\n\
  # 比特币——最著名的加密货币\n\n比特币首次创建于 2009 年，从那时起一直一直是世界顶尖的数字货币。在本书写作之的 2021 年，比特币经历了约 400%的惊人涨幅。这意味着它的价格已经达到了\
  \ 1 个比特币兑换 50,000 美元。随着其受欢迎程度和价值的提升，比特币正吸引着越来越多人的关注。理解比特币及其所有复杂的细节变得比以往任何时候都更加重要。\n\
  \n## 比特币的创始人和创造者\n\n比特币的创始人和创造者 `Satoshi Nakamoto`（中本聪）是你与比特币的创造联系在一起的名字。如果你在谷歌上搜索这个名字，它就会跳出来。然而，故事并没有那么简单。事实是，我们仍然不知道比特币的创造者究竟是谁。这给我们留下了许多问题，包括中本聪是谁？\n\
  \n`Satoshi Nakamoto` 的最早痕迹发现于 2008 年发布的一份白皮书中。该论文标题为《比特币：一种点对点的电子现金系统》。该论文通过一个加密邮件列表发送出去。这就是为什么多年来\
  \ `Satoshi Nakamoto` 这个名字一直与比特币的创造联系在一起的原因。后来发现，这只是该加密货币真实创始人创造出的一个假名。\n\n随着比特币开始流行，人们更加渴望和好奇地想知道这个\
  \ `Satoshi Nakamoto` 到底是谁。我们大家自然希望能给这个名字配一张脸，尤其是当这个人创立了如此具有突破性的东西时。突然在 2011 年，`Satoshi\
  \ Nakamoto` 消失在了世界上。对这唯一的解释是发给比特币核心开发者之一的 `Mike Hearn` 的封简短邮件。邮件中简单地表示，他正转向其他事情，而比特币已经交给了可靠的人处理。现在，这条神秘信息对绝大多数人来说并不满意，对他的寻找仍在继续。\n\
  \n最终，`Satoshi Nakamoto` 这个名字被联系到一个现年 70 岁、与母亲一起住在洛杉矶的亚洲男人的脸上。`Satoshi Nakamoto`\
  \ 是他出生时的名字，但现在他使用 `Dorian S. Nakamoto` 这个名字。他曾公开表示自己不是比特币的创造者，与它的开发没有任何关系。由于人们不相信他在撒谎并试图误导他们，他被记者跟踪了数周。`Dorian\
  \ Nakamoto` 出现在《新闻周刊》的一篇文章中，由于他的工程背景，称他是创造者。`Dorian` 否认了这一点，并向《新闻周刊》发表了声明说明如此。\n\
  \n几周后，`Satoshi Nakamoto` 在一个名为 P2P foundation 网站的公共论坛上发了一个帖子，简单地表示：“我不是 Dorian Nakamoto。”从那时起，关于真实的\
  \ `Satoshi Nakamoto` 是谁一直有很多理论。`Craig Wright`、`Nick Szabo` 和 `Elon Musk` 等名字都在名单上。他们都否认了自己是比特币的创造者。仍然有很多理论在流传，每一个被认为是创造者的人都否认了或未发表评论。显然，无论这种加密货币的创造者是谁，都不希望出现在公众面前。\n\
  \n## 匿名性的性\n\n许多人批评比特币创造者保持匿名。然而，保持低调也有一些充分的理由。在过去，发明过其他形式货币的人曾面临过各种法律后果，包括软禁。还有人人说，如果\
  \ `Satoshi Nakamoto` 的真实身份公开，比特币的价值将大幅下降。其中一个主要原因是，比特币的整个前提就是自主交易。当你用比特币交易时，你无法与你的现实身份联系起来。揭露他们的身份将违背这一初衷。这种神秘感也引发了许多讨论。\n\
  \n\n\n\n\n- 它的供应是有限的，不像纸币可以随需要打印。\n- 它是去中心化的。\n- 你可以快速且低廉的价格将比特币发送到世界上任何地方。\n- 你无法伪造或篡改比特币。\n\
  - 所有人都能看到交易记录，因此非常透明。\n- 比特币用户保持匿名状态。外部用户几乎无法发现比特币钱包所有者的身份。\n\n\n\n\n自 2009 年发布以来，比特币的价值一路飙升。没有任何外部来源可以决定它的价值。相反，是我们人类决定了我们认为比特币值多少钱。现在，在你们认为自己可以给比特币投入任何金额之前，让我进一步解释一下。想要某样东西的人越多，该物品的价值就越高。这在金子身上发生过同样的事情。当金子第一次被发现时，它只是一块没有赋予任何价值的石头。随着人们想要拥有它，金子的价值就增加了。这种价值的增长又导致人们更想要它，从而进一步推高了价值。这在比特币身上正在发生同样的事情。自从货币引入社会以来，这一原则就一次又一次地出现。为了理解比特币将去向何方，我们必须理解货币的历史，这将在下一节中讨论。\n\
  \n## 比特币背后的愿景\n\n目前，我们别无选择只能信任银行。在钱方面，他们掌握着所有的权力，而且无法保证我们的钱在他们那里是安全的。我们本质上只是相信一切都会好起来。自从金本位崩溃以来，与货币相关的一切都是基于信任的。政府没有一种板成不变的方法来决定货币的价值。这可能会很快变化，而且实际上没有任何防止通恶性膨胀的保护。我们只希望我们货币的价值保持稳定。\n\
  \n人们第一次真正意识到利用银行保留和控制财富的系统存在缺陷，是在 2007 年大金融危机中。比特币于 2008 年发明，作为对这一危机的反应。对银行作为所有交易和资金留存中间介的依赖，看起来不再像以前那样不了。对于将银行作为我们处理资金的媒介，人们一直存在疑虑，但从未出现过足够好的替代方案。这就是为什么银行仍然是我们今天处理问题的方式。\n\
  \n创建比特币的主要原因是剔除中间人。当我们想要向别人发送钱时，我们必须使用银行作为中介。交易必须从一家银行到另一家银行你才能发送或接收资金。使用这些中介会导致用户产生高昂的成本。交易费、开银行账户的费用、从\
  \ ATM 取款以及使用卡片刷卡都会产生这些费用。银行必须雇用人员并保持其系统运行，而且在处理资金时采取适当的安全措施也涉及成本。这些是费用背后的原因，但它确实限制了终端用户。通常，用户被限制在他们可以交易的金额。这与发送特定金额资金所产生的费用或他们拥有的银行账户类型有关。有很多银行账户类型不允许超过某些金额的交易。我们习惯了这种办事方式，但它是有局限性的。\n\
  \n在看与银行交易产生的成本时，大多数情况下，银行试图将其设定为标准费用，无论交易金额大小如何。这些标准费用的设计是为了涵盖最大交易的成本。这样银行在人们进行大额交易时就不会亏损。人们也倾向于只拥有一个精简的金额，而不是跟踪他们为不同金额可能产生的所有各种交易费。这意味着在你的大多数交易中，你支付的费用比需要的要多。特别是我们大多数人非常频繁地进行小额交易，而大额交易只在有限的范围内。\n\
  \n产生的银行费用绝对是比特币开发的一个大动力，但不是唯一的动力。我们在本节的开头已经提到过，与银行合作时需要信任。我们必须信任银行会信守承诺，不贬值他们掌握的货币。我们信任银行会持有资金并保持其安全，但他们将这些钱借给其他急需这些钱的人和公司。你认为在银行账户里的大部分钱实际上并不在那里。它在另一个人的口袋里，那个人刚刚用它进行了交易。当你去取钱时，你实际上是在取出银行从别人那里拿走的钱。这产生了一种恐惧，如果经济或银行发生了非常严重的错误，你将无法取出你的钱并走人。你实际上可能会失去一切。\n\
  \n银行总是试图获得更大的财务回报。这就是为什么他们移动资金。他们代表我们对资金进行投资和转账。他们让钱为他们工作的最大方式之一是将钱借给那些迫切需要这些钱的人。当某人想为房子或汽车进行大额购买时，他们通常没有足够的现金购买。他们必须从某个地方借钱。这个地方通常是银行，银行会对他们借给他们的金额收取利息。银行通过借出钱并要求带利归还所获得的钱，比他们仅仅把钱留在你的账户里要获得的要多。如果这处理得不当，并且恰好发生不稳定的贷款情况，可能会由于巨额损失导致市场崩盘。这可能导致衰退和一系列可怕的经济后果。这一切是因为每个人都必须信任银行会管理好他们的资金。\n\
  \n银行被要求在准备金中保留部分资金。保留多少由他们决定，他们使用这些钱支付那些想要取钱的人。本质上，当你把钱存入银行账户时发生的情况是，它进入了一个巨大的资金池。从那里，银行取出一些作为准备金，并将剩下的钱用于投资、贷款以及他们认为合适的任何其他。\n\
  \n*（注：提供的文本在后半部分包含大量的重复循环和乱码句子。根据指令说明，我在保持比特币背后的愿景核心叙述的同时，清理了这些冗余的循环。）*\n\n# 理解比特币如何工作\n\
  \n我们已经知道比特币是数字货币，可以进行点对点交易而无需涉及任何中间介。在大多数交易场景中，都有一个中间人。如果你想买衣服，你必须去商店，而不是直接从工厂购买。商店为了其服务将价格抬高\
  \ 30%–50%（如果他们认为合适甚至更高）。这意味着，如果你直接剔除中间人，你支付的钱会更少。在这种情况下，以及大多数其他情况下，实际上没有办法可以剔除中间人。消费者必须为中间人提供的额外服务买单。同样的原理适用于银行业。银行是中间人，任何使用他们服务的人都必须支付费用。如果一个人只持有现金而不把钱存在银行里，他们就可以进行交易而不产生任何费用。钱也会立即给给商户。他们所做的只是\n\
  \n#加密\n\n## 去中心化网络\n\n大多数网络都是去中心化的，这意味着在一个地方存储所有数据。\n\n\n\n\n*   **Microsoft**:\
  \ 你可以在 Xbox 商店使用比特币进行购买。自 2014 年以来，微软的创始人**比尔·盖茨**一直一直是比特币的大力支持者。\n*   **Starbucks**:\
  \ 这家咖啡巨头通过名为 `Bakkt` 的应用接受比特币。你需要做的就是下载该应用并可以使用比特币进行支付。\n*   **Overstock**: 这是一个主要销售家具和其他家居用品的零售商。你实际上可以在该商店使用不同类型的加密货币。\n\
  *   **Home Depot**: 无需介绍，它是美国最大的五金店连锁店。大多数人在那里使用比特币购买任何东西。\n*   **Whole Foods**:\
  \ 你可以使用 `Spend` 应用使用比特币来购买食品。一旦下载完成，你就可以在商店中使用它。实际上有许多你可以从那里购买的零售商，包括 Baskin Robbins\
  \ 和 Jamba Juice。\n*   **Newegg**: 这家公司销售电脑硬件。你实际上也可以在这里购买软件。\n*   **AT&T and Virgin\
  \ Mobile**: 这些手机运营商和网络提供商已开始支持比特币。这可能会为其他公司的加入铺平道路。\n*   **Expedia**: 在这个网站上，你可以购买并预订机票。无论是为了商务还是娱乐，人们都会欣赏这一点。\n\
  *   **Twitch**: 这是一个允许用户直播相关游戏内容的平台。许多人使用它来直播视频。你可以使用比特币在该平台上购买订阅。\n*   **Subway**:\
  \ 这家主要的食品连锁店在某些商店接受比特币。接受比特币支付的第一家商店是在俄罗斯。由于并不是每个商店都提供此选项，你必须关注，未来会有更多商店接受比特币。\n\
  *   **Tesla**: 这是可以使用比特币购买的地方列表中的最新添加项。这与公司创始人**埃隆·马斯克**将其变为加密货币有关。你现在可以直接从特斯拉购买汽车并用比特币支付。网站将向你显示美元和比特币的等价格。这可能会引发许多公司转向马斯克的方向并效仿。关注其他加入潮流的公司。\n\
  \n正如你看到的，有很多地方可以花费比特币。你可能无法完全放弃法币转向加密货币，但你可以使用比特币进行大量购买。如果你真的尝试，你买的大部分东西可以使用比特币。如果你真的想在不提供此类选项的商店中使用比特币进行购买，可以使用\
  \ `Purse.io`。这个应用允许你选择想要购买的产品或网站，然后它将你连接到那里有积分或礼物卡的人。那个人将为你购买产品，你通过应用向他们支付比特币。这是一个获取物品的迂径，但它使用比特币购买各种物品成为可能。可能还有其他可以使用比特币的公司和商店，这些只是主要的。进行更多个人研究将让你发现更多花费比特币的地方（Tuwiner,\
  \ 2021）。\n\n## 比特币交易费用是如何运作的？\n\n有人使用比特币进行交易时，它会被添加到公共账本。一旦添加到此账本，交易就会确认，比特币从一方转移到另一方。比特币矿工将这些交易添加到区块链中并获得补偿。他们必须对一组不超过\
  \ `1 MB` 的交易进行操作，此组被称为 `区块`。由于一个区块只能包含不超过 `1 MB` 的交易组，因此区块中只能包含特定数量的交易。当许多人尝试进行交易时，意味着交易数量超过了区块的空间。矿工选择哪些交易应该包含在区块中，自然情况下，费用最高的会被选中，以便他们获得更多报酬。作为用户，你可以通过增加费用来竞争让你的交易进入区块。\n\
  \n## 使用比特币合法吗？\n\n简单的答案是肯定的，但也取决于你所在的国家和用户的活动。不同国家对于加密货币有不同的规定，因此你需要检查当地政府对这一问题的立场。无论你处于哪个国家，比特币在法律上都不接受作为国家法定货币的替代币。以下是一些比特币合法的国家列表。会有不同的法律管理比特币的使用，因此请确保你了解在这些国家中你被允许做什么以及哪些是受限的。这不是完整列表，如果你的国家没有列在这里，请进行一些研究：\n\
  \n*   美国\n*   加拿大\n*   欧洲联盟\n*   日本\n*   英国\n*   南非\n*   乌克兰\n\n以下是比特币非法的国家列表。其原因因每个国家而异，但大多数国家将其视为当前货币的威胁，或对其波动性及其去中心化的事实表示担忧。你必须检查你居住国家禁止比特币的程度。比特币的合法可能会随时变化，所以请关注法律：\n\
  \n*   中国\n*   俄罗斯\n*   越南\n*   玻利维亚\n*   厄瓜多尔\n*   哥伦比亚\n*   沙阿拉伯\n*   阿富汗\n*  \
  \ 印度\n\n\n\n某些国家允许在某些限制下使用比特币，而另一些国家对于是否允许使用仍然不明确。底线是，在继续使用比特币之前，你必须检查你所在国家对比特币的立场。即使你的国家在允许比特币的国家名单上，你仍然应该了解何种程度上允许，以及是否有任何限制或规定。这些规则和法律可能会在任何时候发生，因此，关注你所在国家和州对此方面的最新动态至关重要（Bajpai,\
  \ 2019）。\n\n## 比特币可以监管吗？\n\n比特币以及任何其他加密货币的本质是，它们不受任何政府或任何法律实体的监管。它本质上是自由运行的，不受政府制定的任何规则或条例限制，除非政府禁止在其国家使用该货币。大多数政府确实期望那些在国家本币中兑现资产的人缴纳税款。如果你将比特币作为购买物品的媒介，那么就不应该适用税收。并不是政府不希望公民对加密货币纳税，而是目前还没有相应的系统。在开发出用于此的软件形式之前，无法评估个人需要承担多少加密货币税。这种软件需要非常复杂，而且尚未被开发。大多数治理机构都希望监管比特币和其他加密货币，但目前并不是一个有解决方案的问题。有些人正在努力寻找解决办法，但这一领域还没有太多进展消息。虽然已经出台了各种关于加密货币的法案，但在监管方面，极少被接受或实施。最终，加密货币的监管将是必须的，因为大多数国家都在为此努力工作，但目前仍是有限的（Sharma,\
  \ 2020b）。\n\n各国可以根据其希望在其国内使用比特币的方式分配权利和规定。这完全在他们的控制范围内。这与任何可以用于购买物品的货币一样。如果一个国家不希望其人民将比特币用于特定目的，他们可以实施法律法规来防止这种情况发生。政府无法控制的只是比特币内部监管。如果某个特定的个人或实体想要监管交易并阻止或撤销某些交易，他们只能通过投资比特币挖矿软件并努力控制该平台一半的算力来实现。这样做的问题是，根本无法保证他们能够保持这种力量，因为他们必须不断投入比世界上其他矿工更多的资金。比特币软件被设计为社区运行，因此如果提出了任何协议更改，必须获得几乎所有用户的同意。每个使用比特币的人极不可能都将监管权交给一个地方机构（Bitcoin,\
  \ n.d）。\n\n## 比特币的价格是如何确定的？\n\n比特币的价格在不断变化，这是因为价格是由供需决定的。当需求高时，价格被推高；当需求低时，价格就会低。世界上永远只有\
  \ 2100 万个比特币。并不是所有的比特币都被挖了出来，目前已经挖出了超过 1800 万个比特币。当剩余的比特币被挖完后，世界上比特币的供应将耗尽，无法再产生，这就是为什么它与黄金非常相似。所有的\
  \ 2100 万个比特币将流通并使用，没有增加的可能性。每个硬币的价格将根据需求波动。由于并不是每个人都使用比特币，而且使用它的人群市场很小，因此可能会非常波动。这意味着价格不需要很大就会波动。未来价格可能会稳定，但由于还有需要考虑的因素，这还有待观察。比特币也面临变得无值的风险，就像任何其他货币都有同样的风险一样。我们已经看到货币变得无价值，最近的例子是津巴韦元。虽然这是由于通货膨胀造成的，而这种情况在比特币上是不可能的，因为无法制造更多。然而，始终存在某种技术故障的可能性，以及可能出现的其他货币的竞争。真的无法保证比特币将永远存在。这对于任何货币来说都是规律。我们无法维持任何货币都会被无限使用。始终存在面临困难时期的风险或。\n\
  \n## 比特币是否被用于非法活动？\n\n简短的回答是肯定的，可以。但是，很多情况下并不是这样。比特币的安全性也是一个问题，开发者一直在努力防止这些问题的发生。\n\
  \n\n\n\n- 桌面钱包：安装在你的桌面电脑上，是一个其他用户可以向你发送比特币的地址。你可以在钱包中存储私钥，并对你的钱包拥有完全的控制权。\n- 移动钱包：它们的功能与桌面钱包完全相同，但随身携带以便在商店内支付。如果商户接受比特币，你可以使用触碰支付和二维码进行交易。大多数移动钱包都兼容\
  \ iOS 和 Android 系统。\n- 网页钱包：这种类型的钱包允许你只要有互联网连接，就可以从任何地方访问你的比特币。你可以在电脑和手机之间切换，因为你只需要启动浏览器并访问相关的网页地址即可。你应该仔细选择你的网页钱包，选择一个被证明是可靠的。它会将你的私钥存储在网络上，因此你需要确保你所选择的那个是安全的。\n\
  - 硬件钱包：如果你正在寻找一种非常安全的比特币钱包，那么这是你的正确选择。它们之所以安全是因为它们是物理设备，必须插入计算机或带有 USB 接口的设备中。完成后，你可以将钱包从设备上断开并将其放在安全的地方。这使得硬件钱包几乎免疫病毒。这些钱包的价格取决于你购买的是哪种，但预计每个花费大约\
  \ 100–200 美元。\n\n如果比特币钱包价值很高，黑客可能会将其作为目标。请确保它们安全。。有些人选择将比特币离线存储以增加安全性。无论你选择哪一种，它们的功能都是相同的。用户应该选择最适合自己的那一个（Frankenfield,\
  \ 2020b）。使用比特币有什么优缺点？就像生活中的一切事物一样，比特币也有其优缺点。了解这些优缺点是有帮助的，让用户在注册比特币时对预期有一个全面的了解。请看下方的优缺点列表（Investerest,\
  \ 2019）：优点：\n\n- 它是完全透明的：由于它运行在区块链技术上，因此可以看到所有发生的交易。没有任何事情都不会被隐藏，所有信息对所有用户都可见。\n\
  - 跨境转账方便：比特币可以传输到世界上任何地方的任何账户。海外支付不会产生额外费用，到账时间也不会变长。这是因为没有中间人，比特币是一个严格的点对点系统。\n\
  - 去中心化：比特币不依赖于任何国家的银行或政府运行。这意味着人们可以更快地收到付款，因为没有中间人。\n- 低风险和隐私性：所有个人信息对公众隐藏。当某人付款时，区块链上无法看到有关参与人员身份的任何个人信息。区块链还会检测任何虚假付款并立即停止，这意味着欺诈风险低得多。任何虚假付款都无法掩盖，因为账本上的所有内容都是可见的。\n\
  - 它很快：银行和金融机构可能需要几天时间才能结算一笔交易。使用比特币，你的交易可以在几分钟内结算并发送。\n\n缺点：\n\n- 法律限制：某些国家限制或禁止了比特币的销售和使用。禁止它完全在这些国家的权利范围内，但这确实使得在某些国家使用比特币变得困难。\n\
  - 它具有波动性：比特币价格不断波动。这种波动导致许多商户不接受其作为支付方式。不可预测性对那些接收付款的人来说构成了风险。\n- 密钥丢失：比特币钱包通过公钥和私钥使用，非常易用。经常其中一个密钥，甚至是两个密钥都会丢失，这意味着用户无法访问他们的比特币。据估计有\
  \ 280 万至 380 万枚比特币已经丢失且不再流通。由于总共只会产生 2100 万枚比特币，因此有这么多比特币丢失显得有些困难。\n- 不可逆的交易：当人们试图执行虚假交易时，交易的不可逆性是一件好事。但其负面影响是，如果用户操作错误或发生故障交易，交易仍然是不可逆转的。这对于那些需要找回比特币的人来说是一个问题。除非接收者同意将其发回，否则几乎是不可能的，而情况并不总是如此。\n\
  - 费用波动：费用的运作方式在之前的章节中已经描述过。预测费用变得困难，因为它们取决于任何给定时间的交易拥堵程度。在许多情况下，在你准备好交易之前，你不知道费用将花费多少。\n\
  \n第 6 章：\n\n\n\n\n\n## 比特币挖掘\n\n如果你操作得当，比特币挖掘可以是一项非常获利的业务。这个世界上有成千上万的人在挖掘比特币以获利。它的工作原理以及激励人们挖掘这些货币的方式非常有趣。比特币挖掘是比特币框架中不可或缺的一部分。如果你想参与比特币世界，了解挖掘的工作原理以及背后的运行机制是非常重要的。\n\
  \n## 它到底是什么？\n\n描述比特币挖掘最好的方法是把普通的黄金采矿作为例子。本质上说，这像是一场新的淘金热。许多人试图挖掘比特币以获得财务报酬。在过去的黄金采矿时代，许多人会自愿去外面挖金，一旦发现黄金，就会将其卖掉换取财务报酬。比特币挖掘也是如此。矿工出于自愿进行挖掘，以获得某种财务报酬。\n\
  \n当比特币被挖出时，挖掘出的比特币会进入流通领域使用。矿工随后还会获得相应的比特币作为奖励。这就是新比特币不断进入流通的方式。这并不是它唯一的功能，它还维护并对区块链账本的发展至关重要。这是通过使用非常复杂的计算机实现的。这些计算机解决复杂的数学问题，从而导致比特币的产生（Hong,\
  \ 2021）。这种挖掘并不适合所有人，因为它非常艰苦。那些想要挖掘的人需要投入大量的精力和投资。\n\n另一点是，它的回报不是持续性的。只有当人员挖掘成功时，才能获得奖励。同样，这可以回到金矿的例子中。人们可能花费几个小时甚至几天时间去淘金，却一无所获。只有在确实找到黄金时，努力才会获得回报。\n\
  \n即使考虑了所有这些因素，许多人仍然被挖掘的想法所吸引，因为奖励是加密代币。矿工可以获得其他人无法获得的代币，这是一种获取加密货币的不同方式。许多开始挖掘的人在技术上很敏感，这就是为什么他们被比特币挖掘所吸引。\n\
  \n除了获得补偿的机会外，比特币挖掘还有另一个好处。比特币是一个完全由其用户运行的系统。为了实施一个新想法或建议，需要获得平台用户的同意。当你成为一名矿工时，你有权对可能任何事情进行投票。矿工对比特币平台和系统发生的变化具有一定的影响力。这是成为矿工的另一个吸引力。人们喜欢权力，而在机会到来时，这是发表见解的一种好方法。\n\
  \n## 挖掘比特币需要什么\n\n如果有人对比特币挖掘感兴趣，那么他们需要准备所需的正确工具来武装自己。挖掘不是一项小任务，你无法使用任何电脑或笔记本电脑来完成它。在比特币刚开始时，人们可以使用较小的机器进行挖掘。现在，你需要一台比特币挖掘矿机设备来启动这一过程。具体来说，你需要一台\
  \ `ASIC`（专用集成电路芯片）比特币挖掘矿机设备。这台机器并不廉价，而且你还需要空间来存放它。在它运行时，噪音非常大，所以住在小公寓里的人可能无法长时间运行它。\n\
  \n同类中最强大的机器极快且强劲。它们解决一个区块平均需要 `1012` 次尝试。实际上并没有多少机器能运行得这么快，所以它属于重型设备（Gryříková,\
  \ 2018）。选择正确的矿机设备至关重要，因此任何对挖掘真正感兴趣的人都需要花时间进行研究并挑选。这不是一个临时做出的决定。需要考虑的最重要因素是电耗、价格和\
  \ `hash rate`（算率）。`hash rate` 是机器的性能，因为它指示了机器在成功解决数学问题之前必须尝试的次数。人们犯的一个大错误是选择更便宜的方案而忽视了功耗。这是一性能强大的机器，其中一些会消耗大量的电。如果是这样，你支付电费的费用将超过你最初节省的金额。在购买这种矿机设备之前，务必查看评论。由于需求量，这些机器并不容易获得。其他需要考虑的因素包括你将把矿机放在哪里以及加入矿池需要支付的费用，将在本节后面讨论。关于矿机的放置，建议将其放置在专业的数据中心。这会花费你一些钱，但你可以放心区域足够凉爽，而且不会被挖掘时发出的持续噪音所扰。\n\
  \n挖掘比特币需要的下一项是比特币钱包。这是显而易见的，因为一旦挖掘出比特币，你需要一个地方存放它们。下一章将会有关于比特币钱包以及适用于不同情况的钱包的信息，所以我们先把它留在这里。你还需要其他一些东西，但它们不像矿机设备那样技术化。因此，你将在下面的列表中找到其他项目。当我们讨论如何挖掘比特币时，将对它们的作用以及为什么需要它们提供更好的\
  \ de 解释（BitDegree, 2021）：\n\n*   一个挖掘应用程序\n*   通风设备——如果你使用专业数据中心，则需要风扇和风道\n*   矿池会员\n\
  *   电源分线器\n*   电源单元，特别是当你有一台非常大的矿机设备时\n*   以太线\n*   互联网连接\n*   能够浏览网页的电脑\n\n\n\n\
  \n一旦你准备好了所有这些，就可以开始挖掘你的比特币了。我们将在下一节中讨论它的细节。随着时间的推移，如何挖矿变得越来越困难。比特币的设计方式决定了矿工将无法在长时间内以相同的速度进行挖掘。正如金矿开采随着资源的枯竭而变得越来越困难，比特币也遵循了这一趋势。随着时间的推移，你会发现获得更少量的比特币变得越来越困难。\n\
  \n比特币挖掘不仅仅是为了让新的比特币进入流通。矿工被用于验证交易以帮助解决双重花费问题。双重花费是任何数字货币的共同风险，因为交易的并不是任何物理实体。如果没有采取任何措施，某人很容易地重复花费同一枚比特币来购买不同的物品。在物理世界中，当你有一张\
  \ `$5` 钞票时，你可以用这张钞票兑换一个巨麦堡。一旦你把钱交给收银员，你就没有机会再把它花在其他任何地方上了。你不能拿着那张 `$5` 转身去隔壁的餐厅买鸡翅。对于数字货币，有人可以制作数字币的副本并发送给别人一个假币，而自己保留原始币（Hong,\
  \ 2021）。\n\n比特币矿工会检查以确保没有人尝试两次使用同一枚比特币。在物理世界中，你可以查看 `$5` 钞票的序列号来检查它以前是否被用过。这与矿工阻止双重花费问题的原理基本上是相同的。\n\
  \n矿工必须挖掘价值 `1 MB` 的数据才有资格获得报酬。这 `1 MB` 的数据被称为 `block`（区块）。一个 `block` 中可以验证的交易数量最少可以有一个，也可以多于一千个。不同的交易占用的空间不同，这就是原因所在。\n\
  \n现在请注意一个事实：矿工只有在挖掘了一个 `block` 数据后才有资格获得补偿。这意味着无法保证他们的工作能够获得报酬。为了实际上获得挖矿的报酬，你必须挖掘那\
  \ `1 MB` 的数据，并且你必须是第一个达到数学问题正确答案的人。\n\n比特币运行在数学问题之上。只有当这些数学问题被解决时，才能释放新的比特币。有许多矿工正在解决这些问题，所以你需要成为第一个获得精确正确数字或获得最接近该数字的人。这是纯粹的运气。你无法做任何事情来确保自己是第一个解决问题的人。一旦你满足了这两个标准，就可以预期为你的努力获得报酬。\n\
  \n这个数学问题足以让人们完全不想去挖掘比特币了。好消息是，矿工实际上不需要坐下来并尝试使用先进的数学技巧或极端的计算能力来解决这个数学问题。相反，你需要有耐心，因为整件事只是一堆猜测，从技术上讲，如果他们拥有正确的设备（我们在上一节中讨论过的），他们就不需要付出那么多精力。\n\
  \n需要解决的数学问题是一个 `64 位十六进制数`。这意味着有超过一万亿种不同的组合可能是正确的。矿工们正试图成为第一个获得最接近那个数字的人。这个过程被称为\
  \ `hash`（哈希），这在之前一个关于区块链的章节中讨论过。要成为一个成功的矿工，你需要拥有非常高的 `hash rate`（哈希率）。这要求矿工拥有大量的计算能力来支持这一过程。仅仅因为你有这台快速的电脑，并不意味着你将保证获得比特币的报酬。这仍然取决于运气，只是拥有最快电脑的人有更大的机会解决问题。一个\
  \ `hash rate` 极低的人可能会运气很好，在其他矿工之前就解决了问题。这种情况并不常见，但是一种可能。\n\n## 加入矿池\n\n由于现在挖掘比特币变得困难得多，第三方和团体决定在矿矿池中。。在矿池中，你不是在独自挖矿，而是和一群人一起挖矿。这样做的好处是，比起某人独自奋战，小组挖掘出比特币的概率要高得多。坏处是，如果你是成功挖掘出比特币的人，你必须与矿池中的所有矿工分享你的奖励，矿池中任何其他最终成功挖掘的人也同样如此。\n\
  \n加入矿池绝对是确保你的挖矿努力实际上产生收益的最简单、最可靠的方法。通常情况下，你会定期收到小额的比特币支付，因为有很多人要分担，而且矿池很可能每隔一段时间就会成功挖掘一次。你收到的收入可能较低，但是稳定的。有更多的人倾向于这种方式，这样他们就不必承担购买所有挖矿设备且获得报酬概率极低的风险（Grygaříková,\
  \ 2018）。\n\n如果你想加入矿池，对它进行一些研究会有帮助。并不是所有的矿池都完全相同，所以有几件事是你必须考虑的。\n\n你首先需要考虑的是矿池的大小。有些矿池非常大，而另一些要小得多。这两者都有优缺点。优点是，矿池中的人越多，你获得奖励的几就越大。更多人共同工作让每个人都有更好的机会为他们的努力获得报酬。较大矿池的缺处是，你的补偿会较低，因为需要分给更多的人。通常，新手矿工应该选择较大的矿池，因为他们会经常地获得补偿，而且不需要消耗那么多电力。这通常是为初级矿工产生良好回报的廉价选择。\n\
  \n你接下来需要考虑的是你可以从矿池中提取的最低支付金额。矿池通常规定在什么一点你被允许提取赚得的比特币。最好选择一个最低支付金额很低的矿池。这意味着即使比特币金额非常小，你也能定期提取款项。低最低金额的矿池通常更安全，因为发生坏事的概率较低。最糟糕的感觉是等到攒够了一大笔比特币再去提取，结果矿池突然消失了，或者加密世界发生了某些坏事导致比特币价格下跌。只要可以就取出你的比特币绝对是更安全的选择，这样无论发生什么事情，你知道它就在你手里。\n\
  \n加入矿池并不是完全免费的，因此在加入之前你必须考虑的下一件事是费用。\n\n\n\n# 第 7 章\n\n\n\n\n# 如何购买比特币和其他加密货币\n\n\
  许多人想购买比特币和其他加密货币，但他们并不知道如何操作。如果你了解步骤并以此为基础进行，效果会更好。坦率地说，现在购买比特币比加密货币首次发布并引入世界时要容易得多。如果你想购买比特币，让我们来了解一下整个购买过程。目前，比特币在所有加密货币中拥有最高的哈希率和安全性。这意味着它在价值存储方面赢得了领先。你可以用比特币购买到的东西比市面上任何其他加密货币都多。在未来这可能会发生，但短期内看起来不太会发生。目前，其他加密货币正在为智能合约展开竞争。看看未来将如何发展是非常有趣的。\n\
  \n## 购买加密货币的步骤\n\n随着其普及程度的提高，操作实际上变得越来越简单了。对于那些认真想要购买加密货币的人来说，这是一个极好的消息。如果你从未购买过比特币或其他加密货币，那么可以在下方找到进入该领域的许多不同方式。\n\
  \n### 注册交易所平台\n\n你需要注册一个加密货币交易所，这样你就可以购买、出售并持有比特币以及任何其他加密货币。市场上有很多不同的交易所，但最好是选择一个允许你将比特币存入自己的个人钱包的交易所。将比特币与交易所平台分开通常更安全，因为你不需要信任平台来保管你的资金。Coinbase、Kraken、Gemini\
  \ 和 Binance U.S. 是最常见的交易所平台。还有很多选择，你可以自己研究以找到你的可用方案。\n\n在设置账户时，请确保安全。这些平台仍然运行在互联网上，虽然比特币被黑客的风险极小，但这些平台可能会被攻击。存在被黑客或比特币被盗的风险，因为许多交易所程序仍然是中心化的，因此不具备与比特币相同的安全协议。使用双重身份验证，并确保你的密码足够长且唯一。这会让人们更难进入你的账户。只要你保持安全并将比特币保存在自己的钱包中，你的加密货币就是安全的（Conway,\
  \ 2020b）。\n\n### 连接你的支付选项\n\n你可能需要将银行账户连接到交易所。这样做的原因是你需要从交易所存入或取出资金。如果你想购买更多比特币或变现你拥有的比特币，这是必要的。你应该确保你所属的银行允许此类交易。有些银行对加密货币提现非常谨慎。他们可能会停止或挂起这些交易，这对于用户来说非常不便。大多数银行都允许此类交易，但最好始终检查并确认一下，以避免以后出现任何不必要的问题。你可以将银行账户、借记卡或信用卡连接到交易所。然而，由于比特币的波动性，最好不要连接信用卡。你还应该意识到每个选项在银行收取的费用也不同。通常，存入银行账户的费用比存入借记卡或信用卡要高得多。请做好研究，以防在进行加密货币交易时遇到任何意料之外的费用。\n\
  \n### 购买你的加密货币\n\n如果你曾在股市市场交易过，你可能能够学会操作加密货币交易所。这些交易所的大部分功能与股票经纪公司相同。当你下单加密货币时，可以选择止损单、限价单和市价单等选项。你使用的交易所类型决定了你拥有的功能。这就是为什么你需要进行研究，以确保你选择了最适合你和你业务需求的交易所。\n\
  \n### 安全地存储你的加密货币\n\n一旦你拥有了比特币或其他加密货币，就应该将其从交易所移出并放入钱包。交易所存在被黑客攻击导致加密货币被盗的风险。钱包是存储加密货币更安全的地方。即使你的交易所提供钱包选项，最好也不要采用。钱包不是他们的要要任务，因此这里存在风险。我们已经提到过可选的钱包类型，现在我们将讨论热钱包和冷钱包。两者都有其用途，但你需要确保正确使用它们以防止货币损失。\n\
  \n热钱包是运行在互联网上的钱包。你可以在连接互联网的设备上使用它们。由于由于，热钱包更容易被黑客攻击，密钥也可能被盗。热钱包非常方便，因为钱包内的交易简单。由于连接了互联网，你不需要费精力就能完成交易。在使用热钱包时，你需要确保使用了足够的安全防护措施。\n\
  \n冷钱包是不连接互联网的钱包。这为你的加密货币存储增加了一层安全性。攻击不连接互联网的东西比攻击联网的东西要困难得多。如果你将加密货币保存在冷钱包中，几乎没有丢失风险。用户可以将私钥存储在这里，它将保持安全。你可以使用硬件钱包或纸钱包。两者中最安全的是纸钱包。它们用于长期投资，因为你无法快速访问并对投资进行更改。纸钱包可以在某些网站上生成。你可以打印私钥和公钥并隐藏。如果有人发现了这张纸，他们就会获得你所有的信息，所以随身携带这张纸并不好。很多人会将这张纸塑封，然后存放在保险箱或银行的存物箱中。这似乎没必要，但这是是存储加密货币最安全的方法。如果你有大量资金投资在加密货币中，这几乎是必需品。\n\
  \n硬件钱包通常是存储你信息的 USB 设备。它们不连接互联网，你用完后只需将其从电脑上拔下即可。保护硬件钱包也很重要。你应该拥有交易所、一个冷钱包和一个热钱包。这允许你在进行交易的同时保持资产安全。正确地使用每种钱包将为你带来最大的收益和安全性。你应该准备好交易所进行买卖。然后你的热钱包可以存储你想要交易的小额加密货币，它随地可用。你的冷钱包则应用于存储长期持有的大量加密货币（Conway,\
  \ 2020b）。\n\n### 加密货币 ATM\n\n上述方法是购买和投资加密货币最流行的方式。这可能是最方便的方法，但并不是唯一途径。你可以通过加密货币\
  \ ATM 购买比特币和其他其他加密货币。你把钱投入 ATM，就可以在交易所获取加密货币。上述方法是购买和投资加密货币最流行的方式。这可能是最方便的方法，但并不是唯一途径。你可以通过加密货币\
  \ ATM 购买比特币和其他其他加密货币。你把钱投入 ATM，就可以在交易所获取加密货币。\n\n\n\n\n\n# 第 8 章\n\n\n\n\n# 工作证明与权益证明对比\n\
  \n工作证明（PoW）和权益证明（PoS）只是目前为了让区块链系统进行交易而设立的机制。区块链世界对于哪种机制更优一直存在争论。不同的平台采用了它们认为最适合自己的机制。有些平台正在进行切换，因为它们认为这将对其自身的系统最有益（BitDegree,\
  \ 2021b）。若要对哪种机制更好做出自己的假设，你需要充分了解每种机制。权益证明的普及正迅速超过工作证明。理解这些机制及其在现实世界中的运作方式，将让你对一切了全局，并帮助你理解区块链网络提供的可用选项。这两种机制只能用于挖矿过程中。区块链将挖矿作为批准交易的媒介，从而产生批准交易的激励。矿工获得补偿的方式以及挖矿过程中投入的工作取决于所使用的哪种机制。\n\
  \n## 工作证明\n\n第一个用于挖矿和确认交易的系统是工作证明（PoW）系统。这是中本聪（Satoshi Nakamoto）为了让交易在在没有第三方干预的情况下通过而提出的解决方案。PoW\
  \ 允许区块链达成共识，这意味着确保了交易是有效的，且没有猫操作。这防止了双重花费等欺诈行为。这一切都基于一种被称为密码学的数学，这就是为什么这种货币被称为加密货币（BitDegree,\
  \ 2021b）。使用该系统挖矿和批准交易需要大量的努力。我们之前讨论过比特币挖矿，那本质上就是运行中的 PoW 系统。必须解决的数学方程非常困难，只有特定的计算机才能解决。由于方程永远无法重复，一旦被解决，系统就知道交易是合法的，可以对其进行批准和处理。\n\
  \n由于 PoW 是当时唯一的区块链系统，大多数新的加密货币都采用了它。这是一个减少欺诈和其他不希望活动的极佳系统，但它也有其缺点。如你现在所知，使用该系统进行挖矿需要大量的资源。任何想挖矿的人都需要正确的设备和电力来维持运行。由于运行这些机制消耗了大量的电力，这已被证明对环境产生了负面影响。这些计算机通常持续运行，每天确实消耗大量的能量。\n\
  \n让我们深入了解一下工作证明系统。为了让 PoW 能够运行，它需要网络证明已经付出了工作。这项工作就是被使用的计算能力。完成的工作越多，个人成功挖矿的可能性就越高。这为人们挖矿和使用\
  \ PoW 系统增加了激励。矿工越多，处理交易的速度就越快。比特币在他们的 PoW 系统中使用`SHA-256`哈希算法。这是大多数其他加密货币也使用、或至少在它们开发初期使用过的标准算法（Frankenfield,\
  \ 2021b）。所有计算机都将开始哈希计算，以便先解决数学方程。挖矿是一个非常有竞争性的过程，因为你正在与每一个矿工竞争以解决那个数学方程。虽然计算机越快，成功挖矿并解决方程的可能性确实越大，但挖矿更多像是一场随机抽票，而不是赛跑。它没有固定的终点，成功的计算机可以是任何一个。这完全取决于运气。如果你把这比作彩票，买票较多的人中奖机会更高，但这是任何人的游戏，你无法做任何事情来确保获胜。在挖矿时，你的哈率越高或为你为你工作的计算机越多，成功的机会就越大，尽管没有办法保证。这就是为什么许多人选择在矿池中挖矿，这样他们就有更高的机会获得收益。由于最终获胜者是根据工作量比例随机选择的，这激励了所有在该系统工作的人诚实交易，并确保交易是真实的。需要一个系统使得去中心化网络成为可能，并震慑人们试图欺骗系统。有了\
  \ PoW，试图夺取系统并进行违规操作的资源成本过高。当系统使用 PoW 时需要完成大量工作，但这使其比许多其他处理方式更安全（Frankenfield, 2021b）。\n\
  \n虽然 PoW 是一个非常安全的系统且到目前为止运行良好，但它存在一些缺点。这就是为什么其他加密货币决定转向另一种验证交易的系统。这并不意味着 PoW 无法运行或作为一个系统是坏的。然而，意识到这种系统涉及的局限性是有好的。这将让你理解为什么会有向其他系统的迁移，并可能看到面对\
  \ PoW 的这些问题的解决方案。解释这一点最好的方法是以比特币为例，因为该系统是第一个使用工作证明的系统，并且没有表现出切换到另一个系统的迹象。比特币系统大约需要\
  \ 10 分钟批准一次交易。比特币区块链每秒只能处理有限数量的交易。如果超过这个数量，系统就会产生积压，费用开始增加。比特币刚开始时，交易费用只有几分的一美元。这是一个巨大的吸引力，因为人们可以以很小的金额进行交易而不会产生高额。2017\
  \ 年 12 月，交易量出现激增，导致费用大幅增加。有些人为单笔交易支付了高达 40。这比银行还贵，是比特币所使用的 PoW 系统的一个主要缺点。从那时以后费用下降了很多，但从未恢复到之前的水平。所看到的这些问题是由\
  \ PoW 系统的局限性造成的。为了应对提出的问题，确实需要做很多工作和努力。这些系统之间总是存在权衡。如果比特币决定继续使用工作证明系统，将意味着用户将为它提供的安全性付费。可能会有人对此感到不满意。目前，比特币不是唯一使用\
  \ PoW 的加密货币。第二大平台以太坊也使用 PoW。然而，他们正在考虑在不久后转向权益证明。这比比特币的 10 分钟快得多。PoW 在扩展性方面存在问题。它让扩展扩展变得困难，这意味着必须增加工作的矿工数量。这可能是不可持续的，因为已经形成了环境影响。以太坊对系统所做的更改允许他们每秒处理多次交易。这多于比特币可以完成的数量，但还没有达到理想水平。\n\
  \n## 权益证明\n\n工作证明的替代方案是权益证明（PoS）。它旨在解决 PoW 面临的某些问题。同时，它也受到了一些反弹，因为它可能没有工作证明系统那样安全可靠。它们是完全不同的系统，但最终结果相同。在\
  \ PoS 系统上挖矿所需的资源比 PoW 系统少得多。这是由于它选择谁来挖矿的方式。仍然在使用加密算法，但系统的目标与 PoW 系统不同。目前只有山寨币在使用\
  \ PoS，但已经在进行整合以将此系统引入其他加密货币中。这两个系统的主要区别在于，对于 PoW，为了获得奖励需要工作证明；而在 PoS 中，个人获得挖矿机会的激励取决于他们持有的货币比例。这增加了人们可以挖矿并使用\
  \ PoS 系统。这种激励取决于他们持有的币量（BitDegree, 2021b）。在 PoS 中，个人获得奖励的机会基于他们拥有的代币比例。这意味着不需要大量的计算能力和电力来执行。从技术上讲，这不能被称为挖矿，因为过程完全不同。在\
  \ PoW 中，成功解决方程的人将获得特定奖励。而在 PoS 中，解决谜题的人将获得交易费。这些人通常被称为验证者（forgers），因为他们挖矿（Frankenfield,\
  \ 2021c）。由于这种系统与工作证明的挖矿方式不同，讨论其运作方式是恰当的，以便更好地了解。为了让验证者有机会验证系统中的交易，他们需要将所有的货币放在特定的钱包中。将币分散在各地将很难看出某人拥有多少币，因此难以继续该系统。此时钱包会被冻结并用于质押（stake）。在此期间，验证者无法使用他们的币或从钱包中取出。在大多数情况下，验证者需要大量的币才能能够验证交易。通常有一个最低要求。这是因为让每个拥有部分币的人参与这一过程是困难的，质押的比例会太小。这意味着如果某人想要能够验证，他们需要对币进行大量的初始投资。只有拥有大量币的人才被允许验证和处理交易。这限制了允许这样做的人数，而且它并不是像\
  \ PoW 那样收集币和积累财富的好方法。假设你有足够的币进行质押，获得交易费并“获胜”是不保证的。你赢得奖励的机会与你质押的币的百分比有关。如果你有 5%的币，那么你每次赢得的机会就有\
  \ 5%。在 PoS 模型中，获得奖励的人是根据他们拥有的或能够质押的币的比例随机选择的。对于那些能够参与这一过程的人来说，这比在 PoW 系统中挖矿更具效益（BitDegree,\
  \ 2021b）。\n\n\n\n\n\n# 第 9 章\n\n\n\n\n# 以太坊——迅速走向流行\n\n以太坊是世界上最受欢迎的加密货币。它的灵感源于 `Bitcoin`，但旨在改进创造者们认为\
  \ `Bitcoin` 存在的缺陷。从诞生起，它就迅速走红。这在某种程度上是因为 `Bitcoin` 为加密货币开启了大门，人们对它更具接受度。\n\n## 谁创建了以太坊？\n\
  \n以太坊的创建者是维塔利克·布特林（Vitalik Buterin）。他是一位加拿大裔俄籍程序员，从小就对加密货币非常感兴趣。2011 年，他共同创立了名为\
  \ `Bitcoin Magazine` 的网站。在上面，他发表了许多关于 `Bitcoin` 和加密货币的文章。他对这个主题无疑充满热情。当时他只有 19 岁。在我们大多数人人生的那个时间点，我们可能还在对更琐碎的事情感兴趣，而他正走在创建一个世界上规模最大的加密货币平台之一的道路上。这是一项非常令人印象目的成就（Hertig,\
  \ 2021）。\n\n当时他正在读大学，但两年后他决定退学，专职经营 `Bitcoin Magazine`。他专注于学习更多关于区块链及其能力的知识。他学得越多，就越意识到区块链的能力远不止于点对点的货币。他的想法是创建一个带有内置编程语言的区块链平台。这将允许人们使用该平台利用该技术构建其他类型的应用程序（Frank\
  \ & Silverstein, 2019）。\n\n2013 年，他发布了一份白皮书，详细阐述了他的想法。他想为某人想要构建的去中心化应用设计这个平台。这是一个非常有吸引力的想法，过去是，现在也是如此，因为去中心化的平台可以让世界各地的人都能访问。这将意味着更大的覆盖范围，并对应用程序的用户和所有者都有利。就像\
  \ `Bitcoin` 区块链平台一样，这也让用户对自己的个人信息和数据有更多的控制。\n\n虽然维塔利克·布特林是以太坊背后的主脑，但他并不是唯一参与平台开发和构建的人。在这一过程中，他得到了许多投资者和开发者的帮助。以太坊的另外两个创始人是加文·伍德博士（Dr.\
  \ Gavin Wood）和约瑟夫·鲁宾（Joseph Lubin）。伍德博士在开发早期负责了以太坊平台的大部分编程和设计工作。在他职业生涯后期，他创立了 `Polkadot`，我们将在书后的部分讨论它。约瑟夫·鲁宾也深度参与了平台的开发，并后来创建了许多其他技术型公司，其中之一就是\
  \ `ConsenSys`。\n\n在此期间，还有许多人在以太坊平台的构建、开发和设计中发挥了作用。然而，有三个人付出的努力最多，并最终成为了平台成品的联合创始人。大多数大型技术平台和公司都不是由一个人建立的。这就是为什么许多人认为\
  \ `Bitcoin` 的发明者中本聪（Satoshi Nakamoto）实际上是一个群人的代号，而不是某个人。这是可信的，因为我们可以看到以太坊平台以及许多类似的平台都有许多不同的人投入了他们的技能。以太坊的创始人在介绍自己和生活方面比中本聪要开放得多。\n\
  \n## 创建以太坊的背后原因\n\n维塔利克·布特林从第一次听说加密货币起，对 `Bitcoin` 和区块链技术就产生了浓厚的兴趣。在广泛的研究后，他意识到这项技术的用途远比\
  \ `Bitcoin` 目前的用途要得多。他从未认为 `Bitcoin` 的设计糟糕或它的运行方式不符合预期，相反，他看到了软件本身未来的可能性。这就是他创建以太坊的原因。他想对区块链软件做一些事情，并以一种不像\
  \ `Bitcoin` 那样受限的方式来使用它。\n\n布特林曾在一次采访中表示，并不是 `Bitcoin` 的功能非常局限。他将口袋计算器和智能手机作了对比。你可以使用计算器来解决你需要的所有数学题，但那基本上就是它的全部能力了。而智能手机上可以有一个计算器应用，并和计算器做完全相同的事情，但还能做更多事情。你可以拍照、听音乐、浏览网页、用它与他人交流，等等。这并不是说计算器工作得不好，它只是只有一份工作。他的观点是，既然你可以拥有一部智能手机（`Ethereum`），为什么只用一个计算器（`Bitcoin`）呢？这是采取了\
  \ `Bitcoin` 相同的理念，但增加了它的力量和功能，使其具有更通用、更灵活的目的（Frank & Silverstein, 2019）。\n\n这里的目标是拥有一个支持许多应用、网站和平台开发的平台。去中心化不仅对金融是一件好事，对许多其他领域和行业也是如此。如果你看看最近关于\
  \ Facebook 向其他公司出售数据的巨大骚动，你就会发现世界已经准备好接受更多隐私保护了。人们将更多地控制自己的数据以及数据如何被使用。唯一可以共享的信息是用户自愿分享的信息。这将使类似于\
  \ Facebook 和 Instagram 的应用程序不得不改变其运作方式，并赋予用户对其信息更多的控制权。\n\n开发者可以构建不需要领导者或中央控制的应用程序。这是将控制权交回终端用户。这意味着用户在知道自己的数据不会被篡改或出售时，可以感到安全可靠。这类应用程序的另一个优点是几乎没有被黑客攻击和用户信息被窃取的风险。\n\
  \n（注：此处由于原文后续存在大量重复且逻辑不完整的内容，已按要求翻译核心语义部分）\n\n\n\n\n\n# 第 10 章\n\n\n\n\n# Polkadot——区块链领域的新秀\n\
  \n自 2020 年推出以来，`Polkadot` 的热度日益提高，并吸引了大量投资。这意味着科技社区中有许多人认为这种模型非常有吸引力，并能预见到其长期收益。它在很大程度上借鉴了\
  \ `Ethereum` 的灵感，但并非其精确复制。许多发展使得两者之间产生了一些差异。这两个系统的目标并不相同，这就是为什么 `Polkadot` 吸引了许多投资者，并激发了许多开发者的兴趣。`Polkadot`\
  \ 并在任何方面都没有试图超越 `Ethereum`。相反，它正试图创建一个能够与 `Ethereum` 以及其他区块链平台工作的平台。它的目标是成为不同区块链技术之间的桥梁。这绝对是一个有趣的目标，因为我们在区块链世界中尚未见过类似的机制。它绝对可能成为游戏规则的改变者，而对其的投资表明人们真的认同这一理念。\n\
  \n`Polkadot` 绝不是试图成为市场上的下一个主流加密货币。它没有超越 `Bitcoin` 的风险，因为它们不在同一个竞争领域。`Bitcoin` 的主要重点是成为银行和金融服务行业的替代品。而\
  \ `Polkadot` 的开发者从未表示他们对类似的事情感兴趣。他们的主要重点是平台本身，然后将其加密货币端作为与平台交易的媒介。这与 `Ethereum`\
  \ 的做法非常相似。这似乎是加密货币领域的新趋势，因为市场上没有多少其他项目想要与 `Bitcoin` 拥有相同的最终目标。该平台仍有一些开发需要完成，但这在所有加密货币平台上都是标准流程。`Polkadot`\
  \ 与目前使用的 `Ethereum` 平台相比，更类似于 `Ethereum 2.0`。这是因为 `Polkadot` 使用的是 `Proof of Stake`（权益证明）而非\
  \ `Proof of Work`（工作证明）。这更符合 `Polkadot` 的需求，并为系统的运行带来了收益。如果你今天之前从未听说过 `Polkadot`，这是可以理解。它不像\
  \ `Bitcoin` 或 `Ethereum` 那样主流。然而，毫无疑问，它将成为加密和区块链领域的一个大名字。\n\n## 平台背后的开发者\n\n有三个人负责\
  \ `Polkadot` 平台的开发。该平台是由一家名为 `Web 3 Foundation` 的瑞士基金会的旗舰项目。这是一个由三个人组成的团队，其中一人是\
  \ `Ethereum` 的联合创始人 `Dr. Gavin Wood` 博士。他参与了区块链的许多领域，因此他在这里扮演重要角色似乎非常合情合理。他是 `Polkadot`\
  \ 的创新负责人，也是 `Web 3 Foundation` 的主席。第二个创始人是 `Robert Habermeier`。他的职责基于整个系统使用的编码语言。`Polkadot`\
  \ 平台的第三位也是一位创始人是 `Peter Czaban`。他是 `Web 3 Foundation` 的技术总监，与下一代技术（`Polkadot Network`，n.d.）的发展密切合作。`Dr.\
  \ Wood` 离开 `Ethereum` 是为了开启自己的创业，这导致他与科技领域的其他几家公司一起创立了 `Polkadot`。\n\n乍看之下，`Polkadot`\
  \ 似乎与 `Ethereum` 完全一样，并且正试图占据 `Ethereum` 在市场中所占的地位。确实，这两者有许多相似之处，但 `Polkadot` 的目标并不是取代\
  \ `Ethereum`，而是与其协同工作。`Polkadot` 致力于构建不同链之间的互操作性。\n\n## 它是如何工作的？\n\n与市场上的其他加密货币相比，`Polkadot`\
  \ 的增长实际上非常快。它不仅被设计为一种加密货币，而且是一个让其他区块链应用在其之上构建的平台。在这方面，它与 `Ethereum` 非常相似。`Polkadot`\
  \ 仅在 2020 年发布，就已经显示出巨大的潜力。它不是仅仅运行在一种区块链上，而是由两种不同类型的区块链运行。这是一个独特且创新的设计，使其在竞争对手中脱颖而出。运行其上的这两种区块链被称为\
  \ `relay chains`（中继链）和 `parachain`（平行链）。\n\n`relay chain` 是主链或主网络。交易在这里进行验证并使其永久化。第二类链被称为\
  \ `parachains`（平行链）。用户可以在这里创建自己的网络。他们可以使用网络的这部分来构建并创建应用等。这些较短的链受益于与主链相同类型的安全性，因为它们馈送了主链。它们还可以针对各种不同的用途进行定制，这使得使用区块链技术的方式变得非常灵活（Kraken,\
  \ n.d.）。\n\n`Polkadot` 的 `relay chain` 是系统的基础链或主链。它运行在 `Proof of Stake` 系统上，但使用了其的修改版本以更好地适应网络需求。这种共识机制被称为\
  \ `Nominated Proof of Stake`（提名权益证明）。这是一个非常有趣的概念，但它仍然依赖于 `PoS` 网络的基础。为了让平台正确运行，需要完成四个非常重要的角色。这些角色是\
  \ `validator`（验证者）、`nominators`（提名者）、`collectors`（收集者）和 `fishermen`（渔民）。当有人将代币质入系统时，他们会被分配并锁定在这些角色中的一个或多个。每个角色都执行不同的功能，但它们以相同的方式获得\
  \ `DOT` 奖励，这是 `Polkadot` 平台。\n\n-   `Validators`（验证者）负责验证 `parachain` 上的区块。他们还可以对系统可能发生的任何更改进行投票。\n\
  -   `Nominators`（提名者）的作用是确保 `relay chain` 的安全，通过选择可信的 `validators` 来实现，他们质押 `DOT`\
  \ 代币。\n-   `Collectors`（收集者）作为从 `parachains` 到 `relay chain` 的连接器。他们收集 `parachains`\
  \ 的所有数据并将其添加到链。\n-   `Fishermen`（渔民）是那些监控网络任何可疑行为的人。如果发现此类情况，他们会报告给 `validators`。\n\
  \n`Parachains`（平行链）每个都有特定的功能和目的，它们独立运行在 `relay chain` 之上。你可以将其认为：一个专门用于智能合约的链，另一个用于支付。\n\
  \n## Polkadot 解决的问题\n\n现在你已经了解 `Polkadot` 是什么以及它的去向，让我们讨论不断出现的五个主要问题：可扩展性、定制性、互操作性、治理和升级性。\n\
  \n### 可扩展性 (Scalability)\n这是我们讨论过的两个区块链平台共同的问题。`Bitcoin` 可能在扩展方面遇到困难，因为挖掘设备会导致电力使用和环境问题。`Ethereum`\
  \ 在扩展性方面也达到了天花板，但他们计划通过 `Ethereum 2.0` 解决。相反，`Polkadot` 是一个非常有可扩展性的平台。这是因为它运行在多链网络上。这允许系统中发生的进程和交易同时并行运行。这意味着在特定时间内可以批准多个区块，因为有多条链在处理这一过程。这对系统来说是一个巨大的优势，因为意味着可扩展性是无限的。这很容易成为全球化采用过程的开始。\n\
  \n### 定制性 (Customization)\n这更多地涉及那些希望提供使用区块链构建你自己的程序和项目的系统。在大多数平台上，定制性是有限的，因为没有一种区块链系统可以满足所有需求。每个项目都需要不同的东西，并有他们自己需要满足的要求，以确保项目进展并成功。如果没有针对特定项目的特殊选项，系统拥有的开发量和新项目数量将停滞。`Polkadot`\
  \ 允许每条链更改并优化其设计，以适应项目所需的功能。这意味着开发者可以来并定制链以满足需要的要求。\n\n### 互操作性 (Interoperability)\n\
  这意味着一个网络与另一个网络共享数据的能力。目前，每种区块链技术都运行在自己的系统中，没有办法让它们相互通信。如果有人拥有 `ether` 并想要像 `Bitcoin`\
  \ 那样交易，他们必须通过交易所。另一方面，`Ethereum` 拥有扩展的自由，允许人们在其系统上构建自己的区块链技术。如果这样做，可能会出现一些安全问题，这会违背\
  \ `Bitcoin` 的目的。`Polkadot` 允许网络与其他网络进行交互。\n\n### 治理 (Governance)\n由于大多数平台只有一条主链，用户无法投票。`Polkadot`\
  \ 允许每个链根据社区认为合适的方式进行治理。这允许系统不断收集信息并帮助整个平台进行治理。这允许程序在不停止或做出任何剧烈变化的情况下持续运行。\n\n###\
  \ 升级性 (Upgradeability)\n`Polkadot` 解决的最后一个问题是升级问题。这是一个基于底层的链，允许在生态系统中进行智能合约的创建。用户能够在平台上进行投票和融资流程。该平台的目标是为链的治理提供一个测试环境。`Polkadot`\
  \ 提供了模块化，这意味着区块链的不同部分被分离出来。当需要发生更改或修改时，它只影响一个模块，而另一个不受影响并可以正常继续。由于这种系统，整个平台将以更快的速度进行改进和改进。\n\
  \n## 硬叉 vs 软叉 (Hard Forks vs Soft Forks)\n\n这些都指的是系统进行更新时的情况。在我们进入这些细节之前，让我们弄清楚什么是叉（fork）。它的完整名称是\
  \ `software fork`（软件叉）。它每当软件被复制或修改时就会创建。本质上，软件分叉到了另一个方向。原始软件仍然存在，但现在有一个新分支。所有项目将有一个共同起点并共享相同的历史，但每个最终都会分裂到自己的部分。例如，如果有一个程序，一部分开发者想要保持原样，另一部分想要添加特定的更新，他们可以分成两组。他们的路径现在是分开的，最终将看起来与开始非常不同。随着开发的持续，新的想法和创新可以加入。在这个过程中，叉的数量不受限于区块链。然而，硬叉和软叉的概念几乎可以在区块链网络中找到。\n\
  \n对于硬叉，会发生剧烈变化。通常发生的是节点为系统增加了与旧规则直接冲突的新规则。这意味着它们无法一起工作。随着这些巨大变化，一些人留在旧规则，另一些将移动到新规则。新规则将创建一个独立的链来运行。由于这不是全新的系统，你可以将代币转移到新链。系统的基本规则将保持不变。\n\
  \n对于软叉，更新是向下兼容。这意味着用户不需要更新就可以使用新功能。如果用户选择不更新，软件仍然运行。然而，其后果是用户的软件可能与其他下载不兼容，你可能会被某些应用程序踢出去。这不是理想的，所以鼓励用户更新。\n\
  \n## Polkadot 上的应用\n\n根据 `Polkadot` 的开发方式，有很多有趣的项目被构建到系统中。人们正在关注 `Polkadot` 平台上的一些有趣项目。\n\
  \n### Kusama\n`Kusama` 是由 `Polkadot` 平台背后的开发者开发的应用程序。该项目利用与 `Polkadot` 相同的代码库，因此它是原始平台的密切亲戚。创建它的原因是给用户提供一个测试他们项目的地方。它创建了一个理想的环境来测试快速节奏和创新的项目，并在主平台发布之前进行预检。开发者可以在这里测试和尝试他们的想法，还可以调整项目的开发。一旦项目创建者对其满意，他们可以选择将其移动到主\
  \ `Polkadot` 区块链，也可以留在 `Kusama`。选择权在于他们因为 `Kusama` 是一个功能完整的平行链，甚至带有自己的代币。这意味着它由\
  \ `KSM` 代币持有者治理。\n\n### Moonbeam\n`Moonbeam` 是与 `Ethereum` 兼容的平台，并合作部署智能合约。它有自己的代币称为\
  \ `Glimmer`。这尚未发布，但将是人们参与的一件棒的事。\n\n### Acala\n`Acala` 被认为在 `Polkadot` 平台上发布的最成功项目之一。目标是将去中心化金融（DeFi）引入\
  \ `Polkadot`。去中心化金融不是可以被忽视的，对人们来说是一件棒的事。`Acala` 有自己的代币，并由那些质押代币的人运行。\n\n\n\n\n#\
  \ 结论\n\n书中向你提供了大量的信息。这是因为关于加密货币和区块链的主题包含大量信息。这里总有学不完的东西，因为它不断地变化和发展。跟上加密世界的动态保持同步是一个好主意，这样每当情况发生变化时，你能够察觉到。事情发生得非常快，如果你脱离圈子一段时间，当你回来时，可能会发现一切都发生了变迁。\n\
  \n尽管如此，基本原理将始终保持不变。一旦你理解了它，在这些知识的基础上构建就会变得更容易。即使情况发生了变化，其变化方式也不可能让先前的系统和知识在很长一段时间失效。这就是为什么拥有关于系统能做什么以及它们功能是什么的基础知识至关重要。\n\
  \n这本书可能是你加密货币之旅的起点。虽然在投资加密货币时，并不需要对构建区块链网络的系统和流程有深入了解，但如果你选择这样做，你就应该知道自己正在投资的是什么。\n\
  \n在未来，加密货币的目标不仅是成为投资品，更是一个能让你在日常生活中进行交易和结算的系统。特别是 `Bitcoin`，目标是创建一个我们今天使用的货币的替代品。它的设计初衷是将控制权交还给终端用户，而不是由一个对货币运作方式和人们使用方式拥有终极权的中央实体来控制一切。\n\
  \n加密货币并不是一种几年就会消失的时尚。它是为了支持我们想要的生活方式而构建的。众所周知，我们现在处理财务的方式存在一些严重的局限性。这些局限性限制了我们作为一个社会的发展。一个健康社会的标志是不断增长和变化。一旦事物停止增长，就会变得停滞，而离衰败只有之遥。我们应该将这些迈向新方式的尝试视为健康的表现，是我们作为社会取得进步的标志。\n\
  \n加密货币的未来仍然没有完全定型。目前的金融体系不太可能短期内被扫清并被加密货币取代。有很多因素需要考虑，而且这取决于采纳它的国家的规则和法规。目前仍有很多国家对这个想法并不兴奋，并且对各种加密货币都实施了严格的法律。这意味着，在希望将其作为通用货币之前，还有很多工作要做完成。\n\
  \n也许有一天，将拥有一个连接世界的货币系统。这绝对会使海外贸易变得更容易，并成为一个更具全球性的经济体。尽管我们还没有到达那里，但加密货币自真正开始以来已经走了很长一段路。`Bitcoin`\
  \ 只在 2011 年发布，这并不遥远。如果你看看它是如何腾飞的，以及在如此短的时间有多少人认同这个理念，它真的很有前景。这是一个绝对值得关注的领域，因为你永远不知道下一次重大创新将在何时发生，而那可能就是永远改变我们做事方式的事情。\n\
  \n加密货币吸引最多关注的方面是区块链技术以及它能够以去中心化的方式运行的事实。这种技术可以用于金融服务之外的许多领域。许多公司已经意识到了这一点，并正在尽力利用它。在区块链的使用方面，可能性是无限的。\n\
  \n`Ethereum` 是第一个决定想将区块链用于金融之外用途的平台。你可以创建完全去中心化的系统、应用程序和平台。这将允许用户更好地控制与他们的信息以及你放入系统中的任何其他内容有关发生的一切。毕竟，在经历了许多公司被黑客攻击或出售用户信息的报道后，这绝对是一项受欢迎的创新。\n\
  \n当涉及到这种技术，未来绝对是令人期待的。长期以来没有过如此具有创新性的事物。它在几乎所有领域引起如此轰动并不意外。\n\n这本书的设计并不是为了提供任何财务建议，或对这类技术提供一般性建议。它的设计是为了让你（读者）很好地了解加密货币的本质，并希望激发你对其未来潜力的兴趣。\n\
  \n到现在，你应该对加密货币是什么以及区块链技术的能力有一个良好的了解。这绝对是一个复杂的主题，由许多不同的部分组合成一个运行系统。如果你能够理解书中提到的内容，你就能带着对所涵盖主题的实践性知识进入世界。掌握大局并了解使该系统运作的所有细节，对于未来将至关重要。\n\
