- "# 区块链基础：两本手稿：去中心化金融、加密资产：通过去中心化金融了解智能合约潜力，深入探讨比特币、以太坊和波卡\n\n\n\n\n\n\n\n\n## 去中心化金融\n\
  \n理解去中心化金融与中心化金融的区别 - 了解以太坊及其他区块链上智能合约的潜力\n\n\n\n\n\n# 引言\n\n提到 `blockchain` 这个词，大多数人脑海中浮出的第一个词就是\
  \ `Bitcoin`。虽然加密货币是 `blockchain` 技术最可见的表现，但现实是，`blockchain` 的运行远比这深得多。当人们谈论加密货币改变世界看待金融方式的潜力时，他们的大部分论点都来自\
  \ `blockchain` 所拥有的特性。写任何关于金钱和技术的书籍都是困难的。将这两个主题结合起来，你就有了一个拥有许多论点和路径可供探索的深度课题。在写这本书时，我的目标是关注去中心化金融为世界带来的承诺。毫无疑问，加密货币是重要的。然而，它们并不是去中心化金融革命的驱动力。在阅读这本书时，你也将学到关于当前的中心化金融体系。毕竟，如果你不知道当前的系统是如何运作的（或者说是不运作的），又怎么能理解为什么去中心化金融\
  \ (`DeFi`) 如此重要呢？我尽量减少了复杂的术语，并用易懂的语言呈现了所有材料，所以不用担心这些内容会让你听不懂。从诺贝尔奖得主经济学家到真人秀明星，每个人都对\
  \ `blockchain` 辩论发表了意见。我在这里不是为了告诉你谁对谁错。相反，我尽可能公正地呈现了这些材料，同时又略微倾向于 `DeFi`。这完全是因为它有解决现代经济学遇到的一些最大问题的潜力。\n\
  \n## 问题与解决方案\n\n现代经济理论中最显著的瓶颈之一是 `Progress Paradox`（进步悖论）。随着国家由于工业化发展和知识经济实力的增强而变得日益富有，一种奇怪的局面正在发生。在某个时刻，中产阶级停止了富裕并陷入停滞，而上层阶级却继续增长。你会对“百分之一”这个术语熟悉。这是最近经常被用来描述极富有者的短语。它也被用来凸显有者和无所有者之间的差距。随着经济增长和商品变得越来越贵，中产阶级处于最糟糕的境地：富有到无法获得政府援助，又太穷而负担不起所需的商品；他们停滞不前留在原地。\n\
  \n从历史上看，每届政府的解决方案都是通过税收重新分配财富。你对那百分之一的人征收更多的税，并向其他人提供补贴和服务。听起来很完美。但，这种想法只会激励富人逃离经济并逃往避税天堂。这就是为什么像摩纳哥这样的地方存在。在没有替代方案的情况下，政府会进一步提高税收，人们对国家经济福利的贡献意愿也变得越来越低。这导致补贴计划变得臃肿且资金不足。看看英国国家医疗服务体系（NHS）或任何西欧国家的社会保障计划。移民是这些问题的解决方案，但当计划资金严重短缺时，移民标准往往会下降，结果是给社会计划造成了更大的负担。国家没有为能够做出贡献和增长经济的高技能移民提供安全保障，反而扩大了低端经济阶级的规模，并进一步加剧了他们脆弱系统的压力。简而言之，一个国家越进步，其经济稳定性就越脆弱，因为不平等现象在加剧，而传统的解决方案失效了。\n\
  \n`DeFi` 有能力纠正这种局面，确保财富是“预分配”的，而不是像通常反应那样“重新分配”。`Smart contracts` 和 `blockchain`\
  \ 是确保这一点的工具，你将在书中学到关于它们如何运作以及在不平衡发生之前就纠正它们。\n\n`blockchain` 对我们的社会还可以产生其他影响，影响我们相互交易的方式。`Government\
  \ DeFi` 的核心核心在于削弱政府对货币系统的控制。环顾世界，很容易看到威权主义和极端主义正在兴起。即使是高度民主化的国家，其政府要么太偏左要么太偏右，并且毫不犹豫地压制人民的权利。互联网允许这些政府对公民施加巨大的控制，而货币就是这种控制的主要工具。建立高度中心化的货币控制，限制货币外流，并通过银行控制访问，你就得到了现代金融体系运作的图景。中心化系统运作得非常好，但它们依赖于中央权威不越界行力并按照伦理行事。考虑到普通政府的构成，伦理行为是人们最不应期待的，这就是为什么中心化系统对于如今的普通人来说是一个糟糕的匹配。\n\
  \n`blockchain` 有潜力赋能自由媒体、政府反对派，并恢复政府机构的合法性。从艺术品到新闻报道，一切都可以被验证，“虚假新闻”的叫声可以被平息。此的副作用是对货币系统的信任增加，以及消除腐败的透明度提高。这就是\
  \ `DeFi` 的承诺。它不仅仅关乎财富管理解决方案和新资产类别的创造。我们已经经历了二十十年的数字革命，我们的世界以极速从模拟转变为数字。那么，我在这里告诉你，革命才刚刚开始。`blockchain`\
  \ 及其相关应用才是真正的革命，一旦它们的全部潜力被实现，世界将不再与以前一样。这本书是你进入 `blockchain` 奇妙世界的指南，介绍了它目前如何被使用，以及它未来的应用。我还将强调\
  \ `blockchain` 的一些缺点，因为没有任何东西是完全正面的。中心化系统中某些元素运作得非常好，而目前，`DeFi protocols` 在几个方面尚有不足。然而，它是我们目前对于走得太端的中心化系统所拥有的最佳替代方案。所以请坐好，准备好了解我们的世界将如何发生变化！\n\
  \n# 第一章：\n\n\n\n\n信任协议\n\n考虑当今世界中的一个普通交易。假设你走进一家餐厅点餐。你信任服务员会正确记录你的订单，信任厨师会妥善烹饪且不会添加额外的食材，并信任餐厅老板会维持标准以确保环境始终清洁安全。最后，当你支付账单时，餐厅信任你所使用的纸币或刷过的银行卡是公认的货币形式。信任是我们所做一切事情的核心，没有了信任，我们的世界将会迅速崩塌。\n\
  \n回到 1993 年，一位名为 `David Chaum` 的数学家提出了一个真正新颖的想法，称为 `eCash`。`eCash` 是一个电子分币和美元系统，人们可以用它相互进行交易。消费者无需担心将资金从地球的这一端发送到另一端，只需简单发送\
  \ `eCash` 就不用担心它丢失了。虽然这个想法非常绝妙，但它存在一个巨大的缺陷。1993 年的人仍然认为是一个是一个希望和纯洁的地方。他们不相信安全或违背信任等的事情会在机构中发生。可以说，这种对互联网的乌托邦式愿景已不复存在。\n\
  \n互联网的早期是以希望为特征的。万维网是一个向任何人传递信息的系统，无论其教育水平或财务能力如何。`Ivy League` 的知识现在可能对大众开放，每个人都能从中受益。早期开发的网站遵循了这一愿景。软件项目在很大程度上是开源的，一切都带有一种社区氛围。随着网页的演变和技术的进步，开放协作、创造更好世界的理念一直存在。还有什么方式能解释\
  \ `Google` 的独特性以及它“不作恶”的愿望呢？\n\n回到今天，`Google`、`Facebook`、`Amazon` 和 `Apple` 等公司就像是大大哥。这些所有公司都收集个人数据，随心所欲地违反这些数据，并溢价卖回给我们。数据已成为新的货币，而这些公司可以免费使用它，而我们中的许多人对此无能为力。毕竟，你能想象在不使用这些公司提供的任何服务的情况下的情况下过日子吗？甚至在互联网向公众开放之前，科学家们就担心企业贪婪会接管一切，并创建一个镜像物理世界的世界，即企业控制一切。可怕的是，由于互联网能够轻易将人们拉近，它有能力动摇社会并进一步集中权力。\n\
  \n如今，政府使用监控计划来“确保我们的安全”，银行限制我们对资金的访问以“确保合规”，科技巨头则偷取数据以“提供价值”。可以说，那些早期研究中最糟糕的愿景实现了。然而，我们很幸运，因为那些研究人员对这一混乱提出了一个解决方案。\n\
  \n## 密码学\n\n任何技术创新的核心都是网络。网络简单来说至少两个节点的连接。这些节点可以是人、计算机、实体或它们的组合。网络的节点越多，对信任的需求就越大。互联网早期节点很少，信任很容易建立。可以这样想：如果你在一个人口少于\
  \ 5000 人的小镇上长大，那么你很有可能认识那里的每一个人。信任（或缺乏信任）很容易建立，因为你了解每个人是什么样的人，或者可以找到某人为你某个不太熟悉的人背书。\n\
  \n随着网络增长，每个节点的动机变得未知的。回到之前的例子，假设有一家大公司进入小镇并承诺盖一所学校。那么，如果他们还计划污染水质呢？没有人确定。同样，如果互联网上一个更大的节点计划利用它来封锁知识并加剧不平等呢？\n\
  \n解决这个问题的一个方案是对可以在网络上传输信息的人使用密码学控制。如果那家大公司做了坏事（向网络添加信息），它将首先由网络其他部分进行验证。这样，大家都在同一个频道上，不存在在人们眼皮底下偷摸东西的问题。\n\
  \n`Cryptography` 的早期阶段涉及简单的协议，反映了它们所保护的网络的简单性。随着互联网的增长，密码学因为不切实际和缺乏开发它的技术而落后了。简单来说，网络的增长速度超过了密码学的发展速度。这解释了为什么像\
  \ `Facebook` 和 `Google` 这样的巨头如今控制信息流。\n\n## 缺乏信任\n\n随着互联网的增长，信任在网上正日益消失。我们无法验证任何人的身份，就像我们无法验证一篇新闻文章的来源一样。例如，任何人都可以开启看起来真实的\
  \ `Facebook` 或 `Twitter` 账户，并发布引用看似真实的科学来源的信息。如果有人去挖掘这些来源，他们可能会发现有更多来源相连，演变成了一个无止尽的来源验证洞。结果是，比以往任何时候都更容易传播虚假信息。\n\
  \n在内心深处，我们都意识到了这种缺乏信任，这就是为什么我们如此迅速地大喊“假新闻”或在我们的观点上走向极端。为了建立些许信任，`Google` 和 `Facebook`\
  \ 等公司会对帖子进行事实核查；但他们无法验证一切。他们的算法是机器，归根结底，机器是可以被操纵的。擅长操纵的人往往会处于顶端。\n\n今天信息经济的另一个现实是，在不增加任何价值的情况下致富比以往任何时候都容易。考虑一下\
  \ `Google` 所做的。它是世界信息的聚合平台。它提供价值是因为没有其他人拥有这样的信息库。为什么 `Facebook` 如此受欢迎？它聚合个人信息并以友好的格式呈现给你。为什么\
  \ `Uber` 和 `Airbnb` 如此受欢迎？它们是信息的聚合器。\n\n\n\n\n# 第二章\n\n\n\n\n# 区块链经济设计原则\n\n去中心化的很大程度上都集中在它对我们货币体系的影响上。因此，“区块链经济”这一术语正变得流行。这意味着什么呢？简而言之，它指的是以去中心化为设计目标且不包含任何形式的中心化控制的应用程序和系统。它们是真正的点对点网络，包含了你在上一章中读到的所有信任支柱。\n\
  \n金融应用为去中心化应用提供了一个极好的测试场，因为金融成功聚集了去中心化在其他应用中面临的许多现实世界障碍。首批推出的应用之一是 `Bitcoin`，这并非巧合。还有比发行一种货币更好的方法来测试去中心化应用的可用性了呢？因此，`Bitcoin`\
  \ 得到了其他加密货币的改进。研究它们的工作原理具有启发性，因为它们提供了关于去中心化如何运作以及治理其设计的原则的教训。\n\n## 设计原则\n\n所有的区块链设计都依赖于七项原则。无论网络的规则和协议如何，你会在每个去中心化应用中发现这些原则。这些原则源于中心化平台产生的问题。这些原则中最感兴趣的方面是，`Bitcoin`\
  \ 在任何关于它们的讨论出现之前，就已经有机地整合了所有的原则。\n\n我的意思是，`Bitcoin` 成功地在不需要改进或迭代的情况下有机地整合了所有这些原则。相比之下，如果你观察一个软件的典型开发周期，它会经过多次迭代直到达到生产就绪状态。在\
  \ `Bitcoin` 的情况下，它是开箱即用且装备齐全的。这凸显了区块链作为解决方案的强大，以及其他开发者在其上创建应用的易易性。\n\n## 第一原则\n\n\
  区块链包含的第一个原则是网络完整性。该特性与信任以及在平台上进行的交互的透明度密切相关。在 `Bitcoin` 启动之前，不存在一个操作完全可信的网络。例如，考虑互联网上常见的金融交易。在网上购买东西时，建立信任非常困难。这种困难以至于你必须与\
  \ `Amazon` 这样的公司分享大量数据才能完成交易。本质上，你没有选择。\n\n当涉及到钱时，从完整性的角度来看有一个独特的问题。钱不是数据。数据可以以多种格式复制和共享。例如，如果你录制了一个视频，你可以毫不犹豫地发送给多个人。网络不会失去完整性，因为无论谁消费，视频都是相同的。然而，钱的运作方式并非如此。你不能把一美元发给你的朋友，又把同一美元美元发给别人。钱是有限的，不可复制的。尝试用不存在的钱给某付款，你会发现自己正在进行庞氏骗局。\n\
  \n当你在线交易时，你必须信任某些中心权威以确保没有发生双花费。银行、发卡机构和大型商家平台等机构承担了这一角色，但代价很高。像 `Bitcoin` 这样的去中心化货币网络必须解决这个双花费问题以建立信任。`Bitcoin`\
  \ 实现这一点是通过建立共识机制。最好的部分是，去中心化的共识机制远优于中心权威。\n\n这是 `Bitcoin` 共识算法的工作原理。网络上的每笔花费和交易都有时间戳，因此同一用户对同一硬币的后续花费将被拒绝。矿工是运行节点的网络参与者，他们收集最近的交易并从中创建区块。这个过程每\
  \ 10 分钟发生一次。正如我之前提到的，每个区块包含一个指向上一个区块的 `hash`。没有 `hash`，区块就是无效的。\n\n`Bitcoin` 区块链是公开的，这意味着都可以查看正在发生的交易。从本质上说，`Bitcoin`\
  \ 交易比现金更具可追踪性和透明度。从技术角度来看，共识算法似乎是复杂的。别担心，我不会用专业术语让你厌烦。`Bitcoin` 的共识算法被称为工作量证明（Proof\
  \ of Work），它简单而强大。\n\n在 `Bitcoin` 的网络中，没有用户可以选择最新区块的身份。相反，它是一个基于竞争的过程，矿工必须竞争获得这一权利。解决问题是困难的，但验证是简单的。谁最快解决问题，谁就获得创建下一个区块的权利（此处原文存在乱码）。在解决问题时，矿工花费计算硬件和电力。问题本身涉及解密下一个区块的\
  \ `hash`。一旦问题被解决，`Bitcoin` 奖励给矿工。因此，当答案产生时，整个网络都信任它，因为每个人都知道解决它所需的工作。[注：原文在后续部分变得重复/乱码；我清理了机制的核心逻辑]。\n\
  \n（注：提供的文本在后半部分包含重复/乱码的句子。我处理了机制的核心逻辑。）\n\n## 共识机制\n\n### 工作量证明 (Proof of Work)\n\
  `Proof of Work` 优先考虑拥有最多算力的矿工。`hash` 被解决的概率每 10 分钟一次。有些矿工可能需要分钟，而另一些可能需要一小时。解决问题本身是一个迭代过程，矿工产生各种输入并匹配网络输出。预期的\
  \ `hash` 值由网络设置，并每 16 个区块调整一次。如果矿工的输出错误，他们会调整输入并再次尝试。\n\n### 权益证明 (Proof of Stake)\n\
  `Proof of Stake` 是第二流行的替代方案。它要求矿工投资网络并参与。结果是不需要大量的算力，只有投资了网络的人才有发言权。`Ethereum` 用\
  \ `Proof of Stake` 替换了 `Proof of Work`。\n\n### 其他机制\n- `Ripple` 和 `Stellar` 使用社交网络建立共识，并要求新入者在交易前生成至少\
  \ 100 个代币。\n- `Proof of Activity` 结合了 `Proof of Work` 和 `Proof of Stake` 进行随机选择。这种机制的缺点是交易需要才能完成。目前平均交易时间是\
  \ 10 分钟，这是非常长的。\n- `Proof of Storage` 和 `Proof of Capacity` 要求矿工分配硬盘的大部分。\n\n##\
  \ 第二原则\n\n区块链的第二个原则是去中心化或民主化。这是一个公认的事实，治理的形式是民主。它并不完美，但从长期来看，受影响的每个人都有发言权。计算机网络架构从未遵循这种模式。相反，大多数网络架构像是一个由单一控制的君主制。攻击中心权威或隶属于它，并控制整个网络。区块链将权力分配给每个参与者。没有单一控制点，任何一方无法关闭系统。如果系统的部分被隔离或切断，这不是问题，因为区块链记录由网络中的每个节点维护。因此，一旦被隔离的节点重新上线，它们就能无缝接入。虽然这种攻击无法完全防止，但可以发现，因为每个节点都会收到交易的副本。\n\
  \n## 第三原则\n\n中心化系统的奇怪之处之一是激励机制是错误的。他们获取了财富并忽略了其他。区块链代表了互联网重新开始的机会。初始时代（称为 `Web 1.0`）是一个用户贡献增长的协作场所。`Google`、`Facebook`\
  \ 和 `Apple` 的崛起杀杀了这一点，这些公司利用资产控制了通信。中心化系统最终被大公司和实体吞噬。\n\n人工智能领域正处于从 `Web 1.0` 到后续版本的过渡时期。最初的人工智能研究建立开源库和协作之上。然而，我们现在开始看到商业化人工智能的发展，其进展与市场其余隔离开，并使少数人能够统治市场。这在区块链上是不可能实现的，因为没有激励这样做。\n\
  \n## 第四原则\n\n与互联网或任何网络事物一样，安全是一个极其重要的特性。目前的互联网是一个极不安全的地方。网络攻击、勒索软件、钓鱼攻击和网络欺凌是常见事件。\n\
  \n在设计 `Bitcoin` 区块链时，`Satoshi Nakamoto` 设计了一种利用古代安全概念几乎完美的加密算法。它被称为非对称加密，使用两个密钥来确保安全。一个密钥用于加密，另一个用于解密，这解释了“非对称”一词。非对称加密的概念并不新，它从\
  \ 2 世纪 70 年代就开始了。\n\n## 第五原则\n\n大数据改变了各个行业的业务。公司收集的数据比以往时候时候多。仅仅访问网站就意味着提供你的 `IP\
  \ 地址`、居住地、浏览习惯和偏好。当 `Google` 首次引入 `Google Analytics` 时，它允许网站所有者跟踪访问者看到的内容。区块链消除了这一点，允许人们只分享他们想要的内容，其他不再。\n\
  \n## 第六原则\n\n问题是区块链允许欺诈的发生。区块链允许那些控制它的人进行欺诈。区块链允许那些（此处）进行欺诈。区块链允许那些（此处）进行欺诈。区块链\
  \ 是一种避免被中心权威控制的方法。底线是，区块链代表了巨大的进步。\n\n## 第七原则\n\n为了使经济繁荣，社会的每个部分都必须包含在其中。可以说，未包含在今天的经济中的人数远大于已包含的人数。例如，老年人、年轻人和信用差的人没有获得任何银行机构的服务。\n\
  \n包容性可能是区块链最大的原则。虽然 `Ethereum` 和 `Bitcoin` 等加密货币赖的区块链是基于 `TCP/IP` 协议设计的，但可以在不接入互联网的情况下访问。这意味着你可以使用简单的翻盖手机访问它们。构建在\
  \ `Bitcoin` 网络上的服务允许欠发达国家的人通过向服务发送金额 `Bitcoin` 来充值手机余额。\n\n\n\n\n\n# 第三章\n\n\n\n\
  \n# 金融重塑\n\n世界上大多数人的每天生活费低于 `$2`。诚然，`$2` 在世界某些地区比其他地区要耐用得多。然而，研究为什么会发生这种现象至关重要。全球汇款是几乎每一家大型银行的奶牛。让我们来看看当体力劳动者赚取工资并把这笔钱汇回老家父母时会发生什么。劳工通过支票领取工资（因为他们太穷，无法开设银行账户）。支付工资的公司为了获得发行支票的权利，必须向其银行支付\
  \ 1 到 2%的佣金。劳工通过一种服务兑换支票，该服务会收取 `4%` 的费用。然后，他们来到汇款服务机构转账，并面临佣金、汇率波动和中间费用。这笔钱在到达目的地国家家庭手中之前，至少经过了五次手。如果家庭无法解释是谁寄给他们的钱或为什么，这笔钱在扣除费用后将退回给劳工。人们可能会认为金融中介机构是为系统增加了价值，但他们所做的只是将现金从\
  \ A 点转移到 B 点。相反，他们最终吞掉了转账金额 `8` 到 `10%`。\n\n我们目前的金融系统是一个弗兰肯斯坦怪物。该系统运行的流程可以追溯到 18\
  \ 世纪 70 年代末。这并不是夸张。纽约州的资金转账法律可以追溯到内战时期，当时资金是用马车以现金形式移动的。技术的改进层出不穷，但银行仍然认为应该像我们生活在\
  \ 19 世纪一样工作。数字化的改进仅仅是层叠在旧流程之上的。本质上，手动流程被数字化了，而不是被重新设计。没有哪个行业像金融部门这样对变化产生抵触。它喜欢把自己描绘成一个节奏快、只有最优秀、最聪明的人才能工作的行业。然而，它并没有产生任何东西，却收取高昂的费用。\n\
  \n当你在星巴克买拿铁时，交易会立即批准。然而，资金需要三天时间才能到达星巴克的账户。在此期间，它会经过至少两个中介机构，他们会抽取高达购买价格 `two%`\
  \ 的。如果你使用美国运卡支付，商户会损失 `四` 或 `五%`！星巴克在全球范围内拥有分店，为了服务这些分店，它需要在所有这些拥有银行账户。假设曼哈顿中城的一家分店需要向位于西雅图的总部转账。分店经理必须批准转移并向西雅图发起汇款。汇款需要\
  \ `two` 天才能通过。星巴克在传输期间无法将这笔钱作为业务资本。然而，银行可以在此期间利用它赚取息和利润。尽管星巴克是价值的创造者，而银行除了将星巴克的钱转移到星巴克的账户外别无他事。\n\
  \n如果一个人每天做银行做的事，他们可能会因为欺诈而入狱。然而，银行仍然故如初。每个行业都拥抱了技术变革，但金融没有改变。这是为什么？最好的解释是金融是一个垄断。长期以来，该行业由少数几个巨头运营，他们不仅充斥了自己的行业，还充斥了政府。例如，`U.S\
  \ Treasury` 和美国联邦储备银行（Federal Reserve Bank）充满了前 `Goldman Sachs` 的员工。这种雇佣背后的逻辑并不合理。花费职业生涯将纸张从一个客户转到另一个客户手中，怎么就能让一名投资银行家胜任制定货币政策的角色呢？在\
  \ `2007` 到 `2009` 年的经济危机期间，`Treasury Department` 由 `Hank Paulson` 领导，他是前投资银行家和 `Goldman\
  \ Sachs` 的首席执行官。Paulson 多次声明住房市场在 `2007` 年 8 月已处于触底。两年后，他已经为他的投资银行界哥们签了价值 `$475\
  \ billion` 的支票。顺便说一下，那是纳税人的钱。Paulson 声称这笔钱带利润归还的。然而，纳税人并没有看到任何钱。它只是被重新路由到其他救助计划。所有这些事件都是事实，我并不是在煽动愤怒。事实是，金融部门需要彻底的改革，而目前负责的人最不可能批准它。请注意，我在这里并不是主张\
  \ `Bitcoin` 或加密货币。银行首席执行官关于加密货币的许多陈述在经济上是合理的。然而，他们都没有采用 `blockchain`，这才是真正的革命。\n\
  \n## 区块链如何重新设计金融\n\n货币金融系统使用某些理由来维持自身。你已经读过在现代金融世界中，一切都围绕身份展开。`blockchain` 修正了这一点，并将交易置于一切的中心。这意味着金融系统声称提供的许多“价值”都是不必要的。以下是现代金融推崇的价值驱动因素的关键点，以及\
  \ `blockchain` 如何抵消所有这些因素。\n\n### 见证 (Attestation)\n\n这是现代金融赖以生存的首支柱。参与交易的“谁”比交易的“什么”重要得多。金融系统声称，验证身份可以防止金融犯罪并减少对社会的负面影响。只要没有其他替代方案，这个支柱就是真正的价值增值。但现在情况不再如此了。身份之所以重要，是因为我们在中心化系统中建立信任的唯一方式。如果你知道交易的另一端是谁，你就可以推导出许多其他建立信任的数据点。你知道他们住在哪里，他们的交易历史，他们的财务状况和其他重要数据。\n\
  \n`Blockchain` 改变了这一切。在历史上第一次，信任不再建立在身份之上。交易的另一端是谁并不重要；`network` 验证并保护正在交易的产品或货物。记录是不可抹灭的，不需要中介机构来验证。对于我们大多数人来说，这很难想象，因为我们已经习惯了基于“是谁”来建立信任。商店越大，它的信誉就越高。你更宁愿从\
  \ `Amazon` 购买商品，而不是某个偏远地区的卖家，因为你认识 `Amazon` 但不认识那个卖家。\n\n| 现代金融 | 区块链解决方案 |\n| :---\
  \ | :--- |\n| 如果你知道交易的另一端是谁，你就可以推导出许多其他数据点来建立信任。你知道他们住在哪里，他们的交易历史，他们的财务状况和其他重要数据。\
  \ | `Blockchain` 改变了这一切。在历史上第一次，信任不再建立在身份之上。交易的另一端是谁并不重要；`network` 验证并保护正在交易的产品或货物。记录是不可抹灭的，不需要中介机构来验证。\
  \ |\n| 身份之所以重要，是因为我们在中心化系统中建立信任的唯一方式。 | 信任不再建立在身份之上。交易的另一端是谁并不重要。 |\n| 中心化系统需要身份验证。\
  \ | `network` 验证并保护正在交易的产品或货物。 |\n| 中介抽取费用。 | `blockchain` 允许你直接支付卖家。 |\n\n### 成本\
  \ (Cost)\n\n许多评论员错误地认为去中心化与银行之间的争论。银行从 `blockchain` 的采用中获得了巨额利益。从汇款链中移除银行将为消费者带来更大的价值。`Bitcoin\
  \ network` 对交易收取的费用是银行收取的费用的一小部分。结果是为消费者提供了更大的价值。当银行节省的成本和更低的交易费用相结合时，很容易看出小企业和企业家是从这个生态系统中受益的。任何拥有智能手机并接入互联网的人都可以以低成本使用银行服务。这反过来将刺激经济活动并帮助我们建立一个多产的社会。这是少数采用\
  \ `blockchain` 没有负面影响的领域之一。通常，需要某种形式的中心化来使去中心化网络可行。然而，成本消除没有负面影响，当前生态系统中的每个人都从中受益。银行目前由于缺乏替代方案而证明收费合理。然而，随着\
  \ `blockchain` 成为现实，很难看到这种论点是有效的。\n\n### 速度 (Speed)\n\n虽然汇款时间现在是非常糟糕的，但很少有人意识到整个链结算需要很长时间。例如，尽管电子交易发生在纳秒级，股市交易仍需要三三天来结算。我已经提到过星巴克交易需要三到四天结算。之所以需要这么长时间，是因为链条中的中介，他们分走了蛋糕的一块。他们所做的只是从一个点传传到另一个点。国际交易可以有五到六个中介。在一个通信瞬间发生的世界里，唯一的解释是惯性，或者更糟糕的是，旧系统不想改变。首先，交易有更多故障点。如果结算机构故障，股市就处于危险之中。结算机构结算交易的机构需要大量的资金。这笔钱被浪费了。它停留在银行，且什么都不做。\n\
  \n### 风险管理 (Risk Management)\n\n漫长的交易时间从许多方面危害着我们的金融系统。然而，银行仍然故如初。每个行业都拥抱了技术变革，但金融没有改变。这是为什么？最好的解释是金融是一个垄断。长期以来，该行业由少数几个巨头运营，他们不仅充斥了自己的行业，还充斥了政府。例如，`U.S\
  \ Treasury` 和美国联邦储备银行充满了前 `Goldman Sachs` 的员工。这种雇佣背后的逻辑并不合理。花费职业生涯将纸张从一个客户转到另一个客户手中，怎么就能让一名投资银行家胜任制定货币政策的角色呢？在\
  \ `2007` 到 `2009` 年的经济危机期间，`Treasury Department` 由 `Hank Paulson` 领导，他是前投资银行家和 `Goldman\
  \ Sachs` 的首席执行官。Paulson 多次声明住房市场在 `2007` 年 8 月已处于触底。两年后，他已经为他的投资银行界哥们签了价值 `$475\
  \ billion` 的支票。顺便说一下，那是纳税人的钱。Paulson 声称这笔钱带利润归还的。然而，纳税人并没有看到任何钱。它只是被重新路由到其他救助计划。所有这些事件都是事实，我并不是在煽动愤怒。事实是，金融部门需要彻底的改革，而目前负责的人最不可能批准它。请注意，我在这里并不是主张\
  \ `Bitcoin` 或加密货币。银行首席执行官关于加密货币的许多陈述在经济上是合理的。然而，他们都没有采用 `blockchain`，这才是真正的革命。\n\
  \n货币金融系统使用某些理由来维持自身。你已经读过在现代金融世界中，一切都围绕身份展开。`blockchain` 修正了这一点，并将交易置于一切的中心。这意味着金融系统声称提供的许多“价值”都是不必要的。\n\
  \n### 资产创新 (Asset Innovation)\n\n高阶金融通常涉及衍生品和其他工具的创造，允许机构从任何想象的资产中获利。例如，发现华街银行创建根据某天天气支付的衍生品并不稀奇。这些工具通常被推为金融行业创新的例子。虽然此类合同的价值增加存在争议，但毫无疑问它们是有需求的。\n\
  \n### 资产创新 (Asset Innovation)\n\n网络维护和交易验证是大银行长常的后台任务。西班牙银行巨头 `Santander` 报告说，通过采用\
  \ `blockchain networks`，他们每年可以节省 `$20 billion` (Baxi, 2015)。`blockchain` 自动验证并维护交易记录，消除了对此类后台任务的需求。银行可以利用这笔钱向真正需要的人提供银行服务，而不是一直关注富人。银行也从交易成本中收取高额。从汇款链中移除银行将为消费者带来更大的价值。`Bitcoin\
  \ network` 对交易收取的费用是银行收取的费用的一小部分。结果是为消费者提供了更大的价值。当银行节省的成本和更低的交易费用相结合时，很容易看出小企业和企业家是从这个生态系统中受益的。任何拥有智能手机并接入互联网的人都可以以低成本使用银行服务。这反过来将刺激经济活动并帮助我们建立一个多产的社会。这是少数采用\
  \ `blockchain` 没有负面影响的领域之一。通常，需要某种形式的中心化来使去中心化网络可行。然而，成本消除没有负面影响，当前生态系统中的每个人都从中受益。银行目前由于缺乏替代方案而证明收费合理。然而，随着\
  \ `blockchain` 成为现实，很难看到这种论点是有效的。\n\n### 资产创新 (Asset Innovation)\n\n金融部门根据其审计政策而存亡。金融公司在账簿上持有复杂的工具，随时衡量其风险价值至关重要。错误定价资产且未能考虑风险的公司通常会倒闭。内部和外部审计团队帮助他们维持。如果结算机构出现故障，股市就处于危险之中。结算机构需要大量的资金。这笔钱被浪费了。它停留在银行，且什么都不做。\n\
  \n它只是，那银行本身将不再以我们目前认为的方式存在。\n\n\n\n\n\n\n# 第 4 章\n\n\n\n\n# 改变运营架构\n\n现代公司以自上而下的层级结构运营。这些运营模式自工业革命以来就一直存在。当互联网时代刚刚黎明时，人们有很多讨论组织将如何从自上而下的结构转向扁平化结构。然而，观察现在的任何公司，显而易见的是，这些扁平化模型并没有成功。\n\
  \n商业新闻头条大多被日常运营公司的首席执行官（CEO）和创始人所占据。例如，杰夫·贝佐斯（Jeff Bezos）可能已经退出了 `Amazon`，但他留下了一位\
  \ CEO 负责管理。马克·赞克伯格（Mark Zuckerberg）无疑在经营着 `Facebook`，而埃隆·马斯克（Elon Musk）经营着 `Tesla`。`Google`\
  \ 是唯一尝试过扁平化结构的公司。\n\n在早期，`Google` 创建了一个根据员工才华雇佣他们的组织。对此，著名的风险投资人、`Andreessen Horowitz`\
  \ 的马克·安德森森（Marc Andreessen）大哮道，印度在殖民统治下处境要好得多，这种观点与彼得尔（`Thiel`）在书中呼应的想法惊人地相似。硅谷公司数万名印度裔员工（这一群体包含了几乎每家主要科技公司的\
  \ CEO）对这番大斥的看法不所知。然而，`Andreessen` 显然并不在乎这些人的反弹，因为他在集权委员会中的地位是终身保障的。\n\n本节的重点是，集权化对公司和创新的伤害不亚于它对普通人的伤害。如今，人们对公司的信任处于历史低点，我们倾向于将它们看作没有脸的机器。事实是，公司受限于其运营的系统。即使\
  \ CEO 想要这么做，也改变不了什么。当竞争对手可能会因为采取扁平化结构而吞噬它时，`Google` 或 `Amazon` 如何能采用扁平化结构呢？批评这些公司很容易，毫无疑问它们应该受到批评；然而，它们是其所构建平台的产物。重新发明公司需要在构建创造力的基础上进行变革。这目前正在\
  \ `Ethereum` 区块上发生。\n\n## 区块链的承诺\n\n2015 年 7 月 30 日，`Ethereum` 区块链的第一个创世区块被创建。随后，矿工们涌入创建更多区块，并获得\
  \ `Ethereum` 网络的代币 `Ether` 作为奖励。起初，`Ethereum` 被定位为 `Bitcoin` 的替代加密货币。然而，事实并非如此。`Bitcoin`\
  \ 的创建明确目的是作为一种交易手段。`Ethereum` 的目标要大得多。当 `Bitcoin` 谈论颠覆金融系统时，`Ethereum` 赋予了开发者做到这一点的能力。这得益于\
  \ `Ethereum` 创始人维塔尼克·布特林（Vitalik Buterin）与 `Bitcoin` 核心开发团队之间的争议。`Buterin` 认为 `Bitcoin`\
  \ 网络应该为开发者提供更多工具来创建去中心化应用（dApps），而不是迎合单一货币。在未能达成一致的情况下，`Buterin` 创建了自己的区块链网络，而如今，那里是去中心化应用的温床。第一家完全基于区块链建立的公司是\
  \ `Consensys`。`Consensys` 将自己描述为一家区块链创业工作室（`Consensys, 2021`）。它涵盖了许多去中心化应用。\n\n\
  ## 文档与合约管理\n\n沿着上一章描述的价值存储，`Consensys` 正在构建一个应用程序，允许个人和公司通过将价值锁定在智能合约中来存储其他形式的价值。智能合约是自定义的代码行，用于执行所有方同意的一系列规章。这在以前是存在的，但当时没有可以部署它们的网络。区块链的出现，特别是\
  \ `Ethereum` 的出现，改变了这一切。智能合约最强大的方面是，它们可以被执行，并无缝地附加价值。例如，如果供应商同意交付一定数量的材料以换资金，一份合同将管理这笔交易。在集权结构中，材料被交付，付款在一段时间或更久之后释放，这使得客户听凭人摆。然而，通过区块链，合约将立即在网络上释放付款。请注意，在这种情况下，供应商的身份无关无关。唯一重要的是交易条款是否已履行。通过区块链，这很容易验证。`Consensys`\
  \ 使用智能合约在 `Ethereum’s blockchain` 上向其员工和供应商支付费用。\n\n## 三式记账\n\n每家业务都运行在数字之上，并使用财务报表来了解其盈利能力。复式记账是目前设计的最稳健的会计系统，它支撑着整个商业世界。三式记账是一个简单但天才的假设。假设一家公司想要购买某物。那是一项支出。为了记录这笔支出，公司输入两个条目，分别记录在不同的账本中。他们在采购账本中开具采购订单，一旦收到发票，发票就会进入付款账本。这两条记录是相互关联的，因此它们相互抵消。在一天结束时同时，所有账本的总和必须相等。不匹配意味着某些事情未被记账，法务审计师可以介入调查。这就是复式记账运行的局限性所在。它揭示了不匹配的存在，但没有告诉我们不匹配在哪里。法务审计师不得不花费大量资源来查明差异所在，而且在大多数情况下，很难确定错误源头。更糟糕的是，在复式记账中，欺诈可能无法被发现。子公司之间的虚假交易和虚假发票可以制造活动幻象，并掩盖糟糕的收益。这就是\
  \ 2000 世纪初强大的能源交易公司 `Enron` 为了隐藏其欺诈足迹所做的。`Enron` 最终倒闭了，但在那之前给股东和员工造成了数十亿美元的损失。\n\
  \n\n\n\n\n# 第 5 章\n\n\n\n\n# DeFi 与商业模式\n\n在本书中，我已经对平台及其寻租行为发表了相当多的抱怨了。现在是时候详细说明一个去中心化应用（`DApp`）在区块链上是如何运作的了。我之前抨击过\
  \ Airbnb，所以我们就继续以它为例。\n\n目前，Airbnb 会从租客和房东所提供的价值中抽取巨额的收入抽金。作为回报，这个平台提供的唯一价值就是一个评分系统，它可以帮助所有方验证彼此的信誉度。其次，它保证了所有方都能获得大量的流量。租客可以放心，无论他们去到哪里，总会有足够的房源供选择；房东也可以放心，租客会蜂拥这个平台。然而，这些益处之所以存在，是因为没有其他可行的选择。\n\
  \n让我们看看 Airbnb 为了这些收益收取了多少费用。房东需要从租客支付的金额中支付约百分之三的预订费用。3% 听起来并不多，但让我们换个角度来看。当你从房地产中介处购买房产时，他们会收取销售额\
  \ 4% 的佣金。中介人做了很多工作：他们维护房源列表，确保文件流程通过，代表买家或卖方设立托管，并向所有方传达必要信息。\n\n## Airbnb 究竟做了什么接近这种程度的事情？\n\
  \n他们是 `Craigslist` 房源的付费版。事实上，在增长时期，Airbnb 曾建立了一个通往 `Craigslist` 房源列表的后门，以分流流量。硅谷将其誉为增长的典范。在现实世界中，这纯粹是对资产的盗窃。租客不需要支付任何费用，因为租客提供了价值数据，平台利用这些数据进行服务市场营销并推荐房源。这些数据很容易受到黑客攻击。如果这些数据被破解，Airbnb\
  \ 对其可能造成的任何损害不负责。如果 Airbnb 被 Google 或亚马逊接管，这些公司将了解你生活的方方面。\n\n## 去中心化应用将如何运作？\n\n\
  让我们把我们的 DApp 命名为 `dAirbnb`。这个应用运行在区块链上，是一系列`smart contracts`。首先，该应用将包含一个评论系统，允许所有用户验证彼此的行为和记录。\n\
  \n### 房东的房产划算吗？\n\n每个人都可以上传照片，但如果他们不想，不必上传自己的照片。我很快会解释原因。你在 Airbnb 上找到的关于电脑友好型工作空间的过滤器，以及界面，看起来和\
  \ Airbnb 一模一样。区别完全在于底层。当你在应用上进行通信时，消息和交互并不存储在数据库中，而是存储在区块链账本上。消息本身经过加密签名，这使得它们无法被黑客攻击。你和房东是唯一可以阅读这些消息的人。你们可以轻松地交换信息。Airbnb\
  \ 不允许其用户这样做，因为这会导致双方都错失对平台的收入。\n\n### 声誉\n\n去中心化应用没有任何单一权威负责。这意味着评论系统比以往任何时候都重要。用户拥有的评论越多，他们的体验就会越好。现在让我们更进一步。万如果\
  \ `dAirbnb` 只是一个运行在区块链上的应用，而这个区块链上包含了其他几个应用呢？可能会有：\n- `dGrocery` 允许你在线订购杂货\n- `dUber`\
  \ 用于交通\n- `dStylist` 用于任何个人理容\n\n以此类推。\n\n一个完整的应用生态系统，从各种用户那里收集评论，这些用户由于与你互动过，他们可以证明你的品格。如果你以前从未在\
  \ `dAirbnb` 上租过房，房东可以查看你在其他互动中的评价。如果由中心化系统负责，那将是一场反乌托邦的噩梦。然而，一切都在区块链上，因此用户完全控制自己的数据和交互。只揭露你想展示的内容，并隐藏其他所有。如果另一个用户需要敏感信息（由你定义），你可以安全地发送给他们，并知道他们无法利用这些信息。这些信息不会被存储在某个易受黑客攻击的数据库中。因此，在\
  \ `dAirbnb` 上管理和建立声誉比选择线下操作要容易得多。\n\n## 身份验证\n\n谈到区块链，人们的第一个反对意见是人的身份都无法被验证。正如你已经学到的，这并不正确。区块链的反对者将其描述为一个允许任何人假冒任何身份的系统。然而，这并不是区块链的运作方式。用户可以根据自己的需要验证另一个人的\
  \ ID。只是身份被从关注的中心移除了，这是一个很难下咽的药丸。\n\n此外，区块链应用验证身份的方式与中心化应用不同。例如，Airbnb 允许你查看他人的名字和其他信息。通常情况下，这是无害的，因为人们不会分享敏感信息。然而，为了验证你的\
  \ ID，Airbnb 会从护照和身份证等敏感文件中收集信息。区块链上的身份验证协议工作方式完全不同。本质上，它是双方之间签署的一份 `smart contract`。合同位于双方之间，验证双方都是他们所声称的。任何一方都不会提供敏感信息或除对方提供的信息之外的任何信息。\n\
  \n（注：原文后续段落存在大量逻辑重复和乱码字符，译文已根据语意进行平滑处理，并保持技术术语一致性）\n\n\n\n\n\n# 第 6 章\n\n\n\n\n\
  # 物理账本去中心化\n\n什么是物理账本，它又是如何去中心化的？\n\n账本是一个电子文件，因此给它加上“物理”一词似乎很奇怪。得益于 `IoT` 设备的使用，物理账本在如今正成为现实。一个\
  \ `IoT` 或智能设备可以监控自身，并将这些数据传输给其网络上的用户。例如，现在的汽车就是 `IoT` 设备。它们将使用数据传输给制造商，并通过 `GPS`\
  \ 与中央指挥中心保持联系。如果你的车被盗了，这个中心可以在几分钟内追踪到它的位置。同样，现在的生产线内部也运行着 `IoT` 设备。所有这些设备都会追踪其使用和磨损数据，从而向公司预警维护问题等等信息。\n\
  \n`IoT` 设备是互联网的物理表现，它们的力量是巨大的。自然地，它们会产生海量数据，而在中心化系统中，这是一个问题。以 `Alexa` 为例。`Alexa`\
  \ 留在你家里，不断收集关于你订购的所有物品以及对它说的话。据可靠来源显示，`Alexa` 和其他语音激活的家庭助手在未被唤醒时也会听我们的对话（Su, 2021）。你会信任像\
  \ `Amazon` 这样的公司来处理你的私人对话吗？\n\n`IoT` 对我们的世界有巨大的应用。目前 `IoT` 设备效用的最佳案例之一发生在澳大利亚的内陆。澳洲内陆以偏远闻名，生活在那里的农民依赖自然能源来源来帮助他们对抗恶劣的天气。电线杆将能量从主电网传输到各个农场。然而，如果单根电线杆故障，就会导致可能是致命的停电。水泵将停止运行，考虑到与文明世界的距离，修复损坏可能需要一段时间。\n\
  \n为了应对这个问题，澳大利亚当局使用了嵌入传感器的电线杆。这些传感器将状态相关信息传输给相隔 200 米的其他电线杆。每根电线杆像这样连续传输数据，直到到达互联网变电站并将所有数据传输给中央机构。因此，如果某根电线杆故障，靠近它的其他电线杆就会收到警告，最终会传到中央机构。这是一个巨大的网络，工作方式非常像\
  \ `blockchain`，电线杆充当着节点。\n\n这些 `IoT` 驱动的网络拥有无限可能。首先，它们可以用于创建网状网络（mesh networks）。网状网络是一种自服务网络，因为它监控自己的状态和资源，并实时决定将这些资源分配给其他网络。\n\
  \n## 网状网络\n\n在内陆维持电力的网络是由一家名为 `Filament` 的美国公司驱动的网状网络。`Filament` 将数据维护在去中心化的账本上，而不是中心化的数据库。这样做有几个原因。首先，`Filament`\
  \ 允许当地人通过开放网络连接到 `IoT` 设备，赋予了他们作为电力监测员的能力。\n\n它是这样工作的。假设你住在内陆的一根电线杆附近。你可以走到电线杆旁，使用\
  \ `Bluetooth` 连接它，并在智能手机上接收它的相关数据。你现在可以使用这些数据将其传输到中心枢纽，或者将其留作记录。因此，个人变成了传输网的监测员，而公用事业供应商减少了运营开销。\n\
  \n在 `IoT` 电线杆演变之前，公用公司必须花费大量资源派遣员工遍布内陆，检查每根电线杆的状态。`IoT` 通过自动化数据收集解决了这个问题，而 `blockchain`\
  \ 则通过赋予当地人追踪数据的能力进一步解决了它。\n\n`Filament` 脑中还有第二个宏大的计划。这与网络使用有关。在 `IoT` 圈内，关于持续传输与间歇性传输存在巨大争论。持续传输一直转发数据，而间歇性设备偶尔执行一次。间歇性设备成本较低，因为它们对连接的要求较低，产生的热量较少，而且由于使用率降低不易磨损。问题是间歇性连接很难实施。此外，它不能保证快速响应。\n\
  \n如果一根电线杆在每小时整点报到，但在小时的第一分钟失败了呢？供应至少将中断 59 分钟。为了证明持续连接的成本，`Filament` 正在思考类似于 `blockchain`\
  \ 的去中心化解决方案。例如，每根电线杆在特定时间使用带宽。\n\n## 供应\n\n例如，每根电线杆在某些时间使用带宽，但并不总是需要（就像放在某人车库里的工具一样）。如果路人可以与每根电线杆签署\
  \ `smart contract` 并将其网络用于自己的目的会怎样？想象一辆送货车开过内陆。司机不必依赖昂贵的基础设施（在荒郊野外很难安装）或无效的移动数据（手机信号在丛林中可能会消失），而是连接他们过的每根电线杆，并使用该网络将信号中继到系统中。刚了解到供应链的缺陷，一个即使在荒郊野外也能连接的网状网络将轻松解决追踪问题。它将降低基础设施成本，并让人们无论在何处都能访问信息。\n\
  \n## 社会\n\n`Filament` 的计划围绕着 `smart contract` 展开。\n\n\n\n\n\n# 第 7 章\n\n\n\n\n#\
  \ 经济包容\n\n经济排斥的代价是什么？无论生活在美国还是任何发达国家，很难想象某些国家将其公民推向何种程度的深渊。以尼加拉瓜为例。这个国家天资独厚，拥有壮丽的风景，却是该地区乃至世界上最不发达的国家之一。尽管自然资源丰富，其公民几乎无法获得繁荣。银行体系和先前的政治功能失灵是其根源。\n\
  \n长期以来，尼加拉瓜由一个名为`桑丁诺主义`（Sandinistas）的所谓社会主义政统治。他们夺取了国家控制并迅速执行他们的社会主义目标。第一步是将一切国有化并禁止资产所有。这意味着土地从私人手中被没收并归政府所有。内部腐败和美国人的外部干预确保了政府在苏联崩溃后于\
  \ 20 世纪 90 年代倒台。如今，尼加拉瓜的政治表面上运行着公平自由的选举制度，但实际上由前`桑丁诺主义`主导。\n\n雪上加霜的是，被社会主义政府没收的土地随后分配给了政党成员。这导致了前地主的反抗，法律系统陷入了土地所有权的纠纷中。银行体系极不发达，因为社会主义经济不需要银行。这导致只有\
  \ 19% 的尼加拉瓜人拥有银行账户，只有 9% 的人可以获得贷款和传统金融系统的服务（`Tapscott & Tapscott, 2016`）。\n\n在观察该国的农业状况时，这个问题尤为突出。像任何不发达国家一样，尼加拉瓜依赖于`农业`经济。得益于肥沃的土壤和丰富的海洋，渔业和农业是最大的产业。问题在于，个体渔民和农民无法获得财富。单个渔民无法借到足够的钱来装备他们的设备。相反，他们加入了一个合作社，多位渔民聚集在一起创造资源来装备设备。一个人借足够的钱买网，另一个人买发动机，以此类推。大家轮流出海，捕鱼的钱由大家分享。这是对破碎的资本主义体系的一种社会主义解决方案。\n\
  \n农业的情况更加糟糕。没有人有足够的钱来耕种他们居住的土地。更糟糕的是，没有人知道土地归谁，这导致了腐败。因此，我们所知的金钱几乎不存在。农民得到的不是现金补偿，而是猪。猪是一种实物资源。它提供肉类和幼猪，从而提供更多资源。因此，在食物和水保障的情况下，尼加拉瓜农民用猪进行交易。一个人拥有的猪越多，就越富有。然而，猪并不是一种安全的交易来源。它们会跑掉、因疾病死亡，并可能被偷窃。你可以想象，这导致了农村地区的冲突，抢夺别人的猪是稀常便饭。简而言之，整个体系的混乱程度是普通第一世界国家居民无法想象的。\n\
  \n微型金融公司正在帮助解决这一局面，但即便在这里，也很难推销。人们根本不信任金钱。如果给他们现金，他们没有银行账户可以存入。如果他们真的把钱存入银行，也没有什么能阻止银行挪用资金。那么解决方案是什么呢？\n\
  \n## 促进经济包容\n\n从经济中被排斥的问题涉及多个方面。种族、性别、宗教和其他偏见在经济排斥中起着作用。例如，如果你向银行申请贷款，而银行官员单纯不喜欢你的宗教，或者认为女性不该做此工作，会怎样？\n\
  \n在他的著作《资本》（`Capital`）中，`托马斯·皮凯蒂`（Thomas Piketty）认为，现代资本主义体系正在加剧不平等（`Piketty, 2019`）。然而，问题不在于资本主义，而在于其中心化的本质。富人已经比我们其他人富得得多。\n\
  \n资本主义让印度和中国的数十亿人脱了贫困，但这些人中的大多数人无法享受西方人般的生活。简而言之，虽然集权资本主义提升了标准，但它对某些人的收益远大于大多数人。例如，如果`杰夫·贝佐斯`（Jeff\
  \ Bezos）变现他在`亚马逊`（Amazon）的持股并将其存入储蓄账户，他将成为世界上最高收入者。尽管他放弃了那些没有创造价值的股份。世界上全球 1% 的人最初创造了大部分价值，但一旦他们的钱开始接管一切。\n\
  \n那么，区块链如何纠正这种不平衡呢？一切从身份开始。\n\n### 身份与金融包容\n\n身份是我们现在拥有的最重要数据。政府和银行等机构痴迷于了解我们是谁。`KYC`（了解你的客户）规范要求深入研究客户历史，并确定他们有多大的风险。监管控制并没有为银行提供激励。这就是为什么银行对每件事都要求堆如山的文件，而且很少向不符合条件的人发放贷款。在\
  \ 2008 年金融危机之后，银行资金充裕，但监管机构收紧了标准。结果是，最需要钱的人没有获得任何钱。简而言之，那些相对边缘化且有钱的人占了优势，不平等随之加剧。\n\
  \n假设某人在`Airbnb` 上表现糟糕。他们要抹除自己的糟糕行为记录和低评价，唯一需要做的就是使用不同的电子邮件地址并创建一个新账户。如果 `Airbnb`\
  \ 封了他们，他们可以使用朋友的电子邮件，并使用他们的 `ID` 访问平台。朋友只需说他们在为别人预订房间，房东就不会举报该活动。最糟糕的是，如果任何一方行为恶劣，`Airbnb`\
  \ 不会面临任何后果。整个系统激励人们去欺骗 `Airbnb` 而不是表现良好。\n\n在区块链上，这是可能的，因为每笔交易都是公开的，更改电子邮件地址不会抹除记录。诚然，存在过去的错误给个人带来重负担的风险。例如，某人在\
  \ 16 岁时做了一件蠢事，为此付出了沉重代价，即使在 40 岁时这件事仍挂在他们身上。他们的信任分会很低。目前的系统没有给这些人重新开始的机会。系统设计的某些方式并不符合逻辑。它鼓励人们借钱而不是储蓄。例如，如果你关闭信用卡账户，你的\
  \ `FICO` 分会下降。在 `FICO` 世界里，让信用账户保持休眠状态的人是良好的借款人。\n\n金融科技公司开始纠正这种不平衡。得益于 `AI` 驱动算法，公司可以扫描社交媒体简介和其他非传统指标（如工资发放频率），以设计一种替代评分系统。结果是，社会中缺乏服务的群体（如学生和老人）现在可以获得服务。然而，即使是金融科技在评估不在银行体系内的人员时也遇到了问题。以一个普通的尼加拉瓜农民或渔民为例。一个人如何根据其经济历史建立信用分？要求这些人开设银行账户尤为困难。\n\
  \n\n\n\n\n# 第 8 章\n\n\n\n去中心化政府。自由意志主义者经常将“小政府”描绘为国家的理想结构。然而，这种愿景本身也存在问题。首先，法律和法规的缺乏将激励人们盗窃资产，结果将导致一个权力集中在少数人手中的威权国家或寡头政治国家。\n\
  \n问题的核心在于信任。政府要实现自身最小化，需要一种方法来对其土地上的每位居民进行记录，以便高效地提供服务。目前，唯一的方法是创建一个统一身份系统，将每位居民的生物识别和个人信息记录在卡片上。这张卡可以用于访问服务、开设银行账户，甚至作为交通卡使用。\n\
  \n问题在于没人信任他们的政府。最近对美国人的调查显示，大多数人认为`Congress` 是功能失调的，政党与其支持者之间日益加大的分歧也凸显了这一点。尽管在许多问题上达成共识，但双方都在魔化对方。例如，92%的美国人希望对购枪者进行背景审查。然而，得益于强大的游说集团，这个问题被转变成了完全不同的东西，而对基本事实认同的人却在争论由游说集团策划的对立观点。\n\
  \n`Facebook`及其互动算法并不关心它所造成的社会伤害，并为了更大的利润而延续这些谎言。在这样的氛围下，你能想象将自己的个人信息交给政府吗？你的第一个反应会是怀疑政府现在是否会会对你实施监控措施并追踪你的一一动。中国政府已经对公民和访客这样做了，而没有人想生活在这样一个反乌托邦式的环境中。\n\
  \n在过去的十年中（2010-2020 年），印度一届届政府启动了全球最大的统一识别计划。人们实际上被迫向政府移交个人和生物识别信息，包括授予对银行账户的访问权限。这种统一身份现在对于从领取政府补贴到获得驾照的一切事务都是必不可少的。在这些过程中，腐败开始抬头。有人被发现持有属于他人地址的虚假身份证。也有报告称，对立政党正被该识别系统进行追踪。自然地，所有关于该系统的负面报告都被贴上“不爱国”和“反国家”的标签，在政府的压力下，这些声音被`Facebook`和`Twitter`审查。这就是为什么像`Canada`这样的国家反对将统一身份作为政府政策的原因之一。它显然侵犯了公民的权利，并迫使他们进行浮士交易：交出个人数据以换取生活的便利。\n\
  \n然而，有一个国家成功运行了统一身份并成功建立了无信任系统。\n\n## 无信任系统\n\n与听起来相反，“无信任”并不意味着一个不可信任的系统。它意味着一个系统在不需要人工干预的情况下建立信任，同时确保目标接收者之外的所有人都无法获取个人数据。`blockchain`就是一个无信任网络，因为它是基于交易的。\n\
  \n爱沙尼亚的电子政府计划是无信任政府系统的典范。爱沙尼亚在 1991 年从崩溃的苏联获得独立后首先建立了该计划，有机会重新思考政府在公民生活中的作用。互联网可能在这个国家实现了其最大的愿景。爱沙尼亚人拥有电子身份，使他们能够完成操作银行账户到支付公共交通费用的一切。爱沙尼亚人在线投票、在线访问医疗记录，甚至可以在\
  \ 20 分钟内在线建立公司。\n\n爱沙尼亚的电子居民计划允许世界上任何地方的人创建电子身份，利用该身份在欧盟司法管辖区开设公司并完全在线运营。让人们加入该系统的关键是信任，而`blockchain`帮助爱沙尼亚建立了这种信任。爱沙尼亚网络的网络安全由`Keyless\
  \ Signature Infrastructure`（`KSI`）提供，这是革命性网络上的革命性应用。`KSI`不使用管理员或加密密钥来验证信息。所有交易都通过数学方式验证，在任何步骤都不需要人类验证任何内容。由于`blockchain`的不可更改性，爱沙尼亚政府无法伪造记录或改变流行叙事。投票通过直接民主模式进行，公民对所有问题进行在线投票。选票无法被腐败或更改。\n\
  \n这种电子政府系统消除了地球上几乎每个国家面临的大政府问题。无论你谈论哪个政府，每个政府办公室似乎都吸引了最没能力的人。任何去政府办公室的都是对耐心的考验，因为官僚主义胜过了常识。漏掉一份文件或错误输入某些记录，就会有人准备好指出你的错误并对你行使权力。简而言之，这是最糟糕的世界。平均政府官员是世界上最大的寻租者。\
  \ \n\n在美国，大政府导致了游说集团的形成，这些集团使公共政策向其议程倾斜。枪支管制……\n\n\n\n\n# 第 9 章\n\n\n\n\n# 实现挑战\n\
  \n区块链对我们的社会具有巨大的潜力，但与任何新技术一样，它面临着挑战。纵观历史，每一项技术都被同时用于善意和恶。例如，一旦人们意识到原子分裂的巨大潜力，各国政府就急于利用它发电并制造炸弹。没有任何技术是能够免受腐败的，无论其协议有多稳健。区块链的许多特性可能让独裁国家获益，并加剧不平等。例如，网络上的记录是不可篡改的。没有人可以删除数据或以任何方式对其修改。从长远来看，这是一好事。然而，如果输入网络的数据是损坏的怎么办？谁来保护数据输入过程？这就是为什么我反复提到，区块链只是一个工具，最终由人来决定如何使用它。一个腐败的国家不会因为区块链而一夜之间变成光辉的灯塔。大型企业及其代表可以收编区块链，并创建比现今网络更稳健的围墙网络。这将导致更大的不平等并扩大经济差距。\n\
  \n在评估区块链的潜力时，存在一种盲目乐观并任由想象力飞扬的危险。许多在区块链上开发改变游戏规则应用的企业家也在谈论彻底改变社会等内容。上一章为你提供了一些可能改变程度的例子。人们很容易将这些想法斥为胡说，并列出这些人面临的障碍清单。在本章中，我将过过其中的一些障碍。由于障碍如此巨大，所有这些都会让人觉得区块链之梦不值得追求。然而，在否定区块链的潜力时要留心。问问自己，这些障碍是因为区块链架构的固有缺陷，还是由于人类的缺陷？系统性缺陷构成了巨大的障碍，人性也是如此。并不是每一个障碍都是区块链本身造成的。因此，请务必尽可能客观地评估所有这些点。\n\
  \n## 准备工作不足\n\n单单这一个障碍就可能让区块链革命彻底停滞。为了观察准备工作不足如何减慢区块链火车的速度，查看一个区块链应用的示例是有帮助的：`Bitcoin\
  \ (BTC)`。自从 `BTC` 作为首个登场以来，它已成为所有区块链应用的旗舰。`BTC` 拥有的许多缺陷也存在于其他网络中。`BTC` 面临的首要挑战是目前没有足够的设施来帮助它繁荣。假设今天你的国家发生了金融危机，你想将暴跌的法币兑换成\
  \ `BTC`。如果你了解区块链的工作原理并精通钱包和加密货币交易所，你可能办得到。然而，将你的法币兑换成 `BTC` 比兑换成另一种法币困难得多。这就是希腊、委内瑞拉和津巴布韦的人们在他们的疯狂政府开始破坏价值时面临的问题。有些人成功地通过将法币兑换成\
  \ `BTC` 挽救了净资产。然而，大多数人没有。没有机制允许他们这样做。即使这些人成功地将他们的法币兑换成了 `BTC`，它也将另一个问题推向了台前。\n\n\
  ### 交易容量\n\n`BTC`（以及任何其他加密网络）缺乏一夜内入载超过 1000 到 2000 万用户的。简单来说，网络将由于压力而崩溃并产生更多问题。理解这个问题的一个好方法是看电子邮件流行时互联网发生了什么。在千禧年年初，`AOL`\
  \ 是美国领先的电子邮件地址提供商。一夜之间，他们接入了 230 万用户，突然，这些用户就能与世界进行电子通信了。问题是互联网还没有准备好处理这种突如其来的活动高峰。虽然它最终调整了过来，但对初始问题的处理并不理想。其他问题如电子邮件安全和密码保护也浮出了水面。人们缺乏电子邮件礼仪，因为没有人知道电子邮件是如何工作的。垃圾邮件呈指数级增长，钓鱼攻击也开始增长。由于缺乏渐进发布，用户很难适应新世界。同样的问题如果用户没有被仔细接入，会在区块链上发生。加上\
  \ `BTC` 的货币价值，你可以看到问题的规模。礼仪的缺乏在加密货币中是一个更大的问题，因为货币价值是巨大的。想想那些最初注册了钱包并看到 `BTC` 被盗的人。或者那些忘记了私钥并永远丢失\
  \ `BTC` 的人？当币值天文数字般增长时，技术对普通人来说是不可及的。事实上，围绕技术的术语对普通人来说难以理解。加密钱包地址是 26 个字符长。向某人发送资金极其复杂。将其与\
  \ `Google` 在互联网上搜索的简单程度相比。你输入一个单词或短语，就离开了。在像 `Paypal` 这样的中心化系统中转账，你需要输入地址。如果你在销售点，刷你的卡，就了。所有这些支付都是即时的，且纠纷解决是简单的。相比之下，`BTC`\
  \ 网络需要 10 分钟来完成一次交易。虽然这比普通人预期的要快，但对于简单支付来说并不是接受的时间范围。此外，对于不断在网络上流数据的 `IoT` 设备来说这是没用的。想象一下供应链中的\
  \ 10 分钟延迟。你会付钱看“直播”供应吗？可能不会。\n\n### 囤积\n\n囤积的问题限于加密货币。所有流行的代币都有有限供应。`BTC` 有著名的有限供应，将在\
  \ 2140 年之后。`Satoshi Nakamoto` 指出 `BTC` 意为数字黄金。那么，如今是如何对待黄金的？人们囤积而不花费。他们囤积是希望价值随着时间的推移而增加。`BTC`\
  \ 网络上的几乎都在做同样的事情。为了缓解这个问题，开发者引入了微支付。然而，随着 `BTC` 价格上涨，金额可能太多，无法支付日常用品。如果 0.0001 个\
  \ `BTC` 价值 100 美元，你没什么可以用它做什么。你无法进行小额购买或。由于这个原因，开发者现在正考虑引入微支付。随着时间的推移，这可能太多了，因为一切都与单个\
  \ `BTC` 的价值挂钩，并旨在让更多人使用它。\n\n## 能量\n\n没有办法可以绕过这一点。目前，像 `BTC` 这样基于区块链的网络比塞浦路斯消耗更多能量。考虑到我们世界正在经历的气候变化，这不是一个问题。到目前为止，还没有提供可行的环保解决方案，这并不是由于缺乏尝试。这种情况下最大的罪魁祸首是工作量共识模型。它的兴起导致了投入开发更快芯片的资源军备竞赛。如今，`ASIC`\
  \ 矿机主导了市场，尽管挖掘是一项亏损交易。矿工在挖掘 `BTC` 时必须考虑电力和能量成本。问题是 `BTC` 网络奖励奖励在经过数量交易后会减半。在早期，少量的算力在几小时内就获得了数千个\
  \ `BTC`。如今，使用 `ASICs` 挖掘一个 `BTC` 需要 100 天。在这些 100 天里，你需要支付电费并购买矿机。平均 `ASIC` 成本约为\
  \ 2000 美元。这意味着你需要花费 20000 美元购买矿机。取决于你所在地区的电费，你最终会在在此期间支付接近 2000 美元或更多。这意味着你的支出成本为\
  \ 22000 美元。只要 `BTC` 的价格保持在此以上且电费保持水平，你就能盈利。这个计算没有考虑其他成本。`ASIC` 矿机噪音大且产生大量热量。你不能将它们接入标准电网并投入使用。它们可能会从中心枢纽抽取过多电力并导致电网崩溃（或使其不稳定）。你需要将矿机搬到某个可能不会干扰人的偏远地区。虽然实现盈利很难，但事实是，所有这些算力都可以用于比挖掘投机性东西更好的用途。目前，所有加密货币都是投机性的，因为它们有价值是因为大家都认为未来会有买家为它们支付更多费用。它们没有内在价值，不像生产商品和服务的并拥有员工的业务。它们与黄金相似，因为它们有价值是因为大家都认为如此。只是加密货币没有像黄金那样拥有\
  \ 2500 年人类文明的历史背景。如果那些算力被用来解决癌症或找到更好的重新分配财富的方法呢？社会不会获益吗？我必须提到，能量问题目前限于加密货币。然而，区块链受到了它的影响。一种解决方案可以是增加代币奖励率，以免能量被消耗得过多。然而，问题仍然存在。如果区块链被采用，它的奖励将与其环境成本进行权衡。区块链的支持者争论道。\n\
  \n\n\n\n\n# 结论\n\n区块链代表了人类跨越发展和重新设计传统范式的机会。从我们的日常互动到庞大的机构，一切都面临着被颠覆。虽然这无疑会带来一些负面影响，但积极改变的潜力是巨大的。金融领域的去中心化应用可以改变我们看待货币、价值存储和日常交易的方式。诚然，区块链目前的状态尚未准备好进行大规模应用。然而，它是我们迫切需要的解决方案。\n\
  \n环顾当今世界，你所看到的都是不满的故事。这些故事大部分确实是由社交媒体的互动算法驱动的，但如果你观察大多数国家的政治状况，你会发现极右翼运动（以及极左翼运动）正日益获得立足。在像欧洲这样对法西斯主义记忆历历犹新的地方，这是一种令人担忧的发展。那些不能保证平等和财富公平分配的环境会滋生此类有害的运动。\n\
  \n区块链为我们提供了一个解决这些不平等问题并将权力平衡移回中心的机会。目前，西方经济采取了“K 型”恢复模型，富者愈富，穷者愈穷。由于中心化机构对这类人实施了严格的监管，想要打破贫困循环变得日益困难。从信用分到投票权，一切都受到大政府的控制，而这并不是我们所签约的世界。\n\
  \n区块链将对这些旧机构强制透明化，并带来一个让精英真正获得回报的社会。得益于区块链的点对点架构，它可以帮助从监管机构到企业家的每个人，并设计出一个更具包容性为所有人服务的社会。最重要的是，它无疑会让世界更加紧密。\n\
  \n出生在尼加拉瓜的农民将不再是该金融系统的奴隶。他们可以从全球任何角落获取贷款和金融服务。向家里的亲戚汇钱将不再需要几天时间并花费交易金额的 20%。相反，将是瞬时的，成本仅为该金额的一小部分。\n\
  \n区块链爱好者并不总是快于承认去中心化模型的缺陷，正如我在书中做的那样。然而，这些缺陷大多数是技术处于初级阶段的结果。尽管如此，注意这些问题并理解变革源于人而非技术很重要。世界将如何利用区块链创造更好的社会？旧的中心化机构将如何对这种权力的新威胁做出反应？只有时间能证明。\n\
