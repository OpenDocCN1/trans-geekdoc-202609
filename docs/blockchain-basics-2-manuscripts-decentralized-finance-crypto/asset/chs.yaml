  # 引言\n\n你可能已经听了很久关于加密货币（比如 `Bitcoin` 和 `Ethereum`）的话了。这似乎最初是一个荒谬的想法，但现在已经真正主宰了科技和金融世界。在这个世界上，任何一个投资金钱或对技术感兴趣的人都可能接触过加密货币的世界。你会听到很多人成为它的支持者，并建议你开始投资\
  \ `Bitcoin` 和其他加密货币。另一方面，你也会遇到怀疑者，他们认为这种东西我们不应该投入资源，因为它不可持续的。对于任何具有改变世界潜力的想法和技术，总会有怀疑者和支持者。大多数重大创新都曾遇到那些尚未准备好接受其可能带来的变化的人的阻碍。事实上，有这样的人是一件好事。怀疑者是那些发现缺陷并可能引导改进的人。另一方面，完全支持创新的人将是那些适应变化并真正接受它的人。\n\
  \n无论你对加密货币怎么看，有一点是不可否认的，这是一个极其有趣的话题。即使是那些讨厌这个想法的人，对它的内部机制也感兴趣。这是因为以前从未出现过这样的东西。它是一个如此复杂的系统，以至于那些不相信它的人也会对后台运行的努力和机制感到惊叹。允许加密货币运作和繁荣的系统，比公众获得的大多数其他技术形式都要更加复杂。这激发了公众，以及明确对技术甚至财务感兴趣的人的兴趣。\n\
  \n`Bitcoin` 和其他加密货币的兴起是由许多不同原因造成的，这些原因涵盖了从金融业现状到地缘政治的各个领域。关于这个话题有很多内容要涵盖，因为它不能简单地从某方面来解释。如果你要求一个精通加密货币一切的人向你解释，你将坐在那里听他解释很长时间。没有办法给出简短的回答，因为每个答案都会导致更多问题，或者需要某种先前提。许多人正因为这个原因而避开学习加密货币。它看起来可能非常技术且难以理解。如果你过去曾有这种感觉，你应该知道你并不孤单。大多数投资加密货币的人并不真正了解其中的机制和精妙之处。这其实没关系，你不需要在投资或使用它之前了解加密货币的所有细节。只要你了解基本原理，就能应付自如。这将是该系统的另一个吸引力。在目前的金融体系下，有时你会觉得必须拥有金融学硕士学位才能取得进展并做出明智的决定。大多数人并不知道自己的财务状况正在发生什么，只是被动地接受费用和决策的后果。不仅如此，感觉就像拥有银行账户的人并没有真正控制自己的金钱。银行可以关闭、冻结账户并随心所欲地转移资金。这在许多方面限制了人们，并没有让用户对自己的钱拥有完全控制权。在一个拥有金钱和积累财富如此重要的时代，这不是许多人所能满意的。这就是为什么世界准备好迎接另一种选择，并以如此积极的方式接受了加密货币及其所带来的一切。\n\
  \n在继续之前，重要的是理解，这绝不是一本理财建议书。它不会告诉你如何投资 `Bitcoin` 以获得最佳回报。它不会告诉你对自己的金钱应该做或不该做什么。这本书甚至不会成为加密货币的支持者。这本书设计的目的只是让你对加密货币的世界进行深度观察。有这么多需要了解和学习的内容，以至于页面充满了新颖有趣的信息。这里的目标是让你在读完这本书后，了解这些加密货币是如何创造的、未来将会变成什么样、系统实际上是如何运作的，并向你展示允许你使用它们的流程。\n\
  \n在涉及到加密货币时，你需要了解的最重要的事情之一是 `blockchain`。它是一个复杂的系统，允许一切在不需要中心化实体控制的情况下运行。它是所有加密货币的基础，也是理解市面上大型加密货币背后流程的关键。这项技术的神奇之处在于，它有许多不同的用途。许多其他公司已经注意到了这一点，并努力将其整合到他们的工作中。这将带来一种更快速、更高效、更值得信赖的方式。如果你想了解\
  \ `blockchain` 是如何工作的以及它到底是什么，书中有很多信息可以回答这些问题。一旦你理解了 `blockchain`，将其他碎片组合起来就会变得容易得多。\n\
  \n\n\n\n# 第一章\n\n\n\n\n# 数字货币的崛起\n\n众所周知，自货币的诞生以来，我们处理资金的方式已经发生了巨大的变化。我们从交易实物开始，转到使用由贵金属制造的硬币，最终决定纸币是出路，而现在大多数人不再手里持有实体货币了。当然，也有支付现金并使用实体货币作为交易手段的选择，但对于世界上许多人来说，我们只使用卡片和银行应用程序来处理、交换和转账资金。我们都可以预见到，在不久的将来，实体货币的存在可能成为过去。通过数字方式处理你的资金要简单且安全得多。如果你的生活积蓄存在银行账户中，比放在厨房橱柜的包里或床垫下被盗的几率要小得多。此外，考虑到现在物价昂贵得多，而且我们想要储下大额资金，将这一切以现金形式存在是不行的。向数字货币的转变始于人们在全球范围内迁移，互联网开始将我们与那些遥远的人联系起来。每个人都变得更加流动且联系紧密，这一事实意味着实体货币的使用有其局限性。如果在今天我们仍然只使用实体货币，生活将变得困难得多，或者至少不那么方便。父母无法寄钱给去远读寄宿学校或大学的孩子。我们必须将假期计划精确到每一分，并带上所需的确切现金。你能想象携带数千美元去往其他国家吗？你可以很容易看出这在各个方面是多么危险且具有局限性。西方大部分地区已经习惯了数字货币的概念。我们大多数人在大多数交易和交换中都使用它。`EFTs`、电汇、甚至对信用卡和借记卡的使用让实体形式的货币几乎过时了。许多人会告诉你，他们相信实体货币的使用最终会在未来的某个时间点停止。我们不知道这何时会发生，但毫无疑问，我们正越来越多地转向数字解决方案，而不是我们使用了许多年的物理方案。\n\
  \n## 数字货币与加密货币的区别\n\n很容易混淆这两个术语，并认为它们是同一件事。然而，值得注意的是，加密货币和数字货币并不完全相同。数字货币是指任何你无法在手里持有的货币形式。你可以对它进行传输和交换，而无需实际持有这些资金并进行实物交易。数字货币的所有方面都可以通过互联网和在线平台进行处理。数字货币将加密货币包含在其范围内，但加密货币并不是数字货币的唯一形式；这两个术语不能互换。如果你听到有人谈论数字货币，他们可能也在谈论他们在银行里的钱，并可以使用某种银行应用程序进行移动。现在，有很多人在使用数字货币；它已成为常态。如果你听到有人把钱藏在床垫下，你可能会认为这有点落后，因为那里有许多其他更有益且更安全的解决方案。\n\
  \n加密货币是完全另一回事。这是一个新得多的概念，因此受到了一些怀疑。多年来，加密货币证明了它是一种可靠的货币形式，并且极可能为我们未来的办事方式铺路。为了能够妥善解释数字货币和加密货币之间的区别，我们必须首先将它们解释为独立的实体。数字货币是通过互联网访问的货币余额或记录。它可以存储在分布式数据库、储值卡、计算机数据库或数字文件中。这意味着在数字货币方面有很多选择。例子包括中央银行数字货币、`e-cash`（电子现金）和加密货币。数字货币的运行方式与实体货币相似。你可以以相同的方式进行交易和交换，并购买现实世界中的商品。由于它没有物理形式，它在某些情况下允许长距离的资金传输几乎是瞬时的。有些人说，存入银行并以数字方式使用的实体货币不应归类为数字货币。然而，大多数人认为任何非实体的、可购买商品服务的货币都可以归类为数字货币。\n\
  \n## 加密货币特征\n\n加密货币没有现实世界的对等物。这意味着你不能将其从系统中取出并像实体现金一样花掉。一切都留在`blockchain`（区块链）系统中，这就是所有交易发生的方式。使用公共账本和加密技术来执行安全交易。有了`Bitcoin`\
  \ 和其他几种流行的加密货币，也没有中央机构来控制所有的加密货币。一切都是去中心化的，允许用户对货币的运行情况拥有控制权。如果工作方式或整个系统需要进行更改，就需要进行投票，只有当大多数规则支持该更改时，才会实施。如果加密货币是中心化的并由特定实体控制，它将不具有上述的原则。相反，它的运行将几乎与银行持有资金一样，因为中心化权威将对货币拥有控制权，取决于你使用哪一种，将会有不同的规则和条例。对你计划投资和使用的特定加密货币进行研究是非常重要的。并非所有的加密货币都是平等的，这意味着适用于某一种的并不一定适用于另一种。\n\
  \n## 银行系统的缺陷\n\n许多人的观念是，我们不需要修复已经坏掉的东西。由于银行系统已经存在很长时间，人们对它的运作方式感到安全，可能不想改变。为了真正让它成为一个新想法或发明，它必须解决一个问题。如果它不能解决当前的痛点，人们就不会买账。就目前而言，加密货币能够解决银行无法解决或实际上所制造的问题。当你意识到这一点时，如果你想成为其中的一员，紧跟世界发生的变化比以往任何时候都更重要。\n\
  \n## 银行并非所有人都能触及\n\n如果你在一个发达国家或第三世界国家生活，获取银行服务可能你从未考虑过的事情。然而，世界上仍有十亿人没有银行账户。这意味着他们无法获得银行服务。许多这类人仍然没有账户的最主要原因是他们没有足够的钱，或者银行的费用太高，开户太贵。这与阅读此文的大多数人情况完全不同，大多数人能够为自己和孩子开设多个账户，而这些没有账户的人不得不依靠现金系统，这在犯罪高发地区是危险的。这拉大了贫富之间的差距。为了在银行或当前市场中正确地理财，你需要良好的金融素养。缺乏这种理解，积累财富变得非常困难。即使世界上没有账户的人能够获得银行服务，他们也将无法建立财富。\n\
  \n## 对金融机构和政府的信任\n\n在金融行业和政府方面，信任因素较低。由于没有其他选择，人们不得不信任这些行业。这导致许多人陷入困境，特别是在涉及到衰退时。衰退之后，人们仍然不得不信任金融系统，因为没有其他选择。对政府的信任水平在`USA`为\
  \ 40%，`UK` 为 42%，`France` 为 32%，`Mexico` 为 34%，`South Africa` 为 21%，`Japan` 为 39%（尽管看起来在\
  \ `USA` 和 `UK` 高一些，达到 50%）。这些障碍使人们被迫信任他们并不真正信任的政府。这对人们来说是最重要的事情之一。\n\n## 货币操纵\n\n\
  对于中心化货币，当局有权决定货币的价值。他们可以进行操纵并从中受益。虽然这在一些国家没有发生，但其他国家确实深受其害。拥有中心化权威也赋予了他们审查账户的权力。这意味着他们可以冻结账户、移除资金并拒绝银行系统访问。如果正在调查，个人将很一段时间内无法访问其账户。在极端情况下，他们将无法支付或购买生活必需品。用户对资金的发生情况没有完全控制权。\n\
  \n## 中心化系统的风险更大\n\n当一切都由一个大实体控制时，一个错误对数百万人来说都是毁灭性的。没有办法保证银行不会出错，如果他们犯了错，会在整个国家乃至范围内产生连锁反应。`U.S.\
  \ subprime mortgages`（美国次级贷款）导致了 2008 年的住房泡沫。如果你想想，这并不是很久以前的事。在现在的银行系统下，所有的鸡蛋都在一个篮子里。所以如果有人失误，一切都会崩溃，我们都会陷入麻烦。大众必须依靠当局的话，而且大多数时候你必须签署一份合同，规定如果发生任何错误他们概不负责，这不是良好的信任基础。\n\
  \n## 加密货币的明确优势\n\n使用加密货币有很多益处。这从接受这一理念并计划将其作为未来唯一交易方式的人数显而易见。以下是加密货币的优点，它们似乎是系统最大的卖点。然而，了解现状是非常重要的，这样你才能理解为什么会有这种对加密货币的推动。\n\
  \n## 交易费用更低\n\n当你使用信用卡交易或通过 `EFT` 汇款时，交易费用可能很高。它通常是你交易交易金额的百分比，范围在 0%–5% 之间。这取决于你所在地。国际交易的费用通常比本地交易高。使用\
  \ `Bitcoin` 和其他加密货币，费用要低得多，即使是国际交易也是如此。它不受交易类型或接收者所在地的影响，例如给你的邻居或澳大利亚的朋友汇款。\n\n\
  ## 无退单风险\n\n退单（Chargeback）是指客户购买产品并带回家后，然后要求信用卡公司发放退款。这是因为商户由于这种欺诈而遭受损失。如果这种情况频繁发生，会导致收入的大损失。对于使用区块链的加密货币，交易是不可逆的。如果有人付你一笔钱，除非你还给他们，否则他们无法拿回。这种保护被内置在系统中，以防止商户遭受虚付款。退款客户也是商户的责任。\n\
  \n## 更快的交易速度\n\n如果你从 `USA` 向世界其他任何地方进行国际交易，接收者获得资金肯定需要一些时间。这是因为银行在审批过程中建立了各种步骤。这不仅影响与交易相关的费用，还影响速度。在加密货币中，没有中央银行需要通过并获得批准。将其想象为邮寄信件与发送电子邮件的区别。如果你通过邮寄寄信件，那将在几天后才会收到，因为它必须经过你的邮局，然后到达收件人的邮局。而通过电子邮件则可以立即发送。\n\
  \n\n\n\n# 第二章\n\n\n\n\n# 什么是去中心化金融？它在当今世界有一席之地？\n\n在整本书中，你会听到很多关于去中心化金融的内容。为了理解它在当今世界中所扮演的意义，理解其具体含义至关重要。关于它有很多可以讨论的地方，正如加密货币的兴起，我们可以看到其明显的优势。比特币可能是世界上最大且最广为人知的加密货币，但它绝对不是唯一的。在过去的几年里，世界上去中心化金融平台的数量不断增加。每一个平台都在竞争成为最优秀的，并提供最全面的解决方案。当存在这样的竞争时，很容易看出这是社会的需求，并且可以针对有关中心化金融提出的问题提供解决方案。今天世界上有\
  \ 2,000 种不同的加密货币，并且在未来几年内可能还会增加。这就是为什么理解去中心化金融及其包含的内容如此重要。目前没有迹象表明这只是一个阶段或会过去的事物。这些平台正在变得越来越大，越来越多的人对它们充满信心。这是一种全新的金融方式，正在一点点地赢得全世界。\n\
  \n## 什么是去中心化金融？\n\n在最简单的形式下，去中心化金融是一种不需要中间人的金融交易类型。任何人都可以完全独立地购买和交易金融产品。这意味着使用该系统不需要任何形式的身份证明，如身份证件、居住证明、银行账户或社会安全号码。这在交易匿名化的这一点上创造了安全性。黑客和盗贼很难针对某人进行盗窃，因为在系统中无法获知他们是谁。通过使用一种名为\
  \ `blockchain` 的技术（将在下一章中详细解释），它允许人们直接相互交易。这意味着人们能够更快地获得资金，而不会银行施加给他们的规则和条例限制。现在，这并不意味着系统没有规则。规则是有的，而且你还必须遵守你居住国家的规则和条例。在这方面，它并没有完全脱离社会规则。\n\
  \n花费了很长的时间才让去中心化金融成为一个广为人知的选项，并且是一个在社会中实际上运行良好的选择。这其中涉及多种技术和许多不同的协议，必须建立这些才能运行。为了让去中心化系统运行，它必须由开源技术、`blockchain`\
  \ 和专有软件组成（Sharma, 2021a）。为了让去中心化金融以其方式运作，它需要利用 `smart contracts`。智能合约是写在代码行之间的合约。这类合约是自执行的，这意味着不需要打印、签名和发送。系统的编码控制着合约的执行，而已进行的交易可以易于追踪且是不可逆的。`smart\
  \ contracts` 的使用使用户能够信任系统中匿名用户之间发生并执行的交易。这使得系统和交易能够完全独立于必须验证和监管发生交易的大型中央机构运行（Frankenfield,\
  \ 2021a）。\n\n这似乎是一个非常先进的技术形式，被允许使用 `smart contracts`。然而，它是由一位名叫 Nick Szabo 的计算机科学家在\
  \ 1994 年首次提出的。他是 `Bit Gold` 的发明者，`Bit Gold` 是人类创造的最早的虚拟货币形式之一，实际上也是非常受欢迎的 `Bitcoin`\
  \ 的基石之一。很容易认为 `Bitcoin` 是第一个被构思和开发的加密货币，但人们多年一直在琢磨这个想法。这可能也是世界看起来比以往任何时候都更准备转向这种方式的原因。Nick\
  \ Szabo 的原始想法并不完全像我们现在这样，他的想法是扩展销售点到一种更数字化的方式。他写过几篇关于该主题的论文，其中一篇他看到了技术未来被使用。他基本上指出，`smart\
  \ contracts` 的使用可以将复杂的交易过程转化为标准化的，这将允许降低交易成本。如果我们看看加密货币是如何使用的，他的预测已基本实现（Frankenfield,\
  \ 2021a）。\n\n## 去中心化的未来\n\n虽然我们生活在一个去中心化金融增长的令人兴奋的时代，它被清楚地视为解决我们现在交易方式相关的许多问题的解决方案，但不要忘记这个系统仍然建立在其之上。如此，由于发明者和创建者所采取的措施，监管和监督几乎不存在。许多人预测金融的未来是去中心化的，这将改变我们所知的金融面貌。长期以来，技术在金融中扮演了重要角色。我们使用技术进行销售点，当我们向\
  \ `ATMs` 存款或使用手机时使用它。因此，技术在金融中的作用将会增加并不意外。我们看到技术被整合到几乎每个领域，使事情变得更加方便和安全。相信技术在我们处理和使用金融方面将发挥重要作用并不遥远。\n\
  \n去中心化金融的一个主要优点是技术处于前沿，所有其他事情都通过构建代码来处理。目前，当任何人谈论去中心化金融时，他们仅指的是 `blockchain` 和加密货币。然而，这并不是它的全部。目前金融是高度中心化的，并且不仅限于银行。世界各地有主要的经济枢纽作为国家的金融中心。其中一些枢纽是英国的\
  \ `London`、美国的 `New York`、印度的 `Mumbai` 以及中国的 `Shanghai`。这些城市在经济中扮演着重要作用。全球经济取决于许多因素以及国家的经济运作。例如，如果\
  \ `U.S. dollar` 贬值，货币价值就会下降。这并不意味着能力和生产没有减少，但他们从中获益。如果 `U.S. dollar` 获得了信任，价值就会增加。\n\
  \n## 什么构成了去中心化金融？\n\n去中心化金融拥有几乎模仿现有环境的组件。系统的每个组件都位于软件栈中。这些组件在堆栈中分层，并执行允许系统正常运行的特定功能。基本上，每一层的组件将组合在一起形成一个去中心化金融栈。组成去中心化金融系统的有四层：\n\
  \n1. `settlement layer`\n2. `protocol layer`\n3. `application layer`\n4. `aggregation\
  \ layer`\n\n`settlement layer` 是系统赖以建立的基础。由于这个原因，它通常被称为第 0 层。这一层由公共 `blockchain`\
  \ 和属于系统的数字货币组成。在去中心化金融应用上发生的交易将使用系统中的数字货币进行结算和确认。这是大多数交易发生的层。如果是一个 `Bitcoin` 系统，你将与\
  \ `Bitcoin` 交易；如果是 `Ethereum`，你将与 `ethers` 交易，以此此类推。\n\n下一层是 `protocol layer`，可以在这里找到软件协议。软件协议治理系统中发生的活动和任务。协议的标准和规则是为此目的而编写的。一个行业的标准和规则将由在该行业运营的所有用户同意，并作为在该行业实际运营的先决条件。去中心化金融不受同时使用和构建系统或应用的实体数量的限制。\n\
  \n第三层是 `application layer`。这是面向客户的层，包含了用户将交互的所有内容。这一层将复杂的协议转换为终端用户易于交互的内容。大多数用户并不真的需要理解系统的内部运作就能使用它。这与我们今天拥有的金融机构是一样的。我们的大多数人并不知道幕后发生了什么，但我们都能使用提供给我们的简单版本。金融系统最常见的功能和应用程序可以在这一层找到。其中一些是加密货币交易和贷款服务。\n\
  \n第四层也是最后层是 `aggregation layer`。聚合器是一个链接或显示相关项目或数据的程序。它在链接它们之前首先必须收集所有相关信息。这一层连接了来自\
  \ `application layer` 的各种应用程序，然后可以为投资者提供服务。投资者可能随后从两种不同的金融工具进行转账。这将允许他们以原本无法实现的方式实现收益最大化。如果在正常的金融系统中进行，将导致大量的性工作和不同部门之间的协调。这可能会导致转账和交易获得批准需要很长时间，而且在此过程中可能会附带一些额外费用。在去中心化金融中，一切都是基于技术的，这意味着过程可以变得平顺，这将允许交易者和投资者无缝地在不同服务之间切换。可以在这一层找到的服务示例是贷款和借贷（Sharma,\
  \ 2021）。\n\n\n\n\n\n# 第 3 章\n\n\n\n\n# 区块链的奥秘\n\n如果你试图理解加密货币，你将了解关于区块链以及它的工作原理。它是这些系统设计的根本方式。中本聪（Satoshi\
  \ Nakamoto）是区块链的发明者。他也是世界上最大的加密货币——比特币背后的天才。尽管中本聪在技术上发明了区块链技术，但他并不是第一个产生这个想法的人。斯图尔特·哈伯（Stuart\
  \ Haber）和 W·斯科特·斯托内塔（W. Scott Stornetta）想要创建一个允许他们向文档添加时间戳且不被篡改的系统。这追溯到 1991 年。\n\
  \n中本聪利用区块链创建了比特币赖的透明账本系统。任何人都可以使用区块链来存储任何数据和信息。它的用途不仅限于数值数据。许多其他公司和程序正在开发，并使用这种区块链系统。这将显著改变我们的做事方式，因为这意味着系统能够更好地处理数据，而且更加安全。如果实施得当，区块链实际上可以开发成让人们在总统和议会选举中在家投票。这将消除流程中的许多人为错误，例如计算选票。这项技术的用途远超我们今天所看到的。加密货币只是第一个使用它的工具。\n\
  \n## 什么是区块链？\n\n用最简单来说，区块链就是一个数据库。然而，它并不仅于此。区块链与其他形式的数据库有许多不同，但让我们先了解什么是数据库。即使人们从未接触过数据库，大多数人对数据库也有大致的了解。它仅仅是存储在服务器或计算机上的信息集合。如果你需要找到某条数据，可以搜索它并获得你想要的内容。它通常结构化为表格，以便用户能够轻松找到他们寻找的内容。\n\
  \n读到这里，很容易将数据库误认为是电子表格。数据库比它要复杂一点。电子表格的设计是为了供一个人或可能是一小小组使用的。访问它的人数有限，在上面存储的信息也有限。数据库可以被大量用户同时访问。在数据库上可以存储的信息可以大得多，而且信息类型多种多样。你能够存储大量数据并允许许多人访问的唯一方法是将所有内容都放在服务器上。\n\
  \n服务器允许具有强大能力以处理所有这些信息的计算机运行。有各种尺寸的服务器，这取决于有多少人需要访问信息以及必须存储多少信息。中小型公司可以拥有小型服务器来处理他们的日常信息并向员工和客户提供访问，但像\
  \ Facebook 和 Google 这样的大公司需要巨型服务器来处理涌入和提取出的所有信息。这些公司为全世界处理信息，所以这是可以理解的。\n\n当传统数据库时，它完全由某个公司或个人控制。他们控制数据以及数据应该如何被使用。如果\
  \ Google 不想在他们的搜索引擎上显示某些内容，他们可以将其删除。他们控制信息的组织方式，并且他们是唯一可以访问后台发生的所有内容的人。\n\n这正是区块链与其他数据库的不同之处。它也存储信息，但这些信息对于系统上的所有人都是的，没有任何个人对数据拥有权力。这意味着由于任何原因，什么都没有被删除或更改。区块链系统存储数据的方式与其他数据库的方式完全不同。上面我们提到，数据库通常将数据存储在表中，以便查找和编辑信息。区块链数据库收集信息并将其分组。这些组被称为“块”（blocks）。一个块中只能存储特定数量的数据。达到限制且块关闭后，无法向其中添加其他信息。一旦信息块被填充，它就会与上一个信息块链起来，因此被称为区块链。这个过程重复（Conway，2020）。\n\
  \n这种结构意味着它形成了一条不可逆转的数据链。一旦块被填充并链接到之前的链，就无法更改。块还盖有时间戳，显示它被添加到链上的确切时间。这个过程创建了一个去中心化的环境。涉及到加密货币时，一切都可以追溯到交易发生的确切时间以及谁进行了交易。这让每个人对自己的交易负责，并防止了欺诈或其他金融犯罪。对于比特币，区块链充当每个数据块的引用点。如果有错误，交易可以与其他块进行交叉引用，直到发现差异。假设用户尝试篡改一个块中的数据，这将导致系统与其他块进行交叉引用以找出哪一个是不正确的。系统将更改该块的信息以使其正确。这种过程允许区块链作为一个去中心化的系统运行。它可以自行纠正错误。\n\
  \n对于加密货币，区块链主要持有数值信息，但也可以用于持有法律合同、库存和 ID（Conway，2020）。这种技术允许透明地查看所有信息。任何拥有节点（node）的人都可以查看正在发生的比特币交易。在区块链的任何一点，比特币系统允许匿名，但每一个比特币都可以被追溯和跟踪。如果有人黑入比特币系统并盗取它，系统将能够丢失的比特币。区块链是非常安全的系统，因为开发者确保了信任问题。随着块被添加到链中，它们移动到链上的特定位置。这个位置被称为高度（height），基本上标记了该位置。一旦块被添加并“盖戳”，想要进行更改非常困难。如果需要更改，需要大多数通过，否则更改不会被接受。每个块都包含一个与之前的哈希连接的哈希以及时间戳。这个哈希以特定的方式将一切连接在一起。我们将详细介绍哈希及其工作原理。\n\
  \n## 什么是哈希（Hash）？\n\n我们在上一节中提到了哈希这个词。如果你不熟悉编程术语，对它是什么或执行什么功能感到困惑是可以。为了理解区块链如何工作，你需要了解哈希及其在整个过程中的功能。哈希最简单、最短的定义是：它是一个将数字和字母转换为固定长度加密输出的函数。为了加密货币运行并成为货币的可行替代方案，需要区块链。通过区块链验证的所有信息都是通过哈希实现的，结果是一个不像原始信息的加密值（Frankenfield，2020）。如果你想挖掘加密货币，你需要与哈希一起。哈希只是数据需要处理的方式。使用数学方程，输出是特定长度的，在整个范围内是固定的。哈希的固定输出实际上是一种安全特性。无论输入什么信息，输出始终具有相同的长度。这意味着任何查看哈希信息的人都无法判断出原始信息是什么。我们已经知道区块链通过创建信息块并将它们连接来来工作。块中的每一个都带有一个数字。这个数字在整个区块链中只使用一次，因此是唯一的。当有人挖掘时，他们专注于这个数字。矿工基本上必须找出该块使用了什么数字字符串。这一切都是尝试错误，因为数字组合的方式有很多种。问题的“答案”被称为目标哈希（target\
  \ hash）。如果矿工能够获得确切答案或更低的答案，则被认为是正确的，矿工就成功挖掘了。创建哈希的困难程度决定了解决它需要多久。为了更容易理解：如果有两个单独的输入，一个是“Hi”，另一个是“我要出去遛狗”，哈希会为两者产生相同长度的输出，但两者的输出是不同的。所以如果你输入“Hi”，你总是得到相同的输出。如果对哈希进行了即使是微小的更改，它也会完全改变，并且如果有匹配的输入，将链接到另一个输入。这种差异将被区块链的交叉引用检查出来。\n\
  \n## 区块链的优势\n\n区块链技术正在扩散到许多其他领域，而不仅限于加密货币。这将显著改变许多行业的工作方式。为了完全理解这种转变以及为什么区块链如此有吸引力，我们必须了解这项技术的优势。\n\
  \n### 它是准确的\n\n区块链是一种极其准确的数据记录方式。它的去中心化允许它在成千上万计算机上运行，所有的交易和更改都必须经过整个网络的批准。由于整个网络必须进行交叉引用，这使得发现错误变得容易得多。一旦发现错误或故障，系统就会进行更改使其与区块链的其他副本匹配。该系统消除了受人为错误影响的人为授权。即使是最聪明、最细心的人也无法发现每一个错误。\n\
  \n### 比任何其他系统都能更好地保护隐私\n\n在当今时代，隐私是一件大事。保持匿名是这个系统的主要吸引力。通常，如果你向某人发送资金或信息，你必须识别你自己。银行通常会向接收资金的人传递某些信息。在区块链中，你可以看到交易的每一个细节，但它保持了背后的人的匿名。每个人都有一个`user\
  \ ID`，因此交易可以追溯到该身份，而无需损害用户的真实身份，除非他们告诉接收者他们正在发送东西。它不是一个匿名系统，但它是完全机密的。\n\n\n\n\n\
  # 第 4 章\n\n\n\n\n# 货币的历史\n\n加密货币似乎将成为全球的新货币形式。一些人对这种未来表示怀疑甚至感到恐惧，因为它是如此新颖，而且看起来像是一片未开发的领域。然而，货币的相同原则一直存在。货币一直在变化和演变。几千年前，人们使用银片进行交易，这种这种方式逐渐演变，直到演变成我们今天使用的纸币。\n\
  \n如果我们看看货币的发展过程，会发现纸币甚至不是我们今天使用的最流行的货币形式。我们大多数人使用银行卡来购买物品。这不是可以在我们手中数清金额的物理货币。相反，我们选择信任屏幕上的数字来告诉我们有多少可用资金。这对于大多数人来说更加方便，而且似乎比无论去哪里都随身携带一大整叠现金要安全。既然我们已经向着更数字化的货币形式移动，那么认为加密货币是下一种货币形式真的有那么遥远的跨越吗？在讨论这些之前，让我们深入研究货币的历史以及它一切源于哪里。\n\
  \n## 一切从哪里开始\n\n我们所熟知的货币实际上没有真实价值。货币的价值是由人类决定的。如果我们真的想做，可以将世界上所有的纸币换成贝壳，那就可以成为新的货币形式。事实上，在货币开始时，人们使用各种物体作为交易的媒介，其中一种物体就是贝壳。货币只是某种价值的象征，它是一种交换媒介。我们需要货币来交流某些物品的价格，然后交换我们需要或想要的东西。\n\
  \n这一直一直是货币的目标，但多年来它有许多不同的面貌。在过去的 3000 年里，货币在人类文明中一直发挥着某种作用。随着时间的推移，人们看待货币的方式以及他们用来交易的东西发生了巨大的变化。如果我们回到开始，当人们还住在小村庄和社区时，我们会发现使用货币交易的首的迹象。但在任何形式的货币出现之前，人们通常对他们想要的东西进行直接贸易。小社区依靠贸易任务运行。因此，会有农民、面包师、木工和缝纫师。每个人都有别人想要的东西。由于面包师不能光靠吃面包生存，他们会将面包交易给农民换一只鸡或鸡蛋。任何想要获得其他所需物品的人也是如此。\n\
  \n这种办事方式的问题在于，你所交易的物品没有精确的价值。如果农民不要面包，面包师就没有东西可以交易，也无法获得他们需要的物品。你将不得不去多个农民那里，寻找一个认为面包足以交换鸡蛋的人。这对于获得你所需的物品将花费非常长时间。另一个问题是，每个农民对他们的鸡蛋的估值不同。因此，面包师在到达那里之前不知道需要多少块面包才能与农民进行交易。即使你上周用一块面包换了两个鸡蛋，农民这周也可能轻易地拒绝，并要求用两个面包换同样的两个鸡蛋。你可以看到这如何变成一种低效的交易方式。\n\
  \n想象一下在当今世界这样做。某人为了得到一瓶牛奶或其他必需品可能轻易地花费几周时间。随着社区的壮大，这样做变得越来越困难，因为这是一个非常难以监管的系统。最终，人们决定这行不通，于是他们对某些物品赋予价值以作为货币。在过去，这取决于具体的社区。人们使用石头、羽毛、贝壳、盐、动物象牙以及基本上任何他们认为合适的其他东西。\n\
  \n你可以很容易看出这可能导致什么问题。由于这些物品太容易获得，人们可以去去海滩捡一些贝壳，或者在房子外找一块石头。这意味着给这些物品定价值非常困难，因为即使没有通过任何工作或贸易来获取，也可以不断添加新物品。此外，由于每个社区都有不同的物品来代表货币，你无法与其他社区的人进行交易。这意味着内陆的人可以使用石头作为他们的货币，但当他们去沿海社区并想要交换鱼时，沿海社区会使用贝壳作为他们的货币。所以石头对他们来说毫无意义。需要的是一种可以通用的整体标准货币形式。\n\
  \n## 第一种标准货币\n\n需要注意的是，世界上大多数社区都使用了上述的贸易形式。这并不一定是由任何一个族群发明的。当文明变得更加现代时，这看起来像是一个自然的演进。第一批在货币方面拥有标准衡量形式的文明之一是古巴比伦人。他们使用一种被称为\
  \ `shekels`（谢拉克）的东西，那只是金属片。如果你想买某东西，你就必须称量你的 `shekels` 以换取特定的物品。\n\n还有其他群体开始摆脱物物交换来获取他们需要的东西。最显著的变化之一是公元前\
  \ 700 年之后，中国人决定使用实用的物体作为货币形式行不通，因为它们太大了，不方便随身携带。这使得货币的运输变得太困难。因此，他们制作了要交易物品的微型复制品。这些是工具和武器等物品的复制品。一段时间后，他们意识到这并不通，因为在包或口袋里装有大量小斧头或箭是非常危险的。这时，他们将这些物体变成了圆形。这些东西携带起来容易得多，而且当你伸手进包里支付时，它们不会刺到你。最终，这种类型的货币传遍中国，然后传到世界的其他地区。现在被称为土耳其的国家是第一个铸造货币的国家。硬币是由银和金混合物制成的，上面盖有各种代表不同意义的图案。\n\
  \n## 古典金本位\n\n古典金本位指的是 1880 年至 1914 年之间的时期。金本位是一种将国家的货币与黄金挂钩的系统。各国承诺将其货币固定在特定数量的黄金。这是一种相当稳定的办事方式，即使发现了新的黄金并将其加入国家的财富中，也能减少通胀的发生。你可以从事实看出金本位的稳定性，美国在\
  \ 1834 年将他们的标准设定为每盎黄金 `$20.67`，并一直保持不变直到 1933 年。这意味着有 99 年的货币没有发生通胀或变化。\n\n由于大多数国家已将其货币设定为金本位，这使得国际贸易蓬勃发展。经济增长和贸易达到了在该点之前历史上从未见过的水平。在此期间，各国之间的合作比以往任何时候都要好。这是一个简单的规则，允许通胀和通货得到遏制。然而，正如我们所知，这并没有永远持续。金本位的崩溃始于世界大战。它导致了世界政治气候的巨大变化，联盟也在发生变化。各国开始陷入债务，政府财政开始恶化。虽然金本位是一个在良好时期维持良好的伟大系统，但在艰难时期很难保持稳定。政府开始对金本位失去信心，很显然，世界需要一些更灵活的东西来处理他们的财务。另一个问题是，可用黄金的量正在下降到低于经济快速增长速度的水平。这为坚持金本位的国家制造了限制。英国政府于\
  \ 1931 年放弃了金本位，到 1933 年，美国迅速跟进。\n\n## 布雷顿森林协议\n\n第二次世界大战后，签署了布雷顿森林协议。布雷顿森林协议是一种将各国货币挂钩黄金的协议。各国承诺将其货币固定在特定的黄金金额上……（此处对应原文逻辑）……然而，正如我们所知，这并没有永远持续。金本位的崩溃始于世界大战。它导致了世界政治气候的巨大变化，联盟也在发生变化。各国开始陷入债务，政府财政开始恶化。虽然金本位是一个在良好时期维持良好的伟大系统，但在艰难时期很难保持稳定。政府开始对金本位失去信心，很显然，世界需要一些更灵活的东西来处理他们的财务。另一个问题是，可用黄金的量正在下降到低于经济快速增长的水平。这为坚持金本位的国家制造了限制。英国政府于\
  \ 1931 年放弃了金本位，到 1933 年，美国迅速跟进。\n\n## 布雷顿森林协议\n\n第二次世界大战后，签署了布雷顿森林协议。布雷顿森林协议是一种将各国货币挂钩黄金的协议。各国承诺将其货币固定在特定的黄金金额上……（此处对应原文逻辑）……然而，正如我们所知，这并没有永远持续。金本位的崩溃始于世界大战。它导致了世界政治气候的巨大变化，联盟也在发生变化。各国开始陷入债务，政府财政开始恶化。虽然金本位是一个在良好时期维持良好的伟大系统，但在艰难时期很难保持稳定。政府开始对金本位失去信心，很显然，世界需要一些更灵活的东西来处理他们的财务。另一个问题是，可用黄金的量正在下降到低于经济快速增长的水平。这为坚持金本位的国家制造了限制。英国政府于\
  \ 1931 年放弃了金本位，到 1933 年，美国迅速跟进。\n\n*(注：由于原文中 Bretton Woods Agreement 之后的内容似乎重复或逻辑截断，此处严格按照原文内容进行翻译)*\n\
