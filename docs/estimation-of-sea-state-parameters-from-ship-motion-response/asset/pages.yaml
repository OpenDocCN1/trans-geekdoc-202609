    # 2.3. Deep learning models


    In this research, we propose a novel DL model for sea state parameter estimation
    based on the current state-of-the-art module called Attention (Vaswani et al.,
    2017). To prove that the proposed model is fine-tuned and can be treated as the
    best currently available solution, we have compared it with the three other DL
    models presented in Mak and Düz (2019). Furthermore, to correctly compare the
    proposed model with existing models, we have enhanced the existing models by scaling
    the number of kernels and neurons. Here we find the work done by Mak and Düz (2019)
    to be the most relevant due to several facts: their approach is well defined and
    enables their models’ reproducibility, proposed models are based on different
    modules, and last but not least, they have been dealing with the same problem
    as the one addressed in this paper. The only difference between our utilization
    of existing models and their original usage was the number of input signals. Namely,
    in the original paper, the existing models utilized 6-DOF of ship motion, while
    our experiments only used 3-DOF. By reducing the number of DOF, we did not impair
    the model’s integrity in any way, which is supported by the obtained results which
    are comparable to the results in the original paper.


    In the following subsections, the utilized DL models will be presented and described
    in detail, while the source code implementing the models can be found in the following
    repository (Selimović et al., 2022). Furthermore, at the end of this subsection,
    we briefly summarize all models’ hyperparameters and explore the motivation behind
    the models.


    # 2.3.1. CNN for regression: original and enhanced


    The first NN presented in Mak and Düz (2019) was the most straightforward NN based
    on convolutions. Hence, CNN-REG perfectly fits this DL model: a CNN for regression.
    The NN consisted of two convolutions and a dense layer mainly followed by the
    tanh activation functions (as depicted in Fig. 8. The first convolutional layer
    had 48 filters with kernel size 3 × 15, while the second convolution layer had
    48 filters with kernel size 1 × 9. The dense layer consisted of 30 neurons followed
    by the dropout layer with the dropout probability set to 0.25. Furthermore, we
    have experimented with the values of the following hyperparameters to find the
    best possible performance:


    +   - max pooling kernel sizes: 1, 3, 5, 7, 10,

    +   - scaling factor κ : 1, 5, 10,

    +   - Tested optimizers were ADAM and SGD both with learning rates α = 5 · 10⁻³,
    5 · 10⁻⁴, 5 · 10⁻⁵,

    +   - Data augmentation: row-wise and batch-wise.


    Let us note that the NNs proposed by Mak et al. were enhanced by adding a scaling
    factor that increases the “width” of the NN. The width is enhanced by multiplying
    the number of filters in convolutional layers and the number of neurons in dense
    layers by scaling factor κ. For example, the initially proposed number of filters
    in the first convolutional layer was 48, which after the scaling by κ = 5, becomes
    240. This way, we did not just compare our proposed AT-NN DL model with current
    state-of-the-art NNs; we have even tried to enhance the originally proposed models.
    Therefore we will present results for two versions of the CNN-REG NN topology:
    the original one (CNN-REG-ORG) and the enhanced one (CNN-REG-ENH).


    The parameters for CNN-REG-ORG are same as stated in Mak and Düz (2019) (κ = 1,
    max pooling kernel size equal to 3) except we have used SGD with learning rate
    α = 0.005 since the originally proposed learning rate α = 0.03 would not converge
    on our dataset. As best dataset augmentation for this model was shown to be “Row-wise”
    data augmentation. For the CNN-REG-ENH the best performing parameters were as
    follows: κ = 10, max pooling kernel size 5, optimizer ADAM with learning rate
    α = 0.0005, and data augmentation row-wise.'
