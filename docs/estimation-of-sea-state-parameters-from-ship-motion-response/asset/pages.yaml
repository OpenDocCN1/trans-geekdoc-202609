  md: '# Estimation of sea state parameters from ship motion responses using attention-based
    neural networks


    Denis Selimović a,b , Franko Hržić a,b , Jasna Prpić-Oršić a , Jonatan Lerga a,b,*


    a Department of Computer Engineering, Faculty of Engineering, University of Rijeka,
    Vukovarska 58, 51000 Rijeka, Croatia

    b Center for Artificial Intelligence and Cybersecurity, University of Rijeka,
    Radmile Matejčić 2, 51000 Rijeka, Croatia


    # ARTICLE INFO


    +   Keywords:

    +   - Ship motions

    +   - Sea state estimation

    +   - Deep learning

    +   - Attention neural network

    +   - Uncertainty estimation


    # ABSTRACT


    On-site estimation of sea state parameters is crucial for ship navigation. Extensive
    research has been conducted on model-based estimation utilizing ship motion responses.
    Model-free approaches based on machine learning (ML) have recently gained popularity,
    and estimation from time-series of ship motion responses using deep learning (DL)
    methods has given promising results. In this study, we apply the novel, attention-based
    neural network (AT-NN) for estimating wave height, zero-crossing period, and relative
    wave direction from raw time-series data of ship pitch, heave, and roll. Despite
    reduced input data, it has been demonstrated that the proposed approaches by modified
    state-of-the-art techniques (based on convolutional neural networks (CNN) for
    regression, multivariate long short-term memory CNN, and sliding puzzle neural
    network) improved estimation MSE, MAE, and NSE by up to 86%, 66%, and 56%, respectively,
    compared to the best performed original methods for all sea state parameters.
    Furthermore, the proposed technique based on AT-NN outperformed all tested methods
    (original and enhanced), improving estimation MSE by 94%, MAE by 74%, and NSE
    by 80% when considering all sea state parameters. Finally, we proposed a novel
    approach for interpreting the uncertainty estimation of neural network outputs
    based on the Monte-Carlo dropout method to enhance the model''s trustworthiness.


    # 1. Introduction


    Unfavorable weather conditions while ship navigation may lead to various dangerous
    situations that negatively affect the ship''s cargo and crew. The sensitivity
    of the ship to unsafe circumstances depends on its stability parameters, hull
    geometry, size, and speed (IMO, 2007). Thus, maintaining stable operational performance
    for ship routing is critical for safety and navigational efficiency. This represents
    a challenge for onboard decision support systems (DSSs), which consider the problem
    of obtaining data on the surrounding sea state and help make operational decisions
    more precise (Faltinsen, 1990). Since encountered waves affect almost all ship
    operations, real-time estimation of their characteristics is of crucial importance.
    Different approaches for collecting information about sea state data exist. Moored
    wave buoys, navigational radars, or satellite data are traditionally used. However,
    these methods do not represent a complete solution due to their limitations in
    availability, reliability, convenience and/or cost of maintenance (Nielsen, 2017).
    For example, statistical-based methods can provide accurate wave height estimates,
    but wave period and wave direction estimates are relatively poor. On the other
    hand, expensive wave radars can produce accurate estimations of wave period and
    wave


    direction, but wave height is not always estimated correctly (Selimović et al.,
    2020). As a more efficient alternative to standard estimation methods, the concept
    of a “wave buoy analogy” intends to measure only available ship responses to infer
    sea state information. These result in less complexity, easier maintenance, and
    ultimately lower costs. Decades of research have been conducted on this concept.
    A concise overview of sea state estimation techniques based on ship motions is
    given in Nielsen (2017). Optimization methods were developed and refined as computing
    resources improved. Ultimately, this results in several published research papers
    incorporating the speed-of-advanced problem and full-scale tests. The concept
    is introduced with the assumption of linearity between sea state and measured
    ship responses. With an appropriate mathematical model, two different estimation
    approaches can be found in the literature, one in the frequency domain and another
    directly in the time domain. The latter intends to address challenges that appear
    in frequency domain procedures. In the time domain, research focuses on methods
    that apply Kalman filtering (Pascoal and Guedes Soares, 2009; Pascoal et al.,
    2017) or stepwise procedures (Nielsen et al., 2015, 2016). However, most of the
    research done'
