    in the frequency domain uses spectral analysis, with a mathematical relationship
    between the response spectra and the directional wave spectrum (DWS). The model
    description is given with complex transfer functions, i.e., response amplitude
    operators (RAOs). The corresponding DWS is then found by inverse mapping procedures.
    Procedures in the frequency domain are formulated so that the mathematical model
    is based either on the equivalence of spectral energy distribution (Nielsen, 2006;
    Tannuri et al., 2003; Hinostroza and Guedes Soares, 2016) or the spectral moments
    (Montazeri et al., 2016).


    Although the above-mentioned DWS estimation techniques have shown fine performance
    in many reports, their implementation may include some constraints. The concept
    of analogy is given with the assumption of linearity, and spectral analysis requires
    stable operating conditions where it should be a certain minimum period of stationarity
    to perform one. In addition, the accuracy and reliability of estimation largely
    depend on the accuracy of RAOs which may be less accurate or incomplete due to
    insufficient knowledge of the input conditions.


    Recently, sea state estimation was related to data-driven ML approaches to overcome
    the limits of conventional RAO-based methods. The idea is to build a parametrized
    ML model without knowledge about ship model description. A few studies have been
    published on the use of ML approaches to train the model. The proposed models,
    trained on time and/or frequency domain features, have shown sufficient accuracy
    in predicting wave characteristics. As the model is based only on ship motion
    data, the assumption is that it can be adapted to various types of ships. An example
    of a model-free approach to identify sea state levels is proposed by Tu et al.
    (2018). The authors apply available dynamic positioning (DP) sensors to collect
    time-series data in four degrees of freedom (DOF). The estimation procedure includes
    multilayer classifiers, and time and frequency domain features are extracted from
    the data with several preprocessing techniques.


    As the classification in feature-based approaches is dependent on the quality
    and quantity of hand-engineered features, research suggested the application of
    DL methods. The DL-based model for classifying the sea state levels proposed by
    Cheng et al. (2019) uses only raw time-series data. Here, the classification accuracy
    is improved using a multi-component model. Namely, convolutional neural networks
    (CNNs) and fast Fourier transform help extract time and frequency characteristics,
    while recurrent neural networks search for long dependencies in motion data. Cheng
    et al. (2020a) expanded this work using densely connected CNN to take into account
    the estimation of wave direction characteristics. Additionally, to improve the
    interpretability and achieve even better accuracy, Cheng et al. (2020b) proposed
    a model based on 2D spectrogram images, which carry both time and frequency information.


    The before-mentioned papers are related to DP application without ship forward-speed.
    On the other hand, Duz et al. (2019) and Mak and Düz (2019) successfully predicted
    wave height and wave direction under forward-speed conditions. Ship motions in
    6-DOF are used as input, and the problem was treated as a multivariate time-series
    regression. Results are given for several NN structures with appropriate performance
    comparisons. Those works are extended to identify real-time DWS using deep convolutional
    encoding-decoding NN in Scholcz and Mak (2020). However, the approach is focused
    on training models


    on simulated data, and then these models are used for measured data directly or
    applied using transfer learning methods. In Mittendorf et al. (2022) several proposed
    DL architectures also prove sufficient results in the case of an advanced ship
    in beam and following seas with no significant effect on the prediction accuracy
    when a different forward-speed is applied.


    In this paper, we propose several DL models for sea state parameter estimation
    (the flowchart of the research is given in Fig. 1). The main focus was on improving
    the currently proposed models and implementing the new DL model based on AT-NN.
    The input data was 3-DOF ship motion time-series, and the output indicated the
    wave period, relative wave direction and significant wave height. As in Duz et
    al. (2019), the problem was characterized as a multivariate time-series regression.
    The algorithms are trained with numerically simulated data generated according
    to the recommended guidelines. Proposed methods have been compared to state-of-the-art
    reports to evaluate the novelty of the research and its potential real-life applications.


    The rest of the paper is structured as follows. In Section 2, the data generation
    process is given with described simulation procedure. Next, the applied NN architectures
    and DL models are described. The performances of applied models were evaluated
    and described in Section 3. Conclusion remarks on the limitations of the present
    work and possible future works are provided in Section 4.


    # 2. Methods


    Collecting real-time estimation of encountered wave characteristics may be worthwhile
    for improving navigational efficiency. While routing, the ship encounters stochastic
    environmental forces, thus subjected to three rotational (rolling, pitching, and
    yawing) and three linear (surging, swaying, and heaving) motion responses, as
    shown in Fig. 2. According to many previous studies mentioned in the introduction
    of the paper, considering a set of three motion responses is advantageous for
    successful sea state estimation in a wave buoy analogy approach. Based on the
    given input-output data pairs, the idea is to create a DL model to estimate the
    characteristics of encounter waves with given ship motion responses in 3-DOF.
    We observe the roll, pitch, and heave motions, mostly driven by the sea waves
    and least affected by the operation of the thrusters (Selimović et al., 2020;
    Nielsen, 2006).


    For testing DL model accuracy, stationary stochastic time-series of 3-DOF ship
    motion responses are computed from the known wave spectra. Time-series simulation
    procedures are done according to recommended guidelines given in DNV-GL (2018),
    and related research work by Mittendorf et al. (2022). This section describes
    the used procedures for generating time-series data and models for wave characteristics
    estimation.


    # 2.1. Computing of time-series data


    Let us suppose the ship is navigating in the natural seaway, i.e. in irregular
    waves, at a specified forward speed, U, and with a relative'
