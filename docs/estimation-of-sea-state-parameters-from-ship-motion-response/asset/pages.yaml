    # 4. Conclusion


    The paper presents a novel attention-based DL model for estimating important sea
    state characteristics. By evaluating the performance for each sea state parameter,
    we confirm that the AT-NN model is fine-tuned and suitable for estimating key
    sea state parameters. The improvement made by the proposed AT-NN model proved
    significant as MSE was reduced by up to 83%, MAE by up to 62%, and NSE by up to
    8% compared to the best versions of the original, formerly proposed state-of-the-art
    models considering all estimated sea state parameters. When compared to best versions
    of modified models, MSE was reduced by up to 13%, MAE by up to 12%, and NSE by
    up to 0.4%. Despite using 3-DOF input motion data, the proposed model achieved
    the best results among all tested, original and enhanced models for each estimated
    sea state parameter. As one of the next steps in future research, the utilization
    of 6-DOF ship motion responses could potentially improve the precision of parameter
    estimation. Additionally, in practical applications, entire wave directional spectrum
    estimation is of great importance. Therefore, future work directions may also
    include information about wave directionality in numerical simulations that can
    extend the application of the DL model to short-crested waves and combined wind
    and swell sea spectrums.


