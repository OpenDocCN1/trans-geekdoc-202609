    # Self-attention blocks


    # Fully connected blocks


    ![](img/4734fbdc67cafcec90fddf3b05be1d58_6_0.png)


    Fig. 11. The architecture of the attention based neural network (AT-NN).


    3 × 125. Since we utilized 128 kernels in this operation, NN operates on 128 embedded
    signals instead of three original ones. Besides merging three signals into one,
    the convolution operation also resulted in 1377 overlapping window positions over
    the original signals. Each window captured 125 samples of the input signals. These
    overlapping window positions are equivalent to the “tokens” in the NLP models.
    Established practice in NLP recommends that each token have its position in sentence/signal
    encoded because the inter-token positions may be relevant information (Jaderberg
    et al., 2015). We have followed this practice and utilized the sin and cosine
    encoding as proposed in Vaswani et al. (2017).


    After merging and tokenizing the input signals, the proposed AT-NN utilizes two
    self-attention blocks. As depicted in Fig. 11, each self-attention block consists
    of two multi-head attention (MHA) layers followed by a normalization layer. The
    attention mechanism is given by Eq. (7):


    ```

    attention(Q, K, V) = softmax( Q K^T / sqrt(d_k) ) V   (7)

    ```


    where Q, K, and V represent query, key, and value matrices, respectively, with
    their weights included (W_q, W_k, W_v). In our case, we used self-attention where
    Q, K, and V were all equal to the layer''s input. Generally speaking, the self-attention
    mechanism seeks relations between the tokens in the same input signal, not between
    the observed input signal and another different signal. Parameter d_k is a scaling
    factor equal to the length of the input embedding (in our case, 1377).


    ```

    multihead(Q, K, V) = concat(head_1, ..., head_j) W^O

    head_i = attention(Q, K, V)   (8)

    ```


    performing a simple linear projection utilizing weights W^O. Furthermore, the
    output of MHA is added to its input. After the addition is performed, the final
    summed output of the MHA is normalized. Normalization is done by subtracting the
    embedding mean value from the embedding values and dividing it by their standard
    deviation (Garbin et al., 2020). The described mechanism is repeated two times
    in one self-attention block, as depicted in Fig. 11. AT-NN model was built from
    two consecutive self-attention blocks.


    The final embedding calculated by the second MHA (batch_size × 128 × 1377) is
    flattened into batch_size number of 1D vectors with a length of 176,256. This
    is important because the next part of the proposed AT-NN consists of fully-connected
    (dense) layers. As depicted in Fig. 11, the AT-NN consists of three dense layers.
    The first dense layer has 128 neurons and is followed by the RELU activation function,
    dropout layer, and batch normalization layer (Agarap, 2018; Santurkar et al.,
    2018).


