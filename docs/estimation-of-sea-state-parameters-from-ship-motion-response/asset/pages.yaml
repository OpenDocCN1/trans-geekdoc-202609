    heading to the waves, β. In this case wave elevation can be expressed as a sum
    of multiple sinusoidal (regular) wave components:


    ζ(x,t) = Σ_{i=1}^{n} A_i cos(ω_i t - k_i x + ε_i)   (1)


    where ω_i is a wave frequency of a particular wave component, k_i is a wave number,
    and ε_i is a the random phase shift in the range [0,2π] to ensure random nature
    of the waves. The amplitude A_i can be found from the relation to the wave spectrum
    S(ω), given with Eq. (2):


    ½ A_i² = S(ω_i) Δω_i   (2)


    where considered frequency interval Δω_i has randomly distributed boundaries.


    Wave spectrum S(ω) is given in the frequency domain and describes how the total
    wave energy of all wave frequencies ω_i is distributed in stationary seaway (Faltinsen,
    1990). It can be estimated by one of the well-known spectra suggested by the International
    Towing Tank Conference (ITTC, 1969). In the case of fully developed seas, the
    recommendation is to use the two-parameter Bretschneider spectrum, cf. Eq. (3).


    S(ω) = 124 H_s² / T_z⁴ ω^{-5} exp(-496 / (T_z⁴ ω⁴))   (3)


    The Eq. (3) is given in a rewritten form as the characteristic statistical period
    of interest is zero up-crossing period T_z, with a relation to mean wave period
    T_1, T_1 = 1.087 T_z and peak period T_p, T_p = 1.405 T_z. H_s represents significant
    wave height, and ω is the wave frequency (DNV-GL, 2018).


    The energy distribution, in an example of two-parameter Bretschneider spectrum,
    is given in Fig. 3 with values of H_s = 3.0 m and T_z = 4.0 s. The one-dimensional
    spectrum has a single peak value indicating that unimodal seas are being observed.
    The single peak value occurs at an angular frequency ω_p = 1.12 rad/s, corresponding
    to the above relations for the peak period T_p and zero up-crossing period T_z
    since ω_p = 2π / T_p. Also, the supplied spectrum includes information on the
    significant wave height H_s, which can be determined from the area under the spectrum.
    It should be noted that, for practicality and simplicity reasons, generated time-series
    do not contain information about wave directionality. In other words, we only
    observe long-crested or unidirectional waves with a narrow spreading.


    While routing, the ship is observed as a complex object with the forward speed
    U, and it is encountered by waves at a specific encounter angle β. Encountered
    wave spectrum is not equal to wave spectrum given in wave frequency domain ω due
    to Doppler shift. Therefore, ship responses should be observed in the encounter
    frequency domain ω_e. The following expression applies to the transformation from
    wave to encounter frequency domain:


    ω_e = ω - ω² U / g cos(β)   (4)


    with g being the gravitational constant in the adopted right-handed coordinate
    system, where the encounter angle of 180 deg indicates head seas.


    Given ship speed and heading angle, we can easily calculate the encounter period
    from the wave period. The encounter period is significant since it represents
    the period when the ship encounters waves. Consequently, substantial ship motions
    may occur if it coincides with the natural ship motion period. Since it depends
    on the ship''s speed and course angle, in addition to the wave frequency, the
    captain can “control” it by adjusting the ship''s speed or course angle.


    With known encounter wave spectrum and appropriate complex-valued transfer functions
    Φ_R, one can calculate the time-series of ship motion responses R_i(t) following
    (Denis and Pierson, 1953):


    R_i(t) = Σ_{i=1}^{n} A_i |Φ_R(ω_{e,i})| cos(ω_{e,i} t + ε_i)   (5)


    where frequency discretization is non-equidistant, and amplitude A_i is given
    in wave frequency domain ω as stated in Eq. (2). Since the unidirectional spectrum
    is observed, each set of time-series R_i(t) is generated for a single encounter
    angle β, with other wave characteristics contained in the amplitude A_i.


    Transfer functions are computed with a strip theory solver for pitch, roll and
    heave as a function of encounter frequency ω_e and encounter angle β. Forward
    speed was 16.19 knots, and relative wave directions were discretized into 36 headings
    for [0,360]deg, with other values obtained by linear interpolation. The range
    of wave frequencies ω are defined as [0,4.0] rad/s. The ship under study was a
    20,000DWT Bulk Carrier, with the primary characteristics shown in Table 1. The
    amplitudes of frequency response functions for heave, pitch, and roll motions
    are given in Fig. 4 with relative wave direction β = 150 deg and ship forward
    speed U = 16.19 knots.


    By applying the Eq. (5), we computed time-series of motion responses in 3-DOF,
    with a sampling frequency of 5 Hz and sample lengths of 300 s. An example of time-series
    responses is given in Fig. 5.'
