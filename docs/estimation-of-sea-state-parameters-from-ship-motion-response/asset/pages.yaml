    # 2.3.2. Multivariate long short-term memory CNN (MLSTM-CNN): original and enhanced


    Multivariate long short-term memory (LSTM) CNN consists of two components, as
    depicted in Fig. 9. The first component is based on convolutions (similar to the
    CNN-REG model) but enhanced with squeeze and excitation block (SEB) (Hu et al.,
    2018). SEB block introduces weights that increase inter-dependencies among the
    convolution layers feature maps while simultaneously adding minor computational
    costs. The second component is based on the LSTM block (Hochreiter and Schmidhuber,
    1997). The LSTM block introduces memory that is able to “remember” the dependencies
    between the signal sample in the observed moment and all samples before the observed
    moment.


    The tested hyperparameters for MSLSTM-CNN are related to scaler value κ chosen
    among the following options: 1, 5, and 10. Other hyperparameters, such as data
    augmentation and optimizers (and their respective learning rates), were the same
    as in the case of CNN-REG. After enhancing the originally proposed MLSTM-CNN,
    the best performing parameters for MSTM-CNN-ENH were: data augmentation row-wise,
    optimizer ADAM with a learning rate set to α = 0.005, and scaling factor κ = 5.
    On the other hand, the best performing parameters for MLSTM-CNN-ORG were: data
    augmentation batch-wise, and optimizer SGD with learning rate α = 0.005.


    # 2.3.3. Sliding puzzle network: original and enhanced


    The sliding puzzle neural network (SP-NN) proposed in Mak and Düz (2019) has a
    pretty neat motivation. This model aims to shuffle random patches of the input
    data in a manner that resemble a sliding puzzle. In a sliding puzzle, although
    the image is shuffled, the content of the image can still be seen. This idea led
    to the construction of the NN, which topology can be seen in Fig. 10. The SP-NN
    is designed to remove the positional dependency between samples completely.


    ![](img/4734fbdc67cafcec90fddf3b05be1d58_5_2.png)


    Fig. 10. The architecture of the sliding puzzle neural network (SP-NN).


    achieve this, the average, max, and min pooling are performed for each feature
    map of the second convolution layer. As the original authors state: the result
    of encoding is purely based on initial convolutions.


    We have built two versions of SP-NN: the original one that resembles the model
    proposed by its authors (SP-NN-ORG) and an enhanced one (SP-NN-ENH) where we increased
    the width of SP-NN-ORG by a factor κ. Therefore SP-NN-ORG had the following hyperparameters:
    the first convolution layer had 64 filters with kernel size 1 × 25, the second
    convolution layer had 128 filters with kernel size 3 × 1, dense layer consisted
    of 30 neurons, SEB block had shrink ratio of 16.


    For the SP-NN-ENH we have scaled a number of filters and neurons by multiplying
    them with factor κ = 10. Optimizer for SP-NN-ENH was adam with α = 0.00005. The
    optimizer for the original version was SGD with α = 0.005.


    We believe that we have enhanced all NNs in a manner that does not violets the
    original author’s reasons and motivation behind NN design. Also, wherever we had
    doubts about parameters’ values (when these were not specified in the original
    work), we tested different parameter values and took the best-performing one.


    # 2.3.4. Attention-based neural network (AT-NN)


    Many state-of-the-art algorithms in computer vision, natural language processing
    (NLP), or even augmented data generation rely on attention modules (Galassi et
    al., 2021; Zhang et al., 2019; Woo et al., 2018). The attention module, including
    the self-attention module, has been introduced in paper (Vaswani et al., 2017),
    which claims that “Attention is all you need”. The intuition behind the attention
    module comes from NLP, where the urge to capture relations between words far away
    from each other in a sentence/text was necessary.


    We believe that the time-series signals describing the ship’s motion have also
    scattered information that needs to be grouped. The proposed model AT-NN can seize
    the interaction and correlation between different parts of the input signals by
    utilizing the self-attention module. Thus, the model can create new informative
    features essential for sea state estimation, which simple convolution operations
    cannot obtain.'
