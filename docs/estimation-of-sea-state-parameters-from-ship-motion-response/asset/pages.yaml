    fails. The errors seem to be related to individual angles rather than neighboring
    angles. This behavior confirms that the model is neither overfitted nor under
    fitted. When the modal underperforms, it still achieves a remarkably good result.
    In addition, to increase the trustworthiness of the proposed model, we have enabled
    uncertainty estimation as an additional feature.


    The process is quite simple in bolt and nuts: for the same input time-series signals,
    we run predictions of the AT-NN 256 times, on every prediction dropping random
    neurons. By dropping random neurons, we obtain a new version of the original NN
    that gives predictions slightly different from other “sampled” networks. By calculating
    the mean value $μ$ standard deviation $σ$ of all predictions, we can calculate
    a Gaussian curve that estimates the uncertainty of the model decision. Accompanying
    uncertainty estimation, we also have the actual prediction of the model generated
    without dropping any of the neurons.


    To increase explainability and provide additional information, we have extended
    the output of Monte-Carlo dropout sampling by involving statistical measurement.
    Although quite simple in its nature, statistical measurement involved counting
    how many correct measurements of the test set fell into Gaussian curves estimated
    by Monte-Carlo dropout sampling with different values of $σ$ ($μ$ was fixated).
    The different values of $σ$ were calculated by multiplying sigma with $n ∈ [1,
    2, 3, 4, 5]$, resulting in wider Gaussian curves. Thus, following one’s expectation,
    wider Gaussian curves would also encompass a bigger number of correct measurements
    of the sea state. Therefore for $n = 1$, the Gaussian curve with $σ_{scaled} =
    1×σ$ contained 387 correct predictions while 896 predictions/samples were outside
    the range. This leads us to 30% certainty in total (387/1283) for this quite narrow,
    Gaussian curve. On the other hand, a much wider Gaussian curve with $σ_{scaled}
    = 5 × σ$ contained 1246 predictions from 1283 samples in the test set which lead
    us to the certainty of 97%. The validation dataset had similar performance related
    to $σ$ values and the number of contained samples, so the integrity of the estimation
    was not impaired. The graphical example of the final AT-NN output is given in
    Fig. 14. It can be seen that the blue line represents the true value for the given
    input signals, and the black line represents the prediction of the AT-NN without
    dropping any neurons. In contrast, Gaussian curves represent different “intervals”/“areas”
    of probability that correct measurements lie within. We believe that this novel
    process of estimating and interpreting the NN’s output raises the trustworthiness
    of the proposed model. Also, besides having only one number, as a result, the
    user of the proposed model, if having doubts in model estimation, now has confidence
    levels


