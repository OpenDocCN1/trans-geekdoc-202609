    # 2.3. 1D-ResNet


    All algorithm structures and code in this study were designed and implemented
    using MATLAB R2023a. The original ResNet is designed for image classification
    and recognition, typically handling 2D and 3D image data. However, since the Z-axis
    data used in this study are one-dimensional, we modified the input data structure
    to accommodate 1D data by replacing the input layer with a sequence input layer.
    For the input data, 20 data points, corresponding to approximately 2 s of data
    with a sampling frequency of 10 Hz and one workout cycle, were grouped into sequences
    within single cells, resulting in a total of 901 sequences. The output data were
    labeled according to the corresponding workout type. Out of the 901 data samples,
    600 were randomly allocated for training and 301 for testing. This 2:1 split ensures
    that the model has sufficient data to learn while maintaining enough data for
    evaluation. The data were randomly split to ensure an unbiased distribution between
    the training and test sets.


    The key concept of ResNet, the residual block, can be divided into the main path
    and the skip connection. The main path consists of convolutional layers, batch
    normalization layers, and ReLu layers where the input data undergo processing.
    The skip connection,'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'however, allows the initial input to bypass any processing and pass directly
    to the output. At the end of the process, the values from both the main path and
    the skip connection are combined through residual mapping, which helps mitigate
    the vanishing gradient problem and allows deeper networks to perform better. The
    equation for this process is as follows:


    ```

    X + F(X)

    ```


    where X is the input value and F(X) is the value that passes through the main
    path. Additionally, the residual block where residual mapping occurs can be illustrated
    as shown in Figure 4.


    ![](img/c1925febd7dde400183c23c14d668ef0_178_0.png)


    The 1D-ResNet model in this study, as depicted in Figure 5, consists of three
    residual blocks. Each convolutional layer has a kernel size of 3 × 3, with 64
    filters in the first block, 128 filters in the second block, and 256 filters in
    the third block. Following the residual blocks, a global average pooling layer
    is used to reduce the dimensionality while retaining important features. This
    is followed by two fully connected layers, a dropout layer with a dropout rate
    of 0.5 to prevent overfitting, and a softmax layer for calculating class probabilities.
    The final classification layer then recognizes the workout based on these features.
    The algorithm was trained using Root Mean Square Propagation (RMSprop) as the
    solver, chosen for its ability to adapt the learning rate during training, which
    helps in improving convergence. The model was trained for 200 epochs (800 iterations)
    with a batch size of 128, an initial learning rate of 0.001 and decrease factor
    of 0.5 per 25 epochs, allowing for a balance between learning speed and stability.
    Furthermore, we conducted the same training and validation processes with 3D input
    data comprising X-, Y-, and Z-axis dimensions to investigate the performance differences
    compared to the 1D ResNet model.


    To validate the performance of the trained 1D ResNet algorithm, we utilized 301
    test data samples as input to generate predictions. These predictions were then
    used to calculate not only the overall accuracy but also key classification metrics
    such as precision, recall, and F1-score. These metrics were calculated as follows:


    ```

    Precision = \frac{TP}{TP + FP}

    ```'
