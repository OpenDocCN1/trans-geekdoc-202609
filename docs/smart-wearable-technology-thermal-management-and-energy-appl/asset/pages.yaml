    # 3.2. Comparison with Previous Research


    Finally, the accuracy of the 1D ResNet model for workout recognition in this study
    was compared with previous studies and a 1D CNN model without the residual block
    structure to assess the impact of the residual block on performance. This comparison
    highlights how the addition of residual blocks improves the model’s ability to
    recognize workouts accurately. Although the 1D CNN without residual mapping had
    the same number of learning layers, its recognition accuracy was 89.03%. The cascaded
    1D CNN structure from previous research achieved a higher accuracy of 92% [30].
    However, the 1D ResNet model developed in this study achieved the highest recognition
    accuracy of'
