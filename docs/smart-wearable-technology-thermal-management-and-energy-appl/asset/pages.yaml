  md: '# Assessment of Wearable Cooling and Dehumidifying System Used under Personal
    Protective Clothing through Human Subject Testing


    Yiying Zhou 1, Lun Lou 2 and Jintu Fan 1,3,4,*


    +   1 School of Fashion and Textiles, The Hong Kong Polytechnic University, Hong
    Kong;

    +   21052594r@connect.polyu.hk

    +   2 Energy Sector, Nano and Advanced Materials Institute, Hong Kong Science
    Park, Hong Kong

    +   3 Research Center of Textiles for Future Fashion, The Hong Kong Polytechnic
    University, Hong Kong

    +   4 Research Institute of Sports Science and Technology, The Hong Kong Polytechnic
    University, Hong Kong

    +   * Correspondence: jin-tu.fan@polyu.edu.hk


    Abstract: Healthcare professionals wearing personal protective equipment (PPE)
    during outbreaks often experience heat strain and discomfort, which can negatively
    impact their work performance and well-being. This study aimed to evaluate the
    physiological and psychological effects of a newly designed wearable cooling and
    dehumidifying system (WCDS) on healthcare workers wearing PPE via a 60 min treadmill
    walking test. Core temperature, mean skin temperature, heart rate, and subjective
    assessments of thermal sensation, wetness sensation, and thermal comfort were
    measured throughout the test. Additionally, ratings of wearing comfort and movement
    comfort were recorded during a wearing trial. The results showed that the WCDS
    significantly reduced core temperature, improved thermal sensation, and reduced
    wetness sensation compared to the non-cooling condition. The microclimatic temperature
    within the PPE was significantly lower in the cooling condition, indicating the
    WCDS''s ability to reduce heat buildup. The wearing trial results demonstrated
    general satisfaction with the wearability and comfort of the WCDS across various
    postures. These findings contribute to the development of enhanced PPE designs
    and the improvement in working conditions for healthcare professionals on the
    frontlines during outbreaks.


    Citation: Zhou, Y.; Lou, L.; Fan, J. Assessment of Wearable Cooling and Dehumidifying
    System Used under Personal Protective Clothing through Human Subject Testing.
    Processes 2024, 12, 1126. https://doi.org/10.3390/pr12061126

    Academic Editor: Kian Jon Chua

    Received: 12 April 2024

    Revised: 9 May 2024

    Accepted: 28 May 2024

    Published: 30 May 2024


    Keywords: personal protective equipment; healthcare workers; wearable cooling
    and dehumidifying system; thermal comfort; wearing comfort


    # 1. Introduction


    Healthcare professionals frequently work in environments with a high risk of viral
    transmission. Personal protective equipment (PPE) is an essential component of
    isolation precautions designed to protect these individuals from potential exposure
    to infectious agents [1,2]. However, the prolonged use of PPE can lead to additional
    physical and mental stress, such as heat strain, fatigue, and a potential decrease
    in work performance [3-6]. A study revealed that healthcare professionals experienced
    heat strain symptoms approximately 25 times more frequently when working with
    PPE compared to working without it [7].


    To alleviate heat stress caused by PPE, personal cooling garments were developed
    to enhance heat loss and improve thermal comfort by regulating body temperature
    and reducing physiological stress. Several studies have evaluated the effects
    of existing personal cooling garments used with PPE, including PCM/ice vests [8-10],
    liquid cooling garments [11-14], and ventilation cooling systems [15,16], all
    of which demonstrated significant improvements in thermal comfort. However, PCM/ice
    vests and liquid cooling garments have limitations in operating time [17,18],
    and both of these cooling methods can cause skin wetness, which affects skin wetness
    comfort [19]. Additionally, existing


    ![](img/c1925febd7dde400183c23c14d668ef0_104_0.png)


