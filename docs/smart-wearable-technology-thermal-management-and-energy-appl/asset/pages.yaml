- pgno: 162
  md: '![](img/c1925febd7dde400183c23c14d668ef0_162_0.png)


    Figure 1. Conductive textile in wearable sensor.


    The defects of dip-coated conductive textiles are particularly evident with common
    conductive particles such as carbon nanotubes (CNT) and Mxene, both of which are
    carbon-based and impart a black color to the textile [15–18]. One of the primary
    concerns of defects is the uneven distribution of conductive particles, which
    can lead to localized variations in electrical resistance. Such inconsistencies
    may result in signal distortions, reduced conductivity, and, in extreme cases,
    circuit discontinuities that impair the textile''s sensing and actuation capabilities.
    Therefore, in the field of wearable technology, where precise signal transmission
    and control are essential, defects in conductive textiles directly lead to product
    malfunctions. To address this issue, this study aims to develop an image processing
    algorithm specifically tailored for detecting defects in conductive textiles,
    ensuring their reliability and functionality in wearable applications.


    Due to recent advancements in computational capabilities, the development of machine
    learning (ML) [19], particularly in the area of image processing algorithms (IPA)
    using two-dimensional and three-dimensional images [20,21], has made it possible
    to replace humans in many fields. Specifically, in the quality inspection sector
    of textile manufacturing [22–25], cameras and various algorithms can now replace
    the human eye and brain to detect and classify defects.


    However, textile materials, due to their diverse weaving methods, patterns, and
    colors, present significant challenges for feature extraction in images [15,26,27].
    There are various types of defects in conductive textiles, including missing yarn,
    broken ends, needle lines, spots, stains, holes, press-off, mixed yarn, and gout
    [28]. Of these, this study focuses specifically on stains defects. While other
    types of defects often occur during the textile manufacturing process or result
    from physical damage during use, changes in electrical properties that hinder
    resistance measurement typically manifest as stains'
  merge: -1
  img_proc: true
- pgno: 163
  md: 'or irregular patterns. Therefore, stain defects are particularly critical for
    assessing the functional integrity of conductive textiles [29,30].


    Since the detection of stains through textile image processing algorithms (TIPAs)
    requires a precise definition of defects, threshold-based methods serve as a fundamental
    approach in defect detection [31,32]. Moreover, these thresholds act as a critical
    variable that directly influences the overall accuracy of TIPAs. Setting a standardized
    reference value in image data is inherently challenging, necessitating various
    preprocessing techniques and adaptive thresholding methods [33]. For instance,
    in the case of the textiles produced through the dip-coating process during this
    study, the degree of darkness varies depending on the penetration level of conductive
    particles. As a result, simply classifying areas as stains based solely on brightness
    or darkness could lead to misjudging the entire conductive fabric as defective
    (Figure 2).


    ![](img/c1925febd7dde400183c23c14d668ef0_163_0.png)


    Figure 2. Defect detection through humans and through Textile Image Processing
    Algorithms.


    One study proposed a TIPA that uses an encoder–decoder structure to detect defects
    in textiles, employing image preprocessing techniques such as dilation, median
    filtering, and edge detection to identify defects [34]. Another study utilized
    wavelet functions to improve detection performance by identifying coefficients
    from defect-free textiles and optimizing them through a subset selection using
    a genetic algorithm [35]. Additionally, another study demonstrated superior detection
    performance by addressing low performance in detecting defects of various shapes
    and sizes using histogram and threshold-setting techniques [36–38]. These examples
    underscore the importance of strategic structuring and optimization in TIPAs for
    effective image processing.


    Overall, the objective of this study is to develop a Textile Image Processing
    Algorithm (TIPA) capable of detecting stain defects, which are caused by the agglomeration
    of conductive particles during the manufacturing process of conductive textiles,
    that lead to non-uniformity resistance. To achieve this, histogram equalization
    is employed as a preprocessing step to enhance contrast, enabling defect detection
    across various brightness conditions of conductive textiles. The algorithm’s structure
    includes a multi-step detection process based on defect size, which is optimized
    by fine-tuning the threshold ratio. The first filtering step is designed to classify
    whether an image belongs to the normal or defective category by analyzing the
    spatial distribution of defect-suspect pixels. The second filtering step, on the
    other hand, specifically aims to detect and isolate abnormal regions within defective
    images, ensuring that only significant defect areas are identified while minimizing
    false positives from minor variations or noise. The final evaluation is conducted
    on 22 conductive textile samples fabricated through the dip-coating process.'
