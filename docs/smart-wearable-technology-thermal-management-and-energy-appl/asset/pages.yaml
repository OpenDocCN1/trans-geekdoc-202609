    # 5. Conclusions


    This paper presents a literature review on the design and comparison of personal
    cooling garments. Based on the cooling technique, PCGs are divided into six different
    types, including ACGs, PCCGs, LCGs, ECGs, TCGs, and RCGs. A brief introduction
    of each kind of cooling system has been presented, and the cooling efficiency,
    design-affecting parameters were also discussed.


    The results of this review reveal that the cooling power exhibited by different
    types of cooling garments varies. It seems that these cooling garments are effective
    at reducing the physiological strain in a hot environment. LCGs demonstrate a
    relatively higher cooling power, ranging from 67.2–340.4 W.


    As a relatively lightweight cooling garment, the cooling efficiency of ACGs is
    sensitive to environmental factors such as humidity levels and air temperature.
    In addition, ACGs rely on the exchange of the air from the inside to the outside
    of clothing; it cannot work when worn underneath personal protective equipment
    (PPE). The active ACGs require a power source to operate, and this can be problematic
    in situations where a continuous power source is not readily available. The passive
    ACGs show limited cooling efficiency, but they are lightweight and no extra devices
    needed, which is suitable for sportswear. For the design of active ACGs, the fabric
    of the outer layer should be considered for the air circulation inside the clothing,
    and the incorporating features such as the eyelet design and adjustable openings
    can prove beneficial in mitigating the bulkiness problem. Furthermore, optimizing
    the placement of devices with higher flow rates in the sweating region is recommended
    to enhance cooling efficiency.


    The suitability of LCGs and PCCGs as normal clothing is limited by their excessive
    weight, which in turn affects the duration of cooling provided. The weight can
    add bulk, making them less comfortable and practical for everyday use, especially
    in athletic settings. The LCGs and PCCGs typically have a limited cooling duration,
    and their cooling sources need to be recharged or replaced to maintain their function.
    This limitation can be a concern for individuals requiring long-lasting cooling,
    such as athletes during extended competitions. In terms of LCGs, optimizing the
    cooling performance involves utilizing a lower liquid temperature coupled with
    a higher flow rate (not exceeding 1 L/min). Additionally, the design of adjustable
    (fitness and flows) LCGs can minimize the discomfort resulting from direct contact
    between the coolant and the skin. For PCCGs, enhanced cooling efficiency can be
    achieved by increasing the mass of the PCMs or phase-change microcapsules. Lower
    melting temperatures of the PCM provide higher cooling rates. Finally, achieving
    a proper fit of LCGs and PCCGs is essential to enhance cooling efficiency.


    The performance of ECGs is influenced by ambient temperature and humidity. In
    extremely hot or humid conditions, they may struggle to provide adequate cooling,
    especially for individuals engaged in strenuous activities. To enhance the cooling
    performance of direct ECGs, firstly, increasing the liquid content and ensuring
    direct contact between the fabric and the skin can enhance cooling efficiency.
    Secondly, reducing the evaporative resistance and the thickness of the fabric
    used in ECGs can promote improved cooling effects.


    However, the detailed exploration of other cooling garments, such as TCGs and
    RCGs, remains relatively limited in current research. Thus, further investigations
    in these categories are warranted to expand our understanding and guide future
    advancements in this field.


    Further research is needed to balance the function, ergonomics, and aesthetic
    design for different applications. The efficiency of these PCGs not only depends
    on the effect of the'
