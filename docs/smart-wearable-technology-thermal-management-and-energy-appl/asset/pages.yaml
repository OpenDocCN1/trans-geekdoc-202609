    | SCI REP-UK | 670 | 1.05 | Q3 | 149 |

    | TEXT RES J | 661 | 0.64 | Q3 | 74 |


    The JIF of a journal is another important parameter to evaluate the value of the
    journal itself and the publications included in it. Among the top 10 academic
    journals, Science had the highest JIF at 10.15, followed by ADV MATER at 4.18,
    and both were classified as Q1. Additionally, the top three H-index journals were
    SCIENCE (1058), ADV MATER (447), and NANO LETT (430). Based on the above, we believe
    that Science and Ad Mater are the more authoritative journals in this field.


    # 3.6. Citations Analysis


    Citation analysis is an important indicator in bibliometric studies [18,19]. A
    total of 254 co-cited references were visualized using CiteSpace 6.2.R4, with
    the time slice set as one year and the time span spanning from 2012 to 2022. Table
    5 showed the top ten most cited papers, including four review studies (Stoppa
    M et al., 2014 [20]; Zeng W et al., 2014 [21]; Heo JS et al., 2018 [22]; and Amjadi
    M et al., 2016 [23]) and six experimental studies (Dong K et al., 2020 [24]; Weng
    W et al., 2016 [25]; Shi JD et al., 2020 [26]; Pu X et al., 2016 [27]; Lee J et
    al., 2015 [28]; Chen J et al., 2016 [29]), which focused on the electronic components
    and multi-functions of smart textiles. The most-cited papers were written by Stoppa
    M’s group, who work at the University of Istituto Italiano di Tecnologia (IIT),
    reflecting their great influence in the field. Citation bursts refer to references
    that caught the attention of scholars in a specific field at a specific time interval
    and whose analysis can be used to observe the evolution of a field of knowledge
    and to predict frontier trends. In Table 6, the timeline is shown in a circle,
    and the burst time interval is shown in a solid black circle, indicating the start
    year, end year, and duration of the burst. Of these burst citations, the shortest
    burst duration for intelligent textiles and garments was one year, and the longest
    was four years. Notably, 40% of the citation bursts ended close to 2019, focusing
    on advances in flexible sensitive strain sensors and supercapacitors (Amjadi M
    et al., 2016 [23]; Wen Z et al., 2016 [30]; Pu X et al., 2016 [27]; Ren JS et
    al., 2017 [31]; Kou L et al., 2014 [32]). Additionally, 15% of the citation bursts
    ending in 2022 or later focused on smart textiles that integrate microelectronic
    systems and functional textiles (Hsu PC et al., 2016 [33]; Zhao ZZ et al., 2016
    [34]; Shi JD et al., 2020 [26]), suggesting that these research topics have been
    receiving attention in recent years and are expected to be a focus of research
    in the future.'
