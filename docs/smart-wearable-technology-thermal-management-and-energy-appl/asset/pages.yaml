    by which water vapor on the surface or inside a cooling suit condenses into water
    droplets when it comes in contact with a cooler surface [73].


    The occurrence of condensation is a challenge to human comfort. When condensation
    occurs, garments around the human body become wet, which not only causes discomfort
    but also leads to increased heat loss, further affecting the body’s perceived
    temperature. Damp garments can also cause discomfort or health problems, such
    as a feeling of coldness and moisture that harbors bacteria [74]. As a result,
    cooling alone to reduce body temperature is no longer sufficient to meet the body’s
    comfort needs.


    There are a number of factors that need to be considered to address the problems
    associated with the risk of condensation. Firstly, the design of cooling suits
    should take full account of factors such as ambient temperature and humidity to
    determine the appropriate cooling water temperature and avoid the occurrence of
    condensation caused by cold water that is too low. Secondly, the material and
    structure of the cooling suit should have good'
