  md: '# 5. Performance Evaluation Indicators of Personal Wearable Thermal and Moisture
    Management Clothing


    At present, there are many methods for evaluating the thermal and moisture comfort
    of garments, mainly analyzing and evaluating them from physical [90], physiological
    [91], and psychological [65] perspectives, and the evaluation methods can be divided
    into subjective and objective evaluations. An objective evaluation uses physical
    indicators and their fabric performance indicators and human physiological indicators,
    and a subjective evaluation is based on the psychological indicators of the human
    body [92–94].


    # 5.1. Objective Evaluation Methods


    The objective evaluation method is an evaluation method that uses objectively
    changing data that can be specifically measured and the results derived by instruments
    [94]. This evaluation method mainly evaluates the thermal and moisture comfort
    of garments from the following aspects: (1) using the thermal and humidity properties
    of textile materials as well as the thermal and humidity properties of the entire
    garment to evaluate the thermal and humidity comfort of the garment [95]; (2)
    using the garment microenvironment as the basis for the study of thermal and humidity
    comfort, and reflecting the influence of fabrics on the human body’s sense of
    comfort by measuring the changes in temperature and humidity of the climatic region
    between the fabric and the skin, and proposing evaluation indices [96]; (3) analyzing
    human physiological data, clothing physiology points out some important physiological
    indexes, including body core temperature [97], average skin temperature [90],
    average body temperature, metabolic heat production, heat balance difference,
    heat loss, perspiration, heart rate [98], and blood pressure [99,100].


    Typically, a two-step method is used for active sweat measurement. The measurement
    process of this method is as follows: first, the dry heat dissipation is measured
    while wearing a thousand dummy garments, and then the total heat dissipation (including
    the evaporative heat dissipation portion) is measured for a wet dummy attire.
    By calculating the wet heat dissipation minus the dry heat dissipation, the result
    of evaporative heat dissipation can be obtained [101]. In contrast, the “Walter”
    sweat warmer dummy for passive sweating uses a different measurement method [102].
    In the measurement process, the total moisture resistance is calculated by considering
    the skin as a layer of the garment, and then the moisture resistance of the skin
    is subtracted from the total moisture resistance to obtain the moisture resistance
    of the garment and the surface air layer. Different from the two-step method,
    the evaporated sweat and wet-state heat dissipation of the warm body dummy are
    measured first in the measurement process to get the wet resistance and thousand-state
    heat dissipation, and then the thermal resistance is calculated based on the dry-state
    heat dissipation. As an instrument for testing the overall thermal and humidity
    performance of garments, the warm body dummy can simulate the mass transfer and
    heat transfer between the human body and the environment. Its measurements are
    objective, accurate, and repeatable [103]. To avoid ethical issues, inter- and
    intrasubject variability, and high costs, sweat dummies are often used to simulate
    sweat-induced evaporative cooling. Table 6 shows the different sweating simulation
    methods dummies used [104].


    Table 6. Dummies with different methods of sweating simulation.


    | References | The Dummy | Characterization |

    |---|---|---|

    | [105] | Tore | Prewetted tight fabric skin applied to a dry thermal manikin
    |

    | [102] | Walter | Water-filled manikin with a waterproof but vapor permeable
    surface |

    | [104] | Coppelius | Manikin with an inner skin spreading water superficially
    and an outer vapor-permeable skin |

    | [106] | Newton | Manikin with a supply of water to a fabric skin by means of
    sweating outlets distributed over the manikin’s surface |

    | [104] | ADAM | Manikin with a porous metal surface with superficial sweating
    |'
