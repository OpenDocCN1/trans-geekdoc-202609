  md: 'was used to measure thermal conductivity and specific heat capacity of 20 fabrics
    with different water contents. Thermal absorption coefficient, which characterizes
    the thermal sensitivity performance of the fabric, was then calculated. The fabrics’
    thermal sensitivity levels were objectively evaluated based on the evaluation
    criteria. The instrument was turned on in advance and preheated for 30 min. The
    probe temperature was set to 35 °C, the same as to the temperature of human skin.
    The resistance of the probe changed after contact with the sample. The thermal
    conductivity and thermal absorption coefficient of the fabric can be accurately
    calculated based on the change in probe resistance. The sample had to be in the
    same thermal state before each test and consecutive measurements were not allowed.
    Adequate time was required to ensure that the previously measured samples returned
    to their initial thermal states.


    # 3.4. Subjective Measurement Experiment


    Subjective evaluation was carried out in a laboratory at constant temperature
    and humidity (temperature setting of 20 ± 0.5 °C, humidity of 60 ± 5%, and wind
    speed less than 0.4 m/s) to ensure that the subjects’ physiological functions
    were at their best state and their senses were more sensitive. At the same time,
    the psychological state was adjusted to ensure the smooth progression of the experiment.
    Subjects evaluated the coolness sensation of the fabric using the inside of their
    forearms [2]. Twelve college students—six males and six females—with an age of
    21.8 ± 1.3 years (range 20–23), a height of 1.65 ± 0.04 m (range 1.52–1.82), and
    a weight of 55.6 ± 10.4 kg (range 43.3–82.4) volunteered to participate in this
    study. The subjects received relevant experimental training before the test, including
    an explanation of the definition of the thermal sensation from the fabric, the
    method for touching the samples during the test, and the rating method in the
    questionnaire. To avoid different scales, the same researcher explained the method
    for rating thermal sensation before each experiment to ensure smooth progression
    of the experiment and reliability and accuracy of the experimental results. Before
    touching the test samples, the subjects needed to sit quietly in the laboratory
    for 10 min to adapt to the surrounding environment and adjust their mental state.
    During the test, the subject extended their forearm forward with the inside of
    their forearm facing upwards, and the researcher placed the fabric on the forearm
    and pressed it appropriately to simulate the pressure exerted by clothing on the
    skin. As heat is conducted to the fabric when it comes into contact with human
    skin, to avoid errors, samples from the previous test were tested at an interval
    of 2 min to allow the fabric to return to its initial thermal state before the
    next test. The two forearms were covered alternately, and the test was completed
    when the two sensory evaluations given were consistent. If any inconsistency occurred,
    the process was repeated until all samples gave consistent evaluation results.
    The subjects filled out the questionnaires based on the warm/cool sensation felt
    by the forearm when it came into contact with the fabric. The coolness level was
    divided based on the individual’s subjective feeling.


    # 3.5. Statistical Analysis


    The SPSS software (Version 27.0, IBM Co., Ltd., Armonk, NY, USA) was used to analyze
    the correlation between factors affecting the coolness sensation of wet-state
    fabrics using one-way analysis of variance and Pearson correlation analysis, with
    the significance level set at p < 0.05. Origin software (Version 2023, OriginLab
    Co., Ltd., Northampton, MA, USA) was used to compare the objective and subjective
    measurements by fitting the analysis and determining the linear relationship between
    the two.


