    # 4.3.3. Phase-Change Cooling Suit


    According to the cooling principle, phase-change cooling suits fall under passive
    cooling technology. Due to their simple system, user-friendly operation, lack
    of power requirements, absence of explosion-proof demands, wide range of phase-change
    materials, effective cooling performance, and reusability, phase-change cooling
    suits possess extensive application prospects. They have become a focal point
    of research for international scholars.


    Phase-change cooling suits operate on a passive cooling principle [35]. Typically,
    multiple pockets are incorporated into the clothing to hold phase-change materials.
    Through the phase transition of these materials, they absorb heat from the body,
    achieving the cooling effect. Common phase-change materials include ice, dry ice,
    gels, crystalline salts, and phase-change material capsules [36]. Ali et al. [37]
    explored the melting points of different phase-change materials, ultimately choosing
    hexadecane, with a melting point of 18–20 °C, as the phase-change material to
    develop a phase-change cooling suit. Itani et al. [38] tested the metabolic rate
    of individuals wearing three different cooling vests at different environmental
    temperatures to evaluate their respective cooling performance. The study found
    that using a mixed-phase-change cooling suit with a desiccant vest had a good
    effect on'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'maintaining a stable metabolic rate. Ji Changfa et al. [39] conducted experimental
    research on the characteristics of phase-change storage materials in cooling suits.
    They found that inorganic salts have good storage effects when used as coolants,
    demonstrating that an inorganic salt solution with a certain concentration ratio
    can be used as a phase-change refrigerant to fill the cooling suit.


    However, phase-change cooling suits do have some drawbacks, such as a non-adjustable
    temperature, heavy weight, limited duration, and potential for leakage. To address
    these issues, Yuan Pei et al. selected a phase-change material with a transition
    temperature close to body temperature and used a vortex tube as a cold source
    to cool the phase-change material, resolving the problem of repeated cooling.
    Sun Wenjuan et al. [40] proposed a composite phase-change latent heat storage
    material based on paraffin, which was blended with a polymer material in a proportionate
    melt. When the paraffin-based phase-change material underwent solid–liquid phase
    transition, the surface of the composite phase-change material remained unchanged,
    effectively solving the issues of leakage and the encapsulation of phase-change
    latent heat storage materials in individual cooling in mining. Liang Y et al.
    [41] selected the TH-SL-23 hybrid solid–liquid phase-change material, which has
    a high latent heat of fusion for an organic phase-change material, low undercooling
    ability in the liquid phase, and stable thermal and chemical properties without
    reaction or corrosion. The total mass of the working material was only 618 g.
    Today, various critical issues in phase-change cooling suits have been resolved.
    However, the future focus of research lies in how to integrate and apply these
    key technologies. This includes the development of a new type of comprehensive
    cooling suit based on phase-change materials that not only provides effective
    cooling but also offers temperature control. Additionally, there is a need for
    improved encapsulation materials and methods, enhanced thermal conductivity of
    phase-change materials, the development of composite phase-change materials with
    excellent heat dissipation and long endurance, as well as the creation of new
    materials or devices for rapid activation of phase-change materials, all of which
    will drive the advancement of phase-change cooling suits.


    # 4.3.4. Hybrid Cooling Suit


    A hybrid cooling suit refers to a cooling suit that combines two or more cooling
    methods, taking advantage of their respective strengths and compensating for their
    weaknesses. Song et al. [42] developed a hybrid cooling suit equipped with both
    a ventilation fan and phase-change materials. Their research results indicate
    that compared to a single cooling suit, wearing this hybrid cooling suit during
    indoor work for 90 min demonstrates better cooling effects and a longer cooling
    duration. Kang et al. [43], on the basis of a hybrid cooling suit combining phase-change
    materials and a fan, added an insulating layer to the outer surface of the phase-change
    cooling suit to reduce the absorption of heat from the external environment, significantly
    enhancing the cooling effectiveness and the duration of effective cooling for
    the hybrid cooling suit.


    # 5. The Application of Cooling Clothes in Mine Environments


    In hot underground mining environments, the initial investment for cooling suits
    is only 1/25 of that for traditional cooling methods, and the operational maintenance
    costs are 1/16 of the original. Mining cooling suits are flexible and convenient
    to use, not limited by the workplace, and can be moved according to changes in
    the mining face. It can be foreseen that in the hot environment of mines, cooling
    suits have a broad application prospect. The characteristics of various types
    of cooling suits are compared in Table 1.'
