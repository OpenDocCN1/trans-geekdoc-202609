  md: '# 3. Classification and Characteristics of Thermal Management Wearable Clothing


    Thermal management wearable system refers to the use of gases, liquids, phase
    change materials, and other cooling media for temperature control of the microenvironment
    under the clothing, to mitigate the heat stress of the human body in a hot environment
    [14]. There are various classifications of thermal management wearable systems
    based on different characteristics. First, according to the classification based
    on the cooling coverage, they can be divided into full-body-cooling garments [15]
    and localized-cooling garments [16]. Secondly, according to the classification
    of whether energy is consumed in the cooling process, it can be divided into active-cooling
    garments [17] and passive-cooling garments [18]. In addition, according to the
    classification based on the cooling medium used for cooling, it can be classified
    into evaporative-cooling clothing [19], air-cooling clothing [20], liquid-cooling
    clothing [21], phase change-cooling clothing [14], radiant-cooling clothing [18],
    and hybrid-cooling clothing [22]. Finally, the heat transfer pathways can be categorized
    as thermal convection, thermal conduction, and thermal radiation [6]. In the following
    part of this paper, we introduce and characterize the thermal management wearable
    system according to heat transfer pathways.


    # 3.1. Thermal Convection Wearable Clothing


    Thermal convection wearable clothing is a type of clothing specifically designed
    to regulate the body’s temperature. It is based on the principle that heat generated
    by the body is carried away by means of convection heat transfer to reduce body
    temperature or maintain a comfortable temperature. Gas-cooled garments and liquid-cooled
    garments are two common types of thermal-convection wearable clothing.


    # (1) Air-cooling clothing


    Air-cooling clothing typically employs low-temperature compressed air or ambient
    air as a cooling medium. This is achieved by circulating the air through pipelines
    or a sandwich of clothing, which then comes into contact with the surface of the
    human body. The resulting convection heat transfer and evaporation then help to
    dissipate heat away from the body [20]. Air-cooling clothing can be classified
    into two types: duct-type air-cooling clothing and fan-type air-cooling clothing,
    as depicted in Figure 5. Sayed et al. proposed an air/CO2-cooling garment, which
    utilized a cylinder to store high-pressure gas, and the compressed gas expanded
    as it passed through the orifice, thereby cooling the human microenvironment,
    as shown in Figure 5a [23]. To assess the cooling efficiency of the clothing,
    a total of 19 male participants were part of an experimental procedure. Compressed
    air was provided to the air-cooling clothing to facilitate an efficient airflow
    to the body. The temperature of the air supplied was temperature-dependent for
    workplace comfort. Nevertheless, duct-type air-cooling clothing has drawbacks,
    including a high weight, noise, and a low reliability, hindering portable design
    implementation.


    To meet the needs of certain industries that prioritize both comfort and portability,
    researchers have devised cooling clothing with tiny fans that can fit each individual
    perfectly [24]. Wang et al. developed an air-cooled suit of dry ice combined with
    ventilation that successfully stopped the mascot actor’s core temperature from
    rising during the performance, as illustrated in Figure 5b [25]. Twelve healthy
    male volunteers took part in the research. There were no reports of heat-related
    illnesses, as well as pulmonary, esophageal, and cardiovascular diseases. The
    mean age, weight, height, body surface area, and body mass index (mean ± SD) were
    21.3 ± 1.9 years, 65.3 ± 6.5 kg, 1.75 ± 0.04 m, 1.79 ± 0.09 m2, and 21.3 ± 1.9
    kg/m2, respectively. The primary aim of cooling garments is to mitigate heat stress
    in the human body by fostering the flow of ambient air throughout the body for
    enhanced evaporative cooling and convective heat transfer, as noted in Ref. [21].
    Nevertheless, in environments featuring high temperature and high humidity, where
    sweat accumulates on the body surface, air-cooling clothing’s efficacy is significantly
    restricted, leading to discomfort and potential metabolic imbalances, as discussed
    in Ref. [26]. Therefore, it may be necessary to select alternative cooling equipment
    for environments with high temperature and humidity levels.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '![](img/c1925febd7dde400183c23c14d668ef0_16_0.png)


    # (2) Liquid-cooling clothing


    The fundamental principle of liquid-cooling clothing is for the cryogenic liquid
    generated by the cold-source equipment to transfer heat with the human skin through
    the cooling tubing inside the clothing. This process lowers the body’s surface
    temperature and alleviates the heat strain caused by high temperatures [14]. Unfortunately,
    there are numerous flaws in the current design of liquid-cooled clothing. First,
    many of the current liquid-cooling clothing’s cooling units are complicated, with
    some employing compressors to cool the refrigerant, adding excess weight to the
    system and being inconvenient for personnel to carry [27]. Second, the majority
    of liquid-cooling clothing is tailored for specific environments, making them
    unsuitable for general workplaces [28]. Third, scholars have utilized metal materials
    to construct piped systems for liquid-cooling clothing [29]. Although metals offer
    excellent thermal conductivity, they tend to be rigid and uncomfortable to wear.
    These suits are categorized as thermoelectric and ice liquid-cooled depending
    on the type of cold source used [30].


    The thermoelectric liquid-cooling clothing, illustrated in Figure 6a, comprises
    four main components: a cooling device, a cooling piping system, a micropump,
    and a basic garment [17]. The circulating cooling water in the thermoelectric
    suit absorbs body-generated heat through the piping, effectively lowering the
    body’s surface temperature [31]. In this process, the temperature of the hot side
    rises, and this temperature rise negatively impacts the cooling performance of
    the semiconductor cooling plate. Based on their experiments, Zhang et al. [17]
    found that the cooling effect improved with the increasing flow rate under an
    optimal operating voltage. The cooling suit’s average maximum temperature difference
    was 5.5–39.2 °C. Thermoelectric liquid-cooling clothing has certain limitations,
    including a low coefficient of performance (COP), a reduced efficiency in high-capacity
    applications, and wide temperature ranges [32].


    The ice liquid-cooling clothing, illustrated in Figure 6b, is typically worn with
    a fanny pack or backpack containing an ice bag. The coolant exchanges heat with
    the ice storage container, and a micropump propels the coolant through a circulating
    pipeline within the clothing to exchange heat with the human body [30]. This sort
    of liquid-cooled attire diminishes the device’s intricacy, reduces cost, and enhances
    portability. As a result, it is more favored in the market and possesses greater
    practical application value. Nevertheless, liquid-cooling clothing necessitates
    the timely replacement of its cooling source. For a liquid-cooling suit, it is
    necessary to configure the type of cooling medium, inlet temperature, and flow
    rate according to the actual situation. Table 1 shows the type of medium, medium
    temperature, medium flow rate, and cooling efficiency for liquid-cooling clothing.'
