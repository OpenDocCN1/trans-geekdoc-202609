    When the fabric is made of two types of fibers blended together, the blended fiber
    density cannot be obtained directly but can be estimated using the following equation
    proposed by Militky [23].


    \(\rho_{ab} = r\rho_a + (1 - r)\rho_b\) (12)


    In the formula, \(a\) and \(b\) represent the types of fibers; \(\rho_a\) and
    \(\rho_b\) represent their fiber densities; \(r\) represents the proportion of
    fiber \(a\); and \(\rho_{ab}\) represents the density of the blended fiber. All
    tests were conducted under laboratory conditions at a temperature of \(20 \pm
    1\) °C, relative humidity of \(50 \pm 5\)%, and wind speed of less than 0.4 m/s.


    # 3.2. Experimental Preprocessing


    The study required measuring the maximum water absorption of each sample and dividing
    the fabric water content level based on the maximum water absorption. The experiment
    was conducted according to the method described by Tang et al. [24] and the pre-treated
    samples were ironed at low temperature and then dried in a 105 °C oven for 30
    min before measurement to remove excess moisture inside the fabric and achieve
    the “ultra dry state” mentioned by Naka et al. [25]. The fabric samples were then
    soaked in deionized water for 3 min until completely wet, and then hung vertically
    to dry until there was no more liquid dripping for 30 consecutive seconds, indicating
    that the fabric was in a fully wet state. The weight difference between the fabric
    before and after soaking represents the maximum water content. The amount of humidity
    in each sample was determined based on the maximum water absorption. The study
    used fabric water content as the parameter for characterizing fabric moisture
    level, with the water content as the percentage of the sample’s humidity level
    to the maximum water absorption reflecting the saturation level of the water content
    in the sample. The specific steps for adding humidity to the samples were as follows:
    the ultra-dry fabric was laid flat on a tabletop and a certain amount of deionized
    water was weighed using an electronic scale and poured into a humidifying spray
    bottle. The spray bottle was suspended about 2 cm above the center of the sample
    and the deionized water sprayed evenly over the fabric surface. The test was conducted
    after waiting for 5 min for the fabric to be fully wet. The study was conducted
    under conditions of ultra-dry state and water content levels of 20%, 40%, 60%,
    80%, and 100%.


    # 3.3. Objective Measurement Experiment


    The experiment referred to the ISO 22007-2 [26] and ASTM D7984 [27] standards
    and was conducted at a constant temperature and humidity of \(20 \pm 0.5\) °C
    and \(60 \pm 5\)%, respectively. A TPS 2500S thermal constants analyzer (Hot Disk
    AB., Co., Ltd., Göteborg, Sweden)'
