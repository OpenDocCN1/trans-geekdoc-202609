- pgno: 166
  md: 'Grayscale conversion was performed using a MATLAB function, and the coefficients
    used for calculating the grayscale value were rounded to three decimal places.
    These values correspond to those specified in Rec. ITU-R BT.601-7 for computing
    luminance (gray value), which are as follows:


    Gray value = 0.299 Red value + 0.587 Green value + 0.114 Blue value. (2)


    These coefficients are widely adopted for grayscale conversion in image processing
    to ensure accurate luminance representation, particularly in video and image standardization
    processes.


    The grayscale values, which range from 0 to 255, were binarized with a threshold
    set at 90. This threshold was chosen to represent approximately one-third of the
    full grayscale range, effectively excluding the most definitive background values
    while ensuring the detection of all potential defect areas. However, since the
    binarized values alone are not sufficient to accurately define defects, the pixels
    were expanded by doubling their width and height to enhance defect visibility
    and improve detection accuracy.


    Primary size filtering was conducted with a threshold set at 30 after the pixel
    expansion step. This threshold was chosen based on the observation that, in defect
    images with high grayscale contrast, defect-suspect pixels tend to be spatially
    clustered, whereas in normal images, pixels are more evenly distributed. Upon
    expansion, defect pixels are more likely to connect, whereas isolated pixels remain
    sparse. Therefore, if the number of connected pixels is three or fewer, they are
    considered part of the background and filtered out. This step effectively reduces
    false positives by removing small, non-defect-related variations. Subsequently,
    gaps between defective regions were filled to enhance connectivity before secondary
    size filtering was performed with a threshold set at 1000 pixels. This threshold
    serves as a criterion to distinguish actual stains from random small spots, ensuring
    that only sufficiently large defect regions are classified as stains while filtering
    out minor noise or non-significant small defects.


    The purpose of this TIPA, which is to detect defect areas and evaluate quality,
    was first approached by classifying images as normal or defective based on the
    number of pixels detected after primary size filtering. Specifically, the number
    of 1st detected pixels was compared to the threshold, which is 300,000 pixels,
    which comprised about 15% of the total pixel count of the image. This classification
    leverages the observation that more uniform fabrics tend to have a higher count
    of 1st detected pixels. Subsequently, the ratio of the number of 1st detected
    pixels to the number of 2nd detected pixels (obtained after secondary size filtering)
    was calculated as follows:


    detection ratio = The number of the 1st detected pixels/The number of the 2nd
    detected pixels. (3)


    This ratio was then used to perform a second classification based on a threshold
    ratio. The threshold ratio in this TIPA was optimized to distinguish between defective
    and normal images, and the detected white defects were compared with actual defects
    in the images to verify accuracy, with discrepancies highlighted in red.


    # 3. Results


    # 3.1. Preprocessing Images in TIPA


    The purpose of the preprocessing step is to maximize the continuous tonal values
    to improve the accuracy of defect detection. Figure 6a,b illustrate the preprocessing
    process of our TIPA before it was applied to a representative conductive fabric
    containing defects, showing a comparison between the histogram-equalized image
    and the original image. By examining the contrast values and the histogram after
    equalization, it is possible to observe a peak value in the dark contrast areas
    where the defects are detected. This'
  merge: -1
  img_proc: true
- pgno: 167
  md: 'indicates that the subsequent filtering step, which is based on pixel values
    and size, can be effectively performed.


    ![](img/c1925febd7dde400183c23c14d668ef0_167_0.png)


    Figure 6. Images of preprocessing results for defective conductive textile: (a)
    histogram equalization image; (b) comparison of original and histogram equalization
    results; (c) grayscale image with inverted pixel values.


    Based on this analysis, Figure 6c presents the grayscale conversion, where the
    RGB values have been removed, followed by an inversion of the image to facilitate
    easier defect detection.


    # 3.2. Filtering Images in TIPA


    Figure 7 illustrates the filtering results and the process of defect detection
    in our TIPA. Figure 7a shows the binarization filtering, where pixels are divided
    based on a threshold of 90 within the grayscale range of 0 to 255. The white areas
    represent pixels that are potential defects. While stains defined as defects in
    the conductive fabric are visible, many uniform fabric pixels also appear white,
    indicating that the binarization alone is insufficient for accurate defect detection.
    Figure 7b presents the results after expanding the filtered pixels by doubling
    their width and height, followed by size filtering based on a size threshold of
    30. This process effectively filters out a significant number of pixels, leaving
    behind most of the stained areas. However, some of the stained pixels are still
    filtered out, indicating the need for additional processing. Figure 7c shows the
    results after a secondary size filtering process, where the edge pixels have been
    expanded into a circular shape with a radius of four pixels, followed by size-based
    filtering with a threshold of 1000 pixels. Ultimately, all non-defective pixels
    are removed, and the defect areas are largely filled, confirming the effectiveness
    of the filtering process.


    ![](img/c1925febd7dde400183c23c14d668ef0_167_1.png)


    Figure 7. Images of filtering results for defective conductive textile: (a) pixel
    value filtering; (b) 1st pixel size filtering; (c) 2nd pixel size filtering.'
