    The thermal insulation rate is the percentage of the difference between the heat
    dissipation with and without the sample to the heat dissipation without the sample.
    It is related to the thermal conductivity and porosity of the fabrics and reflects
    the ability of the fabric to prevent the loss of body heat. According to the latest
    textile thermal insulation testing standard GB/T 35762-2017 (Textiles—Test method
    for thermal transmittance—Flat plate test), the equation for calculating the thermal
    insulation rate is as follows [26]:


    $$Q = \frac{W_2 - W_1}{W_1} \times 100\%$$ (20)


    where W1 is the heat dissipation of the blank test plate (W / °C) and W2 is the
    heat dissipation of the sample test plate (W / °C).


    # 4. Result and Discussion


    # 4.1. Effect of Water Content Saturation on Fabric Thermal Resistance


    In this study, the thermal performance changes of ten different fiber types of
    woven fabrics were measured at various humidity levels. The measurement results
    of thermal resistance and insulation rate in dry and wet states are shown in Figures
    2 and 3; each sample was measured three times. The coefficient of variation (CV)
    for the measurement results was less than 3%. As shown in the figures, the fabrics
    deteriorated in thermal performance after wetting and the thermal resistance and
    insulation rate both decreased as the water content saturation level of the fabric
    increased. Compared with the thermal resistance of all fabrics in the ultradry
    state, when the water content saturation level reached 20%, the thermal resistance
    significantly decreased in the range of 8.3~12.1 × 10⁻³ m²·°C/W, with an average
    decrease of 42.5%. Subsequently, when the water content saturation level reached
    40%, 60%, 80%, and 100%, the average decreases in thermal resistance were 61.8%,
    71.5%, 74.9%, and 77.8%, respectively. It was observed that the degree of decrease
    in thermal resistance gradually decreased as the water content saturation level
    of the fabric increased; this ultimately decreased to 22.2% of the thermal resistance
    in the ultradry state. This may be because a small amount of water in the fabric
    provides a shortcut for heat transfer when the water content saturation level
    of the fabric is low, significantly increasing the thermal conductivity of the
    fabric. As the water content saturation level increases, water molecules gradually
    enter the interior of the fabric until all the voids in the fabric system are
    occupied [27]. The thermal conductivity of fabric fibers generally ranges from
    0.033 to 0.100 W/(m·°C) according to literature [17]. Air, as a poor conductor
    of heat, has a stable thermal conductivity of only 0.026 W/(m·°C) at 20 °C, whereas
    the thermal conductivity of still water at 20 °C is 0.57 W/(m·°C), which is 22
    times higher than that of air. The specific heat capacity of water is 3431 times
    that of air at 37 °C [28]. When water occupies the entire fabric system, it not
    only destroys the loose structure of the fabric but also significantly reduces
    the thermal resistance of the fabric due to its higher thermal conductivity. When
    a large number of water molecules are adsorbed on the surface of the fabric, the
    fabric surface becomes moist [29]. As the proportion of adsorbed water in the
    fabric increases, the impact on thermal resistance gradually becomes less significant
    because the adhesion force and the action force of adsorbed water are weak [10].
    For blended fabrics, due to the different blending proportions of hydrophilic
    and hydrophobic fibers, it can be found that the proportion of hydrophilic fibers
    is greater than hydrophobic fibers in materials such as NE (Nylon 85% + Elastane
    15%), whose thermal resistance loss after complete wetting is 84.21% of the ultradry-state
    thermal resistance, whereas the proportion of hydrophobic fibers is greater than
    hydrophilic fibers in materials such as PC (Polyester 65% + Cotton 35%), whose
    thermal resistance loss was 68.70% of the ultradry-state thermal resistance. This
    finding may indicate that the thermal resistance loss after wetting is greater
    for blended fabrics with a higher percentage of hydrophilic fibers.'
