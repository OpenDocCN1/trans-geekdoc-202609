  md: '# Modification and Validation of a Dynamic Thermal Resistance Model for Wet-State
    Fabrics


    Zijiang Wu 1,†, Yunlong Shi 1,†, Ruiliang Yang 2,*, Xiaoming Qian 1,* and Shuting
    Fang 1


    1 School of Textile Science and Engineering, Tiangong University, Tianjin 300387,
    China; wuzijiang@tiangong.edu.cn (Z.W.); shiyunlong@tiangong.edu.cn (Y.S.); fangshutingfst@163.com
    (S.F.)

    2 School of Aeronautics and Astronautics, Tiangong University, Tianjin 300387,
    China

    * Correspondence: yangruiliang2001@sina.com (R.Y.); qxmjtpu@163.com (X.Q.)

    † These authors contributed equally to this work.


    Abstract: To investigate the dynamic thermal resistance of woven fabrics in different
    wetting states, ten commonly used clothing fabrics were selected and tested for
    fabric thermal resistance under different levels of water saturation in accordance
    with Chinese national standards. Based on Mangan’s eight thermal resistance prediction
    models, the study improved the models by replacing the original moisture content
    with water content saturation. The suitability of the eight models in predicting
    the thermal resistance of woven fabrics in wet states was compared using the sum
    of squared deviations (SSD), sum of absolute deviations (SAD), and correlation
    coefficient (R^2). The results showed that during the process from initial wetting
    to complete immersion, the measured thermal resistance values of the ten fabric
    samples were consistent with the predicted values from Model 5 in the theoretical
    model of thermal resistance (R^2 > 0.955). The characteristic of Model 5 is that
    the air thermal resistance and water thermal resistance are first connected in
    parallel and then connected in series with the fiber thermal resistance. The corrected
    predicted values from Model 5 were highly consistent with the experimental measurement
    values and can be used to approximate the thermal resistance of woven fabrics
    in wet states.


    Keywords: wet state; ultradry state; thermal resistance; thermal comfort; empirical
    model


    Citation: Wu, Z.; Shi, Y.; Yang, R.; Qian, X.; Fang, S. Modification and Validation
    of a Dynamic Thermal Resistance Model for Wet-State Fabrics. Processes 2023, 11,
    1630. https://doi.org/10.3390/pr11061630

    Academic Editor: Zhanzhao Kang and Qing Chen

    Received: 10 May 2023

    Revised: 24 May 2023

    Accepted: 25 May 2023

    Published: 26 May 2023

