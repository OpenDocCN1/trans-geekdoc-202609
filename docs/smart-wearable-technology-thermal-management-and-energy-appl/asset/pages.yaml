    # 4.3. Modification of Thermal Resistance Model


    According to the assumptions of the theoretical model (i.e., the voids in the
    fabric are uniform and constant), the model was revised by using the water content
    saturation instead of the moisture content to characterize the proportion of water
    in the fabric system voids. The study compared the fitting relationship between
    the prediction curve and experimental measurements before and after the revision
    of Model 5, as shown in Figure 4. From the figure, it can be clearly seen that
    the prediction curve is generally lower than the measured value, especially when
    using the original model. The revised model can obtain results closer to the measured
    value than the original model. Among the 10 sets of revised model prediction curves,
    8 sets (80%) had R2 values ranging from 0.95 to 0.99. Only one set of the revised
    model (NE group) had an R2 value lower than 0.90 (R2 = 0.896), which was higher
    than the original model (R2 = 0.824) by 0.072. However, this was still higher
    than the acceptable range of R2 values required by correlation analysis (R2 >
    0.8) [30]. It was also found that, especially at low water content saturation
    levels, the slope of the prediction curve of the revised model was smaller than
    that of the original model and the downward trend was more gentle, which was in
    line with the experimental test results. Comparison of the model prediction curve
    with the experimental results by Mangat et al. [3] also revealed that the original
    model always underestimated the thermal resistance compared with the actual measurement.
    Using water content saturation instead of moisture content can effectively improve
    the prediction accuracy of the model. The experimental results support the applicability
    of the model in predicting the wet-state thermal resistance of single-layer woven
    fabrics, indicating a great consistency between the measured and predicted values.
    Therefore, this study suggests that the revised Model 5 be used as the optimal
    model for predicting the wet-state thermal resistance of fabrics.


