    # 4.2. Coolness Level Classification Results


    The fabrics'' thermal absorption coefficient values obtained during experimental
    testing were classified into different levels based on the fuzzy comprehensive
    evaluation method, giving a more scientifically reasonable range of coolness levels
    for the fabric. Fabrics were classified into different coolness levels based on
    the fuzzy mathematical model, as shown in Figure 2. Fabrics with thermal absorption
    coefficients of ≤100 Ws$^{1/2}$/(m$^2$·°C) were defined as having no coolness
    (Level A), fabrics with thermal absorption coefficients ranging from 100 to 200
    Ws$^{1/2}$/(m$^2$·°C) were defined as having general coolness (Level B), fabrics
    with'
