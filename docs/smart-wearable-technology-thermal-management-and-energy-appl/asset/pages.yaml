  md: '# 2.2. Textile Image Processing Algorithm (TIPA) for Defect Detection


    To detect defects in the conductive fabric produced via the dip-coating process,
    a TIPA was designed, as illustrated in Figure 5. All steps of the TIPA were implemented
    using MATLAB 2023a to preprocess images and detect defects in each conductive
    textile image. The first step involved preprocessing the images, where histogram
    equalization was applied to smooth out the contrast. The histogram equalization
    involves calculating the cumulative distribution function (CDF) of the input image
    and using it to remap the pixel values to improve the contrast of the image. The
    mathematical equation of histogram equalization can be expressed as follows:


    ```

    s = (L - 1) × \frac{\sum_{k=0}^r P_r(k)}{N}

    (1)

    ```


    where the r is original pixel value, L is the 256 of the 8-bit images in this
    study, Pr(k) is the frequency of pixel value k, and N is the total number of pixels.
    In our TIPA, histogram equalization was performed using a MATLAB function. Histogram
    equalization was employed to enhance the contrast of the image by normalizing
    the histogram of pixel intensity values. This process involved measuring the occurrence
    frequency k of each pixel intensity, standardizing the histogram, and replacing
    each pixel value with its corresponding relative proportion. Subsequently, the
    cumulative distribution function (CDF) was utilized to compute and map the pixel
    values to new intensity levels, ensuring a more uniform distribution across the
    image.


    ![](img/c1925febd7dde400183c23c14d668ef0_165_0.png)


    Figure 5. TIPA process using conductive textile images.'
