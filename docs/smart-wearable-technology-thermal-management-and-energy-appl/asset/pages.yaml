  md: '# Improving Human Activity Recognition Through 1D-ResNet: A Wearable Wristband
    for 14 Workout Movements


    Sang-Un Kim 1 and Joo-Yong Kim 2,*


    +   1 Department of Smart Wearable Engineering, Soongsil University, Seoul 06978,
    Republic of Korea; tkddns10723@naver.com

    +   2 Department of Materials Science and Engineering, Soongsil University, Seoul
    06978, Republic of Korea

    +   * Correspondence: jykim@ssu.ac.kr; Tel.: +82-10-8720-0631


    Abstract: This study presents a 1D Residual Network(ResNet)-based algorithm for
    human activity recognition (HAR) focused on classifying 14 different workouts,
    which represent key exercises commonly performed in fitness training, using wearable
    inertial measurement unit (IMU) sensors. Unlike traditional 1D Convolutional neural
    network (CNN) models, the proposed 1D ResNet incorporates residual blocks to prevent
    gradient vanishing and exploding problems, allowing for deeper networks with improved
    performance. The IMU sensor, placed on the wrist, provided Z-axis acceleration
    data, which were used to train the model. A total of 901 data samples were collected
    from five participants, with 600 used for training and 301 for testing. The model
    achieved a recognition accuracy of 97.09%, surpassing the 89.03% of a 1D CNN without
    residual blocks and the 92% of a cascaded 1D CNN from previous research. These
    results indicate that the 1D ResNet model is highly effective in recognizing a
    wide range of workouts. The findings suggest that wearable devices can autonomously
    classify human activities and provide personalized training recommendations, paving
    the way for AI-driven personal training systems.


    Keywords: 1D ResNet; neural network; artificial intelligence; human activity recognition;
    wearable healthcare


    # 1. Introduction


    In recent years, human activity recognition (HAR) using wearable sensors has gained
    considerable attention in the wearable technology field. HAR, which involves classifying
    and recognizing human movements and behaviors, is being explored in a wide range
    of applications, including virtual reality (VR) [1–4], sports [5–7], healthcare
    [8], robotics [9–11], and entertainment [12,13]. In these areas, various types
    of sensors are utilized to track or monitor movements. Broadly, these can be categorized
    into vision-based sensors and wearable sensors. Vision-based sensors, such as
    Microsoft’s Kinect [14,15], radar [16,17], and optical devices like cameras, track
    movements externally by employing image processing or signal analysis techniques.
    In contrast, wearable sensors measure actual movements through data such as joint
    angles, acceleration, and gyroscopic information, often utilizing sensor fusion
    methods to provide more accurate motion tracking [18–20].


    Vision-based sensors are capable of tracking human movement without limitations
