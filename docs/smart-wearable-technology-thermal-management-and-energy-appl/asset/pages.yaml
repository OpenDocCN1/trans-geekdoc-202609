    # 4.2. Moisture Management Clothing


    The effectiveness of thermoregulatory clothing is limited in hot and humid environments
    because less moisture is transferred to the pairs within the garment, with the
    attendant risk of sweating and condensation within the thermoregulatory clothing.
    Wang and Hu [87] showed that the average thermal sensation in humans under hot
    conditions was related to the sensation of sweating. Keeping the skin and microclimate
    air dry can be achieved by using solid desiccant packs. Solid desiccants such
    as silica gel can reduce the moisture content of the microclimate air between
    the fabric layers within the cooling undershirt through an adsorption process.
    However, the released adsorbed heat can increase the temperature of the microclimate
    air if the thermoregulation suit is not sufficient to absorb the heat generated
    by the desiccant and lost from the human torso [88]. It is of interest to determine
    whether a thermoregulation device in combination with a desiccant pack would improve
    the cooling performance of the undershirt.


    The purpose of the PCM composite desiccant packs proposed by Mariam Itani et al.
    [89] was to provide cooling to the human body working in hot conditions and to
    adsorb water vapor in the microclimate air, thus increasing the evaporation of
    sweat from the skin layer and improving the cooling of the human body. Experimental
    modeling and validation were conducted to find the state of the microclimate air
    and its moisture content under the influence of using PCM desiccant packs. The
    idea was to use a solid desiccant in addition to the PCM package to keep the skin
    and the macroclimate air layer dry to prevent condensation and enhance sweat evaporation
    from the skin, as in Figure 12a [89]. A wearable cooling and dehumidification
    system was designed by Lou et al., as shown in Figure 12b [72]. A lightweight
    air-ventilated undershirt was worn underneath a protective suit, and an air cooling
    and moisture-removal (ACMR) chamber was attached to the lower back area of the
    knitted undershirt. In a simulated hospital environment, the optimal cooling effect
    corresponded to a 3.5 °C drop in ambient temperature and a 6% reduction in relative
    humidity. The properties of sweat-expulsion clothing and desiccant-adsorption
    wearable clothing are demonstrated in Table 5. Specific properties may vary depending
    on product design and material selection. When selecting an appropriate moisture
    management garment, it is recommended that a comprehensive evaluation be performed
    based on individual needs and environmental conditions.'
