    # 3.2. Solar Energy


    Solar energy is the primary source of energy on Earth; thus, harvesting is a natural
    approach. Different photovoltaic (PV) materials are able to convert the photons
    of sunlight into electrical energy using the photovoltaic effect [58]. The photovoltaic
    conversion efficiency can be calculated as \(\eta = P_{out} / P_{in}\), with the
    output electrical power \(P_{out}\) and the input solar radiation power \(P_{in}\)
    [58]. While conventional PV systems are rigid, nowadays flexible PV cells can
    also be produced, e.g., based on dye-sensitized solar cells (DSSCs) [59,60].


    To produce photovoltaic textiles, usually flexible, organic PV films are mounted
    on a fabric, or textile fibres/yarns or textile layers are prepared to have photovoltaic
    properties [60,61]. Typical efficiencies of such textile-based solar cells are
    around 1% for optimum production methods, dyes—in the case of DSSCs—and conductivities
    of the electrodes [62–64] but can be much smaller if non-toxic materials are used
    for a planned application near the human body [65–67]. Assuming a conversion efficiency
    of 1% and a perfect orientation of the textile towards the sun, the average solar
    radiation flux density of approx. 165 W/m² [68] would enable energy harvesting
    of 16.5 W/m² with textile-based solar cells.


    Generally, such textile-based solar cells are problematic to tailor, which is
    only scarcely addressed [69]. Wash is even more complicated and necessitates encapsulation,
    e.g., by lamination and thus modifying the original textile haptics, or by using
    very small, encapsulated modules, which only slightly increase the bending rigidity
    of a textile fabric [70–72]. However, these challenges, combined with the well-known
    problem that efficiencies are reduced for larger cells [73], typically reduce
    the aforementioned optimum solar energy harvesting.'
