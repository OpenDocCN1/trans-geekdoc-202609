    # 4.5. Limitations and Applications


    The theoretical model of fabric thermal resistance is not a perfect simulation
    of the real fabric structure due to the inherent complexity of the fabric itself.
    When the filling material in the fabric is only water or air, the thermal resistance
    of the fabric is composed of only two components: fiber thermal resistance and
    filling material thermal resistance, with the total fabric thermal resistance
    being the sum of the two. When the wetting is incomplete, the distribution of
    water and air inside the fabric becomes more complex. Water, which possesses surface
    tension and viscosity compared with air [32], has a more complicated contact situation
    with the fibers, and the number and position of the contact points have an impact
    on the overall thermal resistance of the fabric. This is difficult to measure
    or calculate; instruments can only measure the average thermal resistance of the
    fabric. As a part that is favorable for heat transfer is added to the filling
    material, the overall thermal resistance of the fabric decreases. However, as
    the proportion of one component continues to increase, the rate of change of the
    overall thermal resistance with respect to that component also increases, reflecting
    the heat conduction ability of that component [33]. In summary, the thermal resistance
    with respect to changes in water content cannot ignore the influence of the various
    components in the filling material. Such situations are difficult to predict and
    can only be derived from empirical models. The modified Model 5 can be used to
    approximate the thermal resistance of fabrics in the wet state and is a good alternative
    empirical model.


    # 5. Conclusions


    The thermal resistance of ten typical fabrics at different moisture levels was
    measured in study to observe the changes in thermal resistance of woven fabrics
    as they are gradually humidified. The study found that as the humidity of the
    fabric increased, the thermal parameters including thermal resistance and thermal
    insulation rate deteriorated. The thermal resistance and thermal insulation rate
    of completely wetted fabrics were only 22.2% and 23.4% of that in the ultradry
    state. Based on Mangat et al.’s model, a model was selected and improved to predict
    the thermal resistance of woven fabrics at different moisture levels. After replacing
    the moisture content with water content saturation, the thermal resistance prediction
    model showed a more accurate prediction ability. The modified model had a significant
    improvement compared with the original model, as demonstrated by the correlation
    coefficient (R^2) test. The improved Model 5 fills the gap in predicting the thermal
    resistance of woven fabrics in a wet state. These results indicate that the modified
    Model 5 can be used to predict the thermal resistance of various types of woven
    fabrics under different moisture levels. This method provides an effective reference
    for quantifying the impact of moisture on the thermal resistance of woven fabrics
    and provides a theoretical basis for evaluating the thermal and moisture comfort
    of fabrics. Future research will consider using physiological saline to humidify
    fabrics to predict the thermal resistance of fabrics after being humidified by
    human sweat and to test other types of mathematical models using this method.


