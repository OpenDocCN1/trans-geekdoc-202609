- pgno: 128
  md: 'five levels of coolness using fuzzy comprehensive evaluation and subjectively
    classified using participant evaluations. The results are as follows:


    +   (1) The five levels of coolness classification provided by the fuzzy comprehensive
    evaluation method can give specific level indicators. For example, fabrics with
    a coolness level of A have a thermal absorption coefficient lower than 100 Ws¹/²/(m²·°C)
    and the coolness upon contact with the fabric is defined as none. Fabrics with
    a coolness level of B have a thermal absorption coefficient of 100–200 Ws¹/²/(m²·°C)
    and the coolness upon contact with the fabric is defined as general. Fabrics with
    a coolness level of C have a thermal absorption coefficient of 200–300 Ws¹/²/(m²·°C)
    and the coolness upon contact with the fabric is defined as slight. Fabrics with
    a coolness level of D have a thermal absorption coefficient of 300–340 Ws¹/²/(m²·°C)
    and the coolness upon contact with the fabric is defined as obvious. Fabrics with
    a coolness level of E have a thermal absorption coefficient greater than 340 Ws¹/²/(m²·°C)
    and the coolness upon contact with the fabric is defined as strong.


    +   (2) Analysis of the consistency between the subjective and objective coolness
    levels of the fabrics indicates that using the thermal absorption coefficient
    as the objective evaluation index for perceived coolness is reliable. A comprehensive
    evaluation of fabric coolness based on both subjective and objective aspects can
    accurately reflect the real perception of the fabric when in contact with the
    skin. This can provide reliable data support for consumers when purchasing related
    products in the future and can also serve as a reference for developing fabric
    coolness level standards.


    +   (3) The thermal absorption coefficient of the fabric made of 100% cotton under
    wet conditions is high, ranging from 112.72 to 455.97 Ws¹/²/(m²·°C), while the
    thermal absorption coefficient of the blended fabric made of 98% polyester + 2%
    elastane under wet conditions is low, ranging from 85.89 to 331.11 Ws¹/²/(m²·°C).
    This is because the fabric made of 100% cotton has more water absorption than
    the 98% polyester + 2% elastane blend fabric, resulting in stronger contact coolness.


    +   (4) The established random forest regression model can effectively predict
    the coolness of fabrics at different water content levels. The evaluation indicators
    for the training set prediction results show that the R² is 0.872 and the RMSE
    is 0.305, indicating that the model has good predictive performance.


    +   (5) Water content is the most important factor affecting the coolness of fabrics.
    As the water content of the fabric increases, the coolness of the fabric continuously
    improves. However, the corresponding humidity of the fabric also increases, potentially
    causing discomfort to the wearer. Therefore, when choosing summer clothing, it
    is important to consider fabric coolness upon contact under humid conditions and
    try to avoid the decrease in clothing comfort due to sweat-soaking.


