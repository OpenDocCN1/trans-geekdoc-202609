    # 2.4.3. Wearing Trial


    Post-experimental assessments of wearing comfort were conducted using a seven-point
    Likert scale, ranging from −3 (very unsatisfied) to 3 (very satisfied) (Figure
    5a). The assessed criteria included ease of wearing, ease of removal, fit, flexibility,
    and safety. Additionally, evaluations of body movement comfort were carried out
    in the same climatic chamber. Participants, dressed in identical clothing, simulated
    six distinct postures: transitioning from standing to sitting, sitting to standing,
    walking, bending forward and then straightening up, squatting and then standing
    upright, and twisting (refer to Figure 6). After each posture, participants provided
    subjective ratings of their comfort and freedom of movement using a seven-point
    scale, ranging from −3 (very uncomfortable) to 3 (very comfortable) (Figure 5b).


