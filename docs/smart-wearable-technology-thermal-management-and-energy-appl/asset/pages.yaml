    # 4.4. Relationship between the Theoretical Models and Test Results


    Exploring the composition of the fabric thermal resistance and the effect of moisture
    on fabric thermal resistance, we explain the changes in thermal resistance observed
    in our experiments based on a theoretical model. As shown in Figure 4, the prediction
    curve of Model 5 more clearly illustrates the rate at which fabric thermal resistance
    deteriorates after absorbing moisture. According to the trend of Model 5’s curve,
    we found that as the fabric’s water saturation level increases, its thermal resistance
    significantly decreases. Moreover, we observed that the thermal resistance curve
    changes significantly around a water saturation level of 20%. Therefore, the fabric
    moisture absorption can be roughly divided into two processes: the initial stage
    of moisture absorption when the water saturation level is between 0–20% and the
    later stage of moisture absorption when the water saturation level is above 20%.
    The initial stage is characterized by a rapid decline in thermal resistance, with
    a decrease of approximately 51.92% to 64.28% compared with the ultradry state.
    The later stage is characterized by a slow decline in thermal resistance, with
    a decrease of only approximately 23.08% to 27.14% compared with the ultradry state.


    According to the thermal resistance composition analysis of Model 5, the air thermal
    resistance and water thermal resistance are parallel components, whereas the fiber
    thermal resistance is a series component. The primary factor that affects fabric
    thermal resistance is the composition of the filler in the fabric’s void spaces.
    The reason for the abrupt decline in the first half of the thermal resistance
    curve during the initial stage of moisture absorption is that the air content
    in the fabric’s void spaces gradually decreases, whereas the water content gradually
    increases. Therefore, the factors that determine the amount of void space in the
    fabric, such as fabric thickness and porosity, become critical in affecting the
    thermal resistance of the wet fabric. When humidity changes, the fiber thermal
    resistance in the fabric’s total thermal resistance does not change, but the composition
    of air thermal resistance and water thermal resistance does change. Therefore,
    the fiber’s ability to adsorb water is also an important factor affecting the
    change in thermal resistance of wet fabrics. When the fiber becomes wet, its physical
    and chemical properties change, leading to significant microscopic effects on
    the system’s internal energy, which manifests as a significant change in thermal
    conductivity. When a small amount of water enters into the fabric, it first forms
    strong hydrogen bonds with hydrophilic fibers and then penetrates into the microporous
    structure of the porous fibers [31]. With an increase in moisture content, the
    water gradually fills the large pores formed by the fabric’s tissue, forming numerous
    water columns that provide many transmission channels to accelerate heat transfer.
    After filling the void spaces of the fabric with water, excess water will accumulate
    on the fabric’s surface due to its adsorption effect, resulting in a slow decline
    in the fabric’s thermal resistance.'
