- pgno: 52
  md: 'where the authors mention the problems of transferring improvements of single
    thermal properties, such as thermal conductivity, towards the real warming effect
    for the human body and mention the necessity to perform manikin tests in simulated
    or real environments as well as opinion polls. Shuvo et al. also discuss the influence
    of characterization methods of Joule heating efficiency and boundary conditions
    in detail [153]. Comparing the heating efficiency of different textiles with air
    flow to maintain a temperature of approx. 42 °C, they found necessary power densities
    around 230–950 W/m², which are all values far above the values estimated for the
    power density of typical textile energy harvesting and storage methods.


    One of the few studies on human probands was reported by Song et al., who measured
    the skin temperature on the feet inside a conventional and a heated sleeping bag
    on each of seven male and female volunteers [154]. The heating pads from carbon
    heating wires between two high-density polyester layers of area (38 cm²) could
    be heated by 0–45 W, where 20 W was mostly regarded as thermo-neutral. The tests
    were performed in a climate chamber with air temperature −0.4 °C (for female volunteers)
    and −6.4 °C (for male volunteers), respectively, at an air velocity of (0.5 ±
    0.1) m/s and a relative humidity of (80 ± 5)%. In all cases, a strong difference
    was visible for the measured temperature of the fourth toe and the left foot during
    3 h of measuring, starting from approx. 24 °C (toe temperature) and nearly 30
    °C (left toe) and decreasing strongly in the toe and also visibly in the foot
    for the conventional (unheated) sleeping bag, while the temperature slightly increased
    up to an approximately constant value for the heated sleeping bag, as depicted
    in Figure 15 [154]. Comparing the here-used heating power of 20 W with the aforementioned
    order of magnitude of 10 Wh/m² that could be harvested during half a day, however,
    shows that with an assumed garment surface of 2 m², only 1 h of using the heating
    pads would be possible. On the other hand, Figure 15 clearly shows that a smaller
    heating power would be sufficient to maintain a stable temperature of the feet.


    ![](img/c1925febd7dde400183c23c14d668ef0_52_0.png)


    Figure 15. Evolution curves of the 4th toe and the left foot temperatures for
