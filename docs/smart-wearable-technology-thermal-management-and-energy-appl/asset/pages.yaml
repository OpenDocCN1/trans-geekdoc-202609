  md: "# Textiles for Very Cold Environments\n\nTomasz Blachowicz 1,* , Maciej Malczyk\
    \ 1 , Ilda Kola 2 , Guido Ehrmann 3 , Eva Schwenzfeier-Hellkamp 4 \nand Andrea\
    \ Ehrmann 4\n\n+   1 Institute of Physics—Center for Science and Education, Silesian\
    \ University of Technology,\n+   44-100 Gliwice, Poland\n+   2 Department of Textile\
    \ and Fashion, Polytechnic University of Tirana, 1019 Tirana, Albania; ikola@fim.edu.al\n\
    +   3 Virtual Institute of Applied Research on Advanced Materials (VIARAM)\n+\
    \   4 Institute of Technical Energy Systems (ITES), Bielefeld University of Applied\
    \ Sciences and Arts,\n+   33619 Bielefeld, Germany; eva.schwenzfeier-hellkamp@hsbi.de\
    \ (E.S.-H.); andrea.ehrmann@hsbi.de (A.E.)\n+   * Correspondence: tomasz.blachowicz@polsl.pl\n\
    \nAbstract: Textiles are often used to protect people from cold environments.\
    \ While most garments are designed for temperatures not far below 0 °C, very cold\
    \ regions on the earth near the poles or on mountains necessitate special clothing.\
    \ The same is true for homeless people who have few possibilities to warm up or\
    \ workers in cooling chambers and other cold environments. Passive insulating\
    \ clothing, however, can only retain body heat. Active heating, on the other hand,\
    \ necessitates energy, e.g., by batteries, which are usually relatively heavy\
    \ and have to be recharged regularly. This review gives an overview of energy-self-sufficient\
    \ textile solutions for cold environments, including energy harvesting by textile-based\
    \ or textile-integrated solar cells; piezoelectric sensors in shoes and other\
    \ possibilities; energy storage in supercapacitors or batteries; and heating by\
    \ electric energy or phase-change materials.\n\nKeywords: personal protective\
    \ equipment; energy harvesting; energy storage; heating; flexible solar cells;\
    \ temperature sensors\n\n# 1. Introduction\n\nKeeping people warm in a cold environment\
    \ is one of the main purposes of clothes. While thousands of years ago, natural\
    \ fibers from animals and plants, as well as fur parts, were woven into warming\
    \ garments [1], nowadays, chemical fibers are being investigated more and more\
    \ regarding their applicability in warming clothes [2–4]. Besides passive warming\
    \ by reflecting thermal radiation back towards the human body [5,6], creating\
    \ air layers as insulation to reduce heat convection [7,8] or increasing the ratio\
    \ of absorbed thermal radiation from the sun [9,10], there are nowadays many attempts\
    \ to provide active heating.\n\nAmongst the physical effects that can be used\
    \ for heating up garments, there are phase-change materials (PCMs) [11–13], as\
    \ well as different possibilities for converting electric energy into heat [14–16].\
    \ While the first are energy-self-sufficient, they have the disadvantage that\
    \ they can only work in a material-dependent temperature range and cannot be controlled\
    \ by the user. Electric heating of garments, also called Joule heating [17], on\
    \ the other hand, needs the possibility of storing electric energy in batteries\
    \ or supercapacitors to make it available when it is needed and ideally to harvest\
    \ energy by the garment to make it independent from external power supplies.\n\
    \nThis review gives an overview of recent research regarding energy-self-sufficient\
    \ textiles for active heating to protect people from very cold environments, such\
    \ as workers in cold storage houses, astronauts, people living near the poles\
    \ or homeless people. The next sections review different possibilities for actively\
    \ heating textiles by PCMs or electrically to harvest and store energy in textiles,\
    \ and then the main part discusses recent research on energy-self-sufficient heating\
    \ textiles and their potential applications.\n\nCitation: Blachowicz, T.; Malczyk,\
    \ M.; Kola, I.; Ehrmann, G.; Schwenzfeier-Hellkamp, E.; Ehrmann, A. Textiles for\
    \ Very Cold Environments. Processes 2024, 12, 927. https://doi.org/10.3390/pr12050927\n\
    \nAcademic Editors: Zhanxiao Kang and Qing Chen\n\nReceived: 11 April 2024\nRevised:\
    \ 28 April 2024\nAccepted: 29 April 2024\nPublished: 1 May 2024\n\nCopyright:\
    \ © 2024 by the authors. Licensee MDPI, Basel, Switzerland. This article is an\
    \ open access article distributed under the terms and conditions of the Creative\
    \ Commons Attribution (CC BY) license (https:// creativecommons.org/licenses/by/\
    \ 4.0/)."
