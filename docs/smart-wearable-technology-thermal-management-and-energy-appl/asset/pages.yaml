    # 1. Introduction


    As the “second skin” of the human body, clothing is the most important barrier
    for maintaining thermal stability [1]. Clothing should help maintain the body’s
    thermal and moisture balance, enabling the body to be in a state of psychological,
    physiological, and sensory comfort during long periods of work and activity. When
    factors such as sweating, rainwater, and accidental immersion cause clothing to
    become wet, both the thermal resistance and moisture resistance of the clothing
    will change, affecting its comfort. Fabric thermal resistance is influenced by
    factors such as the fabric structure, density, humidity, and surface treatment
    and is closely related to fabric thickness, yarn density, fabric surface friction
    coefficient, and fabric type [2–4]. In wet conditions, the moisture absorption
    and release of the fabric will cause a constant change in the proportion of water
    and air in the fabric, and the thermal resistance of the wet fabric will also
    dynamically change [5]. The three key factors affecting fabric moisture absorption
    are thickness, porosity, and fiber type, and thicker and higher-porosity fabrics
    can absorb more water, with natural fibers having greater moisture absorption
    than synthetic fibers. In wet conditions, due to the participation of water, the
    structure and composition of the fabric will undergo small changes, making the
    thermal performance of clothing more complex than in dry conditions.

    There have been numerous studies on fabric thermal resistance in wet conditions
    worldwide. Hes et al. [6] tested the thermal resistance of fabrics per unit thickness
    in dry and wet conditions, and the results showed that the thermal resistance
    of fabrics in wet conditions was significantly lower than in dry conditions. Oğlakcıoğlu
    et al. [7] tested the'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'thermal resistance of 10 kinds of knitted pure cotton fabrics in wet conditions;
    the conclusion was that increasing the moisture content of the fabric significantly
    increased its heat transfer capability. Wang et al. [8] tested the thermal resistance
    of seven different thicknesses of cotton and polyester fabrics in fully saturated
    conditions, confirming that fabric thickness and fiber material have a significant
    impact on thermal resistance. Akckgun et al. [9] tested the thermal resistance
    changes in wool and wool/polyester blend fabrics at different levels of moisture,
    and the results showed that fabric porosity also has a significant impact on thermal
    resistance. Yang et al. [10] tested the thermal resistance of three typical clothing
    items in saturated conditions and found that the thermal insulation performance
    was significantly reduced compared with dry conditions. Therefore, the fundamental
    factors affecting fabric thermal resistance in wet conditions are fabric fiber
    type, the water in the fabric, and the distribution of water in the fabric. Establishing
    a theoretical model for the thermal resistance of wet fabrics based on fabric
    composition and structure is scientifically significant for analyzing complex
    wet thermal resistance.


    In the past few decades, many researchers have studied the prediction of thermal
    resistance models for fabrics, both theoretically and experimentally. Nake et
    al. [11] were the first to propose a three-parameter theoretical model of air,
    water, and fiber polymers, including series, parallel, and combined usage, some
    of which could be used for thermal resistance prediction; however, these models
    were very complex and limited to the dry state. Hes [12] assumed that the thermal
    resistance of the fabric was parallel to the thermal resistance of water in his
    proposed thermal resistance model, which had higher predictability. Mangat et
    al. [3] proposed a theoretical model for the combination of series and parallel
    air, water, and fiber polymer thermal resistance under wet conditions. They tested
    the thermal resistance of cotton knitted fabrics at different moisture levels,
    and the results showed that two sets of models had the best consistency with experimental
    data. In addition, the experimental conclusion also suggested that the model may
    be applicable to other types of fabrics; this conclusion needs to be verified
    by subsequent experiments. In addition to the above thermal resistance models,
    the literature also mentions six thermal resistance models [13]. Through the comparison
    of experimental data and models, it is believed that these models have poor correlation
    with the thermal resistance of wet fabrics. Although individual thermal resistance
    models involve the influence of moisture, they do not consider the dynamic thermal
    resistance changes of fabrics due to moisture increase. In summary, previous studies
    mostly involved the prediction of thermal resistance of knitted fabrics, lacking
    the prediction of the thermal resistance of woven fabrics as a large category.
    In order to more comprehensively analyze the thermal resistance changes in various
    types of fabrics under wet conditions, this study refers to national standards
    to test the thermal resistance values at each moisture level and analyzes the
    effect of fabric humidity on thermal resistance by studying the thermal resistance
    changes in different fabrics after wetting. Based on the test results, the theoretical
    model of fabric thermal resistance is modified and verified more accurately.


    # 2. Thermal Resistance Theoretical Model


    Fabric is typically composed of fiber polymers, stagnant air within the fabric,
    and absorbed water molecules [3]. The material that provides warmth is primarily
    the stagnant air, and the main role of the fiber polymers is to provide storage
    space for this air. Under natural conditions, the water content in fabrics is
    minimal and mainly achieved through the binding of hydrophilic groups within the
    fiber polymers to water vapor in the air or in the form of adsorption onto the
    fabric surface. The thermal resistance of fabrics is a critical parameter for
    measuring their ability to insulate heat transfer, is an important indicator of
    fabric thermal comfort, and primarily dependent on fabric thickness and thermal
    conductivity [14,15] (see Equation (1)).


    ```

    $R_t = \frac{h}{\lambda}$ (1)

    ```'
