    ![](img/c1925febd7dde400183c23c14d668ef0_50_0.png)


    Figure 13. Temperature gradation curves of knitted wool–PA fabric with and without
    PEG1000-filled PP fibers. Reprinted from [136], originally published under a CC-BY
    license.


    For the aforementioned microencapsulated PCMs with PU binder, heating durations
    of up to 15 min were reported in different studies [137,138]. Similarly, Ying
    et al. found the temperature changes between a non-PCM fabric and PCM fabrics
    with different PCM levels between 20 and 120 g/m², upon heating from 23 °C to
    35 °C, vanished after less than 10 min [139]. Similar durations were found for
    a PCM-based cooling vest using Glauber’s salt or pure gallium as the PCM in a
    heated chamber at 30–32 °C, starting from 22 to 25 °C [140].


    Ghali et al. simulated the effect of a PCM textile upon a sudden change in the
    environmental temperature and found a heating effect for approx. 12.5 min, depending
    on the cold outdoor conditions, as well as a decrease of the clothed-body heat
    loss by 40–55 W/m² for a one-layer garment [141]. Besides oscillating temperatures,
    they also tested steady-state environmental conditions and stated clearly that
    the PCM did not influence the thermal resistance in this scenario.


    Comparing the aforementioned and several studies from the recent literature leads
    to the conclusion that, as discussed at the beginning of this section, PCM textiles
    are not suitable for long-term use at the moment but are supportive in oscillating
    temperatures. In addition, while only a few studies have investigated the long-term
    thermal performance of PCMs, the thermal characteristics of several materials
    were found to be unstable. Behzadi and Farid reported that Rubitherm 21, a paraffin
    mixture, significantly changed the peak melting point and the latent heat of fusion,
    while mixed esters showed nearly no such change [142]. For PCM heat storage as
    part of a solar combi system in a house, Johansen et al. tested sodium acetate
    trihydrate and found it to work properly during half a year of testing, with heating
    it up to 80 °C 53 times by the solar collectors [143]. For the numerical investigation
    of a solar greenhouse, Chen and Zhou differentiated between short- and long-term
    PCM storage, where an organic PCM was responsible for short-term energy storage
    and release during the night while no longer working in the early morning, when
    a mixture of salt hydrates with different melting temperatures could provide the
    additional long-term heating [144]. In this study, the potential change in organic
    and inorganic PCMs with longer use times was not investigated. Long-term stability
    was, however, found for TiO₂/tetradecanoic acid-based composite PCMs [145] or
    LiNO₃/KCl-expanded graphite (EG) composite PCMs [146]. Especially for textile
    fabrics, long-term stability was found for microcapsules loaded with n-docosane
    as the PCM [147].'
