    ```

    Level A : \(V_1(u_i) = \begin{cases} 1, & u_i < x_1 \\ \frac{1}{2} \left( 1 +
    \frac{u_i - x_1}{x_2 - x_1} \right), & x_1 < u_i < x_2 \\ 0, & u_i > x_2 \end{cases}\)
