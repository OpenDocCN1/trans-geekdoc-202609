    # 5. Conclusions


    The COP, injection mass flow ratio and VHC of the FTVC are higher than those of
    the SVIC-0, SVIC-5, SVIC-10 and SVIC-20 under the same working conditions, while
    the discharge temperature of the FTVC is approximately equal to the SVIC-0 but
    lower than the SVIC-5, SVIC-10 and SVIC-20. When the compressor suction superheat
    degree is low and the compressor isentropic efficiency is high, wet compression
    may happen for the FTVC system and the SVIC-0 system, which would lower the performance
    and even be harmful to the running safety of the HTHP system. Therefore, enough
    compressor suction superheat degree should be designed to avoid wet compression
    in the compressor. The COP of the SVIC heat pump system decreases as the injection
    superheat degree increases. The isentropic efficiency of the compressor, the evaporation
    and condensation temperatures have greater effects on the COP than the suction
    superheat degree and subcooling degree. Therefore, to achieve a higher COP, the
    isentropic efficiency of the compressor and the evaporation temperature should
    be increased, and the condensation temperature should be decreased. When the evaporation
    temperature, the condensation temperature and injection pressure are 55 °C, 125
    °C and 921.4 kPa, the system COPs corresponding to the FTVC, SVIC-0, SVIC-5, SVIC-10,
    and SVIC-20 are 4.49, 4.19, 4.16, 4.14 and 4.09, respectively.


