    # 3.2. Model Establishment


    Thermodynamics models of high-temperature heat pumps with flash tank vapor injection
    and sub-cooler vapor injection are established based on the energy conservation
    equation and the mass conservation equation.


    In the condenser, heat transfers from the working fluid to the heat sink and the
    enthalpy of the working fluid decreases while the pressure loss is slight. So,
    the condensation process can be considered as heat release process with constant
    pressure. Condensation heat can be calculated as Equation (1) with the product
    of working fluid mass flow rate and the inlet and outlet condenser enthalpy difference.


    ```

    \( Q_{cond} = (1 + A) \times \dot{m}_{ref} \times (h_{cond,in} - h_{cond,out})
    \) (1)

    ```


    The expansion valve throttling process is considered as the isenthalpic process,
    so


    ```

    \( h_{th,in} = h_{th,out} \) (2)

    ```


    For the SCVI heat pump system, heat transfer takes place in the sub-cooler, so


    ```

    \( \dot{m}_{ref} \times (h_6 - h_9) = \dot{m}_{ref} \times A \times (h_3 - h_8)
    \) (3)

    ```


    For the flash tank in the FTVI heat pump system


    ```

    \( \dot{m}_{ref} \times (1 + A) \times h_6 = \dot{m}_{ref} \times h_7 + \dot{m}_{ref}
    \times A \times h_3 \) (4)

    ```


    In the evaporators of the two heat pump systems, evaporation heat can be calculated
    as Equation (5) with the product of working fluid mass flow rate and the inlet
    and outlet evaporator enthalpy difference:


    ```

    \( Q_{evap} = \dot{m}_{ref} \times (h_{evap,out} - h_{evap,in}) \) (5)

    ```


    In compression processes of the two cycles, processes 1–2 and 2′–4 are the adiabatic
    compression process, and process 3–2 can be treated as the mixing process with
    a constant pressure, so


    ```

    \( h_2 = (h_{2s} - h_1) / \eta_{is} + h_1 \) (6)

    ```


    ```

    \( h_4 = (h_{4s} - h_{2''}) / \eta_{is} + h_{2''} \) (7)

    ```


    ```

    \( \dot{m}_{ref} \times (1 + A) \times h_{2''} = \dot{m}_{ref} \times h_2 + \dot{m}_{ref}
    \times A \times h_3 \) (8)

    ```


    ```

    \( W_{c1} = \dot{m}_{ref}(h_2 - h_1) \) (9)

    ```


    ```

    \( W_{c2} = \dot{m}_{ref} \times (1 + A) \times (h_4 - h_{2''}) \) (10)

    ```'
