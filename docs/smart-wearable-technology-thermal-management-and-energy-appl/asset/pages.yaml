    # 1. Introduction


    To cope with global climate change and carbon emission reduction, electricity-based
    and low-carbon alternatives are a global development trend in the heating sector.
    Industrial process heating is an important direction for the development of electricity-based
    alternatives in the future. According to the report of the International Energy
    Agency, global carbon dioxide emissions were 33.267 billion tons in 2019, of which
    the industrial sector accounted for about 40% of carbon dioxide emissions in energy
    consumption [1]. In Europe, 20% of total greenhouse gas emissions are currently
    from industrial processes. The heat pump is an important piece of equipment used
    to realize efficient industrial electrification to reduce greenhouse gas emissions.


    The heat pump is an energy-saving and environmentally friendly technology. It
    extracts low temperature heat from a heat source by refrigerant state change and
    then transfers the high-temperature heat to a heat sink. During the heat transfer
    process, high grade energy (electric power or high-temperature heat) must be input
    to the heat pump. Normally, the heat transferred to a heat sink is several times
    greater than the electric power required to input the heat pump. Therefore, compared
    to conventional heating technologies such as boilers or electric heaters, heat
    the pump is far more efficient. However, the low output temperature of the traditional
    heat pump is insufficient at meeting the temperature'
  merge: -1
  img_proc: true
- pgno: 188
  md: 'requirements for heating in industrial processes, which limits the application
    of the heat pump in the industrial sector [2,3].


    Refrigerant injection is a technique that uses some condensed refrigerant from
    the condenser outlet to inject to the compressor suction line, the sealed compressor
    pocket, or the condenser inlet in a vapor compression heat pump system. Refrigerant
    injection techniques can be used to lower the temperature of an electric motor,
    the compressor discharge temperature, reduce the compressor power consumption,
    and improve the cooling/heating capacity. Liquid refrigerant injection and vapor
    refrigerant injection are the two main types of refrigerant injection. Vapor refrigerant
    injection techniques have been widely used in the refrigeration system to improve
    the refrigeration system COP. The earliest vapor refrigerant injection technique
    was applied in cold storage, freezing engineering. When the heat pump system was
    applied in a cold region, the high compression pressure ratio would lead to a
    considerably high discharge temperature and low COP. So, the vapor refrigerant
    injection technique is also widely used in heat pump systems applied in cold regions.
    Xue et al. experimentally analyzed the refrigerant vapor-injection air source
    heat pump system with R32 used as the working fluid. The results showed that the
    injection ratio, heating capacity and compressor power consumption of the system
    increased with the increase in intermediate pressure, while the discharge temperature
    decreased. The heating COP decreased with the increase in intermediate pressure
    when the ambient temperature was higher than −5 °C. But when the ambient temperature
    was below −5 °C, the COP first increased and then decreased with the increase
    in intermediate pressure [4]. Roh et al. found that the advantage of the refrigerant
    vapor-injection technique under the condition of a small pressure ratio was not
    significant [5,6]. Zhang et al. established the refrigerant vapor-injection air
    source heat pump system in Lanzhou, China. The experimental results showed that
    the energy efficiency of the refrigerant vapor-injection air source heat pump
    system increased by 4~6% compared with that of the air source heat pump system
    without refrigerant vapor-injection [7]. Heo et al. investigated the influence
    of the refrigerant vapor-injection on the performance of the two-stage heat pump
    system. The results showed that under the ambient temperature of −25 °C, the COP
    and heat capacity increased by 10% and 25% compared with the two-stage heat pump
    system without refrigerant vapor-injection [8,9]. Mathison et al. studied the
    influence of the refrigerant vapor-injection technique with multiple injection
    ports on the performance of heat pumps. The results showed that the performance
    of heat pumps improved significantly for air conditioning and refrigeration applications
    when an economized refrigerant was injected at an infinite number of ports to
    maintain saturated vapor in the compressor [10].


    Different types of refrigerant injection show different effects on the heating
    performance of heat pumps. Wang et al. found that two-phase suction, liquid injection
    and two-phase injection could effectively decrease the discharge temperature of
    an R32 scroll compressor used in a heat pump, and the two-phase injection showed
    better performance than the other two methods in cooling capacity and COP [11].
    Qi et al. developed a hybrid vapor injection air-source heat pump cycle with sub-cooler
    and flash tank using R290 as a refrigerant. The simulation results indicated that
    the coefficient of performance and the volumetric heating capacity of the hybrid
    vapor injection cycle could be 2.8~3.3% and 6.4~8.8% higher than those of the
    conventional sub-cooler vapor injection cycle system and 1.1~2.0% and 3.2~6.0%
    higher than those of the flash tank vapor injection cycle system, respectively
    [12]. Kim et al. established a numerical model to compare and analyze the influence
    of liquid, vapor and two-phase injection techniques on the performance of heat
    pumps with a scroll compressor using R410A. Results showed that there was an optimum
    injection quality that made the two-phase injection heat pump exhibit the highest
    COP among all injection types and the two-phase injection heat pump with optimum
    injection quality more effective at improving the COP and reducing the discharge
    temperature when the outdoor temperature decreased [13].


    The high-temperature heat pump needs to solve the problems of low efficiency and
    high discharge temperatures brought about by the large temperature rise, and the
    refriger-'
