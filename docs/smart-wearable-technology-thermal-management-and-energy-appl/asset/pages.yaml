    # 4.5. Performance Comparison under Different Compressor Isentropic Efficiencies


    Isentropic efficiency is widely used in evaluating the performance of compressors,
    and the performance of compressors have great influence on the performance of
    heat pumps. Figure 7 shows the performance comparison of the FTVC and SVIC under
    different compressor isentropic efficiencies. According to Figure 7a, the COPs
    of the FTVC, SVIC-0, SVIC-5, SVIC-10 and SVIC-20 all increase with isentropic
    efficiency. Under the same isentropic efficiency, the COP of the FTVC is higher
    than those of the SVIC-0, SVIC-5, SVIC-10 and SVIC-20. At the evaporation temperature
    of 55 °C, condensation temperature of 125 °C, subcooling degree of 5 °C, compressor
    suction superheat degree of 15 °C and compressor isentropic efficiency of 0.75,
    the COPs of the FTVC, SVIC-0, SVIC-5, SVIC-10 and SVIC-20 are 4.63, 4.32, 4.29,
    4.26 and 4.22, respectively. From Figure 7b, the injection mass flow ratio does
    not change with the increase in compressor isentropic efficiency. At the same
    compressor isentropic efficiency, the FTVC has the largest injection mass flow
    ratio. Figure 7c shows that the VHCs of the FTVC, SVC-0, SVIC-5, SVIC-10 and SVIC-20
    decrease with the compressor isentropic efficiency. Figure 7d shows the comparison
    of the discharge temperature of the FTVC and SVIC under different isentropic efficiencies.
    From the figure, although the high isentropic efficiency will help to improve
    the performance of the system, the state of working fluid in the compressor is
    a two-phase state when the compressor suction superheat degree is small, which
    will form wet compression especially for the FTVC. So, the compressor suction
    superheat degree of the FTVC must remain large enough to prevent wet compression
    when the compressor isentropic efficiency is high. At the evaporation temperature
    of 55 °C, condensation temperature of 125 °C, subcooling degree of 5 °C, compressor
    suction superheat degree of 15 °C and compressor isentropic efficiency of 0.75,
    the discharge temperatures of the FTVC, SVIC-0, SVIC-5, SVIC-10, and SVIC-20 are
    125.6, 125.8, 127.1, 128.2 and 130.3 °C, respectively.'
