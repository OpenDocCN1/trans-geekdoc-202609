- pgno: 27
  md: '# 5.2. Subjective Evaluation Methods


    The subjective evaluation method is a method of measuring the thermal comfort
    of garments which utilizes the psychological thermal comfort feelings of subjects
    in a specific environment for the assessment and is also known as the psychological
    method. As a supplement and validation of the objective evaluation method, the
    steps of this method are to predesign a questionnaire form and allow subjects
    to rate the comfort indicators of the garment according to their personal psychological
    feelings during the garment-wearing experiment. The scales and the meaning of
    subjective votes are shown in Table 7. The determination of the indicators and
    the division of the scoring scale are the key links in the subjective evaluation
    method, which still needs to be further improved.


    # Table 7. Subjective rating scales.


    | Scales | Thermal Sensation | Thermal Comfort | Thermal Satisfaction | Thermal
    Preference | Sweat Feeling | Cold Stimuli Sensation |

    |--------|-------------------|-----------------|----------------------|--------------------|---------------|------------------------|

    | +4 | Very hot | Extremely uncomfortable | Very unsatisfied | | | Very strong
    cold stimuli sensation |

    | +3 | Hot | Very uncomfortable | Unsatisfied | Much warmer | The very strong
    feeling of sweating | Strong cold stimuli sensation |

    | +2 | Warm | Uncomfortable | Slightly unsatisfied | Warmer | The strong feeling
    of sweating | Medium cold stimuli sensation |

    | +1 | Slightly warm | Slightly uncomfortable | Satisfied | A little warmer |
    Slight feeling of sweating | A little cold stimuli sensation |

    | 0 | Neutral | Comfortable | Very satisfied | No change | No feeling of sweating
    | No cold stimuli sensation |

    | −1 | Slightly cool | | | A little cooler | | |

    | −2 | Cool | | | Cooler | | |

    | −3 | Cold | | | Much cooler | | |

    | −4 | Very cold | | | | | |


    The sweating dummy is also a tool for assessing the comfort of garments, effectively
    avoiding moral and physiological factors in human experimentation, and is not
    subject to psychiatric factors. It has a good reproducibility. However, the sweating
    dummy is still a device that simulates the shape and physiological characteristics
    of the human body, and its assessment results do not fully and realistically reflect
    the actual subjective feelings of humans.


    # 5.3. Thermal and Moisture Regulation Model


    The thermal and moisture regulation model is a method for evaluating the thermal
    and humidity comfort of garments, which simulates the processes of human body
    temperature regulation and thermal and moisture transfer of garments by establishing
    a thermal and moisture transfer model. The thermal and moisture regulation model
    has been widely used at home and abroad to evaluate the thermal and humidity comfort
    of clothing, which mainly includes the human body temperature regulation model,
    the thermal and moisture transfer model of clothing, and the human body–clothing–environment
    system model.


    # 5.3.1. Human Thermoregulation Model


    The human thermoregulation model consists of equations describing heat transfer
    and regulatory responses in the body. Over the last half-century, scholars have
    conducted substantial research and developed numerous human thermoregulation models.
    These models differ in the delineation of body nodes, and different methods of
    delineating body nodes correspond to different forms of equations for describing
    the regulatory responses of the body [107,108].'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# (1) The two-node model


    The simplest two-node model, in which the human body is represented by a segment
    with two nodes in the core and skin layers, has gained popularity in engineering
    applications due to its simplicity, ease of implementation in computer tools,
    and faster computation time [109].


    Gagge et al. laid the foundation for a two-node model of the whole body. The model
    was based on a direct, one-dimensional, transient heat transfer from the core
    to the skin layer to the environment. However, the thermoregulatory systems of
    sweating, skin blood flow, and shivering were based on empirical relationships
    developed for the average young adult. The accuracy of empirical models, especially
    the model constants, is closely related to experimental conditions, parameter
    ranges, quality of measurements, and physiological differences in subjects [110].
    Doherty et al. [111] found that the model underpredicted skin wettability by 0.16
    °C, and core temperature by 0.31 °C, but overpredicted skin temperature by 0.48
    °C. At the same time, Ooka et al. [112] found that the model predicted a skin
    temperature 0.75 °C higher and a core temperature 0.32 °C lower. The model deviated
    from the experimental results. In addition to this, Takada et al. [107] found
    that the model underestimated skin temperature by up to 1.8 °C and core temperature
    by up to 0.5 °C, under cold-exposure conditions. Therefore, further improvement
    of the thermoregulatory system of the two-node model is needed, and a corresponding
    improvement scheme should be proposed. The flow diagram of a two-node model of
    the thermoregulatory system is shown in Figure 13 [113]. In this system dynamics
    model, the core and skin nodes of the Gagge model are modeled as two stocks that
    store the body’s energy, which is then converted into the temperatures of two
    nodes, T_skin and T_core.


    ![](img/c1925febd7dde400183c23c14d668ef0_28_0.png)


    Figure 13. Flow diagram of a two-node model of the thermoregulatory system [113].


    To overcome this problem, recent studies have proposed improved two-node models
    to more accurately assess the effects of personal cooling systems. These improvements
    include the consideration of local insulation and heat transfer in clothing, as
    well as modeling the heat exchange characteristics of cooling devices [114].'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# (2) Multinode model


    The multinode body heat model is an extended and more complex version of the two-node
    model, as shown in Figure 14 [115]. Various models have been proposed to predict
    the state of heat regulation in the human body. Perhaps the most influential is
    the 25-node model proposed by Stolwijk [116], consisting of 24 body “nodes” (six
    body segments with four compartments each) and a central blood “node”. Each node
    has a certain amount of metabolic heat generation, convective heat exchange with
    the central blood chamber, and convective heat exchange with neighboring nodes.
    Subsequently, some scholars have also improved this human thermal regulation model
    to make it suitable for application in a wider range of scenarios, such as cold
    environments, space environments, and so on. Researchers have made various enhancements
    to the model to accurately forecast the patterns of local responses in different
    parts of the human body. Munir et al. [117] reassessed the dynamic characteristics
    of the Stolwijk model and examined several modifications to the model.


    ![](img/c1925febd7dde400183c23c14d668ef0_29_0.png)


    Figure 14. Comparison of the model segmentation, and the two-node and multinode
    models [115].


    Multinodal models use partial differential equations to describe the heat transfer
    problem in the human body. The differential equations are usually discretized
    using the finite difference method, finite volume method, or finite element method
    to obtain the linear algebraic equations at each node. The advantage of the multinode
    model is that it can be divided into sections and nodes as needed, has better
    flexibility and accuracy, and can be applied to dynamic, nonstationary environments.
    The disadvantage is that the accuracy is not as good as the multinodal model in
    environments with large temperature gradient changes. The characteristics of the
    specific model can be seen in Table 8.


    Table 8. The characteristic of the specific models [114,118].


    | Model Name | Model Classification | Model Characteristics |

    | :--- | :--- | :--- |

    | Human thermoregulation model | Two-node model Multinode model | When there are
    large temperature differences in the human body, more accurate simulation results
    can be obtained by using multinode and multiunit models. |

    | Heat and moisture transfer modeling of clothing Human | Steady-state model Transient
    model | Simulate the heat and moisture transfer process of garments to derive
    the heat and moisture properties of garments. |

    | body-clothing-environment system model | - | The human body-clothing environment
    as a whole combines a model of human thermoregulation and a model of heat and
    moisture transfer from clothing. |'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# 5.3.2. Evaluation of Thermal and Moisture Management Performance


    There is no generalized performance evaluation method that can be used to assess
    the performance of wearable systems in managing thermal and moisture. The performance
    assessment of wearable systems involves two main aspects: (i) wearer comfort and
    safety; (ii) functionality of the wearable system. Ismail et al. [119] investigated
    the effect of uniform crosswinds on ventilation, heat, and moisture transfer to
    a clothed human body by simplifying the human body as a vertical cylinder with
    a uniform annular air layer. However, the existing evaluation methods are not
    sufficiently developed, especially for the performance evaluation of wearable
    systems under specific hot and humid conditions. Due to the wide variety of wearable
    systems and the different functions and technologies involved, specific assessment
    methods need to be developed for different types of wearable systems. These evaluation
    methods should be able to comprehensively consider the impact of thermal and moisture
    on the comfort and safety of wearable systems and accurately assess the performance
    of thermal and moisture regulation and energy conversion. Existing standard evaluation
    methods for thermal and moisture management of wearable systems are shown in Table
    9 [75].


    Table 9. Existing standard evaluation methods for thermal and moisture management
    of wearable systems.


    | Thermal/Moisture Transfer | Thermal/Moisture Transfer | Indexes | Test Equipment
    |

    | :--- | :--- | :--- | :--- |

    | Human body → environment | Heat transfer | Thermal resistance | Hot plate; thermal
    torso; thermal manikin |

    | | Moisture transfer | Liquid-water transfer indexes | Moisture management tester
    |

    | | Coupled heat and moisture transfer | Evaporative resistance | Sweating hot
    plate; sweating torso; sweating thermal manikin |

    | Environment → human body | Heat transfer | Water vapor transmission | Test dish,
    balance |

    | | | Absorbed thermal energy | Thermal protective performance; tester, radiant
    protective tester, radiant protective performance tester |


    From the perspective of thermal and moisture management, the performance evaluation
    of wearable systems can include the following aspects: (i) wearable comfort and
    safety under specific thermal and moisture conditions, taking into account the
    thermal and moisture regulation performance as well as the thermal and moisture
    conditions of the human body and the environment; (ii) wearable functionality
    under specific thermal and moisture conditions, including thermal and moisture
    energy conversion and physiological sensing. In order to evaluate the performance
    of wearable systems under such hot and humid conditions, there is a need to provide
    standardized and repeatable evaluation methods to support the development of wearable
    systems.


    Our research group is currently developing a cooling and dehumidifying garment
    that uses membrane separation to reduce skin temperature and absorb surface sweat,
    thereby creating a cool and comfortable microenvironment within the garment. Therefore,
    future research should further explore technologies that simultaneously regulate
    temperature and humidity to improve thermal and moisture comfort for the human
    body and provide better protection.


    # 6. Conclusions


    The presented analysis provided a comprehensive overview of wearable systems for
    personal thermal and moisture management, discussing their functions, latest developments,
    and performance evaluation approaches. The findings contribute to the understanding
    of the challenges and considerations involved in regulating temperature and humidity
    within wearable systems. In the light of this study, the main findings derived
    can be stated as follows:'
  merge: -1
  img_proc: true
- pgno: 31
  md: '+   (1) Although current cooling methods are effective in regulating the surrounding
    temperature, condensation can result if the temperature of the cooling medium
    is below the dew point of the air.


    +   (2) Moisture removal from textiles is strongly influenced by the humidity
    of the surrounding environment. In addition, when a desiccant is used to absorb
    water vapor from around the body, the desiccant absorbs the water vapor, releasing
    latent heat and leading to an increase in body temperature.


    +   (3) Temperature and humidity regulation is a complex coupled process, and
    there are no generalized performance evaluation methods available to assess the
    performance of wearable systems in managing temperature and moisture.


    +   (4) Addressing the issues involved requires considering a combination of cooling
    and dehumidification factors, such as the use of intelligent control systems,
    which play a vital role in maintaining the delicate balance between effective
    dehumidification performance and optimal comfort.


