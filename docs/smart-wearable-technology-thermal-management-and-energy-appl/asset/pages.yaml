    # 3.4. Thermal Properties Characterization


    The thermal properties of textiles, such as the heat transfer coefficient (U),
    thermal resistance (Rt), and thermal insulation (Q), are influenced by factors
    such as the fabric type and environment. In this study, a textile heat transfer
    performance tester was used to measure these properties in a constant temperature
    and humidity room. The laboratory temperature was set at 25 ± 1 °C, with a humidity
    of 65 ± 5% and a wind speed less than 0.4 m/s. The temperature of the test plate
    was set at 35 °C, and square fabric samples measuring 0.3 m × 0.3 m were prepared
    for each fabric type. Before each day''s experiment, a blank test was conducted,
    then the instrument chamber was opened and the sealed bag with the wetted fabric
    was laid flat onto the test plate of the thermal resistance tester. During the
    experiment, care was taken to maintain stable air inside the instrument as much
    as possible. After a period of testing, the thermal properties of the fabric could
    be read from the instrument panel. Each experiment was performed three times and
    the results were averaged, with a coefficient of variation between the test results
    being less than or equal to 3%.


    The heat transfer coefficient of a fabric refers to the heat flux passing through
    a unit area of fabric when there is a surface temperature difference of 1 °C [25].
    The formula for calculating the heat transfer coefficient is as follows:


    ```

    U = \frac{U_{bp} \times U_1}{U_{bp} - U_1} (17)

    ```


    where U is the heat transfer coefficient of the fabric, W/(m²·°C), Ubp is the
    heat transfer coefficient of the experimental plate without specimen, W/(m²·°C),
    and U1 is the heat transfer coefficient of the experimental plate with specimen,
    W/(m²·°C).


    The thermal resistance is the reciprocal of the heat transfer coefficient, and
    its conversion formula for thermal resistance is:


    ```

    R_t = \frac{1}{U} (18)

    ```


    ```

    R_{tm} = R_{ct} - R_{ct0} (19)

    ```


    where Rtm is the actual measured thermal resistance of the fabric in m²·°C/W;
    Rct is the final thermal resistance test reading of the thermal resistance tester,
    which is the sum of the fabric thermal resistance and the sealing bag thermal
    resistance in m²·°C/W; and Rct0 is the'
