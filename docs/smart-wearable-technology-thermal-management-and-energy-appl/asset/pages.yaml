    # 3.4. Hybrid-Cooling Wearable Clothing


    Hybrid-cooling wearable clothing refers to garments that employ a combination
    of two or three heat-transfer mechanisms [65].


    Hybrid-cooling wearable clothing is specifically engineered to optimize the benefits
    of various cooling techniques to achieve a superior cooling efficiency [22]. Figure
    9 demonstrates a hybrid-cooling wearable clothing that combines microfans and
    PCM to improve cooling efficiency while addressing the drawbacks of air-cooling
    and phase change-cooling clothing [66]. Wang et al. [25] designed a suit based
    on dry ice and ventilated fans, utilizing the sublimation of dry ice to reduce
    the wearer''s load and reinforce air circulation to effectively alleviate thermal
    discomfort in mascot actors. The experiment demonstrated the effectiveness of
    the hybrid-cooling suit in preventing the mascot actor''s core body temperature
    from exceeding 38.0 °C and consistently maintaining an average skin temperature
    below 36.5 °C. Ni et al. [67] proposed a hybrid-cooling garment that combined
    PCM and a ventilation fan, resulting in the improved regulation of heart rate
    and skin temperature. One of the benefits of this design was that the PCM, without
    additional cooling, absorbed a significant amount of potential [37,68–70]. Kang
    et al. [71] provided a similar hybrid design that combined PCM and a ventilation
    fan, which was also proven effective in thermal management. The design of hybrid-cooling
    suits can be customized to different usage scenarios and necessities. For instance,
    in high-temperature environments, liquid and air cooling can be combined to take
    advantage of the effective cooling properties of liquid and the rapid cooling
    features of air, resulting in faster and more efficient cooling. In addition,
    hybrid-cooling wearable clothing could incorporate additional features, such as
    protection and breathability, to better meet user needs.


    # 3.5. Characterization of Thermal Management Wearable Clothing


    Personal cooling clothing effectively lowers the body''s surface temperature in
    high-temperature settings, reduces discomfort and fatigue caused by heat, improves
    work efficiency, and protects individuals'' health. The suit finds practical uses
    in various settings such as industrial production, fieldwork, and others that
    require cooling. The performance characteristics of various cooling suits are
    compared in the introduction above. Please refer to Table 4 for a summary of the
    results.'
