    # 4. Comparative Study


    Several methods have been employed to evaluate PCGs. Human trials, thermal manikin
    tests, and model simulation were the three mainly used methods for the assessment
    of PCGs [74]. Human testing provides practical data for the physiological impact
    of PCGs on the human body with the work intensity and specific test conditions
    set [75–77]. A sweating, heated manikin (ASTM F2371-16) can provide objective
    and reproducible results to assess the effectiveness of PCGs [78,79], while thermal
    manikins cannot simulate realistic thermo-physiological responses, such as changes
    in sweat and heart rate. Thermal manikins can be used as an alternative method
    when human trials are not applicable, while it cannot replace the human subject
    tests. Generally, human trials can be conducted independently or combined with
    thermal manikins to evaluate PCGs. Thermoregulation models could be a good alternative
    to human trial studies to avoid the ethical problems and operating limitations.
    Thermoregulation models that can simulate physiological responses and the complex
    heat transfer of the human body were developed to predict human thermal responses
    in different environmental and activity conditions [80–82]. However, thermoregulation
    models need to be combined with human trials to demonstrate their reliability
    and applicability. The evaluation of different types of PCGs plays an important
    role in the development and improvement of cooling technology. In this section,
    the separate and overall quantitative comparisons in cooling performance for different
    types of PCGs will be discussed.


