    # 3.1. Analysis of Results from CNN Algorithms


    During the process of result derivation, the parameters and the number of blocks
    were adjusted to identify the most suitable configuration. In the initial model,
    CNN-1, the baseline number of blocks was set to seven, with the hypothesis that
    increasing the number of blocks would enhance training capacity and ultimately
    improve final accuracy. Deep learning training was conducted under this assumption.


    Contrary to expectations, the training results failed to identify meaningful patterns,
    resulting in significantly low validation and test accuracy of 25%. Instead, all
    predictions were classified as resting (Class 1) breathing. These outcomes are
    visualized in Figure 7, where (a) displays the training results window, and (b)
    presents the confusion matrix.


    ![](img/c1925febd7dde400183c23c14d668ef0_153_1.png)


    Figure 7. (a) Training results window; (b) confusion matrix (CNN-1).'
