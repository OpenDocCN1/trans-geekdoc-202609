- pgno: 53
  md: 'A heated glove was used to maintain a minimum temperature of the finger surface
    of 15.6 °C, which had been defined as the minimum standard of spacesuit ergonomics
    design previously, while the environmental temperature around the clothed thermal
    hand manikin was −130 °C [155]. While the special extravehicular activity (EVA)
    glove could maintain the temperature measured at the middle finger at 20 °C for
    about an hour, heating was necessary after 75 min. The authors reported a heating
    power of 4 W to be ideal for maintaining the defined temperature of 15.6 °C [155],
    suggesting that either regular warming in a space vehicle or regularly taking
    new power supplies from the space vehicle is necessary, especially since not only
    the hands should be warmed during longer work in space.


    Many other studies lack exact definitions and descriptions, in this way impeding
    extrapolations from the investigated situations to other environmental conditions.
    The same problem occurs for textiles heated by Peltier elements, as the next section
    shows.


    # 5.3. Self-Sufficient Peltier Heating Textiles


    Peltier modules are often integrated into smart textiles for cooling, which is
    easier by thermoelectric cooling than by a vest in which a coolant liquid circulates
    [156–158]. A jacket that can heat or cool the wearer depending on the temperature
    was proposed by Poikayil et al.; however, no experiments were performed with the
    proposed design [42]. Generating a neutral microclimate under clothing by Peltier
    cells was investigated by Vlad et al., who found a drop in the relative humidity
    upon introducing Peltier cells due to an increased temperature of the textile
    layers, as well as constant skin temperature during exercise and rest [159]. The
    general possibility of using Peltier elements for heating was mentioned in several
    papers [157,160–163], but no studies of this possibility were found. No reports
    about tests on heating a volunteer or a thermal manikin by Peltier elements were
    found in the literature.


    # 6. Applications of Energy-Self-Sufficient Heating Textiles—Chances and Limits


    Some of the potential applications of energy-self-sufficient heating textiles
    were already mentioned in the previous sections. No papers mention the potential
    use of active heating textiles for homeless people. Using heated textiles to survive
    cold environments is at least scarcely mentioned [164–167].


    Some studies investigated the possibility of using heated textiles for therapeutic
    applications, such as relieving joint and muscle pain [168], supporting wound
    healing by killing bacteria [169] or thermotherapy [170]. For sports and outdoor
    activities, mostly cooling textiles are investigated, but cooling/heating textiles
    are also investigated, often based on PCMs [171–173]. Another approach is the
    so-called personal thermal management, which can be applied in indoor situations
    to heat only a person’s body, while the entire indoor space can be cooler to reduce
    energy consumption [174–176].


    More applications, however, are related to working in extreme cold, such as the
    aforementioned space suits [22,135,155]. Li et al. generally suggested their heated
    textiles in the form of a garment, a seat and an insole for outdoor workers in
    winter [177], while many researchers concentrated on heated gloves for protection
    from extreme cold [178–180]. Depending on the specific environment and work, additional
    requirements have to be taken into account, such as fire resistance, flame-retardant
    properties, defined hydrophobic/hydrophilic properties, and windproof, fast-drying,
    isolating and other properties [156,181–183].


    Most studies, however, exclude the long-term heating applications in which self-sufficient
    heating would really be necessary. To support people working and living under
    harsh environmental conditions, especially outdoor workers or homeless people
    during winter, this should be changed in future research studies.


    # 7. Conclusions and Outlook


    To create energy-self-sufficient heating textiles, it is necessary to integrate
    energy harvesting, energy storage and active heating in clothing. Different possibilities
    have'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'been investigated for energy harvesting, such as triboelectric nanogenerators
    (TENGs), photovoltaics, and thermoelectric or piezoelectric devices, and for energy
    storage, such as supercapacitors or batteries. Electric energy can be used to
    prepare Joule heating or Peltier heating textiles, while phase-change materials
    (PCMs) work independently from electric energy.


    While all necessary components to prepare energy-self-sufficient active heating
    textiles are thus known and are being investigated by various research groups,
    there is still a lack of real-life tests on probands under harsh conditions or
    on thermal manikins under mostly realistic conditions. While most research groups
    aim at improving specific material parameters, only very few studies yet exist
    that measure the necessary energy to heat the inner part of a garment under defined
    environmental conditions towards a defined temperature for a given time. This
    makes it nearly impossible to estimate how long, e.g., the energy stored and saved
    in a garment during daytime could heat the clothing in the night, or how much
    energy must be stored in a working dress to enable active heating towards a defined
    temperature during a long outdoor working day under extremely cold conditions.
    Research on PCMs, on the other hand, clearly shows that they have recently only
    been suitable for short-term temperature variations, not for longer energy storage.


    In the future, it is thus necessary to significantly increase the studies of active
    heating on a human volunteer or at least a thermal body manikin to gain more knowledge
    about the necessary energy for heating to a defined temperature under different
    environmental conditions.


    To make lab experiments more comparable, heated textiles should be investigated
    under clearly defined, ideally standardized conditions, such as defined room temperature
    and relative humidity, and ideally freely held in the air instead of placed on
    an unknown underground to enable comparability across different studies. Since
    most of these experiments are performed with an infrared camera, it is necessary
    for all studies to mention the calibration of the emissivity, which strongly influences
    the measured temperatures [184]. In this way, comparability between different
    labs can significantly be increased, enabling more reliable measurements of material
    properties.


