    In this study, a wearable respiratory sensor was employed to classify breathing
    patterns of varying intensities across cycles using deep learning techniques.
    The results demonstrate that wearable respiratory sensors can effectively capture
    and differentiate breathing patterns in both physical activities and daily life.
    The enhanced classification performance of O-ResNet highlights its potential for
    detecting abnormal breathing patterns, which could be valuable for health monitoring
    applications.


    Despite these promising results, several challenges remain. First, the dataset
    used in this study was relatively small and was collected under controlled conditions,
    which may limit its generalizability. Future research will address this limitation
    by incorporating a more diverse dataset, considering various exercise conditions,
    postures, and sensor placements. Second, while O-ResNet demonstrated strong performance,
    it may encounter difficulties in processing more complex breathing patterns or
    real-time applications. To overcome these challenges, future work will explore
    alternative models, such as LSTM or GAN, which may enhance classification accuracy,
    particularly for long-term respiratory monitoring and data augmentation. Lastly,
    the real-world implementation of wearable respiratory sensors requires careful
    consideration of factors such as sensor placement variability, motion artifacts,
    and individual differences. Future studies will focus on refining sensor design
    and preprocessing techniques to improve the practicality of these models in real-world
    health monitoring systems.


    # 4. Conclusions


    This study investigated the classification of breathing patterns using a wearable
    respiratory sensor and deep learning models. The findings confirm that O-ResNet,
    with its skip connection architecture, outperformed O-CNN in accuracy and precision,
    particularly in detecting high-intensity breathing patterns. These results underscore
    the potential of wearable sensors and deep learning techniques for real-time health
    monitoring, offering a promising approach for capturing complex respiratory signals.


    Despite these advancements, this study has limitations, including the relatively
    small dataset collected under controlled conditions. To address this, future research
    should incorporate larger and more diverse datasets while also exploring alternative
    models, such as LSTM or GAN, to improve classification performance. The insights
    gained from this study contribute to the advancement of wearable respiratory monitoring,
    paving the way for more accurate and reliable health applications.


