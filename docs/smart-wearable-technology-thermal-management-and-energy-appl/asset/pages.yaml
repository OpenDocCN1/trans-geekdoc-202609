    are connected in parallel, followed by a series connection with the fiber resistance.
    Although Model 7 did not perform as well as Model 5 (R² ≥ 0.917), it still demonstrated
    good predictive ability. This model’s characteristics are that the water resistance
    and fiber resistance are connected in series, followed by a parallel connection
    with the air resistance. Therefore, we consider that the predictions of Model
    5 and Model 7 for the thermal resistance of moist fabrics have some reference
    value. This finding is similar'
