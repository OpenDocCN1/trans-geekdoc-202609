- pgno: 116
  md: '# # Evaluation and Prediction of the Effect of Fabric Wetting on Coolness


    Zijiang Wu †, Yunlong Shi *_,†, Xiaoming Qian * and Haiyang Lei


    School of Textile Science and Engineering, Tiangong University, Tianjin 300387,
    China; wuzijiang@tiangong.edu.cn (Z.W.); 2231010162@tiangong.edu.cn (H.L.) * Correspondence:
    shiyunlong@tiangong.edu.cn (Y.S.); qxmtjpu@163.com (X.Q.) † These authors contributed
    equally to this work.


    Abstract: As an important parameter of garment comfort, the thermal sensation
    of fabrics changes with factors such as sweat-induced humidity, making it a crucial
    area of research. To explore the coolness sensation of fabrics under different
    humidities, we tested heat transfer between fabrics and skin for 20 different
    fabrics with varying thermal absorption rates using fuzzy comprehensive evaluation
    to objectively assess their coolness levels. Subjective evaluation was then obtained
    by having subjects touch the fabrics and provide feedback, resulting in a subjective
    evaluation of their coolness levels. We compared the objective and subjective
    evaluations and found them to be highly consistent (R² = 0.909), indicating accurate
    objective classification of fabric coolness levels. Currently, random forest regression
    models are widely used in the textile industry for classification, identification,
    and performance predictions. These models enable the prediction of fabric coolness
    levels by simultaneously considering the impact of all fabric parameters. We established
    a random forest regression model for predicting the coolness of wet fabrics, obtaining
    a high accuracy between predicted and tested thermal absorption coefficients (R²
    = 0.872, RMSE = 0.305). Therefore, our random forest regression model can successfully
    predict the coolness of wet fabrics.


    Keywords: wet state; coolness sensation; sensory evaluation; thermal absorptivity;
    random forest regression model


    # ## 1. Introduction


    Clothing is an important barrier to maintaining thermal and moisture balance in
    the human body. Choosing the right clothing can help people maintain a state of
    psychological and physiological comfort during work and activities, which is why
    consumers pay more attention to the thermal and moisture comfort of clothing [1].
    When the skin comes into contact with fabric, heat on the skin surface will quickly
    diffuse to the cooler fabric surface, causing a brief decrease in skin temperature,
    stimulating skin temperature receptors, and forming a cool or warm sensorial judgment
    in the human brain [2]. The thermal sensation of fabrics is influenced by factors
    such as fabric type, structure, thickness, density, and surface treatment, and
    is also closely associated with fabric humidity [3]. The skin surface of the human
    body is constantly perspiring, including visible and invisible perspirations that
    affect the humidity of the fabric. In summer, high temperatures accelerate human
    sweat production to regulate body temperature, with an average sweating rate of
    up to 1.5 L/h [4]. As a result, the fabric can become soaked with sweat, which
    significantly changes the thermal sensation of the fabric and affects the comfort
    of the clothing. Therefore, accurately assessing the strength of the thermal sensation
    of fabrics is of great significance in the research and development of clothing
    products. A fabric can be regarded as a mixture of fibers, air, and water [5]
    and the factors affecting the coolness of contact are numerous and complex, making
    it a hot research topic. Many studies have investigated the factors influencing
    the coolness of fabrics. Atlale et al. measured the thermal parameters of fabrics
    before and after composite finishing with'
  merge: -1
  img_proc: true
- pgno: 117
  md: 'different counts, twists, variation of mass (CVm), thickness, and strength,
    and found that

    the thermal absorption coefficient of the fabric changed significantly [6]. Akcagun
    et al.

    measured the thermal sensation of wool/PET-knitted fabrics with different water
    contents,

    and the results showed that wool causes a slow decrease in thermal sensation as
    humidity

    changes, giving it good thermal comfort [7]. Qian et al. studied knitted fabrics
    and

    explored the effects of fabric structure and porosity on thermal absorption coefficient

    and other parameters [8]. Mansoor et al. used the Alambeta method to test the
    thermal

    absorption coefficient of socks before and after water absorption, and the results
    showed

    that the thermal absorption coefficient of the fabric significantly increased
    after moisture

    absorption [9]. In summary, objective evaluation of the coolness of the fabric
    based on

    a single physical index measured using experimental instruments has been the common

    approach in research on the thermal sensation of fabrics. Unfortunately, there
    is little

    consideration of the subjective perception of the fabric’s contact with human
    skin, and

    subjective evaluation of the coolness of fabrics often requires a lot of time
    and high labor

    costs. Improving the connection between subjective and objective evaluation and
    proposing

    an effective prediction model is an important way of solving this problem.


    In recent years, many researchers have studied prediction models of fabric thermal

    performance based on fiber, yarn, and fabric structural parameters. Dias and Delkumbure-

    watte proposed a prediction model that can effectively predict the thermal conductivity

    of fabrics [10]. Mangat et al. proposed a thermal resistance prediction model
    based on

    the combination of air, water, and fiber polymer in series and parallel in the
    wet state [11].

    Bhattacharjee and Kothari proposed a model for predicting heat conduction through

    woven fabrics and radiation through yarns [12]. Kanat et al. used an Artificial
    Neural Network

    (ANN) model to predict thermal resistance at different moisture levels [13]. To
    more accu-

    rately classify the coolness levels of fabrics in the wet state and establish
    a fabric prediction

    model for evaluating the coolness contact of fabrics with different water contents,
    this study

    tested the thermal absorption coefficients of 20 types of fabrics with different
    water content

    levels. The fuzzy comprehensive evaluation method was then used to study the level
    of

    cooling sensation offered by the fabric. Finally, a comparison with the subjective
    evaluation

    level of the subjects was conducted to determine the level of cooling sensation
    that is in

    line with the actual user experience. A Random forest regression model was established

    to effectively predict the coolness of fabrics based on objective evaluation of
    parameter

    characteristics and human sensory evaluation results.


    # 2. Methods


    # 2.1. Objective Evaluation Method


    The objective evaluation method divides the thermal sensation characteristics
    of the

    fabric by measuring related parameters. The main evaluation method currently used
    is

    the thermal absorption coefficient method. The thermal absorption coefficient
    method

    characterizes the heat absorption capacity of the fabric based on the heat value
    absorbed by

    the test sample during transient heat transfer following skin contact based on
    the size of the

    thermal absorption coefficient. The thermal absorption coefficient is also commonly
    referred

    to as the heat storage coefficient or heat dissipation coefficient and was first
    proposed by

    Hes and Dolezal [14] to describe the instantaneous sensation felt when contact
    occurs

    between the skin surface and the fabric surface, reflecting the fabric’s ability
    to absorb heat

    from the skin during contact with the human body. The thermal absorption coefficient
    is

    calculated based on the thermal conductivity of the sample. The thermal conductivity
    of

    the fabric represents the amount of heat passing through 1 m² of material at a
    distance of

    1 m in 1 s and is calculated using the Fan formula [15]:


    ```

    \lambda = \frac{Qh}{tS\Delta T} \tag{1}

    ```


    ```

    b = \sqrt{\lambda \rho c} \tag{2}

    ```'
