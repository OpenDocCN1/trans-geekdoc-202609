  md: '# 2.5. Statistical Analysis


    Statistical data analysis was performed using IBM SPSS Statistics (Version 19.0,
    IBM Corporation). Unless otherwise specified, all values are presented as mean
    ± standard deviation. Paired t-tests were employed to assess both physiological
    and perceptual results over time and between treatments (with and without cooling).
    A 95% confidence level was set for all statistical analyses.


    # 3. Results


    # 3.1. Physiological Parameters


    Core temperature, mean skin temperature and heart rate measurements were recorded
    at one-minute intervals. A significant difference (p < 0.05) in core temperature
    between the control and cooling conditions (Figure 7a) was observed from the 42nd
    minute onwards, with a maximum difference of 0.22 °C between the two conditions.
    Although both groups experienced an increase in core temperature throughout the
    exercise duration, the increase was less pronounced in the cooling group. The
    cooling intervention effectively maintained the core temperature at a lower level
    compared to the non-cooling condition, demonstrating the potential benefits of
    cooling in maintaining a stable core temperature and preventing excessive heat
    accumulation. Statistical analysis revealed no significant difference (p > 0.05)
    in average skin temperature between the control and cooling conditions (Figure
    7b). The cooling group’s mean skin temperature was slightly higher than that of
    the control group from the 29th minute of the testing period. This result could
    be attributed to the lower core temperature of human subjects. It is known that
    the perspiration rate is closely related to the change in core temperature. The
    cooling effect of the WCDS resulted in less perspiration and lower skin wetness
    and therefore reduced the evaporative heat loss rate from the skin. The thermal
    conditions of the experiment were carefully selected to avoid exposing participants
    to severe thermal stress, simulating real hospital and working conditions while
    ensuring participant safety under protective clothing. Regardless of the test
    variant, with or without cooling, the heart rate did not exceed 101 bpm, and there
    was no significant difference (p > 0.05) in the results (Figure 7c).


    ![](img/c1925febd7dde400183c23c14d668ef0_109_0.png)


    (a)


    Figure 7. Cont.'
