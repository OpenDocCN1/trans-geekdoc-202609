  img_proc: true
- pgno: 154
  md: 'This result suggests that increasing the number of blocks led to overfitting,
    thereby degrading generalization performance. Additionally, it may be attributed
    to information loss during propagation due to neuron deletion, which was previously
    identified as an issue.


    In the second training session (O-CNN), improvements were made by fixing the number
    of blocks at seven and varying the number of epochs between 150 and 300 to identify
    the point where accuracy steadily increased without overfitting. Ultimately, the
    most stable gradient was achieved at 200 epochs. The final validation accuracy
    reached 79.16%, while the test accuracy was 83.92%. Additionally, the final loss
    value decreased to 0.89. Therefore, this model represents the optimized CNN (O-CNN)
    configuration, and the validation accuracy results along with the final loss value
    graph are shown in Figure 8a,b, respectively. These findings suggest that a deeper
    network than the CNN classification algorithm and an approach capable of preserving
    information throughout propagation are required to achieve the optimal outcome
    for this dataset.


    ![](img/c1925febd7dde400183c23c14d668ef0_154_0.png)


    Figure 8. The results of O-CNN. (a) Validation accuracy; (b) training loss.


    # 3.2. Analysis of Results from ResNet Algorithms


    Training with ResNet also involved varying the number of epochs to test for accurate
    improvements. Compared to CNN, ResNet utilizes a deeper network, requiring a longer
    training duration to achieve higher accuracy. Accordingly, the training was conducted
    with epochs ranging from 1000 to 2000, with the initial training set to approximately
    2000 epochs. Unlike CNN, ResNet demonstrated superior initial performance, achieving
    a validation accuracy of 87.5% and a notably low loss value of 0.4. Both the testing
    and validation curves showed similar trends with gradual gradients. The test accuracy
    reached an impressive 91%. These results indicate that ResNet effectively overcomes
    the limitations of CNN by leveraging skip connections to mitigate neuron loss,
    leading to higher accuracy. The results are illustrated in Figure 9a,b.


    ![](img/c1925febd7dde400183c23c14d668ef0_154_1.png)


    Figure 9. (a) Training results window; (b) confusion matrix (ResNet-1).'
  merge: -1
  img_proc: true
- pgno: 155
  md: 'The test results were further improved when we used the optimized ResNet (O-ResNet),
    with the number of epochs reduced to 1000 for retraining. While the validation
    accuracy remained similar at 87%, the loss value decreased significantly to 0.003,
    and the test accuracy increased to 95%. These results suggest that an excessive
    number of epochs can negatively impact test performance and confirm that ResNet
    is more suitable for classifying this dataset compared to CNN. These results can
    be observed in Figure 10.


    ![](img/c1925febd7dde400183c23c14d668ef0_155_0.png)


    Figure 10. The results of O-Resnet. (a) Validation accuracy; (b) training loss.


    The comparative analysis of CNN and ResNet in this study highlights the effectiveness
    of deep learning architectures in respiratory signal classification. While both
    models share similar layer structures, ResNet’s skip connections play a crucial
    role in preserving important features during training, thereby enhancing classification
    performance. The ability of ResNet to maintain higher accuracy across different
    training conditions underscores the importance of selecting appropriate network
    structures and training parameters. These findings demonstrate that deep learning
    model selection and optimization are critical factors in achieving robust classification
    performance for physiological signal processing.


    # 3.3. A Comparison to the State of the Art


    The proposed models’ performance is presented in comparison with existing deep
    learning-based studies on similar datasets, as shown in Table 3. The results indicate
    that the optimized CNN (O-CNN) model achieved an accuracy of 83.92%, while the
    optimized ResNet (O-ResNet) model attained an accuracy of 95%. Although our models
    did not surpass all previously published studies, they demonstrated performance
    comparable to the highest accuracy levels reported in the literature.


    A review of related research reveals that many studies focus on combining models
    optimized for specific datasets or conducting comparative analyses with existing
    architectures. However, there remains a lack of studies exploring parameter tuning
    experiments and the application of deep learning to respiratory signal-based data
    analysis. These findings highlight the necessity of this research and underscore
    the importance of optimizing deep learning models for specific datasets.


    While our models did not achieve the highest reported accuracy, they successfully
    reached the performance range of state-of-the-art studies. More importantly, this
    study contributes to the field by identifying dataset-specific optimal models
    through adjustments in the number of epochs and network blocks, demonstrating
    the significance of tailored optimization in deep learning applications.'
