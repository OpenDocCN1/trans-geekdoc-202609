  md: 'Figure 8a shows the original image of a normal conductive textile with uniformly
    distributed conductive particles. Figure 8b presents the result after the first
    filtering stage of the TIPA. At this stage, numerous isolated pixels are detected,
    but they do not form any discernible pattern of stains and are uniformly distributed.
    After the second filtering stage, shown in Figure 8c, no pixels are detected,
    indicating that the fabric is defect-free and classified as normal.


    ![](img/c1925febd7dde400183c23c14d668ef0_168_0.png)


    **Figure 8.** Images of TIPA results for normal conductive textile: (a) original
    image; (b) 1st pixel size filtering; (c) 2nd pixel size filtering.


    # 3.3. Evaluation and Optimization of Conductive Textile Using TIPA


    The detection results and accuracy based on the threshold ratio, a key parameter
    in TIPAs, are summarized in Table 1. The results indicate that at lower threshold
    ratios, conductive fabrics that are normal were incorrectly detected as defective,
    while at higher threshold ratios, defective conductive fabrics were incorrectly
    classified as normal. The difficulty in detection is particularly evident in conductive
    fabrics like those shown in Figure 9, where the distribution of stains is large
    and diffuse, making it challenging to accurately classify the stains as defects.
    However, the overall accuracy remained above 85%, and through optimization, a
    maximum accuracy level of 100% was achieved. The analysis of our TIPA''s precision,
    recall, and F1-score reveals that precision remained at 1 for threshold ratios
    above 15%, while for lower thresholds, it was measured at approximately 0.7 and
    0.78. Conversely, the recall was highest for thresholds below 15% and decreased
    to a minimum of 0.57 at the highest threshold. The final F1-score ranged from
    a minimum of 0.73 to an average of approximately 0.86, with the 15% threshold
    achieving the highest F1-score of 1.0. Ultimately, while 15% yielded the best
    overall performance in this study, it was determined that threshold ratios in
    the range of 10% to 20% could be applicable for stain detection, depending on
    stain size and classification requirements.


    **Table 1.** The results of all images processed by our TIPA, according to threshold
    ratio.


    | Threshold Ratio [%] | Defective <sup>1</sup> | Accuracy | Precision | Recall
    | F1-Score |

    |---|---|---|---|---|---|

    | 5 | 10 | 0.86 | 0.7 | 1 | 0.83 |

    | 10 | 9 | 0.90 | 0.78 | 1 | 0.88 |

    | 15 | 7 | 1 | 1 | 1 | 1 |

    | 20 | 6 | 0.95 | 1 | 0.86 | 0.92 |

    | 25 | 5 | 0.90 | 1 | 0.71 | 0.83 |

    | 30 | 4 | 0.86 | 1 | 0.57 | 0.73 |'
