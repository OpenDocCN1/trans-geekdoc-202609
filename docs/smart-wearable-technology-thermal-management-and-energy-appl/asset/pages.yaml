  md: '# Performance Comparison of High-Temperature Heat Pumps with Different Vapor
    Refrigerant Injection Techniques


    Yuqiang Yang 1, Yu Wang 2,3, Zhaoyang Xu 2,3, Baojiang Xie 4, Yong Hu 4, Jiatao
    Yu 4, Yehong Chen 4, Ting Zhang 4, Zhenneng Lu 5,* and Yulie Gong 5,*


    +   1. State Grid Zhejiang Electric Power Co., Ltd., Hangzhou 310007, China

    +   2. State Grid Electric Power Research Institute Wuhan Efficiency Evaluation
    Company Limited, Wuhan 430074, China

    +   3. Nari Group Corporation State Grid Electric Power Research Institute, Nanjing
    210000, China

    +   4. Shaoxing Power Supply Company, State Grid Zhejiang Electric Power Co.,
    Ltd., Shaoxing 312000, China

    +   5. Guangzhou Institute of Energy Conversion, Chinese Academy of Sciences,
    Guangzhou 510640, China

    +   * Correspondence: luzn@ms.giec.ac.cn (Z.L.); gongyl@ms.giec.ac.cn (Y.G.);
    Tel.: +86-13294195165 (Z.L.); +86-020-87058438 (Y.G.)


    Abstract: In order to develop a highly efficient and stable high-temperature heat
    pump to realize high-efficient electrification in the industrial sector, performance
    of high-temperature heat pumps with a flash tank vapor injection and sub-cooler
    vapor injection are compared under different evaporation temperatures, condensation
    temperatures, compressor suction superheat degrees, subcooling degrees and compressor
    isentropic efficiencies. The results show that the COP, injection mass flow ratio
    and VHC of the FTVC are higher than those of the SVIC-0, SVIC-5, SVIC-10 and SVIC-20
    under the same working conditions, while the discharge temperature of the FTVC
    is approximately equal to that of the SVIC-0 and lower than those of the SVIC-5,
    SVIC-10 and SVIC-20. When the evaporation temperature, the condensation temperature
    and injection pressure are 55 °C, 125 °C and 921.4 kPa, respectively, the system
    COP of the FTVC is 4.49, which is approximately 6.7%, 7.3%, 7.8% and 8.9% higher
    than those of the SVIC-0, SVIC-5, SVIC-10, and SVIC-20, respectively.


    Keywords: high-temperature heat pump; vapor refrigerant injection technique; sub-cooler;
    flash tank; industrial electrification


    Citation: Yang, Y.; Wang, Y.; Xu, Z.; Xie, B.; Hu, Y.; Yu, J.; Chen, Y.; Zhang,
    T.; Lu, Z.; Gong, Y. Performance Comparison of High-Temperature Heat Pumps with
    Different Vapor Refrigerant Injection Techniques. Processes 2024, 12, 566. https://doi.org/10.3390/pr12030566

    Academic Editors: Zhanzxiao Kang and Qing Chen

