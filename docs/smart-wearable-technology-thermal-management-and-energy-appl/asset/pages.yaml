  md: 'external environment are distinct. Areas such as the armpits, sides, and waist
    have relatively little correlation with environmental climate variations (changing
    by approximately 5 °C over the course of a year). Conversely, regions like the
    chest, back, shoulders, upper and lower limbs, including the forearms and thighs,
    have a closer relationship with external climate changes (varying by 5 °C to 10
    °C for the forearms and thighs, and by 10 °C to 15 °C for the calves). Additionally,
    during physical activity, the trunk of the body has the highest basal metabolic
    rate and heat capacity [4]. Based on the relationship between different parts
    of the human body and environmental variations, various types of cooling suits
    with different structural designs have been developed. Figure 6a depicts a vest-type
    cooling suit. Vest-type cooling suits are widely used in various fields of production
    and daily life due to their simple structure, ease of wear, effective cooling,
    and high practicality. Figure 6b shows a full-body cooling suit. The advantage
    of a full-body cooling suit lies in its ability to comprehensively cool the trunk,
    limbs, and other areas, ensuring that the entire body remains in a relatively
    comfortable state. Gerrett et al. [21] conducted a study analyzing the thermal
    sensitivity of different areas on the human body. They found that the abdominal
    area and the sides of the lower back are more sensitive to cold sensations. Therefore,
    cooling the lower half of the body is more conducive to enhancing thermal comfort.
    In comparison to the upper body, the legs generate more heat during walking. Cooling
    suits need to absorb a significant amount of heat. As a result, the legs may not
    achieve the desired cooling effect in the later stages of exercise and during
    periods of rest [22]. However, for workers in high-temperature mines with extensive
    work areas and high intensity, it may affect their work efficiency and overall
    comfort of wearing.


    ![](img/c1925febd7dde400183c23c14d668ef0_82_0.png)


    # 4.3. Cooling Clothing Design


    To date, researchers have conducted extensive studies on different types of cooling
    suits and their performance. Based on different cooling media, cooling suits can
    be categorized as gas-based cooling suits, liquid-based cooling suits, phase-change
    cooling suits, and hybrid cooling suits. According to the source of the cooling
    power, they can be classified as active cooling suits or passive cooling suits.
    Additionally, based on different cooling methods, they can be further divided
    into cold storage cooling suits, vapor compression cooling suits, vortex tube
    cooling suits, and thermoelectric refrigeration cooling suits [23–25].


    # 4.3.1. Gas Cooling Suit


    Gas-based cooling suits blow air into the microclimate of the clothing, dissipating
    heat through evaporation and convection. This falls under the category of active
    cooling [26]. The principle of heat dissipation involves accelerating the evaporation
    of sweat and enhancing air convection, thereby achieving the goal of cooling.
    Depending on the different methods of heat dissipation, gas-based cooling suits
    can be further divided into convective gas-based cooling suits and evaporative
    gas-based cooling suits. Additionally, based on different structural designs,
    gas-based cooling suits can be categorized as fan-type cooling suits and duct-type
    cooling suits [27].'
