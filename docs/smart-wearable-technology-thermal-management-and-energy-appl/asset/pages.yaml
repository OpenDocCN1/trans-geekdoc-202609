  md: 'In this study, we employed ResNet, a cutting-edge artificial intelligence image
    classification model that utilizes residual blocks, to develop a deeper-layer
    human activity recognition (HAR) algorithm and enhance its accuracy. ResNet was
    introduced during the 2015 ImageNet Large Scale Visual Recognition Challenge (ILSVRC),
    where it demonstrated a breakthrough by extracting features through 152 layers,
    significantly deeper than the 20–30 layers used in previous algorithms. One of
    the key innovations of ResNet is the use of residual blocks, which help overcome
    the vanishing gradient problem that often occurs in very deep neural networks.
    As a result, ResNet achieved an error rate of 3.57%, which is notably lower than
    the human error rate of around 5%, establishing itself as one of the most advanced
    recognition algorithms available [31]. One of the most prominent features of ResNet
    is the residual block, which effectively addresses the vanishing or exploding
    gradient problem that occurs as neural networks become deeper. In traditional
    deep learning models, the gradient can diminish to zero or explode as it propagates
    back through many layers due to extensive calculations and weight adjustments.
    ResNet resolves this issue by adding the initial input (residual) to the output
    of the deeper layers, a method known as skip connection (or short connection).
    These skip connections ensure that gradients can flow more easily through the
    network, preventing their loss or divergence. By designing networks with multiple
    residual blocks, ResNet not only preserves gradient flow but also enables much
    deeper architectures, resulting in improved accuracy and more stable learning.


    In summary, this study developed an algorithm to recognize 14 different workouts
    using the Z-axis accelerometer sensor of a wristband. To enhance accuracy, we
    utilized ResNet, which features a residual block structure designed to mitigate
    the vanishing and exploding gradient issues common in deep neural networks. A
    comparative analysis was conducted against existing studies, focusing on improvements
    in classification accuracy and model performance. The use of the Z-axis accelerometer
    was particularly advantageous for capturing vertical motion data, making it suitable
    for recognizing a wide range of workouts.


    # ## 2. Materials and Methods


    # ### 2.1. Z-Axis Acceleration Data for Workout Recognition


    In this study, we used an Inertial Measurement Unit (IMU) sensor as a wearable
    device to measure the Z-axis acceleration of the wrist. The IMU sensor is composed
    of a 3-axis accelerometer and a 3-axis gyroscope, providing a 6-axis measurement
    system. Additionally, some IMU sensors include a 3-axis magnetometer, forming
    a 9-axis system, which allows for the measurement of orientation relative to the
    Earth’s magnetic field. All of these sensors are designed specifically for motion
    tracking. In this research, we employed the EBMotion V5.2, an IMU sensor from
    E2BOX (Hanam, Gyeonggi, Republic of Korea), which includes a wireless sensor (EBIMU24GV52)
    and a wireless receiver (EBRCV24GV5). This setup was used to accurately capture
    the Z-axis acceleration data. When measuring motion related to physical activities
    using Z-axis acceleration data, the Z-axis is more significant than the X and
    Y axes because it is the axis most affected by gravity when we are standing. One
    of the challenges with accelerometers is that it is difficult to determine the
    initial position of the object. When a person is standing still, the accelerometer
    detects gravitational acceleration along the Z-axis, resulting in a value of approximately
    -g. This value is recorded even when there is no motion, because the sensor continuously
    measures the gravitational force. However, during movement or when assuming a
    preparatory posture for specific activities, the Z-axis value is influenced by
    both internal and external factors due to gravity. These variations enable the
    extraction of meaningful features for'
  merge: -1
  img_proc: true
- pgno: 176
  md: 'motion analysis. This concept is depicted in Figure 1, and the equation representing
    the change in the accelerometer’s angle with respect to its position is provided
    below.


    \(\vec{A_z} = -\vec{g} \times cos\theta + \vec{l}\) (1)


    where \(\vec{A_z}\) is the acceleration vector along the Z-axis, \(\vec{g}\) is
    the acceleration vector of gravity, \(\vec{l}\) indicates the acceleration vector
    of the arm movement over time, and \(\theta\) is the angle between the \(\vec{A_z}\)
    and \(\vec{g}\). At the initial position, the sensor’s acceleration value is determined
    by calculating the angle difference between the gravitational force and the sensor’s
    Z-axis. This angle can be obtained through trigonometric functions or rotational
    transformations, depending on the orientation of the sensor. As the workout progresses,
    motion-induced acceleration is added to the initial value over time, allowing
    for the comprehensive tracking of dynamic movements.


    ![](img/c1925febd7dde400183c23c14d668ef0_176_0.png)


    Figure 1. The sensing mechanism for workout recognition using the Z-axis acceleration
    of an IMU sensor using gravity.


    # 2.2. 14 Workout Data


    In this study, with reference to previous studies [30], a wristband equipped with
    an IMU sensor was designed, as shown in Figure 2, and worn on the right wrist
    to collect exercise data. The red arrow indicates the Z-axis of the sensor. A
    total of 14 different exercises, illustrated in Figure 3, were measured, with
    the initial movements based on the actions performed on the left side. To minimize
    the effects of body tremors and measurement noise during movements, a low-pass
    filter with a cutoff frequency of 40 Hz was applied during data processing. The
    filter was designed to remove high-frequency noise while preserving the relevant
    motion signals. The sampling frequency was set to 10 Hz, and a total of 18,020
    data points were collected. Data from five male participants were used in this
    study, with an average height of 176 cm and an average weight of 77.4 kg. Detailed
    information about the participants, including variability in their physical characteristics,
