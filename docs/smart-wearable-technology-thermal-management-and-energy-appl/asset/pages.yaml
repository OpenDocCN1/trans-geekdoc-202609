  img_proc: true
- pgno: 164
  md: '# 2. Materials and Methods


    # 2.1. Fabrication of Conductive Textile by Dip-Coating Process


    The dip-coating process for manufacturing conductive textiles was conducted based
    on the fabrication procedures referenced in studies utilizing conductive fabrics.
    As illustrated in Figure 3, this process was implemented accordingly [15]. A 0.1
    wt% aqueous dispersion of Single-Walled Carbon Nanotubes (SWCNT) (WART1200, KORBON
    Co., Ltd., Gangneung, Republic of Korea) was prepared by ultrasonically dispersing
    the solution at 1000 rpm for 1 h. The fabric used for dip-coating was a stretchable
    fabric consisting of 95% cotton and 5% spandex, with dimensions of 300 cm × 300
    cm. This fabric was immersed in the 0.1 wt% SWCNT aqueous dispersion, followed
    by squeezing with a padding machine to ensure uniform coating. The coated fabric
    was then dried in an oven at 80 °C for 10 min to evaporate the water solvent,
    taking care to avoid boiling.


    ![](img/c1925febd7dde400183c23c14d668ef0_164_0.png)


    Figure 3. Dip-coating process of conductive textile fabrication.


    The image files of conductive fabrics for the TIPA to be used on were produced
    using a consistent light source to prevent distortions caused by factors such
    as lighting, shadows, and lens effects. This was achieved by utilizing the scanner
    of a printer (LaserJet Pro MFP M428fdw, HP Korea Inc., Seoul, Republic of Korea.),
    which features an optical resolution of up to 1200 × 1200 dpi and a fixed focal
    distance optimized for contact image sensor (CIS) technology. The scanning process
    was performed with a maximum scan size of 216 × 297 mm (flatbed) and 216 × 356
    mm (ADF), ensuring precise image acquisition for defect detection. To clearly
    distinguish between defect pixels and non-defect pixels, the images were saved
    in PNG format, which allows for minimal image loss due to its low compression
    ratio. The final image files were secured at a resolution of 1440 × 1440 pixels.
    A total of 22 conductive fabric image files were obtained, consisting of 15 normal
    images without defects and 7 images with defects. Figure 4 presents two representative
    normal images and two defect images from this collection.


    # Normal images (no defect)


    # Defects images


    ![](img/c1925febd7dde400183c23c14d668ef0_164_1.png)


    Figure 4. Images of normal conductive textile and textile with defects.'
