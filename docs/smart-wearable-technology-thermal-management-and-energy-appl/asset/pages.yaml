    # 3.2. Thermal Transfer Wearable Clothing


    Thermal transfer wearable clothing is a specialized garment that removes heat
    generated by the body through heat transfer, regulating body temperature. A prevalent
    type of heat transfer wearable clothing is the phase change-cooling suit. This
    cooling utilizes phase-change materials (PCMs) that absorb a considerable amount
    of latent heat at the phase-change point, resulting in cooling the human body.
    PCMs are a significant energy storage option [36,37], categorized into three groups:
    organic materials, inorganic materials, and mixed cocrystals of the two [38].
    Specific features are presented in Table 2 [39]. The phase-change cooling suits
    usually have pockets on the front and back that are specifically designed for
    the PCMs. Before usage, the materials should be stored in a cold environment to
    preserve their coldness, and they are later placed in the pockets. Once the PCM
    absorbs heat and undergoes a phase change, it is taken out and placed back in
    a cold environment to store cold for the next usage [40]. The cooling effectiveness
    of the phase-change cooling suit is determined by the specific phase-change material
    used. Different materials extract varying degrees of heat during the phase-change
    process, resulting in differences in cooling capacity. The cooling duration of
    the suit typically lasts between 2 and 5 h [41]. Refer to Figure 7 for a schematic
    illustration of the phase-change cooling suit’s structure [3].'
