- pgno: 83
  md: 'Fan-based cooling suits primarily operate by using an external power source
    to drive a fan or blower device, creating a flow of air between the clothing and
    the skin surface. This accelerates the evaporation of sweat, thereby cooling the
    microclimate, as illustrated in Figure 7. Currently, some construction workers
    and traffic control personnel have adopted these suits. Mengmeng Zhao [4] conducted
    experiments under different fan placement configurations and found that placing
    fans along the spine and lower back yielded the best results. Yi et al. [28] added
    multiple settings to the fan in the cooling suit to ensure a stable airflow. Each
    setting provided a relatively consistent volume of air. Gas-based cooling suits
    offer excellent cooling effects. Underground environments are rich in gas resources,
    allowing for extended cooling durations. These suits are compact, lightweight,
    and can alleviate the burden on workers. However, fan-based cooling suits can
    be cumbersome to wear, potentially hindering the wearer''s mobility. Moreover,
    there may be risks of explosion in underground mines due to the presence of hazardous
    gases like methane. And its cooling effect is not significant in high humidity
    or extremely hot environments [29].


    ![](img/c1925febd7dde400183c23c14d668ef0_83_0.png)


    # Figure 7. Fan-style cooling suit.


    In 2005, Zheng Xiang Pu [30] introduced the duct-type gas-based cooling suit.
    In this design, an air compressor compresses air and pre-cools it through a vortex
    tube. The compressed air is then routed through a system of tubes distributed
    throughout the suit. This promotes heat dissipation on the body surface through
    the evaporation of sweat and air convection. The gas, having completed its heat
    exchange, is expelled through the exhaust port. This technology applies the cooling
    effect of the vortex tube to provide cooling protection for mine workers. During
    use, temperature output within the range of human thermal comfort can be ensured
    simply by controlling the adjustment valve. The suit features a straightforward
    structure, convenient operation, and occupies minimal space, making it suitable
    for the complex environments found in mines. Compared to traditional fan-based
    cooling suits, vortex-based cooling suits do not require power sources or refrigerants
    and can operate continuously for extended periods. However, their cooling effect
    is relatively weaker and is influenced by the intake pressure and flow rate. Guo
    et al. [31] developed a tubular ventilation suit with an open front and unsealed
    ventilation. The ventilation device introduces natural air or cool air into the
    duct, which is then blown onto the inner clothing through holes. This design offers
    characteristics such as ease of wear, being lightweight, and low resistance.'
