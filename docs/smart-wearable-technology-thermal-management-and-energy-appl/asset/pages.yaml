    # 4. Discussion


    This study aimed to investigate the effectiveness of a wearable cooling and dehumidifying
    system (WCDS) in mitigating thermal stress and enhancing comfort under protective'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'clothing. The findings provide valuable insights into the physiological and
    subjective responses to the WCDS, as well as its impact on the microclimate within
    protective clothing. The physiological data revealed that the cooling intervention
    effectively maintained a lower core temperature throughout the exercise duration,
    indicating its potential to prevent excessive heat accumulation. Importantly,
    the heart rate remained below 101 bpm in both conditions, which may be associated
    with the exercise intensity [23], indicating that the WCDS did not impose additional
    cardiovascular strain. Mean skin temperature was more likely to be affected by
    skin wetness and sweat evaporation. The air-cooling system tended to reduce the
    sweating rate and enhanced the ventilative heat exchange. But in this experiment,
    the skin was covered by undergarments instead of being exposed to the cooling
    air, so the evaporative heat loss from the skin and mean skin temperatures were
    not significantly different for the cooling and non-cooling groups.


    The WCDS also significantly altered the microclimatic temperature within the protective
    clothing. This is a crucial finding, as the microclimate is a key determinant
    of thermal comfort [24]. Compared to a traditional air-cooling system, this system
    can effectively lower the microclimatic temperature and reduce the risk of infectious
    diseases caused by air cooling, which cools via air circulation from the surroundings.
    The significant reduction in microclimatic temperature demonstrates the WCDS’s
    potential to enhance comfort and reduce thermal stress in real-world settings.


    The subjective assessments provide compelling evidence for the psychological benefits
    of the WCDS. The significant improvements in overall and upper body thermal sensations,
    along with reduced wetness sensations, highlight the WCDS’s role in enhancing
    wearer comfort. This is particularly relevant for healthcare workers who must
    wear PPE for prolonged periods, as discomfort can lead to distraction, decreased
    work performance, and reduced compliance with necessary protective measures.


    The wearing trial results further support the practicality of the WCDS, with participants
    reporting general satisfaction with its wearability and movement comfort. This
    suggests that the WCDS can be integrated into protective clothing without significantly
    compromising mobility, which is critical for occupational settings.


    It is important to recognize certain limitations of this laboratory study. To
    ensure participant safety, variables such as environmental conditions and exercise
    intensity were strictly controlled. A field study may provide a more realistic
    assessment of the cooling effect. Furthermore, the study’s participants were exclusively
    college students, not healthcare workers. The influence of gender should also
    be considered in future research.


    # 5. Conclusions


    This study provides valuable insights into the effectiveness of a wearable cooling
    device system (WCDS) in mitigating thermal stress and enhancing comfort under
    protective clothing. The WCDS significantly reduced core temperature, improved
    thermal sensation, and reduced wetness sensation compared to the non-cooling condition
    without imposing additional cardiovascular strain or compromising mobility. The
    wearing trial results indicated general satisfaction with the wearability and
    movement comfort of the WCDS. This suggests that the WCDS can be integrated into
    protective clothing without significantly compromising mobility, which is critical
    for occupational settings.


    In conclusion, the WCDS appears to be a promising strategy for mitigating thermal
    stress and enhancing comfort under protective clothing. Future research should
    explore the long-term effects of the WCDS and its applicability in various occupational
    and clinical settings. The findings of this study have important implications
    for the design of protective clothing and the development of strategies to enhance
    comfort and safety for personal protective clothing.


