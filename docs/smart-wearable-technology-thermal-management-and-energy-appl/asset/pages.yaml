  md: 'thermal absorption coefficients ranging from 200 to 300 Ws1/2/(m2·°C) were
    defined as having slight coolness (Level C), fabrics with thermal absorption coefficients
    ranging from 300 to 340 Ws1/2/(m2·°C) were defined as having obvious coolness
    (Level D), and fabrics with thermal absorption coefficients of ≥ 340 Ws1/2/(m2·°C)
    were defined as having strong coolness (level E). Level A fabrics mainly contain
    100% water, while Level B fabrics contain 80–100% water, Level C fabrics contain
    60% water, and Level D fabrics contain 40% water. Level E fabrics mainly include
    ultra-dry fabrics and fabrics with a water content of 20%. As most dry fabrics
    had a thermal absorption coefficient of no more than 100 Ws1/2/(m2·°C) (14/20),
    it can be concluded that fabrics conduct non-coolness only in the dry state.


    ![](img/c1925febd7dde400183c23c14d668ef0_124_0.png)


    Figure 2. Thermal absorption coefficient class classification results.


    By comparing the thermal absorption coefficient values of different types of fabrics,
    it was found that most fabrics have a thermal absorption coefficient of 100–300
    Ws1/2/(m2·°C). Sample #2 (100% Cotton) had the highest thermal absorption coefficient
    at different water contents, indicating the strongest coolness effect. Sample
    #16 (98% Polyester + 2% Elastane) had the lowest thermal absorption coefficient
    at different water contents, indicating the least obvious coolness effect. This
    may be due to the fact that pure cotton fabrics are hydrophilic materials, whereas
    polyester fibers are hydrophobic. Polyester fibers have a stronger drying sensation
    after water absorption compared with other fabrics; a similar phenomenon was observed
    in the study by Mansoor et al. [9]. Comparison of the thermal absorption coefficients
    of fabrics with different water contents showed that the thermal absorption coefficient
    of most fabrics increased by 200–300% from dry to completely wet, while Sample
    #15 (85% Nylon + 15% Elastane) had the highest increase of 403% and Sample #13
    (65% Polyester + 35% Cotton) had the lowest increase of 159%, which may be associated
    with the degree of water absorption. Sample #12 (90% Polyester + 10% Elastane),
    which has a composition similar to Sample #13, also demonstrated a similar phenomenon,
    with only an 185% increase.


