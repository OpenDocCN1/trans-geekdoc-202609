    # 3.4. Other Energy Harvesting Methods


    Among the other methods of energy harvesting by garments, piezoelectric textiles
    must be mentioned, which are regularly investigated. As depicted in Figure 6,
    piezoelectric materials perform a charge separation when a pressure is applied
    or released, leading to a voltage [85]. Amongst the possible materials that show
    the piezoelectric effect, such as ZnO, BaTiO3 or GaPO4, especially polyvinylidene
    fluoride (PVDF) has often been investigated due to its good mechanical properties,
    flexibility and chemical and thermal stability [85–87]. For this material, Liu
    et al. reported an efficiency of around 12% for the transition of mechanical into
    electrical energy and vice versa [88]. With a combination of PVDF, BaTiO3 nanoparticles
    and reduced graphene oxide nanopates, even an energy conversion efficiency of
    22.5% was reached [89]. For single melt-spun PVDF, polyamide 11 and polypropylene
    fibers, powers in the range of 0.2 nW were generated [90]. Combining PVDF with
    lead zirconate titanate (PZT), a piezoelectric nanogenerator from electrospun-aligned
    nanofibers produced 6.35 µW [91]. Besides electrospinning and melt spinning as
    typical fiber production methods, it is also possible to use physical or electrochemical
    deposition of piezoelectric materials on textile fabrics, which is especially
    relevant for non-polymeric materials such as ZnO [58].


    ![](img/c1925febd7dde400183c23c14d668ef0_43_0.png)


    Figure 6. Working principle of a piezoelectric material when applying and releasing
    pressure. Reprinted from [85], originally published under a CC-BY license.


    Other research groups suggested additional methods of harvesting energy by smart
    textiles, e.g., biological fuel cells that generate energy by biodegradation of
    organic matter [92,93], partly using the wearer''s sweat to harvest biochemical
    energy [94].


    Generally, as suggested by Lund et al. [78], a reasonable combination of different
    energy harvesting methods should be applied to optimize the overall gained energy.
    Depending on the environmental conditions (temperature difference, sunlight) and
    movements of the person wearing the respective harvesting garments, a power density
    of the order of magnitude 1 W/m² can be expected. In the next section, storing
    the energy harvested in a defined time in textiles will be discussed.


    # 4. Energy-Storing Smart Textiles


    Most of the aforementioned forms of energy that can be transferred into electrical
    energy—sunlight, body movements—are not constantly available; only the temperature
    difference between skin temperature and surrounding temperature, as used in thermoelectric
    devices, is automatically larger when more heating energy is needed. Using a combination
    of different energy harvesting methods, however, necessitates storing parts of
    the energy harvested in sunlight and during active movements for times when it
    is more needed.


    Several researchers thus investigated methods to store energy in textile fabrics,
    either fiber-, yarn- or fabric-based, usually in the form of batteries or supercapacitors,
    as depicted in Figure 7 [95].'
