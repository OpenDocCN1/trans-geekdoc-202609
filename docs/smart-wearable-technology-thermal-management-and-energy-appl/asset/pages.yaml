  md: '# Review


    # Systematic Evaluation of Research Progress in the Textile Field over the Past
    10 Years: Bibliometric Study on Smart Textiles and Clothing


    Ting Wang 1, Changqing Liu 1, Jun Zhang 2 and Aosi Wang 2,*


    1 School of Apparel and Art Design, Xi’an Polytechnic University, Xi’an 710048,
    China; wangting331@126.com (T.W.); changqingliu1999@gmail.com (C.L.)

    2 School of Fashion and Textiles, The Hong Kong Polytechnic University, Hong Kong,
    China; alicezhang34@hotmail.com

    * Correspondence: 22124308r@connect.polyu.hk


    Abstract: Intelligent textile clothing is one of the most popular topics in the
    field. In recent decades, rapid advances have been made in the area of intelligent
    textile clothing research, and the intellectual structure pertaining to this domain
    has significantly evolved. We used CiteSpace 6.2.R4, VOSviewer 1.6.19, to evaluate
    and visualize the results, analyzing articles, countries, regions, institutions,
    authors, journals, citations, and keywords. Both a macroscopic sketch and a microscopic
    characterization of the entire knowledge domain were realized. The aim of this
    paper is to utilize bibliometric and knowledge mapping theories to identify relevant
    research papers on the subject of smart textiles and clothing that have been published
    by the China Knowledge Network Web of Science (WOS) within the last decade. It
    is concluded that the main topics of smart textile and garment research can be
    divided into nine categories: wearable electronics, smart textiles, flexible antennas,
    energy storage, textile actuators, mechanical properties, asymmetric supercapacitors,
    carbon nanotubes, and fiber extrusion. In addition to the latter analysis, emerging
    trends and future research foci were predicted. This review will help scientists
    discern the dynamic evolution of intelligent textile clothing research as well
    as highlight areas for future research.


    Keywords: smart textiles and clothing; smart fibers; CiteSpace; intellectual structure;
    knowledge mapping; bibliometrics


    Citation: Wang, T.; Liu, C.; Zhang, J.; Wang, A. Systematic Evaluation of Research
    Progress in the Textile Field over the Past 10 Years: Bibliometric Study on Smart
    Textiles and Clothing. Processes 2023, 11, 2797. https://doi.org/10.3390/pr11092797


    Academic Editors: Zhanxiao Kang and Qing Chen

    Received: 3 August 2023

    Revised: 6 September 2023

    Accepted: 9 September 2023

    Published: 20 September 2023


    ![](img/c1925febd7dde400183c23c14d668ef0_90_0.png)


    Copyright: © 2023 by the authors. Licensee MDPI, Basel, Switzerland. This article
    is an open access article distributed under the terms and conditions of the Creative
    Commons Attribution (CC BY) license (https://creativecommons.org/licenses/by/4.0/).


    # 1. Introduction


    With the increasing popularity and advancement of smart textile clothing, a wide
    range of smart clothing products are gaining traction in the market. As a result,
    people have developed multifaceted demands for smart textile clothing with respect
    to its functionalities [1]. Due to the interesting electrical, thermal, and optical
    properties of smart textile garments, among others, a high degree of innovation
    and smart garment potential can be realized, e.g., they can be used simultaneously
    as sensors, heaters, energy generators, and storage devices. Smart textiles and
    clothing products utilize feedback mechanisms to sense changes in both the external
    environment and the human body, allowing for a triangular interaction between
    the wearer, their surroundings, and their garments. This creates an interdependent
    organism. The development of intelligent textile garments requires multi-disciplinary
    technical support and the integration of advanced technologies from various fields,
    including biotechnology, sensor technology, computer science, microelectronics,
    polymer chemistry, and materials science and technology [2–4]. There have been
    numerous studies and reports on wearable technology [5–7], garment design [8–10],
    and smart clothing [11–13] in the context of smart textile garments. The aim of
    this paper is to utilize bibliometric and knowledge mapping theories to identify
    relevant research papers on the subject of smart textiles and clothing that have
    been published by'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'the China Knowledge Network Web of Science (WOS) within the last decade. We
    used CiteSpace 6.2.R4 and VOSviewer 1.6.19 software to analyze the data, aiming
    to understand the research hotspots and trends in the field of smart textiles
    and clothing in China in recent years. Additionally, we provided references for
    future research on this topic.


    # ## 2. Research Methodology and Data Analysis


    # ### 2.1. Research Methodology


    The CiteSpace 6.2.R4 and VOSviewer 1.6.19 software were used to analyze the knowledge
    structure, developmental patterns, and distribution of intelligent textiles and
    garments. A knowledge graph is presented to illustrate the relationship between
    the annual article volume, organizational affiliations, and author collaborations
    in this research field. This graph intuitively reflects the internal relationships
    and trajectories within this field of study while also sorting out its research
    trajectory and future trends [14].


    # ### 2.2. Data Analysis


    The data sources utilized in this study comprise the Web of Science (WOS) core
    collection database, which was searched from 1 January 2012 to 31 December 2022.


    A precise search was conducted in the WOS core collection database for articles
    with subject terms (TS) = “Smart clothing**” or “Smart textiles**”. The retrieval
    strategy is shown in Figure 1. The literature category included papers, reviews,
    and online publications in the English language. The retrieved articles were exported
    in plain text format, including both full records and cited references, resulting
    in 2456 articles. After deduplication processing, 2398 valid pieces of literature
    were obtained.


    ![](img/c1925febd7dde400183c23c14d668ef0_91_0.png)


    Figure 1. Flowchart steps of the search strategy.


    # ## 3. Results and Analysis


    # ### 3.1. Volume of Literature


    The annual article count serves as a visual indicator of the current research
    status and facilitates the identification of developmental trends, which is crucial
    for predicting future directions. Based on the data from the WOS, Figure 2 depicts
    the trend graph of the article counts.


    Figure 2 showed an upward trend in the overall number of WOS database papers from
    2012 to 2022. Specifically, the average annual number of WOS articles is approximately
    218, which has been growing rapidly since 2015, exceeding 200 articles for the
    first time in 2018 and reaching 505 articles in 2021. The growth trend in the
    WOS’s postings since 2017 is apparent, with an average annual growth of 27.7%.'
