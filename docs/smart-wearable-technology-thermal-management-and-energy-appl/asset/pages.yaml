  md: '![](img/c1925febd7dde400183c23c14d668ef0_23_0.png)


    Figure 10. (a) Schematic diagram of evaporative cooling clothing; (b) heat and
    mass transfer processes involved in evaporative cooling [19].


    The evaporative moisture-regulating clothing material has strong water absorption
    properties and good breathability and comfort, which can effectively help sweat
    to be discharged, thus enhancing the effect of evaporative cooling [79]. It is
    worth noting that the effect of evaporative-cooling clothing is greatly affected
    by environment factors, and in high-temperature and high-humidity environments,
    it is difficult to evaporate the moisture inside the clothing, so the effect of
    evaporative cooling will be limited. On the contrary, in an environment with a
    low relative humidity, the effect of evaporative cooling will be better because
    the moisture is easier to evaporate, thus removing body heat [82]. Therefore,
    the advantages of evaporative-cooling garments are that they are light to wear,
    easy to use, simple to manufacture, and suitable for industrial mass production;
    the disadvantages are that the liquid adhering to the inner surface of the garment
    seriously affects the comfort of the human body, inhibits the evaporation of sweat,
    and is more effective in environments with a low relative humidity.


    # (2) Liquid vapor regulation


    As an intermediate layer between the skin and the environment, textiles play a
    critical role in achieving personal comfort and safety by managing the thermal
    and moisture conditions of the localized body. When liquid sweat is in direct
    contact with the moisture-regulating clothing material, liquid sweat is transferred
    through the material in both in-plane and trans-plane directions [83]. Many studies
    have focused on sweat-directed transplanar transfer, i.e., the transfer of liquid
    sweat from the skin to the outer surface of the material to keep the skin dry.
    Many researchers have achieved a directional liquid transfer of materials through
    a fabric structure design by mimicking plant structures [84]. Miao et al. investigated
    sandwich-structured textiles with hierarchical nanofiber networks and Janus wettability,
    as shown in Figure 11 [85]. The human body temperature covered by this sandwich-structured
    textile decreased by about 4.2 °C with rapid sweat evaporation compared to commercial
    cotton textiles. The driving force for the movement of liquid sweat within the
    material was capillary forces, which were influenced by intermolecular forces
    between the liquid and the surrounding fiber surfaces, as well as the size and
    configuration of the space within the textile. Although water transfer in materials
    is accompanied by energy transfer, existing material strategies have paid less
    attention to the energy transfer of liquid sweat. Most material designs for liquid
    sweat conditioning do not quantify or consider the thermal energy transfer involved
    [86]. As shown in Figure 11, sweat can affect cooling efficiency in two ways:
    (I) by increasing the evaporative distance from the skin through cross-plane transfer
    and (II) by increasing the evaporative surface area through in-plane transfer.'
