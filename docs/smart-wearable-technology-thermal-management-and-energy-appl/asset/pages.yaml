- pgno: 133
  md: 'resistance of the fibers, air, and water. The thermal resistance calculation
    formulas for the three factors are [3] (see Equations (3)–(5):


    ```

    Fiber thermal resistance : \( R_f = \frac{h(1 - \varepsilon)}{\lambda_f} \)

    ```


    ```

    Air thermal resistance : \( R_a = \frac{h\varepsilon}{\lambda_a(1 - \mu)} \)

    ```


    ```

    Water thermal resistance : \( R_w = \frac{h\varepsilon}{\lambda_w\mu} \)

    ```


    where \( R_f \), \( R_a \), and \( R_w \) represent the thermal resistance of
    fibers, air, and water, respectively, m²·°C/W. \( \lambda_f \) is the thermal
    conductivity of fiber polymers, W/(m·°C). \( \lambda_a \) is the thermal conductivity
    of air, in W/(m·°C), whereas \( \lambda_w \) is the thermal conductivity of water,
    W/(m·°C). \( \mu \) is the moisture content of the fabric, %.


    The thermal resistance of a fabric in a wet state can be predicted by combining
    the thermal resistance of its fiber, air, and water components in series, parallel,
    or a combination of both. Based on different serial and parallel configurations
    in practice, Mangat et al. [3] summarized eight thermal resistance models for
    wet fabrics (see Equations (6)–(13)). By comparing the predicted results of these
    models with actual measurements, the thermal resistance model with the best correlation
    was finally selected as the theoretical prediction model for thermal resistance.
    The eight thermal resistance models are as follows:


    ```

    Model 1 : \( R_t = R_f + R_a + R_w \)

    ```


    ```

    Model 2 : \( R_t = (R_f^{-1} + R_a^{-1} + R_w^{-1})^{-1} \)

    ```


    ```

    Model 3 : \( R_t = \frac{R_a \cdot R_f}{R_a + R_f} + R_w \)

    ```


    ```

    Model 4 : \( R_t = \frac{R_f \cdot R_w}{R_f + R_w} + R_a \)

    ```


    ```

    Model 5 : \( R_t = \frac{R_a \cdot R_w}{R_a + R_w} + R_f \)

    ```


    ```

    Model 6 : \( R_t = \frac{R_w(R_a + R_f)}{R_a + R_w + R_f} \)

    ```


    ```

    Model 7 : \( R_t = \frac{R_a(R_w + R_f)}{R_a + R_w + R_f} \)

    ```


    ```

    Model 8 : \( R_t = \frac{R_f(R_w + R_a)}{R_a + R_w + R_f} \)

    ```


    Among the eight models summarized by Mangat et al. [3], Models 1 and 2 represent
    the predicted thermal resistance values by Mangat et al. [3], Models 1 and 2 represent
    the predicted thermal resistance values for fiber, air, and water in direct series
    and in parallel and therefore should be excluded from consideration when selecting
    the optimal thermal resistance model. In their subsequent experiments, Mangat
    et al. validated the accuracy of the above models in predicting the thermal resistance
    of a single-layer knitted fabric at different levels of moisture content. The
    results showed that Model 3 in their model group had a good correlation with a
    certain twill cotton fabric tested, whereas Models 5 and 7 exhibited the best
    consistency with all experimental data and were applicable to different types
    of knitted fabrics.'
