  md: '# Current Research Status and Development Trends of Cooling Suits in High-Temperature
    Mine Environments: A Review


    Yu Ma 1, Qing Wan 1, Zidan Gong 2, Yiwei Wu 1 and Jie Zhou 1,*


    1 School of Apparel and Art Design, Xi’an Polytechnic University, Xi’an 710048,
    China; 20120710@xpu.edu.cn (Y.M.); 15150957135@163.com (Q.W.); jackzx603@gmail.com
    (Y.W.)

    2 Sino German College of Intelligent Manufacturing, Shenzhen Technology University,
    Shenzhen 518118, China; gongzidan@sztu.edu.cn

    * Correspondence: zhoujie@xpu.edu.cn


    Abstract: To gain a deeper understanding of the current research status of cooling
    suits in high-temperature mines, this paper provides separate introductions to
    vest-type cooling suits and full-body cooling suits. It summarizes the categories
    of cooling suits based on different cooling media and systematically elucidates
    the advantages and disadvantages of each type. The paper also analyzes the current
    application status of cooling suits in mine environments. It suggests that the
    future research directions for cooling suits in mines include the miniaturization
    of components, intelligent temperature control, optimization of new phase-change
    materials, development of cooling fabrics, and research in smart fibers.


    Keywords: cooling suit; thermal comfort; phase-change materials; high-temperature
    mine environment


    # 1. Introduction


    Currently, China possesses billions of tons of coal resources in need of extraction.
    Coal resources have made a significant contribution to China’s economic and social
    development. However, as the depth of mining increases year by year, reaching
    from several hundred meters to a thousand meters, the temperature in mines is
    also rising. It can reach up to 40 °C, which greatly impacts the miners [1]. Due
    to limited space underground, the heat generated by surrounding rocks, compressed
    air, and mechanical and electrical equipment cannot be dissipated, resulting in
    a gradual deterioration of the thermal environment in mines. Thermal hazards in
    mines are widespread. Therefore, it is crucial to lower the temperature in the
    mining environment.


    Methods for preventing and controlling heat hazards in mines can be broadly categorized
    into two main types: traditional cooling techniques and individual cooling suits.
    Traditional cooling techniques primarily rely on ventilation to achieve lower
    temperatures. This is achieved by controlling parameters such as the airflow speed,
    volume, and temperature underground to achieve the desired cooling effect [2].
    However, this method has certain limitations, and the cooling effect may not be
    very pronounced. To meet the demand for thermal comfort of personnel working in
    high-temperature mine environments, improve their work efficiency, and ensure
    work quality, the development of individual cooling suits has come into the view
    of researchers [3]. Individual cooling suits have the capability to regulate the
    microclimate temperature between the human body and the clothing. They exhibit
    high cooling efficiency, leading to effective temperature reduction and ultimately
    enhancing the thermal comfort of mine workers. Therefore, herein existing individual
    cooling suits have been classified and summarized. Initially, from a structural
    perspective, they are divided into vest-type cooling suits and full-body cooling
    suits. Upon analysis and comparison, it is evident that vest-type cooling suits
    are more suitable for wearing in mining operations. They are easy to put on and
    take off, facilitate movement, and provide good cooling effects. Based on their
    different cooling principles, the cooling'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'suits are further categorized into gas-based cooling suits [4], liquid-based
    cooling suits [5], phase change cooling suits [6], and hybrid cooling suits [7].
    This paper concludes and summarizes the working principles, advantages, disadvantages,
    and feasibility of using various types of cooling suits in underground mines.
    The strengths and weaknesses of different cooling suits are analyzed. Finally,
    recommendations are made for the future development of cooling suits for mining
    applications.


    # ## 2. Human Thermal Comfort


    After a person puts on clothing, a small climate is formed between the surface
    of the body and the outermost layer of clothing, known as the clothing microclimate.
    The comfort of this microclimate is closely related to human comfort. Temperature
    and humidity are important indicators for evaluating thermal comfort. The relationship
    between the clothing microclimate and human thermal comfort is shown in Figure
    1. As shown in the figure, when the temperature of the clothing microclimate is
    between 31 °C and 33 °C, and the relative humidity is between 40% and 60%, the
    person feels comfortable. According to the ISO 7730-2005 “Ergonomics of the Thermal
    Environment” standard, human thermal comfort is defined as the subjective thermal
    environment evaluation made by a person in the surrounding environment. Thermal
    comfort occurs when the heat production and dissipation of the human body are
    in balance. However, in mining environments, the airflow between the underground
    environment and the outside world is weak, which severely affects evaporative
    and convective heat dissipation. Therefore, heat-related issues in mines significantly
    impact the thermal stability of mine workers, posing a threat to their health.
    To address the issue of cooling the human body in a hot environment, a method
    is proposed for mine workers to wear cooling suits in high-temperature mining
    environments. By regulating the heat in the clothing microclimate, the goal is
    to achieve thermal balance and thermal comfort for the human body. Factors affecting
    human thermal comfort include aspects related to the human body, clothing, and
    the environment [8]. The relationships between the human body, the environment,
    and the cooling suit during wearing are illustrated in Figure 2. For mine workers,
    it is challenging to control the intensity of activities and the environmental
    temperature underground. However, utilizing cooling suits to reduce the generation
    of body heat and facilitate heat dissipation is an effective approach.


    ![](img/c1925febd7dde400183c23c14d668ef0_78_0.png)


    Figure 1. Relationship between clothing microclimate regions and human thermal
    comfort.'
