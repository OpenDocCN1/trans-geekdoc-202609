  md: '# 2. Active Heating with Textiles


    Active heating always requires energy, usually either in the form of electric
    energy or as latent heat stored in PCMs or subcooled liquids, whereupon the latter
    are usually not applied in textile fabrics but in simple heat pads activated by
    buckling a metal sheet. Here we give an overview of different ways of active heating
    with textile fabrics.


    # 2.1. Phase-Change Materials


    Phase-change materials can be integrated into textiles in the form of fibers,
    microcapsules or nanocapsules [18–20]. PCMs store a large amount of latent heat
    when molten and release it during solidifying [21]. This process, as shown in
    Figure 1, makes them especially interesting for textiles used in environments
    with fluctuating temperatures, e.g., for astronauts’ space suits [22]. During
    melting or crystallization, the temperature of the PCM remains approx. constant.
    During an increase in temperature, the PCM can absorb heat that is stored in the
    liquefied phase, while decreasing external temperatures will lead to the release
    of this stored heat energy by the solidification of the PCM [23].


    ![](img/c1925febd7dde400183c23c14d668ef0_37_0.png)


    Figure 1. Schematic representation of phase-change process. Reprinted from [22],
    Copyright 2008, with permission from Elsevier.


    Different materials have not only different temperature ranges for storing and
    releasing heat but also different energy storage properties. While water at 0
    °C or even 100 °C can also be regarded as a PCM, several materials provide much
    higher energy storage capacity combined with high thermal conductivity in a suitable
    temperature range [24]. For paraffin waxes, Farid et al. reported melting temperatures
    of 44–64 °C and latent heats of 167–210 kJ/kg [25]. A better suitable temperature
    range of 30–65 °C was found for fatty acids, which could store latent heat of
    153–182 kJ/kg [26]. Glauber salt has a melting temperature of 32 °C, a high latent
    heat of 254 kJ/kg and is an inexpensive material but shows problems with phase
    segregation, similar to most other hydrated salts [27].


    Amongst the potential problems with using PCMs for active heating/cooling, the
    usually very low thermal conductivity should be mentioned [28]. To increase their
    thermal conductivity, metallic or graphitic nano- or microstructures can be embedded
    in the PCM, whereupon too much additional conductive material would reduce the
    specific energy storage capacity [29,30].


    Depending on the environmental conditions, this range of energies stored as latent
    heat defines how long a PCM can maintain its melting/solidifying temperature,
    naturally scaling with the mass of PCM included in a garment. However, the calculation
    is less simple than may be expected. For a PCM inside a spherical capsule of approx.
    100 mm diameter, Tan et al. compared experimental observations during melting
    with a computational approach [31]. They found thermally stable structures at
    the top of the capsule, while unstable structures were found at the bottom of
    the capsule, as depicted in Figure 2a, leading to clear differences in the calculated
    and measured temperatures, especially in the lower half of the capsule, as visible
    in Figure 2b [31]. Besides, calculations with different numerical simulations
    may lead to slightly varying results [32]. In addition, even small changes in
    the melting temperature near the environmental temperature will lead to large
    changes in the additional necessary energy to keep a defined temperature [33].
    Besides the melting temperature, thermal conductivity was found to have the largest
    influence'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'on the cooling energy demand [34]. Due to these potential sources of relatively
    large errors, this review will concentrate on the measured effects of PCMs in
    garments in cold environments reported in different studies instead of extrapolating
    the measured findings to other environmental situations.


    ![](img/c1925febd7dde400183c23c14d668ef0_38_0.png)


    Figure 2. (a) Thermally stable and unstable layer structures along the symmetry
    axis; (b) comparison of the computed and measured temperatures at point B at a
    distance of 0.369 diameters below the center. Blue areas depict the cold, unmolted
    solid phase, while red areas are hot, molten liquid. Reprinted from [31], Copyright
    2009, with permission from Elsevier.


    # 2.2. Joule Heating


    The most often used possibility for converting electrical energy into heat is
    based on the so-called Joule heating, also called resistance heating or electro-thermal
    conversion [35]. Theoretically, the heating power P can simply be calculated by
    the Joule-Lenz law as P = RI² = U²/R, with the resistance R and the current I
    flowing through it. The thermal energy QW is equal to the electrical energy Eel
    and can be calculated as the integral over P, or in the case of time-independent
    power, it becomes QW = Eel = Pt with the duration t of heating [17]. This means
    that conductive materials are necessary for electro-thermal conversion, such as
    intrinsically conductive polymers or polymers filled with metallic nanoparticles,
    graphene, graphite, carbon nanotubes, carbon black or, nowadays, MXenes [17].
    For use in garments, all of them have specific challenges, such as relatively
    low conductivity and missing long-term stability of conducting polymers, health
    risks posed by metallic nanoparticles and MXenes, or low washing resistance of
    graphene and other materials [17]. Nevertheless, Joule heating is a very often
    studied method for producing clothing with active heating. It should be mentioned
    that while the resistance of the heating circuit in a textile fabric is essential
    for the heating power, this value is often not given or only partly given as linear
    resistance of a yarn or sheet resistance of a coating whose thickness may be different
    in different areas of a garment. This makes calculations of the heating power
    and necessary energy often complicated or even impossible.


    # 2.3. Peltier Element Heating


    Peltier elements are based on the Peltier effect, or thermoelectric effect, which
    converts electrical energy into a temperature gradient inside a semiconducting
    material [36]. Several factors influence the figure of merit, which defines the
    performance of organic, inorganic or hybrid Peltier materials, which should have
    low thermal conductivity, high electric'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'conductivity and a high Seebeck coefficient [37]. Due to the interconnections
    between these parameters, optimization is not straightforward but necessitates
    complicated methods such as strengthening phonon scattering [38], band engineering
    [39] or nanostructuring materials [40].


    It must be mentioned that, unlike Joule heating textiles, Peltier elements do
    not heat up through the whole material but have one warmer and one cooler side.
    Schmidl et al., e.g., prepared Al-doped ZnO-coated polyester spacer fabrics and
    measured a temperature difference between both sides of the spacer fabric of up
    to 12 K, which was converted upon changing the polarity of the electrical contacts
    [41]. This fact must be taken into account when an active heating garment based
    on Peltier elements is created. On the other hand, Peltier elements in clothing
    offer heating and cooling depending on the polarity of the applied voltage, making
    them highly suitable for varying weather conditions [42].


    # 3. Energy-Harvesting Textiles


    While PCMs store thermal energy received from the environment in the form of latent
    heat, electrically heated textiles need to harvest and store energy that can be
    used for active heating. Mainly, such devices are based on triboelectric nanogenerators
    (TENGs), solar cells and thermoelectric devices [43], but there are also other
    mechanisms integrated into different smart textiles to harvest body heat energy,
    biochemical energy, etc. [44]. This section gives an overview of potential methods
    of harvesting energy by clothing.


    # 3.1. Triboelectric Nanogenerator


    When a person is moving, this mechanical energy can principally be harvested by
    a triboelectric (nano)generator (TE(N)G) [45]. Movements of the human body, such
    as walking or arm movements, offer several ten watts of kinetic power [46]. A
    TENG can be used to transfer movements into contact electrification and electrostatic
    induction, in this way harvesting energy from human motion [47,48]. Generally,
    a TENG consists of two materials with different electron affinity, resulting in
    electrostatic induction when these materials are coupled and moved relative to
    each other during body movements [49]. This induced potential difference can be
    reduced by a current through a load connecting the electrodes attached to the
    triboelectric materials, thus resulting in an AC power output for a periodic movement
    [49]. Depending on the positioning and movement of triboelectric materials and
    electrodes, TENGs can be separated into vertical contact-separation mode, lateral
    sliding mode, single-electrode mode and freestanding triboelectric-layer modes,
    as depicted in Figure 3 [49]. Most textile-based TENGs work in the vertical contact
    separation mode due to the ease of embedding them into shoe insoles or other textiles
    that are steadily pressed or stretched [49].


    The first textile-based realizations of TENGs were based on coated yarns, e.g.,
    one with carbon nanotubes and the other one with polytetrafluoroethylene (PTFE),
    to convert motion or vibration energy into electric energy by the electrostatic
    effect, leading to relatively small output power densities of ~1 mW/m² [50]. A
    similar value of 1.8 mW/m² was reported for alternating polyimide (PI)/polyurethane
    (PU) strips on a sleeve and alternating polydimethylsiloxane (PDMS)/aluminum strips
    on the torso for a movement frequency of 1.5 Hz [51]. Slightly higher power densities
    of 27 mW/m² were reported for a TENG that combined shear-thickening fluid and
    magneto-sensitive films, in this way adding impact-resistant properties [52].
    A much higher power density of 953 mW/m² was found for a single-thread TENG, produced
    using a stainless-steel core with a silicone rubber shell and placed on a textile
    in a sine-like shape [53]. An approx. doubled power density of 2 W/m² was found
    for a PEDOT:PSS-coated textile and PTFE under foot stepping with a frequency of
    2 Hz [54]. Still higher values of 3.2 W/m² were found for a freestanding triboelectric-layer
    TENG prepared from Ni-coated electrodes and a parylene triboelectric layer [55].
    Even 8.9 W/m² was reached by a TENG in which the palm skin was used as a freestanding
    triboelectric layer and a silicone rubber- and Ni-coated polyester woven fabric
