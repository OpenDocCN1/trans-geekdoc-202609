  img_proc: true
- pgno: 118
  md: 'where \(\lambda\) is the thermal conductivity of the fabric, W/(m·°C); \(Q\)
    is the heat passing through the body, J; \(h\) is the measured thickness of the
    fabric, m; \(S\) is the area through which the heat passes, m\(^2\); \(t\) is
    the flow time, s; \(\Delta T\) is the temperature difference in the direction
    of heat conduction, °C; \(b\) is the thermal absorption coefficient of the fabric,
    Ws\(^{1/2}\)/(m\(^2\)·°C); \(c\) is the specific heat capacity of the fabric,
    J/(kg·°C); and \(\rho\) is the volume density of the fabric, kg/m\(^3\).


    As shown in Equation (2), the thermal absorption coefficient of the fabric is
    determined using three parameters: thermal conductivity, volume mass, and specific
    heat capacity. The larger the thermal absorption coefficient of the fabric, the
    stronger its heat absorption capacity, the more heat is lost when it comes into
    contact with the skin, and the better the coolness of the fabric. Conversely,
    if the thermal absorption coefficient of the fabric is small, the warming sensation
    of the fabric will be better. The actual thermal absorption coefficient of dry
    textiles usually ranges from 30 to 300 Ws\(^{1/2}\)/(m\(^2\)·°C) while for wet
    fabrics, the thermal absorption coefficient can even exceed 500 Ws\(^{1/2}\)/(m\(^2\)·°C)
    due to the high thermal conductivity and specific heat capacity of water [9].
    The thermal absorption coefficient can only reflect the thermal transfer performance
    of the fabric in a steady-state environment and cannot reflect the dynamic heat
    transfer process when the fabric comes into contact with the skin.


    # 2.2. Subjective Evaluation Methods


    Objective evaluation methods have the advantages of strong repeatability and ease
    of operation. However, the coolness of fabrics is fundamentally a subjective sensation
    of human comfort, which can vary among individuals due to factors such as sensitivity
    to temperature and physical health conditions. Therefore, there is currently no
    accurate physical quantity that can directly measure the coolness of fabrics.
    Subjective evaluation is the most commonly used method for evaluating fabric comfort
    and mainly involves collecting subjects’ feelings about fabric contact through
    questionnaire surveys and rating them based on subjective evaluation levels [16].
    This can specifically express subjects’ sensory perceptions of fabrics. Subjective
    evaluation methods mainly involve measuring the coolness sensation of a fabric
    when it comes into contact with the skin by directly touching the inner forearm
    of the subjects. Previous research has shown that the perception of heat sensation
    is similar between the forearm and the back, making it a more convenient option
    than directly measuring the coolness sensation by wearing the fabric. To accurately
    express the coolness of fabrics, a psychometric scale can be adopted to divide
    the human subjective sensation into levels and assign corresponding values, thereby
    quantitatively evaluating such qualitative issues [17]. In this study, the coolness
    levels of fabrics were divided into five levels based on a five-level psychometric
    scale. Level A indicated no coolness (\(x_1 = 1\)), level B indicated a slight
    coolness (\(x_2 = 2\)), level C indicated a general coolness (\(x_3 = 3\)), level
    D indicated an obvious coolness (\(x_4 = 4\)), and level E indicated a strong
    coolness (\(x_5 = 5\)). Subjects rated the fabric based on their feelings following
    contact between the fabric and the inner forearm. The number of ratings for each
    level was used as the weight for each level, which was denoted as \(\omega_1,
    \omega_2, \omega_3, \omega_4\), and \(\omega_5\), respectively. The formula for
    the weighted average of the coolness of the fabric is:


    ```

    \(x_i = \frac{x_1 \omega_1 + x_2 \omega_2 + x_3 \omega_3 + x_4 \omega_4 + x_5
    \omega_5}{\omega_1 + \omega_2 + \omega_3 + \omega_4 + \omega_5} \quad (i = 1,
    2, \cdots, 20)\)

    ```


    # 2.3. Coolness Sensation Level Classification


    Fuzzy mathematics is based on fuzzy set theory [18], which is used to describe
    sets that are not clearly defined. The fuzzy comprehensive evaluation method is
    adopted to classify thermal absorption coefficient values of fabrics into membership
    degree levels. First, establish the evaluation factor object set \(U = |u_1, u_2,
    u_3, \dots, u_i|\) (\(i = 1, 2, \dots, n\)), where the evaluation object \(u_i\)
    is the thermal absorption coefficient \(b_i\). Second, establish the evaluation
    level set \(V = |v_1, v_2, v_3, \dots, v_j|\) (\(j = 1, 2, \dots, n\)), where
    the evaluation level, \(v_i\), is the coolness level of the fabric. Finally, by
    performing the membership degree function operation, the'
