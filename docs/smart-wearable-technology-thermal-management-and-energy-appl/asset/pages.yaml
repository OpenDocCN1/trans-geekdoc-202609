  md: "# 4. Limitations\n\nThe present study attempted to conduct a comprehensive\
    \ bibliometric analysis of papers related to intelligent textile clothing from\
    \ 2012 to 2022. Although this paper presents some meaningful findings, there are\
    \ some limitations. Due to the formatting requirements of the CiteSpace 6.2.R4\
    \ software, all the data were retrieved and downloaded from the Web of Science\
    \ database, excluding other databases such as CNKI and Wanfang. Additionally,\
    \ we have restricted the indexing, article type, and language type of the search,\
    \ which may result in the omission of some high-quality articles. However, we\
    \ believe that the volume of data retrieved is large enough to adequately reflect\
    \ the current state of the research.\n\n# 5. Conclusions\n\nA combination of bibliometric\
    \ and knowledge mapping analysis methods was used to reveal the multidimensional\
    \ structure and network relationships of relevant research in the field of smart\
    \ textiles and garments based on the WOS database. The main conclusions are as\
    \ follows:\n\n+   (1) In terms of the number of published papers and countries\
    \ represented, the WOS has seen a steady increase in publications since 2015,\
    \ with particularly rapid growth observed after 2017 in terms of the number of\
    \ published papers and countries represented. The United States has maintained\
    \ close collaborations with other countries and regions, followed by China, which\
    \ has also emerged as a leading contributor to global research output in recent\
    \ years.\n+   \n+   (2) From the perspectives of the authors and institutions,\
    \ the WOS database research institutions are very close, with institutions such\
    \ as the University of Boras, Sweden, Sungkyunkwan University, Korea, and the\
    \ University of Manchester, UK, forming the central collaborative forces. Among\
    \ them, scholars such as Li, Yi, Qu, Lijun, Jin, and Lu form the core group of\
    \ authors, whose research concentration and intensity of cooperation are greatest.\n\
    +   \n+   (3) Based on the journals and citations, SCIENCE and ADV MATER are the\
    \ authoritative journals in the field in the WOS database, and together with journals\
    \ such as ACS APPL MATER INTER, NANO LETT, and ADV FUNCT MATER, they constitute\
    \ the top journals in the field. The most cited paper was written by the Stoppà\
    \ M. group, which had a significant influence. It can be seen from the citation\
    \ explosion that research in this field focuses on flexible, sensitive strain\
    \ sensors, supercapacitors, integrated microelectronic systems, and functional\
    \ textiles.\n+   \n+   (4) Based on the analysis of keyword co-occurrence, the\
    \ keywords in the WOS database have a high frequency of occurrence and diversified\
    \ research topics. The overall intensity of keywords for smart textiles and clothing\
    \ in the WOS database is large, and there is a significant difference in intensity\
    \ among the emergent words. The literature in the WOS database focuses more on\
    \ the manufacturing of electronic components and smart fibers and polymers in\
    \ smart textiles and clothing. Therefore, future research on electronic component\
    \ manufacturing and smart fibers and fabrics in the field of smart textiles and\
    \ apparel is expected to be the focus of attention.\n+   \n+   (5) From the point\
    \ of view of research hotspots and stage characteristics, the research hotspots\
    \ in the WOS in recent years have been more diverse, involving yarn supercapacitors,\
    \ biomaterials, carbon nanotubes, wearable strains, and electronic skin. Future\
    \ research is expected to pay more attention to the intelligence of fibers and\
    \ fabrics and the accurate detectability of electronic components. This work will\
    \ strengthen the development of intelligent core technology, which will also be\
    \ a key focus in the future.\n\nAuthor Contributions: T.W. and C.L. designed the\
    \ study. J.Z. and A.W. collected the data. C.L., T.W. and A.W. re-examined the\
    \ data. T.W., C.L. and A.W. analyzed the data. T.W. and C.L. wrote the manuscript.\
    \ A.W. and J.Z. reviewed and revised the manuscript. All authors have read and\
    \ agreed to the published version of the manuscript."
