    # 4.4. Performance Comparison under Different Subcooling Degrees


    Figure 6 shows the performance comparison of the FTVC and SVIC under different
    condensation subcooling degrees. As shown in Figure 6a, the COPs of FTVC, SVIC-0
    and SVIC-5 decrease with the increase in condensation subcooling degree; however,
    the COPs of SVIC-10 and SVIC-20 decrease first and then increase with the increase
    in condensation subcooling degree. The explanation for this phenomenon is that
    while the condensation subcooling degree increases, the initial temperature of
    refrigerant flowing into the subcooler or flash tank decreases, which causes the
    decrease in injection mass flow ratio and COP at a constant injection vapor pressure.
    On the other hand, the heat capacity increases with the increase in condensation
    subcooling degree, which leads to the increase in the COP. The joint action of
    two factors causes the trend in the COP. From Figure 6b, the injection mass flow
    ratio decreases sharply as the condensation subcooling degree increases. When
