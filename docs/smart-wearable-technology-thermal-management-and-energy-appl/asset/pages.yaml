    # ## 3.7. Keywords Analysis


    This paper used VOSviewer 1.6.19 to visualize keywords in the literature and employed
    a keyword co-occurrence analysis to explore research hotspots in smart textiles
    and apparel. To gain a deeper understanding of this field, we constructed visual
    maps for 2398 English literature, as shown in Figure 6.


    The keywords were analyzed based on literature indexed in the Web of Science database.
    The most frequently occurring terms included smart textiles, fibers, performance,
    sensors, composites, textile design, fabrication techniques, and nanocomposites.
    After excluding self-referential terms, the frequently occurring keywords included
    fibers, performance, sensors, composites, design, fabrication, and nanocomposites.
    Based on these identified keywords, it is evident that research on smart textiles
    and clothing can be classified into two distinct directions. The first direction
    pertains to material development, which includes smart fiber materials [49,50]
    such as composite materials, nanocomposites, phase change fibers, and shape memory
    fibers. The chemical fibers can be purified and deodorized by adding nano-level
    ZnO, SiO2, or other chemicals. Adding nanometer-sized ZnO to polyester fiber can
    increase the material’s anti-ultraviolet and anti-bacterial abilities. Adding
    nano-sized metal particles to the chemical fibers can enhance the antistatic ability
    of the material. Adding nanoscale silver ions to the chemical fibers can enhance
    the material’s'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'own bactericidal ability. In addition, adding carbon black nanoparticles to
    rubber materials can also greatly improve the strength and anti-wear properties
    of rubber materials, thereby improving their service life. The second aspect concerns
    garment design, which involves dividing smart garment design into areas such as
    garment structure and fabric elasticity to create functional garments that address
    specific issues [51].


    ![](img/c1925febd7dde400183c23c14d668ef0_97_0.png)


    Figure 6. WOS keyword co-occurrence map.


    A keyword clustering analysis facilitates the identification of relevant studies
    in a given field. A visual clustering analysis of these keywords was conducted
    using the LLR test algorithm within the CiteSpace 6.2.R4 software. We identified
    the key research areas in intelligent textiles and clothing from 2012 to 2021,
    and their clustering is illustrated in Figure 7.


    ![](img/c1925febd7dde400183c23c14d668ef0_97_1.png)


    Figure 7. Keyword clustering map.


    The clustering module (Q) for the WOS literature keywords is 0.768, with an average
    contour value (S) of 0.906, as depicted in Figure 7. The top nine keywords with
    the highest frequency are “wearable electronics”, “smart textiles”, “flexible
    antennas”, “energy storage”, “textile actuators”, “mechanical properties”, “asymmetric
    supercapacitors”, “carbon nanotubes,” and “fiber extrusion”. It can be seen that
    the English literature also focuses on smart wearable products and smart textiles.
    English literature places more emphasis on mechanical properties, capacitors,
    and other electronic devices in smart textiles and garments. This indicates that
    the interaction design between electronic devices and clothing is a research hotspot.'
