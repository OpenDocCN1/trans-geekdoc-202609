- pgno: 105
  md: 'air-cooling systems are impractical in environments with highly contagious
    infections as they require air intake from the surroundings. Considering the limitations
    of phase-change cooling vests, liquid cooling garments, and air-cooling systems,
    Lou et al. [20] developed a novel and lightweight wearable cooling and dehumidifying
    system (WCDS) for use in hazardous environments to reduce skin wetness and improve
    thermal comfort.


    When examining the effects of personal cooling garments on healthcare professionals,
    it is crucial to differentiate between thermal sensation and thermal comfort.
    Thermal sensation refers to an individual’s immediate perception of coldness or
    warmth, which is subjective and can vary among individuals. In contrast, thermal
    comfort is a state of mind that indicates contentment with the surrounding thermal
    environment, taking into account both physiological and psychological aspects.
    Although thermal sensation is an essential aspect of thermal comfort, it is not
    the only determining factor. For example, a healthcare worker may experience a
    neutral thermal sensation while wearing PPE but still feel uncomfortable due to
    skin wetness caused by sweating. Consequently, when assessing the effectiveness
    of personal cooling garments, it is necessary to consider both thermal sensation
    and thermal comfort.


    Previous studies have not considered the specific challenges posed by the use
    of PPE during a pneumonia outbreak. Furthermore, the precise psychological and
    physiological effects of wearing WCDS under personal cooling garments in real
    working conditions have not been adequately investigated. To address this gap,
    additional research is necessary to gain a comprehensive understanding of the
    psychological and physiological impact of WCDS in the working environment, which
    will facilitate optimal design and improved performance. Therefore, this study
    was conducted to evaluate the physiological and psychological impact of a newly
    designed cooling suit on healthcare workers. The study analyzed the impact of
    WCDS on the thermal comfort of healthcare workers by monitoring skin temperature,
    core temperature, and heart rate. Additionally, a subjective evaluation questionnaire
    and a wearing trial, which included assessments of wearing comfort and movement
    comfort, were administered. The aim was to obtain a comprehensive assessment of
    the effectiveness of the WCDS application by examining the thermal perception,
    physiological responses, and wearing comfort of healthcare workers. This research
    provides valuable insights for the design of future PPE and contributes to enhancing
    the occupational environment for those on the healthcare frontlines.


    # 2. Methods


    # 2.1. Participants


    Eight healthy male college students voluntarily participated in the study. The
    participants had a mean age of 27 ± 2.1 years, height of 178.3 ± 2.2 cm, weight
    of 69.6 ± 3.6 kg, BMI of 21.8 ± 1.3 kg/m², and body surface area of 1.8 ± 0.1
    m². Before participation, each participant was comprehensively informed about
    the experimental procedure and potential risks and provided written informed consent.
    None of the participants had a history of heat-related illness, cardiovascular,
    metabolic, or respiratory disease. Additionally, they were instructed to refrain
    from consuming tea, coffee, or alcohol for at least 24 h prior to each test. The
    Human Subjects Ethics Sub-Committee of the Hong Kong Polytechnic University approved
    the experimental procedures under protocol number [HSEARS202105140003].


    # 2.2. Clothing


    The wearable cooling and dehumidifying system (WCDS) (Figure 1), developed by
    Lou et al. [20], is intended for use in hazardous and infectious environments
    without compromising the protective capabilities of personal protective equipment
    (PPE). The system is designed as a knitted vest with an embedded tube that provides
    cooling air. During each test, participants wore a standard PPE ensemble recommended
    for use during the COVID-19 pandemic, which included a surgical mask, eye protection,
    a Dupont Tyvek 600 (Tyvek 600 Plus, Dupont, Wilmington, DE, USA) plus coverall
    as a protective gown, and gloves. In addition to the PPE, subjects wore basic
    undergarments consisting of'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'a t-shirt, trousers, underwear, and socks [21]. The WCDS was worn underneath
    the protective clothing. Prior to the human trials, all garments, including the
    cooling ones, were conditioned in a climatic chamber for 24 h.


    ![](img/c1925febd7dde400183c23c14d668ef0_106_0.png)


    Figure 1. Wearable cooling and dehumidifying system (WCDS).


    # 2.3. Protocol


    The study took place in a climatic chamber set to 23 °C, 50% relative humidity,
    and an air velocity of 0.1 m/s, simulating the conditions of a clean workroom
    in a Hong Kong hospital. Participants underwent two 120 min experimental trials:
    one with a cooling garment (cooling) and a control trial (without cooling). Initially,
    subjects were given a 30 min acclimatization period in the chamber, during which
    they were briefed on the test procedures and the interpretation of perceptual
    rating scales. Following this, they were instructed to change into the provided
    attire and were equipped with monitoring instruments. For 60 min, the participants
    walked on a treadmill at a speed of 3.0 km/h, representing a typical work intensity
    level [22] (Figure 2). After a 30 min recovery period, they removed their clothing
    and equipment and exited the chamber. To ensure safety, the test was immediately
    terminated if any of the following conditions were met: (1) the subject’s core
    temperature exceeded 38 °C, (2) the heart rate surpassed 95% of the average maximum
    heart rate, or (3) the subject expressed a desire to stop due to volitional fatigue.
    In such cases, subjects were scheduled to retake the same test during their next
    visit. It is important to note that participants had the option to stop the test
    at any time for any reason.


    ![](img/c1925febd7dde400183c23c14d668ef0_106_1.png)


    Figure 2. A subject wearing the WCDS walking on a treadmill.'
