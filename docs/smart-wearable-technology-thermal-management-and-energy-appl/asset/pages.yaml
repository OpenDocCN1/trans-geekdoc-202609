  md: 'By importing the data into Gephi 0.9.7 and utilizing Scimago Graphica software
    for timeline graphical analysis of literature keywords, we can correlate and analyze
    different clusters over time, illustrating the development and coherence of research
    content within each cluster. This approach clearly demonstrates trends in intelligent
    textile and clothing research.


    A time zone map provides a view that represents the evolution of knowledge in
    the time dimension, which can intuitively show the changes and mutual influences
    of research hotspots [52]. In the time zone diagram of WOS keywords, as depicted
    in Figure 8, the literature clustering of smart textiles, carbon nanotubes, sensors,
    and wearable devices continue to be the present throughout the time span and have
    good time continuity. The pivotal node of smart textiles emerged in 2012. The
    most frequently cited literature on this topic within the experimental database
    [53] reveals that researchers have developed a flexible and stretchable electronic
    circuit technology that integrates electronic systems into elastomeric materials
    to produce complex functional, stretchable, and flexible electronic modules. The
    primary focus in 2013 was on biological materials. Since 2015, yarn supercapacitors
    have become a prominent topic in the field and are expected to remain so until
    2022. In summary, research on smart textiles and carbon nanotubes began in 2012.
    Carbon nanotubes can optimize the cooperative loss mechanism of multiple components
    and the absorbing performance by combining with magnetic metals and metal compounds.
    This is an effective ways to achieve thinness, a light weight, a wide frequency
    band, and strong absorption of the absorbing materials. For example, using cellulose
    fibers as raw materials can realize the preparation of carbon nanotube absorbing
    materials. Using carbon nanotubes and metal materials as functional particles,
    textile absorbing materials can be prepared through electrospinning and finishing
    [54]. The timeline of smart materials research shows that in 2013, there was a
    notable focus on this area. Starting in 2014, there has been a focus on wearable
    electronics and energy storage within the realm of smart textile and clothing
    research. The research focus in 2015 was mainly on posture pressure, while from
    2016 to 2018, the emphasis shifted towards wearable strain sensors and 3D printing,
    both of which are within the scope of intelligent textile clothing research. From
    2019 to 2022, the main directions for intelligent textile clothing research will
    include shape memory and electronic skin development, as well as wearable strain
    sensing. The term “emergent keyword” refers to a word that experiences a sudden
    increase in frequency within a specific time period, with the growth rate of this
    word intensifying. This intensity can serve as an indicator of research hotspots
    and trends during the aforementioned period. By utilizing CiteSpace 6.2.R4 software
    to track emerging keywords in the literature from the WOS, we can gain insights
    into the evolutionary dynamics of research hotspots in intelligent textiles and
    clothing, ultimately enabling us to predict future development trends.


    Figure 9 displays the emerging foreign research terms in the field of smart textiles
    and clothing from 2012 to 2022. By conducting a keyword emergence analysis of
    the WOS literature, we identified a total of 15 keywords with the highest emergence
    intensity. These can be roughly divided into two phases based on time: (1) From
    2012 to 2018, fifteen emerging research hotspots were identified, including “circuit”,
    “smart fabric”, “yarn supercapacitor”, and “flexible supercapacitor”. Among these
    hotspots, the research on “yarn” has been continuously pursued for three to four
    years. Currently, foreign scholars are focusing their attention on smart fabrics
    and electronic components. Smart textile garments use yarn supercapacitors as
    energy storage devices. Large, high-stretch yarn electrodes are manufactured using
    CNI impregnation and PPy electrodeposition processes [55]. Flexible supercapacitors
    have unique advantages in terms of flexibility, shape, and weight due to the development
    of carbon-based materials, composite materials, and flexible micro-supercapacitors
    [56,57]. In addition, research on smart fabrics has made a significant contribution
    to the development of smart clothing. For example, superhydrophobic-coated fabrics
    have facilitated the creation of smart oil and water separators, microfluidic
    valves, and chip experimental devices [58]. (2) In the years 2019–2022, foreign
    scholars primarily focused on the development of pressure sensors in wearable
    devices and conductive textile'
