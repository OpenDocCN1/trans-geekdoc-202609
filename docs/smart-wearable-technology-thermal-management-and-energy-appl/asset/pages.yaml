- pgno: 150
  md: 'As shown in Figure 3a [23], rectangular electrodes were directly embroidered
    onto the front and back of the garment near the xiphoid process. The electrode
    placement was chosen to align with the areas of the abdomen that exhibit the most
    significant volume changes during respiration. To prevent any obstruction to breathing
    during measurements, the connector was positioned at the bottom hem of the garment,
    allowing seamless connection to the measurement device. The connectors were symmetrically
    aligned on both the front and back of the garment. To connect the electrodes and
    the connectors, a zigzag stitch was used, creating a straight pathway from the
    rectangular electrodes to the circular connectors.


    The silver-coated thread consists of 34 twisted nylon filaments. This thread is
    widely used in wearable applications due to its compatibility with embroidery
    [25] and sewing machines. It has also been evaluated as safe in cytotoxicity tests
    following the biological evaluation standard for medical devices (DIN EN ISO 10993-5)
    [26]. Therefore, it is suitable for placement on the inner side of garments where
    it comes into direct contact with the skin. In this regard, ply refers to the
    unit indicating the number of strands twisted together to form a thread. A single-ply
    thread consists of one twisted strand, while a triple-ply thread consists of three
    twisted strands. As shown in Figure 3b [27], the resistance of the thread decreases
    as the number of twists increases, demonstrating that the thread used in this
    study minimizes measurement errors caused by resistance.


    # 2.2. Experimental Setup and Acquisition


    The experiment was conducted to measure breathing under different intensity levels
    through cycling. The measurement process involved wearing a garment-based sensor
    and using an indoor cycling apparatus (XAMEN KANGTO FITNESS FOUPWENT CO, Xiamen,
    China). For precise measurements, an LCR meter (KEYSIGHT, Santa rosa, CA, USA)
    and the Keysight Benchvue program (KEYSIGHT, Santa Rosa, CA, USA) were employed
    instead of simple devices.


    The intensity levels were divided into four categories: resting state (no activity),
    low intensity, moderate intensity, and high intensity. Low intensity corresponded
    to an average speed of 15–20 km/h, moderate intensity to 20–30 km/h, and high
    intensity to 30–40 km/h. Each intensity level was measured for 5 min, followed
    by a 1 min rest period before proceeding to the next measurement. The schematic
    diagram of the measurement setup is shown in Figure 4a [23], and the actual measurement
    process is illustrated in Figure 4b. The temperature was measured at room temperature
    (18 °C to 20 °C), and the experiment was conducted at approximately 60% humidity.


    ![](img/c1925febd7dde400183c23c14d668ef0_150_0.png)


    Figure 4. (a) Schematic of LCR meter [23]; (b) measurement of wearable sensors.'
