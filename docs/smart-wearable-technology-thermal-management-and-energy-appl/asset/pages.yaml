  md: '# ## 3.3. Thermal Radiation Wearable Clothing


    The utilization of radiative cooling in thermal protective clothing exhibits potential
    for energy conservation owing to its passive nature. Human skin displays emissivity
    values greater than 0.95 [50,51] and can be regarded as being almost entirely
    comprised of blackbody radiation. This elevated emissivity characterizes the human
    skin as a special infrared emitter. In a typical indoor setting, up to 50% of
    the total heat loss arises from radiation [52]. Nevertheless, traditional clothing
    design does not make provisions for the radiation component. Radiant cooling clothing
    is a developing approach to cooling the body. It achieves this by enhancing the
    body’s radiative heat loss to the environment, as well as reflecting heat radiation
    from sunlight through the spectral selectivity of the fabric’s microstructure
    [53]. The use of passive cooling technology in radiant cooling suits means that
    they do not require an external energy supply, bringing the benefits of simplicity
    and energy savings. Since the solar spectrum is mainly between 0.3 and 4.0 μm
    [53], it is promising and feasible to enhance solar reflection and dissipate human
    thermal radiation. Zhao et al. developed a layered nanofiber textile with improved
    thermal insulation and radiant heat management for effective personal heat management
    in harsh temperatures, achieving a temperature reduction of 7.2 °C over white
    cotton in hot environments, as shown in Figure 8 [54].


    ![](img/c1925febd7dde400183c23c14d668ef0_19_0.png)


    Figure 8. Thermal-radiation cooling clothing [54].


    In recent years, numerous research teams have focused on creating textiles that
    possess exceptional radiative cooling capabilities. Cai et al. [53] were the first
    to present a spectrally selective, radiatively cooled textile suited for outdoor
    cooling, with an over 90% reflectance of solar irradiance and a satisfactory transmission
    of thermal radiation to the human body. This was achieved through avoiding overheating
    of the simulated skin, ranging from 5–13 °C when compared with cotton fabrics.
    Irfan et al. [55] developed a nanotextile using nanoparticle-doped polymeric materials
    and electrostatic spinning technology. Results showed 91% solar reflectance, 81%
    mid-infrared transmission, and a cooling performance of 9 °C compared to cotton
    textiles.


    These findings suggest that radiatively cooled clothing has great potential for
    effective cooling and various applications. In addition, a thorough examination
    of radiant thermal cooling and heating, which includes reflective surfaces, has
    been conducted [56]. This review offers significant insights into radiant-cooling
    technologies. Radiant-cooling technology has a critical role in personal thermal
    management, particularly in the context of clean energy radiation that does not
    contribute to carbon emissions. However, this technique is limited by weather
    conditions and cannot be fully applied in all circumstances [57]. Lin et al. [58]
    conducted a comprehensive review study addressing atmospheric conditions in various
    regions, including application challenges. Nonetheless, many issues still need
    to be addressed for passive personal cooling clothing, such as material stability,
    durability, and comfort. Thus, there are currently no established products available
    for practical use. Therefore, extensive research and development are required
    to enhance the effectiveness'
