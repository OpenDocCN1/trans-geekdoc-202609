  md: 'increased with the density of the tubing. Branson et al. [55] used a 3D body
    scanner to compare the fit analyses of LCGs and indicated that from the aspect
    of different users, it is better to develop an adjustable cooling garment. Cao
    et al. [58] investigated the effect of inner fabric layers of LCGs on heat exchange
    and cooling efficiency. They found that an inner layer with good thermal conductivity,
    good moisture management, and good tactile properties is desirable.


    LCGs offer a promising approach to regulating body temperature and enhancing comfort.
    These garments utilize the circulation of cold liquid through tubes in clothing
    to facilitate heat exchange between the body, the liquid, and the environment.
    For the design of LCGs, a lower liquid temperature with a higher flow rate (no
    more than 1 L/min) is beneficial to improve cooling performance. As conductive
    heat transfer is the primary cooling mechanism for LCGs, a good fitness of LCGs
    can also increase cooling efficiency. An adjustable (fitness and flows) LCG could
    be designed to reduce the discomfort caused by the coolant having direct contact
    with skin, and a three-layer system may be better for wearer comfort. The comparative
    analysis of different LCGs demonstrates their varied cooling powers, durations,
    and temperature ranges, allowing for tailored choices based on specific cooling
    needs. Further exploration and real-world studies will contribute to a deeper
    understanding of LCGs’ performance and their utility in diverse settings.


    +   • Thermoelectric cooling garments


    Thermoelectric cooling garments (TCGs) are based on the Peltier effect that can
    convert electrical energy into thermal power. The single-stage thermoelectric
    (TE) module is composed of type-N and type-P semiconductors which connected electrically
    in series. The Peltier effect can transfer heat from one side to the other; therefore,
    one face is heated and the opposite is cooled, which can be changed by the direction
    of the electric current [60,61]. A single TE device can be embedded in a clothing
    system to provide cooling by direct contact with the skin [62] (Figure 5). However,
    there are some apparent weaknesses in the design of such TCGs, for example, the
    poor coefficient of performance and low efficiency, so there is nearly no cooling
    garment designed solely using the Peltier effect. Some enhanced cooling garments,
    such as the combination of the air and TE cooling techniques which enhance air
    cooling through the TE unit [63,64] and the combination of the liquid and TE cooling
    techniques which enhance liquid cooling through the TE unit [64] were developed
    for better cooling performance.


    ![](img/c1925febd7dde400183c23c14d668ef0_68_0.png)


    Figure 5. The schematic diagram of thermoelectric cooling garments (TCGs).


    +   • Radiative cooling garments


    Radiative cooling garments (RCGs) provide thermal comfort through enhanced radiative
    heat loss from the human skin or the clothing outer surface. Human skin can be
    regarded as a near-black radiating source with an emissivity value over 0.95 [65,66],
    which makes it a near-perfect emitter of thermal infrared radiation. Based on
    this concept, some fabrics, textiles, and garments were designed for personal
    thermal management. The cooling garment with mid-IR transparency [67], mid-IR
    emissivity [68], or solar-reflecting mid-IR emissivity [69] are all potential
    solutions to achieve better cooling efficiency. RCGs'
