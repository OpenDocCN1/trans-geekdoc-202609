  md: '# 2.1.2. Fabrication of Wearable Sensors


    The electrodes were designed to have a rectangular shape with dimensions of 100
    mm in width and 50 mm in height. The connectors for measurement were circular,
    measuring 20 mm × 20 mm. The stitch connecting the sensors to the connector was
    made in a zigzag pattern with a total length of 335 mm. The placement of the sensors
    is shown in Figure 3a, where the distances relative to reference points can also
    be observed. The area density of the embroidery (line/mm) was set to 6 for the
    sensor electrodes and 4.5 for the connectors. As the connection line consists
    of stitch lines, it does not have an embroidery area density. Regarding the stitch
    pattern, the electrodes and connectors were designed with a running stitch for
    the top thread and a fill stitch for the bobbin thread, while the connection line
    used a zigzag stitch.


    ![](img/c1925febd7dde400183c23c14d668ef0_149_0.png)


    Figure 3. (a) Wearable sensors in the shape of a finished garment [23]; (b) the
    effect of single-ply and triple-ply thread length on the resistance value.


    The stitch length for the electrodes and connectors was set to a width of 2 mm
    and a height of 4 mm, whereas the connection line had a width of 5 mm and a height
    of 1 mm. Finally, the total amount of thread used was 9526 stitches for the electrodes
    and 606 stitches for the connectors. This information is provided only for embroidered
    area measurements. Detailed specifications of the sensors are provided in Table
    1 [24].


    Table 1. Specifications of the wearable sensors.


    | Parameter | Electrodes | Connection Line | Connectors |

    | :--- | :--- | :--- | :--- |

    | Dimension (width × height) | 100 × 50 (mm²) | 335 (mm²) | 20 × 20 (mm²) |

    | Density (line/mm) | 6 | - | 4.5 |

    | Shape of stitch | Running, fill | Zigzag | Running, fill |

    | Length of stitch (mm) | 2, 4 | 5/1 (width/height) | 2, 4 |

    | Number of stitches | 9526 | - | 606 |


    The electrodes of the sensors were directly embroidered onto fabric (87% polyester,
    13% spandex) (Sunmfit, Seoul, Republic of Korea) using silver-coated thread (AMANN,
    Bönnigheim, Germany) and an embroidery machine (BROTHER, Bridgewater, NJ, USA).
    Silver-coated thread was used as the top thread, while 100% rayon embroidery thread
    was used as the bobbin thread. The top thread was placed on the inner side of
    the garment, which encounters the body, while the bobbin thread remained on the
    outer side. To protect the outer side, a polyurethane (PU) film was heat-bonded
    onto the surface.'
