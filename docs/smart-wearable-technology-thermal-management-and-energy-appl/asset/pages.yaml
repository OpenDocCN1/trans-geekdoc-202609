  md: '# 4.3.2. Liquid Cooling Suit


    Liquid-based cooling suits circulate a cooling liquid within the microclimate,
    dissipating the body’s metabolic heat to maintain thermal balance. This falls
    under active cooling. The cooling mediums for liquid cooling suits mainly include
    water, a mixture of water and ice, phase-change emulsions, and microcapsule emulsions.
    The design styles are depicted in Figure 8. Since liquid cooling suits rely on
    conductive heat dissipation, they are typically designed in a form-fitting style
    to ensure effective heat conduction by keeping the clothing close to the skin
    [32]. However, to reduce the initial discomfort when the skin surface comes into
    direct contact with the low-temperature pipes, McLellan [33] suggests wearing
    a T-shirt or long-sleeved shirt underneath the liquid cooling suit. Guo et al.
    [5] developed a detailed theoretical model for heat transfer from the liquid cooling
    suit to the environment and determined its maximum working duration to be 3.36
    h, which is relatively short. Liquid cooling suits generally require additional
    equipment such as power sources, water pumps, and refrigeration devices, making
    them heavy and less portable. To address these issues, Rahman et al. [34] designed
    an active cooling system that uses non-toxic gallium-based liquid metal (Galinstan)
    as the coolant. Compared to other active cooling systems, the liquid-metal cooling
    system extended the cooling time by four times, reduced the weight to one-third
    of the original weight, and lowered the cost to one-eighth of the original cost,
    significantly improving upon the drawbacks of traditional liquid cooling suits.
    However, further research is needed to address issues such as preventing leaks
    in liquid cooling suits and improving freedom of movement while wearing them.


