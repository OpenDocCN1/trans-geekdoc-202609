  md: 'a validation accuracy of 97.02%, closely matching its training performance.
    These results indicate that the 1D ResNet model achieved higher accuracy while
    effectively minimizing overfitting. This suggests that for workout data, which
    inherently include noise and human error, a simpler yet efficient model like 1D
    ResNet, which focuses on essential information rather than excessive data, is
    more suitable for classification tasks.


