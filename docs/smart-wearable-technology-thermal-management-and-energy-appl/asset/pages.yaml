    # 4.4. Consistency of Subjective and Objective Evaluations


    Comparisons between the subjective evaluations and objective tests of the fabrics’
    coolness levels are shown in Table 4. Based on statistical analysis, there was
    a significant correlation between the subjective and objective evaluations of
    the coolness levels of the fabrics ( p < 0.05). Additionally, the fitting curve
    in Figure 3 indicates good consistency between the subjective and objective evaluations
    of the fabrics’ coolness levels ( R2 = 0.909; i.e., the closer R2 is to 1, the
    higher the degree of fitting). The proportion of samples with consistent subjective
    and objective levels was 75.8%, validating the effectiveness of the thermal absorption
    coefficient method for evaluating the coolness performance of fabrics. It is worth
    noting that some samples showed differences between subjective and objective evaluations.
    For instance, samples #10, #11, and #12 in an ultra-dry state and samples #3 and
    #7, with a water content of 20%, had an objective evaluation level of B, while
    their subjective evaluation level was A. Sample #16, with a water content of 20%,
    and samples #1, #2, #11, and #14, with a water content of 40%, had an objective
    evaluation level of B, while their subjective evaluation level was C. Samples
    #3, #5, and #9, with a water content of 60%, had an objective evaluation level
