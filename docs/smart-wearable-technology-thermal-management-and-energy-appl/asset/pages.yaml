  md: 'erant vapor-injection technique is an important technical means to solve these
    problems. Previous studies mainly focus on the effect of the refrigerant vapor-injection
    technique on a conventional heat pump system. There are still only a few research
    studies which focus on analyzing refrigerant vapor-injection techniques on performance
    of the HTHP system, especially on the HTHP system with output temperatures higher
    than 100 °C. In this paper, the performance of high-temperature heat pumps with
    flash tank vapor injection (FTVI) and sub-cooler vapor injection (SCVI) are compared
    under different evaporation temperatures, condensation temperatures, compressor
    suction superheat degrees, sub-cooling degrees and compressor isentropic efficiencies.


    # 2. System Description


    There are two types of vapor injection cycles: the flash tank vapor injection
    (FTVI) cycle and the sub-cooler vapor injection (SCVI) cycle. In the FTVI cycle,
    the injected vapor refrigerant is provided by phase separation in the flash tank.
    Firstly, the vapor-liquid two-phase refrigerant absorbs heat from the heat source
    and the liquid refrigerant evaporates and becomes vapor refrigerant in the evaporator.
    Then the vapor refrigerant enters the compressor suction and is compressed to
    the intermediate pressure. The compressed vapor refrigerant from the compressor
    suction mixes with vapor refrigerant from the flash tank at the intermediate pressure
    location in the compressor. The mixed vapor refrigerant continues to be compressed
    to the condensing pressure and is discharged to the condenser. The compressed
    high-temperature vapor refrigerant releases heat to the heat sink and condensed
    to liquid refrigerant in the condenser. The condensed liquid refrigerant flows
    through expansion valve 1 and expands to be vapor-liquid two-phase refrigerant
    at the intermediate pressure. Then the vapor-liquid two-phase refrigerant is separated
    into liquid-phase refrigerant and vapor-phase refrigerant in the flash tank. The
    liquid refrigerant enters expansion valve 2 and then circulates through the evaporator.
    The vapor-phase refrigerant is injected into the compressor pocket at the intermediate
    pressure, as shown in Figure 1. In the SCVI cycle, the injected vapor refrigerant
    is generated from the sub-cooler. The vapor-liquid two-phase refrigerant absorbs
    heat from the heat source and the liquid refrigerant evaporates to vapor refrigerant
    just like evaporation part of the FTVI cycle. Then the vapor refrigerant flows
    into the compressor suction and is compressed to the intermediate pressure. The
    compressed vapor refrigerant from the compressor suction mixes with vapor refrigerant
    from the sub-cooler at the intermediate pressure location in the compressor. The
    mixed vapor refrigerant continues to be compressed to condensing pressure and
    then enters the condenser. The high-pressure and high-temperature vapor refrigerant
    condenses to liquid refrigerant by releasing heat to the heat sink. The liquid
    refrigerant from the condenser is separated into two paths. One path injects the
    refrigerant to the compressor pocket in the intermediate pressure. In this path,
    the liquid refrigerant from the condenser passes through expansion valve 1 and
    becomes two-phase refrigerant in the intermediate pressure. The two-phase refrigerant
    absorbs heat from refrigerant in another path in the sub-cooler and becomes vapor
    which is then injected into the compressor pocket in the intermediate pressure.
    In another path, the liquid refrigerant from the condenser is subcooled by two-phase
    refrigerant injected to the compressor pocket in the intermediate pressure. Then
    the sub-cooled liquid enters expansion valve 2 and flows to the evaporator, as
    shown in Figure 2.


    Refrigerant has a decisive influence on the design of HTHPs, so the selection
    of the refrigerant is key in the design of HTHPs. A suitable refrigerant for HTHPs
    should have excellent thermodynamic properties at the operating conditions of
    high-temperature and pressure, it should also be highly energy efficient, commercially
    available, have low global warming potential (GWP), a zero or negligible Ozone
    Depletion Potential (ODP) and other factors. The critical temperature of refrigerant
    is an important property when selecting working fluids for HTHPs. The upper temperature
    limit of subcritical heat pump cycles is determined by the critical temperature
    of the refrigerant. A temperature gap of about 10 to 15 K from the desired condensation
    temperature has to be maintained to ensure subcritical'
