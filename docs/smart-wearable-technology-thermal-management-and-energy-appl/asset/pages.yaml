    # # 5. Energy-Self-Sufficient Heating Textiles


    Some research groups have investigated energy-self-sufficient—or self-powered—heating
    textiles. In many cases, these studies are based on PCMs that can store a defined
    amount of energy and release it afterward when the environmental temperature is
    reduced.


    # ## 5.1. PCM as Self-Sufficient Heating Textiles


    To get an idea of the energy that should be stored in PCMs, it is supportive to
    use the heat that can be produced by a person, which is about 100 W at rest to
    about 600 W or even more during work or sports [132]. Typical values of heat storage
    capacity of phase-change materials are in the order of magnitude 200 J/g [132],
    meaning that energy of 1 kWh, as released by the human body at rest within ten
    hours, necessitates 3.6 MJ of storage capacity, i.e., phase-change material with
    a mass around 18 kg. This shows that PCMs from common materials, such as octadecane,
    hexadecane, etc., should be used more for repeatedly varying temperatures, as
    is the case for spacesuits in many situations, while PCMs with much higher storage
    capacity would be needed to support homeless people during nighttime.


    It must be mentioned that there are several studies aimed at increasing the heat
    storage capacity of PCMs; however, for use in textile fibers or fabrics, usually
    an encapsulation in the form of microcapsules or core-shell fibers is needed,
    which reduces the mass-related heat storage capacity again. For microencapsulated
    PCMs with a polyurethane (PU) binder, e.g., a heat storage capacity of 0.2–7.6
    J/g was reported [133].


    On the other hand, the above calculation can only approximate an order of magnitude
    necessary to use PCMs in textiles for active heating since the necessary amount
    of stored energy depends strongly on the environmental temperature, isolation
    properties of the whole garments, activity of the wearer, etc. Additionally, thermoregulation
    depends on the position where the PCMs were integrated into the fabric, on the
    fabric construction, etc. [134]. This section thus searches for examples of measured
    or calculated heat retention by textile PCMs.


    As an example, Zhang et al. developed a coaxially electrospun multicore-sheath
    nanofiber mat based on methacrylic acid (MAA), ethylene glycol dimethacrylate
    (EGDMA) and benzoyl peroxide (BPO) with dodecanol as a PCM, which reached a maximum
    latent heat value of 106 J/g [135]. Their material showed a suitable phase-change
    temperature of around 25–30 °C, latent heat retention of more than 98.3% after
    500 thermal cycles, and nearly unchanged latent heat and tensile strength after
    soaking the nanofiber mat in water. The authors suggested it for potential use
    in space suits. Depending on the injection speed ratio of the PCM core and acrylate
    copolymeric shell during coaxial electrospinning, four different samples were
    prepared. Figure 12 shows the time-dependent temperature'
