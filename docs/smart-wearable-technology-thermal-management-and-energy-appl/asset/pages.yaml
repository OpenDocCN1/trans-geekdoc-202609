  img_proc: true
- pgno: 179
  md: 'Recall = \(\frac{TP}{TP + FN}\) (4)


    F1 score = \(2 \frac{Precision \times Recall}{Precision + Recall}\) (5)


    where the true positive (TP) refers to the number of positive samples correctly
    classified as positive. False positive (FP) is the number of negative samples
    incorrectly classified as positive, and false negative (FN) refers to the number
    of positive samples incorrectly classified as negative.


    ![](img/c1925febd7dde400183c23c14d668ef0_179_0.png)


    Figure 5. The architecture of 1D ResNet.


    Precision measures the proportion of true positive predictions (TP) out of all
    predictions made for the positive class (TP + FP). It evaluates the model''s ability
    to avoid false positives. Recall, also known as sensitivity, measures the proportion
    of actual positive instances correctly identified (TP out of the total actual
    positives (TP + FN)). It evaluates the model''s ability to detect true positives.
    The F1-Score is the harmonic mean of precision and recall, balancing their trade-offs.
    It is particularly useful when dealing with imbalanced datasets.


    Finally, to verify the reliability and precise applicability of the algorithm
    modeling method, we excluded 173 data samples from one participant (segment 2)
    who performed the 14 workout movements. The remaining 728 data samples from the
    other four participants were used for training, and the fresh data from segment
    2 were utilized for testing.


    # 3. Results and Discussion


    # 3.1. Evaluation of 1D ResNet


    Figure 6 presents the Z-axis acceleration data from a single sequence for the
    bench press exercise, recorded from subject 1 and used as input for the ResNet
    model in this study. With a sampling frequency of 10 Hz and an approximate workout
    duration of 2 s, each sequence is composed of 20 data points. For the bench press,
    the upward and downward movements of the bar, driven by the hands and arms, are
    clearly captured in the Z-axis data. This highlights the suitability of the Z-axis
    acceleration for accurately reflecting the motion dynamics of this exercise.


    As illustrated in Figure 7, the training accuracy of both the 1D ResNet and 3D
    ResNet models was evaluated using the 600 training data samples across the training
    epochs. To monitor overfitting, the validation accuracy was also measured and
    compared using the 301 test data samples. While the 3D ResNet model achieved 100%
    training accuracy by epoch 200 and maintained it throughout, its validation accuracy
    fluctuated between 80% and 90%, ultimately stabilizing at 87.02%. This discrepancy
    can be attributed to the increased information complexity in the 3D data, which
    allowed the model to create more nuanced classifications for training data but
    led to overfitting, as evident from the lower validation accuracy compared to
    training accuracy. In contrast, the 1D ResNet model developed in this study also
    achieved a final training accuracy of 100% while maintaining'
  merge: -1
  img_proc: true
