  md: '# 2.3. Signal Processing with Deep Learning


    Signal processing was conducted using MATLAB R2023a. The data, representing the
    capacitive values of the sensor corresponding to respiration, were normalized
    to a range between –3 and 3 to enhance model generalization and improve training
    stability. Using the normalized data, classification results were analyzed with
    CNN and ResNet to determine the most suitable algorithm for the dataset used in
    this study. Figure 5 illustrates the hierarchical structures of the networks,
    where 5a represents the CNN architecture and 5b depicts the ResNet architecture.


    ![](img/c1925febd7dde400183c23c14d668ef0_151_0.png)


    **Figure 5.** (a) CNN architecture; (b) ResNet architecture.


    A CNN is an algorithm that processes multiple layers sequentially. The CNN used
    in this study consists of seven convolutional blocks, each containing convolution,
    normalization, ReLU, and dropout layers. After repeating these blocks seven times,
    the network concludes with a global pooling layer and a fully connected layer
    for final classification. Through the pooling layer, features can be directly
    extracted, and hierarchical learning makes it effective for capturing complex
    data. However, as mentioned in the introduction, issues such as neuron death and
    non-recovery occasionally occur during this process. To address these limitations,
    ResNet, which has a similar structure but overcomes such challenges, is one of
    the alternative algorithms.


    The structure of ResNet consists of two residual blocks, each containing two sets
    of convolutional blocks. A distinguishing feature of ResNet is its ability to
    learn the'
  merge: -1
  img_proc: true
- pgno: 152
  md: 'residual function \( F(x) \), which represents the difference between the input
    (\( x \)) and the output (\( y \)), unlike conventional neural networks. The mathematical
    representation of the residual function is provided in Equation (3), where \(
    H(x) \) denotes the target function. Furthermore, as illustrated in Figure 5b,
    simple skip connections ensure that information is preserved during transmission,
    preventing performance degradation even as the network depth increases. The mathematical
    formulation of these skip connections can be found in Equation (4). After the
    residual blocks, the network concludes with global pooling and a fully connected
    layer, like CNN, to produce the final classification results.


    ```

    \( F(x) = H(x) - x \) (3)

    ```


    ```

    \( y = F(x) + x \) (4)

    ```


    The total dataset consists of 157 samples, with 100 sets used for training, 24
    sets for validation, and 23 sets for testing. Both algorithms classify four classes
    using a single input. The dropout rate is set at 0.5, with a filter size of 5
    and 32 filters. The maximum number of epochs is configured as 200 for CNN and
    1000 for ResNet. The initial learning rate is set to 0.0005 for CNN and 0.001
    for ResNet.


    Table 2 includes all materials and methods used in this work together with their
    purposes.


    # Table 2. Summary of analyzed materials and test devices used.


    | Component | Remark | Manufacture | Purpose |

    |---|---|---|---|

    | Electrodes | Silver-coated outer nylon cores covered by PU | AMANN, Bönnigheim,
