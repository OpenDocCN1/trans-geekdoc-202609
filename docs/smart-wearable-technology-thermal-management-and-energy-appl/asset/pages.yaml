  md: '# Article


    # Optimization of Deep Learning Models for Enhanced Respiratory Signal Estimation
    Using Wearable Sensors


    Jiseon Kim 1 and Jooyong Kim 2,*


    1 Department of Smart Wearables Engineering, Soongsil University, Dongjak-gu,
    Seoul 06978, Republic of Korea

    2 Department of Material Science and Engineering, Soongsil University, Dongjak-gu,
    Seoul 06978, Republic of Korea

    * Correspondence: jykim@ssu.ac.kr; Tel.: +82-2-820-0631


    Abstract: Measuring breathing changes during exercise is crucial for healthcare
    applications. This study used wearable capacitive sensors to capture abdominal
    motion and extract breathing patterns. Data preprocessing methods included filtering
    and normalization, followed by feature extraction for classification. Despite
    the growing interest in respiratory monitoring, research on a deep learning-based
    analysis of breathing data remains limited. To address this research gap, we optimized
    CNN and ResNet through systematic hyperparameter tuning, enhancing classification
    accuracy and robustness. The optimized ResNet outperformed the CNN in accuracy
    (0.96 vs. 0.87) and precision for Class 4 (0.8 vs. 0.6), demonstrating its capability
    to capture complex breathing patterns. These findings highlight the importance
    of hyperparameter optimization in respiratory monitoring and suggest ResNet as
    a promising tool for real-time assessment in medical applications.


    Keywords: deep learning; respiratory signal; wearable sensor; convolutional neural
    network; residual networks


    # 1. Introduction


    Academic Editors: Zhaniao Kang and Qing Chen


    Received: 22 January 2025 Revised: 17 February 2025 Accepted: 20 February 2025
    Published: 4 March 2025


    Citation: Kim, J.; Kim, J. Optimization of Deep Learning Models for Enhanced Respiratory
    Signal Estimation Using Wearable Sensors. Processes 2025, 13, 747. https://doi.org/10.3390/pr13030747


    Copyright: © 2025 by the authors. Licensee MDPI, Basel, Switzerland. This article
    is an open access article distributed under the terms and conditions of the Creative
    Commons Attribution (CC BY) license (https://creativecommons.org/licenses/by/4.0/).


    Respiratory changes during exercise are critical indicators in healthcare fields,
    such as sports monitoring. Previous studies have suggested that fast inputs, including
    central command, primarily regulate respiratory signal during exercise [1]. This
    regulation may explain the strong association between respiratory signal and perceived
    exertion across various exercise conditions. Emerging evidence highlights that
    respiratory signal can effectively reflect the level of effort during cycling
    exercise [1–3]. In this way, respiratory signal serves as a prominent indicator
    of physical effort during exercise, surpassing the relevance of other commonly
    monitored physiological variables [4]. For example, respiration during exercise
    is primarily regulated by central command, along with input from muscle afferent
    fibers and metabolic signals [5]. Respiration is influenced by inputs that operate
    at distinct timings in response to sudden changes in exercise intensity. Rapid
    increases in respiration at the onset of exercise are driven by fast inputs, including
    central command and afferent feedback, while metabolic stimuli contribute to respiration
    with a delayed response [6]. Evidence indicates that respiratory signal more accurately
    represents physical effort compared to blood lactate, particularly in conditions
    such as post-exercise muscle damage [7], glycogen depletion [8], and in individuals
    with McArdle''s disease [9]. Thus, respiratory signal provides corresponding data
    on physical effort during exercise.


    Moreover, measuring respiratory signals is not an easy task, making wearable devices,
    data preprocessing, and analysis methods such as deep learning critical factors
    in the measurement process. Wearable devices come in a variety of forms, including
    clothing, bracelets,'
  merge: -1
  img_proc: true
- pgno: 147
  md: 'and belts, each with their own advantages and disadvantages. Wearable respiratory
    sensors have gained significant attention for their ability to non-invasively
    monitor breathing patterns. Recent advancements, including deep learning-assisted
    portable biosensors, have enabled real-time respiratory analysis using compact
    and cost-effective devices [10]. Among these, clothing-based wearables are particularly
    well suited for everyday use. By utilizing lightweight and flexible materials,
    they allow for unrestricted movement, enabling the convenient measurement of body
    activity data, such as respiratory monitoring. For instance, a study developed
    a resistive sensor that can measure changes in breathing caused by emotional states.
    This was achieved by detecting changes in waist circumference, showing that clothing-based
    sensors can effectively capture respiratory changes associated with bodily movements
    [11]. Another study investigated textile-based sensors that measure breathing
    through contact resistance changes between fibers, even under different postural
    conditions [12]. Research on respiratory monitoring using clothing-based sensors
    is on the rise. However, while the classification of breathing patterns and data
    processing methods are critical, these aspects remain relatively underexplored.


    Typically, respiratory signal estimation is directly performed from previously
    detected respiratory signals using deep learning, particularly Convolutional Neural
    Networks (CNNs) [13,14]. A CNN is a computational model composed of multiple processing
    layers capable of learning data representations [15]. This model enables tasks
    such as image classification, image segmentation, and action recognition. Despite
    their high applicability, CNNs occasionally encounter issues where neurons “die”
    during the learning process and fail to recover [16,17]. Additionally, as the
    model introduces more parameters, overfitting may occur, or training errors may
    increase [18]. To overcome these challenges, various methods have been proposed,
    one of which involves using a Residual Network (ResNet) [19,20]. Deep learning
    is utilized not only in medical image analysis but also in the classification
    of bio signals using wearable sensors, making it particularly useful for processing
    time series such as breathing patterns [21]. The key distinction of ResNet lies
    in the inclusion of shortcut connections within convolutional layers. These connections
    help address common CNN issues, allowing the gradient to backpropagate more effectively,
    thereby accelerating the training process [22]. As demonstrated, different training
    methods have distinct characteristics, and selecting the appropriate deep learning
    model that aligns with the research objective is essential. Additionally, choosing
    suitable parameters based on the characteristics of the data can significantly
    impact the accuracy of the results. Therefore, the selection of an appropriate
    deep learning model and parameter configuration that fit the research objective
    is crucial.


    In this study, respiratory data generated during physical activity were trained
    using deep learning models such as CNN and ResNet to identify the most suitable
    approach for improving prediction accuracy. To measure respiration during exercise,
    a wearable respiration sensor was developed. The sensor was designed to be positioned
    at the front and back of the torso, specifically near the xiphoid process, to
    measure changes in capacitance caused by thoracic expansion and contraction during
    breathing. The respiration changes were observed according to different exercise
    conditions. To accurately classify and detect these changes, a comparative analysis
    of CNN and ResNet models was conducted. The method that demonstrated higher accuracy
    was considered the most appropriate for the given dataset. These findings highlight
    the development of an optimized system for selecting deep learning models that
    best suit the characteristics and objectives of the dataset, ultimately enhancing
    prediction accuracy. The research process is illustrated in Figure 1, providing
    a clear visualization of the study’s workflow. This diagram helps readers easily
    understand the research objectives.'
