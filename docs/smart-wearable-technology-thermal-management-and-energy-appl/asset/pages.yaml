  md: '# About the Editors


    **Zhanxiao Kang**


    Dr. Zhanxiao KANG is currently a Research Assistant Professor at Hong Kong Polytechnic
    University. His general interests include heat and mass transfer, heat pipes,
    thermal diodes, computational fluid dynamics, and wearable technology for human
    body thermal management. Dr. Kang is actively engaged in projects related to flexible
    heat pipes, high-performance thermal rectifiers, sweat management, evaporative
    heat dissipation, and wearable air conditioners. He has published about 50 peer-reviewed
    papers in prestigious academic journals. Furthermore, Dr. Kang also serves as
    a reviewer for over 40 academic journals, including Nature Communications, Advanced
    Materials, Advanced Science, etc.


    **Qing Chen**


    Dr. Qing CHEN is an associate professor from Donghua University. Shen has been
    engaged in the design and development of knitted products for many years, mainly
    researching the design and development of functional and intelligent knitted fabrics
    and clothing. She has hosted one National Natural Science Foundation project,
    one Shanghai Natural Science Foundation project, and one Jiangsu Provincial Natural
    Science Foundation project, and participated in over 10 enterprise industry university
    research projects. She has published over 50 papers and 8 authorized invention
    patents, and received one second-place prize and one third-place prize from the
    China Business Federation Science and Technology Progress Award, as well as three
    second-place prizes and one third-place prize from the China Textile Industry
    Federation Science and Technology Award.'
