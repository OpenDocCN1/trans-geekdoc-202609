- pgno: 51
  md: 'While some tests of the long-term stability of PCMs have indeed been performed,
    as these examples show, the studies indicating energy storage for several hours
    [144] or even days [141] are still scarce and are usually not related to textile
    fabrics, where typically only relatively small masses of PCMs can be integrated,
    making them more suitable for short-term temperature variations than for energy
    storage for approx. half a day. The next sections will thus concentrate on fabrics
    heated by electric energy.


    # 5.2. Self-Sufficient Joule Heating Textiles


    Many research groups show the results of Joule heating textiles prepared in diverse
    ways. As an example, Ding et al. developed a polyester/spandex blend fabric-based
    Joule heater by coating it with CNT/polydopamine (PDA) [148]. Depending on the
    applied voltage, they reached different temperatures within approx. one minute,
    as depicted in Figure 14, where the measurements were not taken on a glove but
    on a not-defined underground with unclear thermal contact and unclear room temperature.
    Heating with voltages around 3–7 V should be sufficient for most environmental
    situations; however, without the resistance of the heating ring (which is not
    given in [148]), the calculation of a heating power or the energy necessary for
    longer heating is not possible.


    ![](img/c1925febd7dde400183c23c14d668ef0_51_0.png)


    Figure 14. (a) Optical photograph of active heating textile wrapped around a finger;
    thermal infrared images at (b) 5 V and (c) 7 V; (d) temperature profiles of active
    heating textile at 3–12 V; (e1–e6) corresponding thermal infrared images at 0–12
    V. Reprinted from [148], Copyright 2023, with permission from Elsevier.


    For a cotton/tannic acid/Ag nanoparticle/PDMS knitted textile of dimensions 2
    cm × 1 cm and a resistance of approx. 3.8 Ω/cm, Guo et al. reported saturation
    temperatures of 36–74 °C for voltages of 0.5–1.5 V, reached at a room temperature
    of around 30 °C [149]. This corresponds to a heating power of 0.07–0.6 W for the
    mentioned area of 2 cm2, i.e., a necessary power density of 350–3000 W/m2. It
    must be mentioned that this calculation highly overestimates the necessary energy
    for the given temperatures as the textile also has to heat the (unknown) underground,
    and no isolation from the environment is given, so this calculation cannot really
    be transferred to the situation of heating a human body in a cold environment
    in addition to common isolation clothing.


    Many other groups also measured the temperature development of a Joule heated
    textile on an unknown underground instead of on a clothed thermal manikin or even
    on probands [150–152], making comparisons with other studies or even extrapolating
    to a real human in a cold environment quite challenging. This problem is also
    discussed in [8],'
