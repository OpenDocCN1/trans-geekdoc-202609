  md: '# 4.5. Random Forest Model Predicts Coolness


    A random forest regression model was used to predict the coolness of fabrics with
    different water contents. Five indicators, including the density of fiber bodies,
    the thickness of fabrics, the surface density, the porosity, and thermal conductivity
    in the dry state, were used as evaluation features in the random forest regression
    model. The original fabric sample set contained 100 samples, with 3/4 used as
    the training set and 1/4 used as the testing set. Combined with the subjective
    evaluation results, a random forest regression model was established, with the
    training set used for building the random forest algorithm and the testing set
    used for evaluating the remaining data. When the accuracy of the testing set is
    much higher than that of the training set, there is underfitting, while the opposite
    indicates overfitting. After analyzing the parameters of the random forest regression
    model, a random forest regression model for fabric coolness was established, and
    the model was used to predict the coolness level of fabrics with different water
    contents. The predicted results were compared with the measured values, as shown
    in Figure 4. The evaluation index of the model, R^2, was 0.872 and the RMSE was
    0.305 (an RMSE of 0.2–0.5 indicates that the model can accurately predict the
    data and the smaller the value, the better the prediction effect). The low R^2
    may be caused by a low sample size, although it still indicates that the model
    has good predictive performance and is effective at predicting and evaluating
    fabric coolness.


    ![](img/c1925febd7dde400183c23c14d668ef0_127_0.png)


    Figure 4. Comparison of the consistency between predicted and measured values.


    # 4.6. Limitations


    This study had its limitations. First, because the TPS 2500S thermal constant
    analyzer has different testing principles from Heat flux sensor-based instruments
    such as Alambeta, the thermal conductivity of the sample may be underestimated,
    which may also lead to the low thermal absorption coefficient of the sample. Second,
    the subject experiments are affected by steady-state heat conduction when the
    contact time between the skin and the sample exceeds 2 s. Even though emphasis
    was placed on the subjects to evaluate the instantaneous contact coolness of the
    fabric during the experiment, they are inevitably affected by steady-state heat
    conduction. We must admit that the above errors will occur during the experiment.


    # 5. Conclusions


    A thermal constant analyzer was used to test the thermal absorption coefficients
    of 20 commonly used clothing fabrics—including natural fibers, synthetic fibers,
    and blended fabrics—at different levels of water contents. The fabrics were objectively
    classified into'
