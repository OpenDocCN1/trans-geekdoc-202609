    # 4. Results and Discussion


    Evaporation temperature, condensation temperature, compressor suction superheat
    degree, sub-cooling degree and compressor isentropic efficiency are the main factors
    that influence the performance of a high-temperature heat pump. So, the performance
    of a high-temperature heat pump with flash tank vapor injection and that with
    sub-cooler vapor injection are compared under these different main factors.


    # 4.1. Performance Comparison under Different Evaporation Temperatures


    Figure 3 shows the performance comparison at different evaporation temperatures
    of the high-temperature heat pump cycles with flash tank vapor injection and sub-cooler
    vapor injection. One of the important differences between the two cycles is that
    the refrigerant vapor injected into the compressor of the FTVC is in a saturated
    state, while that of the SVIC can be in either a saturated state or superheated
    state. Therefore, the SVIC with different injection superheat degrees are also
    investigated. SVIC-0, SVIC-5, SVIC-10 and SVIC-20 represent the SVIC with the
    injection superheat degrees of 0 °C, 5 °C, 10 °C and 20 °C, respectively. As can
    be seen from Figure 3a, the COP of the FTVC system is higher than the SVIC at
    the same evaporation temperature. At the same time, it can be seen from Figure
    3a that the COP of the SVIC heat pump system decreases as the injection superheat
    degree increases. When the evaporation temperature and condensation temperature
    and injection pressure are 55 °C, 125 °C and 921.4 kPa, the system COPs corresponding
    to the FTVC, SVIC-0, SVIC-5, SVIC-10 and SVIC-20 are 4.49, 4.19, 4.16, 4.14 and
    4.09, respectively, and the COPs of the FTVC are 6.7%, 7.3%, 7.8% and 8.9% higher
    than those of the systems of the SVIC-0, SVIC-5, SVIC-10 and SVIC-20, respectively.
    Figure 3b shows that the injection mass flow ratio decreases with the increase
    in evaporation temperature, which is explained by the fact that the increase in
    evaporation temperature leads to the decrease in pressure difference between the
    condensation pressure and injection pressure. It can also be seen from Figure
    3b that the injection mass flow ratio of the FTVC is higher than those of the
    SVIC under different injection superheat degrees, which causes the higher COP
    of the FTVC than that of the SVIC under the same injection pressure. At the evaporation
    temperature'
