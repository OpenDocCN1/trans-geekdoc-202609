    # 4. Classification and Characteristics of Moisture Management Wearable Clothing


    The quantity of sweat that does not evaporate from the skin''s surface per hour
    is typically between 30 and 80 g when the surrounding temperature is not high.
    Under such circumstances, the sweat can easily spread into the surrounding environment
    through the gaps among clothing fibers. Yet, during physical exertion or hotter
    weather, sweat production significantly increases resulting in a larger quantity
    of sweat accumulating on the skin''s surface [72]. At present, it is no longer
    sufficient for clothing to simply be breathable and permeable to moisture in order
    to effectively dissipate sweat. Rather, clothing must be able to absorb significant
    amounts of sweat before releasing the resulting moisture into the surrounding
    air through evaporation. In cases where the surrounding air is dry or windy, sweat
    can evaporate quickly. However, if the humidity of the surroundings exceeds 60%,
    individuals may feel increasingly uncomfortable. Therefore, being in a highly
    humid environment or sweating during exercise and causing your clothing to become
    wet can influence and alter the thermal and humidity comfort of your attire.


    Personal moisture management wearable clothing is a type of clothing with a unique
    design that is capable of effective sweat regulation in addition to body temperature
    regulation. Moisture transport in textiles has a significant impact on the physiological
    comfort of the human body. When the human body produces sweat, a series of wetting,
    penetration, transport, and evaporation processes occur with the textile. At the
    same time, the temperature, humidity, and wind speed of the environment will also
    have an impact on the exchange of moisture and heat, which further affects the
    comfort of the human body.


    # 4.1. Moisture Management Materials


    Textile regulation of humidity is the process of transferring perspiration through
    the textile and usually involves two aspects depending on the different aggregation
    states of humidity, i.e., the regulation of sweat vapor and liquid sweat [76]:
    (1) the movement of moisture in the gaseous components of the material, e.g.,
    the transfer of water molecules within fibers or in the space between fibers;
    (2) the interaction of humidity with the solid components of the material, e.g.,
    repulsion or adsorption of water molecules with hydrophilic or hydrophobic groups
    for humidity transfer.


    +   (1) Water vapor regulation


    Gaseous perspiration wearable clothing is an important sweat transfer method in
    wet management wearable systems. Evaporative-cooling garments are used to remove
    heat from the body by absorbing heat through the evaporation of moisture as shown
    in Figure 10 [19]. Evaporative-cooling garments can be made from a variety of
    highly absorbent polymers that are more effective than conventional textiles [77–80].
    When the human body perspires, the sweat penetrates the inner fabric layers of
    the moisture management garment. These inner fabric layers are usually made of
    special materials that have a large surface area and good breathability. Through
    the action of this material, sweat can evaporate quickly, removing heat from the
    body''s surface and expelling moisture from the body. In this way, individual
    moisture-regulating clothing can help the human body stay dry and comfortable,
    avoiding excessive sweat accumulation on the skin surface, which causes discomfort
    and a feeling of wetness [6]. At this point, water vapor moves through the air
    space between fibers by diffusion or through their internal molecular structure
    when the vapor is under a vapor concentration gradient. Current sweat vapor-conditioning
    methods generally involve the design of materials that facilitate the transfer
    of sweat vapor from the body to the environment, which is achieved through pore
    size design, i.e., materials with a high water vapor permeability [81].'
