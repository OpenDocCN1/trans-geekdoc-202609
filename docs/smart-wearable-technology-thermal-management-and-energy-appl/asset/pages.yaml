    Figure 2. The relationship between the human body, environment, and cooling clothing.


    # 3. Working Principle of Cooling Clothes


    The heat generated during the human body’s metabolic processes is dissipated to
    the surrounding environment through the skin. When the surrounding temperature
    is too high or heat cannot be effectively dissipated, heat accumulates in the
    microclimate zone on the surface of the skin, causing discomfort. Therefore, the
    primary purpose of cooling garments is to regulate the temperature in the microclimate
    zone on the surface of the skin. The human body dissipates heat through various
    methods, including convective heat dissipation, radiative heat dissipation, conductive
    heat dissipation, and evaporative heat dissipation. The cooling effect of cooling
    garments on the human body primarily involves the transfer of heat between the
    skin surface, clothing, and the environment, as illustrated in Figure 3.


    ![](img/c1925febd7dde400183c23c14d668ef0_79_1.png)


    Figure 3. Heat exchange diagram between human body and environment.


    As seen in Figure 3, when the heat exchange between the human body and the environment
    reaches dynamic equilibrium, the production and dissipation of heat by the body
    are balanced. Wearing cooling garments involves two main paths of heat transfer
    between the human body and the external environment: the first path involves the
    transfer of heat generated by metabolic processes through the skin surface to
    the cooling garment in a process of thermal equilibrium; the second path involves
    the transfer of heat between the external environment and the cooling garment.
    In harsh mining environments, where the heat generated by the body’s metabolism
    is constant, the cooling effect of cooling garments'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'directly influences the heat transfer between the body and the environment.
    When the body is in a high-temperature environment, cooling garments absorb excess
    heat produced by the body to maintain thermal comfort.


    # 4. Research Status of Cooling Clothing


    Utilizing the Web of Science database for retrieval, we gathered 118 articles
    on cooling garments from the past 20 years, as depicted in Figure 4. The linear
    trend chart indicates an increasing focus by researchers on the innovation and
    application of cooling garments. The prominent areas of interest include liquid-cooled
    garments, evaporative cooling, cooling performance, cooling textiles, protective
    devices, phase-change materials, and others.


    ![](img/c1925febd7dde400183c23c14d668ef0_80_0.png)


    Figure 4. Number of publications on temperature-reducing clothing.


    The effectiveness of cooling suits is influenced by factors such as environmental
    temperature and humidity, cool fabric, cooling clothing structure, cooling clothing
    design, and level of physical activity, as shown in Figure 5. Among these, factors
    that can be improved to enhance the cooling effect of cooling suits include the
    cool fabric, cooling clothing structure, and cooling clothing design.


    ![](img/c1925febd7dde400183c23c14d668ef0_80_1.png)


    Figure 5. Factors affecting the cooling effect of cooling clothing.


    # 4.1. Cool Fabric


    In the high-temperature environment of mines, the use of cooling fabrics can enhance
    heat conduction and facilitate more effective convective evaporation, thus increasing
    comfort when the fabric is in close contact with the body. By increasing the thermal
    conductivity of fibers, regulating fiber cross-sectional structures, introducing
    phase-change materials, and employing post-fiber processing techniques, the fabric
    can rapidly transfer heat and accelerate perspiration, resulting in a cooling
    effect. This, in turn, enhances the thermal comfort of the human body. In recent
    years, experts and scholars have paid'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'considerable attention to research on fiber thermal conductivity and the introduction
    of phase-change materials. Elevating thermal conductivity can enhance the fabric’s
    ability to dissipate heat to the environment. Among these, phase-change fibers
    utilize the properties of phase-change materials to absorb and store body heat,
    thereby achieving a cooling effect [9].


    Thermal conductivity is a metric used to assess the ability of clothing fibers
    to conduct heat. The thermal conductivity of fibers primarily depends on factors
    such as the internal molecular arrangement of the material, fiber morphology,
    and the microstructure within the fibers. Research conducted by You B et al. [10]
    through experimental comparative analysis indicates that modal fibers are better
    suited for mining clothing due to their high thermal conductivity, leading to
    enhanced cooling effects. To increase fiber thermal conductivity, Gao et al. [11]
    prepared boron nitride/polyvinyl alcohol composite fiber fabrics. The high thermal
    conductivity of the boron nitride nanosheets resulted in a thermal conductivity
    coefficient of the composite fiber fabric that was 2.22 times that of cotton fabric.
    Yuan et al. [12] utilized copper nanowires coated with polydopamine to prepare
    electrically insulating resin nanocomposite fibers with a thermal conductivity
    of up to 2.87 W/(m·K). Wu et al. [13] developed a regenerated cellulose/BNNS (boron
    nitride nanosheets) composite fiber with a high BNNS content of up to 60% (by
    weight percentage). The thin and transparent two-dimensional structure of BNNS
    was particularly conducive to heat conduction. Chien et al. [14] fabricated a
    semi-crystalline polyamide (nylon) nanofiber. Annealing treatment was employed
    to enhance the configuration orderliness of the polymer, resulting in a high thermal
    conductivity of 59.1 W/(m·K). This fiber can be employed to enhance the human
    thermal comfort performance.


    Phase-change cooling fabrics integrate fibers with phase-change materials, leveraging
    the capacity of these materials to absorb, store, and release heat during phase
    transitions. This enables the regulation of skin temperature. In order to achieve
    an optimal thermal regulation response with phase-change fibers, it is important
    to enhance the thermal conductivity of both the phase-change material and the
    polymer substrate. Liu et al. [15] utilized wet spinning and freeze-drying processes
    to prepare Kevlar aerogel fibers with high porosity and surface area. After filling
    them with phase-change material, they obtained phase-change fibers with a phase-change
    enthalpy of 162 J/g. Wu et al. [16] used silk fibroin as a raw material and employed
    a freeze-spinning method to create microstructured fibers with high porosity.
    They then filled these fibers with polyethylene glycol (PEG) and coated them with
    polydimethylsiloxane (PDMS) to prevent leakage. The phase-change enthalpy of these
    fibers was approximately 118.1 J/g.


    With the development of smart fibers, material intelligence has gradually come
    into the view of researchers. Wang Wen et al. [17] used deformable bacteria on
    fabrics to make them sensitive to humidity. They placed the bacteria on both sides
    of latex and kept them stable at room temperature. When one side was exposed to
    high temperatures, the expansion of the bacteria caused the latex to bend outward.
    Sweat evaporates through the opened ventilation port, achieving the goal of cooling.
    Lao S et al. [18] developed a solar cooling suit. They installed a semi-flexible
    solar panel on the back of the suit and supplied power to two battery packs through
    a controller. This provided a continuously power source for a fan, enabling sustained
    cooling. This cooling suit is environmentally friendly. Ke et al. [19] designed
    a ladies’ blouse made from nano-porous polyethylene material. The study found
    that when using this cooling suit, increasing the set air conditioning temperature
    from 25.5 °C to 27.0 °C could save 9% to 15% of cooling energy. Wei et al. [20]
    applied a layer of Al2O3-dispersed cellulose acetate on the textile. This increased
    the textile’s solar reflectance from 62.6% to 80.1%. As a result, the wearer absorbs
    less radiant heat, achieving the goal of cooling.


    # 4.2. Cooling Clothing Structure


    Experimental measurements have revealed that different parts of the human body
    exhibit varying microclimates within clothing, and their relationship and response
    to the'
