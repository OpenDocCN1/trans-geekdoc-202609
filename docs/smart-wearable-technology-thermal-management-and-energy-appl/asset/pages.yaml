- pgno: 132
  md: 'where \(R_t\) is the thermal resistance of the fabric in m\(^2\cdot^\circ\)C/W,
    \(h\) is the fabric thickness in m, and \(\lambda\) is the thermal conductivity
    of the fabric in W/(m\(\cdot\ ^\circ\)C).


    The thermal resistance of fabric is largely dependent on the amount of stagnant
    air within it. Therefore, it can be concluded that factors affecting the air content
    in fabrics determine their thermal resistance. These factors include fabric fiber
    type, thickness, surface density, organizational structure, and porosity, all
    of which are critical in determining clothing thermal resistance. Fabric thickness
    and surface density can be directly measured, and there are many methods for measuring
    fabric porosity. Studies have used fabric surface density, fabric thickness, and
    fabric fiber density to calculate porosity [3] (see Equation (2)).


    \(\varepsilon = 1 - \frac{m}{h \cdot \rho_{fib}}\) (2)


    where \(\varepsilon\) is the porosity of the fabric in percentage, \(\rho_{fib}\)
    is the fiber density under standardized moisture regain in g/m\(^3\), and \(m\)
    is the measured areal density of the fabric in g/m\(^2\).


    The dry fabric system is composed of fibers and air, with the air uniformly distributed
    in the voids of the entire fabric system, including the interstices between the
    fabric structure and yarns, the interstices between fibers, and the internal voids
    of the fibers. Assuming a constant capacity of the fabric system, when the external
    environment is humid, the dry fabric continuously absorbs moisture from the outside.
    Unlike air, the interaction between water molecules and fibers is more complex,
    which Hes [16] describes in four forms: after the fabric absorbs water, water
    molecules first enter the micro-pores of the fibers and quickly form strong hydrogen
    bonds with the hydrophilic groups in the fiber polymers, whereas the remaining
    water molecules quickly occupy all the voids in the entire fabric system outside
    the fiber polymers until almost all the air in the fabric system is driven out.
    Finally, some of the water molecules are adsorbed on the fabric surface and the
    fabric reaches the state of saturation absorption, with the maximum water content.
    Sugawara and Yoshizawa [17] proposed that the thermal conductivity of porous materials
    depends on the thermal conductivity of the fluid and the solid. For fully saturated
    porous fabrics, the fabric thermal resistance can be regarded as the combination
    of fiber thermal resistance and water thermal resistance. Since the thermal conductivity
    of water is 22 times higher than that of air (0.57/0.026) [18], as the proportion
    of water in the fabric increases, the overall thermal conductivity of the fabric
    will significantly increase, resulting in a decrease in the fabric''s insulation
    ability.


    Many scholars have constructed theoretical and empirical models of fabric thermal
    resistance under different humidity levels through practical experiments and theoretical
    analyses. Among them, Mangat et al. [3] proposed a theoretical model for the wet-state
    thermal resistance of single-layer fabrics based on previous theories, which macroscopically
    considers the wet-state thermal resistance of fabrics as consisting of fiber thermal
    resistance, air thermal resistance, and water thermal resistance. The following
    assumptions were made: (1) the voids are uniformly distributed throughout the
    fabric system, and the moisture content contained in the fabric is constant. When
    the fabric is soaked, the water entering the fabric replaces some of the air in
    the voids; (2) when the hygroscopic fabric expands after absorbing water, the
    fabric undergoes changes and the thickness and area of the fabric increase, whereas
    the voids between the fibers and yarns decrease. However, since the macroscopic
    changes are still relatively minor, the changes can be ignored; (3) when the fabric
    is completely immersed, the water in the voids can be regarded as countless water
    columns, and the height of the water columns in the voids can be regarded as the
    thickness of the fabric. If the fabric has not reached complete wetting, the height
    of the water columns and air columns cannot be measured; (4) this model is based
    solely on thermal conduction and does not consider the effects of convection,
    radiation, and evaporation.


    This series of models defines wet-state fabrics as a mixed system of fibers, water,
    and air, and the total thermal resistance of the fabric is jointly determined
    by the thermal'
