  md: 'It should be noted that Mangat et al. used the moisture content $\mu$ and $1
    - \mu$ to represent the ratio of water and air in the interstices of the fabric,
    respectively, in the calculation formulas for air and water thermal resistance.
    According to the formula for moisture content, it represents the proportion of
    water in the wet fabric. Therefore, using moisture content to represent the ratio
    of water and air in the fabric interstices is not rigorous. The thermal resistance
    prediction curve in Mangat et al.’s results often underestimated the actual measurement
    values, which may be caused by the definition of moisture content. In this study,
    we followed the thermal resistance prediction model framework of Mangat et al.
    and used water content saturation to represent the ratio of water and air in the
    fabric interstices, which is the maximum water content that the fabric can absorb.
    The water content saturation was calculated as the ratio of the weight of water
    measured during the test to the maximum water absorption weight of the fabric.
    The maximum water absorption of the fabric was calculated based on the weight
    of the sample before and after immersion, using the Formulas (14) and (15):


    ```

    $$WAC = \frac{m_{water}}{SA} \times 100\%$$

    ```


    ```

    $$\eta = \frac{m_{wet} - m_{dry}}{WAC} \times 0.09$$

    ```


    where WAC is the maximum water absorption of the fabric in g/m², SA is the fabric
    area in m², $m_{water}$ is the maximum water weight that the fabric can absorb,
    g, $m_{wet}$ is the weight of the wet fabric, g, $m_{dry}$ is the weight of the
    ultradry fabric, g, and $\eta$ is the water content saturation, %. The fabric
    samples are all large samples with a size of 0.3 m × 0.3 m; the total area of
    the samples is 0.09 m².


    # 3. Experimental


    # 3.1. Materials


    Previous research on the thermal performance of wet fabrics has primarily focused
    on porous and highly moisture-absorbent knitted fabrics. In this study, we investigated
    the thermal performance of various types of woven fabrics commonly used in clothing,
    including natural fiber fabrics such as cotton, linen, silk, and wool, as well
    as synthetic fiber fabrics such as nylon and polyester. We also included blended
    fabrics such as polyester/cotton, nylon/spandex, polyester/viscose, and polyester/ammonia.
    To prevent moisture evaporation from the fabric during thermal resistance testing,
    we sealed the fabric samples in flat bags (0.4 m × 0.3 m). The fabric samples
    were wetted with laboratory-made deionized water to ensure consistency across
    all samples. See Table 1 for details on all fabric parameters.


    Table 1. Fabric specifications.


    | Symbol | Composition | Structure | Thickness (mm) | Weight (g/m²) | Porosity
    |

    |---|---|---|---|---|---|

    | CO | Cotton 100% | Plain | 0.78 | 121.87 | 0.8985 |

    | JU | Jute 100% | Twill | 0.93 | 249.25 | 0.8213 |

    | SI | Silk 100% | Plain | 0.63 | 72.94 | 0.9148 |

    | WO | Wool 100% | Twill | 1.02 | 175.39 | 0.8697 |

    | PO | Polyester 100% | Plain | 0.66 | 90.05 | 0.9011 |

    | NY | Nylon 100% | Plain | 0.72 | 161.06 | 0.8037 |

    | PE | Polyester 90% + Elastane 10% | Plain | 0.89 | 155.37 | 0.8739 |

    | PC | Polyester 65% + Cotton 35% | Plain | 1.41 | 227.26 | 0.8877 |

    | AV | Acrylic 70% + Viscose 30% | Plain | 0.89 | 200.62 | 0.8047 |

    | NE | Nylon 85% + Elastane 15% | Plain | 0.77 | 136.69 | 0.8748 |


    # 3.2. Sample Preparation


    Measuring the maximum water absorption of a fabric sample is the first step in
    evaluating a fabric’s ability to absorb and store moisture. The experimental method'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'followed that by Tang et al. [19]. To ensure that that the fabric was completely
    dry before measurement, all test fabrics were dried in an oven at 105 °C for 30
    min to remove any excess moisture and achieve an “ultra dry state” as proposed
    by Naka et al. [11]. Then, the fabric sample was soaked in deionized water for
    3 min and hung vertically until there were no liquid droplets falling for 30 s,
    indicating complete wetting of the fabric.


    Based on the maximum water absorption of the fabric, the fabric saturation level,
    and the area of the fabric sample, the amount of water added to the fabric sample
    is determined. The fabric saturation level is defined as the percentage of the
    added water to the maximum water absorption of the fabric, reflecting the degree
    of water content saturation in the fabric. Since the testing time of the thermal
    resistance tester is relatively long, the evaporation of water from the test fabric
    during the test will not only affect the temperature and humidity of the surrounding
    environment but also cause a decrease in the moisture content of the fabric. To
    address this issue, the method proposed by Raccuglia et al. [20] was adopted to
    seal the wet fabric. Specifically, the ultradry fabric was placed flat in a sealed
    bag and a certain amount of deionized water was measured and poured into a humidifying
    spray bottle. The spray bottle was then suspended about 2 cm above the center
    of the fabric sample and sprayed evenly with deionized water. After 5 min of standing,
    the bag is sealed once the fabric is fully wetted.


    In addition, the thermal resistance tests were conducted on the ultradry fabric
    and on fabrics with saturation levels of 20%, 40%, 60%, 80%, and 100%. If the
    saturation level of the test sample exceeded 100%, i.e., there is excess water
    between the fabric and the simulated skin, the humidification procedure is performed
    in two steps to avoid insufficient water due to excess water adhering to the inner
    wall of the sealed bag. First, the added water is determined based on the maximum
    water absorption of the sample, followed by adding the excess water using a micro
    pipette to the center of the sample before the thermal resistance test is performed.


    # 3.3. Equipment and Methods


    The thermal conductivity, thermal resistance, and insulation properties of fabric
    samples were measured using a textile heat transfer performance tester (Ningbo
    Textile Instrument Co., Ltd., Ningbo, China, YG606E, see Figure 1) in accordance
    with GB/T 11048-2018 (Textiles—Physiological effects—Measurement of thermal and
    water-vapour resistance under steady-state conditions (sweating guarded-hotplate
    test)) [21]. The instrument provides rapid measurement of both steady-state and
    transient thermal performance. To some extent, this instrument simulates the heat
    flow density q (W/m²) from human skin to fabric when the fabric is initially in
    contact with the skin in an environment without forced convection. The fabric
    thickness was determined using a digital fabric thickness gauge (Wenzhou Interco
    Testing Instruments Co., Ltd., Wenzhou, China, YG(B)141D) in accordance with GB/T
    3820-1997 (Determination of thickness of textiles and textile products) [22],
    whereas the surface density was determined using an electronic balance with an
    accuracy of ±0.1 g in accordance with GB/T 4743-2009 (Textiles—Yarn from packages—Determination
    of linear density (mass per unit length) by the skein method) [23]. The fabric
    samples were dried in a ventilated oven (Wenzhou Baien Instrument Co., Ltd., Wenzhou,
    China, Y802K) and sealed using a hand-press sealing machine; a humidifier was
    used.


    When two fibers are blended during the fabric weaving process, the density of
    the blended fibers cannot be directly obtained. However, it can be estimated using
    the following equation proposed by Militky [24].


    ```

    \rho_{ab} = r\rho_a + (1 - r)\rho_b

    (16)

    ```


    where a and b represent the types of fibers, ρa and ρb represent their fiber densities,
    r represents the proportion of fiber a, and ρab represents the density of the
    blended fiber. All tests were conducted under laboratory conditions with a temperature
    of 20 ± 1 °C, relative humidity of 50 ± 5%, and wind speed < 0.4 m/s.'
