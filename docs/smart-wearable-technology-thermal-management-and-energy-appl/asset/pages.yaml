    # 4. Discussion


    This study presents a Textile Image Processing Algorithm (TIPA) specifically designed
    for the detection of defects in conductive textiles manufactured through the dip-coating
    process. The proposed algorithm demonstrates significant efficacy, achieving overall
    accuracy exceeding 85%, with a maximum performance of 100% under optimized conditions.
    These findings underscore the algorithm''s potential to address critical quality
    control challenges in the domain of conductive textiles, a pivotal component in
    wearable technology applications. Table 2 presents a comparison between the results
    of this study and those obtained using various artificial intelligence models
    trained specifically for detecting stains or spot defects in actual textile fabrics.
    Except for the basic shallow CNN model, which achieved an accuracy level of 62.67%,
    other models demonstrated high accuracy, exceeding approximately 90%. The differences
    between the studies in terms of the image collection methods and training datasets
    used must be considered. However, this study optimized threshold criteria, achieving
    a remarkably high accuracy level of 100%, demonstrating the superiority of the
    proposed model.


    Table 2. The comparative accuracy of various TIPAs.


    | Algorithm Model | Accuracy [%] |

    |---|---|

    | CNN [39] | 62.67 |

    | VGG16 [39] | 90.17 |

    | MobileNet [39] | 97.64 |

    | InceptionV3 [39] | 93.92 |

    | Xception [39] | 96.89 |

    | DAGMC9 [34] | 99.60 |

    | This study 2 | 100 |


    2 Threshold ratio: 15%.


    The primary contribution of this research lies in the multi-step processing framework
    encompassing preprocessing, filtering, and threshold optimization. By employing
    techniques such as histogram equalization and size-based filtering, our TIPA effectively
    identified and classified defect regions characterized by the uneven distribution
    of conductive particles. This approach builds upon existing studies, emphasizing
    the necessity of tailored image processing methodologies for detecting defects
    in textiles with intricate'
  merge: -1
  img_proc: true
- pgno: 170
  md: 'patterns and material heterogeneity. Moreover, this TIPA advances prior methodologies
    by optimizing threshold ratios to adapt to various defect types, thereby enhancing
    its robustness and applicability. A notable aspect of this study is the role of
    threshold ratios in controlling defect detection sensitivity. Adjusting the threshold
    ratio within the range of 5% to 30% allowed the algorithm to effectively adapt
    to diverse defect characteristics. This adaptability underscores our TIPA''s flexibility
    and utility for a wide range of textile applications. While certain challenges
    persist in detecting large and diffuse stains, these cases were minimal and did
    not significantly impact the overall performance of the algorithm.


    The limitations of this study lie in the classification criteria for grayscale-converted
    pixel values, which are influenced by various parameters. The filtering thresholds
    determined by the primary and secondary pixel sizes, as well as the classification
    of defective and normal images based on the first detected pixels and threshold
    ratio, are dependent on several factors. These include the base fabric color,
    the type of conductive particles, and the overall image resolution. As these factors
    can vary, it is essential to establish appropriate classification and filtering
    criteria tailored to specific conditions. This study aimed to propose a fundamental
    framework for the preprocessing and detection principles of a new TIPA, which
    is designed specifically to detect stain defects caused by the aggregation of
    conductive particles—one of the critical defects that can occur in conductive
    textiles.


    Future research will focus on several key areas to further enhance the applicability
    and effectiveness of this TIPA. Expanding the dataset to include a broader variety
    of textiles and defect types will ensure greater generalizability across diverse
    manufacturing scenarios. Incorporating advanced machine learning techniques, such
    as convolutional neural networks (CNNs), could complement the current framework
    by enhancing its ability to detect complex defect patterns. Additionally, the
    development of real-time implementation strategies for industrial environments
    will be a critical step in validating the algorithm’s practical utility. Further
    exploration of adaptive thresholding methods that respond dynamically to varying
    defect characteristics will also refine the algorithm’s precision and robustness.


    # 5. Conclusions


    The findings of this study underscore TIPAs as transformative tools in the domain
    of textile quality control, particularly for conductive textiles employed in wearable
    technology. Our algorithm’s high accuracy and adaptability render it highly effective
    for detecting defects in textiles with varied patterns and compositions. Beyond
    mere defect detection, the successful application of TIPAs promises numerous benefits,
    including enhanced production efficiency, reduced material wastage, and improved
    reliability of wearable devices that depend on conductive textiles.


    In practical applications, TIPAs prove invaluable in identifying defects that
    occur when conductive textiles function as electronic circuits. For instance,
    these algorithms can detect anomalies such as stains that compromise both aesthetic
    and functional properties, or areas with abnormally high or low surface resistance
    that impede electrical performance. These capabilities are critical in contexts
    where consistent electrical properties are essential, such as wearable biosensors,
    flexible displays, or energy-harvesting electronic fabrics. By detecting such
    defects during the early stages of production, TIPAs significantly enhance the
    reliability and performance of the final products. The optimization and industrial
    deployment of TIPAs have the potential to set new benchmarks for quality control
    in smart textile manufacturing. Addressing current challenges and expanding our
    algorithm’s functionality will establish TIPAs as a cornerstone for the integration
    of intelligent technologies in the textile sector, paving the way for innovative
    and dependable smart textile solutions.'
