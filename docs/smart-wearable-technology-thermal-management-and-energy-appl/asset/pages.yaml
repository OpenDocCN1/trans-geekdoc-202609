    # Figure 7. Phase-change cooling clothing [3].


    Phase-change cooling clothing has a simple structural design, does not require
    the installation of refrigeration equipment like air-cooled suits and liquid-cooled
    suits, is easy to put on and take off, and has a good cooling effect. However,
    the production cost of phase-change materials is high, the weight of phase-change
    materials increases the burden of the cooling suit, and the phase-change materials
    installed in the pockets of the clothing lead to phase-change cooling suits with
    poor breathability, preventing the evaporation of sweat. To improve the cooling
    performance of phase-change cooling clothing, the common method is to select phase-change
    materials with high thermal properties and temperatures close to the skin temperature
    and reasonably distribute phase-change materials according to temperatures of
    different parts of the human body. In addition, adding an insulating layer outside
    the phase-change material to reduce the heat absorption of the phase-change material
    from the external environment, and adding metal nanoparticles, graphene, or other
    thermal fillers to the phase-change material to enhance the thermal conductivity
    of the phase-change material is also one of the methods to improve the cooling
    performance of phase-change cooling suits [14]. Tesar and Kordik [47,48] conducted
    experimental tests on PCM-based clothing for soldiers in hot desert climates.
    The moderate melting-point temperature of n-eicosane (35.7 °C) made it highly
    advantageous as it allowed for the maintenance of a temperature of 35 °C. Butts
    et al. [49] utilized PCM to cool 20 male participants in their clothing and observed
    a significant reduction in their thermal, psychological, and perceptual strains
    when compared to males not exposed to PCM under test conditions of 34.2 °C and
    54.7% RH.'
