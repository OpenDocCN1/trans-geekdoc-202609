    them suitable for highly precise measurements and detailed analysis. However,
    there are significant limitations to this method. Optical sensors are prone to
    inaccuracies due to environmental factors such as lighting conditions, reflections,
    or obstacles, as well as the resolution limitations of the equipment itself. Consequently,
    the use of expensive'
