  md: '# 3.3. Thermoelectric Devices


    While Peltier elements can be used to create a temperature difference between
    both sides of the element by applying a voltage (cf. Section 2.3), the Seebeck
    effect can, vice versa, be used to generate a thermoelectric potential energy
    due to a temperature difference between both electrodes on the respective thermoelectric
    element [74]. Generally, a thermoelectric element consists of a pair of p- and
    n-doped semiconductors between a hot and a cold side in which the heat flow from
    the hot to the cold surface is accompanied by an electric current, as depicted
    in Figure 4 [75]. The generated voltage V is proportional to the temperature difference
    ΔT according to V = αΔT with the Seebeck coefficient α [75]. The power generation
    also depends on the cross-sectional area of the thermoelectric device and the
    length of their legs, besides the aforementioned material properties, such as
    the Seebeck coefficient and electrical and thermal conductivity [75].


    ![](img/c1925febd7dde400183c23c14d668ef0_41_0.png)


