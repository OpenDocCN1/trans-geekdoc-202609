    | Embroidery machine | PR670E | BROTHER, Bridgewater, NJ, USA | Sewing electrodes,
    connection wires, and connectors |

    | Indoor cycling apparatus | MKHB-01 | XAMEN KANGTO FITNESS FOUPWENT CO, Xiamen,
    China | Device for measuring respiration based on exercise intensity |

    | LCR meter | E4980AL | KEYSIGHT, Santa rosa, CA, USA | Measurement of capacitance
    values based on respiration |

    | MATLAB | R2023a | MathWorks, Natick, MA, USA | Data classification and optimization
    using deep learning |


    # 3. Results and Discussion


    Breathing data were collected under four conditions, resting, low intensity, moderate
    intensity, and high intensity, based on changes in cycling speed. Using this dataset,
    classification was performed using both CNN and ResNet algorithms, and their results
    were compared to determine the most suitable algorithm for this classification
    task. Figure 6 sequentially presents the capacitive data measured by the respiratory
    sensor for each condition: (a) resting, (b) low intensity, (c) moderate intensity,
    and (d) high intensity. Additionally, the results were derived by comparing accuracy,
    precision, recall, and the F1-score. Accuracy refers to the proportion of correctly
    predicted samples out of the total samples. Precision measures the proportion
    of true positive predictions among all positive predictions, while recall measures
    the proportion of true positive instances among all actual positive instances.
    The F1-score represents the harmonic meaning of precision and recall.'
