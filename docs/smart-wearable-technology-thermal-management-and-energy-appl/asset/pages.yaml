  md: '# 2.4. Measurements


    # 2.4.1. Physiological Measurement


    Core body temperature measurements were recorded at one-minute intervals using
    a wearable sensor device (CORE, greenTEG). The microclimatic temperature was monitored
    every minute using digital thermometers (DS1923, iButton) attached inside the
    personal protective garment on the upper back area. Skin temperature sensors (DS1923,
    iButton) were placed at eight locations (forehead, left upper chest, right scapula,
    left and right arm, left hand and calf, and right anterior thigh; see Figure 3)
    using waterproof adhesive tape (PVC, 3M). These sensors consistently recorded
    local skin temperatures every minute throughout the entire test period. To calculate
    the mean skin temperature, an eight-point weighting scheme, as specified in the
    ISO 9886 standard, was employed (Table 1).


    ![](img/c1925febd7dde400183c23c14d668ef0_107_0.png)


    Figure 3. Measuring sites of heart rate, core temperature, skin temperature, and
    microclimatic temperature.


    Table 1. Measuring sites and weighting coefficients.


    | Measuring sites | Forehead | Right scapula | Left Upper chest | Right arm |
    Left arm | Left hand | Right anterior | Left calf |

    |---|---|---|---|---|---|---|---|---|

    | Weighting coefficients | 0.07 | 0.175 | 0.175 | 0.07 | 0.07 | 0.05 | 0.19 |
    0.2 |


    The mean skin temperature is obtained via the following formula:


    ```

    t_{sk} = \sum k_i t_{ski}

    ```


    # 2.4.2. Subjective Evaluation


    Thermal sensation, wetness sensation, and thermal comfort sensation were assessed
    initially and then every 10 min throughout the entirety of the trials. The mean
    value was calculated for each parameter. Thermal sensation for both the whole
    body and the upper body was rated using a nine-point scale (Figure 4a), ranging
    from −4 (very cold) to +4 (very hot), with 0 indicating a neutral thermal sensation.
    Wetness sensation for the whole body and the upper body was measured using a seven-point
    scale (Figure 4b), where −3 corresponds to a very wet sensation, +3 to a very
    dry sensation, and 0 represents a neutral wetness sensation. Thermal comfort for
    the whole body and the upper body was assessed using a five-point scale (Figure
    4c), ranging from −4 (extremely uncomfortable) to 0 (comfortable).'
