  md: 'equipment and the necessity of a controlled environment often make this approach
    less feasible for widespread use. Additionally, as the measurement duration increases,
    the volume of image processing data grows exponentially, requiring substantial
    computational resources and leading to increased costs and time for both measurement
    and analysis.


    On the other hand, wearable sensors offer significant convenience by being minimally
    attached to critical joints or positions while still effectively analyzing or
    recognizing movements [21–23]. The smaller amount of data they generate allows
    for easy storage in compact modules or devices and enables real-time wireless
    transmission through technologies like Bluetooth or Wi-Fi. Furthermore, wearable
    sensors are less affected by external environmental factors, reducing the margin
    of error, which makes them particularly well-suited for outdoor activities, training,
    and exercise. Their accessibility and ease of use are enhanced by their relatively
    low cost, allowing for widespread adoption. Moreover, these sensors are typically
    lightweight and flexible, enabling prolonged use without causing discomfort to
    the wearer. Also, wearable sensors, due to their advantage of being wearable,
    can be utilized not only in special scenarios such as dangerous situations involving
    soldiers, firefighters, or police officers, artificial joints that move in coordination
    with the limbs of individuals with amputated body parts, and sensing abnormal
    muscle tremors caused by irregular brain signals in Parkinson’s disease, but also
    in everyday applications such as monitoring athletes, supporting dieting efforts,
    and measuring sleep patterns.


    Notably, numerous studies have utilized wrist-mounted IMU sensors for human activity
    recognition (HAR), as the wrist exhibits significant movement during various physical
    activities, making it an ideal location for capturing representative HAR data.
    In a related study, a wearable device was developed to recognize gestures from
    wrist movements occurring during motion [24]. Another study focused on detecting
    abrupt gestures rather than repetitive ones [25]. Such studies highlight the extensive
    research being conducted to interpret user intentions and states from the complex
    data generated by the hand and wrist, which are commonly involved in various activities
    [26]. In this study, we considered a watch-type wearable product, which is a representative
    wearable sensor, and attached an IMU sensor to the wrist to obtain Z-axis acceleration
    data for recognizing 14 types of movements.


    Another reason why research on human activity recognition (HAR) is receiving increased
    attention is the rapid advancement of recognition algorithms driven by artificial
    intelligence (AI) [27–29]. With the development of machine learning and deep learning
    techniques, AI can now efficiently classify and recognize the complex and nuanced
    features present in human movement data. This has greatly simplified the process
