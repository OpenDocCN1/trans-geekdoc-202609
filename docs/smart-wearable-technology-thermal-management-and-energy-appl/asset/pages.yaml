  md: '# Review


    # Quantitative Comparison of Personal Cooling Garments in Performance and Design:
    A Review


    Yiying Zhou 1, Lun Lou 2 and Jintu Fan 1,3,4,*


    +   1 School of Fashion and Textiles, The Hong Kong Polytechnic University, Hong
    Kong; yi-ying.zhou@connect.polyu.hk

    +   2 Energy Sector, Nano and Advanced Materials Institute, Hong Kong Science
    Park, Hong Kong; lawrence.lou@nami.org.hk

    +   3 Research Center of Textiles for Future Fashion, The Hong Kong Polytechnic
    University, Hong Kong

    +   4 Research Institute of Sports Science and Technology, The Hong Kong Polytechnic
    University, Hong Kong

    +   * Correspondence: jin-tu.fan@polyu.edu.hk


    Abstract: Personal cooling garments (PCGs) have gained increasing attention as
    a promising solution to alleviate heat stress and enhance thermal comfort in hot
    and humid conditions. However, limited attention has been paid to the influence
    of clothing design on cooling performance. This review highlights the influence
    of design factors and provides a quantitative comparison in cooling performance
    for different types of PCGs, including air cooling garments, evaporative cooling
    garments, phase-change cooling garments, and liquid cooling garments. A detailed
    discussion about the relationship between design factors and the cooling performance
    of each cooling technique is provided based on the available literature. Furthermore,
    potential improvements and challenges in PCG design are explored. This review
    aims to offer a comprehensive insight into the attributes of various PCGs and
    promote interdisciplinary collaboration for improving PCGs in both cooling efficiency
    and garment comfort, which is valuable for further research and innovation.


    Keywords: personal cooling garments; cooling technique; cooling performance; clothing
    design; quantitative comparison


    Citation: Zhou, Y.; Lou, L.; Fan, J. Quantitative Comparison of Personal Cooling
    Garments in Performance and Design: A Review. Processes 2023, 11, 2976. https://doi.org/10.3390/pr11102976


    Academic Editors: Iqbal M. Mujtaba and Blaž Likozar

    Received: 11 September 2023

    Revised: 10 October 2023

    Accepted: 12 October 2023

    Published: 14 October 2023


    Copyright: © 2023 by the authors. Licensee MDPI, Basel, Switzerland. This article
    is an open access article distributed under the terms and conditions of the Creative
    Commons Attribution (CC BY) license (https://creativecommons.org/licenses/by/4.0/).


    # 1. Introduction


    Heat stress has become a growing concern with the impact of climate change. The
    high air temperatures, high relative humidity, high radiant temperature, and high
    activity levels or a combination of these factors present a significant challenge
    to both public health and occupational productivity [1–4]. Since humans can only
    regulate their core body temperature within a narrow range, excessive body heat
    beyond the capacity of physiological thermoregulation can result in heat accumulation.
    It may lead to a higher risk of heat-related illness and conditions such as dehydration,
    heat stroke, chronic kidney injuries, or even mortality [5–9].


    Thermal comfort, as defined by the International Organization for Standardization
    [10], refers to the subjective state of an individual’s satisfaction with the
    thermal environment. Individual differences in thermal comfort may exist in different
    climates as well as different physiological, behavioral, and cultural elements.
    Consequently, even when exposed to the same environmental conditions, individuals
    may perceive thermal comfort differently [11,12]. Finding acceptable temperatures
    for individuals depends on their opportunities to adjust conditions, such as changing
    their clothing or workplace to feel more comfortable. Although heating, ventilation,
    and air conditioning (HVAC) systems are commonly employed in indoor environments
    to lower temperatures and alleviate heat stress, they are primarily designed to
    cater to groups of occupants within buildings. Additionally, they are limited
    by energy requirements and operational costs, making them unsuitable for outdoor
    settings [13,14]. In contrast, personal cooling garments (PCGs) aim'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'to provide direct thermal management to individuals, having been proven as
    an effective measure to manage the thermal state, satisfy individual thermal comfort
    needs, and improve working performance [15,16]. By focusing on individuals and
    offering personalized cooling solutions, PCGs offer a promising approach to address
    thermal comfort challenges in various situations.


    Various types of PCGs have been investigated and reviewed in the past decade [17–24].
    However, prior reviews primarily focused on the classification of PCG types, the
    introduction of materials, and potential applications; there is limited discussion
    about the quantitative comparison of different PCGs. Moreover, the factors of
    garment design that are closely related to the cooling performance are mentioned
    less in previous reviews. This paper aims to provide a comprehensive overview
    of the current state of the art, examine design factors associated with cooling
    efficiency, and conduct a quantitative comparison of different PCGs in critical
    aspects.


    # ## 2. Methodology


    # ### 2.1. Literature Search Strategy


    Database searches were conducted in Google Scholar and Web of Science, covering
    the period from 1966 to 2023. All the terms that related to ‘personal cooling
    garment’ and ‘cooling power’ were searched through the Google Scholar system.
    The search strategy incorporated keywords and synonyms, which were searched in
    the title, abstract, or keyword fields of the databases. Moreover, to find more
    relevant studies, we surveyed journals using keywords that included ‘air cooling
    garment’, ‘evaporative cooling garments’, ‘phase change cooling garments’, ‘liquid
    cooling garments’, ‘thermoelectric cooling garments’, and ‘radiative cooling garments’.
    We also assessed all full-text papers for eligibility.


    # ### 2.2. Selection Criteria


    A systematic literature search was conducted to identify relevant articles, research
    papers, and studies related to personal cooling garments. The following criteria
    were used for source selection.


    +   **Inclusion criteria:**

    +   1. Peer-reviewed journal articles, conference papers, and academic studies.

    +   2. Publications addressing personal cooling garments, technologies, and related
    topics.

    +   3. Publications addressing cooling performance (e.g., cooling power).

    +   4. Publications addressing the clothing design which affected the cooling
    performance.


    +   **Exclusion criteria:**

    +   1. Non-peer-reviewed sources, such as blog posts.

    +   2. Publications that do not directly pertain to personal cooling.

    +   3. Publications that do not assess the cooling performance (e.g., cooling
    power) of personal cooling garments.

    +   4. Publications that do not related to garments.


    # ## 3. Classification and Design Parameters


    Personal cooling garments can be categorized into six different types based on
    the cooling technique used, namely, air cooling garments, evaporative cooling
    garments, phase-change cooling garments, liquid cooling garments, thermoelectric
    cooling garments, and radiative cooling garments. Detailed discussions such as
    the definition, principle, and design factors affecting the effectiveness of each
    category will be discussed in this section.


    +   - Air cooling garments


    Air cooling garments (ACGs) which improve the convective and evaporative heat
    dissipation of the human body can be classified into two types: active and passive
    ACGs. The active ACGs require batteries or external energy supplies to promote
    ventilative heat exchange within the clothing microenvironment. A forced convection
    can be introduced by electronic devices such as fans [25] (Figure 1a), vortex
    tubes [26] (Figure 1b), blowers [27],'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'etc. In terms of garment design, to create sufficient air space between the
    garment and the human body, the outer layer of most active ACGs is usually made
    of wind-proof fabric to prevent air from escaping to the environment. In contrast,
    passive ACGs rely on air ventilation triggered by body movements and natural convection
    as well as the internal characteristics of textiles. The cooling effect can be
    regulated by the opening and mesh or spacer and mesh structures of a garment [28–31].


    ![](img/c1925febd7dde400183c23c14d668ef0_64_0.png)


    Figure 1. The schematic diagram of active air cooling garments (ACGs) (e.g., cooling
    achieved by fan (a) and vortex tube (b)).


    The cooling effectiveness of ACGs can be affected by many factors, such as clothing
    design, environmental conditions, and the users. From the aspect of clothing design,
    these factors are related to the clothing size, the type of devices, the placement
    site of devices, the opening site, and the clothing eyelet. Zhao et al. [32] studied
    the design of locations for fans and openings at different torso sites. They found
    that the lower front placement site with both front and back openings achieved
    the best cooling performance. For the localized cooling, the ventilation location
    had more influence than the design of the opening. The ventilation units can be
    placed anywhere requiring more evaporative cooling. The adjustable openings (closed
    or opened) are helpful for the wearers’ comfort but have no significant difference
    in the cooling performance under the same flow rate. Zhao et al. [33] investigated
    the effect of clothing eyelet designs (sizes and positions) for the air ventilation
    system and found that the eyelet could reduce the clothing bulkiness (p < 0.05)
    but had no significant impact on the cooling effectiveness (p > 0.05). Ho et al.
    [28] designed 10 different opening and mesh styles of T-shirts and found that
    the openings applied at two vertical side panels along the side seams of t-shirts
    were the most effective to release heat and moisture from the human body. Yang
    et al. [34] found that the upper body heat loss of ACGs was related to the combined
    influences of ventilation rate and clothing size. The ventilation rate can increase
    upper body heat loss, while the clothing size has almost no impact on the effectiveness
    in high ventilation. Yi et al. [25] evaluated different ventilation units for
    ACGs and found that ACGs with higher flow rates perform better, which can achieve
    a higher cooling power. Lou et al. [35] investigated the effects of garment design
    on cooling performance and recommended that the inner space between ACGs and the
    human body that may influence the efficiency of heat exchange is important for
    garment design.'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'In brief, ACGs provide an innovative approach to enhance thermal comfort and
    mitigate physiological strain. These cooling garments, which create an air gap
    between the body and clothing, coupled with active cooling mechanisms such as
    fans or blowers, offer effective heat dissipation. For the design of active ACGs,
    the eyelet design and adjustable openings are helpful for the bulkiness problem
    caused by the impermeable outer fabric; at the same time, the inner space between
    ACGs and the human body also needs to be considered in the design process. Placing
    devices with a higher flow rate at the sweating region is preferred for improving
    cooling efficiency, while the direct cooling of fans at their location may decrease
    the localized comfort sensation.


    +   • Evaporative cooling garments


    Evaporative cooling garments (ECGs) are based on the phase change of liquid (mostly
    water or sweat generated by the human body) from liquid to vapor state that can
    absorb heat for personal thermal management. As a passive cooling garment, it
    is energy-saving and environment-friendly. There are two mainly used ECGs (Figure
    2): One is a liquid-soaked (water mainly) garment that provides cooling by direct
    contact with the skin surface; it should be dipped in liquid to reserve the cooling
    liquid in the garment before use. Another is dry evaporative cooling garments
    that need to be filled with water before use.


    ![](img/c1925febd7dde400183c23c14d668ef0_65_0.png)


    Figure 2. The schematic diagram of evaporative cooling garments (ECGs).


    The cooling performance of the ECG is related to the properties of the clothing
    fabric, fitness, and ambient environment, such as the moisture evaporation and
    water vapor permeability of fabric and the air gap between the human body and
    clothing. For this type of garment, the cooling only happened on the outer clothing
    surface, not the inner surface. Hes et al. [36] studied the cooling effect of
    wet fabric with the fabric worn with or without an air gap between the skin and
    the fabric. They found that the cooling efficiency increased with the increase
    of the fabric moisture content without air layers, and if 2 mm and 4 mm thick
    air layers were involved, the total cooling efficiency would not be influenced
    by the water content. The better cooling performance happened when the fabric
    had direct contact with the skin. Guan et al. [37] studied the cooling power of
    ECGs that provide cooling by sweating from the human body and showed that the
    evaporative area and locus (in-plane and trans-plane moisture transfer) were determinants
    of the cooling efficiency. The cooling efficiency was negatively correlated with
    the evaporative resistance and the thickness of'
  merge: -1
  img_proc: true
- pgno: 66
  md: 'the fabric. Gillis et al. [38] assessed an ECG saturated with combined menthol
    and ethanol for evaporative cooling performance versus that with water and found
    that menthol and ethanol caused cooler sensations and a heat storage response.


    ECGs utilize the natural phase change of water from liquid to vapor to provide
    effective personal cooling. They offer an energy-efficient and environmentally
    friendly approach to maintaining thermal comfort. To improve the cooling performance
    of ECGs, the first step is to increase the liquid content and ensure that the
    fabric has direct contact with skin. The second is to decrease the evaporative
    resistance and thickness of the fabric for ECGs.


    +   Phase-change cooling garments


    Phase-change cooling garments (PCCGs) provide cooling through phase-change materials
    (PCMs) which can store latent heat for thermal energy transfer. PCMs can absorb
    heat from the body surface during the phase-change process that can increase the
    heat loss of the human body. PCMs can absorb or release heat at a constant temperature.
    Over 150 phase-change materials are used in scientific research [39]. Some commonly
    used PCMs are ice, frozen gel, and paraffin waxes. They have different phase-change
    temperatures (from 0–40 °C) and can be applied for various heat storage capacities
    [40]. There are two primary technologies used for the development of PCCGs. One
    is the phase-change material packs which can be placed inside the garment’s pockets
    (Figure 3). The other is to incorporate PCMs into daily clothing, such as ordinary
    fabrics or fibers. (1) Phase-change microcapsules are PCMs packaged within a suitable
    wall material which can be impregnated or coated on the surface of the garment
    [41,42]. (2) Phase-change fiber is the PCM packaged inside a fiber that can be
    used in garment textiles [43,44]. However, the preparation process of phase-change
    microcapsules and fiber is complicated and costly, and most studies focus on the
    development of materials; there are limited studies about the cooling garments
    that are made by phase-change microcapsules and fiber.


    ![](img/c1925febd7dde400183c23c14d668ef0_66_0.png)


    Figure 3. The schematic diagram of phase-change cooling garments (PCCGs).


    The cooling effect of PCCGs mainly depends on the clothing design as well as the
    form and selection of PCMs. Yoo et al. [45] investigated the effects of the number
    and position of PCM-treated fabrics and found that the treated fabric with a greater
    amount of PCMs performed better. Moreover, if there is more than one layer, the
    outer layer of the garment is more appropriate for the effects of the PCMs. According
    to Mokhtari et al. [23], the PCM microcapsules can only provide a small capacity
    of heat absorption (about 15 W) with the limitation of the weight of materials
    that can be coated on the garment. Hence, they are not applicable in hot environments,
    where ice packs are more effective. House et al. [46] assessed the performance
    of four PCCGs containing different PCMs, which melted at 0 °C, 10 °C, 20 °C, and
    30 °C separately, and the PCCGs were worn under firefighters’ protective clothing.
    They found that 10 °C has the best cooling efficiency when combining work and
    rest periods, and they also stated that a cooling vest containing ice packs (melting
    at 0 °C) could be used only if the thermal resistance between the ice packs and
    the skin was higher. Gao et al. [47] evaluated PCCGs with different melting temperatures,
    masses, and covering'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'areas and found that the PCCG with the lower melting temperature (24 °C) performed
    better than those with higher melting temperatures. They also found that the cooling
    performance was mainly determined by the covering area, while the cooling duration
    depended on the PCM mass. In hot climates, the temperature gradient for PCCGs
    was suggested to be equal to or greater than 6 °C.


    PCCGs represent an innovative and promising solution for achieving effective cooling
    and enhancing thermal comfort in various environments. By harnessing the properties
    of PCMs that can change from solid to liquid and vice versa to create a cooling
    effect, these garments offer a unique approach to regulating body temperature.
    The design and composition of PCCGs play an important role in their cooling efficiency.
    A higher mass of PCMs or PCM microcapsules is positive for cooling efficiency,
    and the lower melting temperature can provide a higher cooling rate. The higher
    phase-transition temperature can provide a longer cooling duration. A temperature
    gradient over 6 °C is recommended. Ice packs can only be used when there is sufficient
    thermal resistance between the skin and ice. At the same time, the covering area
    needs to be considered in the design of PCCGs.


    +   • Liquid cooling garments


    Liquid cooling garments (LCGs) provide cooling by the pump-driven circulation
    of liquid coolant inside the tubes embedded in the garment (Figure 4). The tubes
    may be sewn into the fabric layer, and the pump is powered by electricity. The
    circulating liquid may be cold or icy water, liquid metal, or a mixture of water
    and propylene or ethylene glycol [48,49]. The liquid microclimate cooling systems
    produce a temperature gradient that makes the conductive and convective heat transfer
    take place among the coolant, the human body, and the environment.


    ![](img/c1925febd7dde400183c23c14d668ef0_67_0.png)


    Bag to hold liquid coolant


    Figure 4. The schematic diagram of liquid cooling garments (LCGs).


    The cooling performance of LCGs depends on the design of the clothing, the ambient
    condition, and the controller, which determines the liquid flow rate, coolant
    temperature, and intermittent or regional cooling control [50–54]. In terms of
    clothing design, it is related to the fitness, tubing characteristics, different
    body areas, and fabric [55–58]. Kayacan et al. [51] compared two different designed
    LCGs and found that the fabrics with a natural curved structure performed better
    than the plain fabrics; they also found that when the liquid inlet temperature
    was decreased, the effective cooling increased slightly. Burton et al. [52] found
    that the heat removal rate of LCGs was not linearly related to the flow rate when
    the flow was relatively slow. When the flow rate exceeds 11 L/min, little further
    improvement in the cooling performance can be made with the increase in flow rate.
    These findings were also shown by Frim et al. [50]. Dionne et al. [59] evaluated
    PCGs with different densities of tubing through thermal manikin testing. They
    found that under the condition of the same flow rate and liquid inlet temperature,
    the heat removal rate'
  merge: -1
