  md: 'Figure 1. A schematic of the proposed work.


    # 2. Materials and Methods


    # 2.1. Respiration Measurement System


    # 2.1.1. Breathing Mechanism


    Understanding the mechanism of breathing is essential for accurate respiratory
    measurement. Equally important is the selection of a sensor measurement method
    that effectively corresponds to this mechanism. Various methods exist for measuring
    respiration, including monitoring airflow through the nose, capturing respiratory
    sounds, and tracking abdominal movement. Among these, this study focuses on measuring
    abdominal movement. This approach was chosen because it is the most suitable for
    wearable sensor applications and can be easily implemented in daily life.


    In this method, respiration is measured using capacitive values (C) derived from
    abdominal movement (Equation (1)). The principle of measurement is as follows:
    when inhaling, air enters the lungs, causing the lungs to expand. This expansion
    leads to the spreading of the ribcage and the subsequent expansion of the thorax
    and abdomen. Conversely, when exhaling, air exits the lungs, the ribcage contracts,
    and the abdomen compresses. This process results in variations in abdominal volume,
    which correspond to changes in the distance between electrodes in a capacitive
    sensing system. By analyzing these differences in capacitive values, respiration
    can be assessed.


    The two sensors were placed on the front and back of the body near the xiphoid
    process, where the abdominal movements caused by breathing can be most effectively
    measured. When the abdomen expands, the distance between the electrodes (d) is
    denoted as $d_0$, and during contraction, it is $d_f$. The difference between
    these distances, $\Delta d$, is used to analyze respiration (Equation (2)). The
    measurement principle and the breathing mechanism are illustrated in Figure 2
    [23].


    $$C = \frac{\varepsilon A}{d}$$


    $$\Delta d = d_f - d_0$$


    Figure 2. Abdominal movement in response to breathing [23].'
