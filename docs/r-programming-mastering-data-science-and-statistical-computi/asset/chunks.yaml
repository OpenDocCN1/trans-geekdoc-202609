    data <- read.csv("path/to/your/file.csv", header = TRUE, sep = ",", stringsAsFactors
    = FALSE)

    ```


    - `header = TRUE`：指示第一行包含列名。

    - `sep = ","`：指定 CSV 文件使用的分隔符。

    - `stringsAsFactors = FALSE`：防止字符字符串转换为因子。


