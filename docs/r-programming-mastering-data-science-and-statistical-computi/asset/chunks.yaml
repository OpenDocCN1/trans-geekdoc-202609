    # WRITING AND RUNNING YOUR FIRST R SCRIPT


    ## Writing and Running Your First R Script


    Once you have a basic understanding of R''s syntax, variables, and data types,
    the next step is to write and run your first R script. In this section, we will
    guide you through the process of creating, writing, and executing an R script
    to perform a simple data analysis task.


    ### 1. What is an R Script?


    An R script is a text file containing a series of R commands and functions that
    can be executed sequentially. Scripts are useful for automating repetitive tasks,
    documenting your work, and sharing your code with others. Scripts typically have
    the file extension `.R`.


    ### 2. Creating Your First R Script


    To create an R script, follow these steps:


    1. **Open RStudio**: If you are using RStudio, go to `File` > `New File` > `R
    Script`. This will open a new script editor window where you can start writing
    your code.

    2. **Name Your Script**: Save your script by clicking on `File` > `Save As...`.
    Choose a meaningful name, such as `my_first_script.R`, and select a location on
    your computer.


    ### 3. Writing Your First R Script


    Let''s write a simple R script that performs the following tasks:


    - Creates a vector of numbers.

    - Calculates the mean (average) of the numbers.

    - Plots a histogram of the numbers.


    Here’s the step-by-step breakdown:


    1. **Create a Vector**: First, we''ll create a vector of random numbers using
    the `rnorm()` function, which generates a set of numbers from a normal distribution.


    ```r

    # Create a vector of 100 random numbers

    my_numbers <- rnorm(100, mean = 50, sd = 10)

    ```


    2. **Calculate the Mean**: Next, we''ll calculate the mean of the numbers using
    the `mean()` function.


    ```r

    # Calculate the mean of the numbers

    average <- mean(my_numbers)

    # Print the mean

    print(average)

    ```


    3. **Plot a Histogram**: Finally, we''ll plot a histogram to visualize the distribution
    of the numbers using the `hist()` function.


    ```r

    # Plot a histogram of the numbers

    hist(my_numbers, main = "Histogram of Random Numbers", xlab = "Values", col =
    "blue")

    ```


    ### 4. Running Your R Script


    After writing your script, the next step is to run it to see the output. You can
    execute your script in several ways:


    1. **Run the Entire Script**: In RStudio, you can run the entire script by clicking
    the `Source` button, or by pressing `Ctrl+Shift+S` (Windows/Linux) or `Cmd+Shift+S`
    (Mac). This will execute all commands in your script.

    2. **Run Selected Lines**: You can also run selected lines of code by highlighting
    them and pressing `Ctrl+Enter` (Windows/Linux) or `Cmd+Enter` (Mac). This is useful
    for testing individual sections of your script.

    3. **Check the Output**: After running the script, you will see the results in
    the console. The mean value will be printed, and a histogram will appear in the
    `Plots` pane of RStudio.


    ### 5. Understanding the Output


    - **Mean Calculation**: The `print(average)` command will output the calculated
    mean of the vector `my_numbers` in the console. This is a single numeric value
    representing the average of all numbers.

    - **Histogram Plot**: The `hist()` function will generate a histogram that shows
    the distribution of 100 random numbers. The `main` argument sets the title, `xlab`
    sets the label for the x-axis, and `col` sets the color of the bars in the histogram.


    ### 6. Saving and Sharing Your Script


    Once you''ve written and tested your script, you can save it and share it with
    others. This script can be reused or modified for different tasks.


    - **Save Your Script**: Ensure your script is saved in a safe location on your
    computer. You can always reload and edit it later needed.

    - **Sharing**: You can share your `.R` script via email, cloud storage, or version
    control systems like Git. This allows others to run your script on their own systems,
    ensuring reproducibility of your analysis.


    # CHAPTER 3: DATA STRUCTURES IN R


    R is a powerful language designed for statistical computing and data analysis,
    and one of its core strengths lies in its ability to handle complex data structures.
    Among these, vectors, matrices, and arrays are foundational. In this section,
    we’ll explore these data structures, understand how they are created, manipulated,
    and applied in various contexts.


    ## Vectors in R


    A vector is the simplest and most common data structure in R. It is a one-dimensional
    array that can hold numeric, character, or logical data types, but all elements
    in a vector must be of the same type.


    ### Creating Vectors


    You can create a vector using the `c()` function, which combines values into a
    vector.


    ```r

    # Numeric vector

    numeric_vector <- c(1, 2, 3, 4, 5)

    # Character vector

    character_vector <- c("apple", "banana", "cherry")

    # Logical vector

    logical_vector <- c(TRUE, FALSE, TRUE)

    ```


    ### Accessing Elements


    YouYou can access elements in a vector using square brackets `[]`.


    ```r

    # Access the first element

    numeric_vector[1]

    # Access multiple elements

    numeric_vector[c(1, 3, 5)]

    ```


    ### Vectorized Operations


    One of the powerful features of vectors in R is vectorized operations. You can
    perform operations on entire vectors without needing explicit loops.


    ```r

    # Adding 2 to each element

    numeric_vector + 2

    # Element-wise multiplication of two vectors

    numeric_vector * c(2, 2, 2, 2, 2)

    ```


    ## Matrices in R


    A matrix is a two-dimensional array where elements are arranged in rows and columns.
    Like vectors, all elements in a matrix must be of the same type.


    ### Creating Matrices


    You can create a matrix using the `matrix()` function by specifying the data,
    number of rows, and number of columns.


    ```r

    # Creating a 2x3 matrix

    my_matrix <- matrix(1:6, nrow = 2, ncol = 3)

    # Display the matrix

    print(my_matrix)

    ```


    This will produce:

    ```

    [,1] [,2] [,3]

    [1,]    1    3    5

    [2,]    2    4    6

    ```


    ### Accessing Elements


    You can access elements in a matrix using square brackets `[]` by specifying the
    row and column indices.


    ```r

    # Access the element in the first row, second column

    my_matrix[1, 2]

    # Access the entire second row

    my_matrix[2, ]

    ```


    ### Matrix Operations


    R supports a variety of matrix operations, such as addition, subtraction, multiplication,
    and more.


    ```r

    # Matrix addition

    matrix1 <- matrix(1:4, nrow = 2)

    matrix2 <- matrix(5:8, nrow = 2)

    matrix_sum <- matrix1 + matrix2

    # Matrix multiplication

    matrix_product <- matrix1 %*% matrix2

    ```


