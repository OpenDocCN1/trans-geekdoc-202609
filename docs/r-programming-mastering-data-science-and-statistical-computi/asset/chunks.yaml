    \ column1 > 10)\n```\n\n*   多重条件：你可以使用逻辑运算符如 `&`（与）、`|`（或）和 `!`（非）来组合多个条件。\n\n\
    ```r\n# 过滤 column1 大于 10 且 column2 等于 \"value\" 的行\nfiltered_data <- filter(data,\
    \ column1 > 10 & column2 == \"value\")\n```\n\n### `mutate()`：创建或修改列\n\n`mutate()`\
    \ 函数用于在数据集中创建新列或修改现有列。这对于派生新变量或转换现有数据非常有用。\n\n*   基本用法：创建一个新列。\n\n```r\n# 根据现有列创建一个新列\n\
    mutated_data <- mutate(data, new_column = column1 + column2)\n```\n\n*   多重变换：你可以在同一个\
    \ `mutate()` 调用中创建多个新列。\n\n```r\n# 创建多个新列\nmutated_data <- mutate(data, new_column1\
    \ = column1 + column2, new_column2 = column3 * 2)\n```\n\n### `summarize()`：聚合数据\n\
    \n`summarize()`（或 `summarise()`）函数用于计算汇总统计量。它通常与 `group_by()` 函数结合使用，按分组执行这些计算。\n\
    \n*   基本用法：计算一个汇总统计量。\n\n```r\n# 计算某一列的平均值\nsummary_data <- summarize(data, mean_value\
    \ = mean(column1))\n```\n\n*   分组与汇总：结合 `group_by()` 为每个组计算汇总统计量。\n\n```r\n# 按列分组数据然后进行汇总\n\
    summary_data <- data %>%\n  group_by(group_column) %>%\n  summarize(mean_value\
    \ = mean(column1), total = sum(column2))\n```\n\n### `arrange()`：行排序\n\n`arrange()`\
    \ 函数允许你根据一或多列的值对数据框的行进行排序。\n\n*   基本用法：按特定列升序排序。\n\n```r\n# 按 column1 升序排序数据\n\
    arranged_data <- arrange(data, column1)\n```\n\n*   降序：要按列降序排序，请使用 `desc()` 函数。\n\
    \n```r\n# 按 column1 降序排序数据\narranged_data <- arrange(data, desc(column1))\n```\n\
    \n### 使用管道操作符 (`%>%`) 组合函数\n\n`dplyr` 的优势之一是可以使用管道操作符 (`%>%`) 将这些函数链联起来。这允许你以一种可读性强、逐步步进的方式进行复杂的数据操作。\n\
    \n*   链式操作：典型的数据处理工作流可能如下：\n\n```r\n# 链式调用多个 dplyr 函数的示例\nresult <- data %>%\n\
    \  filter(column1 > 10) %>%\n  select(column1, column2) %>%\n  mutate(new_column\
    \ = column1 * 2) %>%\n  arrange(desc(new_column))\n```\n\n在此示例中，数据首先被过滤，仅包含 `column1`\
    \ 大于 10 的行。然后，选择了特定的列，通过将 `column1` 乘以 2 创建新列，最后根据新列对数据进行降序排序。\n\n## 分组并汇总数据以获取深层洞察\n\
    \n在数据分析中，发现模式和获取洞察的最强大技术之一是通过类别对数据进行分组，然后用有意义的统计数据进行汇总。在 R 中，`dplyr` 包通过使用 `group_by()`\
    \ 和 `summarize()` 函数使这一过程变得直观且高效。这些函数允许你跨分类变量的不同级别聚合数据，从而对数据集中的趋势和关系提供更清晰的理解。\n\
    \n### `group_by()`：将数据组织为组\n\n`dplyr` 中的 `group_by()` 函数用于指定你想对数据分组的一或多列。在应用汇总统计量之前，这一步至关重要，因为它定义了将要分析的组的结构。\n\
    \n*   基本用法：按单列分组。\n\n```r\n# 按单列分组数据\ngrouped_data <- group_by(data, category_column)\n\
    ```\n\n*   多个分组变量：你可以通过多个列分组来创建嵌套分组。\n\n```r\n# 按多个列分组数据\ngrouped_data <- group_by(data,\
    \ category_column1, category_column2)\n```\n\n### `summarize()`：计算汇总统计量\n\n对数据分组后，使用\
    \ `summarize()` 函数在每个组内计算汇总统计量。这可以包括广泛的统计数据，如平均值、和、中位数等。\n\n*   基本用法：计算单个汇总统计量。\n\
    \n```r\n# 计算每个组内数值列的平均值\nsummary_data <- summarize(grouped_data, mean_value =\
    \ mean(numeric_column))\n```\n\n*   多重汇总统计量：你可以同时计算多个统计量。\n\n```r\n# 在每个组内计算多个统计量\n\
    summary_data <- summarize(grouped_data,\n  mean_value = mean(numeric_column),\n\
    \  total_sum = sum(numeric_column),\n  count = n())\n```\n\n*   自定义汇总函数：你可以应用任何每个组返回单个值的函数，允许自定义汇总。\n\
    \n```r\n# 应用自定义汇总\nsummary_data <- summarize(grouped_data,\n  range_value = max(numeric_column)\
    \ - min(numeric_column))\n```\n\n### 结合 `group_by()` 和 `summarize()` 进行深入分析\n\n\
    当结合使用时，`group_by()` 和 `summarize()` 成为深入数据分析的强大组合。它们允许你将复杂数据集分解为有意义的汇总，揭示数据的底层结构。\n\
    \n*   示例：假设你有一个销售交易数据集，想要找到每个产品类别的总收入和平均交易金额。\n\n```r\n# 按产品类别分组并汇总收入和交易规模\nsales_summary\
    \ <- sales_data %>%\n  group_by(product_category) %>%\n  summarize(total_revenue\
    \ = sum(revenue),\n  average_transaction = mean(transaction_size))\n```\n\n在此示例中，`group_by(product_category)`\
    \ 按产品类别组织数据，`summarize()` 计算每个组的总收入和平均交易规模。\n\n### 分组变换与过滤\n\n除了基础汇总外，你还可以在分组后执行分组变换（使用\
    \ `mutate()`）和分组过滤（使用 `filter()`）。这允许你创建在组内计算的新变量，或根据组级条件划分子集。\n\n*   分组变换：创建特定组的变量。\n\
    \n```r\n# 创建显示收入占组总额百分比的新变量\nsales_data <- sales_data %>%\n  group_by(product_category)\
    \ %>%\n  mutate(revenue_percent = revenue / sum(revenue) * 100)\n```\n\n*   分组过滤：根据聚合统计量过滤组。\n\
    \n```r\n# 保留总收入大于特定阈值的组\nfiltered_sales <- sales_data %>%\n  group_by(product_category)\
    \ %>%\n  filter(sum(revenue) > 10000)\n```\n\n### 解除数据\n\n"
