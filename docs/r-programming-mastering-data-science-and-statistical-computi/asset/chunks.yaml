    \`\`\`


    *   Using Helpers: You can also use helper functions like \`starts\_with()\`,
    \`ends\_with()\`, or \`contains()\` to select columns based on patterns.


    \`\`\`r


    \# Selecting columns that start with a specific prefix


    selected\_data <- select(data, starts\_with("prefix"))


    \`\`\`


    \`filter()\`: Subsetting Rows Based on Conditions


    The \`filter()\` function allows you to subset your data frame based on specific
    conditions. This function is ideal for narrowing down your dataset to relevant
    observations.


    *   Basic Usage: To filter rows based on a condition.


    \`\`\`r


    \# Filtering rows where column1 is greater than 10


    filtered\_data <- filter(data, column1 > 10)


    \`\`\`


    *   Multiple Conditions: You can combine multiple conditions using logical operators
    such as \`&\` (and), \`|\` (or), and \`!\` (not).


    \`\`\`r


    \# Filtering rows where column1 is greater than 10 and column2 equals "value"


    filtered\_data <- filter(data, column1 > 10 & column2 == "value")


    \`\`\`


    \`mutate()\`: Creating or Modifying Columns


    The \`mutate()\` function is used to create new columns or modify existing ones
    within your dataset. This is useful for deriving new variables or transforming
    existing data.


    *   Basic Usage: To create a new column.


    \`\`\`r


    \# Creating a new column based on existing columns


    mutated\_data <- mutate(data, new\_column = column1 + column2)


    \`\`\`


    *   Multiple Mutations: You can create multiple new columns within the same \`mutate()\`
    call.


    \`\`\`r


    \# Creating multiple new columns


    mutated\_data <- mutate(data, new\_column1 = column1 + column2, new\_column2 =
    column3 \* 2)


    \`\`\`


    \`summarize()\`: Aggregating Data


    The \`summarize()\` (or \`summarise()\`) function is used to calculate summary
    statistics. It is often combined with the \`group\_by()\` function to perform
    these calculations by groups.


    *   Basic Usage: To calculate a summary statistic.


    \`\`\`r


    \# Calculating the mean of a column


    summary\_data <- summarize(data, mean\_value = mean(column1))


    \`\`\`


    *   Grouping and Summarizing: Combine with \`group\_by()\` to calculate summary
    statistics for each group.


    \`\`\`r


    \# Grouping data by a column and then summarizing


    summary\_data <- data %>%


    group\_by(group\_column) %>%


    summarize(mean\_value = mean(column1), total = sum(column2))


    \`\`\`


    \`arrange()\`: Sorting Rows


    The \`arrange()\` function allows you to sort the rows of your data frame based
    on the values of one or more columns.


    *   Basic Usage: To sort by a specific column in ascending order.


    \`\`\`r


    \# Sorting data by column1 in ascending order


    arranged\_data <- arrange(data, column1)


    \`\`\`


    *   Descending Order: To sort by a column in descending order, use the \`desc()\`
    function.


    \`\`\`r


    \# Sorting data by column1 in descending order


    arranged\_data <- arrange(data, desc(column1))


    \`\`\`


    Combining Functions with the Pipe Operator (\`%>%\`)


    One of the strengths of \`dplyr\` is the ability to chain these functions together
    using the pipe operator (\`%>%\`). This allows you to perform complex data manipulations
    in a readable, step-by-step manner.


    *   Chaining Operations: A typical data manipulation workflow might look like
    this:


    \`\`\`r


    \# Example of chaining multiple \`dplyr\` functions


    result <- data %>%


    filter(column1 > 10) %>%


    select(column1, column2) %>%


    mutate(new\_column = column1 \* 2) %>%


    arrange(desc(new\_column))


    \`\`\`


    In this example, the data is first filtered to include only rows where \`column1\`
    is greater than 10. Then, specific columns are selected, a new column is created
    by multiplying \`column1\` by 2, and finally, the data is sorted in descending
    order based on the new column.


    ## GROUPING AND SUMMARIZING DATA FOR DEEPER INSIGHTS


    In data analysis, one of the most powerful techniques for uncovering patterns
    and gaining insights is the ability to group data by categories and then summarize
    it with meaningful statistics. In R, the \`dplyr\` package makes this process
    intuitive and efficient through the use of the \`group\_by()\` and \`summarize()\`
    functions. These functions allow you to aggregate data across different levels
    of categorical variables, providing a clearer understanding of trends and relationships
    within your dataset.


    \`group\_by()\`: Organizing Data into Groups


    The \`group\_by()\` function in \`dplyr\` is used to specify one or more columns
    by which you want to group your data. This step is crucial before applying summary
    statistics because it defines the structure of the groups that will be analyzed.


    *   Basic Usage: Grouping data by a single column.


    \`\`\`r


    \# Grouping data by a single column


    grouped\_data <- group\_by(data, category\_column)


    \`\`\`


    *   Multiple Grouping Variables: You can group by more than one column to create
    nested groupings.


    \`\`\`r


    \# Grouping data by multiple columns


    grouped\_data <- group\_by(data, category\_column1, category\_column2)


    \`\`\`


    \`summarize()\`: Calculating Summary Statistics


    After grouping the data, the \`summarize()\` function is used to calculate summary
    statistics within each group. This can include a wide range of statistics, such
    as means, sums, counts, medians, and more.


    *   Basic Usage: Calculating a single summary statistic.


    \`\`\`r


    \# Calculating the mean of a numeric column within each group


    summary\_data <- summarize(grouped\_data, mean\_value = mean(numeric\_column))


    \`\`\`


    *   Multiple Summary Statistics: You can calculate multiple statistics simultaneously.


    \`\`\`r


    \# Calculating multiple summary statistics within each group


    summary\_data <- summarize(grouped\_data,


    mean\_value = mean(numeric\_column),


    total\_sum = sum(numeric\_column),


    count = n())


    \`\`\`


    *   Custom Summary Functions: You can apply any function that returns a single
    value per group, allowing for custom summaries.


    \`\`\`r


    \# Applying a custom summary function


    summary\_data <- summarize(grouped\_data,


    range\_value = max(numeric\_column) - min(numeric\_column))


    \`\`\`


    Combining \`group\_by()\` and \`summarize()\` for In-Depth Analysis


    When used together, \`group\_by()\` and \`summarize()\` become a powerful duo
    for in-depth data analysis. They allow you to break down complex datasets into
    meaningful summaries that reveal the underlying structure of the data.


    *   Example: Suppose you have a dataset of sales transactions and want to find
    the total revenue and average transaction size for each product category.


    \`\`\`r


    \# Grouping by product category and summarizing revenue and transaction size


    sales\_summary <- sales\_data %>%


    group\_by(product\_category) %>%


    summarize(total\_revenue = sum(revenue),


    average\_transaction = mean(transaction\_size))


    \`\`\`


    In this example, \`group\_by(product\_category)\` organizes the data by each product
    category, and \`summarize()\` calculates the total revenue and average transaction
    size for each group.


    Grouped Mutations and Filtering


    Beyond basic summarization, you can also perform grouped mutations (using \`mutate()\`)
    and filtering (using \`filter()\`) after grouping your data. This allows you to
    create new variables that are calculated within groups or to subset data based
    on group-level conditions.


    *   Grouped Mutations: Creating new variables that are group-specific.


    \`\`\`r


    \# Creating a new variable that shows revenue as a percentage of group total


    sales\_data <- sales\_data %>%


    group\_by(product\_category) %>%


    mutate(revenue\_percent = revenue / sum(revenue) \* 100)


    \`\`\`


    *   Grouped Filtering: Filtering groups based on aggregated statistics.


    \`\`\`r


    \# Keeping only groups with total revenue greater than a certain threshold


    filtered\_sales <- sales\_data %>%


    group\_by(product\_category) %>%


    filter(sum(revenue) > 10000)


    \`\`\`


