    ```r

    # Connecting to the database

    con <- dbConnect(RSQLite::SQLite(), dbname = "path/to/your/database.sqlite")


    # Writing data to a new table in the database

    dbWriteTable(con, "new_table_name", data)


    # Disconnecting from the database

    dbDisconnect(con)

    ```


    ### Best Practices for Data Import and Export


    - **Data Validation**: Always inspect the first few rows of your imported data
    using `head()` to ensure it has been read correctly.

    - **Customizing Imports**: Use the various arguments available in the import functions
    to handle specific file structures or formatting issues.

    - **Keep a Clean Workspace**: After importing and exporting data, clean up your
    workspace by removing temporary objects or closing database connections to prevent
    memory issues.


    ## EXPORTING DATA FROM R TO DIFFERENT FORMATS


    Exporting data from R is a crucial step in sharing your analysis, reporting results,
    or saving processed data for future use. R provides a variety of functions and
    packages to export data into different formats, including CSV, Excel, JSON, and
    databases. This section will guide you through the process of exporting data from
    R into these various formats.


    ### Exporting Data to CSV Files


    CSV (Comma-Separated Values) files are one of the most common formats.


    #### `write.csv()`


    The `write.csv()` function allows you to export data frames to a CSV file.


    ```r

    write.csv(data, "path/to/save/your/file.csv", row.names = FALSE)

    ```


    - `row.names = FALSE`: Prevents row names from being written to the file.


    #### Customizing the Export


    You can further customize the `write.csv()` export by adjusting the delimiter
    and encoding.


    ```r

    write.csv(data, "path/to/save/your/file.csv", row.names = FALSE, sep = ";", fileEncoding
    = "UTF-8")

    ```


    - `sep = ";"`: Changes the delimiter to semicolon.

    - `fileEncoding = "UTF-8"`: Ensures the file is saved with UTF-8 encoding.


    ### Exporting Data to Excel Files


    Excel is widely used in business environments. R provides several packages to
    export data, with `openxlsx` and `writexl` being popular options.


    #### Using `openxlsx`


    The `openxlsx` package allows for multiple sheets and formatting.


    ```r

    write.xlsx(data, "path/to/save/your/file.xlsx")

    ```


    #### Using `writexl`


    The `writexl` package is a simple and efficient option for exporting data.


    ```r

    write_xlsx(data, "path/to/save/your/file.xlsx")

    ```


    ### Exporting Data to JSON Files


    JSON (JavaScript Object Notation) is a lightweight data-interchange format. The
    `jsonlite` package in R makes exporting data to JSON straightforward.


    #### Using `jsonlite`


    ```r

    write_json(data, "path/to/save/your/file.json")

    ```


    #### Customizing the JSON Export


    You can customize the JSON structure by adjusting the `pretty` or `auto_unbox`
    arguments.


    ```r

    write_json(data, "path/to/save/your/file.json", pretty = TRUE, auto_unbox = TRUE)

    ```


    - `pretty = TRUE`: Formats the JSON file with indentation for readability.

    - `auto_unbox = TRUE`: Converts single-element vectors to scalar JSON values.


    ### Exporting Data to Databases


    R can export data directly into databases, allowing for integration with larger
    data systems. The `DBI` package provides a standard interface for interacting
    with databases.

