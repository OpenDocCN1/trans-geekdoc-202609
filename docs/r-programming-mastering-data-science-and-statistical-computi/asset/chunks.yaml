    Importing Data from CSV Files


    CSV (Comma-Separated Values) is one of the most common formats for storing and
    exchanging data. R has built-in functions to read and write CSV files, making
    it easy to import data for analysis.


    Using \`read.csv()\`:


    The \`read.csv()\` function is used to read data from a CSV file into a data frame.


    \`\`\`r


    \# Importing a CSV file


    data <- read.csv("path/to/your/file.csv")


    \# Display the first few rows of the data


    head(data)


    \`\`\`


    *   Customizing the Import:


    You can customize how the data is imported by using additional arguments such
    as \`header\`, \`sep\`, and \`stringsAsFactors\`.


    \`\`\`r


    \# Importing a CSV file with custom settings


    data <- read.csv("path/to/your/file.csv", header = TRUE, sep = ",", stringsAsFactors
    = FALSE)


    \`\`\`


    \- \`header = TRUE\`: Indicates that the first row contains column names.


    \- \`sep = ","\`: Specifies the separator used in the CSV file.


    \- \`stringsAsFactors = FALSE\`: Prevents character strings from being converted
    into factors.


