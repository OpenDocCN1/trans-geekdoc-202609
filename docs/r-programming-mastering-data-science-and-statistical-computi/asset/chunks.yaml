    # 第 2 章：R 编程基础


    理解 R 编程的基础知识，对于任何想要利用其能力进行数据分析和统计计算的人来说至关重要。在本章中，我们将探索 R 的基本元素，包括其语法、变量、数据类型和运算符。这些是任何
    R 程序的构建块。关系运算符对于初学者来说非常易用。


    R 中的运算符


    R 中的运算符用于对变量和数据进行操作。它们包括算术运算符、关系运算符和逻辑运算符。


    ## 语法


    R 的语法设计非常直观且易于理解。


    - **注释**：注释以 `#` 开头。

    - **语句**：R 按顺序执行语句。

    ```r

    # 这是一个注释

    ```

    - **输出**：`print()` 函数用于显示值。

    ```r

    print(x)

    ```


    ## R 中的变量


    变量用于存储数据。

    - **创建变量**：使用赋值运算符 `<-`。

    - **命名规范**：最好使用描述性名称。

    - **访问变量**：一旦创建，变量就可以在表达式中使用。

    ```r

    x <- 10

    y <- 5

    ```


    ## 数据类型


    R 支持 支持多种数据类型：

    - **数值型 (Numeric)**：用于实数。

    - **整数型 (Integer)**：用于整数。整数值通过 `L` 后缀进行显式声明。

    - **字符型 (Character)**：用于字符串。

    - **逻辑型 (Logical)**：用于布尔值（`TRUE` 或 `FALSE`）。

    - **因子型 (Factors)**：用于分类数据。

    - **向量 (Vectors)**：R 中基本的数据结构，存储相同类型的元素。

    - **列表 (Lists)**：列表可以包含不同类型的元素，包括向量、矩阵和其他列表。


    ## 运算符


    运算符用于对变量和数据进行操作。它们包括算术运算符、关系运算符和逻辑运算符。


    ### 算术运算符


    这些运算符执行基础数学运算：

    - 加法：`+`

    - 减法：`-`

    - 乘法：`*`

    - 除法：`/`

    - 幂：`^`

    - 取模：`%%`（除法的取余数）


    示例：

    ```r

    a <- 10

    b <- 3

    sum <- a + b        # 13

    difference <- a - b  # 7

    product <- a * b     # 30

    quotient <- a / b    # 3.3333

    power <- a^b         # 1000

    remainder <- a %% b  # 1

    ```


    ### 关系运算符


    这些运算符比较两个值并返回逻辑值（`TRUE` 或 `FALSE`）：

    - 等于：`==`

    - 不等于：`!=`

    - 大于：`>`

    - 小于：`<`

    - 大于等于：`>=`

    - 小于等于：`<=`


    示例：

    ```r

    x <- 10

    y <- 5

    is_greater <- x > y  # TRUE

    is_equal <- x == y   # FALSE

    ```


    ### 逻辑运算符


    逻辑运算符用于组合多个条件：

    - 与 (AND)：`&`

    - 或 (OR)：`|`

    - 非 (NOT)：`!`

