    # CHAPTER 2: BASICS OF R PROGRAMMING


    Understanding the basics of R programming is crucial for anyone looking to leverage
    its capabilities for data analysis and statistical computing. In this chapter,
    we''ll explore the fundamental elements of R, including its syntax, variables,
    data types, and operators. These are the building blocks of any R program and
    are essential for developing more complex scripts and functions.


    ## R Syntax


    R''s syntax is designed to be straightforward and user-friendly, especially for
    those new to programming. It emphasizes readability and ease of use, which is
    why it''s popular among statisticians and data scientists.


    - **Comments**: Comments are used to annotate code, making it easier to understand.
    In R, comments begin with `#`.

    - **Statements and Expressions**: R executes statements sequentially.

    ```r

    # This is a comment

    ```

    - **Printing Output**: The `print()` function is commonly used to display values.

    ```r

    print(x)

    ```


    ## Variables in R


    Variables are used to store data.

    - **Creating Variables**: Variables are created using the assignment operator
    `<-`.

    - **Naming Conventions**: It’s good to use descriptive names.

    - **Accessing Variables**: Once created, variables can be used in expressions.


    ## Data Types in R


    R supports a variety of data types:

    - **Numeric**: Used for real numbers.

    - **Integer**: Used for whole numbers. Integer values are explicitly declared
    with an `L` suffix.

    - **Character**: Used for strings.

    - **Logical**: Used for Boolean values (`TRUE` or `FALSE`).

    - **Factors**: Used for categorical data.

    - **Vectors**: The most basic data structure in R, and they hold elements of the
    same type.

    - **Lists**: Lists can contain elements of different types, including vectors,
    matrices, and other lists.


    ## Operators in R


    Operators in R are used to perform operations on variables and data. They include
    arithmetic operators, relational operators, and logical operators.


    ### Arithmetic Operators

    These operators perform basic mathematical operations:

    - Addition: `+`

    - Subtraction: `-`

    - Multiplication: `*`

    - Division: `/`

    - Exponentiation: `^`

    - Modulus: `%%` (remainder of division)


    Example:

    ```r

    a <- 10

    b <- 3

    sum <- a + b        # 13

    difference <- a - b  # 7

    product <- a * b     # 30

    quotient <- a / b    # 3.3333

    power <- a^b         # 1000

    remainder <- a %% b  # 1

    ```


    ### Relational Operators

    These operators compare two values and return a logical value (`TRUE` or `FALSE`):

    - Equal to: `==`

    - Not equal to: `!=`

    - Greater than: `>`

    - Less than: `<`

    - Greater than or equal to: `>=`

    - Less than or equal to: `<=`


    Example:

    ```r

    x <- 10

    y <- 5

    is_greater <- x > y  # TRUE

    is_equal <- x == y   # FALSE

    ```


    ### Logical Operators

    Logical operators are used to combine multiple conditions:

    - AND: `&`

    - OR: `|`

    - NOT: `!`

