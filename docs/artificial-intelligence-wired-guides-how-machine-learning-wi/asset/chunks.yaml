  trans: '

    一旦发生这种情况，世界真的将发生重大变化。人们的工作场所将面临比本千禧年以来任何时候都更大规模的自动化。对许多人来说，工作的整个性质可能会改变。我们与企业和政府服务互动的方式也将被彻底改变。部署
    AI 的社会将需要了解人们对该技术的反应及其对技术的期望。同时，只有当系统高效运行、易于理解——且值得信赖时，个人才会遵循 AI 给出的指示。


    # 将 AI 武器化


    AI 的不可阻挡的崛起伴随着其政治化。这不仅是因为它有可能让社会运行得更高效，或者因为它现在与经济成功紧密相连。这是因为它已成为争夺技术主导权斗争中的一件武器，而技术主导权伴随着巨大的政治权力。在
    20 世纪 60 年代，前苏联和美国在太空竞赛中较量。今天，是美国和崛起中的超级大国中国在争夺对技术世界及其基础设施的控制权，以求得霸主地位。


    ## 政治层面


    长期以来，一直是西方的大学、科技公司和政策制定者在推动创新，来自世界各地的人才蜂拥至美国从事 AI 工作。现在，中国正寻求在从 5G 到 AI 发展的各个领域推动技术标准。其雄心不容小觑。2017
    年，该国执政的共产党宣布了到 2030 年成为 AI 世界领导者的目标。目前，中国正投入数十亿资金用于 AI 发展，其中大部分投向私营部门。美国智库“新兴技术与安全中心”（Center
    for Security and Emerging Technology）的分析表明，中国政府 2018 年在 AI 投资上的支出，大致相当于美国计划在 2020
    年投入的金额。


    其他指标也显示了中国的决心。自 2005 年以来，中国发表的 AI 研究论文数量已超过美国，尽管它们对学术界的影响力并不全等同于美国的研究成果。然而，根据艾伦人工智能研究所（Allen
    Institute for AI）2019 年 5 月的分析，这种情况即将改变，分析指出在一年内，中国主导的研究论文被引用数量将追平美国论文的被引用数量。


    中国在 AI 硬件开发方面目前可能仍落后于美国和其他国家，但它拥有世界上一些领先的 AI 软件公司。商汤科技、旷视科技和海康威视在人脸识别领域均颇具影响力。阿里巴巴、百度和腾讯在资金实力和对
    AI 求职者的吸引力上，现在已能与谷歌、Facebook、微软和苹果相抗衡。


    该国还将影响力扩展到世界上许多欠发达国家。中国的“一带一路”倡议为发展中国家提供了新技术，这些技术未来将由 AI 驱动。“在非洲，后端网络基础设施基本上几乎完全是中国的了，主要是华为和中兴，”领导“中非项目”的
    Eric Olander 说。“在加纳，[闭路电视] 摄像头在短短几年内就从 700 个增加到了 7000 个。” Olander 补充道，在新冠疫情期间，中国公司向非洲国家捐赠技术以帮助它们抗击病毒。例如，2020
    年春季，华为提供了视频会议系统、热成像测温仪以及一些现金。


    不过，科技竞争并不局限于中美两国：世界上其他国家也在投资 AI 研发，旨在跟上全球领导者的步伐，并寻求在本国部署这些技术。这种竞争不太会导致技术分裂，或简单地演变成美中两国的两极分化。世界上大多数
    AI 发展过于紧密地相互关联，无法完全被政治竞争割裂开来。它由开源发布、研究、突破和训练数据集主导，任何拥有互联网连接的人都可以获取这些资源。尽管如此，随着中国旨在实现其超级大国目标，国际紧张局势可能会加剧。


    就当下而言，AI 的扩张引发了监管问题。一些人声称，涵盖人权和数据保护的现有法律足以遏制滥用行为。另一些人则认为，AI 引发了全新的问题，只能通过专门的法律来解决。一些人对
    AI 技术的特定方面感到担忧（几个美国城市已禁止使用人脸识别技术）。一些人认为，在某些领域完全不应使用 AI（AI 界广泛共识认为，该技术不应用于无需人工干预即可夺取生命的自主武器系统，如无人机）。


    欧洲联盟最终可能会在该类事务上引领潮流。其《通用数据保护条例》（GDPR）自 2018 年开始实施，重新定义了世界各地处理人们个人信息的方式。现在，欧盟已将目光转向制定关于
    AI 使用和控制的法律，一旦颁布，这将构成首个跨国 AI 监管法规（指南原定于 2020 年发布，后推迟至 2021 年未指定日期）。“我们想要一套以人为本的规则，”欧洲委员会主席
    Ursula von der Leyen 于 2020 年 9 月表示。“算法不得成为黑箱，且一旦出错必须有明确的规则。”


    Von der Leyen 的言论紧随一份白皮书的发布，该白皮书阐述了欧盟可能采取的措施：例如，引入规则以管控“高风险” AI 系统（如用于医疗、执法和交通的系统），以及
    AI 使用可能导致歧视、伤害或危及生命的情况。值得注意的是，共识尚远。在欧盟咨询的 1200 多个团体中，42% 认为需要新法律来管治 AI，而 33% 认为现有立法足以胜任。对于高风险
    AI 用途的可能监管方式，也存在类似的分歧（42% 对 30%）。显然，前路漫漫。


    ## 黑客


    如果国家正在利用 AI 作为强化权力和统治地位的工具，罪犯也开始将该技术武器化。首当其冲的将是黑客和网络犯罪群体。


    问题在于，目前欺骗 AI 并不需要太多手段。正如 2018 年一组九名研究人员在虚拟模拟中所做的那样，只需在红色停车标志上贴上黑白胶带条（在某些情况下拼出“love”和“hate”等字样），就足以欺骗自动驾驶汽车，使其误判限速为
    45 英里/小时。


    这些错误发生在研究条件下。但网络犯罪分子和黑客总是在技术和创新的前沿工作——这是保持在执法人员前面的唯一途径。他们转向使用 AI 只是时间问题。对一些人来说，AI
    将是工具而非目标。例如，罪犯可能利用 AI 协助寻找应用程序代码中的漏洞（应用开发者也这样做以预先发现错误）。他们可能利用 AI 创建新的恶意软件或攻击手段（多态恶意软件可不断自我变异以逃避检测）。或者他们可能编程
    AI 模仿人们的行为，作为网络钓鱼攻击的一部分，诱使人们相信某封邮件或汇款请求来自他们信任的人。

