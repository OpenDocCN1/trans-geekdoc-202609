- raw: 'In June 2019, researchers at the University of Massachusetts Amherst trained
    four deep-learning language models (GPT-2, Google’s BERT, AllenNLP’s ELMo and
    Transformer) for a single day.


    AI researchers need to change their mindsets when it comes to environmental impact,
    and the fact is that there are things that can be done. ‘You do choose what data
    you train on, how big your model is, and what data centre you want to choose for
    training,’ Luccioni says. Along with colleagues, Luccioni has built code that
    can be automatically added to AI models to report on the environmental impact
    of AI. Called CodeCarbon, it estimates the amount of carbon dioxide (CO²) produced
    by computing resources needed in AI models. It does this by automatically detecting
    the energy grid and hardware used in the training, and it then offers recommendations
    on how it could be improved. As AI training data becomes even bigger, its energy
    footprint is something that its developers are going to have to improve.


    ### Self-driving cars


    In the spring of 2004, fifteen vehicles were gathered in the Mojave Desert for
    a unique race. The first vehicle to make it to the finish line 229 kilometres
    away, navigating through rocky terrain, dips, gullies and unpredictable wildlife,
    would win the team behind it $1 million. The catch? None of the vehicles was allowed
    a driver. All had to drive themselves to the end of the race.


    Organised by the Defense Advanced Research Projects Agency (DARPA), the contest
    was the group’s first Grand Challenge event. Taking to the start-line were a bunch
    of *Mad Max*\-style vehicles: huge six-wheelers, converted SUVs, and buggies with
    no driver compartments at all. Hundreds of people filled grandstands around the
    starting line and witnessed the unfolding spectacle.


    As races go it turned out to be a flop. The ‘winner’ managed to crawl just 11.9
    kilometres. Some vehicles barely made it out of the starting funnel. The self-driving
    cars were confused by bushes; they froze, unable to move forward; they crashed
    into fences; they got stuck on hills.


    Yet in terms of boosting the profile of self-driving vehicle research, the event
    was a success. A year later five teams completed a similar 212-kilometre course,
    with the winning team coming over the line in under seven hours. Nearing two decades
    on and millions of cars around the world use autonomous driving features – such
    as lane control and self-parking – and fully autonomous cars have clocked up thousands
    of kilometres on public roads.


    The US Society of Automotive Engineers (SAE) ranks vehicles according to six levels
    of automation, ranging from no automation at level zero to full automation at
    level five. Level four vehicles can drive autonomously in most conditions; level
    five are able to operate autonomously in all conditions. At all levels below four,
    a driver is required and must remain engaged and ready to take over at any point.
    During the development stages the AI can be trained in video-game-style simulations,
    making decisions and then following them through.


    The technology and systems needed to create fully self-driving vehicles are similar
    to those required to build semi-autonomous features that operate at lower levels
    of the SAE scale. ‘Autonomous vehicles are robotic systems, and any robotic system
    has three major stages. The first stage is sensing, the second is planning, the
    third is acting,’ says Jack Weast, the chief systems architect for Intel’s autonomous
    driving division and a vice-president at the Intel-owned autonomous driving system
    firm Mobileye.


    A key component is computer vision. Cameras positioned around vehicles capture
    the world around the car, and are able to detect objects and determine what they
    are. ‘You’ve got sensors with algorithms that are perceiving the environment,
    classifying objects, understanding what they are, and building a world model,
    which is this virtual representation of what exists out there in the real world,’
    Weast says.


    Cameras and computer vision aren’t the only sensors available. Lidar (using light
    waves) and radar (radio waves) can be employed, too. Their sensors send out signals
    that hit objects around a car – from street signs to pedestrians – before they
    reflect back to the car, building a digital picture of the environment in the
    process. As radio waves are not as easily absorbed as light waves they can travel
    over longer distances. The key thing is, whatever combination of sensors and cameras
    is used, there needs to be plenty of them. ‘You need to have redundancy and independence,’
    says Paul Newman, the founder of the UK-based self-driving software firm Oxbotica.
    ‘Redundancy is multiple cameras, multiple lasers, multiple radars. Independence
    is, they work in completely different ways.’ Only through this combination can
    safety be ensured. Newman’s company is trialling level-four autonomous vehicles
    on public roads in England. Its autonomous vehicles are also being used in airports
    and around mines, which pose fewer issues for autonomous vehicles as they are
    more predictable environments. Since there is a general consensus within the automotive
    industry that autonomous vehicles will be used at scale in future, everyone from
    technology companies to traditional vehicle manufacturers is now working on their
    development. (There are sixty companies holding permits to test autonomous vehicles
    with human safety drivers in California).


    Once signals are received back by a car, along with data from computer vision
    cameras and any other mapping that’s being used, the vehicle is ready to make
    a virtually instant decision. It is, in fact, constantly sensing and planning
    its next move. It is observing all the objects around it, from cars and trucks
    to pedestrians and cyclists, and predicting what they will do next through an
    assessment of their speed and trajectory.


    Within a self-driving vehicle, multiple algorithms and AI systems are at work,
    alongside non-AI classic statistical approaches. ‘In the planning stage, there’s
    a logical block called the driving policy,’ says Intel’s Jack Weast. This governs
    how a vehicle should behave. Unlike supervised learning and unsupervised learning,
    it’s based on reinforcement learning that involves a specific goal. The algorithms
    are told to achieve something – driving economically, for instance – and then
    attempt to reach it through trial and error. If they succeed, the AI is rewarded,
    the reward being that the AI is told to replicate more of the correct behaviour
    it has just demonstrated. ‘The reward might be fuel economy, the reward might
    be safety, the reward might be time to destination,’ says Weast. ‘You’re trying
    to optimise for certain things, and so it’s a very effective tool for that.’


    In terms of making the theory of self-driving a reality, arguably the leading
    company is Waymo, an offshoot of Google that was started within the tech giant’s
    research labs in 2009. In the course of a decade, the company’s self-driving system
    has allowed its vehicles to travel more than 30 million kilometres on public roads.
    Most has been done with a safety driver sitting behind the wheel, ready to take
    control of the car if it looks as though things are going wrong. But, since 2015,
    some journeys have been undertaken without a safety driver present. According
    to the company, as of early 2020, 1,000–2,000 autonomous rides were being operated
    a week in a 260-square-kilometre area of Phoenix, Arizona, of which up to 10 per
    cent were fully driverless. In all, in the first nine months of 2020, 105,000
    kilometres of fully autonomous driving was achieved.'
