    # “深蓝”战胜人类与人工智能的探索之路


    但随后在 1997 年 5 月 11 日传来了惊人的消息。IBM 的 `Deep Blue`（深蓝）计算机以 3½ 比 2½ 战胜了国际象棋特级大师、前世界冠军加里·卡斯帕罗夫。卡斯帕罗夫此前曾吹嘘永远不会输给机器，且确实在前一年击败过
    `Deep Blue`。但这一次，他被其棋艺震惊了。“我是一个人类。当我看到远超我理解范围的事物时，我会感到恐惧，”卡斯帕罗夫在承认最终一局失利后说道。


    `Deep Blue` 战胜卡斯帕罗夫标志着 AI 发展的一个重要时刻。它将这项技术及其能力重新推向了公众视野。从那时起，AI 近乎呈指数级发展，得益于日益强大且低成本的技术，并在过去十年里由云计算、改进的硬件和智能的新算法进一步推动。神经网络演变为深度神经网络，深度学习蓬勃发展。如今，一个没有它的世界似乎难以想象。


    ## 什么是智能？


    人工智能背后的驱动力始终是模仿并改进人类能力的渴望。自 1950 年代在达特茅斯提出该术语以来，创造出一种像人类一样思考的机器的探索便开始了。最崇高的目标是创建一个通用人工智能系统（更通俗地称为
    `AGI`）。


    根据你询问的对象不同，`AGI` 可能是一个像人类一样聪明的系统，或者是一个甚至更聪明、能够完成任何被要求任务的系统。AI 研究社区内部对于 `AGI` 可能是什么样子存在重大争议，或许更重要的是，关于它是否真的可实现也存在争议。


    目前，除非发生突然的重大 AI 突破，否则我们距离一个能回答任何问题、满足人类一切需求，甚至接管世界的全知系统还很远。但可以说，我们距离拥有哪怕基础智能（按我们的理解）的人工智能也还很远。这引出了一个问题：智能究竟是什么？


    简短的回答是：对此几乎没有共识。在定义智能时，来自神经科学、心理学、哲学等多个学科的专家，无论是学科内部还是跨学科之间，往往都存在激烈分歧。在衡量智能时，没有任何现行系统获得普遍认可（例如，智商测试被许多人视为既有局限性又有问题）。而在将智能原理应用于机器学习时，解读也各不相同。“我认为人工智能中的‘智能’并没有任何真正的共识定义，”剑桥大学未来智能利弗休姆中心的研究员亨利·谢夫林说道。


    智能的概念因其在人类历史上不同时期曾被武器化以压迫和伤害人们而变得更加复杂。在 18 至 20 世纪，一些科学家声称世界上的不平等是由种族间智力的生物学差异造成的。聪明被视为白人西方人的专属领域，他们利用这一点推动殖民主义，并作为种族主义的基础。种族科学自二战以来已衰退，但正如安吉拉·塞尼在其著作《种族科学的回归》中指出的那样，它仍被一些主要为右翼的群体所支持。


    据未来智能利弗休姆中心的研究员坎塔·迪哈尔称，在 AI 领域，智力属于白人的错误观念依然存在。迪哈尔正在从事两个关乎我们对 AI 理解的项目：第一个是关于人们提及
    AI 时使用的叙事；第二个（与该中心执行主任斯蒂芬·凯夫合作）关注 AI 的去殖民化。“‘人工智能’这一短语中‘智能’的整个概念通常被视为理所当然，”迪哈尔说，“但‘智能’一词实际所指极具政治性，且高度依赖语境。”计算机科学中智能的巅峰传统上意味着机器擅长下棋。但正如迪哈尔所解释的：“这可以追溯到
    19 世纪末和 20 世纪初，当时建立智力衡量标准是为了在人类中建立并维持等级制度。”


    因此，在 AI 领域精确定义智能充满了问题和警示。尽管如此，一个有用的切入点是研究人员谢恩·莱格和马库斯·胡特得出的一个常用定义（两人现均就职于谷歌旗下的
    AI 公司 `DeepMind`，莱格是其联合创始人之一）。他们在 2007 年提出：“智能是智能体在广泛环境中实现目标或取得成功的能力。”


    就机器而言，这种能力目前往往局限于狭义智能，而非通用智能。人类能够从广泛的经验中学习，并将所学应用于新场景。如果给予足够的示例，AI 可以在人类水平上执行任务，在某些情况下甚至超越人类。然而，它是特定且狭窄的。击败卡斯帕罗夫的
    `Deep Blue` 系统是有史以来最优秀的棋手之一，但它除了下棋什么也做不了。它甚至无法在其他游戏中获胜，更别提执行其他更通用的任务了。即使在今天，我们拥有的
    AI 也不够复杂，无法做超过一件事。从这个程度来说，幼童和动物拥有的智能或能力可被认为比我们最好的 AI 更强。


    以物体操作为例。“你无法让机器人像两三岁的孩子与世界互动那样，持续稳定地操作物体，”斯坦福大学从事机器人研究的助理教授切尔西·芬恩说道。“似乎我们可能遗漏了关于智能的一些相当基础的东西。”芬恩的工作部分专注于让机器人复制人类能做的事，以便它们在现实世界中发挥作用——机器人的能力越通用，就越有可能用于不同任务。为此，机器人必须理解物体在三维空间中的运作方式、物品如何被操作，以及移动物体的后果。“我认为如果我们能让机器人拥有与物理世界交互的技能，”芬恩说，“那么它们能做很多事情来帮助社会，无论是协助灾害救援，还是应对人口老龄化等问题，例如。与其他应用相比，这是一个非常难的问题，”她补充道。


    因此，如果通用人类能力是智能的标志，AI 还有很长的路要走。如果我们用人类智能模型来理解和描绘机器智能，这会扭曲我们对 AI 技术的看法。在西方文化中，对
    AI 的反乌托邦观点聚焦于其非人性，从《2001 太空漫游》中的 HAL，到《机械姬》中的艾娃，再到《我，机器人》中的所有机器人。迪哈尔指出，俄罗斯人通常期望早期的文本聊天机器人像阿诺德·施瓦辛格饰演的“终结者”角色那样情感迟钝。


    '
