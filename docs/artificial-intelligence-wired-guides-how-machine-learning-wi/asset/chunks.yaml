  trans: '

    # AI 的殖民本质


    AI 的殖民本质呈现多种形式。它嵌入于其算法歧视之中，使得不平等的现实世界得以映射进一个同样不平等的虚拟世界。它贯穿于该行业的招聘实践。它涉及在世界上相对贫穷地区广泛使用低薪劳动力，这些处于
    AI 生产链起端的人负责为训练准备数据。当然，人们从事的工作能带来经济收益，但他们的社区是否能从他们协助创造的技术中获益，这仍存疑。此外，AI 治理规则往往由较富裕国家制定。Mohamed、Png
    和 Isaac 强调了一项针对 AI 伦理准则的全球回顾，该回顾发现非洲、南美和中美洲以及中亚未参与相关讨论。他们还指出，AI 系统可以在数据保护法律不如英国或欧洲严格的国家进行测试。


    这种系统性的不公体现在个体经历中：人们因从事的工作而获得报酬过低，或未得到应得的晋升，或遭受同事的不尊重对待。近年来，数千名 Google 员工抗议公司对高管性骚扰指控的处理方式，以及未能妥善调查歧视投诉；此外，数百名
    Microsoft 员工声称他们在工作中遭受过骚扰和歧视。2020 年 12 月，杰出的 AI 伦理研究员 Timnit Gebru 表示 Google 解雇了她，并指责该公司“体制上存在种族主义”，缘由是公司对她合著的一篇学术论文有异议。


    “多元化”和“代表性”也意味着要顾及全球十亿以上残障人士。AI 已帮助创造新的无障碍形式——例如，能为人们“看见”的计算机视觉应用。但在真正实现包容之前，还有很长的路要走。“我认为包容性
    AI 最重要的一步是让残障人士参与所有阶段，”Microsoft 首席创新架构师兼 AI for Accessibility 项目负责人 Mary Bellard
    表示。这种包容不仅仅是让残障人士测试产品。它必须包括雇佣残障技术专家。“有时存在一种为残障人士‘构建’技术的概念，而不是‘与或由’残障人士共同构建，这两个概念之间有着重要的区别，”Bellard
    说。


    但仍有人和组织在努力改变现状。其中之一是 Tess Posner 创办的美国非营利组织 AI4ALL，旨在让更多年轻女性和 BAME（黑人、亚裔和少数族裔）群体对
    AI 产生兴趣。其举措包括面向高中生的夏令营。“我们听到很多类似的声音：‘我是我学校里唯一一个长得像我、对这个感兴趣的人’，或者‘我从未想过我能进入这个领域，因为我在该领域看不到像我这样的人，’”Posner
    说。夏令营旨在让这些学生接触 AI 榜样。博士生和大型科技公司的专家讲解 AI 的主要原理：机器学习的类型、如何使用编程语言 Python、数据集在 AI
    中的重要性。AI4ALL 还向全美高中教师提供开源 AI 教学资源，重点面向低收入学校，这些学校通常没有资金为学生投资计算机科学专业教育。Posner 旨在将教学资源翻译成其他语言，以便在美国国内外更广泛地传播。


    AI Now 的多元化报告审视了科技行业总体及 AI 领域特别是如何做出改变。报告主张公开所有岗位和职位的薪酬水平，包括奖金和所有其他报酬，并按种族和性别细分。它推动建立薪酬平等，确保人们因其工作获得适当补偿，并将目前代表性不足群体的晋升纳入公司目标。它还要求发布骚扰和歧视透明度报告。或许最关键的是，它倡导改革招聘方式，建议设立项目联系非精英大学，并寻找更好的途径让承包商、临时工和自由职业者转为全职员工。招聘实践和条件也应公开透明，让每个人都知道个人是如何被录用、薪酬如何确定以及如何晋升。所有这些的责任始于高层管理。“处于企业层级顶端的人比个人研究人员和开发者拥有更大的权力来设定方向和塑造道德决策，”AI
    Now 的报告指出。


    ## 透明度与监管


    Joy Buolamwini 证明了 AI 中的问责制可以带来变革。2015 年，MIT 媒体实验室的研究生 Buolamwini 坐在笔记本电脑前，试图让她使用的通用人脸追踪软件运行起来。问题在于它无法运行。它本应将数字艺术作品投影到她脸上，却无法“看见”她。然而，当她的朋友坐在廉价笔记本摄像头前时，系统自动启动了。原因何在？Buolamwini
    是黑人。她的朋友是白人。一旦 Buolamwini 戴上白色面具，软件便瞬间识别出了她。


    这并非 Buolamwini 首次遭遇因算法主要基于白人肤色图像训练而产生的歧视。她曾试图教机器人玩躲猫猫。机器人毫无反应。再次，她隐形了。


    Buolamwini 坐在摄像头前五年后，她的研究改变了面部识别技术的开发方式，并将训练数据中选择偏见的问题推向公众视野。她 2018 年的 MIT 论文《Gender
    Shades》（性别阴影），由 Timnit Gebru 合著，审计了 IBM、Microsoft 和中国公司 Face++ 的面部识别系统性能，敲响了沉重的警钟。


    她展示的结果是，总体而言，这些系统识别深色皮肤人群的效果不如识别浅色皮肤人群。Microsoft 表现最好，但即便如此，其对深色皮肤人群 87.1% 的准确率与对浅色皮肤受试者
    99.3% 的准确率相比依然逊色。IBM 软件的差距为 19.2%。引入性别因素后，准确率进一步下降。IBM 和 Face++ 仅在 65% 的情况下正确识别深色皮肤女性。Microsoft
    略好，为 79%。而对于浅色皮肤女性，三套软件得分均在 92% 以上。性能差异高达 34%。


    一年后的后续研究——名为“Actionable Auditing”（可执行审计）


    通过让不透明的算法及其创建者承担责任，极具影响力的“Gender Shades”及后续研究指明了一条前进的道路。它们公开揭露了现有 AI 系统的失效，引发了一场亟需的公共辩论，不仅关乎面部识别系统如何运作，更关乎它们应如何被使用。Buolamwini
    曾在立法者、决策者和警方官员面前出席作证，解释歧视性做法如何运作，以及她的审计如何揭露它们。她的工作直接促成了对面部识别系统的更严格审查。这也导致多个美国州禁止使用该技术。2020
    年 6 月，在针对系统性种族主义和明尼阿波利斯警察杀害 George Floyd 的全球抗议之后，Amazon、IBM 和 Microsoft 都承诺，至少暂时停止向警方销售面部识别软件。

    '
