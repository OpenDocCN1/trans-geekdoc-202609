  trans: '

    # AI 的未来


    AI 如今已牢固地嵌入我们的日常生活，成为不可或缺的一部分。在未来几十年里，它将变得更强大、更复杂。其应用范围将从广泛用于社交网络和科技产品，扩展到企业和社会各层面。


    但一些研究人员的终极目标——`AGI`（通用人工智能）又将如何？`AGI` 将代表一个革命性的飞跃。目前，AI 在某些特定任务上已证明优于人类，但根据你采用的定义，`AGI`
    将能在交付给它的每一项任务上都表现出色。从各种意图和目的来看，它将拥有完全的人类能力。


    对一些人来说，这将是噩梦般的场景。SpaceX、特斯拉和 Neuralink 的创始人、联合创始人或首席执行官埃隆·马斯克，因其对 `AGI` 和其他形式超级智能的直言不讳的观点，曾多次与
    AI 界发生争执。他认为 `AGI` 比核武器更危险，且该技术是“人类文明生存的根本风险”。他警告说，随着快速自动化的发生，AI 网络可能会发展出自己的意识。“你会说，‘网络中的深度智能能造成什么危害？’嗯，它可以通过制造假新闻、欺骗电子邮件账户、发布虚假新闻稿和操纵信息来挑起战争，”他在
    2017 年说道。


    他并非孤军奋战。哲学家尼克·博斯特罗姆，牛津大学“人类未来研究所”所长，曾反复警告创造超级智能可能导致“人类灭绝”。2015 年 3 月，博斯特罗姆、马斯克、DeepMind
    联合创始人、斯蒂芬·霍金，以及来自谷歌、Facebook 和其他数百家机构的 AI 领军人物签署了一封公开信，声明如果通用智能是终极目标，则需要采取安全措施，以确保其造福而非危害社会。


    2018 年，澳大利亚国立大学的研究人员着手规划如何减轻 `AGI` 的风险。

    '
