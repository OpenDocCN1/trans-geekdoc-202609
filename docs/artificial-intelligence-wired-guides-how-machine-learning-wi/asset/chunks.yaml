- raw: 'Such extraordinarily rapid progress gives an indication of some of AI’s potential.
    At present, it can master individual tasks quickly and efficiently. But researchers
    envision a future world where a single system can complete multiple tasks without
    needing to be adapted for each one. If that general-purpose vision is realised
    it will fundamentally alter how humans interact with machines – far more than
    it already has. As it happens, Lee’s single win during his defeat by AlphaGo is
    the only time a human has ever been able to beat the system. But the overall loss
    had a profound experience on one of the greatest ever players of the game. He
    retired from it in 2019, sensing it would never be the same for him again. ‘Even
    if I become the number one,’ he said, ‘there is an entity that cannot be defeated.’


    ### Better tools, greater power


    Such is the speed with which AI has spread – and continues to do so – that many
    of the innovations that only a few years ago were the preserve of a few labs and
    well-heeled Silicon Valley companies are now within the reach of most of us. The
    price of computers has continued to come down, and their power has increased.
    You can now buy a high-powered laptop or desktop that can run AI applications
    using Google’s, Amazon’s or Microsoft’s cloud services, and you can train yourself
    how to use them. All you need is a decent internet connection and a few clicks
    of the mouse.


    At the same time, further advances are being made in the hardware that drives
    AI. So, for example, while GPUs remain the preferred type of processor for running
    some AI applications, Google, Intel, Graphcore and a host of other start-ups are
    racing to build faster and more powerful AI chips. Google announced its Tensor
    Processing Unit (TPU) AI chip in 2016. Meanwhile, Graphcore, founded by Nigel
    Toon and Simon Knowles, has raised more than $400 million in venture capital funding
    to produce its Intelligence Processing Unit (IPU) chip. ‘When Google announced
    they were building the TPU that was a big moment,’ says Toon, Graphcore’s CEO.
    ‘It was the TPU that actually made people wake up and say, you actually need to
    build dedicated hardware for this.’


    Graphcore’s IPU was designed from scratch over half a decade not just to work
    specifically with the intelligent machines that are around today, but to anticipate
    further scaling of AI. The second version – which Toon says was the one it always
    intended to make – uses 59.4 billion transistors (electrical gates that switch
    on and off to perform calculations) that are packed just seven nanometres apart.
    The company says its Mark 2 chip can deliver eight times better performance compared
    to its first. The chips are interconnected so that they can communicate effectively
    with one another in a world where more data than ever will be thrown at increasingly
    complex AI systems. ‘We know that these knowledge models we’re going to build
    are going to actually end up being incredibly complicated,’ Toon says. ‘What we’re
    trying to do is to create a piece of hardware that is rather more complex in terms
    of how it operates, so that you can actually exploit that fundamental sparsity
    that is there in the data.’ The IPU is now in commercial operation.


    Big data – the lifeblood of the AI revolution – is improving, too, in terms of
    its quality and sheer quantity. ‘People started to recognise that the way to advance
    was not just to have clever algorithms and lots of compute power, but what you
    needed is training data, that has been very carefully curated,’ says Michael Wooldridge,
    a professor of computer science at the University of Oxford and the programme
    co-director for AI at the Alan Turing Institute. Satellites around the world are
    now capturing the planet in high resolution, a version of the world’s history
    has been freely documented on Wikipedia, our cities are increasingly full of sensors
    that can track everything from footfall in streets to how full bins are. At a
    personal level: each tap on your smartphone creates a data point, watching habits
    are stored, medical records are going digital and people are uploading more images
    and video to the web.


    In the wrong hands, of course, such data can endanger privacy and enable abuse.
    But in the right hands it can be used to train machine-learning systems in ways
    that lead to active improvements in the world around us. Researchers are using
    big data to program drones that can survey deforestation and replant seeds. Big
    data has helped AI to discover new antibiotics from hundreds of millions of molecules.
    NASA data has been crunched to find new planets. The list goes on.


    It’s not just AI tools that are on the rise. The sector itself is getting bigger
    and attracting ever more investment. According to data collected by the AI Index,
    a project run by Stanford University to analyse the global state of the industry
    and how it is changing, AI start-ups raised $1.3 billion in 2010. In 2018 the
    figure hit $40.4 billion. And while 2020’s global pandemic may have led to a temporary
    downturn, the overall direction of travel is still upwards. More than 3,000 AI
    companies received funding in 2018. Between 2014 and November 2019 more than 15,000
    investments of more than $400,000 were made in AI companies – the average size
    of investment being approximately $8.6 million. In the process, thousands of additional
    staff have been taken on by the big technology companies. AI research divisions
    have been boosted. And new players have been drawn in outside the magic circle
    of deep-pocketed tech companies – from pharmaceutical companies to banks.


    AI is also now a global enterprise. Investment may still be largely dominated
    by the US and China, who are battling to become AI superpowers, but other regions
    of the world are also spending big. ‘Whoever becomes the leader in this sphere
    will become the ruler of the world,’ said the Russian president Vladimir Putin
    in 2017.


    There’s been a corresponding explosion in AI publications and conferences. The
    AI Index has shown that in the 20 years between 1998 and 2018 there was a 300
    per cent increase in the number of peer-reviewed AI scientific papers. Today China
    publishes as many AI journal and conference papers a year as the whole of Europe,
    having surpassed the US as the single biggest contributor. And the biggest AI
    research conference, NeurIPS, had 13,000 attendees in 2019, up 800 per cent compared
    to 2012.


    Today the AI field has multiple sub-domains, from pattern-matching to voice recognition,
    via computer vision, which teaches machines to ‘see’, and natural language processing,
    which allows machines to understand text. And yet arguably we’re still early on
    in the commercialisation of a technology that is already so ubiquitous in some
    areas. Even now, understanding where and what type of AI is being used can be
    a challenge – one analysis in 2019 judged that 40 per cent of AI start-ups in
    Europe don’t actually use AI.


    We still have some way to go, then, before we work out how best to utilise even
    the technology that is around us today. Ultimately, it will become an invisible
    part of our everyday lives. ‘There are people there and you need to think about
    how they fit into the rest of your business,’ Wooldridge says. ‘It takes time
    for the technology to become really embedded and for people to find the right
    way of using it.’


    # 3


    ## Applying AI


    Not all AI is equal. Some has reached human standards. Some still has a long way
    to go. The speech-recognition systems used in Amazon’s Echo and Google’s Home
    smart speakers, for example, may have improved to the point where they can be
    useful to people asking basic questions, but they’re still very glitchy. They
    often mishear or misinterpret basic commands. The technology is improving, but
    we’re far from having voice recognition that can be used for human-like conversations.'
