    # 自动驾驶汽车与 AI 偏见的挑战


    然而，完全自动驾驶汽车大规模商业化应用的日子仍遥遥无期。还有法律问题待解。当一辆全自动驾驶汽车发生碰撞时，责任在谁？是硬件制造商还是软件制造商？还有实际问题。比如，当道路上
    50% 的车辆是自动驾驶，而其余由拒绝接受该技术的人类驾驶时，系统将如何运作？还有不可避免的信任与安全问题。机器能每次都做出正确决定吗？它到底能有多安全？


    涉及半自动驾驶汽车的致命事故绝非罕见。例如，2018 年 3 月，一名使用特斯拉半自动驾驶功能的苹果员工，因车辆撞上混凝土护栏而身亡。美国国家运输安全委员会（NTSB）介入调查，最终将责任归咎于驾驶员和车辆双方。


    谷歌的 Waymo 发布了一些细节，披露其自动驾驶车辆在总计 980 万公里的行程中涉及的事故数量。


    这种诊断似乎证实了自动驾驶技术支持者的观点，即它实际上比传统交通更安全。毕竟，每年全球有数百万人死于普通车祸。Jack Weast 表示，英特尔在安全方面的做法是采用确定性方法——而不是让机器基于
    AI 认为事件发生的概率大小来做决策。“这就像是对 AI 推荐决策的一个检查员，因此当这个概率算法不可避免地推荐出可能不利于安全的行为时，我们有一种确定性的方法来检查该行为是否安全，”他说道。


    自动驾驶汽车确实比人类拥有巨大优势。它们能更快地感知周围环境，并能同时向所有方向观察。它们的反应时间也更快。而且它们不会疲劳。“我们人类搞砸事情的唯一原因是注意力不集中，”Paul
    Newman 说。“我们就是会分心。而这是机器绝不会做的事。有多少事故是由疲劳和愚蠢的行为造成的？”


    此外，自动驾驶汽车可以相互学习。支撑 Oxbotica 车辆运行的 AI 系统每晚都会刷新。车辆在现实世界和虚拟仿真中遇到的所有新数据和新场景，都可以添加到系统的知识库中。一天之内，就能为车辆的驾驶理解增加数百小时的新经验和知识。每辆车都能拥有其他所有车的经验——当每天有成千上万甚至数百万辆车在运行时，这种汇聚的理解力将呈指数级增长。


    技术专家认为，让此类机器在现实世界中发挥作用的途径，在于向人们解释它们实际如何运作以及能带来哪些益处。“我们需要摆脱‘这些东西不知何故很诡异且无法解释’的说法，”Newman
    补充道。“它们是经过工程设计的软件件，周围有流程规范，我们可以说明我们期望它们如何表现。”


    ## AI 的陷阱


    2015 年至 2020 年间，申请英国签证以工作、学习或探亲访友的人们照常填写文书，随后数据会被移交给一个算法进行评估。算法会给出一个等级：红、黄、绿。被评为绿色的申请人中，96.3%
    直接获批。被标记为红色——“风险最高”类别——的申请人不会被自动拒签，但会接受进一步审查，由高级职员核查数据并做出最终决定。内政部运行的这一半自动化流程，最终批准了
    48% 的红色申请。使用该系统的人们信任它的决策。


    但存在一个问题。尽管该系统的初衷值得称赞——旨在使签证申请更快捷、高效、少繁文缛节——但其底层技术（称为“分流工具”）却存在缺陷。它饱受数据、透明度和流程问题的困扰，导致决策不公。特别是，它根据申请人的原籍国而非经过深思熟虑的个人标准，判定其为高风险人员。“他们保留了一份不受欢迎国家名单，仅仅因为申请人来自某个特定国家——他们拒绝透露国家名单——该申请人就更有可能被分流为黄色或红色，”法律组织
    Foxglove 的创始人 Cori Crider 说。


    2020 年春，Foxglove 对该算法流程提出挑战，辩称其违反了平等法和数据保护法。在案件即将开庭审理前几天，英国政府弃用了该工具，承认需要审查“分流工具中关于无意识偏见以及总体上使用国籍的问题”。不过，政府拒绝承认该系统违反了任何法律。


    几个月后，正值新冠疫情期间，另一个类似的算法试图预测英格兰学生的 A-Level 考试成绩。它同样利用历史数据来决定个人的未来。它同样存在缺陷。大规模抗议随之爆发，学生走上街头，高呼“去他妈的算法”。


    这两个系统都没有涉及特别复杂的算法——而且都没有使用人工智能。但它们都证明了数据固有的风险性。无论我们倾向于如何假设，数据极少（如果有的话）是中立的。既然数据最终是由人类创建的，它就会捕捉到我们的偏见。签证系统建立在对申请人原籍国做出偏见假设的数据之上。考试系统则部分基于个别学生所在学校的过往记录来预测成绩。两者都是对未来的警示。


    ### 偏见


    既然数据是 AI 的核心，那么 AI 也就不免于偏见。向系统输入糟糕的数据，就会输出糟糕的数据。常见的偏见有三种形式——尽管研究已识别出 20 多种偏见类型，以及
    AI 系统中可能存在的其他类型的歧视和不公。`潜在偏见`（`latent bias`）指算法将其结果与数据中的性别、种族、收入等特征相关联，从而可能延续历史上的偏见形式：例如，系统可能“学会”医生是男性，因为其训练数据显示医生多为男性。（亚马逊曾不得不废弃一个正在使用的
    AI 招聘工具，该工具基于十年的简历数据训练，系统推断因为历史上男性被录用的频率高于女性，所以男性一定更优秀。）`选择偏见`（`selection bias`）指数据集过度代表某一群体，导致结果失真。（一个用于评选美貌大赛的
    AI 选出的获胜者多为白人，因为其训练数据集主要包含白人的图片。）`交互偏见`（`interaction bias`）指系统从人们与其互动时表现出的偏见中学习。（微软的聊天机器人
    Tay 于 2016 年在 Twitter 上线，在使用的前 24 小时内变得更加连贯，但也重复了人们发送给它的所有性别歧视和种族歧视语言。）


