    # Photoshop 修图、深度伪造与合成媒体


    Photoshop 修图技术当然已经存在了几十年。但深度伪造技术要复杂得多，且同样能以假乱真。深度伪造并非单纯依靠人工将不同来源的图像拼凑在一起，而是将原始素材输入
    AI 程序，利用所提供的数据生成新数据。**生成对抗网络（GANs）** 诞生于 2014 年，是该领域最常用的工具。输入的数据集越大，它们生成的图像就越逼真。


    深度伪造是 AI 给社会带来的挑战的又一实例。其用途可以完全无害，但也可能造成实实在在的伤害。自 Reddit 上出现第一批粗糙的深度伪造图像以来，其背后的技术已长足进步。它正呈指数级增长，并通过免费的在线教程和开源代码实现了普及。2019
    年 7 月，深度伪造检测网络安全公司 **Sensity** 在网上发现了 14,678 个深度伪造视频。


    这不仅仅是电影明星和音乐人的问题。YouTuber、Instagram 网红以及在 **Twitch** 上直播的女性也成为了该技术的攻击目标。2020 年
    10 月曝光，通讯平台 **Telegram** 上的一个 AI 机器人正利用深度伪造技术从女性照片中“脱去”衣物，并生成裸体部位进行替换。超过 10 万名女性成为受害者。大多数制作这些图像的人称，他们针对的是自己认识的女性。


    事实是，网络造假的触角正伸向更远的地方。例如，2019 年夏天，**AP** 通讯社的记者发现一个伪造的 **LinkedIn** 账号，该账号与美国多位有影响力的知名人士有联系，其头像图片就是由
    **GAN** 生成的。**Henry Ajder**（当时为 Sensity 的威胁情报研究员）解释道：“我们在 **LinkedIn** 和 **Twitter**
    上非常频繁地遇到它们，甚至不需要我们主动寻找，只是偶然发现罢了。‘这些图像极易获取，访问难度低得难以置信。’” 2019 年 12 月，**Facebook**
    删除了源自格鲁吉亚和越南的页面，**Sensity** 证实这些页面使用了虚假图片作为头像。


    音频也正遭到类似的篡改，并可用于金融诈骗。网络安全公司 **NISOS** 记录了一个案例（附带音频证据），发生于 2020 年 6 月，一家科技公司的员工收到一条语音留言，似乎来自他们的
    CEO，要求紧急付款。


    至于 AI 生成的文本，美国大学生 **Liam Porr** 报告称，他使用 **GPT-3** 创作博客文章，在网上发布两周内阅读量达 26,000 次。


    目前，合成媒体的质量参差不齐。即便如此，它仍具说服力，尤其是在那些因社会或政治偏见而倾向于相信其所兜售信息的人群中。一段 **Nancy Pelosi**（美国众议院议长）的视频被故意放慢播放速度以使其看起来像喝醉了，该视频于
    2019 年 5 月发布后被观看数百万次。2019 年初，在 **加蓬**，一段该国总统的视频——有人称其为深度伪造，但无研究人员能确凿证明其真伪——引发了军队动荡。


    一旦合成媒体技术全面升级，识别它必将变得更难。软件工具将让任何人都能令人信服地操纵视频、文本、音频和图像。研究人员正努力开发 AI 工具以识别深度伪造，但这些工具仍有很长的路要走。法律似乎势必要更新以更好地保护个人，社交媒体平台将需要执行强有力的政策，而恶意合成媒体的受害者将能获得充分的救济。


    毫无疑问，全面升级的合成媒体正在到来。据韩国科技巨头三星的投资部门 **Samsung Next** 的一份报告称，2020 年 11 月，有 170 多家在
    AI 合成媒体领域工作的初创公司在运营。它们范围广泛，从试图缓解合成媒体威胁的 **Sensity** 等公司，到致力于为视频、音频记录、广告、应用程序等生成新内容的公司。有些正试图构建能像人类一样自然朗读的
    AI 系统，包含停顿和语气表达。其他公司则寻求将书面新闻文章转化为由 AI 新闻主播播报的视频，将人们的脸换到他们最喜欢的电影场景中，并创建可用于数十亿美元游戏行业的逼真虚拟形象。


    AI 也正在进军好莱坞。电影行业使用 **CGI**（计算机生成图像）和视觉特效已有几十年。合成视频为制片厂提供了削减拍摄成本、以新方式启用演员的可能性。那还比较遥远，但合成视频公司
    **Synthesia** 的 CEO **Victor Riparbelli** 预测：“十年后，我认为你可以在笔记本电脑上制作一部好莱坞大片。”


    这种潜在的进步提醒我们，正如所有技术总体上以及 AI 特别地那样，合成媒体既蕴含巨大希望，也带来挑战和威胁。即使在当下，其某些用途也表明，它远不止于制造假画面和不诚实信息。2020
    年 2 月，在印度 **德里** 的一场选举活动中，**Bharatiya Janata Party (BJP，印度人民党)** 主席 **Manoj Tiwari**
    通过发布两段视频触达了约 1500 万人：一段他用英语讲话，另一段由配音演员模仿 Tiwari，再经唇形同步算法改变其嘴部动作，使 Tiwari 看起来能流利地用
    **Haryanvi**（印地语方言）交流。


    **Riparbelli** 表示，**Synthesia** 近期的大部分工作将集中在将文本转化为信息视频上。“想象一下，如果你是一家拥有大量零售员工的大公司，发送一份关于新安全准则的五页
    PDF 文档，这并不是一种有效的沟通方式，”他解释道。AI 可以将这些文档转化为引人入胜的视频。“我们不把自己视为普通视频的替代品——这不是你为了节省视频制作成本而购买的东西。这是文本的一种替代方案。”


    **Riparbelli** 迅速指出，合成媒体不可能适用于所有情况。例如，不太可能有人会对与老板的一对一会议做出友善回应，如果那实际上涉及与由 AI 聊天机器人驱动的合成视频聊天。他还认为透明度至关重要：“我认为在许多你会接触到合成视频的地方，它显然是一个合成视频。”如果能更普遍地实现这一点，目前合成媒体的一些问题方面将得到显著缓解。


    # 5


    ## AI 与工作世界


    如果你想了解 AI 目前的状态及其未来走向，**Ocado Technology** 是个绝佳的切入点。在英国在线杂货科技公司 Ocado 的仓库里，机器人在
    AI 引导下以每秒高达四米的速度在轨道上飞驰，几分钟内即可拣选完 50 件商品的订单。随后 **Ocado** 送货卡车的行程由神经网络优化，该网络每秒进行超过
    1400 万次“最后一公里”路由计算，并随客户每次下单或在购物清单中添加额外商品而调整配送路线。


    但 **Ocado** 最雄心勃勃的自动化努力在于分拣机器人。撰写本文时，该公司拥有五台由计算机视觉驱动的机械拣选臂，以及其他机器学习系统，能够识别需打包的商品并利用吸力抓取它们。由两个欧洲学术主导项目合作推进的进一步进展正在酝酿中。


    '
