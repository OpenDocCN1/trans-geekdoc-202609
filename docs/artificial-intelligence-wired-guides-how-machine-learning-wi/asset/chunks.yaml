    199.  [iv](#copyright.xhtml#pgiv)


    ## About the Author


    ***WIRED*** is the world’s most authoritative and respected publication reporting
    on the emerging trends, ideas and technologies shaping our world. Our mission
    is to tell the stories of the people who are driving this change and to understand
    its impact on business, society and individuals. *WIRED* has become synonymous
    with informed and intelligent analysis of these transformational forces and the
    significance of them for industries and individuals and is a consistently reliable
    predictor of change.


    **Matt Burgess** is the deputy digital editor at *WIRED UK*.


    ## Introduction


    The age of artificial intelligence has arrived. Since the turn of the millennium
    the nascent technology being developed in research labs for decades has crept
    into our everyday lives. It may not look like the sci-fi versions of AI fed to
    you through popular culture, but it is here. And it is making a huge difference
    to the world.


    By the point in the day that you’re sitting down to read this book or having it
    piped into your ears through an audio version, you will have interacted with AI
    multiple times. In almost every case, you may not have realised it was happening.
    It’s now so ubiquitous in some of the products you use each day that you scarcely
    notice it.


    Facebook posts you ‘Liked’ in your News Feed were shown to you because the company’s
    AI has been monitoring your past activity and can forecast the ones you’re most
    likely to give the thumbs-up. Netflix has been pushing films and shows at you
    because it already knows what you like. When you unlock your iPhone through facial
    recognition, this is because Apple’s algorithms have mapped your features and
    matched them with your stored faceprint.


    Every Google search you do surfaces AI-fuelled results, generated by scraping
    the entire web’s contents and ranking what may be most relevant to your search.
    Maps on your car’s satnav generate the fastest routes based on a real-time understanding
    of movement data and knowledge of the world. And every time you mutter ‘Alexa’
    – or Amazon’s smart speaker thinks it hears you say the wake-word – AI processes
    what you have said and delivers what it calculates to be the most appropriate
    response.


    It’s not just our everyday lives that are being transformed. In realms as diverse
    as healthcare and space exploration, AI is learning from reams of data collected
    over decades to help discover new drugs and hunt for new planets. Meanwhile, organisations
    from private companies to governments are increasingly using AI to improve their
    operations, reducing the administrative burden on people doing repetitive jobs.


    And we’re still in the fairly early days of the AI revolution. Over the next decade
    or so, there’s huge potential for AI to overhaul many of our most everyday activities
    – think self-driving cars and robotic delivery – and bring further benefits to
    the world. The technology will come to lead the fight against credit card fraud,
    help detect images of child sexual abuse being uploaded to the internet, and identify
    cyberattacks before they cripple businesses.


    As with all technologies, there are upsides and downsides to what AI has achieved
    so far and might in the future. On the upside, it is being democratised. Whereas
    AI used to be the preserve of companies with huge resources, now it’s available
    to anyone who wants to go online and buy the tools to implement it. Ultimately
    both companies and individuals with no technical knowledge whatsoever will be
    able to make use of AI with ease. And, of course, it’s becoming ever more sophisticated.


    But there are potential problems, too. Currently, the majority of the interactions
    we have with AI systems are relatively inconsequential: they are regular, (sometimes)
    seamless, and ultimately forgettable. An unhelpful search result, or a few repeated
    attempts to unlock your phone, aren’t the sort of moments to be remembered for
    more than a few seconds. However, this technology can also be used to snoop on
    us and to monitor our every activity. It contains the power to threaten our civil
    liberties, our freedom and our human rights – and to an extent is already being
    used for just these purposes. It’s therefore no surprise that the world of policing
    should have become fascinated by it, or that governments are racing to become
    dominant in AI. It’s a technology that raises major questions of power and control.


    There are also questions of racism and sexism. At the moment AI is developed and
    controlled by a small group of people – mostly white males working for technology
    companies. Such lack of diversity has had and will continue to have serious repercussions
    for millions whose lives could be affected by AI’s systems. Early deployments
    of it have shown that AI and various forms of social oppression have a tendency
    to go together.


    Ultimately, AI can be a huge force for good – it has already changed the world
    in profound ways. But the next decade will be crucial in determining how far that
    change will go, and the extent to which it will ultimately be a benefit to society.
    This book not only explains how we’ve got to this point, but also explores where
    we’re likely to go next.


    # 1


    ## The early years


    Artificial intelligence as we understand it today was born during the summer of
    1956, in a low-key summer getaway at Dartmouth College in New Hampshire on the
    east coast of the United States.


    Over the course of two months a group of computer scientists, brought together
    by John McCarthy, Nathaniel Rochester, Claude Shannon and Marvin Minsky, and convinced
    that computers could behave more like people, discussed how to improve on what
    some of the earliest machines were capable of. ‘An attempt will be made to find
    how to make machines use language, form abstractions and concepts, solve kinds
    of problems now reserved for humans, and improve themselves,’ the four lead researchers
    had written in a paper the year before they met at Dartmouth.


    In the event, the researchers were to be disappointed with their efforts. The
    workshop failed to get all the funding it needed; those invited could not agree
    on any common standards; and follow-up work was hampered by the participants having
    their own research to pursue. In any case, given the comparatively basic state
    of computers of the time, the Dartmouth summer project’s goals were unrealistic.
    ‘My hope for a breakthrough towards human-level AI was not realised at Dartmouth,’
    McCarthy wrote in a note fifty years later.


    But the workshop had an impact nevertheless. Before it took place, nascent artificial
    intelligence research had often fallen under the category of Automata Studies,
    which could lead to a somewhat disjointed approach. In the four researchers’ original
    proposal, however, they had for the first time used the phrase ‘artificial intelligence’.
    ‘The term was chosen to nail the flag to the mast,’ wrote McCarthy half a century
    later. The strategy worked. This new label kick-started what has now become a
    multi-billion-dollar industry, and McCarthy himself has been credited with its
    birth.'
