    # 神经网络的早期发展与 AI 寒冬


    ## 神经网络的诞生


    一个关键的早期发展是采用了一个旧想法——在随后再次沉寂后——它最终定义了现代人工智能时代：神经网络。


    20 世纪 40 年代初，科学家们创建了第一个神经元数学模型——大脑的构建模块，它们利用电脉冲和化学信号在大脑和全身神经系统中传递信号——并建立电路来模拟它们。1958
    年，在达特茅斯学院会议之后，并获得美国海军研究办公室的资助，美国心理学家 Frank Rosenblatt 构建了第一个可训练的人工神经网络。它被称为 Perceptron（感知机），运行在一台同名的房间大小的机器内部，它涉及一种算法，能够学习识别呈现给它的模式和形状。


    ## 现代神经网络的工作原理


    如今的神经网络比 Perceptron 快得多、复杂得多，每个网络都会针对特定任务进行不同的定制，但许多基本的底层原理保持不变。本质上，神经网络是一种机器学习方式，计算机通过接触其试图完成的任务的先前示例来学习，从而最终获得复制该任务所需的所有信息。


    例如，一个被开发用于在照片中识别自行车的神经网络，将通过展示数百甚至数千张自行车图片来学习自行车的样子，每张图片都标记为“这是一辆自行车”。（显然，当机器“看到”图像时，它的查看方式与我们不同：它看到的是字符串数字，照片和随附的文本都被分解成了这些数字。）如果训练过程成功，该算法随后将能够识别它以前未“见”过的照片中的自行车。通常，训练示例越多（当然这会增加过程的时间和成本），其结果越准确。


    遵循相同的原则，其他神经网络分析大量数值数据，以创建新图像、进行预测、翻译语言、控制自动驾驶汽车和发现新药物。神经网络已发现行星、创作音乐和艺术。而所有这些只是冰山一角。


    ## 神经网络的结构：深度学习


    这些系统大致模仿大脑结构，由相互连接的神经网组成，包含数千或数百万个数据处理节点，起到与神经元相同的作用。Perceptron 机器仅使用一层节点，但现代系统可以拥有多层——在某多达五十层——数据通过这些层传递。在多层神经网络中，每一层都有自己的功能，并可被训练以识别不同特征。此类系统现在通常被称为深度神经网络，正是它们促成了过去二十年间许多人工智能发展成果。


    广义上讲，神经网络中有三类层：输入层、隐藏层和输出层。


    - **输入层**：信息被送入神经网络的地方。

    - **隐藏层**：执行所有计算机处理（复杂的神经网络将拥有大量此类层）。

    - **输出层**：产生最终结果。


    每层内的节点相互连接——大型神经网络系统中可能有数十亿个连接——并被赋予数字，称为权重。权重控制两个节点间连接的强度，从而影响输出。权重在整个训练过程中不断调整，以使最终输出一致并产生系统创建者期望的结果。


    ## Perceptron 的局限与早期炒作


    Rosenblatt 的神经网络能完成一些非常基础的任务，但因其仅使用一层节点和相对简单的加权系统，其能力受到严重限制。不过，当时人们对 Perceptron
    的看法并非如此。1958 年 7 月底，当《纽约时报》报道 Perceptron 仅经过 50 次训练尝试就能区分左右时，它还声称计算机的“胚胎”终有一天能“走路、说话、看见、写作、自我复制并意识到自己的存在”。


    ## AI 寒冬的到来


    1969 年，AI 先驱 Marvin Minsky 和数学家 Seymour Papert 在同名书籍《Perceptrons》中彻底驳斥了 Perceptron
    算法，首个神经网络的技术局限性暴露无遗。他们认为，这种只有一层的简单神经网络无法执行除基本任务以外的任何操作——与承诺的感知自身存在的能力相去甚远。


    Minsky 和 Papert 的书被广泛认为浇灭了人们对神经网络的热情。确实，出版后该领域研究减少。但总体而言，1960 年代 AI 研究蓬勃发展，创造了许多支撑当前
    AI 的关键思想。包括麻省理工学院、卡内基梅隆大学和斯坦福大学在内的美国技术型大学开始研究该领域，并有领先科技公司加入。资金由美国军方提供，包括国防高级研究计划局（DARPA）。同时，Stanley
    Kubrick 执导的《2001: A Space Odyssey》（2001 太空漫游）上映，全知全能且看似乐于助人的 HAL 9000 以其抚慰人心的声线提高了公众对
    AI 的认知，植入了机器与人类共存世界的概念。1972 年，斯坦福研究所国际开发出名为 Shakey 的机器人，这种未来似乎更近了一步。本质上，Shakey
    是一个长方体形状的轮式计算机，能自主识别物体、绕行并解释为何如此行动。它的动作可能笨拙（因此得名），且常常毫无意义，但在当时属于尖端技术。


    ## 专家系统与 AI 寒冬


    20 世纪 80 年代初，研究人员创建了称为专家系统的装置，能模仿人类专家的决策过程。前提是任务非常狭窄和特定。其中一些系统实现了实际应用。例如，American
    Express 使用专家系统帮助员工判断持卡人是否超出信用额度。


    不过总体而言，1970 年代和 80 年代末是机器学习的低谷期。它们被称为 AI 寒冬（以核冬天概念命名）。缺乏重大突破，且采用的技术系统已达极限，技术衰退，研究资金随之削减。普遍存在幻灭感：AI
    未能兑现从业者提出的宏大承诺。英国科学研究委员会委托的一份 1973 年报告指出：“大多数 AI 研究及相关领域的工作者承认，对过去 25 年取得的成果感到明显失望。”


    Lighthill 报告发布前后，DARPA 此前一直热情支持 AI 研究，却改变主意，最终削减了部分 AI 工作的资金。一些 AI 研究人员感到不安。他们认为，对技术能实现什么设定了不切实际的期望，且这些期望蔓延至业界之外。AI
    先驱 Nils Nilsson 在其 2009 年记录行业 50 年历程的书中写道：“20 世纪 80 年代初，政府和工业界的许多 AI 赞助商极大地夸大了对
    AI 能力的期望。”

    '
