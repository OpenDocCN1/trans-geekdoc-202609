- raw: 'By contrast, computer vision and natural-language processing are two areas
    where AI is currently excelling – to the point where in some cases it’s claimed
    it can perform better than experts who have spent their entire careers working
    in a given sphere. Both are focused on trying to replicate human behaviour: namely,
    the ability to see and understand the world around it; and to correctly interpret
    and reproduce dialects. Thanks to huge new datasets, comprising millions and even
    trillions of pieces of data, both are making major strides forwards.


    ### Computer vision


    Computer vision is much more than simply attaching a camera to a computer. Although
    we don’t fully understand how the human brain processes and comprehends what we
    see, this field of AI tries to replicate the results. As with the human eye and
    brain, various stages are involved. A sensor (eyes for a person; some form of
    camera for a machine) captures data about what is in front of it. This information
    is passed through an interpretation stage (our brains, or a machine’s algorithms)
    and the end result is that what is seen is understood.


    But that’s where the similarities stop. Humans are able to see and understand
    the objects from a very early age: we don’t need to be ‘told’ the difference between
    a cat and a dog. Machines don’t have this inbuilt knowledge, and have to process
    visual data at a granular level, processing an image rather as they would a barcode.


    Depending on their resolution and size, individual images will have hundreds,
    thousands or even millions of pixels. An image-recognition system sees all these
    individual pixels as numbers: a white pixel in a black and white photograph may
    represent a low number, while black could be assigned a high number. The system
    also recognises bunches of colour, the shapes the pixels make, the distance between
    these shapes and big changes in the numbers. So, for example, if an image-recognition
    system is shown a golden Labrador sitting on some grass, it will detect the big
    change in the numbers assigned to the pixels where the image turns from dark blades
    of grass to the lighter fur of the dog. Thanks to all the advances made, computer
    vision can now analyse not only photos but also video footage, enabling it to
    classify objects (working out a dog is a dog); identify objects (finding a specific
    pup); and track objects (following that hound as it moves around).


    Essentially, there are two main ways to train a machine to do this. With supervised
    learning, an image-recognition system is trained upon images that are already
    labelled: in other words, there are tags applied to the objects the system is
    trying to define. As it analyses thousands or millions of images, it’s able to
    learn the specific features of, say, a dog through seeing patterns in the data.
    It can then scale up its learning to identify different breeds of dogs or multiple
    objects, such as cars, lamp posts, and houses, in one image. With unsupervised
    learning, the machine will learn to group objects that look the same, but will
    not know what they are due to the lack of labels. This type of approach allows
    previously unknown patterns in data to be revealed and understood, and it requires
    less preparatory work on that data as labels do not need to be applied. The results
    from unsupervised learning can be used in future supervised learning situations.


    So advanced is image recognition now that it is on the verge of playing an important
    role in medical diagnosis. The black and white images taken during medical imaging
    are one of the key ways in which doctors make their diagnoses. However, in many
    medical fields, more scans are produced than can quickly be evaluated, and since,
    of course, diagnosis is reliant on human interpretation and expertise, details
    can be overlooked and mistakes made. Deep learning, by contrast, can peek inside
    X-ray or MRI scans and see tiny details that humans tend to miss. It can also
    do this far faster than a human expert can.


    In trials, AI has been shown to be able to detect cancer (including lung, oral,
    breast, liver, thyroid and dermatological cancers), respiratory conditions including
    tuberculosis, and eye problems – all from images. In one instance, an MIT deep-learning
    system was able to predict the presence of breast cancer up to five years before
    it fully manifested itself by learning what patterns in breast tissue lead to
    malignant tumours


    ‘The algorithm is on a par with expert performance at diagnosing OCT scans,’ Pearse
    Keane, a surgeon at Moorfields, told *WIRED* at the time.


    A study published in the medical journal the *Lancet* in 2019 summarises the promise
    of such technology.


    Medical diagnosis is not the only sphere where image recognition is making strides
    forward. AI in phone apps now tells those with sight problems what objects are
    around them. It is used in augmented-reality applications to accurately place
    digital objects into photos and videos. It can also now group pixels into bigger
    segments, allowing, for example, all the pixels that make up a human to be identified
    as one object and be easily recognised.


    Object tracking and identification is now far more sophisticated than it was even
    just a few years ago. A human can be detected as they walk down a street, and
    their presence can be distinguished from the world around them. Cameras attached
    to drones can count animals or monitor fruit and vegetables growing in fields
    to assess how ripe they are. They have been used to assess damaged buildings and
    structures too unsafe for humans to inspect.


    Amazon’s experimental cashier-less Go stores make extensive use of object tracking
    and identification. The computer vision and other sensors they employ can identify
    a customer by their shape and then track them as they make their way through the
    store. They can also identify what shoppers put in their baskets.


    More generally, computer vision can tell retail stores how many customers are
    there at any given moment. During the coronavirus pandemic it was used to check
    whether people were following social-distancing rules. And in broadcasts of football
    matches it has been employed to follow the ball around the pitch, avoiding the
    need for expensive crews on site and so allowing more matches to be filmed. It’s
    not infallible, though: in one instance a system was confused by the bald head
    of a match official and followed it instead of the ball.


    In Estonia an AI system that combines satellite data with weather information
    is monitoring farmers’ fields to ensure that they are carrying out any necessary
    mowing (for which they receive a government subsidy). Ott Velsberg, the country’s
    chief data officer, describes when visiting inspectors would be fobbed off with
    claims either that the fields had been mowed at the beginning of the season and
    had grown back or that they were just about to be mowed. ‘Even if we had a suspicion
    that someone was actually not using the government funding as intended, we never
    got anything back,’ he says.


    Now, with new images coming in up to every two days, it’s possible to keep a constant
    eye on things and send any necessary notifications to farmers via text or email.
    Since the project started in 2018, Velsberg says it has already paid for itself,
    saving officials €665,000 within its first year of use. ‘We have actually avoided
    some potentially negligent use of government subsidies,’ he explains. ‘One company
    asked for funding for farmland that was in the middle of a marsh and around it
    was lakes and rivers. It was inaccessible.’ ‘The effects have also been kind of
    not what you only get from the algorithm itself, but to change the mindset of
    people,’ he adds. Thanks to AI’s all-seeing presence, there’s been a step change
    in compliance. Satellite-driven AI in Estonia is also now being used to guide
    ice-breaking vessels, identify tree species, and keep records of forest resources.


    ### Natural language processing'
