    and mentioned within its pages (although I won’t hesitate, or apologise, before
    I list their names again here). However, there are others who played an equally
    important role who are not explicitly mentioned. In no particular order, I wish
    to pay thanks to: Adrian Weller, Alastair Moore, Alex Harvey, Alexander Babuta,
    Alice Xiang, Bonaventure Dossou, Camille Marini, Chelsea Finn, Cori Crider, Daniel
    Leufer, David Dao, Emma Beede, Emily Wenger, Eric Olander, Fanny Hidvégi, Finale
    Doshi-Velez, Henry Ajder, Henry Shevlin, Jack Weast, Jeff Alstott, Jenny Brennan,
    José Hernández-Orallo, Julia Kreutzer, Jutta Treviranus, Kaiton Williams, Kanta
    Dihal, Ken Chatfield, Mark Harman, Mona Flores, Moshe Greenshpan, Nigel Toon,
    Lily Peng, Oren Etzioni, Ott Velsberg, Paul Newman, Ragnar Fjelland, Rashida Richardson,
    Renée Cummings, Richard Robinson, Rumman Chowdhury, Sandra Wachter, Sasha Luccioni,
    Saurabh Mishra, Shreya Shankar, Solon Barocas, Silvia Chiappa, Steven Feldstein,
    Suresh Venkatasubramanian, Tess Posner, Toshie Takahashi, Carol Reiley, Victor
    Riparbelli Rasmussen, Wenchao Li and William Isaac. The writing and reporting
    of Dave Gershgorn, Jack Clark, James Vincent, Karen Hao and Will Knight has set
    the agenda in the world of AI and is irreplaceable.


    I also wish to thank all of the editorial team at WIRED for their continued support,
    particularly Greg Williams and Mike Dent for developing this series of books along
    with the team at Penguin. Much credit should go to Penguin’s Nigel Wilcockson,
    who showed immeasurable patience and structural expertise throughout the many
    drafts of the manuscript. Rumman Chowdhury, the CEO of Parity AI, provided guidance
    on some areas of the book. Finally, but by no means least, I would not have been
    able to get through the pandemic-filled year and produce this book without the
    unwavering support of my partner, Stephanie. Her support and encouragement have
    made the entire thing possible.


    This book is intended as an informed introduction to the world of AI and some
    of the opportunities and challenges the field presents. However, there is not
    enough space within these pages to explore some of the subjects with the depth
    they merit. Despite the time and expertise given by all those above – and countless
    others who are not named and came before them – any mistakes are my own. I hope
    that the book presents societal concerns with the gravity that they are intended
    and can, even in a tiny way, lead to the creation of a better AI future.


