- raw: 'In some respects, the cybersecurity industry is ahead of criminals, as it
    has long been using AI tools that can detect anomalies, such as malware, in a
    corporate network that could cause extensive damage to data and systems. Google,
    for example, started using machine learning in 2017 to help spot malicious Android
    apps in its PlayStore. Emily Wenger from the University of Chicago’s SAND Lab,
    along with other researchers, used AI to create a privacy-preserving tool, Fawkes,
    that adds data to people’s photos in a process called image cloaking. This added
    data is invisible to the human eye but can confuse facial recognition databases.


    As well as using AI to attack conventional computer systems, AI can be employed
    to attack other AI. The risks and stakes here are high, and malicious uses of
    the technology are hard to detect. Essentially it can take one of two forms: adversarial
    attacks and Trojan attacks. With an adversarial attack ‘perturbations’ – or pixels
    that aren’t visible to the human eye – are added to an image to make the AI misinterpret
    what it is seeing. (This uses GAN-style technology, which was first created by
    Google researchers in 2014 when they published a paper that described how adding
    a ‘perturbation’ to an image made it perform incorrectly.


    Trojan attacks, by contrast, involve planting malicious data in one piece of AI
    that might well end up being used by a different one. So, for example, a company
    might purchase an image-recognition system from another firm that deals with the
    training and creation of AI, not knowing that it has already been hacked. Only
    when they – or an end user even further down the supply chain – deploy it will
    the problems surface. ‘You’ll probably have a bunch of test data yourself,’ says
    Wenchao Li, an assistant professor at Boston University who has exposed how Trojan
    attacks can impact reinforcement-learning algorithms. ‘You’ve tested the model
    and it seems right on this test dataset. And now you can deploy it. But the problem
    is, the network that you got from somebody else actually has a Trojan in it.’


    Such systemic threats have been a part of the digital world for years. The laptop,
    computer and phone manufacturer ASUS, for example, suffered a supply chain attack
    in 2019 after a server for the company’s software updates was compromised and
    malware inserted into the legitimate update that was sent out.


    To help combat such backdoor attacks against AI systems the US Intelligence Advanced
    Research Projects Activity (IARPA) has come up with a project called TrojAI whereby
    researchers compete to find effective methods to detect Trojans. ‘For a Trojan
    attack to be effective the trigger must be rare in the normal operating environment,
    so that the Trojan does not activate on test datasets or in normal operations,
    either one of which could raise the suspicions of the AI’s users,’ IARPA says
    on its website.


    Detecting these types of attacks is difficult. ‘There’s an argument for an attacker
    to poison only a tiny fraction of the data, because, let’s say, this one bad player
    needed a team, and you could have a vigilant vendor monitoring the training process,’
    says Boston’s Li, who is part of one of the teams in the IARPA project.


    At present, the TrojAI project is in its early stages, but those behind it say
    it shows promise. However, inspecting for a Trojan involves deep analysis of the
    results of an AI system, and being able to undertake this requires another AI
    that’s able to carefully classify many different outputs of the corrupted system
    and spot how it reaches its decisions. Such complexity inevitably gives potential
    hackers room for manoeuvre. The battle between legitimate AI users and hackers
    will be a continual one.


    # 7


    ## Making AI accountable


    Silicon Valley’s biggest technology companies – Google, Amazon, Facebook, Netflix,
    Microsoft and Apple – have driven the development and commercialisation of AI
    throughout the 2010s. They have invested billions to build the infrastructure
    required to process AI decisions and then deploy AI in their products. They have
    invested heavily in securing the vast amount of data their AI systems are trained
    on, processing it in huge data centres and deploying immense computing power to
    crunch it. And they have spent a small fortune on attracting and keeping the best
    possible talent.


    Thanks to them our lives have been quietly transformed. Amazon has brought voice-recognition
    technology into millions of homes with its Alexa-enabled Echo speakers. Apple
    has pioneered privacy-protecting machine learning which strips away personal details
    from your interactions with your phone, to ensure people can’t be re-identified
    from the training data it supplies. Microsoft’s tech infrastructure sits behind
    hundreds of other companies’ AI systems. Facebook and Instagram feeds are filled
    with the posts that AI decides we’re most likely to interact with, not just from
    our friends and family but also advertisers and brands that people follow. Netflix’s
    machine learning nudges us towards the shows and movies it wants us to watch,
    based on our past viewing history. The vast majority of Google’s products – including
    suggested replies in emails and documents, its translation tools, directions provided
    by maps and YouTube recommendations – are fuelled by AI.


    But there’s a problem. The vast majority of AI products are being developed by
    one particular group: white men. Just as decisions made by AI can be skewed by
    the datasets that feed them, their basic creation can be skewed by the cultural
    background and assumptions of those who build it. ‘What really matters at the
    end of the day is who is building and shaping the AI system,’ says Tess Posner,
    the CEO of non-profit AI4ALL. ‘Who really is in a position of power to influence
    what gets built, what’s designed, what’s created? Right now, that’s a very homogenous
    group of technologists. You can only know so much if you’re a group of individuals
    who represent one type of person and background.’


    Ironically for a sector that is so heavily reliant on data, the world of AI is
    remarkably coy when it comes to revealing data about the nature of its workforce.
    Technology companies, universities and other academic institutions alike have
    traditionally been reluctant to publish details. Things are slowly changing for
    large companies in some countries, but they’re still able to control the narrative
    that accompanies the statistics they issue. Overall, there’s a distinct lack of
    detail about such metrics as gender, sexual orientation or ethnicity.


    Even so, the general picture is clear. On average 80 per cent of AI professors
    are male, according to the 2018 AI Index, which looked at such top computer science
    schools as University College London, Stanford, CMU, Berkeley, Oxford, ETH Zurich
    and the University of Illinois’ Urbana-Champaign campus (the researchers noted
    that there was ‘little variation’ between the schools inspected).


    Not surprisingly, a 2019 report on gender, race and power in AI from New York
    University’s AI Now Institute that discussed these numbers concludes that ‘The
    AI industry is strikingly homogeneous, due in large part to its treatment of women,
    people of colour, gender minorities, and other under-represented groups.’'
