  trans: '

    如此非凡的快速进步展示了 AI 的部分潜力。目前，它能够快速高效地掌握单个任务。但研究人员设想了一个未来世界，在那里单个系统无需针对每项任务进行调整即可完成多项任务。如果这一通用愿景得以实现，它将从根本上改变人类与机器的交互方式——其影响将远超当下。顺便提一下，李世石在输给
    AlphaGo 的比赛中赢下的那一局，是人类迄今为止唯一一次战胜该系统。但总体上的失利对这位有史以来最伟大的棋手之一产生了深远的影响。他于 2019 年退役，感觉对他来说围棋再也不会像从前一样了。“即使我成为世界第一，”他说，“也有一个无法被战胜的实体存在。”


    ### 更好的工具，更强大的力量


    AI 传播的速度之快——且仍在持续——使得许多创新成果，仅仅几年前还只是少数实验室和资金雄厚的硅谷公司的专属，如今已触手可及。计算机价格持续下降，而算力不断增强。你现在可以购买一台高性能笔记本或台式机，利用
    Google、Amazon 或 Microsoft 的云服务运行 AI 应用，并自学如何使用它们。你只需要一个像样的互联网连接和几次鼠标点击。


    与此同时，驱动 AI 的硬件也在进一步进步。例如，虽然 GPU 仍然是运行某些 AI 应用的首选处理器，但 Google、Intel、Graphcore 以及众多其他初创公司正竞相制造更快、更强大的
    AI 芯片。Google 于 2016 年发布了其张量处理单元（TPU）AI 芯片。同时，由 Nigel Toon 和 Simon Knowles 创立的
    Graphcore 已筹集超过 4 亿美元风险投资，用于生产其智能处理单元（IPU）芯片。“当 Google 宣布他们正在构建 TPU 时，那是一个重要时刻，”Graphcore
    首席执行官 Toon 说。“正是 TPU 让人们醒悟过来，说：你实际上需要为这项工作构建专用硬件。”


    Graphcore 的 IPU 耗时逾半个十年从零开始设计，不仅旨在配合当今的智能机器工作，还旨在预判 AI 的进一步扩展。第二版——Toon 称这是他们一直想制造的版本——使用了
    594 亿个晶体管（通过开关执行计算的电子门），它们被紧密堆积在仅相距 7 纳米的空间内。公司称其 Mark 2 芯片的性能比第一代提升了八倍。这些芯片互联互通，以便在一个比以往任何时候都有更多数据被抛向日益复杂的
    AI 系统的世界中，能够彼此高效通信。“我们知道我们要构建的这些知识模型最终将变得极其复杂，”Toon 说。“我们正试图创造一款在运行方式上更为复杂的硬件，以便你能真正利用数据中固有的基础稀疏性。”IPU
    现已投入商业运营。


    大数据——AI 革命的命脉——在质量和数量上也在改善。“人们开始认识到，推进发展的方法不仅仅是拥有巧妙的算法和大量的算力，而是需要经过精心策划的训练数据，”牛津大学计算机科学教授、艾伦·图灵研究所
    AI 项目联合主任 Michael Wooldridge 说。环绕地球的卫星现在正以高分辨率捕捉地球，世界历史的一个版本已在 Wikipedia 上被自由记录，我们的城市越来越布满传感器，能追踪从街道人流量到垃圾桶满溢程度的一切。在个人层面：你在智能手机上的每一次点击都创造了一个数据点，观看习惯被存储，医疗记录正在数字化，人们向网络上传的图片和视频越来越多。


    当然，在错误的人手中，此类数据会危及隐私并助长滥用。但在正确的人手中，它可用于训练机器学习系统，从而带来对我们周围世界的积极改善。研究人员正利用大数据编程无人机，以勘测森林砍伐并播种造林。大数据已帮助
    AI 从数亿个分子中发现新型抗生素。NASA 数据被处理分析以发现新行星。此类例子不胜枚举。


    不仅 AI 工具在兴起，该行业本身也在壮大，吸引着越来越多的投资。根据 AI Index 收集的数据——这是一个由斯坦福大学运行的项目，旨在分析全球行业状况及其变化——AI
    初创公司 2010 年融资 13 亿美元。2018 年这一数字飙升至 404 亿美元。虽然 2020 年的全球大流行可能导致了暂时的低迷，但整体趋势仍然向上。2018
    年有超过 3000 家 AI 公司获得融资。2014 年至 2019 年 11 月间，对 AI 公司进行的超过 40 万美元的投资超过 15000 笔——平均投资规模约为
    860 万美元。在此过程中，大型科技公司招募了数千名额外员工。AI 研究部门得到加强。资金雄厚的科技公司“魔法圈”外的新玩家也被吸引进来——从制药公司到银行。


    AI 现在也是一项全球性事业。投资虽然仍主要由美国和中国主导，两国正竞相成为 AI 超级大国，但世界其他地区也在大举投入。“谁在这个领域成为领导者，谁就会成为世界的统治者，”俄罗斯总统弗拉基米尔·普京于
    2017 年表示。


    AI 出版物和会议也随之爆发式增长。AI Index 显示，在 1998 年至 2018 年的 20 年间，同行评审的 AI 科学论文数量增加了 300%。如今，中国每年发表的
    AI 期刊和会议论文数量与整个欧洲相当，已超越美国成为单一最大贡献者。最大的 AI 研究会议 NeurIPS 2019 年有 13000 名与会者，较 2012
    年增长了 800%。


    如今，AI 领域拥有多个子域，从模式匹配到语音识别，经由计算机视觉（教会机器“看”）和自然语言处理（让机器理解文本）。然而，可以说我们仍处于一项在某些领域已无处不在的技术商业化的早期阶段。即使现在，理解
    AI 在何处以及以何种类型被使用仍是一项挑战——2019 年的一项分析判定，欧洲 40% 的 AI 初创公司实际上并不使用 AI。


    因此，在我们弄清楚如何最好地利用甚至当下已触手可及的技术之前，还有很长的路要走。最终，它将成为我们日常生活中隐形的一部分。“那里有人，你需要考虑他们如何融入你业务的其余部分，”Wooldridge
    说。“技术真正嵌入并让人们找到正确使用方式，需要时间。”


    # 3


    ## 应用 AI


    并非所有 AI 都平等。有些已达到人类水平，有些仍有很长的路要走。例如，Amazon Echo 和 Google Home 智能音箱使用的语音识别系统，可能已改进到能对人们提出的基本问题有用的地步，但它们仍然非常故障频发。它们经常听错或误解基本指令。技术正在改进，但我们距离拥有可用于类人对话的语音识别还很远。

    '
