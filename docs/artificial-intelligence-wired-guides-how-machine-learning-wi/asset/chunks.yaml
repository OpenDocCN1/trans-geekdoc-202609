  trans: '


    # AI 环境影响与自动驾驶汽车


    2019 年 6 月，马萨诸塞大学阿默斯特分校的研究人员训练了四个深度学习语言模型（`GPT-2`、谷歌的 `BERT`、AllenNLP 的 `ELMo`
    和 `Transformer`），历时一天。


    AI 研究人员需要在环境影响方面改变思维模式，事实是我们可以采取一些措施。"你可以选择训练什么数据、模型有多大，以及选择哪个数据中心进行训练，" Luccioni
    说道。Luccioni 与同事们共同构建了可自动添加到 AI 模型中的代码，用于报告 AI 的环境影响。该代码名为 `CodeCarbon`，它估算 AI
    模型所需计算资源产生的二氧化碳（CO²）排放量。它通过自动检测训练过程中使用的能源电网和硬件来实现这一点，并随后提供关于如何改进的建议。随着 AI 训练数据变得更大，其能源足迹是开发人员将不得不改进的方面。


    ## 自动驾驶汽车


    2004 年春，十五辆车聚集在莫哈韦沙漠，参加一场独特的比赛。第一辆能够穿越岩石地形、凹陷、沟壑和不可预测的野生动物，抵达 229 公里外终点线的车辆，将为其背后的团队赢得
    100 万美元。条件是？所有车辆均不允许配备驾驶员。所有车辆都必须自行驶抵终点。


    由国防高级研究计划局（`DARPA`）组织，该比赛是该机构首届"大挑战赛"活动。驶向起跑线的是一堆《疯狂的麦克斯》*风格的车辆：巨大的六轮车、改装的 SUV，以及完全没有驾驶舱的沙滩车。数百人挤满了起跑线周围的看台，见证了这场壮观的景象。


    就比赛而言，结果是一场惨败。"获胜者"仅勉强爬行了 11.9 公里。一些车辆甚至勉强冲出起跑漏斗。自动驾驶汽车被灌木丛搞得不知所措；它们僵住了，无法前进；它们撞上围栏；它们在山坡上陷入困境。


    然而，在提升自动驾驶汽车研究知名度方面，该活动取得了成功。一年后，五支车队完成了类似的 212 公里赛程，获胜车队在七小时内冲过终点线。近二十年过去了，全球数百万辆汽车使用自动驾驶功能——如车道保持和自动泊车——完全自动驾驶汽车已在公共道路上行驶了数千公里。


    美国汽车工程师学会（`SAE`）根据六个自动化等级对车辆进行排名，范围从零级的无自动化到五级的完全自动化。四级车辆可在大多数条件下自主驾驶；五级车辆能在所有条件下自主运行。在四级以下的所有等级中，都需要驾驶员，且必须保持专注，随时准备接管。在开发阶段，AI
    可以在电子游戏风格的模拟中进行训练，做出决策并执行。


    创建完全自动驾驶汽车所需的技术和系统，与构建在 `SAE` 量表较低等级运行的半自动驾驶功能所需的技术相似。"自动驾驶汽车是机器人系统，任何机器人系统都有三个主要阶段。第一阶段是感知，第二阶段是规划，第三阶段是执行，"
    英特尔自动驾驶部门首席系统架构师、英特尔旗下自动驾驶系统公司 `Mobileye` 副总裁 Jack Weast 说道。


    关键组件是计算机视觉。车辆周围的摄像头捕捉汽车周围的世界，能够检测物体并确定它们是什么。"你拥有了带有算法的传感器，它们感知环境、分类物体、理解它们是什么，并构建一个世界模型，这是现实世界中存在事物的虚拟表示，"
    Weast 说道。


    摄像头和计算机视觉并非唯一可用的传感器。`Lidar`（激光雷达，使用光波）和 `radar`（雷达，无线电波）也可被采用。它们的传感器发出信号，击中汽车周围的物体——从路标到行人——然后反射回汽车，在此过程中构建环境的数字图像。由于无线电波不像光波那样容易被吸收，因此它们可以传播更长的距离。关键在于，无论使用哪种传感器和摄像头的组合，都需要有足够多的数量。"你需要有冗余性和独立性，"
    英国自动驾驶软件公司 `Oxbotica` 创始人 Paul Newman 说道。"冗余性是指多个摄像头、多个激光雷达、多个雷达。独立性是指，它们以完全不同的方式工作。"
    只有通过这种组合才能确保安全。Newman 的公司正在英国公共道路上试验四级自动驾驶汽车。其自动驾驶汽车也被用于机场和矿区周围，这些环境对自动驾驶汽车构成的问题较少，因为它们是更可预测的环境。由于汽车行业普遍认为自动驾驶汽车未来将大规模使用，从科技公司到传统车辆制造商，大家现在都在致力于其开发。（有六十家公司持有许可，在加利福尼亚州配备人类安全驾驶员测试自动驾驶汽车）。


    一旦汽车接收回信号，连同计算机视觉摄像头的数据以及正在使用的任何地图数据，车辆即可做出近乎即时的决策。事实上，它在持续感知并规划下一步动作。它观察周围的所有物体，从汽车、卡车到行人和骑车人，并通过评估它们的速度和轨迹来预测它们接下来会做什么。


    在自动驾驶车辆内部，多个算法和 AI 系统正在工作，同时还有非 AI 的经典统计方法。"在规划阶段，有一个称为驾驶策略的逻辑模块，" 英特尔的 Jack Weast
    说道。这决定了车辆应如何表现。与监督学习和无监督学习不同，它基于涉及特定目标的强化学习。算法被告知要实现某个目标——例如节能驾驶——然后通过试错来尝试达到它。如果成功，AI
    会获得奖励，奖励就是告诉 AI 复制更多它刚刚展示的正确行为。"奖励可能是燃油经济性，可能是安全性，也可能是到达目的地的时间，" Weast 说道。"你试图针对某些特定指标进行优化，所以这是一个非常有效的工具。"


    就将自动驾驶理论变为现实而言，可以说领先的公司是 `Waymo`，它是谷歌的分支，始于 2009 年该科技巨头的研究实验室。在十年的时间里，该公司的自动驾驶系统已让其车辆在公共道路上行驶了
    3000 多万公里。大部分是在安全驾驶员坐在驾驶座后、随时准备在情况不对劲时接管汽车的情况下完成的。但自 2015 年以来，一些行程是在没有安全驾驶员在场的情况下进行的。据该公司称，截至
    2020 年初，每周在亚利桑那州凤凰城 260 平方公里的区域内运营 1000-2000 次自动驾驶乘车服务，其中多达 10% 为完全无人驾驶。总的来说，2020
    年前九个月实现了 10.5 万公里的完全自动驾驶。


    '
