- raw: 'All these biases show the risks of using data to predict future outcomes.
    And within AI the problem has been pronounced. Take law enforcement, for example.
    In the US in particular the police have come to use predictive systems when they’re
    seeking to assess how likely someone is to re-offend, or whether they should be
    granted bail, or when spikes in crimes are likely to happen. The trouble is that
    such systems inevitably target individuals and communities that have historically
    been the focus of particular police attention. ‘If you’re using problematic data,
    you’re going to get problematic policing,’ explains Renée Cummings, a researcher
    specialising in AI in the criminal justice sector and its discriminatory effects.
    In the US people who are black are more than twice as likely to be arrested as
    white people. They are more likely to be stopped without cause by police, and
    black men are 2.5 times more likely to be killed by police than white men. ‘It
    starts from a place of bias,’ Cummings says. ‘AI has really amplified the biases
    and the discrimination that has been a part of the system.’


    A 2016 investigation by ProPublica revealed how predictive software, called COMPAS,
    was biased against black people.


    Even when race data is stripped from predictive policing AI systems (a frequent
    requirement of equalities laws), problems remain. Rashida Richardson, the author
    of the AI Now paper, who is now a visiting scholar at Rutgers Law School, points
    out that there are numerous forms of data that can serve as proxies for race.
    Location is one. If you live in an area that is already heavily policed because
    of its racial composition, it follows that there will be more police reports on
    file and so a great likelihood of AI deeming your area to be crime-ridden. Other
    data profiles that can lead to distortion include age and social links. One predictive
    policing tool used in the Netherlands employs demographic data such as the number
    of one-parent households, the number of people receiving social benefits, and
    the number of non-Western immigrants as factors in determining how likely a crime
    is to happen in a particular area.


    There is currently little evidence to demonstrate that predictive or AI risk assessment
    tools actually work. Studies showing that algorithmic decision tools can make
    better predictions than humans are few in number, and because police forces are
    generally tight-lipped about their use of AI technologies their data has not often
    been independently analysed and verified. However, one Los Angeles Police Department
    review of a system called PredPol, which is used in multiple places across the
    US, said it was ‘difficult to draw conclusions about the effectiveness of the
    system in reducing vehicle or other crime’.


    In June 2020, more than 1,400 mathematicians signed an open letter stating that
    they did not believe the field should be collaborating with police on these systems.


    It’s not just policing where AI bias can rear its head. Housing, employment and
    financial matters have all suffered from bias problems. Healthcare is emerging
    as the newest sector to suffer with issues. In the US, for instance, researchers
    from the University of California, Berkeley, discovered that an algorithm used
    by insurers and hospitals to manage the care of around 200 million people a year
    gave lower risk scores to people who self-identified as black than to white people
    who were equally sick.


    As AI becomes more sophisticated, researchers worry that the connections made
    by algorithms will become more obscure. Proxies for certain types of data will
    become harder to identify, and machines may make links between certain types of
    information that humans don’t associate together, or can’t see because of the
    scale of the information being crunched. The first signs of this happening are
    already evident.


    In March 2019, for example, the US Department of Housing and Urban Development
    (HUD) charged Facebook with discrimination over how its targeted advertising for
    housing works.


    ‘An algorithm is grouping people not based necessarily on sexual orientation or
    their skin colour,’ says Sandra Watcher, associate professor and senior research
    fellow in the law and ethics of AI at the Oxford Internet Institute. She says
    algorithms group people with similar behaviours. ‘These similarities could be
    that they all have green shoes, or similarities could be that they eat Indian
    food on a Tuesday, or that they play video games.’ The problem is that such correlations
    can lead to wholly false inferences – an algorithm might, for example, conclude
    that people who wear green shoes do, or don’t, have a tendency to repay their
    loans on time. To any human, such a conclusion would be preposterous. To an AI
    it may seem entirely logical.


    ‘Even if a bank can explain which data and variables have been used to make a
    decision (e.g. banking records, income, postcode), the decision turns on inferences
    drawn from these sources; for example, that the applicant is not a reliable borrower,’
    Watcher writes.


    ### Surveillance


    If AI has proved problematic when it’s crunching data, it’s also displayed severe
    shortcomings when it’s processing images involving humans – particularly through
    facial-recognition technology.


    How these systems work is quite simple, at least in theory. If, say, a surveillance
    camera linked to an AI system detects a face, measurements between facial features,
    such as the distance between the forehead and chin, are taken and a biometric
    map is created. This map is used to create a faceprint (in reality, a series of
    numbers). This is then compared against other faceprints in the database for a
    possible match. The underlying algorithms have been trained on matching faces
    to others in datasets.


    Police forces around the world use such AI to detect people already logged on
    their systems as criminals or potential criminals. If there’s a match when a live
    deployment is being used, officers on the ground are alerted and can track the
    suspect down. Some cameras running live facial-recognition systems are clearly
    marked. But many of the more sophisticated models look much like any other CCTV
    cameras. One particularly advanced series of cameras, launched in 2020, which
    uses six AI algorithms, offers up to 12-megapixel resolution and combines facial
    recognition with crowd counting and car number plate reading. It can monitor perimeters
    and queues, and can even detect if people are wearing hard hats or not.


    That, at least, is the theory. In practice, high levels of accuracy in lab tests
    are often not replicated in the real world. Low light levels can play havoc with
    facial recognition, as can poor-quality video footage. The sun can be a particular
    pain. In an early trial of live facial-recognition systems by police in the UK,
    2,470 faces were judged to be matches with those held in the police database.
    In fact, only 8 per cent were. All the other so-called matches turned out to be
    false ones.


    Accuracy is a problem. Because many systems have been trained predominantly on
    images of white people, they tend to be less accurate when it comes to detecting
    black and brown faces. Incorrect identifications have therefore been made. In
    January 2020, 41-year-old Robert Williams, a black man from Michigan, spent thirty
    hours in custody thanks to an algorithm sparking a wrongful arrest.'
