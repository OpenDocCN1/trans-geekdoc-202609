  trans: '


    # 7


    ## 让 AI 承担责任


    在某些方面，网络安全行业领先于犯罪分子，因为它早就一直在使用 AI 工具，这些工具能够检测企业网络中的异常情况（如恶意软件），而这些异常可能会对数据和系统造成广泛破坏。例如，Google
    于 2017 年开始使用机器学习，以帮助在其 Play 商店中识别恶意 Android 应用。芝加哥大学 SAND 实验室的 Emily Wenger 与其他研究人员利用
    AI 创建了一款保护隐私的工具 **Fawkes**，该工具通过一种称为“图像隐匿”的过程向人物照片添加数据。这些添加的数据肉眼不可见，但能干扰人脸识别数据库。


    除了利用 AI 攻击传统计算机系统外，AI 还可被用来攻击其他 AI。此处的风险与赌注极高，且该技术的恶意用途难以被察觉。本质上，它主要采取两种形式：对抗性攻击和特洛伊木马攻击。在对抗性攻击中，“扰动”——即肉眼不可见的像素——被添加到图像中，导致
    AI 错误解读所见内容。（这使用了 **GAN** 风格的技术，该技术最早由 Google 研究人员于 2014 年创建，当时他们发表了一篇论文，描述了向图像添加“扰动”如何导致其表现异常。）


    相比之下，特洛伊木马攻击涉及在一段 AI 中植入恶意数据，而这段 AI 可能最终会被另一段不同的 AI 使用。例如，一家公司可能从另一家负责 AI 训练与创建的公司购买图像识别系统，却不知该系统早已被植入后门。只有当他们——甚至供应链更下游的最终用户——部署该系统时，问题才会浮现。“你自己大概率会有一堆测试数据，”波士顿大学助理教授
    Wenchao Li 说道，他曾揭露特洛伊木马攻击如何影响强化学习算法。“你在该测试数据集上测试了模型，看起来一切正常。于是你可以部署它。但问题在于，你从别人那里得到的网络实际上藏有特洛伊木马。”


    此类系统性威胁多年来一直存在于数字世界中。例如，笔记本电脑、计算机和手机制造商 **ASUS** 于 2019 年遭遇了一起供应链攻击，原因是该公司软件更新服务器被攻破，恶意软件被植入并随合法更新推送出去。


    为帮助应对针对 AI 系统的此类后门攻击，美国情报高级研究计划活动（**IARPA**）发起了一个名为 **TrojAI** 的项目，让研究人员竞相寻找检测特洛伊木马的有效方法。**IARPA**
    在其网站上指出：“为了使特洛伊木马攻击生效，触发器必须在正常运行环境中罕见，以免特洛伊木马在测试数据集或正常操作中被激活，因为这两种情况都可能引起 AI 用户的怀疑。”


    检测此类攻击颇具难度。“攻击者只投毒极小部分数据是有道理的，因为，假设这个坏人需要一个团队，而你可能有一个警惕的供应商监控训练过程，”波士顿大学的 Li 说道，他是
    **IARPA** 项目其中一个团队的成员。


    目前，**TrojAI** 项目仍处于早期阶段，但幕后推手表示前景可期。然而，排查特洛伊木马涉及对 AI 系统结果的深度分析，而要进行这种分析，需要另一个
    AI 能够仔细分类被破坏系统的许多不同输出，并发现其决策路径。这种复杂性不可避免地给潜在黑客留下了操作空间。合法 AI 用户与黑客之间的较量将是持续不断的。


    硅谷最大的科技公司——**Google**、**Amazon**、**Facebook**、**Netflix**、**Microsoft** 和 **Apple**——在
    2010 年代推动了 AI 的发展与商业化。它们投入数十亿美元构建处理 AI 决策所需的基础设施，并将 AI 部署在其产品中。它们在保护 AI 系统训练所用的海量数据方面投入巨资，在大型数据中心处理这些数据，并部署巨大的算力进行运算。它们还花费巨资吸引并留住最优秀的人才。


    得益于它们，我们的生活已悄然改变。**Amazon** 凭借搭载 **Alexa** 的 **Echo** 智能音箱，将语音识别技术带入数百万家庭。**Apple**
    开创了保护隐私的机器学习，从你与手机的交互中剥离个人细节，确保人们无法从其提供的训练数据中被重新识别。**Microsoft** 的技术基础设施支撑着其他数百家公司的
    AI 系统。**Facebook** 和 **Instagram** 的信息流填满了 AI 判定我们最可能互动的帖子，这些帖子不仅来自亲友，也来自用户关注的广告商和品牌。**Netflix**
    的机器学习根据我们的观看历史，推荐它希望我们观看的剧集和电影。**Google** 绝大多数产品——包括邮件和文档中的智能回复、翻译工具、地图导航及 **YouTube**
    推荐——均由 AI 驱动。


    但存在一个问题。绝大多数 AI 产品由一个特定群体开发：白人男性。正如 AI 的决策可能因输入数据集而产生偏见，其基础构建也可能因建设者的文化背景和假设而产生偏见。“归根结底，真正重要的是谁在构建和塑造
    AI 系统，”非营利组织 **AI4ALL** 的 CEO **Tess Posner** 表示。“谁真正处于权力地位，能够影响什么被构建、什么被设计、什么被创造？目前，这是一个非常同质化的技术专家群体。如果你是一群代表单一类型人群和背景的个体，你只能知道这么多。”


    对于一个如此严重依赖数据的行业来说，讽刺的是，AI 界在披露其劳动力构成数据方面却异常避讳。科技公司、大学及其他学术机构向来不愿公布详情。情况在某些国家的大公司中正缓慢改善，但它们仍能控制随统计数据发布的叙事。总体而言，关于性别、性取向或种族等指标缺乏详细信息。


    即便如此，大体图景依然清晰。根据 2018 年 **AI 指数**，平均 80% 的 AI 教授为男性，该指数考察了 **伦敦大学学院**、**斯坦福**、**CMU**、**伯克利**、**牛津**、**苏黎世联邦理工**
    和 **伊利诺伊大学厄巴纳-香槟分校** 等顶尖计算机科学院校（研究人员指出，所考察院校之间“变化很小”）。


    不出所料，**纽约大学** **AI Now 研究所** 2019 年关于 AI 领域性别、种族与权力的报告在讨论这些数字时得出结论：“AI 行业极其同质化，很大程度上归因于其对待女性、有色人种、性别少数群体及其他代表性不足群体的方式。”


    '
