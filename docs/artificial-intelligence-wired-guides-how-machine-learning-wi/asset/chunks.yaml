- raw: 'Once this happens the world really will change significantly. People’s workplaces
    will face automation at a greater scale than at any point so far this millennium.
    For many the entire nature of work may change. How we interact with businesses
    and government services will also be transformed. Societies that deploy AI will
    need to learn how people react to the technology and what their expectations of
    it are. At the same time, individuals will only follow the directions given by
    an AI if the system works efficiently, is understandable – and can be trusted.


    # 6


    ## Weaponising AI


    AI’s inexorable rise has been accompanied by its politicisation. This is not just
    because it offers the potential for societies to operate more efficiently, or
    that it is now intricately bound up with their economic success. It’s because
    it’s become a weapon in the struggle for a technological dominance that carries
    with it immense political power. In the 1960s the former Soviet Union and the
    USA competed in the space race. Today it’s the USA and the growing superpower
    that is China that are seeking supremacy in the struggle to achieve control of
    the world of technology and its infrastructure.


    ### The politics


    For a long time, it has been Western universities, technology companies and policymakers
    that drive innovation, with talent from around the world flocking to the US to
    work on AI. Now, China is seeking to drive forward tech standards in everything
    from 5G to AI developments. Its ambitions are serious. In 2017, the country’s
    ruling Communist Party announced its aim to be world leader in AI by 2030. It’s
    currently spending billions on AI development, much of it in the private sector.
    Analysis from the US think tank the Center for Security and Emerging Technology
    suggests that the Chinese government spent around the same amount on AI investment
    in 2018 as the US planned to in 2020.


    Other metrics, too, show China’s commitment. Since 2005 it has published more
    AI research papers than the US, even if they haven’t all had the same impact on
    the academic community as US-based work. That, however, is set to change, according
    to analysis by the Allen Institute for AI in May 2019 which suggested that within
    a year the number of Chinese-led research papers cited by others would match the
    number of US ones being cited


    China may currently lag behind the US and other nations in its AI hardware development,
    but it nevertheless now boasts some of the world’s leading AI software companies.
    SenseTime, Face++ and Hikvision are all prominent in facial recognition. Alibaba,
    Baidu and Tencent now rival Google, Facebook, Microsoft and Apple in their spending
    power and appeal to AI would-be employees.


    And the country is spreading its influence across many of the world’s less economically
    developed countries. China’s Belt and Road scheme has provided developing nations
    with new technology that will in future become fuelled by AI. ‘In Africa the backend
    network infrastructure is basically almost entirely Chinese now, between Huawei
    and ZTE,’ says Eric Olander, who leads the China Africa Project. ‘In Ghana, they’ve
    gone from 700 \[CCTV\] cameras to 7,000 cameras in the space of just a few years.’
    During the coronavirus pandemic, Olander adds, Chinese companies donated technology
    to African states to help them fight the virus. Huawei, for example, provided
    video conference systems and thermal temperature scanners, as well as some cash,
    during the spring of 2020.


    Tech rivalry isn’t limited to China and the US, though: other countries around
    the world are investing in AI research and development, aiming to keep up with
    the global leaders and seeking to deploy the technologies across their own nations.
    It’s unlikely that such competition will lead to the fracturing of the technology,
    or into a simple two-way split between the US and China. Most of the world’s AI
    development is far too interconnected to be completely driven apart by political
    rivalries. It’s dominated by open-source publishing, research, breakthroughs and
    training datasets that are available to anyone with an internet connection. Nevertheless,
    international tensions are likely to increase as China aims to achieve its superpower
    targets.


    In immediate terms the expansion of AI has raised questions of regulation. Some
    claim that existing laws, covering human rights and data protection, are sufficient
    to keep abuses in check. Others argue that AI raises wholly new issues that can
    only be dealt with by specific laws. Some are nervous about particular aspects
    of AI technology (several US cities have banned the use of facial-recognition
    technology). Some believe that it should not be used at all in certain domains
    (there is a wide consensus among the AI community that the technology should not
    be used for autonomous weapon systems, such as drones, that can take lives without
    human intervention).


    The European Union may end up leading the way in such matters. Its General Data
    Protection Regulation (GDPR), whose enforcement began in 2018, has redefined the
    way people’s personal information is handled around the world. Now it has now
    turned its attention to codifying laws on the use and control of AI, which, if
    and when issued, would constitute the first transnational regulation of AI (the
    guidelines were scheduled for publication in 2020, but then delayed to an unspecified
    date in 2021). ‘We want a set of rules that puts people at the centre,’ said Ursula
    von der Leyen, the European president, in September 2020. ‘Algorithms must not
    be a black box, and there must be clear rules if something goes wrong.’


    Von der Leyen’s comments followed the publication of a white paper setting out
    what the EU might do: for example, introducing rules to govern ‘high-risk’ AI
    systems (such as those used in health, policing and transport) and those cases
    where AI use could result in discrimination or injury or put people’s lives in
    danger. It’s worth noting, though, that a consensus view is some way off. Of the
    more than 1,200 groups the EU consulted, 42 per cent thought that new laws were
    needed to govern AI, while 33 per cent argued that existing legislation could
    do the job. There was a similar split over possible approaches to high-risk uses
    of AI (42 per cent to 30 per cent). Clearly there is a long way to go.


    ### The hackers


    If countries are in the process of using AI as a tool reinforcing power and dominance,
    criminals are also starting to weaponise the technology. First among them will
    be hacker and cybercriminal communities.


    The problem is that it currently doesn’t take much to fool an AI. Simply adding
    strips of black and white tape to red stop signs (in some cases spelling out the
    words ‘love’ and ‘hate’) – as a group of nine researchers did in 2018 in a virtual
    simulation – can be sufficient to fool a self-driving car into assuming that the
    speed limit is 45 miles per hour.


    These errors occurred in research conditions. But cybercriminals and hackers always
    work at the cutting edges of technology and innovation – it’s the only way to
    stay in front of law enforcement officials. It won’t be long before they turn
    to using AI. For some AI will be the tool rather than the target. For instance,
    criminals may use AI to help find flaws in an app’s code (app developers also
    do this to pre-emptively find errors). They may employ AI to create new malware
    or attacks (polymorphic malware can constantly change itself to evade detection).
    Or they may program AI to mimic people’s behaviour as part of phishing attacks
    that con people into believing an email or request for money is being sent from
    someone they trust.'
