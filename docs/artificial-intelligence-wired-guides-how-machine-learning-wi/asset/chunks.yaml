    # 机器人拣选与包装的挑战


    拣选和包装对机器人来说并非易事。Ocado Technology 首席高级技术官 Alex Harvey 表示：“从人类的角度来看，拣选和包装是一项相当简单的任务，不需要大量培训。但对于计算机和机器人而言，所涉及的灵巧操作远远超出了当今的最先进水平，无法拣选和包装我们所处理的全品类商品。”


    Ocado 的机器人吸附拣选（RSP）机器是一个由空气压缩机驱动的真空吸盘，位于关节臂的末端。它利用计算机视觉和内置传感器来挑选由机器人收集的商品，并将其放入购物袋中。Ocado.com
    销售种类繁多的产品，数量达数万种。就外观而言，有些产品非常相似：例如，一罐切碎的番茄与一罐扁豆差别不大。但一罐切碎的番茄与一包酸奶截然不同，后者又比一串葡萄更结实。当然，即使是葡萄也不尽相同——它们因品种和成熟度而异。如果真空吸盘的压力设置错误，RSP
    要么会掉落，要么会压碎试图操作的物品。如果拣选顺序错误，番茄罐头就有压碎葡萄的危险。


    目前，公司正在扩大其机器人吸附系统可拣选的商品数量。Harvey 表示：“为六万种不同的商品编写六万套不同的控制代码毫无意义。Ocado 想要的是通用的控制策略。”但挑战依然存在。“我们需要让机器人适应人员所在或操作的相同占地面积，并要求机器人系统达到相同的吞吐量。”Harvey
    称，除非机器人每小时能拣选包装的物品数量与人类相当——约 600-700 件——否则不太可能被广泛采用：对生产力的影响会损害服务和利润。它还必须价格合理，这意味着一方面要将技术扩展到经济上划算的程度，另一方面不要过度设计（例如，使用分辨率不必要地高的摄像头）。Harvey
    说：“在现实世界中部署技术时，我们希望部署方式是经济的。我不想在每个机器人拣选员旁边都部署一台超级计算机。”


    # AI 与人类的协作未来


    这种 AI 最终是否会取代人类是一个价值十亿美元的问题。许多人现在认为 AI 将与人类协同工作。显然，AI 承诺带来更高的效率，但迄今为止，这往往仅在环境相对受控且可预测的情况下成立。生产线和仓库可能会实现全自动化。但当流程与外部世界——及其所有的随机性——交互时，很难设想一个完全由
    AI 主导的未来。例如，送货司机必须考虑天气和行人反常行为等因素。未来可能没有他们。但也有可能 AI 会在条件相对可预测的主干道上控制卡车和送货车，而人类司机在到达目的地设定的村庄、城镇和城市郊区时接管驾驶。


