- raw: 'There are privacy issues, too. CCTV cameras are now ubiquitous, and we have
    very little say over where they are placed or how their images are used. In time
    they can be upgraded to use facial recognition. Police forces claim that facial
    recognition can make our lives safer, and that they are an important weapon in
    the fight against crime. But such advantages have to be balanced with civil liberty
    considerations. In the UK, several people have been stopped and challenged over
    their decision to cover their faces rather than have them scanned by surveillance
    technology. A teenager was stopped after they had already been dealt with by the
    courts (an out-of-date database was to blame here).


    It’s perhaps at a national level that the positive and negatives of a surveillance
    world are most apparent. Certainly it’s at a national level that the true extent
    of its power is most clear. Take the way India used surveillance AI during the
    early weeks of the coronavirus pandemic in April 2020. As the first wave spread,
    police forces in Delhi and Mumbai sent up drones to monitor people, to enforce
    the national lockdown and to improve social distancing (a local start-up in Mumbai
    contributed by donating 45 drones). Onboard cameras captured footage of potentially
    illegal gatherings and speakers blared out messages ordering groups to disperse.
    Police viewing the video in real time could scramble officers to where they were
    needed.


    Meanwhile, in Amritsar, the second-largest city in the state of Punjab, airborne
    surveillance was supercharged. The start-up Skylark Labs flew drones that used
    computer vision to detect precisely how close to one another people were standing
    (a green bounding box would appear around them if they were far enough apart,
    and a red one if they were too close). ‘There’s a mapping algorithm, which divides
    the map of the whole city into ten grids, and we just tell them \[the police\]
    to select the grids where they want to fly – and the drones would automatically
    take off and fly in that grid,’ explains Amarjot Singh, the CEO of Skylark. ‘If
    a human was detected, it would flag the human, and it would send a message onto
    the phone of police officers who were close to that area,’ he adds. The system
    was then rolled out to a further six cities. Two hundred fines were ultimately
    issued and some cars impounded. The use of the technology sets worrying new precedents
    for government control of citizens – people’s behaviour is quietly watched from
    above.


    India is not the only country where such intrusive surveillance is being deployed
    by state and local governments. ‘There are more countries out there that are experimenting
    with procuring and purchasing and investing in these systems than I expected,’
    says Steven Feldstein, a senior fellow in Carnegie’s Democracy, Conflict, and
    Governance Program. He conducted the first review of how AI surveillance – smart
    city systems, facial recognition and smart policing set-ups – is used around the
    world. By the summer of 2020, he estimated, seventy-seven countries out of 179
    were deploying such technologies.


    And the technology is growing in range and ambition. People can now be identified
    from their irises, their tattoos, the way they walk (gait recognition technology),
    and more. Soon there will be no place to hide. Researchers in China and the UK
    have built a system that’s able to identify people over a series of weeks, even
    if they’ve changed their clothing and hairstyle.


    Some authorities are treating such advances with caution. In the US, facial-recognition
    systems have been banned in some states, with the city of Portland, Oregon, adopting
    the most thorough-going ban (even businesses there are not allowed to use the
    technology). The EU has reportedly been mulling similar restrictions. In nations
    such as India, on the other hand, the technology is getting an ever-greater hold.
    Officials there boasted that it was instrumental in identifying 1,100 people involved
    in violent riots in Delhi over two days in February 2020. ‘This is a software.
    It does not see faith. It does not see clothes. It only sees the face, and through
    the face the person is caught,’ Indian government minister Amit Shah was reported
    as saying, when asked about innocent people being monitored by the cameras.


    The country that constitutes the most extreme test case for the technology is
    China. No other nation has been as enthusiastic in the pursuit of surveillance
    systems as this communist superstate. It routinely harvests huge amounts of data
    about its citizens and has widely implemented facial-recognition technology. ‘The
    China model is pretty distinctive,’ says Steven Feldstein. ‘No other country really
    comes close in terms of replicating or even having an aspiration to undertake
    total surveillance along the lines of what they do.’ The country is also the world’s
    biggest exporter of AI surveillance technology. Feldstein estimates that Huawei,
    Hikvision, Dahua, and ZTE supply tech to 63 countries. Huawei alone supplies technology
    to 50 countries – a long way ahead of the next largest non-Chinese firm, Japan’s
    NEC (which is used in 14 countries).


    One study, conducted by researchers from the Shanghai Research Institute, and
    published in June 2020, gives a sense of what a dystopian future might hold if
    the technology is left unchecked. The study utilised a network of security cameras,
    along with other sensors (which measured movement, temperature and so on), in
    100,000 lifts across China, and fed the data into multiple algorithms to help
    determine when people’s behaviour was not ‘normal’.


    Each time a lift stopped at a floor, a photo was taken. ‘There are around one
    million records for each floor from 100,000 elevators,’ the researchers say in
    their paper. Overall, 643 instances of people behaving potentially abnormally
    were detected. Of these, more than 100 were down to errors with equipment, or
    images gathered from the security cameras on the network that weren’t in blocks
    of flats (such as cameras in shopping mall elevators, or office buildings). In
    289 cases the researchers decided ‘something different is there’ and determined
    that the building manager should try to find out more details. The research says
    three of the flagged incidents appeared to show people running catering services
    out of their flats; six incidents hinted at over-crowding.


    Despite the scale on which it operated, the system was relatively rudimentary.
    It wasn’t working in real time, and the sheer size of the data gathered meant
    that the researchers didn’t analyse people’s ages and possible occupations. But
    the potential was there. And that potential – not just to detect wrong-doing but
    to snoop on and control people who have done nothing wrong – has worrying implications
    for every aspect of everyday existence, from the daily routines of home life to
    monitoring how productive people are at work and setting targets for them, to
    keeping an eye on us in shops and in airports.


    One repressive instance of mass surveillance that critics of the Chinese regime
    would point to concerns the country’s largely Muslim minority group the Uighurs.
    In one area, for just one month during 2019, facial recognition was used 500,000
    times to screen whether people moving past cameras were Uighur, the *New York
    Times* reported.


    ### Deepfakes


    Towards the end of 2017, an anonymous Reddit user changed the online world. Posting
    under the moniker ‘deepfakes’, they started sharing pornographic videos of celebrities,
    using deep learning to replace the faces of the original performers with those
    of the famous. Taylor Swift, Gal Gadot, Maisie Williams and Scarlett Johansson
    were just some of the victims. Since then, deepfakes have become far-reaching.'
