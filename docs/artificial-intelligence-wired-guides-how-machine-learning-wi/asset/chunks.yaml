    # 机器人拣选与包装的挑战


    拣选和包装对机器人来说并非易事。Ocado Technology 首席高级技术官 Alex Harvey 表示：“从人类的角度来看，拣选和包装是一项相当简单的任务，不需要大量培训。但对于计算机和机器人而言，所涉及的灵巧操作远远超出了当今的最先进水平，无法拣选和包装我们所处理的全品类商品。”


    Ocado 的机器人吸附拣选（RSP）机器是一个由空气压缩机驱动的真空吸盘，位于关节臂的末端。它利用计算机视觉和内置传感器来挑选由机器人收集的商品，并将其放入购物袋中。Ocado.com
    销售种类繁多的产品，数量达数万种。就外观而言，有些产品非常相似：例如，一罐切碎的番茄与一罐扁豆差别不大。但一罐切碎的番茄与一包酸奶截然不同，后者又比一串葡萄更结实。当然，即使是葡萄也不尽相同——它们因品种和成熟度而异。如果真空吸盘的压力设置错误，RSP
    要么会掉落，要么会压碎试图操作的物品。如果拣选顺序错误，番茄罐头就有压碎葡萄的危险。


    目前，公司正在扩大其机器人吸附系统可拣选的商品数量。Harvey 表示：“为六万种不同的商品编写六万套不同的控制代码毫无意义。Ocado 想要的是通用的控制策略。”但挑战依然存在。“我们需要让机器人适应人员所在或操作的相同占地面积，并要求机器人系统达到相同的吞吐量。”Harvey
    称，除非机器人每小时能拣选包装的物品数量与人类相当——约 600-700 件——否则不太可能被广泛采用：对生产力的影响会损害服务和利润。它还必须价格合理，这意味着一方面要将技术扩展到经济上划算的程度，另一方面不要过度设计（例如，使用分辨率不必要地高的摄像头）。Harvey
    说：“在现实世界中部署技术时，我们希望部署方式是经济的。我不想在每个机器人拣选员旁边都部署一台超级计算机。”


    # AI 与人类的协作未来


    这种 AI 最终是否会取代人类是一个价值十亿美元的问题。许多人现在认为 AI 将与人类协同工作。显然，AI 承诺带来更高的效率，但迄今为止，这往往仅在环境相对受控且可预测的情况下成立。生产线和仓库可能会实现全自动化。但当流程与外部世界——及其所有的随机性——交互时，很难设想一个完全由
    AI 主导的未来。例如，送货司机必须考虑天气和行人反常行为等因素。未来可能没有他们。但也有可能 AI 会在条件相对可预测的主干道上控制卡车和送货车，而人类司机在到达目的地设定的村庄、城镇和城市郊区时接管驾驶。


    # 医疗领域的 AI 实践与局限


    可以说，医疗领域是 AI 潜力及其局限性表现得最明显的地方——也是其与人类未来关系最清晰展示的地方。以 Google 的计算机视觉系统为例。它能够发现糖尿病视网膜病变，这是一种可能导致视力丧失的糖尿病并发症。在实验室条件下，其准确率可达
    90%，并在十分钟内出具结果。


    然而，在泰国的真实世界测试中，该深度学习系统往往举步维艰。


    随后出现了人为因素。在一家诊所，一半被纳入研究的患者在得知虽然结果几乎是即时的（此前有些结果需等待十周），但阳性诊断意味着他们将被转诊到一小时车程外的医院后，拒绝参与。一名医务人员告诉
    Google 研究人员，患者“不关心准确性，而是关心体验如何——如果我必须去医院，会不会浪费我的时间？”


    毫无疑问技术是有效的：试验中的测试在条件合适时证明了其准确性。Beede 表示，当一切顺利时，资深护士觉得有更多时间陪伴患者，并与他们讨论健康和生活方式。但现实世界的不可预测性以及人类的需求和顾虑不容忽视。Beede
    说：“我认为这项研究的主要启示是，我们需要以人为本来设计 AI 工具。我们需要考虑的成功指标不仅限于模型的准确性。我们需要了解它实际上如何在真实情境下为真实的人服务。”她认为，随着更多
    AI 在现实世界中实施，将需要更多的试点研究，以确保其对所有相关方都有效。“实施的重要性与算法本身的准确性同等重要，且并不总能通过周密的计划来控制，”Google
    报告总结道。


    # 人机协作的必要性


    哈佛大学计算机科学教授 Finale Doshi-Velez 领导其“数据到可行动知识实验室”，充分证明了人类与 AI 之间建立适当且深思熟虑的伙伴关系的必要性。在一项实验中，她和同事招募了
    220 名精神科医生，研究假设患有重度抑郁症的假想患者的病历。


    Doshi-Velez 表示：“我们发现，当推荐是正确时，总体上一切都有所改善。”医生和 AI 的决策被证明是一支强强联合的团队。“人类可能已经有了主意，推荐强化了它，或让他们改变主意采纳了该想法。”然而，当向志愿医生呈现的推荐是错误时，往往会导致更差的决策。精神科医生受到
    AI 错误推荐的影响，导致治疗选择准确率下降。这绝非新现象。长期以来人们已知，如果我们让机器负责简单任务，人类若无持续训练，就会忘记如何完成它们。因此，在日常层面，手机里的数字通讯录导致我们不再记住电话号码。在极端层面，2009
    年 6 月 1 日，法航 447 航班的飞行员因过度依赖飞机的自动驾驶功能，在系统故障时无法应对，酿成 228 人遇难的空难。有了 AI，这种“自动化悖论”只会变得更加突出。


    信息呈现的方式也是决定最终成败的重要因素。Doshi-Velez 表示：“某些形式的解释能更有效地防止错误决策。”Google Health 的研究人员也注意到了这一点。在泰国的现场试验中，Google
    产品经理 Lily Peng 表示，系统通知图像不可分级且应转诊，很容易被误解。“对某些人来说，这意味着被转诊给视网膜专家，这是高端医疗；而转诊进行人工复核才是最终成为方案一部分的内容，”她解释道。

