    # Deep Blue''s Victory and the Quest for Artificial Intelligence


    But then on 11 May 1997 came remarkable news. IBM’s `Deep Blue` computer had beaten
    the chess grand master and former world champion Garry Kasparov by 3½ games to
    2½. Kasparov had previously bragged that he would never lose to a machine, and
    had indeed beaten `Deep Blue` the year before. But this time he was stunned by
    its play. ‘I’m a human being. When I see something that is well beyond my understanding,
    I’m afraid,’ Kasparov said after he conceded the final game in the series.


    `Deep Blue`’s victory over Kasparov marked a significant moment in the development
    of AI. It catapulted the technology and its capabilities back into the public
    domain. And since then AI has advanced almost exponentially, helped by increasingly
    powerful and lower-cost technology, and further fuelled in the past decade by
    cloud computing, improved hardware and smart new algorithms. Neural networks have
    become deep neural networks, and deep learning has flourished. Today a world without
    it seems unthinkable.


    ## What is intelligence?


    The driving force behind artificial intelligence has always been the desire to
    mimic and improve upon human capabilities. Ever since the phrase was coined in
    Dartmouth during the 1950s, the quest has been on to produce a machine that thinks
    like humans. The loftiest goals of all are to create a system of artificial general
    intelligence (more popularly referred to as `AGI`).


    Depending on who you ask, `AGI` may be a system that’s as smart as a human, or
    one that’s even smarter, and able to complete any task asked of it. There is significant
    debate within AI research communities about what `AGI` might look like and, perhaps
    even more importantly, whether it is actually achievable.


    At the moment, barring a sudden huge AI breakthrough, we’re a long way from an
    all-knowing system that’s able to answer any question, serve humanity’s every
    need, or even take over the world. But arguably, too, we’re still a long way from
    artificial intelligence that possesses even basic intelligence, as we understand
    it. And that raises the question of what intelligence actually is.


    The short answer is that there’s little agreement on the subject. When it comes
    to defining intelligence, experts within and across multiple disciplines, from
    neuroscience and psychology to philosophy, often disagree fiercely. When it comes
    to measuring intelligence, no current system wins universal approval (IQ tests,
    for example, are regarded by many as both limited and problematic). And when it
    comes to applying principles of intelligence to machine learning, interpretations
    vary. ‘I don’t think there’s any real consensus definition of what the intelligence
    in artificial intelligence means,’ says Henry Shevlin, a research associate at
    the University of Cambridge’s Leverhulme Centre for the Future of Intelligence.


    The concept of intelligence is further complicated by the fact that at various
    times in human history it has been weaponised to oppress and harm people. Between
    the eighteenth and twentieth centuries, some scientists claimed that inequality
    in the world was caused by biological differences in intelligence between races.
    Being intelligent was seen as the domain of white Westerners, who used it to drive
    colonialism and as a foundation for racism. Race science has declined since the
    Second World War but, as Angela Saini points out in her book *The Return of Race
    Science*, it is still endorsed by some, largely right-wing, groups.


    In the sphere of AI, the erroneous notion of intelligence being white persists,
    according to Kanta Dihal, a researcher at the Leverhulme Centre for the Future
    of Intelligence. Dihal is working on two projects concerned with our understanding
    of AI: the first is about the narratives people use when referring to AI; the
    second (in collaboration with the centre’s executive director, Stephen Cave) looks
    at decolonising AI. ‘The whole concept of intelligence is usually taken for granted
    in the phrase “artificial intelligence”,’ says Dihal, ‘but what is actually meant
    by the term “intelligence” is extremely political and extremely context-dependent.’
    The peak of intelligence in computer science traditionally involved a machine
    being good at chess. But as Dihal explains: ‘That goes back to the late nineteenth
    and early twentieth century, when measures of intelligence were being instituted
    in order to establish and maintain hierarchies among humans.’


    Defining intelligence within AI precisely, then, is fraught with problems and
    caveats. That said, a useful starting point is the often-used definition arrived
    at by researchers Shane Legg and Marcus Hutter (both are now based at the Google-owned
    AI company `DeepMind`, of which Legg is a co-founder). ‘Intelligence’, they suggested
    in 2007, ‘is an agent’s ability to achieve goals or succeed in a wide range of
    environments’


    In terms of machines, such capabilities at the moment tend to be restricted to
    narrow, rather than general, intelligence. Humans are able to learn from a wide
    set of experiences and apply what they’ve learned to new scenarios. AI can perform
    tasks at the level of humans, or in some cases above, if it’s given enough examples.
    It is, however, specific and narrow. The `Deep Blue` system that beat Kasparov
    was one of the best chess players of all time, but it couldn’t do anything else
    other than play chess. It couldn’t even win at other games, let alone perform
    other, more general tasks. Even today, the AI we have isn’t sophisticated enough
    to do more than one thing. To that extent, young children and animals can be considered
    to have more intelligence or capabilities than our best AIs.


    Take the handling of objects, for example. ‘You can’t get robots to consistently
    manipulate objects in the way that a two-year-old or a three-year-old can interact
    with the world,’ says Chelsea Finn, an assistant professor working on robotics
    at Stanford University. ‘It seems like maybe we’re missing some pretty fundamental
    things about intelligence.’ Finn’s work is partly focused on making robots replicate
    what humans can do, so they can be useful in the real world – the more general
    a robot’s abilities, the more likely it can be used for different tasks. For this
    to happen robots have to understand how objects work in three dimensions, how
    an item can be handled, and what the consequences of moving an object around are.
    ‘I think that if we are able to allow robots to have the skills to interface with
    the physical world,’ says Finn, ‘then there’s a lot of things that they can do
    to help society, whether it be helping with disaster-relief situations, helping
    with things that deal with an ageing population, for example. It’s a really hard
    problem in comparison to other applications,’ she adds.


    If general human abilities are a mark of intelligence, then, AI has a long way
    to go. And if we use the model of human intelligence to understand and depict
    intelligence in machines, this can distort the way we view AI technology. In Western
    culture, dystopian views of AI have focused on its inhumanity, from HAL, in *2001:
    A Space Odyssey*, to Ava in *Ex Machina*, to all the robots in *I, Robot*. Dihal
    points out that Russians generally expected early text chatbots to be as emotionally
    stunted as Arnold Schwarzenegger’s Terminator character.

