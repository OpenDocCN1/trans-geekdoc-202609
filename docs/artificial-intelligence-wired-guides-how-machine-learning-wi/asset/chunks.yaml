    199. iv


    ## 关于作者


    ***WIRED*** 是全球最具权威性和声望的出版物，专注于报道塑造我们世界的新兴趋势、理念与技术。我们的使命是讲述推动这一变革之人的故事，并理解其对商业、社会和个人的影响。*WIRED*
    已成为对这些变革力量及其对行业和个人的意义进行深度明智分析的代名词，并始终是变革的可靠预测者。


    **Matt Burgess** 是 *WIRED UK* 的数字版副主编。


    ## 导言


    人工智能时代已然来临。千禧年以来，在研究实验室孕育了数十年的萌芽技术已悄然渗入我们的日常生活。它或许不像流行文化喂给你的科幻版 AI 那样，但它就在这里。而且它正在给世界带来巨大的改变。


    等到你坐下来阅读这本书，或通过有声版将其“灌注”入耳的那一刻，你当天已经与 AI 进行过多次互动。在绝大多数情况下，你可能未曾意识到它的发生。它如今已在你每天使用的某些产品中无处不在，以至于你几乎察觉不到它的存在。


    你在新闻动态中点赞的 Facebook 帖子之所以呈现在你面前，是因为该公司的 AI 一直在监测你的过往活动，并能预测你最可能点赞的内容。Netflix 向你推送影片和剧集，是因为它早已洞悉你的喜好。当你通过面部识别解锁
    iPhone 时，这是因为 Apple 的算法已绘制了你的面部特征，并将其与存储的人脸印记进行了匹配。


    你进行的每一次 Google 搜索都会呈现由 AI 驱动的结果，这些结果通过抓取整个网络的内容，并按与你搜索内容的相关性进行排序而生成。汽车导航上的地图根据对移动数据的实时理解和对世界的认知，规划出最快路线。而每当你低声唤醒“Alexa”——或者
    Amazon 的智能音箱以为听到了你唤醒词时——AI 就会处理你所说的内容，并给出它计算出的最合适的回应。


    不仅是我们的日常生活正在被改变。在医疗保健和太空探索等截然不同的领域，AI 正从数十年积累的海量数据中学习，以帮助发现新药和寻找新行星。同时，从私营公司到政府等各类组织，正越来越多地利用
    AI 优化运营，减轻人们从事重复性工作的行政负担。


    而我们仍处于 AI 革命的相当早期阶段。在未来十年左右，AI 有巨大潜力彻底改变我们许多最日常的活动——想想自动驾驶汽车和机器人配送——并为世界带来更多益处。该技术将引领打击信用卡欺诈的战斗，帮助检测上传至互联网的儿童性虐待图像，并在网络攻击瘫痪企业之前识别出它们。


    正如所有技术一样，AI 迄今所取得的成就及未来可能达成的成就，都有利有弊。在利好方面，它正在实现民主化。过去 AI 曾是拥有巨大资源的公司的专属，现在只要想上网购买实施工具，任何人都能用得上。最终，毫无技术知识的公司和个人都将能轻松利用
    AI。当然，它也变得日益复杂精湛。


    但也存在潜在问题。目前，我们与 AI 系统的大多数互动后果相对轻微：它们是常规的、（有时）无缝的，且最终会被遗忘。一个无帮助的搜索结果，或几次反复解锁手机的尝试，都不足以让人铭记超过几秒钟。然而，这项技术也可被用来窥探我们、监控我们的一举一动。它拥有威胁我们公民自由、自由权和人权的力量——且在一定程度上已被用于这些目的。因此，警务界对其着迷、各国政府竞相在
    AI 领域称霸，也就不足为奇了。这是一项引发关于权力与控制重大问题的技术。


    也存在种族主义和性别歧视问题。目前 AI 由一小群人开发和控制——主要是在科技公司工作的白人男性。这种缺乏多样性的状况，已对数百万可能受 AI 系统影响的人的生活造成严重后果，并将继续造成。早期的部署已表明，AI
    与各种形式的社会压迫有同流合污的倾向。


    归根结底，AI 可以成为一股巨大的善的力量——它已以深刻的方式改变了世界。但未来十年将至关重要，它将决定这种变革将走多远，以及最终在多大程度上造福社会。本书不仅解释了我们如何走到这一步，还探讨了我们未来可能走向何方。


    # 1


    ## 早期岁月


    我们今天所理解的人工智能，诞生于 1956 年夏天，美国东海岸新罕布什尔州达特茅斯学院一次低调的暑期聚会中。


    为期两个月的时间里，一群计算机科学家在 John McCarthy、Nathaniel Rochester、Claude Shannon 和 Marvin
    Minsky 的召集下齐聚一堂，他们坚信计算机能表现得更像人类，于是讨论如何改进早期机器的能力。“我们将尝试探索如何让机器使用语言、形成抽象和概念、解决目前由人类专属的问题类型，并实现自我完善，”这四位首席研究员在他们于达特茅斯会面的前一年，在一篇论文中如此写道。


    事实上，研究人员对自己的努力感到失望。研讨会未能获得所需的全部资金；受邀者无法就任何通用标准达成一致；且后续工作因参与者各自追求自己的研究而受阻。无论如何，考虑到当时计算机相对基础的状态，达特茅斯暑期项目的目标是不切实际的。“我对在达特茅斯实现通往人类水平
    AI 突破的希望未能实现，”McCarthy 五十年后在一份笔记中写道。


    但研讨会仍产生了影响。在它召开之前，初期的人工智能研究常归类为自动机研究，这可能导致某种支离破碎的方法。然而，在四位研究员的原始提案中，他们首次使用了“人工智能”这一短语。“选择这个术语是为了树立旗帜，”McCarthy
    半个世纪后写道。这一策略奏效了。这个新标签启动了如今已成为数十亿美元产业的事业，McCarthy 本人也被公认为其奠基人。


    '
