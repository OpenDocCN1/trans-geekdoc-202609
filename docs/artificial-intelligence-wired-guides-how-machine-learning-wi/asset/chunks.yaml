  trans: '

    # 自然语言处理：AI 进步的前沿


    在 AI 领域中，自然语言处理取得了巨大进步。如今，机器能够以超人的速度和准确性与人类交流并理解我们发送给它们的信息。这对改善呼叫中心的客户服务具有巨大潜力，但该技术也对整个社会有着深远影响。以更自然的方式与计算机——以及人类——互动的能力，对社会、文化和经济问题都具有潜在的广泛影响。


    除第一句外，您刚读到的这段文字并非由我撰写。它是由 AI 生成的。虽然它可能不够完美，但确实展示了自然语言处理（NLP）领域自 20 世纪 50 年代建立以来取得了多大的进步。NLP
    涵盖了从语言翻译到撰写作品摘要的一切内容，如今 NLP 技术是聊天机器人、Siri、Alexa 以及手机自动补全系统的核心。


    ## 语言模型的规模


    可以说，没有哪个 AI 领域像 NLP 这样从大数据中获益良多。研究人员创建的语言模型规模简直是**巨大**的。例如，上面由 AI 生成的段落就来自拥有 110
    亿个参数的 `Megatron-11b` 语言模型。但这只是九牛一毛。2020 年年中，总部位于旧金山的 AI 实验室 OpenAI 发布了其文本生成系统的最新版本：`GPT-3`。它包含了惊人的
    1750 亿个参数。


    `GPT-3` 或许是有史以来最复杂的语言模型。向系统输入文本——无论是几句话还是几段落——它都能以一种几乎与人类创作的散文无法区分的方式续写。如果告知其应生成的写作风格，它能复刻该风格。`GPT-3`
    可以模仿威廉·莎士比亚——或任何历史人物——的笔触；它能创作虚构文学，并已被实验性地用于内容审核。它还被用于编程。一位开发者构建了一个网页布局生成器，只需给出特定设计的文字描述，即可自动生成创建该网页的代码。另一位开发者利用它创建了一个搜索引擎，能够回答用户提出的问题。


    > “结果相当真实，因为它预先了解各类主题，且经过海量数据训练，”正在利用 `GPT-3` 构建 AI 邮件回复程序和营销文案撰写系统的研究人员 Samanyou
    Garg 表示。“据我测试，它擅长撰写文本——可以是文章、博客文章，也可以是生成营销素材。”


    与所有深度神经网络一样，该文本生成系统通过寻找其训练数据中的模式，并建立单词与其用法之间的联系来工作（在 `GPT-3` 的案例中是通过无监督学习）。当您向其中输入提示——例如本节的第一句话——它本质上是在猜测接下来应该出现什么词。不过，这些并非随机猜测：它们基于对最可能跟随的单词的明智计算。


    ## 局限性与风险


    该系统远非完美。问它一个愚蠢的问题，它会编造答案。它偶尔会冒出一些讲不通的句子。它有可能被用来制造假新闻和虚假信息，供那些想要破坏社会稳定的人利用。还有危险在于，它可能复现其学习数据中包含的人类偏见。Facebook
    AI 负责人 Jerome Pesenti 在推特上发布了例子，展示 `GPT-3` 在收到单词提示（如“犹太人”或“#blacklivesmatter”）后，输出了种族主义和性别歧视的侮辱性语言。


    话虽如此，让 AI 研究人员对 `GPT-3` 兴奋的是它所代表的质变。在早期迭代中它拥有 15 亿参数，随后是 1170 亿，最终达到了目前的 1750
    亿。每次升级，其效果都大幅提升。这表明，单纯增加输入此类系统的数据量，就可能让 AI 更接近通用智能。


    ## 竞争模型与全球化拓展


    `GPT-3` 并非唯一的选择。另外两个重要的自然语言处理模型分别来自 Google（其模型称为 `BERT`）和中国的“谷歌对标者”百度（其模型称为 `ERNIE`）。这种戏谑的命名既代表了开发
    AI 的大型科技公司之间的某种竞争关系，也体现了彼此的熟悉程度。Google 和百度都拥有庞大的资源和互联网知识储备。它们也都成功地将深度学习应用于翻译。


    直到现在，绝大部分 NLP 研究都集中在英语上。这必然意味着，世界上大片地区未能从 NLP 模型和进步中受益。例如，尽管非洲幅员辽阔、全球重要性巨大，且该大陆拥有
    2000 多种语言，但它在 NLP 领域几乎鲜有身影。幸运的是，Masakhane 项目正试图改变这一现状。该项目汇聚了来自 30 个不同非洲国家的约 400
    名 AI 研究人员，已产出覆盖 38 个以上国家的 49 个不同翻译项目，构建了新的数据集和训练模型，并发布了研究成果。在此过程中，它也克服了自身的挑战。参与研究者之一
    Bonaventure Dossou 表示，在为贝宁共和国通用的 Fon 语构建数据集的过程中，他不得不创建一个能够正确输入该语言的键盘。“当地艺术家[现在]实际上能够用
    Fon 语写下歌词了，”他说。


    认为增加翻译模型支持的语言仅服务于当地利益是错误的。事实上，这能惠及所有人。百度员工发现，随着更多特定语言被添加、学习和翻译，其 AI 对语言的整体理解能力也在提升。“建立不同语言之间的关联映射是这一过程的关键组成部分，”公司发言人表示。截至
    2020 年，该公司的翻译工具支持 200 多种语言，日翻译量达 1000 亿字符。“在开发基于深度学习的神经网络翻译模型时，我们发现，尽管语言在符号和语法上存在巨大差异，但它们在语义上可以非常相似，”发言人继续说道。“在许多层面上，无论人类使用何种语言变体进行交流，其对世界的认知、描述和表达都是一致的。”


    ## 数据与能源挑战


    目前处理的数据量令人咋舌。例如，OpenAI 发布的一篇关于 `GPT-3` 的研究论文显示，团队起步于研究者可用的 Common Crawl 数据集。


    其他数据来自版权已过期的历史书籍，以及从整个网络抓取的信息。数百万个网页及其文本被抓取。事实上，您在英语互联网上遇到的任何类型的文字，很可能都已被纳入该模型（OpenAI
    并未披露其训练 `GPT-3` 所用信息的完整规模）。


    但这里存在一个问题——这适用于所有深度学习。处理如此大量的数据需要消耗巨量能源。OpenAI 承认其模型消耗了“大量资源”，但未透露潜在的环境影响或成本。未经证实的估算认为训练能源成本高达
    1200 万美元。无论真实数字几何，毫无疑问，更大的数据集正在到来，且将按比例消耗更多能源。艾伦人工智能研究所的研究估计，2012 年至 2018 年间，深度学习研究所需的计算量增加了
    30 万倍。


    '
