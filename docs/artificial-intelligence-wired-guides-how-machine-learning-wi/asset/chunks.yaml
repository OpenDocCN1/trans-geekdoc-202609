    # 监控技术的隐私与伦理挑战


    ## 隐私问题与面部识别


    存在隐私问题。闭路电视摄像头现在无处不在，我们对它们安装的位置或其图像的使用方式几乎没有发言权。随着时间的推移，它们可以升级为使用面部识别技术。警方声称面部识别可以让我们的生活更安全，并且是打击犯罪的重要武器。但这些优势必须与公民自由考量相平衡。在英国，有几人因决定遮住脸部而不是接受监控技术扫描而被拦截盘问。一名青少年在已被法院处理后仍被拦截（此处归咎于一个过时的数据库）。


    ## 国家层面的监控实践


    或许在国家层面，监控世界的利弊最为明显。当然，也是在国家层面，其权力的真实范围最为清晰。以印度在 2020 年 4 月新冠疫情早期几周使用监控 AI 为例。随着第一波疫情蔓延，德里和孟买的警方派出无人机监控人员，以执行全国封锁令和改善社交距离（孟买的一家本地初创公司捐赠了
    45 架无人机提供协助）。机载摄像头拍摄了潜在非法集会的画面，扩音器播放命令人群解散的信息。实时观看视频的警察可调派警力前往最需要的地方。


    与此同时，在旁遮普邦第二大城市阿姆利则，空中监控得到了强化。初创公司 Skylark Labs 派出无人机，利用计算机视觉精确检测人们站立的距离（如果距离足够远，他们周围会出现绿色边界框；如果太近则出现红色边界框）。Skylark
    首席执行官 Amarjot Singh 解释道：“有一个映射算法，将整个城市的地图划分为十个网格，我们只需告诉他们（警察）想在哪些网格飞行——无人机就会自动起飞并在该网格飞行。如果检测到人类，会标记该人类，并向靠近该区域的警官手机发送消息。”该系统随后推广到另外六个城市。最终开出了两百张罚单，并扣押了一些汽车。该技术的使用为政府控制公民树立了令人担忧的新先例——人们的行为正被从上方悄悄注视。


    印度并非唯一由州和地方政府部署此类侵入式监控的国家。卡内基国际和平基金会民主、冲突与治理项目高级研究员 Steven Feldstein 表示：“尝试采购、购买和投资这些系统的国家比我预期的要多。”他进行了首次关于
    AI 监控（智慧城市系统、面部识别和智能警务设置）在全球如何使用的评估。据他估计，到 2020 年夏天，179 个国家中有 77 个正在部署此类技术。


    ## 技术范围与野心的扩大


    技术的范围和野心正在增长。现在可以通过虹膜、纹身、行走方式（步态识别技术）等识别人员。很快将无处可藏。中国和英国的研究人员构建了一个系统，能够在数周内识别人员，即使他们更换了衣服和发型。


    一些当局对这些进展持谨慎态度。在美国，一些州已禁止面部识别系统，俄勒冈州波特兰市采取了最彻底的禁令（甚至企业也不得使用该技术）。据报道，欧盟也在考虑类似限制。而在印度等国家，该技术的控制力却日益增强。官员们吹嘘该技术在识别
    2020 年 2 月德里暴力骚乱中涉及的 1100 人方面发挥了关键作用，骚乱持续了两天。当被问及无辜者被摄像头监控时，印度政府部长 Amit Shah 据报道称：“这是一个软件。它不看信仰。它不看衣服。它只看脸，通过脸抓住人。”


    ## 中国：极端的测试案例


    构成该技术最极端测试案例的国家是中国。没有其他国家像这个共产主义超级大国那样热衷于追求监控系统。它常规性地收集海量公民数据，并广泛实施面部识别技术。Steven
    Feldstein 表示：“中国模式相当独特。没有其他国家在复制甚至渴望实施全面监控方面真正接近他们所做的。”该国也是全球最大的 AI 监控技术出口国。Feldstein
    估计，华为、海康威视、大华和中兴向 63 个国家提供技术。仅华为一家就向 50 个国家提供技术——远超第二大非中国公司、日本的 NEC（用于 14 个国家）。


    ## 电梯监控研究：反乌托邦的前景


    一项由上海研究院研究人员进行、于 2020 年 6 月发表的研究，让人窥见如果技术不受约束，反乌托邦的未来可能是什么样子。该研究利用安防摄像头网络及其他传感器（测量移动、温度等），覆盖中国
    10 万部电梯，将数据输入多个算法以帮助判断人们的行为何时不“正常”。


    每次电梯停靠一层楼，就会拍摄一张照片。研究人员在论文中称：“10 万部电梯每层楼约有一百万条记录。”总体检测到 643 起潜在异常行为。其中 100 多起归因于设备错误，或来自网络上非住宅楼电梯的安防摄像头图像（如商场电梯或办公楼摄像头）。在
    289 起案例中，研究人员判定“存在异常”，建议楼宇管理员进一步调查细节。研究称，3 起标记事件似乎显示有人在公寓经营餐饮服务；6 起事件暗示拥挤。


    尽管运行规模巨大，但该系统相对初级。它非实时运行，且收集数据量巨大，导致研究人员未分析人员年龄和可能职业。但潜力已现。这种潜力——不仅能检测不法行为，还能窥探和控制无辜者——对日常生活的方方面面都有令人担忧的影响，从家庭日常惯例到监控工作效率并设定目标，再到在商店和机场监视我们。


    ## 维吾尔族监控案例


    批评中国政权者会指出的一个镇压性大规模监控实例，涉及该国以穆斯林为主的少数民族维吾尔族。《纽约时报》报道，在一个地区，仅 2019 年一个月内，面部识别就被用了
    50 万次，以筛选经过摄像头的人是否为维吾尔族。


    # Deepfakes


    2017 年底，一位匿名 Reddit 用户改变了网络世界。该用户以“deepfakes”为化名发帖，开始分享名人的色情视频，利用深度学习将原表演者的面部替换为名人的面部。Taylor
    Swift、Gal Gadot、Maisie Williams 和 Scarlett Johansson 只是受害者中的一部分。从那时起，Deepfakes
    的影响力已变得深远。

    '
