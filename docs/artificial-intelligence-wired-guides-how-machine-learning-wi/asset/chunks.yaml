- raw: 'The colonial nature of AI takes various forms. It’s embedded in its algorithmic
    discrimination, which allows an unequal real world to be reflected in an unequal
    virtual one. It runs through the sector’s hiring practices. It involves the widespread
    use of low-paid labour in relatively poor parts of the world among those at the
    beginning of the AI production chain who prepare data for training. People benefit
    financially from the jobs they do, of course, but it’s questionable whether their
    communities are likely to benefit from the technologies they’re helping to create.
    And then there’s the fact that AI governance rules tend to be set by richer countries.
    Mohamed, Png and Isaac highlight a global review of AI ethics guidelines that
    found Africa, South and Central America and Central Asia to be absent from discussions.
    They also point out that AI systems can be beta-tested in countries where data
    protection laws aren’t as strong as they are in, say, the UK or Europe.


    Such systemic injustices are manifested in individual experiences: people who
    have been under-paid for the job they do, or not received the job promotion they
    deserved, or been treated disrespectfully by colleagues. Recent years have seen
    thousands of Google employees protest at their companies’ handling of sexual harassment
    allegations against senior executives and failing to properly investigate discrimination
    claims, in addition to hundreds of Microsoft employees claiming they had been
    victim to harassment and discrimination while at work. In December 2020, leading
    AI ethics researcher Timnit Gebru said Google fired her and accused the company
    of being ‘institutionally racist’ after it took issue with an academic paper she
    co-authored.


    ‘Diverse’ and ‘representative’ means also taking account of the more than one
    billion people around the world who live with disabilities. AI has helped create
    new forms of accessibility – for example, computer vision apps that can ‘see’
    for people. But there is a long way to go to before it’s truly inclusive. ‘I think
    the most important step in inclusive AI is involving people with disabilities
    at all stages,’ says Mary Bellard, the principal innovation architect and AI for
    Accessibility program lead at Microsoft. Such inclusion involves more than testing
    products on people with disabilities. It has to include hiring technologists with
    disabilities, too. ‘Sometimes there is this concept of building technology “for
    people with disabilities”, instead of “with or by people with disabilities”, and
    there is an important distinction between those two ideas,’ Bellard says.


    But there are people and organisations around that are trying to change things.
    One such is Tess Posner’s AI4ALL, the US non-profit set-up that is seeking to
    get more young women and BAME people interested in AI. Among its initiatives are
    summer camps for high-school students. ‘We hear a lot of things like, “I’m the
    only person at my school who looks like me who’s interested in this,” or “I never
    thought I can go into this field because I don’t see anyone like me in the field,”’
    says Posner. The summer camps are designed to introduce such students to AI role
    models. PhD students and experts from big technology firms explain the main principles
    of AI: the types of machine learning, how to use the programming language Python,
    the importance of datasets within AI. AI4ALL also provides open-sourced AI teaching
    resources to high-school teachers around the US, targeting them at lower-income
    schools, which may not typically have the money to invest in computer science-specific
    education for their students. Posner aims to get the teaching resources translated
    into other languages so they can be disseminated more widely both within and outside
    the US.


    AI Now’s diversity report looks at ways in which the technology industry in general
    and AI in particular can make changes. It argues for the publication of pay levels,
    including bonuses and all other payments, across all roles and jobs, broken down
    by race and gender. It pushes for pay equality to be established to ensure people
    are being properly compensated for the work they’re doing, and for the promotion
    of currently under-represented groups to be built into company targets. It also
    demands that harassment and discrimination transparency reports should be published.
    Perhaps most crucially, it campaigns for a shake-up in the way people are recruited,
    suggesting that initiatives should be set up to reach out to non-elite universities,
    and that better ways should be found to allow contractors, temporary staff and
    freelancers to become full-time employees. Hiring practices and conditions should
    also be made transparent, so that everyone knows how individuals are hired, paid
    and promoted. Responsibility for all this begins with senior management. ‘Those
    at the top of corporate hierarchies have much more power to set direction and
    shape ethical decision-making than do individual researchers and developers,’
    says AI Now’s report.


    ### Transparency and regulation


    Joy Buolamwini has shown accountability in AI can lead to change. In 2015 the
    graduate student of MIT’s Media Lab was sitting at her laptop, trying to get the
    generic face-tracking software she was using to work. The problem was that it
    wouldn’t. It was supposed to project digital artwork onto her face, but it couldn’t
    ‘see’ her. When, however, her friend sat in front of the cheap laptop webcam the
    system automatically sprang to life. The reason? Buolamwini is black. Her friend
    is white. Once Buolamwini donned a white mask, the software instantly spotted
    her.


    This wasn’t the first time Buolamwini had encountered the discrimination arising
    from algorithms trained mostly on images of people with white skin. She had once
    tried to teach a robot how to play peek-a-boo. It didn’t respond. Again, she was
    invisible.


    Five years after Buolamwini sat in front of her webcam, her research has changed
    how facial-recognition technologies are developed, and brought the issue of selection
    bias in training data to general awareness. Her 2018 MIT thesis, ‘Gender Shades’,
    which was co-authored by Timnit Gebru, audited the performance of facial-recognition
    systems from IBM, Microsoft and Chinese firm Face++, and offered a stark wake-up
    call.


    What she showed was that, overall, the systems were worse at recognising people
    with darker skin than they were at recognising those with lighter skin. Microsoft
    performed best, but even so, its 87.1 per cent accuracy for darker-skinned people
    compared poorly with its 99.3 per cent accuracy for lighter-skinned subjects.
    The margin of difference in IBM’s software was 19.2 per cent. And when gender
    was introduced, accuracy rates dropped further. Both IBM and Face++ recognised
    darker-skinned females correctly only 65 per cent of the time. Microsoft was slightly
    better at 79 per cent. For lighter-skinned females all three sets of software
    scored above 92 per cent. The differences in performance were as high as 34 per
    cent.


    Follow-up research a year later – called ‘Actionable Auditing’


    By holding opaque algorithms and their creators to account, the hugely influential
    ‘Gender Shades’ and follow-up study have shown a way forward. They have very publicly
    exposed the failures of existing AI systems and led to a much-needed public debate,
    not just about how facial-recognition systems operate, but about how they should
    be used. Buolamwini has appeared before legislators, policymakers and police officials
    to explain how the discriminatory practices worked, and how her audits uncovered
    them. Her work has directly contributed to greater scrutiny of facial-recognition
    systems. It’s also led to them being banned in a number of US states. In June
    2020, Amazon, IBM and Microsoft all committed, at least temporarily, to stop selling
    facial-recognition software to police, following global protests about systematic
    racism and the killing of George Floyd at the hands of Minneapolis police.'
