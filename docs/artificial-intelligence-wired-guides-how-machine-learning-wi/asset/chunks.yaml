    # Natural Language Processing: The Frontier of AI Progress


    One area of AI in which huge progress has been made is natural language processing.
    Today, machines can communicate with humans and understand the messages we send
    them with superhuman speed and accuracy. This has tremendous potential for improving
    customer service in call centres, but the technology also has implications for
    society at large. The ability to interact more naturally with computers – and
    humans – has potentially wide-reaching implications for social, cultural, and
    economic issues.


    With the exception of the first sentence, the paragraph you’ve just read wasn’t
    written by me. It was written by AI. It may not be absolutely perfect, but it
    does demonstrate how far the world of natural language processing (NLP) has advanced
    since it was established in the 1950s. Encompassing everything from language translation
    to creating summaries of written works, these days NLP technology is at the heart
    of chatbots, Siri, Alexa and autocomplete systems on phones.


    ## The Scale of Language Models


    Arguably, no field in AI has benefited from big data quite as much as NLP. The
    size of the language models created by researchers is, quite simply, colossal.
    The AI-generated paragraph above, for example, came via the `Megatron-11b` language
    model, which has 11 billion parameters. But that’s just a drop in the ocean. In
    the middle of 2020, the San Francisco-based AI lab OpenAI released the latest
    version of its text generation system: `GPT-3`. It contained a staggering 175
    billion parameters.


    `GPT-3` is perhaps the most sophisticated language model ever. Feed the system
    text – be it a couple of sentences or paragraphs – and it will be able to continue
    the passage in a way that’s almost indistinguishable from prose created by humans.
    If it is told about the style of writing it should produce, it can replicate that
    style. `GPT-3` can write as William Shakespeare – or indeed any historical figure
    – would have done; it can write creative fiction, and has been experimentally
    used for content moderation. It’s also been used for coding. One developer built
    a layout generator for a web page that, once given a written description of a
    particular design, could automatically generate the code to create it. Another
    developer used it to create a search engine that could answer questions asked
    of it.


    > ‘The results are pretty authentic because it knows about topics beforehand and
    has been trained on so many things,’ says Samanyou Garg, a researcher building
    an AI email-answering programme and a system to write marketing copy using `GPT-3`.
    ‘From what I have tested, it is really good at writing text – that could be articles,
    it could be blog posts, or it could be generating some marketing material.’


    As with all deep neural networks the text-generating system works by finding patterns
    in the data it has been trained on, and making connections between words and how
    they are used (in `GPT-3`’s case through unsupervised learning). When you type
    a prompt into it – such as the first sentence of this section – it essentially
    guesses what words should come next. These aren’t random guesses, though: they
    are based on an informed calculation of the likeliest words to follow.


    ## Limitations and Risks


    The system is far from perfect. Ask it a dumb question and it will make up any
    answer. Every now and again it will throw in sentences that make little sense.
    There’s the chance it can be used to produce fake news and misinformation for
    those wanting to disrupt society. There’s also the danger of it reproducing the
    human biases in the data it has learned from. Jerome Pesenti, the head of AI at
    Facebook, tweeted examples of racist and sexist slurs that `GPT-3` put out after
    it was given one-word prompts (such as ‘Jews’, or ‘#blacklivesmatter’).


    That said, what excites AI researchers about `GPT-3` is the step change it represents.
    In an earlier iteration it had 1.5 billion parameters, then 117 billion, before
    it achieved its current 175 billion. Each time it was upgraded, its results improved
    massively. This suggests that simply increasing the amount of data fed into such
    systems could move AI closer to general intelligence.


    ## Competing Models and Global Expansion


    `GPT-3` is not the only game in town. Two other significant natural language processing
    models come from Google (its model is called `BERT`) and China’s Google equivalent,
    Baidu (its model is called `ERNIE`). The tongue-in-cheek naming represents both
    some of the rivalry and familiarity between big tech companies developing AI.
    Both Google and Baidu have huge resources and knowledge of the internet at their
    disposal. They’ve also both successfully used deep learning for translation.


    Up until now a vast proportion of NLP research has been focused on the English
    language. Inevitably, this means that large areas of the world have not been benefiting
    from NLP models and advances. Africa, for example, has scarcely figured, despite
    its size, huge global importance and the fact that the continent embraces more
    than 2,000 languages. Fortunately, the Masakhane project is trying to change that.
    Calling on the skills of a community of around 400 AI researchers from thirty
    different African countries, it has produced 49 different translation projects
    from more than 38 countries, built new datasets and training models, and published
    its research findings. In doing so, it’s had its own challenges to overcome. Bonaventure
    Dossou, one of the researchers involved, said that during the process of building
    a dataset for the Fon language, spoken in Benin, he had to create a keyboard on
    which it could be properly typed. ‘Local artists actually are [now] able to write
    down the lyrics of the songs in Fon,’ he says.


    It would be wrong to think that adding more languages to translation models simply
    serves local interests. In fact, it can benefit everyone. Staff at Baidu have
    found that their AI’s understanding of language in general increases as more specific
    languages are added, learned and translated. ‘Mapping any correlation between
    different languages is an essential component to this process,’ says a spokesperson
    for the company. As of 2020 the company’s translation tool supported more than
    200 languages and was translating 100 billion characters a day. ‘While developing
    a deep learning-based neural network translation model, we discovered that although
    languages have huge differences symbolically and grammatically, they can be very
    similar semantically,’ the spokesperson goes on to say. ‘On many levels, human
    cognition, descriptions and expressions of the world are consistent no matter
    what variation of languages they communicate in.’


    ## The Data and Energy Challenge


    The amount of data now being crunched is eye-watering. A research paper about
    `GPT-3` released by OpenAI, for example, shows that the team started with the
    Common Crawl dataset that’s available to researchers.


    Other data was pulled from historical books that are out of copyright and from
    information drawn from across the web. Millions of web pages and their text were
    scraped. In fact, any type of writing that you’ve come across on the English-language
    internet is likely to have been included within the model (and OpenAI hasn’t revealed
    the full scale of the information it drew on to train `GPT-3`).


    But there’s a problem here – and it’s one that applies to all deep learning. Processing
    such vast quantities of data involves the expenditure of enormous amounts of energy.
    OpenAI admitted as much when it said that its model consumed ‘significant resources’,
    although it didn’t reveal the potential environmental impact or cost. Unconfirmed
    estimates put the energy costs of training as being up to $12 million. Whatever
    the true figure, it’s unquestionably the case that larger datasets are on their
    way, and that they will consume proportionally more energy. Research from the
    Allen Institute for AI estimated that there was a 300,000 times increase in the
    computations needed for deep-learning research between 2012 and 2018.

