- raw: 'The day when fully self-driving vehicles are being used commercially at scale
    is, however, still some way off. There are legal questions to be overcome. Who
    is at fault when a fully autonomous car crashes? Is it the hardware or software
    maker? There are practical issues. How will it work when, say, 50 per cent of
    all vehicles on the road are autonomous and the remainder are driven by humans
    who refuse to embrace the technology? And there are the inevitable trust and safety
    questions. Can a machine make the right decision every time? How safe can it really
    be?


    Fatal accidents involving semi-autonomous cars are certainly not unknown. In March
    2018, for example, an Apple employee who was using one of Tesla’s semi-autonomous
    driving features died after his car smashed into a concrete barrier. The US National
    Transportation Safety Board investigated and ended up pinning the blame on both
    driver and vehicle.


    Google’s Waymo has released some details about the number of crashes its self-driving
    vehicles have been involved in over the course of journeys totalling 9.8 million
    kilometres


    Such a diagnosis would appear to confirm the view of proponents of self-driving
    technology that it is actually safer than conventional transport. After all, millions
    of people die in regular car crashes around the world every year. Jack Weast says
    that Intel’s approach when it comes to safety is to use a deterministic approach
    – rather than a machine basing its decisions on how much of a probability the
    AI thinks things will happen. ‘It’s like a checker on the decisions that the AI
    is recommending, so when, inevitably, this probabilistic algorithm recommends
    something that might not be good for safety, we have a deterministic way to check
    is that a safe action or not,’ he says.


    Self-driving cars certainly do have some big advantages over humans. They are
    able to sense things around them faster, and are able to look in all directions
    at once. Their reaction times are also faster. And they don’t get tired. ‘The
    single thing that we screw up as humans is we lose concentration,’ says Paul Newman.
    ‘We just get distracted. And that’s the single thing a machine won’t do. How many
    accidents are caused by fatigue and stupid stuff?’


    Moreover, self-driving cars can learn from each other. Oxbotica’s AI systems that
    underpin how its vehicles operate are refreshed every night. All the new data
    and new scenarios that the vehicles have found themselves in – both in the real
    world and in virtual simulations – can be added to the systems’ knowledge. In
    one day hundreds of hours of new experiences and knowledge can be added to a vehicle’s
    understanding of how to drive. Every car can have the experience of every other
    car – and when there are thousands or millions of vehicles operating each day
    this pooled understanding grows exponentially.


    Technologists believe the way machines like this can function in the real world
    is through explaining to people how they actually work and the benefits they can
    have. ‘We need to move away from saying these things are somehow spooky and not
    explainable,’ adds Newman. ‘They are engineered pieces of software, there is process
    around them and we can say how we expect them to behave.’


    # 4


    ## AI’s pitfalls


    Between 2015 and 2020 people applying for visas to enter the United Kingdom to
    work, study or visit loved ones would fill in the paperwork in the usual way,
    and that data would then be handed over to an algorithm to assess. It would give
    them a rating: red, amber or green. Of those being assessed as green 96.3 per
    cent were waved through. Those marked as red – the ‘riskiest’ category – weren’t
    automatically rejected, but were subject to further checks, with senior staff
    being brought in to check the data and make a final decision. This partially automated
    process, run by the Home Office, ultimately approved 48 per cent of red applications.
    Those using it trusted its decisions.


    But there was a problem. Although the intention behind the system was laudable
    – to make visa applications faster, more efficient and less bureaucratic – the
    underlying technology, known as the streaming tool, was flawed. It was plagued
    with data, transparency and process problems that resulted in unfair decisions.
    In particular, it judged people to be high-risk on the basis of their country
    of origin rather than on carefully considered personal criteria. ‘They kept this
    list of undesirable nations where simply by making an application coming from
    a particular country – and they refused to give us the name of the countries –
    that person would be more likely to be streamed amber or red,’ says Cori Crider,
    the founder of legal group Foxglove.


    In the spring of 2020 Foxglove challenged the algorithmic process, arguing that
    it broke equality and data protection laws. Days before the case was due to reach
    court the UK government scrapped the tool, admitting it needed to scrutinise ‘issues
    around unconscious bias and the use of nationality generally in the streaming
    tool’. However, it rejected the suggestions that the system was breaking any laws.


    Months later, in the midst of the coronavirus pandemic, a similar algorithm attempted
    to predict English students’ A-Level exam grades. It, too, used historical data
    to make decisions about individuals’ futures. It, too, was flawed. Widespread
    protest ensued, with students taking to the streets and chanting ‘Fuck the algorithm’.


    Neither system involved particularly complex algorithms – and neither used artificial
    intelligence. But what they both demonstrate is the inherently risky nature of
    data. Whatever we might be tempted to assume, it is rarely, if ever, neutral.
    Since it is ultimately created by humans, it captures our prejudices. The visa
    system was founded on data that made biased assumptions about people’s countries
    of origin. The exams system predicted results based in part on the previous track
    record of individual pupils’ schools. Both are warnings for the future.


    ### Bias


    Since data lies at the heart of AI, it follows that AI is not free from prejudice.
    Bad data put into a system results in bad data outputs. There are three common
    forms of bias – although research has identified more than 20 types of bias, plus
    other types of discrimination and unfairness that can be present in AI setups.
    With *latent bias*, an algorithm correlates its results with such characteristics
    in the data as gender, race, income and more, so potentially perpetuating historical
    forms of bias: for example, a system may ‘learn’ that doctors are male because
    the historical data it has been trained on shows doctors as being male. (Amazon
    had to scrap an AI hiring tool it was using, which was trained upon ten years
    of CV data, as the system surmised that since men had historically been hired
    more often than women, they must be better.) With *selection bias* results are
    distorted by a dataset that over-represents one group of people. (An AI created
    to judge a beauty contest selected mostly white winners, as the dataset it was
    trained upon mostly contained images of white people.) With *interaction bias*
    a system learns from the prejudices people display when they interact with it.
    (Microsoft’s chatbot, Tay, which was launched on Twitter in 2016, became more
    coherent within its first twenty-four hours of use, but also repeated all the
    sexist and racist language people had sent its way.)'
