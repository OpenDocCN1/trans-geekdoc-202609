- raw: 'Hernández-Orallo’s prognosis is that we will reach a middle ground between
    AI and ‘complete’ AGI where systems exist that possess much greater knowledge
    than people do for a wide range of tasks, but don’t know everything. To solve
    new problems, they will require more data which will have to be obtained by their
    human owners. ‘To me, AGI is a system that has a general ability, which means
    that it can learn any possible skill, some of them easier than others, as happens
    with us,’ he says. ‘That doesn’t mean that the system is superintelligent. But
    that’s going to be transformative.’


    Whatever form of AGI is ultimately achieved, practical and ethical questions arise.
    How safe will it be to rely on the decisions made by AGI, given that we won’t
    understand by what steps it arrived at those decisions? How do we decide when
    to employ AGI and when to rely on humans? ‘There are thousands of clever people
    working in AI research. They can probably carry out their research and development
    without a definition of AGI,’ says Ragnar Fjelland, a professor at the University
    of Bergen.


    > What they should keep in mind, however, is not just the question of what computers
    can do, but also the question of what computers should do. This question includes
    ethical considerations. Sometimes it is right to replace humans by technology.
    However, the basic attitude should be that technology should improve the human
    condition, and not replace humans.


    One point most AI researchers do agree on is that if AGI is ever created, it won’t
    be for a very long time. Of the 352 machine-learning researchers asked in a 2017
    survey when they believed human-level machine intelligence could be achieved,
    a mean of 50 per cent gave the chance of the milestone being achieved as being
    45 years away.


    Such unwillingness to put one’s reputation on the line is hardly surprising when
    something as vague as AGI is involved. If nobody can agree what it is, then it’s
    impossible to know what tools will be needed to create it and whether they already
    exist or will need to be invented. If more technological breakthroughs are required
    – as seems likely – there’s no guessing when these might occur. And even if some
    form of AGI is achieved, people will doubtless disagree whether what has been
    created really is AGI. When Google claimed in 2019 that it had achieved quantum
    supremacy – the ability to use a computer operating according to the principles
    of quantum mechanics to complete a task faster than a traditional computer – its
    rival IBM contested its results and argued that quantum supremacy doesn’t really
    matter anyway.


    The AI systems we already have are far from mastering their current learning approaches,
    and are not able to perform tasks that are different from the one they are trained
    on. There’s a long way to go before humans will achieve an AI that’s general and
    that can work across many different domains.


    But there’s still plenty of progress to be made with the technology we currently
    have. AI is already transforming and disrupting the world around us. It’s throwing
    up all sorts of challenges. There are ethical, societal and technical issues that
    need fixing with the systems we have right now. Those building AI need to take
    responsibility for their creations. They need to ask whether the systems they
    are making are improving the world around us and if they are likely to be abused
    by those with malicious intents. They should speak to the people their technology
    impacts and understand what difference it makes. The deployment of AI needs to
    work for everyone. The pursuit of AGI shouldn’t distract from that.


    ## Glossary


    ##### AGI (artificial general intelligence)


    An AI system that can think like a person, learn new tasks and understand the
    world as a human does. General intelligence is the goal of much AI research.


    ##### Computer vision


    A computer’s ability to ‘see’ via image recognition, object detection and classification,
    or object tracking. Computer vision can be used to process photos, recorded video
    and real-time footage.


    ##### CPU (central processing unit)


    A computer chip that makes the calculations that tell a device how to operate.
    Containing billions of transistors, CPUs are adept at running some AI algorithms.


    ##### Deep learning


    The subset of machine learning that uses multiple layers of neural networks to
    learn from data. Deep learning has been the biggest accelerator of AI use since
    the turn of the twenty-first century.


    ##### GAN (generative adversarial network)


    AI that uses both supervised and unsupervised learning to generate new data based
    on previous data it has seen. The process has been used to create fake faces and
    produce AI-generated artwork.


    ##### GPU (graphics processing unit)


    A graphics chip, originally developed for gaming, that has become favoured in
    AI as it has greater processing power than a CPU and so can speed up the training
    process. It’s particularly useful for image recognition.


    ##### Neural network


    A network, loosely modelled on the make-up of the brain, which facilitates machine
    learning. Calculations and predictions are made within each layer of the network.


    ##### NLP (natural language processing)


    A way for computers to understand and use human language. This can include machine
    translation between languages, document summaries, speech-to-text conversion (and
    vice versa), and sentiment analysis.


    ##### Reinforcement learning


    An algorithm that is given a clear goal – for instance, winning at a game – which
    it then attempts to reach through trial and error. Each time it does something
    that works it’s rewarded; when it fails it may be penalised.


    ##### Supervised learning


    The most common type of AI process. A supervised learning system makes predictions
    about information it hasn’t seen before. To make those predictions, it is first
    shown previous examples of the problem it is trying to solve. Supervised learning
    is often used for image-recognition tasks.


    ##### Unsupervised learning


    A learning system that looks for patterns in data that it has no previous knowledge
    of. Unlike supervised learning, unsupervised learning does not involve training
    with previous examples. It is useful for finding structure and classifying large
    amounts of data.


    ## Acknowledgements


    Anything created in this world isn’t the product of one person – this book is
    no exception. While I have covered the growth of artificial intelligence – from
    its use within everything from healthcare to cybersecurity – at WIRED for more
    than five years, my knowledge of the decades-old industry still only scratches
    the surface. I am indebted to the expertise of others for the production of this
    book.


    During my time at WIRED, the use of AI has grown exponentially and it now it seems
    as though society is at a true tipping point. The technology has crept into mainstream,
    daily use and will increasingly be set to work tackling new tasks in more areas
    of our lives. The promise of AI is hugely exciting: it has the potential to upend
    many of our daily activities and unlock new secrets about our planet (and beyond).
    It’s not at all inconceivable to imagine AI reshaping the world as we know it.
    Despite this promise, there is still a lot of work to be done. We need to make
    sure the use of AI is fair, responsible and inclusive. Nobody should suffer because
    of the use of an AI system.


    Thankfully, there are many immensely gifted and brilliant people working on the
    development of AI – both on ways to improve the world and making sure that AI
    works for everyone. During the course of reporting for this book many of these
    people spared their time and shared their deep expertise with me and I am truly
    grateful to them for doing this (particularly those who, during the height of
    coronavirus lockdown restrictions, put up with an interviewing technique that
    involved my sitting on my bedroom floor during a Zoom call).'
