    # 埃尔南德斯-奥拉洛的预测是，我们将在 AI 和“完全” AGI 之间达到一个中间地带，那里存在的系统在广泛的任务上拥有比人类多得多的知识，但并非无所不知。为了解决新问题，它们将需要更多数据，而这些数据必须由其人类所有者获取。“对我来说，AGI
    是一个拥有通用能力的系统，这意味着它可以学习任何可能的技能，其中一些比另一些更容易，这与我们人类的情况一样，”他说。“这并不意味着该系统是超级智能。但这将是变革性的。”


    无论最终实现何种形式的 AGI，实际和伦理问题都随之而来。考虑到我们无法理解 AGI 是通过什么步骤得出决策的，依赖 AGI 做出的决策有多安全？我们如何决定何时使用
    AGI，何时依赖人类？“有成千上万聪明的人从事 AI 研究。即使没有 AGI 的定义，他们大概也能开展研究和开发工作，”卑尔根大学教授拉格纳·菲耶兰德说道。


    > 然而，他们应牢记的不仅是计算机*能*做什么的问题，还有计算机*应该*做什么的问题。这个问题包含伦理考量。有时用技术取代人类是正确的。然而，基本态度应当是技术应改善人类处境，而非取代人类。


    大多数 AI 研究人员同意的一点是，如果 AGI 最终被创造出来，那还需要很长时间。在 2017 年的一项调查中，询问 352 名机器学习研究人员何时认为可实现人类水平的机器智能，平均有
    50% 的受访者认为这一里程碑距今 45 年。


    面对 AGI 这样模糊的概念，没人愿押上声誉也就不足为奇了。如果没人能就其定义达成一致，就无法知道创造它需要什么工具，以及这些工具是已存在还是有待发明。如果需要更多技术突破——这似乎很可能——就无法猜测这些突破何时会发生。即使实现了某种形式的
    AGI，人们无疑也会对所创造的东西是否真的是 AGI 存在分歧。当谷歌在 2019 年声称实现了量子霸权——即利用基于量子力学原理运行的计算机比传统计算机更快地完成任务的能力——时，其竞争对手
    IBM 对其结果提出异议，并辩称量子霸权根本不重要。


    我们已有的 AI 系统距离掌握其当前的学习方法还很远，且无法执行与其训练任务不同的任务。人类要实现一个通用的、能跨许多不同领域工作的 AI，还有很长的路要走。


    但利用我们目前拥有的技术，仍有大量进步可期。AI 已在改变并颠覆我们周围的世界。它引发了各种挑战。当前系统存在需要修复的伦理、社会和技术问题。构建 AI 的人需要为其创造物负责。他们需要询问自己制造的系统是否在改善我们周围的世界，以及是否可能被怀有恶意者滥用。他们应该与受其技术影响的人交谈，了解技术带来了什么不同。AI
    的部署需要造福所有人。对 AGI 的追求不应分散我们对这一目标的关注。


    ## 术语表


    ### AGI（通用人工智能）


    一种能像人一样思考、学习新任务并像人类一样理解世界的 AI 系统。通用智能是大量 AI 研究的目标。


    ### 计算机视觉


    计算机通过图像识别、物体检测和分类或物体追踪来“看见”的能力。计算机视觉可用于处理照片、录制的视频和实时画面。


    ### CPU（中央处理器）


    一种计算机芯片，通过计算指导设备如何运行。CPU 包含数十亿个晶体管，擅长运行某些 AI 算法。


    ### 深度学习


    机器学习的一个子集，利用多层神经网络从数据中学习。深度学习自 21 世纪之交以来一直是 AI 应用最大的加速器。


    ### GAN（生成对抗网络）


    一种同时使用监督学习和无监督学习，基于之前见过的数据生成新数据的 AI。该过程已被用于创建虚假人脸和生成 AI 艺术作品。


    ### GPU（图形处理器）


    一种图形芯片，最初为游戏开发，因其处理能力强于 CPU 而成为 AI 领域的宠儿，可加速训练过程。它在图像识别方面特别有用。


    ### 神经网络


    一种松散模仿大脑构成的网络，用于促进机器学习。计算和预测在网络的每一层中进行。


    ### NLP（自然语言处理）


    计算机理解和使用人类语言的一种方式。这包括语言之间的机器翻译、文档摘要、语音转文本（反之亦然）和情感分析。


    ### 强化学习


    一种被赋予明确目标（例如在游戏中获胜）的算法，它通过试错来尝试达成目标。每次做对的事会得到奖励；失败时可能受到惩罚。


    ### 监督学习


    最常见的 AI 过程类型。监督学习系统对未见过的信息进行预测。为了做出这些预测，它首先会被展示它试图解决的问题的先前示例。监督学习常用于图像识别任务。


    ### 无监督学习


    一种在无先验知识的数据中寻找模式的学习系统。与监督学习不同，无监督学习不涉及使用先前示例进行训练。它适用于发现结构和对大量数据进行分类。


    ## 致谢


    世间万物的创造都非一人之功——本书也不例外。虽然我在《连线》杂志从事人工智能增长报道——从医疗保健到网络安全的应用——已逾五年，但我对这个有着数十年历史的行业的了解仍仅管窥一斑。本书的完成得益于他人的专业知识，我深表感激。


    在我任职《连线》期间，AI 的使用呈指数级增长，现在似乎社会已处于真正的临界点。该技术已渗入主流日常使用，并将越来越多地被用于解决我们生活更多领域的新任务。AI
    的前景令人振奋：它有潜力颠覆我们许多日常活动，并揭开关于我们星球（乃至更远之处）的新秘密。想象 AI 重塑我们所知的世界，这绝非不可思议。尽管前景广阔，仍有大量工作待做。我们需要确保
    AI 的使用是公平、负责且包容的。没有人应该因 AI 系统的使用而受苦。


    值得庆幸的是，许多极具天赋和才华的人正致力于 AI 的开发——既包括改善世界的方法，也包括确保 AI 造福所有人。在为本书采访报道的过程中，这些人中的许多人抽出时间与我分享他们的深厚专业知识，我对此衷心感激（尤其是那些在新冠封锁限制最严格时期，忍受了我坐在卧室地板上通过
    Zoom 通话采访的人）。


    '
