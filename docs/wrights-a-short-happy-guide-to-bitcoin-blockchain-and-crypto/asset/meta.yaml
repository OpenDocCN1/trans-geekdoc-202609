  - 为什么要信任预言机？由于区块链系统被设计为无需信任，预言机向系统重新引入了某种程度的信任。然而，一套演进的预言机集合通过财务、声誉和治理协议减少了使用预言机相关的风险。此外，许多智能合约依赖多个预言机来进一步降低这些风险。
