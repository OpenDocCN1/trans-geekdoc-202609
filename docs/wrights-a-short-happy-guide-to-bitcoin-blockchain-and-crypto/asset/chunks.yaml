    If anyone wonders why the `CFTC`, which regulates commodities and derivatives,
    exercised jurisdiction over secured loans, it is for one simple reason: as an
    economic matter, a secured loan (like the one described above) operates almost
    exactly like a futures contract. 218Both allow borrowers/investors to obtain price
    exposure to an asset by using leverage, and both allow borrowers/investors to
    profit from increases in the price of the asset.


    # Crypto Tax and the IRS


    “Tax Rules Everything Around Me, TREAM”

    —Ryan McNeil of Ernst & Young, paraphrasing Wu Tang Clan


    The taxation of crypto is well-settled in some areas, but inconsistent or incoherent
    in others. One of the well-settled areas is that crypto will be treated as property
    for tax purposes. The IRS made that determination through `Notice 2014–21` (`Notice`)
    and its accompanying frequently asked questions (`FAQs`, collectively with the
    `Notice`, the `2014 Guidance`). The `2014 Guidance` was welcomed, because prior
    to its issuance and despite numerous requests from taxpayers, the US Taxpayer
    Advocate,[54](#section10.xhtml#ftn.89) as well as an array of business and professional
    groups, the IRS had issued no official guidance on the tax treatment of crypto.


    Over five years later, in October 2019 the IRS issued its second crypto guidance,
    `Revenue Ruling 2019–24` (`Rev. Rul. 2019–24` or the `Ruling`) and accompanying
    `FAQs` (collectively, the `2019 Guidance`). The IRS indicated that the `2019 Guidance`
    was intended to expand upon the `2014 Guidance`. Although `2019 Guidance` answered
    many open questions regarding the tax treatment of crypto, it raised a host of
    others.


    In December 2019, eight members of Congress wrote to `IRS` `Commissioner` `Rettig`
    (`Congressional Letter`) asking for clarification of the `2019 Guidance`, noting:


    > Ambiguity [in the tax laws] impedes appropriate tax compliance and unfairly
    targets taxpayers who may not have the ability to understand the positions the
    `IRS` has 220taken in these matters but who have taken a reasonable position (sic).[55](#section10.xhtml#ftn.90)


    On February 28, 2020, the `American Institute of Certified Public Accountants`
    (`AICPA`) also drafted a letter to the `IRS` (`AICPA Letter`) identifying specific
    areas warranting additional or updated guidance. Both the `Congressional Letter`
    and the `AICPA Letter` highlighted and addressed significant shortcomings of the
    `2019 Guidance`.


    The analysis of both the `2014 Guidance` and `2019 Guidance` is below.


    ## 2014 Guidance


    The `Notice` answered one of the foundational questions regarding the tax treatment
    of crypto: how should taxpayers treat transactions involving crypto? The `IRS`
    answered by stating that crypto (called “virtual currencies”[56](#section10.xhtml#ftn.91)
    by the `IRS`) would be treated as property under the US tax code (`Code`). That
    meant that any sale or exchange of crypto, no matter the size, would be a taxable
    transaction and would have to be reported on a tax return.


    Under the `Code`, crypto could have arguably been treated as either currencies,
    commodities, securities, or property. By choosing to treat crypto as property,
    the `Code` requires that whenever a taxpayer exchanges crypto for any other property,
    the taxpayer must report any and gains or losses related to the exchange. Those
    gains or losses are generally calculated by subtracting the taxpayer’s adjusted
    cost basis (see box) in the crypto exchanged from the fair market value (`FMV`)
    of any property received in the exchange.


    That answer provided clarity, but was also unsatisfactory. Treating crypto as
    property meant that almost every crypto transaction, including using crypto to
    buy coffee at Starbucks, could be a taxable transaction which had to be reported
    on a tax return.


    | The Basics of Tax Basis |

    | :--- |

    | Tax basis is the cost associated with property for tax purposes, and is used
    to calculate gains or loss on the sale, exchange, or other disposition of property.
    For each individual purchase of crypto, calculating the tax basis is relatively
    simple: the cost of the crypto plus any acquisition costs. However, when it comes
    to sales or other exchanges, the situation gets a bit more complicated because
    it is often not apparent exactly which crypto is used in a sale or exchange. For
    example, assume `Bibi` purchased one bitcoin every year on January 1, from 2011
    to 2020, and now has 10 bitcoins. As noted in Part II, those bitcoins would have
    been purchased for anywhere between $0.30 per bitcoin (Jan. 2011 price) and $13,657
    (Jan. 2018 price). Each of those 10 bitcoins would have its own tax basis, based
    on the purchase price of each. Now, if `Bibi` purchased a car from `Chaun` for
    4.5 bitcoins on January 2, 2020, although the `Notice` directs `Bibi` to report
    the exchange of one property (4.5 bitcoins) for another (the car), it provided
    no guidance regarding how `Bibi` should determine which 4.5 of her 10 bitcoins
    were used to purchase the car. |


    While the `Notice` answered a foundational tax question, it failed to address
    numerous others, leaving taxpayers to their own devices to figure them out. In
    the five years after the `2014 Guidance` was issued, both the `American Bar Association`
    (`ABA`) and the `AICPA` requested additional guidance from the `IRS` on a number
    of those open questions. One issue was the tax treatment of forks, which 222both
    the `ABA` and the `AICPA` noted that was one of the most pressing open questions
    facing taxpayers.


    On May 16, 2019, `IRS` `Commissioner` `Rettig` acknowledged the problems created
    by the `IRS`''s failure to provide additional guidance, and sent a letter to Congress
    indicating that new crypto guidance was a priority, and it should be coming “soon.”
    Commissioner `Rettig`’s letter was in response to a request from 21 members of
    Congress who asked the `IRS` to provide clarity on tax reporting for crypto, noting
    that there was “substantial ambiguity on a number of important questions about
    the federal taxation” of crypto.


    In `Rettig`’s response, he stated, “I share your belief that taxpayers deserve
    clarity on basic issues related to the taxation of [crypto] transactions and have
    made it a priority of the `IRS` to issue guidance.” `Rettig` added that one of
    the issues the `IRS` was working on was “acceptable methods for [determining]
    the tax treatment of forks.” That guidance came in October 2019.


    ## 2019 Guidance


    `Rev. Rul. 2019–24` addressed the tax treatment of forks and airdrops. In doing
    so, it also addressed a sub-issue of both: when receiving a new crypto after a
    fork or airdrop, under what circumstances will a taxpayer be required to report
    income with respect to the new crypto. The `FAQs` issued along with `Rev. Rul.
    2019–24` provided guidance on a number of technical tax issues, including one
    of the most important for taxpayers: how they should calculate their tax basis
    in crypto.


    ### Tax treatment of forks


    `Rev. Rul. 2019–24` defined a hard fork as occurring “when a [crypto] on a [blockchain][57](#section10.xhtml#ftn.92)
    undergoes a protocol change resulting in a permanent diversion from the legacy
    or existing [blockchain].” In 223the Ruling, the `IRS` made its position clear:
    if a taxpayer has “dominion and control” over a new coin after a fork, the taxpayer
    will have taxable income equal to the fair market value of the new coin when that
    new coin is recorded on the new blockchain. The `IRS` included the “dominion and
    control” language so that taxpayers would not be taxed in situations in which
    they hold crypto through an exchange or other intermediary that does not list
    or otherwise support the new crypto.[58](#section10.xhtml#ftn.93) In such situations,
    the Ruling indicates that because such taxpayers have no ability to immediately
    spend or transfer those new unlisted/‌unsupported coins, they do not have to recognize
    income associated with those coins.


    ### Tax treatment of airdrops

