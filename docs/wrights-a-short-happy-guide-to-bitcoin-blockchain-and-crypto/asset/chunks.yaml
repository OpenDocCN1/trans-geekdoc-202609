    \ oil supply deal directly with Iran, allowing China to pay for oil using the\
    \ Chinese yuan, thereby bypassing the petrodollar system altogether. The deal\
    \ is expected to inject the equivalent of about $280 billion into Iran.\n\n* \
    \  The governments of France, Germany, and the UK developed INSTEX in 2019 as\
    \ a mechanism to facilitate non-US dollar and non-SWIFT transactions to avoid\
    \ US sanctions. INSTEX allows European 90businesses to trade with Iran without\
    \ SWIFT. In November 2019, Belgium, Denmark, the Netherlands, Finland, and Sweden\
    \ joined INSTEX.\n\n*   Russia agreed to bypass the SWIFT network by linking its\
    \ banking system directly to Iran’s.\n\nCollectively, those actions signal a growing\
    \ effort to limit both the benefits of the petrodollar and the ability of US politicians\
    \ to weaponize the dollar.\n\nVenezuela: A Case Study of What Can Go Wrong\n\n\
    The petrodollar system coupled with poor economic and fiscal policies can negatively\
    \ affect citizens of a country. Post-2014 Venezuela serves as a prime example.\n\
    \nBefore 2014, the Venezuelan economy was relatively prosperous, as the revenues\
    \ from oil exports allowed Venezuela’s long-serving president, Hugo Chavez, and\
    \ his successor, Nicolas Maduro, to fund the government and support many popular\
    \ social programs. That was possible because over 90 percent of the country’s\
    \ export earnings came from oil, and from 1999 to 2014, oil prices rose from $25\
    \ to over $160 per barrel and generally hovered between $100 and $125 per barrel.\n\
    \nStarting around 2014, a few things happened that caused the price of oil to\
    \ drop: OPEC members produced more oil, the US began to produce more oil through\
    \ hydraulic fracturing (fracking), and China experienced slowing economic growth.\
    \ In other words, oil supply increased and demand decreased. An economics degree\
    \ is not needed to understand what happens when supply increases and demand decreases:\
    \ prices drop. From June 2014 to February 2016, oil prices dropped from a peak\
    \ of $115 to $35 per barrel.\n\nWhen the price of oil dropped, so did the demand\
    \ for the Venezuelan currency, the bolívar. That caused the demand for, and 91the\
    \ value of, the bolívar to fall precipitously relative to other world currencies.\n\
    \nPrior to the decline in oil prices, in January 2014 the Venezuelan bolívar to\
    \ US dollar exchange rate was seventy to one, meaning 70 bolívars was exchangeable\
    \ into $1. After the decline, by January 2016 that exchange rate was almost one\
    \ thousand to one, or 1,000 bolívars for $1. As the value of the bolívar fell,\
    \ the cost of imported goods for Venezuelans rose, and the Venezuelan economy\
    \ went into crisis.\n\nSoon after Maduro took over in 2013 after Chavez’s death,\
    \ Maduro had to determine how his government would respond to decreased demand\
    \ for Venezuelan bolívars and low oil prices. His primary response was to print\
    \ more bolívars, which first caused inflation, and eventually led to hyperinflation\
    \ (see box below).\n\n| Hyperinflation and governmentsHyperinflation is very high\
    \ and typically accelerating inflation which erodes the value of the local currency.\
    \ The highest reported inflation rate in the last hundred years happened in Hungary\
    \ in 1946, where the daily inflation rate was over 207 percent, and prices doubled\
    \ roughly every 15.6 hours. In 2008, Zimbabwe experienced hyperinflation, and\
    \ the daily inflation rate reached 98 percent, meaning prices doubled every 24.7\
    \ hours. During periods of hyperinflation, people often minimize their holdings\
    \ in the local currency and, if possible, switch to more stable assets (like gold\
    \ or cattle) or currencies (like the US dollar and, increasingly, crypto). |\n\
    \n| --- |"
