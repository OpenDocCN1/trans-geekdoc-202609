    # What power will governments have to force Libra to exclude people, or people
    from certain nations, from using it? For example, could the United States force
    Libra to exclude North Koreans and Iranians?


    The reaction to the Libra announcement was mixed. US Congressman Darren Soto,
    co-chair of the Congressional Blockchain Caucus, stated:


    “We are encouraged by the possibility of increasing access to mobile and digital
    payments, which will ultimately benefit our society and become a driver of 113economic
    growth. While it is yet unclear how this new technology will be regulated, it
    is crucial Congress continues to protect consumers and the financial well-being
    of investors, while simultaneously promoting innovation for these virtual currencies.”


    Others in Congress were not so enthusiastic. Sherrod Brown, a member of the Senate
    Banking Committee, tweeted:


    “Facebook is already too big and too powerful, and it has used that power to exploit
    users’ data without protecting their privacy . . . . We cannot allow Facebook
    to run a risky new cryptocurrency out of a Swiss bank account without oversight.”


    Around the world, the reaction was also mixed:


    *   On September 13, 2019, France and Germany issued a joint statement on Libra,
    which stated: “We believe that no private entity can claim monetary power, which
    is inherent to the sovereignty of nations.”

    *   France’s finance minister Bruno Le Maire said that Libra “can’t and . . .
    must not happen” and that “it is out of question” for the cryptocurrency to “become
    a sovereign currency.”

    *   Bank of England governor Mark Carney said he was open-minded about Libra,
    but warned mass adoption would force it “to be subject to the highest standards
    of regulation.”

    *   Australia’s central bank chief Philip Lowe said, “there are a lot of regulatory
    issues that need to be addressed and they’ve got to make sure there’s a 114solid
    business case, so we’ve got to be careful before we jump to conclusions.”


