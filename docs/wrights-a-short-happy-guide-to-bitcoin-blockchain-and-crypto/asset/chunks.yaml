- raw: "A popular derivatives contract is a futures contract, which is a legal agreement\
    \ to buy or sell a particular asset at a predetermined price sometime in the future.\
    \ The buyer of a futures contract is taking on the obligation of buying the underlying\
    \ asset at a specified price when the contract ends (expiration), and the seller\
    \ of the contract is taking on the obligation of selling the underlying asset\
    \ at that price to the buyer at expiration. A futures contract, unlike a call\
    \ option, does not give the buyer the option of making the purchase of the underlying\
    \ asset in the future: buyers of futures contracts obligate themselves to acquire\
    \ the asset, regardless of the actual price at expiration.\n\nIn the US, the CFTC\
    \ oversees the regulation of futures contracts, ensuring they are standardized\
    \ for quality and quantity. The 1983 movie Trading Places, starring Eddie Murphy,\
    \ Dan Ackroyd, and Jamie Lee Curtis, does a fairly good job (between jokes) demonstrating\
    \ how futures markets operate, using frozen 209concentrated orange juice futures\
    \ contracts.[50](#section10.xhtml#ftn.85) The movie also demonstrates the potential\
    \ for manipulation and profit from futures markets, and why it is important that\
    \ such markets be regulated.\n\nUnlike most regulators around the world, the CFTC\
    \ does not approve new financial products. Instead, it allows licensed exchanges\
    \ to self-certify new products, so long as the exchanges assure the products meet\
    \ the CFTC’s core guidelines and principles. As part of the self-certification\
    \ process, the CFTC staff coordinates with the exchanges to ensure new products\
    \ comply with the CEA and CFTC regulations. From 2000 to 2019, exchanges and other\
    \ market participants have self-certified over 12,000 products through the CFTC.\n\
    \nPrior to 2015, it was unclear whether the CFTC would exercise jurisdiction over\
    \ crypto. Clarity came in September 2015, when the CFTC instituted a proceeding\
    \ against Coinflip, a platform that facilitated bitcoin derivative contracts.\
    \ In its order of settlement with Coinflip, the CFTC stated that bitcoin was a\
    \ cryptocurrency, but because cryptocurrencies are not legal tender, the CFTC\
    \ would not treat them as currencies. Instead, the CFTC would treat them as commodities.\
    \ Consequentially, as commodities, bitcoin derivative contracts were subject to\
    \ CFTC regulation under the CEA.\n\nAs a condition to its settlement with the\
    \ CFTC, Coinflip admitted that the bitcoin derivative contracts it offered on\
    \ its platform violated the CEA. After the settlement, two federal courts confirmed\
    \ the CFTC position that certain crypto were commodities under the CEA, thus subject\
    \ to CFTC regulation.[51](#section10.xhtml#ftn.86)\n\nAccording to the CFTC, its\
    \ regulatory approach to crypto involves:\n\n210 \n\nConsumer Education. Amidst\
    \ the wild assertions, bold headlines, and shocking hyperbole, there is a need\
    \ for greater public understanding.\n\nAsserting Legal Authority. Asserting legal\
    \ authority over virtual currency derivatives in support of the CFTC’s anti-fraud\
    \ and manipulation efforts, including in underlying spot markets, is a key component\
    \ in the CFTC’s ability to effectively regulate these markets.\n\nMarket Intelligence.\
    \ Gaining the ability to monitor markets for virtual currency derivatives and\
    \ underlying settlement reference rates through the gathering of trade and counterparty\
    \ data will provide regulatory and enforcement insights into those markets.\n\n\
    Robust Enforcement. In addition to its general regulatory and enforcement jurisdiction\
    \ over the virtual currency derivatives markets, the CFTC has jurisdiction to\
    \ police fraud and manipulation in cash or spot markets. The CFTC intends to continue\
    \ to exercise this jurisdiction to enforce the law and prosecute fraud, abuse,\
    \ manipulation, or false solicitation in markets for virtual currency derivatives\
    \ and underlying spot trading.\n\nGovernment-Wide Coordination. The CFTC actively\
    \ coordinates its approach to bitcoin and other virtual currencies with other\
    \ Federal regulators, including the SEC, FBI, DOJ and the Financial Stability\
    \ Oversight Council. The CFTC also coordinates with state entities, including\
    \ state Attorneys General, in addition to working with the White House, Congress\
    \ and other policy-makers.\n\nIn general, the CFTC takes a relatively hands-off\
    \ approach to regulation. One reason for this is that exchanges regulated by the\
    \ CFTC, including the Chicago Mercantile Exchange (CME) and the 211CBOE Futures\
    \ Exchange (CFE), have a long and successful history as self-regulatory organizations\
    \ dealing with risky assets. Another reason has to do with the CFTC’s former chair,\
    \ Chris Giancarlo.\n\nFrom June 2014 until July 2019, Giancarlo, known in the\
    \ crypto community as “Crypto Dad,” served as the 13th chairman of the CFTC. Giancarlo\
    \ was appointed by President Obama and reappointed by the succeeding administration;\
    \ his appointment was unanimously confirmed by the Senate each time.\n\nGiancarlo\
    \ has long been a proponent of creating a supportive regulatory environment for\
    \ crypto. He has stated that his support for supportive crypto regulation is based\
    \ on his observations of the evolution of internet regulation. In an address regarding\
    \ crypto regulation, he stated:\n\nTwo decades ago, as the Internet was entering\
    \ a phase of rapid growth and expansion, a Republican Congress and the Clinton\
    \ administration established a set of foundational principles: the Internet was\
    \ to progress through human social interaction, voluntary contractual relations\
    \ and free markets. Governments and regulators were not to harm the Internet’s\
    \ continuing evolution. Because of this “do no harm” approach, the Internet created\
    \ millions of jobs, transformed our economy forever and improved standards of\
    \ living across the globe.\n\nToday, as you know, a new technology is at hand\
    \ that may offer a similarly profound tool to share networks of information. Yet,\
    \ its development is at risk of being stymied by disparate and uncertain regulation.\n\
    \n—Special Address of CFTC Commissioner Giancarlo, Depository Trust & Clearing\
    \ Corporation 2016 Blockchain Symposium (Mar. 29, 2016)\n\n212 \n\nSince exercising\
    \ jurisdiction over crypto in 2015, the CFTC has enforced laws prohibiting market\
    \ manipulation of crypto-based derivatives, issued proposed guidance on defining\
    \ spot and derivative markets for crypto, issued warnings about valuations and\
    \ volatility in spot crypto markets, and addressed crypto Ponzi schemes. In addition\
    \ to working to ensure crypto markets are financially sound, the CFTC has also\
    \ exercised jurisdiction over crypto-based secured lending arrangements, as discussed\
    \ later in this chapter.\n\nA Hamstrung Regulator\n\nWhile many would agree that\
    \ the CFTC has done a commendable job regulating crypto, it lacks the legal authority\
    \ to do more. Under current law, the CFTC:\n\n“lacks the legal authority to partner\
    \ and collaborate with outside entities engaging directly with FinTech and innovation\
    \ within a research and testing environment, including when the CFTC receives\
    \ something of value absent a formal procurement. The general rule is that without\
    \ such authority, the CFTC must forego the increasing number of opportunities\
    \ to engage in research that may benefit the derivatives markets that the agency\
    \ oversees, as well as the CFTC’s own activities.”\n\n—Remarks of CFTC Chairman\
    \ Giancarlo, The Digital Trinity: Technology, Markets, and Policy, 4th Annual\
    \ DC Blockchain Summit (Mar. 6, 2019)\n\nOther international regulatory agencies\
    \ have that authority. For example, in 2015, the UK’s FCA created an innovation\
    \ hub that allows both regulated and non-regulated FinTech firms to introduce\
    \ innovative financial products to the market and test new ideas through its regulatory\
    \ sandbox. If the Financial Services Innovation Act proposed by Rep. McHenry (discussed\
    \ in the final chapter) is 213passed, the CFTC would be allowed to create such\
    \ an innovation hub through the Act’s permanent beta testing (regulatory sandbox)\
    \ provisions.\n\nCFTC Enforcement Activities"
