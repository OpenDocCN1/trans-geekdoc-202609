    fortunes. In such cases, if the promoter profits when the investors profit, there
    will be narrow vertical commonality. However, if the promoter earns a fixed fee
    or a commission that is not dependent on the profitability of the enterprise,
    it is unlikely a court will find narrow vertical commonality. Only the Ninth Circuit
    accepts narrow vertical commonality,[28](#section10.xhtml#ftn.63) but in the past,
    the Ninth Circuit has also accepted horizontal commonality.[29](#section10.xhtml#ftn.64)


    As discussed later in the chapter, the SEC’s position on commonality for crypto
    appears to be “any commonality will suffice.”


    3)Expectation of Profits


    This element looks to whether there is a reasonable expectation of profits from
    the investment, and whether that expectation is the principal motivation for the
    investment. In determining what are considered “profits,” courts have focused
    primarily on capital appreciation or earnings of the enterprise. Importantly,
    the Supreme Court has held that “when a purchaser is motivated by a desire to
    use or consume the item purchased . . . the securities laws do not apply.”[30](#section10.xhtml#ftn.65)
    \[Emphasis supplied\]


    That “use or consume” exception, widely described as “utility,” is often relied
    upon by crypto issuers claiming their tokens are not securities. However, the
    SEC has emphasized that simply labeling a token a “utility token” does not magically
    exempt the token from 171securities laws. To date, the SEC has not provided a
    clear answer on exactly how much utility a token needs to avoid being deemed a
    security, but has offered guidance (described later in this chapter) to narrow
    the inquiry.


    4)Based on Efforts of Others


    Howey’s fourth element requires that the expectation of profits from the investment
    be based on “the efforts of others.” The original language from Howey stated that
    the profits were based “solely” on the efforts of others, but the “solely” requirement
    has been relaxed by most courts. Today, the relevant inquiry is “whether the efforts
    made by those other than the investor are the undeniably significant ones, those
    essential managerial efforts which affect the failure or success of the enterprise.”[31](#section10.xhtml#ftn.66)


    Under US law, all offers and sales of securities must either be registered under
    the securities laws or have qualified for an exemption from registration. To register
    a security, an issuer must disclose to potential investors detailed information
    about the investment, including a description of the business and its management,
    the security to be offered, and certified financial statements. According to the
    accounting and consulting firm PWC, the costs of the registration process for
    an initial public offering (IPO), which often requires the involvement of lawyers,
    accountants and bankers, typically exceed $1 million.


    The SEC and Crypto


    Prior to 2017, the SEC had not taken a public position on whether crypto were
    securities. On July 25, 2017, following a hack on a crypto hedge fund called “The
    DAO,” the SEC made its position clear 172when it issued The DAO Report, excerpted
    below, announcing its position that all crypto that met the Howey test were securities.


    | ![](Image_58.jpg)THE DAO REPORT(the information below is based on The DAO Report)The
    DAO was an example of a Decentralized Autonomous Organization, a term used to
    describe a “virtual” organization embodied in computer code and executed on a
    distributed ledger or blockchain. The DAO was created by a company called Slock.it
    and its co-founders, with the objective of operating as a virtual hedge fund.
    The DAO would generate assets through the sale of DAO Tokens to investors, and
    those assets would then be used to fund investment projects. The holders of DAO
    Tokens, as a return on their investment, would share in the earnings generated
    from the projects. In addition, DAO Token holders would be able to re-sell their
    DAO Tokens.In 2016, The DAO launched and raised over $150 million worth of ETH
    from the sale of DAO Tokens. However, before The DAO was able to commence funding
    projects, an attacker used a flaw in The DAO’s code to steal approximately one-third
    of the ETH raised. The stolen ETH was valued at between $50–$60 million.173 The
    SEC launched an investigation into The DAO hack, and as part of its investigation,
    considered (i) the threshold question of whether DAO Tokens were securities, and
    (ii) whether US securities laws applied to the offer and sale of DAO Tokens. Based
    on its investigation, the SEC issued The DAO Report, determining that DAO Tokens
    were securities, and the offer and sale of DAO Tokens constituted an offering
    of securities. |


    | --- |


    The DAO Report, issued in July 2017, marked the unofficial beginning of the battle
    between the crypto community and the SEC. In the following years, a primary point
    of contention became how the SEC would determine whether a certain crypto was
    a security. Many in the crypto community called on the SEC to issue clear rules
    for determining how the unique features of crypto would influence the SEC’s investment
    contract (Howey) analysis.


    After The DAO Report was issued, some crypto companies moved offshore to avoid
    US securities regulations. Many in the crypto community complained that the SEC’s
    lack of clarity was a motivating factor. To provide more clarity, in April 2019,
    the SEC published the Framework for “Investment Contract” Analysis of Digital
    Assets (Framework) to help market participants understand how the SEC would determine
    whether a particular crypto would be considered a security. Although the guidance
    was welcomed, it came with one important caveat: it was not binding. The Framework
    included the following cautionary language:


    This framework represents \[the SEC\] Staff views and is not a rule, regulation,
    or statement of the Commission. The Commission has neither approved nor disapproved
    its content. This framework, like other Staff guidance, is not binding on \[SEC\]
    Divisions or the Commission. It does not constitute legal advice, for which you
    should consult with 174your own attorney. It does not modify or replace any existing
    applicable laws, regulations, or rules.


    Despite its cautionary language, the Framework provided useful guidance regarding
    how the SEC would determine whether a token was a security, and laid out the SEC’s
    three-element[32](#section10.xhtml#ftn.67) Howey test:


    1)Investment of Money;


    2)Common Enterprise; and


    3)Reasonable Expectation of Profits Derived from Efforts of Others.


    The Framework’s analysis is below.


    1)Investment of Money


    The Framework provides that this element is “typically satisfied in an offer and
    sale of a digital asset because the digital asset is purchased or otherwise acquired
    in exchange for value, whether in the form of real (or fiat) currency, another
    digital asset, or other type of consideration.” In a footnote, however, the Framework
    discussed airdrops, which are free distributions of crypto tokens to holders of
    other crypto typically used to promote circulation of the airdropped crypto.[33](#section10.xhtml#ftn.68)


    The footnote noted that if the airdropped tokens were issued “in exchange for
    services \[by the recipients\] designed to advance the issuer’s economic interests
    and foster a trading market for its securities,” then the investment of money
    element would likely be satisfied. The SEC’s position on airdrops mirrors its
    position on “free 175stock” scams that operated in the late 1990s. According to
    then-SEC Enforcement Dir. Richard H. Walker:


    “Free stock is really a misnomer in these cases. While cash did not change hands,
    the companies that issued the stock received valuable benefits. Under these circumstances,
    the securities laws entitle investors to full and fair disclosure, which they
    did not receive in these cases.”[34](#section10.xhtml#ftn.69)


    2)Common Enterprise'
