    区块链交易既包含签名数据（用于验证发送者是否有资金进行支付，称为“见人”信息），也包含交易数据（详细列出拟议交易的内容）。SegWit（分离签名）将这些签名数据（见人信息）与交易数据分离。由于签名数据约占典型交易中数据的
    65% 百，SegWit 大极程度上减少了完成一笔交易所需的数据量，使得每个区块能够容纳更多交易，从而提高了区块链的交易处理能力。广而言之，SegWit 允许一个
    `1 MB` 的比特币区块运行得像一个更安全的 `4 MB` 区块。


    尽管 SegWit 似乎缓解了比特币的可扩展性问题，但它的实施并非没有争议。在不深究技术细节的情况下，从区块中移除见人数据可能会使证明交易确实发生过变得更加困难。关于
    SegWit 的分歧是导致首次极具争议的比特币链分叉以及比特币现金（`BCH`）产生的因素之一。


    如上所述，在 SegWit 集成前后，比特币社区的一些人认为解决扩展问题的更佳方案是增加区块大小。然而，在经过一场非常公开的辩论后，比特币社区决定不增加区块大小，仅实施
    SegWit。这一决定导致一群矿工、开发者和活动人士分叉了比特币区块链，并在 SegWit 实施之前的某个点进行了分叉。新链被称为比特币现金，拥有与比特币相同的
    SegWit 之前的历史，但允许高达 `8 MB` 的区块大小（相比之下，比特币为 `1 MB`）。硬叉之后，任何拥有 `BTC` 的人也拥有相同数量的 `BCH`。


    ## 闪


    ![Lightning Network: Bitcoin micropayments | Blockstream](img/Image_24.jpg)


    闪电网络是一种第二层协议，为比特币的可扩展性问题提供了另一种解决方案。闪电网络通过以下方式工作：


    * 从区块链识别部分相关数据；

    * 将这些数据移出区块链（链下）；

    * 使用这些链下数据执行交易；

    * 对所有链下交易进行结算；以及

    * 将结算后的交易整合回区块链。


    使用闪电网络的个人交易（闪电交易）不记录在区块链上（链上），这释放了区块链以执行其他任务的资源。相反，这些闪电交易在链下进行验证和记录，并在之后的某个时间点，这些闪电交易的净结果在链上进行结算。


    闪电网络的工作原理允许用户打开第二层支付通道，然后使用这些通道在链下执行交易。一旦特定通道的所有交易完成，这些支付将进行汇总和结算，然后关闭通道。一旦关闭，该通道在开启期间所有交易的记录将在链上进行结算并记录。


    ### 闪电网络交易的范例


    假设 Bibi 和 Chaun 定期互相买卖商品。为了避免在区块链上记录每笔交易，他们可以各自从区块链移动 `$100` 到他们的支付通道中，从而建立一个支付通道。此时，他们可以使用他们的支付通道相互之间进行买卖，而无需在区块链上记录每笔交易。


    运行方式如下，假设他们都在周日打开了一个为期四天的支付通道，并各自向通道转入了 `$100`：


    * 周一，Bibi 向 Chaun 发送了 `$40`。

    * 周二，Chaun 向 Bibi 发送了 `$50`。

    * 周三，他们关闭了通道。


    一旦通道关闭，支付将进行汇总：


    * Bibi：`$100 − $40 + $50 = $110`。

    * Chaun：`$100 + $40 − $50 = $90`。


    来自关闭通道的信息将发送回区块链，并带有指令向 Bibi 的账户发送 `$110`，向 Chaun 的账户发送 `$90`。闪电网络的优势在于，它消除了网络需要记录和验证底层周一和周二交易的需求。


    许多人将闪电网络视为让比特币用于日常交易的一种方式。优点包括更低的交易成本（因为整个网络不需要处理每笔交易）以及更大的网络容量（因为这些链下交易不会阻塞网络，并允许处理更多交易）。这种容量对于微交易和物联网（IoT）用途最有益，在这些场景中，可以将指令发送到连接的设备以执行特定任务。


    根据闪电网络搜索和分析引擎 `1ML` 的数据，截至 2019 年底，闪电网络的网络容量约为 `850 BTC`，拥有一万一千个节点、三万五千个支付通道，中位基础费用为
    `1 Satoshi`（比特币的亿分之一）。然而，正如生活中的大多数事情一样，细节决定成败。闪电网络中发现的几个问题如下：


    * **资金锁定**：如之前的示例所示，闪电网络用户需要在通道中存入资金，这意味着资金在通道关闭之前会被锁定在通道中。通道开启越久、执行的交易越多，它将交易移出区块链并提高网络效率的效果就越高。然而，这也增加了价格波动的风险。例如，如果一个用户的通道开启了一周，并且由于某种原因
    `BTC` 价格崩溃而想要出售，该用户将被锁定直到通道关闭。

    * **中心化**：闪电网络是否会增加中心化，从而使网络整体变得不安全且更容易受到攻击，这是一个非常有争议的问题。中心化论点部分基于这样观点：演变产生的是一种星纽型中心化（图
    A）。


    ![](img/Image_25.jpg)


    简而言之，这种观点主张，为了连接具有不同通道的不同用户，将会出现一个枢纽系统，许多用户连接到同一个枢纽以便他们相互交易。因此，这些枢纽更容易受到攻击，而控制运行这些枢纽的支付通道方对网络拥有过大的控制权。


    ![](img/Image_26.jpg)


    其他人则认为，星纽型中心化的风险被放大了，可能会出现的将是热土豆式分布式网络（图 B）。简而言之，在热土豆式分布式网络中，每个节点都将交易传递给下一个愿意将交易带向目的地的节点，并使用所谓的源路由和洋葱路由。源路由意味着支付发送者构建支付路径。洋葱路由意味着对于多跳交易（热土豆），路径中的中间节点只知道两个当方的身份：转入支付的方和下一个接收支付的方。最终目的地将是唯一知道支付将在那里停止的节点。源路由和洋葱路由允许支付的源和最终目的地追踪支付，同时保护它们的身份，从而增强了隐私性和抗审查能力。


    ![](img/Image_27.jpg)


    答案正如生活中的许多事情一样，可能处于中间。可能会出现一种去中心化网络（图 C），它兼具图 A 中星纽型中心化和图 B 中热土豆式分布式网络的属性。


