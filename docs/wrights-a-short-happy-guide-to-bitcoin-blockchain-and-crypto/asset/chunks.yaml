- raw: "*   there is no uniform price for bitcoin, with different exchanges quoting\
    \ different prices; and\n\n*   the market for bitcoin is illiquid.\n\nHistory\
    \ of Bitcoin ETF proposals\n\nThe first Bitcoin ETF proposal was submitted by\
    \ the Bats BZX exchange and the Winklevoss twins (the early Facebook investors)\
    \ 203in June 2016. The SEC ultimately rejected their proposal in March 2017, claiming\
    \ the market for bitcoin was easily manipulated, volatile, and resistant to surveillance.\
    \ Two weeks after the BZX/Winklevoss proposal was rejected, the SEC rejected another\
    \ proposal, this time from NYSE Arca, a subsidiary of the New York Stock Exchange.\n\
    \nIn 2018, the SEC rejected a revised BZX/Winklevoss proposal, but SEC commissioner\
    \ Hester Peirce publicly dissented from the decision, writing:\n\n“The disapproval\
    \ order focuses on the characteristics of the spot market for bitcoin, rather\
    \ than on the ability of BZX—pursuant to its own rules—to surveil trading of and\
    \ to deter manipulation in the . . . shares listed and traded on BZX.”[44](#section10.xhtml#ftn.79)\n\
    \nAt the time, many thought Peirce’s public comments were indicative of changing\
    \ attitudes at the SEC. However, nine were rejected on August 22, 2018 alone,\
    \ and no proposals have been approved as of this writing.\n\nAlthough no proposals\
    \ have been approved, two glimmers of hope came in February 2019, when:\n\n* \
    \  SEC commissioner Robert J. Jackson Jr, publicly pondered:\n\n“Eventually, do\
    \ I think someone will satisfy the standards we’ve laid out there? I hope so,\
    \ yes, and I think so,”[45](#section10.xhtml#ftn.80)\n\nand later added:\n\n204\
    \ \n\n“when the markets reach that stage, I fully believe we will have an SEC\
    \ that’s ready to approve a bitcoin ETF.”[46](#section10.xhtml#ftn.81)\n\n*  \
    \ Brian Quintenz, a Commodities and Futures Trading Commission (CFTC) commissioner\
    \ criticized the SEC for having rejected previous ETFs on the grounds of potential\
    \ price manipulation, stating:\n\n“There are mathematical ways through a settlement\
    \ index to design a contract where even if there isn’t a lot of liquidity on one\
    \ exchange referenced, the index itself is not readily susceptible to manipulation.”[47](#section10.xhtml#ftn.82)\n\
    \nIn a 112-page decision handed down in October 2019, the SEC rejected an amended\
    \ Bitcoin ETF proposal filed in January 2019 from Bitwise and NYSE Arca. In the\
    \ decision, the SEC noted that it remained concerned about market manipulation,\
    \ and cited Bitwise’s research suggesting only about 5 percent of the reported\
    \ bitcoin trading volume was “real,” and the other 95 percent was “fake.” Bitwise’s\
    \ research indicated the fake trades included artificial trades between account\
    \ holders on unregulated exchanges and wash trades (buy and sell orders often\
    \ appearing in pairs, with one neutralizing the other) used to spike volume. In\
    \ its decision, the SEC noted:\n\n\\[Bitwise\\] has not established that it has\
    \ in fact identified the “real” bitcoin market, or that the “real” bitcoin market\
    \ is isolated from the fraudulent and manipulative activity.\n\n205 \n\nSome legal\
    \ analysts do not believe a Bitcoin ETF will be approved until the term of Jay\
    \ Clayton, the current SEC Chair, ends. Clayton has long been a critic of the\
    \ bitcoin market, and in September 2019 said:\n\n“how can we be sure that those\
    \ \\[bitcoin\\] prices \\[traded on unregulated exchanges\\] aren’t subject to\
    \ significant manipulation? . . . People need\\[ \\] to answer these hard questions\
    \ for us to be comfortable that \\[a Bitcoin ETF\\] was the appropriate kind of\
    \ product.”[48](#section10.xhtml#ftn.83)\n\nETF Trends CEO Tom Lydon has speculated\
    \ that there is a 60 percent chance a Bitcoin ETF will be approved in 2020. Others,\
    \ however, are less optimistic. CNBC analysist Bob Pisani neatly summed up the\
    \ thoughts of the doubters:\n\nThe SEC is terrified grandma is going to buy a\
    \ Bitcoin ETF that is going to collapse, and five years later, all the people\
    \ running the SEC are going to get hauled in front of Congress and get \\[asked\\\
    ], ‘Are you the guys who approved grandma buying the Bitcoin ETF?’”[49](#section10.xhtml#ftn.84)\n\
    \n206 \n\nCommodities, Derivatives and the CFTC\n\nThe CFTC was created by the\
    \ Commodities Exchange Act of 1936 (CEA) to regulate commodities, futures, options,\
    \ and other derivatives markets. Its mission is to promote the integrity, resilience,\
    \ and vibrancy of the US derivatives markets through sound regulation. In advancing\
    \ that mission, the CFTC regulates key participants in the commodities and derivatives\
    \ markets.\n\nAlthough the CEA gives the CFTC exclusive jurisdiction only over\
    \ derivative markets, the CFTC has historically had anti-fraud and anti-manipulation\
    \ enforcement authority over certain spot markets (see box at right). That exercise\
    \ of jurisdiction over spot markets is based, in part, on how fraud and manipulations\
    \ in spot markets can generate profits in derivative markets.\n\n| Spot MarketsIn\
    \ a spot market, tangible assets like commodities and securities are traded for\
    \ immediate delivery and payment. They are called spot markets because transactions\
    \ are executed and settled \"on the spot.\" |\n\n| --- |\n\nIn a derivatives market,\
    \ derivatives contracts (see box below) based on tangible or intangible assets\
    \ are traded.\n\n| Derivatives ContractA legal contract between two or more parties\
    \ in which the value of the contract is based on the price of an agreed-upon underlying\
    \ financial asset (like a security or a bushel of corn) or set of assets (like\
    \ an index). Derivative contracts allow investors to use leverage (other people’s\
    \ property or money) in making investments.207 For example, assume a stock was\
    \ priced at $10 per share and Bibi believes the price will increase to $17 per\
    \ share. If she wanted to make an investment in that stock, she could purchase\
    \ 100 shares of that stock for $1,000 in a spot transaction. Alternatively, she\
    \ could purchase a call option, a type of derivative that would give her the right,\
    \ but not the obligation, to purchase 100 shares of the stock for $10 per share\
    \ at some time in the future, regardless of the future price. For this example,\
    \ assume the price of the call option is $150.If Bibi were correct and the price\
    \ increased from $10 to $17, the gain from the stock position would be $700, equal\
    \ to the 100 shares × the $7 increase in price. At that point:\n\n*   if Bibi\
    \ purchased the stock, her return on investment would be 70 percent, based on\
    \ her $700 gain and her $1,000 investment;\n\n*   if she purchased the call option,\
    \ she could (1) exercise that option and buy 100 shares at the $10 contract price\
    \ (-$1,000), then (2) immediately sell those 100 shares for the current $17 price\
    \ (+$1,700). Her gain would be calculated as follows:\n\nCost of option($150)Cost\
    \ to exercise option($1,000)Sale of shares$1,700Gain$550As a result, her return\
    \ on investment would be 550 percent—a $550 gain from a $100 investment.Based\
    \ on the above example, Bibi’s 550 percent return on investment from the call\
    \ option far exceeds the 70 percent 208return she would have earned by purchasing\
    \ the stock. In a nutshell, that example explains the attraction of derivatives.While\
    \ derivatives allow investors to increase their return on investments if prices\
    \ move in their direction, they also increase the riskiness of those investments.\
    \ Using the example above, if the price of the stock remained constant:\n\n* \
    \  if Bibi purchased the stock, she would have no gain or loss, and would keep\
    \ her 100 shares of stock;\n\n*   if she purchased the call option, she would\
    \ lose her entire $150 investment, because the right to purchase something for\
    \ $10 when it is worth $10 has no value.\n\n |\n\n| --- |"
