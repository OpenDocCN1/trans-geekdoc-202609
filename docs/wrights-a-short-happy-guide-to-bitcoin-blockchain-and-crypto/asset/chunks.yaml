    Assuming the lowest credit card transaction fee (1.5 percent), using bitcoin to
    pay would be about six hundred times cheaper than using `Visa` for typical transactions.
    With that lower price, both Bibi and Chaun would prefer that Bibi pay using bitcoin
    and share the benefit of the lower cost. Moreover, if Bibi later went to Starbucks,
    Starbucks would also prefer if Bibi paid in bitcoin. In fact, as far back as 2016,
    Starbucks has allowed their customers to pay with bitcoin using the mobile app
    `IPayYou`.


    ### So . . . why isn’t everyone using it?


    A logical question at this point is, if blockchains are so much cheaper and more
    efficient, why don’t most transactions happen over the blockchain? The simple
    answer is that blockchain networks are not ready. Yet.


    ### Scalability

    One hurdle blockchain technologies must overcome before widespread adoption is
    scalability. Right now, even though transactions on the `Visa` network are about
    six hundred times more expensive than on the `Bitcoin` network, `Visa` can process
    roughly twenty-four to sixty-five thousand transactions per second, while `Bitcoin`,
    the oldest blockchain network, can process fewer than ten transactions per second.


    ### Price Volatility

    Another hurdle, at least with respect to bitcoin, is price volatility. Over the
    past few years, the price of one bitcoin (`1 BTC`) has fluctuated wildly, particularly
    in 2017. In January 2017, `BTC` prices hovered around $1,000, but by December
    2017, the price reached $20,000. With such volatility, many are understandably
    unwilling to use bitcoin for payments (a medium of exchange), and instead acquire
    and hold bitcoin as a speculative investment asset (a store of value). In the
    crypto community, slang for holding crypto instead of selling it is called “Hodl,”
    based on a rather infamous typo on a December 2013 Bitcoin Forum message board.
    Some users have made `Hodl` an acronym for “Hold On for Dear Life,” based on the
    price volatility of some crypto.


    The box below shows an extreme example of the risks of paying with bitcoin.


    | The two $50 million pizzas | On May 22, 2010, known as “Bitcoin Pizza Day,”
    Florida-based programmer Laszlo Hanyecz wanted two pizzas delivered to his home,
    and the cost was about twenty-five dollars. Hanyecz went on a Bitcoin forum and
    asked if anyone would order the pizzas for him in exchange for bitcoin. A British
    man agreed and paid the pizza joint using a credit card, and Hanyecz sent him
    10,000 BTC, at the time worth about $25. | At a January 2020 price of `1 BTC =
    $10,000`, those pizzas cost $50 million apiece. Despite the apparent loss, Hanyecz
    was untroubled by the transaction, and told the New York Times, “It wasn’t like
    bitcoins had any value back then, so the idea of trading them for a pizza was
    incredibly cool.” |

    | --- | --- |


    ### Not just money

    Although money is the clearest and most accepted application of blockchain technologies,
    the excitement in the area is not limited to its use as money. Blockchain technologies,
    borne out of the financial crisis, have broader goals. According to Vitalik Buterin,
    the founder of Ethereum (the second most well-known blockchain):


    > thethe idea was to build a new system for everything from payments and banking
    to health care and identity that was either a replacement for the old one, or
    at least an alternative to it, one that was borderless, independent of state control
    and of exploitation by Big Tech . . . The cryptocurrency space has succeeded in
    making certain aspects of the international economy more open, when politics is
    moving in the exact opposite direction . . . \[and\] that’s a meaningful contribution
    to the world.


    `Ethereum` is the world’s leading programmable blockchain, and it allows developers
    to build applications that make use of blockchain technologies (called decentralized
    applications or “ĐApps”) without having to create a new blockchain for every application.
    `Ethereum` has a native crypto called `Ether` (`ETH`), that like `BTC`, can be
    used as digital money. However, because every transaction or operation on the
    `Ethereum` network requires some amount of `ETH` (pronounced “eeth,” and often
    called `gas`), `ETH` also serves as a unit of measurement for the computational
    effort needed to execute operations on `Ethereum`’s network.


    As of the end of 2019, `Ethereum` was the leading `ĐApp` platform, though it was
    not the only one. `Tron` and `EOS` were `Ethereum`’s most significant challengers,
    and collectively, the three platforms accounted for over 98 percent of total `ĐApp`
    transaction volume.


    `ĐApps` are a critical component in the evolution of the Internet of Things (`IoT`),
    which encompasses the network of devices embedded with software, sensors, actuators,
    and connectivity to the internet which enables those devices to connect and exchange
    data, thereby creating opportunities for more direct integration of the physical
    world into computer-based systems. The promise of the `IoT` is that it will make
    the devices we use smarter, more efficient, cheaper, and more responsive, and
    will serve as a bridge to connect the digital and physical universes.


    Estimates suggest that by the end of 2020, there will be over 30 billion `IoT`
    connected devices. However today, most of those `IoT` devices rely on centralized
    communication models, which have high maintenance and infrastructure costs, a
    central point of failure, and are an attractive target for hackers (a honeypot).
    Blockchains could reduce or eliminate many of those issues, and allow `IoT` devices
    to scale to meet demand.


    # Blockchain Technologies: A Guide to the Basics


    This book provides an overview of blockchain technologies and applications, but
    is not written to provide the detailed technical specifications used by programmers
    and developers. However, because so much about the subject matter is technical,
    this chapter gives readers an overview of certain technical concepts to better
    understand the mechanics of blockchain applications.


    ### What is a blockchain?


    Many definitions exist for what a blockchain is, and while similar, very few agree
    to one definition. Here are a few:


    *   A blockchain . . . is a growing list of records, called blocks, which are
    linked using cryptography. — Wikipedia

    *   A mathematical structure for storing data in a way that is nearly impossible
    to fake. It can be used for all kinds of data. — MIT Technology Review (2018)

    *   The blockchain is an incorruptible digital ledger of economic transactions
    that can be programmed to record not just financial transactions but virtually
    everything of value — Don and Alex Tapscott, Blockchain Revolution (2016)

    *   A blockchain is, in the simplest of terms, a time-stamped series of immutable
    record of data that is managed by cluster of computers not owned by any single
    entity. Each of these blocks of data (i.e. block) are secured and bound to each
    other using cryptographic principles (i.e. chain). — Blockgeeks.com


    For this book, the working definition is as follows:


    A blockchain is a secure, time-stamped set of immutable individual records (blocks)
    managed in a decentralized peer-to-peer network of computers (each computer is
    a node), in which there is agreement to a protocol (a set of rules), for the network
    that:


    *   allows digital information to be distributed and viewed (but not copied) across
    the network;

    *   is protected using cryptographic principles;

    *   permits the creation of new blocks to be added according to a consensus mechanism.


    A blockchain’s consensus mechanism is structured to verify and ensure:


    *   there is consensus about the entire history of the blockchain before a new
    block is added;

    *   the data in the new block does not conflict with any past data in the blockchain;
    and

    *   the actors responsible for adding new blocks to the blockchain are incentivized
    to act in the best interest of the blockchain and punished for actions contrary
    to the interests of the network.

