    Blockchain transactions include both signature data, which verifies the sender
    has the funds to make a payment (called the “witness” information), as well as
    transactional data, which details the contemplated transaction. SegWit segregates
    that signature data (the witness information) from the transactional data. Because
    signature data make up roughly 65 percent of the data in a typical transaction,
    SegWit greatly reduced the amount of data needed to consummate a transaction,
    allowing more transactions to fit into each block, thereby increasing the blockchain’s
    transactional capacity. Broadly speaking, SegWit allows a `1 MB` Bitcoin block
    to perform like a more secure `4 MB` block.


    Although SegWit appears to have reduced Bitcoin’s scalability problems, its implementation
    was not without controversy. Without delving into the technical details, removing
    the witness data from a block could make it more difficult to demonstrate a transaction
    actually happened. The disagreements regarding SegWit was one of the factors that
    led to the first contentious Bitcoin chain split and the creation of Bitcoin Cash
    (`BCH`).


    As discussed above, at around the time of the integration of SegWit, some in the
    Bitcoin community believed a better solution to scaling was to increase the block
    size. After a very public debate, however, the Bitcoin community decided not to
    increase the block size and only implement SegWit. That decision caused a group
    of miners, developers, and activists to fork the Bitcoin blockchain and split
    off at a point before SegWit was implemented. The new chain, called Bitcoin Cash,
    had the same pre-SegWit history of Bitcoin, but allowed for up to an `8 MB` block
    size (compared to `1 MB` for Bitcoin). After the hard fork, anyone who owned `BTC`
    also owned an identical amount of `BCH`.


    ## Lightning


    ![Lightning Network: Bitcoin micropayments | Blockstream](Image_24.jpg)


    The Lightning Network is a second layer protocol that offers another solution
    to the Bitcoin scalability problem. Lightning works by:


    * identifying a portion of relevant data from the blockchain;

    * moving that data off the blockchain (off-chain);

    * executing transactions using that off-chain data;

    * reconciling all the off-chain transactions; and

    * integrating the reconciled transactions back onto the blockchain.


    Individual transactions using the Lightning Network (Lightning transactions) are
    not recorded on the blockchain (on-chain), which frees up the blockchain to perform
    other tasks. Instead, those Lightning transactions are verified and recorded off-chain,
    and at some later point, the net result of those Lightning transactions are reconciled
    on-chain.


    Lightning works by allowing users to open second layer payment channels, then
    executing transactions off-chain using those channels. Once all the transactions
    for a particular channel are completed, those payments are netted and reconciled,
    and the channel is closed. Once closed, the record of all the transactions in
    the channel while it was open are reconciled and recorded on-chain.


    ### Example of Lightning Network transactions


    Assume Bibi and Chaun regularly bought and sold goods to each other. To avoid
    recording each transaction on the blockchain, they could set up a payment channel
    by each of them moving `$100` from the blockchain to their payment channel. At
    that point, they could buy and sell with each other using their payment channel,
    without the need to record each transaction on the blockchain.


    It would work like this, assuming they both open a four-day payment channel on
    Sunday and moved `$100` each onto the channel:


    * On Monday, Bibi sends Chaun `$40`.

    * On Tuesday, Chaun sends Bibi `$50`.

    * On Wednesday, they close the channel.


    Once the channel is closed, the payments would be netted:


    * Bibi: `$100 − $40 + $50 = $110`.

    * Chaun: `$100 + $40 − $50 = $90`.


    The information from the closed channel would be sent back to the blockchain with
    instructions to send `$110` to Bibi’s account, and `$90` to Chaun’s account. The
    benefit of the Lightning network is it obviates the need for the network to record
    and verify the underlying Monday and Tuesday transactions.


    Many see Lightning as a way to allow bitcoin to be used to make everyday transactions.
    The benefits include lower transactions costs, as the entire network does not
    need to handle each transaction, and greater network capacity, as these off-chain
    transactions will not clog up the network and allow more transactions to be processed.
    That capacity is most beneficial for microtransactions and IoT uses, in which
    instructions can be sent to internet-connected devices to perform certain tasks.


    According to `1ML`, a Lightning Network search and analysis engine, at the end
    of 2019, the Lightning Network had a network capacity of roughly `850 BTC`, eleven
    thousand nodes, and thirty-five thousand payment channels and a median base fee
    of `1 Satoshi` (one-hundred millionth of a bitcoin). However, as with most things
    in life, the devil is in the details. A few of the problems identified in the
    Lightning network are as follows:


    * **Locked-up funds**: As shown in the previous example, Lightning Network users
    need to deposit funds in a channel, which means those funds are locked up on the
    channel until it closes. The longer a channel is open and the more transactions
    it executes, the more efficient it is at getting transactions off the blockchain
    and making the network more efficient. However, that also increases the risk of
    changing prices. For example, if a user has a channel that stays open for one
    week and wants to sell because the price of `BTC` crashes for some reason, that
    user is locked in until the channel closes.

    * **Centralization**: Whether Lightning will increase centralization, thereby
    making the network generally less secure and more vulnerable to attack, is a much-debated
    question. The centralization argument is based, in part, on the belief that what
    will evolve is a form of hub-and-spoke centralization (Figure A).


    ![](Image_25.jpg)


    In a nutshell, this argument claims that to connect different users with different
    channels, what will emerge is a hub-and-spoke system where many users connect
    to the same hubs so that they can transact with one another. Thus, those hubs
    will be easier to attack, and the parties in control of the payment channels operating
    those hubs will have too much control over the network.


    ![](Image_26.jpg)


    Others argue that the risk of hub and spoke centralization is overblown, and what
    will likely emerge is a form of a hot potato distributed network (Figure B). In
    a nutshell, in a hot potato distributed network, each node passes a transaction
    to the next node willing to take the transaction closer to its destination, using
    what is called source and onion routing. Source routing means the payment sender
    constructs the route of the payment. Onion routing means that for multi-hop transactions
    (hot potatoes), the intermediate nodes along the way only know the identities
    of two parties: the party that transferred the payment in and the next party to
    receive the payment. The ultimate destination will be the only node that knows
    the payment will stop there. Source and onion routing allow the source and ultimate
    destination of the payment to track the payment, while still protecting their
    identities, thereby enhancing privacy and censorship resistance.


    ![](Image_27.jpg)


    The answer, as with many things in life, may fall in the middle. What may emerge
    is a decentralized network (Figure C) that has attributes of both the hub-and-spoke
    centralization in Figure A and the hot potato distributed networks in Figure B.

