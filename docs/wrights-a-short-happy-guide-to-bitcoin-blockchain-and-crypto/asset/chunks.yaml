    That definition may not be perfect, but it works for the vast majority of public
    blockchains. In order to unpack that definition, some of the terminology used
    is explained below.


    ### Key Terminology


    **Secure, time-stamped, immutable records.** Every historical record on a blockchain
    includes the exact date and time a transaction was executed, and those historical
    digital records cannot be changed absent extraordinary circumstances. The records
    are immutable because all computers on the network (`nodes`) have a copy of all
    historical transactions (`blocks`) that anyone can view in real time, and there
    must be agreement of the state of history before another block can be added to
    the blockchain. Because those historical blocks are distributed across an entire
    network of computers, falsifying even one historical record would mean falsifying
    the entire blockchain.


    **Decentralized peer-to-peer network.** The digital history of the blockchain,
    which includes records of all previous transactions, are shared among all nodes.
    That allows the network to be decentralized because no one party or central authority
    has the power to control the blockchain.


    **Miners.** The combination of special-purpose software, powerfully designed hardware,
    and users who add blocks to a proof of work blockchain (described below) only
    after solving a complex cryptographic puzzle.


    **Node.** A device connecting to the blockchain network such as a computer (or
    phone or printer, so long as it has an IP address and is connected to the internet)
    that supports the network by (1) maintaining a copy of the blockchain, (2) validating
    transactions, and sometimes (3) processing transactions. However, not all nodes
    are the same. Generally, there are two types of nodes:


    *   **Full nodes** store a copy of the entire blockchain, including all past transactions.
    Full nodes require a lot of storage and memory dedicated to the blockchain.

    *   **Light nodes** store only a part of the blockchain, typically only the parts
    of the blockchain the user will need. To ensure the information on a light node
    is accurate, light nodes often periodically query full nodes to verify the accuracy
    their information.


    **Protocol.** The set of rules that governs actions on the blockchain. Those rules
    define what software is used, how the blockchain will operate, and how the nodes
    will communicate.


    **Consensus.** The problem of reaching consensus among a distributed network of
    actors has long been an unsolved computer science problem, and, in some respects,
    Bitcoin solved it. The problem is often represented as the Byzantine Generals’
    Problem, described below.


    ### The Byzantine Generals’ Problem


    This situation can be expressed abstractly in terms of a group of generals of
    the Byzantine army camped with their troops around an enemy city. Communicating
    only by messenger, the generals must agree upon a common battle plan. However,
    one or more of them may be traitors who will try to confuse the others, leading
    to an uncoordinated attack and defeat. The problem is to find an algorithm to
    ensure that the loyal generals will reach agreement.


    ![](Image_5.jpg](Image_6.jpg)

    Graphic credit: [https://medium.com/@paul_12056/byzantine-generals-problem-ff4bdc340e56]


    The Bitcoin whitepaper provided the first practical solution to the Byzantine
    Generals’ Problem: its proof of work consensus mechanism, described more fully
    below.


    ### Consensus mechanism


    Consensus mechanisms (sometimes called consensus protocols) are the specific rules
    that determine how a distributed group of nodes reaches consensus on verifying
    transactions and adding new blocks to the blockchain. Consensus mechanisms try
    to solve what Vitalik Buterin, the founder of Ethereum, has called the “scalability
    trilemma,” i.e., a protocol that is secure, scalable, and decentralized.


    *   **Secure:** How immutable and resistant to attack is the blockchain.

    *   **Scalable:** How many transactions the network can handle, and how quickly
    it can process those transactions.

    *   **Decentralized:** How concentrated is control over the blockchain. Decentralization
    is a core principle of blockchain technologies, allowing them to be censorship-resistant,
    and reducing or eliminating central points of failure.


    ![https://cdn-images-1.medium.com/max/600/1*JxrKTU2QczIo_kr1FcKKCg.png](Image_7.jpg)

    (Image from [https://medium.com/logos-network/everything-you-know-about-the-scalability-trilemma-is-probably-wrong-bc4f4b7a7ef].)


    Increases in any one corner of the scalability trilemma generally come at the
    expense of the other two. In many respects, the scalability trilemma is similar
    to the problem faced by those in need of a home-improvement contractor. Those
    contractors, by and large, face a similar trilemma: the work can be done fast,
    cheap, or well. Increases in any two come at the expense of the third.


    ### Consensus Mechanisms


    There are three major consensus protocols in use today: proof of work, proof of
    stake, and delegated proof of stake.


    #### Proof of work (PoW)


    PoW is the original consensus protocol and regarded as Bitcoin’s greatest innovation
    because it solved the Byzantine Generals’ Problem. PoW is used by both Bitcoin
    and Ethereum, although Ethereum has announced plans to switch to a proof of stake
    system in the future.


    Generally, in PoW, miners look for transactions broadcast over the network and
    organize those transactions into blocks. The miners then compete with one another
    to add their block to the blockchain. The winning miner earns a block reward,
    which is a set amount of the network’s tokens.


    The competition involved in the PoW system is that the block reward is awarded
    only to the first miner to solve a complicated problem, called a cryptographic
    hash function. Without going into a rabbit hole of computer science and math,
    the only way to solve the hash function is by throwing a lot of computing power
    at it. After several trillion tries of all possible combinations (called brute-force
    computing), one or more miners will solve the hash function. At that point, the
    first miner to solve the hash function is chosen to add the next block (if more
    than one miner solved the hash function, one miner is picked at random to add
    the next block). Once the new block is added, which happens roughly every 10 minutes
    in the Bitcoin network, the miners go back to work trying to solve the next hash
    function.


    Why do the miners spend all this computing power trying to solve the hash functions?


    Good question. They do it for the block rewards. At the January 2020 price of
    $10,000 per BTC, the Bitcoin block reward was 12.5 BTC, so each block reward was
    worth $125,000. Because roughly 144 blocks are added per day, when BTC is trading
    at $10,000, block rewards generate roughly $14.4 million of value per day. The
    higher the price of bitcoin, the more incentive miners have to try and solve the
    hash function. The Bitcoin network has a mechanism in place, called a difficulty
    adjustment, to change the difficulty of its hash function based on the computing
    power of active miners working to solve the hash, called the network’s hash power.
    The difficulty adjustment is programmed to adjust every 2016 blocks, or roughly
    every two weeks, to ensure that the network continues to create new blocks roughly
    every ten minutes.


    #### Cryptographic principles in PoW


    Without diving too deeply into game theory and cryptography, hash functions typically
    take an input string of any size, perform an operation on that string, and output
    a unique string of a fixed size. One important property of a hash function is
    that any change to the input string will generate a completely different output
    string.

    '
