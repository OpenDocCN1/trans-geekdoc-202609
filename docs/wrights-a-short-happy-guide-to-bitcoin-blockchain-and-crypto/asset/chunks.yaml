- raw: "If all the gold mined throughout history were in one place, it would fit into\
    \ a cube sixty-eight feet (twenty-one meters) on all sides, and would fill about\
    \ four Olympic-sized swimming pools. At current valuations, all that gold is worth\
    \ about $7.8 trillion.\n\nGold: The World’s Money\n\nFor the past few thousand\
    \ years or so, prior to the advent of paper money, gold served as the primary\
    \ world money. Gold was mined in Nubia (modern day Sudan and Egypt) from as far\
    \ back as 4000 BCE. At first, gold was traded by weight and served as a unit of\
    \ account for payment.\n\nAround 550 BCE, the first gold coins were minted using\
    \ electrum, a natural alloy of gold and silver found in modern-day western Turkey.\
    \ Gold continued to be used as money through the centuries, and the thirst for\
    \ gold led many Europeans to plunder both Africa and the Americas without regard\
    \ for the human costs of their actions. Historical records indicate that the Portuguese\
    \ first enslaved Africans to mine gold as far back as 1470, and European slavers\
    \ continued to use enslaved Africans to mine gold well into the 19th century.\n\
    \nTowards the end of the 17th century, European banks and governments began to\
    \ introduce paper money exchangeable into gold. Because gold backed so many forms\
    \ of money around the globe, it became the de facto world reserve currency.\n\n\
    | 78 Paper Money![](Image_37.jpg)Paper money was first created by the Chinese\
    \ during the Tang Dynasty, well before paper money was used in Europe. During\
    \ his service to the Mongol Khan Kublai in the late 1200s, Marco Polo noted the\
    \ use of paper money throughout what is now modern-day China. |\n\n| --- |\n\n\
    Gold’s use as a reserve currency lasted until the latter half of the 20th century,\
    \ when most governments began to issue fiat money that was not backed by anything\
    \ other than the full faith and credit of the government.\n\nToday, the US dollar\
    \ has replaced gold and serves as the world’s primary reserve currency. At the\
    \ end of 2019, US dollars accounted for roughly 62 percent of all known central\
    \ bank foreign exchange reserves, 47 percent of global payments, as well as 88\
    \ percent of foreign exchange trading. Understanding how the dollar replaced gold\
    \ as the world’s reserve currency requires an understanding of the 1944 Bretton\
    \ Woods agreement.\n\nBretton Woods: The Short Version\n\nBefore the 1944 Bretton\
    \ Woods agreement, most world currencies were on a gold standard, meaning those\
    \ currencies were exchangeable into gold on demand. In effect, those local currencies\
    \ were IOUs from the governments that issued them, backed by a promise to deliver\
    \ gold when requested. That promise meant that a government could not, in theory,\
    \ print more paper currency at will; it could only print as much currency as it\
    \ held in gold reserves.\n\nI can’t be overdrawn; I still have more checks!\n\n\
    —Old Joke\n\n79 \n\nHowever, limits on printing money are like limits on writing\
    \ checks: although it is imprudent to write checks in amounts greater than held\
    \ in a bank account, people do it all the time. The same has been true for governments.\n\
    \nDuring World War I, many countries realized that they needed more money to finance\
    \ their war efforts than they had in gold reserves, and abandoned the gold standard\
    \ by printing more currency than they held in gold reserves. Those actions increased\
    \ the money supply. However, the increase in money supply coupled with the decrease\
    \ in the production and supply of goods brought on by the war efforts led to inflation.\n\
    \nAfter the war, many countries returned to the gold standard. However, a little\
    \ over a decade after the end of World War I, the 1929 stock market crash and\
    \ Great Depression created a world financial crisis. That crisis prompted many\
    \ individuals and speculators to try to acquire gold, viewing it as a store of\
    \ value during a difficult financial period. As a result, both the demand for,\
    \ and the price of, gold increased dramatically.\n\nTen years after the Great\
    \ Depression, World War II erupted, which put increased stress on the world’s\
    \ financial system, and those financial stresses continued throughout the war.\
    \ Toward the end of World War II in 1944, the 44 Allied World War II nations gathered\
    \ in Bretton Woods, New Hampshire, to address the world financial crisis. That\
    \ gathering established the international monetary policy framework called the\
    \ Bretton Woods system.\n\nThe goal of Bretton Woods was to provide a framework\
    \ of monetary and financial stability to foster economic growth and international\
    \ trade. That framework was responsible for the International Monetary Fund and\
    \ the World Bank, and lasted until the early 1970s.\n\nAs part of the Bretton\
    \ Woods system, the Allied Nations agreed to peg their exchange rates to the US\
    \ dollar, meaning their currencies 80would be exchangeable into a set amount of\
    \ US dollars. In exchange, the United States agreed to convert dollars into gold\
    \ on demand.\n\nWhen the Bretton Woods system was implemented, the United States\
    \ held approximately 75 percent of the world’s gold supply. Interestingly though,\
    \ US citizens were prohibited from owning gold at the time. In 1933, President\
    \ Franklin Delano Roosevelt issued Executive Order 6102, making it illegal for\
    \ US citizens to own gold, either in coins or in bars. The order generally required\
    \ all citizens to hand over their gold to the US government for $20.67 per ounce,\
    \ or face a ten-year prison sentence and a fine of twice the amount of gold not\
    \ surrendered. The criminal prohibition was not lifted until 1974.\n\nAs part\
    \ of the Bretton Woods system, world governments agreed to direct their central\
    \ banks to buy or sell their currencies on world foreign exchange markets to strengthen\
    \ or weaken those currencies in order to maintain the pegged exchange rates. For\
    \ example, if a country’s currency became weak (see box below for an explanation\
    \ of strong and weak currencies) relative to the dollar, the country’s central\
    \ bank could purchase its currency in foreign exchange markets to reduce supply\
    \ and raise the price of its currency relative to the dollar. Alternatively, if\
    \ a foreign currency strengthened relative to the dollar, the central bank could\
    \ print more currency, thereby increasing the country’s money supply and lowering\
    \ the currency’s price relative to the dollar.\n\n| “Strong” and “weak” currenciesThe\
    \ best way to explain strong or weak currencies is with an example. Assume Country\
    \ X has a currency, the “ZEX,” that is pegged ten to one to the dollar, meaning\
    \ 10 ZEX = $1.81 If country X’s currency value became weak compared to the dollar,\
    \ it would mean that more than 10 ZEX would be needed to buy one dollar. As a\
    \ result:\n\n*   Country X products would be cheaper to US consumers, giving US\
    \ consumers more purchasing power, and\n\n*   Country X exports to the US, and\
    \ US imports from Country X, would likely increase.\n\nAlternatively, if the ZEX\
    \ strengthened relative to the dollar, it would take less than 10 ZEX to purchase\
    \ one dollar. As a result,\n\n*   US products would be cheaper to Country X consumers,\
    \ giving Country X consumers more purchasing power, and\n\n*   Country X imports\
    \ from the US, and US exports to Country X, would likely increase.\n\nConflicts\
    \ over the relative strength of currencies has often led to trade wars and tariffs\
    \ on imported goods. Most economists would agree that trade wars tend to be counterproductive\
    \ for citizens of all countries engaged in them. Nevertheless, politicians can\
    \ use trade wars to reward or protect a certain industry or group, at the expense\
    \ of the citizenry as a whole. |\n\n| --- |\n\nThe Bretton Woods system effectively\
    \ ended on August 15, 1971, when the United States unilaterally abandoned the\
    \ gold standard.\n\nWhy did the United States abandon the gold standard?"
