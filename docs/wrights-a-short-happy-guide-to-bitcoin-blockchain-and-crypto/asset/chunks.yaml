    准备金银行制度是一种银行惯例，银行仅保留其一小部分存款作为准备金，以供随时提取。剩余的存款则被借给借款人。简单来说，它是能够借出大部分存款而仅保留极小比例的能力，并希望大多数存款人不会在同一时间取回资金。借出的资金会产生利息，使金融机构能够盈利。下方的方框引用了
    1946 年的弗兰克·卡普拉电影《奇幻人生》（It’s a Wonderful Life），为准备金银行制度提供了一个实际案例。


    | 《奇幻人生》解释了准备金银行制度![相关图片](img/Image_56.jpg) | 在电影最著名的场景之一，乔治·贝利（吉米·斯图特 饰）面对一群顾客，他们要求从他经营的“贝利建筑与贷款协会”社区银行取回存款，这一情节基于一个与大萧条极为相似的虚构情况。在电影中，贝利告诉人群，他无法立即给他们还钱，因为他们的存款已经投资了其他资产中，如他们和邻居的房屋以及当地业务。正如《大西洋月刊》所指出的：“电影的剧情还触及了一些仍具有现实意义的金融话题，包括银行的本质、贷款背后的哲学计算，以及美国家庭财务命运是如何交织在一起的。”——Bourree
    Lam 和 Gillian B. White，《奇幻人生》中的银行道德，《大西洋月刊》（2016 年 12 月 23 日）。 |

    | --- |


    所有银行都使用准备金银行制度来赚取利润。然而，为了确保银行具有偿付能力，联邦银行业监管规定了一个要求的比例（通常为存款的 10%），必须作为准备金保留。这
    10%的准备金要求代表了银行根据存款可借出金额的硬性限制。


    对于非银行加密货币中间机构，如果它们具有超强流动性，那么它们在借入或借出客户加密货币以盈利方面将没有法律（而非审慎性）限制。中间机构利用客户资产来获利（通常通过借入或借出这些资产）的做法被称为“再抵押”（rehypothecation）。


    金融中介有时再抵押的资产超过其持有的资产，导致所谓的“无抵押头寸”（uncovered position）——即没有由实际资产完全支撑的头寸。下面的示例 1
    和 2 展示了加密货币中再抵押和无抵押头寸的风险。


    ### 示例 1


    假设一家加密金融中间机构（`Hazard Co.`）持有 100 个 `Bibi` 的比特币（且没有其他比特币持有），但决定借给 `Chaun` 140 个比特币。在此时，`Hazard
    Co.` 将拥有一个 40 个比特币的无抵押头寸。此例例子引发了两个明显的问题：


    1) `Hazard Co.` 如何能借出比它持有的更多的加密货币？


    问得好。原因是，这 140 个比特币往往不需要真的离开 `Hazard Co.`。考虑普通的贷款：当贷款发生时，所做的只是银行记了一笔会计分目，说明借款人拥有额外资金。但资金并不一定离开了银行。此外，如果借款人用这些资金支付给银行的另一位客户，所发生的只是另一笔会计分目，从一个银行客户转移到另一个。


    2) 为什么 `Hazard Co.` 想要创建一个无抵押头寸？


    投机。在我们的示例中，`Hazard Co.` 通过向 `Chaun` 借出 140 个比特币来赚利息，尽管它只有 `Bibi` 的 100 个比特币。只要这
    140 个比特币不离开 `Hazard Co.`，这层纸牌屋就会一直屹立。


    虽然创建无抵押头寸是有风险的，但它可以是非常有利可的，因为允许金融机构对其并不拥有的资产赚取利息。然而，风险落在了客户身上，如果金融机构的风险没有回报，客户可能无法拿回资产。承担风险并将这些风险转嫁给他人被称为“道德风险”（moral
    hazard）。再抵押和道德风险都是 2008 年金融危机的导致因素。


