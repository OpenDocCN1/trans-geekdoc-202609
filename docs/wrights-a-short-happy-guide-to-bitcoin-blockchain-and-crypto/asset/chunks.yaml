    *   `soliciting purchases, sales, or offers to buy securities offered or displayed
    on their websites or portals;`


    *   `compensating employees, agents, or other persons for such solicitation or
    based on the sale 197of securities displayed or referenced on their websites or
    portals;`


    *   `holding, managing, possessing, or otherwise handling investor funds or securities;`
    or


    *   `engaging in activities the SEC, by rule, determines inappropriate.`


    Equity crowdfunding portals share similarities with donation-based crowdfunding
    portals like `Kickstarter`. However, with equity crowdfunding, investors purchase
    shares in the company instead of a product or service.


    | Reg D | How ETFs WorkShares in an ETF represent | own| :--- | :--- |


    ### Reg D


    Through `Reg D`, issuers can raise potentially unlimited amounts of money from
    the sale of restricted securities. As part of a `Reg D` offering, issuers provide
    prospective investors with offering documents explaining the offering. Three rules-based
    `Reg D` offerings are `Rule 504`, `Rule 506(b)` and `Rule 506(c)`. Each differs
    in the amount of money that can be raised, the acceptable investors, and the type
    of permissible solicitations. The provisions of each rule are outlined briefly
    below.


    ### Rule 504


    `Rule 504`, which does not preempt state law, allows an issuer to raise $5,000,000
    of restricted securities in any 12-month period. Investors in offerings under
    `Rule 504` should be informed that they may not be able to sell the securities
    for at least a year unless the issuer registers the resale transaction with the
    `SEC`. For the most part, general solicitation is prohibited in `Rule 504` offerings,
    but there is a provision in `Rule 504` that allows general solicitation based
    on state laws.


    ### Rule 506(b) and (c)


    Under `Rules 506(b)` and `(c)`, which both preempt state law, an issuer can raise
    an unlimited amount of money from selling restricted securities. The differences
    are:


    Under `Rule 506(b)`, an issuer:


    *   can sell restricted securities to an unlimited number of accredited investors
    and up to 35 non-accredited investors;


    *   cannot use general solicitation or advertising to market the restricted securities;
    and


    *   must make itself available to answer questions by prospective purchasers.


    In contrast, under `Rule 506(c)`, an issuer:


    *   can only sell restricted securities to accredited investors; and


    *   can solicit and generally advertise the offering only to accredited investors.


    Both `Rules 506(b)` and `(c)` require issuers to take reasonable steps to verify
    that the investors are accredited investors, which could include reviewing documentation,
    such as `W-2s`, credit reports, tax returns, as well as financial statements.


    ### A New Financial Product: A Bitcoin ETF


    In addition to traditional securities like stocks, the `SEC` also regulates the
    offer and sale of pooled investment products available to the general public,
    including exchange-traded funds (`ETFs`). `ETFs` are investment funds comprised
    of baskets of different securities, indexes, commodities, bonds, or other assets.
    At the end of 2019, `ETFs` had a market capitalization of over $3 trillion, with
    the top ten `ETFs` holding assets valued at over $900 billion, and over 650 million
    `ETF` shares trading daily. The box below explains how `ETFs` work.


    Shares in an `ETF` represent fractional interests in the pool of assets held by
    the `ETF`. Each `ETF` share represents a fixed percentage of the `ETF`’s asset
    value (`NAV`), so as prices of the underlying assets go up, so do the prices.
    ETFs are structured as passive investment vehicles, in contrast to mutual funds
    which trade on exchanges like the or `NASDAQ`. Because `ETFs` have no active managers,
    their expenses are typically small relative to mutual funds. The number of `ETF`
    shares is regulated through a mechanism known as creation and redemption. That
    creation and redemption mechanism relies on entities known as “authorized participants”
    who are contractually responsible for acquiring and disposing assets. The mechanism
    operates as follows:


    Creation: When the `ETF` wants to create new `ETF` shares, the `ETF` directs the
    authorized participants to first buy more of the underlying assets, and then sell
    those assets to the `ETF` for new `ETF` shares. The authorized participants then
    sell the new `ETF` shares on the open market.


    Redemption: When the `ETF` wants to reduce the number of `ETF` shares, the `ETF`
    directs the authorized participants to first buy `ETF` shares on the open market,
    and then sell those shares back to the `ETF` in exchange for the underlying assets.
    The authorized participants then sell the assets on the open market.

