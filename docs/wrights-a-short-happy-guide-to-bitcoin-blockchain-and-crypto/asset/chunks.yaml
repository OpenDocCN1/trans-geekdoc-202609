    The complete answer is a complicated mix of historical facts and bad fiscal and
    monetary policy, but the simple explanation is the US did not have enough gold
    in reserve to meet its growing obligations to deliver gold. That lack of gold
    reserves led President Nixon to cause the US to renege on its promise to back
    the dollar with gold. The facts below, in chronological order, help explain how
    the US got into that position:


    * In 1960, the US held $19.4 billion in gold reserves, and there were roughly
    $18.7 billion in dollars held outside the US.

    * During the 1960s and early 1970s, US citizens purchased increasingly more imported
    goods using dollars, but did not sell enough domestically produced goods overseas
    to bring those dollars back to the US. That created a balance of payments deficit
    with foreign governments.

    * Also during the 1960s and early 1970s, the Soviet Union began producing significant
    amounts of oil and selling that oil for dollars, thereby accumulating dollars.
    Because of Cold War tensions, the Soviets deposited their dollars in European
    banks, creating what became known as eurodollars. The term “eurodollars” now generally
    refers to all US dollar deposits held overseas.

    * As more eurodollars were held overseas, the balance of payments deficit grew,
    and foreign governments lost confidence in the US’s Bretton Woods promise to exchange
    gold for dollars.

    * By 1970, eurodollar holdings exceeded $45 billion, while US gold reserves were
    only worth approximately $14.5 billion.

    * By the early 1970s, the Nixon government was engaged in the latter stages of
    an expensive war with Vietnam. Those expense included both the costs of the war
    and the economic aid to the Saigon regime. Most estimates indicate that the war
    cost $168 billion (about $1 trillion in today’s dollars).

    * By early-to-mid 1971, the US inflation rate had risen to 5 percent, and unemployment
    had risen to over 6 percent. High inflation coupled with stagnant economic growth
    and high unemployment is called stagflation. Stagflation in the US caused, among
    a host of other domestic problems, overseas and eurodollar deposits to lose value.


    Based on the facts listed above, many world banks and governments began redeeming
    their dollar holdings for gold. In response to both the stagflation and the rising
    number of requests to exchange dollars for gold, Nixon issued an executive order
    on August 15, 1971 to (1) freeze all prices and wages for 90 days, and (2) stop
    the Federal Reserve from redeeming dollars for gold. The price controls temporarily
    reduced inflation, but within three years inflation rose to double-digit levels
    and persisted through the 1970s.


    When Nixon abandoned the gold standard, it marked the first time in modern history
    that paper money was not at least nominally backed by some asset, and introduced
    the world to fiat currencies—currencies backed only by confidence in a government.
    In theory, all fiat currencies had a value relative to other fiat currencies,
    but those values were not linked, directly or indirectly, to any particular asset.
    However, the reality was a bit different.


    ## Birth of the Petrodollar


    ### The Secret Agreement to Strengthen the Dollar

    With the end of Bretton Woods and the gold standard, a new system was needed for
    the US to maintain the dollar’s status as the world’s reserve currency. Enter
    the petrodollar.


    Shortly after the US abandoned the gold standard in 1971, the price of gold skyrocketed
    and the value of the US dollar weakened substantially. As a result, many existing
    contracts to purchase and sell oil that were priced in dollars became far less
    valuable. Then in October 1973, Arab members of Organization of the Petroleum
    Exporting Countries (OPEC) increased oil prices by over 70 percent and placed
    an embargo on exports to the US and other allies of Israel.


    The OPEC increase in the oil prices was in response to the US siding with Israel
    in the “Yom Kippur” or “Ramadan War,” after a coalition of Arab states led by
    Egypt and Syria launched an attack against Israeli positions on Yom Kippur, a
    Jewish holy day, and during Ramadan, a month of fasting in Islam.


    The war that ensued lasted less than three weeks, but the embargo had the effect
    of increasing US oil prices roughly 400 percent over the next six months, contributing
    to a US stock market collapse, and bringing on the 1973 gas crisis, which forced
    US motorists to wait in long lines to get gas. That embargo coupled with the costs
    of the Vietnam War and US government policies (including wage and price controls)
    were significant contributors to the recessions in the 1970s.


    The embargo lasted until 1974 when the Nixon administration entered into a series
    of secret military and economic agreements with the family that controlled Saudi
    Arabia to standardize oil contracts in US dollars. Those agreements had the effect
    of forcing world oil buyers to buy oil in US dollar terms, which allowed oil to
    replace gold as the de facto asset backing the dollar. In return, the Saudis agreed
    to invest those dollars back into US debt, allowing the US to more easily finance
    its spending. That system became known as the petrodollar.


    By 1975, all OPEC nations agreed to price their oil exclusively in US dollars,
    mostly in exchange for weapons and military protection. Because oil is the world’s
    most important commodity, the petrodollar helped strengthen the dollar and cemented
    its position as the world’s reserve currency.


    ### Economic and Fiscal Policy of the Petrodollar

    The petrodollar system has significant benefits for the United States and oil-producing
    countries. For the US, it increased demand for US dollars around the globe, because
    dollars are needed to purchase oil. That increased demand strengthens the dollar
    and produces a surfeit of dollars, at little or no cost, for oil-producing countries,
    many of which are governed by regimes claiming to be royal or by other generally
    autocratic and undemocratic regimes.


    The oil-producing countries that benefit from the petrodollar system often invest
    those surplus dollars in US government debt instruments, increasing demand for
    US-dollar-denominated debt. That increased demand helps keep interest rates low
    on US debt, and generally speaking, those low US interest rates encourage spending
    and investment in the US.


    Although the petrodollar system benefits both the US and the OPEC nations, those
    benefits do not extend to other nations whose monetary and fiscal policies cannot
    take advantage of the petrodollar system.


    **Monetary policy**

    Monetary policy refers to how central banks manage their country’s money supply,
    generally with four primary objectives:

    * 1) managing inflation;

    * 2) reducing unemployment;

    * 3) maintaining low, but sustainable, interest rates; and

    * 4) promoting growth.


    Governments control the money supply by printing and distributing the local currency
    or by taking that currency out of circulation. By adding too much money, they
    can create run-away hyperinflation and destroy their economy. By not creating
    enough, they could, according to theories espoused by British economist John Maynard
    Keynes, stifle growth. But by adding or subtracting the “Goldilocks” amount of
    money—not too little, not too much—Keynesian theory posits that central banks
    can both stimulate the economy and maintain economic stability.


    **Fiscal policy**

    Fiscal policy, which is related to monetary policy, refers to the use of government
    spending and taxing policies to influence economic conditions. Much modern fiscal
    policy is also based, in part, on Keynes’ theory that governments can stabilize
    the business cycle and regulate economic output by adjusting their monetary policies.
    The primary fiscal policy tools available are:

    * raising taxes (always unpopular);

    * cutting spending (similarly unpopular);

