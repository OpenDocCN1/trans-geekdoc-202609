- raw: "Another problem with the 2019 Guidance is highlighted by the July 2016 Ethereum/Ethereum\
    \ Classic fork (the ETH/ETC fork) after The DAO hack. Soon after the hack, the\
    \ Ethereum community decided to fork the Ethereum blockchain to undo the effects\
    \ of the hack. To implement the fork, the Ethereum developers identified a pre-hack\
    \ block of the Ethereum blockchain and forked the blockchain from that block.\n\
    \nThe ETH/ETC fork had the effect of reversing most of the hack’s effects on the\
    \ Ethereum blockchain, and restoring much of the ETH misappropriated by the hacker\
    \ to the original owners. However, some in the Ethereum community rejected the\
    \ hard fork, essentially arguing that an “immutable” blockchain should not have\
    \ an “undo” feature. Their response was to ignore the ETH fork, and they began\
    \ mining blocks on the original, non-229forked version of Ethereum, creating Ethereum\
    \ Classic (ETC).\n\nFrom a technical perspective, ETC would appear to be the legacy\
    \ chain. It represents the “unforked” original Ethereum chain. At the time of\
    \ the ETH/ETC fork, ETH was over 1,500 percent more valuable than ETC. During\
    \ that time, ETC opened trading in July 2016 at around $0.75, while ETH was trading\
    \ between $11.50 – $14.44, and did not change appreciably in the days following\
    \ the fork. If the 2019 Guidance (which is retroactive) is followed, taxpayers\
    \ would be required to report the entire value of their ETH holdings as a gain\
    \ at the July 2016 price, and any basis they had in the pre-forked ETH would go\
    \ to ETC. That nonsensical result is arguably required under the 2019 Guidance.\n\
    \nDoes it matter which is the “new” coin?\n\nYes. Ambiguities in tax laws makes\
    \ it more difficult for taxpayers to accurately report their income. In addition,\
    \ a significant portion of taxpayer non-compliance is attributed to tax code complexity\
    \ and ambiguity.[62](#section10.xhtml#ftn.97)\n\nWhat is the FMV of the “new”\
    \ coin?\n\nQ&A 23 in the 2019 Guidance’s FAQs states that:\n\nyou will have ordinary\
    \ income equal to the fair market value of the new \\[crypto\\] when it is received,\
    \ which is when the transaction is recorded on the \\[blockchain\\], provided\
    \ you have dominion and control over the \\[crypto\\] so that you can transfer,\
    \ sell, exchange, or otherwise dispose of the \\[crypto\\].\n\n230 \n\nThat language\
    \ does not provide clear guidance on exactly when a taxpayer will have income.\
    \ As a preliminary matter, as noted in the AICPA Letter:\n\n“chain split coins\
    \ have a zero or near-zero realizable value at the time of a split. . . \\[and\\\
    ] even if a chain split coin was considered to have a non-zero value at the time\
    \ of a chain split, taxpayers often cannot claim the coins at that time because\
    \ those coins are not supported by wallets or coin splitting services. While,\
    \ in theory, taxpayers can exercise dominion and control by selling a paper wallet\
    \ entitling the buyer to the chain split coins, in reality, taxpayers would not\
    \ actually transact in that matter because that type of market would be illiquid,\
    \ unregulated, and inefficient.”\n\nThe aftermath of the ABC/SV fork shows other\
    \ problems with the IRS approach. On the day before the fork (Nov. 14, 2018),\
    \ BCH closed at a price of $439.31. After that fork, the price of the new coins,\
    \ ABC and SV, fluctuated wildly. The charts below show the prices, in dollar terms,\
    \ of both ABC and SV during and after the fork:\n\n![](Image_63.jpg)\n\n231 \n\
    \n![](Image_64.jpg)\n\nBased on the above charts, it is unclear how taxpayers\
    \ are to determine the FMV of the “new” coin when it is “received” and “recorded”\
    \ on the blockchain. Of the array of prices in those charts, the IRS offers taxpayers\
    \ no guidance on how they should determine which price to use, how they are to\
    \ determine which is the “new” coin and when it was received, and when their ownership\
    \ was recorded on the blockchain.\n\nThe ABC and SV charts also highlight a more\
    \ practical problem: many taxpayers will be required to report income in situations\
    \ in which they have losses. For example, the value of BCH prior to the fork,\
    \ using the November 14 closing price, was $439.31. By December 8, the combined\
    \ values of ABC and SV were $202.73, a loss of over $230. However, despite the\
    \ economic loss, taxpayers would be required to report ordinary income in the\
    \ amount of the FMV of the “new” coin. Forcing taxpayers to pay taxes at ordinary\
    \ rates for phantom gains when they experience economic losses is bad public policy.\n\
    \nOther problems highlighted by the AICPA Letter are more practical. The IRS approach\
    \ would be burdensome both to taxpayers and the IRS, and would require:\n\n“the\
    \ IRS to administer, and taxpayers to apply, a realization rule that requires\
    \ a case-by-case basis to determine the time at which a particular taxpayer can,\
    \ 232or should, exercise dominion and control over unsolicited, and possibly unwanted,\
    \ property.”\n\nMoreover, trying to determine the values of that property:\n\n\
    “would create an undue burden for taxpayers and result in an unlimited number\
    \ of approaches, inconsistently applied, \\[giving taxpayers\\] a range of reasonable\
    \ approaches to determine the fair \\[market\\] value for chain splits, \\[and\\\
    ] airdrops.”\n\nIn other countries, the taxation of hard forks is handled differently.\
    \ In the UK for example, crypto received from a hard fork is not immediately subject\
    \ to income tax. Instead, no taxes are due until the crypto has been sold or exchanged.\n\
    \nTo calculate the cost basis of forked coins in the UK, taxpayers are instructed\
    \ to apportion the tax basis between the old coins and the new coins, in a “just\
    \ and reasonable” manner.[63](#section10.xhtml#ftn.98) UK law does not prescribe\
    \ any particular apportionment method; however, the standard practice in the UK\
    \ is that the basis of the old crypto is apportioned between the old and new crypto\
    \ assets in line with the market values of both on the day after the hard fork.\
    \ If the IRS adopted the UK approach, many of the problems associated with the\
    \ IRS-prescribed methods would disappear.\n\nThe 2019 Guidance concept of receipt\
    \ of airdrops is also problematic. According the Guidance:\n\n“Cryptocurrency\
    \ from an airdrop generally is received on the date and at the time it is recorded\
    \ on the distributed ledger. However, a taxpayer may constructively receive cryptocurrency\
    \ prior to the airdrop being recorded on the distributed ledger. A taxpayer does\
    \ not have receipt of cryptocurrency when the airdrop is recorded on the 233distributed\
    \ ledger if the taxpayer is not able to exercise dominion and control over the\
    \ cryptocurrency.”\n\nBased on that concept of receipt, the ability to “exercise\
    \ dominion and control over the crypto,” makes the airdrop taxable, whether or\
    \ not the taxpayer is aware of that ability.[64](#section10.xhtml#ftn.99)\n\n\
    The Congressional Letter addressed this issue, (i) noting that the 2019 Guidance\
    \ “appears to diverge from established rules in other areas,” and (ii) suggesting\
    \ airdrops be treated like the receipt of unsolicited property. The Feb. 2020\
    \ AICPA Letter also addressed the issue, noting the “IRS’s long-standing policy—actual\
    \ manifestation of acceptance of unsolicited property—has addressed the tax issues\
    \ regarding unwanted property for many decades.”\n\nIf airdrops were treated as\
    \ unsolicited property, they would not be taxable unless and until a taxpayer\
    \ manifests acceptance of the property by actually exercising dominion and control\
    \ over it. Such treatment is consistent with existing law, as noted by the AICPA\
    \ Letter:\n\nThe IRS and courts have, for many years, determined that unsolicited\
    \ property is includible as income under section 61 only when the taxpayer manifests\
    \ acceptance of the property by exercising dominion and control over it. This\
    \ treatment is appropriate for purposes of determining the tax consequences of\
    \ chain splits and airdrops for most taxpayers."
