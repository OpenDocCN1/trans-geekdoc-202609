    Since 2014, there have been at least 74 passive `BTC` forks and airdrops, meaning
    projects have issued coins to existing `BTC` holders without any participation
    from those individuals. Because those existing `BTC` holders were “able to” exercise
    dominion and control over those airdropped coins, according to the 2019 Guidance,
    those taxpayers were required to report the `FMV` of the airdropped coins as ordinary
    income, whether or not the taxpayers knew about the airdrops. Also problematic
    is the fact that many of those projects failed, resulting in worthless coins.
    As a result, taxpayers are faced with a tax on property they did not ask for,
    never used, and which later may become worthless.


    To make matters worse for taxpayers, `Revenue Ruling 2019–24` applies retroactively,
    and provides no safe harbors or transition relief. As a result, to comply with
    the 2019 Guidance, taxpayers may need to file amended returns at least three years
    back (six in certain circumstances).[65](#section10.xhtml#ftn.100) For holders
    of `BTC`, that means they would have to file returns that included any of those
    74 airdrops that were not worthless when dropped, whether or not those airdropped
    coins later became worthless.


    The `AICPA Letter` also addressed the retroactivity of the `Revenue Ruling`, noting
    that, “Treasury and the IRS should issue proposed regulations before publishing
    guidance that is retroactively effective.” The `AICPA` recommended providing a
    safe harbor for taxpayers, giving them transition relief for tax years prior to
    the 2019 Guidance.


    ## The Weakness of Tax Guidance


    One core problem with the 2019 Guidance is that it does not carry the force of
    law or regulation, meaning many of the issues it addresses may ultimately be decided
    by either the courts or Congress. Moreover, as noted in the `AICPA Letter`, guidance
    through `FAQs` is unreliable and “can change at any time and without notice.”
    In addition, unlike `FinCEN` and `SEC` guidance, `IRS` guidance is easier and
    far less costly to challenge.


    Although revenue rulings like `Rev. Rul. 2019–24` are official `IRS` interpretations
    of the `Code`, courts are not bound to follow them. Traditionally, courts apply
    what is known as `Skidmore deference` to revenue rulings, meaning that courts
    will look to the persuasiveness of a revenue ruling in making a decision. In contrast,
    tax regulations are afforded `Chevron deference`,[66](#section10.xhtml#ftn.101)
    meaning, in general, courts will follow an `IRS` position regardless of whether
    the court might believe another position is better, so long as the `IRS` position
    is reasonable.


    If a taxpayer disagrees with `IRS` guidance, the taxpayer can report a transaction
    inconsistent with the `IRS` guidance and wait to see whether the `IRS` will challenge
    the taxpayer’s method of reporting. That, in turn, puts the burden on the `IRS`
    to first identify the inconsistent treatment among the millions of returns it
    has to process, then determine whether it should challenge the taxpayer. If hundreds
    or thousands of taxpayers make inconsistent reports, the `IRS` faces the dilemma
    of how to defend its position for all such taxpayers, and often offers settlements
    for pennies on the dollar instead of litigating all such challenges.[67](#section10.xhtml#ftn.102)


    When the `IRS` challenges a taxpayer’s reporting method, it must expend resources
    determining the facts and negotiating with each such taxpayer, an expensive proposition
    even for the `IRS`. Moreover, before paying the tax, each of those taxpayers can
    challenge any ultimate `IRS` determinations by petitioning the `US Tax Court`,
    who are not bound by `IRS` determinations. Alternatively, after paying the tax,
    taxpayers can sue for refund in federal court, and those courts are also not bound
    by `IRS` determinations.


    In either case, if a court sides with the `IRS`, the costs to the taxpayer are
    generally only the back taxes and the cost of the challenge. So long as the taxpayer’s
    position is reasonable, it is unlikely penalties will be imposed. As a result,
    taxpayers often view taking risky tax positions as a gambit, with the worst outcome
    being discovery by the `IRS` and payment of the tax three-to-six years down the
    road. That, coupled with the relatively small chance of detection (the `IRS` audited
    about 0.59 percent of individual returns in 2018), means that many taxpayers will
    at least entertain the idea of taking that gambit.


    Another weakness of `IRS` guidance is that the costs of challenging it pales in
    comparison to the costs involved in challenging the `SEC` or `FinCEN`. Both agencies
    have the power to levy fines or bring criminal charges against individuals and
    entities they believe violate their guidance. As a result, the costs of squaring
    off in court against the `SEC` or `FinCEN` will often dwarf the costs of challenging
    the `IRS`. For example, it has cost over $5 million to defend itself against the
    `SEC` (as described in `Securities Law` chapter), and required thousands of hours
    of lawyers’ time analyzing myriad legal and factual issues.


    It makes little sense for the `IRS` to issue unclear guidance that will encourage
    taxpayers to challenge it, forcing the `IRS` to waste precious resources on a
    self-inflicted wound. Hopefully, the `IRS` will adopt the `AICPA` recommendation
    and issue guidance in the form of proposed regulations and allow a period for
    public comment. This process.[68](#section10.xhtml#ftn.103)


    ## IRS Enforcement


    While the `IRS` did not issue much in the way of guidance prior to 2019, it nonetheless
    worked to ensure that the tax laws were enforced with respect to crypto. For example,
    in November 2016, the `IRS` issued a `“John Doe” summons` to `Coinbase`, seeking
    information about Coinbase customers’ crypto transactions.


    ### What is an IRS John Doe Summons?


    A `“John Doe” summons` is an order that does not seek information about an identifiable
    person, but instead identifies a particular activity, and seeks information about
    persons or entities engaged in that activity. John Doe summonses are often used
    when the `IRS` believes taxpayers are engaged in improper conduct and can identify
    the types of transactions, but cannot identify the individual taxpayers. Under
    `Section 7609(f)` of the `Code`, in order to obtain a John Doe summons, the `IRS`
    must convince a federal judge that1)the summons relates to the investigation of
    an ascertainable group or class of persons;2) exists a reasonable basis for believing
    that such group or class of persons may have failed to comply with US tax laws;
    and3)the information sought by the summons is not readily available from any other
    source.


    In the summons issued to `Coinbase`, the `IRS` asked for:


    *   complete user profiles, history of changes to user profiles from account inception,
    complete user preferences, complete user security settings and history (including
    confirmed devices and account activity), complete user payment methods and any
    other information related to the funding sources for the account/wallet/vault,
    regardless of date;

    *   all records of account/wallet/vault activity including transaction logs or
    other records identifying the date, amount and type of transaction (purchase/sale/exchange),
    the post-transaction balance, the names or other identifiers of counterparties
    to the transaction, requests or instructions to send or receive bitcoin;

    *   where counterparties transact through their own `Coinbase` accounts/wallets/vaults,
    all available information identifying the users of such accounts and their contact
    information.

