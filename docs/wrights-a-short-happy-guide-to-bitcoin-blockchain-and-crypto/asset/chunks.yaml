- raw: "That definition may not be perfect, but it works for the vast majority of\
    \ public blockchains.[3](#section8.xhtml#ftn.3) In order to unpack that definition,\
    \ some of the terminology used is explained below.\n\nSecure, time-stamped, immutable\
    \ records. Every historical record on a blockchain includes the exact date and\
    \ time a transaction was executed, and those historical digital records cannot\
    \ be changed absent extraordinary 13circumstances. The records are immutable because\
    \ all computers on the network (nodes) have a copy of all historical transactions\
    \ (blocks) that anyone can view in real time, and there must be agreement of the\
    \ state of history before another block can be added to the blockchain. Because\
    \ those historical blocks are distributed across an entire network of computers,\
    \ falsifying even one historical record would mean falsifying the entire blockchain.\n\
    \nDecentralized peer-to-peer network. The digital history of the blockchain, which\
    \ includes records of all previous transactions, are shared among all nodes. That\
    \ allows the network to be decentralized because no one party or central authority\
    \ has the power to control the blockchain.\n\nMiners.[4](#section8.xhtml#ftn.4)\
    \ The combination of special-purpose software, powerfully designed hardware, and\
    \ users who add blocks to a proof of work blockchain (described below) only after\
    \ solving a complex cryptographic puzzle.\n\nNode. A device connecting to the\
    \ blockchain network such as a computer (or phone or printer, so long as it has\
    \ an IP address and is connected to the internet) that supports the network by\
    \ (1) maintaining a copy of the blockchain, (2) validating transactions, and sometimes\
    \ (3) processing transactions. However, not all nodes are the same. Generally,\
    \ there are two types of nodes:\n\nFull nodes store a copy of the entire blockchain,\
    \ including all past transactions. Full nodes require a 14lot of storage and memory\
    \ dedicated to the blockchain.\n\nLight nodes store only a part of the blockchain,\
    \ typically only the parts of the blockchain the user will need. To ensure the\
    \ information on a light node is accurate, light nodes often periodically query\
    \ full nodes to verify the accuracy their information.\n\nProtocol. The set of\
    \ rules that governs actions on the blockchain. Those rules define what software\
    \ is used, how the blockchain will operate, and how the nodes will communicate.\n\
