    An often-used example of a hash function is a website password: you make up a
    password and enter it, and the website performs a hash function on your password
    and stores the output of that hash function. The hash function does not care how
    long your password is, because no matter the length, it will create a unique,
    fixed number output based on your password, and that output is stored. Then, the
    next time you try to log on and enter your password, the website runs the same
    hash function and compares the output with what it has stored. If the output matches,
    you are able to log on.


    It’s simple ain’t it, but quite clever.


    —Erik B. & Rakim, Move the Crowd (1987)


    ### Bitcoin Mining and Hash


    In Bitcoin mining, the hash function is called `Secure Hashing Algorithm 256`
    (`SHA-256`). The input for `SHA-256` includes:


    * the data containing the new, not-yet-confirmed transactions grouped together;

    * data relating to previous blocks;

    * current time and date information.


    The output hash is a unique 256-bit string of data based on those inputs. For
    security reasons, the protocol often requires double hashing, to ensure that an
    attacker cannot produce the same hash with a different input. In order to ensure
    that the hash is sufficiently secure, the Bitcoin network adds some data (a `NONCE`—short
    for a Number that can only be used ONCE) to ensure the hash of the block will
    contain a series of leading zeroes. This is when the miners get to work.


    The miners must generate a hash with the correct information about the new block
    and the `NONCE` so that it matches what the network has produced. The first miner
    to find that hash, then have it verified and accepted by the network, gets to
    add the next block and receives the block reward.


    #### How do the miners find the right NONCE?


    **Brute force**: they program their computers to couple different `NONCEs` with
    the correct block data until they find a combination with the correct number of
    leading zeros. In early 2020, Bitcoin required a string of about eighteen leading
    zeros, and the difficulty of finding the right one was about one in six trillion.
    Once a solution is found, the miner broadcasts the solution to the other nodes,
    who must verify it. After the other nodes have verified the solution (achieving
    consensus), that miner will be entitled to the block reward.


    #### How secure is this?


    Very. For now. To “crack” a Bitcoin hash (note: “crack” is used because explaining
    in detail what hacking Bitcoin means would require an additional chapter), an
    algorithm would have to use the original data and run `2^56` computations (that
    is a 78-digit number, about 115 quattuorvigintillion, give or take). Some have
    speculated that a supercomputer trying to crack the hash, performing 15 trillion
    calculations per second, would take about 0.65 billion (yes, that’s a billion
    billion) years to crack it.


    A more realistic threat is quantum computers. Current estimates are that it would
    take “only” `128 / 3` (about 13.5 million) basic quantum operations to be able
    to crack a Bitcoin hash. While quantum computers are currently mostly science
    fiction, current estimates are that by 2027, a quantum computer could crack Bitcoin
    within the ten-minute time period needed to create a new block.


    Whether quantum computers pose a real threat to Bitcoin is doubtful. Among the
    reasons are:


    * developers and researchers are already working on quantum-resistant solutions;
    and

    * when quantum computers advance to the point that cracking Bitcoin is possible,
    quantum cryptography will likely not be far behind to eliminate the threat.


    A more practical reason to doubt the threat is that if a quantum computer could
    crack Bitcoin, it could also crack all other programs and institutions that rely
    on cryptography, including almost all governments and banks. An attack on those
    institutions would be a far more financially attractive proposition than an attack
    on Bitcoin.


    ### Pros and cons of PoW


    The most-cited benefits of `PoW` are:


    * **Decentralization**. `PoW` systems are decentralized because thousands of computers
    run full nodes, each with a copy of the entire blockchain. In early 2020, estimates
    indicated there were over eleven thousand full Bitcoin nodes.

    * **Security**. `PoW` networks are believed to be secure because they can only
    be corrupted by a group of miners who collude and coordinate an attack using 51
    percent of the networks’ hash power (called a 51 percent attack). A 51 percent
    attack would allow the colluders to double-spend bitcoins, cancel transactions,
    and/or transfer others’ bitcoins to their own accounts. In April 2020, according
    to `blockchain.com`, the two largest Bitcoin mining pools, run by `Poolin` and
    `F2Pool`, controlled roughly 39 percent of Bitcoin’s hash power. To launch a 51
    percent attack, the top three mining pools (or the right combination of the top
    four) would have to agree to collude. That scenario is unlikely (though not impossible)
    because after such an attack was discovered, all tokens would lose value, and
    other stakeholders in the Bitcoin network (and governments) would likely act to
    punish the attackers. In effect, an attack on a mature `PoW` network would cost
    more money than attacker would be able to steal.


    The most-cited costs of `PoW` are:


    * **Energy Consumption**. Many claim that having all those computers solve hash
    functions wastes energy and is harmful to the environment. Estimates are that
    Bitcoin’s current estimated annual electricity consumption is 69.17 terawatts
    per year, enough to power 6.4 million US households and the annual energy consumption
    of the Czech Republic. Whether that energy is wasted, however, is a value judgment.
    In 2019, global crypto revenues were $5.4 billion, and generated $500 million
    in profits. In addition, 75 percent of the energy required to mine bitcoin came
    from renewable sources, making it one of the cleanest large-scale industries.

    * **Scalability**. Because full nodes need to reach consensus before a new block
    can be added, which takes around ten minutes, `PoW` is slow compared to Visa,
    as well as some of other consensus protocols.

    * **Incentives**. In `PoW`, only the miners are directly incentivized to secure
    the network, leaving other stakeholders, such as users and developers, outside
    the process.


    ### Proof of stake (PoS)


    `PoS` was the first widely adopted alternative process for verifying transactions
    on the blockchain. In `PoS`, the creator of a new block (validator or forger)
    is chosen by an algorithm among a group of people who are able to put up, or stake,
    some portions of the tokens they hold, akin to a lottery. Validators earn transaction
    fees for adding new blocks, and the more tokens potential validators stake, the
    greater their chance of being selected.


    Attacks are possible in `PoS` systems, but under different circumstances than
    `PoW`. Some theories suggest a hacker would need as little as one percent of the
    tokens in circulation to mount an attack. However, in reality, such an attack
    would be exceedingly difficult to accomplish on a mature blockchain. In addition,
    in a `PoS` system, validators have less incentive to launch an attack because
    they would (1) lose their staked tokens and (2) devalue the tokens they own if
    the network lost value.


    ### Pros and cons of PoS


    The most-cited benefits of `PoS` are:


    * **Scalability & Speed**. The entire network is not needed to validate a transaction,
    only a few validators. That allows the network to process transactions faster.

    * **Energy Consumption and Costs**. Because there is no mining, there is also
    no need to buy and update expensive computers and chips to run mining software.
    In addition, there is no significant energy consumption required to operate the
    network.

    * **Incentives**. In `PoS`, anyone willing to stake tokens may earn transaction
    fees, which widens the group incentivized to secure the network.


    '
