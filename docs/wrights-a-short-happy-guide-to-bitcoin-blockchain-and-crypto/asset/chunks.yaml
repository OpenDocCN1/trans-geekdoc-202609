    The street name system also provides protection against a broker’s insolvency,
    in two ways:


    1. When a firm faces liquidation, regulators, including the `SEC` and `FINRA`,
    work to ensure that customers’ securities are transferred to another firm. Keeping
    investments in street names may facilitate that process because beneficial ownership
    information is centralized.

    2. As part of the street name system, the `Securities Investor Protection Corporation`
    was organized to provide insurance to customers in the event of a broker’s insolvency.


    Much of this section, and the examples provided, is based on Caitlin Long’s article,
    `Two Things That Don''t Mix Well: Bitcoin Rehypothecation And Chain Forks`, `Forbes`
    (Aug. 21, 2018).


