    \ |\n\nCrypto-Backed Stablecoins\n\nCrypto-backed stablecoins rely primarily on\
    \ other types of crypto as collateral, instead of fiat currencies of other non-digital\
    \ assets. Most crypto-backed stablecoins are also decentralized, meaning there\
    \ is no need for a centralized third-party (like those who control Tether) to\
    \ maintain the stablecoin’s peg.\n\nTo minimize the impact of volatility, stablecoin\
    \ projects use myriad mechanisms to create price stability, but almost all rely\
    \ on overcollateralization as a primary means to maintain their pegs. The 115following\
    \ simplified example demonstrates how overcollateralization works.[10](#section9.xhtml#ftn.29)\n\
    \nStablebucks: The Short & Happy Stablecoin\n\n![](Image_46.jpg)Let’s assume Chaun,\
    \ the project developer, creates a crypto-collateralized stablecoin project using\
    \ smart contracts named “Stablebucks,” which requires 200 percent (two-to-one)\
    \ overcollateralization using bitcoin. Chaun designs the Stablebucks so that each\
    \ Stablebuck is pegged to the dollar (1 Stablebuck = $1).\n\nUsers can create\
    \ Stablebucks by staking (depositing) bitcoin collateral into the system, and,\
    \ in return, receiving Stablebucks. Because of Stablebucks’ two-to-one overcollateralization,\
    \ if Bibi stakes 1 BTC into the Stablebucks smart contract (assume January 2020\
    \ price of 1 BTC = $10,000), the Stablebucks smart contract will issue her 5,000\
    \ Stablebucks, worth $5,000.\n\nTo ensure that the Stablebucks always are worth\
    \ at least $1, the smart contract will be designed to sell Bibi’s 1 BTC collateral\
    \ if the value of that collateral falls to $5,000. In such case, the smart contract\
    \ will sell the BTC and hold the $5,000, thereby ensuring that the 5,000 Stablebucks\
    \ issued to Bibi are always fully collateralized and backed by $5,000 worth of\
    \ assets. Once the smart contract sells the 1 BTC for $5,000, it would hold $5,000\
    \ of collateral and Bibi would have 5,000 Stablebucks, but no BTC.\n\nWhy would\
    \ anyone want to risk their crypto to create a Stablebuck?\n\n116 \n\nLeverage.[11](#section9.xhtml#ftn.30)\
    \ The Stablebuck system is a lot like a pawn shop, whereby the system is in reality\
    \ making a loan based on the value of collateral staked. The person staking the\
    \ collateral can use the loaned cash for any purpose, and like in the pawn shop\
    \ relationship, that person generally has a greater need for the loaned proceeds\
    \ than he or she has for the collateral asset.\n\nIn finance, borrowing against\
    \ assets is a form of leverage. Leverage is advantageous for borrowers who believe\
    \ the borrowed funds will generate profits higher than the borrowing costs.\n\n\
    In the Stablebucks example, assume Bibi believes the price of bitcoin will increase\
    \ in the future. If she takes the 5,000 Stablebucks and uses it to purchase 0.5\
    \ BTC (at 1 BTC = $10,000), she would then have a 1.5 BTC position: 1 BTC in the\
    \ Stablebucks smart contract and 0.5 BTC in her wallet.\n\nIf the price of BTC\
    \ increases to 1 BTC = $20,000 (a 100 percent increase in price), Bibi’s profits\
    \ will be greater than 100 percent, because she used leverage to increase her\
    \ position. Here’s how:\n\nat the 1 BTC = $20,000 price, Bibi could close out\
    \ the smart contract, by (1) selling 0.25 BTC for $5,000, then (2) using that\
    \ $5,000 (plus whatever interest has accrued) to redeem her Stablebucks.\n\nAt\
    \ that point, she would have 1.25 BTC worth $25,000, minus any interest costs.\
    \ Without the Stablebucks, she would have had 1 BTC worth $20,000. Bibi’s use\
    \ of leverage through Stablebucks allowed her to earn a 150 percent return (ignoring\
    \ interest) on the 100 percent increase in the price of bitcoin. Obviously, the\
    \ costs of borrowing would reduce Bibi’s return.\n\n117 \n\nLeverage is not always\
    \ beneficial, however. If the price of BTC falls, Bibi’s position will lose value\
    \ faster than she would have without leverage. For example, assuming Bibi, as\
    \ in the example above, created 5,000 Stablebucks, but the price of BTC decreased\
    \ to 1 BTC = $7,500 (a 25 percent decrease in price). In that situation, Bibi’s\
    \ losses would be greater than 25 percent. At the 1 BTC = $7,500 price, to close\
    \ out the smart contract, Bibi would:\n\n1)sell 0.67 BTC for $5,000, then\n\n\
    2)use that $5,000 (plus interest) to redeem her Stablebucks.\n\nAt that point,\
    \ she will have 0.83 BTC worth $6,225 (minus interest), a 37.75 percent loss based\
    \ on a 25 percent decrease in BTC price. Without the Stablebucks, she would have\
    \ had 1 BTC worth $7,500.\n\nThe examples above show the risks, and opportunities,\
    \ of using stablecoins for leverage.\n\nWhy would anyone want to risk their crypto\
    \ using leverage?\n\nAs Meek Mill said so eloquently, “scared money don’t make\
    \ no money.”[12](#section9.xhtml#ftn.31) Speculation on the price of assets has\
    \ existed since at least 1750 BCE in Mesopotamia, and the Code of Hammurabi included\
    \ provisions for delivery of futures-type contracts.[13](#section9.xhtml#ftn.32)\
    \ Stablecoins, like futures markets in general, increase the efficiency of the\
    \ underlying crypto markets.\n\nMaker and DAI"
