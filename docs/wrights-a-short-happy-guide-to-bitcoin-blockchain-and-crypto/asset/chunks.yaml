    ### 3. Trading Volume Formula

    any sales by parties affiliated with the issuer cannot exceed one percent of the
    outstanding shares of the same class as the securities being sold, or if listed
    on a stock exchange, the greater of one percent or the average 192reported weekly
    trading volume during the four weeks preceding the filing of a notice of sale.


    ### 4. Ordinary Brokerage Transactions

    any sales by parties affiliated with the issuer must be handled in all respects
    as routine trading transactions, and brokers may not receive more than a normal
    commission. Neither the seller nor the broker can solicit orders to buy the securities.


    ### 5. Filing Requirement

    parties affiliated with the issuer must file a notice with the `SEC` if their
    proposed sale involves more than 5,000 shares or the aggregate dollar amount is
    greater than `$50,000` in any three-month period.


    ## The Exemptions


    #### Reg A+

    Through `Reg A+` (sometimes called a mini-IPO), US or Canadian issuers can raise
    up to $50 million in a 12-month period from an unlimited number of non-accredited
    investors (the public) without registration as a public offering. `Reg A+` offerings
    are subject to `SEC` review and qualification, and if approved, preempt state
    Blue Sky laws. Securities sold in a `Reg A+` offering are not considered restricted
    securities.[40] However, securities purchased pursuant to a `Reg A+` exemption
    cannot be listed or quoted on a securities exchange without registration.[41]


    `Reg A+` offerings have two tiers:


    *   `Tier 1`: for offerings of up to $20 million in a 12-month period; and 193

    *   `Tier 2`: for offerings of up to $50 million in a 12-month period.


    For offerings of up to $20 million, companies can elect to proceed under the requirements
    for either `Tier 1` or `Tier 2`.


    As part of the `Reg A+` approval process, a company can confidentially submit
    its offering memorandum to the `SEC`, allowing the company to gauge the `SEC’s`
    reaction to the exemption. In addition, before committing to a `Reg A+` offering,
    the `SEC` will allow a company to “test the waters” by polling its customers or
    the public about the investment before the company commits to spending considerable
    time and money on the `SEC` approval process.


    Testing the waters allows a company to gauge the potential success of a `Reg A+`
    offering in order to make an informed decision on whether to move forward. In
    general, during a “test the waters” campaign, a company invites potential investors
    (including customers) to indicate their interest in the company’s securities.
    If there is not enough interest, the company can avoid the costs involved in proceeding
    with the offering.


    In theory, the `Reg A+` process should allow a company to enjoy a streamlined,
    expedited review process. In practice, however, the `Reg A+` process has not been
    expedited for crypto-securities. Historically, companies seeking to offer securities
    under `Reg A+` could expect approval within three months. However, despite the
    fact that early crypto-securities projects filed requests to offer securities
    under `Reg A+` as early as mid-2017, no “true” crypto projects (see box below)
    were approved until the `Blockstack Reg. A+` approval in July 2019.


    | 194 The StartEngine Reg A+ Qualified Approval![](Image_61.jpg) |

    | :--- |

    | One crypto-based company that was preliminarily approved to offer securities
    under `Reg A+` was `StartEngine`, but the conditions of that approval are such
    that it is generally not regarded as a “true” crypto project. `StartEngine`, founded
    in 2014, claims to be the largest US equity crowdfunding platform, whose mission
    is to help entrepreneurs achieve their dreams by democratizing access to capital.
    In June 2018, `StartEngine` successfully raised nearly $5 million in a standard
    (i.e., non-crypto) `Reg A+` offering. After that first `Reg A+` offering, `StartEngine`
    sought approval to issue tokenized equity securities under `Reg A+`. In its preliminary
    [offering circular for the tokenized equity,](https://www.sec.gov/Archives/edgar/data/1661779/000114420418036457/tv497502_partiiandiii.htm)
    `StartEngine` stated that it planned to issue common and preferred stock “in the
    form of electronic tokens”. ... to “be delivered on the `Ethereum Blockchain`
    using a `smart contract`.” However, after submitting its initial application,
    `StartEngine` was required to amend its preliminary offering circular six times.
    In that sixth version of its offering circular (dated March 7, 2019), `StartEngine`
    amended its charter to change the name of its securities from `Series Token` Preferred
    Stock.` Effectively, `StartEngine’s` approval was based 195on the `SEC` requiring
    them to remove from offering nearly everything that was linked to crypto. |


    | --- |

    | 196 | In April 2019, `Blockstack`, a New York-based blockchain software provider,
    announced that it had filed an offering statement with the `SEC` seeking to become
    the first. According to `Blockstack’s` website: `Blockstack Token LLC`, our wholly-owned
    subsidiary, today announced that it has filed an offering statement with the `Securities
    and Exchange Commission` (`SEC`) to conduct a $50 million token offering. Upon
    approval, the offering is expected to be the first of its kind. `Blockstack’s
    received its `Reg A+` approval in July 2019, and in September, raised over $23
    million in the first `SEC`-qualified token offering. The net proceeds of the offering
    will be used to accelerate the development of `Blockstack` decentralized computing
    network and app ecosystem. Although the `Blockstack` approval provided welcomed
    clarity regarding the `SEC’s` `Reg A+` requirements, it raised a host of other
    questions, including: * If the purchasers of `Blockstack` tokens spend the tokens
    in exchange for other goods or services, would the `SEC` consider that a sale
    of securities? * Can `Blockstack` token holders resell tokens to others? * If
    an application accepts `Blockstack` tokens as payment, or uses the tokens to pay
    others, is the application soliciting the purchase of securities or acting as
    a securities dealer? * Because the `SEC` approved the offering, is `Blockstack`
    exempt from New York’s BitLicense regime? Another open question arising out of
    the Blockstack offering relate to mining. The Blockstack protocol relies on miners
    to mine “Stacks” tokens (`STX`). In the event that miners are issued over $50
    million of `STX` tokens (the `Reg A+ Tier 2` limit), it is unclear (i) how those
    tokens could be issued consistent with the securities laws, and (ii) whether the
    issuance of `STX` tokens to miners would be considered a separate offering. |


    #### Reg CF

    Through `Reg CF` (officially “Regulation Crowdfunding”), issuers can raise up
    to $1 million (with adjustments for inflation) from non-accredited investors through
    `SEC`-approved broker-dealers or funding portals (see box below). `Reg CF` provides
    a simple and straightforward option for issuers, but, as of 2020, is limited to
    issuances of no more than $1.07 million.


    | What is a Funding Portal? |

    | :--- |

    | As part of the JOBS Act, the concept of an equity crowdfunding portal was created
    to allow entrepreneurs, startups, and nontraditional investment funds to raise
    funds from the public. To mitigate the fraud risks, `Reg CF` prohibits equity
    crowdfunding portals from: * offering investment advice or recommendations to
    investors. |

