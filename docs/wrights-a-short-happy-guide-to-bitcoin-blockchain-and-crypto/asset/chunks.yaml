    Throughout this book, examples will be used to explain and simplify the mechanics
    of blockchain transactions. In many of those examples, `Bibi` will serve as one
    party, often a buyer, and `Chaun` (pronounced like Shawn) will serve as a counterparty,
    often a seller. This first example will show how trust is an important, but often
    overlooked, part of most everyday transactions.


    ### Buying a pound of Organic Kenyan Dark Roast coffee


    Suppose `Bibi` wants to buy a pound of Organic Kenyan Dark Roast coffee. She heads
    down to the local Starbucks to get the coffee, but before she gets there, she
    runs into `Chaun`, a stranger who, it just so happens, has a roadside stand that
    sells one-pound bags labeled “Organic Kenyan Dark Roast Coffee” at half the Starbucks
    price.


    ### What will Bibi do?


    It depends on whether `Bibi` trusts that `Chaun` is actually selling authentic
    Organic Kenyan Dark Roast. For all `Bibi` knows, `Chaun` could be selling an inferior
    grade of coffee, or worse, decaf. Absent trust that the coffee is authentic (organic,
    Kenyan origin, dark roast), `Bibi` will likely bypass `Chaun`’s stand and buy
    the coffee from Starbucks.


    How can Bibi know that the coffee `Chaun` has labeled as “Organic Kenyan Dark
    Roast” is what it purports to be?


    Absent the blockchain trust machine, she can’t. What this means for `Chaun` is
    that if she wants to sell her coffee, she must give potential customers reasons
    to trust her product, such as by giving out free samples and showing up week after
    week to earn customers’ confidence. In other words, `Chaun` must build trust in
    her product the same way that Starbucks has built trust in its products. That
    trust, akin to business goodwill, explains the value of brand names, and allows
    businesses to charge higher prices for their products.


    ### What if Chaun had a way of proving to Bibi the coffee was Organic Kenyan Dark
    Roast?


    If `Bibi` was confident that the coffee was authentic, she would buy the coffee
    from `Chaun` at the lower price. Let’s assume `Chaun` can prove the coffee’s provenance,
