  trans: "\n\n2019 年指南的另一个问题通过 2016 年 7 月 The DAO 攻击事件后的以太坊/以太坊经典分叉（即 `ETH/ETC` 分叉）凸显出来。攻击发生后不久，以太坊社区决定分叉以太坊区块链以撤销攻击的影响。为了实施这次分叉，以太坊开发者识别出以太坊区块链中一个攻击前的区块，并从该区块开始分叉区块链。\n\
    \n`ETH/ETC` 分叉的效果是转了黑客攻击对以太坊区块链产生的大部分影响，并将被黑客占用的大部分 `ETH` 归还给原始所有者。然而，以太坊社区的一些成员拒绝了这次硬分叉，他们本质上认为“不可篡改”的区块链不应该具有“撤销”功能。他们的回应是忽略\
    \ `ETH` 分叉，并开始在原始的、未分叉以太坊版本上挖掘区块，从而创建了以太坊经典（`ETC`）。\n\n从技术角度来看，`ETC` 似乎是遗留链。它代表了“未分叉”的原始以太坊链。在\
    \ `ETH/ETC` 分叉时，`ETH` 的价值是 `ETC` 的 1500%以上。在此期间，`ETC` 在 2016 年 7 月以约 0.75 美元的价格开市，而\
    \ `ETH` 的交易价格在 11.50 美元至 14.44 美元之间，且在分叉后的几天内没有发生明显变化。如果遵循 2019 年指南（该指南具有溯及力），纳税人将被按照\
    \ 2016 年 7 月的价格报告其 `ETH` 持仓的全部价值作为收益，而他们在分叉前 `ETH` 的任何基数将对应 `ETC`。这种荒谬的结果在 2019\
    \ 年指南下被认为是要求的。\n\n### 哪种是“新”币重要吗？\n\n重要。税法中的模糊性使得纳税人更难准确地报告其收入。此外，纳税人不合规的很大一部分归因于税法的的复杂性和模糊性。62\n\
    \n### “新”币的公平市场价值（FMV）是多少？\n\n2019 年指南常见问题集（FAQs）中的问答 23 指出：\n\n> 你在收到新[加密货币]时将拥有等同于其市场价值的普通收入，即交易在[区块链]上记录的时刻，前提是你对该[加密货币]拥有支配权和控制权，以便你可以转移、出售、交换或以方式处置该[加密货币]。\n\
    > 230 \n\n这段语言并没有提供关于纳税人究竟何时产生收入的清晰指导。作为一个初步事项，正如 AICPA（美国注册会计师协会）来书中提到的：\n\n\
    > “链分裂币在分叉时具有零或接近零的可实现价值……[并且] 即使链分裂币被认为在分叉时具有非零价值，纳税人通常也无法在当时主张这些币，因为这些币没有钱包或分币服务的支持。虽然在理论上，纳税人可以通过出售纸钱包（让买方获得链分裂币的权利）来行使支配权和控制权，但现实中，纳税人不会进行此类交易，因为那种类型的市场缺乏流动性、不受监管且效率低下。”\n\
    \n`ABC/SV` 分叉的后果显示了美国国税局（IRS）方法的其他问题。分叉的前一天（2018 年 11 月 14 日），`BCH` 的收价为 439.31\
    \ 美元。分叉后，新币 `ABC` 和 `SV` 的价格剧烈波动。下面的图表显示了分叉期间及之后 `ABC` 和 `SV` 的美元价格：\n\n![](img/Image_63.jpg)\n\
    \n231 \n\n![](img/Image_64.jpg)\n\n根据上述图表，尚不清楚纳税人在“新”币“收到”时如何确定其公平市场价值。由于税法的歧义，纳税人在币“收到”并“记录”在区块链上时如何确定“新”币的\
    \ FMV。如果遵循 2019 年指南（该指南具有溯及力），纳税人将被按照 2016 年 7 月的价格报告其 `ETH` 持仓的全部价值作为收益，而他们在分叉前\
    \ `ETH` 的任何基数将对应 `ETC`。这种荒谬的结果在 2019 年指南下被认为是要求的。\n\n[注]：此处原文中似乎部分段落重复或错乱，已根据原文逻辑进行翻译]\n\
    \n### 哪种是“新”币重要吗？\n\n重要。税法中的模糊性使得纳税人更难准确地报告其收入。此外，纳税人不合规的很大一部分归因于税法的复杂性和模糊性。62\n\
    \n### “新”币的公平市场价值（FMV）是多少？\n\n2019 年指南常见问题集（FAQs）中的问答 23 指出：\n\n> 你在收到新[加密货币]时将拥有等同于其市场价值的普通收入，即交易在[区块链]上记录的时刻，前提是你对该[加密货币]拥有支配权和控制权，以便你可以转移、出售、交换或以方式处置该[加密货币]。\n\
    > 230 \n\n这段语言并没有提供关于纳税人究竟何时产生收入的清晰指导。作为一个初步事项，正如 AICPA（美国注册会计师协会）来书中提到的：\n\n\
    > “链分裂币在分叉时具有零或接近零的可实现价值……[并且] 即使链分裂币被认为在分叉时具有非零价值，纳税人通常也无法在当时主张这些币，因为这些币没有钱包或分币服务的支持。虽然在理论上，纳税人可以通过出售纸钱包（让买方获得链分裂币的权利）来行使支配权和控制权，但现实中，纳税人不会进行此类交易，因为那种类型的市场缺乏流动性、不受监管且效率低下。”\n\
    \n`ABC/SV` 分叉的后果显示了美国国税局（IRS）方法的其他问题。分叉的前一天（2018 年 11 月 14 日），`BCH` 的收价为 439.31\
    \ 美元。分叉后，新币 `ABC` 和 `SV` 的价格剧烈波动。下面的图表显示了分叉期间及之后 `ABC` 和 `SV` 的美元价格：\n\n![](img/Image_63.jpg)\n\
    \n231 \n\n![](img/Image_64.jpg)\n\n根据上述图表，尚不清楚纳税人在“新”币“收到”时如何确定其公平市场价值。由于税法的歧义，纳税人在币“收到”并“记录”在区块链上时如何确定“新”币的\
    \ FMV。\n\n[注]：由于提供的原文文本后半部分存在逻辑重复和错乱，译文已基于提供的核心内容进行了对齐处理]"
