    街名命名系统也通过两种方式提供了针对经纪人破产的保护：


    1. 当一家公司面临清算时，包括 `SEC` 和 `FINRA` 在内的监管机构将努力确保客户的证券转移到另一家公司。以街名名义持有投资可能有助于这一过程，因为受益所有权信息是集中的。

    2. 作为街名命名系统的一部分，成立了“证券投资者保护公司”（`Securities Investor Protection Corporation`），以便在经纪人破产时为客户提供保险。


    本节的大部分内容及提供的示例基于 Caitlin Long 的文章《Two Things That Don''t Mix Well: Bitcoin Rehypothecation
    And Chain Forks》，发表于《福布斯》（2018 年 8 月 21 日）。


    参阅 Sean Walters 的《One Lehman Lesson: The Perils of Rehypothecation》，发表于《华尔街日报》（2008
    年 9 月 25 日）。


    “`FinTech sandbox`（金融科技沙盒）是指一种针对金融科技公司和产品的监管框架，该框架提供了一个促进创新金融产品和活动的监管环境，并允许在特殊的监管豁免、许可或其他有限的、有时限的例外情况下，对创新进行小规模现场测试。广而言，监管沙盒允许企业在监管机构的监督下测试非传统产品，且受惩罚风险较低。要在沙盒中运营，监管机构要求企业采取保护措施，以使客户和广泛的市场免受其非传统产品风险的影响。监管沙盒的概念于
    2008 年金融危机后不久开发，旨在解决企业创新意愿与监管机构在批准创新产品时的谨慎态度之间的摩擦。


    Jesse Powell 的发言，`2018 Consensus conference`（2018 年 5 月 21 日）。


    参阅 Kirill Bryanov 的《Blockchain and the City: New York State as a “Tough” Model
    of Crypto Regulation》，发表于《Cointelegraph》（2019 年 2 月 21 日）。


    参阅 `SEC Historical Society`，《431 Days: Joseph P. Kennedy and the Creation of the
    SEC`（1934–35 年）。


    参阅 `International Brotherhood of Teamsters v. Daniel`，`439 U.S. 551`（1979 年）。


    参阅，例如 `Stenger v. R.H. Love Galleries, Inc.`，`741 F.2d 144, 146`（7th Cir. 1984
    年）；`SEC v. Banner Fund Int’l`，`211 F.3d 602, 614`（D.C. Cir. 2000 年）。


    参阅 `SEC & Exch. Comm’n v. SG Ltd.`，`265 F.3d 42`（1st Cir. 2001 年）。


    参阅 `Revak v. Realty Corp.`，`18 F.3d 81, 87`（2d Cir. 1994 年）。


    参阅 `Salcer v. Merrill Lynch`，`682 F.2d 459, 460`（3d Cir. 1982 年）（采纳水平共同性）。


    参阅 `Teague v. Bakker`，`35 F.3d 978`（4th Cir. 1994 年）。


    参阅 `Curran v. Merrill Lynch`，`622 F.2d 216, 222`（6th Cir. 1980 年）（放弃垂直共同性以转而水平共同性）。


    参阅 `Milnarik v. M-S Commodities`，`457 F.2d at 274, 276–77`（7th Cir. 1972 年）。


    参阅 `Hocking v. Dubois`，`885 F.2d 1449, 1459`（9th Cir. 1989 年）（全员庭审）。


    参阅 `SEC v. Banner Fund Intern.`，`211 F.3d 602, 341`（D.C. Cir. 2000 年）。


    参阅 `SEC v. Cont’l Commodities Corp.`，`497 F.2d 516, 516`（5th Cir. 1974 年）。


    参阅 `Messer v. E.F. Hutton & Co.`，`833 F.2d 909, 915`（11th Cir. 1987 年）。尽管法院将其裁定重点放在
    `Howey` 测试的第四标准下的推销身上，但法院仍引用了一个第五巡回法院的案件来辅助其决策。


    但 `Hocking v. Dubois`，`839 F.2d 560, 567`（9th Cir. 1988 年）（规定第九巡回上诉法院已认同垂直共同性，但并未完全排除水平共同性）。


    参阅 `Hocking v. Dubois`，`885 F.2d 1449, 1459`（9th Cir. 1989 年）（全员庭重审）。


    `Howey` 第 300 页。


    `SEC v. Glenn W. Turner, Inc.`，`474 F.2d 476, 482`（9th Cir. 1973 年）；`United Housing
    Foundation, Inc. v. Forman`，`421 U.S. 837`（1975 年）。


    该 `Framework` 将最后两个要素合并为一个，但在其分析中再次将它们分开。


    参阅 `Framework`，脚注 9。


    参阅 `SEC Press Release 99–83`（1999 年 7 月 22 日）。


    Hester M. Peirce，SEC 委员，《Running on Empty: A Proposal to Fill the Gap Between
    Regulation and Decentralization》，演讲于 `Blockchain Congress`（2020 年 2 月 6 日）。


    参阅 `www.sec.gov/news/speech/peirce-remarks-20`。`ICO`数据来自 `icodata.io`。


    `Securities and Exchange Commission v. Kik Interactive, No. 19-cv-5244`（S.D.Y.,
    2018 年 6 月 4 日）。


    与`SEC`执法行动相关的程序被称为 `Wells Process`，对拟议`SEC`执法行动的回复被称为 `Wells Response`。


    参阅 `Securities Act 144`。


    根据 `Exchange Act`第 12(b)条注册。


    Andrew Barry，《Only 3 of the Top 20 Mutual Funds Are Beating the Market. Here’s
    How They Do》，巴伦财经（2019 年 11 月 15 日）。


    现代投资组合理论认为投资者通过持有不相关的资产的组合来最小化特异性风险。根据该理论，此类组合在给定风险水平下实现了收益最大化。


    参阅 `Dissent of Commissioner Hester. Peirce to Release No. 34–8373`;`File No. SR-BatsZX–30`，SEC
    声明（2018 年 7 月 26 日）。


    Chris Marquette，《Crypto-based funds crawl toward mom and pop》，Roll Call（2019 年
    2 月 6 日）。


    Robert Jackson，SEC 委员，《2019 Future of Fintech conference`，CBInsights 主办（2019 年
    6 月 13 日）。


    Brian Quintenz，CFTC 委员，《The Year Ahead for Capital Markets》，Bipartisan Policy
    Center（2019 年 2 月 12 日）。


    Jay Clayton，SEC 主席，《2019 Delivering Alpha conference`，由 CNBC 和`Institutional Investor`主办（2019
    年 9 月 19 日）。


    Kyle Torpey，《Analyst: 60% Chance Of Bitcoin ETF In 2020》，福布斯（2020 年 1 月 14 日）。


    在电影中，交易是在期货交易所的地板上。今天，大多数期货交易在线进行。


    参阅 `CFTC v. Patrick McDonnell et al.`，`332 F. Supp. 3d 641`（E. D. NY 2018 年 8
    月 28 日），以及 `CFTC v. My Big Coin Pay, Inc.`，`334 F. Supp. 3d 492`（D. MA 2018 年
    9 月 26 日）。


    国会于 2010 年通过了修订`CEA`以回应 `CFTC v. Zelener`，`373 F. 3d 861`（7th Cir. 2004 年）。在该裁决中，第七巡回法院必须确定`CFTC`是否可以监管形式为现货合同但实质为期货合同的合同。法院裁定尊重合同的形式，因此不受`CFTC`管辖。为了扭转`Zelener`裁决的影响，国会修订了`CEA`，赋予`CFTC`对运作类似于期货合同的担保贷款型融资安排的管辖权。


