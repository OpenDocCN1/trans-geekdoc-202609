  fmt: '

    As noted in Part II, an oft-cited fact in this debate is the increased use of
    crypto in criminal activity. For example, in 2019 `CipherTrace` reported that
    76 percent of “dark market” (see box below) and ransomware transactions used `bitcoin`
    for payment.


    The use of crypto in criminal activity appears to be escalating. According to
    `Forbes` magazine and `CipherTrace`, in the first six months of 2019, crypto “thefts,
    scams, and fraud worldwide” netted criminals over $4.25 billion (to have access
    to that money, criminals must launder the money), compared to $1.7 billion over
    the entire 2018 year.


    ### Dark Markets

    Dark markets (or `darknets`) are websites where illegal products and services
    are traded. In general, dark market transactions are conducted over the `Tor`
    network and are anonymized. The currency for many dark market transactions is
    often crypto, either `bitcoin` or privacy coins. In many dark markets, payments
    are held in escrow by the site operator to discourage scammers. `Silk Road` was
    the most popular dark market until it was shut down in 2013 by the `FBI`. Soon
    thereafter, `AlphaBay` emerged as the most popular darknet until it was shut down
    in 2017 as part of a joint US, Canadian, and Thai effort.


    Many in the crypto community counter that the money laundered in crypto pales
    in comparison to the amounts laundered through traditional financial institutions,
    citing the International Monetary Fund’s annual money laundering estimate of $600
    billion to $1.5 trillion. Needless to say, the debate continues.


    ## FinCEN’s Rules


    On May 9, 2019, `FinCEN` issued guidance regarding crypto (described in its guidance
    as “convertible virtual currencies” (`CVCs`)). Before discussing the contours
    of `FinCEN`’s guidance, it is important to understand the role of guidance in
    US regulation.


    ### Regulatory Guidance

    Guidance is material published by a regulatory agency that helps clarify existing
    rules, and generally represents the agency’s position on how the existing laws
    and regulations should apply. According to `FinCEN`, its guidance should “clar
    issues or respond to questions of general applicability that arise under `FinCEN`
    regulations.” Guidance cannot be relied on in a court of law, but can be used
    to persuade a court regarding an agency’s position. Agencies often issue guidance
    when they are unwilling or unable to issue regulations, or when they want to broadcast
    a policy position to the public. Guidance is easier to issue than regulations
    because if an agency wants to issue regulations, in most cases the agency must
    draft proposed regulations, distribute the proposals to the public, and provide
    the public with the opportunity to comment on them (called “Notice and Comment”).
    Under federal law, non-binding guidance is exempted from `Notice and Comment`
    under the `Administrative Procedures Act`. Although guidance does not have the
    force of law, it is another example of “soft law” that carries persuasive weight
    and often serves as unofficial regulation. Critics of agency guidance often claim
    that agencies use guidance to expand the scope of their authority, or to make
    public policy in the absence of congressional direction. Although regulatory agencies
    are part of the executive branch, some members of the post-Obama administration
    complained that guidance sometimes serves as “a back door for regulators” to frustrate
    executive branch decisions.


    `FinCEN`’s guidance explained circumstances in which `FinCEN` would subject crypto
    businesses to the same registration, recordkeeping, reporting, `AML` and know
    your customer (`KYC`) requirements as other traditional money services businesses
    (for example, `Western Union`). While the definitions of what types of crypto
    activity would be subject to the `AML/KYC` requirements are detailed, those definitions
    generally state that if a business or service accepts something valuable (such
    as crypto) and transmits it to another person, entity or location, then that business
    or service is a money transmitter, and therefore must follow the `BSA`’s `AML/KYC`
    requirements.


    In May 2019, `FinCEN` issued its most game-changing guidance regarding crypto,
    requiring crypto businesses, including exchanges and service providers, to follow
    the `Funds Travel Rule`, a longstanding part of `FinCEN`’s non-crypto anti-money
    laundering efforts. Based on `FATF` Recommendation 16, the `Funds Travel Rule`
    requires that either before or at the time of a transaction, financial intermediaries
    must obtain, hold, and transmit information about the originators and beneficiaries
    of funds transfers over $3,000 (or the equivalent in crypto). That information
    must include:


    ![](Image_53.jpg)


    The `Funds Travel Rule` also gives financial intermediaries the ability to monitor
    transactions and requires them to report suspicious transactions to the government.
    Together, the `BSA` and the `Funds Travel` empower the government and financial
    intermediaries to take what they deem is appropriate action regarding suspicious
    activities, including freezing accounts and prohibiting transactions with designated
    persons or entities.


    While the coverage of the `Funds Travel Rule` is certainly broad, there are exceptions.
    Generally, if crypto is sent outside of the financial intermediary system, the
    `Funds Travel Rule` will not apply. That exception applies to:


    *   transactions where customers control the funds (“unhosted” wallets or cold
    wallets) and conduct transactions on their own behalf;

    *   peer-to-peer transactions between individuals or non-financial intermediaries;
    and

    *   peer-to-peer transactions on crypto trading platforms that enable buyers and
    sellers to find each other, so long as the trading platform only provides a forum
    for posting bids and offers, and the parties themselves settle any matched transactions
    through an outside venue (either through individual wallets or other wallets not
    hosted by the trading platform).


    Many in the crypto community criticized `FinCEN`’s decision to apply the `Funds
    Travel Rule` to crypto, for both policy and practical reasons:


    #### Policy

    The `Funds Travel Rule` is contrary to the underlying principles of decentralization
    and privacy that blockchain technologies are built upon. In addition, circumventing
    the `Funds Travel Rule` through the use of individual (non-VASP) accounts or peer-to-peer
    services will be fairly straightforward, and instead of reducing money laundering,
    it will only increase the compliance costs of legitimate actors in the crypto
    industry.


    #### Practical

    Because crypto transactions are pseudonymous, blockchain transactions do not intrinsically
    contain, collect or capture the data needed to comply with the `Funds Travel Rule`.
    In fact, modifying blockchain protocols to allow for the capture that data would
    undermine the privacy, confidentiality and coding efficiency of many crypto protocols.
    Moreover, miners and developers have no incentive to make modifications that decrease
    the privacy associated with public blockchains.


    In November 2019, a coordinated worldwide effort to comply with the `Funds Travel
    Rule` and `FATF Recommendation 16` was organized by a number of crypto-focused
    industry associations, called the `OpenVASP initiative`. According to its press
    release, the project “will enable `VASPs` to transmit blockchain transaction information
    privately, immediately and securely, in compliance with `FATF Recommendation 16`
    and the `Funds Travel Rule` The `OpenVASP initiative` white paper states that
    its protocol will be “based on key design principles of decentralization, privacy,
    broad applicability, while remaining agnostic to the virtual asset being transferred,”
    and would allow `VASPs` from across multiple jurisdictions to transact between
