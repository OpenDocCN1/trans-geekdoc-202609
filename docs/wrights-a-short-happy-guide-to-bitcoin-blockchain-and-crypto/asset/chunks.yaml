  trans: '

    以太坊在尝试扩展方面表现得更加激进，因为它在保持其去中心化应用（DApps）和智能合约主导地位的道路上面临着更大的竞争，从而成为物联网的主导操作系统。夺取以太坊地位的潜在收益引起了投资者和开发者的兴趣，并让他们通过规避以太坊的一些局限性，提供了具有更大扩展潜力和更广泛采用的平台。两个此类以太坊竞争对手
    `EOS` 和 `Tron` 声称具有更快的交易吞吐量和更低的费用。但以太坊并没有放弃战斗，并采取了重大步骤来改进。


    以太坊最受讨论的扩展改进包括 `Raiden Network`、`Plasma`、`Sharding`（分片）、计划中的叉（包括 `Constantinople`、`Istanbul`
    和 `Berlin`）以及 `Casper`——以太坊提出的向权益证明（PoS）共识机制的变更。`Casper` 和 `Sharding` 完全集成被称为“Serenity”，它将创建一个所谓的“以太坊
    2.0”。下面将简要讨论每一项。


    ### Raiden Network 和 Plasma


    `Raiden Network` 基本上是以太坊版本的 `Lightning Network`，并于 2018 年 12 月在以太坊主网上上线。像 `Lightning`
    一样，`Plasma` 将交易发送到链外，同时依赖以太坊网络提供底层安全。然而，`Plasma` 的架构结构更像棵树，从以太坊主区块链派出的分支可以生成其他分支。`Plasma`
    的工作原理是将计算复杂的交易移动到侧分支，仅将完成的智能合约广播到以太坊区块链。


    ### Sharding


    `Sharding` 是一个广泛用于数据库的概念，以提高其效率。一个 `shard`（分片）是数据库的水平部分或切片。`Sharding` 的原理是将大型数据库划分为较小的数据库，使得执行数据库操作更易于管理。


    对于区块链而言，`sharding` 通过将现有区块链分成更小的部分（`shards`），使得每个节点只需要存储区块链数据的一个 `shard`，但允许分片以某种方式进行通信，使链保持安全和去中心化。根据某些估计，如果以太坊有一百个分片，该链每秒能够处理约一万次交易。然而，在
    `Casper` 实现之前，以太坊无法使用 `sharding`，因为 PoW 网络中的 `sharding` 更困难，并且会让网络更容易受到攻击。


    尽管 `sharding` 提供了许多潜在益处，它也暴露了许多潜在的攻击向量。通常情况下，这些向量与数据的有效性和可用性有关：


    - **有效性 (Validity)**：在与 `shard` 交互时，可能无法验证该 `shard` 的历史，这使得该分片声称代表的整个链的有效性受到怀疑。

    - **可用性 (Availability)**：数据可用性问题的解释超出了本书的范围。简单来说，问题在于确保分片中有足够的数据来检测攻击和欺诈，允许交易被
    (i) 视为已验证并处理，或 (ii) 视为无效并惩罚，从而抑制未来的攻击和欺诈活动。


    ### 计划中的以太坊叉


    以太坊的许多改进是通过计划中的软件升级实现的，称为“叉”（forks）。下面描述了一些较重要的计划叉：


    - **Constantinople**：`Constantinople` 是 2019 年 2 月对以太坊的升级，其设计目的包括其他方面使在链上开发项目变得更容易，允许未来实现扩展解决方案，并作为向以太坊向
    PoS 链（`Casper`）过渡的一步。`Constantinople` 需要以太坊区块链的硬叉，并将区块奖励从 `3 ETC` 减少到 `2 ETC`（上一次主要的硬叉升级
    `Byzantium` 将区块奖励从 `5 ETC` 减少到 `3 ETC`）。

    - **Istanbul**：`Istanbul` 是 2019 年 12 月的一次硬叉，引入了额外的隐私和扩展能力，重新平衡了某些 `ETH` 定价机制，允许以太坊和
    `Zcash`（一种提供完全隐私交易且可通过以太坊上的智能合约验证的加密货币）更好地协同工作，并允许智能合约拥有更多功能。

    - **Berlin**：`Berlin` 硬叉预计初步于 2020 年 6 月进行，并将引入一种被称为“渐进式工作证明”（`ProgPoW`）的算法。正如
    `CoinDesk` 所解释，`ProgPoW` 是以太坊变为 PoS 系统之前所需的过渡步骤。此外，`Berlin` 将减少昂贵的 `ASIC` 芯片的挖矿能力（`ASIC`
    芯片是“专用集成电路”，是专门为挖矿设计的计算机芯片，因此效率高出数千倍），并增加大多数个人电脑使用的非 `ASIC` 芯片的能力，例如 `CPUs` 和
    `GPUs`（`GPUs` 是“图形处理器”，常见于许多标准电脑并允许显示图像）。放弃 `ASIC` 芯片的一个原因是，随着 `ASIC` 芯片进行的挖矿越来越多，将越来越少的矿工能够竞争区块奖励，矿池将变得更加集中。

    - **Casper**：以太坊最深远的变化将是 `Casper`，它将以太坊转换为 PoS 链。这样做将消除以太坊挖矿，并通过转向 PoS 实现快多的交易吞吐量。


    ### Serenity—以太坊 2.0


    `Serenity` 是以太坊 2.0 的最后一步，是 `Casper` 和 `Sharding` 的结合，在两者都运行之前无法实现。`Serenity`
    预计最早要到 2020 年底才会实现。根据以太坊核心开发者的说法，`Serenity` 将完成向 PoS 共识机制的切换，并带来扩展性的千倍增长，同时使链更安全、更节能。


    ### 叉与链分裂


    并不是所有面对的事都能改变，但在面对之前，什么也无法改变。

    — 詹姆斯·鲍德温 (James Baldwin)


    总会有那么时刻，由于由于或其他原因，事情发生了变化。在区块链上，这些变化由“叉”表示。区块链叉是对区块链软件的修改，而分叉区块链是指修改实施后的区块链。


    关于比特币和以太坊中一些引起争议的叉有很多记载，但叉有时是无害的。在某些情况下，当两个或多个节点同时发现区块时就会发生叉。这些叉是暂时的并在区块链上解决。在其他情况下，叉用于实施升级，或在向公众推出之前在区块链上测试功能和流程。


    叉有两种类型：硬叉（hard forks）和软叉（soft forks）。两者之间的主要区别在于向后兼容性，即区块链的新版本理解并运行在旧版本创建的数据上的能力。下面将简要讨论每一项。


    #### 软叉


    软叉是一种收紧或限制协议规则的软件升级。软叉是向后兼容的，这意味着旧的叉前区块可以接受并与新的叉后区块一起。然而，如果旧的叉前区块违反了由软叉建立的规则，新的叉后区块将拒绝这些旧区块。


    软叉的一个例子是比特币引入区块大小限制。最初比特币对区块大小没有限制，但在 2010 年执行了一个软叉，为所有新区块设置了 `1 MB` 的区块大小限制。新限制意味着新的
    `1 MB` 叉后区块不会被没有限制的叉前区块拒绝，但如果矿工尝试添加一个 `2 MB` 的区块（这在叉前是可以是可以接受的），那么该区块在 2010 年软叉之后将被拒绝，因为它违反了软叉设置的
    `1 MB` 限制。


    '
