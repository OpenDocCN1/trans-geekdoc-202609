- raw: "*   Allows securities to be issued in tokenized form, which will allow any\
    \ business, not just crypto businesses, to issue securities directly on a blockchain.\n\
    \n*   Permits the creation of special purpose depository institutions to serve\
    \ blockchain businesses.\n\n*   Specifies a control-based method of perfecting\
    \ security interests in digital assets, and provides that a transferee of a digital\
    \ asset takes the asset free of any security interest two years after the transferee\
    \ takes the asset for value, absent notice of an adverse claim.\n\n*   Authorizes\
    \ banks to provide custodial services for digital assets consistent with the SEC’s\
    \ qualified custodian requirements.\n\n*   Creates a regulatory safe space for\
    \ FinTech companies (a FinTech sandbox)[12](#section10.xhtml#ftn.47) to test innovative\
    \ financial products or services by:\n\n159 \n\n*   allowing regulators to waive\
    \ rules relating to banking, corporate law, electronic records, consumer credit,\
    \ and money transmission; and\n\n*   specifying that FinTech products or services\
    \ can be tested in the sandbox for up to three years.\n\nNew York\n\nNew York’s\
    \ regulatory regime for crypto was developed by the New York State Department\
    \ of Financial Services (NYDFS). Under that regime, companies that want to conduct\
    \ crypto business activities are required to obtain a license, called a BitLicense,\
    \ from NYDFS. The BitLicense regulations were finalized in June 2015 and became\
    \ effective August 8, 2015.\n\nAccording to the NYDFS, the goals of the BitLicense\
    \ regime are to prevent money laundering, protect consumers, and establish cybersecurity\
    \ rules and procedures. The BitLicense regime applies to individuals and business\
    \ entities that live or operate in New York that transmit, hold, buy, sell, administer,\
    \ or issue crypto as a consumer business or crypto exchange, but does not apply\
    \ to businesses that simply accept crypto as payment.\n\nIn general, the BitLicense\
    \ regime sets forth rules for the use, control, administration, maintenance, storage,\
    \ custody, issuance, and exchange of crypto, as well as rules for crypto-related\
    \ software development. It also imposes strict consumer protection and disclosure\
    \ requirements for businesses offering crypto-related services. To obtain a BitLicense,\
    \ a business must pay a $5,000 application fee and file a thirty-page application,\
    \ and estimates are that the cost of gathering the required information can exceed\
    \ $100,000.\n\n160 \n\nAs of December 2019, only 24 companies had been granted\
    \ BitLicenses, and some companies reported having to wait nearly three years for\
    \ approval. In response to the BitLicense regime, a number of crypto companies\
    \ have prohibited New York residents from using their services, and the crypto\
    \ exchanges BitFinex, ShapeShift, and Kraken publicly pulled their businesses\
    \ out of New York to avoid the BitLicense process. According to Jesse Powell,\
    \ the CEO of Kraken, BitLicense would have forced Kraken to “disclose all the\
    \ information about our entire global client base to the state of New York,” which\
    \ was “potentially illegal” under the privacy laws of other countries.[13](#section10.xhtml#ftn.48)\n\
    \nOne argument offered in favor of the heightened New York requirements is that\
    \ because New York serves as a global financial hub, it needs a more rigorous\
    \ regulatory regime to maintain the integrity of global financial markets. Martin\
    \ Weiss, the founder of Weiss Cryptocurrency Ratings, neatly sums up the New York\
    \ position regarding the BitLicense regime:\n\n“Cryptocurrencies are, in essence,\
    \ borderless. Regulation, in order to catch up, would also have to be borderless,\
    \ crossing not only state boundaries but also national boundaries. New York is\
    \ in a unique situation because it regulates a major financial center, the largest\
    \ in the world. So as long as all those corporations want to remain domiciled\
    \ in New York, legislators in Albany do have a jurisdictional reach that sticks.\
    \ In most places in the world, if you try to regulate cryptocurrencies, they’ll\
    \ just move to another jurisdiction. That is bound to happen with most of cryptocurrency\
    \ institutions. But that’s not the case with New York.”[14](#section10.xhtml#ftn.49)\n\
    \n161 \n\nIn late 2019, NYDFS announced it intended to update its BitLicense regulations\
    \ early in 2020. As part of the announcement, NYDFS published and sought comments\
    \ on two proposed coin adoption or listing options:\n\n1)a proposal to provide\
    \ a NYDFS-approved list of all coins that are allowed for virtual currency business\
    \ activities without the prior approval by the authority, and\n\n2)a model framework\
    \ for listing coins, which would enable licensees to self-certify the listing\
    \ or adoption of new coins.\n\n162 \n\nSecurities Laws and the SEC\n\nOne of the\
    \ most contentious issues in crypto has been determining whether certain crypto\
    \ are securities, thus subject to federal securities regulation. The answer to\
    \ that question has far-reaching implications for the sale, tradability, and ultimately\
    \ the utility of crypto both in the US and abroad.\n\nCrypto designated as securities\
    \ are subject to myriad laws and regulations in the US, providing some measure\
    \ of safety to investors. However, a security designation also raises the costs\
    \ and risks associated with bringing that crypto to market, thereby implicitly\
    \ encouraging crypto companies to operate in more crypto-friendly jurisdictions.\
    \ If the US cannot strike a fair balance between investor protection and supporting\
    \ crypto businesses, it risks losing generations of crypto businesses to the rest\
    \ of the world.\n\nIntroduction to Securities Laws and Regulations\n\nFor readers\
    \ unfamiliar with securities regulation, the questions and answers below provide\
    \ some important definitions, as well as a brief history of US securities laws.\n\
    \nWhat is a security?\n\nIn lay terms, a security is a tradeable financial asset\
    \ whose value is derived from an ownership right or a contractual claim. Financial\
    \ assets include stock and other equity instruments, debt instruments, and bank\
    \ deposits. In general, tangible assets like land, cars, commodities, or racehorses\
    \ are not considered financial assets; however, contractual claims based on the\
    \ value of any of those tangible assets would be considered financial assets.\n\
    \nWhen were federal securities laws first passed?\n\nIn the US, federal securities\
    \ laws date back to the early 1930s. President Franklin D. Roosevelt signed the\
    \ Securities Act of 1933 163(’33 Act or Securities Act) as part of the New Deal.\
    \ The ’33 Act governed issuances of securities and was followed the next year\
    \ by the Securities Exchange Act of 1934 (’34 Act or Exchange Act), which governed\
    \ exchanges and trading of securities.\n\nWhy did Congress pass the securities\
    \ laws?\n\nThe stock market crash of 1929. Prior to the crash, securities markets\
    \ were loosely regulated by individual states, not the federal government. Those\
    \ state markets boomed during the 1920s, fueled by a new tech sector that introduced\
    \ radio, movies, bulldozers, frozen food, penicillin, and electric razors.\n\n\
    Between 1925 and 1929, that hot tech sector fueled a 300 percent increase in overall\
    \ stock prices. Unfortunately for retail investors, however, much of the information\
    \ available to them was fraudulent. Scammers and criminals like Joseph P. Kennedy\
    \ (whose son would later become president) used nefarious schemes, such as pump-and-dumps\
    \ and wash sales, to mislead investors.[15](#section10.xhtml#ftn.50)\n\nAfter\
    \ the crash, Congress launched a number of investigations that revealed:\n\n*\
    \   widespread efforts to manipulate securities markets, including payoffs to\
    \ journalists and politicians;\n\n*   rampant insider trading by corporate officers\
    \ and directors;\n\n*   corrupt practices by corporate insiders, including paying\
    \ themselves exorbitant salaries and giving themselves interest-free loans; and\n\
    \n*   investment banks tipping politicians and corporate executives about upcoming\
    \ deals, allowing them to 164invest before the public and profit once the securities\
    \ started trading."
