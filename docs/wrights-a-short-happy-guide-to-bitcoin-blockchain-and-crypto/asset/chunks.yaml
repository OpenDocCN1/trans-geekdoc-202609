  trans: "\n\n*   该协议将立即成为黑客的蜜罐，因为它包含一份全球范围内的详细财务信息列表；以及\n*   如果它被关闭（例如由于分布式拒绝服务攻击），资金汇传输将被冻结，直到系统恢复在线。\n\
    \n尽管对实施“资金转移规则”（Funds Travel Rule）存在担忧，但 2019 年 11 月，FinCEN 主任肯尼斯·布兰诺（Kenneth\
    \ Blanco）警告加密企业，如果他们声称其技术无法合规，将无法在美国开展业务。布兰诺还表示，美国政府将“严格执行”资金转移规则，并补充道：\n\n“[资金转移规则]适用于[加密货币]，我们预计你们将遵守，不此不言。这是我们的预期。你们会遵守的。我不明白有什么好惊讶的。这并不是新事。”\n\
    \n许多加密交易所开始根据 FinCEN 的指导意见实施 AML/KYC 政策。正如下方 ShapeShift 框中所讨论，这种实施并非没有争议。\n\n\
    ### ShapeShift 案例\n\nShapeShift 是一家加密交易所，旨在允许用户在“无缝、安全且可靠环境中快速切换资产”。ShapeShift\
    \ 由 Erik Voorhees 于 2014 年创立，直到 2018 年，它允许用户在点对点的基础上交换加密货币，而无需提供任何账户信息。ShapeShift\
    \ 自称为其用户提供最高级别的消费者保护和效率，并为了规避美国的 AML/KYC 监管，在其平台上禁止了使用法币。然而，在《华尔街日报》报道有 900 万美元非法获取的资金通过其平台进行洗钱不久后，ShapeShift\
    \ 为所有用户引入了强制性的 AML/KYC 政策。在讨论这一政策转变时，Voorhees 表示：“我个人以及我们公司都尊重个人拥有财务隐私的权利。强迫人们进行\
    \ KYC 侵犯了这一权利。所以我我不支持这一点。我们之所以这样做，并不是因为我们支持它，而是因为我们本质上是被迫这么做的。”——WhatBitcoinDid\
    \ 播客，2019 年 3 月 20 日 |\n\n### 了解你的客户 (KYC)\n\n除了 AML 政策外，FinCEN 的指导意见和《银行机密法》（BSA）还要求金融机构实施\
    \ KYC 政策，通过提高其监测和观察客户身份及业务关系的能力，帮助金融机构避免非法交易。KYC 规定：\n\n1.  为金融机构的客户尽职调查（CDD）计划制定规则；\n\
    2.  要求金融机构在开设新账户时，验证所有客户（无论是个人还是实体）的法律身份和/或受益所有（见下方框）；以及\n3.  强制金融机构的 CDD 程序必须包含以下程序：\n\
    \    (i)监测和报告可疑活动，以及\n    (ii)维护和更新客户信息。\n\n#### 谁是“受益所有人”\n\nFinCEN 对受益所有者的定义范围很广。根据\
    \ FinCEN 的定义，受益所有人是指：\n\n1.  任何个人（如果有），其直接或间接地通过任何合同、安排、理解、关系或其他方式，拥有法律实体客户 25%\
    \ 或以上权益的个人。\n2.  对控制、管理或指导法律实体客户具有重大责任的单一个人，包括：\n    (i)执行官或高级管理人员（例如：首席执行官、首席财务官、首席运营官、管理成员、普通合伙人、总裁、副总裁或财务主管）；或\n\
    \    (ii)任何定期执行类似职的个人。\n3.  如果信托直接或间接地通过任何合同、安排、理解、关系或其他方式，拥有法律实体客户 25% 或以上权益，则受益所有人指受托人。\n\
    \n除了收集受益所有信息外，KYC 规定要求金融机构通过美国海外资产控制办公室（OFAC）的“特别制裁人员和被冻结名单”（SDN）对受益所有姓名进行筛选，该名单识别了：\n\
    \n*   受拥有或控制的个人和公司；\n*   受制裁国家拥有或代表制裁国家行动的个人、团体和实体。\n\n### KYC 的意外后果\n\n除了隐私问题外，一些人认为\
    \ KYC 要求阻止了某些群体（特别是贫困和没有银行关系的人）参与金融体系。例如，在 2011 年至 2013 年间，英国和美国的银行采取了关闭所有涉及索马里的账户的预防措施，理由是这些账户可能与青年军邦（al-Shabaab）等恐怖组织有关。\n\
    \n账户的关闭意味着居住在外的索马里离散社区无法通过英国或美国的银行汇回资金。当时，仅美国的汇款每年就达到约 2 亿美元，占索马里国内生产总值的 40%。\n\
    \n银行无论是否存在实际风险或非法活动证据，为了避免来自 FinCEN 或英国金融行为监管局（FCA）的罚款，关闭了这些账户。银行的行为不仅破坏了本就虚弱的经济，还加强了恐怖组织。\n\
    \n在 2015 年 4 月 11 日《纽约时报》的社论中，美国议员基思·利森（Keith Ellison）认为，向索马里等地区汇款实际上助长了恐怖组织。利森议员和其他国际组织认为，汇款为家庭提供了财务支持，并作为贸易的工具，从而限制了恐怖组织的吸引力。此外，通过关闭汇款业务，国际组织无法获得支持其人道主义任务的资金，进一步助长了恐怖组织。\n\
    \n然而，对许多银行而言，FinCEN 或 FCA 罚款的风险大于与索马里实体交易的收益。平均平均，每笔汇款收取约 5% 的费用，每年处理 100 万至 200\
    \ 万美元的索马里汇款，为平均银行产生约 5 万至 10 万美元的手续费收入。然而，与青年军邦等恐怖组织有关而面临的 FinCEN 或 FCA 罚款可能高达数千万甚至上亿美元。\n\
    \n### 资金转移规则、隐私币与混币\n\n正如第二部分所述，隐私币和混币通过使交易参与方呈现匿名状态，阻碍了政府追踪加密交易的能力。FinCEN 的指导意见指出，使用匿名签名或接收金融机构无法解码的账户的汇款人或受益人并未遵守资金转移规则。此外，当金融中介明知接受匿名增强加密货币（如隐私币或经过匿名化的加密货币）时，金融中介不仅必须跨交易跟踪加密货币，还必须实施获取汇款人或受益人身份的程序。\n\
    \n"
