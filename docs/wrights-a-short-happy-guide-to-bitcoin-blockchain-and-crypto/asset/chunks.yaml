  trans: "\n如果将人类历史上开采的所有黄金都集中在一个地方，它们可以放入一个边长为 68 英尺（21 米）的立方体中，大约能填满四个奥运标准游泳池。按照目前的估值，这些黄金的价值约为\
    \ 7.8 万亿美元。\n\n# 黄金：世界货币\n\n在过去的几千年里，在纸币出现之前，黄金一直是世界上主要的货币。早在`公元前 4000 年`，人们就在`努比亚`（现今的苏丹和埃及）开采黄金。起初，黄金按重量进行交易，并作为支付的记账单位。\n\
    \n`公元前 550 年` 左右，第一批金币使用电金（`electrum`）铸造，这是一种发现于现土耳其西部的金银天然合金。在过去的几个世纪里，黄金继续被用作货币，而对黄金的渴望导致许多欧洲人掠夺非洲和美洲，完全不顾其行为所造成的人道代价。历史记录表明，葡萄牙人早在`1470\
    \ 年`就开始奴役非洲人开采黄金，欧洲奴隶主一直到 19 世纪仍继续使用非洲奴隶来开采黄金。\n\n到了 17 世纪末，欧洲银行和政府开始引入可以兑换黄金的纸币。由于黄金支撑着全球许多形式的货币，它成为了事实上的世界储备货币。\n\
    \n| 78 纸币 | 纸币最早由中国在`唐朝`创造，远早于纸币在欧洲的使用。在`1200 年代`末，为蒙古汗王`忽必烈`服务的期间，`马可·波罗`注意到纸币在整个中原地区（即现今的中国地区）被广泛使用。\
    \ |\n| --- | |\n\n黄金作为储备货币的使用一直持续到 20 世纪后半叶，当时大多数政府开始发行除政府的全部信用和信誉外、无任何实物支撑的法定货币。\n\
    \n如今，`美元`已取代黄金，成为世界上主要的储备货币。截至`2019 年`底，美元约占所有已知中央银行外汇储备的 62%，全球支付额的 47%，以及外汇交易的\
    \ 88%。要理解美元如何取代黄金成为世界储备货币，需要了解`1944 年布雷顿森林协议`。\n\n# 布雷顿森林：简明版\n\n在`1944 年布雷顿森林协议`之前，大多数世界货币都实行金本位制，这意味着这些货币可以根据要求兑换黄金。实际上，这些当地货币是发行政府开具的借据（`IOUs`），以在要求时交付黄金的承诺作为担保。这种承诺意味着从理论上讲，政府不能随心地打印更多纸币；它只能打印与其持有的黄金储备等额的货币。\n\
    \n> 我没有透支；我还有支票呢！\n> —老笑话\n\n79 \n\n然而，对印钞的限制就像对开支票的限制一样：虽然开具超过银行账户余额金额的支票是不明智的，但人们经常在这样做。政府的情况也是如此。\n\
    \n在`第一次世界大战`期间，许多国家意识到，他们进行战争所需的资金多于其拥有的黄金储备，因此通过打印超过其黄金储备数量的货币而放弃了金本位。这些行为增加了货币供应量。然而，货币供应量的增加导致了通货膨胀。\n\
    \n`布雷顿森林体系`的目标是提供经济稳定。该框架由`国际货币基金组织`和`世界银行`建立。\n\n`布雷顿森林体系`于`1971 年 8 月 15 日`正式结束，当时美国单方面放弃了金本位制。\n\
    \n美国为什么放弃了金本位制？\n"
