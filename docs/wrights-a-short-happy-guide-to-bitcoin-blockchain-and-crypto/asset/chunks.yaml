    # Part III: Blockchains and the Law


    ## Regulating the Blockchain Space


    No government can claim exclusive jurisdiction over blockchain technology and
    crypto. However, once people started using blockchains as money (crypto), governments
    (i) began to apply “rules” for their use, and (ii) discovered the difficulties
    in regulating a technology that exists outside of physical boundaries and identities.


    Broadly speaking, governments have taken three approaches in regulating crypto:


    ### 1. Encouraging

    Governments taking this approach have enacted rules supporting and encouraging
    crypto, making it easier for their citizens and businesses to use crypto and operate
    crypto businesses. A few of the more crypto-friendly countries include Malta,
    Japan, Bermuda, Hong Kong, Switzerland, and Singapore.


    Malta, a tiny southern European country of about 450,000 citizens, has been an
    international leader in actively encouraging crypto businesses. In February 2018,
    the Maltese government enacted the Malta Digital Innovation Authority (MDIA),
    which established a comprehensive regulatory framework for crypto businesses.
    Later in 2018, Binance, one of the world’s largest crypto exchanges by volume,
    relocated its headquarters from Hong Kong to Malta.


    ### 2. Permissive

    Governments taking this approach have allowed blockchain technologies to operate,
    but have generally:

    *   instituted difficult- or expensive-to-follow rules; and/or

    *   failed to provide regulatory clarity, leaving citizens and businesses uncertain
    about whether, and under what circumstances, existing rules apply to crypto.


    The US falls into this category. Although US crypto rules are generally permissive,
    uncertainty surrounding US regulation has been a factor in many crypto businesses
    relocating to non-US domiciles.


    ### 3. Strict

    These governments have generally been hostile to crypto, banning the use or ownership
    of crypto, initial coin offerings, and crypto exchanges. Some of the more crypto-unfriendly
    countries include Algeria, Bolivia, Morocco, Nepal, Pakistan, and Vietnam.


    | Crypto in China China’s approach to crypto is in parts permissive, and in others
    parts strict. Under current law, China bans all ICOs, prohibits financial institutions
    from transacting in crypto, disallows patents for any crypto-related payment technology,
    and, until recently, had threatened to ban crypto mining. In April 2019, the Chinese
    government included bitcoin mining as an industry that it planned to phase out
    over time. However, in October 2019, President Xi Jinping gave a speech that called
    for increased efforts in blockchain development. Following that speech, the government
    removed crypto mining from the industries it wanted to phase out. Around the world,
    crypto mining generated over $5.4 billion in revenue in 2019, and estimates suggest
    that between 65–81 percent of that mining activity happens in China, based on
    China’s cheap electricity, labor, and resources. The chart below, courtesy of
    the Wall Street Journal, shows the market share of the most popular bitcoin mining
    pools.![](Image_51.jpg) In December 2019, Mu Changchun, head of the People’s Bank
    of China (PBoC), announced that China would soon offer a digital form of the Chinese
    yuan, its official currency, and that pilot programs were underway with an expected
    rollout in 2020. In July 2019, Wang Xin, the director of the PBoC Research Bureau,
    admitted that Facebook’s announcement of the Libra stablecoin was an important
    factor in China’s interest in bringing the digital yuan to the market. Many have
    speculated that a digital yuan could help China challenge the global supremacy
    of the US dollar. |

    | --- |


    Despite the disparate regulatory approaches to crypto, world governments have
    long-cooperated in establishing rules to protect the integrity of the international
    financial system. The current effort began in earnest in 1989, when the Financial
    Action Task Force (FATF) was organized to set standards and promote effective
    implementation of legal, regulatory, and operational rules to prevent money laundering
    (anti-money laundering or AML) and combat other forms of financial crimes. The
    FATF mandate was expanded after the September 11, 2001, attacks in the US to include
    methods to combat terrorist financing (CTF).


    | What is The Financial Action Task Force? ![Image](Image_52.jpg) FATF sets standards
    and promotes effective implementation of legal, regulatory, and operational measures
    for combating money laundering, terrorist financing, and other related threats
    to the integrity of the international financial system. According to the FATF
    website:

    *   FATF is a policy-making body which works to generate the necessary political
    will to bring about national legislative and regulatory reforms.

    *   FATF monitors the progress of its members in implementing necessary legal,
    regulatory, and operational measures for combating money laundering, terrorist
    financing, and other related threats to the integrity of the international financial
    system.

    *   In collaboration with other international stakeholders, FATF works to identify
    national-level vulnerabilities with the aim of protecting the international financial
    system from misuse.


    FATF has thirty-nine member countries, including the US, China, and the European
    Commission (which represents the EU). In addition, the following intergovernmental
    groups, whose missions are generally to frustrate money laundering, are associate
    members of FATF:

    *   Asia/Pacific Group on Money Laundering

    *   Caribbean Financial Action Task Force

    *   Council of Europe Committee of Experts on the Evaluation of Anti-Money Laundering
    Measures and the Financing of Terrorism

    *   Eurasian Group

    *   Eastern and Southern Africa Anti-Money Laundering Group

    *   Financial Action Task Force of Latin America

    *   Inter-Governmental Action Group against Money Laundering in West Africa

    *   Middle East and North Africa Financial Action Task Force

    *   Task Force on Money Laundering in Central Africa


    International organizations with an anti-money laundering focus also work with
    FATF and serve as observers, including the World Bank, the United Nations, Interpol,
    the Organization of Economic Co-operation and Development (OECD), and the International
    Monetary Fund, among others. |

    | --- |


    In 2014, FATF made a preliminary assessment of the money laundering and terror
    financing risks of crypto (crypto are referred to as “virtual currencies” by FATF).
    Then in 2015, FATF provided guidance aimed at helping countries develop rules
    to manage crypto-related AML/CTF risks. The 2015 guidance called upon countries
    to assess the types of AML/CTF risks crypto represented, and to implement rules
    to prevent the use of crypto for money laundering and terrorist financing.


    FATF’s guidance was updated in October 2018 to broaden its scope. That update
    included guidance that clarified that crypto business and services, called “virtual
    asset service providers” (VASPs) by FATF, should be subject to AML/CTF rules.
    FATF specifically listed crypto exchanges, wallet providers, and providers of
    financial services for ICOs as examples of VASPs. The 2018 guidance also set out
    compliance standards for issuers, guidelines for ICOs, and directions for banks,
    securities dealers, and other financial institutions involved with crypto.


