    ![BREAKING: Launch Date of Multi-Collateral Dai, the Dai Savings ...](Image_47.jpg)![MakerDAO
    Details Preparations For Multi-Collateral Dai Release ...](Image_48.jpg)


    One of the most active crypto-backed stablecoins is `DAI`, a token that uses overcollateralization
    and another token, `Maker` (`MKR`), to maintain a 1-to-1 peg to the dollar. Initially,
    `DAI` were collateralized only by `ETH` (the Ethereum token), but in late 2019,
    the `Maker/DAI` system was expanded to allow for other types of collateral, creating
    multi-collateral `DAI`. The details of the `Maker/DAI` system are, quite frankly,
    complicated, but an abbreviated version is included below.


    ### How DAI and MKR work: the VERY simplified version


    If Bibi wants to create `DAI`, Bibi would need to post crypto collateral and create
    a collateralized debt position (`CDP`), which is a smart contract in the `Maker/DAI`
    system. The amount of `DAI` created is based on the amount of collateral put into
    the `CDP`, and must be greater than the amount of `DAI` to be created. For example,
    if the system set the collateral ratio at 150 percent, then Bibi would have to
    post crypto collateral worth $150 to mint (create) 100 `DAI` (worth $100).


    To ensure that the `Maker/DAI` system is robust enough to deal with the volatility
    of crypto, the `Maker/DAI` developers added additional mechanisms designed to
    maintain the peg between `DAI` and the dollar. Among those mechanisms are:


    1. a stability fee, paid when the `CDP` is closed out (akin to the borrowing costs
    in the Stablebucks example above);

    2. the ability to liquidate `CDPs` as necessary; and

    3. the `Maker` token (`MKR`).


    In the `Maker/DAI` system, the `CDPs` collect a fee (stability fee), which is
    calculated against the total amount of `DAI` minted and drawn against collateral
    held in a `CDP`. In the above example, if Bibi, using her $150 in crypto collateral,
    minted and extracted 100 `DAI`, the system would charge Bibi a stability fee based
    on the 100 `DAI` extracted.


    The stability fee is designed to address the risk of imbalances in supply and
    demand for `DAI` to support the peg. For example, if `DAI` is consistently above
    one dollar, it signals that demand for `DAI` is outweighing supply. At such time,
    the stability fee (borrowing cost) could be lowered to incentivize people to create
    `CDPs` and mint `DAI`, thereby increasing supply to meet demand.


    Alternatively, if `DAI` is consistently below one dollar, it signals supply for
    `DAI` is outweighing demand. At such time, the stability fee (borrowing cost)
    could be raised, which increases the costs associated with minting or holding
    `DAI`, creating an incentive for people to close out their `CDPs` and reduce supply.
    The stability fee has seen significant fluctuation since the `Maker/DAI` system
    was created. It was initially set at 0.5 percent and has reached a high of 2.5
    percent.


    The most easily explained way the `Maker/DAI` system maintains the peg is by liquidating
    `CDPs` if the value of the collateral falls below a certain threshold, thereby
    reducing the risk that the crypto collateral could worth less than the `DAI` created
    based on that collateral. Each `CDP` is created based on the then-current crypto
    prices, and the `Maker/DAI` system collectively is based on the weighted average
    of all the crypto held in `CDPs`. Based on the example above, if the value of
    $150 crypto collateral held in the `CDP` approached $100, the system could sell
    the `CDP` before the price fell below $100 to ensure that the collateral in the
    system would always be worth more than the `DAI` created by that.


    While the stability fee and the liquidation of `CDPs` work to keep `DAI` pegged
    to the dollar in most circumstances, neither would work in the event of a sudden
    drop in crypto prices. In such cases, it might be impossible to liquidate `CDPs`
    before the value in those `CDPs` fell below the amount of `DAI` created, which
    would make it difficult or impossible to maintain the peg. To address that risk,
    `Maker/DAI` system uses `MKR` tokens.


    `MKR` tokens are the governance mechanism for the `Maker/DAI` system, and funds
    raised by issuing `MKR` tokens provide additional collateral for the `Maker/DAI`
    system to maintain the peg. `MKR` token holders, in addition to providing collateral
    to the system, are empowered to vote on issues that affect the growth and stability
    of the `Maker/DAI` system. That system incentivizes them to carefully monitor
    the system, and in return, earn fees for their work.

