  trans: "\n\n*   比特币没有统一的价格，不同的交易所报价各不相同；而且\n*   比特币市场缺乏流动性。\n\n# 比特币 ETF 提案的历史\n\
    \n首个比特币 ETF 提案是由 `Bats BZX` 交易所和 `Winklevoss` 双胞胎（Facebook 的早期投资者）于 2016 年 6 月提交的。证券交易委员会（SEC）最终于\
    \ 2017 年 3 月拒绝了他们的提案，理由是比特币市场容易受到操纵、波动大且难以监管。在 `BZX/Winklevoss` 提案被拒绝两周后，SEC 再次拒绝了另一项提案，这次来自纽约证券交易所的子公司\
    \ `NYSE Arca`。\n\n2018 年，SEC 拒绝了一份修订后的 `BZX/Winklevoss` 提案，但 SEC 委员员 `Hester Peirce`\
    \ 公开对该决定表示反对，并写道：\n\n> “拒绝批准令关注的是比特币现货市场的特征，而不是 `BZX` 根据其自身规则对在 `BZX` 上列出和交易股票进行监管并震慑操纵的能力。”\n\
    \n当时，许多人认为 `Peirce` 的公开评论预示着 SEC 态度的转变。然而，仅在 2018 年 8 月 22 日就有九项提案被拒绝，截至本文撰写尚未尚未提案获得批准。\n\
    \n尽管没有提案通过，但在 2019 年 2 月出现了两丝希望，当时：\n\n*   SEC 委员 `Robert J. Jackson Jr.` 公开思考：\n\
    \    > “最终，我认为会有人满足我们所设定的标准吗？我希望如此，是的，我是这么想的，” 随后补充道：\n    > “当市场达到那个阶段时，我完全相信我们将拥有一个准备好批准比特币\
    \ ETF 的 SEC。”\n\n*   商品期货交易委员会 (`CFTC`) 委员 `Brian Quintenz` 批评 SEC 以潜在价格操纵为由拒绝了之前的\
    \ ETF，他表示：\n    > “通过结算指数，有一种数学方法可以设计一种合约，即使所引用的某个交易所没有足够的流动性，指数本身也不容易受到操纵。”\n\
    \n在 2019 年 10 月做出的一份 112 页的决书中，SEC 拒绝了由 `Bitwise` 和 `NYSE Arca` 于 2019 年 1 月提交的修订比特币\
    \ ETF 提案。在决书中，SEC 其对市场操纵表示关注，并引用了 `Bitwise` 的研究，该研究表明报告的比特币交易量中只有 5% 是“真实的”，另外\
    \ 95% 是“虚假的”。`Bitwise` 的研究指出，虚假交易包括不受监管交易所账户持有者之间的人为交易，以及用于推高交易量的自交易（经常成对出现的买卖单，其中相互抵消）。在决书中，SEC\
    \ 指出：\n\n> `Bitwise` 尚未证明其实际上识别了“真实的”比特币市场，或者“真实的”比特币市场已与欺诈和操纵活动隔离开。\n\n一些法律分析师认为，在现任\
    \ SEC 主席 `Jay Clayton` 任期结束之前，比特币 ETF 不会被批准。`Clayton` 长期以来一直是批评者，并在 2019 年 9 月表示：\n\
    \n“我们如何确保那些交易不受操纵呢？”\n\n其他人则没那么乐观。`Tom Pisani` 推测，SEC 对操纵的关注是一种拖延策略。`Pisani` 还指出：\n\
    \n“SEC 正在试图找一个拒绝的理由，但他们还没有找到。问题是市场尚未受到监管。”\n\n`SEC` 认为，监管市场对于保护投资者是必要的。然而，比特币\
    \ ETF 的支持者认为，ETF 将通过提供流动性和透明度来帮助市场自身。\n"
