    *   iii) 在购买者预期利润的范围内，这些预期并非基于 Kik 的创业努力或管理努力。

    *   2019 年 5 月，Kik 和 Kin 启动了 [www.‌defend‌crypto.](http://www.‌defend‌crypto.)org。

    *   2019 年 6 月，SEC 起诉 Kik，指控其进行了金额为 1 亿美元的非法证券募资。

    *   2019 年 8 月，Kik 提交了一份被广泛认为是对 SEC 诉状全面且具有战略性的答辩，理由如下：


    ### 全面性 (Comprehensive)

    Kik 并没有通过对 SEC 的指控进行一般性否认来正式回应诉状（这在证券诉讼中很常见），而是针对 SEC 诉状中所有有争议的事实和法律问题提供了详尽的反驳。


    ### 战略性 (Strategic)

    Kik 的答辩为迅速将诉讼移至上诉法院奠定了基础。通常在证券诉讼中，被告首先提交驳回诉讼的申请，这为被告留了更多准备时间，并可能迫使政府提供更多信息。Kik
    放弃了驳回申请，通过对 SEC 诉状提供详尽的反驳，增加了该案件在不发生重大延误的情况下进入审判的可能性。无论初审法院发生什么，此案都可能被提起上诉。Kik
    的答辩旨在尽可能快地将案件移至上诉法院，并可能移至美国最高法院。


    该案的证据发现阶段预计将于 2020 年中期完成，为同年晚些时候的审判奠定基础。


    ### SEC 其他行动 (Other SEC Action)

    在 SEC 发布《框架》（Framework）的同时左右，它还针对加密货币发布了其第一份“不采取行动函”（No Action Letter，见下表），认定
    Turnkey Jet, Inc. (TKJ) 发行的 ICO 代币不被视为证券。TKJ 试图发行固定价格代币，允许代币持有者将 TKJ 的飞机作为包机和空中出租车使用。TKJ
    代币将在 TKJ 控制的私有区块链上发行。


    | 188 号 SEC 不采取行动函 | 不确定其行为是否会违反联邦证券法的个人或实体可以向 SEC 申请“不采取行动”函。大多数不采取行动函描述了请求，分析了涉及的事实和情况，并讨论了适用的法律法规。不采取行动函被认为类似于
    SEC 的批准章。 |

    | --- |


    SEC 费了近一年时间才发布了 TKJ 不采取行动函，考虑到某些不采取行动函在请求后不到一周内就发了。TKJ 不采取行动函提供了一个数字资产的示例，该资产可以提供和出售用于使用或消费，而不涉及证券法的注册要求。


    然而，TKJ 不采取行动函的重要性有限，因为它只针对了一组狭窄的事实，即：一个许可性的、中心化的区块链，带有一种只能用于消费的固定价格代币。这些事实并不大多数加密项目。


    2019 年 8 月，SEC 向 Pocketful of Quarters (PoQ) 发布了第二份（截至本文编写时最新）不采取行动函。PoQ 的代币称为
    Quarters，旨在作为视频游戏中的通用货币。根据 PoQ 的说法，Quarters 将允许在某个游戏中获得奖励的玩家将这些游戏奖励转换为 Quarters，并在其他游戏和平台中使用这些
    Quarters。


    作为授予 PoQ 不采取行动函的条件，该公司公司必须向 SEC 保证，不允许玩家与其他玩家购买、出售或交易 Quarters，且开发者和影响者在开设 PoQ
    账户之前必须通过 AML/KYC 检查。与 TKJ 代币一样，Quarters 将在一个许可性的、中心化的区块链上发行，使用仅用于消费的固定价格代币。PoQ
    不采取行动函几乎没有开辟新地。


    ### 注册豁免 (Exemptions from Registration)

    寻求提供或出售证券的公司（发行者）通常必须向 SEC 注册募资或寻求注册豁免。为了进行注册，发行者必须充分披露合理投资者在做出投资决策所需的所有信息。为了让寻求发行证券的公司更容易合规，SEC
    提供了以下注册豁免：

    * 向特定人数进行私人发行；

    * 特定规模的发行；

    * 州内发行；以及

    * 政府证券。


    所有证券交易无论是否豁免，都受联邦证券法反欺诈条款的约束。对于通过发行证券筹资金的公司，这一过程从 2012 年变得更容易，当时奥马政府和国会通过了《初创企业法案》（JOBS
    Act）。《初创企业法案》及其实施条例，结合现有法律，为寻求注册豁免的公司提供了三种极具吸引力的途径：A+ 法规 (Reg A+)、众筹法规 (Reg CF)
    以及 D 类条例 (Regulation D) 中的 506(c) 条。D 类条例的 504 条和 506(b) 条也为加密公司提供了更多传统的注册豁免选择。


    ### 关键术语 (Key Terms)


    #### 合格投资者 (Accredited Investor)

    “合格投资者”包括符合以下条件的自然人：

    * 在过去两年中每年收入超过 20 万美元（与配偶合计超过 30 万美元），并合理预计今年也将达到该水平；或

    * 净资产超过 100 万美元（与配偶合计，不包括其主要住房的价值）。


    “合格投资者”也可以是实体，如银行、合伙企业、公司、非营利组织或信托，前提是该实体符合某些标准。


    2019 年 12 月，SEC1983 年来首次提议扩大合格投资者的定义。根据该提议，定义将扩大到包括持有特定证券许可证（7、65 或 92 系列）的人、私募基金员工、注册投资顾问、管理资产超过
    500 万美元的家族办公室（及其客户）以及有限责任公司等。该提议的意见征集期于 2020 年 4 月 24 日结束，预计将于 2020 年第三季度推出。


    #### 通用募集 (General Solicitation)

    “通用募集”包括刊登在报纸和杂志上的广告、公共网站、通过电视和广播传播的通信，以及通过通用募集或通用广告邀请参加的研讨会。此外，使用不受限制的、即公开可见的网站构成了通用募集。


    #### 预先 (Preemption)

    某些 SEC 豁免“预先”州证券法，这意味着募资不需要在州监管机构注册，也不需要遵守州蓝天法。


    #### 受限证券 (Restricted Securities)

    无法自由交易的证券。为了向公众出售受限证券，通常需要满足五个条件：

    1. 持有期：通常需要持有 6 到 12 个月。

    2. 最新公开信息：有关发行人业务性质、其高管和董事身份以及财务报表的信息必须是公开的。


