    ![突破性：多抵押 Dai（Dai 储蓄）的发布日期](img/Image_47.jpg)![MakerDAO 为多抵押 Dai 发布做准备...](img/Image_48.jpg)


    最活跃的加密货币稳定币之一是 `DAI`，它是一种通过超抵押和另一种代币 `Maker` (`MKR`) 来维持与美元 1:1 挂钩的代。最初，`DAI`
    仅由 `ETH`（以太坊代）抵押，但在 2019 年后期，`Maker/DAI` 系统进行了扩展，允许其他类型的抵押品，从而创建了多抵押 `DAI`。坦率地说，`Maker/DAI`
    系统的细节非常复杂，下面包含了一个简要版本。


    ### DAI 和 MKR 如何工作：极简版


    如果 Bibi 想要创建 `DAI`，她需要存入加密货币抵押品并创建一个抵押债务位置 (`CDP`)，这是 `Maker/DAI` 系统中的一个智能合约。创建的
    `DAI` 数量基于投入 `CDP` 的抵押品数量，并且必须大于要创建的 `DAI` 数量。例如，如果系统将抵押率设定为 150%，那么 Bibi 必须存入价值
    150 美元的加密货币抵押品来铸造（创建）100 个 `DAI`（价值 100 美元）。


    为了确保 `Maker/DAI` 系统足够健壮以应对加密货币的波动，`Maker/DAI` 开发人员增加了额外的机制，旨在维持 `DAI` 与美元之间的挂钩。这些机制包括：


    1. 稳定性费用，在 `CDP` 关闭时支付（类似于上面 Stablebucks 例子中的借贷成本）；

    2. 需要时清算 `CDPs` 的能力；

    3. `Maker` 代币 (`MKR`)。


    在 `Maker/DAI` 系统中，`CDPs` 会收取费用（稳定性费用），该费用根据铸造的 `DAI` 总量相对于 `CDP` 中持有的抵押品计算。在上面的示例中，如果
    Bibi 使用其 150 美元的加密货币抵押品铸造并提取了 100 个 `DAI`，系统将根据提取的 100 个 `DAI`向 Bibi 收取稳定性费用。


    稳定性费用的旨在解决 `DAI` 供需平衡的风险以支持挂钩。例如，如果 `DAI` 持续高于 1 美元，表明 `DAI` 的需求大于供应。在这种情况下，可以降低稳定性费用（借贷成本），以激励人们创建
    `CDPs` 并铸造 `DAI`，从而增加供应以满足需求。


    相反，如果 `DAI` 持续低于 1 美元，表明 `DAI` 的供应大于需求。在这种情况下，可以提高稳定性费用（借贷成本），这会增加铸造或持有 `DAI`
    相关的成本，激励人们关闭他们的 `CDPs` 并减少供应。自 `Maker/DAI` 系统创建以来，稳定性费用经历了大幅波动。它最初设定为 0.5%，曾达到
    2.5%的高位。


    `Maker/DAI` 系统维持挂钩最易解释的方式是，当抵押品价值跌至某些阈值时清算 `CDPs`，从而降低加密货币抵押品价值低于基于该抵押品创建的 `DAI`
    价值的风险。每个 `CDP` 都是根据当时的加密价格创建的，而 `Maker/DAI` 系统整体基于所有 `CDPs` 中持有的加密货币的加权平均值。根据上面的示例，如果
    `CDP` 中持有的价值 150 美元的加密货币抵押品价值接近 100 美元，系统可以在价格低于 100 美元之前出售该 `CDP`，以确保系统中的抵押品价值始终高于其创建的
    `DAI`。


    虽然稳定性费用和 `CDPs` 的清算在大多数情况下能维持 `DAI` 挂钩美元，但在加密货币价格突然下降的情况下，两者都无法起作用。在这种情况下，可能无法在
    `CDPs` 中的价值低于其创建的 `DAI` 数量之前清算 `CDPs`，这将使维持挂钩变得困难或不可能。为了应对这一风险，`Maker/DAI` 系统使用了
    `MKR` 代币。


    `MKR` 代币是 `Maker/DAI` 系统的治理机制，通过发行 `MKR` 代币筹集的资金为 `Maker/DAI` 系统提供了额外的抵押品以维持挂钩。`MKR`
    代币持有者除了向系统提供抵押品外，还有权对影响 `Maker/DAI` 系统增长和稳定性的问题进行投票。该系统激励他们仔细监控系统，并作为回报为他们的工作赚费用。

