    The Funds Travel Rule has led several regulated exchanges to begin delisting privacy
    coins out of fear they may violate AML regulations. For example, `Coinbase` in
    the UK delisted `Zcash` in August 2019, and Korea’s `OKEx` and `Upbit` exchanges
    announced they would delist at least five privacy coins, including `Zcash` and
    `DASH`, in September 1432019. The `Coinbase` delisting appears to have been driven,
    in part, by its new banking partner, `ClearBank`, demanding that the exchange
    delist `Zcash`.


    The `OKEx` and `Upbit` delisting announcements were driven by `FATF` and Funds
    Travel Rule concerns, and `OKEx` cited the Funds Travel Rule in announcing its
    decision. `Upbit` followed through on its announcement to delist the `Zcash` in
    September 2019. However, in October 2020, `OKEx` announced the delisting was under
    review, and a final decision on `Zcash` and `DASH` would be announced after that
    review. As of May 2020, `OKEx` had yet to remove `Zcash` trading from its platform.


    Prior to 2019, it was unclear whether `FinCEN` would consider `coinjoins` and
    other mixers (called anonymizing services by `FinCEN`) as money transmitters,
    thus subject to AML regulations. However in 2019, `FinCEN` promulgated guidance
    clarifying when anonymizing services would be subject to `FinCEN` regulation.
    According to `FinCEN`, there were two types of anonymizing services:


    1. Services Providers: either persons that accept `[crypto]` and retransmit them
    in a manner designed to prevent others from tracing the transmission back to its
    source, and


    2. Software Providers: suppliers of software a transmittor would use for the same
    purpose.


    In its 2019 guidance, `FinCEN` stated that anonymizing Service Providers would
    be considered money transmitters because such businesses are “engaged in the business
    of offering secure money transmission.” However, anonymizing Software Providers
    would not be considered money transmitters, because “suppliers of tools 144(communications,
    hardware, or software) that may be utilized in money transmission, like anonymizing
    software, are engaged in trade and not money transmission.” [Emphasis supplied]


    That distinction was important because prior to the guidance, it was unclear whether
    `FinCEN` was going to attempt to subject software platforms and developers of
    anonymizing software to AML/KYC regulations. Doing so would have defeated the
    purpose of anonymizing services and effectively destroyed those businesses.


    While those services appear legal in the US, that is not universally the case.
    In December 2019, a `Binance` customer tweeted that the `Binance` Singapore exchange
    prevented him from withdrawing his crypto because he used a mixer. The mixer in
    question was the `Wasabi` mixing wallet, a decentralized `coinjoin` that does
    not offer third-party services that take custody of user funds, thus an anonymizing
    Software Provider not subject to AML regulations according to `FinCEN`.


    The `Binance` action troubled many in the crypto industry, because the exchange
    had already followed KYC rules with the customer, meaning it appeared to be solely
    the use of the mixer that caused `Binance` to freeze the customer’s account. After
    the customer’s tweet, crypto Twitter (`#CryptoTwitter`, `#crypto`, `#bitcoin`)
    was abuzz with speculation about the reason for `Binance`’s action. `Binance`
    CEO `Changpeng Zhao` (`CZ`) alluded that AML/CFT/KYC regulations were a reason
    the customer’s coins were frozen. The customer was ultimately allowed to withdraw
    his funds, but only after promising not to deposit to a mixing wallet again.


    It is likely the `Binance` action was the first live skirmish in a coming government
    battle against `coinjoins` and mixers, however that battle has been brewing for
    years. In January 2017, officials from `145Europol`, `Interpol`, and the `Basel
    Institute on Governance` met to discuss crypto generally, and mixers in particular.
    Following the conference, the `Basel Institute` issued the following warning:


    > All countries are advised to take action against digital currency mixers/tumblers.
    Such services are designed exclusively to anonymize transactions and to make it
    impossible for law enforcement agencies to detect and trace suspicious transactions.
    The existence of such companies should not continue to be tolerated.


    146


    ## State Laws and the UCC


    In the US, commercial transaction laws are generally governed by the states. Each
    state has enacted laws and regulations that determine commercial transaction rules
    within its borders. To provide a measure of interstate consistency, all 50 states
    have adopted some form of the Uniform Commercial Code (described in the box below),
    drafted by the `Uniform Law Commission`.


    | The Uniform Commercial Code (UCC) |

    | :--- |

    | The `UCC` is a set of model laws that provides rules governing commercial or
    business transactions (other than real estate). The `UCC` was first published
    in 1952 by the `Uniform Law Commission` and has been revised numerous times over
    the years. Although all 50 states have adopted the `UCC`, jurisdictional variations
    exist, often related to state-specific concerns. The `UCC` covers a number of
    transactions, including sales, leases, negotiable instruments, bank deposits and
    collections, funds transfers, letters of credit, bulk sales, documents of title,
    investment securities, and secured transactions. The main goals of the `UCC` are:
    <<ul>><li>to provide simple, clear rules for commercial transactions;</li><li>to
    permit the continued expansion of commercial practices through custom, usage,
    and agreement of the parties;</li><li>to make the laws of commercial transactions
    uniform among the states.</li></ul> |

    | In 2017, the `Uniform Law Commission` drafted a framework for regulating crypto-related
    business activity, called the `147Uniform Regulation of Virtual Currency Act`
    (`URVCBA`). In 2018, the `Uniform Law Commission` added a `Supplemental Act` to
    the `URVCBA` (collectively, the `URVCBA` and the `Supplemental Act` are referred
    to as the `Model Acts`) that “provided commercial law rules using the time-tested
    duties and rights of customers under the `UCC`.” In a statement, the `Uniform
    Law Commission` said: “To meet the growing need for law on this topic, the `[Uniform
    Law Commission and American Law Institute]` have created a study committee to
    determine how `[UCC]` might be amended on a uniform basis to deal with emerging
    technologies. States are urged to refrain from enacting legislation pending the
    result of the committee’s work.” |

    '
