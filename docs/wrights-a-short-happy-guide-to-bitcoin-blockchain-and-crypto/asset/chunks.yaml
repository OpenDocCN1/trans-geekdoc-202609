- raw: "*   soliciting purchases, sales, or offers to buy securities offered or displayed\
    \ on their websites or portals;\n\n*   compensating employees, agents, or other\
    \ persons for such solicitation or based on the sale 197of securities displayed\
    \ or referenced on their websites or portals;\n\n*   holding, managing, possessing,\
    \ or otherwise handling investor funds or securities; or\n\n*   engaging in activities\
    \ the SEC, by rule, determines inappropriate.\n\nEquity crowdfunding portals share\
    \ similarities with donation-based crowdfunding portals like Kickstarter. However,\
    \ with equity crowdfunding, investors purchase shares in the company instead of\
    \ a product or service. |\n\n| --- |\n\nReg D\n\nThrough Reg D, issuers can raise\
    \ potentially unlimited amounts of money from the sale of restricted securities.\
    \ As part of a Reg D offering, issuers provide prospective investors with offering\
    \ documents explaining the offering. Three rules-based Reg D offerings are Rule\
    \ 504, Rule 506(b) and Rule 506(c). Each differs in the amount of money that can\
    \ be raised, the acceptable investors, and the type of permissible solicitations.\
    \ The provisions of each rule are outlined briefly below.\n\nRule 504\n\nRule\
    \ 504, which does not preempt state law, allows an issuer to raise $5,000,000\
    \ of restricted securities in any 12-month period. Investors in offerings under\
    \ Rule 504 should be informed that they may not be able to sell the securities\
    \ for at least a year unless the issuer registers the resale transaction with\
    \ the SEC. For the most part, general solicitation is prohibited in Rule 504 offerings,\
    \ but there is a provision in Rule 504 that allows general solicitation based\
    \ on state laws.\n\n198 \n\nRule 506(b) and (c)\n\nUnder Rules 506(b) and (c),\
    \ which both preempt state law, an issuer can raise an unlimited amount of money\
    \ from selling restricted securities. The differences are:\n\nUnder Rule 506(b),\
    \ an issuer:\n\n*   can sell restricted securities to an unlimited number of accredited\
    \ investors and up to 35 non-accredited investors;\n\n*   cannot use general solicitation\
    \ or advertising to market the restricted securities; and\n\n*   must make itself\
    \ available to answer questions by prospective purchasers.\n\nIn contrast, under\
    \ Rule 506(c), an issuer:\n\n*   can only sell restricted securities to accredited\
    \ investors; and\n\n*   can solicit and generally advertise the offering only\
    \ to accredited investors.\n\nBoth Rules 506(b) and (c) require issuers to take\
    \ reasonable steps to verify that the investors are accredited investors, which\
    \ could include reviewing documentation, such as W-2s, credit reports, tax returns,\
    \ as well as financial statements.\n\n199 \n\n![](Image_62.jpg)\n\nA New Financial\
    \ Product: A Bitcoin ETF\n\nIn addition to traditional securities like stocks,\
    \ the SEC also regulates the offer and sale of pooled investment products available\
    \ to the general public, including exchange-traded funds (ETFs). ETFs are investment\
    \ funds comprised of baskets of different securities, indexes, commodities, bonds,\
    \ or other assets. At the end of 2019, ETFs had a market capitalization of over\
    \ $3 trillion, with the top ten ETFs holding assets valued at over $900 billion,\
    \ and over 650 million ETF shares trading daily. The box below explains how ETFs\
    \ work.\n\n| How ETFs WorkShares in an ETF represent fractional interests in the\
    \ pool of assets held by the ETF, and trade on exchanges like the New York 200Stock\
    \ Exchange or NASDAQ just like stocks. Each ETF share represents a fixed percentage\
    \ of the ETF’s net asset value (NAV), so as prices of the ETF’s assets go up,\
    \ so do the prices of ETF shares. One of the most popular ETFs is the iShares\
    \ Core Standard & Poor’s (S&P) 500 ETF (ticker symbol IVV), which tracks the investment\
    \ results of an index composed of the S&P 500—the 500 public US companies with\
    \ the largest market capitalization.ETFs are structured as passive investment\
    \ vehicles, in contrast to mutual funds that are actively managed by fund managers\
    \ who pick the mutual fund’s investments. Many brokers do not charge commissions\
    \ for ETF purchases, nor do they impose minimum investment requirements. In contrast,\
    \ mutual funds often require a minimum investment and charge brokerage fees for\
    \ trades.Because ETFs have no active managers, their expenses are typically small\
    \ relative to mutual fund expenses. For example, the iShares Core S&P 500 ETF,\
    \ as of April 2020, showed an expense ratio of 0.04 percent, while the average\
    \ mutual fund had an expense ratio of between 0.5 and 1.0 percent, with some as\
    \ high as 1.4 percent. In addition to having lower expenses, ETFs often outperform\
    \ mutual funds. For example, Barron’s reported that only three of the top 20 actively-managed\
    \ equity mutual funds outperformed the S&P 500 index as of November 2019, and\
    \ of those three, only one was open to new investors.[42](#section10.xhtml#ftn.77)The\
    \ number of ETF shares is regulated through a mechanism known as creation and\
    \ redemption, a function of the market demand for the underlying assets. That\
    \ creation and redemption mechanism relies on entities known as “authorized participants”\
    \ 201who are contractually responsible for acquiring and disposing of assets on\
    \ behalf of the ETFs. The mechanism operates as follows:Creation: When an ETF\
    \ wants to create new ETF shares, the ETF directs the authorized participants\
    \ to first buy more of the underlying assets, and then sell those assets to the\
    \ ETF for new ETF shares. The authorized participants then sell the new ETF shares\
    \ on the open market.Redemption: When an ETF wants to reduce the number of ETF\
    \ shares, the ETF directs the authorized participants to first buy ETF shares\
    \ on the open market, and then sell those shares back to the ETF in exchange for\
    \ the underlying ETF assets. The authorized participants then sell those assets\
    \ on the open market. |\n\n| --- |\n\nThe SEC has not approved any Bitcoin ETF\
    \ proposals, despite receiving proposals from as far back as 2016. A Bitcoin ETF\
    \ is expected to increase demand for bitcoin because the investing public will\
    \ be able to indirectly purchase bitcoin through traditional securities brokers\
    \ and exchanges, without the need for a crypto wallet, a private key, or any of\
    \ the technology-related things that have tended to limit the appeal of crypto\
    \ to the broader investing public.\n\nApproval of a Bitcoin ETF is also expected\
    \ to generate more investment from institutional investors. To date, many of those\
    \ investors have shied away from direct investments in crypto, often because of\
    \ the custody risk of holding private keys, or because regulations or their operating\
    \ rules prevent them from investing in non-regulated financial products.\n\nOnce\
    \ a Bitcoin ETF is approved, demand from institutional investors is likely to\
    \ increase. One reason for that is because the market 202performance of bitcoin\
    \ has generally been uncorrelated to the performance of the stock market, as well\
    \ as most other financial assets. As a result, according to modern portfolio theory,[43](#section10.xhtml#ftn.78)\
    \ holding bitcoin will help portfolios maximize expected returns for a given level\
    \ of risk.\n\nWhether a Bitcoin ETF will increase demand for bitcoin, and thereby\
    \ the price of bitcoin, is anyone’s guess. However, the history of the first gold\
    \ ETF does lend support to the idea that a Bitcoin ETF would increase the BTC\
    \ price. When the first gold ETF came to market in 2003, gold experienced a steady\
    \ increase in price over the next ten years or so. However, whether, and the extent\
    \ to which, the gold ETF caused the price increase is debatable, to say the least.\
    \ As the saying goes, correlation does not equal causation.\n\nWhat’s the holdup?\n\
    \nThe SEC has stated that it will approve a Bitcoin ETF once it determines that\
    \ such an ETF is safe for the investing public. The articulated reasons the SEC\
    \ has rejected Bitcoin ETF proposals include:\n\n*   the bitcoin market is easily\
    \ manipulated;\n\n*   there are inadequate custody solutions available for securely\
    \ holding bitcoin;"
