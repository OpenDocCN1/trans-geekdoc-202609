  trans: '


    “以太坊是一个运行智能合约的去中心化平台：这些应用程序完全按照程序运行，不存在任何停机、审查、欺诈或第三方干预的可能性，”而其代币以太（`ETH`）“是运行分布式应用平台以太坊的必要元素——燃料。它是平台客户向执行请求操作的机器支付的一种支付形式。”


    以太坊的设计是为了让开发者和创业者能够更容易构建智能合约和 ĐApps。在 2017–18 年间，91% 的初始代币发行（ICO，一种智能合约的形式）在以太坊上发布。2019
    年底，以太坊、EOS 和波场（Tron）占据了总 ĐApp 交易 98% 以上的份额，报告的交易量分别为 128 亿美元、61 亿美元和 44 亿美元。


    所有网络都面临着许多挑战者，这些他们声称自己的网络对于 ĐApps 和智能合约来说“更好”，这通常意味着这些网络速度更快、可扩展性更高，并且能够处理更多的交易。以太坊的可扩展性问题在
    2017 年基于一个基于以太坊的 ĐApp 游戏 `Cryptokitties` 变得明显。


    ### Cryptokitties


    Cryptokitties 是一个虚拟收藏品应用，允许用户领养、饲养和交易虚拟猫。Cryptokitties 依赖遗传算法来产生新猫，考虑了父母选择、基因突变以及每个父母基因的交叉，使得每只新猫都拥有独特的基因组。在游戏中，每只
    `cryptokitty` 都有 256 位的基因组，这意味着每只猫大约有四十亿可能的基因变异。此外，每只猫都是独一无二的数字资产，因为每只猫都由一个非同质化令牌（称为
    `ERC-721` 令牌）代表，这意味着每个令牌都是唯一的。


    ![](img/Image_21.jpg)


    致谢：Cryptokitties.co。


    在 Cryptokitties 中，智能合约被用于执行繁殖、饲养、喂养、装饰、购买和出售猫的任务。每当执行新任务时（例如繁殖一只新猫），就会执行一个新的智能合约，该合约继承其他相关智能合约的信息（例如每个父母的基因组）。然后，当需要执行其他任务时（例如饲养新猫），会根据较早的智能合约执行另一个新的智能合约。作为一个区块链应用，每只
    `cryptokitty` 的整个智能合约历史都会被记录并供所有人查看。


    下表了记录的一些信息以及使用的智能合约编程语言：


    ![What Are Cryptokitties? Crash Course ](img/Image_22.jpg)


    来源：[`blockgeeks.com/guides/cryptokitties/`](https://blockgeeks.com/guides/cryptokitties/)。


    Cryptokitties 是以太坊上最流行的应用程序——事实上，它流行到几乎关闭了整个网络。


    #### Cryptokitties 是如何几乎关闭以太坊的？


    因为繁殖、饲养、喂养、装饰、购买和出售 Cryptokitties 都是独立的智能合约，在巅峰时期，这些活动消耗了以太坊网络流量 20% 以上。结果是交易处理时间从几秒钟增加到十分分钟或更长时间，许多交易从未被执行。


    Cryptokitties 和比特币的吸引力基于同样的原理：稀缺性。对于比特币，永远只会产生 2100 万个 `BTC`，这种稀缺性驱动了需求。对于 Cryptokitties
    来说，能够获得一种独特的、因此稀缺的收藏品资产。Cryptokitties 的开发者发现，通过创建几乎无限数量的特征，市场会不断对某些特征产生需求，用户会沉迷于繁殖、交易和收集具有这些特征的猫。Cryptokitties
    的网络问题凸显了广泛采用区块链的一个主要障碍：可扩展性。


    ### 可扩展性


    为了让区块链应用能够触及主流用户，它的性能必须像主流应用程序一样。在一个拥有有互联网和 5G 的世界里，这意味着快速。但大多数主流区块链由于“可扩展性三困境”，无法在不损害安全和去中心化的情况下快速执行交易。对于
    PoW（工作量证明）区块链，速度由两个主要因素决定：将交易添加到区块的时间以及达到共识的时间。


    `PoW` 区块链的可扩展性问题带来了一项艰巨的技术挑战。目前，许多区块链节点存储区块链的完整历史，在某些情况下还处理交易。两个流行的 `PoW` 区块链比特币和以太坊每秒分别只能处理三到七笔和七到十五笔交易。[14]
    远低于 Visa 每秒二十四笔交易的速度。这种无法扩展的能力带来了一个挑战。限制比特币扩展能力（交易吞吐量）的一个因素是每个区块中的数据量。目前，比特币有一个
    `1 MB` 的区块大小限制。[15]


    一个被广泛讨论的比特币可扩展性解决方案是增加基础区块大小。在那场辩论中，增加区块大小的主要论点是，这样做可以在每个区块中包含更多数据，允许更大的交易吞吐量。反对增加区块大小的主要论点是，这将扩展成本直接转嫁给节点运营商，他们必须升级设备。由于更多节点运营商无法或不愿升级，网络将不可变得更加中心化。关于增加区块大小的首次比特币辩论发生在
    2015 年。比特币社区最终决定不增加区块大小，这导致了硬叉。


    有些已经实施或即将实施的扩展解决方案允许部分节点验证交易。到目前为止，最受讨论的解决方案是比特币的 `SegWit` 和 `Lightning`，以及以太坊的
    `Sharding`（分片）和 `Plasma`。


    不同的解决方案在不同的链上演变，是因为广义地说，每条链都有不同的目标：比特币的价值主张是作为“数字黄金”，一种主要作为价值存储手段的加密货币，也可以作为交易媒介和记单位（如第二部分所讨论）。以太坊的价值主张是作为各种智能合约和
    ĐApps 的操作系统，并可能是物联网（IoT）的主操作系统。


    ### 比特币扩展——SegWit 和 Lightning


    #### SegWit


    SegWit 如何工作？


