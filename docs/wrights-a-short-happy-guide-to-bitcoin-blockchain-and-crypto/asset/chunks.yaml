  trans: '


    自 2014 年以来，已经至少发生了 74 次被动的`BTC`硬分叉和空投，这意味着项目向现有的`BTC` 持有人发放了代币，而这些个人并未参与其中。由于这些现有的`BTC`
    持有人“能够”对这些空投币行使支配和控制权，根据 2019 年指南，这些纳税人被要求将空投币的`FMV`作为普通收入进行申报，无论纳税人是否知晓这些空投的存在。另一个问题是，其中许多项目已经失败了，导致代币一文不值。因此，纳税人面临着对他们未要求、未使用、且以后可能变得毫无价值的财产纳税。


    让纳税人的处境更加糟糕的是，`Revenue Ruling 2019–24` 具有溯及力，且没有提供任何安全港或过渡救济。因此，为了符合 2019 年指南，纳税人可能需要提交至少三年前（在某些情况下为六年前）的修正纳税申报。65
    对于`BTC` 持有人来说，这意味着他们必须提交申报表，其中包含那 74 次在空投时并非毫无价值的任何空投，无论这些空投币后来是否变得毫无价值。


    `AICPA Letter`还提了该`Revenue Ruling`的溯及力，指出：“财政部和美国国税务局（IRS）在发布具有溯及力的指南之前，应当先发布拟议的法规。”`AICPA`
    建议为纳税人提供安全港，给予他们在 2019 年指南之前的纳税年度获得过渡救济。


    ## 税务指南的局限性


    2019 年指南的一个核心问题在于它不具有法律或法规的效力，这意味着它所解决许多问题最终可能由法院或国会决定。此外，正如`AICPA Letter`所提到的，通过`FAQs`提供的指南是不可靠的，且“可能随时更改且不另通知”。此外，与`FinCEN`和`SEC`的指南不同，`IRS`的指南更容易受到挑战，成本也远低得多。


    尽管像`Rev. Rul. 2019–24`这样的收入裁决是`IRS`对`Code`的官方解释，但法院并不强制遵循它们。传统上，法院对收入裁决适用所谓的`Skidmore
    deference`（斯基德莫尔尊重），这意味着法院在做出决定时会考虑收入裁决的说服力。相比之下，税务法规享有`Chevron deference`（雪佛龙尊重），66，这意味着通常情况下，只要`IRS`的立场是合理的，无论无论法院是否认为另一个立场更好。


    如果纳税人对`IRS`指南有异，纳税人可以报告与`IRS`指南不的交易，并观察`IRS`是否会挑战纳税人的申报方法。这反过来将负担置给了`IRS`，使其必须在处理的数百万份申报表中首先识别出不一致的处理方式，然后决定是否应该挑战纳税人。如果有数百或数千名纳税人提交不一致的报告，`IRS`将面临如何为所有此类纳税人维护其立场的困境，并且通常会提供极低价格的和解方案，而不是对所有此类挑战进行诉讼。67


    当`IRS`挑战纳税人的申报方法时，它必须投入资源确定事实并与每个此类纳税人进行谈判，这对于`IRS`来说也是一项昂贵的开支。此外，在缴纳税款之前，这些纳税人中的每一个人都可以通过向`美国税务法院`提起挑战任何最终的`IRS`裁定，而法院不受`IRS`裁定的约束。或者，在缴纳税款后，纳税人可以在联邦法院起诉退税，这些同样不受`IRS`裁定的约束。


    在何种情况下，如果法院支持`IRS`，纳税人的成本通常只有补税和挑战成本。只要纳税人的立场是合理的，就不可能被罚款。因此，纳税人通常将采取冒险性的税务立场视为一种博弈，最坏的结果是被`IRS`发现并在三到六年后缴纳税款。这加之被发现的概率相对较小（`IRS`在
    2018 年仅审计了约 0.59%的个人纳税申报表），意味着许多纳税人至少会考虑采取这种博弈的打算。


    `IRS`指南的另一个局限性是，挑战它的成本与挑战`SEC`或`FinCEN`的成本相比相微不足道。这两个机构都有权对其认为违反其指南的个人和实体罚款或提起刑事指控。因此，在法院上与`SEC`或`FinCEN`对质的成本往往远超挑战`IRS`的成本。例如，应对`SEC`的防御（如《证券法》章节所述）已耗了超过
    500 万美元，并需要律师花费数千小时的时间来分析无数法律和事实问题。


    `IRS`发布模糊的指南来鼓励纳税人去挑战它是毫无意义的，这将导致`IRS`浪费宝贵的资源来处理自残的后果。希望`IRS`能采纳`AICPA`的建议，以拟议法规的形式发布指南，并留出意见征求期。68


    ## IRS 执法


    虽然`IRS`在 2019 年之前没有通过指南的形式发布很多，但它仍确保加密货币法律的执行。例如，在 2016 年 11 月，`IRS`向`Coinbase`发布了一份`John
    Doe`传票，寻求有关`Coinbase`客户加密交易的信息。


    ### 什么是 IRS John Doe 传票？


    `John Doe`传票是一种并非寻求特定可识别个人信息的命令，而是识别某项活动，并寻求参与该活动的个人或实体的信息。当`IRS`认为纳税人从事不当行为且能够识别交易类型，但无法识别个人纳税人时，通常会使用传票。根据`Code`第
    7609(f)条，为了获得 John Doe 传票，`IRS`必须说服联邦法官：1）传票涉及对某一可确定群体或类别的调查；2）有合理理由相信该群体或类别可能未能遵守美国法律；3）传票寻求的信息无法从其他其他轻易获得。


    '
