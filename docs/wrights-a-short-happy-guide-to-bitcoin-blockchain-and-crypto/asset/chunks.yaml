- raw: "Ethereum has been more aggressive in attempting to scale because it faces\
    \ greater competition in its quest to remain the dominant platform for ĐApps and\
    \ smart contracts, thus the dominant operating system for the IoT. The potential\
    \ revenues from usurping Ethereum’s position has piqued the interest of investors\
    \ and developers alike, and has allowed them, by avoiding some of the limitations\
    \ of Ethereum, to offer platforms that have greater potential for scaling and\
    \ wider adoption. Two such Ethereum competitors, EOS and Tron, claim faster transactional\
    \ throughput and lower fees. But Ethereum has not abandoned the fight and has\
    \ taken significant steps to improve.\n\nEthereum’s most discussed scaling improvements\
    \ are the Raiden Network, Plasma, Sharding, planned forks (including Constantinople,\
    \ Istanbul, and Berlin) and Casper—Ethereum’s proposed change to a PoS consensus\
    \ mechanism. The name for the full integration of Casper and Sharding is “Serenity”\
    \ and it will 57create what has been dubbed “Ethereum 2.0.” Each is discussed\
    \ briefly below.\n\nRaiden Network and Plasma\n\nThe Raiden Network is essentially\
    \ Ethereum’s version of the Lightning Network, and it went live on Ethereum’s\
    \ main network in December 2018. Like Lightning, Plasma sends transactions off-chain\
    \ while relying on the Ethereum network for its underlying security. However,\
    \ Plasma’s architecture is structured more like a tree, with branches off the\
    \ main Ethereum blockchain that can spawn other branches. Plasma works by moving\
    \ the computationally complex transactions to the side branches and only broadcasting\
    \ the completed smart contracts to the Ethereum blockchain.\n\nSharding\n\nSharding\
    \ is a concept widely used in databases to make them more efficient. A shard is\
    \ a horizontal portion, or slice, of a database. Sharding works by partitioning\
    \ large databases into smaller databases, which makes performing database operations\
    \ more manageable.\n\nFor blockchains, sharding works by partitioning the existing\
    \ blockchain into smaller pieces (shards) so that each node need only store a\
    \ shard of the blockchain’s data, but allows the shards to communicate in a way\
    \ that will allow the chain to remain secure and decentralized. By some estimates,\
    \ if Ethereum had one hundred shards, the chain would be able to process around\
    \ ten thousand transactions per second. However, Ethereum cannot use sharding\
    \ until Casper is implemented, because sharding in a PoW network is more difficult\
    \ and makes the network more vulnerable to attack.\n\nAlthough sharding offers\
    \ many potential benefits, it also exposes a number of potential attack vectors.\
    \ Generally speaking, those vectors relate to the data validity and availability:\n\
    \n58 \n\nValidity: When interacting with a shard, it may be impossible to validate\
    \ the history of that shard, which puts into question the validity of the entire\
    \ chain that shard claims to represent.\n\nAvailability: A full explanation of\
    \ the data availability problem is beyond the scope of this book. Very briefly,\
    \ the problem has to do with ensuring there is sufficient data in shards to detect\
    \ attacks and fraud, allowing transactions to be either (i) deemed verified and\
    \ processed, or (ii) deemed invalid and penalized, thereby disincentivizing future\
    \ attacks and fraudulent activities.\n\nPlanned Ethereum Forks\n\nMany improvements\
    \ to Ethereum are implemented through planned software upgrades, called forks.\
    \ Some of the more significant planned forks are described below:\n\nConstantinople:\
    \ Constantinople was a February 2019, upgrade to Ethereum that was designed to,\
    \ among other things, make it easier to develop projects on the chain, allow implementation\
    \ of scaling solutions in the future, and be a step toward transitioning Ethereum\
    \ to a PoS chain (Casper). Constantinople required a hard fork of the Ethereum\
    \ blockchain and reduced the block reward from 3 ETC to 2 ETC (the previous major\
    \ fork upgrade, Byzantium, reduced the block reward from 5 ETC to 3 ETC).\n\n\
    Istanbul: Istanbul was a December 2019 hard fork that introduced additional privacy\
    \ and scaling capabilities, rebalanced certain ETH pricing mechanisms, allowed\
    \ Ethereum and Zcash (a crypto that offers completely private transactions that\
    \ can be verified by smart 59contracts on Ethereum) to work better together, and\
    \ permitted more functionality to smart contracts.\n\nBerlin: The Berlin hard\
    \ fork is tentatively expected in June 2020, and will introduce an algorithm dubbed\
    \ Progressive Proof of Work (ProgPoW). As explained by CoinDesk, ProgPoW is a\
    \ transitional step needed before Ethereum changes to a PoS system. In addition,\
    \ Berlin will reduce the mining capabilities of the more expensive ASIC chips\
    \ (ASIC chips are “application-specific integrated circuits” which are computer\
    \ chips specially designed for, and therefore thousands of times more efficient\
    \ at, mining) and increase the capabilities of non-ASIC chips used in most personal\
    \ computers, like CPUs and GPUs (GPUs are “graphics processing units” which are\
    \ found in many standard computers and allow images to be displayed). One reason\
    \ for the move away from ASIC chips is the belief that as more mining is done\
    \ by ASIC chips, fewer miners will be able to compete for block rewards, and the\
    \ mining pool will become more centralized.\n\nCasper: Ethereum’s most profound\
    \ change will be Casper, which will transition Ethereum to a PoS chain. Doing\
    \ so would eliminate Ethereum mining and, by moving to PoS, allow much faster\
    \ transactional throughput.\n\nSerenity—Ethereum 2.0\n\nSerenity is the final\
    \ step in Ethereum 2.0 and a combination of Casper and Sharding that cannot be\
    \ implemented until both are operational. Serenity is not expected to be implemented\
    \ until late 2020 at the earliest. According to the Ethereum core developers,\
    \ Serenity will complete the switch to a PoS consensus mechanism and usher in\
    \ a thousand-fold increase in scalability, while also making the chain more secure\
    \ and energy efficient.\n\n60 \n\nForks and Chain Splits\n\nNot everything that\
    \ is faced can be changed, but nothing can be changed until it is faced.\n\n—James\
    \ Baldwin\n\nThere often comes a time when, for one reason or another, things\
    \ change. On the blockchain, those changes are represented by forks. A blockchain\
    \ fork is a modification of the blockchain’s software, and a forked blockchain\
    \ refers to a blockchain after the modification has been implemented.\n\nMuch\
    \ has been written about some of the more contentious forks in Bitcoin and Ethereum,\
    \ but forks are sometimes benign. In some cases, a fork occurs when two or more\
    \ nodes discover blocks at the same time. These forks are temporary and resolved\
    \ on the blockchain. In other cases, forks are used to implement upgrades or to\
    \ test features and processes on a blockchain before introducing them to the public.\n\
    \nThere are two types of forks: hard forks and soft forks. The primary difference\
    \ between the two deals with backwards compatibility, which is the ability of\
    \ new versions of the blockchain to understand and function on data created by\
    \ older versions of the blockchain. Each is discussed below.\n\nSoft fork\n\n\
    A soft fork is a software upgrade that tightens or restricts the rules of the\
    \ protocol. Soft forks are backwards compatible, meaning older pre-fork blocks\
    \ can accept and work with newer post-fork blocks. However, the newer post-fork\
    \ blocks would reject the older pre-fork blocks if those older pre-fork blocks\
    \ violate the rules instituted by the soft fork.\n\n61 \n\nAn example of a soft\
    \ fork was Bitcoin’s introduction of a block size limit. Initially, Bitcoin did\
    \ not have a limit on the size of a block, but a soft fork was executed in 2010\
    \ that set a 1 MB block size limit for all new blocks. The new limit meant that\
    \ new post-fork blocks of 1 MB would not be rejected by pre-fork blocks which\
    \ had no limit, but if miners attempted to add a 2 MB block (which would have\
    \ been accepted pre-fork), that block would be rejected after the 2010 soft fork\
    \ because it violated the 1 MB limit set by the soft fork."
  fmt: '

    Ethereum has been more aggressive in attempting to scale because it faces greater
    competition in its quest to remain the dominant platform for ĐApps and smart contracts,
    thus the dominant operating system for the IoT. The potential revenues from usurping
    Ethereum’s position has piqued the interest of investors and developers alike,
    and has allowed them, by avoiding some of the limitations of Ethereum, to offer
    platforms that have greater potential for scaling and wider adoption. Two such
    Ethereum competitors, `EOS` and `Tron`, claim faster transactional throughput
    and lower fees. But Ethereum has not abandoned the fight and has taken significant
    steps to improve.


    Ethereum’s most discussed scaling improvements are the `Raiden Network`, `Plasma`,
    `Sharding`, planned forks (including `Constantinople`, `Istanbul`, and `Berlin`)
    and `Casper`—Ethereum’s proposed change to a PoS consensus mechanism. The name
    for the full integration of `Casper` and `Sharding` is “Serenity” and it will
    create what has been dubbed “Ethereum 2.0.” Each is discussed briefly below.


    ### Raiden Network and Plasma


    The `Raiden Network` is essentially Ethereum’s version of the `Lightning Network`,
    and it went live on Ethereum’s main network in December 2018. Like `Lightning`,
    `Plasma` sends transactions off-chain while relying on the Ethereum network for
    its underlying security. However, `Plasma`’s architecture is structured more like
    a tree, with branches off the main Ethereum blockchain that can spawn other branches.
    `Plasma` works by moving the computationally complex transactions to the side
    branches and only broadcasting the completed smart contracts to the Ethereum blockchain.


    ### Sharding


    `Sharding` is a concept widely used in databases to make them more efficient.
    A `shard` is a horizontal portion, or slice, of a database. `Sharding` works by
    partitioning large databases into smaller databases, which makes performing database
    operations more manageable.


    For blockchains, `sharding` works by partitioning the existing blockchain into
    smaller pieces (`shards`) so that each node need only store a `shard` of the blockchain’s
    data, but allows the shards to communicate in a way that will allow the chain
    to remain secure and decentralized. By some estimates, if Ethereum had one hundred
    shards, the chain would be able to process around ten thousand transactions per
    second. However, Ethereum cannot use `sharding` until `Casper` is implemented,
    because `sharding` in a PoW network is more difficult and makes the network more
    vulnerable to attack.


    Although `sharding` offers many potential benefits, it also exposes a number of
    potential attack vectors. Generally speaking, those vectors relate to the data
    validity and availability:


    - **Validity**: When interacting with a `shard`, it may be impossible to validate
    the history of that `shard`, which puts into question the validity of the entire
    chain that shard claims to represent.

    - **Availability**: A full explanation of the data availability problem is beyond
    the scope of this book. Very briefly, the problem has to do with ensuring there
    is sufficient data in shards to detect attacks and fraud, allowing transactions
    to be either (i) deemed verified and processed, or (ii) deemed invalid and penalized,
    thereby disincentivizing future attacks and fraudulent activities.


    ### Planned Ethereum Forks


    Many improvements to Ethereum are implemented through planned software upgrades,
    called forks. Some of the more significant planned forks are described below:


    - **Constantinople**: `Constantinople` was a February 2019, upgrade to Ethereum
    that was designed to, among other things, make it easier to develop projects on
    the chain, allow implementation of scaling solutions in the future, and be a step
    toward transitioning Ethereum to a PoS chain (`Casper`). `Constantinople` required
    a hard fork of the Ethereum blockchain and reduced the block reward from `3 ETC`
    to `2 ETC` (the previous major fork upgrade, `Byzantium`, reduced the block reward
    from `5 ETC` to `3 ETC`).

    - **Istanbul**: `Istanbul` was a December 2019 hard fork that introduced additional
    privacy and scaling capabilities, rebalanced certain `ETH` pricing mechanisms,
    allowed Ethereum and `Zcash` (a crypto that offers completely private transactions
    that can be verified by smart contracts on Ethereum) to work better together,
    and permitted more functionality to smart contracts.

    - **Berlin**: The `Berlin` hard fork is tentatively expected in June 2020, and
    will introduce an algorithm dubbed `Progressive Proof of Work` (`ProgPoW`). As
    explained by `CoinDesk`, `ProgPoW` is a transitional step needed before Ethereum
    changes to a PoS system. In addition, `Berlin` will reduce the mining capabilities
    of the more expensive `ASIC` chips (`ASIC` chips are “application-specific integrated
    circuits” which are computer chips specially designed for, and therefore thousands
    of times more efficient at, mining) and increase the capabilities of non-`ASIC`
    chips used in most personal computers, like `CPUs` and `GPUs` (`GPUs` are “graphics
    processing units” which are found in many standard computers and allow images
    to be displayed). One reason for the move away from `ASIC` chips is the belief
    that as more mining is done by `ASIC` chips, fewer miners will be able to compete
    for block rewards, and the mining pool will become more centralized.

    - **Casper**: Ethereum’s most profound change will be `Casper`, which will transition
    Ethereum to a PoS chain. Doing so would eliminate Ethereum mining and, by moving
    to PoS, allow much faster transactional throughput.


    ### Serenity—Ethereum 2.0


    `Serenity` is the final step in Ethereum 2.0 and a combination of `Casper` and
    `Sharding` that cannot be implemented until both are operational. `Serenity` is
    not expected to be implemented until late 2020 at the earliest. According to the
    Ethereum core developers, `Serenity` will complete the switch to a PoS consensus
    mechanism and usher in a thousand-fold increase in scalability, while also making
    the chain more secure and energy efficient.


    ### Forks and Chain Splits


    Not everything that is faced can be changed, but nothing can be changed until
    it is faced.

    —James Baldwin


    There often comes a time when, for one reason or another, things change. On the
    blockchain, those changes are represented by forks. A blockchain fork is a modification
    of the blockchain’s software, and a forked blockchain refers to a blockchain after
    the modification has been implemented.


    Much has been written about some of the more contentious forks in Bitcoin and
    Ethereum, but forks are sometimes benign. In some cases, a fork occurs when two
    or more nodes discover blocks at the same time. These forks are temporary and
    resolved on the blockchain. In other cases, forks are used to implement upgrades
    or to test features and processes on a blockchain before introducing them to the
    public.


    There are two types of forks: `hard forks` and `soft forks`. The primary difference
    between the two deals with backwards compatibility, which is the ability of new
    versions of the blockchain to understand and function on data created by older
    versions of the blockchain. Each is discussed below.


    #### Soft fork


    A `soft fork` is a software upgrade that tightens or restricts the rules of the
    protocol. `soft forks` are backwards compatible, meaning older pre-fork blocks
    can accept and work with newer post-fork blocks. However, the newer post-fork
    blocks would reject the older pre-fork blocks if those older pre-fork blocks violate
    the rules instituted by the `soft fork`.


    An example of a `soft fork` was Bitcoin’s introduction of a block size limit.
    Initially, Bitcoin did not have a limit on the size of a block, but a `soft fork`
    was executed in 2010 that set a `1 MB` block size limit for all new blocks. The
    new limit meant that new post-fork blocks of `1 MB` would not be rejected by pre-fork
    blocks which had no limit, but if miners attempted to add a `2 MB` block (which
    would have been accepted pre-fork), that block would be rejected after the 2010
    `soft fork` because it violated the `1 MB` limit set by the `soft fork`.

