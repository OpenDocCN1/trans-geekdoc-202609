    一种流行的衍生品合约是期货合约，它是一种关于在未来某个时刻以预先价格买卖某种特定资产的法律协议。期货合约的买方承担了在合约结束（到期）时以指定价格购买标的资产的义务，而合约卖方则承担了在到期时按该价格将基础资产卖给买方的义务。与看涨期权不同，期货合约并没有赋予买方在未来购买基础资产的权利：期货买方必须获得该资产，无论到期时的实际价格如何。


    在美国，`CFTC` 监督期货合约的监管，确保它们在质量和数量上实现标准化。由埃迪·墨菲、丹·阿克罗德和杰米·李·库蒂斯主演的 1983 年电影《交易场所》（*Trading
    Places*）在笑料之余相当不错地展示了期货市场的运作方式，使用了冷冻浓缩橙汁期货合约。50 电影还展示了期货市场存在操纵和获利的可能，并解释了为什么对这类市场进行监管如此重要。


    与世界上大多数监管机构不同，`CFTC` 并不批准新的金融产品。相反，它允许获得许可的交易所对新产品进行自认证，只要交易所确保这些产品符合 `CFTC` 的核心指南和原则。作为自认证流程的一部分，`CFTC`
    员工与交易所协调，确保新产品符合 `CEA` 和 `CFTC` 的规定。从 2000 年至 2019 年，交易所和其他市场参与者通过 `CFTC` 自认证了超过
    12,000 种产品。


    从 2000 年至 2019 年，交易所和其他市场参与者通过 `CFTC` 自认证了超过 12,000 种产品。


    在 2015 年之前，尚不 `CFTC` 是否具有管辖权。2015 年 9 月，`CFTC` 声称对比特币期货拥有管辖权，称其为大商品。`CFTC` 还对基于比特币的衍生品（如期货互换和期权）行使管辖权。2016
    年，`CFTC` 声称对基于比特币的合约拥有管辖权。2017 年，`CFTC` 声称对基于比特币的合约拥有管辖权。2018 年，`CFTC` 声称对基于比特币的合约拥有管辖权。2019
    年，`CFTC` 声称对基于比特币的合约拥有管辖权。2020 年，`CFTC` 声称对基于比特币的合约拥有管辖权。2021 年，`CFTC` 声称对基于比特币的合约拥有管辖权。2022
    年，`CFTC` 声称对基于比特币的合约拥有管辖权。2023 年，`CFTC` 声称对基于比特币的合约拥有管辖权。


    `CFTC` 还致力于保护消费者免受加密市场中的欺诈影响。`CFTC` 发布了关于投资加密货币风险的警告。`CFTC` 还对在加密领域进行欺诈的个人和组织发起了起讼。


    `CFTC` 继续与其他监管机构合作，确保加密市场得到有效监管。`CFTC` 与 `SEC`、`DOJ`、`FBI` 以及其他国际机构合作，以确保加密市场的公平和有序。

