    \ through the use of the language, “the fortunes of digital asset 176purchasers\
    \ have been ‘linked to’ . . . the success of the promoter’s efforts,” which would\
    \ satisfy the more difficult narrow vertical test as well as the less stringent\
    \ broad vertical test.\n\nThe SEC’s commonality position has been criticized by\
    \ many in the crypto industry, because what the SEC appears to be saying is:\n\
    \nWe will generally treat a token as satisfying our common enterprise test so\
