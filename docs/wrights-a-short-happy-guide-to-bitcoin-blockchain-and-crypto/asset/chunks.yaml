    of Facebook. The book also describes the falling out between Zuckerburg and the
    Winklevosses, citing the Winklevosses’ allegation that Zuckerburg stole many of
    the ideas behind Facebook from them. Interestingly, those same Winklevoss twins
    created Gemini, one of the first fiat-backed stablecoins. Then, a few years after
    the Winklevosses created Gemini, Zuckerburg’s Facebook created its own stablecoin
    and named it after another zodiac sign. Whether the name Libra was chosen to troll
    the Winklevosses is anyone’s guess.


