    \ people’s property). In general, the `XBTUSD` contract would work as follows:\n\
    \n*   If the `BTC` price appreciates, the payoff is 100-to-1.\n\n216 \n\n*   However,\
    \ if the price of `BTC` depreciates by 1 percent, because of the 100-to-1 leverage,\
    \ the investor would lose their entire 1 `BTC` investment.\n\nIf the CFTC were\
    \ able to sustain an enforcement action against `BitMEX` despite `BitMEX`’s efforts\
    \ to block US users, any platform that has US users (regardless of the platform’s\
    \ efforts to prohibit US users) could likely also be subject to US enforcement\
    \ actions. Moreover, simply being investigated by the CFTC has repercussions.\
    \ For example, soon after it was reported that the CFTC was investigating, `BitMEX`\
    \ saw a record outflow of about $530 million of funds, more than five times the\
    \ amount it had experienced in any previous months. Nevertheless, at the end of\
    \ 2019, `BitMEX` remained one of the top three crypto derivates exchanges, behind\
    \ Korea’s `OKEx` and Singapore-based `Huobi`.\n\n## Secured Lending\n\nThe other\
    \ non-fraudulent crypto-related activity regulated by the CFTC is secured lending.\
    \ Secured lending is the process of a borrower pledging some assets (for example,\
    \ `bitcoin`) as collateral for a loan. Once the assets are pledged, they act as\
    \ protection against financial loss for the lender. An example would be a secured\
    \ loan for `bitcoin` in which a borrower posts $100, and a lender lends the borrower\
    \ $900 so the borrower can purchase $1000 of `bitcoin`. To hold the bitcoin collateral,\
    \ the lender will generally hold the private keys to the `bitcoin`.\n\nThe issues\
    \ surrounding secured lending of crypto first arose in 2016 in a proceeding against\
    \ the crypto exchange `BitMEX`. On its platform, `BitMEX` allowed retail users\
    \ to enter into loans secured by `bitcoin`. `BitMEX`’s role was to match lenders,\
    \ who were willing to provide financing secured by `bitcoin`, with borrowers,\
    \ who 217desired to make leveraged purchases of `bitcoin`. In addition, `BitMEX`\
    \ would monitor the lending agreement and hold the collateral. The CFTC determined\
    \ that `BitMEX`’s secured lending services amounted to an offer of “financed retail\
    \ commodity transactions,” a transaction regulated by the CFTC under the CEA.\n\
    \nPrior to 2010, `BitMEX`’s secured lending of `bitcoin` would not have created\
    \ any issues (ignoring for the moment the fact that there was no market for `bitcoin`\
    \ in 2010). However, in 2010, the Dodd-Frank Wall Street Reform and Consumer Protection\
    \ Act (Dodd-Frank) amended the CEA to change the way commodity-backed retail secured\
    \ loans were regulated, bringing the `BitMEX` secured lending service under the\
    \ ambit of the CEA. Without wading into the precise legal details, it would be\
    \ exceedingly difficult for `BitMEX` to comply with the myriad CEA-based legal\
    \ and regulatory requirements that would have allowed it to offer secured lending\
    \ services to retail customers.[52](#section10.xhtml#ftn.87)[53](#section10.xhtml#ftn.88)\n\
    \nWhy is the CFTC involved in this?\n"
  trans: "\n\n2019 年，CFTC 征收了超过 13 亿美元的监管罚款，比 2018 年增长了 40%。CFTC 的执法行动中约有 65%是针对参与商品及其他衍生品欺诈计划的个人和实体的。而且，这些执法行动中越来越多地涉及加密货币。\n\
    \n仅在 2019 年，CFTC 就采取了以下加密货币相关的执法行动：\n\n*   10 月 23 日，在一起由 CFTC 提诉的案件中，一名联邦法官裁定两个人和四家公司实体支付\
    \ 425 万美元损害赔偿，以就一项涉及一种名为`ATM Coin`的无价值加密货币的二元期权诈骗行为进行负责。\n*   9 月 30 日，CFTC 指控内华达州的一个人和一家公司涉及一项涉及\
    \ 1100 万美元二元期权计划的欺诈。根据起诉书，被告 (i) 招募并接受了至少价值 1100 万美元的`bitcoin` 和美元用于交易衍生品，且 (ii)\
    \ 对其交易专业知识做出虚假陈述，并保证了高达 300%的收益。被告并未按照承诺使用资金进行交易，而是通过 (i) 将参与者的资金保留在被告的个人加密钱包中，以及\
    \ (ii) 使用资金支付早期投资者的资金（庞氏骗）来挪用资金。214 随后，被告向参与者撒谎以掩盖其挪用资金的行为。\n*   同样在 9 月 30 日，CFTC\
    \ 指控一名个人 `Jon Barry Thompson` 欺诈，指控他说服客户发送约 700 万美元以资助虚假的`bitcoin`购买。\n*   6 月\
    \ 18 日，CFTC 宣布其已指控位于英国的加密货币公司 `Control-Finance Limited` 及其 CEO 挪用了来自 1000 多名受害者的\
    \ 22,858.822 枚`bitcoins`（当时的价值为 1.47 亿美元）。\n\n虽然普通欺诈占据了 CFTC 执法活动的大部分，但它对虽然不属于欺诈但属于其监管范围的活动行使了管辖权。其中两种活动是非受监管的交易和担保贷款。\n\
    \n## 未受的交易\n\n根据美国法律，如果衍生品交易所或交易平台向美国客户招揽或接受订单，则必须向 CFTC 注册。自 2015 年以来，在确定某些加密货币为商品后，CFTC\
    \ 坚持认为，如果加密衍生品交易所允许美国人进行交易，则必须注册。\n\n2019 年 3 月 11 日，来自马绍绍尔群岛的在线交易平台 `1pool Ltd.`\
    \ 及其 CEO 同意支付近 100 万美元以解决 CFTC 的指控。作为该和解的一部分，`1pool` 承认其 (i) 向美国客户提供了使用`bitcoin`作为抵押的合同，(ii)\
    \ 未向 CFTC 注册，以及 (iii) 未实施适当的 AML/KYC 计划。\n\n2019 年底的报告显示，CFTC 正在调查位于香港的`BitMEX`（全球最大的交易平台之一），原因是其允许美国人在其平台上进行交易。215\
    \  行业内的许多人认为此案很重要，因为它有可能将美国监管的范围延伸到美国境外之外。\n\n`BitMEX` 拥有相关的规则和政策禁止美国人使用其平台，并移除任何其发现的违反这些规则的美国人。事实上，在主网站\
    \ `bitmex.com` 上，用户会看到以下信息：\n\n注意—重要通知\n\n如果您位于、注册或以其他方式建立我们的服务条款（以及该术语的定义）下的任何“受限管辖区”（包括美国），或是其公民或居民，则禁止访问或使用我们的服务（包括`BitMEX`\
    \ 交易平台）。\n\n`BitMEX` 保留立即关闭被认定违反我们服务条款的人员账户并将其未平仓头的权利。\n\n然而，正如`BitMEX` CEO `Arthur\
    \ Hayes` 指出的，“客户可能通过使用虚拟专用网络为他们的计算机分配来自`BitMEX` 许可国家的互联网协议地址，从而掩盖其位置并欺骗 [BitMEX]\
    \ 设置的过滤器。”\n\n尽管有禁止，美国投资者仍试图在 `BitMEX` 上进行交易，其一原因是 `BitMEX` 提供了美国客户通常无法获得的金融产品。其中一种金融产品是\
    \ `XBTUSD BTC/USD` 合同，它提供高达 100 倍的杠杆。使用`XBTUSD` 合同，投资者可以质押 1 个 `BTC` 并允许使用杠杆（他人财产）购买\
    \ 100 个 `BTC`。通常，`XBTUSD` 合同的运作如下：\n\n*   如果 `BTC` 价格上涨，收益率比例为 100:1。\n\n216 \n\
    \n*   然而，如果 `BTC` 价格下跌 1%，由于 100:1 的杠杆，投资者将损失其全部的 1 个 `BTC` 投资。\n\n如果 CFTC 能够在`BitMEX`\
    \ 阻止美国用户的努力的情况下对其维持执法行动，那么任何拥有美国用户的平台（无论该平台为禁止美国用户的努力如何）都可能受到美国执法行动的影响。此外，仅仅被\
    \ CFTC 调查就会产生影响。例如，在报道 CFTC 正在进行调查后不久，`BitMEX` 经历了约 5.3 亿美元的资金创纪录流出，是其之前任何月份金额五倍以上。尽管如此，到\
    \ 2019 年底，`BitMEX` 仍是前三大加密衍生品交易所之一，次于韩国的`OKEx` 和新加坡的`Huobi`。\n\n## 担保贷款\n\nCFTC\
    \ 监管的另一种非欺诈加密货币活动是担保贷款。担保贷款是借款人将某些资产（例如`bitcoin`）作为贷款抵押的过程。一旦资产被抵押，它们就作为贷款人的财务损失的保护。一个例子是`bitcoin`的担保贷款，借款人质押\
    \ 100 美元，贷款人借给借款人 900 美元，以便借款人购买 1000 美元的`bitcoin`。为了持有比特币抵押，贷款人通常持有比特币的私钥。\n\n\
    加密货币担保贷款的问题最早出现在 2016 年针对加密货币交易所`BitMEX`的诉讼。在其平台上，`BitMEX`允许零售用户进行以`bitcoin`为担保的贷款。`BitMEX`的作用是匹配提供`bitcoin`融资的贷款人和希望杠杆购买`bitcoin`的借款人。此外，`BitMEX`监控贷款协议并持有抵押品。CFTC\
    \ 认定`BitMEX`的担保贷款服务等于“融资零售商品交易”，这是根据 CEA 监管的交易。\n\n在 2010 年之前，`BitMEX`的`bitcoin`担保贷款不会产生任何问题（暂不考虑\
    \ 2010 年还没有`bitcoin`市场的事实）。然而，2010 年，《多德-弗兰克金融改革与消费者保护法》（Dodd-Frank）修订了 CEA，改变了商品支持的零售担保贷款的监管方式，将`BitMEX`的担保贷款服务纳入了\
    \ CEA 的范围。在不涉及具体的法律细节的情况下，`BitMEX`极难满足各种基于 CEA 的法律和监管要求，使其能够向零售客户提供担保贷款服务。5253\n\
    \n为什么 CFTC 参与其中？\n\n"
