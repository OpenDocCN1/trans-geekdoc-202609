    在软叉之后，矿工必须升级到新的分叉软件。否则，旧软件可能会创建违反软叉规则的区块，并被分叉软件拒绝，导致对算力的昂贵浪费且无法获得区块奖励。


    ## 硬叉


    硬叉不是向后兼容的，这意味着在旧链上发生的操作无法在旧链上发生。例如，假设一个链的最大区块为 `1 MB`，该链执行了硬叉将区块大小增加到 `4 MB`。分叉后，`2
    MB` 的区块会被新的分叉链接受，但 `2 MB` 的区块会被旧链拒绝，因为超过了 `1 MB` 的区块大小。


    ## 分叉


    对于人们来说，什么是好的分叉？——钦努瓦·阿切贝，《分崩》


    当出现两个或多个竞争版本的区块链时，就会发生分叉。分叉可以由硬叉或软叉引起。下图描述了分叉。


    ![](img/Image_28.jpg)


    如所示，两个链将拥有分叉前的历史，但会有新的分叉链。要导致分叉，双方必须拥有足够的经济实力和算力来运行其首选的区块链版本。通常，分叉围绕着有争议的技术提案展开，双方都相信随着时间的推移，“正确”一方将获胜，而“错误”一方将失败。


    已经有很多与比特币相关的硬叉，但最重要的两个是 2017 年 8 月创建 ABC 的硬叉，以及 2018 年 11 月创建 ABC 和 SV 的分叉，如下：


    ![自动生成的手机截图](img/Image_29.jpg)


    ### 比特币叉


    2018 年 11 月，在经过激烈的公开辩论后，执行硬叉导致了两个新币的产生：ABC 和 SV。在决定哪种币将成为“真实”比特币的战斗中，双方(i) 都声称是合法的比特币，(ii)
    都寻求符号，这指示了分叉的“胜利者”。


    这场战斗演变成了公开，当时有许多关于媒体威胁、跨链破坏和报复的报道。为了参与战斗，矿工池将大量的算力转向了各自一方。估计，ABC 和 SV 双方为了争夺统治花费了超过
    700,000 美元。


    导致分裂的一个原因是区块大小：ABC（为了“可调整区块大小”）想要维持 `32 MB` 的区块大小，而 SV（为了萨石的愿景）想要将区块大小增加到 `128
    MB`。由于双方无法达成共识，双方都使用了硬叉来实现所需的区块大小。


    在硬叉之前，许多加密交易所停止了交易，不仅是因为分叉的不确定性，还因为不清楚哪一个分叉链将被允许继续。随着时间的推移，ABC 似乎胜出了。许多交易所现在将
    ABC 称为比特币 (BCH)，但 SV 仍然是一个选择。根据 `coinmarketcap.com`，截至 2019 年底按市值，ABC (BCH) 的市值约为
    49 亿美元，而 SV 的市值约为 29 亿美元。


    ## 区块链上的身份


    拥有并证明身份在现代社会中至关重要。根据《联合国儿童权利公约》第 8 条，每个人都有身份权。然而，全球范围内有 11 亿人无法声称自己的身份，因为他们没有证明身份的必要文件。缺乏这种证明，他们参与社会、拥有财产、投票、获得政府服务、开设银行账户或寻找全职工作的能力将受到限制或不存在。


    个人的身份证明通常由国家提供的身份手段组成。在美国，这些包括出生证、社会安全号码、驾照和护照。所有这些都要求持有和保留包含各种形式身份数据的物理文件。在许多情况下，当人们需要证明身份时，提交这些文件之一意味着提供了比对方所需的更多的信息，这有危及个人隐私和安全的风险。一个安全地维护在公共区块链上的数字
    ID 可以帮助消除这种风险。然而，仍有大量工作要做。


    例如，想象 Bibi 刚满 21 岁，想在当地的小酒吧买一瓶冰的“老普林尼”（这是一种非常出色的啤酒，遗憾的是在美国西部以外地区买不到）。当她走进去时，酒保要求查看她的身份证以确保她达到了饮酒年龄。酒保只需要一个信息，她的出生日期。但实际上，他甚至不需要；他只需要一个关于她是否超过
    21 岁的二元答案。


    然而，当她递交身份证时，她不仅证明了自己超过了 21 岁，还给了酒保一大堆其他个人信息，包括她的全名、地址、生日和驾照号码。一个受信任的区块链身份（`blockchain
    ID`）可以让 Bibi 让酒保她已满 21 岁，并保持其他信息的私密，从而保护她的个人数据和安全。


    `blockchain ID` 还将提供额外收益，包括：


    *   赋予个人对其隐私数据的控制权，从而消除包括信用卡公司、社交媒体公司和大型搜索引擎公司在他人从个人隐私数据中获利的能力；

    *   使大规模数据窃取变得困难，因为大公司不再持有用户数据，使它们对黑客来说不再是具有吸引力的“蜜罐”。

    '
