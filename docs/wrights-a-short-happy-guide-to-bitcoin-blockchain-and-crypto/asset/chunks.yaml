    \nA Short & Happy Guide\n\nto\n\nBitcoin, Blockchain, and Crypto\n\n1 \n\n![clocky\\\
    _bw\\_CHAP.tif](Image_3.jpg)\n\nPart I\n\nBlockchain Technology\n\nBlockchain\
    \ Innovation\n\nThe innovation of blockchain technologies is that they reduce\
    \ or eliminate the need for trust and trusted intermediaries in economic relationships.\
    \ Blockchains are, at their core, trust machines. In a world increasingly both\
    \ more and less connected, that innovation is valuable, as evidenced by the media\
    \ attention and investments in blockchain technologies. This book digs deeper\
    \ into how blockchains serve as trust machines, exploring how blockchain technologies\
    \ increase the efficiency of trust, explaining some use cases for blockchains,\
    \ and describing the state of the law for blockchain applications.\n\nFrom a technical\
    \ perspective, blockchains are digital ledgers, maintained on a network of computers\
    \ that keeps an honest, permanent record of unique information (“digital information”)\
    \ owned by one party, and prevent that digital information from being copied or\
    \ used by anyone other than the owner. When transactions occur over a certain\
    \ limited period, those transactions are grouped together and recorded into blocks.\
    \ Those blocks are then added to the ledger of all earlier blocks, forming a blockchain.\n\
    \n2 \n\nOne important feature of many blockchains is they are, for the most part,\
    \ immutable. Once data has been entered into a block and recorded on the blockchain,\
    \ no one can alter that data. And when a new block is added to a blockchain, it\
    \ must be consistent with all previous blocks. In simple terms, that means that\
    \ if a user has 10 bitcoins (in general, Bitcoin relates to the network, and bitcoin\
    \ or “BTC” relates to the crypto) recorded on the blockchain:\n\n1)no one can\
    \ manipulate the number of bitcoins the user has, and\n\n2)the system would prevent\
    \ the user from spending more than 10 bitcoins because such a transaction would\
    \ be inconsistent with all the previous blocks.\n\nIn addition, by tracing back\
    \ the user’s transactions it would be possible to see each and every transaction\
    \ to determine exactly how the user amassed the 10 bitcoins. Immutability allows\
    \ users to enter into transactions and be assured that counterparties can perform\
    \ their transactional obligations."
  fmt: "\nThose realities piqued my interest in bitcoin and blockchain technologies,\
    \ as did my educational and professional experiences. I earned a master’s degree\
    \ in public policy from Harvard’s Kennedy School, with a focus on financial policy,\
    \ and a law degree from the University of Chicago. The path I took to get those\
    \ degrees, however, was anything but traditional.\n\nI left law school after my\
    \ first year because I realized something was missing in my education. During\
    \ that first year, we often had to tackle legal issues that were, at their core,\
    \ financial and economic policy issues, areas I ignored as an undergraduate.\n\
    \nFortunately, one of my law school professors advised and encouraged me to take\
    \ the risk of leaving law school to fill the gaps (thanks `Prof. Boldt`). His\
    \ advice was spot on: the finance policy program at the Kennedy School was exactly\
    \ what I needed (fortunately, math was not one of the undergrad areas I ignored).\
    \ I finished law school at the University of Chicago because it focused on the\
    \ economic analysis of the law, and embarked on a career that involved finance,\
    \ law, public policy, and the intersection of all three: tax.\n\nDuring that career,\
    \ I structured derivatives (before they exacerbated the financial crisis), advised\
    \ clients as a business, tax and banking lawyer, represented my country at the\
    \ US Department of Justice as white-collar prosecutor (pursuing rich people who\
    \ stole from poor people), and over the last decade, served as a law professor.\
