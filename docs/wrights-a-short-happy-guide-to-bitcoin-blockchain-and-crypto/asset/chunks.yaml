    Peirce 提出的避风港原则受到了加密社区的广泛认可。


    # 证券法与代币发行


    从历史上，大多数加密货币是通过首次代币发行（`ICOs`）向投资者提供的。`ICO` 是执行加密代币公售的智能合约。在大多数方面，`ICOs` 与 `IPOs`
    相似，区别在于：


    * 1) `ICOs` 在区块链上发行；

    * 2) `ICOs` 通过智能合约发行；

    * 3) `ICOs` 通常用于资金不足、需要资金推进至完成的开发项目；以及

    * 4) `ICO` 发行的加密代币直接分发到投资者的账户（加密钱包），但通常无法立即在交易所进行交易。


    `ICO` 市场在 2017 年和 2018 年非常庞大，每年有超过 3,000 个 `ICOs`，分别筹集了 62 亿美元和 78 亿美元。该市场在 2019
    年开始降温，年底总额仅为 3.7 亿左右。


    由于 `ICO` 代币存储在个人加密钱包中，`ICO` 之后通常没有易于访问的市场交易这些代币，导致许多投资者没有出售手段。为了给代币提供市场，许多 `ICO`
    项目寻求让其代币在交易所上市。尽管付出了努力，仍有 182 个（约占 90%）`ICO` 项目从未在交易所上市。


    针对 `ICO` 代币上市问题的一种市场反应是推出了首次交易所发行（`IEOs`），它们在除一点外均与 `ICOs` 相似：`IEO` 代币不是发行给个人加密钱包，而是在交易所上市并可立即交易。这使得投资者能够通过其现有的交易所账户购买
    `IEO` 代币，并简化了发行人的融资细节。`IEO` 支持者宣扬的其他益处还包括：


    ## 投资者保护


    由于交易所在上市 `IEO` 代币时押注了自身的声誉，因此交易所有动力确保只有良好的项目才能上市。因此，交易所可能被认为对其利益相关者有义务进行足够的尽职调查，以确保其上市的每个项目都是合法的。


    ## 可交易性与效率


    由于投资者可以直接在交易所购买代币，投资者可以确保代币是可交易的。因此，开发者和应用平台可以更多地关注项目本身，而较少关注融资和上市细节。


    ## 价格透明度


    许多 `IEOs` 的结构使得 `IEO` 代币的价格在代币上市之前公开公布，且该价格在 `IEO` 期间保持固定。这种透明度消除了经常伴 `ICOs` 的疯狂价格投机。


    尽管 `IEOs` 为投资者提供了优于 `ICOs` 的优势，但根据 SEC 的规定，促进 `IEOs` 的交易所可能违反了美国证券法。在 2019 年 5
    月于纽约行的共会议上，SEC 数字资产与创新高级顾问 Valerie Szczepanik 表示，向美国客户提供代币销售服务的加密交易所可能符合证券交易商的法律定义，这意味着它们必须遵守
    SEC 的注册和许可要求。Szczepanik 补充道：


    > “如果他们没有注册，一旦有美国发行人或美国买家，或者如果他们在美国市场运营，将在美国遇到麻烦。”


    ## SEC 执法


    在《DAO 报告》发布后，SEC 开始对那些提供其认为的未注册证券的实体采取更激进的执法立场。自 2017 年以来，SEC 已针对提供未注册证券的 `ICO`
    发行人发出了多次停止指令，许多加密项目已放弃了其在美国的发行，或对美国用户设置限制以规避 SEC 的审查。例如：


    ### Basis 稳定币


    ![Uncollateralized Stablecoins —Basis - Izak Fritz - Medium](img/Image_59.jpg)2018
    年 12 月，Basis 稳定币项目的组织者放弃了该项目，并向包括 Google Ventures、Bain Capital Ventures 和 Andreessen
    Horowitz 在内的投资者退还了筹集的 1.33 亿美元。在与 SEC 进行长时间会谈后，组织者得出结论，在不违反证券法的情况下没有办法启动他们的 `ICO`。在他们的网站（`ww.basis.io`）上，组织者表示：


    > 随着监管指导随着时间的推移开始流出，我们的律师达成共识，无法避免债券和股份代币的证券地位，并且必须将美国证券监管适用于该系统，这对我们的启动能力产生了严重的负面影响。


    ### Poloniex 交易所


    ![Poloniex Exchange (@Poloniex) | Twitter](img/Image_60.jpg)2019 年 5 月，加密交易所 Poloniex
    宣布将实施“地理围栏”（禁止特定管辖区客户的行为），由于对 SEC 是否会将这些代币视为证券存在监管不确定性。


    ### Kik 诉讼


    有关 SEC 和加密货币行业各自立场的最全面探索，可以通过查看 SEC 对 Kik Interactive, Inc. 的诉讼——`SEC v. Kik Interactive`
    来。Kin 是一家社交媒体消息公司，它与 Kin Ecosystem Foundation (Kin) 一起基于 Kik 的 App 发布了一种代币（Kin
    代币）。2019 年 6 月，SEC 提起了诉讼，指控 Kik 进行了价值值 1 亿美元的非法代币发行。


    关于加密货币的立场，基于两个原因：


    1) Kik 通过公开回复 SEC 的查询（称为 `Wells Response`）有效地邀请了 SEC 起诉；39 并且


    2) Kik 发起了一项旨在为加密货币创建新的 `Howey test` 的活动，并组织了一个网站（`www.defendcrypto.org.defendcrypto.org`），不仅为其针对
    SEC 的诉讼进行众筹，还协助其他与 SEC 相抗衡的加密公司。


    根据他们其中一名律师的说法，Kik 选择成为测试对象的原因之一是：


    > 在 SEC 本身没有提供适当且清晰指导的情况下，这确实是唯一的选择……我们当然希望 SEC 能制定出清晰的指南，以及与其法定授权权限界限一致的指南。他们没有这样做，所以这确实是我们能看到的获得这种清晰度并获得正确结果的唯一途径，但这需要一些时间。


    —Patrick Gibbs，Kik 律师，Unchained Podcast（2019 年 5 月 28 日）


    以下是 Kik 案中重大事实和事件的概述：


    * 2017 年 8 月，Kik 在一次 `ICO` 中筹集了超过 1 亿美元，在此之前的几周，SEC 发布了一份声明，警告“虚拟货币或代币可能是证券”，但未对如何做出此类判断提供实际指导。

    * 2017 年 11 月，SEC 通知 Kik，正考虑就其在 `ICO` 中违反美国证券法对其起诉。

    * 2018 年 12 月，Kik & Kin 公开了他们对 SEC 的 `Wells Response`，指称执法行动是不合理的。该提交除其他外还论证了：


    (1)Kin 是一种货币，因此不应被视为证券；以及


    (2)Kin 代币不是投资合同，因为：


    * i) Kik 与 Kin 购买者之间不存在“共同企业”；

    * ii) Kin 代币是基于其效用销售，因此没有利润预期；和/或


