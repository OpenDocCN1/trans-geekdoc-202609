  trans: '


    该裁定将空投（airdrop）定义为“一种将[加密货币]单位分配给多个纳税人[区块链]地址的手段”。裁定随后补充道，空投的[加密货币]“通常是在其记录在[区块链]上的日期和时间收到的”。正如硬分叉的情况一样，美国国税务局（IRS）指出，“如果纳税人无法对[加密货币]行使支配和控制，那么当空投记录在[区块链]上时，纳税人并未收到[加密货币]”。


    裁定指出，“纳税人可能在空投记录在[区块链]上之前就推定性地收了[加密货币]”。然而，IRS 并未提供任何解释或示例来描述纳税人如何在加密货币记录到区块链之前对其进行推定性接收。即使空投的加密货币在记录到区块链之前以某种方式被推定性地接收，该裁定也未解释纳税人如何对此类加密货币行使“支配和控制”。


    # 224 - 加密货币的基基


    随随裁定的常见问题解答（FAQs）涉及了加密货币的税收基基。美国律师协会（ABA）和美国会计师协会（AICPA）都提出了这一问题，指出在缺乏特定 IRS 指南的情况下，纳税人必须根据经验推测如何计算和追踪其加密货币的基基。在其他税收背景下，确定财产基基的许可方法包括先进先出（FIFO）、后进先出（LIFO）、对交易中使用的财产进行特定识别，以及平均成本法。


    AICPA 建议 IRS 允许先进先出法，除非纳税人能够识别出交易中使用的特定加密货币单位。IRS 似乎采取了 AICPA 的建议。在`FAQ 40`中，IRS
    宣布，除非纳税人识别出交易中使用的特定加密货币单位，否则这些单位被认为是按时间顺序出售、交换或其他方式处置的，从从购买或获得的最早加密货币单位开始（即`FIFO`）。


    # 2019 年指南的分析


    尽管 2019 年指南对许多悬而未的问题解答，但它引发了许多其他问题，包括：


    1) 它未能解决小额交易的微量豁免（de minimis exception）；

    2) 它含义不明、不精确，且在某些地方不公平；

    3) 作为指南，它缺乏法律或法规的效力，容易受到质疑。


    ## 微量豁免


    尽管包括 225AICPA 和 ABA 在内的许多组织建议设立此类条款，但 2019 年指南未能解决小额加密货币交易的豁免问题。IRS 在 2018 年的演示中承认了这一问题，提了
    AICPA 提出的对 200 美元以下交易建立豁免的建议，类似于个人外外币交易的微量豁免。没有这种豁免，纳税人需要向 IRS 报告每一笔使用加密货币的交易，从使用比特币在星巴克购买咖啡，到用
    1 美元的`BTC`兑换 1 美元的`ETH`。在 2020 年 2 月的 AICPA 信书中，AICPA 要求 IRS“行使其行政裁量权来执行税法，建立一个微量安全港”，以免除纳税人处理“行政成本超过非微小交易之任何可能税款的交易”的麻烦。


    IRS 未对未包含微量豁免提供任何解释，但有两个可能的理由：


    *   1. IRS 人员认为此类规则将阻碍 IRS 让纳税人报告其加密货币交易的努力。许多人推测，微量规则可能导致先进的避税技术，例如将交易拆分为许多笔低于阈值的交易（这并不是什么先进技术，但却是创建此类技术的良好起点）。此外，监控微量规则对
    IRS 来说可能需要更多时间，因为这不仅需要 IRS 检查所有交易，而且还需要(i) 首先过滤掉低于 200 美元阈值的交易，然后 (ii) 确定系列经过过滤的交易是否为了规避报告而进行了结构化处理。

    *   2. IRS 无法创建新法律。是国会而非 IRS 创建了个人外币交易的微量豁免。因此，在没有国会关于豁免加密货币的指令的情况下，IRS 不能仅仅因为这对纳税人方便就创建一个新法律。


    2020 年 1 月，国会引入了一项法案以解决微量豁免问题。该法案名为《2020 年虚拟货币税收公平法案》，在美国众议院获得了两党支持并被引入。该法案将个人交易中处置虚拟货币所获得的最高
    200 美元的收益从总收入中扣除。2017 年引入的法案之前的版本试图免除金额低于 600 美元的交易。此外，2018 和 2019 年的《代币分类法案》（均未通过）都包含了
    600 美元的微量豁免。


    ## 拙劣的指南


    2019 年 12 月的国会信函指出：


    “这份最新的指南就其试图解决的主题（即分叉和空投）产生了许多许多新问题。此外，[它]看起来并不公平。”


    这些问题使得很难确定某些交易应如何被处理。在 2019 年指南中，IRS 使用以下语言定义硬分叉：


    “硬分叉发生于当[加密货币] . . . 经历协议更改，导致对旧有[区块链]的永久性偏离，从而导致在新的[区块链]上创建了新的[加密货币]。”


    随后，IRS 使用以下语言定义空投：


    “空投是一种将[加密货币]单位分配给多个纳税人[区块链]地址的手段。硬分叉随后的空投会导致新[加密货币]单位分配到旧的[加密货币]中。”


    这两个定义都不精确。与比特币现金（BCH）和以太坊经典（ETC）相关的硬分叉证明了下文所述的不精确性。


    ### 比特币现金硬分叉


    2017 年 8 月 1 日，比特币现金（BCH）从比特币（BTC）区块链分叉出来（`BTC/BCH fork`），这种分叉可以说符合指南的定义，其中`BCH`是“新的”加密货币。然而，与
    IRS 的定义相反，`BCH`并没有“空投”给现有的`BTC`持有者。空投通常是新启动的加密货币自动分配给代币或币持有者。相比之下，在硬分叉之后（特别是有争议的分叉），分叉前币（`BTC`）的所有者根据权利同时拥有新币（`BCH`）和旧币（`BTC`）。


    在 2017 年`BTC/BCH fork`之后，`BCH`本身在次年分裂为两种币：比特币现金可区块区块（`ABC`）和比特币萨希视觉（`SV`）（`ABC/SV
    fork`）。2019 年指南对于`ABC/SV fork`在税收收目的上如何被处理产生了困惑，因为在分叉之后，两种币都合法地声称自己是“旧的”货币，而且都声称另一种币是“新的”货币。


    # 228


    在`ABC/SV fork`发生后，尚不清楚哪个区块链是主导性的，哪一个能够自称为“真正的”比特币现金（`BCH`）。某些交易所甚至停止了`ABC`和`SV`几天交易，直到明确谁是“获胜者”。最终，大多数交易所承认`ABC`为获胜者，并允许`ABC`使用比特币现金名称和代码`BCH`。


    尽管对于哪个是“新”货币、哪个是“旧”货币存在不确定性，2019 年指南要求纳税人报告“新”货币的市场价值作为收益。目前尚清楚纳税人在这种情况下如何确定哪一个是新货币。


    ## 以太坊硬分叉


    '
