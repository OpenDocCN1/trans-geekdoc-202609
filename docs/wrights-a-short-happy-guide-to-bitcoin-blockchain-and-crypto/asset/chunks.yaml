- raw: "Throughout this book, examples will be used to explain and simplify the mechanics\
    \ of blockchain transactions. In many of those examples, “Bibi” will serve as\
    \ one party, often a buyer, and “Chaun” (pronounced like Shawn) will serve as\
    \ a counterparty, often a seller. This first example will show how trust is an\
    \ important, but often overlooked, part of most everyday transactions.\n\nBuying\
    \ a pound of Organic Kenyan Dark Roast coffee\n\nSuppose Bibi wants to buy a pound\
    \ of Organic Kenyan Dark Roast. She heads down to the local Starbucks to get the\
    \ coffee, but before she gets there, she runs into Chaun, a stranger who, it just\
    \ so happens, has a roadside stand that sells one-pound bags labeled “Organic\
    \ Kenyan Dark Roast Coffee” at half the Starbucks price.\n\n3 \n\nWhat will Bibi\
    \ do?\n\nIt depends on whether Bibi trusts that Chaun is actually selling authentic\
    \ Organic Kenyan Dark Roast. For all Bibi knows, Chaun could be selling an inferior\
    \ grade of coffee, or worse, decaf. Absent trust that the coffee is authentic\
    \ (organic, Kenyan origin, dark roast), Bibi will likely bypass Chaun’s stand\
    \ and buy the coffee from Starbucks.\n\nHow can Bibi know that the coffee Chaun\
    \ has labeled as “Organic Kenyan Dark Roast” is what it purports to be?\n\nAbsent\
    \ the blockchain trust machine, she can’t. What this means for Chaun is that if\
    \ she wants to sell her coffee, she must give potential customers reasons to trust\
    \ her product, such as by giving out free samples and showing up week after week\
    \ to earn customers’ confidence. In other words, Chaun must build trust in her\
    \ product the same way that Starbucks has built trust in its products. That trust,\
    \ akin to business goodwill, explains the value of brand names, and allows businesses\
    \ to charge higher prices for their products.\n\nWhat if Chaun had a way of proving\
    \ to Bibi the coffee was Organic Kenyan Dark Roast?\n\nIf Bibi was confident that\
    \ the coffee was authentic, she would buy the coffee from Chaun at the lower price.\
    \ Let’s assume Chaun can prove the coffee’s provenance, including the source of\
    \ the beans, which Kenyan farm grew the beans, the “organic” certification of\
    \ the farm, how long, and at what temperature, the beans were roasted (determinants\
    \ of “dark” roast), and every transaction and movement from the time the farmer\
    \ purchased, planted, and harvested the beans until Chaun acquired them.\n\nIf\
    \ that information could be quickly and easily verified, Bibi would buy the coffee\
    \ from Chaun. That highlights the potential of blockchains: if Bibi could scan\
    \ a QR code on the bag to review the 4coffee’s provenance on a blockchain, so\
    \ long as Bibi trusted the information, Bibi would not need to trust Chaun. At\
    \ that point, Bibi would buy Chaun’s coffee because it is cheaper than the coffee\
    \ from Starbucks.\n\nBibi might still go to Starbucks, but not to buy bags of\
    \ Organic Kenyan Dark Roast coffee. If Chaun were successful enough, Starbucks\
    \ might stop selling that coffee because, with all the overhead of a brick-and-mortar\
    \ store, Starbucks may not be able to compete with Chaun on the price of Organic\
    \ Kenyan Dark Roast coffee beans. While Starbucks offers plenty of other desirable\
    \ things (free Wi-Fi, generally public bathrooms, ready-made drinks, and the ability\
    \ to create a new name for yourself while waiting for your drink, etc.), it would\
    \ likely scale down its Organic Kenyan Dark Roast coffee bean business in the\
    \ locations Chaun has opened stands.\n\nChaun’s side of the transaction involves\
    \ trust as well. If Bibi pays cash, Chaun must trust that the cash is not counterfeit,\
    \ albeit a small risk. However, if Bibi pays with a card, multiple forms of trust\
    \ come into play. The simplest example is if Bibi uses her Visa bank card. When\
    \ she swipes that card, it is the beginning of the multi-step process described\
    \ below:\n\n1.The swipe is a request to make a payment from Bibi to Chaun.\n\n\
    2.Chaun submits the request to Visa.\n\n3.Visa sends the request to the financial\
    \ institution who issued the card to authorize the transaction.\n\n4.If Bibi has\
    \ enough money in her account (or the financial institution has extended her credit\
    \ and this payment will not exceed that credit), the financial institution validates\
    \ the payment and sends an authorization code to Chaun, allowing the transaction\
    \ to go through.\n\n5 \n\n5.Chaun accepts the authorization and proceeds with\
    \ the purchase.\n\n6.Chaun gives Bibi the coffee.\n\nWith Visa (and other credit\
    \ cards), those processes all happen in a few seconds. But there is a lot more\
    \ trust involved. First, how does the seller know the person swiping the card\
    \ is the cardholder? Sellers often don’t ask for identification, and for smaller\
    \ transactions, generally trust the cardholder is authorized to use the card.\
    \ If the transaction were fraudulent, in general, most US credit card companies\
    \ would absorb the cost of the fraud and pass it on indirectly through fees to\
    \ either the customer or the merchant.\n\nHow does Chaun know that actual payment\
    \ is going to be made?\n\nAt the time of sale, all Chaun has is an authorization\
    \ code and a relationship with Visa. Chaun has no relationship with Bibi’s financial\
    \ institution. That means Chaun must trust that (i) the authorization, (ii) her\
    \ relationship with Visa, and (iii) Visa’s relationship with Bibi’s financial\
    \ institution, will ultimately result in Chaun getting paid.\n\nAll that trust\
    \ has a cost. For most credit card transactions, the costs range from 1.5–2.9\
    \ percent but can be as high as 3.5 percent. Those fees are generally split between\
    \ the card issuer (a financial institution) and the card network (Visa). While\
    \ those percentages seem low, they add up. In the fourth quarter of 2019, Visa\
    \ processed roughly $2.2 trillion in combined credit and debit card volume, generating\
    \ revenues of $6.1 billion for the quarter. Those revenues represent the costs\
    \ of financial intermediation. Blockchain-based payment systems that eliminate\
    \ legacy financial intermediaries have the potential to reduce or eliminate those\
    \ costs, returning those revenues to consumers and merchants.\n\nFor Visa, its\
    \ largest expenses are personnel, branding, and fraud detection, which represent\
    \ over 50 percent of its operating 6expenses.[1](#section8.xhtml#ftn.1) Bitcoin,\
    \ the world’s most popular blockchain money, has none of those expenses: its personnel\
    \ work for free, branding is user adoption, and its fraud protection is built\
    \ in. In fact, while there have been numerous Bitcoin scams, there has never been\
    \ a fake bitcoin created.\n\nThe Bitcoin scams that have been reported are generally\
    \ not threats to the network itself, but instead are (i) schemes to steal a user’s\
    \ bitcoin, (ii) fake crypto exchanges, (iii) pyramid/Ponzi schemes promising “guaranteed”\
    \ returns, or (iv) some variation of an attempt to employ the greater fool theory\
    \ (as shown in the figure below).\n\n![Image result for greater fool theory](Image_4.jpg)\n\
    \nGraphic credit: [www.scienceabc.com](http://www.scienceabc.com)\n\nOf the numerous\
    \ scams reportedly related to Bitcoin, none have concerned the core Bitcoin blockchain.\
    \ In fact, when threats to the blockchain have been detected, it has often been\
    \ Bitcoin’s core developers who have detected the threats, and instead of exploiting\
    \ them, have broadcasted them across the network to solicit help in resolving\
    \ the errors that created them.\n\n7 \n\nFees on the Bitcoin network\n\nTransactions\
    \ on the Bitcoin network are not free, but they are far less than the 1.5–3.5\
    \ percent fees typical in credit card transactions. In 2019, recording the average\
    \ transaction on the Bitcoin network required about 250 bytes of data, and the\
    \ fee for a 1 MB (1 MB = 1,000,000 bytes) block on the network was about $1.89.\
    \ Doing the math, average Bitcoin transactions cost about $0.0005."
