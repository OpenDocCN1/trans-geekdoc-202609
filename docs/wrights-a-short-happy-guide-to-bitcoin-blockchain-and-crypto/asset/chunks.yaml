    \ Deposit Insurance Commission` (`FDIC`)\n*   `Federal Reserve Board` (`Fed`)\n\
    *   `Office of the Comptroller of the Currency` (`OCC`)\n*   `Securities and Exchange\
    \ Commission` (`SEC`)\n*   `Treasury Department` (`Treasury`)\n*   `Office of\
    \ Foreign Assets Control` (`OFAC`)\n*   `Financial Crimes Enforcement Network`\
    \ (`FinCEN`)\n*   `Internal Revenue Service` (`IRS`)\n*   `Office of Financial\
    \ Research` (`OFR`)\n\nAmong those federal regulators, there is little consistency\
    \ in how crypto is characterized. For instance:\n\n*   `SEC` treats crypto as\
    \ securities;\n*   `CFTC` treats crypto as commodities;\n*   `FinCEN` treats crypto\
    \ as money;\n*   `IRS` treats crypto as property;\n*   `OFAC` treats crypto as\
    \ virtual currencies.\n\n## Money Law\n\nAny discussion of the regulations regarding\
    \ crypto begins with the Bank Secrecy Act (`BSA`). The `BSA`, passed in 1970 and\
    \ amended by the Patriot Act in 2001, is the most comprehensive AML/CTF statute.\
    \ The `BSA` authorizes the Secretary of the Treasury to issue regulations requiring\
    \ banks and other financial institutions to take a number of precautions against\
    \ financial crime, including the establishment of AML programs and the filing\
    \ of reports that have been determined to have a high degree of usefulness in\
    \ criminal, tax, and regulatory investigations, and certain intelligence and counter-terrorism\
    \ matters.\n\n`FinCEN` is the Treasury bureau whose mission is to safeguard the\
    \ financial system from illicit use, combat money laundering, and promote national\
    \ security through financial intelligence. `FinCEN` is also the primary regulator\
    \ enforcing the `BSA`. The Secretary of the Treasury has delegated to the Director\
    \ of `FinCEN` the authority to implement, administer, and enforce compliance with\
    \ the `BSA` and associated regulations.\n\nThere is no easy way to explain comprehensively\
    \ the treatment of crypto in a book with a title that includes the words “Short\
    \ & Happy.” The remainder of the book does, however, provide examples and analysis\
    \ of how federal and state regulators have dealt with crypto, and provides the\
    \ reader with a roadmap for further investigation. This book concludes with an\
    \ overview of legislative proposals aimed at providing more clarity to.\n"
