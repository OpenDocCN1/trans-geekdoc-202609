    According to the press release, the investigation led to the arrest of 337 subjects
    around the world and the rescue of at least 23 minor victims who were being abused
    by the website’s users.


    To find the criminals, `DOJ` and the `IRS Criminal Investigation` (`IRS CI`) used
    software developed by `Chainalysis`, a chain analytics company, to track the public
    keys of users of the website, and then linked those public keys to the accounts
    and individuals who used `bitcoin` to pay or receive funds related to the child
    pornography website. In addition to `DOJ`, other law enforcement agencies, such
    as `Homeland Security`, the `Federal Bureau of Investigation` (`FBI`), and the
    `US Drug Enforcement Agency` have used chain analytics to pursue terrorist organizations,
    organized crime, and drug traffickers.


    Chain analytics is not only a tool of law enforcement. Chain analytics company
    `CipherTrace` announced in October 2018 that its platform allowed its private
    clients to trace over 87 percent of the transaction volume of the top 100 cryptos.
    Those clients include financial institutions seeking to comply with financial
    transactions rules, as well as private companies who wish to use chain analytics
    as part of their business models.


    # 104 Privacy v. Security


    Because chain analytics makes it easier to reduce the privacy associated with
    crypto, a number of services have evolved to defeat the effectiveness of chain
    analytics. Those services make it more difficult to link transactions to individual
    accounts or users. Those services expose the privacy/security tradeoff in crypto.


    `Coinjoins` (sometimes called tumblers or mixers) are one method devised to defeat
    chain analytics. `Coinjoins` are services or applications that let users mix and
    exchange their coins with those of other users. After the coins are exchanged
    amongst users, sometimes multiple times, it is more difficult to determine and
    trace prior ownership of the coins, thus defeating chain analysis and preserving
    users’ privacy.


    Privacy coins offer another alternative to defeat chain analytics and maintain
    financial privacy. By and large, those coins obscure almost all transaction details
    on their blockchains, making it difficult or impossible to link transactions to
    users.


    It is difficult to determine the most popular privacy coin (they are, after all,
    private), but most sources agree that `Monero` (`XMR`) is the most widely used
    privacy coin. `Monero` originally used what was called a `CryptoNight` proof of
    work protocol that obfuscated the blockchain’s ledger of transactions, making
    it difficult or impossible to identify any transactional details. In October 2019,
    `Monero` switched to a new proof of work algorithm in order to increase the networks’
    security and decentralization. `Monero` implemented the change in consensus mechanism
    to ensure that mining on its network was not dominated by miners using more sophisticated
    and expensive `ASIC` chips in their computers.


    # 105


    It has been reported that `Monero` was the most popular crypto for `AlphaBay`
    transactions. Before being shut down in 2017, `AlphaBay` was the largest marketplace
    on the darknet (the part of the internet that uses custom software to ensure privacy),
    and was often used to facilitate criminal activities, from illegal file sharing
    to extortion and child pornography. `Monero` was also used by the `WannaCry` hackers,
    who, according to a September 2018 `DOJ` indictment, were a North Korean hacking
    and ransomware ring. According to the `DOJ` and `FBI`, the `WannaCry` hackers
    converted their criminal proceeds into `Monero`.


    One popular privacy coin that has taken a more moderate approach to privacy is
    `Zcash` (`ZEC`), which offers users two transactional options: public and shielded.
    According to `Zcash`:


    If a user opts to shield her funds, they are no longer visible on the blockchain.
    Once shielded, funds can be transferred using shielded transactions, which preserves
    the privacy of both the sender and the recipient. This facilitates compliance
    with regulations that mandate privacy for personal financial information, such
    as the `Gramm-Leach-Bliley Act` in the US, and the `General Data Protection Regulation`
    (`GDPR`) in the EU.


    In late 2019, it was announced that `Zcash` tokens would operate on the `Ethereum`
    blockchain, potentially allowing smart contracts to feature some of `Zcash`’s
    privacy features.


    Some regulators have taken public positions against privacy coins. In spring 2019,
    both French and Japanese regulators suggested banning privacy coins. The head
    of the Finance Committee of France’s National Assembly, `Eric Woerth`, citing
    “fraud, tax evasion [and] money laundering,” concerns, stated:


    “It would also have been appropriate to propose a ban on the dissemination and
    trade in [cryptocurrencies built] to 106ensure complete anonymity by preventing
    any identification procedure by design. This is the case for a certain number
    of [cryptocurrencies] (`Monero`, `PIVX`, `DeepOnion`, `Zcash`... ) whose purpose
    is to bypass any possibility of identifying the holders.”


    In April 2018, Japanese financial regulators suggested a similar ban.


    # Is financial privacy important?


    Many believe `coinjoins` and privacy coins are only useful for criminals. Others
    point out the myriad legitimate reasons to protect one’s financial sovereignty.
    Also, as surveillance becomes more ubiquitous by both businesses and governments,
    the ability to avoid leaving digital footprints will become more important to
    maintain.


    “In an age in which businesses collect, analyze and sell our private information,
    it makes enormous sense to have legislation which protects the privacy of our
    financial transactions.”

    —Arnold Spencer, General Counsel for `Coinsource` and former Assistant U.S. Attorney
    in Texas


    Balance is certainly needed in this area. Although anonymity may help criminals
    and terrorists evade government oversight, privacy and anonymity over financial
    matters is needed in order to maintain the freedoms, in the US at least, guaranteed
    by the Constitution.


    # 107 Stablecoins


    Stablecoins are crypto designed to maintain a stable value. Both stablecoins and
    other crypto like `bitcoin` represent a disruptive technology that has the potential
    to change the financial system. Unlike those other crypto, however, stablecoins
    provide the benefits of crypto—secure, transparent, decentralized, and fast payments—without
    price volatility.


    Because of their price volatility, many crypto are ill-suited to serve as media
    of exchange. Instead, like gold, they are often held (hodled) as speculative store
    of value investments. The “hodling” of crypto exposed a need for crypto that could
    maintain a stable value and be used primarily as a medium of exchange.


    | Stacking Sats![Stack sats and hodl! : Bitcoin](Image_43.jpg)In the Bitcoin community,
    a meme has developed around the continuous accumulation of satoshis (sats) to
    help hodlers acquire a larger position in bitcoin over time. It is unclear who
    created the term, but its popularity increased when it was adopted by crypto podcaster
    Matt Odell and recirculated with the Twitter handle #stackingsats. |


    | --- |


    Through the first half of 2019, over 225 stablecoin projects had been announced,
    and of those, roughly 60 were in operation. By April 2020, `Tether` was the most
    dominant stablecoin, with a market cap of roughly $6 billion and a daily trading
    volume of over $20 billion. `Tether`’s market cap and trading volume are more
    than the combined amounts of `Tether`’s top five competitors (`TrueUSD`, `USD
    Coin`, `Paxos`, `Gemini`, and `DAI`).


    108

