    该定义可能并不完美，但它适用于大多数公共区块链。为了详细解释这个定义，下面解释了其中一些术语。


    ### 关键术语


    **安全的、时间戳的、不可篡改的记录。** 区块链上的每条历史记录都包含了交易执行的确切日期和时间，在没有特殊情况下，这些历史数字记录无法更改。记录是不可篡改的，因为网络上的所有计算机（`nodes`）都有所有历史交易（`blocks`）的副本，任何人都可以实时查看，并且在向区块链添加另一个区块之前，必须对历史状态达成共识。由于这些历史区块分布在整个计算机网络中，伪造即使一条历史记录也意味着伪造整个区块链。


    **去中心化的点对点网络。** 区块链的数字历史包含所有之前交易的记录）在所有节点之间共享。这使得网络能够去中心化，因为没有任何一方或中央权威有权控制区块链。


    **矿工。** 特殊用途软件、强力硬件以及用户的结合，这些用户只有在解决了复杂的密码谜题后，才会向工作量区块链（下文描述）添加区块。


    **节点。** 连接到区块链网络的设备，如计算机（或手机或打印机，只要它有 IP 地址并连接到互联网），通过以下方式支持网络：(1) 维护区块链副本，(2)
    验证交易，有时是 (3) 处理交易。然而，并非所有节点都是相同的。通常有两种类型的节点：


    *   **全节点** 存储整个区块链的副本，包括所有过去的交易。全节点需要大量专门用于区块链的存储和内存。

    *   **轻量节点** 仅存储区块链的一部分，通常是用户需要的区块部分。为了确保轻量节点上的信息准确，轻量节点通常会定期查询全节点以验证其信息的准确性。


    **协议。** 治理区块链上行为的一系列规则。这些规则定义了使用什么软件、区块链将如何运行，以及节点将如何通信。


    **共识。** 在分布式参与者网络中达成共识的问题长期以来是一个未解决的计算机科学问题，在某些方面，比特币解决了它。这个问题通常被表示为“拜占庭将军问题”，下文描述。


    ### 拜占庭将军问题


    这种情况可以抽象地表述为拜占庭军队的一组将军率领营在一个敌城周围。将军们仅通过信使通信，必须就共同的战斗计划达成一致。然而，他们中的一个或多个可能是叛徒，他们试图迷惑其他人，导致攻击不协调和失败。该问题在于找到一种算法，以确保忠诚的将军能够达成一致。


    ![](img/Image_5.jpg](Image_6.jpg)

    图示来源：[https://medium.com/@paul_12056/byzantine-generals-problem-ff4bdc340e56]


    比特币白书为拜占庭将军问题提供了第一个解决方案：它的工作量共识机制，下文将更详细地描述。


    ### 共识机制


    共识机制（有时称为共识协议）是决定分布式节点如何在验证交易和向区块链添加新区块方面达成共识的特定规则。共识机制试图解决以太坊创始人维塔林（Vitalik Buterin）所说的“可扩展性三难困境”，即一个安全、可扩展且去中心化的协议。


    *   **安全：** 区块链的不可篡改性和抗攻击能力有多强。

    *   **可扩展：** 网络可以处理多少交易，以及处理这些交易的速度有多快。

    *   **去中心化：** 对区块链的控制集中程度有多高。去中心化是区块链技术的核心原则，使其具有抗审查性，并减少或消除单点故障。


    ![`cdn-images-1.medium.com/max/600/1*JxrKTU2QczIo_kr1FcKKCg.png`](img/Image_7.jpg)

    （图片来自 [https://medium.com/logos-network/everything-you-know-about-the-scalability-trilemma-is-probably-wrong-bc4f4b7a7ef.]）


    可扩展性三难困境中任何一个方面的增加通常以另外两个方面为代价。在许多方面，可扩展性三难困境与需要装修承包商的人面临的问题相似。这些承包商在很大程度上面临类似的三难困境：工作可以做得快、便宜或质量好。任何两点的增加都会以第三点为代价。


    ### 共识机制


    目前在使用三种主要的共识协议：工作量证明（PoW）、权益证明（PoS）和委托权益证明（DPoS）。


    #### 工作量证明 (PoW)


    PoW 是原始的共识协议，被认为是比特币最大的创新，因为它解决了拜占庭将军问题。比特币和以太坊在使用 PoW，尽管以太坊已宣布未来将转向权益证明系统。


    通常，在 PoW 中，矿工寻找在网络上广播的交易并将这些交易组织成区块。然后矿工之间相互竞争将他们的区块添加到区块链中。获胜的矿工将获得区块奖励，这是网络代币的固定金额。


    PoW 系统涉及的竞争在于，区块奖励只授予给第一个解决了复杂问题（称为密码哈希函数）的矿工。在不涉及计算机科学和数学的深奥领域的情况下，解决哈希函数的唯一方法是投入大量的计算力。在对所有可能的组合进行数万次尝试（称为暴力破解计算）之后，一个或多个矿工将解决哈希函数。此时，第一个解决哈希函数的矿工将被选定添加下一个区块。


    为什么矿工要花费这么多计算力来尝试解决哈希函数？


    好问题。他们这样做是为了区块奖励。按照 2020 年 1 月每个 BTC 10,000 美元的价格，比特币区块奖励为 12.5 BTC，所以每个区块奖励价值
    125,000 美元。因为每天大约添加 144 个区块，当 BTC 价格为 10,000 美元时，区块奖励每天产生约 1440 万美元的价值。比特币价格越高，矿工尝试解决哈希函数的激励就越大。比特币网络有一种机制，称为难度调整，根据根据努力解决哈希的活跃矿工的计算能力（称为网络算力）来更改其哈希函数的难度。难度调整被程序设定为每
    2016 个区块调整一次，大约每两周一次，以确保网络继续每 10 分钟创建一个新区块。


    #### PoW 中的密码学原理


    在不深入探讨博弈论和密码学的情况下，哈希函数通常接受任何大小的输入字符串，对该字符串进行操作，并输出固定大小的唯一字符串。哈希函数的一个重要属性是，输入字符串的任何变化都将产生完全不同的输出字符串。

