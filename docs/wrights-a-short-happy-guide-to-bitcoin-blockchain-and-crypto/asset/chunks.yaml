    ![Decred 自主数字货币 - 卢旺沙非洲技术峰会](img/Image_11.jpg)


    Decred 自称为一种“开放、进取且自我资金支持的加密货币，其区块链中集成了一套基于社区的治理系统”。在 Decred 中，代币持有者可以将其代币锁定（质押）以换取门票，持票者可以通过两种链上治理机制和一种链下治理机制参与治理。链上部分允许投票来：（1）以
    75% 的通过率批准或拒绝对协议共识规则的提议更改；（2） 批准矿工的工作，从而允许矿工获得其区块奖励。


    # 智能合约与去中心化应用


    ## 智能合约


    智能合约是区块链应用程序，包含一组规则，双方可以通过这些规则达成交易协议。9 一旦满足这些协议的条件，协议条款将自动在区块链上或通过依赖于区块链的链下应用执行。


    智能合约的目标是用计算机代码设定协议条款和其执行规则，从而消除对可信中间机构的需求。非区块链智能合约的一个简单例子是自动售货机：交易规则被程序接到机器中。一旦买家向机器中投入正确的金额，机器就会确认金额正确并提供商品。


    尽管被称为智能合约，但大多数并不是法律合同。相反，它们是一组设定了执行规则的条件指令。如果程序编写正确，智能合约是自验证、自执行、防篡改的，并且在大多数情况下可以通过减少或消除对可信中间机构的需求来降低交易成本。以太坊（Ethereum）是第一个专为智能合约开发而设计的区块链，其目的是创建一个：


    一个不仅能够支持货币或交换媒介的用例的平台，还能为货币增加可编程性，在方程中引入条件逻辑，这将为去中心化金融应用、产品以及额外的去中心化应用开启一个可能的世界。10


    | ![C:\\Users\\delwr\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\361EC617.tmp](img/Image_12.jpg)以太坊：一个智能合约平台
    2013 年 11 月，维塔里克·布特林（Vitalik Buterin）发布了以太坊白皮书，提出以太坊作为一种开源分布式计算平台，在该平台上可以构建和维护智能合约以及其他货币和应用。运行该平台的燃料被称为“以太坊（ether）”，它是以太坊系统运行程序和存储数据所需的加密资产。以太坊由位于瑞士楚格（Zug）的非营利组织以太坊基金支持，其使命包括向公众改进有关以太坊平台进展和发展的沟通。
