    稳定币为移动支付提供了一种有效且成本效益高的手段。在美国，移动支付约占所有支付的 15%，移动支付市场由 `PayPal`、`Square Cash` 和
    `Venmo` 等公司主导，这些公司通常收取 2.75% 或更高的交易手续费。直接从消费者传输到企业的稳定币可以消除这些费用。


    稳定币还被用作加密货币交易者或企业的临时持有资产，消除了持有不稳定的加密货币的风险。这一用例之所以出现，是因为许多加密交易所出于洗钱和其他监管考虑，对其客户将加密货币兑换为法币的能力设置了限制或上限。因此，稳定币为加密所有者提供了一个避避动的避风港，并经常用于在不交易成法币的情况下锁定加密利润。


    稳定币还可以产生社会效益，为无法获得金融服务的群体（通常被称为“无银行账户者”）提供金融科技。世界银行估计，全球约四分之三的贫人没有银行账户，在 17 亿到
    20 亿成人之间。然而，根据联合国的数据，11 亿无银行账户的人可以使用手机手机。稳定币为无银行账户者提供了更大的参与金融体系的机会，让他们能够使用一种允许他们以易传输且安全的形式存储和积累财富的技术。


    稳定币还为生活在货币不稳定地区的人们提供了一种稳定的货币形式。在这些情况下，个人可以选择放弃当地货币而选择稳定币，从而避免当地货币的任何不稳定或通货膨胀。例如，在委内瑞拉的恶性通胀期间，一些公民将他们的玻利瓦兑换成稳定币，保护了他们的财富和购买力，避免了政府引发的恶性通胀的影响。


    虽然这种系统为公民带来了明显的利益，但对于货币不稳定的国家政府来说并非如此。如果这些国家的公民放弃当地货币并使用稳定币，对政府法币的需求将会减少。随着需求的下降，发行更多法币的效用也会随之降低。在这种情况下，政府将面临一系列缺乏吸引力的财政政策选择：加税、削减开支和借款。


    ## 稳定币是如何工作的？


    大多数稳定币的工作原理类似于数千年来的金本位制：它们的结构让用户确信，它们受到了特定类型抵押品的支持，并在某种程度上可以兑换成该抵押品。虽然对于大多数稳定币来说事实如此，但另一种类型的稳定币已经出现，它们没有抵押品，并利用供需原则来维持稳定价格。这种被称为
    `seigniorage` 或 `算法稳定 coins` 的代币，虽然在理论上很有趣，但尚未大规模采用。


    对于抵押型稳定币，出现了两种主要类型：


    *   传统资产支持型稳定币，以法币（美元、欧元、日元）等实资产或黄金、石油等大宗商品作为抵押品；以及

    *   加密货币支持型稳定币，以其他加密货币作为抵押品。


    ## 传统资产支持型稳定币


    最流行的传统资产支持型稳定币是以硬资产抵押的并由中心化实体运营的。它们的价值取决于底层抵押品的价值，并且通常被设计为锚定美元等法币（`1 unit = $1.00`）。本节将以
    `Tether` 为例，它是一种中心化的、资产支持的稳定币。`Tether` 的所有者还运营加密货币交易所 `Bitfinex`。


    ![Image_44.jpg]

    一个 `tether` (`USD₮`) 的价格被设计为锚定美元，这意味着每个 `1 USD₮` 应该维持 `$1.00` 的价值。为了维持锚定，`Tether`
    必须让更广泛的市场相信它足够的抵押品来支持所有发行的 `USD₮`。这意味着在任何时候，市场必须相信所有发行和流通的 `USD₮` 都可以 `1:1` 地兑换美元，或者至少是价值美元的抵押品。


    在过去的五年里，`USD₮` 的价格保持相对稳定，在 2017 年达到约 `$1.015` 的高点，在 2018 年底达到约 `$0.9625` 的低点，但通常保持与美元的
    `1:1` 锚定。尽管 2019 年就关于其抵押品产生了疑问，`Tether` 仍然维持了其稳定性：


    ### 事件 1：抵押品问题


    在 2019 年 2 月之前，`Tether` 的网站提供了以下关于其抵押品的信息：


    每一个 tether 始终由我们储备中持有的传统货币 1 比 1 支持。因此，`1 USD₮` 始终等同于 `[$1 dollar]`。


    2019 年 3 月，`Tether` 的网站进行了更新，并指出：


    每一个 tether 始终由我们的储备 100% 支持，我们的储备包括传统货币和现金等物，并可能随时包括 `Tether` 向第三方发放贷款产生的其他资产和应收账款。


    这一更新的信息引发了对 `Tether` 未完全抵押的可能。此外，关于“其他资产”（字面上可以包括任何资产）的加入让许多加密社区质疑 `Tether` 抵押品的质量和充足性，并对所有流通的
    `USD₮` 是否有抵押品表示怀疑。


    ### 事件 2：缺失的抵押品


    2019 年 4 月，纽约总检察官指控 `Bitfinex`（`Tether` 的姐妹公司）使用了 `Tether` 的 8 亿美元作为抵押品来掩盖 `Bitfinex`
    账户中“缺失”的 8 亿美元。`Bitfinex` 声称这些资金并非丢失，而是被没收了。该案件在 2020 年 3 月在上诉法院进行了审理，预计将于 2020
    年晚些时候裁决。


    尽管发生了这两个事件，根据稳定币指数 (`stablecoinindex.com`)，`Tether` 继续维持与美元的锚定，并是市值最高的稳定币。`Tether`
    是否能保持其主导地位尚不可知。然而，一个新的竞争者计划进入稳定币市场。


    ## Facebook 加入


    ![Image_45.jpg)2019 年 6 月 18 日，`Facebook`宣布将推出一种名为 `Libra` 的法币支持稳定币。根据公告，`Libra`
    预计将于 2020 年上线，并将由一组相对稳定的货币作为抵押，可能包括美元、欧元和日元。


    `Facebook` 的公告具有重大意义，因为如果有足够的 17 亿活跃 `Facebook` 账户持有者决定使用 `Libra`，它很容易成为全球领先的稳定币。`Libra`
    的未来成功以及长期影响显然尚未知。然而，`Facebook` 的公告引发了一些重要问题，包括：


    *   `Facebook` 如何处理用户隐私？

    *   `Facebook` 账户会与 `Libra` 账户关联吗？

    *   `Libra` 会去中心化吗？如果不会，它真的是加密货币吗？

    *   谁来为 `Libra` 做决策，这些决策将如何做出？

    *   基于发达国家货币的货币是否意味着世界其他地区将受制于发达国家央银行并受其操纵？

    *   货币政策是否应该由企业实体全部或部分控制（正如彭博的一篇评论文章所说，“技术独裁者和风险投资者的结团”）？


