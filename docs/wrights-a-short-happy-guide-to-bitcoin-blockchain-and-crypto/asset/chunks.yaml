    资金转移规则（Funds Travel Rule）导致几家合规交易所开始下架隐私币，因为它们担心这可能违反反洗钱（AML）法规。例如，英国的 `Coinbase`
    在 2019 年 8 月下架了 `Zcash`；韩国的 `OKEx` 和 `Upbit` 交易所宣布，将于 2019 年 9 月份下架至少包括 `Zcash`
    和 `DASH` 在内的五种隐私币。`Coinbase` 的下架在某种程度上是由其新的银行合作伙伴 `ClearBank` 要求交易所下架 `Zcash`驱动的。


    `OKEx` 和 `Upbit` 的下架公告受 `FATF` 和对资金转移规则担忧的驱动，`OKEx` 在宣布其决定时引用了资金转移规则。`Upbit` 履行了其在
    2019 年 9 月下架 `Zcash` 的公告。然而，在 2020 年 10 月，`OKEx` 宣布下架决定正在审查中，关于 `Zcash` 和 `DASH`
    的最终决定将在审查后公布。截至 2020 年 5 月，`OKEx` 尚未从其平台上移除 `Zcash` 交易。


    在 2019 年之前，尚不清楚 `FinCEN` 是否会将 `coinjoins` 和混器（`FinCEN` 称为匿名化服务）视为资金汇款者，从而受 AML
    法规限制。但在 2019 年，`FinCEN` 发布了指南，明确了匿名化服务何时会受 `FinCEN` 监管。根据 `FinCEN` 的说明，匿名化服务有两种：


    1. 服务提供者：接受 `[crypto]` 并以设计旨在重新传输它们，以防止他人将传输追溯到源头的人，以及


    2. 软件提供者：传输者为实现相同目的将使用的软件供应商。


    在 2019 年的指南中，`FinCEN` 表示，匿名服务提供者将被视为资金汇款者，因为此类业务“从事提供安全资金传输的业务”。然而，匿名软件提供者不会被视为资金汇款者，因为“在资金传输中可能使用的工具
    144（通信、硬件或软件）的供应商，如匿名化软件，从事的是贸易而非资金传输。”[强调由原文提供]


    这种区别非常重要，因为在指南发布之前，尚不清楚 `FinCEN` 是否会试图让软件平台和匿名化软件的开发者遵守 AML/KYC 法规。这样做将违背匿名化服务的目的，并实质上摧毁这些业务。


    虽然这些服务在美国似乎是合法的，但全球范围内并非如此。2019 年 12 月，一位 `Binance` 客户推特说，`Binance` 新加坡交易所阻止了他提取加密货币，因为他使用了混器。所说的混器是
    `Wasabi` 混合钱包，这是一种去中心化的 `coinjoin`，它不提供托管用户资金的第三方服务，因此根据 `FinCEN` 的规定，它是不受 AML
    监管的匿名软件提供者。


    `Binance` 的行动让加密行业的许多人感到困扰，因为交易所已经对客户执行了 KYC 规则，这意味着似乎仅仅是使用混器导致了 `Binance` 冻结客户的账户。在客户发推特后，加密货币推特（`#CryptoTwitter`、`#crypto`、`#bitcoin`）充满了对
    `Binance` 行动原因的猜测。`Binance` 的 CEO `赵长鹏`（`CZ`）暗示 AML/CFT/KYC 法规是客户代币被冻结的原因。该客户最终被允许提取资金，但前提是承诺不再向混合钱包存款。


    然而，`Binance` 的行动很可能是未来政府与 `coinjoins` 和混器斗争中的第一场实战冲突，尽管这场战斗已经酝酿多年。2017 年 1 月，来自
    `145Europol`（欧洲刑警组织）、`Interpol`（国际刑警组织）和 `Basel Institute` 的官员讨论了加密货币，特别是混器。会议结束后，`Basel
    Institute` 发布了如下警告：


    建议各国对数字货币混器采取行动。此类服务专门设计用于匿名化交易，使执法机构无法检测和追踪。此类公司的存在不应继续被允许。


    146


    ## 州法律与 UCC


    在美国，商业交易法通常由州监管。每个州都颁立了规定其范围内商业交易规则的法律。为了提供州间的一致性，所有 50 个州都采用了由 `Uniform Law Commission`
    起草的某种形式的统一商法（见下表）。


    | 统一商法 (UCC) |

    | :--- |

    | `UCC` 是一套规范商业或业务交易（房地产外）规则的模型法律集。`UCC` 由 `Uniform Law Commission` 于 1952 年首次发布，并在后进行了多次修订。尽管所有
    50 个州都采用了 `UCC`，但存在管辖差异，通常与特定的州关注有关。`UCC` 涵盖了许多交易，包括销售、租赁、票据、银行存款和收款、资金转移、信用证、批量销售、权利证明、投资证券和担保交易。`UCC`
    的主要目标是：<<ul><li>为商业交易提供简单、清晰的规则；</li><li>允许通过惯例、习惯和双方协议继续扩大商业实践；</li><li>使各州的商业交易法统一。</li></ul>
    |

    | 2017 年，`Uniform Law Commission` 起草了一个监管加密相关业务活动的框架，称为 `147 虚拟货币监管法案` (`URVCBA`)。2018
    年，`Uniform Law Commission` 为 `URVCBA` 增加了一个`补充法案`（`URVCBA` 和 `补充法案` 统称为 `模型法案`），该法案“利用
    `UCC` 中经过考验的客户义务和权利提供了商法规则。”`Uniform Law Commission` 在一份声明中表示：“为了满足这一主题日益增长的需求，`[Uniform
    Law Commission 和 American Law Institute]` 建立了一个研究委员会，以确定如何统一地修订 `[UCC]` 以应对新兴技术。敦促各州在委员会工作结果出来前避免立法。”
    |


