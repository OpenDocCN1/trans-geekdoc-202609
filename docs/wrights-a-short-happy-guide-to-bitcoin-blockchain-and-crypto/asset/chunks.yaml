    # 第三部分：区块链与法律


    ## 监管区块链领域


    没有任何一个政府可以声称对区块链技术和加密货币拥有独有的管辖权。然而，一旦人们开始将区块链作为货币（加密货币）使用，政府（i）开始为这种使用制定“规则”，并（ii）发现要监管一种存在于物理边界和身份之外的技术面临着困难。


    广而言之，各国在监管加密货币方面了三种方法：


    ### 1. 鼓励

    采取这种方法的政府颁布了支持和鼓励加密货币的规则，使其公民和企业更容易使用加密货币以及经营加密业务。一些对加密货币较友的国家包括马尔他、日本、百慕岛、香港、瑞士和新加坡。


    马尔他是一个拥有约 45 万人口的欧洲南方小国，一直是积极鼓励加密货币业务的国际领导者。2018 年 2 月，马尔他政府颁布了马尔他数字创新局（MDIA），为加密货币业务建立了全面的监管框架。随后在
    2018 年，全球交易量最大的加密货币交易所之一币安（Binance）将其总部从香港迁至马尔他。


    ### 2. 许可

    采取这种方法的政府允许区块链技术运行，但通常：

    *   制定了难以执行或遵循成本高昂的规则；和/或

    *   未能提供清晰的监管规定，导致公民和企业不确定现有规则是否以及在何种情况下适用于加密货币。


    美国属于这一类。尽管美国的加密货币规则通常是许可性的，但围绕美国监管政策产生的不确定性是导致许多加密货币企业搬迁至非美国注册地的因素之一。


    ### 3. 严格

    这些政府通常对加密货币持敌态度，禁止使用或拥有加密货币、首次代币发行（ICO）和加密交易所。一些对加密货币较不友的国家包括阿尔及利亚、玻利维亚、摩洛哥、尼泊尔、巴基斯坦和越南。


    | 中国加密货币 | 中国对加密货币的方法在某些是许可的，而在另一方面是严格的。根据现法，中国禁止所有 ICO，禁止金融机构进行加密货币交易，不允许任何与加密货币相关的支付技术获得专利，直到最近还威胁要禁止加密挖矿。2019
    年 4 月，中国政府将比特币挖矿列为计划随时间淘汰的行业之一。然而，2019 年 10 月，习近平主席发表了演讲，呼吁加大区块链开发的努力。演讲后，政府将加密挖矿从其想要淘汰的行业中移除。全球范围内，2019
    年加密挖矿产生了超过 54 亿美元的收入，据估计，由于中国廉价的电力、劳动力和资源，该挖矿活动的 65-81% 发生在中国。下方的由《华尔街日报》提供的图表显示了最受欢迎的比特币矿池的市场份额。![](img/Image_51.jpg)2019
    年 12 月，中国人民银行（PBoC）行长猛志春宣布，中国将很快推出官方货币人民币的数字形式，试点项目正在进行中，预计于 2020 年推出。2019 年 7
    月，中国人民银行研究局局长王信承认，Facebook 发布 Libra 稳定币是中国倾向于将数字人民币引入市场的重要因素之一。许多人推测，数字人民币有助于中国挑战美元的全球霸地位。
    |

    | --- |


    尽管对加密货币的监管方法各不相同，但各国政府长期以来合作建立规则以保护国际金融体系的完整性。目前的努力于 1989 年正式开始，当时成立了金融行动特别工作组（FATF），旨在制定标准并促进法律、监管和操作性规则的有效实施，以防止洗钱（反洗钱或
    AML）并打击其他形式的金融犯罪。在 2001 年 9 月 11 日袭击后，FATF 的授权扩大到包括打击恐怖主义融资（CTF）。


    | 什么是金融行动特别工作组（FATF）![Image_52.jpg) FATF 制定标准并促进法律、监管和操作性措施的有效实施以打击洗钱、恐怖主义融资及其他相关威胁。根据
    FATF 网站：

    *   FATF 是一个政策制定机构，致力于产生立法和监管改革。

    *   FATF 与其他国际利益相关者合作，识别国家级漏洞，旨在保护国际金融体系免受滥用。

    *   监控成员在实施打击洗钱、恐怖主义融资及其他相关威胁的必要措施方面的进展。 |


    FATF 有 39 个成员国，包括美国、中国和欧盟委员会（代表欧盟）。此外，以下宗旨通常为打击洗钱的政府间组织是 FATF 的附属成员：

    *   亚太地区洗钱行动小组（APG）

    *   加加勒比地区金融行动工作组（CARIFT）

    *   欧洲委员会反洗钱措施评估小组（COAF）

    *   欧亚小组（EGAG）

    *   东南部非洲反洗钱小组（ESAAMLG）

    *   拉美金融行动工作组（GAFIL）

    *   西非反洗钱行动小组（GIABA）

    *   中中东和北非金融行动工作组（MENAFTF）

    *   中非洗钱工作组（TFCM）


    关注反洗钱的国际组织也与 FATF 合作并担任观察员，包括世界银行、联合国、国际刑警组织、经济合作与发展组织（OECD）和国际货币基金等。 |

    | --- |


    2014 年，FATF 对加密货币的洗钱和恐怖主义融资风险进行了初步评估（加密货币在 FATF 中被称为“虚拟货币”）。随后在 2015 年，FATF 提供了帮助各国制定加密货币相关
    AML/CTF 规则的指导。2015 年的指导要求各国评估加密货币代表的 AML/CTF 风险类型，并实施规则防止加密货币用于洗钱和恐怖主义融资。


