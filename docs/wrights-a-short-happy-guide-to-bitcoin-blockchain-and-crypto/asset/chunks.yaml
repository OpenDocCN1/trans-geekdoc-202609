    After a soft fork, miners must upgrade to the new post-fork software. Else, their
    old software could create blocks that violate the rules of the soft fork and would
    be rejected by the post-fork software, a costly waste of computing power with
    no chance of earning a block reward.


    ## Hard fork


    A hard fork is not backwards compatible, meaning operations that occur on the
    new chain cannot occur on the old chain. For example, assume a chain had a maximum
    block size of `1 MB`, and that chain executed a hard fork increasing the maximum
    block size to `4 MB`. After the fork, a `2 MB` block would be accepted by the
    new post-fork chain, but that `2 MB` block would be rejected by the pre-fork chain
    because it exceeded the `1 MB` maximum block size.


    ## Chain splits


    What is good among one people is an abomination with others.


    —Chinua Achebe, Things Fall Apart


    A chain split occurs when there are two or more competing versions of a blockchain
    after a fork. Chain splits can be caused by either a hard or a soft fork. The
    chart below depicts a chain split.


    ![](Image_28.jpg)


    As seen above, both chains will have the same pre-fork history, but will have
    new and competing blockchains post-fork. To cause a chain to split, each side
    must have enough economic and computing power to continue to operate its preferred
    version of the blockchain. Generally, chain splits revolve around contentious
    technology proposals, often with each side believing that, over time, its side
    (the “right” side) will win and the other side (the “wrong” side) will fail.


    There have been a number of Bitcoin-related hard forks, but two of the most significant
    were the August 2017 hard fork that created Bitcoin Cash, and the November 2018
    Bitcoin Cash split that created Bitcoin ABC and Bitcoin SV described below.


    ![A screenshot of a cell phone Description automatically generated](Image_29.jpg)


    ### Bitcoin Cash fork


    In November 2018, after a very public debate, Bitcoin Cash executed a hard fork
    which resulted in two new coins being created: `Bitcoin ABC` and `Bitcoin SV`.
    During the battle to see which coin would become the “real” Bitcoin Cash, both
    factions (i) claimed to be the legitimate Bitcoin Cash, and (ii) sought to claim
    the symbol `BCH`, which would indicate to the public a “winner” of the battle.


    Much of the fight spilled out onto the public, and at the time, there were numerous
    media reports of threats, cross-chain sabotage, and retaliation. To engage in
    the battle, groups of miners (mining pools) diverted significant hashing power
    to their respective sides. Estimates suggest that the ABC and SV groups spent
    upwards of $700,000 per day seeking dominance for their respective sides.


    One cause of the rift was block size: `Bitcoin ABC` (ABC was short for “Adjustable
    Blocksize Cap”) wanted to maintain the `BCH` 32 MB block size, while `Bitcoin
    SV` (SV was short for Satoshi’s Vision) wanted to increase the block size to 128
    MB. Because neither side could come to agreement, both sides used the hard fork
    to implement their desired block size.


    Immediately before the hard fork, many crypto exchanges halted `BCH` trading,
    not only because of the uncertainty surrounding the chain split, but also because
    it was unclear whether, or which, post-fork split chain would be allowed to call
    itself “Bitcoin Cash.” Over time, the ABC group appeared to have come out on top.
    Many exchanges now refer to `Bitcoin ABC` as simply `Bitcoin Cash` (`BCH`), but
    `Bitcoin SV` is still a viable chain. According to `coinmarketcap.com`, by market
    capitalization at the end of 2019, `Bitcoin ABC` (listed as `Bitcoin Cash` (`BCH`))
    had a market cap of approximately $4.9 billion, and `Bitcoin SV` had a market
    cap of approximately $2.9 billion.


    ## Identity on the Blockchain


    Having and proving one’s identity is integral to functioning in modern society.
    According to Article 8 of the United Nations Convention on the Rights of the Child,
    everyone has a right to an identity. However, over 1.1 billion people worldwide
    cannot claim ownership over their identities because they do not have the necessary
    documentation to prove their identities. Absent such proof, their ability to participate
    in society, to own property, vote, receive government services, open a bank account,
    or find full-time employment is limited or non-existent.


    An individual’s proof of identity often consists of the state-provided means to
    authenticate oneself. In the US, those include birth certificates, Social Security
    numbers, driver’s licenses, and passports. All require holding and keeping a physical
    document that contains various forms of identity data. In many cases, when people
    need to prove their identity, turning over one of those documents means providing
    more information than the other side needs, which risks compromising the person’s
    privacy and security. A digital ID, securely maintained on a public blockchain,
    could help eliminate that risk. However, a great deal of work is left to be done.


    For example, imagine Bibi just turned twenty-one and wanted to buy a cold Pliny
    the Elder (a truly outstanding beer, unfortunately not available outside of the
    western US) at the local watering hole. When she walks in, the bartender asks
    to see her ID to make sure she is of legal drinking age. The bartender only needs
    one piece of information, her date of birth. But in reality, he does not even
    need that; he only needs an answer to the binary question of whether she is over
    twenty-one.


    However, when she hands over her ID, she not only proves she is over 21, but also
    gives the bartender a trove of other personal information, including her full
    name, her address, her birthday, and her driver’s license number. A trusted blockchain-based
    identity (`blockchain ID`) could allow Bibi to let the bartender she is over twenty-one
    and keep the rest of her information private, protecting both her personal data
    and her safety.


    A `blockchain ID` would provide additional benefits as well, including:


    *   giving individuals control over their private data, thereby eliminating the
    ability of others, including credit card companies, social media companies, and
    large search engine companies, from profiting from individuals’ private data;
    and

    *   making large-scale data theft more difficult, as large companies would no
    longer hold users’ data, making them less attractive honeypots for hackers.


    A `blockchain ID` would be especially valuable to two at-risk populations:


    Refugees. Estimates are that twenty million refugees no longer have access to
    their legal identities. The United Nations Human Rights Commission is exploring
    how a `blockchain ID` could help refugees prove their identities, share their
    identities with others for working or assistance purposes, and potentially store
    wealth as they flee their home countries.


    The Homeless. Many homeless people have difficulty maintaining their possessions,
    including identification documents. A `blockchain ID` would not only allow them
    to prove their identities, but also allow service providers to better assist them
    in meeting their social and welfare needs.


    ## Blockchain ID: Easier said than done


    Creating a `blockchain ID` faces many obstacles before it can be implemented.
    Among the problems are:


    What data will be used?


    In order to create a `blockchain ID`, there needs to be some consensus regarding
    what types of data should be used to verify a person’s identity. Three potential
    types of data are as follows:


    1)Something the person knows: passwords, code phrases, unique information. One
    problem with this type of data is that it can be forgotten; also, it becomes useless
    when a person is incapacitated or cannot communicate.

