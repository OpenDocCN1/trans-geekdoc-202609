- raw: "Stablecoins provide an effective and cost-efficient means for mobile payments.\
    \ In the United States, where mobile payments are roughly 15 percent of all payments,\
    \ the mobile payment market is dominated by companies like PayPal, Square Cash,\
    \ and Venmo, which often charge transaction fees of 2.75 percent or more. Stablecoins\
    \ transferred directly from consumers to businesses could eliminate those fees.\n\
    \nStablecoins are also used as a temporary holding asset for crypto traders or\
    \ businesses, eliminating the risk of holding unstable crypto. This use case evolved\
    \ because many crypto exchanges, based on anti-money-laundering and other regulatory\
    \ concerns, placed restrictions or limits on their customers’ ability to exchange\
    \ crypto into fiat currencies. Stablecoins thus provide a resting place for crypto\
    \ owners to avoid volatility, and are often used to lock in crypto profits without\
    \ trading into a fiat currency.\n\nStablecoins can also produce societal benefits,\
    \ providing financial technology to populations without access to financial services,\
    \ often referred to as the “unbanked.” The World Bank estimates are that about\
    \ three-quarters of the world’s poorest individuals are unbanked, between 1.7\
    \ and 2 billion adults. However, according to the United Nations, 1.1 billion\
    \ of the unbanked have access to mobile phones. Stablecoins offer the unbanked\
    \ a greater opportunity to participate in the financial system, giving them access\
    \ to a technology that allows them to store and accumulate wealth in an easily\
    \ transportable and secure form.\n\nStablecoins also provide a stable form of\
    \ money to people living in places with unstable currencies. In such cases, individuals\
    \ can opt out of their local currencies and opt into stablecoins, thereby avoiding\
    \ any instability or inflation in their local currencies. For example, during\
    \ the hyperinflationary period in Venezuela, some citizens exchanged their bolívars\
    \ into stablecoins, preserving their 109wealth and purchasing power and avoiding\
    \ the effects of government-caused hyperinflation.\n\nWhile such a system provides\
    \ obvious benefits for citizens, the same is not true for governments of countries\
    \ with unstable currencies. If citizens of those countries opt out of the local\
    \ currency and use stablecoins, the demand for the government’s fiat money will\
    \ decrease. As that demand drops, so does the efficacy of printing more of it.\
    \ In such cases, the government would be left with an unattractive set of fiscal\
    \ policy choices: raise taxes, cut spending, and borrow money.\n\nHow do stablecoins\
    \ work?\n\nMost stablecoins work like the gold standard worked for millennia:\
    \ they are structured to give users confidence that they are supported by, and\
    \ on some level can be exchanged into, a particular type of collateral. While\
    \ that is true for most stablecoins, another type of stablecoin has emerged that\
    \ is not collateralized and uses principles of supply and demand to maintain a\
    \ stable price. Such coins, called seigniorage or algorithmic stablecoins, while\
    \ interesting in theory, have not yet been adopted at scale.\n\nFor the collateralized\
    \ stablecoins, two main types have emerged:\n\n*   traditional asset-backed stablecoins,\
    \ collateralized by physical assets such as fiat currencies (US dollar, euro,\
    \ Japanese yen) or commodities such as gold or oil; and\n\n*   crypto-backed stablecoins,\
    \ collateralized by other crypto.\n\nTraditional Asset-Backed Stablecoins\n\n\
    The most popular traditional asset-backed stablecoins are collateralized with\
    \ hard assets and run by centralized entities. Their value depends on the value\
    \ of the underlying collateral, and often 110are designed to be pegged to a fiat\
    \ currency like the US dollar (1 unit = $1.00). This section will use Tether,\
    \ a centralized, asset-backed stablecoin as an example. Tether’s owners also operate\
    \ the crypto exchange Bitfinex.\n\n![C:\\\\Users\\\\delwr\\\\AppData\\\\Local\\\
    \\Microsoft\\\\Windows\\\\INetCache\\\\Content.MSO\\\\92DB356D.tmp](Image_44.jpg)The\
    \ price of one tether (USD₮) is designed to be pegged to the US dollar, meaning\
    \ each 1 USD₮ should maintain a value of $1.00. In order to maintain the peg,\
    \ Tether must convince the broader market that it has sufficient collateral to\
    \ support all the USD₮ that has been issued. That means that at any time, the\
    \ market must believe all issued and outstanding USD₮ can be exchanged 1:1 for\
    \ dollars, or, at minimum, one dollar’s worth of collateral.\n\nIn the last five\
    \ years, the price of USD₮ have remained relatively stable, reaching a high of\
    \ about $1.015 in 2017 and a low of around $0.9625 in late 2018, but generally\
    \ maintaining the 1:1 peg with the dollar. Tether has maintained its stability\
    \ despite questions arising in 2019 regarding its collateral, based on two incidents:\n\
    \nIncident 1: Collateral Questions\n\nPrior to February 2019, Tether’s website\
    \ provided the following information about its collateral:\n\nEvery tether is\
    \ always backed 1-to-1, by traditional currency held in our reserves. Thus, 1\
    \ USD₮ is always equivalent to \\[$1 dollar\\].\n\nIn March 2019, Tether’s website\
    \ was updated, and stated:\n\nEvery tether is always 100% backed by our reserves,\
    \ which include traditional currency and cash equivalents and, from time to time,\
    \ may include other assets and receivables from loans made by Tether to third\
    \ parties, which may include affiliated entities (collectively, “reserves”)\n\n\
    111 \n\nThat updated information raised the possibility that Tether was not fully\
    \ collateralized. Moreover, the inclusion of language about “other assets”—which\
    \ literally could be anything—caused many in the crypto community to question\
    \ both the quality and sufficiency of Tether’s collateral, and raised doubts about\
    \ whether there was sufficient collateral for all the USD₮ in circulation.\n\n\
    Incident 2: Missing Collateral\n\nIn April 2019, the New York attorney general’s\
    \ office alleged that Bitfinex (Tether’s sister company) used $850 million of\
    \ Tether’s collateral to cover up $850 million that was somehow “missing” from\
    \ Bitfinex’s accounts. Bitfinex has contended that the funds were not missing\
    \ but had been seized by government authorities. The matter was argued in front\
    \ of an appeals court in New York in March 2020, and a ruling is expected later\
    \ in 2020.\n\nDespite those two incidents, according to the stablecoin index (stablecoinindex.com),\
    \ Tether has continued to maintain its peg to the dollar and remains the stablecoin\
    \ with the highest market capitalization. Whether Tether will maintain its dominance\
    \ is anyone’s guess. However, a new competitor has plans to compete in the stablecoin\
    \ market.\n\nEnter Facebook\n\n![](Image_45.jpg)On June 18, 2019, Facebook announced\
    \ that it would offer a fiat-backed stablecoin called “Libra.” According to the\
    \ announcement, Libra was expected to go live sometime in 2020 and would be collateralized\
    \ by a basket of relatively stable currencies, likely including the US dollar,\
    \ the euro, and the Japanese yen.\n\n112 \n\nFacebook’s announcement was significant\
    \ because Libra could easily become the world’s leading stablecoin if enough of\
    \ the 1.7 billion active Facebook account holders decided to use Libra. Libra’s\
    \ future success, as well as its long-term impact, are clearly unknown. However,\
    \ Facebook’s announcement raised some important questions, including:\n\n*   How\
    \ will Facebook deal with user privacy?\n\n*   Will Facebook accounts be linked\
    \ to Libra accounts?\n\n*   Will Libra be decentralized, and if not, is it really\
    \ a crypto?\n\n*   Who will make decisions for Libra, and how will those decisions\
    \ be made?\n\n*   Would a currency based on developed-world currencies necessarily\
    \ mean that the rest of the world would be beholden to, and subject to manipulation\
    \ by, developed-world central bankers?\n\n*   Should monetary policy be controlled,\
    \ in whole or in part, by corporate entities (or, as was stated in a Bloomberg\
    \ opinion piece, “a cabal of tech czars and venture capitalists”)?"
