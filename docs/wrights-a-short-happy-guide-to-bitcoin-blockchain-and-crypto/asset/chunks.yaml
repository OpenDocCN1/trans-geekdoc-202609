  trans: '

    美国国税务局（IRS）声称需要这些信息是因为他们发现了 Coinbase 客户违反了美国税法的证据，但如果没有 Coinbase 提供的信息，无法确定这些客户的身份。在收到传票后，Coinbase
    拒绝配合并发表了以下声明：


    “尽管 Coinbase 的通常做法是配合针对明确的执法调查，但我们对政府请求的无差别范围深表担忧。我们客户的隐私权对我们至关重要，我们的法律团队正在审查政府的申请。在目前范围内，我们将在法庭反对政府的申请。我们将继续向客户通报此事的最新进展。”


    Coinbase 最终在联邦法院对传票提出异议，认为该请求过于宽泛。


    在随后的诉讼中，IRS 通过重点关注漏报问题来为传票辩辩护，并指出：


    “在短短几年内，比特币创造了数十亿美元的财富，其中很大一部分无疑归美国纳税人所有，但这些收入的增加几乎没有第三方向 IRS 进行过报告，”


    而且某些加密货币用户：


    “已公开承认他们考虑使用比特币是为了规避税收报告要求。”


    最终，法院缩小了传票的范围，要求 Coinbase 仅提供其加密客户的纳税人识别信息（社会安全或税务识别号码、出生日期、地址）以及账户活动记录。法院还告诉
    IRS，如果它需要特定纳税人的更详细记录，IRS 可以向纳税人直接传票，或在通知纳税人的情况下向 Coinbase 发出传票。


    IRS 在 2019 年还加强了执法力度。7 月，它根据收到的约翰·传票（John Doe summonses）回复，发送了三封与合规相关的信。这些信作为对纳税人报告其加密货币交易的警告，分为三个强度。每封信的相关语言如下所示：


    ### 6174 号信

    “我们获得的信息显示您拥有或曾拥有一个或多个虚拟货币的账户，但可能不知道涉及虚拟货币交易报告的要求。”


    ### 6174-A 号信

    “我们获得的信息显示您拥有或曾拥有一个或多个虚拟货币的账户，但可能没有正确报告您涉及虚拟货币的交易。”


    ### 6173 号信

    “我们获得的信息显示您拥有或曾拥有一个或多个虚拟货币的账户，并且可能没有满足涉及虚拟货币交易的美国税收申报和报告要求。” `Letter 6173` 还要求纳税人提交回复，要么修改纳税表，要么提供支持其在税表中所采取报告立场的证明文件。


    ## 隐私问题


    IRS 收集信息的努力不仅限于第三方的请求。在 2019 税务年度的 `Schedule 1` 中（`Schedule 1` 通常与标准纳税表 `Form
    1040` 一起提交），IRS 包含了以下问题（加密货币问题）：


    “在 2019 年期间的任何时候，您是否收到、出售、发送、交换或以其他方式获得了任何虚拟货币的财务利益？”


    由于 `Form 1040` 要求纳税人在承担伪证罪罚的下声明，纳税表及附表在纳税人所知范围内是“真实、准确且完整的”，因此加密货币问题等同于 IRS 的一项要求，即纳税人向政府披露他们在
    2019 年是否获取了加密货币，无论他们是否欠任何加密货币相关的税。此外，回答不准确或未回答加密货币问题都可能被视为提交虚假税表，这是 `26 U.S.C.
    § 7206(1)` 下的犯罪行为。


    AICPA 信函要求 IRS 对加密货币问题提出的某些问题提供必要的澄清说明，包括：


    1. 如果个人将虚拟货币从一个钱包转移到另一个钱包，且没有其他虚拟货币的交易，他们应该选择什么答案（这种情况被视为交换吗）？

    2. 纳税人应如何报告虚拟货币赠与？

    3. 如果纳税人拥有合伙企业的权益，但不知道合伙企业是否收到、出售、发送、交换或以其他方式获取了任何虚拟货币，他们应如何披露交易？或者该问题是否专门针对个人
    `Form 1040` 纳税人的所有权（而不考虑任何穿透实体活动）？

    4. 为参与或可能参与游戏的人申领子女或抚养人抵税的纳税人是否应该回答“是”？

    5. 某些礼品卡或公司在线账户何时可能构成新问题中的虚拟货币？

    6. “财务利益”一词是什么意思？

    7. 持有虚拟货币但在该期间未使用个人是否应该回答“是”？


    纳税表上类似于加密货币问题的问题是，要求纳税人披露对外国银行账户的所有权或控制权。在随 `Form 1040` 的 `Schedule B` 中，问题 7a
    问到：


    “在 2019 年期间的任何时候，您是否对位于国外的财务账户（如银行账户、证券账户或经纪账户）拥有财务利益或签字权限？”


    该外国账户问题与加密货币问题一样，并不直接询问应税收入，而是仅询问所有权和控制权。IRS 询问外国银行问题的权限源于《银行保密法》（`Bank Secrecy
    Act`），该法要求美国人在符合以下情况下必须提交《外国银行和金融账户报告》（`FBAR`）：


    1) 对国外的一个或多个账户（如银行账户、经纪账户和共同基金）拥有财务利益、签字权限或其他权限；以及

    2) 在日历年内的任何时候，所有外国财务账户的总价值超过 10,000 美元。


    需要填写 `FBAR` 的纳税人通常需要在 `Form 8938` 上报告其外国财务账户，并将其与 `Form 1040` 一起提交。


    在美国，纳税人有法律义务向 IRS 提供足够计算其税款的信息。然而，如果纳税人报告了所有加密货币交易，很难发现该加密货币问题的合法理由，除了提醒纳税人 IRS
    正在关注，并让他们在回答错误时面临罚款之外。


    从 IRS 的角度来看，其在税表中加入加密货币问题的可能逻辑可以在 IRS 总法律顾问 Michael Desmond 在 2019 年 10 月于布鲁金斯学院发表的题为《加密货币与税务管理》的主演讲找到。在那场演讲中，Desmond
    指出，估计 8%的美国人持有某种形式的加密货币，据此，IRS 应该收到约 1200 万份报告加密交易的税表。然而，他表示 IRS 收到的数量“远低于这一数字”，“我们[IRS]认为存在很大程度的不合规。”


    另一个相关的 IRS 披露问题是，在外国交易所持有加密货币的人员是否也需要在 `Form 8938` 上报告其持有情况。根据现有法律，尚不清楚外国加密交易所的账户是否被视为外国金融机构的账户。在第
    `1471(d)(5)` 条中，法典将“外国金融机构”定义为：

