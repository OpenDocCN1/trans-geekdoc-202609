    \ New York residents from using their services, and the crypto exchanges `BitFinex`,\
    \ `ShapeShift`, and `Kraken` publicly pulled their businesses out of New York\
    \ to avoid the `BitLicense` process. According to Jesse Powell, the CEO of `Kraken`,\
    \ `BitLicense` would have forced `Kraken` to “disclose all the information about\
    \ our entire global client base to the state of New York,” which was “potentially\
    \ illegal” under the privacy laws of other countries.[13](#section10.xhtml#ftn.48)\n\
    \nOne argument offered in favor of the heightened New York requirements is that\
    \ because New York serves as a global financial hub, it needs a more rigorous\
    \ regulatory regime to maintain the integrity of global financial markets. Martin\
    \ Weiss, the founder of `Weiss Cryptocurrency Ratings`, neatly sums up the New\
    \ York position regarding the `BitLicense` regime:\n\n> “Cryptocurrencies are,\
    \ in essence, borderless. Regulation, in order to catch up, would also have to\
    \ be borderless, crossing not only state boundaries but also national boundaries.\
    \ New York is in a unique situation because it regulates a major financial center,\
    \ the largest in the world. So as long as all those corporations want to remain\
    \ domiciled in New York, legislators in Albany do have a jurisdictional reach\
    \ that sticks. In most places in the world, if you try to regulate cryptocurrencies,\
    \ they’ll just move to another jurisdiction. That is bound to happen with most\
    \ of cryptocurrency institutions. But that’s not the case with New York.”[14](#section10.xhtml#ftn.49)\n\
    \nIn late 2019, `NYDFS` announced it intended to update its `BitLicense` regulations\
    \ early in 2020. As part of the announcement, `NYDFS` published and sought comments\
    \ on two proposed coin adoption or listing options:\n\n1.  a proposal to provide\
    \ a `NYDFS`-approved list of all coins that are allowed for virtual currency business\
    \ activities without the prior approval by the authority, and\n2.  a model framework\
    \ for listing coins, which would enable licensees to self-certify the listing\
    \ or adoption of new coins.\n\n## Securities Laws and the SEC\n\nOne of the most\
    \ contentious issues in crypto has been determining whether certain crypto are\
    \ securities, thus subject to federal securities regulation. The answer to that\
    \ question has far-reaching implications for the sale, tradability, and ultimately\
    \ the utility of crypto both in the US and abroad.\n\nCrypto designated as securities\
    \ are subject to myriad laws and regulations in the US, providing some measure\
    \ of safety to investors. However, a security designation also raises the costs\
    \ and risks associated with bringing that crypto to market, thereby implicitly\
    \ encouraging crypto companies to operate in more crypto-friendly jurisdictions.\
    \ If the US cannot strike a fair balance between investor protection and supporting\
    \ crypto businesses, it risks losing generations of crypto businesses to the rest\
    \ of the world.\n\n### Introduction to Securities Laws and Regulations\n\nFor\
    \ readers unfamiliar with securities regulation, the questions and answers below\
    \ provide some important definitions, as well as a brief history of US securities\
    \ laws.\n\n### What is a security?\n\nIn lay terms, a security is a tradeable\
    \ financial asset whose value is derived from an ownership right or a contractual\
    \ claim. Financial assets include stock and other equity instruments, debt instruments,\
    \ and bank deposits. In general, tangible assets like land, cars, commodities,\
    \ or racehorses are not considered financial assets; however, contractual claims\
    \ based on the value of any of those tangible assets would be considered financial\
    \ assets.\n\n### When were federal securities laws first passed?\n\nIn the US,\
    \ federal securities laws date back to the early 1930s. President Franklin D.\
    \ Roosevelt signed the `Securities Act of 1933` (`’33 Act` or `Securities Act`)\
    \ as part of the New Deal. The `’33 Act` governed issuances of securities and\
    \ was followed the next year by the `Securities Exchange Act of 1934` (`’34 Act`\
    \ or `Exchange Act`), which governed exchanges and trading of securities.\n\n\
    ### Why did Congress pass the securities laws?\n\nThe stock market crash of 1929.\
    \ Prior to the crash, securities markets were loosely regulated by individual\
    \ states, not the federal government. Those state markets boomed during the 1920s,\
    \ fueled by a new tech sector that introduced radio, movies, bulldozers, frozen\
    \ food, penicillin, and electric razors.\n\nBetween 1925 and 1929, that hot tech\
    \ sector fueled a 300 percent increase in overall stock prices. Unfortunately\
    \ for retail investors, however, much of the information available to them was\
    \ fraudulent. Scammers and criminals like Joseph P. Kennedy (whose son would later\
    \ become president) used nefarious schemes, such as pump-and-dumps and wash sales,\
    \ to mislead investors.[15](#section10.xhtml#ftn.50)\n\nAfter the crash, Congress\
    \ launched a number of investigations that revealed:\n\n*   widespread efforts\
    \ to manipulate securities markets, including payoffs to journalists and politicians;\n\
    *   rampant insider trading by corporate officers and directors;\n*   corrupt\
    \ practices by corporate insiders, including paying themselves exorbitant salaries\
    \ and giving themselves interest-free loans; and\n*   investment banks tipping\
    \ politicians and corporate executives about upcoming deals, allowing them to\
    \ invest before the public and profit once the securities started trading.\n"
  trans: "\n\n*   允许证券以代币化形式发行，使任何业务（而不仅仅是加密业务）都能直接在区块链上发行证券。\n*   允许设立特殊目的托管机构来服务区块链业务。\n\
    *   规定了基于控制的方法来完善数字资产的担保权益，并规定数字资产的受让在有偿地获得该资产两年后，在未收到不利索赔通知的情况下，该资产将不受任何担保权益的限制。\n\
    *   授权银行提供符合 `SEC` 合格托管人要求的数字资产托管服务。（等一下，更正为：`SEC` 的合格托管人要求。）\n*   为金融科技公司创建了一个监管安全空间（即金融科技沙盒）12\n\
    \n支持加强纽约要求的一个论点是，由于纽约是全球金融枢纽，它需要更严厉的监管制度来维护全球金融市场的完整性。`Weiss Cryptocurrency Ratings`\
    \ 的创始人 Martin Weiss 简练地总结了纽约对 `BitLicense` 制度的立场：\n\n> “加密货币本质上是无国界的。为了跟上，监管也必须是无国界的，不仅要跨越州界，还要跨越国界。纽约处于一个特殊的境地，因为它监管的是全球最大的主要金融中心。因此，只要这些公司都想留在纽约注册，奥尔巴尼的立法者确实拥有行之有效的管辖权。在世界大多数地方，如果你试图监管加密货币，它们只会移动到另一个管辖区。这对大多数加密机构都是必然发生的。但纽约并非如此。”14\n\
    \n2019 年底，`NYDFS` 宣布打算在 2020 年初更新其 `BitLicense` 规定。作为公告的一部分，`NYDFS` 发布并就两种拟议的币种采用或上市方案征求意见：\n\
    \n1.  提供一份由 `NYDFS` 批准的清单，允许在无需获得机构事先批准的情况下进行虚拟货币业务活动；以及\n2.  一个币种上市的模型框架，使许可证持有者能够对新币种的上市或采用进行自证。\n\
    \n## 证券法与 SEC\n\n加密货币领域最具争议的问题之一是确定某些加密货币是否属于证券，从而受联邦证券监管。该问题的答案对加密货币在美国及境外的销售、可交易性以及最终效用具有深远的影响。\n\
    \n被指定为证券的加密货币受美国无数法律法规的约束，为投资者提供了一定程度的安全保障。然而，证券身份也增加了将此类加密货币推向市场的成本和风险，从而隐含地鼓励加密货币公司在对加密更友好的管辖区运营。如果美国不能在保护投资者和支持加密货币业务之间取得公平平衡，将面临向世界其他地区失去数代加密业务的风险。\n\
    \n### 证券法简介\n\n对于不熟悉证券监管的读者，以下问答提供了一些重要的定义，以及美国证券法的简要历史。\n\n### 什么是证券？\n\n通俗地说，证券是一种可交易的金融资产，其价值源于所有权或合同索赔。金融资产包括股票和其他股权工具、债务工具和银行存款。通常，土地、汽车、商品或赛马等有形资产不被视为金融资产；但基于这些有形资产价值的合同索赔会被视为金融资产。\n\
    \n### 联邦证券法首次通过何时？\n\n在美国，联邦证券法可以追溯到 20 世纪 30 年代初。总统富兰克林·罗斯福作为新政的一部分签署了《1933 年证券法》（'33\
    \ Act` 或 `Securities Act`）。`'33 Act` 监管证券的发行，随后在一年通过了《1934 年证券交易法》（'34 Act` 或\
    \ `Exchange Act`），该法监管证券的交易所和交易。\n\n### 国会为何通过证券法？\n\n 1929 年的股市崩盘。在崩盘之前，证券市场由各州松散监管，而非联邦政府。那些州市场在\
    \ 20 世纪 20 年代蓬勃发展，得益于广播、电影、推土机、冷冻食品、青霉素和电动剃须刀的新科技部门。\n\n在 1925 年到 1929 年间，那个热门科技部门推动了整体股票价格上涨了\
    \ 300%。但对于零售投资者来说，他们获得的大部分信息都是虚假的。诈骗者和像约瑟夫·P·肯尼迪（他的儿子后来当了总统）这样的犯罪分子利用拉高抛售和对倒交易等非法手段误导投资者。15\n\
    \n崩盘后，国会发起了多项调查，揭露了：\n\n*   操纵证券市场的广泛行为，包括向记者和政客行贿；\n*   公司高管和董事猖獗的内幕交易；\n*  \
    \ 公司内部人员的腐败行为，包括给自己支付高额薪水和提供无息贷款；以及\n*   投资银行向政客和公司高通报即将进行的交易，让他们在公众之前进行投资，并在证券开始交易后获利。\n\
    \n"
