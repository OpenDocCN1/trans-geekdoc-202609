    *   在其网站或门户网站上招募购买、销售或购买其提供或展示的证券的要约；


    *   根据其网站或门户网站上展示或引用的证券销售或此类招募向员工、代理或其他人员支付报酬；


    *   持有、管理、拥有或以其他方式处理投资者资金或证券；或


    *   参与美国证券交易委员会（SEC）根据规则认为不恰当的活动。


    股权众筹平台与 `Kickstarter` 等捐赠型众筹平台有相似之处。然而，在股权众筹中，投资者购买的是公司股份而非产品或服务。


    | Reg D | ETF 如何运作 | ETF 股份代表 |

    | :--- | :--- | :--- |


    ### Reg D


    通过 `Reg D`，发行人可以通过出售受限证券募集不受限制的资金。作为 `Reg D` 发行的一部分，发行人向潜在投资者提供说明发行情况的文件以解释发行情况。三种基于规则的
    `Reg D` 发行方案是 `Rule 504`、`Rule 506(b)` 和 `Rule 506(c)`。它们在可募集资金金额、合格投资者类型以及允许的招募类型方面有所不同。下面简要概述每个规则的规定。


    ### Rule 504


    `Rule 504` 不优先于州法，允许发行人在任何 12 个月内募集 5,000,000 美元的受限证券。`Rule 504` 发行的投资者应被告知，除非发行人向
    `SEC` 注册出售交易，否则他们可能在一年内无法出售这些证券。在情况下，`Rule 504` 发行禁止通用招募，但 `Rule 504` 中的一项规定允许根据州法进行通用招募。


    ### Rule 506(b) 和 (c)


    根据 `Rules 506(b)` 和 `(c)`（两者均优先于州法），发行人可以通过出售受限证券募集不受限制的资金。其区别在于：


    在 `Rule 506(b)` 下，发行人：


    *   可以向无限数量的合格投资者出售受限证券，以及多达 35 名非合格投资者；


    *   不能使用通用招募或广告来营销受限证券；且


    *   必须随时准备回答潜在购买者的提问。


    相反，在 `Rule 506(c)` 下，发行人：


    *   只能向合格投资者出售受限证券；且


    *   仅可以向合格投资者对发行行为进行招募和通用广告。


    由于 `Rules 506(b)` 和 `(c)` 都要求发行人采取合理步骤验证投资者是否为合格投资者，这可能包括审查文件（如 `W-2s`、信用报告、纳税申报以及财务报表）。


    ### 一种新型金融产品：比特币 ETF


    除了股票等传统证券外，`SEC` 还监管向公众提供的集合投资产品的销售，包括交易型基金（`ETFs`）。`ETFs` 是由不同证券、指数、大宗商品、债券或其他资产的组合组成的投资基金。截至
    2019 年底，`ETFs` 的市值超过 3 万亿美元，前十大的 `ETFs` 持有的资产价值超过 9000 亿美元，每天交易量超过 6.5 亿股 `ETF`
    股份。下方的框解释了 `ETFs` 的运作方式。


    `ETF` 股份代表 `ETF` 所持资产池的份额权益。每股 `ETF` 股份代表 `ETF` 资产价值（`NAV`）的固定百分比，因此底层资产的价格上涨，价格也随之上涨。`ETFs`
    的结构为被动投资工具，与在 `NASDAQ` 等交易所交易的共同基金不同。由于 `ETFs` 没有活跃经理，它们的费用通常比共同基金小。`ETF` 股份的数量通过一种被称为“创建和回购”的机制进行监管。该创建和回购机制依赖于“授权参与者”的实体，这些实体负责负责收购和处置资产。该机制运作如下：


    创建：当 `ETF` 想创建新的 `ETF` 股份时，`ETF` 指授权参与者首先购买更多底层资产，然后将这些资产卖给 `ETF` 以获得新的 `ETF`
    股份。授权参与然后在开放市场上出售新的 `ETF` 股份。


    回购：当 `ETF` 想减少 `ETF` 股份数量时，`ETF` 指授权参与者首先在开放市场上购买 `ETF` 股份，然后将这些股份卖回给 `ETF` 以换取底层资产。授权参与者然后在开放市场上出售这些资产。


