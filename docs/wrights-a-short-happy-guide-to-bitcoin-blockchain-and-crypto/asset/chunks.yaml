    Twenty-five days after taking office, President Roosevelt urged Congress to pass
    a law that would “put the burden of telling the truth” on sellers of securities.
    Two months later, `''33 Act` was signed into law.


    Who administers the securities laws? Initially, `''33 Act` was administered by
    the Federal Trade Commission and was limited to regulating new issuances. However,
    it soon became clear to Congress and the Roosevelt administration that stronger
    laws were needed. The next year, Congress and the President strengthened the nation’s
    securities laws by:


    * enacting `''34 Act`, which broadened securities laws to cover not only issuances,
    but also trading;

    * creating the Securities and Exchange Commission (`SEC`), to serve as an independent
    agency to administer the securities.


    Federal securities regulations, then and now, have two primary goals:


    1) encourage companies to disclose accurate financial information to investors
    so investors can make informed decisions;

    2) establish laws and penalties for fraud and misrepresentation in markets. The
    SEC enforces the securities laws to ensure that companies offering securities
    for sale to the public provide accurate disclosures about the companies’ business,
    and the risks involved in investing in those securities. In addition, provides
    rules to ensure that those who sell and trade securities—brokers, dealers, and
    exchanges—treat investors fairly and honestly.


    One of the most powerful weapons in the `SEC`’s arsenal is `Section 10(b)` of
    `''34 Act`, which prohibits “any manipulative or deceptive device or contrivance
    in contravention of such rules and regulations as the Commission may prescribe
    as necessary or appropriate in the public interest or for the protection of investors.”
    The latter part of that quote gives the `SEC` the power to issue rules and regulations
    regarding the best way to enforce `Section 10(b)`, and `Rule 10b–5` makes it illegal
    to:


    a) employ any device, scheme, or artifice to defraud;

    b) make any untrue statement of a material fact or to omit a material fact necessary
    in order to make the statements made, in light of the circumstances under which
    they were made, misleading;

    c) engage in any act, practice, or course of business which operates or would
    operate as a fraud or deceit upon any person, in connection with the purchase
    or sale of any security.


    Under US law, the definition of a security (restated in its entirety below) is
    extremely long and intended to cover many different types of financial arrangements.
    For the purposes of this book and crypto, however, the critical terms are underlined:


    The term “security” means, (unless the context otherwise requires) any note, stock,
    treasury stock, security future, security-based swap, bond, debenture, evidence
    of indebtedness, certificate of interest or participation in any profit-sharing
    agreement, collateral-trust certificate, preorganization certificate or subscription,
    transferable share, investment contract, voting-trust certificate, certificate
    of deposit for a security, fractional undivided interest in oil, gas, or other
    mineral rights, any put, call, straddle, option, or privilege on any security,
    certificate of deposit, or group or index of securities (including any interest
    therein or based on the value thereof), or any put, call, straddle, option, or
    privilege entered into on a national securities exchange relating to foreign currency,
    or, in general, any interest or instrument commonly known as a “security”, or
    any certificate of interest or participation in, temporary or interim certificate
    for, receipt for, guarantee of, or warrant or right to subscribe to or purchase,
    any of the foregoing.


    An investment contract is a catch-all term that serves as the basis for the `SEC`’s
    exercise of jurisdiction over certain crypto. The term was largely undefined until
    the 1946 US Supreme Court case of `SEC v. W.J. Howey Co.` (`Howey`), which created
    a four-element test to determine whether a financial asset would be considered
    a security.


    In `Howey`, the Court defined an investment contract as:


    “a contract, transaction or scheme whereby a person invests his money in a common
    enterprise and is led to expect profits solely from the efforts of the promoter
    or a third party.”


    That language came to be known as the `Howey test`, and as it is currently understood,
    treats a transaction as an investment contract—thus as a security—whenever there
    is:


    1) an investment of money or other property;

    2) in a “common enterprise;”

    3) with an expectation of profits from the investment; and

    4) the expectation of profits is based mostly on the efforts of others.


    ![](Image_57.jpg)

    Graphic courtesy of Congressional Research Service


    Each element is discussed below.


    ### 1) Investment of Money


    This is the simplest element of the `Howey test`. The language in `Howey` required
    the investment to be made in “money,” but later court decisions expanded the definition
    to include other types of property. To evaluate this element, courts look to see
    whether investor gives up “some tangible and definable property” in return for
    a security.


    ### 2) Common Enterprise


    In `Howey`, the Court did not specify with whom an investor should have a “common”
    enterprise, akin to a shared common interest. In the years since `Howey`, the
    US Supreme Court has avoided answering that question. That left the job of determining
    what constituted a “common enterprise” to the lower courts. Those courts had to
    decide what type of common interest would satisfy the Supreme Court’s `Howey`.
    To date, no uniformity exists among courts, but three distinct commonality tests
    have emerged: horizontal, broad vertical, and narrow vertical, each explained
    below.


    #### Horizontal Commonality


    Horizontal commonality looks to the horizontal relationship among investors, analyzing
    whether the investors pool their investments and share in the profits and risks
    of the enterprise. This test is generally viewed as the most difficult to meet,
    because it requires multiple investors pooling their funds in a common venture
    and focuses on the relationship amongst investors. Some courts have also required
    the profits and losses derived from the investment to be shared pro-rata. The
    `First`, `Second`, `Third`, `Fourth`, `Sixth`, `Seventh`, `Ninth`, and `D.C.`
    Circuit Courts of Appeal (Circuits) accept horizontal commonality, and some of
    those courts have yet to rule on whether they will accept other types of commonality.


    #### Vertical Commonality


    Vertical commonality looks to the vertical relationship between investors and
    promoters, analyzing the extent to which investors are dependent on the promoter’s
    efforts or expertise. Courts differ on what is needed to show vertical commonality:


    ##### Broad Vertical Commonality


    Some courts require the investors’ fortunes to be related to the promoter’s efforts
    or expertise. In such cases, so long as the investors rely on the promoter’s efforts
    or expertise, there will be broad vertical commonality. This is generally regarded
    as the easiest to satisfy. Both the `Fifth` and `Eleventh` Circuits require broad
    vertical commonality.


    ##### Narrow Vertical Commonality

