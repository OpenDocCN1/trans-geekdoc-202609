- raw: "“Ethereum is a decentralized platform that runs smart contracts: applications\
    \ that run exactly as programmed without any possibility of downtime, censorship,\
    \ fraud or third-party interference,” and its coin, ether (ETH) “is a necessary\
    \ element—a fuel—for operating the distributed application platform Ethereum.\
    \ It is a form of payment made by the clients of the platform to the machines\
    \ executing the requested operations.”\n\nEthereum was designed to make building\
    \ smart contracts and ĐApps easier for developers and entrepreneurs. In 2017–18,\
    \ 91 percent of all initial coin offerings (ICOs), a form of smart contract, were\
    \ launched on Ethereum. At the end of 2019, Ethereum, EOS and Tron had over a\
    \ 98 percent share of total ĐApp transactions, with reported transaction volumes\
    \ of $12.8 billion, $6.1 billion, and $4.4 billion, respectively.\n\n46 \n\nAll\
    \ face a number of challengers claiming that their networks are “better” for ĐApps\
    \ and smart contracts, which generally means those networks are faster, more scalable,\
    \ and can handle more transactions. The scalability problem for Ethereum became\
    \ apparent in 2017 based on an Ethereum-based ĐApp game Cryptokitties.\n\nCryptokitties\n\
    \nCryptokitties is a virtual collectibles application that allows users to adopt,\
    \ raise, and trade virtual cats. Cryptokitties relies on a genetic algorithm to\
    \ spawn new kitties, taking into account parental selection, mutation of genes,\
    \ and the crossover of genes from each parent, so that each new kitty has a unique\
    \ genome. In the game, each cryptokitty has a 256-bit genome, which means there\
    \ are roughly four billion possible genetic variations for each kitty. Also, each\
    \ kitty is a one-of-a-kind digital asset, because each kitty is represented by\
    \ a token (called an ERC-721 token) that is nonfungible, meaning each token is\
    \ unique.\n\n![](Image_21.jpg)\n\nCredit: Cryptokitties.co.\n\n47 \n\nIn Cryptokitties,\
    \ smart contracts are used to perform the tasks of breeding, raising, feeding,\
    \ accessorizing, buying, and selling the kitties. Whenever a new task is performed\
    \ (such as breeding a new kitty), a new smart contract is executed that inherits\
    \ information from other related smart contracts (such as each parent’s genome).\
    \ Then, when other tasks need to be performed (such as raising the new kitty),\
    \ another new smart contract is executed based on the earlier smart contracts.\
    \ As a blockchain application, the entire smart contract history of each cryptokitty\
    \ is recorded and available for all to see.\n\nThe chart below shows some of the\
    \ information recorded and the smart contract programming language used:\n\n![What\
    \ Are Cryptokitties? Crash Course ](Image_22.jpg)\n\nSource: [https://blockgeeks.com/guides/cryptokitties/](https://blockgeeks.com/guides/cryptokitties/).\n\
    \nCryptokitties was the most popular application on Ethereum—so popular, in fact,\
    \ that it almost shut the network down.\n\nHow did Cryptokitties almost shut down\
    \ Ethereum?\n\nBecause breeding, raising, feeding, accessorizing, buying and selling\
    \ Cryptokitties are all separate smart contracts, at its peak, those activities\
    \ consumed upwards of 20 percent of Ethereum’s network traffic. As a result, transaction\
    \ processing times went up from a few seconds to ten minutes or more, and many\
    \ transactions were never executed.\n\n48 \n\nThe attraction of Cryptokitties\
    \ and Bitcoin are based on the same principle: scarcity. With Bitcoin, there will\
    \ only be 21 million BTC ever produced, and that scarcity drives demand. With\
    \ Cryptokitties, it is being able to acquire a unique, and thereby scarce, collectible\
    \ asset. What Cryptokitties developers figured out was that by creating an almost\
    \ infinite number of traits, the market would continually create demand for certain\
    \ traits, and users would get hooked on breeding, trading and collecting kitties\
    \ with those traits. The network problems with Cryptokitties highlighted one of\
    \ the major roadblocks to widespread blockchain adoption: scalability.\n\n49 \n\
    \nScalability\n\nFor a blockchain application to reach mainstream users, it has\
    \ to perform like mainstream applications. In a world with the internet and 5G,\
    \ that means fast. But most major blockchains, because of the scalability trilemma,\
    \ cannot execute transactions quickly without compromising security and decentralization.\
    \ For PoW blockchains, speed is determined by two primary factors: the time to\
    \ add a transaction to a block and the time to reach consensus.\n\nScalability\
    \ problems on PoW blockchains present a difficult technological challenge. Currently,\
    \ many blockchain nodes store the entire history of the blockchain and, in some\
    \ cases, also process transactions. The two most popular PoW blockchains, Bitcoin\
    \ and Ethereum, can process only between three-to-seven and seven-to-fifteen transactions\
    \ per second, respectively,[14](#section8.xhtml#ftn.14) far less than Visa’s twenty-four\
    \ thousand transactions per second. That inability to scale presents a challenge\
    \ to widespread adoption.\n\nOne factor that limits Bitcoin’s ability to process\
    \ transactions at scale (transactional throughput) is the amount of data in each\
    \ block. Currently, Bitcoin has a 1 MB block size limit.[15](#section8.xhtml#ftn.15)\
    \ One much debated Bitcoin scalability solution has been to increase the base\
    \ block size, allowing more transactions to be included in each block. In that\
    \ debate, the primary argument for increasing the block size was that doing so\
    \ would permit more data to be included in each block, allowing for greater transactional\
    \ throughput. The primary argument against increasing the block size was that\
    \ it would put the costs of scaling directly onto node operators, who would have\
    \ to upgrade their equipment to account for the computational and storage needs\
    \ of larger blocks. As more node operators opted out, 50because they were either\
    \ unable or unwilling to upgrade, the network would necessarily become more centralized.\n\
    \nThe first Bitcoin debate about increasing the block size played out in 2015.\
    \ The Bitcoin community ultimately decided not to increase the block size, which\
    \ led to a chain split in which the blockchain was forked into two separate chains:\
    \ the original Bitcoin blockchain and a new blockchain called Bitcoin Cash (BCH),\
    \ all discussed later in this chapter.\n\nSome scaling solutions have been, or\
    \ soon will be, implemented that allow only a subset of nodes to verify transactions.\
    \ To date, the most discussed of those solutions are SegWit and Lightning on Bitcoin,\
    \ and Sharding and Plasma on Ethereum.\n\nDifferent solutions have evolved on\
    \ each chain because, broadly speaking, each chain serves a different goal: Bitcoin’s\
    \ value proposition is its role as “digital gold,” a crypto that acts as primarily\
    \ as a store of value, but can also serve as a medium of exchange and unit of\
    \ account (as discussed in Part II). Ethereum’s value proposition is as the operating\
    \ system for a broad array of smart contracts and ĐApps, and potentially the main\
    \ operating system for the IoT.\n\nBitcoin Scaling—SegWit and Lightning\n\nSegWit\n\
    \n![C:\\\\Users\\\\delwr\\\\AppData\\\\Local\\\\Microsoft\\\\Windows\\\\INetCache\\\
    \\Content.MSO\\\\DF4C5A33.tmp](Image_23.jpg)SegWit was a BIP (BIP 141) intended\
    \ to mitigate Bitcoin block size limitation problems and address other technical\
    \ issues. When SegWit was activated in August 2017, it increased block capacity\
    \ and allowed more transactions to be processed using the same amount of data.\
    \ SegWit, short for segregated witnesses, accomplished this by separating two\
    \ key components of data recorded on the blockchain. SegWit also provided a “malleability\
    \ fix” to the network which made 51it more difficult to tamper with transaction\
    \ identities. Without that SegWit malleability fix, the Lightning Network, described\
    \ below, would not have been possible.\n\nHow does SegWit work?"
