- raw: "Those realities piqued my interest in bitcoin and blockchain technologies,\
    \ as did my educational and professional experiences. I earned a master’s degree\
    \ in public policy from Harvard’s Kennedy School, with a focus on financial policy,\
    \ and a law degree from the University of Chicago. The path I took to get those\
    \ degrees, however, was anything but traditional.\n\nI left law school after my\
    \ first year because I realized something was missing in my education. During\
    \ that first year, we often had to tackle legal issues that were, at their core,\
    \ financial and economic policy issues, areas I ignored as an undergraduate.\n\
    \nFortunately, one of my law school professors advised and encouraged me to take\
    \ the risk of leaving law school to fill the gaps (thanks Prof. Boldt). His advice\
    \ was spot on: the finance policy program at the Kennedy School was exactly what\
    \ I needed (fortunately, math was not one of the undergrad areas I ignored). I\
    \ finished law school at the University of Chicago because it focused on the economic\
    \ analysis of the law, and embarked on a career that involved finance, law, public\
    \ policy, and the intersection of all three: tax.\n\nDuring that career, I structured\
    \ derivatives (before they exacerbated the financial crisis), advised clients\
    \ as a business, tax and banking lawyer, represented my country at the US Department\
    \ of Justice as white-collar prosecutor (pursuing rich people who stole from poor\
    \ people), and over the last decade, served as a law professor. However, it was\
    \ not until I discovered bitcoin and blockchain that it all came together: finance,\
    \ economics, law, public policy and game theory, wrapped neatly in one package―crypto.\n\
