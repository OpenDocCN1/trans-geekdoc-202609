    # Off-Chain Governance Mechanisms


    Off-chain governance mirrors the governance structure of most private institutions.
    In an off-chain structure, individuals entrusted by the community come together
    and form a group responsible for blockchain’s governance and well-being. That
    group is tasked with fixing bugs and security vulnerabilities, adding features
    and improving scalability, representing the blockchain in public discussions,
    and maintaining the right balance of power among users, developers, miners, and
    other stakeholders.


    One benefit of off-chain governance is informational. So long as responsible and
    knowledgeable authorities are in charge, they will likely be in the best position
    to make informed decisions that serve the community’s interests. Another benefit
    involves the decrease in the likelihood of errors because humans can work to correct
    any code-based errors before they are implemented on the blockchain. However,
    any off-chain governance process involves a certain amount of centralization,
    which is contrary to the ethos of the blockchain.


    While many off-chain governance mechanisms exist, a useful model is Bitcoin’s
    Bitcoin Improvement Proposal (`BIP`), if for no other reason than it has existed
    longer than any other mechanism. The `BIP` process has been compared to the system
    of checks and balances in the US government, whereby the developers, like the
    US Congress, submit proposals (akin to drafting legislation), but others, including
    the core developers, miners, and node operators (akin, in no particular order,
    to the executive, the judiciary, and the people) play a role in deciding the merit
    and propriety of those proposals. Ultimately, however, it is the users (akin to
    voters) who are the final decision makers, because they can revolt, switch protocols,
    or sell their tokens if they are unhappy with any changes.


    ## Bitcoin Governance


    The `BIP` process generally begins with a developer submitting an improvement
    proposal. If deemed worthy, the proposal:

    1) becomes a draft;

    2) is sent to the Bitcoin core developers for review; and

    3) is added to the `GitHub` repository for `BIPs`, where it is discussed in the
    greater community.


    Once accepted as a draft, the proposal can be either deferred or withdrawn by
    the author, or rejected or accepted by the community of node operators. Once a
    `BIP` makes it to the “accepted” stage, it cannot be finalized unless miners show
    95 percent support for it. Lastly, once finalized, the node operators must upgrade
    to the new iteration of the protocol, which includes the `BIP` before the `BIP`
    is fully integrated into the Bitcoin blockchain. At the beginning of 2020, there
    had been approximately 322 `BIPs`. The chart below describes the process:


    `BIP` integration process (from Bitcoin Wiki)

    ![https://cdn-images.1.medium.com/max/800/1\*\_d-59mcIiy1QuwHb7RSBxg.png](Image_9.jpg)


    While Bitcoin miners, core developers, and node operators all have incentives
    to improve the network, those incentives are not often aligned:


    *   Miners are incentivized to earn block rewards whose value is tied to the price
    of `bitcoin`. Many view the miner’s incentive structure as Bitcoin’s most significant
    innovation, solving the Byzantine Generals’ Problem by paying the generals (here,
    miners) a salary (the block reward) so long as they act honestly, but garnishing
    that salary if they are caught trying to cheat.

    *   Bitcoin developers do not have a direct financial incentive in the price of
    `bitcoin`. Instead, as an open-source project, Bitcoin relies on developers who
    are philosophically aligned with its cypherpunk ethos, believe in the network,
    and work on it on their own free time. Although Bitcoin developers may not receive
    direct financial remuneration, they do earn experience and credentials that can
    be monetized, particularly with the demand for blockchain developers growing exponentially.

    *   Bitcoin node operators are also indirectly incentivized by increases in network
    utility and the price of `bitcoin`. The role of a node operators is to “harness
    the power of everyday computers to run an overlaying security protocol that polices
    the blockchain . As more nodes enter the system, the more secure the governance
    layer becomes, increasing efficiencies and fortifying trust.” There is no direct
    financial benefit to node operators—they do not receive any part of the miners’
    block rewards, nor do they receive the credit for improvements made by the core
    developers. Their only benefit is increasing the security of the network and,
    if they own `bitcoin`, protection for their investment. Without their participation,
    the network would come to a grinding halt.


    The different stakeholders’ incentives help explain why there have been relatively
    few `BIPs` implemented (of the 322 `BIPs`, only approximately 40 had been implemented
    as of January 2020), and many have been hotly contested.


    # On-Chain Governance Mechanisms


    On-chain governance is a formal system that determines changes to the protocol
    on the blockchain itself. Most on-chain voting mechanisms allocate decision-making
    to holders of native tokens on the blockchain. Those mechanisms are often based
    on a 1t1v mechanism or some derivation thereof, or a “stake-based governance”
    system whereby, in general, token holders must put some tokens at risk in order
    to have a role in governance. In either case, decisions that are approved are
    automatically encoded into the protocol.


    Tezos is one of the more established blockchains that uses on-chain governance.
    Its governance process is described briefly below:


    ## Tezos


    ![Tezos (XTZ) Review: What Makes Tezos Different? - Coindoo](Image_10.jpg)


    Tezos describes itself as a “platform to create smart contracts and build decentralized
    applications that cannot be censored or shut-down by third parties.” In Tezos,
    all stakeholders are permitted to participate in governance, and the protocol
    provides an election cycle that “provides a formal and systematic procedure for
    stakeholders to reach agreement on proposed protocol amendments.” Tezos also incorporates
    an explicit improvement mechanism into the blockchain, providing developers with
    a clear reward framework, and giving token holders the ability to evaluate the
    merits of a proposal and determine whether the proposal will improve the protocol.


    A number of problems with on-chain governance have been identified. A full-throated
    exploration of those problems is beyond the scope of this book, but some frequently
    discussed problems are as follows:


    *   Plutocracy and Collusion. A plutocracy is a government by the wealthy. In
    an on-chain system, a plutocracy indicates control by individuals or entities
    who hold a significant percentage of the tokens, which allows them to collude
    and act primarily in their own interest, to the detriment of those with fewer
    resources.

    *   Mutability. One of the most important features of blockchain technologies
    is the inability to change transactions recorded on what is supposed to be a permanent
    ledger. In an on-chain governance system, a vote can be taken to “undo” a transaction
    or series of transactions and roll back, or edit, the history of the ledger.

    *   Excluded Stakeholders. In many on-chain governance systems, non-token holders
    are excluded from governance. However, by excluding them, their participation
    in governance removes an important check to token holders’ balance of power, particularly
    in blockchain applications that do not require users to own tokens.


    One blockchain, Decred, uses both on-chain and off-chain governance, and its governance
    process is described briefly below:

