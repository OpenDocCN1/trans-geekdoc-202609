- raw: "Blockchain transactions include both signature data, which verifies the sender\
    \ has the funds to make a payment (called the “witness” information), as well\
    \ as transactional data, which details the contemplated transaction. SegWit segregates\
    \ that signature data (the witness information) from the transactional data. Because\
    \ signature data make up roughly 65 percent of the data in a typical transaction,\
