    ![Decred the autonomous digital currency - Africa Tech Summit Kigali](Image_11.jpg)


    Decred describes itself as “open, progressive, and self-funding cryptocurrency
    with a system of community-based governance integrated into its blockchain.” In
    Decred, holders of tokens can time-lock (stake) their tokens in exchange for tickets,
    which allow ticket holders to participate in governance in two on-chain and one
    off-chain governance mechanisms. The on-chain portion allows votes to (1) approve
    or reject, with a 75 percent approval rating, a proposed change to the consensus
    rules of the protocol, and (2) approve the work of the miners, which will allow
    the miners to earn their block reward.


    # Smart Contracts and Decentralized Applications


    ## Smart Contracts


    Smart contracts are blockchain applications that contain a set of rules by which
    parties can make transactional agreements.[9](#section8.xhtml#ftn.9) Once the
    conditions to those agreements are met, the terms of the agreement are automatically
    implemented either on a blockchain or through an off-chain application that relies
    on a blockchain.


    The goal of a smart contract is to set the terms of an agreement and the rules
    of its enforcement in computer code, thus eliminating the need for trusted intermediaries.
    A simple example of a non-blockchain smart contract is a vending machine: the
    rules of the transaction are programmed into the machine. Once the buyer puts
    the correct amount of money into the machine, the machine confirms the amount
    is correct and provides the goods.


    Although called smart contracts, most are not legal contracts. Rather, they are
    a set of conditional instructions setting forth rules for performance. Programmed
    correctly, smart contracts are self-verifying, self-executing, tamper resistant,
    and in most circumstances can lower transaction costs by reducing or eliminating
    the need for trusted intermediaries. Ethereum was the first blockchain designed
    specifically for smart contract development, to create:


    a platform that could sustain not only the money or medium of exchange use case,
    but also to add programmability to money, introducing conditional logic to the
    equation that would open up a world of possibilities with regards to decentralized
    financial 36applications and products, and additional decentralized applications.[10](#section8.xhtml#ftn.10)


    | ![C:\\Users\\delwr\\AppData\\Local\\Microsoft\\Windows\\INetCache\\Content.MSO\\361EC617.tmp](Image_12.jpg)Ethereum:
    A Smart Contract PlatformIn November 2013, Vitalik Buterin distributed the Ethereum
    white paper proposing Ethereum as an open-source, distributed computing platform
    upon which smart contracts, as well as other coins and applications, could be
    built and maintained. The fuel to run that platform was dubbed “ether,” and it
    is the cryptoasset needed to run programs and store data on the Ethereum system.
    Ethereum is supported by the non-profit Ethereum Foundation, headquartered in
    Zug, Switzerland, whose mission includes improving communications to the general
    public about the progress and development of the Ethereum platform. |

    | --- |


    The example below explains how a smart contract works.


    ### Blockchain smart contract: wager on the NCAA Championship


    ![Meaning Duke University logo and symbol | history and evolution](Image_13.jpg)![Amazon.com:
    Maryland Terps NCAA Auto Emblem: Automotive](Image_14.jpg)Assume it is the final
    game of a future (202X) NCAA basketball tournament, and Bibi and Chaun, who do
    not know each other, want to bet on the outcome. Each wants to bet $100 on the
    NCAA championship. Bibi wants to bet that the University of Maryland Terrapins
    (Terps) will win, and Chaun, for some reason (a move to NC?), wants to bet that
    Duke will win. They both believe if they win, their bet should pay double (two-to-one
    odds—an “even money” bet). If Maryland wins, Bibi would get $200 (the original
    $100 bet and an additional $100), and if Duke wins, Chaun would 37get $200. Because
    there are no ties in championship games, absent some catastrophic event, there
    can only be two results: the Terps win or Duke wins.


    Because Bibi and Chaun don’t know each other, they need a trusted intermediary
    to place their bets. That intermediary will serve two important functions: (1)
    let them know the odds of the bet (here even money) and (2) guarantee payment
    for a winning bet. For those services, the trusted intermediary will charge a
    small fee.


    In the real world, that trusted intermediary is a bookmaker (bookie), who broadcasts
    the odds to all potential bettors and tries to find bettors who take offsetting
    positions, eliminating the bookie’s risk. In our scenario, the bookie would inform
    both Bibi and Chaun that even though it is an even money bet, the bookie is going
    to charge them a small fee if they win. That fee in gambling parlance is called
    the “vig” (short for the Yiddish slang vigorish),[11](#section8.xhtml#ftn.11)
    and is generally around 10 percent of the amount of the bet.


    Once the game is over and the Terps have won (author’s prerogative), Bibi will
    want to get paid for her winning bet. The bookie will then give Bibi $190, equal
    to the $100 originally bet plus the $100 winnings minus the $10 vig (10 percent
    of $100).


    Here is where smart contracts can add value. Under the same terms, both Bibi and
    Chaun would have been better off placing their bets directly with each other through
    a smart contract that did not charge a 10 percent vig.


    That contract would be structured to:


    * broadcast that there is a smart contract for people who want to make bets on
    the NCAA championship;

    38* match bettors who take offsetting odds, like Bibi and Chaun;

    * provide a mechanism for those betters to enter into a smart contract;

    * collect the wagered funds from each better and hold those funds until the game
    is over; and

    * pay the winner all the funds held in the smart contract, minus a tiny (fraction
    of a penny) blockchain transaction cost.


    The smart contract performs all the tasks that the bookie did but at much lower
    cost. But that raises a practical question:


    How will the smart contract know who won?


    Like Morpheus and Neo in the Matrix, the smart contract needs to see the Oracle.


    ## Oracle


    An oracle is a program, device, or entity that provides external data to smart
    contracts to determine if conditions have (or not) been satisfied, without violating
    the integrity of the blockchain. In a smart contract, an oracle finds and verifies
    real-world occurrences, then sends that information to either a blockchain to
    be used by smart contracts or directly to a smart contract.


    ### Why should the oracle be trusted?


    Because blockchain systems are designed to be trustless, oracles introduce some
    level of trust, and therefore some level of risk, back into the system. However,
    an evolving set of oracles has evolved to reduce the vulnerabilities associated
    with using oracles through financial, reputation, and governance protocols. In
    addition, many smart contracts rely on multiple oracles to further reduce those
    vulnerabilities.


    39


    In an article in Hacker Noon,[12](#section8.xhtml#ftn.12) Jesus Rodrigues presented
    a basic taxonomy of oracles, described below:


    ![](Image_15.jpg)


    Human Oracles: Individuals or groups who access and enter external data into a
    blockchain.


    App Oracles: Software applications that capture data directly from the internet
    or through online application programming interfaces (APIs) and transmits the
    data to blockchain applications. Of the App Oracles, there are three basic types:


    1)Centralized Oracles that rely on information from APIs or other centralized
    applications;

    2)Federated Oracles that rely on a small number of nodes to validate external
    information to relate to the main data provider;

