    ## Centralization and Plutocracy


    The Golden Rule applies: those with the most gold make the rules, and often, those
    rules help them get richer. In `PoS`, the validators with the most tokens exercise
    the most power over the network, choosing which transactions to validate. That
    makes the system more centralized, less robust, and prone to decisions that favor
    those holding the most tokens.


    ### Nothing-at-Stake Problem


    In `PoS`, if the blockchain forks (more on forks later, but for now, think of
    it as a temporary split in the blockchain at a time where it is unclear which
    side of the split is the “right” one), there is no punishment for a validator
    to work on both sides of the split chain, even if one of those splits was a hack.
    Conceivably, that would allow validators to spend the same tokens on both sides
    of the split (double-spend) before the split is resolved. From an economic standpoint,
    the optimal strategy for validators would be to validate both sides of the fork
    so that they earn their fees no matter which side of the split ultimately wins.
    Nevertheless, although that strategy may be optimal for validators, it results
    in more instability for the network, because it can delay or complicate consensus,
    and may make it more costly to mount attacks.


    Current blockchains that use `PoS` include `Peercoin` and `Reddcoin`. `Ethereum`
    has stated that it plans to change to a `PoS` system in the near future. The chart
    below, courtesy of `Blockgeeks`, compares `PoW` and `PoS`.


    Source: `[https://blockgeeks.com/](https://blockgeeks.com/)`.


    ## Delegated proof of stake (DPoS)


    `DPoS`, unsurprisingly, is similar to `PoS`. However, in `DPoS`, instead of using
    tokens to stake, users vote with their tokens to determine which nodes (master
    nodes) will secure the network. The vote is continual and is based on a one-token,
    one-vote (`1t1v”) system, so the more tokens a user owns, the more voting power
    and influence she has over the network. Those elected, called delegates or witnesses,
    get paid for their work in running the master nodes and securing the network.


    `DPoS` users vote based on the reputation of the candidates seeking to be delegates.
    If at any time a delegate does not do a good job or gets a bad reputation, users
    can immediately “unelect” that delegate by withdrawing their votes. Because of
    the power of users to remove poorly performing delegates, the delegates are motivated
    to keep doing a good job, and that incentive structure is at the heart of `DPoS`.


    ### The most-cited benefits of `DPoS` are:


    - **Incentives**. Because users choose and retain delegates based on their work
    and reputation, the delegates are incentivized to do what is best for the users.

    - **Real-Time Voting**. Because the blockchain is transparent, users can immediately
    detect a delegate’s bad behavior and vote that delegate out of the system. The
    potential for the loss of income (and reputation) serves as a motivation.


    ### The most-cited costs of `DPoS` are:


    - **Centralization Risks**. Fewer people in charge means it is easier to coordinate
    activities among a certain group. An example of that risk occurred in June 2018,
    when `EOS`, a `DPoS` blockchain with only twenty-one delegates, froze the user
    accounts of seven `EOS` users suspected of carrying stolen funds. The decision
    to freeze those accounts was in violation of the rules set forth in `EOS`’s own
    constitution. That decision, whether justified or not, highlights the risk of
    giving a small group power over an entire blockchain.

    - **Voter Apathy**. `DPoS` relies on voters who are paying attention. If voters
    are apathetic, malicious actions by delegates may escape detection.

    - **Centralization and Plutocracy**. Because of the `1t1v` system, like in `PoS`,
    those with more tokens have more influence over the network. As a result, there
    is a greater chance they may reward and incentivize delegates to act on their
    behalf at the expense of others.


    Current blockchains that use `DPoS` include `BitShares`, `EOS`, `Steem`, and `Tezos`.


    ## Blockchain Governance


    Blockchain governance describes the process whereby participants agree on a set
    of parameters for changing the blockchain protocol, resolving disputes, sanctioning
    rule breakers, and enforcing penalties. For many public blockchains, the goals
    of its users and developers are not simply to make a profit but, like the internet
    generally, to create a public good. That creates governance issues.


    Most governance mechanisms, however, are ill-suited to deal with economic and
    social issues together, and often treat them as separate and distinct. A prime
    example of the failure of governance to deal with economic and social issues is
    the tragedy of the commons, a situation in which individual users, acting independently
    according to their own self-interest, behave contrary to the common good of all
    users by depleting or spoiling a shared resource through their collective actions.


    The 2008 financial crisis is a prime example of the failure of business governance
    mechanisms to consider social welfare. During the crisis, financial institutions,
    mortgage brokers, real estate agents and others, including some homeowners, engaged
    in transactions that allowed them to transfer wealth to themselves at the expense
    of others, including US taxpayers who were left with the bill. The governance
    mechanisms in place at the time should have worked to combat that type of moral
    hazard behavior, but in the end, they failed miserably.


    It is likely the 2008 financial crisis served as a motivating factor in the creation
    of `Bitcoin`. `Satoshi Nakamoto`, the developer (or developers) of `Bitcoin`,
    added only one message onto the first block of `Bitcoin` mined (the “genesis block”)
    which read:


    ```

    The Times 03/Jan/2009 Chancellor on brink of second bailout for banks

    ```


    Many view that message as evidence that `Nakamoto`’s efforts were motivated, or
    at least influenced, by the financial crisis.


    Like in society generally, the choices blockchain stakeholders make regarding
    economic and social issues are often based on their idiosyncratic incentives.
    While all stakeholders generally want governance to increase network utility and
    generate higher token values, different stakeholder groups often want governance
    to accomplish additional things benefitting them, including:


    - users, who want governance to give them more control (often including privacy)
    over their financial transactions and wealth;

    - node operators, who want governance to ensure the costs of running nodes, in
    terms of time and equipment, is minimal;

    - developers, who want governance to support financial, social and professional
    recognition for their work, as well as to give them control over the direction
    of the blockchain; and

    - miners and other validators, who want to governance allow them to minimize their
    costs and maximize their fees or rewards.


    A perfect governance model to satisfy those disparate goals does not exist. For
    example, although most would agree that network security and scalability are goals
    of all public blockchains, precisely defining those terms is difficult and involves
    trade-offs for different stakeholders. Thus, proposed changes require human inputs
    and a means for the stakeholders to determine the “best” solutions. The means
    of reaching those solutions is governance.


    So, how are blockchains governed?


    Blockchain governance is divided into two camps:


    - Off-chain, in which decision-making takes place first on a social level and
    is later encoded into the protocol by developers; and

    - On-chain, in which decision-making rules are encoded into the protocol and any
    decision that is approved is automatically incorporated into the protocol.


    Each shares the same goal—to create a “better” blockchain—but go about it in different
    ways.

    '
