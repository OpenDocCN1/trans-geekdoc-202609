    ## 前言


    ### 为什么我们需要加密货币？


    对于寻找该问题答案的读者，我找到最好的答案是人权基金会首席战略官 Alex Gladstein 写的文章《没有比特币的世界》（A World Without
    Bitcoin）。该文章出现在 2020 年 2 月 11 日的《Unchained》播客节目，由 Laura Shin 主持，可在 [`www.unchainedpodcast.com/alex-gladstein-on-a-world-without-bitcoin/`](http://www.unchainedpodcast.com/alex-gladstein-on-a-world-without-bitcoin/)
    获取并阅读转录。


    这本书并不是为了回答那个问题。相反，它旨在为读者提供三点：


    1) 区块链概述：它们如何运作、如何控制，以及它们面临的技术和政策挑战；

    2) 对区块链技术和加密资产（`crypto`）价值主张的解释；

    3) 对加密加密货币法律分析。


    尽管围绕区块链有很多炒作，但许多技术仍处于起步阶段。尽管如此，因为区块链作为信任机器，可以限制对第三方中介的需求和成本，该技术的可能用途是无限的。因此，创业者、律师、政策制定者和监管人员理解这项技术及其应用至关重要。这本书提供了一个入口。


    *有瑕疵的钻石胜过无瑕疵的石子。*

    —孔子


    这是一个快速发展的技术和法律领域，这本书的目标是提供一个介绍和概述。为此，在尝试以易于理解的方式解释大部分技术领域时，通常需要简化概念以使读者理解。这在在“过于简单”和“过于详尽”之间划定界限带来了挑战。正如生活中的大多数事情一样，“完美是完善的敌人”，我希望这本书能取得恰当的平衡。


    Del Wright Jr.

    2020 年 4 月 12 日


    ## 致谢


    首先，我要感谢 Cheryl 担任主编、逻辑批判者、任务执行者和首席激励者。正如我做的大部分工作一样，没有你我无法完成这一切。


    接下来，我要感谢 Nancy 推动了这一切。我还要感谢以下人士，无论是有意还是无意，让项目最终完成：


    学生们

    Ryan, Jazmine, Austin, Dan, Madeline, Nate, 和 Kristen


