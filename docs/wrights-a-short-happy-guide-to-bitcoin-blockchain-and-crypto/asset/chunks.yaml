    -   虚拟资产服务提供商（VASPs）公司或个人应在其设立所在地获得许可或注册；

    -   各国采取法律或监管措施，防止犯罪分子拥有或控制 VASPs；

    -   VASPs 不得自律；

    -   VASPs 应接受反洗钱/反恐怖主义（AML/CTF）的监管、监督和监控；

    -   VASPs 向相关部门提供身份信息，并跟踪超过 1,000 美元（或 1,000 欧元）的加密转账交易对手，并在要求时：

    -   向适当部门共享这些信息，且

    -   如果交易存疑，应赋予监管机构采取适当行动的权力，包括禁止转账或冻结资产；

    以及

    -   赋予监管机构检查、强制提交文件和对 VASPs 进行制裁的权力，这些制裁应包括行政、民事和/刑事处罚。


    ## 政府必须遵守 FATF 建议吗？


    FATF 建议并非法律。然而，它们确实充当某种“软法”，即作用类似于法律的规则，因为不合规的后果可能是高昂的。软法类似于提醒人们不要碰热炉灶。


    尽管 FATF 建议不具备条约或国际习惯法的法律地位或执行力，但成员国政府仍有动力遵守它们，因为不合规的后果是巨大的。未能遵守 FATF 建议的国家可能会被列入不合作国家名单，从而引发
    FATF 所称的“特别关注”。


    FATF 的“特别关注”包括对不合作国国际业务交易的密切审查、对不合作国债务可能进行下级的风险，以及限制不合作国从 128 国际货币基金组织或世界银行（两者均为
    FATF 观察员）获得援助的能力。在某些情况下，不合作国可能被禁止参与 SWIFT 等全球金融安排和其他形式的全球清算与结算。如果违规行为足够严重，这种“特别关注”还可能包括经济制裁。


    FATF 建议代表了一种多边监管方法，与大多数此类方法一样，成员国在实际执行这些方面具有很大的灵活性。


    > “金融中心越重要，就越不可能将其监管机制的控制权交给像 FATF 这样的国际组织。”

    > —Jake Chervinsky，Compound Finance 总法律顾问


    一个国家的灵活性程度与其经济实力和重要性强相关，这并不意外。这在美国尤为如此，因为最负责执行 FATF 建议的美国机构 `FinCEN` 通常只采纳了它认同的
    FATF 建议，而忽略了其他建议。


    ## 美国法律与法规


    本节及后续章节探讨了美国对涉及加密货币交易的监管，包括：


    *   货币法（Money Law）：针对金融机构、汇款商和金融服务企业的州和联邦规则；

    *   金融产品法：证券交易委员会（`SEC`）和大期货交易委员会（`CFTC`）关于加密货币的规则；以及

    *   129

    *   税法：由 `IRS` 发布的关于加密货币征税的规则。


    尽管美国对加密货币的监管普遍采取较为宽松的态度，但监管的不确定性使美国与其他国家的竞争中处于劣势。这种不确定性的存在是因为，与大多数国家不同，美国有多个监管机构主张对加密货币拥有管辖权。（注：已删除重复内容）


    ### 联邦监管


    在美国，以下机构对加密货币主张了管辖权：


    *   商品期货交易委员会（`CFTC`）

    *   联邦存款保险公司（`FDIC`）

    *   联邦储备委员会（`Fed`）

    *   货币部监员办公室（`OCC`）

    *   证券交易委员会（`SEC`）

    *   财政部（`Treasury`）

    *   外国资产控制办公室（`OFAC`）

    *   金融犯罪执法网络（`FinCEN`）

    *   美国国税务局（`IRS`）

    *   金融研究办公室（`OFR`）


    在这些联邦监管机构中，对加密货币的定性缺乏一致性。例如：


    *   `SEC` 将加密货币视为证券；

    *   `CFTC` 将加密货币视为商品；

    *   `FinCEN` 将加密货币视为货币；

    *   `IRS` 将加密货币视为财产；

    *   `OFAC` 将加密货币视为虚拟货币。


    ## 货币法


    任何关于加密货币监管的讨论都从《银行秘密法》（`BSA`）开始。`BSA` 通过于 1970 年，并在 2001 年通过《爱国者法案》进行修订，是最全面的反洗钱/反恐怖主义法律。`BSA`
    授权财政部长发布法规，要求银行和其他金融机构采取若干预防措施以防止金融犯罪，包括建立反洗钱计划以及提交被认为在刑事、税务和监管调查，以及某些情报和反恐事务中具有高度实用价值的报告。


    `FinCEN` 是财政部下属的一个局级，其使命是保护金融系统免受非法滥用，打击洗钱，并通过金融情报促进国家安全。`FinCEN` 也是执行 `BSA` 的主要监管机构。财政部长已向
    `FinCEN` 主管授予实施、管理和执行 `BSA` 及相关法规合规性的权力。


    在一个标题包含“短小快乐”字样的书中，无法用简单的方法详尽解释对加密货币的处理。然而，书的其余部分提供了联邦和州级监管机构如何处理加密货币的案例和分析，并为读者提供了进一步调查的路线图。本书以对旨在提供更多清晰度的立法提案进行概述结束。


    '
