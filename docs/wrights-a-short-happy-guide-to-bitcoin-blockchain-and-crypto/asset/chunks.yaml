    Identifying the value proposition for all types of crypto projects is obviously
    beyond the scope of this or any book. However, to date the most promising use
    case for crypto is as a new form of money. This chapter examines that value proposition
    by analyzing bitcoin and stablecoins, the most used and valuable money-type crypto
    projects.


    To explain the value proposition for crypto as money, it is important to first
    provide:


    1) a brief history of money as a form of technology;

    2) a description of the historical use of gold both as a form of money and as
    collateral for money; and

    3) an examination of governments’ role in the regulation of money over the last
    century.


    That background lays the foundation for understanding crypto’s value proposition.


    Money is one of civilization’s earliest and most important technological inventions,
    and serves three purposes: a medium of exchange, a store of value, and a unit
    of account.


    ## Medium of Exchange


    ![https://grayscale.co/wp-content/uploads/2019/04/figure1-2-288x300.jpg](Image_31.jpg)

    Money eliminates the need for transactions based solely on the barter system,
    which requires a coincidence of wants between parties. The figures and examples
    below explain how money improves and simplifies transactions.


    ![](Image_32.jpg)![](Image_33.jpg)


    Figure 1 above shows a pure barter system with four participants: a wheat farmer,
    a livestock producer, a silk trader, and a spice trader, each of whom wants to
    sell items in a marketplace. This barter system is inefficient because the wants
    of the participants may not coincide. The livestock producer may be willing to
    trade for wheat to feed the livestock, but the wheat farmer may not have a direct,
    immediate use for livestock. Moreover, the wheat farmer may not know or appreciate
    the true value of livestock, due to insufficient market knowledge or limited access
    to trading partners. As a result, the wheat farmer and livestock producer may
    be unwilling to trade, though both would be better off if they could obtain the
    true value of the respective assets.


    Money solves the problem.


    ![](Image_34.jpg)![https://grayscale.co/wp-content/uploads/2019/04/figure2-2-294x300.jpg](Image_35.jpg)

    ![](Image_36.jpg)


    In Figure 2 above, the participants use money, in this case gold, to trade. Figure
    2 demonstrates how trading with a form of money like gold improves upon the barter
    system by eliminating transactional inefficiencies. With the introduction of money,
    the wheat farmer will sell wheat to the livestock producer for gold and can use
    that gold to purchase anything she wants, including silk and spices. All participants
    are better off with the introduction of money, because money allows them to easily
    convert their goods into a universally accepted medium of exchange.


    ## Store of Value


    In order to serve as a medium of exchange, money must either provide a stable
    value over time or be expected to increase in value. A money’s stability allows
    buyers and sellers to estimate, at the time of their transaction and into the
    near future, how much value is at stake. The more stable a money’s value, the
    more willing users are to use it as a medium of exchange. Stable money provides
    security regarding the quantum of value that is, or will be, exchanged in transactions.
    Conversely, money expected to increase in value over time is less likely to be
    used as a medium of exchange, because people will tend to hold on to it to capture
    its expected future value.


    ## Unit of Account


    As a medium of exchange and store of value, money provides a standardized measure
    for the value of the goods and services exchanged. In the Figure 2 above, gold
    bars served as the unit of account for wheat and silk and could also serve the
    same role for spices and livestock as well. As a unit of account, money provides
    users with information about the relative values of different assets using a consistent
    and widely accepted standard.


    ## What makes “good” money?


    While anything considered money will act as a medium of exchange, a store of value,
    and a unit of account, those bare-minimum requirements do not address the effectiveness
    of a particular type of money. To be effective, a form of money generally must
    be:


    - **Scarce**: supply needs to be limited in some way so that it maintains its
    value.

    - **Verifiable**: there must be a means to test the money to ensure it is legitimate.

    - **Durable**: money should not waste away, decay, or be easily destroyed.

    - **Portable**: money should be easy to carry or transport.

    - **Divisible**: money should be divisible into different-sized units.

    - **Fungible**: each specific unit of money (for example, US dollar bills) should
    be interchangeable with other units of the same type.

    - **Recognizable**: money should be easily identified and verified.


    In addition to the above, “good” money should be resistant to counterfeiting and
    other schemes that could devalue it, like the one described in the box below.


    | Money Schemes using Coins |

    | The first coins were minted using precious metals such as gold and silver, and
    were designed to have a uniform weight. However, soon after their introduction,
    people began scraping off small pieces from the edges of coins and melting those
    pieces together to create new counterfeit coins. As more people scraped the edges,
    the coins got smaller and less valuable. To stop the practice, mints around the
    world began adding perpendicular grooves called reeds along the edges of coins.
    The reeds made it easy for anyone looking at the coin to see if the edges had
    been shaved off. The practice of adding reeds to coins continues today, as both
    the US quarter and dime have reeded edges. |


    Types of money that do not meet all those criteria may nevertheless be valuable.
    For example, gold serves all three of the money purposes, but is often difficult
    to transport, not easily divisible (without melting it), and hard to verify to
    the untrained eye. Despite those shortcomings, gold has served the world’s primary
    forms of money for thousands of years.


    ## Gold as Money


    Gold has been used for centuries both as money and as collateral backing other
    forms of money. Gold’s value is derived from its unique physical chemical characteristics
    and its relative scarcity.


    As an element, gold does not decay, serves as a good conductor of electricity,
    resists corrosion and oxidation, and as a metal with a relatively low melting
    point, can be easily shaped into various forms. In addition to those physical
    characteristics, the annual production of gold is small relative to its global
    supply. Those properties have driven the demand for gold throughout history, and
    led nations and individuals to commit unspeakable acts of cruelty to acquire it.


    ## Stock-to-Flow Ratio


    There are roughly 190,000 tons of gold in existence above ground today. However,
    throughout history, on average only about 1-to-3 percent of the then-existing
    supply of gold is mined per year. That low production coupled with strong demand
    explains a significant portion of gold’s value proposition.


    As an economic measure, gold’s annual production relative to its existing supply
    is reflected by a metric called a stock-to-flow ratio, defined as the amount of
    an asset held in reserves (stock), divided by the amount produced every year (flow).
    Higher stock-to-flow ratios indicate that the total supply of an asset will not
    increase significantly year to year, thus increases in supply will be small relative
    to the total stock of the asset.


    Gold has the highest stock-to-flow of any commodity asset. Current estimates indicate
    that gold has a stock-to-flow ratio of about 62, which represents the total amount
    of above-ground gold (roughly 190,000 tons), divided by the amount of gold produced
    annually (estimated to be a little over 3,000 tons). In contrast, silver has a
    stock-to-flow ratio of roughly 22, platinum has a stock-to-flow ratio of 0.4,
    and palladium has a stock-to-flow ratio of 1.1.

