    In 2014, Venezuela’s inflation rate was 69 percent, then the highest in the world.
    By 2016, the inflation rate was between 800 percent and 4,000 percent.


    In 2018, one of Maduro’s responses to Venezuela’s hyperinflation was to institute
    a 1,000-to-1 revaluation of the currency, changing the country’s official currency
    from the “Bolívar fuerte” (the old bolívar) to the “Bolívar soberano,” (the new
    bolívar), and making 1,000 units of the old Bolívar fuerte equal to 1 unit of
    the new Bolívar soberano. In US dollar terms, that would be equivalent to the
    US government forcing all citizens to turn over all their hundred-dollar bills
    and exchange them for newly-minted dimes.


    The 2018 currency revaluation was a disaster. By May 2019, Venezuela’s annual
    rate of inflation was over 815,000 percent (that is not a typo). Venezuela’s economic
    crisis prompted over three million people to leave the country for neighboring
    Colombia and elsewhere. Many of those remaining stopped accepting and using the
    new bolívar, and instead sought to exchange their bolívars into US dollars, a
    far better store of value.


    One of Venezuela’s long-standing fiscal policies also exacerbated the crisis.
    Since 2003, Venezuela has had strict currency controls, limiting citizens’ ability
    to exchange bolívars into other currencies. The government also set an official
    exchange rate that overvalued the bolívar compared to the dollar. The market response
    to those currency controls and exchange rate policies was the growth of an illegal
    market for dollars, as Venezuelans sought to buy dollars from the government and
    sell them in the illegal market for a profit.


    That policy did little-to-nothing to help alleviate the effects of hyperinflation,
    but did create a new industry that has cost the government billions: currency
    tourism (see box below).


    ### Currency Tourists and Favored Exchange Rates


    | : --- |

    | Although there were strict limits on Venezuelan citizens’ ability to exchange
    bolívars into dollars, there was an exception for citizens traveling internationally
    who had purchased a plane ticket. Those citizens could exchange bolívars for dollars
    at the official rate of 6.3 bolívars for $1, with a limit of $3,000. However,
    the (illegal) market rate at the time was 45 bolívars for $1. What many citizens
    did was exchange 18,900 bolívars for $3,000 (the limit) with the government, then
    turn around and sell those $3,000 for 135,000 bolívars in the illegal market,
    a 714 percent return. Those citizens often never actually traveled overseas and
    viewed the plane ticket as a cost of the transaction. The Venezuelan government
    also gave favored individuals and industries access to preferred exchange rates.
    At one point in 2018, those in the favored group could exchange bolívars for dollars
    at a 10-to-1 rate, at a time when the official government rate was 3,345 to 1,
    and the illegal market rate was as high as 3.6 million to 1 (pre-revaluation).
    Former Venezuelan government officials and economists estimate that between $41
    billion and $300 billion in state revenues were lost due to these types of foreign
    exchange machinations. |


    ### What does this have to do with Bitcoin?


    A lot. Understanding government’s role in the value of money is critical to explaining
    the attraction of bitcoin, a largely government-proof asset. Bitcoin’s value is
    based, in large part, on (i) its similarities and improvements to gold as a form
    of money, and (ii) the inability of governments to control or manipulate it as
    part of their fiscal or monetary policies.


    ### Bitcoin: Digital Gold


    While gold has historically played a central role as a transactional currency,
    the world we live in today is digital. As the first widely-available native digital
    currency, bitcoin has the potential to displace, or at least compete with, gold
    as a store of value in a digital world. That’s because in a digital global economy,
    bitcoin outperforms gold on many of the qualities that has made gold valuable:


    - **Scarcity**. Like gold, bitcoins are scarce assets. Hard coded in the `Bitcoin
    protocol` is a strict 21 million supply, and no counterfeit bitcoins have ever
    been produced in its ten-plus year history. At the end of 2019, approximately
    18.1 million of those 21 million bitcoins have been issued, and all 21 million
    will be issued by 2040. Current estimates are that between 2.8 and 3.8 million
    or so have been lost by users, meaning those users somehow lost the `private keys`
    to their bitcoins. For example, CNBC reported that James Howells, an English IT
    worker, threw away a hard drive containing 7,500 bitcoins in a local landfill.


    - **Verifiability**. Bitcoins are unique cryptographic assets that are directly
    verifiable on the `Bitcoin blockchain`, in real time, from anywhere in the world.
    Unlike gold, it is not necessary to have bitcoins in any particular place to determine
    their authenticity. All that is needed is an internet connection.


    - **Durability**. Bitcoins reside on an open-source network maintained by a global
    base of users. The open-source nature of the `Bitcoin protocol` has made the network
    incredibly durable to threats, eliminating single points of failure and allowing
    for continuous adaptation and improvement.


    - **Portability**. As native digital asses, bitcoins exist in cyberspace. With
    the simplest of mobile devices, the 4.7 billion global mobile phone users with
    an internet connection can already carry, send, spend, and receive bitcoins. In
    addition, technological developments may eliminate the need for internet connection.
    For example, `Blockstream` and `goTenna` are developing technologies to complete
    bitcoin transactions via geosynchronous satellites and mesh networks, which will
    allow phones.


    - **Divisibility**. All bitcoins are divisible into one hundred million units,
    called `satoshis`. Each `satoshi` (sometimes shortened to `sat` or `sats`) is
    worth `0.00000001 BTC`. This allows Bitcoin to facilitate transactions of any
    size, as 1 satoshi is equal to $0.0001, or one hundredth of a penny (at the January
    2020 price of $10,000). The divisibility of `sats` makes it easier for individuals
    to collect them into a more sizable position, referred to generally as “stacking
    sats.”


    - **Fungibility**. All bitcoins are, for the most part, interchangeable. The “for
    the most part” qualifier is included because chain analytics (discussed below)
    and recent regulations (discussed in Part III) make it possible to trace certain
    transactions to users. With the ability to track transactions and users, it may
    be possible identify a certain individual’s holdings, and if that individual has
    run afoul of a government, that government may identify that user’s bitcoin as
    “tainted,” and penalize individuals who accept tainted coins.


    - **Recognizable**. Despite its short history, the Bitcoin network has achieved
    global awareness and bitcoin transactions are possible in the majority of countries
    around the world.


    ### Stock-to-flow ratios


    A strong driver of bitcoin’s value is its stock-to-flow ratio. As noted earlier,
    gold has a stock-to-flow ratio around 62. At the end of 2019, bitcoin’s stock-to-flow
    ratio was around 27.5, calculated by dividing the 18.1 million bitcoins in circulation
    (ignoring lost coins) by the 657,000 Bitcoins mined annually (12.5 bitcoins per
    block × 144 blocks per day × 365 days).


    The market value of those bitcoins, at a price of $10,000 per BTC (the January
    2020 price), is about $181 billion, or around 2.3 percent of the $7.8 trillion
    value of gold. Although a small percentage, bitcoin gained that value in just
    over ten years, while gold has accumulated its value over at least six thousand
    years.

