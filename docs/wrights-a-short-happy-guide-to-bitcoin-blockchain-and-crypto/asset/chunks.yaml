    Fractional reserve banking is a banking practice in which a bank keeps only a
    fraction of its deposits in reserve and available for immediate withdrawal. The
    remaining deposits are lent out to borrowers. In simple terms, it is the ability
    to lend out most deposits and hold back only small percentage, in the hope that
    most depositors will not ask for their money at the same time. The funds lent
    out earn interest and allow financial institutions to make a profit. The box below,
    citing the 1946 Frank Capra film `It’s a Wonderful Life`, provides a practical
    example of fractional reserve banking.


    | It’s a Wonderful Life explains fractional reserve banking![Related image](Image_56.jpg)
    | In one of the movie’s more famous scenes, George Bailey (played by Jimmy Stewart)
    confronts a mob of customers demanding their deposits back from his Bailey Building
    & Loan community bank, based on fictional situation remarkably similar to the
    Great Depression. In the film, Bailey tells the mob that he cannot give them their
    money immediately because their deposits have been invested in other assets like
    their and their neighbors’ homes and local businesses. As noted by the Atlantic:“the
    movie’s plot also touches on some still-relevant financial topics, including the
    nature of banking, the philosophical calculus behind issuing loans, and the way
    American families’ financial fates are intertwined.”—Bourree Lam And Gillian B.
    White, The Morality of Banking in It’s a Wonderful Life, The Atlantic (Dec. 23,
    2016). |

    | --- |


    All banks use fractional reserve banking to earn profits. However, to ensure that
    banks remain solvent, federal banking regulations mandate a required ratio, typically
    around ten percent of deposits, that must be held in reserve. That ten percent
    reserve requirement represents a hard limit to the amount of money banks can lend
    against their deposits.


    For non-bank crypto intermediaries, if they had super negotiability, there would
    be no legal (as opposed to prudential) limit on their ability to borrow or lend
    a customer’s crypto in order to earn profits. The practice of an intermediary
    using a customer’s assets to earn profits, often through borrowing or lending
    those assets, is called rehypothecation.


    Financial intermediaries sometimes rehypothecate more assets than they hold, leading
    to what is called an uncovered position—one not fully backed by an actual asset.
    Examples 1 and 2 below demonstrate risks of rehypothecation and uncovered positions
    in crypto.


    ### Example 1


    Assume a crypto financial intermediary (`Hazard Co.`) holds 100 of `Bibi’s` bitcoins
    (and no other bitcoin holdings), but decides to lend out 140 bitcoins to `Chaun`.
    At that point, `Hazard Co.` would have a 40-bitcoin uncovered position. This example
    raises two obvious questions:


    1) How can `Hazard Co.` lend out more crypto than it holds?


    Good question. The reason is because the 140 bitcoins often never actually have
    to leave `Hazard Co.`. Think of the average loan: when the loan is made, all that
    happens is the bank makes a bookkeeping entry that states the borrower has additional
    funds. But the funds don’t necessarily leave the bank. Also, if the borrower uses
    the funds to pay another of the bank’s customers, all that happens is another
    bookkeeping entry, from one bank customer to another.


    2) Why would `Hazard Co.` want to create an uncovered position?


    Speculation. In our example, `Hazard Co.` would earn interest from lending out
    140 bitcoins to `Chaun`, even though it had only `Bibi’s` 100 bitcoins. So long
    as all 140 bitcoins do not leave `Hazard Co.`, this house of cards will stand.


    Although creating an uncovered position is risky, it can be very profitable, because
    it allows financial institutions to earn interest on assets they do not own. The
    risk, however, falls onto customers who may not be able to get their assets back
    if a financial institution’s risks do not pay off. Taking risks and passing those
    risks onto others is called “moral hazard.” Both rehypothecation and moral hazard
    were contributing factors to the 2008 financial crisis.


    As if the risks of rehypothecation and uncovered positions were not significant
    enough, the reality is that those risks are more pronounced with crypto because
    of potential for forks, as described in Example 2 below:


    ### Example 2


    Using the facts of Example 1, assume bitcoin forked into two new cryptos (`NewBitcoin`
    and `Crypto2`) during the time it was lent out. Because owners of the pre-forked
    bitcoin will become owners of both `NewBitcoin` and `Crypto2`, `Hazard Co.` now
    has doubled its uncovered position. Before the fork, it had a 40-bitcoin uncovered
    position. After the fork, it would have a 40-NewBitcoin uncovered position and
    a 40-Crypto2 uncovered position, neither of which `Hazard Co.` would own. The
    fork raises two additional problems for `Hazard Co.`:


    1) Exposure: if both `NewBitcoin` and `Crypto2` are as valuable as the pre-forked
    crypto (for example, the pre-forked bitcoin was worth $10,000, and immediately
    after the fork, both `NewBitcoin` and `Crypto2` are each worth $10,000), `Hazard
    Co.`’s uncovered exposure would double.


    2) Delivery: after forks, as was the case in the Bitcoin Cash (`BCH`) November
    2018 fork, it has sometimes taken several days before forked coins were traded
    and listed on crypto exchanges. Once listed, the prices of the post-forked coins
    often fluctuate wildly. If `Chaun` wanted her 40 units of `NewBitcoin` and 40
    units of `Crypto 2` immediately, `Hazard Co.` would be forced to acquire 40 units
    of both `NewBitcoin` and `Crypto2` at a time when the market is illiquid and the
    prices are volatile. Also, to make matters worse for `Hazard Co.`, `Bibi` could
    demand that `Hazard Co.` return her 40 units of both `NewBitcoin` and `Crypto
    2`.


    To avoid these problems, many in the crypto community propose preventing rehypothecation
    by requiring 100 percent collateralization of crypto absent specific authorization
    from customers.


    ## State Law: A Tale of Two States


    In the US, state crypto regulations are all over the map. Some states have issued
    detailed guidance on crypto, while others have been mostly silent, relying on
    existing laws and rules. Two states, Wyoming and New York, however, have enacted
    comprehensive regimes with far different reactions:


    * Wyoming has received an overwhelmingly positive reaction that has resulted in
    a number of crypto businesses choosing to relocate there; and

    * New York has received a less-than-enthusiastic reaction that has resulted in
    a number of crypto businesses leaving the state.


    ### Wyoming


    Wyoming has passed an array of laws that seek to clarify and encourage crypto
    businesses, in hopes to become the “Delaware of digital asset law,” a reference
    to Delaware’s dominance in corporate law. Wyoming’s laws divide blockchain-based
    assets into three categories:


    1) `Digital Securities`: crypto that would be deemed securities under existing
    US law and would be recognized as securities under the UCC;

    2) `Digital Consumer Assets`: utility tokens or crypto that function as something
    other than as a currency, and would be recognized as general intangibles under
    the UCC; and

    3) `Virtual Currencies`: crypto that function primarily as money and would be
    recognized as money under the UCC.


    Wyoming’s taxonomy attempts to provide clarity to businesses regarding how Wyoming
    law will treat different types of crypto. The following are some of the provisions
    that have drawn the most attention and support from the crypto community:


    * Classifies digital assets (crypto) as property within the context of the UCC,
    which means individuals and businesses have the right to own digital assets without
    the need for intermediaries. This contradicts the approach of the Model Acts,
    which gave intermediaries preference with respect to ownership.

