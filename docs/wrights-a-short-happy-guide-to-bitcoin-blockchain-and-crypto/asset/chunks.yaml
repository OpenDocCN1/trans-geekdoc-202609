- raw: '[9](#section10.xhtml#ftnb.44)The street name system also provides protection
    against a broker’s insolvency, in two ways:


    1.When a firm faces liquidation, regulators, including the SEC and FINRA, work
    to ensure that customers’ securities are transferred to another firm. Keeping
    investments in street names may facilitate that process because beneficial ownership
    information is centralized.


    2.As part of the street name system, the Securities Investor Protection Corporation
    was organized to provide insurance to customers in the event of a broker’s insolvency.


    [10](#section10.xhtml#ftnb.45)Much of this section, and the examples provided,
    is based on Caitlin Long’s article, Two Things That Don''t Mix Well: Bitcoin Rehypothecation
    And Chain Forks, Forbes (Aug. 21, 2018).


    [11](#section10.xhtml#ftnb.46)See Sean Walters, One Lehman Lesson: The Perils
    of Rehypothecation, Wall Street Journal (Sep. 25, 2008).


    [12](#section10.xhtml#ftnb.47)A FinTech sandbox refers to a regulatory framework
    for FinTech companies and products that provides a regulatory environment that
    fosters innovative financial products and activities, and allows for smaller-scale,
    live testing of innovation under special regulatory exemptions, allowances, or
    other limited, time-bound exceptions. Broadly, regulatory sandboxes allow businesses
    to test non-traditional products under the regulator’s supervision with less risk
    of punishment. To operate in the sandbox, regulators require businesses to incorporate
    protections to insulate customers and the broader market from risks of their non-traditional
    products. The concept of a regulatory sandbox developed soon after the 2008 financial
    crisis as an attempt to address the frictions between businesses’ desire to innovate
    and regulators’ caution in approving innovative products.


