- raw: "The Ruling defined an airdrop as “a means of distributing units of a \\[crypto\\\
    ] to the \\[blockchain\\] addresses of multiple taxpayers.” The Ruling then added\
    \ that crypto “from an airdrop generally is received on the date and at the time\
    \ it is recorded on the \\[blockchain\\].” As was the case for hard forks, the\
    \ IRS noted that “\\[a\\] taxpayer does not have receipt of \\[crypto\\] when\
    \ the airdrop is recorded on the \\[blockchain\\] if the taxpayer is not able\
    \ to exercise dominion and control over the \\[crypto\\].”\n\nThe Ruling noted\
    \ that “a taxpayer may constructively receive \\[crypto\\] prior to the airdrop\
    \ being recorded on the \\[blockchain\\].” However, the IRS provided no explanation\
    \ or examples describing how a taxpayer could constructively receive crypto before\
    \ it was recorded on a blockchain. Even if airdropped crypto were somehow constructively\
    \ received before it was recorded on a blockchain, the Ruling provided no explanation\
    \ regarding how a taxpayer could exercise “dominion and control” over such crypto.\n\
    \n224 \n\nBasis of crypto\n\nThe FAQs accompanying the Ruling addressed the tax\
    \ basis for crypto. Both the ABA and the AICPA had raised the issue, noting that\
    \ without specific IRS guidance, taxpayers had to make educated guesses about\
    \ how to calculate and track their crypto’s basis. In other tax contexts, permissible\
    \ methods to determine a property’s basis include first-In, first-out (FIFO),\
    \ last-in, last-out (LIFO), specific identification of the property used in a\
    \ transaction, and the average-cost method.\n\nThe AICPA suggested the IRS should\
    \ allow FIFO unless a taxpayer was able to identify the specific units of crypto\
    \ used in a transaction. The IRS appears to have adopted the AICPA’s suggestion.\
    \ In FAQ 40, the IRS announced that unless a taxpayer identifies the specific\
    \ units of crypto used in a transaction, the units are deemed to have been sold,\
    \ exchanged, or otherwise disposed of in chronological order beginning with the\
    \ earliest unit of the crypto purchased or acquired (i.e., FIFO).\n\nAnalysis\
    \ of the 2019 Guidance\n\nAlthough the 2019 Guidance provided answers to many\
    \ open questions, it raised many other issues, including:\n\n1)it failed to address\
    \ a de minimis exception for small transactions;\n\n2)it is unclear, imprecise,\
    \ and in places inequitable; and\n\n3)as guidance, it lacks the force of law or\
    \ regulation, and is subject to challenge.\n\nA de minimis exemption\n\nThe 2019\
    \ Guidance failed to address an exemption for smaller crypto transactions, despite\
    \ many organizations, including both the 225AICPA and the ABA, recommending such\
    \ a provision. The IRS acknowledged the issue in a 2018 IRS Presentation, noting\
    \ the AICPA’s suggestion of creating an exemption for transactions below $200,\
    \ similar to the de minimis exemption for personal foreign currency transactions.[59](#section10.xhtml#ftn.94)\
    \ Without such an exemption, taxpayers are required to report to the IRS every\
    \ transaction in which crypto is used, from using bitcoin to purchase coffee at\
    \ Starbucks to exchanging $1 of BTC for $1 of ETH. In the Feb. 2020 AICPA Letter,\
    \ the AICPA asked the IRS to “exercise its administrative discretion to enforce\
    \ the tax laws to create a de minimis safe harbor” to spare taxpayers the trouble\
    \ of accounting for transactions “where the administrative costs outweigh any\
    \ possible tax on the immaterial transactions.”\n\nThe IRS has offered no explanation\
    \ for not including a de minimis exception, but two possible rationales are:\n\
    \n*   1. IRS personnel believe such a rule would frustrate the IRS’s attempts\
    \ to have taxpayers report their crypto transactions. Many have speculated that\
    \ a de minimis rule could lead to advanced tax avoidance techniques, such as structuring\
    \ numerous transactions below the threshold (not really an advanced technique,\
    \ but a good starting point for creating one). In addition, monitoring a de minimis\
    \ rule would likely be more time intensive for the IRS, because it would not only\
    \ require the IRS to examine all transactions, but also (i) first filter out transactions\
    \ below the $200 threshold, and then (ii) 226determine if a series of those filtered\
    \ transactions were structured to avoid reporting.[60](#section10.xhtml#ftn.95)\n\
    \n*   2. The IRS cannot create new law. It was Congress, not the IRS, who created\
    \ the de minimis exemption for personal foreign currency transactions. Thus, absent\
    \ a congressional directive to exempt crypto, the IRS cannot create a new law\
    \ simply because it would be convenient for taxpayers.\n\nIn January 2020, a bill\
    \ was introduced in Congress to address the de minimis exemption. The bill, entitled\
    \ the Virtual Currency Tax Fairness Act of 2020,[61](#section10.xhtml#ftn.96)\
    \ was introduced with bipartisan support in the U.S. House Representatives. The\
    \ bill excludes from gross income up to $200 of gain from the disposition of virtual\
    \ currency in a personal transaction. A previous version of the bill, introduced\
    \ in 2017, sought to exempt transactions in amounts below $600. In addition, both\
    \ the 2018 and 2019 Token Taxonomy Acts (neither of which passed) included a $600\
    \ de minimis exemption.\n\nPoor Guidance\n\nThe Dec. 2019 Congressional Letter\
    \ notes that\n\n“this recent guidance creates many new questions related to the\
    \ topics it seeks to address, namely forks and airdrops. Moreover, \\[it\\] appears\
    \ inequitable.”\n\nThose questions make it difficult to determine how certain\
    \ transactions should be treated. In the 2019 Guidance, the IRS defines a hard\
    \ fork using the following language:\n\n“a hard fork occurs when a \\[crypto\\\
    ] . . . undergoes a protocol change resulting in a permanent diversion from the\
    \ legacy \\[blockchain\\], resulting in the creation of a new 227\\[crypto\\]\
    \ on a new \\[blockchain\\] in addition to the legacy \\[crypto\\] on the legacy\
    \ \\[blockchain\\].”\n\nLater, the IRS uses the following language to define an\
    \ airdrop:\n\n“An airdrop is a means of distributing units of a \\[crypto\\] to\
    \ the \\[blockchain\\] addresses of multiple taxpayers. A hard fork followed by\
    \ an airdrop results in the distribution of units of the new \\[crypto\\] to addresses\
    \ containing the legacy \\[crypto\\].”\n\nBoth definitions are imprecise. The\
    \ hard forks related to Bitcoin Cash (BCH) and Ethereum Classic (ETC) demonstrate\
    \ the imprecision, as described below.\n\nBitcoin Cash Hard Forks\n\nOn August\
    \ 1, 2017, Bitcoin Cash (BCH) forked away from the Bitcoin (BTC) blockchain (the\
    \ BTC/BCH fork), a fork that arguably fits the Guidance’s definition, with BCH\
    \ being the “new” crypto. However, contrary to the IRS definitions, the BCH was\
    \ not “airdropped” to the existing BTC hodlers. Airdrops typically are newly-launched\
    \ crypto that are assigned automatically to existing holders of tokens or coins\
    \ on a network. In contrast, after a hard fork, particularly a contentious one,\
    \ owners of the pre-forked coin (BTC) own, by right, both the new coin (BCH) and\
    \ the existing coin (BTC).\n\nAfter the BTC/BCH fork in 2017, BCH itself forked\
    \ the following year into two coins, Bitcoin Cash Adjustable Blocksize Cap (ABC)\
    \ and Bitcoin Satoshi’s Vision (SV) (the ABC/SV fork). The 2019 Guidance creates\
    \ confusion regarding how the ABC/SV fork would be treated for tax purposes, because\
    \ after that fork, both coins made legitimate claims to be “legacy” coin, and\
    \ both also claimed the other coin was the “new” coin.\n\n228 \n\nImmediately\
    \ after the ABC/SV fork, it was unclear which blockchain was the dominant one,\
    \ and which would be able to call itself the “true” Bitcoin Cash (BCH). Some exchanges\
    \ even halted trading for days on both ABC and SV until it was clear who the “winner”\
    \ would be. Eventually, most exchanges recognized ABC as the winner, and allowed\
    \ ABC to use the name Bitcoin Cash, and the ticker BCH.\n\nDespite the uncertainty\
    \ regarding which was the “new” coin and which was the “legacy” coin, the 2019\
    \ Guidance required taxpayers to report the FMV of the “new” coin as a gain. It\
    \ is unclear how taxpayers are supposed to determine which is the new coin in\
    \ such circumstances.\n\nEthereum Hard Fork"
