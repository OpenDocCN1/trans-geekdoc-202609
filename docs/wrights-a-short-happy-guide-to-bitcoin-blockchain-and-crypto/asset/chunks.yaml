- raw: '[53](#section10.xhtml#ftnb.88)An exception to the CEA-based requirements does
    exist, and Bitfinex argued that the exception should apply to them. In very simplified
    terms, if a secured lending arrangement results in the “actual delivery” of the
    collateral within 28 days, it can be offered to retail customers. Bitfinex argued
    that because it recorded the borrower as the owner in its books, the borrower
    was the owner and Bitfinex had satisfied the “actually delivery” exception. The
    CFTC disagreed, finding that actual delivery would require Bitfinex to “actually
    deliver” the private keys to the borrower. Obviously, Bitfinex could not transfer
    the private keys, because if it did so, it would no longer have any control over
    the collateral, making the loan unsecured.


    [54](#section10.xhtml#ftnb.89)The Taxpayer Advocate, the organization inside the
    IRS whose job it is to advocate on behalf of taxpayers, had asked for such guidance
    as far back as 2008.


    [55](#section10.xhtml#ftnb.90)The letter is available at [https://coincenter.org/files/2019-12/letter-to-irs-dec-20.pdf](https://coincenter.org/files/2019-12/letter-to-irs-dec-20.pdf).


    [56](#section10.xhtml#ftnb.91)The Notice defined a virtual currency as “a digital
    representation of value that functions as a medium of exchange, a unit of account,
    and/or a store of value,” and added that virtual currencies could be “used to
    pay for goods and services, or held for investment.”


    [57](#section10.xhtml#ftnb.92)The IRS used the term “distributed ledger.”


    [58](#section10.xhtml#ftnb.93)As noted in the Securities Law chapter, exchanges
    often do not list newly-issued coins. If a taxpayer wanted to receive the non-listed
    coins, the taxpayer would generally have to remove the coin from the exchange
    into either a private wallet or an exchange that listed the coin.


    [59](#section10.xhtml#ftnb.94)The Presentation notes that it would be possible
    to structure such a de minimis election in a similar manner to the election under
    Section 988(e)(2) of the Code, passed by Congress in 1997. That section exempts
    taxpayers from reporting foreign currency gains for personal transactions up to
    $200, and a motivating factor for its passage was to exempt taxpayers who purchased
    foreign currency for vacation purposes from having to report gains related to
    changes in currency prices.


    [60](#section10.xhtml#ftnb.95)As a former DOJ tax prosecutor, I can attest that
    such a concern is not without merit.


    [61](#section10.xhtml#ftnb.96)H.R.5635


    [62](#section10.xhtml#ftnb.97)See generally, Complexity in the Federal Tax System,
    Joint Committee on Taxation (Mar. 6, 2015).


    [63](#section10.xhtml#ftnb.98)See Section 52(4) Taxation of Capital Gains Act
    1992 (UK).


    [64](#section10.xhtml#ftnb.99)The Guidance acknowledges that taxpayers who hold
    their crypto in exchanges that do not support the newly-created airdropped coins
    do not have dominion and control.


    [65](#section10.xhtml#ftnb.100)In general, the statute of limitations for tax
    returns is three years from the filing date, six years if the tax understatement
    is substantial, i.e., more than 25 percent of gross income. If a taxpayer failed
    to file a return, or filed a fraudulent return, the statute of limitations remains
    open.


    [66](#section10.xhtml#ftnb.101)Before applying Chevron deference to an IRS interpretation
    of a tax regulation, a court must generally find that (i) the underlying tax statute
    is ambiguous, and (ii) the IRS regulation is a reasonable interpretation of the
    ambiguous statute.


    [67](#section10.xhtml#ftnb.102)For example, Son of Boss was the largest tax shelter
    in US history, and estimates suggest it allowed taxpayers to understate their
    tax liabilities by over $6 billion. The IRS offered a settlement to Son of Boss
    participants, and according to former IRS Commissioner Mark Everson, the IRS collected
    around $3.2 billion from the settlement. See Treasury Inspector General for Tax
    Administration, Despite the Success Achieved, the Son of Boss Settlement Had Little
    Impact on Investor Filing and Payment Compliance, Ref. No. 2009–30–018 (Dec. 30,
    2018).


    [68](#section10.xhtml#ftnb.103)That policy statement, “allows the public to participate
    before any final rule becomes effective and ensures that all views are adequately
