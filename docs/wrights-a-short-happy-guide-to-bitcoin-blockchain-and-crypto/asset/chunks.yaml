    * iii) to the extent purchasers expected profits, those expectations were not
    based on the entrepreneurial or management efforts of Kik.

    * In May 2019, Kik and Kin launched [www.‌defend‌crypto.](http://www.‌defend‌crypto.)org.

    * In June 2019, the SEC sued Kik for conducting an illegal $100 million securities
    offering.

    * In August 2019, Kik filed what was widely regarded as a comprehensive and strategic
    answer to the SEC complaint, for the reasons set forth below:


    ### Comprehensive

    Instead of formally responding to the complaint by giving general denials of the
    SEC’s allegations (which is typical in securities litigation), Kik provided a
    detailed rebuttal of all the disputed facts and legal issues in SEC’s complaint.


    ### Strategic

    Kik’s answer set the stage for quickly moving the litigation to an appeals court.
    Generally in securities litigation, a defendant first files a motion to dismiss
    the lawsuit, which gives the defendant more time to prepare and could force the
    government to provide more information. Kik forwent the motion to dismiss, and
    by providing a deat rebuttal to the SEC’s complaint, made it more likely the case
    would proceed to trial without significant delay. No matter what happens in the
    trial court, this case will likely be appealed. Kik’s answer was designed to move
    the case to the appeals court, and potentially the US Supreme Court, as expeditiously
    as possible.


    Discovery in the case is expected to be completed in mid-2020, setting the stage
    for trial later in the year.


    ### Other SEC Action

    Around the same time the SEC released the Framework, it also issued its first
    “No Action Letter” (see box below) with respect to crypto, finding that the ICO
    tokens issued by Turnkey Jet, Inc. (TKJ) would not be considered securities. TKJ
    sought to issue fixed-price tokens that would allow token holders to use the TKJ
    jets as an air charter and air taxi service. The TKJ tokens would be issued on
    a private blockchain controlled by TKJ.


    | 188 SEC No Action Letters | Individual or entities uncertain about whether their
    actions would violate federal securities law may request “No Action” letters from
    the SEC. Most No Action Letters describe the request, analyze the facts and circumstances
    involved, and discuss applicable laws and rules. A No Action Letter is considered
    akin to an SEC stamp of approval. |

    | --- |


    It took the SEC almost a year to issue the TKJ No Action Letter, a long time considering
    some No Action Letters have been issued less than one week after requested. The
    TKJ No Action Letter provided an example of a digital asset that could be offered
    and sold for use or consumption without implicating securities law registration
    requirements.


    The importance of the TKJ No Action Letter is limited, however, because it addressed
    only a narrow set of facts i.e. a permissioned, centralized blockchain with a
    fixed-price token that could only be used for consumption. Those facts are inapplicable
    to most crypto projects.


    In August 2019, the SEC issued its second (and most recent as of this writing)
    No Action Letter to Pocketful of Quarters (PoQ). PoQ’s tokens, called Quarters,
    are designed to serve as a universal currency in video games. According to PoQ,
    Quarters will allow gamers whom have earned rewards in one game to convert those
    in-game rewards to Quarters, and use those Quarters in other games and platforms.


    As a condition to granting the PoQ No Action letter, the company had to assure
    the SEC that gamers would not be allowed to buy, sell, or exchange Quarters with
    other players, and developers and influencers would have to pass AML/KYC checks
    before they could open PoQ accounts. Like the TKJ token, Quarters would be issued
    189on a permissioned, centralized blockchain with a fixed-price token used only
    for consumption. The PoQ No Action Letter broke little-if-any new ground.


    ### Exemptions from Registration

    Companies looking to offer or sell securities (issuers) must generally either
    register the offering with the SEC or seek an exemption from registration. In
    order to register, issuers must fully disclose any and all material information
    that a reasonable investor would require in making an investment decision.


    To make compliance easier for smaller and newly public companies seeking to issue
    securities, the SEC offers a limited number of registration exemptions for:

    * private offerings to a limited number of persons or institutions;

    * offerings of limited size;

    * intrastate offerings; and

    * securities of municipal, state, and federal governments.


    All securities transactions, whether exempt or not, are subject to the antifraud
    provisions of the federal securities laws. Both federal law, as well as state
    securities laws (called “Blue Sky laws”), provide for both civil and criminal
    penalties for fraud.


    For companies seeking to raise money through issuances of securities, the process
    got easier beginning in 2012, when the Obama Administration and Congress enacted
    the Jumpstart Our Business Startups (JOBS) Act. The JOBS Act and its implementing
    regulations, coupled with existing laws, made it easier for companies to raise
    money within the parameters of US securities 190laws. Although the JOBS Act was
    passed in 2012, it took the SEC almost four years to finalize regulations explaining
    its provisions.


    The JOBS Act, coupled with existing law, provided three attractive avenues for
    crypto companies seeking registration exemptions: Regulation A+ (Reg A+), Regulation
    CF (Reg CF) and Rule 506(c) of Regulation D (Reg D). Rules 504 and 506(b) of Reg
    D also offer crypto companies more traditional registration exemption options.
    Before discussing each exemption, a few key terms are defined below:


    ### Key Terms


    #### Accredited Investor

    An “accredited investor” includes a natural person who:

    * earned income that exceeded $200,000 (or $300,000 together with spouse) in each
    of the prior two years, and reasonably expects the same for the current year;
    or

    * has a net worth over $1 million, either alone or together with spouse (excluding
    the value of the person’s primary residence).


    An “accredited investor” may also be an entity such as a bank, partnership, corporation,
    nonprofit or trust, when the entity satisfies certain criteria.


    In December 2019, for the first time since 1983, the SEC proposed expanding the
    definition of accredited investor. Under the proposal, the definition would be
    expanded to include individuals holding certain securities licenses (Series 7,
    65 or 92), private fund employees, registered investment advisers, family offices
    (and their clients) with $5 million under management, and limited liability companies,
    among others. The comment period for the 191SEC proposal ended on April 24, 2020,
    and a final proposal is expected in the third quarter of 2020.


    #### General Solicitation

    “General solicitation” includes advertisements published in newspapers and magazines,
    public websites, communications broadcasted over television and radio, and seminars
    where attendees have been invited by general solicitation or general advertising.
    In addition, the use of an unrestricted, and therefore publicly available, website
    constitutes general solicitation.


    #### Preemption

    Some SEC exemptions “preempt” state securities laws, meaning the offering need
    not be registered with state regulators, nor follow state Blue Sky laws.


    #### Restricted Securities

    Securities that are not freely tradeable. In order to sell a restricted security
    to the public, five conditions must generally be met:

    1. Holding Period: the security must typically be held for 6 to 12 months.

    2. Current Public Information: information regarding the nature of the issuer’s
    business, the identity of its officers and directors, and its financial statement
    must be publicly available.

