    假设信用卡交易手续费最低（1.5%），对于典型交易而言，使用比特币支付的成本将比使用 `Visa` 便宜约六百倍。有了更低的价格，Bibi 和 Chaun
    都更愿意让 Bibi 使用比特币支付，并共享成本降低带来的收益。此外，如果 Bibi 之后去星巴克，星巴克也会更希望 Bibi 使用比特币支付。事实上，早在
    2016 年，星巴克就已经允许客户通过移动应用程序 `IPayYou` 使用比特币支付。


    ### 所以 . . . 为什么大家都不使用它？


    此时一个逻辑问题是，如果区块链如此廉价且高效，为什么大多数交易没有在区块链上发生呢？简单的答案是，区块链网络尚未准备好。目前还没有。


    ### 可扩展性

    区块链技术在广泛采用之前必须克服的一个障碍是可扩展性。目前，尽管 `Visa` 网络上的交易费用是 `Bitcoin` 网络的约六百倍，但 `Visa` 每秒可以处理约两万四千到六万五千次交易，而最老的区块链网络
    `Bitcoin` 每秒处理的交易不到十次。


    ### 价格波动

    另一个障碍，至少在对比比特币方面，是价格波动。在过去的几年里，一个比特币 (`1 BTC`) 的价格波动剧烈，特别是在 2017 年。2017 年 1 月，`BTC`
    价格徘徊在 1000 美元左右，但到 2017 年 12 月，价格已达到 20,000 美元。由于这种波动，许多人理解地不愿使用比特币进行支付（一种交换媒介），而是获取并持有比特币作为投机性投资资产（价值存储手段）。在加密社区中，持有加密货币而不售卖的俚语被称为“Hodl”，这基于
    2013 年 12 月比特币论坛留言板上一个相当出名的拼写错误。一些用户根据某些加密货币的价格波动，将 `Hodl` 视为“Hold On for Dear
    Life”（死守护）的缩写。


    下面的框展示了使用比特币支付风险的一个极端例子。


    | 两个价值 500 万美元的披萨 | 2010 年 5 月 22 日，被称为“比特币披萨日”，来自佛罗里达州的程序员 Laszlo Hanyecz 想让人送两个披萨送到家里，费用大约是
    25 美元。Hanyecz 进入一个比特币论坛，询问是否有人为他订购披萨以换比特币。一位英国人同意并使用信用卡向披萨店付了款，Hanyecz 向他发送了 1,000
    BTC，当时价值约 25 美元。 | 按照 2020 年 1 月 `1 BTC = $10,000` 的价格，那些披萨每个价值 500 万美元。尽管遭受了显而易见的损失，但
    Hanyecz 对这笔交易并不困扰，他告诉《纽约时报》：“那时候比特币并没有什么价值，所以用它们换一个披萨的想法简直酷极了。” |

    | --- | --- |


    ### 不仅仅是钱

    尽管货币是区块链技术最清晰且最受接受的应用，但该领域的兴奋点不仅限于作为货币的使用。诞生于金融危机的区块链技术具有更广泛的目标。根据以太坊（第二大著名的区块链）创始人
    Vitalik Buterin 的说法：


    > 这个主意是构建一个涵盖从支付、银行到医疗保健和身份识别一切事务的新系统，这个系统既可以是旧系统的替代品，或者至少是它的替代方案，一个无国界、独立于国家控制且不受大科技剥削的系统
    . . . 加密货币领域成功让国际经济的某些方面变得更加开放，而政治正朝着完全相反的方向发展 . . . [以及]这对世界是一个有意义的贡献。


    `Ethereum` 是世界上领先的可编程区块链，它允许开发者构建利用区块链技术的应用程序（称为去中心化应用或“ĐApps”），而无需为每个应用程序创建一个新的区块链。`Ethereum`
    有一种原生加密货币 `Ether` (`ETH`)，它像 `BTC` 一样可以作为数字货币使用。然而，由于以太坊网络上的每次交易或操作都需要一定数量的 `ETH`（读作“eeth”，通常被称为
    `gas`），`ETH` 也作为执行以太坊网络上操作所需的计算成本的测量单位。


    截至 2019 年底，`Ethereum` 是领先的 `ĐApp` 平台，尽管它不是唯一的。`Tron` 和 `EOS` 是以太坊最主要的竞争对手，这三个平台合计占了总
    `ĐApp` 交易量的 98%以上。


    `ĐApps` 是物联网 (`IoT`) 演进的关键组成部分，物联网包含了嵌入软件、传感器、执行器和互联网连接的设备网络，这些设备能够连接并交换数据，从而为物理世界更直接地整合到计算机系统中提供了机会。物联网的承诺在于它将使我们使用的设备更智能、更高效、更廉价、更快速，并作为连接数字宇宙和物理世界的桥梁。


    估计显示，到 2020 年底，将有超过 300 亿个 `IoT` 设备。然而今天，大多数 `IoT` 设备依赖于中心化的通信模型，这种模型具有高维护和基础设施成本、单点故障，并且是黑客极具吸引的目标（蜜罐）。区块链可以减少或消除许多此类问题，并允许
    `IoT` 设备扩展以满足需求。


    # 区块链技术：基础指南


    本书提供了区块链技术和应用的概述，但并非为程序员和开发者提供详细的技术规范而编写。然而，由于主题涉及许多技术内容，本章将为读者概述某些技术概念，以便更好地理解区块链的应用。


    ### 什么是区块链？


    关于区块链的定义有很多，虽然相似，但很少有人认同同一个定义。以下是几种：


    *   区块链 . . . 是一个通过加密链接的增长记录列表，被称为“区块”。 — Wikipedia

    *   区块链是一种以几乎无法伪造的方式存储数据的数学结构。它可以用于任何数据。 — MIT Technology Review (2018)

    *   区块链是一个不可篡改的经济交易数字账本，可以记录不仅是金融交易的几乎一切价值 — Don and Alex Tapscott，《区块链革命》(2016)

    *   从简单来说，区块链是一个时间标记的不可篡改数据记录系列，由不属于单一实体的计算机集群管理。这些数据块（即区块）通过加密原理（即链）安全地连接在一起。
    — Blockgeeks.com


    '
