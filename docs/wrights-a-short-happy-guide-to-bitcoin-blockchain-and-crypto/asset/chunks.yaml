    ### 2) Something the person has: a physical thing, such as a card or a key. Often,
    this type of data is coupled with some other type of data. For example, a debit
    card and a `PIN` is a combination of something a person has and something a person
    knows. An obvious problem with this type of data is that it can be lost or stolen.


    ### 3) Something the person is: biometric information, like fingerprints, facial
    recognition, retinal scans, etc. One problem with this type of data is that it
    requires at least one party to have a device that can read and verify the data.


    ### How is the ID maintained?


    A `blockchain ID` would likely be maintained on a mobile phone, which could be
    lost, stolen, or hacked. Alternatively, a `blockchain ID` could be something that
    could not be lost, which means it would need to be some of “something the person
    is,” from above. Some forms are already in existence (fingerprints, retinal scans,
    biometric data), and others, like implanted chips, are the fodder for science
    fiction (though they are currently used in some places today).


    ### Who maintains the data?


    The issuance and storage of identity data are generally under the control of a
    government. Today, IDs are physical documents issued and validated by governments.
    If there were a `blockchain ID` created by a government, that same government
    would have the power to erase the ID, particularly for its more troublesome citizens.
    That risk may not seem particularly high in countries that purport to protect
    their citizens’ freedom, but that is not the case in authoritarian countries or
    countries that openly repress dissent.


    ### How are the data coordinated across the globe?


    It is unlikely all the world’s governments would agree on one system for a `blockchain
    ID`. As a result, a system of coordination would be needed, and some organization
    would need to maintain that system.


    Although there are many to-be-solved problems regarding a `blockchain ID`, Estonia
    offers a useful model for implementing and operating such a system.


    ### Estonia’s e-Identity (eID) program


    Estonia has the most advanced digital ID system in the world and provides a model
    for how a `blockchain ID` could be implemented. `Wired` magazine named Estonia
    “the most advanced digital society in the world,” based, in part, on its `eID`
    program.


    The `eID` program allows Estonians to pay taxes, vote online, as well as access
    public, financial, and medical services. Under the `eID` program, all citizens
    receive a secure digital ID card powered by a blockchain-like infrastructure that
    utilizes `2,048-bit` public and private key encryption. All `eID` operations are
    `PIN` protected, and in the last few years, the `eID` program added `QR codes`
    and a `Smart-ID` mobile application to provide greater security. The `eID` program,
    like public blockchains, runs on open-source software.


    The databases supporting the government’s `eID`-accessed services are housed on
    over nine-hundred databases distributed across the country, a measure to make
    cyberattacks more difficult and, in the event of a successful attack, less costly
    to correct. That measure was taken based on past successful Russian cyberattacks,
    which shut down an Estonian bank and disrupted Estonian government services for
    over a month. The `eID` program, and the Estonian government’s focus on cybersecurity,
    has made it more difficult for Russia to meddle in Estonia’s election, as Russia
    did both in supporting Brexit in the United Kingdom (UK) and helping elect the
    successor to President Barack Obama in the United States.


    [1] Data from Visa Fiscal Fourth Quarter 2019—Financial Summary and 2018 Annual
    Report.

    [2] This book uses the January 2020 price of `1 BTC = $10,000` throughout, because
    it is a nice round number, and there is no telling what the price of bitcoin will
    be when you read this. Also, if I could predict the price of bitcoin, this book
    would be called The Bitcoin Billionaire’s Short & Happy Guide to Bitcoin, Blockchain,
    and Crypto.

    [3] Private blockchains are similar to public blockchains, except they are generally
    not decentralized. Instead, they are often invitation-only networks governed by
    a centralized entity or group of entities. They allow entities to utilize blockchain
    technology, but keep the data private.

    [4] `Miners` is used here because they are used in the most popular blockchains,
    like Bitcoin and Ethereum, that use a proof of work consensus mechanism, described
    later in the chapter. Other blockchains use different consensus mechanisms that
    do not rely on miners, and rely on “validators” or “forgers” to add blocks to
    the blockchain.

    [5] See Lamport, Shostak, and Pease, The Byzantine Generals Problem, ACM (1982).

    [6] See Satoshi Nakamoto, Bitcoin: A Peer-to-Peer Electronic Cash System (2008),
    available at `https://bitcoin.org/bitcoin.pdf`.

    [7] The data are available at `https://digiconomist.net/bitcoin-energy-consumption`.

    [8] Rob Viglione (co-founder of `ZenCash`), The Benefits of Incentivizing Node
    Operators in Public Blockchains, Bitcoin Magazine (May 25, 2018).

    [9] The term smart contract was coined in 1993 by Nick Szabo, a computer scientist,
    legal scholar, and cryptographer, while researching the ambiguities of language
    in an effort to devise a system to allow contract language to be converted into
    computer code.

    [10] See EthHub, History and Network Upgrades, available at `https://docs.ethhub.io/ethereum-basics/history-and-forks/`.

    [11] The word traces its origins to the Russian word `выигрыш`, romanized as `výigryš`,
    meaning gain or winnings.

    [12] Jesus Rodrigues, The Middleman of Trust: The Oracle Paradox and Five Protocols
    that can Bring External Data into the., Hacker Noon (July 31, 2018).

    [13] Clifford Chance, Smart Contracts: Legal Framework and Proposed Guidelines
    for Lawmakers (Oct. 2018).

    [14] These end-of-2019 estimates of transactional throughput are based on average
    sized transactions.

    [15] Originally, Bitcoin did not have a block size limit. However, in March 2010,
    Satoshi Nakamoto explicitly limited the block size to `1 MB`.

    [16] Generally, a second layer protocol is built to run “on top of” an existing
    blockchain, using a second layer of smart contracts over the main blockchain.

    [17] In May 2018, Bitcoin Cash increased its block size from `8 MB` to `32 MB`
    through a hard fork. That hard fork also allowed developers to build smart contracts
    on top of the Bitcoin Cash network.

    [18] Much of this section is based on a series of articles authored by Justine
    Humenansky, Blockchain at Berkeley consultant, and Blockgenic, published in Hacker
    Noon.

    [19] Much of this section is based on a series of articles authored by Matt Reynolds,
    in Wired magazine, and Justine Humenansky, Blockchain at Berkeley consultant.


    Part II


    The Crypto Value Proposition


    Money as Technology


    Bitcoin and other crypto derive their value from the utility they provide. That
    utility, often filling an unmet need, increasing efficiency, or decreasing transaction
    costs, explains why in just a little over eleven years, there are over thousand
    cryptos, with a collective market cap of over $200 billion.

    '
  trans: '


    ### 2) 人拥有的东西：物理物品，如卡片或钥匙。通常，这类数据会与其它类型的数据结合。例如，借记卡和 `PIN` 码就是“人拥有的东西”与“人所知的”的组合。这种数据的一个明显问题是它可能会丢失或被盗。


    ### 3) 人所特有的：生物识别信息，如指纹、人脸识别、视网膜扫描等。这种数据的一个问题是，它要求至少一方拥有可以读取和验证数据的设备。


    ### ID 如何进行维护？


    `blockchain ID` 可能会维护在手机上，而手机可能会丢失、被盗或被黑客攻击。或者，`blockchain ID` 可以是一种不会丢失的东西，这意味着它需要是上述的某种“人所特有的”。某些形式已经存在（指纹、视网膜扫描、生物识别数据），而其他形式如植入式芯片则是科幻小说的素材（尽管目前在某些地方已经投入使用）。


    ### 由谁来维护数据？


    身份数据的发行和存储通常由政府控制。今天，身份证是由政府颁发和验证的实体文件。如果由政府创建了 `blockchain ID`，那么该政府就有权删除该 ID，特别是对于那些让政府感到麻烦的公民。在声称保护公民自由的国家，这种风险可能并不特别高，但在威权国家或公开镇压异见的国家，情况并非如此。


    ### 数据在全球范围内如何进行协调？


    世界上所有的政府不太可能对一种 `blockchain ID` 系统达成共识。因此，需要一套协调系统，并需要某个组织来维护该系统。


    尽管关于 `blockchain ID` 许多许多待解决的问题，但爱沙尼亚为实施和运营此类系统提供了一个实用的模型。


    ### 爱沙尼亚的电子身份（eID）计划


    爱沙尼亚拥有世界上最先进的数字身份识别系统，并为 `blockchain ID` 的实现提供了模型。`Wired` 杂志根据其 `eID` 计划将爱沙尼亚称为“世界上最先进的数字社会”。


    `eID` 计划允许爱沙尼亚人纳税、在线投票，以及访问公共、金融和医疗服务。在 `eID` 计划下，所有公民都会获得一张安全的数字身份卡，该卡由类似于区块链的基础设施驱动，利用了
    `2,048-bit` 公钥和私钥加密。所有的 `eID` 操作都受 `PIN` 保护，在过去的几年里，`eID` 计划增加了 `QR codes` 和 `Smart-ID`
    移动应用程序以提供更高的安全性。`eID` 计划像公共区块链一样，运行在开源软件上。


    支持政府 `eID` 服务的数据库分布在全国的九百多个数据库中，这一措施使得网络攻击变得更加困难，并在攻击成功的情况下使纠正成本更低。该措施的采取是基于过去俄罗斯成功的网络攻击，这些攻击曾关闭了一家爱沙尼亚银行并中断了爱沙尼亚政府服务一个多月。`eID`
    计划以及爱沙尼亚政府对网络安全的关注，使得俄罗斯干预爱沙尼亚选举变得更加困难，因为俄罗斯在支持英国（UK）脱欧以及帮助选出美国总统巴拉克·奥巴马的继任者方面都曾这样做。


    [1] 数据来自 Visa 2019 财年第四季度财务摘要和 2018 年报。

    [2] 本书全文采用 2020 年 1 月的价格 `1 BTC = $10,000`，因为它是一个很整的数字，而且无法预测当你读到这本书时比特币的价格会是多少。此外，如果我能预测比特币的价格，这本书的名字将是《比特币亿万富翁的比特币、区块链和加密货币简与快乐指南》。

    [3] 私有区块链与公共区块链类似，区别在于它们通常不是去中心化的。相反，它们通常是由中心化实体或一组实体治理的仅邀请网络。它们允许实体利用区块链技术，但保持数据的私密性。

    [4] 此处使用 `Miners` 一词是因为是因为它们被用于最流行的区块链（如比特币和以太坊），这些区块链使用了工作量共识机制（将在章节后部分描述）。其他区块链使用不同的共识机制，不依赖矿工，而是依赖“验证者”或“铸造者”向区块链中添加区块。

    [5] 见 Lamport, Shostak, and Pease, The Byzantine Generals Problem, ACM (1982)。

    [6] 见 Satoshi Nakamoto, 《Bitcoin: A Peer-to-Peer Electronic Cash System》(2008)，可访问
    `https://bitcoin.org/bitcoin.pdf`。

    [7] 数据可访问 `https://digiconomist.net/bitcoin-energy-consumption`。

    [8] Rob Viglione（`ZenCash` 联合创始人），《The Benefits of Incentizing Node Operators
    in Public Blockchains》，Bitcoin Magazine (2018 年 5 月 25 日)。

    [9] “智能合约”一词由计算机科学家、法律学者和密码学家尼克·萨博（Nick Szabo）于 1993 年提出的，当时他正在研究语言的歧义性，试图设计一种允许将合同语言转换为计算机代码的系统。

    [10] 见 EthHub, History and Network Upgrades，可访问 `https://docs.ethhub.io/ethereum-basics/history-and-forks/`。

    [11] 该词源于俄语单词 `выигрыш`，罗马化为 `výigryš`，意为收益或奖金。

    [12] Jesus Rodrigues，《The Middleman of Trust: The Oracle Paradox and Five Protocols
    that can Bring External Data into》，Hacker Noon (2018 年 7 月 31 日)。

    [13] Clifford Chance，《Smart Contracts: Legal Framework and Proposed Guidelines
    for Lawmakers》(2018 年 10 月)。

    [14] 这些 2019 年底的交易吞吐量估计是基于平均交易的。

    [15] 最初，比特币没有区块大小限制。然而，在 2010 年 3 月，中本聪明确地将区块大小限制在 `1 MB`。

    [16] 通常，二层协议被构建并运行在现有区块链“之上”，在主链上使用第二层智能合约。

    [17] 2018 年 5 月，比特币现金通过硬叉将其区块大小从 `8 MB` 增加到 `32 MB`。这次硬叉还允许开发者在比特币现金网络之上构建智能合约。


    第二部分


    加密货币价值主张


    作为货币


    比特币和其他加密货币的价值源于它们提供的效用。这种效用通常填补了未满足的需求、提高了效率或降低了交易成本，解释了为什么在短短十多年里，出现了数千种加密货币，总市值超过
    2000 亿美元。


    '
