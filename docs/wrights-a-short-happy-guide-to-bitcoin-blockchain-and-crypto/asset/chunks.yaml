  trans: '


    其他法院要求投资者的财富必须与发行人的财富挂钩。在这种情况下，如果发行人在投资者获利时获利，则存在狭窄的垂直共同性（narrow vertical commonality）。然而，如果发行人获得的是固定费用或不取决于企业盈利能力的佣金，法院不太可能认为存在狭窄的垂直共同性。只有第九巡回法院接受狭窄的垂直共同性，28，但在过去，第九巡回法院也接受过水平共同性（horizontal
    commonality）。29


    正如本章后部分讨论的，SEC 对加密货币共同性的立场似乎是“任何共同性即可”。


    ### 3) 利润预期


    这一要素关注对该投资是否具有利润的合理预期，以及该预期是否是投资的主要动力。在确定什么被视为“利润”时，法院主要关注资本增值或企业的收益。重要的是，最高法院认为，“当购买者的动机是由于想要使用或消费所购买的物品时
    . . . . 证券法并不适用。”30 （此处为强调）


    这种被广泛描述为“实用性”的“使用或消费”例外经常被加密货币发行人利用，他们声称自己的代币不是证券。然而，SEC 强调，仅仅将代币标记为“实用性代币”并不能神奇地让该代币免受证券法的法律约束。截至为止，SEC
    尚未对代币到底需要多少实用性才能避免被视为证券提供明确答案，但提供了指导意见（在本章后部分描述）以缩小调查范围。


    ### 4) 基于他人的努力


    Howey 测试的第四个要素要求对投资利润的预期基于“他人的努力”。Howey 原文的表述是利润“完全”基于他人的努力，但“完全”这一要求已被大多数法院所放宽。今天，相关的调查是“除投资者以外的人所付出的努力是否是不可否认的重大努力，即那些影响企业成败的本质管理努力”。31


    根据美国法律，所有证券的要约和销售必须根据证券法进行注册，或者符合豁免注册的条件。要注册证券，发行人必须向潜在投资者披露有关投资的详细信息，包括业务及其管理层的描述、拟提供的证券以及经审计的财务报表。根据会计咨询公司普华道（PWC）的数据，首次公募（IPO）注册过程的（通常需要律师、会计师和银行家的参与）通常超过
    100 万。


    ## SEC 与加密货币


    在 2017 年之前，SEC 尚未对加密货币是否为证券采取公开立场。2017 年 7 月 25 日，在名为“The DAO”的加密货币对冲基金遭到攻击后，SEC
    在发布的《The DAO 报告》（节选如下）中明确了其立场 172，宣布其观点：所有符合 Howey 测试的加密货币都是证券。


    | ![](img/Image_58.jpg)THE DAO REPORT（以下信息基于 The DAO 报告）The DAO 是去中心化自治组织（DAO）的一个示例，该术语用于描述一种由计算机代码体现、并在分布式账本或区块链上执行的“虚拟”组织。DAO
    由一家名为 `Slock.it` 的公司及其联合创始人创建，目标是作为虚拟对冲基金运营。DAO 将通过向投资者出售 DAO 代币产生资产，然后这些资产将用于资助投资项目。DAO
    代币持有者作为投资回报，将共享项目产生的收益。此外，DAO 代币持有者还可以转售其 DAO 代币。2016 年，The DAO 发布并通过出售 DAO 代币筹集了价值
    1.5 亿美元以上的 ETH。然而，在 DAO 开始资助项目之前，攻击者利用 DAO 代码中的漏洞盗走了三分之一的 ETH。被盗的 ETH 价值在 5000
    万至 6000 万美元之间。SEC 对 The DAO 发起了调查，并在调查中考虑了 (i) DAO 代币是否为证券这一边界问题 (ii) 证券法是否适用于
    DAO 代币的销售。根据调查，SEC 发布了《The DAO 报告》，判定 DAO 代币为证券，且 DAO 代币的销售构成了证券发行。 |

    | --- |


    The DAO 报告于 2017 年发布，标志着加密社区与 SEC 之间战斗的正式开始。在随后的几年里，主要的争议点变成了 SEC 如何判断特定的加密货币是否为证券。加密社区敦促
    SEC 发布明确规则，以确定加密货币的独特特征如何影响证券合同分析。


    在 The DAO 报告发布后，一些加密货币公司搬到了海外以规避美国证券监管。加密社区抱怨 SEC 缺乏清晰度是一个驱动因素。为了提供更多清晰度，SEC 在
    2019 年 4 月发布了《数字资产投资合同分析框架》，以帮助市场参与者理解 SEC 如何判断加密是否是证券。尽管该指导受到欢迎，但带有一个重要的前提：它不具有约束力。框架包含了以下警告性语言：


    ```

    本框架代表 SEC 员工的观点，并非规则、法规或委员会的声明。委员会既未批准也反对其内容。本框架与其他指导一样，对 SEC 各部门或委员会没有约束力。它不构成法律建议，您应咨询自己的律师。它不修改或替换任何现有法律法规。

    ```


    尽管有警告性语言，该框架对于 SEC 如何判断标记为证券提供了实用的指导，并列出了 SEC 的三要素 32 Howey 测试：


    1) 资金投资；


    2) 共同体；以及


    3) 源自他人努力的利润合理预期。


    框架的分析如下。


    ### 1) 资金投资


    框架规定，该要素“在数字资产的要约和销售中通常得到满足，因为数字资产是通过交换购买或获得的，无论是真实（或法币）货币、另一种数字资产或其他形式的”。然而，在脚注中，框架讨论了空投（airdrops），即向持有者免费发放加密代币，这通常用于促进空投加密货币的流通。33


    脚注指出，如果空投代币是为了“接收者为了推进发行人的经济利益并培养其证券交易市场而提供的服务”而发行的，那么资金投资要素很可能满足。SEC 对空投的立场与其对
    20 世纪 90 年代运营的“免费股票”骗局的立场一致。根据当时的 SEC 执行主任 Richard H. Walker 的说法：


    ```

    在这些案例中，免费股票实际上是一个误称。虽然没有发生现金交易，但发行股票的公司获得了宝贵的益处。在这种情况下，证券法赋予了投资者获得充分公平披露的权利，而他们在这些案例中并未获得这些权利。

    ```


    '
