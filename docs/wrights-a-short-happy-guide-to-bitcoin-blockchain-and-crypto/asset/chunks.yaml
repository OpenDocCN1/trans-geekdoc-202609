- raw: "In 2019, the CFTC collected over $1.3 billion in regulatory penalties, a 40\
    \ percent increase from 2018. Roughly 65 percent of the CFTC’s enforcement actions\
    \ were brought against individuals and entities engaging in fraudulent schemes\
    \ in connection with commodities and other derivatives. Increasingly, more and\
    \ more of those enforcement actions involve crypto.\n\nIn 2019 alone, the CFTC\
    \ undertook the following crypto-related enforcement actions:\n\n*   In October\
    \ 23, in a case brought by the CFTC, a federal judge ordered two individuals and\
    \ four corporate entities to pay $4.25 million in damages for fraud in connection\
    \ with a binary options scam involving a worthless crypto called ATM Coin.\n\n\
    *   On September 30, the CFTC charged a Nevada individual and corporation with\
    \ fraud relating to an $11 million binary options scheme. According to the complaint,\
    \ the defendants (i) solicited and accepted at least $11 million worth of bitcoin\
    \ and US dollars to trade derivatives, and (ii) made false claims about their\
    \ trading expertise and guaranteed returns of up to 300 percent. Rather than using\
    \ the funds to trade as promised, the defendants misappropriated funds by (i)\
    \ retaining participants’ funds in the defendant’s personal crypto wallets and\
    \ (ii) using funds to pay off earlier investors (a Ponzi scheme). 214The defendants\
    \ then lied to participants in order to conceal their misappropriation.\n\n* \
    \  Also on September 30, the CFTC charged one individual, Jon Barry Thompson,\
    \ with fraud, alleging he convinced clients to send approximately $7 million to\
    \ fund phony bitcoin purchases.\n\n*   On June 18, the CFTC announced that it\
    \ had charged UK-based crypto company Control-Finance Limited and its CEO with\
    \ misappropriating 22,858.822 bitcoins (valued at the time at $147 million) from\
    \ more than 1,000 victims.\n\nAlthough garden-variety fraud makes up most of the\
    \ CFTC’s enforcement activity, it has also exercised its jurisdiction over activities\
    \ that, although not fraudulent, fall within its regulatory purview. Two such\
    \ activities are unregulated trading and secured lending.\n\nUnregulated Trading\n\
    \nUnder US law, a derivatives exchange or trading platform must register with\
    \ the CFTC if they either solicit or accept orders from US customers. Since 2015,\
    \ after it determined that certain crypto were commodities, the CFTC has maintained\
    \ that crypto derivatives exchanges must be registered if they allow US persons\
    \ to trade.\n\nOn March 11, 2019, 1pool Ltd., a Marshall Islands online trading\
    \ platform, and its CEO agreed to pay almost $1 million to settle CFTC charges.\
    \ As part of that settlement, 1pool admitted that it had (i) offered to US customers\
    \ contracts that used bitcoin as collateral, (ii) failed to register with the\
    \ CFTC, and (iii) failed to implement an adequate AML/KYC program.\n\nReports\
    \ in late 2019 suggested the CFTC was investigating Hong Kong-based BitMEX, one\
    \ of the world’s largest trading platforms, for 215allowing US persons to trade\
    \ on their platform. The case is seen by many in the industry as important because\
    \ it has the potential to extend the reach of US regulation outside US borders.\n\
    \nBitMEX has rules and policies in place to prohibit US persons from using its\
    \ platform and removes any US persons whom it discovers have flouted those rules.\
    \ In fact, on the main bitmex.com website, users are greeted with the following\
    \ message:\n\nAttention—Important Notice\n\nIt is prohibited to access or use\
    \ our services (including the BitMEX trading platform) if you are located, incorporated\
    \ or otherwise established in, or a citizen or resident of, any “Restricted Jurisdiction”\
    \ \\[which includes the US\\] under (and as that term is defined in) our Terms\
    \ of Service.\n\nBitMEX reserves the right to immediately close the accounts and\
    \ to liquidate the open positions of persons determined to have breached our Terms\
    \ of Service.\n\nHowever, as noted by BitMEX CEO Arthur Hayes, “it is possible\
    \ clients mask\\[ \\] their location by using virtual private networks to assign\
    \ their computer an internet protocol address from a BitMEX-permitted country,\
    \ tricking \\[the\\] filters \\[BitMEX\\] put in place.”\n\nOne reason US investors\
    \ attempt to trade on BitMEX in spite of the prohibition is that BitMEX offers\
    \ financial products that are generally unavailable to US customers. One such\
    \ financial product is XBTUSD BTC/USD contract, which offers leverage up to 100X.\
    \ Using the XBTUSD contract, an investor could post 1 BTC and be allowed to buy\
    \ 100 BTC using leverage (other people’s property). In general, the XBTUSD contract\
    \ would work as follows:\n\n*   If the BTC price appreciates, the payoff is 100-to-1.\n\
    \n216 \n\n*   However, if the price of BTC depreciates by 1 percent, because of\
    \ the 100-to-1 leverage, the investor would lose their entire 1 BTC investment.\n\
    \nIf the CFTC were able to sustain an enforcement action against BitMEX despite\
    \ BitMEX’s efforts to block US users, any platform that has US users (regardless\
    \ of the platform’s efforts to prohibit US users) could likely also be subject\
    \ to US enforcement actions. Moreover, simply being investigated by the CFTC has\
    \ repercussions. For example, soon after it was reported that the CFTC was investigating,\
    \ BitMEX saw a record outflow of about $530 million of funds, more than five times\
    \ the amount it had experienced in any previous months. Nevertheless, at the end\
    \ of 2019, BitMEX remained one of the top three crypto derivates exchanges, behind\
    \ Korea’s OKEx and Singapore-based Huobi.\n\nSecured Lending\n\nThe other non-fraudulent\
    \ crypto-related activity regulated by the CFTC is secured lending. Secured lending\
    \ is the process of a borrower pledging some assets (for example, bitcoin) as\
    \ collateral for a loan. Once the assets are pledged, they act as protection against\
    \ financial loss for the lender. An example would be a secured loan for bitcoin\
    \ in which a borrower posts $100, and a lender lends the borrower $900 so the\
    \ borrower can purchase $1,000 of bitcoin. In that example, the lender would hold\
    \ the $1000 of bitcoin until the borrower repaid the $900 borrowed plus interest.\
    \ To hold the bitcoin collateral, the lender will generally hold the private keys\
    \ to the bitcoin as security for the loan.\n\nThe issues surrounding secured lending\
    \ of crypto first arose in 2016 in a proceeding against the crypto exchange Bitfinex.\
    \ On its platform, Bitfinex allowed retail users to enter into loans secured by\
    \ bitcoin. Bitfinex’s role was to match lenders, who were willing to provide financing\
    \ secured by bitcoin, with borrowers, who 217desired to make leveraged purchases\
    \ of bitcoin. In addition, Bitfinex would monitor the lending agreement and hold\
    \ the collateral. The CFTC determined that Bitfinex’s secured lending services\
    \ amounted to an offer of “financed retail commodity transactions,” a transaction\
    \ regulated by the CFTC under the CEA.\n\nPrior to 2010, Bitfinex’s secured lending\
    \ of bitcoin would not have created any issues (ignoring for the moment the fact\
    \ that there was no market for bitcoin in 2010). However, in 2010, the Dodd-Frank\
    \ Wall Street Reform and Consumer Protection Act (Dodd-Frank) amended the CEA\
    \ to change the way commodity-backed retail secured loans were regulated, bringing\
    \ the Bitfinex secured lending service under the ambit of the CEA.[52](#section10.xhtml#ftn.87)\
    \ Without wading into the precise legal details, it would have been exceedingly\
    \ difficult for Bitfinex to comply with the myriad CEA-based legal and regulatory\
    \ requirements that would have allowed it to offer secured lending services to\
    \ retail customers.[53](#section10.xhtml#ftn.88)\n\nWhy is the CFTC involved in\
    \ this?"
