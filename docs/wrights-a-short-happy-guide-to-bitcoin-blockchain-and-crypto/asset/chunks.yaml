    下面的示例解释了智能合约是如何工作的。


    ### 区块链智能合约：对 NCAA 冠军赛下注


    ![杜克大学标志和符号含义 | 历史与演变](img/Image_13.jpg)![Amazon.com: 马里兰大学 Terps NCAA 自动标志：汽车](img/Image_14.jpg)假设这是未来（202X
    年）某场 NCAA 篮球锦标赛的决赛，互不认识的 Bibi 和 Chaun 想对结果下注。每个人都想对 NCAA 冠军赛下注 100 美元。Bibi 想下注马里兰大学地鼠队（Terps）获胜，而
    Chaun 出于某种原因（搬到卡罗来纳州 NC 了？）想下注杜克大学获胜。他们都认为如果赢了，他们的赌注应该翻倍（2 比 1 的赔率——“平手”投注）。如果马里兰大学胜，Bibi
    将获得 200 美元（原始的 100 美元赌注和额外的 100 美元），如果杜克大学胜，Chaun 将获得 200 美元。由于决赛中没有平局，除非发生某些灾难性事件，否则只有两种结果：地鼠队胜或杜克大学胜。


    由于 Bibi 和 Chaun 互相陌生，他们需要一个可信的中间机构来下注。该中间机构将提供两个重要功能：（1）让他们获赔率；（2）保证支付。在现实世界中，这种可信中间机构是博彩（bookie），它向所有潜在下注者广播赔率。在
    Bibi 和 Chaun 对冲（offsetting positions）的情况下，博彩会收取一笔费用。这种费用在博彩术语中被称为“水”（vig）11），通常是投注金额的
    10%。


    一旦比赛结束且地鼠队获胜（作者注权），Bibi 将想要获得她的获胜收益。博彩将给 Bibi 90 美元（100 美元减去 10% 的水费）。这正是智能合约可以增加价值的地方。在相同的条件下，Bibi
    和 Chaun 最好通过一个不收取“水”的智能合约直接相互下注。


    该合约结构将：


    *   向想对 NCAA 冠军赛下注的人广播信息；

    *   匹配像 Bibi 和 Chaun 这样对冲部位的人；

    *   为这些下注者提供进入智能合约的机制；

    *   收集每个下注者的押金并持有直到比赛结束；

    *   将智能合约中持有的所有资金支付给赢者，扣除极微的（几分）区块链交易成本。


    智能合约执行了博彩曾做的所有任务，但成本低得多。但这引发了一个实际问题：


    智能合约如何知道谁赢了？


    就像《矩阵》中的墨菲斯和尼奥一样，智能合约需要看到预言机（Oracle）。


    ## 预言机


    预言机是程序、设备或实体，为智能合约提供外部数据，以判断条件是否已满足，而不违反区块链的完整性。在智能合约中，预言机发现并验证现实事件，然后将这些信息发送到区块链供智能合约使用，或直接发送给智能合约。


    ### 为什么要信任预言机？由于区块链系统被设计为无需信任，预言机向系统重新引入了某种程度的信任。然而，一套演进的预言机集合通过财务、声誉和治理协议减少了使用预言机相关的风险。此外，许多智能合约依赖多个预言机来进一步降低这些风险。


    39


    Jesus Rodrigues 在 Hacker Noon 的一文中（12


    人类预言机：访问并向区块链输入外部数据的个人或群体。


    应用预言机：直接从互联网或在线应用程序接口（API）获取数据并将其传输到区块链应用程序的软件应用。应用预言机有三种基本类型：


    1)中心化预言机：依赖来自 API 或其他中心化应用程序的信息；

    2)联邦预言机：依赖少数节点来验证外部信息，以与主数据提供者相关；


