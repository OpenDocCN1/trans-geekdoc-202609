    The Framework’s common enterprise analysis consisted of a one-sentence conclusion:


    “In evaluating digital assets, we (the SEC) have found that a ‘common enterprise’
    typically exists.”


    That conclusory analysis included a footnote (Footnote 11), noting that based
    on the SEC’s analysis, “investments in digital assets have constituted investments
    in a common enterprise because the fortunes of digital asset purchasers have been
    linked to each other or to the success of the promoter’s efforts.” [Emphasis supplied]


    In other words, the SEC appears to take the position that it does not matter what
    type of commonality exists. That conclusion is based on the language of Footnote
    11, which covers:


    *   the horizontal test through the use of the language, “the fortunes of digital
    asset purchasers have been linked to each other;” and

    *   the vertical tests through the use of the language, “the fortunes of digital
    asset 176purchasers have been ‘linked to’ . . . the success of the promoter’s
    efforts,” which would satisfy the more difficult narrow vertical test as well
    as the less stringent broad vertical test.


    The SEC’s commonality position has been criticized by many in the crypto industry,
    because what the SEC appears to be saying is:


    We will generally treat a token as satisfying our common enterprise test so long
    as it satisfies any commonality test.


    Whether a court would agree with such a loose definition of commonality has yet
    to be determined, and is among the issues litigated in `SEC v. Kik Interactive,
    Inc. (Kik)`, described later in the chapter. The Kik case is widely regarded as
    the most important test case for securities regulation of crypto.


    ### 3) Reasonable Expectation of Profits Derived from Efforts of Others


    After joining the final two Howey elements, the Framework then separates them
    into (i) reliance on the efforts of others, and (ii) reasonable expectation of
    profits. Mirroring the Framework, those are discussed below in an abbreviated
    form.


    #### (i) Reliance on the Efforts of Others


    In evaluating this element, the Framework focuses on the role of what the SEC
    calls an “Active Participant” (AP), defined as the promoter, sponsor, or other
    party:


    “responsible for the development, improvement (or enhancement), operation, or
    177promotion of the network, particularly if purchasers of the digital asset expect
    an AP to be performing or overseeing tasks that are necessary for the network
    or digital asset to achieve or retain its intended purpose or functionality.”


    The Framework then identifies two key issues in its “efforts of others” analysis:


    1.  Does the purchaser reasonably expect to rely on the efforts of an AP?

    2.  Are the AP’s efforts the undeniably significant ones, those essential managerial
    efforts which affect the failure or success of the enterprise, as opposed to efforts
    that are more ministerial in nature?


    Because many crypto tokens are on decentralized blockchains, the Framework provides
    examples in which this element will be satisfied, including situations in which:


    *   essential managerial tasks or responsibilities are to be performed by an AP
    rather than an unaffiliated, dispersed community of network users;

    *   an AP creates or supports a market for, or the price of, the digital asset;

    *   an AP has a lead or central role in the direction of the ongoing development
    of the network or the digital asset including governance issues, code updates,
    or how transactions are validated;

    *   178

    *   an AP has a continuing managerial role in making decisions about or exercising
    judgment concerning the network or the characteristics or rights the digital asset
    represents; and

    *   purchasers would reasonably expect the AP to undertake efforts to promote
    its own interests and enhance the value of the network or digital asset.


    According to the Framework, while none of the characteristics are determinative,
    the stronger their presence, the more likely it is that the SEC will determine
    a purchaser is relying on the efforts of others. Many have complained that the
    Framework provides little in the way of actual guidance about what the SEC views
    as the most, or even more, important factors.


    #### (ii) Reasonable Expectation of Profits


    The Framework generally acknowledges that profits can result from capital appreciation
    or earnings, but adds that price appreciation resulting solely from external market
    forces (such as general inflationary trends or the economy) impacting the supply
    and demand for an underlying asset generally would not be considered profits under
    Howey.


    The Framework then lists a number of characteristics (too long to reproduce here)
    that would make it more likely there would be a reasonable expectation of profits.
    The Framework also identified factors weighing against a finding that digital
    asset purchasers have a reasonable expectation of profits, 179including whether
    purchasers are buying the assets for consumptive or utility purposes.


    ### Other Framework guidance


    The Framework also provides guidance on the circumstances under which a particular
    crypto would no longer be considered a security. The SEC acknowledged that crypto
    previously sold as a security may not always be considered a security, and would
    examine the following factors in making its determination:


    *   Purchasers of the digital asset no longer reasonably expect that continued
    development efforts of an AP will be a key factor for determining the value of
    the digital asset.

    *   The value of the digital asset has shown a direct and stable correlation to
    the value of the good or service for which it may be exchanged or redeemed.

    *   The trading volume for the digital asset corresponds to the level of demand
    for the good or service for which it may be exchanged or redeemed.

    *   Whether holders are able to use the digital asset for its intended functionality,
    such as to acquire goods and services on or through the network or platform.

    *   Whether any economic benefit that may be derived from appreciation in the
    value of the digital asset is incidental to obtaining the right to use it for
    its intended functionality.

    *   No AP has access to material, non-public information or could otherwise be
    deemed to hold material inside information about the digital asset.

    *   180


    ### A new proposal


    In a February 2020 speech, SEC Commissioner Hester Peirce, known in the crypto
    community as “Crypto Mom,” proposed a safe harbor for crypto projects looking
    to raise funds. Peirce stated the proposal was necessary “to achieve the investor
    protection objectives of the securities laws, as well as the need to provide the
    regulatory flexibility that allows innovation to flourish.”[35](#section10.xhtml#ftn.70)


    Peirce detailed her proposal, which she admitted was a work-in-progress, in an
    appendix to her speech that was made available on the SEC’s website.[36](#section10.xhtml#ftn.71)
    According to Peirce’s proposal:


    This safe harbor is intended to provide Initial Development Teams with a three-year
    time period within which they can facilitate participation in, and the development
    of, a functional or decentralized network, exempt from the registration provisions
    of the federal securities laws so long as the conditions are met. The safe harbor
    is also designed to protect token purchasers by requiring disclosures tailored
    to the needs of the purchasers and preserving the application of the anti-fraud
    provisions of the federal securities laws.


    Upon the conclusion of the three-year period, the Initial Development Team must
    determine whether token transactions involve the offer or sale of a security.
    Token transactions may not constitute securities transactions if the network has
    matured to a functioning or decentralized network. The definition of `Network
    Maturity` is intended to provide clarity as to when a token transaction should
    no longer be considered a security 181transaction but, as always, the analysis
    will require an evaluation of the particular facts and circumstances.

