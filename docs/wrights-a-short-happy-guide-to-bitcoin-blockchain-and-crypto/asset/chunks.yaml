    \        - [对 2019 年指南的分析]\n        - [IRS 执法]\n    - [国会行动]\n\n关于比特币、区块链和加密货币的简短快乐指南\n\
    \n## 第一部分：区块链技术\n\n### 区块链创新\n\n区块链技术的创新在于，它们减少或消除了经济关系中对信任和可信中间节点的需求。区块链本质上是信任机器。在一个联系日益紧密又日益疏离的世界里，这种创新非常有价值，媒体对区块链技术的关注和投资就证明了这一点。本书深入探讨了区块链如何作为信任机器发挥作用，探索了区块链技术如何提高信任效率，解释了区块链的一些用例，并描述了区块链应用的的法律现状。\n\
    \n从技术角度来看，区块链是数字账本，维护在计算机网络上，该网络对某一方拥有的独特信息（`digital information`）进行诚实、永久的记录，并防止所有者以外的任何人复制或使用这些数字信息。当交易在某个特定的有限时期内发生时，这些交易会被分组并记录在区块中。然后，这些区块被添加到所有早期区块的账本中，形成一条区块链。\n\
    \n许多区块链的一个重要特性是它们在很大程度上是不可篡改的。一旦数据被输入区块并记录在区块链上，任何人都无法更改这些数据。当新区块添加到区块链时，它必须与之前所有的区块保持一致。简单来说，这意味着如果一个用户在区块链上记录有\
    \ 10 个比特币（通常情况下，Bitcoin 指网络，而 bitcoin 或 `BTC` 指加密货币）：\n\n1. 没有人可以操纵该用户拥有的比特币数量；\n\
    2. 系统将防止用户花费超过 10 个比特币，因为这种交易将与所有之前的区块不一致。\n\n此外，通过追溯用户的交易，可以查看每一笔交易，以准确确定用户是如何积累了这\
    \ 10 个比特币的。不可篡改性允许用户进行交易，并确保对方能够履行其交易义务。\n\n"
