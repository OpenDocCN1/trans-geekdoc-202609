    ### 3. 交易量公式

    发行人关联方的任何出售行为均不得超过所售证券同类发行股总额的 1%；如果已在证券交易所上市，则应以 1% 或在出售通知提交前四周的平均每周 192 报告交易量中的较高者为准。


    ### 4. 普通经纪人交易

    发行人关联方的任何出售行为在各方面必须作为常规交易进行处理，且经纪人收取的佣金不得超过正常水平。卖方和经纪人均不得寻求招揽购买该证券的订单。


    ### 5. 备案要求

    如果发行人关联方的拟议出售涉及超过 5,000 股，或在任何三个月内的总金额超过 `$50,000`，则必须向 `SEC` 提交备案通知。


    ## 免免条款


    #### Reg A+

    通过 `Reg A+`（有时被称为微型 IPO），美国或加拿大发行人可以在 12 个月内从无限数量非合格投资者（公众）处筹集高达 5000 万美元的资金，而无需作为公开发行进行注册。`Reg
    A+` 发行受 `SEC` 审查和资格认证，如果获得批准，则优先于州蓝天法（Blue Sky laws）。`Reg A+` 发行出售的证券不被视为限制证券。[40]
    然而，根据 `Reg A+` 免购买的证券在未注册的情况下不能在交易所上市或报价。[41]


    `Reg A+` 发行有两个层：


    * `Tier 1`：适用于 12 个月内最高 2000 万美元的发行；193

    * `Tier 2`：适用于 12 个月内最高 5000 万美元的发行。


    对于最高 2000 万美元的发行，公司可以选择按照 `Tier 1` 或 `Tier 2` 的要求进行。


    作为 `Reg A+` 审批流程的一部分，公司可以机密地向 `SEC` 提交其发股说明书，允许公司评估 `SEC` 对豁免的反应。此外，在承诺 `Reg A+`
    发行之前，`SEC` 允许公司通过对其客户或公众就投资进行调查，“试水”（test the waters），从而在公司投入大量时间和资金进行 `SEC` 审批流程之前做出决定。


    “试水”允许公司衡量 `Reg A+` 发行的潜在成功率，以便就是否继续做出明智决定。通常情况下，在“试水”活动期间，公司邀请潜在投资者（包括客户）表示对公司证券的兴趣。如果兴趣不足，公司可以避免进行发行所需的成本。


    从理论上讲，`Reg A+` 流程应该让公司享受精简、快速的审查流程。但在实践中，`Reg A+` 流程并未为加密证券提供加速。从历史上看，寻求在 `Reg
    A+` 下发行证券的公司可以预期在三个月内获得批准。然而，尽管早期加密证券项目早在 2017 年中就提交了在 `Reg A+` 下发行证券的请求，但直到 2019
    年 7 月 `Blockstack Reg. A+` 获得批准之前，没有任何“真正的”加密项目（见下表）获得批准。


    | 194 StartEngine Reg A+ 合格批准![](img/Image_61.jpg) |

    | :--- |

    | 一家获得 `Reg A+` 发行证券初步批准的加密公司是 `StartEngine`，但该批准条件使得它通常不被视为“真正的”加密项目。`StartEngine`
    成立于 2014 年，声称是美国最大的股权众筹平台，其使命是通过资本获取的民主化帮助创业者实现梦想。2018 年 6 月，`StartEngine` 在一次标准的（即非加密）`Reg
    A+` 发行中成功筹集了近 500 万美元。在首次 `Reg A+` 发行之后，`StartEngine` 寻求在 `Reg A+` 下发行代币化股权证券的批准。在其[[代币化股权发行说明书](https://www.sec.gov/Archives/edgar/data/1661779/000114420418036457/tv497502_partiiandiii.htm)
    中，`StartEngine` 表示计划以“电子代币的形式”发行普通和优先股……“使用 `smart contract` 在 `Ethereum Blockchain`
    上交付”。然而，在提交初始申请后，`StartEngine` 被要求修改六次其初步招股说明书。在其第六版招股说明书（日期为 2019 年 3 月 7 日）中，`StartEngine`
    修改了章程，将其证券名称从 `Series Token` 优先股更改。实际上，`StartEngine` 的批准是基于 195`SEC` 要求他们从发行中移除几乎所有与加密相关的内容。
    |


    | --- |

    | 196 | 2019 年 4 月，纽约区块链软件提供商 `Blockstack` 宣布其已向 `SEC` 提交发行说明书寻求首创。根据 `Blockstack’s`
    网站：我们的全资子公司 `Blockstack Token LLC` 今日宣布已向 `SEC` 提交发行说明书以进行 5000 万美元的代币发行。一旦批准，该发行将是首例。`Blockstack`
    在 2019 年 7 月获得了 `Reg A+` 批准，并在 9 月在首次 `SEC` 的发行中筹集了超过 230 万美元。发行净收益将用于加速 `Blockstack`
    去中心化计算网络和应用生态系统。尽管 `Blockstack` 的批准为 `SEC` `Reg A+` 要求提供了清晰度，但它引发了一系列其他问题，包括：*
    如果购买 `Blockstack` 代币的人用其交换商品或其他服务，`SEC` 是否会将其视为证券出售？* `Blockstack` 代币持有人可以向他人转售吗？*
    如果应用程序接受 `Blockstack` 代币作为支付或使用代币支付他人，该应用程序是否在招揽证券或作为证券交易商？* 因为 `SEC` 批准了发行，`Blockstack`
    是否免于纽约的蓝许可证制度？另一个来自 Blockstack 发行的开放问题涉及挖矿。Blockstack 协议依赖矿工来挖掘“Stacks”代币 (`STX`)。如果矿工获得了超过
    5000 万美元的 `STX` 代币（`Reg A+ Tier 2` 的限制），目前尚不清楚 (i) 如何根据证券法发行这些代，以及 (ii) 向矿工发行
    `STX` 代币是否被视为独立的发行。 |


    #### Reg CF

    通过 `Reg CF`（正式称为“众筹条例”），发行人可以通过 `SEC` 批准的经纪商或众筹平台（见下表）从非合格投资者处筹集高达 100 万美元（随通胀调整）的资金。`Reg
    CF` 为发行人提供了一个简单直接的选项，但根据 2020 年的规定，限制发行额不超过 107 万美元。


    | 什么是众筹平台？ |

    | :--- |

    | 作为 JOBS 法的一部分，股权众筹平台的概念被创造让创业者、初创公司和非传统投资基金能够从公众募集资金。为了降低欺诈风险，`Reg CF` 禁止股权众筹平台：*
    向投资者提供投资建议或推荐。 |


