    # 3) Decentralized Oracles

    Decentralizedacles collect external data, but before providing it to the blockchain,
    validate the data through one or more decentralized consensus protocols.


    ## Hardware Oracles

    Electronic devices that capture external data and provide that data to the blockchain.


    The challenge of any oracle is ensuring that the information it provides can be
    trusted. While oracles certainly introduce vulnerabilities into the trustless
    nature of blockchains, a number of applications have come online to solve the
    oracle problem. Some of the top oracle applications, and excerpts from their websites,
    are below:


    - ![](Image_16.jpg) **Augur** (`augur.net`) relies on individuals to report external
    events relevant to specific predictions and employs validation-dispute protocols
    and reputation tokens to maintain a record of an oracle’s behavior.

    - ![](Image_17.jpg) **Chainlink** (`chain.link`) maintains a decentralized oracle
    network to provide security guarantees as smart contracts themselves. By allowing
    multiple `Chainlinks` to evaluate data, `Chainlink`’s application seeks to eliminate
    points of failure and maintain the overall value of a smart contracts.

    - ![](Image_18.jpg) **Provable** (`provable.xyz`) provides a platform that allows
    for integration of multiple data sources as oracles, employs mechanisms called
    “authenticity proofs” to provide transparency to their processes, and provides
    a full audit trail for external data provided to smart contracts.

    - ![](Image_19.jpg) **Witnet** (`witnet.io`) is a decentralized oracle network
    that connects smart contracts to the outer world. It aims to allow any piece of
    software to retrieve the contents published at any web address with complete and
    verifiable proof of its integrity and without blindly trusting any third party.


    In our example, assume the oracle operates by checking the final score of the
    game on every major newspaper in the US as well as the top fifty sports-related
    websites around the world. It also contacts twenty trusted individuals to confirm
    the information’s accuracy. If all parties confirm the score, the oracle would
    provide the information to the smart contract, telling the smart contract that
    Maryland won and Duke lost. The smart contract would then make the payout to `Bibi`.


    Diagram of a smart contract[13](#section8.xhtml#ftn.13)


    ![](Image_20.jpg)


    # Challenges facing smart contracts

    The appeal of smart contracts is that for simple transactions, they obviate the
    need for trusted intermediaries, particularly when the terms of the agreement
    are fairly straightforward and easily verifiable. However, for more complicated
    agreements, smart contracts fail to address a number of critical issues, including:


    - **Jurisdiction**. Legal contracts are governed according to the law of particular
    legal or administrative bodies, and those bodies have the authority to resolve
    controversies arising out of those contracts. In addition, because words mean
    different things in different contexts, many jurisdictions provide information
    about the meaning of words used in contracts. Smart contracts, in contrast, often
    simply set forth the terms of the transactional agreement and are silent with
    respect to jurisdiction or the meaning of particular terms.

    - **Anonymity**. In legal contracts, the parties generally know the identities
    of the other parties to the transaction. However, on the blockchain, ownership
    of digital assets is often pseudonymous, meaning the identity of the owner is
    generally disguised or hidden. A smart contract would only verify the conditions
    required to enter into the contract and would be agnostic towards how a party
    was able to meet those conditions. For example, if `Chaun` acquired the `$100`
    to place the bet on `Duke` by misdirecting money from a children’s charity or
    some other nefarious scheme, the smart contract would not care.

    - **Enforcement of Disputes**. In the event there is a dispute in a legal contract,
    the parties to that contract can resolve their dispute based on the language of
    the contract and the rules of the jurisdiction governing the contract. Once that
    dispute is resolved, a party entitled to a remedy can enforce that remedy according
    to what is provided in the contract and the laws or rules of the jurisdiction.
    In a smart contract, if a dispute arises after the smart contract has been executed,
    there may be no way of identifying other parties to the smart contract. And even
    if those parties could be identified, absent language in the smart contract setting
    forth a dispute resolution mechanism, it would be unclear what jurisdiction (i)
    would have the authority to resolve such a dispute, or (ii) could enforce a remedy.


    Some have theorized that smart contracts will someday replace lawyers. That is
    unlikely. While smart contracts may reduce the demand for some legal practice
    areas, they will increase the demand for lawyers who can coordinate with coders
    to draft more sophisticated and robust smart contracts, particularly as more `IoT`
    products come online.


    # Decentralized Applications (ĐApps)

    ĐApps are applications that run on a peer-to-peer (`P2P`) network of computers,
    and generally allow for the transfer of data. Blockchain ĐApps use the blockchain
    to allow for transfer of data. Examples of non-blockchain ĐApps include `Napster`,
    `BitTorrent`, and the `Tor` browser, which are all ĐApps. Both `Bitcoin` and `Ethereum`
    are examples of ĐApps.


    Blockchain ĐApps using smart contracts generally meet the following criteria:


    1. **Open Source**. The source code of ĐApp protocols are available to anyone
    and operate autonomously.

    2. **Decentralized**. ĐApps run on `P2P` networks that utilize cryptographic technology
    to store data and avoid central points of failure.

    3. **Token Operation**. ĐApps use tokens that are required for the ĐApp to operate.
    In general, any contribution of value to a ĐApp, such as validating transactions
    pursuant to the consensus mechanism, is rewarded with aApp’s tokens.

    4. **Token Generation**. They use either `PoW` or `PoS` consensus mechanism, or
    a combination of both. As ĐApps evolve, the consensus mechanisms will likely follow
    suit.


    In general, ĐApps fall into three operational categories:

    - Type 1:ĐApps with their own blockchain, such as `Bitcoin` or `Ethereum`.

    - Type 2:ĐApps that use the blockchains of Type 1 ĐApps and require tokens to
    function.

    - Type 3:ĐApps that use Type 2 ĐApps, but also generally issue and require tokens
    on their own.


    One way to think about the different types of ĐApps (ignoring the use of tokens)
    is:

    - Type 1 ĐApps are akin to operating systems, like `Microsoft Windows`, `Android`,
    or Apple’s `IOS`.

    - Type 2 ĐApps are akin to software programs that function in an operating system,
    like `Microsoft Word` or `Adobe Photoshop`.

    - Type 3 ĐApps are akin to specialized software that operate inside of other software,
    like the spellchecker in `Microsoft Word`.


    # ĐApp and Smart Contract Platforms

    Both ĐApps and smart contracts need a blockchain to operate, and different blockchains
    have different strengths and weaknesses as ĐApp or smart contract platforms. Often,
    the main issue is scalability—the ability of the ĐApp or smart contract to carry
    out transactions quickly.


    While `Bitcoin` has the technological capacity to function as a smart contract
    platform, its primary function to date has been as a form of money. Other blockchains
    have sought to provide more functionality for ĐApps or smart contracts, and `Ethereum`
    has been the most popular smart contract platform, at least through the first
    quarter of 2020. According to `Ethereum.org`:

