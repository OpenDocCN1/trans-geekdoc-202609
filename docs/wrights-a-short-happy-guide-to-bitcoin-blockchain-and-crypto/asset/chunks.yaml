- raw: "Fractional reserve banking is a banking practice in which a bank keeps only\
    \ a fraction of its deposits in reserve and available for immediate withdrawal.\
    \ The remaining deposits are lent out to borrowers. In simple terms, it is the\
    \ ability to lend out most deposits and hold back only small percentage, in the\
    \ hope that most depositors will not ask for their money at the same time. The\
    \ funds lent out earn interest and allow financial institutions to make a profit.\
    \ The box below, citing the 1946 Frank Capra film It’s a 153Wonderful Life, provides\
    \ a practical example of fractional reserve banking.\n\n| It’s a Wonderful Life\
    \ explains fractional reserve banking![Related image](Image_56.jpg)In one of the\
    \ movie’s more famous scenes, George Bailey (played by Jimmy Stewart) confronts\
    \ a mob of customers demanding their deposits back from his Bailey Building &\
    \ Loan community bank, based on fictional situation remarkably similar to the\
    \ Great Depression.In the film, Bailey tells the mob that he cannot give them\
    \ their money immediately because their deposits have been invested in other assets\
    \ like their and their neighbors’ homes and local businesses. As noted by the\
    \ Atlantic:“the movie’s plot also touches on some still-relevant financial topics,\
    \ including the nature of banking, the philosophical calculus behind issuing loans,\
    \ and the way American families’ financial fates are intertwined.”—Bourree Lam\
    \ And Gillian B. White, The Morality of Banking in It’s a Wonderful Life, The\
    \ Atlantic (Dec. 23, 2016). |\n\n| --- |\n\nAll banks use fractional reserve banking\
    \ to earn profits. However, to ensure that banks remain solvent, federal banking\
    \ regulations mandate a required ratio, typically around ten percent of deposits,\
    \ that must be held in reserve. That ten percent reserve requirement represents\
    \ a hard limit to the amount of money banks can lend against their deposits.\n\
    \n154 \n\nFor non-bank crypto intermediaries, if they had super negotiability,\
    \ there would be no legal (as opposed to prudential) limit on their ability to\
    \ borrow or lend a customer’s crypto in order to earn profits. The practice of\
    \ an intermediary using a customer’s assets to earn profits, often through borrowing\
    \ or lending those assets, is called rehypothecation.\n\nFinancial intermediaries\
    \ sometimes rehypothecate more assets than they hold, leading to what is called\
    \ an uncovered position—one not fully backed by an actual asset.[10](#section10.xhtml#ftn.45)\
    \ Examples 1 and 2 below demonstrate risks of rehypothecation and uncovered positions\
    \ in crypto.\n\nExample 1\n\nAssume a crypto financial intermediary (Hazard Co.)\
    \ holds 100 of Bibi’s bitcoins (and no other bitcoin holdings), but decides to\
    \ lend out 140 bitcoins to Chaun. At that point, Hazard Co. would have a 40-bitcoin\
    \ uncovered position. This example raises two obvious questions:\n\n1)How can\
    \ Hazard Co. lend out more crypto than it holds?\n\nGood question. The reason\
    \ is because the 140 bitcoins often never actually have to leave Hazard Co. Think\
    \ of the average loan: when the loan is made, all that happens is the bank makes\
    \ a bookkeeping entry that states the borrower has additional funds. But the funds\
    \ don’t necessarily leave the bank. Also, if the borrower uses the funds to pay\
    \ another of the bank’s customers, all that happens is another 155bookkeeping\
    \ entry, from one bank customer to another.\n\n2)Why would Hazard Co. want to\
    \ create an uncovered position?\n\nSpeculation. In our example, Hazard Co. would\
    \ earn interest from lending out 140 bitcoins to Chaun, even though it had only\
    \ Bibi’s 100 bitcoins. So long as all 140 bitcoins do not leave Hazard Co., this\
    \ house of cards will stand.\n\nAlthough creating an uncovered position is risky,\
    \ it can be very profitable, because it allows financial institutions to earn\
    \ interest on assets they do not own. The risk, however, falls onto customers\
    \ who may not be able to get their assets back if a financial institution’s risks\
    \ do not pay off. Taking risks and passing those risks onto others is called “moral\
    \ hazard.” Both rehypothecation and moral hazard were contributing factors to\
