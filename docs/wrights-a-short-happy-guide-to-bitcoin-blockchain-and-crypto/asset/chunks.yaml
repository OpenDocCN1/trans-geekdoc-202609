    基于 `CEA` 的要求确实存在例外，`Bitfinex` 辩称该例外适用于他们。通俗地说，如果一项担保贷款安排导致抵押品在 `28` 天内完成“实际交付”，则可以将其提供零售客户。`Bitfinex`
    认为，由于它在账上将借款人记录为所有者，因此借款人是所有者，`Bitfinex` 已满足“实际交付”的例外。`CFTC` 持不同意见，认为实际交付要求 `Bitfinex`
    向借款人“实际交付”私钥。显然，`Bitfinex` 无法转移私钥，因为如果这样做它将不再对抵押品拥有任何控制权，导致贷款变为无担保。


    纳税人倡导员（Taxpayer Advocate）是 `IRS` 内部负责代表纳税人维护利益的组织，他们早在 `2008` 年就请求过此类指导。


    可以通过 `https://coincenter.org/files/2019-12/letter-to-irs-dec-20.pdf` 获取该信。


    该通知将虚拟货币定义为“一种作为交换媒介、记账单位和/或价值存储的数字价值表示”，并补充说虚拟货币可以“用于支付商品和服务，或持有用于投资”。


    `IRS` 使用了“分布式账本”这一术语。


    正如证券法章节中提到的，交易所通常不会列出新发的代币。如果纳税人想要获得未列出的代币，纳税人通常必须将代币从交易所提取到私人钱包或列出该代币的交易所。


    演示稿指出，这种微小选择（de minimis election）的结构可以类似于国会于 `1997` 年通过的《法典》第 `988(e)(2)` 条下的。该条款免除了纳税人报告个人交易中不超过
    `$200$` 的外币收益的义务，其通过的一个动力因素是免除为了度假目的而购买外币的纳税人报告与货币汇率变化相关的收益。


    作为前任 `DOJ` 税务检诉官，我可以证明这种担忧并非空穴来。


    `H.R.5635`


    泛见《联邦税收系统的复杂性》（`Complexity in the Federal Tax System`），税务联合委员会（`Joint Committee
    on Taxation`）（`2015 年 3 月 6 日`）。


    参阅《1992 年资本利得税法》第 52(4)条（`Section 52(4) Taxation of Capital Gains Act 1992`）（`英国`）。


    指导意见承认，在不支持新创建空投代币的交易所持有加密货币的纳税人并不拥有所有权和控制权。


    通常情况下税表的诉讼期为自申报日起三年，如果漏税金额巨大（即超过总收入的`25 percent`），则为`六年`。如果纳税人未提交报表或提交了虚假报表，则诉讼期持续有效。


    在对 `IRS` 对税务法规的解释适用“雪弗龙尊重”（Chevron deference）之前，法院通常必须发现：(i) 基础税收法律具有模糊性，且 (ii)
    `IRS` 法规是对该模糊法律的合理解释。


    例如，`Son of Boss` 是美国历史上最大的避税天堂，据估计，它让纳税人少缴了超过 `$60 billion$` 的税款。`IRS` 向 `Son
    of Boss` 的参与者提供了和解方案，根据前 `IRS` 局长 Mark Everson 的说法，`IRS` 从和解中收了约 `$3.2 billion$`。参阅税务行政监察长（`Treasury
    Inspector General for Tax Administration`）《尽管取得了成就，Son of Boss 和解对投资者申报和支付合规性的影响很小》（`Ref.
    No. 2009–30–018`）（`2018 年 12 月 30 日`）。


    该政策声明指出，“允许公众在任何最终规则生效之前参与，并确保所有观点都得到充分考虑。它还让公众告知政府可能尚未掌握的相关信息，或提醒政府可能无法预见的后果。”参阅财政部《税收监管政策声明》（`Dept.
    of the Treasury`, `Policy Statement on the Tax Regulatory Process`）（`2019 年 3
    月 5 日`）。


    `547 U.S. 47`（`2006 年`）。


    `Whalen v Roe`，`429 U.S. 589`（`1977 年`）。


