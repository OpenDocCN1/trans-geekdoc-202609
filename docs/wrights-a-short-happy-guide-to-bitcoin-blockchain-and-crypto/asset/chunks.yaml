- raw: "The complete answer is a complicated mix of historical facts and bad fiscal\
    \ and monetary policy, but the simple explanation is the US did not have enough\
    \ gold in reserve to meet its growing obligations to deliver gold. That lack of\
    \ gold reserves led President Nixon to cause the US to renege on its promise to\
    \ back the dollar with gold. 82The facts below, in chronological order, help explain\
    \ how the US got into that position:\n\n*   In 1960, the US held $19.4 billion\
    \ in gold reserves, and there were roughly $18.7 billion in dollars held outside\
    \ the US.\n\n*   During the 1960s and early 1970s, US citizens purchased increasingly\
    \ more imported goods using dollars, but did not sell enough domestically produced\
    \ goods overseas to bring those dollars back to the US. That created a balance\
    \ of payments deficit with foreign governments.\n\n*   Also during the 1960s and\
    \ early 1970s, the Soviet Union began producing significant amounts of oil and\
    \ selling that oil for dollars, thereby accumulating dollars. Because of Cold\
    \ War tensions, the Soviets deposited their dollars in European banks, creating\
    \ what became known as eurodollars. The term “eurodollars” now generally refers\
    \ to all US dollar deposits held overseas.\n\n*   As more eurodollars were held\
    \ overseas, the balance of payments deficit grew, and foreign governments lost\
