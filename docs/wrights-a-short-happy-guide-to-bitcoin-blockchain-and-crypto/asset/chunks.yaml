- raw: "Twenty-five days after taking office, President Roosevelt urged Congress to\
    \ pass a law that would “put the burden of telling the whole truth” on sellers\
    \ of securities. Two months later, the ’33 Act was signed into law.\n\nWho administers\
    \ the securities laws?\n\nInitially, the ’33 Act was administered by the Federal\
    \ Trade Commission and was limited to regulating new stock issuances. However,\
    \ it soon became clear to Congress and the Roosevelt administration that stronger\
    \ laws and enforcement were needed. The next year, Congress and the President\
    \ strengthened the nation’s securities laws by:\n\n*   enacting the ’34 Act, which\
    \ broadened US securities laws to cover not only securities issuances, but also\
    \ securities trading; and\n\n*   creating the Securities and Exchange Commission\
    \ (SEC), to serve as an independent agency to administer the securities laws.\n\
    \nFederal securities regulations, then and now, have two primary goals:\n\n1)encourage\
    \ companies to disclose accurate financial information to investors so investors\
    \ can make informed decisions; and\n\n2)establish laws and penalties for fraud\
    \ and misrepresentation in securities markets.\n\nThe SEC enforces the securities\
    \ laws to ensure that companies offering securities for sale to the public provide\
    \ accurate disclosures about the companies’ business, the securities offered,\
    \ and the risks involved in investing in those securities. In addition, the SEC\
    \ 165provides rules to ensure that those who sell and trade securities—brokers,\
    \ dealers, and exchanges—treat investors fairly and honestly.\n\nOne of the most\
    \ powerful weapons in the SEC’s arsenal is Section 10(b) of the ’34 Act, which\
    \ prohibits “any manipulative or deceptive device or contrivance in contravention\
    \ of such rules and regulations as the Commission may prescribe as necessary or\
    \ appropriate in the public interest or for the protection of investors.” The\
    \ latter part of that quote, “as the Commissioner may prescribe. . .” gives the\
    \ SEC the power to issue rules and regulations regarding the best way to enforce\
    \ Section 10(b), and provides the statutory basis for the SEC’s most powerful\
    \ anti-fraud weapon, Rule 10b–5.\n\nAdopted in 1942, Rule 10b–5 makes it illegal\
    \ to:\n\na)employ any device, scheme, or artifice to defraud;\n\nb)make any untrue\
    \ statement of a material fact or to omit a material fact necessary in order to\
    \ make the statements made, in light of the circumstances under which they were\
    \ made, not misleading; or\n\nc)engage in any act, practice, or course of business\
    \ which operates or would operate as a fraud or deceit upon any person, in connection\
    \ with the purchase or sale of any security.\n\nUnder US law, the definition of\
    \ a security (restated in its entirety below) is extremely long and intended to\
    \ cover many different types of financial arrangements. For the purposes of this\
    \ book and crypto, however, the critical terms are underlined:\n\nThe term “security”\
    \ means, (unless the context otherwise requires) any note, stock, treasury stock,\
    \ security future, security-based swap, bond, debenture, evidence of indebtedness,\
    \ certificate of interest or participation in any profit-sharing agreement, collateral-trust\
    \ certificate, 166preorganization certificate or subscription, transferable share,\
    \ investment contract, voting-trust certificate, certificate of deposit for a\
    \ security, fractional undivided interest in oil, gas, or other mineral rights,\
    \ any put, call, straddle, option, or privilege on any security, certificate of\
    \ deposit, or group or index of securities (including any interest therein or\
    \ based on the value thereof), or any put, call, straddle, option, or privilege\
    \ entered into on a national securities exchange relating to foreign currency,\
    \ or, in general, any interest or instrument commonly known as a “security”, or\
    \ any certificate of interest or participation in, temporary or interim certificate\
    \ for, receipt for, guarantee of, or warrant or right to subscribe to or purchase,\
    \ any of the foregoing.\n\nAn investment contract is a catch-all term that serves\
    \ as the basis for the SEC’s exercise of jurisdiction over certain crypto. The\
    \ term was largely undefined until the 1946 US Supreme Court case of SEC v. W.J.\
    \ Howey Co. (Howey), which created a four-element test to determine whether a\
    \ financial asset would be considered a security.\n\nIn Howey, the Court defined\
    \ an investment contract as:\n\n“a contract, transaction or scheme whereby a person\
    \ invests his money in a common enterprise and is led to expect profits solely\
    \ from the efforts of the promoter or a third party.”\n\nThat language came to\
    \ be known as the Howey test, and as it is currently understood, treats a transaction\
    \ as an investment contract—thus as a security—whenever there is:\n\n1)an investment\
    \ of money or other property;\n\n2)in a “common enterprise;”\n\n167 \n\n3)with\
    \ an expectation of profits from the investment; and\n\n4)the expectation of profits\
    \ is based mostly on the efforts of others.\n\n![](Image_57.jpg)\n\nGraphic courtesy\
    \ of Congressional Research Service\n\nEach element is discussed below.\n\n1)Investment\
    \ of Money\n\nThis is the simplest element of the Howey test. The language in\
    \ Howey required the investment to be made in “money,” but later court decisions\
    \ expanded the definition to include other types of property. To evaluate this\
    \ element, courts look to see whether the 168investor gives up “some tangible\
    \ and definable \\[property\\] in return for an interest that had substantially\
    \ the characteristics of a security.”[16](#section10.xhtml#ftn.51)\n\n2)Common\
    \ Enterprise\n\nIn Howey, the Court did not specify with whom an investor should\
    \ have a “common” enterprise, akin to a shared or common interest. In the years\
    \ since Howey, the US Supreme Court has avoided answering that question. That\
    \ left the job of determining what constituted a “common enterprise” to the lower\
    \ courts. Those courts had to decide what type of common interest would satisfy\
    \ the Supreme Court’s Howey test. To date, no uniformity exists among courts,\
    \ but three distinct commonality tests have emerged: horizontal, broad vertical,\
    \ and narrow vertical, each explained below.\n\nHorizontal Commonality\n\nHorizontal\
    \ commonality looks to the horizontal relationship among investors, analyzing\
    \ whether the investors pool their investments and share in the profits and risks\
    \ of the enterprise. This test is generally viewed as the most difficult to meet,\
    \ because it requires multiple investors pooling their funds in a common venture\
    \ and focuses on the relationship amongst investors. Some courts have also required\
    \ the profits and losses derived from the investment to be shared pro-rata.[17](#section10.xhtml#ftn.52)\
    \ The First,[18](#section10.xhtml#ftn.53) 169Second,[19](#section10.xhtml#ftn.54)\
    \ Third,[20](#section10.xhtml#ftn.55) Fourth,[21](#section10.xhtml#ftn.56) Sixth,[22](#section10.xhtml#ftn.57)\
    \ Seventh,[23](#section10.xhtml#ftn.58) Ninth,[24](#section10.xhtml#ftn.59) and\
    \ D.C.[25](#section10.xhtml#ftn.60) Circuit Courts of Appeal (Circuits) accept\
    \ horizontal commonality, and some of those courts have yet to rule on whether\
    \ they will accept other types of commonality.\n\nVertical Commonality\n\nVertical\
    \ commonality looks to the vertical relationship between investors and promoters,\
    \ analyzing the extent to which investors are dependent on the promoter’s efforts\
    \ or expertise. Courts differ on what is needed to show vertical commonality:\n\
    \nBroad Vertical Commonality\n\nSome courts require the investors’ fortunes to\
    \ be related to the promoter’s efforts or expertise. In such cases, so long as\
    \ the investors rely on the promoter’s efforts or expertise, there will be broad\
    \ vertical commonality. This is generally regarded as the easiest to satisfy.\
    \ Both the Fifth[26](#section10.xhtml#ftn.61) and Eleventh[27](#section10.xhtml#ftn.62)\
    \ Circuits require broad vertical commonality.\n\n170 \n\nNarrow Vertical Commonality"
