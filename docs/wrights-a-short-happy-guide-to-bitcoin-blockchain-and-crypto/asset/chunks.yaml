    尽管黄金的存流量比（stock-to-flow ratio）在历史上一直相对恒定，但比特币的存流量比被设定为不断增加。比特币的区块奖励每隔 `210,000`
    个区块减少一半——大约每四年一次。这种区块奖励的减半被称为“减半”（halving）。


    2020 年 5 月发生了一次减半，将区块奖励从每块 `12.5` 比特币降低到 `6.25` 比特币，从而将每年挖出的比特币数量减少到约 `328,500`
    个。2020 年 5 月的这次减半将比特币的存流量比翻倍到 `55` 左右，略低于黄金 `62` 的存流量比。到 2025 年（下一次减半的预计日期），存流量比将再次翻倍。届那时，除非金矿停止寻找黄金进行开采，否则比特币将拥有所有商品类资产中最高的存流量比。


    目前已经建立了多种通过存流量比来关联比特币价格的模型。这些模型在很大程度上显示，比特币的价格与使用存流量比模型所预期的高度相关。最受讨论的模型之一是由 PlanB
    在 Medium 上发布的，它显示出 `99.7%` 的相关系数（一种衡量模型与实际数据拟合程度的统计指标），并预测比特币价格在 2024 年期间或之前的某个时候将达到
    `$288,000`。PlanB 模型的一个较早且不简单的版本预测比特币价格在 2024 年期间或之前的某个时候将达到 `$55,000`。


    ## 比特币真正的价值主张是什么？


    这谁无法预知。许多人通过比特币的存流量比以及与黄金的各种对比和改进来解释比特币的价值主张。一些人则更进一步，声称比特币的特性最终使其能够取代黄金，成为一种价值存储资产。做出这种主张的人通常引用这样一个事实：黄金作为价值存储资产的作用，其核心无非仅仅是基于人们对其价值的信仰。根据这种论点，随着越来越多的人相信比特币，它将与黄金竞争，并可能取代黄金成为一种价值存储资产。


    显然，比特币的最终价值是一个投机性命题。然而，存在可以预测未来比特币可能价值多少的指标。由于我们处于投机领域，其中一种指标假设在未来的某个时刻，比特币和黄金将具有相同的价值。按照
    2020 年 1 月的估值（`1 BTC` = `$10,000`），比特币的市值约为 `$1810 亿`，而那四个奥林匹游泳池的黄金价值 `$7.8 万亿`，两者总计约为
    `$8 万亿`。在保持这 `$8 万亿` 不变的情况下，如果我们假设未来某个时刻 `$8 万亿` 被平分给比特币和黄金，那么所有 `2100 万` 个`比特币`
    的总价值将是 `$4 万亿`，即每枚比特币 `$380,952`。大致如此。


    ## 比特币的波动性


    在其短暂的历史中，比特币的价格一直波动。下方由 Coinbase 提供的图表显示了 2013 年到 2020 年 1 月的比特币价格，最高曾超过 `$20,000`，最低曾低于
    `$100`。


    ![](img/Image_39.jpg)


    比特币的波动性使其对于商家或消费者来说，无法作为交易媒介，因为其价值每天、每周都在波动。尽管如此，这种波动性以及价值的长期增长导致许多人将比特币视为一种投资或投机性的价值存储资产。


    下表显示了从下表列出的日期开始，投资 `$100` 比特币随时间产生的回报，直到 2019 年 12 月 31 日（当时比特币价值为 `$7,199.53`）。


    | 99 ![](img/Image_40.jpg)*比特币 直到 2013 年，比特币才开始在交易所上进行常规交易，2014 年之前的价格数据基于 CoinDesk
    比特币价格指数等来源。\*\*比特币在 2017 年 12 月达到最高价，略超过 20,000 美元。\*\*年化总收益是指如果收益进行复合计算将产生相同累计收益的收益，是投资在给定时间范围内每年赚得金额的几何平均值。
    |

    | --- |


    ## 比特币与政府


    比特币和其他加密货币的另一个重要价值因素是，它们在很大程度上免受政府干预。尽管政府可以制定法律，使其公民持有或使用比特币变得更加困难，但政府要实施完全的比特币令是非常困难的。即使被禁止，执行这种禁令也很困难。


    作为一个去中心化、无国界且世界上任何拥有互联网连接的人都可以访问的伪匿名系统，即使是最专政的政府在阻止其公民使用比特币方面的权力也非常有限。有些人将试图禁止或限制比特币的尝试与美国失败的禁毒战争相提。这场所谓的战争始于
    20 世纪 70 年代，当时尼松宣布滥用药物是“头号公敌”，但对改变毒品使用几乎没有作用；事实上，从 1973 年到 1977 年，美国的毒品使用量增加了一倍。遗憾的是，禁毒战争对美国和全球其他国家都产生了深远的负面影响：它增加了监狱人口，尽管少数裔和非少数裔人口之间的毒品使用没有显著差异，它却不成比例地将黑人和棕色人犯罪化，并导致了全球范围内数万起与毒品交易相关的谋杀，特别是在哥伦比亚和墨西哥。


    政府试图禁止比特币将明确两点：


    *   政府有兴趣限制其公民的自由；以及

    *   比特币必须是有价值的，否则政府为什么要禁止它？


    任何寻求禁止比特币的政府还将面临与禁止其他“刑法禁止性”（malum prohibitum）物品时面临的许多相同挑战，正如美国禁酒令期间的情况，以及目前在联邦和州级的娱乐性大麻法律方面面临的情况。


    截至 2019 年底，以下国家对比特币实施了某种形式的禁令：


    *   阿富汗

    *   阿尔及利亚

    *   玻利维亚

    *   孟加拉

    *   厄瓜多尔

    *   伊朗

    *   尼泊尔

    *   巴基斯坦

    *   沙特阿拉伯


    这些由少数人认为是热爱自由的政府统治的国家，其禁令缺乏一致性。有些国家完全禁止拥有比特币，而另一些国家禁止将比特币作为支付手段，对其公民拥有和交易的权利持开放或至少不作为。


    ## 作为比特币货币：隐私与伪匿名


    加密交易是伪匿名的，这意味着它们与公开数字地址相关，但没有直接关联到身份。那些公开地址是公钥的哈希版本，公钥是标识区块链地址的长数字字符串。要进行交易，用户既需要`公钥`也需要只有用户知道的`私钥`。`公/私钥`系统允许个人在不暴露身份的情况下进行交易，尽管个人的公钥在区块链上是可见的。


    ![加密私钥与公开地址](img/Image_41.jpg)


    图表由 bitira.com 提供


    尽管加密交易的设计旨在伪匿名，但由于所有交易都会留下数字足迹，数字侦探已经创建了通过所谓的“链分析”来关联交易的方法，链分析将公开的交易与特定的账户、活动、钱包并最终与个人联系起来。链分析的一个益处是执法机构，他们利用链分析成功发现并指控了罪犯。例如，2019
    年 10 月 16 日，司法部（DOJ）发布了以下新闻稿，摘录如下：


    ![](img/Image_42.jpg)

