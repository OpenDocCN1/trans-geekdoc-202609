  trans: "\n\n这些现实引发了我对比特币和区块链技术的兴趣，我的教育背景和职业经历也是如此。我在哈佛大学肯尼迪学院获得了公共政策硕士学位，侧重点是金融政策，并在芝加哥大学获得了法学学位。然而，我获得这些学位的道路绝非传统。\n\
    \n在法学院读完第一年后，我离开了学校，因为我意识到自己的教育中缺失了某些东西。在第一年里，我们经常要处理一些本质上是金融和经济政策问题的法律问题，而这些是我本科阶段所忽略的领域。\n\
    \n幸运的是，法学院的一位教授建议并鼓励我冒风险离开法学院去填补这些空白（要感谢 `Prof. Boldt`）。他的建议非常中肯：肯尼迪学院的金融政策课程正是我所需要的（幸运的是，数学并不是我本科阶段忽略的领域之一）。我在芝加哥大学完成了法学业，因为那里侧重于法律的经济分析，并由此开启了涉及金融、法律、公共政策以及这三者交汇点——税收的职业。\n\
    \n在职业生涯期间，我曾构建衍生品结构（在金融危机加剧之前），作为商业、税务和银行律师为客户提供建议，在美国司法部担任白领犯罪检察官代表我的国家（追捕那些偷窃穷人钱的富人），并在过去的十年里，一直担任法学教授。然而，直到我发现了比特币和区块链，这一切才汇聚在一起：金融、经济、法律、公共政策和博弈论，被整齐地封装在一个包中——这就是加密货币。\n\
