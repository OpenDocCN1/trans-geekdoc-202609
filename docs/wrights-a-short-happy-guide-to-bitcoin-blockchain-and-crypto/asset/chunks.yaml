    \ are not country-specific.\n\nThe assets of SDNs are blocked and US persons are\
    \ generally prohibited from dealing with them.\n\nUnintended Consequences of KYC\n\
    \nNotwithstanding privacy issues, some have argued that KYC requirements prevent\
    \ certain groups, particularly the poor and those without existing banking relationships\
    \ (the unbanked), from participating in the financial system. For example, between\
    \ 2011 and 2013, many banks in the UK and the US took the pre-emptive step of\
    \ closing all Somalia-based money service business accounts based on the risk\
    \ that those accounts could be linked to terror organizations like al-Shabaab,\
    \ which operated out of Somalia.\n\nThe closing of accounts meant that individuals\
    \ in the Somali diaspora living abroad could no longer send remittances back to\
    \ Somalia through UK or US banks. At the time, remittances from the US alone equaled\
    \ roughly $200 million per year, and accounted for roughly 40 percent of Somalia’s\
    \ gross domestic product.\n\nThe banks closed those accounts regardless of any\
    \ actual risk or evidence of illicit activities, in order to avoid potential fines\
    \ from FinCEN or the UK’s Financial Conduct Authority (FCA). The banks’ actions\
    \ had the effect of not only crippling an already weak economy, but also empowering\
    \ terror organizations.\n\nIn an April 11, 2015, New York Times editorial, US\
    \ Congressman Keith Ellison argued that blocking the remittances to places like\
    \ Somalia actually encouraged terror organizations. Congressman Ellison, as well\
    \ as other international organizations, have argued 142that remittances provide\
    \ financial support for families and serve as a vehicle for commercial trade,\
    \ thereby limiting the appeal of terror organizations. Moreover, by closing access\
    \ to money service businesses, international organizations cannot access funds\
    \ to support their humanitarian missions, further encouraging terror organizations.\n\
    \nFor many banks, however, the risk of FinCEN or FCA fines outweighed the benefits\
    \ of engaging in transactions with Somali entities. On average, banks charged\
    \ fees of approximately five percent per remittance, and processed between $1–$2\
    \ million per year of Somali remittances, generating roughly $50,000–$100,000\
    \ of fee revenue for the average bank. However, the potential fines from FinCEN\
    \ or FCA for being linked to a terror group such as al-Shabaab could have reached\
    \ into the tens or hundreds of millions.\n\nFunds Travel Rule, Privacy Coins and\
    \ Coinjoins\n\nAs noted in Part II, privacy coins and coinjoins frustrate a government’s\
    \ ability to track crypto transactions, by making parties to transactions appear\
    \ anonymous. FinCEN’s guidance states that originators or beneficiaries who use\
    \ a pseudonym or account that cannot be decoded by the receiving financial institution\
    \ are not in compliance with the Funds Travel Rule. Moreover, when a financial\
    \ intermediary knowingly accepts anonymity-enhanced crypto (such as privacy coins\
    \ or crypto that has been anonymized), financial intermediaries must not only\
    \ track the crypto through different transactions, but also implement procedures\
    \ to obtain the identity of the originator or beneficiary."
