    While gold’s stock-to-flow ratio has been relatively constant throughout history,
    bitcoin’s stock-to-flow ratio is programmed to increase. The Bitcoin block reward
    is reduced by half every `210,000` blocks—roughly every four years. That reduction
    in the block reward is called a halvening.


    A halvening occurred in May 2020 which decreased the block reward from `12.5`
    to `6.25` bitcoins per block, thereby reducing the number of bitcoins mined annually
    to roughly `328,500`. That May 2020 halvening doubled bitcoin’s stock-to-flow
    ratio to around `55`, just below gold’s stock-to-flow ratio of `62`. By 2025,
    the estimated date of the next halvening, the stock-to-flow ratio will again double.
    At that point, unless gold miners stop finding gold to mine, bitcoin will have
    the highest stock-to-flow ratio of any commodity asset.


    Various models have been created linking bitcoin’s price using stock-to-flow ratios.
    Those models, by and large, show that bitcoin’s price correlates well with what
    would be expected using a stock-to-flow model. One of the most discussed models,
    distributed on Medium by PlanB, shows a `99.7%` correlation coefficient (a statistical
    measure of how well the model fits the actual data), and predicts a bitcoin price
    of `$288,000` sometime in or before 2024. An earlier, less sophisticated version
    of PlanB’s model predicted a bitcoin price of `$55,000` sometime in or before
    2024.


    ## What is the true value proposition for Bitcoin?


    That is anyone’s guess. Many point to bitcoin’s stock-to-flow ratio and other
    comparisons to, and improvements on, gold to explain bitcoin’s value proposition.
    Some take that argument furtherter, claiming that bitcoin’s properties will eventually
    allow it to replace gold as a store of value asset. Those making that claim often
    cite the fact that gold’s role as a store of value asset is based, at its core,
    on little more than people’s belief in its value. As the argument goes, as more
    and more people believe in bitcoin, it will compete with and possibly supplant
    gold as a store of value asset.


    Clearly, the ultimate value of bitcoin is a speculative proposition. However,
    there are metrics to forecast how much bitcoin could be worth in the future. As
    we are in the realm of speculation, one such metric assumes that sometime in the
    future, bitcoin and gold will be equally valuable. At January 2020 valuations
    (`1 BTC` = `$10,000`), bitcoin’s market capitalization was roughly `$181 billion`
    and those four Olympic swimming pools of gold were worth `$7.8 trillion`, collectively
    making them both worth around `$8 trillion`. Holding that `$8 trillion` constant,
    if we assume some time in the future that `$8 trillion` is split equally between
    bitcoin and gold, then all `21 million` `bitcoins` would be collectively worth
    `$4 trillion`, or `$380,952` per bitcoin. More or less.


    ## Bitcoin volatility


    Throughout its short history, the price of bitcoin has been volatile. The chart
    below, courtesy of Coinbase, shows that the price of bitcoin from 2013 through
    January 2020, with a high price of over `$20,000` and a low of below `$100`.


    ![](Image_39.jpg)


    Bitcoin’s volatility makes it impracticable for merchants or consumers to use
    it as a medium of exchange, because from day-to-day and week-to-week the value
    fluctuates. Nevertheless, that volatility and the long-term increases in value
    have caused many to treat bitcoin as an investment or speculative store of value
    asset.


    The chart below shows the gross returns from investing `$100` in bitcoin over
    time, from the start dates listed below through December 31, 2019, when bitcoin
    was valued at `$7,199.53`.


    | 99 ![](Image_40.jpg)*Bitcoin was not regularly traded on exchanges until 2013,
    and pre-2014 price data are based on the CoinDesk Bitcoin Price Index, among other
    sources.\*\*Bitcoin reached its highest price, at just over $20,000, in December
    2017.\\*\*An annualized total return is the return that would produce the same
    cumulative return if the return was compounded, and is the geometric average amount
    of money earned by an investment each year over a given time period. |

    | --- |


    ## Bitcoin and Governments


    Another important value factor of bitcoin and other crypto is that they are largely
    immune from government intervention. Although governments can enact legislation
    making it more difficult for their citizens to hold or use bitcoin, it would be
    difficult for a government to implement a complete bitcoin ban. Even if banned,
    it would be difficult to enforce such a ban.


    As a decentralized, borderless, and pseudonymous system accessible to anyone in
    the world with an internet connection, even the most repressive governments have
    limited power to stop their citizens from using bitcoin. Some have compared an
    attempt to outlaw or limit bitcoin to the failed war on drugs in the United States.
    That so-called war, started in the 1970s when Nixon stated that drug abuse was
    “public enemy number one,” did little to change drug use; in fact, from 1973 to
    1977, drug use in the United States doubled. Unfortunately, the war on drugs had
    far-reaching negative effects both for the US and other nations around the globe:
    it increased the prison population, disproportionately criminalized black and
    brown citizens despite the fact that there is no significant difference in drug
    use between minority and non-minority populations, and led to tens of thousands
    of trafficking-related murders across the globe, particularly in Colombia and
    Mexico.


    A government attempt to ban Bitcoin would make clear two things:


    *   the government is interested in restricting the freedom of its citizens; and

    *   bitcoin must be valuable, else why would the government want to ban it?


    Any government seeking to ban Bitcoin would also face many of the same challenges
    faced when outlawing other malum prohibitum items, as was the case during Prohibition
    in the US, and is currently the case with respect to the disjointed federal and
    state recreational marijuana use laws.


    At the end of 2019, the following countries had imposed some type of ban on Bitcoin:


    *   Afghanistan

    *   Algeria

    *   Bolivia

    *   Bangladesh

    *   Ecuador

    *   Iran

    *   Nepal

    *   Pakistan

    *   Saudi Arabia


    Those countries, ruled by what few would consider freedom-loving governments,
    show little consistency in their bans. Some prohibit bitcoin ownership outright,
    while others prohibit bitcoin’s use as a means of payment, and are permissive
    or at least agnostic regarding their citizens’ rights to own and trade.


    ## Bitcoins as Money: Privacy and Pseudonymity


    Crypto transactions are pseudonymous, meaning they are linked to publicly available
    digital addresses but not directly to an identity. Those public addresses are
    hashed versions of public keys, which are long strings of numbers that identify
    blockchain addresses. To enter into a transaction, a user needs both the `public
    key` and a `private key` known only to the user. The `public/private key` system
    allows individuals to engage in transactions without revealing their identities,
    despite the individuals’ public keys being visible on the blockchain.


    ![Crypto private key vs. public address](Image_41.jpg)


    Graphic courtesy of bitira.com


    Although crypto transactions are designed to be pseudonymous, because all transactions
    leave a digital trail, digital sleuths have created ways to link transactions
    through what is called chain analytics, which links publicly visible transactions
    to specific accounts, activities, wallets, and ultimately, individuals. One beneficial
    use of chain analytics has been by law enforcement agencies who have used chain
    analytics to successfully find and charge criminals. For example, on October 16,
    2019, the Department of Justice (DOJ) issued the following press release, excerpted
    below:


    ![](Image_42.jpg)

