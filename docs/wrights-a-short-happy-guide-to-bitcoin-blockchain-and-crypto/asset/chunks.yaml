    ## Preface


    ### Why do we need crypto?


    For readers looking for an answer to that question, the best answer I have found
    is the essay, `A World Without Bitcoin`, by Alex Gladstein, Chief Strategy Officer
    at the Human Rights Foundation. That essay is available on the February 11, 2020
    Unchained podcast, hosted by Laura Shin, available and transcribed at [`www.unchainedpodcast.com/alex-gladstein-on-a-world-without-bitcoin/`](http://www.unchainedpodcast.com/alex-gladstein-on-a-world-without-bitcoin/).


    This book is not written to answer that question. Instead, it aims to give the
    reader three things:


    1) an overview of blockchains: how they work, how they are controlled, as well
    as the technological and policy challenges facing them;

    2) an explanation of the value proposition for blockchain technologies and cryptoassets
    (`crypto`); and

    3) an analysis of the laws that apply to crypto.


    Although there is a lot of hype surrounding blockchains, many technologies are
    still in their infancy. Nevertheless, because blockchains serve as trust machines
    that can limit the need for, and costs of, third-party intermediaries, the possible
    uses of the technology are limitless. Thus, it is important for entrepreneurs,
    lawyers, policy makers, and regulators to understand the technology and its applications.
    This book provides an on-ramp.


    *Better a diamond with a flaw than a pebble without.*

    —Confucius


    This is a fast-moving technological and legal area, and the goal of this book
    is to provide an introduction and overview. To that end, in attempting to explain
    largely technical areas in an understandable way, it was often necessary to simplify
    concepts to make them accessible to readers. That created a challenge in drawing
    the line between too simple and too detailed. As with most things in life, “the
    perfect is the enemy of the good,” and I hope this book strikes the right balance.


    Del Wright Jr.

    12 April 2020


