    The IRS claimed that it needed that information because it had found evidence
    of non-compliance with US tax laws by Coinbase customers, but could not determine
    the identities of those customers without the information from Coinbase. After
    receiving the summons, Coinbase refused to comply, and issued the following statement:


    “Although Coinbase’s general practice is to cooperate with properly targeted law
    enforcement inquiries, we are extremely concerned with the indiscriminate breadth
    of the government’s request. Our customers’ privacy rights are important to us
    and our legal team is in the process of examining the government’s petition. In
    its current form, we will oppose the government’s petition in court. We will continue
    to keep our customers informed on developments in this matter.”


    Coinbase eventually challenged the summons in federal court, arguing the request
    was overbroad.


    In the ensuing litigation, the IRS defended the summons by focusing on the problem
    of underreporting, noting:


    “There has been an explosion of billions of dollars of wealth in just a few years
    from bitcoin, a significant amount of which has no doubt accrued to United States
    taxpayers, with virtually no third-party reporting to the IRS of that increase
    in income,”


    and that some users of cryptocurrency:


    “have openly acknowledged they consider using bitcoin in order to avoid tax reporting
    requirements.”


    Ultimately, the court narrowed the scope of the summons and required Coinbase
    to produce only the taxpayer identification information (social security or tax
    identification number, birthdate, address) and account activity records of its
    crypto customers. The court also told the IRS that if it needed more detailed
    records on a specific taxpayer, the IRS could issue a summons directly to the
    taxpayer or to Coinbase with notice to the taxpayer.


    The IRS also stepped up its enforcement efforts in 2019. In July, it sent out
    three compliance-related letters based, in part, on the responses it received
    from the John Doe summonses. Those letters served as a warning to taxpayers to
    report their crypto transactions, with three levels of intensity. Some of the
    relevant language of each letter is included below:


    ### Letter 6174

    “We have information that you have or had one or more accounts containing virtual
    currency but may not know the requirements for reporting transactions involving
    virtual currency.”


    ### Letter 6174-A

    “We have information that you have or had one or more accounts containing virtual
    currency but may not have properly reported your transactions involving virtual
    currency.”


    ### Letter 6173

    “We have information that you have or had one or more accounts containing virtual
    currency and may not have met your US tax filing and reporting requirements for
    transactions involving virtual currency.” The `Letter 6173` also required taxpayers
    to file a response either amending a return or providing documentation supporting
    the reporting position they took on their return.


    ## A Privacy Issue


    The IRS efforts at gathering information have not been limited to requests from
    third-parties. In the `Schedule 1` for the 2019 tax year (the `Schedule 1` is
    often filed along with the standard tax returns using the `Form 1040`), the IRS
    has included the following question (the crypto question):


    “At any time during 2019, did you receive, sell, send, exchange, or otherwise
    acquire any financial interest in any virtual currency?”


    Because the `Form 1040` requires taxpayers to declare, under penalty of perjury,
    that the return and accompanying schedules are, to the best of a taxpayer’s knowledge,
    “true, correct, and complete,” the crypto question is tantamount to an IRS requirement
    that taxpayers disclose to the government whether they acquired crypto in 2019,
    regardless of whether they owe any crypto-related tax. In addition, responding
    inaccurately, or failing to answer the crypto question, could be considered filing
    a false tax return, a crime under `26 U.S.C. § 7206(1)`.


    The AICPA Letter asked the IRS to provide deneeded clarity on some of the issues
    raised by the crypto questions, including:


    1. If an individual moves virtual currency from one wallet to another and has
    no other transactions with virtual currency, what answer should they select (is
    this situation considered an exchange)?

    2. How should taxpayers report a virtual currency gift?

    3. How can taxpayers disclose transactions if they own an interest in a partnership
    but do not know if the partnership received, sold, sent, exchanged, or otherwise
    acquired any virtual currency? Or is the question specific to the individual `Form
    1040` taxpayer’s ownership (without considering any pass-through entity activity)?

    4. Should taxpayers who claim a child or dependent credit for someone involved
    in or possibly involved in gaming answer “yes”?

    5. When might certain gift cards or company online accounts constitute virtual
    currency for purposes of the new question?

    6. What does the term “financial interest” mean?

    7. Should an individual who holds a virtual currency but who did not use it during
    the year answer “yes”?


    A question analogous to the crypto question on tax returns is the requirement
    that taxpayers disclose ownership or control over foreign bank accounts. On the
    `Schedule B` that accompanies the `Form 1040`, question 7a asks:


    “At any time during 2019, did you have a financial interest in or signature authority
    over a financial account (such as a bank account, securities account, or brokerage
    account) located in a foreign country?”


    That foreign account question, like the crypto question, does not directly ask
    about taxable income, and instead asks only about ownership and control. Any authority
    the IRS has to ask the foreign bank question is derived from the `Bank Secrecy
    Act`, which requires US persons to file a `Report of Foreign Bank and Financial
    Accounts (FBAR)` if they have:


    1) financial interest in, signature authority or other authority over one or more
    accounts, such as bank accounts, brokerage accounts and mutual funds, in a foreign
    country; and

    2) the aggregate value of all foreign financial accounts exceeds $10,000 at any
    time during the calendar year.


    Taxpayers required to complete the `FBAR` generally must report their foreign
    financial accounts on a `Form 8938`, and file the form along with their `Form
    1040`.


    In the US, taxpayers are legally required to give the IRS enough information to
    calculate their taxes. However, if a taxpayer reports all crypto transactions,
    it is difficult to discern a legitimate reason for the crypto question, other
    than putting taxpayers on notice that the IRS is watching, and subjecting taxpayers
    to penalties if they answer incorrectly.


    From the IRS perspective, a likely rationale for the IRS inclusion of the crypto
    question may be found in an October 2019 keynote speech at the Brookings Institute
    by IRS Chief Counsel Michael Desmond entitled `Cryptocurrency and Tax Administration`.
    In that speech, Desmond noted that an estimated eight percent of US adults hold
    some form of crypto, and based on that, the IRS should receive roughly 12 million
    returns reporting crypto transactions. However, he stated the IRS received “nowhere
    near that” amount, and “we [the IRS] think there’s a high degree of non-compliance.”


    A related IRS disclosure issue is whether holders of crypto on foreign exchanges
    are also required to report their holdings on `Form 8938`. Under current law,
    it is unclear whether an account on a foreign crypto exchange would be considered
    an account at a foreign financial institution. In section `1471(d)(5)`, the Code
    defines a foreign financial institution as:

