  trans: '

    一个实体满足以下条件：(a) 在银行或类似业务的范围内接受存款，(b) 作为其业务的大部分，为他人持有“金融资产”，或(c) 主要从事（或自称从事）投资、再投资或交易证券、合伙权益、大商品或此类证券、合伙权益或大商品的任何权益的业务。


    `IRS` 尚未表明是否将外国加密货币交易所视为外国金融机构。如果他们决定这样做，美国纳税人将需要向 `IRS` 披露所有此类外国账户，无论是否涉及缴税。


    要求公民在 `Schedule 1` 和 `Form 8938` 上报告其加密货币持量的问题涉及隐私问题。虽然很清楚 `IRS` 可以要求公民报告任何来自加密货币的收益，并可以要求第三方中间机构向
    `IRS` 和纳税人报告此类收益，但政府并没有普遍权利强迫公民披露对任何合法资产的单纯所有权，无论是枪支、黄金还是加密货币。然而，通过在税表上包含有关加密货币所有权的问题，`IRS`
    似乎在迫使美国公民向政府披露私人财务信息，忽视了公民保持此类信息私密的权利。


    与加密货币问题相关的隐私和宪法问题，以及拒绝回答的影响令人困扰。在法律上，尚不清楚 `IRS` 在何种权限下可以强制回答加密货币问题。正如首席法官 `Roberts`
    在 `Rumsfeld v. Forum for Academic and Institutional Rights` 一案中提到的：


    “本法院的一些领先的第一法修正判例建立了一项原则，即言论自由禁止政府告诉人们必须说什么。”


    此外，在没有向法院证明对该信息有迫切需求的情况下，政府通常无法强迫个人披露某些私人信息，例如他们是否拥有任何加密货币。


    ## 国会行动


    2020 年 3 月，国会引入了一项名为《2020 年加密货币法案》的法案，旨在阐明哪些联邦机构应该监管加密货币。该法案建立了一个三部分的监管分类体系：


    1) 由 `CFTC` 监管的 `crypto-commodities`（加密大商品），

    2) 由 `FinCEN` 监管的 `crypto-currencies`（加密货币），以及

    3) 由 `SEC` 监管的 `crypto-securities`（加密证券）。


    《加密货币法案》是在 2018 年和 2019 年的《代币分类法案》之后，提供国会清晰度的第二次尝试，这两项法案均未通过。《代币分类法案》本可以 (i) 将加密货币排除在证券法之外，并
    (ii) 指导 `SEC`：


    “针对通过公钥加密保障的数字单位颁实施某些监管变化，调整个人退休账户中持有的虚拟货币的征税，为一种虚拟货币与另一种虚拟货币的交换创建税收豁免，为非现金出售或交换虚拟货币所实现的收益创建微额税收豁免，以及其他目的。”


    2019 年的《代币分类法案》在大多数方面与 2018 年的《法案》相似，但增加了一个条款，允许其在法律或法规与《法案》重叠或冲突的州取代州法律。该条款可能针对的是纽约备受批评的
    `BitLicense`（比特许可证）制度。然而，该条款也将取代更受好评的州法律，例如怀俄米州的法律。


    2018 年的《代币分类法案》最初由 `Rep. Warren Davidson` (R-OH) 发起，有五位共同发起人，包括三位民主党人和两位共和党人。`Rep.
    Davidson` 是 `国会区块链党团` 的成员，截至 2020 年 4 月，该党团两派至少有 20 名成员。根据他们的网站，他们是：


    “一个由国会议员和工作人员组成的跨党团体，他们相信区块链技术的未来，并理解国会在其发展中发挥作用。作为一个党团，我们决定采取一种不干预的监管方法，相信这项技术将像互联网一样通过自身最好地进化。”


    该 `党团` 经常对区块链和加密货币问题发声。


    `Rep. Patrick McHenry` (R-NC) 提供的另一份法案提供了一种不同的加密货币监管方法。`Rep. McHenry` 的法案并非寻求通过通过设定加密货币规则的自上而下法律，而是名为《金融服务创新法案
    (H.R. 4767)`）将强制联邦监管机构在其机构内部创建 `金融服务创新办公室 (FSIOs)`。这些 `FSIOs` 将为 `McHenry` 描述的创造创造一种“永久
    Beta 测试”机会，类似于英国 `金融行为监管局` 的监管沙箱方法。根据 `McHenry` 的说法，该《法案》将允许公司：


    在替代合规计划下提供创新产品或服务，该计划将对过时或负担过重的现行法规提供豁免或修改。我认为这是创造一个与金融创新合作而非与其对立的监管流程的必要步骤。


    `McHenry` 表示，这项立法是必要的，因为 `CFTC` 和 `SEC`，以及 `财政部` 和 `IRS` 需要提供某些确定性，以激励企业家不断提出有趣的创新的想法。


    没有知识的生命等同于伪装的死亡。

    —Talib Kweli, K.O.S.


    ## 备注


    1. “规则”在本节中将泛指美国和国外的法律、法规和其他指南。

    2. 洗钱是试图伪装非法活动收益的过程，试图使这些收益看起来源于合法来源。要了解洗钱实践的虚构但准确的刻画，请看 Netflix 剧《奥兹克》(Ozarks)。

    3. “资金旅行规则”可能在 2013 年被扩大适用于加密货币，但在缺乏关于其在加密货币领域特定指导的情况下，它一直被经常忽视。

    4. 没有银行关系，交易所很难运营。`Coinbase UK` 需要一个新的银行，因为 `Barclays` 断了与 `Coinbase UK` 的关系，多个来源称
    `Barclays` 的决定是因为对加密货币感到越来越不安。

    5. 一个在全球工作的独立非营利能力中心，旨在加强治理并打击腐败和其他金融犯罪。参见 `baselgovernance.org`。

    6. 《模型法案》本可以将加密货币视为“一般无形资产”，这是一个各种类型个人财产的统称。一般无形资产处理将使中间机构难以利用客户的加密货币获利，正如本节全文所述。

    7. 在该公告发布时，有五个州的法案正在立法机构审议，寻求实施部分或全部《模型法案》。然而，其中一个州（怀俄米州）颁布了与《模型法案》直接相反的法律。

    8. 一家名为 `Cede & Co.` 的公司是另一家公司 `托管信托公司 (Depository Trust Company)` 的代理，通常是客户股票的真实法律所有者，所有受益权益（如投票权和股利）首先流入代理持有者
    `Cede`，然后传递，最终传递给受益所有人。


