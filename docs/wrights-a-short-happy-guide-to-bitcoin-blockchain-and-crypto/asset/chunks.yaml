    not have done this without you.


    Next, I would like to thank Nancy for setting all motion. I would also like to
    thank the following, either knowingly or unknowingly, to bring it home:


    The Students

    Ryan, Jazmine, Austin, Dan, Madeline, Nate, and Kristen


    My Academic Colleagues

    Hinkes, Sarah, Vince, Dara, Megan, Imani, and Jason


    Crypto & Other Professionals

    Matthew Beck, Marissa Arnold, Ilya Tabakh, Jesus Rodriguez, Caitlin Long, Tinianow,
    Caty, Matt Odell, David Kintu, Shekhar Gupta, and Dale Werts


    Academic & Professional Institutions

    UMKC Law School and Law Review, Southeastern Association of Law Schools (SEALS),
    University of Arkansas Bowen of Law and Law Review, Harvard Kennedy School, Harvard
    Law School Forum on Corporate Governance, and Practicing Law Institute


    Lastly, a special thanks to Prof. Noel Myricks for pushing me, Prof. Richard Boldt
    for showing me the way, as well as Bibi, Chaun, and the Dels, for setting the
    bar high.


    On to the next one.

    —Jay Z


    ## About the Author


    My interest in this subject predates blockchains, and strangely enough, began
    with a question I asked myself when watching Star Trek: “What do they use for
    money?” Until bitcoin, I had no satisfactory answer.


    In the Star Trek universe, “money” as we know it did not exist, mostly because
    there was a device called a “replicator” that could reproduce any non-living thing,
    including money. Despite the existence of the replicator, people in the Star Trek
    universe needed services (haircuts, guitar lessons, etc.), which meant there had
    to be a way to motivate people to provide those services. The Star Trek Wiki answer
    is Latinum,


    > “a rare silver liquid used as currency by many worlds, most notably the Ferengi
    Alliance. Latinum cannot be replicated and the reasons for its rarity are unknown.”


    To me, that seemed like something the writers made up to explain what would otherwise
    be a logical gap.


    Then I learned about bitcoin—a non-reproducible digital asset that serves as a
    store of value, medium of exchange, and unit of account. Bitcoin became, and remains,
    the most robust answer to the question of what an advanced society would use for
    money.


    With the advent of more-advanced 3D printers and quantum computers, replicators
    may soon become reality. In fact, Mattershift, a technology startup with alumni
    from MIT and Yale, are reportedly working on replicator-type 3D printing technology
    using carbon nanotube membranes. Whether, and when, such technology is viable
    is anyone’s guess. However, one of the likely first uses of such a technology
    might be to replicate items that serve as stores of value, such as gold, diamonds,
    or cash.

