    \ of the most active crypto-backed stablecoins is DAI, a token that uses overcollateralization\
    \ and another token, Maker (MKR), to maintain a 1-to-1 peg to 118the dollar. Initially,\
    \ DAI were collateralized only by ETH (the Ethereum token), but in late 2019,\
    \ the Maker/DAI system was expanded to allow for other types of collateral, creating\
    \ multi-collateral DAI. The details of the Maker/DAI system are, quite frankly,\
    \ complicated, but an abbreviated version is included below.[14](#section9.xhtml#ftn.33)\n\
    \nHow DAI and MKR work: the VERY simplified version\n\nIf Bibi wants to create\
    \ DAI, Bibi would need to post crypto collateral and create a collateralized debt\
    \ position (CDP), which is a smart contract in the Maker/DAI system. The amount\
    \ of DAI created is based on the amount of collateral put into the CDP, and must\
    \ be greater than the amount of DAI to be created. For example, if the system\
    \ set the collateral ratio at 150 percent, then Bibi would have to post crypto\
    \ collateral worth $150 to mint (create) 100 DAI (worth $100).\n\nTo ensure that\
    \ the Maker/DAI system is robust enough to deal with the volatility of crypto,\
    \ the Maker/DAI developers added additional mechanisms designed to maintain the\
    \ peg between DAI and the dollar. Among those mechanisms are:\n\n1)a stability\
    \ fee, paid when the CDP is closed out (akin to the borrowing costs in the Stablebucks\
    \ example above);\n\n2)the ability to liquidate CDPs as necessary; and\n\n3)the\
    \ Maker token (MKR).[15](#section9.xhtml#ftn.34)\n\n119 \n\nIn the Maker/DAI system,\
    \ the CDPs collect a fee (stability fee), which is calculated against the total\
    \ amount of DAI minted and drawn against collateral held in a CDP. In the above\
    \ example, if Bibi, using her $150 in crypto collateral, minted and extracted\
    \ 100 DAI, the system would charge Bibi a stability fee based on the 100 DAI extracted.\n\
    \nThe stability fee is designed to address the risk of imbalances in supply and\
    \ demand for DAI to support the peg. For example, if DAI is consistently above\
    \ one dollar, it signals that demand for DAI is outweighing supply. At such time,\
    \ the stability fee (borrowing cost) could be lowered to incentivize people to\
    \ create CDPs and mint DAI, thereby increasing supply to meet demand.\n\nAlternatively,\
    \ if DAI is consistently below one dollar, it signals supply for DAI is outweighing\
    \ demand. At such time, the stability fee (borrowing cost) could be raised, which\
    \ increases the costs associated with minting and/or holding DAI, creating an\
    \ incentive for people to close out their CDPs and reduce supply. The stability\
    \ fee has seen significant fluctuation since the Maker/DAI system was created.\
    \ It was initially set at 0.5 percent and has reached a high of 20.5 percent.[16](#section9.xhtml#ftn.35)\n\
    \nThe most easily explained way the Maker/DAI system maintains the peg is by liquidating\
    \ CDPs if the value of the collateral falls below a certain threshold, thereby\
    \ reducing the risk that the crypto collateral could be worth less than the DAI\
    \ created based on that collateral. Each CDP is created based on the then-current\
    \ crypto prices, and the Maker/DAI system collectively is based on the weighted\
    \ average of all the crypto held in CDPs. Based on the example above, if the value\
    \ of the $150 of crypto collateral held in the CDP approached $100, the system\
    \ could sell the CDP before the price fell below $100 to ensure that the collateral\
    \ in the system 120would always be worth more than the $100 of DAI created by\
    \ that CDP.\n\nWhile the stability fee and the liquidation of CDPs work to keep\
    \ DAI pegged to the dollar in most circumstances, neither would work in the event\
    \ of a sudden large drop in crypto prices. In such cases, it might be impossible\
    \ to liquidate CDPs before the value in those CDPs fell below the amount of DAI\
    \ created, which would make it difficult or impossible to maintain the peg. To\
    \ address that risk, Maker/DAI system uses MKR tokens.\n\nMKR tokens are the governance\
    \ mechanism for the Maker/DAI system, and funds raised by issuing MKR tokens provide\
    \ additional collateral for the Maker/DAI system to maintain the peg. MKR token\
    \ holders, in addition to providing collateral to the system, are empowered to\
    \ vote on issues that affect the growth and stability of the Maker/DAI system.\
    \ That system incentivizes them to carefully monitor the system, and, in return,\
    \ earn fees for their work.\n\n[1](#section9.xhtml#ftnb.20)This section borrows\
    \ from an analysis by Matthew Beck, CFA, of Grayscale Investments, entitled, Bitcoin\
    \ & the Rise of Digital Gold.\n\n[2](#section9.xhtml#ftnb.21)Details of the creation\
    \ of the petrodollar agreement were first widely reported by Andrea Wong in a\
    \ May 2016 story in Bloomberg entitled, The Untold Story Behind Saudi Arabia’s\
    \ 41-Year U.S. Debt Secret.\n\n[3](#section9.xhtml#ftnb.22)This book is not intended\
    \ to support or refute that contention, but merely to present it because of its\
    \ widespread belief.\n\n[4](#section9.xhtml#ftnb.23)See Jeffrey Frankel, How a\
    \ Weaponized dollar Could Backfire, Harvard Kennedy School Belfer Center for Science\
    \ and International Affairs (Oct. 28, 2019).\n\n[5](#section9.xhtml#ftnb.24)See\
    \ PlanB, Bitcoin Stock-to-Flow Cross Asset Model, Medium (Apr. 27, 2020).\n\n\
    [6](#section9.xhtml#ftnb.25)African Americans and whites use drugs at similar\
    \ rates, but the imprisonment rate of African Americans for drug charges is almost\
    \ 6 times that of whites. In addition, though African Americans and Hispanics\
    \ make up approximately 32 percent of the US population, they comprised 56 percent\
    \ of all incarcerated people in 2015.\n\n[7](#section9.xhtml#ftnb.26)Malum prohibitum\
    \ is a Latin phrase referring to things or actions that are unlawful not because\
    \ they are necessarily bad or evil, but solely because a government has written\
    \ laws making those things or actions unlawful. In contrast, malum in se refers\
    \ to things or actions that are bad or evil in themselves. Non-government approved\
    \ gambling is an example of something that is malum prohibitum, and stealing from\
    \ a charity is an example of something that is malum in se.\n\n[8](#section9.xhtml#ftnb.27)Because\
    \ of the costs involved in mining with ASIC-powered machines, fewer users were\
    \ able to mine XMR, making the network more centralized and less secure. The new\
    \ consensus mechanism made it easier for computers using standard CPUs or GPUs\
    \ to mine XMR, thereby reducing the advantages of ASIC chips.\n\n[9](#section9.xhtml#ftnb.28)See\
    \ N° 1624, Assemblée Nationale, Rapport D’Information (Jan. 30, 2019).\n\n[10](#section9.xhtml#ftnb.29)This\
    \ example is adapted from Understanding Stablecoins from an Economist’s Perspective,\
    \ published by Jan Simek in the Good Audience blog on November 22, 2018.\n\n[11](#section9.xhtml#ftnb.30)Leverage\
    \ is a strategy of using other people’s property (OPP) to increase the potential\
    \ return from an investment. Leverage increases the risk of an investment because\
    \ OPP must be repaid whether the investment is profitable or not. Leverage has\
    \ been around for as long as people have borrowed money. Leverage has been around\
    \ for millennia, but the OPP concept was introduced to the world by Naughty by\
    \ Nature in 1991.\n\n[12](#section9.xhtml#ftnb.31)Ima Boss, Meek Mill featuring\
    \ Rick Ross, Dreamchasers (2011).\n\n[13](#section9.xhtml#ftnb.32) More formal\
    \ futures markets began in the 1700s when Japan organized the first rice futures\
    \ markets.\n\n[14](#section9.xhtml#ftnb.33)There are a number of other stability\
    \ mechanisms involved in the Maker/DAI system. In order to provide an overview\
    \ and keep this short, many of those mechanisms are omitted. However, for readers\
    \ who want a more thorough explanation of the Maker/DAI system, please read the\
    \ MakerDAO whitepaper, available at [https://‌makerdao.com/da/whitepaper/](https://makerdao.com/da/whitepaper/)."
