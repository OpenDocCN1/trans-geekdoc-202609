- raw: "3.Trading Volume Formula: any sales by parties affiliated with the issuer\
    \ cannot exceed one percent of the outstanding shares of the same class as the\
    \ securities being sold, or if listed on a stock exchange, the greater of one\
    \ percent or the average 192reported weekly trading volume during the four weeks\
    \ preceding the filing of a notice of sale.\n\n4.Ordinary Brokerage Transactions:\
    \ any sales by parties affiliated with the issuer must be handled in all respects\
    \ as routine trading transactions, and brokers may not receive more than a normal\
    \ commission. Neither the seller nor the broker can solicit orders to buy the\
    \ securities.\n\n5.Filing Requirement: parties affiliated with the issuer must\
    \ file a notice with the SEC if their proposed sale involves more than 5,000 shares\
    \ or the aggregate dollar amount is greater than $50,000 in any three-month period.\n\
    \nThe Exemptions\n\nReg A+\n\nThrough Reg A+ (sometimes called a mini-IPO), US\
    \ or Canadian issuers can raise up to $50 million in a 12-month period from an\
    \ unlimited number of non-accredited investors (the public) without registration\
    \ as a public offering. Reg A+ offerings are subject to SEC review and qualification,\
    \ and if approved, preempt state Blue Sky laws. Securities sold in a Reg A+ offering\
    \ are not considered restricted securities.[40](#section10.xhtml#ftn.75) However,\
    \ securities purchased pursuant to a Reg A+ exemption cannot be listed or quoted\
    \ on a securities exchange without registration.[41](#section10.xhtml#ftn.76)\n\
    \nReg A+ offerings have two tiers:\n\nTier 1:for offerings of up to $20 million\
    \ in a 12-month period; and\n\n193 \n\nTier 2:for offerings of up to $50 million\
    \ in a 12-month period.\n\nFor offerings of up to $20 million, companies can elect\
    \ to proceed under the requirements for either Tier 1 or Tier 2.\n\nAs part of\
    \ the Reg A+ approval process, a company can confidentially submit its offering\
    \ memorandum to the SEC, allowing the company to gauge the SEC’s reaction to the\
    \ exemption. In addition, before committing to a Reg A+ offering, the SEC will\
    \ allow a company to “test the waters” by polling its customers or the public\
    \ about the investment before the company commits to spending considerable time\
    \ and money on the SEC approval process.\n\nTesting the waters allows a company\
    \ to gauge the potential success of a Reg A+ offering in order to make an informed\
    \ decision on whether to move forward. In general, during a “test the waters”\
    \ campaign, a company invites potential investors (including customers) to indicate\
    \ their interest in the company’s securities. If there is not enough interest,\
    \ the company can avoid the costs involved in proceeding with the offering.\n\n\
    In theory, the Reg A+ process should allow a company to enjoy a streamlined, expedited\
    \ review process. In practice, however, the Reg A+ process has not been expedited\
    \ for crypto-securities. Historically, companies seeking to offer securities under\
    \ Reg A+ could expect approval within three months. However, despite the fact\
    \ that early crypto-securities projects filed requests to offer securities under\
    \ Reg A+ as early as mid-2017, no “true” crypto projects (see box below) were\
    \ approved until the Blockstack Reg. A+ approval in July 2019.\n\n| 194 The StartEngine\
    \ Reg A+ Qualified Approval![](Image_61.jpg)One crypto-based company that was\
    \ preliminarily approved to offer securities under Reg A+ was StartEngine, but\
    \ the conditions of that approval are such that it is generally not regarded as\
    \ a “true” crypto project. StartEngine, founded in 2014, claims to be the largest\
    \ US equity crowdfunding platform, whose mission is to help entrepreneurs achieve\
    \ their dreams by democratizing access to capital. In June 2018, StartEngine successfully\
    \ raised nearly $5 million in a standard (i.e., non-crypto) Reg A+ offering.After\
    \ that first Reg A+ offering, StartEngine sought approval to issue tokenized equity\
    \ securities under Reg A+. In its preliminary [offering circular for the tokenized\
