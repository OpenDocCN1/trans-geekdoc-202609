    an entity that (a) accepts deposits in the ordinary course of a banking or a similar
    business, (b) as a substantial portion of its business, holds “financial assets”
    for the account of the others, or (c) is engaged (or holds itself out as being
    engaged) primarily in the business of investing, reinvesting or trading in securities,
    partnership interests, commodities or any interests in such securities, partnership
    interests or commodities.


    The `IRS` has not indicated whether it considers foreign crypto exchanges as foreign
    financial institutions. If it decides to do so, US taxpayers would be required
    to disclose all such foreign accounts to the `IRS`, regardless of whether any
    taxes were due.


    The issues with requiring citizens to report their crypto holdings on both the
    `Schedule 1` and the `Form 8938` revolve around privacy. While it is certainly
    clear the `IRS` can require citizens to report any gains from crypto, and can
    require third-party intermediaries to report such gains to both the `IRS` and
    the taxpayers, there is no general right for the government to force citizens
    to disclose mere ownership of any legal assets, be they guns, gold, or crypto.
    However, by including questions about crypto ownership on tax forms, the `IRS`
    seemingly forces US citizens to disclose private financial information to the
    government, ignoring citizens’ rights to keep such information private.


    The privacy and constitutional issues related to the crypto question, and the
    implications for refusing to answer, are troubling. Legally, it is unclear under
    what authority the `IRS` can compel an answer to the crypto question. As noted
    by Chief Justice `Roberts` in `Rumsfeld v. Forum for Academic and Institutional
    Rights`:


    “Some of this Court’s leading First Amendment precedents have established the
    principle that freedom of speech prohibits the government from telling people
    what they must say.”


    Moreover, absent demonstrating to a court a compelling need for the information,
    the government cannot generally force individuals to disclose certain private
    information, like whether they own any crypto.


    ## Congressional Action


    In March 2020, a bill was introduced in Congress called the `Crypto-Currency Act
    of 2020`, which sought to clarify which federal agencies should regulate cryptocurrencies.
    The bill created a three-part taxonomy of regulation:


    1) `crypto-commodities` regulated by the `CFTC`,

    2) `crypto-currencies` regulated by `FinCEN`, and

    3) `crypto-securities` regulated by the `SEC`.


    The `Crypto-Currency Act` is the second attempt at providing congressional clarity,
    following the `Token Taxonomy Acts` of 2018 and 2019, neither of which were passed.
    The `Token Taxonomy Acts` would have (i) excluded crypto from the securities laws,
    and (ii) directed the `SEC` to:


    “enact certain regulatory changes regarding digital units secured through public
    key cryptography, to adjust taxation of virtual currencies held in individual
    retirement accounts, to create a tax exemption for exchanges of one virtual currency
    for an-other, to create a de minimis exemption from taxation for gains realized
    from the sale or exchange of virtual currency for other than cash, and for other
    purposes.”


    The 2019 `Token Taxonomy Act` was similar in most respects to the 2018 `Act`,
    but added a provision that would allow it to supersede state laws in states where
    laws or regulations overlapped or conflicted with the `Act`. That provision was
    likely aimed at New York’s much-criticized `BitLicense` regime. However, that
    provision would also supersede the more well-received state laws, such as those
    of Wyoming.


    The 2018 `Token Taxonomy Act` was originally sponsored by `Rep. Warren Davidson`
    (R-OH), with five co-sponsors, including three democrats and two republicans.
    `Rep. Davidson` is a member of the `Congressional Blockchain Caucus`, which, as
    of April 2020, had at least 20 members from both sides of the aisle. According
    to their website, they are:


    “a bi-partisan group of Members of Congress and Staff who believe in the future
    of blockchain technology, and understand that Congress has a role to play in its
    development. As a Caucus, we have decided on a hands-off regulatory approach,
    believing that this technology will best evolve the same way the internet did;
    on its own.”


    The `Caucus` often speaks out on blockchain and crypto issues.


    Another bill offered by `Rep. Patrick McHenry` (R-NC) offers a different approach
    to crypto regulation. Instead of seeking to pass top-down laws setting forth rules
    for crypto, `Rep. McHenry`’s bill, called the `Financial Services Innovation Act
    (H.R. 4767)`, would mandate that federal regulators create `Financial Services
    Innovation Offices (FSIOs)` within their agencies. Those `FSIOs` would create
    what `McHenry` describes as a “permanent beta testing” opportunity for companies,
    similar to regulatory sandbox approach taken by the UK’s `Financial Conduct Authority`.
    According to `McHenry`, the `Act` would allow companies:


    to provide innovative products or services under an alternative compliance plan,
    which would provide waivers or modifications to current regulations that are out
    of date or unduly burdensome. And I think this is a necessary step towards creating
    a regulatory process that works with financial innovation rather than against
    it.


    `McHenry` has stated the legislation is necessary because the `CFTC` and the `SEC`,
    as well as the `Treasury` and the `IRS`, need to promise some certainty to incentivize
    entrepreneurs to keep coming up with interesting innovative ideas.


    Life without knowledge is death in disguise.

    —Talib Kweli, K.O.S.


    ## Notes


    1. “Rules” will be used throughout this section generally to represent laws, regulations,
    and other guidance, both in the US and abroad.

    2. Money laundering is the process of attempting to disguise the proceeds of illegal
    activity in an attempt to make those proceeds appear to have originated from legitimate
    sources. For a fictionalized, but nonetheless accurate, portrayal of money laundering
    in practice, watch the Netflix series `Ozarks`.

    3. The `Funds Travel Rule` was arguably expanded to apply to crypto in 2013 with
    an amendment to include electronic funds transfers, but absent specific guidance
    regarding its application to crypto, it had been routinely ignored.

    4. Without a banking relationship, it is difficult for an exchange to operate.
    `Coinbase UK` needed a new bank because `Barclays` had severed its relationship
    with `Coinbase UK`, and multiple sources claimed `Barclays’ decision was based
    on the bank becoming increasingly uncomfortable with crypto.

    5. An independent not-for-profit competence centre working around the world to
    strengthen governance and counter corruption and other financial crimes. See `baselgovernance.org`.

    6. The `Model Acts` could have treated crypto as “general intangibles,” a catch-all
    category for various types of personal property. General intangible treatment
    would have made it more difficult for intermediaries to use their customers’ crypto
    to earn profits, as described throughout this section.

    7. At the time of that announcement, five states had bills moving through their
    legislatures seeking to enact parts, or all, of the `Model Acts`. However, one
    state, Wyoming, enacted laws directly in contrast to the `Model Acts`.

    8. A company called `Cede & Co.`, which is a nominee of another company called
    the `Depository Trust Company`, is often the true, legal owner of customer’s stocks,
    and all beneficial rights such as voting rights and dividends flow first to the
    nominee holder `Cede`, and then are passed onward, and ultimately to the beneficial
    owners.

