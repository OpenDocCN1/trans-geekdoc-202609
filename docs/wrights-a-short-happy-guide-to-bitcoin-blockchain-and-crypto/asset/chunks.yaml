- raw: "Peirce’s proposed safe harbor has been generally well-received by the crypto\
    \ community.\n\nSecurities Laws and Token Offerings\n\nMost crypto has historically\
    \ been offered to investors through Initial Coin Offerings (ICOs). An ICO is a\
    \ smart contract that executes a public sale of crypto tokens. ICOs are similar\
    \ to IPOs in most respects, except:\n\n*   1) ICOs are offered on a blockchain;\n\
    \n*   2) ICOs are offered through smart contracts;\n\n*   3) ICOs are generally\
    \ used for underfunded development projects that need money to move forward to\
    \ completion; and\n\n*   4) crypto tokens issued in an ICO are distributed directly\
    \ to investors’ accounts (crypto wallets), but generally are not immediately tradable\
    \ on an exchange.\n\nThe market for ICOs was huge in 2017 and 2018, with over\
    \ 3,000 ICOs and $6.2 and $7.8 billion raised respectively each year.[37](#section10.xhtml#ftn.72)\
    \ That market cooled in 2019, with end-of-year totals of just over $370 million.\n\
    \nBecause ICO tokens are held in individual crypto wallets, there was often no\
    \ readily-accessible market to trade those tokens after the ICO, leaving many\
    \ investors without a means to sell them. In order to provide a market for their\
    \ tokens, many ICO projects sought to have their tokens listed on an exchange.\
    \ Despite their efforts, 182roughly 90 percent of ICO projects were never listed\
    \ on an exchange.\n\nOne market response to the ICO token listing problem was\
    \ the introduction of Initial Exchange Offerings (IEOs), which are similar to\
    \ ICOs in all but one respect: IEO tokens are not issued to individual crypto\
    \ wallets, but instead are listed and immediately tradable on an exchange. That\
    \ allows investors to purchase IEO tokens through their existing exchange accounts,\
    \ and simplifies the fundraising details for issuers. Other benefits touted by\
    \ IEO proponents include:\n\nInvestor Protection\n\nBecause exchanges put their\
    \ reputations on the line in listing IEO tokens, exchanges are incentivized to\
    \ ensure that only reputable projects are listed. As a result, exchanges would\
    \ likely be viewed as having a duty to their stakeholders to perform enough due\
    \ diligence to ensure each project they list is legitimate.\n\nTradability and\
    \ Efficiency\n\nBecause investors can purchase tokens directly on the exchange,\
    \ investors are assured that the tokens will be tradeable. Thus, developers and\
    \ APs can focus more on the project and less on the fundraising and listing details.\n\
    \nPrice Transparency\n\nMany IEOs are structured so that the price of IEO tokens\
    \ are publicly announced prior to the token being listed, and that price remains\
    \ fixed during the IEO. That transparency eliminates the wild price speculation\
    \ that often accompanied ICOs.\n\nAlthough IEOs provide advantages to ICOs for\
    \ investors, according to the SEC, exchanges that facilitate IEOs may be breaking\
    \ US securities laws. At the May 2019 Consensus Conference in New York, 183the\
    \ SEC’s senior advisor for digital assets and innovation, Valerie Szczepanik,\
    \ stated that cryptocurrency exchanges that facilitate token sales to US customers\
    \ likely meet the legal definition of securities dealers, meaning they must follow\
    \ SEC registration and licensing requirements. Szczepanik added that:\n\n“If they\
    \ are not registered, they will find themselves in trouble in the US if they have\
    \ a US issuer or US buyers, \\[or\\] if they are operating on the US market.”\n\
    \nSEC Enforcement\n\nAfter The DAO Report was issued, the SEC began to take a\
    \ more aggressive enforcement position against entities that had offered what\
    \ it deemed were unregistered securities. Since 2017, the SEC has issued several\
    \ cease-and-desist to ICO issuers for offering unregistered securities, and many\
    \ crypto projects have either abandoned their offerings in the US, or placed limits\
    \ on US users to avoid SEC scrutiny. For example:\n\nThe Basis Stablecoin\n\n\
    ![Uncollateralized Stablecoins —Basis - Izak Fritz - Medium](Image_59.jpg)In December\
    \ 2018, the organizers of the Basis stablecoin project abandoned their project\
    \ and returned $133 million raised from investors, including Google Ventures,\
    \ Bain Capital Ventures, and Andreessen Horowitz. The organizers took those actions\
    \ after extended talks with the SEC led the organizers to conclude there was no\
    \ way to launch their ICO without violating the securities laws. On their website\
    \ (ww.basis.io), the organizers stated,\n\nAs regulatory guidance started to trickle\
    \ out over time, our lawyers came to a consensus that there would be no way to\
    \ avoid securities status for bond and share tokens and having to apply US securities\
    \ 184regulation to the system had a serious negative impact on our ability to\
    \ launch.\n\nThe Poloniex Exchange\n\n![Poloniex Exchange (@Poloniex) | Twitter](Image_60.jpg)In\
    \ May 2019, the crypto exchange Poloniex announced it would “geofence” (prohibit\
    \ activities of customers in a certain jurisdiction) nine crypto tokens due to\
    \ regulatory uncertainty regarding whether the SEC would deem those tokens securities\
    \ under US law. In explaining its action, the company wrote:\n\nSpecifically,\
    \ it is not possible to be certain whether US regulators will consider these assets\
    \ to be securities. We understand how frustrating this choice is for our customers,\
    \ and for the crypto community more broadly. We believe in the power and potential\
    \ of these assets, and will continue to focus time and energy on supporting positive\
    \ policy and regulatory developments for crypto assets in the US and around the\
    \ world.\n\nThe Kik litigation\n\nThe most comprehensive exploration of the SEC’s\
    \ and the crypto industry’s respective positions can be found by reviewing the\
    \ SEC’s litigation against Kik Interactive, Inc., SEC v. Kik Interactive.[38](#section10.xhtml#ftn.73)\
    \ Kik is a social media messaging company, that, along with its Kin Ecosystem\
    \ Foundation (Kin), launched a token (the Kin token) based on Kik’s messaging\
    \ app. In June 2019, the SEC filed a complaint alleging Kik conducted an illegal\
    \ $100 million token offering.\n\n185 \n\nThe Kik case is widely regarded as a\
    \ test case of the SEC’s position on crypto, for two reasons:\n\n1)Kik effectively\
    \ invited the SEC to sue by publicly replying to the SEC’s inquiries (called a\
    \ Wells Response);[39](#section10.xhtml#ftn.74) and\n\n2)Kik launched a campaign\
    \ aimed at creating a new Howey test for crypto, and organized a website ([www.defendcrypto.org](http://www.defendcrypto.org))\
    \ to crowdfund not only its lawsuit against the SEC, but also to assist other\
    \ crypto firms squaring off against the SEC.\n\nAccording to one of their lawyers,\
    \ among the reasons Kik chose to be a test was that:\n\nin the absence of the\
    \ SEC giving appropriate and clear guidance itself, this is really the only option,\
    \ . . . we certainly would have preferred for the SEC to have laid out clear guidelines\
    \ and guidelines that are consistent with the limits of their statutory authority.\
    \ They haven’t done that and so this is really the only way we can see to get\
    \ to that clarity and to get to the right result, but it will take some time.\n\
    \n—Patrick Gibbs, Attorney for Kik, Unchained Podcast (May 28, 2019)\n\nAn overview\
    \ of the significant facts and events in the Kik case is below:\n\n*   In August\
    \ 2017, Kik raised over $100 million in an ICO, weeks after the SEC had issued\
    \ a statement warning that “virtual coins or tokens may be 186securities,” but\
    \ offering no actual guidance on how such a determination should be made.\n\n\
    *   In November 2017, the SEC notified Kik that it was considering pursuing it\
    \ for violating US securities laws in its ICO.\n\n*   In December 2018, Kik &\
    \ Kin made public their Wells Response to the SEC, alleging that an enforcement\
    \ action was unwarranted. That submission argued, among other things, that:\n\n\
    (1)Kin was a currency, thus should not be considered a security; and\n\n(2)Kin\
    \ tokens were not investment contracts because:\n\n*   i) there was no “common\
    \ enterprise,” between Kik and Kin purchasers;\n\n*   ii) there was no expectation\
    \ of profits because Kin was sold based on its utility; and/or"
