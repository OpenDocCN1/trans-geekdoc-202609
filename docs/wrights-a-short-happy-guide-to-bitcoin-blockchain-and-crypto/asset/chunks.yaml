  trans: "\n\n统一法委员会（Uniform Law Commission）的回答是，中介机构持有的加密货币将被视为传统证券，这意味着中介机构将被视为真正的法律所有者。6\
    \ 根据《模型法案》，“通过银行、经纪人或其他中介机构间接持有”的加密货币被定义为“投资财产”，并将获得与 `UCC` 为间接持有证券提供的相同收益和保护。\n\
    \n统一法委员会将加密货币视为间接持有证券的决定并未获得加密社区的广泛支持。事实上，关于《模型法案》的辩论一直延续到 2019 年 3 月《福布斯》（Forbes）杂志的一系列文章。文章发表后不久，统一法委员会实际上撤回了《模型法案》，并公开宣布考虑采用该模型法案的州应克制采取，等待进一步研究。7\n\
    \n## 《模型法案》的问题在哪里？\n\n关于《模型法案》的主要冲突在于，商业法应当为谁提供最高级别的保护，这被称为“超级流通性”（super negotiability）。在\
    \ `UCC` 之下，超级流通性通常意味着持有人是真正的法律所有者，该所有者可以“自由且清晰”地出售资产，而不存在任何负担（通俗地说，就是没有 149 附加限制），除非购买者知道这些负担并采取了欺诈带有该负担方的方的行为。《模型法案》的方法是将这种保护提供给中介机构。加密社区的许多人认为，这种保护属于客户。\n\
    \n## 为什么超级流通性如此重要？\n\n超级流通性允许托管客户财产的中介机构借入和出借这些财产——并从中获利——可能在客户不知情或不同意的情况下进行。此外，通过赋予中介机构法律所有权，超级流通性意味着如果中介机构未能归还客户财产，客户仅剩下对中介机构的法律索赔。\n\
    \n加密货币超级流通性在实践中如何运作尚不清楚，但股票市场为这种比较提供了一个很好的起点。在美国，几乎所有通过经纪账户（如 `Schwab`、`eTrade`\
    \ 或 `Robinhood`）持有的公开交易股票都是以“街名”（street name）形式持有的，这意味着客户并不真正拥有其经纪账户中的股票。相反，客户是“其”股票的“受益”所有者，而其他实体才是该股票的真正的法律所有者。8\n\
    \n实施街名制度是因为它消除了在经纪人和客户之间不断转移实物股票的需要。对于投资者来说，街名制度允许更快的交易，同时让投资者拥有作为股东的所有权利和利益，而无需承担妥善实物股票证书免受丢失或盗窃的负担。9\n\
    \n150\n\n以街名形式持有的公开交易股票通常被经纪或其他或其他中介机构借入或出借，并在 2018 年产生了近 100 亿美元的收入。零售投资者通常无法获得这些收入的任何部分。然而，这些收入是过去二十年交易费用大幅减少的因素之一。\n\
    \n加密社区的许多人认为，针对加密货币的商业法不应赋予中介机构超级流通性的这种监管优势，特别是当区块链技术基于去中介化时（即减少或消除对中介机构需求的能力）。此外，许多人指出，向中介机构授予这种监管优势将在加密市场中产生与股票市场相同的低效性，并以\
    \ `Dole` 案（见下框）作为主要例子。\n\n| ![C:\\\\Users\\\\delwr\\\\AppData\\\\Local\\\\Microsoft\\\
    \\Windows\\\\INetCache\\\\Content.MSO\\\\87C3E9F3.tmp](img/Image_55.jpg)134 每\
    \ 100 股有 134 名股东 | 街名制度的问题在 2017 年的集体诉讼 `In re Dole Food Company`（`Dole`）中暴露暴露无遗。在\
    \ `Dole` 案中，原告指控公司股份被管理层低估。诉讼最终达成和解，`Dole` 的股东有权获得每股 2.74 美元。这就是事情变得有趣的地方。151\
    \ 在确定谁符合每股 2.74 美元时，法院首先确定有 3600 万股股份。随后，法院检查了经纪记录以确定这 3600 万股的所有者，经纪记录显示有 4900\
    \ 万股明显的 `Dole` 股票。 |\n| --- | --- |\n| 额外的 1200 万股是如何产生的？ | 经纪人和其他中介机构对所有权的记录不精确，以至于无法确定真实的所有者。\
    \ |\n\n`Dole` 案凸显了超级流通性的一个问题：它允许中介机构转移（买、卖、借、贷）“虚幻”证券，即中介机构并不拥有或控制的证券。在 `Dole`\
    \ 案中，虚幻证券就是那 1200 万股股份。\n\n针对统一法委员会决定赋予中介机构超级流通性的批评，委员会发布了一份声明，称《模型法案》并不要求加密货币所有者通过中介机构持有货币，而是这种使用完全是“自愿的”。然而，在《福布斯》中，Andrea\
    \ Tinianow——一位领先的 `UCC` 和加密货币律师（被称为“区块链女皇”）指出，如果希望获得 `UCC` 的保护，加密货币所有者必须将其权利交给中介机构。此外，根据\
    \ Tinianow 的，在没有明确合同的情况下，《模型法案会推断或创建客户与中介机构之间的合同。\n\n为了支持她的观点，Tinianow 指出了以下内容：\n\
    \n152 \n\n“在不存在符合[相关条款]的协议的情况下，执照人或注册人与用户之间的关系应确定为执照人或注册人与用户之间存在符合[相关条款]的协议，且该协议规定由州采纳的[UCC]\
    \ 适用。”补充强调\n\n## 到底发生了什么？\n\n你所有问题的答案都是钱。\n\n—Don Ohlmeyer，NBC 执行官\n\n"
