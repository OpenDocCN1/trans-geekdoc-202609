  trans: '


    *   `borrowing money`（短期有效，但如果没有经济增长，最终将需要加税或削减支出来偿还债务）；或

    *   `printing money`（这可能导致通货膨胀，损害所有公民的利益，因为流通中的货币丧失了购买力）。


    石油美元体系为美国和产油国实施财政政策提供了灵活性，因为简单来说，他们有更多的可用资金来解决问题。对于美国来说，石油美元让美国政府比其他国家拥有多得多的灵活性，能够在维持持续赤字和不断增加的国家债务的情况下，而不会产生负面的财政和货币后果。


    产油的石油美元国家既受益于它们从自然资源中获得的稳定美元，也受益于美国政府保护这些资源以及控制这些资源的政府的意愿。一些人认为，美国愿意（i）为像沙特阿拉伯和科威特等“友好”的欧佩组织（OPEC）国家提供军事支持，以及（ii）惩罚像入侵入侵前的伊拉克和伊朗等“不友好”的产油国，至少在部分是基于美国保护美元主权的利益。3


    为了强调第二个断言，许多人指向了 21 世纪 20 年代初伊拉克的状况：


    *   2000 年，在伊拉克威胁要停止所有石油出口（当时占全球供应量的约 5%）后，联合国（UN）允许由其当时的领导人萨达姆·侯赛因领导的伊拉克以欧元而非美元出售石油。

    *   在接下来的两年半里，欧元对美元升值。2000 年 10 月，当联合国批准伊拉克的请求时，欧元/美元的汇率约为 `1 US$` 兑 `0.84 EUR`。到
    2003 年 3 月初（入侵前夕），欧元已升值超过 43%，达到约 `1.07 EUR = 1 US$ `。

    *   2003 年，美国入侵了伊拉克。乔治·W·布什总统政府声称入侵是合理的，因为侯赛因获得了一个秘密的大规模杀伤性武器（`WMDs`）。在入侵后的 17
    年里，那批秘密的 `WMDs` 尚未被发现。

    *   在美军盟友重新控制伊拉克油田后，伊拉克石油合同再次以美元进行交易。


    ## 美元的武器化


    石油美元体系使美国在全球金融政策中具有了非凡的意义。4 美国政客有能力利用美元的力量将美国法律和政策的影响力延伸到其他国家。在奥巴马政府之后，据报道曾多次多次将美元力量武器化的尝试，包括
    2018 年禁止伊朗使用 `SWIFT`（见下框）。


    伊朗最早于 2012 年被奥巴马政府禁止使用 `SWIFT`，导致伊朗石油出口量从 2011 年的约 250 万桶减少到 2014 年的约 100 万桶。然而，在美、伊朗以及世界政府联盟和联合国安理会五个常任成员国同意
    2015 年的《全面行动计划》（伊朗核协议）后，`SWIFT` 禁令被解除，伊朗石油出口有所增加。


    | ![](img/Image_38.jpg)``SWIFT` 是总部位于比利时的国际银行金融电信协会。`SWIFT` 作为一个全球集体运营，连接了全球 200
    多个国家和地区的 11,000 多家银行、金融机构和公司。`SWIFT` 允许参与者安全地发送、接收和跟踪有关金融交易的信息。不参与或被禁止使用 `SWIFT`
    的国家在进行或接收国际支付方面的手段非常有限。 |


    | --- |


    2018 年 5 月 8 日，美国单方面废弃了伊朗核协议。不久后，美国政府开始施压 `SWIFT` 禁止伊朗银行。2018 年 11 月 5 日，`SWIFT`
    屈服了，并评论说该禁令是“遗憾的”，但为了避免美国制裁和维持国际银行业系统的稳定性是必要的。


    世界对美国单方面行动的挫败感显而易见，中国、欧洲和俄罗斯采取了措施来应对美国的行动，包括：


    *   中国直接与伊朗签署了为期 25 年的石油供应协议，允许中国使用人民币支付油款，从而完全绕过了石油美元体系。


    （注：原文在后续部分存在大量重复内容，译文已根据要求进行去重并保留核心逻辑。）

