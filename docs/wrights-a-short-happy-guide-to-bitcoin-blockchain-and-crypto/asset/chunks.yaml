- raw: "The Uniform Law Commission’s answer was that crypto held by intermediaries\
    \ would be treated like traditional securities, meaning the intermediaries would\
    \ be regarded as the true legal owners.[6](#section10.xhtml#ftn.41) Under the\
    \ Model Acts, crypto “held indirectly through a bank, broker or other intermediary”\
    \ was defined as “investment property” and would receive the same benefits and\
    \ protections provided for indirectly-held securities under the UCC.\n\nThe Uniform\
    \ Law Commission’s decision to treat crypto like indirectly-held securities was\
    \ not well-received by the crypto community. In fact, the debate about the Model\
    \ Acts spilled onto the pages of Forbes magazine in a March 2019 series of articles.\
    \ Soon after the articles were published, the Uniform Law Commission effectively\
    \ withdrew the Model Acts, publicly announcing that states considering adopting\
    \ the Model Acts should refrain from doing so, pending further study.[7](#section10.xhtml#ftn.42)\n\
    \nWhat was the issue with the Model Acts?\n\nThe main conflict over the Model\
    \ Acts was to whom commercial laws should provide the highest protection, called\
    \ “super negotiability.” Under the UCC, super negotiability generally means that\
    \ the holder is the true legal owner and that owner can sell assets held “free\
    \ and clear,” without any encumbrances (in lay terms, with no strings 149attached),\
    \ unless the purchasers knew about the encumbrances and acted to defraud the party\
    \ with the encumbrance. The Model Acts’ approach was to give that protection to\
    \ intermediaries. Many in the crypto community believed that protection belonged\
    \ to the customers.\n\nWhy is super negotiability so important?\n\nSuper negotiability\
    \ allows intermediaries who have custody of a customer’s property to borrow and\
    \ lend that property—and earn profits from doing so—potentially without the customer’s\
    \ knowledge or consent. In addition, by giving intermediaries legal ownership,\
    \ super negotiability means that customers are left only with a legal claim against\
    \ the intermediary if the intermediary fails to return the customers’ property.\n\
    \nHow crypto super negotiability would work in practice is unclear, but the stock\
    \ market provides a good starting point to make such a comparison. In the US,\
    \ almost all publicly traded stock held through brokerage accounts (such as Schwab,\
    \ eTrade or Robinhood) are held in “street name,” meaning a customer does not\
    \ actually own the stock in her or his brokerage account. Instead, customers are\
    \ “beneficial” owners of “their” stock, and some other entity is the true, legal\
    \ owner of the stock.[8](#section10.xhtml#ftn.43)\n\nThe street name system was\
    \ implemented because it eliminated the constant need to transfer physical stock\
    \ between brokers and customers. For investors, the street name system allows\
    \ for faster transactions while giving investors all the rights and benefits of\
    \ being a stockholder without the burden of keeping a physical stock certificate\
    \ safe from loss or theft.[9](#section10.xhtml#ftn.44)\n\n150 \n\nPublicly traded\
    \ stocks held in street name are often borrowed or lent by brokerages or other\
    \ financial intermediaries, and in 2018, generated revenues of nearly $10 billion.\
    \ Retail investors typically receive none of those revenues. However those revenues\
    \ are a contributing factor in the significant reduction in trading fees over\
    \ the last two decades.\n\nMany within the crypto community argued that commercial\
    \ law for crypto should not confer the regulatory advantage of super negotiability\
    \ on intermediaries, particularly when blockchain technologies are based on disintermediation,\
    \ i.e., the ability to reduce or eliminate the need for intermediaries. Moreover,\
    \ many pointed out that conferring that regulatory advantage on intermediaries\
    \ would create the same inefficiencies in the crypto market that occur in the\
    \ stock market, using the Dole case (see box below) as a prime example.\n\n| ![C:\\\
    \\Users\\\\delwr\\\\AppData\\\\Local\\\\Microsoft\\\\Windows\\\\INetCache\\\\\
    Content.MSO\\\\87C3E9F3.tmp](Image_55.jpg)134 Shareholders for every 100 SharesThe\
    \ problems with the street name system were on full display in the 2017 class\
    \ action lawsuit In re Dole Food Company (Dole). In Dole, the plaintiffs alleged\
    \ that shares of the company were undervalued by management at the time of an\
    \ acquisition. The lawsuit was ultimately settled, and Dole shareholders were\
    \ entitled to receive $2.74 per share. And that’s where things got interesting.151\
    \ In trying to determine who was eligible to receive the $2.74 per share, the\
    \ Dole court first determined that there were 36.8 million issued and outstanding\
    \ shares of Dole Foods stock. It next examined brokerage records to determine\
    \ the owners of those 36.8 million shares, and those brokerage records showed\
    \ there were 49.2 million apparently valid shares of Dole stock.What accounted\
    \ for the extra 12.6 million shares?Imprecise records of ownership by brokers\
    \ and other intermediaries, who had borrowed, lent, sold, and repurchased Dole\
    \ shares so often, with such shoddy recordkeeping, that it was impossible to precisely\
    \ determine the true owners of the shares. |\n\n| --- |\n\nThe Dole case highlights\
    \ one problem with super negotiability: it allows intermediaries to transfer (buy,\
    \ sell, borrow or lend) “phantom” securities, i.e., securities the intermediary\
    \ does not actually own or control. In Dole, the phantom securities were the 12.6\
    \ million shares that were listed as owned by customers but did not exist.\n\n\
    In response to the criticisms regarding the Uniform Law Commission’s decision\
    \ to give intermediaries super negotiability, the Commission issued a statement\
    \ claiming that the Model Acts did not require crypto owners to use intermediaries\
    \ to hold their crypto, but that such use is purely “voluntary.” However, in Forbes,\
    \ Andrea Tinianow, a leading UCC and crypto lawyer (and noted “Blockchain Czarina”)\
    \ pointed out that the Model Acts require crypto owners to relinquish their property\
    \ rights to intermediaries if they wish to avail themselves of the UCC’s protections.\
    \ In addition, according to Tinianow, in the absence of an explicit contract,\
    \ the Model Acts would infer or create a contract between a customer and an intermediary\
    \ even in circumstances where no contract exists.\n\nTo support her argument,\
    \ Tinianow noted the following language:\n\n152 \n\n“To the extent that there\
    \ is no agreement that complies with \\[the relevant section\\], the relationship\
    \ between a licensee or registrant and a user is determined as if the licensee\
    \ or registrant and the user have an agreement that complies with \\[the relevant\
    \ section\\] and specifies that the \\[UCC as adopted by the\\] state governs\
    \ the agreement.” \\[Emphasis supplied\\]\n\nThat language indicates that according\
    \ to the Model Acts, intermediaries would have the same rights that apply in traditional\
    \ securities markets, opening the door for Dole-type issues for crypto held through\
    \ intermediaries.\n\nWhat’s really going on?\n\nThe answer to all your questions\
    \ is money.\n\n—Don Ohlmeyer, NBC Executive\n\nAt its core, the debate is about\
    \ the ability of intermediaries to profit from their customers’ crypto. In testimony\
    \ by Uniform Law Commission Commissioner Keith Rowley to the Nevada Senate, Rowley\
    \ stated that he and his Commission colleagues were concerned about the lack of\
    \ financing opportunities for intermediaries due to the “the unavailability of\
    \ fractional reserve banking \\[for crypto\\].” In other words, the ability of\
    \ intermediaries to take risks and earn profits with their customers’ crypto."
