  trans: '


    如果有人好奇监管大宗商品和衍生品的 `CFTC` 为何会对担保贷款行使管辖权，原因非常简单：从经济角度来看，担保贷款（如上述的贷款）的运作方式与期货合约几乎完全相同。218
    两者都允许借款人/投资者通过杠杆获得资产的价格敞口，并且允许借款人/投资者从资产价格的上涨中获利。


    # 加密货币税与 IRS


    “税收无了我周围的一切，TREAM”

    ——安永信会计的 Ryan McNeil，引用 Wu Tang Clan 的话


    加密货币的征税在某些领域已经非常明确，但在另一些领域仍不一致或缺乏连贯性。一个明确的领域是，加密货币在税务目的上被视为财产。IRS 通过 `Notice 2014–21`（`Notice`）及其随附的常见问题解答（`FAQs`，与
    `Notice` 合称为 `2014 Guidance`）做出了这一裁定。`2014 Guidance` 广受欢迎，因为在它发布之前，尽管纳税人多次请求，美国纳税人倡导员
    54 以及一系列商业和专业团体，IRS 尚未对加密货币的税务处理发布过官方指南。


    五年后的 2019 年 10 月，IRS 发布了其第二份加密货币指南——`Revenue Ruling 2019–24`（`Rev. Rul. 2019–24`
    或 `Ruling`）以及随附的 `FAQs`（合称为 `2019 Guidance`）。IRS 指出，`2019 Guidance` 旨在扩展 `2014
    Guidance`。尽管 `2019 Guidance` 回答了许多关于加密货币税务处理的悬而的问题，但也引发了一系列新问题。


    2019 年 12 月，八位国会员致信给 `IRS` 局长 `Rettig`（`Congressional Letter`），要求对 `2019 Guidance`
    进行澄清，并指出：


    > [税法中的]模糊性阻碍了适当的税收合规，并不公平地针对了那些可能无法理解 `IRS` 在这些事项上所采取立场、但采取了合理立场（sic）的纳税人。55


    2020 年 2 月 28 日，美国注册会计师协会（`AICPA`）也起草了一封给 `IRS` 的信件（`AICPA Letter`），指出了需要额外或更新指南的特定领域。`Congressional
    Letter` 和 `AICPA Letter` 都强调并解决了 `2019 Guidance` 的重大缺陷。


    以下是对 `2014 Guidance` 和 `2019 Guidance` 的分析。


    ## 2014 Guidance


    `Notice` 回答了关于加密货币税务处理的基石问题之一：纳税人应该如何处理涉及加密货币的交易？`IRS` 的回答是，加密货币（被 `IRS` 称为“虚拟货币”56）将根据美国税法（`Code`）被视为财产。这意味着任何加密货币的出售或交换，无论规模大小，都是应纳税交易，并且必须在税表上申报。


    根据 `Code`，加密货币本可以被视为货币、大宗商品、证券或财产。通过选择将加密货币视为财产，`Code` 要求纳税人每当用加密货币交换任何财产时，纳税人必须报告与该交换相关的任何收益或亏损。这些收益或亏损通常通过从纳税人交换的加密货币的调整成本基础（见框）减去交换获得的任何财产的公平市场价值（`FMV`）算出。


    这个答案提供了清晰度，但并不令人满意。将加密货币视为财产意味着几乎每一次加密货币交易（包括使用加密货币在星巴克买咖啡）都可能是必须在税表上申报的应纳税交易。


    | 税务基准的基础 |

    | :--- |

    | 税务基准是税务目的下与财产相关的成本，用于计算出售、交换或其他处置财产时的收益或亏损。对于每一笔单独的加密货币购买，计算税务基准相对简单：加密货币的成本加上任何收购成本。然而，当涉及到出售或其他交换时，情况就会变得复杂一些，因为通常无法清楚具体是哪种加密货币被用于出售或交换。例如，假设
    `Bibi` 从 2011 年到 2020 年每年 1 月 1 日购买一个比特币，现在拥有 10 个比特币。如第二部分所述，这些比特币的购买价格范围从每枚比特币
    0.30 美元（2011 年 1 月的价格）到 13,657 美元（2018 年 1 月的价格）不等。这 10 个比特币中的每一个都根据其各自的购买价格拥有自己的税务基准。现在，如果
    `Bibi` 在 2020 年 1 月 2 日从 `Chaun` 那处用 4.5 个比特币买了一辆车，尽管 `Notice` 指导 `Bibi` 报告用一种财产（4.5
    个比特币）交换另一种财产（汽车），但它没有提供关于 `Bibi` 如何确定其 10 个比特币中哪 4.5 个被用于购买汽车的指导。 |


    虽然 `Notice` 回答了一个基础性的税务问题，但它未能解决许多其他问题，让纳税人只能自行摸索。在 `2014 Guidance` 发布后的五年里，美国律师协会（`ABA`）和
    `AICPA` 都针对其中许多悬而未决的问题向 `IRS` 请求了额外指南。其中一个问题是硬叉的税务处理，`ABA` 和 `AICPA` 都认为这是纳税人面临的最紧迫留问题之一。


    2019 年 5 月 16 日，`IRS` 局长 `Rettig` 承认了由于 `IRS` 未提供额外指南而产生的问题，并向国会致信，表示新的加密货币指南是优先事项。`Rettig`
    局长的信是回复 21 位国会员的请求，他们要求 `IRS` 对加密货币税务申报提供澄清，指出关于加密货币联邦税的重要问题存在“大量模糊性”。


    在 `Rettig` 的回复中，他表示：“我赞同纳税人对加密货币交易基本问题的要求的看法，并已将其作为 `IRS` 的优先事项。”`Rettig` 补充说，`IRS`
    正在研究的问题之一是“确定硬叉处理的可接受方法”。该指南于 2019 年 10 月发布。


    ## 2019 Guidance


    `Rev. Rul. 2019–24` 处理了硬叉和空投的税务处理。在此过程中，它还处理了这两者的共同子问题：在硬叉或空投获得新加密货币后，在什么情况下纳税人需要报告有关新加密货币的收入。`Rev.
    Rul. 2019–24` 同期发布的 `FAQs` 为许多技术税务问题提供了指导，其中包括对纳税人最重要的问题之一：他们应该如何计算加密货币的税务基准。


    ### 硬叉的税务处理


    `Rev. Rul. 2019–24` 将硬叉定义为“当[区块链]57 上的[加密货币]发生协议更改，导致永久偏离旧或现有[区块链]时发生的情况。”在项 `Ruling`
    中，`IRS` 明确了其立场：如果纳税人在硬叉后对新币具有“支配和控制权”，则当该新币记录在新区块链上时，纳税人将拥有相当于新币公平市场价值的应纳税收入。`IRS`
    包含了“支配和控制权”这一说法，以便纳税人在通过交易所或其他中介持有加密货币，而该中介并未列出或支持该新加密货币的情况下不会被征税。58 在此类情况下，`Ruling`
    指出由于此类纳税人无法立即消费或转账这些新的未列出/不支持的币，他们不需要确认与这些币相关的收入。


    ### 空投的税务处理


