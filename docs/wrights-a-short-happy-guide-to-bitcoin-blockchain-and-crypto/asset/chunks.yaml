    Matthew Beck, Marissa Arnold, Ilya Tabakh, Jesus Rodriguez, Caitlin Long, Tinianow,
    Caty, Matt Odell, David Kintu, Shekhar Gupta, 和 Dale Werts


    学术与专业机构

    UMKC 法学院及法律评论杂志、东南法学院协会 (SEALS)、阿肯色州大学鲍恩法学院及法律评论、哈佛肯尼迪学院、哈佛法学院公司治理论坛以及实务法律学院 (PLI)。


    最后，特别感谢 Noel Myricks 教授的推动，感谢 Richard Boldt 教授的指引，以及感谢 Bibi、Chaun 和 Dels 一家人设定了高标准。


    下一个目标。

    —Jay Z


    ## 关于作者


    我对这个主题的兴趣早于区块链，奇怪的是，这始于我在看《星际迷航》时问的问题：“他们用什么当钱？”在比特币出现之前，我还没有满意的答案。


    在《星际迷航》宇宙中，不存在我们所熟知的“钱”，因为有一种被称为“复制器”的设备，可以复制任何非生物物品，包括货币。尽管有复制器，《星际迷航》宇宙中的人仍然需要服务（如理发、吉他课等），这意味着必须有一种方式来激励人们提供这些服务。《星际迷航》百科的答案是液态金，


    > “一种稀有的银色液体，被许多世界用货币，最著名的是费奇联盟。液态金无法复制，其稀有原因未知。”


    对我来说，这似乎是剧作家们为了解释一个逻辑漏洞而编造出来的。


    后来，我了解了比特币——一种不可复制的数字资产，作为价值存储手段、交换媒介和会计单位。比特币成为并仍然是关于先进社会将使用什么当钱的问题的最强有力的答案。


    随着更先进的 3D 打印机和量子计算机的出现，复制器可能很快变成现实。事实上，来自麻理工和耶鲁大学校友的科技初创公司 Mattershift 正在开发使用碳纳米管膜的复制器型
    3D 打印技术。这种技术是否以及何时可行，无人能预知。然而，这种技术可能的首批用途之一可能是复制作为价值存储的物品，如黄金、钻石或现金。


