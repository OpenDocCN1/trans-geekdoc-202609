    \ in the chapter. The Kik case is widely regarded as the most important test case\
    \ for securities regulation of crypto.\n\n3)Reasonable Expectation of Profits\
    \ Derived from Efforts of Others\n\nAfter joining the final two Howey elements,\
    \ the Framework then separates them into (i) reliance on the efforts of others,\
    \ and (ii) reasonable expectation of profits. Mirroring the Framework, those are\
