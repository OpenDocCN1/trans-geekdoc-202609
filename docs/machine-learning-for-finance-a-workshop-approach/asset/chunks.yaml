    # Q-learning parameters  \n\nalpha = 0.1  \\# learning rate  \n\ngamma = 0.95 \
    \ \\# discount factor  \n\nepsilon = 1.0  \\# exploration rate  \n\nepsilon\\\
    _min = 0.01  \n\nepsilon\\_decay = 0.995  \n\nq\\_table = np.zeros((len(prices),\
