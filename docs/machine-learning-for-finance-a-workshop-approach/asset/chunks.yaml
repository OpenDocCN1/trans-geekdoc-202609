- fmt: "\nIn this chapter, we introduced reinforcement learning and its core concepts.\
    \ We built a simple `Q-learning` agent to trade stocks and discussed advanced\
    \ RL algorithms. Reinforcement learning offers powerful tools for making decisions\
    \ in dynamic environments, making it highly relevant for applications in finance.\
    \ In the next chapter, we'll explore how to combine different machine learning\
    \ techniques to build robust financial models.\n\n***\n\n# Chapter 7: Combining\
    \ Machine Learning Techniques\n\n## 7.1 Introduction\nAs we advance further into\
    \ the realm of machine learning, it becomes increasingly important to leverage\
    \ the strengths of different techniques. In this chapter, we'll explore how to\
    \ combine various machine learning approaches to build more robust and effective\
    \ financial models. This includes stacking, blending, and ensemble learning.\n\
    \n## 7.2 Ensemble Learning\nEnsemble learning involves combining multiple models\
    \ to improve the overall performance. The idea is that a group of weak learners\
    \ can come together to form a strong learner.\n\n### Workshop Activity 7.2.1:\
    \ Understanding Ensemble Methods\n Ensemble methods can be broadly categorized\
    \ into bagging and boosting.\n\n- **Bagging**: Averages predictions from multiple\
    \ models to reduce variance (e.g., `Random Forest`).\n- **Boosting**: Sequentially\
    \ builds models to correct the errors of previous models (e.g., `Gradient Boosting`).\n\
    \n**Example**: Let's revisit the `Random Forest` and `Gradient Boosting` models\
    \ we used earlier and see how they perform when combined.\n\n## 7.3 Stacking\n\
    Stacking involves training a new model to combine the predictions of several base\
    \ models. This meta-model learns how to best combine the outputs of the base models\
    \ to improve overall performance.\n\n### Workshop Activity 7.3.1: Implementing\
    \ Stacking\nWe'll implement stacking using `scikit-learn`.\n\n```python\nfrom\
    \ sklearn.ensemble import StackingClassifier  \n\n# Define base models\nbase_models\
    \ = [\n    ('log_reg', LogisticRegression()),\n    ('rf', RandomForestClassifier(n_estimators=100))\n\
    ]\n\n# Define meta-model\nmeta_model = GradientBoostingClassifier(n_estimators=100)\n\
    \n# Create stacking classifier\nstacking_clf = StackingClassifier(estimators=base_models,\
    \ final_estimator=meta_model, cv=5)\n\n# Train stacking model\nstacking_clf.fit(X_train_scaled,\
    \ y_train)\n\n# Make predictions\ny_pred_stack = stacking_clf.predict(X_test_scaled)\n\
    \n# Evaluate the model\naccuracy_stack = accuracy_score(y_test, y_pred_stack)\n\
    print(f'Stacking Classifier Accuracy: {accuracy_stack * 100:.2f}%')\n```\n\n##\
    \ 7.4 Blending\nBlending is similar to stacking but typically uses holdout validation.\
    \ A part of the training data is held out and used to make predictions with the\
    \ base models, which are then used as features to train the meta-model.\n\n###\
    \ Workshop Activity 7.4.1: Implementing Blending\nWe'll implement a simple blending\
    \ approach.\n\n```python\n# Split training data for blending\nX_blend_train, X_blend_holdout,\
    \ y_blend_train, y_blend_holdout = train_test_split(X_train_scaled, y_train, test_size=0.2,\
    \ random_state=42)\n\n# Train base models on the training set\nbase_model_1 =\
    \ LogisticRegression().fit(X_blend_train, y_blend_train)\nbase_model_2 = RandomForestClassifier(n_estimators=100).fit(X_blend_train,\
    \ y_blend_train)\n\n# Make predictions on the holdout set\npred_1 = base_model_1.predict(X_blend_holdout)\n\
    pred_2 = base_model_2.predict(X_blend_holdout)\n\n# Combine predictions\nblend_train\
    \ = np.column_stack((pred_1, pred_2))\n\n# Train meta-model on combined predictions\n\
    meta_model = GradientBoostingClassifier(n_estimators=100).fit(blend_train)\n\n\
    # Make predictions on the test set using base models\ntest_pred_1 = base_model_1.predict(X_test_scaled)\n\
    test_pred_2 = base_model_2.predict(X_test_scaled)\n\n# Combine test predictions\n\
    blend_test = np.column_stack((test_pred_1, test_pred_2))\n\n# Make final predictions\
    \ with meta-model\nfinal_pred = meta_model.predict(blend_test)\n\n# Evaluate the\
    \ model\naccuracy_blend = accuracy_score(y_test, final_pred)\nprint(f'Blending\
    \ Accuracy: {accuracy_blend * 100:.2f}%')\n```\n\n## 7.5 Model Selection and Evaluation\n\
    Choosing the right combination of models and evaluating their performance is crucial.\
    \ We'll use cross-validation and other metrics to ensure our ensemble models are\
    \ performing.\n\n### Workshop Activity 7.5.1: Cross-Validation and Model Evaluation\n\
    ```python\nfrom sklearn.model_selection import cross_val_score\n\n# Evaluate base\
    \ models\nscores_log_reg = cross_val_score(LogisticRegression(), X_train_scaled,\
    \ cv=5, scoring='accuracy')\nscores_rf = cross_val_score(RandomForestClassifier(n_estimators=100),\
    \ X_train_scaled, cv=5, scoring='accuracy')\nprint(f'Logistic Regression Cross-Validation\
    \ Accuracy: {np.mean(scores_log_reg) * 100:.2f}%')\nprint(f'Random Forest Cross-Validation\
    \ Accuracy: {np.mean(scores_rf) * 100:.2f}%')\n\n# Evaluate stacking and blending\
    \ models\nscores_stack = cross_val_score(stacking_clf, X_train_scaled, cv=5, scoring='accuracy')\n\
    print(f'Stacking Cross-Validation Accuracy: {np.mean(scores_stack) * 100:.2f}%')\n\
    ```\nNote: Blending evaluation typically requires a custom approach due to holdout\
    \ set usage.\n\n## 7.6 Real-World Application: Portfolio Optimization\nEnsemble\
    \ methods can be particularly powerful in portfolio optimization, where the goal\
    \ is to maximize returns while minimizing risk. By combining predictions from\
    \ various models, we can create a robust investment strategy.\n\n### Workshop\
    \ Activity 7.6.1: Implementing Ensemble Methods for Portfolio Optimization\n```python\n\
    import pandas as pd\nimport numpy as np\nfrom sklearn.model_selection import train_test_split\n\
    from sklearn.linear_model import LogisticRegression\nfrom sklearn.ensemble import\
    \ RandomForestClassifier, GradientBoostingClassifier, StackingClassifier\nfrom\
    \ sklearn.metrics import accuracy_score\n\n# Load financial data (this is a placeholder,\
    \ replace with actual data)\ndata = pd.read_csv('financial_data.csv')\nfeatures\
    \ = data.drop(columns=['target'])\ntarget = data['target']\n\n# Split data into\
    \ training and test sets\nX_train, X_test, y_train, y_test = train_test_split(features,\
    \ target, test_size=0.2, random_state=42)\n\n# Define base models\nbase_models\
    \ = [\n    ('log_reg', LogisticRegression()),\n    ('rf', RandomForestClassifier(n_estimators=100))\n\
    ]\n\n# Define meta-model\nmeta_model = GradientBoostingClassifier(n_estimators=100)\n\
    \n# Create stacking classifier\nstacking_clf = StackingClassifier(estimators=base_models,\
    \ final_estimator=meta_model, cv=5)\n\n# Train stacking model\nstacking_clf.fit(X_train,\
    \ y_train)\n\n# Make predictions\ny_pred_stack = stacking_clf.predict(X_test)\n\
    \n# Evaluate the model\naccuracy_stack = accuracy_score(y_test, y_pred_stack)\n\
    print(f'Stacking Classifier Accuracy: {accuracy_stack * 100:.2f}%')\n\n# Implement\
    \ blending (as demonstrated in previous example)\n```\n\n## 7.7 Conclusion\nIn\
    \ this chapter, we explored various methods to combine machine learning models,\
    \ such as stacking and blending. These techniques help enhance the robustness\
    \ and performance of our models, making them more suitable for complex financial\
    \ applications. In the next chapter, we will dive into time series analysis and\
    \ forecasting, which are crucial for financial modeling.\n\n***\n\n# Chapter 8:\
    \ Time Series Analysis and Forecasting\n\n## 8.1 Introduction\nTime series analysis\
    \ and forecasting are essential in finance, where we often deal with sequential\
    \ data such as stock prices, interest rates, and economic indicators. In this\
    \ chapter, we will explore the fundamentals of time series analysis, various forecasting\
    \ techniques, and their applications in finance.\n\n## 8.2 Understanding Time\
    \ Series Data\n"
