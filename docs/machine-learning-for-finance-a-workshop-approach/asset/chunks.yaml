    \  \n\nprint(f'Stacking Classifier Accuracy: {accuracy\\_stack \\* 100:.2f}%')\
    \ |\n\n| --- |\n\n# 7.4 Blending\n\nBlending is similar to stacking but typically\
    \ uses holdout validation. A part of the training data is held out and used to\
    \ make predictions with the base models, which are then used as features to train\
    \ the meta-model.\n\nWorkshop Activity 7.4.1: Implementing Blending We'll implement\
    \ a simple blending approach.\n\n| \\# Split training data for blending  \n\n\
    X\\_blend\\_train, X\\_blend\\_holdout, y\\_blend\\_train, y\\_blend\\_holdout\
    \ = train\\_test\\_split(X\\_train\\_scaled, y\\_train, test\\_size=0.2, random\\\
    _state=42)  \n\n\\# Train base models on the training set  \n\nbase\\_model\\\
    _1 = LogisticRegression().fit(X\\_blend\\_train, y\\_blend\\_train)  \n\nbase\\\
    _model\\_2 = RandomForestClassifier(n\\_estimators=100).fit(X\\_blend\\_train,\
    \ y\\_blend\\_train)  \n\n\\# Make predictions on the holdout set  \n\npred\\\
    _1 = base\\_model\\_1.predict(X\\_blend\\_holdout)  \n\npred\\_2 = base\\_model\\\
    _2.predict(X\\_blend\\_holdout)  \n\n\\# Combine predictions  \n\nblend\\_train\
    \ = np.column\\_stack((pred\\_1, pred\\_2))  \n\n\\# Train meta-model on combined\
    \ predictions  \n\nmeta\\_model = GradientBoostingClassifier(n\\_estimators=100).fit(blend\\\
    _train, y\\_blend\\_holdout)  \n\n\\# Make predictions on the test set using base\
    \ models  \n\ntest\\_pred\\_1 = base\\_model\\_1.predict(X\\_test\\_scaled)  \n\
    \ntest\\_pred\\_2 = base\\_model\\_2.predict(X\\_test\\_scaled)  \n\n\\# Combine\
    \ test predictions  \n\nblend\\_test = np.column\\_stack((test\\_pred\\_1, test\\\
    _pred\\_2))  \n\n\\# Make final predictions with meta-model  \n\nfinal\\_pred\
    \ = meta\\_model.predict(blend\\_test)  \n\n\\# Evaluate the model  \n\naccuracy\\\
    _blend = accuracy\\_score(y\\_test, final\\_pred)  \n\nprint(f'Blending Accuracy:\
    \ {accuracy\\_blend \\* 100:.2f}%') |\n\n| --- |\n\n# 7.5 Model Selection and\
    \ Evaluation\n\nChoosing the right combination of models and evaluating their\
    \ performance is crucial. We'll use cross-validation and other evaluation metrics\
    \ to ensure our ensemble models are performing well.\n\nWorkshop Activity 7.5.1:\
    \ Cross-Validation and Model Evaluation\n\n| from sklearn.model\\_selection import\
    \ cross\\_val\\_score  \n\n\\# Evaluate base models  \n\nscores\\_log\\_reg =\
    \ cross\\_val\\_score(LogisticRegression(), X\\_train\\_scaled, y\\_train, cv=5,\
    \ scoring='accuracy')  \n\nscores\\_rf = cross\\_val\\_score(RandomForestClassifier(n\\\
    _estimators=100), X\\_train\\_scaled, y\\_train, cv=5, scoring='accuracy')  \n\
    \nprint(f'Logistic Regression Cross-Validation Accuracy: {np.mean(scores\\_log\\\
    _reg) \\* 100:.2f}%')  \n\nprint(f'Random Forest Cross-Validation Accuracy: {np.mean(scores\\\
    _rf) \\* 100:.2f}%')  \n\n\\# Evaluate stacking and blending models  \n\nscores\\\
    _stack = cross\\_val\\_score(stacking\\_clf, X\\_train\\_scaled, y\\_train, cv=5,\
    \ scoring='accuracy')  \n\nprint(f'Stacking Cross-Validation Accuracy: {np.mean(scores\\\
    _stack) \\* 100:.2f}%')  \n\n\\# Note: Blending evaluation typically requires\
    \ a custom approach due to holdout set usage.  \n\n  |\n\n| --- |\n\n# 7.6 Real-World\
    \ Application: Portfolio Optimization\n\nEnsemble methods can be particularly\
    \ powerful in portfolio optimization, where the goal is to maximize returns while\
    \ minimizing risk. By combining predictions from various models, we can create\
