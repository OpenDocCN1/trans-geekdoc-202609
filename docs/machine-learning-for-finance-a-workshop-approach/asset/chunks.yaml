  trans: "\n\n时间序列数据是在特定时间间隔内收集或记录的数据点序列。例如每日股票价格、每月销售数据或年度 GDP 增长率。\n\n### 核心概念\n\
    \n- **趋势**：数据中长期的上升或下降运动。\n- **季节性**：在固定间隔内重复的规律模式。\n- **周期性模式**：不遵循固定模式的波动。\n\
    - **噪声**：数据中的随机变化。\n\n# 8.3 时间序列分解\n\n将时间序列分解为其组成部分（趋势、季节性和噪声）有助于我们理解其底层结构。\n\n\
    ### 工作坊活动 8.3.1：分解时间序列数据\n\n```python\nimport pandas as pd\nimport matplotlib.pyplot\
    \ as plt\nfrom statsmodels.tsa.seasonal import seasonal_decompose\n\n# 加载示例时间序列数据（例如，股票价格）\n\
    data = pd.read_csv('example_stock_prices.csv', index_col='Date', parse_dates=True)\n\
    \n# 分解时间序列\ndecomposition = seasonal_decompose(data['Close'], model='additive')\n\
    trend = decomposition.trend\nseasonal = decomposition.seasonal\nresidual = decomposition.resid\n\
    \n# 绘制分解后的组件\nplt.figure(figsize=(12, 8))\nplt.subplot(411)\nplt.plot(data['Close'],\
    \ label='Original')\nplt.legend(loc='upper left')\nplt.subplot(412)\nplt.plot(trend,\
    \ label='Trend')\nplt.legend(loc='upper left')\nplt.subplot(413)\nplt.plot(seasonal,\
    \ label='Seasonality')\nplt.legend(loc='upper left')\nplt.subplot(414)\nplt.plot(residual,\
    \ label='Residuals')\nplt.legend(loc='upper left')\nplt.tight_layout()\nplt.show()\n\
    ```\n\n# 8.4 移动平均与平滑\n\n移动平均和平滑技术有助于减少噪声并突出时间序列数据中的趋势。\n\n### 工作坊活动 8.4.1：计算移动平均\n\
    \n```python\n# 计算移动平均\ndata['Moving_Average'] = data['Close'].rolling(window=30).mean()\n\
    \n# 绘制原始数据和移动平均线\nplt.figure(figsize=(10, 6))\nplt.plot(data['Close'], label='Original')\n\
    plt.plot(data['Moving_Average'], label='Moving Average', color='red')\nplt.legend(loc='upper\
    \ left')\nplt.title('Moving Average of Stock Prices')\nplt.show()\n```\n\n# 8.5\
    \ 使用 ARIMA 进行时间序列预测\n\nARIMA（自回归积分移动平均）模型是时间序列预测中一种流行方法。它结合了自回归（AR）、差分（I）和移动平均（MA）组件。\n\
    \n### 工作坊活动 8.5.1：实现 ARIMA\n\n```python\nfrom statsmodels.tsa.arima.model import\
    \ ARIMA\n\n# 定义 ARIMA 模型\nmodel = ARIMA(data['Close'], order=(5, 1, 0)) # ARIMA(p,\
    \ d, q)，其中 p, d, q 是参数\n\n# 拟合模型\nmodel_fit = model.fit(disp=False)\n\n# 进行预测\n\
    data['Forecast'] = model_fit.predict(start=len(data), end=len(data) + 30, typ='levels')\n\
    \n# 绘制原始数据和预测值\nplt.figure(figsize=(10, 6))\nplt.plot(data['Close'], label='Original')\n\
    plt.plot(data['Forecast'], label='Forecast', color='red')\nplt.legend(loc='upper\
    \ left')\nplt.title('ARIMA Forecast of Stock Prices')\nplt.show()\n```\n\n# 8.6\
    \ 高级预测技术：LSTM\n\n长短期记忆（LSTM）网络是循环神经网络（RNN）的一种，对于建模具有长期依赖的时间序列数据非常强大。\n\n### 工作坊活动\
    \ 8.6.1：实现 LSTM 进行时间序列预测\n\n```python\nimport numpy as np\nfrom tensorflow.keras.models\
    \ import Sequential\nfrom tensorflow.keras.layers import LSTM, Dense\n\n# 准备数据\n\
    data_values = data['Close'].values\ndata_values = data_values.reshape((-1, 1))\n\
    \n# 数据归一化\nfrom sklearn.preprocessing import MinMaxScaler\nscaler = MinMaxScaler(feature_range=(0,\
    \ 1))\ndata_values = scaler.fit_transform(data_values)\n\n# 为 LSTM 创建数据集\ndef\
    \ create_dataset(data, time_step=1):\n    X, Y = [], []\n    for i in range(len(data)\
    \ - time_step - 1):\n        a = data[i:(i + time_step), 0]\n        X.append(a)\n\
    \        Y.append(data[i + time_step, 0])\n    return np.array(X), np.array(Y)\n\
    \ntime_step = 60\nX, Y = create_dataset(data_values, time_step)\n\n# 为 LSTM 重塑输入为\
    \ [样本, 时间步长, 特征]\nX = X.reshape(X.shape[0], X.shape[1], 1)\n\n# 定义 LSTM 模型\nmodel\
    \ = Sequential()\nmodel.add(LSTM(50, return_sequences=True, input_shape=(time_step,\
    \ 1)))\nmodel.add(LSTM(50, return_sequences=False))\nmodel.add(Dense(25))\nmodel.add(Dense(1))\n\
    \n# 编译模型\nmodel.compile(optimizer='adam', loss='mean_squared_error')\n\n# 训练模型\n\
    model.fit(X, Y)\n```\n\n"
