    # A.4 Glossary of Terms


    Here is a glossary of key terms used throughout the book:


    ●        Algorithm: A step-by-step procedure for calculations.


    ●        Bias: A systematic error introduced into sampling or testing.


    ●        Classification: Predicting the category to which an object belongs.


    ●        Clustering: Grouping a set of objects in such a way that objects in the
    same group are more similar to each other than to those in other groups.


    ●        Cross-Validation: A technique for assessing how the results of a statistical
    analysis will generalize to an independent dataset.


    ●        Decision Tree: A decision support tool that uses a tree-like model of
    decisions and their possible consequences.


    ●        Deep Learning: A subset of machine learning involving neural networks
    with many layers.


    ●        Feature Engineering: The process of using domain knowledge to extract
    features from raw data.


    ●        Hyperparameter: A parameter whose value is used to control the learning
    process.


    ●        Neural Network: A series of algorithms that attempt to recognize underlying
    relationships in a set of data through a process that mimics the way the human
    brain operates.


    ●        Overfitting: A modeling error which occurs when a function is too closely
    fit to a limited set of data points.


    ●        Regularization: Techniques to prevent overfitting by penalizing larger
    model parameters.


    ●        Supervised Learning: A type of machine learning where the model is trained
    on labeled data.


    ●        Unsupervised Learning: A type of machine learning where the model is
    trained on unlabeled data.


