  \ (`TESM`) 在预测中包含趋势和季节性平滑。编写一个 SAS 程序估计未来 10 个季度、回溯 2 期的 `TESM` 模型。\n\n      i.\
  \ 模型估计的水平、趋势和季节性权重是多少？\n\n      ii. 使用 `TESM` 模型后预测有所改进吗？\n\n***\n\n# 7. 金融领域的机器学习模型\n\
  \n## 金融领域中的机器学习\n\n在第六章中，我们研究了一系列在金融场景中常用的统计模型。在本章中，我们将注意力转向机器学习模型。正如第一章所强调的，机器学习模型可以分为监督模型和无监督模型。监督模型从输入变量集中学习目标变量的可预测特征。无监督模型（如聚类模型）学习输入变量共享的共同特征，然后使用这些特征对数据中的案例进行分组。\n\
  \n\n\n\n\n在第一章中，我们也指出机器学习是人工智能的一个子领域。人工智能的其他子领域包括深度学习（机器学习的一个子领域）、计算机视觉、专家系统、自然语言处理、生成式算法和量子计算。事实上，人工智能所有领域的创新速度如此之快，它们正准备重新定义生活和业务的许多方面。人工智能的许多子领域在实现上依赖于机器学习方法，因此所有金融数据科学家都必须理解其概念框架。请记住，机器学习算法在金融领域的一个广泛用途之一是开发和实施交易策略。因此，在本章中，从开发算法交易策略的角度来讨论\
  \ SAS 中的机器学习模型将是有益的。\n\n### 开发基于算法的交易策略\n\n预测算法和计算机智能模型在交易中的应用源于这样观点：市场在弱式或半强式形式下都不是完全有效的。因此，在投资环境中实施机器学习的目标是训练算法，使其从一组信息中快速识别交易信号，并将其迅速部署到市场中。这些信号包括潜在的市场趋势，如动量、均值回归和情绪；或者产生证券临时性定价错误机会的市场异常，这些异常随后可以使用统计套利或做市进行利用。在投资环境中，用于训练机器学习算法的数据通常分为四大类。它们包括技术指标、基本面指标、宏观经济和财务指标以及情绪指标。\n\
  \n### 技术指标\n\n技术指标通常是描述价格波动和成交量过去模式的统计量，算法随后尝试使用这些指标来预测未来的价格波动模式。它包括价格、调整后价格、收益率、成交量和价格变化的连续模式。常见的技术指标类型包括资金流量指数\
  \ (`MFI`)、相对强度指数 (`RSI`)、简单移动平均价格 (`SMA`)、成交量加权平均价格 (`VWAP`) 和未平持量。技术指标的使用源于一种信念：证券的市场价格反映了关于发行人财务和非财务状况的所有相关信息，而且这些价格变化的模式在某种程度上是可预测的。事实上，大多数技术指标只是证券供需相互作用（平衡或失衡）的统计衡量标准。\n\
  \n### 基本面指标\n\n基本面指标是关于公司财务状况的信息。将其视为投资者在对公司进行投资或退出之前希望了解的任何公司特定信息。此类类别包括公司或投资组合的财务指标、公司的相对价值，以及公司的财务和运营风险等。如果估值与公司的财务状况相关联，那么公司财务状况的变化将导致公司股票价值的变化。因此，在这种情况下，机器学习的目标是训练算法，使其能够从此类信息的公开披露中快速识别交易信号。显然，这些类型的实现需要高度复杂的算法\
  \ 1 和自动化，才能在投资环境中成功部署。\n\n### 宏观经济和财务指标\n\n金融市场对宏观经济因素的变化做出反应。此外，由于金融市场是关联的，它们也会对其他市场流行状况的变化做出反应。可以通过几种方法训练机器学习算法来利用这些动态关系。一种方法是训练算法来利用一个市场对另一个市场事件或宏观经济指标变化的反应延迟。另一种方法是训练算法来识别并利用市场之间长期关系中的临时偏差。考虑到这些可能性，宏观经济和财务市场数据（如通胀率、债券收益率、利率、汇率、商品价格、波动率衡量以及来自其他市场的指标）也被包含在输入算法的数据池中。\n\
  \n### 情绪指标\n\n情绪指标通过投资者对市场风险水平和/或利润机会的总体感知来衡量其投资心理。它们与技术指标的区别在于，技术指标衡量的是过去和现在的趋势，而情绪指标衡量的是投资者对未来市场状况持有的立场或观点（看涨或看空）。因此，它们可能包含算法可以利用以预测未来市场结果的信息碎片。情绪指标的示例包括著名的\
  \ CBOE 波动率指数、社交媒体帖子、看涨百分比指数 (`BPI`) 和跌涨比等。\n\n### 关于基于算法的投资策略的警告\n\n在我们继续之前，值得提到的是，预测市场算法的成功率非常低。\n\
  \n基于算法的投资旅程漫长且充满了许多障碍。在算法部署到实时环境之前，它必须首先在模型构建阶段成功识别出可利用的关系和趋势。识别出的趋势或关系是暂时的还是持久的通常取决于是否存在可以解释这一发现的底层理论。没有理论依据的关系和趋势很可能是暂时的，或者是在现实世界环境中可能无法利用的随机事件。2\n\
  \n我们的交易策略概念化\n\n\n\n\n假设我们感兴趣开发一种算法，该算法可以利用学术和专业研究中记录的一项或一些潜在趋势。这些趋势可能包括动量、均值回归和情绪。我们的目标是开发一种算法，能够筛选大量的金融、宏观经济、情绪和技术数据，帮助我们在第二天市场开盘前预测标普\
  \ 500 指数的走势。具体而言，我们的目标是根据今天交易日收盘时获得的信息，分类该指数在明天收盘时是上涨还是下跌。如果我们能开发出这样的算法，就可以根据算法对明天的预测，在今天持有标普\
  \ 500 指数期货头寸来利用它。\n\n例如，如果算法预测指数在明天收盘时将上涨（下跌），那么我们可以在当天稍些时候期货市场开盘时进入指数期货的多头（空头）头寸。在下午\
  \ 4:00 股市股市到下午 5:00 期市市场开盘之间，我们将根据今天市场活动的新信息更新模型。然后，我们将在市场开盘（下午 5:00）平仓，并根据算法对后续日的预测进入新的期货头寸。假设我们能成功开发出这种算法交易模型，这是一个简单、易于实施且易于评估的交易策略。\n\
  \n## 数据\n\n为了实现针对标普 500 指数的分类模型，我们的预测变量将包括一组基本面指标（如市盈率）和技术指标（包括资金流、相对强度指数、移动平均价格和指数的日收益率）。由于我们处理的多是是日数据，因此使用的宏观经济变量数量受到限制。尽管如此，我们的宏观经济变量仍包括初请失业人数和基金会领先经济指数等。金融市场指标包括全球主要资本市场指数的日收益率（使用来自亚洲和欧洲的\
  \ MSCI 指数），以及商品价格和汇率的每日变化。我们的情绪指标是 CBOE VIX 指数以及标普 500 指数看涨和看跌期权的未平仓量量。我们旨在开发的算法将使用上述预测变量和一个二分类目标变量进行训练，该目标变量表示标普\
  \ 500 指数的次日方向。表现为正的数标记为“1”，而表现为负的日子标记为“0”。用于构建模型的所有变量都在 `SPXRAW.sas7bdat` 数据集中。用于回测冠军模型的数据集是\
  \ `SPXSCORE.sas7bdat`。这两个数据集都位于书籍的 GitHub 仓库中。\n\n| 表 7.1: 预测变量 |\n| --- |\n| 预测变量\
  \ |\n| 技术指标 |\n| 开盘-开盘收益率 | 5 日移动平均价格 |\n| 收盘-收盘收益率 | 10 日移动平均价格 |\n| 成交量 | 30 日移动平均价格\
  \ |\n| 资金流净块 | 3 日 RSI |\n| 资金流净非 | 9 日 RSI |\n| 总看涨期权未平仓量 | 14 日 RSI |\n| 总看跌期权未平仓量\
  \ | 30 日历史波动率 |\n| 基本面指标 | |\n| 市盈率 (P/E) | |\n| 宏观经济和金融市场指标 |\n| 期差 | 联邦基金目标利率\
  \ |\n| 违约利差 | 初请失业人数指数 |\n| 美元汇率 | 领先经济指数 |\n| 情绪指标 | |\n| 历史看涨隐含波动率 | 历史看跌隐含波动率\
  \ |\n| CBOE VIX 波动率指数 | |\n\n## SAS 环境选项\n\n从现在开始，我们将展示 SAS Studio 和 SAS Enterprise\
  \ Miner 的演示，介绍我们在每个小节中重点介绍的过程。本书的第一章讨论了一些让 Enterprise Miner 相比 SAS Studio 在机器学习应用中更具吸引力的功能。然而，我们将同时展示\
  \ Enterprise Miner 的步骤和用于在 SAS Studio 中获得类似输出的 SAS 程序。正如你很快将看到的，我们在 SAS Enterprise\
  \ Miner 中进行的大多数演示将通过流程图完成，使用通过称为节点（nodes）调用的预构建代码包。我们还将使用 SAS Studio 的流程图功能，存储我们编写的代码以及我们为每个演示所调用的任务。你应该注意，SAS\
  \ 会不断向其所有分析产品添加新功能，因此可能最好说明一下，我们用于演示的两种产品之版本分别为 SAS Studio 3.8 和 Enterprise Miner\
  \ 15.2。3\n\n## 经典过程与高性能计算过程对比\n\nEnterprise Miner 和 SAS Studio 中的许多机器学习过程都运行在传统的计算环境或称为高性能（HP）模式的分布式计算环境中。在\
  \ HP 模式下，过程使用多线程单机模式或分布式多机模式下的并行处理来运行。这种方法在处理大型数据集和开发具有大量特征的模型时特别有益。工作负载在多台机器之间进行分发和管理，以提供更快的结果。高性能过程版本还包含了用于数据挖掘和机器学习实现的\
  \ SAS 语句。这些包含了可以调用的 SAS 语句，用于以下操作：\n\n*   将数据划分为训练集、验证集和测试集。\n*   创建一个用于数据评分的代码。\n\
  *   提取包含机器学习拟合统计数据的 ODS 表。\n\n## 创建流程图\n\n\n\n\n\n流程流（Process flow）是一个或多个链接的 SAS\
  \ 对象的集合。SAS 对象的示例包括数据集、SAS 程序、查询、任务和结果。流程流中的每个对象由一个名为“节点”的图标表示。流程流适用于 `SAS Studio`、`Enterprise\
  \ Guide` 和 `Enterprise Miner`。在 `SAS Viya` 中，流程流的对应功能被称为 `pipelines`。\n\n使用流程流管理你的数据科学项目有很多益处。首先，流程流允许你直观地观察项目中对象之间关系的逻辑顺序。其次，你可以在同一个\
  \ SAS 项目中创建并运行多个独立的流程流。你还可以从另一个流程流创建子流程流。最后，你可以从流程流中的节点生成 SAS 程序。SAS 程序中的代码按照它们在流程流中运行的顺序创建的。流程流是\
  \ `SAS` 中许多项目管理工具之一，使其成为所有数据科学项目的首选平台。\n\n### Enterprise Miner\n\n使用 `File` 菜单创建一个新项目。按照提示完成该过程。要连接到\
  \ `EMSAS` 库中的数据，右键点击 `Project Panel` 区域中的 `Data Sources` 图标。选择 `Create Data Source`。点击\
  \ `Next`，直到进入 `Select a SAS Table`。点击 `Browse` 启动 `Select a SAS Table` 窗口。点击 `SASUSER`\
  \ 库，然后双击 `SPXRAW` 数据集。点击 `Next`。检查 `Table Properties`，然后点击 `Next`。停在 `Data Source\
  \ Wizard`（图 7.2）检查并调整数据集中变量的角色。滚动到最后。然后将 `Target` 变量的级别改为 `Binary`。`Target_Ret`\
  \ 变量是下一个交易日指数收益的实际值。由于我们只预测方向而不是幅度，我们应该将 `Target_Ret` 变量的角色更改为 `Rejected`。\n\n图\
  \ 7.2：将数据导入 Enterprise Miner\n\n![image](img/Ch07_fig_7-2.jpg)\n\n你可以通过点击 `Compute\
  \ Summary` 按钮查看每个变量的描述性统计。向右滚动查看 `SAS Enterprise Miner` 生成的汇总统计。完成后，点击 `Next` 直到第\
  \ 9 步（共 9 步）。然后点击 `Finish`。对 `SPXSCORE` 数据重复相同的步骤，直到第 9 步，并将 `Role` 下拉框的值改为 `Score`。然后点击\
  \ `Finish`。要创建图表，右键点击 `Project Panel` 中的 `Diagrams` 按钮，然后点击 `Create New Diagram`。将图表命名为\
  \ `SP500`。将 `SPXRAW` 数据集拖放到图表中，将你的数据集引入项目区域。\n\n在 `SAS Studio` 环境（图 7.3\n\n### 数据分区（Data\
  \ Partitioning）\n\n机器学习模型的最佳实践之一是使用不同的数据集迭代地构建和评估模型。数据分区是将主数据集随机划分为训练集和验证子数据集的过程。如前所述，在投资设置中，还会保留第三个数据集用于回测。第三部分样本数据在数据科学领域通常被称为“测试数据”。数据分区有助于降低模型对训练数据集产生过拟合的风险。通过迭代使用独立的数据集来评估算法创建的模型的准确性，我们增加了模型泛化到新数据集或部署到实时环境以实现预期建模目标的概率。\n\
  \n由于我们处理的是带有时间索引的数据，在创建训练和验证数据集时可能需要特殊的技巧来避免前瞻偏差（look-ahead bias）。一种方法是使用日期阈值将数据划分为训练和验证数据集。在这种方法中，较后时段的数据被用于验证使用之前时期数据构建的模型。虽然这种方法对于纯时间序列模型可能足够，但对于要求响应变量与特征变量位于同一行的分类模型，可能效果并不良好。4\
  \ 事实上，我们将检查的许多分类算法并不是为了模拟领先/滞后关系设计的。因此，必须在将数据输入模型之前对其进行此类转换。\n\n在我们的 `SPXRAW` 数据集中，已使用\
  \ `PROC EXPAND` 将下一天的目标变量值置于与预测变量同一行。此外，分类问题相对简单，且只需要单周期信息。因此，如果我们为训练和验证数据集随机采样观测值，前瞻偏差的风险就会非常低。然而，我们用于回测的留存期（holdout\
  \ period）数据不是随机采样的。建模子时段的数据从 2011 年 1 月 3 日到 2020 年 12 月 31 日，包含 2501 个观测值，分为 70%（1751\
  \ 个观测值）训练数据集和 30%（750 个观测值）验证数据集。回测（留存）子时段从 2021 年 1 月 1 日到 2022 年 7 月 29 日，包含 396\
  \ 个每日观测值。\n\n图 7.4：Enterprise Miner 中的数据分区\n\n![image](img/Ch07_fig_7-4.jpg)\n\n\
  #### Enterprise Miner\n\n点击 `HPDM` 选项页，然后将高性能数据分区节点拖放到图表上。将其连接到 `SPXRAW` 数据集。在图\
  \ 7.4 所示的 `Properties` 面中，在 `Data Set Allocations` 下将 `Training` 改为 `70`，`Validation`\
  \ 改为 `30`。指定随机种子值为 `54321`。二分类变量的默认随机采样是分层随机采样。因此，我们将保持设置不变。右键点击节点并选择 `Run`。\n\n\
  ### SAS Studio\n\n点击 `Tasks` 和 `Utilities`。然后点击 `Tasks`，然后点击 `Data` 显示 `DATA` 步骤菜单。将\
  \ `Partition Data` 菜单拖放到 `Process Flow`。（参见图 7.5）。双击代码节点，确保在 `Select a Table` 下拉框中选择了\
  \ `EMSAS.SPXRAW`。点击 `Roles` 显示下拉区域。在 `Stratify By` 单元格中，点击 `+` 号添加一列。然后选择 `Target`\
  \ 作为分层变量。增加 `Number of Partitions` 为 `2`。然后将分区 `1` 和 `2` 的 `Proportion of Cases`\
  \ 分别设置为 `0.7` 和 `0.3`。指定随机种子值为 `54321`。更改数据集名称为 `SPRAWP`，并将分区值的变量名命名为 `PARTITION`，分区\
  \ 1 和 2 数据的 ID 值命名为 `1` 和 `2`。然后运行程序。\n\n\n\n###预测股价走势的监督学习模型\n\n监督学习算法的两大类是参数算法和非参数算法。记住，参数算法通常使用一组假设来定义预测变量与目标变量之间的关系。这些假设本质上定义了算法用于构建目标变量预测模型的映射函数。非参数算法不对预测变量与目标变量之间的关系做出特定假设。因此，它们不需要特定的映射函数，并且估计任何形式的未知函数。\n\
  \n### 超参数调优\n\n\n\n\n`SAS Studio` 和 `Enterprise Miner` 中的所有算法对控制算法所用学习过程的选项都有其默认设置。这些选项被称为超参数。与算法估算的模型参数不同，超参数是由数据科学家预先指定的用于训练模型的模型选项。它们可能会影响算法所估算的参数值。超参数特别有用，因为它们充当了算法在学习过程中使用的脚架。超参数既用于监督学习算法，也用于无监督学习算法。在\
  \ `Enterprise Miner` 中，可以在每个节点的 `Properties Panel`（属性面板）中找到可用的超参数。在 `SAS Studio`\
  \ 中，它们通常是与列出的过程 `SAS statement`（SAS 语句）相关的选项。例如，决策树的超参数之一是树的最大深度。它控制了树的复杂程度。\n\n\
  ## 参数化算法\n\n监督学习模型中参数化算法包括点估计模型，如线性回归（`OLS`）、正则化回归（`RR`）、神经网络模型（`NN`）、逻辑回归（当期望输出为概率估计时）以及广义线性模型（`GLM`）；而分类模型包括逻辑回归（`LR`）（我们已在第六章中讨论过）、神经网络模型（`NN`）和数据挖掘回归（`DM`）。在接下来的节中，我们将讨论并演示分类中最常用的参数化模型，即逻辑回归、广义线性模型和神经网络模型。数据挖掘回归和变量聚类回归是逻辑回归的扩展。它们仅在于输入模型的数据类型。经典逻辑回归使用原始数据作为输入，而数据挖掘回归变量聚类回归使用转换后的变量作为输入。在\
  \ `SAS Enterprise Miner` 中，转换在 `Data Mining node`（数据挖掘节点）中自动完成，而变量聚类方法在将数据输入 `Regression\
  \ node`（回归节点）之前使用 `Variable Clustering node` 转换变量。两种方法都没有高性能节点。但我们将在本章的练习中对它们进行实验。\n\
  \n## 逻辑回归\n\n对于逻辑回归，分类问题的函数形式依赖于估计参数向量，以计算响应变量 `y[t+1]` 取值为 1 或 0 的概率。这种情况下使用的概率分布是逻辑累积分布函数，可以写为：\n\
  \n$p(y_{t + 1} = 1|x_{t}) = \\frac{1}{1 + \\exp\\left( {- \\left( {\\\\beta_{0}\
  \ + \\\\beta_{1}x_{1t} + \\\\beta_{2}x_{2t} + ... + \\\\beta_{k}x_{kt}} \\right)}\
  \ \\right)}$      (7.1) \n\n然后根据超过特定阈值的概率进行分类。分类问题中最常用的概率阈值是百分之五十 `p(y[t+1]=1|x[t])≥0.5`。我们可以推断每个预测变量的边际效应对响应变量总体概率的方向性影响；然而，边际效应的值无法直接推断，因为\
  \ `y[t]` 和 `x[t]` 之间是非线性关系。因此，它们主要以成功与失败的对数比（也称为对数优势，log odds）的形式呈现。\n\n$\\log\\\
  left( \\frac{p\\left( {y_{t + 1} = 1} \\right)}{1 - p\\left( {y_{t + 1} = 1} \\\
  right)} \\right) = \\beta_{0} + \\beta_{1}x_{1t} + \\beta_{2}x_{2t} + ... + \\beta_{k}x_{kt}$\
  \      (7.2)\n\n### HPLOGISTICS 过程\n\n`PROC HPLOGISTICS` 是我们在第六章中检查过的 `LOGISTICS`\
  \ 过程的高性能版本。`HPLOGISTICS` 过程的一些显著特征包括 `PARTITION` 语句，用于将数据划分为训练、验证和测试集。在 `SAS Studio`\
  \ 中，它们通常是伴随过程列出的 `SAS statement` 的选项。例如，决策树的超参数之一是树的最大深度。它控制了树的复杂程度。\n\n\n\n\n```sas\n\
  /*Classifying Stock Market Directions Using High-Performance Logistic Procedure*/\n\
  /*Use Macro Variable to create a list of predictor variables*/\n%let var_list=CCSIBBB\
  \ CFDTR CFXRATE CHIST_CALL_IMP_VOL CHIST_PUT_IMP_VOL CINJCJC CLEI\n      CMF_NET_BLCK\
  \ CMF_NET_NON_BLCK CMOV_AVG_10D CMOV_AVG_30D CMOV_AVG_5D \n      COPEN_INT_TOTAL_CALL\
  \ COPEN_INT_TOTAL_PUT CPE_RATIO CPX_LAST CPX_OPEN;\n\nods graphics on;\nproc hplogistic\
  \ data=EMSAS.SPXRAWP;\n      id Dates Partition;\n      class Target;\n      model\
  \ Target=&var_list. /cutpoint=0.5 link=logit;\n      partition rolevar=partition(train='1'\
  \ validate='2');\n      selection method=backward(slstay=0.1)  details=all;\n  \
  \    code file =\"%sysfunc(pathname(work))/logscore.sas\" group=HPLOG;\n      output\
  \ out=plogout /allstats;\n      ods output PartFitStats=logstats;\nrun;\n```\n\n\
  ### 过程详情\n\n`CUTPOINT=0.5` 指定了将预测的 `Target` 分类为“1”的阈值。后向选择法通过 10% 的显著性水平来保留模型中的潜在预测变量，指定为\
  \ `SLSTAY=0.1`。也可以调用 SAS ODS 输出，从过程生成的 ODS 表格创建 SAS 数据集。在这个示例中，我们使用 `ODS` 语句从 `PARTFITSTATS`\
  \ `ODS` 表创建了输出数据集 `LOGSTATS`。我们将这些统计量与其他模型的拟合统计量结合起来，并在稍后进行的模型比较部分中对它们进行统一审查。\n\n\
  过程下方的 `DATA` 步骤包含了用于将过程的预测输出（`PLOGOUT`）与分区输入数据集（`SPXRAWP`）结合以进行后续分析的 SAS 代码。我们还将尝试通过计算一组变量来在\
  \ SAS Enterprise Miner 中复制某些可视化效果，这些变量可生成分类矩阵并执行模型诊断和比较。\n\n### 程序 7.2B：使用 PROC\
  \ HPLOGISTICS 分类股价波动\n\n```sas\n/*Comparing Predicted to Actual Outcomes*/\nproc\
  \ sort data=plogout; by dates; run;\nproc sort data=emsas.spxrawp; by dates;run;\n\
  data logout;\n      merge plogout emsas.spxrawp;\n      by dates;\n\n/*************************************************\n\
  以下代码在其他模型中重复出现。\n**************************************************/\n\n      if\
  \ (Pred < 0.5) then\n             P_Target = 0;\n      else P_Target = 1;\n   format\
  \ Classification $10. Role $9. Model $15.;\n    if (Target = P_Target) then Classification\
  \ = 'Correct';\n      else Classification = 'Incorrect';\n      if Partition = '1'\
  \ then\n             Role ='Train';\n      else Role ='Validate';\nif P_Target =\
  \ 1 and Target=1 then TP=1; else TP='';\nif P_Target = 1 and Target=0 then FP=1;\
  \ else FP='';\nif P_Target = 0 and Target=1 then FN=1; else FN='';\nif P_Target\
  \ = 0 and Target=0 then TN=1; else TN='';\n  label TP='True Positive' FP='False\
  \ Positive' FN='False Negative' TN='True Negative';\n\n/*************************************************\n\
  重复代码结束\n**************************************************/\n\n  Model='HP Logistics';\n\
  run;\n```\n\n### 结果\n\n点击结果（Result）选项卡查看 `HPLOGLISTIC` 过程的结果。估计过程生成了大量输出。为了节省空间和时间，我们将对结果进行汇总。然而，我鼓励你花些时间亲自审查所有结果。\n\
  \n滚动到结果底部可以查看最终模型的拟合统计量以及为模型选选的变量。所选的变量包括：看涨期权的历史隐含波动率、领先经济指标、资金流、看涨和看跌期权的未平量（Open\
  \ interests）、市盈率（PE ratio）以及 CBOE 隐含波动率（`VIX`）。注意变量与市场方向之间关系的符号。特别是，看涨期权隐含波动率、领先经济指数和看涨期权未平量的正变化增加了市场在交易日结束上涨的概率。看跌期权未平量、资金流和\
  \ `VIX` 指数的正变化意味着次日股票呈负面波动。变量的符号与市场行为的预期一致。利消息和更高的乐观情绪通常与市场的上涨相关。\n\n**输出 7.2**：PROC\
  \ HPLOGISTICS 选变量的估计系数\n\n### 广义线性模型 (GLM)\n\n`GLM` 是一类广泛的模型，用于对响应变量与其协变量之间的线性和非线性关系。这种预测建模的创新方法将问题分为三个部分：\n\
  \n-   **随机组件（Random component）**：指定响应变量的分布，在我们的分类问题中，它可以是正态、泊松或二项分布。\n-   **结构组件（Structural\
  \ component）**：指定响应变量与其预测变量之间的线性预测器。这种关系可以是纯线性函数，例如 `η = β0 + β1x1 + β2x2 + ...\
  \ + βkx`，也可以曲线函数，例如 `η = β0 + β1x1 + β2x2² + ... + βkx²`。这里的关键在于参数化必须是线性形式。\n- \
  \  **链接函数（Link function）**：描述随机组件和结构组件如何连接。这是通过使用一个平滑且可逆的线性化函数（通常标记为 `g(.)`）将随机组件的期望值连接到结构组件的某种函数形式来实现的。例如，对于预测变量具有线性关系的正态分布响应变量，其线性链接函数的形式为\
  \ `μ = E(y)`，即线性回归模型 `g(μ) = η = β0 + β1x1 + β2x2 + ... + βkx` (7.3)。\n\n常见的链接函数类型包括恒等（identity）、对数（log）、log-log、反数（inverse）、logit、probit\
  \ 和反高斯（inverse Gaussian）等。此外，由于函数是可逆的，其逆函数（称为均值函数）可以推导出：`μ = g⁻¹(η) = g⁻¹(β0 + β1x1\
  \ + ... + βkx)` (7.4)。\n\n`GLM` 过程使用链接函数将预测变量的某种线性规格与具有已知分布的响应变量函数连接。通过使用这种方法，我们避免了响应变量与其预测变量共享相同多元分布的需求。然而，尽管响应变量本身可能与预测变量并非线性关系，但根据构造，响应变量的函数在\
  \ `GLM` 框架内与预测变量是线性的。\n\n### HPGENSELECT 过程\n\n`HPGENSELECT` 是 SAS 中用于构建和拟合广义线性模型（GLM）的高过程。虽然\
  \ `HPGENSELECT` 过程与 `HPLOGISTICS` 共享许多语句（如 `CLASS`、`CODE`、`PARTITION`、`MODEL`、`SELECTION`\
  \ 和 `PER`），但其功能扩展到了对指数族（如泊松、正态和 Tweedie）响应变量的建模。\n\n\n\n\n将 `HP GLM` 节点拖放到你的图表中。将其连接到数据节点的输出端口。在\
  \ `Properties` 面板中，二分类目标变量的默认概率分布为二项分布。将二分类目标变量的 `Link` 函数从 `Logit` 更改为 `Probit`。在模型选择区域，选择\
  \ `Backward` 为选择方法（Selection Method），选择 `Significance Level` 为选择准则（Selection Criterion）。右键点击节点，更新路径并在更新后运行该节点。通过右键点击节点并点击\
  \ `Results` 来查看估算结果。你会发现一系列表格、图表和输出。注意 `Variable Selection`、`Fit Statistics` 和 `Parameter\
  \ Estimates` 窗口。\n\n点击你流程图中的 ![image](img/Ch07_Image3304.jpg) 图标。然后选择 SAS Program\
  \ 以在流程流中创建一个编程节点。将节点的输入端口连接到数据节点的输出端口。双击节点。将下面的 SAS 程序复制并粘贴到 `Code` 区域，然后运行它。点击\
  \ `Node` 标签页并在 `Name` 区域输入“HP GLM”。保存你的流程图 ![image](img/Ch07_Image3341.jpg)。\n\n\
  你会发现 `HPGENSELECT` 过程与 `HPLOGISTIC` 过程具有相似的功能。这是因为逻辑回归是 `GLM` 的一个特例。与其重新估计逻辑模型，不如使用\
  \ `LINK=PROBIT` 在模型语句中为链接函数指定 probit 模型。与 `HPLOGISTIC` 过程一样，`PARTITION` 语句用于指定如何将数据划分为训练集、验证集和测试集。`CODE\
  \ FILE=` 指定存储评分代码的位置。还可以调用 `ODS output` 来根据该过程生成的 `ODS` 表格创建 SAS 数据。在示例中，我们使用 `ODS`\
  \ 语句从 `FITSTATISTICS` 表格创建输出数据集（`GLMSTATS`）。\n\n###  程序 7.3: 分类股价走动的 PROC HPGENSELECT\n\
  \n```sas\n/*使用高性能 GLM 过程对市场方向分类*/\nproc hpgenselect data=EMSAS.SPXRAW;\n   class\
  \ Target;\n   id dates partition;\n   partition role=Partition (validate='2');\n\
  \   model Target (event='1')=&var_list./dist=binary link=probit;\n/* 宏变量列表*/\n \
  \  selection method=backward(slstay=0.1) details=all;\n   output out=pglmout role=partrole\
  \ / allstats;\n   code=\"%sysfunc(pathname(work))/glmscore.sas\" group=HPGLM ;\n\
  \   ods output fitstatistics=glmstats(where=(Step is missing));\nrun;\n\n/*比较预测结果与实际结果*/\n\
  proc sort data=pglmout; by dates; run;\nproc sort data=emsas.spxrawp; by dates;run;\n\
  data glmout;\nmerge pglm emsas.spxraw;\n\n*********************************\n与程序\
  \ 7.2B 相同的代码\n******************/\nif (Pred < 0.5) then\n   P_Target = 0;\nelse\
  \ P_Target = 1;\nformat Classification $10. Role $9. Model $15.;\nif (Target = P_Target)\
  \ then Classification = 'Correct';\nelse Classification = 'Incorrect';\nif Partition\
  \ = '1' then\n   Role ='Train';\nelse Role ='Validate';\nif P_Target = 1 and Target=1\
  \ then TP=1; else TP='';\nif P_Target = 1 and Target=0 then FP=1; else FP='';\n\
  if P_Target = 0 and Target=1 then FN=1; else FN='';\nif (Target = P_Target) then\
  \ Classification='True';\nrun;\n```\n\n\n\n\n还有多种类型的激活函数。它们包括逻辑回归或 sigmoid 函数、双曲正切函数、正弦和余弦函数以及\
  \ `SoftMax` 函数等。sigmoid 激活函数的公式为 $\\sigma\\left( z \\right) = \\frac{1}{1 + \\exp\\\
  left( {- z} \\right)}$，而双曲正切函数的公式为 $\\sigma\\left( z \\right) = \\tanh(z) = \\frac{2}{1\
  \ + \\exp\\left( {- 2z} \\right)} - 1$。`SoftMax` 函数的公式为 $\\sigma\\left( z \\right)\\\
  _{i} = \\frac{\\exp\\left( z\\_{i} \\right)}{\\sum\\limits\\_{j = 1}^{n}{\\exp\\\
  left( z\\_{j} \\right)}}$。\n\n`SoftMax` 激活函数将输出层神经元的原始输出向量转换为概率评分向量，将其缩放到 0 到 1\
  \ 之间。`sigmoid` 和 `SoftMax` 函数主要用于输出层或目标层，而双曲正切、恒、正弦和余弦函数更常用于隐藏层激活函数。\n\n神经网络模型不使用选择方法来过滤掉信息值较低的变量；因此，你应该注意所有输入变量都被用于人工神经网络模型中。如果你希望使用此功能，应在将变量输入算法之前，使用其他方法对其进行预选。\n\
  \n将神经网络模型理解为“函数的函数”是有帮助的，其中每个连续层中的接收节点由上一层节点预测器的加权值之和组成。该过程递归进行，直到数据传递到输出层，使用该层的激活函数进行实际预测。\n\
  \n## HPNEURAL 过程\n\n在 SAS 中，可以使用高性能 `HPNEURAL` 过程调用各种神经网络模型架构的估计。`ARCHITECTURE`\
  \ 语句指定训练模型时应使用何种类型的架构。选项包括逻辑回归、具有一个或多个隐藏层的多层感知机 (`MLP`)，以及输入层和输出层之间有直接连接的多层感知机。`CODE`\
  \ 语句用于输出该过程的评分代码，方式与之前的过程相同。`HIDDEN` 语句用于指定模型中的隐藏层数、每层的神经元数量以及每层的激活（`ACT`）函数。每个隐藏层必须由单独的\
  \ `HIDDEN` 语句指定。每个隐藏层中可用的激活函数包括余弦（`COS`）、恒（`IDENTITY`）和切（`TANH`）。`INPUT` 语句指定预测变量列表及其测量水平（`LEVEL=NOM|INT`）。`NOM`\
  \ 和 `INT` 选项分别指定分类和间隔测量水平。`TARGET` 语句指定目标变量及其测量水平（`LEVEL =NOM|INT`）。`TARGET` 语句中的其他选项包括用于间隔类目标的激活函数（`ACT=COS|EXP|IDENTITY|TANH`）。分类类目标的默认激活函数是\
  \ `SoftMax` 函数。`STD` 选项指定是否应对间隔类目标进行标准化以及使用的标准化类型（`RANGE`、`ZSCORE`、`NONE`）。`ERROR`\
  \ 选项指定应用于间隔目标变量的误差函数（`GAMMA`、`NORMAL`、`POISSON`）。`TRAIN` 语句指定过程如何处理训练数据，以估计用于预测目标变量的网络权重。`SCORE`\
  \ 语句指定过程将实际目标和预测目标值写入 `OUT=` 选项指定的 SAS 数据集中。你还可以请求将模型参数保存在 `MODEL=` 选项指定的 SAS 数据集中。`WEIGHT`\
  \ 指定是否使用数据中目标类出现频率的倒数来对训练观测值加权。\n\n### SAS Enterprise Miner\n\n将 `HP Neural` 节点拖放到你的图表中。将其连接到数据分区节点的输出端口。在“属性”面板中，将\
  \ `Use Inverse Priors` 设置为 `Yes`，并将 `Architecture` 设置为 `User-Defined`。然后将 `Hidden\
  \ Layers`（隐藏层）的数量改为 1。点击 `Hidden Layer Option` 前的面号，将层的 `Activation Function`（激活函数）设置为\
  \ `TANH`，并将 `Number of Neurons`（神经元数量）设置为 3。二分类变量的默认激活函数是 `SoftMax`，因此我们保持不变。我们也将剩余的超参数保持为默认设置。右键点击节点，更新路径，然后在路径更新后运行节点。\n\
  \n### SAS Studio\n\n点击你的流程流中的 `![image](img/Ch07_Image33404.jpg)` 图标。然后选择 `SAS Program`\
  \ 在你的流程流中创建一个编程节点。将节点的输入端口连接到你的 `Partition` 数据节点的输出端口。双击节点。将下面的 SAS 程序复制并粘贴到 Code\
  \ 区域，然后运行它。点击 `Node` 选项卡并在 `Name` 区域输入“HP Neural”。保存你的流程流 `![image](img/Ch07_Image33411.jpg)`。\n\
  \n### 程序 7.4：使用 PROC HPNEURAL 分类股价走势\n\n```\n/*使用 HP 过程对股市方向进行分类*/\n/*创建数值分区变量*/\n\
  data emsas.spxrawn;\nset emsas.spxrawp;\nnpartition = input(partition,2.);\nrun;\n\
  \nods graphics on;\nproc hpneural data=emsas.spxrawn;\n      architecture mlp;\n\
  \      input &var_list.;/* 宏变量列表*/\n      id dates partition;\n      hidden 3/act=tanh;\n\
  \      target level=nom;\n      train maxiter=1000 weight=_inverse_priors;\n   \
  \   score out=neuralout;\n      output fitstatistics=neuralstats;\nrun;\n\n/*比较预测值与实际值*/\n\
  proc sort data=neuralout;\nby dates;\nproc sort data=emsas.spxrawn;\nby dates;\n\
  run;\ndata neuralout;\nmerge pneuralout emsas.spxrawn;\nby dates;\n*********************************\n\
  与程序 7.2 代码相同\n******************/\nif (Pred < 0.5)\n  P_Target = 0;\nelse\n  P_Target\
  \ = 1;\nformat Classification $10. Role $9. Model $15.;\nif (Target = P_Target)\
  \ Classification = 'Correct';\nelse Classification = 'Incorrect';\nif (Partition\
  \ = '1')\n  Role ='Train';\nelse\n  Role ='Validate';\nif (P_Target = 1 and Target=1)\
  \ then TP=1; else TP='';\nif (P_Target = 1 and Target=0) then FP=1; else FP='';\n\
  if (P_Target = 0 and Target=1) then FN=1; else FN='';\nif (P_Target = 0 and Target=0)\
  \ then TN=1; else TN='';\nlabel TP='True Positive' FP='False Positive' FN='False\
  \ Negative' TN='True Negative';\n\nModel='HP Neural';\nrun;\n```\n\n\n\n\n\n神经网络模型是黑箱模型；因此，它们的解释性结果非常少。`HPNEURAL`\
  \ 过程会生成超参数列表和模型的拟合统计数据。SAS Enterprise Miner 中的 `HP Neural Node` 节点产生更多的输出。因此，让我们回顾该节点的一些输出内容。\n\
  \n输出 7.4A 显示了该过程生成的链接图。注意，所有 24 个预测变量都用于模型中。每个变量都与隐藏层中的三个神经元连接，然后这些神经元又被输入到目标（输出）层的单个神经元，以进行实际预测。\n\
  \n输出 7.4B 显示了每个预测变量和隐藏层中每个神经元总权重的热图。颜色越红，分配给该变量的权重越正；颜色越蓝，分配给该变量的权重越负。注意，具有深红色权重的变量（看涨期权隐含波动率的正向变化、领先指数和看涨期权未持量）与\
  \ `PROC LOGISTIC` 和 `GLM` 模型中具有正向股票市场结果较高概率的变量相同；而深蓝色的变量（看跌期权未持量、资金流、市盈率和 VIX 指数）与相同模型中具有负向股票市场结果较高概率的变量相同。在隐藏层三个神经元对目标层的贡献方面，你可以观察到\
  \ `H1` 和 `H2` 预测目标结果的权重高于 `H3`。\n\n### 输出 7.4A：从 HP Neural Node 获取的链接图\n\n| ![image](img/Ch07_out_7-4a.jpg)\
  \ |\n| --- |\n\n### 输出 7.4B：从 HP Neural Node 获取的变量权重\n\n| ![image](img/Ch07_out_7-4b.jpg)\
  \ |\n| --- |\n\n## 非参数算法\n\n非参数算法对预测变量与目标变量之间的关系很少或完全不做假设。因此，它们不需要特定的映射函数。这意味着非参数算法可以经过训练来对预测变量与响应变量之间复杂且显著的关系。由于它们直接从数据本身学习映射函数，非参数算法通常比参数算法需要更多的观测值。常见的非参数算法类型包括决策树（DT）、随机森林（RF）和支持向量机（SVM）。\n\
  \n## 决策树\n\n决策树算法是一种监督学习算法，通过对预测变量进行分层分割来进行预测或分类。每个分割（节点）都由一个分裂规则决定，使得当分裂规则应用于验证数据集时，分类产生最佳的评估标准。这些衡量标准（也称为纯度函数）包括熵、吉尼系数、误分类误差和信息增益。\n\
  \n在决策树框架中，目标是使用一个 `k` 维特征向量 `x` 将我们的未知结果（该向量可能同时包含真实 `x[j]∈ℝ` 和/或分类数据 `x[j]∈ℂ`）分类为集合\
  \ `y  = {1,2,...*n*}` 中的类别之一。这是通过在数据集合 `S  = {(*y[t] ⅅ+ⅅ1],*x*[1, ⅅ*t*],*x*[2, ⅅ*t*],...,*x*[*k*,\
  \ ⅅ*t*]);*t*=1,...,*T*}` 上训练算法来实现的。在每个节点上，算法决定对哪个变量分裂以及分裂的位置，以最小化所选的纯度衡量标准。该任务递归执行，直到满足某些停止规则。\n\
  \n总体而言，分类器将预测变量 `x` 分为 `v` 个不相交的节点 `{G[1],...,G[v]}`。令 $p\\left( q \\middle| r \\\
  right) = \\frac{1}{n_{r}}{\\sum\\_{x\\_{i} \\in G_{r}}^{}{1\\left\\{ {y\\_{t + 1}\
  \ = q} \\right\\}}}$ 为树的第 `r`^(*t**th*) 叶节点中 `q`^(*t**th*) 类的比例，`n[r]` 为叶节点 `r`\
  \ 处的观测值数量。那么我们的分类器可以写为：\n\n$$h\\left( x \\right) = \\underset{q}{\\arg\\max}p\\\
  left( q \\middle| r \\right),\\{~where~}x \\in G_{r} \\quad (7.6)$$\n\n此外，令 $l_{s}\\\
  left( h \\right) = \\frac{\\left| \\left\\\\{ {i \\in \\left\\lbrack n \\right\\\
  rbrack:h\\left( x_{t} \\right) \\neq y_{t + 1}} \\right\\} \\right|}{n}$ 表示训练数据集\
  \ `S` 中误分类的 `y[t] ⅅ+ⅅ1]` 的比例，$R(l[s])` 表示经验误差的严格凸类型的纯度函数。那么对于 `n`  = 2 个类（即 `y[t]\
  \ ⅅ+ⅅ1]`），如果我们选择误分类率作为我们的纯度函数，则具有 `M` 个叶节点的决策树通过找到以下值来实现：\n\n$$\\underset{h{(x)}}{\\\
  text{argmin}}{\\sum\\limits_{r}^{|M|}R_{r}}\\left( l_{s} \\right) + \\lambda\\left|\
  \ M \\right| \\quad (7.7)$$\n\n其中 `λ` 是复杂性的调优参数。\n\n| 分分类器将预测变量 `x` 分为 `v` 个不相交的节点\
  \ `{G[1],...,G[v]}`。令 $p\\left( q \\middle| r \\right) = \\frac{1}{n_{r}}{\\sum\\\
  _{x\\_{i} \\in G_{r}}^{}{1\\left\\{ {y\\_{t + 1} = q} \\right\\}}}$ 为树的第 `r`^(*t**th*)\
  \ 叶节点中 `q`^(*t**th*) 类的比例，`n[r]` 为叶节点 `r` 处的观测值数量。那么我们的分类器可以写为：\n\n$$h\\left( x\
  \ \\right) = \\underset{q}{\\arg\\max}p\\left( q \\middle| r \\right),\\{~where~}x\
  \ \\in G_{r} \\quad (7.6)$$\n\n此外，令 $l_{s}\\left( h \\right) = \\frac{\\left| \\\
  left\\\\{ {i \\in \\left\\lbrack n \\right\\rbrack:h\\left( x_{t} \\right) \\neq\
  \ y_{t + 1}} \\right\\} \\right|}{n}$ 表示训练数据集 `S` 中误分类的 `y[t] ⅅ+ⅅ1]` 的比例，$R(l[s])`\
  \ 表示经验误差的严格凸类型的纯度函数。那么对于 `n`  = 2 个类（即 `y[t] ⅅ+ⅅ1]`），如果我们选择误分类率作为我们的纯度函数，则具有 `M`\
  \ 个叶节点的决策树通过找到以下值来实现：\n\n$$\\underset{h{(x)}}{\\text{argmin}}{\\sum\\limits_{r}^{|M|}R_{r}}\\\
  left( l_{s} \\right) + \\lambda\\left| M \\right| \\quad (7.7)$$\n\n其中 `λ` 是复杂性的调优参数。\
  \ | 决策树通过一系列分裂规则（从根节点开始）生成响应变量的分类，这些规则旨在实现某些优化目标（例如观测值的同质性）。每次分裂使用特征变量（决策节点）进行，每个分支代表决策规则。所有分裂规则的终点是终端节点（叶节点）。另一种思考决策树的方式流程图，包含一系列决策点，最终对响应变量的值进行分类或预测。\
  \ |\n| --- |\n\n`HPSPLIT` 过程是用于在 SAS 中构建基于决策树的分类和回归模型的高性能过程。分类树用于建模分类响应变量，而回归树用于建模连续变量。该过程中可用的分裂规则包括纯度函数（如熵、吉尼系数和残差平方）。`PROCPSPLIT`\
  \ 语句带有大量的选项，分为两类。基本选项（如 `DATA` 指定预测数据集；`INTERVALBINS` 指定连续变量的分箱数量；`CVCC` 请求一个代价复杂度剪枝结果的表格；`NODES`\
  \ 请求一个描述最终树节点的表格；以及 `NSURROGATE` 指定应用代理规则的数量）包含了估计的通用超参数以及控制估计输出的选项。分裂选项（如 `ASSIGNMISSING`\
  \ 指定如何处理预测变量中的缺失值；`MAXBRANCH` 指定节点的最大叶节点数；`MAXDEPTH` 指定树的最大深度）包含了控制树分裂过程的超参数。 |\n\
  \n\n\n\n\n翻译：\n\n`CLASS` 语句用于指定哪些预测变量应被视为分类变量。`CODE` 语句的作用与其他 HP 过程相同。`GROW` 语句指定了树的生长标准。这是算法在构建树的生长时尝试最小化的损失函数。`MODEL`\
  \ 语句指定了目标变量及其预测变量，而 `OUTPUT` 语句指定了存储算法预测结果和输入数据中匹配 ID 变量的数据集。`PRUNE` 语句指定了将最大树剪枝为最终子树的方法。剪枝选项包括\
  \ `C45`、`Cost Complexity`（代价复杂度）以及减少误差的方法，如 `Misclassification`（误分类）或 `Average Squared\
  \ Errors`（平均平方误差）。`RULES` 语句指定了保存最终树规则的文件。\n\n### SAS Enterprise Miner\n\n将 `HP\
  \ Tree` 节点拖放到图表上。将其连接到你的数据分区的节点的输出端口。在属性面板中，将 `Nominal Target Criterion` 设置为 `Entropy`，将\
  \ `Use Input Once` 设置为 `Yes`，将 `Minimum Leaf Size` 设置为 `1`，并将 `Surrogate Rule` 设置为\
  \ `zero`。此外，将 `Subtree Method` 设置为 `Assessment`，将 `Selection Method` 设置为 `Automatic`。最后，将\
  \ `Nominal Target Assessment` 设置为 `Misclassification`，并将 `Minimum Subtree` 设置为 `Yes`。更新路径，然后在路径更新后运行节点。\n\
  \n### SAS Studio\n\n点击你的流程流中的 ![image](img/Ch07_Image33404.jpg) 图标。然后选择 `SAS Program`\
  \ 在你的流程流中创建一个编程节点。将该节点的输入端口连接到 `Partition` 数据节点的输出端口。双击该节点。将下面的 SAS 程序复制并粘贴到 `Code`\
  \ 区域，然后运行它。点击 `Node` 标签并在 `Name` 区域输入 `HP Tree`。保存你的流程流 ![image](img/Ch07_Image33411.jpg)。\n\
  \n#### 程序 7.5：使用 PROC HPSPLIT 分类股价走势\n\n```sas\n\n/*使用 HP 决策树过程分类股票市场方向*/\nods graphics\
  \ on;\nproc hpsplit data=emsas.spxrawp  maxbranch=2 splitonce\n       intervalbins=100\
  \ maxdepth=10 mincatsize=1 mindist=0.01 alpha=0.2 leafsize=1 nsurrogates=0\n   \
  \    assignmissing=popular;\n       id dates partition;\n       class target;\n\
  \       model target = &var_list.;\n       grow entropy;\n\n/*根据误分类剪枝并选择误分类率最低的子树*/\n\
  \      prune  misc / min;\n      partition rolevar=partition(train='1' validate='2');\n\
  \      code file =\"%sysfunc(pathname(work))/splitscore.sas\";\n      rules file=\"\
  %sysfunc(pathname(work))/rules.txt\";\n      output out=ptree;\nods treePerformance=treats;\n\
  run;\n\n/*比较预测结果与实际结果*/\nproc sort data=ptree; by dates;\n\ndata treeout;\nmerge\
  \ ptree emsas.spxraw;\nby dates;\n\n/**********************************与程序 7.2B\
  \ 代码相同\n**********************************\n\nif (Pred < 0.5) then\n   P_Target\
  \ = 0;\nelse P_Target = 1;\nformat Classification $10. Role $9. Model $15.;\nif\
  \ (Target = P_Target) then Classification = 'Correct';\nelse Classification = 'Incorrect';\n\
  if (Partition = '1') then\n   Role ='Train';\nelse Role ='Validate';\nif (P_Target\
  \ = 1 and Target=1) then TP=1;\nelse (P_Target = 1 and Target=0) then FP=1;\nif\
  \ (P_Target = 0 and Target=1) then FN=1;\nelse (P_Target = 0 and Target=0) then\
  \ TN=1;\nlabel TP='True Positive' FP='False Positive' FN='False Negative' TN='True\
  \ Negative';\nModel='HP Tree';\nrun;\n```\n\n注意 SAS 代码中，`NSURROGATE` 选项被设置为 0，`MAXBRANCH`\
  \ 设置为 2，要求 `SPLITONCE`，并且将缺失值分配给最大的叶节点（`ASSIGNING=POPULAR`）。`GROW ENTROPY` 要求使用熵来生长树。`PRUNE\
  \ MISC/MIN` 请求对树进行剪枝以最小化误分类率。评分代码和分裂规则的文件都保存在 `WORK` 库的物理位置。\n\n### 结果\n\n在 `Output\
  \ 7.5A` 中注意，算法继续构建树，直到达到最大深度（10）。虽然输出中没有显示，但该深度树具有超过 100 个节点和 54 个叶节点。实际上，如果没有将最大深度设置为\
  \ 10，它将继续分裂树，直到无法找到进一步降低不性的分裂方法为止。正如误分类率剪枝图所示，最大深度（10）会导致一个过拟合训练数据但无法泛化到其他数据集的树。虽然树在\
  \ 33 个叶节点之后对训练数据的拟合效果继续提高，但验证数据的误分类率从这一点起开始增加。因此，整棵树被剪枝回 `Output 7.5B` 所示的树。\n\n\
  #### 输出 7.5A：误分类率剪枝\n\n![image](img/Ch07_out_7_5a.jpg)\n\n#### 输出 7.5B：来自 PROCPSPLIT\
  \ 的剪枝决策树\n\n![image](img/Ch07_out_7-5b.jpg)\n\n\n\n\n你可以通过从主树中选择子树来对树进行进一步的深度下钻评估。默认情况下，该过程会显示从根节点开始的子树（如输出\
  \ 7.5E 所示）。然而，你可以请求子树图从你选择的任何节点开始，且深度可达可用分支的数量。例如，可以使用 `PLOT=(ZOOMEDTREE(NODE=(‘D’)\
  \ DEPTH=3)` 请求一个从第五个节点开始且最多包含三个子分支的自定义子树图。在自定义图表中，你可以查看训练数据集和验证数据集每个节点中的观测值数量，还可以根据创建该节点的划分规则查看目标变量的分布。例如，在节点\
  \ W 中，训练数据集和验证数据集中分别有 870 天和 382 天。训练数据集中的 870 天中约有 54% 是股市上涨日，而 46% 不是。\n\n## 支持向量机\n\
  \n支持向量机（`SVM`）是一种机器学习算法，它利用 n 维空间中的超平面来预测或分类感兴趣的事件。`SVM` 算法尝试通过对输入变量进行线性或非线性变换，在\
  \ n-1 维空间内并在阈值（间隔）范围内拟合出具有最佳分类效果的分线。这些变换是通过使用核函数实现的。\n\n### 图 7.7：二维平面上的 SVM 超平面\n\
  \n![image](img/Ch07_FIG_03.jpg)\n\n让我们 `y[i] = ±1` 定义为标普 500 指数明天价格走势方向的预测，如果指数在下一个交易日上涨，则\
  \ `y[i] = +1`，如果指数在下一个交易日下跌，则 `y[i] = −1`。那么我们的分类器可以指定为 `x[i]` 的任何分离超平面函数，例如：\n\n\
  ```\nh(x[i]) = sign(w′x[i]+b)      (7.8)\n```\n\n其中 `w` 是法于超平面的分类向量，`b` 是偏置项。当 `w′x[i]\
  \ + b ≥ +1` 时，`y[i] = +1`；当 `w′x[i] + b ≤ −1` 时，`y[i] = −1`。`SVM` 中的优化问题是寻找归一化向量\
  \ `w` 和偏置项 `b`，以最大分离超平面上最接近的点（支持向量）之间的距离（间隔）。在现实中，上述的硬间隔线性分类器 `h(x[i])` 仅在训练数据线性可分时才是最优的。10\n\
  \n此外，在当前形式下，目标函数很难优化，因为观测值可能不是线性可分的，或者某些观测值可能不在分离平面的正确一侧，如图 7.7 所示。因此，`SVM` 中的分类问题通常表述为受约束优化问题，在满足所有观测值必须位于超平面正确一侧的约束下，最大化间隔\
  \ `[maxγ(w,b)]` $\\left\\lbrack {y_{i}\\left( {\\hat{w^{\\prime}}x_{i} + \\hat{b}}\
  \ \\right) \\geq 1} \\right\\rbrack$。\n\n$$\n\\max\\limits_{w,b}\\gamma\\left( {w,b}\
  \ \\right)\\ s.t.\\text{~~}y_{i}\\left( {\\hat{w^{\\prime}}x_{i} + \\hat{b}} \\\
  right) \\geq 1 \\quad (7.9)\n$$\n\n我们在此注意到，当范数 `\\|w\\|` 最小化时，超平面之间的距离最大，因为点 `x`\
  \ 与超平面之间的几何距离与其成比例（注：原文逻辑为 `\\|w\\|` 越小距离越大，此处按翻译表述数学逻辑关系）。\n\n\n\n`HPSVM` 过程是一种使用\
  \ `SVM` 方法对分类响应变量进行建模的高性能过程。该过程支持连续型和分类输入变量。`HPSVM` 语句包含了一些选项，用于指定其支持的两种优化技术（即：内点法\
  \ `[IPOINT]` 和活动集法 `[ACTIVESET]`）13，以及惩罚值（C=`），该值必须大于 0。`KERNEL` 语句指定算法应使用的核函数类型。默认核函数是线性核函数（`LINEAR`）。其他核函数包括多项式（`POLYNOM`）、径向基（`RBF`）和\
  \ sigmoid（`SIGMOID`）。`INPUT` 语句使用 `LEVEL` 选项（`NOMINAL` 或 `INTERVAL`）指定变量的列表和类型。`TARGET`\
  \ 语句指定 `PROC HPSVM` 尝试预测的目标变量名称。目标变量必须是二分类的，且与 `INPUT` 语句中的变量不同。\n\n### SAS Enterprise\
  \ Miner\n\n将 HP SVM 节点拖放到图表中。将其连接到数据划分节点的输出端口。在属性面板中，将惩罚值设置为 20，然后点击内点选项（Interior\
  \ Point Options）旁边的省略号。将核属性（Kernel Property）的值更改为 `Polynomial`并将多项式次数设置为 3。更新路径，然后在路径更新后运行节点。\n\
  \n### SAS Studio\n\n点击流程流中的 `![image](img/Ch07_Image33404.jpg)` 图标。然后选择 `SAS Program`\
  \ 在您的流程流中创建一个编程节点。将节点的输入端口连接到 `Partition` 数据节点的输出端口。双击节点。将下面的 SAS 程序复制并粘贴到代码（Code）区域，然后运行它。点击节点（Node）选项卡，并在名称（Name）区域中输入“HP\
  \ SVM”。保存您的流程流 ``![image](img/Ch07_Image33411.jpg)`。\n\n#### 程序 7.6：使用 PROC HPSVM\
  \ 分类股价走势\n\n```\n/*使用 HP 支持向量机过程对股市进行分类*/\nods graphics on;\nproc hpsvm data=emsas.spxrawp\
  \ method=ipoint;\n      id dates partition;\n      input &var_list. /level=interval;\n\
  \      kernel polynom/ degree=3;\n      target target/;\n      penalty C=20.0;\n\
  \      partition  rolevar=partition(validate='2');\n      code file =\"%sysfunc(pathname(work))/svmscore.sas\"\
  ;\n      output out=psvmout;\n      ods output fitstatistics=svmstats;\nrun;\n\n\
  /*比较预测结果与实际结果*/\nproc sort data=psvmout;\n      by dates;\nrun;\n\ndata svmout;\n\
  \      merge psvmout emsas.spxraw;\n      by dates;\n      /*****************************\n\
  \      与 7.2B 代码相同\n      **********************************/\n      if (Pred <\
  \ 0.5) then\n             P_Target = 0;\n      else P_Target = 1;\n      format\
  \ Classification $10. Role $9. Model $15.;\n\n      if (Target = P_Target) then\n\
  \              Classification = 'Correct';\n      else Classification = 'Incorrect';\n\
  \n      if Partition = '1' then\n              Role ='Train';\n      else Role ='Validate';\n\
  \n      if P_Target = 1 and Target=1 then\n              TP=1;\n      else TP='';\n\
  \n      if P_Target = 1 and Target=0 then\n              FP=1;\n      else FP='';\n\
  run;\n```\n\n\n\n伴随 `PROC HPFOREST`（调用该过程的 SAS 语句）的选项包括：`ALPHA`，指定潜在预测变量与目标变量之间关联性检验的\
  \ p 值；`BALANCE=YES|NO`，指定划分准则是否应确保每个目标类别中的观测值相等；`CATBINS`，指定在实现关联性检验时分配给名义预测变量的最大类别数；以及\
  \ `VARS_TO_TRY`，指定在每棵树中拆分节点时尝试的变量数量。其他选项包括：`IMPORTANCE`，用于请求变量重要性；以及 `INBAGN`，指定训练每棵树时应使用多少观测值。或者，您可以使用\
  \ `INBAGFRACTION` 或 `TRAINFRACTION` 指定使用部分比例的观测值来训练每棵树。`PRUNEFRACTION` 指定用于修剪树的训练观测值比例；`SCOREPROLE`\
  \ 指定用于对新观测值进行预测的观测集合。这可以是具有相同角色的值（`DEFAULT`）、`INBAG` 样本中的所有观测值（`INBAG`）、袋外样本（`OOB`）或验证数据集（`VALID`）。`TARGET`\
  \ 语句指定目标变量，而 `INPUT` 语句指定预测变量列表。`SCORE` 语句将预测值和 ID 变量保存到 SAS 数据集中，而 `SAVE` 语句用于指定保存过程创建的评分代码的文件和位置。\n\
  \n### SAS Enterprise Miner\n\n将 HP Forest 节点拖放到您的图表中。将其连接到数据拆分节点的输出端口。在属性面板中，将 `Number\
  \ of Variables to Consider` 设置为 10，将 `Proportion of OBS` 设置为 0.3，并将 `Maximum Depth`\
  \ 设置为 10。对于其余的超参数和模型选项，我们将使用属性面板中的默认设置。请继续更新路径，并在路径更新后运行该节点。\n\n### SAS Studio\n\
  \n点击流程流中的 ![image](img/Ch07_Image33404.jpg)。然后选择 SAS 程序在您的流程流中创建一个编程节点。将节点的输入端口连接到拆分数据节点的输出端口。双击该节点。将下面的\
  \ SAS 程序复制并粘贴到 Code 区域，然后运行它。点击 Node 选项卡，并在 Name 区域输入“HP Forest”。保存您的流程流 ![image](img/Ch07_Image33411.jpg)。\n\
  \n#### 程序 7.7: 使用 PROC HPFOREST 对股票价格走势分类\n\n```sas\n/*Classifying Stock Market\
  \ Directions Using HP Random Forest Procedure*/\nods graphics on;\n\nproc hpforest\
  \ data=emsas.spxrawp \n      maxtrees=100 vars_to_try=10 seed=12345 inbagfraction=0.3\n\
  \      maxdepth=10 leafsize=1 alpha=0.05 scoreprole=oob;\n      id dates partition;\n\
  \      target target/level=binary;\n```\n\n*(注：提供的文本在末尾包含重复且乱码的代码片段。我已根据初始程序 7.7\
  \ 的描述提取了核心 SAS 逻辑。）\n\n```sas\n/*Classifying Stock Market Directions Using HP Random\
  \ Forest Procedure*/\nods graphics on;\n\nproc hpforest data=emsas.spxrawp \n  \
  \    maxtrees=100 vars_to_try=10 seed=12345 inbagfraction=0.3\n      maxdepth=10\
  \ leafsize=1 alpha=0.05 scoreprole=oob;\n      id dates partition;\n      target\
  \ target/level=binary;\n```\n\n\n\n使用机器学习方法对变量之间的关系进行建模不受理论限制；因此，它们比推断统计方法更具灵活性。例如，机器学习方法可以通过结合从多个模型和算法获得的预测结果来推断变量之间的关系，从而产生可能更准确的预测。从集成（ensemble）模型获得的预测结果可能基于输入集成模型的所有算法的累积投票或平均预测。因此，集成模型的最终预测结果将取决于输入该模型的算法预测结果之间的一致性或分歧。`ENSEMBLE`\
  \ 节点仅在 SAS Enterprise Miner 中可用；然而，实现集成模型的 SAS 代码可以在 SAS Studio 中编写。\n\n### SAS\
  \ Enterprise Miner\n\n点击 `Model`（模型）选项卡。然后将 `Ensemble`（集成）节点拖放到你的图表上。将它的输入端口连接到所有上一个模型节点的输出端口。我们将在属性面板中使用默认设置进行估计（使用预测概率的平均值）。因此，请更新路径，并在路径更新后运行该节点。\n\
  \n| 在调用 `Ensemble` 节点或代码之前，必须先运行所有五个过程（`HPLOGISTICS`、`HPGENSELECT`、`HPNEURAL`、`HPSPLIT`\
  \ 和 `HPSVM`），因为 `ENSEMBLE.SAS` 程序文件也会调用这些模型的评分代码。每段代码都用于对 `SPXRAWP` 数据文件进行重新评分，以计算每个模型事件（1\
  \ 和 0）的后验概率。然后，通过取五个模型后验概率的平均值来计算集成模型的后验概率。与之前的演示一样，五个模型的评分代码使用 `\"%sysfunc(pathname(work))/\\\
  *\\*\\*\\*\\*.sas\"` 宏保存在你的 `WORK` 库的物理位置中。如果你更改了评分代码的物理位置，则需要编辑 `ENSEMBLE.SAS`\
  \ 文件中的这些行。 |\n\n| --- |\n\n### SAS Studio\n\n在你的流程流中点击 ![image](img/Ch07_Image33404.jpg)\
  \ 图标。然后选择 `SAS Program`（SAS 程序）在你的流程流中创建一个编程节点。将该节点的输入端口连接到所有上一个模型节点的输出端口。双击该节点。将下面的\
  \ SAS 程序复制并粘贴到代码区域，然后运行它。点击 `Node`（节点）选项卡，并在 `Name`（名称）区域输入“Ensemble”。保存你的流程流 ![image](img/Ch07_Image33411.jpg)。\n\
  \n### 程序 7.8：使用 ENSEMBLE 模型分类股价走势\n\n```sas\n/*使用集成模型对股市方向进行分类*/\n%datapull(Ensemble,Ensemble.sas);/*从\
  \ GitHub 拉取集成代码文件*/\n\n/*集成代码包含了来自之前模型的评分：HPLOGISTICS, HPGENSELECT, HPNEURAL, HPTREE,\
  \ HPSVM*/\n\ndata PEnsemble;\nset emsas.spxrawp;\n%include \"%sysfunc(pathname(work))/Ensemble.sas\"\
  ;\n/***首先计算来自模型的后验概率的平均值**\n **然后使用 50% 的阈值进行分类***/\nrun;\n\n/*比较预测结果与实际结果*/\ndata\
  \ Ensembleout;\nset PEnsemble;\n\n/**********************************\n与程序 7.2B\
  \ 代码相同\n**********************************/ \n    Model='Ensmbl';\n\n        if\
  \ (Pred < 0.5) then\n                P_Target = 0;\n        else P_Target = 1;\n\
  \    format Classification $10. Role $9. Model $15.;\n    if (Target = P_Target)\
  \ then Classification = 'Correct';\n       else Classification = 'Incorrect';\n\
  \       if Partition = '1' then Role ='Train';\n       else Role ='Validate';\n\
  if P_Target = 1 and Target=1 then TP=1; else TP=0;\n  if P_Target = 1 and Target=0\
  \ then FP=1; else FP=0;\n  if P_Target = 0 and Target=1 then FN=1; else FN=0;\n\
  \  if P_Target = 0 and Target=0 then TN=1; else TN=0;\n  label TP='True Positive'\
  \ FP='False Positive' FN='False Negative' TN='True Negative';\nrun;\n```\n\n所示对股市方向进行分类的\
  \ SAS 代码首先通过 `%datapull` 宏下载 `ENSEMBLE.SAS` 文件，并将其存储在 `WORK` 库的物理位置中。由于 `%INCLUDE`\
  \ 是一个全局语句，且全局语句不可执行，因此不能使用 `%INCLUDE` 语句来实现分类次日股市走势的条件逻辑。因此，使用了另一个 `DATA` 步骤来根据估计概率进行分类，这与之前的模型相同，程序\
  \ 7.8。\n\n## 结果\n\n输出 7.8 显示了训练和验证集中预测事件（正面市场波动）和非事件（负面市场波动）的百分比。图表显示概率分布密集。在训练和验证数据中，极少数观测值的正面市场结果概率高于\
  \ 65%（或低于 35%）。这种模式对于负面市场结果同样明显。模型进行的大部分分类是基于 50% 左右的概率。这表明分类市场方向的信噪比相对较低，并进一步说明了预测的困难性。\n\
  \n## 无监督学习算法\n\n无监督学习算法输入未标记的数据，任务是识别它们之间是否存在共性。这种方法与其他学习技术的区别在于，在迭代过程中需要的人为干预最少。\n\
  \n| 表 7.2：无监督学习算法 |\n| --- |\n| 算法 || 经典 || 高性能 |\n|  || PROC 语句 || EM 节点 || PROC\
  \ 语句 || EM 节点 |\n| 变量聚类 | VARCLUS | 聚类 |  ||  |\n| K-均聚类 | CLUS | 聚类 | HPCLUS |\
  \ HP 聚类 |\n| 主成分分析 | PRINCOMP | 主成分 | HPPRINCOMP | HP 主成分 |\n| 分箱 | BINNING | 转换变量\
  \ | HPBIN | HP 转换变量 |\n\n无监督学习算法使用的优化过程与监督学习算法使用的相似。算法递归地对数据进行分组，使得每次迭代都能导致特定损失函数的进一步减少或特定似然函数的增加，直到无法进一步改进所需目标为止。\n\
  \n\n\n\n\n在本章的上一节中，我们讨论了因子分析中的优化问题，以及主成分分析，并展示了如何利用它们来创建模拟投资组合的因子。在机器学习中，无监督算法通常用于聚类分析（`PROC\
  \ HPCLUS`）和降维（`PROC HPPRINCOMP`）。其他降维算法（如 `PROC HPBINNING` 和 `PROC HPVARCLUS`）的输出也可以作为输入馈到预测模型中。虽然我们不会深入探讨这些过程的细节，但您应该尝试使用它们，看看通过无监督学习算法的输入来增强监督学习算法是否能比我们目前讨论的七种监督学习算法产生更好的性能。表\
  \ 7.2 显示了一组无监督算法的 SAS 过程以及在 SAS Enterprise Miner 中对应的节点。\n\n## 模型选择标准\n模型选择标准分为三类，即：分类、数据挖掘和统计量。尽管我们大多数情况下将使用分类指标来选择最终模型，但检查另外两类选择标准也是有。\n\
  \n### 分类指标\n通常，分类问题的拟合统计量可以分为算法的准确率（accuracy）、精确率（precision）、召回率（recall）和特异性（specificity）。\n\
  \na. **准确率 (Accuracy)**：这评估了模型相对于其所做的所有分类，产生正确分类的整体能力（即真阳性 [`TP`] 和真阴性 [`TN`] 之和与真阳性\
  \ [`TP`]、真阴性 [`TN`]、假阳性 [`FP`] 和假阴性 [`NP`]之总和的比率）。\n\n$\\text{Accuracy~=~}\\frac{\\\
  text{TP~+TN}}{\\text{TP~+~TN~+~FP~+~FN}}$ (7.12)\n\n您最可能在 SAS 和其他常用的统计软件中看到该统计量的总误分类率，即模型的\
  \ 1–`Accuracy`。\n\nb. **精确率 (Precision)**：这评估了模型从其对目标结果的所有预测中，正确预测实际目标结果的能力（即 `TP`\
  \ 与 `TP` 和 `FP` 之和的比率）。\n\n$\\text{Precision~=~}\\frac{\\text{TP}}{\\text{TP~+~FP}}$\
  \ (7.13)\n\nc. **召回率 (Recall)**（敏感性）：这衡量了模型从数据集中实际发生的正结果数量中，正确预测正目标结果的能力（即 `TP`\
  \ 与 `TP` 和 `FN` 之和的比率）。\n\n$\\text{Recall~=~}\\frac{\\text{TP}}{\\text{TP~+~FN}}$\
  \ (7.14)\n\n由于我们同时关注标普 500 指数收益率的上升和下降，我们还将包含特异性指标。\n\nd. **特异性 (Specificity)**：这衡量了模型从数据集中发生的所有负结果实际观测值中，准确预测目标变量真阴性结果（收益率为负的日子）的能力。\n\
  \n$\\text{Specificity~=~}\\frac{\\text{TN}}{\\text{TN~+~FP}}$ (7.15)\n\ne. **混淆矩阵\
  \ (Confusion matrix)**：这是响应变量的实际分类与模型预测分类之间的交叉表。在二分类分类问题中，混淆矩阵用于快速概述模型预测的准确性或偏差。矩阵的左上角显示真阳性，右上显示假阳性，左下角显示假阴性，而右下角显示真阴性。\n\
  \n### 决策准则\n所有分类指标都衡量了模型相对于较大的结果池正确分类给定结果的能力，因此通常选择具有最高可选分类指标的模型。为了在所有交易日成功实施算法交易策略（无论市场方向如何），最优算法必须能够准确预测\
  \ `TP` 和 `TN` 事件。因此，本研究的主要模型选择标准是 `accuracy` 统计量（误分类率或 1–`Accuracy`），它衡量了算法对验证集所做出的真阳性和真阴性（假阴性和假阳性）预测的比例。\n\
  \n| 表 7.3: 混淆矩阵 |\n| --- |\n| | | 预测类别 |\n| 实际类别 | | 1 | 0 |\n| 1 | 真阳性 (TP) | 假阳性\
  \ (FP) |\n| 0 | 假阴性 (FN) | 真阴性 (TN) |\n\n## 数据挖掘指标\n数据挖掘指标通常根据某些预定义的建模目标评估算法。它们与分类指标的区别在于，它们并不一定衡量预测的精确性，而是衡量相对于某些指定阈值的接近程度或改进程度。\n\
  \na. **增益 (Gain)**：这计算了分位数内事件的百分比相对于该分位数内随机事件百分比的比例。\nb. **提升率 (Lift)**：这是每个分位数内正确响应百分比相对于基准响应百分比的比率。\n\
  c. **累计提升率 (Cumulative Lift)**：这是每个分位数内正确分类比例相对于基准响应百分比的累计比率。\nd. **利润 (Profit)**：如果属性面板中的选择标准中有利润选项，则该指标计算每个分位数的总利润。\n\
  e. **累计利润 (Cumulative Profit)**：该指标计算每个分位数的总利润。\nf. **接收者工作特征 (ROC)**：该指标计算了每个分位数真阳性率（敏感性）与假阳性率（1–`Specificity`）的比率。\n\
  g. **ROC 曲线下面积 (AUROC)**：该指标计算了算法将观测值正确排序到右分组中的能力（即负收益日位于实际正日左侧的概率）。这是通过估计 `ROC`\
  \ 曲线下方区域的梯形部分来实现。\nh. **基尼纯度指数 (Gini Impurity Index)**：这等于 2AUROC–1。该指标衡量了对随机选择的观测值进行错误分类的概率。\n\
  \n### 决策准则\n根据选择标准，通常选择具有最低基尼纯度指数或最高 `Gain`、`Lift`、`Cumulative Lift`、`Profit`、`Cumulative\
  \ Profit`、`ROC` 和 `AUROC` 模型。\n\n## 统计量\n统计量的目标与数据挖掘指标相似，但它们使用统计量作为评估基础。\n\na. **平均平方误差\
  \ (ASE)**：这是误差和 `SSE` 与样本量 `N` 的比率，`SSE`/`N`。\nb. **赤池信息准 (AIC) 和贝叶斯信息准 (BIC)**：这些指标通过计算带惩罚的目标函数估计模型的预测误差，惩罚是参数数量的函数。两种指标都在额外的模型参数和采样变异之间建立了平衡。这些统计量的数学公式为：\n\
  \n```\nAIC = -2ln(L) + 2K\nBIC = -2ln(L) + Kln(N)\n```\n\n其中 `ln(L)` 是模型的对数似然，`N`\
  \ 是样本量，`K` 是模型的参数数量。\n\n### 决策准则\n对于每个统计量，通常选择得分最低的模型。在平均平方误差的情况下，较低的值意味着预测值与实际值之间的偏差较小。`AIC`\
  \ 和 `BIC` 的似然函数也包含了每个预测值的偏差评分；因此，低值比高值更理想。\n\n\n\n\n\n现在让我们来演示如何在 SAS Enterprise\
  \ Miner 和 SAS Studio 中实现模型比较。在 SAS Enterprise Miner 中实现模型比较相对容易，因为它涉及使用拖放菜单。为了在\
  \ SAS Studio 中重现这些功能，我们需要编写大量的代码。\n\n### SAS Enterprise Miner\n\nSAS Enterprise\
  \ Miner 中的 `Model Comparison`（模型比较）节点可以根据之前描述的任何标准来对模型进行比较并选择冠军模型（champion model）。点击\
  \ `Assess`（评估）选项卡。然后，将 `Model comparison`（模型比较）节点拖放到你的图表中。将它的输入端口连接到所有之前模型节点的输出端口。在\
  \ `Properties`（属性）面板中，将 `Selection`（选择）和 `HP Selection Statistics`（HP 选择统计量）更改为\
  \ `Misclassification Rate`（误分类率）。然后将 `Selection` 表更改为 `Valid`（有效）。右键点击并运行该节点。\n\n\
  SAS Enterprise Miner 中的 `Model Comparison` 节点计算所有三类模型选择标准，以及一组常用于模型诊断的图表（例如分类图、`ROC\
  \ curves` 以及提升图和增益图）。它还会根据 `Properties` 面板中指定的评估标准自动选择冠军模型，并将模型的评分代码推送到 `Scoring`（评分）节点，该节点将用于对我们回测期间的数据进行评分。我们将讨论\
  \ `Model Comparison` 节点的结果以及来自 SAS Studio 方法的结果。\n\n### SAS Studio\n\n在 SAS Studio\
  \ 中重现 `Model Comparison` 的所有功能需要大量的 SAS 编程步骤。首先，我们将使用 `PROC PRINT` 和 `PROC SGRENDER`\
  \ 来打印之前从模型中获得的 `ODS fit statistics`（ODS 拟合统计）表。`Ensemble`（集成）模型没有 `ODS fit statistics`\
  \ 表，但它将通过多个 `DATA` 步骤以及 `TABULATE`、`SGRENDER` 和 `LOGISTICS` 过程与其他算法的性能进行比较。尽管我们会单独讨论每个编程步骤，但你可以在一个节点中运行所有代码。\n\
  \n现在，点击你流程中的中的 ![image](img/Ch07_Image33404.jpg) 图标。然后选择 `SAS Program` 在流程中创建一个编程节点。将该节点的输入端口连接到所有之前模型节点的输出端口。双击该节点。将\
  \ Programs 7.9 中的所有代码复制并粘贴到 7.13 代码区域，然后运行它。点击 `Node` 选项卡，然后在 `Name` 区域将节点命名为“Model\
  \ Comparison”。保存你的 `Process Flow`（流程）![image](img/Ch07_Image33411.jpg)。\n\n### 程序\
  \ 7.9A：使用 PROC PRINT 显示竞争模型的拟合统计摘要\n\n| \n\n```\n/*打印估计结果的拟合统计摘要*/\nproc print data=logstats;\n\
  \    title 'Logistic Regression Statistics';\n\nproc print data=glmstats;\n    title\
  \ 'GLM Regression Statistics';\n\nproc sgrender data=neuralstats template=HPDM.HPNEURAL.FitStatistics;\n\
  \    title 'Neural Network Statistics';\n\nproc print data=treestats;\n    title\
  \ 'Decision Tree Statistics';\n\nproc sgrender data=svmstats template=HPDM.HPSvm.FitStatistics;\n\
  \    title 'Support Vector Machine Statistics';\n\nproc print data=foreststats;\n\
  \    title 'Random Forest Statistics';\nrun;\n\ntitle;\n```\n\n |\n\n| --- |\n\n\
  Program 7.9A 显示了用于打印之前保存的三个参数模型和三个非参数模型的 `ODS` 拟合统计表的 SAS 代码。`PROC SGRENDER` 语句用于打印神经网络和\
  \ `SVM` 的拟合统计表，因为它们的 `ODS` 表是使用变量名而非标签保存的。\n\n### 程序 7.9B：使用 DATA 步骤和 TABULATE 生成准确率摘要\n\
  \n| \n\n```\n/*合并预测和分类 */\ndata Model1;\n    set logstats glmstats neuralstats treestats\
  \ svmstats foreststats;\nrun;\n\n/* 使用 Tabulate 计算分类准确率 */\nproc tabulate data=Model1;\n\
  \    class role;\n    table classification*(pctn)='Model Accuracy'*role;\nrun;\n\
  ```\n\n |\n\nProgram 7.9A 显示了用于打印之前保存的三个参数模型和三个非参数模型的 `ODS` 拟合统计表的 SAS 代码。`PROC\
  \ SGRENDER` 语句用于打印神经网络和 `SVM` 的拟合统计表，因为它们的 `ODS` 表是使用变量名而非标签保存的。\n\nProgram 7.9B\
  \ 显示了用于合并所有算法的预测和分类的 SAS 代码。注意 `DATA` 步骤使用了 `SET` 语句而非 `MERGE` 语句。使用 `SET` 语句允许我们堆叠每个算法的结果。\n\
  \nOutput 7.9 显示了 `TABULATE` 过程的结果。对于训练数据，算法的准确率从 `HP Neural` 模型的 54.6% 到 `HP Forest`\
  \ 算法的 94.8%。对于验证数据，准确率从 `HP Regression` 的 53.47% 到 `Ensemble` 的 57.33%。虽然数值并不完全相同，但在\
  \ SAS Enterprise Miner `Model Comparison` 节点的 `Fit Statistics` 表中可以发现相同的结果模式。\n\n\
  \n\n\n\nSAS 代码生成的视化结果如输出 7.10 所示。总体而言，图表显示所有算法在预测股市上涨的日子方面表现均较好，但在预测股市收益为负的日子方面表现较差。预测准确性的模式在训练集和验证集上都相对稳定。这在部分是因为股市收益为正日的信噪比通常比收益为负的日子高。从分析生命周期的角度来看，这意味着未来的模型修订应该更侧重于提高所有算法的真负性率（true\
  \ negative rates）。由于准确率是该项目主要的模型选择标准，我们的冠军模型（champion model）将是 `Ensemble` 模型，它在验证集中的误分类率最低。`Ensemble`\
  \ 模型也由 `Enterprise Miner` 中的 `Model Comparison`（模型比较）节点自动选中。\n\n尽管 `Ensemble` 被选为冠军模型，但进一步分析所有模型的结果至关重要，以发现系统性预测误差、过拟合和偏差的证据，并了解冠军模型和失败模型预测准确性的依据。从利润和风险管理的角度来看，一个错误分类了少数几个高财务影响股市日的模型，可能并不优于一个在这些日子表现极佳但错误分类了较多小财务影响日的模型。在用\
  \ `Ensemble` 模型的评分代码对回测数据进行评分之前，我们将对所有模型进行进一步诊断。\n\n### 程序 7.11：使用 PROC TABULATE\
  \ 比较混淆矩阵\n\n```\n/*Using Proc Tabulate to Compute the Classification Matrix*/\n\
  proc tabulate data=Modelcomp1;\n    class model target p_target role;\n    table\
  \  role*Target='Target', \n      Model='Comparing Model Classification \n      Matrix'*(pctn<P_Target>='Predicted')*P_Target=''\
  \ ;\nrun;\n```\n\n在程序 7.11 中，使用 `TABULATE`过程来生成所有算法的混淆（分类）矩阵。在 `TABLE` 语句中，股市的实际结果与每个模型生成的分类进行交叉表分析，然后根据观测数据的角色（data\
  \ role）进行堆叠。`PCTN<P_TARGET> *P_TARGET`语句用于请求行变量计数的单元格百分比（即每个算法将 1 [0] 分类为 1 [0]\
  \ 的百分比）。\n\n#### 输出 7.11：所有模型的混淆矩阵比较\n\n| ![image](img/Ch07_12.jpg) |\n| --- |\n\
  \n输出 7.11 显示了所有算法的混淆矩阵。该表提供了更多关于所检 Algorithm 算法固有弱点的证据，即真负性率的值非常低。回想“事件百分比图”（Percentage\
  \ of Event Plots），两种结果的预测概率分布都相对集中且分布在 50% 左右。这意味着分类对阈值的微小变化极其敏感。对于 `Ensemble` 模型，将股市日归类为正的概率阈值提高\
  \ 3%，将使真负性比例提高 20%，但会导致真正性百分比下降相同幅度。对模型准确性的净影响在训练数据中下降了 1%，在验证集中下降了 2%。\n\n程序 7.12\
  \ 使用 `PROC SQL` 语句生成算法指标和统计数据的摘要。然后使用 `PROC PRINT` 语句报告所有算法的统计数据摘要。\n\n### 程序 7.12：使用\
  \ PROC SQL 生成分类指标摘要\n\n```\n/*Using Proc Sql to Calculate Classification Measures*/\n\
  proc sql;\n    create table modelcomp2 as select Role as Role, Model as  Model,\
  \ \n             (sum(TP)+sum(TN))/(sum(TP)+sum(TN)+sum(FP)+sum(TN)) as Accuracy\
  \ , \n             1-(sum(TP)+sum(TN))/(sum(TP)+sum(TN)+sum(FP)+sum(TN)) \n    \
  \         label=\"Misclassfication Rate\" as Misclass , sum(TP)/(sum(TP)+sum(FP))\
  \ as \n             Precision, sum(TP)/(sum(TP)+sum(FN)) as Sensitivity, \n    \
  \         sum(TN)/(sum(TN)+sum(FP)) as Specificity, 1-sum(TN)/(sum(TN)+sum(FP))\
  \ \n             label=\"Misclassfication Rate\" as Misclass , sum(TN)/(sum(TN)\
  \ as Sensitivity;\nquit;\n\ntitle 'Summary of Fit';\n\nproc print data=modelcomp2\
  \ style(width=0.8 textalign=center) noobs;\n    var Role;\n    format Accuracy 4.2\
  \ Misclass 4.2 Precision 4.2 Sensitivity 4.2 Specificity 4.2;\nrun;\n```\n\n####\
  \ 输出 7.12A：所有模型的分类指标摘要\n\n| ![image](img/Ch07_12.jpg) |\n| --- |\n\n输出 7.11 显示了所有算法的混淆矩阵。该表提供了更多关于所检\
  \  算法固有弱点的证据，即真负性率的值非常低。回想“事件百分比图”，两种结果的预测概率分布都相对集中且分布在 50% 左右。这意味着分类对阈值的微小变化极其敏感。对于\
  \ `Ensemble` 模型，将股市日归类为正的概率阈值提高 3%，将使真负性比例提高 20%，但会导致真正性百分比下降相同幅度。对模型准确性的净影响在训练数据中下降了\
  \ 1%，在验证集中下降了 2%。\n\n（注：此处由于原文重复引用了输出 7.11 的描述，译文已按原文逻辑保留）\n\n\n\n\n\n```\n/*Using\
  \ PROC LOGISTICS to Compare ROC Curves*/\n%let _ROCOVERLAY_ENTRYTITLE = Comparing\
  \ ROC Curves (Data Role=Validate);\n\nproc logistic data=modelcomp3 (where=(role='Validate'));\n\
  \      model target(event='1')=Log_Pred GLM_Pred Neural_Pred \n               Tree_Pred\
  \ SVM_Pred        Forest_Pred Ens_Pred / nofit;\n      roc 'HPReg' pred=Log_Pred;\n\
  \      roc 'HPGLM' pred=GLM_Pred;\n      roc 'HPNNA' pred=Neural_Pred;\n      roc\
  \ 'HPTree' pred=Tree_Pred;\n      roc 'HPSVM' pred=SVM_Pred;\n      roc 'HPForest'\
  \ pred=Forest_Pred;\n      roc 'Ensmbl' pred=Ens_Pred;\n      ods select ROCOverlay;\n\
  run;\n%symdel _ROC_ENTRYTITLE;\n```\n\n## ROC 曲线分析\n\n模型比较（Model Comparison）节点创建的许多评估图之一是所有算法的\
  \ ROC 曲线。输出 7.13A 显示模型预测能力从训练数据集到验证数据集总体呈下降。对于训练数据集，图表显示随着分类阈值的增加，敏感性（sensitivity）与\
  \ 1-特异性（Specificity）的比率明显更高，而验证集的曲线则较平坦。虽然算法在训练集和验证集中的敏感性保持基本不变，但算法的特异性在验证数据集中有所下降，导致图上显示的敏感性与\
  \ 1-特异性比率更低。\n\n输出 7.13A：使用模型比较节点拟合模型的 ROC 曲线\n\n| ![image](img/Ch07_out_7-13a.jpg)\
  \ |\n| --- |\n\n输出 7.13B：使用 PROC LOGISTIC 拟合模型的 ROC 曲线\n\n| ![image](img/Ch07_out_7-13b.jpg)\
  \ |\n| --- |\n\n## 模型评估与流程图\n\n总而言之，鉴于预测股票市场结果的困难性，集成模型（Ensemble model）56% 的准确率是一个相当理想的准确率。考虑到美国市场较高的效率水平以及新闻到达的随机性，期望市场预测算法具有极高的准确率是不切实际的。主动投资组合管理的目标是在风险调整的基础上优于基准。因此，如果我们的集成模型能够优于标普\
  \ 500 指数的被动头寸，那么它就实现了其目标。我们将在下一节评估情况是否确实如此。\n\n图 7.9A：SAS Studio 流程图\n\n![image](img/Ch07_out_07_9.jpg)\n\
  \n### 流程图\n\n图 7.9A 显示了在 SAS Studio 中创建的项目流程图。而图 7.9B 显示了 SAS Enterprise Miner 中的流程图。请记住，每个节点都包含代码包，你可以将它们组合运行或作为一系列连接的步骤运行。从操作角度来看，使用流程图将有助于你的机器学习项目的自动化。你只需要登录到\
  \ SAS 环境并运行流程即可实现端到端功能。\n\n## 将我们的算法策略相对于标普 500 指数的被动投资策略进行回测\n\n为了评估最佳拟合算法在投资环境中的有效性，我们将使用留存期（holdout\
  \ subperiod）的数据对模型进行回测，该时期从 2021 年 1 月 2 日到 2022 年 7 月 31 日。15 首先，我们创建两个假设的投资组合，每个组合的初始价值为\
  \ 100 万美元。对于第一个组合，我们将构建一个初始价值为 100 万美元的投资组合，根据集成模型在收盘时的预测来构建交易信号。如果模型预测标普 500 指数明天将更高，我们将买入三个月标普\
  \ 500 期货的头寸（价格为标普 500 指数收盘值的 50 倍，一至周四下午 5:00 开盘，周日下午 6:00 开盘）；如果模型预测相反，则建立空头头寸。我们每天更新模型，并在期货市场开盘时平仓。\n\
  \n图 7.9B：SAS Enterprise Miner 流程图\n\n![image](img/Ch07_out_7-13b.jpg)\n\n为了该策略建立基准，对于第二个组合，我们将从\
  \ 2021 年 1 月 2 日开始构建一个 100 万美元的标普 500 指数被动投资组合，并在相同的留存期内持有。留存期结束后，我们将检查算法组合是否在绝对值和风险调整的基础上优于指数。\n\
  \n事实证明，持有标普 500 期货头寸不需要大量的资金支出。你只需要缴纳初始保证金（约为头寸名义价值的 5.5%）并保留约 5% 的维护保证金。这意味着你可以将剩余金额（约\
  \ 94 万美元）投资于无风险资产以获得额外收益，同时保持与全资金投入指数的人相似的风险敞口。然而，为了确保与被动策略的比较是不偏的，我们假设期货头寸是全额资金的且不产生利息。每天的合约规模取决于下午\
  \ 5:00 的期货市值。如果之前的交易带来了组合价值的收益，则购买更多合约；如果结束的头寸导致亏损，则购买较少合约。你应该注意所有期货合约都有到期日。我们将在季度末将头寸展期到下一个可用期限。全额资金期货头寸的交易成本在绝对意义上是可以不计的（平均每年\
  \ 20 个基点），根据芝加哥商品交易所（CME）小组进行的一项研究，这仍然比多头指数头寸便宜。16\n\n因此，我们将忽略交易成本，因为它对组合最终价值的影响微乎其微。\n\
  \n`SPXSCORE` 数据集包含回测期间的评分数据。数据集包含原始数据中的所有变量，以及三个月期标普 500 迷你期货的每日开盘价和收盘价。\n\n程序 7.14A：使用冠军模型的评分代码对留存数据进行评分\n\
  \n\n\n\n\n```sas\n/*使用评分代码对冠军模型进行回测*/\n/*从 GitHub 获取集成模型的评分代码*/\n%datapull(Ensemble,Ensemble.sas);\n\
  \n/*使用 DATA Step 对留数据进行评分*/\ndata pscorespx;\n      set emsas.spxscore;\n      %include\
  \ \"%sysfunc(pathname(work))/Ensemble.sas\";\nrun;\n\ndata scorespx;\n      set\
  \ pscorespx;\n      format Classification $10. CMatrix $8.;\n      if (I_Target=Index_out)\
  \ then do;\n               Classification='Correct';\n               Algo_ret=abs(OTO_FRet);/*开开开期货回报*/\n\
  \      end;\n      else do;\n               Classification='Incorrect';\n      \
  \         Algo_Ret=-1*abs(OTO_FRet);\n      end;\n      EXAlgo_Ret=Algo_Ret-RF;\
  \ /*算法超额收益*/\n      EXIndex_Ret=Index_Ret-RF;/*指数超额收益*/\n      if I_Target=1 and\
  \  Index_out=1 then CMatrix='TP';\n      if I_Target=1 and  Index_out=0 then CMatrix='FP';\n\
  \      if I_Target=0 and  Index_out=1 then CMatrix='FN';\n      if I_Target=0 and\
  \  Index_out=0 then CMatrix='TN';\n\nlabel CMatrix='预测条件' \nAlgo_Ret='算法收益';\n\n\
  \      /*累计收益*/\n      Sumiret+Index_Ret; /*被动指数并持有*/\n      Sumaret+algo_Ret; \
  \ /*基于算法的*/\n      IndexVal =1000000*exp(sumiret); /*指数投资组合价值*/\n      AlgoVal =1000000*exp(sumaret);/*算法投资组合价值*/\n\
  \      format IndexVal dollar16.2 AlgoVal dollar16.2;\n      label IndexVal= '指数投资组合价值'\
  \ AlgoVal ='算法投资组合价值';\nrun;\n```\n\n### 程序 7.14A\n\n程序 `7.14A` 从 GitHub 仓库提取 `Ensemble`\
  \ 模型的评分代码。随后，它使用 `DATA` 步和 `INCLUDE` 语句使用下载的 `ENSEMBLE.sas` 文件对 `SPXSCORE` 数据集进行评分。第二个\
  \ `DATA` 步用于计算根据模型预测所执行的算法交易的每日收益。请注意，与指数同步移动的被动投资组合不同，算法投资组合的收益取决于预测的准确性。只要算法的预测与市场结果一致，无论股市方向如何，投资组合都将获得正收益。因此，如果它错误分类了市场结果，无论下一个交易日的实际结果如何，投资组合都将获得负收益。这意味着算法投资组合在市场下跌时可能盈利（真阴性分类），而在市场上涨时亏损（假阳性分类）。简而言之，算法投资组合只有在做出真阳性和真阴性分类时才能获得正收益，无论市场结果如何。该\
  \ `DATA` 步的代码在结束时，使用持有期内的连续连续复利收益率计算了算法投资组合和被动投资组合的每日价值。\n\n### 程序 7.14B：使用 PROC\
  \ SGPLOT 在回测期间绘制分类准确率图\n\n```sas\n/*使用 PROC SGPLOT 绘制分类准确率图*/\nods graphics / reset\
  \ width=6.4in height=4.8in imagemap;\n\nproc sgplot data=Scorespx;\n      title\
  \ height=12pt \"预测准确率（回测期间）\";\nvbar Index_Out / group=Classification groupdisplay=stack\
  \ stat=percent dataskin=p;\n      yaxis grid=\"预测百分比\";\nrun;\n\nods graphics /\
  \ reset;\ntitle;\n```\n\n程序 `7.14B` 显示了用于 `SGPLOT` 过程的 SAS 代码，该过程用于使用 `Ensemble`\
  \ 模型创建留出子期间预测结果的柱状图。调用该过程生成的柱状图如 `Output 7.14` 所示。图中显而易见的是我们在训练和验证数据集中观察到的相同预测准确率模式。`Ensemble`\
  \ 模型在分类具有正收益的交易日时表现良好，但在处理具有负收益的交易日时持续表现糟糕。\n\n#### 输出 7.14：回测期间集成模型的分类准确率\n\n让我们检查这种不平衡的准确率对算法投资组合整体性能的财务影响。程序\
  \ `7.15` 显示了用于 `REPORT` 过程的代码，该过程用于生成算法和被动投资组合的性能报告。`PROC REPORT` 通过扩展 `TABULATE`、`FREQ`、`SUMMARY`\
  \ 和 `PRINT` 的功能，允许在创建报告时进行自定义计算、条件格式格式。虽然处理起来相当复杂，但它的功能使其适用于构建我们的性能表。在过程代码中，展示了算法和被动投资组合的并列性能报告，以及条件和自定义计算。这些条件和自定义计算被用于创建总计、年化平均值、标准差以及两种策略的夏普比率的行。\n\
  \n### 程序 7.15：使用 PROC REPORT 计算投资组合性能\n\n```sas\n/*使用 PROC REPORT 比较投资组合性能*/\nproc\
  \ report data=scorespx ;\ncolumns ('回测算法投资组合相对于被动指数策略的性能'(\n('算法投资组合'(Algo_Ret=Asum\
  \ Algo_Ret=mean Algo_Ret=Astd AAmean AAstd ExAlgo_Ret=EXAmean ExAlgo_Ret=EXstd))\n\
  ('指数投资组合' (Index_Ret=Isum Index_Ret=mean Index_Ret=std AImean AIstd ExIndex_Ret=EXImean\
  \ ExIndex_Ret=EXstd ISharpe)));\n\n  define Cmatrix/group style(header)=[textalign=left]\
  \ left;\n****************算法投资组合****************\n  define Asum/analysis sum format=percent.2\
  \ '总收益' center;\n  define Amean/analysis mean format=percent.2 '每日平均收益' noprint;\n\
  \  define Astd/analysis std format=percent.2 '标准差' noprint;\n  define AAmean/computed\
  \ format=percent.2 '年化平均收益' center;\n  compute AAmean;\n    AAmean =amean*252;\n\
  \  endcomp;\n  define AAstd/computed format=percent.2 '年化标准差' center;\n  compute\
  \ AAstd;\n    AAStd =Astd*sqrt(252);\n  endcomp;\n\n  /*计算超额收益的平均值和标准差*/\n  define\
  \ ExAmean/analysis mean format=percent.2 noprint ;\n  define EXAstd/analysis std\
  \ format=percent.2 noprint ;\n\n  define ASharpe/computed format=best6.2 '夏普比率'\
  \ center;\n  compute ASharpe;\n    if Amean>0 then ASharpe=EXAmean/ExAstd;\n  endcomp;\n\
  \n****************被动投资组合计算**/\n  define Isum/analysis sum format=percent.2 '总收益'\
  \ center;\n  define Imean/analysis mean format=percent.2 '每日平均收益' noprint;\n  define\
  \ Istd/analysis std format=percent.2 '标准差' noprint;\n  define AImean/computed format=percent.2\
  \ '年化平均收益' center;\n  compute AImean;\n    AImean =Imean*252;\n  endcomp;\n  define\
  \ AIstd/computed format=percent.2 '年化标准差' center;\n  compute AIstd;\n    AIstd =Istd*sqrt(252);\n\
  \  endcomp;\n\n  rbreak after / summarize style=[font_weight=bold] ;\n  compute\
  \ Cmatrix; \n    if CMatrix='' then\n      CMatrix='Total';\n  endcomp;\nrun;\n\
  ```\n\n\n\n\n\n输出 7.15 显示了根据程序 7.15 生成的性能报告。总体而言，我们可以看到，算法组合在绝对收益和风险调整收益方面（使用`夏普比率`作为风险调整后收益的衡量标准）均优于被动指数组合。在回测期间，算法组合获得的总收益超过了被动组合约\
  \ 8%。算法组合在回测期间的总收益为 18.78%，而被动指数组合则为 10.70%。算法组合的平均日收益约为 0.05%（表格中未显示），累计年化收益率约为\
  \ 11.95%。相比之下，被动指数组合的平均日收益约为 0.03%，按年化基准计算累计约为 6.81%。有趣的是，两个组合的风险非常相似，算法组合的日和年化标准差略低。算法组合巨大的收益表现和相对较低的风险解释了为什么算法组合的`夏普比率`几乎是被动组合价值的两倍。\n\
  \n#### 输出 7.15：回测算法组合的性能报告\n\n| ![image](img/Ch07_14.jpg) |\n| --- |\n\n#### 收益归因\n\
  \n为什么集成模型的表现优于被动策略？首先，让我们检查算法对分类阈值的预测准确性。集成模型成功地分类了大多数具有正收益的交易日（`TP`），以及少数具有负收益的交易日（`TN`）。请注意，两种方法下`TP`日的总收益收益基本相同，但`TN`日的总收益则并非如此。算法捕捉到了如果在指数收益率为负的交易日上达到\
  \ 100% 准确率，本可以获得的可能收益的约 15%。算法组合在`TP`日的平均日收益（表格中未显示）为 0.81%，而`TN`日的平均日收益为 0.99%。该算法虽然产生了大量的假阳性（`FP`）分类，但其每次错误分类的成本远低于其产生的数量较少的假阴性（`FN`）分类。`FP`日的平均收益（0.79%）远低于`FN`日的平均收益（1.02%）。在回测期间，算法的准确率实际上下降到约\
  \ 52.5%。在回测期间的 396 天中，它正确分类了 208 天，错误分类了 188 天。尽管如此，它通过准确分类获得了 174.64%，而因错误分类后续交易日的状况损失了\
  \ 155.9%，从而净得 18.78% 的总收益。\n\n#### 程序 7.16：使用 PROC SGPLOT 绘制后验概率与实际指数收益之间的性图\n\n\
  ```sas\n/* 使用 SGPLOT 过程绘制后验概率与实际指数收益之间的关系*/\nproc sgplot data=scorespx;\n    title\
  \ height=12pt \"市场向上波动的预测概率\";\n    scatter x = index_ret y=P_Target1/group=I_Target\
  \ markeroutlineattrs=( thickness=1) markerattrs=(symbol=circlefilled size=10);\n\
  \    reg x = index_ret y=P_Target1/  clm;\n    yaxis label='Predicted Probabilities';\n\
  \    xaxis valuesformat=percent8.2 values=(-0.04 to 0.03 by 0.01);\nrun;\n```\n\n\
  接下来，我们将检查模型估计的后验概率是否与下一个交易日实际收益的幅度相关。了解算法是否仅适用于预测特定范围的市场波动（而非所有可能的波动）将具有价值。这样一来，我们就可以调整分类阈值来考虑此类属性。程序\
  \ 7.16 中，后验概率绘制在 Y 轴上，而下一个交易日的实际指数收益绘制在 X 轴上。理想情况下，你希望看到图中所有的红点都位于左下限，所有的蓝点都位于右上限。这种结果意味着对每种结果都估计了正确的后验概率。然而，左上角大量的蓝点表明，算法持续对实际价格负波动的日期分配了高概率的向上运动，即使在某些价格负波动非常明显的日期也是如此。从图中右下角的红点也可以看到，模型还对价格正向波动明显的日期分配了低概率的向上运动。然而，大量的蓝点位于`TP`象限，且分配给该象限每个点的估计后验概率似乎与下一个交易日指数收益的幅度正相关。\n\
  \n#### 输出 7.16A：后验概率与实际指数收益之间的相关性\n\n| ![image](img/Ch07_out_7-16.jpg) |\n| ---\
  \ |\n\n在输出 7.16B 中，我们检查了改变分类阈值是否会导致预测概率与指数次日收益实际幅度之间的对齐得到改善。我们使用 40% 的正收益概率作为分类阈值，重新绘制了\
  \ Y 轴后验概率、X 轴为下一个交易日实际指数收益的图。你会在新图中注意到，较低的分类阈值导致`TP`日和`FP`日的数量都显著增加。\n\n#### 输出\
  \ 7.16B：后验概率与实际指数收益之间的相关性（40% 阈值）\n\n| ![image](img/Ch07_out_7-16b.jpg) |\n| ---\
  \ |\n\n几乎所有的正收益股票日在阈值下都被正确分类（209 天中的 202 天）。然而，这种结果付出了巨大的代价。在留存期间（holdout period）有约\
  \ 52.78% 的正收益交易日。在 50% 的分类阈值下，这些日期中 83.7% 已被正确分类。将阈值降低到 40% 使`TP`日增加了 27 天，但也使`FP`日增加了\
  \ 30 天。较低的分类阈值会导致`TP`日和`FN`日的总收益增加 51.24%，但`FP`日和`TN`日的收益损失了 61.26%。改变分类阈值的综合净效应是总收益表现为\
  \ 8.53%，如输出 7.16C 所示。\n\n尽管我们仍然坚持使用最初的 50% 分类阈值，但我们建议读者通过修改程序 7.14A 对不同的分类阈值进行实验。在`DATA`\
  \ 步骤代码的`FORMAT`语句下方添加代码行：`IF P_TARGET1>= \"替换为所需的阈值（小数形式）\" THEN I_TARGET=1; ELSE\
  \ I_TARGET=0;`。\n\n#### 输出 7.16C：40% 正收益分类阈值下的组合表现\n\n| ![image](img/Ch07_15.jpg)\
  \ |\n| --- |\n\n#### 收益的周期性\n\n\n\n\n\n接下来，我们将检查模型在不同市场环境下的表现。算法是在所有市场条件下都表现更好，还是仅在市场波动、平静、上涨、崩盘或回调时表现更好？这是一个非常有价值的洞察，可能会影响算法的整体实用性。例如，该算法可能仅在短期内不太可能重复的市场条件下有效，例如在新冠大疫情期间。\n\
  \n### 程序 7.17：使用 `PROC SGPLOT` 比较投资组合价值（基于算法策略与指数策略）\n\n```\n/*Comparing Portfolio\
  \ Values Using PROC SGPLOT*/\nproc sgplot data=scorespx;\n      title height=14pt\
  \ \"Daily Portfolio Values\";\n      series x=Dates y=IndexVal/;\n      series x=\
  \  Dates y=AlgoVal;\n      yaxis label='Daily Portfolio Values';\nrun;\ntitle;\n\
  ```\n\n[程序 7.17] 显示了 `SGPLOT` 过程的代码，该过程用于绘制算法组合和被动组合的每日价值图。注意[输出 7.17] 图表所示，从 2021\
  \ 年 1 月到 9 月，算法相对于被动策略的优越程度。随后，算法的表现在 2021 年 11 月发生的短期回调期间崩塌。在年底的反弹中，它再次表现优异。然后在\
  \ 2022 年 1 月开始的回调期间表现不佳。模型未能捕捉到 2022 年 3 月至 4 月之间发生的短期上涨。随后，算法的优越性在 2022 年 5 月至\
  \ 7 月之间显著增长。总体而言，这些模式表明模型的大部分性能受限于市场上升趋势时期。由于大量的假阳性分类，模型在市场下降趋势期间会遭受巨大损失。根据这些假阳性信号进行交易的投资者将在正确策略应该是持有空头头寸时持有\
  \ EMini 期货的多头头寸。这种模型在市场崩盘期间导致投资组合价值的灾难性损失。\n\n最后，使用期货头寸对于实现优越表现也至关重要。因为指数期货几乎每天交易\
  \ 24 小时，我们可以在股市收盘后立即利用从算法中获得的洞察。如果我们等到第二天早上再通过在开盘时买入或卖空标普 500 交易所交易基金（ETF）来根据算法获得的信号进行交易，我们将获得大约\
  \ 11% 的收益，这与持有被动指数头寸相当。\n\n### 输出 7.17：算法策略与被动指数策略的投资组合价值对比\n\n| ![image](img/Ch07_16.jpg)\
  \ |\n| --- |\n\n## 结语\n\n记住，交易策略的回测是在受控环境中进行的，模型的所有因素都是预先设定的。当你部署模型时，这些条件在现实世界中可能不再成立。因此，在投入资金风险之前，需要在实盘模拟交易环境中对模型进行进一步测试。尽管这纯粹是一个学术练习，但算法预测次日市场方向的能力具有某些事实依据。这解释了为什么美国交易所超过\
  \ 70% 的交易是由计算机智能系统驱动的。预测广基市场指数的方向是投资领域使用的许多算法实现方式之一。\n\n随着更复杂的算法的发展和更多计算资源的投入，人们只能预期算法在投资和整个金融服务中将发挥更加重要的作用。虽然在其他环境中部署算法可能需要高预测准确率，但在现实中，对于投资目的来说这种限制是不必要的。你只需要一个比金融市场中的人类和其他参与者（包括算法）能够做出更好预测的模型，特别是在市场发生重大运动期间。\n\
  \n需要注意的是，时机选择和实际使用的投资产品可能对我们获得的结果也产生了影响。预测股市结果仍然是一项挑战性任务。然而，通过正确分类额外的 20 个天获得的 8%\
  \ 净收益，以及进一步微调模型以改进假阳性分类的可能性，为那些从事此类交易的人士继续开发更好、更复杂的交易算法提供了强有动力。\n\n## 练习\n\n此练习需要\
