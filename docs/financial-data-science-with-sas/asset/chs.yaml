  \ 4520.16 || 184 ||  ||  ||  ||  ||  |\n| 3/25/2022 || 4543.06 ||  ||  ||  ||  ||\
  \  ||  |\n| 3/28/2022 || 4575.52 ||  ||  ||  ||  ||  ||  |\n| 3/29/2022 || 4631.60\
