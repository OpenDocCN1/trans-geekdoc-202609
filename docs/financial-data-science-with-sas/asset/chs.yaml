  \ INVESCO LTD. |\n| AAPL | APPLE INC. | GWW | WW GRAINGER INC. | TSLA | TESLA INC.\
  \ |\n| DAL | DELTA AIR LINES INC. | ET | ENERGY TRANSFER LP | MPC | MARATHON PETROLEUM\
  \ CORP. |\n| BKNG | BOOKING HOLDINGS INC. | KFRC | KFORCE INC. | LYB | LYONDELLBASELL\
