  \  ||  ||  |\n\n由于市场结构的差异，不同金融市场之间的数据记录方式也存在一些差异（时间戳不兼容）。股票和债券等传统资产类的金融市场在每个工作日（周一至周五）的固定时段内运行（股票：上午\
  \ 9:30 至下午 4:00；债券：上午 8:00 至下午 5:00）。美国期货市场在周日东部时间（EST）下午 6:00 开放，并大部分时间一直开放到周五\
  \ EST 下午 4:00。其他全球联动且交易加密货币和外汇等更奇特的市场是每天 24 小时、每周 7 天运行的。固定收益市场遵守所有联邦假日，而股票市场则不遵守两个联邦假日。\n\
  \n必须仔细地同步来自所有市场的数据，以避免分析中产生偏差。表 2.4 显示了六个市场指数的部分同步每小时数据：比特币、标普 500、原油、美元/欧元汇率、标普\
  \ 500 迷你型期货和黄金。尽管所有六个指数的价格是用相同的频率记录的，但由于每个市场结构的差异，某些市场的价格并未在每个时间索引上都记录。\n\n在你的分析项目中，极可能会遇到此类金融数据结构中的变异。你应该注意，在对数据进行可视化和分析之前合并来自不同源的原始数据时，需要特别注意。下面介绍了解决此问题的几种方法。\n\
