  \n描述性可视化应该通过揭示嵌入在数据中的洞察来提高清晰度。它还应该有助于理解那些复杂到无法用语言解释的数据特征。\n\n在大多数分析项目中，数据科学家担任顾问角色，他们为可能不具备数据科学背景的项目所有提供专业知识。因此，为了增强其专业知识的价值主张，数据科学家必须在与数据科学相关的硬软技能方面培养能力和最佳实践。\n\
  \n描述性可视化应该通过揭示嵌入在数据中的洞察来提高清晰度。它还应该有助于理解那些复杂到无法用语言解释的数据特征。\n\n*   **简单性**：遵循奥卡姆剃刀，最简单的可视化通常是最好的。当观众与可视化制作者之间地理位置较远（例如卖方投资报告的消费者），或者可视化作为独立文档或摘要极少的文档呈现时，可视化应为观众提供一个对洞察的连贯描绘。这不仅使其看起来很混乱，观众也很很难定位状态。\n\
  \n*   **相关性**：可视化必须与所强调的数据类型和现象保持一致。例如，数据中的关系应该通过具有至少两个维度的可视化（如散点图）描述，而数据中的趋势应该通过包含时间元素的可视化来描述。\n\
  \n*   **一致性**：无论在业务中的应用领域，有效的可视化都需要图形特征的使用上保持一致性。这是因为这些特征（如颜色、图表类型、图例、标记和形状）是良好故事讲述的核心组成部分。这是因为。当观众与可视化制作者之间地理位置较远（例如卖方投资报告的消费者），或者可视化作为独立文档或摘要极少的文档呈现时，可视化应为观众提供一个对洞察的连贯描绘。这不仅使其看起来很混乱，观众也很难定位状态。\n\
  \n*   **相关性**：可视化必须与所强调的数据类型和现象保持一致。例如，数据中的关系应该通过具有至少两个维度的可视化（如散点图）描述，而数据中的趋势应该通过包含时间元素的可视化来描述。\n\
  \n### 诊断性可视化\n\n诊断性可视化主要用于在探索阶段分析数据中的统计属性和异常。它们帮助数据科学家在发现阶段设计合适的数据分析方法。诊断性可视化也可用于建模后阶段，以评估用于数据建模技术的合理性。与通常由更广泛利益相关者消费的描述性可视化不同，诊断性可视化的消费者通常是数据科学家自己。事实上，大多数诊断性可视化往往是数据上应用某些统计或计量经济学方法的副产品。\n\
  \n图 2.3：比较简单收益、对数收益和年度持有期收益\n\n![image](img/Ch02_fig_2-3.jpg)\n\n\n\n\n可视化内容必须与所研究数据的统计框架（理论和属性）保持一致。如果可视化没有建立在正确的统计框架之上，就会增加在评估数据属性以及用于进一步探索数据的统计模型时可能产生统计错误的概率。\n\
  \n考虑 `Q-Q plot`（Q-Q 图），这是一种散点图类型的可视化工具，通常用于评估经验分布是否接近理论分布。由于不同类型的分布具有不同的统计属性，该图的句用性取决于是否将正确的经验分布与理论分布相匹配。例如，考虑股票价格分布的正态性概念。由于股票价格不能为负数，因此股票价格的分布具有经验下限，但没有经验上限。这意味着股票价格分布是右偏的，因此不是正态的。考虑到这一点，在将数据绘制在正态\
  \ `Q-Q plot` 之前，通常会对对 string 价格序列进行某种类型的转换（计算收益率）。然而，大多数读者熟悉的简单收益率（计算公式为 $R_{t}\
  \ = \\frac{P_{t} - P_{t - 1}}{P_{t - 1~}})^{1}$）也是非对称且非相加的，因此从本质上说不是正态的。因此，在使用正态\
  \ `Q-Q plot` 探索股票价格统计属性时，最合适的转换是对数收益率序列（计算公式为 $R_{t} = Log(\\frac{P_{t}}{P_{t -\
  \ 1~}})`），它是对称且可加的。1\n\n图 2.3 显示了 1991 年至 2022 年标普 500 指数年度收益率的三个核密度图，这些图是分别使用累计简单月收益、累计对数月收益和年度持有期收益计算的。从简单收益率计算出的累计年收益率分布与从对数收益和实际持有期收益计算出的累计收益呈现出显著不同的形状。简单收益率图比对数收益和实际收益具有更高的峰值和更肥的负尾。对数收益似乎似乎比简单收益率更准确地追踪了实际持有情况。\n\
  \n## 金融数据预处理\n\n所有原始数据在进行可视化和分析之前都需要经过某种类型的预处理。作为一名金融数据科学家，你应该预计在分析生命周期中花费大量比例进行数据预处理。你在分析项目中使用的原始数据存在于三种数据结构之一：结构化、非结构化或半结构化。\n\
  \n## 结构化数据\n\n这些是经过系统收集和组织的数据，可以被轻松读取和分析。它们由存储在预定义行和列中的字母数字值组成。每行或每列都经过预定义，以接受特定类型的字母数字值。\n\
  \n在 `SAS` 中，格式分为大类数据类型：`NUMERIC`（例如整数、浮点数、实数、日期和时间等）以及 `CHARACTERs` 或 `CHAR`（包括布尔值、固定长度和变长字符字符串）。需要注意的是，格式决定了可以在这些变量上执行的可视化类型、分析和数学操作。\n\
  \n结构化数据的示例包括存储在文本文件、电子表格应用程序和关系数据库中的数据。金融数据科学家更有可能遇到结构化格式存储的数据，而不是任何其他格式。然而，数据科学领域的最新创新使得非结构化数据和半结构化数据在金融数据科学项目中发挥着日益重要的作用。\n\
  \n| 表 2.1：表格格式的结构化数据 |\n| --- |\n| 股票代码 || 名称 || 价格 || 每股销售 || 利润率 || ROA || ROE\
  \ |\n| AAPL || Apple Inc || $150.82 || $24.10 || 25.3% || 28.4% || 175.5% |\n| META\
  \ || Meta Platforms Inc || $188.77 || $43.43 || 19.9% || 13.2% || 18.5% |\n| WMT\
  \ || Walmart Inc || $143.62 || $218.85 || 2.4% || 3.6% || 11.6% |\n| CAT || Caterpillar\
  \ Inc || $244.90 || $112.89 || 11.3% || 8.1% || 41.4% |\n| WFC || Wells Fargo Co\
  \ || $47.23 || $21.78 || 17.9% || 0.7% || 7.4% |\n\n## 非结构化数据\n\n这些数据在没有预格式或进入任何特定数据模型的情况下收集和存储。非结构化数据通常以原始形式存储，因此在进行分析或可视化之前需要复杂的处理。由于缺乏定义的数据模型，它们不适用于传统的数据管理系统。因此，有时需要非关系数据库（`NoSQL`）来进行数据管理。\n\
  \n非结构化数据可以是任何格式，但主要由文本、图像、音频和物联网（`IoT`）传感器数据组成。从金融数据科学的角度来看，非结构化数据可以为嵌入结构化数据的见察提供定性丰富性。并引发了金融数据科学领域对其兴趣的增长。例如，对文本数据和音频评论的自然语言处理已取得进展。文本数据包括推文、公司公告、新闻文章。音频评论包括会议。在\
  \ `SAS` 中，非结构化数据格式化为 `VARBINARY`。\n\n| 表 2.2：表格格式的非结构化数据 |\n| --- |\n| 日期 || 股票代码\
  \ || 推文 || 公司 |\n| 11/29/21 6:58 AM || TSLA | 特斯拉宣布 Model3 升级 | Tesla, Inc. |\n\
  | 11/29/21 6:59 AM || AMZN | 亚马逊第三季度销售状况良好 | Amazon.com, Inc. |\n| 11/29/21 7:00\
  \ AM || AAPL | 苹果市值接近 3 万亿美元 | Apple Inc. |\n| 11/29/21 7:01 AM || MSFT | 微软推出新平台与亚马逊竞争\
  \ | Microsoft Corporation |\n\n## 半结构化数据\n\n半结构化数据在没有定义数据模型方面与非结构化数据具有共同属性。与以表格形式捕的结构化数据不同，半结构化格式的数据包含标记和标记（元数据），这些定义了数据存储的结构。元数据指定了存储中数据的特征、分组和层次。与非结构化数据相比，这些特性使得数据可以更有效地记录、分析和可视化。\n\
  \n半结构化数据包括 JavaScript 对象表示（JSON）、可扩展标记语言（XML）、可扩展业务报告语言（XBRL）和逗号分隔值（CSV）文件。它还包括使用某些互联网协议传输的数据，例如电子邮件、TCP/IP\
  \ 数据包和 HTML 文件。\n\n图 2.4A 和 2.4B 显示了半结构化数据的两个示例。图 2.4A 显示了 `XML` 格式的 Vanguard 债券基金注册记录。角括号内是标签，它们包含通常具有层次结构的元素，从\
  \ `<company>` 等根元素开始，到子元素如 `<reporting\\_file\\_number>`，以及投资公司名称等文本字段。\n\n\n\n\n\
  若干数据提供商（包括金融数据行业内的供应商）现在都提供了支持访问半结构化格式数据的客户端接口。例如，你可以使用该网站的应用程序接口（API）访问美国上市公司提交给美国证券交易委员会（SEC）电子数据收集、分析和检索系统（EDGAR）的所有文件。每个实体的所有公开文件都记录在一个\
  \ JSON 文件中，并可以使用分配给该实体或个人的中央索引键（CIK）进行提取。例如，苹果公司（Apple Inc.）的 CIK 为 `CIK0000320193`。\n\
  \n图 2.4A：半结构化数据：XML 格式的投资公司注册记录（SEC EDGAR）\n\n![image](img/Ch02_2.jpg)\n\n图 2.4B：半结构化数据：JSON\
  \ 格式的上市公司上市记录（SEC EDGAR）\n\n![image](img/Ch02_3.jpg)\n\n在 SAS 中处理半结构化数据非常简单，因为 SAS\
  \ 还可以将上述出的出的半结构化格式解析为 SAS 可读的格式，以便进行分析和可视化。图 2.4B 显示了存储在 JSON 格式中的数据。双引号内是定义字段名的对象，随后是该字段对应的值。\n\
  \n### 程序 2.1：读取 JSON 文件到 SAS 的 SAS 程序\n\n```sas\n/*Reading JSON File into SAS*/\n\
  filename compinfo \"%sysfunc(getoption(WORK))/company_tickers_exchange.json\";\n\
  filename myjmap \"%sysfunc(getoption(WORK))/myjmap.json\";\nproc http \nurl=\"https://github.com/finsasdata/Bookdata/raw/main/company_tickers_exchange.json\"\
  \n      out=compinfo\n      method =\"get\";\nrun;\nproc http \n   url=\"https://github.com/finsasdata/Bookdata/raw/main/myjmap.json\"\
  \n   out=  myjmap\n   method =\"get\";\nrun;\nlibname compinfo JSON map=\"%sysfunc(getoption(WORK))/myjmap.json\"\
  \ automap=reuse; \n/*Printing the first 5 observations*/\nproc print data=COMPINFO.DATA\
  \ (obs=5);\ntitle 'Stock Listings by Exchange';\nvar cik Ticker Name Exchange;\n\
  run;\ntitle;\n```\n\n程序 2.1 展示了如何将存储在网络位置的 JSON 文件读取到 SAS 中。`COMPANY_TICKERS_EXCHANGE.JSON`\
  \ 文件包含 `CIK`、`Ticker`、公司名称以及这些股票的主要交易所。`MYJMAP.JSON` 包含了 SAS 在读取 JSON 文件时用于理解其数据结构的\
  \ JSON 映射文件。在示例代码中，我们使用 `PROC HTTP` 从仓库中提取了这两个文件。`LIBNAME` 语句告知 SAS 数据格式，以及在读取公司数据时使用的\
  \ JSON 映射位置。\n\n这两个 JSON 文件存储在您计算机上 `WORK` 库的物理位置，如 `%sysfunc(getoption(WORK))`\
  \ 语句所示。然而，创建了一个具有 `LIBREF` 的新库 `COMPINFO`，它指向了 `COMPANY_TICKERS_EXCHANGE.JSON` 文件的物理位置。2\n\
  \n如果你希望保留该文件的本地副本以备后用，可以使用 SAS DATA 步或 `COPY` 语句将数据集复制到永久库中。我们使用 `PRINT` 打印了新创建的\
  \ SAS 数据集的前五个观测值。输出显示了 `CIK`、`TICKER`、公司名称以及该股票上市的交易所。\n\n输出 2.1：按交易所划分的股票\n\n|\
  \ ![image](img/Ch02_out_2-1.jpg) | \n\n### SAS 宏\n\n此时，实施一种更高效的方法来从书籍的数据仓库中提取后续示例中将用到的数据可能是一个好主意。SAS\
  \ 程序员使用宏语句来创建一组 SAS 代码，以便在将来需要时可以轻松重新调用以重复相同的任务（例如从书的数据仓库中提取数据）。\n\n要定义 SAS 宏，以\
  \ `%MACRO` 语句开始，随后跟着分配的宏名称以及宏参数和选项（如果需要）。宏参数是宏变量，用作在 SAS 宏内部执行的代码块的输入。然后包含需要执行的代码块。`%MEND`\
  \ 宏语句结束宏的定义。定义的 SAS 宏存储在 `WORK` 库的 SAS 目录中，并以会话编译宏的形式存在，使得它们仅在当前 SAS 会话期间可用。3 它们也可以使用\
  \ autocall 宏机制或存储编译宏设施存储在其他库中。\n\n程序 2.2 用于创建并提交 `DATAPULL` 宏，我们将根据需要从书籍的 GitHub\
  \ 仓库中提取数据文件。今后，将在需要从仓库提取数据的示例代码程序开头调用该宏。`FREF` 和 `PNAME` 是两个宏参数，分别引用我们将从 GitHub\
  \ 提取的文件的 SAS 文件引用和物理名称。\n\n#### 程序 2.2：从 GitHub 仓库提取数据的 SAS 宏\n\n```sas\n/*SAS Macro\
  \ to pull from GitHub Repository*/\n%macro datapull(fref,pname);\nfilename  &fref\
  \ \"%sysfunc(getoption(WORK))/&pname\";\nproc http\n   url=\"https://github.com/finsasdata/Bookdata/raw/main/&pname\"\
  \n   out=&fref\n   method =\"get\";\nrun;\n%mend datapull;\n\n%datapull('File Reference','Physical\
  \ Name');\n```\n\n根据需要使用宏语句 `%DATAPULL('File Reference', 'Physical Name')` 调用宏，并指定数据文件的文件引用和物理名称。\n\
  \n### 数据质量\n\n无论数据是内部生成的还是从数据供应商馈送的，所有组织的数据仓库都由人工生成的数据和机器（系统）生成或策定的数据组成。人工生成的数据是在业务过程中手动输入数据仓库的数据。例如，客户在银行填写信贷申请，或者人力资源分析师在薪资系统中输入新员工的姓名。机器生成的数据是在没有人工干预的情况下在数据仓库中自动创建的。数据是由数字系统执行其设计的业务流程时创建的。例如，账单系统在向收件人寄出账单之前会计算并记录每个客户的月费用。\n\
  \n数据科学家处理机器生成数据与人工生成数据的比例，取决于数据科学家所就业的金融服务环境。在投资管理环境中，数据科学家可能主要处理机器生成或策定的数据，如股市和经济数据。对于银行和信用合作社等储蓄机构，数据科学家可能处理两者的混合，具体取决于他们任职银行的业务部门。支持前台的人员可能主要处理人工生成的数据，而支持中后台的人员可能主要处理机器生成的数据。如果我们考虑数据科学家将处理数据的各种来源，值得探索一些可能影响项目进的常见数据质量问题。\n\
  \n#### 数据质量的维度\n\n通常，数据质量从准确性、一致性、完整性、及时性和有效性这几个维度来看待。\n\n*   **准确性（Accuracy）**是指数据代表所记录的现实事物或现象的程度。例如，客户走进银行并向其支票账户存入了一张\
  \ 1,000 美元的支票。仓库中记录的数据应准确地反映该客户同等金额的贷方分。\n*   **一致性（Consistency）**是指在一个数据仓库中使用的数据模型与另一个数据仓库中的数据对齐的程度。例如，客户\
  \ ID 字段在所有出现该字段表中应包含相同的值和格式。\n\n\n\n\n\n- `完整性`（Completeness）是指数据集中与记录的现实世界实体或现象相关的所有字段，都填充了所需的数据值的程度。例如，销售表至少应包含所售商品、商品价格、商品数量，并且最好还包含销售日期和时间。\n\
  - `及时性`（Timeliness）是指实际现实事件发生的时间与其相关数据记录的时间之间的滞后程度。\n- `有效性`（Validity）是指数据值在多大程度上符合字段或计算的指定值。例如，在年龄字段中出现的负值可能是错误的条目。\n\
  \n在上述列出的五个维度中，金融数据科学家面临的主要问题是跨数据源的数据一致性、数据完整性，以及在某种程度上的数据有效性。\n\n## 数据一致性 (Data\
  \ Consistency)\n\n金融数据科学家在对数据进行可视化和分析之前，通常需要合并来自多个源的原始数据。大多数金融和经济数据都是时间序列格式；因此，其数值记录的频率将影响此类类型数据合并的难易程度。事实是，金融市场数据的记录频率通常高于经济数据和公司发布的公开公告（频率不兼容）。公司的公开公告在频率和时间上也有不相同。某些公开公告如\
  \ `10-Q` 是季度提交的，有些是年度的（如 `10-K`），有些是随机的（如 `8-K`）。此外，上市公司之间的财年以及报告期也存在显著差异。\n\n在表\
  \ 2.3 中，我们尝试将标普 500 指数的每日股票市场数据与周初请业金人数、抵押贷款申请、每月房屋销量、失业率和 CPI，最后是季度 GDP 数据进行合并。如表所示，在对数据集进行进一步分析之前，首先需要解决频率不兼容的问题。\n\
