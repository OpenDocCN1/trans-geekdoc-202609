  \n在 GBM（几何布朗运动过程中，漂移率函数 $\\mu(S,t)$ 被规定为资产价格 $S$ 的函数：$\\mu(S,t) = \\mu^S$，以及方差率\
  \ $\\sigma²(S,t)$，其形式为：$\\sigma²(S,t) = \\sigma²S²$。\n\n上述设定意味着漂移和方差率都是时间不变的，但取决于价格的大小。该过程的离散版本规定为：\n\
  \n$$\\frac{\\Delta S_{t}}{S_{t}} = \\mu\\Delta t + \\sigma\\sqrt{\\Delta t}, \\\
  quad (4.13)$$\n\n$$\\frac{\\Delta S_{t}}{S_{t}} = \\frac{S_{t} - S_{t}}{S_{t}} \\\
  quad (4.14)$$\n\n公式 (4.13) 和 (4.14) 是著名的持有期收益率公式的规定。实际上，公式 (4.12) 到 (4.14) 在金融领域广泛用于资产定价和投资组合管理。这包括股票和股票组合（如指数投资组合）、期权、期货、远期合约和掉期交易的定价。在本章中，我们将探索其在资产定价以及研究金融资产随时间变化的行为方面的应用。\n\
  \n## 股票价格与几何布朗运动\n\n在上一章中，我们引入了股票价格对数收益率的概念。使用股票价格对数收益率基于股票价格呈对数正态分布的假设。因此，如果在公式\
  \ (4.12) 中将 $S$ 替换为 $log(S[t])$ 并应用伊藤引理（Itô’s lemma），股票价格对数的 GBM 过程可以写为：\n\n$$d\\\
  log(S_{t}) = \\left( {\\mu - \\frac{\\sigma^{2}}{2}} \\right)dt + \\sigma dW_{t}\
  \ \\quad (4.15)$$\n\n$log(S[t])$ 的 GBM 过程遵循广布朗运动过程，漂移率为 $\\mu - \\frac{\\sigma^{2}}{2}$，方差率为\
  \ $\\sigma²$。该过程的离散版本为：\n\n$$\\Delta\\log(S_{t}) = \\left( {\\mu - \\frac{\\sigma^{2}}{2}}\
  \ \\right)\\Delta t + \\sigma\\sqrt{\\Delta t} \\quad (4.16)$$\n\n对于 $\\Delta t\
  \ = T$，$\\Delta log(S[t]) = log(S[T]) - log(S[0])$ 服从正态分布，并定义为：\n\n$$\\left. \\\
  log(S_{T}) - \\log(S_{0}) \\right.\\sim N\\left( {\\left( {\\mu - \\frac{\\sigma^{2}}{2}}\
  \ \\right)T,\\sigma\\sqrt{T}} \\right) \\quad (4.17)$$\n\n同样可以得出：\n\n$$\\left. \\\
  log(S_{T}) \\right.\\sim N\\left( {\\log(S_{0}) + \\left( {\\mu - \\frac{\\sigma^{2}}{2}}\
  \ \\right)T,\\sigma\\sqrt{T}} \\right) \\quad (4.18)$$\n\n根据以上所有内容，我们可以计算任意时刻 $S[T]$\
  \ 的期望值和方差如下：\n\n$$E(S_{T}) = S_{0}\\exp\\left( {\\mu - \\frac{\\sigma^{2}}{2}} \\\
  right)T \\quad (19)$$\n\n$$Var(S[T]) = S[0]²(\\exp(\\sigma²T)-1) \\quad (20)$$\n\
  \n## 使用几何布朗运动模拟股票价格\n\n在第一章中，我们展示了标普 500 指数月度收益率的模拟，其假设是该指数遵循高斯随机游走。在本章中，我们将扩展程序\
  \ 1.10 的范围，允许收益率存在漂移，并从收益率序列模拟价格。我们将依靠公式 (4.16)来构建指数价格。如果我们假设 $\\Delta t=1$，则可以将公式\
  \ (4.16) 写如下：\n\n$$S_{t} = S_{t - 1}\\exp\\left( {\\mu - \\frac{\\sigma^{2}}{2}}\
  \ \\right)\\Delta t + \\sigma\\sqrt{\\Delta t} \\quad (21)$$\n\n其中 $(\\mu - \\frac{\\\
  sigma^{2}}{2})\\Delta t$ 和 $\\sigma\\sqrt{\\Delta t}$ 分别是收益率的确定性部分和随机部分。\n\n根据第一章，我们知道标普\
  \ 500 指数在约 157 个月内的平均收益率 $\\mu$ 和标准差 $\\sigma$ 分别为 $0.67\\%$ 和 $4.46\\%$。为了模拟指数的未来价格，我们还需要一个指数参考价格作为初始价格\
  \ $S[0]$。让我们使用指数价格 $3756$ 作为参考。\n\n\n\n\n\n| ![image](img/Ch04_out_4-8.jpg)\n\n\
  ### 均值回归（Ornstein-Uhlenbeck）过程\n\nOrnstein-Uhlenbeck (OU) 随机过程与布朗运动具有相似的性质，例如平性、马尔可夫性和连续概率。它们与布朗运动的区别在于，当它们的观测值低于均值时，倾向于上升；当高于均值时，倾向于下降。OU\
  \ 过程也可以被视为随机游走模型的连续时间等效模型，在该模型中，随着越来越多的观测值远离中心，样本路径可能会回到中心。观测值距离中心越远，将未来观测值推回中心的拉力越强。OU\
  \ 过程的数学推广表示为：\n\n```\ndX[t] = θ(μ(X[t]) - X[t])dt + σ(X[t])dW[t] (4.22)\n```\n\n\
  其中 `θ`、`μ(X[t])` 和 `σ(X[t])` 是已知常数。`θ` 是回归速度，`μ(X[t])` 和 `σ(X[t])` 分别是漂移率和方差率。从常数中移除\
  \ `(X[t])` 并应用 Itô 引理求解 `X[t]` 的随机微分方程，得：\n\n```\nX[t] = X[0]exp(-θt) + μ(1-exp(-θt))\
  \ + σ∫[0]^texp(-θ(t−s))dW[s] (4.23)\n```\n\n该过程的均值为：\n\n```\nE[X[t]] = X[0]exp(-θt)\
  \ + μ(1-exp(-θt)) (4.24)\n```\n\n该过程的方差为：\n\n```\nVar(X\\_{t}) = E\\\\leftlbrack\
  \ \\left( {\\\\exp\\left( {- \\theta t} \\right){\\int\\_{0}^{t}{\\sigma\\\\exp\\\
  left( {- \\theta s} \\right)dW\\_{s}}}} \\right)^{2} \\rightrbrack = \\frac{\\sigma^{2}}{2\\\
  \\theta}\\\\left( {1 - \\exp\\left( {- 2\\\\theta t} \\right)} \\right) (4.25)\n\
  ```\n\n因此 $\\left. \\left( X\\_{t} \\middle| X\\_{0} \\right) \\right.\\sim N\\\
  left( {\\\\mu + \\left( {X\\_{0} - \\\\mu} \\right)\\\\exp\\left( {- \\theta t}\
  \ \\right),\\\\frac{\\sigma^{2}}{2\\\\theta}\\\\left( {1 - \\exp\\left( {- 2\\\\\
  theta t} \\right)} \\right)} \\right)$。使用 Euler-Maruyama 方法的离散过程也可以写为：\n\n```\n\
  X\\_{t + 1} = X\\_{t} + \\theta\\left( {\\\\mu - X\\_{t}} \\right)\\Delta t + \\\
  sigma\\left( X\\_{t} \\right)\\sqrt{\\Delta t} (4.26)\n```\n\n尽管有上述数学上的严格构造，但当 `Δt\
  \ = 1` 时，OU 过程可以被视为 `X[t + 1]` 的 AR(1) 过程的连续时间极限，其形式为：\n\n```\nX[t + 1] = α + βX[t]\
  \ + σε[t] (4.27)\n```\n\n其中 `α = θμ`，`β = (1−θ)` 且 `ε[t] ~ N(0, 1)`。因此，OU 过程既可以通过方程\
  \ (4.27) 作为 AR(1) 过程的特例，也可以作为方程 (4.23) 的数值解。\n\nOU 过程在金融领域有多种应用。这些包括利率和汇率建模、债券定价、波动率建模以及利率权权定价。\n\
  \n# 模拟 Ornstein-Uhlenbeck 过程\n\n让我们使用 OU 过程模拟芝加哥期交易所波动率指数（VIX）一年的每日值。VIX 指数衡量了标普\
  \ 500 指数未来 30 天的预期波动率。VIX 有时被称为“恐惧指数”，根据标普 500 指数期权价格隐含的短期波动率计算得出。尽管 VIX 指数的平均水平为\
  \ 17.00%，标准差为 7.12%，但由于我们模拟的是 AR(1) 过程，我们需要从实际序列的 AR(1) 模型中推导出仿真参数。名为 `VIX` 的 SAS\
  \ 数据集包含了各种资产类别和股票指数 VIX 的十年每日数据。首先，我们将使用这些数据估计标普 500 指数每日 VIX 的 ARIMA(0,1,0) 模型，以推导出仿真的参数。ARIMA\
  \ 估计结果所示表 4.7。\n\n| 表 4.7：使用 PROC ARIMA 对 VIX 进行 AR(1) 估计的结果 |\n| --- |\n| 参数 |\
  \ 估计值 | 标准误差 | Pr >t |\n| 最小二乘法 | | | |\n| α | 13.8262 | 0.0414 | <0001 |\n| AR1\
  \ (β) | 0.97559 | 0.00742 | <0001 |\n| 常数 | | | |\n| 方差 | 5.82109 | | |\n| 标准误差\
  \ (σ) | 2.41281 | | |\n| AIC | 4638.27 | | |\n| 残差数量 | 4648.07 | | |\n\nVIX 指数的无条件均值为\
  \ 17.00%，标准差为 7.12%，由于我们正在模拟的是 AR(1) 过程，我们需要从实际序列的 AR(1) 模型中推导出仿真的参数。\n\n```sas\n\
  /* 模拟 Ornstein-Uhlenbeck 过程 \n数值方法 */\nlet alpha=13.8262\nlet beta=0.97559\nlet\
  \ sigma=2.41281\nlet theta=1-beta\nlet mu=alpha/theta\nlet n=364\nlet InitDate='1jan21'd;\n\
  callseed(4321);\n\nproc iml;\nX0=0;\ncall randgen(\"Normal\");\nVol=j(n,1);\ndo\
  \ i = 1 to n;\ndt=dt+1;\nVol[i,1]=intnx('day',InitDate,dt);\nVol[i,2]=X0*exp(-theta*dt)+mu*(1-exp(-theta*dt))+sigma*integral[0]^t\
  \ exp(-theta*(t-s))dW[s];\n/* 注意：文中上述公式是简化的表示； \n   下方的实现遵循所提供的逻辑。 */\nend;\n```\n\
  \n\n\n\n```\n/*Simulating Daily CBOE Volatility (VIX) Index Using AR(1) Model*/\n\
  %let N=364;\n%let sigma=2.412801;\n%let mu=13.8262;\n%let beta=0.97559;\n\nproc\
  \ iml;\n      xj= j(&n,1,.); /*vector random variables*/\n      Volt=j(&n,1,0);\
  \ /*Interest rate vector*/\n      Vol=j(&n,2,&mu); /*Vector to merge simulate rates\
  \ and date*/\n      InitDate = '1jan2021'd; /*Initial Date*/\n      call randseed(4321);\n\
  \      call randgen(xj,\"Normal\");\n      Volt=&mu+&beta*lag(Volt)+&sigma*xj;\n\
  \      Vol[,2]=Volt;\n      dt=0;\n\n      do i = 1 to &n;\n              dt=dt+1;\n\
  \              Vol[i,1]=intnx('day',InitDate,dt);/*Simulating Date variable*/\n\
  \      end;\n\n      vname ={\"Date\" \"VIX\"}; /*specify column and row label*/\n\
  \      create simul9B from Vol[colname=vname];\n      append from Vol;\n      close\
  \ simul9B;\nquit;\n\nproc sgplot data=simul9B;\n      inset \"Discretized OU Process\
  \ - AR(1)\"/title=\"Simulating CBOE Volatility (VIX)\n      Index\" position=top\
  \ \n      textattrs=(family=\"Times New Roman\" color=darkblue size=12 ) valuealign=center\
  \ \n      titleattrs=(family=\"Times New Roman\" color=darkblue size=12 weight=bold)\n\
  \      labelalign=center;\n      series x=date y=VIX;\n      xaxis label= \"Date\"\
  \ valuesformat=mmddyy10. values=('2jan21'd to '31dec21'd by \n      month) interval=day;\n\
  \      yaxis label= \"Volatility\" valuesformat= best8.2 values=(0 to 30 by 5);\n\
  run;\n```\n\n请注意，在程序 4.9A 和 4.9B 中所示的模拟代码之间的主要区别在于计算 VIX 指数每日数值的公式。在程序 4.9A 中，波动率变量\
  \ `VOLT` 是根据公式 (4.24)所示的规格计算的，而在程序 4.9B 中，相同变量使用的是公式 (4.27)所示的更简单的 AR(1)表达式计算的。尽管如此，输出\
  \ 4.9 中显示的两个系列图表显示，两种方法得到的变量值之间存在显著的一等性。你还可以在两个图中的模拟 VIX 指数序列中观察到均值回归模式。高于正常的波动率时期（在序列中更为常见）之后会紧随向均值的下降趋势，而低于正常的波动率时期之后会紧随向均值的上升趋势。\n\
  \n输出 4.9：比较 CBOE VIX 指数的模拟 Ornstein-Uhlenbeck 过程（数值与离散方法）\n\n| ![image](img/Ch04_out_4-9.jpg)\
  \ |\n\n### 蒙特卡洛模拟\n\n“蒙特卡洛模拟”一词适用于一类使用数值近似求解概率问题的通用计算方法。该方法的核心思想是使用总体的重复样本来近似总体的某些分布特性。\n\
  \n仅通过单条路径的模拟对标普 500 指数的未来样本路径进行推断可能不是一个明智的主意。更好的方法是依赖于大数定律 (`LLN`)的应用，该定律指出，独立同分布的大样本分布倾向于收敛于底层总体的分布。因此，从随机变量的大样本集中得出的平均结果应该与底层分布的结果相似。在程序\
  \ 4.1 和 4.2 中，我们展示了用于模拟来自伯努利分布和二项分布（单次试验，类比硬币抛掷）数值的 SAS 代码。请注意，在两次模拟中，我们都没有在 100\
  \ 次试验中获得`1`和`0`各占 50%的结果，尽管模拟结果是从 50%对 50%的理论概率分布中抽取的。如果我们通过将试验次数增加到 1,000 次来对两次模拟应用`LLN`，我们将得到`1`和`0`分别为\
  \ 49.1%-50.9%的结果。如果我们继续增加试验次数直到 500 万次，我们最终将获得`1`和`0`各 50%-50%的结果，这与结果的理论概率相同。\n\
  \n蒙特卡洛模拟依靠`LLN`的这一卓越特性，通过模拟现象的多个样本并分析其概率分布，来对现实世界事件的行为进行推断。思考蒙特卡洛模拟方法的另一种方式是，它使用从底层现实现象相同概率分布中独立抽取的大量随机变量，来估计现实现象的最可能值。金融领域的此类现象包括股价、投资组合结果、资本项目结果和风险结果。\n\
  \n### 股票价格的蒙特卡洛模拟\n\n既然我们已经知道了蒙特卡洛模拟的益处，让我们重新审视对标普 500 指数样本路径的模拟。在之前的程序中，我们模拟了单条样本路径。我们在\
  \ SAS 代码中的蒙特卡洛扩展创建了一个外部循环，允许我们将样本路径复制 *n* 次。模拟样本路径的最佳数量由中心极限定理决定，该定理指出随着样本量的增大，样本均值的分布将近似于正态分布\
  \ $\\left. \\overline{X} \\right.\\sim N\\left( {\\mu,\\frac{\\sigma^{2}}{n}} \\\
  right)$。\n\n程序 4.10 展示了实现标普 500 指数样本路径蒙特卡洛模拟的 SAS 代码。为了创建 1000 条样本路径，我们在单路径模拟代码外创建了一个外部`DO`循环。每条路径都由`SAMPLEID`变量区分，该变量存储外部循环每次迭代的索引。本质上，我们正在模拟标普\
  \ 500 指数每个月的 1,000 个值。我们还包含了用于绘制 1,000 条模拟样本路径的`SGPLOT`过程代码。请注意在`SERIES`语句中，`SAMPLEID`被指定为`GROUP`变量，用于调用每个序列的图。\n\
  \n\n\n\n\n```sas\n%let /*S&P 500 指数水平蒙特卡洛模拟*/\n%let smean=0.0067658;\n%let ssd =\
  \ 0.04465726;\n%let inprice=3756.07;\n%let nreps=1000;/*重复次数*/\n\ndata simul10;\n\
  \      format Date monyy.;\n      keep Date sampleID Fmret Sumret Price;\n     \
  \ InitDate = '2Jan2021'd;\n      Sumret=&smean-&ssd *0.5;\n\n      do sampleID=1\
  \ to &nreps;\n            do iter=1 to 24; /* 复制次数*/\n                         \
  \   Date=intnx('month',InitDate,dt,'end');/*模拟日期*/\n                           \
  \ Fmret =rand(\"normal\",&smean,&ssd);/*模拟月度收益率*/\n                            Sumret\
  \ =sumret+fmret; /*累计收益率*/\n                            Price =$inprice*exp(sumret);/*连续复利价格*/\n\
  \                            dt+1;\n                            output;\n      \
  \      end;\n\n            dt=0;\n            sumret=0;\n      end;\n\n      label\n\
  \            Fmret='模拟月度收益率'\n            Price = '模拟月指数水平'\n            Sumret\
  \ = '累计月度收益率'\n            sampleID = '样本 ID';\nrun;\n\n/*绘制模拟的标普 500 水平*/\nproc\
  \ sgplot data=simul10;\n      inset \"2021 年 1 月至 2022 年 12 月\" \n      /title=\"\
  标普 500 指数水平蒙特卡洛模拟\" position=top \n      textattrs=(family=\"Times New Roman\" color=darkblue\
  \ size=12 ) valuealign=center;\n      series x=Date y=Price / group=SampleID;\n\
  \      xaxis grid;\n      yaxis grid values=(2000 to 9000 by 1000);\n      ;\nrun;\n\
  ```\n\n| |\n| --- |\n| **输出 4.10：使用蒙特卡洛方法模拟标普 500 指数的样本路径** |\n| ![image](img/Ch04_out_4-10.jpg)\
  \ |\n| --- |\n\n输出 4.10 显示了模拟的 1,000 条指数样本路径图表。对绘制的样本路径进行快速扫描表明，该指数在 2022 年 12 月\
  \ 31 日的数值高于 6,000 或低于 3,000 的可能性较低。大部分路径似乎聚集在 4,000 左右。从投资决策的角度来看，我们可以看到，在两年的预测期内，通过指数多头头获得投资组合表现高于\
  \ 60%（6,000 以上）或低于-20%（3,000 以下）的可能性非常低。\n\n通过实施程序 4.11 所示的 SAS 代码，我们可以获得指数在 24\
  \ 个月内的平均路径以及 2022 年 12 月 31 日指数最终值的分布统计数据。在 SAS 代码中，我们首先使用`SORT`过程按`date`变量对数据进行排序。然后，我们计算每个月的平均价格。接着，使用`SGPLOT`过程绘制平均价格值。通过在`PROC\
  \ MEANS`语句中包含`WHERE=(31DEC22'D)`选项，我们计算了最后一个月份指数模拟值的统计数据。\n\n### 程序 4.11：计算标普 500\
  \ 指数的平均路径\n\n```sas\n/*计算标普 500 指数的平均路径*/\nproc sort data=simul10 out=ssimul10;\n\
  \  by Date;\nrun;\n\nproc means data=ssimul10 noprint;\n  by date;\n  var price;\n\
  \  output out=out_simul10 mean=Price;\nrun;\n\nproc sgplot data=out_simul10;\n \
  \     inset \"2021 年 1 月至 2022 年 12 月的平均路径\" \n      /title=\"标普 500 指数水平蒙特卡洛模拟\"\
  \ position=top \n      textattrs=(family=\"Times New Roman\" color=darkblue size=12\
  \ ) valuealign=center;\n      series x=Date y=Price;\n      xaxis grid format=monyy.\
  \ values=('31Jan21'D to '31Dec22'D by month);\n      yaxis grid values=(2000 to\
  \ 6000);\nrun;\n\nproc means data=simul10(where=(Date='31Dec22'D)) mean min max\
  \ median p5 p10 q1 q3 p95 p99 method=os;\n  var Price;\nrun;\n```\n\n| |\n| ---\
  \ |\n| **输出 4.11：蒙特卡洛模拟的标普 500 指数平均路径** |\n| ![image](img/Ch04_out_4-11.jpg) |\n\
  | --- |\n\n我们从模拟中获得的平均预测表明，该指数在 2022 年 12 月 31 日的价值将在 4,500.52 左右。然而，2022 年 12 月\
  \ 31 日的指数实际值为 3,839.50。这种差异说明了模拟的局限性。通常情况下，模拟适用于正常市场状况。在 2022 年，美国股市经历了持续的负收益，导致年收益为-19.6%。这正是模拟在异常市场状况（如熊市、衰退和金融危机）下表现不佳的原因。某些特殊的模拟依赖于极值理论和\
  \ Copula，我们将在第五章中讨论这些方法。\n\n### 表 4.8：标普 500 指数蒙特卡洛模拟描述性统计\n\n| 分析变量：价格模拟月度指数水平\
  \ |\n| --- |\n| 均值 | 标准差 | 最小值 | 最大值 | 中位数 | 第 5 百分位数 | 第 10 百分位数 | 下四位数 | 上四位数\
  \ | 第 95 百分位数 | 第 99 百分位数 |\n| 4500.52 | 977.74 | 2269.18 | 7627.03 | 4422.75 |\
  \ 3029.11 | 3285.32 | 3797.4 | 5072.19 | 6281.63 | 7151.9 |\n\n## 预算的蒙特卡洛模拟\n\n\
  蒙特卡洛模拟的另一个常见应用是资本预算分析。资本投资是企业对长期资产的资金支出。这些资产是产生价值现金流的主要来源。事实上，企业进行的每个资本项目的价值理论上是其未来现金流的现值。\n\
  \n并非所有项目都能产生价值，因此经理在评估要进行的项目时必须非常审慎。大多数经理根据以下标准选择资本项目：净现值（`NPV`）、内部收益率（`IRR`）、回收期和折现回收期（`PP`）以及盈利指数（`PI`），仅列举如下。\n\
  \n\n\n\n\n其中 `C[0]` 是项目的收购成本，`CF[t]` 是项目产生的未来现金流，`r` 是用于资助该项目的资本资金成本。\n\n# SAS 中的资本预算分析\n\
  \n在实施用于资本预算的蒙特卡洛模拟之前，让我们先探索一下如何使用 SAS 进行资本预算分析。事实证明，SAS 拥有大量的内置财务函数。10 我们可以使用这些函数、`DATA`\
  \ 步以及 SAS 过程（如 `COMPUTAB`）来构建简单复杂的财务工作表。\n\n| 表格 4.9：NPV 分析的项目信息 |\n| --- |\n| 年份\
  \ || 现金流 |\n| 0 || \\-$53,000 |\n| 1 || 15,800 |\n| 2 || 13,100 |\n| 3 || 16,700\
  \ |\n| 4 || 19,700 |\n| 5 || 14,300 |\n| 必要收益率 || 13% |\n\n让我们从 SAS 中资本预算函数的实际应用开始。假设我们有一个期五年的项目，现金流如表\
  \ 4.9 所示。让我们通过计算项目的 `NPV` 和 `IRR` 来评估该项目投资的适用性。\n\n程序 4.12 使用 `DATA` 步和内置的 `NPV`\
  \ 及 `IRR` 财务函数在 SAS 中实现了一个简单的资本预算分析。项目现金流存储在 `CAPBUD1` 数据集中。`NPV` 和 `IRR` 的计算也是在\
  \ `DATA` 步中完成的并存储在同一个 `CAPBUD1` 数据集中。通过自定义我们的 `PROC PRINT` 语句，我们将计算出的值与输入值分开显示。\n\
  \n## 程序 4.12：使用 SAS 进行基础资本预算计算\n\n```sas\n/*使用 SAS 计算 NPV 和 IRR*/\ndata capbud1;\n\
  \    format CF0 nlmny12.2  CF1 nlmny12.2 CF2 nlmny12.2 \n               CF3 nlmny12.2\
  \ CF4 nlmny12.2 CF5 nlmny12.2 Rate percent8.2;\n    Rate=0.13;\n    CF0=-53000;\n\
  \    CF1=15800;\n    CF2=13100;\n    CF3=16700;\n    CF4=19700;\n    CF5=14300;\n\
  \    NPV=finance('npv',rate,cf1,cf2,cf3,cf4,cf5)+cf0;\n    IRR=finance('irr',cf0,cf1,cf2,cf3,cf4,cf5);\n\
  \    format NPV nlmny12.2 IRR percent8.2;\nrun;\n\ntitle '资本支出工作表';\n\nproc print\
  \ data=capbud1 noobs;\n    var CF0 CF1 CF2 CF3 CF4 CF5 Rate;\n    var NPV IRR/style(data)={just=l\
  \ fontweight=bold };\nrun;\n\ntitle;\n```\n\nSAS 代码的输出如输出 4.12 所示，表明我们的示例项目将产生价值，因为其正的\
  \ `NPV` ($2,659.31) 且 `IRR` (15.0%) 大于其资本成本（`Rate`）。\n\n### 输出 4.12：资本支出工作表\n\n\
