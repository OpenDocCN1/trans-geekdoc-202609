- "# SAS 金融数据科学\n\n\n\n\n本手册的正确参考文献引用格式如下：Odusami, Babatunde O. 2024. Financial Data\
  \ Science with SAS®. Cary, NC: SAS Institute Inc.\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 关于本书\n\n### 本书涵盖哪些内容？\n\n机器学习、数据可视化和优化等数据科学技术在金融服务行业中应用广泛。然而，很难找到既能解释这些技术背后的理论，又能说明如何通过真实案例来实现它们的书籍和参考资料。对于那些兴趣使用\
  \ SAS 进行金融数据科学的人来说，教学和参考材料也不算多，尽管正如你很快会在书中看到的，SAS 可疑是处理金融领域可能遇到的几乎任何类型分析问题的最佳应用之一。\n\
  \n本书将为读者提供全面涵盖，介绍以 SAS 为主要分析平台在金融服务行业中使用的各种分析技术和定量工具的理论及其实际实现。它将向你展示如何在 SAS 分析环境中，利用真实案例来实现数据可视化、模拟、统计预测模型、机器学习模型以及金融优化。\n\
  \n你将学习如何使用可视化技术来衡量财务绩效，并检查金融和经济数据的显著特征。你还将学习如何实现各种类型的模拟，以及如何使用模拟构建金融数据模型（如股票价格和资本项目结果）。你将接触到模拟的高级应用，例如用于风险管理和衍生合约定价的模拟。\n\
  \n在随后的章节中，你将接触各种统计和机器学习模型，以及它们如何在金融服务行业中使用。这些包括信用风险模型、算法交易模型、经济分析模型和战略投资组合管理模型。你还将通过将这些模型应用于真实数据的练习题，来提升你的分析技能。\n\
  \n在书的最后一部分，你将学习各种优化技术以及如何使用它们解决金融决策问题。你将回顾并练习使用优化进行资本预算、利润最大化、风险管理、绩效归因、投资组合构建和投资组合优化。\n\
  \n对于任何想要进一步了解数据科学如何在金融服务行业中使用以及如何使用 SAS Analytics 套件开发金融数据科学能力的人来说，本书是一份参考资料。\n\n\
  ### 这本书适合你吗？\n\n如果你感兴趣建立能够为投资分析师、量化分析师或金融数据科学家等职业角色做准备，或者只是想学习更多如何使用数据科学方法来提高你的金融技能，那么这本书就适合你。本书旨在让每一个人（无论是资深还是有抱负的数据科学家）的金融数据科学之旅变得更加轻松。对于希望转型到金融数据科学的数据科学通型人才来说，它也是一本极好的手册。本书可以用于金融、数学、商业分析和计算机科学专业研究生或高级本科生的学期制金融数据科学课程。\n\
  \n### SAS 编程经验\n\n只需要少量的 SAS 经验。在深入探讨某些高级主题之前，我们将在前面的章节介绍 SAS 编程的基础知识和 SAS 窗口环境。对编程逻辑以及通用金融和经济概念（如股票、债券、股票指数、收益、风险、投资组合、收入、资本项目、GDP\
  \ 和失业率）有一定的熟悉将会有帮助。大多数高级概念也用通俗易懂的语言进行了总结，因此你可以将注意力集中在所讨论技术的实际应用上。本书还将指引你如何从庞大的 SAS\
  \ 支持文档库和互联网上找到额外的资源。\n\n### 你应该了解示例的什么？\n\n本书包含了许多供你遵循的教程，以便你获得使用 SAS 解决你在金融服务行业中可能遇到的各种分析问题的实操经验。在许多情况下，书中统计和经济理论与\
  \ SAS 代码之间的联系被突出显示，以便你可以看到它们之间的联系。你将学习代码，但更重要的是从理论角度来看为什么特定的代码或方法是相关的。\n\n### 用于开发本书内容的软件\n\
  \n为了获得教程的完整体验并完成练习题，你需要访问 SAS 9.4 环境。你可以使用 SAS Studio、Enterprise Guide 和 Enterprise\
  \ Miner 等客户端应用程序访问 SAS 9.4 环境。SAS 9.4 环境包含了 Base SAS 软件。你还需要 SAS Analytics 15.3\
  \ 的许可，其中包括：\n\n- `SAS/ETS`\n- `SAS/STAT`\n- `SAS/IML`\n- `SAS/OR`\n- `SAS Enterprise\
  \ Miner`\n\n如果你是学术机构的学生或员工，可以在 `https://welcome.oda.sas.com` 注册 SAS OnDemand for\
  \ Academics，这将使你能够在云端支持的环境中访问上述所有功能。独立学习者也可以注册 SAS OnDemand for Academics 以访问 SAS\
  \ Studio。\n\n### 示例代码和数据\n\n你可以通过访问本书的 GitHub 页面 `https://github.com/finsasdata/bookdata`\
  \ 获取本书的所有 SAS 代码和数据。\n\n在 GitHub 仓库中，你将找到两个 SAS 程序，它们使你能够轻松下载教程和练习题所需的数据。第一个程序 `GitDownload.sas`\
  \ 将整个仓库下载到 SAS 库 `FINDATA`。第二个程序 `Datapull.sas` 是一个 SAS 宏，你可以调用它在需要时下载数据文件。你应该注意，这两个程序只在\
  \ SAS 环境中运行。你将在本书的前两个章节中学习更多这两个程序的代码。\n\n### SAS OnDemand for Academics\n\n本书兼容\
  \ SAS OnDemand for Academics。如果你在使用 SAS OnDemand for Academics，请从这里开始：`https://www.sas.com/en_us/software/on-demand-for-academics.html`。\n\
  \n### 练习题在哪里？\n\n本书的一大特点是每章末尾的练习题。这些练习使你能够锻炼书中遇到的某些技能。你可以通过本书的 GitHub 仓库请求练习题的答案。\n\
  \n### 关于作者\n\n\n\n\n\nBabatunde Odusami 博士、CFA 是宾夕法尼亚州切斯特市威德纳大学（Widener University）的金融学教授。除了学术角色外，他还从事投资管理与治理、公司治理以及咨询工作。他从新奥尔良大学获得了管理信息系统方向的\
  \ MBA 学位，以及金融经济学的硕士和博士学位。他还是 CFA 特许证书持有者。他的研究方向是统计和机器学习模型，这些模型可以解释金融资产和投资组合价值价值与风险演变。他对金融主题的评论定期出现在印刷媒体和电视媒体上。\n\
  \n您可以通过访问他的作者页面 [`support.sas.com/en/books/authors/tunde-odusami.html`](https://support.sas.com/en/books/authors/tunde-odusami.html)了解更多关于这位作者的信息。在那里，您可以下载免费书籍章节、阅读最新评论、获取更新等。\n\
