  \ 1:00 || 38467.78 ||  || 88.030 || 1.127 || 4498.750 |\n\n## 处理数据结构不兼容\n\n管理频率和时间戳不兼容的三种方法包括：\n\
  \n- `数据聚合`(Data aggregation）：第一方法如程序 2.3A 所示，在低频率数据的两次连续观测之间，对高频率数据进行聚合（求和或平均）。你应该注意，SAS\
  \ 还支持其他类型的聚合，包括总计、最小、最大、第一个、最后一个和标准差。\n- `期末/时间戳匹配`(End of period/time-stamp matching)：第二方法如程序\
  \ 2.3B 所示，以与低频率数据相同的频率记录高频率数据的观测值。\n\n前两种方法会导致高频率数据粒度的损失。然而，在权衡之后，能够从低高频率变量之间的关系中得出洞察，可能比任何数据粒度的损失更有价值。正如你在随后的段落中所看到的，在某些情况下，粒度的损失可能会带来更好的项目结果。\n\
  \n\n\n\n\n在程序 2.3A 中，我们使用了 `TIMEDATA` 过程，通过均值聚合将在不同时间间隔收集的所有财务和经济数据聚合为季度数据。在程序 2.3B\
  \ 中，我们使用了相同的 `TIMEDATA` 过程，以相同的频率为数据集中的每个变量记录一次观测值，在本例中，该频率为季度间隔。对于这两个程序，`PROC TIMEDATA`语句中的\
  \ `OUT` 选项指定了输出数据集的名称。`ID` 语句将日期变量指定为 `ID` 变量，`INTERVAL` 语句指定季度为请求的间隔，`ACCUMULATE`\
  \ 语句指定了累积方法，在程序 2.3A 中为 `mean`，在程序 2.3B 中为每个季度的 `last` 观测值。`VAR` 语句指定了要转换的变量。\n\n\
  ### 程序 2.3A: 使用 `PROC TIMEDATA` 累积高频观测值\n\n```sas\n%datapull(ecod,ecodata.sas7bdat);\n\
  /*将数据聚合为季度频率*/\nproc timedata data=ecodata out=necodata;\n id date interval=qtr\n\
  \            accumulate=mean;\n var SPX INJCJC MBAVCHNG ETSLTOTL USURTOT GDP CPI;\n\
  run;\nproc print data=necodata;\nrun;\n```\n\n#### 输出 2.3A: 累积的高频观测值\n\n![image](img/Ch02_out_2-3a.jpg)\n\
  \n输出 2.3A 和 2.3B 显示了在财务和经济序列上实施 `TIMEDATA` 过程的结果。打印输出显示，所有序列现在已聚合为季度频率，这是表 2.3 所示所有变量中观察到的最低频率。注意从两种聚合方法得到的变量值之间的差异。使用\
  \ `mean` 聚合产生的输出变量比基于每个季度 `last` 观测值的聚合波动性更小。在两种情况下，由于聚合了高频率变量（如标普 500 指数的每日值、每周初请失业金人数和住房抵押申请量），都会在粒度上出现某种损失。然而，通过将这些变量与\
  \ `CPI` 和 `GDP` 等低频率变量联合建模，从中提取有意义的洞察的能力可能超过粒度损失带来的影响。\n\n### 程序 2.3B: 用于时间戳匹配观测值的\
  \ SAS 程序\n\n```sas\n%datapull(ecod,ecodata.sas7bdat);\n/*将数据时间戳标记为季度频率*/\nproc timedata\
  \ data=ecodata out=necodata;\n  id date interval=qtr\n        accumulate=last;\n\
  \ var SPX INJCJC MBAVCHNG ETSLTOTL USURTOT GDP CPI;\nrun;\nproc print data=necodata;\n\
  run;\n```\n\n#### 输出 2.3B: 时间戳匹配数据\n\n![image](img/Ch02_out_2-3b.jpg)\n\n`PROC TIMESERIES`\
  \ 具有类似的功能。然而，`PROC TIMEDATA` 允许你使用 `PROC` 语句导入自己的函数和子程序。`PROC TIMESERIES` 拥有许多用户可能认为有助于诊断和评估的内置图形。这些包括序列图、交叉图，以及自相关、部分相关图和时间序列图。你还可以在间隔期间保持低频率序列不变，如表\
  \ 2.5 所示。然后，可以使用状态空间模型等特殊技术来解决频率不兼容问题；然而，这些主题超出了本书的讨论范围。\n\n### 数据完整性\n\n缺失值是最常见的数据问题类型。缺失数据可以是数据集中随机或系统性的发生情况。它们可能占数据的一小部分或大部分比例。无论它们如何发生，都对数据的可可视化和分析构成了潜在问题。某些算法还使用个案分析，这意味着算法在构建模型时将排除所有带有缺失值的观测值。从实际角度来看，机器生成和人工整理的数据较少出错；因此，它们产生不完整数据的概率较低。然而，如果在合并具有不同数据结构的机器生成数据时不采用相应方法，输出数据可能会出现缺失值，如程序\
  \ 2.4A、2.4B 和 2.4C 所示。\n\n#### 表 2.5: 金融市场之间的数据结构不兼容\n\n| 日期 | 标普 500 指数 | 初请失业金人数\
  \ | 住房抵押申请 | 业业率 | GDP | CPI |\n| :--- | :--- | :--- | :--- | :--- | :--- | :---\
  \ |\n| 3/22/2022 | 4511.61 | 166 | -8.1% | 5.93% | 7.0% | 7.9% |\n| 3/23/2022 |\
  \ 4456.24 | | | | | |\n| 3/24/2022 | 4520.16 | | | | | |\n| 3/25/2022 | 4543.06\
  \ | | | | | | |\n| 3/28/2022 | 4575.52 | | | | | | |\n| 3/29/2022 | 4631.18 | |\
  \ | | | | |\n| 3/30/2022 | 4602.45 | | | | | | |\n| 3/31/2022 | 4530.41 | | | |\
  \ | | |\n| 4/1/2022 | 4582.64 | | | | | | |\n| 4/4/2022 | | | | | | | |\n\n在程序 2.4A\
  \ 中，我们使用 `DATA` 语句创建了 `BITCOIN` 和 `SPX` 数据集。`BITCOIN` 数据记录了以美元计的 `BITCOIN` 每日价格，而\
  \ `SPX` 数据记录了标普 500 指数的每日收盘价。由于比特币每天 24 小时都在交易，而标普 500 指数仅在工作日交易，你会注意到 `SPX` 数据集在\
  \ 12/17/2022 和 12/18/2022（周末）缺失观测值，以及 12/24/2022 之后。\n\n#### 程序 2.4A: 使用 DATA 步骤和\
  \ PROC PRINT 显示合并不完整数据的问题\n\n```sas\ndata bitcoin;\ninput date mm10.\nformat date\
  \ mm10.;\ndatalines;\n12/16/2022 3852.36\n12/17/2022 3817.66\n12/18/2022 3821.62\n\
  12/19/2022 3878.44\n12/20/2022 3853.54\n12/21/2022 3893.18\n12/22/2022 3875.52\n\
  12/23/2022 3844.82\n12/24/2022 3829.82\n12/25/2022 3830.25\n12/26/2022 3833.01\n\
  12/27/2022 3692.55\n;\nrun;\n\nproc print data=bitcoin;\nrun;\n```\n\n```sas\ndata\
  \ spx;\ninput date mm10.\nformat date mm10.\ndatalines;\n12/16/2022 4700.95\n12/19/2022\
  \ 4756.66\n12/20/2022 4721.39\n12/21/2022 4778.44\n12/22/2022 4722.58\n12/23/2022\
  \ 4744.39\n12/26/2022 4817.62\n12/27/2022 4811.33\n;\nrun;\n\nproc print data=spx;\n\
  run;\n```\n\n\n\n\n\n### 程序 2.4B：使用 DATA Step 和 PROC PRINT 显示外连接（Outer Join）问题\n\
  \n```sas\ndata bitspx;\n      merge bitcoin spx;\n      by date;\nrun;\n\nproc print\
  \ data=bitspx;\nrun;\n```\n\n### 输出 2.4B：外连接合并\n\n| ![image](img/Ch02_out_2-4b.jpg)\
  \ |\n\n### 程序 2.4C：使用 DATA Step 和 PROC PRINT 显示内连接（Inner Join）问题\n\n```sas\ndata\
  \ crypto_stock;\n      merge bitcoin (in=a) spx(in=b);\n      by date;\n      if\
  \ b and  a;\nrun;\nproc print data=crypto_stock;\nrun;\n```\n\n`IN=` 数据集选项将二进制变量\
  \ `A` 和 `B` 分别赋予 `Bitcoin` 和 `SPX` 数据集。新变量的值随后用于指示两个数据集是否都对当前观测值有所贡献。在程序 2.4C 中，只有当\
  \ `BY` 变量（`DATE`）的匹配值在两个数据集中都存在时，两个数据集才能对当前观测值贡献。由于 2022 年 12 月 17、18、24、25 和 26\
  \ 日的 `SPX` 数据集中不存在 `DATE` 的匹配值，因此 `Bitcoin` 数据集中这些日期的观测值未包含在新创建的数据集中。你需要注意，`IN=`\
  \ 变量不会被添加到输入数据集中。它们仅在代码执行期间对编程语句可用。\n\n## 输出 2.4C：内连接合并\n\n| ![image](img/Ch02_out_2-4c.jpg)\
  \ |\n\n## 处理缺失值\n\n人类生成的数据更容易出现诸如缺失值之类的错误。当此类情况发生时，数据科学家必须仔细决定最佳行动方案来解决问题。选项包括：\n\
  \n*   如果缺失值是有限且随机的，可以考虑用默认值替换缺失值。如果数据是时间序列，可以使用上一个观测值作为默认值（如程序 2.5 所示）；也可以使用平均值、众数、中位数、最大值、最小值或缺失值指示器。在程序\
  \ 2.5 中，SAS `DATA` 步使用临时变量 `_SPX_` 在迭代观测值时记录 PDV（程序处理视图）中 `SPX` 的当前值。如果下一个观测值的该值缺失，则使用该值来替换缺失值。我们通过执行\
  \ SAS 代码得到的结果如输出 2.5 所示。\n\n## 程序 2.5：使用 DATA Step 合并不完整数据的问题\n\n```sas\n/*使用滞后值填充缺失值*/\n\
  data nbitspx;\n  set bitspx;\n  retain _spx_;\n  if missing(spx) then _spx_=spx;\n\
  \  else spx=_spx_;\n  drop _spx_;\nrun;\n```\n\n## 输出 2.5：合并不完整数据\n\n| ![image](img/Ch02_out_2-5.jpg)\
  \ |\n\n*   数据科学家还可以通过使用数据集中其他字段进行估计来推断缺失值，如程序 2.6 所示。在程序中，我们首先模拟了四只股票两年的月收益率。我们还使用了\
  \ `INTX` 函数生成每月日期，从 2021 年 1 月 31 日的初始日期开始。在 `INTX` 函数中，`END` 告知 SAS 在计算时使用期末日期。在下一个\
  \ `DATA` 步中，我们模拟了缺失值的随机模式。然后，我们尝试使用多重插补（MI）程序来推断缺失值。4 MI 将缺失值替换为一组合理值的随机样本。该方法创建了相同数据集的多个版本，每个版本都包含数据的合理值。然后使用标准程序对插补数据集进行估计和分析，并合并它们的结果以得出统计推断。在\
  \ `MI` 程序的代码中，`NIMPUT` 语句指定了每个观测值抽取的插补次数。`minimum` 和 `maximum` 语句指定了插补变量的最小值和最大值。`MCMC`\
  \ 指定应使用蒙特卡洛链链（Monte Carlo Chain）进行插补。\n\n## 程序 2.6：使用 PROC MI 插补不完整数据中的缺失值\n\n```sas\n\
  /*模拟 4 只股票的月收益率*/\ndata simult;\n  format date.; \n  array ret[4] ret1-ret4 ;\n\
  \  keep date ret1-ret4;\n```\n\n```sas\ncall streaminit(1);\n  initdate = '31dec2020'd;\n\
  \  dt=0;\n  do i = 1 to 24;\n    dt+1;\n    do k = 1 to 4;  \n      date= intnx('month',initdate,dt,'end');\n\
  \      ret[k] = rand('normal');\n    end;\n    output;\n  end;\nrun;\n\n/*模拟随机值*/\n\
  data Randsimul(drop=i);\n  call streaminit(1234);\n  set work.simult;\n  array x\
  \ {*} _numeric_;\n  do i = 2 to dim(x);  /*i=2 跳过日期列*/\n    if rand(\"Bern\", 0.2)\
  \ then  /*随机二值值*/  \n      x[i]=.;\n  end;\nrun;\n\nproc print data=randsul(obs=10);\
  \ \nrun;\n\n/*使用 PROC MI 推断缺失值*/\nproc mi data=randsul nimpute=25 minimum=-10 maximum=10\
  \ out=imfsimul;\n  mcmc start=value plots=all;\n  var Ret1 Ret2 Ret3 Ret4 ;\nrun;\n\
  \nproc print data=imfSimul (obs=10); \nrun;\n```\n\n输出 2.6 显示了执行程序 2.6 得到的结果。输出的第一部分了带有随机模拟缺失值的模拟数据集。第二部分显示了输入缺失值后的相同数据集。接下来是报告期望极大（EM）参数估计（后验众数）、缺失数据模式和参数估计的表格。EM\
  \ 算法迭代过程用于推导不可观测（隐含）变量模型的极大似然估计。缺失数据模式显示了数据中不同的缺失数据模式。参数估计显示了对数据进行 25 次插补后得到的均值、标准差和均值的置信区间。注意\
  \ EM 算法估计与参数估计之间的差异。\n\n## 输出 2.6：模拟不完整数据\n\n| ![image](img/Ch02_out_2-6.jpg) |\n\
  \n\n\n\n```\n/*Using Proc Capability to Visualize Outliers*/\n%datapull(vol,rspx_monthly.sas7bdat);\n\
  proc capability data=rspx_monthly noprint;\n      title 'Outlier Detection Plots\
  \ for Monthly S&P 500 Trading Volume';\n      var volume;\n      qqplot/ normal(mu=est\
  \ sigma=est color=blue );\n      ppplot / normal (mu=est sigma=est color=blue);\n\
  \      format Volume best8.;\nrun;\n```\n\n| --- |\n\n`程序 2.7` 显示了使用 `CAPABILITY`\
  \ 过程将 1991 年 1 月至 2022 年 12 月标普 500 指数的月交易量绘制正态 P-P 图和 Q-Q 图。`Q-Q` 图将交易量的经验分位数与正态分布的理论分位数进行比较。`P-P`\
  \ 图将交易量的经验累积概率分布与理论分布进行比较。如果交易量的分布完全符合正态分布，则两个图中绘制的蓝点都应该落在对角线上。`输出 2.7` 中显示的可视化结果表明，月交易量的分布并非正态。\n\
  \n输出 2.7：标普 500 月交易量离群值检测图\n\n| ![image](img/Ch02_out_2-7.jpg) |\n\n| --- |\n\n\
  ## 处理离群值\n\n发现离群值时，数据科学家可以：\n\n*   用默认值替换离群值（均值、众数、中位数、最大值、最小值、缺失值指示器）。\n\n*   通过使用其他可用信息估计推断离群值的替换值。对于时间序列数据，SAS\
  \ 中的 `X11`、`X12` 和 `X13` 过程可以使用平滑函数（指数）自动识别并替换离群值观测值，如`程序 2.8`所示。在程序，我们通过指定 `OUTLIER`\
  \ 语句调用过程的自动离群值检测选项。离群值定义为任何超出均值 3.6 个标准差的值。\n\n*   最后两个选项——排除或删除带有离群值的观测值——应仅作为最后的手段，因为它们可能会影响后续步骤中对数据进行的分析。\n\
  \n程序 2.8：使用 PROC X13 解决数据中的离群值问题\n\n| \n\n```\n%datapull(vol,rspx_monthly.sas7bdat);\n\
  /*Using PROC X13 进行自动离群值检测和修正*/\nproc x13 data=rspx_monthly  date=Date INTERVAL\
  \ = month;\n   var volume;\n   transform function=log;\n   arima model=( (0,1,1)(0,1,1)\
  \ );/*带有指数平滑的 ARIMA*/\n   outlier cv=3.6 ;\n   estimate; x11; \n/*a1 是预调整的时间序列，e1\
  \ 是离群值调整后的序列*/\n   output out=arspx_monthly a1 e1;\nrun;\n```\n\n |\n\n| --- |\n\
  \n输出 2.8：使用 PROC X13 进行离群值修正\n\n| ![image](img/Ch02_out_2-8.jpg) |\n\n| --- |\n\n\
  `X13` 过程使用自回归整合移动平均规范（我们将在视觉诊断部分进行详细讨论）和指数平滑方法来处理量序列的一系列统计异常情况，包括离群值。在`输出 2.8` 中，我们报告了回归模型的结果和参数估计。注意算法在挖掘数据中的离群月份方面表现得多么出色。与流行观点不同，2008–2009\
  \ 年金融危机实际上始于 2007 年初，当时次级贷款违约率开始大幅上升，导致了两家（现已倒闭的）贝尔斯坦（Bear Stearns）和雷曼兄弟（Lehman\
  \ Brothers）的倒闭。\n\n\n\n\n与数据一致性的情况类似，更高的采样频率和聚合会导致数据粒度的丧失。如果高粒度数据中的大部分细节是数据科学家试图消除的统计噪声，那么这并不一定是一个问题。无论采用何种方法，最佳规则都应该在粒度与结果的实际实用性之间进行权衡，即结果推广到项目所有者业务需求的能力。没有实际实施或部署价值、或产生过拟合模型的高粒度数据，比低粒度的数据更不可理想。\n\
  \n### 程序 2.10：使用 PROC TIMEDATA 解决噪声数据问题\n\n```sas\n/*模拟比特币一年的 5 分钟收益率*/\ndata Bitcoin;\n\
  \    format Date datetime.;\n    length Bitcoin 8;\n    call streaminit(1);\n  \
  \  InitDate = '1Jan2021:00:00'dt;\n    dt=0;\n\n    do I = 1 to 105120;/*一年中 5 分钟间隔的个数*/\n\
  \             dt+5;\n             Date=  intnx''minute'',InitDate,dt);\n       \
  \      Bitcoin = rand''norma'');\n             output;\n    end;\nrun;\n\n/*将收益率累计为小时，最后一次观测*/\n\
  proc timedata data=Bitcoin out=mseries plot=all;\n    id date interval=hour \n \
  \            /*选项包括小时、日、周、月、季、年*/\n    accumulate=last; /*选项包括第一个、平均值、中位数、最后，*/\n\
  \    var Bitcoin;\nrun;\n```\n\n在程序 2.10 中，我们使用 `DATA` 步模拟了一年的比特币收益率。然后我们应用 `TIMEDATA`\
  \ 过程对序列进行转换。`TIMEDATA` 过程支持一系列聚合和采样频率选项。在示例代码中，使用 `INTERVAL=Hour` 和 `ACCUMULATE=Last`\
  \ 语句来指定从五分钟序列中记录每小时的最后一个观测值。在输出 2.10 中，我们显示了模拟比特币价格每小时累计值的序列图。\n\n#### 输出 2.10：频率调整后比特币价格的时间序列图\n\
  \n| ![image](img/Ch02_out_2-10.jpg) |\n\n总结而言，SAS 中的许多内置功能和过程使其非常适合数据清洗和预处理。在表 2.6\
  \ 中，提供了常见数据质量问题、可能的解决方案以及可以调用来解决这些 SAS 过程目录。\n\n#### 表 2.6：数据质量问题及 SAS 解决方案汇总\n\n\
  | 数据质量问题 | 解决方案 | SAS 过程 |\n| :--- | :--- | :--- |\n| 非正态性 | 转换 | `EXPANDTIMEDATATIMESERIESDATA`\
  \ |\n| 频率不兼容 | 聚合 | `EXPANDTIMEDATATIMESERIES` |\n| 时间戳不兼容 | 同步聚合 | `TIMEDATA` |\n\
  | 缺失值 | 替换推理完整案例分析 | `TIMEDATATIMESERIESMI,SURVEYIMPUTE,MIANALYZE` [5] |\n| 噪声 |\
  \ 聚合 | `EXPANDTIMEDATATIMESERIESSTATESPACE` |\n| 群值 | 替换 | `ARIMAX13UCM` |\n\n###\
  \ 其他数据清洗工具\n\n除了 `DATA` 步之外，在 SAS 中操作数据的另一种通用方法是使用结构化查询语言 (SQL)，以及用于高级数据处理的新型 SAS\
  \ 专用编程语言，称为 `DS2`。\n\n#### SQL 过程\n\nSQL 是一种数据库编程语言，用于管理和操作存储在关系型数据库中的数据。尽管公共领域有许多编程语言的变体，但它们都遵循美国国家标准\
  \ (ANSI) 和国际标准组织 (ISO) 的标准，因此其核心语法是相同的。我们将使用 `PROC SQL` 来执行某些任务，例如 `SELECT`、`JOIN`、`CREATE`、`UPDATE`、`ALTER`\
  \ 和 `DROP`。虽然 `PROC SQL` 的实现与其它实现略有不同。\n\n#### DS2 过程\n\n`DS2` 编程语言是一种面向对象的语言，它扩展了\
  \ `DATA` 步，包含了过程元素和自定义方法。`DS2` 及其高性能等效版本 `HPDS2` 在 SAS 环境中均可用。虽然你可能在书中遇到 `DS2` 的示例，但值得注意的是一些对你有帮助的主要特性。`DS2`\
  \ 支持多种数据类型；然而，数据类型在创建时必须声明。你还可以创建方法和包。`DS2` 中的方法类似于自定义函数，而包是方法的块。事实上，这种语言相当高级，我们将探索的大部分示例不需要这种复杂的。\n\
  \n### 数据可视化描述\n\n回顾第一章，金融环境中的现实数据分为以下分类：截面数据、时间序列和面板数据。考虑到非结构化数据的增长，将其加入列表并为每种类型提供建议可视化。\n\
  \n*   **截面数据**：在单一时间点收集的统计单元或项目的数据。通过可视化从这些数据中获取见察，应该考虑突出中心趋势、离散程度、对称性和关联的可视化类型。\n\
  *   **时间序列数据**：在多个时期收集的同一项目或统计单元的数据。通过可视化从这些数据中获取见察，应该考虑突出趋势和序列相关性，以及中心趋势、离散程度、对称性和关联的可视化类型。\n\
  *   **面板数据（纵向数据）**：跨越多个时期收集的截面数据。通过可视化从这些数据中获取见察，应该考虑突出趋势、序列相关性、因果关系，以及中心趋势、离散程度、对称性和关联的可视化类型。\n\
  *   **非结构化数据**：没有预定义框架的数据。在可视化之前需要进行预处理。通过可视化从这些数据中获取见察，应该考虑突出强度和关联的可视化类型。\n\n####\
  \ SAS 中的可视化选项\n\nSAS 使用两个不同的系统来渲染可视化。第一个系统被称为 ODS Graphics，它是一个基于模板的系统，在 Base SAS\
  \ 中带有预构建的模板。第二个系统被称为 `SAS/GRAPH`，是一种基于设备的图形系统，与 Base SAS 独立许可并安装。\n\n\n\n\n\n由 ODS\
  \ Graphics 过程（也称为统计图表过程）生成的可视化结果是由编译后的 ODS 图形模板创建的。这些模板使用 SAS 图形模板语言（`GTL`）预构建，并经过预编程，以允许用户通过极少的编程工作进行自定义。ODS\
  \ Graphics 过程可用于生成各种可视化内容，包括统计图表和非统计图表。过程名称中的 `SG` 前缀（例如 `SGPLOT`、`SGPIE`、`SGRENDER`、`SGMAP`、`SGPANEL`\
  \ 和 `SGSCATTER`）是这一系列 ODS Graphics 过程的共同特征。`PROC SGPLOT`无疑是最流行的过程，它可以创建各种单单元图、图表类型和叠加层。`PROC\
  \ SGPIE` 创建饼图和环形图，`PROC SGMAP` 创建地理地图，而 `PROC SGRENDER` 则使用 `GTL` 编写的图形模板渲染可视化结果。\n\
  \n## SAS/GRAPH\n\n多年来，SAS 在已经丰富的 SAS 语句数组中添加了多个可视化语句。其中许多可视化功能包含在 `SAS/GRAPH` 软件包中，该软件包是\
  \ SAS 产品族的一部分，用于数据可视化和演示。`SAS/GRAPH` 编程使用了 Base SAS 语言的元素、`ODS` 语句以及自身的 `SAS/GRAPH`\
  \ 语言元素。`SAS/GRAPH` 语言元素也使用 `PROC` （例如 `PROC GCHART` 和 `PROC GMAP`），因此用户可以在包含其他 SAS\
  \ 语句的 SAS 文件中调用图表。\n\nODS Graphics 和 `SAS/GRAPH` 共享共同的 `ODS` 语句，用于控制图表和图形的显示方式以及\
  \ SAS 在生成后存储它们的位置。这可以是 HTML 文件，或者是 `LISTING`、`RTF` 或 `PDF` 文件。在表 2.7 中展示了各种描述性度量、可视化选项以及可以调用渲染它们的\
  \ SAS 语句的目录。\n\n| 表 2.7：描述性度量、可视化及相关 SAS 语句 |\n| --- |\n| 度量 || 可视化 || SAS 语句 |\n\
  | 集中趋势 || 直方图箱线图 | `UNIVARIATE` |\n| 中心性 || 聚类图 | `CLUSTER*SGPLOTFASTCLUS*SGPLOT`\
  \ |\n| 离散度 || Q-Q 图直方图残差图 | `UNIVARIATECAPABILITYSGPLOT` |\n| 对称性 || Q-Q 图直方图 |\
  \ `UNIVARIATECAPABILITYSGPLOT` |\n| 强度 || 柱状列图环形图饼图词云热力图气泡图 | `SGPLOTGCHART` |\n\
  | 关联性 || 散点图面积图热力图树形图气泡图地图等线图表面图 | `SGPLOTGMAP, SGMAP` |\n| 趋势 || 折线图散点图 | `SGPLOT`\
  \ |\n\n# 使用 SAS 分析投资组合表现\n\n如前面的表所示，你可以在 SAS 中实现各种可视化效果。让我们探索这些可视化效果在投资环境中的一些应用。具体而言，我们将考虑\
  \ SAS 在投资组合报告和分析环境中的用例。我们的示例组合由 63 只股票组成，分布在 11 个 GIC 行业，涵盖所有三类市值。股票代码和公司名称如表 2.8\
  \ 所示。我们将分析该组合在 2021 年的表现，从 1 月 1 日开始，到 12 月 31 日结束。\n\n在开始可视化之前，让我们简要地设置一些参数，以指导我们对报告年度投资组合的检查。首先，读者应该注意，绩效评估是一个非常复杂且全面的过程，受行业最佳实践（如全球投资绩效标准\
  \ [`GIPS`]）以及监管标准（如财务会计准则委员会 [`FASB`]）以及证券交易委员会 (`SEC`）规则和条例的管辖。因此，全面涵盖该主题超出了本书的范围。通常情况下，绩效评估由五个活动组成：绩效衡量、绩效归因、绩效评价、经理选择和绩效展示。在这个示例中，我们将可视化重点集中在上述五个方面中的两个（衡量和归因）。\n\
