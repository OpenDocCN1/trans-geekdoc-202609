  \  /*定义决策标准*/\n  row NPV /'\n         'NPV 计算:'\n         '净现值' format= nlmny16.2\
  \ zero=' ';\n  row IRR/'内部收益率' LJC format=' ';\n\n  /*填充利润表数值*/\n  calc:\n  /*每年收入增长\
