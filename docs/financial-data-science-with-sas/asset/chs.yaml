  \nii. 项目的平均收入和现金是多少？\n\niii. 模拟得到的最大和最小 IRR 分别？\n\niv. 最可能的 NPV 和 IRR 是？\n\n| 提示：修改\
  \ `Program 4.15`。注意对数据集的引用。数据集的名称不同。你可能需要从报表中创建一个行。 |\n| --- |\n\nd. 根据你对项目的所有了解，公司是否应该继续进行？除了工作表结果外，公司还应该考虑哪些宏观经济、人口、社会技术趋势？\n\
  \n# 5. 使用模拟进行风险管理\n\n## 使用模拟进行风险管理\n\n财务风险管理是识别、分析、评估并策略地应对可能对组织造成经济损害的随机事件。财务风险可能由于许多其他风险，如运营、市场、利率、流动性、信用、声誉、气候和环境。模拟等数据科学工具是实施财务风险管理的天然选择。\n\
  \n在第四章中，我们展示了如何使用模拟研究销量对拟议资本项目的影响的影响，并研究 S&P 500 指数在一段时间内的样本路径。在这两种情况下，都使用了称为蒙特卡洛模拟的特殊类型模拟来分析和评估可能产生重大经济影响的随机事件（分别为销量和收益）。\n\
  \n在本章中，我们将研究模拟在评估分布尾部风险暴露方面的应用。对于大多数风险经理而言，投资或项目在分布下尾的行为通常是更关注的问题。幸运的是，还有其他方法可以检查财务变量在分布尾部的行为。实际上，许多这些方法在框架中也使用了模拟。这些方法包括极值理论\
  \ (EVT)、Copula 和严重性分布 (SD) 等。\n\n\n\n\n严重程度法（Severity approach）通过在分布指定的分位数处的变量值来拟合分布参数。这些分位数通常位于分布的尾部。例如，保险公司可能感兴趣在风险发生时，衡量风险投资组合损失的程度（即严重程度）。我们将在随后的示例中使用严重程度法。现在，让我们检查一下\
  \ `EVT` 和 Copula 方法。\n\n### 极值理论 (EVT)\n\n在 `EVT` 方法中，假设随机变量在数尾部具有不同的分布特性，使得当随机变量距离其分布中心越远时，其行为会有显著不同。通常情况下，高影响但低频率的事件大多分布在分布的尾部。然而，高斯分布（如正态分布）并不适用于建模这类事件，因为它们分配给此类事件的概率太低，以至于可能会错误地认为这些事件发生的概率极低，而实际上，随着现实环境中机会窗口的扩大，它们确实有一定的发生的概率。\n\
  \n例如，如果我们假设指数对数收益率遵循正态分布，观察到标普 500 指数一个月比平均收益率 0.67% 低四个标准差的月收益率的概率为 0.003%，或每 31,754\
  \ 个月一次。在现实中，在我们的 `SPX_RET` 数据集中，374 个月中有 1 个月观察到了高于此阈值的月收益（概率为 0.27%）。\n\n极值理论是一种统计方法，通过使用某种极限（渐近）分布来对这些极值的发生模式建模，从而分析已知分布中的极值。极限分布是指一组来自已知概率分布的随机变量在随着样本量的增加而收敛的概率分布。如果我们假设感兴趣的极值是独立同分布的（i.i.d），那么我们就可以应用某种类型的极限分布来分析它们的发生模式。使用极限分布进行建模的两类极值是最小值和最大值。\n\
  \n### 广义极值分布\n\n假设 `X[t]` 是一组独立同分布（i.i.d.）的随机变量。最大值或最小值集合 `X[t]` 的极限分布可以用广义极值（GEV）分布来描述，如公式\
  \ (5.1)所示。\n\n$F\\\\left( {x;\\\\theta,\\\\sigma,\\\\xi} \\\\right) = \\exp\\\\\
  left\\{ {- \\\\left\\\\lbrack {1 + \\\\xi\\\\left( \\\\frac{x - \\\\theta}{\\\\\
  sigma} \\\\right)} \\\\right\\\\rbrack^{- 1/\\\\xi}} \\\\right\\}$ (5.1)\n\n其中 `θ`\
  \ 是位置参数，`σ` 是尺度参数，`ξ` 是形状参数。GEV 分布包含了三个常用的极限分布（Gumbel 分布、Fréchet 分布和 Weibull 分布）。根据形状参数的值，GEV\
  \ 分布转化为这三个分布之一：\n\n*   当 `ξ` = 0 时，GEV 等同于 Gumbel 分布（I 型极值分布）。\n*   当 `ξ` > 0 时，GEV\
  \ 等同于 Frechet 分布（II 型极值分布）。\n*   当 `ξ` < 0 时，GEV 等同于 Weibull 分布（III 型极值分布）。\n\n\
  Gumbel 分布常用于正态分布最大值或最小值的极限分布，而 Frechet 分布用于建模 Student t 分布最大值和最小值的极限分布。Weibull 分布更经常用作\
  \ beta 分布最大值和最小值的极限分布。\n\n由于正态分布在金融领域常用，让我们探索如何模拟更有可能出现在分布尾部的极值。我们特别对能够同时建模随机变量序列最大值和最小值的分布感兴趣。因此，当我们从\
  \ GEV 分布中模拟值时，通过指定 `ξ` = 0 来选择 Gumbel 分布。我们还需要指定位置（`θ`）和尺度（`σ`）参数。\n\n程序 5.1：模拟标普\
  \ 500 收益的区块最大值和最小值\n\n```sas\n/*Simulating Maximum and Minimum values of Index returns*/\n\
  %let mu=0.0067658;\n%let ssd =0.04465726;\n\ndata simul13;\n    call streaminit(4321);\n\
  \    array xnum{1000} x1-x1000;\n\n    do j = 1 to 1000;\n        do I = 1 to 1000;\n\
  \            xnum[i]=rand('norma',&mu, &ssd);\n        end;\n        output;\n \
  \   end;\nrun;\n\nproc univariate data=simul13;\n    var xnum;\n    histogram gumbel;\n\
  run;\n\nproc sgplot data=simul13;\n    title 'Simulating Maximum and Minimum values\
  \ of Index returns';\n    density(x=xnum) label='Minimum Value';\n    density(x=xnum)\
  \ label='Maximum Value';\n    title 'Distribution of S&P 500 Returns' / position=top;\n\
  \    xaxis label='Simulated Value';\n    yaxis values=(0 to 25);\nrun;\n```\n\n\n\
  \n\n\n# 输出 5.1B：标普 500 指数最大和最小收益的模拟分布\n\n| ![image](img/Ch05_out_5-1b.jpg) |\n|\
  \ --- |\n\n现在我们已经获得了所需的 Gumbel 分布参数，让我们利用位置参数（location）和形状参数（shape）来模拟极端负收益的分布。程序\
  \ 5.2 显示了用于实现该模拟的 SAS 代码。我们还模拟了 1,000 个正态分布的收益，以为这些极端收益在现实世界中如何体现提供背景。由于 Gumbel\
  \ 分布是 GEV 分布的特例，我们还通过将 GEV 分布的形状参数设置为零，从 GEV 分布中模拟了其值。1\n\n## 程序 5.2：从 Gumbel 和\
  \ GEV 分布模拟极端负收益\n\n```sas\n/*Simulating Extreme Negative Returns from Gumbel Distribution*/\n\
  %let n=1000;\n%let mun    = -0.14594;  /* location parameter */\n%let sigman = 0.018013;\
  \ /*Shape Parameter*/\n%let mean=0.0067658; /*Mean of Normal distribution*/\n%let\
  \ ssd =0.04465726;/*STDEV of Normal distribution*/\n\ndata simul14;\n      call\
  \ streaminit(4321);\n\n      do k=1 to 1000;\n            xgumb = rand('gumbel',&mun,&sigman);\n\
  \            xgev= rand('extrvalue',&mun,&sigman,0);\n            xnorm=rand('normal',&mean,\
  \ &ssd);\n            output;\n      end;\n\n      label \n            xgumb ='Simulated\
  \ Minimum Gumbel Returns'\n            xgev ='Simulated Minimum GEV Returns'\n \
  \           xnorm ='Simulated Normal Returns';\nrun;\n\nproc sgplot data=simul14;\n\
  \      inset \"Minimum Stock Returns from Gumbel Distribution\"/title=\" Simulating\
  \ Extreme\n      1-Month S&P 500 Index Stock Returns\" position=top \n      textattrs=(family=\"\
  Times New Roman\" color=darkblue size=12) valuealign=center \n      titleattrs=(family=\"\
  Times New Roman\" color=darkblue size=12 weight=bold) \n      labelalign=center;\n\
  \      histogram xgumb/dataskin=matte fill transparency=0.3 legendlabel='Extreme\
  \ Negative\n      Monthly Returns';\n      histogram xnorm/dataskin=matte fill transparency=0.3\
  \ legendlabel='Normal Monthly \n      Returns';\n      xaxis label= 'Simulated Returns\
  \ Values' values=(-0.2 to 0.2 by 0.05);\n      yaxis values=(0 to 35 by 5);\nrun;\n\
  ```\n\n## 表 5.1：极值统计量\n\n| 变量 | 平均值 | 最小值 | 中位数 | 最大值 |\n| --- | --- | --- | ---\
  \ | --- |\n| 模拟最小 Gumbel 收益 | -13.59% | -18.07% | -13.98% | 3.10% |\n| 模拟最小 GEV\
  \ 收益 | -13.54% | -17.94% | -13.95% | -3.06% |\n| 模拟正态收益 | 0.74% | -12.20% | 0.72%\
  \ | 14.93% |\n\n直接从 Gumbel 分布及其特例 Gumbel 分布获得的平均收益非常相似，但与正态分布模拟的收益不同，如表 5.1 所示。对于每个模拟序列，我们还计算了最小、中位数和最大收益的平均值。\n\
  \n注意，从正态分布获得的最小收益（约比均值低三个标准差）远高于 Gumbel 分布的数值（约比均值低四个标准差）。使用正态分布获得负收益的概率（即比均值低四个标准差）几乎为零，而使用\
  \ Gumbel 分布实现相同结果的概率为 1.6%，这更接近我们在样本中观察到的情况。\n\n在输出 5.2 中，我们在同一张图上绘制了来自 Gumbel 和正态分布模拟收益的直方图，以展示两种收益在分布属性上的差异。你会发现，从\
  \ Gumbel 分布得出的最小收益概率密度与从正态分布获得的收益概率密度有明显不同。\n\n### 输出 5.2：使用 Gumbel 分布模拟标普 500 指数最小收益\n\
  \n![image](img/Ch05_out_5-2.jpg)\n\n## 使用 GEV 分布计算风险价值 (VaR)\n\n使用 GEV 分布计算金融头的风险价值\
  \ (`VaR`)2 可以通过实现以下表达式来实现：\n\n$VaR = \\left\\{ \\begin{array}{l} \\theta_{n} - \\\
  frac{\\sigma_{n}}{\\xi_{n}}\\left\\{ 1 - \\left\\lbrack {- n\\log(1 - p)} \\right\\\
  rbrack \\right\\} \\right^{- \\xi_{n}}\\text{~~~~~~~~}\\xi_{n} \\neq 0} \\\\ {\\\
  theta_{n} - \\sigma_{n}\\log\\left\\lbrack {- n\\log(1 - p)} \\right\\rbrack\\text{~~~~~~~~~~~~}\\\
  xi_{n} = 0\\text{~~~}} \\end{array} \\right. (5.2)$\n\n其中 `θ[n]` 和 `σ[n]` 是模拟最大分布的位置参数和尺度参数，`ξ[n]=0`\
  \ 是每个样本的大小。\n\n程序 5.3 显示了用于计算标普 500 指数 90%、95% 和 99% 单月 `VaR` 的 `DATA` 步。由于 Gumbel\
  \ 分布中 `ξ[n]=0`，因此使用了公式 (5.2)中的第二个表达式。估计的 `VaRs` 保存在 `GEVAR` 数据集中。然后使用 `PRINT` 过程调用\
  \ `GEVAR` 数据集中值的打印操作。\n\n### 程序 5.3：使用 GEV 分布计算风险价值\n\n```sas\n/*Calculating Value\
  \ at Risk Using the GEV Distribution*/\n%let n=1000;\n\n/*From the output of 5.1*/\n\
  %let mun  = 0.143661; /* Upper location parameter */\n%let sigman = 0.0129773; /*Upper\
  \ Shape Parameter*/\n\ndata gevvar;\n      VaR90=&mun-&sigman*log(-&n*log(1-0.1));\n\
  \      VaR95=&mun-&sigman*log(-&n*log(1-0.05));\n      VaR99=&mun-&sigman*log(-&n*log(1-0.01));\n\
  \      label\n            var90 ='90% VaR'\n            var95 ='95% VaR'\n     \
  \       var99 ='99% VaR';\n      format var90 percent.2  var95 percent.2  var99\
  \ percent.2;\nrun;\n\ntitle ' One-Month Value-at-Risk for the S500 Index';\n\nproc\
  \ print data=gevvar noobs label;\nrun;\n\ntitle;\n```\n\nVaR 估计值如输出 5.3 所示，表明在给定月份内，损失超过阈值时有\
  \ 10% 的概率至少损失 8.32%，或者有 1% 的概率损失 11.37%。\n\n### 输出 5.3：使用模拟和 GEV 分布计算风险价值\n\n![image](img/Ch05_out_5-3.jpg)\n\
  \n为了完整了解损失超过阈值时面临的风险资金，计算超过 VaR 阈值的平均值是一个好主意。这被称为预期缺口 (`ES`)。对于 GEV 分布，ES 的规范写法如下：\n\
  \n$ES_{p} = \\left\\{ \\begin{array}{l} \\theta_{n} - \\frac{\\sigma_{n}}{p\\xi_{n}}\\\
  left\\{ 1 - \\left\\lbrack {\\Gamma\\left( {1 - \\xi - \\log(p)} \\right) - p} \\\
  right\\rbrack \\right.\\text{~~~~~~~~}\\xi_{n} \\neq 0} \\\\ {\\theta_{n} - \\frac{\\\
  sigma_{n}}{p}}\\left\\lbrack {\\text{li}\\left( p \\right) - p\\log\\left( {- \\\
  log(p)} \\right)} \\right\\rbrack\\text{~~~~~~~~~~~~}\\xi_{n} = 0\\text{~~~}} \\\
  end{array} \\right. (5.3)$\n\n其中 *Γ* 是不完全伽马函数（伽马分布的累积分布函数），li 是对数积分函数。上述 ES 规范的文献仍在出现中，且\
  \ SAS 提供对数积分函数。实现这些函数的计算复杂度超出了本书的范围。该公式仅供参考。3\n\n## 广义帕累托分布\n\n\n\n\n\n# 广义帕累托分布\
  \ (GPD)\n\n另一种 EVT 分布是广义帕累托分布 (GPD)。GPD 是一种连续概率分布，用于模拟其他概率分布的尾部。与 GEV 分布的构造相似，GPD\
  \ 也由三个参数定义：`θ` 位置参数、`σ` 尺度参数和 `ξ` 形状参数。GPD 用于建模随机变量 `X` 当其值超过定义阈值 `u` 时的行为。阈值之值的分布函数（也称为条件超值分布）表示为：\n\
  \n`Fθ = P(X−θ≤y|X>θ), 0 ≤ y < x[max] − θ �      (5.4)`\n\n其中 `θ` 是阈值，`y` = `x` − `θ`\
  \ 是超值，`x[max]` 是 `X` 在 `F` 分布中的最大值。只要阈值足够高，GPD 就可以视为随机变量 `X` 超过某些阈值 `θ` 的值的分布。在这种方法（也称为超过阈值\
  \ POT）中，只有超过阈值的数值被包含在 GPD 中，这非常适合模拟金融资产的极端收益。GPD 的累积分布函数可以写为：\n\n$F_{u}(y) = \\\
  left\\\\{ \\\\begin{array}{l} {1 - \\\\left\\\\lbrack {1 + \\\\xi\\\\left( \\\\\
  frac{x - \\\\theta}{\\\\sigma} \\\\right)} \\\\right\\\\rbrack^{- \\\\frac{1}{\\\
  \\xi}}\\\\text{,~~~~}\\\\xi \\\\neq \\\\text{0}} \\\\\\\\ {1 - \\\\exp\\\\leftlbrack\
  \ {- \\\\left( \\\\frac{x - \\\\theta}{\\\\sigma} \\\\right)} \\\\right\\\\rbrack\\\
  \\{~,,~~~}\\\\xi\\\\text{=0~~}} \\\\\\\\ \\\\end{array} \\\\right.\\\\ $      (5.5)\n\
  \nGPD 是均匀分布、指数分布和帕累托分布的泛化。当 `ξ` =  − 1 时，GPD 等于均匀分布；当 `ξ` = 0 且 `θ` = 0 时，它等于指数分布；当\
  \ `ξ` >> 0 且 `θ` = `σ`/*`ξ` 时，它等于帕累托分布，其等效尺度参数为 `σ`/*`ξ`，形状参数为 1/*`ξ`。\n\n## 从广义帕累托分布模拟数据\n\
  \n从 GPD 模拟数据可以通过多种方式实现。由于均匀分布、指数分布和帕累托分布都是 GPD 的特例，我们可以通过在 `RAND` 函数中指定感兴趣的特例来模拟对应的数据。让我们模拟均匀分布和指数分布的数据，并如程序\
  \ 5.4 中的 SAS 代码所示，使用 `UNIVARIATE` 过程将这两个系列数据拟合到 GPD 分布。你应该注意，尽管我们在等式 (5.5) 中指定了\
  \ GPD 的 CDF，但我们模拟的值将派自分布的逆函数，如等式 (5.6) 所示。\n\n$F_{\\\\theta}^{- 1}(y) = \\\\left\\\
  \\{ \\\\begin{array}{l} {\\\\theta + \\\\frac{\\\\sigma}{\\\\xi}\\\\left\\\\lbrack\
  \ {U^{- \\\\xi} - 1} \\\\right\\\\rbrack\\\\text{,~~~~}\\\\xi \\\\neq \\\\text{0}}\
  \ \\\\\\\\ {\\\\theta - \\\\sigma\\\\log\\\\left( U \\\\right)\\\\text{,~~~~~~~~}\\\
  \\xi\\\\text{=0}} \\\\\\\\ \\\\end{array} \\\\right.\\\\      (5.6)\n\n其中 `U` ∈ [0,1]\
  \ 派自均匀分布随机变量。尺度参数（`SIGMA`）和形状参数（`XI`）在模拟中指定的宏变量的值是从 S&P 500 指数收益的最低十分百分位分布估计中得到的。我们将在后的\
  \ GPD-VaR 部分详细说明这些参数的计算。\n\n由于 `ξ` ≠0，我们将使用等式 (5.6) 中的第一个表达式来计算 GPD 分布的值。我们将设置 `ξ` =−1\
  \ 来计算均匀分布 GPD 的值。我们将使用第二个表达式计算指数分布 GPD 的值。记住，在所有特例中，阈值参数 `θ` 都被设置为零，因为我们正在模拟该值的超值分布。](#CH05.xhtml#footnote-02)\n\
  \n### 程序 5.4：从广义帕累托分布模拟数据\n\n```sas\n/*Simulating Data from Special Cases Of GPD*/\n\
  %let n = 1000;\n%let sigma =0.0315; \n%let xi =0.00000105367;\n%let xuni=-1;\n\n\
  data GPD;\ncall streaminit(4321);\ndo i = 1 to &n;\n    /* Generalized Pareto Parameters(scale=sigma,\
  \ shape=xi) */\n    u = rand('uniform');  \n    xguni=&sigma/xuni*(u**&xuni)-1;\n\
  \    xgexp=-&sigma*log(u);\n    xgpd = &sigma/&xi *(u**&xi)-1;\n    output;\nend;\n\
  \ndrop i;\nlabel xuni='Uniform Pareto Returns'\n      xgexp ='Exponential Pareto\
  \ Returns'\n      xgpd = 'Generalized Pareto Returns';\nrun;\n\nods graphics on;\n\
  proc univariate data=gpd;\n    var xuni xgexp xgpd ;\n    histogram xuni/ pareto\
  \ (sigma=&xuni);\n    histogram xgexp/pareto(sigma=&xi);\n    histogram xgpd/pareto(sigma=&xi);\n\
  \    ods select ParameterEstimates;\nrun;\n```\n\n我们通过在 `HISTOGRAM` 语句的 `PARETO`\
  \ 选项中指定 `σ` 和 `ξ` 的值，为每个每个 GPD 特例拟合了概率密度曲线。`PARETO` 选项用于请求绘制拟合的广义帕累托密度曲线。如果不指定这些参数，`UNIVARIATE`\
  \ 过程将计算并绘制形状和尺度参数的最大似然估计。\n\n### 输出 5.4：从广义帕累托分布模拟的数据\n\n![image](img/Ch05_out_5-4.jpg)\n\
  \n指数分布和 GPD 分布的概率密度图看起来相似，而如输出 5.4 所示，均匀分布明显不同。两个分布的估计尺度参数（sigma）数值接近，但它们的形状参数（alpha）略有不同。](#CH05.xhtml#footnote-01)记住我们使用相同的尺度参数但不同的形状参数从三个分布中模拟了值。指数分布假设\
  \ `ξ`=0，这与我们为 GPD 指定的 `ξ`=1.05E−08 非常。假设 `ξ`=−1 的均匀分布显示了模拟值分布概率密度曲线著名的矩形形状。\n\n\
  ## 使用广义帕累托分布 (GPD) 计算风险价值\n\n现在我们已经列出了 GPD 应用的一些理论和实证演示，让我们将其应用于之前在程序 5.1 和 5.2\
  \ 中处理的风险管理问题。GPD 也用于在估计金融头寸的风险价值（VaR）时模拟其分布。在 GPD 下，指定时间段的 VaR 派自 GPD 的分位数函数，可以写为：\n\
  \n$VaR_{q} = F^{- 1}\\left( {1 - p} \\right) = \\left\\\\{ \\\\begin{array}{l} {\\\
  \\theta + \\\\frac{\\\\sigma}{\\\\xi}\\\\left( {\\\\left( \\\\frac{n}{N_{\\theta}}p}\
  \ \\\\right)^{- \\\\xi} - 1} \\\\right)\\\\text{~~~~~~~}\\\\xi \\\\neq \\\\text{0}}\
  \ \\\\\\\\ {\\\\theta + \\\\sigma\\\\log\\\\left( {\\\\frac{n}{N_{\\theta}}(1 -\
  \ p) \\\\right)\\\\{~~~~~~}\\\\xi\\\\text{=0}} \\\\\\\\ \\\\end{array} \\\\right.\\\
  \\{~~}$ (5.7)$\n\n其中 `n` 代表收益的数量，`N[θ]` 表示超过阈值 `θ` 的收益数量。\n\n\n\n\n\n$ES_{q} = \\\
  frac{VaR_{q}}{1 - \\xi} + \\frac{\\sigma - \\xi\\theta}{1 - \\xi}$ (5.8)\n\n为了开始我们的\
  \ VaR 建模，让我们定义用于推导超额分布的阈值 `theta`。从风险管理的角度来看，分布的负尾是关注的重点。然而，GPD（广值分布）不允许出现负值；因此，我们需要将负的超额分布转换为正值，以估计\
  \ GPD 分布的参数。让我们选择 `theta`，使得分布中最低百分十分之一的数值包含在我们的超额分布中。确定最优阈值的一种方法是构建均剩余值图（mean excess\
  \ plot）。均剩余值图绘制了越阈值范围内超额值的平均值。在我们的示例中，收益率最低百分十分之一的数值为 -5.26%。在程序 5.5 中，我们使用了 `PROC\
  \ MEANS` 并在选项中指定了 `P10` 以获取第十百分位数的阈值。然后，我们使用 `DATA` 步骤创建了用于阈值（%MU）及其绝对绝对值（%THRESH）的宏变量（来自\
  \ `MEANS` 过程的输出），我们将在后续计算中引用它们。阈值以下的月收益绝对值包含在超额分布（`EXMRET`）中，而超过此值的月收益在随后的 `DATA`\
  \ 步骤中被丢弃。\n\n### 程序 5.5：估计超额收益分布\n\n```sas\n/*估计 GPD 分布的阈值*/\n%datapull(spx_ret,spx_ret.sas7bdat);\n\
  \nproc means data=spx_ret p10;\n      var mret;\n      output out=threshold P10=\
  \ / autoname;\nrun;\n\n/*使用 data step 创建宏变量*/\ndata _null_;\n      set threshold;\n\
  \      call symput('mu',mret_p10);\n      call symput('thresh',-mret_p10);\nrun;\n\
  \n/*创建收益的超额分布*/\ndata exspx;\n      set spx_ret;\n      where mret<&mu;\n      exmret=abs(mret-&mu);/*绝对值*/\n\
  run;\n```\n\n输出 5.5：第 10 百分位数收益\n\n| ![image](img/Ch05_out_5-5.jpg) |\n\n在程序 5.6\
  \ 中，使用了 `SEVERITY` 过程来评估超额分布并将 GPD 参数拟合到数据中。从程序的输出来看，形状参数 `ξ` 的值为 1.0536E-8，接近于零，而尺度参数\
  \ `σ` 的值为 0.03153。我们还使用 `NLMIXED` 过程估计了这两个参数的值，并得到了相同的估计值。在 `NLMIXED` 过程中，分布的参数是根据指定的对数似然函数估计的。因此，我们相信这些估计对于估计方法是稳健的。\n\
  \n### 程序 5.6：使用 PROC SEVERITY 估计 GPD 参数\n\n```sas\n/*使用 PROC SEVERITY 估计分布参数*/\n\
  proc severity data=exspx crit=aicc outest=sevest(where=( _type_='EST')) \n     \
  \ print=all plots (histogram)= all;\n      loss exmret;\n      dist gpd;\n     \
  \ nloptions tech=quanew maxiter=200;\nrun;\n\n/*使用 data step 创建宏变量*/\ndata _null_;\n\
  \      set sevest;\n      call symput('ssigma',theta);\n      call symput('sxi',xi);\n\
  run;\n```\n\n输出 5.6：使用 PROC SEVERITY 估计 GPD 参数估计\n\n| ![image](img/Ch05_2.jpg) ![image](img/Ch05_3.jpg)\
