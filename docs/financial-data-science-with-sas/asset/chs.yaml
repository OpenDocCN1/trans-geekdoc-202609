  \n***\n\n# 第 9 章：使用 SAS 进行投资组合优化\n\n## 现代投资组合理论 (MPT) 与投资组合优化\n\n现代投资组合理论认为，在给定某时期内预期收益概率分布已知的风险资产池背景下，规避风险的理性效用最大化投资者将通过风险和预期收益之间的优化权衡来构建投资组合。更广泛地说，该理论指出，理性避险投资者会为每个风险水平寻求最佳的收益权衡。在该理论下，投资者的投资组合决策仅基于两个因子：预期收益（均值）和通过方差衡量的风险\
  \ 1。因此，MPT 的投资组合方法通常被称为均值方优化（MVO）。\n\n从实践角度来看，推导风险与收益之间的最佳权衡是一个优化问题，其中目标函数和约束条件可以反映投资者偏好的优化投资组合领域。例如，假设投资者希望在给定收益水平下最小化投资组合风险，则目标函数将以风险的形式表示，所需的收益水平将以约束的形式表示：\n\
  \n```\n\\begin{array}{l} {\\\\min w^{\\prime}{\\sum w}} \\\\\\\\ {\\\\text{s}\\\\\
  text{.t}\\\\text{.~~~}w^{\\prime}E\\left( R \\\\right) = E\\left( P \\\\right),w^{\\\
  prime}1_{N} = 1} \\\\\\\\ \\\\end{array}\n```\n(9.1)\n\n其中 `E(R)` 是风险资产池的预期收益向量，`Σ`\
  \ 是协方差矩阵。在 MVO 框架下，`w` 是通过优化目标函数得出的策略权重。此外，`E(R)` 和 `Σ` 是预定义的参数。\n\n注意公式(8.20) 与(9.1)\
  \ 之间的相似性。这是因为协方差矩阵元素的投资组合权重乘积遵循 `w[i]`²（协方差矩阵的对角元素）或 `w[i]*w[j]`（协方差矩阵的非对角元素）。\n\
  \n如果投资者寻求在给定风险水平下收益最大化，则优化问题的目标函数将写在预期收益领域，而投资组合所需的风险水平将如公式(9.2)所示在约束条件中：\n\n```\n\
  \\begin{array}{l} {\\\\max\\limits_{w}w^{\\prime}E\\left( R \\\\right)} \\\\\\\\\
  \ {\\\\text{s}\\\\text{.t}\\\\text{.~~~}w^{\\prime}{\\sum w} \\leq Q,w^{\\prime}1_{N}\
  \ = 1} \\\\\\\\ \\\\end{array}\n```\n(9.2)\n\n\n\n虽然公式 (9.2)中的优化问题没有二次目标函数，但它仍然是一个非线性规划问题，因为其约束条件是非线性的。事实上，这两个优化问题都是非线性的，并且可以通过\
  \ `OPTMODEL` 过程中可用的许多非线性求解器之一来解决。请注意，公式 (9.1)和(9.2)所示的投资组合优化公式与我们之前处理过的所有优化问题具有相同的结构，这种意义在于它们都由目标函数和一组约束条件组成。这意味着我们的投资组合优化问题可以使用数学规划来解决。\n\
  \n## 均值方差优化\n\n让我们回顾第二章中的样本投资组合。你可能记得，该组合由 63 只股票组成，分布在 11 个 GIC 行业中，并涵盖了三类市值。组合中股票的股票代码、月历史收益率、月收益率标准差以及当前的投资组合权重所示表\
  \ 9.1。让我们使用 MVO 框架重新分配样本投资组合的权重。\n\n## 收益最大化\n\n我们在该优化问题中的目标是确定一组分配方案，使得投资组合的预期月收益最大化，同时满足投资组合最大风险（由月收益率标准差衡量）为\
  \ 4.5% 的限制。我们投资组合优化问题的数学公式如下：\n\n```\n$\\begin{array}{l} {\\\\max\\\\limits\\_{w}\\\
  \\text{Ε}\\\\left( R\\_{p} \\right) = {\\\\sum\\\\limits\\_{i = 1}^{n}{w\\_{i}\\\
  \\text{Ε}\\\\left( R\\_{i} \\\\right)}}} \\\\\\\\ {\\\\text{s}\\\\text{.t}\\\\text{~~}\\\
  \\sigma\\_{p}\\\\text{=}\\\\sqrt{\\\\sum\\\\limits\\_{i = 1}^{n}{w\\_{i}w\\_{j}Cov\\\
  \\left( {R\\_{i},R\\_{j}} \\\\right)}} \\\\leq 4.5\\\\%,{\\\\sum\\\\limits\\_{i\
  \ = 1}^{n}w\\_{i}} = 1} \\\\\\\\ \\\\end{array}$\n(9.3)\n```\n\n| 表 9.1: 样本投资组合股票的特征\
