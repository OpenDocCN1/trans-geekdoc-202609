  \ 参数化 |\n| 聚类 | 聚类分析 | 变量聚类, 聚类 | PCA | 非参数 |\n\n## 二元选择模型\n\n最常见的分类模型是二元选择模型。它们用于根据一组预测变量\
  \ `X = [X[1], X[2],...,X[k]]` 对具有二分法结果的响应变量 `Y` 建模。从类别上来说，响应变量可以是任何只有两种可能的结果（例如，就业或失业，通过或不通过）。在金融设置下，二元响应变量的示例包括贷款审批、股价的方向性移动、衍生证券的收益以及事件风险等。在数值上，二元选择结果通常标记为\
  \ 0 或 1，每个值代表响应变量可以取的两种二分状态之一。二元选择模型试图描述在给定一组解释变量 `X` 的情况下响应变量 `Y` 的条件分布。然而，由于响应变量取值的离散性，二元选择模型期望值\
  \ `E[Y|X] = f(Xβ)` 的函数形式与线性回归模型中的不同。你将在图 6.3 中注意到，在给定解释变量 `X` 的情况下，`Y` 只能取值为 0 或\
  \ 1。\n\n实际上，二元选择模型本质上是非线性模型。线性形式是二元选择模型中指定形式的 `f(Xβ)` 所用变换的结果。两种常用的函数形式是 **Probit\
  \ 模型**（使用标准正态分布累积分布函数）和 **Logit 模型**（也称为逻辑回归，使用逻辑累积分布函数）。因此，二元选择模型中所用函数变换的结果不是预测实际结果本身的值，而是结果实现或或反之的概率（即观测值为\
  \ 1 或 0 的概率）。\n\n分类随后根据给定的概率阈值得出。让我们考虑响应变量结果的概率 `p(y[i]=1)` 可以由表达式建模：\n\n`p(y[i]=1|x[i])\
  \ = f(u[i])` (6.38)\n\n图 6.3：二元选择模型规范\n\n![image](img/Ch06_fig6-3.jpg)\n\n其中 `u[i]`\
  \ 代表预测变量的某种参数形式，如下式所示：\n\n`u[i] = β[0] + β[1]x[i1] + β[2]x[i2] + ... + β[k]x[i k]\
  \ + ε[i]` (6.39)\n\n## Probit 模型\n\n用于 `P(Y=1|X)` 的 Probit 模型规范的函数形式 `f(u[i])` 可以写为：\n\
  \n`p(y[i]=1|x[i]) = f(u[i]) = Φ(β[0]+β[1]x[i1]+β[2]x[i2]+...+β[k]x[i k])` (6.40)\n\
  \n其中 `Φ` 代表标准正态累积分布函数。\n\n图 6.4：二元选择模型的链接函数\n\n![image](img/Ch06_6.jpg)\n\n## Logit\
  \ 模型\n\n同样，相同 Logit 模型规范的函数形式 `f(u[i])` 应用了逻辑累积分布函数，并也可以写为：\n\n$p(y[i]=1|x[i]) =\
  \ \\frac{1}{1 + exp(-(β[0]+β[1]x[i1]+β[2]x[i2]+...+β[k]x[i k]))}$ (6.41)\n\nProbit\
  \ 和 logit 模型都使用极大似然法进行估计。虽然这两种模型都可以扩展到对具有两个以上结果的响应变量建模（多元 probit 和 logit），但目前我们保持二元结果的设置。虽然可以推断每个预测变量对整体概率的边际效应，但实际值本身无法被推断，因为\
  \ Y 和 X 之间的关系是非线性的。为了计算影响，通常在 X 的平均值处估计效应，或者在 logit 的情况下将其呈现为成功与失败的对数比（也称为对数几率）。\n\
  \n$\\log\\left(\\frac{p(y[i]=1)}{1 - p(y[i]=1)}\\right) = \\beta[0] + \\beta[1]x[i1]\
  \ + \\beta[2]x[i2] + ... + \\beta[k]x[i k]$ (6.42)\n\n图 6.4 显示了随机模拟的 `X` 和 `Y` 值的\
  \ logit 和 probit 模型链接函数 `f(u[i])` 的绘图。\n\n```\nPROC PROBIT\n```\n\n\n\n\n`Program\
  \ 6.7` 显示了用于实现大型上市公司长期盈利能力预测因素的 `PROBIT` 过程的 SAS 代码。`PROBIT` 和 `LOGISTIC` 过程对较低的有序值事件进行建模。指定\
  \ `EVENT='0'` 可告知过程将负的长期回报结果作为较低的有序值进行建模。尽管在对二元选择响应变量时，`PROC LOGISTIC` 比 `PROC PROBIT`\
  \ 更常用，但该过程也具有一些与 `PROC LOGISTIC` 相同且吸引人的特性。\n\n首先，你可以使用 `model` 语句中的 `DIST=` 选项来指定分布函数。在\
  \ `model` 语句中指定逻辑分布（`LOGISTICS`）将调用 `LOGIT` 模型的估计。`STORE` 语句也可用于存储估计的模型，随后在 `PLM`\
  \ 过程中调用它时，可以对新数据集进行评分。`EFFECT PLOT` 语句用于请求绘图，将拟合值叠加在协变量的交互图上。`CONTOUR` 选项会在员工数对数（在\
  \ Y 轴）的多个阈值以及机构投资者持股百分比（在 X 轴）处叠加拟合值。\n\n### 程序 6.7：使用 PROC PROBIT 拟合长期企业盈利能力的 Probit\
  \ 模型\n\n```sas\n/* 使用 PROC PROBIT 估计长期股票回报的决定因素*/\n%datapull(profit,spx_profit.sas7bdat);\n\
  ods graphics on;\n\nproc probit data=spx_profit plot=all;\n      class ceoduality\
  \ sector;\n      model pret5(event='0') =  ceo_tenure logmcap logemp \n        \
  \       Instshrout pe esg wacc age ceoduality sector;\n      effectplot contour(\
  \ x=Instshrout y=logemp);\nrun;\n```\n\n### 输出 6.7：使用 PROC PROBIT 确定长期企业盈利能力的决定因素\n\
  \n| ![image](img/Ch06_out_6-7.jpg) |\n| --- |\n\n`Output 6.7` 显示了三类效应分析（Type III\
  \ Analysis of Effects）和极大似然参数估计表。输出中还了效应图（Effect Plot），它展示了员工人数与机构持股之间的交互对盈利能力的影响。三类效应分析表中显示的\
  \ Wald 统计量表明，CEO 任任期、市值、员工规模、机构持股比例、ESG 评分以及公司所属行业是盈利能力的预测因素。参数估计表中显示的这些变量系数符号表明，CEO\
  \ 任任期较长、市值较高以及机构持股比例较高的公司产生负长期回报的可能性较低；而 ESG 评分较高、员工人数较多且处于通信服务、可选消费、金融、医疗保健、信息技术和房地产行业的公司更有可能产生负长期回报。\n\
  \n### PROC LOGISTIC\n\n`PROC LOGISTIC` 调用 `LOGISTIC` 过程对二元、有序和名义响应变量进行估计和分类。尽管它与\
  \ `PROBIT` 过程共享许多特性，但它拥有更多功能和选项，非常适合对分类结果进行建模。\n\n`PROC LOGISTIC` 语句（带有一系列选项）用于调用该过程。`CLASS`\
  \ 语句用于指定分类预测变量。`CODE` 语句用于将估计过程中的评分代码写入 SAS 程序文件。`MODEL` 语句用于指定响应变量及其预测因素的名称。该语句带有多个选项，定义模型规范（`LINK`）、效应选择标准（`SELECTION`）、效应选择的性性水平（`SLENTRY`、`SLSTAY`）、模型拟合规范（`TECHNIQUE`、`FCONV`）、置信区间（`ALPHA`、`CLODDS`）、分类显示（`CTABLE`）、ROC\
  \ 曲线计算、诊断、显示和计算方法。`ODDSSRAT` 语句可请求多种类型的优势比。可以使用 `CONTRAST`、`ESTIMATE`、`EXACT` 和\
  \ `TEST` 语句执行多种假设检验以及参数估计检验。可以使用 `ROC` 和 `ROCCONTRAST` 语句通过 ROC 曲线比较多个模型的性能。`SCORE`\
  \ 语句创建一个 SAS 数据集，包含估计中使用的所有数据以及响应变量的后验概率。实际上，`PROC LOGISTIC` 中的功能比我们在本节中讨论的要多。\n\
  \n`Program 6.8` 显示了用于实现大型企业长期盈利能力预测因素的 `LOGISTIC` 过程 SAS 代码。\n\n### 程序 6.8：使用 PROC\
  \ LOGISTIC 拟合长期企业盈利能力的 Logit 模型\n\n```sas\n/* 使用 PROC LOGISTIC 估计长期股票回报的决定因素*/\n\
  ods graphics on;\n\nproc logistic  data=spx_profit plot=all;\n      class ceoduality\
  \ sector;\n      model pret5(event='0') = CEO_Tenure logmcap logemp \n         \
  \      Instshrout pe esg wacc age ceoduality sector;\neffectplot contour(x=Instshrout\
  \ y=logemp);\nrun;\n```\n\n### 结果比较\n\n`LOGISTIC` 过程的结果显示在 `Output 6.8A` 到 `Output\
  \ 6.8E` 中，与 `PROBIT` 过程的结果非常相似。事实上，两个模型都选择了相同的盈利能力决定因素。`Output 6.8A` 显示了三类效应分析。logit\
  \ 模型在三类效应分析表中显示的显著变量与 Probit 模型在相同表格中显示的变量相同（CEO 任任期、市值、员工规模、机构持股、ESG 评分和行业），尽管它们的检验统计量略有不同。`Output\
  \ 6.8B` 给出极大似然参数分析。正如预期的那样，表中显示的结果也与 Probit 模型相似。\n\n`Output 6.8C` 显示了优势比估计表。尽管使用了不同的链接函数，但正如图\
  \ 6.4 所示，函数的形状非常相似。相比 Probit 模型，Logit 更优优，因为每个预测因素对响应变量的边际效应使用优势比更容易描述。在 Probit\
  \ 模型中，它通常在连续预测变量的均值或相对于分类预测变量的某个参考值处进行估计。由于二元选择模型的关系是非线性的，Probit 的边缘效应在不同预测值处是不相同的。对数优势是预测变量的线性模型；因此，对数优势的边缘效应在响应变量的每个值处都是静态的。可以通过对对数优势模型的参数估计取指数来提取优势比。\n\
  \n\n\n\n`Output 6.8D` 显示了 logit 效应图（Effect Plot）。效应图展示了两个预测变量（机构持股和员工人数对数）对长期盈利概率的交互作用。红点表示亏损的企业，蓝点表示盈利的企业。请注意，随着员工人数对数的增加，红点的数量增加；而随着机构持股比例的增加，红点的数量减少。\n\
  \n### 输出 6.8D：等高线效应图\n\n| ![image](img/Ch06_out_6-8d.jpg) |\n| --- |\n\n### 受试者工作特征\
  \ (ROC)\n\n`Output 6.8E` 显示了逻辑回归的受试者工作特征（ROC）曲线。ROC 曲线绘制了模型在不同截断点下的真阳率（敏感性）与假阳性率（1-特异性）。这是一种用于衡量二分类模型在不同分类阈值下区分能力的常用统计。例如，在较低的分类阈值下（让我们选择负收益概率为\
  \ 10%），由于区分能力较低，模型相对于真阳性不可避免地产生高假阳性分类率。随着分类阈值的提高，模型能够更好地区分真阳性和假阳性，直到达到某一点，之后模型开始因为假阴性分类数量的增加而导致区分能力下降。蓝线绘制了相对于随机分类器的真阳性与假阳性的比例，这由通过坐标\
  \ (0,0) 和 (1,1) 的 45 度线表示。\n\n使用 ROC 曲线评估模型准确性的另一种方法是计算 ROC 曲线下面积（AUROC）或常用的曲线下面积（AUC）。AUC\
  \ 是模型性能的综合衡量。它是 ROC 曲线在 0 到 1 范围内面积的积分。对角线的 AUC 为 0.5；因此，一个良好的模型 AUC 应该高于 0.5。AUC\
  \ 越高此阈值，模型的分类就越准确。由于我们的 logit 模型的 AUC 为 0.825，我们对其预测准确性很有信心。\n\n### 输出 6.8E：受试者工作特征\
  \ (ROC) 曲线\n\n| ![image](img/Ch06_out_6-8e.jpg) |\n| --- |\n\n### 判别分析\n\n线性判别分析\
  \ (LDA) 使用的分类方法与 probit 和 logit 模型的 MLE 优化略不同。在 LDA 框架下，目标是在给定响应变量观测分类的情况下，对解释变量的分布进行建模。这是通过导出特征变量的线性参数化来实现，以最大化每类值函数之间的距离。除了数据分类，LDA\
  \ 还用于降维；但我们将仅关注 LDA 的分类应用。\n\n事实证明实现 LDA 有多种方法。费舍尔判别分析（也称为第一阶段线性判别分析）搜索参数空间，使得类间方差相对于同类数据的方差最大化。\n\
  \n$\\\\arg\\\\max\\\\limits\\_{w}\\\\ D\\\\left( w \\\\right) = \\frac{w^{\\\\prime}S\\\
  _{B}w}{w^{\\\\prime}S\\_{W}w}$    (6.43)\n\n其中 `S[B]` 是类间方差，`S` 是类内方差，`w` 是变换矩阵，其特征值使得值函数\
  \ `D(·)` 最大化。高斯或正态判别分析是 Fisher LDA 的推广，它使用条件期望和贝叶斯规则将观测值分配到类别。由于实现判别的 SAS 过程 `PROC\
  \ DISCRIM` 采用后者方法，我们现在将关注正态判别分析。\n\n在正态判别分析方法中，假设特征变量在每类中均从多元正态分布；因此，它们只能以连续变量的形式存在。19\
  \ 让 `y[j]` 表示 J 个类别标签中的每个分类。将 `X`  = (`x[1]`,`x[2]`,...,`x[N]`) 表示为特征矩阵，其中 `x[i]`\
  \ 代表具有 M 维特征的 `X` 的第 `i`*th 行元素（样本）。为了简单起见，我们假设 `J`  = 2，使得 `y[1]` 和 `y[2]` 代表具有\
  \ M 维特征的两个类别。考虑值函数 `p(x[i]`, ↆ`y[j]` ↄ= `j`)，它衡量了 `x[i]` 属于类别 `j` 的概率。根据贝叶斯最优分类器，将\
  \ `x[i]` 分配到类别 `j` = 1 的判别分给出：\n\n`D[j]`  = `p(x[i]`, ↆ`y[j]` ↄ= `1)`  − `p(x[i]`,\
  \ ↆ`y[j]` ↄ= `0)`  > `T`   (6.44)\n\n| 贝叶斯最优分类规则是减少将 `x[i]` 分类错误的风险的常用方法。根据分类规则，如果\
  \ `x[i]` 属于该分类的概率大于 `x[i]` 属于不同分类的概率，则风险较低。两个概率之间的距离 `D[j]` 越大，分类错误的几率越低。 |\n| ---\
  \ |\n\n由于我们假设 `x[i]` 在 `y[1]` 和 `y[2]` 中均从多元正态分布，因此值函数 `p(x[i]`, ↆ`y[j]` ↄ= `1)`\
  \ 和 `p(x[i]`, ↆ`y[j]` ↄ= `0)` 的最优规格是多元正态密度函数。因此，我们可以用多元正态密度函数重写判别分的值函数如下。20\n\n\
  $\\\\begin{array}{l} {D\\_{j} = \\\\left\\\\lbrack \\\\left( {x_{i}} - u_{_{1}}\
  \ \\\\right)^{\\\\prime}\\\\Sigma_{_{11}} \\\\right\\\\{\\left( {x_{i}} - u_{_{0}}\
  \ \\\\right)^{\\\\prime}\\\\Sigma_{_{00}} \\\\right\\\\ + \\\\u_{left}} {u_{1}}\
  \ \\\\right\\\\right} \\\\\\\\ {~~~~~~~~~~+log}\\\\frac{p\\\\left( {y_{j} = 1} \\\
  \\right)}{p\\\\left( {y_{j} = 0} \\\\right)}} \\\\\\\\ \\\\end{array}$    (6.45)\n\
  \n*(注：源码中 6.45 提供的 LaTeX 已损坏；上述重构遵循标准 QDA 逻辑）。*\n\n等等，查看提供的 6.45 源码，非常混乱。我将在保持文本结构的同时格式化变量。\n\
  \n其中 `Σy][j]`  = `j` 是类内方差，`u[j]` 是类别 `y` = `j` 的观测值均值，那么 `D[j]` 可以写成形式：\n\n`D[j]`\
  \  = `w`^′`x[i]`  + `c`  > `T`    (6.46)\n\n*(其中 `w`  = `(u[1]`−`u[0])/Σ` 和 `c =\
  \ w^′(u[1]+u[0])+log(p(y=1)/p(0))`。)*\n\n通常使用 `T`  = 0 作为将观测值分配到默认类别的阈值。判别分 `D[j]`\
  \ 是通过特征变量的线性组合计算的，如下：\n\n`D[j]`  = `w`^′`x[i]`  + `c`  > 0    (6.47)\n\n因此，对于我们的双分类问题，如果\
  \ `w`^′`x[i]`  > `c` 且类别 `y[j]`  = 0，则将样本 `x[i]` 分配给类别 `y[j]` = 1。向量 `w` 现在可以被视为将\
  \ `x[i]` 投影到类别 `j` 的判别向量（即将 `x[i]` 的值拟合类别 `j`）。由于较高的 `D[j]` 减少了我们的误分类风险，正态判别分析框架下的优化问题是找到使\
  \ `D[j]` 值最大化的 `w`  = `f(u[1],u[0],∑)`。\n\n$\\\\arg\\\\max\\\\limits\\_{w}\\\\ D\\\
  \\left( w \\\\right) = w^{\\\\prime}x\\_{i} + c$    (6.48)\n\n\n\n\nLDA 也可以使用非参数方法进行估计。当无法从类均值找到判别信息时，非参数方法特别有用（例如类均值相等的情况，导致无法计算\
  \ `w = Σ[]^(−1)(u[y=1]-u[y=0])`）。在这种方法中，值函数是通过 `x[i]` 的核函数 `ϕ` 推导出的。这种方法被称为核 Fisher\
  \ 判别分析，它使用某些变换函数 `ϕ` 将 `x[i]` 的线性特征空间映射到非线性空间。21 该值函数类似于 Fisher LDA，写如下：\n\n$\\\
  arg\\max\\limits\\_{w}\\ D\\left( w \\right) = \\frac{w^{\\prime}S\\_{B}^{\\phi}w}{w^{\\\
  prime}S\\_{w}^{\\phi}w}$ (6.49)\n\n`SB` 和 `Sw` 分别是基于的类间方差和类内方差。\n\n核方法的数学构建相当严谨。然而，通用概念与所有的\
  \ LDA 方法相同。我们的目标是在给定类别先验知识的情况下，找到能够最好区分类别的判别向量 `w`。\n\n## 重新审视盈利能力\n\n现在我们已经建立了线性判别分析的理论基础，让我们将该方法应用于我们之前使用\
  \ probit 和 logit 模型探索过的分类问题上。在这里，我们使用判别分析来识别能够将公司分类为盈利和非盈利组的数值特征空间。在 SAS 中可以使用 `CANDISC`、`DISCRIM`\
  \ 和 `STEPDISC` 过程执行判别分析。`DISCRIM` 过程可以实现广泛判别分析方法（包括参数是非参数估计）。`PROC CANDISC` 执行标准判别分析,22，而\
  \ `PROC STEPDISC` 执行逐步判别分析。你应该注意，`CANDISC` 和 `DISCRIM` 过程都不进行变量选择。因此，模型规格说明中包含的所有潜在判别变量都将留在最终模型中，无论它们的判别能力如何。因此，使用\
  \ `STEPDISC` 过程作为 `CANDISC` 和 `DISCRIM` 过程的前奏更为高效。让我们重新审视在程序 6.8A 和 6.8B 中探索过的分类问题。判别分析只能分析数值特征变量，因此我们识别长期股票收益的解释变量将排除在\
  \ `PROC LOGISTIC` 和 `PROC PROBIT` 中使用的类别变量。\n\n## PROC STEPDISC\n\n程序 6.9A 显示了 `STEPDISC`\
  \ 过程的 SAS 代码，它使用迭代参数逐步 LDA（带有正向步选择）模型来选择最终特征变量集。程序 6.9B 显示了 `STEPDISC` 过程的 SAS 代码，而程序\
  \ 6.9C 显示了非参数方法。\n\n### 程序 6.9A：长期盈利能力的逐步判别分析\n\n```\n/* Using STEPDISC */\nproc\
  \ stepdisc data=spxprofit include=0\nclass pret5;\nvar logcap logemp\nrun;\n```\n\
  \n`STEPDISC` 过程使用迭代参数逐步 LDA（带有正向步选择）模型来选择最终特征变量集。程序 6.9B 显示了 `STEPDISC` 过程的 SAS\
  \ 代码，而程序 6.9C 显示了非参数方法。\n\n`STEPDISC` 过程使用迭代参数逐步 LDA（带有正向步选择）模型来选择最终特征变量集。`STEPDISC`\
  \ 过程在添加变量时使用了类内方差的同质性。你可以通过 `n` 指定变量的数量。\n\n### 输出 6.9A：逐步分析的选择\n\n![image](img/Ch06_out_6-9.jpg)\n\
  \n## PROCCRIM\n\n在程序 6.9B 中，使用 `DISCRIM` 过程估计最终模型。`DISCRIM` 语句比 `STEPDISC` 语句更多选项。这些包括包含数据集和实施标准分析的选项。`PRIOR`\
  \ 语句用于指定先验概率。\n\n### 程序 6.9B：参数线性判别分析\n\n```\n/* Using PROC DISCRIM (Parametric\
  \ Method) */\nproc discrim data=spxprofit method=normal crossvalidate\noutstat=dist\
  \ outd=score outcross=cvalid anova manova pool=yes canonical ncan=2;\nclass pret5;\n\
  var logcap logemp wacc;\npriors proportional;\nrun;\n```\n\n\n\n\n`Output 6.9B`\
  \ 显示了执行 `DISCRIM` 过程代码后获得的结果摘要。你会在 `PRET5` 表的线性判别函数中注意到，市值、机构持股比例和资本成本与盈利能力的关联性更强，而员工人数与亏损能力的性更大。输出中报告的混淆矩阵显示该参数模型具有相当可的分类准确率。你还会在重拟总结表（Resubstitution\
  \ Summary）中注意到，34.25% 的亏损企业被错误地归类为盈利企业，28.44% 的盈利企业被归类为亏损企业。在交叉验证总结表（Cross-validation\
  \ Summary）中也可以观察到类似的结论（假阴性率假阳性率分别为 34.25% 和 28.67%）。重拟总结表和交叉验证总结表的平均准确率也大致相同（分别为\
  \ 31.34% 和 31.36%）。真负性预测的平均后验概率为 73.96%（被正确分类为亏损的亏损企业），假阳性的平均后验概率为 65.47%（被错误分类为盈利的亏损企业）。假阴性的平均后验概率为\
  \ 62.47%（被错误分类为亏损的盈利企业），而真正性的平均后验概率（被正确分类为盈利的盈利企业）为 70.99%。这可能是由以下原因之一引起的：模型变量选择错误、判别函数错误或对数据分布的假设错误。\n\
  \n### 程序 6.9C: 长期盈利能力的非参数线性判别分析模型\n\n```sas\n/*使用 PROC DISCRIM (非参数方法) 估计长期股票收益的决定因素*/\n\
  proc discrim data=spx_profit method=npar kernel=normal r=.1 crossvalidate \n   \
  \   outstat=distat outd=discore outcross=cvalid posterr distance anova manova pool=yes;\n\
  \      class pret5;\n      var logmcap logemp Instshrout wacc;\n      priors  equal;\n\
  run;\n```\n\n在 `Program 6.9C` 中，我们展示了使用非参数方法实现判别分析的 SAS 代码。在 `PROC DISCRIM` 语句的选项中请求非参数方法时，你需要指定\
  \ `METHOD=NPAR` 和分布类型（`KERNEL=`）。我们选择了半径值为 1 的正态核。我们还将 `PRIORS`（先验概率）设置为 `PROPORTIONAL`（比例）。\n\
  \n注意 `Output 6.9C` 显示的结果，预测准确率现在相较于参数判别分析有了显著提高。重拟总结表显示亏损分类的准确率达到 100%，而交叉验证总结表的错误率约为\
  \ 20.52%。\n\n#### 输出 6.9C: 长期盈利能力的非参数线性判别因子\n\n##### 降维模型\n虽然因子分析和主成分分析也用于机器学习中的数据预处理，但这两种方法的源头都源于统计学理论。因此，我们将探索它们在统计模型下的概念框架和估计方法。\n\
  \n##### 因子分析\n在因子分析中，降维是通过探索一组潜在变量是否可能对一组相关变量观测到的变异性负责来实现的。从金融数据科学的角度来看，因子分析对于探索资产组合表现的驱动因素特别有用。事实上，因子投资法（涉及构建组合以捕获特定风险因素的报酬）植根于因子分析。这些风险因子通常分为三类：宏观经济因子、基本面因子和统计因子。事实上，三个最常用的定价模型可以视为因子模型。资本资产定价模型（`CAPM`）是一个基于宏观风险的单因子模型，其假设是资产收益与其系统性风险暴露（通过\
  \ `beta` 衡量）线性相关。套利定价理论（`APT`）是一个多因子模型，其观点是资产收益与一组宏观因子存在线性关系；而 Fama-French 因子模型结合了宏观和基本面因子，推导出关于系统性风险、公司规模和资产相对价值的三因子模型。尽管宏观和基本面因子模型依赖于观测因子，但统计因子本质是潜在的，只能通过主成分分析和因子分析等统计程序从资产收益中推断。\n\
  \n因子分析检查变量集的协方差结构。它将协方差分解为共同方差（共同因子）和独特方差（独特因子）。变量的观测值随后建模为共同因子和独特因子的函数。因子分析可以使用极大似然估计、主因子分析和主成分分析来实现。极大似然法更为常用，因此我们将在节中探讨该方法。\n\
  \n令 `R[t]` 为一个 `N x 1` 向量，代表时刻 `t` 的观测超额收益 `[R[1,t], R[2,t], ..., R[N,t]]^T`，协方差矩阵为\
  \ `cov(R[t]) = Σ[R]`。同样，令 `f[t]` 为 `K x 1` 的共同因子矩阵，`E(f[t]) = 0` 且 `cov(f[t]) =\
  \ Ω[f]`，`epsilon[t]` 为 `N x 1` 不观测误差项矩阵的当前值，`E(epsilon[t]) = 0` 且协方差为 `cov(epsilon[t])\
  \ = ψ[epsilon]`。那么 `R[t]` 关于 `f[t]` 和 `epsilon[t]` 的因子模型可以写为：\n\n`R[t] = α + βf[t]\
  \ + epsilon[t]`\n\n\n\n\n\n$L\\\\left( {\\\\alpha,\\\\Sigma\\_{R}} \\\\right) =\
  \ p\\\\left( R\\_{1},R\\_{2},....,R\\_{T} \\\\middle| \\\\alpha,\\\\Sigma\\_{x}\
  \ \\\\right) = {\\\\prod\\_{t = 1}^{T}{p\\\\left( R\\_{t} \\\\middle| \\\\alpha,\\\
  \\Sigma\\_{R} \\\\right)}}$ (6.54)\n\n对数似然函数为：\n\n$L\\_{n}\\\\left( {\\\\alpha,\\\
  \\Sigma\\_{R}} \\\\right) = - \\frac{TK}{2}\\\\log\\\\left( {2\\\\pi} \\\\right)\
  \ - \\frac{T}{2}\\\\log\\\\left( \\Sigma\\_{R} \\\\right) - \\frac{1}{2}{\\\\sum\\\
  \\limits\\_{t = 1}^{T}{\\\\left( {R\\_{t} - \\\\alpha} \\\\right)^{\\prime}\\\\\
  Sigma\\_{R}^{- 1}\\\\left( {R\\_{t} - \\\\alpha} \\\\right)}}$ (6.55)\n\n从上述公式中，我们现在知道因子分析是在协方差矩阵\
  \ `Σ`[`R`]`=`β`^′`β`+ `ψ`[`e]` 是公共因子和唯一因子之和的约束下，对 `α`、`β`、`ψ`[`ε`] 进行极大似然估计的结果。\n\
  \n$\\\\begin{array}{l} {\\\\left( {\\\\hat{\\\\alpha},{\\hat{\\\\Sigma}}\\_{R}}\
  \ \\\\right) = \\\\underset{\\\\alpha,\\\\Sigma\\_{R}}{\\arg\\\\max}L\\_{n}\\\\\
  left( {\\\\alpha,\\\\Sigma\\_{R}} \\\\right)} \\\\\\\\ {{~~~~~~~~~~~~~~~~~subject~to~}\\\
  \\Sigma\\_{R}\\\\text{=}\\\\beta\\\\beta^{\\\\prime} + \\\\psi_{\\varepsilon}} \\\
  \\\\\\ \\\\end{array}$ (6.56)\n\n如果我们对原始变量进行标准化，使得 $z_{j,t} = \\frac{R_{j,t} - \\\
  alpha_{j}}{\\sigma_{jj}}$，那么 `Σ` 将不再是一个协方差矩阵，而是一个相关矩阵，其对角线显示 `j`^(*t***)变量与其自身的相关性，写为\
  \ $s_{jj} = {\\\\sum\\\\limits\\\\_{k = 1}^{K}\\\\beta_{jk}^{2}} + \\\\psi_{jj}\
  \ = 1$。我们可以从这个表达式中推断出，`Σ` 对角线项等于变量与唯一因子（残差相关性）之间因子载荷（部分相关性）平方的和。因此，因子分析可以被视为对变量间相关性的估计，这些相关性源于公共方差以及变量的独有性。\n\
  \n## 因子提取与解释\n\n为了实现降维，必须确定从估计中提取有意义的因子的最佳数量。这可以通过主成分分析、公共因子分析或极大似然因子分析来实现。主成分分析法（我们稍后会讨论）按照因子对总体方差贡献递减的顺序来提取因子。如果我们假设不存在唯一方差且总方差等于公共方差，则主成分分析法是适用。因此，主成分分析根据协方差矩阵的特征值来选择因子。公共因子分析（也称为主因子分析）选择最能捕获数据公共方差的因子。极大似然因子分析（遵循前一节讨论的方法）通过变量的线性组合和估计的参数形成因子。参数估计的选择使得它们最可能导致观测到的相关矩阵。\n\
  \n## 因子旋转\n\n因子旋转用于解释因子载荷。记住，因子是原始变量的组合，同一个变量出现在多个因子中的情况很常见。这使得对潜在过程的解释更具挑战性。因子旋转简单地倾斜因子的轴，使得与因子边缘相关的变量最小化，相关性较大的变量最大化。这有助于简化因子矩阵的结构，从而确保对因子特征有清晰解释。因子旋转方法主要有两种：正交因子旋转（假设因子之间相互独立）和斜因子旋转（假设因子之间相关）。每种方法可以使用多种途径实现。然而，对这些方法的讨论超出了本书的范围。\n\
  \n| 因子分析是一种变量缩减技术，用于检查一组不可观测变量是否对一组相关的观测变量的变异负责。不可观测变量（因子）是通过方差分解技术从观测变量的线性组合得出的。方差分解技术将观测变量的协方差划分为公共方差（公共因子或共同性）和唯一因子。\
  \ |\n| --- |\n| 从分解的方差中提取因子及其 beta 值的三种方法是主因子分析、主成分分析和极大似然因子分析。提取出的公共因子是感兴趣的主要变量，然后使用旋转技术对其进行处理，以增强其可解释性，并减少因子在所检查的不可观测特征方面重叠的概率。正交旋转产生互不相关的独特因子，而斜因子旋转在可以获得更好解释性的情况下允许因子之间存在小程度的相关性。\
  \ |\n| --- |\n\n## 投资组合管理中的因子分析\n\n因子分析在投资领域的两个常见应用是投资组合因子分析（投资组合因子暴露的统计模型）以及因子模拟组合的构建（后者可以复制单个资产、基金或因子的属性，这些属性可以是宏观经济和基本面因子等观测变量，也可以是通过统计估计得出的不可观测因子）。\n\
  \n### 投资组合因子分析\n\n投资组合因子分析寻求使用统计模型理解组合表现的内在源。。因此，其目标适用于因子分析。因子分析与组合模型的关系如下：假设 `R`[`t]`[`R`[`1`,`t`],`R`[`2`,`t`],....`R`[`N`,`t`]](*T*)\
  \ 可以被指定为组合中 `N` 个可投资资产的超额收益，我们将其记为 `R`[`p`,`t`]`。此外，让我们将 `w`=`w*[1],*w*[2],....*w*[*N]]]`\
  \ 为 `R`[`p`,`t]` 中的组合配置向量，它对 `K` 个因子具有暴露。为了简单起见，我们假设 `K`=1。如果 `R`[`t]` 遵循 (6.50\
  \ 和 (6.51 的规范，那么我们的组合收益可以写为：\n\n$\\\\begin{array}{l} {R\\_{p,t} = w^{\\prime}\\\\\
  alpha + w^{\\prime}\\\\beta\\_{f}f_{t} + w^{\\prime}\\\\varepsilon\\_{t}} \\\\\\\
  \\ {R\\_{p,t} = \\\\alpha\\_{p} + {Beta^{\\\\prime}}\\_{f}f\\_{t} + \\\\varepsilon\\\
  _{t}} \\\\\\\\ {\\\\text{where~}\\\\alpha\\_{p} = w^{\\prime}\\\\alpha,\\\\ {Beta^{\\\
  \\prime}}\\_{f} = w^{\\prime}\\\\beta\\_{f},\\\\text{~and~}\\\\varepsilon\\_{t}\
  \ = w^{\\prime}\\\\varepsilon\\_{t}} \\\\\\\\ \\\\end{array}$ (6.57)\n\n注意，上述是我们的资产池（见\
  \ (6.51）超额收益的组合形式，也可以以均值超额收益形式写作 `R`[`p`,`t`]`(*d*))=(`R`[`p`,`t]`−`α`[`p`])。如果之前关于因子与误差项正交的假设仍然成立，且\
  \ `R`[`t]` 和 `R`[`t]`(*d*) 具有相同的协方差 `Σ`[`R]`，那么我们组合的协方差也可以写为：\n\n\n\n\n\n$\\begin{array}{l}\
  \ {Cov\\left( R_{p,t} \\right) = Cov\\left( {{Β^{\\prime}}_{f}f_{t}} \\right) +\
  \ Cov\\left( \\varepsilon_{p,t} \\right)} \\\\\\\\ {\\text{~~}w^{\\prime}\\sum_{R}w\\\
  \ = w^{\\prime}\\beta_{f}\\Omega_{f}w{\\beta^{\\prime}}_{f}\\text{~+w}\\prime\\\
  psi_{\\varepsilon}\\text{w~~~}} \\\\\\\\ {\\\\\\text{~~}w^{\\prime}\\sum_{R}w\\\
  \ = w^{\\prime}\\beta_{f}{\\beta^{\\prime}}_{f}w\\text{~+w}\\prime\\psi_{\\varepsilon}\\\
  text{w~~~~~~~~~}} \\\\\\\\ \\end{array}$ (6.58)\n\n你可以发现上述方程与方程 (6.52) 以及 (6.53)\
  \ 类似，不同在于我们考虑的是投资组合的协方差，而不是单个资产。记得我们之前已经假设在方程 (6.53) 中 `Ω`[`f]` = `I`[`k]`。这意味着我们的因子投资组合方差可以表示为：`w`^′∑[`R`]*w\
  \ = w′β**^′** +w′ψ[`ε`]w。通过在方程 (6.57) 和 6.58) 中求解 `Β`^′[`f]` = w^′β[`f]`，可以将投资组合的整体收益和风险与其对风险因子\
  \ `f`[`t`]的暴露口联系起来。因子分析法可以用于推导出唯一的共同因子载荷（系数）和因子实现值 `f`[`t]`。因子也可以使用正交矩阵 `H`（其中 `H``H`^′\
  \ = `I`）进行旋转，使其产生最具可解释性且唯一的因子和因子载荷，如下所示。\n\n$\\begin{array}{l} {R_{t} = \\alpha\
  \ + \\beta_{f}HH^{\\prime}f_{t} + \\varepsilon_{t}} \\\\\\\\ {\\text{~~~~} = \\\
  alpha + \\beta_{f}^{*}f_{t}^{*} + \\varepsilon_{t}} \\\\\\\\ \\end{array}$ (6.59)\n\
  \n其中 `β`^(*) = `β``H` 且 `f`[`t`]`(*) = H^′`f`[`t]`\n\n### 因子模仿投资组合\n\n因子模仿投资组合是一种可交易资产的金融工程投资组合，旨在获得非交易因子的风险溢价。该金融工程投资组合的设计与非交易因子具有强相关性，使得非交易因子的变化可以通过模仿投资组合的收益来跟踪。因子模仿投资组合也被用于学术研究以测试各种定价理论。著名的法玛-弗兰奇因子模型基于因子模仿理论的应用。高减低（HML）投资组合的构建旨在通过买入市值最高的五位组股票（价值股）并卖空市值最低的五位组股票（增长股）来获取所谓的价值溢价。相反，小涨大（SMB）投资组合的构建旨在通过买入市值最低的五位组股票（小盘股）并卖空市值最高的五位组股票组合（大盘股）来获取所谓的规模溢价。除了\
  \ HML 和 SMB，还引入了其他因子；包括动量、波动率、现金流以及最近的气候因子。\n\n因子分析法是推导出唯一的共同因子载荷（系数）和因子实现值 `f`[`t]`的方法之一。因子也可以使用正交矩阵\
  \ `H`（其中 `H``H`^′ = `I`）进行旋转，使其产生最具可解释性且唯一的因子和因子载荷，如下所示。\n\n$\\begin{array}{l} {R_{t}\
  \ = \\alpha + \\beta_{f}HH^{\\prime}f_{t} + \\varepsilon_{t}} \\\\\\\\ {\\text{~~~~}\
  \ = \\alpha + \\beta_{f}^{*}f_{t}^{*} + \\varepsilon_{t}} \\\\\\\\ \\end{array}$\
  \ (6.59)\n\n其中 `β`^(*) = `β``H` 且 `f`[`t`]`(*) = H^′`f`[`t]`\n\n### 因子模仿投资组合\n\n\
  因子模仿投资组合是一种可交易资产的金融工程投资组合，旨在获得非交易因子的风险溢价。该金融工程投资组合的设计与非交易因子具有强相关性，使得非交易因子的变化可以通过模仿投资组合的收益来跟踪。因子模仿投资组合也被用于学术研究以测试各种定价理论。著名的法玛-弗兰奇因子模型基于因子模仿理论的应用。高减低（HML）投资组合的构建旨在通过买入市值最高的五位组股票（价值股）并卖空市值最低的五位组股票（增长股）来获取所谓的价值溢价。相反，小涨大（SMB）投资组合的构建旨在通过买入市值最低的五位组股票（小盘股）并卖空市值最高的五位组股票组合（大盘股）来获取所谓的规模溢价。除了\
  \ HML 和 SMB，还引入了其他因子；包括动量、波动率、现金流以及最近的气候因子。\n\n因子分析法是用于推导出唯一的共同因子载荷（系数）和因子实现值 `f`[`t]`的方法之一。因子也可以使用正交矩阵\
  \ `H`（其中 `H``H`^′ = `I`）进行旋转，使其产生最具可解释性且唯一的因子和因子载荷，如下所示。\n\n$\\begin{array}{l} {R_{t}\
  \ = \\alpha + \\beta_{f}HH^{\\prime}f_{t} + \\varepsilon_{t}} \\\\\\\\ {\\text{~~~~}\
  \ = \\alpha + \\beta_{f}^{*}f_{t}^{*} + \\varepsilon_{t}} \\\\\\\\ \\end{array}$\
  \ (6.59)\n\n其中 `β`^(*) = `β``H` 且 `f`[`t`]`(*) = H^′`f`[`t]`\n\n\n\n\n\n上一节中强调的三类因子分析可以使用\
  \ SAS 中的 `PROC FACTOR` 来实现。`PROC FACTOR` 的输入数据可以是原始数据形式，也可以是相关系数矩阵或协方差矩阵形式。该存储过程会生成两类输出数据集。`OUT`\
  \ 语句创建一个包含原始数据和因子分数的输出数据集，而 `OUTSTAT` 语句则创建一个包含一组估计统计量的数据集。这包括公因子性、特征值、相关性和评分系数等。该存储过程还会生成一系列图表，包括初始和旋转后的因子模式，以及碎石图（Scree\
  \ plot）和路径图。\n\n# 银行业股票收益的最大似然因子分析\n\n`BANK` 数据集包含目前纳入标普 500 指数的 15 家美国银行的月度股票收益率。该数据集包含了摩根大大通（`JP\
  \ Morgan Chase`）和花旗集团（`Citi Group`）等华尔街主要银行的月度收益率，以及 `Zions` 和 `Fifth-Third Bank`\
  \ 等区域银行。让我们尝试使用 `PROC FACTOR` 对一组潜在统计因子进行建模，以解释这些股票随时间变化的共同变异。程序 6.10 显示了用于对这 15\
  \ 个股票收益率进行统计因子分析的 SAS 代码。在此必须反复强调的是，我们将使用的数据集仅包含 15 只股票的月度收益率，不包含其他信息。因此，我们本次练习的目的是探索通过简单观察这五年内股票价格变化的统计模式，模型是否能够识别出底层公司的共同点。\n\
  \n## PROC FACTOR\n\n`METHOD=ML` 选项用于请求最大似然因子分析。可以将 `ML` 更改为 `PRINCIPAL` 或 `P` 以请求主成分分析，或更改为\
  \ `PRIN` 以请求迭代主因子分析。`SCORE` 选项用于请求模型的评分系数或因子系数（factor betas）。`NFACTORS=4` 选项用于指定选择因子数量的标准。虽然\
  \ `Varimax`（正交）旋转方法更为常用，但我们将选择 `Oblimin`（斜交）旋转方法来简化因子结果的解释。我们将使用的 `Oblimin` 方法是\
  \ `Quartimin` 旋转方法。`PLOTS=ALL` 触发随附 ODS 图表（碎石图、方差解释比例、因子模式和路径图）的绘制。`OUT=FACTFACTORS`\
  \ 和 `OUTSTAT=FACTSTATS` 用于请求因子和估计统计量。`PATHDIAGRAM` 语句用于指定路径图的数值格式和图形布局。`FUZZ=0.3`\
  \ 选项指定了显示变量与因子之间对应关系的最小因子加载估计值（默认值为 3）。`ARRANGE=GRIP` 选项指定了路径图中变量布局的算法。`SCALE=0.85`\
  \ 指定了节点相对于设计维的放大（大于 1）或缩小（小于 1）。\n\n### 程序 6.10：银行股票收益的最大似然因子分析\n\n```\n/*使用 PROC\
