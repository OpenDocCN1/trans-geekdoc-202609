  \n\n\n\n从概念上说，Copula（连接函数）将边缘 CDF 分布 `u`[1] 与联合分布 `G` 连接。Copula 依赖于边缘分布的两个有趣性质。第一个是如公式\
  \ (5.9)所示，随机变量的边缘分布（`F`1,...,`F`d](x[d]))是均匀分布的。这意味着无论变量的底层分布如何，随机变量的 CDF（累积分布函数）都服从均匀分布。因此，即使两个或多个随机变量不具有相同的底层分布，我们也可以在\
  \ CDF 级别分析它们之间的关系。Copula 是随机变量 CDF 的均匀分布值之函数的联合 CDF。第二个性质指出，我们可以通过对均匀随机变量的值应用相关的逆\
  \ CDF 函数或分位数函数，从而根据其底层分布提取随机变量的值，如公式 (5.10)所示。总而言之，这两个性质共同构成了 Copula 技术的理论框架。\n\n\
  你可以通过将该分布的逆 CDF 应用于 CDF 的均匀分布值，将一个随机变量 CDF 的均匀分布值转换为任何其他分布。Copula 函数利用相关结构将两个或多个随机变量的边缘分布连接起来，创建一个均匀边缘分布的联合多元分布。它们各自的边缘分布可以通过应用均匀边缘分布的相关逆\
  \ CDF 来重新构建。使用相同的过程，我们可以通过首先从 Copula 连接的均匀边缘联合多元分布中模拟值，然后通过应用逆 CDF 将值转换为相关分布，从而从联合多元分布中模拟值。\n\
  \nCopula 函数主要分为两大类：椭圆 Copula（elliptical copulas），如高斯 Copula 和 Student’s-t（也称为 Student\
  \ Copula），以及阿基米德 Copula（Archimedean copulas），如 Clayton、Gumbel 和 Frank Copula。椭圆\
  \ Copula 是径对称的，因为它们是椭圆边缘分布（如正态分布和 Student’s-t 分布）的 Copula，尽管 Student Copula 的尾部比高斯\
  \ Copula 更厚。阿基米德 Copula 是一种灵活的 Copula 函数形式，能够模拟广泛的依赖关系。某些阿基米德 Copula（如 Frank Copula）是对称的，而其他（如\
  \ Clayton 和 Gumbel）则是非对称的。在 Clayton Copula 中，分布的负尾依赖性多于正尾部，而在 Gumbel Copula 中，分布的正尾依赖性多于负尾部。\n\
  \nSAS 中的 `COPULA` 过程可用于拟合上述列出的所有椭圆和阿基米德 Copula。该过程还可以用于从它们的联合多元分布中模拟数据，并分析变量之间的依赖关系。`PROC\
  \ MODEL` 也可以用于对多元数据拟合 copula。然而，它的功能没有 `PROC COPULA` 那么稳健。因此，我们将使用 `COPULA` 过程进行稍后要进行的估计。\n\
  \nCopula 的文献非常广泛，对于数据科学领域的初学者来说，这个概念在技术上是具有挑战性的。为了简洁起见，本书中将只关注 Student Copula。Student\
  \ Copula 可以写为：8\n\n`Cθ= tν,Σ,...,t[v,n]¹(u[n])`\n\n其中 `t[ν,Σ]` 是具有相关矩阵 `Σ` 和 `ν`\
  \ 自由度的多元 Student’s t 分布。尾部依赖系数 `λL` 和 `λu` 可以写为：\n\n`λL=λu=2ν+1(√(1-ρ)/(1+ρ))`\n\
  \n其中 `ρ` 是两个随机变量之间的相关系数。均匀边缘分布的秩相关性（rank correlation）可以写为：\n\n`ρτ[ui,uj]=arcsin(ρ)/`\n\
  \n### Copula 在金融中的应用\n\nCopula 在金融领域有广泛的应用。包括投资组合管理、证券定价、信用风险和操作风险。让我们探索基于 copula\
  \ 的模拟用于投资组合管理。具体来说，我们将为五只股票（美国通、美国银行、花旗、高盛和摩根大通）的等权组合构建一个 copula。然后我们将使用 copula\
  \ 分析它们之间的依赖关系，并使用模拟收益来估计组合风险（Value-at-Risk）。\n\n要开始，让我们通过调用 `DATAPULL` 宏从书的 GitHub\
  \ 网站下载 `FINPORT.SAS7BDAT` 数据集。在运行程序 5.8 之前，确认数据集已下载到 `WORK` 库。该程序通过调用 `FIT` 语句对五只股票的月收益拟合\
  \ copula。SAS 不估计像 Student copula 这样的椭圆 copula 的参数。相反，代码实现的数值输出是自由度参数以及 Pearson 和\
  \ Kendall 相关矩阵。`PLOTS` 选项用于请求原始数据以及均匀分布形式数据的边缘分布的二元相关性和尾部依赖图。\n\n#### 程序 5.8：使用\
  \ Copula 从 Student’s-t 分布模拟收益\n\n```\n/* 从 Student-T Copula 估计和模拟收益 */\n%datapull(finport,finport.sas7dat);\n\
  \nproc copula data = finport;\n   var raxp rbac rc rjpm;\n\n   /* 对月收益拟合 T-copula\
  \ */\n   fit T /\n      marginals = empirical\n      method    = MLE\n      /*图形（Chi\
  \ - 尾部依赖图）*/\n      plots (chi) = (datatype = both);\n\n   /*模拟 10000 次观测值 */\n\
  \   simulate /\n      ndraws = 10000\n      seed  = 4321\n      out   = simulR\n\
  \      plots(chi) = (datatype = original);\nrun;\n```\n\n#### 输出 5.8：Student’s-T\
  \ Copulas 的参数估计\n\n| ![image](img/Ch05_out_5-8.jpg) |\n\n\n\n\n从输出中可以看出，`Bank of\
  \ America`、`Citigroup`、`Goldman Sachs` 和 `JP Morgan` 股票收益之间的皮尔逊相关性和肯德相关性高于 `American\
  \ Express` 的收益。前一组中的所有银行都具有显著的交易和投资银行敞口，而 `American Express` 则主要聚焦于消费和商业银行。图 4.5\
  \ 显示了这五家银行原始及转换后股票收益的散点图。转换后的收益是每只股票收益的均匀分布边缘。与其他四家金融公司的收益相比，`RAXP` 的转换后收益分布更为分散。`RBAC`、`RC`、`RGS`\
  \ 和 `RJPM` 的转换后收益图表显示出它们的边缘分布之间存在更强的关系。\n\n图 5.1：相关性和尾部依赖图\n\n![image](img/Ch05_fig_5-1.jpg)\n\
  \n尾部依赖图显示，原始数据和转换后数据在分布中心和右尾的依赖性均高于左尾。这意味着在正常和良好时期，它们的股票收益比在糟糕时期更有可能共同波动。\n\n###\
  \ 投资组合构建与风险价值（VaR）\n\n让我们使用程序 5.9 构建 `SIMULR` 数据集中五只股票的等权重投资组合的收益。由于每只股票的原始收益均为对数形式，我们还应该将其转换为简单收益，以便与投资组合收益进行比较。为了得出投资组合以及各银行股票收益的\
  \ 99%、95% 和 90% 风险价值（`VaR`），我们使用了 `TABULATE` 过程。99%、95% 和 90% VaR 分别是变量模拟值的第 1、第\
  \ 5 和第 10 分位数。五家银行及其股票等权重投资组合的 99% VaR 量级接近。`Citigroup` 和 `Bank of America` 具有较高的\
  \ 95% 和 90% VaR。与其业务模式一致，`American Express` 的 95% 和 90% VaR 在五只股票中最低。它也低于投资组合的 `VaR`。9\n\
  \n程序 5.9：使用 Copula 构建投资组合与风险价值\n\n```sas\n/*用于构建投资组合和估算 VaR 的 SAS 代码*/\ndata Port_ret(drop=i);\n\
  \      set simulR;\n      array sret{5} raxp rbac rc rgs rjpm;\n\n      /*计算等权重投资组合收益*/\n\
  \      PortR=0;\n\n      do i=1 to 5;\n             PortR=PortR+0.2*(exp(sret[i])-1);\n\
  \      end;\n\n      /*将对数收益转换为简单收益*/\n      rnaxp=exp(raxp)-1;\n      rnbac=exp(rbac)-1;\n\
  \      rnc=exp(rc)-1;\n      rngs=exp(rgs)-1;\n      rnjpm=exp(rjpm)-1;\n      label\
  \ rnaxp ='American Express' rnbac ='Bank of America'\n              rnc = 'Citi\
  \ Group' rngs ='Goldman Sachs' rnjpm='JPMorgan Chase' PortR= 'Equally-Weighted Portfolio';\n\
  run;\n\ntitle 'Value at Risk for Portfolio of Financial Stocks';\n\nproc tabulate\
  \ data=Port_Ret;\n      var rnaxp rnbac rnc rngs rnjpm PortR;\n      table (rnaxp\
  \ rnbac rnc rngs rnjpm PortR), (p1 p5 p10)*{format=percent8.2};\n             keylabel\
  \ p1='99% VaR' p5='95% VaR' p10='90% VaR';\nrun;\n\ntitle;\n```\n\n输出 5.9：金融股票投资组合的风险价值（VaR）\n\
  \n| ![image](img/Ch05_out_5-9.jpg) |\n\n### 重采样技术\n\n在本节中，我们将研究另一种用于描述性统计和推断性统计生成数据的方法。与依赖理论分布来生成人工数据的模拟方法不同，在重采样中，我们依赖于数据的经验分布来生成人工数据。\n\
  \n\n\n\n\n# 高级自助举法\n\n实现参数化和非参数化自助举法的快速方法是使用许多支持自助举法的 SAS 过程。这些过程中大部分名称都带有 `SURVEY`\
  \ 前缀，例如 `SURVEYREG`、`SURVEYLOGISTICS`、`SURVEYMEANS` 和 `SURVEYIMPUTE` 等。11\n\n##\
  \ 自助举法在金融中的应用\n\n金融数据科学家会发现自助技术有助于处理各种对总体分布不熟悉的分析和统计任务。这些包括资产收益自助、投资组合优化、风险管理和期权定价。在将自助举法应用于金融市场数据之前，需要注意的一个重要问题是如前面的章节所示，资产收益往往表现出自相关性。然而，为了从自助分布得出推断，我们需要假设样本分布是由独立同分布（i.i.d）收益构建的。因此，在将其应用于金融数据之前，需要对基础自助技术进行一些调整。自助技术的一种常见调整类型是使用数据块（blocks）进行采样，而不是基于观测值级别。\n\
  \n块自助举法（Block bootstrapping）将主样本分为 `n` 个数据块。这 `n` 个块可以是不重叠块、移动块或平稳块。每个块代表来自主样本的有限数量的数据。对于不重叠块和移动块，每个块内的观测数量是固定的；而对于平稳块，观测数量则不是。\n\
  \n## 股票收益的自助举法\n\n让我们使用 `PROC SURVEYSELECT` 执行一个简单的自助示例。我们首先使用 `%DATAPULL` 宏从书籍的\
  \ GitHub 仓库中提取一个样本数据集（`SPX_RET`）。12 `SPX_RET` 数据集包含 1992 年到 2022 年标普 500 指数的月收益率。在继续下一步之前，请检查您的\
  \ `WORK` 库以确认数据集已下载。\n\n程序 5.10 显示了用于简单自助示例中调用 `PROC SURVEYSELECT` 语句的 SAS 代码。所使用的采样方法如\
  \ `SRS` 语句所示的简单随机采样。共抽取了 1,000 个样本，每个样本包含 12 个观测值。使用 `PROC MEANS` 语句计算每个样本的均值。从一千个样本中获得的计算均值的分布是均值的采样分布。`ODS\
  \ EXCLUDE ALL` 语句抑制所有输出的打印，而 `ODS EXCLUDE NONE` 则重新激活打印选项。第二个 `PROC MEANS` 语句用于计算样本均值的均值，这是我们对未知总体均值的最佳估计。还使用\
  \ `SGPLOT` 过程对样本均值的分布进行了绘图。\n\n程序 5.10：使用 PROC SURVEY SELECT 进行简单自助自助\n\n```\n/*Simple\
  \ Bootstrapping using SURVEY SELECT*/\n%datapull(spx_ret,spx_ret.sas7bdat);\n\n\
  proc surveyselect data=spx_ret out=bootsamp1\n      method=urs sampsize=12 reps=1000\
  \ seed=12345;\nrun; \nods exclude all;/*Suppress printing of listing outputs*/\n\
  \nproc means data=bootsamp1 mean std;\n      by replicate;\n      var mret;\n  \
  \    ods output summary=bootstats1;\nrun;\n\nods exclude none; /*Reactivates print\
  \ of listing outputs*/\n\nproc means data=bootstats1 mean stderr;\n      var mret_Mean;\n\
  run;\n\nproc sgplot data=bootstats1;\n      inset \"Basic Bootstrapping (URS)\"\
  /title=\"Distribution of the Sample Means of \n      Bootstrapped S&P 500 Index\
  \ Monthly Returns \" position=top \n      textattrs=(family=\"Times New Roman\"\
  \ color=darkblue size=12 ) valuealign=center \n      titleattrs=(family=\"Times\
  \ New Roman\" color=darkblue size=12 weight=bold)\n      labelalign=center;\n  \
  \    histogram mret_mean/ nbins=20 dataskin=matte fill transparency=0.8\n      fillattrs=(color=blue\
  \ );\n      density mret_mean/legendlabel= \"(Normal Density Plot for Sample Means)\"\
  ;\n      yaxis values=(0 to 25 by 5);\nrun;\n```\n\n输出 5.10：标普 500 指数月收益率样本均值的自助分布\n\
  \n| ![image](img/Ch05_out_5-10.jpg) |\n\n输出 5.10 显示了实现我们简单自助代码获得的结果。\n\n\n\n\n\n\
  ```\n/*Using SAS 进行分块自助*/\ndata aspx_ret;\n    set spx_ret;\n      block =ceil(_n_/12);\n\
  run;\n\nproc surveyselect data=aspx_ret out=bootsamp2\n      method=urs sampsize=1\
  \ reps=1000 seed=12345;\n      cluster block;\nrun;\n\nproc print data=bootsamp2\
  \ (obs=13);\nrun;\n\nods exclude all;\n\nproc means data=bootsamp2 mean std;\n \
  \     by replicate;\n      var mret;\n      ods output summary=bootstats2;\nrun;\n\
  \nods exclude none;\n\nproc means data=bootstats2 mean stderr;\n      var mret_Mean;\n\
  run;\n```\n\n### 输出 5.11A：S&P 500 指数收益时间序列的分块自助值\n\n| ![image](img/Ch05_out5.11a.jpg)![image](img/Ch05_out5.11a_-_Copy.jpg)![image](img/Ch05_out5-2.jpg)\
  \ |\n\n在程序 5.11B 中，我们展示了使用 `IML` 过程实现每月指数收益分块自助的 SAS 代码。宏变量 `&SS` 和 `&NRP` 分别指定了样本大小和重复次数。具有\
  \ 372 个观测值的数据首先被重塑为 12 比 32（行 x 列）的矩阵。现在，矩阵的每一行都可以使用 `SAMPLE` 语句作为一个块进行采样。由于我们选择了相同的随机种子，我们可以从程序输出中看到被选中的块也是第\
  \ 19 块。`IML` 方法得到的均值和标准误差与通过 `SURVEYSELECT` 方法获得的结果相同。事实上，从两种方法获得的均值抽分布是相同的，如 `IML`\
  \ 过程的输出所示。\n\n### 程序 5.11B：使用 IML 进行分块自助\n\n```\n/*Using IML 进行分块自助*/\n%let ss =\
  \ 12; /*样本大小*/\n%let nrp =1000; /*重复次数*/\n\nproc iml;\n      call randseed(12345);\n\
  \      use aspx_ret;/*与 SURVEY SELECT 相同的数据*/\n      read all var {'Date' 'Price'\
  \ 'mret' 'Block'};\n      close;\n      n=nrow(mret);\n      ss=&ss;\n      m=n/ss;\n\
  \      ys=shape(mret,m,ss);\n      sid = sample(1:nrow(ys), &nrp);\n      yb=sid'||ys[sid,];/*包含\
  \ sid 以显示样本 ID*/\n      ybc=ys[sid,];\n      smean=(mean(ybc'))';/*计算每个样本的均值*/\n\
  \      ssd =((std(smean)))/sqrt(&nrp);/*计算每个样本的标准差*/\n      bsmean=mean(smean);\
  \ /*均值的平均计算*/\n      create bootsamp3 from yb;\n      append from yb;\n      close\
  \ bootsamp;\n      create bootstats3 from smean;\n      append from smean;\n   \
  \   close bootstats3;\n      print (\"Block Bootstrapping Using PROC IML\");\n \
  \     colnames = \"obs1\":\"obs12\";\n      print (yb[1:2,1])[label='Block ID']\
  \  (yb[1:2, 2:13])[format=percent8.2 colname=colnames]; /*打印前 13 个观测值*/\n      print\
  \ (\"Descriptive Statistics\");\n      print (bsmean)[label='Mean'] (ssd) [label='Std\
  \ Error']; /*样本均值的标准误差*/\nquit;\n\nproc sgplot data=bootstats3;\n      inset \"\
  Block Bootstrapping (RS)\"/title Distribution of the Sample Means of\n      Bootstrappped\
  \ S&P 500 Index Returns \" position=top \n      textattrs=(family=\"Times Roman\"\
  \ color=darkblue size=12 ) value=center \n      titleattrs=(family=\"Times Roman\"\
  \ color=darkblue size=12 weight=bold) \n      label=center;\n      histogram col1/nbins220\
  \ dataskin=matte transparency=0.8 \n      fillattrs=(color=blue);/*Using IML 进行分块自助*/\n\
  \      density col1/ legend=\"(Normal Density for Sample Means)\";\n      yaxis=(0\
  \ to 25 by 5);\n      xaxis label='Mean';\nrun;\n```\n\n### 输出 5.11B：使用自助法 S&P 500\
  \ 每月收益样本均值的分布\n\n| ![image](img/Ch05_out5-11b.jpg)![image](img/11b.jpg) |\n\n同样，请注意分块自助值的抽样分布与基础自助显著不同，因为分块自助允许块内相关性以及块间的独立性。跨块获取的样本均值变异性较高，是因为我们将重复的样本大小设置为一个块，以便比较\
  \ `SURVEYSELECT` 和 `IML` 过程的输出。如果我们我们将块样本的样本量增加到多于一个，我们将获得如图 5.3 所示的预期的钟形分布。\n\n\
  现在我们已经熟悉了自助法的工作原理，让我们来探索自助的一些实际应用。\n\n\n\n\n\n| 行权价 | `XP` | 3844.16 |\n| :--- |\
  \ :--- | :--- |\n| 无风险利率 | `rf` | 4.34% |\n| 当前价格 | `price` | 3844.16 |\n| 波动率 |\
  \ `vol` | 19.03% |\n| 到期时间 (N/362.25) | `time` | 0.08761 |\n\n## 在 SAS 中的期权估值\n\n\
  得知 SAS 用户不需要手动实现上述期权估值公式是一件令人欣慰的事，因为 SAS 内置了实现 Black-Scholes 公式的函数。`BLKSHCLPRC`\
  \ 函数用于计算欧式看涨期权的理论价格，而 `BLKSHPTPRC` 函数用于计算股票欧式看跌期权的价格。对于每个函数，我们需要根据 [公式 (5.14)] 所示的\
  \ Black-Scholes 模型提供五个输入值。这些分别是行权价、到期时间（以年为单位）、当前股票价格、年化无风险利率以及资产的年化波动率。\n\n让我们从一个示例开始，使用\
  \ SAS 中的 Black-Scholes 期权估值函数计算本今年 12 月 30 日标普 500 指数平值（ATM）看涨和看跌期权的理论值。如果期权的内在价值为零，则期权价格被视为平值（换标的证券的市场价格与行权价相同）。我们假设两份期权将于明年\
  \ 1 月 31 日到期（剩余 32 天到期）。估值所需的其他输入值，如行权价、股价、无风险利率和指数波动率，如[表 5.2]所示。\n\n### 程序 5:12：使用\
  \ SAS 期权估值函数为指数期权定价\n\n```\n/*SAS Program to Calculate Black-Scholes Options Prices*/\n\
  data optionv;\n    XP         = 3844.16;\n    rf         = 0.04339;\n    price \
  \     = 3844.16;\n    vol        = 0.19031;\n    time       = 0.087611225;\n   \
  \ c=BLKSHCLPRC(xp,time,price,rf,vol);\n    p=BLKSHPTPRC(xp,time,price,rf,vol);\n\
  \    label \n        XP  ='Exercise Price'\n        rf  ='Risk free rate'\n    \
  \    price  ='Current Price'\n        vol  ='Volatility'\n        time  ='Time'\n\
  \        c='Call Price'\n        p='Put Price';\n    format rf percent.2 vol percent.2\
  \ time best.2 c dollar.2 p dollar.2;\nrun;\n\n/*SAS Program to Calculate Black-Scholes\
  \ Options*/\nproc print data=optionv noobs label;\n    title 'Valuing S&P 500 Index\
  \ Options';\n    var XP rf price vol;\n    var c p /style(fontweight=bold background=light);\n\
  run;\ntitle;\n```\n\n程序 5.12 显示了计算 12 月 30 日指数期权理论值的 SAS 代码。该代码使用 `DATA` 步骤首先存储所有相关变量，这些变量在[表\
  \ 5.2]中所示。然后使用 SAS 内置的期权估值函数计算该指数中看涨和看跌期权的价格。接下来，使用 `PRINT` 过程在输出窗口中显示输入值和出的期权价格。\n\
  \n### 输出 5.12：使用期权估值函数为指数期权定价\n\n![image](img/Ch05_4.jpg)\n\n输出 5.12 显示了运行代码获得的结果。最后两列报告了指数看涨和看跌期权的计算理论值。你会发现，尽管两者的行权价和到期日相同，但计算出的看涨期权价格高于看跌期权价格。这是由于平价关系（无套利）条件导致的。事实证明，通过将看涨（看跌）期权与股票的空头（多头）部位结合，并在合同到期时间内按无风险利率投资（借入）行权价的现值，可以创建一个合成看跌（看涨）期权，正如公式\
  \ (5.15) 中的表达式所示。\n\n$$\n\\begin{array}{l}\nP = C - S_{t} + Xe^{- r(T - t)} \\\\\
  \nC = P + S_{t} - Xe^{- r(T - t)}\n\\end{array}\n$$\n(5.15)\n\n你应该考虑修改程序 5.12，以验证公式\
  \ (5.15) 所示的平价公式对于该指数的看涨和看跌期权合约确实有效。\n\n现在我们对期权定价的方法有了一些理解，让我们应用自助抽样技术来处理 BSM 模型的一个问题。需要注意的是，模型中的波动率输入在定价时是不可观测的，必须从数据中估计。使用历史数据进行估计是很常见的（如上一个示例），但这种方法容易产生估计误差。为了防止这个问题，我们可以构建样本期内股票价格的自助分布，并使用该自助分布的波动率估计值作为我们真实总体波动率的代理。\n\
  \n程序 5.13 显示了估计标普 500 指数收益率波动率分布的 SAS 代码。为了更准确地捕捉资本市场的当前状况，窗口大小从 12 个月减少到 6 个月，样本量减为\
  \ 3。我们使用 `SURVEYSELECT` 过程对历史收益率数据进行 1000 次自助抽样。\n\n### 程序 5.13：股票价格波动性的自助抽样\n\n\
  ```\n/*Bootstrapping Prices*/\ndata csp_ret;\n    set sp_ret(where>'31');\n    block=ceil(_);\n\
  \nproc surveyselect data=csp_ret out=amps n=1000 seed=5 block=6;\nrun;\n\nproc means\
  \ data=amps;\n    by replicate;\n    var mret;\n    output summary=bootstats keep=price_mean\
  \ price_std;\nrun;\n\ndata optionvalue;\n    set bootstats;\n    by replicate;\n\
  \    Sigma = mstd*sqrt(12);\n    cBLKSHCLPRC(xp,time,price,rf,vol);\n    p=BLKSHPTPRC(xp,time,price,rf,vol);\n\
  run;\n\ntitle 'Equity Options on the S&P 500';\nproc tabulate data=optionvalue;\n\
  \    var Sigma CallP PutP;\n    table (Sigma*percent.2, CallP*dollar.2 PutP*dollar.2),\
  \ keylabel='SE';\nrun;\n\nproc sgplot data=optionvalue;\n    inset \"Block Bootstrapped\
  \ Stock Return Volatility Distribution of One Month S&P 500 Index Prices\" position=top\
  \ \n    textattrs=(family=\"Times Roman\" color=darkblue size=12 ) valuealign=center\
  \ \n    titleattrs=(family=\"Times Roman\" color=darkblue size=12 weight=bold)\n\
  \    labelalign=center;\n    histogram CallP/ nbins=20 dataskin=matte fill transparency=0.8\
  \ fillattrs=(color=blue );\n    histogram PutP/ nbins=20 dataskin=matte fill transparency=0.8\
  \ fillattrs=(color=depk);\n    density CallP/ legendlabel=\"(Normal Density Plot\
  \ for Call Prices)\";\n    density PutP/ legendlabel=\"(Normal Density Plot for\
  \ Put Prices)\";\n    yaxis values=(0 to 35 by 5) ;\n    xaxis label='Option Prices'\
  \ valuesformat=dollar8.2;\nsgquit;\n```\n\n\n\nATM（平值）看涨和看跌期权的采样分布是在随后的 `DATA` 步骤中使用期权定价函数计算的。与程序\
  \ 5.12 中的代码不同（其中我们将期权定价函数的输入存储在同一个数据集中），在这里我们使用了宏变量，因为我们将为每个期权生成 1,000 个价格值。计算出期权价格后，使用\
  \ `TABULATE` 过程计算来自采样分布的期权价格平均值。最后，使用 `SGPLOT` 过程通过直方图描两种期权价格的采样分布。\n\n输出 5.13 显示了使用区块自助法得到的期权价格平均值。从我们的采样分布中获得的看涨和看跌期权平均价格分别为\
  \ `$90.94` 和 `$76.35`，这略低于使用固定定价输入计算出的平均价格。你还会注意到，我们的自助法定价模型中，波动率输入的平均值也低于固定输入模型的值。较低的波动率值是我们在从自助模型中获得的期权价格低于固定输入模型价格的原因之一。\n\
  \n#### 输出 5.13：使用自助波动率进行期权定价\n\n| ![image](img/Ch05_out_5-13.jpg) |\n| --- |\n\n\
