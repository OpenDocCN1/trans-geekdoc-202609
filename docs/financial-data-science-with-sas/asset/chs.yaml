  \ i. 直方图是否意味着策略性多元化（非等权权重组合）比朴素多元化（等权权重组合）具有优势？\n\n***\n\n# 第 6 章：金融预测性分析\n\n##\
  \ 预测建模\n\n在第一章中，我们将预测性分析描述为使用数据和各种高级统计方法来预测未来事件、行为和趋势的过程。虽然关于预测性分析的文献非常多，但介绍其应用的并不多。在本章中，我们将探索这些预测方法中的一些，但主要关注它们在金融领域中的应用。1\
  \ 正如前一章强调的，本章介绍的许多主题都是基于成熟的计量经济和统计理论。你可能会遇到更多的数学构造和符号。对数学统计学不太精通的读者应关注通用概念（这些概念大部分位于每个主题的末尾），并在学习过程中参考配套的\
  \ SAS 程序。\n\n金融数据科学家使用预测模型来测试理论、预测某些变量的未来实现，并预测响应变量随协变量或解释变量实现的变化而产生的结果。通常来说，预测模型分为两大类。第一类预测模型是基于推断统计和/或计量经济建模的。统计模型和计量经济模型旨在证明或反驳关于现实世界现象的理论抽象。\n\
  \n\n\n\n第二类预测模型是基于机器学习方法的方法。在这里，目标不是测试理论，而是发现隐藏在从现实世界现象获得的数据中的关系、趋势和模式。机器学习利用高级计算、统计编程和大数据的力量来实现这些目标。正如第一章中所强调的那样，预测分析已经发展到涵盖了广泛的统计算法、数据建模技术以及人工智能应用（如机器学习和深度学习）。回到资产定价模型，值得注意的是，许多用于资产定价的统计模型是基于对某些风险因子与预期收益之间的协方差进行建模的。这种方法的挑战在于，随着风险因素数量的增加，或当风险因素与预期收益动态之间的关系是非线性时，定价错误的程度会随之增加。[2]](#CH06.xhtml#footnote-035)\
  \ 由于机器学习不受理论束缚，它最能够捕捉金融资产收益与其风险因素之间可能存在的隐藏关系。\n\n除了资产收益外，机器学习还用于金融服务业，以优化运营活动。这些包括交易自动化（如交易、承保和投资组合构建）、风险管理（投资组合、信贷、流动性和操作风险）、客户管理（获取、留存和交叉销售）、监管合规与执法等。我们将在第七章中探索两类使用机器学习方法的分析模型。\n\
  \n## 统计模型与机器学习模型\n\n尽管机器学习植根于统计学、数学和计算机编程，但在实践中，机器学习建模是一个与统计建模不同的独立领域。表 6.1 总结了统计方法和机器学习方法在预测建模方面的相似与不同之处。\n\
  \n## 估计方法\n\n无论我们使用哪种预测建模方法，熟悉统计模型和计算算法实际上如何揭示数据中的关系或生成预测都是重要的。在这种背景下，模型可以是参数化的，也可以是非参数化的。参数化模型使用一组假设（概率分布和底层随机过程）来定义预测变量与响应（目标）变量之间的关系。利用这些假设，通过某种估计方法启发式地推导出最符合某些标准的参数。对于统计建模和计量经济学建模，三种常用的估计方法是：最小二乘法（LS）、极大似然估计法（MLE）和矩估计法（MM）。\n\
  \n| 表 6.1：统计学习与机器学习的比较 |\n\n| --- |\n| 特性 || 建模方法 |\n|  || 统计 || 机器学习 |\n| 建模目标\
  \ || 证实性 || 发现 |\n| 数据要求 || 小到中等 || 大 |\n| 特征建模 || 加性 || 加性、非加性 |\n| 参数规模 || 小到中等\
  \ || 大 |\n| 数据分割 || 样本内和样本外 || 训练、验证和测试 |\n| 模型构建 || 样本内 || 训练数据 |\n| 模型评估数据 ||\
  \ 样本内 || 验证数据 |\n| 准确性 || 置信区间 || 拟合统计量 |\n| 推断演绎 || P 值 || 预测准确率 |\n\n然而，非参数模型不需要对底层现象的概率分布做出特定假设。相反，它们依赖于对数据拟合特定的密度函数，或直接从数据计算后验概率。拟合的模型或计算出的后验概率用于导出感兴趣参数的估计值。\n\
  \n你应该注意，参数估计可以使用参数模型和非参数模型得出。两者之间的主要区别在于是否需要假设特定的概率分布并定义连接预测变量与响应变量的特定映射函数，在使用参数化估计法时，这两者都是必须的。非参数模型没有这些限制；因此，它们的参数规范通常不是固定的。非参数模型中的规模（参数数量）完全可能随着数据规模而增长。此外，统计方法和机器学习方法都使用了参数化非参数化的估计方法。\n\
  \n## 参数化估计法\n\n参数模型通常具有一组有限的参数；因此，模型结果往往比非参数模型具有更高的解释性。它们也比非参数模型更容易实现，所需的计算资源更少。然而，它们的灵活性相对低于非参数模型。由于参数化估计法要求我们在估计模型之前假设概率分布，因此存在可能误设数据分布的风险。三种常见参数化估计方法（最小二乘模型、极大似然估计和矩估计法）的概念框架将在后续章节中描述。\n\
  \n图 6.1：估计方法\n\n![image](img/Ch06_fig_6-1.jpg)\n\n### 最小二乘\n\n最小二乘模型（LS）使用一种估计过程，寻找能够使残差平方和（即响应变量预测值与观测值之间差的平方）最小的参数空间。令\
  \ `Y` 代表响应变量向量，`X` 代表协变量矩阵，`β` 代表参数向量，使得 `Y` 的第 `i` 个元素可以表示为 `y[i] = x[i]β + ε[i]`。我们可以将回归残差写如下：\n\
  \n```\nε[i] = y[i] - x[i]β̂      (6.1)\n```\n\n`ε[i]` 是观测值 `i` 的残差，`x[i]` 是 `X`\
  \ 的第 `i` 行。残差平方和（SSE）通过以下方程从回归中计算：\n\n```\nSSE(β̂) = ∑_{i=1}^{N} (y_i - x_iβ̂)²\
  \      (6.2)\n```\n\n参数 `β` 的最小二乘估计量就是使函数达到最小的 `β̂`：\n\n```\nβ̂_LS = argmin_{β̂}\
  \ [SSE(β̂)]      (6.3)\n```\n\n注意 `SSE(β̂)` 是 `β̂` 的二次函数。因此，以 `SSE(β̂)` 为 Y 变量、`β̂`\
  \ 为 X 变量的图表将是一个 U 型曲线。`SSE(β̂)` 函数在其极值点的偏导数（关于 `β̂`）斜率为零。通过在极值点求解偏导函数得到 `β̂`，即可得到产生最小二乘误差的参数空间值。\n\
  \n\n\n\n\n如果我们通过 `Y` 和 `X` 变量的散点图拟合回归线，那么最小乘估计量就是使散点围绕回归线的离散程度最小的那一个。散点围绕线的离散程度越低，`SSE`\
  \ 就越小，因此参数对所考虑模型的拟合程度越好。\n\n图 6.2 显示了金融服务部门每月超额收益相对于市场风险溢价的散点图。散图中还显示了拟合的回归线及其 95%\
  \ 置信区间和预测区间。请注意，从观测值离线的离散程度最低来看，线的位置似乎是最优的。\n\n最小二乘模型有多种。这些模型中最常用的是普通最小二乘（`OLS`），也常称为简单回归或多元回归。`OLS`\
  \ 模型的主要假设包括响应变量与回归变量之间的线性关系、残差与回归变量之间的独立性（正交性）、方差齐（同方差性）以及无多重共线性。3 统计和机器学习模型如线性回归、非线性回归以及最小绝对收缩选择算子（`LASSO`）都使用了最小二乘法。最小二乘模型在实现上直观且简单，对于简单的预测建模问题已经足够。它们并不适用于复杂问题、分类问题或截删数据的建模。\n\
  \n图 6.2：股票收益的回归线拟合\n\n![image](img/Ch06_fig_6-2.jpg)\n\n### 最大似然估计\n\n用于估计模型参数的最大似然估计（`MLE`）方法是在搜索参数空间，使得观测数据来自假设概率分布的似然概率最大。`MLE`\
  \ 的另一种描述方式是，该方法搜索参数空间的点估计，使得观测数据最可能拟合为其指定的概率分布。\n\n从数学构造的角度来看，`MLE` 呈现如下。令 `Y` 代表独立同分布序列的响应变量向量。同样令\
  \ `f(Y,X)` = `f(Y, X; ϕ)` 表示在真实参数向量 `ϕ` 处 (`Y`,`X`) 观测值的概率密度函数，其中 `X` 是协变量矩阵。`f(Y,X;ϕ)`\
  \ 也称为 (`Y`,`X`) 的似然，以及 (`Y`,`X*) 的似然函数。`ϕ` 的 `ML` 估计是使 (`Y`,`X*) 的观测值似然函数最大的参数空间。如果我们假设参数向量\
  \ `θ` 和 `ω` 是 `ϕ` 的子集，使得 `ϕ  = (θ,ω)`，我们可以将随机变量序列 (`Y`,`X`) 的联合密度 `f(Y, X; ϕ)` 写为条件密度\
  \ `f(Y|X;ϕ)` 和边缘密度 `f(X;ω)` 的乘积。4\n\n`f(Y, X; ϕ̂) = f(Y|X; θ̂) ��⋅ f(X; ω̂)`   (6.4)\n\
  \n其中 `ϕ̂`、`θ̂` 和 `ω̂` 是参数向量 `ϕ` 及其子集 `θ` 和 `ω` 的估计值。如果假设 `θ` 和 `ω` 不是相关函数，则方程 (6.4)\
  \ 中的密度函数（似然函数）可以用 `Y` 的元素写为：\n\n${\\\\prod\\\\limits\\_{i = 1}^{n}{f\\\\left( {y_{i},x_{i};\\\
  \\hat{\\phi}} \\\\right)}} = {\\\\prod\\\\limits\\_{i = 1}^{n}{f\\\\left( {y_{i}|x_{i};\\\
  \\hat{\\theta}} \\\\right)}} \\\\cdot {\\\\prod\\\\limits\\_{i = 1}^{n}{f\\\\left(\
  \ {x_{i};\\\\hat{\\omega}} \\\\right)}}$   (6.5)\n\n如果我们忽略第二项，5，`MLE` 的优化过程将只涉及在\
  \ `θ` 的定义域内搜索，因为 `Y` 被假设是固定的。因此，我们可以将密度函数重写为 `θ` 的似然函数如下。\n\n$L_{n}(\\theta) = {\\\
  \\prod\\\\limits\\_{i = 1}^{n}{L\\\\left( \\theta \\\\middle| y_{i} \\\\right)}}\
  \ = {\\\\prod\\\\limits\\_{i = 1}^{n}{f\\\\left( y_{i} \\\\middle| x_{i};\\\\theta\
  \ \\\\right)}}$   (6.6)\n\n`MLE` 的目标随后可以用 `β` 描述，即搜索使似然函数最大的参数空间 `β̂`，使得：\n\n${\\\
  hat{\\theta}}_{MLE} = \\underset{\\hat{\\theta}}{\\text{argmax}}L\\left( \\theta\
  \ \\middle| Y \\right)}$   (6.7)\n\n由于每个观测值的概率密度函数（`PDF`）值较小，似然函数通常被转换为对数形式以便于计算，同时保留函数的单调性。通过使用对数变换，似然变为\
  \ PDF 的相加和。方程 (6.7) 的对数形式可以写为：\n\n$\\\\ln(\\theta) = \\log L_{n}(\\theta) = {\\\\\
  sum\\\\limits\\_{i = 1}^{n}{\\log L\\\\left( \\theta \\\\middle| y_{i} \\\\right)}}\
  \ = {\\\\sum\\\\limits\\_{i = 1}^{n}{\\log f\\\\left( {y_{i};\\\\theta} \\\\right)}}$\
  \   (6.8)\n\n为了找到最大似然值，以与最小二乘相同的方法得到似然函数对 `θ` 的导数。虽然 `MLE` 的规范意味着实现通常通过搜索使负对数似然最小的参数空间来。\n\
  \n${\\hat{\\theta}}_{MLE} = \\underset{\\hat{\\theta}}{\\text{argmin}}L\\left( \\\
  theta \\middle| Y \\right)}$   (6.9)\n\n负对数似然在极值处的偏导数（也称为得分函数）其斜率为零。求解得分函数 `θ`(`Y`*)\
  \ 即可得到 `θ` 的值。\n\n尽管 `MLE` 的数学构造看起来很复杂，但该方法背后的直觉相对简单。给定随机变量 `Y` 的泛函数 `y[i]` = `x[i]*β` + `ε[i]`，`MLE`\
  \ 为变量指定密度函数 `f(y[i]|x[i];θ)`，然后搜索参数空间 `θ̂` 的值，使得数据最拟拟该分布。\n\n### 矩估计法\n\n与使用随机变量分布假设来估计模型参数的\
  \ `MLE` 不同，矩估计法（`MM`）使用对数据生成过程的一组矩的假设。`MM` 随后估计模型或数据生成过程的参数，使模型的样本矩与指定的（理论）矩最匹配。\n\
  \n\n\n\n\n在 `MM` 下最常用的矩假设是基于正交条件的，该条件规定一组总体矩均等于 0。为了进一步解释 `MM` 的工作原理，请考虑等式 (6.1)中指定的最小二乘残差。在普通最小二乘法\
  \ (OLS) 假设下，总体残差的正交条件是：残差的均值为 0，且残差的每个观测值与回归变量 `x[i]` 不相关，如下所示。\n\n`E(ε) = 0,ↆE(x[i],ε) = 0,ↆi = 1,ↆ...,ↆn`\
  \ (6.12)\n\n我们将等式 (6.12)中的矩表达式推广为一组总体矩条件 `E[G(x[i],β)] = 0`，其中 `β` 是参数空间。相应的样本矩可以写为：\n\
  \n$g_{n}\\left( \\hat{\\beta} \\right) = \\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{g\\\
  left( {x_{i},\\hat{\\beta}} \\right)}}$ (6.13) \n\n因此，总体矩的矩估计量 `β` 只是求解样本矩方程组 `gn = 0`\
  \ 的参数空间 `β̂`。从代数角度来看，为了使解可行，矩条件的数量 `q` 必须等于参数空间 `β̂` 中参数的数量 `p`。这被称为识别识别的阶数条件。\n\
  \n我们将等式 (6.12)中的第二个 OLS 正交条件替换为等式 (6.1)中的表达式。得到的表达式现在为：\n\n`E(x[i],ε) = E(x[i],y[i]-x[i]β) = Ex[i] = 0`\
  \ (6.14)\n\n随后样本矩条件可以写为：\n\n$\\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{x_{i}\\varepsilon_{i}\
  \ =}}=\\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{x_{i}\\left( {y_{i} - x_{i}\\hat{\\\
  beta}} \\right) = 0}}$ (6.15)\n\nMM 估计量 `β` 是求解该方程组的 `β̂`，它等同于等式 (6.3)所示的 OLS 估计量。实际上，OLS\
  \ 估计量是矩估计量的一个特例。\n\n如第三章所示，金融数据中的残差项正交条件往往会被违反，导致 `E(x[i],ε) ≠ 0`。在这种情况下，我们可以通过将\
  \ `x[i]` 替换为工具变量 `z[i]` 来绕过该问题，该工具变量与 `x[i]` 相关，但与残差项正交。总体矩条件可以写成如下形式：\n\n`E(z[i],ε[i]) = Ez[i] = 0`\
  \ (6.16)\n\n样本矩条件与等式 (6.16)中的表达式类似，所示如下：\n\n$\\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{z_{i}\\\
  varepsilon_{i} =}}=\\frac{1}{n}{\\sum\\limits_{i = 1}^{n}{z_{i}\\left( {y_{i} -\
  \ x_{i}\\hat{\\beta}} \\right) = 0}}$ (6.17)\n\n记住我们的初始总体矩条件定义为 `E[G(x[i],β)]`。因此，相应的样本矩条件可以定义为\
  \ `g(x[i],β̂) = g(β̂)`。 \n\n$g(\\hat{\\beta}) = \\frac{1}{n}{\\sum\\limits_{i =\
  \ 1}^{n}{z_{i}\\left( {y_{i} - x_{i}\\hat{\\beta}} \\right) = 0}}$ (18)\n\n上述估计方法被称为工具变量回归，它也是矩估计法的一个特例。矩估计法还有许多其他特例。事实上，我们可以通过将得分函数\
  \ `L[n]'(β|Y)` 设为零，来证明极大似然估计（`MLE`） 也是 MM 估计量的一个特例。\n\n$\\frac{1}{n}{\\sum\\limits_{i\
  \ = 1}^{n}{L_{n}^{'}\\left( \\beta \\middle| Y \\right)\\}_{i}} =0$ (19)\n\n###\
  \ 广义矩估计 (GMM)\n\n在代数上，当正交条件的数量 `p` 少于参数数量时，推导矩条件的解是不可行的。当 `q` 大于 `p` 时，存在过度识别问题。通过指定一个对称且正定的权重矩阵\
  \ `W[n]`，可以绕过识别问题。GMM 估计量被定义为尽可能使 `Qn` 接近于 0 的 `θ` 值。`Qn = 0` (20)\n\n对于 GMM 的优化问题可以写为：\n\
  \n$\\hat{\\theta} = \\underset{\\hat{\\theta}}{\\text{argmin}}Q_{n}\\left( \\theta\
  \ \\right)$ (21)\n\n### 使用 PROC MODEL 进行参数估计方法的比较\n\n`PROC MODEL` 是 SAS 中的一个核心估计过程。它能够估计并分析各种类型的模型规格，包括线性是非线性模型。它还可以用于模拟数据并从模型规格中生成预测。在我们的示例中，我们将使用\
  \ `PROC MODEL` 来估计。如等式 (6.22)所示，指数模型对超额收益 `ER[it]` 与市场超额收益 `MRP[t]` 进行回归。\n\n`ER[it] = α[[i]]+β[t]+ε[it]`\
  \ (22)\n\n在程序 6.1 中，我们展示了用于估计金融服务部门 beta 的 SAS 程序。默认情况下，`PROC MODEL` 尝试使用 OLS 方法拟合方程。通过指定额外的\
  \ `FIT` 语句，我们可以请求 `MLE` 和 `GMM` 方法。\n\n程序 6.1：使用 PROC MODEL 拟合股票指数模型\n\n```sas\n\
  /* 用于不同参数估计方法的 SAS 代码 */\n%datapull(industr,industr.sas7bdat);\n\nproc model data=industr;\n\
  \   finance = constant +beta*mrp;\n   fit finance / ols; /*OLS*/\n   fit finance\
  \ / fiml; /*MLE*/\n   fit finance / gmm;/*GMM*/\nrun;\n```\n\n输出显示，所有方法的参数估计值是相同的。然而，由于计算标准差的方法不同，它们的标准差以及相应的检验统计量略有不同。\n\
  \n\n\n\n\n在非参数估计法下，我们不假设数据符合任何特定的分布。相反，数据的分布属性和参数估计（或模型特征）是直接通过某种估计器从数据本身推导出来的。通常情况下，我们会通过指定损失函数为估计过程提供一些指导，以了解非参数模型对给定数据集的拟合程度。考虑损失函数的一种方式是，它是对数据拟合不佳的惩罚。因此，类似于参数模型中的优化过程，非参数模型的优化过程通常也寻求最小化这些损失函数。还可以对模型复杂度施加额外的惩罚以防止过拟合。因此，损失函数的优化问题可以泛化为：\n\
  \n$\\underset{f}{\\text{argmin}}\\frac{1}{N}{\\sum\\limits\\_{i = 1}^{n}{L\\left(\
  \ {f\\left( x\\_{i} \\right),y\\_{i}} \\right)}} + R\\left( f \\right)$ (6.23)\n\
  \n其中 `L` 是特征变量函数 `f(x[i])` 到目标结果 `y[i]` 的映射，R(f)` 是模型复杂度的惩罚函数。对于需要估计参数空间的模型，我们可以将上述表达式用参数向量\
  \ `β` 重写如下：\n\n$\\underset{\\beta}{\\text{argmin}}\\frac{1}{N}{\\sum\\limits\\_{i\
  \ = 1}^{n}{L\\left( {f\\_{\\beta}\\left( x\\_{i} \\right),y\\_{i}} \\right)}} +\
  \ R\\left( \\beta \\right)$ (6.24)\n\n虽然损失函数有很多类型，但总来说，它们分为以下三类：回归损失函数、分类损失函数和基于分布的损失函数。回归损失函数包括平均绝对误差（MAE）、均方误差（MSE),[7]\
  \ 以及 Huber 损失（HL）等。分类损失函数包括二分类损失（零一损失）、感知器损失、交叉熵、get 损失（hinge loss）和对数损失等。基于分布或密度（熵）的损失函数包括二交叉熵、加权交叉熵和平衡交叉熵等。\n\
  \n最简单的非参数估计器是直方图，它通过获取分箱数据集的相对频率来构建变量的概率密度。从预测建模的角度来看，更常见的是使用允许更灵活的分箱方式（带宽或平滑参数）的密度估计器，这正是核密度估计器提供的。除了密度估计器，另一种非参数估计方法是使用从数据获取参数空间值的后验概率来估计模型参数。[8]\
  \ 这是因为只要获取参数空间的先验概率不为零，根据 Doob 定理，从数据获得的参数空间后验概率分布将收敛于其真实值。这是一个相当严谨的概念，但总体思路如下。\n\
  \n| 如果我们预先设定参数空间解释数据的概率，当我们遇到更多数据时，可以检查它有多符合先验信念并相应地更新我们的信念。获取的数据越多，我们越能完善自己的信念和参数空间。在审查了足够的数据后，我们将得到一个校准良好的参数空间，以及对其与数据拟合程度的信念。\
  \ |\n\n尽管非参数模型可以帮助我们避免为数据指定错误概率分布的风险，但它们也带来了挑战。非参数模型比参数模型需要更多的观测值。由于通常对参数数量没有限制，它们比参数模型具有更高的模型过拟合风险。参数数量的增加也可能使得模型的可解释性比参数模型更具挑战性。\n\
  \n## 核密度估计\n\n核密度估计器（KDE）是预测建模中最常用的非参数估计方法。与具有固定宽度不重叠箱的直方图不同，KDE 通过在数据分布上应用可调箱大小（平滑带宽）的移动窗口来生成数据的概率分布。概率分布通过在数据的每个观测值处拟合密度函数（核）获得。因此，由核密度生成的概率分布是平滑函数，这与直方图得到的条形分布不同。考虑核密度估计的一种方式是将其看作在每个观测处绘制的较小样本的移动直方图。然后将直方图连续的峰值连接起来，创建一个分布图。核密度估计的一般框架如下：给定一组\
  \ `N` 维随机变量 `{x[1],x[2],...,x[n]}`，对于值序列 `x ∈ R` 的概率密度 `phat(x)` 可以通过固定宽核密度估计器 `K`\
  \ 和固定带宽参数 `h` 如下获得：\n\n$\\hat{p}\\left( x \\right) = \\frac{1}{Nh}{\\sum\\limits\\\
  _{i = 1}^{N}{K\\left( \\frac{X\\_{i} - x}{h} \\right)}}$ (6.25)\n\n核函数衡量了 `x` 与\
  \ `X[i]` 的接近程度，取决于它是否在指定的带宽 `{x-h;x+h}` 内，如果在，则距离 `x` 有多近。从上述可以看出，带宽对于核密度的形状至关重要。带宽越大，核密度越平滑。然而，极大的带宽可能会导致数据过度平滑，使得数据的显著特征丢失。极小的带宽可能导致数据平滑不足，从而增加过拟合风险。选择最佳带宽的一种方法是计算均方平方误差（MISE）并选择使其值最小的带宽。\n\
  \n核函数有多种类型。它们包括高斯（正态）核、矩形（均匀）核和 Epanechnikov 核等。当调用 `KERNEL` 语句时，`PROC UNIVATE`\
  \ 使用的默认核函数是高斯核函数，其形式如下。[9]\n\n$K(x) = \\frac{1}{\\sqrt{2\\pi}}\\exp\\left( \\frac{x^{2}}{2}\
  \ \\right)$ (6.26)\n\n### 在 SAS 中估计核密度\n\n在 SAS 中估计核密度有两种方法。通过 `PROC UNIVATE`，你可以通过调用\
  \ `HISTOGRAM` 语句并指定 `KERNEL` 选项请求估计单变量核密度。通过 `PROC KDE`，你可以同时估计单变量和双变量核密度。`程序 6.2`\
  \ 显示了使用 `PROC UNIVATE` 和 `HISTOGRAM` 语句估计金融服务部门月收益核密度的 SAS 代码。\n\n程序 6.2：使用 PROC\
  \ UNIVATE 估计股票收益的核密度\n\n```sas\n/* 使用 PROC UNIVARIATE 估计核密度 */\ntitle 'Distribution\
  \ of Financial Services Industry Returns';\n\nproc univariate data=industr noprint;\n\
  \    histogram finance/ \n        kernel(c = 0.5 1 2 \n        noprint  \n     \
  \   k=normal);\nrun;\nodstitle = title;\n```\n\n\n\n\n调用 `KERNEL` 语句是为了请求绘制三种带宽（0.5、1\
  \ 和 2）的核密度图，结果如输出 6.2 所示。‘C’语句用于指定带宽。请注意所选带宽如何影响核密度的形状。所选带宽的值越小，密度曲线对直方图的拟合程度越紧密。在图中显示的三个带宽选择中，1.0\
  \ 似乎对数据的拟合效果最好。\n\n### 输出 6.2：股票收益的核密度图\n\n| ![image](img/Ch06_out_6-2.jpg) |\n\
  | --- |\n\n在程序 6.3 中，显示了用于绘制金融板块和股票市场月收益率多元核密度图的 SAS 代码。在这个示例中，我们使用了 `KDE` 过程。`UNIVAR`\
  \ 语句用于请求两个变量的单变量核密度，而 `BIVAR` 语句用于请求两个变量的二元核密度。`BWM` 是带宽乘数，用于指定核密度的带宽。`PLOTS=DENSITYOVERLAY`\
  \ 语句用于请求它们各自单变量核密度的叠加图，而第二个 `PLOTS=ALL` 语句用于请求 SAS 中提供的各种类型二元核密度图。它们包括二元核密度的等高线图、直方图和表面图。\n\
  \n### 程序 6.3：使用 PROC KDE 估计股票收益的单变量和二元核密度\n\n```\n/*Estimating Univariate Bivariate\
  \ Kernel Densities Using PROC KDE*/\ntitle 'Distribution of Financial Services Industry\
  \ and Market Returns';\nods graphics on;\n\nproc kde data=industr;\n    univar finance(bwm=1)\
  \ mrp(bwm=1) /plots=densityoverlay;\n    bivar finance mrp/ plots=all;\nrun;\n```\n\
  \n输出 6.3：股票收益的单变量和二元核密度图\n\n| ![image](img/Ch06_out_6-3.jpg) |\n| --- |\n\n输出 6.3\
  \ 显示了调用该过程获得的结果。第一张图是金融服务业超额收益和市场风险溢价的叠加单变量密度图。第二张图是两个变量二元核密度的等高线图，而第三和第四张图是这两个变量的二元表面图和直方图。总体而言，这些图显示了一个相互相关且向金融变量左尾偏态的联合分布。\n\
  \n## 核回归\n\n既然我们已经建立了 KDE 的概念框架，让我们通过提出响应变量 `Y` 相对于其预测变量 `X` 的条件期望，将该方法推广到预测建模问题上：\n\
  \n`m(X) = E(Y|X)` (6.27)\n\n其中 `m(•)` 是预测变量的未知非线性函数。我们可以按照非参数回归的形式编写上述内容。\n\n`y[i]\
  \ = m(x[i]) + ε[i]` (6.28)\n\n其中 `E(ε[i]) = 0` 且 `Var(ε[i]) = σ²`。`m` 是预测变量的平滑函数。根据我们对\
  \ `x[i]` 的了解，预测每个 `y[i]` 的方法之一仅使用靠近它的观测值来估计 `x[i]` 每个实现值处的核。然后以 `mhat(x)` 形式表示的\
  \ `y[i]` 的最佳估计是点 `x[i]` 附近 `y[i]` 的加权平均值，权重取决于 `x[i]` 的值和带宽 `h`。在实际上，权重计算为 `x` 中每个点\
  \ `x[i]` 和 `y[i]` 的联合密度之比，并根据 `x[i]` 的边缘密度进行调整。该比值被称为 Nadaraya-Watson 核回归估计量，其表达式为：\n\
  \n$\\hat{m}\\left( x \\right) = {\\sum\\limits\\_{i = 1}^{n}\\underset{\\equiv w_{i}}{\\\
  frac{K\\left( \\frac{X_{i} - x}{h} \\right)}{\\sum\\limits\\_{i = 1}^{N}{K_{h}\\\
  left( \\frac{X_{i} - x}{h} \\right)}}}}}y_{i} = {\\sum\\limits\\_{i = 1}^{n}w_{i}}\
  \ \\cdot y_{i}$ (6.29)\n\n其中 `w[i]` 是分配给所有落在 `{x−h;x+h}` 区间内的 `x[i]` 观测值的 `y[i]`\
  \ 的权重。\n\n### K 近邻方法\n\n虽然 6.29 中所示核使用了固定带宽，但我们可以放宽限制允许对 `k` 个最近点进行平均处理。这种方法被称为\
  \ `KNN` 方法。\n\n### 局部估计回归平滑 (LOESS)\n\n调整 `y[i]` 估计中距离的方法之一是根据每个邻居到点 `x[i]` 的距离对其平均贡献进行加权。\n\
  \n## 在 SAS 中实现核回归\n\nSAS 目前没有直接估计核回归的内置过程。但是，你可以使用 SAS/IML 模块加权回归来实现核回归。或者，可以使用\
  \ `LOESS` 过程来估计局部回归模型并拟合 `m(x[i])` 的线性和多项式函数形式。\n\n### 程序 6.4：使用 PROC LOESS 拟合股票收益指数模型\n\
  \n```\n/*Using PROC LOESS to Fit the Index Model*/\nods graphics on;\n%datapull(industr,industr.sas7dat);\n\
  %datapull(finscore,finscore.sas7dat);\n\nproc loess data=industr plots=all;\n  \
  \  model finance=mrp/ all details degree=1 smooth=0.1;\n    score data=finscore\
  \ /clm print(var=finance);\nrun;\n```\n\n\n\n\n`Program 6.4` 显示了用于估计指数模型 LOESS 回归的\
  \ SAS 代码。虽然在这里没有使用，但可以调用 `DIRECT` 语句来请求在所有点进行局部回归。多项式的默认阶数为 1。你可以通过设置 `DEGREE=2`\
  \ 来请求二次多项式。`SMOOTH=0.1` 指定平滑参数的值，默认值为 0.5。我们选择 0.1 是为了突出过拟合函数的示例。平滑值设为 1 将导致拟合图与\
  \ OLS 回归线相似。指定 `SCORE` 语句是为了请求对 `FINSCORE` 数据集进行评分。\n\n### 输出 6.4：使用 `PROC LOESS`\
  \ 的股票收益指数模型\n\n| ![image](img/Ch06_out_6-4.jpg)![image](img/Ch06_out_6-41.jpg) |\n\
  | --- |\n\n`Output 6.4` 显示了执行 `Program 6.4` 得到的结果和图表。拟合摘要表（Fit Summary）显示了平滑参数的值和一些相关统计量。它显示拟合方法为带有线性混合方法的\
  \ `KD tree`。`KD tree` 中有 65 个拟合点，局部邻居组中有 10 个点。模型中的等效参数数量约为 20。你会在观测值预测图（Observed\
  \ by Predicted Plot）上注意到，预测值围绕实际值的离程度比线性回归模型小得多。评分（Score Plot）显示了 `FINSCORE` 数据集中留出行业收益的预测值和置信区间。\n\
  \n### 广义最大熵\n\n广义最大熵（GME）估计方法基于这样一个原理：为了在关于数据分布的可用信息施加的某些限制下确定随机变量的真实分布，我们应该应用熵最大的分布。理解熵的概念对于金融数据科学家至关重要，因为它是数据科学领域常用的优化准则之一。\n\
  \n熵是变量的随机程度，通常由其概率分布定义。从预测建模的角度来看，熵可以被视为随机变量概率分布的不确定性程度。因此，我们可以将其映射为通过观察或对变量建模可以获得的信息质量。熵越高意味着不确定性越高，因此信息质量越低，而熵越低则之反然。使用熵规范作为损失函数的预测模型，其目标是使模型特征熵最大。熵的数学原理概念上很容易理解。如果我们假设随机变量有一个有限的离散结果集，那么它的香农熵（或简称熵）`H(X)`\
  \ 可以计算为：\n\n$H(X) = - {\\\\sum\\\\limits\\\\_{x \\\\in X}^{}{p\\\\left( x\\\\_{i}\
  \ \\\\right)}}\\\\log\\\\left( {p\\\\left( x\\\\_{i} \\\\right)} \\\\right)$ (6.30)\n\
  \n其中 `p(x[i])` 是在 `n` 个可能结果中获得 `ith` 个结果的概率。每个结果的信息质量通过概率的负对数 `-log(p(x[i]))` 来衡量。因此，它随\
  \ `p(x[i])` 的增加而减小，并在 `p(x[i]) = 1` 时趋于零。如果随机变量的所有结果具有相等概率（如均匀分布所示），则熵最大。此外，如果所有结果概率相等，则熵也会随着结果数量的增加而增加。\n\
  \n| 将熵看作结果出现时令人惊讶的程度。发生概率很高的事件不会向观察者传递显著的高信息价值（惊讶度较低），相比之下，发生概率很低的事件（惊讶度较高）。 |\n\
  | --- |\n\n遵循这一推理，交叉熵（cross-entropy）也可以定义为给定随机变量在相同结果集上概率分布之间的差异。\n\n$H\\\\left(\
  \ {p,q} \\\\right) = - {\\\\sum\\\\limits\\\\_{i = 1}^{n}{p\\\\left( x \\\\right)}}\\\
  \\log q\\\\left( x \\\\right)}$ (6.31)\n\n从预测建模的角度来看，交叉熵可以扩展到衡量预测准确性或散度。这被称为相对熵或\
  \ Kullback-Leibler (KL) 散度。相对熵（实际与预测）衡量了在给定一个分布为真实分布的情况下，一个分布偏离另一个分布的程度。如果我们假设真实分布是\
  \ `p`，那么相对熵 `D(p,q)` 就是由于假设分布为 `q` 而所造成的熵损失。\n\n$D\\\\left( {p,q} \\\\right) = H_{p}\\\
  \\left( x \\\\right) - H_{q}\\\\left( x \\\\right) = {\\\\sum\\\\limits\\\\_{i =\
  \ 1}^{n}{p\\\\left( x \\\\right)}}\\\\log\\\\frac{p\\\\left( x \\\\right)}{q\\\\\
  left( x \\\\right)}$ (6.32)\n\n由于预测建模通常涉及多个变量，因此考虑变量之间的熵关系也是很有用的。如果我们考虑两个随机变量 `X`\
  \ 和 `Y` 的情况，那么它们的联合熵 `H(X, Y)` 可以写为：\n\n$H(X,Y) = - {\\\\sum\\\\limits\\\\_{x \\\
  \\in X}{\\\\sum\\\\limits\\\\_{y \\\\in Y}{p\\\\left( {x,y} \\\\right)}}}\\\\log\\\
  \\left\\\\lbrack {p(x,y)} \\\\right\\\\rbrack$ (6.33)\n\n在这种情况下，熵是联合实现的信息值。我们也可以使用熵来公式\
  \ `Y` 和 `X` 之间的条件关系。在这里，目标是寻找给定 `X` 时描述 `Y` 所需的信息质量。计算条件熵的公式如下：\n\n$H(Y|X) = - {\\\
  \\sum\\\\limits\\\\_{x \\\\in X}{\\\\sum\\\\limits\\\\_{y \\\\in Y}{p\\\\left( {x,y}\
  \ \\\\right)}}}\\\\log\\\\left\\\\lbrack p(y| x) \\\\right\\\\rbrack = H\\\\left(\
  \ {X,Y} \\\\right) - H\\\\left( X \\\\right)$ (6.34)\n\n可以证明，只有当 `X` 包含与 `Y` 无关的信息时，它才会增加\
  \ `Y` 的熵。从构造角度来看——`X` 中包含关于 `Y` 的信息越多，我们从 `Y` 的实现中得到的惊讶就越少。如果 `Y` 完全由 `X` 决定，则 `Y`\
  \ 的熵将为零。因此，作为 `Y` 特征的预测变量的良好近似方法是评估其对条件熵的贡献。\n\n上述概念在广义最大熵中的如下：假设响应变量 `Y` 可以由广线性模型\
  \ `Y = Xβ + ε` 定义`Y` 代表响应变量向量，`X` 代表协变量矩阵，`β` 代表未知参数向量，`ε` 代表残差项。我们可以将未知参数向量和残差项重新参数化为\
  \ `β = Zp` 和 `V = ω`，这样我们的线性模型可以写如下：\n\n`Y = XZP + Vω` (6.35)\n\n其中 `Z` 被指定为参数空间\
  \ `β` 可能取值的边界（支撑）矩阵，`V` 为残差项 `ε` 值的边界（支撑）。`p` 是与支撑 `Z` 值相关的概率，`ω` 是分配给支撑 `V` 的权重。\n\
  \n\n\n\n\n由于 `Z` 和 `V` 是预定的，我们的优化问题描述可以表述为寻找值 `p` 和 `ω`，使得交叉熵 `H(p,w)` 最大。遵循我们对\
  \ GME 方法的定义：\n\n`Max H(p,w) = -plog(p) - wlog(w)` (6.36)\n\n并满足以下条件：\n\n`Y = Xβ\
  \ + ε = XZp + Vw` (6.37)\n\n因此，我们的 GME 估计器 `β[GME] = Zp̂` 和 `ε[GME] = Zŵ` 可以通过求解约束优化问题的一阶条件得出。\n\
  \n| GME 估计方法寻找的是未知参数或特征空间的值，以产生最大的熵。参数空间被重新定义为预选值及其关联概率的乘积。误差也被重新定义为预选值及其关联概率的乘积。然后，优化过程寻找产生最大熵的参数和误差概率。一旦估计了概率，就可以通过概率与预选值乘积之和推导出未知参数和模型误差。例如，对于双边界情况，$\\\
  beta_{k} = {\\sum_{j = 1}^{J = 2}{z_{jk}p_{jk}}} = z_{ik}p_{ik} + z_{2k}p_{2k}$。\
  \ |\n| --- |\n\n注意，GME 不需要我们对分布做出任何假设，也不需要施加矩条件，尽管你可以选择后者。广义最大熵估计方法对于涉及大量特征的预测建模任务特别有价值，考虑到我们在确定模型真实的多变量概率分布方面面临的挑战。它可以用于参数模型和非参数模型，也可用于监督学习和无监督学习模型。\n\
  \nSAS 中的 `ENTROPY` 程序目前以实验形式提供。尽管如此，让我们探索如何将其应用于预测模型。我们将重新回顾在公式 (6.22) 和 程序 6.1\
  \ 中所示的行业 beta 回归。为了为我们的 GME 优化提供指导，我们将为市场风险溢价 `[0.5(0.5) to 1.5(0.5)]` 和误差项 `[-1.0\
  \ (0.5) to 1.0 (0.5)]` 设置支持和先验（在括号中）。考虑到金融服务行业与经济的相关性，金融服务行业的 beta 不可能在 0.5 到 1.5\
  \ 的范围，因此我们相信估计的 beta 应该在这个范围内。误差项的 `-1.0` 和 `+1.0` 是任意选择的。\n\n### 程序 6.5：使用 PROC\
  \ ENTROPY 拟合股票收益指数模型\n\n```\n/* 使用 ENTROPY 估计指数模型*/\nproc entropy data=indust maxiter=50\
  \ outp=entprob plots=all;\n  priors mrp 0.5(0.5) 1.5(0.5);\n  model finance = mrp\
  \ /supports=(-1.0(0.5) 1.0(0.5));\nrun;\n\nproc print data=entprob;\nrun;\n```\n\
  \n| `程序 6.5` 显示了用于估计指数模型的 SAS 代码。`PRIOR` 语句用于指定参数估计的支持，而 `ESPORTS` 语句（此处原文应为 supports）用于对误差执行相同操作。我们对截距使用了默认的支持选项。GME\
  \ 参数的估计概率保存在 `ENTPROB` 数据集中，并使用 `PRINT` 语句打印。 |\n\n### 输出 6.5：使用 ENTROPY 估计指数模型\n\
  \n输出 6.5 使用 ENTROPY 估计指数模型。我们将重新回顾表 6.2 中所示的行业 beta 回归。为了我们的 GME 优化提供一些指导。广义最大熵估计方法特别有价值。金融服务行业的\
  \ beta 是通过概率与预选值乘积之和得到的。估计的 beta 应该在这个范围内。\n\n| 表 6.2：广义最大熵估计计算 |\n| --- |\n| GME\
  \ 参数 |\n| 变量 | 支持 | 概率 | 截距(支持) | MRP(支持) |\n| MRP | 2 | 0.500 | 0.5 | 0.4397 |\n\
  | MRP | 2 | 1.500 | 0.5 | 0.5603 |\n| INTERCEPT | 5 | -1.0(0.5) | 0.2 | 0.2360 |\n\
  | INTERCEPT | 5 | 1.0(0.5) | 0.2 | 0.2164 |\n| INTERCEPT | 5 | -0.550 | 0.2 | 0.1985\
  \ |\n| INTERCEPT | 5 | 0.000 | 0.2 | 0.1820 |\n| INTERCEPT | 5 | 0.550 | 0.2 | 0.1696\
  \ |\n| INTERCEPT | 5 | 1.099 | 0.2 | 0.1835 |\n| | $\\beta_{k} = {\\sum_{j = 1}^{J\
  \ = 2}{z_{jk}p_{jk}}} =$ | -0.0948 | 1.0660 |\n\n## 预测模型类型\n\n金融数据科学家使用预测模型来实现各种组织任务和目标。常见的模型类型及其应用将在下节中描述。\n\
  \n### 分类模型\n\n分类模型用于根据结果或事件与其他变量共有的特征将它们归类。例如，分类模型根据潜在借款人的特征（如信用评分、收入和贷款期限等）将贷款申请分为成功和失败申请池。分类模型可以用于序数和命名分组，并以监督、无监督和强化学习模型的形式存在。15。它们也可以以参数、非参数和半参数模型的形式存在。分类模型的预测可以是离散形式（即将观测值分配给特定组），也可以是进入特定组概率的形式。\n\
  \n### 回归模型\n\n回归模型用于估计结果或事件的幅度。以我们之前的贷款申请池为例，回归模型可以利用一组类似的特征来估计向成功申请人收取的利率。回归模型用于预测区间响应变量。这些预测可以是点估计或预测区间的形式。回归模型的输入可以是连续或离散变量的形式。正如本章前节所示，可以使用参数模型和非参数模型进行估计。大多数回归模型是以监督学习模型的形式存在的。\n\
  \n### 降维模型\n\n\n\n\n分类模型用于预测同一变量的事件或结果，而降维模型则用于分析生命周期中的数据预处理阶段，在将数据输入最终预测模型之前，减少高维数据集中的变量数量。三类降维程序包括主成分分析、因子分析和聚类分析。\n\
  \n主成分分析是最常用的方法，它利用矩阵代数，通过在解释变量矩阵中寻找主导模式来降低数据维度。主导模式通过变换后的值相对于未变换数据的方差来定义。因子分析旨在寻找解释一组变量中观测模式的底层共同变量。\n\
  \n聚类模型用于根据数据集中观测值之间共同的特征将其进行分组。聚类模型通常用于数据探索、降维、离群点检测、结果细分以及作为因子分析的补充等。大多数聚类模型基于无监督学习技术，但也有少数监督聚类技术。在现实中，聚类技术层出不穷，因此其实实现方法也许多。这包括参数和非参数聚类模型，以及基于层次、质心和密度的聚类模型等。这两种方法的主要区别在于：主成分分析用于对变量进行分组，而聚类分析用于对观测值进行分组。\n\
  \n# 预测模型\n\n预测模型利用感兴趣变量的当前和过去实现作为预测因子，来预测其未来值。这些模型试图回答一个基础问题：根据我们对其当前和过去值的了解，感兴趣变量的未来值将是什么样。例如，预测回归可以使用历史违约率来预测贷款组合的未来违约率。与之前不一定基于时间序列数据的模型不同，预测模型完全依赖时间序列数据来生成未来预测。在第三章中，我们强调了一些常用的用于预测的统计模型。这些包括自回归\
  \ (AR)、自回归整合移动平均 (ARIMA) 和季节性自回归移动平均 (SARIMA) 模型。在本章中，我们在列表中增加了向量自回归 (`VAR`) 和向量误差修正\
  \ (`VECM`) 模型。\n\n## 时间索引预测模型\n\n与使用变量的当前值和过去值预测未来值的预测模型不同，时间索引模型将时间索引作为其主要预测变量，因此它们对于预测很大程度上取决于时间的事件或结果特别有用。这包括值随时间单调增加或减少的事件或结果，以及随时间发生非单调变化的事件（例如具有周期性、季节性和平稳性的事件）。例如，如果贷款组合随时间单调增长，银行可以使用时间索引预测模型来预测其贷款组合的未来规模。常见的时间索引预测模型包括自回归整合移动平均\
  \ (`ARIMA`)、指数平滑和 Prophet 模型。\n\n## 离群模型\n\n离群模型用于检测偏离常态的事件或结果。它们与普通分类模型的不同在于，这里采用的模型是从基准运行的，仅旨在解释偏离该基准的事件或结果。因此，它们通常被视为单类分类模型。离群模型主要用于检测异常事件，例如欺诈活动、入侵检测和员工流失等。在过去，离群分析是使用单变量统计方法执行的。数据科学的最新进展引入了更稳健的方法。这些包括支持向量数据描述\
  \ (Support Vector Data Description)，它在正常结果或事件周围构建一个 n 维特征（预测因子）空间（超球）。离群事件或结果被定义为落在超球边界之外的项。\n\
  \n# SAS 中的预测建模\n\n在 SAS 中实现预测建模有多种方法。对于使用 Enterprise Guide 和 SAS 9.4 等桌面客户端或 SAS\
  \ Studio 等 Web 应用程序访问 SAS 的用户，如果你拥有 `SAS/STAT` 和 `SAS/ETS` 的有效许可证，就可以实现统计预测建模。如果你拥有\
  \ `SAS Enterprise Miner` 的有效许可证，也可以在 Enterprise Guide、SAS Studio 和 Enterprise Miner\
  \ 中实现机器学习建模。你应该意识到，SAS Viya 现在是 SAS 的旗舰分析引擎。尽管 SAS Viya 引擎的架构与 SAS 9.4 不同，但你仍然可以使用\
  \ Enterprise Guide、SAS Studio 和 Enterprise Miner 访问它。Base SAS 程序在 SAS Viya 环境中无缝运行。然而，由于\
  \ SAS Studio、Enterprise Guide 和 Enterprise Miner 的可用性更高，我们将在演示中坚持这些应用程序。你可以通过提交以下\
  \ SAS 程序并检查日志来检查你所在站点已许可的 SAS 产品列表。\n\n### 程序 6.6：验证机器上当前 SAS 许可证的 代码\n\n```\nproc\
  \ product_status;\nrun;\n```\n\n如果你通过 SAS OnDemand for Academics 访问 SAS，那么你应该注意在该窗口环境中可以使用\
  \ `SAS/STAT`、`SAS/ETS` 和 `SAS Enterprise Miner`。我们在本章后续章节中执行的许多练习都需要 `SAS/STAT`\
  \ 和 `SAS/ETS` 的有效许可证。如果你没有有效的站点许可证，应该考虑通过 SAS OnDemand 注册免费访问 SAS Studio。16 表 6.3\
  \ 提供了 SAS 中可用某些预测模型的摘要以及实现它们所需的 SAS 产品许可证。\n\n## SAS 中的统计预测模型\n\n现在我们已经通过线性回归模型等基本示例建立了预测建模基础的严谨框架，让我们继续通过如何在\
  \ SAS 中实现表 6.3 中列出的其他统计预测模型。\n\n### 分类模型\n\n如前所述，分类模型通常用于预测分类或离散事件。你应该注意，分类事件在性质上可能是互斥或非互斥的。互斥结果意味着在一系列可能的结果范围内，某个参考点只能发生一种结果。这些可能且互斥结果的分布被称为多项分布。多项分布的一个特例是二项分布，在每次试验中只有两种可能的结果。我们将在书中重点关注此类类型事件的模型。有预测具有多项结果事件的统计模型。在现实中，其中许多是二元结果模型的扩展。因此，在深入多项模型之前，建立二元选择模型统计框架的深厚基础知识是关重要的。17\n\
  \n| 表 6.3：SAS 9.4 中的预测模型选项 |\n\n| --- |\n| SAS 产品 || 建模问题 || 模型类型 | 程序 || 估计方法 ||\
  \ 分布 |\n| `SAS/STAT` || 回归 || 回归 | `REG`, `GLM`, `NLIN`, `QUANTREG` | `LS`, `MLE`,\
  \ `GMM` | 参数 |\n\n\n\n\n\n| 分类 | 回归 | LOGISTIC, PROBIT, TOBIT | MLE | 参数化 |\n| :---\
