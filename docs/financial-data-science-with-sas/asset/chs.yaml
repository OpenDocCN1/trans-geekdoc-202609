  \ | | | | | | | | |\n\n注意，虽然该优化问题的目标函数是线性的，但风险约束不是。因此，该问题本质上是非线性优化问题。我们进行非线性优化所需的问题数据包括投资组合成分股的收益向量（见表\
  \ 9.1）以及收益协方差矩阵。\n\n要执行优化：\n\n首先，使用 `%DATAPULL` 宏将两个 SAS 数据文件下载到 `WORK` 文件夹。在程序\
  \ 9.1A 中，我们展示了在满足风险约束的情况下投资组合收益优化的 SAS 代码。请注意，我们将比较几种使用其他目标函数的投资组合优化方法。为了确保我们能够进行公平的比较，我们在研究的所有投资组合优化问题中都包含了计算这些指标的代码（并附有标记其包含位置的注释）。\n\
  \n程序 9.1A: 使用 PROC OPTMODEL 最大化投资组合收益（MVO 方法）\n\n```\n```\n```\n\n\n\n```sas\n/*\
  \ 使用 PROC OPTMODEL 在均方差优化中实现组合收益最大化 */\n%datapull(portret,portfolio_returns.sas7bdat);\n\
  %datapull(portvcv,portfolio_covariances.sas7bdat);\n%let max_risk = 0.045;\n%let\
  \ alpha=0.99;\n%let rfr=0.00178;\n\nproc optmodel;\n      /* 定义集合和参数 */\n      set\
  \ <str> ASSETS;\n      num returns {ASSETS};\n      num covariance {ASSETS, ASSETS};\n\
  \n      /* 从 SAS 数据集读取组合数据 */\n      read data Portfolio_Returns into ASSETS=[Ticker]\
  \ returns;\n\n      *print returns;\n      read data Portfolio_Covariances into\
  \ [Ticker]  \n                  {j in ASSETS} <covariance[Ticker,j]=col(j)>;\n\n\
  \      *print covariance;\n      /* 定义变量 */\n      var Weights {ASSETS} >= 0;\n\n\
  \      /* 计算组合风险指标 */\n      impvar Portfolio_Variance=sum {i in ASSETS, j in\n\
  \      ASSETS}covariance[i,j]*Weights[i]*Weights[j];\n      impvar Portfolio_Risk\
  \ = sqrt(Portfolio_Variance);\n\n      /* 包含代码：风险价值 (VaR) 和期望缺损 (Expected Shortfall)\
  \ */\n      impvar zes =(((2*constant(\"pi\"))**(0.5))*(exp(((2**-\n      0.5)*quantile('normal',&alpha))**2))*(1-&alpha))**-1;\n\
  \      impvar VaR=sum {j in ASSETS} \n                  -returns[j]*Weights[j]+quantile(\"\
  normal\",&alpha)*sqrt(Portfolio_Variance);\n      impvar Expected_Shortfall=sum\
  \ {j in ASSETS} \n                  -returns[j]*Weights[j]+zes*sqrt(Portfolio_Variance);\n\
  \n      /* 计算组合收益 */\n      impvar Expected_Return=sum {j in ASSETS} \n        \
  \          returns[j] * Weights[j];\n\n      /* 定义约束条件 */\n      con Portfolio_Weights:\
  \ sum {j in ASSETS} Weights[j] = 1;\n      con Variance: Portfolio_Variance <= &max_risk**2;\n\
  \n      /* 定义目标函数 */\n      max Portfolio_Return = Expected_Return;\n      solve\
  \ ;\n\n      /* 组合夏普比率 */\n      Impvar Sharpe_Ratio = (Expected_Return-&rfr)/Portfolio_Risk;\n\
  \n      /* 打印优化输出 */\n      print  Portfolio_Return percent8.2 Portfolio_Risk percent8.2\
  \ Sharpe_Ratio best8.5 \n      VaR percent8.2 Expected_Shortfall percent8.2;\n \
  \     print Variance.ub Variance.dual;\n      print {j in ASSETS: Weights[j]>1e-4}\
  \ Weights percent8.2\n                  {j in ASSETS: Weights[j]>1e-4} returns percent8.2;\n\
  ```\n```\n\n# 均方差优化中的组合收益最大化\n\n以下代码演示了如何使用 `PROC OPTMODEL` 执行均方差优化。\n\n## 数据加载与初始化\n\
  \n该过程从从 SAS 数据集中提取数据并定义宏变量开始：\n- `%datapull(portret,portfolio_returns.sas7bdat);`\n\
  - `%datapull(portvcv,portfolio_covariances.sas7bdat);`\n- `%let max_risk = 0.045;`\n\
  - `%let alpha=0.99;`\n- `%let rfr=0.00178;`\n\n## 优化模型结构\n\n在 `proc optmodel;` 内部，我们定义了集合和参数：\n\
  - `set <str> ASSETS;`\n- `num returns {ASSETS};`\n- `num covariance {ASSETS, ASSETS};`\n\
  \n随后将数据读入模型：\n- `read data Portfolio_Returns into ASSETS=[Ticker] returns;`\n- `read\
  \ data Portfolio_Covariances into [Ticker] {j in ASSETS} <covariance[Ticker,j]=col(j)>;`\n\
  \n## 变量与计算\n\n定义了决策变量 `Weights`：\n- `var Weights {ASSETS} >= 0;`\n\n使用隐式变量计算组合风险：\n\
  - `impvar Portfolio_Variance=sum {i in ASSETS, j in ASSETS}covariance[i,j]*Weights[i]*Weights[j];`\n\
  - `impvar Portfolio_Risk = sqrt(Portfolio_Variance);`\n\n### 风险价值 (VaR) 与期望缺损 (ES)\n\
  \n模型包含了 VaR 和期望缺损的逻辑：\n- `impvar zes =(((2*constant(\"pi\"))**(0.5))*(exp(((2**-0.5)*quantile('normal',&alpha))**2))*(1-&alpha))**-1;`\n\
  - `impvar VaR=sum {j in ASSETS} -returns[j]*Weights[j]+quantile(\"normal\",&alpha)*sqrt(Portfolio_Variance);`\n\
  - `impvar Expected_Shortfall=sum {j in ASSETS} -returns[j]*Weights[j]+zes*sqrt(Portfolio_Variance);`\n\
  \n期望收益的计算为：\n- `impvar Expected_Return=sum {j in ASSETS} returns[j] * Weights[j];`\n\
  \n## 约束条件与目标函数\n\n定义约束条件来限制优化范围：\n- `con Portfolio_Weights: sum {j in ASSETS} Weights[j]\
  \ = 1;`\n- `con Variance: Portfolio_Variance <= &max_risk**2;`\n\n目标函数设置为收益最大化：\n\
  - `max Portfolio_Return = Expected_Return;`\n- `solve ;`\n\n## 结果与输出\n\n求解后，计算夏普比率：\n\
  - `Impvar Sharpe_Ratio = (Expected_Return-&rfr)/Portfolio_Risk;`\n\n使用 `print` 打印结果：\n\
  - `print Portfolio_Return percent8.2 Portfolio_Risk percent8.2 Sharpe_Ratio best8.5\
  \ VaR percent8.2 Expected_Shortfall percent8.2;`\n- `print Variance.ub Variance.dual;`\n\
  - `print {j in ASSETS: Weights[j]>1e-4} Weights percent8.2 {j in ASSETS: Weights[j]>1e-4}\
  \ returns percent8.2;`\n\n\n\n\n\n输出 9.1A 显示了通过求解问题得出的成分股组合权重优化结果。请记住，初始投资组合包含 63\
  \ 支股票。然而，优化后的组合仅包含 12 支股票，月预期收益率为 1.79%，标准差为 4.5%。年化后，预期收益率约为 24.7%，标准差约为 15.6%。尽管从\
  \ 2021 年的结果来看，优化后的组合表现略逊于全资产组合，2，但实际上，在六年中，优化后组合的长期表现显著优于全资产组合。同一时期全资产组合的平均月收益为\
  \ 1.09%，标准差为 4.75%。在这个例子中，优化投资组合权重的经济价值显而易见。通过优化投资组合，我们在不承担任何额外风险的情况下，将平均月收益率提高了约\
  \ 70 个基点。优化后组合的夏普率（0.36）也高于全资产组合的夏普率（0.19）。从现代投资组合理论的角度来看，我们认为优化后的组合比全资产组合更有效。该组合是否比我们从全资产\
  \ 63 支股票池中能构建的任何其他组合更有效，还有待确定。然而，显而易见的是，我们现在从一个 63 支股票分散组合转向了一个高度集中的组合，这可能面临重大的事件风险。我们优化组合价值的\
  \ 93.3% 集中在仅五只股票上（Dollar General、RESMED Inc、United Health、Apple Inc 和 Paycom Software），无论现代投资组合理论对投资者应该如何行为的理论假设如何，这对于许多投资者来说可能并不很有吸引力。\n\
  \n输出 9.1B 以饼图形式描绘了基于收益最大化得出的最优组合配置的集中程度。在图中，超过 99% 的组合权重被分配给仅 8 支股票。总 12 支股票中剩余的\
  \ 4 支股票仅分配了总组合资金微不足道的 0.19%。\n\n输出 9.1B：收益最大化优化 (MVO) 的最优组合配置\n\n| ![image](img/Ch09_6.jpg)\
  \ |\n| --- |\n\n## 风险最小化\n\n也许，如果我们在给收益水平下优化投资组合的风险，可能会得到不同的结果。在这种情况下，我们的目标函数将是以二次表达式的形式呈非线性，而我们的收益约束将是线性的。我们正在寻找一组组合权重，以便在预期的最小收益水平（假设为每月\
  \ 1.79%）下产生最小风险。我们的投资组合优化问题的数学表达式所示：\n\n$$\\begin{array}{l} {\\\\min\\\\limits\\\
  \\_{w}\\\\sigma\\_{p}\\\\text{=}\\\\sqrt{\\\\sum\\\\limits\\\\_{i = 1}^{n}{w\\\\\
  _{i}w\\\\_{j}Cov\\\\left( {R\\_{i},R\\_{j}} \\\\right)}}} \\\\\\\\ {\\\\text{s}\\\
  \\text{.t}\\\\text{~~}\\\\text{Ε}\\\\left( R\\_{p} \\\\right) = {\\\\sum\\\\limits\\\
  \\_{i = 1}^{n}{w\\\\_{i}\\\\text{Ε}\\\\left( R\\_{i}} \\\\right)}} \\\\geq 1.79\\\
  \\%,{\\\\sum\\\\limits\\\\_{i = 1}^{n}w\\\\_{i}} = 1} \\\\\\\\ \\\\\\\\end{array}$$\
  \ (9.4)\n\n在 程序 9.2 中，我们展示了可以在收益约束条件下调用以优化组合风险的 SAS 代码。程序中的大部分代码与 程序 9.1 中的类似，因此我们删除了它们。我们只需要修改\
  \ 程序 9.1 的约束和目标函数即可实现风险最小化的代码。3 对于不同优化方法之间相似的计算使用隐变量是提高编程任务效率的一种方法。注意，我们的目标函数被指定为组合方差的平方根，这是我们之前使用隐变量计算过的。\n\
  \n程序 9.2：使用 PROC OPTMODEL 最小化投资组合风险 (MVO 方法)\n\n```sas\n/*使用 PROC OPTMODEL 在均值差优化中最小化投资组合风险*/\n\
  %let minimum_return = 0.0179;\n%let beta=0.99;\n%let rfr=0.00178;\n\nproc optmodel;\n\
  \n/******************************************/\n/*           与程序 9.1 相同        \
  \   */\n/*****************************************/\n\n      /*声明约束 */\n      con\
  \ Portfolio_Weights: sum {j in ASSETS} Weights[j] = 1;\n      con Minimum_return:\
  \ Expected_Return >= &minimum_return;\n\n      /*声明目标 */\n      min Portfolio_Risk\
  \ = sqrt(Portfolio_Variance);\n      solve with qp;\n\n/******************************************/\n\
  /*           与程序 9.1 相同           */\n/*****************************************/\n\
  ```\n\n| |\n| --- |\n\n让我们复习一下优化的输出，如 输出 9.2 所示。在问题摘要（Problem Summary）中，你会注意到求解器正确确定了目标函数是非线性的，因为它以平方根的形式编写。据此，程序选择的求解器是直接\
  \ IPM。如果需要，可以使用方差项重新指定目标函数。4 这会导致程序将问题归类为二次优化问题，并选择原始对偶 IPM 求解器执行优化任务。然而，你应该注意，使用标准差而非方差展示组合更为常见。有趣的是，优化风险得到的股票数量（10\
  \ 只）少于我们从收益最大化得到的数量。\n\n输出 9.2：从风险最小化优化 (MVO) 获取的组合统计数据\n\n| ![image](img/Ch09_7.jpg)![image](img/Ch09_7a.jpg)\
  \ |\n| --- |\n\n你还会注意到，我们在成分股票和权重方面与收益最大化非常相似。Dollar General Inc. 仍然是组合中最大的最优持仓，随后是\
  \ ResMed Inc、Apple Inc 和 United Health Inc.。组合风险、夏普率、99-VaR 和预期缺少与之前的优化相似。持仓集中在少数股票中的情况在最优组合权重中也显而易见。93.3%\
  \ 的组合资金被分配给收益最大化优化中显示的相同五只股票。\n\n## 使用 PROC IML 优化问题\n\n如果你之前读过书的第四章和第五章，你就会看到如何调用\
  \ PROC IML 来解决各种模拟和估计问题的示例。事实证明 PROC IML 也可以用于解决各种优化问题。这些包括线性规划、混合整数规划和非线性优化。\n\n\
  \n\n\n矩阵操作是 `PROC IML` 的原生功能，该过程支持广泛的矩阵操作，使你能够非常快速在优化程序中实现这些操作。相比之下，`PROC OPTMODEL`\
  \ 只能通过调用函数来实现 get 矩阵操作，而该函数必须先使用 `PROC FCMP`（函数编译器）进行预编译。请注意，你很可能需要为预编译的函数或操作编写代码。请记住，`PROC\
  \ OPTMODEL` 是专为解决各种优化问题而设计的。因此，使用 `PROC OPTMODEL` 编写优化问题的 SAS 代码比使用 `PROC IML` 要容易得多。PROC\
  \ OPTMODEL` 获取的结果也比 `PROC IML` 更全面。\n\n`PROC IML` 中的优化子程序包括共轭梯度法 (`NLPCG`)、Nelder-Mead\
  \ 单形法 (`NLPNMS`)、牛顿-拉夫逊法 (`NLPNRA`)、对偶拟牛顿法 (`NLPQN`) 和二次优化法 (`NLPQUA`)。Nelder-Mead\
  \ 法是单纯形法的变体，而内点法和活动集法是牛顿-拉夫逊法的变体。在 SAS 中解决优化问题的伟大之处在于，你可以通过在组 SAS 代码中将它们结合（根据需要）来获得这两个过程的最佳特性，以解决你的优化问题，正如你很快将看到的。\n\
  \n## 夏普比率最大化\n\n在单个模型中对高收益和低风险进行联合优化可能是值得的。最大夏普比率优化旨在实现这一目标。在夏普比率优化中，我们将寻找产生最高夏普比率的投资配置。请记住，投资方差是一个二次函数；因此，夏普比率优化也是凸优化，因为它是投资超额收益与投资超额收益标准差之比。由于夏普比率将风险和收益结合在一个表达式中，我们对模型施加的唯一约束是全额投资和禁空头约束（我们通过决策变量的边界来实施）。夏普比率最大化问题的数学公式为：\n\
  \n$\\max\\limits\\_{w}S\\_{p} = \\frac{\\\\text{Ε}\\left( R\\_{p} \\right) - R\\\
  _{f}}{\\sigma\\_{p}}\\{~s}\\text{.t}\\text{.~}{\\sum\\limits\\_{i = 1}^{n}w\\_{i}}\
  \ = 1$ (9.5)\n\n其中 `S`[`p`]` 代表投资组合的夏普比率，`R`[`f`]` 是无风险利率，Ε`(`R`[`p`]` 和 `σ`[`p]`\
  \ 是投资组合的预期收益和风险。\n\n为了让你简要了解如何在 SAS/IML 中实现优化，我们在此示例中使用 `PROC IML`。你将在章节末的练习中有机会使用\
  \ `PROC OPTMODEL` 解决相同的优化问题。程序 9.3 显示了使用 `PROC IML` 实现夏普比率最大化的 SAS 程序。\n\n首先，我们使用宏变量来表示我们投资组合池中资产的数量。然后调用\
  \ `IML` 过程，并将包含资产收益率和协方差矩阵的 SAS 数据集加载到该过程中。接下来，我们使用 `IML` 模块将最大化夏普比率的目标函数计算为用户函数。你会在函数内部注意到计算了投资组合收益、投资组合风险以及随后的夏普比率，但只返回了夏普比率。为了在模块外部访问其余的计算结果，调用了\
  \ `GLOBAL` 语句。\n\n接下来，我们指定约束条件。在 `OPTMODEL` 过程中指定约束比在 `IML` 过程中更容易。通过使用矩阵形式的约束指定，我们避免了手动在程序中输入每个权重元素的上下界以及所有权重元素的全额投资约束。首先，我们创建向量\
  \ `P` = `{0,1,1}`，其中 `P` 前两行的元素对每只股票的投资配置施加了 0 的下界和 1 的上限。然后使用 `REPEAT` 函数和 `&N=63`\
  \ 宏变量将其复制到 63 只股票上。使用相同的 `REPEAT` 函数，我们接着使用 `P` 的最后一个元素和矩阵 `{. .,.,0 1}` 计算权重的总和，该和被限制在\
  \ 0 和 1 之间。\n\n接下来，我们指定优化选项。`OPTN` 第一个元素的值指定了优化类型（0 = ‘最小化’，1 = ‘最大化’），第二个元素的值指定了输出级别（0\
  \ = ‘无输出’，1 = ‘初始和最终迭代摘要’）。然后我们使用 `CALL` 语句调用非线性拟牛顿求解器。请记住，内点算法也使用牛顿法来解决优化问题。下一组代码用于格式化结果并将最优投资权重存储在\
  \ SAS 数据集中，然后我们使用 `SGPIE` 过程在饼图中展示它们。\n\n### 程序 9.3: 使用 PROC IML 实现投资组合夏普比率最大化 (MVO\
  \ 方法)\n\n```\n/* 使用 PROC IML 实现最大夏普比率优化*/\n%let n=63;\n\nproc iml;\n    /* 将资产收益和协方差读入\
  \ Returns 和 Sigma */\n    use Portfolio_Returns;\n    read all var _num_ into returns[colname=NumerNames];\n\
  \    close Portfolio_Returns;\n    use Portfolio_Covariances;\n    read all var\
  \ _num_ into sigma[colname=Ticker];\n    close Portfolio_Covariances;\n    r=0.0178;/*\
  \ 无风险*/\n    /* 最大夏普比率的目标函数 */\n    function max_sharpe(w, returns, sigma, r);\n\
  \        global;\n        portfolio_return=w'*returns;\n        portfolio_risk=sqrt(w'*sigma*w);\n\
  \        sharpe=(portfolio_return-r)/portfolio_risk;\n        return sharpe;\n \
  \   end;\n    /* 约束：下界，上限，权重和等于 1 */\n    p={0,1,1};\n    con=repeat(p,&n)||{. .,.,0\
  \ 1};\n    /* 设置优化最大化目标函数并打印摘要 */\n    optn={1 1};\n    w=j(1,n,1/n);\n    /* 线性约束调用拟牛顿法设置初始值\
  \ */\n    call NLPQN(rc,OptW,\"max_sharpe\",w,optn,con);\n    /* 输出结果 */\n    TOW=t(OptW);\n\
  \    ind = loc(TOptw>0);\n    if ncol(ind)>0 then\n        rn=NumerNames[ind];\n\
  \        Weights=TOptW[ind];\n        print Weights[format=percent8.2] l='Portfolio\
  \ Allocations' colname='Ticker' rowname=rn ];\n    cnames='Ticker'||'Weights';\n\
  \    create Sharpemax from rn Weights[colname=cnames];\n    append from rn Weights;\n\
  \    close sharpemax;\nfinish;\n\nproc sgpie data=sharpemax;\n    title1 font=swissb\
  \ height=2 '基于均差投资组合优化的资产配置';\n    title2 font=swissb height=2 '(夏普比率最大化)';\n  \
  \  pie ticker / response=Weights otherpercent=1 statfmt=percent8.2 databelloc=callout;\n\
  run;\n```\n\n\n\n\n输出 9.3A 显示了优化前迭代条件的摘要。注意，我们有 63 个下限和上限以及 1 个线性约束，即完全投资约束。初始目标函数值是根据初始值指定的、对所有\
  \ 63 只股票进行等权加权得到的夏普比率。输出 9.3B 显示了优化结果摘要。目标函数行显示的值为 0.36。这是通过优化获得的最大夏普比率。该值与我们从收益最大化和风险最小化优化中获得的夏普比率大致相同。然而，投资组合收益和标准差并不相同。这是因为我们对从收益最大化和风险最小化问题计算出的夏普比率进行了向上舍入。实际上，两次优化得到的夏普比率略低于直接夏普比率最大化问题得到的值。请记住，在前一种优化中，最优值被限制在最大风险（针对收益最大化）和最小收益（针对风险最小化）的可行区域内，而在直接夏普比率优化中并没有实施此类约束。因此，求解器可以确定任何产生最高夏普比率的风险和收益组合。\n\
  \n### 输出 9.3A：使用 PROC IML 进行最大夏普比率优化的优化统计\n\n| ![image](img/Ch09_ch09-out-9.3a.jpg)\
  \ |\n| --- |\n\n注意“投资组合配置”表，被选入夏普优化投资组合的股票及其分配的权重与在收益优化和风险优化中选中的股票相似。相比之下，夏普优化投资组合选了\
  \ 13 只股票，而收益优化投资组合和风险优化的投资组合分别选了 12 只和 10 只股票。\n\n### 输出 9.3B：使用 PROC IML 进行最大夏普比率优化的投资组合统计\
  \ |\n\n| ![image](img/Ch09_11.jpg)![image](img/Ch09_13.jpg) |\n| --- |\n\n## 使用\
  \ SAS 创建有效边界和资本配置线\n\n现在让我们让我们之前为 MVO（均方差优化）编写的 SAS 代码应用进行扩展，演示如何为大型资产投资组合构建有效边界和资本配置线。请记住，有效投资组合在给定的风险水平下提供最高收益或在给定的收益水平下提供最低风险。更广泛地说，有效投资组合在每个风险水平上提供最高的夏普比率。大多数有效边界的实现往往将演示限制在两个到三个资产，因为对大型资产投资组合实现这些计算要求巨大。事实证明，可以使用\
  \ `OPTMODEL` 过程、一些基础 SAS 宏和 IML 编程为我们的股票投资组合生成有效边界和资本配置线。在查看程序之前，您应该注意，实现我们所需的输出需要大量的编程和计算资源。\n\
  \n第一步将递归地重新优化我们的投资组合，以从从 3.34% 到 11.24% 的一系列最大风险推导出最高收益。我们将通过在 SAS `DO` 循环宏中嵌入 `OPTMODEL`\
  \ 过程的代码来实现这一点。我们从系列优化中得出的投资组合收益和风险将保存在 SAS 数据集中。接下来，我们将使用 `IML` 过程为投资组合模拟随机权重，并计算它们相关的投资组合收益和风险。请注意，模拟的投资组合只是未优化的投资组合的集合，因此它们的夏普比率将显著降低。我们还将在分析中包含表\
  \ 9.1 所示的初始投资组合配置的风险和收益图。\n\n我们从之前的优化中知道，从投资组合中得出的最大夏普比率为 0.36，在我们研究期间的平均每月无风险利率为\
  \ 0.178%。我们将使用这些输入创建两个宏变量，用于绘制资本配置线 (CAL)。我们将使用 `DATA` 步将之前的三个数据集合并为一个，随后调用 `SGPLOT`\
  \ 为合并数据集中的变量绘制图表。\n\n在继续之前，您应该注意，虽然未优化的投资组合包含具有随机权重的全部 63 只股票，但优化投资组合集仅包含正非零权重的股票，而\
  \ CAL 投资组合是通过将切点投资组合（包含 13 只股票）与无风险资产结合创建的，两类资产（风险资产和无风险资产）之间的范围资产配置。因此，CAL 投资组合是投资组合的组合。\n\
  \n### 程序 9.4A：使用 SAS 宏和 PROC OPTMODEL 创建有效边界\n\n```sas\n/*在 SAS 中创建有效边界和资本配置线*/\n\
  %let rfr=0.00178; /*无风险利率*/\n%let Max_Sharpe=0.36; /*夏普比率*/\n%let m =100;/*需要优化和模拟的投资组合数量*/\n\
  %let r =63;/*投资组合中当前股票数量*/\n%macro EFsim(nrep); /*指定重复次数*/\n      proc datasets\
  \ nodetails nolist;\n            delete simfrontier;\n      run;\n\n      %local\
  \ i nrep; /*局部宏变量*/\n\n      %do i=1 %to &rep;\n\n        proc optmodel level=1;\n\
  \          /*声明集和参数 */\n          set ASSETS;\n          num returns {ASSETS};\n\
  \          num covariance {ASSETS};\n          \n          /*从 SAS 数据集中读取投资组合 */\n\
  \          read Portfolio_Returns into ASSETS=[Ticker] returns;\n          read\
  \ Portfolio_Covariances into [Ticker] \n            {j in ASSETS} covariance[Ticker,j]=col(j);\n\
  \          \n          /*声明变量 */\n          var Weights {ASSETS} >= 0;\n       \
  \   impvar max_risk=&i*.01+.033;\n          \n          /*计算投资组合风险*/\n         \
  \ impvar Portfolio_Variance=sum {i in ASSETS, j in\n            ASSETS}covariance[i,j]*Weights[i]*Weights[j];\n\
  \          impvar Portfolio_Risk = sqrt(Portfolio_Variance);\n\n          /*计算投资组合收益*/\n\
  \          impvar Expected_Return=sum {j in ASSETS} \n            returns[j] * Weights[j];\n\
  \          \n          /*声明约束 */\n          con Portfolio_Weights:sum{j in ASSETS}Weights[j]=1;\n\
  \          con Variance: Portfolio_Variance = max_risk**2;\n          \n       \
  \   /*声明目标 */\n          max Portfolio_Return = Expected_Return;\n          solve;\n\
  \          \n          /*投资组合夏普比率*/\n          Impvar Sharpe_Ratio = (Expected_Return-&rfr)/Portfolio_Risk;\n\
  \          \n          /*打印优化输出*/\n          print  Portfolio_Return percent8.2\
  \ Portfolio_Risk percent8.2\n            Sharpe_Ratio best4.2;\n          print\
  \ {j in ASSETS: Weights[j]>1e-4} Weights percent8.2  {j in\n            ASSETS:\
  \ Weights[j]>1e-4} returns percent8.2;\n          /*将数据写入 SAS Set */\n         \
  \ create data smvmax from index=&i Returns=Portfolio_return \n            Risks=Portfolio_Risk\
  \ Sharpe=Sharpe_Ratio;\n        quit;\n\n        /*带有新迭代结果的表*/\n        proc append\
  \ base=simfrontier data=smvmax force;\n        run;\n\n      %end;\n%mend;\n\n%efsim(&m);\n\
  ```\n\n程序 9.4A 显示了用于导出有效边界的 DO 循环宏的 SAS 代码。我们在这一步中使用的大部分代码都在程序 9.1 中；因此我们只讨论包含新代码的部分。\n\
  \n\n\n\n\n我们首先引入一组在程序过程中需要的全局宏变量（`%RFR`，表示无风险利率；`%MAX_SHARPE`，表示之前获得的最大夏普比率；`%M`，表示模拟的投资组合数量；以及\
  \ `%R`，表示初始投资组合中的股票数量）。我们的目标是推导出 80 种有效投资组合（因此，我们将 `%M` 设置为 80）。\n\n然后，我们为 `EFSIM`\
  \ 宏调用了 `MACRO` 语句，该宏使用 `NREP`（重复次数）作为唯一的宏输入。你应该注意，`%NREP` 和 `%i` 是局部变量，仅在宏执行期间可用。宏的开头包含了\
  \ `PROC DATASET` 语句。这将在每调用一次宏时，都会删除当前版本的 `SIMFRONTIER` 数据集并将其替换为新版本。注意如何使用 `IMPVAR`\
  \ 语句递归实现实现优化（`IMPVAR MAX_RISK=&I*.001+.0324`）。对于每次迭代，最大投资组合风险限制都会增加 0.1%（从 3.34%\
  \ 到 11.24%），然后通过优化收益目标获得在该阈值下可实现的最大收益。随后使用 `APPEND` 过程将每次迭代的投资组合统计数据追加到 `SIMFRONTIER`\
  \ 数据集中。\n\n你可能会奇怪，为什么我们从 3.34% 的初始风险水平开始递归优化。这是因为 3.34% 是全局最小方差投资组合的标准差。你应该注意，有效投资组合必须绘制在最小方差组合之上，因为在不相应增加风险承受能力的情况下，无法从这些组合中获得更高的收益改进。\n\
  \n### 程序 9.4B：使用 PROC IML 模拟随机投资组合\n\n```\n/*Simulating random portfolio weights\
  \ using PROC IML*/\nproc iml;\n      use Portfolio_Returns;\n      read all var\
  \ _num_ into returns[colname=NumerNames];\n      read all var _char_ into assets[colname=CharNames];\n\
  \      use Portfolio_Covariances;\n      read all var _num_ into sigma[colname=NumerNames\
  \ rowname=Ticker];\n              \n      /*Simulate portfolio weights*/\n     \
  \ x=j(&m,&r);\n      call randseed(12348);\n      call randgen(x,'exp');\n     \
  \ W=x/x[,+];\n              \n      /*Create column names*/\n      pnames ='Index'||'RReturns'||'RRisks';\n\
  \              \n      /*Create vector and calculate portfolio risk and returns*/\
  \      \n      portplot=j(&m,3);\n      do i = 1 to &m;\n              portplot[i,1]=i;\n\
  \              portplot[i,2]=w[i,]*returns;\n              portplot[i,3]=sqrt((w[i,])*(sigma*t(w[i,])));\n\
  \      end;\n              \n      create Portplot from Portplot [colname=pnames];\n\
  \      append from Portplot;\n      close Portplot;\n```\n\n让我们也展示与随机构建的未优化投资组合集合相比，从有效投资组合可以获得的投资组合统计数据的改进。程序\
  \ 9.4B 显示了用于模拟 100 个未优化投资组合的 IML 过程 SAS 代码。你可能在夏普比率优化中见过我们在这里使用的某些代码，因此我们将只关注在此步中使用的新代码。在将资产收益和协方差导入过程后，我们创建了一个\
  \ 100（行）乘 63（列）的 `x` 矩阵，用于收集从指数分布生成的随机值。然后，我们创建了一个与 `x` 维度相同的权重矩阵 `w` 来收集权重。权重通过将\
  \ `x` 矩阵的行元素除以每行元素的总和来计算得出。接下来，我们使用 `DO` 循环计算每个模拟权重向量的投资组合收益和投资组合方差。然后使用 `CREATE`\
  \ 语句将数据存储在 SAS 数据集 `PORTPLOT` 中。\n\n### 程序 9.4C：绘制有效前沿面和资本配置线\n\n```\n/*Creating\
  \ the frontier and Capital Allocation Line using SGPLOT*/\ndata frontier;\n    \
  \  merge frontier Portplot;\n      by index;\n      if index=100 then do;\n    \
  \    CRISK=0.01952; CRETURNS=0.04768;\n      end;\nrun;\n\nproc sgplot data=frontier;\n\
  \      title \"Optimal Portfolio Allocations\";\n      lineparm x=0 y=&fr slope=&max_sharpe\
  \ / lineattrs=graph6(thickness=4) legend='Capital Allocation Line';\n      series\
  \ x=RISKS Y=RETURNS / legend='Efficient Frontier' lineattrs=graph1(thickness=3);\n\
  \      scatter x=RRisks Y=RReturns / legend='Unoptimized Portfolios' markerattrs=(color=circlefilled\
  \ size=3);\n      scatter x=CRISK Y=CRET / legend='Initial Portfolio' markerattrs=(color=starfilled\
  \ size=6);\n      inset \"Risk Free Rate = 1.78%\" \"Maximum Sharpe Ratio =0.36\"\
  \ / border title=\"Portfolio Statistics\" position=topleft;\n      xaxis label='Portfolio\
  \ Standard Deviation' valuesformat=percent.2 (0 to 0.11 by 0.02);\n      yaxis label='Portfolio\
  \ Returns' valuesformat=percent.2 (0 to 0.04 by 0.05);\nrun;\ntitle;\n```\n\n\n\n\
  \n投资组合持仓的集中度是均方差优化（`MVO`）方法经常被提及的缺点。然而，`MVO` 除了组合集中度外，还存在其他局限性，包括其一些在现实设定中不符合实际的基本假设。例如，`MVO`\
  \ 假设投资者关注所有的波动性，而实际上，大多数投资者只关注损失领域的波动性。`MVO` 也不允许将投资者的主观观点纳入组合决策中。此外，它假设所有投资者都有单一的持有期。`MVO`\
  \ 的分配对输入变量的值极其敏感，这使得在输入变量存在不确定性时，它本质上是不稳定的。所有这些缺陷导致了其他组合优化方法的发展，例如 `Black-Litterman`、`Risk-Parity`（风险均分）、`Mean-CVaR`\
  \ 以及稳健组合优化方法。`Black-Litterman` 和 `Risk-Parity` 基于非线性确定性规划，因此我们将首先研究这些方法，然后是基于随机规划的\
  \ `Mean-CVaR` 方法，最后是基于稳健优化的 `Robust Portfolio optimization`。\n\n## Black-Litterman\
  \ 组合优化\n\n为了克服 `MVO` 的某些缺点，Fisher Black 和 Robert Litterman 在一系列出版物（1990–1992）中提出了\
  \ `Black-Litterman` 模型，作为一种在优化组合之前，将组合经理的观点纳入市场收益率均衡估计中的方法。\n\n正如我们一常所做的那样，让我们专注于解释这种方法的概念框架，而不深入探讨其数学框架。`MVO`\
  \ 和 `Black-Litterman` (`BL`) 方法之间的主要区别在于进入优化问题的输入内容。`MVO` 应用的是原始历史收益率和协方差数据，而 `BL`\
  \ 在优化中使用混合收益率和协方差数据。混合收益率是从组合经理对组合内资产相对于其均衡收益率的性能（绝对和相对观点）估计出来的。均衡收益率通过 `CAPM` 市场组合通过反向优化计算，其中每个资产的市场权重作为反向优化的输入。由于观点本质上是概率性的，它们为协方差矩阵引入了不确定性，然后进行相应的调整以反映这些观点。因此，我们可以将\
  \ `BL` 方法看作是一种基于贝叶斯的 `MVO` 方法，其中混合收益率是从其先验和观点中估计出的后验均值，这些观点是基于先验的未来预期。\n\n让我们用具有多元正态概率分布的均衡收益率向量表示为\
  \ `R[`E`] ∼ `N(`μ`,`Σ`)`，并将我们的观点表示为 `v` ∼ `N(`P``μ`,`Ω`)`。观点存储在我们持有观点的资产 `P` 矩阵中。观点中包含的信息（可能是宇宙中资产的绝对或相对性能）存储在\
  \ `Q` 矩阵中。我们观点的不确定性在 `Ω` 矩阵中表示。根据贝叶斯法则，我们均衡收益率将影响我们对收益后验概率的观点，如公式 (9.6) 所示。\n\n\
  ```\np(μ|v) α p(v|μ) ��⋅  p(μ) (9.6)\n```\n\n我们也可以将 `μ` 的后验概率分布表示为多元正态分布。\n\n```\n\
  p(μ|v)  = Ν(μ[BL],Σ[BL]) (9.7)\n```\n\n根据上述内容，混合收益率向量及其修正协方差矩阵的公式计算如下。\n\n$$\n\\\
  begin{array}{l} {E\\left( R_{P} \\right) = \\\\mu\\_{BL} = \\\\left\\\\lbrack {\\\
  \\left( {\\\\tau\\text{Σ}} \\right)^{- 1} + P^{\\prime}\\text{Ω}^{- 1}P} \\right\\\
  \\rbrack^{- 1}\\\\left\\\\lbrack {\\\\left( {\\\\tau\\text{Σ}} \\right)^{- 1}\\\
  mu + P^{\\prime}\\text{Ω}^{- 1}Q} \\right\\\\rbrack} \\\\\\\\ {\\\\text{Σ}\\_{P}\
  \ = \\text{Σ}\\_{BL} = \\left\\\\lbrack {\\\\left( {\\\\tau\\text{Σ}} \\right)^{-\
  \ 1} + P^{\\prime}\\text{Ω}^{- 1}P} \\right\\\\rbrack^{- 1}} \\\\ \\\\ \\\\ \\end{array}\
  \ (9.8)\n$$\n\n在继续之前，让我们总结实施 `BL` 优化所需的的相关信息。\n\n*   `μ` 是我们宇宙中资产均衡收益率的 (`n`×1)\
  \ 向量。\n*   `Σ` 是我们宇宙中资产超额收益的 (`n`×`n`*) 协方差矩阵。\n*   `P` 是我们持有观点的资产 (`k`×`n`*) 矩阵。在\
  \ `P` 的元素中，对于持有绝对观点的资产记录值为 1。例如，如果我们的第 `k`^(`t**th**`) 个观点是第 `n`^(`t**th**`) 个资产将获得\
  \ 2% 的月收益率。\n\n\n\n\n\n所有观点都预计在下一个持有期内将保持不变。对主动投资的置信度 `τ` 为 `0.05`。我们还假设样本投资组合中资产计算出的平均每月收益率与其均衡预期收益率相同，尽管可能并非如此。但为了演示之目的，这一假设已经足够。在表\
  \ 9.2 中，经理持有的前两个观点是：`ABBV` 和 `HD` 在下个月的持有期内绝对收益率分别为 `2%` 和 `3%`。这些值分别大于它们 `1.31%`\
  \ 和 `1.19%` 的均衡收益率。因此，对这两种资产的观点显然是乐观的。第三个观点是相关的，即 `DG` 在同一持有期内的表现将低于 `TSCO` 约 `20%`（按比例而言）。该观点对\
  \ `DG` 是不利的，而对 `TSCO` 是有利的。此外，经理对前两个观点有 `8%` 的不确定性，但对第三个观点非常有信心，因此产生了 `2.5%` 的不确定性。8\n\
  \n程序 9.5A 显示了用于将均衡收益率与我们在表 6.11 中提出的经理观点进行混合的 SAS 程序。实现 BLO 的 SAS 程序首先使用 `%DATAPULL`\
  \ 宏来下载 `PMATRIX` SAS 数据集，该数据集包含资产范围以及显示经理持有观点的指示器；`QRET` 数据集，包含观点信息（绝对收益和相对收益）；以及\
  \ `OMEGA` 数据集，该数据集包含与每个观点相关的不确定性。如果你之前还没有这样做，还应该下载 `PORTFOLIO_RETURNS` 和 `PORTFOLIO_COVARIANCES`\
  \ SAS 数据集。接下来，我们引入了宏变量，即无风险利率（`%RFR`）、VaR 阈值（`%BETA`）、主动管理的置信度（`%TAU`）以及最大可承受风险（`%MAX_RISK`）。随后，我们调用\
  \ `IML` 过程并使用 `USE` 和 `READ` 语句将所有所需数据集读取到相应的矩阵中。\n\n### 程序 9.5A：使用 PROC IML 将经理观点混合资产收益和协方差\n\
  \n```sas\n/* Using PROC IML to obtain Blended Expected Returns and Covariances */\n\
  %datapull(pmatrix,pmatrix.sas7bdat);\n%datapull(omega,omega.sas7bdat);\n%datapull(qret,qret.sas7bdat);\n\
  %let rfr=0.00178;/*Risk-Free Rate*/\n%let alpha=0.99;/*VaR Threshold*/\n%let tau=0.05;/*Weight\
  \ of active risk*/\n%let max_risk = 0.045;\n/* Use PROC IML to set reverse optimization\
  \ obtain Revised Expected Returns and Covariances Forecast*/\nproc iml;\n      /*read\
  \ subjective views (asset and returns) into vectors*/\n      use PMatrix; /*asset\
  \ with subjective views*/\n      read  all var _NUM_ into p [colname=NumerNames\
  \ rowname=Views];\n      use qret; /*subjective performances*/\n      read all var\
  \ _all_ into q[colname=NumerNames rowname=Views];\n      use omega; /*Confidence\
  \ level of views*/\n      read all var _all_ into omega[colname=NumerNames rowname=Views];\n\
  \n      *print p q;\n      /* Read equilibrium returns and covariances into EQRET\
  \ and SIGMA*/\n      use Portfolio_Returns;\n      read all var _num_ into eqret[colname=NumerNames\
  \ rowname=Ticker];\n      read all var _char_ into assets[colname=CharNames];/*Asset\
  \ names*/\n\n      *print eqret;\n      use Portfolio_Covariances;\n      read all\
  \ var _num_ into sigma[colname=NumerNames rowname=Ticker];\n\n      *print sigma;\n\
  \      /*Compute revised expected returns and covariances*/\n      RReturns=inv(inv(&tau*sigma)+t(p)*(inv(omega))*p)*(inv(&tau*sigma)*eqret+t(p)*(inv(omega))*q);\n\
  \      RCovariances=sigma+inv(inv(&tau*sigma)+t(p)*(inv(omega))*p);\n      *print\
  \ RReturns[colname='Returns']\n```\n\n\n\n\n```\n/*Black-Litterman Portfolio optimization\
  \ using PROC OPTMODEL*/\nproc optmodel;\n      /* declare sets and parameters */\n\
  \      set <str> ASSETS;\n      num returns {ASSETS};\n      num eqreturns {ASSETS};\n\
  \      num covariance {ASSETS, ASSETS};\n\n      /* read revised portfolio data\
  \ from SAS  data sets */\n      read data Revised_Portfolio_Returns into ASSETS=[Ticker]\
  \ returns=returns eqreturns;\n      read data Revised_Porfolio_Covariances into\
  \ [Ticker]  \n                  {j in ASSETS} <covariance[Ticker,j]=col(j)>;\n\n\
  \      /******************************************/\n      /*            Same as\
  \ Program 9.1             */\n      /*****************************************/\n\
  \      print Variance.ub Variance.dual;\n      print {j in ASSETS: Weights[j]>1e-4}\
  \ Weights percent8.2\n                  {j in ASSETS: Weights[j]>1e-4} returns percent8.2\n\
  \                  {j in ASSETS: Weights[j]>1e-4} eqreturns percent8.2;\n\n    \
  \  /* write data to SAS data sets */\n      create data blmax from [Name]={j in\
  \ ASSETS: Weights[j]>1e-4}\n                  Weights=Weights;\nquit;\n\nproc sgpie\
  \ data=blmax;\n      title1 font=swissb height=2 'Asset Allocations from Black-Litterman\
  \ Portfolio Optimization';\n      title2 font=swissb height=2 '(Return Maximization)';\n\
  \      pie  Name / response=Weights otherpercent=1  statfmt=percent8.2  \n     \
  \ datalabelloc=callout;\nrun;\n\ntitle1;\ntitle2;\n```\n\n## 输出 9.5：使用 PROC OPTMODEL\
  \ 的 Black-Litterman 优化 (BLO) 投资组合统计数据\n\n| ![image](img/Ch09_14_1.jpg) |\n\n将经理的观点融合到均衡收益中的影响是不容忽视的。在输出\
  \ 9.5 中，我们观察到 `ABBV` 的投资组合分配从 `MVO` 中的 `0.02%` 增加到 `BLO` 中的 `2.59%`，而 `DG` 的分配从\
  \ `38.57%` 减少到 `22.10%`。此外，之前未包含 `MVO` 获取的最优分配中的 `TSCO` 现在的投资组合分配为 `12.78%`。注意融合收益（`RETURNS`）与均衡收益（`EQReturns`）之间的差异。除了\
  \ `DG` 之外，我们的大多数观点都是正面的，因此对融合收益的整体影响是积极的。在多元化方面，我们也从 `12` 只股票增加到 `13` 只，没有任何资产控制超过投资组合中资本的\
  \ `23%`。`BLO` 的主要收益体现在投资组合预期收益和多样性的边际改进上。通过采用 `BLO`，我们每月获得了约 `5` 个基点，这相当于每年约 `60`\
  \ 个基点的改进。虽然百分比金额看起来可能不是重大改进，但如果你考虑到对于 `1 亿美元` 的投资组合来说，60 个基点的改进等同于 `60 万美元` 的额外潜在收益，加上多样性的提高，那么\
  \ `BLO` 方法的价值就更具吸引力了。\n\n## 风险均权重优化\n\n投资组合优化的风险均权重方法（`RPO`）与 `MVO` 方法的区别在于，`MVO`\
  \ 侧重于资本分配，而风险均权重关注风险的分配。因此，该方法的主要目标是确定资产池中的资本分配，以实现分配给每个资产的预期风险预算。尽管我们将在演示中使用等额风险分配，但在实践中没有必要这样做。此外，风险分配可以以绝对或相对的形式进行。我们将在示例中使用相对风险分配。\n\
  \n在开始示例之前，让我们先从 `RPO` 的概念框架开始。从 `MVO` 方法中，我们知道投资组合风险可以写成每个资产的边际贡献的加权和，或者每个资产对投资组合总风险的贡献之和，如下所示\n\
  \n$\\sigma_{p}\\text{}=\\sqrt{w^{\\prime}\\text{Σ}w} = {\\sum\\limits_{_{i = 1}^{N}{w_{i}MRC_{i}}}\
  \ = {\\sum\\limits_{_{i = 1}^{N}{RC_{i}}}$      (9.12)\n\n其中第 $i^*$(**第 $t$ 份**)资产对投资组合整体风险的边际贡献可以写为\
  \ \n\n$MRC_{i} = \\frac{\\partial\\sigma}{\\partial w_{i}} = \\frac{\\left( {\\\
  text{Σ}w} \\right)_{i}}{\\sqrt{w^{\\prime}\\text{Σ}w}}$      (9.13)\n\n从这里，我们可以计算每个资产对投资组合整体风险的相对贡献\
  \ `RRC[i]`，即每个资产的风险贡献占投资组合总风险的比例。\n\n$RRC_{i} = \\frac{RC_{i}}{\\sigma_{p}\\left(\
  \ w \\right)} = \\frac{w_{i}\\left( {\\text{Σ}w} \\right)_{i}}{w^{\\prime}\\text{Σ}w}$\
  \      (9.14)\n\n与 `MVO` 类似的框架，下一步是为投资组合中的每个资产设置所需的风险预算。然而，与 `MVO` 收益和风险约束使用的标量值不同，`RPO`\
  \ 中的风险预算是分配给每个资产的风险分配向量 `RB`。如前所述，根据组合目标为每个资产分配不同的风险预算。但在我们的示例中，我们将假设对组合中的所有 63\
  \ 只股票进行等额风险分配。记住，`RPO` 涉及在满足最小收益或最大风险约束的情况下，找到产生所需风险预算的组合权重，可以表示如下。\n\n$\\begin{array}{l}\
  \ {\\\\min\\limits_{w_{i}}{\\sum\\limits_{i = 1}^{N}\\left( RRC_{i} - RB_{i}} \\\
  right)^{2}}} \\\\ {{\\text{s.t}\\.~~~}\\text{预计}\\left( R_{p} \\right) = {\\sum\\\
  limits_{i = 1}^{n}{w_{i}}}\\text{预计}\\left( R_{i} \\right)}} \\geq 1.79\\%,} \\\\\
  \ {{\\text{~~~~~~~~}\\sigma_{p}\\text{}=\\sqrt{\\sum\\limits_{i = 1}^{n}{w_{i}w_{j}Cov\\\
  left( {R_{i}},R_{j}} \\right)}} \\leq 4.5\\%,{\\sum\\limits_{i = 1}^{n}w_{i}} =\
  \ 1} \\\\ \\\\end{array}$      (9.15)\n\n## 在 SAS 中实现风险均权重优化\n\n我们的示例投资组合仅由股票组成，并且包含相当多的证券，因此它不一定是部署\
  \ `RPO` 方法的理想组合。更常见的做法是将 `RPO` 用于结合了债券等低风险资产和股票等较高风险资产的投资组合中实现风险分配。在这种情况下，优化后组合的资产分配将显著偏向低风险资产，以使其与风险资产的风险贡献相等。然后使用杠杆将组合进一步推向所需的整体风险位置。尽管如此，我们将使用该组合演示\
  \ SAS 程序，并将更符合现实的 SAS 代码实现留给您自行探索。\n\n程序 9.6A：使用 PROC OPTMODEL 实现风险均权重优化\n\n\n\n\
  \n```sas\n/*使用 PROC OPTMODEL 进行风险均等投资组合优化*/\n%let rfr=0.00178; /*无风险利率*/\n%let beta=0.99;\
  \ /*VaR 阈值*/\n%let minimum_return = 0.01787;/*组合最小收益率*/\n%let maximum_risk=0.045;\
  \ /*最大标准差*/\n\nproc optmodel;\n      /******************************************/\n\
  \      /*           与程序 9.1 相同           */\n      /*****************************************/\n\
  \      /*统计组合中的证券数量*/\n      impvar N=card(ASSETS);\n              \n      /*计算风险预算，当前为等风险贡献*/\n\
  \      impvar rb{i in ASSETS}=1/N;\n              \n      /*计算相对风险贡献 rrc*/\n   \
  \   impvar rrc{i in ASSETS} = ((sum{j in ASSETS} \n            covariance[i,j] *\
  \ Weights[j])* Weights[i])/(Portfolio_Variance);\n              \n      /******************************************/\n\
  \      /*           与程序 9.1 相同           */\n      /*****************************************/\n\
  \      /*声明约束条件 */\n      con Portfolio_Weights: sum {j in ASSETS} Weights[j] =\
  \ 1;\n      con Minimum_return: Portfolio_Return >= &minimum_return;\n      con\
  \ Maximum_Risk: Portfolio_Risk<=&maximum_risk;\n              \n      /*声明目标函数 */\n\
  \      min RiskDeviation =sum{i in Assets} (rrc[i] - rb[i])**2;\n      solve;\n\
  \              \n      /******************************************/\n      /*  \
  \         与程序 9.1 相同           */\n      /*****************************************/\n\
  \      create data rpmin from [Ticker]={j in ASSETS: Weights[j]>1e-4}\n        \
  \       Weights=Weights;\nquit;\n```\n\n程序 9.6A 显示了用于我们 63 只股票样本组合的风险均等优化（RPO）的\
  \ SAS 程序。同样，RPO 的 SAS 代码与我们之前用于优化的代码在许多步骤上是相同的，因此我们仅突出它们之间的差异。完整的优化代码可以在书籍的 GitHub\
  \ 页面上找到。\n\n首先，我们在代码中包含了所有的约束宏变量，以便能够灵活地施加任何约束组合（最小收益率和/或最大风险）。将 SAS 数据集读入问题以及将组合权重作为决策变量的代码与\
  \ MVO 问题中的代码相同，因此它们未包含在所示程序 9.6A 所示的代码片段中。接下来，我们使用隐式变量和 `CARD` 语句来统计投资池中股票的数量（`N`），然后用它来创建风险预算隐式变量（`RB`）。`RB`\
  \ 是一个 (`N`×1) 的风险分配向量。在 `RB` 向量中，每只股票分配的相对风险预算为组合总风险的 $\\left( \\frac{1}{N} \\right)\
  \ = \\frac{1}{63} = 1.59\\%$。9\n\n下一组代码用于计算每只股票的相对风险贡献 `RRC[i]`。注意，每只股票的 `RRC[i]`\
  \ 计算方式为：该股票与组合中其他所有股票的协方差加权和与组合总风险之比。然后，我们通过在代码中包含最小收益率和/或最大风险约束来声明约束，从而提供了灵活部署任一种约束的便利。\n\
  \n### 使用 OPTMODEL 实现风险均等优化\n\n```sas\n/*假设等权重时计算风险贡献*/\nimpvar EQWeights{i in ASSETS}=1/N;\n\
  \nimpvar EQPortRisk=sqrt(sum {i in ASSETS, j in ASSETS}covariance[i,j] * EQWeights[j]);\n\
  \nimpvar rc{i in ASSETS}=(((sum{j in ASSETS}covariance[i,j]*EQWeights[j])*EQWeights[i])/EQPortRisk);\n\
  \nimpvar SEQPortRisk =sum[j in ASSETS]rc[j];\n\nprint rc percent.2 SEQPortRisk percent.2;\n\
  ```\n\n\n\n\n到目前为止，我们检查的所有优化问题都涉及问题数据值已知的情景。这类问题的优化通常被描述为确定性规划。然而，在许多情况下，我们对一个或多个问题数据的值是不确确定的。在这些情况下，通常使用随机规划来优化目标函数。随机规划的主要目标是在给定问题随机部分期望值的情况下，根据问题的确定性部分来确定最有利的行动方案。解决随机规划问题的三类框架类型为：\n\
  \n*   **前瞻模型（Anticipative model）**：在这种方法中，问题由确定性目标函数和概率约束组成。由于约束的未来实现是不确定的，因此优化的目标是选择满足约束所有可能场景的最优行动方案。\n\
  *   **自适应模型（Adaptive model）**：在这种方法中，问题同时包含概率目标函数和约束。然而，在模型完全优化之前，关于随机变量的一些信息将会揭示。因此，最优决策将部分取决于已知信息。自适应优化通常被描述为学习环境中的优化。\n\
  *   **后续模型（Recourse model）**：这类模型结合了前瞻模型和自适应模型，从而创建了目标函数同时包含确定性和随机成分的优化问题。数学上，具有后续的随机规划问题定义为：目标函数\
  \ `f(x, ω)` 是确定性变量 `x` 和具有已知概率分布的随机变量 `ω` 的函数，可以写成：\n\n```\n\\begin{array}{l} {\\\
  \\min f\\\\left( {x,\\\\omega} \\\\right) = c^{\\\\prime}x + \\\\text{Ε}\\_{\\omega}\\\
  \\leftlbrack {\\\\Phi\\\\left( {x,\\\\omega} \\\\right)} \\\\right\\\\rbrack} \\\
  \\ {\\\\text{s}\\\\text{.t}\\\\text{.~~~~~}Ax = b,x \\geq 0} \\\\ \\\\end{array}\
  \ \n```\n(9.16)\n\n上述数学公式是经典的两阶段后续随机规划问题的通用框架，其中 `c′x` 代表第一阶段优化，`Φ(x, ω)` 是下所示第二阶段优化的最优值。\n\
  \n```\n\\begin{array}{l} {\\\\Phi\\\\left( {x,\\\\omega} \\\\right) = \\\\min Q\\\
  \\left( \\\\omega \\\\right)^{\\\\prime}y\\\\left( \\\\omega \\\\right)} \\\\ {\\\
  \\text{s}\\\\text{.t}\\\\text{.~~~~~}D\\\\left( \\\\omega \\\\right)x + L\\\\left(\
  \ \\\\omega \\\\right)y\\\\left( \\\\omega \\\\right) = h\\\\left( \\\\omega \\\\\
  right),y\\\\left( \\\\omega \\\\right) \\geq 0} \\\\ \\\\end{array} \n```\n(9.17)\n\
  \n两阶段随机优化的核心思想是：首先优化第一阶段问题，以为第二阶段问题可能的所有的所有场景集合 `Ω` 确定第一阶段决策变量 `x` 的最优值。接着，确定随机变量的期望值。随后优化第二阶段问题，以确定第二阶段决策变量\
  \ `y` 的最优值。\n\n随机规划中出现的一个问题是如何处理随机变量的分布。众所周知，`ω` 的可能值是无限的；因此，通常将两阶段随机规划问题重构为其确定性等效形式，如下：\n\
  \n```\n\\begin{array}{l} {\\\\min f\\\\left( {x,\\\\omega} \\\\right) = c^{\\\\\
  prime}x + \\\\text{Ε}\\_{\\omega}\\\\leftlbrack {\\\\Phi\\\\left( {x,\\\\omega}\
  \ \\\\right)} \\\\right\\\\rbrack} \\\\ {\\\\text{s}\\\\text{.t}\\\\text{.~~~~~}Ax\
  \ = b,x \\geq 0} \\\\ {\\\\text{s}\\\\text{.t}\\\\text{.~~~~~}D\\\\left( \\\\omega\
  \ \\\\right)x + L\\\\left( \\\\omega \\\\right)y\\\\left( \\\\omega \\\\right) =\
  \ h\\\\left( \\\\omega \\\\right),for \\\\omega \\\\in \\\\Omega} \\\\ {\\\\text{s}\\\
  \\text{.t}\\\\text{.~~~~~}y\\\\left( \\\\omega \\\\right) \\geq 0} \\\\ \\\\end{array}\n\
  ```\n(9.18)\n\n其中 `Φ(x, ω)` 是近似第二阶段的某种函数。\n\n### 随机组合优化\n\n我们目前检查的许多金融优化问题（如负债资金、资本项目选择和组合优化）假设我们确定知道每个参数的未来值，这是不现实的。随机优化为我们提供了灵活性，能够纳入更现实的问题特征，并能够解决它们。在风险平衡组合配置问题中，我们通过优化组合来实现特定的风险暴露。在某些情况下，我们对风险暴露本身是不确定的，并且必须优化组合以减少对风险的暴露。例如，对于养老基金和保险公司来说，未来负债的真实规模是未知的。同样，如果使用确定性规划来对未来以外币收或支付的现金流进行对冲，其波动程度是不现实的。\n\
  \n\n\n\n\n我们知道投资组合的风险价值（Value-at-Risk, VaR）是指在正常市场条件下，在具有 `α` 置信水平的时间窗口内，投资组合可能遭受的最大市场相关损失。它也可以被定义为在相同时间内，在\
  \ `(1−α)` 置信水平下投资组合可能遭受的最小市场相关损失。在第五章中，我们研究了各种 VaR 规范。然而，我们并没有讨论在投资组合背景下对 VaR 建模的一些挑战。这些挑战包括：投资组合的\
  \ VaR 不是一致的，因为资产组合的 VaR 可能大于组合中单个资产 VaR 之和。组合 VaR 可能缺乏次可加性（subadditivity），这与组合风险的多样化原则不一致，该原则指出组合的风险不会大于组合中每个资产独立风险之和。因此，纯粹通过\
  \ VaR 规范对风险进行条件化来优化组合，实际上可能会导致组合更加集中。此外，VaR 通常是非平滑（nonsmooth）且非凸（nonconvex）函数，这使得它们难以优化，因为它们是可能产生多个局部最小值的不连续函数。最后，VaR\
  \ 并没有告诉我们如果确实超过了投资组合的 VaR，可能会发生的损失幅度。\n\n为了解决 VaR 的缺陷而开发的一种一致风险量是条件风险价值（Conditional\
  \ Value-at-Risk, CVaR），它计算在指定时期内超过置信水平后可能发生的平均损失。例如，99%-CVaR 计算的是在指定时期内，概率最低 1%\
  \ 的结果中组合价值的市场相关损失的平均值。它也常见的预期缺口（Expected Shortfall, ES）、均值缺口（Mean Shortfall, MS）或条件尾部风险而称。\n\
  \n### 投资组合优化问题\n\n在我们深入研究 CVaR 的数学框架之前，让我们先开始构建投资组合优化问题的步骤。首先，我们处理的是市场相关风险，这些是随机事件，因此让我们用向量\
  \ `y` 表示这些随机事件的集合。我们也用向量 `W` 表示投资者可以做出的组合选择或分配。由于我们只对损失领域感兴趣，我们也可以用函数 `f(w,y)` 来反映我们的组合选择和随机事件的共同影响。这里需要注意的是，我们的损失函数值在组合性能的损失域内为正，在收益域内为负。12\
  \ 如果我们假设 `y` 具有已知概率分布，那么在固定组合选择 `w` 下的损失函数的累积分布函数可以写为：\n\n`Ψ(w,γ) = P[f(w,y) ≤ γ]\
  \ = ∫[f(w, y) ≤ γ]p(y)dy` (9.19)\n\n注意公式 (9.19) 是投资组合损失不超过某个实值 `γ` 的概率。在建立了公式 (9.19)\
  \ 后，我们可以定义给定置信水平 `α ∈ [0,1]` 下的 VaR 为：\n\n`VaRα = min {γ ∈ℝ:Ψ(w,γ)≥α}` (9.20)\n\n\
  公式 (9.20) 可以描述为组合选择 `w` 可能遭受的最小损失，使得累积分布 `Ψ(w,γ)` 至少等于阈值 `α`。从公式 (9.20) 出，我们随后将给定置信水平\
  \ `α ∈ [0,1]` 下的 CvaR 描述为：\n\n$$\n\\begin{array}{l} {CVaR_{\\alpha}\\left( w \\\
  right) = \\\\frac{1}{\\left( {1 - \\alpha} \\right)}{\\int\\_{f{({w,y})} \\geq \\\
  gamma}{f\\left( {w,y} \\right)p\\left( y \\right)}}dy} \\\\\\\\ {\\text{~~~~~~~~~~~~~~~~~~=}\\\
  \\frac{1}{\\left( {1 - \\alpha} \\right)}{\\int\\_{f{({w,y})} \\geq VaR_{\\alpha}{(w)}}{f\\\
  left( {w,y} \\right)p\\left( y \\right)}}dy} \\\\\\\\ \\\\end{array}\n$$ (9.21)\n\
  \n我们可以从公式 (9.21) 中推导出，`CVaRα` 不可能低于 `VaRα`，因为 `VaRα` 是积分表达式的下支撑。此外，我们可以从公式 (9.21)\
  \ 中看出，`CVaRα` 可以描述为损失分布 `f(w,y) ≥ VaRα` 的平均值或积分。这些特征共同意味着 `CVaRα` 关于 `α` 是连续的，并且关于组合选择\
  \ `W` 和 `α` 是联合凸的。公式 (9.21) 还意味着损失函数的 `α` 累积分布是连续的且存在最小值。如果我们假设 `y` 服从多元正态分布，则可以将\
  \ `VaRα` 和 `CVaRα` 写为组合收益和方差的函数。这种方法通常被称为：\n\n$$VaR_{\\alpha}(w) = \\mu(w) + \\\
  Phi^{-1}(\\alpha)\\sqrt{w^{\\prime}\\Sigma}$$ (9.22)\n\n$$CVaR_{\\alpha}(w) = \\\
  mu(w) + \\frac{\\Phi^{-1}(\\alpha)}{1-\\alpha}\\sqrt{w^{\\prime}\\Sigma}$$ (9.23)\n\
  \n其中 `μ(w)=E[R]` 且 `\\sqrt{w^{\\prime}\\Sigma}=\\sigma`。Φ¹(α)` 是 `α` 的反累积函数。你可能已经在我们在所有组合优化的\
  \ SAS 代码中注意到这两个值。事实证明你也可以对于组合权重的某些函数来最小化这些表达式。结果组合分配将与图 9.1 所示的 MVO 问题相同。我们将让你创建\
  \ SAS 程序来实现该优化。\n\n**图 9.1 来自预期缺口的优化组合**\n\n![image](img/Ch09_fig_1)\n\n到为止，我们假设\
  \ `y` 是连续的。当 `y` 服从离散概率分布时，`CVaRα` 可以显示为形式：\n\n$$CVaR_{\\alpha}\\left( w \\right)\
  \ = \\frac{1}{\\left( {1 - \\alpha} \\right)}{\\sum\\limits_{f{({w,y})} \\geq VaR_{\\\
  alpha}}{(w)}}{f\\left( {w,y} \\right)p_{j}\\left( y \\right)}}, j = 1,...,n$$ (9.24)\n\
  \n### 使用条件风险价值进行优化\n\n现在我们已经开发了 `CVaRα` 的数学模型，让我们继续开发使用它优化组合的框架。在我们之前，你会注意到 `CVaRα`\
  \ 函数包含 `VaRα`，我们之前描述过它是难以处理的。这个问题通过使用辅助函数 `Fα` 代替公式 (9.21) 来计算 `CVaRα` 避免了，如下所示：\n\
  \n$$\n\\begin{array}{l} {F_{\\alpha}\\left( {w,\\\\gamma} \\right) = \\gamma + \\\
  frac{1}{\\left( {1 - \\alpha} \\right)}{\\int\\_{f{({w,y})} \\geq VaR_{\\\\alpha}}{(w)}}{\\\
  left( {f\\left( {w,y} \\right) - \\gamma} \\right)^{+}p\\left( y \\right)}}dy} \\\
  \\\\\\\\end{array}\n$$ (9.25)\n\n\n\n\n其中 `f(w,y)−γ)^+ = max (f(w,y)−γ,0)`。`Fα`\
  \ 在优化问题方面具有所有所需的特征，因为它是凸的且连续可微的。这意味着我们可以随后推导出 `CVaRα` 为 `Fα` 的最小值，如下所示，它也是关于 `γ`\
  \ 的函数：\n\n$CVaR_{\\\\alpha}\\left( w \\right) = \\min\\limits\\_{w,\\gamma}F_{\\\
  alpha}\\left( {w,\\gamma} \\right)$      (9.26)\n\n从上述公式中观察到，可以在先计算投资组合 `VaRα` 的情况下计算\
  \ `CVaRα`。在现实中，`VaRα` 是优化的副产品，因为 `γ` 是一个支撑点，在最小值处将类似于投资组合损失的 `VaRα`。为了近似积分，我们可以使用蒙特卡洛模拟对有限数量的组合场景进行离散采样，其中每个场景代表从其概率分布\
  \ `p(y)` 中抽取的收益随机向量 `y` 的实现。`Fα` 的近似记为 `F̃α`，可以写为：\n\n${\\widetilde{F}}_{\\\\alpha}\\\
  left( {w,\\gamma} \\right) = \\gamma + \\frac{1}{S\\left( {1 - \\alpha} \\right)}{\\\
  sum\\limits\\_{s = 1}^{S}\\left\\lbrack {f\\left( {w,y} \\right) - \\gamma} \\right\\\
  rbrack^{+}}$      (9.27)\n\n理论上，每个场景应该根据其联合密度函数 `p(y[s])` 加权。然而，对于足够数量的场景 `S`，假设每个场景发生的概率相等更为实用。因此，表达式被除以\
  \ `S`。\n\n在给出优化问题之前，最后一步是指定 `f(w,y)` 的表达式。从投资组合的角度来看，随机向量 `y` 是资产池随机生成的收益向量，而投资组合选择\
  \ `w[j]` 是分配给 `y` 中资产的权重，使得 `f(w,y)` = `w^′y`。将 `y` 替换为 `R` 得到 `f(w,R)` = − `w^′R`，这是我们在之前的优化中使用的投资组合收益公式。使得：13\n\
  \n${\\widetilde{F}}_{\\\\alpha}\\left( {w,\\gamma} \\right) = \\gamma + \\frac{1}{S\\\
  left( {1 - \\alpha} \\right)}{\\sum\\limits\\_{s = 1}^{S}\\left\\lbrack {- w^{\\\
  prime}R_{s} - \\gamma} \\right\\rbrack^{+}}$  9.28\n\n参考公式 (22)，我们现在知道要最小化 `CVaRα`，我们需要在某些约束最小化\
  \ `F̃α`，这些约束将确保函数良好并保持在可行区域内。\n\n$\\begin{array}{l} {\\\\min\\limits\\_{w,\\\\gamma}CVaR_{\\\
  \\alpha}\\left( w \\right) = \\gamma + \\frac{1}{S\\left( {1 - \\alpha} \\right)}{\\\
  sum\\limits\\_{s = 1}^{S}\\left\\lbrack {- w^{\\prime}R_{s} - \\gamma} \\right\\\
  rbrack^{+}}} \\\\ {\\\\text{s}\\\\text{.t.~~}\\\\text{Ε}\\left( R_{p} \\right) =\
  \ {\\\\sum\\limits\\_{i = 1}^{N}{w_{i}}\\\\text{Ε}\\left( R_{i} \\right)}} \\\\\
  \ \\\\geq \\\\overline{R},{\\sum\\limits\\_{i = 1}^{N}w_{i}} = 1} \\\\ \\\\ \\\\\
  end{array}$ 29\n\n最后一个问题将需要处理目标函数中 `-w^′R[j]+` 表达式产生的分段线性。让我们用辅助变量 `z[j]` 替换表达式，并通过这样做对\
  \ `z[j]` 施加额外的约束 `z[j]+w^′R[j]+γ≥ 0`，如优化问题所示。得到的优化问题（即在满足最小收益条件的情况下最小化条件价值风险，CVaR）现在可以写为。\n\
  \n$\\begin{array}{l} {\\\\min\\limits\\_{w,\\\\gamma,z_{s}}CVaR_{\\\\alpha}\\left(\
  \ w \\right) = \\gamma + \\frac{1}{S\\left( {1 - \\alpha} \\right)}{\\sum\\limits\\\
  _{s = 1}^{S}z_{s}},\\\\left( {s = 1,...,S} \\right)} \\\\ {\\\\text{s}\\\\text{.t.~~~}}z_{s}\
  \ \\\\geq 0,\\\\{~~~}\\\\left( {s = 1,...,S} \\right)} \\\\ {\\\\text{~~~~~~~z_{s}\
  \ + w^{\\prime}R_{s} + \\\\gamma \\geq 0,\\\\{~~~~}\\\\left( {s = 1,...,S} \\right)}\
  \ \\\\ {\\\\text{~~~~~~~}\\\\text{Ε}\\left( R_{p} \\right) = {\\\\sum\\limits\\\
  _{i = 1}^{N}{w_{i}}\\\\text{Ε}\\left( R_{i} \\right)}} \\\\ \\\\geq \\\\overline{R},{\\\
  sum\\limits\\_{i = 1}^{N}w_{i}} = 1.} \\\\ \\\\end{array}$ 30\n\n我们也可以写出在条件价值风险限制条件下最大化投资组合收益的数学表达式：\n\
  \n$\\begin{array}{l} {\\\\max\\limits\\_{w,\\\\gamma,z_{i}}\\\\text{Ε}\\left( R_{p}\
  \ \\right) = {\\\\sum\\limits\\_{i = 1}^{N}{w_{i}}\\\\text{Ε}\\left( R_{i} \\right)}}\
  \ \\\\ {\\\\text{s}\\\\text{.t.~~~}CVaR_{\\\\alpha}\\left( w \\right) = \\\\gamma\
  \ + \\frac{1}{S\\left( {1 - \\alpha} \\right)}{\\sum\\limits\\_{s = 1}^{S}z_{s}}\
  \ \\\\leq u_{\\\\alpha_{j}},\\\\left( {s = 1,...,S} \\right)} \\\\ {\\\\text{~~~~~~~~z_{s}\
  \ \\\\geq 0,\\\\{~~~}\\\\left( {s = 1,...,S} \\right)} \\\\ {\\\\text{~~~~~~~z_{s}\
  \ + w^{\\prime}R_{s} + \\\\gamma \\geq 0,\\\\{~~~~}\\\\left( {s = 1,...,S} \\right)}\
  \ \\\\ {\\\\text{~~~~~~~{\\\\sum\\limits\\_{i = 1}^{N}w_{i}} = 1.} \\\\ \\\\ \\\\\
  text{~~~~~~~} \\\\ \\\\end{array}$ 31\n\n| 尽管优化问题的数学推导相当复杂，但从概念上说，考虑以下优化可能会更容易。最小化：在给定的置信水平\
  \ `α` 下，优化涉及寻找资产配置 `w[j]`、最小价值风险 `γ` 和场景偏差 `z[s]`，使得在投资组合 VaR 超过的情况下不降低收益以获得最低平均损失\
  \ `CVaRα`。最大化：在给定的置信水平 `α` 下，优化涉及寻找资产配置 `w[j]`、价值风险 `γ` 和场景偏差 `z[s]`，使得在投资组合 VaR\
  \ 超过的情况下不超过指定的平均损失 `CVaRα` 以获得最大收益。 |\n\n| --- |\n\n在 SAS 中实现均值-CVaR 优化 |\n\n\n\n\
  在 SAS 中实现均值-CVaR 优化涉及两个步骤。首先，我们将使用蒙特卡洛模拟生成 `S` 个投资组合场景。其次，我们将模拟的收益率读入优化问题中，以优化目标函数，从而推导出目标函数最优值处的决策变量值。\n\
  \n我们的第一步将使用 `IML` 过程完成。在第二步中，我们将调用 `OPTMODEL` 过程。我们假设投资组合中 63 只股票的收益率服从多元正态分布。因此，我们可以从收益率向量（存储在名为\
  \ `PORTFOLIO_RETURNS` 的 SAS 数据集中的）和协方差矩阵（存储在名为 `PORTFOLIO_COVARIANCES` 的 SAS 数据集中的）中模拟它们的联合收益率。程序\
  \ 9.7A 显示了在 `IML` 过程中用于模拟 1,000 个投资组合场景的 SAS 代码。调用 `IML` 过程后，历史组合收益率和协方差被读入 `RETURNS`\
  \ 向量和 `SIGMA` 矩阵。然后我们模拟 1,000 个投资组合场景。我们还为每个模拟收益率向量创建了场景索引。然后我们将场景索引和模拟收益率保存到名为\
  \ `SIMULATED_RETURNS` 的 SAS 数据集中。\n\n### 程序 9.7A：使用 PROC IML 为 CVaR 优化模拟 1,000 个投资组合场景\n\
  \n```sas\n/* Use PROC IML to Simulate 1,000 Portfolio Scenarios*/\n%let j =1000;\n\
  \nproc iml;\n      /* Read returns and covariances into EQRET and SIGMA*/\n    \
  \  use Portfolio_Returns;\n      read all var _num_ into returns [colname=NumerNames];\n\
  \      read all var _char_ into assets[colname=CharNames];\n      use Portfolio_Covariances;\n\
  \      read all var _num_ into sigma[colname=NumerNames rowname=Ticker];\n     \
  \ call randseed (7564321);    /*Random Seed*/\n      %let r =nrow(eqret);\n    \
  \  SRet =RandNormal(&j,returns,sigma);/*Simulate 1000x N-Assets*/\n      SMean =mean(SRet);\
  \ /*calculate sample mean*/\n      SCOV = cov(SRet); /*calculate sample covariance*/\n\
  \      /*Index of Scenarios*/\n      SNum = t(\"SC1\":\"SC&j\");\n      /*Export\
  \ revised expected returns into SAS  data sets*/\n      Anames ='Scenario'||NumerNames;\
  \ /*Variable names*/\n      create Simulated_Returns from SNum SRet [colname=Anames];\n\
  \      append from SNum SRet;\n      close Simulated_Returns;\n```\n```\n\n程序 9.7B\
  \ 显示了使用从 `IML` 过程中模拟的收益率向量实现 95% CVaR 最小化的 SAS 程序。首先，我们使用宏变量（`&ALPHA=0.95`、`&FR=0.0178`\
  \ 和 `&MINIMUM_RETURN=0.179`）分别指定 CVaR 置信水平、无风险利率和最小收益率。然后调用 `OPTMODEL` 过程。使用 `SET`\
  \ 语句，我们创建了两个索引集（`ASSETS` 和 `SCENARIOS`）。参数数组 `RETURNS{ASSET}` 包含实际收益率，而 `SRETURN{ASSET,SCENARIOS}`\
  \ 包含 1,000 个场景的模拟收益率。`COVARIANCE{ASSETS,ASSETS}` 包含宇宙中 63 只股票的协方差。然后使用 `READ` 语句将数据集读入相应的数组。注意，模拟收益率被读入一个\
  \ `S × N` 数组，其中 `S=1000` 是投资组合场景的数量`N=63` 是宇宙中股票的数量。接下来，我们声明决策变量 `WEIGHTS{ASSETS}`（等同于\
  \ `w`）、`OPT_VAR`（等同于 `γ`）以及 `Z{SCENARIOS}`（等同于 `z[s]`）。然后我们使用隐式变量通过解析法计算投资组合的方差和标准差，以及组合风险价值（VaR）和预期缺口。接下来，我们使用另一组隐式变量来计算替代函数\
  \ `FWVaR`，它等同于 `-w'R[j]-γ`。\n\n注意，对于每个场景，我们对宇宙中股票的权重与模拟收益率的积求和。与之前的示例一样，我们还使用隐式变量计算预期收益率和组合收益率，以便比较我们研究的各种方法的性能。\n\
  \n### 程序 9.7B：使用 PROC OPTMODEL 进行 CVaR 最小化\n\n```sas\n/*Implementing Conditional\
  \ Value-at-Risk Optimization PROC OPTMODEL*/\n%let alpha=0.95;\n%let rfr=0.0178;\n\
  %let minimum_return = 0.179;\n\nproc optmodel;\n      /* declare sets and parameters\
  \ */\n      set <str> ASSETS;\n      set <str> SCENARIOS;\n      num returns{ASSETS};\n\
  \      num sreturns {ASSETS,SCENARIOS};\n      num covariance {ASSETS, ASSETS};\n\
  \n      /* read portfolio data from SAS  data sets */\n      read data Portfolio_Returns\
  \ into ASSETS=[Ticker] returns;\n      read data simulated_Returns into SCENARIOS=[Scenario]\
  \ \n      {i in ASSETS} <sreturns[i,Scenario]=col(i)>;\n      read data Portfolio_Covariances\
  \ into [Ticker]  \n      {i in ASSETS} <covariance[Ticker,i]=col(i)>;\n\n      /*\
  \ declare decision variables */\n      var Weights {ASSETS} >= 0;\n      var Opt_VaR>=0;\n\
  \      var Z{SCENARIOS}>=0;\n\n      /*Calculate Portfolio Risk Measures*/\n   \
  \   impvar Portfolio_Variance=sum {i in ASSETS, j in ASSETS}covariance[i,j] * \n\
  \      Weights[i] * Weights[j];\n      impvar Portfolio_Risk = sqrt(Portfolio_Variance);\n\
  \n      /*Value at Risk and Expected Shortfall*/\n      impvar zes =(((2*constant(\"\
  pi\"))**(0.5))*(exp(((2**-\n      0.5)*quantile('normal',&alpha))**2))*(1-&alpha));\n\
  \      impvar VaR=sum {i in ASSETS} \n      Weights[i]*zes;\n      impvar Expected_Shortfall=sum\
  \ {i in ASSETS} \n      Weights[i] * sreturns[i,Scenario];\n\n      /*Calculate\
  \ expected returns*/\n      impvar Portfolio_Returns=sum {i in ASSETS} \n      Weights[i]\
  \ * sreturns[i,Scenario];\n\n      /*Substitute function*/\n      impvar FWVaR=-w'R[j]-gamma;\n\
  \n      /*declare constraints */\n      con Z{SCENARIOS}>=0;\n      con Minimum_Return:\
  \ Portfolio_Returns>=&minimum_return;\n      con Weights_Sum: sum {i in ASSETS}\
  \ Weights[i] = 1;\n\n      /*declare objective */\n      min CVAR=Opt_VaR+1/(&alpha)*(sum{s\
  \ in SCENARIOS}Z[s]);\n      solve;\n\n      /*Portfolio Sharpe Ratio*/\n      var\
  \ Sharpe_Ratio = (Portfolio_Returns-&rfr)/Portfolio_Risk;\n\n      /*Print Optimization\
  \ Outputs*/\n      print Portfolio_Returns Portfolio_Risk Sharpe_Ratio\n      CVAR\
  \ Opt_VaR VaR Expected_Shortfall;\n      print {i in ASSETS: Weights[i]>1e-4} Weights;\n\
  \      {i in ASSETS: Weights[i]>1e-4} returns;\n      quit;\n```\n```\n\n\n\n\n\n\
  输出 9.7 显示了最小化公式 (9.28)中指定的目标函数的结果。你会在问题摘要中大量的变量（1064 个）和约束条件（2002 个）。问题变量包括辅助变量向量\
  \ `Z = [z[1],...,z[S=1,000]]` 的 1,000 个元素、投资组合权重向量的 63 个元素，以及我们优化的 VaR `γ`。2,002\
  \ 个约束包括各 1,000 个 `z[j] + w′R[j] + γ ≥ 0`约束和 `z[s] ≥ 0`约束、最小投资组合收益约束以及全额投资约束。你会注意到，我们优化后的\
  \ CVaR 和 VaR 的目标值，以及使用 delta-正态法计算出的 VaR 和预期缺口（expected shortfall），远低于我们之前在任何投资组合优化中获得的任何值。更重要的是，我们能够在不显著牺牲投资组合性能其他指标（如收益、风险和夏普比率）的情况下，实现这种尾部风险的改进。然而，我们可以看到生成的组合非常集中。事实上，这是我们到目前为止使用的各种优化方法中最集中的投资组合。仅六只股票就占了投资组合权重的\
  \ 97.6%。\n\n优化结果另一个更有的特征是投资组合分配是如何形成的。注意对联合健康（United Health Inc.）、瑞美医疗（ResMed Inc.）和\
  \ Paycom Inc. 的分配增加，而对苹果公司（Apple Inc.）的分配显著减少。前一组公司所在的行业受经济影响较小，因此尾部风险较低，而苹果公司主要销售自主产品，使其更容易受到经济影响。根据我们的投资组合目标，优化算法创建了一个安全优先型投资组合，其中风险价值是安全阈值。在安全优先投资组合优化中，我们的是最小化投资组合收益低于安全阈值的概率。对于我们的优化案例，该概率为\
  \ `(1−α) = 5%`。这意味着在任何一个月内，组合损失超过 5.0%的概率为 5%。此外，当此类损失发生时，有 5%的概率平均损失将超过投资组合价值的\
  \ 7.4%。\n\n## 鲁棒优化\n\n虽然随机优化和鲁棒优化都处理优化问题中的不确定性，但它们的方法非常不同。随机优化在给定问题随机部分期望值的情况下，根据问题的确定性部分来确定最佳行动方案；而鲁棒优化则是确定能够满足问题不确定方面可能出现的所有或大多数情景的最佳行动方案。在鲁棒优化中，目标函数或约束条件可能需要鲁棒性。鲁棒性对于问题的某些参数可以是相对的，也可以是绝对的。鲁棒优化对于问题数据由估计值组成、约束不确定或目标函数极其敏感的优化问题特别有用。\n\
  \n不同类型鲁棒化的主要区别在于每种方法处理不确定的方式。在某些方法中，不确定性集代表有限的场景。在其他规范中，不确定性可以代表一个值范围。通常，我们遇到的不确定性类型由问题决定，而不确定性的大小通常受程度的影响。例如，对于基于区间的不确定性，人们可能希望针对可能的值采取最优行动。\n\
  \n## 约束鲁棒性\n\n确保解对约束具有鲁棒性的想法相当直观。在这个框架下，解对于可能的值必须是可行的。例如，一个具有不确定约束的投资组合经理可能被要求将部分资金持有现金。由于建模时现金金额未知，因此解必须对一个范围具有鲁棒性。数学上，具有约束鲁棒性的优化可以写为：\n\
  \n```\nmin f(x)\ns.t G(x,u) ∈ H\n```\n在上述方程中，`f(x)` 是目标函数，`x` 是决策变量，而 `u ∈ U` 是参数，`G`\
  \ 和 `H` 是结构元素。\n\n## 目标鲁棒性\n\n当我们试图优化的某些特征不确定时，通常需要目标函数具有鲁棒性。因此，我们需要最优解对不确定参数不敏感。例如，人们通常认为，均方差优化（MVO）的最优解对领域中资产的预期收益极其敏感。然而，我们对领域中资产预期收益的估计也容易产生统计误差。因此，考虑到面临风险的巨大资金，从现实角度来看，MVO\
  \ 的结果并不可靠，甚至不可行。记住，在收益最大化的 MVO 框架中，预期收益出现在目标函数中。因此，MVO 中的收益最大化问题将类似于鲁棒优化中的目标鲁棒性问题。数学上，具有目标鲁棒性的优化可以写为：\n\
  \n```\nmin f(x,u)\ns.t G(x) ∈ H\n```\n其中 `f(x,u)` 是包含不确定参数 `u` 的目标函数。虽然我们将在不会给出数学公式，但你应该注意不确定性也可以存在于问题的目标函数和约束中。在现实，你可以将许多具有目标函数不确定性的问题重新设定为具有不确定约束的特定目标问题。例如，我们将公式\
  \ (9.33) 重构为：\n\n```\nmin x,z z\ns.t z - f(x,u) ≥ 0\n     G(x) ∈ H\n```\n\n不确定性集\n\
  \n\n\n\n到目前为止，我们对不确定性集以及不确定性如何进入我们的优化过程提供了通用描述。现在，让我们考虑不确定性集元素集合异质性。我们对不确定性的描述假设在所有情况下，不确定性都出现在约束条件中而不是目标函数。在所有情况下，我们都会给出不确定性模型，随后给出其稳健对偶公式。优化问题的稳健对偶\
  \ `RC` 是该优化问题的确定等价形式。\n\n### 1. 场景不确定性集\n在这种规范中，不确定性集定义为不确定性参数离散实现的有限集合。场景不确定性集的数学表达式可以写为：\n\
  \n`U = {a[1],...,a[S]},`, `RC : a_hat'x ≤ b` 对于所有 `a \\in U`\n\n### 2. 盒式（区间）不确定性集\n\
  在这种规范中，不确定性集由区间或箱形定义，假设不确定性参数的标称值 `a_hat` 位于其中。区间的大小由参数 `ρ` 控制，而 `u` 描述常数扰动项。如果\
  \ `δ = ρ*u`，则盒式不确定性集的数学表达式可以写为：\n\n`U = {a=a_hat+ρ*u,||u||[α]≤1}{a:|a−a_hat|≤ρ}`,\
  \ `RC : a_hat'x + δ||x||[1] ≤ b`\n\n### 3. 椭圆不确定性集\n这种规范假设不确定性集由围绕不确定参数标称值 `a_hat`\
  \ 的椭圆定义。从统计学角度来看，它可以被描述为不确定参数正常值周围的置信区域。该区域的形状和大小由矩阵 `P = P' = R'R` 决定。椭圆不确定性集的数学表达式可以写为：\n\
  \n`U = {a=a_hat+ρ*R u,||u||[2]≤1}`, `RC : a_hat'x + δ||R'x||[2] ≤ b.`\n\n`U = {a:(a−a_hat)'P^(-−1)(a−a_hat)≤ρ²}`\n\
  \n### 4. 多面体不确定性集\n在这种规范中，不确定性集由一个线性不等式组组成。不确定性集的大小由可调参数 `Γ` 控制。多面体不确定性集的数学表达式可以写为：\n\
  \n$U = \\left\\{ {a:{\\sum\\limits\\_{j \\in J}^{J}\\left\\| a\\_{j} \\right\\||}\
  \ \\leq \\Gamma} \\right\\}$, `RC : a'x + δ||x||[1] ≤ b` 对于所有 `a \\in U`\n\n# 稳健投资组合优化\n\
  \n在为稳健优化奠定了严格的基础后，让我们现在探索它在投资组合优化中的应用。通常，稳健投资组合优化旨在获得对模型输入参数估计误差不敏感的投资组合配置，这些输入参数是组成资产的预期收益和它们的协方差矩阵。在随后的示例中，我们将主要关注组成资产预期收益的不确定性，因为通常认为它们对投资组合性能的影响比协方差矩阵的不确定性更大。我们将组成资产的预期收益向量标记为\
  \ `μ`，相同资产的协方差矩阵标记为 `Σ`。\n\n请记住，处理优化问题中的不确定性有多种方法；因此，如果你发现实现稳健投资组合优化有多种方法，也不应感到惊讶。你会在各种方法中发现的共同主题是对谨慎考虑的强调，我们将其定义为针对最坏情况进行优化。在输入参数的背景下，这意味着投资组合将针对最坏的均值场景或最坏的方差场景进行优化。正如你可能注意到的，稳健优化的数学框架通常具有挑战性，因此我们将关注两种情况中较简单的一种，即最坏情况均值稳健优化。\n\
  \n## 最坏情况均值稳健优化\n\n从最坏情况均值投资组合收益的角度来看，我们的优化目标是在面对不确定性的情况下，最大化可能的最低投资组合收益。因此，我们寻求的解决方案是在组成资产预期收益最坏情况的情况下提供最高收益的投资组合配置。简而言之，我们的投资组合目标是最大化可能的最小投资组合收益，如公式\
  \ (9.35)所示。\n\n```\n\\begin{array}{l} {\\max\\limits\\ {\\\\min\\limits\\mu \\in\
  \ U}\\left(w^{\\prime}\\mu \\right)} \\\\ {\\text{s}\\text{.t}\\text.~}w^{\\prime}1_{N}\
  \ = 1} \\\\ \\end{array}\n```\n\n你会注意到在公式 (9.35)中，不确定性在目标函数中。只要我们能够构造出稳健对偶，这通常不需要担心。在某些情况下，这可能涉及将不确定性集重新构造为约束条件。\n\
  \n### 1. 场景不确定性集\n`U = {μ[1],...,μ[S]}` 由有限数量的场景组成。如果我们假设收益范围是多元正态分布，那么我们可以使用 1000\
  \ 个场景。我们将这些收益连同协方差矩阵输入优化模型。\n\n```\n\\begin{array}{l} {\\max\\limits\\_{x,t}z} \\\
  \\ {\\text{s}\\text{.t}\\text.~}z - w^{\\prime}\\hat{\\mu} \\leq 0,} \\\\ {\\text{~~~~~~~~~~~~~}w^{\\\
  prime}1_{N} = 1,w \\geq 0.} \\\\ \\end{array}\n```\n对于所有 `μ_hat \\in U`。\n\n###\
  \ 2. 盒式不确定性集\n`U_{\\mu}^{b} = {\\μ | δ \\leq \\mu - \\hat{\\mu} \\leq \\delta}`\
  \ 是收益向量周围的一个区间。如果 `δ = ρ*u` 且 `Σ[μ]` 是误差的对角协方差矩阵（与资产的方差正比），那么我们目标函数的稳健对偶公式变为：\n\n\
  ```\n\\begin{array}{l} {\\max\\limits\\_{w}w^{\\prime}\\hat{\\mu} - \\rho\\sqrt{\\\
  text{Σ}_{\\mu}}\\left| w \\right|^{\\prime}} \\\\ {\\text{s}\\text{.t}\\text.~}w^{\\\
  prime}1_{N} = 1,} \\\\ {\\text{~~~~~~~~~~~~}w \\geq 0.} \\\\ \\end{array}\n```\n\
  (9.37) (9.37)\n\n通过在公式中引入辅助变量，我们避免了针对大量场景优化目标函数。有助于注意的是新的规范保留了原始问题的所有所需属性，如线凸性。然而，我们现在有一组更大的约束条件。你应该注意，盒式不确定性集较少使用，因为如果对问题没有其他限制，它们往往会产生极端的投资组合配置。我们将使用盒式不确定性集进行稳健投资组合优化的实现留给课后练习供你探索。\n\
  \n\n\n\n\n### 3. 椭圆不确定集\n\n`U[μ]^(E) = {μ=μ̂+ρΣ[μ]u,∥u∥[2]≤1}` 是由名值 `μ̂` 周围的椭圆形成的不确定集。椭圆的边界由\
  \ `U = {μ:(μ−μ̂)′Σμ≤ρ²}` 定义。\n\n$\\begin{array}{l} {\\\\max\\\\limits\\\\_{w}\\\\\
  text{~~~~~}w^{\\prime}\\\\hat{\\\\mu} - \\\\rho\\\\sqrt{w^{\\prime}\\\\text{Σ}\\\
  _{\\mu}w}} \\\\\\\\ {\\\\text{s}\\\\text{.t}\\\\text{~~~}w^{\\prime}1_{N} = 1,}\
  \ \\\\\\\\ {\\\\{~~~~~~~~~~~~}w \\\\geq 0.} \\\\\\\\ \\\\end{array}$ (9.38)\n\n\
  椭圆不确定集允许资产收益之间存在相关性。因此，误差误差矩阵 `Σ[μ] = R′R` 是通过协方差矩阵 `Σ` 的 Cholesky 分解估计的。`ρ` 是不确定性参数，定义了估计均值与资产收益真实均值向量之间可接受的最大差异边界。\n\
  \n#### 在 SAS 中实现鲁棒组合优化\n\n在 SAS 中实现鲁棒组合优化也涉及两个步骤的过程。对于场景不确定集，我们将在将模拟收益导入优化问题之前，首先使用\
  \ `IML` 过程生成 S 数量的组合场景。然后对模型进行优化，使其对模拟场景的最坏情况具有鲁棒性。对于箱型和椭圆不确定集，我们将在先使用 `IML` 过程估计误差的协方差，然后将数据导入\
  \ `OPTMODEL` 过程，随后优化目标函数使其对每个模型不确定集的最坏边界具有鲁棒。对于所有三个示例，我们将重用 `PORTFOLIO_RETURNS`\
  \ 和 `PORTFOLIO_COVARIANCES` SAS 数据集。\n\n#### 基于场景不确定集的鲁棒组合优化\n\n程序 `9.8` 显示了实现场景不确定集鲁棒优化的\
  \ SAS 程序。与之前的示例一样，此程序中使用的代码与你之前在程序中看到的代码相似。因此，我们仅突出此代码与之前的优化代码之间存在显著差异的区域。\n\n首先，我们使用\
  \ `IML` 过程模拟 1,000 个资产收益场景。此步骤的 SAS 代码与 CVaR 模型相同。然后，我们将模拟收益连同估计的协方差导入 `OPTMODEL`\
  \ 过程。我们的决策变量是组合权重（`WEIGHTS`）和辅助变量 `T`。对于每个场景，我们使用隐式变量 `FSRET` 计算组合收益。然后我们为所有 `s\
  \ = {1,...,S=1,000}` 声明最大约束 `{C**[s]:T−FSRET[s]≤0}`。我们目标函数的目标是找到组合分配和 `T` 的最小值，使得不违反最大约束。将此问题想为在最坏收益场景下选择最优分配，从而产生一个性能不差于\
  \ `T` 的组合。我们还使用为优化后组合所选的每只股票的实际收益，来计算组合组合的预期收益。\n\n**程序 9.8：在 PROC OPTMODEL 中用场景不确定集求解鲁棒组合优化问题**\n\
  \n```sas\n/*使用场景不确定集进行鲁棒组合优化*/\n%let rfr=0.00178;\n%let minimum_return = 0.0179;\n\
  %let max_risk = 0.045;\n\nproc optmodel;\n      /*声明集合和参数 */\n      set <str> ASSETS;\n\
  \      set <str> SCENARIOS;\n      num returns{ASSETS};\n      num sreturns {ASSETS,SCENARIOS};\n\
  \      num covariance {ASSETS, ASSETS};\n              \n      /*从 SAS 数据集读取组合数据\
  \ */\n      read data Portfolio_Returns into ASSETS=[Ticker] returns;\n      read\
  \ data simulated_Returns into SCENARIOS=[Scenario] \n               {I in ASSETS}\
  \ <sreturns[i,Scenario]=col(i)>;\n      read data Portfolio_Covariances into [Ticker]\
  \  \n              {i in ASSETS} <covariance[Ticker,i]=col(i)>;\n              \n\
  \      /*声明决策变量 */\n      var Weights {ASSETS}>0;\n      var T;\n      \n      /*场景组合的函数\
  \ */\n      impvar FSRet{s in SCENARIOS}=sum{i in ASSETS}(Weights[i]*sreturns[i,s]);\n\
  \      \n      /*声明约束 */\n      con CT{s in SCENARIOS} : T-FSRet[s]<=0;\n      con\
  \ Portfolio_Risk<=&max_risk;\n      con Portfolio_Weights: sum {i in ASSETS} Weights[i]\
  \ = 1;\n      \n      /*声明目标 */\n      max Z=T;\n      solve;\nquit;\n```\n\n**输出\
  \ 9.8A：来自鲁棒组合优化的最优组合分配（场景不确定集）**\n\n![Output 9.8A]\n\n在 `Output 9.8A` 中，问题陈述（Problem\
  \ Statement）表显示我们的问题包含 64 个决策变量，包括 1 个辅助变量 `Z` 和组合权重向量的 63 个元素。1,002 个约束包括 1,000\
  \ 个场景约束、最大风险约束和全额投资约束。从问题摘要（Problem Summary）表中，我们看到最坏情况收益约为 -7.99%，VaR 约为 8.13%。\n\
  \n**输出 9.8B：来自鲁棒组合优化的最优组合分配（场景不确定集）**\n\n![Output 9.B]\n\n#### 基于椭圆不确定集的鲁棒组合优化\n\
  \n程序 `9.9A` 和 `9.9B` 显示了使用椭圆不确定集优化组合的 SAS 代码。与之前的示例一样，我们仅突出与之前的优化代码相比、具有显著差异的代码区域。在\
  \ `程序 9.9A` 中，我们调用 `IML` 过程根据之前模拟的 1,000 次资产收益估计误差的协方差矩阵。然后我们使用 `IML` 中的 `root`\
  \ 函数计算矩阵的 Cholesky 分解。\n\n**程序 9.9A：使用 PROC IML 计算椭圆不确定集的协方差误差**\n\n```sas\n/*使用\
  \ PROC IML 模拟 1000 个组合场景并计算协方差矩阵*/\n%let n =1000;\nproc iml;\n      use Portfolio_Returns;\n\
  \      read all var _num_ into returns[colname=NumerNames rowname=Ticker];\n   \
  \   read all var _char_ into assets[colname=CharNames];/*资产名称*/\n      \n      use\
  \ Portfolio_Covariances;\n      read all var _num_ into sigma[colname=NumerNames\
  \ rowname=Ticker];\n      \n      call randseed (7564321);\n      SRet =RandNormal(&n,returns,sigma);/*模拟\
  \ 1000x2 向量*/\n      \n      SMReturns=t(mean(SRet));/*计算样本均值*/\n      SSigma =\
  \ cov(SRet);/*计算样本协方差*/\n      \n      /*计算 Cholesky 分解*/\n      SigmaD=root((SSigma));\n\
  \      \n      /*将误差协方差导出 SAS 数据集*/\n      sname ={'Assets'};/*变量名设置*/\n      cnames\
  \ ='Ticker'||Numernames;\n      \n      create Portfolio_SigmaD from Assets SigmaD[colname=\
  \ cnames ];\n      append from Assets SigmaD;\n      close Portfolio_SigmaD;\nquit;\n\
  ```\n\n\n\n\n随后，误差的估计角协方差矩阵以及估计的收益和协方差被导入到 `OPTMODEL` 过程中，如程序 9.9B 所示。我们将确定性参数 `ρ`\
  \ 设置为 0.2，这意味着我们愿意接受平均收益向量偏离真实值不超过 20%。然后，我们声明决策变量，即投资组合权重向量（`WEIGHTS`）。我们还使用隐式变量来计算资产加权协方差误差（`w`′Σ[`μ`]*w）。接下来，我们定义目标函数，即最大化惩罚后的投资组合收益。目标函数中的惩罚项是不确定性参数与加权协方差矩阵范数（平方根）的乘积\
  \ $\\left( {\\\\rho\\\\sqrt{w^{\\prime}\\\\text{Σ}\\_{\\mu}w}} \\\\right)$。\n\n\
  ### 程序 9.9B：使用 PROC OPTMODEL 通过椭圆不确定集求解稳健投资组合优化问题\n\n```sas\n/* Implementing Robust\
  \ Portfolio Optimization using Ellipsoidal Uncertainty Set in PROC OPTMODEL*/\n\
  %let rfr=0.00178;\n%let alpha=0.99;\n%let max_risk = 0.045;\n%let rho=0.2;\n\n/*Portfolio\
  \ optimization*/\nproc optmodel;\n      /* declare sets and parameters */\n    \
  \  set <str> ASSETS;\n      num returns {ASSETS};\n      num sigmaD{ASSETS, ASSETS};\n\
  \      num covariance{ASSETS, ASSETS};\n              \n      /******************************************/\n\
  \      /*           Same as Program 9.1           */\n      /*****************************************/\n\
  \      read data Portfolio_SigmaD into [Ticker]  \n      {j in ASSETS} <sigmaD[Ticker,j]=col(j)>;\n\
  \              \n      /* declare variables */\n      var Weights {ASSETS} >= 0;\n\
  \              \n      /*Calculate Portfolio Risk Measures*/\n      impvar Robust_Sigma\
  \ =sum{i in ASSETS, j in ASSETS} \n      (Weights[i]*sigmaD[i,j]*Weights[j]);\n\
  \              \n      impvar Portfolio_Variance=sum {i in ASSETS, j in ASSETS}covariance[i,j]\
  \ * \n      Weights[i] * Weights[j];\n      impvar Portfolio_Risk = sqrt(Portfolio_Variance);\n\
  \              \n      /******************************************/\n      /*  \
  \    Same as Program 9.1           */\n      /*****************************************/\n\
  \      /* declare constraints */\n      con Portfolio_Weights: sum {j in ASSETS}\
  \ Weights[j] = 1;\n              \n      con Maximum_Risk: Portfolio_Risk<=&max_risk;\n\
  \      /* declare objective */\n      max WRet=(Expected_Return-&rho*robust_sigma**0.5);\n\
  \      solve;\n              \n      /******************************************/\n\
  \      /* Same as Program 9.1 */\n      /****************************************/\n\
  ```\n\n### 输出 9.9A：来自稳健投资组合优化的优投资组合配置（椭圆不确定集）\n\n![images/Ch09_Output_9A.jpg]\n\n\
  从输出 9.9A 中的结果中，我们观察到椭圆不确定集模型包含 63 个决策变量，即投资组合权重向量的 63 个元素。与具有 1000 多个约束的场景不确定模型不同，椭圆不确定集模型的约束数量仅为\
  \ 2，即最大风险约束和全额投资约束。\n\n从问题摘要表可以看出，椭圆不确定集模型中的坏情况收益（0.059%）远高于场景不确定模型。在预期投资组合收益（1.57%）中也可以看到同样的改进，这是我们使用平均收益向量计算得。为了实现这些改进，优化牺牲了风险领域，产生了更高的投资组合标准差和\
  \ VaR 估计。然而，与场景不确定集相比，使用椭圆不确定集在这两个组分之间的权衡明显更高。\n\n椭圆不确定集模型的主要优点是多元化程度显著提高，而没有导致投资组合收益的比例损失。就像场景不确定情况一样，优化的投资组合主要由防御性股票组成，但配置更加分散。在我们检查的所有优化方法中，从椭圆不确定集模型获得的解决方案集中程度最低。场景不确定集模型似乎更为保守。\n\
  \n### 输出 9.9B：来自稳健投资组合优化的优投资组合配置（椭圆不确定性）\n\n![images/Ch09_Output_9b.jpg]\n\n###\
  \ 投资组合优化中的机器学习和其他创新\n\n在本章结束之际，您应该注意 `OPTMODEL` 过程未来的更新将包含对锥优化的支持。这将允许我们解决与基准相关的优化，例如最大化相对于基准的投资组合\
  \ Alpha，或最小化相对于同一基准的跟踪误差。\n\n投资组合优化领域的另一个创新是使用机器学习方法，例如正则化基于性能的目标函数，或使用深度学习算法（如循环神经网络）构建最优投资组合权重。在基于性能的正则化优化中，目标函数被重新设定为包含一个惩罚函数，以考虑最优投资组合权重估计误差带来的效用损失。这种方法的示例包括最小绝对收缩和选择算子（LASSO）方法，在该方法中，均方差优化的目标函数被重写，包含一个指定为投资组合权重向量\
  \ `L[1]` 范数的惩罚项。4。在投资组合优化的循环神经网络方法中，算法尝试学习能够最大化预期组合特征（如夏普比率）的最优权重。这些令人创新的 SAS 程序将添加到未来的更新中。\n\
  \n## 练习\n\n1. 一位投资组合经理希望构建一个满足最小收益要求的最小因子风险股票投资组合。因子风险由 `beta` 衡量。包含投资组合优化问题的 SAS\
  \ 数据集（`STOCK_DATA`）包含了股票代码、数量、价格以及九只股票的 beta。\n\na. 写一个 SAS 程序，在满足 1.5% 最小收益约束的情况下最小化投资组合的\
  \ `beta`。此外，让我们实施一个约束，即最大配置不能超过最小配置的 11 倍。此外，记得实施全额投资和卖空约束。\n\n   i. 查看问题摘要和解决方案摘要。问题中有多少个约束？\n\
  \n   ii. 优化函数的最小值（最低可能的 `beta`）是多少？\n\n   iii. 投资组合配置是常的还是反常的？\n\n\n\n\niii. 投资组合分配的多元化程度增加了还是减少了？组合\
  \ Beta 的变化与更好的多元化一致还是其他原因？这种不一致的原因是什么？\n\n2. 让我们回顾程序 9.1 所示的均值方差优化（MVO）。编写一个 SAS\
  \ 程序，使用 `OPTMODEL` 过程在全额投资约束和非负边界条件下，最大化样本组合的夏普比率。\n\n   a. 将投资组合分配与相同优化的 `PROC\
  \ IML` 版本获得的分配进行比较。\n\n   b. 将投资组合分配与从收益最大化和风险最小化问题中获得的分配进行比较。\n\n   c. 移除空头限制，然后重新优化组合。\n\
  \n      i. 从风险和收益的角度来看，你是否获得了更好的夏普比率？\n\n      ii. 投资组合分配是否发生了显著变化？\n\n      iii.\
  \ 什么可以解释有空头限制优化与无空头限制优化之间结果的变化？\n\n3. 修改程序 9.1 所示的均值方差优化（MVO）的 SAS 代码，将使用组合标准差最小化风险改为使用预期缺口（expected\
  \ shortfall）最小化风险。\n\n   a. 将投资组合分配与从收益最大化和风险最小化问题中获得的分配进行比较。\n\n   b. 将投资组合分配与从\
  \ CVaR 最小化问题中获得的分配进行比较。\n\n   c. 现在，修改程序 9.B 所示的 SAS 代码。将目标函数从最小化 `CVaR` 改在 CVaR\
  \ 不超过 7.5% 的约束下最大化组合收益。然后将投资组合分配与从 CVaR 最小化问题获得的分配进行比较。\n\n4. 修改程序 9.9 所示的稳健均值方差优化（RMVO）的\
  \ SAS 代码，将使用椭圆不确定集最小化风险改为使用箱型不确定集。将不确定参数设置为 `ρ` = 0.2。\n\n   a. 将投资组合分配与从场景不确定性和椭圆不确定集获得的分配进行比较。\n\
  \n      i. 相于其他方法，箱型不确定集在收益、风险和多元化性能上有所提高吗？\n\n   b. 将不确定参数设置为 `ρ` = 1。然后重新优化问题。\n\
