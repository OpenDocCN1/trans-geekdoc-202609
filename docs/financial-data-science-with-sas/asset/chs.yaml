  \ |\n\na. 收益的平均值、中位数标准差是多少？\nb. 以矩（Moments）、分位数（Quantiles）和极值（Extreme Observations）作为参考，描述分布的形状（是对称的还是不对称的？）。\n\
  c. 修改你的 `PROC UNIVULATE` 语句包含直方图。同时在直方图上叠加正态（预期）密度和核（拟合）密度。这些图表支持收益呈正态分布的假设吗？\n\
  d. 对于投资者而言，观察到的统计特征在投资组合行为和绩效衡量方面具有哪些投资意义？\n\n## 5. 案例分析\n\nSally Smith 一年前从一所久誉的大学获得金融工程博士学位。毕业后，她立即在纽约市华尔街的一家银行获得了一份丰厚的定量数据分析师工作。她的主要职责是开发机器学习模型，这些模型可以筛选大量的社交媒体帖子和宏观新闻，为银行的股票交易部门描绘交易信号。她的年薪部分取决于交易部门使用她的模型所赚取的利润。她在前六个月里开发了各种机器学习模型，用以识别哪些社交媒体帖子传达了对科技行业某些股票的积极或负面情绪。在开发模型期间，她注意到特定的社交媒体帖子传达的情绪与某些股票未来的价格走势一致。然而，她无法判断她的模型生成的交易信号中是否包含了这些社交媒体帖子，因为它们是基于黑箱算法的。她担心社交账号背后的人可能正在利用内幕信息试图通过帖子操纵市场。Sally\
  \ 最近还发现了另一个与她的算法直接冲突的算法（每当 Sally 的算法交易时，它就进行相反的操作）。这种对抗算法似乎对 Sally 算法的预测性能没有太大影响。\n\
  \n### 讨论问题\n\na. 银行将 Sally 的薪酬与其算法的盈利挂钩是否符合伦理？\nb. 作为数据科学家，Sally 对社交媒体帖子承担哪些伦理责任？\n\
  c. 在此相同的问题上，她承担哪些法律责任？\n\n\n\nd. Sally 应该如何在不损害其价值观的情况下继续她的机器学习模型的开发？\n\ne. Sally\
  \ 应该做什么来解决对抗性算法的问题？\n\n***\n\n## 第 2 章：探索与可视化金融与经济数据\n\n## 使用可视化进行学习与沟通\n\n大多数人通过四种通用的学习风格的结合来学习：视觉学习、听觉学习、阅读与写作以及动觉学习（通过做中学学习）。与这些学习风格相互关联的是沟通方法，包括口头、非口头、书面、听力和视觉沟通。图\
  \ 2.1 显示了我们学习方式与沟通方式之间的重叠。事实上，与数据科学家工作相关的沟通两个核心目标是使用数据进行“告知”和“影响”。在数据科学领域，“告知”意味着通过探索和发现的过程利用数据来传递知识，而“影响”意味着以能够有效传达知识价值的方式展示发现结果。\n\
  \n在分析生命周期中，所有数据科学家都将在“从数据中学习”和“向其他利益相关者沟通发现”之间切换角色。为了在分析生命周期中成功解锁数据中的价值，数据科学家需要同时运用硬技能（如编程、数据分析和建模）和软技能（如沟通、创意、批判性思维、适应性、问题解决和团队合作）。这是因为在大多数分析项目中，数据科学家担任顾问角色，他们为可能不具备数据科学背景的项目所有提供专业知识。因此，为了增强其专业知识的价值主张，数据科学家必须在与数据科学相关的硬软技能方面培养能力和最佳实践。\n\
  \n本书的大多数章节将侧重于培养你在金融数据科学方面的硬技能。我们在本章涵盖的主题将这些硬技能与沟通、适应性、批判性思维和创意等软技能相结合。这些软技能是良好数据故事讲述的框架，数据故事是将从数据中获得的洞察转化为引人入胜叙叙的过程，有助于告知并影响分析项目中的利益相关者。数据故事最常用的方法是数据可视化。\n\
  \n图 2.1：学习风格与沟通方法\n\n![image](img/Ch02_fig_2-1.jpg)\n\n## 数据可视化的类型\n\n在第一章中，数据可视化被定义为一种数据科学技术，它使用图形和图画描绘，以视觉上引人且交互的方式来传递有关数据的样式化事实（如模式、趋势和相关性）。由于金融和经济数据具有独特的（统计性、频率、完整性、规模、范围、相关性）属性，金融数据科学家将可视化用于描述性和诊断性目的。\n\
  \n### 描述性数据可视化\n\n描述性可视化使用图形和图画描绘，突出原始数据中趋势、事件、模式和关系的摘要。由于它们本质上是数据中发现的总结，因此它们被用于分析周期的探索和发现阶段。描述性可视化通常由更广泛的利益相关者消费，因此在创建这些可视化时，重点倾向于以下最佳实践：\n\
  \n*   **清晰性**：描述性可视化应该通过揭示嵌入在数据中的洞察来提高清晰度。它还应该有助于理解那些复杂到无法用语言解释的数据特征。\n*   **简单性**：遵循奥卡姆剃刀，最简单的可视化通常是最好的。当观众与可视化制作者之间地理位置较远（例如卖方投资报告的消费者），或者可视化作为独立文档或摘要极少的文档呈现时，可视化应为观众提供一个对洞察的连贯描绘。\n\
  *   **相关性**：可视化必须与所强调的数据类型和现象保持一致。例如，数据中的关系应该通过具有至少两个维度的可视化（如散点图）描述，而数据中的趋势应该通过包含时间元素的可视化来描述。\n\
  *   **一致性**：无论在业务中的应用领域，有效的可视化都需要图形特征的使用上保持一致性。这是因为这些特征（如颜色、图表类型、图例、标记和形状）是良好故事讲述的核心组成部分。\n\
  \n描述性可视化应该通过揭示嵌入在数据中的洞察来提高清晰度。它还应该有助于理解那些复杂到无法用语言解释的数据特征。描述性可视化通常由更广泛的利益相关者消费，因此在创建这些可视化时，重点倾向于以下最佳实践：\n\
