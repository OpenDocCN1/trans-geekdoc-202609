  \    YR3=YR2*1.03;\n    YR4=YR3*1.03;\n  end;\n\ncalc:\n\n  if _COL_>1 then do\n\
  \    GP=REV-COGS; /*毛利润*/\n    DP = IC/TL;  /*折旧*/\n    SGA = FC;  /*管理费用*/\n  \
  \  EBT = GP-SGA; /*税前利润*/\n    TAX =TR*EBT;      /*所得税*/\n    NI = EBT-TAX;   /*净利润*/\n\
  \n  /*现金流量开始*/\nCashFlows:\n  OCF = EBT+DP-TAX; /*净利润+折旧*/\n  WCR = 0.02*Rev; /*该年度收入的\
  \ 2%*/\nend;\n\n  /*仅输入初始数据的控制*/\n  if _col_=1 then do;\n\n    /*初始 CAPEX 和 WCR*/\n\
  \    CAPEX = ic;\n    WCR =NWC;\n  end;\n\n  CF = OCF-CAPEX-WCR;\n\n  /*决策标准*/\n\
  Decisions:\n  npv=cf;\n  irr=cf;\ncalc2:\n  if npv then do;\n    tempnpv =finance('npv',yr1,\
  \ yr2, yr3, yr4)+yr0;\n    yr0=tempnpv;\n    yr1=0;\n    yr2=0;\n    yr3=0;\n  \
  \  yr4=0;\n  end;\n\n  if IRR then do;\n    tempirr =finance('irr',yr0, yr1, yr2,\
  \ yr3, yr4);\n    yr0=tempirr;\n    yr1=0;\n    yr2=0;\n    yr3=0;\n    yr4=0;\n\
  \  end;\nrun;\n\ntitle;\ntitle2;\n```\n\n`程序 13B` 显示了用于 `COMPUTAB` 过程 SAS 代码。该代码通过调用过程并指定输入数据集\
  \ `PINFO` 和输出数据集 `CAPBU2` 开始。接下来，使用 `COL` 语句定义项目年份的五列。然后，使用 `ROW` 语句定义备利润表中的每行标签和格式。此外，还定义了现金流量表的行。最后，定义了计算\
  \ `NPV` 和 `IRR` 的行。\n\n列块计算语句用于指定计算依赖其他列的每列值的公式。例如，第 1 年的收入计算为销售数量 (`QTY`) 乘以售价\
  \ (`SPU`)，而第 2 年到第 4 年的收入根据 5% 的增长率从之前的年份（列）复合。行块语句用于指定依赖其他行的行计算。例如，毛利润行 (`GP`)\
  \ 是根据销售额 (`REV`) 和销售成本 (`COGS`) 行计算得出的。\n\n`IF` 语句用于控制在每个列和行的何时以及何执行计算。例如，`IF REV`\
  \ 语句指示 SAS 仅在备利润表的收入行上执行上述收入计算，而 `IF _COL_=1` 语句指示 SAS 将 $5,245,000 的资本支出 (`CAPEX`)\
  \ 和 $132,400 的营运资金需求 (`WCR`) 分别记录零列。注意后续年份的 `WCR` 计算为该年度收入的 2%。每个期间的年度自由现金流量使用公式\
  \ (4.29) 中的规范计算。项目的 `NPV` 和 `IRR` 使用 SAS 内置的 `FINANCE` 函数计算。这两个标准的计算首先使用临时变量 `TEMPNPV`\
  \ 和 `TEMPIRR` 完成。然后，使用 `IF` 编程语句将计算值记录在所需的行列中。\n\n调用 `COMPUTAB` 过程获得的结果所示输出 4.13。备财务报表显示，该项目通常是盈利的且现金流充足，这是由于其高年度折旧费用（加回经营现金流量的非现金支出）。1.01\
  \ 万美元的 `NPV` 和 20.79% 的 `IRR` 都表明应该接受该项目。这里需要注意的是，备利润表和现金流量表是由于所研究项目而产生的未来财务结果预测。然而，在公司投入巨额现金支出之前，检查一个或多个变量偏差对我们\
  \ `NPV` 和 `IRR` 的影响可能是值得的。关于这些变量，一个重要的问题是一旦项目实施，公司最可能看到的这些变量的值是多少。\n\n输出 4.13：来自\
  \ `PROC COMPUTAB` 的资本支出工作表\n\n| ![image](img/Ch04_out_4-13.jpg) |\n| --- |\n\n为了回答这个问题，我们将利用蒙特卡洛模拟的力量。在创建模拟之前，我们需要选择一个作为模拟锚点的变量。在同质化市场中运营的公司是价格接受者，但可以根据市场情况调整产量水平。对于这些公司来说，价格比产量更具随机性。具有定价权的公司可能客户购买的产品或服务数量具有随机性。我们假设\
  \ ABA 制造属于后者。因此，我们将公司第一年销售的产品数量的随机性作为模拟锚点。\n\n为了扩展 `程序 13B` 以进行蒙特卡洛模拟，我们将依靠简单的 SAS\
  \ 编程技巧，即在程序周围构建一个宏封装。宏封装将创建一个程序循环，为蒙特卡洛模拟的试验次数重新运行 `DATA` 步骤和 `PROC COMPUTAB` 语句中的\
  \ SAS 代码。对于每次迭代，宏通过调用 `PROC APPEND` 语句将销售数量、`NPV` 和 `IRR` 的模拟值存储在 `SIMUL11` SAS\
  \ 数据集中。然后可以使用 SAS 中的任何描述统计过程分析 `SIMUL11` 数据集。由于计算量巨大且产生的结果很多，在 `PROC COMPUTAB` 语句中指定\
  \ `NOPRINT` 选项来抑制每次迭代结果的打印可能是个好主意。\n\n\n\n\n\n```\n/*用于实现资本预算蒙特卡洛模拟的 SAS 宏*/\n%macro\
  \ capsimul(nrep); /*指定重复次数*/\n    proc datasets nodetails nolist;\n            \
  \    delete simul11;\n    run;\n\n    %local  i nrep; /*局部宏变量*/\n\n    %do i=1 %to\
  \ &nrep;\n\n/****复用程序 4.14 中的代码****/\n\ndata pinfo;\n\nQTY = 12000 *(1+rand(\"normal\"\
  ,0,0.1)) ;/*模拟销售数量*/\n\nrun;\n\nproc computab data=pinfo out=capbud2 noprint;\n\n\
  /****复用代码结束***/\n\n      /*将项目信息数据与资本预算结果合并*/\n      data _simul_;\n           \
  \ merge pinfo(keep=QTY) capbud2(obs=1 keep=NPV IRR);\n            sampleID=&i;\n\
  \          label QTY= '销售数量' NPV='净现值' IRR='内部收益率';\n            format NPV nlmny16.2\
  \ QTY best10.2 IRR percent8.2;\n    run;\n\n    /*使用新迭代结果更新表格*/\n    proc append\
  \ base=simul11 data=_simul_ force;\n    run;\n\n%end;\n%mend;\n\n/*调用宏以执行 1000 次重复*/\n\
  %capsimul(1000);\nproc tabulate data=simul11;\n    var qty npv irr;\n    table qty*F=bestn10.2\
  \ npv*F=dollar15.2 irr*F=percent8.2,(min median mean max  p5\n      p10 );\nrun;\n\
  ```\n\n### 表 4.11：项目分析的决策标准结果\n\n| 变量 | 最小值 | 中位数 | 平均值 | 最大值 | 第 5 百位数 | 第 10 百位数\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| QTY (数量) | 86,243.76\
  \ | 120,677.27 | 120,114.57 | 159,357.19 | 100,366.38 | 104,245.52 |\n| NPV (净现值)\
  \ | \\-$921,728 | $1,049,006 | $1,016,801 | $3,262,774 | \\-$113,448 | $108,567\
  \ |\n| IRR (内部收益率) | 4.11% | 21.00% | 20.64% | 37.94% | 11.32% | 13.23% |\n\n`Program\
  \ 4.14` 显示了用于实现蒙特卡洛模拟的简写 SAS 代码。大部分代码是 `Program 4.13B` 中代码的重复；因此为了节省空间，仅包含了对原始代码的引用。请，我们现在通过用于创建\
  \ `PINFO` 数据的 `DATA` 步在模拟引入了随机性。销售数量是从正态分布中模拟的，其平均值等同于 120,000 单位的初始值，标准差等于平均销售数量的\
  \ 10%。`CAMSCIMUL` 宏唯一的输入是模拟所需的试验次数（`NREP`）`[%macro CAPSIMUL(NREP)]`。注意，宏的开头还包含一个\
  \ `PROC DATASET` 语句。将在每次调用宏时删除当前版本的 `SIMUL11` 数据集并将其替换为新版本。\n\n为了查看模拟数据的描述性统计量，我们调用了\
  \ `TABULATE` 过程。执行该过程获得的结果所示于 `表 4.11`。\n\n从表中我们可以观察到，尽管项目的平均 NPV 略高于百万美元，但它可能低至\
  \ -922,000 美元，高达 326 万美元。为了让经理对 NPV 估值更有信心，让我们使用 `SGPLOT` 过程中的直方图选项来绘制模拟 NPV 的分布图。\n\
  \n### 程序 4.15：使用 PROC SGPLOT 绘制项目 NPV 分布图\n\n```\n/*用于绘制项目分布的 SAS 代码*/\nproc sgplot\
  \ data=simul11;\n    inset \"NPV 分布 (蒙特卡洛模拟)\"/title=\"ABA Manufacturing Inc.\"\n\
  \    position=top \n    textattrs=(family=\"Times Roman\" color=darkblue size=12\
  \ ) valuealign=center \n    titleattrs=(family=\"Times Roman\" color=darkblue size=12\
  \ weight=bold) \n    label=center;\n    histogram npv / nbins=20 transparency=0.8\
  \ \n    fillattrs=(color=darkblue );\n    density npv/label=\"(项目 NPV 的正态密度)\";\n\
  \    yaxis values=(0 to 20 by 2.5);\nrun;\n```\n\n`表 4.11` 显示的结果和 `输出 4.15` 显示的直方图意味着，在超过\
  \ 90% 的模拟中，项目将产生正 NPV。公司第一年需要销售大约 10.3 万单位才能从该项目中获得正 NPV。我们的模拟显示，公司有超过 90% 的概率超过这一阈值。总而言，这些统计数据应该给经理们一些信心来继续该项目。需要强调的是，根据这些数字我们假设在项目进行期间处于历史正常状态。如果由于不可预见的事件（如重大经济衰退、自然灾害、健康危机或行业动荡）导致经营状况严重偏离历史标准，那么模拟的项目结果在项目期间实现的几率将很低。\n\
