  \ Michelle 和 Abigail，她们为我的生活带来了许多快乐和幸福。我很感激你们定期查看我的情况，询问可以如何提供帮助以及我正在忙些什么。\n\n我还要感谢我在威德纳大学的现任和往任学生，他们激发了书中介绍的一些的话题。特别感谢\
  \ SAS 的所有让这本书成为现实的同事们，特别是我的开发编辑 Catherine Connolly，她指导了书项目从构思到完成的全过程。感谢我的技术评审员 Sharad\
  \ Saxena 和 Chip Wells、文字编辑 Suzanne Morgen，以及 Rick Wicklin，他的博客是我查阅关于 `IML` 过程任何问题的首选处。\n\
  \n感谢杰出教授和荣誉教授 Yvonne Antonucci 和 Iqbal Mansur，他们两位都鼓励我将金融数据科学的专业知识扩展到更具持久性的领域。感谢\
  \ Kola Akinsomi、James Nguyen、Marius Mihai 和 Irfan Safdar 对本书提出的建设性反馈。\n\n\n## 引言\n\
  \n数据科学家的主要工作是从数据中创造价值。尽管组织数据通常被认为是一种目前无法在资产负债表上资本化的无形资产，但它现在已是创造价值最丰厚的手段之一。事实上，当今一些价值最高的公司的商业模式是建立在从平台终端用户那里收集的数据进行货币化之上的。随着这类公司不断出现，以及其他企业继续寻求从自身数据或从其他企业获取的数据中提取价值的机会，预计未来对数据科学的需求将继续增长。\n\
  \n诸如计算机科学、数据科学、数学和统计学等学术课程，为那些兴趣从事数据科学职业的人提供了正式的课程。还有许多数据科学家是自学的，许多领域专家也是在此过程中学习技能，以增强其对业务领域的功能性知识。本教材正是为这类专业人士编写的。旨在为研究生和本科课程的专业人士提供不同类型数据科学的严谨基础。本书基于\
  \ `SAS Analytics Platform`，该平台为所有学科的数据科学应用提供了端到端的解决方案。\n\n在本章中，我们将对金融数据科学进行概述。我们将讨论目前可用的一些常用数据科学平台的优缺点。我们还将突出\
  \ `SAS` 的一些特征，使其成为金融数据科学的首选工具，并展示 SAS 的一些简单实用的应用。我们将在章节结束处探讨数据科学的一些关键方面，以及随着社会进一步接受这种新颖方法而新兴的关注领域。\n\
  \n## 数据科学与金融系统\n\n数据科学和信息系统是相关领域，意义在于它们都处理数据。然而，它们与数据的关系侧重点是不同的。同样，金融数据科学和金融信息系统也是相互关联的，因为它们都处理金融数据。让我们尝试在接下来的小节中概述这些领域之间的区别。\n\
  \n### 数据科学\n\n科学是通过观察、实验以及对这些事件和模式如何发生进行测试性的证明和预测，对现实世界中的事件、结构、模式和现象进行的研究。例如，自然科学（如物理、化学和生物学）研究自然世界，而社会科学（如经济学、金融学、社会学人类学）研究人类社会及其内部发生的社会互动。数据科学是一个独特的科学领域，因为它也研究现实世界的方面，但将数据作为主要的产制品。数据科学家在进行研究时并不一定需要物理观察或实验，而是主要依赖先进的计算方法、编程和统计学从数据中提取关于现实世界的洞察。\n\
  \n\n\n\n\n数据科学的另一个独特属性是其跨学科的应用。数据科学技术和数据科学家遍出现在所有其他学科中。事实上，大多数数据科学家在跨学科团队中工作时不需要广泛的领域知识，因为这些团队通常包含领域专家，他们对研究领域的核心知识体系有更深入的理解。因此，数据科学家在其实践其技艺的业务领域方面是不受限制的。例如，数据科学家可能与医生团队合作，以了解患者对特定类型疗法的反应；或者与某公司的营销团队合作，了解哪些类型的销售激励措施更容易引导当前或潜在客户产生理想的购买决策。读者更有可能发现，在某一业务学科中常用的相同数据科学技术，往往会超越该学科的限制。这是因为，无论研究领域是什么，使用数据科学技术的任务的基石都是数据本身。\n\
  \n图 1.1 展示了数据科学团队的典型配置。在金融环境中，项目所有可以是投资组合经理或风险经理。项目所有通常对项目的成功或失败承担最终责任。数据工程师负责维护基础设施的软件组件，这些组件用于收集、处理和检索业务数据，而这些数据将在项目期间进行分析和建模。IT\
  \ 工程师的主要职责是设计、安装和维护数据基础设施的硬件组件，以及任何与数据基础设施协同工作的其他系统，以确保项目顺利运行。开发者通常与数据科学家合作，设计并制作业务应用程序和仪表板，并将数据科学家开发的模型作为其构建模块整合其中。领域专家是指在研究领域理论和/或实践方面具有深厚知识的人士，例如金融经济学家、交易员或风险官。业务分析师是团队的成员，负责为决策者生成数据驱动的分析。在金融领域，这包括投资分析师或信贷分析师。数据科学家与所有这些实体对接，开发算法和模型，以解决项目所需的业务问题。\n\
  \n图 1.1：数据科学团队配置\n\n\n## 金融数据科学\n\n金融数据科学是数据科学的一个新兴子领域。它涉及创建临时分析以回答特定的业务问题，并预测可能的未来金融场景。金融作为经济学的一个分支，通常使用理论来解释或预测金融变量与经济变量之间的关系。\n\
  \n大多数金融理论在现实世界的效果并不理想，因为它们依赖于往往不切实际的假设，或者基于对现实世界的抽象，而这些抽象过于局限，无法在现代社会中发挥作用。例如，一种著名的金融理论认为，金融资产的价格是以随机方式演变的，因此仅通过观察过去的价格变化无法准确预测其未来价格。该理论的动机是：理性的、利润最大化的投资者会迅速套利消除任何此类可预测的模式。因此，金融市场上观测到的模式只有不可预测的模式。这种理论意味着，任何使用统计或算法模型预测金融市场未来方向或特定属性的尝试本质上都是徒劳的。然而，该理论的假设与现实不符：在这些市场中执行的\
  \ 60-73% 的股票交易以及大部分的固定收益和货币交易，都是使用数据科学工具开发的应用程序完成的。可能这些模式确实是可预测的，但大多数投资者缺乏利用它们的手段或动机，导致只留下了那些有动机和计算资源的人去执行。即使它们不像该理论所假设的那样可预测，数据科学仍然为部署它的组织提供了许多实实在的的好处，正如你很快将看到的。\n\
  \n虽然理论可能无法对金融数据的行为提供完美的洞察，但它们仍然提供了一个坚实的框架，可以引入其他工具和方法，进一步加强我们对金融和经济变量在现实世界中行为的理解。因此，金融数据科学涉及将新的和建立的数据科学方法与技术应用于业务和金融数据，以获得对数据趋势和关系的新洞察，而这些是在标准的金融理论和模型中尚未被揭示的。需要注意的是，金融数据科学并不是传统金融和经济理论的替代品。数据科学和理论仅仅是互补工具，允许我们扩展对金融变量行为的理解范围，从而对它们的未来方向得出更好的预测。\n\
  \n## 金融数据科学的业务应用\n\n金融是一门业务学科，主要关注如何筹集、分配和使用金融资源以实现个人或组织财富存量的增加。这些活动中都包含一些风险元素；因此，金融还涉及风险识别、分析、缓解和治理。金融活动通常产生大量数据，这些数据通常以结构化的方式进行收集和归档。例如，在宏观层面，存在公开的和专有的数据库，包含了自\
  \ 1900 年以来美国所有上市公司的每日股票市场信息。此外还有各种经济变量的数据，这些数据在过去的 100 多里一直在系统地收集和整理。组织还拥有大量为了运营需要收集的金融数据，例如收入和成本数据，这些数据通常是为了财务报告或财务规划目的而收集的。因此，金融数据为数据科学技术的应用做好了充分准备。\n\
  \n可以说，金融服务业是首批将数据科学技术作为日常业务流程工具的行业之一。这包括在投资和风险管理领域以及金融规划和预测领域的广泛应用。在投资环境中，金融数据科学技术（如预测建模、仿真和优化）被广泛用于决策、资产配置、交易策略、风险衡量和绩效衡量。在企业金融环境中，仿真和优化也用于资本筹措、资本支出分析、收入和利润优化以及风险管理。在保险和金融中介环境中，预测建模、仿真和优化被用于风险衡量、分析、定价和治理。\n\
  \n\n\n\n\n金融数据科学技术应用的最新创新出现在金融科技（FinTech）领域。在这一领域，之前提到的所有工具被用于创建平台和产品，这些平台产品本质上旨在消除贷款人与借款人、投资者与投资机会之间的资金流动环节。在本书的后续章节中，我们将探索各种数据科学技术及其在金融环境中的常见应用。\n\
  \n## 金融信息系统\n\n信息系统是用于收集、处理、归档、复制和分析业务数据的组织化方法。金融信息系统可能是应用最广泛的信息系统，因为所有组织都需要某种组织方法来管理其财务记录，并为未来的财务需求和投资制定计划。现代金融信息系统的范围涵盖从简单的\
  \ `Microsoft Excel` 工作簿或 `Access` 数据库到中级会计软件（如 `Intuit QuickBooks` 和 `Oracle NetSuite`），甚至是更复杂的企业级或定制解决方案。它们通常是计算机化系统，用于收集、处理、归档、复制并对存储在其中的财务数据提供分析。\n\
  \n金融信息根据实体的需求呈现出不同的形式。对于零售机构，财务信息可以是通过销售点（`POS`）系统接口收集的销售数据，也可以是从供应商处接收的`可扩展业务报告语言`（`XBRL`）文件价格数据，或者是使用射频识别（`RFID`）标签创建并跟踪的库存数据。这些信息经过处理以符合特定格式，并存储在数据库中，以便根据组织的需求进行未来的复制和分析。\n\
  \n金融服务业中使用的金融信息系统与零售和制造业机构使用的系统不同，这是因为该行业具有独特性。该行业受到高度监管，其运营和财务结构通常与其他业务领域不同。金融服务业的范围也非常广，它由广泛的业务组成，包括存款和非存款机构、投资公司和中介、资本市场做市商、保险公司以及较新的金融科技（FinTech）公司。\n\
  \n## 信息系统的组件\n\n所有信息系统都由共同工作以实现组织目标的元素组成。通常情况下，金融信息系统的组件包括：\n\n*   **硬件**：这是信息系统的物理部分，包括计算机、外围设备和媒体设备。外围设备包括输入设备（如\
  \ `POS`、条码器和二维码扫描器）、输出设备（如显示器、打印机和扬声器）以及媒体设备（通常用于存储信息的磁盘）。\n\n*   **软件**：信息系统中使用两种类型的软件。系统软件是用于控制硬件的程序。应用程序软件包含用于收集、归档、复制和分析信息的成套代码集。系统软件提供硬件与应用程序软件之间的接口，而应用程序软件则执行通常与计算机本身运行无关的任务集。许多读者对\
  \ `Microsoft Windows` 非常熟悉，它是市场上最流行的操作系统软件家族。本书后续章节将更详细介绍的 `SAS` 软件就是应用程序软件的示例，可用于数据的收集、处理、归档、复制和进行统计分析。\n\
  \n*   **网络**：信息系统需要网络通信才能有效工作，因为它们的数据仓库通常需要被许多人访问。\n\n*   **人员**：所有组织都需要人员来运营，由于信息系统是为人类设计的，因此人员是所有系统的关键元素。终端用户的示例包括：使用人力资源数据库运行工资报表的薪资专员、使用贷款组合构建信用模型的金融数据科学家，以及构建仪表板等应用程序的开发人员。\n\
  \n*   **流程**：这些是在信息系统的治理和运行中使用的方法，以确保其实现设计目标。例如，流程可能包括与数据如何收集、组织、存储、更改和检索的任务及程序。\n\
  \n*   **数据和数据库**：将数据理解为收集并存储在俗称为数据库的数据仓库中的相关信息片段是直观的。在这种背景下，财务数据可以被视为对某个实体具有财务相关性的任何数据。\n\
  \n\n\n\n与商业智能类似，商业智能利用软件和数据库的力量从过去的事件和结果中提取洞察；而财务智能则将类似的工具应用于历史财务数据，以获取有关相关的关键绩效指标（KPI）、评分卡、仪表板或任何对决策者有价值的指标的洞察。例如，投资组合经理使用投资组合报告工具来可视化和分析其投资组合的表现。银行则使用贷款仪表板来监控和分析其贷款组合中的申请、审批、付款和违约趋势。财务智能与财务分析之间的主要区别在于所考虑的时间窗口。在财务智能中，重点在于弄清过去发生了什么，以便决策者判断组织或投资组合与其预期目标的达成良好程度。而在财务分析中，重点在于弄清未来将发生什么，以便决策者能够利用这些洞察来实现业务目的。\n\
  \n## 金融计量学\n\n金融计量学通过将推断统计学以及结构化和描述性模型应用于金融或经济数据，探索金融和经济问题及理论。在金融计量学中，理论通常是起点，随后通过实施模型来证明或反驳该理论。计量经济模型是现实世界的抽象，旨在测试理论、底层假设或预测未来趋势。从某种意义上说，金融计量学可以被视为金融数据科学的一个子集，旨在证明或否定金融现象或关系，而财务分析旨在发现金融现象和关系。尽管如此，必须重申，财务和经济数据通常以时间序列格式出现，这引发了一系列许多高级数据科学工具并不一定具备解决的问题。例如，金融经济数据通常显示出广泛的统计特征，如时变波动性、趋势、周期性、季节性、离群值、序列相关性和内生性等。因此，金融数据科学家在将机器学习等高级数据科学工具应用于金融和经济数据时必须特别注意。在随后的章节中，我们将更详细讨论如何在数据科学框架中处理这些某些特征。\n\
  \n## 数据科学工具包\n\n今天成为数据科学家的特权之一是我们可以拥有的广泛工具。数据科学工具分为两类：基于 `Python` 和 `R` 等开源平台的工具，以及基于\
  \ `Microsoft Excel`、`SAS`、`SPSS`、`Tableau` 和 `MATLAB` 等专有平台的工具。每个平台都有其优缺点，我们将在下一节中讨论。\n\
  \n## Microsoft Excel\n\n`Microsoft Excel` 可能是使用最广泛的数据科学应用。自 1987 年引入以来，`Excel` 已成为领先的电子表格软件，且可能是最容易学习的数据科学应用。对于普通用户来说，`Excel`\
  \ 看起来像一个简单的电子表格，包含组织成行和列的数据项。然而，在后台，有一系列强大的分析和数据科学引擎，计算技能最小的用户也可以为了数据科学目的而实现这些引擎。事实上，过去需要高级\
  \ Excel 技能的许多任务现在都有菜单选项，或者已经实现了自动化，只需极少编程即可实现。例如，用户可以启用 `Analysis ToolPak`（分析工具包）和\
  \ `Solver`（求解器）插件，以便在 `Excel` 中访问统计数据分析以及优化和方程求解解决方案。\n\n较新版本的 `Microsoft Excel`\
  \ 还包含用于连接到大多数数据库、数据湖和数据文件的数据引擎，以及可以可以直接从在线数据源提取数据的网页爬虫工具。它还包含了运行在人工智能（AI）平台上的强大可视化工具和数据查询工具。这些功能共同使用户能够较快速地访问所需数据，进行钻取分析和基础数据分析，并以极少的计算技能生成极具吸引力的视觉化结果。`Microsoft\
  \ Excel` 格式也是其他稍后将讨论的更复杂的数据科学工具存储和访问数据最常用的格式。\n\n## IBM SPSS Statistics\n\n自 2009\
  \ 年被 `IBM` 收购以来，`IBM SPSS statistics` 已成为数据科学领域的主要竞争者。尽管其根源于社会科学研究，但 `SPSS` 配备了多项高级功能，能够支持初学者和资深数据科学家的需求。大多数用户会发现其图形用户界面易于导航。用户还可以使用自定义菜单执行简单和复杂的分析任务并生成可视化结果。\n\
  \n`SPSS` 支持结构化查询语言（`SQL`），这使其能够直接连接数据库。它还支持多种文件格式的数据，如 `Excel`、`CSV`、`SAS` 和 `Stata`。对于更高级的用户，`SPSS`\
  \ 支持三种编程语言：其原生的 `SP own syntax`，以及 `R` 和 `Python` 编程语言（我们将稍后讨论）。兴趣于实现更高级、更自动的数据科学技术的用户也可以订阅\
  \ `IBM SPSS modeler`。\n\n与其他数据科学平台相比，`SPSS` 平台存在一些关键缺点。首先，`SPSS` 没有健壮的可视化引擎，因此输出图形的质量往往低于其他平台生成的。`SPSS`\
  \ 最初的设计并非为了处理财务数据（财务数据倾向于遵循时间序列格式），因此金融数据科学家会发现在分析财务数据的预置菜单和函数数量，以及支持编写高级财务分析程序方面存在其局限性。`SPSS`\
  \ 还缺乏可以用于管理和自动化数据科学项目中任务、例程和子程序的视觉编程平台。`SPSS` 的最后一个缺点是成本。感兴趣在使用 `SPSS` 的学生和教职工必须支付年度许可费用。\n\
  \n## Tableau\n\n数据的可视化探索是数据科学的一个至关重要的方面。事实上，可视化让数据科学家能够快速观察并交流大量数据中的趋势、强度和关系。`Tableau`\
  \ 可能是使用最广泛的数据可视化应用。它易于学习，用户无需高级编程知识即可快速生成在图形上具有吸引力且交互式的视化结果。`Tableau` 还可以快速地预处理和后处理海量数据，并将不同格式的数据链接在一起。`Tableau`\
  \ 可能拥有最全面的数据连接器列表（90 多个），这使其能够连接到存储在各种文件格式中的数据，以及存储在 `MySQL` 和 `PostgreSQL` 等开源数据库中的数据。它还有一个网页爬虫工具，可以直接从\
  \ `Google Analytics` 等在线数据源提取数据。通过一些配置，`Python` 可以集成到 `Tableau` 中，以访问一些 `Tableau`\
  \ 原生不支持但在 `Python` 中可用的高级数据科学功能。所有这些功能共同允许 `Tableau` 用户快速从数据中提取洞察，并使用高质量的图表报告他们的发现。\n\
  \n\n\n\n然而，需要注意的是，Tableau 的核心是一项商业智能应用，它非常适合报告生成工作，但不适用于进行高级数据科学技术操作，例如机器学习和深度学习。Tableau\
  \ 的一些高级功能（如访问服务器上的数据以及与 Python 集成）要求在计算方面具有更高的专业知识，这对于初学者来说具有挑战性。最后，它的许可证还有年度费用，一些用户可能会认为这笔费用过高。\n\
  \n## MATLAB\n\n从工程和科学学科进入数据科学领域的人，可能已经因为 MATLAB 在工程和科学领域的普及而对其了如指。它是一种用于科学领域技术计算和建模的专有编程语言。凭借丰富的内置函数和例程，以及处理和可视化以矩阵格式存储的强大强大能力，MATLAB\
  \ 可以成为数据科学的强有力工具。事实上，MATLAB 的优势之一是它针对数据科学应用拥有日益多的工具箱。例如，MATLAB 目前拥有统计与机器学习工具箱、深度学习工具箱和文本分析工具箱等（仅列举几个）。这些工具箱同其长期提供的计量经济学、金融、数学和优化工具箱，使\
  \ MATLAB 成为高级金融数据科学的全面武器库。然而，对使用 MATLAB 及其相关工具箱进行数据科学的读者可能会发现，对于学习者来说成本相当高。因此，相对于其他数据科学平台，MATLAB\
  \ 的生态系统和用户社区较小。\n\n## Python\n\nPython 是一种高级且可扩展的开源编程语言，具有广泛的应用。它简洁、易读，并支持面向对象的编程方法。它还是一种解释型语言，因此不需要编译器即可运行。它用于技术计算、数据科学、Web\
  \ 开发和应用程序编程。因此，Python 还拥有一个跨多个职业的大型用户社区。它能够实现这种多功能性是因为 Python 支持包含模块和/或包的广泛库列表。\n\
  \nPython 模块和包是执行相关任务的可重用 Python 代码集合。Python 程序员可以快速在其他程序中调用这些代码，而无需重新编写它们。例如，在 Python\
  \ 中进行数值分析的开发者可以在 Python 程序中调用 `NumPy` (Numerical Python) 库来执行数学操作，如线性代数、傅里叶变换、矩阵分析和随机模拟。还有其他\
  \ Python 库，例如 `Pandas`（广泛用于数据处理和分析）、`Matplotlib`（用于数据可视化）、`SciPy`（用于优化、积分和信号处理等技术计算任务）以及\
  \ `Scikit-learn`（用于预测建模和机器学习等高级数据科学任务）。Python 还支持跨平台集成。事实上，许多当前的专有数据科学应用如 `SAS`、`SPSS`\
  \ 和 `Tableau` 都集成了 Python。因此，用户可以在 Python 和专有应用之间来回切换，并获得两者的所长。\n\n所有这些特征使得 Python\
  \ 非常适合数据科学应用。在数据科学社区中，它被认为是使用最广泛的数据科学应用。尽管功能列表令人印象，但 Python 也有一些局限性，初学者可能会在数据科学之旅中发现难以克服。Python\
  \ 对连接到企业数据存储库的数据连接器没有原生支持。它也是内存密集型的，并且比 `C++` 等其他高级语言慢。尽管如此，无论偏好哪种平台，都强烈建议有志的数据科学家掌握一些\
  \ Python 编程的功能性知识。\n\n## R\n\n与 Python 的多功能性相比，R 是一种开源统计编程语言，具有多种数据科学功能。它也有庞大的用户社区，但他们大多处于学术和研究领域。它在某些方面与\
  \ Python 相似，即它是一种解释型语言并支持广泛的 `R` 包列表。事实上，已经有超过 19,000 个包为 R 用户发布。这些包括用于执行广泛统计分析、数据可视化、高级计量经济模型、数学操作和优化的包，以及用于预测建模和机器学习等高级金融数据科学任务的包。R\
  \ 还可以与 `Tableau`、`SAS` 和 `SPSS` 等专有应用集成。某些专有应用中的许多高级数据科学函数和例程本质上是后台运行的 `R` 包的封装。\n\
  \nR 也可以作为独立应用程序安装，在这种情况下，用户需要依赖代码来与应用程序交互，或者使用 `RStudio`，后者为 `R` 添加了带有菜单功能和语法编辑器的图形用户界面。`R`\
  \ 中的包通常缺乏透明度和全面的支持资源，而这些资源在类似数据科学平台的库和函数中是更易获取的。\n\n## SAS\n\nSAS 分析套件可能是最适合数据科学的平台。它提供了一套全面的数据科学工具箱，涵盖了数据科学家可能遇到的分析和商业智能生命周期的每一个方面。与大多数数据科学应用一样，SAS\
  \ 的核心是一种统计编程语言，具有跨越所有业务领域的广泛应用。\n\n对于有志和资深的数据科学家来说，SAS 有几个吸引人的特性。首先，它是一种多功能且强大易于学习的编程语言。所有\
  \ SAS 用户都欣赏其强大的支持基础设施，这些基础设施建立在大量的 `SAS` 文档、示例代码、技术支持、培训课程、会议和热情的用户社区之上。对于不同 `SAS`\
  \ 专业水平的用户，还有广泛的工具可用。初学者和高级用户都会发现许多菜单驱动的 `SAS` 应用（这些应用仍保留了编程功能），如 `Enterprise Guide`\
  \ 和 `Enterprise Miner` 在他们的分析之旅中特别有用。其他人则会发现通过 `SAS Studio` 和 `SAS Viya` 等基于 Web\
  \ 的平台对 `SAS` 引擎进行灵活的按需访问非常方便。除了这些，SAS 还拥有一个完整的数据连接器列表，允许其连接到存储在各种文件格式中的数据，包括开源和专有数据存储库中的数据，以及强大的报告工具，可以自动化大多数数据科学项目的分析生命周期。\n\
  \nSAS 在人工智能及其子领域（如机器学习、深度学习、计算机视觉、自然语言处理和金融计量经济学）的高级金融数据科学应用方面强大的强大的。它与 Python 和\
  \ R 无缝集成，使用户可以在同一个分析环境中将 `SAS` 代码与这些程序结合。尽管它是专有解决方案，但 SAS 通过其 `SAS OnDemand Platform`\
  \ 为学术和非学术社区的学习者提供了免费的软件选项。\n\n\n\nSAS 的另一个吸引人的特性是其认证计划。SAS 用户可以通过参加并通过一项或多项 SAS\
  \ 提供的认证考试来证明其 SAS 技能。SAS 还是分析领域的领导者，对 SAS 人才的需求一直非常强劲。最后，从风险管理的角度来看，用户可以确保所有 SAS\
  \ 产品和程序在发布前都经过了严格的测试，并且对于未来的升级具有单一的责任主体，这一特性在许多开源平台中是所缺的。所有这些特性使得 SAS 成为金融数据科学家眼中极具吸引力的工具，也是本书将重点介绍的主要应用程序。\n\
  \n## 使用 SAS\n\n尽管本书并未假设读者具备深厚的 SAS 编程技能，但我们在后续章节中讨论的许多概念确实需要金融、数学、统计学和计算机信息系统方面的一些基础。因此，本书的目标之一是为这些读者提供关于这些领域在金融服务行业如何相互关联的高级知识。对使用\
  \ SAS 感兴趣的用户将对访问 SAS 分析引擎的各种环境感到非常满意。在企业环境中，SAS 引擎（当前版本为 `SAS 9.4`）通常位于可通过客户端访问的\
  \ SAS 服务器上。在个人电脑上，服务器安装在本地，并可以使用 SAS 窗口环境（资源、结果、增强编辑器、日志和输出窗口）、`SAS Enterprise Guide`\
  \ 和 `SAS Studio` 进行访问。\n\n了解 `SAS Viya` 也同样重要，它是 SAS 分析平台的最新成员。SAS Viya 是一套全云端的应用程序套，具有人工智能、数据可视化、高级分析和数据管理功能，使其能够支持整个分析生命周期。尽管它与\
  \ `SAS 9` 有某些相似之处和互操作性，但它是从底层开始构建的，以支持内存处理和分布式处理。它还有自己的编程语言，称为云分析服务语言（CAS 语言）。不过，它也支持\
  \ SAS 编程语言。\n\n## SAS 窗口环境中的 Windows\n\nPC 用户还可以使用强大但基于菜单的桌面应用程序（如 `SAS Enterprise\
  \ Guide`）或基于 Web 的客户端应用程序（如 `SAS Studio`）来访问 SAS。高级分析应用如 `SAS Enterprise Miner`\
  \ 用于数据科学项目的整个范围。在本书中，我们将关注三个 SAS 环境：`SAS Enterprise Guide`、`SAS Studio` 和 `SAS Enterprise\
  \ Miner`。这三个环境之间有一些相似之处。三者都是基于菜单的，但也具有健壮的编程接口，使用户可以无缝地在点点点击的菜单任务与编写代码来实现独特任务之间来回。这三个环境还支持重复性任务的自动化，并提供了一种机制将一系列任务（流程流）、数据项和结果组织到名为“项目”的单一仓库中。每个基于菜单的任务通常是一个封装的代码包，当这些基于菜单的任务被实现时，这三个窗口都会生成相应的代码。初级用户还会发现这些功能对于编写未来的代码或为他们自己的独特任务定制软件生成的代码非常有帮助。\n\
  \n许多读者会很高兴地发现，在 SAS 中金融数据科学并不总是意味着编写 SAS 程序。对于许多任务，使用菜单可能比编写程序来实现它们更有效率。尽管如此，所有数据科学家都必须具备高水平的编程能力，并在没有菜单选项来实现某个任务时准备好应用他们的编程技能。\n\
  \n### SAS Enterprise Guide\n\n`SAS Enterprise Guide` 是一个用于处理 SAS 和管理分析项目的点点点击桌面客户端。当你点击“任务”菜单时，`SAS\
  \ Enterprise Guide` 会在后台生成 SAS 代码。然后将这些 SAS 代码提交到本地或远程 SAS 服务器进行处理。Enterprise Guide\
  \ 具有完整的编程接口，可用于编写、编辑和提交 SAS 程序到 SAS 服务器进行处理。该软件还有其他项目管理功能，例如“流程流”选项卡，允许你从头到尾管理和跟踪分析项目。你还可以自动化和调度已完成项目的执行，并使用流程流共享项目的任何元素。\n\
  \n`Enterprise Guide 8.3` 与 `GitHub` 完全集成，GitHub 是一个用于协作和跟踪软件开发项目变化的平台。用户还可以使用 `SAS\
  \ Enterprise Guide` 连接到 `SAS Viya` 平台。\n\n图 1.3：SAS Enterprise Guide 8.3 环境\n\n\n\
  ### SAS Studio\n\n`SAS Studio` 是一个基于 Web 的 界面。在 `SAS Studio` 中，SAS 程序通过常用的 Web 浏览器发送到本地或云端\
  \ SAS 服务器。服务器处理代码并以各种格式输出，包括 HTML、RTF 和 PDF。`SAS Studio` 还支持详尽的点点点击菜单任务列表，可实现基础和高级分析过程。\n\
  \n`SAS Studio` 的云端版本允许从任何连接互联网的地方访问 SAS 引擎。`SAS Studio` 还共享了 `SAS Enterprise Guide`\
  \ 中提供的许多功能，例如流程流以及连接到云端的 `SAS Viya`。尽管它运行在浏览器上，但 `SAS Studio` 可以安装为渐进式 Web 应用 (`PWA`)）。这种方法提供了更符合用户习惯的功能，例如在电脑桌面上放置\
  \ `SAS Studio` 图标。这意味着你可以跳过多个步骤到达 SAS 环境，因为一旦你点击 `SAS Studio` 图标，步骤会自动执行。`PWA` 还实现了应用持久化，使用户可以保持登录服务器除非启用超时功能。你还可以为每个\
  \ `PWA` 实例创建多个图标。\n\n### SAS Enterprise Miner\n\n`SAS Enterprise Miner` 是另一个点点点击的\
  \ SAS 应用，用于构建大型数据的描述性和预测性模型。该软件支持广泛的数据管理、统计过程和分析算法，所有这些都可以通过简单的点点点击访问。你在 `Enterprise\
  \ Miner` 中的大多数分析任务将通过流程图中的预构建的代码包完成，这些包被称为 `Nodes`（节点）。然而，该应用程序仍然支持全 SAS 编程功能，以及在软件环境中将分析模型部署到生产环境中。`Enterprise\
  \ Miner` 项目可以导入到 `SAS Viya`。`Enterprise Miner` 的另一个大特性是它与 `R` 和 `Python` 的集成。通过一些编程，可以将\
  \ `R` 包和 `Python` 模块集成到 `Enterprise Miner` 的流程流中。\n\n图 1.4：SAS Studio 环境\n\n\n图\
  \ 1.5：SAS Enterprise Miner 15.2 环境\n\n![image](img/Ch01_fig_1-5.jpg)\n\nSAS Model\
  \ Studio\n\n\n\n尽管如果你有 SAS/CONNECT 桥接许可，可以通过之前的三个平台之一访问 SAS Viya，但大多数用户会发现将 SAS\
  \ Model Studio 作为默认应用程序更有利，因为它是 SAS Viya 平台的原生应用。SAS Model Studio 是一个集成可视化环境，提供了用于构建在\
  \ SAS Viya 平台上一系列分析产品和功能。该列表包括数据管理与治理、可视化数据挖掘和机器学习、可视化文本分析、可视化预测、可视化模型管理、优化，以及对\
  \ Python 和 R 等开源平台集成的健壮支持。你还可以在 SAS Model Studio 中执行 SAS 和 CAS 编程语言编写的代码。管道（Pipelines）是\
  \ SAS Model Studio 与之前的窗口环境共享的关键特性（在 SAS Model Studio 中，处理流被称为管道）。就像 SAS Studio\
  \ 一样，SAS Model Studio 也可以安装为 PWA。\n\n图 1.6: SAS Model Studio\n\n\n## SAS 语句\n\n\
  SAS 编程涵盖了广泛的步骤、过程和函数。遗憾的是，书中无法讨论所有的内容。因此，我们将仅关注与数据科学最相关的代码和函数。用 SAS 语言编写的所有代码分为两大类：`DATA`\
  \ 步骤和 `PROC` 语句（称为过程）。\n\n### DATA 步骤\n\n`DATA` 步骤是一组用于在 SAS 中导入和处理数据的 SAS 语句。它通常以\
  \ `DATA` 为开头，随后是 SAS 顺序执行的代码块。`DATA` 步骤通常以 `RUN` 语句结束。无论当前格式如何，所有数据必须先读取并存储在 SAS\
  \ 中才能被其他 SAS 语句访问。有多种方法可以将数据读入 SAS，在下面的示例中，我们通过直接输入数据创建一个名为 `SP500FIN` 的新 SAS 数据集。原始数据包含了\
  \ 2015 年到 2022 年标普 500 指数所有公司的年销售额 (SPS)、每股收益 (EPS)、股息 (DPR) 和市盈率 (PE)。\n\n程序 1.1:\
  \ 将原始数据读入 SAS\n\ndata SP500FIN;\n    input  Date MMDDYY10. SPS DPR PE;\n    format\
  \ Date MMDDYY10. SPS Dollar10. EPS Dollar10.;\n    label SPS = 'Sales Per Share'\
  \ EPS ='Earnings Per Share' DPR= 'Dividend Payout Ratio' PE = 'Price-to-Earnings\
  \ Ratio';\n    datalines;\n12/31/2015 1106.96 89.73 53.38\n12/30/2016 1128.45 98.90\
  \ 52.35\n12/29/2017 1210.13 109.99 52.11\n12/31/2018 1313.58 133.01 46.64\n12/31/2019\
  \ 1391.09 140.42 52.45\n12/31/2020 1342.44 97.00 72.10\n12/31/2021 1541.77 200.35\
  \ 37.18\n12/30/2022 1708.91 188.41 39.34\nrun;\n\n`DATA` 语句创建了名为 `SP500FIN` 的 SAS\
  \ 数据集。`INPUT` 语句为列分配变量名。`MMDDYY10.` 是 `FORMAT` 语句，告诉 SAS 如何读取或输入数据（在此情况下按 MM/DD/YYYY\
  \ 格式读取日期）。`FORMAT` 语句告诉 SAS 如何显示数据。`LABEL` 语句为变量名分配标签`DATALINES` 语句指示每个变量观测开始。\n\
  \n### PROC 语句\n\n第二组 SAS 语句是 SAS 过程或 `PROC` 语句。它们用于在 SAS 中执行各种任务，包括统计分析、计量经济学、数据管理、可视化、报告和高级分析等。在\
  \ SAS 中实现 `PROC` 步骤时，你通常需要引用执行该过程的数据集。因此，大多数 `PROC` 语句的代码中都会包含 `DATA=`。在下一个示例中，我们使用\
  \ `PROC SORT` 语句按日期对 `SP500FIN` 数据集排序，然后使用 `PROC PRINT` 语句请求打印排序后的数据。\n\n程序 1.2:\
  \ 按日期排序\n\nby Date;\nrun;\n\nproc print data=SP500FIN;\nrun;\n\n输出 1.2: 升序打印 SAS\
  \ 数据集\n\nSAS 中的默认排序顺序是升序，但你可以将顺序改为降序。`PROC SORT` 将原始数据替换为排序后的数据。然而，你也可以通过 `PROC\
  \ SORT` 的可选参数（`OPTIONS`）指定数据排序到新的数据。大多数 `PROC` 语句都有可选参数，指定 SAS 如何执行该过程。Enterprise\
  \ Guide 和 SAS Studio 中的任务在每个过程的内置菜单中都有选项。Enterprise Guide 和 SAS Studio 还有一个推荐引擎，在你编写代码时为你建议选项。你可以查阅该过程的\
  \ SAS 文档了解有关每个语句相关的选项。\n\n程序 1.3: 按日期降序排序\n\nproc sort data=SP500FIN out=Dsorted_SP500FIN;\n\
  by descending Date;\nrun;\n\nproc print data=Dsorted_SP500FIN;\nrun;\n\n输出 1.3:\
  \ 降序打印 SAS 数据集\n\n### 输出\n\nSAS `DATA` 步骤的输出通常是新的数据集，这些数据是从输入 SAS 的（如上一个示例所示）、从现有数据集读取的或从\
  \ SAS 支持的许多数据文件格式（如文本、CSV 和 XLSX）存储的数据导入的。`PROC` 步骤获得的输出可以有多种形式，包括结果形式（表格和图表）、数据形式和报告（编译成文档的结果）。在程序\
  \ 1.4 所示的示例中，我们使用 `PROCPLOT` 为 2015 年到 2022 年标普 500 指数的年销售额 (SPS) 和每股收益 (EPS) 创建图表。输出\
  \ 1.4 是运行 SAS 代码后得到的图形。\n\ntitle 'Annual Sales Per Share and Earnings Per Share\
  \ for the S&P 500 Index';\nproc sgplot data= SP500FIN;\n    series x=Date y=SPS\
  \ ;\n    series x=Date y=EPS ;\n    xaxis grid;\n    yaxis grid;\nrun;\ntitle;\n\
  \n\n## SAS 数据与库\n\nSAS 数据存储在库（Library）中，库是一个或多个 SAS 文件的集合，被 SAS 识别并作为一个单元存储在 SAS\
  \ 服务器的本地或云驱动器中。库是磁盘文件地址，允许 SAS 访问其支持的文件。SAS 库有两种类型：永久和临时。永久库包含永久存储的文件，直到用户删除。这些文件可以在后续的\
  \ SAS 会话中访问。临时库（`WORK`）中的文件仅在当前会话中有效，通常在会话结束时删除。永久库有两种类型：默认 SAS 库和用户分配库。默认 SAS 库在每个\
  \ SAS 会话中自动创建，包括 `SASDATA`、`SASUSER`、`SASHELP` 和 `MAPS`。\n\n\n\n\n尽管存储在用户分配库中的数据在删除之前是永久的，但用户必须每个\
  \ SAS 会话中重新分配库，以便将物理地址与 SAS 库重新链接。因此，在每个 SAS 会话中必须调用 `LIBNAME` 语句以及相应的 `LIBREF`\
  \ 和文件夹物理地址来重新分配库。\n\n| 要创建 SAS 库，请提交以下 SAS 命令。将*斜体部分*替换为您偏好的 `LIBREF` 以及您计算机上文件夹的物理地址。`LIBNAME\
  \ mylib 'c:\\\\mysasdir\\\\';` |\n\n\n您可以通过在 Enterprise Guide 项目中包含 `autoexec` 文件来自动化此过程，从而在每次启动项目时自动重新分配您的库，确保库能够跨会话持久化。对于\
  \ SAS Studio，请使用 GUI 选项创建库。右键点击 `My Libraries`，包含您的 `LIBREF` 并勾选 `Re-create this\
  \ library at start-up`（启动时重新创建此库）。\n\n## 访问书籍的数据仓库\n\n本书中使用的部分数据和代码已发布在 GitHub 仓库上（[`github.com/finsasdata/Bookdata`](https://github.com/finsasdata/Bookdata)）。GitHub\
  \ 是一个用于协作项目的云托管平台。SAS Enterprise Guide 8.3 和 SAS Studio 支持与 GitHub 的完全集成。3\n\n可以通过多种方式访问书籍\
  \ GitHub 仓库中的数据。您可以使用网络浏览器访问书籍的 GitHub 仓库，将数据和代码下载到您个人计算机的偏好目录中。使用 SAS Enterprise\
  \ Guide 8.3 和 SAS Studio 的用户还可以通过提交下方程序 1.5 中的 SAS 语句将所有数据和代码下载到名为 `FINDATA` 的 SAS\
  \ 库中。为了方便读者在 Enterprise Guide 和 SAS Studio 环境中使用相同的代码，从 GitHub 仓库拉取的所有数据文件和程序都将存储在您的计算机或\
  \ SAS OnDemand 服务器的临时 SAS 文件夹目录中。\n\n### 程序 1.5：使用 SAS Git 集成访问 GitHub 数据仓库\n\n\n\
  options dlcreatedir;\n%let datapath = %sysfunc(getoption(WORK))/finsasdata;\nlibname\
  \ findata \"&datapath.\";\nrun;\n\ndata _null_;\n  rc = git_clone(\"https://github.com/finsasdata/Bookdata/\"\
  ,\n   \"&datapath.\");\n    %put rc=;\nrun;\n\n\n\n同样重要的是，SAS Git 集成只能将 GitHub 仓库克隆到您计算机上的空目录中。如果您尝试将仓库复制到已存在文件的文件夹中，将获得错误日志。如果遇到此类错误，请通过提交下方程序\
  \ 1.6 中的 SAS 语句来查找 `FINDATA` 库的物理地址，然后删除或移动所有文件（包括隐藏文件）到一个单独的文件夹。\n\n### 程序 1.6：识别\
  \ SAS 库的物理地址\n\n\nproc datasets library=findata; \nrun;\nquit;\n\n\n\nSAS 通过 HTTP\
  \ 请求从从检索文件。我们可以通过提交下方程序 1.7 中的 `PROC HTTP` 语句来访问 GitHub 仓库中的一个数据集。`STOCKS` 数据集包含六只科技股的每月价格和交易量。`FILENAME`\
  \ 语句使用‘STOCKS’ `FILEREF` 来识别请求的数据集存储名称和文件目录（在此情况下是 SAS 用于 `WORK` 库的目录）。`%SYSFUNC(GETOPTION(WORK))`\
  \ 语句获取 `WORK` 库位置的物理地址。在大多数情况下，这将包含您的临时 SAS 文件的相同文件夹。\n\n### 程序 1.7：使用 SAS HTTP\
  \ 请求访问 GitHub 数据仓库\n\n\nfilename stocks \"%sysfunc(getoption(WORK))/stocks.sas7bdat\"\
  ;\n\nproc http url=\"https://github.com/finsasdata/Bookdata/raw/main/stocks.sas7bdat\"\
  \n         out=stocks\n         method =\"get\";\n\nproc print data=Stocks(where=\
  \ (Stock='AMZN' and \nrun;\n\n\n\n\n\n\n\n\n\n\n# 输出 1.8A：标普 500 指公司汇总财务表现的描述性统计\n\
  \n`PROC MEANS` 没有格式选项。要使用您偏好的格式显示类似的结果，请使用 `PROC TABULATE` 语句。\n\n### 程序 1.8B：标普\
  \ 500 指公司汇总财务表现的描述性统计\nproc tabulate data = NSP500FIN;\n var SPSG EPSG DPRG PEG;\n\
  \ table SPSG*F=percent8.2 EPSG*F=percent8.2 DPRG*F=percent8.2 PEG, mean stddev median\
  \ max;\nrun;\n\n\n\n## 可视化描述性统计\n\n图表化描述性统计或数据可视化是一种数据科学技术，它通过图形和图像描绘，以一种视觉吸引力且交互的方式传达关于数据的风格化事实（如模式、趋势和相关性）。数据可视化技能对于金融专业人员至关重要。事实上，某些财务数据的产生频率之高，以快速交流和消化其中嵌入的信息的唯一方法就是通过可视化。因此，财务数据通常由财经媒体通过可视化进行传达（例如股票图、收益率曲线和宏观图表）。可视化也用于投资和财务分析，以及绩效分析和财务规划。\n\
  \n程序 1.8C 所示的 SAS 程序调用了 `SGPLOT` 过程，绘制标普 500 指数汇总 `EPSG` 和 `PEG` 增长率的时间序列图。在 `DATA`\
  \ 语句中，我们使用过滤器（`WHERE`）来指定绘制的数值范围（2015 年 12 月之后）。我们使用 `XAXIS` 语句来指定图表 X 轴渲染的各种配置。4\n\
  \n### 程序 1.8C：使用 PROC SGPLOT 可视化标普 500 公司财务表现\n\ntitle 'Annual EPS Growth Rate and\
  \ PEG Ratios for the S&P 500 Index';\nproc sgplot data= NSP500FIN (where=(date>'31Dec2015'd));\n\
  \      series x=Date y=EPSG;\n      series x=Date  y=PEG /Y2AXIS;\n      xaxis values=('31Dec2016'd\
  \ to '31Dec2022'd by year);\n      yaxis grid;\nrun;\ntitle;\n\n\n\n输出 1.8C 所示的图表表明，大市值的的估值似乎与其汇总收益的增长同步移动。图中明显显示了相对于汇总收益增长率的汇总估值高估和低估的时期。\n\
  \n## 推断统计\n\n本书的大多数读者可能在之前的统计学或计量经济学课程中遇到过推断统计方法。记住本章前面的节，金融计量经济学也使用推断统计方法。推断统计旨在通过研究该组的一个子集（样本），对发生在大群体（总体）中的事件或现象得出结论。这是通过使用样本作为代理，估计总体中未知特征的值来实现的。然后进行假设检验，以验证从样本中得出的统计量是否是未知总体特征的可靠估计。假设检验通常需要接受一组关于感兴趣变量的测量水平、采样方法和形状的假设和定理。\n\
  \n\n\n\n\nods graphics on;\nproc anova data= SPX_Members;\n      title 'Anova Test\
  \ of Equality of Industry Performance';\n      class Sector;\n      model ROAG5Y\
  \ = SECTOR;\n      /*通过包含以下代码来测试方差齐性。如果 Levene 检验的 p 值拒绝方差相等的零假设，则将使用 Welch 均值相等方差检验*/\n\
  \      means SECTOR/hovtest=levene welch;\nrun;\ntitle;\nods graphics off;\n\n#\
  \ 输出 1.9C: 五年板块 ROA 增长率相等性的 ANOVA 方差分析\n\n\n`MODEL` 语句指定了数值因变量（`ROAG5Y`）和独立效应（`SECTORS`）。`MEANS`\
  \ 语句用于计算效应组因变量的均值。`HOVTEST=LEVENE` 选项用于请求 Levene (1960) 方差齐性检验。而 `WELCH` 选项则用于请求\
  \ Welch (1951) 方差加权单因素 ANOVA 分析。\n\nLevene 方差齐性检验的 p 值表明我们应该拒绝零假设。因此，将使用 Welch ANOVA\
  \ 结果（如下所示），它调整了单因素 ANOVA 中的不相等方差。从 Welch ANOVA 结果中，拒绝了指数所有板块五年 ROA 增长率相等的零假设。我们可以从结果得出结论：指数所有板块的五年平均\
  \ ROA 增长率及其离散程度在统计学上是不相同的。\n\n输出 1.9D 显示了所有板块五年 ROA 增长率的箱线图。你会注意到图中，不同板块之间的 ROA\
  \ 增长率均值不同，且每个板块内部增长率的离散程度也明显不同。信息技术板块似乎具有最高的平均增长率，而消费可选板块的平均增长率波动程度最高。这种可视化进一步证实了我们推断检验得出的结论，即股票分析师的断言可能是不准确的。\n\
  \n# 输出 1.9D: 五年板块 ROA 增长率的分布\n\n\n## 诊断性分析\n\n诊断性分析用于理解趋势、事件和现象发生的原因以及方式。尽管它们通常与描述性分析和预测性分析等其他分析方法结合使用，但诊断性分析特别有用，因为它们允许我们研究受控环境中现象是如何发生的。从此类研究中获得的洞察可以建立或排除使用其他分析技术对问题进行进一步探索的需求。金融数据科学家使用诊断性分析来对复杂的现实问题进行建模，这些问题通常涉及受控设置中的不确定性因素。这些模型随后用于检查系统或现象如何响应不同的输入或信号。\n\
  \n模拟是诊断性分析中一种常用方法。模拟是数学模型，结合了所研究现实系统或过程的核心特征。例如，模拟被用于敏感性分析，以研究结果如何以及为何对某些变量的波动做出响应。组合经理可能对组合随时间推移的表现，或者当市场发生重大事件时的表现感兴趣。经理可能还感兴趣，如果对组合分布属性的假设在现实世界中真实成立，组合将如何表现。银行和其他金融服务机构使用压力测试（一种模拟方法）来研究其财务结构可能受到不利经济或市场状况的影响。\n\
  \n将在本书的后续章节中详细讨论模拟。现在，让我们探索一个简单的用例，即如何使用模拟来检查关于资产收益分布属性的假设。从历史观察中，我们确定了 1985 年到\
  \ 2022 年指数每月收益率（约 457 个月）的平均值和标准差分别为 0.677% 和 4.466%。如果我们接受股票指数收益也遵循高斯随机游走过程，就可以使用模拟来研究标普\
  \ 500 指数每月收益率的理论分布。高斯随机游走过程是一种带有漂移分量的随机过程，常用于模拟价格演变的模式。离散形式的方程规范如下。\n\n$$R_{t} =\
  \ \\mu\\Delta t + \\sigma\\varepsilon\\sqrt{\\Delta t}$$ (1.1)\n\n其中 $\\mu\\Delta\
  \ t$ 是漂移分量，代表指数的平均月收益率，$\\sigma\\sqrt{\\Delta t}$ 是指数收益过程中的随机或随机分量。\n\n现在，让我们专注于模拟股票收益过程中的随机分量。在本书的后续章节中，我们将扩展模拟范围并纳入漂移。\n\
  \n### 程序 1.10: 模拟标普 500 指数的每月收益率\n\n%let smean=0.006765;\n%let ssd=0.044657;\ndata\
  \ SSPX;\n   call streaminit(123);\n   do iter=1 to 10; /*重复次数*/\n      do time =\
  \ 1 to 457; /*模拟窗口*/\n         simret =rand(\"normal\",&smean,&ssd);\n      output;\n\
  \      end;\n   end;\nlabel Simret='Simulated Returns';\nrun;\n\n/*提取模拟收益率的描述性统计量*/\n\
  proc tabulate data=SSPX;\n   class iter;\n   var simret;\n   table iter*simret,mean*f=percent8.2\
  \ stddev*f=percent8.2;\n   table simret='Average Simulated Returns',mean*f=percent8.2\
  \ stddev*f=percent8.2;\nrun;\n\n\n\n\n\n输出 1.10 显示了调用 `TABULATE` 语句后生成的描述性统计数据。注意每次迭代计算出的样本平均值存在差异，但标准差的范围略为紧凑。你还会发现，模拟值的平均值非常接近我们输入\
  \ `RAND` 函数的分布参数。我们将在第四章中讨论支持这些发现的采样分布理论。\n\n### 输出 1.10：标普 500 指数模拟月度收益率的描述性统计\n\
  \n\n## 预测性分析\n\n预测性分析是数据科学的基础方面之一。它涉及使用数据和一系列先进统计方法来预测未来的事件、行为和趋势。更广泛地说，预测性分析旨在为决策者提供关于未来将发生什么的最优洞察。预测性分析源于数据挖掘，现已发展到涵盖广泛的统计算法、数据建模技术以及机器学习和深度学习等人工智能应用。\n\
  \n鉴于部署所需的强大的计算能力和海量可可用数据，预测性分析在金融领域的应用是无限制的。预测性分析用于算法交易、高频交易、组合构建、组合风险管理、信用风险管理、流动性风险管理、欺诈预防、合规和执法等。事实上，目前美国股市约\
  \ 80% 的交易量是由超级计算机完成的，这些计算机经过训练，可以消化并分析大量的相关的股票和经济信息以获取交易信号，然后以闪电速度执行，以实现投资价值最大化。7\
  \ 许多金融机构还利用预测性分析来识别可疑事件并防止欺诈交易。预测性分析在金融服务的另一个常见是开发用于贷款决策的信用评分模型。在书的后续章节中，我们将展示在\
  \ SAS 中预测性分析模型在金融服务应用中的某些实现。\n\n## 规范性分析\n\n预测性分析涉及使用数据和计算算法来识别特定场景或业务问题的关键因素和最佳行动方案。尽管其根于运筹学，但规范性分析与其他分析技术具有相似的基础，这在于它基于揭示选择变量之间的统计关系，并评估这些变量波动对所考虑的决策模式和可能结果的影响。规范性分析的目标是为决策者从各种选择中提供最佳选择。在某些组织中，实施规范性分析是为了扩展从之前的预测性分析活动获得的洞察。在金融领域，规范性分析主要用于解决优化问题。这些包括收入和利润最大化的线性优化问题、投资组合优化的非线性优化问题，以及风险管理和治理领域常见的随机优化问题。\n\
  \n## 机器智能与机器学习\n\n虽然“智能”和“学习”经常互换使用，但它们并不是同一的。智能是通过通过认知开发知识的能力，而学习是通过应用特定方法获取知识。例如，通过阅读和练习本书中的练习题，读者将学习到数据科学中使用的技术。智能包含了学习以及其他认知功能，如感知、注意、记忆和判断。因此，显而易见，学习是智能的子集。\n\
  \n人工智能和机器学习也是数据科学概念，且经常互换使用。然而，根据之前的区分，我们可以看到它们本质上是不同的。人工智能通过开发算法对人类智能进行计算模拟，这些算法能够感知并适应新输入，并从中合成知识，就像我们人类一样。机器学习是人工智能的一个子集，其中算法经过训练以筛选海量数据并从中学习。人工智能和机器学习算法用于金融领域在前节描述的预测性分析案例。金融领域广泛使用的黑箱交易策略依赖于利用机器学习从金融和经济数据推导出交易信号的算法。这些信号通常基于复杂的、有时不可解释的关系，算法通过纯粹应用暴力计算和对输入变量进行复杂的变换，从数据中解读这些关系。\n\
  \n## 监督学习、无监督学习与强化学习\n\n机器学习技术分为三大类：监督学习、无监督学习和强化学习。这些类别之间的主要区别在于算法训练解决预测或分类问题的过程。\n\
  \n### 监督学习\n\n在监督学习中，算法被训练从一组潜在预测因子中识别目标结果或结果范围的预测因子。算法通过评估给定的预分类结果与其潜在预测因子之间显性及潜在的关系进行迭代学习。从本质上说，算法通过建立预测因子与目标变量之间关系的存在，来学习哪些变量可以预测目标结果。尽管监督学习在概念上很简单，但它仍然是金融领域一种强大且广泛使用的数据科学技术。监督学习技术用于投资决策、股票预测模型和信用风险模型等。这些算法的示例包括：\n\
  \n* 决策树\n* 随机森林\n* 神经网络\n* 回归模型\n* 支持向量机\n\n### 无监督学习\n\n无监督学习算法输入的是未标记的数据，其任务是识别它们之间是否存在共性。这种方法与其他学习技术的区别在于，在迭代过程中所需的人为干预程度最低。算法的本质任务是筛选数据，以寻找其中存在的共同模式或隐藏分组，而无需预先了解此类结构或模式。算法通过迭代对变量进行聚类或组织来学习，使得数据的每个分组会越来越多地共享共同属性或与其他分组的区分特征。\n\
  \n金融数据科学家使用无监督学习进行降维和数据聚类。金融和经济变量共享相似的底层属性；因此，降维和数据聚类对于金融的大数据应用特别有用。它们有助于实现在参数和非参数方面都有效的良好监督学习模型。无监督学习在金融中的实际应用包括组合构建、风险治理和资产定价。无监督学习的常见类型包括：\n\
  \n* 主成分分析\n* K 均值聚类\n* 层次聚类\n\n\n\n\n\n## 强化学习\n\n强化学习算法将“胡萝卜与大棒”的概念应用于机器学习。该算法通过激励函数学习识别数据中的关系，这些激励函数会对算法的错误预测进行惩罚，并对其准确的预测给予奖励。算法通常不会被告知应该预测或分类什么，而仅根据其预测或分类的准确性获得奖励或惩罚。与人类行为相似，算法通过激励函数与问题之间的联系迭代地学习解决预测或分类问题。学习从根本上被框架化为一个优化问题，算法寻求通过预测或分类的准确性来最大化奖励并最小化成本。强化学习是金融领域的一个新兴领域，但在自动化个人财务理财服务（也称为机器人理财）、投资游戏化和交易执行等领域具有广阔前景。常见的强化学习算法类型包括：\n\
  \n* 序列决策算法\n*   基于值的决策算法\n*   基于策略的决策算法\n\n## 参数化与非参数算法\n\n参数化算法使用一组定义的参数来模拟目标结果与预测变量之间的关系。它们通常采用一组假设来定义预测变量与目标之间的关系。这些假设从根本上定义了算法学习以构建目标变量预测或分类模型的映射函数。例如，简单逻辑回归假设目标变量是二元的、观测值之间相互独立、预测变量之间几乎没有多共线性，且预测变量与目标变量的对数（logit）之间存在线性关系，等等。非参数算法则对预测变量与目标变量之间的关系不作特定假设。因此，它们不需要特定的映射函数，就可以估计任何形式的未知函数。\n\
  \n需要注意的是，虽然监督学习和无监督学习算法包含了参数化和非参数算法，但非参数算法往往更多出现在无监督学习算法类别中。非参数类型监督算法的一个示例是决策树算法，我们将在书后的章节中讨论它。\n\
  \n## 金融数据科学的局限性\n\n数据科学技术是解决许多和社会业务问题的强大工具。然而，它们确实存在一些局限性。我们在下面强调其中两点。\n\n## 性能下降\n\
  \n如前所述，算法解决预测和分类的能力取决于发现数据中的模式和关系。在许多情况下，这些模式和关系本质上是瞬时的。因此，这些算法在业务环境中的有效性往往也是瞬时的。预测算法的性能下降是预测和机器学习模型广泛认可的问题。这是一个特别具有挑战性的问题，因为当这些模型应用于金融环境时，往往涉及巨大的利益（至少在财务上）。随着分析模型的功能效能的下降，在金融环境中部署它们的经济成本会增加。因此，金融数据科学家的分析生命周期是一个持续循环，基于现有模型随时间推移失去效力而不断更新或开发新模型的需求。\n\
  \n## 过拟合与欠拟合\n\n在将预测模型部署到生产环境之前确定最佳准确率，仍然是数据科学领域辩论的前沿。虽然人们通常认为在开发阶段过拟合的模型在生产阶段表现很可能很差，但同样的观点也适用于欠拟合的模型。鉴于此类结果在金融环境中的影响，对模型性能进行诚实的评估至关重要。\n\
  \n诚实的模型评估使用与训练模型不同的数据集集来判断模型的性能。训练数据集用于训练算法，在模型训练期间，验证数据集被迭代地用于评估所需的模型特征。在某些情况下，在模型部署生产之前，还可能使用最终的测试数据集进行进一步评估。我们将在第七章中更详细地讨论诚实评估。\n\
  \n你应该注意，金融领域对模型拟合的担忧超越了数据过拟合和欠拟合的问题。在某些金融场景（如股票交易）中，算法与其他算法和人类交易者进行持续交互。然而，股票交易本质上是一种伪对抗性交易，因此算法可能容易受到其他市场参与者对抗策略的影响。（参阅\
  \ Nehemya et. al, 2020。）例如，算法可能会无意中拟合由其他算法或市场参与者故意投放的坏输入。由于交易算法从数据中学习，它们也可能无意中学习市场数据中的不伦理或非法模式——这些市场操纵或合谋行为。因此，模型可能会从数据中学习错误的教训。随着黑箱交易的泛滥，我们可能不知道这是否真的正在发生。\n\
  \n## 伦理、偏见、透明度与经济问题\n\n数据科学在人类几乎所有活动范围内的广泛应用引发了若干伦理、社会和经济关注。在你练习数据科学技艺时，意识到这些问题以及它们如何影响数据科学在金融应用中的效用是非常重要的。我们对现代社会广泛使用数据科学技术产生的一些伦理、社会和经济问题进行了简要总结。\n\
  \n## 金融数据科学中的伦理问题\n\n从伦理角度来看，人们对依赖算法进行决策表示了担忧。人类决策通常需要平衡各种权衡和细微差别，而算法并不自然具备处理这些的能力。算法通常围绕效率和理性的概念设计，这些有时会与观察到的人类行为、情感和偏好（例如利他主义和公平性）发生冲突。\n\
  \n\n\n\n\n\n## 偏见\n算法从提供给它们的信息学习，如果信息存在偏见，算法做出的预测或分类也可能存在偏见。沿着这一思路，有人认为算法实际上加剧了社会问题，因为它们会从社会数据中学习并强化现有的偏见。例如，加利州大学伯克利分校教授\
  \ 2018 年的一项研究发现，虽然基于算法的抵押贷款决策在贷款审批方面对少数族贷款人的结果比面对面审核更少歧视，但在控制了贷款审核过程中所有其他风险因素（如收入、信用评分和贷款金额）后，少数族贷款人的利率仍显著高于白人贷款人（Bartlett\
  \ et al., 2019）。\n\n## 透明度\n随着开发的算法日益复杂，相关的成本之一是可解释性的丢失。算法本质上正在变成黑箱，接受输入并产生输出，终端用户必须盲目接受。可解释模型在决策制定中至关重要，因为它们允许决策者将决策结果与输入的观测、重复且可评估的函数联系起来。这让用户知道他们为什么要遵循算法推荐的一系列操作。机器不是完美的，它们有时会故障，如果没有透明度，我们可能在为时已晚之前不知道发生了此类故障。关于我们之前对闪崩的讨论，将这些交易员的行为视为输入是有用的，这最终导致所有这些交易算法以剧烈波动市场的方式做出反应。然而，鉴于我们通常对算法交易黑箱的运作仍然缺乏完全理解，到目前为止监管的干预限于实施断路器，以防止问题在发生时进一步恶化。\n\
  \n## 经济\n过去三十年来我们在全球经济中看到的许多结构性变化可以追溯到计算技术的进步。如果我们根据最近的历史来构想未来经济的样貌，结论将是：未来是一个由先进数据科学驱动的计算经济。然而，这种未来引发了许多数据科学家和政策制定者需要应对的问题。例如，那些工作或行业被算法干扰或取代的人会发生什么？政策制定者将如何应对经济不平等？某些人认为算法加剧了这种不平等（Zatko,\
  \ 2022）。我们作为一个社会，愿意向向算法交出多少控制权和自主权？监管和法律格局如何对潜在的新型颠覆性技术进行演变？当我们越来越依赖数据科学来驱动经济时，这些是社会需要解决的几个经济困境。\n\
  ## 监管格局\n金融机构是高度监管的实体，多年来，这些机构变得越来越依赖数据科学来驱动其业务流程和合规报告，从而在行业内数据科学的使用上形成了一个监管关注的纽带。在本书，我们将探索金融机构用于监管报告目的的数据科学两个领域。具体而言，我们将关注如何使用数据科学进行市场和信用风险建模。\n\
  \n风险建模本身是一项高风险尝试，因为它涉及对未来风险结果的预测。对于金融机构来说，此类预测通常与资本准备、风险治理和预算以及战略业务选择的监管指令相关。因此，在金融服务组织中使用数据科学技术时需要格外小心。事实上，所有具有监管报告要求的金融服务组织都要求遵守模型风险管理框架。这项指令旨在确保它们的建模过程符合最佳实践，并确保它们为监管目的呈现机构财务状况的准确图景。\n\
  \n对于市场风险，我们将探索 `SAS` 中风险价值（`VaR`）实现的示例。\n对于信用风险，我们将探索 `SAS` 中与信贷组合相关的各种可报告指标的实现。这包括对信贷债务组合的信用敞口、违约概率及其决定因素进行建模。\n\
