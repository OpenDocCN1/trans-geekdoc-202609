  \n[content]\n随机过程描述了随机变量随时间发生的情况。常见类型随机过程的统计属性是你在构建现实世界现象或系统的模拟模型之前，必须具备的一项至关重要的知识，特别是在金融领域。在在第三章中，我们讨论了时间序列数据的多种统计属性，例如趋势、周期性、季节性和自相关性等。这些属性以及数据的分布特性共同构成了你在金融领域中会遇到的不同类型随机过程的基础。与分布一样，随机过程可以以连续或离散时间过程的形式存在。连续时间随机过程\
  \ `X(t)` 被定义为固定时间 `t`（其中 `t` ∈ `[0,∞)`）上所有实现值的集合 `{X[t[1]]`、`X[t[2]]`、……`X[t[j]]}`。在这里，索引变量\
  \ `t` 是实数连续取值集中的元素，如下所示。\n\n`{X[t], t∈0,∞)} (4.3)`\n\n例如，`X(t)` 可以是在时间 `t` 间隔采样的股票价格集合，可以是分钟、小时或每天。注意，在每个间隔内，根据可用的计算资源，你可以收集到几乎无限数量的数据点。尽管大多数人对每日股票价格熟悉，但实际上，股票价格的记录频率通常远高于每日。[4\n\
  \n离散时间随机过程 `X(t)` 是其实现值 `{X[t[1]]`、`X[t[2]]`、……`X[t[j]]}` 发生在可计数集 `J` 上，其中 `J` =\
  \ `{t[1]`、`t[2]……}`。在这里，索引变量 `t` 是可计数集 `J` 中的元素，如下所示。\n\n`{X[t], t∈J} (4.4)`\n\n\
  离散时间随机过程也被称为在离散间隔 `t` 采样的随机变量序列。在这种情况下，例如 `X(t)` 可以是公司在定义期间内（如每日、每周、每月或季度）销售的产品数量。注意，这些间隔中的每一个都是独特的时间单位。通过增加采样窗口也可以对连续时间随机过程进行离散化（例如从逐笔股票价格变为每日价格，即在每个交易日收盘时进行采样）。\n\
  \n无论随机过程是以离散还是连续的方式演变，这些过程共同拥有的特征是它们随时间演变过程中蕴含的不确定性元素。我们将探索这些元素，并在在本章的后续章节中，在对股票价格和资本项目进行的模拟中利用这些元素。连续和离散时间随机过程是金融领域常用各种类型随机过程的广泛泛化。事实上，这些许多过程具有独特特性，适用于对金融领域特定类型的现象进行建模。更具体的随机过程类示例包括：高斯过程、维纳过程（布朗运动）、随机游走、伊藤过程、几何布朗运动和均值回归（Ornstein-Uhlenbeck）过程。\n\
  \n\n\n\n```sas\n/*模拟 10 分钟外汇收益率 */\ndata simul6;\n%let mu=-0.0000066;\n%let sigma=0.003600;\n\
  \    format Date datetime.; \n    keep Date Returns;\n    call streaminit(4321);\n\
  \        InitDate = '2Jan2021:00:00'dt;\n        dt=0;\n    do i = 1 to 1008;/*一周内有多少个\
  \ 10 分钟*/\n              dt+10;\n              Date=    intnx('minutes',InitDate,dt);\n\
  \              Returns= rand('normal',&mu,&sigma);\n              output;\n    end;\n\
  run;\nproc sgplot data=simul6;\n        inset \"USD/EUR Exchange Rate\"/title=\"\
  模拟的 10 分钟外汇收益率\" position=top \n        textattrs=(family=\"Times New Roman\" color=darkblue\
  \ size=12 ) valuealign=center \n        titleattrs=(family=\"Times New Roman\" color=darkblue\
  \ size=12 weight=bold) \n        labelalign=center;\n        series x=date y=Return;\n\
  \        xaxis label= \"日期\" valuesformat= datetime.;\n        yaxis label= \"收益率\"\
  \ valuesformat= percent8.2 values=(-0.02 to 0.02 by .01);\nrun;\n```\n\n输出 4.6 显示了\
  \ USD/EUR 汇率收益的模拟值。虽然一眼看图表似乎该序列非常波动，但实际上，它的噪声性大于波动性。这是因为仔细观察图表可以发现，在模拟序列中超过 1% 的\
  \ 10 分钟价格变化极其罕见。\n\n输出 4.6: 模拟高频外汇收益率\n\n| ![image](img/Ch04_out_4-6.jpg) |\n\n\
  大部分的价格波动都是微小的价格修正，这在噪声市场数据中很典型。\n\n## 维纳（布朗运动）过程\n\n这是一种特殊的高斯随机过程，其初始值为 `W[t[0]]\
  \ = 0`，且对于所有 `t > 0`，`W[t]` 具有平稳增量，使得对于 `W[t]` 在 `{t[0]<t[1]<t[2]<,.....t[j]}` 的所有未来实现，增量\
  \ `{W[t[1]]−W[t[0]],W[t[2]]−W[t[1]],...,W[t[j]]−W[t[j-1]]}` 是独立的随机变量。`W[t]` 在时间\
  \ `t` 上也是连续的。5 根据中心极限定理，对于任何 `t ∈ [0,∞)`，随着 `t→∞` 且每个增量之间的间隔（`t[j]-t[s]`）→0，对于所有\
  \ `s, t ≥ 0`，增量 `W[t[j]]−W[t[j-s]] ∼ N(0,t)`。\n\n理解布朗运动属性的一种简单方法是它是一个连续过程，由从正态分布中抽取的独立平稳增量组成。由于增量是平稳的，从该过程中等距离间隔抽取的随机样本将具有相同的分布特性\
  \ `N(0,t)`，这意味着具有有限的方差。\n\n布朗运动的其他属性包括：\n\n*   **马尔可夫性**：这意味着过程的现在和未来实现不依赖于其过去的结果。（换句话说，假设\
  \ `X[t] = W[t[j]]−W[t[j-s]]`；那么 `X[t]` 独立于信息集 `ℑ(s)`6 在时间 `t[j]` 可用。）\n\n*   **鞅性**：根据马尔可夫性，由于过去信息与过程的未来无关，其未来期望也是无关的。因此，给定现有信息集，`E[X[t+s]|ℑ(s)]`\
  \ 等当前值 `X[t]`。\n\n布朗运动过程是著名的随机游过程的极限。该过程的其他推广形式还包括带漂移的布朗运动和几何布朗运动。熟悉这个概念很重要，因为它是本章后续章节进行的一些模拟的基石。布朗运动的推广形式所示：\n\
  \n`dX[t] = μ[t] + σ[t]dW[t]`\n\n## 随机游过程\n\n布朗运动的离散版本通常被称为带漂移的随机游，所示：\n\n`ΔX_t =\
  \ μ(X_t)Δt + σ(X_t)√t`\n\n带漂移的随机游过程所示：\n\n`ΔX_t = μ(X_t)Δt + σ(X_t)√t` (4.8)\n\n\
  由于布朗运动成分的期望值为零，带漂移成分的过程期望值为 `E[ΔX] = μt`，而方差为 `σ²t`。带漂移随机游过程的主要特征是确定性趋势和随机趋势的存在。此外，随机趋势成分是不规则变化的。注意公式\
  \ 4.7 描述的是底层变量的变化率而非水平，我们可以从变化中推断。理解漂移成分的一种方式是它是某些底层因素的长期影响。在股票价格背景下，带漂移的随机游过程意味着明天股票价格的最佳预测是今天的股票价格加上漂移项。你应该注意还有一种纯随机游过程，其中没有漂移。在这种情况下，明天价格的最佳预测将仅仅是今天的价格，如下方的公式\
  \ 4.9 所示。\n\n`X[t+1] = X[t] + ε[t+1]` (4.9)\n\n\n\n\n让我们模拟如果股市收益率确实遵循随机游走过程，其表现将会是怎样的。我们假设股票价格根据公式\
  \ (4.8 中的规格进行演变，其中漂移率 `μ` = 0，方差率 `σ²` = 0.001。我们还假设时间间隔 `Δt` = 1。我们将同时使用 `DATA`\
  \ 步和 `IML` 过程来模拟随机游走股票收益数据，并在模拟结束时进行一些比较。程序 4.7A 显示了在 `DATA` 步方法使用的代码，而程序 4.7B 显示了在\
  \ `IML` 方法使用的代码。对于 `DATA` 步方法，高斯收益模拟与随机游走模拟之间的区别在于在规格中包含了漂移率。这是因为我们正在模拟随机游走的一个特例，称称为高斯随机游走。然而，与高斯过程不同，高斯随机游走并不是弱平稳的，因为该过程的均值和自协方差随时间保持不变。8\
  \ 该过程的趋势成分在输出 4.7 所示的图中显而易见。\n\n### 程序 4.7A：使用随机游走属性模拟股票收益（使用 DATA 步）\n\n```sas\n\
