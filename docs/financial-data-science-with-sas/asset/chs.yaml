  | --- |\n\n主成分分析\n\n主成分分析 (PCA) 通过将数据集投影到低维空间来缩小高维数据集的。该过程创建了一个具有较少解释变量（称为主成分）的合成数据集，同时尽可能地保留原始数据集中的变异。因此，PCA\
  \ 方法试图找到一组最能解释原始数据方差的合成变量。从投影中导出的第一个变量具有最高方差，其次是方差次高的变量，依此类推。\n\n在现实中，有多种方法可以导出\
  \ PCA 变量。然而，PCA 的实际构建通常使用矩阵代数实现。我们将 `X` = (`x[1]`, `x[2]`,...,`x[p]`) 表示为具有 `n`\
  \ 行 `p` 列的特征矩阵，其中 `x[j]` 是第 `j` 个特征变量的 `n` 个观测向量。主成分分析将 `X` 总结为矩阵 $Z = \\alpha X^{d}\
  \ = {\\sum\\limits_{j = 1}^{p}{\\alpha x_{j}^{d}}}$,其中 `α` = [`α[1]`, `α[2]`,...,`α[p]`]`\
  \ 是常数向量集合，`X^(d)` = [`x[1]^(d)`, `x[2]^(d)`,...,`x[n]^(d)`]` 是第 `j` 个特征变量的去均值（中心化）向量，而\
  \ `αX^(d)` 是 `X` 投影到 `m` ≤ `p` 维空间变量 `Z` 的变换。令 `Z` 的协方差等于 `Z′Z` = `α′Σα`,其中 `Σ`\
  \ 是 `X^(d)` 的协方差矩阵。那么 `X` 的第 `j` 个主成分是使 `α′[j]Σα[j]` 最大化的 `α[j]`，写为：\n\n\n\n\n`PRINCOMP`\
  \ 过程也会产生大量的输出。目前，我们将重点关注主成分的特征值和特征向量表（这些显示在输出 6.11A 中），以及碎石图、解释比例、累计解释比例和成分模式图（这些显示在输出\
  \ 6.11B 中）。主成分的特征值范围从 `0.182` 到 `3.245`。特征向量的值显示 `log revenue`、`log market cap`、`log\
  \ number of employees` 和 `log number of shares outstanding` 与第一主成分高度相关。事实上，在 `PROBIT`\
  \ 和 `LOGIT` 模型中省略了收入的 `log` 值，以减少多重共线性引起的偏误概率。关于用于进一步分析的有意义分量的的选择，如果应用 `Kaiser 规则`，将选择\
  \ `1` 到 `5` 个成分（使用 `80% PVE` 规则则选择 `1`–`6` 个成分，使用`肘部法则`则选择 `1`–`7` 个成分）。\n\n输出 6.11B\
  \ 显示了之前在`特征值表`中报告的特征值的碎石图。注意数值从第一个主成分到第二个主成分、从第五个主成分到后续主成分下降的速度有多快。`Variance Explained`\
  \ 图显示 `80%` 的方差由前六个主成分解释，超过 `90%` 由前十个主成分解释。`成分模式图`显示了每个变量与主成分之间的相关性。例如，第二个主成分的图（红色）显示该成分与\
  \ `beta` 正相关，但与 `Age` 负相关。\n\n输出 6.11B：碎石图、方差解释图和成分模式图\n\n| ![image](img/Ch06_out_6-11b.jpg)\
  \ |\n| --- |\n\n现在已经对原始数据执行了主成分分析，读者应该考虑重新估计之前的 `probit` 和 `logit` 模型，将原始变量替换为选定的主成分。\n\
  \n## 事件时间模型\n\n在商业环境中，感兴趣的事件的幅度（例如违约的财务影响）并不是决策者唯一关注的问题。在许多情况下，组织可能对感兴趣的事件最可能发生的时间以及影响到事件持续时间的因素也感兴趣。这类洞察可以帮助组织战略性地部署资源，以缓解具有潜在负面结果事件（如贷款违约）的影响，或者在感兴趣的事件导致潜在积极结果（如破产重组）时寻求投资机会。事件时间分析通常被称为生存分析。\n\
  \n## 生存分析\n\n`Survival Analysis`是对感兴趣的事件时间的统计学研究。这类研究的预测部分对可能影响事件持续时间或事件在特定时间窗口发生概率的因素进行建模。生存分析常用于医疗保健领域；然而，该方法在金融领域也有许多用途。特别是，生存分析被保险行业用于模拟寿命，被投资行业用于模拟信贷违约或逾期时间或其他风险事件（如公司行为和交易执行）的发生时间。生存分析中的响应变量是\
  \ `time`，由于许多生存分析研究中的 `time` 变量不呈正态分布，因此依赖正态性假设的回归模型不适用于此类事件的建模。\n\n生存分析数据的一个共同特征是`censoring`（截删）。当我们由于各种原因无法观察到受试者感兴趣的结果时，就会发生`censoring`。可能是因为样本期在某些受试者感兴趣的事件发生之前结束了，或者由于无关事件的发生导致无法收集更多数据而将其从样本中移除（`right\
  \ censoring`）。感兴趣的事件也可能在收集数据之前就已经发生在受试者身上，这导致无法确定事件的真实时间（这被称为`left censoring`）。当感兴趣的事件发生在观测期内的两个时间点之间，但我们无法确定确切的时间点时，就会发生`Interval\
  \ censoring`（区间截删）。`Left censoring`和`interval censoring`在金融环境中并不常见，因此我们主要主要关注右截删。\n\
  \n生存分析中三个重要的关注点是生存函数、危险函数和概率密度函数。`survival function`是受试者在参考时间之后感兴趣的事件未发生的概率。与之类似的是`hazard\
  \ function`，即在事件未发生的情况下，事件在某一点发生的概率。最后一个关注点是`probability density function`，即每单位时间内的发生频率。\n\
  \n让我们应用生存分析对事件进行建模。我们将 `T` 定义为事件发生的时间。信用债务人在时间 `t` 不违约或逾期的`survival function`可以表示为：\n\
  \n```\nS(t) = P(T > t)\n```\n\n生存函数并没有排除随时间推推逾期；它只是逾期在未来某日发生的概率。时间窗口越大，逾期发生的概率越高。生存函数的补集是`cumulative\
  \ distribution function`（累计分布函数），它描述了在窗口内发生逾期的概率。\n\n```\nF(t) = 1 - S(t) = P(T\
  \ < t)\n```\n\n根据上述知识，我们可以写出在精确时间 `t` 发生逾期的概率密度函数：\n\n```\nf(t) = -dS(t)/dt = lim_{t→0}\
  \ P(t ≤ T ≤ t + Δt)/Δt\n```\n\n在公式 (6.65)中，假设默认时间 `T` 发生在瞬时为 0 的间隔 `t` 到 `t+Δt`\
  \ 之间。在没有之前违约或逾期历史的情况下，定义`t`时刻发生违约或逾期概率的`hazard function`现在可以写为：\n\n```\nh(t) = lim_{t→0}\
  \ P(t ≤ T < t + Δt | T ≥ t) = f(t)/S(t)\n```\n\n与生存函数相反，危险函数会根据受试者的特征以及解释这些特征随时间变化的底层因素而随时间增加或减少。`cumulative\
  \ hazard function` `H(t)` 是直到参考时间累积的逾期风险，写为：\n\n```\nH(t) = ∫[0]^t h(t) dt = -log(S(t))\n\
  ```\n\n生存函数与累计危险函数之间的关系也可以用生存函数表示如下：\n\n```\nS(t) = exp(-H(t))\n```\n\n\n\n\n\n\
  所研究的信贷组合中的截删观测将包括在研究期间全额偿还贷款的债务人，或在研究结束前未发生违约的债务人。因此，我们可以如下式所示，将这两类借款人在截删时间 `C[i]`\
  \ 处的截删指示 `δ[i]`标记为零，并将发生信誉违约的人员标记为一。\n\n$$\n\\delta\\_{i} = \\left\\{ \\begin{array}{l}\
  \ {1\\{~:~}T\\_{i} \\leq C\\_{i}} \\\\{\\\\\\text{0~:~}T\\_{i} > C\\_{i}} \\\\ \\\
  \\\\endarray} \\right. (6.69)\n$$\n\n`T[i]` 是生存时间，当主体被截删时它是不可观测的。我们可以将主体 `i` 的观测时间泛化为\
  \ `U[i] = min(T[i],c[i])`。在现实中，我们能够观测到 `U[i]` 和 `δ[i]`（也就是说，测量点的时间以及主体是否被截删）。因此，我们的似然函数与事件发生的时间以及主体被截删的概率成正比。\n\
  \n| 由于生存分析中关注的项大多是感兴趣事件的概率，因此可以使用似然函数来指定，这些函数反映了已截删的主体 `i` 在未来发生感兴趣事件的概率，或者在主体未被截删时事件瞬间发生的概率。\
  \ |\n| --- |\n\n如果我们假设 `t[i]` 是独立同分布的且具有概率分布 `f(t[i])`，那么其密度函数可以写为：\n\n$$\n\\begin{array}{l}\
  \ {L\\_{i}\\left( F \\right) = f\\left( t\\_{i} \\right) = \\left\\{ \\begin{array}{l}\
  \ {f\\left( t\\_{i} \\right)\\{~~~~~~~~~~~~~~~~~if~}\\delta\\_{i} = 1} \\\\ {S\\\
  left( t\\_{i} \\right)\\{~~~~~~~~~~~~~~~if~}\\delta\\_{i} = 0\\text{~~~~~~~~~~~~}}\
  \ \\\\ \\\\\\endarray} \\right.} \\\\{\\\\\\text{~~~~~~~~~~~~~~~~~~~~~~~=}\\left\\\
  lbrack {f\\left( t\\_{i} \\right)} \\right\\rbrack^{\\delta\\_{i}}\\left\\lbrack\
  \ {S\\left( t\\_{i} \\right)} \\right\\rbrack^{1 - \\delta\\_{i}} = \\left\\lbrack\
  \ {f\\left( t\\_{i} \\right)} \\right\\rbrack^{\\delta\\_{i}}\\left\\lbrack {1 -\
  \ F\\left( t\\_{i} \\right)} \\right\\rbrack^{1 - \\delta\\_{i}}} \\\\ \\\\\\\\\
  endarray} (6.70)\n$$\n\n我们也可以用参数空间 `θ` 来表示密度函数，即 `f(u[i];θ)`，其中 `f` 是已知分布，`θ` 是未知的参数空间。所有情况的似然函数可以写为：\n\
  \n$$\n\\text{~~~~~~~~~~L}\\left( F \\right)\\text{}=\\underset{i = 1}{\\overset{n}{\\\
  Pi}}\\text{L}\\_{i}\\left( F \\right) = \\underset{i = 1}{\\overset{n}{\\Pi}}\\\
  left\\{ {f\\left( {u_{i};\\\\theta} \\right)^{\\delta\\_{i}}\\left\\lbrack {1 -\
  \ F\\left( {u_{i};\\\\theta} \\right)} \\right\\rbrack^{1 -}{}^{\\delta\\_{i}}}\
  \ \\right\\} (6.71)\n$$\n\n这种规范允许我们将事件发生时间的似然建模为一组条件分布参数的函数。正如我们很快看到的，该规范还可以扩展为将条件分布建模为一组解释变量及相关参数的函数。上述内容的对数似然可以写为：\n\
  \n$$\n\\begin{array}{l} {L\\_{n}\\left( \\theta \\right) = {\\\\sum\\limits\\_{i\
  \ = 1}^{n}\\left( {\\\\delta\\_{i}\\log\\left\\lbrack {f\\left( {u\\_{i};\\\\theta}\
  \ \\right)} \\right\\rbrack - \\left( {1 - \\delta\\_{i}} \\right)\\log\\left\\\
  lbrack {1 - F\\left( {u\\_{i};\\\\theta} \\right)} \\right\\rbrack} \\right)}} \\\
  \\{\\\\\\text{~~~~~~~~~~~~~=}{\\sum\\limits\\_{i = 1}^{n}\\left( {\\\\delta\\_{i}\\\
  log\\left\\lbrack {h\\left( {u\\_{i};\\\\theta} \\right)} \\right\\rbrack} \\right)}\
  \ - {\\\\sum\\limits\\_{i = 1}^{n}\\left( {H\\left( {u\\_{i};\\\\theta} \\right)}\
  \ \\right)}} \\\\ \\\\\\\\endarray} (6.72)\n$$\n\n生存函数的极大估计量是使 `L[n]` 最大的参数空间 `θ̂`，其表示法为：\n\
  \n$$\nθ̂ = Ln (6.73)\n$$\n\n生存模型可以使用参数方法和非参数方法进行估计。对于参数方法，两种常用的规范函数是 `exponential`\
  \ 和 `weibull`。`weibull` 分布允许风险函数单调地增加或减少，而 `exponential` 分布假设风险率是恒定的。风险率的非参数估计量包括\
  \ `Kaplan-Meier` 估计量，它计算生存概率（不违约概率）。\n\n累积风险函数也可以 `Nelson-Aalen` 估计量进行估计：\n\n$$\n\
  \\hat{H}(t) = \\sum_{i:t_i < t} \\frac{d_i}{n_i} (75)\n$$\n\n### 比例风险模型\n\n生存分析在信贷领域的另一个有用应用是使用该模型来研究事件发生时间（在此情况下为违约或逾期）与一组预测变量之间的联系。这通常使用\
  \ `Cox` 风险模型完成。`Cox` 风险模型将事件发生时间指定为一个或多个风险因素或暴露量的函数。在模型中，作为响应变量的风险率代表单位时间内事件的数量。`Cox`\
  \ 风险模型的假设包括：预后变量对风险的影响随时间保持不变，且与该关系上是乘性的。该模型还假设主体间的生存时间是独立的，并且风险比（风险函数与基准风险之比）随时间保持恒定。该模型可以写为：\n\
  \n$$\nh(t) = h0\\exp(β[1]x[1]+....+β[p]x[p]) (6.76)\n$$\n\n其中 `h(t)` 是由一组预后变量决定的风险函数，`(x[i],...,x[p])`\
  \ 是协变量矩阵，`(β[i],...,β[p])` 是待估计的风险参数向量。`h0` 是基准风险率，对应于所有 `x[i]` 都等于零时的风险值。思考参数估计值与风险函数之间关系的一种方法是在对数风险比的背景下评估它们：\n\
  \n$$\n\\left[ \\log\\left( \\frac{h(t)}{h_0(t)} \\right) = \\beta_1x_1 + ,... +\
  \ \\beta_px_p \\right]\n$$\n\n类似于逻辑回归中的优势比，在保持所有其他协变量不变的情况下，协变量单位变化对对数风险比的边际效应可以从参数估计值\
  \ `β[i]` 中导出。\n\n\n\n\nSAS/STAT 软件包含了一系列过程，可用于各种类型的生存分析。通常情况下，这些过程分为两类：第一类过程在过程名称中通常带有\
  \ ‘TEST’ 后缀（例如 `ICLIFETEST` 和 `LIFETEST`），用于执行非参数生存分析。第二类过程在名称中带有 ‘REG’ 后缀，用于对生存数据进行参数估计和回归分析。它包含了\
  \ `ICPHREG`、`LIFEREG`、`PHREG` 和 `SURVEYREG` 过程。在本章中，我们将探索 `LIFETEST` 过程，该过程使用 Kaplan-Meier\
  \ 方法或生命表（life-table）方法对生存函数进行非参数估计；以及 `PHREG` 过程，该过程使用 Cox 比例风险模型模型对生存数据进行回归分析。\n\
  \n除了计算生存函数的非参数估计外，我们还可以使用 `PROC LIFETEST` 中的 `LIFETEST` 语句和 `PLOT` 选项来生成生存曲线、风险函数和累积发病率等。`LIFETEST`\
  \ 语句还可使用 Nelson-Aalen 估计器（`NELSON` 选项）来估计累积风险函数，并将过程的输出数据存储到 SAS 数据集中。`TIME` 语句用于指定失败时间变量和截尾变量，而\
  \ `STRATA` 语句用于指定定义分层级的变量，并比较多个组的生存曲线。`TEST` 语句用于测试失败时间与一组数值暴露变量之间的关系。\n\n与 `LIFETEST`\
  \ 过程相比，`PROC PHREG` 具有更稳健的生存分析能力。除了拟合乘积 Cox 模型外，它还能执行广泛的分析和估计，包括拟合脆弱性模型（frailty\
  \ models）、对回归参数的线性假设进行检验、估计自定义风险比、针对匹配病例对照拟合逻辑回归分析，以及为选择模型进行变量选择。该过程还会生成一组与受试者工作特征（ROC）相关的图表，用于评估模型的拟合程度，以及一组基准函数图，如累积风险函数图和生存函数图。\n\
  \n## 对点对贷借款人违约时间的建模\n\n现在我们已经建立了关于在 SAS 中实现生存分析的一些基础知识，让我们通过将这两个过程应用于从 Lending Club\
  \ 数据获取的较小样本（10,000 个观测值）的贷款组合数据，来演示 `PROC LIFETEST` 和 `PHREG` 的实际应用。Lending Club\
  \ 贷款数据是一个广为人知的开源数据集，包含了数百万条通过平台获得众筹贷款的借款人的匿名贷款性能数据记录。从 Lending Club 数据集较大仓库获取的样本数据集保存在书籍\
  \ GitHub 仓库的 `LCLOANS.sas7bdat` 数据集中。\n\n遗憾的是，并非所有借款人（义务人）都能按期履行偿还月度金额的承诺。在我们的数据集中，如果借款人超过\
  \ 30 天未支付应付月金额，则被分类为违约（`STATUS=1`）。这是一个主观阈值，仅为了本次练习的方便而选择。在现实，阈值可能会根据组织的业务目标而异，但使用\
  \ 30 天作为阈值是常见的。我们练习的目标是使用生存分析研究违约时间（`TIMETD` 变量）。\n\n如果借款人目前还款正常、已全额还款或逾期还少于 30\
  \ 天，则该借款人为右截尾。违约时间（`TIMETD`）是指贷款发放到借款人违约之间经过的月份。尽管数据集有 150 变量，但我们选择了 14 个预测变量作为协变量。我们将\
  \ Lending Club 借款人的生存函数定义为该借款人在参考月份内不发生违约的概率。同样，借款人的风险函数也可以定义为借款人在参考月份内发生违约的概率。\n\
  \n## PROC LIFETEST\n\n`Program 6.12A` 显示了一个简单的 SAS 代码，用于在 `LCLOAN` 数据集上实现 `LIFETEST`\
  \ 过程。`ODS GRAPHICS ON` 语句调用随 `LIFETEST` 过程的 ODS 图。它们包括生存函数（`S` 或 `SURVIVAL`）、累积风险函数（`LS`\
  \ 或 `LOGSURV`）、负对数的对数（`LLS` 或 `LOGLOGS`）以及风险函数（`H` 或 `Hazard`）。`ATRISK` 选项请求在时间\
  \ t 仍有违约风险的借款人数量（`n`[`i`]`）。`KERNEL=EPANECHNIKOV` 选项指定风险函数的非参数估计应基于 Epanechnikov\
  \ 核密度函数。`METHOD= PL`（或 `KM`）选项指定必须使用 Kaplan-Meier 方法（也称为乘积极限法）计算生存函数。其他可以指定的方法还包括生命表法（也称为精算法）（`LT`、`ACT`、`LIFE`）、Breslow\
  \ 方法（`BRESLOW`）和 Fleming-Harrington 方法（`FH`）。`INTERVALS=0 to 50 by 1` 指定计算生存函数的间隔。如果不指定，将在每个时间索引处计算，如果该时间没有发生事件，则可能导致生存函数表中出现缺失项。`OUTSURV=SDATA`\
  \ 用于将估计的生存函数保存到 SAS 数据集中。`TIME=TIMETD*STATUS (0)` 用于指定 `TIMETD` 为时间变量，`STATUS` 为截尾变量，其中零表示观测值已右截尾。\n\
  \n```\n/* 使用 PROC LIFEST 估计义务人的生存函数*/\n%datapull(loans,lcloans.sas7bdat);\nods graphics\
  \ on;\n\nproc lifetest data=lcloans plots=(atrisk),ls,lls,h(kernel=epanechnikov))\n\
  method=pl nelson intervals=0 to 50 by 1 outsurv=sdata;\ntime timetd*status(0)/;\n\
  run;\n```\n\n程序 6.12A：使用 PROC LIFEST 估计义务人的生存函数\n\n输出 6.12A 是从过程中获得的，显示了生存函数的 Kaplan-Meier\
  \ 估计和 Nelson-Aalen 累积分布函数（Failure），以及生存函数的标准误。它还显示了累积风险函数及其标准误，以及违约借款人的累计人数和随时间变化的风险借款人数。正如预期的，随着时间的推移，违约借款人数增加，导致生存函数单调下降且累积风险函数增加。然而，风险函数并非单调递增。它最初在第一个\
  \ 10 个月内增加，然后稳定下降到 36 个月，随后在随后的月份中出现剧烈激增。这部分源于借款人所贷款期限的差异。Lending Club 贷款的期限可以是\
  \ 36 个月或 60 个月。风险函数的激增可能是由于 36 个月贷款的借款人在贷款到期时违约率大幅增加导致的。我们将在程序 6.12B 中探讨这一问题。\n\n\
  \n\n\n支持表中所示数值的进一步证据可以从 `LIFETEST` 过程产生的 ODS 图表中找到（显示在输出 6.12B）。`产品限制生存估计`（`Kaplan-Meier\
  \ 曲线`）显示了下降的生存函数。`Epanechnikov 核平滑风险函数`是借款人池的风险函数。`估算生存函数的负对数`是累积风险函数。`估计生存函数负对数的对数`图将累积风险函数的对数与违约时间的对数之间进行了绘图处理。\n\
  \n在程序 6.12B 中，我们修改了程序 6.12A 中的 SAS 代码，使用 `STRATA` 语句比较 36 个月和 60 个月贷款借款人的生存函数、风险函数和累积风险函数。我们还通过在\
  \ `STRATA` 语句中调用 `TEST=(LR LOGRANK)` 选项，对两种贷款期限的生存函数相同的零假设进行了检验。请求了似然比检验和 `LOGRANK`\
  \ 检验。此外，我们使用 `TEST INT_RATE DTI` 来检查利率和债务收入比对生存时间的影响。使用 `OUTTEST` 将估计的检验统计量保存在 `SEST`\
  \ SAS 数据集中。\n\n### 程序 6.12B：使用 PROC LIFETEST 比较信用义务人的生存函数\n\n| \n\n```\n/*Comparing\
  \ the Survival Functions of Credit Obligors Using PROC LIFETEST*/\nods graphics\
  \ on;\n\nproc lifetest data=lcloans method=pl  plots=(s h ls lls) notable outtest=sest\
  \ intervals=0 to 50 by 1  outsurv=sdata;;\n      time timetd*status(0);\n      strata\
  \ term/order=internal test=(lr logrank);\n      test dti int_rate;\nrun;\n```\n\n\
  \ |\n\n| --- |\n\n### 输出 6.12C：使用 PROC LIFETEST 比较信用义务人的生存函数\n\n| ![image](img/Ch06_out_6-12c.jpg)\
  \ |\n\n| --- |\n\n在输出 6.12C 中显示的摘要表中，我们了解到样本中大约二三分之一的贷款在 36 个月到期，而三分之一在 60 个月到期。对数秩检验和似然比检验拒绝了两种贷款期限生存曲线相同的零假设。支持拒绝零假设的进一步证据可以在该过程产生的\
  \ ODS 图中看到，显示在输出 6.12D 中。\n\n### 输出 6.12D：使用 PROC LIFETEST 比较不同信用义务人之间的生存函数和风险函数\n\
  \n| ![image](img/Ch06_out_6-12d.jpg) |\n\n| --- |\n\n图表显示两种贷款期限的生存函数、累积风险函数和风险函数存在显著差异。正如预期的那样，36\
  \ 个月贷款的生存函数在贷款到期后收敛并急剧下降（也就是说，今天存活并在未来较晚日期违约的概率为零，因为贷款到期后就没有未来了）。相比之下，60 个月贷款的生存函数在\
  \ 40 个月窗口之外继续稳定下降，直到观测被右截断。你也可以注意到 36 个月贷款在接近到期时风险函数的惊人增加。\n\n输出 6.12E 显示了协变量与违约时间之间关联的\
  \ Wilcoxon 检验和对数秩检验结果。对于这两个检验，报告了两组秩统计量。首先计算单变量统计量，然后显示联合效应的检验统计量序列。联合统计中的第一个变量是单变量统计量最大的变量。单变量检验的结果表明，债务收入比和利率与违约时间均具有统计学上的显著相关。然而，基于变量顺序添加的联合检验表明，在预测违约时间的联合显著性方面，债务收入比并没有在利率的基础上产生显著改进。这两个变量可能代表了相同的底层因素（贷款可负担能力），这些因素导致了借款人发生贷款违约。\n\
  \n### 输出 6.12E：使用 PROC LIFETEST 对不同信用义务人之间的生存函数和风险函数进行统计检验\n\n| ![image](img/Ch06_out_6-12e.jpg)\
  \ |\n\n| --- |\n\n### PROC PHREG\n\n程序 6.13 显示了使用 `PROC PHREG` 为信贷俱乐部数据拟合违约时间 比例风险模型的\
  \ SAS 代码。该过程具有许多功能，但许多与金融数据科学家的典型需求无关。因此，我们将关注估计我们正在考虑的生存分析模型所需的特征。`PLOT= (SURVIVAL\
  \ CUMHAZ ROC)` 选项用于请求生存函数和累积风险函数的 ODS 图。`ROCOPTIONS (AT=0 TO 40 BY 10)` 用于请求 0、10、20、30\
  \ 和 40 个月的 ROC 曲线。`CLASS` 语句用于指定模型中的分类变量。它们包括 `APPLICATION_TYPE`、`GRADE`、`TERM`、`HOME_OWNERSHIP`、`VERIFICATION_STATUS`\
  \ 和 `EMP_LENGTH`。\n\n#### 程序 6.13：使用 PROC PHREG 估计信用义务人的比例风险模型\n\n| \n\n```\n/*Estimating\
  \ Proportional Hazard Models of Credit Obligors Using PROC PHREG*/\nods graphics\
  \ on;\n\nproc phreg data=lcloans plots=(survival cumhaz roc auc) \n  rocoptions(at=0\
  \ to 40 by 10) simple;\n  class application_type grade term purpose home_ownership\
  \ verification_status \nemp_length;\n  model timetd*status(0)= loan_amnt int_rate\
  \ annual_inc dti pub_rec application_type\n  total_acc revol_util grade term purpose\
  \ home_ownership  emp_length / selection=stepwise slentry=0.25 slstay=0.15 details;\n\
  run;\n```\n\n |\n\n| --- |\n\n模型中的数值变量包括 `LOAN_AMNT`、信用账户总数 (`TOTAL_ACC`)、针对借款人的利率\
  \ (`INT_RATE`)、借款人的年收入 (`ANNUAL_INC`)、借款人的债务收入比 (`DTI`) 以及借款人拥有的公共记录数量。`MODEL` 语句用于指定违约时间变量\
  \ (`TIMETD`) 和截断变量 (`STATUS`) 以及与预测变量的交互。`SELECTION=STEPWISE` 语句请求迭代步选择过程，以将模型中的预测变量缩小为与时间具有统计学显著关系的变量。\n\
  \n### 输出 6.13A：使用 PROC PHREG 的信用义务人比例风险模型\n\n\n\n\n\n`Output 6.13A` 显示了通过估计 Cox\
  \ 比例风险模型得到的拟合统计量、第 3 类表和最大似然估计分析表。第 3 类表中所示统计量表明，利率、信用账户总数、信贷利用率、借款人信用状况、贷款用途以及借款人住房状况是决定逾期（time\
  \ to delinquency）的显著因素。最大似然估计分析表显示，逾期风险率与高利率、债务收入比、账户总数、较短的贷款期限、不完美的信用（低于“A”级）以及非度假相关的贷款有关。与循环贷款余额较高、拥有住房（已还清或有抵押）以及收入已核实或未核实的借款人相比，其违约频率低于基准借款人。风险比（hazard\
  \ ratio）显示了两个组（A 和 B）之间逾期风险函数的变化，其中组之间的差异是预测变量的一个单位。例如，循环贷款账户数量每增加一个，逾期风险将增加 1.007。\n\
  \n`Output 6.13B` 显示了参考借款人（预测特征见“绘图协变量参考集”表）的生存函数和累积风险函数图。输出还显示了时间相关的受试者特征（ROC）曲线，该曲线绘制了贷款期限内不同时间点的敏感性（真阳性）与\
  \ 1-特异性（假阳性）的关系图。生存函数和累积风险函数图显示，在贷款期限内，生存概率单调下降，逾期累积风险稳步增长。时间相关的受试者特征（ROC）曲线考察了模型在贷款期限内准确区分良好借款人和逾期借款人的能力。图表面积显示了模型在不同时间区分这两组人群能力的一致性。\n\
  \n### 输出 6.13B: 生存函数、风险函数和 ROC 曲线\n\n| ![image](img/Ch06_out_6-13b.jpg) |\n| ---\
  \ |\n\n## 预测模型\n\n有多种预测模型。分类的方法一种是基于它们使用单个因变量（单变量模型）还是多个因变量（系统模型）。单变量预测模型的目标通常是预测单个因变量的未来值，而系统模型旨在同时预测多个因变量。许多常见的单变量预测模型，如\
  \ `ARIMA`、时间序列回归和自回归已在第三章和第四章中介绍。因此，我们将在本章的后续部分重点关注系统模型和其他类型的单变量预测模型。\n\n## 系统模型\n\
  \n许多统计模型假设预测变量与响应变量之间存在单向关系。然而，许多经济和金融变量会随时间动态地相互影响。这些效应可能以同步反馈循环的形式出现，源于金融市场投资机会的变化，或者通过宏观经济因素与对这些因素的政策反应（如通胀和利率）之间的领先滞后关系。使用单变量模型对这些变量进行建模的问题在于，单变量模型的残差现在可能与响应变量本身相关，因为响应变量也是预测变量的预测变量。在存在同步性偏差的单变量模型中得出的参数估计，由于误差项中存在内生性问题（即预测变量与残差的协方差不再为零），其本身将是有偏且不一致的（高估或低估了真实参数值）。为了预测目的，使用特殊技术考虑这些特征至关重要。这些技术之一是使用多方程方法对关系进行建模。金融数据科学常用的多方程模型包括同步方程模型\
  \ (`SEM`) 和向量自回归模型 (`VAR`)。\n\n## 同步方程模型\n\n同步方程模型 (`SEM`) 用于多变量框架，当两个或多个变量具有双向同源关系，且你需要将一个变量建模为另一个变量的预测同时。模型可能还包含其他外生变量。尽管\
  \ `SEMs` 不常用于预测建模，但值得探索其在研究目的统计建模中的应用。考虑由 `y[1, t]` 和 `y[2, t]` 组成的二元方程组，其中两个变量在各自的方程中共同决定。此外，让响应变量的回归方程也包含一组外生回归变量。我们可以将二元方程组公式化如下：\n\
  \n$$\n\\begin{array}{l} {y_{1,t} = \\beta_{10} + \\alpha_{1}y_{2,t} + X_{1t}\\beta_{1}\
  \ + \\varepsilon_{1,t}} \\\\ {y_{2,t} = \\beta_{20} + \\alpha_{2}y_{1,t} + X_{2t}\\\
  beta_{2} + \\varepsilon_{2,t}} \\\\ \\\\ \\end{array}\n$$\n(6.77)\n\n其中 `X[1t]β[1]\
  \ = [x[11, t]β[11]+x[12, t]β[12]+.....+x[1k, t]β[1k]]` 和 `X[2t]β[1] = [x[21, t]β[21]+x[22,\
  \ t]β[22]+.....+x[2k, t]β[2k]]` 是外生回归变量的 `t^(th)` 行向量。\n\n在回归方程系统中，你会注意到两个响应变量受到另一个响应变量的同源影响。我们可以使用多种方法对这样的系统进行建模。这些包括二阶段\
  \ (`2SL`) 和三阶段 (`3SL`)最小二乘法，以及有限信息和全信息极大似然。`2SL` 和 `3SL` 需要使用工具变量。对于 `y[1, t]` 方程，合适的工具变量将是一个与\
  \ `y[2, t]` 相关但与残差项 `ε[1, t]` 不相关的变量。此外，该变量不能已经包含在 `y[1, t]` 方程中。这被称为识别条件。通常，你需要排除的外生变量的数量多于\
  \ `y[1, t]` 方程中内生变量的数量。在 `y[1, t]` 的 `2SL` 实现中，我们首先对内生响应变量 `y[2, t]` 进行工具变量回归，以获得预测值\
  \ `yŷ[2, t]`。然后将预测值 `yŷ[2t]` 代替 `y[2t]` 使用在 `y[1, t]` 方程中，`[y[1, t]=β[10]+α[1]yŷ[2,\
  \ t]+X[1t]β[1]+ε[1, t]]`。由于 `yŷ[2, t]` 是 `y[2, t]` 在给定工具变量（其与 `ε[1, t]` 不相关）的期望值，因此\
  \ `yŷ[2, t]` 满足使用 `OLS` 估计 `y[1, t]` 的条件。因此，有了二阶段 (`2SLS`) 最小二乘。\n\n### 建模股票收益与交易量之间的关系\n\
  \n\n\n\n现在，让我们考虑一个每日股票收益率和每日交易量的联合预测模型。在这种设定下，显而易见的是这两个变量之间存在反馈回路。根据经验，你会预计较高的交易量会导致价格剧烈波动，而价格的大变动会推动更高的交易量。因此，对这两个变量的建模必须在联立方程组中进行。在模型设定中，每日指数收益率（`DRET`）对总债券市场收益率每日变化（`RBOND`）、油价每日变化（`ROIL`）、美元汇率每日变化（`REXR`）以及交易量的每日变化（`DVRET`）和滞后每日变化（`LVRET`）回归。交易量的每日变化（`DVRET`）对每日（`DRET`）和滞后（`LRET`）指数收益率、美国股票\
  \ VIX（`RVIX`）、黄金 VIX（`RGVIX`）以及原油 VIX（`ROVIX`）回归。\n\n$\\begin{array}{l} {DRET\\\
  _{t} = \\beta\\_{10} + \\alpha\\_{1}VRET\\_{t} + \\beta\\_{11}LVRET\\_{t} + \\beta\\\
  _{11}RBOND\\_{t} + \\beta\\_{11}ROIL\\_{t} + + \\beta\\_{11}REXR\\_{t} + \\varepsilon\\\
  _{1t}} \\\\\\\\ {VRET\\_{t} = \\beta\\_{10} + \\alpha\\_{1}DRET\\_{t} + \\beta\\\
  _{11}LDRET\\_{t} + \\beta\\_{11}RVIX\\_{t} + \\beta\\_{11}RGVIX\\_{t} + + \\beta\\\
  _{11}ROVIX\\_{t} + \\varepsilon\\_{1t}} \\\\\\\\ \\end{array}$ (6.78)\n\n使用的工具变量包含了所有的回归变量，尽管只要外生回归变量多于内生回归变量，就可以两个方程中指定相似的回归变量。然而，在这种情况下，两个方程中的外生回归变量并不相同。\n\
  \n## 在 SAS 中估计联立方程\n\n用于建模联立方程模型（SEMs）的三个常用 SAS 过程是 `PROC MODEL`、`PROC SYSLIN` 和\
  \ `PROC CALIS`。`PROC MODEL` 是一个强大的 SAS 过程，可以对一个或多个线性和非线性方程系统中变量之间的各种关系进行建模。这包括线性和非线性\
  \ SEM 模型。`PROC SYSLIN` 是为建模 SEM 定身的解决方案，而 `PROC CALIS` 是用于建模方程系统中潜变量的更通用过程。对于更复杂的建模问题，与\
  \ `PROC SYSLIN` 相比，`PROC MODEL` 需要编写较得多的代码。然而，`PROC SYSLIN` 允许每个方程最多只包含一个潜变量（误差项），而\
  \ `PROC CALIS` 允许一个方程中出现多个潜变量。从预测分析的角度来看，`PROC SYSLIN` 是相关的，因为它会将预测值和残差值写入输出 SAS\
  \ 数据集。另一方面，`PROC CALIS` 用于路径分析和因果建模。此外，`PROC SYSLIN` 和 `PROC MODEL` 提供的估计方法比 `PROC\
  \ CALIS` 更多（包括 OLS、SUR、2SLS、3SLS、LIML 和 FIML 等）。31\n\n### PROC SYSLIN\n\n`Program\
  \ 6.14` 显示了用于联合建模标普 500 指数每日收益率和交易量的 SAS 代码。用于估计的 SAS 过程是 `PROC SYSLIN`。然而，`SYSLIN`\
  \ 过程可以使用广泛的方法来估计联立方程组，包括之前提到的 `2SLS`、`3SLS`、`FIML` 和 `LIML` 方法。在示例中，我们在 `DATA` 语句之后请求了\
  \ `2SLS` 选项。`OUT` 选项用于指定保存两个序列预测值的 SAS 数据集。`ENDOUS` 语句用于指定两个内生变量，而 `INSTRUMENT`\
  \ 语句用于为 `2SLS` 指定工具变量。`MODEL` 语句指定每个模型的方程。`OUTPUT` 语句用于请求创建估计结果（在这种情况下为收益率和交易量的预测值），而\
  \ `PREDICTED` 选项用于为保存的响应变量赋值变量名。\n\n#### Program 6.14：使用 PROC SYSLIN 为股票收益率和交易量进行建模\n\
  \n```sas\n/*Using PROC SYSLIN to Model the Determinant of Stock returns and Trading\
  \ Volumes*/\ndatapull (market,market_data);\nods graphics on;\n\nproc syslin data=market_data\
  \ 2sls out=predicted;\nendogenous dret vret;\ninstruments bond roil rexr rvix rovix\
  \ ldret;\nreturn:\nmodel dret= vret bond roil rexr;\noutput predicted=pdret;\nvolume:\n\
  model vret= dret rvix rovix;\noutput predicted=pvret;\nrun;\n```\n\n输出 14 显示的结果显示两个响应变量之间存在强统计联系。较低的股票市场收益率更有可能在交易量较高的日子发生，而今天股票市场收益率和交易量较低更有可能导致第二天交易量增加。这一结果与经验模式吻合较好。平均而言，在指数收益率为负的日子以及在指数收益率为负的交易日的第二天，指数交易量略高。收益回归还显示，今天的收益率与之前的收益率和交易量负相关。它还与汇率负相关，但与油价变化正相关。\n\
  \n## 自回归\n\n与探索响应变量间同时反馈回路的联立方程不同，自回归（`VAR`）假设反馈源于响应变量的滞后值，使得每个响应变量都是其滞后值以及其他响应变量滞后值的函数。`VAR`\
  \ 是单变量回归模型的多元扩展。除了建模两个或多个响应变量之间的关系外，`VAR` 还用于预测以及分析变量之间的各种统计关系——这些性、协整、冲击响应、预测误差分解和动态联立方程。`VAR`\
  \ 模型也可以包含外生变量及其滞后。`VAR` 模型还有其他扩展，例如在均值方程中添加条件方差以形成多元 GARCH-VAR（`MGARCH-VAR`）和面板数据\
  \ VAR。\n\n尽管源于计量经济学，但由于 `VAR` 框架的灵活性，近年来也出现了机器学习实现的 `VAR`。此外，由于许多金融和经济序列往往共同移动，金融科学家开发\
  \ `VAR` 模型的能力是非常关重要的。设 `Y[t] = [y[1,t], y[2,t],.....y[k,t]]` 为 k 维时间序列向量。p 阶 `VAR`\
  \ 模型的数学框架可以通过以下多元回归方程组描述。\n\n$Y[t] = C + \\Pi[1]Y[t-1] + \\Pi[2]Y[t-2] + ... + \\\
  Pi[p]Y[t-p] + \\epsilon[t]$ (6.79)\n\n虽然常用上述矩阵代数定义 `VAR` 模型，但我们将进行一个带有一个自滞后的简单二元\
  \ `VAR` 模型。由 `y[1,t]` 和 `y[2,t]` 组成的二元 `VAR` 方程组，每个变量由其自身滞后和另一个变量的滞后实现描述如下。\n\n\
  $\\begin{array}{l} {y_{1,t} = c_{1} + \\pi\\_{11}^{1}y_{1,t - 1} + \\pi\\_{12}^{1}y_{2,t\
  \ - 1} + \\varepsilon\\_{1,t}} \\\\\\\\ {y_{2,t} = c_{2} + \\pi\\_{21}^{2}y_{1,t\
  \ - 1} + \\pi\\_{22}^{2}y_{2,t - 1} + \\varepsilon\\_{2,t}} \\\\\\\\ \\end{array}$\
  \ (6.80)\n\n\n\n`π[ij]^(i)` 是第一个变量自回归滞后项的系数，而 `π[ji]^(j)` 是第二个变量自回归滞后项的系数。例如，公式\
  \ (6.80)](#CH06.xhtml#ch06eq80)所示的`π[11]`¹ 是第一个方程中第一个变量的第一阶滞后项的系数，而 `π[12]`² 是第一个方程中第二个变量的第一阶阶滞后项的系数。公式\
  \ (6.80)也可以扩展到包含一组外生变量，但目前我们将继续使用仅包含内生变量 `y[1, t]` 和 `y[2, t]` 的模型设定。\n\nVAR 模型的估计可以使用最小二乘法或极大似然法进行。大多数简单的\
  \ VAR 模型可以使用最小二乘法进行估计。而扩展了额外参数规格（如多元 GARCH-VAR）的 VAR 模型通常涉及大量参数的估计，因此，它们通常使用极大似然法进行估计。\n\
  \n如前所述，公式 (6.80) 中的 VAR 设定可以探索两个内生变量之间的各种统计关系。例如，我们可以使用该模型来探索 `y[1, t]` 和 `y[2,\
  \ t]` 之间的因果关系。如果一个变量的过去值在控制其滞后项后能够解释另一个变量的当前或未来值，则这两个变量之间存在因果关系。\n\n这意味着关于 `y[1,\
  \ t]` 当前值的信息无法在其滞后值中找到，但可以在 `y[2, t]` 的过去值中找到（即 `y[2, t]` 的过去值可以预测 `y[1, t]` 的当前值）。\n\
  \n我们还可以利用 VAR 来研究系统中一个响应变量受到的冲击对其他响应变量的影响。这种研究从政策分析的角度来看特别有用。例如，多资产类别投资组合经理可能希望研究某类资产受到的冲击对组合中其他资产类别的影响。在\
  \ VAR 框架下，从一个变量到另一个变量的冲击传递分析被称为脉冲响应函数（IRF）。脉冲响应函数分析了一个变量的值发生一个标准差（在 VARMAX 中为两个标准差）的变化对系统中其他变量的影响。这种分析既从冲击的幅度进行，也从冲击的持续性进行。该方法的一种扩展是衡量一个变量的冲击对系统中其他变量的方差（预测误差）的贡献有多大。这被称为方差分解或预测误差分解。\n\
  \n我们将探索的 VAR 最后一个应用是预测和预测置信度。由于 VAR 可用于建立因果关系，因此我们将其应用于预测和预测目的也是合逻辑的。通常情况下，VAR 模型的预测方法与单变量模型的方法相同，只是以系统的形式呈现。模型的估计参数被简单地用于预测未来值。\n\
  \n现在我们已经建立了理论框架，让我们使用模型来检查变量之间的关系。VARMAX 过程中的其他选项还包括 GARCH 语句（用于拟合多元自回归条件异方差模型）以及\
  \ RESTRICT 和 TEST 语句（用于调用多种类型的假设检验）。\n\n\n\n\n输出 6.15A 所示的结果显示，以参数估计的 p 值为参考，个人消费与失业率之间以及它们各自的滞后值之间存在强烈的双向关系。这一发现进一步得到了格兰杰因果检验的\
  \ p 值的支持。参数估计值和脉冲响应函数图表明，个人消费的增加会导致失业率下降。有趣的是，失业率的上升（AR1_1_2 系数）也与消费的增加有关。这可能是由于延迟效应或消费粘性。\n\
  \n### 输出 6.15A：失业与消费之间的关系\n\n| ![image](img/Ch06_out_6-15a.jpg) |\n| --- |\n\n消费的粘性也体现在失业率的脉冲响应函数中（输出\
  \ 6.15B](#CH06.xhtml#ch06out15B）所示）。图表显示，失业率的两个标准差冲击大约需要四个月才能完全抵消消费增长。相比之下，消费的两个标准差冲击将在下个月显著推低失业率，随后在两个月后回升，然后在第三和第四个月进一步下降。对消费增长的冲击对消费本身似乎并不是持久的。即时效应发生在下个月，随后恢复到均值。这可能是由于季节性效应导致的。\n\
  \n### 输出 6.15B：来自 PROC VARMAX 的脉冲响应函数\n\n| ![image](img/Ch06_out_6-15b.jpg) |\n\
  | --- |\n\n### 输出 6.15C：使用 PROC VARMAX 进行预测\n\n| ![image](img/Ch06_out_6-15c.jpg)\
  \ |\n| --- |\n\n输出 6.15C 显示了模型对消费增长和失业率的月度预测。图表显示，2023 年第一季度消费小幅下降，随后在剩余时间内消费增长保持相对稳定但低位的水平。对于失业率，图表显示的预测意味着全年失业水平几乎几乎没有变化（零增长预测）。\n\
  \n## 时间索引预测模型\n\n在第二章和第三章中，我们从建模的角度探索了一些单变量时间序列模型，如 `ARIMA`、`AUTOREG` 和 `X13` 模型。事实证明，这些模型也可以用于预测。让我们再探索另外两种常用于预测的时间序列模型。它们是指数平滑模型和未观测成分模型。\n\
  \n### 指数平滑模型\n\n指数平滑（ESM）模型通过对同一变量过去观测值的加权平均来生成该变量未来值的预测。在这种方法中，变量的近期滞后值在预测中比比很久以前滞后观测值更大的权重。应用于过去观测值的递减权重使用了随时间指数级衰减的平滑参数。在最基本的形式中（即简单指数平滑模型\
  \ (SESM)），我们假设变量遵循纯随机过程，且没有趋势和季节性。假设 `y[t]` 是需要平滑的原始数据，其初始值为 `y[0]`，则 SESM 的规格说明如下：\n\
  \n```\nS[t + 1] = α*y[t] + (1−α)*S[t − 1] (6.82)\n```\n\n其中 `α`(0≤α≤1) 是指数平滑参数，`S[t]`\
  \ 是变量在时间 `t` 的预测值。在现实，SESM 实际上是 `ARIMA (0,1,1)` 模型的特例。还可以使用双指数平滑函数修改 SESM 以考虑数据中的趋势。在这种方法中，时间序列的趋势成分和随机成分分别进行平滑，然后组合以创建时间序列的预测。双指数模型\
  \ (DESM) 的数学表达式如下。令 `L[t]` 为水平的估计值，`T[t]` 为时间 `t` 趋势的估计值。`y[t]` 的双指数平滑（也称为 Holt\
  \ 方法）函数为：\n\n水平平滑：\n```\nL[t] = α*y[t] + (1−α)*[L[t − 1]+T[t − 1]] (6.83)\n```\n\
  \n趋势平滑：\n```\nT[t] = β*(L[t]−L[t − 1]) + (1−β)*T[t − 1] (6.84)\n```\n\n预测方程：\n```\n\
  S[t + m] = L[t] + mT[t] (6.85)\n```\n\n其中 `α`(0≤α≤1) 是水平的指数平滑参数，`β`(0≤β≤1) 是趋势的指数平滑参数，`m`\
  \ 是预测窗口。当 `m=1` 时，我们得到一个以 `S[t+1] = L[t] + T[t]` 为特征的一期前预测。DESM 等于一个 `ARIMA (0,2,2)`\
  \ 模型。\n\n最后，通过三重指数平滑可以将 ESM 推广到也考虑预测中的季节性和趋势。在这种方法中，在预测中增加了一个考虑季节性的第三平滑函数，使用加法或乘法季节性。使用加法季节性的三指数模型\
  \ (TESM) 的数学表达式如下。令 `L[t]` 为水平的估计值，`T[t]` 为趋势的估计值，`I[t]` 为时间 `t` 季节性的估计值。`y[t]`\
  \ 的三重指数平滑（也称为 Holt-Winters 方法）函数为：\n\n水平平滑：\n```\nL[t] = α*y[t]−I[t − m]) + (1−α)*[L[t\
  \ − 1]+T[t − 1]] (6.86)\n```\n\n趋势平滑：\n```\nT[t] = β*(L[t]−L[t − 1]) + (1−β)*T[t\
  \ − 1] (6.87)\n```\n\n季节性平滑：\n```\nI[t] = γ*(y[t]−L[t]) + (1−γ)*I[t − p] (6.88)\n\
  ```\n\n预测方程：\n```\nS[t + m] = L[t] + mT[t] + I[t − p + 1 + (m−1)*mod^p] (6.89)\n\
  ```\n\n其中 `α`(0≤α≤1) 是水平的指数平滑参数，`β`(0≤β≤1) 是趋势的指数平滑参数，`γ`(0≤γ≤1) 是季节性成分的季节平滑参数，`m`\
  \ 是预测窗口。与双指数平滑的情况一样，当 `m=1` 时我们得到一期前预测。乘法季节性的水平、季节性和预测方程表达式为：\n\n水平平滑：\n```\nL_t\
  \ = α(y_t/I_{t - m}) + (1 - α)[L_{t - 1} + T_{t - 1}] (6.90)\n```\n\n季节性平滑：\n```\n\
  I_t = γ(y_t/L_t) + (1 - γ)I_{t - p} (6.91)\n```\n\n预测方程：\n```\nS_{t + m} = (L_t\
  \ + mT_t)⋅ I_{t - p + 1 + (m−1)*mod^p} (6.92)\n```\n\n无论使用哪种 ESM 方法，ESM 都是一种概念上简单的预测方法。基本方法是通过时间序列成分之和来生成时间序列未来值的预测。在预测中，相关时间序列成分（趋势、季节性和水平）的近期过去值赋予的权重比远期的过去值更大。\n\
  \n\n\n\n\n# 在 SAS 中估计指数平滑模型\n\n可以使用 `PROC ESM` 或时间序列预测系统（Time Series Forecasting\
  \ System）在 SAS 中估计指数平滑模型。时间序列预测系统是一个用于调用 ARIMA 和指数平滑模型的图形化界面，对于许多 ESM 实现来说足够了。在\
  \ Enterprise Guide 中（见图 6.5 左侧），可以通过点击 SAS Tasks（SAS 任务）并选择 `Time Series`（时间序列），接着选择\
  \ `Basic Forecasting`（基础预测来调用。在 SAS Studio 中（见图 6.5 右侧），点击 `Task`（任务）、`Utilities`（工具），然后选择\
  \ `Forecasting`（预测），最后选择 `Modeling and Forecasting`（建模与预测）。\n\n## 预测标普 500 指数的月成交量\n\
  \n月成交量是一项技术指标，预示着证券价格方向性移动的强度。例如，高量股票的价格上涨通常意味着投资者的买入压力巨大，而价格下跌则意味着存在卖出压力。因此，预测成交量趋势对于未来的价格走势可能具有见解。现在，让我们探索使用\
  \ `ESM` 过程来预测标普 500 指数的月成交量。在此练习中，我们将重用 SAS 数据集（`RSPX_MONTHLY.SAS7BDATA`），该数据集包含指数的月价格和量数据。\n\
  \n## PROC ESM\n\n让我们也编写用于 `ESM` 过程 SAS 代码来估计指数平滑模型。你可能记得在第三章中，我们使用 `X13` 过程将标普 500\
  \ 指数的月量分解为趋势和季节成分。在程序 6.16 中，我们将使用简单、双重和加法三次指数平滑模型生成标普 500 指数月成交量的 24 个月预测。在 SAS\
  \ 代码中，`PROC ESM` 语句中的 `LEAD=24` 用于指定 24 个月的预测提前期，而 `BACK=12` 指定预测应从数据集中最后观测之前的 12\
  \ 个周期开始。`ESM` 过程会生成大量的 ODS 图形。我们可以通过 `PLOT=FORECASTSONLY` 选项仅请求预测序列的图。`OUTEST` 选项用于将平滑参数保存到\
  \ SAS 数据集中。\n\n`ESM` 过程可以分析各种频率的时间序列数据。为了预测，使用 `ID` 和 `INTERVAL` 语句分别指定时间索引变量和数据的频率。通过使用\
  \ `FORECAST` 语句调用实际的估计和预测`MODEL` 选项用于指定将估计并用于生成预测的 ESM 类型。`ESM` 过程可以估计简单、双重、线性（Holt’s）和\
  \ Winter’s（加法和乘法）方法等。它还可以使用对数、平方和逻辑变换对数据进行转换。\n\n我们将在程序 6.16 中估计简单、Holt’s 和乘法 Winter’s\
  \ 模型。`OUTSTAT=` 用于请求每个模型的拟合统计量以便比较。该过程默认不打印参数估计；你可以通过在 `PROC ESM` 语句中调用 `PRINT=ALL`\
  \ 来与其他统计量一起请求它。`PRINT` 过程用于显示汇总的估计值。\n\n### 程序 6.16：使用 PROC ESM 预测标普 500 的月量\n\n\
  ```sas\n/*使用指数平滑法预测 500 指的月成交量*/\n%data(rspx_monthly.sas7b);\nods graphics on;\n\
  \nproc esm data=rspx_monthly back=12 lead=24 plot=forecastsonly\noutest=sesms outstat=sesms\
  \ print=all;\nid monthly;\nmodel simple;\nrun;\n\nproc esm data=rspx_monthly back=12\
  \ lead=24 plot=forecastsonly\noutest=desms outstat=desms print=all;\nid monthly;\n\
  model linear;\nrun;\n\nproc esm data=rspx_monthly back=12 lead=24 plot=forecastsonly\n\
  outest=tesms outstat=tesms print=all;\nid monthly;\nmodel multwinters;\nrun;\n```\n\
  \n水平平滑参数的值对于三个模型都是显著的。对于简单 ESM 和 Holt’s 双重 ESM，系数约为 0.4。Holt-Winters ESM 的相同系数值略高（0.46）。趋势平滑参数是显著的，而\
  \ Holt-Winters ESM 中的季节平滑参数也是显著的。简化的拟合统计量显示 Holt-Winters ESM 似乎具有最佳拟合效果。\n\n###\
  \ 输出 6.16A：标普 500 月成交量预测\n\n![Ch06_out_6-16a.jpg]\n\n### 输出 6.16B：500 指数月成交量预测图\n\
  \n![Ch06_out_6-16b.jpg]\n\n支持这一统计结果的进一步证据可以在三个模型的预测图中找到。简单 ESM 和 Holt’s 双重 ESM 生成直线预测，而\
  \ Holt-Winters ESM 在其预测中包含了季节性，以考虑季节成分的周期性。输出 6.16B 中显示的图形标题已使用 ODS 图形编辑器编辑过。\n\n\
  ## 观测成分模型\n\n观测成分模型（UCM）也基于我们在第二章$$\n\n\n\n\n其中 `μ[t]`、`φ[t]` 和 `γ[t]` 分别代表响应变量的趋势成分\
  \ `T[t]`、周期成分 `C[t]` 和季节性成分 `S[t]`。`r[t]` 是自回归成分，而 $\\sum\\limits_{j = 1}^{m}{\\\
  beta_{j}x_{j,t}}$ 是多元回归成分，用于解释外生变量对 `y[t]` 预测的贡献。我们假设残差项 `ε[t]` 是不规则成分 `I[t]`，且它遵循均值为零、方差为\
  \ `σ²` 的高斯白噪声。在 `UCM` 中，趋势、季节、回归和非稳周期成分解释了响应变量的结构动力学，而平稳周期和自回归成分解释了该变量的瞬态动力学。35\
  \ 模型的时间序列组件使用某些类型的随机规范进行估计。例如，模型的趋势成分可以指定为随机游走过程（带或不带漂移）或确定性趋势。周期成分可以指定为带有频率参数的确定性周期、自回归移动平均过程或随时间变化的三角周期。季节性成分则指定为固定季节虚拟变量、随时间变化的季节虚拟变量、固定三角季节扰动或随时间变化的季节扰动。\n\
  \n`UCMs` 也被视为状态空间模型，因为响应变量的动力学部分由不可观测（隐含）过程控制。在状态空间框架下，方程 (6.93) 是连接响应变量 `y[t]`\
  \ 与状态矩阵的观测方程，该矩阵由未观测时间序列成分向量 `[μ[t]`,`φ[t]`,`γ[t]`,`r[t]]` 和外生回归因子 $\\sum\\limits_{j\
  \ = 1}^{m}{\\beta_{j}x_{j,t}}$ 组成。\n\n状态空间分析旨在从观测过程和系统规范中学习更多关于隐藏过程；因此，隐藏过程的参数估计与状态过程的估计密切相关。在状态空间估计中，通过滤波来消除隐藏变量的真实值与观测变量之间的测量误差。根据我们目前对变量未来和当前值的了解，还可以进行预测以估计隐藏和观测变量的未来值，并进行平滑以估计隐藏变量的过去值。从预测的角度来看，状态空间方法的优势之一是使用了滤波方法（称为\
  \ `Kalman filter`）来产生状态向量的步前预测，然后该预测也用于生成响应变量的步前预测。卡尔曼滤波通过在观测值实现后根据预测准确性更新分配给每个预测的权重，递归地生成响应变量未来值的预测。对于预测准确性更高的预测，会分配更大的权重。\n\
  \n由于参数数量多且待估计的规范复杂，`UCMs` 通常使用极大似然法的特例进行估计。其包的函数形式以及在估计模型中包含或排除前面讨论的任何时间序列成分的灵活性，使得\
  \ `UCMs` 成为时间序列数据预测的一种极佳方法。\n\n## 在 SAS 中估计不可观测成分模型\n\n`SAS/ETS` 中的 `UCM` 过程可以对不可观测成分模型估计并生成预测。该过程具有许多功能特性，包括许多在其他基于回归的程序中常见的特性。这些包括用于指定响应变量及其预测器的\
  \ `MODEL` 语句。通过调用相应的 `UCM` 语句，可以请求 `UCM` 的时间序列成分及其规范。例如，可以通过在过程代码中分别包含 `LEVEL`、`CYCLE`\
  \ 和 `SEASON` 语句，将随机游走趋势、周期和季节成分纳入模型。`AUTOREG` 语句用于请求模型的自回归成分。你可以使用 `LEAD=` 和 `BACK=`\
  \ 语句请求前瞻和回溯预测。`UCM` 还可以实现响应变量与其外生回归因子之间的非线性模型（`SPLINEREG`），以及非线性季节模式（`SPLINESEASON`）。与\
  \ `ESM` 过程一样，`UCM` 过程会生成大量的 ODS 图。\n\n## 使用 UCM 模型预测每月指数收益率\n\n让我们将 `UCM` 应用于 `will5000`\
  \ 指数，该指数跟踪美国上市公司的表现。该指数是一个广泛的、市值加权的基准。将每月失业率（`RATE`）、个人消费支出（`PCE`）和垃圾债券（`JBY`）作为外生回归因子。36\n\
  \n### PROC UCM\n\n程序 6.17 显示了用于估计 `will5000` 指数 `UCM` 的 SAS 代码。使用各自的语句请求 `irregular`、`level`、`cycle`\
  \ 和 `seasonal` 成分。`FORECAST` 语句中的 `BACK=24` 和 `LEAD=24` 用于创建留样本。创建留样本对于验证模型特别有用。`ESTIMATE`\
  \ 语句中的 `OUTEST=UCMPMS` 选项指定参数应保存在 `UCMPMS` 数据集中。\n\n```sas\n/*生成 5000 的每月预测*/\n\
  %datapull (conswork,conswork.sas7b);\nods graphics on;\n\nproc ucm data=conswork;\n\
  \   id date interval=monthly;\n   model will5000 = t10yr pce jby;\n   irregular;\n\
  \   level;\n   cycle;\n   season type=dummy length=12;\n   estimate outest=ucmpms;\n\
  \   forecast back=24 lead=36 plot=(decomp decompvar forecasts );\n   nloptions tech=dbldog\
  \ maxiter=200;\nrun;\n\nproc print data=ucmpms;\nrun;\n```\n\n\n\n\n`Output 6.17B`\
  \ 显示了 `UCM` 过程的各种图表。样本外图（Out-of-Sample plot）比较了预测值（线）与保留期间（2021 年 1 月至 2023 年 1\
  \ 月）的实际值（点）。尽管实际值与预测值并不相等，但方向大部分是准确的。在现实，预测市场方向比预测每个时期市场表现的实际数值相对容易。我们将在`第七章`中探索方向预测（分类）。`平滑趋势`（Smoothed\
  \ Trend）图显示了市场表现在第一个十年中具有周期性元素，但在最近的过去十年中，周期性的证据很少。`平滑趋势与回归效应之和`（Sum of Smoothed\
  \ Trend and Regression Effect）图似乎比单单的时间序列分量对数据有更好的拟合效果。总体而言，通过在预测框架中引入解释变量，`UCM`提供了比\
  \ `PROC ESM` 方法更丰富的平台，后者仅依赖响应变量当前和过去的观测值来预测其未来值。\n\n#### 输出 6.17B：Wilshire 5000\
  \ 指数月度收益率预测图\n\n| ![image](img/Ch06_out_6-17b.jpg) |\n| --- |\n\n### 其他统计和计量经济学过程\n\
  \n尽管我们在本章中回顾了大量的过程，但你应该意识到，`SAS` 中提供的统计和计量经济学过程比我们讨论的要多。`SAS` 中所有的计量经济学过程都包含在 `SAS/ETS`\
  \ 软件中。统计过程（包括我们讨论过的）包含在 `SAS/STAT` 软件中。`SAS/ETS` 和 `SAS/STAT` 都是 `SAS 9.4`系统的组件。它们在\
  \ `SAS Viya` 环境中可用。此外，`SAS` 现在为本章描述的一些计量经济学和统计过程提供了高性能版本。我们将在`第七章`中讨论这些一些高性能 `SAS`\
  \ 过程。\n\n## 练习\n\n1. `SAS` 数据集 `INDU.SAS7BDAT` 包含 17 个行业的月度收益率、五个风险因子（市场风险溢价和 `Fama-French`，分别为\
  \ `HML`、`SMB`、`RMW` 和 `CMA` 因子）以及无风险利率。`HML` 变量代表因增长潜力获得的风险溢价，而 `SMB` 代表规模风险溢价，小公司比大公司获得更高的溢价。`RMW`（强健减弱）代表运营盈利能力的风险溢价，盈利能力的公司获得更高的溢价，而\
  \ `CMA` 代表公司投资策略的风险溢价，具有保守投资策略的公司比具有激进投资策略的公司获得更高的溢价。\n\na. 写一个 `SAS` 程序，使用 `OLS`、`极大似然法`（Maximum\
