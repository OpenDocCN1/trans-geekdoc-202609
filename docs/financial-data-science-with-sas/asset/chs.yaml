  \n***\n\n## 第 4 章：金融和经济数据的模拟\n\n## 模拟简介\n\n我们在数据科学领域研究的许多现象和事件都是复杂且随机的。有时，我们可能需要在受控环境中研究这些事件。例如，贷款组合经理可能想要研究银行组合中多少贷款会在特定期间发生违约，或者股票组合经理可能性于了解组合随时间推移的表现。\n\
  \n两种投资组合经理面临的不确定性都是如何捕捉影响其投资组合的因素的未来实现。（注：已删除重复文本）。\n\n模拟用于所有行业，包括农业、天气、航空航天等，等等。\n\
  \n\n\n\n确定性模型和随机模型都可以用于静态和动态模拟。静态模拟是对特定时间点现实世界现象的表示。静态模拟不包含对过去发生事件的记忆；因此，它们不受时间的影响。每月工资开支模拟就是一个静态模拟的例子。在章节的后后部分，我们将介绍一种常见的静态模拟类型，即`蒙特卡洛模拟`。动态模拟表示随时间推演的现象。这类模拟的一个例子是模拟十二个月的累计工资开支。请注意，在这个例子中，上个月工资开支的金额将影响后续月份工资开支的累计值。\n\
  \n运行在离散时间和连续时间中的系统可以使用动态模型进行模拟。连续时间系统在某个间隔内的所有可能时间点都有输入和输出值，而离散时间系统仅在间隔内的离散时间具有值。将连续时间系统理解为在间隔内的每个可能的时刻产生输出的系统更为容易。例如，旧的旋转式式电表记录某个地点在每个时刻的用电量，并随时间推移进行积累，产生每月用电单位。新的数字固态电表则使用离散方法，通过在离散间隔内对电信号进行快照，并利用它们计算同一期间的能量消耗总量。事实上，连续系统与离散系统之间的区别在于采样频率。对于连续系统，采样频率在时间间隔内可能可能是无限的，而离散系统在相同间隔内具有有限数量的样本或实现。\n\
  \n## 随机模拟\n\n所有随机模型都需要关于你试图模拟的事件或过程的某些基本信息。这些信息包括现实世界中事件或现象发生的模式，以及用于描述该模式特征的基本参数。前者被称为`分布`，后者被称为`统计量`。例如，硬币投掷中出现的观测模式有两种可能的结果：正面或反面。对于单次掷骰子，有六种可能的结果，范围从\
  \ 1 到 6。描述硬币投掷或掷骰子特征的统计量包括获得特定结果的概率或结果的平均值。请注意，这两个事件之间的发生模式明显不同：一个有两个可能的结果，而另一个有六个可能的结果。事实上，不同的分布具有不同的结果范围和模式。确实，单次硬币投掷遵循的分布与多次硬币投掷所遵循的分布也不同。同样的直觉也适用于多次投掷多个硬币，以及多次投掷多个骰子。这是因为这些过程中的每一个都是独特的，所以我们预计它们会有不同的概率分布。\n\
  \n## 概率分布\n\n在你之前的统计课程中，你可能遇到过概率分布。有两种常见的单变量（边缘）概率分布类型：离散分布和连续分布。第三种概率分布是`多变量概率分布`（即一对或多个随机变量集合的概率分布）。\n\
  \n### 离散分布\n\n离散分布是遵循计数过程的发生模式。例如，硬币投掷和掷骰子的例子具有有限的可计数结果集。金融领域中常用的离散分布类型及其应用见表 4.1。\n\
  \n| 表 4.1：离散概率分布及其金融应用 |\n\n| --- |\n| 离散分布 | 应用 |\n| 伯努利分布 | 离散股票或股市结果 |\n| 二项分布\
  \ | 期权定价、风险管理 |\n| 几何分布 | 资产定价、投资组合管理 |\n| 松分布 | 资产定价、风险管理 |\n\n## 连续分布\n\n这类事件或发生具有遵循测量过程的连续范围结果。结果的范围通常是微小的，因为每个结果可能与其相邻的值没有明显区别。因此，连续随机变量的概率始终是在间隔上测量的。常见的连续分布类型及其在金融中的应用见表\
  \ 4.2。\n\n| 表 4.2：连续概率分布及其金融应用 |\n\n| --- |\n| 连续分布 | 应用 |\n| 正态分布 | 资产定价、风险管理 |\n\
  | 对数正态 | 资产定价、风险管理 |\n| t 分布 | 资产定价、风险管理 |\n| 均匀分布 | 模拟、资产定价、风险管理 |\n| 指数分布 | 风险管理、事件建模\
  \ |\n| 伽马分布 | 风险管理 |\n| Beta 分布 | 风险管理 |\n| F 分布 | 推断统计 |\n| 卡方分布 | 推断统计 |\n| 帕累托\
  \ | 风险管理 |\n| 逻辑分布 | 推断统计、风险管理 |\n| 韦布分布 | 风险管理 |\n\n## 多变量概率分布\n\n多变量分布是两个或多个随机变量的联合分布。例如，掷两个或多个骰子遵循的模式将具有多变量概率分布。多变量概率分布可以是离散的或连续的。它们还可能由两个或多个随机变量的边缘分布或条件分布组成。常见的多变量分布示例及其在金融中的应用见表\
  \ 4.3。\n\n| 表 4.3：多变量概率分布及其金融应用 |\n\n| --- |\n| 多变量分布 | 金融应用 |\n| 多变量正态 | 资产定价、投资组合风险管理\
  \ |\n| 多变量 t | 资产定价、投资组合风险管理 |\n| 多项分布 | 投资组合风险管理 |\n\n# 从各种概率分布模拟随机值\n\n在 SAS 中有多种方法进行模拟：\n\
  \n- DATA 步和 RAND 函数：这种方法非常适用于模拟单变量分布的数据。\n- PROC 语句：某些 SAS 过程如 `MODEL`、`COPULA`\
  \ 和 `SIMNORMAL` 具有模拟单变量和多变量数据的选项。\n- SAS 交互矩阵语言 (`IML`)：`PROC IML` 利用矩阵代数的力量进行复杂的单变量和多变量模拟。它比\
  \ DATA 步模拟方法在计算效率上略高。\n- SAS Simulation Studio：对于那些于使用图形用户界面和拖放菜单构建离散事件模拟的人，SAS\
  \ Simulation Studio 是一个强大的应用程序，可以与 SAS 引擎接口进行编程集成。SAS Simulation Studio 的优势之一是可以可视化和动画化用于构建模拟的模型。\n\
  \n\n\n\n\n在本本书中，我们将探索构建模拟模型的前三种方法，并特别关注它们在金融领域的应用。在 SAS 中模拟来自离散分布和连续分布的数据是相对直接的。通过\
  \ `DATA` 语句，你需要提供至少三组信息——分布类型、模拟数据来源分布的分布参数，以及模拟的重复次数（要抽取的样本数）。1\n\n### 离散分布\n\n\
  让我们从模拟投掷硬币开始。在足够多次的试验中，均匀硬币应该产生 50% 的概率获得正面或反面。由于单次硬币的投掷结果只有两种可能，因此该实验将等同于模拟来自伯努利分布（Bernoulli\
  \ distribution）的数据。在程序 4.1 中，我们展示了用于从伯努利分布中模拟数值的 SAS 代码。除了指定分布类型外，还需要提供的其他两部分信息是分布的参数（获得两个结果之一的概率）以及重复次数（进行的试验次数）。SAS\
  \ 中的 `RAND` 函数可以模拟之前章节中列出的所有离散和连续分布的数据。\n\n`CALL STREAMINIT` 语句为随机数生成器设置种子值。使用该语句可以确保你在每次运行模拟时都能获得相同的输出。如果你不在代码中包含该语句，SAS\
  \ 将使用计算机时钟来生成种子值。请注意，尽管我们指定了 50% 的成功概率（获得值 1 的概率），但成功的频率并没有与该值匹配。在实际上，对于离散事件，你需要运行多得多的试验，以增加经验概率匹配理论概率的几率。\n\
  \n### 程序 4.1：从伯努利概率分布模拟数据\n\n```\n/*从伯努利分布中模拟数据 */\n%let prob=0.5; /*成功概率*/\ndata\
  \ simul1;\n      call streaminit(4321);/*随机种子生成器*/\n      do i=1 to 100; /*迭代次数*/\n\
  \              Simnum =rand(\"Bernoulli\", &prob); /*调用 RAND 函数*/\n            \
  \  output; /*输出每次迭代的值*/\n      end;\nrun;\n\n/*计算模拟统计数据*/\nods graphics on;\nproc\
  \ freq data=simul1;\n      table Simnum;\nrun;\n```\n\n输出 4.1：从伯努利分布模拟数据\n![image](img/Ch04_out_1.jpg)\n\
  \n我们可以修改程序 4.1 中的代码，从伯努利分布中模拟数值。伯努利分布总结了单次试验的分布。\n\n### 程序 4.2：从二项分布模拟数据\n\n```\n\
  /*从二项分布中模拟数据 */\n%let prob=0.5; /*成功概率*/\n%let num = 1; /*试验次数*/\n\ndata simul2;\n\
  \      call streaminit(4321);/*随机种子生成器*/\n      do i=1 to 100; /*迭代次数*/\n      \
  \        Simnum =rand(\"Binomial\", &prob); /*调用 RAND 函数*/\n              output;\
  \ /*输出每次迭代的值*/\n      end;\nrun;\n\n/*计算模拟统计数据*/\nods graphics on;\nproc freq data=simul2;\n\
  \      table Simnum;\nrun;\n```\n\n输出 4.2：从二项分布模拟数据\n![image](img/Ch04_out_2.jpg)\n\
  \n请注意，我们得到的统计结果与伯努利分布是相同的。这是因为二项分布总结了单次试验的分布。在图 4.2 中，当试验次数设为 100 时，二项分布的模拟值是不同的。注意图中，我们没有获得任何成功（或失败）的二项分布。当我们越接近\
  \ 50% 的概率概率时，模拟的二项分布结果就越接近。投掷硬币的序列是二项分布的一个用例。\n\n图 4.2：二项分布次数的频率图\n![image](img/Ch04_fig_2.jpg)\n\
  \n## 连续分布\n\n现在让我们尝试从连续分布（如正态分布）模拟数值。与离散分布的情况一样，我们还需要指定分布的参数（在正态分布的情况下为均值和标准差）以及重复次数。在\
  \ SAS 中，如果不指定参数，它假设均值为 0、标准差为 1 的标准正态分布。程序 4.3 展示了使用 `DATA` 步模拟 100 个标准正态分布观测值的\
  \ SAS 代码。模拟序列的统计属性是使用 `UNARIATE` 过程计算的。\n\n### 程序 4.3：从正态分布模拟数值\n\n```\n/*从正态分布中模拟数据\
  \ */\ndata simul3;\n      call streaminit(4321);/*随机种子生成器*/\n      do i=1 to 100;\
  \ /*迭代次数*/\n              Simnum =rand(\"normal\"); /*调用 RAND 函数*/\n           \
  \   output; /*输出每次迭代的值*/\n      end;\nrun;\n\n/*计算模拟统计数据*/\nproc univariate data=simul3;\n\
  \      var Simnum;\n      histogram;\nrun;\n```\n\n输出 4.3：从正态分布模拟数值\n![image](img/Ch04_out_3.jpg)\n\
  \n\n\n\n\n```sas\n/*使用正态分布模拟标普 500 指数的收益率 */\n/*指定分布统计量*/\n%let smean=0.0067658;\n\
  %let ssd = 0.04465726;\n\ndata simul4 (keep=i simnum);\n      call streaminit(4321);/*随机种子生成器*/\n\
  \      do i=1 to 1000; /*迭代次数*/\n            Simnum =rand(\"normal\",&smean,&ssd);\
  \ /*调用 RAND 函数*/\n            output; /*输出每次迭代的值*/\n      end;\nrun;\n\n/*计算模拟统计量*/\n\
  proc univariate  data=simul4;\n      Var  Simnum;\n      histogram / normal kernel;\n\
  run;\n```\n\n| --- |\n\n输出 4.4: 使用正态分布模拟的标普 500 指数收益率模拟值\n\n| ![image](img/Ch04_out_4-4.jpg)\
  \ |\n\n| --- |\n\n模拟值的均值和标准差与标普 500 指数历史月度收益率的均值和标准差非常接近。然而，观察直方图以及正态密度和核密度图可以明显看出，模拟数据近似于正态分布，而非完美正态。\n\
  \n那么，我们能从这种模拟中学习到什么？首先，我们可以看到，在任何给定月份观察到绝对月收益超过 16%的可能性极低。其次，我们还可以看到某个月获得正收益率的概率高于获得负收益率的概率（换句话说，我们获得指数月度正收益的概率密度大于观察负收益率的概率密度）。这个看似平庸的统计事实实际上是长期投资是一场“正和博弈”的基本基础。因为正收益月份多于负收益月份，投资者通过持有广泛多元化的股票组合，几乎在长期内总能盈利。\n\
  \n图 4.3: 模拟的标普 500 收益率的分布\n\n![image](img/Ch04_fig_4-3.jpg)\n\n### 多变量分布\n\n虽然可以使用\
  \ `DATA` 步完成多变量分布的模拟，但使用 `IML` 过程通常更有效。与其使用 `DATA` 步中嵌套循环的方法来模拟多变量数据，`IML` 过程在遍历连续行或列时，会一次性模拟所有变量的值。与\
  \ `DATA` 步相比，这是一种更简单且计算效率更高的方法。\n\n让我们模拟两只零售股（亚马逊和沃尔玛）的月收益率。这两只股票收益之间的相关性为 0.081。它们的平均月收益率以及方差和协方差如下表\
  \ 4.4;\n      MRET =Rand(n,mean,vcv); /*模拟 5000x2*/\n      smean =mean(MRET); /*样本均值*/\n\
  \      svcv = cov(MRET); /*样本协方差*/\n      scorr = inv(diag(svcv))*svcv*inv(diag(svcv))/*样本相关性*/\n\
  \      vname ={\"AMZN\",\"WMT\"}; /*指定列和行*/\n      print(MRET[1:5]);\n      print(smean);\n\
  \      print(svcv);\n      print(scorr);\n      /*后续步骤创建一个 SAS 数据集\n      create\
  \ simul5 from MRET;\n      append MRET;\n      close simul5;\n      quit;\n\nproc\
  \ sgplot data=simul5;\n      inset \"Monthly Returns\" position=top textattrs=(family=\"\
  Times Roman\" color=darkblue size=12) value=center;\n      scatter x=amzn y=wmt;\n\
  \      xaxis label=\"亚马逊收益\" valuesformat=percent.2 (-0.4 0.4);\n      yaxis label=\"\
  沃尔玛收益\" valuesformat=percent.2 (-0.2 0.2);\nrun;\n```\n\n| --- |\n\n输出 4.5A: 来自正态分布的股票收益模拟\n\
  \n| ![image](img/Ch04_out_4-5.jpg) |\n\n| --- |\n\n输出 4.5B: 亚马逊公司和沃尔玛月收益散点图 |\n\n\
  ![image](img/Ch04_2.jpg) |\n\n| --- |\n\n输出 4.5A 显示了执行 IML 过程的结果。你会发现模拟收益的均值和协方差矩阵与生成模拟时使用的理论值接近。\n\
  \n输出 4.5B 显示了（使用 PROCPLOT 创建）两只股票模拟收益的散点图。尽管亚马逊和沃尔玛是美国最大的两个零售商，但它们模拟和实际股票收益之间的相关性正如相关性矩阵所示实际上很的。这在某种程度上反映了它们业务策略的不同。亚马逊主导在线领域，而沃尔玛在实体店领域领先。多年来，亚马逊还加大了对服务销售部门的关注，现在服务销售收入（52.7%）已超过了产品销售收入（47.3%）。相比之下，沃尔玛约\
  \ 99% 的收入来自产品销售。3\n\n### 随机过程\n\n到目前为止，我们探索了不考虑时间的静态模拟示例。然而，大多数金融数据都是时间序列格式，因此你遇到模拟时间序列数据的需求可能比遇到其他类型的数据更高。\n\
  \n\n\n\n\n随机过程描述了随机变量随时间发生的情况。在构建现实世界现象或系统的模拟模型（特别是在金融领域）之前，掌握常见随机过程的统计属性是必须具备的一项至关重要的知识。在第三章中，我们讨论了时间序列数据的多种统计属性，例如趋势、周期性、季节性和自相关性等。这些属性以及数据的光布特性共同构成了你在金融领域中会遇到的不同类型随机过程的基础。与分布一样，随机过程可以以连续或离散时间过程的形式存在。连续时间随机过程\
  \ `X(t)` 被定义为固定时间 `t`（其中 `t` ∈ `[0,∞)`）上所有实现值的集合 `{X[t[1]]`、`X[t[2]]`、……`X[t[j]]}`。在这里，索引变量\
  \ `t` 是实数取值在连续集中的元素，如下所示。\n\n`{X[t], t∈0,∞)} (4.3)`\n\n例如，`X(t)` 可以是在时间 `t` 间隔采样的股票价格集合，可以是分钟、小时或每天。注意，在每个间隔内，根据可用的计算资源，你可以收集到几乎无限数量的数据点。尽管大多数人对每日股票价格熟悉，但实际上，股票价格的记录频率通常远高于每日。[4\n\
  \n离散时间随机过程 `X(t)` 是其实现值 `{X[t[1]]`、`X[t[2]]`、……`X[t[j]]}` 发生在可计数集 `J` 上，其中 `J` =\
  \ `{t[1]`、`t[2]……}`。在这里，索引变量 `t` 是可计数集 `J` 中的元素，如下所示。\n\n`{X[t], t∈J} (4.4)`\n\n\
  离散时间随机过程也被称为在离散间隔 `t` 采样的随机变量序列。在这种情况下，例如 `X(t)` 可以是公司在定义期间内（如每日、每周、每月或季度）销售的产品数量。注意，这些间隔中的每一个都是独特的时间单位。通过增加采样窗口也可以对连续时间随机过程进行离散化（例如从逐笔股票价格变为每日价格，即在每个交易日收盘时进行采样）。\n\
  \n无论随机过程是以离散还是连续的方式演变，这些过程共同拥有的特征是它们随时间演变过程中蕴含的不确定性元素。在在本章的后续章节中，我们将探索这些元素，并在对股票价格和资本项目进行的模拟中利用这些元素。连续和离散时间随机过程是金融领域常用各种类型随机过程的广泛泛化。事实上，这些许多过程具有独特特性，适用于对金融领域特定类型的现象进行建模。更具体的随机过程类示例包括：高斯过程、维纳过程（布朗运动）、随机游走、伊藤过程、几何布朗运动和均值回归（Ornstein-Uhlenbeck）过程。\n\
  \n## 高斯过程\n\n通常，高斯过程是一种显示出高斯分布特性的连续时间随机过程。它的独特之处在于，当在有限间隔内采样时，它完全由其均值和协方差矩阵决定。高斯过程通常被称为正态随机过程，因为它们具有正态分布的属性。事实上，如果一个随机过程的所有实现值也是联合正态的，那么该随机过程就被认为是高斯（正态）的。（换句话说，对于间隔\
  \ `t`，如果随机变量 `{X[t], t∈J}` 在间隔内的实现值 `{X[t[1]]`、`X[t[2]]`、……`X[t[j]]}` 是联合正态的，则随机变量\
  \ `{X[t], t∈J}` 遵循高斯[正态]过程。）\n\n高斯过程是一种显示出高斯分布特性的连续时间随机过程。它的独特之处在于，当在有限间隔内采样时，它完全由其均值和协方差矩阵决定。高斯过程通常被称为正态随机过程，因为它们具有正态分布的属性。事实上，如果一个随机过程的所有实现值也是联合正态的，那么该随机过程就被认为是高斯（正态）的。（换句话说，对于间隔\
