  \ 88.390 || 1.123 || 4493.000 |\n| 1/31/2022 19:00 || 38262.50 ||  || 88.210 ||\
  \ 1.123 || 4481.500 |\n| 1/31/2022 21:00 || 38627.95 ||  || 88.400 || 1.123 || 4491.250\
