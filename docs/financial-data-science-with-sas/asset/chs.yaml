  \ INC. |\n| DD | DONT NEMOURS INC. | ALG | ALAMO GROUP INC. | SUN | SUNOCO LP |\n\
  | JPM | JPMORGAN CHASE & CO | PAYC | PAYCOM INC. | TOL | TOLL BROTHERS INC. |\n\
  | META | META PLATFORMS INC. | KMI | KINDER MORGAN INC. | VFC | VF CORP. |\n| PFE\
  \ | PFIZER INC. | CMS | CMS ENERGY CORP. | STE | STERIS PLC |\n| SWK | STANLEY BLACK\
  \ & DECK INC. | WM | WASTE MANAGEMENT INC. | HAS | HASBRO INC. |\n| UNH | UNITED\
  \ HEALTH GROUP INC. | BXP | BOSTON PROPERTIES INC. | ALLY | ALLY FINANCIAL INC.\
  \ |\n| VTRS | VIATRIS INC. | GEN | GEN DIGITAL INC. | KO | THE COCA-COLA COMPANY\
  \ |\n| FDP | FRESH MONTE PRODUCE INC. | ALK | ALASKA AIR GROUP INC. | CPT | CAMDEN\
  \ PROPERTY TRUST |\n| CMI | CUMMINS INC. | CCI | CROWN CASTLE INC. | DG | DOLLAR\
  \ GENERAL CORP. |\n| FE | FIRST ENERGY CORP. | VNO | VORNADO REALTY TRUST | TSCO\
  \ | TRACTOR SUPPLY COMPANY |\n\n绩效衡量关注的是报告期内组合在收益和风险方面发生了什么。请注意，风险和收益通常以绝对和相对术语进行评估（即相对于基准）。\n\
  \n绩效归因关注组合是如何实现所衡量的表现的。换句话说，绩效归因侧重于识别和量化影响组合风险和收益的驱动因素。归因为报告期间的组合决策提供了更深层次的见解。它还揭明了组合决策或策略在未来是否具有可持续性和重复性。因此，它可能是绩效评估最有价值的方面之一。\n\
  \n\n\n\n对于这项练习，我们需要四个数据集。`PORTFOLIO_PRICES` 数据集包含投资组合中所有 63 只股票的月度价格，而 `PORTFOLIO_ATTRIB`\
  \ 数据集包含投资组合中每只股票的属性。这些包括公司名称、所有 63 只股票的期初和期末价格、它们的投资组合权重、收益率、标准差、Beta 系数、行业以及注册地等。`BENCHMARK_PRICES`\
  \ 数据集包含罗素 3000 指数的月度水平，而 `BENCHMARK_ATTRIB` 数据集包含该指数中 11 个全球行业分类 (GIC) 部门的权重和收益率。在表\
  \ 2.9 中，报告了投资组合和基准的某些描述性特征。\n\n## 数值性能衡量\n\n程序 2.11 使用 `DATAPULL` 宏从存储库中调取我们将使用的四个数据集。第一个\
  \ `DATA` 步骤将 `PORTFOLIO_PRICES` 和 `PORTFOLIO_ATTRIB` 数据集合并为 `PORTA` 数据集。然后，它利用投资组合中\
  \ 63 只股票的月度价格和单位计算它们各自投资组合持仓的月度值(`MHOLDINGS`)。\n\n| 表 2.9：样本和基准投资组合中股票的行业组成 |\n\n\
  | --- |\n| || 公司数量 || 权重 || 收益率 |\n| 行业 || 投资组合 || 基准 || 投资组合 || 基准 || 投资组合 || 基准\
  \ |\n| 通信服务 || 1 || 65 || 4.49% || 2.91% || 23.13% || 2.75% |\n| 非周期性消费 || 13 ||\
  \ 483 || 18.12% || 16.71% || 31.00% || 17.47% |\n| 消费必需品 || 4 || 123 || 4.24% ||\
  \ 5.15% || 9.70% || 14.75% |\n| 能源 || 5 || 127 || 3.59% || 3.37% || 39.74% || 44.24%\
  \ |\n| 金融 || 5 || 467 || 5.70% || 10.95% || 50.10% || 31.89% |\n| 医疗保健 || 9 || 646\
  \ || 14.13% || 13.90% || 29.54% || 17.09% |\n| 工业品 || 9 || 459 || 24.01% || 13.47%\
  \ || 12.59% || 15.52% |\n| 信息技术 || 7 || 329 || 17.25% || 26.31% || 26.41% || 35.62%\
  \ |\n| 材料 || 3 || 106 || 2.83% || 1.97% || 8.56% || 22.80% |\n| 房地产 || 4 || 183\
  \ || 4.54% || 3.41% || 38.52% || 33.56% |\n| 公用事业 || 3 || 80 || 1.11% || 2.31% ||\
  \ 13.50% || 14.64% |\n| 合计 || 63 || 3,068 || 100% || 100% || 25.24% || 24.51% |\n\
  \n接下来，我们使用 `PROC SORT` 按日期对数据排序排序然后使用 `PROC SQL` 语句通过对每只股票的月度持仓求和来计算投资组合的月度值(`TOTALHOLDINGS`)。计算出的月度投资组合价值存在\
  \ `TOTALHOLD` 数据集中。注意，我们还创建了名为 `PORTB` 的数据集，它保留了 `PORTA` 数据集中的所有信息。将在程序 2.12 中将此数据集与\
  \ `TOTALHOLD` 合并。程序 2.11 中的最后一个 `DATA` 步骤使用对数收益率公式计算月度投资组合收益(`PRETURNS`)。\n\n###\
  \ 程序 2.11：计算总月度投资组合持仓和收益\n\n```sas\n/*Using DATAPULL Macro to download portfolio\
  \ data from GitHub*/\n%datapull(pprice,portfolio_prices.sas7bdat);\n%datapull(pattrib,portfolio_attrib.sas7bdat);\n\
  %datapull(bprice,benchmark_prices.sas7bdat);\n%datapull(battrib,benchmark_attrib.sas7bdat);\n\
  \n/*Merging attributes and price and calculating monthly returns */\ndata PortA;\n\
  \      format Price dollar13.2 MHoldings dollar16.2 \n      Mcap dollar32.;\n  \
  \    merge Portfolio_Attrib  Portfolio_Prices;\n      by Ticker;\n      MHoldings\
  \ = price*quantity;/*Monthly Holdings for each stock*/\nrun;\n```\n\n```sas\nproc\
  \ sort data= PortA ;\nBy Date;\nrun;\n/*Calculating Total Portfolio Holdings and\
  \ Returns*/\nproc sql;\n  create table portb as select * from porta;\n  create table\
  \ Totalhold as select date, \n  sum(mholdings) as Totalholdings /*Monthly values*/\n\
  from porta group date;\nquit;\n\ndata Totalhold;\n  set Totalhold;\n  /*Calculating\
  \ monthly portfolio returns*/\n  Returns =log(Totalholdings/lag(Totalholdings));\n\
  \  format Returns Percent8.2;\n  label Returns ='Portfolio Returns';\nrun;\n```\n\
  \n在程序 2.12 中，我们使用 `PROC SQL` 对 `TOTALHOLD` 和 `PORTB` 数据集执行内连接以创建 `PORTFOLIO_METRICS`\
  \ 数据集。然后，我们通过将每只股票的月度持仓(`MHOLDINGS`)除以每个月的投资组合总价值(`TOTALHOLDINGS`)来计算每只股票的月度投资组合权重。\n\
  \n### 程序 2.12：使用 PROC SQL 计算月度权重\n\n```sas\n/*Calculating Monthly Weights in the\
  \ Portfolio by merging Totalhold and Portb*/\nproc sql;\n  create table Portfolio_Metrics\
  \ as select * from Totalhold right join portb\n  on totalhold.date=portb.date;\n\
  \n/*Monthly Weights as Monthly Holdings(per stock)/Total*/\n  alter table Portfolio_Metrics\
  \ add Weights='Portfolio Weights';\nquit;\n```\n\n在程序 2.13 中，我们通过 `DATA` 步骤合并 `TOTALHOLD`\
  \ 和 `BENCHMARK_PRICES` 数据集创建 `MBMPORT` 数据集。然后，我们使用 `PROC MEANS` 计算投资组合和基准的月度收益、标准差、偏度和峰度。我们使用平均超额收益和标准差来计算夏普率。计算结果报告在表\
  \ 2.10 中。\n\n| 表 2.10：样本和基准投资组合的月度性能 |\n\n| --- |\n| || 平均 || 标准差 || 夏普率 || Beta\
  \ || 峰度 |\n| 投资组合收益 || 1.88% || 3.49% || 0.504 || 0.98 || -0.747 |\n| 罗素 3000 收益\
  \ || 1.79% || 3.05% || 0.549 || 1.02 || -0.6139 |\n\n### 程序 2.13：使用 DATA 步骤和 PROC\
  \ MEANS 计算投资组合和基准统计\n\n```sas\n/*Monthly Performance Relative to Benchmark*/\ndata\
  \ MBMPort;\n      format Date monyy.;\n      merge TotalHold Benchmark_Prices;\n\
  \      EXPort = PReturns - TBY;\n      EXRUA = RRUA -TBY;/*TBY-Monthy Yield on 10Yr\
  \ Treasury Bond*/\n      label EXPort ='Excess Return';\n      label EXRUA ='Excess\
  \ Benchmark Return';\n      by Date;\nrun;\n\nproc means data=MBMPort(where=(date>’31Dec20’D))\
  \ mean stddev skew kurt;\nvar PReturns RRUA EXPORT EXRUA;\nrun;\n```\n\n\n\n\n\n\
  经理所采用的集中投资组合策略的影响在组合表现的总风险和总风险调整衡量指标中显而易见，具体体标准差和 `Sharpe ratios` 中。在这两项指标中，组合的表现均逊于基准。但根据\
  \ `betas` 和 `Treynor measures` 捕捉的系统风险调整衡量指标，组合的表现确实优于基准。风险排序的差异源于组合属性，我们稍后将对其可视化。尽管组合持有的股票数量相对少于指数，但它主要由具有较低\
  \ `betas` 的大盘股组成，而指数主要由中小型市值股组成，这些股票往往具有较高的 `betas`。总而言之，该组合在总收益和系统风险调整收益方面优于基准。\n\
  \n## 可视化性能衡量\n\n在`Program 2.14` 中，我们使用 `TEMPLATE` 和 `SGRENDER` 过程来将组合的月度价值和收益可视化。组合价值使用柱状图绘制，并叠加了月度收益的折线图。为了结合不同类型的图表，通常最好花时间创建一个布局，以便未来通过较小的修改进行调用和复用。图表模板使用\
  \ `GTL` 生成，它是 `SAS ODS` 的扩展。这些模板存储在 `SAS template store` 中。然后可以使用 `SGRENDER` 过程进行调用和渲染。尽管大多数图表可以直接创建而无需使用模板，但模板对\
  \ `SAS` 中可视化渲染的方式提供了更多控制。未来，我们将尝试两种方法（即直接绘制图表和使用自定义模板渲染它们）。\n\n### Program 2.14：使用\
  \ `PROC TEMPLATE` 和 `PROC SGRENDER` 生成月度组合性能柱线混合图\n\n```sas\n/*Graphing Monthly\
  \ Portfolio Returns and Value*/\nproc template;\n   define statgraph barline;\n\
  \      begingraph;\n         entrytitle \"Portfolio Performance in 2021\";\n   \
  \      layout overlay / \n          xaxisopts=(label=\"Month\" timeopts=(tickvalueformat=monname3.))\n\
  \          yaxisopts=(label=\"Values (Millions)\" offsetmin=0\n          linearopts=(tickvaluesequence=(start=0\
  \ end=80 increment=20)\n          tickvaluepriority=true))\n          y2axisopts=(label=\"\
  Returns\" offsetmin=0\n          linearopts=(viewmin=-.1 viewmax=.1));\n       \
  \  barchart category=date response=eval(Totalholdings/1000000) /\n         name=\"\
  bar\" legendlabel=\"Portfolio Values\" \n         fillattrs=(transparency=0.6 color=bip);\n\
  \          linechart category=date response=PReturns / \n          legendlabel=\"\
  Portfolio Returns\" vertexlabel=true\n          vertexlabelattrs=(color=darkblue\
  \ weight=bold)\n          name=\"line\" stat=sum yaxis=y2 display=(line markers)\n\
  \             markerattrs=(symbol=circlefilled color=darkblue)\n          lineattrs=(color=darkblue);\n\
  \         end;\n      endgraph;\n   end;\nrun;\n\nproc render data=portfolio template=barline;\n\
  run;\n```\n\n\n\n\n让我们使用其他类型的可视化工具对投资组合的特征和性能进行深入分析。具体而言，我们将使用可视化方法来检查行业层面的投资持仓、估值、收益、风险、收入以及收益的离散程度。我们还将检查投资持仓在美国\
  \ 50 个州的地理分布情况。\n\n## 投资组合配置\n\n程序 2.16 包含了 SAS 代码，通过饼图 `TEMPLATE` 和 `SGRENDER`\
  \ 过程显示投资组合的行业权重。在这个示例中，创建了一个饼图模板来定义图表的布局。随后在 `SGRENDER` 过程中调用该布局以渲染图表。\n\n### 程序\
  \ 2.16：使用 `PROC TEMPLATE` 和 `SGRENDER` 通过饼图显示投资组合的行业权重\n\n```sas\n/*Using Pie Chart\
  \ to Display Portfolio Attributes*/\nproc template; \n      define statgraph pietemp;\
  \  \n      begingraph;    \n      entrytitle \"Portfolio Sector Weights\";  \n \
  \     layout region;    \n      piechart category=Sector / stat=pct datalabellocation=outside\n\
  \      othersliceopts=(percent=1.5);    \n      endlayout;  \n      endgraph;\n\
  \      end;\nrun; \n\nproc sgrender data=Portfolio_Attrib template=pietemp; ownrun;\
  \ \n```\n\n### 输出 2.16：投资组合行业权重\n\n| ![image](img/Ch02_out_2-16.jpg) |\n\n输出 2.16\
  \ 显示了投资组合中 63 只股票的行业权重。从市场价值角度来看，约 60% 的投资组合集中在四个行业：可选消费、医疗保健、工业和信息技术。\n\n## 估值\n\
  \n我们可以使用 `SGPLOT` 过程（如程序 2.17 所示）在热图上探索投资组合三个特征之间的相互作用。在图中，我们将 `Sector` 分布与市值分布的关系，以及它们与广知的估值倍数（市盈率）的交互进行了对比。大股的平均估值似乎较高，特别是可选消费、技术和房地产行业的股票。中盘房地产板块估值极端，是因为投资组合中只有一只股票属于该区间，即\
  \ Vornado Realty Trust (VNO)。\n\n### 程序 2.17：使用 `PROC SGPLOT` 通过热图显示投资组合的行业权重\n\n\
  ```sas\n/*Using a Heat Map to Display Portfolio Attribute*/\nproc sgplot data=Portfolio_Attrib;\n\
  \      title 'Sector-Level Portfolio Characteristics';\n      heatmap x=mcapc y=sector/\
  \ colorresponse=pe colorstat=mean weight=weights;\nrun;\n```\n\n### 输出 2.17：投资组合行业权重热图\n\
  \n| ![image](img/Ch02_out_2-17.jpg) |\n\n### 程序 2.18：使用 `PROC TEMPLATE` 和 `PROC\
  \ SGRENDER` 通过柱状图显示投资组合的估值溢价\n\n```sas\n/*Using Bar Chart to Display Portfolio Attribute*/\n\
  proc template;\n  define statgraph barchart;\n    begingraph/border=false\n    \
  \          datacolors = (pink plum paleturquoise)\n              datacontrastcolors\
  \ = (black);\n  entrytitle \"Portfolio Factor Exposure By Capitalizations\" ;\n\
  \   layout overlay;\n```\n\n```sas\n      barchart category=mcapc  response=pb /\
  \ name=\"pbar\"\n      stat=mean orient=vertical dataskin=sheen\n             colorbyfreq=true\
  \  colorstat=pct colormodel=datacolors;\n     continuouslegend \"pbar\" / \n   \
  \       title=\"Market Capitalization Allocations\";\n     endlayout;\n     endgraph;\n\
  \  end;\n\nproc sgrender data=Portfolio_Attrib template=barchart;\nrun;\n```\n\n\
  我们另一个可以检查的估值元素是市净率。在程序 2.18 中，我们再次利用 `BARCHART` 和 `SGRENDER` 来显示市值与估值溢价之间的关系。输出\
  \ 2.18：估值溢价\n\n| ![image](img/Ch02_out_2-18.jpg) |\n\n## 收益\n\n对于某些投资组合来说，股息收入也是投资组合的主要要素，因此被视为整体性能的一个方面进行评估。在程序\
  \ 2.19 中，我们使用堆叠柱状图显示每个行业的收益。图表显示大部分收益来自大股，特别是金融、能源和房地产行业的股票。\n\n### 程序 2.19：使用 `PROC\
  \ SGPLOT` 通过热图显示投资组合的行业权重\n\n```sas\n/*Using a Heat Map to Display Portfolio Attribute*/\n\
  proc sgplot data=Portfolio_Attrib;\n      title 'Sector-Level Portfolio Characteristics';\n\
  \      vbar category=Sector response=returns weight=weights stat=mean group=mcapc;\n\
  run;\n```\n\n### 输出 2.19：按行业配置划分投资组合收益\n\n| ![image](img/Ch02_out_2-19.jpg) |\n\n\
  ## 收入\n\n对于某些投资组合，股息收入也是投资组合的主要要素。在程序 2.20 中，我们复制了堆叠柱状图来显示每个行业的收入贡献。图表显示大部分收入来自大股，特别是金融、能源和房地产行业的股票。\n\
  \n### 程序 2.20：使用 `PROC TEMPLATE` 和 `PROC SGRENDER` 通过堆叠柱状图显示投资组合的行业收入\n\n```sas\n\
  /*Using Stacked Column Chart to Display Portfolio Income*/\nproc template;\n  define\
  \ statgraph barchart;\n    begingraph;\n    entrytitle \"Portfolio Income by Sectors\"\
  ;\n    layout overlay;\n      barchart category=Sector  response=income / name=\"\
  pdisplay\"\n      stat=sum display=all orient=horizontal group=mcapc;\n      discretelegend\
  \ \"pdisplay\";\n    endlayout;\n    endgraph;\n  end;\n\nproc sgrender data=Portfolio_Attrib\
  \ template=barchart;\nrun;\n```\n\n### 输出 2.20：按行业划分的投资组合收入\n\n| ![image](img/Ch02_out_2-20.jpg)\
  \ |\n\n## 风险\n\n现在我们转向投资组合的风险和收益离散性。在程序 2.21 中，使用 `SGPLOT` 过程创建了一个散点图，将每只股票的收益与其\
  \ Beta 值对比。我们还在图中绘制了一条回归线（使用 `REG` 语句），以查看资本资产定价模型（CAPM）的预测是否也适用于该组合。`CLM` 语句用于定义投资组合收益预测区域的置信限。\n\
  \n### 程序 2.21：使用 `PROC SGPLOT` 通过散点图显示投资组合的风险与收益关系\n\n\n\n\n\n```sas\n/*Using Scatterplot\
  \ to Display Reward to Risk*/\n proc sgplot data=Portfolio_Attrib;\n     title '\
  \ Portfolio Reward-to-Risk';\n     scatter x=beta y=returns/;\n     reg x=beta y=returns/CLM\
  \ CLI='Prediction' alpha=.05;\n     Xaxis label = 'Beta' values=(0 to 2 by 0.2)\
  \  ;\n     yaxis label ='Returns'  valuesformat=percent12.2;\n     keylegend / location=inside\
  \ position=bottomright;\nrun;\ntitle; \n```\n\n输出 2.21：投资组合组件的安全市场线\n\n![image](img/Ch02_out_2-21.jpg)\n\
  \n根据预测线和区域来看，年收益接近 150% 的证券似乎是一个离群值。回归线的正斜率证实了普遍的观点：高风险资产应该为投资者带来更高的回报。\n\n## 收益离散度\n\
  \n我们还通过检查每个行业内收益的离散程度，来考察经理在每个行业内选择优优股票的能力。广泛的离散可能意味着运气，而不一定意味着选股的敏锐。同样，某个行业内低表现股票的集中也可能意味着在该行业的判断不佳。可能还有其他因素在起。尽管如此，让我们使用\
  \ `PROC SGPLOT` 中的箱线图选项结合程序 2.22 中的 SAS 代码来检查每个行业内的收益离散度。\n\n程序 2.22：使用 `PROC SGPLOT`\
  \ 使用箱线图显示行业级收益离散度\n\n```sas\n/*Using a Box Plot to display return dispersion*/\n\
  proc sgplot data=Portfolio_Attrib;\n     title ' Performance Dispersion by Sector';\n\
  \     hbox returns/category=sector dataskin=matte fillattrs=(\ncolor='Aquamarine');\n\
  run;\ntitle;\n```\n\n输出 2.22 显示，与其他行业相比，金融、工业、非必需性消费、医疗保健和房地产行业的收益离散程度明显更高。图中同样明显的是，能源、金融和工业行业在收益表现方面存在离群值。该年金融服务行业中表现离群的股票是\
  \ Signature 银行，其收益率为 139.1%。有趣的是，13 个月后，由于硅谷银行倒闭以及 Signature 银行对加密货币行业的风险口引发了银行挤兑，Signature\
  \ 银行被联邦和州监管机构列入接管。12\n\n输出 2.22：行业级收益离散度\n\n![image](img/Ch02_out_2-22.jpg)\n\n\
  ## 地理离散度\n\n地理多元化或州面的优惠税收待遇可能是某些投资者的考虑因素。因此，让我们使用 `SGMAP` 过程来检查投资组合在美国 50 个州中的地理集中情况。该过程确实需要大量的准备代码，以将数据中的地理信息（在本例中为州缩写）与\
  \ SAS 用于渲染地理地图的地图模板对齐。`SGMAP` 过程通过在由第三方地图提供商生成的地图模板上叠加多边形轮廓区域来工作。为了创建多边形，`SGMAP`\
  \ 需要位置的联邦信息处理标准 (FIPS) 代码。对于美国州和领土，这是一个范围从 1 到 72 的数值。13 这些信息随后被转换为地图数据集，由 X（水平）和\
  \ Y（垂直）坐标组成，SAS 使用它们渲染地图。`MAPDATA` 语句用于将边界区域读取到 SAS`MAPRESPDATA` 语句读取包含投影到地图上的响应变量的数据集。`PLOTDATA`\
  \ 语句将其他数据集读取到 SAS，可以将点图和气泡图等其他图叠加到地图上。本例使用的第三方地图提供商是 OpenStreetMap。`CHOROMAP` 语句指定了用于在底图上渲染响应变量（`COUNT`）二维地图（区域地图）的规则集。\n\
  \n程序 2.23：使用 `PROC SGMAP` 显示投资组合持仓的地理集中情况\n\n```sas\n/*Using Geomaps to Display\
  \ Geographic Portfolio Concentration*/\n%datapull(plot,plot_data.sas7bdat); \n%datapull(states,states.sas7bdat);\n\
  proc sgmap mapdata=states     /* Map boundaries */\n     maprespdata= plot_data\n\
  \     plotdata=plot_data; /* location data */\n     title 'Portfolio Concentration\
  \ By State';\n     openstreetmap;\n     choromap  count / mapid=state density=2\n\
  \     name='choro';\nx=beta y=returns;\ntext=statename textattrs=(size=7);\nlegend\
  \ title='Number of State'\nrun;\n```\n\n在程序 2.23 中，投资组合在美国 50 个州中的地理分布被绘制在地图上。我们首先使用\
  \ `%DATULL` 宏下载 `PLOT_DATA` 和 `STATES` 集。接下来，调用 `SGMAP` 过程。`MAPDATA` 语句指示该过程使用 `STATES`\
  \ 定义边界。`PLOT_DATA` 包含 63 只股票中的 58 只。剩下的五个没有在内。我们使用 `CHOROMAP` 绘制计数。`TEXT` 语句指定 `STATENAME`，即州的缩写名称。\n\
  \n输出 2.23 显示了从 `SGMAP` 获取的地图。地图强调了在德克萨斯州和加利福尼亚州的投资组合的集中情况。地图上同样显示美国东部比西部和中部地区的数量更多。\n\
  \n输出 2.23：投资组合持仓的地理集中情况（图片缺失）\n\n## SAS 中的数值归因\n\n到为止，我们主要对投资组合业绩进行了可视化归因。让我们通过对投资组合业绩进行数值归因来结束。在可视化中，我们显示金融、能源和房地产行业的大股；金融、能源和非必需性消费的中股；以及工业行业的小股似乎是组合业绩的主要驱动因素。但这些结果可能是所谓的水涨船高效应。因此，让我们尝试使用广泛使用的\
  \ Brinson 模型 (1985, 1986) 业绩归因模型将经理能力与市场效应分离，该模型将整体业绩分解为：\n\n投资组合业绩 = 基准贡献 + 经理选择\
  \ (2.1)\n\n让我们定义投资组合和基准业绩如下：\n\n投资组合业绩 (P) = $\\sum_{i=1}^{N} w_i R_i$\n基准业绩 (B)\
  \ = $\\sum_{i=1}^{N} W_i B_i$ (2.2)\n\n其中：\n\n$w_i = \\text{投资组合在行业 i 中的权重}$\n$R_i\
  \ = \\text{投资组合在行业 i 中的收益}$\n$W_i = \\text{基准在行业 i 中的权重}$\n$B_i = \\text{基准在行业 i\
  \ 中的收益}$\n$N = \\text{行业数量 (11)}$\n\n那么经理选择 (M) 可以定义为：\n\n\n\n\n\n$M = P - B = \\\
  { \\sum\\limits\\_{i = 1}^{N}{w\\_{i}R_{i}}\\} - \\{\\sum\\limits\\_{i = 1}^{N}{W_{i}B_{i}}}$\
  \ (2.3)\n\n$M$ 也称为“Alpha”，可以通过代数方法进一步分解为三个子部分：\n\n* 分配 (A)：这是通过在每个行业中选择与指数不同的权重所增加的价值。其表达式式为：$\\\
  sum\\limits\\_{i = 1}^{N}{(w_{i} - W_{i})B_{i}}$\n* 选取 (S)：这是通过在每个行业内选择性地只挑选最好的股票所增加的价值。其表达式如下：$\\\
  sum\\limits\\_{i = 1}^{N}{W_{i}(R_{i} - B_{i})}$\n* 交互 (I)：这是通过分配和选择决策之间的相互作用所增加的价值。它有时被视为使分配和选择之和等于\
  \ $M$ 的累加效应。该金额通常是微不足道的，但在某些情况下可能是非常巨大的。它的定义为：${\\sum\\limits\\_{i = 1}^{N}{(w_{i}\
  \ - W_{i})(R_{i} - B_{i})}$。\n\n我们现在列出组合的数值业绩归因如下：\n\n$P = B + A + S + I$ (2.4)\n\
  \n### 程序 2.24：使用 `PROC PRINT` 生成组合业绩归因表\n\n```\n/*生成组合业绩归因报告*/\n%datapull(attrib,performance_attrib.sas7bdat);\n\
  \nproc print data=Performance_Attrib noobs label \n       style(header)={just=c\
  \ fontsize=1.8} style(data)={just=c fontsize=1.8}\n       style(grandtot)={just=c\
  \ fontweight=bold fontsize=1.8} grandtot_Label='Total';\n       title ' 业绩归因';\n\
  \       variables Sector/style(data)={just=l fontweight=bold width=1.8in};\n   \
  \    var BGWeights Returns Sector_P Index_Weights Index_Returns Sector_I Sector_T\n\
  \          Sector_Alpha  PAllocation  PSelection  PInteraction;\n       sum BGWeights\
  \ Index_Weights Sector_P Sector_I PAllocation PSelection Pinteraction;\n       footnote\
  \ H=0.5 '基准是罗素 3000 指数 | 行业偏斜 = 组合相对于指数对每个行业的超配（低配）\n                      | 行业\
  \ Alpha = 组合相对于指数对每个行业的表现优（表现差)';\nrun;\n\ntitle;\nfootnote;\n```\n\n使用 SAS 估计组合的业绩归因指标是通过一系列\
  \ `DATA` 步骤、`PROC SQL`、`PROC TABULATE` 和 `PROC PRINT` 语句。首先，使用 `PROC TABULATE` 获取组合的行业级业绩属性，并存储在输出文件\
  \ `DSTATSONE`（汇总属性）和 `DSTATSTWO`（加权平均属性）中。然后将这些数据集与基准属性数据集（`BENCHMARK_ATRRIB`）合并，并通过\
  \ `PROC SQL` 生成 `MERGEDSTATS` 数据集。业绩归因指标 $P$、$B$,$A$、$S$ 和 $I$ 使用 `DATA` 步骤计算，并保存在\
