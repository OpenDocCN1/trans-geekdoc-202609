  \ 3 章：财务和经济数据的可视化诊断\n\n## 财务数据显著属性的可视化诊断\n\n数据科学家在分析的探索阶段使用可视化分析数据并确定这些属性如何影响模型。这是因为大多数统计模型和机器学习算法都是基于对数据的某些假设（如正态性、随机采样和同方差性）训练的。如果数据中违反了这些假设，数据科学家必须在选择模型时权衡这些信息。因此，诊断性可视化的主要优势在于它们帮助数据科学家选择并正确配置模型。诊断性可视化还用于在发现阶段评估模型性能。\n\
  \n在本章中，我们将突出数据的一些统计属性以及在 SAS 中用于诊断的可视化选项。需要注意的是，尽管所介绍的主题基于成熟的计量经济和统计理论，但概念的数学表达超出了本书的范围。因此，数学结构和符号将谨慎使用，仅在需要时使用。\n\
  \n## 时间序列异常统计属性的处理\n\n由于财务数据的常见类型是时间序列格式，我们将通过分析时间序列变量 `Yt` 的统计属性开始讨论，该变量描述了数据科学家感兴趣的现实现象。`Yt`\
  \ 可以由以下特征的部分或全部组成：趋势组件、周期组件、季节组件和随机（随机）组件（即 `Yt = f(Tt, Ct, St, εt )`，其中 `Tt` 代表趋势组件，`Ct`\
  \ 代表周期组件，`St` 代表季节组件，`εt` 代表随机组件，其假设为平稳 `E(εt) = 0`）。\n\n```\nYt = Tt + Ct + St\
  \ + εt\n```\n(3.1)\n\n方程 `3.1` 是 `Yt` 的加法时间序列分解。然而，也可以观察到 `Yt` 的乘法时间序列分解，如下所示 `3.2`\
  \ 所示。\n\n```\nYt = Tt * Ct * St * εt\n```\n(3.2)\n\n从上述可以看出，仅趋势和随机组件的时间序列的行为与包含趋势、季节和随机组件的时间序列不同。在加法分解中，时间序列的每个观测值被假设为底层属性影响的线性累积，不随时间序列水平而变化。在乘法分解中，每个观测值被假设为底层属性影响的非线性累积，且这种影响随时间序列水平而变化。\n\
  \n\n\n\n\n## 趋势\n\n趋势是变量的长期变化（正向或负向）。它们可能是导致非永久性变化的确定性趋势，也可能是导致时间序列性质发生永久性变化的随机性趋势。它们也可能是混合趋势，即趋势与随机分部分的组合。在第一章中讨论的随机游走模型就是混合趋势模型的示例，它由一个趋势和一个随机部分组成。由于趋势与时间有关，如果不在数据中对其妥善处理，可能会导致模型错误地推导出虚假关系，这些关系基于每个变量的内在特征，而不是它们之间的实际关系。例如，模型可能会错误地指示两个以相同方向趋势变化的变量之间存在关系，尽管它们趋势产生可能不同。\n\
  \n趋势可以使用序列图进行可视化，在序列图中，变量的值绘制在垂直轴上，时间索引绘制在水平轴上。序列图中正斜或负斜率的存在表明存在趋势。请注意，变量也可能是趋势平稳的，在这种情况下，可视化将同时显示斜率和均值回归。\n\
  \n## PROC X13\n\nSAS 中的 `X13` 过程基于美国人口普查局的 `X-13ARIMA-SEATS` 季节调整程序。该过程具有广泛的时间序列建模和模型选择功能。其中一些包括带有\
  \ ARIMA 错误的线性回归模型（`regARIMA` 模型）、模型诊断、可视化、季节性调整和时间序列分解等。`X13` 过程是 `X11` 过程的增强，并与\
  \ `X12` 过程共享制作功能。`X11` 过程也是美国人口普查局 `X-11` 季节调整程序的适应，它对每月或每季度的时间序列进行季节性调整，并创建加法和乘法调整的时间序列。`X12`\
  \ 过程整合了根据加拿大统计局 `X-11-ARIMA` 程序和自动建模方法开发的季节调整程序。2\n\n程序 3.1：使用 `PROC X13` 和 `PROC\
  \ SGPLOT` 可视每月成交量的趋势和周期性\n\n```\n/*启用 ODS 图形以自动生成随附图表*/\nods graphics on;\nproc\
  \ x13 data=rspx_monthly  date=Date INTERVAL = month;\n      var volume;\n      transform\
  \ function=log;\n      arima model=( (0,1,1)(0,1,1) );/*带有指数平滑的 ARIMA*/\n      outlier\
  \ CV=3.6;\n      estimate;\n      x11;\n      output out=arspx_monthly a1 d1 d10\
  \ d12 d13 e18;\n\n      /* a1 =原始序列|d1=修改后的序列| d10=季节成分|\n      d12 = 趋势周期成分| d13\
  \ =不规则成分*/\nrun;\n\n/*使用 SGPLOT 绘制时间序列成分*/\nproc sgplot data=arspx_monthly;\n  \
  \    title 'S&P 500 成交量的时间序列成分 ';\n      series x=date y=volume_d13 / name=\"Volumeb\"\
  \ lineattrs=(color=aquamarine)\n      legendlabel= \" 不规则成分\";\n      series  x=date\
  \ y=volume_d10 / name=\"Volumea\" \n      lineattrs=(color=green) legendlabel= \"\
  \ 季节成分\";\n      series x=date y=volume_d12 /name=\"Volumec\" y2axis   lineattrs=(color=blue)\n\
  \      legendlabel= \" 趋势周期成分 \";\n      yaxis label='季节和不规则成分';\n      y2axis label='趋势周期成分';\n\
  \      keylegend \"Volumea\" \"Volumeb\" \"Volumec\" / across=3 noborder \nposition=bottomleft\
  \ \n      location=outside;\nrun;\ntitle;\n```\n\n |\n\n| ---\n\n在程序 3.1 中，我们使用\
  \ `X13` 过程提取标普 500 指数每月成交量的趋势周期成分。这些值连同成交量的季节成分和不规则成分一起，然后使用 `SGPLOT` 过程绘制在序列图中。`TRANSFORM`\
  \ 语句用于在估计 `ARIMA` 规范之前转换序列（将 `volume` 转换为对数量）。`ARIMA` 语句用于指定季节性和非季节自回归（`AR`）和移动平均（`MA`）成分。`OUTLIER`\
  \ 语句用于指定序列中离群值的临界值（`CV`）。`X11` 语句用于请求使用增强版本对序列进行季节调整。`OUTPUT` 语句用于请求创建数据集 `ARSPX_MONTHLY.SAS7BDAT`，它由原始序列（`A1`）、修改后的序列（`D1`）、季节成分（`D10`）、趋势周期成分（`D12`）、不规则成分（`D13`）和最终调整比例（`E18`）组成。`X13`\
  \ 过程生成大量数据、表格和图表。我们现在关注使用 `SGPLOT` 过程绘制与趋势相关的序列。输出 3.1 显示了标普指数时间序列成分的图。趋势周期成分用蓝色绘制，而季节成分和不规则成分分别用绿色和青色绘制。\n\
  \n输出 3.1：可视化标普 500 成交量的时间序列成分\n\n| ![image](img/Ch03_out_3-1.jpg) |\n\n| --- |\n\
  \n## 周期性\n\n周期变化是变量围绕趋势线发生的长期波动。由于如此，它们通常被描述为周期趋势。然而，它们与纯趋势成分的区别在于，它们会反复发生（尽管跨度很长），而纯趋势成分可能不会。发生的频率也不像季节性那样是预定的（我们将在以后重点介绍）。尽管它们主要出现在聚合财务和宏观经济数据（如行业销售额和国内生产总值）中，但强调它们很重要，因为它们影响了这些时间序列的行为，特别是当数据集包含十年或更长时间的数据时。序列中的周期性可以通过在序列图中将序列随时间绘制来可视化，如输出\
  \ 3.2 所示。\n\n## 处理趋势和周期性\n\n每种类型的趋势成分都需要特殊处理以从数据中移除该成分（如果这是所需）。随机趋势可以通过计算变量的一阶差来移除。确定性趋势可以通过对时间索引进行回归来移除。从回归得到的残差应该是平稳的。数据中的趋势和周期成分也可以使用\
  \ Hodrick-Prescott (1997) 滤波器（`HP filter`）进行分离，这是 `PROC EXPAND` 过程的一个选项。\n\n程序 3.2：使用\
  \ `PROC EXPAND` 调整数据中的趋势和周期性\n\n\n\n\n```\n/*Using HP Filter in PROC Expand*/\n\
  proc expand data=rspx_monthly out=frspx\n      method=none;\n      id date;\n  \
  \    convert volume=volume_t/transformout=(hp_t 14400);\n      /*HP Filter for Trend\
  \ component Lambda=14400*/\n      convert volume=volume_c/transformout=(hp_c 14400);\n\
  \      /*HP Filter for Cycle component lambda=14400*/\nrun;\n\n/*Plot Time Series\
  \ Component Using SGPLOT*/\nproc sgplot data=frspx;\n      title 'Trend and Cycle\
  \ Components of S&P 500 Trading Volume ';\n      series x=date y=volume_t/ name=\"\
  Volumed\" lineattrs=(color=black thickness=2)\n      legendlabel= \" Trend Component\"\
  ;\n      Series  x=date y=volume_c / name=\"Volumee\" \n      lineattrs=(color=green)\
  \ legendlabel= \" Cycle Component\";\n      series x=date y=volume /name=\"Volumef\"\
  \  lineattrs=(color=blue)\n      legendlabel= \"Volume \";\n      yaxis label='Trend\
  \ and Cycle Components';\n      keylegend \"Volumed\" \"Volumee\" \"Volumef\" /\
  \ across=3 noborder position=bottomleft\n      location=outside;\nrun;\ntitle;\n\
  ```\n\n## PROC EXPAND\n\n`EXPAND` 过程用于将时间序列数据从一种采样频率或间隔转换为另一种。它还可以插值缺失值、执行趋势和周期性时间序列分解，并实施广泛的数据变换，包括领先（lead）、滞后（lag）、差分、移动平均、移动求和以及移动积。该过程还可以生成变换后序列的若干\
  \ ODS 图形图。\n\n在程序 3.2 中，使用 `EXPAND` 过程执行了 Hodrick-Prescott 过滤器（HP 过滤器），以提取标普 500\
  \ 成交量序列的趋势和周期成分。`CONVERT` 语句用于请求创建两个新变量 `VOLUME_T`（成交量的趋势部分）和 `VOLUME_C`（成交量的周期部分）。`TRANSFORMOUT`\
  \ 选项用于请求 HP 过滤器方法，以从未调整的成交量序列中提取趋势和周期成分。\n\n输出 3.2 显示了提取出的趋势成分（黑色）和周期成分（绿色）图。未调整的成交量序列也绘制在同一张图中（黄色）。图中明显，成交量从\
  \ 20 世纪 90 年代中期到 2000 年初呈上升趋势。这一时期与互联网泡沫时代相吻。随后趋势线向下移动，并在该年代末出现急剧下降，这恰好发生在全球金融危机之后。\n\
  \n输出 3.2：标普 500 成交量的趋势与周期性\n\n![image](img/Ch03_out_3-2.jpg)\n\n图 3.1：美国零售销售数据的季节性\n\
  \n![image](img/Ch03_fig_3-1.jpg)\n\n## 季节性\n\n季节性变化是金融和经济数据的常见特征。它们是数据在每年同一期间发生的变化模式。这些变化可能是月度或季度的。例如，由于假日购物季，零售销售额通常在年的第四季度上升。天然气需求通常在一年中较冷的月份增加，在温暖的月份减少。你应该注意，这些是数据中重复且可预测的变化模式。从统计角度来看，季节性还意味着变量的当前值受时间因素的影响。从建模角度来看，它们是有问题的，因为如果不进行适当调整，它们可能会掩盖数据中的其他模式或趋势。时间序列数据的季节性也可以通过在序列图中绘制序列随时间的变化来可视化，如[图\
  \ 3.1](#CH03.xhtml#ch03fig1）所示，该图绘制了美国每月零售销售额（`MRTSAG`）。注意去年末零售销售额的激增是多么重复且可预测的。\n\
  \n## 处理季节性\n\n许多公开的宏观经济数据提供了使用 `X11`、`X12` 和 `X13` 方法进行季节性调整的数据版本。因此，你可能不需要对这些数据进行季节性调整。\n\
  \n\n\n\n\n```sas\n/* 使用 SGPLOT 显示销售数据中的季节性 */*/\nods graphics on;\n\nproc sgplot\
  \ data=adjtrade;\n    title '季节性调整后的美国零售销售额 ';\n    title2  '(百万美元)';\n    series\
  \ x=date y=mrtsag_d11/ name=\"salesa\" lineattrs=(color=blue) legendlabel= \" 季节性调整后的零售额\"\
  ;\n    series  x=date y=mrtsag_a1 / name=\"salesb\" \n            lineattrs=(color=Green)\
  \ legendlabel= \" 未调整的零售额\";\n    xaxis label = '日期' values=('01jan10'd to '01nov22'd\
  \ by month) valuesformat=monyy.;\n    yaxis label='美国零售额';\n    keylegend \"salesa\"\
  \ \"salesb\"/ across=3 noborder position=bottomleft location=outside;\nrun;\n\n\
  title;\nods graphics off;\n```\n\n在程序 3.4 中，我们使用 `SGPLOT` 过程来绘制从 `X13` 过程获得的未调整和季节性调整的序列。在输出\
  \ 3.4 中，注意与未调整的零售额（绿色）相比，季节性调整后的零售额（蓝色）在趋势线附近的波动较小。\n\n输出 3.4：季节性调整后的零售额数据\n\n|\
  \ ![image](img/Ch03_out_3-4.jpg) |\n| --- |\n\n### 自相关性\n\n自相关（序列相关）是数据的一种特征，其中变量在某一期间的观测值与过去期间的观测值相关。这也是金融和经济时间序列的另一个常见特征，即一个时期的误差与另一个时期的误差相关。误差项中出现的自相关主要由两个因素引起：\n\
  \n*   纯序列自相关，这是时间序列中滞后效应的产物（即某一期间的变量观测值保留了之前时期的信息）。\n*   模型设定不当，这可能是由于排除了变量或使用了不精确的函数形式对时间序列进行建模。\n\
  \n从统计学上讲，自相关会导致回归的标准误差产生偏差，从而导致 t 统计量不可靠，这使得这些统计量在假设检验中也是不可靠的。在假设检验并非首要的预测分析背景下，自相关具有重要影响。因为它们偏了误差项，损害了模型的极大似然估计（`MLE`），并影响了基于\
  \ `MLE` 方法的模型（如逻辑回归和神经网络模型）的整体性能。\n\n可以通过自相关函数图（自相关图、部分自相关图和反自相关图）对自相关可视化。在图中，指定滞后阶数的自相关系数是通过使用\
  \ `AUTOREG` 或 `ARIMA` 过程对变量进行回归设定得到的。然后将相关系数绘制在垂直轴上，对应时间滞后索引（在水平轴上）。\n\n用于测试自相关的常用统计方法是\
  \ Durbin-Watson (`DW`) 检验和白噪声 (`WN`) 。Durbin-Watson 是 `AUTOREG` 过程包含的一个选项，而白噪声检验是\
  \ `ARIMA` 过程中的一个选项。使用 `AUTOREG` 过程实现 `DW` 统计量和自相关可视化的代码如程序 3.5。在程序中，我们通过将成交量变量对其滞后（`NLAG=1`）回归，测试标普\
  \ 500 指数每月成交量的自相关性。`DW=1` 生成了多达一阶自相关的 Durbin-Watson 统计量。`DWPROB` 请求检验统计量的 p 值。7\n\
  \n程序 3.5：使用 `PROC AUTOREG` 实现自相关可视化\n\n```sas\n/* 使用 PROC AUTOREG 实现自相关可视化 */\n\
  ods graphics on;\nproc autoreg data=rspx;\n    model volume = lag(1) / dwstat=1\
  \ dwprob;\n    plot=all;\nrun;\nods graphics off;\n```\n\n| 输出 3.5A：季节性调整后的零售额数据\
  \ |\n| --- |\n| ![image](img/Ch03_out_3-4.jpg) |\n\n### 使用 PROC AUTOREG 可视化自相关\n\
  \n```sas\n/* 使用 PROC AUTOREG 实现自相关可视化 */（此处代码重复，保持一致）\nods graphics on;\nproc autoreg\
  \ data=rspx;\n    model volume = lag(1) / dwstat=1 dwprob;\n    plot=all;\nrun;\n\
  ods graphics off;\n```\n\n| 输出 3.5A：季节性调整后的零售额数据 |\n| --- |\n| ![image](img/Ch03_out_3-4.jpg)\
  \ |\n\n输出 3.5A 显示了 `AUTOREG` 过程的结果。`DW=1` 生成了多达一阶自相关的 Durbin-Watson 统计量。`DWPROB`\
  \ 请求检验统计量的 p 值。\n\n输出 3.5B：季节性调整后的零售额数据\n\n| ![image](img/Ch03_out_3-4.jpg) |\n\
  | --- |\n\n（注：根据指令要求，已对文中重复和冲突的部分进行了格式化和翻译）\n\n\n\n\n异方差可以通过两步过程进行视觉化诊断。首先，使用 `AUTOREG`\
  \ 或 `ARIMA` 过程获取变量回归规格的残差。然后，使用 `SGPLOT` 过程将残差绘制在垂直轴上，并将回归规格中的因变量或任何变量（时间序列中的时间索引）绘制在水平轴上。\n\
  \n`AUTOREG` 过程包含 `ARCHTEST` 选项，该选项可用于 Lagrange、`Q`、`Lee` 和 King (1993) 以及 Wong 和\
  \ Li (1995) 异方差检验。可视化和检验统计量的实现代码在 程序 3.6 所示。\n\n### 程序 3.6：公司债券指数收益率中的异方差可视化\n\n\
  | \n\n```sas\n/*Using PROC AUTOREG to Display Heteroscedasticity*/\n%datapull(bonds,corporate_bonds.sas7bdat);\n\
  ods graphics on;\n\nproc autoreg data= corporate_bonds (where=(date>'31dec12'd))\
  \ plots=all;\n    model raaap= / archtest=(qlm);          /*Q&LM-Test for Heteroscedasticity*/\n\
  \    model raaap= /  archtest=(wl,lk);/*wl-Wong and Li |LK - Lee and King*/\n  \
  \  output out=pred residual=resid    predicted=rhat;\nrun;\n\nquit;\n\nods graphics\
  \ off;\n```\n\n |\n\n| --- |\n\n在程序中，我们使用 `AUTOREG` 过程对 ICE BofA AAA 公司债券总收益指数的每日收益率进行异方差检验。`PLOTS=ALL`\
  \ 语句通过 ODS 调用了一组诊断图。这些图包括拟合优图、自相关图和离群值影响（Cook's D）。检验结果和调用该过程产生的 ODS 输出分别如 输出 3.6A\
  \ 和 3.6B 所示。从 `AUTOREG` 过程中请求的两个异方差检验获得的结果（显示在 输出 3.6A 中）表明，债券收益率序列中存在具有统计显著意义的异方差证据。输出\
  \ 3.6B 中包含的白噪声概率图也显示滞后 25 阶内存在具有统计显著意义的白噪声证据。此外，ACF 图（同样在 输出 3.6B 中）显示序列残差中存在强的一阶正自相关，这也暗示了异方差。\n\
  \n### 输出 3.6A：公司债券指数中的异方差\n\n| ![image](img/Ch03_out_3-6a.jpg) |\n\n| --- |\n\n\
  ### 输出 3.6B：公司债券指数中的异方差\n\n| ![image](img/Ch03_out_3-6b.jpg) |\n\n| --- |\n\n##\
  \ 处理自相关和异方差\n\n解决数据中自相关问题的两种直接方法是：在模型规格中定位并包含遗漏变量，或者使用正确的函数形式重新拟定模型。然而，在某些情况下，这些选项可能是不可行的。\n\
  \n另一种同时用于序列相关和异方差的方法是，在从模型中进行统计推断时，使用序列相关稳健标准误（有时称为异方差和自相关一致 [`HAC`] 标准误）。大多数统计包默认对线性和非线性模型提供此选项。\n\
  \n另一种方法是计算广义最小二法估计量，它在模型参数估计中考虑了残差差的信息；或者通过指定方差的函数形式计算加权最小二法（WLS）估计量。\n\n最后，对于时间序列数据，一种常用方法是通过广义自条件异方差（GARCH）规格指定指定误差项条件方差函数来对误差中的异方差进行建模。除了控制异方差外，该方法还允许数据科学家分析条件方差的行为并对其未来值进行预测。8\
  \ HAC 误差、广义最小二法以及使用 GARCH 规格对残差方差建模的选项可以在某些 SAS 过程（如 `AUTOREG` 和 `MODEL`）中找到。\n\n\
  在 程序 3.7 中，我们使用 `COVEST=NEWEYWEST` 语句请求 HAC 误差，并在 `AUTOREG` 过程中使用 `METHOD=YW` 请求\
  \ Yule-Walker (YW) 方法。YW 是一种广义最小二法估计量。我们还在模型中包含了一阶自回归滞后变量，因为我们在 ACF 图中观察到了一阶自相关。我们从执行该程序中获得的结果显示在\
  \ 输出 3.7 中。\n\n### 程序 3.7：使用 HAC 误差调整异方差 (PROC AUTOREG)\n\n| \n\n```sas\n/*Using\
  \ PROC AUTOREG to Display Heteroscedasticity*/\n%datapull(bonds,corporate_bonds.sas7bdat);\n\
  ods graphics on;\n\nproc autoreg data= corporate_bonds (where=(date>'31dec12'd))\
  \ plots=all;\n    model raaap= / archtest=(qlm);          /*Q&LM-Test for Heteroscedasticity*/\n\
  \    model raaap= /  archtest=(wl,lk);/*wl-Wong and Li |LK - Lee and King*/\n  \
  \  output out=pred residual=resid    predicted=rhat;\nrun;\n\nquit;\n\nods graphics\
  \ off;\n```\n\n |\n\n| --- |\n\n### 输出 3.7：使用 Yule-Walker 对收益率进行自回归建模\n\n| ![image](img/Ch03_out_3-7.jpg)\
  \ |\n\n| --- |\n\n在下一个示例中，我们使用简单的 GARCH 规格对残差方差进行建模。无条件方差项 σ² 被重新规格为条件方差过程，其中未来方差是当前方差和平方残差的函数，如公式\
  \ 3.3 所示。\n\n$\\begin{array}{l} {Y_{t} = \\mu + \\varepsilon_{t}\\text{~~~~~~~~~~~~~~~~~~~~~|~Mean~equation}}\
  \ \\\\ {\\left. \\sigma_{t + 1}^{2} = \\omega + \\alpha\\varepsilon_{t}^{2}\\text{+}\\\
  beta\\sigma_{t}^{2}\\text{~~~~~|}\\varepsilon_{t}\\ \\sim N(0,1)}} \\end{array}$\n\
  \n上述条件方差规格表明，当前方差受到过去时期遗留效应的影响。事实上，预计重大冲击或事件的影响会在数据上持续一段时间是合理的，特别是当数据以高频率（如每日或日内）采样时。\n\
  \n我们再次采用 `AUTOREG`，通过调用 GARCH 选项将债券指数收益率的无条件方差重新规格为 GARCH 过程。9 `P=1` 和 `Q=1` 分别请求平方误差项和条件方差项的一阶阶。还通过\
  \ `OUTPUT` 语句请求条件方差的预测。`HT=HT` 语句将 GARCH 预测保存到 `HT` 数据集中。然后使用 `SGPLOT` 过程将预测的条件方差绘制在序列图中。\n\
  \n### 程序 3.8A：使用 GARCH 模型调整异方差 (PROC AUTOREG)\n\n| \n\n```sas\n/*Using Modeling\
  \ Conditional Variances Using GARCH Specification*/\nods graphics on;\n\nproc autoreg\
  \ data=corporate_bonds (where=(date>'31dec12'd)) plots=all;\n    model raaap=/ nlag=1\
  \   /*AAA Bond Indices*/\n    garch=(p=1,q=1);\n    output out=pred residual=resid\
  \  ht=ht  predicted=rhat;\nrun;\n\nquit;\n\nods graphics off;\n```\n\n\n\n\n\n输出\
  \ 3.8A 显示了调用 `AUTOREG` 过程以及该过程中的 `GARCH` 语句获得的结果。`GARCH` 估计表显示了回归模型产生的典型模型诊断统计量，例如\
  \ `SSE` 和无条件方差等。`参数估计`表显示了模型均值分量（`intercept` 和 `AR1`）的系数以及模型的条件方差分量的系数。请注意，所有条件方差参数在统计学上都是显著的。这意味着过去的事件和过去的方差对未来方差具有重要影响。\n\
  \n输出 3.8A：AAA 公司债收益的条件自回归异方差模型\n\n| ![image](img/Ch03_out_3-8a.jpg) |\n\n| --- |\n\
  \n在程序 3.8B 中，我们使用 `SGPLOT` 过程绘制了公司债指数收益率的每月估计条件方差图表。我们使用 `SERIES` 语句请求了一个序列，指定将估计的条件方差（`HT`）绘制在垂直轴上，横轴对应于\
  \ `DATE` 变量。\n\n程序 3.8B：使用 `PROC SGPLOT` 绘制 AAA 公司债收益的条件方差\n\n| \n\n```\n/*Plotting\
  \ the conditional variance using SGPLOT Procedure*/\nproc sgplot data=pred;\n  \
  \    title 'Conditional Variance Plot ';\n      Series x=Date y=ht/;\n      Xaxis\
  \ label = 'Date';\n      yaxis label='Conditional Volatility';\nrun;\n\ntitle;\n\
  ods graphics off;\n```\n\n |\n\n| --- |\n\n输出 3.8B 显示了公司债指数收益条件方差的序列图。注意图表，在美国新冠肺炎爆发初期，债券指数收益率的条件波动率出现了显著上升。在随后的几个月里，波动率回到了历史水平，直到\
  \ 2022 年，在此期间你还会注意到由于美联储（Fed）货币政策立场的转变导致波动率略微增加。在那一年，美联储的货币政策立场从宽松性转变为限制性，以应对美国经济的高通胀趋势。2022\
  \ 年债券指数收益率波动率的显著增加部分是由于美联储为了配合其限制性货币政策而连续上调基准利率导致的。\n\n输出 3.8B：美国 AAA 公司债收益的条件自回归异方差\n\
  \n| ![image](img/Ch03_out_3-8b.jpg) |\n\n| --- |\n\n## 平稳性\n\n如果一个时间序列变量的统计特性（如均值、方差以及与过去值的协方差）不随时间变化（换句话说，对时间不敏感），则认为是平稳的。这意味着对变量的冲击是瞬时的，没有长期影响。从统计学角度来看，这一特征意味着同一变量的随机样本将产生相同的变量统计属性值。这种统计特征的优良性质解释了为什么大多数统计预测和机器学习算法都假设变量值的分布是平稳的。然而，许多金融和经济时间序列的原始形式并不是平稳的。10\
  \ 因此，它们在分析之前，需要使用特殊技术和变换进行预处理。平稳性可以使用序列图进行可视化，其中变量的值绘制在垂直轴上，时间索引绘制在水平轴上。\n\n图 3.3：美国\
  \ GDP 序列非平稳性的可视化\n\n![image](img/Ch03_fig_3-3.jpg)\n\n平稳时间序列将显示出均值回归。然而，并非所有的回归过程都是平稳的。回归可能围绕趋势发生。在这种情况下，该序列被描述为趋势平稳的。对于趋势平稳序列，如果移除趋势分量（通过差分）后其也不包含单位根过程，则将导致平稳性。单位根过程是非平稳的一种特殊情况，它不是由趋势分量引起的。它们由于过程中具有极高的持续性，以至于过程的扰动不会随时间的推移而消失。在数学上，单位根过程被描述为\
  \ 1 阶积分随机过程（即特征方程有一个根为 1 的一阶差分平稳过程），如等式 (3.4)中简单的 `AR(1)` 规范所示。\n\n`Y[t]=ϕ[0]+ϕ[1]Y[t − 1]+ε[t]`\
  \ | ε ∼ N(1, 0) | (3.4)\n\n当参数 `ϕ[0]` = 1 时，对过程的冲击不会随时间消失。事实上，对过程的扰动变成了过程的永久组成部分，从而使得过程在时间推移上是不稳定的。这种模式在图\
  \ 3.2 所示的美国实际国内总值（GDP）图中显而易见。注意 1990 年、2001 年 2008 年的衰退冲击似乎对序列产生了持久的影响。\n\n程序 3.9：使用\
  \ `PROC SGPLOT` 测试美国 GDP 序列的非平稳性\n\n```\n/*Plotting the conditional variance using\
  \ SGPLOT Procedure*/\nproc sgplot data=pred;\n      title 'Conditional Variance\
  \ Plot ';\n      Series x=Date y=ht/;\n      Xaxis label = 'Date';\n      yaxis\
  \ label='Conditional Volatility';\nrun;\n\ntitle;\nods graphics off;\n```\n（注：源提示中程序\
  \ 3.9 和 3.10 的提供的英文文本存在混合/不完整的情况，我将根据提示中的可用文本块进行重新格式化。）\n\n*基于所提供的源文本结构的修正：*\n程序\
  \ 3.9 和 3.10 的源文本在呈现上似乎是混乱的，但我将遵循所提供文本的内容流。\n\n仔细观察源文本，`proc sgplot` 的代码块被重复或放置在似乎用于程序\
  \ 3.9 的文本下方。我将格式化[content]中存在的内容。\n\n程序 3.9：使用 `PROC SGPLOT` 测试美国 GDP 序列的非平稳性\n\n\
  ```\n/*Plotting the conditional variance using SGPLOT Procedure*/\nproc sgplot data=pred;\n\
  \      title 'Conditional Variance Plot ';\n      Series x=Date y=ht/;\n      Xaxis\
  \ label = 'Date';\n      yaxis label='Conditional Volatility';\nrun;\n\ntitle;\n\
  ods graphics off;\n```\n\n### 平稳性统计检验\n\n常用于测试平稳性的统计检验包括增广迪基-富勒（ADF）检验和菲普-珀（PP）检验。这些检验以及更新的检验都是\
  \ `AUTOREG` 和 `ARIMA` 过程中的选项。在程序 3.9 中，调用了 `AUTOREG` 过程来检验实际 GDP 的平稳性。在模型中，为了统计方便，我们使用了对\
  \ GDP。`STATIONARITY(adf=3, pp=3)` 语句调用了最多三个自回归滞阶的 ADF 和 PP 检验。考虑到序列中所示的高水平持续性，这种规范是合理的。两种检验都估计了三种回归规范（零均值或随机游、带漂移的随机游以及带确定性趋势的随机游），并在等式\
  \ (3.5)中以一般形式所示。\n\n`Y[t]=ϕ[0]+ϕ[1]Y[t − 1]+δ[t]+γ[1]ΔY[t − 1]+⋯+γ[p]ΔY[t − p]+ε[t]`\
  \ | ε ∼ N(1, 0) | (3.5)\n\n输出 3.9 显示了我们在程序 3.10 中调用 `AUTOREG` 过程和 `STATIONARITY`\
  \ 语句获得的结果。根据菲普-珀（PP）检验和增广迪基-富勒（ADF）检验的结果，对于所有使用 ADF 和 PP 检验的种种回归规范，我们均未能拒绝实际 GDP\
  \ 过程中存在单位根的假设（使用统计量 `Rho`）和无趋势假设（使用统计量 `Tau`）。事实上，ADF 和 PP 检验的值表明实际 GDP 可能是趋势差分平稳的。\n\
  \n[/content (错误，此处应为 [/content] 结束标签)\n\n\n\n\n非平稳序列可以通过适当的数学操作（如差分和去趋势）通过变换转换为平稳序列。在处理非平稳数据时，可以使用\
  \ SAS 中的几种程序。其中包括 `ARIMA`、`AUTOREG`、`X13`、`TIMEDATA`、`EXPAND` 和 `TIMESERIES` 程序。`ARIMA`\
  \ 和 `X13` 程序可以根据 `MODEL` 语句中指定的差分阶自动生成差分数据。`TIMEDATA`、`TIMESERIES` 和 `EXPAND` 也可将时间序列数据转换为指定的差分阶。`ARIMA`\
  \ 过程在程序 3.10 中被用于自动生成对数实际 GDP 的一阶差分。随后使用 `ADF` 和 `PP` 检验对该序列再次进行单位根测试。\n\n###  程序\
  \ 3.10：调整美国 GDP 序列的非平稳性\n\n```\n/*Creating Stationary Series Using PROC ARIMA*/\n\
  ods graphics on;\n\nproc arima data=gdp\n      plots=all;\n      identify var=y(0,1,0)\
  \ scan stationarity=(pp=3);\n      identify var=y(0,1,0)scan stationarity=(adf=3);\n\
  run;\nquit;\nods graphics off;\n```\n\n#### 输出 3.10：美国 GDP 序列的平稳性\n\n| ![image](img/Ch03_out_3-10.jpg)\
  \ |\n| --- |\n| ![image](img/Ch03_Image15610.jpg) |\n\n输出 3.10 中所示统计量 `Rho` 和 `Tau`\
  \ 的 `p` 值进一步证实了 GDP 过程似乎是一个趋势平稳过程。所有三个规格的单位根和趋势效应的零假设均被拒绝。从随后的可视化所示，差分后的 GDP 序列现在看起来更加稳定，且没有了趋势影响。\n\
  \n## 非正态性\n\n正态分布的主要特征是对称性、渐近极限和连续单峰密度函数（一个峰值），其中均值、中位数众数相等。这些特征共同定义了正态分布著名的钟形形状。正态分布还有经验规则，规定\
  \ 68% 的观测值必须在均值的一个标准差范围内，95% 在均值的两个标准差范围内，大约 99.7% 在均值的三个标准差范围内。从统计学上说，正态分布的特征是两个矩函数：均值和标准差。其他矩函数偏度\
  \ `skewness` 和峰度 `kurtosis` 被假设为常数 0 和 3。因此，非正态性是对数据任何与上述描述属性不一致的统计特征的统称。这些包括：\n\
  \n*   肥尾（尖峰态）——`Kurtosis` 值大于 3，这意味着相对于正态分布，该变量有更多观测值聚集在分布的尾部。\n*   细尾（平峰态）——`Kurtosis`\
  \ 值小于 3，这意味着相对于正态分布的预期，有更多观测值更密聚集在分布的中心附近。\n*   非对称性（`Skewness ≠ 0`）——当 `skewness`\
  \ 不等于 0 时，意味着均值不等于中位数。因此，相对于另一侧，均值的一侧有观测值更多。负偏度 `skewness` 意味着更多观测值在均值上方（中位数大于均值），而正偏度\
  \ `skewness` 意味着更多观测值在均值下方（中位数小于均值）。\n\n可以使用 SAS 中的直方图、Q-Q 图、箱线图和累积分布 (CDF) 图对数据的分布属性进行视觉诊断。SAS\
  \ 中的许多统计程序包含诊断图，用于测试残差的正态性，在某些情况下测试程序输出中因变量的正态性。对于这些许多程序，可能需要按照如程序 3.10 所示使用 `ODS`\
  \ 选项进行调用。正态性统计检验是是 UNIVARIATE`、`CAPABILITY`、`REG` 和 `AUTOREG` 程序中的选项。\n\n### PROC\
  \ CAPABILITY\n\n`CAPABILITY` 程序主要为质量控制创建，但具有许多与数据诊断相关的功能，稍后我们将使用。该程序将过程输出的分布与该过程的规格限制进行比较。程序支持的诊断功能包括创建描述性统计、计算各种正态性检验、符号秩统计量和位数，以及创建\
  \ ODS 图（如直方图、P-P 图和 Q-Q 图）。\n\n在程序 3.11 所示的代码示例中，`CAPABILITY` 程序调用了 `NORMALTEST`\
  \ 选项对美国实际 GDP 的季度变化执行正态性检验。`PROC CAPABILITY` 语句还调用了该序列的 `Q-Q` 和 `P-P` 图。\n\n####\
  \ 程序 3.11：使用 PROC CAPABILITY 可视化美国 GDP 季度变化的非正态性\n\n```\n/*Assessing Normality in\
  \ Quarterly Changes in US Real GDP*/\nproc capability data=gdp normaltest;\n   \
  \   Var dy;\n      qqplot/ normal(mu=est color=blue);\n      ppplot / normal (mu=est\
  \ color=blue);\nrun;\n\ntitle;\n```\n\n#### 输出 3.11：美国 GDP 序列的非正态性\n\n输出 3.11 显示了执行程序\
  \ 3.11 代码获得的结果。注意，所有正态性检验都指示 GDP 序列不是正态分布。P-P 图和 Q-Q 图也支持这一结论。\n\n| ![image](img/Ch03_out_3-11.jpg)\
  \ |\n| --- |\n\n图 3.4：标普 500 指数收益的 2% 跳跃\n\n![image](img/Ch03_fig_3-4.jpg)\n\n###\
  \ 处理非正态性\n\n正态性（单变量或多变量）是一个非常理想的数据属性，因为它为数据科学家在可部署模型范围内提供了更大的灵活性。数据的正态性也是许多金融和经济理论模型的基础。因此，在处理非正态分布数据时，数据科学家应该考虑的首选是使用适当的数学函数（如对数）或数学操作（如差分）或统计程序（如缩尾处理）将非正态数据转换为正态分布。如果这些方法不可行，数据科学家应该考虑使用参数模型（如广义线性模型\
  \ `GLM`）或非参数模型（如广义加性模型 `GAM`），后者对序列没有正态性要求。12\n\n### 非正态数据的模型\n\n具有重大市场影响的事件以离散方式发生，这不是正态分布的特征。这类事件通常由有关宏观基本面重大变化的公告或重大地缘事件的发生触发。因此，它们在本质上通常是突发性的。\n\
  \n\n\n\n假设我们想要研究美国股市中这些重大市场影响事件发生的模式。我们将一个“重大市场事件”定义为：标普 500 指数的日水平出现至少 2%正向或负向波动（跳跃）的事件。此类波动是极罕见的事件；它们出现在大约\
  \ 7.5% 的交易日中，并倾向于聚集在特定的时期或事件周围，如图 3.4 所示。对这些现象发生率的一种建模方法是假设其发生率遵循泊松过程。泊松过程是一种随机过程，在金融领域中常用于分析具有离散到达时间且符合泊松分布的事件。该分布的独特之处在于它仅有一个参数\
  \ `λ`（lambda），即在机会窗口内发生的事件平均数量，在我们案例中，这个窗口是一个月。如果我们把一个月内跳跃幅度达到 2% 或以上的天数随机过程定义为泊松过程，就可以使用\
  \ `PROC GAM` 过程来检查美国股市这些极端事件的发生是否存在季节性。\n\n## PROC GAM\n\n`PROC GAM` 过程拟合一种灵活的广义相加模型形式，该模型可以实现因变量对回归变量向量的参数和非参数样条回归。模型为因变量指定了密度函数，并为回归变量向量指定了函数形式（链接函数），如方程\
  \ (3.6)所示。\n\n```\nG(*Y[*t*]) = β*[0] + f*1 + f*2 + ...f*n (3.6)\n```\n\n该函数形式可以是参数的、非参数的（SPLINE,\
  \ LOESS）、半参数的、加的和薄板样条。`PROC GAM` 的主要优势是它可以将各种子模型规范组合到一个模型中，这对于建模因变量与其协变量之间的线性和非线性关系非常有益。还可以从该过程中请求相加分量以及平滑组件置信度极限的\
  \ ODS 图形图表。13\n\n在程序 3.12 中，我们调用 `PROC GAM` 过程来估计标普 500 指数收益率中跳跃发生的月份依赖性。我们使用 `PLOTS`\
  \ 选项请求 CLM 图。`CLASS` 语句用于指定 `Month` 为分类变量。`MODEL` 语句指定了模型的参数函数形式，我们通过 `PARAM(MONTH)`\
  \ 选项进行指示。`OUTPUT` 语句用于请求将估计参数保存到 `EST_P` 数据集中。\n\n### 程序 3.12：使用 PROC GAM 对标普 500\
  \ 收益率中的跳跃季节性进行建模\n\n```sas\n/*Examining Jumps in S&P 500 Index Returns*/\n%datapull(jumps,jumps.sas7bdat);\n\
  \nproc gam data=jumps plots=components(clm);\n    class month;\n    model SPC=param(month)\
  \ / dist=Poisson;\n    output out=est p;\nrun;\n\nproc sort data=est;\n    by month;\n\
  run;\n\n/*Plot conditional Jumps Using SGPLOT*/\nproc sgplot data=est;\n    title\
  \ ' Days Per Month with 2% Jumps in the S&P 500 Index';\n    Scatter x=month_name\
  \ y=spc/ name=\"spca\" markerattrs=(color=Green) legendlabel= \" Actual Jumps\"\
  ;\n    Series x=month_name y=p_spc / name=\"spcb\" lineattrs=graphfit legendlabel=\
  \ \" Predicted Jumps\";\n    Xaxis label = 'Month';\n    Yaxis label='Number of\
  \ Days with Jumps';\n    keylegend \"spca\" \"spcb\"/ across=3 noborder position=bottomleft\
  \ location=outside;\nrun;\n```\n\n## 输出 3.12：标普 500 指数收益率中随时间变化的跳跃\n\n![image](img/Ch03_out_3-12.jpg)\
  \ |\n\n参数估计表中所示的结果表明，相对于 12 月的基准月，3 月、9 月和 10 月似乎是标普 500 极端价格波动最频繁的月份。使用 `SGPLOT`\
  \ 过程生成了每月跳跃预测图。它显示 3 月、9 月和 10 月的跳跃预测较高，这与 GAM 模型的估计结果一致。\n\n## 表 3.1：统计属性摘要\n\n\
