  \n# 第 15 章：数组操作\n\n#### 第 15.4 节：仅将某些数组键列入白名单\n\n当你希望数组中仅允许特定的键，特别是当数组来自请求参数时，你可以将\
  \ `array_intersect_key` 与 `array_flip` 结合使用。\n\n```\n$parameters = ['foo' => 'bar',\
  \ 'bar' => 'baz', 'boo' => 'bam'];\n$allowedKeys = ['foo', 'bar'];\n```\n\n![](img/Image00431.jpg)\n\
  ```\n$filteredParameters = array_intersect_key($parameters, array_flip($allowedKeys));\n\
  // $filteredParameters 包含 ['foo' => 'bar', 'bar' => 'baz']\n```\n\n如果 parameters\
  \ 变量不包含任何允许的键，则 filteredParameters 变量将由一个空数组组成。\n\n自 PHP 5.6 起，你也可以为此任务使用 [`array_filter`](http://php.net/manual/en/function.array-filter.php#refsect1-function.array-filter-changelog)，将\
  \ [`ARRAY_FILTER_USE_KEY`](http://php.net/manual/en/array.constants.php#constant.array-filter-use-key)\
  \ 标志作为第三个参数传递：\n\n![](img/Image00432.jpg)\n\n| `array_intersect_key` | | () 结合 |\
  \ | `array_flip` |\n| --- | --- | --- | --- | --- |\n\n使用 `array_filter` 可以额外灵活地对键执行任意测试，例如\
  \ `$allowedKeys` 可以包含正则表达式模式，而不仅仅是纯字符串。与 `array_intersect_key` 结合 `array_flip` 相比，它也更明确地表达了代码的意图。\n\
  \n#### 第 15.5 节：向数组开头添加元素\n\n| [`array_unshift`](http://php.net/array_unshift) |\n\
  | --- |\n\n有时你想向数组开头添加一个元素，而不修改数组中当前元素的（顺序）。每当这种情况发生时，你可以使用 [`array_unshift`](http://php.net/array_unshift)。\n\
  \n`array_unshift` 将传入的元素**作为一个整体**预置到数组的前面。注意元素列表是\n\n| `array_unshift` |\n| ---\
  \ |\n\n![](img/Image00433.jpg) 作为一个整体被预置，因此预置的元素保持相同的顺序。所有数字键名将被修改为从零开始计数，而字面量键名不会被改动。\n\
  \n| `array_unshift` |\n| --- |\n\n摘自 [`array_unshift` 的 PHP 文档](http://php.net/array_unshift#refsect1-function.array-unshift-description)。\n\
  \n如果你想实现这一点，只需执行以下操作：\n\n![](img/Image00434.jpg)\n\n这将把 4 作为第一个元素添加到你的数组中。你可以通过以下方式验证：\n\
  \n![](img/Image00435.jpg)\n\n| n + 1 |\n| --- |\n\n由于 `array_unshift` 强制数组重置键值对，因为新元素导致后续条目拥有这些键，因此创建一个新数组并将现有数组追加到新创建的数组中会更明智。\n\
  \n示例：\n\n![](img/Image00436.jpg)\n\n输出 ($joinedArray)：\n\n![](img/Image00437.jpg)\n\
  ```\nArray\n(\n    [0] => oranges\n    [1] => apples\n    [2] => bananas\n    [3]\
  \ => pears\n)\n```\n\n[示例/演示](http://www.tehplayground.com/#egwNCrZgr)\n\n#### 第\
  \ 15.6 节：交换键与值\n\n`array_flip` 函数将交换所有键及其对应的元素。\n\n![](img/Image00438.jpg)\n\n####\
  \ 第 15.7 节：将两个数组合并为一个数组\n\n![](img/Image00439.jpg)\n\n关联数组：\n\n![](img/Image00440.jpg)\n\
  \n1. 将一个或多个数组的元素合并在一起，以便一个数组的值被追加到前一个数组的末尾。它返回生成的数组。\n2. 如果输入数组具有相同的字符串键名，则该键名稍后的值将覆盖前一个值。但是，如果数组包含数字键名，则稍后的值不会覆盖原始值，而是会被追加。\n\
  3. 输入数组中具有数字键名的值将在结果数组中重新编号，从零开始递增。\n\n## 第 16 章：同时处理多个数组\n\n#### 第 16.1 节：数组交集\n\
  \n`array_intersect` 函数将返回一个数组，包含所有传递给该函数的数组中都存在的值。\n\n![](img/Image00441.jpg)\n\n\
  数组键名得以保留。原始数组的索引则不保留。\n\n`array_intersect` 仅检查数组的值。`array_intersect_assoc` 函数将返回带有键名的数组交集。\n\
  \n```\n$array_one = [1 => 'one', 2 => 'two', 3 => 'three'];\n$array_two = [1 =>\
  \ 'one', 2 => 'two', 3 => 'two', 4 => 'three'];\n$array_three = [1 => 'one', 2 =>\
  \ 'two'];\n```\n\n![](img/Image00442.jpg)\n```\n$intersect = array_intersect_assoc($array_one,\
  \ $array_two, $array_three);\n// $intersect 包含 [1 => 'one', 2 => 'two']\n```\n\n\
  `array_intersect_key` 函数仅检查键名的交集。它将返回在所有数组中都存在的键名。\n\n![](img/Image00443.jpg)\n\n\
