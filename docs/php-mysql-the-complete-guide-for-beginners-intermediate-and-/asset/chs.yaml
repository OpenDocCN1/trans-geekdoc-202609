  \n## 第 45 章：类型提示\n\n#### 第 45.1 节：类和接口的类型提示\n\nPHP 5 中新增了对类和接口的类型提示支持。\n\n#####\
  \ 类类型提示\n\n![](img/Image01025.jpg)\n\n上述脚本输出：\n\n![](img/Image01026.jpg) Chris is\
  \ being enrolled at University of Edinburgh\n\n##### 接口类型提示\n\n![](img/Image01027.jpg)\n\
  \n![](img/Image01028.jpg)\n\n上例输出与之前相同：\n\n![](img/Image01029.jpg) Chris is being\
  \ enrolled at University of Edinburgh\n\n##### Self 类型提示\n\n`self` 关键字可用作类型提示，表明该值必须是声明该方法的类的实例。\n\
  \n#### 第 45.2 节：标量类型、数组和可调用类型的类型提示\n\nPHP 5.1 中新增了对数组参数（PHP 7.1 后支持返回值）的类型提示支持，使用关键字\
  \ `array`。任何维度和类型的数组，以及空数组，均为有效值。\n\n```\nis_callable(array(class_name|object, method_name))\n\
  ```\n\nPHP 5.4 中新增了对可调用类型的类型提示支持。凡是 `is_callable()` 返回 true 的值，均可用于参数和返回值提示为 `callable`\
  \ 的情况，即闭包对象、函数名字符串和数组。\n\n如果函数名出现拼写错误导致其不再 `is_callable()`，将显示一个不太明显的错误消息：\n\n![](img/Image01030.jpg)\n\
  \n非静态方法也可以以静态格式作为可调用类型传递，在 PHP 7 和 PHP 5 中分别会导致弃用警告和 `E_STRICT` 级别错误。\n\n方法可见性会被考虑在内。如果带有可调用参数的方法的上下文无法访问提供的可调用对象，最终结果将如同该方法不存在一般。\n\
  \n![](img/Image01031.jpg)\n\n![](img/Image01032.jpg)\n\n输出：\n\n![](img/Image01033.jpg)\
  \ Fatal error: Uncaught TypeError: Argument 1 passed to r() must be callable, array\
  \ given\n\nPHP 7 中新增了对标量类型的类型提示支持。这意味着我们获得了对 `int`、`float`、`string` 和 `bool` 的类型提示支持。\n\
  \n默认情况下，PHP 会尝试将提供的任何参数转换为匹配其类型提示的类型。将调用改为 `add(1.5)` 会产生完全相同的输出，因为 PHP 将 float\
  \ `1.5` 转换为了 `int`。\n\n```\ndeclare(strict_types=1);\n```\n\n要禁止此行为，必须在每个需要严格模式的\
  \ PHP 源文件顶部添加 `declare(strict_types=1);`。\n\n![](img/Image01035.jpg)\n\n上述脚本现在会产生致命错误：\n\
  \n![](img/Image01036.jpg) Fatal error: Uncaught TypeError: Argument 1 passed to\
  \ add() must be of the type integer, float given\n\n##### 例外：特殊类型\n\n某些 PHP 函数可能会返回\
  \ `resource` 类型的值。由于这不是标量类型，而是特殊类型，因此无法对其进行类型提示。\n\n`curl_init()` 会返回 `resource`，`fopen()`\
  \ 也是。当然，这两种资源彼此不兼容。因此，当显式对 `resource` 进行类型提示时，PHP 7 将始终抛出以下 TypeError：\n\n![](img/Image01037.jpg)\
  \ TypeError: Argument 1 passed to sample() must be an instance of resource, resource\
  \ given\n\n#### 第 45.3 节：可空类型提示\n\n##### 参数\n\nPHP 7.1 中新增了可空类型提示，在类型提示前使用 `?` 运算符。\n\
  \n![](img/Image01038.jpg)\n\nPHP 7.1 之前，如果参数有类型提示，必须声明默认值 `null` 才能接受 null 值。\n\n\
  ![](img/Image01039.jpg)\n\n##### 返回值\n\nPHP 7.0 中，带有返回类型的函数不能返回 `null`。\n\nPHP 7.1\
  \ 中，函数可以声明可空返回类型提示。不过，函数仍必须返回 `null`，而不能是 void（无/空返回语句）。\n\n![](img/Image01040.jpg)\n\
  \n#### 第 45.4 节：泛型对象的类型提示\n\n由于 PHP 对象不继承自任何基类（包括 `stdClass`），因此不支持对泛型对象类型进行类型提示。\n\
  \n例如，下面的代码将无法工作。\n\n![](img/Image01041.jpg)\n\n并会抛出致命错误：\n\n![](img/Image01042.jpg)\
  \ Fatal error: Uncaught TypeError: Argument 1 passed to doSomething() must be an\
  \ instance of object, instance of OperationOne given\n\n一种变通方法是声明一个不定义任何方法的退化接口，并让所有对象实现该接口。\n\
  \n![](img/Image01043.jpg)\n\n#### 第 45.5 节：无返回值类型提示\n\nPHP 7.1 中新增了 `void` 返回类型。虽然\
  \ PHP 没有实际的 void 值，但在编程语言中普遍认为返回 nothing 的函数返回的是 `void`。这不应与返回 `null` 混淆，因为 `null`\
  \ 是一个可以返回的值。\n\n![](img/Image01044.jpg)\n\n注意，如果你声明了 `void` 返回类型，就不能返回任何值，否则会报致命错误：\n\
  \n![](img/Image01045.jpg)\n\n不过，使用 `return` 退出函数是有效的：\n\n![](img/Image01046.jpg)\n\
  \n## 第 46 章：过滤器与过滤器函数\n\n##### 参数详情\n\n| 参数 | 详情 |\n| --- | --- |\n| `variable`\
  \ | 要过滤的值。注意标量值在内部过滤前会被转换为字符串。 |\n\n\n\n\n# PHP Filter 扩展\n\n| 参数 | 说明 |\n| :---\
  \ | :--- |\n| `filter` | 要应用的过滤器 ID。过滤器类型手册页列出了可用的过滤器。如果省略，将使用 `FILTER_DEFAULT`，这等同于\
  \ `FILTER_UNSAFE_RAW`。这将导致默认情况下不进行任何过滤。 |\n| `options` | 选项的关联数组或标志的按位析取。如果过滤器接受选项，标志可以在数组的\
  \ \"flags\" 字段中提供。对于 \"callback\" 过滤器，应传递 callable 类型。回调必须接受一个参数（要过滤的值），并返回过滤/净化后的值。\
  \ |\n\n此扩展通过验证或净化来过滤数据。当数据源包含未知（或外部）数据（如用户提供的输入）时，这非常有用。例如，这些数据可能来自 HTML 表单。\n\n\
  #### 第 46.1 节：验证布尔值\n\n```php\nvar_dump(filter_var(true, FILTER_VALIDATE_BOOLEAN,\
  \ FILTER_NULL_ON_FAILURE)); // true\nvar_dump(filter_var(false, FILTER_VALIDATE_BOOLEAN,\
  \ FILTER_NULL_ON_FAILURE)); // false\nvar_dump(filter_var(1, FILTER_VALIDATE_BOOLEAN,\
  \ FILTER_NULL_ON_FAILURE)); // true\nvar_dump(filter_var(0, FILTER_VALIDATE_BOOLEAN,\
  \ FILTER_NULL_ON_FAILURE)); // false\nvar_dump(filter_var('1', FILTER_VALIDATE_BOOLEAN,\
  \ FILTER_NULL_ON_FAILURE)); // true\nvar_dump(filter_var('0', FILTER_VALIDATE_BOOLEAN,\
