  \n也许有一天我会把它们都加上。或者有人可以编辑并在下面添加好的解释？暗示，暗示 ;) 对于下面所有的解释，假设 URL 为 [`www.example.com/index.php`](http://www.example.com/index.php)\n\
  \n##### HTTP_HOST \\- 主机地址。\n\n```\nwww.example.com\n```\n\n这将返回\n\n```\n93.184.216.34\n\
  ```\n\n##### SCRIPT_NAME \\- 当前脚本的路径。\n\n```\n/index.php\n```\n\n\n\n# PHP 超全局变量\n\
  \n##### HTTP_USER_AGENT\n用户代理的内容。这是一个字符串，包含关于客户端浏览器的所有信息，包括操作系统。\n\n##### HTTP_COOKIE\n\
  所有 Cookie 连接成的一个字符串，以分号作为分隔符。\n\n##### SERVER_ADDR\n当前脚本运行所在服务器的 IP 地址。\n\n#####\
  \ PHP_SELF\n当前执行脚本的文件名，相对于文档根目录。\n\n这将返回 `/`\n\n##### REQUEST_TIME_FLOAT\n请求开始的时间戳，具有微秒精度。自\
  \ PHP 5.4.0 起可用。\n\n##### REQUEST_TIME\n请求开始的时间戳。自 PHP 5.1.0 起可用。\n\n##### $_GET\n\
  ![](img/Image00097.jpg)\n\n一个关联数组，包含通过 URL 参数传递给当前脚本的变量。\n\n`$_GET` 是一个包含所有 URL\
  \ 参数的数组；这些就是 URL 中 `?` 后面的任何内容。\n\n| `$_GET` | `[]` | `\"myVar\"` |\n| --- | ---\
  \ | --- |\n\n以 [`www.example.com/index.php?myVar=myVal`](http://www.example.com/index.php?myVar=myVal)\
  \ 为例。可以通过按此格式 `]` 访问来获取该 URL 中的信息，结果将是 `myVal`。\n\n给不喜欢阅读文字的人看点代码。\n\n```php\n//\
  \ URL = http://www.example.com/index.php?myVar=myVal\necho $_GET[\"myVar\"] == \"\
  myVal\" ? \"true\" : \"false\"; // 返回 \"true\"\n```\n\n上面的例子使用了三元运算符。\n\n这展示了如何使用\
  \ `$_GET` 超全局变量访问 URL 中的值。\n\n再来一个例子！\n\n![](img/Image00099.jpg)\n\n可以通过用 `&` 字符分隔，在\
  \ URL 中发送多个变量。\n\n##### 安全风险\n**非常重要**：不要通过 URL 发送任何敏感信息，因为它会保留在计算机的历史记录中，任何能访问该浏览器的人都能看到。\n\
  \n##### $_POST\n![](img/Image00100.jpg)\n\n一个关联数组，包含通过 HTTP POST 方法传递给当前脚本的变量，前提是请求中的\
  \ HTTP Content-Type 为 `application/x-www-form-urlencoded` 或 `multipart/form-data`。\n\
  \n与 `$_GET` 非常相似，都是将数据从一处发送到另一处。\n\n我将直接从一个例子开始。（我省略了 `action` 属性，因为这会将信息发送到包含该表单的页面）。\n\
  \n![](img/Image00101.jpg)\n\n以上是一个用于发送数据的基本表单。在真实环境中，`value` 属性不会被设置，这意味着表单将是空白的。然后它会发送用户输入的任何信息。\n\
  \n![](img/Image00102.jpg)\n\n##### 安全风险\n通过 POST 发送数据也不安全。使用 HTTPS 将确保数据更安全。\n\n\
  ##### $_FILES\n![](img/Image00103.jpg)\n\n一个关联数组，包含通过 HTTP POST 方法上传到当前脚本的项目。该数组的结构在\
  \ [POST 方法上传](http://php.net/manual/en/features.file-upload.post-method.php) 章节中有概述。\n\
  \n让我们从一个基本表单开始。\n\n![](img/Image00104.jpg)\n\n| `enctype` | `=` | `\"multipart/form-data\"\
  ` |\n| --- | --- | --- |\n\n注意我省略了 `action` 属性（又是！）。另外，我添加了 `enctype`，这对任何处理文件上传的表单都很重要。\n\
  \n![](img/Image00105.jpg)\n\n这用于上传单个文件。有时你可能想上传多个文件。为此有一个属性，叫做 `multiple`。\n\n几乎任何东西都有属性。[抱歉了](https://www.youtube.com/watch?v=szrsfeyLzyg)\
  \ 下面是一个提交多个文件的表单示例。\n\n![](img/Image00106.jpg)\n\n注意这里的更改；只有几处。\n\n![](img/Image00107.jpg)\n\
  \n输入名称带有方括号。这是因为它现在是一个文件数组，所以我们告诉表单：\n\n| `$_FILES` | `[]` | `\"myVar\"` |\n| ---\
  \ | --- | --- |\n\n创建所选文件的数组。省略方括号将导致最后一个文件被设置为 `]`。\n\n![](img/Image00108.jpg)\n\
  \n这是一个非常简单的例子，不处理诸如不允许的文件扩展名或以 PHP 代码命名的文件（如 SQL 注入的 PHP 等价物）等问题。请参阅文档。\n\n第一步是检查是否有文件，如果有，将总数设置为\
  \ `$total`。\n\n使用 `for` 循环可以遍历 `$_FILES` 数组并一次访问每一项。如果该文件没有遇到问题，则 `if` 语句为真，并运行单文件上传的代码。\n\
  \n如果遇到问题，则执行 `switch` 块，并根据该特定上传的错误显示错误信息。\n\n##### $_COOKIE\n![](img/Image00109.jpg)\n\
  \n一个关联数组，包含通过 HTTP Cookie 传递给当前脚本的变量。\n\nCookie 是包含数据并存储在客户端计算机上的变量。\n\n与前述超全局变量不同，Cookie\
  \ 必须通过函数创建（而不是通过赋值）。约定如下。\n\n![](img/Image00110.jpg)\n\n在本例中，为 Cookie 指定了一个名称（本例中为\
  \ `\"myVar\"`），一个值（本例中为 `\"myVal\"`，但也可以传递一个变量将其值赋给 Cookie），以及一个过期时间（本例中为一小时，因为\
  \ 3600 秒是一分钟——*原文此处有误，3600 秒为一小时*）。\n\n尽管创建 Cookie 的约定不同，但访问方式与其他超全局变量相同。\n\n![](img/Image00111.jpg)\n\
  \n要销毁 Cookie，必须再次调用 `setcookie`，但将过期时间设为过去的任意时间。见下文。\n\n![](img/Image00112.jpg)\n\
  \n这将取消设置 Cookie 并将其从客户端计算机上移除。\n\n##### $_SESSION\n![](img/Image00113.jpg)\n\n一个包含当前脚本可用会话变量的关联数组。有关如何使用的更多信息，请参阅\
  \ [会话函数](http://php.net/manual/en/ref.session.php) 文档。\n\n会话非常像 Cookie，只不过它们是服务端的。\n\
  \n| `session_start()` |\n| --- |\n\n要使用会话，必须在脚本顶部包含 `session_start()` 以启用会话功能。\n\
  \n设置会话变量与设置其他变量相同。见下例。\n\n![](img/Image00114.jpg)\n\n| `session_id()` |\n| --- |\n\
  \n启动会话时，会设置一个随机 ID 作为 Cookie，名为 `\"PHPSESSID\"`，包含当前会话的会话 ID。可以通过调用 `session_id()`\
  \ 函数访问它。\n\n| `unset()` | `$_SESSION` | `[]` | `\"myVar\"` |\n| --- | --- | ---\
  \ | --- |\n\n可以使用 `unset()` 函数销毁会话变量（例如 `unset($_SESSION[\"myVar\"])` 将销毁该变量）。\n\
  \n| `session_destroy()` |\n| --- |\n\n另一种方法是调用 `session_destroy()`。这将销毁整个会话，意味着所有会话变量将不复存在。\n\
  \n##### $_REQUEST\n![](img/Image00115.jpg)\n\n一个关联数组，默认包含 [`$_GET`](http://php.net/manual/en/reserved.variables.get.php)、[`$_POST`](http://php.net/manual/en/reserved.variables.post.php)\
  \ 和 [`$_COOKIE`](http://php.net/manual/en/reserved.variables.cookies.php) 的内容。\n\
  \n正如 PHP 文档所述，这只是将 `$_GET`、`$_POST` 和 `$_COOKIE` 汇总在一个变量中。\n\n| `php.ini` |\n| ---\
  \ |\n\n由于这三个数组都可能拥有相同名称的索引，`php.ini` 文件中有一个名为 `request_order` 的设置，可以指定三者中的优先顺序。\n\
  \n例如，如果设置为 `\"GPC\"`，则将使用 `$_COOKIE` 的值，因为它是从左到右读取的，意味着 `$_REQUEST` 会先将其值设为 `$_GET`，然后是\
  \ `$_POST`，最后是 `$_COOKIE`，既然 `$_COOKIE` 在最后，那么 `$_REQUEST` 中的值就是 `$_COOKIE` 的值。见\
  \ [此问题](http://stackoverflow.com/questions/43157933/what-is-the-request-precedence)。\n\
  \n##### $_ENV\n![](img/Image00116.jpg)\n\n一个关联数组，包含通过环境变量方法传递给当前脚本的变量。\n\n\n\n\n\
  这些变量是从运行 PHP 解析器的环境导入到 PHP 的全局命名空间中的。许多变量由运行 PHP 的 Shell 提供，不同的系统可能运行不同种类的 Shell，因此无法提供一份确定的列表。请参阅您的\
  \ Shell 文档以获取已定义环境变量的列表。\n\n其他环境变量包括 CGI 变量，无论 PHP 是作为服务器模块还是 CGI 处理器运行，这些变量都会被放置在那里。\n\
  \n`$_ENV` 中存储的任何内容都来自 PHP 运行所在的环境。\n\n| php | | . | ini |\n| --- | --- | --- | ---\
  \ |\n\n只有当 `variables_order` 允许时，`$_ENV` 才会被填充。\n\n请参阅 [此回答](http://stackoverflow.com/questions/3780866/why-is-my-env-empty/27077452#27077452)\
  \ 以获取更多关于为什么 `$_ENV` 未被填充的信息。\n\n#### 第 4.2 节：PHP5 超全局变量\n\n以下是 PHP5 超全局变量\n\n`$GLOBALS`\n\
  \n`$_REQUEST`\n\n`$_GET`\n\n`$_POST`\n\n`$_FILES`\n\n`$_SERVER`\n\n`$_ENV`\n\n`$_COOKIE`\n\
  \n`$_SESSION`\n\n`$GLOBALS`：此超全局变量用于访问全局变量。\n\n`$_REQUEST`：此超全局变量用于收集通过 HTML 表单提交的数据。\n\
  \n`$_GET`：此超全局变量用于收集通过带有 get 方法的 HTML 表单提交的数据。\n\n`$_POST`：此超全局变量用于收集通过带有 post 方法的\
  \ HTML 表单提交的数据。\n\n`$_FILES`：此超全局变量保存通过 HTTP Post 方法上传的文件信息。\n\n`$_SERVER`：此超全局变量保存关于脚本、HTTP\
  \ 头部和服务器路径的信息。\n\n`$_ENV`：此超全局变量保存 PHP 运行所在的 Shell 环境变量详情。\n\n`$_COOKIE`：此超全局变量用于通过给定的键检索\
  \ Cookie 值。\n\n`$_SESSION`：此超全局变量用于设置和检索存储在服务器上的会话值。\n\n## 第 5 章：输出变量的值\n\n要构建动态且交互式的\
  \ PHP 程序，输出变量及其值非常有用。PHP 语言允许多种值输出方法。本主题涵盖在 PHP 中打印值的标准方法以及这些方法可以使用的场景。\n\n####\
  \ 第 5.1 节：echo 和 print\n\n| echo | | ( | \"test\" |\n| --- | --- | --- | --- |\n\
  \n[echo](http://php.net/manual/en/function.echo.php) 和 [print](http://php.net/manual/en/function.print.php)\
  \ 是语言结构，而非函数。这意味着它们不像函数那样要求参数周围必须有括号（尽管可以给几乎任何 PHP 表达式加上括号，因此 `echo(\"test\")` 也不会造成任何伤害）。它们输出变量、常量或表达式的字符串表示形式。它们不能用于打印数组或对象。\n\
  \n##### echo 的简写语法\n\n当在 [PHP 标签之外](http://php.net/manual/en/language.basic-syntax.phpmode.php)\
  \ 时，默认可用 echo 的简写语法，使用 `<?=` 开始输出，`?>` 结束。例如：\n\n```\n<?= \"Hello World\" ?>\n```\n\
  \n注意没有终止的 `;`。之所以有效，是因为结束 PHP 标签充当了单条语句的终止符。因此，按照惯例，在这种简写语法中省略分号。\n\n##### print\
  \ 的优先级\n\n虽然 print 是语言结构，但它具有像运算符一样的优先级。它位于 `=`、`+=`、`-=`、`*=`、`**=`、`/=`、`.=`、`%=`、`&=`\
  \ 和 `and` 运算符之间，并具有左结合性。示例：\n\n```\nprint \"hello \" . print \"world\";\n```\n\n\
  带括号的相同示例：\n```\nprint \"hello \" . (print \"world\");\n```\n```\necho '1' . print\
  \ ( '2' + 3); //输出 511\n```\n\n##### echo 和 print 的区别\n\n简而言之，主要有两个区别：\n\n*   `print`\
  \ 只接受一个参数，而 `echo` 可以有多个参数。\n*   `print` 返回一个值，因此可以作为表达式使用。\n\n#### 第 5.2 节：输出数组和对象的结构化视图\n\
  \n| [print_r](http://php.net/manual/en/function.print-r.php) |\n| --- |\n\n`print_r()`\
  \ - 为调试输出数组和对象\n\n[print_r](http://php.net/manual/en/function.print-r.php) 将以人类可读的格式输出数组或对象。\n\
  \n您可能有一个是数组或对象的变量。尝试用 echo 输出它会抛出错误：\n\n| Notice | | : | | Array to string conversion\
  \ |\n| --- | --- | --- | --- | --- |\n\n。您可以改用 `print_r` 函数来转储该变量的人类可读格式。\n\n```\n\
  $myarray = array('a', 'b', 'c');\nprint_r($myarray);\n```\n\n```\nArray\n(\n   \
  \ [0] => a\n    [1] => b\n    [2] => c\n)\n```\n\n```\n$myobj = new stdClass();\n\
  $myobj->foo = 'bar';\nprint_r($myobj);\n```\n\n```\nstdClass Object\n(\n    [foo]\
  \ => bar\n)\n```\n\n此外，`print_r` 的输出可以作为字符串捕获，而不仅仅是直接输出。例如，以下代码会将 `$myarray` 的格式化版本转储到一个新变量中：\n\
  \n```\n$output = print_r($myarray, true);\n```\n\n请注意，如果您在浏览器中查看 PHP 的输出，且其被解释为\
  \ HTML，则换行符将不会显示，输出将难以阅读，除非您执行类似以下的操作：\n\n```\necho '<pre>' . print_r($myarray,\
  \ true) . '</pre>';\n```\n\n或者，您可以告诉浏览器您输出的是纯文本，而非 HTML：\n\n```\nheader('Content-Type:\
  \ text/plain');\nprint_r($myarray);\n```\n\n| [var_dump](http://php.net/manual/en/function.var-dump.php)\
  \ |\n| --- |\n\n`var_dump()` - 输出关于参数内容的可读调试信息，包括其类型和值\n\n输出比 `print_r` 更详细，因为它还会输出变量的类型及其值，以及其他信息，如对象\
  \ ID、数组大小、字符串长度、引用标记等。\n\n您可以使用 `var_dump` 为调试输出更详细的版本。\n\n```\n$myarray = array('a',\
  \ 'b', 'c');\nvar_dump($myarray);\n```\n\n输出更详细：\n\n```\narray(3) {\n  [0]=>\n \
  \ string(1) \"a\"\n  [1]=>\n  string(1) \"b\"\n  [2]=>\n  string(1) \"c\"\n}\n```\n\
  \n注意：如果您在开发环境中使用 xDebug，`var_dump` 的输出默认会被限制/截断。请参阅 [官方文档](https://xdebug.org/docs/display)\
  \ 了解更多关于更改此选项的信息。\n\n| [var_export](http://php.net/manual/en/function.var-export.php)\
  \ |\n| --- |\n\n`var_export()` - 输出有效的 PHP 代码\n\n`var_export()` 转储项目的 PHP 可解析表示形式。\n\
  \n```\n$myarray = array('a', 'b', 'c');\nvar_export($myarray);\n```\n\n```\narray\
  \ (\n  0 => 'a',\n  1 => 'b',\n  2 => 'c',\n)\n```\n\n要将内容放入变量，可以执行以下操作：\n\n```\n\
  $array_export = var_export($myarray, true);\n$string_export = var_export($mystring,\
  \ true);\n$int_export = var_export($myint, true);\n```\n\n之后，您可以这样输出：\n\n```\nprintf('$myarray\
  \ = %s; %s', $array_export, PHP_EOL);\nprintf('$mystring = %s; %s', $string_export,\
  \ PHP_EOL);\nprintf('$myint = %s; %s', $int_export, PHP_EOL);\n```\n\n这将产生以下输出：\n\
  \n```\n$myarray = array (\n  0 => 'a',\n  1 => 'b',\n  2 => 'c',\n);\n$mystring\
  \ = 'foo';\n$myint = 123;\n```\n\n#### 第 5.3 节：使用 echo 进行字符串拼接\n\n您可以在输出时使用 [拼接来连接字符串](https://secure.php.net/manual/en/language.operators.string.php)\
  \ \"首尾相连\"（例如使用 `echo` 或 `print`）。\n\n您可以使用 `.`（句点）拼接变量。\n\n```\necho \"Hello \"\
  \ . $name . \"!\";\n```\n\n与拼接类似，`echo`（不带括号时）可以使用逗号（`,`）将字符串和变量组合在一起（连同其他任意表达式）。\n\
  \n```\necho \"Hello \", $name, \"!\";\n```\n\n```\necho \"The sum is \", 1 + 2,\
  \ \".\";\n```\n\n### 字符串拼接 vs 向 echo 传递多个参数\n\n向 `echo` 命令传递多个参数在某些情况下比字符串拼接更有优势。参数按传入的顺序写入输出。\n\
  \n```\necho \"Hello \", $name, \"!\"; // 更快，无拼接开销\necho \"Hello \" . $name . \"\
  !\"; // 先拼接，再输出\n```\n\n\n\n\n# 第 5 章：字符串输出与格式化\n\n#### 第 5.4 节：printf 对比 sprintf\n\
  \n连接运算符的问题在于句点 `.` 在表达式中优先级较高。如果进行连接，上述表达式需要额外的括号才能表现出正确的行为。句点的优先级也会影响三元运算符。\n\n\
  ![](img/Image00150.jpg)\n\n[`printf`](http://php.net/manual/en/function.printf.php)\
  \ 将使用占位符输出格式化字符串。\n\n![](img/Image00151.jpg)\n\n也可以使用这两个函数来格式化数字。这可用于格式化用于表示货币的十进制值，使其始终保留\
  \ 2 位小数。\n\n![](img/Image00152.jpg)\n\n这两个函数 [`vprintf`](http://php.net/manual/en/function.vprintf.php)\
  \ 和 [`vsprintf`](http://php.net/manual/en/function.vsprintf.php) 的操作方式与 [`printf`](http://php.net/manual/en/function.printf.php)\
  \ 和 [`sprintf`](http://php.net/manual/en/function.sprintf.php) 相同，但它们接受一个格式字符串和一个值数组，而不是单独的变量。\n\
  \n#### 第 5.5 节：输出大整数\n\n在 32 位系统上，大于 `PHP_INT_MAX` 的整数会自动转换为浮点数。要将这些值作为整数输出（即非科学计数法），可以使用\
  \ `printf` 并利用浮点数表示法，如下所示：\n\n![](img/Image00153.jpg)\n\n```\necho \" \" , $i ,\
  \ \" \\n \" ;\n}\n\n// 输出：\n```\n\n![](img/Image00154.jpg)\n\n```\npow (1024,  1)\
  \  integer                     1024                         1024   1024\npow (1024,\
  \  2)  integer              1048576                         1048576   1048576\n\
  pow (1024,  3)  integer           1073741824                         1073741824\
  \   1073741824\npow (1024,  4)   double          1099511627776                 \
  \        1099511627776   1099511627776\npow (1024,  5)   double  1.1258999068426E+15\
  \                         1125899906842624 1.1258999068426E+15\npow (1024,  6) \
  \  double  1.1529215046068E+18                       1152921504606846976 1.1529215046068E+18\n\
  pow (1024,  9)   double  1.2379400392854E+27          1237940039285380274899124224\
  \ 1.2379400392854E+27\npow (1024, 12)   double  1.3292279957849E+36  1329227995784915872903807060280344576\
  \ 1.3292279957849E+36\n```\n\n注意：留意浮点数精度，它并非无限的！\n\n虽然这看起来不错，但在这个人为构造的示例中，所有数字都可以表示为二进制数，因为它们都是\
  \ 1024 的幂（因此也是 2 的幂）。例如见：\n\n![](img/Image00155.jpg)\n\n#### 第 5.6 节：输出多维数组及其索引和值并打印到表格中\n\
  \n![](img/Image00156.jpg)\n\n![](img/Image00157.jpg)\n\n在表格中输出带有索引和值的多维数组\n\n![](img/Image00158.jpg)\n\
  \n## 第 6 章：常量\n\n#### 第 6.1 节：定义常量\n\n常量是使用 `const` 语句或 `define` 函数创建的。惯例是常量名使用大写字母。\n\
  \n![](img/Image00159.jpg)\n\n```\ndefine ( \"BETTER_APP_LANGUAGES\" , [ \"lu\" ,\
  \ \"de\" ]); // 数组\n```\n\n如果你已有一个常量，可以基于它定义另一个常量：\n\n![](img/Image00160.jpg)\n\n\
  ```\nconst TAU = PI * 2;\ndefine ( \"EARTH_IS_ROUND\" , ! EARTH_IS_FLAT );\ndefine\
  \ ( \"MORE_UNKNOWN\" , UNKNOWN );\ndefine ( \"APP_ENV_UPPERCASE\" , strtoupper (\
  \ APP_ENV )); // 字符串操作也可以\n// 上面的例子（函数调用）不适用于 const：\n// const TIME = time(); #\
  \ 会报致命错误！非常量标量表达式\ndefine ( \"MAX_SESSION_TIME_IN_MINUTES\" , MAX_SESSION_TIME /\
  \ 60);\nconst APP_FUTURE_LANGUAGES = [-1 => \"es\"] + APP_LANGUAGES; // 数组操作\ndefine\
  \ ( \"APP_BETTER_FUTURE_LANGUAGES\" , array_merge ([\"fr\"], APP_BETTER_LANGUAGES\
  \ ));\n```\n\n##### 保留常量\n\n某些常量名由 PHP 保留，无法重新定义。以下所有示例都会失败：\n\n```\ndefine ( \"\
  true\" , false ); // 内部常量\ndefine ( \"false\" , true ); // 内部常量\n```\n\n![](img/Image00161.jpg)\n\
  \n```\ndefine ( \"CURLOPT_AUTOREFERER\" , \"something\" ); // 如果加载了 curl 扩展将会失败\n\
  ```\n\n并会发出一个 Notice（提示）：\n\n![](img/Image00162.jpg)\n\n##### 条件定义\n\n如果你有多个文件可能定义同一个变量（例如，主配置文件然后是本地配置文件），以下语法可能有助于避免冲突：\n\
  \n![](img/Image00163.jpg)\n\n```\ndefined ( \"PI\" ) || define ( \"PI\" , 3.1415\
  \ ); // \"如果 PI 尚未定义则定义它\"\n```\n\n##### const 对比 define\n\n`define` 是运行时表达式，而 `const`\
  \ 是编译时表达式。\n\n因此 `define` 允许动态值（即函数调用、变量等），甚至动态名称和条件定义。但它始终相对于根命名空间进行定义。\n\n`const`\
  \ 是静态的（即仅允许与其他常量、标量或数组进行操作，且仅限于受限的操作集，即所谓的常量标量表达式，包括算术、逻辑和比较运算符以及数组解引用），但会自动加上当前活动命名空间作为前缀。\n\
  \n`const` 仅支持其他常量和标量作为值，不支持运算。\n\n#### 第 6.2 节：类常量\n\n常量可以使用 `const` 关键字在类内部定义。\n\
  \n![](img/Image00164.jpg)\n\n这对于存储项目类型很有用。\n\n![](img/Image00165.jpg)\n\n#### 第\
  \ 6.3 节：检查常量是否已定义\n\n##### 简单检查\n\n要检查常量是否已定义，请使用 `defined` 函数。注意，该函数不关心常量的值，只关心常量是否存在。即使常量的值是\
  \ `null` 或 `false`，该函数仍将返回 `true`。\n\n![](img/Image00166.jpg)\n\n![](img/Image00167.jpg)\n\
  \n请注意，常量只有在定义它的那一行之后，在你的代码中才会变得“可见”：\n\n![](img/Image00168.jpg)\n\n##### 获取所有已定义的常量\n\
  \n要获取所有已定义的常量（包括 PHP 创建的），请使用 `get_defined_constants` 函数：\n\n![](img/Image00169.jpg)\n\
  \n要仅获取你的应用定义的常量，请在脚本开始时（通常在引导过程后）和结束时调用该函数：\n\n![](img/Image00170.jpg)\n\n这有时对调试很有用。\n\
  \n#### 第 6.4 节：使用常量\n\n要使用常量，只需使用其名称：\n\n![](img/Image00171.jpg)\n\n或者如果你事先不知道常量的名称，请使用\
  \ `constant` 函数：\n\n![](img/Image00172.jpg)\n\n#### 第 6.5 节：常量数组\n\n从 PHP 5.6 版本起，数组可用作普通常量和类常量：\n\
  \n![](img/Image00173.jpg)\n\n![](img/Image00174.jpg)\n\n```\nconst ANSWER = [2,4];\n\
  ```\n\n此外，从 PHP 7.0 版本起，此功能被移植到 [`define`](http://php.net/manual/en/function.define.php)\
  \ 函数中，用于普通常量。\n\n![](img/Image00175.jpg)\n\n## 第 7 章：魔术常量\n\n#### 第 7.1 节：`__FUNCTION__`\
  \ 与 `__METHOD__` 的区别\n\n`__FUNCTION__` 仅返回函数名称，而 `__METHOD__` 返回类名连同函数名称：\n\n![](img/Image00176.jpg)\n\
  \n#### 第 7.2 节：`__CLASS__`、`get_class()` 与 `get_called_class()` 的区别\n\n| `get_class()`\
  \ |\n| --- |\n\n`__CLASS__` 魔术常量返回的结果与无参数调用的函数相同，它们都返回定义它的类的名称（即你编写函数调用/常量名的地方）。\n\
  \n| `get_class($this)` | | 和 | `get_called_class()` |\n| --- | --- | --- | --- |\n\
  \n相比之下，函数调用将返回实际被实例化的类的名称：\n\n![](img/Image00177.jpg)\n\n![](img/Image00178.jpg)\n\
  \n#### 第 7.3 节：文件与目录常量\n\n##### 当前文件\n\n你可以使用 `__FILE__` 魔术常量获取当前 PHP 文件的名称（含绝对路径）。这最常用作记录/调试技术。\n\
  \n![](img/Image00179.jpg)\n\n##### 当前目录\n\n要获取当前文件所在目录的绝对路径，请使用 `__DIR__` 魔术常量。\n\
  \n![](img/Image00180.jpg)\n\n| `dirname` | | ( | `__FILE__` |\n| --- | --- | ---\
  \ | --- |\n\n要获取当前文件所在目录的绝对路径，请使用 `)` 。\n\n![](img/Image00181.jpg)\n\n\n\n\n#####\
  \ 获取当前目录\n\n获取当前目录常被 PHP 框架用于设置基础目录：\n\n![](img/Image00182.jpg)\n\n![](img/Image00183.jpg)\n\
  \n除了魔术常量，PHP 还提供了一些用于处理路径的固定常量：\n\n![](img/Image00184.jpg)\n\n`DIRECTORY_SEPARATOR`\
  \ 常量用于分隔路径中的目录。在 *nix 系统上取值为 `/`，在 Windows 上取值为 `\\`。带有视图的示例可以重写为：\n\n```php\n$view\
  \ = 'page';\n$viewFile = BASEDIR . DIRECTORY_SEPARATOR . 'views' . DIRECTORY_SEPARATOR\
  \ . $view;\n```\n\n很少使用的 `PATH_SEPARATOR` 常量用于分隔 `$PATH` 环境变量中的路径。在 Windows 上为 `;`，其他系统上为\
  \ `:`。\n\n## 第 8 章：注释\n\n#### 第 8.1 节：单行注释\n\n单行注释以 `//` 或 `#` 开头。遇到时，其右侧的所有文本将被\
  \ PHP 解释器忽略。\n\n![](img/Image00185.jpg)\n\n#### 第 8.2 节：多行注释\n\n多行注释可用于注释掉大块代码。它以\
  \ `/*` 开始，以 `*/` 结束。\n\n![](img/Image00186.jpg)\n\n## 第 9 章：类型\n\n#### 第 9.1 节：类型比较\n\
  \n有两种类型的[比较](http://php.net/manual/en/types.comparisons.php)：使用 `==` 的宽松比较和使用 `===`\
  \ 的严格比较。严格比较确保运算符两边的类型和值都相同。\n\n![](img/Image00187.jpg)\n\n你也可以使用强比较（即严格比较）通过 `!==`\
  \ 来检查类型和值是否不匹配。\n\n一个 `==` 运算符不够用的典型例子，是那些可能返回不同类型的函数，比如 [strpos](http://php.net/manual/en/function.strpos.php)，如果未找到搜索词则返回\
  \ `false`，否则返回匹配位置（`int`）：\n\n```php\nif (strpos('text', 'searchword') == false)\n\
  \    // strpos 返回 false，所以 == 比较在这里按预期工作，但是：\nif (strpos('text bla', 'text') ==\
  \ false)\n    // strpos 返回 0（在位置 0 找到匹配）且 0==false 为 true。\n    // 这可能不是你期望的！\n\
  if (strpos('text', 'text') === false)\n    // strpos 返回 0，且 0===false 为 false，所以这能按预期工作。\n\
  ```\n\n![](img/Image00188.jpg)\n\n#### 第 9.2 节：布尔值\n\n[布尔值](http://php.net/manual/en/language.types.boolean.php)是一种类型，有两个值，分别表示为\
  \ `true` 或 `false`。\n\n这段代码将 `$foo` 的值设为 `true`，`$bar` 的值设为 `false`：\n\n![](img/Image00189.jpg)\n\
  \n`true` 和 `false` 不区分大小写，所以 `TRUE` 和 `FALSE` 也可以使用，甚至 `FaLsE` 也是可能的。使用小写是最常见的，且在大多数代码风格指南中被推荐，例如\
  \ [PSR-2](http://www.php-fig.org/psr/psr-2/)。\n\n布尔值可用于 `if` 语句，如下所示：\n\n![](img/Image00190.jpg)\n\
  \n由于 PHP 是弱类型语言，如果上面的 `$foo` 不是 `true` 或 `false`，它会自动被强制转换为布尔值。\n\n以下值结果为 `false`：\n\
  \n![](img/Image00191.jpg)\n\n*   零值：`0`（整数）、`0.0`（浮点数）或 `'0'`（字符串）\n*   空字符串 `''`\
  \ 或空数组 `[]`\n*   `null`（未设置变量的内容，或赋值给变量的 null）\n\n任何其他值结果为 `true`。\n\n为避免这种宽松比较，你可以使用\
  \ `===` 强制进行强比较，它同时比较值和类型。详见类型比较。\n\n| bool | | ) or ( | boolean |\n| --- | ---\
  \ | --- | --- |\n\n要将类型转换为布尔值，可以在类型前使用 `()` 强制转换。\n\n![](img/Image00192.jpg)\n\n\
  或调用 `boolval()` 函数：\n\n![](img/Image00193.jpg)\n\n布尔值转字符串（注意 `false` 生成空字符串）：\n\n\
  ![](img/Image00194.jpg)\n\n布尔值转整数：\n\n![](img/Image00195.jpg)\n\n注意相反的转换也是可能的：\n\
  \n![](img/Image00196.jpg)\n\n此外所有非零值都将返回 `true`：\n\n![](img/Image00197.jpg)\n\n\
  #### 第 9.3 节：浮点数\n\n![](img/Image00198.jpg)\n\n浮点数是浮点型数字，其输出精度比普通整数更高。\n\n由于 PHP\
  \ 对变量类型的宽松转换，浮点数和整数可以一起使用：\n\n![](img/Image00199.jpg)\n\nPHP 不像其他语言那样将浮点数显示为浮点数格式，例如：\n\
  \n![](img/Image00200.jpg)\n\n> **警告：浮点数精度**\n>\n> （来自 [PHP 手册页面](http://php.net/manual/en/language.types.float.php)）\n\
  >\n> ![](img/Image00201.jpg)\n>\n> 浮点数精度有限。虽然取决于系统，PHP 通常因舍入而给出最大相对误差，数量级约为 1.11e-16。非基本算术运算可能给出更大的误差，当多个运算复合时必须考虑误差传播。\n\
  >\n> 此外，在十进制中能精确表示为浮点数的有理数，如 `0.1` 或 `0.7`，在内部使用的二进制（基数 2）中没有精确的浮点数表示，无论尾数大小如何。因此，它们无法在不损失少量精度的情况下转换为内部二进制对应值。这可能导致令人困惑的结果：例如，`floor((0.1+0.7)*10)`\
  \ 通常会返回 `7` 而不是预期的 `8`，因为内部表示可能类似 `7.9999999999999991118....`\n>\n> 所以永远不要信任浮点数结果的最后一位，也不要直接比较浮点数是否相等。如果需要更高精度，可使用任意精度数学函数和\
  \ gmp 函数。\n\n#### 第 9.4 节：字符串\n\nPHP 中的字符串是一系列单字节字符（即没有原生 Unicode 支持），可以通过四种方式指定：\n\
  \n##### 单引号\n\n几乎完全“原样”显示内容。变量和大多数转义序列不会被解析。例外是要显示字面单引号，可以用反斜杠转义 `\\'`，要显示反斜杠，可以用另一个反斜杠转义\
  \ `\\\\`。\n\n![](img/Image00202.jpg)\n\n##### 双引号\n\n与单引号字符串不同，字符串中的简单变量名和[转义序列](http://php.net/manual/en/language.types.string.php#language.types.string.syntax.double)会被解析。花括号（如最后一个示例所示）可用于隔离复杂的变量名。\n\
  \n![](img/Image00203.jpg)\n\n##### Heredoc\n\n| <<< identifier |\n| --- |\n\n在 heredoc\
  \ 字符串中，变量名和转义序列的解析方式类似于双引号字符串，但花括号不可用于复杂变量名。字符串的开始由 `<<< identifier` 界定，结束由 `identifier`\
  \ 界定，其中 `identifier` 可以是任何合法的 PHP 名称。结束标识符必须单独占一行。标识符前后不允许有空白字符，尽管像 PHP 中的任何一行一样，它也必须以分号结尾。\n\
  \n![](img/Image00204.jpg)\n\n##### Nowdoc\n\nNowdoc 字符串类似于 heredoc 的单引号版本，甚至最基本的转义序列也不被解析。字符串开头的标识符被单引号包裹。\n\
  \n**PHP 5.x 版本 ≥ 5.3**\n\n```php\n$my_string = <<< 'EOF'\n```\n\n![](img/Image00205.jpg)\n\
  \n语法类似于 heredoc，但类似于单引号字符串，没有任何内容被解析（甚至不包括转义的单引号 `\\'` 和反斜杠 `\\\\`）。\n\n![](img/Image00206.jpg)\n\
  \n#### 第 9.5 节：可调用类型\n\n可调用类型是指任何可以作为回调被调用的东西。可称为“回调”的事物如下：\n\n![](img/Image00207.jpg)\n\
  \n*   匿名函数\n*   标准 PHP 函数（注意：不包括语言结构）\n*   静态类\n*   非静态类（使用替代语法）\n*   特定的对象/类方法\n\
  *   对象本身，只要该对象位于数组的键 0 处\n\n引用对象作为数组元素的示例：\n\n![](img/Image00208.jpg)\n\n自 PHP 5.4\
  \ 起，回调可用 `callable` 类型提示标注。\n\n![](img/Image00209.jpg)\n\n#### 第 9.6 节：资源\n\n[资源](https://secure.php.net/manual/en/language.types.resource.php)是一种特殊类型的变量，引用外部资源，如文件、套接字、流、文档或连接。\n\
  \n![](img/Image00210.jpg)\n\n| `get_resource_type()` |\n| --- |\n\n\n\n\n# PHP 资源类型与类型系统\n\
  \n资源有不同的（子）类型。你可以使用 [`get_resource_type()`](https://secure.php.net/manual/en/function.get-resource-type.php)\
  \ 来检查资源类型：\n\n![Image00211.jpg](img/Image00211.jpg)\n\n![Image00212.jpg](img/Image00212.jpg)\n\
  \n你可以在[这里](https://secure.php.net/manual/en/resource.php)找到内置资源类型的完整列表。\n\n#####\
  \ 类型转换\n\nPHP 通常会根据变量使用的上下文正确推断你想要使用的数据类型；不过，有时手动强制转换类型很有用。这可以通过在声明前加上括号括起来的目标类型名称来实现：\n\
  \n![Image00213.jpg](img/Image00213.jpg)\n\n但要小心：并非所有类型转换都如预期那样工作：\n\n![Image00214.jpg](img/Image00214.jpg)\n\
  \n```php\n// 以下 3 条语句适用于 32 位系统 (PHP_INT_MAX=2147483647)\n// 大于 PHP_INT_MAX 的整数值会自动转换为浮点数：\n\
  var_dump(999888777666); // float(999888777666)\n// 强制转为 (int) 会导致溢出：\nvar_dump((int)\
  \ 999888777666); // int(-838602302)\n// 但在字符串中它只返回 PHP_INT_MAX\nvar_dump((int) \"\
  999888777666\"); // int(2147483647)\n\nvar_dump((bool) []);       // bool(false)\
  \ (空数组)\nvar_dump((bool) [false]);  // bool(true)  (非空数组)\n```\n\n##### 类型演变\n\n\
  PHP 是一门弱类型语言。它不需要显式声明数据类型。变量使用的上下文决定了其数据类型；转换会自动进行：\n\n![Image00215.jpg](img/Image00215.jpg)\n\
  \n![Image00216.jpg](img/Image00216.jpg)\n\n##### Null\n\nPHP 使用 [`null`](http://php.net/manual/en/language.types.null.php)\
  \ 关键字表示“无值”。它有点类似于 C 语言中的空指针和 SQL 中的 `NULL` 值。\n\n将变量设置为 null：\n\n![Image00217.jpg](img/Image00217.jpg)\n\
  \n检查变量是否被设置为 null：\n\n![Image00218.jpg](img/Image00218.jpg)\n\n##### Null 与未定义变量\n\
  \n| 通知 | | 未定义变量 | | `nullvar` |\n| :--- | :--- | :--- | :--- | :--- |\n\n如果变量未定义或已被\
  \ unset，那么针对 `null` 的任何测试都会成功，但同时也会生成一个通知：\n\n![Image00219.jpg](img/Image00219.jpg)\n\
  \n![Image00220.jpg](img/Image00220.jpg)\n\n因此，必须使用 [`isset()`](http://php.net/manual/en/function.isset.php)\
  \ 来检查未定义的值：\n\n```php\nif (!isset($nullvar)) {\n    // 变量为 null 甚至未定义\n}\n```\n\n\
  ##### 整数\n\nPHP 中的整数可以原生地以二进制（基数 2）、八进制（基数 8）、十进制（基数 10）或十六进制（基数 16）指定。\n\n![Image00221.jpg](img/Image00221.jpg)\n\
  \n整数长度为 32 位或 64 位，取决于平台。常量 `PHP_INT_SIZE` 以字节为单位保存整数大小。\n\n`PHP_INT_MAX` 和（自 PHP\
  \ 7.0 起）`PHP_INT_MIN` 也可用。\n\n![Image00222.jpg](img/Image00222.jpg)\n\n```php\n\
  printf(\"Integers are %d bits long\" . PHP_EOL, PHP_INT_SIZE * 8);\nprintf(\"They\
  \ go up to %d\" . PHP_EOL, PHP_INT_MAX);\n```\n\n整数值会根据需要自动从浮点数、布尔值和字符串创建。如果需要显式类型转换：\n\
  \n![Image00223.jpg](img/Image00223.jpg)\n\n整数溢出将通过转换为浮点数来处理：\n\n![Image00224.jpg](img/Image00224.jpg)\n\
  \nPHP 中没有整数除法运算符，但可以通过隐式转换来模拟，它总是通过丢弃小数部分来“舍入”。自 PHP 7 版本起，新增了一个整数除法函数。\n\n![Image00225.jpg](img/Image00225.jpg)\n\
  \n## 第 10 章：运算符\n\n运算符是指接受一个或多个值（或用编程术语说是表达式）并产生另一个值的东西（以便该结构本身成为一个表达式）。\n\n运算符可以根据它们接受的值的数量进行分组。\n\
  \n## Null 合并运算符 (??)\n\nNull 合并是 PHP 7 中引入的新运算符。如果第一个操作数已设置且不为 `NULL`，则返回该操作数。否则，返回第二个操作数。\n\
  \n以下示例：\n\n![Image00226.jpg](img/Image00226.jpg)\n\n等同于以下两种写法：\n\n![Image00227.jpg](img/Image00227.jpg)\n\
  \n和：\n\n![Image00228.jpg](img/Image00228.jpg)\n\n该运算符也可以链式使用（具有右结合语义）：\n\n![Image00229.jpg](img/Image00229.jpg)\n\
  \n等同于：\n\n![Image00230.jpg](img/Image00230.jpg)\n\n**注意：**\n\n在字符串连接上使用合并运算符时，别忘了使用括号\
  \ `()`。\n\n![Image00231.jpg](img/Image00231.jpg)\n\n这将只输出 `John`，如果 `$firstName`\
  \ 为 `null` 而 `$lastName` 为 `Doe`，则会输出 `Unknown Doe`。为了输出 `John Doe`，我们必须像这样使用括号：\n\
  \n![Image00232.jpg](img/Image00232.jpg)\n\n![Image00233.jpg](img/Image00233.jpg)\n\
  \n```php\necho ($firstName ?? \"Unknown\") . \" \" . ($lastName ?? \"\");\n```\n\
  \n这将输出 `John Doe` 而不是仅输出 `John`。\n\n## 太空船运算符 (<=>)\n\nPHP 7 引入了一种新型运算符，可用于比较表达式。如果第一个表达式小于、等于或大于第二个表达式，该运算符将分别返回\
  \ `-1`、`0` 或 `1`。\n\n![Image00234.jpg](img/Image00234.jpg)\n\n对象不可比较，因此这样做会导致未定义行为。\n\
  \n| `<=>` |\n| :--- |\n\n![Image00235.jpg](img/Image00235.jpg)\n\n该运算符在使用 `usort`、`uasort`\
  \ 或 `uksort` 编写用户定义的比较函数时特别有用。例如，给定一个按其 `weight` 属性排序的对象数组，匿名函数可以使用 `<=>` 返回排序函数所期望的值。\n\
  \n```php\nusort($list, function ($a, $b) {\n    return $a->weight <=> $b->weight;\n\
  });\n```\n\n在 PHP 5 中，这需要一个相当复杂的表达式。\n\n![Image00236.jpg](img/Image00236.jpg)\n\n\
  ## 执行运算符 (``)\n\nPHP 执行运算符由反引号 (``) 组成，用于运行 shell 命令。命令的输出将被返回，因此可以存储在变量中。\n\n![Image00237.jpg](img/Image00237.jpg)\n\
  \n| [`shell_exec()`](http://php.net/manual/en/function.shell-exec.php) |\n| :---\
  \ |\n\n注意，执行运算符和 [`shell_exec()`](http://php.net/manual/en/function.shell-exec.php)\
  \ 会给出相同的结果。\n\n## 递增 (++) 和递减 (--) 运算符\n\n变量可以分别使用 `++` 或 `--` 递增或递减 1。它们可以位于变量之前或之后，语义略有不同，如下所示。\n\
  \n![Image00238.jpg](img/Image00238.jpg)\n\n关于递增和递减运算符的更多信息，请参阅[官方文档](http://php.net/manual/en/language.operators.increment.php)。\n\
  \n## 三元运算符 (?:)\n\n三元运算符可以看作是一个内联的 `if` 语句。它由三部分组成：条件和两个结果。语法如下：\n\n![Image00239.jpg](img/Image00239.jpg)\n\
  \n| `<true value>` |\n| :--- |\n\n| `<false value>` |\n| :--- |\n\n如果条件评估为 `true`，则返回第一块中的值\
  \ (`<true value>`)；否则返回第二块中的值 (`<false value>`)。因为我们将 `$value` 设置为三元运算符的结果，所以它将存储返回的值。\n\
  \n**示例：**\n\n![Image00240.jpg](img/Image00240.jpg)\n\n| `empty` | `(` | `$_POST`\
  \ | `['action']` |\n| :--- | :--- | :--- | :--- |\n\n| `$_POST` | `['action']` |\n\
  | :--- | :--- |\n\n如果 `empty($_POST['action'])` 评估为 `true`，`$action` 将包含字符串 `'default'`。否则，它将包含\
  \ `$_POST['action']` 的值。\n\n| `expr3` |\n| :--- |\n\n| `expr1` | `)` | `?` | `(`\
  \ | `expr2` |\n| :--- | :--- | :--- | :--- | :--- |\n\n![Image00241.jpg](img/Image00241.jpg)\n\
  \n表达式 `(expr1) ? (expr2) : (expr3)` 在 `expr1` 评估为 `true` 时求值为 `expr2`，在 `expr1`\
  \ 评估为 `false` 时求值为 `expr3`。\n\n| `expr1` | `?` | `:` | `expr3` |\n| :--- | :---\
  \ | :--- | :--- |\n\n可以省略三元运算符的中间部分。表达式 `expr1 ?: expr3` 在 `expr1` 评估为 `TRUE` 时返回\
  \ `expr1`，否则返回 `expr3`。`?:` 常被称为 Elvis 运算符。\n\n这与 Null 合并运算符 `??` 行为类似，不同之处在于 `??`\
  \ 要求左操作数严格为 `null`，而 `?:` 尝试将左操作数解析为布尔值并检查其是否为布尔 `false`。\n\n**示例：**\n\n![Image00242.jpg](img/Image00242.jpg)\n\
  \n在此示例中，`setWidth` 接受一个 `width` 参数，或默认值 `0`，以更改宽度的会话值。如果 `$width` 为 `0`：\n\n| `getDefaultWidth()`\
  \ |\n| :--- |\n\n| `getDefaultWidth()` |\n| :--- |\n\n\n\n\n\n#### 第 10.6 节：逻辑运算符（`&&`/`AND`\
  \ 和 `||`/`OR`）\n\n在 PHP 中，逻辑 AND 和 OR 运算符各有两个版本。\n\n| 运算符 | 为真条件 |\n| :--- | :---\
  \ |\n| `$a and $b` | `$a` 和 `$b` 都为真 |\n| `$a && $b` | `$a` 和 `$b` 都为真 |\n| `$a\
  \ or $b` | `$a` 或 `$b` 为真 |\n| `$a || $b` | `$a` 或 `$b` 为真 |\n\n请注意，`&&` 和 `||`\
  \ 运算符的[优先级](http://php.net/manual/en/language.operators.precedence.php)高于 `and`\
  \ 和 `or`。请见下表：\n\n| 表达式 | `$e` 的结果 | 解析为 |\n| :--- | :--- | :--- |\n| `$e = ( false\
  \ || true )` | True | `$e = false \\|\\| true` |\n| `($e = false) or true` | False\
  \ | `$e = false or true` |\n\n因此，使用 `&&` 和 `||` 比使用 `and` 和 `or` 更安全。\n\n#### 第\
  \ 10.7 节：字符串运算符（`.` 和 `.=`）\n\n![](img/Image00243.jpg)\n\n#### 第 10.8 节：对象和类运算符\n\
  \n可以使用对象运算符（`->`）和类运算符（`::`）访问对象或类的成员。\n\n![](img/Image00244.jpg)\n![](img/Image00245.jpg)\n\
  \n| 正确 | 代替 | 错误 |\n| :--- | :--- | :--- |\n| `$object->a` | | `$object->$a` |\n\
  \n请注意，在对象运算符之后，不应写入 `$`。对于类运算符，情况并非如此，`$` 是必需的。对于类中定义的常量，永远不使用 `$`。\n\n```\nvar_dump(MyClass::$d());\n\
  ```\n\n还请注意，只有当函数 `d()` 不引用对象时，才允许使用 `$d();`：\n\n![](img/Image00246.jpg)\n\n这会导致“PHP\
  \ Fatal error: Uncaught Error: Using $this when not in object context”（PHP 致命错误：未捕获的错误：在非对象上下文中使用\
  \ $this）。这些运算符具有左结合性，可用于“链式调用”：\n\n![](img/Image00247.jpg)\n\n这些运算符具有最高优先级（甚至未在手册中提及），甚至高于\
  \ `clone`。因此：\n\n![](img/Image00248.jpg)\n\n在对象被克隆**之前**，`$o1` 的值就已增加！\n\n请注意，在\
  \ PHP 5 及更早版本中，使用括号来影响优先级不起作用（在 PHP 7 中可行）：\n\n![](img/Image00249.jpg)\n\n#### 第\
  \ 10.9 节：复合赋值（`+=` 等）\n\n复合赋值运算符是对某个变量进行操作并随后将该新值赋值给该变量的快捷方式。\n\n### 算术\n\n![](img/Image00250.jpg)\n\
  \n### 同时处理多个数组\n\n![](img/Image00251.jpg)\n\n### 字符串的复合连接与赋值\n\n![](img/Image00252.jpg)\n\
  \n### 复合二进制位运算赋值运算符\n\n```\n$a = 0b00101010;  // $a 现在是 42\n$a &= 0b00001111; //\
  \ $a 现在是 (00101010 & 00001111) => 00001010 (按位与)\n$a |= 0b00100010; // $a 现在是 (00001010\
  \ | 00100010) => 00101010 (按位或)\n$a ^= 0b10000010; // $a 现在是 (00101010 ^ 10000010)\
  \ => 10101000 (按位异或)\n$a >>= 3;         // $a 现在是 (10101000 >> 3) => 00010101 (右移\
  \ 3 位)\n$a <<= 1;         // $a 现在是 (00010101 << 1) => 00101010 (左移 1 位)\n```\n\n\
  #### 第 10.10 节：改变运算符优先级（使用括号）\n\n运算符的求值顺序由运算符优先级决定（另请参阅备注部分）。\n\n![](img/Image00254.jpg)\n\
  \n可以使用括号来改变优先级：\n\n![](img/Image00255.jpg)\n\n#### 第 10.11 节：基本赋值（`=`）\n\n![](img/Image00256.jpg)\n\
  \n结果是 `$a` 拥有值 `some string`。\n\n赋值表达式的结果是被赋的值。请注意，单个等号 `=` **不是**用于比较的！\n\n![](img/Image00257.jpg)\n\
  \n执行以下操作：\n\n1.  第 1 行将 `3` 赋值给 `$a`。\n2.  第 2 行将 `5` 赋值给 `$a`。该表达式也产生值 `5`。\n3.\
  \  第 2 行接着将括号内表达式的结果（`5`）赋值给 `$b`。\n\n因此：`$a` 和 `$b` 现在都拥有值 `5`。\n\n#### 第 10.12\
  \ 节：结合性\n\n### 左结合\n\n如果两个运算符的优先级相等，则结合性决定了分组（另请参阅备注部分）：\n\n![](img/Image00258.jpg)\n\
  \n`*` 和 `%` 具有相同的优先级和左结合性。因为乘法首先发生（在左侧），所以它被分组。\n\n![](img/Image00259.jpg)\n\n现在，取模运算符首先发生（在左侧），因此被分组。\n\
  \n### 右结合\n\n![](img/Image00260.jpg)\n\n| 表达式 | 结果 |\n| :--- | :--- |\n| `$a = $b\
  \ += 1` | `$a` 和 `$b` 现在都拥有值 2，因为 `1` 被分组，然后结果（`$b` 为 2）被赋值给 `$a`。 |\n\n#### 第 10.13\
  \ 节：比较运算符\n\n### 相等性\n\n对于基本的相等性测试，使用等于运算符 `==`。对于更全面的检查，请使用全等运算符 `===`。\n\n全等运算符的工作方式与等于运算符相同，要求其操作数具有相同的值，但也要求它们具有相同的数据类型。\n\
  \n例如，下面的示例将显示“a and b are equal”（a 和 b 相等），但不会显示“a and b are identical”（a 和 b 全等）。\n\
  \n![](img/Image00261.jpg)\n\n使用等于运算符时，数字字符串会被转换为整数。\n\n### 对象比较\n\n```\nnew stdClass()\
  \ === new stdClass()\n```\n\n`===` 通过检查两个对象是否为完全相同的实例来进行比较。这意味着 `new stdClass()\
  \ === new stdClass()` 解析为 false，即使它们是以相同方式创建的（并且具有完全相同的值）。\n\n```\n$a == $b\n```\n\
  \n`==` 通过递归检查两个对象是否相等（深度相等）来进行比较。这意味着，对于 `$a == $b`，如果 `$a` 和 `$b`：\n\n1.  属于同一个类\n\
  2.  设置了相同的属性，包括动态属性\n3.  对于每个设置的属性 `$property`，`$a->property == $b->property` 为真（因此递归检查）。\n\
  \n### 其他常用运算符\n\n它们包括：\n\n1.  大于（`>`）\n2.  小于（`<`）\n3.  大于或等于（`>=`）\n4.  小于或等于（`<=`）\n\
  5.  不等于（`!=`）\n6.  不全等于（`!==`）\n\n| 表达式 | 描述 |\n| :--- | :--- |\n| `$a > $b` | **大于**：如果\
  \ `$a` 的值大于 `$b`，则返回 true，否则返回 false。 |\n| `$a < $b` | **小于**：如果 `$a` 的值小于 `$b`，则返回\
  \ true，否则返回 false。 |\n| `$a >= $b` | **大于或等于**：如果 `$a` 的值大于 `$b` 或等于 `$b`，则返回 true，否则返回\
  \ false。 |\n| `$a <= $b` | **小于或等于**：如果 `$a` 的值小于 `$b` 或等于 `$b`，则返回 true，否则返回 false。\
  \ |\n\n**5/6. 不等于/不全等于**：重述一下前面关于相等性的示例，下面的示例将显示“a and b are not identical”（a 和\
  \ b 不全等），但不会显示“a and b are not equal”（a 和 b 不相等）。\n\n![](img/Image00266.jpg)\n\n\
  #### 第 10.14 节：位运算符\n\n### 前缀位运算符\n\n位运算符类似于逻辑运算符，但按位执行，而不是按布尔值执行。\n\n![](img/Image00267.jpg)\n\
  \n### 掩码-掩码运算符\n\n**按位与 `&`**：仅当某位在两个操作数中都被设置时，该位才被设置\n\n![](img/Image00268.jpg)\n\
  \n**按位或 `|`**：如果某位在任一或两个操作数中被设置，则该位被设置\n\n![](img/Image00269.jpg)\n\n**按位异或 `^`**：仅当某位在一个操作数中被设置而在另一个操作数中未被设置时，即该位在两个操作数中处于不同状态时，该位才被设置\n\
  \n![](img/Image00270.jpg)\n\n### 位掩码的示例用法\n\n这些运算符可用于操作位掩码。例如：\n\n![](img/Image00271.jpg)\n\
  \n这里，`|` 运算符用于组合两个位掩码。虽然 `+` 具有相同的效果，但 `|` 强调你是在组合位掩码，而不是添加两个普通的标量整数。\n\n![](img/Image00272.jpg)\n\
  \n这个示例（假设 `$option` 始终只包含一位）使用 `^` 运算符来方便地切换位掩码。\n\n\n\n\n# 位运算符\n\n## 按位或 (`|`)、非\
  \ (`~`)、与 (`&`)\n\n- `|` 运算符会设置位，忽略其原始状态或其他位。\n- `~` 运算符将仅设置了一个位的整数转换为仅未设置一个位的整数。\n\
  - `&` 运算符会清除位，利用了 `&` 的以下特性：\n  - 与已设置的位进行 `&=` 操作不会做任何事 (`(1 & 1) === 1`, `(0 &\
  \ 1) === 0`)。与仅有一个位未设置的整数进行 `&=` 操作将只清除该位，不影响其他位。\n  - 与未设置的位进行 `&=` 操作将清除该位 (`(1\
  \ & 0) === 0`, `(0 & 0) === 0`)。\n  - 将 `&` 运算符与另一个位掩码一起使用将过滤掉该位掩码中未设置的所有其他位。\n\
  \  - 如果输出有任何位被设置，意味着位掩码中的任一选项已启用。\n  - 如果输出有位掩码的所有位都被设置，意味着位掩码中的所有选项均已启用。\n\n> **注意：**\
  \ 请记住，这些比较运算符：(`<`, `>`, `<=`, `>=`, `==`, `===`, `!=`, `!==`, `<>`) 的优先级高于这些位掩码运算符：(`|`,\
  \ `^`, `&`)。由于位运算结果经常使用这些比较运算符进行比较，这是一个需要注意的常见陷阱。\n\n## 移位运算符\n\n### 按位左移 (`<<`)\n\
  将所有位向左（更高位）移动给定的步数，并丢弃超过整数大小的位。\n\n- `<< $x` 等同于清除最高的 `$x` 位并乘以 2 的 `$x` 次幂。\n\n\
  ### 按位右移 (`>>`)\n丢弃最低位，并将剩余位向右（更低位）移动。\n\n- `>> $x` 等同于除以 2 的 `$x` 次幂并丢弃非整数部分。\n\
  \n### 移位运算的示例用法\n\n**快速除以 16**（性能优于 `/= 16`）：\n```\n$x >> 4\n```\n\n**在不同架构上的行为：**\n\
  - 在 32 位系统上，`>> 32` 会丢弃整数中的所有位，将值设为 0。\n- 在 64 位系统上，`>> 32` 会清除最高 32 位并保留最低 32 位，等同于：\n\
  \  ```\n  $x & 0xFFFFFFFF\n  ```\n\n> **注意：** 在示例 `printf(\"%'06b\", $value)` 中，使用了格式说明符\
  \ `%\\'06b`。它以 6 位二进制数字输出值。\n\n#### 第 10.15 节：`instanceof`（类型运算符）\n\n用于检查某个对象是否属于某个类，自\
  \ PHP 5 版本起可以使用（二元）`instanceof` 运算符。\n\n- 第一个（左侧）参数是要测试的对象。如果该变量不是对象，`instanceof`\
  \ 始终返回 `false`。如果使用常量表达式，将抛出错误。\n- 第二个（右侧）参数是用于比较的类。类可以作为类名本身、包含类名的字符串变量（**不是字符串常量！**）或该类的对象来提供。\n\
  \n`instanceof` 也可用于检查对象是否属于继承自另一个类或实现了某个接口的类。\n\n要检查对象是否**不**属于某个类，可以使用 `!` 运算符：\n\
  ```\n!$o instanceof MyClass\n```\n请注意，`$o instanceof MyClass` 周围不需要括号，因为 `instanceof`\
  \ 的优先级高于 `!`，尽管加上括号可能会使代码更具可读性。\n\n##### 注意事项\n\n如果类不存在，会调用已注册的自动加载函数来尝试定义该类。在 PHP\
  \ 5.1.0 之前的版本中，`instanceof` 运算符也会触发这些调用，从而实际定义该类（如果无法定义类，则会发生致命错误）。为避免这种情况，请使用字符串：\n\
  ```\n$o instanceof 'MyClass'\n```\n自 PHP 5.1.0 版本起，在这些情况下不再调用已注册的自动加载器。\n\n#####\
  \ PHP 旧版本（5.0 之前）\n\n在 PHP 旧版本（5.0 之前）中，可以使用 `is_a()` 函数来确定对象是否属于某个类。该函数在 PHP 5\
  \ 中被弃用，并在 PHP 5.3.0 中恢复使用。\n\n## 第 11 章：引用\n\n#### 第 11.1 节：按引用赋值\n\n这是引用的第一阶段。本质上，当你[按引用赋值](http://php.net/manual/en/language.references.whatdo.php#language.references.whatdo.assign)时，你允许两个变量共享同一个值。\n\
  \n```\n$foo = &$bar;\n```\n这里 `$foo` 和 `$bar` 相等。它们不互相指向。它们指向同一个位置（“值”）。\n\n你也可以在\
  \ `array()` 语言结构中按引用赋值。虽然严格来说不是按引用赋值：\n```\n$arr = [&$value];\n```\n\n按引用赋值不仅限于变量和数组；函数和所有“按引用传递”关联也存在此情况。\n\
  \n```\nfunction &myFunction() { ... }\n```\n如上所示，赋值在函数定义中至关重要。你不能按引用传递表达式，只能传递值/变量。因此示例中在\
  \ `myFunction()` 内实例化了 `$a`。\n\n#### 第 11.2 节：按引用返回\n\n有时你需要隐式地按引用返回。\n\n```\nfunction\
  \ &myFunction() { ... }\n```\n当你想用函数来查找引用应绑定到哪个变量时，按引用返回很有用。**不要**为了提高性能而使用按引用返回。引擎会自动优化这一点。仅当你有正当的技术理由时才返回引用。\n\
  \n摘自 [PHP 文档：按引用返回](http://php.net/manual/en/language.references.return.php)。\n\n\
  按引用返回可以采取多种不同形式，包括以下示例：\n```\nfunction &myFunction() {\n    $a = 5;\n    return\
  \ $a;\n}\n```\n\n按引用返回不仅限于函数引用。你也可以隐式调用该函数：\n```\necho &myFunction();\n```\n\n你不能直接引用函数调用；必须先将其赋值给变量才能利用它。要了解其工作原理，只需尝试\
  \ `myFunction();`。\n\n##### 注意事项\n\n你需要在打算使用引用的两个地方都指定引用（`&`）。这意味着在你的函数定义中（`function\
  \ &myFunction() {`）和调用引用中（`callFunction(&$variable)` 或 `&myFunction()`）。\n\n```\n\
  function &myFunction() { ... }\ncallFunction(&$variable);\n```\n\n> **提示：** 你只能按引用返回变量。因此示例中在函数内实例化了\
  \ `$a`。这意味着你不能返回表达式，否则将产生 `E_NOTICE` PHP 错误（“Only variable references should be\
  \ returned by reference in ...”）。\n\n按引用返回确实有合法的用例，但应谨慎使用，仅在探索了所有其他实现相同目标的潜在选项后才使用。\n\
  \n#### 第 11.3 节：按引用传递\n\n这允许你将变量按引用传递给函数或允许修改原始变量的元素。\n\n按引用传递不仅限于变量；以下内容也可以按引用传递：\n\
  \n- new 语句，例如 `foo(new SomeClass())`\n- 从函数返回的引用\n- 数组\n\n```\n$myElement = &$arr[0];\n\
  ```\n[\"按引用传递\"](http://php.net/manual/en/language.references.pass.php) 的一个常见用例是在不创建新数组或不污染命名空间的情况下修改数组中的初始值。按引用传递很简单，只需在变量前加上\
  \ `&` => `&`。\n\n下面是一个利用数组元素并将其初始值加 1 的示例。\n```\nforeach ($arr as &$value) {\n \
  \   $value++;\n}\n```\n现在当你访问 `$arr` 中的任何元素时，原始元素都会被更新，因为引用被增加了。你可以通过以下方式验证：\n```\n\
  print_r($arr);\n```\n\n## 函数\n\n\n\n\n\n## 第 12 章：数组\n\n## 参数详解\n\n键是数组的唯一标识符和索引。它可以是字符串或整数。因此，有效的键应该是：\n\
  \n`'foo'`、`'5'`、`10`、`'a2b`、...\n\n对于每个键，都有一个对应的值（否则为 `null`，且访问时会发出通知）。值对输入类型没有限制。\n\
  \n数组是一种数据结构，它在单个值中存储任意数量的值。PHP 中的数组实际上是一个有序映射，其中映射是一种将值关联到键的类型。\n\n#### 第 12.1 节：初始化数组\n\
  \n数组可以初始化为空：\n\n```\n$array = [];\n```\n\n数组可以初始化并预设值：\n\n```\n$array = [1, 2, 3];\n\
  ```\n\n数组也可以使用自定义索引进行初始化（也称为关联数组）：\n\n```\n$array = ['foo' => 'bar', 'baz' => 'qux'];\n\
  ```\n\n如果变量之前未被使用过，PHP 将自动创建它。虽然方便，但这可能会使代码更难阅读：\n\n```\n$array[] = 'value';\n```\n\
  \n索引通常将从你停止的地方继续。PHP 会尝试将数字字符串作为整数使用：\n\n```\n$foo = [2 => 'apple', 'melon']; //\
  \ Array([2] => apple, [3] => melon)\n$foo = ['2' => 'apple', 'melon']; // 与上述相同\n\
  $foo = [2 => 'apple', 'this is index 3 temporarily', '3' => 'melon']; // 与上述相同！最后一项将覆盖第二项！\n\
  ```\n\n要使用固定大小初始化数组，可以使用 `SplFixedArray`：\n\n```\n$array = new SplFixedArray(5);\n\
  ```\n\n注意：使用 `SplFixedArray` 创建的数组对于大量数据集具有较小的内存占用，但键必须是整数。\n\n要使用动态大小但具有 n 个非空元素（例如占位符）来初始化数组，可以使用如下循环：\n\
  \n```\n$array = [];\nfor ($i = 0; $i < 10; $i++) {\n    $array[] = null;\n}\n```\n\
  \n##### `array_fill`\n\n```\narray array_fill(int $start_index, int $num, mixed\
  \ $value)\n```\n\n这将创建并返回一个包含 `num` 个 `value` 值的数组，键从 `start_index` 开始。\n\n注意：如果\
  \ `start_index` 为负数，它将从负索引开始，后续元素从 0 继续。\n\n```\n$a = array_fill(5, 6, 'banana');\
  \ // Array([5] => banana, [6] => banana, ..., [10] => banana)\n$b = array_fill(-2,\
  \ 4, 'pear');  // Array([-2] => pear, [0] => pear, ..., [2] => pear)\n```\n\n#####\
  \ `array_fill`\n\n结论：使用 `array_fill()` 你能实际做的事情更受限。循环更灵活，并为你提供更广泛的机会。\n\n##### `range`\n\
  \n每当你想要一个填充了数字范围的数组（例如 1-4）时，你可以向数组追加每个单独的元素，或者使用 `range()` 函数：\n\n```\narray range(mixed\
  \ $start, mixed $end[, number $step = 1])\n```\n\n此函数创建一个包含一系列元素的数组。前两个参数是必需的，它们设置（包含的）范围的起点和终点。第三个参数是可选的，用于定义步长。创建一个从\
  \ 0 到 4 步长为 1 的范围，生成的数组将包含以下元素：`0`、`1`、`2`、`3` 和 `4`。如果步长增加到 2（即 `(0, 4, 2)`），则生成的数组范围可以处理整数、浮点数、布尔值（将转换为整数）和字符串。然而，由于浮点数精度问题，使用浮点数作为参数时应谨慎。\n\
  \n#### 第 12.2 节：检查键是否存在\n\n```\nisset($map['foobar']);\n```\n\n`isset()` 将值为 null\
  \ 的元素视为不存在。而 `!empty()` 对任何等于 false 的元素执行相同操作（使用弱比较；例如，`null`、`''` 和 `0` 都被 `empty()`\
  \ 视为 false）。\n\n```\nisset($map['foobar']); // 为 true\n!empty($map['foobar']); //\
  \ 为 false\n```\n\n虽然如果 `$map` 根本未定义，`isset()` 和 `!empty()` 也能工作（并返回 false）。这使得它们在使用时容易出错：\n\
  \n```php\n// 注意 \"long\" 与 \"lang\"，变量名中一个微小的拼写错误。\n$my_array_with_a_long_name =\
  \ ['foo' => true];\narray_key_exists('foo', $my_array_with_a_lang_name); // 显示警告\n\
  isset($my_array_with_a_lang_name['foo']); // 返回 false\n```\n\n你也可以检查索引数组：\n\n```\n\
  isset($array[0]);\n```\n\n注意 `isset()` 的性能优于 `array_key_exists()`，因为后者是函数而前者是语言结构。\n\
  \n##### `key_exists`\n\n`key_exists()` 是 `array_key_exists()` 的别名。\n\n你也可以使用 `array_key_exists()`。\n\
  \n#### 第 12.3 节：验证数组类型\n\n##### `is_array`\n\n如果变量是数组，函数 `is_array()` 返回 true。\n\
  \n```\nis_array($variable);\n```\n\n你可以在函数中对数组类型进行类型提示以强制参数类型；传递其他任何内容将导致致命错误。\n\
  \n```\nfunction foo(array $arr) {}\n```\n\n#### 第 12.4 节：创建变量数组\n\n```\n$vars =\
  \ compact('var1', 'var2', 'var3');\n```\n\n此方法常用于框架中，在两个组件之间传递变量数组。\n\n#### 第 12.5\
  \ 节：检查值是否存在于数组中\n\n##### `in_array`\n\n如果项目存在于数组中，函数 `in_array()` 返回 true。\n\n```\n\
  in_array('needle', $haystack);\nin_array('needle', $haystack, true); // 严格模式\n```\n\
  \n##### `array_search`\n\n你也可以使用函数 `array_search()` 来获取数组中特定项目的键。\n\n```\narray_search('needle',\
  \ $haystack);\n```\n\nPHP 5.x 版本 ≥ 5.5\n\n\n\n\n# 第 12 章：ArrayAccess 和 Iterator\
  \ 接口\n\n#### 第 12.6 节：ArrayAccess 和 Iterator 接口\n\n在 PHP 5.5 及更高版本中，你可以将 `array_column()`\
  \ 与 `array_search` 结合使用。\n\n这对于[检查值是否存在于关联数组中](http://stackoverflow.com/questions/6990855/php-check-if-value-and-key-exist-in-multidimensional-array/37935356#37935356)特别有用：\n\
  \n![Image00324.jpg](img/Image00324.jpg)\n\n另一个有用的功能是在 PHP 中将自定义对象集合作为数组访问。PHP（>=5.0.0）核心中有两个可用的接口来支持此功能：`ArrayAccess`\
  \ 和 `Iterator`。前者允许你将自定义对象作为数组访问。\n\n##### ArrayAccess\n\n假设我们有一个用户类和一个存储所有用户的数据库表。我们想要创建一个\
  \ `UserCollection` 类，该类将：\n\n1. 允许我们通过用户名唯一标识符来定位特定用户\n2. 对我们的用户集合执行基本操作（并非所有 CRUD，但至少包括创建、检索和删除）\n\
  \n考虑以下源代码（此后我们使用自版本 5.4 起可用的短数组创建语法 `[]`）：\n\n![Image00325.jpg](img/Image00325.jpg)\n\
  ![Image00326.jpg](img/Image00326.jpg)\n\n然后我们可以：\n\n```php\n$users = new UserCollection();\n\
  \nvar_dump(empty($users['testuser']), isset($users['testuser']));\n$users['testuser']\
  \ = [\n    'username' => 'testuser',\n    'password' => 'testpassword',\n    'email'\
  \    => 'test@test.com'\n];\nvar_dump(empty($users['testuser']), isset($users['testuser']),\
  \ $users['testuser']);\nunset($users['testuser']);\nvar_dump(empty($users['testuser']),\
  \ isset($users['testuser']));\n```\n\n假设在我们运行代码之前不存在 `testuser`，这将输出以下内容：\n\n![Image00328.jpg](img/Image00328.jpg)\n\
  \n**重要：** 当你使用 `array_key_exists` 函数检查键是否存在时，`offsetExists` **不会**被调用。因此以下代码将输出两次\
  \ `false`：\n\n```php\nvar_dump(array_key_exists('testuser', $users));\n$users['testuser']\
  \ = [\n    'username' => 'testuser',\n    'password' => 'testpassword',\n    'email'\
  \    => 'test@test.com'\n];\nvar_dump(array_key_exists('testuser', $users));\n```\n\
  \n![Image00329.jpg](img/Image00329.jpg)\n\n##### Iterator\n\n让我们通过添加来自 `Iterator`\
