  \ 2 3 4 5\n\n## 第 81 章：IMAP\n\n#### 第 81.1 节：连接到邮箱\n\n要对 IMAP 账户执行任何操作，首先需要连接到它。为此，你需要指定一些必需的参数：\n\
  \n- 邮件服务器的服务器名称或 IP 地址\n- 你希望连接的端口\n\n| 协议 | 端口 |\n| --- | --- |\n| IMAP | 143 或\
  \ 993 (安全) |\n| POP | 110 或 995 (安全) |\n| SMTP | 25 或 465 (安全) |\n| NNTP | 119 或\
  \ 563 (安全) |\n\n- 连接标志（见下文）\n\n| 标志 | 说明 | 选项 |\n| --- | --- | --- |\n| `service`\
  \ | 使用哪种服务 | `imap`, `pop3`, `nntp`, `smtp` |\n| `user` | 用于在服务器上登录的远程用户名 | |\n\
  | `authuser` | 远程认证用户；如果指定了此项，则使用该用户名的密码（例如管理员） | |\n| `anonymous` | 作为匿名用户远程访问\
  \ | |\n| `debug` | 在应用程序的调试日志中记录协议遥测数据 | |\n| `secure` | 不要通过网络传输明文密码 | |\n| `norsh`\
  \ | 不要使用 rsh 或 ssh 来建立预认证的 IMAP 会话 | |\n| `ssl` | 使用安全套接字层加密会话 | |\n| `validate-cert`\
  \ | 验证来自 TLS/SSL 服务器的证书 | 启用 |\n| `novalidate-cert` | 不验证来自 TLS/SSL 服务器的证书，如果服务器使用自签名证书则需要此项。谨慎使用\
  \ | 禁用 |\n| `tls` | 强制使用 start-TLS 加密会话，并拒绝连接到不支持它的服务器 | |\n| `notls` | 不要使用 start-TLS\
  \ 加密会话，即使服务器支持它 | |\n| `readonly` | 请求以只读模式打开邮箱（仅限 IMAP；在 NNTP 上被忽略，在 SMTP 和 POP3\
  \ 上会报错） | |\n\n你的连接字符串看起来会像这样：\n\n![](img/Image01531.jpg)\n\n请注意，如果连接字符串中的任何字符是非\
  \ ASCII 字符，则必须使用 `utf7_encode($string)` 对其进行编码。\n\n要连接到邮箱，我们使用 `imap_open` 命令，它返回一个指向流的资源值：\n\
  \n![](img/Image01532.jpg)\n\n#### 第 81.2 节：安装 IMAP 扩展\n\n要在 PHP 中使用 [IMAP 函数](http://www.php.net/imap)，你需要安装\
