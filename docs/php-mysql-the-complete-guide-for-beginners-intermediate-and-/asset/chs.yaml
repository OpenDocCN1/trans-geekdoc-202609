  \ |\n| `m` | 月份，数字表示（01 到 12） |\n| `M` | 月份，三个字母表示（Jan, Feb, Mar 等） |\n| `j` | 月份中的第几天，无前导零（1\
  \ 到 31） |\n| `D` | 星期中的第几天，三个字母表示（Mon, Tue, Wed 等） |\n| `h` | 小时（12 小时制）（01 到 12）\
  \ |\n| `H` | 小时（24 小时制）（00 到 23） |\n| `A` | AM 或 PM |\n| `i` | 分钟，带前导零（00 到 59）\
  \ |\n| `s` | 秒，带前导零（00 到 59） |\n\n完整列表可在[此处](http://php.net/manual/en/function.date.php)找到。\n\
