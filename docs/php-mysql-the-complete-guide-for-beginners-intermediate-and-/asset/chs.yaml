  \n# 第 100 章：安全的“记住我”功能\n\n我一直在寻找这个主题，直到发现了 ircmaxell 的这篇帖子 [`stackoverflow.com/a/17266448/4535386`](https://stackoverflow.com/a/17266448/4535386)，我认为它值得更多的关注。\n\
  \n## 第 100.1 节：“保持登录状态” - 最佳方法\n\n存储包含三部分的 cookie。\n\n![](img/Image01670.jpg)\n\n\
  然后，进行验证：\n\n![](img/Image01671.jpg)\n\n## 第 101 章：安全\n\n由于大多数网站运行在 PHP 上，应用程序安全是\
  \ PHP 开发人员保护其网站、数据和客户的重要课题。本主题涵盖 PHP 中的最佳安全实践，以及常见漏洞和弱点，并附带 PHP 示例修复方案。\n\n## 第\
  \ 101.1 节：PHP 版本泄露\n\n默认情况下，PHP 会向外界透露您正在使用的 PHP 版本，例如：\n\n![](img/Image01672.jpg)\n\
  \n要修复此问题，您可以更改 `php.ini`：\n\n![](img/Image01673.jpg)\n\n或者更改 header：\n\n\n\n\n#\
  \ 第 101.2 节：跨站脚本攻击 (XSS)\n\n## 问题\n\n跨站脚本攻击是指 Web 客户端非预期地执行远程代码。如果 Web 应用程序接受用户输入并直接将其输出到网页上，则可能会暴露于\
  \ XSS 攻击之下。如果输入包含 HTML 或 JavaScript，当 Web 客户端渲染此内容时，远程代码即可被执行。\n\n例如，如果第三方网站包含一个\
  \ JavaScript 文件：\n\n![](img/Image01677.jpg)\n\n而某 PHP 应用程序直接输出传入给它的字符串：\n\n![](img/Image01678.jpg)\n\
  \n| `<script src = \"http://example.com/runme.js\"> </script>` |\n| --- |\n\n如果未经检查的\
  \ GET 参数包含 `>`，则 PHP 脚本的输出将变为：\n\n![](img/Image01679.jpg)\n\n第三方 JavaScript 将会运行，用户将在网页上看到\
  \ \"I'm running\"（我正在运行）。\n\n## 解决方案\n\n作为一条通用规则，**永远不要信任来自客户端的输入**。每一个 GET、POST\
  \ 和 Cookie 值都可能是任意内容，因此都应当经过验证。在输出这些值中的任何一个时，请对其进行转义，以免它们以意想不到的方式被解析执行。\n\n请记住，即使在最简单的应用程序中，数据也会被四处移动，很难追踪所有来源。因此，**始终转义输出**是一项最佳实践。\n\
  \nPHP 提供了几种根据上下文转义输出的方法。\n\n### 过滤函数\n\n[PHP 的过滤函数](http://php.net/manual/en/ref.filter.php)允许以[多种方式](http://php.net/manual/en/filter.filters.php)对传入\
  \ PHP 脚本的输入数据进行[清理](http://php.net/manual/en/filter.filters.sanitize.php)或[验证](http://php.net/manual/en/filter.filters.validate.php)。它们在保存或输出客户端输入时非常有用。\n\
  \n### HTML 编码\n\n`htmlspecialchars` 会将任何 \"HTML 特殊字符\" 转换为其 HTML 实体编码，这意味着它们随后不会被作为标准\
  \ HTML 处理。使用此方法修复我们之前的示例：\n\n![](img/Image01680.jpg)\n\n将输出：\n\n![](img/Image01681.jpg)\n\
  \n```\n<div> &lt; script src= &quot; http://example.com/runme.js &quot;&gt;&lt;\
  \ /script &gt; </div>\n```\n\n| `<div>` |\n| --- |\n\n`>` 标签内的所有内容将不会被浏览器解释为 JavaScript\
  \ 标签，而是作为简单的文本节点。用户将安全地看到：\n\n![](img/Image01682.jpg)\n\n### URL 编码\n\n当输出动态生成的\
  \ URL 时，PHP 提供了 `urlencode` 函数以安全地输出有效的 URL。因此，例如，如果用户输入的数据成为另一个 GET 参数的一部分：\n\n\
  ![](img/Image01683.jpg)\n\n任何恶意输入都将被转换为编码后的 URL 参数。\n\n### 使用专业的外部库或 OWASP AntiSamy\
  \ 列表\n\n有时您可能希望允许发送 HTML 或其他类型的代码输入。您将需要维护一个授权词汇列表（白名单）和一个未授权词汇列表（黑名单）。\n\n您可以从\
  \ [OWASP AntiSamy 网站](https://www.owasp.org/index.php/Category:OWASP_AntiSamy_Project)\
  \ 下载标准列表。每个列表都适用于特定类型的交互（eBay API、tinyMCE 等）。并且它们是开源的。\n\n存在一些库可用于过滤 HTML 并防止一般情况下的\
  \ XSS 攻击，其表现至少与 AntiSamy 列表相当，且使用非常简便。例如 [HTML Purifier](http://htmlpurifier.org/)。\n\
  \n#### 第 101.3 节：跨站请求伪造\n\n## 问题\n\n| `delete.php?accnt=12` |\n| --- |\n\n跨站请求伪造\
  \ (CSRF) 可强制最终用户在不知情的情况下向 Web 服务器生成恶意请求。此攻击向量可在 POST 和 GET 请求中均被利用。假设 URL 端点 `/delete.php`\
  \ 根据 GET 请求的 `accnt` 参数删除账户。现在，如果一位已认证用户在任何其他应用程序中遇到以下脚本：\n\n![](img/Image01684.jpg)\n\
  \n```\n<img src = \"http://domain.com/delete.php?accnt=12\" width = \"0\" height\
  \ = \"0\" border = \"0\" >\n```\n\n该账户将被删除。\n\n## 解决方案\n\n解决此问题的常用方法是使用 CSRF 令牌。CSRF\
  \ 令牌被嵌入请求中，以便 Web 应用程序能够信任该请求来自预期来源，且属于应用程序正常工作流的一部分。首先，用户执行某项操作（如查看表单），触发创建一个唯一令牌。\n\
  \n实现此功能的示例表单可能如下所示：\n\n![](img/Image01685.jpg)\n\n随后，服务器可在表单提交后根据用户会话验证该令牌，从而排除恶意请求。\n\
  \n### 示例代码\n\n以下是基本实现的示例代码：\n\n![](img/Image01686.jpg)\n![](img/Image01687.jpg)\n\
  \n已有许多库和框架提供了各自的 CSRF 验证实现。虽然这是 CSRF 的简单实现，但您需要编写一些代码以动态重新生成 CSRF 令牌，防止 CSRF 令牌被窃取和固定。\n\
  \n#### 第 101.4 节：命令行注入\n\n## 问题\n\n正如 SQL 注入允许攻击者在数据库上执行任意查询一样，命令行注入允许某人在 Web 服务器上运行不受信任的系统命令。如果服务器安全配置不当，这将使攻击者完全控制系统。\n\
  \n假设某脚本允许用户列出 Web 服务器上的目录内容。\n\n![](img/Image01688.jpg)\n\n（在实际应用中，应使用 PHP 的内置函数或对象来获取路径内容。此示例仅用于简单的安全演示。）\n\
  \n| `tmp`。但由于允许任意输入，路径可能是 `; rm -fr` |\n| --- |\n\n人们期望获得的路径参数类似于 `//tmp`。\n\nWeb\
  \ 服务器将执行命令：\n\n![](img/Image01689.jpg)\n\n并尝试从服务器根目录删除所有文件。\n\n## 解决方案\n\n| `escapeshellarg()`\
  \ 或 `escapeshellcmd()` |\n| --- |\n\n所有命令参数必须使用 `escapeshellarg()` 进行转义。这会使参数变得不可执行。对于每个参数，输入值也应经过验证。\n\
  \n在最简单的情况下，我们可以用以下方式保护示例：\n\n![](img/Image01690.jpg)\n![](img/Image01691.jpg)\n\n\
  沿用之前尝试删除文件的示例，执行的命令变为：\n\n![](img/Image01692.jpg)\n\n该字符串仅作为参数传递给 `ls`，而不是终止 `ls`\
  \ 命令并运行 `rm`。\n\n应注意，上述示例现在虽免受命令注入攻击，但**不**防目录遍历。要修复此问题，应检查规范化路径是否以期望的子目录开头。\n\n\
  PHP 提供了多种执行系统命令的函数，包括 `exec`、`passthru`、`proc_open`、`shell_exec` 和 `system`。所有这些函数的输入都必须经过仔细验证和转义。\n\
  \n#### 第 101.5 节：剥离标签\n\n如果您知道如何使用，[`strip_tags`](http://php.net/manual/en/function.strip-tags.php)\
  \ 是一个非常强大的函数。作为预防跨站脚本攻击的方法，有更好的方法，如字符编码，但在某些情况下剥离标签很有用。\n\n## 基本示例\n\n![](img/Image01693.jpg)\n\
  \n原始输出：\n\n![](img/Image01694.jpg)\n\n## 允许标签\n\n| `<b>` |\n| --- |\n\n假设您想允许某个特定标签但不允许其他标签，则可在函数的第二个参数中指定。此参数是可选的。在我的示例中，我只希望\
  \ `>` 标签被保留通过。\n\n![](img/Image01695.jpg)\n\n原始输出：\n\n![](img/Image01696.jpg)\n\n\
  ##### 注意事项\n\n\n\n\n\n# HTML 注释和 PHP 标签\n\nHTML 注释和 PHP 标签也会被剥离。这是硬编码的，无法通过 `allowable_tags`\
  \ 更改。\n\n| `<br>` | `>` | `<br/>` |\n| --- | --- | --- |\n\n在 PHP 5.3.4 及更高版本中，自闭合\
  \ XHTML 标签会被忽略，因此在 `allowable_tags` 中应仅使用非自闭合标签。例如，要同时允许 `<br>` 和 `<br/>`，应使用：\n\
  \n```\nallowable_tags = \"<br><br/>\"\n```\n\n## 第 101 章：安全\n\n#### 第 101.6 节：文件包含\n\
  \n### 远程文件包含\n\n远程文件包含（也称为 RFI）是一种允许攻击者包含远程文件的漏洞类型。\n\n此示例注入了一个包含恶意代码的远程托管文件：\n\n\
  ```\ninclude($_GET['file']);\n```\n\n### 本地文件包含\n\n本地文件包含（也称为 LFI）是通过 Web 浏览器在服务器上包含文件的过程。\n\
  \n```\ninclude(\"includes/\" . $_GET['page'] . \".php\");\n```\n\n### RFI 和 LFI\
  \ 的解决方案\n\n建议仅允许包含你批准的文件，并仅限于这些文件。\n\n```\n$allowed = array('page1', 'page2', 'page3');\n\
  if (in_array($_GET['page'], $allowed)) {\n    include($_GET['page'] . '.php');\n\
  }\n```\n\n#### 第 101.7 节：错误报告\n\n默认情况下，如果脚本中发生意外情况，PHP 会直接在页面上输出错误、警告和通知消息。这对于解决脚本的特定问题很有用，但同时也会输出你不想让用户知道的信息。\n\
  \n因此，在生产环境中，避免显示那些会泄露服务器信息（例如目录树）的消息是一种良好的实践。在开发或测试环境中，这些消息可能仍然有利于显示以进行调试。\n\n###\
  \ 快速解决方案\n\n你可以将它们关闭，使消息完全不显示，但这会使调试脚本变得更难。\n\n```\nini_set('display_errors', 0);\n\
  ```\n\n或直接在 `php.ini` 中更改它们：\n\n```\ndisplay_errors = 0\n```\n\n### 错误处理\n\n一个更好的选择是将这些错误消息存储在一个更有用的地方，比如数据库：\n\
  \n```\nset_error_handler(function ($errno, $errstr, $errfile, $errline) {\n    //\
  \ 记录到数据库\n    $db->query(\"INSERT INTO error_log (message, file, line) VALUES (?,\
  \ ?, ?)\", [$errstr, $errfile, $errline]);\n    return true; // 阻止默认处理程序\n});\n\
  ```\n\n此方法将消息记录到数据库，如果失败则记录到文件，而不是直接回显到页面中。这样你可以追踪用户在你网站上遇到的问题，并在出错时立即收到通知。\n\n\
  #### 第 101.8 节：上传文件\n\n如果你想让用户向你的服务器上传文件，在实际将上传的文件移动到 Web 目录之前，你需要进行一些安全检查。\n\n\
  ### 上传的数据\n\n`$_FILES` 数组包含用户提交的数据，并非文件本身的信息。虽然通常这些数据由浏览器生成，但可以使用软件轻松地向同一表单发起 POST\
  \ 请求。\n\n```\n$_FILES['userfile']['name']\n$_FILES['userfile']['type']\n$_FILES['userfile']['tmp_name']\n\
  $_FILES['userfile']['error']\n$_FILES['userfile']['size']\n```\n\n### 利用文件名\n\n\
  通常操作系统不允许文件名中包含特定字符，但通过伪造请求可以添加这些字符，从而导致意外情况发生。例如，将文件命名为：\n\n```\n../script.php%00.png\n\
  ```\n\n仔细观察该文件名，你应该会注意到几点。\n\n1.  首先注意到的是 `../`，这在文件名中是完全非法的，但如果你要将文件从一个目录移动到另一个目录，这却完全没问题，对吧？\n\
  2.  你可能认为你在脚本中正确验证了文件扩展名，但此漏洞利用依赖于 URL 解码，将 `%00` 转换为空字符，基本上告诉操作系统字符串到此结束，从而从文件名中剥离\
  \ `.png`。\n\n所以现在我已将 `script.php` 上传到另一个目录，绕过了简单的文件扩展名验证。它还绕过了禁止在上传目录中执行脚本的 `.htaccess`\
  \ 文件。\n\n### 安全地获取文件名和扩展名\n\n你可以使用 `pathinfo()` 以安全的方式推断名称和扩展名，但首先我们需要替换文件名中的不需要字符：\n\
  \n```\n$filename = basename($_FILES['userfile']['name']);\n$filename = preg_replace('/[^a-zA-Z0-9._-]/',\
  \ '', $filename);\n$pathinfo = pathinfo($filename);\n$extension = $pathinfo['extension'];\n\
  ```\n\n虽然现在我们有了可用于存储的文件名和扩展名，但我仍然倾向于将该信息存储在数据库中，并给该文件一个生成的名称，例如 `md5(uniqid() .\
  \ microtime())`：\n\n```\n$newFilename = md5(uniqid() . microtime());\nmove_uploaded_file($_FILES['userfile']['tmp_name'],\
  \ '/uploads/' . $newFilename);\n```\n\n| id | title | extension | mime | size |\
  \ filename | time |\n| --- | --- | --- | --- | --- | --- | --- |\n| 1 | myfile |\
  \ txt | text/plain | 1020 | 5bcdaeddbfbd2810fa1b6f3118804d66 | 2017-03-11 00:38:54\
  \ |\n\n这将解决重复文件名和文件名中不可预见的漏洞问题。这也会导致攻击者必须猜测文件存储在哪里，因为他或她无法专门针对该文件进行执行。\n\n### MIME\
  \ 类型验证\n\n检查文件扩展名以确定文件类型是不够的，因为文件可能命名为 `image.png`，但很可能包含 PHP 脚本。通过将上传文件的 MIME 类型与文件扩展名进行对比，可以验证文件是否包含其名称所指的内容。\n\
  \n你甚至可以更进一步来验证图像，即实际打开它们：\n\n```\n$imageInfo = getimagesize($_FILES['userfile']['tmp_name']);\n\
  if ($imageInfo === false) {\n    die('Not a valid image');\n}\n```\n\n你可以使用内置的 `mime_content_type()`\
  \ 函数或 `finfo` 类来获取 MIME 类型。\n\n### 为上传文件建立白名单\n\n最重要的是，你应该根据每个表单对文件扩展名和 MIME 类型建立白名单。\n\
  \n```\n$allowedMimes = ['image/jpeg', 'image/png', 'image/gif'];\n$allowedExts =\
  \ ['jpg', 'jpeg', 'png', 'gif'];\n\n$finfo = new finfo(FILEINFO_MIME_TYPE);\n$mime\
  \ = $finfo->file($_FILES['userfile']['tmp_name']);\n$ext = strtolower(pathinfo($_FILES['userfile']['name'],\
  \ PATHINFO_EXTENSION));\n\nif (!in_array($mime, $allowedMimes) || !in_array($ext,\
  \ $allowedExts)) {\n    die('Invalid file type');\n}\n```\n\n## 第 102 章：密码学\n\n\
  ## 第 102.1 节：使用 OpenSSL 对大文件进行对称加密和解密\n\nPHP 缺少用于加密和解密大文件的内置函数。`openssl_encrypt()`\
  \ 可用于加密字符串，但将巨大的文件加载到内存中是个坏主意。\n\n所以我们必须编写一个用户空间函数来实现。此示例使用对称 AES-128-CBC 算法加密大文件的较小块，并将它们写入另一个文件。\n\
  \n### 加密文件\n\n```\nfunction encryptFile($source, $dest, $password) {\n    $method\
  \ = \"aes-128-cbc\";\n    $ivLength = openssl_cipher_iv_length($method);\n    $iv\
  \ = openssl_random_pseudo_bytes($ivLength);\n    $key = hash('sha256', $password,\
  \ true);\n    \n    $fpSource = fopen($source, 'rb');\n    $fpDest = fopen($dest,\
  \ 'wb');\n    \n    fwrite($fpDest, $iv);\n    \n    while (!feof($fpSource)) {\n\
  \        $buffer = fread($fpSource, 8192);\n        $encrypted = openssl_encrypt($buffer,\
  \ $method, $key, OPENSSL_RAW_DATA, $iv);\n        fwrite($fpDest, $encrypted);\n\
  \    }\n    \n    fclose($fpSource);\n    fclose($fpDest);\n}\n```\n\n### 解密文件\n\
  \n要解密使用上述函数加密的文件，可以使用此函数。\n\n```\nfunction decryptFile($source, $dest, $password)\
  \ {\n    $method = \"aes-128-cbc\";\n    $ivLength = openssl_cipher_iv_length($method);\n\
  \    $key = hash('sha256', $password, true);\n    \n    $fpSource = fopen($source,\
  \ 'rb');\n    $fpDest = fopen($dest, 'wb');\n    \n    $iv = fread($fpSource, $ivLength);\n\
  \    \n    while (!feof($fpSource)) {\n        $buffer = fread($fpSource, 8192);\n\
  \        $decrypted = openssl_decrypt($buffer, $method, $key, OPENSSL_RAW_DATA,\
  \ $iv);\n        fwrite($fpDest, $decrypted);\n    }\n    \n    fclose($fpSource);\n\
  \    fclose($fpDest);\n}\n```\n\n### 如何使用\n\n如果你需要一小段代码片段来了解其工作原理或测试上述函数，请查看以下代码。\n\
  \n```\n$password = 'secret_password';\n$plainFile = 'testfile.txt';\n$encryptedFile\
  \ = 'testfile.txt.enc';\n$decryptedFile = 'testfile.txt.dec';\n\nfile_put_contents($plainFile,\
  \ 'This is a test file content.');\n\nencryptFile($plainFile, $encryptedFile, $password);\n\
  decryptFile($encryptedFile, $decryptedFile, $password);\n\necho file_get_contents($decryptedFile);\
  \ // Should output: This is a test file content.\n```\n\n这将创建三个文件：\n\n1.  `testfile.txt`\
  \ 包含明文\n2.  `testfile.txt.enc` 包含加密文件\n3.  `testfile.txt.dec` 包含解密文件。其内容应与 `testfile.txt`\
  \ 相同\n\n#### 第 102.2 节：对称密码\n\n此示例演示了 CBC 模式下的 AES 256 对称密码。需要初始化向量，因此我们使用 openssl\
  \ 函数生成一个。变量 `$strong` 用于确定生成的 IV 是否具有加密学强度。\n\n### 加密\n\n```\n$method = \"aes-256-cbc\"\
  ; // 密码方法\n$iv_length = openssl_cipher_iv_length($method); // 获取所需的 IV 长度\n$strong\
  \ = false; // 设为 false 供下一行使用\n$iv = openssl_random_pseudo_bytes($iv_length, $strong);\
  \ // 生成初始化向量\n\n/* 注意：稍后需要检索 IV，因此将其存储在数据库中。但是，不要重复使用相同的 IV 来再次加密数据。 */\n\nif (!$strong)\
  \ { // 如果 IV 不具备加密学强度则抛出异常\n    throw new Exception(\"IV not cryptographically strong!\"\
  );\n}\n\n$data = \"This is a message to be secured.\"; // 我们的秘密消息\n$pass = \"Stack0verfl0w\"\
  ; // 我们的密码\n\n/* 注意：密码应通过 HTTPS 会话以 POST 方式提交。 */\n```\n\n\n\n\n这里，它被存储在一个变量中用于演示目的。\
  \ \\*/\n\n`$enc_data = openssl_encrypt($data, $method, $password, true, $iv);` //\
  \ 加密\n\n## 解密\n\n/\\* 从数据库检索 IV，并从 POST 请求获取密码 \\*/\n\n![](img/Image01713.jpg)\n\
  `$dec_data = openssl_decrypt($enc_data, $method, $pass, true, $iv);` // 解密\n\n##\
  \ Base64 编码与解码\n\n| `base64_encode()` | | `base64_decode()` |\n| --- | --- | ---\
  \ |\n\n如果加密数据需要以可打印文本的形式发送或存储，则应分别使用 `base64_encode()` 和 `base64_decode()` 函数。\n\
  \n![](img/Image01714.jpg)\n\n## 第 103 章：密码哈希函数\n\n随着更安全的 Web 服务避免以明文格式存储密码，PHP 等语言提供了各种（不可解密的）哈希函数来支持更安全的行业标准。本主题提供了在\
  \ PHP 中正确哈希的文档。\n\n#### 第 103.1 节：创建密码哈希\n\n| `password_hash()` |\n| --- |\n\n使用\
  \ `password_hash()` 创建密码哈希，以采用当前行业最佳实践标准的哈希或密钥派生。在撰写本文时，标准是 [bcrypt](https://en.wikipedia.org/wiki/Bcrypt)，这意味着\
  \ `PASSWORD_DEFAULT` 包含相同的值。\n\n![](img/Image01715.jpg)\n\n第三个参数不是强制性的。\n\n'cost'\
  \ 值应根据您的生产服务器硬件来选择。增加它将使密码生成的成本更高。生成成本越高，任何试图破解它的人生成它所需的时间也就越长。成本理想情况下应尽可能高，但在实践中，应设置为不会使所有操作过度变慢。0.1\
  \ 到 0.4 秒之间是可以接受的。如果不确定，请使用默认值。\n\n### 版本 < 5.5\n\n| `password_*` |\n| --- |\n\n\
  在低于 5.5.0 的 PHP 版本中，`password_*` 函数不可用。您应该使用 [兼容包](https://github.com/ircmaxell/password_compat)\
  \ 来替代这些函数。请注意，兼容包需要 PHP 5.3.7 或更高版本，或已回移植 `$2y` 修复的版本（如 RedHat 提供的版本）。\n\n| `crypt()`\
  \ | | 作为 `password_hash()` |\n| --- | --- | --- |\n\n| `crypt()` |\n| --- |\n\n\
  如果您无法使用那些函数，可以使用 `crypt()` 实现密码哈希。由于 `password_hash()` 是作为 `crypt()` 函数的封装器实现的，因此您无需损失任何功能。\n\
  \n```php\n// 这是一个简单的 bcrypt 哈希实现，其他方面与\n// `password_hash()` 兼容\n// 不保证保持完整 `password_hash()`\n\
  // 实现的相同加密强度\n// 如果 `CRYPT_BLOWFISH` 为 1，意味着 bcrypt（使用 blowfish）\n// 在您的系统上可用\n\
  if (CRYPT_BLOWFISH == 1) {\n    $salt = mcrypt_create_iv(16, MCRYPT_DEV_URANDOM);\n\
  \    $salt = base64_encode($salt);\n    // crypt 使用一种修改过的 base64 变体\n    $source\
  \ = 'ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789+/';\n    $dest\
  \ = './ABCDEFGHIJKLMNOPQRSTUVWXYZabcdefghijklmnopqrstuvwxyz0123456789';\n    $salt\
  \ = strtr(rtrim($salt, '='), $source, $dest);\n    $salt = substr($salt, 0, 22);\n\
  \n    // `crypt()` 通过传入的 salt 字符串的形式\n    // 来确定使用哪种哈希算法\n    $hashedPassword =\
  \ crypt($plaintextPassword, '$2y$10$' . $salt . '$');\n}\n```\n\n![](img/Image01716.jpg)\n\
  \n### 密码哈希的 Salt\n\n尽管 crypt 算法可靠，但仍然容易受到 [彩虹表](https://en.wikipedia.org/wiki/Rainbow_table)\
  \ 攻击。这就是为什么建议使用 salt 的原因。\n\nSalt 是在哈希前附加到密码上的某些数据，以使源字符串唯一。给定两个相同的密码，由于它们的 salt\
  \ 是唯一的，因此生成的哈希也将是唯一的。\n\n随机 salt 是您密码安全最重要的组成部分之一。这意味着即使拥有已知密码哈希的查找表，攻击者也无法将您用户的密码哈希与数据库中的密码哈希匹配，因为使用了随机\
  \ salt。您应该始终使用随机且加密安全的 salt。[阅读更多](http://www.springer.com/us/book/9781484221198)\n\
  \n| `password_hash()` |\n| --- |\n\n使用 `password_hash()` 的 bcrypt 算法，明文 salt 会与生成的哈希一起存储，这意味着哈希可以在不同的系统和平台间传输，仍然可以针对原始密码进行验证。\n\
  \n### 版本 < 7.0\n\n尽管不鼓励这样做，但您可以使用 salt 选项来定义您自己的随机 salt。\n\n![](img/Image01717.jpg)\n\
  \n**重要。** 如果省略此选项，`password_hash()` 将为每个哈希密码生成一个随机 salt。这是预期的操作模式。\n\n### 版本 ≥ 7.0\n\
  \n自 PHP 7.0.0 起，salt 选项已被[弃用](http://php.net/manual/ru/function.password-hash.php)。现在首选直接使用默认生成的\
  \ salt。\n\n## 第 103.2 节：确定现有密码哈希是否可以升级为更强的算法\n\n如果您使用 `PASSWORD_DEFAULT` 方法让系统选择最佳算法来哈希您的密码，随着默认算法强度的增加，您可能希望在用户登录时重新哈希旧密码。\n\
  \n![](img/Image01718.jpg)\n\n如果您的系统上没有 `password_*` 函数（并且您无法使用下方备注中链接的兼容包），您可以通过类似以下的方法来确定创建原始哈希所使用的算法和\
  \ cost：\n\n![](img/Image01719.jpg)\n\n## 第 103.3 节：根据哈希验证密码\n\n| `password_verify()`\
  \ |\n| --- |\n\n`password_verify()` 是（自 PHP 5.5 起）提供的内置函数，用于根据已知哈希验证密码的有效性。\n\n\
  ![](img/Image01720.jpg)\n\n所有支持的哈希算法都在哈希本身中存储了标识所用哈希的信息，因此无需指明您用于编码明文密码的算法。\n\n\
  | `crypt()` |\n| --- |\n\n如果您的系统上没有 `password_*` 函数（并且您无法使用下方备注中链接的兼容包），您可以使用 `crypt()`\
  \ 函数实现密码验证。请注意，必须采取特定预防措施以避免 [时序攻击](https://en.wikipedia.org/wiki/Timing_attack)。\n\
  \n![](img/Image01721.jpg)\n\n# 第 104 章：为 PHP 手册做贡献\n\nPHP 手册提供了函数参考和语言参考，以及对 PHP\
  \ 主要特性的解释。与大多数语言的文档不同，PHP 手册鼓励 PHP 开发者向文档的每一页添加他们自己的示例和注释。本主题解释了向 PHP 手册做贡献的方法，以及最佳实践的提示、技巧和指南。\n\
  \n#### 第 104.1 节：改进官方文档\n\nPHP 已经在 [`php.net/manual/`](http://php.net/manual/) 拥有了出色的官方文档。PHP\
  \ 手册记录了几乎所有语言特性、核心库和大多数可用扩展。有大量示例可供学习。\n\nPHP 手册提供多种语言和格式。\n\n最重要的是，文档可供任何人免费编辑。\n\
  \nPHP 文档组在 [`edit.php.net`](https://edit.php.net/) 为 PHP 手册提供了一个在线编辑器。它支持多种单点登录服务，包括使用您的\
  \ Stack Overflow 账户登录。您可以在 [`wiki.php.net/doc/editor`](https://wiki.php.net/doc/editor)\
  \ 找到编辑器的介绍。\n\n\n\n\n\n对 PHP 手册的修改需要由拥有 Doc Karma 的 PHP 文档组成员批准。Doc Karma 有点像声望，但更难获得。这种同行评审流程确保只有事实正确的信息才能进入\
  \ PHP 手册。\n\nPHP 手册是用 DocBook 编写的，这是一种易于学习的、用于撰写书籍的标记语言。乍一看可能有点复杂，但有模板可以帮你入门。你肯定不需要成为\
  \ DocBook 专家就能做出贡献。\n\n#### 第 104.2 节：为手册做贡献的技巧\n\n以下是为那些希望为 PHP 手册做贡献的人提供的技巧列表：\n\
  \n遵循手册的风格指南。确保始终遵循[手册的风格指南](http://doc.php.net/tutorial/style.php)，以保持一致性。\n\n执行拼写和语法检查。确保使用正确的拼写和语法——否则所呈现的信息可能更难以吸收，且内容看起来会不够专业。\n\
  \n解释要简练。避免啰嗦，以便清晰简洁地向希望快速查阅的开发者呈现信息。\n\n将代码与其输出分开。这能为开发者提供更整洁、不那么繁杂的代码示例以供理解。\n\n\
  检查页面章节顺序。确保被编辑的手册页面的所有章节都按正确的顺序排列。手册的统一性使其更易于快速阅读和查找信息。\n\n移除 PHP 4 相关内容。考虑到 PHP\
  \ 4 现在已经非常古老，具体提及 PHP 4 的内容已不再相关。应从手册中移除对它的提及，以防止用不必要的信息使手册变得繁杂。\n\n正确设置文件版本。在文档中创建新文件时，确保文件的修订\
  \ ID 设置为空，如下所示：\n\n```\n<!-- $Revision$ -->\n```\n\n将有用的评论合并到手册中。一些评论贡献了手册可受益的有用信息。这些应被合并到主页面的内容中。\n\
  \n不要破坏文档构建。在提交更改前，始终确保 PHP 手册能正确构建。\n\n# 第 105 章：为 PHP 核心做贡献\n\n## 第 105.1 节：设置基本开发环境\n\
  \nPHP 的源代码托管在 [GitHub](https://github.com/php/php-src) 上。要从源代码构建，你首先需要检出一份工作副本。\n\
  \n如果你想添加功能，最好创建你自己的分支。\n\n最后，配置并构建 PHP。\n\n如果因缺少依赖项而导致配置失败，你将需要使用操作系统的包管理系统来安装它们（例如\
  \ `yum`、`apt` 等），或者下载并从源代码编译它们。\n\n# 附录 A：在 Windows 上安装 PHP 环境\n\n## 第 A.1 节：下载、安装和使用\
  \ WAMP\n\nWampServer 是一个 Windows Web 开发环境。它允许你使用 Apache2、PHP 和 MySQL 数据库创建 Web 应用程序。此外，PhpMyAdmin\
  \ 允许你轻松管理数据库。\n\nWampServer 有两个不同的版本可免费获得（基于 GPML 许可证）：32 位和 64 位。WampServer 2.5\
  \ 与 Windows XP 不兼容，无论是否带 SP3，也不兼容 Windows Server 2003。旧版本的 WampServer 可在 [SourceForge](https://sourceforge.net/projects/wampserver/files/)\
  \ 上找到。\n\nWampServer 版本：\n\n*   [WampServer (64 位) 3](https://sourceforge.net/projects/wampserver/files/WampServer%203/WampServer%203.0.0/wampserver3.0.4_x64_apache2.4.18_mysql5.7.11_php5.6.19-7.0.4.exe/download)\n\
  *   [WampServer (32 位) 3](https://sourceforge.net/projects/wampserver/files/WampServer%203/WampServer%203.0.0/wampserver3.0.4_x86_apache2.4.18_mysql5.7.11_php5.6.19-7.0.4.exe/download)\n\
  \n当前提供：\n\n*   Apache: 2.4.18\n*   MySQL: 5.7.11\n*   PHP: 5.6.19 & 7.0.4\n\n安装很简单，只需运行安装程序，选择位置并完成即可。\n\
  \n完成后，你可以启动 WampServer。然后它会在系统托盘（任务栏）中启动，最初为红色，服务器启动后变为绿色。\n\n你可以打开浏览器并输入 `localhost`\
  \ 或 `127.0.0.1` 以获取 WAMP 的索引页面。从现在起，你可以通过将文件存储在 `PATH_TO_WAMP/www/<php_or_html_file>`\
  \ 中，并在 `http://localhost/<php_or_html_file_name>` 上查看结果，在本地处理 PHP 文件。\n\n## 第 A.2\
  \ 节：安装 PHP 并配合 IIS 使用\n\n首先，你需要在机器上安装并运行 IIS（Internet Information Services）；IIS\
  \ 默认不可用，你必须从控制面板 -> 程序 -> Windows 功能 中添加该特性。\n\n1.  从 [`windows.php.net/download/`](http://windows.php.net/download/)\
  \ 下载你喜欢的 PHP 版本，并确保下载 PHP 的非线程安全（NTS）版本。\n2.  将文件解压到 `C:\\PHP\\`。\n3.  打开 Internet\
  \ Information Services (IIS) 管理器。\n4.  在左侧面板中选择根项目。\n5.  双击“处理程序映射”。\n6.  在右侧面板点击“添加模块映射”。\n\
  7.  按如下方式设置值：\n    *   安装 `vcredist_x64.exe` 或 `vcredist_x86.exe`（Visual C++ 2012\
  \ 可再发行组件），从 [`www.microsoft.com/en-US/download/details.aspx?id=30679`](https://www.microsoft.com/en-US/download/details.aspx?id=30679)\n\
  8.  设置你的 `C:\\PHP\\php.ini`，特别是设置 `extension_dir = \"C:\\PHP\\ext\"`。\n9.  重置 IIS：在\
  \ DOS 命令控制台中输入 `IISRESET`。\n\n你也可以选择安装 [PHP Manager for IIS](https://phpmanager.codeplex.com/)，它对设置\
  \ ini 文件和跟踪错误日志很有帮助（在 Windows 10 上不工作）。\n\n记得将 `index.php` 设置为 IIS 的默认文档之一。\n\n\
  如果你遵循了安装指南，现在你已经准备好测试 PHP 了。\n\n就像 Linux 一样，IIS 在服务器上有一个目录结构，这棵树的根目录是 `C:\\inetpub\\\
  wwwroot\\`，这是所有公共文件和 PHP 脚本的入口点。\n\n现在使用你喜欢的编辑器，或者只是 Windows 记事本，输入以下内容：\n\n```\n\
  <?php phpinfo(); ?>\n```\n\n将文件以 UTF-8 格式（无 BOM）保存到 `C:\\inetpub\\wwwroot\\index.php`。\n\
  \n然后在浏览器中使用此地址打开你全新的网站：[`localhost/index.php`](http://localhost/index.php)\n\n##\
  \ 第 A.3 节：下载并安装 XAMPP\n\n什么是 XAMPP？\n\nXAMPP 是最流行的 PHP 开发环境。XAMPP 是一个完全免费、开源且易于安装的\
  \ Apache 发行版，包含 MariaDB、PHP 和 Perl。\n\n我应该从哪里下载？\n\n从[他们的下载页面](http://www.apachefriends.org/download.html)下载合适的稳定\
  \ XAMPP 版本。根据操作系统类型（32 位或 64 位及操作系统版本）以及它必须支持的 PHP 版本选择下载。\n\n当前最新版本为 [XAMPP for\
  \ Windows 7.0.8 / PHP 7.0.8](http://www.apachefriends.org/xampp-files/7.0.8/xampp-win32-7.0.8-0-VC14-installer.exe)。\n\
  \n或者你可以遵循以下方式：\n\nXAMPP for Windows 有三种不同的形式：\n\n*   exe 格式\n*   zip 格式\n*   7zip\
  \ 格式\n\n*   [安装程序](https://sourceforge.net/projects/xampp/files/XAMPP%20Windows/7.0.8/xampp-portable-win32-7.0.8-0-VC14-installer.exe/download)（可能是安装\
  \ XAMPP 最简单的方法）\n*   [ZIP](https://sourceforge.net/projects/xampp/files/XAMPP%20Windows/7.0.8/xampp-portable-win32-7.0.8-0-VC14.zip/download)（给纯粹主义者：作为普通\
  \ ZIP 归档的 XAMPP）\n\n\n\n\n\n# XAMPP Windows 安装指南\n\n## 下载选项\n- **[7zip](https://sourceforge.net/projects/xampp/files/XAMPP%20Windows/7.0.8/xampp-portable-win32-7.0.8-0-VC14.7z/download)**：适合带宽较低的纯粹主义者（XAMPP\
  \ 7zip 压缩包）。\n\n## 如何安装以及将 PHP/HTML 文件放在哪里？\n\n### 方法 1：使用提供的安装程序安装\n1. 双击下载的 `.exe`\
  \ 文件执行 XAMPP 服务器安装程序。\n\n### 方法 2：从 ZIP 压缩包安装\n1. 将 zip 压缩包解压到您选择的文件夹中。\n2. XAMPP\
  \ 将解压到所选目标目录下的 `\\xampp` 子目录中。\n3. 现在启动文件 `setup_xampp.bat` 以将 XAMPP 配置调整为您的系统。\n\
  \n> **注意：** 如果您选择根目录 `C:\\` 作为目标，则不得启动 `setup_xampp.bat`。\n\n## 安装后\n使用 **“XAMPP\
  \ 控制面板”** 执行其他任务，如启动/停止 Apache、MySQL、FileZilla 和 Mercury，或将这些安装为服务。\n\n## 文件处理\n\
  安装过程非常简单。完成后，您可以将要在服务器上托管的 HTML/PHP 文件添加到 `XAMPP\\root\\htdocs\\` 中。然后启动服务器并在浏览器中打开\
  \ `http://localhost/file.php` 以查看页面。\n\n> **注意：** Windows 中默认的 XAMPP 根目录是 `C:\\\
  xampp\\htdocs`。\n\n在您喜爱的 Web 浏览器中输入以下 URL 之一：\n- `http://localhost`\n- `http://127.0.0.1`\n\
  \n现在您应该能看到 XAMPP 启动页面。\n\n---\n\n# 附录 B：在 Linux/Unix 环境中安装\n\n## 第 B.1 节：使用 APT\
  \ 通过命令行安装 PHP 7\n\n```bash\nsudo add-apt-repository ppa:ondrej/php\n```\n\n> **注意：**\
  \ 这将仅安装 PHP。如果您希望向 Web 提供 PHP 文件，还需要安装 Web 服务器，例如 [Apache](http://www.apache.org/)、[Nginx](https://www.nginx.com/)，或使用\
  \ [PHP 内置 Web 服务器](http://php.net/manual/en/features.commandline.webserver.php)（PHP\
  \ 5.4+ 版本）。\n\n如果您使用的是 16.04 以下版本的 Ubuntu 但仍想使用 PHP 7，可以通过以下方式添加 [Ondrej 的 PPA 仓库](https://launchpad.net/~ondrej/+archive/ubuntu/php/)：\n\
  \n确保您所有的 [软件仓库](https://en.wikipedia.org/wiki/Software_repository) 都是最新的：\n\n```bash\n\
  sudo apt-get update\n```\n\n更新系统仓库后，安装 PHP：\n\n```bash\nsudo apt-get install php7.0\n\
  ```\n\n让我们通过检查 PHP 版本来测试安装：\n\n```bash\nphp -v\n```\n\n这应该输出类似如下内容（您的输出会略有不同）：\n\
  \n```\nPHP 7.0.8-0ubuntu0.16.04.1 (cli) ( NTS )\nCopyright (c) 1997-2016 The PHP\
  \ Group\nZend Engine v3.0.0, Copyright (c) 1998-2016 Zend Technologies\n    with\
  \ Zend OPcache v7.0.8-0ubuntu0.16.04.1, Copyright (c) 1999-2016, by Zend Technologies\n\
  \    with Xdebug v2.4.0, Copyright (c) 2002-2016, by Derick Rethans\n```\n\n您现在已经具备了从命令行运行\
  \ PHP 的能力。\n\n## 第 B.2 节：在企业级 Linux 发行版中安装（CentOS、Scientific Linux 等）\n\n在基于企业级\
  \ Linux 的操作系统中使用 `yum` 命令管理软件包：\n\n```bash\nyum install php\n```\n\n这将安装包含一些常用功能的最小化\
  \ PHP。如果您需要额外的模块，则需要单独安装。您同样可以使用 `yum` 来搜索这些软件包：\n\n```bash\nyum search php-\n```\n\
  \n**示例输出：**\n```\nphp-bcmath.x86_64 : 用于 PHP 应用程序使用 bcmath 库的模块\nphp-cli.x86_64\
  \    : PHP 的命令行界面\nphp-common.x86_64 : PHP 的通用文件\nphp-dba.x86_64    : 用于 PHP 应用程序的数据库抽象层模块\n\
  php-devel.x86_64  : 构建 PHP 扩展所需的文件\nphp-embedded.x86_64 : 用于嵌入应用程序的 PHP 库\nphp-enchant.x86_64\
  \ : 人类语言和字符编码支持\nphp-gd.x86_64     : 用于 PHP 应用程序使用 gd 图形库的模块\nphp-imap.x86_64  \
  \ : 用于使用 IMAP 的 PHP 应用程序的模块\n```\n\n安装 `gd` 库：\n\n```bash\nyum install php-gd\n\
  ```\n\n企业级 Linux 发行版在更新方面一向保守，通常不会更新到超出其发布时的版本。许多第三方仓库提供当前版本的 PHP：\n- [IUS](https://ius.io/)\n\
  - [Remi Colette](http://www.remirepo.net/)\n- [Webtatic](https://webtatic.com/)\n\
  \n"
