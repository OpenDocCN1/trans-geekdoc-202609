  \n#### 第 46.13 节：清理过滤器\n\n我们可以使用过滤器根据需要清理变量。\n\n##### 示例\n\n![](img/Image01099.jpg)\n\
  \n以上代码将从 `$string` 变量中移除 HTML 标签。\n\n## 第 47 章：生成器\n\n#### 第 47.1 节：Yield 关键字\n\n\
  `yield` 语句类似于 `return` 语句，不同之处在于 `yield` 不会停止函数执行并返回，而是返回一个 [`Generator`](http://php.net/manual/en/class.generator.php)\
  \ 对象并暂停生成器函数的执行。\n\n下面是一个以生成器形式编写的 range 函数示例：\n\n![](img/Image01100.jpg)\n\n通过检查\
  \ `var_dump` 的输出，你可以看到该函数返回一个 [`Generator`](http://php.net/manual/en/class.generator.php)\
  \ 对象：\n\n![](img/Image01101.jpg)\n\n### 生成值\n\n然后可以像遍历数组一样遍历 [`Generator`](http://php.net/manual/en/class.generator.php)\
  \ 对象。\n\n![](img/Image01102.jpg)\n\n以上示例将输出：\n\n![](img/Image01103.jpg)\n\n### 生成带键的值\n\
  \n除了生成值，还可以生成键/值对。\n\n![](img/Image01104.jpg)\n\n以上示例将输出：\n\n![](img/Image01105.jpg)\n\
  \n#### 第 47.2 节：使用生成器读取大文件\n\n生成器的一个常见用例是从磁盘读取文件并遍历其内容。下面是一个允许你遍历 CSV 文件的类。该脚本的内存使用量非常可预测，不会因\
  \ CSV 文件的大小而波动。\n\n![](img/Image01106.jpg)\n\n#### 第 47.3 节：为什么要使用生成器？\n\n当你需要生成一个稍后要遍历的大型集合时，生成器非常有用。它们是创建实现\
  \ [`Iterator`](http://php.net/manual/en/class.iterator.php) 接口的类的更简单替代方案，后者往往大材小用。\n\
  \n例如，考虑下面的函数。\n\n![](img/Image01107.jpg)\n\n该函数所做的只是生成一个填充随机数字的数组。要使用它，我们可以调用 `randomNumbers(10)`，这将给我们一个包含\
  \ 10 个随机数字的数组。如果我们要生成一百万个随机数字呢？`randomNumbers(1000000)` 可以做到，但会付出内存代价。在数组中存储一百万个整数大约使用\
  \ 33 兆字节的内存。\n\n![](img/Image01108.jpg)\n\n这是因为一次性生成并返回了一百万个随机数字，而不是逐个生成。生成器是解决此问题的简便方法。\n\
