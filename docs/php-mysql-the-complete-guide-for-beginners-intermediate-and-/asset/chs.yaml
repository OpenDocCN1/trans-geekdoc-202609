  \ || $var == false` 的简洁写法\n\n#### 第 42.3 节：`__construct()` 和 `__destruct()`\n\n\
  | `__construct` |\n| --- |\n\n`()` 是 PHP 中最常见的魔术方法，因为它用于在类初始化时进行设置。\n\n| `__construct()`\
  \ | | `__destruct` |\n| --- | --- | --- |\n\n`__construct()` 方法的相反面。当您创建的对象不再有任何引用，或者您强制删除它时，将调用此方法。PHP\
  \ 的垃圾回收机制将通过先调用其析构函数，然后将其从内存中移除来清理对象。\n\n![](img/Image00970.jpg)\n\n![](img/Image00971.jpg)\n\
  \n#### 第 42.4 节：`__toString()`\n\n| `__toString` |\n| --- |\n\n每当对象被当作字符串处理时，就会调用\
  \ `__toString()` 方法。此方法应返回类的字符串表示形式。\n\n![](img/Image00972.jpg)\n\n#### 第 42.5 节：`__clone()`\n\
  \n`__clone` 通过使用 `clone` 关键字来调用。它用于在对象实际被克隆后，操作克隆时的对象状态。\n\n![](img/Image00973.jpg)\n\
  \n示例：\n\n![](img/Image00974.jpg)\n\n#### 第 42.6 节：`__invoke()`\n\n当用户尝试将对象作为函数调用时，将调用此魔术方法。可能的用例可能包括函数式编程或某些回调等方法。\n\
  \n![](img/Image00975.jpg)\n\n![](img/Image00976.jpg)\n\n#### 第 42.7 节：`__sleep()`\
  \ 和 `__wakeup()`\n\n`__sleep` 和 `__wakeup` 是与序列化过程相关的方法。`serialize` 函数会检查类是否有 `__sleep`\
  \ 方法。如果有，它将在任何序列化之前执行。`__sleep` 应返回一个数组，包含对象中所有应被序列化的变量名。\n\n如果类中存在 `__wakeup`，则会在\
  \ `unserialize` 时执行。其目的是重新建立资源以及反序列化时需要初始化的其他事项。\n\n![](img/Image00977.jpg)\n\n\
