  \n**Mac OS X 与 php5.6**\n\n![](img/Image01536.jpg)\n\n#### 第 81.3 节：列出邮箱中的所有文件夹\n\
  \n一旦你连接到了邮箱，你会想看看里面的内容。第一个有用的命令是 `imap_list`。第一个参数是从 `imap_open` 获取的资源，第二个是你的邮箱字符串，第三个是模糊搜索字符串（`*`\
  \ 用于匹配任何模式）。\n\n![](img/Image01537.jpg)\n\n输出应该看起来类似于这样：\n\n![](img/Image01538.jpg)\n\
