  \n# Chapter 20: Loops\n\n循环是编程的一个基本方面。它们允许程序员创建重复执行指定次数（或迭代）的代码。迭代次数可以是显式的（例如 6\
  \ 次迭代），也可以持续到满足某个条件为止（\"until Hell freezes over\"）。\n\n本主题涵盖不同类型的循环、其相关的控制语句及其在\
  \ PHP 中的潜在应用。\n\n## Section 20.1: continue\n\n![](img/Image00514.jpg)\n\n`continue`\
  \ 关键字停止循环的当前迭代，但不会终止循环。\n\n就像 `break` 语句一样，`continue` 语句位于循环体内。执行时，`continue` 语句会导致执行立即跳转到循环条件。\n\
  \n在以下示例中，循环根据数组中的值打印消息，但会跳过指定的值。\n\n![](img/Image00515.jpg)\n\n预期输出为：\n\n![](img/Image00516.jpg)\n\
  \n`continue` 语句也可用于通过指定要跳过的循环层级数，立即继续执行外层循环。例如，考虑如下数据：\n\nFruit Color Cost\n\nApple\
  \ Red 1\n\nBanana Yellow 7\n\nCherry Red 2\n\nGrape Green 4\n\n为了仅使用成本低于 5 的水果制作派\n\
  \n![](img/Image00517.jpg)\n\n![](img/Image00518.jpg)\n\n| continue || 2 语句执行时，执行立即跳回到\
  \ || $data as $fruit |\n| --- | --- | --- |\n\n执行 `continue 2` 语句时，执行立即跳回到 `foreach\
  \ ($data as $fruit)`，继续外层循环并跳过所有其他代码（包括内层循环中的条件判断。\n\n## Section 20.2: break\n\n\
  ![](img/Image00519.jpg)\n\n`break` 关键字立即终止当前循环。\n\n与 `continue` 语句类似，`break` 语句会停止循环的执行。然而，与\
  \ `continue` 语句不同的是，`break` 会导致循环立即终止，且不会再次执行条件语句。\n\n![](img/Image00520.jpg)\n\n\
  此代码将产生\n\n![](img/Image00521.jpg)\n\n但不会执行 `$i` 为 0 的情况，否则会因除以 0 导致致命错误。\n\n`break`\
  \ 语句也可用于跳出多层循环。这种行为在执行嵌套循环时非常有用。例如，将字符串数组复制到输出字符串中，移除任何 `#` 符号，直到输出字符串恰好为 160 个字符\n\
  \n![](img/Image00522.jpg)\n\n| break |\n| --- |\n\n`break 2` 命令立即终止内层和外层循环的执行。\n\
