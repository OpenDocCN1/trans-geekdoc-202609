  ![](img/Image00953.jpg)\n\n##### 何时安装以及何时更新\n\n`composer update` 主要用于“开发阶段”，以升级项目包。\n\
  \n##### `composer.lock`\n\n`composer install` 主要用于“部署阶段”，使用由 `composer update` 创建的\
