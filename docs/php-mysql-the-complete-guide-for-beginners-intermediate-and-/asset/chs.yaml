  \ 29.5 节：获取 Cookie\n\n### 获取并输出名为 user 的 Cookie\n\n可以使用全局变量 `$_COOKIE` 检索 Cookie\
  \ 的值。示例：如果我们有一个名为 `user` 的 Cookie，可以这样检索它：\n\n![](img/Image00737.jpg)\n\n## 第 30\
  \ 章：输出缓冲控制\n\n### 函数详情\n\n| `ob_start` | `ob_get_contents` | `ob_end_clean` |\n\
  | --- | --- | --- |\n| `ob_start()` 启动输出缓冲区，在此之后的任何输出将被捕获而不显示 | `ob_get_contents()`\
  \ 返回 `ob_start()` 捕获的所有内容 | `ob_end_clean()` 清空输出缓冲区并关闭当前嵌套级别的输出缓冲 |\n\n| `ob_get_clean`\
  \ | `ob_get_level` | `ob_flush` | `ob_implicit_flush` | `ob_end_flush` |\n| ---\
  \ | --- | --- | --- | --- |\n| `ob_get_clean()` 同时触发 `ob_get_contents()` 和 `ob_end_clean()`\
  \ | `ob_get_level()` 返回输出缓冲区的当前嵌套级别 | `ob_flush()` 刷新内容缓冲区并发送到浏览器，但不结束缓冲区 | `ob_implicit_flush()`\
  \ 在每次输出调用后启用隐式刷新。 | `ob_end_flush()` 刷新内容缓冲区并发送到浏览器，同时结束缓冲区 |\n\n#### 第 30.1 节：基本用法——获取缓冲区间的内容并清除\n\
  \n输出缓冲控制允许你将任何文本内容（文本、HTML）存储在变量中，并在脚本结束时作为一个整体发送给浏览器。默认情况下，PHP 在解析内容时就会发送内容。\n\n\
  ![](img/Image00738.jpg)\n\n| `ob_start` | `ob_get_clean` |\n| --- | --- |\n\n`ob_start()`\
  \ 与 `ob_get_clean()` 之间输出的任何内容都将被捕获并放入变量 `$content` 中。\n\n| `ob_get_clean` | `ob_get_contents`\
  \ | `ob_end_clean` |\n| --- | --- | --- |\n\n调用 `ob_get_clean()` 会同时触发 `ob_get_contents()`\
  \ 和 `ob_end_clean()`。\n\n#### 第 30.2 节：通过回调处理缓冲区\n\n| `ob_start` |\n| --- |\n\n\
  你可以通过向 `ob_start()` 传递一个可调用对象，对输出应用任何类型的额外处理。\n\n![](img/Image00739.jpg)\n\n![](img/Image00740.jpg)\n\
  \n输出：\n\n![](img/Image00741.jpg)\n\n```\n<h1> LoremIpsum </h1><p><strong> Pellentesquehabitantmorbitristique\
  \ </strong> senectusetnetusetmalesuada famesacturpisegestas. < ahref = \"#\" > Donecnonenim\
  \ </a> inturpispulvinarfacilisis. </p><h2> HeaderLevel2 </h2> <ol><li> Loremipsumdolorsitamet,consectetueradipiscingelit.\
  \ </li><li> Aliquamtinciduntmauriseurisus. </ li></ol>\n```\n\n#### 第 30.3 节：嵌套输出缓冲区\n\
  \n| `ob_get_level()` |\n| --- |\n\n你可以嵌套输出缓冲区，并使用该函数获取级别以提供不同的内容。\n\n![](img/Image00742.jpg)\n\
  \n![](img/Image00743.jpg)\n\n输出：\n\n![](img/Image00744.jpg)\n\n#### 第 30.4 节：在任何内容之前运行输出缓冲区\n\
  \n![](img/Image00745.jpg)\n\n在此示例中，我们假设 `$users` 是一个多维数组，并遍历它以查找所有访问级别为 7 的用户。\n\
  \n如果没有结果，我们将重定向到错误页面。\n\n| `header` |\n| --- |\n\n我们在这里使用输出缓冲区，因为我们根据循环的结果触发 `header()`\
