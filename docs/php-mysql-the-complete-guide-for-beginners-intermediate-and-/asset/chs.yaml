  \nXML 文档中的属性。\n\n当您不知道它们的名称时（或者您不想知道它们）：\n\n![](img/Image00907.jpg)\n\n## 第 39 章：正则表达式\
  \ (regexp/PCRE)\n\n参数详情\n\n`$pattern` 包含正则表达式（PCRE 模式）的字符串\n\n#### 第 39.1 节：全局正则表达式匹配\n\
  \n可以使用 `preg_match_all` 执行全局正则表达式匹配。`preg_match_all` 返回目标字符串中所有匹配的结果（与 `preg_match`\
  \ 相反，后者仅返回第一个）。\n\n`preg_match_all` 函数返回匹配的数量。第三个参数 `$matches` 将包含由第四个参数中给出的标志控制格式的匹配项。\n\
  \n如果给定一个数组，`$matches` 将包含一个格式类似于 `preg_match` 返回结果的数组，不同之处在于 `preg_match` 在第一个匹配处停止，而\
  \ `preg_match_all` 会遍历字符串直到字符串被完全消耗，并将每次迭代的结果以多维数组形式返回，其格式可由第四个参数中的标志控制。\n\n第四个参数\
  \ `$flags` 控制 `$matches` 数组的结构。默认模式为 `PREG_PATTERN_ORDER`，可能的标志为 `PREG_SET_ORDER`\
  \ 和 `PREG_PATTERN_ORDER`。\n\n![](img/Image00908.jpg)\n\n来自 `PREG_SET_ORDER` 的第一个\
  \ `var_dump` 给出以下输出：\n\n![](img/Image00909.jpg)\n\n![](img/Image00910.jpg)\n\n`$matches`\
  \ 有三个嵌套数组。每个数组代表一次匹配，其格式与 `preg_match` 的返回结果相同。\n\n第二个 `var_dump`（`PREG_PATTERN_ORDER`）给出以下输出：\n\
  \n![](img/Image00911.jpg)\n\n当相同的正则表达式通过 `preg_match` 运行时，返回以下数组：\n\n![](img/Image00912.jpg)\n\
  \n#### 第 39.2 节：使用正则表达式进行字符串匹配\n\n`preg_match` 检查字符串是否与正则表达式匹配。\n\n![](img/Image00913.jpg)\n\
  \n如果您传入第三个参数，它将被填充为正则表达式的匹配数据：\n\n```\npreg_match('%^([a-zA-Z]+): ([0-9]+)$%', 'This\
  \ is a string which contains numbers: 12345', $matches);\n// $matches 现在包含正则表达式匹配结果的数组。\n\
  echo json_encode($matches); // [\"numbers: 12345\", \"numbers\", \"12345\"]\n```\n\
  \n`$matches` 包含一个数组，第一个元素是完整匹配，随后是正则表达式中由括号括起来的子串，按左括号的偏移量顺序排列。这意味着，如果您有 `/z(a(b))/`\
  \ 作为正则表达式，索引 0 包含整个子串 `zab`，索引 1 包含外层括号括起来的子串 `ab`，索引 2 包含内层括号括起来的 `b`。\n\n####\
  \ 第 39.3 节：通过正则表达式将字符串分割为数组\n\n![](img/Image00915.jpg)\n\n输出：\n\n![](img/Image00916.jpg)\n\
  \n| `preg_split` |\n| --- |\n\n要将字符串分割为数组，只需传递字符串和一个供 `preg_split()` 匹配和搜索的正则表达式，添加第三个参数（`limit`）允许您设置执行的“匹配”次数，剩余的字符串将被添加到数组末尾。\n\
  \n第四个参数是（`flags`），此处我们使用 `PREG_SPLIT_NO_EMPTY`，它防止我们的数组包含任何空键/值。\n\n#### 第 39.4\
  \ 节：使用正则表达式进行字符串替换\n\n```\n$string = \"a;b;c\\nd;e;f\";\necho preg_replace(\"/(^([^;]+);([^;]+);([^;]+)$)/m\"\
  , \"$3;$2;$1\", $string);\n// $1、$2 和 $3 分别代表第一、第二和第三个捕获组\n```\n\n输出\n\n![](img/Image00918.jpg)\n\
  \n搜索分号之间的所有内容并反转顺序。\n\n#### 第 39.5 节：使用回调进行字符串替换\n\n`preg_replace_callback` 通过将每个匹配的捕获组发送给定义的回调函数，并用回调函数的返回值替换它来工作。这允许我们基于任何类型的逻辑替换字符串。\n\
  \n![](img/Image00919.jpg)\n\n![](img/Image00920.jpg)\n\n## 第 40 章：Traits（特性）\n\n\
  #### 第 40.1 节：什么是 Trait？\n\nPHP 只允许单继承。换句话说，一个类只能扩展另一个类。但如果您需要包含不属于父类的内容怎么办？在 PHP\
  \ 5.4 之前，您必须想办法变通，但在 5.4 版本中引入了 Traits。Traits 允许您基本上将一部分类“复制并粘贴”到您的主类中。\n\n\n\n\n\
  \n# PHP Traits 和 Composer 依赖管理器\n\n## 第 40.1 节：Traits 简介\n\n这里我们有 `MrEd`，它已经继承自\
  \ `Horse`。但并非所有马都会 `Talk`，所以我们为此定义了一个 `Trait`。让我们看看这在做什么。\n\n首先，我们定义 `Trait`。我们可以配合自动加载和命名空间使用它（另请参阅在命名空间中引用类或函数）。然后我们使用关键字\
  \ `use` 将其包含到 `MrEd` 类中。\n\n你会注意到 `MrEd` 直接使用了 `Talk` 的函数和变量，而无需定义它们。还记得我们说的复制粘贴吗？这些函数和变量现在都在类中定义了，就好像这个类自己定义了它们一样。\n\
  \n##### Traits 对比 抽象类\n\nTraits 与抽象类关系最为密切，因为你可以在其中定义变量和函数。你也无法直接实例化一个 `Trait`（即\
  \ `new Trait()`）。Traits 不能像抽象类或接口那样强制类隐式定义函数。Traits 仅用于显式定义（因为你可以实现任意数量的接口，请参阅接口）。\n\
  \n##### 何时应该使用 Trait？\n\n当考虑使用 `Trait` 时，首先要问自己这个重要问题：\n\n**我能否通过重构代码来避免使用 Trait？**\n\
  \n在大多数情况下，答案是 **Yes**。Traits 是单继承导致的边缘情况。滥用或过度使用 Traits 的诱惑可能很大。但请考虑，`Trait` 为你的代码引入了另一个来源，这意味着又增加了一层复杂性。在本例中，我们只处理\
  \ 3 个类。但 Traits 意味着你现在可能要处理更多的类。每增加一个 `Trait`，你的类就变得更难处理，因为你现在必须去引用每个 `Trait` 以了解它定义了什么（以及可能发生冲突的位置，请参阅冲突解决）。理想情况下，你应该在代码中保持尽可能少的\
  \ Traits。\n\n## 第 40.2 节：Traits 促进水平代码复用\n\n假设我们有一个用于日志记录的接口：\n\n```php\ninterface\
  \ Logger {\n    public function log(string $message);\n}\n```\n\n现在假设我们有 `Logger`\
  \ 接口的两个具体实现：`FileLogger` 和 `ConsoleLogger`。\n\n```php\nclass FileLogger implements\
  \ Logger {\n    public function log(string $message) {\n        // 写入文件\n    }\n\
  }\n\nclass ConsoleLogger implements Logger {\n    public function log(string $message)\
  \ {\n        echo $message;\n    }\n}\n```\n\n现在如果你定义了另一个类 `Foo`，也想让它能够执行日志记录任务，你可以这样做：\n\
  \n```php\nclass Foo {\n    private $logger;\n\n    public function setLogger(Logger\
  \ $logger) {\n        $this->logger = $logger;\n    }\n\n    public function doSomething()\
  \ {\n        if ($this->logger) {\n            $this->logger->log(\"Doing something\"\
  );\n        }\n    }\n}\n```\n\n`Foo` 现在也是一个 `Logger`，但其功能依赖于通过 `setLogger()` 传递给它的\
  \ `Logger` 实现。如果我们现在想让类 `Bar` 也拥有这个日志记录机制，我们就必须在 `Bar` 类中复制这段逻辑。\n\n我们可以定义一个 trait\
  \ 来代替复制代码：\n\n```php\ntrait Loggable {\n    private $logger;\n\n    public function\
  \ setLogger(Logger $logger) {\n        $this->logger = $logger;\n    }\n\n    public\
  \ function log(string $message) {\n        if ($this->logger) {\n            $this->logger->log($message);\n\
  \        }\n    }\n}\n```\n\n现在我们已在 trait 中定义了逻辑，可以使用该 trait 将逻辑添加到 `Foo` 和 `Bar`\
  \ 类中：\n\n```php\nclass Foo {\n    use Loggable;\n    // ...\n}\n\nclass Bar {\n\
  \    use Loggable;\n    // ...\n}\n```\n\n## 第 40.3 节：冲突解决\n\n尝试在一个类中使用多个 trait\
  \ 可能会导致涉及冲突方法的问题。你需要手动解决此类冲突。\n\n例如，让我们创建这个层级结构：\n\n```php\ntrait Cat {\n    public\
  \ function say() {\n        echo \"Meow\";\n    }\n}\n\ntrait Dog {\n    public\
  \ function say() {\n        echo \"Woof\";\n    }\n}\n```\n\n现在，尝试创建以下类：\n\n```php\n\
  class TalkingParrot {\n    use Cat, Dog;\n}\n```\n\nPHP 解释器将返回致命错误：\n\n```\nFatal\
  \ error: Trait method say has not been applied, because there are collisions with\
  \ other trait methods on TalkingParrot\n```\n\n解决冲突：\n\n```php\nclass TalkingParrot\
  \ {\n    use Cat, Dog {\n        Cat::say insteadof Dog;\n        Dog::say as dogSay;\n\
  \    }\n}\n\n$parrot = new TalkingParrot();\n$parrot->say();    // 输出: Meow\n$parrot->dogSay();\
  \ // 输出: Woof\n```\n\n## 第 40.4 节：使用 Traits 实现单例模式\n\n**免责声明**：此例绝不提倡使用单例模式。单例模式必须谨慎使用。\n\
  \n在 PHP 中实现单例有一种相当标准的方式：\n\n```php\nclass Singleton {\n    private static $instance\
  \ = null;\n\n    private function __construct() {}\n\n    private function __clone()\
  \ {}\n\n    public static function getInstance() {\n        if (self::$instance\
  \ === null) {\n            self::$instance = new self();\n        }\n        return\
  \ self::$instance;\n    }\n}\n```\n\n为了防止代码重复，将此行为提取到 trait 中是个好主意。\n\n```php\n\
  trait SingletonTrait {\n    private static $instance = null;\n\n    private function\
  \ __construct() {}\n\n    private function __clone() {}\n\n    public static function\
  \ getInstance() {\n        if (self::$instance === null) {\n            self::$instance\
  \ = new self();\n        }\n        return self::$instance;\n    }\n\n    public\
  \ function __wakeup() {\n        throw new \\Exception(\"Cannot unserialize a singleton.\"\
  );\n    }\n}\n```\n\n现在任何想作为单例运行的类只需使用该 trait：\n\n```php\nclass MyService {\n  \
  \  use SingletonTrait;\n    // ...\n}\n\n$service = MyService::getInstance();\n\
  ```\n\n即使现在无法序列化单例，禁用反序列化方法仍然很有用。\n\n## 第 40.5 节：Traits 保持类整洁\n\n随着时间的推移，我们的类可能会实现越来越多的接口。当这些接口拥有许多方法时，我们类中的方法总数将变得非常庞大。\n\
  \n例如，假设我们有两个接口和一个实现它们的类：\n\n```php\ninterface Printable {\n    public function print();\n\
  \    public function printPreview();\n}\n\ninterface Savable {\n    public function\
  \ save();\n    public function saveAs();\n}\n\nclass Article implements Printable,\
  \ Savable {\n    // ... 此处有许多方法\n}\n```\n\n我们可以使用单独的 Traits 来实现这些接口，而不是在 `Article`\
  \ 类中实现所有接口方法，从而保持类的精简，并将接口实现的代码与类分离。\n\n例如，要实现 `Printable` 接口，我们可以创建这个 trait：\n\n\
  ```php\ntrait PrintableTrait {\n    public function print() {\n        // 实现\n \
  \   }\n\n    public function printPreview() {\n        // 实现\n    }\n}\n```\n\n\
  并让类使用该 trait：\n\n```php\nclass Article implements Printable, Savable {\n    use\
  \ PrintableTrait;\n    use SavableTrait; // 假设 SavableTrait 存在\n    // ...\n}\n\
  ```\n\n主要好处是我们的接口实现方法将与类的其余部分分离，并存储在一个 trait 中，该 trait 承担为该特定类型对象实现接口的唯一责任。\n\n\
  ## 第 40.6 节：多 Traits 使用\n\n```php\ntrait Hello {\n    public function sayHello()\
  \ {\n        echo \"Hello \";\n    }\n}\n\ntrait World {\n    public function sayWorld()\
  \ {\n        echo \"World\";\n    }\n}\n\nclass MyClass {\n    use Hello, World;\n\
  }\n\n$obj = new MyClass();\n$obj->sayHello();\n$obj->sayWorld();\n```\n\n上例将输出：\n\
  \n```\nHello World\n```\n\n## 第 40.7 节：修改方法可见性\n\n```php\ntrait HelloWorld {\n \
  \   public function sayHello() {\n        echo \"Hello World\";\n    }\n}\n\nclass\
  \ MyClass1 {\n    use HelloWorld;\n}\n\nclass MyClass2 {\n    use HelloWorld { sayHello\
  \ as protected; }\n}\n\nclass MyClass3 {\n    use HelloWorld { sayHello as private\
  \ myPrivateHello; }\n}\n```\n\n运行此例：\n\n```php\n$obj1 = new MyClass1();\n$obj1->sayHello();\
  \ // 正常: public\n\n$obj2 = new MyClass2();\n// $obj2->sayHello(); // 致命错误: 调用受保护方法\n\
  \n$obj3 = new MyClass3();\n// $obj3->sayHello(); // 致命错误: 调用私有方法\n// $obj3->myPrivateHello();\
  \ // 致命错误: 调用私有方法\n```\n\n**注意**：因此请注意，在 `MyClass2` 的最后一个例子中，来自 `HelloWorld` 的原始未别名方法仍按原样可访问。\n\
  \n## 第 41 章：Composer 依赖管理器\n\n##### 参数详情\n\n| 参数 | 描述 |\n| :--- | :--- |\n| `license`\
  \ | 定义项目中要使用的许可证类型。 |\n| `authors` | 定义项目的作者及作者详细信息。 |\n| `support` | 定义支持邮箱、IRC\
  \ 频道和各种链接。 |\n| `require` | 定义实际依赖及包版本。 |\n| `require-dev` | 定义开发项目所需的包。 |\n| `suggest`\
  \ | 定义包建议，即安装后可能有帮助的包。 |\n| `autoload` | 定义项目的自动加载策略。 |\n| `autoload-dev` | 定义开发项目的自动加载策略。\
  \ |\n\n[Composer](https://getcomposer.org/) 是 PHP 最常用的依赖管理器。它类似于 Node 中的 `npm`、Python\
  \ 的 `pip` 或 .NET 的 `NuGet`。\n\n#### 第 41.1 节：什么是 Composer？\n\n[Composer](https://getcomposer.org/)\
  \ 是 PHP 的依赖/包管理器。它可用于安装、跟踪和更新项目依赖。Composer 还负责自动加载应用程序所依赖的依赖项，让你轻松在项目中使用依赖，而无需担心在任何给定文件顶部包含它们。\n\
  \n##### `composer.json`\n\n项目的依赖列在 `composer.json` 文件中，该文件通常位于项目根目录。此文件保存关于生产环境和开发环境所需包版本的信息。\n\
  \n`composer.json` 模式的完整大纲可在 [Composer 官网](https://getcomposer.org/doc/04-schema.md)\
  \ 找到。\n\n##### 安装包\n\n```bash\ncomposer require <package>\n##### 或用于开发依赖\ncomposer\
  \ require --dev <package>\n```\n\n此文件可使用任何文本编辑器手动编辑，或通过命令行自动编辑，命令如上所示。\n\n#####\
  \ 初始化项目\n\n要在项目中开始使用 composer，你需要创建 `composer.json` 文件。你可以手动创建，或直接运行 `composer init`。在终端运行\
  \ `composer init` 后，它会询问你关于项目的一些基本信息：\n\n*   **包名** (vendor/package - 例如 `laravel/laravel`)\n\
  *   **描述** - 可选\n*   **作者**\n*   以及其他一些信息，如最低稳定性、许可证和所需包。\n\n\n\n\n`composer.json`\
  \ 文件中的 `require` 键指定了项目依赖哪些包。`require` 接受一个对象，该对象将包名（例如 `monolog/monolog`）映射到版本约束（例如\
  \ `1.0.*`）。\n\n![](img/Image00946.jpg)\n\n要安装已定义的依赖项，你需要运行 `composer install` 命令，它将查找符合所提供版本约束的已定义包，并将其下载到\
  \ `vendor` 目录中。将第三方代码放入名为 `vendor` 的目录中是一种惯例。\n\n##### `composer.lock`\n\n你会注意到\
  \ install 命令还创建了一个 `composer.lock` 文件。\n\n##### `composer.lock`\n\n`composer.lock`\
  \ 文件由 Composer 自动生成。此文件用于跟踪当前安装的依赖项的版本和状态。运行 `composer install` 将把包安装到锁文件中存储的确切状态。\n\
  \n#### 第 41.2 节：使用 Composer 进行自动加载\n\n虽然 Composer 为 PHP 项目提供了一个管理依赖的系统（例如来自 [Packagist](https://packagist.org/)），但它也可以充当自动加载器，指定在哪里查找特定的命名空间或包含通用函数文件。\n\
