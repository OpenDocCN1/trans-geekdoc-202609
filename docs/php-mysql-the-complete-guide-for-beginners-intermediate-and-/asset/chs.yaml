  \n#### 第 63.3 节：在 PHP 中执行 Redis 命令\n\nRedis PHP 模块提供了与 Redis CLI 客户端相同的命令访问权限，因此使用起来非常简单。\n\
  \n语法如下：\n\n![](img/Image01340.jpg)\n\n## 第 64 章：发送邮件\n\n##### 参数详情\n\n| 参数 | 描述\
  \ |\n| --- | --- |\n| `string $to` | 收件人邮箱地址 |\n| `string $subject` | 邮件主题 |\n|\
  \ `string $message` | 邮件正文 |\n| `string $additional_headers` | 可选：要添加到邮件中的标头 |\n\
  | `string $additional_parameters` | 可选：要在命令行中传递给配置的邮件发送应用程序的参数 |\n\n#### 第 64.1\
  \ 节：发送邮件 - 基础、更多详情和完整示例\n\n一封典型的邮件有三个主要组成部分：\n\n1.  收件人（以邮箱地址表示）\n2.  主题\n3.  邮件正文\n\
  \n在 PHP 中发送邮件可以简单到只需调用内置函数 `mail()`。`mail()` 最多接受五个参数，但前三个参数就是发送邮件所需的全部（尽管通常会使用第四个参数，如下所示）。前三个参数是：\n\
  \n1.  收件人的邮箱地址（字符串）\n2.  邮件的主题（字符串）\n3.  邮件的正文（字符串）（例如邮件的内容）\n\n![](img/Image01341.jpg)\n\
  \n最小示例将类似于以下代码：\n\n```\nmail('recipient@example.com', 'Email Subject', 'This is\
  \ the email message body');\n```\n\n上述简单示例在有限情况下效果很好，例如为内部系统硬编码邮件警报。但是，通常会将作为 `mail()`\
  \ 参数传递的数据放在变量中，以使代码更整洁且易于管理（例如，从表单提交动态构建邮件）。\n\n此外，`mail()` 接受第四个参数，允许您随邮件发送额外的邮件标头。这些标头允许您设置：\n\
  \n| 标头 | 描述 |\n| --- | --- |\n| `From` | 用户将看到的发件人姓名和邮箱地址 |\n| `Reply-To` | 用户回复将发送到的邮箱地址\
  \ |\n| `X-Mailer` | 额外的非标准标头，如 X-Mailer，可告知收件人此邮件是通过 PHP 发送的 |\n\n```\n$to     \
  \  = 'recipient@example.com'; // 也可以是 $to = $_POST['recipient'];\n$subject  = 'Email\
  \ Subject';         // 也可以是 $subject = $_POST['subject'];\n$message  = 'This is\
  \ the email message body'; // 也可以是 $message = $_POST['message'];\n$headers  = implode(\"\
  \\r\\n\", [\n    'From: John Conde <webmaster@example.com>',\n    'Reply-To: webmaster@example.com>',\n\
  \    'X-Mailer: PHP/' . PHP_VERSION\n]);\n```\n\n![](img/Image01342.jpg)\n\n可选的第五个参数可用于将额外的标志作为命令行选项传递给配置用于发送邮件的程序，由\
  \ `sendmail_path` 配置设置定义。例如，这可以用于在使用带有 `-f` sendmail 选项的 sendmail/postfix 时设置信封发件人地址。\n\
  \n![](img/Image01343.jpg)\n\n虽然使用 `mail()` 可能非常可靠，但绝不意味着调用 `mail()` 时一定会发送邮件。要查看发送邮件时是否存在潜在错误，您应该捕获\
  \ `mail()` 的返回值。如果邮件成功被接受投递，将返回 `TRUE`。否则，您将收到 `FALSE`。\n\n![](img/Image01344.jpg)\n\
  \n**注意**：虽然 `mail()` 可能返回 `TRUE`，但这并不意味着邮件已发送或收件人将收到邮件。它仅表示邮件已成功移交给您系统的邮件系统。\n\n\
  如果您想发送 HTML 邮件，不需要做太多额外的工作。您需要：\n\n1.  添加 `MIME-Version` 标头\n2.  添加 `Content-Type`\
  \ 标头\n3.  确保您的邮件内容是 HTML\n\n![](img/Image01345.jpg)\n![](img/Image01346.jpg)\n![](img/Image01347.jpg)\n\
  \n### 另请参阅\n\n**官方文档**\n\n*   [`mail`](http://php.net/manual/en/function.mail.php)\n\
  *   [`mail` 配置](http://php.net/manual/en/mail.configuration.php)\n\n**相关 Stack Overflow\
