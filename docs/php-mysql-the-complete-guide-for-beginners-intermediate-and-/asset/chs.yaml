  \ Linux` 等）\n\n## 致谢\n\n## 您可能还喜欢\n\n## 第 1 章：`PHP` 入门\n\n#### 第 1.1 节：Web 服务器的\
  \ `HTML` 输出\n\n\n\n# PHP 基础\n\nPHP 可用于向 HTML 文件添加内容。HTML 由 Web 浏览器直接处理，而 PHP 脚本由\
  \ Web 服务器执行，生成的 HTML 发送给浏览器。\n\n## Hello World\n\n以下 HTML 标记包含一条将内容添加到输出的 PHP 语句：\n\
  \n```php\n<?php echo \"Hello World!\"; ?>\n```\n\n将其保存为 PHP 脚本并由 Web 服务器执行时，将向用户浏览器发送以下\
  \ HTML：\n\n```html\nHello World!\n```\n\n### PHP 5.4+ 版本\n\n`echo` 还有一种快捷语法，可让你立即打印值。在\
  \ PHP 5.4.0 之前，此短语法仅在启用 `short_open_tag` 配置设置时有效。\n\n例如，以下代码：\n\n```php\n<?= \"\
  Hello World!\" ?>\n```\n\n其输出与以下代码相同：\n\n```php\n<?php echo \"Hello World!\"; ?>\n\
  ```\n\n在实际应用中，PHP 输出到 HTML 页面的所有数据都应正确转义，以防止 XSS（跨站脚本）攻击或文本损坏。\n\n```php\n<?= ...\
  \ ?>\n```\n\n另请参阅：字符串和 [PSR-1](http://www.php-fig.org/psr/psr-1/)，其中描述了最佳实践，包括短标签的正确使用。\n\
  \n## Section 1.2: Hello, World!\n\nPHP 中用于打印输出的最常用语言结构是 `echo`：\n\n```php\necho\
  \ \"Hello World!\";\n```\n\n或者，也可以使用 `print`：\n\n```php\nprint \"Hello World!\"\
  ;\n```\n\n两者功能相同，细微差别如下：\n\n| 特性 | `echo` | `print` |\n| :--- | :--- | :--- |\n\
  | 返回值 | 无返回值 | 返回值为 1 的 `int` |\n| 参数 | 可接受多个参数（仅限无括号） | 仅接受单个参数 |\n| 速度 | 略快 |\
  \ 较慢 |\n\n`echo` 和 `print` 都是语言结构，而非函数。因此，它们不需要在参数周围加括号。为与函数保持外观一致，可加上括号。关于 `echo`\
  \ 和 `print` 的大量示例请参阅其他资料。\n\nC 风格的 `printf` 及相关函数也可用，示例如下：\n\n```php\nprintf(\"\
  Hello %s!\", \"World\");\n```\n\n请参阅“输出变量的值”，以全面了解 PHP 中输出变量的方法。\n\n## Section 1.3:\
  \ Web 服务器的非 HTML 输出\n\n在某些情况下，使用 Web 服务器时，可能需要覆盖 Web 服务器的默认内容类型。\n\n例如，你可能需要以纯文本、JSON\
  \ 或 XML 形式发送数据。\n\n`header()` 函数可发送原始 HTTP 头。你可以添加 `Content-Type` 头以通知浏览器发送的内容类型。\n\
  \n### 纯文本\n\n```php\nheader(\"Content-Type: text/plain\");\necho \"Hello World\"\
  ;\n```\n\n这将生成包含以下内容的纯文本文档：\n\n```text\nHello World\n```\n\n### JSON\n\n要生成 JSON\
  \ 内容，请改用 `application/json` 内容类型：\n\n```php\nheader(\"Content-Type: application/json\"\
  );\necho json_encode([\"response\" => \"Hello World\"]);\n```\n\n这将生成类型为 `application/json`\
  \ 的文档，内容如下：\n\n```json\n{\"response\":\"Hello World\"}\n```\n\n> **注意**：`header()`\
  \ 函数必须在 PHP 产生任何输出之前调用，否则 Web 服务器将已发送响应头。\n\n例如以下代码：\n\n```php\necho \"Hello World\"\
  ;\nheader(\"Content-Type: text/plain\");\n```\n\n将产生警告：\n\n```text\nWarning: Cannot\
  \ modify header information - headers already sent by (output started at /dir/example.php:2)\
  \ in /dir/example.php on line 3\n```\n\n使用 `header()` 时，其输出必须是服务器发送的第一个字节。因此，在 PHP\
  \ 开启标签 `<?php` 之前，文件开头不得有空行或空格。出于同一原因，最佳实践（见 [PSR-2](http://www.php-fig.org/psr/psr-2/#2-2-files)）建议省略仅包含\
  \ PHP 的文件或文件末尾 PHP 代码块的关闭标签 `?>`。\n\n请参阅输出缓冲部分，了解如何将内容“捕获”到变量中以便稍后输出（例如在输出头之后）。\n\
  \n## Section 1.4: PHP 内置服务器\n\nPHP 5.4+ 自带内置开发服务器。无需安装 nginx 或 Apache 等生产级 HTTP\
  \ 服务器即可运行应用程序。内置服务器仅用于开发和测试。\n\n可使用 `-S` 标志启动：\n\n```bash\nphp -S <host/ip>:<port>\n\
  ```\n\n### 示例用法\n\n1. 创建 `index.php` 文件，内容如下：\n\n```php\n<?php echo \"Hello World!\"\
  ; ?>\n```\n\n2. 在命令行运行以下命令（勿包含 `http://`）：\n\n```bash\nphp -S localhost:8080\n```\n\
  \n这将启动一个 Web 服务器，在当前目录作为文档根目录的情况下监听 8080 端口。\n\n3. 打开浏览器访问 `http://localhost:8080`。你应该能看到\
  \ \"Hello World\" 页面。\n\n### 配置\n\n要覆盖默认文档根目录（即当前目录），请使用 `-t` 标志：\n\n```bash\nphp\
  \ -S localhost:8080 -t public\n```\n\n例如，如果项目中有 `public/` 目录，可使用该命令从该目录提供服务。\n\n\
  ### 日志\n\n每次从开发服务器发出请求时，都会向命令行写入如下日志条目：\n\n```text\n[Mon Aug 15 18:20:19 2022] 127.0.0.1:54321\
  \ [200]: /index.php\n```\n\n## Section 1.5: PHP CLI\n\nPHP 也可通过 CLI（命令行界面）直接从命令行运行。\n\
  \nCLI 基本与 Web 服务器上的 PHP 相同，除标准输入输出方面存在差异外。\n\n### 触发方式\n\nPHP CLI 提供四种运行 PHP 代码的方式：\n\
  \n1. **标准输入**。运行 `php` 命令且不带参数，但通过管道传入 PHP 代码：\n   ```bash\n   echo '<?php echo\
  \ \"Hello world!\";' | php\n   ```\n\n2. **文件名作为参数**。运行 `php` 命令，首个参数为 PHP 源文件名：\n\
  \   ```bash\n   php hello_world.php\n   ```\n\n3. **代码作为参数**。在 `php` 命令中使用 `-r`\
  \ 选项，后跟要运行的代码。不需要 `<?php` 开启标签，因为参数中的所有内容均视为 PHP 代码：\n   ```bash\n   php -r 'echo\
  \ \"Hello world!\";'\n   ```\n\n4. **交互式 Shell**。在 `php` 命令中使用 `-a` 选项启动交互式 Shell。然后输入（或粘贴）PHP\
  \ 代码并按回车：\n   ```bash\n   $ php -a\n   Interactive mode enabled\n   php > echo \"\
  Hello world!\";\n   Hello world!\n   ```\n\n##### 输出\n\nWeb 服务器 PHP 中产生 HTML 输出的所有函数或控制，在\
  \ CLI 中均可用于向 stdout 流（文件描述符 1）产生输出；Web 服务器 PHP 中产生错误日志输出的所有操作，在 CLI 中均会向 stderr\
  \ 流（文件描述符 2）产生输出。\n\n```php\nfwrite(STDOUT, \"Standard output\\n\");\nfwrite(STDERR,\
  \ \"Error output\\n\");\n```\n\n### Shell 命令行\n\n```bash\nphp script.php > output.log\
  \ 2> error.log\n```\n\n### 输入\n\n请参阅：命令行界面 (CLI)\n\n## Section 1.6: 指令分隔\n\n与大多数其他\
  \ C 风格语言一样，每条语句以分号终止。此外，关闭标签用于终止 PHP 代码块的最后一行代码。\n\n```php\necho \"No error\";\n\
  ```\n\n如果 PHP 代码的最后一行以分号结尾，且该行后面没有其他代码，则关闭标签是可选的。例如，以下示例中 `;` 后可省略关闭标签：\n\n```php\n\
  <?php echo \"No error\" ; // no closing tag is needed as long as there is no code\
  \ below\n```\n\n但是，如果 PHP 代码块后面还有其他代码，则关闭标签不再是可选的：\n\n```php\n<?php echo \"This\
  \ will cause an error if closing tag is omitted\" ?>\n<html>\n<body>\n...\n```\n\
  \n\n\n![](img/Image00023.jpg)\n\n如果该 PHP 代码块有结束标签，我们也可以省略该代码块中最后一条语句的分号：\n\n![](img/Image00024.jpg)\n\
  \n通常建议始终使用分号，并为每个 PHP 代码块使用结束标签，最后一个 PHP 代码块除外（如果该 PHP 代码块后面没有更多代码）。\n\n因此，你的代码基本上应该如下所示：\n\
  \n![](img/Image00025.jpg)\n\n#### 第 1.7 节：PHP 标签\n\n文件中有三种标签用于标记 PHP 代码块。PHP 解析器会寻找开始标签和（如果存在）结束标签，以界定需要解析的代码。\n\
  \n### 标准标签\n\n这些标签是在文件中嵌入 PHP 代码的标准方法。\n\n![](img/Image00026.jpg)\n\n**PHP 5.x 版本\
  \ ≥ 5.4**\n\n### Echo 标签\n\n这些标签在所有 PHP 版本中均可用，且自 PHP 5.4 起始终启用。在早期版本中，echo 标签只能结合短标签一起启用。\n\
  \n![](img/Image00027.jpg)\n\n### 短标签\n\n你可以使用选项 `short_open_tag` 来禁用或启用这些标签。\n\n\
  ![](img/Image00028.jpg)\n\n短标签：\n\n![](img/Image00029.jpg)\n\n- 在所有主要的 PHP [编码标准](http://www.php-fig.org/psr/psr-1/)\
  \ 中均被禁止\n- [官方文档](https://secure.php.net/manual/en/language.basic-syntax.phptags.php)\
  \ 不建议使用\n- 在大多数发行版中默认禁用\n- 会干扰内联 XML 的处理指令\n- 大多数开源项目的代码提交不接受短标签\n\n### PHP 5.x\
  \ 版本 ≤ 5.6 ASP 标签\n\n通过启用 `asp_tags` 选项，可以使用 ASP 风格的标签。\n\n![](img/Image00030.jpg)\n\
  \n这是一种历史遗留的怪癖，**永远不应该**使用。它们已在 PHP 7.0 中移除。\n\n## 第 2 章：变量\n\n#### 第 2.1 节：按名称动态访问变量（变量变量）\n\
  \n变量可以通过动态变量名来访问。变量的名称可以存储在另一个变量中，从而允许动态访问。这种变量被称为变量变量。\n\n要将一个变量转变为变量变量，你需要在变量前加上一个额外的\
  \ `$`。\n\n![](img/Image00031.jpg)\n\n变量变量对于映射函数/方法调用很有用：\n\n![](img/Image00032.jpg)\n\
  \n这在 PHP 类中变得特别有用：\n\n![](img/Image00033.jpg)\n\n将 `$variableName` 放在 `{}` 之间是可能的，但不是必须的：\n\
  \n![](img/Image00034.jpg)\n\n以下两个示例是等效的，都输出 \"baz\"：\n\n![](img/Image00035.jpg)\n\
  \n![](img/Image00036.jpg)\n\n仅当变量名本身是一个表达式时，使用 `{}` 才是强制性的，如下所示：\n\n![](img/Image00037.jpg)\n\
  \n不过，仍然建议始终使用 `{}`，因为它的可读性更好。\n\n虽然不建议这样做，但可以链式调用此行为：\n\n```\n$$$$$$$$DoNotTryThisAtHomeKids\
  \ = $value ;\n```\n\n![](img/Image00038.jpg)\n\n重要的是要注意，许多开发人员认为过度使用变量变量是一种不良实践。因为它们不适合现代\
  \ IDE 进行静态分析，包含许多变量变量（或动态方法调用）的大型代码库会迅速变得难以维护。\n\n##### PHP5 和 PHP7 之间的差异\n\n始终使用\
  \ `{}` 或 `()` 的另一个原因是，PHP5 和 PHP7 处理动态变量的方式略有不同，这在某些情况下会导致不同的结果。\n\n在 PHP7 中，动态变量、属性和方法现在将严格按从左到右的顺序求值，这与\
  \ PHP5 中的特殊情况混合处理形成对比。以下示例展示了求值顺序是如何改变的。\n\n##### 情况 1：`$$foo['bar']['baz']`\n\n\
  | 表达式 | PHP5 解释 | PHP7 解释 |\n| :--- | :--- | :--- |\n| `$$foo['bar']['baz']` | `${$foo['bar']['baz']}`\
  \ | `($$foo)['bar']['baz']` |\n| `$foo['bar']['baz']` | `$foo['bar']['baz']` | `$foo['bar']['baz']`\
  \ |\n| `($$foo)['bar']['baz']` | `${$foo['bar']['baz']}` | `($$foo)['bar']['baz']`\
  \ |\n\n![](img/Image00039.jpg)\n\n##### 情况 2：`$foo->$bar['baz']`\n\n| 表达式 | PHP5\
  \ 解释 | PHP7 解释 |\n| :--- | :--- | :--- |\n| `$foo->$bar['baz']` | `$foo->{$bar['baz']}`\
  \ | `($foo->$bar)['baz']` |\n| `$foo->{$bar['baz']}` | `$foo->{$bar['baz']}` | `$foo->{$bar['baz']}`\
  \ |\n| `($foo->$bar)['baz']` | `$foo->{$bar['baz']}` | `($foo->$bar)['baz']` |\n\
  \n![](img/Image00040.jpg)\n\n##### 情况 3：`$foo->$bar['baz']()`\n\n| 表达式 | PHP5 解释\
  \ | PHP7 解释 |\n| :--- | :--- | :--- |\n| `$foo->$bar['baz']()` | `$foo->{$bar['baz']}()`\
  \ | `($foo->$bar)['baz']()` |\n| `$foo->{$bar['baz']}()` | `$foo->{$bar['baz']}()`\
  \ | `$foo->{$bar['baz']}()` |\n| `($foo->$bar)['baz']()` | `$foo->{$bar['baz']}()`\
  \ | `($foo->$bar)['baz']()` |\n\n![](img/Image00041.jpg)\n\n##### 情况 4：`Foo::$bar['baz']()`\n\
  \n| 表达式 | PHP5 解释 | PHP7 解释 |\n| :--- | :--- | :--- |\n| `Foo::$bar['baz']()` |\
  \ `Foo::{$bar['baz']}()` | `(Foo::$bar)['baz']()` |\n| `Foo::{$bar['baz']}()` |\
  \ `Foo::{$bar['baz']}()` | `Foo::{$bar['baz']}()` |\n| `(Foo::$bar)['baz']()` |\
  \ `Foo::{$bar['baz']}()` | `(Foo::$bar)['baz']()` |\n\n![](img/Image00042.jpg)\n\
  \n#### 第 2.2 节：数据类型\n\n针对不同目的有不同的数据类型。PHP 没有显式的类型定义，变量的类型由赋给它的值的类型决定，或者由它被转换成的类型决定。这是关于类型的简要概述，详细文档和示例请参阅\
  \ PHP 类型主题。\n\nPHP 中有以下数据类型：`null`、`boolean`、`integer`、`float`、`string`、`object`、`resource`\
  \ 和 `array`。\n\n##### Null\n\n`Null` 可以赋值给任何变量。它表示一个没有值的变量。\n\n![](img/Image00043.jpg)\n\
  \n这会使变量失效，如果调用它，其值将是未定义或空的。变量将从内存中清除并由垃圾回收器删除。\n\n##### Boolean\n\n这是最简单的类型，只有两个可能的值。\n\
  \n![](img/Image00044.jpg)\n\n布尔值可用于控制代码流程。\n\n![](img/Image00045.jpg)\n\n##### Integer\n\
  \n整数是正或负的整数。它可以用于任何数制。整数的大小取决于平台。PHP 不支持无符号整数。\n\n![](img/Image00046.jpg)\n\n#####\
  \ Float\n\n浮点数、\"双精度数\"或简称为\"浮点数\"是十进制数字。\n\n![](img/Image00047.jpg)\n\n##### Array\n\
  \n数组就像一个值列表。数组最简单的形式是由整数索引，并按索引排序，第一个元素位于索引 0 处。\n\n```\n$foo = array(1, 2, 3);\
  \ // 一个整数数组\n```\n\n![](img/Image00048.jpg)\n\n```\n$bar = [\"A\", true, 123 =>\
  \ 5]; // 短数组语法，PHP 5.4+\n```\n\n![](img/Image00049.jpg)\n\n数组也可以将非整数索引的键关联到一个值。在\
  \ PHP 中，所有数组在底层都是关联数组，但当我们专门提到“关联数组”时，通常指包含一个或多个非整数键的数组。\n\n![](img/Image00050.jpg)\n\
  \n##### String\n\n字符串就像一个字符数组。\n\n![](img/Image00051.jpg)\n\n像数组一样，字符串可以被索引以返回其单个字符：\n\
  \n![](img/Image00052.jpg)\n\n##### Object\n\n对象是类的实例。其变量和方法可以通过 `->` 运算符访问。\n\n\
  ![](img/Image00053.jpg)\n\n##### Resource\n\n资源变量持有打开的文件、数据库连接、流、图像画布区域等的特殊句柄（正如[手册](https://secure.php.net/manual/en/language.types.resource.php#language.types.resource.casting)中所述）。\n\
  \n```\n$fp = fopen('file.ext', 'r'); // fopen() 是在磁盘上将文件作为资源打开的函数。\nvar_dump($fp);\
  \ // 输出：resource(2) of type (stream)\n```\n\n##### `gettype`\n\n要以字符串形式获取变量的类型，请使用\
  \ `gettype()` 函数：\n\n![](img/Image00055.jpg)\n\n#### 第 2.3 节：全局变量最佳实践\n\n我们可以用以下伪代码来说明这个问题：\n\
