  \n在您的 PHP 代码中，您可以这样做：\n\n![](img/Image01214.jpg)\n\n此外，[这里](http://stackoverflow.com/questions/12005790/how-to-receive-a-file-via-http-put-with-php)\
  \ 您可以阅读关于通过 HTTP PUT 接收文件的有趣 SO 问答。\n\n## 第 56 章：类型转换与非严格比较问题\n\n#### 第 56.1 节：什么是类型转换？\n\
  \nPHP 是一门弱类型语言。这意味着，默认情况下，它不要求表达式中的操作数类型相同（或兼容）。例如，您可以将数字追加到字符串后面，并期望它能正常工作。\n\n\
  ![](img/Image01215.jpg)\n\n输出将为：\n\n![](img/Image01216.jpg) string(24) \"This is\
  \ example number 1\"\n\nPHP 通过自动将不兼容的变量类型转换为允许执行请求操作的类型来实现这一点。在上述情况下，它会将整数字面量 `1`\
  \ 转换为字符串，从而使其可以连接到前面的字符串字面量上。这被称为类型转换。这是 PHP 一个非常强大的功能，但如果您不了解它，也可能导致您拔光头发，甚至引发安全问题。\n\
  \n请看下面的例子：\n\n![](img/Image01217.jpg)\n\n其意图似乎是程序员正在检查变量是否具有值 `1`。但如果 `$variable`\
  \ 的值是 `\"1 and a half\"` 会怎样？答案可能会让您感到惊讶。\n\n![](img/Image01218.jpg)\n\n结果是：\n\n\
  ![](img/Image01219.jpg) bool(true)\n\n为什么会发生这种情况？因为 PHP 意识到字符串 `\"1 and a half\"\
  ` 不是整数，但为了将其与整数 `1` 进行比较，它需要是整数。PHP 不会报错，而是启动类型转换并尝试将变量转换为整数。它通过获取字符串开头所有可以转换为整数的字符并进行转换来实现这一点。一旦遇到无法作为数字处理的字符，就会停止。因此\
  \ `\"1 and a half\"` 被转换为整数 `1`.\n\n诚然，这是一个非常牵强的例子，但它用于演示该问题。接下来的几个例子将涵盖我在真实软件中遇到的由类型转换引起的一些错误情况。\n\
  \n#### 第 56.2 节：从文件读取\n\n当从文件读取时，我们想知道何时到达了文件末端。已知 `fgets()` 在文件末端返回 `false`，我们可能会将其用作循环的条件。然而，如果最后一次读取返回的数据恰好是某个评估为布尔值\
  \ `false` 的值，会导致我们的文件读取循环过早终止。\n\n![](img/Image01220.jpg)\n\n如果被读取的文件包含空行，`while`\
  \ 循环将在该处终止，因为空字符串评估为布尔值 `false`。\n\n相反，我们可以使用严格相等运算符显式检查布尔值 `false`：\n\n![](img/Image01221.jpg)\n\
  \n注意这是一个牵强的例子；在实际生活中，我们会使用以下循环：\n\n![](img/Image01222.jpg)\n\n或者用以下代码替换整个内容：\n\n\
  ![](img/Image01223.jpg)\n\n#### 第 56.3 节：Switch 语句的惊喜\n\nSwitch 语句使用非严格比较来确定匹配。这可能导致一些\
  \ [令人不快的惊喜](http://stackoverflow.com/questions/4098104/odd-behaviour-in-a-switch-statement)。例如，考虑以下语句：\n\
  \n![](img/Image01224.jpg)\n\n这是一个非常简单的语句，当 `$name` 是字符串时按预期工作，但在其他情况下可能会导致问题。\n\n\
  例如，如果 `$name` 是整数 `0`，则比较期间会发生类型转换。然而，被转换的是 `case` 语句中的字面量值，而不是 `switch` 语句中的条件。字符串\
  \ `\"input 1\"` 被转换为整数 `0`，这与输入值整数 `0` 匹配。结果是，如果您提供整数 `0` 的值，第一个 `case` 总是会执行。\n\
  \n此问题有几种解决方案：\n\n**显式转换**\n\n可以在比较前将值转换为字符串：\n\n![](img/Image01225.jpg)\n\n或者也可以使用已知返回字符串的函数：\n\
  \n![](img/Image01226.jpg)\n\n这两种方法都能确保值的类型与 `case` 语句中的值类型相同。\n\n**避免使用 switch**\n\
  \n使用 `if` 语句将使我们能够控制比较的方式，从而允许我们使用严格比较运算符：\n\n![](img/Image01227.jpg)\n\n#### 第\
  \ 56.4 节：严格类型\n\n自 PHP 7.0 起，可以通过 [严格类型](http://php.net/manual/en/functions.arguments.php#functions.arguments.type-declaration.strict)\
  \ 缓解类型转换的一些有害影响。通过将此 `declare` 语句作为文件的第一行包含进来，PHP 将通过抛出 `TypeError` 异常来强制执行参数类型声明和返回类型声明。\n\
  \n![](img/Image01228.jpg)\n\n例如，这段使用参数类型定义的代码在运行时将抛出一个可捕获的 `TypeError` 类型异常：\n\n\
  ![](img/Image01229.jpg)\n\n同样，这段代码使用了返回类型声明；如果它尝试返回除整数以外的任何内容，也将抛出异常：\n\n![](img/Image01230.jpg)\n\
  \n## 第 57 章：Sockets\n\n#### 第 57.1 节：TCP 客户端 Socket\n\n创建一个使用 TCP（传输控制协议）的 socket\n\
  \n```\n$socket = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);\n```\n\n确保 socket\
  \ 成功创建。`onSocketFailure` 函数来自本主题中的处理 socket 错误示例。\n\n```\nif (!is_resource($socket))\
  \ onSocketFailure(\"Failed to create socket\");\n```\n\n将 socket 连接到指定地址。如果连接失败，第二行将优雅地处理失败。\n\
  \n```\nsocket_connect($socket, \"chat.stackoverflow.com\", 6667)\n    or onSocketFailure(\"\
  Failed to connect to chat.stackoverflow.com:6667\", $socket);\n```\n\n向服务器发送数据\n\
  \n`socket_write` 函数通过 socket 发送字节。在 PHP 中，字节数组由字符串表示，通常不区分编码。\n\n![](img/Image01234.jpg)\n\
  \n从服务器接收数据\n\n以下片段使用 `socket_read` 函数从服务器接收一些数据。\n\n将 `PHP_NORMAL_READ` 作为第三个参数传递，将读取直到遇到\
  \ `\\r` / `\\n` 字节，且该字节包含在返回值中。\n\n相反，传递 `PHP_BINARY_READ` 将从流中读取所需数量的数据。\n\n如果之前调用了\
  \ `socket_set_nonblock` 且使用了 `PHP_BINARY_READ`，`socket_read` 将立即返回 `false`。否则，该方法将阻塞，直到接收到足够的数据（达到第二个参数中的长度，或达到行尾），或\
  \ socket 关闭。\n\n此示例从假设的 IRC 服务器读取数据。\n\n![](img/Image01235.jpg)\n\n关闭 Socket\n\n\
  关闭 socket 将释放 socket 及其相关资源。\n\n![](img/Image01236.jpg)\n\n#### 第 57.2 节：TCP 服务端\
  \ Socket\n\nSocket 创建\n\n创建一个使用 TCP 的 socket。这与创建客户端 socket 相同。\n\n![](img/Image01237.jpg)\n\
  \nSocket 绑定\n\n将来自给定网络（参数 2）的特定端口（参数 3）的连接绑定到 socket。\n\n第二个参数通常是 `\"0.0.0.0\"`，它接受来自所有网络的连接。它也可以\n\
  \n\n\n\n\n![](img/Image01238.jpg)\n\n`socket_bind` 报错的一个常见原因是[指定的地址已绑定到另一个进程](https://www.google.com.hk/search?q=site%3Astackexchange.com%20OR%20site%3Astackoverflow.com%20kill%20processes%20bound%20to%20address)。通常会终止其他进程（通常是手动终止，以防止意外终止关键进程），以便释放套接字。\n\
  \n```\nsocket_bind($socket, \"0.0.0.0\", 6667) or onSocketFailure(\"Failed to bind\
  \ to 0.0.0.0:6667\");\n```\n\n### 设置套接字监听\n\n使用 `socket_listen` 使套接字监听传入的连接。第二个参数是在连接被接受之前允许排队的最大连接数。\n\
  \n![](img/Image01239.jpg)\n\n```\nsocket_listen($socket, 5);\n```\n\n### 处理连接\n\n\
  TCP 服务器实际上是处理子连接的服务器。`socket_accept` 会创建一个新的子连接。\n\n![](img/Image01240.jpg)\n\n\
  来自 `socket_accept` 的连接的数据传输与 TCP 客户端套接字的数据传输相同。\n\n```\nsocket_close($conn);\n```\n\
  \n当需要关闭此连接时，直接调用 `socket_close($conn);`。这不会影响原始的 TCP 服务器套接字。\n\n### 关闭服务器\n\n```\n\
  socket_close($socket);\n```\n\n另一方面，当服务器不再使用时，应调用 `socket_close($socket);`。这也会释放\
  \ TCP 地址，允许其他进程绑定到该地址。\n\n#### 第 57.3 节：UDP 服务器套接字\n\nUDP（用户数据报协议）服务器与 TCP 不同，不是基于流的。它是基于数据包的，即客户端以“数据包”为单位向服务器发送数据，并通过客户端的地址来识别客户端。没有内置函数关联来自同一客户端的不同数据包（与\
  \ TCP 不同，TCP 中来自同一客户端的数据由 `socket_accept` 创建的特定资源处理）。可以将其视为每当一个 UDP 数据包到达时，都会接受并关闭一个新的\
  \ TCP 连接。\n\n### 创建 UDP 服务器套接字\n\n![](img/Image01241.jpg)\n\n### 将套接字绑定到地址\n\n参数与\
  \ TCP 服务器相同。\n\n![](img/Image01242.jpg)\n\n```\nsocket_bind($socket, $address, $port);\n\
  ```\n\n### 发送数据包\n\n此行将 `$data` 作为 UDP 数据包发送到 `$address:$port`。\n\n![](img/Image01243.jpg)\n\
  \n```\nsocket_sendto($socket, $data, strlen($data), 0, $address, $port);\n```\n\n\
  ### 接收数据包\n\n以下代码片段尝试以客户端索引的方式管理 UDP 数据包。\n\n![](img/Image01244.jpg)\n\n### 关闭服务器\n\
  \n`socket_close` 可用于 UDP 服务器套接字资源。这将释放 UDP 地址，允许其他进程绑定到该地址。\n\n#### 第 57.4 节：处理套接字错误\n\
  \n`socket_last_error` 可用于获取套接字扩展中最后一个错误的错误 ID。`socket_strerror` 可用于将 ID 转换为人类可读的字符串。\n\
  \n![](img/Image01245.jpg)\n\n## 第 58 章：PDO\n\n[PDO](http://php.net/manual/en/book.pdo.php)（PHP\
  \ 数据对象）扩展允许开发者连接到多种不同类型的数据库，并以统一的、面向对象的方式对它们执行查询。\n\n#### 第 58.1 节：使用参数化查询防止 SQL\
  \ 注入\n\nSQL 注入是一种允许恶意用户修改 SQL 查询、向其中添加不需要的命令的攻击。例如，以下代码是脆弱的：\n\n![](img/Image01246.jpg)\n\
  \n这允许该脚本的任何用户基本上随意修改我们的数据库。例如考虑以下查询字符串：\n\n![](img/Image01247.jpg)\n\n这会使我们的示例查询变成这样：\n\
  \n![](img/Image01248.jpg)\n\n```\nSELECT name, email, user_level FROM users WHERE\
  \ userID = 0; TRUNCATE TABLE users;\n```\n\n虽然这是一个极端的例子（大多数 SQL 注入攻击并不旨在删除数据，而且大多数\
  \ PHP 查询执行函数不支持多查询），但这展示了由于查询组装不当，SQL 注入攻击是如何成为可能的。不幸的是，此类攻击非常常见，并且由于程序员未能采取适当的预防措施来保护数据，其效果极佳。\n\
  \n为了防止 SQL 注入的发生，预处理语句是推荐的解决方案。不直接将用户数据拼接到查询中，而是使用占位符。然后单独发送数据，这意味着 SQL 引擎没有机会将用户数据与一组指令混淆。\n\
  \n![](img/Image01249.jpg)\n\n> 虽然此处的主题是 PDO，但请注意 PHP MySQLi 扩展也支持预处理语句。\n\nPDO 支持两种占位符（占位符不能用于列名或表名，仅用于值）：\n\
  \n### 1. 命名占位符\n\n一个冒号（`:`），后跟一个唯一的名称（例如 `:user`）。\n\n```php\n// 使用命名占位符\n$sql =\
  \ 'SELECT name, email, user_level FROM users WHERE userID = :user';\n$prep = $conn->prepare($sql);\n\
  $prep->execute(['user' => $_GET['user']]); // 关联数组\n$result = $prep->fetchAll();\n\
  ```\n\n### 2. 传统 SQL 位置占位符\n\n表示为 `?`。\n\n```php\n// 使用问号占位符\n$sql = 'SELECT name,\
  \ user_level FROM users WHERE userID = ? AND user_level = ?';\n$prep = $conn->prepare($sql);\n\
  $prep->execute([$_GET['user'], $_GET['user_level']]); // 索引数组\n```\n\n![](img/Image01252.jpg)\n\
  \n如果您确实需要动态更改表名或列名，请知晓这存在安全风险且属于不良实践。尽管如此，可以通过字符串拼接来完成。提高此类查询安全性的一种方法是设置一个允许值的表，并将要拼接的值与该表进行比较。\n\
  \n请注意，重要的是仅通过 DSN 设置连接字符集，否则如果使用了某些奇特的编码，您的应用程序可能容易受到[一个隐蔽的漏洞](https://stackoverflow.com/questions/134099/are-pdo-prepared-statements-sufficient-to-prevent-sql-injection/12202218#12202218)的影响。对于\
  \ 5.3.6 之前的 PDO 版本，无法通过 DSN 设置字符集，因此唯一的选择是在连接创建后立即将 `PDO::ATTR_EMULATE_PREPARES`\
  \ 属性设置为 false。\n\n![](img/Image01253.jpg)\n\n这会导致 PDO 使用底层 DBMS 的原生预处理语句，而不仅仅是模拟它。\n\
  \n但是，请注意 PDO 会[静默回退](https://github.com/php/php-src/blob/master/ext/pdo_mysql/mysql_driver.c#L210)到模拟\
  \ MySQL 无法原生预处理的语句：它能原生预处理的语句[在手册中列出](http://dev.mysql.com/doc/en/sql-syntax-prepared-statements.html)([来源](https://stackoverflow.com/questions/134099/are-pdo-prepared-statements-sufficient-to-prevent-sql-injection/12202218#12202218))。\n\
  \n#### 第 58.2 节：基本 PDO 连接与检索\n\n自 PHP 5.0 起，[PDO](http://php.net/manual/en/intro.pdo.php)\
  \ 作为数据库访问层可用。它与数据库无关，因此以下连接示例代码只需更改 DSN 即可适用于其[任何支持的数据库](http://php.net/manual/en/pdo.drivers.php)。\n\
  \n![](img/Image01254.jpg)\n\n[`prepare`](http://php.net/manual/en/pdo.prepare.php)\
  \ 函数从查询字符串创建一个 `PDOStatement` 对象。查询的执行和结果的检索在此返回的对象上执行。如果失败，该函数根据 PDO 连接的配置，要么返回\
  \ false，要么抛出异常。\n\n#### 第 58.3 节：使用 PDO 进行数据库事务\n\n数据库事务确保仅当每条语句都成功时，一组数据更改才会永久生效。事务期间发生的任何查询或代码失败都可以被捕获，随后您可以选择回滚尝试的更改。\n\
  \nPDO 提供了用于开始、提交和回滚事务的简单方法。\n\n![](img/Image01255.jpg)\n\n在事务期间进行的任何数据更改仅对活动连接可见。即使更改尚未提交到数据库，`SELECT`\
  \ 语句也会返回更改后的数据。\n\n\n\n\n> **注意：** 请参阅数据库供应商文档以了解事务支持的详细信息。某些系统完全不支持事务。某些支持嵌套事务，而其他系统则不支持。\n\
  \n# 使用 PDO 进行事务处理的实际示例\n\n以下部分演示了一个实际的真实场景，其中事务的使用确保了数据库的一致性。\n\n想象一下以下场景，假设你正在为一个电子商务网站构建购物车，并决定将订单保存在两个数据库表中。一个名为\
  \ `orders`，包含字段 `order_id`、`name`、`address`、`telephone` 和 `created_at`。另一个名为 `orders_products`，包含字段\
  \ `order_id`、`product_id` 和 `quantity`。第一个表包含订单的元数据，而第二个表包含实际订购的产品。\n\n## 向数据库插入新订单\n\
  \n要向数据库插入新订单，你需要做两件事。首先，你需要向 `orders` 表 `INSERT` 一条新记录，该记录将包含订单的元数据（`name`、`address`\
  \ 等）。然后，你需要为订单中包含的每个产品，向 `orders_products` 表 `INSERT` 一条记录。\n\n你可以通过执行类似以下操作来实现：\n\
  \n![Image01256.jpg](img/Image01256.jpg)\n\n这对于向数据库插入新订单效果很好，直到发生意外情况，导致第二个 `INSERT`\
  \ 查询因某种原因失败。如果发生这种情况，你将在 `orders` 表中得到一个新订单，但它没有关联任何产品。幸运的是，修复方法非常简单，你只需将查询以单个数据库事务的形式执行即可。\n\
  \n## 使用事务向数据库插入新订单\n\n要使用 PDO 开启事务，只需在执行任何数据库查询之前调用 `beginTransaction()` 方法。然后通过执行\
  \ `INSERT` 和/或 `UPDATE` 查询对数据进行任何想要的更改。最后调用 `PDO` 对象的 `commit()` 方法使更改永久生效。在调用 `commit()`\
  \ 方法之前，你对数据所做的每一项更改都尚未永久生效，只需调用 `PDO` 对象的 `rollback()` 方法即可轻松撤销。\n\n以下示例演示了使用事务向数据库插入新订单，同时确保数据的一致性。如果两个查询中的任何一个失败，所有更改都将被撤销。\n\
  \n![Image01257.jpg](img/Image01257.jpg)\n\n#### 第 58.4 节：PDO：连接到 MySQL/MariaDB 服务器\n\
  \n根据你的基础设施，有两种连接到 MySQL/MariaDB 服务器的方式。\n\n## 标准 (TCP/IP) 连接\n\n```php\n$dsn = 'mysql:dbname=demo;host=server;port=3306;charset=utf8';\n\
  \n$connection = new \\PDO($dsn, $username, $password);\n\n// 发生 SQL 错误时抛出异常\n$connection->setAttribute(\\\
  PDO::ATTR_ERRMODE, \\PDO::ERRMODE_EXCEPTION);\n\n// 防止预处理语句模拟\n$connection->setAttribute(\\\
  PDO::ATTR_EMULATE_PREPARES, false);\n```\n\n![Image01258.jpg](img/Image01258.jpg)\n\
  \n由于 PDO 设计为与旧版 MySQL 服务器兼容（这些版本不支持预处理语句），你必须显式禁用模拟。否则，你将失去使用预处理语句通常带来的防注入优势。\n\n\
  另一个需要注意的设计妥协是默认的错误处理行为。如果不另行配置，PDO 不会显示任何 SQL 错误的迹象。\n\n强烈建议将其设置为“异常模式”，因为在编写持久化抽象层时（例如：违反\
  \ UNIQUE 约束时抛出异常），这能提供额外的功能。\n\n## Socket 连接\n\n```php\n$dsn = 'mysql:unix_socket=/tmp/mysql.sock;dbname=demo;charset=utf8';\n\
  \n$connection = new \\PDO($dsn, $username, $password);\n\n// 发生 SQL 错误时抛出异常\n$connection->setAttribute(\\\
  PDO::ATTR_ERRMODE, \\PDO::ERRMODE_EXCEPTION);\n\n// 防止预处理语句模拟\n$connection->setAttribute(\\\
  PDO::ATTR_EMULATE_PREPARES, false);\n```\n\n![Image01259.jpg](img/Image01259.jpg)\n\
  \n在类 Unix 系统上，如果主机名是 `localhost`，则通过域套接字连接到服务器。\n\n#### 第 58.5 节：PDO：获取查询影响的行数\n\
  \n| 方法 | 说明 |\n| --- | --- |\n| `rowCount()` | 返回由相应 `PDOStatement` 对象执行的最后一个 DELETE、INSERT\
  \ 或 UPDATE 语句影响的行数。 |\n\n我们从 `$db` 开始，它是 `PDO` 类的一个实例。执行查询后，我们通常想确定受其影响的行数。`PDOStatement`\
  \ 的 `rowCount()` 方法非常适合这项工作：\n\n```php\n$query = $db->query(\"DELETE FROM table\
  \ WHERE name = 'John'\");\n$count = $query->rowCount();\necho \"Deleted $count rows\
  \ named John\";\n```\n\n> **注意：** 此方法仅应用于确定 `INSERT`、`DELETE` 和 `UPDATE` 语句影响的行数。虽然此方法对\
  \ `SELECT` 语句也可能有效，但并非在所有数据库中都一致。\n\n#### 第 58.6 节：PDO::lastInsertId()\n\n你经常可能需要获取刚插入数据库表中的行的自增\
  \ ID 值。你可以使用 `lastInsertId()` 方法实现这一点。\n\n![Image01260.jpg](img/Image01260.jpg)\n\
  \n```php\n// 1. 准备查询\n$query = \"INSERT INTO foo_user(pseudo, email) VALUES ('anonymous',\
  \ 'anonymous@example.com')\";\n\n// 2. 执行查询\n$query_success = $pdo->query($query);\n\
  \n// 3. 获取最后插入的 ID\n$id = $pdo->lastInsertId(); // 返回值为整数\n```\n\n![Image01261.jpg](img/Image01261.jpg)\n\
  \n在 PostgreSQL 和 Oracle 中，存在 `RETURNING` 关键字，它返回当前插入/修改行的指定列。此处为插入一条记录的示例：\n\n![Image01262.jpg](img/Image01262.jpg)\n\
  \n## 第 59 章：PHP MySQLi\n\n[mysqli](http://php.net/manual/en/book.mysqli.php) 接口是\
  \ mysql 接口的改进版（意为“MySQL 改进扩展”），mysql 接口在 5.5 版本中被弃用，并在 7.0 版本中被移除。mysqli 扩展（有时称为\
  \ MySQL 改进扩展）的开发旨在利用 MySQL 4.1.3 及更新版本中发现的新功能。mysqli 扩展包含在 PHP 5 及更高版本中。\n\n####\
  \ 第 59.1 节：关闭连接\n\n当我们完成数据库查询后，建议关闭连接以释放资源。\n\n### 面向对象风格\n\n![Image01263.jpg](img/Image01263.jpg)\n\
  \n### 过程化风格\n\n![Image01264.jpg](img/Image01264.jpg)\n\n> **注意：** 除非通过显式调用关闭连接函数提前关闭，否则服务器连接将在脚本执行结束时立即关闭。\n\
  \n**用例：** 如果我们的脚本在获取结果后有大量处理要执行，且已检索完整个结果集，我们绝对应该关闭连接。如果不这样做，当 Web 服务器负载繁重时，MySQL\
  \ 服务器有可能达到其连接限制。\n\n#### 第 59.2 节：MySQLi 连接\n\n### 面向对象风格\n\n#### 连接到服务器\n\n![Image01265.jpg](img/Image01265.jpg)\n\
  \n```php\n$conn->select_db(\"my_db\");\n```\n\n#### 连接到数据库\n\n![Image01266.jpg](img/Image01266.jpg)\n\
  \n### 过程化风格\n\n#### 连接到服务器\n\n![Image01267.jpg](img/Image01267.jpg)\n\n```php\n\
  mysqli_select_db($conn, \"my_db\");\n```\n\n#### 连接到数据库\n\n```php\n$conn = mysqli_connect(\"\
  localhost\", \"my_user\", \"my_password\", \"my_db\");\n```\n\n![Image01268.jpg](img/Image01268.jpg)\n\
  \n### 验证数据库连接\n\n#### 面向对象风格\n\n![Image01269.jpg](img/Image01269.jpg)\n\n#### 过程化风格\n\
  \n![Image01270.jpg](img/Image01270.jpg)\n\n#### 第 59.3 节：遍历 MySQLi 结果\n\nPHP 使得从结果中获取数据并使用\
  \ `while` 语句循环遍历变得很容易。当无法获取下一行时，它返回 `false`，循环随之结束。这些示例适用于\n\n\n\n# MySQLi 函数与预处理语句\n\
  \n## 获取结果\n\n以下函数从结果集中检索行：\n\n- `mysqli_fetch_assoc()` — 以列名为键的关联数组\n- `mysqli_fetch_object()`\
  \ — 以列名为变量的 `stdClass` 对象\n- `mysqli_fetch_array()` — 关联和数字数组（可使用参数仅获取其中一种）\n- `mysqli_fetch_row()`\
  \ — 数字数组\n\n### 面向对象风格\n![Image01272.jpg](img/Image01272.jpg)\n\n### 过程化风格\n![Image01273.jpg](img/Image01273.jpg)\n\
  \n要从结果中获取确切信息，我们可以使用：\n![Image01274.jpg](img/Image01274.jpg)\n\n#### 第 59.4 节：MySQLi\
  \ 中的预处理语句\n\n请阅读 *使用参数化查询防止 SQL 注入*，以全面了解预处理语句为何能帮助您保护 SQL 语句免受 SQL 注入攻击。\n\n此处的\
  \ `$conn` 变量是一个 `MySQLi` 对象。详情请参阅 *MySQLi 连接示例*。\n\n对于两个示例，我们假设 `$sql` 为：\n![Image01275.jpg](img/Image01275.jpg)\n\
  \n`?` 代表我们稍后将提供的值。请注意，无论类型如何，我们都不需要为占位符加引号。我们也只能在查询的数据部分提供占位符，即 `SET`、`VALUES` 和\
  \ `WHERE`。您不能在 `SELECT` 或 `FROM` 部分使用占位符。\n\n### 面向对象风格\n![Image01276.jpg](img/Image01276.jpg)\n\
  \n### 过程化风格\n![Image01277.jpg](img/Image01277.jpg)\n\n| `$stmt->bind_param` |\n\
  | --- |\n\n`bind_param()` 的第一个参数或 `mysqli_stmt_bind_param()` 的第二个参数由 SQL 查询中相应参数的数据类型决定：\n\
  \n| 参数 | 绑定参数的数据类型 |\n| --- | --- |\n| i | integer（整数） |\n| d | double（双精度浮点数） |\n\
  | s | string（字符串） |\n| b | blob（二进制大对象） |\n\n| `column_2` | `=` | `?` | `)` 是字符串，第二个参数（`column_3`\
  \ | `>` | `?` |\n| --- | --- | --- | --- | --- | --- |\n\n您的参数列表顺序必须与查询中提供的顺序一致。在本例中\
  \ `si` 表示第一个参数是整数。\n\n关于检索数据，请参阅 *如何从预处理语句获取数据*。\n\n#### 第 59.5 节：转义字符串\n\n转义字符串是一种较旧（且安全性较低）的方法，用于保护插入查询的数据。它通过使用\
  \ [MySQL 的函数 `mysql_real_escape_string()`](http://dev.mysql.com/doc/refman/5.7/en/mysql-real-escape-string.html)\
  \ 来处理和清理数据（换句话说，是 MySQL 而非 PHP 在执行转义）。MySQLi API 提供了对该函数的直接访问：\n![Image01278.jpg](img/Image01278.jpg)\n\
  \n此时，您拥有一个 MySQL 认为可安全用于直接查询的字符串：\n![Image01279.jpg](img/Image01279.jpg)\n\n那么为什么这不如预处理语句安全？存在欺骗\
  \ MySQL 生成其认为安全的字符串的方法。请考虑以下示例：\n![Image01280.jpg](img/Image01280.jpg)\n\n| OR |\n\
  | --- |\n\n`1=1` 并不代表 MySQL 会转义的数据，但这仍然构成 SQL 注入。还有 [其他](http://stackoverflow.com/questions/5741187/sql-injection-that-gets-around-mysql-real-escape-string)\
  \ [示例](http://stackoverflow.com/questions/5741187/sql-injection-that-gets-around-mysql-real-escape-string)\
  \ 表明其会返回不安全数据。问题在于 MySQL 的转义函数旨在使数据符合 SQL 语法。它**并非**旨在确保 MySQL 不会将用户数据误认为 SQL 指令。\n\
  \n#### 第 59.6 节：MySQLi 中的 SQL 调试\n\n因此您的查询失败了（关于如何创建 `$conn`，请参阅 *MySQLi 连接*）：\n\
  \n```php\n$result = $conn->query('SELECT * FROM non_existent_table'); // 此查询将失败\n\
  ```\n\n我们如何查明发生了什么？`$result` 为 `false`，这无济于事。幸运的是，连接对象 `$conn` 可以告诉我们 MySQL 关于失败的报告：\n\
  ![Image01282.jpg](img/Image01282.jpg)\n\n或过程化风格：\n![Image01283.jpg](img/Image01283.jpg)\n\
  \n您应该会得到类似以下的错误：\n![Image01284.jpg](img/Image01284.jpg) Table 'my_db.non_existent_table'\
  \ doesn't exist（表 'my_db.non_existent_table' 不存在）\n\n#### 第 59.7 节：MySQLi 查询\n\n\
  `query()` 函数接受一个有效的 SQL 字符串并直接针对数据库连接 `$conn` 执行它。\n\n### 面向对象风格\n![Image01285.jpg](img/Image01285.jpg)\n\
  ![Image01286.jpg](img/Image01286.jpg)\n\n此处常见的问题是，人们直接执行查询并期望其生效（即返回一个 `mysqli_stmt`\
  \ 对象）。由于此函数仅接受字符串，您需要先自行构建查询。如果 SQL 中存在任何错误，MySQL 编译器将失败，此时该函数将返回 `false`。\n\n```php\n\
  $result = $conn->query('SELECT * FROM non_existent_table'); // 此查询将失败\n$row = $result->fetch_assoc();\n\
  ```\n\n上述代码将产生 `E_FATAL` 错误，因为 `$result` 为 `false`，而非对象。\n\n![Image01288.jpg](img/Image01288.jpg)\
  \ PHP Fatal error: Call to a member function `fetch_assoc()` on a non-object（PHP\
  \ 致命错误：调用非对象的成员函数 `fetch_assoc()`）\n\n过程化风格的错误类似，但非致命，因为我们只是违反了函数的预期。\n![Image01289.jpg](img/Image01289.jpg)\n\
  \n您将从 PHP 获得以下消息：\n![Image01290.jpg](img/Image01290.jpg) mysqli_fetch_array() expects\
  \ parameter 1 to be mysqli_result, boolean given（mysqli_fetch_array() 期望参数 1 为 mysqli_result，布尔值\
  \ given）\n\n您可以通过先进行测试来避免此问题：\n![Image01291.jpg](img/Image01291.jpg)\n\n#### 第 59.8\
  \ 节：如何从预处理语句获取数据\n\n### 预处理语句\n关于如何准备和执行查询，请参阅 *MySQLi 中的预处理语句*。\n\n### 结果绑定\n\n\
  #### 面向对象风格\n![Image01292.jpg](img/Image01292.jpg)\n\n#### 过程化风格\n![Image01293.jpg](img/Image01293.jpg)\n\
  \n使用 `bind_result()` 的问题在于，它要求语句指定将要使用的列。这意味着：\n\n| `SELECT forename FROM users`\
