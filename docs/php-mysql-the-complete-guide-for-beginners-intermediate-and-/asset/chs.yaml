  \ | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n\n用法：`array_reduce($array,\
  \ function($carry, $item) { ... }, $defaul_value_of_first_carry)`\n\n`$carry` 是上一轮迭代的结果。`$item`\
  \ 是数组中当前位置的值。\n\n**数组求和**\n\n![](img/Image00379.jpg)\n\n![](img/Image00380.jpg)\n\
