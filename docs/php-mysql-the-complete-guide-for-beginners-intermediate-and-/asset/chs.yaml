  \n![](img/Image01603.jpg)\n\n请注意缺少的花括号。另请注意，此错误显示的行号无关紧要——它始终显示文档的最后一行。\n\n## 第\
  \ 93 章：错误和警告汇编\n\n## 第 93.1 节：解析错误：语法错误，意外的 T_PAAMAYIM_NEKUDOTAYIM\n\n**外观**\n\n\
  \"Paamayim Nekudotayim\" 在希伯来语中意为“双冒号”；因此此错误指的是双冒号运算符（`::`）的不当使用。该错误通常是由尝试调用一个实际上并非静态的静态方法引起的。\n\
  \n**可能的解决方案**\n\n![](img/Image01604.jpg)\n\n如果上述代码导致此错误，您很可能只需更改调用该方法的方式：\n\n![](img/Image01605.jpg)\n\
  \n| `doMethod()` |\n| --- |\n\n后一个示例假设 `$classname` 是一个类的实例，且该方法不是该类的静态方法。\n\n##\
  \ 第 93.2 节：Notice: Undefined index（未定义索引）\n\n**外观**\n\n尝试使用数组中不存在的键来访问数组。\n\n**可能的解决方案**\n\
  \n在访问前检查其可用性。使用：\n\n| `isset()` |\n| --- |\n\n| `array_key_exists()` |\n| --- |\n\
  \n1. `isset()`\n2. `array_key_exists()`\n\n## 第 93.3 节：Warning: Cannot modify header\
  \ information - headers already sent（无法修改标头信息 - 标头已发送）\n\n**外观**\n\n当您的脚本尝试向客户端发送\
  \ HTTP 标头，但在此之前已有输出，导致标头已发送给客户端时发生。\n\n**可能的原因**\n\n1. **Print, echo**：来自 `print`\
  \ 和 `echo` 语句的输出将终止发送 HTTP 标头的机会。必须重构应用程序流程以避免这种情况。\n\n| `header()` |\n| --- |\n\
  \n2. **原始 HTML 区域**：`.php` 文件中未解析的 HTML 部分也是直接输出。将触发 `header()` 调用的脚本条件必须置于任何原始块之前。\n\
  \n![](img/Image01606.jpg)\n\n3. **`<?php` 前的空白字符导致 \"script.php line 1\" 警告**：如果警告指的是第\
  \ 1 行的输出，则主要是开头标记 `<?php` 之前的前导空白、文本或 HTML。\n\n![](img/Image01607.jpg)\n\n参考来自 SO\
  \ [answer](http://stackoverflow.com/a/8028987/5447994) by [Mario](http://stackoverflow.com/users/345031/mario)。\n\
  \n## 第 94 章：异常处理和错误报告\n\n#### 第 94.1 节：设置错误报告及显示位置\n\n如果在 `php.ini` 中尚未完成，错误报告可以动态设置，并应设置为允许显示大多数错误。\n\
  \n**语法**\n\n![](img/Image01608.jpg)\n\n**示例**\n\n![](img/Image01609.jpg)\n\n错误默认会由\
  \ PHP 记录，通常在与运行脚本同级的 `error.log` 文件中。在开发环境中，也可以在屏幕上显示它们：\n\n![](img/Image01610.jpg)\n\
  \n然而在生产环境中，应该：\n\n![](img/Image01611.jpg)\n\n并通过使用异常或错误处理程序显示友好的问题提示信息。\n\n####\
  \ 第 94.2 节：记录致命错误\n\n在 PHP 中，致命错误是一种无法被捕获的错误；即程序在经历致命错误后不会恢复执行。但是，要记录此错误或以某种方式处理崩溃，可以使用\
  \ `register_shutdown_function()` 来注册一个关闭处理程序。\n\n![](img/Image01612.jpg)\n\n![](img/Image01613.jpg)\n\
