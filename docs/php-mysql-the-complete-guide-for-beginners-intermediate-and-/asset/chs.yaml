  \n#### 第 33.3 节：使用 Cookie\n\ncURL 可以保留响应中接收到的 Cookie，以供后续请求使用。对于内存中的简单会话 Cookie\
  \ 处理，只需一行代码即可实现：\n\n![Image00818.jpg](img/Image00818.jpg)\n\n如果你需要在 cURL 句柄销毁后保留\
  \ Cookie，可以指定存储它们的文件：\n\n![Image00819.jpg](img/Image00819.jpg)\n\n然后，当你想再次使用它们时，将它们作为\
  \ Cookie 文件传递：\n\n![Image00820.jpg](img/Image00820.jpg)\n\n但请记住，除非你需要在不同的 cURL 句柄之间传递\
  \ Cookie，否则这两个步骤并非必要。对于大多数用例，将 `CURLOPT_COOKIEFILE` 设置为空字符串就是你所需要的一切。\n\nCookie\
  \ 处理可用于例如从需要登录的网站检索资源。这通常是一个两步过程。首先，向登录页面发送 POST 请求。\n\n![Image00821.jpg](img/Image00821.jpg)\n\
  \n第二步（在完成标准错误检查后）通常是一个简单的 GET 请求。重要的是要为第二个请求重用现有的 cURL 句柄。这确保了来自第一个响应的 Cookie 将自动包含在第二个请求中。\n\
  \n![Image00822.jpg](img/Image00822.jpg)\n\n这仅作为 Cookie 处理的一个示例。在现实生活中，情况通常更复杂。通常你必须先对登录页面执行初始\
  \ GET 以获取一个需要包含在 POST 中的登录令牌。其他网站可能会根据其 User-Agent 字符串阻止 cURL 客户端，这就要求你更改它。\n\n\
