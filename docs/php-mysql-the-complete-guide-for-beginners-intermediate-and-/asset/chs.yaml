  \ `strtotime()` 返回 false，进而导致你的日期变为 1969-12-31。\n\n### 使用 `DateTime()`\n\n自 PHP\
  \ 5.2 起，PHP 提供了 `DateTime` 类，它为我们处理日期（和时间）提供了更强大的工具。我们可以使用 `DateTime` 重写上述代码，如下所示：\n\
