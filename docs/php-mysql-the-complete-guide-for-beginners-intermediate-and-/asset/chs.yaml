  \n## 第 79 章：自动加载入门\n\n#### 第 79.1 节：作为框架解决方案一部分的自动加载\n\n![](img/Image01511.jpg)\n\
  \n得益于我们的通用自动加载器，我们可以访问任何遵循我们自动加载命名约定的类。在本例中，我们的约定很简单：所需的类必须在同一目录下有一个以类命名并以 \".php\"\
  \ 结尾的文件。请注意，类名与文件名完全匹配。\n\n如果没有自动加载，我们将不得不手动 `require` 基类。如果我们建立了一个完整的动物园，我们将有成千上万个\
  \ `require` 语句，这些语句可以更容易地被单个自动加载器替换。\n\n\n\n\n# PHP 自动加载与 SPL 数据结构\n\n## PHP 自动加载概述\n\
  \n归根结底，PHP 自动加载是一种帮助你编写更少机械代码、从而专注于解决业务问题的机制。你只需定义一种将类名映射到文件名的策略。你可以像这里一样实现自己的自动加载策略。或者，你可以使用\
  \ PHP 社区采用的标准策略：[PSR-0](http://www.php-fig.org/psr/psr-0/) 或 [PSR-4](http://www.php-fig.org/psr/psr-4/)。又或者，你可以使用\
  \ [composer](http://www.getcomposer.org/) 来通用地定义和管理这些依赖。\n\n#### 第 79.2 节：内联类定义，无需加载\n\
  \n![](img/Image01512.jpg)\n\n![](img/Image01513.jpg)\n\n| new Animal |\n| --- |\n\
  \nPHP 在执行前就知道 `Animal` 是什么，因为 PHP 是自上而下读取源文件的。但如果我们想在许多地方创建新的 `Animal` 对象，而不仅仅是在定义它的源文件中，该怎么办？为此，我们需要加载类定义。\n\
  \n#### 第 79.3 节：使用 require 手动加载类\n\n![](img/Image01514.jpg)\n\n这里有三个文件。一个文件 (`Animal.php`)\
  \ 定义了类。除了定义类之外，该文件没有副作用，并将关于 \"Animal\" 的所有知识整齐地保存在一个地方。它易于版本控制，也易于复用。\n\n| new\
  \ Animal |\n| --- |\n\n两个文件通过手动 `require` 来使用 `Animal.php` 文件。同样，PHP 自上而下读取源文件，因此\
  \ `require` 会去查找 `Animal.php` 文件，并在调用 `new Animal` 之前使 `Animal` 类定义可用。\n\n| new\
  \ Animal |\n| --- |\n\n现在想象一下，如果我们有几十或几百种情况想要执行 `new Animal`。那将需要许多许多 `require`\
  \ 语句（双关语，原文 \"require\" 既是函数名也是“需要”之意），编写起来非常繁琐。\n\n#### 第 79.4 节：自动加载替代手动类定义加载\n\
  \n![](img/Image01515.jpg)\n\n![](img/Image01516.jpg)\n\n| require \"Animal.php\"\
  \ |\n| --- |\n\n将其与其他示例进行比较。注意 `require \"Animal.php\"` 是如何被 `require \"autoload.php\"\
  ` 替换的。我们仍然在运行时包含一个外部文件，但包含的不再是特定的类定义，而是能够包含*任意*类的逻辑。这是一种间接层，简化了我们的开发。我们不再为每个需要的类编写一个\
  \ `require`，而是为所有类编写一个 `require`。我们可以用 1 个 `require` 替换 N 个 `require`。\n\n神奇之处在于\
  \ [`spl_autoload_register`](http://php.net/manual/en/function.spl-autoload-register.php)。此\
  \ PHP 函数接受一个闭包，并将该闭包添加到闭包队列中。当 PHP 遇到一个没有定义的类时，PHP 将类名传递给队列中的每个闭包。如果调用闭包后类存在，PHP\
  \ 将恢复之前的业务。如果尝试完整个队列后类仍不存在，PHP 会崩溃并报错 \"Class 'Whatever' not found.\"（找不到类 'Whatever'）。\n\
  \n#### 第 79.5 节：使用 Composer 进行自动加载\n\n| vendor | / | autoload | . | php |\n| ---\
  \ | --- | --- | --- | --- |\n\nComposer 会生成一个 `vendor/autoload.php` 文件。\n\n你只需包含此文件，即可免费获得自动加载功能。\n\
  \n```\nrequire __DIR__ . '/vendor/autoload.php';\n```\n\n这使得处理第三方依赖变得非常容易。\n\n|\
  \ composer | . | json |\n| --- | --- | --- |\n\n你也可以通过在 `composer.json` 中添加 autoload\
  \ 部分，将自己的代码添加到自动加载器中。\n\n![](img/Image01517.jpg)\n\n在此部分中定义自动加载映射。在本例中，它是一个 [PSR-4](http://www.php-fig.org/psr/psr-4/)\
  \ 映射，将命名空间映射到项目根文件夹下的 `src` 目录，该目录与 `vendor` 目录处于同一级别：即 `src` 目录。示例文件名为 `src/Foo.php`，其中包含\
  \ `YourApplicationNamespace\\Foo` 类。\n\n| dump | - | autoload |\n| --- | --- | ---\
  \ |\n\n| vendor | / | autoload | . | php |\n| --- | --- | --- | --- | --- |\n\n\
  **重要提示：** 向 autoload 部分添加新条目后，必须重新运行命令 `dump-autoload`，以便使用新信息重新生成并更新 `vendor/autoload.php`\
  \ 文件。\n\n| PSR | -4 autoloading, Composer also supports | PSR |\n| --- | --- | ---\
  \ |\n\n除了 `PSR-0`，Composer 还支持 classmap 和 files 自动加载。详见 [autoload reference](https://getcomposer.org/doc/04-schema.md#autoload)\
  \ 了解更多信息。\n\n| vendor | / | autoload | . | php |\n| --- | --- | --- | --- | ---\
  \ |\n\n当你包含 `vendor/autoload.php` 文件时，它将返回一个 Composer Autoloader 实例。你可以将 include\
  \ 调用的返回值存储在变量中，并添加更多命名空间。例如，这对于在测试套件中自动加载类非常有用。\n\n![](img/Image01518.jpg)\n\n##\
  \ 第 80 章：SPL 数据结构\n\n#### 第 80.1 节：SplFixedArray\n\n### 与 PHP 数组的区别\n\nPHP 默认的 Array\
  \ 类型实际上是作为有序哈希映射实现的，它允许我们创建由键/值对组成的数组，其中值可以是任意类型，键可以是数字或字符串。然而，这并非数组的传统创建方式。\n\n\
  ![](img/Image01519.jpg)\n\n因此，正如你从该图解中所见，普通 PHP 数组更像是一个有序的键/值对集合，其中每个键可以映射到任意值。请注意，在这个数组中，键既有数字也有字符串，值也有不同类型，且键与元素的顺序无关。\n\
  \n![](img/Image01520.jpg)\n\n![](img/Image01521.jpg)\n\n因此，上述代码将给出我们完全预期的结果。\n\n\
  ```\n9 => foo\n1 => 4.2\nbar =>\n```\n\n普通 PHP 数组也是动态调整大小的。当我们向数组推入或弹出值时，它们会自动增长和收缩。\n\
  \n然而，在传统数组中，大小是固定的，且完全由同一类型的值组成。此外，不是通过键，而是通过索引来访问每个值，该索引可通过其在数组中的偏移量推断得出。\n\n![](img/Image01522.jpg)\n\
  \n| type size | * | n |\n| --- | --- | --- |\n\n既然我们知道给定类型的大小和数组的固定大小，偏移量就是 `type\
  \ size * n`，其中 n 代表值在数组中的位置。因此，在上面的示例中，`$arr[0]` 给我们 1（数组中的第一个元素），`$arr[1]` 给我们\
  \ 2，依此类推。\n\n然而，`SplFixedArray` 并不限制值的类型。它仅将键限制为数字类型。它也是固定大小的。\n\n这使得 `SplFixedArray`\
  \ 在一个特定方面比普通 PHP 数组更高效。它们更紧凑，因此占用更少的内存。\n\n### 实例化数组\n\n```\ncount($arr)\n```\n\n\
  ```\nforeach ($arr as $k => $v)\n```\n\n`SplFixedArray` 作为对象实现，但由于它实现了 `ArrayAccess`\
  \ 接口，因此可以使用与访问普通 PHP 数组相同的熟悉语法来访问。它还实现了 `Countable` 和 `Iterator` 接口，因此其行为与你习惯的 PHP\
  \ 数组行为相同（即 `count($arr)` 和 `foreach ($arr as $k => $v)` 等在 `SplFixedArray` 中的工作方式与普通\
  \ PHP 数组完全相同）。\n\n`SplFixedArray` 构造函数接受一个参数，即数组的大小。\n\n![](img/Image01523.jpg)\n\
  \n![](img/Image01524.jpg)\n\n这将给你预期的结果。\n\n```\n0 => foo\n1 => bar\n2 => baz\n3\
  \ =>\n```\n\n这也如预期般工作。\n\n![](img/Image01525.jpg)\n\n给我们……\n\n```\nint(4)\n```\n\
  \n请注意，在 `SplFixedArray` 中，与普通 PHP 数组不同，键确实描绘了元素在数组中的顺序，因为它是真正的索引，而不仅仅是一个映射。\n\n\
  ### 调整数组大小\n\n```\nunset($arr[1]) will result in $arr[1] === null, count($arr)\n\
  ```\n\n只需记住，因为数组大小固定，count 将始终返回相同的值。所以虽然执行 `unset($arr[1])`，`count($arr)` 仍然是 4。\n\
  \n因此，要调整数组大小，你需要调用 `setSize` 方法。\n\n![](img/Image01526.jpg)\n\n\n\n现在我们得到... `int(3)\
  \ 0 => foo 1 => 2 => baz` 导入到 `SplFixedArray` 并从 `SplFixedArray` 导出\n\n你也可以使用 `fromArray`\
  \ 和 `toArray` 方法将普通的 PHP 数组导入到 `SplFixedArray` 中并从中导出。\n\n![](img/Image01527.jpg)\n\
