  \ 语句\n\n![](img/Image00593.jpg)\n\n## 第 24 章：字符串格式化\n\n#### 第 24.1 节：字符串插值\n\n你也可以使用插值将变量插入（插入）到字符串中。插值仅在双引号字符串和\
  \ heredoc 语法中有效。\n\n![](img/Image00594.jpg)\n\n[复杂（花括号）语法](http://php.net/manual/en/language.types.string.php#language.types.string.parsing.complex)格式提供了另一种选择，要求你将变量包裹在花括号\
  \ `{}` 中。当在文本内容中嵌入变量并有助于防止文本内容和变量之间可能出现的歧义时，这很有用。\n\n![](img/Image00595.jpg)\n\n\
  `{}` 语法仅将以 `$` 开头的变量插值到字符串中。`{}` 语法不计算任意 PHP 表达式。\n\n![](img/Image00596.jpg)\n\n\
  然而，`{}` 语法确实会计算变量、数组元素或属性上的任何数组访问、属性访问以及函数/方法调用：\n\n```\n$companions = [0 => [ 'name'\
  \ => 'Amy Pond' ], 1 => [ 'name' => 'Dave Random' ]]; echo \"The best companion\
  \ is: {$companions[0]['name']} \" ;\n```\n\n请注意，美元 `$` 符号可以像上面的例子一样出现在左花括号 `{` 之后，或者像在\
  \ Perl 或 Shell 脚本中一样，出现在它之前：\n\n![](img/Image00599.jpg)\n\n#### 第 24.2 节：提取/替换子字符串\n\
  \n单个字符可以使用数组（方括号）语法以及花括号语法来提取。这两种语法将仅从字符串返回单个字符。如果需要多个字符，则需要一个函数，即 [substr](http://php.net/manual/en/function.substr.php)\n\
  \n![](img/Image00600.jpg)\n\n字符串也可以使用相同的方括号和花括号语法一次更改一个字符。替换多个字符需要一个函数，即 [substr_replace](http://php.net/manual/en/function.substr-replace.php)\n\
  \n![](img/Image00601.jpg)\n\n```\nsubstr_replace ( $foo , 'W' , 6, 1); // 也会导致 $foo\
  \ = 'Hello World'\nsubstr_replace ( $foo , 'Whi' , 6, 2); // 结果为 'Hello Whirled'\n\
  \n// 注意替换字符串不必与被替换的子字符串长度相同\n```\n\n## 第 25 章：字符串解析\n\n#### 第 25.1 节：按分隔符分割字符串\n\
  \n[explode](http://php.net/explode) 和 [strstr](http://php.net/strstr) 是通过分隔符获取子字符串的更简单方法。\n\
  \n包含由公共字符分隔的多个文本部分的字符串可以使用 [explode](http://php.net/explode) 函数分割成多个部分。\n\n```\n\
  $fruits = \"apple,pear,grapefruit,cherry\" ;\n```\n\n```\nprint_r ( explode ( \"\
  ,\" , $fruits )); // ['apple', 'pear', 'grapefruit', 'cherry']\n```\n\n该方法还支持一个\
  \ limit 参数，可按如下方式使用：\n\n![](img/Image00604.jpg)\n\n```\n如果 limit 参数为零，则将其视为 1。\n\
  print_r ( explode ( ',' , $fruits ,0)); // ['apple,pear,grapefruit,cherry']\n```\n\
  \n```\n如果设置了 limit 且为正数，返回的数组将包含最多 limit 个元素，最后一个元素包含字符串的其余部分。\nprint_r ( explode\
  \ ( ',' , $fruits ,2)); // ['apple', 'pear,grapefruit,cherry']\n```\n\n如果 limit\
  \ 参数为负数，则返回除最后 -limit 个组件外的所有组件。\n\n```\nprint_r ( explode ( ',' , $fruits ,-1));\
  \ // ['apple', 'pear', 'grapefruit']\n```\n\n`explode` 可以与 [list](http://php.net/list)\
  \ 结合使用，在一行中将字符串解析为变量：\n\n![](img/Image00608.jpg)\n\n但是，请确保 `explode` 的结果包含足够的元素，否则会触发未定义索引警告。`strstr`\
  \ 会去除或仅返回给定 needle 第一次出现之前的子字符串。\n\n![](img/Image00609.jpg)\n\n#### 第 25.2 节：子字符串\n\
  \nSubstring 返回由 start 和 length 参数指定的字符串部分。\n\n![](img/Image00610.jpg)\n\n如果有可能遇到多字节字符字符串，那么使用\
  \ `mb_substr` 会更安全。\n\n![](img/Image00611.jpg)\n\n另一个变体是 `substr_replace` 函数，它替换字符串一部分中的文本。\n\
  \n```\nvar_dump ( substr_replace ( \"Boo\" , \"0\" , 1, 1)); // string(3) \"B0o\"\
  \nvar_dump ( substr_Replace ( \"Boo\" , \"ts\" , strlen ( \"Boo\" ))); // string(5)\
  \ \"Boots\"\n```\n\n假设你想在字符串中查找特定单词 - 且不想使用正则表达式。\n\n```\n$hi = \"Hello World!\"\
  \ ; $bye = \"Goodbye cruel World!\" ;\n\nvar_dump ( strpos ( $hi , \" \" )); //\
  \ int(5)\nvar_dump ( strpos ( $bye , \" \" )); // int(7)\n\nvar_dump ( substr (\
  \ $hi , 0, strpos ( $hi , \" \" ))); // string(5) \"Hello\"\nvar_dump ( substr (\
  \ $bye , -1 * ( strlen ( $bye ) - strpos ( $bye , \" \" )))); // string(13) \" cruel\
  \ World!\"\n```\n\n```\n// 如果文本中的大小写不重要，则使用 strtolower 有助于比较字符串\nvar_dump ( substr\
  \ ( $hi , 0, strpos ( $hi , \" \" )) == 'hello' ); // bool(false)\nvar_dump ( strtolower\
  \ ( substr ( $hi , 0, strpos ( $hi , \" \" ))) == 'hello' ); // bool(true)\n```\n\
  \n另一个选择是对电子邮件进行非常基本的解析。\n\n![](img/Image00614.jpg)\n\n```\nif ( $wld == \"co.uk\"\
  \ ) var_dump ( \" $wrong is a UK address\" );\nif ( $nld == \"co.uk\" ) var_dump\
  \ ( \" $notld is a UK address\" );\n```\n\n甚至在简介末尾加上“继续阅读”或“...”\n\n![](img/Image00616.jpg)\n\
  \n#### 第 25.3 节：使用 strpos 搜索子字符串\n\n`strpos` 可以理解为在 haystack 中第一次出现 needle 之前的字节数。\n\
  \n```\nvar_dump ( strpos ( \"haystack\" , \"hay\" )); // int(0)\nvar_dump ( strpos\
  \ ( \"haystack\" , \"stack\" )); // int(3)\nvar_dump ( strpos ( \"haystack\" , \"\
  stackoverflow\" ); // bool(false)\n```\n\n检查子字符串是否存在\n\n当针对 TRUE 或 FALSE 进行检查时要小心，因为如果返回索引\
  \ 0，if 语句会将其视为 FALSE。\n\n![](img/Image00618.jpg)\n\n整个示例的输出：\n\n![](img/Image00619.jpg)\n\
  \n从偏移量开始搜索\n\n![](img/Image00620.jpg)\n\n![](img/Image00621.jpg)\n\n![](img/Image00622.jpg)\n\
  \n#### 第 25.4 节：使用正则表达式解析字符串\n\n`preg_match` 可用于使用正则表达式解析字符串。括在括号中的表达式部分称为子模式，通过它们你可以提取字符串的各个部分。\n\
  \n![](img/Image00623.jpg)\n\n输出\n\n![](img/Image00624.jpg)\n\n## 第 26 章：类和对象\n\n\
  类和对象用于通过将相似任务分组，使你的代码更高效、重复性更低。\n\n类用于定义用于构建对象的操作和数据结构。然后使用这个预定义的结构来构建对象。\n\n####\
  \ 第 26.1 节：类常量\n\n类常量提供了一种在程序中保存固定值的机制。也就是说，它们提供了一种为像 `3.14` 或 `\"Apple\"` 这样的值命名（并提供相关的编译时检查）的方法。类常量只能使用\
  \ `const` 关键字定义 - [define](http://php.net/define) 函数不能在此上下文中使用。\n\n\n\n# 类常量\n\n\
  作为一个例子，在整个程序中拥有一个 π 值的简写表示可能会很方便。一个包含 `const` 值的类提供了一种简单的方式来保存此类值。\n\n![](img/Image00625.jpg)\n\
  \n| MathValues :: PI |\n| --- |\n\n![](img/Image00626.jpg)\n\n类常量可以通过在类上使用双冒号操作符（即所谓的作用域解析操作符）来访问，这很像静态变量。然而，与静态变量不同的是，类常量的值在编译时固定，不能重新赋值（例如\
  \ `= 7` 会产生致命错误）。\n\n类常量对于定义类内部可能稍后需要更改的内容也很有用（但更改频率不足以值得存储在数据库中）。我们可以在内部使用 `self`\
  \ 作用域解析器来引用它（它在实例化和静态实现中均有效）。\n\n![](img/Image00627.jpg)\n\n在版本 < 5.6 中，类常量只能包含标量值。\n\
  \n自 PHP 5.6 起，我们可以在常量中使用表达式，这意味着数学语句和带有连接的字符串都是可接受的常量。\n\n![](img/Image00628.jpg)\n\
  \n自 PHP 7.0 起，用 `define` 声明的常量现在可以包含数组。\n\n![](img/Image00629.jpg)\n\n类常量不仅用于存储数学概念。例如，如果准备做派，拥有一个单一的\
  \ `Pie` 类来接收不同种类的水果可能会很方便。\n\n![](img/Image00630.jpg)\n\n然后我们可以这样使用 `Pie` 类：\n\n\
  ![](img/Image00631.jpg)\n\n这里出现的问题是，实例化 `Pie` 类时，没有提供关于可接受值的指导。例如，制作“boysenberry”派时，可能会拼写成\
  \ \"boisenberry\"。此外，我们可能不支持李子派。相反，如果在一个合理的地方预先定义好可接受的水果类型列表，那将很有用。比如一个名为 `Fruit`\
  \ 的类：\n\n![](img/Image00632.jpg)\n\n| new Pie('aple') | Pie('apple') 均可通过编译器检查 |\
  \ new Pie(Fruit::APLE) |\n| --- | --- | --- |\n\n将可接受的值列为类常量，为方法接受的可接受值提供了有价值的提示。它还能确保拼写错误无法通过编译器检查。虽然\
  \ `new Pie('aple')` 和 `new Pie(Fruit::APLE)` 会产生编译器错误。\n\n最后，使用类常量意味着常量的实际值可以在单一位置修改，任何使用该常量的代码都会自动获得修改的效果。\n\
  \n| MyClass::CONSTANT_NAME |\n| --- |\n\n虽然访问类常量最常用的方法是 `MyClass::CONSTANT_NAME`，但也可以通过以下方式访问：\n\
  \n![](img/Image00633.jpg)\n\nPHP 中的类常量按照惯例通常全部大写，单词之间以下划线分隔，尽管任何有效的标签名都可用作类常量名。\n\
