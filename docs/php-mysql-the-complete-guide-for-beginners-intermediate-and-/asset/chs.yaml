  \ 33.1 节：基本用法（GET 请求）\n\ncURL 是一个利用 URL 语法传输数据的工具。它支持 HTTP、FTP、SCP 等众多协议（cURL >=\
  \ 7.19.4）。请记住，你需要[安装并启用 cURL 扩展](http://php.net/manual/en/curl.installation.php)才能使用它。\n\
