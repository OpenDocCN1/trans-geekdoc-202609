  \n#### 第 42.2 节：`__get()`、`__set()`、`__isset()` 和 `__unset()`\n\n每当您尝试从类中检索某个字段时，如下所示：\n\
  \n![](img/Image00963.jpg)\n\n| `__get` | | `($name` |\n| --- | --- | --- |\n\nPHP\
  \ 会调用魔术方法 `__get()`，在这种情况下 `$name` 等于 \"height\"。向类字段写入值，如下所示：\n\n![](img/Image00964.jpg)\n\
  \n| `__set` | | `($name` | | `,` | ` $value` |\n| --- | --- | --- | --- | --- |\
  \ --- |\n\n将调用魔术方法 `__set()`，其中 `$name` 等于 \"height\"，`$value` 等于 10。\n\n| `isset`\
  \ | `()` | `unset` |\n| --- | --- | --- |\n\nPHP 还有两个内置函数 `isset()`，用于检查变量是否存在，以及\
  \ `unset()`，用于销毁变量。\n\n检查对象的字段是否已设置，如下所示：\n\n![](img/Image00965.jpg)\n\n| `__isset`\
  \ | | `($name` |\n| --- | --- | --- |\n\n将在该对象上调用 `__isset()` 函数。销毁变量，如下所示：\n\n\
  ![](img/Image00966.jpg)\n\n| `__unset` | | `($name` |\n| --- | --- | --- |\n\n将在该对象上调用\
  \ `__unset()` 函数。\n\n通常，当您未在类中定义这些方法时，PHP 只会按原样检索存储在类中的字段。但是，您可以重写这些方法来创建能够像数组一样保存数据，但像对象一样使用的类：\n\
  \n![](img/Image00967.jpg)\n\n![](img/Image00968.jpg)\n\n##### `empty()` 函数和魔术方法\n\
  \n| `empty` | `()` | `__isset` |\n| --- | --- | --- |\n\n请注意，在类属性上调用 `empty()` 将会调用\
