  \ |\n\n现在结果只包含名称中带有 `.` 的条目：\n\n![](img/Image01540.jpg)\n\n**注意**：使用 `*` 作为模糊搜索将递归返回所有匹配项。如果你使用\
  \ `%`，它将仅返回当前指定文件夹中的匹配项。\n\n#### 第 81.4 节：在邮箱中查找消息\n\n你可以使用 `imap_headers` 返回邮箱中所有消息的列表。\n\
  \n![](img/Image01541.jpg)\n\n结果是一个字符串数组，具有以下模式：\n\n![](img/Image01542.jpg)\n\n```\n\
  [标志] [消息-ID])[DD-MM-YYYY] [发件人地址] [主题截断至 25 字符] ([大小] 字符)\n```\n\n以下是每行可能的样子示例：\n\
  \n```\nA       1)19-Aug-2016 someone@example.com Message Subject (1728 chars)\n\
  D       2)19-Aug-2016 someone@example.com RE: Message Subject (22840 chars)\nU \
  \      3)19-Aug-2016 someone@example.com RE: RE: Message Subject (1876 chars)\n\
  N       4)19-Aug-2016 someone@example.com RE: RE: RE: Message Subje (1741 chars)\n\
  ```\n\n| 符号 | 标志 | 含义 |\n| --- | --- | --- |\n| A | Answered | 消息已回复 |\n| D | Deleted\
  \ | 消息已删除（但未移除） |\n| F | Flagged | 消息被标记/加星以引起注意 |\n| N | New | 消息是新的且未被查看 |\n|\
  \ R | Recent | 消息是新的且已被查看 |\n| U | Unread | 消息未读 |\n| X | Draft | 消息是草稿 |\n\n请注意，此调用可能需要相当长的时间来运行，并可能返回一个非常大的列表。\n\
  \n```\nimap_num_msg($mailbox)\n```\n\n另一种方法是根据需要单独加载消息。你的每封电子邮件都会被分配一个从 1（最旧）到 `imap_num_msg($mailbox)`\
  \ 值的 ID。\n\n有许多函数可以直接访问电子邮件，但最简单的方法是使用 `imap_header`，它返回结构化的头部信息：\n\n![](img/Image01544.jpg)\n\
  \n![](img/Image01545.jpg)\n\n## 第 82 章：HTTP 认证\n\n在本主题中，我们将制作一个 HTTP 头部认证脚本。\n\n\
