  \ 章：JSON\n\n##### 参数详情\n\n##### `json_encode`\n\n| 参数 | 说明 |\n| --- | --- |\n| `value`\
  \ | 待编码的值。可以是除 resource 类型以外的任何类型。所有字符串数据必须采用 UTF-8 编码。 |\n| `options` | 由 `JSON_HEX_QUOT`、`JSON_HEX_TAG`、`JSON_HEX_AMP`、`JSON_HEX_APOS`、`JSON_NUMERIC_CHECK`、`JSON_PRETTY_PRINT`、`JSON_UNESCAPED_SLASHES`、`JSON_FORCE_OBJECT`、`JSON_PRESERVE_ZERO_FRACTION`、`JSON_UNESCAPED_UNICODE`、`JSON_PARTIAL_OUTPUT_ON_ERROR`\
  \ 组成的位掩码。这些常量的行为在 [JSON 常量](http://php.net/manual/en/json.constants.php) 页面中有描述。\
  \ |\n| `depth` | 设置最大深度。必须大于零。 |\n\n##### `json_decode`\n\n| 参数 | 说明 |\n| --- |\
  \ --- |\n| `json` | 待解码的 JSON 字符串。此函数仅适用于 UTF-8 编码的字符串。 |\n| `assoc` | 函数是否应返回关联数组而非对象。\
  \ |\n| `options` | JSON 解码选项的位掩码。目前仅支持 `JSON_BIGINT_AS_STRING`（默认行为是将大整数转换为浮点数）。\
  \ |\n\n[JSON](http://www/json.org/) ([JavaScript Object Notation](https://en.wikipedia.org/wiki/JSON))\
  \ 是一种与平台和语言无关的方式，用于将对象序列化为纯文本。因为它常用于 Web，PHP 也是如此，所以 PHP 中有一个用于处理 JSON 的 [基础扩展](https://secure.php.net/manual/en/book.json.php)。\n\
  \n#### 第 31.1 节：解码 JSON 字符串\n\n| `json_decode` |\n| --- |\n\n`json_decode()` 函数接受一个\
  \ JSON 编码的字符串作为其第一个参数，并将其解析为 PHP 变量。\n\n| `json_decode` |\n| --- |\n\n通常，如果 JSON\
  \ 对象中的顶层项是字典，`json_decode()` 将返回一个 [`\\stdClass`](http://php.net/manual/en/reserved.classes.php)\
  \ 对象；如果 JSON 对象是数组，则返回索引数组。对于某些标量值（如简单字符串、`\"true\"`、`\"false\"` 和 `\"null\"`），它也将返回标量值或\
  \ `NULL`。发生任何错误时也会返回 `NULL`。\n\n```php\n// 返回一个对象（JSON 字符串中的顶层项是 JSON 字典）\n$json_string\
  \ = '{\"name\": \"Jeff\", \"age\": 20, \"active\": true, \"colors\": [\"red\", \"\
  blue\"]}';\n\n$object = json_decode($json_string);\nprintf('Hello %s, You are %s\
  \ years old.', $object->name, $object->age);\n//> Hello Jeff, You are 20 years old.\n\
  \n// 返回一个数组（JSON 字符串中的顶层项是 JSON 数组）\n$json_string = '[\"Jeff\", 20, true, [\"red\"\
  , \"blue\"]]';\n\n$array = json_decode($json_string);\nprintf('Hello %s, You are\
  \ %s years old.', $array[0], $array[1]);\n```\n\n| `var_dump` |\n| --- |\n\n使用 `var_dump()`\
  \ 查看我们上面解码的对象中每个属性的类型和值。\n\n![](img/Image00755.jpg)\n\n输出（注意变量类型）：\n\n![](img/Image00756.jpg)\n\
  \n![](img/Image00757.jpg)\n\n注意：JSON 中的变量类型已转换为其 PHP 对应类型。\n\n| `json_decode` |\n\
  | --- |\n\n要让 JSON 对象返回 [关联数组](http://php.net/manual/en/language.types.array.php)\
  \ 而不是对象，请将 `true` 作为 [第二个参数](http://php.net/manual/en/function.json-decode.php#refsect1-function.json-decode-parameters)\
  \ 传递给 `json_decode()`。\n\n```php\n$json_string = '{\"name\": \"Jeff\", \"age\":\
  \ 20, \"active\": true, \"colors\": [\"red\", \"blue\"]}';\n\n$array = json_decode($json_string,\
  \ true); // 注意第二个参数\nvar_dump($array);\n```\n\n输出（注意关联数组结构）：\n\n![](img/Image00759.jpg)\n\
  \n如果要返回的变量不是对象，则第二个参数 (`$assoc`) 无效。\n\n| `json_encode` |\n| --- |\n\n注意：如果你使用 `$assoc`\
  \ 参数，将会丢失空数组和空对象之间的区别。这意味着再次对解码后的输出运行 `json_encode()` 将导致不同的 JSON 结构。\n\n| `json_decode`\
  \ |\n| --- |\n\n如果 JSON 字符串的“深度”在递归中超过 512 个元素（5.2.3 版本之前为 20 个元素，5.2.3 版本为 128\
  \ 个元素），`json_decode()` 函数将返回 `NULL`。在 5.3 或更高版本中，可以使用第三个参数 (`$depth`) 来控制此限制，如下所述。\n\
  \n根据手册：\n\n![](img/Image00760.jpg)PHP 实现了原始 [»](http://www.faqs.org/rfcs/rfc4627)\
  \ [RFC 4627](http://www.faqs.org/rfcs/rfc4627) 中指定的 JSON 超集——它还会编码和解码标量类型和 `NULL`。RFC\
  \ 4627 仅支持这些值嵌套在数组或对象内部时的情况。尽管此超集与较新的 [»](http://www.faqs.org/rfcs/rfc7159) [RFC\
  \ 7159](http://www.faqs.org/rfcs/rfc7159)（旨在取代 RFC 4627）和 [»](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf)\
  \ [ECMA-404](http://www.ecma-international.org/publications/files/ECMA-ST/ECMA-404.pdf)\
  \ 中“JSON 文本”扩展定义一致，但当编码单个标量值时，可能会与严格遵循 RFC 4627 的旧版 JSON 解析器产生互操作性问题。\n\n这意味着，例如，在\
  \ PHP 中简单字符串将被视为有效的 JSON 对象：\n\n![](img/Image00761.jpg)\n\n输出：\n\n![](img/Image00762.jpg)\n\
  \n但不在数组或对象中的简单字符串不属于 [RFC 4627](http://www.faqs.org/rfcs/rfc4627) 标准。因此，诸如 [JSLint](http://www.jslint.com/)、[JSON\
  \ Formatter & Validator](https://jsonformatter.curiousconcept.com/)（在 RFC 4627 模式下）等在线检查器会报错。\n\
  \n有一个第三个参数 `$depth` 用于设置递归深度（默认值为 512），即原始对象中待解码的嵌套对象数量。\n\n有一个第四个参数 `$options`。目前它仅接受一个值：`JSON_BIGINT_AS_STRING`。默认行为（即省略此选项）是将大整数转换为浮点数而非字符串。\n\
  \n![](img/Image00763.jpg) 无效的非小写形式的 `true`、`false` 和 `null` 字面量不再被接受为有效输入。\n\n因此此示例：\n\
  \n```php\nvar_dump(json_decode('tRue'), json_last_error_msg());\nvar_dump(json_decode('tRUe'),\
  \ json_last_error_msg());\nvar_dump(json_decode('tRUE'), json_last_error_msg());\n\
  var_dump(json_decode('TRUe'), json_last_error_msg());\nvar_dump(json_decode('TRUE'),\
  \ json_last_error_msg());\nvar_dump(json_decode('true'), json_last_error_msg());\n\
  ```\n\nPHP 5.6 之前：\n\n![](img/Image00765.jpg)\n\nPHP 5.6 及之后：\n\n![](img/Image00766.jpg)\n\
  \n`false` 和 `null` 也会出现类似行为。\n\n| `json_decode` |\n| --- |\n\n注意，如果字符串无法转换，`json_decode()`\
  \ 将返回 `NULL`。\n\n![](img/Image00767.jpg)\n\n![](img/Image00768.jpg)\n\n| `json_decode`\
  \ |\n| --- |\n\n\n\n仅依赖返回值为 `NULL` 来检测错误是不安全的。例如，如果 JSON 字符串仅包含 `\"null\"`，即使没有发生错误，`json_decode()`\
  \ 也会返回 `null`。\n\n#### 第 31.2 节：编码 JSON 字符串\n\n[`json_encode`](http://php.net/manual/en/function.json-encode.php)\
  \ 函数将 PHP 数组（或自 PHP 5.4 起实现了 `JsonSerializable` 接口的对象）转换为 JSON 编码的字符串。成功时返回 JSON\
  \ 编码的字符串，失败时返回 `FALSE`。\n\n![](img/Image00769.jpg)\n\n编码过程中，PHP 数据类型字符串、整数和布尔值将转换为其\
  \ JSON 对应类型。关联数组编码为 JSON 对象，而使用默认参数调用时，索引数组编码为 JSON 数组。（除非数组键不是从 0 开始的连续数字序列，在这种情况下数组将被编码为\
  \ JSON 对象。）\n\n![](img/Image00770.jpg)\n\n输出：\n\n![](img/Image00771.jpg)\n\n```\n\
  { \"name\" : \"Jeff\" , \"age\" : 20 , \"active\" : true , \"colors\" :[ \"red\"\
  \ , \"blue\" ], \"values\" :{ \"0\" : \"foo\" , \"3\" : \"bar\" }}\n```\n\n#####\
  \ 参数\n\n自 PHP 5.3 起，`json_encode` 的第二个参数是一个位掩码，可以是以下一个或多个常量。\n\n与任何位掩码一样，它们可以通过二进制或运算符\
  \ `|` 组合。\n\n##### PHP 5.x 版本 ≥ 5.3 [`JSON_FORCE_OBJECT`](http://php.net/manual/en/json.constants.php#constant.json-force-object)\n\
  \n强制创建对象而不是数组。\n\n![](img/Image00772.jpg)\n\n输出：\n\n![](img/Image00773.jpg)\n\n\
  ##### [`JSON_HEX_TAG`](http://php.net/manual/en/json.constants.php#constant.json-hex-tag)、[`JSON_HEX_AMP`](http://php.net/manual/en/json.constants.php#constant.json-hex-amp)、[`JSON_HEX_APOS`](http://php.net/manual/en/json.constants.php#constant.json-hex-apos)、[`JSON_HEX_QUOT`](http://php.net/manual/en/json.constants.php#constant.json-hex-quot)\n\
  \n确保编码期间进行以下转换：\n\n| 常量 | 输入 | 输出 |\n| --- | --- | --- |\n| `JSON_HEX_TAG` | `<`\
  \ | `\\u003C` |\n| `JSON_HEX_TAG` | `>` | `\\u003E` |\n| `JSON_HEX_AMP` | `&` |\
  \ `\\u0026` |\n| `JSON_HEX_APOS` | `'` | `\\u0027` |\n| `JSON_HEX_QUOT` | `\"` |\
  \ `\\u0022` |\n\n![](img/Image00774.jpg)\n\n```\n$array = [ \"tag\" => \"<>\" ,\
  \ \"amp\" => \"&\" , \"apos\" => \"'\" , \"quot\" => \"\\\"\" ];\necho json_encode\
  \ ( $array );\necho json_encode ( $array , JSON_HEX_TAG | JSON_HEX_AMP | JSON_HEX_APOS\
  \ | JSON_HEX_QUOT );\n```\n\n输出：\n\n```\n{ \"tag\" : \"<>\" , \"amp\" : \"&\" ,\
  \ \"apos\" : \"'\" , \"quot\" : \"\\\"\" }\n```\n\n![](img/Image00775.jpg)\n\n```\n\
  { \"tag\" : \"\\u003C\\u003E\" , \"amp\" : \"\\u0026\" , \"apos\" : \"\\u0027\"\
  \ , \"quot\" : \"\\u0022\" }\n```\n\n##### PHP 5.x 版本 ≥ 5.3 [`JSON_NUMERIC_CHECK`](http://php.net/manual/en/json.constants.php#constant.json-numeric-check)\n\
  \n确保数字字符串转换为整数。\n\n![](img/Image00776.jpg)\n\n输出：\n\n![](img/Image00777.jpg)\n\n\
  ```\n[ \"23452\" ,23452]\n[23452,23452]\n```\n\n##### PHP 5.x 版本 ≥ 5.4 [`JSON_PRETTY_PRINT`](http://php.net/manual/en/json.constants.php#constant.json-pretty-print)\n\
  \n使 JSON 易于阅读。\n\n![](img/Image00778.jpg)\n\n输出：\n\n![](img/Image00779.jpg)\n\n\
  ##### [`JSON_UNESCAPED_SLASHES`](http://php.net/manual/en/json.constants.php#constant.json-unescaped-slashes)\n\
  \n输出中包含未转义的 `/` 正斜杠。\n\n![](img/Image00780.jpg)\n\n输出：\n\n![](img/Image00781.jpg)\n\
  \n```\n{ \"filename\" : \"example.txt\" , \"path\" : \"\\/full\\/path\\/to\\/file\"\
  \ }\n{ \"filename\" : \"example.txt\" , \"path\" : \"/full/path/to/file\" }\n```\n\
  \n##### [`JSON_UNESCAPED_UNICODE`](http://php.net/manual/en/json.constants.php#constant.json-unescaped-unicode)\n\
  \n输出中包含 UTF8 编码字符，而不是 `\\u` 编码的字符串。\n\n![](img/Image00782.jpg)\n\n输出：\n\n![](img/Image00783.jpg)\n\
  \n##### PHP 5.x 版本 ≥ 5.5 [`JSON_PARTIAL_OUTPUT_ON_ERROR`](http://php.net/manual/en/json.constants.php#constant.json-partial-output-on-error)\n\
  \n遇到无法编码的值时允许编码继续进行。\n\n![](img/Image00784.jpg)\n\n输出：\n\n![](img/Image00785.jpg)\n\
  \n```\n{ \"file\" : null , \"name\" : \"foo.txt\" }\n```\n\n##### PHP 5.x 版本 ≥ 5.6\
  \ [`JSON_PRESERVE_ZERO_FRACTION`](http://php.net/manual/en/json.constants.php#constant.json-preserve-zero-fraction)\n\
  \n确保浮点数始终作为浮点数编码。\n\n![](img/Image00786.jpg)\n\n输出：\n\n![](img/Image00787.jpg)\n\
  \n##### PHP 7.x 版本 ≥ 7.1 [`JSON_UNESCAPED_LINE_TERMINATORS`](http://php.net/manual/en/json.constants.php#constant.json-unescaped-line-terminators)\n\
  \n与 `JSON_UNESCAPED_UNICODE` 结合使用时，恢复旧版 PHP 的行为，不转义字符 U+2028 LINE SEPARATOR（行分隔符）和\
  \ U+2029 PARAGRAPH SEPARATOR（段分隔符）。尽管这些字符在 JSON 中有效，但它们在 JavaScript 中无效，因此 `JSON_UNESCAPED_UNICODE`\
  \ 的默认行为在 7.1 版本中发生了变化。\n\n![](img/Image00788.jpg)\n\n```\n$array = [ \"line\" =>\
  \ \"\\xe2\\x80\\xa8\" , \"paragraph\" => \"\\xe2\\x80\\xa9\" ];\necho json_encode\
  \ ( $array , JSON_UNESCAPED_UNICODE );\necho json_encode ( $array , JSON_UNESCAPED_UNICODE\
  \ | JSON_UNESCAPED_LINE_TERMINATORS );\n```\n\n输出：\n\n![](img/Image00789.jpg)\n\n\
  ![](img/Image00790.jpg)\n\n#### 第 31.3 节：调试 JSON 错误\n\n当 `json_encode` 或 `json_decode`\
  \ 无法解析提供的字符串时，将返回 `false`。PHP 本身不会引发任何错误或警告；责任在于用户使用 [`json_last_error()`](http://php.net/manual/en/function.json-last-error.php)\
  \ 和 [`json_last_error_msg()`](http://php.net/manual/en/function.json-last-error-msg.php)\
  \ 函数来检查是否发生错误，并在应用程序中做出相应处理（调试、显示错误消息等）。\n\n以下示例展示了处理 JSON 时的常见错误，即由于传递了错误的 UTF-8\
  \ 编码字符串等原因，导致 JSON 字符串解码/编码失败。\n\n![](img/Image00791.jpg)\n\n##### [`json_last_error_msg`](http://php.net/manual/en/function.json-last-error-msg.php)\n\
  \n[`json_last_error_msg()`](http://php.net/manual/en/function.json-last-error-msg.php)\
  \ 返回尝试编码/解码字符串时发生的最后一个错误的人类可读消息。\n\n![](img/Image00792.jpg)\n\n即使未发生错误，此函数始终返回 `string`。\n\
  \n默认的非错误字符串为 `No Error`。\n\n如果发生其他（未知）错误，将返回 `false`。\n\n在循环中使用时要小心，因为 [`json_last_error_msg()`](http://php.net/manual/en/function.json-last-error-msg.php)\
  \ 将在每次迭代中被覆盖。\n\n你应该仅使用此函数获取用于显示的消息，而不应在控制语句中用它进行判断。\n\n![](img/Image00793.jpg)\n\
  \n此函数在 PHP 5.5 之前不存在。以下是一个 polyfill 实现：\n\n![](img/Image00794.jpg)\n\n```\nif (!\
  \ function_exists ( 'json_last_error_msg' )) {\n     function json_last_error_msg\
  \ () {\n         static $ERRORS = array (\n             JSON_ERROR_NONE => 'No error'\
  \ ,\n             JSON_ERROR_DEPTH => 'Maximum stack depth exceeded' ,\n       \
  \      JSON_ERROR_STATE_MISMATCH => 'State mismatch (invalid or malformed JSON)'\
  \ ,\n             JSON_ERROR_CTRL_CHAR => 'Control character error, possibly incorrectly\
  \ encoded' ,\n             JSON_ERROR_SYNTAX => 'Syntax error' ,\n             JSON_ERROR_UTF8\
  \ => 'Malformed UTF-8 characters, possibly incorrectly encoded'\n         );\n \
  \        $error = json_last_error ();\n```\n\n![](img/Image00795.jpg)\n\n##### [`json_last_error`](http://php.net/manual/en/function.json-last-error.php)\n\
  \n[`json_last_error()`](http://php.net/manual/en/function.json-last-error.php) 返回一个整数，映射到\
  \ PHP 提供的预定义常量之一。\n\n| 常量 | 含义 |\n| --- | --- |\n| `JSON_ERROR_NONE` | 未发生错误 |\n\
  | `JSON_ERROR_DEPTH` | 超过最大堆栈深度 |\n| `JSON_ERROR_STATE_MISMATCH` | 无效或格式错误的 JSON\
  \ |\n| `JSON_ERROR_CTRL_CHAR` | 控制字符错误，可能编码不正确 |\n| `JSON_ERROR_SYNTAX` | 语法错误（自\
  \ PHP 5.3.3 起） |\n\n\n\n\n##### JSON 错误常量\n\n| 常量 | 描述 |\n| :--- | :--- |\n| `JSON_ERROR_UTF8`\
  \ | UTF-8 字符格式错误，可能编码不正确（自 PHP 5.5.0 起） |\n| `JSON_ERROR_RECURSION` | 待编码的值中存在一个或多个递归引用\
  \ |\n| `JSON_ERROR_INF_OR_NAN` | 待编码的值中存在一个或多个 NAN 或 INF 值 |\n| `JSON_ERROR_UNSUPPORTED_TYPE`\
  \ | 给定了一个无法编码的类型的值 |\n\n# 第 31 章：JSON 处理（续）\n\n#### 第 31.4 节：在对象中使用 `JsonSerializable`\n\
  \n**PHP 5.x 版本 ≥ 5.4**\n\n当你构建 REST API 时，可能需要减少传递给客户端应用程序的对象信息量。为此，本例演示了如何使用 `JsonSerializable`\
  \ 接口。\n\n在本例中，类 `User` 实际上扩展了一个假设的 ORM 的数据库模型对象。\n\n![Image00796.jpg](img/Image00796.jpg)\n\
  \n##### `jsonSerialize`\n\n通过提供 `jsonSerialize()` 方法，向类添加 `JsonSerializable` 实现。\n\
  \n![Image00797.jpg](img/Image00797.jpg)\n\n##### `json_encode`\n\n现在在你的应用程序控制器或脚本中，当将对象\
  \ `User` 传递给 `json_encode()` 时，你将获得 `jsonSerialize()` 方法返回的 JSON 编码数组，而不是整个对象。\n\
  \n![Image00798.jpg](img/Image00798.jpg)\n\n将返回：\n\n![Image00799.jpg](img/Image00799.jpg)\n\
