  \ `.` 文件，也会返回该文件的路径。没有扩展名的文件在数组中不会返回扩展名元素。\n\n#### 第 43.4 节：基于流的文件 IO\n\n##### 打开流\n\
  \n`fopen` 打开一个文件流句柄，可配合各种函数用于读取、写入、定位及其他操作。此值为资源类型，无法将其传递给其他线程并保持其功能。\n\n![](img/Image01008.jpg)\n\
  ```\n$f = fopen(\"errors.log\", \"a\"); // Will try to open errors.log for writing\n\
  ```\n\n第二个参数是文件流的模式：\n\n| 模式 | 说明 |\n| --- | --- |\n| r | 以只读模式打开，文件指针指向文件开头 |\n\
  | r+ | 以读写模式打开，文件指针指向文件开头 |\n| w | 以只写模式打开，文件指针指向文件开头。如果文件存在则将其清空。如果不存在则尝试创建。 |\n\
  | w+ | 以读写模式打开，文件指针指向文件开头。如果文件存在则将其清空。如果不存在则尝试创建。 |\n| a | 以只写模式打开，文件指针指向文件末尾。如果文件不存在，则尝试创建。\
  \ |\n| a+ | 以读写模式打开，文件指针指向文件末尾。如果文件不存在，则尝试创建。 |\n| x | 创建并以只写模式打开。如果文件已存在，`fopen`\
  \ 调用将失败。 |\n| x+ | 创建并以读写模式打开。如果文件已存在，`fopen` 调用将失败。 |\n| c | 以只写模式打开文件。如果文件不存在则尝试创建。文件指针指向文件开头，但不会在写入前清空文件。\
  \ |\n| c+ | 以读写模式打开文件。如果文件不存在则尝试创建。文件指针指向文件开头，但不会在写入前清空文件。 |\n\n| `\\n` | | \" 行尾转换为\
  \ \" | | `\\r\\n` |\n| --- | --- | --- | --- | --- |\n\n在模式后添加 `t`（例如 `a+b`、`wt`\
  \ 等）在 Windows 下处理文件时会将 `\"\"` 进行转换。如果不希望这样（特别是二进制文件），请在模式后添加 `b`。\n\nPHP 应用程序应在不再使用流时使用\
  \ `fclose` 关闭它们，以防止“Too many open files”错误。这在 CLI 程序中尤为重要，因为流仅在运行时关闭时才会关闭 —— 这意味着在\
  \ Web 服务器中，如果你不期望进程长时间运行且不会打开许多流，则可能不必关闭流（但作为防止资源泄漏的实践，仍然应该关闭）。\n\n### 读取\n\n使用\
  \ `fread` 将从文件指针读取给定字节数，或直到遇到 EOF。\n\n##### 读取行\n\n使用 `fgets` 将读取文件直到遇到 EOL，或读取给定长度。\n\
  \n`fread` 和 `fgets` 在读取时都会移动文件指针。\n\n##### 读取剩余所有内容\n\n使用 `stream_get_contents`\
  \ 将流中所有剩余字节读取到字符串中并返回。\n\n##### 调整文件指针位置\n\n打开流后，文件指针最初位于文件开头（如果使用模式 `a` 则位于末尾）。使用\
  \ `fseek` 函数将文件指针移动到新位置，相对于以下三个值之一：\n\n![](img/Image01009.jpg)\n`SEEK_SET`：这是默认值；文件位置偏移量将相对于文件开头。\n\
  \n`SEEK_CUR`：文件位置偏移量将相对于当前位置。\n\n`SEEK_END`：文件位置偏移量将相对于文件末尾。传递负偏移量是此值最常见的用法；它将文件位置移动到文件末尾前指定字节数处。\n\
  \n| SEEK_SET |\n| --- |\n\n| fseek | ( | $fh |\n| --- | --- | --- |\n\n![](img/Image01010.jpg)\n\
  `rewind` 是 `fseek($fh, 0, SEEK_SET)` 的便捷快捷方式。\n\n使用 `ftell` 将显示文件指针的绝对位置。\n\n例如，以下脚本读取\
  \ file.txt 时跳过前 10 字节，读取接下来的 10 字节，跳过 10 字节，读取接下来的 10 字节，然后读取最后 10 字节：\n\n![](img/Image01011.jpg)\n\
  \n![](img/Image01012.jpg)\n\n##### 写入\n\n使用 `fwrite` 将提供的字符串从当前文件指针处开始写入文件。\n\n\
  ![](img/Image01013.jpg)\n\n#### 第 43.5 节：移动和复制文件及目录\n\n\n\n\n##### 复制文件\n\n[copy](http://php.net/copy)\
  \ 将第一个参数中的源文件复制到第二个参数指定的目标位置。解析后的目标路径必须位于一个已存在的目录中。\n\n![](img/Image01014.jpg)\n\
  \n##### 复制目录（递归方式）\n\n复制目录与删除目录非常相似，区别在于：对于文件使用 [copy](http://php.net/copy) 而不是\
  \ [unlink](http://php.net/unlink)；对于目录，在函数开头使用 [mkdir](http://php.net/mkdir) 而不是在函数末尾使用\
  \ [rmdir](http://php.net/rmdir)。\n\n![](img/Image01015.jpg)\n\n##### 重命名/移动\n\n\
  重命名/移动文件和目录要简单得多。整个目录可以通过单次调用 [rename](http://php.net/rename) 函数来移动或重命名。\n\n```\n\
  rename(\"~/file.txt\", \"~/file.html\");\n```\n\n![](img/Image01016.jpg)\n\n```\n\
  rename(\"~/dir\", \"~/old_dir\");\n```\n\n```\nrename(\"~/dir/file.txt\", \"~/dir2/file.txt\"\
  );\n```\n\n![](img/Image01017.jpg)\n\n# 第 43 章：处理大文件时最小化内存使用\n\n#### 第 43.6 节：处理大文件时最小化内存使用\n\
