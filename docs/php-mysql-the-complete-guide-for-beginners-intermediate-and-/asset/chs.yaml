  \n### 三元运算符作为 if-else 的简写语法\n\n[三元运算符](http://php.net/manual/de/language.operators.comparison.php#language.operators.comparison.ternary)\
  \ 根据条件是否为真来求值。它是一个比较运算符，常用于以更短的形式表达简单的 if-else 条件。它允许快速测试条件，并经常替换多行的 `if` 语句，使代码更紧凑。\n\
