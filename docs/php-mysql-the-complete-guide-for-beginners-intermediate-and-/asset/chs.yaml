  \ 文件。 |\n| validate | 验证 `composer.json` 和 `composer.lock` |\n| why | 显示哪些包导致给定包被安装\
  \ |\n| why-not | 显示哪些包阻止给定包被安装 |\n\n#### 第 41.5 节：使用 Composer 的好处\n\n##### `composer.lock`\n\
  \nComposer 在一个名为 `composer.lock` 的文件中跟踪你安装的包版本，该文件旨在提交到版本控制系统，以便将来克隆项目时，只需运行 `composer\
  \ install` 即可下载并安装项目的所有依赖项。\n\nComposer 按项目处理 PHP 依赖项。这使得在一台机器上拥有多个依赖于同一 PHP 包的不同版本的项目变得容易。\n\
  \nComposer 跟踪哪些依赖项仅用于开发环境\n\n![](img/Image00954.jpg)\n\nComposer 提供了一个自动加载器，使得开始使用任何包变得极其简单。例如，在使用\
