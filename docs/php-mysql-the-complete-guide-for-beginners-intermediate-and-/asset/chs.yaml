  \ = new DateTime(\"2014-01-18 20:05:56\");\n\n// 创建一个日期时间对象，其值为约现在\n$now = new DateTime(\"\
  2016-07-21 02:55:07\");\nvar_dump($now > $twoYearsAgo); // 打印 bool(true)\nvar_dump($twoYearsAgo\
  \ > $now); // 打印 bool(false)\nvar_dump($twoYearsAgo <= $twoYearsAgo); // 打印 bool(true)\n\
  var_dump($now == $now); // 打印 bool(true)\n```\n\n#### 第 18.2 节：将日期转换为另一种格式\n\n###\
  \ 基础知识\n\n将一种日期格式转换为另一种格式的最简单方法是结合使用 `strtotime()` 和 `date()`。`strtotime()` 将日期转换为\
