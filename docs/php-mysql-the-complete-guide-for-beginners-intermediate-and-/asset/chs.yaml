  #### 第 26.2 节：抽象类\n\n抽象类是不能被实例化的类。抽象类可以定义抽象方法，这些方法没有任何主体，只有定义：\n\n![](img/Image00641.jpg)\n\
  \n![](img/Image00642.jpg)\n\n抽象类应由子类继承，子类随后可以提供这些抽象方法的实现。\n\n此类类的主要目的是提供一种模板，允许子类继承，“强制”遵循一种结构。让我们通过一个例子详细说明：\n\
  \n在本例中，我们将实现一个 `Worker` 接口。首先定义接口：\n\n![](img/Image00643.jpg)\n\n| run() |\n| ---\
  \ |\n\n为了简化后续 `Worker` 实现的开发，我们将创建一个抽象 Worker 类，它已经提供了来自接口的 `run()` 方法，但指定了一些需要由任何子类填充的抽象方法：\n\
  \n![](img/Image00644.jpg)\n\n| getMemoryLimit() |\n| --- |\n\n首先，我们提供了一个抽象方法 `getMemoryLimit()`。任何继承自\
  \ `AbstractWorker` 的类都需要提供此方法并返回其内存限制。然后 `AbstractWorker` 设置内存限制并记录日志。\n\n| prepareMain()\
  \ 和 main() |\n| --- |\n\n其次，`AbstractWorker` 在记录日志后调用 `prepareMain()` 和 `main()`\
  \ 方法。\n\n最后，所有这些方法调用都被归组在一个 `try-catch` 块中。因此，如果子类定义的任何抽象方法抛出异常，我们将捕获该异常，记录日志并重新抛出。这防止了所有子类都必须自行实现此逻辑。\n\
  \n现在让我们定义一个继承自 `AbstractWorker` 的子类：\n\n![](img/Image00645.jpg)\n\n正如你所见，`TransactionProcessorWorker`\
  \ 实现起来相当容易，因为我们只需指定内存限制并担心它需要执行的实际操作。`TransactionProcessorWorker` 中不需要错误处理，因为这在\
  \ `AbstractWorker` 中已处理。\n\n##### 重要提示\n\n![](img/Image00646.jpg)\n\n继承自抽象类时，父类声明中标记为\
  \ `abstract` 的所有方法都必须由子类定义（或者子类本身也必须标记为 `abstract`）；此外，这些方法必须用相同（或限制更宽松）的可见性来定义。例如，如果抽象方法定义为\
  \ `protected`，函数实现必须定义为 `protected` 或 `public`，但不能是 `private`。\n\n摘自 [PHP 文档 - 类的抽象](http://php.net/manual/en/language.oop5.abstract.php)。\n\
  \n如果你不在子类中定义父抽象类的方法，将会抛出如下致命 PHP 错误。\n\n![](img/Image00647.jpg)\n\n```\nFatal error:\
  \ Class X contains 1 abstract method and must therefore be declared abstract or\
  \ implement the remaining methods (X::x) in\n```\n\n#### 第 26.3 节：静态后期绑定\n\n| self::\
  \ |\n| --- |\n\n在 PHP 5.3+ 及以上版本中，你可以利用[静态后期绑定](http://php.net/manual/en/language.oop5.late-static-bindings.php)来控制从哪个类调用静态属性或方法。它的加入是为了克服\
  \ `self` 作用域解析器固有的问题。请看以下代码：\n\n![](img/Image00648.jpg)\n\n| whatToSay() |\n| ---\
  \ |\n\n你可能期望 `MrEd` 类会覆盖父类的 `whatToSay()` 函数。但当我们运行它时，会得到意想不到的结果：\n\n![](img/Image00649.jpg)\n\
  \n| self::whatToSay() |\n| --- |\n\n| static:: |\n| --- |\n\n问题在于 `self::whatToSay()`\
  \ 只能指向 `Horse` 类，意味着它不服从 `MrEd`。如果我们改用 `static::` 作用域解析器，就没有这个问题。这个较新的方法告诉类服从调用它的实例。因此我们得到了预期的继承行为：\n\
  \n![](img/Image00650.jpg)\n\n#### 第 26.4 节：命名空间和自动加载\n\n\n\n\n# PHP 中的自动加载与面向对象概念\n\
  \n## 自动加载基础\n\n从技术上讲，自动加载的工作原理是在需要某个 PHP 类但未找到时执行回调函数。此类回调通常尝试加载这些类。\n\n通常，自动加载可以理解为：当需要某个类时，尝试根据该类的**完全限定名**（FQN）从适当的路径加载\
  \ PHP 文件（特别是 PHP 类文件，即一个 PHP 源文件专门用于定义一个特定的类）。\n\n假设我们有以下类：\n\n- `application\\\
  controllers\\Base` 的类文件\n- `application\\controllers\\Control` 的类文件\n- `application\\\
  models\\Page` 的类文件\n\n在源文件夹下，这些类应根据其 FQN 分别放置在对应的路径中。\n\n这种方法使得可以根据 FQN 以编程方式解析类文件路径，使用如下函数：\n\
  \n```php\nfunction getClassPath(string $sourceFolder, string $className, string\
  \ $extension = \".php\") {\n    return $sourceFolder . \"/\" . str_replace(\"\\\\\
  \", \"/\", $className) . $extension;\n    // 注意 \"/\" 在 Windows 上也可作为目录分隔符\n}\n\
  ```\n\n`spl_autoload_register()` 函数允许我们在需要时使用用户定义的函数来加载类。\n\n该函数可以进一步扩展以使用备选加载方法。\n\
  \n请注意，PHP 并不会在加载使用该类的文件时立即尝试加载类。它可能在脚本执行的中间阶段加载，甚至在关闭函数中加载。这就是为什么开发者，尤其是使用自动加载的开发者，应避免在运行时替换正在执行的源文件，特别是在\
  \ phar 文件中。\n\n#### 第 26.5 节：方法与属性可见性\n\n您可以将三种可见性类型应用于类中的方法（类/对象函数）和属性（类/对象变量），它们为所应用的方法或属性提供访问控制。\n\
  \n您可以在 [PHP 文档：面向对象可见性](http://php.net/manual/en/language.oop5.visibility.php) 中详细阅读相关内容。\n\
  \n### Public（公有）\n\n将方法或属性声明为 `public` 允许以下对象访问该方法或属性：\n\n- 声明它的类。\n- 继承自声明类的类。\n\
  - 类层级结构之外的任何外部对象、类或代码。\n\n### Protected（受保护）\n\n将方法或属性声明为 `protected` 允许以下对象访问该方法或属性：\n\
  \n- 声明它的类。\n- 继承自声明类的类。\n\n这**不**允许类层级结构之外的外部对象、类或代码访问这些方法或属性。如果使用该方法/属性的代码没有访问权限，则该方法/属性将不可用，并会抛出错误。只有声明类自身的实例（或其子类的实例）才能访问它。\n\
  \n上述示例指出，您只能在其自身的作用域内访问受保护的元素。本质上：“房子里的东西只能在房子里访问。”\n\n### Private（私有）\n\n将方法或属性声明为\
  \ `private` 允许以下对象访问该方法或属性：\n\n- **仅**声明它的类（不包括子类）。\n\n私有方法或属性仅在创建它的类内部可见且可访问。\n\
  \n请注意，即使对象不是同一个实例，同一类型的对象也将拥有对彼此私有和受保护成员的访问权。\n\n如前所述，您只能从其定义的类内部访问私有方法/属性。\n\n\
  #### 第 26.6 节：接口\n\n##### 简介\n\n接口是类必须实现的公共 API 定义，以满足接口的要求。它们作为“契约”发挥作用，规定了一组子类**做什么**，但不规定**怎么做**。\n\
  \n接口的定义与类定义非常相似，只需将关键字 `class` 改为 `interface`。\n\n接口可以包含方法和/或常量，但不能包含属性。接口常量具有与类常量相同的限制。接口方法隐式为抽象方法。\n\
  \n注意：接口不得声明构造函数或析构函数，因为这些是类层面的实现细节。\n\n##### 实现\n\n任何需要实现接口的类都必须使用 `implements`\
  \ 关键字来实现。为此，该类需要为接口中声明的每个方法提供实现，并遵循相同的签名。\n\n一个类可以同时实现多个接口。\n\n当抽象类实现接口时，它们不需要实现所有方法。基类中未实现的任何方法必须由继承它的具体类来实现。\n\
  \n请注意，接口实现是一种继承特性。当扩展一个实现了接口的类时，您不需要在具体类中重新声明它，因为这是隐式的。\n\n注意：在 PHP 5.3.9 之前，类不能实现两个指定了同名方法的接口，因为这会导致歧义。较新版本的\
  \ PHP 允许这样做，只要重复的方法具有相同的签名 [[1]](http://php.net/manual/en/language.oop5.interfaces.php)。\n\
  \n##### 继承\n\n与类一样，可以使用相同的关键字 `extends` 在接口之间建立继承关系。主要区别在于接口允许多重继承。\n\n##### 示例\n\
  \n在下面的示例中，我们有一个简单的车辆接口。车辆可以前进和后退。\n\n然后我们创建两个实现该接口的类：`Bike` 和 `Car`。`Bike` 和 `Car`\
  \ 在内部实现上截然不同，但两者都是车辆，必须实现 `VehicleInterface` 提供的相同公共方法。\n\n类型提示允许方法和函数请求接口类型。假设我们有一个停车场类，它包含各种类型的车辆。\n\
  \n因为 `addVehicle()` 需要类型为 `VehicleInterface` 的 `$vehicle` —— 而不是具体的实现 —— 所以我们可以传入\
  \ `Bike` 和 `Car` 对象，`ParkingGarage` 可以对它们进行操作和使用。\n\n#### 第 26.7 节：Final 关键字\n\n\
  **定义：** `final` 关键字通过在定义前加上 `final` 前缀，防止子类覆盖某个方法。如果类本身被定义为 `final`，则它不能被继承。\n\n\
  ##### Final 方法\n\n##### Final 类\n\n##### Final 常量\n\n与 Java 不同，`final` 关键字在 PHP\
  \ 中**不**用于类常量。请改用关键字 `const`。\n\n##### 为什么要使用 final？\n\n1. 防止巨大的“厄运继承链”\n2. 鼓励组合\n\
  3. 强迫开发者思考用户公共 API\n4. 强迫开发者缩小对象的公共 API\n5. Final 类始终可以变为可扩展的\n6. `extends` 破坏封装\n\
  7. 你不需要那种灵活性\n8. 你可以自由修改代码\n\n##### 何时避免使用 final\n\nFinal 类仅在以下假设下有效工作：\n\n1. 存在一个该\
  \ final 类实现的抽象（接口）\n2. 该 final 类的所有公共 API 都是该接口的一部分\n\n#### 第 26.8 节：自动加载\n\n没有人想在每次使用类或继承时都去\
  \ `require` 或 `include`。因为这很痛苦且容易忘记，PHP 提供了所谓的自动加载。如果您已经在使用 Composer，请阅读关于使用 Composer\
  \ 进行自动加载的内容。\n\n##### 究竟什么是自动加载？\n\n\n\n\n顾名思义。你不必获取存放所请求类的文件，而是由 PHP 自动加载。\n\n\
  如何在不使用第三方代码的基础 PHP 中实现这一点？\n\n有一个 `__autoload` 函数，但被认为最佳实践是使用 `spl_autoload_register`。每当在给定空间内未定义类时，PHP\
  \ 都会考虑这些函数。因此，向现有项目添加自动加载不是问题，因为已定义的类（例如通过 require）将像以前一样工作。为了严谨起见，以下示例将使用匿名函数；如果你使用\
  \ PHP < 5.3，可以定义函数并将其名称作为参数传递给 `spl_autoload_register`。\n\n##### 示例\n\n```\nFooBar\n\
  ```\n\n上述代码只是尝试使用 `sprintf` 包含一个以类名加上扩展名 \".php\" 命名的文件。如果需要加载 `FooBar`，它会检查 `FooBar.php`\
  \ 是否存在，如果存在则包含它。\n\n当然，这可以扩展以适应项目的个性化需求。如果类名中的 `_` 用于分组，例如 `User_Post` 和 `User_Image`\
  \ 都指向 `User`，那么这两个类可以像这样保存在一个名为 \"User\" 的文件夹中：\n\n```\nUser_Post\n```\n\n类 `User_Post`\
  \ 现在将从 \"User/Post.php\" 加载，以此类推。\n\n`spl_autoload_register` 可以定制以满足各种需求。所有包含类的文件都命名为\
  \ \"class.CLASSNAME.php\"？没问题。各种嵌套（`User_Post_Content` => \"User/Post/Content.php\"\
  ）？也没问题。\n\n如果你想要一个更复杂的自动加载机制——但仍然不想引入 Composer——你可以在不添加第三方库的情况下工作。\n\n```\nspl_autoload_register(function\
  \ ($class) {\n    $prefix = 'MyApp\\\\';\n    $base_dir = __DIR__ . '/src/';\n \
  \   $len = strlen($prefix);\n    if (strncmp($prefix, $class, $len) !== 0) {\n \
  \       return;\n    }\n    $relative_class = substr($class, $len);\n    $file =\
  \ $base_dir . str_replace('\\\\', '/', $relative_class) . '.php';\n    if (file_exists($file))\
  \ {\n        require $file;\n    }\n});\n```\n\n使用这样的自动加载器，你可以愉快地编写如下代码：\n\n```\n\
  use MyApp\\Database;\nuse MyApp\\User;\nuse MyApp\\Post;\n```\n\n使用类：\n\n```\nfoo/bar.php,\
  \ foo.php, hello/world.php and demo/classes.php\n```\n\n这些示例将从 `MyApp` 包含类。\n\n\
  #### 第 26.9 节：实例化子类时调用父类构造函数\n\n##### `__construct`\n\n从其子类调用 `__construct()` 方法。如果你需要这样做，则需要使用\
  \ `parent::` 作用域解析操作符：\n\n```\nclass ParentClass {\n    function __construct() {\n\
  \        echo \"Parent constructor\\n\";\n    }\n}\n\nclass ChildClass extends ParentClass\
  \ {\n    function __construct() {\n        parent::__construct();\n        echo\
  \ \"Child constructor\\n\";\n    }\n}\n\n$obj = new ChildClass();\n```\n\n现在在实际场景中利用这一点看起来会像这样：\n\
  \n```\nclass Database {\n    protected $connection;\n    public function __construct($host,\
  \ $user, $pass) {\n        $this->connection = new mysqli($host, $user, $pass);\n\
  \    }\n}\n\nclass User extends Database {\n    public function __construct($host,\
  \ $user, $pass) {\n        parent::__construct($host, $user, $pass);\n    }\n}\n\
  ```\n\n##### `__construct`\n\n以上将运行父类的 `__construct()`，从而导致 echo 被执行。\n\n#### 第\
  \ 26.10 节：动态绑定\n\n动态绑定，也称为方法重写，是运行时多态的一个例子，当多个类包含同一方法的不同实现，但将调用该方法的对象直到运行时才知道时，就会发生这种情况。\n\
  \n如果某个条件决定使用哪个类来执行一个动作，而该动作在两个类中命名相同，这很有用。\n\n```\ninterface Animal {\n    public\
  \ function makeNoise();\n}\n\nclass Dog implements Animal {\n    public function\
  \ makeNoise() {\n        echo \"Bark\";\n    }\n}\n\nclass Cat implements Animal\
  \ {\n    public function makeNoise() {\n        echo \"Meow\";\n    }\n}\n```\n\n\
  ```\nclass User {\n    public $petType = 'Dog';\n    public function makePetNoise()\
  \ {\n        $pet = new $this->petType();\n        $pet->makeNoise();\n    }\n}\n\
  \n$user = new User();\n$user->makePetNoise(); // Outputs \"Bark\"\n```\n\n| Dog\
  \ | | | Cat |\n| --- | --- | --- | --- |\n\n在上面的示例中，`Animal` 类的 `makeNoise()` 将调用哪个\
  \ `makeNoise` 直到运行时才知道，这取决于 `User` 类中的属性。\n\n#### 第 26.11 节：$this、self 和 static\
  \ 以及单例模式\n\n| `$this->member` | 用于非静态成员，使用 | `self::$member` |\n| --- | --- | ---\
  \ |\n\n```\nclass MyClass {\n    public $prop = \"I'm an instance property\";\n\
  \    public static $staticProp = \"I'm a static property\";\n    \n    public function\
  \ showProps() {\n        echo $this->prop;      // Correct: Accessing instance property\n\
  \        echo self::$staticProp; // Correct: Accessing static property\n    }\n\
  }\n```\n使用 `$this` 来引用当前对象。使用 `self` 来引用当前类。换句话说，对静态成员使用 `self::$member`。\n\n| `sayHello()`\
  \ | 和 | `sayGoodbye()` |\n| --- | --- | --- |\n\n在下面的示例中，`sayHello()` 和 `sayGoodbye()`\
  \ 使用 `self` 和 `$this` 的区别可以在此观察到。\n\n```\nclass Greeting {\n    public static function\
  \ sayHello() {\n        echo \"Hello \";\n    }\n    \n    public function sayGoodbye()\
  \ {\n        self::sayHello();\n        echo \"Goodbye\";\n    }\n}\n\n$g = new\
  \ Greeting();\n$g->sayGoodbye(); // Outputs \"Hello Goodbye\"\n```\n\n```\nclass\
  \ A {\n    public static function who() {\n        echo __CLASS__;\n    }\n    \n\
  \    public static function test() {\n        self::who();\n    }\n}\n\nclass B\
  \ extends A {\n    public static function who() {\n        echo __CLASS__;\n   \
  \ }\n}\n\nB::test(); // Outputs \"A\" (because self refers to A)\n```\n\n`static`\
  \ 指的是你在层次结构中调用该方法的任何类。它允许在类被继承时更好地复用静态类属性。\n\n考虑以下代码：\n\n```\nclass Car {\n    public\
  \ static $brand = 'unknown';\n    \n    public static function getBrand() {\n  \
  \      return self::$brand;\n    }\n}\n\nclass BMW extends Car {\n    public static\
  \ $brand = 'BMW';\n}\n\nclass Mercedes extends Car {\n    public static $brand =\
  \ 'Mercedes';\n}\n\necho Car::getBrand();    // unknown\necho BMW::getBrand(); \
  \   // unknown (undesired)\necho Mercedes::getBrand(); // unknown (undesired)\n\
  ```\n\n这不会产生你想要的结果：\n\n```\nunknown unknown unknown\n```\n\n| brand |\n| --- |\n\
  \n那是因为无论何时调用方法 `getBrand()`，`self` 都指向 `Car` 类。\n\n要引用正确的类，你需要改用 `static`：\n\n```\n\
  class Car {\n    public static $brand = 'unknown';\n    \n    public static function\
  \ getBrand() {\n        return static::$brand; // Late Static Binding\n    }\n}\n\
  \nclass BMW extends Car {\n    public static $brand = 'BMW';\n}\n\nclass Mercedes\
  \ extends Car {\n    public static $brand = 'Mercedes';\n}\n```\n\n```\necho Car::getBrand();\
  \    // unknown\necho BMW::getBrand();    // BMW\necho Mercedes::getBrand(); //\
  \ Mercedes\n```\n\n这确实产生了期望的输出：\n\n```\nunknown\nBMW\nMercedes\n```\n\n另请参阅静态延迟绑定。\n\
  \n##### 单例模式\n\n如果你有一个创建成本高昂或代表某个你想复用的外部资源连接的对象，即没有连接池的数据库连接或通往其他系统的套接字，你可以在类中使用\
  \ `static` 和 `self` 关键字使其成为单例。关于单例模式是否应该使用存在强烈的观点分歧，但它确实有其用途。\n\n```\nclass Database\
  \ {\n    private static $instance = null;\n    private $connection;\n    \n    private\
  \ function __construct() {\n        $this->connection = new PDO('mysql:host=localhost;dbname=test',\
  \ 'user', 'pass');\n    }\n    \n    public static function getInstance() {\n  \
  \      if (self::$instance === null) {\n            self::$instance = new self();\n\
  \        }\n        return self::$instance;\n    }\n    \n    public function getConnection()\
  \ {\n        return $this->connection;\n    }\n}\n```\n\n正如你在示例代码中所见，我们定义了一个私有静态属性\
  \ `$instance` 来保存对象引用。由于这是静态的，此引用在该类型的**所有**对象间共享。\n\n##### `getInstance`\n\n`getInstance()`\
  \ 方法使用一种称为惰性实例化的方法，将创建对象延迟到最后可能的时刻，因为你不希望内存中躺着从未打算使用的未使用对象。它还节省了页面加载时不必加载不必要对象的时间和\
  \ CPU。该方法检查对象是否已设置，如果没有则创建它，并返回它。这确保了永远只创建一个此类对象。\n\n我们还将构造函数设为私有，以确保没有人从外部使用 `new`\
  \ 关键字创建它。如果你需要从此类继承，只需将 `private` 关键字改为 `protected`。\n\n要使用此对象，只需编写以下内容：\n\n```\n\
  $db = Database::getInstance();\n$conn = $db->getConnection();\n```\n\n现在我**确实**恳请你在可能的地方使用依赖注入并以松耦合对象为目标，但有时这根本不合理，单例模式可能会有用。\n\
  \n#### 第 26.12 节：定义基本类\n\nPHP 中的对象包含变量和函数。对象通常属于一个类，该类定义了该类所有对象将包含的变量和函数。\n\n定义类的语法是：\n\
  \n```\nclass MyClass {\n    public $property = 'value';\n    \n    public function\
  \ myMethod() {\n        return 'Hello World';\n    }\n}\n```\n\n一旦定义了类，你可以使用以下方式创建实例：\n\
  \n```\n$obj = new MyClass();\n```\n\n对象上的变量和函数这样访问：\n\n```\necho $obj->property;\
  \ // Outputs 'value'\necho $obj->myMethod(); // Outputs 'Hello World'\n```\n\n#####\
  \ 构造函数\n\n##### `__construct`\n\n类可以定义一个特殊的 `__construct()` 方法，它作为对象创建的一部分被执行。这通常用于指定对象的初始值：\n\
  \n```\nclass Person {\n    public $name;\n    \n    public function __construct($name)\
  \ {\n        $this->name = $name;\n    }\n}\n\n$person = new Person('John');\necho\
  \ $person->name; // Outputs 'John'\n```\n\n##### 扩展另一个类\n\n类定义可以扩展现有的类定义，添加新的变量和函数，以及修改父类中定义的那些。\n\
  \n这是一个扩展前面示例的类：\n\n```\nclass Shape {\n    public $color = 'red';\n}\n\nclass Square\
  \ extends Shape {\n    public $sides = 4;\n}\n```\n\n```\n$square = new Square();\n\
  echo $square->color; // Outputs 'red' (inherited from Shape)\necho $square->sides;\
  \ // Outputs '4' (defined in Square)\n```\n\n`Square` 类包含 `Shape` 类和 `Square` 类的变量和行为：\n\
  \n```\n$square = new Square();\n$square->color = 'blue';\necho $square->color; //\
  \ Outputs 'blue'\n```\n\n#### 第 26.13 节：匿名类\n\n匿名类在 PHP 7 中引入，以便轻松创建快速的一次性对象。它们可以接受构造函数参数、扩展其他类、实现接口并使用\
  \ trait，就像普通类一样。\n\n在其最基本的形式中，匿名类如下所示：\n\n```\n$util = new class {\n    public function\
  \ sayHello() {\n        echo \"Hello\";\n    }\n};\n\n$util->sayHello(); // Outputs\
  \ \"Hello\"\n```\n\n\n\n\n嵌套在另一个类内部的匿名类无法访问该外部类的 `private` 或 `protected` 方法或属性。可以通过让匿名类继承外部类来获得对外部类\
  \ `protected` 方法和属性的访问权限。可以通过构造函数将外部类的 `private` 属性传递给匿名类来获得访问权限。\n\n例如：\n\n![](img/Image00706.jpg)\n\
  \n![](img/Image00707.jpg)\n\n## 第 27 章：命名空间\n\n## 27.1 节：声明命名空间\n\n命名空间声明如下所示：\n\
