  \n上面的示例将输出：\n\n![](img/Image00982.jpg)\n\n## 第 43 章：文件处理\n\n| 参数 | 说明 |\n| --- |\
  \ --- |\n| filename | 要读取的文件名。 |\n| use_include_path | 您可以使用可选的第二个参数并将其设置为 `TRUE`，如果您想在\
  \ `include_path` 中也搜索该文件。 |\n| context | 一个上下文流资源。 |\n\n#### 第 43.1 节：便捷函数\n\n原始直接\
  \ IO `file_get_contents` 和 `file_put_contents` 提供了在单次调用中从文件读取/写入到 PHP 字符串或从 PHP\
  \ 字符串写入到文件的能力。`file_put_contents` 也可以与 `FILE_APPEND` 位掩码标志一起使用，以追加内容到文件，而不是截断并覆盖文件。它可以与\
  \ `LOCK_EX` 位掩码一起使用，以在写入过程中获取文件的独占锁。位掩码标志可以通过 `|` 按位或运算符组合使用。\n\n![](img/Image00983.jpg)\n\
  \n![](img/Image00984.jpg)\n\n`FILE_APPEND` 便于向日志文件追加内容，而 `LOCK_EX` 有助于防止多进程写入文件时的竞争条件。例如，将当前会话信息写入日志文件：\n\
  \n```\nfile_put_contents(\"logins.log\", \"{$_SESSION[\"username\"]} logged in\"\
  , FILE_APPEND | LOCK_EX);\n```\n\n##### CSV IO\n\n![](img/Image00985.jpg)\n\n`fgetcsv`\
  \ 从打开的文件中解析一行并检查 CSV 字段。成功时以数组形式返回 CSV 字段，失败时返回 `FALSE`。\n\n默认情况下，它将只读取 CSV 文件的一行。\n\
  \n![](img/Image00986.jpg)\n\n| contacts.csv |\n| --- |\n\n![](img/Image00987.jpg)\n\
  \n输出：\n\n![](img/Image00988.jpg)\n\n![](img/Image00989.jpg)\n\n##### 直接将文件读取到标准输出\n\
