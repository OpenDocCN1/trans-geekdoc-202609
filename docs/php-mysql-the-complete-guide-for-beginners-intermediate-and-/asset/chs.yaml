  \n我们也可以使用下面的语法发送头：\n\n![](img/Image00839.jpg)\n\n## 第 34 章：反射\n\n#### 第 34.1 节：类或对象的特性检测\n\
  \n类的特性检测可以部分通过 `property_exists` 和 `method_exists` 函数完成。\n\n![](img/Image00840.jpg)\n\
  \n```\n$r = new ReflectionClass('MyClass');\n\n$check = $r->hasProperty('public_field');\
  \  // true\n```\n\n![](img/Image00841.jpg)\n```\n$check = $r->hasMethod('public_function');\
  \ // true\n$check = $r->hasConstant('CONSTANT');      // true\n```\n\n// 对 protected、private\
  \ 和/或 static 成员同样适用。\n\n注意：对于 `property_exists` 和 `method_exists`，也可以提供感兴趣类的对象实例，而不必提供类名。使用反射时，应使用\
  \ `ReflectionObject` 类代替 `ReflectionClass`。\n\n#### 第 34.2 节：测试私有/受保护方法\n\n有时测试私有和受保护方法以及公共方法很有用。\n\
  \n![](img/Image00842.jpg)\n\n![](img/Image00843.jpg)\n\n测试驱动方法最简单的方式是使用反射\n\n![](img/Image00844.jpg)\n\
  \n如果该方法是静态的，则在类实例的位置传入 `null`\n\n![](img/Image00845.jpg)\n\n![](img/Image00846.jpg)\n\
  \n#### 第 34.3 节：访问私有和受保护的成员变量\n\n反射常被用作软件测试的一部分，例如用于模拟对象的运行时创建/实例化。它也非常适合在任意时间点检查对象的状态。下面是一个在单元测试中使用反射来验证受保护的类成员是否包含预期值的示例。\n\
  \n下面是一个非常基础的 Car 类。它有一个受保护的成员变量，将包含代表汽车颜色的值。因为该成员变量是受保护的，我们无法直接访问它，必须使用 getter 和\
  \ setter 方法分别来获取和设置其值。\n\n![](img/Image00847.jpg)\n\n| Car::setColor | |\n| ---\
  \ | --- |\n| Car::getColor | |\n| --- | --- |\n\n为了测试这一点，许多开发人员会创建一个 Car 对象，使用 `setColor()`\
  \ 设置汽车颜色，使用 `getColor()` 获取颜色，并将该值与他们设置的颜色进行比较：\n\n![](img/Image00848.jpg)\n\n|\
  \ Car::getColor | |\n| --- | --- |\n| Car::$color | |\n| --- | --- |\n\n表面上这看起来没问题。毕竟，`getColor()`\
  \ 所做的只是返回受保护成员变量 `$color` 的值。但这个测试有两个缺陷：\n\n| Car::getColor | |\n| --- | --- |\n\
  | 1. | 它执行了 `getColor()`，这超出了本次测试的范围 |\n| --- | --- |\n| 2. | 它依赖 `getColor()`，而\
  \ `getColor()` 本身可能有 bug，这会导致测试出现假阳性或假阴性 |\n| --- | --- |\n\n让我们看看为什么不应该在单元测试中使用\
  \ `getColor()` 而应该使用反射。假设一位开发人员被分配任务，要在每种汽车颜色前加上 \"Metallic\"。于是他们尝试修改 `getColor()`\
  \ 以在汽车颜色前预置 \"Metallic\"：\n\n![](img/Image00849.jpg)\n\n| Car::getColor | |\n| ---\
  \ | --- |\n| Car::setColor | |\n| --- | --- |\n| Car::setColor | |\n| --- | ---\
  \ |\n\n你看出错误了吗？开发人员在尝试将 \"Metallic\" 预置到汽车颜色前时，使用了分号而不是连接运算符。结果，无论汽车的实际颜色是什么，每当调用\
  \ `getColor()` 时，都会返回 \"Metallic \"。结果，我们的 `getColor()` 单元测试将会失败，即使 `setColor()`\
  \ 工作完美且未受此更改影响。\n\n| Car::$color | 包含我们通过 | Car::setColor | 设置的值 |\n| --- | ---\
  \ | --- | --- |\n| --- | --- | --- | --- |\n\n那么我们如何验证 `setColor()`？我们可以使用反射直接检查受保护的成员变量。怎么做呢？我们可以使用反射使受保护的成员变量对我们的代码可访问，从而获取其值。\n\
  \n让我们先看代码，然后再分解它：\n\n![](img/Image00850.jpg)\n\n| Car::$color | |\n| --- | --- |\n\
  | --- | --- |\n\n以下是我们在上面的代码中使用反射获取 `$color` 值的方法：\n\n1.  我们创建一个代表我们 Car 对象的新 [ReflectionObject](http://php.net/manual/en/class.reflectionobject.php)\n\
  2.  我们获取 `$color` 变量的 [ReflectionProperty](http://php.net/manual/en/class.reflectionproperty.php)\n\
  3.  我们使 `$color` 可访问\n4.  我们获取 `$color` 的值，而无需调用 `getColor()` 或 `setColor()` 或任何其他可能导致测试结果无效的访问器函数。\n\
  \n正如你所见，通过使用反射，我们可以在不调用 `getColor()` 或 `setColor()` 或任何其他可能导致测试结果无效的访问器函数的情况下获取\
  \ `$color` 的值。现在我们针对 `setColor()` 的单元测试是安全且准确的。\n\n## 第 35 章：依赖注入\n\n依赖注入（DI）是“传递依赖”的花哨说法。它真正的含义是通过构造函数和/或\
  \ setter 方法将对象的依赖传递进去，而不是在对象内部创建时创建它们。依赖注入也可能指依赖注入容器，它们自动化构建和注入过程。\n\n#### 第 35.1\
  \ 节：构造函数注入\n\n对象通常会依赖其他对象。不应在构造函数中创建依赖，而应将依赖作为参数传递给构造函数。这确保了对象之间没有紧耦合，并支持在类实例化时更改依赖。这有许多好处，包括通过使依赖显式化来使代码更易读，以及使测试更简单，因为依赖可以更容易地被替换和模拟。\n\
  \n在下面的示例中，`Component` 将依赖一个 `Logger` 实例，但它不创建一个。它要求在构造函数中将一个作为参数传入。\n\n![](img/Image00851.jpg)\n\
  \n如果不使用依赖注入，代码可能看起来像这样：\n\n![](img/Image00852.jpg)\n\n在构造函数中使用 `new` 创建新对象表明未使用依赖注入（或未完全使用），并且代码存在紧耦合。这也是代码测试不完整或可能拥有脆弱测试的迹象，这些测试会对程序状态做出错误的假设。\n\
  \n\n\n在上述示例中，我们使用的是依赖注入，如果有必要，我们可以轻松更换为不同的 `Logger`。例如，我们可能会使用一个记录到不同位置的 `Logger`\
  \ 实现，或者使用不同的日志格式，又或者是记录到数据库而不是文件。\n\n#### 第 35.2 节：Setter 注入\n\n依赖也可以通过 setter 方法注入。\n\
  \n![](img/Image00853.jpg)\n\n![](img/Image00854.jpg)\n\n当类的核心功能不依赖于该依赖项即可工作时，这种方式特别有用。\n\
  \n在这里，唯一需要的依赖是 `DatabaseConnection`，所以它放在构造函数中。`Logger` 依赖是可选的，因此不需要成为构造函数的一部分，这使得类更易于使用。\n\
  \n请注意，当使用 setter 注入时，最好是扩展功能而不是替换它。设置依赖时，无法确认该依赖不会在某个时刻发生变化，这可能导致意外结果。例如，最初设置了一个\
  \ `FileLogger`，随后又设置了一个 `MailLogger`。这破坏了封装性，并使日志难以查找，因为我们替换了依赖。\n\n为了防止这种情况，我们应该使用\
  \ setter 注入来添加依赖，如下所示：\n\n![](img/Image00855.jpg)\n\n![](img/Image00856.jpg)\n\n\
  这样，每当我们使用核心功能时，即使没有添加 logger 依赖也不会出错，并且任何添加的 logger 都会被使用，即使之前已经添加过另一个 logger。我们是在扩展功能，而不是替换它。\n\
  \n#### 第 35.3 节：容器注入\n\n在使用依赖注入容器（DIC）的语境下，依赖注入（DI）可以被视为构造函数注入的超集。DIC 通常会分析类构造函数的类型提示并解析其需求，从而有效地注入实例执行所需的依赖。\n\
  \n具体实现远超出了本文档的范围，但其核心在于，DIC 依赖于使用类的签名……\n\n![](img/Image00857.jpg)\n\n……来自动实例化它，大多数情况下依赖于自动加载系统。\n\
  \n![](img/Image00858.jpg)\n\n如果你使用的 PHP 版本至少是 5.5，并想要以如上所示的方式获取类名，正确的方法是第二种方式。这样你可以利用现代\
  \ IDE 快速查找类的用法，这将极大地帮助你进行潜在的重构。你不应该依赖普通字符串。\n\n在这种情况下，`Documentation\\Example` 知道它需要一个\
  \ `Meaning`，DIC 反过来会实例化一个 `Meaning` 类型。具体实现无需依赖消费实例。\n\n相反，我们在对象创建之前在容器中设置规则，指示如果需要，特定类型应如何实例化。\n\
  \n这有许多优势，因为 DIC 可以\n\n![](img/Image00859.jpg)共享通用实例\n\n提供工厂以解析类型签名\n\n解析接口签名\n\n\
  如果我们定义关于如何管理特定类型的规则，就可以对共享、实例化或从工厂创建哪些类型进行精细控制。\n\n## 第 36 章：XML\n\n#### 第 36.1\
  \ 节：使用 DomDocument 创建 XML\n\n要使用 `DOMDocument` 创建 XML，基本上我们需要使用 `createElement()`\
