  \ 函数是一个检测脚本是否从命令行执行的函数示例：\n\n![](img/Image01397.jpg)\n\n#### 第 66.6 节：命令行上的行为差异\n\
  \n从 CLI 运行时，PHP 表现出一些与从 Web 服务器运行时不同的行为。应牢记这些差异，特别是在同一脚本可能在两种环境中运行的情况下。\n\n| `require(\"\
  ./stuff.inc\");` |\n| --- |\n\n![](img/Image01398.jpg)\n\n**无目录更改** 从 Web 服务器运行脚本时，当前工作目录始终是脚本本身所在的目录。代码\
  \ `require(\"./stuff.inc\");` 假设文件与脚本在同一目录中。在命令行上，当前工作目录是你调用脚本时所在的目录。将从命令行调用的脚本应始终使用绝对路径。（注意魔术常量\
  \ `__DIR__` 和 `__FILE__` 继续按预期工作，并返回脚本的位置。）\n\n| `php.ini` |\n| --- |\n\n![](img/Image01399.jpg)\n\
  \n**无输出缓冲** 指令 `output_buffering` 和 `implicit_flush` 默认分别为 `false` 和 `true`。缓冲仍然可用，但必须显式启用，否则输出将始终实时显示。\n\
  \n| `php.ini` |\n| --- |\n\n| `php.ini` |\n| --- |\n\n| `php.ini` 可以被加载。当你从 cli\
  \ 使用 php 时，它可以使用不同的 `php.ini` |\n| --- |\n\n\n\n\n#### 第 66.7 节：运行你的脚本\n\n指令 `max_execution_time`\
  \ 被设置为零，因此脚本默认不会超时。\n\n如果你启用了指令 `html_errors`，它将在命令行中被忽略。\n\n这与 Web 服务器的行为不同。你可以通过运行\
  \ `php --ini` 来了解正在使用哪个配置文件。\n\n在 Linux/UNIX 或 Windows 上，脚本可以作为参数传递给 PHP 可执行文件，随后跟随该脚本的选项和参数：\n\
  \n```\nphp script.php arg1 arg2\n```\n\n这将 `foo` 和 `bar` 作为参数传递给 `script.php`。\n\
  \n在 Linux/UNIX 上，运行脚本的首选方法是在文件的第一行使用 [shebang](https://en.wikipedia.org/wiki/Shebang_(Unix))（例如\
  \ `#!/usr/bin/env php`），并为该文件设置可执行位。假设脚本在你的路径中，你可以直接调用它：\n\n```\n/usr/bin/env php\n\
  ```\n\n```\n/usr/bin/php or /usr/local/bin/php\n```\n\n```\n/usr/bin/env\n```\n\n\
  使用 `/usr/bin/env` 会使 PHP 可执行文件通过 `PATH` 环境变量被查找。根据 PHP 的安装方式，它可能不位于同一位置（例如 `/usr/bin/php`），这与\
  \ `env` 不同，后者通常可从 `/usr/bin/env` 获得。\n\n在 Windows 上，你可以通过将 PHP 的目录和你的脚本添加到 `PATH`\
  \ 并编辑 `PATHEXT` 以允许通过 `PATH` 检测 `.php` 来获得相同的结果。另一种可能是在你的 PHP 脚本同目录下添加一个名为 `example.bat`\
  \ 的文件并写入以下行：\n\n```\n@php \"%~dp0example.php\" %*\n```\n\n或者，如果你将 PHP 的目录添加到了 `PATH`\
  \ 中，为了方便使用：\n\n```\nexample arg1 arg2\n```\n\n#### 第 66.8 节：getopt() 的边缘情况\n\n此示例展示了当用户输入不常见时\
  \ `getopt` 的行为：\n\n```\nphp script.php -a -b -c\n```\n\nShell 命令行\n\n```\nphp script.php\
  \ -a -b -c\n```\n\n从这个示例中可以看出：\n\n单个选项（无冒号）如果启用，始终携带布尔值 `false`。\n\n如果一个选项被重复，`getopt`\
  \ 输出中的相应值将变为一个数组。\n\n必需参数选项（一个冒号）接受一个空格或无空格（像可选参数选项一样）作为分隔符。\n\n在一个无法映射到任何选项的参数之后，其后的选项也不会被映射。\n\
  \n#### 第 66.9 节：运行内置 Web 服务器\n\n从 5.4 版本开始，PHP 自带内置服务器。它可以用于运行应用程序，而无需安装其他 HTTP\
  \ 服务器，如 nginx 或 apache。内置服务器仅设计用于开发和测试目的的受控环境中。\n\n可以使用命令 `php -S` 运行它：\n\n```\n\
  index.php\n```\n\n要测试它，请创建包含以下内容的 `index.php` 文件：\n\n```\n<?php echo \"Hello World\"\
  ; ?>\n```\n\n并运行命令：\n\n```\nphp -S localhost:8080\n```\n\n现在你应该能在浏览器中看到内容。要检查这一点，请导航到\
  \ `http://localhost:8080`。\n\n每次访问都会导致日志条目被写入终端：\n\n```\n[Mon Aug 15 18:20:19 2016]\
  \ ::1:52622 [200]: /index.php\n```\n\n## 第 67 章：本地化\n\n#### 第 67.1 节：使用 gettext()\
  \ 本地化字符串\n\n```\nphp.ini\n```\n\nGNU gettext 是 PHP 中的一个扩展，必须在 `php.ini` 中包含：`extension=php_gettext.dll`\
  \ #Windows `extension=gettext.so` #Linux\n\ngettext 函数实现了一个 NLS（本地语言支持）API，可用于国际化你的\
  \ PHP 应用程序。\n\n可以通过设置区域设置、设置翻译表并对任何你想要翻译的字符串调用 `gettext()` 来在 PHP 中翻译字符串。\n\n```\n\
  <?php\n$locale = 'fr_FR';\nputenv(\"LC_ALL=$locale\");\nsetlocale(LC_ALL, $locale);\n\
  bindtextdomain(\"myPHPApp\", \"./locale\");\ntextdomain(\"myPHPApp\");\n?>\n```\n\
  \n`myPHPApp.po`\n\n```\nmsgid \"some string\"\nmsgid \"une chaîne\"\n```\n\n`gettext()`\
  \ 加载给定的后编译 `.po` 文件，一个 `.mo` 文件，它将你的待翻译字符串映射如上所示。\n\n完成这小段设置代码后，翻译将在以下文件中查找：\n\n\
  ```\n./locale/fr_FR/LC_MESSAGES/myPHPApp.mo\n```\n\n每当你调用 `gettext('some string')`\
  \ 时，如果 'some string' 已在 `.mo` 文件中翻译，则返回翻译。否则，将返回未翻译的 'some string'。\n\n```\necho\
  \ gettext(\"some string\"); // outputs: une chaîne\n```\n\n## 第 68 章：Headers 操作\n\
  \n#### 第 68.1 节：Header 的基本设置\n\n这是一个在点击按钮时更改 Header 以跳转到新页面的基本设置。\n\n```\n<?php\n\
  header(\"Location: newpage.php\");\n?>\n```\n\n## 第 69 章：编码规范\n\n#### 第 69.1 节：PHP\
  \ 标签\n\n你应该始终使用 `<?php ?>` 标签或短回显标签 `<?= ?>`。其他变体（特别是短标签 `<? ?>`）不应使用，因为它们通常被系统管理员禁用。\n\
  \n当文件不需要产生输出时（整个文件均为 PHP 代码），应省略结束标签 `?>` 以避免意外输出，这可能导致客户端解析文档时出现问题，特别是某些浏览器无法识别\
  \ `<!DOCTYPE>` 标签并激活 [Quirks Mode](https://en.wikipedia.org/wiki/Quirks_mode)。\n\
  \n简单 PHP 脚本示例：\n\n```\n<?php\necho \"Hello World\";\n```\n\n类定义文件示例：\n\n```\n<?php\n\
  class MyClass {\n    public function myMethod() {\n        return \"Hello\";\n \
  \   }\n}\n```\n\nPHP 嵌入 HTML 示例：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n    <title>PHP\
  \ Test</title>\n</head>\n<body>\n    <?php echo \"Hello World\"; ?>\n</body>\n</html>\n\
  ```\n\n## 第 70 章：异步编程\n\n#### 第 70.1 节：生成器的优势\n\nPHP 5.5 引入了生成器和 `yield` 关键字，这使我们能够编写看起来更像同步代码的异步代码。\n\
  \n`Generator::send()`\n\nyield 表达式负责将控制权交还给调用代码，并在该处提供一个恢复点。可以沿着 yield 指令发送一个值。该表达式的返回值要么是\
  \ `null`，要么是传递给 `Generator::send()` 的值。\n\n```\n<?php\nfunction generator() {\n\
  \    $value = yield 1;\n    echo $value; // 2\n}\n$gen = generator();\n$gen->send(2);\n\
  ```\n\n这种机制可被协程实现用于等待生成器产出的 Awaitables（通过将自身注册为解析的回调），并在 Awaitable 解析后立即继续执行生成器。\n\
  \n#### 第 70.2 节：使用 Icicle 事件循环\n\n[Icicle](https://github.com/icicleio/icicle) 使用\
  \ Awaitables 和生成器来创建协程。\n\n```\n<?php\nrequire 'vendor/autoload.php';\n\nuse Icicle\\\
  Loop;\nuse Icicle\\Awaitable;\n\n$coroutine = function() {\n    yield Awaitable\\\
  resolve(1);\n    yield Awaitable\\resolve(2);\n};\n\nLoop\\run(function() use ($coroutine)\
  \ {\n    $result = yield $coroutine();\n    var_dump($result);\n});\n```\n\n```\n\
  <?php\nuse Icicle\\Loop;\nuse Icicle\\Awaitable\\resolve;\n\nLoop\\run(function()\
  \ {\n    $promise = resolve(1);\n    $promise->then(function($value) {\n       \
  \ echo $value; // 1\n    });\n});\n```\n\n#### 第 70.3 节：使用 proc_open() 生成非阻塞进程\n\
  \n除非你安装诸如 `pthread` 之类的扩展，否则 PHP 没有并发运行代码的支持。有时可以通过使用 `proc_open()` 和 `stream_set_blocking()`\
  \ 并异步读取它们的输出来绕过此限制。\n\n`stream_set_blocking()`\n\n如果我们将代码拆分为更小的块，我们可以将其作为多个子进程运行。然后使用\
  \ `stream_set_blocking()` 函数，我们可以使每个子进程也变为非阻塞。这意味着我们可以生成多个子进程，然后在循环中检查它们的输出（类似于事件循环）并等待直到它们全部完成。\n\
  \n\n\n\n## 第 70.3 节：使用 Event 扩展进行子进程管理\n\n作为示例，我们可以有一个小型子进程，它只是运行一个循环，并在每次迭代中随机休眠\
  \ 100-1000ms（注意，对于同一个子进程，延迟始终相同）。\n\n![Image01421.jpg](img/Image01421.jpg)\n\n然后主进程将生成子进程并读取它们的输出。我们可以将其分解为更小的代码块：\n\
  \n![Image01422.jpg](img/Image01422.jpg)\n\n![Image01423.jpg](img/Image01423.jpg)\n\
  \n输出随后包含来自所有三个子进程的混合数据，因为它们是由 `fread()` 读取的（注意，在这种情况下 proc1 比其他两个早得多地结束了）：\n\n![Image01424.jpg](img/Image01424.jpg)\n\
  \n## 第 70.4 节：使用 Event 和 DIO 读取串口\n\n`DIO` 流目前不被 `Event` 扩展识别。没有干净的方法来获取封装在 `DIO`\
  \ 资源中的文件描述符。但有一个变通方法：\n\n| 函数 / 方法 | 说明 |\n| :--- | :--- |\n| `fopen` | 为端口打开流 |\n\
  | `stream_set_blocking` | 使流变为非阻塞 |\n| `EventUtil::getSocketFd` | 从流中获取数字文件描述符 |\n\
  | `dio_fdopen` | 传递数字文件描述符并获取 DIO 资源 |\n\n![Image01425.jpg](img/Image01425.jpg)\n\
  \n1. 使用 `fopen()` 为端口打开流。\n2. 使用 `stream_set_blocking()` 使流变为非阻塞。\n3. 使用 `EventUtil::getSocketFd()`\
  \ 从流中获取数字文件描述符。\n4. 将数字文件描述符传递给 `dio_fdopen()`（目前未文档化）并获取 DIO 资源。\n5. 添加一个带有回调的\
  \ Event，用于监听文件描述符上的读取事件。\n6. 在回调中消耗可用数据，并根据应用程序的逻辑进行处理。\n\n**dio.php**\n\n![Image01426.jpg](img/Image01426.jpg)\n\
  \n![Image01427.jpg](img/Image01427.jpg)\n\n### 测试\n\n在终端 A 中运行以下命令：\n\n```bash\n\
  $ socat -d -d pty,raw,echo=0 pty,raw,echo=0\n```\n\n```text\n2016/12/01 18:04:06\
  \ socat[16750] N PTY is /dev/pts/5\n2016/12/01 18:04:06 socat[16750] N PTY is /dev/pts/8\n\
  2016/12/01 18:04:06 socat[16750] N starting data transfer loop with FDs [5,5] and\
  \ [7,7]\n```\n\n输出可能有所不同。使用前几行中的 PTY（特别是 `/dev/pts/5` 和 `/dev/pts/8`）。\n\n在终端 B\
  \ 中运行上述脚本。您可能需要 root 权限：\n\n![Image01429.jpg](img/Image01429.jpg)\n\n在终端 C 中向第一个\
  \ PTY 发送字符串：\n\n![Image01430.jpg](img/Image01430.jpg)\n\n输出：\n\n![Image01431.jpg](img/Image01431.jpg)\n\
  \n## 第 70.5 节：基于 Event 扩展的 HTTP 客户端\n\n这是一个基于 `Event` 扩展的示例 HTTP 客户端类。\n\n该类允许调度多个\
  \ HTTP 请求，然后异步运行它们。\n\n**http-client.php**\n\n![Image01432.jpg](img/Image01432.jpg)\n\
  \n```php\n/**\n * 调度所有待处理的请求（事件）\n * @return void\n */\npublic function run() {\n\
  \    $this->base->dispatch();\n}\n\npublic function __destruct() {\n    // 显式销毁连接对象，不要等待\
  \ GC。\n    // 否则，EventBase 可能会被更早地释放。\n    $this->connections = null;\n}\n\n/**\n\
  \ * @brief 添加一个待处理的 HTTP 请求\n * @param string $address 主机名，或 IP\n * @param int $port\
  \ 端口号\n * @param array $headers 额外的 HTTP 头部\n * @param int $cmd 一个 EventHttpRequest::CMD_*\
  \ 常量\n * @param string $resource HTTP 请求资源，例如 '/page?a=b&c=d'\n * @return EventHttpRequest|false\n\
  \ */\npublic function addRequest($address, $port, array $headers,\n    $cmd = EventHttpRequest::CMD_GET,\
  \ $resource = '/'\n) {\n    $conn = new EventHttpConnection($this->base, null, $address,\
  \ $port);\n    $conn->setTimeout(5);\n    $req = new EventHttpRequest([$this, '_requestHandler'],\
  \ $this->base);\n    foreach ($headers as $k => $v) {\n        $req->addHeader($k,\
  \ $v, EventHttpRequest::OUTPUT_HEADER);\n    }\n    $req->addHeader('Host', $address,\
  \ EventHttpRequest::OUTPUT_HEADER);\n    $req->addHeader('Connection', 'close',\
  \ EventHttpRequest::OUTPUT_HEADER);\n    if ($conn->makeRequest($req, $cmd, $resource))\
  \ {\n        $this->connections[] = $conn;\n        return $req;\n    }\n    return\
  \ false;\n}\n\n/**\n * @brief 处理一个 HTTP 请求\n * @param EventHttpRequest $req\n *\
  \ @param mixed $unused\n * @return void\n */\npublic function _requestHandler($req,\
  \ $unused) {\n    if (is_null($req)) {\n        echo \"Timed out\\n\";\n    } else\
  \ {\n        $response_code = $req->getResponseCode();\n        if ($response_code\
  \ == 0) {\n            // ...\n        }\n    }\n}\n```\n\n![Image01433.jpg](img/Image01433.jpg)\n\
