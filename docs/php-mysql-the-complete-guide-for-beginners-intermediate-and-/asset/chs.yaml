  \n#### 第 50.3 节：重定向到另一个 URL\n\n| header |\n| --- |\n\n\n\n## 第 51 章：如何拆解 URL\n\n\
  在编写 PHP 代码时，你很可能会遇到需要将 URL 拆分为若干部分的情况。显然，根据你的需求，有不止一种方法可以实现。本文将为你解释这些方法，以便你找到最适合你的方案。\n\
  \n#### 第 51.1 节：使用 `parse_url()`\n\n你可以使用 `header()` 函数指示浏览器重定向到不同的 URL：\n\n```\n\
  header(\"Location: http://www.example.com/\"); /* 重定向浏览器 */\nexit;\n```\n\n你也可以重定向到相对\
  \ URL（这不属于官方 HTTP 规范的一部分，但在所有浏览器中均可工作）：\n\n```\nheader(\"Location: /path/to/page.php\"\
  ); /* 重定向浏览器 */\nexit;\n```\n\n如果头部信息已发送，你可以选择发送一个 meta refresh HTML 标签。\n\n> **警告**：meta\
  \ refresh 标签依赖于客户端正确处理 HTML，但某些客户端不会这样做。通常，它仅在 Web 浏览器中有效。此外，请考虑到如果头部信息已发送，你可能存在一个\
  \ Bug，这应该触发一个异常。\n\n你也可以为用户打印一个可点击的链接，以供忽略 meta refresh 标签的客户端使用：\n\n```php\n$saveUrl\
  \ = htmlspecialchars($url); // 防止浏览器将 url 视为 HTML\n// 告诉浏览器在 0 秒后将页面重定向到 $saveUrl\n\
  print '<meta http-equiv=\"refresh\" content=\"0; url=' . $saveUrl . '\">' ;\n//\
  \ 为用户显示链接\nprint '<p>Please continue to <a href=\"' . $saveUrl . '\">' . $saveUrl\
  \ . '</a></p>' ;\nexit;\n```\n\n如果你需要分离路径，可以使用 `explode()`：\n\n```php\n$url = 'http://username:password@hostname:9090/path/to/resource?arg=value#anchor';\n\
  $parts = parse_url($url);\nprint_r($parts);\n```\n\n如果你需要路径的最后一部分，可以像这样使用 `end()`：\n\
  \n```php\n$path = $parts['path']; // /path/to/resource\n$segments = explode('/',\
  \ $path);\n$lastSegment = end($segments); // resource\n```\n\n如果 URL 包含 GET 变量，你也可以检索它们：\n\
  \n```php\n$query = $parts['query']; // arg=value\nparse_str($query, $vars);\nprint_r($vars);\
  \ // Array ( [arg] => value )\n```\n\n如果你想拆解查询变量，可以像这样使用 `parse_str()`：\n\n```php\n\
  $str = \"first=value&arr[]=foo+bar&arr[]=baz\";\nparse_str($str, $output);\nprint_r($output);\n\
  ```\n\n#### 第 51.2 节：使用 `explode()`\n\n`explode()`：返回一个字符串数组，每个元素是由 string delimiter\
  \ 分隔形成的字符串的子串。\n\n此函数非常直观。\n\n```php\n$url = \"http://www.example.com/path/to/page.php\"\
  ;\n$parts = explode('/', $url);\nprint_r($parts);\n```\n\n你可以通过以下方式获取 URL 的最后一部分：\n\
  \n```php\n$lastPart = end($parts); // page.php\n```\n\n你也可以结合 `sizeof()` 和数学运算符在数组中导航，如下所示：\n\
  \n```php\n$secondToLast = $parts[sizeof($parts) - 2]; // to\n```\n\n#### 第 51.3\
  \ 节：使用 `basename()`\n\n`basename()`：给定一个包含文件或目录路径的字符串，此函数将返回路径中的文件名部分。\n\n此函数将仅返回\
  \ URL 的最后一部分：\n\n```php\n$url = \"http://www.example.com/path/to/page.php\";\n$file\
  \ = basename($url); // page.php\n```\n\n```php\n$url = \"http://www.example.com/path/to/page.php?arg=value\"\
  ;\n$file = basename($url); // page.php?arg=value\n```\n\n如果你的 URL 包含更多内容，而你需要的是包含文件的目录名，可以结合\
  \ `dirname()` 这样使用：\n\n```php\n$url = \"http://www.example.com/path/to/page.php\"\
  ;\n$dir = dirname($url); // http://www.example.com/path/to\n```\n\n## 第 52 章：对象序列化\n\
  \n#### 第 52.1 节：Serialize / Unserialize\n\n| 函数 | 说明 |\n| --- | --- |\n| `serialize()`\
  \ | 返回一个字符串，包含了可以在 PHP 中存储的任意值的字节流表示。 |\n| `unserialize()` | 可以使用该字符串重新创建原始的变量值。\
  \ |\n\n序列化一个对象：\n\n```php\n$serialized = serialize($object);\n```\n\n反序列化一个对象：\n\
  \n```php\n$object = unserialize($serialized);\n```\n\n示例：\n\n```php\nclass A {\n\
  \    public $var = 'value';\n}\n$obj = new A();\n$serialized = serialize($obj);\n\
  echo $serialized; // O:1:\"A\":1:{s:3:\"var\";s:5:\"value\";}\n$unserialized = unserialize($serialized);\n\
  var_dump($unserialized);\n```\n\n#### 第 52.2 节：`Serializable` 接口\n\n##### 简介\n\n\
  | 方法 | 说明 |\n| --- | --- |\n| `__sleep()` | |\n| `__wakeup()` | |\n| `__destruct()`\
  \ | |\n| `unserialize()` | |\n| `__construct()` | |\n\n实现此接口的类将不再支持 `__sleep()`\
  \ 和 `__wakeup()`。每当一个实例需要被序列化时，`serialize()` 方法会被调用。除非在方法内部编程，否则这不会调用 `__sleep()`\
  \ 或产生任何其他副作用。当数据被反序列化时，类是已知的，并且会调用适当的 `unserialize()` 方法作为构造函数，而不是调用 `__construct()`。如果你需要执行标准构造函数，可以在该方法中进行。\n\
  \n基本用法：\n\n```php\nclass MyClass implements Serializable {\n    private $data;\n\
  \n    public function __construct($data) {\n        $this->data = $data;\n    }\n\
  \n    public function serialize() {\n        return serialize($this->data);\n  \
  \  }\n\n    public function unserialize($data) {\n        $this->data = unserialize($data);\n\
  \    }\n}\n```\n\n```php\n$obj = new MyClass('some data');\n$serialized = serialize($obj);\n\
  $unserialized = unserialize($serialized);\n```\n\n## 第 53 章：序列化\n\n##### 参数详情\n\n\
  要序列化的值。`serialize()` 处理所有类型，除了 `resource` 类型。你甚至可以 `serialize()` 包含对自身引用的数组。你正在序列化的数组/对象中的循环引用也将被存储。任何其他引用将会丢失。序列化对象时，PHP\
  \ 会尝试在序列化前调用成员函数 `__sleep()`。这是为了允许对象在被序列化前进行任何最后时刻的清理工作等。同样地，当使用 `unserialize()`\
  \ 恢复对象时，会调用 `__wakeup()` 成员函数。对象的私有成员会在成员名前加上类名；受保护成员会在成员名前加上 `'*'`。这些前缀值的两侧都有空字节。\n\
  \n#### 第 53.1 节：不同类型的序列化\n\n生成一个值的可存储表示。\n\n这对于在不丢失类型和结构的情况下存储或传递 PHP 值非常有用。\n\n\
  要将序列化字符串转回 PHP 值，请使用 `unserialize()`。\n\n```php\n$double = 1.5;\necho serialize($double);\
  \ // d:1.5;\n```\n\n序列化浮点数：\n\n```php\n$float = 1.5;\necho serialize($float); //\
  \ d:1.5;\n```\n\n```php\n$int = 123;\necho serialize($int); // i:123;\n```\n\n```php\n\
  $string = 'hello';\necho serialize($string); // s:5:\"hello\";\n```\n\n```php\n\
  $array = array('a', 'b', 'c');\necho serialize($array); // a:3:{i:0;s:1:\"a\";i:1;s:1:\"\
  b\";i:2;s:1:\"c\";}\n```\n\n你也可以序列化对象。\n\n序列化对象时，PHP 会尝试在序列化前调用成员函数 `__sleep()`。这是为了允许对象在被序列化前进行任何最后时刻的清理工作等。同样地，当使用\
  \ `unserialize()` 恢复对象时，会调用 `__wakeup()` 成员函数。\n\n```php\nclass Test {\n    public\
  \ $prop = 'value';\n}\n$obj = new Test();\necho serialize($obj); // O:4:\"Test\"\
  :1:{s:4:\"prop\";s:5:\"value\";}\n```\n\n请注意，闭包不能被序列化：\n\n```php\n$closure = function()\
  \ {};\necho serialize($closure); // Fatal error: Uncaught Exception: Serialization\
  \ of 'Closure' is not allowed\n```\n\n#### 第 53.2 节：`unserialize` 的安全问题\n\n使用 `unserialize`\
  \ 函数反序列化来自用户输入的数据可能很危险。\n\n### php.net 的警告\n\n> **警告**：请勿将不可信的用户输入传递给 `unserialize()`。反序列化可能导致由于对象实例化和自动加载而加载并执行代码，恶意用户可能会利用这一点。如果你需要向用户传递序列化数据，请使用安全的标准数据交换格式，如\
  \ JSON（通过 `json_decode()` 和 `json_encode()`）。\n\n### 可能的攻击\n\n#### PHP 对象注入\n\n\
  PHP 对象注入是一种应用层漏洞，可能允许攻击者执行不同类型的恶意攻击，例如代码注入、SQL 注入、路径遍历和应用层拒绝服务，具体取决于上下文。当用户提供的输入在传递给\
  \ `unserialize()` PHP 函数之前未经过适当清理时，就会发生此漏洞。由于 PHP 允许对象序列化，攻击者可能将临时序列化字符串传递给易受攻击的\
  \ `unserialize()` 调用，导致任意 PHP 对象被注入到应用程序作用域中。\n\n要成功利用 PHP 对象注入漏洞，必须满足两个条件：\n\n\
  | 条件 | 说明 |\n| --- | --- |\n| `unserialize()` | 应用程序必须有一个实现了 PHP 魔术方法（如 `__wakeup`\
  \ 或 `__destruct`）的类，该方法可用于发动恶意攻击，或启动“POP 链”。 |\n| 类可用性 | 攻击期间使用的所有类必须在调用易受攻击的 `unserialize()`\
  \ 时已声明，否则必须支持这些类的对象自动加载。 |\n\n#### 示例 1 - 路径遍历攻击\n\n下面的示例展示了一个包含可利用的 `__destruct`\
  \ 方法的 PHP 类：\n\n```php\nclass Example1 {\n    public $cache_file;\n\n    public\
  \ function __destruct() {\n        unlink($this->cache_file);\n    }\n}\n```\n\n\
  在本例中，攻击者可能通过路径遍历攻击删除任意文件，例如请求以下 URL：\n\n```\nhttp://testsite.com/vuln.php?data=O:8:\"\
  Example1\":1:{s:10:\"cache_file\";s:15:\"../../index.php\";}\n```\n\n#### 示例 2 -\
  \ 代码注入攻击\n\n\n\n\n下面的示例展示了一个包含可利用的 `__wakeup` 方法的 PHP 类：\n\n```\n![](img/Image01179.jpg)\n\
  ```\n\n在这个示例中，攻击者可能能够通过发送如下 HTTP 请求来执行代码注入攻击：\n\n```\n![](img/Image01180.jpg)\n\
