  \n## 第 70.6 节：基于 Ev 扩展的 HTTP 客户端\n\n这是一个基于 `Ev` 扩展的示例 HTTP 客户端。\n\n`Ev` 扩展实现了一个简单而强大的通用事件循环。它不提供特定于网络的观察者，但其\
  \ `I/O 观察者` 可用于 `socket` 的异步处理。以下代码展示了如何调度 HTTP 请求以进行并行处理。\n\n**http-client.php**\n\
  \n![Image01438.jpg](img/Image01438.jpg)\n\n```php\n$this->http_client = $client;\n\
  $this->host        = $host;\n$this->resource    = $resource;\n$this->method    \
  \  = $method;\n// 获取 WWW 服务的端口\n$this->service_port = getservbyname('www', 'tcp');\n\
  // 获取目标主机的 IP 地址\n$this->address     = gethostbyname($this->host);\n// 创建一个 TCP/IP\
  \ socket\n$this->socket      = socket_create(AF_INET, SOCK_STREAM, SOL_TCP);\nif\
  \ (!$this->socket) {\n    throw new RuntimeException(\"socket_create() failed: reason:\
  \ \" .\n        socket_strerror(socket_last_error()));\n}\n// 设置 O_NONBLOCK 标志\n\
  socket_set_nonblock($this->socket);\n$this->conn_watcher = $this->http_client->getLoop()\n\
  \    ->timer(0, 0., [$this, 'connect']);\n}\n\npublic function __destruct() {\n\
  \    $this->close();\n}\n\nprivate function freeWatcher(&$w) {\n    if ($w) {\n\
  \        $w->stop();\n        $w = null;\n    }\n}\n\n/**\n * 释放请求的所有资源\n */\nprivate\
  \ function close() {\n    if ($this->socket) {\n        socket_close($this->socket);\n\
  \        $this->socket = null;\n    }\n    $this->freeWatcher($this->timeout_watcher);\n\
  \    $this->freeWatcher($this->read_watcher);\n    $this->freeWatcher($this->write_watcher);\n\
  \    $this->freeWatcher($this->conn_watcher);\n}\n\n/**\n * 在 socket 上初始化连接\n *\
  \ @return bool\n */\npublic function connect() {\n    $loop = $this->http_client->getLoop();\n\
  \    $this->timeout_watcher = $loop->timer($this->timeout, 0., [$this, '_onTimeout']);\n\
  \    $this->write_watcher   = $loop->io($this->socket, Ev::WRITE, [$this, '_onWritable']);\n\
  \    return socket_connect($this->socket, $this->address, $this->service_port);\n\
  }\n```\n\n\n\n\n# 第 70 章：事件循环\n\n## 第 70.7 节：使用 Amp 事件循环\n\n[Amp](https://github.com/amphp/amp/tree/v1.x)\
  \ 利用 Promise（Awaitable 的另一种叫法）和生成器来创建协程。\n\n```php\npublic function _onTimeout(EvTimer\
  \ $w) {\n    $w->stop();\n    $this->close();\n}\n\n/**\n * 当套接字变为可写时调用的回调\n */\n\
  public function _onWritable(EvIo $w) {\n    $this->timeout_watcher->stop();\n  \
  \  $w->stop();\n    $in = implode(\"\\r\\n\", [\n        \"{$this->method} {$this->resource}\
  \ HTTP/1.1\",\n        \"Host: {$this->host}\",\n        'Connection: Close',\n\
  \    ]) . \"\\r\\n\\r\\n\";\n    if (!socket_write($this->socket, $in, strlen($in)))\
  \ {\n        trigger_error(\"Failed writing $in to socket\", E_USER_ERROR);\n  \
  \      return;\n    }\n    $loop = $this->http_client->getLoop();\n    $this->read_watcher\
  \ = $loop->io($this->socket, Ev::READ, [$this, '_onReadable']);\n    // 继续运行循环\n\
  \    $loop->run();\n}\n\n/**\n * 当套接字变为可读时调用的回调\n */\npublic function _onReadable(EvIo\
  \ $w) {\n    // 在非阻塞模式下 recv() 20 字节\n    $ret = socket_recv($this->socket, $out,\
  \ 20, MSG_DONTWAIT);\n    if ($ret) {\n        // 仍有数据可读。将读取的块追加到缓冲区。\n        $this->buffer\
  \ .= $out;\n    } elseif ($ret === 0) {\n        // 全部读取完毕\n        printf(\"\\\
  n <<<< \\n %s \\n >>>>\", rtrim($this->buffer));\n        fflush(STDOUT);\n    \
  \    $w->stop();\n        $this->close();\n        return;\n    }\n    // 捕获 EINPROGRESS、EAGAIN\
  \ 或 EWOULDBLOCK\n    if (in_array(socket_last_error(), static::$e_nonblocking))\
  \ {\n        return;\n    }\n    $w->stop();\n    $this->close();\n}\n```\n\n测试\n\
  \n```http\nhttp://my-host.local/test.php\n```\n\n假设脚本正在打印 `$_GET` 的转储：\n\n```bash\n\
  php http-client.php\n```\n\n那么命令的输出将类似于以下内容：\n\n(已裁剪)\n\n注意，在 PHP 5 中，sockets 扩展可能会为\
  \ `EINPROGRESS`、`EAGAIN` 和 `EWOULDBLOCK` errno 值记录警告。可以通过以下方式关闭日志：\n\n```php\nerror_reporting(E_ALL\
  \ & ~E_WARNING);\n```\n\n```php\n// 使用 Amp\\resolve() 转换为协程\n$promise = Amp\\resolve(queryStackOverflow(Dns\\\
  Record::NS));\nlist($ns, $type, $ttl) = // 我们只需要一个 NS 结果，而不是全部\n    current(yield\
  \ Amp\\timeout($promise, 2000 /* 毫秒 */));\necho \"The result of the fastest server\
  \ to reply to our query was $ns\";\n\n} catch (Amp\\TimeoutException $e) {\n   \
  \ echo \"We've heard no answer for 2 seconds! Bye!\";\n\n} catch (Dns\\NoRecordException\
  \ $e) {\n    echo \"No NS records there? Stupid DNS nameserver!\";\n});\n```\n\n\
  ## 第 71 章：如何检测客户端 IP 地址\n\n#### 第 71.1 节：HTTP_X_FORWARDED_FOR 的正确用法\n\n鉴于最新的 [httpoxy](https://httpoxy.org/)\
  \ 漏洞，还有一个变量被广泛滥用。\n\n`HTTP_X_FORWARDED_FOR` 常用于检测客户端 IP 地址，但如果不进行任何额外检查，这可能会导致安全问题，特别是当该\
  \ IP 稍后用于身份验证或在未经清理的情况下用于 SQL 查询时。\n\n大多数可用的代码示例都忽略了这样一个事实：`HTTP_X_FORWARDED_FOR`\
  \ 实际上可以被视为客户端自身提供的信息，因此它不是检测客户端 IP 地址的可靠来源。一些示例确实添加了关于可能滥用的警告，但代码本身仍然缺乏任何额外的检查。\n\
  \n因此，这里提供了一个用 PHP 编写的函数示例，说明如何检测客户端 IP 地址，前提是你知道客户端可能位于代理后面，并且你知道该代理是可信的。如果你不知道任何可信代理，可以直接使用\
  \ `$_SERVER['REMOTE_ADDR']`。\n\n```php\nfunction getClientIp(array $trustedProxies\
  \ = []) {\n    $ip = $_SERVER['REMOTE_ADDR'];\n    if (in_array($ip, $trustedProxies))\
  \ {\n        $forwarded = $_SERVER['HTTP_X_FORWARDED_FOR'] ?? '';\n        $ips\
  \ = array_map('trim', explode(',', $forwarded));\n        $ip = array_shift($ips);\n\
  \    }\n    return $ip;\n}\n```\n\n## 第 72 章：在 PHP 中创建 PDF 文件\n\n#### 第 72.1 节：PDFlib\
  \ 入门\n\n此代码要求你使用 [PDFlib 库](http://php.net/manual/en/ref.pdf.php) 才能正常运行。\n\n```php\n\
  $p = new PDFlib();\nif ($p->begin_document(\"\", \"\") == 0) {\n    die(\"Error:\
  \ \" . $p->get_errmsg());\n}\n$p->set_info(\"Creator\", \"hello.php\");\n$p->set_info(\"\
  Author\", \"Rainer Schaaf\");\n$p->set_info(\"Title\", \"Hello world (PHP)!\");\n\
  $p->begin_page_ext(595, 842, \"\");\n$font = $p->load_font(\"Helvetica-Bold\", \"\
  unicode\", \"\");\n$p->setfont($font, 24.0);\n$p->set_text_pos(50, 700);\n$p->show(\"\
  Hello world!\");\n$p->continue_text(\"says PHP\");\n$p->end_page_ext(\"\");\n$p->end_document(\"\
  \");\n$buf = $p->get_buffer();\n$len = strlen($buf);\nheader(\"Content-type: application/pdf\"\
  );\nheader(\"Content-Length: $len\");\nheader(\"Content-Disposition: inline; filename=hello.pdf\"\
  );\necho $buf;\n$p = 0;\n```\n\n## 第 73 章：PHP 中的 YAML\n\n#### 第 73.1 节：安装 YAML 扩展\n\
  \nYAML 不随标准 PHP 安装提供，而是需要作为 PECL 扩展安装。在 linux/unix 上，可以通过简单的命令安装：\n\n```bash\npecl\
  \ install yaml\n```\n\n```text\nlibyaml-devel\n```\n\n请注意，系统上必须安装 `libyaml-devel`\
