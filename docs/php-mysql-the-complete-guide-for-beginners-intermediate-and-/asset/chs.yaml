  ```\n$formatedLastDay = $lastDay->format('Y-m-d'); // 此方法格式化 DateTime 对象并返回一个字符串\n\
  echo \"Samara says: Seven Days. You'll be happy on $formatedLastDay.\";\n```\n\n\
