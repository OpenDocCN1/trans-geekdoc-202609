  ```\n\n在 PHP 5.4 中，我们获得了在实例化时进行类成员访问的能力，这允许我们将 `DateTime` 代码变为单行：\n\n```php\n$new_date_format\
  \ = (new DateTime('2008-07-01T22:35:17.02'))->format('Y-m-d H:i:s');\n```\n\n遗憾的是，这目前尚不适用于\
  \ `DateTime::createFromFormat`。\n\n#### 第 18.3 节：将英语日期描述解析为日期格式\n\n\n\n# 使用 `strtotime()`\
  \ 和 `date()` 函数组合\n\n使用 `date()` 函数可以解析不同的英文文本描述为日期：\n\n```php\n// Gets the current\
  \ date\necho date(\"m/d/Y\", strtotime(\"now\")), \"\\n\";\n// prints the current\
  \ date\necho date(\"m/d/Y\", strtotime(\"10 September 2000\")), \"\\n\";\n// prints\
  \ September 10, 2000 in the m/d/Y format\necho date(\"m/d/Y\", strtotime(\"-1 day\"\
  )), \"\\n\";\n// prints yesterday's date\necho date(\"m/d/Y\", strtotime(\"+1 week\"\
  )), \"\\n\";\n// prints the result of the current date + a week\necho date(\"m/d/Y\"\
  , strtotime(\"+1 week 2 days 4 hours 2 seconds\")), \"\\n\";\n// same as the last\
  \ example but with extra days, hours, and seconds added to it\necho date(\"m/d/Y\"\
  , strtotime(\"next Thursday\")), \"\\n\";\n// prints next Thursday's date\necho\
  \ date(\"m/d/Y\", strtotime(\"last Monday\")), \"\\n\";\n// prints last Monday's\
  \ date\necho date(\"m/d/Y\", strtotime(\"First day of next month\")), \"\\n\";\n\
  // prints date of first day of next month\necho date(\"m/d/Y\", strtotime(\"Last\
  \ day of next month\")), \"\\n\";\n// prints date of last day of next month\necho\
  \ date(\"m/d/Y\", strtotime(\"First day of last month\")), \"\\n\";\n// prints date\
  \ of first day of last month\necho date(\"m/d/Y\", strtotime(\"Last day of last\
  \ month\")), \"\\n\";\n// prints date of last day of last month\n```\n\n# Section\
