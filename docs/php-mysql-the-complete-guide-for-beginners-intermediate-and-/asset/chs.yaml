  ## 第 54 章：闭包\n\n#### 第 54.1 节：闭包的基本用法\n\n闭包是 PHP 中匿名函数的等价物，即没有名称的函数。即使从技术上讲这并不完全正确，但闭包的行为与函数保持一致，只是增加了一些额外功能。\n\
