  \n## 第 84 章：BC Math（二进制计算器）\n\n| 函数 | 说明 | 参数 |\n| --- | --- | --- |\n| `bcadd`\
  \ | 将两个任意精度数字相加。 | `left_operand` (string)：左操作数。<br>`right_operand` (string)：右操作数。<br>`scale`\
  \ (int, 可选)：结果中小数点后的位数。 |\n| `bccomp` | 比较两个任意精度数字。 | `left_operand` (string)：左操作数。<br>`right_operand`\
  \ (string)：右操作数。<br>`scale` (int, 可选)：比较中使用的小数点后位数。 |\n| `bcdiv` | 将两个任意精度数字相除。\
  \ | `left_operand` (string)：左操作数。<br>`right_operand` (string)：右操作数。<br>`scale` (int,\
  \ 可选)：结果中小数点后的位数。 |\n| `bcmod` | 获取任意精度数字的模数。 | `left_operand` (string)：左操作数。<br>`modulus`\
  \ (string)：模数。 |\n| `bcmul` | 将两个任意精度数字相乘。 | `left_operand` (string)：左操作数。<br>`right_operand`\
  \ (string)：右操作数。<br>`scale` (int, 可选)：结果中小数点后的位数。 |\n\n\n\n\n# BCMath 函数参考\n\n##\
  \ 函数参数\n\n### `bcpow`\n将任意精度数字提升到另一个数字的幂。\n\n| 参数 | 描述 |\n| --- | --- |\n| `left_operand`\
  \ | 左操作数，以字符串形式表示。 |\n| `right_operand` | 右操作数，以字符串形式表示。 |\n| `scale` | 可选参数，用于设置结果中小数点后的位数。\
  \ |\n\n### `bcpowmod`\n将任意精度数字提升到另一个数字的幂，并按指定模数取模。\n\n| 参数 | 描述 |\n| --- | --- |\n\
  | `left_operand` | 左操作数，以字符串形式表示。 |\n| `right_operand` | 右操作数，以字符串形式表示。 |\n| `modulus`\
  \ | 模数，以字符串形式表示。 |\n| `scale` | 可选参数，用于设置结果中小数点后的位数。 |\n\n### `bcscale`\n为所有 BC\
  \ 数学函数设置默认的 scale 参数。\n\n| 参数 | 描述 |\n| --- | --- |\n| `scale` | 比例因子。 |\n\n###\
  \ `bcsqrt`\n获取任意精度数字的平方根。\n\n| 参数 | 描述 |\n| --- | --- |\n| `operand` | 操作数，以字符串形式表示。\
  \ |\n| `scale` | 可选参数，用于设置结果中小数点后的位数。 |\n\n### `bcsub`\n从一个任意精度数字中减去另一个。\n\n| 参数\
  \ | 描述 |\n| --- | --- |\n| `left_operand` | 左操作数，以字符串形式表示。 |\n| `right_operand`\
  \ | 右操作数，以字符串形式表示。 |\n| `scale` | 可选参数，用于设置结果中小数点后的位数。 |\n\n## 概述\n二进制计算器可用于计算任意大小和精度的数字，精度高达\
  \ 2147483647-1 位小数，以字符串格式表示。二进制计算器比 PHP 的浮点数计算更精确。\n\n#### 第 84.1 节：在 32 位系统上使用\
  \ bcmath 读/写二进制长整型\n\n在 32 位系统上，大于 `0x7FFFFFFF` 的整数无法以原始方式存储，而介于 `0x0000000080000000`\
  \ 和 `0x7FFFFFFFFFFFFFFF` 之间的整数可以在 64 位系统上以原始方式存储（有符号长长整型），但不能在 32 位系统上存储。然而，由于 64\
  \ 位系统和许多其他语言支持存储有符号长长整型，有时有必要按精确值存储此范围的整数。有几种方法可以做到这一点，例如创建一个包含两个数字的数组，或将整数转换为其十进制人类可读形式。这有几个优点，例如方便向用户展示，以及能够直接使用\
  \ bcmath 对其进行操作。\n\n[`pack`](https://php.net/pack) / [`unpack`](https://php.net/unpack)\
  \ 方法可用于在数字的二进制字节和十进制形式（均为字符串类型，但一个是二进制，一个是 ASCII）之间转换，但它们在 32 位系统上总会尝试将 ASCII 字符串转换为\
  \ 32 位整数。以下代码片段提供了一种替代方案：\n\n```php\n/** 64 位系统使用 pack(\"J\") 或 pack(\"p\") */\n\
  function writeLong(string $ascii): string {\n    if (bccomp($ascii, \"0\") === -1)\
  \ { // if $ascii < 0\n        // 18446744073709551616 等于 (1 << 64)\n        // 记得加上引号，否则该数字会被解析为浮点数字面量\n\
  \        $ascii = bcadd($ascii, \"18446744073709551616\");\n    }\n    // \"n\"\
  \ 是大端序 16 位无符号短整型。小端序使用 \"v\"。\n    return pack(\"n\", bcmod(bcdiv($ascii, \"281474976710656\"\
  ), \"65536\")) .\n           pack(\"n\", bcmod(bcdiv($ascii, \"4294967296\"), \"\
  65536\")) .\n           pack(\"n\", bcdiv($ascii, \"65536\"), \"65536\")) .\n  \
  \         pack(\"n\", bcmod($ascii, \"65536\"));\n}\n\nfunction readLong(string\
  \ $binary): string {\n    $result = \"0\";\n    $result = bcadd($result, unpack(\"\
  n\", substr($binary, 0, 2)));\n    $result = bcmul($result, \"65536\");\n    $result\
  \ = bcadd($result, unpack(\"n\", substr($binary, 2, 2)));\n    $result = bcmul($result,\
  \ \"65536\");\n    $result = bcadd($result, unpack(\"n\", substr($binary, 4, 2)));\n\
  \    $result = bcmul($result, \"65536\");\n    $result = bcadd($result, unpack(\"\
  n\", substr($binary, 6, 2)));\n    // if $binary is a signed long long\n    // 9223372036854775808\
  \ 等于 (1 << 63) （注意该表达式甚至在 64 位系统上也无法工作）\n    if (bccomp($result, \"9223372036854775808\"\
  ) !== -1) { // if $result >= 9223372036854775807\n        $result = bcsub($result,\
  \ \"18446744073709551616\"); // $result -= (1 << 64)\n    }\n    return $result;\n\
  }\n```\n\n#### 第 84.2 节：BCMath 与浮点数算术运算的比较\n\n### `bcadd` 对比 float+float\n```php\n\
  var_dump('10' + '-9.99');         // float(0.0099999999999998)\nvar_dump(10 + -9.99);\
  \             // float(0.0099999999999998)\nvar_dump(10.00 + -9.99);          //\
  \ float(0.0099999999999998)\nvar_dump(bcadd('10', '-9.99', 20)); // string(22) \"\
  0.01000000000000000000\"\n```\n\n### `bcsub` 对比 float-float\n```php\nvar_dump('10'\
  \ - '9.99');         // float(0.0099999999999998)\nvar_dump(10 - 9.99);        \
  \     // float(0.0099999999999998)\nvar_dump(10.00 - 9.99);          // float(0.0099999999999998)\n\
  var_dump(bcsub('10', '9.99', 20)); // string(22) \"0.01000000000000000000\"\n```\n\
  \n### `bcmul` 对比 int*int\n```php\nvar_dump('5.00' * '2.00');       // float(10)\n\
  var_dump(5.00 * 2.00);           // float(10)\nvar_dump(bcmul('5.0', '2', 20));\
  \   // string(4) \"10.0\"\nvar_dump(bcmul('5.000', '2.00', 20)); // string(8) \"\
  10.00000\"\nvar_dump(bcmul('5', '2', 20));     // string(2) \"10\"\n```\n\n### `bcmul`\
  \ 对比 float*float\n```php\nvar_dump('1.6767676767' * '1.6767676767'); // float(2.8115498416259)\n\
  var_dump(1.6767676767 * 1.6767676767);     // float(2.8115498416259)\nvar_dump(bcmul('1.6767676767',\
  \ '1.6767676767', 20)); // string(22) \"2.81154984162591572289\"\n```\n\n### `bcdiv`\
  \ 对比 float/float\n```php\nvar_dump('10' / '3.01');         // float(3.3222591362126)\n\
  var_dump(10 / 3.01);             // float(3.3222591362126)\nvar_dump(10.00 / 3.01);\
  \          // float(3.3222591362126)\nvar_dump(bcdiv('10', '3.01', 20)); // string(22)\
  \ \"3.32225913621262458471\"\n```\n\n## 第 85 章：Docker 部署\n\n[Docker](http://www.docker.com/)\
  \ 是一种非常流行的容器解决方案，广泛用于在生产环境中部署代码。它使管理和扩展 Web 应用程序和微服务变得更加容易。\n\n#### 第 85.1 节：获取\
  \ PHP 的 docker 镜像\n\n为了在 docker 上部署应用程序，首先我们需要从注册表获取镜像。\n\n```bash\ndocker pull\
  \ php:7.0-apache\n```\n\n这将从官方 PHP 仓库获取最新版本的镜像。一般来说，PHP 通常用于部署 Web 应用程序，因此我们需要一个\
  \ HTTP 服务器来配合镜像。该镜像预装了 apache，使部署变得轻松无忧。\n\n#### 第 85.2 节：编写 Dockerfile\n\n`Dockerfile`\
  \ 用于配置我们将用 Web 应用程序代码构建的自定义镜像。在项目根文件夹中创建一个新文件 `Dockerfile`，然后放入以下内容：\n\n```dockerfile\n\
  FROM php:7.0-apache\nCOPY php.ini /usr/local/etc/php/\nCOPY . /var/www/html/\nEXPOSE\
  \ 80\n```\n\n第一行非常直观，用于描述构建新镜像时应使用哪个基础镜像。该行也可以更改为注册表中的任何其他特定 PHP 版本。\n\n第二行只是将 `php.ini`\
  \ 文件上传到我们的镜像中。你可以随时将该文件更改为其他自定义文件位置。\n\n第三行会将当前目录中的代码复制到 `/var/www/html/`，这是我们的网站根目录。请记住镜像内部的\
  \ `/var/www/html/`。\n\n最后一行只会在 docker 容器内打开 80 端口。\n\n### 忽略文件\n\n创建 `.dockerignore`\
  \ 文件以从构建上下文中排除文件。\n\n\n\n\n在某些情况下，可能会有一些你不想放到服务器上的文件，比如环境配置等。假设我们的环境配置在 `.env` 中。现在，为了忽略此文件，我们只需将其添加到代码库根文件夹下的\
  \ `.dockerignore` 中即可。\n\n## 第 85.3 芄：构建镜像\n\n构建镜像并非 PHP 特有，但为了构建上述描述的镜像，我们可以简单地使用：\n\
  \n```\ndocker build -t my-php-app .\n```\n\n镜像构建完成后，你可以使用以下命令进行验证：\n\n```\ndocker\
  \ images\n```\n\n这将列出你系统中安装的所有镜像。\n\n#### 第 85.4 节：启动应用容器\n\n镜像准备就绪后，我们可以启动并运行它。要从镜像创建容器，请使用：\n\
  \n```\ndocker run -p 80:80 -d my-php-app\n```\n\n| 参数 | 说明 |\n| --- | --- |\n| `-p\
  \ 80:80` | 将服务器的 80 端口转发到容器的 80 端口。 |\n| `-d` | 指示容器应作为后台任务运行。 |\n| `my-php-app`\
  \ | 指定用于构建容器的镜像。 |\n\n### 检查容器\n\n要检查正在运行的容器，只需使用：\n\n```\ndocker ps\n```\n\n这将列出\
  \ Docker 守护进程上所有正在运行的容器。\n\n### 应用日志\n\n日志对于调试应用程序至关重要。要查看日志，请使用：\n\n```\ndocker\
  \ logs <container_id>\n```\n\n## 第 86 章：APCu\n\nAPCu 是 PHP 的共享内存键值存储。内存由同一池的 PHP-FPM\
  \ 进程共享。存储的数据在请求之间持久化。\n\n#### 第 86.1 节：遍历条目\n\n[`APCUIterator`](http://php.net/manual/en/class.apcuiterator.php)\
  \ 允许遍历缓存中的条目：\n\n```php\n$iterator = new APCUIterator();\nforeach ($iterator as\
  \ $entry) {\n    // ...\n}\n```\n\n迭代器可以使用可选的正则表达式进行初始化，以仅选择键匹配的条目：\n\n```php\n\
  $iterator = new APCUIterator('/^user_/');\n```\n\n可以通过以下方式获取单个缓存条目的信息：\n\n```php\n\
  apcu_entry('key', function($key) {\n    return 'value';\n});\n```\n\n#### 第 86.2\
  \ 节：简单的存储与检索\n\n[`apcu_store`](http://php.net/manual/de/function.apcu-store.php)\
  \ 可用于存储，[`apcu_fetch`](http://php.net/manual/de/function.apcu-fetch.php) 用于检索值：\n\
  \n```php\napcu_store('key', 'value');\n$value = apcu_fetch('key');\n```\n\n####\
  \ 第 86.3 节：存储信息\n\n[`apcu_cache_info`](http://php.net/manual/en/function.apcu-cache-info.php)\
  \ 提供关于存储及其条目的信息：\n\n```php\n$info = apcu_cache_info();\nprint_r($info);\n```\n\n\
  ## 第 87 章：PHP 内置服务器\n\n| 选项 | 说明 |\n| --- | --- |\n| `-S` | 告诉 PHP 我们要启动一个 Web 服务器。\
  \ |\n| `<hostname>:<port>` | 要使用的主机名和端口。 |\n| `-t` | 公共目录（文档根目录）。 |\n| `<filename>`\
  \ | 路由脚本。 |\n\n了解如何使用内置服务器来开发和测试你的应用程序，而无需 XAMPP、WAMP 等其他工具。\n\n#### 第 87.1 节：运行内置服务器\n\
  \n```\nphp -S localhost:80\n```\n\n```\nPHP 7.1.7 Development Server started at\
  \ Fri Jul 14 15:11:05 2017\nListening on http://localhost:80\nDocument root is C:\\\
  projetos\\repgeral\nPress Ctrl-C to quit.\n```\n\n这是启动一个响应发送到 localhost 80 端口请求的\
  \ PHP 服务器的最简单方法。\n\n`-S` 表示我们正在启动一个 Web 服务器。\n\n`localhost:80` 指示我们要响应的主机和端口。你可以使用其他组合，如：\n\
  \n*   `mymachine:80` - 将在 mymachine 地址和 80 端口监听；\n*   `127.0.0.1:8080` - 将在 127.0.0.1\
  \ 地址和 8080 端口监听；\n\n#### 第 87.2 节：带有特定目录和路由脚本的内置服务器\n\n```\nphp -S localhost:80\
  \ -t project/public router.php\n```\n\n```\nPHP 7.1.7 Development Server started\
  \ at Fri Jul 14 15:22:25 2017\nListening on http://localhost:80\nDocument root is\
  \ /home/project/public\nPress Ctrl-C to quit.\n```\n\n# 第 88 章：PSR\n\n[PSR](http://www.php-fig.org/psr/)（PHP\
  \ 标准建议）是由 [FIG](http://www.php-fig.org/)（框架互操作小组）汇总的一系列建议。\n\n> “该小组的初衷是让项目代表们交流项目间的共性，并寻找合作方式”\
  \ - [FIG FAQ](http://www.php-fig.org/faqs/)\n\nPSR 可以处于以下状态：已接受、审查中、草案或已弃用。\n\n\
  ## 第 88.1 节：PSR-4：自动加载器\n\n[PSR-4](http://www.php-fig.org/psr/psr-4/) 是一项已接受的建议，概述了通过文件名自动加载类的标准。建议将其作为早期（现已弃用）[PSR-0](http://www.php-fig.org/psr/psr-0/)\
  \ 的替代方案。\n\n完全限定类名应符合以下结构：\n\n```\n\\<NamespaceName>(\\<SubNamespaceNames>)*\\<ClassName>\n\
  ```\n\n示例路径结构：\n\n```\npath/to/src/Alphabet/Google/AdWord/KeywordPlanner.php\n```\n\
  \n因此最终的类名将是 `Alphabet\\Google\\AdWord\\KeywordPlanner`。完全限定类名也应转化为有意义的文件路径，因此 `Alphabet\\\
  Google\\AdWord\\KeywordPlanner` 将位于 `path/to/src/Alphabet/Google/AdWord/KeywordPlanner.php`。\n\
  \n从 PHP 5.3.0 开始，可以定义一个[自定义自动加载函数](http://php.net/manual/en/function.spl-autoload-register.php)，根据你定义的路径和文件名模式来加载文件。\n\
  \n```php\n// 编辑你的 php 以包含类似内容：\nspl_autoload_register(function ($class) {\n    include\
  \ 'classes/' . $class . '.class.php';\n});\n```\n\n将位置（`'classes/'`）和文件扩展名（`'.class.php'`）替换为适用于你结构的值。\n\
  \nComposer 包管理器[支持 PSR-4](https://getcomposer.org/doc/01-basic-usage.md#autoloading)，这意味着，如果你遵循该标准，可以使用\
  \ Composer 的 vendor 自动加载器自动加载项目中的类。\n\n```json\n{\n    \"autoload\": {\n       \
  \ \"psr-4\": {\n            \"Alphabet\\\\Google\\\\AdWord\\\\\": \"src/\"\n   \
  \     }\n    }\n}\n```\n\n重新生成自动加载文件：\n\n```\ncomposer dump-autoload\n```\n\n现在在你的代码中可以执行以下操作：\n\
  \n```php\nrequire __DIR__ . '/vendor/autoload.php';\n$KeywordPlanner = new Alphabet\\\
  Google\\AdWord\\KeywordPlanner();\n```\n\n## 第 88.2 节：PSR-1：基本编码标准\n\n[PSR-1](http://www.php-fig.org/psr/psr-1/)\
  \ 是一项已接受的建议，概述了代码编写的基本标准建议。\n\n*   它规定了类、方法和常量的命名约定。\n*   它要求采用 PSR-0 或 PSR-4 建议。\n\
  *   它指明了要使用的 PHP 标签：`<?php` 和 `<?=`，但不包括 `<?`。\n*   它指定了要使用的文件编码（UTF-8）。\n*   它还规定文件要么声明新符号（类、函数、常量等）且不产生其他副作用，要么执行带有副作用的逻辑但不定义符号，但不能两者兼顾。\n\
  \n# 第 89 章：PHPDoc\n\n#### 第 89.1 节：描述变量\n\n| 标签 | 说明 |\n| --- | --- |\n| `@var`\
  \ | `@var` 关键字可用于描述变量的类型和用法。 |\n\n类型可以是内置 PHP 类型之一，或用户定义的类，包括命名空间。\n\n应包含变量名，但如果文档块仅适用于一项，则可以省略。\n\
  \n#### 第 89.2 节：为函数添加元数据\n\n函数级别的注解有助于 IDE 识别返回值或潜在的危险代码。\n\n```php\n/**\n * @return\
  \ int\n */\nfunction getInt() {\n    return 1;\n}\n```\n\n```php\n/**\n * @deprecated\
  \ 请改用 getInt()\n * @return mixed\n */\nfunction oldFunction() {\n    // ...\n}\n\
  ```\n\n#### 第 89.3 节：描述参数\n\n```php\n/**\n * @param string $name 用户的名称\n * @param\
  \ int $id 用户 ID\n */\nfunction setUser($name, $id) {\n    // ...\n}\n```\n\n```php\n\
  /**\n * @param array<string, int> $data 关联数据数组\n */\nfunction processData(array\
  \ $data) {\n    // ...\n}\n```\n\n#### 第 89.4 节：集合\n\n[PSR-5](https://github.com/php-fig/fig-standards/blob/211063eed7f4d9b4514b728d7b1810d9b3379dd1/proposed/phpdoc.md#collections)\
  \ 提出了一种泛型风格的集合表示法。\n\n### 泛型语法\n\n```php\n/**\n * @param array<int, string> $strings\n\
  \ */\nfunction foo(array $strings) {}\n```\n\n### 集合中的值甚至可以是另一个数组，甚至是另一个集合。\n\n\
  ```php\n/**\n * @param array<int, array<int, string>> $multiDimArray\n */\nfunction\
  \ bar(array $multiDimArray) {}\n```\n\n##### 示例\n\n```php\n/** @var array<int, string>\
  \ $strings */\n$strings = ['a', 'b'];\n\n/** @var array<string, int> $map */\n$map\
  \ = ['a' => 1, 'b' => 2];\n```\n\n```php\n/**\n * @return array<string, \\MyClass>\n\
  \ */\nfunction getObjects(): array {\n    return [];\n}\n```\n\n#### 第 89.5 节：为文件添加元数据\n\
  \n文件级别的元数据适用于文件内的所有代码，应放在文件顶部：\n\n```php\n<?php\n/**\n * @package MyPackage\n *\
  \ @author  John Doe <john@example.com>\n * @license MIT\n */\n```\n\n#### 第 89.6\
  \ 节：从父结构继承元数据\n\n`@inheritDoc` 标签可用于继承父级的 DocBlock。\n\n```php\nclass ParentClass\
  \ {\n    /**\n     * 执行某些操作。\n     * @return void\n     */\n    public function\
  \ doSomething() {}\n}\n\nclass ChildClass extends ParentClass {\n    /**\n     *\
  \ @inheritDoc\n     */\n    public function doSomething() {}\n}\n```\n\n\n\n\n|\
  \ @ inheritDoc |\n| --- |\n\n如果一个类继承自另一个类并将使用相同的元数据，提供它是使用相同文档的一种简单方法。如果多个类继承自一个基类，则只需更改基类即可影响子类。\n\
  \n![](img/Image01587.jpg)\n\n![](img/Image01588.jpg)\n\n## 第 90 章：设计模式\n\n本主题提供了在\
  \ PHP 中实现的知名设计模式示例。\n\n#### 第 90.1 节：PHP 中的方法链\n\n方法链是 [Martin Fowler 的书](http://rads.stackoverflow.com/amzn/click/0321712943)\
  \ [Domain Specific Languages](http://rads.stackoverflow.com/amzn/click/0321712943)\
  \ 中解释的一种技术。方法链总结如下：\n\n![](img/Image01589.jpg) [让修饰方法返回宿主对象，以便可以在单个表达式中调用多个修饰符](http://martinfowler.com/dslCatalog/methodChaining.html)。\n\
  \n请看这段非链式/常规代码（从上述书籍移植到 PHP）：\n\n![](img/Image01590.jpg)\n\n方法链将允许您以更紧凑的方式编写上述语句：\n\
  \n![](img/Image01591.jpg)\n\n| return $this |\n| --- |\n\n要使其工作，您只需在想要链式调用的方法中 `return\
  \ $this`：\n\n![](img/Image01592.jpg)\n\n### 何时使用\n\n利用方法链的主要用例是在构建内部领域特定语言时。方法链是\
  \ [Expression Builders](http://martinfowler.com/bliki/ExpressionBuilder.html)（表达式构建器）和\
  \ [Fluent Interfaces](http://martinfowler.com/bliki/FluentInterface.html)（流式接口）的基础构建块。[但它并不等同于它们](http://stackoverflow.com/a/17940086/208809)。方法链仅仅是启用了它们。引用\
  \ Fowler 的话：\n\n![](img/Image01593.jpg)\n\n![](img/Image01594.jpg) 我还注意到一个常见的误解——许多人似乎将流式接口等同于方法链。当然，链式调用是流式接口常用的技术，但真正的流畅性远不止于此。\n\
  \n话虽如此，仅为了避免书写宿主对象而使用方法链，被许多人视为一种 [code](http://martinfowler.com/bliki/CodeSmell.html)\
  \ [smell](http://martinfowler.com/bliki/CodeSmell.html)（代码异味）。它会导致不明显的 API，特别是在与非链式\
  \ API 混合使用时。\n\n### 附加说明\n\n#### 命令查询分离\n\n[命令查询分离是由 Bertrand Meyer 提出的设计原则](http://martinfowler.com/bliki/CommandQuerySeparation.html)。它规定：改变状态的方法（命令）不应返回任何内容，而返回内容的方法（查询）不应改变状态。这使得系统更易于推理。方法链违反了这一原则，因为我们在改变状态的同时返回了值。\n\
  \n#### Getter 方法\n\n当使用实现了方法链的类时，调用 getter 方法（即返回 `$this` 以外内容的方法）时要特别注意。由于 getter\
  \ 必须返回除 `$this` 以外的值，因此在 getter 后链式调用额外的方法会使该调用作用于获取到的值，而不是原始对象。虽然链式 getter 有一些用例，但它们可能会降低代码的可读性。\n\
  \n#### 迪米特法则及对测试的影响\n\n如上所述的方法链不违反 [迪米特法则](https://en.wikipedia.org/wiki/Law_of_Demeter)。也不影响测试。这是因为我们返回的是宿主实例，而不是某个协作者。这是一个常见的误解，源于人们将单纯的方法链与流式接口和表达式构建器混淆。只有当方法链返回除宿主对象以外的其他对象时，才会违反迪米特法则，并导致测试中出现大量\
  \ Mock 对象。\n\n# 第 91 章：编译 PHP 扩展\n\n## 第 91.1 节：在 Linux 上编译\n\n要在典型的 Linux 环境中编译\
  \ PHP 扩展，需要满足一些先决条件：\n\n*   基本的 Unix 技能（能够操作 `make` 和 C 编译器）\n*   ANSI C 编译器\n*\
  \   您想要编译的 PHP 扩展的源代码\n\n通常有两种编译 PHP 扩展的方法。您可以将扩展静态编译到 PHP 二进制文件中，或者将其编译为由 PHP 二进制文件在启动时加载的共享模块。共享模块更常见，因为它们允许您在不重新构建整个\
  \ PHP 二进制文件的情况下添加或删除扩展。本示例侧重于共享模块选项。\n\n```\napt-get install php5-dev or php7-dev\n\
  ```\n\n如果您通过包管理器安装了 PHP（apt, yum install 等），您将需要安装 PHP 的开发包，其中将包含构建环境所需的 PHP 头文件和\
  \ `phpize` 脚本。该包可能命名为 `php5-dev` 之类，但请务必使用您的包管理器搜索您发行版仓库中合适的名称。它们可能有所不同。\n\n```\n\
  /usr/include\n```\n\n如果您从源代码构建了 PHP，则头文件很可能已经存在于您的系统上（通常在 `/usr/include` 或 `/usr/local/include`）。\n\
  \n### 编译步骤\n\n在检查确认您具备编译所需的所有先决条件后，您可以前往 [pecl.php.net](http://pecl.php.net/)，选择您想要编译的扩展，并下载压缩包。\n\
  \n```\ntar xfvz yaml-2.0.0RC8.tgz\n```\n\n1.  解压压缩包（例如 `tar xfvz yaml-2.0.0RC8.tgz`）\n\
  2.  进入解压后的目录并运行 `phpize`\n3.  如果一切顺利，您现在应该会看到一个新创建的 `configure` 脚本，运行它 `./configure`\n\
  4.  现在您需要运行 `make`，这将编译扩展\n5.  最后，`make install` 会将编译好的扩展二进制文件复制到您的扩展目录中\n\n```\n\
  /usr/lib/, 例如它可能类似于 /usr/lib/php5/20131226/yaml.so\n```\n\n```\n--with-prefix\n\
  ```\n\n`make install` 步骤通常会为您提供扩展被复制到的安装路径。这通常在 `/usr/lib/` 中。但这取决于您的 PHP 配置（即 `--with-prefix`）和特定的\
  \ API 版本。API 编号包含在路径中，以将为不同 API 版本构建的扩展保存在单独的位置。\n\n### 在 PHP 中加载扩展\n\n```\nextension=yaml.so\n\
  ```\n\n要在 PHP 中加载扩展，请找到适用于相应 SAPI 的已加载 `php.ini` 文件，并添加行 `extension=yaml.so`（当然，请将\
  \ `yaml.so` 更改为您实际安装的扩展名称）。\n\n对于 Zend 扩展，您确实需要提供共享对象文件的完整路径。但是，对于普通的 PHP 扩展，此路径源自您加载的配置中的\
  \ `extension_dir` 指令，或初始设置期间的 `$PATH` 环境变量。\n\n## 第 92 章：常见错误\n\n## 第 92.1 节：在布尔值上调用\
  \ fetch_assoc\n\n如果您遇到如下错误：\n\n![](img/Image01596.jpg) Fatal error: Call to a member\
  \ function `fetch_assoc()` on boolean in `C:\\xampp\\htdocs\\stack\\index.php` on\
  \ line 7\n\n![](img/Image01597.jpg) 其他变体包括类似：`mysql_fetch_assoc()` expects parameter\
  \ 1 to be resource, boolean given ...\n\n这些错误意味着您的查询（这是一个 PHP/MySQL 错误）或您的引用出了问题。上述错误由以下代码产生：\n\
  \n![](img/Image01598.jpg)\n\n为了“修复”此错误，建议让 mysql 抛出异常：\n\n![](img/Image01599.jpg)\n\
  \n这将抛出一个异常，并显示更有帮助的消息：\n\n\n\n\n# 第 92 章：SQL 和解析错误\n\n## 第 92.1 节：SQL 语法错误\n\n![](img/Image01600.jpg)\n\
  \n您的 SQL 语法有误；请查阅与您的 MariaDB 服务器版本对应的手册，以获取在 `'SELCT * FROM db'` 附近第 1 行处使用的正确语法。\n\
  \n另一个会产生类似错误的示例是您只是向 `mysql_fetch_assoc()` 函数或类似函数提供了错误的信息：\n\n![](img/Image01601.jpg)\n\
  \n## 第 92.2 节：Unexpected $end（意外的文件结束）\n\n![](img/Image01602.jpg)\n\n解析错误：语法错误，在\
