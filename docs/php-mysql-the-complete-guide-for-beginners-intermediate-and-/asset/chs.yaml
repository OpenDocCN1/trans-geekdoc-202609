  \n![](img/Image00959.jpg)\n\n## 第 42 章：魔术方法\n\n#### 第 42.1 节：`__call()` 和 `__callStatic()`\n\
  \n| `__call()` | | `__callStatic()` |\n| --- | --- | --- |\n\n当在对象上下文或静态上下文中调用不存在的对象方法时，会被调用。\n\
