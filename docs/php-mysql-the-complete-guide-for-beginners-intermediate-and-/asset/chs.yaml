  *   [设置信封发件人地址](http://stackoverflow.com/a/5666682/2417031)\n\n**替代邮件发送库**\n\n*\
  \   [PHPMailer](https://github.com/Synchro/PHPMailer)\n*   [SwiftMailer](http://swiftmailer.org/)\n\
  *   [PEAR::Mail](https://pear.php.net/package/Mail)\n\n**邮件服务器**\n\n*   [Mercury\
  \ Mail (Windows)](http://www.pmail.com/overviews/ovw_mercury.htm)\n\n**相关主题**\n\n\
  *   [Post/Redirect/Get](https://en.wikipedia.org/wiki/Post/Redirect/Get)\n\n####\
  \ 第 64.2 节：使用 mail() 发送 HTML 邮件\n\n![](img/Image01353.jpg)\n![](img/Image01354.jpg)\n\
  \n这与发送纯文本邮件差别不大。关键区别在于内容正文的结构类似于 HTML 文档，并且必须包含两个额外的标头，以便邮件客户端知道将邮件作为 HTML 渲染。它们是：\n\
  \n```\nMIME-Version: 1.0\nContent-Type: text/html; charset=UTF-8\n```\n\n#### 第\
  \ 64.3 节：使用 mail() 发送带附件的邮件\n\n![](img/Image01356.jpg)\n![](img/Image01357.jpg)\n\
  \n### Content-Transfer-Encodings（内容传输编码）\n\n可用的编码有 `7bit`、`8bit`、`binary`、`quoted-printable`、`base64`、`ietf-token`\
  \ 和 `x-token`。根据 RFC 2045 第 6.4 节所述，在这些编码中，当标头具有多部分 `Content-Type` 时，`Content-Transfer-Encoding`\
  \ 的值不得为 `7bit`、`8bit` 或 `binary` 以外的任何其他值。\n\n我们的示例为多部分标头选择了 `7bit` 编码，它代表 US-ASCII\
  \ 字符，因为正如 RFC 2045 第 6 节所述，某些协议仅支持此编码。边界内的数据随后可以按部分进行编码（RFC 2046，第 5.1 节）。本示例正是如此。第一部分包含\
  \ `text/plain` 消息，被定义为 `8bit`，因为可能需要支持额外的字符。在这种情况下，使用的是 Latin1 (`iso-8859-1`) 字符集。第二部分是附件，因此被定义为\
  \ `base64` 编码的 `application/octet-stream`。由于 `base64` 将任意数据转换为 `7bit` 范围，因此它可以通过受限传输发送（RFC\
  \ 2045，第 6.2 节）。\n\n#### 第 64.4 节：使用 PHPMailer 发送纯文本邮件\n\n### 基础文本邮件\n\n![](img/Image01358.jpg)\n\
