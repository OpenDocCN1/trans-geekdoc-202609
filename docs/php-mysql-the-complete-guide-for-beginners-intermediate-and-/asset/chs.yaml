  \n![](img/Image00715.jpg)\n\n可用 `as` 关键字自定义别名解决：\n\n![](img/Image00716.jpg)\n\n\
  引用当前命名空间外的类需用 `\\` 转义，否则会假定为相对于当前命名空间的相对路径：\n\n![](img/Image00717.jpg)\n\n## 27.3\
  \ 节：声明子命名空间\n\n声明具有层级的单个命名空间示例：\n\n![](img/Image00718.jpg)\n\n![](img/Image00719.jpg)\n\
  \n上例创建了：\n\n常量 `MyProject\\Sub\\Level\\CONNECT_OK`、类 `MyProject\\Sub\\Level\\Connection`\
  \ 和函数 `MyProject\\Sub\\Level\\connect`。\n\n## 27.4 节：什么是命名空间？\n\nPHP 社区开发者众多，代码量巨大。这意味着某库的\
  \ PHP 代码可能与另一库使用相同的类名。当两个库在同一命名空间下使用时，会发生冲突并导致问题。\n\n命名空间解决了此问题。正如 PHP 参考手册所述，命名空间可类比为操作系统目录对文件的命名空间划分；同名文件可共存于不同目录。同理，同名\
  \ PHP 类可共存于不同 PHP 命名空间。\n\n为代码添加命名空间至关重要，这样其他开发者使用时无需担心与其他库冲突。\n\n## 第 28 章：会话\n\
  \n## 28.1 节：`session_start()` 选项\n\n| [ph](http://php.net/manual/en/ini.list.php)\
  \ [p](http://php.net/manual/en/ini.list.php) | [.](http://php.net/manual/en/ini.list.php)\
  \ | [in](http://php.net/manual/en/ini.list.php) [i](http://php.net/manual/en/ini.list.php)\
  \ |\n| --- | --- | --- |\n\nPHP 7 起，可向 `session_start` 函数传递包含[基于会话的](http://php.net/manual/en/ini.list.php)[选项](http://php.net/manual/en/ini.list.php)的数组。\n\
  \n示例\n\n![](img/Image00720.jpg)\n\n| `php` | `.` | `ini` | `setting named` | `session`\
  \ | `.` | `lazy_write` |\n| --- | --- | --- | --- | --- | --- | --- |\n\n此特性还引入了\
  \ `session.lazy_write`，默认为 `true`，表示仅在会话数据变更时才重写。\n\n参考：[`wiki.php.net/rfc/session-lock-ini`](https://wiki.php.net/rfc/session-lock-ini)\n\
  \n## 28.2 节：会话锁定\n\n| `session_start` |\n| --- |\n\n| `session_start` |\n| --- |\n\
  \n众所周知，PHP 将会话数据写入服务端文件。当请求调用 `session_start()` 的 PHP 脚本时，PHP 会锁定该会话文件，导致相同 `session_id`\
  \ 的其他传入请求阻塞/等待，直到会话文件锁释放。\n\n会话文件保持锁定直到脚本结束或手动关闭会话。为避免多请求阻塞，可启动会话后关闭会话，释放文件锁，允许后续请求继续。\n\
  \n![](img/Image00721.jpg)\n\n即使会话关闭，仍可读取会话值，因会话数据仍可用。\n\n![](img/Image00722.jpg)\n\
  \nPHP >= 7.0 支持 `read_only`、`read_write` 和 `lazy_write` 会话，可能无需使用 `session_write_close()`。\n\
  \n## 28.3 节：操作会话数据\n\n`$_SESSION` 变量是数组，可像普通数组一样检索或操作。\n\n![](img/Image00723.jpg)\n\
  \n更多数组操作参考“操作数组”。\n\n注意：若在会话中存储对象，仅当有类自动加载器或类已加载时才能优雅恢复。否则对象会作为 `__PHP_Incomplete_Class`\
  \ 类型返回，可能导致[崩溃](http://stackoverflow.com/q/1055728/3990767)。自动加载详见“命名空间与自动加载”。\n\
  \n警告：\n\n会话数据可能被劫持。详见：《Pro PHP Security: From Application Security Principles to\
  \ the Implementation of XSS Defense - Chapter 7: Preventing Session Hijacking》（https://books.google.com.au/books?id=EUc6NlZRDqcC&pg=PA97#v=onepage&q&f=false）\n\
  \n强烈建议切勿在 `$_SESSION` 中存储任何个人信息。最关键的是信用卡号、政府颁发的 ID、密码；也包括姓名、邮箱、电话等不太敏感但可让黑客冒充/攻破合法用户的数据。通用原则：会话数据仅使用无价值/非个人值，如数字标识符。\n\
  \n## 28.4 节：销毁整个会话\n\n| [`session_destroy`](http://php.net/session_destroy) |\n\
  | --- |\n\n若需销毁会话，可用 `session_destroy()`：\n\n![](img/Image00724.jpg)\n\n![](img/Image00725.jpg)\n\
  \n| `session_destroy()` | 与 `$_SESSION = array();` 不同 |\n| --- | --- |\n\n`session_destroy()`\
  \ 会移除 SESSION 超全局变量中所有存储的值，但不会销毁实际存储的会话版本。\n\n| `$_SESSION = array();` | 代替 `session_unset()`\
  \ |\n| --- | --- |\n\n注意：用 `$_SESSION = array();` 是因[手册](http://php.net/session_destroy)规定：\n\
  \n![](img/Image00726.jpg) 仅在不使用 `$_SESSION` 的旧弃用代码中使用 `session_unset()`。\n\n## 28.5\
  \ 节：无错误的安全会话启动\n\n\n\n许多开发者在处理大型项目时会遇到这个问题，特别是当他们在某些模块化 CMS 的插件、附加组件、组件等上工作时。这里提供了一种安全启动会话的解决方案：首先检查\
  \ PHP 版本以覆盖所有版本，然后检查会话是否已启动。如果会话不存在，则安全地启动会话。如果会话已存在，则不执行任何操作。\n\n![](img/Image00727.jpg)\n\
  \n#### 第 28.6 节：会话名称\n\n### 检查会话 Cookie 是否已创建\n\n会话名称是用于存储会话的 Cookie 的名称。你可以用它来检测是否已为用户创建了会话的\
  \ Cookie：\n\n![](img/Image00728.jpg)\n\n请注意，除非你真的不想不必要地创建 Cookie，否则这种方法通常没有用处。\n\
  \n### 更改会话名称\n\n| `session_name` |\n| --- |\n\n你可以通过调用 `session_name()` 来更新会话名称。\n\
  \n![](img/Image00729.jpg)\n\n| `session_name` |\n| --- |\n\n如果 `session_name()`\
  \ 未提供参数，则返回当前的会话名称。\n\n![](img/Image00730.jpg)\n\n它应仅包含字母数字字符；应简短且具有描述性（即针对启用了 Cookie\
  \ 警告的用户）。会话名称不能仅由数字组成，至少必须包含一个字母。否则，每次都会生成一个新的会话 ID。\n\n## 第 29 章：Cookies\n\n#####\
  \ 参数详情\n\nCookie 的名称。这也是你可以用来从 `$_COOKIE` 超全局变量中检索值的键。这是唯一的必需参数。\n\n| name | value\
  \ | expire | path | domain | secure | httponly |\n| --- | --- | --- | --- | ---\
  \ | --- | --- |\n| Cookie 的名称。这也是你可以用来从 `$_COOKIE` 超全局变量中检索值的键。这是唯一的必需参数。 | 存储在\
  \ Cookie 中的值。此数据可被浏览器访问，因此请勿在此存储任何敏感信息。 | 一个 Unix 时间戳，表示 Cookie 何时过期。如果设置为零，Cookie\
  \ 将在会话结束时过期。如果设置为小于当前 Unix 时间戳的数字，Cookie 将立即过期。 | Cookie 的作用域。如果设置为 `/`，Cookie 将在整个域名下可用。如果设置为\
  \ `/path/`，则 Cookie 仅在该路径及其子路径下可用。默认为设置 Cookie 的文件的当前路径。 | Cookie 可用的域名或子域名。如果设置为裸域名，则\
  \ Cookie 将在该域名及所有子域名下可用。如果设置为子域名，则 Cookie 仅在该子域名及其所有子子域名下可用。 | 当设置为 `TRUE` 时，仅当客户端和服务器之间存在安全的\
  \ HTTPS 连接时才会设置 Cookie。 | 指定 Cookie 仅应通过 HTTP/S 协议提供，不应提供给 JavaScript 等客户端脚本语言。仅在\
  \ PHP 5.2 或更高版本中可用。 |\n\nHTTP Cookie 是网站发送的一小段数据，当用户浏览网页时，由用户的 Web 浏览器存储在用户的计算机上。\n\
  \n#### 第 29.1 节：修改 Cookie\n\n可以通过重置 Cookie 来修改其值。\n\n![](img/Image00731.jpg)\n\n\
  #### 第 29.2 节：设置 Cookie\n\n| `setcookie` |\n| --- |\n\n使用 `setcookie()` 函数设置 Cookie。由于\
  \ Cookie 是 HTTP 头部的一部分，你必须在向浏览器发送任何输出之前设置 Cookie。\n\n![](img/Image00732.jpg)\n\n\
  示例：`setcookie(\"user\", \"Tom\", time() + 86400, \"/\");` // 检查函数参数的语法\n\n说明：\n\n\
  ![](img/Image00733.jpg)\n\n创建一个名为 `user` 的 Cookie\n\n（可选）Cookie 的值为 `Tom`\n\n（可选）Cookie\
  \ 将在 1 天后过期（86400 秒）\n\n（可选）Cookie 在整个网站 `/` 可用\n\n（可选）Cookie 仅通过 HTTPS 发送\n\n（可选）Cookie\
  \ 不可被 JavaScript 等脚本语言访问\n\n创建或修改的 Cookie 只能在后续请求中访问（路径和域名匹配时），因为超全局变量 `$_COOKIE`\
  \ 不会立即填充新数据。\n\n#### 第 29.3 节：检查 Cookie 是否已设置\n\n| `isset` |\n| --- |\n\n对超全局变量\
