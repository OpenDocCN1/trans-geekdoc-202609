  \ `@` 来处理 Unix 时间戳：\n\n如果你拥有的时间戳是以毫秒为单位的（可能以 000 结尾和/或时间戳长度为 13 位），则需要在转换为其他格式之前将其转换为秒。有两种方法可以做到这一点：\n\
  \n**使用 `substr()` 截取最后三位数字**\n\n截取最后三位数字可以通过多种方式实现，但使用 `substr()` 是最简单的：\n\n你也可以通过除以\
  \ 1000 将时间戳转换为秒。由于时间戳太大，32 位系统无法对其进行数学运算，因此你需要使用 [BCMath](http://php.net/manual/en/book.bc.php)\
  \ 库以字符串形式进行数学运算：\n\n要获取 Unix 时间戳，可以使用 `strtotime()`，它返回一个 Unix 时间戳：\n\n使用 `DateTime()`\
  \ 时，可以使用 `DateTime::getTimestamp()`：\n\n如果你运行的是 PHP 5.2，可以改用 `U` 格式化选项：\n\n### 处理非标准和模棱两可的日期格式\n\
  \n不幸的是，开发人员必须处理的并非所有日期都采用标准格式。幸运的是，PHP 5.3 为我们提供了解决方案。`DateTime::createFromFormat()`\
  \ 允许我们告诉 PHP 日期字符串采用的格式，以便它能成功解析为 `DateTime` 对象以供进一步操作。\n\n```php\n$date = DateTime::createFromFormat('F-d-Y\
