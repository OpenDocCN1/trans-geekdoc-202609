  ![](img/Image01478.jpg)\n\n## 第 77 章：机器学习\n\n#### 第 77.1 节：使用 PHP-ML 进行分类\n\n机器学习中的分类问题是识别新观测值属于哪组类别的问题。分类属于监督式机器学习范畴。\n\
