  \n## Section 19.13: switch\n\n`switch` 结构的功能与一系列 `if` 语句相同，但可以用更少的代码行完成工作。`switch`\
  \ 语句中定义的待测试值将与每个 `case` 语句中的值进行相等比较，直到找到匹配项并执行该块中的代码。如果未找到匹配的 `case` 语句，则执行 `default`\
  \ 块中的代码（如果存在）。\n\n`case` 或 `default` 语句中的每个代码块都应以 `break` 语句结束。这将停止 `switch` 结构的执行，并继续执行其后的代码。如果省略\
  \ `break` 语句，则会执行下一个 `case` 语句的代码，即使没有匹配项。如果忘记 `break` 语句，这可能会导致意外的代码执行，但当多个 `case`\
  \ 语句需要共享相同代码时，这也很有用。\n\n![](img/Image00511.jpg)\n\n除了测试固定值外，该结构还可以通过向 `switch` 语句提供布尔值并向\
