  \n#### 第 73.2 节：使用 YAML 存储应用程序配置\n\n[YAML](http://www.yaml.org/) 提供了一种存储结构化数据的方式。数据可以是一组简单的名称-值对，也可以是值甚至为数组的复杂层级数据。\n\
  \n请考虑以下 YAML 文件：\n\n```yaml\ndatabase:\n  host: localhost\n  port: 3306\n  username:\
  \ root\n  password: secret\n  name: myapp\ndebug: true\npaths:\n  - /var/www\n \
  \ - /opt/app\n```\n\n```text\nconfig.yaml\n```\n\n假设它保存为 `config.yaml`。然后可以使用以下代码在\
  \ PHP 中读取此文件：\n\n```php\n$config = yaml_parse_file('config.yaml');\n```\n\n`print_r`\
  \ 将产生以下输出：\n\n```text\nArray\n(\n    [database] => Array\n        (\n          \
  \  [host] => localhost\n            [port] => 3306\n            [username] => root\n\
  \            [password] => secret\n            [name] => myapp\n        )\n    [debug]\
  \ => 1\n    [paths] => Array\n        (\n            [0] => /var/www\n         \
  \   [1] => /opt/app\n        )\n)\n```\n\n现在可以通过简单地使用数组元素来使用配置参数：\n\n```php\n$host\
  \ = $config['database']['host'];\n$port = $config['database']['port'];\n```\n\n\
  ## 第 74 章：使用 GD 进行图像处理\n\n#### 第 74.1 节：图像输出\n\n| [image](http://php.net/manual/en/function.imagepng.php#refsect1-function.imagepng-seealso)\
  \ |\n| --- |\n\n可以使用 [image*](http://php.net/manual/en/function.imagepng.php#refsect1-function.imagepng-seealso)\
  \ [函数](http://php.net/manual/en/function.imagepng.php#refsect1-function.imagepng-seealso)\
  \ 创建图像，其中 * 代表文件格式。\n\n它们具有通用的语法：\n\n```php\nimagepng($image, $to = null, $quality\
  \ = -1, $filters = -1);\n```\n\n### 保存到文件\n\n如果要将图像保存到文件，可以将文件名或打开的文件流作为 `$to` 传递。如果传递流，则无需关闭它，因为\
  \ GD 会自动关闭它。\n\n例如，保存 PNG 文件：\n\n```php\nimagepng($im, 'test.png');\n```\n\n使用 `fopen`\
  \ 时，请确保使用 `b` 标志而不是 `t` 标志，因为该文件是二进制输出。\n\n```php\nfopen(\"php://temp\", \"wb\"\
  , $f) or fopen(\"php://memory\", \"wb\", $f)\n```\n\n不要尝试将 `fopen(\"php://output\"\
  , \"wb\")` 传递给它。由于调用后函数会关闭流，你将无法进一步使用它，例如检索其内容。\n\n### 作为 HTTP 响应输出\n\n如果你想直接将此图像作为响应返回（例如创建动态徽章），则不需要传递任何内容（或传递\
  \ `null`）作为第二个参数。但是，在 HTTP 响应中，你需要指定内容类型：\n\n```php\nheader('Content-Type: image/png');\n\
  imagepng($im);\n```\n\n```text\nimage/png, image/gif\n```\n\n`$mimeType` 是你返回的格式的\
  \ MIME 类型。示例包括 `image/png` 和 `image/gif`。\n\n```text\nimage/jpeg\n```\n\n。\n\n###\
  \ 写入变量\n\n有两种方法可以写入变量。\n\n#### 使用 OB（输出缓冲）\n\n```php\nob_start();\nimagepng($im);\n\
  $png_data = ob_get_clean();\n```\n\n#### 使用流包装器\n\n你可能有很多理由不想使用输出缓冲。例如，你可能已经开启了\
  \ OB。因此，需要一种替代方案。\n\n使用 `stream_wrapper_register` 函数，可以注册一个新的流包装器。因此，你可以将流传递给图像输出函数，稍后再检索它。\n\
  \n```php\nclass GlobalStream {\n    public $varname;\n    public function stream_open($path,\
  \ $mode, $options, &$opened_path) {\n        $this->varname = parse_url($path, PHP_URL_HOST);\n\
  \        return true;\n    }\n    public function stream_write($data) {\n      \
  \  $GLOBALS[$this->varname] .= $data;\n        return strlen($data);\n    }\n  \
  \  public function stream_eof() { return true; }\n    public function stream_close()\
  \ { return true; }\n}\nstream_wrapper_register('global', 'GlobalStream');\n$png_data\
  \ = '';\nimagepng($im, 'global://png_data');\necho strlen($png_data);\n```\n\n在本例中，`GlobalStream`\
  \ 类将任何输入写入引用变量（即间接写入给定名称的全局变量）。稍后可以直接检索全局变量。\n\n有一些特别需要注意的事项：\n\n\n\n# 第 74 章：GD\
  \ 库\n\n## 第 74.1 节：流包装器\n\n![](img/Image01459.jpg)一个完全实现的流包装器类应如 [此处](http://php.net/manual/en/stream.streamwrapper.example-1.php)\
