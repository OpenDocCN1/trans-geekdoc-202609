  \n\n\n\n# PHP 变量与作用域\n\n##### 包含文件与全局变量的问题\n\n```php\ninclude 'file.php';\n```\n\
  \n由于几乎所有 PHP 程序都使用类似 `);` 的代码，随着文件数量的增加，维护此类代码的难度将呈指数级上升。\n\n此外，这使得应用程序测试变得非常困难。假设你使用全局变量来保存数据库连接：\n\
  \n![Image00058.jpg](img/Image00058.jpg)\n\n为了单元测试此函数，你必须覆盖全局变量 `$dbConnector`，运行测试，然后将其重置为原始值，这非常容易出错：\n\
  \n![Image00059.jpg](img/Image00059.jpg)\n\n##### 如何避免全局变量？\n\n避免全局变量的最佳方式是一种称为 **依赖注入**\
  \ 的理念。即将所需的工具（依赖）传递给函数或类。\n\n![Image00060.jpg](img/Image00060.jpg)\n\n这更易于理解和维护。无需猜测\
  \ `$bob` 在哪里被设置，因为调用者负责知道这一点（它将我们所需的内容传递给我们）。更棒的是，我们可以使用 [类型声明](http://php.net/manual/en/functions.arguments.php#functions.arguments.type-declaration)\
  \ 来限制传入的内容。\n\n因此我们知道 `$bob` 要么是 `Bar` 类的实例，要么是 `Bar` 子类的实例，这意味着我们知道可以使用该类的方法。结合标准自动加载器（自\
  \ PHP 5.3 起可用），我们现在可以追踪 `Bar` 的定义位置。PHP 7.0 或更高版本包含扩展的类型声明，你也可以使用标量类型（如 `int` 或\
  \ `string`）。\n\n> Version = 4.1\n\n##### 超全局变量\n\nPHP 中的超全局变量是预定义变量，始终可用，可在脚本的任何作用域中访问。\n\
  \n无需执行 `global $variable;` 即可在函数/方法、类或文件中访问它们。\n\n以下是 PHP 超全局变量列表：\n\n![Image00061.jpg](img/Image00061.jpg)\
  \ [$GLOBALS](http://php.net/manual/en/reserved.variables.globals.php)\n\n[$_SERVER](http://php.net/manual/en/reserved.variables.server.php)\n\
  \n[$_REQUEST](http://php.net/manual/en/reserved.variables.request.php)\n\n[$_POST](http://php.net/manual/en/reserved.variables.post.php)\n\
