  \n## 第 95 章：调试\n\n#### 第 95.1 节：转储变量\n\n[`var_dump()`](http://php.net/manual/en/function.var-dump.php)\
  \ 函数允许您转储变量的内容（类型和值）以进行调试。\n\n**示例**\n\n![](img/Image01615.jpg)\n\n**输出**\n\n![](img/Image01616.jpg)\n\
  \n#### 第 95.2 节：显示错误\n\n| `php.ini` |\n| --- |\n\n如果您希望 PHP 在页面上显示运行时错误，必须启用 [`display_errors`](http://php.net/manual/en/errorfunc.configuration.php#ini.display-errors)，无论是在\
  \ `php.ini` 中还是使用 [`ini_set()`](http://php.net/manual/en/function.ini-set.php) 函数。\n\
  \n| `E_*` |\n| --- |\n\n您可以使用 `error_reporting()` 函数（或在 ini 中）选择要显示的错误，它接受 [常量](http://php.net/manual/en/errorfunc.constants.php)，并使用\
  \ [位运算符](http://php.net/manual/en/language.operators.bitwise.php) 组合。\n\nPHP 可以根据\
  \ [`html_errors`](http://php.net/manual/en/errorfunc.configuration.php#ini.html-errors)\
  \ 设置以文本或 HTML 格式显示错误。\n\n**示例**\n\n![](img/Image01617.jpg)\n\n![](img/Image01618.jpg)\n\
  \n**纯文本输出**（HTML 格式因实现而异）：\n\n![](img/Image01619.jpg)\n\n处理 `error_reporting` 的常用方法是在开发期间使用\
  \ `E_ALL` 常量完全启用它，而在生产阶段使用 `display_errors` 禁用公开显示，以隐藏脚本的内部细节。\n\n## 第 95.3 节：phpinfo()\n\
  \n**警告**\n\n必须仅在开发环境中使用 `phpinfo()`。切勿将包含 `phpinfo()` 的代码发布到生产环境。\n\n**简介**\n\n\
  话虽如此，它在理解您正在使用的 PHP 环境（操作系统、配置、版本、路径、模块）方面可能是一个有用的工具，尤其是在追踪 Bug 时。它是一个简单的内置函数：\n\
  \n![](img/Image01620.jpg)\n\n它有一个参数 `$what`，允许自定义输出。默认值为 `INFO_ALL`，这会导致其显示所有信息，且在开发期间常用于查看\
  \ PHP 的当前状态。\n\n| `INFO_*` |\n| --- |\n\n您可以传递参数 [常量](http://php.net/manual/en/function.phpinfo.php#refsect1-function.phpinfo-parameters)，并结合位运算符，以查看自定义列表。\n\
  \n您可以在浏览器中运行它以获得格式良好的详细视图。它也适用于 PHP CLI，您可以将其通过管道传输给 `less` 以便于查看。\n\n**示例**\n\n\
  ![](img/Image01621.jpg)\n\n这将显示 PHP 指令列表 ([`ini_get()`](http://php.net/manual/en/function.ini-get.php))、环境\
  \ ([`$_ENV`](http://php.net/manual/en/reserved.variables.environment.php)) 和 [预定义](http://php.net/manual/en/language.variables.predefined.php)\
  \ 变量。\n\n## 第 95.4 节：Xdebug\n\n[Xdebug](https://xdebug.org/) 是一个 PHP 扩展，提供调试和分析功能。它使用\
  \ DBGp 调试协议。\n\n此工具有一些不错的功能：\n\n![](img/Image01622.jpg) 错误堆栈跟踪。\n\n| `var_dump()`\
  \ |\n| --- |\n\n\n\n\n# Xdebug 功能特性\n\nXdebug 提供以下功能：\n\n- 最大嵌套层级保护和时间追踪\n- 标准 `var_dump()`\
  \ 函数的实用替代品，用于显示变量\n- 允许将所有函数调用（包括参数和返回值）以不同格式记录到文件中\n- 代码覆盖率分析\n- 性能分析信息\n- 远程调试（为与运行中的\
  \ PHP 脚本交互的调试器客户端提供接口）\n\n正如你所见，该扩展非常适合开发环境。特别是远程调试功能，可以帮助你在不使用大量 `var_dump()` 调用的情况下调试\
  \ PHP 代码，并像在 C 或 Java 语言中一样使用标准的调试流程。\n\n## 安装\n\n通常安装此扩展非常简单：\n\n![安装步骤 1](img/Image01624.jpg)\n\
