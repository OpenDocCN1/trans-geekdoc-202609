  \ SQLITE3_OPEN_CREATE | SQLITE3_OPEN_READWRITE);\n```\n\n### 创建表\n\n![](img/Image01307.jpg)\n\
  \n### 插入示例数据\n\n建议将相关查询包裹在事务中（使用关键字 `BEGIN` 和 `COMMIT`），即使你不关心原子性。如果不这样做，SQLite\
  \ 会自动将每个单独的查询包裹在事务中，这会极大地拖慢所有操作。如果你是 SQLite 新手，可能会惊讶于为什么 [INSERT 这么慢](http://stackoverflow.com/a/3852082/388994)。\n\
  \n![](img/Image01308.jpg)\n\n使用预处理语句插入潜在的不安全数据。你可以使用命名参数来实现：\n\n![](img/Image01309.jpg)\n\
  \n```\n$statement = $db->prepare('INSERT INTO \"visits\" (\"user_id\", \"url\",\
  \ \"time\")\n     VALUES (:uid, :url, :time)');\n\n$statement->bindValue(':uid',\
  \ 1337);\n$statement->bindValue(':url', '/test');\n$statement->bindValue(':time',\
  \ date('Y-m-d H:i:s'));\n$statement->execute();\n// 你可以使用不同的值重用该语句\n```\n\n### 获取数据\n\
  \n让我们获取用户 #42 今天的访问记录。我们将再次使用预处理语句，但这次使用编号参数，这更简洁：\n\n![](img/Image01310.jpg)\n\
