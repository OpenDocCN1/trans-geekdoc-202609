  \ 95 章：错误报告与版本检查\n\n## 第 95.5 节：错误报告（两者都用上）\n\n![错误报告配置](img/Image01626.jpg)\n\n\
  ## 第 95.6 节：phpversion()\n\n##### 简介\n\n在使用各种库及其相关依赖时，通常需要知道当前 PHP 解析器或其某个包的版本。\n\
  \n### 语法\n\n```php\nphpversion(string $extension = null): string|false\n```\n\n\
  该函数接受一个可选参数，形式为扩展名称。如果相关扩展已安装，函数将返回包含版本值的字符串。但是，如果扩展未安装，将返回 `false`。如果未提供扩展名称，函数将返回\
  \ PHP 解析器本身的版本。\n\n##### 示例\n\n![phpversion 示例](img/Image01627.jpg)\n\n## 第 96 章：单元测试\n\
  \n#### 第 96.1 节：测试类规则\n\n假设我们有一个简单的 `LoginForm` 类，带有一个 `rules()` 方法（用于登录页面作为框架模板）：\n\
  \n![LoginForm 类](img/Image01628.jpg)\n\n为了对该类执行测试，我们使用单元测试（检查源代码以查看是否符合我们的预期）：\n\
  \n![单元测试设置](img/Image01629.jpg)\n\n单元测试究竟如何在此提供帮助（不包括通用示例）？例如，当我们得到意外结果时，它们非常合适。让我们看看之前的这条规则：\n\
  \n![正确规则](img/Image01630.jpg)\n\n相反，如果我们遗漏了一个重要的东西并写成了这样：\n\n![错误规则](img/Image01631.jpg)\n\
  \n面对数十条不同的规则（假设我们不仅使用邮箱和密码），很难发现错误。这个单元测试：\n\n```php\n// 初始化为有效值并测试\n$this->loginForm->email\
  \ = \"valid@email.com\";\n$this->loginForm->password = \"password\";\n$this->loginForm->rememberMe\
  \ = true;\n\n$this->assertTrue($this->loginForm->validate($rules), \"Should be valid\
  \ as nothing is invalid\");\n```\n\n![测试执行](img/Image01632.jpg)\n\n将通过我们的第一个示例，但无法通过第二个。为什么？因为在第\
  \ 2 个示例中，我们编写的模式有一个拼写错误（漏掉了 `+` 号），意味着它只接受一个字母/数字。\n\n### 运行测试\n\n```bash\nphpunit\
  \ [path_to_file]\n```\n\n单元测试可以在控制台使用上述命令运行。如果一切正常，我们应该能看到所有测试都处于 OK 状态；否则我们将看到\
  \ Error（语法错误）或 Fail（该方法中至少有一行未通过）。\n\n```bash\nphpunit --coverage [path_to_file]\n\
  ```\n\n使用 `--coverage` 等附加参数，我们还可以直观地看到后端代码中有多少行被测试了，以及哪些通过/失败了。这适用于任何安装了 [PHPUnit](https://phpunit.de/)\
  \ 的框架。\n\nPHPUnit 测试在控制台中的样子示例（通用外观，非针对本示例）：\n\n![PHPUnit 控制台输出](img/Image01633.jpg)\n\
  \n## 第 96.2 节：PHPUnit 数据提供者\n\n测试方法通常需要被测试的数据。要完整测试某些方法，你需要为每种可能的测试条件提供不同的数据集。当然，你可以使用循环手动完成，如下所示：\n\
  \n![手动数据循环](img/Image01634.jpg)\n\n有人可能会觉得这很方便。但这种方法有一些缺点：\n\n1. 如果你的测试函数接受多个参数，你将不得不执行额外的操作来提取数据。\n\
  2. 如果没有额外的消息和调试，在失败时很难区分是哪个数据集失败了。\n3. PHPUnit 使用[数据提供者](https://phpunit.de/manual/current/en/writing-tests-for-phpunit.html#writing-tests-for-phpunit.data-providers)提供了一种自动处理测试数据集的方法。\n\
  \n数据提供者是一个应为你的特定测试用例返回数据的函数。\n\n![数据提供者示例](img/Image01635.jpg)\n\n数据提供者方法必须是公共的，并且返回一个数组的数组，或一个实现了\
  \ `Iterator` 接口并在每次迭代步骤中生成一个数组的对象。对于集合中的每个数组，测试方法将使用该数组的内容作为其参数被调用。\n\n### 使用数据提供者\n\
  \n要将数据提供者与你的测试一起使用，请使用 `@dataProvider` 注解并指定数据提供者函数的名称：\n\n![DataProvider 注解](img/Image01636.jpg)\n\
  \n![DataProvider 用法](img/Image01637.jpg)\n\n每个数据集可以为了方便而命名。这将更容易检测失败的数据：\n\n![命名数据集](img/Image01638.jpg)\n\
  \n### 迭代器\n\n![迭代器实现](img/Image01639.jpg)\n\n![迭代器用法](img/Image01640.jpg)\n\n正如你所见，简单的迭代器也能工作。\n\
  \n> **注意：** 即使对于单个参数，数据提供者也必须返回一个数组 `[]`。因为如果我们将 `current()` 方法（实际上在每次迭代时返回数据）更改为这样：\n\
  \n![错误的单值返回](img/Image01641.jpg)\n\n或更改实际数据：\n\n![数据更改示例 1](img/Image01642.jpg)\n\
  \n![数据更改示例 2](img/Image01643.jpg)\n\n### 生成器\n\n手册中未明确注明和展示，但你也可以使用生成器作为数据提供者。注意\
  \ `Generator` 类实际上实现了 `Iterator` 接口。\n\n所以这里是一个结合使用 `DirectoryIterator` 和生成器的示例：\n\
  \n![生成器数据提供者](img/Image01645.jpg)\n\n#### 第 96.3 节：测试异常\n\n假设你想测试一个抛出异常的方法：\n\n\
  ![抛出异常的方法](img/Image01646.jpg)\n\n![测试类结构](img/Image01647.jpg)\n\n你可以通过将方法调用包裹在\
  \ `try/catch` 块中并对异常对象的属性进行断言来实现，但更方便的是使用异常断言方法。自 [PHPUnit 5.2](https://github.com/sebastianbergmann/phpunit/wiki/Release-Announcement-for-PHPUnit-5.2.0)\
  \ 起，你可以使用 `expectException()` 方法来断言异常类型、消息和代码：\n\n![expectException 方法](img/Image01648.jpg)\n\
  \n如果你使用的是较早版本的 PHPUnit，可以使用 `setExpectedException()` 方法代替 `expectException()` 方法，但请记住它已被弃用，并将在版本\
  \ 6 中移除。\n\n![setExpectedException 方法](img/Image01649.jpg)\n\n## 第 97 章：性能\n\n##\
  \ 第 97.1 节：使用 Xdebug 进行性能分析\n\n一个名为 Xdebug 的 PHP 扩展可用于协助[分析 PHP 应用程序](https://xdebug.org/docs/profiler)以及运行时调试。运行分析器时，输出会以一种称为\
  \ \"cachegrind\" 的二进制格式写入文件。每个平台都有可用的应用程序来分析这些文件。\n\n要启用分析，请安装扩展并调整 `php.ini` 设置。在我们的示例中，我们将根据请求参数有选择地运行分析器。这允许我们保持设置静态，仅在需要时开启分析器。\n\
  \n```ini\n; 设置为 1 即可为每个请求开启\nxdebug.profiler_enable = 0\n\n; 让我们使用 GET/POST 参数来开启分析器\n\
  xdebug.profiler_enable_trigger = 1\n\n; 我们将传递的 GET/POST 值；为空则表示任意值\nxdebug.profiler_enable_trigger_value\
  \ = \"\"\n\n; 将 cachegrind 文件输出到 /tmp，以便系统稍后清理\nxdebug.profiler_output_dir = \"\
  /tmp\"\n\nxdebug.profiler_output_name = \"cachegrind.out.%p\"\n```\n\n![分析器配置](img/Image01650.jpg)\n\
  \n接下来，使用 Web 客户端向你想要分析的应用程序 URL 发起请求，例如：\n\n```bash\ncurl \"http://localhost/your-app?XDEBUG_PROFILE=1\"\
  \n```\n\n![分析请求](img/Image01651.jpg)\n\n随着页面处理，它将写入一个名称类似于以下内容的文件：\n\n```\ncachegrind.out.12345\n\
  ```\n\n![Cachegrind 输出](img/Image01652.jpg)\n\n\n\n\n请注意，它将为每个执行的 PHP 请求/进程写入一个文件。因此，例如，如果您想分析表单提交，将为显示\
  \ HTML 表单的 GET 请求写入一个性能分析文件。`XDEBUG_PROFILE` 参数需要传递给后续的 POST 请求，以分析处理表单的第二个请求。因此，在进行性能分析时，有时直接运行\
  \ `curl` 来 POST 表单会更容易。\n\n写入后，可以使用 KCachegrind 等应用程序读取性能分析缓存。\n\n![](img/Image01653.jpg)\n\
  \n这将显示包括以下信息在内的内容：\n\n![](img/Image01654.jpg)\n\n*   执行的函数\n*   调用时间，包括其自身时间以及包含后续函数调用的时间\n\
  *   每个函数被调用的次数\n*   调用图\n*   源代码链接\n\n显然，性能调优非常具体，取决于每个应用程序的用例。通常情况下，建议寻找：\n\n![](img/Image01655.jpg)\n\
  \n*   对同一函数的重复调用，而这些调用是你意料之外的。对于处理和查询数据的函数，这些可能是您的应用程序进行缓存的绝佳机会。\n*   运行缓慢的函数。应用程序将大部分时间花在哪里了？性能调优中回报最大的做法是专注于消耗时间最多的那些应用程序部分。\n\
  \n**注意**：Xdebug，特别是其性能分析功能，非常消耗资源并会拖慢 PHP 执行速度。建议不要在生产服务器环境中运行这些功能。\n\n#### 第 97.2\
  \ 节：内存使用\n\n| php | | . | ini |\n| --- | --- | --- | --- |\n\nPHP 的运行时内存限制通过 INI\
  \ 指令 `memory_limit` 设置。此设置可防止任何单次 PHP 执行占用过多内存，导致其他脚本和系统软件内存耗尽。内存限制默认为 128M，可在 `php.ini`\
  \ 文件中或运行时更改。可以将其设置为无限制，但这通常被视为不良实践。\n\n| `memory_get_usage` |\n| --- |\n\n运行时使用的确切内存量可以通过调用\
  \ `memory_get_usage()` 来确定。它返回当前正在运行的脚本所分配的内存字节数。自 PHP 5.2 起，它有一个可选的布尔参数，用于获取总分配的系统内存，而不是\
  \ PHP 正在活跃使用的内存。\n\n![](img/Image01656.jpg)\n\n| `memory_get_peak_usage` |\n| ---\
  \ |\n\n`memory_get_usage` 给出的是运行那一刻的内存使用量。在对该函数的调用之间，您可能会在内存中分配和释放其他内容。要获取截至某一时刻使用的最大内存量，请调用\
  \ `memory_get_peak_usage()`。\n\n![](img/Image01657.jpg)\n\n请注意，该值只会增加或保持不变。\n\n\
  ## 第 97.3 节：使用 XHProf 进行性能分析\n\n[XHProf](https://github.com/phacility/xhprof) 是一个\
  \ PHP 性能分析器，最初由 Facebook 编写，旨在为 XDebug 提供一个更轻量级的替代方案。\n\n安装 xhprof PHP 模块后，可以从 PHP\
  \ 代码中启用/禁用性能分析：\n\n![](img/Image01658.jpg)\n\n| `doSlowOperation` |\n| --- |\n\n\
  返回的数组将包含有关在 `doSlowOperation()` 内部访问的每个函数的调用次数、CPU 时间和内存使用量的数据。\n\n| `xhprof_sample_enable`\
  \ | | `()` / | `xhprof_sample_disable` |\n| --- | --- | --- | --- |\n\n`xhprof_sample_enable()`\
  \ 可用作更轻量级的选项，它仅记录一小部分请求的性能分析信息（且格式不同）。\n\nXHProf 有一些（大多未记录在案的）辅助函数来显示数据（[参见示例](https://github.com/phacility/xhprof/blob/master/examples/sample.php)），或者您可以使用其他工具来可视化它（platform.sh\
  \ 博客[有一个示例](https://platform.sh/2015/07/29/flamegraphs/)）。\n\n# 第 98 章：多进程处理\n\n\
  #### 第 98.1 节：使用内置 fork 函数进行多进程处理\n\n您可以使用内置函数将 PHP 进程作为 fork 运行。如果不需要线程之间相互通信，这是实现并行工作的最简单方法。\n\
  \n这允许您将耗时的任务（如将文件上传到另一台服务器或发送电子邮件）放到另一个线程中，以便您的脚本加载得更快并能利用多核，但请注意，这不是真正的多线程，主线程无法知晓子线程在做什么。\n\
  \n请注意，在 Windows 下，这将为您启动的每个 fork 弹出另一个命令提示符窗口。\n\n**master.php**\n\n![](img/Image01659.jpg)\n\
  \n**worker.php**\n\n![](img/Image01660.jpg)\n\n## 第 98.2 节：使用 fork 创建子进程\n\nPHP\
  \ 拥有用于创建子进程的内置函数 `pcntl_fork`。`pcntl_fork` 与 Unix 中的 fork 相同。它不接受任何参数，并返回一个整数，可用于区分父进程和子进程。\n\
  \n请参考以下代码进行说明：\n\n![](img/Image01661.jpg)\n\n正如您所见，`-1` 表示 fork 出错，子进程未被创建。子进程创建后，我们有两个具有独立\
  \ PID 的进程在运行。\n\n| `pcntl_wait` | | `(` | `$status` |\n| --- | --- | --- | --- |\n\
  \n此处的另一个考虑因素是僵尸进程或失效进程，即父进程在子进程之前结束。为防止僵尸子进程，只需在父进程末尾添加 `pcntl_wait($status)`。![](img/Image01662.jpg)\
  \ `pcntl_wait` 会挂起父进程的执行，直到子进程退出。\n\n还值得注意的是，僵尸进程无法使用 SIGKILL 信号杀死。\n\n#### 第 98.3\
  \ 节：进程间通信\n\n进程间通信允许程序员在不同进程之间进行通信。例如，假设我们需要编写一个可以运行 bash 命令并打印输出的 PHP 应用程序。我们将使用\
  \ `proc_open`，它将执行命令并返回一个可用于通信的资源。以下代码展示了一个从 PHP 在 bash 中运行 `pwd` 的基本实现：\n\n![](img/Image01663.jpg)\n\
  \n`proc_open` 使用 `$descriptor` 作为描述符规范来运行 bash 命令。之后，我们使用 `is_resource` 来验证进程。完成后，我们可以根据描述符规范生成的\
  \ `$pipes` 开始与子进程交互。\n\n之后，我们可以简单地使用 `fwrite` 写入子进程的 stdin。在本例中是 `pwd` 后跟回车符。\n\n\
  最后，使用 `stream_get_contents` 读取子进程的 stdout。\n\n![](img/Image01664.jpg) 请始终记得使用 `proc_close()`\
  \ 关闭子进程，这将终止子进程并返回退出状态码。\n\n## 第 99 章：多线程扩展\n\n#### 第 99.1 节：入门\n\n| `pthreads`\
  \ - ext |\n| --- |\n\n要开始多线程编程，您需要 PHP 的 `pthreads` 扩展，可以通过以下方式安装：\n\n![](img/Image01665.jpg)\n\
