  B 对网络 AP 进行拒绝服务攻击\nC 从 WEP AP 破解加密代码\nD 从 AP 窃取用户名和密码\n\n**16. WPA2 的完整性检查机制是什么？**\n\
  \nA. `CBC-MAC`\nB. `CCMP`\nC. `RC4`\nD. `TKIP`\n\n\n\n\n\n### 17. 关于无线安全，以下哪项描述是正确的？\n\
  \n**A.** `WPA2` 是比 `WEP` 更好的加密选择。\n\n**B.** `WEP` 是比 `WPA2` 更好的加密选择。\n\n**C.** 通过隐藏\
  \ `SSID` 并实施 `MAC` 过滤，你可以消除对加密的需求。\n\n**D.** 将 `SSID` 长度增加到最大可以增加系统的安全性。\n\n###\
  \ 18. 一位渗透测试同事试图在目标建筑内部使用无线连接。在他的 Linux 笔记本电脑上，他输入了以下命令：\n\n```\nifconfig wlan0\
  \ down\nifconfig wlan0 hw ether 0A:0B:0C:1A:1B:1C\nifconfig wlan0 up\n```\n\n此此操作最可能的原因是什么？\n\
