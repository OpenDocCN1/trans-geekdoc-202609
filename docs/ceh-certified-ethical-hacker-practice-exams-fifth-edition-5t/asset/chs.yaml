  \ 信号微弱导致与接入点的连接困难。\n\n### 19. 攻击者已成功在目标目标内部配置并设置了一个伪造无线 AP。当个人连接到不同区域时，他执行了 `MITM`\
  \ 攻击并在某些 `HTTP` 连接中注入了恶意小程序。这使得某些页面的用户请求重定向到攻击者控制的页面。攻击者最可能使用哪种工具来注入 HTML 代码？\n\n\
  **A.** `Aircrack-ng`\n\n**B.** `Kismet`\n\n**C.** `Ettercap`\n\n**D.** `Honeypot`\n\
  \n### 20. 在搜索和定位伪造接入点时，以下哪项是最佳选择？\n\n**A.** `WIPS`\n\n**B.** `偶极天线`\n\n**C.** `WACL`\n\
  \n**D.** `HIDS`\n\n### 21. Charity 访问了她合作过的多次客户。当她打开笔记本电脑时，她的无线连接尝试自动连接到名为 `BUSINESS1`\
  \ 的网络。在她不知情的情况下，攻击者设置了一个细节完全相同的克隆网络。当她的连接开始时，他发送并持续重新发送连接握手的第三步。在经过多次迭代后，攻击者获得了足够的解密细节来破解加密密钥。以下哪项最好描述了这种攻击？\n\
  \n**A.** `伪造 AP`\n\n**B.** `AP MAC 欺骗`\n\n**C.** `aLTEr`\n\n**D.** `KRACK`\n\n##\
  \ 快速答案对照\n\n- **1.** D\n- **2.** B, C\n- **3.** B, D\n- **4.** A\n- **5.** B\n-\
  \ **6.** B\n- **7.** C\n- **8.** C, D\n- **9.** B\n- **10.** B\n- **11.** A, D\n\
  - **12.** B, D\n- **13.** B, C, D\n- **14.** A, B, C\n- **15.** D\n- **16.** A\n\
  - **17.** A\n- **18.** C\n- **19.** C\n- **20.** A\n- **21.** D\n\n## 答案解析\n\n###\
  \ 1. 以下哪项描述是正确的？\n\n**A.** `Kismet` 可以安装在 Windows 上，但不能安装在 Linux 上。\n\n**B.** `NetStumbler`\
  \ 可以安装在 Linux 上，但不能安装在 Windows 上。\n\n**C.** `Kismet` 无法监控 `802.11n` 网络流量。\n\n**D.**\
  \ `NetStumbler` 无法监控 `802.11n` 网络流量。\n\n**D.** 这个问题不仅过于困惑且针对特定工具，而且几乎就是你会在考试中看到的题目类型。`Kismet`\
  \ 和 `NetStumbler` 都是具有检测和嗅探能力的无线监控工具。`NetStumbler` 是 Windows 特有的，而 `Kismet` 几乎可以安装在任何设备上。它们在监控\
  \ `802.11a`、`b` 和 `g` 网络方面表现出色，但 `NetStumbler` 无法处理 `802.11n`。`Kismet` 甚至可以作为你无线网络的\
  \ `IDS`！关于这一点，最后一个有趣的小知识——`Kismet` 在提取管理包方面做得更好。Windows 系统上的许多无线卡不支持监听模式，在提取管理包和控制包时面临困难。\n\
  \n**A, B, 和 C** 是错误的，因为它们是虚假陈述。`Kismet` 可以安装在任何地方，`NetStumbler` 是 Windows 特有的且在\
  \ Linux 上可用，而 `Kismet` 可以监控 `802.11n` 网络。\n\n### 2. 以下哪项使用 48 位的初始化向量？（多选）\n\n**A.**\
  \ `WEP`\n\n**B.** `WPA`\n\n**C.** `WPA2`\n\n**D.** `WEP2`\n\n**B, C.** 从 `WEP` 升级到\
  \ `WPA` 的改进之一是将初始化向量 (`IV`) 从 24 位扩展到 48 位。虽然这看起来只是是选项的简单倍增，但你必须记住，每增加一个位都会以指数级增加密钥空间。`IV`\
  \ 提供机密性和完整性。无线加密算法使用它来计算完整性检查值 (`ICV`)，并将其附加在数据负载末尾。然后将 `IV` 与密钥结合并输入算法（`WEP` 使用\
  \ `RC4`，`WPA` 使用 `AES`）。`IV` 的长度决定了可能创建的加密值的总数。增加到 48 位增加了整体安全性。\n\n**A** 是错误的，因为\
  \ `WEP` 使用 24 位的 `IV`。在 `WEP` 中，尽管这个数字看起来很大，但黑客在几小时内就能获取足够的 `IV` 来破解密钥。\n\n**D**\
  \ 是错误的，因为不存在 `WEP2`。\n\n### 3. 以下哪项描述是正确的？（多选）\n\n**A.** `WEP` 使用 TKIP 进行共享密钥加密。\n\
  \n**B.** `WEP` 使用 `RC4` 进行共享密钥加密。\n\n**C.** `WPA2` 使用 `RC4` 进行共享密钥加密。\n\n**D.**\
  \ `WPA` 使用 TKIP 和 AES 加密。\n\n**B, D.** `WEP` 使用 24 位的初始化向量和 `RC4` 来“加密”数据传输，尽管这样说让我感到厌恶，因为这真的是一个误名。`WEP`\
  \ 设计为基础加密仅是为了模拟有线网络的“安全性”——因此有了 Wired Equivalent Privacy 中的“Equivalent”（等同于）。它从未旨在作为真正的加密保护。`WPA`\
  \ 在两个方面进行了改进。首先，通过使用临时密钥性协议 (`TKIP`)，共享密钥加密得到了极大增强。简而言之，用于加密的密钥是临时性的，并且每 10000 个包更换一次。此外，`WPA2`\
  \ 使用 NIST 批准的加密算法 `AES` 作为选择算法。\n\n**A** 是错误的，因为 `WEP` 不使用 TKIP。\n\n**C** 是错误的，因为\
  \ `WPA2` 不使用 `RC4` 作为加密算法。\n\n### 4. 你建议使用哪种方法防止未经授权的无线设备访问网络资产？\n\n**A.** `无线访问控制列表`\n\
  \n**B.** `无线干扰器`\n\n**C.** `无线分析仪`\n\n**D.** `无线接入点`\n\n\n\n\n\n![Image](img/r.jpg)\
  \ **A.** 在提供的选项中，只有访问控制列表（ACL）是合理的。这正是访问控制列表的设计初衷：通过确保只有经过授权的设备*可以*连接，你确保了未经授权的设备无法连接（或至少采取措施避免其连接）。在这里顺带提一下，不要将无线入侵防御系统（`WIPS`）与\
  \ `ACL` 混淆。`WIPS` 会监控你的 `traffic`，并且像更广为人知的网络入侵防御系统一样，会根据流量分析、阈值和警报采取措施防止入侵。最后，对于这类问题，通过排除法可以帮你很轻松地辨别出答案。\n\
  \n![Image](img/w.jpg) **B** 是错误的，原因显而易见。是的，你会阻止未经授权的连接，但你也会阻止*所有*连接——甚至包括来自授权设备的连接。如果是那样的话，为什么还要开启无线功能呢？现在，我能听到你们某些人在尖叫说干扰可以在受限制的地理空间内用于控制访问，但请相信我，`ECC`\
  \ 将干扰器视为一种切断一切的攻击工具。在考试时，你最好也这样看待它。\n\n![Image](img/w.jpg) **C** 是错误的，因为分析器不会以任何方式影响访问。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为这不是 `WAP` 的意图。虽然你可以在设备上配置某些东西（比如，我敢说，一个 `ACL`），但设备本身的设计是为了*访问*点。\n\
  \n# 5.\n在度假期间，Joe 收到一个来自身份警报服务的电话，通知他的两个账户在过去一小时内被访问了。当天早些时候，他将笔记本电脑连接到 `McDonald’s`\
  \ 的无线热点并访问了那两个账户。以下哪项是针对 Joe 最可能的攻击？\n\n**A.** 未经授权的关联\n**B.** 蜜罐访问点 (Honeyspot\
  \ access point)\n**C.** 恶意访问点\n**D.** 干扰信号\n\n![Image](img/r.jpg) **B.** 有时 `EC-Council`\
  \ 会创建并使用冗余术语，所以不要因为这个极其烦人的细节而怪我。在这种情况下，Joe 很可能在买早咖啡时连接了他认为是合法的 `McDonald’s` 免费 Wi-Fi，并检查了相关账户。然而，餐厅内（或附近）的攻击者使用与餐厅相同的\
  \ `SSID` 搭建了另一个无线网络。这种做法被称为蜜罐攻击。\n\n![Image](img/w.jpg) **A** 是错误的，因为未经授权的关联攻击利用的是所谓的软访问点——某些移动设备中嵌入的无线局域网射电，这些射电可能会无意中启动并被攻击者用于访问企业网络。\n\
  \n![Image](img/w.jpg) **C** 是错误的，但差一点点。蜜罐攻击的核心理念是攻击者设置了某种恶意访问点来诱骗人们连接。然而，这属于一个答案比另一个答案更准确的情况。`EC-Council`\
  \ 明确将蜜罐攻击列为一种独立的恶意攻击类型，因此你需要以这种方式记住它。\n\n![Image](img/w.jpg) **D** 是错误的，因为干扰攻击寻求对整个信号进行\
  \ `DoS`（拒绝服务），而不是一定是为了从中窃取任何东西。\n\n### 6.\n一个攻击者正试图破解 `WEP` 密码以获取网络访问。在对 `wlan0`\
  \ 开启监听模式并创建一个监控接口（`mon 0`）后，她输入了以下命令：\n\n```\naireplay –ng -0 0 –a 0A:00:2B:40:70:80\
  \ –c mon0\n```\n\n她试图实现什么？\n\n**A.** 通过检查包含 `WEP` 代码的取消认证包响应来获取 `WEP` 访问代码\n**B.**\
  \ 使用取消认证包产生大量的网络流量\n**C.** 确定接入点的 `BSSID`\n**D.** 发现网络隐藏的 `SSID`\n\n![Image](img/w.jpg)\
  \ **B.** 在 `802.11` 标准中，有几种不同的管理类型帧在使用：包括从信标帧、关联请求到探测请求的所有内容。这些管理帧之一就是取消认证包，它基本上会切断客户端与网络的连接。然后客户端必须重新连接——而且会很快这样做。这种活动背后的构思想是产生大量流量进行捕获，以便识别出\
  \ `WEP` 访问代码（从客户端尝试重新关联到所有飞速而来的新 `ARP` 包，因为许多机器在断开网络后会丢弃其 `ARP` 缓存）。记住 `WEP` 内的初始化向量相对短（24\
  \ 位）且被频繁重复，因此任何破解密码的尝试通常需要大约 15,000 个数据包。你可以随着时间收集这些包，但产生流量可以快得多地实现这一点。关于这一点最后一点必须说明：这种攻击同样很容易导致针对主机和相关\
  \ `AP` 的拒绝服务攻击，所以要小心。\n\n![Image](img/w.jpg) **A** 是错误的，因为对 `deauth` 包的响应并不以明文形式包含\
  \ `WEP` 访问代码。如果是那样，攻击者一开始就没必要费精力生成这么多流量了——一个简单的包就足以破解所有安全。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为基本服务集标识符 (`BSSID`）是 `AP` 的 `MAC` 地址。它通常很容易通过任何方法获得（例如使用 `airodump`），并且并不是发送多个取消认证包的原因。某些网络的\
  \ `BSSID` 是隐藏的（称为*cloaking*），但其他工具（`airmon` 和 `airodump`）可以提供帮助。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为即使 `SSID` 被“隐藏”，并不意味着它实际上隐藏了；它仅意味着没有广播。`SSID` 仍然包含在 `AP` 发出的每一个包中，发现它非常容易。\n\
  \n### 7.\n哪种无线标准在 2.4GHz 频率范围内工作速率为 54Mbps？\n\n**A.** 802.11a\n**B.** 802.11b\n\
  **C.** 802.11g\n**D.** 802.11n\n\n![Image](img/r.jpg) **C.** `802.11` 系列标准识别了各种无线问题，例如客户端通信的顺序、认证规则、数据传输、包大小、消息如何编码为信号等。802.11g\
  \ 结合了“a”和“b”标准的优点，而没有那么多的缺点。它速度很快（54Mbps），与 `802.11b` 客户端向下兼容，并且没有受到 `802.11a` 面临的覆盖区域限制。然而，考虑到它在\
  \ 2.4GHz 范围内运行，可能会有一些干扰问题要处理。不仅你的网络周围周围有大量的竞争网络在发射信号（有时在同一信道上），你还必须考虑蓝牙设备、无线电话甚至婴儿监视器，它们可能会对无线信号产生干扰（由于干扰）。此外，微波炉恰好运行在\
  \ 2.45GHz——正处于该范围的正中央。\n\n\n\n\n\n![Image](img/w.jpg) **A** 是错误的，因为 802.11a 的速率为\
  \ 54Mbps，但使用的是 5GHz 频率范围。802.11a 的主要缺点是频率范围本身——因为频率较高，网络范围受到限制。相比之下，802.11b 客户端可以分布在较远的距离上，而\
  \ 802.11a 客户端通信速度快得多，但距离必须更近。加上设备成本的增加，这导致 802.11a 未能完全接受为事实标准。尽管如此，出于安全考虑，它可能不是一个坏选择。使用它的人很少，甚至没人寻找它，而且它较小的范围可能有助于你防止信号泄露到建筑之外。最后，导致距离限制的并非高频率本身，而是常见的建筑材料和传播问题与频率之间的相互作用。这非常复杂，但如果你感兴趣并且有时间的话，你会发现这个话题非常非常有意思。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为 802.11b 在 2.4GHz 频率范围内工作，速率为 11Mbps。它比“a”和“g”慢，但在发布后不久就成为了无线网络的事实标准。价格和网络范围促成了这一点。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 802.11n 在 2.4 到 5 GHz 的频率范围内工作速率为 100Mbps+。它通过多输入多输出（MIMO）天线实现了这一速率。\n\
  \n### 8.\n团队发现了一个配置了 WEP 加密的接入点（AP）。为了破解 WEP 尝试对 AP 进行伪认证，需要什么？（选择所有适用项。）\n\n* **A.**\
  \ 捕获的认证数据包\n* **B.** AP 的 IP 地址\n* **C.** AP 的 MAC 地址\n* **D.** SSID\n\n![Image](img/r.jpg)\
  \ **C, D.** 破解 WEP 通常归结为捕获大量数据包并运行一些数学魔法来破解密钥。如果你想通过向 AP 发送伪认证数据包来产生流量，你需要 AP 的\
  \ MAC 地址和 SSID 来进行尝试。\n\n![Image](img/w.jpg) **A** 和 **B** 是错误的，因为伪认证数据包不需要这些信息。当然，你可以捕获并重放整个认证数据包，但它没有多大作用，而且完全不需要\
  \ IP 地址。\n\n### 9.\n列出的工具中，哪一个是是被动发现工具？\n\n* **A.** Aircrack\n* **B.** Kismet\n\
  * **C.** NetStumbler\n* **D.** Netsniff\n\n![Image](img/r.jpg) **B.** 这样的问题可能有点棘手，取决于它的措辞；然而，根据\
  \ EC-Council 的说法，Kismet 作为真正的被动网络发现工具工作，并带有包注入功能。以下来自 `www.kismet.net`：“Kismet 是\
  \ 802.11 二层网络检测器、嗅探器和入侵检测系统。Kismet 可以与任何支持原始监控（`rfmon`）模式的无线卡配合，并且（在适当硬件下）可以嗅探 802.11b、802.11a、802.11g\
  \ 和 802.11n 流量。Kismet 还支持允许嗅探其他介质的插件。”你可能在考试中还会看到关于 Kismet 的另外两个重点：第一，它通过信道跳跃尝试发现尽可能多的网络。第二，它具有嗅探数据包并将其保存为\
  \ `Wireshark` 或 `tcpdump` 可读日志文件的能力。\n\n![Image](img/w.jpg) **A** 是错误的，因为 Aircrack\
  \ 是一个 802.11 WEP 和 WPA-PSK 破解程序，一旦捕获了足够的数据即可恢复密钥。它实现了标准的 FMS 攻击，并带有如 KoreK 攻击（`www.aircrack-ng.org`）之类的优化。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为 NetStumbler 被认为是主动网络发现。NetStumbler 是任何工具箱中可能看到的最流行的工具之一。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 Netsniff 被作为干扰项包含，并不是一个有效的工具。\n\n### 10.\n你发现了一个使用\
  \ WEP 进行加密的接入点。以下选项中发现该网络的最佳选择是？\n\n* **A.** NetStumbler\n* **B.** Aircrack\n* **C.**\
  \ John the Ripper\n* **D.** Kismet\n\n![Image](img/r.jpg) **B.** Aircrack 是一个破解\
  \ WEP 的快速工具（假设你已经收集了至少 50,000 个数据包，它运行得非常快）。你需要使用另一个工具集收集大量数据包，但一旦你拥有它们，Aircrack\
  \ 在破解密钥方面表现出色。Aircrack 使用的一种你可能在考试中看到的引用方法是 KoreK 实现，它基本上涉及从数据包中切分位并用猜测来替换它们——操作得越多，猜测就越准确，最终就能恢复密钥。破解\
  \ WEP 的其他工具包括 `Cain`（也可以使用 KoreK）、`KisMac`、`WEPCrack` 和 Elcomsoft’s Wireless Security\
  \ Auditor。\n\n![Image](img/w.jpg) **A** 是错误的，因为 NetStumbler 是一个网络发现工具。它也可以用于识别非法接入点和干扰，并且在测量信号强度（用于对准天线等）方面也有用。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为 John the Ripper 是一个基于 Linux 的密码破解工具，不是无线发现工具。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 Kismet 是一个被动网络发现（以及其他审计）工具，但不执行密钥破解。\n\n###\
  \ 11.\n关于 TKIP，以下哪些陈是正确的？（选择所有适用项。）\n\n* **A.** 临时密钥完整性协议（TKIP）每 10,000 个数据包强制更改密钥。\n\
  * **B.** 临时密钥完整性协议确保密钥在会话期间不会。\n* **C.** 临时密钥完整性协议是 WEP 的不可组成部分。\n* **D.** 临时密钥完整性协议是\
  \ WPA 的不可组成部分。\n\n![Image](img/r.jpg) **A, D.** TKIP 是无线安全的一大进步。它不再像 WEP 那样在与客户端会话期间保持单一密钥并重复使用，而是每\
  \ 10,000 个数据包左右更改密钥。此外，密钥在可扩展身份验证（EAP）认证会话期间往返传输，以证明客户端属于 AP，反之亦然。TKIP 出现于 WPA。\n\
  \n![Image](img/w.jpg) **B** 和 **C** 只是陈述。TKIP 不维护单一密钥（它频繁更改），并且它是 WPA（以及 WPA2）的一部分，而不是\
  \ WEP。\n\n### 12.\n关于 SSID，以下哪些陈述是正确的？（选择所有适用项。）\n\n* **A.** SSID 长度总是 32 个字符。\n\
  * **B.** SSID 最大 32 个字符。\n* **C.** 关闭广播可以防止 SSID。\n* **D.** SSID 是 AP 的每个数据包头部的一部分。\n\
  * **E.** SSID 为网络提供了重要的安全性。\n* **F.** 在 ESS 内的 AP 之间移动需要多个 SSID。\n\n![Image](img/r.jpg)\
  \ **B, D.** 服务集标识符（SSID）在你的考试中只有一个唯一的实际功能：识别。它在任何形式、形状或结构上都不是安全特性，它的设计目的仅是区分一个接入点的网络与另一个——这也是它包含在所有数据包中的原因之一。SSID\
  \ 最大可达 32 个字符，但不必那么长（事实上，你可能会发现大多数都不是那么长）。\n\n![Image](img/w.jpg) **A** 是错误的，因为\
  \ SSID *必须*是 32 个字符。它们*可以*是，但不必填满 32 个字符的空间。\n\n\n\n\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，因为“隐藏” SSID 实际上并不起什么作用。它仍然是每个数据包头部的一部分，因此发现它相对容易。\n\n![Image](img/w.jpg)**E**\
  \ 是错误的，因为 SSID 不被认为是无线网络的安全特性。\n\n![Image](img/w.jpg)**F** 是错误的，因为扩展服务集（ESS，一种由多个\
  \ AP 组成的企业级无线网络）只需要一个所有 AP 均共同使用的单一 SSID。\n\n### [13.](https://ch7.xhtml#ans13)\n\
  你正在与一名初级渗透测试团队成员讨论 WEP 破解。关于初始化向量（IV），以下哪些陈述是正确的？（可选择多项）\n\n**A.** `IVs` 的长度为 32\
  \ 位。\n**B.** `IVs` 的长度为 24 位。\n**C.** `IVs` 会频繁被重用。\n**D.** `IVs` 以明文发送。\n**E.**\
  \ `IVs` 在传输过程中会被加密。\n**F.** `IVs` 每个加密会话仅使用一次。\n\n![Image](img/r.jpg)**B, C, D.**\
  \ 弱的初始化向量和糟糕的加密是 WEP 实现不被建议在无线网络中作为真正安全措施的原因之一。而且，公平地说，它从未被真正设计成那样，这就是为什么它被命名为“有线等隐私”（Wired\
  \ Equivalent Privacy），而不是“无线加密协议”（Wireless Encryption Protocol，正如某些人尝试命名的那样）。`IVs`\
  \ 长度为 24 位，以明文发送并大量重用。捕获足够的数据包，就可以轻松破解代码。\n\n![Image](img/w.jpg)**A, E,** 和 **F**\
  \ 是错误的，因为这些是错误的陈述。`IVs` 的长度不是 32 位，它们本身没有被加密，而且绝对没有每个会话只使用一次（那会比重用更糟糕）。\n\n### [14.](https://ch7.xhtml#ans14)\n\
  一名渗透测试成员配置了一个无线接入点，其 SSID 与目标组织的 SSID 相同，并将其设置在建筑的一个衣柜内。一段时间后，客户端开始连接到他的接入点。关于这种攻击，以下哪些陈述是正确的？（可选择多项）\n\
  \n**A.** 安全人员可以使用 `NetStumbler` 发现该流氓接入点。\n**B.** 安全人员可以使用 `NetSurveyor` 发现该流氓接入点。\n\
  **C.** 安全人员可以使用 `Kismet` 发现该流氓接入点。\n**D.** 安全人员可以使用 `Aircrack` 发现该流氓接入点。\n**E.**\
  \ 安全人员可以使用 `ToneLoc` 发现该流氓接入点。\n\n![Image](img/r.jpg)**A, B, C.** 流氓接入点（有时被称为*邪恶胎攻击*）可以提供一种从目标网络上的无知用户处获取有用信息的简单方法。然而，请注意：安全人员可以使用多种工具和技术来发现流氓\
  \ AP。`NetStumbler` 是最流行且实用的工具之一。它是一个优秀的网络发现工具，也可用于识别流氓点、网络干扰和信号强度。`Kismet` 是另一个流行的工具，提供了许多相同的功能，并被标记为“被动”网络发现工具。`NetSurveyor`\
  \ 是一个免费、易用的 Windows 工具，提供了与 `NetStumbler` 和 `Kismet` 许多相同的功能，并适用于几乎所有存在的网卡。现在有了\
  \ `NetSurveyor` 的“专业”版本（在要求购买许可证之前你可以使用）。最后，识别流氓接入点需要安全人员了解他们拥有的每一个接入点及其 `MAC` 地址。如果网络中有已知的\
  \ AP 突然出现了一个，仅凭这一点就能帮助找到坏的那个。发现这些东西需要一定的组织能力，而且这对你作为伦理黑客来说是有机会的。你的邪恶胎坐留的时间越长，被发现的几率越大，所以要短小精悍。\n\
  \n![Image](img/w.jpg)**D** 是错误的，因为 `Aircrack` 用于破解网络密码，而不是识别流氓接入点。\n\n![Image](img/w.jpg)**E**\
  \ 是错误的，因为 `ToneLoc` 是一个用于盲打（识别一段电话号码内的开放调制解调器）的工具。顺便提一下，这也是另一个东西的代号，但我可以保证那不会出现在你的考试中。\n\
  \n### [15.](https://ch7.xhtml#ans15)\n一名渗透测试成员正在从 Linux 笔记本电脑运行 `Airsnarf` 工具。她正尝试什么？\n\
  \n**A.** 对网络上的 AP 进行 `MAC flooding` \n**B.** 对网络上的 AP 发起 `Denial-of-service attacks`\n\
  **C.** 从 WEP AP 破解网络密码\n**D.** 从 AP 窃取用户名和密码\n\n![Image](img/r.jpg)**D.** 识别工具及其功能是考试的重要组成部分——这足够容易，因为这纯粹是记忆工作，而这就是一个典型的例子。根据该工具的网站（`http://airsnarf.shmo.com/`），`Airsnarf`\
  \ 是一个简单的流氓接入点程序，旨在演示流氓 AP 如何从无线热点中窃取用户名和密码。`Airsnarf` 的开发和发布是为了演示公共 802.11b 热点的一种固有漏洞——通过从\
  \ AP 提供的 DNS 和 HTTP 重定向混淆用户，从而嗅取用户名和密码。它基本上将你的笔记本电脑变成局域范围内一个竞争性的 AP 并混淆客户端。\n\n\
  ![Image](img/w.jpg)**A** 是错误的，因为 `Airsnarf` 不是对网络上的 AP 进行 `MAC flooding`。\n\n![Image](img/w.jpg)**B**\
  \ 是错误的，因为 `Airsnarf` 不是对网络上的 AP 发起 `DoS`。\n\n![Image](img/w.jpg)**C** 是错误的，因为 `Airsnarf`\
  \ 不是为了破解网络密码。\n\n![Image](img/w.jpg)**D** 是错误的，因为 `Airsnarf` 并不是通过这种方式来获取用户名和密码。\n\
  \n### [16.](https://ch7.xhtml#ans16)\nWPA2 的完整性检查机制是什么？\n\n**A.** `CBC-MAC`\n**B.**\
  \ `CCMP`\n**C.** `RC4`\n**D.** `TKIP`\n\n![Image](img/r.jpg)**A.** 如果你没有阅读和学习，这个题会很棘。WPA2\
  \ 使用 `CCMP` 作为其加密协议，而 `CCMP` 使用 `CBC-MAC` 进行身份验证和完整性检查。计数模式密码认证码协议是为 802.11i 无线网络设计的。`CCMP`\
  \ 使用 `CBC-MAC` 进行身份验证和完整性检查。至于它具体如何提供完整性，真正的技术术语答案很长且令人混乱，但简而言之：消息使用块密码加密，并且每个块的加密依赖于前一个块的加密值。换句话说，如果块\
  \ 2 被任何修改，那么块 3、4 等的解密将变得不可能。关于 `CCMP` 的最后一点：`CCMP` 基于 `AES` 处理，并使用 128 位密钥和 128\
  \ 位块大小，`ECC` 有时称之为 `AES-CCMP`。\n\n![Image](img/w.jpg)**B** 是错误的，因为 `CCMP` 是使用 `CBC-MAC`\
  \ 的加密协议。\n\n![Image](img/w.jpg)**C** 是错误的，因为 `RC4` 是 WEP 使用的加密算法。\n\n![Image](img/w.jpg)**D**\
  \ 是错误的，因为 `临时密钥完整性协议` 用于 `WPA`。\n\n\n\n\n\n### **D.** 将 `SSID` 长度增加到最大值可以增加系统的安全性。\n\
  \n![Image](img/r.jpg) **A.** `WPA2` 是目前你系统更好的安全选择。它利用了 `TKIP`，每 10,000 个数据包更换密钥，而不是在整个会话中使用同一个密钥（如\
  \ `WEP` 中）。此外，`WPA2` 使用 `AES` 进行加密并使用 128 位加密密钥，而不是 `WEP` 中的 `RC4` 和 24 位 IV。\n\n\
  ![Image](img/w.jpg) **B** 是错误的，因为 `WEP` 提供的隐私保护仅等于处于有线网络。它的“加密”破解起来轻而易肘，不被认为是有效的安全措施。如果你的目标只是阻碍随意的上网者（如你的邻居）连接到你的网络，使用它是完全合理的，但它不是一种有效的加密方法。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为这两个选项对传输的实际数据没有任何保护作用。考虑到 `SSID` 包含在每个数据包的每个报头中（更不用说\
  \ `SSID` 并非为安全设计），`SSID 隐藏` 毫无意义。`MAC 过滤`会让偶然观察者感到困扰；然而，在网络上伪造 `MAC` 地址相对容易，这使其无法成为一种万全的安全方法。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 `SSID` 的长度与安全和加密没有任何关系。增加 `SSID` 的长度不会增加网络安全性。\n\
  \n**18.** 一位渗透测试同事尝试在目标建筑内部使用无线连接。在他的 Linux 笔记本电脑上，输入了以下命令：\n\n```\nifconfig wlan0\
  \ down\nifconfig wlan0 hw ether 0A:0B:0C:1A:1B:1C\nifconfig wlan0 up\n```\n\n此操作最可能的原因是什么？\n\
  \n**A.** 接入点开启了端口安全。\n\n**B.** 接入点隐藏了 `SSID`。\n\n**C.** 接入点开启了 `MAC 过滤`。\n\n**D.**\
  \ 信号微弱导致连接接入点困难。\n\n![Image](img/r.jpg) **C.** 上述命令的序列是攻击者关闭无线接口，更改其硬件地址，然后将其重新启用。最可能的原因是\
  \ `AP` 上开启了 `MAC 过滤`，它限制仅允许管理员想要连接到无线网络的机器。绕过此点的简单方法是监控流量并复制一个 `MAC` 地址。通过在你自己的硬件上进行快速伪造，你就可以连接了。顺带一提，`MAC`\
  \ 伪造不仅限于无线世界。命令会略有不同（`wlan0` 指无线网卡；`eth0` 是有线端口的示例），但原理相同。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为无线接入点没有端口安全选项。如果该攻击者连接的是交换机，这可能是正确的，但在无线连接上则不然。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 `SSID 隐藏` 与此无关。\n\n![Image](img/w.jpg) **D** 是错误的，因为信号微弱与此无关。\n\n\
  **19.** 攻击者在目标内部成功配置并设置了一个恶意的 `AP`。当个人连接时，他执行了 `MITM` 并请求重定向到恶意页面。以下哪个工具最可能用于此？\n\
  \n**A.** `Aircrack-ng`\n\n**B.** `Kismet`\n\n**C.** `Ettercap`\n\n**D.** `honeypot`\n\
  \n![Image](img/r.jpg) **C.** 在提供的选项中，`Ettercap` 最符合要求。首先，你应该知道 `Ettercap` 现在已很大程度上过时了——大多数现代系统都能防御它。但你无疑会看到关于它的问题，所以让我们深入研究。\n\
  \n`KRACK` 的原理是利用所有 `WPA2` 无线网络采用的四次握手。在交换过程中，无线系统会发送一种称为 `ANonce` 的东西（大致是一个一次性的随机生成的数字）。客户端接收它，运行自己的计算，并用另一个随机生成的\
  \ `SNonce` 响应。如果一切正常，无线系统会发送 `GTK`（组临时密钥），这是 `WPA2` 系统用于广播和多播消息的加密密钥。如果一切正常，客户端连接，你就可以开始运行了。\n\
  \n在 `KRACK` 攻击中，坏人运行的克隆系统不断向客户端重新发送握手的第三部分。每次客户端接受连接请求，一小段数据就会解密，经过多次迭代，加密密钥就会被破解。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 `MITM` 不是用于此的。\n\n![Image](img/w.jpg) **B**\
  \ 是错误的，因为 `Kismet` 不是此工具。\n\n![Image](img/w.jpg) **D** 是错误的，因为 `honeypot` 不是用于此的。\n\
  \n**20.** 一位慈善机构的工作人员访问了她合作多次的客户。当她打开笔记本电脑时，她不知道，一个攻击者设置了一个细节相同的克隆网络。当她的连接开始时，他发送并持续重新发送握手的第三步。经过多次迭代后，攻击者获得了足够的解密数据来破解加密密钥。以下哪项最能描述这种攻击？\n\
  \n**A.** `WIPS`\n\n**B.** `antenna`\n\n**C.** `WACL`\n\n**D.** `HIDS`\n\n![Image](img/r.jpg)\
  \ **A.** 在提供的选项中，`WIPS` 是最佳选择。首先，你应该知道 `WIPS` 是一种设备，其功能包括监控无线流量并采取应对措施。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 `antenna` 不是用于此的。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `WACL` 不是用于此的。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 `HIDS` 不是用于此的。\n\n\n\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 MAC 欺骗攻击是指攻击者伪造允许接入网络的系统的 MAC 地址（接入点 AP 可以使用 MAC 过滤仅允许特定设备连接）。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为 aLTEr 攻击专注于 LTE（长时演演进，又称“4G”）设备。aLTEr 攻击者基本上是建立自己的蜂窝信号设备，并向目标设备发送信号。一旦目标设备接受了恶意的连接源，它们与网络之间的所有传输内容攻击者都可以看到。对于你的学习来说，重要的一点是，攻击者需要一些非常重要的硬件，并且必须离目标足够近，操作才能生效。\n\
  \n# 第 8 章\n\n## 移动通信与物联网\n\n本章包含来自以下主题的问题：\n\n• 描述移动平台攻击\n• 识别移动设备管理\n• 识别移动平台漏洞和攻击向量\n\
  • 识别 IoT 安全威胁和攻击\n• 列出 IoT 安全和黑客工具\n• 列出 IoT 黑客方法论\n\n我成长在一个电视只有三个频道的时代，音乐行业因为一项新技术允许任何人录制自己的音乐（磁带）而群群愤，如果你需要和某人谈论某事，你要么和他们面对面，要么给他们他们唯一的家里电话打电话（并希望他们在）。哦，当然，超级富豪的林姆轿车里装了电话（实际上没多于华丽的\
  \ CB 无线电设备），但手机的概念直到 20 世纪 80 年代初才真正进入公众视野。事实上，这项技术的首次真正尝试是在 1973 年，当时摩托罗拉的研究人员创造了一个被称为“移动电话”的东西。手持部分采用了惊人的\
  \ 8 比 5 英寸，重量约 2.½ 磅，提供了惊人的 30 分钟通话时间。\n\n在经过十年的进一步研究和尝试将技术推向市场后，第一个模拟蜂窝网络（高级移动电话，`AMPS`）进入美国，一家名为\
  \ `DynaTAC` 的公司发布了一种在技术圈内嘲嘲了数十年的设备——包提手机。尽管该系统重量且笨重，而且它只能提供半小时的通话时间，却需要近 10 小时的充电，但对它的需求是惊人的，成千上上万的人在等待名单上签名。\n\
  \n我清楚地记得看到人们开着那些超级酷的巨型电池手机，随地可以使用，我感到是多么嫉妒。我甚至考虑过买一个，还记得第一次把那个大包包挂在头顶，让带子搁在肩膀上，这样我就能举起连接电线的手持部分并拨家里电话。回起来，这看起来真的很愚蠢，但消费者群体这种强烈的欲望推动了移动设备技术的爆炸，并改变了世界。你看，一旦人们发现在那些无线山丘中可以赚钱，手机研究和技术就进入了高潮，并持续到今天。然而，并不是所有的虚拟眼睛都只盯着那台谦虚的手机。突然之间，我们在《星际迷航》中看到的那些酷东西似乎不仅可能，而且很有可能。\n\
  \n1989 年，在 1983 年为 `IBM PC` 开发了第一个 `TCP/IP` 协议栈的开发者 John Romkey 受邀在当年的 `Interop`\
  \ 会议上让观众大开眼镜。尽管他广受认可和尊重，但主题的范围几乎是无止尽的，`Interop` 的主席 Dan Lynch 肯定期待一些令人惊叹的东西。于是，Romkey\
  \ 创建了一个可以通过互联网开启和关闭的烤面包机。是的。你读得没错。一个你可以连接到网络的烤面包机。\n\n将电器连接到网络是前所未闻的——而且绝对不是网络设计的初衷。这种想法本身几乎是亵渎的……直到它成功了。这件不锈钢的美品——`Sunbeam\
  \ Deluxe 自动辐射控制烤面包机`——确实连接到了网络。\n\n\n\n\n**A.** 制定 BYOD（自带设备）策略，并确保所有员工都了解并知晓该策略。\n\
  \n**B.** 将应用程序加入白名单，并确保所有员工都了解并知晓这些程序。\n\n**C.** 允许越狱和 root 的设备接入网络，前提是员工已签署了相关政策。\n\
  \n**D.** 实施 MDM（移动设备管理）。\n\n## 2. 下列哪个工具会被用于黑客攻击（blackjacking）攻击？\n\n**A.** Aircrack\n\
  **B.** BBCrack\n**C.** BBProxy\n**D.** Paros Proxy\n\n## 3. 下列哪个工具是用于 Android 设备的漏洞扫描器？\n\
  \n**A.** X-ray\n**B.** evasi0n7\n**C.** Pangu\n**D.** DroidSheep Guard\n\n## 4.\
