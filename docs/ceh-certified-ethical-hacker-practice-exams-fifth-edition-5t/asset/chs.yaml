  \n\n# 1.\nBart 收到一封似乎来自他律师的电子邮件，包含一个名为 `Courtdoc.zip` 的 ZIP 文件。Bart 双击该 ZIP 文件打开，弹出一个显示“此\
  \ Word 文档损坏”的消息。在后台，一个名为 `Courtdoc.zip.exe` 的文件正在运行并将其复制到本地 `APPDATA` 目录。然后它开始向外部服务器发送信标。以下哪项最能描述\
  \ Bart 安装的恶意软件？\n\n**A.** 蠕虫\n**B.** 病毒\n**C.** 木马\n**D.** 宏\n\n![Image](img/r.jpg)\
  \ **C.** 木马（Trojan）的定义是一种非自我复制的程序，它看起来有用的用途，但实际上具有不同的恶意目的。换句话说，它看起来无害，但在激活时并非无害。这正是本例中正在发生的情况。电子邮件不是传播`Trojan`的*唯一*方法，但钓鱼攻击确实非常有效。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为这描述的不是`worm`（蠕虫）。`worm`是一种自我复制、自我传播、自包含的程序，利用网络机制来传播自己。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为这描述的不是`virus`（病毒）。`virus`是一种具有自我复制能力的恶意计算机程序，它附于另一个文件并随宿主从一台计算机移动到另一台计算机。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为这描述的不是`macro`（宏）。`macro`是一条指令，可以自动扩展为多条指令以执行特定任务（就你的考试而言，通常与\
  \ Microsoft Office 产品相关）。\n\n# 2.\n你已经与目标机器建立了 `Netcat` 连接。可以使用哪个标志位来启动程序？\n\n**A.**\
  \ -p\n**B.** -a\n**C.** -l\n**D.** -e\n\n![Image](img/r.jpg) **D.** `Netcat` 通常被称为黑客攻击的瑞士军刀。你可以用它在目标机器上设置监听端口，然后再次访问该端口以制造各种混乱。与启动程序相关的标志位是\
  \ `-e`。例如，执行命令\n\n\n\n```bash\nnc –L –p 12657 –t –e cmd.exe\n```\n\n将在目标机器上打开一个\
  \ Windows 命令行壳；`-t` 标志通过你用 `-p` 标志定义的端口（`12657`）建立 Telnet 连接。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为 `-p` 标志表示你想要为会话使用的协议端口。\n\n![Image](img/w.jpg) **B** 是错误的，因为 `-a`\
  \ 不是可识别的 `Netcat` 标志。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `-l` 标志表示 `Netcat` 打开监听端口。顺便提一下，`-L`\
  \ 标志的作用相同；但它会在入站会话完成后重新启动监听。\n\n# 3.\nClaire 正在浏览网页，一段时间后弹出一个消息显示她的系统已被恶意软件感染，并提供了一个点击以删除病毒的按钮。在她点击按钮后，出现了另一个消息窗口显示由于感染性质，系统已被隔离，并提供了一个带有支付说明的链接以便重新获得控制并清除病毒。以下哪项最能描述这种感染？\n\
  \n**A.** 间谍软件\n**B.** 勒索软件\n**C.** 木马\n**D.** 广告软件\n\n![Image](img/r.jpg) **B.**\
  \ `ransomware`（勒索软件）的名字暴露了它的目的：恶意软件感染你的系统，然后限制对你的文件和文件夹的访问，要求支付赎金以重新获得控制。ECC 列出了五个不同的`ransomware`家族：`Cryptorbit`、`Cryptolocker`、`Cryptodefense`、`Cryptowall`\
  \ 和警察主题。通常在线支付涉及 `bitcoin`，也可以通过其他途径。无论如何，永远不要攻击者付费——你只会给自己招麻烦。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为这描述的不是`spyware`（间谍软件）。`spyware`是一种秘密收集用户信息的恶意软件。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为这描述的不是`Trojan`（木马）。`Trojan`是一种非自我复制的程序，它看起来有用的用途，但实际上具有恶意目的。\n\n\
  ![Image](img/w.jpg) **D** 是错误的，因为这描述的不是`adware`（广告软件）。`adware`是在内部显示广告的软件。\n\n#\
  \ 4.\nMatty 正在检查恶意软件而不运行它。相反，她正在检查源代码、函数调用和其他指标。以下哪项最能描述 Matty 正在进行的分析类型？\n\n**A.**\
  \ 静态\n**B.** 动态\n**C.** 文件指纹\n**D.** 代码模拟\n\n![Image](img/r.jpg) **A.** ECC 定义了两种主要的恶意软件类型——`static`（静态）和`dynamic`（动态）。在静态分析中，检查人员从不实际执行恶意软件。这被认为是“安全的”分析，但有一些静态工具可以帮助。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为`dynamic`分析是在监控环境中通过实际安装和运行恶意软件来检查检查的过程。\n\n\
  ![Image](img/w.jpg) **C** 是错误的，因为`file fingerprinting`（文件指纹）涉及为定的二进制文件计算哈希值。\n\n\
  ![Image](img/w.jpg) **D** 是错误的，因为`code emulation`（代码模拟）是一种检测方法，杀毒软件在虚拟机上执行恶意代码以模拟\
  \ CPU 和内存活动。\n\n# 5.\n渗透测试成员 Amy 尝试猜测 TCP 会话的 ISN。她最可能正在进行什么攻击？\n\n**A.** XSS\n\
  **B.** 会话拼接\n**C.** 会话劫持\n**D.** 多部分攻击\n\n![Image](img/r.jpg) **C.** `session hijacking`（会话劫持）背后的思想非常简单：攻击者等待会话开始，在完成所有烦人的身份验证后，跳入并窃取会话给自己用。在实践中，这比这要稍微困难且复杂得多，但整个攻击的关键在于确定用于会话的初始序列号（`ISN`）。`ISN`\
  \ 由会话发起者在第一步（`SYN`）中发送。这在握手的的第二步（`SYN/ACK`）中通过将该 `ISN` 加 1 得到确认，另一个 `ISN` 由接收者生成。这个第二个数字由发起者在第三步（`ACK`）中确认，从那里开始通信就可以进行。根据\
  \ EC-Council 的说法，以下步骤描述了会话劫持：\n\n1. 嗅探客户端和服务器之间的流量。\n2. 监控流量并预测序列编号。\n3. 使会话与客户端不同步。\n\
  4. 预测会话令牌并接管会话。\n5. 向目标服务器注入数据包。\n\n\n\n\n坦率地说，通过 EC-Council 对此事的解读来实施这种攻击，需要你进行相当大量的流量嗅探。而且如果你最初已经处于可以嗅探流量的位置，那么整个场景可能就变得没有意义了呢？你在考试中需要了解这一点，但在现实世界中的应用可能较少。\n\
  \n![Image](img/w.jpg)**A** 是错误的，因为跨站脚本是一种 Web 应用程序攻击。\n\n![Image](img/w.jpg)**B**\
  \ 是错误的，因为会话拆分（session splicing）是一种 IDS 规避方法。攻击者通过将负载“切分”到多个数据包中，交付一个 IDS 本会看到的负载。该负载可以分布在很长的时间内。\n\
  \n![Image](img/w.jpg)**D** 是错误的，因为 `multipartite` 指的是一种病毒类型，而不是需要确定 ISN 的攻击。\n\n\
  ### 6.\n攻击者希望让他的恶意软件尽可能隐蔽且不可检测。他采用了一种使用压缩技术来减小恶意软件大小的方法。以下哪项最能描述这种行为？\n\n**A.**\
  \ 加密器 (Crypter)\n**B.** 封装器 (Wrapper)\n**C.** 壳器 (Packer)\n**D.** 压缩器 (Compressor)\n\
  \n![Image](img/r.jpg)**C.** 壳器使用压缩将恶意软件执行文件封装成更小的尺寸。这不仅减小了文件大小，还让恶意软件更难被某些防毒引擎检测。虽然它可以与\
  \ `ZIP` 文件进行比较，但它们存在差异。例如，提取是在内存中进行的，而不是磁盘上。但壳器与像 `.zip` 这样的通用压缩程序之间的 `primary`\
  \ 区别在于，壳器在运行时对二进制文件进行解胀/恢复（而 `.zip` 提供的是更通用的压缩）。\n\n![Image](img/w.jpg)**A** 是错误的，因为加密器（crypter）是一种软件工具，它结合加密和代码操纵，使恶意软件无法被\
  \ AV 和其他安全监控产品检测（在互联网术语中，它被称为 `fud,`，代表“完全不可检测”）。\n\n![Image](img/w.jpg)**B** 是错误的，因为封装器（wrapper）用于将木马和合法程序绑定在一起，以便在执行合法程序时安装木马。\n\
  \n![Image](img/w.jpg)**D** 仅作为干扰项包含，并不是一个合法的术语。\n\n### 7.\n以下哪项最能描述一种网络攻击，攻击者获得你的网络访问并长时间保持不被发现？\n\
  \n**A.** 无文件恶意软件\n**B.** 僵尸网络 (Zombie)\n**C.** 放大攻击 (Fraggle)\n**D.** 高级持续性威胁 (APT)\n\
  \n![Image](img/r.jpg)**D.** NIST 对高级持续威胁（APT）的定义如下：“具有高水平专业知识和大量资源的对手，使其通过使用多种不同的攻击向量（例如网络、物理和欺骗）来创造实现其目标的机会，这些目标通常是在组织的信息技术基础设施内建立并扩展立足点，以持续外泄信息，和/或破坏或阻碍任务、计划或组织的关键方面，或者在未来处于可以这样做的位置；此外，高级持续威胁在很长时间内反复追求其目标，适应防御者的抵抗努力，并下决心维持执行其目标所需的交互水平。”\n\
  \n我不知道你们怎么想，但那段长篇文字让我想起了在使用 iPhone 之前必须接受的协议条款。\n\n这真正的意思是 APT 是坏人（通常是资金充足的国家级攻击者），他们找到了进入你系统的方法，并在那里停留了很长时间。从事件响应（IR）的角度来看，APT\
  \ 是一场噩梦，因为要追踪初始攻击向量、他们存在了多久以及他们访问了多少内容几乎是不可能完成。\n\n![Image](img/w.jpg)**A** 是错误的，因为无文件恶意软件利用现有漏洞来感染系统。\n\
  \n![Image](img/w.jpg)**B** 是错误的，因为僵尸网络（zombie）指的是被控制并响应请求的系统。\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，因为放大攻击（fraggle）是指使用 UDP 数据包发送到广播地址。\n\n### 8.\n攻击者利用系统中的 `Beacon` 劫持浏览器会话。以下哪项最能描述这种攻击？\n\
  \n**A.** 浏览器劫持 (Man in the browser)\n**B.** 中间人 (Man in the middle)\n**C.** 内部渗透\
  \ (Man in the pivot)\n**D.** IE 劫持 (IE hijacking)\n\n![Image](img/w.jpg)**A.** 大多数人都听说过会话劫持和中间人，但浏览器劫持呢？浏览器劫持（MITB）攻击发生在木马位于浏览器内部，允许其查看并交互浏览器会话。Cobalt\
  \ Strike 在几年前增加了此功能。如果你在目标机器上有一个 `Beacon`，就可以有效地设置一个本地代理并将浏览器指向它，现在你可以在用户不知情的情况下浏览。\n\
  \n![Image](img/w.jpg)**B** 是错误的，因为这并不一定描述中间人（MITM）攻击，攻击者位于客户端和服务器之间拦截（并有时篡改）传输的数据。\n\
  \n![Image](img/w.jpg)**C** 和 **D** 是错误的，因为这些不是合法的术语。\n\n### 9.\nClaire 工作的 Windows\
  \ 系统开始显示异常，她联系了 IT 人员。调查显示，Claire 的系统感染了多种病毒。IT 人员通过删除多个文件和文件夹并使用 AV 工具删除了病毒，然后将机器连接到网络。当天晚些时候，Claire\
  \ 的系统再次显示异常，IT 人员再次被联系。以下哪些项可能是再次感染的原因？（选择所有适用项）\n\n**A.** Claire 再次访问了恶意网站。\n**B.**\
  \ Claire 打开了 Microsoft Outlook 邮件客户端，新收到的邮件被加载到本地文件夹 `.pst` 中。\n**C.** Claire 使用系统还原点重新访问被删除的文件和文件夹。\n\
  **D.** Claire 使用组织的备份应用程序恢复文件和文件夹。\n\n\n\n\n\n即使有工具帮助删除，管理员也无法忽视系统还原点、备份和用户行为。如果病毒在执行系统还原复制操作时存在于系统中的，那么对该点的任何还原操作都将重新安装病毒。数据备份本身也是如此——一个被感染的文件在备份时被感染，在还原操作期间将保持被感染状态。至于用户行为，如果用户在访问特定网站后立即被再次感染，或者在使用\
  \ USB（或其他可移动媒体）后，你至少可以确定源头，并希望阻止其再次发生。\n\n![Image](img/w.jpg) **B** 是错误的，因为来自服务器的新邮件并不一定是原始感染的成因。\n\
  \n### 10. 关于木马，以下哪项最准确地描述了“包装器（wrapper）”？\n\n**A.** 木马附带的合法文件\n**B.** 用于将木马绑定到合法文件的程序\n\
  **C.** 一种使用压缩的混淆方法\n**D.** 使用使用加密和代码操纵来隐藏恶意软件的软件工具\n\n![Image](img/r.jpg) **B.**\
  \ `Wrappers`（包装器）是允许你将选择的可执行文件（木马）绑定到目标不会介意打开的无害文件的程序。例如，你可能使用类似 `EliteWrap` 的程序将后门应用程序嵌入游戏文件（`.exe`）中。目标机器上的用户随后打开最新的游戏文件（可能是为了和电脑玩一局牌，或者为了向猪建造的金字塔上投掷鸟），而你的后门正在安装并静静坐在那里等待你稍后使用。顺便提一下，许多包装器本身被认为是恶意的，会出现在任何更新过的病毒特征列表中。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为包装器并不是恶意软件所绑定的合法文件。\n![Image](img/w.jpg) **C**\
  \ 是错误的，因为这描述的是壳器（packer）。\n![Image](img/w.jpg) **D** 是错误的，因为这描述的是加密器（crypter）。\n\
  \n### 11. 2017 年 5 月，这种勒索软件利用了一个名为“永恒之蓝”（Eternal Blue）的 Windows SMB 漏洞，并在几小时内传遍全球。代码内部一个隐藏的“杀死开关”被迅速发现，阻止了它的传播。以下哪项最符合这一描述？\n\
  \n**A.** Petya\n**B.** WannaCry\n**C.** Zeus\n**D.** 僵尸网络 (Botnet)\n\n![Image](img/r.jpg)\
  \ **B.** `WannaCry` 是历史上传播最快、最危险的勒索软件变种之一。它利用了 `Eternal Blue`（有趣的是，这是美国国家安全局发现并共享的漏洞），`WannaCry`\
  \ 在几小时内扩散到全球系统，要求用比特币支付赎金。尽管已有可用的补丁，但由于许多各种原因，数百万系统未打补丁且未做好攻击攻击准备。几天后，人们发现了一个内置的杀死开关——向一个不存在的域名发送响应包，该域名是由研究人员注册的以停止传播。\n\
  ![Image](img/w.jpg) **A** 是错误的，因为 `Petya`——虽然也利用了 `Eternal Blue`——但与它的姐妹节点 `WannaCry`\
  \ 有几点不同。`Petya` 在很大程度上似乎是你无法付钱解决的勒索软件。考虑到它的发布时间、外观以及在乌克兰的独特性（至少初期），推测它更多是一种具有政治动机的破坏性恶意软件，而不是合法的勒索软件尝试。\n\
  ![Image](img/w.jpg) **C** 是错误的，因为 `Zeus` 是一个银行木马。\n![Image](img/w.jpg) **D** 是错误的，因为\
  \ `botnet` 指受攻击者控制的僵尸系统组。\n\n### 12. 以下哪项是数据传输的合法通信路径？\n\n**A.** 显性 (Overt)\n**B.**\
  \ 隐蔽 (Covert)\n**C.** 真实 (Authentic)\n**D.** 模仿 (Imitation)\n**E.** 实际 (Actual)\n\
  \n![Image](img/r.jpg) **A.** 这是另一类你在考试中绝不能错过的简单、纯定义题。无论是在计算机内部、系统之间还是跨越互联网，任何用于通信和数据交换的合法通道都被称为\
  \ `显性通道（overt channel）`。不要让任何通道固有的风险为你做决定——即使通道本身是一项风险活动，只要它被按预期用途使用，它仍然是显性的。例如，只要使用它的应用程序是合法的，`IRC`\
  \ 或游戏链接仍然是显性通道。显性通道是程序跨系统或网络使用的合法通信通道，而隐蔽通道（covert channels）用于以非预期的方式传输数据。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为根据 EC-Council 的定义，隐蔽通道是“以违反安全策略的方式在计算机系统或网络内传输信息的通道”。例如，木马可能会创建一个用于窃取密码或从机器中下载敏感数据的通道。\n\
  ![Image](img/w.jpg) **C, D,** 和 **E** 是错误的，因为这些中都不是描述通信通道的术语；它们被包含在这里是作为干扰项。\n\n\
  ### 13. 会话劫持是在 OSI 模型的哪一层执行的？\n\n**A.** 数据链路层\n**B.** 传输层\n**C.** 网络层\n**D.** 物理层\n\
  \n![Image](img/r.jpg) **B.** 如果你考虑一下劫持，这是合理的。身份验证已经发生，所以我们知道两台电脑已经找到了对方。现在，对于那些大喊通信可以在每一层且确实被劫持的现实世界人士，让我提醒一下：在现实世界中，物理层拦截会导致一切，但在考试中只需记住“会话劫持\
  \ = 传输层”。\n\n![Image](img/w.jpg) **A, C,** 和 **D** 是错误的。\n\n### 14. 渗透测试成员输入以下命令：\n\
  \n`nc 222.15.66.78 -p 8765`\n\n关于这次尝试，以下哪个陈述是？\n\n**A.** 攻击者试图连接到远程计算机已建立监听端口。\n\
  **B.** 攻击者正在其机器上建立监听端口供以后使用。\n**C.** 攻击者正对远程计算机进行拒绝服务攻击 (DoS)。\n**D.** 攻击者试图杀死远程机器上的某个服务。\n\
  \n![Image](img/r.jpg) **A.** 如前所述，Netcat 是一种允许对机器进行远程访问魔法的奇妙工具，你能够识别其语法的基础。在命令示例中，Netcat\
  \ 被告知：“请尝试连接到 IP 地址为 222.15.66.78 端口 8765 的机器；我相信你会发现该端口处于监听状态，等待我们的到来。”显然，在在其本地上发布此命令之前，渗透测试人员已将\
  \ Netcat 木马植入远程系统 (222.15.66.78) 并将其设为监听状态。他可能使用以下命令设置了命令 访问（允许类似 Telnet 的连接以随意执行命令）：\n\
  \n```\nnc -L -p 8765 -t -e cmd.exe\n```\n\n\n\n\n\n![Image](img/w.jpg) **B** 是错误的，因为该命令是在设置的客户端侧发出的，而不是在服务器侧。在之前的某个时刻，端口被设置为监听状态，而此\
  \ `Netcat` 命令将访问它。\n\n![Image](img/w.jpg) **C** 是错误的，因为该命令并没有试图对目标机器进行拒绝攻击。它被包含在这里作为干扰项。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为该命令并没有尝试杀死远程机器上的进程或服务。它被包含在这里作为干扰项。\n\n### 15.\n\
  检查列出的部分命令行输出：\n\n![Image](img/f0244-01.jpg)\n\n关于该输出，以下哪项描述是正确的？\n\n**A.** 这是 `netstat\
  \ -an` 命令的输出。\n\n**B.** 这是 `netstat -b` 命令的输出。\n\n**C.** 这是 `netstat -e` 命令的输出。\n\
  \n**D.** 这是 `netstat -r` 命令的输出。\n\n![Image](img/r.jpg) **A.** 你在考试前需要了解 `Netstat`。它不是什么了不起的东西，你不会深陷细节，但你确实需要知道基础知识。`Netstat`\
  \ 是一个内置在每个微软操作系统中的优秀命令行工具。根据微软官方描述，`Netstat` “显示活动 TCP 连接、计算机正在监听的端口、以太网统计数据、IP\
  \ 路由表、IPv4 统计数据（针对 IP、ICMP、TCP 和 UDP 协议）以及 IPv6 统计数据（针对 IPv6、ICMPv6、TCP over IPv6\
  \ 和 UDP over IPv6 协议）。”它是一种查看系统开启了哪些端口的简单方便方法，可以帮助你识别任何可能存在的木马。`netstat -an` 命令将以数字形式显示所有连接和监听端口。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为 `-b` 选项显示创建每个连接或监听端口涉及的可执行文件。它的输出如下：\n\n![Image](img/f0245-01.jpg)\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为 `-e` 标志显示系统的以太网统计数据。输出如下：\n\n![Image](img/f0245-02.jpg)\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 `-r` 标志显示系统的路由表。以下是输出示例：\n\n![Image](img/f0245-03.jpg)\n\
  \n### 16.\n你正在与一名新的渗透测试成员讨论恶意软件，他询问有关重启可执行文件。Windows 中的哪些注册表会自动运行可执行文件和指令？（选择所有项）\n\
  \n**A.** `HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServicesOnce`\n\
  \n**B.** `HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\RunServices`\n\
  \n**C.** `HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\RunOnce`\n\
  \n**D.** `HKEY_LOCAL_MACHINE\\Software\\Microsoft\\Windows\\CurrentVersion\\Run`\n\
  \n![Image](img/r.jpg) **A, B, C, D.** 创建恶意软件并感染机器仅完成了基础工作。让它在用户重启机器时重新启动从而留下来？这才是真正的关键。`HKEY_LOCAL_MACHINE`\
  \ 键下的 `Run`、`RunOnce`、`RunServices` 和 `RunServicesOnce` 注册表项是放置可执行文件的绝位置。因此，偶尔运行注册表监控以检查任何可疑情况是有帮助的。`Sys\
  \ Analyzer`、`Regshot` 和 `TinyWatcher` 都是此类的选项。\n\n### 17.\n以下哪项是正确的？\n\n**A.** 序列预测攻击专门针对\
  \ TCP。\n\n**B.** 以非预期方式使用协议是显式通道（overt channel）的示例。\n\n**C.** 所有的 DoS 和 DDoS 攻击都针对\
  \ TCP。\n\n**D.** `Fraggle` 是基于 TCP 的攻击。\n\n![Image](img/r.jpg) **A.** 序列预测攻击专门针对\
  \ TCP，因为 TCP 使用序列号。与 `UDP` 采用的“发后即不管”的方法不同，`TCP` 使用序列号和窗口来跟踪对话。序列预测是一种会话劫持程序，攻击者猜测下一个序列号，并切入客户端和服务器之间的数据连接。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为这是隐蔽通道（covert channel）的示例。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为并不是所有的 DoS 和 DDoS 攻击都基于 TCP。\n\n![Image](img/w.jpg) **D** 是错误的，因为\
  \ `fraggle` 是基于 UDP 的 DoS 攻击。\n\n### 18.\n哪种拒绝服务攻击涉及使用多个中间和辅助机器来参与攻击？\n\n**A.**\
  \ `SYN flood`\n\n**B.** `DRDoS`\n\n**C.** `Application-level flood`\n\n**D.** `LOIC`\n\
  \n![Image](img/r.jpg) **B.** 分布式反射攻击 (`DRDoS`) 也称为“伪造”攻击，它利用了多个中间机器。坏人将攻击信息发送给中间机器，再由这些机器发送消息。这使得追踪真实源变得非常困难。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 `SYN flood` 利用的是半开连接。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为应用层泛洪是针对应用程序的 DoS 行为。\n\n![Image](img/w.jpg) **D** 是错误的，因为 Low Ion\
  \ Cannon (`LOIC`) 是一种易用的 DDoS 工具，它使用 `TCP`、`UDP` 或 `HTTP` 请求淹没目标。它曾被用于针对索尼 PlayStation\
  \ 网络的协同攻击，此后许多人加入僵尸网络以支持各种攻击：美国唱片协会、PayPal、MasterCard 以及其他几家公司都是 `LOIC` 的受害者。\n\n\
  ### 19\n以下哪项最能描述利用现有漏洞感染合法软件以执行恶意活动的恶意软件？\n\n**A.** `Fileless malware`\n\n**B.**\
  \ `APT`\n\n**C.** `Dynamic analysis`\n\n**D.** `Ping of death`\n\n![Image](img/r.jpg)\
  \ **A.** 在阅读关于无文件恶意软件（fileless malware）时，我看到一种描述说它被称为“非恶意软件”。虽然这让我付之一笑，但其中的观点非常正确：无文件恶意软件并不像病毒或木马那样可以被杀毒软件发现、检查和拦截。无文件恶意软件旨在利用现有漏洞，让系统中的合法服务来执行坏人的意愿。无文件恶意软件驻留在\
  \ `RAM` 中，并将代码注入各种运行进程中。\n\n![Image](img/w.jpg) **B** 是错误的，因为高级持续威胁 (`APT`) 指的是成功后仍嵌入环境中、未被检测并在进行监控和恶意活动的攻击。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为动态分析是指对系统中活跃运行的恶意软件进行分析。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为死亡之 ping 攻击涉及发送载荷异常巨大的 ping 请求。该 ping 会被分片，并在重组时杀死目标机器。\n\n### 20.\n\
  `IPSec` 是是一种防止会话劫持的有效预防措施。哪种 IPSec 模式只加密数据载荷？\n\n**A.** `Transport`\n\n**B.** `Tunnel`\n\
  \n**C.** `Protected`\n\n**D.** `Spoof`\n\n\n\n\n\n![Image](img/r.jpg) **A.** IPSec\
  \ 是一种极佳的加密机制，可以在两个端点之间很容易设置，如果适当配置了主机，甚至可以在整个子网之间设置。对于考试，你不需要了解 IPSec 的所有细节（谢天谢地，因为有很多内容要写），但你确实需要了解基础。传输模式（Transport\
  \ mode）完全不影响数据包头部，仅加密有效负载。它通常用于两个端点之间的安全连接，而隧道模式（Tunnel mode）则创建一个类似 VPN 的连接来保护整个会话。此外，传输模式与传统的网络地址转换\
  \ (`NAT`）兼容。\n\n![Image](img/w.jpg) **B** 是错误的，因为隧道模式封装了整个数据包，包括头部。这通常用于形成 VPN 连接，其中隧道跨越不可信的网络（如\
  \ Internet）。由于一些非常显而易见的原因，它与传统的 `NAT` 不兼容；当数据包通过路由器（或任何为你执行 `NAT` 的设备）时，数据包中的源地址因为隧道模式而发生变化，从而导致接收端的数据包无效。这个问题有解决方法，通常统称为\
  \ NAT 穿透（`NAT-t`）。许多家用路由器利用所谓的 `IPSec passthrough` 来允许这种操作。\n\n![Image](img/w.jpg)\
  \ **C** 和 **D** 是错误的，因为它们在 IPSec 的语境下是无效的术语。\n\n### 21. IPSec 中什么同时提供认证和机密性？\n\n\
  **A.** AH\n**B.** IKE\n**C.** OAKLEY\n**D.** ESP\n\n![Image](img/r.jpg) **D.** 封装安全载荷\
  \ (`ESP`) 是 IPSec 协议族的成员，它提供数据认证（证明数据确实来自其声称的来源）和机密性（通过加密数据）。在传输模式下，`ESP` 不为整个数据包提供完整性和认证，但在隧道模式中可以提供（当然，不包括外层\
  \ IP 头部）。\n\n![Image](img/w.jpg) **A** 是错误的，因为认证头（`AH`）提供认证但不提供加密。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 密钥交换（`IKE`）是产生安全密钥的协议。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `OAKLEY`\
  \ 是用于创建主密钥以及数据传输过程中每个会话特定密钥的协议。它在此过程中利用了 Diffie-Hellman 算法。\n\n### 22. 下述哪个陈述最描述欺骗（spoofing）与会话劫持（session\
  \ hijacking）之间的比较？\n\n**A.** 欺骗和会话劫持是同一件事。\n**B.** 欺骗中断了客户端的通信，而劫持不会。\n**C.** 劫持中断了客户端的通信，而欺骗不会。\n\
  **D.** 劫持模拟了外地 IP 地址，而欺骗指的是 MAC 地址。\n\n![Image](img/r.jpg) **C.** 会话劫持和欺骗有时会被混淆，尽管它们本不应该这样。`Spoofing`（欺骗）是指攻击机器伪装成它不是身份的过程。无论是通过伪造\
  \ MAC 地址还是 IP 地址，其核心思想是网络上的其他系统将像目标系统一样与你的机器进行通信（即建立和拆除会话）。通常这被用于辅助嗅探工作。劫持则是完全不同的物种。在劫持中，攻击者跳入一个已存在的会话，将客户端踢出并欺骗服务器继续交换。在许多情况下，客户端将只需通过另一个会话重新连接到服务器，而无人察觉：服务器甚至不知道发生了什么，客户端只是在另一个会话中重新连接。顺带一下，EC-Council\
  \ 将会话劫持描述为使用以下步骤：\n\n1. 嗅探客户端和服务器之间的流量。\n2. 流量并预测序列号。\n3. 预测会话。\n4. 向服务器注入数据包。\n\
  5. 接管。\n\n![Image](img/w.jpg) **A** 是错误的，因为认证头（`AH`）提供认证但不提供加密。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 密钥交换（`IKE`）是产生安全密钥的协议。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `OAKLEY`\
  \ 是用于创建主密钥以及数据传输过程中每个会话特定密钥的协议。它在此过程中利用了 Diffie-Hellman 算法。\n\n### 23. 下列哪项是会话劫持的有效威慑措施？\n\
  \n**A.** 安装基于主机的入侵检测系统 (`HIDS`）。\n**B.** 安装 `Tripwire`。\n**C.** 执行良好的密码策略。\n**D.**\
  \ 使用不可预测的序列号。\n\n![Image](img/r.jpg) **D.** 如前所述，会话劫持需要攻击者猜出被踢出的会话。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为基于主机的入侵检测系统可能无法威慑会话劫持。\n\n![Image](img/w.jpg) **B** 是错误的，因为 `Tripwire`\
  \ 是一个文件完整性应用程序，对会话劫持不起任何作用。\n\n![Image](img/w.jpg) **C** 是错误的，因为系统密码与会话劫持无关。\n\n\
  ### 24. 下列哪项是一组互联网计算机，在所有者不知或未许可的情况下将传输转发到其他计算机？\n\n**A.** 尸网络 (Botnet)\n**B.**\
  \ 僵尸主机 (Zombie)\n**C.** 蜜罐 (Honeypot)\n**D.** DDoS\n\n![Image](img/r.jpg) **A.**\
  \ 尸网络是一组受攻击者控制的系统，而所有者不知或未许可。网络中的每个僵尸系统都会为尸网络控制器发送消息和数据传输——涵盖从垃圾邮件、电子邮件到病毒和广告的一切。尽管它们可能因分布式拒绝服务攻击中的作用而闻名，但尸网络也可用于各种活动。顺带一下，ECC\
  \ 认为尸网络最常见通过 `IRC`（网络中聊天）控制，但在现实世界中，可以通过许多方法进行控制。\n\n![Image](img/w.jpg) **B** 是错误的，虽然尸网络是由僵尸计算机组成的，但单个僵尸并不构成一个尸网络。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为蜜罐是专门设置用于被黑客的系统，以便安全人员观察攻击者在做什么。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为分布式拒绝服务攻击可能由尸网络执行，但它并不定义尸网络。\n\n### 25. 下述哪个陈述最描述了发现给定二进制代码哈希值的过程？\n\
  \n\n\n\n\n### A. 字符串搜索\n### B. 依赖遍历\n### C. 文件指纹\n### D. 端口监控\n\n![Image](img/r.jpg)\
  \ **C.** 文件指纹是恶意软件分析中的一种功能，通过对二进制代码进行哈希（hash）处理来生成一个识别值。这可以用于识别其他恶意软件包，或者查看你正在检查的包是否发生了任何更改。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为`字符串搜索`指的是恶意软件分析中的一种功能，用于分析恶意代码中嵌入的可读文本字符串。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为在依赖遍历中，恶意软件分析器会构建恶意软件所有依赖模块的层级图。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为在端口监控中，恶意软件分析器使用端口监控工具来检查恶意软件尝试使用哪些端口。\n\n### [26.] 会话劫持是在何时进行的？\n\
  \n**A.** 三次握手之前\n**B.** 三次握手期间\n**C.** 三次握手之后\n**D.** FIN 包之后\n\n![Image](img/r.jpg)\
  \ **C.** 这个这个问题对你来说应该是很容易的，但在这里包含是为了强化这样一个观点：为了通过考试，你需要很好地理解会话劫持的步骤。当然，会话劫持应该发生在三次握手之后。事实上，你可能需要在三次握手后等待一段时间，以便让会话上的所有内容准备就——认证等乱七八糟的东西应该在你跳入并接管之前处理好。\n\
  \n![Image](img/w.jpg) **A** 和 **B** 是错误的，因为会话劫持发生在会话已经建立之后，为了让这一点成立，显然必须先进行三次握手。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 FIN 包会将 TCP 会话有序地关闭。天呐，你到底凭什么要等会话结束了才开始尝试劫持它呢？\n\
  \n# 第 11 章\n\n## 密码学基础\n\n本章包含以下主题的问题：\n\n* 描述密码学和加密技术\n* 定义加密算法\n* 描述公钥和私钥的生成概念\n\
  * 描述数字签名的组成和用途\n* 描述密码分析以及破解的工具和方法\n* 列举密码学攻击\n\n我住过四个不同的州和两个外国，沿途的每个停点都提供了不可替代、独特且非常酷的东西。而且几乎无一例外，在离开去新地点之前，我并不会珍惜那些不可替代、独特且酷的东西。也许回望并对不再属于你的东西进行浪漫化处理是人性的本能，但我认为在现在所在的地方停下来，审视你目前所拥有的东西，并有时惊叹这一切是如何组合在一起的，是有价值的。\n\
  \n技术也是如此，我们都有将其视为理所当然的错。然而，当你检查技术中几乎任何事物是如何工作时，你会发现简直是一场奇迹，是绝对不能被轻视或仅仅视为理所当然的（如重力或雨）。密码学就是一个典型的例子。\n\
  \n考虑我现在正在输入的这个文档。它由一堆 1 和 0 组成，排列方式使其在屏幕上以可读的格式呈现文本——更不用说我在这里输入的为了让文本更悦目而使用的各种字体格式、加粗、间距和其他好东西了。停停一下，考虑输入这个句子的简单动作，以及为了正确格式化以在屏幕上显示文本或保存并传输它需要多少位（bits）。然后想象一种加密文本的方法，同样使用一堆\
  \ 1 和 0。\n\n如果你真的仔细想，整个概念都是不可思议的，这是我们所有人都应该感激的事情。我的意思是，在写字时根据数字轮将一个字母替换为另一个字母，而找到一种使用同样一堆\
  \ 1 和 0 来加密文本的方法，这确实令人惊叹。\n\n\n\n\n\n### 4. 某人向网络管理员请教关于如何从家里发送加密电子邮件的建议。该终端用户不想支付任何许可费用或管理服务器服务。以下选项中哪项提供了一种发送加密电子邮件的方法，而无需支付许可费用或管理服务器？\n\
  \n**A.** IP 安全性 (IPSec)\n**B.** 多用途互联网邮件扩展 (MIME)\n**C.** 良好的隐私保护 (PGP)\n**D.**\
  \ 带有安全套接字层的超文本传输协议 (HTTPS)\n\n### 5. 下列哪项定义最能被定义为常用于电子邮件安全的加密协议？\n\n**A.** PGP\n\
  **B.** Keyczar\n**C.** RSA\n**D.** MD5\n\n### 6. 你正在向团队的一个新成员描述一个基本的 PKI 系统。他询问如何在系统内部以有序、受控的方式分发公钥，以便使用户能够确定发送者的身份。以下选项中哪项是你的答案？\n\
  \n**A.** 数字签名\n**B.** 哈希值\n**C.** 私钥\n**D.** 数字证书\n**E.** 不否认性\n\n### 7. 在 TLS 大部分取代\
  \ SSL 用于安全通信后，许多浏览器仍保留了对 SSL 3.0 的向下兼容。哪种漏洞利用了 TLS 握手中服务降级到 SSL 3.0？\n\n**A.** Heartbleed\n\
  **B.** FREAK\n**C.** DROWN\n**D.** POODLE\n\n### 8. IPSec 的哪种模式最常用于内部通信？\n\n**A.**\
  \ AH\n**B.** ESP\n**C.** 隧道 (Tunnel)\n**D.** 传输 (Transport)\n\n### 9. 某组织担心企业间谍活动，有证据表明内部员工一直在向竞争对手透露商业秘密。经过调查，确定了泄露秘密的员工。对该员工在公司外部之前的通信进行监控没有发现任何异常，除了发送到外部地址的、包含幽默图片文件的大型未加密电子邮件。根据这些事实，以下哪项是最逻辑的结论？\n\
  \n**A.** 电子邮件加密允许用户隐藏文件。\n**B.** 用户使用隐写术在图像文件中隐藏了信息。\n**C.** 对图像和电子邮件进行逻辑水印并分部分发送敏感文件。\n\
  **D.** 使用了 SMTP 模糊攻击。\n\n### 10. 黑客已访问了几个文件。其中许多文件是加密的，但有一个没有，而且它恰好是某个加密文件的未加密版本。为了破解加密文件，以下哪项是最佳选择？\n\
  \n**A.** 密码 (Cipher)\n**B.** 明文 (Known plain text)\n**C.** 选明文 (Chosen text)\n**D.**\
  \ 重放 (Replay)\n\n### 11. 应该使用哪种方法来检查 Heartbleed？\n\n**A.** 使用 `Nmap` 中的 `ssl-bleed`\
  \ 脚本。\n**B.** 通过 `TLS` 连接每个系统并检查响应。\n**C.** 使用 `ping -ssl` 并检查响应。\n**D.** 使用 `Tripwire`。\n\
  \n### 12. `01010101` 和 `11001100` 的 XOR 输出是什么？\n\n**A.** `01100110`\n**B.** `10101010`\n\
  **C.** `10011001`\n**D.** `00110011`\n\n### 13. Amy 和 Claire 在一个组织工作，该组织有一套 PKI\
  \ 系统来保护消息。Amy 为 Claire 加密了一条消息并发送。Claire 收到消息并将其解密。在 PKI 系统中，以下哪个是正确的？\n\n**A.**\
  \ Amy 使用她的私钥加密，Claire 使用她的私钥解密。\n**B.** Amy 使用她的公钥加密，Claire 使用她的公钥解密。\n**C.** Amy\
  \ 使用 Claire 的私钥加密，Claire 使用她的公钥解密。\n**D.** Amy 使用 Claire 的公钥加密，Claire 使用她的私钥解密。\n\
  \n### 14. Hope 在安全团队工作，她的笔记本包含许多机密文件。为了防止这些文件因笔记本丢失或被盗而受损，以下哪是最佳选择？\n\n**A.** 设置\
  \ `BIOS` 密码。\n**B.** 创建隐藏文件夹来存储文件。\n**C.** 为文件设置密码。\n**D.** 安装全磁盘加密。\n\n### 15.\
  \ 关于隐写术（steganography），以下哪种说法是不正确的？\n\n**A.** 隐写术可以使用最低有效位插入、掩码和过滤等技术来隐藏信息。\n**B.**\
  \ 隐写术仅对彩色图像有效。\n**C.** 嵌入隐写术的图像文件可能更大，并显示奇怪的色调。\n**D.** 字符位置、文本模式、异常的空格和语言异常都可能是嵌入隐写术文本文件的症状。\n\
  \n### 16. SSL 会话要求客户端和服务器通过握手相互传递信息，并就安全通道达成一致。以下哪项最符合在设置 SSL 会话期间会话密钥的创建？\n\n**A.**\
  \ 服务器在验证客户端身份后创建密钥。\n**B.** 服务器在客户端连接时立即创建密钥。\n**C.** 客户端使用服务器的公钥创建密钥。\n**D.** 客户端在验证服务器身份后创建密钥。\n\
  \n### 17. 哪种加密算法使用可变块大小（32 到 128 位）？\n\n**A.** SHA-1\n**B.** RC5\n**C.** 3DES\n\
  **D.** AES\n\n### 18. 哪种哈希算法由 NSA 开发并产生高达 512 位的输出？\n\n**A.** MD5\n**B.** SHA-1\n\
  **C.** SHA-2\n**D.** SSL\n\n### 19. 你担心组织笔记本电脑中的数据会丢失或被盗。以下哪种技术最好实现这一目标？\n\n**A.**\
  \ 单点登录\n**B.** 云计算\n**C.** IPSec 隧道\n**D.** 全磁盘加密\n\n### 20. 在关于对称加密的讨论中，一位朋友提到该系统的缺点之一是扩展性。他继续说，每增加一个人，密钥的数量就会增加。如果池中有\
  \ 7 个人，需要多少密钥？\n\n**A.** 7\n**B.** 14\n**C.** 21\n**D.** 28\n\n### 21. 以下哪种说法是正确的？\n\
  \n**A.** 对称加密扩展性良好并提供不否认性。\n**B.** 对称加密扩展性差且不提供不否认性。\n**C.** 对称加密不适用于批量加密。\n**D.**\
  \ 对称加密比异步加密慢。\n\n### 22. 你正在审计的 PKI 系统顶部有一个证书颁发机构 (CA) 创建并颁发证书。用户基于 CA 进行信任。使用的是哪种信任模型？\n\
  \n**A.** 独立 CA\n**B.** 信任网 (Web of trust)\n**C.** 单一权威\n**D.** 层级信任\n\n### 23. 这里显示了数字证书的一部分：\n\
  \n![Image](img/f0259-01.jpg)\n\n以下哪种说法是正确的？\n\n**A.** 用于数字签名的哈希包含 160 位。\n**B.**\
  \ 用于数字签名的哈希包含 2048 位。\n**C.** RSA 是用于数字签名的哈希算法。\n**D.** 此证书包含私钥。\n\n\n\n\n\n**C.**\
  \ 如果第一个值是 0 且第二个值是 0，那么输出为 1。\n\n**D.** 如果第一个值是 1 且第二个值是 1，那么输出为 0。\n\n### 25. 以下哪种攻击试图重新发送加密交换的一部分，以建立通信通道？\n\
  \n**A.** 已知明文攻击\n**B.** 选定明文攻击\n**C.** 中人攻击\n**D.** 重放攻击\n\n### 26. 在 PKI 系统中，以下哪个描述是准确的？\n\
  \n**A.** Bill 可以使用他的公钥对消息进行解密来确保消息来自 Sue。\n**B.** Bill 可以使用他的私钥对消息进行解密来确保消息来自 Sue。\n\
  **C.** Bill 可以使用 Sue 的私钥对数字签名进行解密来确保消息来自 Sue。\n**D.** Bill 可以使用 Sue 的公钥对数字签名进行解密来确保消息来自\
  \ Sue。\n\n### 27. 系统管理员正在其网络内部应用数字证书用于身份和验证服务。他使用 Apple 的 Keychain 创建了公钥对，并使用公钥对整个网络使用的文档进行签名。使用的是哪种类型的证书？\n\
  \n**A.** 公钥证书 (Public)\n**B.** 私钥证书 (Private)\n**C.** 签名证书 (Signed)\n**D.** 自签名证书\
  \ (Self-signed)\n\n## 快速答案对照\n\n1. C\n2. D\n3. B, D\n4. C\n5. A\n6. D\n7. D\n8.\
  \ D\n9. B\n10. B\n11. A\n12. C\n13. D\n14. D\n15. B\n16. D\n17. B\n18. C\n19. D\n\
  20. C\n21. B\n22. C\n23. A\n24. D\n25. D\n26. D\n27. D\n\n## 答案\n\n### 1. 攻击者利用一个\
  \ Metasploit 辅助模块利用了 OpenSSL 的内置功能。以下哪种攻击被描述？\n\n**A.** POODLE\n**B.** FREAK\n**C.**\
  \ Heartbleed\n**D.** DROWN\n\n![Image](img/r.jpg) **C.** Heartbleed  利用了 OpenSSL\
  \ 的一个漏洞，攻击者可以请求服务器返回内存中的数据，这可能泄露敏感信息，如用户名和密码。\n\n### 2. 关于数字签名，以下哪种描述是正确的？\n\n**A.**\
  \ 数字签名按用户签发。\n**B.** 数字签名是哈希值。\n**C.** 数字签名一直有效直到过期。\n**D.** 数字签名无法移动。\n\n![Image](img/r.jpg)\
  \ **D.** 如果你知道数字签名是如何创建的，这很容易。它是使用发送者的私钥对接收者加密的。\n\n![Image](img/w.jpg) **A** 和\
  \ **C** 是错误的，原因相同——数字签名不是跨文档的。\n\n### 3. 关于 PKI 系统，以下哪些描述是正确的？（选择两个）\n\n**A.** CA\
  \ 加密所有消息。\n**B.** CA 是签发证书的受信任根节点。\n**C.** CA 是丢失证书的恢复代理。\n**D.** RA 验证系统申请人的身份。\n\
  **E.** RA 签发所有证书。\n**F.** RA 加密所有消息。\n\n![Image](img/r.jpg) **B, D.** PKI 系统由许多部分组成，但证书机构（CA）处于核心。CA\
  \ 签发、维护并保护系统中所有的证书，并维护证书吊销列表 (CRL)。它是系统中所有保护数据的去处。注册机构（RA）执行若干功能以减轻 CA 的负担，验证想要使用系统的申请人的身份是其主要任务之一。\n\
  \n![Image](img/w.jpg) **A, C, E, F** 都是错误的，因为它们没有正确描述 PKI 环境。CA 不加密消息，也不是丢失证书的恢复代理。RA\
  \ 不签发证书或加密消息。\n\n### 4. 有人向网络管理员寻求关于如何从家里发送加密电子邮件的建议。最终用户不想支付任何许可费用或管理服务器服务。以下哪种方法提供了无需支付许可费用或管理服务器即可发送加密电子邮件的方法？\n\
  \n**A.** IP 安全 (IPSec)\n**B.** 多用途互联网邮件扩展 (MIME)\n**C.** 良好隐私加密 (PGP)\n**D.** 带安全套接层的超文本传输协议\
  \ (HTTPS)\n\n\n\n\n\n![Image](img/r.jpg) **C.** 到此为止，我很确定你已经明白，有时 CEH 考试中的内容与现实情况并不相符。这个问题就是一个典型的例子。EC-Council\
  \ 及其直到版本 8 的所有文档将“Pretty Good Privacy”（PGP）定义为一种所有人都可以使用的免费、开源电子邮件加密方法。事实上，PGP 现在已成为某家公司基于原始\
  \ PGP 提供的单一产品的代名词。现在，它真正的开源免费部分更多地被称为 OpenPGP（[www.openpgp.org/](https://www.openpgp.org/)））。OpenPGP\
  \ 使用了一个去中心化的信任引入者系统，其作用方式与证书权威机构相同。基本上，在这种信任网关系中，如果 `User A` 签名了 `User B` 的证书，那么任何信任\
  \ `User A` 的人也会信任 `User B`。你可以在 [www.pgpi.org/](https://www.pgpi.org/) 找到仍在使用免费开源\
  \ PGP 的软件下载。\n\n![Image](img/w.jpg) **A.** 错误，因为 IPSec 并不是设计用于电子邮件加密标准；它是为了从一个系统到另一个系统安全交换数据创建隧道。\n\
  \n![Image](img/w.jpg) **B.** 错误，因为 MIME 是一种 Internet 标准，它允许仅文本的协议 SMTP 传输非文本实体，如图片和非\
  \ ASCII 字符集。\n\n![Image](img/w.jpg) **D.** 错误，因为 HTTPS 并不是设计用于电子邮件加密标准。它建立了一个会话内传输数据的安全手段，并且*通常*与网络流量相关。\n\
  \n### 5. 下列哪项最适合被定义为常用用于电子邮件安全的加密协议？\n\n**A.** PGP\n\n**B.** Keyczar\n\n**C.** RSA\n\
  \n**D.** MD5\n\n![Image](img/r.jpg) **A.** 尽管它可能最广为人知的一种电子邮件安全协议/应用，但 Pretty Good\
  \ Privacy（PGP）也可以用于多种用途。PGP 用于消息（包括电子邮件）的加密和解密、数据压缩、数字签名，甚至是全磁盘加密。它提供了身份验证和隐私保护，并结合了传统加密和公钥加密加密。\n\
  \n不要将其与 S/MIME 混淆。Secure/Multipurpose Internet Mail Extensions（S/MIME）是一种基于标准的协议，也可以加密消息；然而，它没有提供\
  \ PGP 提供的许多其他功能（最重要的是全磁盘加密）。\n\n![Image](img/w.jpg) **B.** 错误，因为 Keyczar 是一个开源密码工具包，旨在帮助开发者在应用程序中使用密码学。\n\
  \n![Image](img/w.jpg) **C.** 错误，因为 RSA 是一种利用两个大质数的非对称加密算法。对这些数字进行因数分解产生高达 4096 位的密钥大小。RSA\
  \ 可用于加密和数字签名，它是这些用途的现代事实标准。\n\n![Image](img/w.jpg) **D.** 错误，因为 MD5 是一种哈希算法，正如我们所知，哈希算法并不加密任何内容。当然，它们非常擅长完整性检查，是的，你可以传递某个内容的哈希值来代替原始内容（例如，发送存储密码的哈希值而不是密码本身）。然而，这不是真正的加密。\n\
  \n### 6. 你正在向团队的新成员描述一个基本的 PKI 系统。他询问如何在系统内有序、受控地分发公钥，以便用户能够确定发送者的身份。以下哪项将是你的答案？\n\
  \n**A.** 数字签名\n\n**B.** 哈希值\n\n**C.** 私钥\n\n**D.** 数字证书\n\n**E.** 不否认性\n\n![Image](img/r.jpg)\
  \ **D.** 这一项其实很简单，但对很多人来说却很困惑。你必须记住 PKI 系统中这一小部分的目标——人们如何*知道这个这个公钥确实属于 `User Joe`\
  \ 而不是 `User Mike`，以及如何将其安全地传递给每个人？数字证书就是答案，因为它包含了发送者的公钥，并可以用于识别发送者。由于 `CA` 提供了证书和密钥（公开），用户可以确定公钥确实属于预期的接收者。这同时也简化了密钥的分发，因为用户可以去一个中央机构——可以称之为密钥库——而不是直接找组织中的每个用户。如果没有中央控制和数字证书，那里将变成一个混乱局面，每个人都会肆无忌惮地互相扔公钥。我的朋友，PKI\
  \ 可不是狂欢节的地方。\n\n![Image](img/w.jpg) **A.** 错误，虽然数字签名确实提供验证身份的手段（使用你的私钥进行加密，只有用对应的公钥才能解密），但它并没有提供任何发送密钥的方法。数字签名不过是用于确保发送者真实性（和完整性）的算法输出。你需要证书的真实性来发送密钥。\n\
  \n![Image](img/w.jpg) **B.** 错误，因为哈希值与分发密钥无关。是的，哈希值被签名是为了验证真实性，但它们并不提供传输机制。\n\n\
  ![Image](img/w.jpg) **C.** 错误，因为 RSA 是一种非对称加密算法。\n\n![Image](img/w.jpg) **E.** 错误，因为不否认性是接收者确保发送者身份的一种手段，双方无法否认发送或接收消息。\n\
  \n### 7. 在 TLS 大取代 SSL 安全通信之后，许多浏览器保留了对 SSL 3.0 的向下兼容。哪种漏洞利用了 TLS 握手降级到 SSL 3.0\
  \ 的？\n\n**A.** Heartbleed\n\n**B.** FREAK\n\n**C.** DROWN\n\n**D.** POODLE\n\n![Image](img/r.jpg)\
  \ **D.** POODLE（降级旧加密填充 oracle 攻击）由 Google 安全团队发现，并于 2014 年 10 月 14 日向公众公布。这次是一个向下兼容性引起的问题。当\
  \ TLS 连接不可用时，许多浏览器会退回到 3.0，而由于 TLS 执行的握手设计初衷是降级服务直到找到双方可以接受的（即，双方都能使用的降级加密）方案，如果黑客可以插到客户端和服务器之间的连接中，他就可以干扰这些握手，导致它们全部失败。这将导致客户端一直退回到\
  \ SSL 3.0。\n\nSSL 3.0 有一个设计缺陷，允许更改块密码末尾的填充数据，使得加密器的安全性每次都会降低。如果同一个密钥（例如密码）在多个会话中发送，关于它的信息就会泄露越多。最终连接可能等同于明文，坐在中间的攻击者可以看到一切。POODLE\
  \ 的缓解措施非常简单——不要使用 SSL 3.0。\n\n![Image](img/w.jpg) **A.** 错误，因为 Heartbleed 利用了 OpenSSL\
  \ 中的心脏跳包函数，允许将 64KB 的随机内存传输给攻击者。\n\n![Image](img/w.jpg) **B.** 错误，因为 FREAK（RSA 导出密钥因数分解攻击）是一种中间人攻击，强制将\
  \ RSA 密钥降级到较弱的长度。\n\n\n\n\n\n![Image](img/w.jpg) **C** 是错误的，因为 DROWN（使用过时和弱化的加密算法进行\
  \ RSA 解密）是一种影响 HTTPS 以及其他依赖 SSL 和 TLS 服务（特别是 SSLv2 连接）的严重漏洞。\n\n### 8. 内部通信最常用的是哪种\
  \ IPSec 模式？\n\n**A.** AH\n**B.** ESP\n**C.** 隧道（Tunnel）\n**D.** 传输（Transport）\n\n\
  ![Image](img/r.jpg) **D.** IPSec 是一种网络层加密协议，可以使用两种模式：隧道（Tunnel）和传输（Transport）。在传输模式下，数据有效载被加密，但数据包的其余部分（特别是\
  \ IP 头部）不被触动。这在内部、终端站之间、或终端站与网关之间（如果网关被视为主机的话）效果良好。传输模式不支持 NAT，尽管它可以与其他隧道协议结合使用。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为认证头（AH）是 IPSec 套件中的一种协议，用于验证 IP 数据包的完整性并确定其源的有效性。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为封装安全载荷（ESP）是 IPSec 套件中的另一种协议，它实际上会对每个数据包进行加密。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为隧道模式会加密整个数据包，包括头部。并不是说你不能在网络内部使用隧道模式；只是它并不常见也不被推荐。\n\
  \n### 9. 某机构担心企业间谍活动，并有证据表明一名内部员工一直在向竞争对手泄露商业秘密。经过调查，确定了该泄密员工。对该员工之前在公司外的通信进行监控后，没有发现任何异常，除非是一些发送到外部地址的、包含幽默图片文件的某些大型未加密邮件。根据这些事实，以下最符合逻辑的结论是什么？\n\
  \n**A.** 电子邮件加密允许用户隐藏文件。\n**B.** 用户使用隐形水印术在图像文件中隐藏了信息。\n**C.** 图像和电子邮件的逻辑水印将敏感文件分批发送给了竞争对手。\n\
  **D.** 使用了 SMTP 传输模糊（fuzzing）。\n\n![Image](img/r.jpg) **B.** 在这种情况下，你知道该员工一直在向网络外发送敏感文档。IDS\
  \ 显然没有检测到任何异常，也没有采取任何明显的行为来暴露意图。唯一的异常之处被证明是只包含图像的大型邮件文件。在给出的选项中，隐形水印术是最逻辑的选择，用户只是简单将敏感数据叠入他找到的最新笑话图片中并发送出去。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为并没有启用电子邮件加密——问题中特意提到了这一点，而且它并不一定允许外部加密或在随后的法医鉴定检查中隐藏信息。\n\
  \n![Image](img/w.jpg) **C** 和 **D** 是错误的，因为据我所知，逻辑水印和 SMTP 传输模糊根本不存在。它们听起来很酷且可能合法，但它们绝对不是你要寻找的答案。\n\
  \n### 10. 一个黑客获取了几个文件的访问权限。许多文件都加密了，但有一个没有，且恰是某个文件的未加密版本。对于可能成功破解加密文件，以下哪项是最佳选择？\n\
  \n**A.** 仅密文攻击（Cipher text only）\n**B.** 已知明文攻击（Known plain text）\n**C.** 选择明密文攻击（Chosen\
  \ cipher text）\n**D.** 重放攻击（Replay）\n\n![Image](img/r.jpg) **B.** 这个问题绝对有争论的空间：谁能保证所有文件都是以相同方式加密的？然而，在给出的选项中，已知明文攻击是最合逻辑的。在这种攻击中，黑客同时拥有明文和密文消息。扫描明文副本以寻找重复的序列，然后随着时间的推移与密文版本进行比较，通过努力，这可以用于解密。\n\
  \n![Image](img/w.jpg) **A** 是错误的，但仅差一点点。我确定你们中有些人正在争论，这里也可以使用仅密文攻击，因为几条以相同方式加密的消息经过统计分析最终可以揭示代码，并在之后可能被使用。当然，攻击者可能直接忽略那份明文副本，但问题在于他会同时使用两者。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为选择密文攻击的工作方式与仅密文攻击完全相同。虽然可以在没有明文版本对比的情况下进行统计分析，但仅针对获取的密文部分。这就是我们要找的词。顺便提一下，RSA\
  \ 特别容易受到这种攻击（攻击者可以使用用户的公钥加密明文，然后解密结果结果以找到模式）。\n\n![Image](img/w.jpg) **D** 是错误的，因为它与此场景无关。重放攻击捕获数据流并重新发送。\n\
  \n### 11. 以下哪种方法应该检查 Heartbleed 漏洞？\n\n**A.** 在 Nmap 中使用 sslbleed 脚本。\n**B.** 通过\
  \ TLS 连接系统。\n**C.** 使用 ping-ssl。\n**D.** 使用 Tripwire。\n\n![Image](img/r.jpg) **A.**\
  \ Nmap 扫描可以显示各种信息，并且它提供了快速检测 Heartbleed 的方法。脚本语法为 `nmap -sV -script sslbleed --args\
  \ IPADDRESS`（其中 `IPADDRESS` 是目标主机）。\n\n![Image](img/w.jpg) **B** 是错误的，因为 Heartbleed\
  \ 与 TLS 无关。\n\n![Image](img/w.jpg) **C** 是错误的，不存在 `ping-ssl` 这个命令。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 Tripwire 是用于执行企业整体 IT 安全完整性检查、合规性和配置管理的工具组合，但不用于 Heartbleed。\n\n\
  ### 12. 01010101 和 11001100 的 XOR 输出结果是什么？\n\n**A.** 01100110\n**B.** 10101010\n\
  **C.** 10011001\n**D.** 00110011\n\n![Image](img/r.jpg) **C.** XOR 操作在各种加密工作中被广泛使用（还有许多用途）。在\
  \ XOR 操作中，对两个位进行比较。如果位匹配，输出为 0。如果不匹配，输出为 1。在这个例子中，将 01010101 置于 11001100 之上并逐位比较。每组的第一位分别是\
  \ 0 和 1，所以 XOR 输出为 1。每组的第二个位位分别是 1 和 1。因此，由于它们匹配，输出为 0。继续逐位比较，输出将是 10011001。\n\n\
  ![Image](img/w.jpg) **A, B,** 和 **D** 是错误的，因为它们不代表这两个输入的 XOR 输出。\n\n### 13. Amy\
  \ 和 Claire 在一个设有 PKI 系统以确保消息安全的机构工作。Amy 为 Claire 加密了一条消息并发送。Claire 接收到消息并解密。在 PKI\
  \ 系统中，以下哪种陈述是正确的？\n\n**A.** Amy 使用她的私钥加密，Claire 使用她的私钥解密。\n**B.** Amy 使用她的公钥加密，Claire\
  \ 使用她的公钥解密。\n\n\n\n\n\n### **C.** Amy 使用 Claire 的私钥进行加密，Claire 使用自己的公钥进行解密。\n\n\
  ### **D.** Amy 使用 Claire 的公钥进行加密，Claire 使用自己的私钥进行解密。\n\n![Image](img/r.jpg) **D.**\
  \ 当涉及到 PKI 加密问题时，请记住黄金法则：公钥加密，私钥解密。在这个实例中，Amy 想向 Claire 发送一条消息。她将使用 Claire 的公钥（所有人都可以获取）来加密消息，并知道只有\
  \ Claire 拥有对应的私钥才能对其解密。\n\n![Image](img/w.jpg) **A** 是错误的，因为在 PKI 系统中，你不会使用私钥进行加密。是的，你可以用它加密，但这样做有什么意义呢？任何拥有你公钥的人（每个人都有）都可以解密它！请记住：私钥\
  \ = 解密，公钥 =加密。\n\n![Image](img/w.jpg) **B** 是错误的，因为在这种情况下，Amy 正确地完成了她部分的操作，但 Claire\
  \ 似乎不知道自己在做什么。PKI 加密是通过密钥对完成的——一个密钥加密的内容由另一个密钥解密。所以，她使用自己的公钥去解密一个用 Amy 的密钥（来自完全不同的密钥对）加密的内容，这简直是令人费惑的。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为 Amy 不应该拥有除了自己的私钥之外的任何人的私钥。这就是私钥的意义所在——你把它留给自己，不与任何人共享。需要注意的是，这里描述的步骤实际上是行得通的——即一个密钥加密，另一个密钥解密——但这与系统预期的工作方式完全反过来了。如果你愿意的话，这是对安全性的亵渎。\n\
  \n### 14. Hope 在安全团队工作，她的笔记本电脑包含许多机密文件。为了防止这些文件因笔记本电脑丢失或被盗，以下哪项是最佳选择？\n\n- **A.**\
  \ 设置 BIOS 密码。\n- **B.** 创建隐藏文件夹来存储这些文件。\n- **C.** 为文件设置密码保护。\n- **D.** 安装全盘加密。\n\
  \n![Image](img/r.jpg) **D.** 全盘加密 (FDE)，也称为静态数据保护，是专为此目的设计的。在企业级系统中，每台笔记本电脑（或其他便携式系统）的磁盘都会加密，并分配一个所有者才知道的密码\
  \ (PIN) 以及一种生成和使用恢复密钥的方法。在启动时，所有者输入密钥，磁盘即可解锁使用。如果忘记了密码，可以生成并使用恢复密钥来解锁驱动器。这保护了数据不受系统本身丢失或被盗的影响。\n\
  \n![Image](img/w.jpg) **A** 是错误的，虽然设置 BIOS 密码不一定是个坏主意，但它并不是保护数据的万无一失。硬盘本身可以被拔出并进行法医检查以提取数据。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为“隐藏”文件夹不会提供任何保护。\n\n![Image](img/w.jpg) **C**\
  \ 是错误的，虽然为文件设置密码保护不一定是个坏主意，但它无法提供数据保护。正如我们在本书及配套书中多次讨论的那样，密码可以被破解，而且通常很容易破解——特别是当可以物理接触硬盘时。\n\
  \n### 15. 关于隐写术（steganography），以下哪个说法是不正确的？\n\n- **A.** 隐写术可以使用最低有效位插入、掩码和过滤等技术来隐藏信息。\n\
  - **B.** 隐写术仅作用于彩色图像。\n- **C.** 嵌入隐写术的图像文件可能会更大，并显示出奇怪的色调。\n- **D.** 字符位置、异常的空格和语言异常都可以作为嵌入隐写术的文本文件的症状。\n\
  \n![Image](img/r.jpg) **B.** 隐写术是将消息隐藏在另一种介质（如另一个文件或图像）中的做法，使得只有发送者和接收者知道它的存在，更不用说解码的方法了。它可以简单到将消息隐藏在书信的正文中，也可以复杂到更改巨大媒体文件中的位来携带消息。隐写术可以嵌入到彩色或灰度图像、文本文件、音频文件，甚至是视频中。在灰度图像中，隐写术通常通过掩码实现（也称为过滤，其隐藏数据的方式与文档水印相同）。\n\
  \n![Image](img/w.jpg) **A, C, 和 D** 是错误的，因为这些关于隐写术的说法都是正确的。\n\n### 16. SSL 会话要求客户端和服务器通过握手相互传递信息，并就安全通道达成一致。在设置\
  \ SSL 会话期间，以下哪项最符合会话创建的描述？\n\n- **A.** 服务器在验证客户端身份后创建密钥。\n- **B.** 服务器在连接建立后立即创建密钥。\n\
  - **C.** 客户端使用服务器的公钥创建密钥。\n- **D.** 客户端在验证服务器身份后创建密钥。\n\n![Image](img/r.jpg) **D.**\
  \ 在 CEH 世界中，SSL 有六个主要步骤（其他人声称七个或更多，但我们是为 CEH 学习，所以遵循他们的说法）。这六个步骤是：(1) 客户端你好 (client\
  \ hello)，(2) 服务器你好和证书，(3) 服务器你好完成消息 (server hello done)，(4) 客户端验证服务器身份并发送客户端密钥交换，(5)\
  \ 客户端发送更改规范和完成，(6) 服务器响应更改规范和完成。会话密钥是由客户端在验证服务器身份后创建的（使用第 2 步提供的证书）。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为服务器不创建会话密钥。\n\n![Image](img/w.jpg) **B** 是错误的，原因相同——是客户端创建密钥。\n\n\
  ![Image](img/w.jpg) **C** 是错误的，因为客户端在 SSL 会话中并不使用“公钥”。这是一个非常好的干扰项，试图用 PKI 术语来迷惑你。\n\
  \n### 17. 哪种加密算法使用可变块大小（32 位到 128 位）？\n\n- **A.** SHA-1\n- **B.** RC5\n- **C.**\
  \ 3DES\n- **D.** AES\n\n![Image](img/r.jpg) **B.** 关于识别加密算法实际上取决于对某些关键术语的记忆。RC 加密算法包含了多个版本，从\
  \ RC2 到 RC6。它是一种对称块加密算法，密钥长度最高可达 2040 位。最新版本 RC6 使用 128 位块，而 RC5 使用可变块大小（32、64 或\
  \ 128 位）。\n\n![Image](img/w.jpg) **A** 是错误的，因为 SHA-1 是哈希算法，而不是加密算法。如果这个问题是关于验证完整性的，那么这是一个很好的选择。但在这种情况下，它是一个干扰项。\n\
  \n![Image](img/w.jpg) **C** 是错误的，尽管 3DES 是一种对称块加密算法，但它并不使用可变块大小。3DES（三重 DES）使用 168\
  \ 位密钥，并可以在多次加密方法中使用最多三个密钥。它比 DES 有得多，但速度慢得多。\n\n![Image](img/w.jpg) **D** 是错误的，因为\
  \ AES 是另一种对称块加密算法，其密钥长度为 128、192 或 256 位。它有效地取代了 DES，并且比 DES 或其三连胞胎兄弟 (3DES) 都快得多。\n\
  \n\n\n\n\n![Image](img/r.jpg) **C.** `SHA-1` 和 `SHA-2` 都由 `NSA` 开发；然而，`SHA-1` 仅产生\
  \ 160 位的输出值。`SHA-2` 的开发是为了纠正其前身的缺点，并能够产生 224、256、384 和 512 位的输出。尽管它被设计为 `SHA-1`\
  \ 的替代品（后者本应在 2010 年被淘汰），但 `SHA-2` 仍然没有被广泛使用。顺带一提，`SHA-3` 也能产生 512 位的密钥。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为 `MD5` 产生 128 位的输出。它由 Ronald Rivest 创建，用于确保文件完整性；然而，该算法存在的严重缺陷以及其他哈希算法的进步导致这种哈希算法变得过时（美国\
  \ CERT，2010 年 8 月）。尽管如此，你会发现 `MD5` 仍被用于下载时的文件验证，在许多情况下还用于存储密码。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 `SHA-1` 产生 160 位的输出值。它由 `NSA` 创建，曾被法律要求在美国政府应用程序中使用。然而，严重缺陷在 2005\
  \ 年后期变得显而易见，美国政府 2010 年后开始建议用 `SHA-2` 替换 `SHA-1`（参见 `FIPS PUB 180-1`）。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 `SSL` 甚至不是一种哈希算法。如果你选了这一项，说明你还有些好好学习的地方。\n\n### 19. 你担心保护组织笔记本电脑上的数据免受丢失或盗窃。以下哪种技术最能实现这一目标？**\n\
  \n**A.** 单点登录\n**B.** 云计算\n**C.** `IPSec` 隧道模式\n**D.** 全盘加密\n\n![Image](img/r.jpg)\
  \ **D.** 静态数据（`DAR`）保护是一种专为防止丢失和盗窃而定制的安全技术，但有一个微小的限制：`DAR` 中的全盘加密会设置一个预启动会话，需要有效的凭据来解锁机器。然而，需要注意的是，预启动会话会在系统完全关机后才会启动。如果用户只是合上盖子并将机器放入睡眠模式，`DAR`\
  \ 保护将不起作用。假设用户在旅行前关闭了机器，预启动将保护所有内容——包括主引导记录（MBR），并即使笔记本电脑被盗或丢失，内部数据也会得到保护。如果用户没有关机，那么\
  \ `DAR` 只是另一个提供安全错觉的安全工具——这可能比什么都没有更糟糕。\n\n![Image](img/w.jpg) **A** 是错误的，因为单点登录——一种允许用户使用一组凭据访问多个资源的身份验证方法——与丢失或盗窃保护无关。\n\
  \n![Image](img/w.jpg) **B** 是错误的，虽然云计算可能提供一些数据存储和保护工作，但它对防止笔记本电脑丢失或被盗无效，并且会让设备上的所有内容都处于脆弱状态。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为尽管 `IPSec` 隧道模式会保护从笔记本电脑回远程网络的传输数据，但它对笔记本电脑本身不提供任何保护。\n\
  \n### 20. 在关于对称加密的讨论中，一位朋友提到该系统的缺点之一是可扩展性。他继续说道，每向组合中添加一个人，密钥的数量就会增加。如果对称加密池中有七个人，需要多少个密钥？\n\
  \n**A.** 7\n**B.** 14\n**C.** 21\n**D.** 28\n\n![Image](img/r.jpg) **C.** 对称加密非常快，且非常适合批量加密；然而，可扩展性和密钥交换是巨大的缺点。要确定你需要的密钥数量，使用公式\
  \ `(N – 1)/2`。将 7 代入公式，得到 `(7 – 1)/2 = 21`。\n\n![Image](img/w.jpg) **A** 是错误的，虽然对称加密加密和解密使用同一个密钥，但每个新节点都需要不同的密钥。七个密钥显然不够。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为 14 个密钥不够。\n\n![Image](img/w.jpg) **D** 是错误的，因为\
  \ 28 个密钥太多了。坚持公式 `(N – 1)/2`。\n\n### 21. 下列哪种描述是正确的？\n\n**A.** 对称加密易于扩展并提供不可否认性。\n\
  **B.** 对称加密不易于扩展且不提供不可否认性。\n**C.** 对称加密不适用于批量加密。\n**D.** 对称加密比非对称加密慢。\n\n![Image](img/r.jpg)\
  \ **B.** 对称加密一直以强度和速度著称；然而，可扩展性和密钥交换是很大的缺点。此外，没有办法提供不可否认性（在加密系统范围内）。当你不希望承担密钥管理的全部开销时，对称加密适用于许多场景。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为对称加密不易于扩展且不提供不可否认性。每个通道使用的单一密钥会导致问题。请记住，密钥数量的公式为\
  \ `(N – 1)/2`。\n\n![Image](img/w.jpg) **C** 是错误的，因为对称加密的设计非常适合批量加密。假设你能找到一种确保密钥交换受保护的方法，速度使其成为最佳选择。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为对称加密的优点之一是它的速度。它比非对称加密快得多，但没有提供非对称加密提供的某些优势（可扩展性、不可否认性等）。\n\
  \n### 22. 你正在审计的 PKI 系统顶部有一个证书颁发机构（`CA`），负责创建并发布证书。用户基于 CA 相互信任。这里是哪种信任模型？\n\n**A.**\
  \ 独立 `CA`\n**B.** 信任网\n**C.** 单一权威\n**D.** 层级信任\n\n![Image](img/r.jpg) **C.** `PKI`\
  \ 系统中的信任模型为证书和密钥交换提供了标准方法。有效的信任模型包括信任网、单一权威和层级。单一权威系统拥有顶部的 CA 负责创建并发布证书。假设使用单一权威模型，保护它至关重要。毕竟，一旦它被攻破，整个系统就会崩溃。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为独立 `CA` 指的不是信任模型。它定义了一个单一 `CA`，通常作为层级结构中的离线根或在涉及外网和互联网时使用。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为信任网指的是用户自己创建并管理证书及密钥交换的模型，并且多个实体相互签署证书。换句话说，该系统内的用户根据从其他用户获得的证书相互信任。\n\
  \n![Image](img/w.jpg) **D** 是错误的，虽然层级信任系统也有顶部的 CA（被称为根 `CA`），但它在下方利用一个或多个中间 `CA`（称为\
  \ `RA`）来发布和管理证书。这种系统最安全，因为用户可以将证书追溯到根以确保真实性，且不存在单点故障。\n\n### 23. 这里显示了数字证书的一部分：\n\
  \n![Image](img/f0274-01.jpg)\n![Image](img/f0275-01.jpg)\n\n下列哪种描述是正确的？\n\n**A.**\
  \ 数字签名的哈希值为 160 位。\n**B.** 数字签名的哈希值为 2048 位。\n**C.** `RSA` 是用于数字签名的哈希算法。\n**D.**\
  \ 此证书包含私钥。\n\n\n\n\n\n![Image](img/r.jpg)**A.** 关于数字证书的问题通常足够简单，本题也不例外。用于创建哈希的算法被明确定义为签名哈希算法\
  \ (`SHA-1`)，正如我们所知道的，`SHA-1` 创建 160 位的哈希输出。然后，该哈值将由发送者的私钥加密，并在接收者端使用公钥解密，从而验证身份。\n\
  \n![Image](img/w.jpg)**B** 是错误的，因为它是一个干扰项：证书的公钥部分列出了 `2048` 位的 `RSA` 密钥。\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，因为 `RSA` 不是哈希算法。毫无疑问，它在该证书中被用加密算法（并使用 `2048` 位密钥进行加密），但并不对任何内容进行哈希处理。\n\n\
  ![Image](img/w.jpg)**D**** 是错误的，因为正如我确定你已经意识到的那样，私钥`绝不会`被共享。公钥留给接收者，以防他们想要加密内容发回给发送者，但私钥绝不会共享。\n\
  \n### 24. 位特流通过 `XOR` 操作运行。关于该函数的每个位对，以下哪项陈是正确的？\n\n**A.** 如果第一个值为 `0` 且第二个值为 `1`，那么输出为\
  \ `0`。\n\n**B.** 如果第一个值为 `1` 且第二个值为 `0`，那么输出为 `0`。\n\n**C.** 如果第一个值为 `0` 且第二个值为\
  \ `0`，那么输出为 `1`。\n\n**D.** 如果第一个值为 `1` 且第二个值为 `1`，那么输出为 `0`。\n\n![Image](img/r.jpg)**D.**\
  \ `XOR` 操作需要两个输入，在加密算法的情况下，这将是数据位和密钥位。每个位都被输入到操作中——一个位来自数据，下一个位来自密钥——然后由 `XOR` 做出判定：如果位匹配，则输出为\
  \ `0`；如果不匹配，则输出为 `1`。\n\n![Image](img/w.jpg)**A** 是错误的，因为被比较的两个值不同的；因此，输出将是 `1`。\n\
  \n![Image](img/w.jpg)**B** 是错误的，因为被比较的两个值不同的；因此，输出将是 `1`。\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，因为被比较的两个值是相同的；因此，输出应为 `0`。\n\n### 25. 以下哪种攻击尝试重发加密交换的一部分以建立通信信道？\n\n**A.**\
  \ 已知明文攻击\n\n**B.** 选明文攻击\n\n**C.** 中间人\n\n**D.** 重放\n\n![Image](img/r.jpg)**D.**\
  \ `Replay`（重放）攻击通常是在中间人攻击的背景下进行的，而不一定是为了建立通信信道。它们还被用于对系统的 `DoS` 攻击，通过输入错误数据以期损坏系统，尝试溢出缓冲区（发送比预期的更多的加密数据）等。黑客重复加密交换的一部分，希望欺骗系统建立通信信道。攻击者并不真的需要知道交换的实际数据（如密码）；他们只需要在复制和重放位流时掌握好时机即可。通信过程中可以使用`Session\
  \ tokens` 来对抗这种攻击。\n\n![Image](img/w.jpg)**A** 是错误的，因为已知明文与此场景并没有真正的关系。已知明文指的是同时拥有明文和相应的密文消息，对它们进行扫描并与密文版本进行对比。\n\
  \n![Image](img/w.jpg)**B** 是错误的，因为它根本不适用于此场景。在选明文攻击中，黑客对多个加密消息进行统计分析以确定重复代码。\n\n\
  ![Image](img/w.jpg)**C** 是错误的，因为`中间人`并不是重发交换部分的这种特定攻击。\n\n### 26. 以下哪项陈是准确的？\n\n\
  **A.** `RSA` 是哈希算法。\n\n**B.** `SHA-1` 是加密算法。\n\n**C.** 私钥与接收者共享。\n\n**D.** `XOR`\
  \ 被用于许多加密算法。\n\n![Image](img/r.jpg)**D.** `XOR` 被用于许多加密算法，因为它是一个简单且可逆的操作。创建数字名的过程是：\n\
  1. 创建消息的哈希。\n2. 使用你的私钥加密哈希。\n3. 接收者使用你的公钥解密哈希。\n\n### 27. 一位系统管理员正在网络内部应用数字证书用于身份验证和验证服务。他使用\
  \ Apple Keychain 创建公私密钥对，并使用公钥对整个网络使用的文档进行签名。使用的是哪种证书类型？\n\n**A.** 公\n\n**B.** 私有\n\
  \n**C.** 已签名\n\n**D.** 自签名\n\n![Image](img/r.jpg)**D.** 自签名（Self-signed）证书用于不需要外部\
  \ `CA` 的内部环境。因为管理员是证书的创建者，他们使用自己的私钥对其进行签名。\n\n\n\n\n\n- 描述身份盗窃\n- 列出社会工程学防御措施\n\
  - 描述物理安全措施\n\n我知道会有很多人会拿起这样一本书，试图训练自己成为一名“黑客”，但我有些消息要告诉你们：你们已经走了一部分路了。你是一个天生的社会工程工程师，而且你可能从会走路起就在做这些事情了。事实上，我敢打个大票赌你，你今天很可能对你的同类人类进行一些操纵，甚至可能根本没有想过这一点。\n\
  \n不相信我？我保证，如果你搜索你的记忆库，在你童年时期至少有一次，你通过口嘴之舌要到了另一块糖果，或者多玩几分钟玩具，仅仅是因为你很可爱。如果你有兄弟姐妹，我打赌你们都合谋过——至少一次——来掩盖某些糟糕的事情，或者说服妈妈你真的需要更多冰淇淋。那种利用“嗯，爸爸说可以的”来让妈妈和爸爸矛盾的技巧？那是书里最老的花招了。\n\
  \n我们每天都在利用系统漏洞，因为这是我们的本能，而且读这封书的人，没有人不尝试影响和操纵周围的人来获得优势或达成目标。你从出生起就在这样做，并且会一直这样做直到你离世。我们在渗透测试和伦理黑客中所做的，仅仅是将这些同样的想法和行为带到我们的工作中，并增加一个微小的转折：虽然你大多数的操纵不是故意的，但在虚拟世界中必须是故意的。这涉及到大量的表演、直觉和谎言，在这个领域取得成功，你必须极具说服力才能完成。\n\
  \n整个主题是非常引人入胜的，有无尽的文章、研究和书籍致力于此。卡巴斯基（Kaspersky）将其称为“黑客攻击（Hacking the Human）”，这几乎是我能想出的最贴切的描述了。社会工程学和物理安全是那些你可能无意中忽略的显而易见且简单的解决方案。既然你可以直接给某人打电话并询问他们，为什么要费尽精力去破解系统呢？既然你可以直接走进大楼坐下，为什么要费事从加密系统中窃取敏感业务信息呢？当然，你偶尔会在翻找垃圾桶时被捕，你甚至可能会体验到狗有多强大——当那只凶猛的动物被绳子牵着，而你蜷缩在角落里时，但很多社会工程学是非常值得的。它是简单、直接的，不是渗透测试中你可以忽视掉的领域。\n\
  \n### 学习技巧\n根据最新版本的简用 CEH 手册，社会工程学占你考试的比例不到 4%；基本上你的问题中最多会有五道来自这个领域。官方教材与之前的版本相比在字面上没有任何变化，你将看到的关于社会工程学和物理安全的大多数问题都是基于定义的。重点领域将包括社会工程学攻击（窥视屏幕、翻找垃圾桶、伪装等）、安全控制（物理、操作和技术）以及生物识别。这一部分中的任何新内容可能都在移动领域（例如，使用短信和手机进行社会工程学攻击），但难度应该应该和以前一样简单。\n\
  \n不过，有一点需要注意：小心其中一些问题中的措辞。例如，`tailgating`（尾随进入）和 `piggybacking`（搭便进入）在现实世界中对我们来说是一个意思，但在你的考试中存在显著差异。虽然大多数这类问题都相当简单，但\
  \ EC-Council 喜欢关注细节。\n\n## QUESTIONS\n\n**1.** 在观察目标组织的大楼时，你注意到唯一的入口门内停放着一名守卫。进入外部门后，你注意到大楼的大厅与外部门之间由一个小玻璃面板房间隔开，房间有一扇面向外部的关闭门和一扇面向内部的关闭门。房间里似乎有一个\
  \ RFID 扫描设备和一个带有视频显示器的小键盘。哪一项最能定义这种设施？\nA. 岗亭 (Guard shack)\nB. 闸机 (Turnstile)\n\
  C. 人员小屋 (Man shack)\nD. 陷阱 (Man trap)\n\n**2.** 在社会工程活动中，你拨打帮助热线伪装成一个忘记密码的用户。技术人员配合了你。这属于哪种社会工程攻击？\n\
  A. 搭便进入 (Piggybacking)\nB. 反向工程学 (Reverse engineering)\nC. 技术支持 (Technical support)\n\
  D. 光环效应 (Halo effect)\n\n**3.** 关于生物识别，以下哪个说法是正确的？\nA. `CER` 越低，生物识别越好。\nB. `CER`\
  \ 越高，生物识别越好。\nC. `FRR` 越高，生物识别越好。\nD. `FAR` 越高，生物识别越好。\n\n**4.** 渗透测试人员向目标组织的几名用户发送了未请求的邮件。该邮件制作精良，看起来来自公司的帮助热线，告知用户存在网络问题。邮件在用户受到影响时提供了一个联系电话。随后渗透测试人员收到了寻求帮助的电话。这里涉及哪种社会工程？\n\
  A. 技术支持\nB. 伪装 (Impersonation)\nC. 网络钓鱼 (Phishing)\nD. 反向工程学 (Reverse engineering)\n\
  \n**5.** 渗透测试人员进入大楼并四处观察。在大楼的某个房间里，他站在隔断墙外观察用户的屏幕活动。这属于哪种社会工程攻击？\nA. 窃听 (Eavesdropping)\n\
  B. 尾随进入 (Tailgating)\nC. 窥视屏幕 (Shoulder surfing)\nD. 搭便进入 (Piggybacking)\n\n**6.**\
  \ 本地响应团队调查的近期事件涉及用户收到一封看起来来自美国邮政的邮件，通知她有一个包裹寄来并提供了一个跟踪链接。该链接将用户引导至看起来像 USPS 网站的页面，她在那里输入了用户信息以获取最新的交付情况。用户落入了哪种攻击？\n\
  A. 网络钓鱼 (Phishing)\nB. 互联网级攻击 (Internet level)\nC. 反向工程学 (Reverse engineering)\n\
  D. 伪装 (Impersonation)\n\n**7.** 哪种类型的社会工程攻击使用网络钓鱼、弹出窗口和 IRC 通道？\nA. 技术 (Technical)\n\
  B. 基于计算机的 (Computer based)\nC. 基于人类的 (Human based)\nD. 物理 (Physical)\n\n**8.** 攻击者识别了一个潜在目标并花时间对其进行画像。在获取一些信息后，攻击者向目标的手机发送了短信。该短信看起来来自用户的银行，建议她立即就账户信息拨打提供的号码。她拨打了电话并向伪装成银行的攻击者提供了敏感信息。以下哪一项最能定义这种攻击？\n\
  A. 语音钓鱼 (Vishing)\nB. 短信钓鱼 (Smishing)\nC. 网络钓鱼 (Phishing)\n\n**9.** 以下哪项对组织构成了最高风险？\n\
  A. 黑客 (Black-hat hacker)\nB. 白帽客 (White-hat hacker)\nC. 灰帽客 (Gray-hat hacker)\n\
  D. 不满的员工 (Disgruntled employee)\n\n\n\n\n\n### 10 在观察目标组织几天后，你发现财务和人力资源记录被装在袋里并放在室外的存储箱中，稍后进行粉碎/回收。某天，你直接走到垃圾桶旁并将其中一个袋子放入你的车辆中，计划稍后翻找。这里使用的是哪种社会工程攻击？\n\
  \n**A.** 离线 (Offline)\n**B.** 物理 (Physical)\n**C.** 尾随 (Piggybacking)\n**D.** 翻垃圾桶\
  \ (Dumpster diving)\n\n### 11 一名攻击者在安全设施入口外等待。几分钟后，一名佩戴通行证的授权用户出现。他刷了门卡打开了门。没有显示胸牌的攻击者跟随他进入了内部。刚刚发生了哪种社会工程攻击？\n\
  \n**A.** 尾随 (Tailgating)\n**B.** 尾随 (Piggybacking)\n**C.** 身份盗窃 (Identity theft)\n\
  **D.** 冒装 (Impersonation)\n\n### 12 Tim 是渗透测试团队的一部分，正试图进入校园的一个安全区域。他站在一个有门禁的入口处外，假装正在进行一通激烈的手机通话。一名组织员工走过并刷卡打开大门。Tim\
  \ 请求该员工扶住门，同时展示出一个假的 ID 门牌并继续他的电话通话。随后，他跟随该员工通过了大门。以下哪项最能定义这种这种行为？\n\n**A.** 窥屏偷视\
  \ (Shoulder surfing)\n**B.** 尾随 (Piggybacking)\n**C.** 尾随 (Tailgating)\n**D.** 征用兵\
  \ (Drafting)\n\n### 13 下列哪项可能是针对社会工程攻击的有效应对措施？（选择所有适用项。）\n\n**A.** 安全策略 (Security\
  \ policies)\n**B.** 运营指南 (Operational guidelines)\n**C.** 配置恰当的入侵检测系统 (IDS)\n**D.**\
  \ 用户教育与培训 (User education and training)\n**E.** 强力防火墙配置 (Strong firewall configuration)\n\
  \n### 14 下列哪项是钓鱼邮件的特征？（选择所有适用项。）\n\n**A.** 它没有通过名字称呼你。\n**B.** 它包含拼写错误的单词或语法错误。\n\
  **C.** 它包含伪造的链接。\n**D.** 它来自未经经验的来源。\n\n### 15 你正在讨论物理安全措施，涵盖了员工的背景调查以及密钥管理和存储策略。正在讨论的是哪种类型的物理安全措施？\n\
  \n**A.** 物理 (Physical)\n**B.** 技术 (Technical)\n**C.** 运营 (Operational)\n**D.** 实践\
  \ (Practical)\n\n### 16 下列哪些资源有助于对抗你组织中的钓鱼攻击？（选择所有适用项。）\n\n**A.** Phishkill\n**B.**\
  \ Netcraft\n**C.** Phishtank\n**D.** IDA Pro\n\n### 17 攻击者目标是组织内部的一个特定群体。在对该群体进行一段时间的画像分析后，她注意到该群体成员都会定期访问几个网站。她花时间在一些较敏感的网站中植各种恶意软件和恶意代码。几天后，该群体成员的一台系统从受感染的网站安装了恶意软件，攻击者利用该受感染机器作为网络内部的节点。以下哪项最能定义这种攻击？\n\
  \n**A.** 鱼叉式钓鱼 (Spear phishing)\n**B.** 鲸鱼攻击 (Whaling)\n**C.** 网络钓鱼 (Web-ishing)\n\
  **D.** 水坑攻击 (Watering hole attack)\n\n### 18 哪种类型的社会工程利用冒装、翻垃圾桶、窥屏偷视和尾随？\n\n**A.**\
  \ 物理 (Physical)\n**B.** 技术 (Technical)\n**C.** 基于人的 (Human based)\n**D.** 基于计算机\
  \ (Computer based)\n\n### 19 在检查目标组织网站菜单中的“关于我们”链接时，攻击者发现了公司内部几个不同的个人联系人。针对其中一个联系人，她撰写了一封邮件请求信息，邮件似乎来自公司内部一个预期会提出此类请求的个人。邮件提供了一个供点击的链接，随后提示输入联系人的用户\
  \ ID 和密码。以下哪项最能描述这种攻击？\n\n**A.** 特洛马邮件 (Trojan e-mailing)\n**B.** 鱼叉式钓鱼 (Spear phishing)\n\
  **C.** 社交网络 (Social networking)\n**D.** 运营工程 (Operational engineering)\n\n### 20\
  \ 安全管理员实施了一项控制，在特定主题的电子邮件中嵌入唯一的图像，以验证消息的真实性和可靠性。使用的是哪种反钓鱼方法？\n\n**A.** 隐写术 (Steganography)\n\
  **B.** 登录封 (Sign-in seal)\n**C.** PKI\n**D.** CAPTCHA\n\n### 21 下列哪些应该到位以作为社会工程的应对措施？（选择所有适用项。）\n\
  \n**A.** 信息分类 (Classification of information)\n**B.** 强力安全策略 (Strong security policy)\n\
  **C.** 用户教育 (User education)\n**D.** 强力的变更管理流程 (Strong change management process)\n\
  \n### 22 Joe 每天使用 PIV 卡和 PIN 码登录系统。以下哪项是正确的？\n\n**A.** Joe 和 Jill 使用的是单因素认证。\n**B.**\
  \ Joe 和 Jill 使用的是双因素认证。\n**C.** Joe 使用的是双因素。\n**D.** Jill 使用的是双因素。\n\n### 23 系统所有在入口处安装了视网膜扫描仪。这是哪种类型的安全？\n\
  \n**A.** 技术 (Technical)\n**B.** 运营 (Operational)\n**C.** 物理 (Physical)\n**D.** 行政\
  \ (Administrative)（注：隐含语境）\n\n### 24 下列哪项是控制的最佳表示？\n\n**A.** 空调 (Air conditioning)\n\
