  \ lookup）\n\n*（由于原文 12 题文本逻辑不通，我将跳过到 14 题开始确保翻译质量）*\n\n### 14. 查看以下命令行输入：\n\n![Image](img/f0047.jpg)\n\
  \n关于此命令，哪些陈述是正确的？（选择两个）\n\n**A.** `nslookup` 处于非交互模式。\n**B.** `nslookup` 处于交互模式。\n\
  **C.** 输出将显示 `somewhere.com` 区域的所有邮件服务器。\n**D.** 输出将显示 `somewhere.com` 区域的所有名称服务器。\n\
  \n![Image](img/r.jpg)\n**B, C.** `nslookup` 以两种模式运行——交互式和非交互式。非交互模式只是在命令后面跟着参数。例如，`nslookup\
  \ google.com` 将返回 Google 的 IP 地址。交互模式通过简单输入 `nslookup` 并按回车启动。你的默认服务器将显示，以及其 IP\
  \ 地址，随后光标（`>`）将等待输入你的下一个命令。在这种情况下，我们进入了交互模式并将类型设置为 `MX`，我们都知道这意味着“请向我提供你知道的所有邮件交换服务器”。\n\
  \n![Image](img/w.jpg)\n**A** 是错误的，因为我们显然处于交互模式。\n\n**D** 是错误的，因为类型被设置为 `MX`，而不是\
  \ `NS`。\n\n---\n\n### 15. Joe 从他的家用电脑访问公司网站 www.anybusi.com，看到一个包含令人不安图片的被篡改网站。他打电话给\
  \ IT 部门报告网站黑客攻击，他们他们没有看到网站有任何问题——文件没有被更改，而且从他们的终端（公司内部）访问时，网站显示正常。Joe 通过 VPN 连接到公司网站，发现网站显示正常。以下哪项可能解释这个问题？\n\
  \n**A.** DNS 投毒（DNS poisoning）\n**B.** 路由投毒（Route poisoning）\n**C.** SQL 注入（SQL\
  \ injection）\n**D.** ARP 投毒（ARP poisoning）\n\n\n\n\n\n![Image](img/r.jpg)**A.**\
  \ DNS 投毒在这里是最合理的解释。在许多情况下（例如我目前在家里办公的办公室里），连接到公司的 VPN 将会迫使你使用公司 DNS 而不是本地解析。在这个示例中，Joe\
  \ 从家里进行的连接所使用的 DNS 查询服务器与业务网络使用的 DNS 服务器不同。完全可能有人更改了他本地服务器中的缓存条目，将其指向一个与托管真实网站不同的\
  \ IP 地址——这个 IP 是黑客设置的，用来提供被篡改的版本。网页文件没有发生变化，且从网络内部看网站显示正常，这一事实也证明了这一点。如果结果 Joe 的\
  \ DNS 修改是唯一的变动，那么极有可能是 Joe 正在被针对性地作为攻击目标——这一点 Joe 应该非常认真地对待。最后，`HOSTS` 和 `LMHOSTS`\
  \ 文件在此类情况下也可能起着很大作用；然而，如果攻击者已经拥有了访问 Joe 计算机的这种权限，他面临的问题就比公司网站大得多了。\n\n![Image](img/w.jpg)**B**\
  \ 是错误的，因为路由投毒（route poisoning）与此毫无关系。路由投毒用于距离矢量路由协议，以防止路由表中的路由环路。\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，虽然 SQL 注入确实是一种攻击攻击，但它与此无关。网页文件保持完整且未更改的事实证明了，通过 SQL 漏洞访问网站并非此处发生的情况。\n\n\
  ![Image](img/w.jpg)**D** 是错误的，因为 ARP 投毒在特定的子网内部有效，而不是在子网外部（诚然，你可以通过配置了相应的路由器进行 ARP\
  \ 转发，但这并不符合本题的情况）。ARP 投毒会将请求从同一子网内的一个机器重定向到另一台机器，与此处描述的场景几乎没有关系。虽然你可以从技术角度论证 ARP\
  \ 投毒在这种场景下可能有效，但关键点在于关注显式的网段 DNS 设置。换句话之，Joe 的家庭网络极不可能成为 ARP 投毒的受害者，更有可能的答案是他的 ISP\
  \ 的 DNS 被投毒了。\n\n### 16. 缓解 DNS 投毒的一种方法是限制或限制记录在更新之前留在缓存中的时间。哪种 DNS 记录类型允许你设置这种限制？\n\
  \n**A.** `NS`\n**B.** `PTR`\n**C.** `MX`\n**D.** `CNAME`\n**E.** `SOA`\n\n![Image](img/r.jpg)**E.**\
  \ `SOA` 记录持有各种类型的信息，当涉及到 DNS 投毒时，`TTL` 是主要的关注点。`TTL` 越短，记录留在缓存中的时间就越短。虽然它不能完全防止\
  \ DNS 投毒，但它可以限制成功的缓存投毒攻击所造成的问题。\n\n![Image](img/w.jpg)**A** 是错误的，因为 `NS` 记录显示了域中找到名称服务器。\n\
  \n![Image](img/w.jpg)**B** 是错误的，因为 `PTR` 记录提供了反向查找能力——IP 地址到主机名的映射。\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，因为 `MX` 记录显示了区域内的邮件交换服务器。\n\n![Image](img/w.jpg)**D** 是错误的，因为 `CNAME` 记录用于为你的区域提供别名条目（通常用于一个\
  \ IP 地址上的多个服务或站点）。\n\n### 17. 下列哪项可能是组织的安全性关注问题？\n\n**A.** 内部网络使用注册到 Active Directory\
  \ 集成 DNS 服务器的私有 IP 地址。\n**B.** 外部 DNS 服务器是 Active Directory 集成的。\n**C.** 所有的外部名称解析请求都由\
  \ ISP 完成。\n**D.** 以上都不是。\n\n![Image](img/r.jpg)**B.** 如果你有一个 Windows Active Directory\
  \ (`AD`) 网络，拥有 AD 集成的 DNS 服务器将提供一些巨大的优势。例如（我必须补充一下，这是直接来自微软的），“通过目录集成型存储，DNS 的动态更新是基于多主更新模型进行的。在\
  \ particular 模型中，任何权威 DNS 服务器（例如运行 DNS 服务器的域控制器）都被指定为该区域的主源。由于区域的主副本维护在 Active Directory\
  \ 数据库中，而该数据库完全复制到所有域控制器，因此可以通过运行在域任何域控制器上的 DNS 服务器来更新区域。”每当向 Active Directory 域添加新的域控制器时，区域也会自动复制并同步到新的域控制器，而且目录复制比标准的\
  \ DNS 复制更快、更高效。但让一个 Active Directory 服务器面向外部是一个极糟糕的主意。\n\n![Image](img/w.jpg)**A**\
  \ 是错误的，因为在你的网络内部拥有全私有 IP 地址的 AD 集成 DNS 服务器是完全没问题的。实际上，如果你仔细考虑，这是一个很很好的主意。\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，因为让外部 ISP 为你面向外部的服务器回答所有名称解析请求并不是坏主意。即使 ISP 的 DNS 受到攻击，那里也只有面向外部的主机而已。\n\n\
  ![Image](img/w.jpg)**D** 是错误的，因为提供了一个正确答案。\n\n### 18. 下列哪项是用于发现公开上市公司创立、历史和财务状况的良好足迹探测工具？\n\
  \n**A.** `SpiderFoot`\n**B.** `EDGAR`\n**C.** `Sam Spade`\n**D.** `Pipl.com`\n\n\
  ![Image](img/r.jpg)**B.** `EDGAR` 数据库持有各种企业竞争情报，是 ECCouncil 的最爱。根据该网站之前的文档，“所有外国和国内公司都必须通过\
  \ `EDGAR` 电子提交注册声明、定期报告和其他表格。任何人都可以免费访问并下载这些信息。在这里你可以找到通过 `EDGAR` 获取的文件完整列表以及搜索\
  \ `EDGAR` 数据库的说明。”最后，关于 `EDGAR` 和 SEC 的一点：它们的管辖范围仅限于上市公司。私人公司没有义务在 `EDGAR` 中提交信息。要小心谨慎。\n\
  \n![Image](img/w.jpg)**A** 是错误的，因为 `SpiderFoot` 是一个开源域名足迹探测工具。根据网站，“它将爬取域上的网站，并搜索\
  \ Google、Netcraft、Whois 和 DNS 来构建信息。”\n\n![Image](img/w.jpg)**C** 是错误的，因为 `Sam Spade`\
  \ 是 DNS 足迹探测工具。\n\n![Image](img/w.jpg)**D** 是错误的，因为 `pipl.com` 是一个用于“人员搜索”的网站。对于足迹探测，`pipl.com`\
  \ 可以利用所谓的“深网搜索”获取大量信息。以下来自该网站：“被称为‘隐形网’，‘深网’一词指的是底层内容的巨大库，例如通用网络爬虫无法到达的在线数据库中的文档。深网内容估计是表面网的\
  \ 500 倍，但由于传统搜索引擎的局限性，很大程度上未被开发。”\n\n### 19. traceroute 使用什么方法来映射数据包通过的路由？\n\n**A.**\
  \ 通过在载荷中携带 hello 包，强制主机响应\n**B.** 通过在每个跳处使用 DNS 查询\n**C.** 通过操作生存时间 (`TTL`) 参数\n\
  **D.** 通过使用 ICMP 类型 5, 代码 0 包\n\n\n\n\n\n![Image](img/r.jpg) **C.** Traceroute（至少在带有\
  \ `tracert` 命令的 Windows 机器上）通过在每次命中跳点并返回时将发送的每个数据包的 TTL 加 1 来跨越互联网跟踪数据，确保响应显式地从该跳点返回并返回其名称和\
  \ IP 地址。这提供了路由路径和传输时间。它通过使用 `ICMP ECHO` 包来报告从源到目的地之间每个“跳点”（路由器）的信息。顺带一提，Linux 机器默认使用一系列\
  \ UDP 包来执行 traceroute 的相同功能。\n\n![Image](img/w.jpg) **A** 是错误的，因为 ICMP 并不是那样工作的。Hello\
  \ 包通常用于客户端和服务器之间的一种签入/健康检查机制，而不是路由追踪方法。\n\n![Image](img/w.jpg) **B** 是错误的，因为在每个跳点进行\
  \ `DNS` 查找毫无意义且毫无用处。`DNS` 不是用于路由追踪的；它是用于匹配主机名和 IP 地址的。\n\n![Image](img/w.jpg) **D**\
  \ 是错误的，因为 `ICMP Type 5, Code 0` 包完全关于消息重定向，而不是关于 ping 请求（`Type 8`）。\n\n### 20.\n\
  Brad 在目标面向公众的网站上发现了一些 PDF 文件。他应该使用以下哪个工具从这些文档中提取可用的元数据？\n\n**A.** Metagoofil\n**B.**\
  \ Shodan\n**C.** Whois\n**D.** Maltego\n\n![Image](img/r.jpg) **A.** 元数据是*关于*一个文件的所有信息，这些信息并不一定第一眼就能看出来。例如，假设你在森林里拍了一张很棒（但当然是模糊且对焦焦）大脚的照片。照片本身将是每个看它的人的焦点，但文件还包含了各种其他信息——例如你拍摄时可能在*哪里*以及是*几点*。`Metagoofil`\
  \ 让你能够从各种数据文件中提取这类信息，这对于制定社会工程计划（以及其他其他方面）非常有帮助。\n\n![Image](img/w.jpg) **B** 是错误的，因为\
  \ `Shodan` 不一定是你用来寻找元数据的工具。它是一个搜索引擎，你用它来寻找几乎所有其他东西。`Shodan` 索引它能找到任何连接到互联网的东西——从服务器、摄像头到连接互联网的冰箱和马桶。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为 `whois` 用于查找已注册域的信息，包括所有者以及如何与他们联系。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 `Maltego` 是一个开源情报 (`OSINT`) 和取证分析程序，它聚合了各种 `OSINT` 数据库。\n\n### 21.\n\
  区域文件包含哪些记录？（选择所有适用）\n\n**A.** PTR\n**B.** MX\n**C.** SN\n**D.** SOA\n**E.** DNS\n\
  **F.** A\n**G.** AX\n\n![Image](img/r.jpg) **A, B, D, F.** 区域文件包含记录列表。\n\n![Image](img/w.jpg)\
  \ **C, E, G.** 是错误的，因为它们不是有效的记录。\n\n### 22.\n在该框架内，使用了哪个工具？\n\n**A.** domain.py\n\
  **B.** mail.py\n**C.** search.py\n**D.** usuframework.py\n\n![Image](img/r.jpg)\
  \ **D.** `https://github.com/usuframework` 是一个帮助你收集信息的开源框架。它用于执行各种任务。`usuframework`\
  \ 是框架本身。\n\n![Image](img/w.jpg) **A** 是错误的，因为工具不是 domain。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为工具不是 mail。\n\n![Image](img/w.jpg) **C** 是错误的，因为在该语境下工具不是 search。\n\
  \n### 23.\n一位同事在 Google 搜索中输入了以下内容：\n`intitle:intranet url:intranet intext:\"finance\"\
  `\n\n以下哪个陈述最正确？\n\n**A.** 搜索引擎不会返回任何结果，因为你不能组合 Google 语法（Google hacks）。\n**B.**\
  \ 搜索引擎将返回所有标题中包含 *intranet* 且 URL 中包含 *finance* 的页面。\n**C.** 搜索引擎将返回所有 URL 中包含 *intranet*\
  \ 的页面。\n**D.** 搜索引擎将返回那些标题中包含 *intranet* 且 URL 的正文中包含 *finance* 的页面。\n\n![Image](img/r.jpg)\
  \ **D.** 这是一个组合了操作符的 Google 语法。想想你正在寻找的——（标题和 URL 中包含 *intranet*）且可能包含财务数据。\n\n\
  ![Image](img/w.jpg) **A** 是错误的，因为 Google 语法操作符是可以组合的。事实上，一旦你习惯了它们，你将花费更多时间在组合它们上，以缩小攻击范围。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为操作符并没有说要在 URL 中查找 *finance*。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为操作字符串包含的内容不仅仅是 URL 和标题中的 *intranet* 关键字。\n\n### 24.\nAmanda 担任高级安全分析师，听到一位同事讨论公司过去如何无意中将专有信息存储在主网站上，但自从他们意识到这一点并在一年前将其删除后，这对他们的业务就不再是威胁了。在被问及此事时，他声称几个月前他在公司网站上尝试了随机\
  \ URL 并发现了机信息。Amanda 访问了相同的 URL 但一无所获。Amanda 可以去哪里查看网站的历史版本和页面？\n\n**A.** Search.com\n\
  **B.** Google cache\n**C.** Pasthash.com\n**D.** Archive.org\n\n\n\n\n\n![Image](img/r.jpg)\
  \ **D.** 互联网档案馆（[`archive.org`](http://archive.org)）是一个非营利组织，“致力于建立一个互联网图书馆。其目的包括为研究人员、历史学家、学者、残障人士和普通公众对以数字格式存在的历史收藏提供永久访问。”老牌\
  \ Wayback Machine 长期以来一直被用于提取网站的旧副本，其目的有好的，也有不那么好的。[Archive.org](https://www.Archive.org)\
  \ 包含了“万维网的快照”，这些是追溯到 1996 年的各个时间点拍摄的页面存档副本。补充说明，[Archive.org](https://www.Archive.org)\
  \ 只会抓取并存储被链接、共享或常用的页面，因此不要假设任何人在任何地方曾经上传的每一个页面都始终可用。\n\n![Image](img/w.jpg) **A**\
  \ 是错误的，因为 [Search.com](https://www.Search.com) 仅仅是供你支配的另一个搜索引擎。它并不持有存档副本。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 Google 缓存仅保留最近一次“抓取”的站点副本——通常没有比几天前更早的内容。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为据我所知，Pasthash.com 甚至不存在。\n\n## 25. 下列哪是美国计算机安全事件响应团队（CSIRT）的主要服务？\n\
  \n**A.** CSIRT 提供事件响应服务，为全球范围内的计算机安全事件报告提供可靠且受信任的单一联系点。\n\n**B.** CSIRT 提供计算机安全监视服务，为政府提供有关出国人员的重要情报信息。\n\
  \n**C.** CSIRT 提供渗透测试服务，支持个人和跨国公司对全球范围内的事件进行异常报告。\n\n**D.** CSIRT 提供漏洞评估服务，协助执法机构对个人财产或公司资产进行画像分析。\n\
  \n![Image](img/r.jpg) **A.** EC-Council 非常喜欢 CSIRT，我向你保证会在考试的某处看到它。根据其网站（[www.csirt.org/](https://www.csirt.org/)）），计算机安全事件响应团队（CSIRT）“为任何用户、公司、政府机构或组织提供\
  \ 24x7 的计算机安全事件响应服务。CSIRT 为全球计算机安全事件的报告提供可靠且受信任的单一联系点。CSIRT 提供了报告事件和传播重要事件相关信息的方法。”\
  \ 作为一家成立于 2001 年的私有公司，CSIRT 旨在“提高客户对计算机安全问题的意识，并提供相关信息以保护关键计算基础设施和设备免受潜在的有组织计算机攻击”。\n\
  \n![Image](img/w.jpg) **B、C、** 和 **D** 是错误的，因为这些陈述与 CSIRT 的目的或行为不符。\n\n## 26. 你的客户业务总部位于日本。哪个区域注册机构是最佳查询处\n\
  \n**A.** APNIC\n**B.** RIPE\n**C.** ASIANIC\n**D.** ARIN\n**E.** LACNIC\n\n![Image](img/r.jpg)\
  \ **A.** 这个很简单。\n\n![Image](img/w.jpg) **B** 这个是错误的。\n\n![Image](img/w.jpg) **C**\
  \ 这个是错误的。\n\n![Image](img/w.jpg) **D** 这个是错误的。\n\n![Image](img/w.jpg) **E** 这个是错误的。\n\
  \n# 第 3 章：扫描与枚举\n\n本章包含以下主题：\n\n- 理解 EC-Council 的方法论\n- 描述扫描类型\n- 理解各种工具\n- 理解三路握手和标志位类型\n\
  - 理解子网划分\n- 理解枚举技术\n- 理解漏洞扫描\n- 理解枚举涉及的步骤\n\n我深爱扫描。（等等，我的意思是钓鱼，让我们看看内容）。\n\n\n\n\
  \n\n正如我们通过观察浅滩水面可以发现某些迹象一样，你在虚拟世界中的扫描和枚举工作将引导你走向正确的方向。而且，一旦你对正在查看的内容有了某些经验，你的连接成功率将会提高。正如本学习指南的伴随书籍——*CEH\
  \ Certified Ethical Hacker All-in-One Exam Guide, Fifth Edition* 中提到的，既然你已经学会了如何对客户进行足迹探测（footprint），现在是时候学习如何在你发现的内容中挖掘相关且显著的信息了。在足迹探测之后，你需要进行基础扫描；然后当你发现一台运行中的机器时，你需要深入了解它，提出一些相当“隐私”的问题。\n\
  \n![Image](img/examp.jpg)\n\n**学习技巧**\n首先，最重要的是精通你的通用网络知识。对端口号、协议和通信握手了如指掌般熟悉。顺便，花些时间思考并写下你能想到的一个系统与另一个系统通信时会发生的所有步骤。了解该过程是如何启动的——系统首先在哪里查找名称解析、哪些协议找到你所需的\
  \ MAC 和 IP 地址、使用了哪些传输协议以及为什么——这不仅有助于你通过这次考试，还会让你成为一名更好的渗透测试员。\n\n学习路由/交换基础知识如何影响你的工作：例如，你应该知道`routing`协议（如\
  \ `OSPF` 或 `BGP`）决定了路由器之间如何通信以及如何做出数据包移动决策，而`routed`协议（如 `IP`）是提供网络层地址的协议。虽然这类问题并不多，但关于子网划分的问题将会出现，所以要熟练掌握数学。\n\
  \n在扫描方面，要非常熟悉你的扫描工具。EC-Council 绝对*喜爱* `nmap`，所以要熟悉它的语法、响应、结果、开关……以及所有内容。你将就各种扫描工具的使用、输出、语法等接受抽测提问，因此要通过练习来准备——这是准备此考试的绝对最佳方法。\n\
  \n最后，Windows 和 Linux 架构基础知识不会占据考试的大部分内容，但请放心，你将会在这些方面上接受测试——特别是两者之间的任何不同之处。例如，某些工具可以在\
  \ Windows 上运行，但在 Linux 上不行，反之亦然。每种架构都有内置工具和服务（例如，要非常熟悉 Windows 中 `net` 命令的使用），这些工具在另一种架构上的运行方式可能不同，所以请务必重点学习这些内容。\n\
  \n## QUESTIONS Q\n\n### 1.\n你的团队受雇测试一家名为 Matt’s Bait ’n’ Tackle Shop 的企业（域名 `mattsBTshop.com`）。一名团队成员运行了以下命令：\n\
  \n```bash\nmetagoofil -d mattsBTshop.com -t doc,docx -l 50 -n 20 -f results.html\n\
  ```\n\n以下哪项最准确地描述了该成员尝试的操作？\n\n**A.** 从 mattsBTshop.com 的网页中提取元数据信息，并以 Microsoft\
  \ Word 格式输出结果\n**B.** 从 mattsBTshop.com 中的 results.html 页面提取元数据信息，并以 Microsoft Word\
  \ 格式输出结果\n**C.** 从 mattsBTshop.com 中发现的 Microsoft Word 文档中提取元数据信息，并以 HTML 文件输出结果\n\
  **D.** 将 results.html 作为宏附件上传到 mattsBTshop.com 中发现的任何 Microsoft Word 文档中\n\n###\
  \ 2.\n你正在作为评估的一部分，运行多个多次枚举扫描。在某次特定扫描中，你让 `nmap` 发送一个初始 `FIN` 包，紧接着发送一个 `ACK` 包。以下哪项最准确地描述了你正在的扫描类型？\n\
  \n**A.** 反向 TCP\n**B.** TCP Maimon\n**C.** XMAS\n**D.** 半关闭扫描\n\n### 3.\n你准备好了一个僵尸系统（zombie\
  \ system）并开始 IDLE 扫描。随着扫描进行，你注意到从僵尸机获取的碎片识别码正在随机增加。这意味着什么？\n\n**A.** 你的 IDLE 扫描结果对你没有用。\n\
  **B.** 该僵尸系统是一个蜜蜜罐。\n**C.** 你和僵尸机之间存在一个异常的防火墙。\n**D.** 这是 IDLE 扫描期间的预期结果。\n\n###\
  \ 4.\n你想对目标组织内的一个子网进行 ping 范围扫描（ping sweep）。以下哪条 `nmap` 命令是你的最佳选择？\n\n**A.** `nmap\
  \ 192.168.1.0/24`\n**B.** `nmap -sT 192.168.1.0/24`\n**C.** `nmap -sP 192.168.1.0/24`\n\
  **D.** `nmap -P0 192.168.1.0/24`\n\n# 5.\n一名渗透测试员正在执行 banner grabbing（banner grabbing），并执行了以下命令：\n\
  \n```bash\n$ nmap -sV host.domain.com -p 80\n```\n\n他得到了以下输出：\n\n![Image](img/f0060-01a.jpg)\n\
