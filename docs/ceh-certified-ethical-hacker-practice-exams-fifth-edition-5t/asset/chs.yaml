  23 A, B, C, D\n\n## 答案 A\n\n### 1 应急响应（IR）是组织安全的重要部分。在事件处理过程的哪一步，IR 团队成员将禁用或删除用户账户并更改防火墙规则？\n\
  \n**A.** 检测与分析\n**B.** 分类与优先级排序\n**C.** 遏制\n**D.** 取证调查\n\n![Image](img/r.jpg)**C.**\
  \ 在你贯全书中反复听到的论调中，有时现实生活和 EC-Council 并不一致。然而，当涉及到 IR 时，ECC 基本是对的。几乎。许多组织以不同的方式定义事件处理响应，有不同的阶段阶段。但总体来说，所有的事件处理都属于四组操作：识别、遏制、根除和恢复。大多数组织会在之前定义一个准备阶段，并在结束后定义一个教训阶段，以形成完整的事件流程。ECC\
  \ 定义了八个阶段：\n\n\n\n\n\n## 事件响应阶段\n\n- **准备阶段**：在此阶段定义规则、流程和工具集，并对其进行测试（通常至少会进行某些定期的演练）。\n\
  - **检测与分析**：这是执行告警功能（工具集、`IDS`、`IPS`、用户通知异常事件等）以及对事件进行初步研究的阶段。\n- **分类与优先级排序**：在此阶段决定是否将某事升级为事件，以及升级到何种级别（为了虚假报警升级响应事件对任何人都无益）。分类级别因组织而异，但通常会为不同级别分配响应时间范围。\n\
  - **通知**：在此阶段通知相关的团队和组织以协助处理事件。\n- **遏制**：在此阶段采取遏制事件的步骤。这可能包括撤销或挂起用户账户，以及通过防火墙或其他方法阻止系统甚至子网的访问。\n\
  - **取证调查**：在此阶段，如果可能的话，将提取实时内存和磁盘镜像以进行评估和分析。这不需要等到事件结束，但根据涉及的资产和事件的性质，取证工作可能需要等待。\n\
  - **清除与恢复**：此阶段涵盖了为移除事件原因（恶意软件、恶意代码、后门、根基程序、病毒等）以及在将资产重新投入生产之前将其恢复到基准标准的所有步骤。\n\
  - **事后处理**：在此阶段汇总报告、后续分析和教训。此步骤的评估结果将反馈到下一次事件的准备阶段。\n\n关于事件响应和事件处理的问题可能相当模糊。在大多数情况下，对于任何真正奇怪的事情，常识应该引导你，但大多数问题都会像这个问题一样——自己就能很容易解决。最后说明一点：本回答描述开头列出的四个阶段很可能是你在考试中看到的，所以如果你有疑问，我建议坚持选择它们。\n\
  \n![Image](img/w.jpg) `B`、`C` 和 `D` 是错误的，因为问题中列出的操作并未在这些事件处理阶段发生。\n\n## 问题 2\n\n\
  某软件公司对一个应用程序进行了严格测试，并在发布当天确信软件没有已知漏洞。一家名为 BigBiz 的组织以溢价购买了该软件，并获得了服务、维护和责任保证。BigBiz\
  \ 组织使用的是哪种风险管理方法？\n\n- **A.** 接受 (Accept)\n- **B.** 转移 (Transfer)\n- **C.** 规避 (Avoid)\n\
  - **D.** 缓解 (Mitigate)\n\n![Image](img/r.jpg) `B.` 根据你交流对象的不同，风险管理中有多达七种不同的方法。然而，对你和\
  \ EC-Council 最关重要的是这四种：接受、规避、转移和缓解。在这个示例中，组织向软件开发者支付了费用，信任他们已经测试了软件，并且他们将承担该软件的责任和义务。事实上，该组织将此应用程序的风险*转移*给了软件公司。转移风险的核心在于寻找另一个实体来承担管理风险的责任，并承担因风险导致利用或损失的责任。\n\
  \n![Image](img/w.jpg) `A` 是错误的，因为这并没有描述“接受”。接受风险意味着组织意识到风险的存在，但由于各种原因（例如缓解成本或或风险被利用的可能性极低），决定不对采取任何行动。基本上，所有者决定如果风险真的发生，他们将直接面对后果。\n\
  \n![Image](img/w.jpg) `C` 是错误的，因为这并没有描述“风险规避”。在风险规避中，组织识别出风险并消除与其相关的一切。如果某个特定的服务、应用程序或技术对组织有用，但处理在使用其涉及风险所需的成本和精力太高，则组织将放弃该项。\n\
  \n![Image](img/w.jpg) `D` 是错误的，因为这并没有描述“缓解”。风险缓解正如其听起来的那样：组织需要采取措施来降低风险被利用的可能性，因此可以完全不使用该服务。\n\
  \n## 问题 3\n\n以下哪些工具可以为组织提供类似于渗透测试的结论？（选择多项）\n\n- **A.** Metasploit\n- **B.** Nessus\n\
  - **C.** Core Impact\n- **D.** CANVAS\n- **E.** SAINT\n- **F.** GFI LanGuard\n\n\
  ![Image](img/r.jpg) `A`、`C` 和 `D.` 是错误的，因为问题中列出的操作并未发生在这些事件处理阶段中。在某些看来，自动化测试套件可以被视为为客户节省时间和资金的手段，但（至少在现实世界中）它们无法提供像专业安全人员测试那样的结果。工具*可以*提供大量真实有用的信息，但大多数都无法提供真正的测试结果。Metasploit\
  \ 有免费开源版本和一个极其昂贵的“Pro”版本。\n\nCore Impact 可能是最著名的、全功能的自动化测试框架。根据其网站 ([`www.coresecurity.com/core-impact`](https://www.coresecurity.com/core-impact))，Core\
  \ Impact “通过安全地模拟各种威胁，将安全测试提升到了新水平——为数据泄露的原因、影响和预防提供广泛可见性。” Core Impact 测试范围从 Web\
  \ 应用程序、系统到网络设备和无线。\n\n根据 Immunity Security 网站 ([www.immunitysec.com](https://www.immunitysec.com))，CANVAS\
  \ “为渗透测试和安全专家提供了数百个漏洞、自动化利用系统以及一个全面可靠的漏洞开发框架。”此外，该公司声称 CANVAS 的参考实现 (`CRI`) 是“行业首个针对\
  \ IDS 和 IPS 测试的开放平台。”\n\n对于那些现实世界的纯主义者以及还没有这方面经验的人来说，重要的是要注意，没有任何自动化测试套件能提供接近真实渗透测试所获得的结果。Core\
  \ Impact 提供一键自动渗透测试结果功能（可能提供了最好的结果和报告功能），Metasploit 提供 autopwn，而 CANVAS 也有类似的“全运行”模式；然而，所有工具都会受到误报和漏报的影响。（对于你的考试，请坚持这里列出的这三个）。\n\
  \n![Image](img/w.jpg) `B`、`E` 和 `F` 是错误的，原因相同：它们都是漏洞评估工具套件，而不是自动化渗透测试框架。Nessus 可能是这三个中最具知名度的，但\
  \ SAINT 和 GFI LanGuard 都被列为顶级漏洞评估应用程序。\n\n## 问题 4\n\n以下哪项最能描述对网络网段的评估，该评估测试了现有漏洞但并未尝试利用任何漏洞？\n\
  \n- **A.** 渗透测试 (Penetration test)\n\n\n\n\n\n## B. 部分渗透测试\n## C. 漏洞评估\n## D. 安全审计\n\
  \n![Image](img/r.jpg)\n**C.** 漏洞评估正如其名称所言：对系统或网络进行搜索并识别可能被利用的漏洞。这些漏洞可能是由于安全配置不当、缺少补丁，或坏人可能利用的任何其他弱点。漏洞评估的两个关键点在于：识别漏洞而非利用漏洞，且报告仅仅是某个时间点的快照。该组织需要决定多多久运行一次漏洞评估。最后，需要注意的是，某些漏洞在不进行利用的情况下是无法确认的。例如，通过注入\
  \ SQL 语句来暴露 SQL 注入漏洞的行为很可能构成一种利用行为，但这是证明其存在的唯一方法。不过，对于你的考试来说，请坚持在此评估期间不进行任何利用，并继续你的其他工作。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为渗透测试的团队成员不仅发现漏洞，还会积极地利用它们（当然，是在预先安排好的协议范围之内）。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为这不是与评估类型相关的有效术语，被作为干扰项包含。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为安全审计旨在测试组织本身的安全策略。不言而喻，在进行安全审计之前，组织必须已经有一套安全策略。\n\n### 5. \n你是一个正在进行测试的渗透测试团队成员。你的团队已经具备了所有必要的范围、参与条款以及保密协议和服务水平协议。你获得了某位员工系统的访问权限，在进一步测试过程中，在一个隐藏驱动器文件夹中发现了儿童色情内容。作为一个伦理黑客，你的最佳行动方案是什么？\n\
  \n**A.** 继续测试且不通知任何人，但确保将该信息包含在最终的简报报告中。\n\n**B.** 继续测试且不中断，但完全删除所有隐藏文件和包含色情内容的文件夹。\n\
  \n**C.** 停止测试并立即通知执法部门。\n\n**D.** 停止测试并删除所有入侵该机器的证据。\n\n![Image](img/r.jpg) **C.**\
  \ 如果你曾在高中或大学上过任何哲学课程，你毫无疑问读过某些为了挑战对某事非黑即白的思维而提出的伦理困境。例如，盗窃无疑是坏的，并且在地球上几乎每一个法律体系中都被视为犯罪，但如果它是救一个孩子生命的唯一方法呢？在伦理黑客领域，当你发现某些东西时，采取的行动存在微妙的界限，有时在没有其他选择的情况下存在硬性边界。拥有儿童色情制品是犯罪，所以这个案例看起来相对容易判断。为了公平起见，并考虑到你在考试此类问题上需要做的假设，你的行动方案是直接且简单的：通知当局并让他们处理。\n\
  \n在现实世界中，情况可能会稍微复杂。你如何真正确定你看到的是什么？你能够确定你所看到的在本质上是违法的吗（无论它是什么——色情、文档、信件等）？如果你不确定并错误指控某人，你将面临什么样的责任？你的团队呢？在战斗激烈的时刻，这不是一个容易回答的问题，你很大程度上将依赖预先良好的、可靠的渗透测试协议。让客户知道在发现非法材料时将采取哪些行动，并约定双方将采取的行动。否则，你和你的客户可能会面临非常艰难的时期。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为发现儿童色情内容自动要求停止测试活动并联系当局。等到简报阶段不是恰当的方案，并且会让你陷入困境。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为这不仅是不符合伦理的行为且超出了范围和测试协议的限制，而且违反了法律。你至少篡改了证据并妨碍了司法。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为删除你行为的证据不是正确的做法，而且在伦理上最不可接受（取决于情况，实际上可能被视为非法）。\n\
  \n### 6. \n在渗透测试的哪个阶段进行扫描？\n\n**A.** 攻击前\n**B.** 攻击阶段\n**C.** 攻击后\n**D.** 侦察\n\n\
  ![Image](img/r.jpg) **A.** 我知道你厌倦了 CEH 的定义、术语和攻击阶段，但这是另一个你只需要刻在记忆的内容。根据 EC-Council\
  \ 的规定，渗透测试有三个阶段：攻击前、攻击和攻击后。攻击前阶段是进行扫描和其他侦察活动（收集竞争情报、网站爬取等）的地方。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为扫描是在攻击前阶段完成的。攻击阶段包含四个工作领域：渗透边界、获取目标、执行攻击、提升权限。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为扫描在攻击后阶段之前很久就已完成了。攻击后阶段完成的操作包括删除已上传的文件和工具、（如需要）恢复到原始状态、分析结果以及为客户准备报告。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为侦察不是渗透测试的一个阶段。\n\n### 7. \n以下哪项描述了在尽力实施所有安全控制后剩余的风险？\n\
  \n**A.** 剩余风险\n**B.** 固有风险\n**C.** 延迟风险\n**D.** 剩余\n\n![Image](img/r.jpg) **A.**\
  \ 风险管理有很多术语需要记忆，识别实施安全控制前后的风险是本题的核心。系统的固有风险是在你不实施任何安全控制时存在的风险：换句话说，每个系统、应用、技术和服务都存在固有风险。在意识到这些固有风险并实施安全控制后，可能会存在一些剩余风险。换句话说，剩余风险是在实施安全控制后系统中剩下的风险。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为固有风险是你实施安全控制之前的系统风险。\n\n![Image](img/w.jpg) C\
  \ 和 D 是错误的，因为这些词仅作为干扰项包含。\n\n### 8. \n关于 OSSTMM，以下哪些是正确的？多选）\n\n**A.** OSSTMM 是一个非营利的国际研究倡议，致力于定义安全测试和业务诚信测试的标准。\n\
  **B.** OSSTMM 识别十种控制，分为两类。\n**C.** ISECOM 维护 OSSTMM。\n**D.** OSSTMM 定义了三种合规类型。\n\
  \n![Image](img/r.jpg) **B, C, D.** 开源安全测试方法论（OSSTMM）为彻底的安全测试（也称为 OSSTMM 审计）提供了一种方法。它由\
  \ ISECOM（安全与开放方法研究所；[www.isecom.org/](https://www.isecom.org/)）维护，是一份经过同行评审的安全测试和分析手册，能够产生组织可以采取以改进安全的基于事实的行动。OSSTMM\
  \ 识别十种控制类型，分为两个不同的类别。\n\n\n\n\n\n- **A 类：交互** 认证、赔偿、韧性、制服和连续性\n- **B 类：过程** 不可否认性、机密性、隐私性、完整性和告警\n\
  \nOSSTMM 审计测试三种不同类型的合规性：法律、合同和基于标准的合规性。\n\n![Image](img/w.jpg) **A** 是错误的，因为这实际上是\
  \ ISECOM 的描述——ISECOM 是负责创建和维护 OSSTMM 的小组。\n\n### 9. 以下哪项是由 OISSG（开放信息系统安全组）产生并旨在提供安全测试协助的开源项目？\n\
  \n**A.** OSSTMM\n**B.** OWASP\n**C.** COBIT\n**D.** ISSAF\n\n![Image](img/r.jpg)\
  \ **D.** 以下内容来自 OISSG 网站：“信息系统安全评估框架（ISSAF）由开放信息系统安全组产生，旨在全面报告现有控制的实施情况以支持 IEC/ISO\
  \ 27001:2005(BS7799)、萨班斯-奥克斯利 SOX404、COBIT、SAS70 和 COSO，从而为 IT 相关业务转型计划的运营方面增加价值。它从底层开始设计，旨在演变为在安全评估工作中寻求独立性和中立性的全面知识体系。”\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 OSSTMM 是一个由 ISECOM 维护的经过评审的安全测试和分析手册，结果是组织可以采取的改进安全性的基于事实的。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为 OWASP（开放 Web 应用安全项目）是一个开源 Web 应用安全项目。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为 COBIT（信息和相关技术控制目标）是 ISACA 为信息技术（IT）管理和治理创建的实践治理框架和支持工具集。\n\n###\
  \ 10. NIST SP 800-30 定义了进行风险评估的步骤。以下哪个说法正确？\n\n**A.** 威胁在漏洞之前被识别。\n**B.** 确定影响范围是第一步。\n\
  **C.** 概率在评估后确定。\n**D.** 风险评估是一个循环过程。\n\n![Image](img/w.jpg) **A** 是错误的，因为 NIST\
  \ SP 800-30 定义了进行风险评估的步骤。以下哪个说法正确？\n\n![Image](img/w.jpg) **A.** NIST SP 800-30\
  \ 定义了进行风险评估的步骤。以下哪个说法正确？\n\n![Image](img/w.jpg) **A** 是错误的，因为 NIST SP 800-30 定义了进行风险评估的步骤。以下哪个是是......\
  \ is... is the the the is assessment。\n\n![Image](img/w.jpg) **B** 是错误的，因为 NIST\
  \ SP 800-30 定义了进行风险评估的步骤。以下哪个说法正确？\n\n![Image](img/w.jpg) **C** 是错误的，因为 NIST SP\
  \ 800-30 定义了进行风险评估的步骤。以下哪个说法正确？\n\n![Image](img/w.jpg) **D** 是错误的，因为 NIST SP 800-30\
  \ 定义了进行风险评估的步骤。以下哪个说法正确？\n\n### 11. 在渗透测试的哪个阶段团队将获取目标？\n\n**A.** 攻击前\n**B.** 攻击中\n\
  **C.** 攻击后\n**D.** 以上都不是\n\n![Image](img/r.jpg) **B.** NIST SP 800-30 定义了进行风险评估的步骤。以下哪个说法正确？\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 NIST SP 800-30 定义了进行风险评估的步骤。以下哪个说法正确？\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为 NIST SP 800-30 定义了进行风险评估的步骤。以下哪个说法正确？\n\n![Image](img/w.jpg) **D**\
  \ 是错误的，因为 NIST SP 800-30 定义了进行风险评估的步骤。以下哪个说法正确？\n\n### 12. 许多组织运行“兵演习”场景来测试安全措施。以下哪个说法正确？\n\
  \n**A.** 协助防御的小组被称为蓝队。\n**B.** 协助防御的小组被称为红队。\n**C.** 协助防御的小组被称为白帽小组。\n**D.** 攻击系统的组是答案。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 NIST SP 800-30 定义了进行风险评估的步骤。以下哪个说法正确？\n\n###\
  \ 13. 以下哪项最能描述专业渗透测试团队成员与黑客之间的区别？\n\n**A.** 道德黑客因其时间获得报酬。\n**B.** 道德黑客从不利用漏洞；他们只指出漏洞的存在。\n\
  **C.** 道德黑客不使用与黑客相同的工具和行动。\n**D.** 道德黑客持有系统所有者预定义的范围和协议。\n\n\n\n\n\n![Image](img/r.jpg)\
  \ **D.** 这一题是书中一个经典的考点，会在你的考试中出现几次。专业渗透测试团队成员（伦理黑客）与世界上黑客之间唯一真正的区别在于，在任何攻击开始之前，存在正式批准并达成共识的范围和合同。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为虽然专业的伦理黑客在渗透测试期间的付出是有报的，但这并不是区分两者（伦理与非伦理）的必然标准。某些黑客可能会为了各种非法活动获得报酬。例如，某公司可能想要伤害竞争对手，因此雇佣了一名黑客进行攻击。\n\
  \n![Image](img/w.jpg) **B** 和 **C** 错误的原因相同。如果渗透测试团队成员从不利用机会，并且拒绝使用世界上黑客所触手可及的相同工具和技术，那么评估的意义何在？渗透旨在展示真实的安全漏洞和缺陷，而做到点的唯一方法就是像黑客一样进行攻击。\n\
  \n### 14. Sally 是渗透测试团队的一员，正开始一项测试。客户为他们其中一个子网提供了一个网络插口，让 Sally 从那里发起攻击。然而，他们没有提供任何身份验证信息、网络拓图或其他有关系统的显著数据。Sally\
  \ 正在进行哪种测试？\n\n**A.** 外部，白盒\n**B.** 外部，黑盒\n**C.** 内部，白盒\n**D.** 内部，黑盒\n\n![Image](img/r.jpg)\
  \ **D.** Sally 被提供了组织网络内部的网络插口，所以我们知道这是内部测试。此外，没有提供任何类型的信息——从我们所收集的来看，她对内部运作、登录信息、网络设计等一无所知。因此，这是黑盒测试——即内部黑盒测试。\n\
  \n![Image](img/w.jpg) **A** 和 **B** 是错误的，因为这是内部测试，而不是外部测试。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为白盒测试应该包含 Sally 想关于网络的所有信息。这将模拟一个心怀不满的内部网络或系统管理员。\n\n### 15. 你们的渗透测试团队正在与一个潜在客户讨论服务。客户表示他们没有看到渗透测试的价值。你们团队的正确回复应该是哪个？\n\
  \n**A.** 运行几次测试并向客户展示结果，以证明渗透测试的价值。\n**B.** 提供你们测试过的其他客户的详细结果，展示计划测试和发现安全缺陷的价值。\n\
  **C.** 从可靠来源提供有关渗透测试和安全漏洞的信息及统计数据。\n**D.** 无论如何执行渗透测试，以防他们改变主意。\n\n![Image](img/r.jpg)\
  \ **C.** 伦理行为一定会出现在你的考试中。你们的潜在客户可能看不到价值，但正如俗语说：“你可以把马引到水边，但不能强它喝水。”（注：原文此处存在大量重复文本，已按逻辑处理翻译）。\n\
  \n\n\n\n\n![Image](img/w.jpg)**A** 是错误的，因为“掩盖踪迹”是定义黑客攻击阶段的一部分，而不是渗透测试的阶段。\n\n![Image](img/w.jpg)**B**\
  \ 和 **C** 是错误的，因为这些步骤没有发生在攻击前阶段或攻击阶段。\n\n### 19. 关于渗透测试，以下哪些陈述是正确的？（选择所有适用）\n\n\
  **A.** 渗透测试不包括社会工程学。\n**B.** 渗透测试可能包括对网络的不预告攻击。\n**C.** 在渗透测试期间，安全专业人员可以执行他们选择的攻击。\n\
  **D.** 渗透测试始终有范围。\n**E.** 最终报告中不包含所有参与测试的人员列表。\n\n![Image](img/r.jpg)**B, D.** 渗透测试由安全专业人员执行，他们受特定范围和交互规则（rules\
  \ of engagement）的约束，这些规则在评估开始前必须经过仔细制定、审查并达成共识。这种协议允许在组织高层管理人员决定要测试其 IT 安全人员的反应时间和方法时，进行不预告测试。\n\
  \n![Image](img/w.jpg)**A, C,** 和 **E** 是错误的，因为这些是关于渗透测试的错误陈述。除非范围协议中明确禁止，否则社会工程学是任何真实渗透测试的重要部分。范围协议通常定义了测试人员可以走多远——例如，不允许进行意的拒绝服务攻击等。测试后，会向客户提供一份发现的漏洞列表，即使团队没有利用它们：在评估过程中并不总能破解每一个安全漏洞，但这并不是向客户隐藏它们的理由。最后，最终报告中包含了所有参与测试的人员列表。\n\
  \n### 20. 以下哪种因素会导致潜在的安全泄露？\n\n**A.** 漏洞 (Vulnerability)\n**B.** 威胁 (Threat)\n**C.**\
  \ 漏洞利用 (Exploit)\n**D.** 零日 (Zero day)\n\n![Image](img/r.jpg)**B.** 那么哪个是先生的——鸡还是蛋？这个问题和它的逻辑非常相似，可能非常令人困惑，但如果你关注问题的“原因”部分，你就没问题了。当然，漏洞必须存在；然而，漏洞本身不会导致任何结果。`threat`（威胁）是可能利用现有漏洞的东西。威胁可以是故意的、无意的、人为的，甚至是“天灾”。黑客是一个利用系统上开放端口和/或弱质密码策略的威胁。雷暴雨是一个利用屋顶裂缝并导致水水渗漏到你系统中的威胁。老天，犀牛是一个会撞破并并毁房间内所有设备的威胁。这些威胁是否有意图、是否可行、以及是否愿意/能够利用漏洞，是需要风险评估来决定的；他们可能会加强密码策略并修复屋顶，但我怀疑在犀牛方面不会做什么。\n\
  \n![Image](img/w.jpg)**A** 是错误的，因为漏洞是安全方面的一个弱点。漏洞可能是一个问题，也可能不是一个问题。例如，你的系统可能有一个极其糟糕的密码策略，甚至缺少了安全补丁，但如果它从未连接到网络，并且被锁在一个有守卫的房间里，只有三个人可以进入，且他们必须通过生物识别系统才能打开门，那么这些漏洞的存在就没有意义。\n\
  \n![Image](img/w.jpg)**C** 是错误的，因为漏洞利用（exploit）是威胁主体为了利用漏洞而执行或实际上可以的操作。漏洞利用可以是局部的或远程的、一段软件、一系列命令，或任何实际利用漏洞获取访问权限或其他影响目标的东西。\n\
  \n![Image](img/w.jpg)**D** 是错误的，因为零日利用（zero-day exploit）仅仅是指我们大多数人在使用它时并不真正了解它的漏洞利用。例如，几年前，一些坏分子发现了\
  \ Adobe Reader 中的一个漏洞并开发了针对它的利用程序。从创建该利用程序到 Adobe 最终意识到其存在并构建了修复措施来缓解它之间，该利用程序被称为\
  \ `zero-day`。\n\n### 21. 哪种 Metasploit 负载（payload）类型通过 DLL 注入运行，防病毒软件难以检测？\n\n**A.**\
  \ Inline（内联）\n**B.** Meterpreter\n**C.** Staged（分阶段）\n**D.** Remote（远程）\n\n![Image](img/r.jpg)**B.**\
  \ 对于那些为这个问题恐慌的人，请放松。你不需要了解 Metasploit 的所有内部原理，但在用于 CEH 认证的各种学习材料中，它的出现频率足够高——EC-Council\
  \ 希望你了解一些基础知识，而这个问题就属于这一类。Metasploit 中有许多不同的负载类型，`meterpreter`（meta-interpreter\
  \ 的缩写）就是其中之一。以下摘自 Metasploit 网站：“Meterpreter 是一个包含在 Metasploit Framework 中的高级负载。它的目的是提供复杂且高级的功能，否则这些功能在汇编语言中实现将非常繁琐。它实现这一目标通过允许开发者以共享对象（DLL）文件的形式编写自己的扩展，这些文件可以在利用发生后被上传并注入到目标上的运行进程中。Meterpreter\
  \ 及其加载的所有扩展完全在内存中执行，从不接触磁盘，从而允许它们在防病毒检测的防范区内执行。”\n\n![Image](img/w.jpg)**A** 是错误的，因为内联负载（inline\
  \ payloads）是包含完整利用和 shell 代码的单一负载。它们可能比其他负载更稳定，但由于体积原因，可能不适用于攻击。\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，因为分阶段负载（staged payloads）在攻击机和受害者之间建立连接。一旦连接建立，负载就会返回并在远程机器上执行。\n\n![Image](img/w.jpg)**D**\
  \ 是错误的，因为“远程”（remote）并不是一种认可的负载类型。\n\n### 22. Metasploit 是一个允许针对远程主机开发和执行利用代码的框架，设计用于渗透测试。框架由多个库组成，每个库执行特定的任务和功能。哪个库被认为是\
  \ Metasploit 框架最基础的组件？\n\n**A.** MSF Core\n**B.** MSF Base\n**C.** MSF interfaces\n\
  **D.** Rex\n\n![Image](img/r.jpg)**D.** 再次，这是另一个你在考试中可能会看到的奇怪问题（涉及框架的任何组件）。在这里包含是为了让你在实际考试中不会感到措手不及，也不会因为没听过它而不知所措。不要担心在考试前学习\
  \ Metasploit 的所有细节和架构——专注于记忆框架的基础知识（每个区域的关键词会有帮助），你就会没事的。\n\n正如你们所知，Metasploit 是一个允许各种自动化（点对点）渗透测试方法的开源框架。该框架采用模块化设计，每个库和组件负责其自己的功能。以下摘自\
  \ Metasploit 的开发指南（你现在可以在很多地方找到，只需在 Google 上搜索 `msf_dev_guide filetype:pdf`）：“架构中最基础的部分是\
  \ Rex 库，它是 Ruby Extension Library 的缩写。Rex 提供的某些组件包括封装套接子系统、协议客户端和服务器的实现、日志子系统、利用工具类以及许多其他有用类。”\
  \ Rex 为整个框架提供关键服务。\n\n\n\n\n\n![Image](img/w.jpg) **A** 是错误的，因为 `MSF Core` “负责实现所有必需的接口，允许与漏洞模块、会话和插件进行交互。”它直接与\
  \ `Rex` 接口。\n\n![Image](img/w.jpg) **B** 是错误的，因为 `MSF Base` “设计用于为处理框架核心提供简单的封装例程，并提供用于处理框架不同方面的实用程序类，例如将模块状态序列化到不同的输出格式”。Base\
  \ 是 Core 的扩展。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `MSF` 接口是您（用户）与框架交互的手段。Metasploit\
  \ 的接口包括 `Console`、`CLI`、`Web` 和 `GUI`。\n\n#### 23. 下列哪些措施可能是针对内部攻击者的有效反措施？（选择所有适用项。）\n\
  \n**A.** 强制执行高特权控制。\n**B.** 加固所有的垃圾桶和碎纸收集箱。\n**C.** 强制良好的物理安全实践和政策。\n**D.** 对所有员工进行背景检查。\n\
  \n![Image](img/r.jpg) **A, B, C, D.** 所有答案都是正确的。诚然地说，你确实无法做任何完全防止内部攻击。根本没有办法确保每一位员工都能保持快乐和满意，就像无法判断某人何时会突然决定转向犯罪一样。这种情况在美国企业界中不断发生，因此你所能做的最好的，当然就是你所能做的最好的。\n\
  \n强制执行高特权控制（即确保用户仅拥有完成工作所需的访问权限、权利和特权，而更多）似乎是一项常识，但许多企业网络竟然忽视了这一点，这令人惊叹。毕竟，一个对自己的机器拥有管理员权限的不满员工所造成的损害，比只有普通用户权限的员工大得多。加固垃圾桶和实施良好的物理安全措施应该有助于防止想要在下班后回来窥探的内部人员。此外，虽然对员工进行背景检查在那种情况下绝非灵丹妙药，但确实可以帮助确保你从一开始就招聘了正确的人（在许多公司，背景检查是\
  \ `law` 的要求）。以下是其他步骤：\n\n* 监控用户网络行为。\n* 监控用户计算机行为。\n* 禁用远程访问。\n* 在所有系统上禁用可移动驱动器的使用（USB\
  \ 驱动等）。\n* 粉碎所有丢弃的纸张。\n* 进行用户教育和培训计划。\n\n## 附\n\n## 关于在线内容\n本书附带 TotalTester Online\
