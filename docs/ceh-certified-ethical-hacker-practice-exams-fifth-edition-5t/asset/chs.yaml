  \ D\n14. A, B, D\n15. C\n16. B, C\n17. D\n18. C\n19. B\n20. B\n21. A, B, C, D\n\
  22. D\n23. A\n24. B\n25. B\n\n## A 答案\n\n### 1 在观察目标组织的建筑时，你注意到唯一的入口门内内设了一名守卫。在进入外部门后，你注意到建筑大厅被一个带有玻璃面板的小房间与外部门隔开，房间有一扇门面向外部，另一扇面向内部。房间里似乎有一个\
  \ RFID 扫描设备和一个带有视频显示的小型键盘。以下哪项最能定义这种物理安全控制？\n\n**A.** 守卫室 (Guard shack)\n**B.**\
  \ 旋转门 (Turnstile)\n**C.** 人员间 (Man shack)\n**D.** 人员禁闭 (Man trap)\n\n\n\n\n\n![Image](img/r.jpg)\
  \ **D.** 如果你参加过关于大学橄榄球历史的考试，你就知道会有一道关于阿拉巴马州的问题。如果你参加过关于小号演奏者的考试，会有一道关于迪齐·吉尔斯斯（Dizzy\
  \ Gillespie）的问题。如果你参加过关于认证伦理黑客（CEH）物理安全措施的考试，你会被问到人肉陷（man trap）。\n\n`man trap`（人肉陷）只不过是一个锁闭的空间，你在验证人员进入安全区域的权限时可以将他们关在里面。它通常是一个玻璃（或透明塑料）墙围的房间，当人员进入时，外门会自动锁定。然后会是某种身份验证机制，例如带有\
  \ PIN 码的智能卡或生物识别系统。假设验证成功，通往建筑内部的第二扇门将解锁，允许该人员进入。如果验证失败，门将保持锁定状态，直到安保人员检查完毕。顺便提一下，除了验证之外，一些人肉陷还会添加其他检查，例如测量人的体重，以查看他们是否自周五以来神秘地增加了或减轻了\
  \ 20 磅。\n\n这里的其他几点可能对你有所帮助：首先，我见过人肉陷被定义为手动或自动，其中 `manual` 是由安保人员锁定和解锁大门，而 `automatic`\
  \ 则是将锁与身份验证系统相连，如前所述。其次，在某些定义中，人肉陷也被称为 `air lock`（气锁）。如果你在考试中看到这个术语，要知道它指的就是人肉陷。第三，现实世界中的人肉陷有时以旋转门或闸机的形式出现，如果人员未通过身份验证，会在旋转一半时锁定。而且，在某些非常高级的设备中，如果有两个人试图同时通过，传感器将锁定人肉陷。\n\
  \n最后，还有最后一个重要的说明——人肉陷也被定义或称为 `access control vestibule`（访问控制门厅/缓冲室）。听起来很顺口，不是吗？\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为这个问题描述的不是一个有守卫人员驻守的门处小位置。传统上，守卫室位于外墙或设施大门处，守卫人员可以在允许人员进入停车场之前验证其身份。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为这里描述的不是闸机，而且坦率地说，它对物理安全毫无用处。任何在地铁系统中待过时间的人都知道这个事实：看人们跳过闸机是一项很棒的观赏运动。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为据我所知，`man shack` 并不是 CEH 内的物理安全术语。它可能是 20 世纪\
  \ 70 年代迪斯科热门歌曲的标题，但不是你考试需要掌握的物理安全术语。\n\n### 2. 在你的社会工程尝试中，你给公司帮助热台打电话，假装成一个忘记密码的用户。你要求技术人员帮助你重置密码，她高兴地答应了。这里使用的是哪种社会工程攻击？\n\
  \n**A.** 尾随攻击（Piggybacking）\n**B.** 反向社会工程\n**C.** 技术支持\n**D.** 晕效应\n\n![Image](img/r.jpg)\
  \ **C.** 尽管给社会工程攻击分类可能看起来很愚蠢（因为许多攻击包含相同的步骤并相互渗透），但你需要在考试中记住它们。技术支持攻击是指攻击者拨打支持热线电话，试图获取重置密码或其他有用信息。这是一种价值价值，因为如果你找到了正确的帮助热线人员（也就是说，容易受能言善辩的社会工程工程师影响的人），你就可以获得通世界的钥匙。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 `piggybacking`（尾随攻击）指的是一种进入设施的方法——而不是获取密码的方法。任何在地铁系统中待过时间的人都知道这是真的：看人们跳过闸机是一项很棒的观赏运动。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为据我所知，`man shack` 并不是 CEH 内的物理安全术语。它可能是 20 世纪\
  \ 70 年代迪斯科热门歌曲的标题，但不是你考试需要掌握的物理安全术语。（*注：此处原文 C 选项描述处可能存在笔误，原文中 `man shack` 可能是指\
  \ `man trap` 的误笔，但按要求保持原样翻译*）\n\n![Image](img/w.jpg) **D** 是错误的，因为 `halo effect`（晕效应）指的是一种心理原理，即一个人的整体印象会影响对他人的判断。例如，一个长相好看的人会被认为更有能力和博学。\n\
  \n### 3. 关于生物识别系统，以下哪种说法是正确的？\n\n**A.** `CER` 越低，系统越好。\n**B.** `CER` 越高，系统越好。\n\
  **C.** `FRR` 越高，系统越好。\n**D.** `FAR` 越高，系统越好。\n\n![Image](img/r.jpg) **A.** 交叉错误率（CER）是虚假接受率（FAR）和虚假拒绝率（FRR）相交的点，数值越低，系统越好。尽管如此，请注意在某些情况下，客户可能更关注低\
  \ `FAR` 而非 `FRR`。也就是说，只要金钱安全，银行不在意用户无法登录又何呢？\n\n![Image](img/w.jpg) **B** 是错误的，因为这与你所要求的完全相反。高\
  \ `CER` 表示系统更经常允许未经授权的用户进入，而拒绝授权的用户。\n\n![Image](img/w.jpg) **C** 是错误的，因为虚假拒绝率（`FRR`）越低越好。`FRR`\
  \ 代表真实的合法用户被生物识别系统拒绝访问的时间。\n\n![Image](img/w.jpg) **D** 是错误的，因为虚假接受率（`FAR`）越低越好。`FAR`\
  \ 代表未经授权的用户被允许访问的时间。\n\n### 4. 渗透人员向目标组织内的几位用户发送了一封未经请求的电子邮件。该邮件编写得精美，看起来来自公司的帮助热线，提醒用户潜在的网络问题。邮件提供了一个在用户受到不利影响时拨打的电话。渗透人员随后对几个系统实施了拒绝服务，并收到了请求帮助的电话。这里使用的是哪种社会工程实践？\n\
  \n**A.** 技术支持\n**B.** 冒充\n**C.** 钓鱼\n**D.** 反向社会工程\n\n![Image](img/r.jpg) **D.**\
  \ 这个问题对某些人来说可能有些困惑，但实际上非常简单。反向社会工程涉及三个步骤。首先，在营销阶段，攻击者把自己宣传为很快可能发生的问题的技术联系点。其次，在破坏阶段，攻击者对用户实施拒绝服务或其他攻击。第三，在技术支持阶段，用户拨打攻击者的电话并主动提供信息，认为他们正在得到公司技术支持团队的帮助。\n\
  \n\n\n\n\n顺带提一下，在现实世界中使用这种社会工程学实践时，有两点需要记住。首先，确保针对合适的受众进行营销：针对 IT 人员尝试这种方法的效果可能不如针对“普通”用户，而且可能让你暴露露馅。其次，可能更重要的一点是，你需要记住：撒的谎越多，需要让其变成真的事情就越多。复杂性意味着风险，而反向社会工程学涉及大量的复杂性。它最好在特殊情况下使用，并且仅在你别无事可做时才使用。\n\
  \n![Image](img/w.jpg) `A` 是错误的，因为技术支持攻击涉及攻击者拨打技术支持帮助热线，而不是让用户回拨并提供信息。\n\n![Image](img/w.jpg)\
  \ `B` 是错误的，因为这不 `只是` 身份冒充——问题中描述的攻击围绕着用户联系攻击者展开，而不是相反。身份冒充可以涵盖任何人，从“普通”用户到公司高管。冒充技术支持人员可以产生极佳的效果；只需记住，如果你正在通过某些步骤让用户回给你打电话，你就进入了反向社会工程学的范畴。\n\
  \n![Image](img/w.jpg) `C` 是错误的，因为钓鱼攻击涉及一封伪装成合法的电子邮件，看似真实，但实际上包含了指向虚假网站或下载恶意内容的链接。在这个例子中，没有可以点击的链接——只有一个遇到问题时拨打的电话。奇怪的是，根据我的经验，人们对电子邮件中链接的质疑远大于对一个电话号码。\n\
  \n# 5.\n一名渗透测试人员已进入一栋建筑，并在走动时观察活动。在建筑的一个房间里，他站在隔间墙开口处外面，观察一名用户屏幕上的活动。这里使用的是哪种社会工程学攻击？\n\
  \n**A.** 偷听\n**B.** 尾随 (Tailgating)\n**C.** 窥窥视 (Shoulder surfing)\n**D.** 尾随 (Piggybacking)\n\
  \n![Image](img/r.jpg) `C.` 这道题太简单了，我希望你在测试室里能保持冷静，忍制住跳跃欢叫的冲动。窥窥视并不要求你真的站在受者的肩膀上——你只需要能够观察他们屏幕上的活动即可。我曾经在某人\
  \ `面前` 窥视过（她背后的镜子清楚地显示了她的屏幕）。你甚至不需要真的离受害者很近——有很多光学设备可以从很远处缩放视野。顺带提一下，在现实世界中，如果你离近到可以看到某人的屏幕，你可能也近到可以听到他们的说话。EC-Council\
  \ 将窥窥视的重点放在视觉角度上——而偷听是听觉上的。\n\n![Image](img/w.jpg) `A` 是错误的，因为 `偷听` 是一种社会工程学方法，攻击者只需离目标足够近即可偷听到对话。虽然怀疑用户是否会聚在一起大声互相喊密码，但你会惊讶于仅仅通过偷听对话就能获取到多少有用的信息。\n\
  \n![Image](img/w.jpg) `B` 是错误的，因为 `尾随 (Tailgating)` 是一种通过出示伪工证并跟随授权用户通过打开的门来进入设施的方法。\n\
  \n![Image](img/w.jpg) `D` 是错误的，因为 `尾随 (Piggybacking)` 是另一种进入设施的方法。但在这种尝试中，你根本没有工证；你只是跟着人进门。\n\
  \n### 6.\n当地事件响应（IR）团队调查的一起近期事件涉及一名用户收到一封看似来自美国邮政（USPS）的电子邮件，通知她有一个寄给她的包裹，并提供了一个跟踪包裹的链接。提供的链接引导用户进入了一个看似是\
  \ USPS 网站的页面，她在那里输入了关于最新包裹运输的信息。该用户受陷于哪种攻击？\n\n**A.** 钓鱼攻击\n**B.** 互联网级别\n**C.**\
  \ 反向社会工程学\n**D.** 身份冒充\n\n![Image](img/r.jpg) `A.` 钓鱼是世界上最普遍且有效的社会工程学攻击之一。钓鱼通过伪造合法的电子邮件将用户引导至非法网站或恶意软件包。此外，钓鱼利用了人类信任的本性。如果邮件来源看起来真实或布局看起来真实，人们甚至不会考虑就会点击。钓鱼邮件通常包含直接从合法网站截取的图片，并使用真实业务名称的变体，例如\
  \ `regi0ns.com`。\n\n![Image](img/w.jpg) `B` 是错误的，因为 `互联网级别` 不是本次考试认可的社会工程学攻击形式。它在这里作为干扰项。当有人拨打真实的\
  \ Regions 银行投诉时，……\n\n![Image](img/w.jpg) `C` 是错误的，因为 `反向社会工程学` 是攻击者欺骗用户回拨提供有用信息的攻击。\n\
  \n![Image](img/w.jpg) `D` 是错误的，因为这个特定的描述并不涵盖身份冒充。`身份冒充` 是社会工程师伪装成员工、合法用户甚至高管的攻击。通常情况下，在考试中，任何身份冒充题都会围绕实地访问或电话展开。\n\
  \n### 7.\n哪种类型的社会工程攻击使用钓鱼、弹出窗口和 IRC 通道？\n\n**A.** 技术性\n**B.** 基于计算机的\n**C.** 基于人类的\n\
  **D.** 物理\n\n![Image](img/r.jpg) `B.` 所有的社会工程学攻击分为两类：基于人类和基于计算机。基于计算机的攻击是利用计算机或其他处理设备进行的攻击。一些示例包括虚假的弹出窗口、短信、电子邮件以及聊天室或服务。社交媒体网站（如\
  \ Facebook 和 LinkedIn）也是典型的例子，伪造整个网站也不在范围之外。\n\n\n\n\n\n![Image](img/w.jpg) **C**\
  \ 是错误的，因为`human-based`（基于人的）社会工程学涉及为了收集信息的内互动艺术。基于人的社会工程学利用人在对话或其他情况下的互动来收集有用信息。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为`physical`（物理）不是一种社会工程攻击类型，在这里作为干扰项出现。\n\n###\
  \ 8.\n攻击者识别了一个潜在目标并花费了一些时间对其进行画像分析。在获取一些信息后，攻击者向目标的手机发送了一条短信。短信看起来来自该用户的银行，建议她立即拨打提供的电话号码处理其账户信息。她拨打了号码，并向装成银行员工的攻击者提供了敏感信息。以下哪项最能定义这种攻击？\n\
  \n**A.** 语音诈骗 (Vishing)\n**B.** 短信诈骗 (Smishing)\n**C.** 网络钓鱼 (Phishing)\n**D.**\
  \ 简讯钓鱼 (Tishing)\n\n![Image](img/r.jpg) **B.** 你的 CEH 词汇表中又增加了一个记忆术，难道你不感到兴奋吗？在`smishing`（针对\
  \ `SMS` 文本的钓鱼）中，攻击者发送伪装成合法安全通知的短信，并提供了一个电话号码。用户在无意中拨打了该号码并相应提供了敏感数据。\n\n![Image](img/w.jpg)![Image](img/w.jpg)\
  \ **A** 是错误的，因为`vishing` 是使用电话通话或语音消息的攻击。在 `vishing` 中，攻击者拨打目标电话或留下带有遵循指令的语音邮件。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为`phishing`（钓鱼）利用专门设计的电子邮件来诱导响应和行动。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为这个词不存在。\n\n### 9.\n以下哪项对组织构成了最高风险？\n\n**A.** 黑客\n**B.** 白帽\n**C.**\
  \ 灰帽客\n**D.** 不满的员工\n\n![Image](img/r.jpg) **D.** 当我们考虑安全措施时，大多数注意力通常集中在公司外部，因为所有的坏人在那里，对吧？遗憾的是，这种思维方式由于许多原因会导致各种暴露，而且这比你想象的要常见。毕竟，一个不满的员工`终究`还是员工，这导致了他们如此危险的主要原因：位置。他们`已经`在网络内部。内部攻击通常更容易发起、成功率更高，且更难防御。当你加上怀有私怨的人为因素时，这可能会迅速爆发——无论该员工是否具有执行攻击的技术知识。这种想法是：一个想要破坏我们组织网络的人不仅已经拥有了此类操作的权限，而且这种权限是因为`我们给了他们`且`我们没有在监视他们`的，这应该让我们所有人都感到恐惧。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为`黑帽黑客`并不一定已经在网络内部。他们在获取访问方面需要做大量工作，并且需要穿过许多安全层级。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为`白帽黑客`是好人之一——为了特定目的而雇佣的伦理黑客。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为`灰帽黑客`处于白和黑之间。他们可能在没有明确许可的情况下进行黑客活动，但出于善意（尽管善意并不能让他们免于牢狱）。据说他们并没有个人利益进行攻击；他们只是懒得去获取许可，偶尔在法律的黑暗边缘跳舞。\n\
  \n### 10.\n在观察目标组织几天后，你发现财务和人力资源记录被装袋并放在室外的垃圾桶中，以便稍后粉碎/回收。一天，你直接走到垃圾桶旁并将其中一个袋放入你的车辆中，计划稍后翻阅。这里使用了哪种社会工程攻击？\n\
  \n**A.** 离线 (Offline)\n**B.** 物理 (Physical)\n**C.** 尾随 (Piggybacking)\n**D.** 翻垃圾桶\
  \ (Dumpster)\n\n![Image](img/r.jpg) **D.** `Dumpster diving`（翻垃圾桶）并不意味着你正在挖垃圾。它可以是任何地点，你通过它发现信息。这是一种社会工程攻击，但它不是被动的。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为`offline`（离线）不是一种社会工程攻击。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为`physical`（物理）不是一种社会工程攻击。\n\n![Image](img/w.jpg) **C** 是错误的，因为`piggybacking`（尾随）是一种社会工程攻击。\n\
  \n### 11.\n攻击者在设施入口外等待。一名授权用户出现并刷卡打开了门。没有胸牌的攻击者跟着他进入内部。刚刚发生了哪种社会工程攻击？\n\n**A.**\
  \ 尾随 (Tailgating)\n**B.** 尾随 (Piggybacking)\n**C.** 身份盗窃 (Identity theft)\n**D.**\
  \ 冒充 (Impersonation)\n\n![Image](img/r.jpg) **B.** 这是那种让大家都抓狂的问题之一——尤其是那些职业是渗透测试的人。知道在不闪示任何类型的虚假胸牌的情况下进入被称为\
  \ `piggybacking` 是否会让执行变得更容易或更难？我认为，对于本质上是一种攻击使用两个术语且仅相差一个微小细节，有点不公平，但我们对此无能为力。如果这有助于记忆，只需记住猪不会戴胸牌的——它们没有衣服可以挂胸牌。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为`tailgating`（尾随进入）攻击要求攻击者持有某种类型的虚假胸牌。我知道这很愚蠢，但这是这些项目之间唯一的区别：tailgaters\
  \ 带有胸牌，而 piggybackers 这种。如果这能让事情变得容易理解，请记住足球赛上的很多 tailgaters 应该带有胸牌——以证明他们达到了合法饮酒年龄。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为这种攻击与`identity theft`（身份盗窃）无关。身份盗窃发生在攻击者利用从个人处获得的个人信息来冒充该人的身份。虽然这通常在犯罪世界的背景下被考虑（盗取信用卡、钱等），但它在其他地方也有用处。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为这里没有涉及 `impersonation`（冒充）。攻击者完全没有假装别人——他只是跟着某人通过开着的门。\n\
  \n### 12.\nTim 是渗透测试团队的一部分，试图进入校园的一个受保护区域。他站在一个带门卡的入口门外，假装正在进行一场激烈的电话通话。一名组织员工路过并刷开了大门。Tim\
  \ 要求该员工扶住门，同时他展示了一个虚假的身份牌并继续他的通话。然后他跟随该员工通过大门。以下哪项最能定义这种尝试？\n\n**A.** 旁窥窥 (Shoulder\
  \ surfing)\n**B.** 尾随 (Piggybacking)\n**C.** 尾随 (Tailgating)\n**D.** 草拟 (Drafting)\n\
  \n\n\n\n\n![Image](img/r.jpg) **C.** 这类问题太让人烦恼了，所以我在这一章中连续添加了两次——就好像我几乎可以确定你会在考试中看到它一样。“**尾随”（tailgating）是指跟随某人通过开启的门或大门，就像“**搭便**”（piggybacking）一样；然而，在尾随行为中，会使用某种伪造的身份证。顺便提一下，如果你的考试题没有同时包含这两个术语——尾随和搭便——但行为是一致的（一个攻击者跟随持有证件的员工通过大门或门），那么你就不需要在它们之间做选择。通常，在这种情况下，“尾随”的使用频率比“搭便”更高。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为“窥视屏幕”（shoulder surfing）并不是关于跟踪某去任何地方；而是让自己处于某个位置，以便观察某人在系统上的按键操作和活动。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为“搭便”并不涉及任何形式的胸牌或身份标识的使用。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为“跟流”（drafting）是 NASCAR 赛车中的一个酷术语，但它与物理渗透无关。\n\n### 13. 下列哪些项可能是针对社会工程的有效应对措施？（选择所有适用项。）\n\
  \n* **A.** 安全策略\n* **B.** 操作指南\n* **C.** 配置恰当的 IDS\n* **D.** 用户教育与培训\n* **E.** 强力的防火墙配置\n\
  \n![Image](img/r.jpg) **A, B, D.** ECC 识别了若干种针对社会工程的应对措施，但在现实世界中，其中任何一种（无论是单独使用还是组合）都不是真正的关键。大多数针对社会工程的应对措施的问题在于，它们几乎完全不受你的控制。当然，你可以起草强有力的政策要求用户遵守安全措施，实施可以想象的一切事宜的指南以降低风险并提高效率，并为组织中的每一位用户举办教育简报会和培训课程，但归根结底，必须由*用户*来做正确的事。针对社会工程的所有应对措施都与用户本身有关，因为他们是这里的薄弱环节。\n\
  \n![Image](img/w.jpg) **C** 和 **E** 都是错误的，原因相同：社会工程攻击并不是针对网络或其防御的；而是针对用户的。许多防御严密的网络之所以被攻破，是因为内部的一个用户被成功的社会工程工程师所诱惑。\n\
  \n### 14. 下列哪些项是钓鱼邮件的特征？（选择所有适用项。）\n\n* **A.** 它没有通过你的名字称呼你。\n* **B.** 它包含拼写错误的单词或语法错误。\n\
  * **C.** 它包含伪造的链接。\n* **D.** 它来自未经证的来源。\n\n![Image](img/r.jpg) **A, B, C, D.** EC-Council\
  \ 在其多个 CEH 版本中保留的目标之一是，引用原话，是为了“理解钓鱼攻击”。为了考试学习的官方大纲部分涵盖了深度检测钓鱼邮件，所有的答案都是邮件可能不合法的特征。首先，现在大多数向客户发送邮件的公司都会通过你的*名字*来称呼你，有时还会通过账号。以“亲爱的客户”或类似的话开头的邮件可能是情况不对劲的指标。\n\
  \n来自企业的拼写错误和语法错误通常也是明显的破绽，因为公司在发布项目之前会尽力对内容进行校对。虽然偶尔会出现一些失误（在互联网上搜索其中一些；它们真的很有趣），但那些绝对是例外而非常态。\n\
  \n可以通过将鼠标悬停在链接上（或通过查看其属性）来找到伪造的链接。链接文本可能显示为 `www.yourbank.com`，但超链接属性将你导向某个你不想访问的\
  \ IP 地址。\n\n最后，任何来自“未经证实的来源”的邮件都可以且应该被审慎对待。什么让某个成为未经证实的来源？这取决于观察者的眼光。在很多情况下，它仅仅是一个你不认识或以前没见过的地址（或人）。在其他情况下，它与你所熟悉的邮件地址看起来非常相似，但事实证明是恶意的。\n\
  \n在任何一种情况下，你个人和组织安全的最佳办法都是：不要点击。邮件来自谁、它的语法是否完美、链接看起来是否合规，这些对你来说并不重要——只要养成完全不点击邮件中链接的习惯就好。相信我，你和你的组织会安全。\n\
  \n顺便提一下，虽然这些都是考试题的完美答案，但不要让它们主宰你考试之外的日常生活。一封编写完美、语法正确、包含真实链接且来自你信任的人的邮件*可能仍然*钓鱼攻击的一部分。在不知道链接确切是什么以及它会带你去何处之前，永远不要点击邮件中的链接——无论你认为信息是谁发的，无论它写得有多好。最后，如果你收到一封内容准确、通过你的名字称呼你、带有真实链接且看起来确实真实的钓鱼邮件，你可能真的遇到麻烦了。每个人都会收到带有“点击此处获取免费物品”的烦人“垃圾”邮件。然而，如果你收到一封包含你的名字和识别细节并投递给你的邮件，那么说明有人专门针对你。\n\
  \n### 15. 你正在讨论物理安全措施，并涵盖了背景调查以及关于存储的策略。讨论的是哪种物理安全措施？\n\n* **A.** 物理\n* **B.** 技术\n\
  * **C.** 操作\n* **D.** 实用\n\n![Image](img/r.jpg) **C.** 物理安全有三个维度：物理措施、技术措施和操作措施。操作措施（有时称为*程序性*控制）是你为了协助安全而的政策和程序。员工背景调查和任何形式的操作策略都是典型的例子。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为物理措施是可见且可触的。例子包括保安（尽管你可能不想触碰他们）、围栏和锁起来的门。\n\n\
  ![Image](img/w.jpg) **B** 是错误的，因为技术措施包括身份验证系统（生物识别？）以及你分配给资源的特定权限。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为尽管这些看起来像是可以实施的实用措施，但根本没有这样一个分类。它被包含在这里作为一个干扰项，仅此而已。\n\n\n\n\n\nNetcraft\
  \ 的 ([`toolbar.netcraft.com/`](http://toolbar.netcraft.com/)) 和 Phishtank 的 ([www.phishtank.com/](https://www.phishtank.com/))\
  \ 工具栏就像是加强版的虚拟社区守卫，目光敏锐的邻居可以看到可疑流量并提醒其他人。以下来自 Netcraft 网站的内容：“一旦第一批钓鱼邮件的接收者报告了目标\
  \ URL，社区成员在随后访问该 URL 时，它就会被拦截。”\n\n这些工具虽然有用，但并非设计用于完全防止钓鱼。与反病毒软件一样，它们会针对匹配签名文件的尝试采取行动。这有时会让攻击者变得更容易——因为他们立刻就能知道哪些钓鱼手段是行无效的。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 Phishkill 不是一个反钓鱼应用程序。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 `IDA Pro` 是一个你可以用来分析恶意软件（病毒）的调试工具。\n\n### 17.\n攻击者针对组织内部的一个特定群体。在对该群体进行一段时间的分析后，她注意到该群体的个人成员经常访问几个网站。她花时间将各种恶意软件和恶意代码插入一些更容易受到攻击的网站中。几天之内，其中一名成员的系统从一个受感染的站点安装了恶意软件，攻击者将该受感染机器作为网络内部的跳板。以下哪项最能定义这种攻击？\n\
  \n**A.** 鱼叉式钓鱼\n**B.** 捕鲸式钓鱼\n**C.** 网络钓鱼 (Web-ishing)\n**D.** 水池攻击\n\n![Image](img/r.jpg)\
  \ **D.** 你看过探索频道的自然纪录片吗？捕食者经常聚集在猎物可能出现的地方。例如，一群狮子可能就聚集在水池旁——因为它们很清楚猎物最终会来到那里。这种攻击使用了同样的原理，只不过我们谈论的是虚拟世界。而且我们中没有狮子（至少在我们的想象之外是这样）。\n\
  \n在水池攻击中，坏人会花费大量时间对目标群体进行分析（注意这里的关键用词是针对一个“群体”，而不是个人）。攻击者可以观察甚至猜测该群体会访问的网站，然后用某种恶意软件或恶意代码感染这些网站。最终，群体中的某人会访问这个虚拟水池，然后——哒！成功了。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为鱼叉式钓鱼涉及针对特定人群的钓鱼（发送包含恶意代码链接的特制电子邮件）。在这题中，并不涉及任何钓鱼行为。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为捕鲸式钓鱼是针对高层员工的特殊鱼叉式钓鱼。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为这不是一个有效的术语。\n\n### 18.\n哪种类型的社会工程学利用了伪装、翻垃圾桶、窥视屏幕和尾随？\n\n**A.** 物理型\n\
  **B.** 技术型\n**C.** 基于人为的\n**D.** 基于计算机的\n\n![Image](img/r.jpg) **C.** 再次一次，我们回到了社会工程学的两种主要形式：基于人为的和基于计算机的。基于人为的攻击包含了这里提到的所有攻击以及更多。基于人为的社会工程学利用人与人在对话或其他情况下的互动来收集有用信息。这可以是非常直白地向某人要密码，或者伪装成已知实体（授权用户、技术支持或公司高管）以获取信息。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为社会工程学攻击不属于物理范畴。\n\n![Image](img/w.jpg) **B**\
  \ 是错误的，因为社会工程学攻击不属于技术范畴。\n\n![Image](img/w.jpg) **D** 是错误的，因为基于计算机的社会工程学攻击是通过计算机或其他数据处理设备进行的。这些攻击可以包括从诱骗用户点击的特制弹出窗口等的一切内容。\n\
  \n### 19.\n在检查该网站时，她编写了一封看起来来自技术支持的电子邮件。该邮件提供了一个提示用户 ID 的链接。以下哪项最能描述这种行为？\n\n**A.**\
  \ 木马邮件\n**B.** 鱼叉式钓鱼\n**C.** 社交网络\n**D.** 运营工程\n\n![Image](img/r.jpg) **B.** 是的，有时你会遇到一个简单的。钓鱼是使用电子邮件来完成这一点。鱼叉式钓鱼实际上是针对个人或群体的。\n\
  \n![Image](img/w.jpg) **A, C,** 和 **D** 是错误的，因为它们都是干扰项，不符合实际情况。根据委员会定义，社交网络攻击涉及使用\
  \ Facebook、Twitter 或其他社交媒体。\n\n### 20.\n安全管理员实施了一项控制措施，在电子邮件中嵌入一个独特的图像以验证信息的真实性。使用的是哪种反钓鱼方法？\n\
  \n**A.** 隐身术\n**B.** 登录封 (Sign-in seal)\n**C.** PKI\n**D.** CAPTCHA\n\n![Image](img/r.jpg)\
  \ **B.** 登录封是在多个地点使用的电子邮件保护方法。这种做法是使用一个可以在任何官方通信中引用的秘密信息或图像。如果你收到一封自称来自公司的邮件但没有包含该图像，你就知道可能是一个钓鱼尝试。这种登录封保存在你的本地计算机上，理论上没有人可以复制或伪造。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为隐身术并非用于此目的。如你所知，隐身术是将信息隐藏在另一个文件（通常是图像文件）中的方法。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为 PKI 指的是使用公私密钥进行组织成员之间信息安全的加密系统。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 CAPTCHA 是一种身份验证，我相信你已经见过数百次了。CAPTCHA（全称为区分计算机与人类的全自动公开图灵测试）是一种挑战响应方法，显示图像并要求客户端将图像中的单词输入到挑战框中。一个例子是参赛表——你在顶部填写信息，然后看到下方有一个带有奇怪字体单词（或两个单词）的图像。如果你输入了正确的单词，页面合理认为你是人类（而不是脚本），请求就会被发送。\n\
  \n### 21.\n哪些措施应该建立以作为社会工程学的应对措施？（选择所有适用项）\n\n**A.** 信息分类\n**B.** 严格的安全策略\n**C.**\
  \ 用户教育\n**D.** 严格的变更管理流程\n\n\n\n\n\n![Image](img/r.jpg) **A, B, C, D.** 所有答案都是正确的，但让我们先开门见山：你永远无法采取任何措施来完全有效地让*所有*社会工程攻击无形于形。你可以采取一些措施来限制它们，此列表中的方法确实在这方面有所帮助，但如果一个组织用“我们有强大的安全策略和极好的用户教育”来应对社会工程问题，可能会面临很高的离职率。\n\
  \n信息分类被视为一种强有防御措施，因为信息（以及对信息的访问）是根据敏感性的严格定义进行存储和处理的。在政府/国防（DoD）领域，你会看到机密（Confidential）、秘密（Secret）和绝机密（Top\
  \ Secret）之类的标签。在商业领域，你可能会看到公开（Public）、敏感（Sensitive）和机密（Confidential）。我可以专门写一章介绍\
  \ DoD 和商业标签之间的区别，并争论各种访问控制方法的细微之处，但我们仅限于本章以及你需要的内容。顺便提一下，如果对这些信息的访问执行以及在存储或传输过程中的保护松散，那么信息分类对你将毫无用处。\n\
  \n强有的安全策略在本章前面已经介绍过，因此我不再在这里浪费太多篇幅了。你必须拥有一套良好的策略来帮助防止各种安全故障；然而，你不能*依赖*它作为唯一的防御措施。\n\
  \n根据 EC-Council 的说法，用户教育不仅是一种可行的社会工程防御措施，而且它是你能采取的最佳措施。任何读过这本书且在生产环境、企业级网络上花过时间教育用户的人，现在可能都在尖叫，因为结果有时充其量是参差不齐。然而，链条中的弱点*确实*是用户，所以我们必须尽力教育用户应该观察什么，以及在看到时该如何做。没有比受教育良好的用户更好的防御了（我所说的“受教育良好”是指绝对拒绝参与社会工程尝试的用户）。只是世界上这样的人并不多。\n\
  \n变更管理流程通过为任何重大变更提供标准的、可审查的流程，来组织系统或组织的变动。换句话说，如果你允许财务系统、IT 服务或 HR 流程在没有任何审查或控制过程的情况下发生更改，你基本上是在打开潘多拉的魔盒。更改可能会随心所欲地发生（有时是受社会工程学者的指使吗？），而且对此没有任何控制或跟踪。\n\
  \n### 22. Joe 每天使用用户 ID 和密码登录系统。Jill 使用 PIV 卡和 PIN 码。下列哪种描述是正确的？\n\n* **A.** Joe\
  \ 和 Jill 都在单因素认证。\n* **B.** Joe 和 Jill 在使用双因素认证。\n* **C.** Joe 正在使用双因素认证。\n* **D.**\
  \ Jill 在使用双因素认证。\n\n![Image](img/r.jpg) **D.** 涉及到身份验证系统，你可以使用三个因素来证明你的身份：你*知道*的、你*拥有*的、以及你*是*的特征。你知道的东西基本上是密码或\
  \ PIN 码。你拥有的是某种物理令牌——通常是智能卡——它作为身份验证过程的一部分呈现。你是这种特征与生物识别有关——例如指纹或视网膜扫描。通常来说，设置的因素越多，身份验证系统就越好（越安全）。在这个例子中，Joe\
  \ 只使用了他知道的东西，而 Jill 使用了她拥有的（PIV 卡）*以及*她知道的东西（PIN 码）。\n\n![Image](img/w.jpg) **A**\
  \ 是错误的，因为 Jill 使用的是双因素认证。\n\n![Image](img/w.jpg) **B** 是错误的，因为 Joe 使用的是单因素认证。\n\n\
  ![Image](img/w.jpg) **C** 是错误的，因为 Joe 使用的是单因素认证。\n\n### 23. 系统所有者在数据层入口处安装了视网膜扫描仪。这是哪种类型的物理安全措施？\n\
  \n* **A.** 技术\n* **B.** 单因素\n* **C.** 基于计算机的\n* **D.** 操作\n\n![Image](img/r.jpg)\
  \ **A.** 物理安全措施的特征分为物理的（门锁和守卫）、操作性的（策略和程序）和技术的（身份验证系统和权限）。这个例子属于技术安全措施类别。当然，门本身是物理的，但问题的核心在于生物识别系统，其起源显然是技术性的。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为*单因素*指的是身份验证系统使用的方法，而不是物理安全措施本身。在这种情况下，身份验证使用的是“你是”的因素——生物识别视网膜扫描。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为*基于计算机的*指的是一种社会工程攻击类型，而不是物理安全措施。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为*操作性*物理安全措施处理的是策略和程序。\n\n### 24. 下列哪项技术控制的最佳表示？\n\n* **A.** 空调\n\
  * **B.** 安全令牌\n* **C.** 自动湿度控制\n* **D.** 火灾报警器\n* **E.** 安全策略\n\n![Image](img/r.jpg)\
  \ **B.** 所有的安全控制措施都是为了最小化或完全避免风险或漏洞被成功利用的概率。逻辑控制（*logical*是*technical* 使用的另一个术语）通过技术性的、系统驱动的手段来实现。示例包括安全令牌、身份验证机制和防病毒软件。\n\
  \n![Image](img/w.jpg) **A, C, D,** 和 **E** 是错误的，因为它们不是逻辑（技术）控制。空调、火灾报警器和湿度控制属于物理控制。策略属于程序性控制。\n\
  \n### 25. 下列哪项最好地描述了钓鱼（pharming）？\n\n* **A.** 攻击者通过发送一个看起来合法的 URL 的电子邮件，将受害者重定向到恶意网站。\n\
  * **B.** 攻击者通过修改其的主机配置文件或利用 DNS 中的漏洞，将受害者重定向到恶意网站。\n* **C.** 攻击者根据职责、角色或责任针对组织中的特定成员。\n\
  * **D.** 攻击者在员工经常访问的网站中插入恶意代码和恶意软件。\n\n![Image](img/r.jpg) **B.** 我确信有些人坐在一儿无所事事，只为了为我们所有人想出新的术语、缩写和俚语，而*钓鱼攻击（pharming）*正属于这一范畴。钓鱼攻击的目标与大多数其他攻击相同——将人们重定向到恶意网站，希望从他们那里窃取东西。实现方法涉及更新\
  \ hosts 文件并操纵 DNS 以指向恶意站点。\n\n![Image](img/w.jpg) **A** 是错误的，因为这描述的是钓鱼（phishing）。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为这描述的是叉式钓鱼（根据目标群体，也可能是针对高层的大鱼钓鱼）。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为这描述的是水坑攻击（watering hole attack）。\n\n\n\n\n\n我生命中一直非常幸运，在很多方面都是如此，我在这里没有时间或篇幅空间来详细介绍。我有机会环游世界，体验到许多人根本无法体验的经历。在其中一次旅行中，我来到了意大利的佛罗伦萨，并决定去看大卫雕像。即使你对这尊雕塑的背景并不熟悉，我敢打赌你曾在某个地方见过它的复制品——从园林艺术再创作到商店陈列，再到《海绵宝宝》中一个非常酷的剧集，在那里他必须“变成大理石！”。`大卫`是由米开朗基罗在\
  \ 1501 年至 1504 年间雕刻的，被公认为世界上最伟大的雕塑之一。这尊雕像现在位于佛罗伦萨学院美术（`Galleria dell’Accademia`）的一个圆顶门厅内。在美丽的美术馆完美环境中看到这件尽显光彩的艺术品，确实是一次难以置信的体验，绝对是任何佛罗伦萨之旅的亮点。\n\
  \n然而，给我留下同样深刻印象的是，在前往大卫雕像途中必须经过的米开朗基罗的其他未完成的作品。有一条通往门厅的巨大走廊，两侧密密麻麻地满了他开始创作但由于某种原因从未完成的雕塑。走在走廊上（至少在你的想象中），我们被简直令人惊叹的石刻环绕着。在这里，在右侧，有一块巨大的大理石，左侧露出了半个身体，凿刻痕迹向下延伸到一个尚未完成的部分。在左侧，我们看到一匹马的前半部分从一块粗加工的花岗岩中“爆炸”而出；这只美妙动物的其余部分仍然被埋在米开朗基罗未完成讲述的雕塑故事中。沿着这条长走廊走着，我们看到了其他作品——一块巨石中发生的激烈战斗、一个线条清晰但几乎没有表情的脸从一小块几乎是废料的石头中望出来——所有这些都陈在左右，供我们赞目口舌。\n\
  \n这些未完成的作品一点也不粗糙；恰恰相反。我站在人群中，争相想要看一眼这位伟大的才的作品，惊叹于一个人如何拿一块巨大的石头，并将其塑造、光滑成看起来如此真实的东西。但这些作品并没有完成，这一点显而易见。在本该光滑的地方有巨大的划痕，几件雕塑甚至因为石头本身裂成两半而断裂了。\n\
  \n你可能会问，这和这本书有什么关系？答案是，我们都在这里投入了大量精力。我们一直在知识的巨石上开凿，正处于即将完成的边缘。不，我并不是在对这本书是某种艺术品给出疯狂结论（任何真正了解我的人都可以证明，那不是我的菜，宝贝），但我是说我们，你和我，正处于一件好事的边缘。继续砍凿那块石头吧。继续打磨和抛光。早晚你会完成并拥有你自己的雕像来展示——只要不要忘记你投入其中的所有努力，不要丢掉任何一部分。我保证，在以后某个时候你会想回去，走过你自己的作品长廊，看看你走了多远。\n\
  \n本章的问答比较简单（如果你觉得背诵术语很容易的话就是），而且对正确和错误的解释也会反映这一点。当然，我可能会从书中前面的部分里偷偷插进一个问题——只是为了看看你是否在关注，并把\
  \ `EC-Council` 扔进这一章节的术语总结一下——但这些问题都应该是关于渗透测试本身的。我们已经涵盖了基础性知识，所以现在我们将花些时间研究最终产品。当然，你将在考试中看到这大部分材料。我只希望到那时你已经做好了充分准备，就像米开朗基罗擦掉他给大卫雕像最后一次抛光时的灰尘一样。\n\
  \n![Image](img/examp.jpg)\n\n**学习贴士**\n本章在设计上是一个小结。这里有些内容似乎只是不适合放在其他地方，或者需要特别关注，从而从它们原本被困的、杂乱的原始\
  \ `EC-Council` 章节中抽离出来。这里的大部分内容通常可以归结为基础记忆。虽然这对你来说可能很简单，我想你会发现某些术语之间的关系非常紧密，以至于考试中引用这些术语的问题至少会让你困惑——而且在考试结束时很可能会让人抓狂。密切关注风险管理术语——你绝对会在考试中看到几个关于它的问题。另一个你可能也会看到至少两个问题的领域是作为专业的、伦理黑客的伦理道德。承认，其中一些问题很难回答，因为现实世界和\
