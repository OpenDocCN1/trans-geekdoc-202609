  \n`Nice post and a fun read<script>onload=window.location='http://www.badsite.com'</script>`\n\
  \n攻击者正试图执行什么？\n\nA. 对博客底层数据库的 SQL 注入攻击\nB. 跨站脚本攻击\nC. 缓冲区溢出 DoS 攻击\nD. 文件注入 DoS\
  \ 攻击\n\n### 26. 下列哪项是攻击者利用 Shellshock 漏洞常用的方法之一？\n\nA. SSH 暴力破解\nB. CSRF\nC. 表单字段输入操控\n\
  D. 通过利用 CGI（通用网关接口）的 Web 服务器\n\n### 27. 你正在检查网站文件并发现以下文本文件：\n\n![Image](img/f0144-01.jpg)\n\
  \n关于该文件的下列哪项陈述是正确的？\n\nA. 防止所有网络爬虫索引 listing.html 页面。\nB. 防止所有网络爬虫索引网站上的所有页面。\n\
  C. 防止 Googlebot 索引 listing.html 页面。\nD. 防止 Googlebot 索引网站上的所有页面。\n\n\n\n\n\n显然，这道题测试了大量信息——而且在考试中可能会以很多方式看到它。HTTP\
  \ 选项本身会出现在某些地方，因此，例如，了解 `HTTP POST`（提交要处理的数据且通常是允许的）和 `HTTP PUT`（允许客户端在 Web 服务器上上传新文件，这通常是不被允许的）之间的区别对你的成功至关重要。根据\
  \ OWASP，以下选项是需要了解：\n\n- `PUT`: 该方法允许客户端在 Web 服务器上上传新文件。攻击者可以通过上传恶意文件（例如，一个通过调用 `cmd.exe`\
  \ 执行命令的 `.asp` 文件）或简单地将受害者的服务器作为文件仓库来利用它。\n- `DELETE`: 该方法允许客户端删除 Web 服务器上的文件。攻击者可以将其作为一种非常简单且直接的方法来篡改网站或发起\
  \ `DoS` 攻击。\n- `CONNECT`: 该方法可能允许客户端将 Web 服务器作为代理。\n- `TRACE`: 该方法仅将发送到服务器的任何字符串回显给客户端，主要用于调试。这种方法最初被认为是无害，但可以用于发起“跨站跟踪”（`cross-site\
  \ tracing`）攻击。\n\n![Image](img/w.jpg) `B`、`C` 且 `D` 是错误的，因为这些不被认为是“风险”选项。\n\n###\
  \ 2.\nBob 收到其环境中的一个系统似乎受到了拒绝服务攻击。经过调查，Bob 发现目标系统正在接收用于 IP 解析的海量 `DNS` 响应。以下哪种是最可能的攻击？\n\
  \n**A.** `DNS amplification`（DNS 放大攻击）\n**B.** `DNS server hijacking`（DNS 服务器劫持）\n\
  **C.** `SSRF`\n**D.** `Metasploit NOPS module`\n\n**A.** `DNS amplification` 攻击正如其名：攻击者利用递归\
  \ `DNS` 用 `DNS` 响应淹没目标。基本上，这个坏人建立了一个僵尸网络，并在准备就绪时，让僵尸系统发送 `DNS` 解析请求，伪装成来自目标。`DNS`\
  \ 执行了它应该做的事，而目标被 `DNS` 响应淹没。\n\n![Image](img/w.jpg) `B` 是错误的，因为 `DNS server hijacking`\
  \ 指的是攻击者实际上攻破 `DNS` 服务器，并将所有响应路由到恶意网站，而不是原始的 `DNS` 条目。\n\n![Image](img/w.jpg) `C`\
  \ 是错误的，因为在服务器端请求伪造（`SSRF`）攻击中，攻击者通过让面向网络的服务器代表其发送请求来绕过对内部服务器的限制访问；内部服务器由于信任面向网络的服务器而做出响应，攻击者获得了数据。\n\
  \n![Image](img/w.jpg) `D` 是错误的，因为 `Metasploit` 的 `NOPS` 模块本身并不是一种攻击。它是 `Metasploit`\
  \ 中用于生成无操作指令以填充缓冲区（nop sled）的方法。\n\n# 3. \n一个 Web 应用开发人员想要测试新应用程序的安全漏洞。以下哪种方法通过使用随机生成的无效输入来测试输入变体并尝试崩溃程序？\n\
  \n**A.** `Insploit`\n**B.** `Finglonger`\n**C.** `Metasplation`\n**D.** `Fuzzing`（模糊测试）\n\
  \n![Image](img/r.jpg) `D.` 即使你不知道“fuzzing”的意思，你可能也可以通过排除已知错误答案来缩小范围。根据 OWASP (https://www.owasp.org/index.php/Fuzzing)，“`fuzz\
  \ testing` 或 `fuzzing` 是一种黑盒软件测试技术，基本上通过自动化方式注入畸形/半畸形数据来发现实现漏洞。”换句话说，fuzzing 向字段发送大量奇怪的输入，以查看应用程序会做什么。\n\
  \n顺便提一下，会在微软的安全开发生命周期（`SDL`）的验证阶段找到 fuzzing。整个 `SDL` 由培训、需求、设计、实现、验证、发布和响应组成。顺带一句，fuzzing\
  \ 并不是一个“随机”过程——它更像是一种受控的混乱。\n\n![Image](img/w.jpg) `A`、`B` 且 `C` 是错误的，因为就测试而言，这些中都不是合法的术语。`Insploit`\
  \ 和 `Metasplation` 不是真实的术语。`Finglonger` 也不是——至少就我们讨论的这个问题而言如此——但它确实出现在《幻幻太空》（*Futurama*）的一个精彩剧集里。\n\
  \n### 4.\n以下哪项正确使用了 HTML 实体来表示 `<script>`？\n\n**A.** `&lt;script&gt;`\n**B.** `&#40;script&#41;`\n\
  **C.** `&amp;script&amp;`\n**D.** `&quot;script&quot;`\n\n![Image](img/r.jpg) `A.`\
  \ 跨站脚本通常依赖于网页没有妥善验证用户输入，而 HTML 实体可以用来代替字符。在这种情况下，小于号 `<` 和大于号 `>` 分别是 `&lt;` 和 `&gt;`。\n\
  \n![Image](img/w.jpg) `B` 是错误的，因为 `&#40;` 和 `&#41;` 分别代表左括号和右括号。例如，`(hello)`。\n\n\
  ![Image](img/w.jpg) `C` 是错误的，因为 `&amp;` 代表和符号字符（`&`）。\n\n![Image](img/w.jpg) `D`\
  \ 是错误的，因为 `&quot;` 代表引号字符（`“`）。\n\n# 5.\n一个攻击者通过钓鱼邮件诱骗用户访问恶意网站。用户点击邮件并访问了恶意网站，同时与他的银行保持活跃且已身份验证的会话。攻击者通过恶意网站指示用户的\
  \ 浏览器向银行发送请求。以下哪项最能准确描述这种攻击？\n\n**A.** `CSPP`\n**B.** `XSS`\n**C.** `CSRF`（跨站请求伪造）\n\
  **D.** `Hidden form`（隐藏表单）\n\n![Image](img/r.jpg) `C.` 生活中很少有保证，但有一个：你的考试中一定会问到跨站请求伪造（`CSRF`）。`CSRF`\
  \ 攻击正如描述的那样：攻击者利用受害者与信任站点之间的开放活动会话，向信任站点发送请求，伪装是从受害者自己的浏览器发送的。通常涉及钓鱼，或者可能是广告，但原理总是相同的。可以通过配置随机令牌来防止\
  \ `CSRF` 攻击，允许服务器验证请求。\n\n顺便提一下，类似的攻击被称为*会话固定*（session fixation）。攻击者登录合法站点，获取会话\
  \ ID，然后发送一个带有固定会话 ID 的链接。当用户点击链接并登录同一个合法站点时，黑客随后可以使用用户的凭据登录。\n\n![Image](img/w.jpg)\
  \ `A` 是错误的，因为题目没有描述连接字符串参数污染（`CSPP`）攻击。`CSPP` 攻击利用使用分号分隔参数的 Web 应用。\n\n![Image](img/w.jpg)\
  \ `B` 是错误的，因为题目没有描述跨站脚本（`XSS`）攻击。`XSS` 攻击尝试将脚本注入输入字段。\n\n![Image](img/w.jpg) `D`\
  \ 是错误的，隐藏表单字段攻击发生在攻击者操控隐藏表单字段的值并将其重新提交给服务器。\n\n### 6.\n以下哪项被 `SOAP` 服务用于格式化信息？\n\
  \n**A.** `Unicode`\n**B.** `HTML entities`\n**C.** `NTFS`\n**D.** `XML`\n\n\n\n\n\
  \n![Image](img/r.jpg) **D.** 简单对象访问协议（SOAP）是一种用于在跨多个变系统的 Web 服务之间交换结构化信息的协议。换句话说，它是让运行在某种操作系统（例如\
  \ Windows Server 2019 或 2020）中的程序与另一种操作系统（如 Linux）上的程序通信的方法。它使用 `HTTP` 和 `XML` 来交换信息，并规定了如何编码\
  \ `HTTP` 请求头和 `XML` 文件，以便应用程序能够相互通信。它的一个巨大优势在安全方面也是一个巨大的缺点：因为 `HTTP` 通常被大多数防火墙允许，使用\
  \ `SOAP` 的应用程序可以在整个网络中随意的进行通信。\n\nSOAP 注入攻击允许你注入恶意查询字符串（实际上非常类似于 SQL 注入），这可能为你提供绕过验证并在后台访问数据库的手段。`SOAP`\
  \ 兼容 `HTTP` 和 `SMTP`，且消息通常是单向的。\n\n![Image](img/w.jpg) **A** 是错误的，因为 `SOAP` 并没有以这种方式使用\
  \ Unicode。它是计算机中表示文本的标准。\n\n![Image](img/w.jpg) **B** 是错误的，因为 `SOAP` 并没有以这种方式使用\
  \ HTML 实体。它们用于表示 `HTML` 代码中的字符。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `NTFS` 是一个文件系统，与\
  \ `SOAP` 无关。\n\n### 7. 一位 Web 开发者正在讨论新应用程序在生产发布前发现的安全漏洞。他向团队建议修改软件，以确保用户不允许将 `HTML`\
  \ 作为输入输入应用程序。以下哪项最可能是该开发者试图缓解的漏洞？\n\n**A.** 跨站脚本 (XSS)\n**B.** 跨站请求伪造 (CSRF)\n**C.**\
  \ 连接字符串参数污染\n**D.** 钓鱼\n\n![Image](img/r.jpg) **A.** 当应用程序获取不可信的数据并在不进行妥当验证或转义的情况下将其发送到\
  \ 浏览器时，就会发生 XSS 漏洞。这种攻击的核心围绕网站设计（或该网站上的 Web 应用设计）、动态内容和无效的输入数据。通常当 Web 表单弹出时，用户输入某些内容，然后某些脚本根据输入的内容动态更改网站的外观或行为。当坏人利用这种脚本（例如\
  \ `Java`）并让其执行预期响应之外的操作时，就会发生 XSS。例如，假设你没有在表单字段中输入应该的内容，而是输入了一个实际的脚本。服务器随后执行它应该做的事——处理来自授权用户发送的代码。针对这种情况的最佳防御方法是在程序进入生产环境之前进行妥善的设计和良好的输入验证。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为建议的修复措施不一定会影响 `CSRF` 攻击。在 `CSRF` 中，攻击者利用受害者与信任站点之间开放、活动且已验证的会话，向信任站点发送消息请求，就像这些请求来自受害者自己的浏览器一样。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为建议的修复措施不一定会影响 `CSPP` 攻击。连接字符串参数污染。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为建议的修复措施不一定会影响。\n\n### 8. 以下哪项是常见的？\n\n**A.** SQL 注入\n**B.** XSS\n\
  **C.** 拒绝服务\n**D.** Cookie 操纵\n\n![Image](img/r.jpg) **C.** 面向服务的架构 (`SOA`) 基于服务。该架构允许服务通过网络进行通信，通常使用\
  \ `XML` 进行数据交换。如果服务存在漏洞，攻击者可能会注入恶意的 `XML` 内容以执行未经授权的操作或提取数据。该架构依赖于如 `HTTP` 等各种协议，如果不妥善保护，这些可能会被利用。如果服务没有经过妥善验证，可能会导致拒绝服务\
  \ (`DoS`）。\n\n### 9. 这种类型容易受到哪种攻击？\n\n**A.** SQL 注入\n**B.** 缓冲区溢出\n**C.** 参数篡改\n\
  **D.** Cookie 操纵\n\n![Image](img/r.jpg) **B.** 缓冲区溢出发生在程序写入缓冲区的数据超过其能容纳的内容时，可能会覆盖相邻内存。这可能导致崩溃或任意代码执行。`gets()`\
  \ 函数特别危险，因为它会一直读取输入直到找到换行符，而不检查缓冲区限制。`fgets()` 是一个更安全的替代方案，因为它允许指定读取的字符数。\n\n###\
  \ 10. 预防 XSS 的哪项是最佳选择？\n\n**A.** 挑战令牌 (Challenge tokens)\n**B.** 内存使用控制\n**C.**\
  \ Cookie 中的 HttpOnly 标记\n**D.** 移除隐藏表单字段\n\n\n\n\n\n### 11.\n你正在检查日志文件并发现了这个 URL：\n\
  \n![Image](img/f0152-01.jpg)\n\n以下哪项最能描述这种潜在的攻击？\n\n**A.** 这不是攻击，而是 SSL 握手的返回包。\n\
  \n**B.** 攻击者似乎正在使用 Unicode。\n\n**C.** 这看起来像是一个缓冲区溢出尝试。\n\n**D.** 这看起来像是一个 XSS 尝试。\n\
  \n![Image](img/r.jpg)\n**B.** Unicode 只是表示文本的另一种方式，为什么不用它来尝试绕过 IDS（入侵检测系统）呢？当然，在现实世界中，每个\
  \ IDS 可能都会在寻找奇怪的 Unicode 请求（它没有经过加密或或密，真的仅仅是提供了粗略的混淆），但我们现在只关注 EC-Council 和 CEH\
  \ 考试吧。这个请求似乎在尝试获取某些密码：\n\n![Image](img/f0152-02.jpg)\n\n![Image](img/w.jpg)\n**A,\
  \ C,** 和 **D** 都是错误的，因为这个 URL 并不一定表示这些任何一种攻击，而且它很明显是一个 Unicode 尝试。\n\n### 12.\n\
  哪一个 MSFconsole 命令允许你从控制内部连接到主机？\n\n**A.** pivot\n\n**B.** connect\n\n**C.** get\n\
  \n**D.** route\n\n![Image](img/r.jpg)\n**B.** 关于 Metasploit 的问题可能非常通用，或者——像这个问题一样——非常具体。通过\
  \ `msfconsole` 命令打开的 `MSFconsole` 是与 Metasploit 交互的常用方法。正如 Offensive Security 所说，它提供了一个“全合式”的中心化控制台，允许你高效地访问\
  \ MSF 中提供的几乎所有选项，并且它是访问 Metasploit 大部分功能的唯一支持方式。界面中使用的命令在 Offensive Security 的网站上都有很好的列出和讨论（[https://www.offensive-security.com/metasploit-unleashed/msfconsole-commands/]）。`connect`\
  \ 命令像一个微型的 netcat 克隆，支持 SSL、代理、跳板（pivoting）和文件发送。通过带有 IP 地址和端口号发布 `connect` 命令，你可以像使用\
  \ netcat 或 telnet 一样从 `MSFconsole` 内部连接到远程主机。\n\n除了 `MSFconsole`，你还应该知道 Metasploit\
  \ 架构包含五个模块：Exploits（利用利用）、Payloads（负载）、Encoders（编码器）、NOPS 和 Auxiliary（辅助）。`Exploits`\
  \ 是基础模块，用于封装（并配置利用的行为）利用。`Payloads` 在 Metasploit 和目标之间建立通信通道。`Auxiliary` 用于运行端口扫描和模糊测试等任务。\n\
  \n![Image](img/w.jpg)\n**A** 是错误的，因为 `MSFconsole` 中没有 `pivot` 命令。跳板（Pivoting）确实是指从被攻破的系统连接到其他机器，但它不是通过\
  \ `pivot` 命令实现的。\n\n![Image](img/w.jpg)\n**C** 是错误的，因为 `get` 命令用于获取特定上下文变量的值。\n\n\
  ![Image](img/w.jpg)\n**D** 是错误的，因为 `route` 命令用于通过会话路由流量（在问题问题中，通常与跳板有关）。\n\n###\
  \ 13.\n在测试 SQL 注入时，哪个字符是你的最佳选择？\n\n**A.** `@` 符号\n\n**B.** 双连线（--）\n\n**C.** `+`\
  \ 号\n\n**D.** 单引号（'）\n\n![Image](img/r.jpg)\n**D.** SQL 注入的核心在于向表单字段（或 URL）中输入查询和命令，以引发响应、获取信息或操纵数据。在网页上，很多时候输入表单字段的内容会被插入到\
  \ SQL 命令中。当你输入用户名时，它会被插入到 SQL 命令中。在一个网页上，很多时候输入表单字段的内容会被插入到 SQL 命令中。当你输入你的用户名时，它会被插入到\
  \ SQL 命令中。\n\n```\n```（（它没有加密加密或密， 真的仅仅是提供粗略的混淆）。\n\n![Image](img/w.jpg)\n**A, C,**\
  \ 和 **D** 都是错误的，因为这个 URL 并不一定表示这些任何一种攻击，而且显然是一个 Unicode 尝试。\n\n### 14.\n在测试 SQL\
  \ 注入时，哪个字符是你的最佳选择？\n\n**A.** `@` 符号\n\n**B.** 双连线（--）\n\n**C.** `+` 号\n\n**D.**\
  \ 单引号（'）\n\n![Image](img/r.jpg)\n**D.** SQL 注入的核心在于向表单字段（或 URL）中输入查询和命令，以引发响应、获取信息或操纵数据。在网页上，很多时候输入表单字段的内容会被插入到\
  \ SQL 命令中。当你输入你的用户名时，它会被插入到 SQL 命令中。\n\n### 15.\n尝试从目标网站获取信息产生了以下错误消息：\n\n```\n\
  Microsoft OLE DB Provider for ODBC Drivers error '80040e08'[Microsoft SQL Driver]\n\
  ```\n\n以下哪项描述了错误消息？\n\n**A.** 该站点可能受到 XSS 攻击。\n\n**B.** 该站点可能受到缓冲区溢出攻击。\n\n**C.**\
  \ 该站点可能受到 SQL 注入攻击。\n\n**D.** 该站点可能受到恶意软件注入。\n\n![Image](img/r.jpg)\n**C.** 再次，你将在考试中得到“送分题”。错误消息清楚显示了\
  \ SQL 错误，告诉我们有一个底层的 SQL 数据库需要处理，而且它可能配置不当（否则我们根本不会得到这样的错误消息——通过网页界面并告诉我们具体情况）。\n\
  \n### 16.\n攻击者发现了一个法的用户名（`user1`），并在表单验证窗口中输入以下内容：\n\n![Image](img/f0155-01.jpg)\n\
  \n最可能尝试的是以下哪种攻击？\n\n**A.** SQL 注入\n\n**B.** LDAP 注入\n\n**C.** URL 篡改\n\n**D.** DHCP\
  \ 放大\n\n\n\n\n\n![Image](img/r.jpg)\n### **B.** LDAP 注入的工作原理与 SQL 注入非常相似——你输入的代码会被应用程序传递给后端的某个地方进行处理。在\
  \ LDAP 注入中，如果对输入未进行验证，你可以在表单中直接输入 LDAP 查询并查看结果。在这种情况下，攻击者无需任何密码即可登录。来自合法登录的实际 LDAP\
  \ 查询可能看起来像这样：`(&(user=user1)(password=meh))`。添加 `)(&)` 字符后，表达式变为了 `(&(user=user1)(&))(password=meh))`，这只会处理查询中的用户名部分。并且由于该部分始终为真，攻击者就成功进入了。\n\
  \nLDAP 注入问题也可能集中在语法中使用的布尔运算符。需要记忆的运算符总结在下表中：\n\n![Image](img/f0156-01.jpg)\n\n![Image](img/w.jpg)\n\
  ### **A** 是错误的，因为该场景并没有表明是 SQL 注入攻击。SQL 注入尝试会利用单引号和 SQL 语句——例如，`test ‘) ;DROP TABLE\
  \ Users;--`。\n\n![Image](img/w.jpg)\n### **C** 是错误的，因为该场景没有显示 URL 篡改攻击。\n\n![Image](img/w.jpg)\n\
  ### **D** 是错误的，因为该场景没有显示 DHCP 放大攻击。\n\n#### 17. 下列哪是 Web 服务器将用户请求传递给应用程序并接收返回数据转发给用户的标准方法？\n\
  \n**A.** SSI\n**B.** SSL\n**C.** CGI\n**D.** CSI\n\n![Image](img/r.jpg)\n### **C.**\
  \ 通用网关接口 (`CGI`) 是一种在 Web 服务器和可执行程序之间传输信息的标准化方法（`CGI` 脚本设计用于对数据执行某些任务）。`CGI` 被认为服务器端解决方案，因为处理是在\
  \ Web 服务器上完成的，而不是在客户端。由于 `CGI` 脚本可以以 Web 服务器用户的权限在你的系统上运行几乎任意命令，而且它们几乎总是被封装起来，使得脚本将以脚本所有者的身份执行，因此如果不仔细检查，它们可能是极其危险。此外，服务器上的所有\
  \ `CGI` 脚本将以相同的用户运行，因此它们有潜力与其他脚本（无意或故意）发生冲突（例如，攻击者可以编写 `CGI` 脚本来破坏所有其他连接的数据库）。\n\
  \n![Image](img/w.jpg)\n### **A** 是错误的，因为服务器端包含 (`SSIs`) 是放置在 HTML 页面中的指令，并在提供页面时在服务器上进行评估。它们允许你将动态生成的内容添加到现有\
  \ HTML 页面中，而无需通过 `CGI` 程序或其他动态技术提供整个页面。\n\n![Image](img/w.jpg)\n### **B** 和 **D**\
  \ 是错误的，因为它们都作为干扰项包含在内。到此时，你肯定已经熟悉安全套接层 (`SSL`) 及其作为加密方法的价值了。$CSI$？嗯，那只是很好的电视节目。或者至少以前是这样。\n\
  \n#### 18. 攻击者执行了 SQL 注入攻击但没有收到任何返回。随后她继续发送多个 SQL 查询，以获取 TRUE 或 FALSE 的响应。正在执行哪种攻击？\n\
  \n**A.** 盲注 SQL 注入\n**B.** SQL 拒绝服务\n**C.** SQL 代码操作\n**D.** SQL 重放\n\n![Image](img/r.jpg)\n\
  ### **A.** 盲注 SQL 注入其实很酷，即使你不是一个极客。有时候，安全管理员所做的恰好让努力付诸流，而你无法收到最初期望的错误消息或返回信息。因此，为了提取你需要的信息，你开始向它（SQL\
  \ 数据库）提很多真或假问题。例如，你可以问它：“用户名是以 A 开头的吗？”。如果是真的，你就得到了信息。盲注 SQL 注入非常有意思，例如（`SELECT\
  \ * FROM users WHERE name='admin' AND 1=1`）。如果结果是真，攻击者就进入了。\n\n![Image](img/w.jpg)\n\
  ### **B**、**C** 和 **D** 是错误的，因为就我所知，这些都不是攻击类型，它们仅仅是干扰项。\n\n#### 19. 攻击者尝试进行 SQL\
  \ 注入攻击。下列哪项最可能结合攻击使用？\n\n**A.** `;`\n**B.** `:`\n**C.** `’`\n**D.** `\"`\n**E.**\
  \ `--`\n**F.** `~`\n\n![Image](img/r.jpg)\n### **A.** CSPP（连接字符串污染）是另一种注入形式。在许多\
  \ Web 中，与 URL 篡改一样，你在 CSPP 中使用分号 `;` 来分离请求。\n\n![Image](img/w.jpg)\n### **B**、**C**、**D**、**E**\
  \ 和 **F** 是错误的，它们不是干扰项。单引号 `’` 通常与 SQL 注入相关。\n\n#### 20. 攻击者尝试使用 Java 或其他函数，通过未验证的输入，导致服务器执行恶意代码并提供命令行访问。下列哪项最能描述此种行为？\n\
  \n**A.** Shell 注入\n**B.** 文件注入\n**C.** SQL 注入\n**D.** URL 注入\n\n![Image](img/r.jpg)\n\
  ### **A.** 对于 Web 应用程序攻击，有很多向量和途径。常见的之一是在输入字符串中注入内容以利用漏洞。被称为命令注入的 Shell 注入被定义为使用\
  \ Java 或其他函数提升权限。简而言之，攻击者将通过表单输入（或其他途径）传递命令以提升权限并打开恶意操作的 Shell。它发生在字段而不是预期字段中。\n\
  \n![Image](img/w.jpg)\n### **B** 是错误的，因为 ECCouncil 定义的文件注入攻击是攻击者在 Web 表单输入中注入指向远程站点漏洞的指针。当然，这可能达到相同的目的，但在这种情况下不是最佳选择。\n\
  \n![Image](img/w.jpg)\n### **C** 是错误的，因为 SQL 注入攻击涉及 SQL 查询和命令来获取响应或操作。\n\n![Image](img/w.jpg)\n\
  ### **D** 是错误的，因为 URL 注入不是一种攻击类型，并在此作为干扰项包含。\n\n\n\n\n\n![Image](img/r.jpg) **B.**\
  \ Cookies 可用于许多之处。如果你能获取所有用户的 cookies，就可以看到他们访问过什么，有时甚至能看到他们停留了多久。Cookies 还可以存储密码——由于大多数人会在多个网站上使用相同的密码，这对于攻击者来说可能是一座金矿。在这种情况下，攻击者通过重放\
  \ cookie 来获取访问权限。如果加密时使用单一密钥，则可能发生重放攻击，因为 cookie 认证是在应用层执行的。正因如此，某些组织要求浏览器在程序关闭时自动删除\
  \ cookies。\n\n![Image](img/w.jpg) **A** 是错误的，因为对任何内容（cookie、被盗的身份验证流等）进行重放攻击并不一定可以在任何时间执行。重放攻击需要规划和适当设置。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为 XML 与此完全无关。\n\n![Image](img/w.jpg) **D** 是错误的，因为在这种情况下，加密并不是在网络层执行的。\n\
  \n### 22.\nHTML 表单包含几种往来传输数据的方法。在表单内部，以下哪种方法将输入编码为统一资源标识符 (URI)？\n\n**A.** HEAD\n\
  **B.** PUT\n**C.** GET\n**D.** POST\n\n![Image](img/r.jpg) **C.** HTTP `GET` 是一种从表单返回数据的方法，它将表单数据“编码”到\
  \ URI 的末尾（一种识别 Web 资源的字符字符串，例如文本页面、视频剪、图像或应用程序）。例如，如果你在使用 `GET` 的表单中输入信用卡号，生成的 URL\
  \ 可能会看起来像 `https://somesite.com/creditcard.asp?c#=4013229567852219`，其中那串长长的数字显然是一个静静待在那儿等待任何人使用的信用卡号。\n\
  \n总的来说，`POST` 比 `GET` “更安全”，尽管它们都有各自的用处。如果你在好奇什么时候应该使用 `GET` 而不是 `POST`，答案涉及一个词汇课程：定义*等幂性*（idempotent）这一术语。等幂性常与\
  \ HTTP `GET` 一起提到，是一个关于操作属性的数学概念：如果该操作可以在不改变结果的情况下执行（即使运行多次也是如此），就被认为是等幂的。因此，如果确保输入返回对表单的总状态没有产生持久影响，那么使用\
  \ `GET` 是完全合理的。此外，`GET` 通常只能传输多达 8KB，而 `POST` 通常可以处理多达 2GB。然而，请记住，它可能会在那个 URI 中包含敏感信息。假设你的表单返回一个信用卡号，而坏人正在记录\
  \ URI：如果使用了 HTTP `GET`，攻击者可能推导出这些信息。简而言之，用户可以操纵 `GET` 和 `POST`，但由于 `GET` 依赖于浏览器渲染到屏幕上的可编辑字段内容，它更加可见。`POST`\
  \ 用于直接推送数据，而 `GET` 则用于预期服务器从 URL 提交的数据中提取某些内容。\n\n![Image](img/w.jpg) **A** 是错误的，尽管\
  \ `HEAD` 和 `GET` 相似，但表单中不使用 `HEAD`。它通常用于从 Web 服务器获取标头信息（例如，横幅抓取）并测试链接。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为表单中不使用 HTTP `PUT`。它用于将文件传输到 Web 服务器。\n\n![Image](img/w.jpg) **D**\
  \ 是错误的，因为 `POST` 不在 URI 中包含表单数据。根据世界维网联盟 (`www.w3.org/`)，HTML 定义了 `GET` 和 `POST`\
  \ 的区别。`GET` 意味着表单数据将被浏览器编码到 URL 中，而 `POST` 意味着表单数据出现在消息主体中。\n\n### 23.\n攻击者正在查看目标网站并查看\
  \ `http://www.anybiz.com/store.php?id=2` 账户。接下来他输入了以下 URL：\n\n```\nhttp://www.anybiz.com/store.php?id=2\
  \ and 1=1\n```\n\n网页正常加载。他又输入了以下 URL：\n\n```\nhttp://www.anybiz.com/store.php?id=2\
  \ and 1=2\n```\n\n出现了一个显示“发生错误”的通用页面。关于这些操作，以下哪种描述是正确的？\n\n**A.** 该站点容易受到跨站脚本攻击。\n\
  **B.** 该站点容易受到盲 SQL 注入攻击。\n**C.** 该站点容易受到缓冲区溢出攻击。\n**D.** 该站点容易受到 SQL 注入攻击。\n\n\
  ![Image](img/r.jpg) **B.** 这里显示的 URL 试图传递一个 SQL 查询以查看后台可能发生了什么。注意第一个 URL 增加了 `and\
  \ 1=1`。因为这是一个真陈述，页面无问题地加载了。然而，将其更改为假陈述（`and 1=2`）导致数据库返回错误。这现在被认为是“盲注”SQL 注入，因为实际错误没有返回给攻击者（相反，他得到了一个由数据库管理员配置的通用页面）。顺便提一下，有时攻击者完全接收不到错误消息或错误页面，但网站的显示方式会有不同——图片错位、文本错乱等——这表明可能存在盲注。\n\
  \n![Image](img/w.jpg) **A** 和 **C** 是错误的，因为这种攻击或结果与跨站脚本或缓冲区溢出完全无关。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为结果显示 SQL 注入是可能的。诚然这需要更长时间，因为攻击者看不到错误信息，并且需要大量的猜测，但该站点是脆弱的。\n\n###\
  \ 24.\n关于 WebGoat，以下哪些陈述*不是*正确的？\n\n**A.** WebGoat 由 OWASP 维护。\n**B.** WebGoat 只能安装在\
  \ Windows 系统上。\n**C.** WebGoat 基于黑盒测试理念。\n**D.** WebGoat 可以 Java 或 .NET。\n\n![Image](img/r.jpg)\
  \ **B.** WebGoat（版本 8.2.2，https://www.owasp.org/index.php/Category:OWASP_WebGoat_Project）是由\
  \ OWASP 维护的故意不安全的应用程序，旨在教授安全课程。在每个课程中，用户必须通过利用 WebGoat 中的真实漏洞证明他们对安全问题的理解。它是基于黑盒理念设计的（即学习者不会预先获得所有信息，必须发现解决每个课程所需的知识，就像他们在现实世界中必须这样做一样），可以安装在几乎任何系统上，并使用\
  \ Java 和 .NET。\n\n![Image](img/w.jpg) **A、C** 和 **D** 是错误的，因为它们都是关于 WebGoat 的正确陈述。\n\
  \n### 25.\n攻击者正在查看一篇显示新闻故事并请求评论的博客。在评论字段中，攻击者输入了以下内容：\n\n```\nNice post and a fun\
  \ read<script>onload=window.location='http://www.badsite.com'</script>\n```\n\n\
  攻击者试图尝试什么攻击？\n\n**A.** 针对博客底层数据库的 SQL 注入攻击\n**B.** 跨站脚本攻击\n**C.** 缓冲区溢出 DoS 攻击\n\
  **D.** 文件注入 DoS 攻击\n\n\n\n\n\n![Image](img/r.jpg) **B.** 这是一个经典的（尽管过于简化的）跨站脚本示例。在博客中，文章输入字段旨在接收访问者的文本输入，并将其复制到后台数据库中。这里尝试的不仅仅是复制文本——`<script>`\
  \ 标识符向一个恶意网站添加了一个精巧的小指针。如果执行成功，该网站下一个点击该新闻故事的下位访问客将会被重定向到恶意网站位置。\n\n![Image](img/w.jpg)\
  \ **A、**C、** 和 **D** 都是错误的，因为这个示例没有包含任何指示 SQL 注入或缓冲区溢出的内容。此外，这里的意图并不是执行拒绝服务攻击。实际上，情况恰恰相反：攻击者希望网站保持运行正常，以便将更多的用户引导到\
  \ `badsite.com`。\n\n### 26. 下列哪项是攻击者利用 Shellshock 漏洞最常用的方法之一？\n\n**A.** SSH 暴力破解\n\
  \n**B.** CSRF\n\n**C.** 表单字段输入操纵\n\n**D.** 通过利用 CGI（通用网关接口）的 Web 服务器\n\n![Image](img/r.jpg)\
  \ **D.** 我敢打大赌注，你一定会在考试中看到 Shellshock——甚至可能出现几次。Shellshock（也称为 Bashdoor）利用了 `bash`\
  \ shell 中的一个功能，该功能旨在允许环境变量设置配置。基本上，有人在 2014 年在玩 `bash` 的时候，发现他们可以向环境变量配置的命令行提交中添加任意命令。如果攻击者在漏洞系统上输入类似的内容：\n\
  \n```bash\nenv val='() [ :;}; echo BADCOMMAND' bash -c \"echo REALCOMMAND\"\n```\n\
  \n`BADCOMMAND` 将在真实命令之前执行。\n\n根据赛门克（[www.symantec.com/connect/blogs/shellshock-all-you-need-know-about-bash-bug-vulnerability](https://www.symantec.com/connect/blogs/shellshock-all-you-need-know-about-bash-bug-vulnerability)）的，“最可能的攻击路径是通过利用\
  \ CGI（通用网关接口）的 Web 服务器，这是广泛用于生成动态 Web 内容的系统。攻击者可能利用 CGI 向漏洞的 Web 服务器发送格式错误的环境变量。因为服务器使用\
  \ Bash 来解释该变量，它也将运行附加在其上的任何恶意命令。” Shellshock 的其他利用途径还包括：\n\n*   **OpenSSH**: “强制命令”功能（当用户登录时运行固定命令，即使用户请求了不同的命令）可以在\
  \ Shellshock 中被利用。\n*   **DHCP**: 某些 DHCP 客户端具有将命令传递给 `bash` shell 的能力——例如在连接到 Wi-Fi\
  \ 网络期间。这可以在 Shellshock 中被利用。\n*   **Qmail**: 如果使用 `bash` 处理电子邮件消息，服务器处理外部输入的方式可能会在\
  \ `bash` 中产生可利用的。\n\n![Image](img/w.jpg) **A** 是错误的，因为对 SSH 会话登录进行暴力破解与 Shellshock\
  \ 无关。\n\n![Image](img/w.jpg) **B** 是错误的，因为跨站请求是另一种漏洞。\n\n![Image](img/w.jpg) **C**\
  \ 是错误的，因为表单字段操纵与 Shellshock 无关。\n\n### 27. 关于 robots.txt 文件，下列哪种陈述是正确的？\n\n**A.**\
