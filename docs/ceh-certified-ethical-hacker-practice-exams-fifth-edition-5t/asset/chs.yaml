  \n## 引言\n\n大家好，欢迎阅读认证伦理黑客（CEH）模拟考试，目前已是第 11 版。如果你是这本书之前的旧版本或其配套读物 `CEH™ Certified\
  \ Ethical Hacker All-in-One Exam Guide`《第五版》的自豪所有者，欢迎回来！如果不是，你只是第一次拿起这本书看看它是否适合你，请先坐一下，我们来涵盖几项非常重要的内容。\n\
  \n你们中的一些人可能好奇“黑客”学习指南看起来是什么样子的，或者你们可能在考虑尝试新的认证或职业选择。你们中的一些人可能已经迈出了决定性的一步并开始了这条道路，现在正在寻找下一个资源来帮助你们完成旅程。而阅读此的中，有些人可能只是为了自己的职业寻找一些资历——这个小组中的大多数人是真正的专业人士，已经知道如何胜任工作，只是终于准备好把认证拿定了，而极少数人只是为了简历上的一个项目点（在你的电子邮件签名行中多加一个认证以给他人留下印象）。\n\
  \n无论你在职业生涯中处于什么位置，或者你对这个认证有多渴望，在你们承诺购买并阅读*这本书*之前，我有几件事需要先向大家说明清楚。首先（在进入正题之前），对于这种努力，我坚信这本书将帮助你获得认证。尽管如此，然而，我必须提供一个警告：依赖单本书——*任何*单本书来通过考试是灾难的根源。是的，这是一个极佳的资源，你绝对应该购买它（*现在——不要等！*）。然而，没有通过经验获得的时间和益处，你简直无法通过考试。事实上，EC-Council\
  \ 要求参加考试的候选人至少两年的 IT 安全相关经验。通过练习、练习和更多的练习来加强你在书中的学习，你以后会感谢我的。\n\n最后，请记住这个认证不是鱼鱼就班。CEH\
  \ 获得现在的声誉和价值并不是因为它容易获得。它的价值使其成为技术人员可以获得的顶级认证之一，并且现在是 DoD 8570 认证要求的一部分。简而言之，这个认证对雇主来说*真正有意义*，因为他们知道获得它需要付出的努力。\n\
  \n\n\n\n\n考试本身是一场耗时四小时、包含 125 道题的艰苦马拉松，当你点击 `Finish` 按钮时会感到精疲力竭。EC-Council 提供了一份手册（截至本文写作时，位于\
  \ [`cert.eccouncil.org/images/doc/CEH-Handbook-v5.pdf`](https://cert.eccouncil.org/images/doc/CEH-Handbook-v5.pdf)），其中包含了你对资质、内容以及考试和认证其他信息所需的所有知识。我在后续章节中包含了一些重点，详细介绍了考试以及你将需要的内容。\n\
  \n## 培训与准备\n\n候选人获得 CEH 认证有两种方式：通过培训，或仅通过自学。根据 EC-Council 网站（[`iclass.eccouncil.org/learning-options/`](https://iclass.eccouncil.org/learning-options/)），的培训选项包括：\n\
  \n*   **MasterClass 线上大师课**：这是一门“现场、在线、导师授课的培训课程，这意味着你可以从任何连接网络的地方参加由现场导师提供的课程。”此外，根据网站介绍：“我们的虚拟教室培训结合了我们的现场虚拟网络空间、真实世界的讲师、内容、练习和同伴协作，为你提供获得认证的最佳机会和最大的投资回报。”\n\
  *   **MasterClass 线下大师课**：这正如其字面意思：由北美各地城市的附属机构提供的课程。该网站对这一培训选项的描述如下：“在你所在的城市提供导师授课的培训，旨在为你提供便利且就在家门口的世界级教学，而且由于课程是现场的，你将在接受面对面教学和互动的同时，与同伴协作并获得实战技能。”\n\
  *   **进度自控**：直接源自网站，该解决方案是“一个异步自学环境，以流媒体视频格式提供 EC-Council 深受欢迎的 IT 安全培训课程，如 `CEH`。所有讲座均由专业从业人员授课，以确保课程概念具有真实世界的视角……并让你按照自己的节奏享受课堂培训的益处。”这还包含了通过\
  \ `Aspen` 提供的官方教材，以及为期六月的 `iLabs`（EC-Council 的虚拟实验室平台）访问权限。\n*   **认证俱乐部**：只需比 3,000\
  \ 美元少 1 美元，你就可以加入 `iClass Club`，在那里你“在订阅年度内仅需 499 美元即可获得一门完整的认证课程以及无限次的 EC-Council\
  \ 认证课程，你可以决定是以在线直播还是在线自学的形式进行培训，甚至可以混合使用。”简而言之，你将可以访问 EC-Council 广泛的视频和培训材料，并可以在任何时间跨度内混合使用任何培训方法。\n\
  *   **教材学习（自学）**：如果你想自己学习并且完全不在乎课程（也就是说，你已经学习了很长时间，并且认为去上课听别人教你已经知道的内容没有价值），你只需购买教材（截至本文写作时价格为\
  \ 877 美元）并自学即可。虽然要获得考试资格仍需完成所有必要的程序和障碍，但 EC-Council 绝对乐意向你出售他们的官方课程并让你自己尝试。\n\n\
  ## 考试\n\n对于这个版本，EC-Council 保留了上版本的考试评分方法和机制 ([`www.eccouncil.org/programs/certified-ethical-hacker-ceh/`](https://www.eccouncil.org/programs/certified-ethical-hacker-ceh/))。内容本身没有太大变化，除了我们在书中涵盖的新内容之外；然而，计算你是否通过考试的方法确实发生了。\n\
  \n考试是一场耗时四小时的计算机监考测试（换句话说，是在授权的测试中心现场进行的），它允许你跳过并标记问题，以便在每个章节结束时回顾。关于考试本身的常见问题（FAQs）不断更新，位于\
  \ [`cert.eccouncil.org/faq.html`](https://cert.eccouncil.org/faq.html)。你的考试分数会在完成后立即计算，因此请务必在点击\
  \ `Finish` 之前检查所有内容。然而，与之前的版本不同，现在没有固定的及格分数。\n\n## 本书内容\n\n我组织了这本书，使每章都由一组练习考试题组成，代表了你通过认证伦理黑客考试所需的的部分知识和技能。这本书的设计参考了\
  \ *CEH Certified Ethical Hacker All-in-One Exam Guide, Fifth Edition* 的结构，并可以作为极佳的伴读。\n\
  \n## 在线模拟考试\n\n除了书中包含的练习题外，电子测试引擎还提供了 250 道练习题。你可以按章节创建自定义考试，也可以参加多次限时的全真模拟考试。如需更多信息，请参阅附录。\n\
