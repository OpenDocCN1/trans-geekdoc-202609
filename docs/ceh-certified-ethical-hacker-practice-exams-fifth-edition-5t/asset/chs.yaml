  **D.** `Cloud consumer`（云消费者）\n\n### 15. 以下哪项不是虚拟化的好处？\n\n**A.** 它允许更高效的备份、数据保护和灾难恢复。\n\
  **B.** 它减少了系统管理工作。\n**C.** 它提高了运营效率。\n**D.** 它将单个硬件锁定到单个虚拟机。\n\n### 16. 一公司为其大部分业务\
  \ IT 获取了一个云环境。该环境供单一组织使用和运营。以下代表了所的云部署模型？\n\n**A.** 公有（Public）\n**B.** `IaaS`\n\
  **C.** 唯一源（Sole source）\n**D.** 私有（Private）\n\n### 17. 关于云计算，以下哪种描述是正确的？\n\n**A.**\
  \ 云安全仅是提供商的责任。\n**B.** 云安全仅是消费者的责任。\n**C.** 云安全是消费者和提供者的共同责任。\n**D.** 以上均非。\n\n\n\
  \n\n\n## 18. 哪种工具为 Amazon EC2 客户提供渗透测试的服务？\n\n**A.** CloudPassage Halo\n**B.** Core\
  \ Cloud\n**C.** CloudInspect\n**D.** Panda Cloud Office Protection\n\n## 19. 攻击者在与目标虚拟机相同的物理云主机上设置了一个虚拟机。然后他利用共享的物理资源来窃取数据。下列哪项描述了这种攻击？\n\
