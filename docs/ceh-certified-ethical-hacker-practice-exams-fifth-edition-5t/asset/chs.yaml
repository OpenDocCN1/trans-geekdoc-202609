  \ B\n27. A\n28. C\n\n## 答案 A\n\n### 1. 你正在检查当天渗透测试活动的日志，并在 Windows 10 机器上注意到以下条目：\n\
  \n![](img/f0121-01.jpg)\n\n关于此条目，以下哪个说法是正确的？\n\n**A.** 团队成员添加了一个用户账户。\n**B.** 团队成员将他的登录切换到了另一个用户的登录。\n\
  **C.** 团队成员更改了某个用户的密码。\n**D.** 团队成员重命名了一个用户账户。\n\n**C.** Windows 中的 `net` 命令绝对会在你的考试中出现，因为你无法判断会考你哪种语法或命令结构，所以你应该学习所有的。在这个示例中，`net\
  \ user` 命令列出了机器上的所有用户。接下来，团队成员使用了 `net user USERNAME PASSWORD` 命令——其中 `USERNAME`\
  \ 等于要更新的用户，`PASSWORD` 是为该用户设置的密码。在这个示例中，用户—USER1 的密码被更新为 `user2`。其他 `net user` 选项包括\
  \ `ADD`、`DELETE`、`TIMES` 和 `ACTIVE`。`Net` 命令在您当前登录的安全上下文中运行，因此在尝试许多此类命令之前，请确保你是机器的管理员。作为一个有用的提示，请记住你可能会在考试中看到类似的技巧（使用“user2”作为密码）。语法非常重要，在你的测试中经常会被操纵\n\
  \nNet 命令有许多用途。例如，`net view` 将显示工作组中的系统，`net use` 允许创建、连接和显示共享资源的信息，`net share` 将列出用户可以访问的所有共享，而\
  \ `net start` 允许启动服务。\n\n![](img/w.jpg)\n\n**A.** 错误，因为这与提供的语法不匹配。如果团队成员想要添加用户，他会首先确保拥有管理员权限，然后使用\
  \ `net user /ADD USERNAME` 命令（其中 `USERNAME` 是要创建的用户名）。\n\n![](img/w.jpg)\n**B.**\
  \ 错误，因为该命令或语法无法实现此操作。\n\n![](img/w.jpg)\n**D.** 错误，因为该命令或语法无法实现此操作。\n\n### 2. Amanda\
  \ 是大型组织的安全管理员。她在服务器上发现了一些远程工具，但没有找到请求这些这些变更记录。经过调查，她发现了一个未知 IP 地址连接，该连接通过未关闭的高端口访问了网络。IP\
  \ 地址首先被追踪到墨西哥的一个代理服务器。进一步调查显示连接在许多地方的代理服务器之间跳转。以下哪个代理工具是攻击者为了掩盖其足迹而最可能使用的？\n\n**A.**\
  \ ISA 代理\n**B.** IAS 代理\n**C.** TOR 代理\n**D.** Netcat\n\n\n\n\n\n![Image](img/r.jpg)\
  \ **C.** 我之前提到过，在这里我还会提一遍：有时候 CEH 考试和现实生活并不完全匹配。是的，承认这个，这个问题可能有点“花里胡哨”，但从 EC-Council\
  \ 的角度来看，它是有效的。这里的点在于，`TOR`（洋葱路由；[`www.torproject.org/`](https://www.torproject.org/））在执行几乎任何在线操作时，都提供了一种快速、简单且非常酷的方式来隐藏你的真实身份。根据该网站的描述，“`Tor`\
  \ 通过让你的通信在全球范围内志愿者运行的分布式中继网络中跳转来保护你：它防止监控你网络连接的人获知你访问了哪些网站，并防止你访问的网站获取你的物理位置。”（对于现实世界中的朋友们，只需知道，如果没有执法部门和一些严格的网络可见性，你可能可以成功追踪到第一跳，但仅此而已了。）`TOR`\
  \ 本质上是动态的，黑客可以简单地为每次攻击使用不同的路径。请记住，这个问题实际上是关于将 `TOR` 识别为一种隐藏踪迹的手段，而不是关于它真实工作原理的论述。如果这是一个基于现实的讨论，我们会有兴趣关注\
  \ Amanda 是如何判断连接最初在代理之间跳转的：更现实地说，她可能会检测到几个来自不同国家、利用相同访问权限的相似连接。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为互联网安全和加速（ISA）服务器的设计目的不是在多个代理之间跳转以掩盖原始源。根据微软的介绍，`ISA` “是微软 Proxy Server\
  \ 2.0 的继任者……并提供企业防火墙和 Web 代理/缓存服务器这两项基本服务。`ISA` 服务器的防火墙筛选所有数据包层、电路层和应用层流量。Web 缓存存储并提供所有经常访问的\
  \ Web 内容，以减少网络流量并为频繁访问的 Web 页面提供更快的访问速度。`ISA` 服务器还会在非峰期调度 Web 页面更新的下载。”\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为互联网身份认证服务（IAS）是服务器的一个组件，允许你为客户端提供远程认证拨号用户服务（RADIUS）连接。它并没有被设计为混淆代理——它的目的是身份认证。\n\
  \n![Image](img/w.jpg) **D** 是错误的，虽然你可以使用 `Netcat` 设置单个代理，甚至可能将几个代理链联起来，但它的设计初衷并不是为了这样工作（这正是这个问题的核心）。你可以用它设置一个监听端口，但它并没有被设计用作代理，而且将其设置成代理链会变得极其复杂，且在有许多其他可用选项的情况下完全没有必要。\n\
  \n### 3. 以下是在事件响应期间调取的的 HOSTS 文件：\n\n![Image](img/f0123-01.jpg)\n\n以下哪种描述最能描述该 HOSTS\
  \ 文件？\n\n**A.** 机器上尝试访问 [mybank.com](https://www.mybank.com) 检查银行账户的用户将被重定向到一个中国\
  \ IP 地址。\n\n**B.** 机器上尝试访问 [google.com](https://www.google.com) 的用户将收到 HTTP 400\
  \ 状态码。\n\n**C.** 机器上尝试访问 [gmail.com](https://www.gmail.com) 的用户将重定向到本地主机。\n\n**D.**\
  \ 任何到 IP 220.181.0.16 的 DNS 解析将以轮询方式重定向到列出的五个站点之一。\n\n![Image](img/r.jpg) **A.**\
  \ HOSTS 文件既是美之杰作，也是恐怖工具，这取决于你如何看待它。在任何 Windows 系统检查匹配名称请求的 IP DNS 之前，它会先检查 `HOSTS`\
  \ 文件。例如，当用户在浏览器中输入 [www.mybank.com](https://www.mybank.com) 并按下 `ENTER` 时，Windows\
  \ 会检查 `HOSTS` 文件查看是否存在 `mybank.com` 的映射。如果有，用户就会转到那里。如果没有，Windows 将向 DNS 请求一个要使用的\
  \ IP 地址。因此，如果你编辑了自己的 `HOSTS` 文件，你就可以自己避开许多广告流网站（只需将它们重定向到 localhost），并确保你的孩子不会意外进入他们不该去的地方。如果你拿到了目标的\
  \ `HOSTS` 文件，你就可以将他们发送到任何你想去的地方。\n\n在这个示例中，似乎有人获取了这台特定机器的 `HOSTS` 文件，并对其进行了编辑，将一些常见的\
  \ URL 请求发送到中国的 IP 地址。也许他们设置了这些站点的伪造版本以获取凭据。或者他们只是想对用户进行 DoS 攻击。无论如何，访问 mybank.com、[google.com](https://www.google.com)、[gmail.com](https://www.gmail.com)、[amazon.com](https://www.amazon.com)\
  \ 或 [facebook.com](https://www.facebook.com) 的尝试都会立即重定向到列出的中国 IP。用户避免这种情况的方法是使用\
  \ IP 地址而不是命名的 URL。\n\n噢，还有一件事：我们如何知道它是中国 IP 地址？当然是通过 `Whois`，你可以在那里确定 `220.181.0.0/19`\
  \ 网段分配给了 CHINANET（中国电信）。\n\n![Image](img/w.jpg) **B** 是错误的，因为无法判断是否会出现 400 返回码（这意味着服务器由于明显的客户端错误，例如请求语法不正确、无效的请求消息帧或欺骗性的请求路由，而无法或拒绝处理请求）。如果请求是有效的（它应该是有效的），并且服务器能够将该请求注册为有效（这再次取决于坏人在那个特定\
  \ IP 上设置了什么），则不会返回 400 错误。\n\n![Image](img/w.jpg) **C** 和 **D** 是错误的，因为这两者都不符合 `HOSTS`\
  \ 文件条目中所采取的操作。\n\n### 4. 以下哪项可以在 Windows 命令行中打开计算机管理 MMC？\n\n**A.** `compmgmt.mmc`\n\
  \n**B.** `compmgmt.msc`\n\n**C.** `compmgmt.exe`\n\n**D.** `computermgmt.exe`\n\n\
  ![Image](img/r.jpg) **B.** 诚然，这道题很好选——前提是你已经学习过并熟悉你的 MMC。你学过它们吧？因为如果你学过，就会知道微软管理控制台用于各种任务。这些\
  \ MMC 包括计算机管理、设备管理器、事件查看器、组策略编辑器和活动目录用户和。你可以通过在命令行中输入 `mmc` 然后从菜单中使用添加/删除插项来创建自己的\
  \ MMC，你也可以通过它们的 `.msc` 命令行选项打开单个控制台。例如，计算机管理可以是自定义 MMC 的插项，你也可以通过 `compmgmt.msc`\
  \ 命令单独打开它。其他你可能想要记住的还包括 AD 用户和计算机 (`dsa.msc`)、设备管理器 (`devmgmt.msc`)、事件查看器 (`eventvwr.msc`)、本地组策略编辑器\
  \ (`gpedit.msc`) 和本地安全策略 (`secpol.msc`)。\n\n![Image](img/w.jpg) **A、C、 和 D** 都是错误的，因为它们不符合打开计算机管理的语法。\n\
  \n### 5. 以下哪项将从 NTFS 数据流中提取可执行文件？\n\n**A.** `cat file1.txt:hidden.exe > visible.exe`\n\
  \n**B.** `more file1.txt | hidden.exe > visible.exe`\n\n**C.** `type notepad.exe\
  \ > file1.txt:hidden.exe`\n\n**D.** `list file1.txt$hidden.exe > visible.exe`\n\n\
  \n\n\n\n![Image](img/r.jpg) **A.** 这是正确的语法。`cat` 命令将可执行文件直接提取到你执行该命令的文件夹中。NTFS 文件流（file\
  \ streaming）允许你将几乎任何文件隐藏在任何其他文件之后，使其在目录搜索中变得不可见。该文件可以是一个文本文件，用于提醒你回到目标时需要采取的步骤，甚至可以是一个你以后可以空闲运行的可执行文件。以\
  \ NTFS 文件流形式存在的备用数据流（ADS）是 Windows 原生 NTFS 的一项功能，用于确保与 Apple 文件系统（称为 `HFS`）的兼容。在考试时要小心——你会看到\
  \ ADS 和 NTFS 文件流交替使用。顺便提一下，Windows 7 和 Windows 10 机器上没有 `cat` 命令（你需要 Linux 模拟器或类似的工具在这些机器上使用\
  \ `cat` 命令）。此外，你可以使用 `c:\\> (more<file1.txt:hidden.exe) > output.txt` 作为另一种选择。这将读取隐藏流的输出并将其写入\
  \ `output.txt` 文件，而无需使用 `cat`。\n\n![Image](img/w.jpg) **B** 是错误的，因为这不是正确的语法。在提取文件时没有管道（`|`）函数，且\
  \ `more` 命令用于显示文本文件的内容，而不是从 ADS 中提取可执行文件。\n\n![Image](img/w.jpg) **C** 是错误的，因为这不是正确的语法。此选项将显示隐藏文本文件的内容——也许你已经在其中存储了指令以备后用。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为这种语法无论如何想象都不可能是正确的。此项是作为干扰项包含在这里的。\n\n### 6.\
  \ 在 Linux 机器上使用哪个命令允许用户对特定文件拥有所有权限、组只读、其他所有人只读？\n\nA. `chmod 411 file1`\n\nB. `chmod\
  \ 114 file1`\n\nC. `chmod 117 file1`\n\nD. `chmod 711 file1`\n\nE. `chmod 744 file1`\n\
  \n![Image](img/r.jpg) **E.** 你需要了解一些基础 Linux 命令才能通过这次考试，我可以保证你会看到一道关于 `chmod` 的题目。Linux\
  \ 中的文件权限通过使用每个 rwx 组的二进制等价值来分配：读等于 4，写等于 2，执行等于 1。要累计权限，将这些数字相加：`4` 是只读，`6` 是读写，在其中加上执行权限结果为\
  \ `7`。顺便提一下，如果你用二进制思考，这些数字的定义同样简单：`111` 等于十进制的 `7`，每个开启的位分别代表读、写和执行。将位设置为 `101`\
  \ 则会开启读取、关闭写入并开启执行；其十进制等价值为 `5`。\n\n![Image](img/w.jpg) **A, B, C,** 和 **D** 都是我们想要实现的实现的错误语法：`411`\
  \ 等于只读、执行和执行，`114` 是后者的反过来，`117` 等于执行、执行和全权限，而 `711` 是其反过来。\n\n### 7. 检查以下 passwd\
  \ 文件：\n\n![Image](img/f0126-01.jpg)\n\n关于此 passwd 文件，以下哪些陈述是正确的？（选择所有。）\n\nA. 没有用户账户分配了密码。\n\
  \nB. 系统使用了影子文件（shadow file）。\n\nC. root 账户密码是 `root`。\n\nD. root 账户有一个影子密码。\n\n\
  E. Alecia 创建的文件最初可以被 Jason 看到。\n\n![Image](img/r.jpg) **B, D, E.** 如果你的考试中关于 Linux\
  \ passwd 文件的题目少于二到四道，我就吃我的帽子。我参加过的每一场考试和模拟考试都会引用这个文件——引用很多次——把它包含在这里是为了确保你注意它。`passwd`\
  \ 文件中的字段从左到右如下：\n\n*   **User Name（用户名）**：这是用户作为登录名称输入的名称。每个用户名必须是唯一的。\n*   **Password（密码）**：如果使用了影子文件，这里将显示一个\
  \ `x`。如果没有使用，你将看到加密后的密码（在当前的操作系统版本中），且只有当你是 `root` 时才会显示。顺便提一下，将其设置为星号（`*`）是禁用账户的方法。\n\
  *   **UID（用户标识符）**：操作系统用于内部目的的用户标识符。每添加一个新用户，它通常会加 1。\n*   **GID（组标识符）**：组标识符识别用户的主组。该用户创建的所有文件通常都可以被该组访问，除非有\
  \ `chmod` 命令阻止（这就是题目中“最初”那部分的原因）。\n*   **Gecos**：这是用户的描述性字段，通常包含用逗号隔开的联系信息。\n* \
  \  **Home Directory（家目录）**：这是用户家目录的位置。\n*   **Startup（启动项）**：这是启动的程序。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为 `x` 表示影子密码。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `x` 表示影子密码。\n\n\
  ### 8. 你正在尝试破解一台机器并想要 SAM 的副本。你可以在哪里找到它？（选择所有。）\n\nA. `/etc/passwd`\n\nB. `/etc/shadow`\n\
  \nC. `C:\\windows\\system2\\config`\n\nD. `C:\\winnt\\config`\n\nE. `C:\\windows\\\
  repair`\n\n![Image](img/r.jpg) **C, E.** 根据微软的定义，安全管理器（SAM）是一个存储账户和安全描述符的数据库。SAM\
  \ 位于 `C:\\windows\\system2\\config`。\n\n![Image](img/w.jpg) **A** 和 **B** 都是错误的，因为\
  \ `/etc` 是 Linux 目录（注意是斜杠而不是反斜杠）。`/etc` 文件夹包含了所有的文件。\n\n![Image](img/w.jpg) **D**\
  \ 是错误的，因为这不是 SAM 的位置。\n\n### 9. 关于 Kerberos，以下哪些陈述正确？（选择所有。）\n\nA. Kerberos 使用对称加密。\n\
  \nB. Kerberos 使用非对称加密。\n\nC. 客户端明文向 KDC 请求令牌。\n\nD. KDC 对客户端的响应从未包含密码。\n\nE. 客户端从服务器解密\
  \ TGT。\n\n![Image](img/r.jpg) **A, B, C, D, E.** 所有答案都是正确的。Kerberos 使用对称和非对称加密在网络上安全地传输密码和密钥。整个过程由密钥中心（KDC）、认证服务（AS）、令牌授予服务（TGS）和令牌授予令牌（TGT）组成。基本的\
  \ Kerberos 从向持有 AS 和 TGS 的 KDC 请求令牌开始，令牌将在整个网络中用于验证。此请求是明文的。服务器将响应一个密钥，该密钥由服务器保留的密码副本进行哈希（密码从未发送——只有哈希和密钥）。这就是\
  \ TGT。客户端因为知道密码可以解密消息，并将 TGT 发回以请求 TGS 服务令牌。服务器响应服务令牌，允许客户端登录并访问网络资源。\n\n\n\n\n\n\
  **B.** 字典攻击完全基于整个单词的列表，而混合攻击则可以使用各种字母、数字和特殊字符。\n\n**C.** 字典攻击使用预定义的单词列表，而混合攻击会替换这些单词中的数字和符号。\n\
  \n**D.** 混合攻击和字典攻击是相同的。\n\n![Image](img/r.jpg) **C.** 混合攻击是字典攻击的一种变体。在这种尝试中，你仍然有一个单词列表；但是破解器足够智能，可以替换这些单词中的字母和字符。例如，两种攻击都可能使用包含\
  \ `Password` 单词的列表。为了对其产生多个变体，字典攻击需要将每个变体单独地添加到列表中（`P@ssword`、`Pa$$word` 等）。而混合攻击仅要求单词列表包含\
  \ `Password`，因为它会通过交换字符和字母来寻找同一个单词的不同版本。\n\n![Image](img/w.jpg) **A** 是错误的，因为混合攻击不使用彩虹表。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为字典攻击可以使用整个单词的变体；它们只需要在列表中单独列出即可。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为混合攻击和字典攻击绝对是不同的。\n\n### 11. 下列哪个包含 IANA 定义的已知服务的端口号列表？\n\n**A.**\
  \ `%windir%\\\\etc\\\\lists`\n\n**B.** `%windir%\\\\system32\\\\drivers\\\\etc\\\
  \\lmhosts`\n\n**C.** `%windir%\\\\system32\\\\drivers\\\\etc\\\\services`\n\n**D.**\
  \ `%windir%\\\\system32\\\\drivers\\\\etc\\\\hosts`\n\n![Image](img/r.jpg) **C.**\
  \ 在写这些书时，我曾多次坐下来思考，苦苦于确定为什么某些特定但并不十分实用的东西对考试命题人来说似乎如此亲切，但我找不到任何特定的逻辑或理由。有时你只需要记住它并继续下去，这个例子也不例外。如果你在实际工作中完全忘记了每个已知端口号，你可能只是会在互联网上搜索并查找该列表。不过，如果你感到无聊或真的是个技术宅，，可以通过访问\
  \ `services` 文件来调出它们的列表。它就坐在 `HOSTS` 和 `LMHOSTS` 文件的旁边。\n\n![Image](img/w.jpg) **A,\
  \ B,** 和 **D** 是错误的，因为这些位置不包含服务文件。\n\n### 12. 下列哪个 SID 表示真正的管理员账户？\n\n**A.** `S-1-5-21-1388762127-2960977290-773940301-1100`\n\
  \n**B.** `S-1-5-21-1388762127-2960977290-773940301-1101`\n\n**C.** `S-1-5-21-1388762127-2960977290-773940301-500`\n\
  \n**D.** `S-1-5-21-1388762127-2960977290-773940301-501`\n\n![Image](img/r.jpg) **C.**\
  \ Windows 中的安全标识符 (`SID`) 用于标识“安全主体”。它是每个账户和服务的唯一标识，并在该主体的整个生命周期内有效。与账户相关的所有其他内容仅仅是\
  \ `SID` 的属性，这允许账户在重命名而不影响其安全属性。在 Windows 系统中，真正的管理员账户始终具有 `500` 的 `RID`（相对标识符）。\n\
  \n![Image](img/w.jpg) **A** 和 **B** 是错误的，因为 `1100` 或 `1101` 都不是与管理员账户相关的 `RID`。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 501 是访客账户。\n\n### 13. 在 EC-Council 的方法论的哪一步中你会找到隐写术？\n\
  \n**A.** 破解密码\n\n**B.** 提升权限\n\n**C.** 执行应用程序\n\n**D.** 隐藏文件\n\n![Image](img/r.jpg)\
  \ **D.** 是的，它是关于隐藏数据的。\n\n### 14. 下列哪个环境变量被 Linux 使用？\n\n```bash\nenv x={}; echo\
  \ x\n```\n\n**A.** 添加用户\n\n**B.** 提升权限\n\n**C.** 修改密码\n\n**D.** 显示文件\n\n### 15.\
  \ 下列哪个密码最可能创建哈希？\n\n**A.** `123456789`\n\n**B.** `CEISA`\n\n**C.** `c3His@`\n\n\
  **D.** `CEHhard`\n\n\n\n\n\n### 16.\n你正在检查 Linux 机器上的历史日志，注意到攻击者在几个进程命令后添加了一个安培符号（`&`）。关于这一点，以下哪种陈述是正确的？\n\
  \n**A.** `&` 符号对进程命令没有影响。\n\n**B.** `&` 符号将进程作为后台任务运行，并在用户注销时将其关闭。\n\n**C.** `&`\
  \ 符号确保进程在用户注销后继续运行。\n\n**D.** `&` 符号将进程与后续命令连接。\n\n![Image](img/r.jpg) **B.** 好的，我承认这道题有点刁钻，但你的考试中有很多题目都会很刁钻，所以我并不打算致歉。安培符号（`&`）不仅是世界上听起来最酷的字符符号之一，还被用于\
  \ Linux 命令行将进程置于后台，并导致其在用户注销时关闭。顺便提一下，你可以使用 `bg` 和 `fg` 命令分别将进程移动到后台和前台。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为 `&` 符号对命令确实影响。\n\n![Image](img/w.jpg) **C** 是错误的，因为进程在注销后不会继续运行。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 `&` 符号并不连接任何内容。\n\n### 17.\n以下哪些项被视为离线密码攻击？（选择所有项。）\n\
  \n**A.** 使用硬件键盘记录器\n\n**B.** 在被盗的 `SAM` 文件上使用 `Cain and Abel` 进行暴力破解\n\n**C.** 在被盗的\
  \ `passwd` 文件上使用 `John the Ripper`\n\n**D.** 窥视攻击\n\n![Image](img/r.jpg) **A, B,\
  \ C.** 当你将密码文件（或密码本身）离线以进行处理时，就会发生离线密码攻击。一种常见的方法涉及盗取 `SAM` 或 `passwd`（shadow）文件，然后对其运行字典攻击、混合攻击或暴力破解（使用如\
  \ `Cain and Abel` 或 `John the Ripper` 等密码破解工具）。键盘记录器也被视为离线攻击，因为你是在网络之外检查内容的。\n\n\
  ![Image](img/w.jpg) **D** 是错误的，因为窥视攻击被认为是完全另一种形式的攻击——一种非电子攻击。不，我不是在编造；这实际上是 CEH\
  \ 术语中的一个词，指的是获取密码的社会工程方法。窥视攻击基本上是站在某身后观察他们的击键轨迹。\n\n### 18.\n如果在系统中发现了 rootkit，以下哪种项是恢复的*最佳*替代方案？\n\
  \n**A.** 从良好的备份中替换所有数据文件\n\n**B.** 安装 `Tripwire`\n\n**C.** 从已知的介质重新加载整个系统\n\n**D.**\
  \ 删除所有数据文件并重启\n\n![Image](img/r.jpg) **C.** 有时候，老旧的“擦掉重装”不仅比清理工作更快，而且是绝对的更好。对于 rootkit\
  \ 来说，这真的是你唯一的选择。如果它是一个有记录的现成 rootkit，可能某处可以找到如何完全删除它的良好说明，但请记住，虽然你*认为*按照删除指令可能已经删除了它，但只有当你抹掉系统并重新加载时你才*知道*它消失了。\n\
  \n![Image](img/w.jpg) **A** 和 **D** 是错误的，因为你对数据文件本身做的几乎任何操作都无助于消除 rootkit。设备已经被\
  \ root 权限，所以所有数据都应该被视为可疑。\n\n![Image](img/w.jpg) **B** 是错误的，虽然 `Tripwire` 是一个很好的工具，但一旦机器被感染，它对你来说就没用了。\n\
  \n### 19.\n检查攻击尝试期间截取的日志文件部分：\n\n```bash\n[matt@localhost]#rm –rf /tmp/mykit_headers\n\
  [matt@localhost]#rm –rf /var/log/messages\n[matt@localhost]#rm –rf /root/.bash_history\n\
  ```\n\n攻击者试图做什么？\n\n**A.** 复制文件以备后检查。\n\n**B.** 掩盖他的足迹。\n\n**C.** 更改 shell 以锁定其他用户。\n\
  \n**D.** 上传 rootkit。\n\n![Image](img/r.jpg) **B.** 你一定会在测试中看到基础 Linux 命令，这就是他们询问你关于这些命令的一个例子。在这个例子中，`rm`\
  \ 命令被用于删除（移除）Linux 系统上的文件。观察黑客试图删除的内容，即使在没有看到其他部分的情况下，逻辑上也可以假设黑客正在掩盖他的足迹。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为 Linux 中用于复制的命令是 `cp`。\n\n![Image](img/w.jpg) **C** 是错误的，因为 shell\
  \ 没有被篡改。\n\n![Image](img/w.jpg) **D** 是错误的，因为没有证据显示上传了任何内容。\n\n### 20.\n你怀疑你的机器遭到了攻击。哪个命令将显示所有进程？\n\
  \n**A.** `ls -d`\n\n**B.** `ls -l`\n\n**C.** `su`\n\n**D.** `ps -ef`\n\n**E.** `ifconfig`\n\
  \n![Image](img/r.jpg) **D.** `ps` 命令用于 Linux 显示进程。`-e` 切换选择所有进程，`-f` 切换提供完整列表。\n\
  \n![Image](img/w.jpg) **A** 和 **B** 是错误的，因为 `ls` 列出目录内容。一些切换包括 `-d`（列出项而非内容）、`-h`（人类可读格式）、`-l`（长列表）和\
  \ `-p`（文件类型）。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `su` 命令用于“切换用户”。假设你有权限这样做，它可以允许更改有效用户\
  \ ID 和组。\n\n![Image](img/w.jpg) **E** 是错误的，因为 `ifconfig` 用于配置网络接口。它看起来和工作方式与 Windows\
  \ 中的 `ipconfig` 命令非常相似，这使得出题者的容易目标，因此在询问配置网卡（NIC）时要注意。\n\n### 21.\n一个组织想要控制流量并对其进出\
  \ DMZ 的流量进行状态检查。Linux 的哪种内置功能可以实现这一点？\n\n**A.** `iptables`\n\n**B.** `ipchains`\n\
  \n**C.** `ipsniffer`\n\n**D.** `ipfirewall`\n\n![Image](img/r.jpg) **A.** `iptables`\
  \ 是 Linux 中内置的“用户空间”应用程序，允许你配置内核内核防火墙使用的表。它必须以 root 权限执行并允许状态检查。在大多数 Linux 系统上，`iptables`\
  \ 安装为 `/usr/sbin/iptables`。\n\n![Image](img/w.jpg) **B** 是错误的，因为 `ipchains` 不允许状态检查。\n\
  \n![Image](img/w.jpg) **C** 和 **D** 是错误的，据我所知，不存在 `ipsniffer` 或 `ipfirewall`。\n\n\
  ### 22.\n以下哪项最能描述 Cygwin？\n\n**A.** Cygwin 是运行在 Windows 之上的 Unix 子系统。\n\n**B.**\
  \ Cygwin 是运行在 Unix 之上的 Windows 子系统。\n\n**C.** Cygwin 是一个 C++ 编译器。\n\n**D.** Cygwin\
  \ 是一个密码破解工具。\n\n\n\n\n\n![Image](img/r.jpg)**A.** Cygwin ([www.cygwin.com/](https://www.cygwin.com/))\
  \ 为 Windows 提供了一个类似 Linux 的环境。根据 Cygwin 网站介绍，它是一个大型的 GNU 和开源工具集合，可以在 Windows 上提供与\
  \ Linux 发行版相似的功能，并包含一个提供实质性 POSIX API 功能的 DLL 链接库（`cygwin1.dll`）。Cygwin DLL 目前支持从\
  \ Windows XP SP3 开始的所有最近的、商用发布的 x86 32 位和 64 位 Windows 版本。\n\n![Image](img/w.jpg)**B,\
  \ C,** 和 **D** 都是对 Cygwin 的错误描述。\n\n### 23. Linux 中的哪个文件夹存放管理命令和守护进程？\n\n**A.**\
  \ `/sbin`\n**B.** `/bin`\n**C.** `/dev`\n**D.** `/mnt`\n**E.** `/usr`\n\n![Image](img/r.jpg)**A.**\
  \ 系统二进制文件文件夹包含大多数管理命令（`/etc` 包含其他命令），它是 Linux 运行的大多数例程的存储库（被称为*守护进程*）。\n\n![Image](img/w.jpg)**B**\
  \ 是错误的，因为此文件夹包含各种基础 Linux 命令（类似于 Windows 中的 `C:\\Windows\\System32` 文件夹）。\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，因为此文件夹包含指向各种存储和输入输出系统的指针位置，如果你想使用这些系统，就需要挂载它们，例如光驱驱动器和额外的硬盘或分区。顺便说一下，Linux\
  \ 中的一切皆为文件。\n\n![Image](img/w.jpg)**D** 是错误的，因为此文件夹存放你实际挂载的访问位置。\n\n![Image](img/w.jpg)**E**\
  \ 是错误的，因为此文件夹包含大多数用户特有的信息、命令和文件。\n\n### 24. 下列哪是 Metasploit 攻击会话中进行转向（pivot）的手段？\n\
  \n**A.** 在 meterpreter 之外使用 pivot 漏洞。\n**B.** 在 meterpreter 中重新配置网络设置。\n**C.** 将负载\
  \ 设置为传播（propagate）。\n**D.** 在 meterpreter 中创建 route 语句。\n\n![Image](img/r.jpg)**D.**\
  \ 要回答这个问题，你必须知道 *pivot*（转向）的含义以及 meterpreter 是什么，这两者的最佳解释可以在 Offensive Security\
  \ 网站（[www.offensive-security.com/](https://www.offensive-security.com/)）上找到：“转向是一种独特的技术，使用一个实例（也称为*植入点*或*立足点*）能够在网络内部进行‘移动’。基本上是利用第一次攻破来允许甚至帮助攻破其他无法访问的系统。Metasploit\
  \ 拥有一个 `autoroute` meterpreter 脚本，允许通过第一个被攻破的机器攻击次级网络。meterpreter 是一种先进的、动态扩展的负载，它使用内存\
  \ DLL 注入加载程序并在网络上进行扩展。meterpreter 完全驻留在内存中，不向磁盘写入任何内容。在动态 meterpreter 环境中添加 `route`\
  \ 语句允许攻击‘转向’到一个新目标。很酷，对吧？”)\n\n![Image](img/w.jpg)**A, B,** 和 **C** 是错误的，因为它们对于转向攻击来说既不合法也不准确。\n\
  \n### 25. 你正在检查 Windows 机器上的文件，注意到一个文件的属性包含“h.”。这表示什么？\n\n**A.** 文件被标记为备份。\n**B.**\
  \ 文件是帮助功能的一部分。\n**C.** 文件因为大小原因而碎片化了。\n**D.** 文件已被杀病毒软件隔离。\n**E.** 文件是隐藏的。\n\n![Image](img/r.jpg)**E.**\
  \ 隐藏属性可以设置在任何文件上，以使其从标准搜索中隐藏。你可以通过命令行实现这一点：\n```\nattrib +h filename\n```\n或通过右键点击实现。\n\
  \n![Image](img/w.jpg)**A, B,** 都是都是错误的。\n\n### 26. 攻击者已进入一个被攻破的系统。使用 Metasploit，下列哪项描述最能描述对其他系统进行转向（pivot）的动作？\n\
  \n**A.** 在 meterpreter 之外使用 pivot 漏洞利用程序。\n**B.** 在 meterpreter 中重新配置网络设置。\n**C.**\
  \ 将负载 设置为传播。\n**D.** 在 meterpreter 中创建 route 语句。\n\n![Image](img/r.jpg)**D.** 要回答这个问题，你必须知道\
  \ *pivot* 的含义以及 meterpreter 是什么，这两者的最佳解释可以在 Offensive Security 网站（[www.offensive-security.com/](https://www.offensive-security.com/)）上找到：“转向是一种独特的技术，使用一个实例（也称为*植入点*或*立足点*）能够在网络内部进行‘移动’。基本上是利用第一次攻破来允许甚至帮助攻破其他无法访问的系统。Metasploit\
  \ 拥有一个 `autoroute` meterpreter 脚本，允许通过第一个被攻破的机器攻击次级网络。meterpreter 是一种先进的、动态扩展的负载，它使用内存\
  \ DLL 注入加载程序并在网络上进行扩展。meterpreter 完全驻留在内存中，不向磁盘写入任何内容。在动态 meterpreter 环境中添加 `route`\
  \ 语句允许攻击‘转向’到一个新目标。很酷，对吧？”\n\n![Image](img/w.jpg)**A, B,** 和 **C** 都是错误的，因为它们对于转向攻击来说既不合法也不准确。\n\
  \n### 27. 下列哪种攻击结合一个字典文件的项生成字典列表？\n\n**A.** 组合（combinator）\n**B.** 指纹（fingerprint）\n\
  **C.** 切换大小（Toggle-Case）\n**D.** 马尔可夫链（Markov-Chain）\n\n![Image](img/r.jpg)**A.**\
  \ 组合攻击将一个字典文件的项与另一个字典文件的结合生成新的字典列表，并用于破解密码。\n\n![Image](img/w.jpg)**B** 是错误的，因为在指纹攻击中，密码被拆分为单字符组合——有助于破解复杂密码。\n\
  \n![Image](img/w.jpg)**C** 是错误的，因为在切换大小攻击中，对单词进行所有可能的大小写组合进行尝试。\n\n![Image](img/w.jpg)**D**\
  \ 是错误的，因为在马尔可夫链攻击中，密码被拆分为两个到三个音节，从而创建一个新的字母表。\n\n\n\n\n\n# Web 服务器与应用程序攻击\n\n- 描述\
  \ Web 服务器和 Web 应用攻击\n- 识别 Web 服务器和应用程序漏洞\n- 识别 Web 应用黑客工具\n\n1863 年春天，战场上正形成一种失衡。在弗雷德里克格堡战役获胜后，罗伯特·E·李将军和“石墙”杰克逊在弗吉尼亚州的钱纳尔斯斯维尔及周边聚集了约\
  \ 6 万人的、规模庞大的南方联军。。然而，约瑟夫·胡克少将指挥着一支约 13 万人的联邦军，并并接到了林肯总统的直接命令，要消灭南方联军。因此，他根据当前的军事战略制定了一项行动计划，利用其优势远大的兵力向敌人进军。从任何角度来看，这都将是北方的一场大胜。\n\
  \n然而，李将军并非以遵守严格的战斗规则而闻名。当胡克集结兵力准备正面进攻时，李做了一件在当时是前所未有的事情：他将本就处于劣势的军队分为三组。他留下了区区的\
  \ 1 万人迎击正面冲击，但将另外 5 万人分成两组，去包围并侧翼进攻联邦军。通过南方联军的一系列不可思议的胜利，以及北方对手完全犹豫且令人困惑的决策，这场战斗成为了一部关于在重逆境中获胜的教科书，同时也展示了战场上头脑与策略的力量。\n\
  \n你可能会问，这和我们有什么关系呢？通过改变攻击重心，李将军成功地取得了历史上最出人意料的军事胜利之一。在渗透测试中，你也可以这样做，将精力集中在目标强大的防御可能忽略的区域：他们的\
  \ Web 应用程序和服务器（是的，我知道这很老套，但请听我的没错吧）。企业和公司就像那支联邦军，针对你的防御层层层，看似无懈可击。但大多数可以通过它们面向公众的\
  \ Web 前端（这些前端可能包含也可能不包含适当的安全措施）以及定制的内部 Web 应用程序进行侧翼包。本章完全关于 Web 服务器和应用程序，以及你如何利用它们。毕竟，如果目标要信任它们，为什么不看一眼呢？\n\
  \n![Image](img/examp.jpg)\n\n### 学习技巧\nWeb 服务器和应用程序黑客攻击占你考试内容的整 16%，因此显然值得你投入大量的学习精力。我希望告诉你们，背诵术语和关键词就足以通过这些问题，但现在情况已不再如此。ECC\
  \ 想要确保你彻底了解 Web 服务器和应用程序，因此他们增加了题目的难度。某些题目将以场景的形式出现，你可能需要结合多个领域的知识来推导出正确答案。一些非常特定的问题甚至涉及脚本编写，看起来会非常困难；然而，如果你只需记住协议、端口和基础网络知识，你通常可以迎刃解。\n\
  \n熟悉你的攻击方法，包括 `CSRF`、`CPP`、`HTTP response splitting`，当然还有 `XSS`、`SQL injection`\
  \ 和 `URL tampering`（以及其他所有）。确保在 `HTTP` 上花些时间并熟悉它。考试的另一个必知知识点是 `OWASP`——了解它是什么、它的作用，以及它的\
  \ Top 10 列表。\n\n## 练习\n\n**[1.]** 在 `Nmap` 中，可以使用 `http-methods` 脚本测试目标支持的潜在风险 HTTP\
  \ 选项。根据该脚本，以下哪些方法被认为是有风险的？\n\nA. `CONNECT`\nB. `GET`\nC. `POST`\nD. `HEAD`\n\n**[2.]**\
  \ 鲍收到通知，其环境中的一个系统似乎遭到了拒绝服务攻击。经过调查，鲍发现目标系统正在接收用于 IP 解析的海量 `DNS` 响应。以下哪种最可能是这种攻击？\n\
  \nA. `DNS amplification`\nB. `DNS server hijacking`\nC. `SSRF`\nD. `Metasploit NOPS\
  \ module`\n\n**[3.]** 一 Web 应用程序开发者想要对应用程序进行安全测试。以下哪种方法是通过随机生成的输入来使程序崩溃？\n\nA. `Fuzzing`\n\
  B. `Insploit`\nC. `Fing`\nD. `Injection`\n\n**[4.]** 以下哪项使用 HTML 实体来表示 `<script>`？\n\
  \nA. `&lt;script&gt;`\nB. `&#40;script;`\nC. `&amp;script;`\nD. `&quot;script&quot;`\n\
  \n**[5.]** 攻击者通过电子邮件欺骗用户访问恶意网站。用户点击邮件并在访问网站时，与银行保持着活动会话。以下哪项描述了这种攻击？\n\nA. `CSP`\n\
  B. `XSS`\nC. `CSRF`\nD. `Hidden form`\n\n**[6.]** 以下哪项被 SOAP 服务使用？\n\nA. `Unicode`\n\
  B. `HTML entities`\nC. `NTFS`\nD. `XML`\n\n**[7.]** 一 Web 应用程序开发者在发布前讨论了新应用程序中发现的安全问题。他建议团队修改应用程序，以确保用户不允许输入\
  \ HTML。这属于防止？\n\nA. `Cross-site scripting`\nB. `Cross-site forgery`\nC. `Parameter\
  \ pollution`\nD. `Phishing`\n\n**[8.]** 以下哪项是常见的漏洞？\n\nA. `SQL injection`\nB. `XSS`\n\
  C. `XML denial service`\nD. `CGI manipulation`\n\n**[9.]** 某软件的源代码在使用 `fgets()`\
  \ 的使用了大量的 `gets()`。该软件容易受到哪种攻击？\n\nA. `SQL injection`\nB. `Buffer overflow`\nC.\
  \ `Parameter tampering`\nD. `Cookie manipulation`\n\n**[10.]** 对于 XSS，以下哪项是最佳选择？\n\
  \nA. `Challenge tokens`\nB. `Memory use`\nC. `HttpOnly flag in cookies`\nD. `Removing\
  \ hidden fields`\n\n**[11.]** 你在检查日志时发现了这个 URL：\n`http://www.example.com/template%2e%2e%2e%2e%2e%2f%2e%2f%65%74%63%2f%77`\n\
  \n以下哪项最能描述这种潜在攻击？\n\nA. 这是 SSL 握手的返回。\nB. 攻击者似乎在使用 Unicode。\nC. 这似乎是一个缓冲区溢出尝试。\n\
  D. 这似乎是一个 XSS 尝试。\n\n**[12.]** 哪条 MSFconsole 命令允许在控制台内连接主机？\n\nA. `pivot`\nB. `connect`\n\
  C. `get`\nD. `route`\n\n**[13.]** 在测试 SQL 注入漏洞时，哪个字符是你的最佳选择？\n\nA. `@` 符号\nB. 双连字符\n\
  C. `+` 号\nD. 单引号\n\n**[14.]** 组织的一个愤怒的前员工发现了一个存在 SQL 注入的 Web 表单。使用注入字符串 `SELECT\
  \ * FROM Orders_Pend WHERE Location_City = 'Orlando'`，他能够看到奥兰多所有的等待订单。如果他想彻底删除 `Orders_Pend`\
  \ 表，他应该使用哪种 SQL 注入字符串？\n\nA. `SELECT * FROM Orders_Pend WHERE Location_City = Orlando';DROP\
  \ TABLE Orders_Pend --`\nB. `SELECT * FROM Orders_Pend WHERE 'Orlando';DROP_TABLE\
  \ --`\n\n\n\n\n\nC. `DROP TABLE Orders_Pend WHERE 'Orlando = 1' --`\n\nD. `WHERE\
  \ Location_City = Orlando'1 = 1': DROP_TABLE --`\n\n---\n\n### 15. 尝试从目标网站获取信息产生了以下错误消息：\n\
  \n![Image](img/f0154-01.jpg)\n\n下列哪项最准确描述了该错误消息？\n\nA. 该网站可能受到 XSS 攻击。\nB. 该网站可能受到缓冲区溢出攻击。\n\
  C. 该网站可能受到 SQL 注入攻击。\nD. 该网站可能受到恶意软件注入攻击。\n\n### 16. 攻击者发现了一个法的用户名 (`user1`)，并在网页表单验证窗口中输入了以下内容：\n\
  \n![Image](img/f0142-01.jpg)\n\n下列哪种攻击最可能是正在尝试？\n\nA. SQL 注入\nB. LDAP 注入\nC. URL\
  \ 篡改\nD. DHCP 放大\n\n### 17. 下列哪项是 Web 服务器将用户请求传递给应用程序并接收数据以转发给用户的标准方法？\n\nA. SSI\n\
  B. SSL\nC. CGI\nD. CSI\n\n### 18. 攻击者执行了 SQL 注入攻击但没有收到任何返回。随后她继续发送多个 SQL 查询，以获取\
  \ TRUE 或 FALSE 的响应。正在执行哪种攻击？\n\nA. 盲注 SQL 注入\nB. SQL 拒绝服务\nC. SQL 代码操控\nD. SQL 重放\n\
  \n### 19. 测试人员正在尝试 CSPP 攻击。下列哪项是她最可能结合攻击使用的字符？\n\nA. ;\nB. :\nC. ‘\nD. ”\nE. --\n\
  F. ~\n\n### 20. 攻击者正试图通过 Java 或或其他函数，通过未验证的输入在机器上提升权限，导致服务器执行恶意代码并提供命令行访问。下列哪项最准确地描述了这一行为？\n\
  \nA. Shell 注入\nB. 文件注入\nC. SQL 注入\nD. URL 注入\n\n### 21. 攻击者成功利用 XSS 攻击期间窃取的 cookie，在服务器的无效会话期间通过强制\
  \ Web 应用程序对 cookie 内容进行操作。这是如何可能的？\n\nA. Cookie 可以在任何时候重放，无论情况如何。\nB. 加密是在应用层使用单个密钥完成的。\n\
  C. 验证是通过 XML 完成的。\nD. 加密是在网络层完成的。\n\n### 22. HTML 表单包含几种往传输数据的方法。在表单内部，下列哪项将输入编码为统一资源标识符\
  \ (URI)？\n\nA. HEAD\nB. PUT\nC. GET\nD. POST\n\n### 23. 攻击者正在查看一个目标网站，并查看 `http://www.anybiz.com/store.php?id=2`\
  \ 的商店账户。他随后输入了以下 URL：\n\n`http://www.anybiz.com/store.php?id=2 and 1=1`\n\n网页加载正常。然后他又输入了以下\
  \ URL：\n\n`http://www.anybiz.com/store.php?id=2 and 1=2`\n\n出现了一个显示“发生错误”的通用页面。关于这些操作，下列哪项陈述是正确的？\n\
  \nA. 该网站易受到跨站脚本攻击。\nB. 该网站易受到盲注 SQL 注入攻击。\nC. 该网站易受到缓冲区溢出攻击。\nD. 该网站不受 SQL 注入攻击的影响。\n\
  \n### 24. 关于 Webgoat，下列哪项陈述*不是*正确的？\n\nA. WebGoat 由 OWASP 维护并提供。\nB. WebGoat 只能安装在\
  \ Windows 上。\nC. WebGoat 基于黑盒测试理念。\nD. WebGoat 可以使用 Java 或 .NET。\n\n### 25. 攻击者正在查看一篇显示新闻故事并请求评论的博客文章。在评论字段中，攻击者输入了以下内容：\n\
  \n`Nice post and a fun read<script>onload=window.location='http://www.badsite.com'</script>`\n\
  \n攻击者正试图执行什么？\n\nA. 对博客底层数据库的 SQL 注入攻击\nB. 跨站脚本攻击\nC. 缓冲区溢出 DoS 攻击\nD. 文件注入 DoS\
  \ 攻击\n\n### 26. 下列哪项是攻击者利用 Shellshock 漏洞常用的方法之一？\n\nA. SSH 暴力破解\nB. CSRF\nC. 表单字段输入操控\n\
  D. 通过利用 CGI（通用网关接口）的 Web 服务器\n\n### 27. 你正在检查网站文件并发现以下文本文件：\n\n![Image](img/f0144-01.jpg)\n\
  \n关于该文件的下列哪项陈述是正确的？\n\nA. 防止所有网络爬虫索引 listing.html 页面。\nB. 防止所有网络爬虫索引网站上的所有页面。\n\
  C. 防止 Googlebot 索引 listing.html 页面。\nD. 防止 Googlebot 索引网站上的所有页面。\n\n---\n\n## 答案解析\n\
  \n1. 在 Nmap 中，http-methods 脚本可用于测试目标的潜在风险选项。根据该脚本，哪些方法会被考虑？\n\nA. CONNECT\nB. GET\n\
  C. POST\nD. HEAD\n\n**A.** http-methods 脚本的使用语法为 `nmap --script http-methods <target>`，其中\
  \ `<target>` 是目标系统的 IP。根据 Nmap 的支持页面（[`nmap.org/nsedoc/scripts/http-methods.html`](https://nmap.org/nsedoc/scripts/http-methods.html)），此脚本“通过发送\
  \ OPTIONS 请求发现 HTTP 服务器支持的选项并列出潜在风险方法。它测试未在 OPTIONS 头中提到的方法并查看其是否被实现。除了 501/405\
  \ 之外的任何输出都表示该方法不在 400 到 600 范围内。如果响应在该范围内，则将其与随机生成的方法的响应进行比较。在此脚本中，“潜在风险”方法是指除 GET、HEAD、POST\
  \ 和 OPTIONS 之外的所有方法。”你还可以使用附加参数（如 `url-path`）来进一步优化结果。例如，上述语法显示 PUT 为风险方法的输出可能如下所示：\n\
