  ## 9. 攻击者正在使用 Shodan 搜索目标上的设备。她输入以下字符串进行搜索：`webcam geo:\"-85.97,31.81\"`。下列哪项正确描述了这一操作？\n\
  \n**A.** 搜索字符串错误。\n**B.** 攻击者正在搜索序列号在 3181 到 8597 之间的摄像头。\n**C.** 攻击者正在搜索以 `geo`\
  \ 开头的摄像头制造商。\n**D.** 攻击者正在搜索地理位置位于 `-31.80, 85.95`（经纬度）的摄像头。\n\n## 10. 下列哪种是 IoT\
