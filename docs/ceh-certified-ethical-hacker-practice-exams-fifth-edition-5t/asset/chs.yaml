- "# CEH 认证道德黑客考试实践指南，第五版\n\n\n\n\n# 作者简介\n\n`Matt Walker` 目前从事网络安全和网络管理领域的多个合同工作。作为一名拥有\
  \ 20 多年经验的 IT 安全与教育专业人士，他曾担任德国拉姆斯坦空军基地（Ramstein AB）网络培训中心主任，以及思科网络学院的课程负责人/高级讲师；他还曾担任\
  \ NASA 安全网络系统（NSS）的网络工程师，负责为该机构安全数据、语音和视频网络的设计与维护。Matt 还曾担任过阿拉拉巴马州汉斯维尔 Dynetics,\
  \ Inc. 公司的讲师主管和高级讲师，为 (ISC)2、思科和 CompTIA 提供现场认证课程。在两年后，他回到 NASA 担任马歇尔太空航天中心 UNITeS（SAIC）的\
  \ IT 安全经理。他曾为 NASA、空军教育与训练司令部以及美国空军编写并贡献了许多技术培训书籍，并在商业领域持续培训并编写认证及大学水平的 IT 和信息保证（IA）安全课程。\n\
  \n## 关于技术编辑\n\n`Brad Horton` 目前在美国国防部担任情报专家。Brad 曾在私营和公共部门担任过安全工程师、商业安全顾问、渗透测试员和信息系统研究员。这包括与多家防务承包商合作，如\
  \ General Dynamics C4S、SAIC 和 Dynetics, Inc.。Brad 目前持有认证信息系统安全专业人员（CISSP）、CISSP\
  \ 信息系统安全管理专业人员（CISSP-ISSMP）、认证道德黑客（CEH）和认证信息系统审计师（CISA）职业认证。Brad 拥有阿拉巴马大学的商业与工商管理学士学位、汉斯维尔阿拉巴马大学（UAH）的信息系统管理硕士学位以及\
  \ UAH 的信息保证研究生证书。在不玩黑时，Brad 可以在家里与家人在一起，或者在当地的高尔夫球场。\n\n\n\n\n\n\n\n\n\n\n\n\n\n\
  我将本书献给我的父亲 Ronald Walker (1947–2008)。他是我见过的最好的人，第二名甚至差远。我想念你了，爸爸。\n\n—Matthew Walker\n\
  \n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n## 致谢\n\n我和你们大多数人一样，过去几乎不读书的致谢部分。当我买书时，我只想进入核心内容，看看我能从中挖掘出什么——无论是智力上的还是娱乐上的——完全不在乎作者对那些帮助完成这本书的人是怎么想的。然而，在所有事情中，我竟然*写*了一本书。\n\
  \n现在，我会阅读购买的*每一本*书的致谢部分。为什么？因为在经历了写作、编辑、争论、计划、研究、重写、对着显示器大吼以及重新来过这一切种种折磨后，我理解了为什么这如此重要。当作家说“如果没有*某人*我就无法完成”时，我知道这意味着什么。相信我，如果那里写了，那么作者是真的意味着他们*没有他们就无法完成*。不过，我的*填空者们*不仅仅应该在致谢中被提一下那么，因为他们真的让这一切成为了可能，而我确实没有他们是绝对无法完成的。\n\
  \n我不尽的感激和由衷的谢意向 McGraw Hill 的整个团队。Tim Green 几年前最初拉我加入了这个项目，如果没有他，我根本不会想过要做它。Caitlin\
  \ Cromley-Linn 和 Lisa McClain 提供了每个作者完成此类产品所需的坚定指导（好吧，可能不是每位作者，但我确实需要），在整个过程中展现了像约伯般的耐心，并具有极好的幽默感。她们都值得去某个温暖的海滩度假——由我来请第一轮冰镇的成年饮料。再次感谢\
  \ McGraw Hill 的所有人，让我有机会做我深爱热爱的事情，并感谢你们在整理这些内容时对我的耐心。\n\n最后，我无法对技术编辑 Brad Horton\
  \ 尽表感谢。Brad 让一个困难的过程——在技术上对所有内容进行清理以确保其一切井井有条——不仅可以忍受，而且变得非常有趣。他的编辑非常精准，始终旨在让这个项目达到最佳状态。当我出错时，他不仅指出了纠正之处，还对这本书的现实方面增添了无法估量的价值。没有他，我简直无法，*绝不会*完成这件事。与他合作是我的荣幸，称他为朋友是我生活中的巨大福气。\n\
