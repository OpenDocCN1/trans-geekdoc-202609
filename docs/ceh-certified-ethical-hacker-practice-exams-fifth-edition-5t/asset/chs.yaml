  \ 在 IoT 架构中，下列哪项负责路由和识别？\n\n**A.** 边缘层（Edge layer）\n**B.** 接入网关层（Access Gateway\
  \ layer）\n**C.** 网络层（Internet layer）\n**D.** 中间件层（Middleware layer）\n\n## 12. 一位主通过手机上的\
  \ App 为电视设置视图。正在使用的是哪种通信模型？\n\n**A.** 设备到网关（Device-to-gateway）\n**B.** 后端共享（Back-end\
  \ sharing）\n**C.** 设备到云（Device-to-cloud）\n**D.** 设备到设备（Device-to-device）\n\n## 13.\
