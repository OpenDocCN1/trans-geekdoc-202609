  \ 以下哪些工具可以帮助规避 IDS（入侵检测系统）？（多选）\n\n**A.** Whisker\n**B.** Fragroute\n**C.** Capsa\n\
  **D.** Wireshark\n**E.** ADMmutate\n**F.** Inundator\n\n![Image](img/r.jpg)\n**A,\
  \ B, E, F.** 规避 IDS 主要取决于以下几种方法：加密、洪水攻击和分段（会话拼接）。`Whisker` 是一个 HTTP 扫描工具，但它具有构建会话拼接分段的能力。`Fragroute`\
  \ 拦截、修改并重写发往指定主机的出站流量，并用于将攻击载荷分在多个数据包中。`ADMmutate` 可以创建多个不会被签名文件轻易识别的脚本，而 `Inundator`\
  \ 是一种洪水攻击工具，可以帮助你躲在掩护火力火中。\n\n![Image](img/w.jpg)\n**C** 和 **D** 是错误的，因为 `Capsa`\
  \ (Colasoft) 和 `Wireshark` 都是嗅探器。\n\n### 24. 一位安全管理员试图“锁定”她的网络，并封锁除了 TCP 80 和 TCP\
  \ 443 之外的所有外部防火墙端口的内部到外部访问。一个内部用户想要利用其他协议访问远程系统上的服务（FTP 以及一些非标准端口号）。在以下选项中，用户通过其选择的协议与远程系统通信最可能的尝试是哪个？\n\
  \n**A.** 使用 HTTP 隧道。\n**B.** 使用 UDP 代替 TCP 发送所有流量。\n**C.**破解防火墙并打开通信所需的端口。\n**D.**\
  \ 对连接防火墙的交换机进行 MAC 泛。\n\n![Image](img/r.jpg)\n**A.** 如果你恰好拥有 *CEH Certified Ethical\
  \ Hacker All-in-One Exam Guide, Fifth Edition*（这本练习题集的配套书籍），你无疑已经意识到我一直在强调，在现实世界中，协议并不一定绑定到特定的端口号。当然，`FTP`\
  \ 应该在 `TCP` 端口 `21` 上，`SMTP` 应该运行在 `25` 端口上，`Telnet` 应该在 `23` 端口上，但残酷的实实是*它们并不非如此*。一个\
  \ `HTTP tunnel` 就是这种技术的绝佳例子。对于防火墙和其他所有观察者来说，来自你机器的流量正通过无害的旧端口 `80` 运行——大家看，没什么好玩的，只是普通的\
  \ HTTP 流量。但看一眼那个无害的小隧道内部，你会发现你可以运行*任何你想运行的内容*。通常，你通过端口 `80` 连接到外部服务器，一旦你绕过了那个讨厌人的防火墙，它就会替你解包并转发你的其他协议流量。\n\
  \n![Image](img/w.jpg)\n**B** 是错误的，因为，嗯，这就是一个荒谬的答案。`UDP` 端口像 `TCP` 端口一样被防火墙过滤，所以只发送\
  \ `UDP` 是没有用的。\n\n![Image](img/w.jpg)\n**C** 是错误的，虽然这确实能允许通信，但持续不了多久。网络上的每个传感器都会尖叫，而那个快乐的安全管理员会尽快将其重新锁定。更不用说，该用户会被开除。\n\
  \n![Image](img/w.jpg)\n**D** 是错误的，因为 MAC 泛是指在交换机上进行主动嗅探，而不是绕过防火墙。\n\n### 25. 一位道德黑客被分配扫描一个服务器，并希望避免\
  \ IDS 检测。她使用了一种策略，将 TCP 头部拆分成许多数据包，使得难以检测这些数据包的意图。以下哪项最能描述所采用的技术？\n\n**A.** TCP\
  \ 扫描\n**B.** IP 分段扫描\n**C.** ACK 扫描\n**D.** 反向 TCP 扫描\n\n![Image](img/r.jpg)\n**B.**\
  \ 尝试规避 IDS 有多种方法，`IP fragment scan` 是其中之一。它通过将原始 `TCP` 头部拆分成多个较小的数据包来工作。这些较小的数据包单独对\
  \ `IDS` 来说毫无意义，但在目的地重组后可以进行扫描（这并不是说这种方法总是有效——几乎没有什么东西是无懈可击的——但我几乎可以保证你在某处会看到这种规避技术）。\n\
  \n**A, C** 和 **D** 都是错误的，原因相同：所使用的扫描*类型*与题目询问的规避方法无关。将头部拆分段规避方法适用于任何扫描类型。\n\n# 第\
  \ 5 章\n## 攻击系统\n\n本章包含以下主题的问题：\n\n- 描述 CEH 攻击方法论和系统攻击步骤\n- 描述用于获取访问的方法\n- 描述用于权限提升的方法\n\
  - 描述用于维持访问的方法\n- 描述证据清除的方法\n- 识别 rootkit 的功能和类型\n\n\n\n\n接下来，在这一章中，你真的需要更好地了解 Linux。不，我是认真的——你需要更深入地了解\
  \ Linux 命令行。关于 Linux 的问题很可能围绕内核模块、文件结构、存储位置和命令行界面展开。再次，学习所有这些最简单的方法是下载一个 Linux 发行版并在你机器的虚拟机（VM）中运行它。利用互联网上可以找到数千个\
  \ Linux 教程视频和文章：在书上看是一回事，但如果你亲自操作，学到的会多得多。\n\n## 习题\n\n**1.** 你正在检查当天渗透测试活动的日志，并在\
  \ Windows 10 机器上注意到以下条目：\n\n![Image](img/f0113-01a.jpg)\n\n关于此条目，以下哪种说法是正确的？\n\n\
  **A.** 团队成员添加了一个用户账户。\n\n**B.** 团队成员将他的登录切换到了另一个用户的登录。\n\n**C.** 团队成员更改了用户的密码。\n\
  \n**D.** 团队成员重命名了一个用户账户。\n\n**2.** Amanda 在一家大型机构担任安全管理员。她发现服务器上安装了一些远程工具，且没有任何请求这些工具的变更请求记录。经过调查，她发现了一个未知的\
  \ IP 地址连接，该连接可以通过一个未关闭的高端口访问网络。该 IP 地址首先被追溯到墨西哥的一个代理服务器。进一步调查显示，连接在许多地点的几个代理服务器之间跳转。攻击者用于掩盖踪迹的最可能的代理工具是哪个？\n\
  \n**A.** ISA proxy\n\n**B.** IAS proxy\n\n**C.** TOR proxy\n\n**D.** Netcat\n\n\
  **3.** 在一次应急响应期间提取了以下 `HOSTS` 文件：\n\n![Image](img/f0113-01.jpg)\n\n![Image](img/f0114-01.jpg)\n\
  \n以下哪种描述最符合 `HOSTS` 文件？\n\n**A.** 尝试访问 [mybank.com](https://www.mybank.com) 查看银行账户的用户将被重定向到一个中国\
  \ IP 地址。\n\n**B.** 机器上尝试访问 [google.com](https://www.google.com) 的用户将收到 HTTP 400\
  \ 错误码。\n\n**C.** 机器上尝试访问 [gmail.com](https://www.gmail.com) 的用户将重定向到本地主机。\n\n**D.**\
