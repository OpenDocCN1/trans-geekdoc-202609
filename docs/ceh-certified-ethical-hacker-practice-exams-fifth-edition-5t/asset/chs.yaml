  **B.** 蓝牙蓝结（BlueBorne）\n**C.** 侧信道攻击（Side channel）\n**D.** 女巫攻击（Sybil）\n\n## 14.\
  \ 在列出的工具中，哪是快速发现网络上 IoT 设备 IP 地址的最佳选择？\n\n**A.** IoTInspector\n**B.** MultiPing\n\
  **C.** Z-Wave Sniffer\n**D.** beSTORM\n\n## 15. 2016 年 10 月，一次涉及数百万 IoT 设备的 DDoS\
