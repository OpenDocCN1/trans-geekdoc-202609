  \ Locky\n**D.** Mirai\n\n## 16. 下列哪些是防止 IoT 骇客的有效应对措施？\n\n**A.** 禁用访客账户。\n**B.**\
  \ 启用针对过度登录尝试的限制。\n**C.** 禁用 Telnet。\n**D.** 实施补丁管理并确保设备固件更新。\n\n## 17. 在 Zigbee\
