  \n**1.](#ch3.xhtml#ans1)** 你的团队受雇对名为 Matt’s Bait ’n Tackle 的公司（域名为 mattsBTshop.com）进行测试。一名成员运行了以下命令：\n\
  \n```\nmetagoofil -d mattsBTshop.com -t doc,docx -l 50 -n 20 -f results.html\n```\n\
  \n以下哪项最能描述该成员尝试做什么？\n\n**A.** 从 mattsBTshop.com 的网页中提取元数据，并以 Word 格式输出。\n\n**B.**\
  \ 从 mattsBTshop.com 的 results.html 页面中提取元数据，并以 Word 格式输出。\n\n**C.** 从 mattsBTshop.com\
  \ 发现的 Word 文档中提取元数据，并以 HTML 文件输出。\n\n**D.** 将 results.html 作为宏附件上传到 mattsBTshop.com\
  \ 发现的任何 Word 文档中。\n\n![Image](img/r.jpg)**C.** 这是工具知识和使用的良好示例。Metagoofil 根据 `[link](https://www.edge-security.com/metagoofil.php`，“是一种用于提取目标公司公开文档（.pdf,\
  \ .doc, .xls, .ppt, .docx, .pptx, .xlsx）元数据的信息收集工具。它在 Google 上执行搜索以识别并下载文档到本地磁盘，然后使用不同的库（如\
  \ Hachoir, PdfMiner 等）提取元数据。根据结果，它将生成包含用户名、软件版本以及服务器或机器名称的报告，这将有助于渗透测试人员在信息收集阶段工作。”\n\
  \n\n\n\n\n在给定的语法中，`Metagoofil` 将在 `mattsBTshop.com` 中搜索多达 50 个结果（`-l` 选项决定结果数量），用于它能找到任何\
  \ Microsoft Word 文档（包括 `.doc` 和 `.docx` 格式）。然后它将尝试下载找到的前 20 个（由 `-n` 选项处理），而 `-f`\
  \ 选项将把结果发送到你想去的地方（在本例中，到一个 HTML 文件）。\n\n这些结果会是什么呢？嗯，这正是有趣所在。记住，`Metagoofil` 尝试从该网站公开的\
  \ Microsoft Word 文档中提取元数据。你可能会在结果中发现电子邮件地址、文档路径、软件版本，甚至是用户名。\n\n![Image](img/w.jpg)`A`、`B`\
  \ 和 `D` 是错误的，因为它们与提供的语法不匹配。\n\n### 2.\n你正在作为评估的一部分运行多个枚举扫描。在其中一次特定的扫描中，你让 `nmap`\
  \ 发送一个初始的 `FIN` 包，紧接着发送一个 `ACK` 包。以下哪项最能描述你正在运行的扫描类型？\n\n**A.** 反向 TCP (Inverse\
  \ TCP)\n**B.** TCP Maimon\n**C.** XMAS\n**D.** 半关闭 (Half-closed)\n\n![Image](img/r.jpg)`B.`\
  \ 根据 `nmap` 关于扫描的文档（[`nmap.org/book/scan-methods-maimon-scan.html`](https://nmap.org/book/scan-methods-maimon-scan.html)），早在\
  \ 1996 年，一位名叫 Uriel Maimon 的先生写了一篇名为《无 SYN 标志的端口扫描》的文章。文章描述了发送一个初始 `FIN` 包随后跟随一个\
  \ `ACK` 包，利用 `TTL` 值之间的差异来评估端口。\n\nEC-Council `TCP Maimon` 放回了官方教材，显然想让你了解它。根据学习材料，如果端口是打开，你将得不到响应；但如果它处于关闭状态，你将收到一个\
  \ `RST` 包。\n\n![Image](img/w.jpg)`A` 是错误的，因为反向 TCP 扫描是带有或不带标志发送 TCP 探测标志的扫描。无响应表示开放端口，而\
  \ `RST` 则发送到关闭的端口。此扫描中通常使用的标志包括 `FIN`、`URG` 和 `PSH`。顺便提一下，如果不使用任何标志，也可以称为“空扫描 (null\
  \ scan)”。\n\n![Image](img/w.jpg)`C` 是错误的，因为 `XMAS 扫描` 是开启所有 TCP 标志（`FIN`、`URG`、`PSH`）的扫描。这种扫描对\
  \ Windows 系统无效，仅对使用基于 `RFC-793` 的 TCP 栈设备有效。\n\n![Image](img/w.jpg)`D` 是错误的，因为这种扫描类型不存在。\n\
  \n### 3.\n你准备好了一个僵尸系统并开始进行 `IDLE scan`。随着扫描的进行，你注意到从僵尸机器上收集到的碎片标识符正在随机递增。这意味着什么？\n\
  \n**A.** 你的 `IDLE scan` 结果对你没有用。\n**B.** 该僵尸系统是一个蜜罐机 (honeypot)。\n**C.** 你和僵尸机器之间存在一个异常的防火墙。\n\
  **D.** 这是 `IDLE scan` 期间的预期结果。\n\n![Image](img/r.jpg)`A.` `IDLE scan` 利用了僵尸机器和 IP\
  \ 递增碎片标识符 (`IPIDs`) 的特性。然而，在扫描期间，僵尸对所有其他流量保持空闲是至关重要的。攻击者将使用僵尸的（伪造）源地址向目标发送包。如果端口是打开的，目标将用\
  \ `SYN/ACK` 响应 `SYN` 包，但这会被发送给僵尸。僵尸系统将对这个未请求的 `SYN/ACK` 构造一个 `RST` 包，此时 `IPID` 就会增加。如果这种情况随机发生，那么可能你的僵尸实际上并不是空闲的，你的结果就是徒劳的。你看，如果它不空闲，就会杂乱地递增，因为来自设备的通信会肆无忌惮地到处发送。你依赖的是这台机器正在安静地执行你的指令——而不做其他任何事。\n\
  \n![Image](img/w.jpg)`B` 是错误的，因为没有足够的信息将僵尸机器识别为任何东西——更不用说设置为“蜜罐”的机器了。\n\n![Image](img/w.jpg)`C`\
  \ 是错误的，因为你和僵尸之间的防火墙对僵尸的 `IPIDs` 不产生任何影响。\n\n![Image](img/w.jpg)`D` 是错误的，因为这绝对不是\
  \ `IDLE scan` 期间的预期行为。预期行为是 `IPID` 随着每个发现的开放端口定期递增，而不是像活动系统上的流量那样随机增加。\n\n### 4.\n\
  你想对目标组织内的一个子网进行 ping 扫描 (ping sweep)。以下哪条 `nmap` 命令是你的最佳选择？\n\n**A.** `nmap 192.168.1.0/24`\n\
  **B.** `nmap -sT 192.168.1.0/24`\n**C.** `nmap -sV 192.168.1.0/24`\n**D.** `nmap\
  \ -P 192.168.1.0/24`\n\n![Image](img/r.jpg)`C.` `nmap` 中的 `-sV` 选项用于版本检测。\n\n![Image](img/w.jpg)`A`\
  \ 是错误的，因为不带选项的 `nmap` 默认会对整个子网进行 ping 扫描。\n\n![Image](img/w.jpg)`B` 是错误的，因为 `-sT`\
  \ 代表 TCP 连接扫描 (TCP Connect scan)，这是最慢但最可靠的扫描。\n\n![Image](img/w.jpg)`D` 是错误的，因为\
  \ `-P` 强制 nmap 即使被防火墙拦截也扫描。\n\n# 5.\n一名测试人员正在执行 banner 取 (banner grabbing) 并执行了以下命令：\n\
  \n```bash\nnmap -sV host.com -p 80\n```\n\n![Image](img/f0069-01.jpg)\n\n以下哪项是正确的陈述？\n\
  \n**A.** Nmap 无法执行 banner 取，因为它无法获取任何服务的版本号。\n**B.** 测试人员成功执行了 banner 取。\n**C.**\
  \ 使用 `nmap -O host.com` 对 banner 取来说是更好的选择。\n**D.** banner 取失败了，因为结果没有返回服务器版本。\n\
  \n![Image](img/r.jpg)`B.` 你可以预期考试中会有几道这类题。不仅有很多方法可以进行 banner 取，而且每种方法的输出都不同。在这种情况下，`nmap`\
  \ 的尝试成功识别了 Apache 服务器。\n\n![Image](img/w.jpg)`A` 是错误的，`nmap` 确实可以执行 banner 取。\n\n\
  ![Image](img/w.jpg)`C` 是错误的，因为 `-O` 标志启用 OS 检测。\n\n![Image](img/w.jpg)`D` 是错误的，因为没有版本号无关（通常即使\
  \ banner 取成功完成，Apache 节点也不会返回版本号）。\n\n\n\n\n\n例如，假设你不知道 TCP 端口 `631` 被互联网打印协议 (`IPP`)\
  \ 使用，但你确实知道 `53`、`88` 和 `445` 是干什么用的。突然之间，这就不那么难了（概率降到了 50/50）。顺便说一下，`631` 不会是你唯一监控的项，但在提供的选项中，它是最佳选择。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 `53` 是 `DNS`（`TCP` 和 `UDP`）使用的端口号。TCP 侧将用于跨互联网的流量，在这种情况下，由于连接型流量导致速度损失以确保数据交付是值得的，而\
  \ UDP 将主要用于内部。\n\n![Image](img/w.jpg) **B** 是错误的，因为 `88` 是 `Kerberos` 使用的端口号。\n\n\
  ![Image](img/w.jpg) **C** 是错误的，因为 `445` 用于微软 SMB 文件共享。你绝对会在考试的某处看到 SMB 文件共享和这个端口，通常作为像本题这类场景的一部分。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 `514` 是 `syslog` 使用的 (UDP) 端口号——相信我，你需要记住这个。EC-Council\
  \ 非常喜欢 `syslog`。你绝对会在考试中看到它几次。\n\n### 7.\n一位同事输入了以下命令：\n\n```\nroot@mybox: # hping3\
  \ -A 192.168.2.x -p 80\n```\n\n这里正在尝试什么？\n\n**A.** 使用 `hping3` 对单个地址的 `80` 端口进行\
  \ ACK 扫描\n\n**B.** 使用 `hping3` 对一组地址的 `80` 端口进行 ACK 扫描\n\n**C.** 使用 `hping3` 对单个地址的\
  \ `80` 端口进行地址验证\n\n**D.** 使用 `hping3` 对一组地址的 `80` 端口进行地址验证\n\n![Image](img/r.jpg)\
  \ **B.** `Hping` 是一个非常棒的工具，提供了多种选项。你可以用它构建数据包、审计和测试防火墙，并用它进行各种疯狂的中间人攻击。在这个示例中，你只是在整个\
  \ C 类子网上使用端口 `80`（`-p 80`）执行基础的 ACK 扫描（使用 `-A` 关位）（地址中的 `x` 遍历了所有 254 种可能）。最新版本的\
  \ `Hping3` 是可脚本的（`TCL` 语言），并实现了一个允许用人类可读描述描述 TCP/IP 包的引擎。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为该语法针对整个子网（或者说，从技术角度具体来说，针对所有以 `192.168.2` 开头的 254 个地址）。最后一个字节中的 `x`\
  \ 告诉 `hping` 向所有这些可用地址发送数据。\n\n![Image](img/w.jpg) **C** 和 **D** 都是错误的，因为“地址验证”并不是扫描类型。\n\
  \n### 8.\n你正在检查主机之间的流量，并注意到以下交换：\n\n![Image](img/f0071-01.jpg)\n\n关于此流量，以下哪些说法是正确的？（选择所有适用项）\n\
  \n**A.** 它看起来是 ACK 扫描的一部分。\n\n**B.** 它看起来是 XMAS 扫描的一部分。\n\n**C.** 它看起来端口 `4083`\
  \ 是开启的。\n\n**D.** 它看起来端口 `4083` 是关闭的。\n\n![Image](img/r.jpg) **B, D.** 考试会以很多很多种方式让你定义扫描类型。它可能是一个简单的定义匹配；有时它将是疯狂的\
  \ Wireshark 或 `tcpdump` 列表。在这个示例中，你看到一个清理后的流量交换，显示来自一个主机的包一个接一个发送到第二个主机，表明这是一个扫描尝试。数据包设置了\
  \ `FIN`、`URG` 和 `PSH` 标志，这告诉你是 XMAS 扫描。如果目标端口是开启的，你将接收不到任何返回；如果它是关闭的，你将看到 `RST/ACK`。这告诉你端口\
  \ `4083` 看起来是关闭的（参见响应的第四行）。补充一下，你知道为什么它被称为 XMAS 扫描有两个原因吗？第一是因为它像圣诞树一样点亮 IDS，第二是因为标志位本身都是亮起的。顺便说一下，你可能在现实世界中看不到这种操作，因为它的真的没有太大适用性。但在你的考试中？噢，是的——它会出现在那里。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为没有迹象表明这是 ACK 扫描。ACK 扫描只设置了 `ACK` 标志，通常用于防火墙过滤器测试：无响应意味着存在防火墙，`RST`\
  \ 意味着防火墙不存在（或端口未被过滤）。\n\n![Image](img/w.jpg) **C** 是错误的，因为你确实收到了端口的回答（在捕获的第四行发送了\
  \ `RST/ACK`）。\n\n### 9.\n你正在检查流量并注意到 ICMP 类型 `3` 代码 `13`。这表示什么？\n\n**A.** 网络不可达。\n\
  \n**B.** 主机未知。\n\n**C.** 拥控制。\n\n**D.** 行政禁止。\n\n![Image](img/r.jpg) **D.** ICMP\
  \ 消息由路由器生成，告知源目标不可达。类型 `3` 代码 `13` 表示“行政禁止”，这发生在防火墙过滤流量时。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为“网络不可达”是类型 `3` 代码 `0`。目标没有路由。\n\n![Image](img/w.jpg) **B** 是错误的，因为“主机未知”是类型\
  \ `3` 代码 `7`。路由表中没有项。\n\n![Image](img/w.jpg) **C** 是错误的，因为“拥控制” ICMP 是类型 `4`。\n\n\
  ### 10.\n哪种端口扫描方法的风险最大但提供了最可靠的结果？\n\n**A.** 全连接\n\n**B.** 半开放\n\n**C.** 空扫描\n\n\
  **D.** XMAS 扫描\n\n![Image](img/r.jpg) **A.** 全连接扫描针对你目标的端口执行整个 TCP 三次握手。它很大且容易被发现，但结果不可可靠。顺便说一下，`nmap`\
  \ 中的 `-sT` 关运行全连接扫描（你应该直接记住这个）。\n\n![Image](img/w.jpg) **B** 是错误的，因为半开放扫描涉及发送 `SYN`\
  \ 包并观察响应。它的设计是为了隐蔽，但可能会被 IDS 传感器（网络和基于主机的 IDS）捕捉。\n\n![Image](img/w.jpg) **C** 是错误的，因为空扫描发送没有任何标志的数据包。响应将取决于操作系统和版本，因此可靠性参差不齐。顺便说一下，空扫描针对\
  \ Unix/Linux 设计，在 Windows 系统上不起作用。\n\n![Image](img/w.jpg) **D** 是错误的，尽管 XMAS 扫描很容易被检测到（正如我们的技术编辑所说，“一个训练有的猴子都能看到它”），但结果往往难以捉摸。XMAS\
  \ 扫描对于考试题很有用，但在现实世界中只会带来冷落以鼻和立即断开连接。\n\n### 11.\n随着对某大型国际企业的渗透测试进行，一位同事在 DMZ 子网上发现了一台\
  \ IIS 服务器和一台邮件服务器。你回顾了当天早些时候对该子网进行的 ping 扫描，注意到没有机器对 ping 做出响应。无响应的最可能原因是什么？\n\n\
  **A.** 主机可能已关闭或断开。\n\n**B.** ICMP 被过滤了。\n\n**C.** 目标网络可能宕机了。\n\n**D.** 服务器是 Linux\
  \ 且不响应 ping 请求。\n\n\n\n\n\n![Image](img/r.jpg) **B.** 诚然，这道题有点棘手，而且是的，我特意这样写（主要是因为我以前见过类似的问题）。这里的关键在于“最可能”这个标识符。完全有可能——我敢说，甚至是*预期之中*——那两台重要机器的系统管理员会确保过滤掉\
  \ ICMP。在提供的选项中，这一个是最可能的解释。\n\n![Image](img/w.jpg) **A** 是错误的，但仅是因为有一个更好的答案。这是一家大公司，无疑在全天任何时段与全球的客户和员工进行业务（题目确实说明了这是一家国际性业务）。这两台服务器都宕机了是否可能？当然，你可能你的\
  \ ping 扫描时间点得非常糟糕，恰好碰上了维护窗口之类的，但这种可能性极小。\n\n![Image](img/w.jpg) **C** 是错误的，因为坦率地说，在你进行渗透测试时，整个\
  \ DMZ 子网掉线的概率微乎其微。我可以向你保证，如果子网在你测试期间真的掉了，那么你的测试就结束了。\n\n![Image](img/w.jpg) **D**\
  \ 是错误的，因为这根本不是事实。\n\n### 12.\n一名团队成员正在使用 `nmap` 并询问关于工具中的“脚本引擎”。可以使用哪些选项来调用 `nmap`\
  \ 脚本引擎？（选择两项。）\n\n* **A.** `--script`\n* **B.** `-z`\n* **C.** `-sA`\n* **D.** `-sC`\n\
  \n![Image](img/r.jpg) **A, D.** Nmap 是一个强大的扫描工具，提供了许多选项，你必须非常熟悉其语法。NSE（Nmap 脚本引擎）是该工具的一部分，允许在扫描中使用脚本。直接摘自\
  \ nmap 官网（[`nmap.org/book/nse.html`](https://nmap.org/book/nse.html）：“NSE 通过 `-sC`\
  \ 选项激活（如果你想指定一组自定义脚本，则使用 `--script`），结果会集成到 Nmap 的普通输出和 XML 输出中。”\n\n我在其他学习材料中看到过，`-A`\
  \ 选项也被视为 NSE 函数。该选项开启扫描并报告版本检测、操作系统指纹识别以及其他各种活动。`nmap` 选项的一个很好的总结位于 [https://nmap.org/book/port-scanning-options.html](https://nmap.org/book/port-scanning-options.html)。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为 `-z` 不是 `nmap` 选项。\n\n![Image](img/w.jpg) **C**\
  \ 是错误的，因为 `-sA` 选项运行的是 ACK 扫描（向端口发送 ACK 报段以确定其状态）。\n\n### 13.\n在 Linux 机器上尝试可靠地列出进程及其关联的\
  \ UID 时，以下哪个命令是最佳选择？\n\n* **A.** `ls`\n* **B.** `chmod`\n* **C.** `pwd`\n* **D.**\
  \ `lsof`\n\n![Image](img/r.jpg) **D.** 在大多数 Unix 类变体中都支持，“列出打开的文件”命令 (`lsof`) 提供了所有打开的文件以及打开这些文件的进程列表。`lsof`\
  \ 命令描述了（其他其他）打开文件的进程标识符 (PID)、进程正在执行的命令以及进程的所有者。带有可选选项，你还可以接收各种额外信息。顺便提一下，`ps` 命令（用于进程状态）可能是完成列出任务更好的选择。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 `ls`（列出）仅仅是显示当前目录下的所有文件和文件夹。它在 PC 世界中的对应命令是\
  \ `dir`。\n\n![Image](img/w.jpg) **B** 是错误的，因为 `chmod` 用于设置 Linux 中文件和对象的权限。\n\n\
  ![Image](img/w.jpg) **C** 是错误的，因为 `pwd`（打印工作目录）是一个用于显示你当前工作所在目录的命令。\n\n### 14.\n\
  你想在 Windows Server 机器上显示活动和非活动的服务。以下命令中哪一个执行此服务任务的效果最好？\n\n* **A.** `sc query`\n\
  * **B.** `sc query type=all`\n* **C.** `sc query type=service`\n* **D.** `sc query\
  \ state= all`\n\n![Image](img/r.jpg) **D.** `sc` 命令绝对会在考试中出现一两次。根据微软的介绍，`SC.exe`\
  \ 获取并设置有关服务的控制信息。你可以使用 `SC.exe` 对服务程序进行测试和调试。存储在注册表中的服务属性可以控制服务应用程序如何在启动时启动以及作为后台进程运行。`SC.exe`\
  \ 参数可以配置特定服务、检索服务的当前状态，以及停止和启动服务。\n\n以下是 `sc` 命令的一些用法示例：\n\n* `sc config` 确定服务在系统启动时的状态，并将服务设置为自动、手动运行或不运行。\n\
  * `sc query` 显示有关服务、驱动程序以及这两者的类型信息。如果没有参数，它会返回列表。\n* `sc query state= all` 显示所有服务。\n\
  * `sc start` 启动服务。\n* `sc stop` 停止服务。\n* `sc pause` 暂停服务。\n* `sc continue` 继续服务。\n\
  * `sc enum` 列出服务。\n* `sc qc` 显示配置。\n\n最后还有一点：记住等号*后面*要有一个空格，而不是前面。\n\n![Image](img/w.jpg)\
  \ **A, B,** 和 **C** 在此题语法上都是错误的。\n\n### 15.\n管理员在 Linux 系统上输入以下命令：\n\n`iptables\
  \ -t nat -L`\n\n以下哪项最符合该命令的意图？\n\n* **A.** 管理员正在尝试端口扫描。\n* **B.** 管理员正在配置伪装。\n*\
  \ **C.** 管理员正在准备泛洪。\n* **D.** 管理员正在准备 DOS 攻击。\n\n![Image](img/r.jpg) **B.** 还记得网络地址转换吗？它是一种巧妙的技术，允许使用不可路由私有地址的内部主机通过路由器或其他系统管理的单一地址（或一组地址）访问互联网。IP\
  \ 伪装与之类似，只是通过 Linux 主机实现的。简而言之，Linux 机器可以通过适当的路由、使用一个网卡与内部通信并在另一个与外部通信来作为 NAT 翻译器。\n\
  \n查看该命令的手页（可以在 [`ipset.netfilter.org/iptables.man.html`](http://ipset.netfilter.org/iptables.man.html)\
  \ 找到），我们看到 iptables 是 IPv4 数据包过滤和 NAT 的管理工具。根据手页描述，“iptables 用于设置、维护和检查 Linux 内核中的\
  \ IPv4 过滤表。可以定义多个不同的表。”每个表包含许多内置链，可以通过 `iptables -t *tablename* -*switch` 启用，其中\
  \ tablename 是 filter、nat、mangle、raw 或 security，switch 是你想启选项。例如，`-A` 追加规则，`-D` 删除规则，`-R`\
  \ 替换规则。\n\n![Image](img/w.jpg) **A, C,** 和 **D** 都是错误的，因为它们没有准确代表尝试的操作。\n\n### 16.\n\
  使用以下命令正在尝试什么？\n\n`nc -u -v -w2 192.168.1.100 1-1024`\n\n* **A.** 针对单一地址端口 1–1024\
  \ 的全连接扫描\n* **B.** 针对子网端口 1–1024 的全连接扫描\n* **C.** 针对单一地址端口 1–1024 的 UDP 扫描\n* **D.**\
  \ 针对子网端口 1–1024 的 UDP 扫描\n\n\n\n\n\n![Image](img/r.jpg) **C.** 在此示例中，`netcat` 被用于对\
  \ 1 到 1024 的 UDP 端口进行扫描（`-u` 切换开关表明了这一点）。提供的地址是单个地址，而不是子网。此处使用的其他切换开关包括 `-v`（详细模式）和\
  \ `-w2`（定义连接超时时间为两秒，`netcat` 将在此等待响应）。\n\n![Image](img/w.jpg) **A** 是错误的，因为 `-u`\
  \ 切换开关显示这是一个 UDP 扫描。在默认情况下（即不使用任何切换开关），`netcat` 以 TCP 模式运行。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 `-u` 切换开关显示这是一个 UDP 扫描。此外，此命令针对的是单个地址，而不是子网。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为此命令针对的是单个地址，而不是子网。\n\n### 17. 你被要求监控数据包捕获以查看任何尝试的 DNS 区域传输。你应该关注哪个端口？\n\
  \n**A.** TCP 22\n**B.** TCP 53\n**C.** UDP 22\n**D.** UDP 53\n\n![Image](img/r.jpg)\
  \ **B.** DNS 在 UDP 和 TCP 中都使用 53 端口。UDP 的 53 端口用于 DNS 查询。区域传输通过 TCP 的 53 端口完成。考虑到\
  \ TCP 提供的可靠性和纠错能力，这完全符合逻辑。\n\n![Image](img/w.jpg) **A** 是错误的，因为 TCP 22 端口分配给 SSH，而不是\
  \ DNS。\n\n![Image](img/w.jpg) **C** 是错误的，因为 UDP 22 端口根本与 SSH 不匹配（SSH 是基于 TCP 的）。它传统上被用作旧的\
  \ pcAnywhere 端口。\n\n![Image](img/w.jpg) **D** 是错误的，因为 UDP 53 端口用于 DNS 查询。由于查询通常只有一个或两个数据包，而且我们在查询中关注速度，因此\
  \ UDP 的“发后即忘”速度优势在这里得到了利用。\n\n### 18. 一名团队成员执行了 `nbtstat.exe -c` 命令。以下哪项最能代表该命令的意图？\n\
  \n**A.** 它显示机器的 IP 路由表。\n**B.** 它显示 NetBIOS 名称缓存。\n**C.** 它显示活动和非活动的服务。\n**D.**\
  \ 它将网卡置于混杂模式以嗅探。\n\n![Image](img/r.jpg) **B.** 根据微软对 `nbtstat` 命令的说明：“Nbtstat 旨在帮助\
  \ NetBIOS 名称解析。当网络正常运行时时，基于 TCP/IP 的 NetBIOS (NetBT) 会将 NetBIOS 名称解析为 IP 地址。它通过\
  \ NetBIOS 解析的几种可选选项来实现此点，包括本地缓存、WINS 服务器查询、广播、LMHOSTS 查找、Hosts 查找和 DNS 服务器查询。nbtstat\
  \ 命令使用多个切换开关来删除和修正预加载条目。命令的语法如下：\n\n`nbtstat -a <name>` 对由 `<name>` 指定的执行 NetBIOS\
  \ 适配器状态命令。适配器状态命令会返回该计算机的本地 NetBIOS 名称表以及网卡的 MAC 地址。\n\n`nbtstat -A <IP address>`\
  \ 执行与 `-a` 关相同的功能，但使用的是目标 IP 地址而不是名称。\n\n`nbtstat -c` 显示 NetBIOS 名称缓存的内容，其中包含 NetBIOS\
  \ 名称到 IP 的映射。\n\n`nbtstat -n` 显示由 NetBIOS 应用（如服务器和重定向器）在系统本地注册的名称。\n\n`nbtstat -r`\
  \ 显示通过广播和通过查询 WINS 服务器解析出的 Net NetBIOS 名称的计数。\n\n`nbtstat -R` 清除名称缓存并从 LMHOSTS 文件重新加载所有条目（预加载到缓存中的条目）。\n\
  \n`nbtstat -RR` 向 WINS 服务器发送名称释放包并开始刷新，从而在不重启系统的情况下向服务器重新注册所有名称。\n\n`nbtstat -S`\
  \ 列出当前的 NetBIOS 会话及其状态，包括统计数据。”\n\n![Image](img/w.jpg) **A, C,** 和 **D** 是错误的，因为它们与命令不匹配。如果你想在\
  \ Windows 系统上查看路由表，请使用 `route` 命令。`sc state=all` 命令将显示系统上所有活动和非活动的服务。要将网卡置于混杂模式，你需要\
  \ WinPcap 驱动程序。\n\n### 19. 考虑在足迹探测（footprinting）期间扫描 IP 时返回的 nmap 输出中显示的端口：\n\n\
  ```PORT STATE SERVICE\n21/tcp open ftp\n23/tcp open telnet\n80/tcp open http\n139/tcp\
  \ open netbios\n515/tcp open lpd\n631/tcp open ipp\n1000/tcp open \nMAC Address:\
  \ ...\n```\n\n关于该输出，以下哪项是正确的？\n\n**A.** 主机可能是一个路由器或启用了路由功能。\n**B.** 主机可能是一个打印机或安装了打印机。\n\
  **C.** 主机绝对是 Windows 服务器。\n**D.** 主机绝对是 Linux 服务器。\n\n![Image](img/r.jpg) **B.**\
  \ 这个输出很有意思，对吧？有一些 FTP、Telnet 和 HTTP 处于开启状态，还有一些 NetBIOS 活动。然而，TCP 端口 515 和 631 是需要注意的。515\
  \ 对应于行守护进程协议/远程打印机协议（或 LPD/LPR），用于向远程打印机提交打印作业。端口 631 对应于互联网打印协议 (IPP)。这两者都指向打印。最后一点说明：在我们现代世界中，构成服务器和非服务器的界限是模糊的。如果你的打印机允许通过\
  \ Telnet 访问终端，它真的只是打印机吗？事实上，许多打印机实际上运行在嵌入式操作系统上。换句话之，在现实测试中，你的打印机实际上可能是某种 Linux\
  \ 服务器。你的考试将坚持于对端口号的学术化记忆和评估，但在现实世界中情况要复杂得多。\n\n![Image](img/w.jpg) **A** 是错误的，因为这些端口中没有一个是与路由相关的。\n\
  \n![Image](img/w.jpg) **C** 和 **D** 是错误的，因为没有足够的信息来确定识别使用的操作系统。是的，行守护进程最初是在 BSD\
  \ 操作系统；但无论什么系统都可以被使用。\n\n### 20. 以下结果来自一次 nmap 扫描：\n\n![Image](img/f0078-01.jpg)\n\
  \n为了协助识别操作系统，以下哪个选项是最好的？\n\n**A.** 尝试 ACK 扫描。\n**B.** 对系统进行跟踪路由。\n**C.** 使用 `-vv`\
  \ 运行相同的 nmap 扫描。\n**D.** 尝试获取横幅（banner grabbing）。\n\n![Image](img/r.jpg) **D.**\
  \ 在提供的选项中，获取横幅可能是你的最佳选择。事实上，它是操作系统指纹识别良好的开始。你可以连接到这些活动端口或运行 nmap 横幅获取。无论哪，返回的横幅可能有助于识别操作系统。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 ACK 扫描在这里并不一定有帮助。事实上，它可能已经运行过了。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为跟踪路由不提供任何指纹信息。它会向你展示跳到目标的网络映射，但它无法告诉你它是否是 Windows 机器。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为 `-vv` 切换仅提供 nmap 已经拥有的更多详细的信息。注意原始运行在操作系统指纹尝试时显示了此消息：“远程操作系统猜测：匹配的签名过多，无法可靠猜测\
  \ OS。”\n\n### 21. 你想对目标网络运行扫描。你担心扫描的可靠性和结果的真实性，但希望采取措施确保其尽可能隐蔽。在这种情况下，哪种扫描类型最好？\n\
  \n**A.** `nmap -sN targetIPaddress`\n**B.** `nmap -sO targetIPaddress`\n**C.** `nmap\
  \ -sS targetIPaddress`\n**D.** `nmap -sT targetIPaddress`\n\n\n\n\n\n![Image](img/r.jpg)\
  \ **C.** 根据此 `nmap` 命令行定义的半开扫描（half-open scan）是这种情况下的最佳选择。创建 `SYN` 扫描时考虑了隐蔽性，因为全连接扫描（full-connect\
  \ scan）实在太嘈杂了（或者在应用层日志系统中创建了更多条目，取决于你的喜好）。从现实世界而言，事实是大多数 IDS 检测 `SYN` 扫描的难易程度与检测全连接一样容易，但如果你运行得足够慢，`SYN`\
  \ 扫描和全连接都可以几乎是隐形的。连接扫描（connect scan）与真实连接无法区分，而 `SYN` 扫描肯定是可以被区分的。换句话说，全连接看起来就像任何其他对话一样——只是一堆同时发生的对话——而\
  \ `SYN` 扫描将显示许多系统在响应会话启动后，只等到了无礼的沉默。教训是，任何扫描在现实世界中都能且可能会被监控 IDS 看到；然而，你运行得越慢、且在不向线路上增加额外数据包的情况下对目标的刻画越准确，在所有条件相等的情况下，你被发现几概率就越小。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为空扫描（null scan）可能无法提供你所寻找的可靠性。记住，这种扫描在 Windows\
  \ 主机上完全不起作用。\n\n![Image](img/w.jpg) **B** 是错误的，因为 `-sO` 选项告诉这是一个操作系统扫描。指纹扫描（Fingerprinting\
  \ scans）在任何人的想象中都不是隐蔽的，而且它们不会提供你在这里寻找的完整信息。\n\n![Image](img/w.jpg) **D** 是错误的，因为\
  \ `-sT` 选项表示全连接扫描。尽管这种是可靠的，但它是嘈杂的，你极有可能在扫描期间被发现。\n\n### 22. TCP 三次握手的第二步是什么？**\n\
  \n**A.** SYN\n**B.** ACK\n**C.** SYN/ACK\n**D.** ACK-SYN\n**E.** FIN\n\n![Image](img/r.jpg)\
  \ **C.** 诚然，这是一道简单的题，但我打赌你一定会在考试中以某种形式看到它。它是扫描和枚举中非常重要的一部分，因为如果不理解这种通信通道建立的这种原理，你几乎注定失败。TCP\
  \ 三次握手要求发送者转发一个 `SYN`。接收者在第 2 步发送一个 `SYN` 和一个 `ACK`。在第 3 步，发送者响应 `ACK`。这些步骤被称为 `SYN`、`SYN/ACK`、`ACK`。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 `SYN` 是三次握手的步（标志设置）。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 `ACK` 是三次握手的最后一步（标志设置）。\n\n![Image](img/w.jpg) **D** 是错误的，因为列出的顺序不对。确实，这两个标志都是三次握手中设置的。但在对这个分步骤过程的讨论中，至少从你的考试来说，是\
  \ `SYN/ACK`，而不是相反。而且，是的，这个干扰项极有可能以某种形式出现在你的考试中。在现实世界中你不会关心顺序，因为标志是数据包的数学属性，而不是某种荒谬的顺序，但对于你的考试，你需要这样记忆。\n\
  \n![Image](img/w.jpg) **E** 是错误的，因为 `FIN` 标志使通信会话有序地关闭。\n\n### 23. 攻击者在何种扫描方法中向目标发送\
  \ INIT 块并等待响应？**\n\n**A.** SCTP INIT 扫描\n**B.** SCTP COOKIE ECHO 扫描\n**C.** SCTP\
  \ 半开扫描\n**D.** SCTP 全连接扫描\n\n![Image](img/r.jpg) **A.** 这一个需要一些背景知识，请继续阅读。\n\n在\
  \ 2000 年 10 月，SCTP（流控制传输协议）成为 IETF 拟议标准并以 `RFC 2960` 发布。它最初设计在 IETF 信令传输（SIGTRAN）工作组内，旨在解决\
  \ TCP 在 IP 网络上进行电话信令方面的缺点，从那时以后它演变为一种通用的 IETF 传输协议。SCTP 提供了一个面向连接的可靠的、全双工、拥塞和流量控制的第\
  \ 4 层通道；然而，与 TCP 和 UDP 不同，SCTP 提供了新的交付选项，能更好地匹配各种应用程序的需求。\n\n虽然你可能熟悉 TCP 的三次握手，但\
  \ SCTP 使用的是四次握手（你可以在 `https://datatracker.ietf.org/doc/html/rfc4960` 读取所有技术细节）：\n\
  \n1. 客户端向服务器发送一个 `INIT` 信号以启动关联。\n2. 接收到 `INIT` 信号后，服务器向客户端发送 `INIT-ACK` 响应。这个 `INIT-ACK`\
  \ 信号还包含一个“状态饼干（state cookie）”。这个 cookie 包含了各种信息，包括消息认证码（MAC）、对应于 cookie 创建的时间戳、状态\
  \ cookie 的生存周期以及建立连接所需的其他信息。\n3. 接收此 `INIT-ACK` 信号后，客户端发送 `COOKIE-ECHO` 响应，它只是回显了状态\
  \ cookie。\n4. 服务器验证状态 cookie 的真实性并分配资源，发送 `COOKIE-ACK` 响应。\n\nSCTP 的关闭是优雅的：\n\n\
  1. 客户端向服务器发送 `SHUTDOWN` 信号。\n2. 服务器通过发送 `SHUTDOWN-ACK` 进行响应。\n3. 客户端随后发送 `SHUTDOWN-COMPLETE`\
  \ 信号。\n\nSCTP 也可以异常关闭，使用 `ABORT` 信号。SCTP `INIT` 扫描向目标发送 `INIT` “块”并等待响应。如果响应是 `INIT+ACK`，则端口开启；`ABORT`\
  \ 响应意味着端口关闭。\n\n![Image](img/w.jpg) **B** 是错误的，因为在 SCTP `COOKIE ECHO` 扫描中，会向目标发送\
  \ `cookie`。顺便提一下，这种扫描可能非常有助于规避 IDS。\n\n![Image](img/w.jpg) **C** 和 **D** 是错误的，因为不存在\
  \ SCTP 半开或全连接扫描类型。\n\n### 24. Nmap 是一个强大的扫描和枚举工具。以下 nmap 命令尝试实现什么？\n\n`nmap -sA\
  \ -T4 192.168.15.0/24`\n\n**A.** 对 C 类子网的串行缓慢操作系统扫描\n**B.** 对 C 类子网的并行快速操作系统扫描\n\
  **C.** 对 C 类子网的串行缓慢 ACK 扫描\n**D.** 对 C 类子网的并行快速 ACK 扫描\n\n![Image](img/r.jpg) **D.**\
  \ 你需要在考试中熟悉 nmap 选项。在这个例子中，`-A` 选项表示 ACK 扫描，而 `-T4` 选项表示“激进”扫描，运行速度快且并行。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为缓慢串行扫描将使用 `-T`、`-T0` 或 `-T1` 选项。此外，操作系统检测开关是 `-O` 不是 `-A`。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，虽然这个答案扫描速度正确，但操作系统检测部分不对。\n\n![Image](img/w.jpg) **C** 是错误的，虽然这个答案正确识别了\
  \ ACK 扫描，但误判了 `-T4` 选项。\n\n### 25. 你正在检查来自子网内主机的所有流量数据包捕获。主机发送了一个设置了 `SYN` 标志的段以建立\
  \ TCP 通信通道。目标端口为 80，序列号设置为 10。关于此通信通道，以下哪些述是*不*正确的？（选择所有适用项）**\n\n**A.** 主机将尝试检索一个\
  \ HTML 文件。\n**B.** 此数据包上的源端口可以是 1024 到 65535 之间的任何数字。\n\n\n\n\n**C.** 目的主机响应此主机的第一个数据包将设置\
  \ `SYN` 和 `ACK` 标志。\n\n**D.** 回应此 `SYN` 请求的的数据包将通过返回 `10` 来确认序列号。\n\n![Image](img/r.jpg)\
  \ **A, D.** 端口 `80` 的流量通常是 `HTTP`，这确实是真的；但这个陈述有两个问题。首先，这里发生的所有只是与端口 `80` 上的某个东西建立任意连接。据我们所知，它可能是一个监听器、`Telnet`\
  \ 连接或任何东西。其次，假设它实际上是一个 `HTTP` 服务器，这里描述的序列除了建立连接之外什么也做不了——并不一定会传输任何内容。当然，这很挑剔，但这是事实。接下来，在三次握手期间，系统之间的序列号确认是通过递增\
  \ `1` 完成的。在这个示例中，源向接收方发送了一个为 `10` 的起始序列号。接收方在构建 `SYN/ACK` 响应时，首先会通过将其增加到 `11` 来确认起始序列号。之后，它将把自己的序列号（它随机选择的一个数字）添加到数据包中并将两者发送。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为它是一个 true 的陈述。源端口字段是使用“良好”端口范围（`0–1023`）以外的任何内容动态分配的。`IANA`\
  \ 定义了以下端口范围：端口 `1024` 到 `49151` 是注册端口（由 `IANA` 根据请求实体的应用分配给特定服务），而端口 `49152` 到 `65535`\
  \ 是动态或私有端口，这些端口无法向 `IANA` 注册。\n\n![Image](img/w.jpg) **C** 是错误的，因为它是一个 true 的陈述。请求主机已发送了三次握手交换中的第一个数据包——一个\
  \ `SYN` 数据包。接收方将用 `SYN/ACK` 响应，并耐心地等待最后一步——`ACK` 数据包。\n\n### 26. **B.** 这个答案通常与\
  \ `URG` 标志混淆，因为我们都把它读作“紧急（urgent）”。然而，只需记住 `PSH` 的关键词是“缓冲（buffering）”。在 `TCP` 中，缓冲用于保持稳定、和谐的流量流。然而，有时缓冲区本身会变成问题，减慢速度。`PSH`\
  \ 标志告诉接收端栈，数据应该立即推送到接收的应用程序。\n\n![Image](img/w.jpg) **A** 是错误的，因为 `URG` 标志用于通知接收端栈，段中的某些数据是紧急的并且应该被优先处理。顺便提一下，现代协议并不经常使用\
  \ `URG`。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `RST` 标志强制终止通信（双向）。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 `BUF` 不是一个标志。\n\n### 27. **B.** 这个答案通常与 `URG` 标志混淆，因为我们都把它读作“紧急（urgent）”。然而，只需记住\
  \ `PSH` 的关键词是“缓冲（buffering）”。在 `TCP` 中，缓冲用于保持稳定、和谐的流量流。然而，有时缓冲区本身会变成问题，减慢速度。`PSH`\
  \ 标志告诉接收端栈，数据应该立即推送到接收的应用程序。\n\n![Image](img/w.jpg) **A** 是错误的，因为 `URG` 标志用于通知接收端栈，段中的某些数据是紧急的并且应该被优先处理。顺便提一下，现代协议并不经常使用\
  \ `URG`。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `RST` 标志强制终止通信（双向）。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 `BUF` 不是一个标志。\n\n### 28. **B.** 这个答案通常与 `URG` 标志混淆，因为我们都把它读作“紧急（urgent）”。然而，只需记住\
  \ `PSH` 的关键词是“缓冲（buffering）”。（注：此处原文有重复）。在 `TCP` 中，缓冲用于保持稳定、和谐的流量流。然而，有时缓冲区本身会变成问题，减慢速度。`PSH`\
  \ 标志告诉接收端栈，数据应该立即推送到接收的应用程序。\n\n![Image](img/w.jpg) **A** 是错误的，因为 `URG` 标志用于通知接收端栈，段中的某些数据是紧急的并且应该被优先处理。顺便提一下，现代协议并不经常使用\
  \ `URG`。\n\n![Image](img/w.jpg) **C** 是错误的，因为 `RST` 标志强制终止通信（双向）。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 `BUF` 不是一个标志。\n\n\n\n此外，要深度掌握 `Wireshark`。特别关注 `Wireshark` 内部过滤器——如何设置它们以及它们遵循什么语法——以及如何读取捕包（更不用说“跟踪\
  \ TCP 流”选项了）。如果你还没有下载，请立即下载 `Wireshark` 并开始尝试——就在现在，甚至在在你阅读后面的问题之前。在任何显示 `Wireshark`\
  \ 屏幕截图的考试题中，请密切关注段中设置的标志位、源和目的地址以及列出的协议。对于几乎任何会拼写单词的人来说，这些项目都是容易识别的，它们将回答你会看到的很多问题。\n\
  \nIDS 类型以及绕过它们的方法不会占据测试的很大比例，但它们肯定会出现。这些内容可能会以场景题的形式出现，而不是直接的定义。虽然 ECC 喜欢分片、会话拼接（使用类似\
  \ `Whisker` 的工具）和隧道（通过 `HTTP` 甚至 `DNS` 之 TCP），但请记住还有其他绕过 IDS 的方法，包括生成“火力覆盖”（即大量的误报）以及当然，终极的规避手段——加密。如果流量是加密的，IDS\
  \ 什么也看不见。\n\n最后，不要忘记你的防火墙类型。你可能看不到很多关于识别定义的题目，但你可能会看到至少几个这种知识可以派上用场的场景题——特别是，状态检测防火墙的工作原理以及它们的功能。\n\
  \n## QUESTIONS Q\n\n### 1. 给定以下 Wireshark 过滤器，攻击者试图查看什么？\n\n```bash\n((tcp.flags\
  \ == 0x02) || (tcp.flags == 0x12) ) || ((tcp.flags == 0x10) && (tcp.ack==1) && (tcp.len==0)\
  \ )\n```\n\n**A.** SYN, SYN/ACK, ACK\n**B.** SYN, FIN, URG 和 PSH\n**C.** ACK, ACK,\
  \ SYN, URG\n**D.** 仅 SYN/ACK\n\n### 2. 目标机器（MAC 地址为 `12:34:56:AB:CD:EF`）连接到一个交换机端口。攻击者（MAC\
  \ 地址为 `78:91:00:ED:BC:A1`）连接到同一交换机的另一个端口，并运行着数据包捕获。没有开启端口堆叠或端口安全。两个数据包从目标机器离开。消息\
  \ 1 的目的 MAC 地址为 `E1:22:BA:87:AC:12`。消息 2 的目的 MAC 地址为 `FF:FF:FF:FF:FF:FF`。关于发送的消息，以下哪个说法是正确的？\n\
  \n**A.** 攻击者将看到消息 1。\n**B.** 攻击者将看到消息 2。\n**C.** 攻击者将看到两个消息。\n**D.** 攻击者哪两个消息都看不见。\n\
  \n### 3. 你接入了目标组织的一个网络子网。你通过学习该子网上所有重要的 MAC 地址来开始攻击。一段时间后，你决定拦截两个主机之间的消息。你向主机 A\
  \ 发送广播消息，显示你的 MAC 地址属于主机 B。这里实现的是什么？\n\n**A.** ARP 投毒，允许你在不中断它们通信过程的情况下，看到来自任一主机的所有消息\n\
  **B.** ARP 投毒，允许你看到从主机 A 到主机 B 的消息\n**C.** ARP 投毒，允许你看到从主机 B 到主机 A 的消息\n**D.** ARP\
  \ 投毒，允许你看到从主机 A 发往任何地址的消息\n**E.** ARP 投毒，允许你看到从主机 B 发往任何地址的消息\n\n### 4. 你的目标子网受防火墙保护的\
  \ DMZ 。侦察显示外部防火墙允许部分从外部到内部的流量，但阻止了大部分通信。到 DMZ 中响应 `www.somebiz.com` 的服务器的 HTTP 流量是被允许的，同时也允许标准流量（如\
  \ `DNS` 查询）。以下哪项可能提供规避防火墙保护的方法？\n\n**A.** ACK 扫描\n**B.** 防火墙探测 (Firewalking)\n**C.**\
  \ 误报泛洪\n**D.** DNS 之 TCP\n\n### 5. 在设置 NIDS Tap 时，以下哪个是最佳选择？\n\n**A.** 直接连接到 DMZ\
  \ 内部服务器。\n**B.** 直接连接到内网中的服务器。\n**C.** 连接到交换机上的 `SPAN` 端口。\n**D.** 连接到路由器的控制端口。\n\
  \n### 6. 你在 `Wireshark` 中有一个大型捕包文件需要审查。你想过滤流量，显示所有 IP 地址为 `192.168.2.5` 且包含字符串 `admin`\
  \ 的数据包。以下哪项可以实现此目标？\n\n**A.** `ip.addr==192.168.2.5 && tcp contains admin`\n**B.**\
  \ `ip.addr 192.168.2.5 (admin)`\n**C.** `ip.addr==192.168.2.5 && tcp ==admin`\n\
  **D.** `ip.addr==192.168.2.5 tide`\n\n### 7. 以下哪种技术可以从完全交换的网络中收集信息？\n\n**A.** DHCP\
  \ 饥饿\n**B.** MAC 泛洪\n**C.** 混杂模式 (Promiscuous)\n**D.** ARP 欺骗\n\n### 8. 关于在网络上发现嗅探器，以下哪个说法是正确的？\n\
  \n**A.** 为了发现嗅探器，ping 所有地址并检查延迟。\n**B.** 为了发现嗅探器，发送 ARP 消息并观察响应。\n**C.** 为了发现嗅探器，将网卡配置为混杂模式。\n\
  **D.** 发现嗅探器几乎是不可能的。\n\n### 9. 以下哪项可以提供针对 ARP 欺骗的有效防御？（选择所有适用项）\n\n**A.** 使用 DAI\n\
  **B.** 将网卡设置为混杂模式\n**C.** 使用私有 VLAN\n**D.** 使用静态 ARP\n\n### 10. 检查以下 Snort 规则：\n\
  \n```bash\nalert tcp !$HOME_NET any -> $HOME_NET 23 (content:\"admin\";msg:\"Telnet\
  \ attempt\");\n```\n\n以下哪些说法是正确的？（选择所有适用项）\n\n**A.** 该规则将对来自家庭网络的数据包告警。\n**B.**\
  \ 该规则将对来自家庭地址之外的数据包告警。\n**C.** 该规则将对目标为任何端口、包含 \"admin\" 字符串的数据包告警。\n**D.** 该规则将对目标为端口\
  \ 23、来自任何端口的数据包告警。\n\n### 11. 你想开始嗅探，你有一台 Windows 笔记本电脑。你下载并安装了 `Wireshark`，但很快发现你的网卡需要混杂模式。是什么允许你将网卡置于混杂模式？\n\
  \n**A.** 安装 lcap\n**B.** 安装 npcap\n**C.** 安装 Wincap\n**D.** 安装 libPcap\n**E.** 通过控制面板\
  \ | 网络和互联网 | 更改适配器设置操作网卡属性\n\n### 12. 网络和安全管理员安装了 NIDS。几周后，网络发生了一次成功入侵，在攻击期间检查 NIDS，显示没有告警。调查显示\
  \ NIDS 配置不正确，因此没有对应该触发的攻击特征产生响应。以下哪项最好描述了 NIDS 的行为？\n\n**A.** 误报 (False positives)\n\
  **B.** 漏报 (False negatives)\n**C.** 真阳 (True positives)\n**D.** 真阴 (True negatives)\n\
  \n### 13. 一位渗透测试人员获得了一个开放交换机端口的。他将网卡配置为混杂模式并设置了嗅探器，将笔记本电脑直接插在交换机端口。他观察到达系统的流量，寻找以后可能使用的特定信息。正在进行的是哪种嗅探？\n\
  \n**A.** 主动 (Active)\n**B.** 混杂 (Promiscuous)\n**C.** 盲嗅 (Blind)\n**D.** 被动 (Passive)\n\
  **E.** 会话 (Session)\n\n### 14. 以下哪些项是防止 DHCP 饥饿攻击的最佳预防措施？（选择两项）\n\n**A.** 阻塞所有 UDP\
  \ 端口 67 和 68 流量。\n\n\n\n\n\n## **B.** 在交换机上启用 DHCP snooping 功能。\n\n## **C.** 在交换机上使用端口安全（port\
  \ security）。\n\n## **D.** 在交换机上配置 DHCP 过滤器。\n\n### 15 下列哪种工具是规避 IDS 的最佳选择？\n\n**A.**\
  \ Nessus\n**B.** Nikto\n**C.** Libwhisker\n**D.** Snort\n\n### 16 攻击者以某种方式将一个非法交换机连接到企业网络网段。他将该交换机的优先级低于网络上的任何其他交换机。假设此尝试成功了，以下哪种说法是正确的？\n\
  \n**A.** 非法交换机会导致广播环路并最终导致网段发生 DoS 攻击。\n**B.** 非法交换机将成为根桥接，允许攻击者嗅探网络流量。\n**C.**\
  \ DHCP 将无法在该网段内工作。\n**D.** 以上都不是。\n\n### 17 你的 IDS 位于网络边界，并分析了几个周的流量。一天早上到达时，你发现\
  \ IDS 对前一天晚上网络流量激增发了警报。你使用的是哪种类型的 IDS？\n\n**A.** 状态型（Stateful）\n**B.** Snort\n**C.**\
  \ 被动型（Passive）\n**D.** 基于签名（Signature based）\n**E.** 基于异常（Anomaly based）\n\n###\
  \ 18 你正在对目标子网进行 ACK 扫描。你之前验证了子网内几个主机的连通性，但你想验证子网上的所有活动主机。然而，你的扫描没有收到任何响应。你所在地最可能使用的是哪种防火墙？\n\
  \n**A.** 包过滤\n**B.** IPS\n**C.** 状态型\n**D.** 动态\n\n### 19 你被防火墙隔在目标子网之外。防火墙配置正确，仅允许访问管理员开放的端口。在防火墙探测中，你发现\
  \ 80 端口是开放的。你可以采用哪种技术向目标系统发送或接收数据和命令？\n\n**A.** 加密数据以躲避防火墙。\n**B.** 使用会话拼接（session\
  \ splicing）。\n**C.** 使用 MAC 泛洪。\n**D.** 使用 HTTP 隧道技术（HTTP tunneling）。\n\n### 20\
  \ 下列哪种工具可以从日志文件中捕取的 TCP 连接中提取应用层数据并到单独的文件？\n\n**A.** Snort\n**B.** Netcat\n**C.**\
  \ TCPflow\n**D.** Tcpdump\n\n### 21 检查此处显示的 Wireshark 过滤器：\n\n```\nip.src == 192.168.1.1\
  \ &&tcp.srcport == 80\n```\n\n以下哪项正确描述了该采集过滤器（capture filter）？\n\n**A.** 结果将显示所有来自\
  \ 192.168.1.1 往端口 80 的流量。\n**B.** 结果将显示所有访问 192.168.1.1 的 HTTP 流量。\n**C.** 结果将显示所有来自\
  \ 192.168.1.1 的 HTTP 流量。\n**D.** 由于语法无效，不会显示任何结果。\n\n### 22 你需要在 Linux 机器上将网卡设置为监听模式、捕获数据包并将结果写入名为\
  \ my.log 的日志文件中。你如何使用 tcpdump 完成此操作？\n\n**A.** `tcpdump -i eth0 -w my.log`\n**B.**\
  \ `tcpdump -l eth0 -c my.log`\n**C.** `tcpdump /i eth0 /w my.log`\n**D.** `tcpdump\
  \ /l eth0 /c my.log`\n\n### 23 下列哪些工具可以协助规避 IDS？（选择所有适用项。）\n\n**A.** Whisker\n**B.**\
  \ Fragroute\n**C.** Capsa\n**D.** Wireshark\n**E.** ADMmutate\n**F.** Inundator\n\
  \n### 24 一位安全管理员试图“锁定”她的网络，并阻止了所有外部防火墙端口上除 TCP 80 和 TCP 443 以外的内部到外部的访问。一个内部用户想要利用其他协议来访问远程系统上的服务（FTP\
  \ 以及一些非标准端口号）。该用户尝试通过其选择的协议与远程系统通信，最可能的选择是：\n\n**A.** 使用 HTTP 隧道技术。\n**B.** 使用 UDP\
  \ 而不是 TCP 发送所有流量。\n**C.** 破解防火墙并打开所需的端口。\n**D.** 对连接防火墙的交换机进行 MAC 泛洪。\n\n### 25\
  \ 一位道德黑客被分配扫描一台服务器并希望避免 IDS 检测。她使用了一种策略，将 TCP 头部拆分成许多数据包，使得难以检测这些数据包的意图。以下哪项最好描述了所采用的技术？\n\
  \n**A.** TCP 扫描\n**B.** IP 分片扫描\n**C.** ACK 扫描\n**D.** 反向 TCP 扫描\n\n## 快速答案对照\n\n\
  1 A\n2 B\n3 B\n4 D\n5 C\n6 A\n7 B, D\n8 D\n9 A, C, D\n10 B, D\n11 C\n12 B\n13 D\n\
  14 B, C\n15 C\n16 B\n17 E\n18 C\n19 D\n20 C\n21 C\n22 A\n23 A, B, E\n24 A\n25 B\n\
  \n\n\n\n\n## 2. 一个目标机器（MAC 地址为 `12:34:56:AB:CD:EF`）连接到交换机端口。攻击者（MAC 地址为 `78:91:00:ED:BC:A1`）连接到同一台交换机的另一个端口，并运行了数据包捕获程序。网络没有开启端口镜像（span）或端口安全设置。有两条数据包从目标机器发出。消息\
  \ 1 的目标 MAC 地址为 `E1:22:BA:87:AC:12`。消息 2 的目标 MAC 地址为 `FF:FF:FF:FF:FF:FF`。关于发送的消息，以下哪种说法是正确的？\n\
  \n- **A.** 攻击者将看到消息 1。\n- **B.** 攻击者将看到消息 2。\n- **C.** 攻击者将看到这两条消息。\n- **D.** 攻击者哪条消息都看不见。\n\
  \n![Image](img/r.jpg) **B.** 这个题完全关于交换机的工作原理，并夹杂了一些 MAC 知识。记住，交换机的设计用于过滤单播消息，但会对多组播和广播消息进行泛洪（过滤只发送到一个端口，而泛洪会发送到所有端口）。帧中的广播\
  \ MAC 地址很容易识别——它们全都是 *F*，表示地址中的所有 48 位都处于开启状态。在这种情况下，消息 1 是一个单播地址并发送到了它的目的地，而消息\
  \ 2 显然是一条广播消息，交换机会乐意地将其泛洪到所有端口，包括攻击者的端口。\n\n该题的其他版本将集中在攻击者可以利用哪些手段来查看该数据包上。如果攻击者希望看到所有消息，可以使用\
  \ MAC 泛洪（MAC flood）将交换机变成集线器，从而有效地将所有数据包泛洪到所有端口。另一个选项是端口镜像（span，进入交换机配置并告诉它将所有指向特定端口的流量发送到该端口*以及*攻击者的端口）。最后，*端口窃取*（port\
  \ stealing，来自 EC-Council 一个非常有趣的记忆术语）允许攻击者在 MAC 泛洪尝试期间利用竞态条件（交换机不断更新端口的 MAC 地址绑定），从而有效地窃取一个端口并嗅探所有指向目标机器的流量。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为单播目标 MAC 地址与攻击者的机器不匹配。当交换机读取帧并与内部地址列表（CAM 表）对比时，它会被过滤并发送到适当的权限端口。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为交换机不会将两条消息都泛洪到攻击者的端口——它只泛洪广播和多组播。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为广播地址肯定会被攻击者看到。\n\n## 3. 你接入了目标组织的一个网络子网。你开始通过学习该子网上所有重要的 MAC 地址来发起攻击。一段时间后，你决定拦截两个主机之间的消息。你向\
  \ Host A 发送广播消息，显示你的 MAC 地址属于 Host B。这里实现的是什么操作？\n\n- **A.** ARP 毒攻击，允许你在不中断它们通信过程的情况下，看到来自任一主机的所有消息\n\
  - **B.** ARP 毒攻击，允许你看到从 Host A 发到 Host B 的消息\n- **C.** ARP 毒攻击，允许你看到从 Host B 发到\
  \ Host A 的消息\n- **D.** ARP 毒攻击，允许你看到从 Host A 发往任何地址的消息\n- **E.** ARP 毒攻击，允许你看到从\
  \ Host B 发往任何地址的消息\n\n![Image](img/r.jpg) **B.** ARP 毒攻击是一种相对简单的方法，可以让自己处于“中间人”位置并监视流量（顺便说一下，小心使用\
  \ *man in the middle* 这个词，因为它通常指的是你并不中断流量的位置）。每当你的机器进行名称查找或 ARP（一种广播协议）接收到宣称 MAC\
  \ 与 IP 匹配的未请求请求消息时，ARP 缓存就会更新。在这个例子中，你告诉 Host A 你拥有 Host B 的 MAC 地址。Host A 将更新其缓存，当操作系统正在构造消息时，它会乐意地将伪造的地址放在其中。只需记住，ARP\
  \ 毒攻击通常带有很大的噪声，如果开启了端口安全，可能很容易被发现：取决于实现方式，当一个错误的 MAC 尝试使用端口或当看到多个声称不同 MAC 的广播包时，端口将锁定（在极客术语中为\
  \ *琥色*）。此外，注意尝试 ARP 毒攻击可能带来的拒绝攻击副作用——你可能甚至还没尝试就让目标崩溃了，更不用说 Host B 最终会发现它没有从 Host\
  \ A 接收到任何东西。顺带一提，可以使用名为 `xARP` ([www.chrismc.de](https://www.chrismc.de)) 的工具检测\
  \ ARP 毒攻击。\n\n![Image](img/w.jpg) **A** 错误原因有两个。首先，你不会收到发往世界任何地方的消息——你只会收到从 Host\
  \ A 发到 Host B 的消息。其次，两个主机之间的通信流将受到影响。事实上，Host A 永远无法与 Host B 通信：ARP 毒攻击让所有消息都发给了你，这个黑客。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为交换机不会将两条消息都泛洪到攻击者的端口——它只泛洪广播和多组播。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为广播地址肯定会被接收者看到。\n\n![Image](img/w.jpg) **E** 是错误的，因为你没有对 Host B 投毒。\n\
  \n## 4. 你的目标子网受防火墙 DMZ 保护。侦测显示防火墙允许从外部到内部的部分流量，但阻止了大部分。指向 DMZ 中 Web 服务器的 HTTP 流量是被允许的，以及标准的\
  \ DNS 查询。以下哪项可以提供规避防火墙的方法？\n\n- **A.** ACK 扫描\n- **B.** 防墙漫\n- **C.** 误报泛洪\n- **D.**\
  \ TCP over DNS\n\n![Image](img/r.jpg) **D.** 在提供的选项中，TCP over DNS 是唯一合理的。TCP over\
  \ DNS 正如其名——通过使用 53 端口发送本应使用其他端口的 TCP 流量。由于防火墙通常允许 DNS 请求通过，因此将流量隐藏在 53 端口变得既方便又相对简单。整个过程确实需要特殊的\
  \ DNS 服务器和 DNS 客户端设置，但实现步骤并不是高科学。虽然 TCP over DNS *会*允许你规避防火墙并在内部发送流量，但它*不会*为你提供即时的机器访问或其他功能——它只是允许你在不被察觉的情况下通过防火墙发送流量。TCP\
  \ over DNS 工具包括 `Iodine` ([`code.kryo.se/iodine/`](http://code.kryo.se/iodine/)),\
  \ `DNS Tunnel` ([`dnstunnel.de`](http://dnstunnel.de)) 和 `Netcross` ([`sourceforge.net/projects/netcross`](https://sourceforge.net/projects/netcross))。\n\
  \n另一种常见的通过防火墙的方法是 HTTP 隧道。原理相同，只是在 HTTP 隧道中你滥用 80 端口而不是 53 端口。HTTP 隧道工具包括 `HTTPort`\
  \ ([www.targeted.org](https://www.targeted.org))、`SuperNetwork Tunnel` ([networktunnel.net](https://networktunnel.net))\
  \ 和 `HTTP-Tunnel` (www.http-tunnel.com)。\n\n![Image](img/w.jpg) **A** 是错误的，因为 ACK\
  \ 扫描无法隐藏流量或规避防火墙。扫描本身会很大且嘈杂，且对防火墙产生任何影响。\n\n![Image](img/w.jpg) **B** 是错误的，因为防火墙漫是一种发现哪些端口是开启的（即防火墙允许通过的端口）以及哪些是关闭的极佳技术。然而，它无法隐藏流量或规避任何怀疑。\n\
  \n\n\n\n![Image](img/w.jpg) **C** 是错误的，因为虽然误报洪水（false positive flooding）确实为 IDS\
  \ 中的攻击者提供了良好的“掩护火力”，但它对防火墙没有任何实质影响——指向其他端口的流量将被拦截，因为这就是防火墙的功能。\n\n### 5. 设置 NIDS\
  \ 分流器（tap）时，以下哪是最佳选择？\n\n**A.** 直接连接到 DMZ 内部的服务器。\n\n**B.** 直接连接到内网中的服务器。\n\n**C.**\
  \ 连接到交换机上的 `SPAN` 端口。\n\n**D.** 连接到路由器的控制端口（console port）。\n\n![Image](img/r.jpg)\
  \ **C.** 网络入侵检测系统（NIDS）只有在能够看到所有网络流量时才能良好工作，放置位置显然有巨大影响。一种常见的实现方法是通过交换机上的 `SPAN`（交换端口分析器）端口连接。`SPAN`\
  \ 端口的配置确保了来自定义端口范围的所有流量也会发送到 `SPAN` 端口。这使得它成为你 NIDS 分流器的最佳选择，至少就本题而言：在现实世界中，你很可能会设置一个被动分流器，放置在正确的位置以查看通过线缆的所有流量。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为直接连接到单个服务器将只能获得发送到该服务器的流量（或该服务器子网的流量，前提服务器处于混杂模式且配置恰当）。在这种情况下，你只能看到\
  \ DMZ 的流量。\n\n![Image](img/w.jpg) **B** 是错误的，因为直接连接到单个服务器将只能获得发送到该服务器的流量（或该服务器子网的流量，前提服务器处于混杂模式且配置恰当）。在这种情况下，你只能看到内网的流量。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为连接到路由器的控制端口无法获取任何流量。路由器的控制端口专门用于路由器的配置和管理。\n\n\
  ### 6. 你在 Wireshark 中有一个大型数据包捕文件需要审查。你想过滤流量以显示所有 IP 地址为 192.168.22.5 且包含字符串 HR_admin\
  \ 的数据包。以下哪个过滤器可以完成此任务？\n\n**A.** `ip.addr==192.168.22.5 &&tcp contains HR_admin`\n\
  \n**B.** `ip.addr 192.168.22.5 && “HR_admin\"`\n\n**C.** `ip.addr 192.168.22.5 &&tcp\
  \ string ==HR_admin`\n\n**D.** `ip.addr==192.168.22.5 + tcp contains tide`\n\n![Image](img/r.jpg)\
  \ **A.** 这是你考试中关于 Wireshark 语法的典型问题的完美示例。答案 A 是唯一符合 Wireshark 语法的选项。（此处省略重复句，仅翻译核心句意）\n\
  \n### 7. 你在 Wireshark 中有一个大型数据包捕文件需要审查。你想过滤流量以显示所有 IP 地址为 192.168.22.5 且包含字符串 HR_admin\
  \ 的数据包。以下哪个过滤器可以完成此任务？\n\n**A.** `ip.addr==192.168.22.5 &&tcp contains HR_admin`\n\
  \n**B.** `ip.addr 192.168.22.5 && “HR_admin\"`\n\n**C.** `ip.addr 192.168.22.5 &&tcp\
  \ string ==HR_admin`\n\n**D.** `ip.addr==192.168.22.5 + tcp contains tide`\n\n![Image](img/r.jpg)\
  \ **A.** 这是你考试中关于 Wireshark 语法的典型问题的完美示例。答案 A 是唯一符合 Wireshark 语法的选项。\n\n```\nip.addr==192.168.22.5\
  \ &&tcp contains HR_admin\n```\n\n在 `ip.addr==192.168.22.5 &&tcp contains HR_admin`\
  \ 中，过滤器 `ip.addr==192.168.22.5` 匹配特定的 IP，而 `tcp contains HR_admin` 匹配目标字符串。\n\n\
  ### 8. 以下哪些技术可以用于收集信息？（选二）\n\n**A.** DHCP 攻击（DHCP starvation）\n\n**B.** 交换机（Switches）\n\
  \n**C.** 混杂模式（Promiscuous mode）\n\n**D.** ARP 欺骗（ARP spoofing）\n\n![Image](img/r.jpg)\
  \ **B, D.** 这是你 NIDS 分流器的最佳选择，至少就本题而言：在现实世界中，你很可能会设置一个被动分流器，放置在正确的位置以查看通过线缆的所有流量。\n\
  \n### 9. 以下哪些措施可以对 ARP 欺骗提供有效防御？（选择所有适用项）\n\n**A.** 使用 `ARPWALL`\n\n**B.** 将所有网卡设置为混杂模式\n\
  \n**C.** 使用私有 VLAN（private VLANs）\n\n**D.** 使用静态 ARP 条目\n\n\n\n\n![Image](img/r.jpg)\
  \ **A, C, D.** ARPWALL 是一个可以从 SourceForge 下载的应用程序([`sourceforge.net/projects/arpwall/`](http://sourceforge.net/projects/arpwall/))。它会在\
  \ ARP 攻击发生时发出警告并简单地阻塞连接。虚拟局域网（VLAN）提供了在网络内创建多个广播域的方法。同一交换机上的机器处于不同的网络，它们的流量是隔离的。由于\
  \ ARP 是基于广播工作的，这可以帮助防止大规模 ARP 欺骗。根据课程内容，静态 ARP 条目是一个好主意，也是修复 ARP 投毒的一种方法，因为无论网络上出现什么干扰，系统都会使用你配置的静态映射。入侵检测系统（IDS）可能在发现\
  \ ARP 异常方面有所帮助，但它并不一定会采取任何措施。\n\n![Image](img/w.jpg) **B** 是错误的，因为将 `NICs` 设置为混杂模式（promiscuous\
  \ mode）并无法防止接收广播消息（`ARP`）。\n\n### [10.#ch4.xhtml#ans10] 检查以下 Snort 规则：\n\n```\n\
  alerttcp !$HOME_NET any -> $HOME_NET 23 (content:\"admin\";msg:\"Telnet attempt..admin\
  \ access\";)\n```\n\n关于该规则，以下哪些描述是正确的？（选择所有适用。）\n\n* **A.** 该规则将对来自指定家庭网络的数据包触发警报。\n\
  * **B.** 该规则将对来自指定家庭地址之外的数据包触发警报。\n* **C.** 该规则将对目标为任何端口、来自 23 端口且包含“admin”字符串的数据包触发警报。\n\
  * **D.** 该规则将对目标为 23 端口、来自任何端口且包含“admin”字符串的数据包触发警报。\n\n![Image](img/r.jpg) **B,\
  \ D.** Snort 规则、日志、条目和配置文件绝对会是你考试的一部分。这条特定的规则考虑了你将看到的很多因素。首先，注意 `HOME_NET` 变量之前的感叹号\
  \ `!`。每当你看到它时，它都表示后面变量的反反——在这种情况下，表示任何来自*不在*家庭网络的地址且使用任何源端口号的数据包，目标是家庭网络内的任何地址。在该变量之后是端口号的位置，`any`\
  \ 一词表示我们不在乎源端口是什么。接下来，我们写出目标信息：家庭网络中的任何内容，目标是 23 端口。最后，在写出我们想要接收的消息之前，我们又添加了一个小小的搜索：`content`\
  \ 标识符允许我们写出正在寻找的字符串。\n\n![Image](img/w.jpg) **A** 和 **C** 是错误的，因为这些描述与规则所陈述的完全相反。\n\
  \n### [11.#ch4.xhtml#ans11] 你想开始嗅探，你有一台 Windows 笔记本电脑。你下载并安装了 Wireshark，但很快发现你的\
  \ `NIC` 需要处于混杂模式。什么让你将 `NIC` 置于混杂模式？\n\n* **A.** 安装 `lmpcap`\n* **B.** 安装 `npcap`\n\
  * **C.** 安装 `WinPcap`\n* **D.** 安装 `libPcap`\n* **E.** 通过 `控制面板 | 网络和 Internet |\
  \ 更改适配器设置` 操作 `NIC` 属性\n\n![Image](img/r.jpg) **C.** 要理解这一点，你必须知道 `NIC` 是如何设计工作的。`NIC`\
  \ “看到”大量流量，但只拉取已知属于你的流量。它是通过将每个帧的 `MAC` 地址与其自身的地址进行比较来实现的：如果匹配，它就会拉入该帧并进行处理；如果不匹配，帧就会被忽略。如果你将嗅探器插到一个只看发往你所在机器流量的\
  \ `NIC` 上，那么你有点错过了重点，不是吗吗？混杂模式告诉 `NIC` 拉取*所有*内容。这允许你看到在冲突域内往复移动的所有数据包。`WinPcap`\
  \ 是一个库，允许 Windows 机器上的 `NICs` 以混杂模式运行。\n\n![Image](img/w.jpg) **A** 是错误的，因为 `lmpcap`\
  \ 不存在。\n\n![Image](img/w.jpg) **B** 是错误的，因为 `npcap` 不存在。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 `libPcap` 用于 Linux 机器实现同样的目的——将网卡设置为混杂模式。\n\n![Image](img/w.jpg)\
  \ **E** 是错误的，因为访问“更改适配器设置”窗口并不允许你将网设置为混杂模式——你仍然需要 `WinPcap`。\n\n### [12.#ch4.xhtml#ans12]\
  \ 一位网络安全管理员安装了 `NIDS`。几周后，网络发生了一次成功的入侵，对网络进行检查后发现了入侵。由于 `NIDS` 没有检测到入侵，这可能是配置问题。以下哪项最描述了\
  \ `IDS` 的情况？\n\n* **A.** 误报性 (false positives)\n* **B.** 漏报性 (false negatives)\n\
  * **C.** 真阳性 (true positives)\n* **D.** 真阴性 (true negatives) \n\n![Image](img/r.jpg)\
  \ **B.** 在涉及到 `IDS` 时，漏报性比误报性更糟糕。当入侵发生时，`IDS` 却没有触发警报，这被称为漏报性。在现实世界中，如果 `IDS` 没有检测到恶意流量，这通常是配置性问题。换句话说，当入侵本该发生时，`IDS`\
  \ 却没有触发警报。\n\n![Image](img/w.jpg) **A** 是错误的，因为误报性是指 `IDS` 对合规流量触发了警报。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为真阳性是指 `IDS` 正确检测到了攻击流量并触发了警报。\n\n![Image](img/w.jpg) **D** 是错误的，因为真阴性是指\
  \ `IDS` 正确地识别出没有攻击流量。\n\n### [13.#ch4.xhtml#ans13] 一位渗透成员访问了一个开放的交换机端口。他将 `NIC`\
  \ 配置为混杂模式并设置了嗅探器，将笔记本直接接入交换机。他观察到达的流量，寻找可能使用的信息。正在进行的是哪种嗅探？\n\n* **A.** 主动 (Active)\n\
  * **B.** 混杂模式 (Promiscuous)\n* **C.** 盲目 (Blind)\n* **D.** 被动 (Passive)\n* **E.**\
  \ 会话 (Session)\n\n![Image](img/r.jpg) **D.** 要理解这一点，你需要知道 CEH 中那些让我们在考试中感到疯狂的定义。理解*被动*与*主动*的定义并不会真正让你成为更好的渗透测试员，但它可能在考试中为你节省一道题。涉及到嗅探时，如果你没有向数据流中注入数据包，它就是被动的练习。像\
  \ `Wireshark` 这样的工具本质上是被动的。然而，像 `Ettercap` 这样的工具具有内置功能可以欺骗交换机将所有流量发送给它，以及其他的嗅探。这种使用包注入来强制响应的嗅探类型是主动的。顺便提一句，对于你们现实世界的实战准备者来说，使用笔记本实现真正的被动嗅探是非常困难的。一旦你连接\
  \ Windows 机器，它就会开始广播各种内容（ARP 等），这在技术上仍然是把数据包放在了线路上。真正的重点在于，被动嗅探是一种心态，你并没有*故意*将数据包放在线路上。![Image](img/w.jpg)\
  \ **A** 是错误的，因为在给出的示例中，没有执行数据包注入。渗透测试员只是接入了嗅探器并观察经过的内容。唯一能让这变得更被动的方式，就是他旁边有一个吊床了。\n\
  \n\n\n\n\n![Image](img/w.jpg)**B** 是错误的，因为 *promiscuous*（混杂模式）不是一种嗅探类型。相反，它指的是 `NIC`\
  \ 拉取并非专门针对其地址的帧的能力。\n\n![Image](img/w.jpg)**C** 是错误的，因为 *blind*（盲目）不是一种嗅探类型。这被作为一个干扰项包含进来。\n\
  \n![Image](img/w.jpg)**E** 是错误的，因为 *session*（会话）不是一种嗅探类型。这被作为一个干扰项包含进来。\n\n### 14.\
  \ 以下哪些是防止 DHCP 饥饿攻击的最佳预防措施？（选择两项。）\n\n**A.** 阻塞所有 `UDP` 端口 `67` 和 `68` 流量。\n\n**B.**\
  \ 在交换机上启用 `DHCP snooping`（DHCP 侦听）。\n\n**C.** 在交换机上使用 `port security`（端口安全）。\n\n\
  **D.** 在交换机上配置 `DHCP filters`（DHCP 过滤器）。\n\n![Image](img/r.jpg)**B, C.** DHCP 饥饿攻击是一种拒绝服务攻击，EC-Council\
  \ 以某种方式将其混入了嗅探章节。这种攻击非常简单直接：攻击者从服务器请求所有可用的 `DHCP` 地址，导致合法用户无法获取地址并连接或与网络子网进行通信。Cisco\
  \ 交换机上的 `DHCP snooping`（使用 `ip dhcp snooping` 命令）会创建一个允许获取 `DHCP` 地址的机器白名单。任何尝试未执行此操作的行为都可以被过滤。`Port\
  \ security` 虽然不一定与攻击直接相关，但也可以作为一种防御手段。通过限制与端口关联的 `MACs` 数量，以及对哪些特定 `MACs` 可以访问该端口建立白名单，确实可以减少攻击者耗尽所有\
  \ `DHCP` 地址的能力。\n\n顺带一提，你可能还会看到关于 `DHCP` 如何工作的问题。记忆这些内容的简单方法是使用缩写 `DORA`：Discover（发现）、Offer（提供）、Request（请求）和\
  \ Acknowledge（确认）。此外，`DHCPv6` 中的数据包名称与 `DHCPv4` 不同。`DHCPDISCOVER`、`DHCPOFFER`、`DHCPREQUEST`\
  \ 和 `DHCPACK` 分别被称为 `Solicit`（请求）、`Advertise`（广告）、`Request`（请求或确认/刷新）和 `Reply`（响应）。\n\
  \n![Image](img/w.jpg)**A** 是错误的，因为阻塞所有 `UDP` `67` 和 `68` 流量将导致整个 `DHCP` 系统失效，因为没有人可以获取地址。\n\
  \n![Image](img/w.jpg)**D** 是错误的，因为 `DHCP filtering`（DHCP 过滤）是在服务器上完成的，而不是交换机上。`DHCP\
  \ filtering` 涉及在服务器本身配置白名单。\n\n### 15. 以下工具是规避 IDS 的最佳选择？\n\n**A.** `Nessus`\n\n\
  **B.** `Nikto`\n\n**C.** `Libwhisker`\n\n**D.** `Snort`\n\n![Image](img/r.jpg)**C.**\
  \ EC-Council 认证考试的一个特点是会包含一些离奇的、针对特定工具的问题，这是一个很好的例子。`Libwhisker` ([`sourceforge.net/projects/whisker/`](https://sourceforge.net/projects/whisker/))\
  \ 是一个功能齐全 `Perl` 库，用于许多用途，包括与 `HTTP` 相关函数、漏洞扫描、利用和 `IDS` 规避。事实上，某些扫描器实际上使用 `libwhisker`\
  \ 进行会话拼接，以便在不被发现的情况下进行扫描。\n\n![Image](img/w.jpg)**A** 是错误的，因为 `Nessus` 是一个漏洞扫描器，它本身并不是为规避\
  \ `IDS` 检测而设计的。\n\n![Image](img/w.jpg)**B** 是错误的，因为 `Nikto` 和 `Nessus` 一样也是漏洞扫描器，它本身并不是为规避\
  \ `IDS` 检测设计的。\n\n![Image](img/w.jpg)**D** 是错误的，因为 `Snort` 本身就是一个 `IDS`。`Snort`\
  \ 也是一个完美的嗅探器。\n\n### 16. 攻击者设法将一个恶意交换机连接到企业网络网段。他将交换机的优先级设置为比网络上任何其他设备都低的值。假设这次尝试成功了，以下哪个陈述是正确的？\n\
  \n**A.** 恶意交换机将导致广播环路并最终导致该网段 DoS 攻击。\n\n**B.** 恶意交换机将成为根桥，允许攻击者嗅探网络流量。\n\n**C.**\
  \ `DHCP` 在该网段将不再正常工作。\n\n**D.** 以上都不是。\n\n![Image](img/r.jpg)**B.** 我们先处理明显的问题：如果你的安全如此脆弱，以至于有人可以走进你的办公室并连接一个交换机——一个*交换机*——而无人察觉，那么你根本*没有*安全性。尽管如此，让我们来看问题的意图。EC-Council\
  \ 定义了一种“新型”嗅探攻击，称为 `STP` 攻击。`STP` 是交换机用于防止网段内广播环路的协议。基本上，交换机之间相互通信并确定哪个设备的优先级最低（在\
  \ `STP` 中，数字越小表示优先级越高）。该交换机变成根桥，广播风暴会被阻止。\n\n这里的想法是攻击者利用 `STP` 为自己服务，通过强制恶意设备成为网桥并将其优先级设置为零，这有助于嗅探跨多个交换机的流量。\n\
  \n![Image](img/w.jpg)**A** 是错误的，因为 `STP` 专门用于防止风暴，添加另一个设备（即使是恶意的）也不会改变这一点。\n\n![Image](img/w.jpg)**C**\
  \ 是错误的，因为该操作对 `DHCP` 没有影响。\n\n![Image](img/w.jpg)**D** 是错误的，因为有一个正确的答案。\n\n### 17.\
  \ 你的 IDS 位于网络边界并已分析了数周流量。一天早上到达时，你发现 IDS 对昨晚的网络激增发了告报。你使用的是哪种 IDS？\n\n**A.** `Stateful`\n\
  \n**B.** `Snort`\n\n**C.** `Passive`\n\n**D.** `Signature based`\n\n**E.** `Anomaly\
  \ based`\n\n![Image](img/r.jpg)**E.** 这里描述的情况正是异常或基于行为系统的目标。该系统监控流量，并随着时间的推移对“正常”流量形成概念——涵盖从源和目的、使用的端口到数据流的时间。在某种方面，它比单纯的基于特征系统更好，因为它可以根据启发发现问题；然而，异常检测系统以产生大量的误报而臭名昭著——特别是在早期。\n\
  \n![Image](img/w.jpg)**A** 是错误的，因为 *stateful* 指的是防火墙类型，而不是 IDS。\n\n![Image](img/w.jpg)**B**\
  \ 是错误的，因为 `Snort` 是基于特征的 IDS。\n\n![Image](img/w.jpg)**C** 是错误的，因为 *passive* 一词与\
  \ IDS 不关联。现在，IDS *可以* 对告警采取行动以停止或防止攻击，但这被称为 `IPS`，而不是活动或被动。\n\n![Image](img/w.jpg)**D**\
  \ 是错误的，因为基于特征的 IDS 不关心流量的大小或发生的时间。基于特征的 IDS 仅将每个数据包与你配置让查看的特征文件进行对比。如果特征文件中没有匹配项，则不采取任何操作。\n\
  \n### 18. 你正在对目标子网进行 ACK 扫描。你之前验证了该子网内若干主机的连通性，但现在想验证该子网内的所有活动主机。然而，你的扫描没有收到任何回复。你所在地最可能使用的是哪种类型的防火墙？\n\
  \n**A.** `Packet filtering`\n\n**B.** `IPS`\n\n**C.** `Stateful`\n\n**D.** `Active`\n\
  \n\n\n\n\n![Image](img/r.jpg) **C.** 大多数人认为防火墙只是一个简单的数据包过滤器，在数据包进入时，将其与访问控制列表进行对比——如果允许该端口，就让数据包通过。然而，状态检测防火墙具有检查与数据包相关的会话详情的能力，并对其状态做出判断。举一个常见的（我敢说，是教科书级别的）例子，如果状态检测防火墙接收到了一个\
  \ `ACK` 数据包，它足够智能，知道是否有一个源自网络内部的关联 `SYN` 数据包与之相随。如果没有——即通信不是从子网内部开始的——它将丢弃该数据包。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为数据包过滤型防火墙并并不会费心去处理这些标志位（flags）。它关心的只是数据包正往哪个端口发送。例如，如果你在那个子网的网外托管了一个网页，但没有\
  \ FTP 服务器，那么你的防火墙应该被设置为允许 `80` 端口进入，但不同意 `21` 端口进入。\n\n![Image](img/w.jpg) **B**\
  \ 是错误的，因为入侵防御系统（`IPS`）根本不是防火墙。它是一个网络监控解决方案，能够识别恶意流量并采取行动防止或停止攻击。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 `active`（活动）这个词与任何防火墙类型都没有关联。这被包含在这里作为一个干扰项。\n\n### 19. 你被防火墙与你的目标子网隔离开。\n\
