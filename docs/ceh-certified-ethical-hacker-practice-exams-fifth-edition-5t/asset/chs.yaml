  \ C\n- **6.** D\n- **7.** B\n- **8.** C\n- **9.** A\n- **10.** A\n- **11.** A, C\n\
  - **12.** A\n- **13.** B\n- **14.** A\n- **15.** D\n- **16.** D\n- **17.** C\n-\
  \ **18.** C\n- **19.** A\n- **20.** B\n\n## A 答案解析\n\n### 1. 关于云计算，以下哪个陈述是正确的？\n\
  \n**A.** 在 IaaS 中，应用程序、数据、中间件、虚拟化和服务器都是服务提供的一部分。\n**B.** 在 PaaS 中，应用程序、数据、中间件、虚拟化和服务器都是服务提供的一部分。\n\
  **C.** 在 SaaS 中，应用程序、数据、中间件、虚拟化和服务器都是服务提供的一部分。\n**D.** 以上都不是。\n\n![Image](img/r.jpg)\
  \ **C.** 因此，EC-Council 非常希望你了解有关云计算的几件事，但其中有两个点特别处于列表的最顶端。职责分离（Separation of duties）和责任分担（Separation\
  \ of responsibility）都是云计算的关键目标和利益，这两个概念在学习材料中反复出现，并将成为你成功的关键。职责分离是所有云计算类型的规定，但三者中的一种负责所有内容。在软件即服务（SaaS）中，服务提供者交付了整个责任范围。从应用程序、数据到中间件和操作系统，一直到网络本身，都由服务提供者提供。作为比较，在平台即服务（PaaS）中，服务提供者负责应用程序和数据之外的所有内容。在基础设施即服务（IaaS）中，客户端持有应用程序、数据、运行时、中间件和操作系统，而提供者负责其他所有内容——虚拟化、服务器、存储和网络。\n\
  \n![Image](img/w.jpg) **A, B,** 和 **D** 是错误的，因为这些不是真实的陈述。在 IaaS 中，订阅者持有应用程序、数据和中间件，但不持有虚拟化和服务器。在\
  \ PaaS 中，客户仅持有应用程序和数据。\n\n### 2. 下列哪项是一个提供安全评估、授权标准化方法的政府范围内的计划？\n\n**A.** NIST\n\
  **B.** FedRAMP\n**C.** PCI DSS\n**D.** Cloud Alliance\n\n![Image](img/r.jpg) **B.**\
  \ FedRAMP 是一个政府范围内的计划，为云服务提供安全评估、授权和持续监控的标准化方法。\n\n### 3. 一位企业主被建议，库存、存储、销售和备份在线服务可以通过云以更低成本和更安全的方式提供。在研究了选项后，该企业主确定最符合其需求的云服务提供商恰好也是几位竞争对手的提供商。如果他决定采用同一家提供商，将使用哪种云服务部署模型？\n\
  \n**A.** 私有 (Private)\n**B.** 多云 (Multi-cloud)\n**C.** 社区 (Community)\n**D.** 公有\
  \ (Public)\n\n![Image](img/r.jpg) **C.** 在大多数情况下，谁在用你想使用的云并不重要——重要的是所提供的服务、成本和可用的安全性。社区云模型是由多个组织共享基础设施的模型，它们通常具有相同的策略和合规考量。例如，多个不同的州级组织可能会聚集在一起，利用社区云获取所需的服务。或者在本例中，即使是敌对竞争对手也可能使用来自同一云提供商的相同服务。\n\
  \n\n\n\n\n### 4. 在“NIST 云计算参考架构”中，以下哪项是提供云与订阅者之间连接的中间环节？\n\n**A.** 云提供者 (Cloud provider)\n\
  **B.** 云传输业务 (Cloud carrier)\n**C.** 云经纪人 (Cloud broker)\n**D.** 云审计师 (Cloud auditor)\n\
  \n![Image](img/r.jpg) **B.** 我可以保证，你将在考试中看到几个关于云计算领域的问题，其中许多问题将仅仅是识别“NIST 云计算参考架构”的部分。`cloud\
  \ carrier` 在架构中被定义为负责传输数据的组织——类似于电网的电力分配器。`cloud carrier` 是订阅者和提供者之间连接和传输的中间环节。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 `cloud provider` 是产品和服务的提供者。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为`cloud broker`的作用是管理云服务的使用、性能、交付以及提供者与订阅者之间的关系。经纪人“充当消费者和提供者之间的中间环节，帮助消费者应对复杂的云服务产品，并可能创建增值云服务”。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为`cloud auditor` 是云服务和安全控制的独立评估员。\n\n### 5. 一家公司大部分内部计算需求依赖私有云解决方案。在扩展到更多在线零售业务后，它依赖部分公云进行外部销售和电子商务业务。以下哪项最准确地描述了使用的云部署类型？\n\
  \n**A.** 私有 (Private)\n**B.** 公有 (Public)\n**C.** 混合 (Hybrid)\n**D.** 社区 (Community)\n\
  \n![Image](img/r.jpg) **C.** `hybrid cloud`（混合云）部署正如其名——它是两种或多种部署类型的组合。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为`private cloud` 云部署仅为单一组织运营（即单租户环境）。\n\n![Image](img/w.jpg) **B**\
  \ 是错误的，因为`public cloud` 公云部署模型是在供公众使用的网络（如互联网）上提供服务的模型。\n\n![Image](img/w.jpg) **D**\
  \ 是错误的，因为`community cloud` 社区云部署模型是几个组织共享基础设施，通常具有相同的策略和合规考量。\n\n### 6. 云计算最适合以下哪种业务？\n\
  \n**A.** 一家医疗诊所\n**B.** 一家老牌乡村综合杂货店\n**C.** 一个执法机构\n**D.** 一家圣诞用品店\n\n![Image](img/r.jpg)\
  \ **D.** 这种场景性问题会穿插在整个考试中，涉及多个主题，云计算也不例外。在这种情况下，圣诞用品店从其本质上来说是季节性的。这意味着它不需要稳定的业务流和计算资源，而在一年的最后几个月需要的支持比在例如\
  \ 7 月多得多。云计算提供了`elasticity`（弹性，这是你可能会看到的另一个术语），即可以根据需要添加或删除计算资源，这很可能为公司节省费用。\n\n\
  ![Image](img/w.jpg) **A** 是错误的。在提供的选项中，医疗诊所由于其持有敏感数据而不会是最佳选择（更不用说诊所对这些记录必须遵守的联邦强制保护措施）。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为一家拥有稳定销售额和员工的成熟实体店并不一定需要云服务。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为执法机构也处理高度敏感的信息。因此，在提供的选项中，这不是最佳选项。\n\n### 7. 一家软件公司决定在云计算环境中构建和测试\
  \ Web 应用程序。以下哪种云计算类型最准确地描述了这一努力？\n\n**A.** IaaS\n**B.** PaaS\n**C.** SaaS\n**D.**\
  \ Community (社区)\n\n![Image](img/r.jpg) **B.** 这个场景是为平台即服务（`PaaS`）量身定制的。尽管 `PaaS`\
  \ 也是一个主要在复活节期间因彩蛋而为人知的品牌名称，但它是面向软件开发的，因为它提供了一个平台，允许订阅者创建应用程序，而无需构建开发和发布软件通常所需的设施。硬件和软件由提供者托管在其自己的基础设施上，因此客户不需要为开发工作安装或构建自研的硬件和软件。`PaaS`\
  \ 通常不会取代组织的实际基础设施；相反，它只是提供了组织可能在现场缺乏的关键服务。\n\n![Image](img/w.jpg) **A** 是错误的，因为这并没有描述基础设施即服务。`IaaS`\
  \ 通过互联网提供虚拟化的计算资源。第三方提供者代表其订阅者托管基础设施组件、应用程序和服务，并使用虚拟机程序（如 `VMware`、`Oracle VirtualBox`、`Xen`\
  \ 或 `KVM`）运行虚拟机作为客户。\n\n![Image](img/w.jpg) **C** 是错误的，因为这并没有描述软件即服务。`SaaS` 是一种软件发行模型——提供者按需向订阅者提供应用程序。\n\
  \n![Image-](img/w.jpg) **D** 是错误的，因为 `community` 指的是部署模型，而不是类型。\n\n### 8. 以下哪一陈述是不正确的？\n\
  \n**A.** 私有云仅为单一组织运营。\n**B.** 公有云利用虚拟化服务器。\n**C.** 公有云在内网上运营。\n**D.** 私有云利用虚拟化服务器。\n\
  \n![Image](img/r.jpg) **C.** 大多数时候我讨厌带“不”字的题型——它们似乎更多是为了难倒候选人，而不是为了测试他们的知识——但几乎所有的认证提供商都会使用它们。在这种情况下，`private\
  \ cloud` 当然是仅为一个组织运营的，而且虚拟化被应用于所有的部署模型。然而，`public cloud` 明确地在供公众使用的网络（如互联网）上提供服务。\n\
  \n![Image](img/w.jpg) **A, B,** 和 D** 是错误的，因为这些是正确的陈述。\n\n### 9. 一家公司完全依赖 Google\
  \ Docs、Google Sheets 和其他云服务来满足办公软件需求。以下哪种云计算类型最准确地描述了这一点？\n\n**A.** SaaS\n**B.**\
  \ PaaS\n**C.** IaaS\n**D.** Public (公有)\n\n![Image](img/r.jpg) **A.** 这个场景恰如其描述了软件即服务（`SaaS`）。`SaaS`\
  \ 是一种软件发行模型——提供者通过互联网向订阅者按需提供应用程序。`Google Docs` 和 `Google Sheets`（在线提供文字处理和电子表格软件操作）是完美的例子。微软在\
  \ `SaaS` 领域也很有实力，`Office 365` 似乎正在取代传统的 `Microsoft Office` 套件。你不需要在系统中安装它，或在 Best\
  \ Buy（或你使用的任何供应商）购买预装版，你可以“租赁” `Office 365`——按需要获取所需内容。鉴于 `Office` 是全球领先的办公效率软件，`Office\
  \ 365` 大大受欢迎并不意外。例如，美国空军在 2019 年 1 月将超过 50 万个电子邮件迁移到了 `Office 365`。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为平台即服务是软件开发的极佳选择，但它并非为了这种方式提供软件服务。\n\n\n\n\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为基础设施即服务（Infrastructure as a Service）的设计并不是提供此类的软件服务。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为 `public` 指的是部署模型。\n\n### 10.\n订阅者通过 Amazon EC2 购买机器虚拟化和托管。这描述的是哪种云计算类型？\n\
  \n**A.** IaaS\n**B.** PaaS\n**C.** SaaS\n**D.** Hybrid\n\n![Image](img/r.jpg) **A.**\
  \ 云计算实现有三种类型：`IaaS`、`PaaS` 和 `SaaS`。对于 Amazon EC2 而言，“基础设施即服务”最符合该描述。`IaaS` 基本上是在互联网上提供虚拟化的计算资源。第三方提供商代表其订阅者托管基础设施组件、应用程序和服务，并使用\
  \ `hypervisor`（如 `VMware`、`Oracle VirtualBox`、`Xen` 或 `KVM`）运行虚拟机作为客户。云提供商内部的虚拟机管理程序集合成倍地增加了可用虚拟化资源，并为订阅者提供了服务的可扩展性。因此，`IaaS`\
  \ 不仅是日常基础设施服务的良好选择，对于可能发生意外变化的临时或实验性负载也是如此。`IaaS` 订阅者通常按使用付费（例如在特定时间范围内），有时有时根据所使用的虚拟机空间量付费。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为平台即服务（Platform as a Service）并不最符合该描述。`PaaS` 侧重于软件开发，因为它提供了一个开发平台，允许订阅者开发应用程序，而无需构建开发和发布软件通常所需的基础设施。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为软件即服务（Software as a Service）并不最符合该描述。`SaaS` 可能是最简单、最容易理解的。它仅仅是一种软件分发模型——提供者通过互联网向订阅者提供按需应用程序。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为混合（hybrid）并不最符合该描述。`hybrid` 一词涉及的是云的部署方法（例如，如果你有一个既具有“公共”属性又具有“社区”属性的云环境，它将被称为混合混合云）。\n\
  \n### 11.\n关于容器和虚拟化，以下哪些陈述是正确的？（选择两个。）\n\n**A.** 虚拟化在单个物理系统上运行多个操作系统。\n**B.** 虚拟化利用多个物理系统来创建虚拟操作系统。\n\
  **C.** 容器被放置在单个物理系统和操作系统。\n**D.** 多个容器需要在宿主机设备上有多个操作系统。\n**E.** 容器和虚拟机是同一物。\n\n\
  ![Image](img/r.jpg) **A, C.** 我几乎可以保证你会在考试中看到容器和虚拟机的对比，由于它们定义中的措辞非常接近，很容易将它们混淆。记住两者之间的主要区别是，容器共享它们所所在系统的操作系统，而虚拟机有它们自己的操作系统。容器是一个包。\n\
  \n![Image](img/w.jpg) **B, D, E** 是错误的。\n\n### 12.\n关于容器和虚拟化，以下哪些陈述是正确的？（等等，重新对齐题目文本）：在\
  \ SOAP 转换过程中发生了以下哪些攻击？\n\n**A.** 封装攻击（Wrapping attack）\n**B.** 跨客户（Cross-guest）\n\
  **C.** 侧信道（Side channel）\n**D.** 会话劫持（Session riding）\n\n![Image](img/r.jpg) **A.**\
  \ 在封装攻击中，有人可能会拦截消息、更改内容并发送到服务器。例如，攻击者可能会拦截 SOAP 消息并将合法内容封装在恶意元素中。服务器随后处理该消息，可能导致服务器执行恶意代码。\n\
  \n![Image](img/w.jpg) **B, C** 是错误的，因为它们没有描述这种攻击。\n\n![Image](img/w.jpg) **D** 是错误的，因为它没有描述这种攻击。\n\
  \n### 13.\n以下哪项是软件设计中的架构模式，其中组件通过通信提供服务？\n\n**A.** API\n**B.** SOA\n**C.** EC2\n\
  **D.** IaaS\n\n![Image](img/r.jpg) **B.** 在面向服务的架构（`SOA`）中，软件的设计使得每个组件都跨越网络与其他组件进行通信。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为这并没有定义架构。`APIs` 是用于构建应用程序的协议和工具集。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为 `EC2` 是一种云服务产品。\n\n![Image](img/w.jpg) **D** 是错误的，因为 `IaaS` 是一种云类型。\n\
  \n### 14.\n在“NIST 云计算参考架构”中，哪个实体管理云服务并维护提供者与订阅者之间的关系？\n\n**A.** 云经纪（Cloud broker）\n\
  **B.** 云审计员（Cloud auditor）\n**C.** 云载体（Cloud carrier）\n**D.** 云消费者（Cloud consumer）\n\
  \n![Image](img/r.jpg) **A.** “NIST 云计算参考架构”将云经纪定义为管理云服务的使用、性能、交付以及提供者与订阅者之间关系的实体。经纪人作为消费者和提供者之间的中介，帮助消费者应对复杂的云服务产品，并可能还会创建增值云服务。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为云审计员是云服务提供商安全控制的独立评估员。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为云载体是负责在提供者和订阅者之间传输数据的组织。\n\n![Image](img/w.jpg) **D** 是错误的，因为云消费者是获取和使用云产品的个人或组织。\n\
  \n### 15.\n以下哪项不是虚拟化的好处？\n\n**A.** 它允许更高效的备份、数据保护和灾难恢复。\n**B.** 它减少了系统管理工作量。\n**C.**\
  \ 它提高了运营效率。\n**D.** 它将单个硬件锁定到每个单个虚拟机上。\n\n\n\n\n\n![Image](img/r.jpg) **D.** 你们中的某些人实际上可能在云环境中工作，并且你们可能不同意此处列出的优势中的至少一项。然而，尽管现实世界与你们的\
  \ CEH 考试之间可能存在差异，但对于你的测试，你确实需要了解虚拟化的优势。这种主意本身很棒——通过将硬件虚拟化给每个操作系统，在同一台物理设备上*同时*运行一个或多个操作系统。许多公司（如\
  \ `VMware`、`Oracle VirtualBox` 和 `Xen`）提供虚拟机监视器（又称为虚拟机监控器，或 `VMM`，是一种创建和运行虚拟机的应用程序或硬件），允许多个操作系统共享同一台物理机器硬件。虚拟化服务器可以提高运营效率，提供更高效的备份、提供灾难恢复和数据保护，并减少管理工作。此外，虚拟化可能对确保整个网络的控制和合规性产生积极影响，并降低整体成本。\n\
  \n![Image](img/w.jpg) **A、B 和 C** 是错误的，因为这些全都是服务器虚拟化的优势。\n\n### 16.\n一家公司收购了一个云环境来满足大部分业务\
  \ IT 需求。该环境仅供该机构使用和运行。以下哪项代表所述的云部署模型？\n\n* **A.** 公有\n* **B.** `IaaS`\n* **C.**\
  \ 单源\n* **D.** 私有\n\n![Image](img/r.jpg) **D.** 在私有云模型中，云仅为单一组织运营（即单租户环境），并且通常不是按需付费的模式。大型组织通常倾向于私有云，因为硬件是专用的，并且更容易满足安全和合规性要求。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为公有云供任何人使用。\n\n![Image](img/w.jpg) **B** 是错误的，因为\
  \ `IaaS` 是一种通过互联网提供虚拟化计算资源的云类型。第三方供应商代表其订阅者托管基础设施组件、应用程序和服务，并由虚拟机监视器运行作为客机的虚拟机。`IaaS`\
  \ 是日常基础设施服务以及可能发生意外变化的临时或实验性负载的良好选择。`IaaS` 订阅者通常按使用付费（例如在特定时间范围内），或者有时根据使用的虚拟机空间付费。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为单源不是一种部署方法。\n\n### 17.\n关于云计算，以下哪种说法是正确的？\n\n\
  * **A.** 云中的安全仅是提供者的责任。\n* **B.** 云中的安全仅是消费者的责任。\n* **C.** 云中的安全是消费者和提供者的责任。\n*\
  \ **D.** 以上都不是。\n\n![Image](img/r.jpg) **C.** 关于云计算的最大的误区之一似乎是责任界限的划分在哪里。然而，安全是每个人的责任，这并不令人意外。提供者必须确保云*本身*的基础设施的安全，而消费者则必须确保云*中*内容的安全。\n\
  \n### 18.\n以下哪项为云提供渗透测试服务？\n\n* **A.** `CloudPassage Halo`\n* **B.** `Core`\n* **C.**\
  \ `CloudInspect`\n* **D.** `Panda Cloud`\n\n\n\n\n\n![Image](img/r.jpg) **B.** Kubernetes（也称为\
  \ `K8s`）是一个容器编排平台。如果你恰好在具有不同操作系统的多个主机上安装了多个 Docker 容器，Kubernetes 可以将它们整合到一个管理平台中。Kubernetes\
  \ 是开源、可移植且可扩展的，可以安装在任何地方。其功能包括但不限于服务发现、负载均衡、存储分配、发布、回滚和配置管理。\n\n![Image](img/w.jpg)\
  \ **A** 是错误的，因为 `Docker` 是一个开源容器平台。`Docker` 容器包含了运行应用程序或服务所需的所有组件，但依赖于宿主系统的底层操作系统。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为微服务是云托管的子应用程序，执行特定的、独特的任务。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为无服务器计算是一个函数即服务（FaaS）术语。换句话之，它指的是一种云应用程序，其基础设施和需求由云服务商根据需要提供。\n\n\
  # 第 10 章：木马和其他攻击\n\n本章涵盖了以下主题的问题：\n\n- 描述恶意软件类型及其目的\n- 识别恶意软件部署方法\n- 描述恶意软件分析过程\n\
  - 识别恶意软件防护\n- 描述 DoS 攻击和技术\n- 识别 DoS 检测和应对措施行动\n- 描述会话劫持和序列预测\n\n任何新爱好和活动最终都会面临巨大的学习曲线，其中有各种行话和术语需要掌握。而且，这通常会花费大量的钱。例如，假设你决定学习摄影。突然之间你开始学习\
  \ ISO 级别和饱和度——并购买极其昂贵的相机和镜头，因为你*需要*它们。如果你决定尝试鲈钓呢？哦，现在我们谈论的是一些严肃的考虑了。\n\n编织线还是单丝线？前饵材料我投票给碳纤维，但编织线对后端非常好。水滴抛钓轮还是纺车轮？我想这取决于情况，但除非你能搞定离心制动系统和张力设置，否则如果有充足的时间练习，丝轮可能是你的最佳选择。鱼竿材质和构造？鱼钩样式？要用什么种结？别让我开始提你船上的电子设备了！\n\
  \n正如我们从每个爱好中所了解到的，对你购买的每一样都有规则和预期。长期从事这项活动的人通常以困惑的嘲笑目光看待新人，嘲笑他们对工具和技术的误用，直到他们融入正轨并像大家的那样做事。在鲈钓中，这种想法让许多人没能钓到很多鱼。\n\
  \n几十年来，一种名为 `jig`（跳饵）的特定饵料的使用被那些无所不知的人简化为一种展示方式：直接将 `jig` 抛入非常厚的覆盖物中（灌木丛、树枝、莲叶等），并在底部周围轻巧地拨动它，直到鱼上钩。1996\
  \ 年，一位名叫 Bill Lowen 的职业鲈鱼手在比赛中按照自人工饵钓鱼黎明以来大家一直使用的方法钓着 `jig`。他将它丢进一棵倒在水里的树里，并缓慢地将其拉回。决定移动到另一个地方，他开始把\
  \ `jig` 拉回这里——砰！鱼上钩了！在下一个地点，他再次开始钓鱼，但决定尝试将 `jig` 拉回这里，而不是像其他人那样使用它。砰！另一条鱼上钩了。他赢得了那场比赛，并此创造了一种名为“游动”\
  \ `jig` 的全新技术。\n\n为什么说这么多鲈钓和技巧？因为这适用于我们在这里作为伦理黑客的工作。看，在任何特定的饵料上钓鱼有两种方法：第一是按照其设计的方式使用饵料，其次是按照任何能钓到鱼的方式使用它。无论这种技术是给蠕虫进行“直钓”（dead-sticking），还是无论你信不信，用扳手当饵料（别笑——我亲眼所见），任何能钓鱼的方法都应该被使用，对吧？在伦理黑客领域，也是如此。恶意软件绝不会与“良好”工具混淆，但也许你可以以不同于其设计目的的方式使用它。你的渗透测试工具集可以通过亲自访问黑暗面来增强，使用一些对你来说可能有些不光彩的工具和行动，并以你从未想过的方式进行。\n\
  \n![Image](img/examp.jpg) **学习技巧** 在过去的几个版本中，关于恶意软件和相关攻击并没有太大的变化，似乎这次的重点可能会减弱；截至本文写作时，恶意软件仅占考试的\
  \ 6%。恶意软件章节的大部分问题——尤其是那些旨在为难你的问题——仍然是纯粹的记忆类型。紧记每个定义的关键词（这有助于你区分好答案和坏答案），特别是病毒类型。不要在考试中因为忘记了多态病毒（polymorphic）和多部分病毒（multipartite）之间的区别，或者为什么蠕虫不同于病毒而丢失简单分。工具的识别也应该相对简单（假设你像我要求的那样记住了所有端口号）。\n\
  \n最后，像往常一样，去掉那些你早就知道是错误的答案。有时，识别那些你明确知道与问题无关的答案实际上更容易。然后，从剩下的中，你可以动脑筋寻找那个揭示答案的关键词。\n\
