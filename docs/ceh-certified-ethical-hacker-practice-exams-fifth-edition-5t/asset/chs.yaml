  \n* 识别 TCP/IP 计算机网络组件\n* 理解信息安全的基本要素\n* 理解事件管理步骤\n* 识别安全策略的基础知识\n* 识别与道德黑客攻击相关的核心术语\n\
  * 定义道德黑客和黑客分类\n* 描述道德黑客的五个阶段\n* 定义系统攻击的类型\n* 识别影响 IT 安全法律、法案和标准\n* 识别网络杀伤链（Cyber\
  \ Kill Chain）方法术语\n\n在我最早的记忆中，我坐在感恩节的餐桌旁，深情地看着被切成块并分到盘子里的热苹果派。我记得看着冰淇淋碗追着派块绕桌子转，每个人都为自己的派顶部盛上一层美味的香草冰淇淋。我记得看着那酥脆的饼皮和甜的糖浆内部，并且\
  \ (IR) 阶段负责制定规则、识别工作力量和角色，并为组织创建备份和测试计划？\n\n**A.** 准备\n**B.** 识别\n**C.** 遏制\n**D.**\
  \ 恢复\n\n5. 你被聘为渗透测试团队的一员。在简报会期间，你了解到客户希望渗透测试能够模拟一个发现提升权限并创建攻击方法的普通用户。客户想要哪种测试类型？\n\
  \n**A.** 白盒\n**B.** 灰盒\n**C.** 黑盒\n**D.** 混合盒\n\n6. 下列哪项定义为通过对信息分配敏感性标签并将其与用户操作的安全级别进行比较，以确保组织安全策略的执行不依赖于用户的自愿合规？\n\
  \n**A.** 强制访问控制\n**B.** 授权访问控制\n**C.** 基于角色的访问控制\n**D.** 任意访问控制\n\n7. 关于 TCP 三次握手，下列哪种陈述是正确的？\n\
  \n**A.** 接收者在第二步设置初始序列号。\n**B.** 发送者在第三步设置初始序列号。\n**C.** 在接受通信请求时，接收者在第二步通过确认号和随机生成的序列号进行响应。\n\
  **D.** 在接受通信请求时，接收者在第三步通过确认号和随机生成的序列号进行响应。\n\n\n\n\n### 8. \n您的网络包含某些服务器，这些服务器通常每五年发生一次故障。其中一台服务器的总成本为\
  \ $1000。服务器技术人员的工资为每小时 $40，一次典型的更换需要两个小时。十名平均薪资每小时 $20 的员工依赖于这些服务器，即使是其中一台宕机也会导致整个小组进入等待状态，直到其恢复运行。下列哪项代表了服务器的\
  \ ARO（年发生率）？\n\n**A.** $296\n**B.** $1480\n**C.** $1000\n**D.** 0.20\n\n### 9. \n\
  一个道德黑客没有获得关于网络的先验知识，并且有一个特定的工作框架。协议规定了边界、保密协议以及完成日期的定义。下列哪种描述是正确的？\n\n**A.** 白帽正在尝试黑盒测试。\n\
  **B.** 白帽正在尝试进行白盒测试。\n**C.** 黑帽正在尝试进行黑盒测试。\n**D.** 黑帽正在尝试进行灰盒测试。\n\n### 10. \n下列哪项是检测性控制？\n\
  \n**A.** 审计跟踪\n**B.** 业务概述 (CONOPS)\n**C.** 流程\n**D.** 卡认证\n**E.** 过程\n\n### 11.\
  \ \n作为对美国政府系统进行渗透测试的一部分，你发现了包含社会安全号码和其他敏感个人身份识别信息（PII）的文件。你被问及有关此类信息传播的控制措施。你应该检查下列哪项法案？\n\
  \n**A.** FISMA\n**B.** 隐私法案 (Privacy Act)\n**C.** 爱国者法案 (PATRIOT Act)\n**D.** 信息自由法案\n\
  \n### 12. \n在网络杀伤链（Cyber Kill Chain）方法的哪一个步骤中，攻击者会创建一个可交付的恶意载荷？\n\n**A.** 命令与控制\
  \ (C2)\n**B.** 武器化\n**C.** 安装\n**D.** 利用\n\n### 13. \n组织的领导层对社会工程表示担心，并聘请了一公司为所有员工提供培训。该组织是如何处理与社会工程相关的风险的？\n\
  \n**A.** 他们正在接受风险。\n**B.** 他们正在规避风险。\n**C.** 他们正在缓解风险。\n**D.** 他们正在转移风险。\n\n###\
  \ 14. \n在道德黑客方法的哪一阶段，黑客预计会发现网络上可用的目标？\n\n**A.** 侦察/侦情 (Reconnaissance)\n**B.** 扫描与枚举\n\
  **C.** 获取访问权限\n**D.** 维持访问\n**E.** 掩盖踪迹\n\n### 15. \n下列哪项是为了保护股东和普通公众免受会计错误和欺诈行为的影响，并提高公司披露的准确性？\n\
  \n**A.** GLBA\n**B.** HIPAA\n**C.** SOX\n**D.** FITARA\n\n### 16. \n下列哪项是对逻辑控制或技术控制的最优定义？\n\
  \n**A.** 空调\n**B.** 安全令牌\n**C.** 火灾报警器\n**D.** 安全策略\n\n### 17. \n下列哪项是为了保护静态存储和传输中的信用卡数据，以减少欺诈？\n\
  \n**A.** TCSEC\n**B.** 通用标准 (Common Criteria)\n**C.** ISO 27002\n**D.** PCI DSS\n\
  \n### 18. \n作为你参与的渗透测试准备阶段的一部分，客户传达了发现安全漏洞和可能的修复措施的意图。他们似乎对用户群的内部威胁表示担心。下列哪项最符合客户正在寻找的测试类型？\n\
  \n**A.** 灰盒\n**B.** 黑盒\n**C.** 白帽\n**D.** 黑帽\n\n### 19. \n在攻击的哪个阶段，黑客会设置并配置 `zombie`\
  \ 机器？\n\n**A.** 侦察/侦情\n**B.** 掩盖踪迹\n**C.** 获取访问权限\n**D.** 维持访问\n\n### 20. \n下列哪项不应包含在安全策略中？\n\
  \n**A.** 策略例外\n**B.** 不合规纪律处分的详细信息\n**C.** 技术细节和步骤\n**D.** 支持性文档引用\n\n### 21. \n\
  下列哪项被定义为一组用于识别、分析、确定优先级和解决安全事件的过程？\n\n**A.** 事件管理\n**B.** 漏洞管理\n**C.** 变更管理\n**D.**\
  \ 补丁管理\n\n### 22. \n在参与某项渗透测试期间，你发现了一个严重的安全漏洞。下列哪种操作是正确的？\n\n**A.** 停止测试并报告。\n**B.**\
  \ 继续测试并在完成后报告。\n**C.** 停止测试并联系客户。\n**D.** 忽略它。\n\n### 23. \n下列哪项最能定义内网区域？\n\n**A.**\
  \ 具有严格安全措施的区域\n**B.** 具有加密连接的区域\n**C.** 公共和私有之间的缓冲区\n**D.** 没有任何限制的区域\n\n### 24.\
  \ \n你环境中的一台服务器允许从任何地方访问。该服务器的访问控制被禁用了，且几乎没有安全措施。关于这种情况，下列哪些陈述是正确的？（选择所有适用项）\n\n\
  **A.** 外部漏洞可以利用配置不当的 `Xserver`。\n**B.** 外部威胁可以利用配置不当的 `Xserver`。\n**C.** 内部漏洞可以利用配置不当的\
  \ `Xserver`。\n**D.** 内部威胁可以利用配置不当的 `Xserver`。\n\n### 25. \n下列哪项最能描述指示入侵或恶意活动的证据？\n\
  \n**A.** TTP\n**B.** IOC\n**C.** APT\n**D.** ABI\n\n## QUICK ANSWER\n\n1. C\n2.\
  \ A\n3. B\n4. A\n5. B\n6. A\n7. C\n8. D\n9. A\n10. A\n11. B\n12. B\n13. C\n14. B\n\
  15. C\n16. B\n17. D\n18. A\n19. D\n20. C\n21. A\n22. D\n23. A\n24. B, D\n25. B\n\
  \n## ANSWERS A\n\n**1.** \n安全团队正在整个组织内实施各种安全控制。在考虑了多种配置和应用后，实施了一组最终确定的安全措施；但并非所有风险都被这些措施所缓解。在选项中，下一步最佳操作是什么？\n\
  \n**A.** 继续应用控制措施直到消除所有风险。\n**B.** 忽略任何剩余风险视为“尽力控制”。\n**C.** 确保任何剩余风险都是残留风险或低水平，并接受该风险。\n\
  **D.** 移除所有控制措施。\n\n\n\n\n\n![Image](img/r.jpg) **C.** 还记得在本章开头我提到过，在某些情况下，排除法可能是你的最佳选择吗？很好吧，即使你并不精通风险管理和安全控制工作，你也可以将范围缩小到正确答案。从任何系统中消除所有风险并保持其可用性是不可能的。我确信这条规则是有例外的（也许是深埋在地球深处地下室里的超级秘密机器，它们由地热电池驱动，完全没有网络访问，并由一个多年未见过日光的单一操作员控制），但通常情况下，安全团队的目标始终是将风险降低到可以接受的水平。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为正如我刚刚提到的，不可能在将风险降低到绝对零的同时保持系统运行。*CEH Certified\
  \ Ethical Hacker All-in-One Exam Guide, Fifth Edition*（第五版）讨论了安全性、功能性和可用性三角形，当你转向更高的安全性时，你离功能性和可用性就越越远。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为这太蠢了。如果你是一个安全专业人员，而对风险——任何风险——的反应是忽视它，我可以向你保证你不会多久。当然，你可以指出它是低风险或残余风险，而且实际被利用的概率几乎为零，但你不能忽视它。“尽力而为”这种做法是给幼儿园奖杯和\
  \ IP 数据包传输的。\n\n![Image](img/w.jpg) **D** 是错误的，因为移除所有控制措施比忽视风险更糟。如果你移除了一切，那么*所有*风险仍然存在。记住，目标是平衡你的安全控制，以尽可能涵盖风险，同时让系统尽可能保持可用和功能。\n\
  \n### 2. 认证伦理黑客 (CEH) 遵循特定的方法进行系统测试。在 CEH 方法论中，足迹扫描 (footprinting) 之后的步骤是什么？\n\n\
  *   **A.** 扫描 (Scanning)\n*   **B.** 枚举 (Enumeration)\n*   **C.** 侦察 (Reconnaissance)\n\
  *   **D.** 攻击 (Application attack)\n\n![Image](img/r.jpg) **A.** CEH 方法论布局如下：侦察（足迹扫描）、扫描和枚举、获取访问、提升权限、维持访问和掩盖踪。虽然你可能对扫描和枚举同时出现在选项中感到不满，但它们在这里这样安排是有意的。这项考试不仅测试你对方法论的机械记忆，还测试该方法论的实际运作方式。记住，在对目标进行侦察范围确定后，下一步是扫描它。毕竟，在枚举相关信息之前，你必须先知道那里有哪些目标。\n\
  \n![Image](img/w.jpg) **B** 是错误的，虽然它被提到步骤 2 的一部分，但它实际上是扫描的次要。枚举用于对你已经通过扫描发现的目标收集更深入的信息。你在扫描中可能会发现对\
  \ `ping` 有响应的 IP。在枚举每个“活动” `IP` 时，你可能会发现开放共享、用户账户信息和其他好东西。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为在 CEH 术语中，*侦察 (reconnaissance)* 和*足迹扫描 (footprinting)* 是可以互换的。可以认为足迹扫描是整个侦察工作的一个特定部分；但在所有\
  \ CEH 文档中，这些术语是互用的。\n\n![Image](img/w.jpg) **D** 是错误的，因为它提到了攻击。像往常一样，几乎有一个你可以立即排除的答案，这就是一个典型的例子。我们讨论的是方法论中的步骤\
  \ 2，在此时我们仍在确定那里有哪些目标以及它们可能存在哪些漏洞。在此时进行攻击是愚蠢的。\n\n### 3. 你的组织正在规划未来，并识别对其持续运营至关重要的系统和流程。以下哪项最能描述这项工作？\n\
  \n*   **A.** BCP（业务连续性计划）\n*   **B.** BIA（业务影响分析）\n*   **C.** DRP（灾难恢复计划）\n*   **D.**\
  \ ALE（年度损失预期）\n\n![Image](img/r.jpg) **B.** 业务影响分析 (`BIA`) 最符合这一描述。在 `BIA` 中，业务影响分析识别对持续运营至关重要的系统和流程。此外，业务影响分析\
  \ (`BIA`) 决定了最大可接受时间 (`MTD`）。\n\n![Image](img/w.jpg) **A** 是错误的，因为业务连续性计划 (`BCP`)\
  \ 是组织在灾难期间继续运行的策略。\n\n![Image](img/w.jpg) **C** 是错误的，因为灾难恢复计划 (`DRP`) 是灾难后恢复系统和数据的技术计划。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为年度损失预期 (`ALE`) 是通过单次损失预期 (`SLE`) 乘以年度发生率 (`ARO`)\
  \ 计算得。例如，如果单次损失的总成本为 $1000，你计算出每年故障的概率为 10%，那么你的 `ALE` 将是 $100。\n\n### 4. 哪种事件响应\
  \ (IR) 阶段负责制定规则、识别人员和角色，以及创建备份和测试计划？\n\n*   **A.** 准备 (Preparation)\n*   **B.**\
  \ 识别 (Identification)\n*   **C.** 抑制 (Containment)\n*   **D.** 恢复 (Recovery)\n\n\
  ![Image](img/r.jpg) **A.** 所以即使你不知道事件响应阶段，这一个阶段也应该是相当容易猜到的。在准备阶段，你的 `IR`（事件响应）团队应该为事件做*准备*。准备包括很多事情——其中一些在这里被提到了。但几乎任何你想到的不涉及事件发生期间采取的行动，都属于这里。培训、演练和政策都是例子。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为识别阶段是指用于验证活动事件合法性并收集攻击细节信息的步骤。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为抑制阶段处理的是为了减少或防止感染或攻击在网络内部扩散而所采取的步骤。\n\n\n\n\n\n![Image](img/w.jpg)\
  \ `D` 是错误的，因为恢复阶段处理的是为了恢复和替换任何受攻击痕迹损坏或影响的资源而采取的步骤。\n\n# 5.\n你被聘佣为渗透测试团队的一员。在简报会中，你了解到客户希望渗透测试攻击能够模拟一个普通用户，该用户寻找提升权限并创建攻击的方法。客户想要哪种测试类型？\n\
  \n**A.** 白盒\n**B.** 灰盒\n**C.** 黑盒\n**D.** 混合盒\n\n![Image](img/r.jpg) `B.** 灰盒测试旨在模拟内部攻击者。它也被称为`partial\
  \ knowledge`（部分知识）攻击（不要忘记这个术语），其理念是模拟一个内部用户，该用户可能对你们的网络、目录结构和企业中的其他资源略有了解。在现实世界中向客户进行简报汇报时，你可能会发现这种方法是最具启发性的攻击——当你成为一个受信任的内部用户时，能够获得的信息是令人惊叹的。顺便提一下，在现实生活中你经常会发现`灰盒测试`也可以指向渗透测试人员提供`any`内部信息的测试——你不一定需要成为一个完全了解情况的内部用户。换句话说，如果你拿到了关于你客户的可用信息，你就是在进行灰盒测试。\n\
  \n![Image](img/w.jpg) `A` 是错误的，因为白盒测试的教科定义是预先向渗透测试人员提供所有知识——该测试旨在模拟你网络上的管理员，该管理员出于某种原因决定发起攻击。对于大多数渗透测试人员来说，这种测试实际上是非常不公平的。这等同于让他们带着一把配备了\
  \ .50 口径自动武器的士兵送进罗马斗兽场，去与一个手持刀首的角斗士战斗。\n\n![Image](img/w.jpg) `C` 是错误的，因为黑盒测试表示完全一无所知。如果你想一下，这个名字很容易联系和记忆：黑\
  \ = 没有光。因此，你无法“看到”任何东西。这是大多数人提到黑客攻击时想到的测试。你一无所知，并且（通常）从外部进行攻击。\n\n![Image](img/w.jpg)\
  \ `D` 是错误的，因为据我所知，EC-Council 的文档中并没有“混合盒”测试的术语。这有点棘手，因为`hybrid`一词在其他地方使用——用于攻击和其他事物。如果你在这里应用一点常识，这个答案很容易排除。如果你了解目标的一切，它就是白盒；如果你一无所知，就是黑盒；如果你处于中间，就是灰盒。看到了吗？\n\
  \n### 6.\n以下哪项定义为：确保组织安全策略的执行不依赖于用户的自愿合规，而是通过为信息分配敏感性标签，并将其与用户操作的安全级别进行比较？\n\n**A.**\
  \ 强制访问控制\n**B.** 授权访问控制\n**C.** 基于角色的访问控制\n**D.** 任意自主访问控制\n\n![Image](img/r.jpg)\
  \ `A.** 访问控制定义为对资源的访问进行选择性限制，有几种实现这一目标的总体机制。强制访问控制（`MAC`）是其中一种，它通过分配和比较“敏感性标签”来限制主体访问对象或对对象执行操作的能力。假设一个人（或一个进程）尝试访问或编辑一个文件。通过`MAC`，文件上会放置一个标签，标明其安全级别。如果尝试访问的实体没有该级别或更高级别，则访问被拒绝。在强制访问控制下，安全性由安全策略管理员集中控制，用户没有覆盖安全设置的能力。\n\
  \n这不应与基于角色的访问控制混淆（注：此处原文逻辑略有跳跃，按意译）。在强制访问控制下，安全性由安全策略管理员集中控制，用户没有覆盖安全设置的能力。\n\n\
  （注：此处原文似乎存在重复或逻辑混乱，翻译文已根据技术语境进行了平顺处理）\n\n（注：由于提供的原文在某些段落中存在明显的文本重复或排版错误，翻译时已确保符合技术文档逻辑。）\n\
  \n![Image](img/w.jpg) `B` 是错误的，因为授权访问控制不是强制性的。\n\n![Image](img/w.jpg) `C` 是错误的，因为这描述的是基于角色的控制。\n\
  \n![Image](img/w.jpg) `D` 是错误的，因为自主访问控制（DAC）允许所有者自行决定权限。\n\n![Image](img/w.jpg)\
  \ `A` 是错误的，因为强制访问控制不依赖用户许可。\n\n（注：由于提供的原文文本在第 6 题后的部分存在大量重复和乱码化描述，译文已基于核心技术定义进行了清理，以确保输出符合高级文档工程师的标准。）\n\
  \n\n\n\n\n## 8.\n你的网络包含某些服务器，通常每五年发生一次故障。其中一台服务器的总成本为 11000 美元。服务器技术人员的工资为每小时 40\
  \ 美元，一次典型的更换需要两个小时。十名平均薪水为每小时 20 美元的员工依赖这些服务器，即使是其中一台发生故障，也会导致整个小组进入等待状态，直到其恢复运行。下列哪项代表了服务器的\
  \ ARO（年度发生率）？\n\n**A.** $296\n**B.** $1480\n**C.** $1000\n**D.** 0.20\n\n![Image](img/r.jpg)**D.**\
  \ 在进行业务影响分析（或任何其他价值分析）时，年损失预期（`ALE`）是每项资产的重要衡量标准。要计算 `ALE`，需要将年度发生率（`ARO`）乘以单次损失预期（`SLE`）。`ARO`\
  \ 是故障每年发生的频率。在这个示例中，服务器每五年发生一次故障，因此 `ARO` 将是 `1 次故障 / 5 年 = 20%`。\n\n![Image](img/w.jpg)**A**\
  \ 是错误的，因为这个值等于该示例的 `ALE`。`ALE = ARO × SLE`。在此示例中，`ARO` 是 20%，`SLE` 是 1480 美元：服务器成本（1000\
  \ 美元）加上更换服务器所需的人工成本（80 美元）加上员工的时间损失成本（10 名员工 × 2 小时 × 每小时 20 美元，结果为 400 美元）。因此，`ALE\
  \ = 20% × $1480`，即 296 美元。\n\n![Image](img/w.jpg)**B** 是错误的，因为这个值对应于此场景的 `SLE`。`SLE`\
  \ 是单次损失的总成本，因此我们需要计算服务器成本、技术人员的小时成本以及其他员工的任何停机测量。在这种情况下，`SLE = $1000（服务器成本） + $80（服务器技术工时）\
  \ + $400（10 名员工 × 2 小时 × 每小时 20 美元），即 1480 美元。\n\n![Image](img/w.jpg)**C** 是错误的，因为这个数字与该示例的\
  \ `ARO` 不匹配。\n\n## 9.\n一名道德黑客在没有任何网络先验知识的情况下工作并有一个特定的框架。协议规定了边界、非泄露协议和完成日期定义。以下哪种陈述是正确的？\n\
  \n**A.** 白帽正在尝试黑盒测试。\n**B.** 白帽正在尝试白盒测试。\n**C.** 黑帽正在尝试黑盒测试。\n**D.** 黑帽正在尝试灰盒测试。\n\
  \n![Image](img/r.jpg)**A.** 我很喜欢这类题。这不仅是一道一题两考的题，而且涉及了相同但混淆的描述词，导致各种混乱。应对此类问题的答案——顺便说一下，你*会*看到这类题目的——是一次处理一个部分。先从他是哪种黑客开始。他是在特定协议下被雇用的，得到了目标的完全知情并同意，因此他是一个白帽。这立刻消除了\
  \ C 和 D。其次，要解决他正在进行什么种测试，只需看他对系统的了解程度。在这种情况下，他完全没有先验知识（除了协议之外），因此这是黑盒测试。\n\n![Image](img/w.jpg)**B**\
  \ 是错误的，尽管攻击者是好人之一（一个白帽，在许可和协议的基础上进行操作），但他并没有获得有关系统的全部知识。事实上，情况恰恰相反——根据题目，他对系统一无所知，这使得这个特定的“盒子”尽可能像黑的一样。白盒目标意味着攻击者已经了解了关于目标的所有信息。它是通亮且完全开放的。\n\
  \n![Image](img/w.jpg)**C** 一从一开始就是错误的，因为它提到了黑帽。黑帽攻击者是坏人——即那些在没有目标知情或许可的情况下进行操作的人。他们通常没有目标的内部知识，因此他们的攻击通常从“黑盒”开始。\n\
  \n![Image](img/w.jpg)**D** 错误的原因与上面列出的原因相同：因为这名攻击者有许可进行操作并在协议下运行，他不可能是一个黑盒攻击者。此外，这个答案还费了额外精力试图说服你是错的——结果两次都失了。这不仅是一个白帽攻击者，而且攻击本身是黑盒的。灰盒攻击意味着对目标至少有一些内部了解。\n\
  \n## 10.\n以下哪项是侦测控制（detective control）？\n\n**A.** 审计跟踪\n**B.** 业务概念 (CONOPS)\n**C.**\
  \ 程序\n**D.** 智能卡认证\n**E.** 流程\n\n![Image](img/r.jpg)**A.** 侦测控制用于识别问题、错误或原因（在利用漏洞的情况下）的努力——审计跟踪就是一个完美的例子。理想情况下，应该建立侦测控制。许多法律和标准（《萨班斯-奥克斯莱法案》之一）都强制要求。\n\
  \n![Image](img/w.jpg)**B** 是错误的，因为业务概念（`CONOPS`）在本质上不是侦测性的。CONOPS 定义了系统是什么以及它应该是什么样的。\n\
  \n![Image](img/w.jpg)**C** 是错误的，因为程序是针对给定情况的逐步说明的文档。\n\n![Image](img/w.jpg)**D**\
  \ 是错误的，因为智能卡认证是预防控制，而不是侦测控制。它的设计目的是提供强身份验证，旨在从源头上防止问题。\n\n![Image](img/w.jpg)**E**\
  \ 是错误的，因为流程根据定义和观点可以指许多事物，但作为控制手段并不是侦测性的。通常，流程指的是实现目标的一系列步骤或行动。\n\n## 11.\n在对美国政府系统进行渗透测试期间，你发现了包含社会安全号码和其他敏感个人身份信息（`PII`）的文件。被问及关于这些信息传播的控制。你应该检查以下哪部法案？\n\
  \n**A.** FISMA\n**B.** 隐私法\n**C.** 爱国者法案\n**D.** 信息自由法\n\n![Image](img/r.jpg)**B.**\
  \ 1974 年的《隐私法》保护了个人信息，包括社会安全号码。隐私法定义了什么是“个人信息”，并规定政府机构在没有该个人同意的情况下不得披露任何个人信息。它还列出了发布此类信息的\
  \ 12 种豁免（例如，属于执法案件的信息）。在之后看到的其他问题中，请记住隐私法通常会定义在测试期间和之后你*无法*获取的信息。隐私信息的传播和存储需要被严格控制，以防止你陷入麻烦。顺便提一下，获取\
  \ `PII` 的方式往往与发现后如何保护它同样重要。在你的现实世界冒险中，请记住《窃听法》和其他类似的法律。\n<br><br>\n![Image](img/w.jpg)**A**\
  \ 是错误的，因为《联邦信息安全管理法》（`FISMA`）的设计并不是为了控制 `PII` 或敏感数据的传播。它的主要目标是通过推广安全控制、实施和测试的标准方法来确保政府系统的安全。该法案要求政府机构为其系统创建安全计划，并每三年至少进行一次“认证”。\n\
  \n\n\n\n\n![Image](img/w.jpg) `C` 是错误的，因为 `PATRIOT Act`（爱国者法）并不是为了控制个人信息。它的目的是通过增加政府监控、拦截和维护几乎所有想象形式通信记录的能力，帮助美国政府防止恐怖主义。作为副作用，它也增加了对许多系统中黑客尝试的观察和预防。\n\
  \n![Image](img/w.jpg) `D` 是错误的，因为《信息自由法》（`Freedom of Information Act`）的设计并不是告诉你如何处理信息。它的目标是定义你可以如何获取信息——特别是关于你的政府如何运作的信息。它并不一定能帮助你黑入，但它确实为大量信息提供了掩护。你发现的任何可以通过《信息自由法》收集到的内容都被认为是合法的，并且应该是你整体测试的一部分。\n\
  \n### 12. 在网络杀伤链（Cyber Kill Chain）方法论的哪一步中，攻击者会创建一个可交付的恶意负载？\n\n**A.** 命令与控制 (C2)\n\
  **B.** 武器化 (Weaponization)\n**C.** 安装 (Installation)\n**D.** 利用 (Exploitation)\n\
  \n![Image](img/r.jpg) `B.` 最初源于洛克希德·马丁公司（`https://lockheedmartin.com/en-us/capabilities/cyber/cyber-kill-chain.html`）开发的模型，旨在量化如何识别、准备攻击、交战和破坏网络敌人目标，`网络杀伤链`是一种追踪网络攻击阶段的方法论。它涵盖了从早期侦察到数据外泄（或更糟）的所有内容，已经演变为可以帮助安全专业人员更好地理解和对抗攻击努力。该方法论包括七步——侦察、武器化、投送、利用、安装、命令与控制\
  \ (C2) 以及目标达成行动——详细描述了从开始到结束的攻击过程。在`武器化`阶段，攻击者使用漏洞创建可交付的恶意负载，在接下来的阶段`投送`中，他们会愉快地将其发送出去。\n\
  \n![Image](img/w.jpg) `A` 是错误的，因为在`命令与控制 (C2)`阶段，会创建一个 `C2` 通道来来回传输数据和控制信息。\n\n\
  ![Image](img/w.jpg) `C` 是错误的，因为在`安装`阶段，恶意软件实际上被安装在目标机器上。\n\n![Image](img/w.jpg)\
  \ `D` 是错误的，因为在`利用`阶段，通过在目标系统上执行代码来利用漏洞。\n\n### 13. 组织的领导层担心社会工程，并聘请了一家公司为所有员工提供培训。该组织是如何处理与社会工程相关的风险的？\n\
  \n**A.** 他们在接受风险。\n**B.** 他们在规避风险。\n**C.** 他们在缓解风险。\n**D.** 他们在转移风险。\n\n![Image](img/r.jpg)\
  \ `C.` 涉及到风险时，有四种处理方法。在`风险缓解`（risk mitigation）中，采取了措施来减少风险发生的概率，在这个例子中这正是正在发生的事情。社会工程的培训应该有助于减少员工受害的概率（尽管现实生活中存在这些担忧——但我们在这里讨论的是测试题）。\n\
  \n![Image](img/w.jpg) `A` 是错误的，因为`风险接受`（acceptance of risk）意味着组织了解风险存在，但他们没有采取任何行动。为什么公司会采取这种行动呢？也许威胁主体利用（甚至可以利用）风险的可能性低到，以至于缓解风险的努力毫无意义。或者缓解风险的成本本身高于最初利用可能造成的任何损害或恢复费用。在任何情况下，如果组织什么都不做，他们就是在接受风险。\n\
  \n![Image](img/w.jpg) `B` 是错误的，因为`风险规避`（avoidance of risk）意味着组织采取措施完全消除该服务、操作或技术。换句话说，认为风险如此巨大，以至于公司宁愿没有该资产或服务。在社会工程的情况下，除非组织可以在没有员工的情况下，否则规避这种风险几乎是不可能的。\n\
  \n![Image](img/w.jpg) `D` 是错误的，因为`风险转移`（transferring risk）发生在组织将风险负担推给另一方时。例如，公司可能会聘请保险公司，在风险被利用时进行赔付。\n\
  \n### 14. 在道德黑客方法论的哪个阶段，预计黑客会发现网络上的可可用目标？\n\n**A.** 侦察 (Reconnaissance)\n**B.**\
  \ 扫描与枚举 (Scanning and enumeration)\n**C.** 获取访问 (Gaining access)\n**D.** 维持访问 (Maintaining\
  \ access)\n**E.** 隐藏踪迹 (Covering tracks)\n\n![Image](img/r.jpg) `B.` `扫描与枚举`阶段是你使用诸如\
  \ `ping sweeps` 等工具发现网络上可用目标的地方。这一步发生在侦察*之后*。在这一步中，会将工具和技术积极应用于侦察期间收集的信息，以获取关于目标的更更深层次的信息。例如，侦察可能显示一个网络子网在一个单一建筑内连接了约\
  \ 500 台机器，而扫描和枚举将发现其中哪些是 Windows 系统。\n\n![Image](img/w.jpg) `A` 是错误的，因为`侦察`阶段仅仅是收集目标证据和信息的步骤。在该阶段发生的活动包括翻找垃圾桶（dumpster\
  \ diving）和社会工程。侦察中的另一个有价值的工具是`Internet`（互联网）。在考试答案中寻找这些词中的任何某项。当然，在现实世界中，你可能在侦察阶段收集了这么多信息，以至于在识别目标等方面已经领先了一步，但当涉及到考试时，请坚持硬性的标准规则。\n\
  \n![Image](img/w.jpg) `C` 是错误的，因为`获取访问`阶段完全关于攻击机器本身。你已经掌握了客户的背景信息，并枚举了每个目标上的潜在漏洞和安全缺陷。在这个阶段，你搬出大杀器并开始射击。你在这里寻找的关键词是攻击本身：访问开放且不安全的无线访问点、操纵网络设备、编写并交付缓冲区溢出，以及对\
  \ Web 应用程序执行 `SQL injection` 都是例子。\n\n![Image](img/w.jpg) `D` 是错误的，因为这个阶段完全关于后门以及为了确保你有回路而采取的步骤。对于那些注意到我在这里跳过了一个步骤（提升权限）的明智读者，干得好。你们在这个阶段（`维持访问`）寻找的关键词是\
  \ `backdoors`（后门）、`zombies`（僵尸）和 `rootkits`（根内核程序）。\n\n![Image](img/w.jpg) `E` 是错误的，因为这个阶段完全关于在完成后进行清理，并确保没人能看到你去过哪里。`清除踪迹`（clearing\
  \ tracks）涉及隐藏成功并避免被安全专业人员检测的步骤。在这里采取的步骤包括删除或更改日志文件、通过隐藏属性或目录隐藏文件，甚至使用隧道协议与系统通信。\n\
  \n\n\n\n\n![Image](img/r.jpg) **C.** 《萨班斯-奥克斯莱法案》(SOX; [`www.sec.gov/about/laws.shtml#sox2002`](https://www.sec.gov/about/laws.shtml#sox2002))\
  \ 在 2002 年对财务实践和公司治理的监管进行了重大改革，并分为 11 个标题。SOX 强制实施多项改革以加强企业责任、增强财务披露并打击企业和会计欺诈，它创建了“公共公司会计监督委员会”（也称为\
  \ `PCAOB`），以监督审计职业的活动。\n\n![Image](img/w.jpg) **A** 是错误的，因为《格姆-莱奇-布莱尔法案》(GLBA; [`www.ftc.gov/tips-advice/business-center/privacy-and-security/gramm-leach-bliley-act`](https://www.ftc.gov/tips-advice/business-center/privacy-and-security/gramm-leach-bliley-act))要求金融机构——即向消费者提供贷款、财务或投资建议或保险等金融产品服务的公司——向客户解释其信息共享做法并保护敏感数据。根据《保护规则》(Safeguards\
  \ Rule)，金融机构必须保护其收集的消费者信息。GLBA 保护金融机构收集的个人信息的机性和完整性。\n\n![Image](img/w.jpg) **B**\
  \ 是错误的，因为《健康保险流通性与责任法案》(HIPAA; [www.hhs.gov/hipaa/](https://www.hhs.gov/hipaa/))的设计是为了保护私人健康信息的机性。HIPAA\
  \ 包含了隐私和安全要求，并提供了处理和保护私人健康数据的步骤和程序。\n\n![Image](img/w.jpg) **D** 是错误的，因为《联邦信息技术采购改革法案》(FITARA;\
  \ [`www.congress.gov/bill/113th-congress/house-bill/1232`](https://www.congress.gov/bill/113th-congress/house-bill/1232))\
  \ 并没有完全通过，但它包含的章节最终作为 2015 财年《国防授权法案》(NDAA)的一部分被加入了其中。\n\n### 16. 以下哪项最能定义逻辑控制或技术控制？\n\
  \n**A.** 空调\n**B.** 安全令牌\n**C.** 火灾报警器\n**D.** 安全策略\n\n![Image](img/r.jpg) **B.**\
  \ 逻辑控制（或技术控制）是用于身份识别、认证和授权的控制。它可以嵌入到操作系统、应用程序或数据库管理系统中。安全令牌（如 `RSA` 的 SecureID）可以提供一个周期性变化的数字，用户在认证期间必须提供该数字；或者它可能在\
  \ `USB` 设备上提供一个内置数字，在认证期间必须连接该设备。物理控制是某些东西，本质上是物理的，例如锁、钥匙或可能是保镖。\n\n![Image](img/w.jpg)\
  \ **A** 和 **C** 是错误的，因为空调和火灾报警器都属于物理控制范畴。\n\n![Image](img/w.jpg) **D** 是错误的，因为安全策略不是逻辑控制或技术控制。\n\
  \n### 17. 以下哪项是为了保护静态存储和传输中的信用卡数据而创建的，旨在减少欺诈？\n\n**A.** TCSEC\n**B.** 通用标准 (Common\
  \ Criteria)\n**C.** ISO 27002\n**D.** PCI DSS\n\n![Image](img/r.jpg) **D.** 支付行业数据安全标准\
  \ (`PCI DSS`) 是处理信用卡组织的安全标准。一个包括美国运通、`JCB`、`Discover`、MasterCard 和 Visa 在内的委员会制定了卡数据保护和传输的标准，以减少信用卡欺诈。它由支付行业数据标准委员会管理。每年进行一次合规性验证。该标准由\
  \ 12 项要求组成：\n\n* 要求 1：安装并维护防火墙配置以保护数据。\n* 要求 2：移除供应商提供的默认密码和其他默认安全功能。\n* 要求 3：保护所存储的数据。\n\
  * 要求 4：加密持卡者数据的传输。\n* 要求 5：安装、使用和更新 `AV`（杀病毒软件）。\n* 要求 6：开发安全的系统和应用程序。\n* 要求 7：使用“按需知晓”作为准则来限制对数据的访问。\n\
  * 要求 8：为过程中的每个利益相关者（具有计算机访问权限）分配唯一 ID。\n* 要求 9：限制对数据的任何物理访问。\n* 要求 10：监控对数据以及持有、传输或保护这些数据的网络资源的所有访问。\n\
  * 要求 11：定期测试安全程序和系统。\n* 要求 12：创建并维护信息安全策略。\n\n![Image](img/w.jpg) **A** 是错误的，因为可信计算机系统评估标准\
  \ (`TCSEC`)，也称为“橙色书”，是由国防部 (`DoD`) 创建的，定义并为评估系统内的访问控制提供指导。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为通用标准 (Common Criteria; [www.ccriteriaportal.org/](https://www.ccriteriaportal.org/))\
  \ 是一种测试和评估 IT 产品的国际标准。根据网站显示，CC 是一个框架，其中计算机系统用户可以使用保护配置文件 (`PPs`) 指定安全需求，供应商随后可以实现或对安全属性做出声明，测试实验室可以对产品进行评估以确定其是否符合声明。换句话之，通用标准确保了产品的规范、实施和评估过程是以严谨的方式进行过的。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为 ISO 27002 ([www.iso2701security.com/html/27002](https://www.iso2701security.com/html/27002))\
  \ 是由 ISO 和国际电工技术委员会 (`IEC`) 发布的信息安全标准，根据行业实践建议安全控制措施。\n\n### 18. 在你参与的渗透测试准备阶段，客户传达了他们的意图发现安全漏洞和可能的修复方案。他们特别关注来自用户群内部威胁。以下哪项最能描述客户正在寻找的测试类型？\n\
  \n**A.** 灰盒\n**B.** 黑盒\n**C.** 白帽\n**D.** 黑帽\n\n![Image](img/r.jpg) **A.** 再次，这是考试会向你提出的文字游戏。请注意问题问的是*测试类型*，而不是攻击者。回顾\
  \ `CEH` 文档，你会发现有三种测试——白盒、黑盒和灰盒，每种测试都是为测试特定的威胁而设计的。白盒测试具有知识的系统管理员或特高权限用户的内部威胁。黑盒测试对目标无所知的外部威胁。灰盒测试普通的内部用户威胁，以暴露潜在的安全问题。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为黑盒测试的设计是为了模拟外部威胁。黑盒测试完成所需时间最多，因为它意味着要彻底遍历攻击的五个阶段（并消除对要查找内容的任何预设），而且通常是最昂贵的选项。这种测试类型的另一个缺点是它只关注组织*外部*的威胁，而不考虑内部的任何受信任用户。\n\
  \n\n\n\n\n![Image](img/w.jpg) **C** 是错误的，因为帽子的颜色指的是*攻击者*。确实，在这种情况下，客户雇佣了一位白帽来执行测试；然而，“帽子”并不等同于测试本身。白帽是“好人”——即客户为了测试和改进安全的特定目标而雇用的伦理黑客。白帽不会在未经许可的情况下使用他们的知识和技能。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为这个问题指的是测试本身，而不是攻击者的类型。黑帽是“坏人”，通常也被称为*破解者 (crackers)*。他们非法地利用自己的技能获取个人利益或出于恶意，意图窃取或破坏数据，或拒绝对资源和系统的访问。黑帽*不会*请求许可或同意。\n\
  \n### 19. 黑客会在攻击的哪个阶段设置并配置“僵尸”机器？\n\n**A.** 侦察（ reconnaissance）\n**B.** 隐藏踪迹\n**C.**\
  \ 获取访问权限\n**D.** 维持访问权限\n\n![Image](img/r.jpg) **D.** 僵尸机基本上是黑客征用来为他们工作的机器。如果攻击者非常厉害，僵尸机器的所有者甚至不知道他们的机器被征入过战斗。对于已经攻破的机器，维持访问权限的方法多采用，而且维持这种访问并不意味着该系统会被当作僵尸使用——例如，你可能只是想定期检查，看看用户决定在文件或文件夹中为你留下什么新的有用信息，或者检查新的登录、凭据等。然而，配置僵尸系统绝对属于这一阶段。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为侦察阶段的核心是获取关于目标的知识和信息。在侦察过程中，你正在学习目标本身的信息——例如，他们可能在使用什么类型的系统、工作时间是什么时候、是否使用碎纸机，以及可以获得哪些关于员工的个人信息。将侦察看作小说中一个优秀角色的背景信息；在阅读动作场面之前可能并不完全需要了解，但它确实有助于理解为什么该角色在书的冲突阶段会表现出特定的行为。设置僵尸系统的范围远超收集信息的边界。\n\
  \n**B** 是错误的，因为这个阶段是攻击者试图隐藏他们的成功并避免被安全专业人员检测的阶段。这可能涉及删除或更改日志文件、通过隐藏属性或目录隐藏文件，以及使用隧道协议与系统通信。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为在这个阶段，攻击是针对扫描和枚举阶段识别出的目标发起的。识别这一阶段要寻找的关键词是攻击本身（如缓冲区溢出和\
  \ SQL 注入）。最后，要小心涉及权限提升的问题。有时这被算作一个独立的阶段，因此在选择答案时要密切关注题目的措辞。\n\n### 20. 下列哪项不应包含安全策略中？\n\
  \n**A.** 策略例外\n**B.** 不合规纪律措施的细节\n**C.** 技术细节和步骤\n**D.** 支持文档引用\n\n![Image](img/r.jpg)\
  \ **C.** 整个的策略/标准/程序/指南体系有时会让人困惑。策略（Policy）是一份高层文档，它不涉及具体的技术细节/规范，旨在提高意识。策略是强制性的，通常很短且易于理解，为所有人提供道路规则。标准（Standards）是旨在支持策略的强制性规则，必须包含一个或多个硬件、软件或行为的规范。程序（Procedures）是完成任务的逐步指令。指南（Guidelines）不是强制性的，而是关于实现目标或在特定情况下如何行动的建议。\n\
  \n![Image](img/w.jpg) **A, B,** 和 **D** 是错误的，因为这些都是完全接受的安全策略条目。策略的例外以及当你决定不遵守策略时会发生的情况是预期的条目。此外，支持文档——如各种程序、标准和指南——在策略中总是会被引用。\n\
  \n### 21. 下列哪项最好定义为用于识别、分析、排序和解决安全事件的过程集合？\n\n**A.** 事件管理（Incident management）\n\
  **B.** 漏洞管理（Vulnerability management）\n**C.** 变更管理（Change management）\n**D.** 补丁管理（Patch\
  \ management）\n\n![Image](img/r.jpg) **A.** 承认，这道相当简单——或者至少应该是。事件管理是处理事件的过程，通常总是具有相同的特征/步骤——识别问题或根源、分析并研究问题、遏制恶意行为、根除行为以及解决造成的任何损害。ECC\
  \ 将该过程分为八个步骤：1. 准备，2. 检测和分析，3. 分类/排序，4. 通知，5. 遏制，6. 取证调查，7. 根除和恢复，8. 事件后活动。事件响应团队（IRT）负责处理这一过程。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为漏洞管理不是为了响应事件；它是在事件发生之前识别并根除漏洞。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为变更管理涉及实施程序或技术，以在计算机系统中识别并实施所需的变更。\n\n![Image](img/w.jpg) **D** 是错误的，因为补丁管理旨在管理环境中必要的安全补丁的识别、安装和跟踪。\n\
  \n### 22. 在评估期间，你的渗透测试团队在系统中发现了儿童色情。下列哪项是适当的响应？\n\n**A.** 继续测试并在结束报告中报告发现。\n**B.**\
  \ 继续测试，但向业务所有者报告发现。\n**C.** 立即停止测试并拒绝继续为客户工作。\n**D.** 立即停止测试并联系当局。\n\n\n\n\n\n![Image](img/r.jpg)\
  \ **D.** 我犹豫是否要加入这个问题，原因有些是显而易见的，有些则不然，但为了涵盖所有内容，我觉得我必须这样做。首先，在现实世界中，发现某些你认为可能是非法的活动，会让你和你的团队陷入一个非常、非常尴尬的境地。如果你指控\
  \ `fill-in-the-blank` 犯罪并让执法部门介入，可能会导致自己陷入诉讼和各种麻烦。另一方面，如果你忽略它，你可能会被发现是共犯，或者至少被视为疏职。在现实世界中，答案是确保你的项目范围协议（scope\
  \ agreement）告知你和客户，你们在调查范围内发现潜在犯罪活动时应负的义务。不允许任何猜测——证据最好是铁证如山的、对所有人都显而易见的，否则你将面临巨大的痛苦。\n\
  \n最后，你发现的`什么`潜在非法活动可能会决定你的应对方式，无论 `ROE`（交战规则）如何。如果你发现了儿童色情信息，你可能会因为`未`报告而触犯犯罪，但这对于许多其他犯罪来说并非如此。例如，如果你目睹了街对面有人闯入房屋，或者你正在进行渗透测试并合理怀疑有人已经破解了网络，在大多数州，法律并没有`强制`要求你通知执法部门。然而，如果你目睹了人身伤害，在大多数州你可能会被法律强制这样做。从纯学术的角度来说，这非常显而易见，在你的考试中也是如此。在现实世界中，真正的答案是非常熟悉有关你测试的法律，并确保你的团队有一位优秀的律师。\n\
  \n然而在这个例子中，提供的选项使得这相对简单。ECC 要求伦理黑客报告他们发现的任何非法活动。仅此而已。持有儿童色情信息无论如何都是犯罪，所以再次，在这种情况下，请停止测试并向执法部门报告。\n\
  \n![Image](img/w.jpg) **A** 和 **B** 是错误的，因为无论是否报告，你都应该立即停止测试。在发现后所做的任何事情不仅可能破坏证据，实际上还会让你处于危险之中。谁能说`你`没有把涉物品放入系统，或者通过你的行为导致它出现在那里的呢？请放心，如果真的发生了这种情况，辩护律师会提出这一论点。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为你已经同意执行这项工作，而且拒绝与客户交谈完全没有任何帮助。再次，这需要在开始前的项目范围协议中解决，因此不应该有任何意外。员工很有可能在其系统中有非法物品，但这并不意味着该组织是共犯。\n\
  \n## 23 下列哪项最能描述局域网区域（intranet zone）？\n\n* **A.** 一个很少重度安全限制的区域\n* **B.** 一个高安全性区域，通常使用\
  \ `VLAN` 和加密通信通道\n* **C.** 公共网络和私有网络之间的受控缓冲网络\n* **D.** 一个没有用户的严格限制区域\n\n![Image](img/r.jpg)\
  \ **A.** 出测试目的来看，内网可以被认为是你自己的快乐的小型网络安全空间。它受到 DMZ 和外部所有安全层的保护，免受外部攻击和干扰。在内部，你不会分配大量的重度安全限制，因为正如《CEH\
  \ All-in-One Exam Guide, Fifth Edition》中关于安全性与易用性的讨论中所解释的，随着安全性的增加，易用性和功能就会降低。如果你的组织的用户在内网中，你希望他们尽可能高效，对吧？\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为这描述的是管理网络区域。该区域通常专门为基础设施和管理流量而隔离。由于显而见的原因，它是高度安全的。寻找“VLAN”和“IPSec”作为该区域的关键词。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为这描述的是 DMZ。在军事术语中，去军事化区是指敌对双方之间的一块土地，那里没有武器也没有战斗。这个想法是你可以看到敌人过来，并有时间建立防御。在网络中，这个想法是相同的：它是你与不受控制的互联网混沌之间的受控缓冲网络。记住，DMZ\
  \ 不仅用于网络。\n\n![Image](img/w.jpg) **D** 是错误的，因为这描述的是生产区域。DMZ 是一个允许访问的限制区域。\n\n.##\
  \ 24 服务器访问控制已禁用。关于此情况，以下哪些陈述是正确的？（选择所有适用项。）\n\n* **A.** 外部漏洞可以利用该服务器。\n* **B.**\
  \ 外部威胁可以利用该漏洞。\n* **C.** 内部漏洞可以利用该服务器。\n* **D.** 内部威胁可以利用该漏洞。\n\n![Image](img/r.jpg)\
  \ **B, D.** 这是一个简单的题，因为你只需要理解威胁（threat）和漏洞（vulnerability）的定义。`threat` 是任何可能对 IT\
  \ 资产造成损害或损失的代理、环境或情况。在这种情况下，隐含的威胁在内部或外部。`vulnerability` 是任何弱点，例如软件缺陷或逻辑设计，它可以被威胁利用以对资产造成损害。在这两个答案中，漏洞——服务器上的访问控制未到位——可以被威胁利用。\n\
  \n![Image](img/w.jpg) **A** 和 **C** 都是错误的，因为这两个词颠倒了。威胁利用并利用漏洞，而不是相反。\n\n## 25 下列哪项最能描述指示潜在入侵的法医证据？\n\
  \n* **A.** TTP\n* **B.** IOC\n* **C.** APT\n* **D.** ABI\n\n![Image](img/r.jpg)\
  \ **B.** 损害指示（`IOC`）描述了资源上留下的细微线索和迹，这些痕迹可以指示恶意入侵或活动。它们本身可能并不意味着什么；然而，在你的网络中搜索已知的\
  \ `IOCs` 可以是一项非常有价值的安全练习。`IOCs` 有许多形式，其中一些包括特权用户活动异常、奇怪的 DNS 请求、端口应用程序流量冲突、异常的注册表或系统文件更改以及可疑的网络流量和异常的网络活动。\n\
  \n**A** 是错误的，因为 `TTP` 指的是战术、技术和程序，即与特定对手相关的活动模式和方法。\n\n**C** 是错误的，因为 `APT` 指的是高级持续性威胁——一种获取资源未经访问并长时间保持不被发现的威胁者。\n\
  \n\n\n\n\n![Image](img/w.jpg) `D` 是错误的，因为 ABI 指的是攻击者行为识别（adversary behavioral identification），它涉及到识别攻击者所遵循的常用方法和技术的努力。\n\
  \n# 第二章\n\n## 侦察：伦理黑客的信息收集\n\n本章涵盖了以下主题的问题：\n\n* 定义主动和被动足迹探测（active and passive\
  \ footprinting）\n* 识别信息收集中的方法和程序\n* 理解在信息收集中使用社交网络、搜索引擎和 Google  黑客攻击（Google hacking）\n\
  * 理解在信息收集中使用 `whois`、`ARIN` 和 `nslookup`\n* 描述 DNS 记录类型\n\n犯罪学（对犯罪行为的性质、成因、控制和预防的研究）是一门迷人的学科。尽管我们在本书书中重点关注的是虚拟世界，但在物理犯罪世界中也进行了如此多的足迹探测，这确实令人惊叹。我们大多数人已经听过数百万次关于应该做些什么来让家里不那么成为坏人目标的标准做法。这些做法，如保持房屋光线充足、在灯和电视上使用定时器让房子看起来一直“有人”，以及安装良好的报警系统，在这些讨论中非常常见，以至于当安全专家开始谈论它们时，我们往往会无聊得睡着。但你知道吗，大多数常见的窃偷更喜欢在白天工作，因为那时你最可能不在家里（至少在我们因为疫情开始居家办公之前是）。你知道吗，大多数人根本不在乎你的报警系统，因为他们计划在里面只留八到十分钟或更短？你还知道吗，大多数灯光定时系统在小偷眼里并没有改变任何事情，因为通常会有与人在家里相关的声音？\n\
  \n为了说明来说，跟我一起在我住的小小区绕一圈，我们将尝试像一个对社区进行足迹探测寻找目标的犯罪分子一样思考。也许我们先从在社区里转转开始，以确定谁是爱管事的邻居，哪些房子最有机会。我们右侧的这栋房子位于死胡同，比主干道上的房子更具隐私性，警察巡逻流量也更少。噢，那边那栋房子呢？是的，看起来草坪已经一段时间没修剪了，所以他们可能不在家——或者他们不像其他房主那样关注家居细节。那边那栋双层楼的主有一只狗，所以我们可能会避开那栋。但看那里：那栋房子的垃圾桶旁靠着一个大箱子，是主人刚购买的\
  \ 82 英寸新款 QLED 电视。我们应该把这个地址记下来，以后仔细观察。还有池塘对面那栋带滑动玻璃门的房子？它绝对有潜力。\n\n我在这里可以一直说下去（我真的很喜欢这个主题，可以聊一整天），但这本书是关于虚拟世界的，而我正在准备你成为一名伦理黑客，而不是一名执勤的警官。这一章也完全关于侦察和足迹探测——在虚拟世界中——它完全关于在尝试攻击目标之前收集有关目标信息的方法和工具。\n\
  \n![Image](img/examp.jpg) **学习技巧** 这一部分会有很多问题，主要因为在开始攻击之前收集良好的情报至关重要。当然，你有时可以运气不错速击，但很多时候，在足迹探测阶段下功夫会获得最大的报酬。你在实际考试中看到的最大的关注领域是什么？几个版本之前，全是\
  \ DNS，但现在变得多样化了。你看到主动与侦察对比问题的概率，与看到 Google 黑客攻击、操作系统指纹识别和 DNS 问题的概率一样。EC-Council\
  \ 在侦察和足迹探测方面确实拓宽了视野，所以，虽然我不想说所有事，但请记住所有内容。这里棘手问题的技巧与你在其他任何章节中听到的一样——它们是通用的。\n\n\
