  **D.** iRoot\n\n## 5. Jack 在手机上收到一条短信，告知他他的银行正遭受重大攻击。短信包含一个检查其账户的链接。在他点击链接后，攻击者在后台接管了他的账户。Jack\
  \ 面临的是以下哪种攻击？\n\n**A.** 钓鱼攻击（Phishing）\n**B.** 短信诈骗（Smishing）\n**C.** 语音诈骗（Vishing）\n\
  **D.** App 沙箱（App sandboxing）\n\n## 6. 下列哪种工具允许 Android 用户获得设备的特权控制？\n\n**A.** DroidSheep\n\
  **B.** SuperOneClick\n**C.** Faceniff\n**D.** ZitMo\n\n## 7. 某人尝试用手机手机打电话；但手机似乎没有反应。尝试几分钟后，他将其关掉并重新启动。在下一次通话期间，手机再次断开连接并变得无反应。正在发生哪种蓝牙攻击？\n\
  \n**A.** 蓝牙泛滥（Bluesmacking）\n**B.** 蓝牙劫持（Bluejacking）\n**C.** 蓝牙嗅探（Bluesniffing）\n\
