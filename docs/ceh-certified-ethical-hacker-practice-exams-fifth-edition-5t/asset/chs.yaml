  \ [1.ch2.xhtml#ans1]\n你正试图查找目标组织系统的操作系统和 CPU 类型。你想要用于查询的 DNS 服务器名为 `ADNS_Server`，你想要获取信息的目标机器是\
  \ `TARGET_SYSTEM`。以下哪一组 `nslookup` 命令是发现此信息的最佳选择？（命令输出已脱敏。）\n\nA. Images/f0039-01.jpg\n\
  B. Images/f0039-02.jpg\nC. Images/f0039-03.jpg\nD. Images/f0039-04.jpg\n\n**A.**\
  \ 这个问题涉及了两个方面：一个关于 DNS 知识，另一个是关于 `nslookup` 的用法。首先，DNS 记录 HINFO（根据 RFC 1035）是一种用于识别\
  \ CPU 类型和操作系统值的资源类型。你是否绝对要求在网络中的每个主机都包含 HINFO 记录？不，完全没有。但你应该这样做吗？我确信在某些情况下添加 HINFO\
  \ 记录是有意义的，但我确实想不出任何具体的理由。换句话说，这是考试中非常值得记住的记录类型，但在现实世界中看到它的概率仅如在菜单上看到龙虾一样大。\n\n`nslookup`\
  \ 语法是这个问题的第二部分，你绝对需要知道它。该工具的语法非常简单：\n\n```\nnslookup [-options] {hostname | [-server]}\
  \ own\n```\n\n该命令可以作为单实例运行，根据所选选项提供信息；你也可以在交互模式下运行，命令作为工具运行并等待输入。例如，在 Windows 机器上，如果你直接在提示符处输入\
  \ `nslookup`，你会看到一个显示默认 DNS 服务器及其 IP 地址的界面。从那里开始，`nslookup` 会耐心な等待你提问任何你想问的问题（顺便提一下，这被称为交互模式）。输入问号会显示你拥的所有选项和开关。\n\
  \n**B、C** 和 **D** 错误的，因为语法不匹配。\n\n### [2.ch2.xhtml#ans2]\n一名渗透测试人员向一个她已知在组织内部无效的地址发送了邮件。以下哪项是对她采取此行动的最佳解释？\n\
  \nA. 为了收集组织电子邮件系统中使用的内部主机机的信息\nB. 为了启动拒绝服务攻击（DoS）\nC. 为了确定电子邮件管理员的联系信息\nD. 为了收集系统如何处理无效地址消息的信息\n\
  \n**A.** 这背后的思维过程类似于横幅抓取（banner grabbing）或任何百种错误情况之一：从对错误的响应中可以获取到大量信息。一个虚假的内部地址有可能提供更多关于组织所用服务器的信息，包括\
  \ IP 地址和其他细节。\n\n**B** 是错误的，因为虚假邮件并不一定意味着 DoS 攻击的开始。\n\n**C** 是错误的，因为电子邮件管理员的联系信息不会在无效的邮件响应中发送。\n\
  \n**D** 是错误的，因为渗透测试人员已经知道系统如何处理虚假邮件了——她不知道的是这个特定组织内部哪些服务器执行了这些步骤。\n\n### [3.ch2.xhtml#ans3]\n\
  从提供的部分邮件头中，以下哪项代表了邮件消息的真实发送者？\n\nA. 220.15.10.254\nB. 158.190.50.254\nC. 217.88.53.154\n\
  D. 邮件头没有显示此信息\n\n**C.** 邮件头充满了信息，显示了消息所经过的整个路由，我可以向你保证考试中至少会看到一道关于它们的题目。你很可能被要求识别真实的发送者——即最初发送邮件的机器（人）（尽管在现实世界中，由于代理等工具可以用来隐藏，这可能是不可能的）。这在第\
  \ 9 行显示得很清楚：`Received: from SOMEONEComputer [217.88.53.154] (helo=[SOMEONEcomputer])`。但不要只学习和依赖那一个部分。观察消息所经历的整个历程，并记录沿途的\
  \ IP。\n\n**A 和 B** 是错误的，因为这些 IP 不代表消息的真实发送者。它们显示的是正在传递/处理消息的电子邮件服务器。\n\n**D** 是错误的，因为邮件头绝对显示了真实的发送者。\n\
  \n### [4.ch2.xhtml#ans4]\n你正在寻找标题中包含 `CEH` 和 `V11` Term 的页面。以下哪项是正确的？\n\nA. `inurl:CEH\
  \ V11`\nB. `allitle:CEH V11`\nC. `intitle:CEH V11`\nD. `allinurl:CEH V11`\n\n**B.**\
  \ Google 运算符 `allitle` 搜索标题中包含该字符串或多个字符串的页面。\n\n**A** 是错误的，因为 `inurl` 只查找 URL，不查找页面标题。\n\
  \n**C** 是错误的，因为 `intitle` 只查找页面标题中的第一个术语。\n\n**D** 是错误的，因为 `allinurl` 不查看页面标题；它只关注\
  \ URL。\n\n### [5.ch2.xhtml#ans5]\n你在一个 Cisco 路由器上，想要识别数据包传输到特定 IP 的路径。以下哪项是最佳命令选择？\n\
  \nA. `ping`\nB. `ifconfig`\nC. `tracert`\nD. `traceroute`\n\n**D.** 你可能一开始就知道这是一个关于\
  \ traceroute 的问题，但棘手之处在于决定使用*哪个* traceroute 命令。traceroute 取决于你使用的系统，可以使用多种不同的协议和技术。例如，在\
  \ Windows 系统上，traceroute（使用命令名称 `tracert`）使用 ICMP 数据包和 TTL（生存时间）值来映射发送者和目的地之间的路径。发送的第一个数据包\
  \ TTL 为 1，以显示第一跳。下一个数据包将其设置为 2，依此类推，直到找到目的地为止。每个 ICMP 响应都会提供当前跳的信息（除非 ICMP 经过过滤）。在\
  \ Linux 系统上（以及 Cisco 设备上），你会使用 `traceroute` 命令，并使用 UDP 代替 ICMP。\n\n\n\n\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为 Linux 系统中使用的 `ifconfig` 命令用于显示系统网络接口的信息。`ifconfig` 允许配置、控制和查询 TCP/IP\
  \ 网络接口参数——例如，在网卡（NIC）上设置 IP 地址和子网掩掩码（netmask）。\n\n![Image](img/w.jpg) **C** 是错误的，因为\
  \ `tracert` 命令在 Windows 系统上有效，但在 Cisco 设备上不起作用。\n\n### 6. 下列活动中哪些*不被视为被动足迹（passive\
  \ footprinting）？（选择两项。）\n\n**A.** 翻垃圾桶（Dumpster diving）\n**B.** 回顾财务网站以获取公司信息\n\
  **C.** 点击公司公共网站内的链接\n**D.** 拨打公司的帮助台热线\n**E.** 采用被动嗅探（passive sniffing）\n\n![Image](img/r.jpg)\
  \ **D, E.** 这一题可能有点棘手，但是因为我们生活和工作在现实世界，而这是一道考试题。EC-Council 对于现实世界应用以及他们要求你在考试中记忆的内容有几个值得商榷的观点，这就是其中一个例子。只需记住，ECC\
  \ 希望你知道主动和被动足迹可以通过两点来定义：你触碰了什么，以及你让自己处于多大的发现风险之中。社会工程本身本质上并非完全是被动或主动的。在翻垃圾桶的情况下，根据\
  \ ECC 的说法，它也被认为是被动的（尽管在现实世界中存在被的风险以及你为了完成这一操作必须采取的行动）。\n\n然而，拿起电话拨打公司内部电话或在停车场与人交谈，你就让自己暴露在被发现的风险中，现在进行主动足迹。至于“被动”嗅探，嗅探根本不是一种足迹行为。“被动嗅探”这一术语指的是简单地接入并观察流过的数据，而无需你执行任何数据包注入或其他操作。\n\
  \n![Image](img/w.jpg) **A, B,** 和 **C** 是错误的，因为这些都是被动侦察的示例。其他示例可能包括检查 DNS 记录（DNS\
  \ 是公开的，根据 ECC 的说法，你可以通过免费的 DNS 记录对组织进行被动足迹探测）以及检查公司的职位列表。\n\n### 7. 检查以下命令序列：\n\n\
  ![Image](img/f0043-01.jpg)\n\n下列哪种陈最能描述该命令序列的意图？\n\n**A.** 操作员正在枚举一个名为 `someserver`\
  \ 的系统。\n**B.** 操作员正在尝试进行 DNS 毒化。\n**C.** 操作员正在尝试区域传输（zone transfer）。\n**D.** 操作员正在尝试寻找名称服务器。\n\
  \n![Image](img/r.jpg) **A.** `HINFO` 记录类型是那些非常棒的主意之一，旨在让所有人的生活变得更轻松，但结果证明是一个糟糕的主意。它在\
  \ `RFC 1035` 中定义，主机信息（HINFO）DNS 记录最初旨在提供主机所使用的计算机类型和操作系统（在过去，你也可以在记录中放入房间号和其他描述）。然而，为了避免公开宣传这些信息（原因显而易见），这种记录类型现在已不再广泛使用。如果你在面向公网的机器上发现它，那是服务器管理员无能的明确标志。在这个示例中，类型被设置为\
  \ `HINFO`，并提供了一个主机名——`someserver`。攻击者可以使用记录中包含的信息作为枚举源。\n\n![Image](img/w.jpg) **B**\
  \ 是错误的，因为 DNS 毒化不是这样执行的。在这个命令序列中，操作员是在请求信息，而不是向名称服务器推送虚假条目。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为这不是使用 `nslookup` 执行区域传输的方法。要实现此操作，你需要使用 `set type=any` 命令，然后执行 `ls\
  \ -d [anybiz.com]`。你很可能在考试中也会看到这个。\n\n![Image](img/w.jpg) **D** 是错误的，因为检查域内的名称服务器需要\
  \ `set type=NS` 命令。\n\n### 8. 一个组织在 DMZ 中设置了一个 DNS 服务器，在内网中也设置了其他 DNS 服务器。这种实现方式通常称为什么？\n\
  \n**A.** 动态 DNS (Dynamic DNS)\n**B.** DNSSEC\n**C.** 分 Split DNS (Split DNS)\n**D.**\
  \ 自动 DNS (Auto DNS)\n\n![Image](img/r.jpg) **C.** Split DNS 背后的原理非常简单：为同一个域名创建两个区域，一个仅供内部网络，而另一个供任何外部网络使用。内部主机被重定向到内部域名服务器。分离域服务器极大限制了攻击者从外部可以执行的足迹。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为动态 DNS 不是这样工作的。在“普通”DNS 中，名称绑定到静态 IP 地址；然而，由于各种原因，托管设备可能需要经常更改\
  \ IP 地址。在动态 DNS 中，服务提供商使用一个运行在系统上的程序，每次 IP 地址更改时都会联系 DNS 服务，随后更新 DNS 数据库以反映该更改。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为域名安全扩展（`DNSSEC`）是一套用于保护某些类型信息的 IETF 规范。Dan Kaminsky\
  \ 在 2010 年左右让 DNS 漏洞广为人知，大多数服务提供商推出此技术以确保 DNS 结果经过加密保护。它是为了提供 DNS 的源验证和数据完整性设计的。\n\
  \n![Image](img/w.jpg) **D** 是错误的，因为 *auto DNS* 这个术语并不存在。它在这里纯属干扰项。\n\n### 9. 你正在为你的企业设置\
  \ DNS。服务器 A 既是 Web 服务器也是 FTP 服务器。你希望通过客户可以使用的名称发布这两项服务。你会使用哪种记录类型来实现此目标？\n\n**A.**\
  \ NS\n**B.** SOA\n**C.** MX\n**D.** PTR\n**E.** CNAME\n\n![Image](img/r.jpg) **E.**\
  \ 我们现在都知道——或者应该知道——在 DNS 中可以使用 A 记录将主机名映射到 IP 地址。`CNAME` 记录为该名称提供了区域别名。例如，你的服务器可能命名为\
  \ `mattserver1.matt.com`。一个提供 HTTP 和 FTP 访问的示例 DNS 区域条目如下：\n\n![Image](img/f0045-01.jpg)\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为 NS 记录显示了区域内的名称服务器。这些服务器是响应客户端解析请求的服务器。\n\n![Image](img/w.jpg)\
  \ **B** 是错误的，因为权威起始（SOA）条目标识了区域的主名称服务器。`SOA` 记录包含了负责命名空间内所有 DNS 记录的主机，以及域的基本属性。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为邮件交换（MX）记录标识了你域内的电子邮件服务器。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为指针（PTR）记录的作用与 A 记录相反。指针将 IP 地址映射到主机名，通常用于反向查询。\n\n### 10. 一公司有一个面向公网的\
  \ Web 应用程序。其内网服务器被隔离并受防火墙保护。下列哪些选择对于防止非预期枚举有帮助？\n\n**A.** 允许向 ANY 进行区域传输\n**B.**\
  \ 确保面向公网的名称服务器上没有针对内部主机的 A 记录\n\n\n\n\n\n### C. 将所有 MX 记录的优先级数字更改为 0\n\n### D. 不允许面向外部的名称服务器进行任何\
  \ DNS 查询\n\n**B.** 如果你的公司有一个面向公众的网站，那么意味着某处的名称服务器必须回答查询，以便你的客户能够找到该网站。然而，这台名称服务器并不需要向内部机器提供查询信息。在提供的选项中，尽管指出这一点听起来似乎很愚蠢，但确保外部名称服务器上没有\
  \ `A` 记录（那些用于将主机名映射到 IP 地址的记录）是一个很好的开始。\n\n![Image](img/r.jpg) \n**A** 是错误的，因为允许任何请求它的人进行区域传输（zone\
  \ transfer）是纯粹的愚蠢。它可能帮助、也可能无法帮助攻击者枚举你的内部网络（也许你那里并没有什么需要担心的东西），但它确实是一个极其糟糕的主意。\n\n\
  ![Image](img/w.jpg)\n**C** 是错误的，因为更改 `MX` 记录上的优先级数字与枚举完全没有关系。优先级数字（数字越小表示越优先）仅决定了哪台服务器首先处理电子邮件。\n\
  \n![Image](img/w.jpg)\n**D** 是错误的，因为如果你的客户无法查询与主机名关联的 IP，他们如何找到你的网站呢？\n\n---\n\n\
  ### 11. 一位伦理黑客寻找客户拥有的 IP 范围、阅读新闻文章、观察银行员工的上班和下班时间、搜索客户的招聘公告，并访问客户的垃圾桶。以下哪种陈述是正确的？\n\
  \n**A.** 所有动作都是主动足迹探测（active footprinting）。\n**B.** 所有动作都是被动足迹探测（passive footprinting）。\n\
  **C.** 伦理黑客正处于系统攻击阶段。\n**D.** 伦理黑客正在充当黑帽攻击者的角色。\n\n![Image](img/r.jpg)\n**B.** 我知道，我知道——我已经能听到你们这些专业考生对我尖叫了：“任何以‘所有（all）’开头的答案都可以排除！”而且，通常我会同意你们的，但这恰恰是我把它加在这里的原因。就就你们的考试而言，这个问题中的每一个例子恰恰都是被动足迹探测的例子。\n\
  \n![Image](img/w.jpg)\n**A** 是错误的，因为这些动作都不属于主动足迹探测。*主动足迹探测*尝试需要攻击者触碰设备、网络或资源，而*被动足迹探测*指的是从公开访问的源收集信息的措施。\n\
  \n![Image](img/w.jpg)\n**C** 是错误的，因为攻击者正处于侦察阶段。\n\n![Image](img/w.jpg)\n**D** 是错误的，因为没有迹象表明攻击者扮演的是哪种“帽子”，尽管作为一名伦理黑客，他应该像白帽一样。\n\
  \n---\n\n### 12. 伦理黑客寻找客户拥有的 IP 范围、阅读新闻文章、观察银行员工的上班和下班时间、搜索客户的招聘公告，并访问客户的垃圾桶。以下哪种陈述是正确的？\n\
