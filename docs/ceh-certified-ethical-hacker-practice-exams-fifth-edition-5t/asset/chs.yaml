  **A.** 设备到设备（Device-to-device）\n**B.** 后端共享（Back-end sharing）\n**C.** 设备到云（Device-to-cloud）\n\
  **D.** 设备到网关（Device-to-gateway）\n\n## 快速答案\n\n1. C\n2. C\n3. A\n4. C\n5. B\n6. B\n\
  7. A\n8. A\n9. D\n10. B\n11. B\n12. A\n13. D\n14. B\n15. D\n16. A, B, C, D\n17.\
  \ A\n18. C\n19. A\n20. D\n\n## 解析 A\n\n**1.** 公司聘请你作为安全团队的一员。公司正在针对移动设备实施新的政策和程序。下列哪项**不是**推荐的做法？\n\
  \n**A.** 制定 BYOD（自带设备）策略，并确保所有员工都了解并知晓该策略。\n\n**B.** 将应用程序加入白名单，并确保所有员工都了解并知晓这些程序。\n\
  \n**C.** 允许越狱和 root 的设备接入网络，前提是员工已签署了相关政策。\n\n**D.** 实施 MDM（移动设备管理）。\n\n![Image](img/r.jpg)**C.**\
  \ 自带设备（BYOD）和移动设备管理（MDM）正成为安全管理员日益头疼的问题。BYOD 是指员工可以将自己的智能手机、平板电脑和移动设备带到工作中并作为企业网络的一部分使用。移动设备管理（通常通过包含移动设备厂商功能的第三方产品来实现）是管理和保护内部移动设备使用的一种努力。\n\
  \n显然，移动设备进出网络会导致各种安全问题，可以采取许多常识性的步骤来解决。允许 root 或越狱设备——本质上这些设备可能安装了任何数量（无论有意还是无意）的问题——并不是明智之举。\n\
  \n\n\n\n\n![Image](img/w.jpg)\nA、B 和 D 都是错误的，因为这些都是关于移动设备使用和管理的良好建议。其他良好的建议还包括：确保所有设备都启用了屏幕锁定密码、使用加密（针对传输中和静态数据问题）、确保业务数据和个人数据之间有清晰的界限、实施防病毒软件以及确保操作系统和补丁都是最新版本。\n\
  \n### 2. 下列工具中哪一个会被黑莓攻击（blackjacking attack）？\n\n**A.** Aircrack\n**B.** BBCrack\n\
  **C.** BBProxy\n**D.** Paros Proxy\n\n![Image](img/r.jpg)\n**C.** 这是另一个针对特定工具的问题，但应该相对容易。Blackjacking\
  \ 和 `BBProxy` 几年前在 Defcon 大会上就已曝光，所以从攻击的角度来说这并不是什么新事物。简而言之，黑莓（Blackberry）设备实际上是内部网络的一部分，在手机上正确配置攻击，可能会获得访问内部网络资源的权限。`BBProxy`\
  \ 用于此类攻击的一部分，你可以通过以下链接查看 2006 年原始演示文稿中的整个过程：\n\n[www.praetoriang.net/presentations/blackjack.html](https://www.praetoriang.net/presentations/blackjack.html)\n\
  \n![Image](img/w.jpg)\nA、B 和 D 都是错误的，因为这些工具没有用于黑莓攻击尝试。`Aircrack` 用于无线网络加密破解，而 `Paros`\
  \ 是一个代理服务，但它们都不用于黑莓攻击攻击。`BBCrack` 并不存在。\n\n### 3. 下列工具中哪一个是用于 Android 设备的漏洞扫描器？\n\
  \n**A.** X-ray\n**B.** evasi0n7\n**C.** Pangu\n**D.** DroidSheep Guard\n\n![Image](img/r.jpg)\n\
  **A.** 移动工具会在你的考试中随处出现，所以尽力去接触尽可能多的工具。`X-ray` 是 EC-Council 明确提到的一个 Android 漏洞扫描器。它搜索未修补的漏洞，并在发现新的漏洞签名时自动更新。\n\
  \n![Image](img/w.jpg)\nB 和 C 是错误的，因为它们都是针对 iOS 设备的越狱（jailbreaking）应用程序。\n\n![Image](img/w.jpg)\n\
  **D** 是错误的，因为 `DroidSheep Guard` 是一个监控手机 ARP 表的工具，会对可疑条目发出报警并禁用异常的 Wi-Fi 连接。\n\n\
  ### 4. 哪种类型的越狱允许用户级访问但不允许 iBoot 级访问？\n\n**A.** iBoot\n**B.** Bootrom\n**C.** Userland\n\
  **D.** iRoot\n\n![Image](img/r.jpg)\n**C.** 我没有 iPhone、iPod 或任何其他设备，也没有兴趣拥有。但是，由于\
  \ iOS 是最流行的移动设备系统之一，我必须至少了解一些它。如果你想成为 CEH，你确实需要。越狱 iPhone 是移除 Apple 施加的软件限制的过程，以便你可以安装修改过的内核补丁集，允许你运行任何想要的软件或更新。EC-Council\
  \ 列出了三种主要的越狱方法，其中两种（`iBoot` 和 `Bootrom`）允许一种被称为 `iBoot` 的访问。`iBoot` 访问基本上是指影响固件本身的能力。`Userland`\
  \ 是一个术语，指内核加载后在 iOS 设备上运行的软件。因此，`userland` 越狱完全基于软件，Apple 可以在尝试后对其进行修补。`Userland`\
  \ 越狱包括 `JailbreakMe`、`Saffron`、`Spirit`、`evasi0n` 和 `Pangu`。\n\n![Image](img/w.jpg)\n\
  A 和 B 是错误的，因为两种越狱尝试都允许 `iBoot` 访问。换之，每种方法都允许启动信任和固件更新。**D** 是错误的，因为这不是一种越狱类型。\n\n\
  ### 5. Jack 手机收到一条短信，告诉他他的银行遭到了重大攻击。短信包含一个检查其账户的链接。在他点击链接后，攻击者在后台控制了他的账户。他面临的是以下哪种攻击？\n\
  \n**A.** 钓鱼攻击（Phishing）\n**B.** 短信诈骗（Smishing）\n**C.** 语音诈骗（Vishing）\n**D.** 应用程序沙箱（App\
  \ sandboxing）\n\n![Image](img/r.jpg)\n**B.** `Smishing` 是移动设备攻击的术语，攻击者向目标发送带有嵌入链接的短信。如果用户点击恶意链接，攻击者就会获得有价值的信息和控制权。这些攻击成功的原因与\
  \ `phishing` 在电子邮件世界有效的原因相同——人们有时会直接点击，而不停下来思考。否则，用户有时会忽略来自未知（即使是已知）来源的带有链接的电子邮件，但当链接在短信中时，他们可能不会考虑。\n\
  \n![Image](img/w.jpg)\nA 是错误的，因为 `phishing` 术语是指电子邮件信息，其工作方式与 smishing 非常相似。\n\n\
  ![Image](img/w.jpg)\nC 是错误的，因为 `vishing` 是一个指代使用电话和语音消息执行攻击的术语。\n\n![Image](img/w.jpg)\n\
  D 是错误的，因为 `app sandboxing` 本身不是一种攻击：它是一种旨在限制应用程序访问移动设备资源的安全措施。\n\n### 6. 下列哪项允许\
  \ Android 用户获得对设备的特权控制？\n\n**A.** DroidSheep\n**B.** SuperOneClick\n**C.** Faceniff\n\
  **D.** ZitMo\n\n![Image](img/r.jpg)\n**B.** Android 设备的 Root 与越狱 iOS 设备的想法相同：允许用户完全控制设备，修改系统文件并（在某些情况下为了安全）提高性能。Root\
  \ 可以通过多种方法实现，一些工具包括 `SuperOneClick`、`Superboot`、`One Root` 和 `Kingo`。使用 `SuperOneClick`，你只需通过\
  \ USB 连接手机（确保处于充电模式），启用 `USBDebugging` 并运行程序。\n\n![Image](img/w.jpg)\nA 是错误的，因为\
  \ `DroidSheep` 是用于 Android 会话劫的工具。它可以提取 WEP、WPA 和 WPA2 会话 ID。\n\n![Image](img/w.jpg)\n\
  C 是错误的，因为 `Faceniff` 是一个 Android 嗅器，旨在嗅探和拦截网页。\n\n![Image](img/w.jpg)\nD 是错误的，因为\
  \ `ZitMo`（手机 Zeus）是一种银行木马。`ZitMo` 甚至可以在感染设备上实现机器人命令控制。\n\n### 7. 个人尝试用他的手机通话；但手机似乎没有反应。尝试几分钟后，他关闭并重新打开。在下一次通话期间，手机再次断开连接并变得无反应。哪种蓝牙攻击正在进行？\n\
  \n**A.** Bluesmacking\n**B.** Bluejacking\n**C.** Bluesniffing\n**D.** Bluesnarfing\n\
  \n![Image](img/r.jpg)\n**A.** 从描述来看，手机要么是有缺陷，要么（正如问题中清楚写出的那样）它正遭受着拒绝服务攻击。`Bluesmacking`\
  \ 是针对蓝牙设备的拒绝服务攻击。附近的攻击者（在十米范围内，或者对于真正的坏人，使用足够大的发射器、放大器和天线更远）正在使用类似 Linux `Bluez`\
  \ 软件包 ([www.bluez.org](https://www.bluez.org)) 对手机执行 `DoS` 攻击。\n\n\n\n\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为蓝牙嗅狗攻击（Bluesnarfing）指的是直接从设备中窃取数据。这利用了大多数蓝牙设备的“配对”功能，主动寻找其他设备进行连接。\n\
  \n### 8. 下列哪种是蓝牙中拒绝所有配对请求的模式？\n\n**A.** 非配对（Non-pairing）\n**B.** 不可发现（Non-discoverable）\n\
  **C.** 混杂（Promiscuous）\n**D.** 蓝牙夹（Bluejack）\n\n![Image](img/r.jpg) **A.** 当你在考试中遇到简单的问题时，庆祝一下吧。蓝牙有两种配对模式和三种发现模式。配对——与请求的设备配对的决定——可以开启（配对模式，接受所有请求）或关闭（非配对模式，拒绝所有请求）。发现——响应搜索请求并让查询端知道设备在线可用的决定——可以是完全开启（可发现模式，响应来自所有人的请求）、部分开启（有限可发现模式，仅在短时间内响应）或完全关闭（不可发现模式，从不回答查询）。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为不可发现是一种发现模式，而不是配对模式。\n\n![Image](img/w.jpg) **C**\
  \ 是错误的，因为“混杂”在这种语境下没有意义。\n\n![Image](img/w.jpg) **D** 是错误的，因为蓝牙夹（Bluejack）指的是一种蓝牙攻击，攻击者可以利用目标手机的联系人，导致向目标发送匿名且未经请求的消息。\n\
  \n### 9. 攻击者正在使用 Shodan 搜索目标上的设备。她输入以下搜索字符串：`webcam geo: “-85.97,31.81”`。下列哪种描述正确描述了这一操作？\n\
  \n**A.** 搜索字符串语法错误。\n**B.** 攻击者正在搜索序列号以 3181 到 8597 之间的开头的摄像头。\n**C.** 攻击者正在搜索以“geo.”开头的摄像头制造商。\n\
  **D.** 攻击者正在搜索地理位置位于 -31.80, 85.95（经纬度）的摄像头。\n\n![Image](img/r.jpg) **D.** 虽然谷歌和其他搜索引擎索引了\
  \ Web，但 Shodan ([`www.shodan.io`](https://www.shodan.io)) 索引连接到互联网的*一切*。它是一个极其强大的搜索引擎工具，可以用于……各种事情。想在特定城市寻找三星的可穿戴设备吗？获取型号并使用\
  \ city: 过滤器即可。特定子网上的 IIS 服务器呢？尝试 `iis net:*xxx.xxx.xxx.xxx/yy*`（其中 `x` 是你的子网，`yy`\
  \ 是你的 CIDR 记法）。如果你想非常精确地确定位置，可以使用 `geo:` 过滤器以及经纬度坐标。Shodan 的 `geo:` 过滤器实际上接受两个到四个坐标参数。示例使用了两个，显示了一组经纬度对。如果示例使用三个坐标，它们将代表纬度、经度和范围。添加第四个坐标，你就可以创建一个用于搜索的地理方框：左上纬度、左上经度、右下纬度、右下经度。\n\
  \n![Image](img/w.jpg) **A** 是错误的，因为语法没有问题。事实上，Shodan 会接受你输入的任何内容作为搜索字符串，这有时会让你得到非常奇怪的响应。\n\
  \n![Image](img/w.jpg) **B** 是错误的，因为这种语法与序列号无关。\n\n![Image](img/w.jpg) **C** 是错误的，因为这种语法与制造商名称无关。\n\
  \n### 10. 下列哪种是 IoT 设备最流行的短距离通信技术？\n\n**A.** RFID\n**B.** Zigbee\n**C.** QR 代码\n\
  **D.** LiFi\n\n![Image](img/r.jpg) **B.** IoT 设备使用了许多无线通信技术，其中一些名称相当奇特。根据 EC-Council\
  \ 的说法，Zigbee 是世界上最流行的 IoT 设备通信技术。因此，你应该知道它是基于 `IEEE 203.15.4` 标准的，可以使用像 `KillerBee`\
  \ 的工具来攻击使用该技术的设备。是的，我知道问这种问题很奇怪。不，我这么做不是因为我是个虐待狂。了解 Zigbee。学好它。你以后会感谢我的。\n\n**A,\
  \ C,** 和 **D** 错误的原因相同——根据 CEH 资料，它们并不是 IoT 设备最流行的通信技术。但我想为了你的学习目的，包含其中每项技术的一些信息，以防你在考试中看到关于它们的奇怪内容。\n\
  \nRFID 可能是大家最熟悉的，因为它出现并进入公众视野的时间比大多数其他东西都要长。我的意思是，谁没听过 RFID 隔离钱包呢？QR 代码是那些可扫描、可读的、包含设备信息的标签。\n\
  \nLiFi 可能是这个列表中最奇怪的项，而且老实说，我在准备考试时从未听说过它。\n\n### 11. 在 IoT 架构中，下列哪项执行消息路由和识别？\n\n\
  **A.** 边缘技术层\n**B.** 接入网关层\n**C.** 网络层\n**D.** 中间件层\n\n![Image](img/r.jpg) **B.**\
  \ EC-Council 提出的 IoT 架构包括边缘技术、接入网关、网络、中间件和应用层。每一层都有你你在考试中值得记忆的信息，在这种情况下，我们讨论的是接入网关层。在这里，我们发现了设备与客户端之间的鸿沟，首次数据处理在此层发生。消息路由、识别和订阅发生这里。\n\
  \n### 12. 一位房主使用手机上的 App 为其电视机设置观看列表。这里涉及的是哪种 IoT 通信模型？\n\n**A.** 设备到网关\n**B.**\
  \ 后端数据共享\n**C.** 设备到云端\n**D.** 设备到设备\n\n\n\n\n\n![Image](img/r.jpg) **A.** IoT 通信模型看起来非常直接，但这里存在一些奇异的特例对比。在这种情况下，智能手机——更准确地说，是所有者智能手机上的\
  \ App——充当了网关，而电视是设备。在“设备到网关”模式中，IoT 设备与中间节点（网关）通信，由网关再与云服务通信。顺便提一下，这也是一个很好的学习/记忆技巧：网关几乎总是是智能手机上的一个\
  \ App。\n\n![Image](img/w.jpg) **B** 是错误的，因为这描述的不是后端数据共享通信模型。后端数据共享将云的连接性（从设备或网关）扩展到第三方。\n\
  \n![Image](img/w.jpg) **C** 是错误的，因为这描述的不是“设备到云”。在这种模型中，IoT 设备直接与云端通信，而不是与客户端通信。一个典型的例子是你可以远程访问的监控摄像头。摄像头作为\
  \ IoT 设备，并不直接与你（客户端）通信，而是将数据上传到云端，然后你在那里进行交互以获取数据——当然，是在输入正确的凭据之后。\n\n![Image](img/w.jpg)\
  \ **D** 是错误的，因为这描述的不是“设备到设备”。这种通信模型在可穿设备和智能家居设备（如灯泡和恒温器）中很流行，IoT 设备通过 Wi-Fi（或 Zigbee、蓝牙等技术）直接相互通信。\n\
  \n### 13.\n在何种 VANET（车载自组织网络）攻击中，车辆似乎同时出现在多个地方，导致拥堵并严重损害了数据的使用？\n\n**A.** 滚动码 (Rolling\
  \ code)\n**B.** BlueBorne\n**C.** 旁道攻击 (Side channel)\n**D.** Sybil (女巫攻击)\n\n![Image](img/r.jpg)\
  \ **D.** 与计算领域的其他领域一样，IoT 有大量的攻击和漏洞可以讨论。在名为 Sybil 攻击的特定示例中，车辆或设备创建一个另一个身份的幻象（在本例中，为同时出现在多个地方），导致拥堵以及随之而来的相关混乱。对于\
  \ VANET（车载自组织网络）来说，这可能特别危险。在标准网络上，它可以导致大量的 DDoS 问题。\n\n![Image](img/w.jpg) **A**\
  \ 是错误的，因为这描述的不是滚动码攻击。滚动码攻击是指攻击者干扰信号并嗅探用于解锁车辆的代码。\n\n![Image](img/w.jpg) **B** 是错误的，因为这描述的不是\
  \ BlueBorne 攻击。BlueBorne 指的是攻击附近的支持蓝牙设备的尝试，然后利用这些设备（利用蓝牙漏洞）来发起进一步的攻击。\n\n![Image](img/w.jpg)\
  \ **C** 是错误的，因为这描述的不是旁道攻击。在旁道攻击中，从不同的 IoT 信号发射中提取加密密钥信息。\n\n### 14.\n在列出的工具中，哪一个是快速发现网络上\
  \ IoT 设备 IP 地址的最佳选择？\n\n**A.** IoTInspector\n**B.** MultiPing\n**C.** Z-Wave Sniffer\n\
  **D.** beSTORM\n\n![Image](img/r.jpg) **B.** 你已经知道的许多工具在 IoT 领域同样好用，MultiPing (`https://www.multiping.com/`)\
  \ 就是一个很好的例子。MultiPing 已经存在一段时间了，是发现运行在你网络上的系统的一种快速且粗暴的方法。即使是那些讨厌的 IoT 设备也可以用它找到。MultiPing\
  \ 是发现你 IoT 设备的绝对最佳方法吗？可能不是。它能像问题中描述的那样快速工作吗？绝对可以。\n\n![Image](img/w.jpg) **A** 和\
  \ **D** 错误的原因相同——这两者都是 IoT 设备的漏洞扫描器。\n\n![Image](img/w.jpg) **C** 是错误的，因为 Z-Wave\
  \ Sniffer 是一个嗅探 IoT 流量的工具。\n\n### 15.\n2016 年 10 月，一次涉及数百万 IoT 设备的 DDoS 攻击导致了北美和欧洲大量用户的服务中断。该攻击使用了以下哪种恶意软件？\n\
  \n**A.** WannaCry\n**B.** Cryptolocker\n**C.** Locky\n**D.** Mirai\n\n![Image](img/r.jpg)\
  \ **D.** 很难相信像婴儿监视器这样简单的东西会被被作攻击平台，但在 2016 年秋季，确实发生了这种情况。Mirai 恶意软件旨在为了故意寻找并感染 IoT\
  \ 设备，创建了一个规模巨大的僵尸网络。随后，它被用于针对 DNS 商 Dyn（后被 Oracle 收购）运营的系统的一系列分布式拒绝服务攻击。这次攻击导致了北美和欧洲的大范围中断，并作为一个持久的提醒，告我们\
  \ IoT 安全性极其匮乏。作为一个有趣的小插曲，原始的 Mirai 攻击之所以成功，是因为它利用了任何网络安全专业大一学生都能识别出的低级安全疏忽——它使用了大量\
  \ IoT 设备通用的默认凭据。\n\n![Image](img/w.jpg) **A, B,** 和 **C** 都是错误的，因为其中任何一个都与著名的 Dyn\
  \ 攻击没有关系。WannaCry 是一种始于 2017 年的勒索攻击，利用微软补丁作为攻击向量。Cryptolocker 和 Locky 分别在 2013 年和\
  \ 2016 年也是勒索攻击。\n\n### 16.\n以下哪些是预防 IoT 黑客攻击的有效对策措施？（选择所有适用项。）\n\n**A.** 禁用游客和演示账户。\n\
  **B.** 针对过多的登录尝试启用锁定功能。\n**C.** 禁用 Telnet。\n**D.** 实施补丁管理并确保设备固件是最新的。\n\n![Image](img/r.jpg)\
  \ **A, B, C, D.** 我本想说保护 IoT 与其他任何事情都一样，但这并不完全准确。并不是说不应该使用相同的对策——当然，相同的基础方法适用于所有领域。禁用未使用的服务、端口和内置账户，更改默认密码，启用锁定机制并确保你的补丁版本是最新的，无论你在谈论什么，这些都是安全的基本项目。并不是这些措施本身让\
  \ IoT 安全化变得如此困难——难点在于跟上这些措施的更新。\n\n正如配套书籍 *Certified Ethical Hacker All-in-One Exam\
  \ Guide, Fifth Edition* 中讨论的那样，IoT 每天都在扩展，今天一个半安全的网络可能会因为有人添加了 BYOD（自带设备）的联网功能的内裤而彻底失守（别笑，这现在真的是个东西）。确保\
  \ IoT 安全的措施与你在任何地方看到的相同，只是额外增加了一些 CEH 项目以备不时（例如，ECC 建议良好监控端口 `48101`，因为已知 IoT 恶意软件会利用该端口传播）。关于这个主题的问题对你来说应该是常识性的，因此为这一领域的考试准备相对容易。然而，在现实世界中，*警惕——无尽的、疲惫的、单调的、西西弗斯式的警惕——真的是你唯一的希望。*\n\
  \n### 17.\n在 Attify Zigbee 框架内，哪一个工具用于发现范围内的目标设备？\n\n**A.** zbstumbler\n**B.** zbdump\n\
  **C.** zbreplay\n**D.** zbassoc/flood\n\n\n\n\n\n![Image](img/r.jpg) **A.** 我们来玩个小问答游戏，好吗？我会向你介绍一组由\
  \ Attify 在其 Zigbee 框架中提供的工具，然后让你在完全没见过这些工具的情况下，仅根据你从其他 CEH 资料中学学习的知识，识别出每个工具的作用。准备好了吗？我们开始吧：识别\
  \ `zbstumbler`。识别 `zbdump`。现在识别 `zbreplay`。发现规律了吗？这些和你在其他工具集中看到的名称和功能都完全相同，只是这些工具都以\
  \ `zb.` 开头。在这种情况下，`zbstumbler` 非常像 `NetStumbler`，允许你识别范围内的设备。\n\n现在，在任何人开始对我说教大道理之前，我并不是在建议你忽略框架而仅仅为了考试去背术语。事实上，恰恰相反——\n\
  \n我希望你能够真正学会如何使用这些工具，这样当你通过考试时，这个证书才有*意义*。去获取这个框架（[`github.com/attify/Attify-Zigbee-Framework`](https://github.com/attify/Attify-Zigbee-Framework））并进行练习。在你家里找一个灯泡并攻击它（你可以在这里看别人操作：[https://www.youtube.com/watch?v=uivlSdqWS48](https://www.youtube.com/watch?v=uivlSdqWS48)）。当你在考试中遇到这类识别题时，直接运用常识即可。\n\
  \n![Image](img/w.jpg) **B** 错误，因为 `zbdump` 是该框架中的数据包捕获工具。\n\n![Image](img/w.jpg)\
  \ **C** 错误，因为 `zbreplay` 允许你重放部分数据包，以强制设备听命。\n\n![Image](img/w.jpg) **D** 错误，因为\
  \ `zbassoc/flood` 是框架中的一个 DDoS 功能。\n\n### 18. 下列哪项是经过先进硬件和软件设计的、用于 IoT 安全测试的无线电台？\n\
  \n**A.** Fluke\n**B.** Raspberry Pi\n**C.** HackRF One\n**D.** Alfa AWUS036NH\n\n\
  ![Image](img/r.jpg) **C.** 生活中很少有什么是确定的——每天的日升日落、每年南方几个月让生活变得痛苦的臭虫虫，以及从收入到汽油的一切事不断上涨的税收。你可以加入清单的另一项是：HackRF\
  \ One 会出现在你的 CEH 考试中。这个精巧的小硬件在 2014 年的一次 Kickstarter 筹项目中脱红而出。它的创造者 Michael Ossmann\
  \ 当时称其为 `Project Jawbone`，它的开源特性吸引了大量关注。从好的一方面来说，信息安全人员看到了一个极好的工具，可以帮助他们测试自己的无线产品。从坏的一方面来说，黑客们立即发现了一种快速简单的方法，可以干扰、破坏和破解各处的\
  \ IoT 设备。\n\n只需不到 300 美元，你也可以拥有一台 HackRF One 设备（[`greatscottgadgets.com/hackrf/`](https://greatscottgadgets.com/hackrf/)）。根据该网站介绍，`HackRF\
  \ One` “旨在实现现代和下一代无线技术的测试与开发……是一个开源硬件平台，可以作为 USB 外设使用，也可以编程进行独立运行。”然而，真正有趣（而且对我来说非常幽默）的是接下来的那句话：“HackRF\
  \ One 是 RF 系统的测试设备。它没有经过有关无线信号传输法规的合规性测试。*你负责合法使用你的 HackRF One*。”\n\nHackRF One\
  \ 能够在 1 MHz 到 6 GHz 的频率范围内接收和发射，并且是半双工的。由于其易于使用，它已成为一种非常有价值且珍贵的黑客工具。但要小心。记住，你对它的合法使用负责。\n\
  \n![Image](img/w.jpg) **A, B,** 和 **D** 都是错误的，因为这些硬件设备和术语与题目描述的能力不符。Fluke 是一家制造频谱分析仪和数据包捕获/分析等设备的制造商。树莓派（Raspberry\
  \ Pi）是一种小型单板计算机系统，旨在教授编程和计算机科学概念。`Alfa AWUS036NH` 是一种用于无线黑客的小型强大天线。\n\n### 19. 下列哪项是广泛用于描述工业控制系统\
  \ (ICS) 网络内部通信的模型？\n\n**A.** Purdue 模型（普渡模型）\n**B.** IIOT\n**C.** SCADA\n**D.**\
  \ PLC\n\n![Image](img/r.jpg) **A.** Purdue 模型，以前被称为 `PERA`（普渡企业参考架构），是一个用于工业控制系统\
  \ (ICS) 网络的结构模型，它定义了六个不同的层——每层都有定义的组件和相关的安全控制。\n\n该模型由 20 世纪 90 年代由普渡大学计算机集成制造联合会开发，被\
  \ ISA-99 采用，展示了典型 ICS 内部主要组件之间的连接和依赖关系。\n\n该模型将 ICS 架构分为两个区域（OT 和 IT），由 DMZ 隔开。每个区域进一步划分为与特定组件和功能相关的级别：\n\
  \n* 第 0 层是向可编程逻辑控制器 (`PLCs`) 发送信息的资产，例如传感器、泵、阀门和电机。每个层内部存在多种类型。\n* 第 1 层包括 `PLCs`、远程终端单元\
  \ (`RTUs`) 和智能电子设备 (`IEDs`)。这些是资产。\n* 第 2 层包含人机界面 (`HMIs`) 和 `SCADA` 软件。这些负责监控和控制。\n\
  * 第 3 层持有所有提供信息的系统。\n* 第 4 层包括企业资源计划 (`ERP`) 软件和其他系统。\n* 第 5 层是企业网络。\n\n![Image](img/w.jpg)\
  \ **B, C,** 和 **D** 都是错误的。`IIOT`（工业物联网）指的是 IT 和 OT 系统的集成。`SCADA`（监视控制数据采集）是集中控制系统。`PLC`\
  \ 是一种具有用于实现特定功能的编程存储器的小型固态系统。\n\n### 20. 下列哪种 IoT 模型允许第三方收集和使用数据？\n\n**A.** 设备到设备\n\
  **B.** 设备到云\n**C.** 设备到网关\n**D.** 后端共享\n\n![Image](img/r.jpg) **D.** 如果你完全不懂 IoT\
  \ 通信模型，这一个也是显而易见的。在后端共享模型中，设备通过 `CoAP` 或 `HTTP` 直接与应用服务提供通信，然后将数据提供给第三方。顺带一句，这种方法可能使用或不使用内部网关。\n\
  \n## 第 9 章 云计算安全\n\n本章包含以下主题的问题：\n\n* 识别云计算概念\n* 理解云安全的基础要素\n* 识别云安全工具\n\n我想通过谈论“云”这个话题有多大且无处不在来引入这一章，但相反，我社交圈中很少有人对它了如。我的意思是，我们经常使用这个词——有时用是错误的——但我接触的人中很少有人真正知道云意味着什么以及它是如何工作的。所以，我像其他人做的那样，进行了一次\
  \ Google 搜索。\n\n打开浏览器，我搜索“对某个话题了解足够多”，结果我并没有找到我想要的，而是进入了一个关于心理学和人类心态的、极具启发性的深渊。\n\
  \n\n\n\n\n我了解到“全知通者”（pantomath）是指那些想要无所不知的人，而“博学学者”（polymath）是指在大量学科领域拥有广博知识的人。我了解到`邓宁-克鲁格效应`（Dunning–Kruger\
  \ effect）是一种我们显然在某种程度上都拥有的认知偏误，即我们在自己实际能力很低下的任务中，会高估自己的能力（以及就此进行智力讨论的知识）。我了解到，我们都倾向于认为，对于几乎任何我们有基本经验的事情，我们自己的知识和经验都高于平均水平。\n\
  \n这与云有什么关系呢？至少对我来说，这很有启发性：我们有这么多人对云的了解如此有限，但却似乎认为自己在这个话题上已经足够聪明了。相信我，我们并不够（至少大多数人不是这样）。\n\
  \n云计算远没有你在 `Netflix` 上狂刷的最新剧集那么精彩，但它在当今的计算虚拟世界中极其重要，是你真的需要进一步学习的内容。`EC-Council`\
  \ 在之前的版本（`9`）的官方教材中针对该主题增加了一个全新的章节，当时似乎对此投入了很大关注。然而，在这个特定版本中，云对某一主题的关注程度不再如以前，仅占你考试内容的\
  \ `6 percent`。我们将在本章中介绍重点，以确保你对考试需要学习的内容有个了解，但我非常鼓励你在这个主题上尽可能多学习。\n\n![Image](img/examp.jpg)\n\
  \n**学习贴士** `EC-Council` 在其他主题上倾向于关注列表、类别和细节上的特定性，云计算也不例外。要非常熟悉各种类型和部署模型，并完全记忆 `NIST`\
  \ 的云参考架构。术语之间无疑会存在令人困惑的比较（容器对比虚拟机 `virtual machines` 等），因此请确保你非常熟悉这些细微差别。云计算中的大多数攻击和威胁与其他领域都很相似，但有少数是非常特定的，这些很可能会出现在你的考试中。最后，需要了解的云特定工具并不多，但你绝对需要熟悉它们。\n\
  \n## 习题 Q\n\n### 1. 关于云计算，以下哪种描述是正确的？\n\n**A.** 在 `IaaS` 中，应用程序、数据、`middleware`、`virtualization`\
  \ 和 `servers` 是服务提供的一部分。\n**B.** 在 `PaaS` 中，应用程序、数据、`middleware`、`virtualization`\
  \ 和 `servers` 是服务提供的一部分。\n**C.** 在 `SaaS` 中，应用程序、数据、`middleware`、`virtualization`\
  \ 和 `servers` 是服务提供的一部分。\n**D.** 以上均非。\n\n### 2. 以下哪项是一个全政府范围的计划，为云产品和提供提供安全评估、授权和持续监控的标准化方法？\n\
  \n**A.** `NIST Cloud Architecture`\n**B.** `FedRAMP`\n**C.** `PCI DSS Cloud Special\
  \ Interest Group`\n**D.** `Cloud Security Alliance`\n\n### 3. 一位企业主被建议，通过云服务可以更廉价、更安全地提供库存、存储、销售和在线备份服务。在调查了选项后，该企业主确定最符合其需求的云服务供应商恰好也是他几位竞争对手的供应商。如果他决定聘请同一家供应商，将使用哪种云部署模型？\n\
  \n**A.** 私有（Private）\n**B.** 多云（Multi-cloud）\n**C.** 社区（Community）\n**D.** 公有（Public）\n\
  \n### 4. 在“NIST 云计算参考架构”中，以下哪项是提供云与订阅者之间连接的中间环节？\n\n**A.** `Cloud provider`（云提供商）\n\
  **B.** `Cloud carrier`（云运营商）\n**C.** `Cloud broker`（云经纪人）\n**D.** `Cloud auditor`（云审计师）\n\
  \n### 5. 一公司大部分内部计算需求依赖私有云解决方案。在扩展到更多在线零售后，它依赖部分公云进行外部销售和电子商务。以下哪项最好描述了所使用的云部署类型？\n\
  \n**A.** 私有（Private）\n**B.** 公有（Public）\n**C.** 混合（Hybrid）\n**D.** 社区（Community）\n\
  \n### 6. 云计算最适合以下哪种业务？\n\n**A.** 医疗诊所\n**B.** 一家老牌乡村杂杂货店\n**C.** 执法机构\n**D.** 圣诞用品店\n\
  \n### 7. 一家软件公司决定在云计算环境中构建和测试 Web 应用程序。以下哪种云计算类型最能描述这一尝试工作？\n\n**A.** `IaaS`\n**B.**\
  \ `PaaS`\n**C.** `SaaS`\n**D.** 社区（Community）\n\n### 8. 以下哪种描述是不正确的？\n\n**A.** 私有云仅为一个组织运营。\n\
  **B.** 公有云利用虚拟化服务器。\n**C.** 公有云在内网上运行。\n**D.** 私有云利用虚拟化服务器。\n\n### 9. 一公司办公完全依赖\
  \ `Google Docs`、`Google Sheets` 和其他云端提供的服务。以下哪项描述了这种情况？\n\n**A.** `SaaS`\n**B.**\
  \ `PaaS`\n**C.** `IaaS`\n**D.** 公有（Public）\n\n### 10. 订阅者通过 `EC2` 购买机器和托管。这描述的是哪种云类型？\n\
  \n**A.** `IaaS`\n**B.** `PaaS`\n**C.** `SaaS`\n**D.** 混合（Hybrid）\n\n### 11. 关于容器和虚拟化，以下哪些描述是正确的？（多选）\n\
  \n**A.** 虚拟化在物理系统上运行多个操作系统。\n**B.** 虚拟化利用多个物理系统。\n**C.** 容器放置在单个系统上。\n**D.** 容器需要多个操作系统。\n\
  **E.** 容器和虚拟机是相同的。\n\n### 12. 以下哪种攻击发生在消息转换过程中？\n\n**A.** 封装攻击（Wrapping attack）\n\
  **B.** 跨虚拟机攻击（Cross-guest VM）\n**C.** 侧道攻击（Side channel）\n**D.** 会话劫持（Session riding）\n\
  \n### 13. 以下哪项是软件设计中的一种架构模式，组件通过通信协议（通常通过网络）向其他组件提供服务？\n\n**A.** `API`\n**B.** `SOA`\n\
  **C.** `EC2`\n**D.** `IaaS`\n\n### 14. 在“NIST 云架构”中，哪个实体管理云服务并维护云提供商与订阅者之间的关系？\n\
