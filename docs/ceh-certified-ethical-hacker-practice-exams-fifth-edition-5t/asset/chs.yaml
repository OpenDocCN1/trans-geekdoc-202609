  \n## 18. 下列哪种是用于 IoT 安全测试的高级无线设备？\n\n**A.** Fluke\n**B.** Raspberry Pi\n**C.** HackRF\
  \ One\n**D.** Alfa AWUS36NH\n\n## 19. 下列哪种模型广泛用于工业控制系统（ICS）网络的内部通信？\n\n**A.** Purdue\
