- fmt: "\n# 1.1 Basic of programming language\n\nWhen I showed my mum my first programming\
    \ homework in high school, it was some command line-based maths game, the purpose\
    \ is to guess a number, a real number, not a complex number. It involves some\
    \ randomly generated seeds with some predefined calculation, and another randomly\
    \ generated real number became the target answer. I could also set the difficulty\
    \ level to make it easier for players. I remember well that my mum was looking\
    \ at the black and white DOS-like screen, hoping a cheerful song would be played.\
    \ Yes, once I got it right, that sound was played to reward the winner. That was\
    \ a story from the last century, and I cannot remember the name of the language\
    \ that I was using. It was on the first computer that I had and it has probably\
    \ been recycled (hope so) decades ago.\n\nStories apart, let's look at the definition\
    \ of programming: Programming is the process of taking an algorithm and encoding\
    \ it into a notation, a programming language so that it can be executed by a computer.\
    \ The important first step is the need to find a solution to a problem or requirement.\
    \ Programming is often the way we create a representation of our solutions.\n\n\
    ### Armstrong Numbers\n\nLet’s start with a small example: Armstrong Numbers.\
    \ An Armstrong number of three digits is an integer such that the sum of the cubes\
    \ of its digits is equal to the number itself. For example, 371 is an Armstrong\
    \ number because `3^3 + 7^3 + 1^3 = 371`. How shall we program the algorithm or\
    \ solution for this? Now we have a requirement and a need to solve it. Second,\
    \ we must break down the problem (abstract it) before attempting a solution. The\
    \ smallest Armstrong number is 1 since `1^3 = 1`. It is easy for a single digital\
    \ integer, we just need to get the input and multiply it by itself three times.\
    \ If it is equal to the input integer, it is Armstrong number, otherwise, it is\
    \ not.\n\nHow about two-digit integers, or three, four or even five and what if\
    \ we would like to have all the Armstrong numbers printed out within a given upper\
    \ limit? Now we need an algorithm or a more structured plan: First of all, we\
    \ read the input of the integer number digit by digit (to do so, we must convert\
    \ the integer into a string then we repeat the `i3` for each digit and sum up.\
    \ This involves a `for` loop:\n\n```python\nl = 0\ns = str(n)\nfor i in s:\n \
    \   l = int(i)*int(i)*int(i) + l\n```\n\nWe have converted the multi-digit integer\
    \ into a string `s` by having `s = str(n)` where `n` is the input integer. The\
    \ `for` loop reads each character of the string and calculates the `i3`. Here\
    \ there is a data type conversion from string to integer by writing `int(i)` so\
    \ that an arithmetic operation can be performed. Since the purpose is to sum up\
    \ the `i3` for each digit, we need to add up the previous calculation in each\
    \ `for` loop step since otherwise, with `l=int(i)*int(i)*int(i)` only, it gives\
    \ the last digit’s cube value. For `n = 123`, the result of the above code gives\
    \ `1^3 + 2^3 + 3^3 = 36`.\n\nNow we need to wrap it into a function so that it\
    \ can be reused later from the main function. Let's say the next step is to find\
    \ all the Armstrong numbers between 1 and an upper limit. Now you must be visualizing\
    \ that there is a kind of `for` loop involved to calculate each integer within\
    \ this range and if it fits the Armstrong number criteria, we keep it and print\
    \ it out. If not, we continue. Consequently, a sort of Armstrong number test function\
    \ is needed to check whether the criteria is met or not.\n\nFirst, we wrap the\
    \ algorithm that we have just mentioned into a function `arm(n)` ( Python function\
    \ will be introduced in chapter 1.6) with the case where the input `n` is single\
    \ digit integer:\n\n```python\ndef arm(n):\n    l = 0\n    if len(str(n)) <2:\
    \ #single digit integer case\n        return n*n*n\n    else:\n        s = str(n)\n\
    \        for i in s:\n            l = int(i)*int(i)*int(i)+ l\n        return\
    \ l\n```\n\nThe test function is called `arm_test(x)``. It reads the input number\
    \ `x` and compares it with the Armstrong number calculation function `arm(n)`:\n\
    \n```python\ndef arm_test(x):\n    if x == arm(x):\n        print (x, \"is an\
    \ Armstrong number!\")\n    else:\n        print (x, \"isn't an Armstrong number\"\
    )\n```\n\nFinally, there is always a main part which defines the input and output\
    \ and how different functions get called and results are used as intermediate\
    \ input for another function. The full code is in the later Python functions chapter\
    \ 1.6.\n\n# 1.2 What is Python?\n\nPython is an interpreted high-level programming\
    \ language for general-purpose programming. Created by Guido van Rossum and first\
    \ released in 1991, Python has a design philosophy that emphasizes code readability,\
    \ notably using significant white space. Python features a dynamic type system\
    \ and automatic memory management. It supports multiple programming paradigms,\
    \ including object-oriented, imperative and functional programming and has a large\
    \ and comprehensive standard library.\n\nPython uses whitespace (spaces and tabs)\
    \ instead of brackets-{}`. This is also called Indentation. So, when you type\
    \ the Python code, you need to be careful about the space key as it could introduce\
    \ an error of the structure. Below is an example in Java of a public function\
    \ with a `for` loop:\n\n```java\npublic static int sumList(int[] liste) {\n  \
    \  int total = 0;\n    for(int val : liste) {\n        total += val;\n    }\n\
    \    return total;\n}\n```\n\nIn Python, you do not need to declare the public\
    \ or private in front of a method, neither the type of the variables. The following\
    \ code is what it looks like in Python:\n\n```python\ndef sumList(liste):\n  \
    \  total = 0\n    for val in liste:\n        total += val\n    return total\n\
    ```\n\nPython is readable and has simple syntax, which makes it more user-friendly\
    \ and less complex. Hence it is easy to learn for beginners and has many interactive\
    \ features. Most importantly, this language has been evolving dramatically during\
    \ the last decades with many open sources packages available to do fancy algorithms.\n"
