  trans: "\n\n# 参数设置\n\n1. `volatility` 不能超过 100% - 在这里我们将 `volatility` 设置为 `10%`。\n\
    2. `漂移率 μ ( mu )` 和 `无风险利率 r` 需要是一个较小的数字 – 我们将无风险利率设置为 `1%`，将漂移率设置为 `4%`，这代表了当前的费率和经济增长水平。\n\
    3. `dt` 是时间步长，需要足够小以符合其概念意义 – 我们将 `dt` 设置为 `0.1`。\n4. `time_step` 与底层资产的到期期限相关。\n\
    5. `sim_step` 决定了模拟结果的准确性。\n\n在这里为了说明目的，我们将 `time_step` 和 `sim_step` 都设置了较小的值以加快运行速度。在下一页中，你将找到完整的代码。\n\
    \n```python\nimport numpy as np # 我们定义市场数据和模型参数\nvol = 0.1\nr = 0.01\nmu = 0.04\n\
    s_1 = 100\ndt = 0.1\nsim_step = 40 # 可以增加以提高准确性，但会减慢速度\ntime_step = 80 # 与底层资产的到期期限相关\n\
    \n# 初始化 ndarray 输出\ndet_model_output = np.zeros(time_step) # 确定性模型，所以我们需要 1D 数组\n\
    const_model_output = np.zeros(time_step) # 常数，我们不需要模拟\nstoc_model_output = np.zeros((time_step,\
    \ sim_step))\nconst_model_output[:] = s_1\ndet_model_output[0] = s_1\nstoc_model_output[0:]\
    \ = s_1 # 为确定性和随机模型启动循环\nfor column in range(0, sim_step):\n    for row in range(1,\
    \ time_step):\n        if column == 0:\n            det_model_output[row] = deterministic_model(det_model_output[row-1],\
    \ r, dt)\n        # 确定性模型只有一个维度，即时间范围\n        stoc_model_output[row][column]\
    \ = stochastic_model(stoc_model_output[row-1][column], dt, mu, vol)\n```\n\n`stoc_model_output`\
    \ 的缩进非常重要，因为只有随机模型的 2D 矩阵会通过嵌套 循环（见图 3-1）。确定性模型没有随机性，因此除列零之外（其他模拟路径结果）在这里并不重要。现在我们有了用于确定性资产价格、常量资产价格和随机资产价格的\
    \ `det_model_output`、`const_model_output` 和 `stoc_model_output`。算法包含嵌套 循环，这不是我们想要的特性。在这里纯粹是为了说明（见图\
    \ 3-1），我们构建了一个二维数组（`ndarray`），其中每列代表每个模拟步，每行代表时间步。![](img/Image00034.jpg)\n图 3-1\
    \ 二维数组 - 嵌套循环\n\n模拟未来资产路径并对其进行编码有很多替代方案，其中一些比其他的更优，另一些只是不同的思考方式。\n\n## 3.2 可视化图形示例\n\
    \n为了可视化资产路径及其指示的未来价格，我们需要在图 3-2 中导入 `matplotlib` 进行图形化表示。\n\n```python\nimport\
    \ matplotlib\nimport matplotlib.pyplot as plt\n\nplt.plot(det_model_output, 'g')\n\
    plt.title('Deterministic model output')\nplt.xlabel('time step')\nplt.ylabel('Asset\
    \ Price')\nplt.grid()\nplt.show()\n```\n![](img/Image00035.jpg)\n图 3-2 基于确定性模型的资产价格路径\n\
    \n对于常量模型输出 `const_model_output`：见图 3-3：\n```python\nplt.plot(const_model_output,\
    \ 's')\nplt.title('constant model output')\nplt.xlabel('time step')\nplt.ylabel('Asset\
    \ Price')\nplt.grid()\nplt.show()\n```\n![](img/Image00036.jpg)\n图 3-3 常量（无噪声）资产路径\n\
    \n为了绘制随机资产路径，我们需要一个 循环和 `np.transpose()`。由于我们要沿着 x 轴绘制时间步，所以我们需要先转置输出以符合我们的图形表示：见图\
    \ 3-4 用于：\n```python\nfor i in range(0, sim_step):\n    plt.plot(np.transpose(stoc_model_output)[i])\n\
    \nplt.plot(np.mean(stoc_model_output, axis=1), 'bs')\nplt.title('stochastic model\
    \ output')\nplt.xlabel('time step')\nplt.ylabel('Asset Price')\nplt.grid()\nplt.show()\n\
    ```\n![](img/Image00037.jpg)\n图 3-4 基于随机模型的资产价格路径\n\n从图 3-4 可以看到粗蓝线是每个时间步资产价格的平均（期望）。如果我们想绘制平均值，见图\
    \ 3-5：\n```python\nplt.plot(np.mean(stoc_model_output, axis=1))\n```\n![](img/Image00038.jpg)\n\
    图 3-5 随机模型下的平均值\n\n## 3.3 模型参数分析\n\n...\n![](img/Image00039.jpg)\n图 3-6 模拟步的平均资产价格\n\
    \n## 3.4 代码实现细节\n\n随机模型的结果非常有趣，对于那些不熟悉经典几何布朗运动（GBM）模型的人来说可能会发现输出很反常。首先，回顾函数：\n\
    \n```python\ndef stochastic_model(s_1, dt, mu, vol):\n    dW = np.random.randn(1)[0]\
    \ * np.sqrt(dt)\n    ds = mu * s_1 * dt + vol * s_1 * dW\n    s = s_1 + ds\n \
    \   return s\n```\n\n我们稍微修改了主代码部分以包含随机建模输出 `ndarray` ：\n\n```python\ndef cal(vol):\n\
    \    dt = 0.1\n    r = 0.01\n    mu = 0.04\n    s_1 = 100\n    dt = 0.1\n    sim_step\
    \ = 40\n    time_step = 80\n    stoc_model_output = np.zeros((time_step, sim_step))\n\
    \    stoc_model_output[0:] = s_1 # 我们设置初始值\n    for column in range(0, sim_step):\n\
    \        for row in range(1, time_step):\n            if column == 0:\n      \
    \          det_model_output[row] = deterministic_model(det_model_output[row-1],\
    \ r, dt)\n            stoc_model_output[row][column] = stochastic_model(stoc_model_output[row-1][column],\
    \ dt, mu, vol)\n    return np.mean(stoc_model_output, axis=1)\n```\n\n现在我们开始主部分，包括绘图部分和我们分析的目标变量\
    \ – `volatility`。已经设置了一个不同波动率列表，使用 for 循环，波动率列表中的每个值都发送到函数 `cal()` 进行分析：导入 `matplotlib`。\n\
    \n"
