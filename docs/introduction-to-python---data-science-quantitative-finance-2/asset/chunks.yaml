    \  dt = 0.1\n    r = 0.01\n    s_1 = 100\n    sim_step = 40\n    time_step = 80\n\
    \    stoc_model_output = np.zeros((time_step, sim_step))\n    stoc_model_output\
    \ [0][:] = s_1\n    for column in range ( 0 ,sim_step):\n        for row in range\
