  trans: "\n\n# 1.1 编程语言基础\n\n当我高中向我妈妈展示我的第一份编程作业时，那是一个基于命令行的数学游戏，目的是猜一个数字——一个实数，而不是复数。它涉及到一些随机生成的种子和一些预定义的计算，以及另一个随机生成的实数作为目标答案。我还可以设置难度级别来让玩家更容易通过。我清楚地记得我妈妈看着那个黑白色的类\
    \ DOS 屏幕，希望能播放一首欢快的歌曲。是的，一旦我猜对了，那个声音就会响起来奖励获胜者。那是上世纪的故事，我不记得我当时使用的是什么语言了。它运行在我拥有的第一台电脑上，可能在几十年前就已经回收利用了（希望如此）。\n\
    \n故事暂暂不谈，让我们来看看编程的定义：编程是将算法并将其编码为一种符号（即编程语言），以便计算机可以执行的过程。重要的第一步是找到解决问题或需求的解决方案。编程通常是我们创建解决方案表示形式的方式。\n\
    \n### 阿姆斯特数（Armstrong Numbers）\n\n让我们从一个小例子开始：阿姆斯特数。一个三位阿姆斯特数是一个整数，其各位数字的立方之和等于该数字本身。例如，371\
    \ 是一个阿姆斯特数，因为 `3³ + 7³ + 1³ = 371`。我们该如何为此编写算法或解决方案呢？现在我们有一个需求和一个需要解决的问题。其次，在尝试解决方案之前，我们必须分解问题（抽象化）。最小的阿姆斯特数是\
    \ 1，因为 `1³ = 1`。对于单数字整数来说很简单，我们只需要获取输入并将其乘以三次。如果它等于输入的整数，它就是阿姆斯特数，否则不是。\n\n两位、三位、四位甚至五位的整数呢？如果我们想打印给定上限范围内所有的阿姆斯特数怎么办？现在我们需要一个算法或一个更有结构性的计划：首先，我们逐位读取整数的数字（为了这样做，我们必须将整数转换为字符串，然后对每个数字重复\
    \ `i3` 操作并累加）。这涉及一个 `for` 循环：\n\n```python\nl = 0\ns = str(n)\nfor i in s:\n \
    \   l = int(i)*int(i)*int(i) + l\n```\n\n我们通过 `s = str(n)` 将多位整数转换为字符串 `s`，其中\
    \ `n` 是输入整数。`for` 循环读取字符串的每个字符并计算 `i3`。这里通过编写 `int(i)` 完成从字符串到整数的数据类型转换，以便进行算运算。由于目的是累加每个数字的\
    \ `i3`，我们需要在每个 `for` 循环步骤中加上之前的计算结果，否则如果只用 `l=int(i)*int(i)*int(i)`，只会得到最后一位数字的立方。对于\
    \ `n = 123`，上述代码的结果为 `1³ + 2³ + 3³ = 36`。\n\n现在我们需要将其封装成一个函数，以便以后从主函数中复用。假设下一步是找到\
    \ 1 到某个上限之间所有的阿姆斯特数。现在你必须脑海中涉及到一种 `for` 循环来计算该范围内的每个整数，如果它符合阿姆斯特数的标准，我们就保留并打印它。如果不符合，我们就继续。因此，需要一个阿姆斯特数测试函数来检查是否满足标准。\n\
    \n首先，我们将刚刚提到的算法封装进函数 `arm(n)`（Python 函数将在第 1.6 节介绍），处理输入 `n` 为单位整数的情况：\n\n```python\n\
    def arm(n):\n    l = 0\n    if len(str(n)) <2: #单位整数情况\n        return n*n*n\n\
    \    else:\n        s = str(n)\n        for i in s:\n            l = int(i)*int(i)*int(i)+\
    \ l\n        return l\n```\n\n测试函数名为 `arm_test(x)`。它读取输入数字 `x` 并将其与阿姆斯特数计算函数 `arm(n)`\
    \ 进行比较：\n\n```python\ndef arm_test(x):\n    if x == arm(x):\n        print (x,\
    \ \"is an Armstrong number!\")\n    else:\n        print (x, \"isn't an Armstrong\
    \ number\")\n```\n\n最后，总有一个主部分来定义输入输出，以及如何调用不同的函数，以及结果如何作为另一个函数的中间输入。完整代码位于后面的\
    \ Python 函数章节 1.6 中。\n\n# 1.2 什么是 Python？\n\nPython 是一种用于通用编程的解释型高级编程语言。由 Guido\
    \ van Rossum 创建并在 1991 年首次发布，Python 的设计哲学强调代码的可读性，特别使用了大量的空白字符。Python 具有动态类型系统和自动内存管理。它支持多种编程范式，包括面向对象、命令式和函数式编程，并拥有庞大的标准库。\n\
    \nPython 使用空白（空格和制表符）而不是大括号 `{}`。这称为缩进。因此，当你输入 Python 代码时，需要注意空格键，因为它可能会引入结构错误。下面是\
    \ Java 中带有 `for` 循环的公共函数示例：\n\n```java\npublic static int sumList(int[] liste)\
    \ {\n    int total = 0;\n    for(int val : liste) {\n        total += val;\n \
    \   }\n    return total;\n}\n```\n\n在 Python 中，你不需要在方法前面声明公共或私有，也不需要声明变量类型。以下代码是\
    \ Python 中的样子：\n\n```python\ndef sumList(liste):\n    total = 0\n    for val in\
    \ liste:\n        total += val\n    return total\n```\n\nPython 可读且语法简单，这使得它对用户更友好且不那么复杂。因此，它很容易供初学者学习，并具有许多交互特性。最重要的是，在过去的几十年里，这种语言经历了巨大的演变，有许多开源包可用于执行复杂的算法。\n\
    \n"
- fmt: "\n## 1.3 Python Development Environment\n\nBefore starting programming, you\
    \ need to have a code editor, or IDE - integrated Development Environment. `Spyder`\
    \ is a good choice for beginners to start with, especially those who do not need\
    \ to use some advanced functions which are included in `PyCharm`. It is light\
    \ and easy to install and often comes with the python package. It does not require\
    \ a license and does not consume too much memory in running programmes. `PyCharm`\
    \ is suitable for advanced users who are familiar with IDEs and their integrated\
    \ functionality like debugging, stepping-into a breakpoint, re-factoring and large-scale\
    \ development with multiple files, packages, and multiple developers. If you have\
    \ a large library of python programmes, you need something like `PyCharm`.\n\n\
    One good option to start with Python coding is a shell environment or a console\
    \ using Command lines. The classic DOS command lines can also be used along with\
    \ a text editor. A console is where you may enter, interact with and visualize\
    \ data, inside a command interpreter. All the commands entered in the console\
    \ are executed on the spot, thus allowing the user to interrupt any process freely.\
    \ \n\nAnother popular development environment is `Jupyter Notebook`. It is an\
    \ open-source web application that allows you to create and share documents that\
    \ contain live code, equations and graphs. It has the same advantage as console-like\
    \ development environment, but visual-friendly and powerful. There exist various\
    \ integrated data science platform (i.e. `Anaconda`) where the development environment\
    \ and open-source packages are pre-downloaded. In this book, all the code examples\
    \ are either based on the `Jupyter notebook` or the `Python Console` (most of\
    \ the IDE like `Spyder` and `PyCharm` have a console window). `Anaconda` can be\
    \ downloaded here [https://www.anaconda.com/). `Anaconda Navigator` is a GUI-based\
    \ tool that allows you to find all the different toolkit and software provided\
    \ by `Anaconda` with ease. Running the program will give you the screen: ![](Image00005.jpg)As\
    \ you can see, there are lots of programs available to you. By clicking Launch\
    \ to open the `Jupyter Notebook` program. A new tab will open in your browser\
    \ showing a list of folders and files in your home directory.\n\n## 1.4 Basic\
    \ data types in Python\n\nI have listed the basic data types in the table below\
    \ with relevant comments and examples:\n\n| Type | Example | Comments |\n| :---\
    \ | :--- | :--- |\n| `bool` | `True`, `False` | It is a “logical” value |\n| `int`\
    \ | `123` | Integer |\n| `float` | `1.23` | The `float` type in Python designates\
    \ a floating-point number, which is represented internally as binary (base-2)\
    \ fractions. Most decimal fractions cannot be represented exactly as binary fractions,\
    \ so in most cases the internal representation of a floating-point number approximates\
    \ the actual value. In practice, the difference between the actual value and the\
    \ represented value is very small and shouldn’t cause significant problems |\n\
    | `complex` | `1.2+3j` | Complex numbers are specified as `<real part>+<imaginary\
    \ part>j`, both of which are floating-point values. |\n| `Str` | `\"hello\"`,\
    \ `''` | Strings are sequences of character data. A string in Python can contain\
    \ as many characters as you wish. The only limit is your machine’s memory resources.\
    \ A string can be empty |\n| `list` | `[1,2,3]`, `[2,5,'python']`, `[[2,4],[3,6]]`\
    \ | A `list` can contain a series of values of the same or different types and\
    \ defined by square brackets `[]`. All lists in Python are zero-based indexed.\
    \ Lists aren’t limited to a single dimension. One can declare multiple dimensions\
    \ by separating a square bracket `[]` with commas. `List` is dynamic and mutable.\
    \ |\n| `tuple` | `(1,2,3)` | `Tuples` are a group of values like a list and are\
    \ manipulated in similar ways. However, tuples are fixed in size (immutable) and\
    \ members cannot be altered once they are assigned. `Tuples` are defined by parenthesis\
    \ `()`. |\n| `dict` | `{'Age': 17, 'name': 'Peter'}` | Dictionaries in Python\
    \ are lists of `Key: Value` pairs. This is a very powerful datatype to hold a\
    \ lot of related information that can be associated through `keys`. The main operation\
    \ of a dictionary is to extract a value based on the `key` name. Unlike lists,\
    \ where index numbers are used, dictionaries allow the use of a `key` to access\
    \ its members. Dictionaries can also be used to sort, iterate and compare data.\
    \ Dictionaries are created by using braces `{}` with pairs separated by a comma,\
    \ and the key, value pairs associated with a colon: Each key in a dictionary the\
    \ `Key` must be unique. |\n\nAbove are the most common data types in Python and\
    \ we can use below programme line to check the python data type. For example:\
    \ `type(variable)`\n\n## 1.5 Looping and Condition\n\nLoop is probably one of\
    \ the most important logic operations in the programming world. Looping repeats\
    \ as long as certain condition is met.\n\n### For statement\nLet’s look at what\
    \ does `range(x)` mean:\n- The iterator starts with 0 and iterates through `x`\
    \ integer\n- `(0, 1,2,…..x)` if `x > 2`\n\n```python\nfor i in range(3):\n   \
    \ print(i)\n# Output: 0 1 2\n```\n\n### While statement\n```python\nj = 4\nwhile\
    \ j > 0:\n    print(j)\n    j = j-1\n# Output: 4 3 2 1\n```\n\n### For or while?\n\
    We use a `for` loop if we know the maximum of times that we will need to execute\
    \ the body. For example, if we are traversing a list of elements, we know that\
    \ the maximum number of iterations we can need is “all the elements in the list”.\
    \ By contrast, if we are required to repeat some computation until some condition\
    \ is met, and we cannot calculate in advance when this will happen, we will need\
    \ a `while` loop. We call the first case `(for loop) definite iteration` — we\
    \ have some definite bounds for what is needed. The latter case `(while loop)`\
    \ is called `indefinite iteration` — we’re not sure many iterations we’ll need\
    \ — we cannot even establish an upper bound!\n\n### Condition statement\nIn order\
    \ to write useful programs, we almost always need the ability to check conditions\
    \ and change the behaviour of the program accordingly. A condition gives us this\
    \ ability. The simplest form is the `if` statement:\n\n```python\nif boolean expression:\n\
    \    statements\n```\nThe boolean expression after the `if` statement is called\
    \ the `condition`. If it is true, then all the indented statements get executed.\
    \ What happens should the condition be false; shall we do something else or put\
    \ another condition? The other condition is headed by `elif` and the default statements\
    \ are headed by `else`:\n\n```python\nif type(i) == list:\n    print(\"It is list\
    \ type\")\nelif type(i) == int:\n    print(\"It is integer type\")\nelse:\n  \
    \  print(\"It is other type\")\n```\n"
