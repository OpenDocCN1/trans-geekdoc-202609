    \n2008 年 1 月抵达伦敦在摩根大通（JP Morgan）工作并不是什么平凡的事，至少对于我这个来自普通背景、与西方世界毫无联系、并由谦逊的父母支持的人来说是如此的。此外，我没有\
    \ MBA 学位，也没有来自牛津或常春藤等名校大学的金融硕士学位来换取优厚的待遇和额外的酌扣奖金。2008 年在我的记忆中以及金融史上都是非常不寻的一年。那是\
    \ 2008 年 9 月，在雷曼兄弟倒产期间。当时我被分配到前台的 Hybrids 部门，负责信用衍生品的定价和建模。为了简单介绍一下 Hybrids 和\
    \ Exotics（奇异产品）：我们有 CDO、CDO2、杠杆分档以及使用多名信用投资组合建模的档位期权。是的，它们听起来都既复杂又令人兴奋。在信用衍生品交易台的日子里就像地狱，但是一个充满学习机会和让你开眼界的地狱，让你看到一个并不多人洞察的世界；那是一个有着漫长工作时间、不断的叫喊声以及需要应对贪婪和疯狂的地狱。现在回想起来，我发现我的记忆过滤掉了糟糕和悲伤的部分，只留下了兴奋和回报。那些辛劳而狂野的日子塑造了现在这个具有韧性、坚韧不拔和决心的自我。随着我所获得的那些金字不可求的职业技能，我现在拥有一套强大的工具箱，可以应对各种环境，尤其是恶劣的环境。将编程视为一段通往解决方案的旅程并享受这段旅程，有助于我们欣赏通往目标本身的每一个元素。\n\
