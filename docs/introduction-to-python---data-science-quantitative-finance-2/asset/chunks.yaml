  trans: "\n\n```python\nj = 1\ne2 = 0\ne = 1+1/1 #initialize e\nwhile j <= 5:\n \
    \   if j == 2:\n        e2 = 1/2\n        e = e + e2\n        print ('mathematical\
    \ constant e is', e)\n    if j == 3:\n        e2 = 1/6\n        e = e + e2\n \
    \       print ('mathematical constant e is', e)\n    if j == 4:\n        e2 =\
    \ 1/24\n        e = e + e2\n        print ('mathematical constant e is', e)\n\
    \    if j == 5:\n        e2 = 1/120\n        e = e + e2\n        print ('mathematical\
    \ constant e is', e)\n    j = j + 1\n```\n输出为：mathematical constant e is 2.5 mathematical\
    \ constant e is 2.6666666666666665 mathematical constant e is 2.708333333333333\
    \ mathematical constant e is 2.7166666666666663\n\n我们将迭代限制设为 5，并使用 `while` 循环来计算\
    \ `n` 等于 5 的无限级数。这是一个独立的计算，只要没有达到迭代限制，`if` 条件就可以继续执行。它没有调用 Python 函数 `recur_factorial(n)`，因为\
    \ `n!` 的计算是内联完成的，这并不是理想的，因为随着迭代的增加，这种计算会变得复杂并可能引入错误，从而降低精度。\n\n方法 2，使用函数 `recur_factorial(n)`\
    \ 来计算 `n!` 并使用 `while` 循环来累加阶乘。迭代次数设为 9。\n- `while j < 10` 意味着循环在 `j` 达到 9 时停止。\n\
    ```python\nj = 0\ne = 1.0 #initialize e\nwhile j < 10:\n    e2 = 1/recur_factorial(j\
    \ +1)\n    e = e2 + e\n    print ('e is', e, 'and iteration number is', j)\n \
    \   j = j + 1\n```\n输出为：e is 2.0 and iteration number is 0 e is 2.5 and iteration\
    \ number is 1 e is 2.6666666666666665 and iteration number is 2 e is 2.708333333333333\
    \ and iteration number is 3 e is 2.7166666666666663 and iteration number is 4\
    \ e is 2.718055555555555 and iteration number is 5 e is 2.718253968253968 and\
    \ iteration number is 6 e is 2.71827876984127 and iteration number is 7 e is 2.718281525573192\
    \ and iteration number is 8 e is 2.71828180114638 and iteration number is 9\n\n\
    我们可以看到，随着迭代的增加，数学常数 `e` 的精度得到了提高，特别是当 `n` 高于 5 时。方法 3 与方法 2 非常相似。唯一的区别是使用了 `for`\
    \ 循环而不是 `while` 循环。在这种情况下，我们不需要手动增加 `j`。\n\n使用 `for`：\n```python\ne = 1.0 #initialize\
    \ e\nfor j in range (10):\n    e2 = 1/recur_factorial(j +1)\n    e = e2 + e #sum-up\n\
    \    print ('e is', e, 'and iteration number is', j)\n```\n输出为：e is 2.0 and iteration\
    \ number is 0 e is 2.5 and iteration number is 1 e is 2.6666666666666665 and iteration\
    \ number is 2 e is 2.708333333333333 and iteration number is 3 e is 2.7166666666666663\
    \ and iteration number is 4 e is 2.718055555555555 and iteration number is 5 e\
    \ is 2.718253968253968 and iteration number is 6 e is 2.71827876984127 and iteration\
    \ number is 7 e is 2.718281525573192 and iteration number is 8 e is 2.71828180114638\
    \ and iteration number is 9\n\n方法 4 使用了强大的 Python `List` 类型来方便累加。在方法 3 中，累加是在\
    \ `for` 循环中实现的，而不同 `n` 的阶乘值被存储在列表中。累加是通过 Python `sum()` 函数实现的：当 `a` 是列表时，`sum(a)`\
    \ 会加上列表 `a` 中的所有数字。在代码中，我们调用 `recur_factorial(n)` 并打印列表 `e2`，它包含了不同 `n` 的 `1/n!`\
    \ 值：`1/1, 1/2, 1/6,1/24……`\n```python\nn = 9\ne2 = [1/recur_factorial(i) for i\
    \ in range (1 ,n)]\nprint(e2)\ne = 1+sum(e2)\nprint ('e is', e, 'and the number\
    \ of iteration is', n)\n```\n输出类似于：[1.0, 0.5, 0.16666666666666666, 0.041666666666666664,\
    \ 0.008333333333333333, 0.001388888888888889, 0.0001984126984126984, 2.48015873015873e-05]\
    \ e is 2.71827876984127 and the number of iteration is 9\n\n有一种更好的方法可以完全在主代码中消除\
    \ `for`（或 `while`）循环，但这需要对函数 `recur_factorial(n)` 进行修改，以扩展其功能，包含根据 `n` 值对不同阶乘进行累加。我将这个留给你的练习。\n\
    \n"
- fmt: "\n# 1.7.2 Second example: Euler identity\n\nAs I am so passionate about Euler\
    \ and the natural logarithm base `e`, we will have a look at another master piece\
    \ of Euler’s invention: We have Euler identity written in Figure 1‑4 and I assume\
    \ that you are familiar with complex number and its geometrical representation.\n\
    \n![](Image00010.jpg)\nFigure 1‑4 Euler Identity where `e` is Euler’s number that\
    \ we just estimated in the first example. `i` is the imaginary unit defined as\
    \ `i^2 = -1` and `π` is the number pi, the ratio of the circumference of a circle\
    \ to its diameter. From Figure 1‑2, we set `x = iπ`, we have `e^{iπ}:`![](Image00011.jpg)\n\
    \nWe know `e^{iπ}` is reaching -1 when `n` is approaching infinite. We have implemented\
    \ a convergence logic to check the value of `e^{iπ}` when `n \\in [0,100]`. Similar\
    \ as the previous example of estimating `e`, we have a function created to do\
    \ the iteration. The difference here with function `recur_factorial(n)` is we\
    \ have used the formula in Figure 1‑3, which has an explicit iteration `n` and\
    \ an implicit iteration `n_local`.\n\n![](Image00012.jpg)\nFigure 1‑5 Illustration\
    \ of global variable `n` and its passing towards a local variable `n_local`. `n_local`\
    \ is a local variable which gets created when the function is called. It is only\
    \ used inside the function: `euler_id_loop (n_local)`. It controls how many local\
    \ iteration is needed for this function call. `n` is a global variable which is\
    \ irrelevant in the light of local iteration as it is determined by key sentence\
    \ in the main function: `for n in range (1, 1000)`. Please see Figure 1‑5 for\
    \ illustration and the code representation becomes:\n\n```python\ndef euler_id_loop\
    \ (n_local):\n    if n_local ==1:\n        return (1+ (math.pi * complex (0, 1))\
    \ / n)\n    else:\n        return (1+ (math.pi * complex (0, 1)) / n) * euler_id_loop(n_local\
    \ -1)\n```\n\nThe main function becomes:\n\n```python\nimport math as math\nimport\
    \ matplotlib.pyplot as plt\nreal = []\nimag = []\nfor n in range (1, 1000):\n\
    \    #n is global variable controls loop iteration\n    if n == 1:\n        eulerid\
    \ = (1+ (math.pi * complex (0, 1)) /1)\n        print(n, eulerid)\n    else:\n\
    \        eulerid = euler_id_loop (n) #n being passed on to the function to shape\
    \ a new local variable\n        real.append(eulerid.real)\n        imag.append(eulerid.imag)\n\
    \    real.append(eulerid.real)\n    imag.append(eulerid.imag)\nplt.scatter(real,imag)\n\
    plt.xlabel('real')\nplt.ylabel('imaginary')\nplt.grid()\nplt.show()\n```\n![](Image00013.jpg)\n\
    Figure 1‑6 Euler Identity convergence proof in graph\n\nWhat if we do something\
    \ on the `iπ` by making it a variable and setting an iteration to go through the\
    \ entire spectrum? It should show a whole circle if our iteration and Looping\
    \ logic is good enough as we have `e^{iπ} = -1` and `e^{2iπ} = 0`. We set a function\
    \ called `euler_id_loop_pi (pi_size, n_local)` where `pi_size` represents the\
    \ variable `nπ`, where `n` is from 0 to the number of full circle we need. A full\
    \ circle is `2π`. As in the `euler_id_loop (n_local)`, the logic here is the same\
    \ apart from having an extra local variable `pi_size` instead of a simple `math.pi`\
    \ as `pi_size` here is a time varying variable. `n_local` is the iterator.\n\n\
    ```python\ndef euler_id_loop_pi (pi_size, n_local):\n    if n_local == 1:\n  \
    \      return (1+ (pi_size * complex (0, 1)) / n)\n    else:\n        return (1+\
    \ (pi_size * complex (0, 1)) / n) * euler_id_loop_pi(pi_size, n_local -1)\n```\n\
    \nWe then code the main part which iterates through the circle and plot:\n\n```python\n\
    import numpy as np\nreal = []\nimag = []\nn = 2000 #iteration, increase to create\
    \ precision\nfull_circle = 2 # 2Π means a full circle, 4 Π means two circles\n\
    for i in np.arange (0, full_circle * math.pi *1.0, full_circle * math.pi /100):\n\
    \    eulerid = euler_id_loop_pi (i, n)\n    real.append(eulerid.real)\n    imag.append(eulerid.imag)\n\
    plt.scatter(real,imag)\nplt.grid()\nplt.xlabel('real')\nplt.ylabel('imaginary')\n\
    plt.show()\n```\n![](Image00014.jpg)\nFigure 1‑7 A full circle of Euler number\
    \ `e^{iπ}` when `π \\in[0,100]` Well, if the iteration is not large enough, even\
    \ we go through the whole spectrum, we will have mismatch at -1 and 0.\n\n![](Image00015.jpg)\n\
    Figure 1‑8 Euler Convergence\n\nFinal thoughts about this wonderful mathematics\
    \ equation. Along the whole horizon this beautiful circle with both real and imaginary\
    \ units. If we have it from a continuous perspective, Only four lines are truly\
    \ either 100% real or 100% imaginary. The rest of the parts (unlimited or infinite\
    \ numbers of lines are a mixture of Real and Imaginary). Somewhere the real part\
    \ dominants and sometimes, the imaginary part dominants, but it is a mixture of\
    \ the two, a hybrids mode. In life, isn’t it the same? If there is an error, but\
    \ without being corrected, going on and on again (iteration).\n\n## 2 Python Packages\n\
    \nIn this chapter, we will have a close look at three commonly used Python packages:\
    \ Numpy for mathematics and statistics, Pandas for data analysis and Matplotlib\
    \ for visual plot.\n\n### 2.1 Mathematics - NumPy\n\nNumPy is a library for the\
    \ Python programming language, adding support for large, multi-dimensional arrays\
    \ and matrices, along with a large collection of high-level mathematical functions\
    \ like linear algebra, Fourier transforms and random number capabilities, to operate\
    \ on these arrays. Besides its obvious scientific uses, NumPy can also be used\
    \ as an efficient multi-dimensional container of generic data. Arbitrary data-types\
    \ can be defined. This allows NumPy to seamlessly and speedily integrate with\
    \ a wide variety of databases.\n"
