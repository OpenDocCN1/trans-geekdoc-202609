    \ ..., 0.00490133, -0.01557383])\n```\n返回值的输出与第一种相同。使用 `Pandas` series 特性的第一种方法快得多（对于不熟悉\
    \ `Pandas` 数据序列结构的人来说可能可能那么直观），而且更加高级。\n\n### 练习 2\n另一个我们可以轻松练习的练习是计算每日收益率的平均值和标准差：\n\
    ```python\nmean = ret.mean()\nstdv = ret.std()\nprint('the mean of the daily return\
    \ is' , mean)\nprint('the standard deviation is' , stdv)\n```\n每日收益率的平均值为 `0.0005977280989583951`，标准差为\
    \ `0.007498175157038745`。\n\n### 练习 3\n计算收益率后，我们需要通过将计算出的每日收益率写回新的 csv 文件来存储它们。第一方法是传统的循环方法（缓慢！），它涉及逐个插入项目：\n\
    ```python\nadjClose = df['Adj Close']\nadjCloseArray = adjClose.values\nret =\
    \ (adjCloseArray[1:] - adjCloseArray[:-1])/ adjCloseArray[:-1]\ni = 0\nwhile i\
    \ < adjClose.size- 1 :\n    df.loc[i, ('return')] = ret[i]\n    i = i+ 1\n```\n\
    `loc[]` 在行级别工作，要访问列只需使用 `df['xxx']`，其中 `xxx` 是数据框列名。上述是行和列组合的示例：\n```python\n\
    print (df)\n```\n![](img/Image00021.jpg) [2771 行 x 8 列]\n\n第二种方法是将转换后的 `Pandas`\
    \ series 直接插入整个 `DataFrame` 而不使用循环，这种方法更快且更直观。我们首先将收益率数组转换为 `Pandas DataFrame`，然后使用带有相关参数的\
    \ `insert()` 函数：\n```python\ndf_ret = pd.DataFrame(ret, dtype = 'float')\ndf.insert(loc\
    \ = 0, column = 'return ', value = df_ret)\n```\n结果如下：![](img/Image00022.jpg)\
    \ 我们也可以通过将 `loc = 0` 改为其他值（只要 `0 <= loc <= len(columns)`）来更改此新创建列的位置。有许多替代方案，例如使用\
    \ `.apply()` 函数。如果你感兴趣，我将留给你们去探索所有这些。本章的主要目的是介绍 Python 或者预热其相关包在金融数据领域的适用用法知识。\n\
    \n### 练习 4\n在计算平均值和标准差后，我们可以进行简单的过滤，查看每日收益率值中的异常值。我们将离群值定义为偏离平均值两倍标准差的值。\n```python\n\
    upLimit = mean+2*stdv\nlowLimit = mean-2*stdv\n# 从数据框中过滤出所需行的逻辑条件\ndf[(df['return']\
    \ > upLimit) | (df['return'] < lowLimit)]\n```\n![](img/Image00023.jpg) 图 2‑2\
    \ 用于道斯指数数据的 pandas 数据框架。它在每日限制报告中非常有用。通常，在面对大量的每日数据或历史数据时，我们需要过滤出有多少天或多少实体超过了业务或法规预设的限制。一个典型的例子是\
    \ `VaR` 或 `Expected Shortfall`预期缺口分析。`VaR`（或 `ES`）决定了银行在特定时间内可以承受的损失限制。对于每年（或其他时间段）超过此限制的天数有一个阈值。使用一些简单的逻辑，我们可以轻松地提取这些异常值。\n\
    \n### 2.2.3 报告生成\n现在我们将带有新插入列值的数据框作为报告保存，例如本地或共享驱动器上的 csv 文件。\n```python\ndf.to_csv(r'C:/Temp/DJI_return.csv')\n\
    ```\n你应该能看到 `C:/Temp` 下创建了新文件 `DJI_return.csv`。你可能会认为 csv 文件并不那么“强大”，你更倾向于使用 Excel\
    \ 作为报告模板，并嵌入图形图表。以下是对道琼斯指数历史数据进行数据分析示例的完整代码，并生成一个带有图形图表的 Excel 工作表作为报告模板。\n```python\n\
    from pandas import read_csv\nimport pandas as pd\nlocation = r'C:/Temp/DJI.csv'\n\
    df = pd.read_csv(location)\n# 现在我们创建了一个 pandas Data Frames\nadjClose = df['Adj\
    \ Close']\nadjCloseArray = adjClose.values\n# 计算每日收益率\nret = (adjCloseArray[1:]\
    \ - adjCloseArray[:-1])/ adjCloseArray[:-1]\n# 将每日收益率插回数据\ndf_ret = pd.DataFrame(ret,\
    \ dtype = 'float')\ndf.insert(loc = 0, column = 'return ', value = df_ret)\n#\
    \ 将 Pandas DataFrame 保存到 Excel 表格\nout_path = r'C:/Temp/Dow_return.xlsx'\nwriter\
    \ = pd.ExcelWriter(out_path, engine = 'xlsxwriter')\ndf.to_excel(writer, sheet_name=\
    \ 'Sheet1', startrow=0)\n# 获取簿和表对象以便进一步操作\nbook = writer.book\nsheet = writer.sheets['Sheet1']\n\
    # 计算平均值和标准差以计算异常值。这里我们使用 2 倍标准差作为标准\nmean = ret.mean()\nstdv = ret.std()\nupLimit\
    \ = mean+2*stdv\nlowLimit = mean-2*stdv\n# 使用条件格式将异常值设为红色\nformat1 = book.add_format({'font_color':\
    \ '#E93423'})\nsheet.conditional_format('B2:B2771', {'type': 'cell', 'criteria':\
    \ '<=', 'value': lowLimit, 'format': format1})\n# 整个期间的图表\nchart = book.add_chart({'type':\
    \ 'column'})\nchart.add_series({'values': '=Sheet1!B2: B2771', 'name': '=Sheet1!B1',\
    \ 'categories': '=Sheet1!$C$2:$C$2771'})\n# 我们在正确的位置插入每日收益率图表\nsheet.insert_chart('K10',\
    \ chart)\nwriter.save()\n```\n可以看出，与生成包含结果的简单 csv 文件相比，拥有 Excel 工作簿作为报告模板需要更多的代码行和配置。生成的报告看起来\
    \ ![](img/Image00024.jpg) 图 2‑3 生成的报告。我们已经解释了 `Pandas` 包在数据分析方面可以提供的基础函数，它极其依赖于具有重复操作的大规模数据，例如每日报告的生成或对标准数据的每日分析。在报告生成方面，有进一步的可能性通过更个性化的格式和专用的标题等来扩展工作表功能。我将留给你们去探索这个选项。尽管如此，我们不需要把生活变得得太复杂，因为某些事情直接在工作表上做更容易。在数据科学部分，也有可能直接在\
    \ Yahoo 数据上工作而无需将其下载为本地保存文件，这允许使用更高级的“数据科学”方法来分析多个股票的金融市场。由于组合管理和算法投资不是本书的主题，我将留给你们根据兴趣探索这一领域。\n\
    \n"
- fmt: "\n## 2.3 Visual Plot – Matplotlib\n\nMatplotlib Graphic representation is\
    \ very important in the finance. Let’s look at how to plot data. We need to import\
    \ the plot package first. The most common one is called `matplotlib`. Typical\
    \ heading for import is:\n\n```python\nimport matplotlib\nimport matplotlib.pyplot\
    \ as plt\n```\n\nIn the below code examples, the above import is assumed to be\
    \ executed and `plt` stands for `matplotlib.pyplot`. Using the `pandas` package\
    \ example, a simple graph of one column value can be done via a simple command:\
    \ `df['Adj Close'].plot(grid = True)`.\n\n![](Image00025.jpg)Figure 2‑4 time series\
    \ of `AdjClose` from the input data\n\nIt is very simple and raw, without the\
    \ title of the graph and no axis’ information on what they stand for. The x-axis\
    \ is supposed to represent the `Date` type, but it shows different information.\
    \ Let’s look at something more sophisticated by plotting both daily return and\
    \ the `Adj close` data within the same graph but each has its scales.\n\nTo plot\
    \ the `Date` type correctly, which is not obvious as the `Date` column in the\
    \ dateframe is string type when loading from its source. If we convert it into\
    \ `int/float`, it will work, but showing an `int/float` type on the x-axis is\
    \ not going to be visually intuitive. For example, the above simple plotted a\
    \ graph of some data, we will have difficulty in understanding intuitively what\
    \ does the x-axis `[0-2500]` stand for: interval of points or just different steps,\
    \ etc.\n\nThe `Pandas` package has an easy way to do so. Early on, when we read\
    \ the csv file into `Pandas` DataFrame, just add extra parameter `parse_date`\
    \ which is a function for converting a sequence of string columns to an array\
    \ of datetime instances: `df = pd.read_csv(location, parse_dates=['Date'])`, `date\
    \ = df['Date'].values`.\n\nThe type of variable `date` is `numpy.ndarray` but\
    \ by inserting this extra parameter `parse_dates=['Date']`, its elements’ type\
    \ has changed to `numpy.datetime64` from string. The following code will produce\
    \ the graph that has just been described:\n\n```python\nimport matplotlib\nimport\
    \ matplotlib.pyplot as plt\nfig, ax1 = plt.subplots()\n\ncolor = 'red'\nax1.set_xlabel('Date')\n\
    ax1.set_ylabel('daily return', color=color)\nax1.plot(date[:-1], ret, color=color)\
    \ # this is to accommodate the size of x and y axis as ret has one element less\
    \ than the rest.\nax1.tick_params(axis='y', labelcolor=color)\n\nax2 = ax1.twinx()\
    \ # instantiate a second axes that shares the same x-axis\ncolor = 'blue'\nax2.set_ylabel('Adj\
    \ Close', color=color)\nax2.plot(date, adjCloseArray, color=color) # here we uses\
    \ Numpy array, we could also uses pandas data series like df['Adj Close']\nax2.tick_params(axis='y',\
    \ labelcolor=color)\nplt.title('Historical Daily return and Adj close value')\n\
    plt.grid()\nplt.show()\n```\n\n![](Image00026.jpg)Figure 2‑5 two plots in one\
    \ graph with left (red) for daily return time series and right axis(blue) for\
    \ Adjusted close value time series\n\nComparing to the first simple graph, there\
    \ are couple of features here:\n* We have the title of the graph and each axis’\
    \ name to indicate what they stand for\n* Two different scared values are plotted\
    \ in the same graph with their own scare respectively. \n* The non-easy `Date`\
    \ type has been converted correctly\n\n## 2.4 Conclusion\n\nWe have seen what\
    \ is a programming language and what is Python: from the basic data types, loop,\
    \ and conditions to python functions. There is, obviously, lots of similarity\
    \ with other programming languages, for example, `R` and `VBA` which are also\
    \ commonly used in the finance area. We, then, studied the three most commonly\
    \ used Python packages: `Numpy`, `Pandas`, and `Matplotlib`. All these are explained\
    \ along with examples. In the next chapter: Advanced Python Examples, we will\
    \ set up the bar higher in our learning curve, to further explore the three packages\
    \ by introducing a mathematical modelling example and the Object Oriented Programming\
    \ concept.\n\n## 3 Advanced Python Examples\n\nIn this chapter, I will further\
    \ explore some advanced Python examples which use different Python packages, create\
    \ different functions and introduce Object-Oriented Programming (OOP). For beginners,\
    \ I would rather recommend reading the previous chapter first and playing with\
    \ the examples in that chapter before embarking a more advanced journey. Quantitative\
    \ financial models are introduced here as well along with its mathematical representation.\
    \ It requires some basic quantitative finance background.\n\n### 3.1 Mathematical\
    \ Modelling\n\nWe have looked at an example of applying the `Pandas` package where\
    \ the Dow Jones Industrial average’s historical price data was analysed. Now we\
    \ would like to build a programme to predict the future path of the asset price\
    \ movement. There are three possible modelling choices in the example:\n\nThe\
    \ first is a Deterministic Model which means the asset path follows a deterministic\
    \ path and it increases at the speed of risk-free rate `r` – just like our money\
    \ in the bank account whose annual rate is known. Assuming the asset `S` increases\
    \ at the risk-free rate `r`, the standard formula is:\n\n![](Image00027.jpg)Where\
    \ `t = [1, T]` and `T` is the maturity of the underlying trade `S` is the underlying\
    \ asset price `r` is the risk-free rate `dt` the infinitely small increment of\
    \ time `dS-1` is the infinitely small increments of `S`, which equals to `S` –\
    \ `S-1` we have:\n\n![](Image00028.jpg)t-1\n\nThe second model assumes the asset\
    \ doesn’t increase nor decrease, it stays at the same level as its initial value.\
    \ The formula becomes: ![](Image00029.jpg)Where `t = [1, T]` and `T` is the maturity\
    \ of the instrument.\n\nThe third one is a stochastic Model. Obviously, it is\
    \ the most complex one of the three but also well represented the real-life situation\
    \ where the asset path into the future is unknown today and will be driven by\
    \ the drift rate `μ` ![](Image0004.jpg)and its volatility ![](Image00030.jpg)accompanied\
    \ by a random variable which is embodied in Brownian motion `dW` Assuming the\
    \ asset `S` increases at constant drift rate `μ` and the constant volatility is\
    \ ![](Image00031.jpg), the classic formula is: ![](Image00032.jpg)Where `t = [1,\
    \ T]` and `T` is the maturity of the underlying trade ![](Image0033.jpg)is the\
    \ volatility `μ` is the asset price increase rate `dt` is the infinitely small\
    \ increment of time `dS-1` is the infinitely small increments of `S`, which equals\
    \ to `S` – `S-1` `dW` is the Brownian motion where the asset randomness resides\
    \ then we have ![](Image00028.jpg)t-1 The implementation is done in a simplified\
    \ way meaning no market data involved and no calibration as such. It is for conceptual\
    \ understanding and illustration. Three Models are implemented as Python functions:\n\
    \n```python\ndef deterministic_model(s_1, r, dt):\n    #we assume that asset increase\
    \ at the risk-free rate r\n    s = s_1 * (1 + r * dt)\n    return s\n\ndef constant_model(s_1):\n\
    \    s = s_1\n    return s\n\ndef stochastic_model(s_1, dt, mu, vol):\n    dW\
    \ = np.random.randn(1)[0]* np.sqrt(dt) #numpy ndarray gives an array type, as\
    \ there is only one random number in it, we take the value using [0]\n    ds =\
    \ mu * s_1 * dt + vol * s_1 * dW\n    s = s_1 + ds\n    return s\n```\n\nAs the\
    \ future asset path is a time series along the time horizon. For the stochastic\
    \ model, we will need the Monte Carlo technique which is realized by the NumPy\
    \ package here. Because of the uncertainty (unlike the deterministic or constant\
    \ Model), we will need simulation not just along the time horizon, but also on\
    \ multiple simulation paths which leads to an overview of potential asset price\
    \ paths. At the beginning of the code, I have defined certain market data by hard\
    \ coding. Obviously, these parameters could have different values, but some condition\
    \ must be respected:\n"
