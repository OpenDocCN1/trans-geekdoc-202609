  trans: "\n\n## 2.3 可视化图形 – Matplotlib\n\nMatplotlib 图形表示在金融领域非常重要。让我们来看看如何绘制数据。我们需要先导入绘图包。最常用的包名为\
    \ `matplotlib`。典型的导入标题格式为：\n\n```python\nimport matplotlib\nimport matplotlib.pyplot\
    \ as plt\n```\n\n在下方的代码示例中，假设上述导入已执行`plt` 代表 `matplotlib.pyplot`。以 `pandas` 包为例，通过简单的命令即可完成单列数据的简单图表：`df['Adj\
    \ Close'].plot(grid = True)`。\n\n![](img/Image00025.jpg)图 2‑4 输入数据中的 `AdjClose`\
    \ 时间序列\n\n这种图非常简单且原始，没有图表标题也没有关于其代表含义的轴信息。x 轴本应代表 `Date` 类型，但它显示的是不同的信息。让我们通过一种更复杂的方法，在同一张图表中绘制每日收益率和\
    \ `Adj close` 数据，但它们各自拥有独立的刻度。\n\n要正确绘制 `Date` 类型并不显而易见，因为从源文件加载时，DataFrame 中的\
    \ `Date` 列是字符串类型。如果我们将其转换为 `int/float`，它可以正常工作，但在 x 轴上显示 `int/float` 类型在视觉上是不直观的。例如，上面简单绘制了某些数据的图，我们很难直观地理解\
    \ x 轴 `[0-2500]` 代表什么：点的间隔还是仅仅不同的步骤等。\n\n`Pandas` 包提供了一个简单的方法来实现。在早期当我们将 csv 文件读取到\
    \ `Pandas` DataFrame 时，只需添加额外的参数 `parse_date`，这是一个将字符串列序列转换为 datetime 实例数组的函数：`df\
    \ = pd.read_csv(location, parse_dates=['Date'])`, `date = df['Date'].values`。\n\
    \n变量 `date` 的类型是 `numpy.ndarray`，但通过插入这个额外参数 `parse_dates=['Date']`，它的元素类型已从字符串变为了\
    \ `numpy.datetime64`。以下代码将产生描述的图表：\n\n```python\nimport matplotlib\nimport matplotlib.pyplot\
    \ as plt\nfig, ax1 = plt.subplots()\n\ncolor = 'red'\nax1.set_xlabel('Date')\n\
    ax1.set_ylabel('daily return', color=color)\nax1.plot(date[:-1], ret, color=color)\
    \ # 这是为了适应 x 和 y 轴的大小，因为 ret 的元素比其他少一个\nax1.tick_params(axis='y', labelcolor=color)\n\
    \nax2 = ax1.twinx() # 实例化共享相同 x 轴的第二个轴\ncolor = 'blue'\nax2.set_ylabel('Adj Close',\
    \ color=color)\nax2.plot(date, adjCloseArray, color=color) # 这里我们使用了 Numpy ，也可以使用\
    \ pandas 数据序列如 df['Adj Close']\nax2.tick_params(axis='y', labelcolor=color)\n\
    plt.title('Historical Daily return and Adj close value')\nplt.grid()\nplt.show()\n\
    ```\n\n![](img/Image00026.jpg)图 2‑5 一图中的两个图表，左侧（红色）为每日收益率时间序列，右轴（蓝色）为调整后收盘价时间序列\n\
    \n与第一个简单图相比，这里有几个特点：\n* 我们有了图表标题和每个轴的名称来指示它们代表的含义\n* 在同一图中绘制了两个不同的刻度值，它们各自拥有自己的刻度\n\
    * 非易处理的 `Date` 类型已正确转换\n\n## 2.4 结论\n\n我们已经了解了什么是编程语言以及什么是 Python：从基础数据类型、循环、条件到\
    \ Python 函数。显然，它与其他编程语言有许多相似之处，例如在金融领域也常用的 `R` 和 `VBA`。然后，我们学习了三个最常用的 Python 包：`Numpy`、`Pandas`\
    \ 和 `Matplotlib`。所有这些内容都结合示例进行了解释。在下一章《进阶 Python 示例》中，我们将提高学习曲线的门槛，通过引入数学建模示例和面向对象编程概念来进一步探索这三个包。\n\
    \n## 3 高级 Python 示例\n\n在本章中，我将进一步探索一些使用不同 Python 包的高级 Python 示例，创建不同的函数并引入面向对象编程\
    \ (OOP)。对于初学者，我更建议在开始更高级的旅程之前，先阅读上一章并玩玩该章节中的示例。这里还介绍了量化金融模型及其数学表示。这需要一些基础的量化金融背景。\n\
    \n### 3.1 数学建模\n\n我们看过了一个应用 `Pandas` 包的示例，其中分析了道斯琼平均指数的历史价格数据。现在我们想要构建一个程序来预测资产价格运动的未来路径。示例中有三种可能的建模选择：\n\
    \n第一个是**确定性模型** (Deterministic Model)，这意味着资产路径遵循确定性路径，并以无风险利率 `r` 的速度增长——就像我们银行账户里的资金，其年利率是知的。假设资产\
    \ `S` 以无风险利率 `r` 增长，标准公式为：\n\n![](img/Image00027.jpg)其中 `t = [1, T]`，`T` 是底层交易\
    \ `S` 的到期日，`S` 是底层资产价格，`r` 是无风险利率，`dt` 是时间的无限小增量，`dS-1` 是 `S` 的无限小增量，等于 `S`：\n\
    \n![](img/Image0028.jpg)t-1\n\n第二个模型假设资产既增加也不减少，它保持在初始水平。公式变为：![](img/Image00029.jpg)其中\
    \ `T` 是该工具的到期日。\n\n第三个是**随机模型** (stochastic Model)。显然，它是三个模型中最复杂的，但也很好地代表了现实情况，即未来的资产路径是未知的，由漂移率\
    \ `μ` ![](img/Image0004.jpg)驱动，并由随机运动中的随机变量伴随 ![](img/Image0030.jpg)假设资产 `S` 以恒定的漂移率\
    \ `μ` 增长，且恒定的波动率 ![](img/Image0031.jpg)，经典公式为：![](img/Image00032.jpg)其中 `t = [1,\
    \ T]`，`T` 是底层交易的到期日 ![](img/Image0033.jpg)`μ` 是资产增长率，`dt` 是时间的无限小增量，`dS-1` 是 `S`\
    \ 的无限小增量，等于 `S`：`dW` 是资产随机性的随机运动，我们有：![](img/Image0028.jpg)t-1 实现方式是简化的，意味着不涉及市场数据，也没有校准。这只是为了概念理解和说明。三个模型被实现为\
    \ Python 函数：\n\n```python\ndef deterministic_model(s_1, r, dt):\n    #假设资产以无风险利率\
    \ r 增长\n    s = s_1 * (1 + r * dt)\n    return s\n\ndef constant_model(s_1):\n\
    \    s = s_1\n    return s\n\ndef stochastic_model(s_1, dt, mu, vol):\n    dW\
    \ = np.random.randn(1)[0]* np.sqrt(dt) #numpy ndarray 返回数组类型，由于其中只有一个随机数，我们使用\
    \ [0] 取值\n    ds = mu * s_1 * dt + vol * s_1 * dW\n    s = s_1 + ds\n    return\
    \ s\n```\n\n未来的资产路径是沿时间轴的时间序列。对于随机模型，我们需要蒙特卡洛技术，这在这里通过 NumPy 包实现。由于不确定性（与确定性或恒定模型不同），我们不仅要在时间轴上模拟，还需要在多个路径上进行，从而获得潜在资产价格路径的概述。在代码开头，我通过硬编码了某些市场数据。显然，这些参数可以不同的值，但必须遵守某些条件：\n\
    \n"
- fmt: "\n# Parameter Setup\n\n1. `volatility` cannot excess 100% - here we set `volatility`\
    \ to `10%`.\n2. `drift rate μ ( mu )` and `risk-free rate r`` need to be a small\
    \ number – we set the risk-free rate to `1%` and the drift rate to `4%` which\
    \ represents the current rate and economic growth level.\n3. `dt` is the time\
    \ step which needs to be small enough to respect its conceptual meaning – we set\
    \ `dt` to `0.1`.\n4. `time_step` is linked to the maturity of the underlying.\n\
    5. `sim_step` determines the accuracy of the simulation results.\n\nHere for the\
    \ purpose of illustration, we set both low numbers for both `time_step` and `sim_step`\
    \ to speed up the running time. On the next page, you will find the full code.\n\
    \n```python\nimport numpy as np #We define the market data and model parameters\n\
    vol = 0.1\nr = 0.01\nmu = 0.04\ns_1 = 100\ndt = 0.1\nsim_step = 40 # can be increased\
    \ to improve the accuracy, but can slow down\ntime_step = 80 # linked to the maturity\
    \ of the underlying\n\n# initialize the output in ndarray type\ndet_model_output\
    \ = np.zeros(time_step) #deterministic model so we need 1D array\nconst_model_output\
    \ = np.zeros(time_step) #Constant, we do not need to simulate\nstoc_model_output\
    \ = np.zeros((time_step, sim_step))\nconst_model_output[:] = s_1\ndet_model_output[0]\
    \ = s_1\nstoc_model_output[0:] = s_1 # start the loop for deterministic and stochastic\
    \ model\nfor column in range(0, sim_step):\n    for row in range(1, time_step):\n\
    \        if column == 0:\n            det_model_output[row] = deterministic_model(det_model_output[row-1],\
    \ r, dt)\n        #deterministic model only has one dimension which is the time\
    \ horizon\n        stoc_model_output[row][column] = stochastic_model(stoc_model_output[row-1][column],\
    \ dt, mu, vol)\n```\n\nThe indent of `stoc_model_output` is very important as\
    \ only the stochastic model 2D matrix go through the nested for loop (see Figure\
    \ 3-1). The deterministic model doesn’t have randomness, hence other then column\
    \ zero (other simulation path outcome) do not matter here. Now we have `det_model_output`,\
    \ `const_model_output` and `stoc_model_output` for deterministic asset price,\
    \ constant asset price and stochastic asset price. The algorithm has nested for\
    \ loop which is not a desire feature. Here it is purely for illustration purpose\
    \ (see Figure 3-1) that we construct a two dimensioned array (`ndarray`) with\
    \ each column representing each simulation step and each row representing time\
    \ step. ![](Image00034.jpg)\nFigure 3-1 two dimensioned array - nested for loop\n\
    \nThere are many alternatives to modelling the future asset paths and to code\
    \ them up, some of which are more optimal than the others, some are just different\
    \ ways of thinking.\n\n## 3.2 Visual graphic examples\n\nTo visualize the asset\
    \ path and its indicated future price, we need graphic representation in Figure\
    \ 3-2 import `matplotlib`.\n\n```python\nimport matplotlib\nimport matplotlib.pyplot\
    \ as plt\n\nplt.plot(det_model_output, 'g')\nplt.title('Deterministic model output')\n\
    plt.xlabel('time step')\nplt.ylabel('Asset Price')\nplt.grid()\nplt.show()\n```\n\
    ![](Image00035.jpg)\nFigure 3-2 Deterministic model based asset price path\n\n\
    For the constant Model output `const_model_output`: see Figure 3-3:\n```python\n\
    plt.plot(const_model_output, 's')\nplt.title('constant model output')\nplt.xlabel('time\
    \ step')\nplt.ylabel('Asset Price')\nplt.grid()\nplt.show()\n```\n![](Image00036.jpg)\n\
    Figure 3-3 Constant (no growth, no noise) asset price path\n\nTo plot the stochastic\
    \ asset price path, we will need a for loop and `np.transpose()`. As we plot along\
    \ the x-axis which is the time step, so we need to transpose the output first\
    \ to make it fit into our graphic representation: see Figure 3-4 for:\n```python\n\
    for i in range(0, sim_step):\n    plt.plot(np.transpose(stoc_model_output)[i])\n\
    \nplt.plot(np.mean(stoc_model_output, axis=1), 'bs')\nplt.title('stochastic model\
    \ output')\nplt.xlabel('time step')\nplt.ylabel('Asset Price')\nplt.grid()\nplt.show()\n\
    ```\n![](Image00037.jpg)\nFigure 3-4 Stochastic model based asset price path\n\
    \nFrom Figure 3-4, the bold blue line is the mean (expectation) of asset price\
    \ at each time step. If we would like to plot the mean value, see Figure 3-5:\n\
    ```python\nplt.plot(np.mean(stoc_model_output, axis=1))\n```\n![](Image00038.jpg)\n\
    Figure 3-5 Mean value under stochastic model\n\n## 3.3 Model Parameter Analysis\n\
    \n...\n![](Image00039.jpg)\nFigure 3-6 Average asset price at simulation step\n\
    \n## 3.4 Code Implementation Details\n\nThe outcome from stochastic models are\
    \ much interesting due to its unpredictableness. For those are not familiar with\
    \ the classic Geometric Brownian Motion (GBM) model might find the output unusual.\
    \ First, recall the function:\n\n```python\ndef stochastic_model(s_1, dt, mu,\
    \ vol):\n    dW = np.random.randn(1)[0] * np.sqrt(dt)\n    ds = mu * s_1 * dt\
    \ + vol * s_1 * dW\n    s = s_1 + ds\n    return s\n```\n\nWe modified a bit the\
    \ main code part to include only the stochastic modelling output `ndarray` ::\n\
    \n```python\ndef cal(vol):\n    dt = 0.1\n    r = 0.01\n    mu = 0.04\n    s_1\
    \ = 100\n    dt = 0.1\n    sim_step = 40\n    time_step = 80\n    stoc_model_output\
    \ = np.zeros((time_step, sim_step))\n    stoc_model_output[0:] = s_1 # we set\
    \ the initial values\n    for column in range(0, sim_step):\n        for row in\
    \ range(1, time_step):\n            if column == 0:\n                det_model_output[row]\
    \ = deterministic_model(det_model_output[row-1], r, dt)\n            stoc_model_output[row][column]\
    \ = stochastic_model(stoc_model_output[row-1][column], dt, mu, vol)\n    return\
    \ np.mean(stoc_model_output, axis=1)\n```\n\nNow we start the main part which\
    \ include the plot part and the target variable for our analysis – `volatility`.\
    \ A list of different volatilities has been set up, with a for loop, each value\
    \ in the volatility list is sent to function `cal()` for analysis: import `matplotlib`.\n"
