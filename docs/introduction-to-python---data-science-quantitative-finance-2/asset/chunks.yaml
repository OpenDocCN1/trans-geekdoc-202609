- fmt: "\n`>>> z.calculate_price()` 97.5257618399161 Each time we execute the above\
    \ two lines, the output is different as each time, the class `Stochastic_model`\
    \ ’s internal function `calculate_dW()` is called within the class function `Stochastic_model.calculate_price()`\
    \ to generate a random number which is used in the stochastic price calculation.\
    \ This is a typical example of encapsulation which “hides” from outside view the\
    \ function `calculate_dW()` and its relevant data. You can spot the downside of\
    \ the OOP, `x`, `y` and `z` object all have its own function `calculate_price()`\
    \ , but outputs different results under the same input variables. If we do not\
    \ pay attention on the class level implementation of each `calculate_price()`\
    \ function, confusion and mistakes are inevitable. Just like previously stated\
    \ that market data parameters are predefined for illustration purpose. The main\
    \ part of the code is:\n\n```python\nimport numpy as np\nvol = 0.1\ndt = 0.1\n\
    r = 0.01 mu = 0.02\ns_1 = 100\nsim_step = 40\ntime_step = 80\ndet_model_output\
