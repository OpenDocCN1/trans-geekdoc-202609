    \n# Preface to the Second Edition\n\nLearning Python is not the purpose behind\
    \ this book, the underlying problem solving is. Python dominates among all those\
    \ script languages thanks to collaborative social engineering: it is open source\
    \ which can providing free and unlimited support from the developers' world and\
    \ able to attract more and more data scientists and engineers to support its growth\
    \ with industry-specific functionality. \n\nThis small book begins with an introduction\
    \ to programming and with the help of some examples, it shows how those fit into\
    \ the finance professionals' day-to-day work. Since most of the examples are tailored\
    \ to the real work-life in the investment bank, this book suits beginner as well\
    \ as intermediate finance professionals. \n\nIn the third chapter, the learning\
    \ curve becomes steeper and the quantitative modelling and parameter analysis\
    \ examples are introduced. If you are a finance graduate or somebody interested\
