    ```\n\n我演示了两种生成类对象并调用其成员函数的方法。第一种（确定性模型对象）是使用一行代码创建对象并调用其计算价格函数 - `obj.calculate_price()`。第二种方法（随机模型对象）是先调用其构造函数创建一个中间模型对象，然后通过创建的对象调用其函数：`obj\
