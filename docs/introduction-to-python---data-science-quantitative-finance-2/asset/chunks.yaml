    ```python\nmu = [- 0.2 , -0.1 , 0.0 , 0.2 ]\nvol = 0.2\nfig = plt.figure()\n\n\
    ax = plt.subplot(111)\n\nfor j in range(len(mu)):\n    mu_i = mu[j]\n    x = cal(mu_i)\n\
    \    ax.plot( x , label= '$mu = %.1f$' %mu_i)\n\nax.legend()\nplt.title (\"different\
    \ asset price under different drift for vol = %.2f\"% vol) plt.xlabel( 'time step'\
    \ ) plt.ylabel( 'Asset Price' )\nplt.grid()\nplt.show()\n```\n\n![](Image00043.jpg)Figure\
    \ 3-10 Asset price paths under different drift rates when `vol = 0.2`\n\nFor those\
    \ who pay attention to details, the `plt.grid()` has put the graph with grid comparing\
    \ to the previous. See Figure 3-10 Higher `μ` drives the trend higher and negative\
    \ `μ` leads to negative trend. Maybe as an exercise, you could try to vary the\
    \ volatility value and see how the graph changes according to the same set of\
    \ `μ`. It will allow you to understand better the dynamics and relationship between\
    \ `μ` and `σ` of a stochastic model.\n\n## 3.4 Object Oriented Programming (OOP)\n\
    \nWhat we have seen so far are either command line programming or functions that\
    \ we could be executed in a simple Shell and editor. And now we will introduce\
    \ another approach which is called Object Oriented programming. Believe me that\
    \ most of personal usage cases, functional programming can handle well, unless\
    \ it is in a large-scale team development environment. The main advantages that\
    \ I could think of by using OOP are:\n\n* **Code reusability** – reuse the same\
    \ code, nevertheless, this can also be achieved by functions\n* **Encapsulation**\
    \ – internal representation of an object is generally hidden from view outside\
    \ of the objects’ definition. A class is an example of encapsulation as it encapsulates\
    \ all the data that are member functions, variables, etc.\n\nThe disadvantages\
    \ are:\n\n* It slows down the programme by allocating object space in memory\n\
    * Unnecessary complexity which confuses people and increase the chance of mistakes\n\
    * Not easy to read by others if people have different mindset\n\nFor the example\
    \ explored in this chapter: Asset Price paths, we could easily write it an way.\
    \ Modifying the three model functions, we have the following code:\n\n```python\n\
    class Model ():\n    def __init__(self, s_1 , dt , r ):\n        self.s_1 = s_1\n\
    \        self.dt = dt\n        self.r = r\n    def calculate_drift_ds (self ):\n\
    \        ds = self.s_1 * self.r * self.dt\n        return ds\n\n# subclass\nclass\
    \ Deterministic_model(Model):\n    def __init__(self, s_1 , dt , r ):\n      \
    \  # re-use the parent class\n        Model.__init__(self, s_1 , dt , r )\n  \
    \  def calculate_price (self ):\n        return self.calculate_drift_ds() + self.s_1\n\
    \nclass Stochastic_model(Model):\n    def __init__(self, s_1 , dt , mu , vol ):\n\
    \        Model.__init__(self, s_1 , dt , mu )\n        self.vol = vol\n    def\
    \ calculate_price (self ):\n        dW = self.calculate_dW()\n        # re-use\
    \ the parent class PLUS modification\n        drift_ds = self.calculate_drift_ds()\n\
    \        stochastic_ds = self.vol * self.s_1 * dW\n        ds = drift_ds + stochastic_ds\n\
    \        return ds + self.s_1\n    def calculate_dW (self ):\n        return np.random.randn(\
    \ 1 )[0 ] * np.sqrt(self.dt)\n```\n\n`Class` is a set or category of things having\
    \ some property or attribute in common and differentiated from others by kind,\
    \ type, or quality. We have parent class `Model()` and two subclass `Deterministic_model(Model)`\
    \ and `Stochastic_model(Model)`. They both inherit the parent class `Model`, meaning\
    \ its constructor `__init__()` and its function `calculate_drift_ds()`.\n\n`Self`\
    \ represents the instance of the class. By using the `self` keyword we can access\
    \ the `attributes` and `methods` of the class in python. The `__init__()` method\
    \ is a constructor and runs as soon as an object of a class is instantiated. Its\
    \ aim is to initialize the object. This method is called when an object is created\
    \ from the class and it allows the class to initialize the attributes of a class.\n\
    \nObject is one of instances of the class, which can perform the functionalities\
    \ which are defined in the class. On the Python console, we could execute the\
    \ following command line code to illustrate what these classes are doing and how\
    \ to understand the basic of OOP.\n\nFirst, we set some variables which will be\
    \ used as arguments for inputs:\n```python\n>>> dt = 0.1\n>>> r = 0.01\n>>> s_1\
    \ = 100\n```\n\nSecond, we create an object of class `Model`:\n```python\n>>>\
    \ x = Model(s_1, dt, r)\n>>> x __main__.Model instance at 0x00000000110E17C8\n\
    ```\nThe object `x` - one of instances of the class `Model` has been created and\
    \ the constructor `__init__()` is run as soon as `x` is instantiated by having\
    \ the three arguments: `s_1`, `dt`, `r` provided as input at the instantiation.\
    \ By having the object `x`, we could access the functions defined in the class\
    \ `Model`:\n```python\n>>> x.calculate_drift_ds()\n0.1\n```\n\nWe then create\
    \ an object `y` – one of instances of the class `Deterministic_model(Model)` which\
    \ is the subclass of the `Model`. So `y` runs `Model`’s constructor `__init__()`\
    \ and its function `calculate_price()` which reuses its parent model’s function\
    \ `calculate_drift_ds()`:\n```python\n>>> y = Deterministic_model(s_1, dt, r)\n\
    >>> y.calculate_price()\n100.1\n```\n\nFor object `z`, the instance of the `Stochastic_model(Model)`,\
    \ it inherits the parent class `Model`’s constructor and modify it by having an\
    \ extra argument `vol`. The beauty of the OOP is the code reusability which inherits\
    \ part of the code and add extra features if needed.\n```python\n>>> z = Stochastic_model(s_1,\
    \ dt, r, vol)\n```\n"
