    NumPy 还提供了熟悉的数学函数，如 `sin`、`cos`、`exp` 和 `sqrt`。在 NumPy 中，这些被称为“通用函数”（`ufunc`）。\n\
    \n```python\n>>> a = 2.4\n>>> np.sqrt(a) 1.5491933384829668\n>>> np.exp(a) 11.023176380641601\n\
    ```\n\n在 NumPy 中，这些函数在数组上进行逐元素操作，产生一个数组作为输出：\n\n```python\n>>> B = np.arange(3)\n\
    >>> B\narray([0, 1, 2])\n>>> np.exp(B)\narray([ 1.,  2.71828183,  7.3890561 ])\n\
    >>> np.sqrt(B)\narray([ 0.,  1.,  1.41421356])\n>>> C = np.array([2., -1., 4.])\n\
    >>> np.add(B, C)\narray([ 2.,  0.,  6.])\n```\n\n多维数组对象也是如此。你将在本书后面介绍的各种示例中看到更多\
    \ Numpy 的用法。NumPy 的用途之一是用于蒙特卡洛模拟方法的 `ndarray` 类。\n\n## 2.2 数据分析 /  - Pandas\n\n\
    Pandas 是一个开源的、BSD 许可库，为 Python 编程语言提供了高性能、易用的数据结构和数据分析工具。它与动物熊猫无关，名字源于术语 `panel\
    \ data`（面板数据），这是一个计量经济学中包含同一对象在多个时期观测值的数据集。\n\n该库具有以下特性：\n\n*   用于数据操作的集成索引 `DataFrame`\
    \ 对象。\n*   用于在内存数据结构与不同文件格式之间读写数据的工具。\n*   数据对齐和对缺失数据的集成处理。\n*   数据集的重塑和透视（pivot）。\n\
    *   基于标签的大数据集切片和子集提取。\n*   数据结构的列插入和删除。\n*   分组引擎（Group by），允许对数据集进行拆分-应用-合并（split-apply-combine）操作。\n\
    *   数据集的合并和连接。\n*   分级轴索引，用于在低维数据结构中处理高维数据。\n*   时间序列功能：日期范围生成和频率转换、移动窗口统计、移动窗口线性回归、日期偏移和滞后。\n\
    \n### 2.2.1 股票市场分析示例\n\n`DataFrame` 及其包含的所有函数非常强大。以下示例是 Pandas 包在金融数据时间序列中的应用。需要将输入数据文件存储在本地，例如在\
    \ `C:\\Temp` 中，算法是读取输入数据并根据不同的统计目的对其进行处理。道斯琼工业平均指数历史数据可以从各种互联网源下载，例如 `yahoo finance`。我们将\
    \ CSV 文件保存到：`C:\\Temp\\DJI.csv`。\n\n在这个示例中，我们查看从 2007/11/20 到 2018/11/20 的历史数据范围，数据所示（Image0016.jpg）。代码的第一部分是创建\
    \ Pandas 数据并将此 csv 文件读取到 dataframe：\n\n```python\nimport pandas as pd\nimport\
    \ numpy as np\nlocation = r'C:\\Temp\\DJI.csv'\ndf = pd.read_csv(location)\n```\n\
    \n正如我们从 (Image0017.jpg) 中看到的，`df` 拥有 2771 行 x 7 列。我们可以计算 `Close` 列的最大值：\n\n```python\n\
    df['Close'].max()\n```\n\n我们可以找到最大 `Close` 值的索引：\n\n```python\ndf['Close'].idxmax()\n\
    ```\n\n如果我们想知道更多关于那一天的信息，可以简单地使用 `loc`：\n\n```python\ndf.loc[id]\n```\n\n输出所示（Image0018.jpg）：\n\
    \n```python\nid = df['Close'].idxmax()\nsortedDF = df.sort_values('Volume', ascending=True)\n\
    print(sortedDF)\n```\n\n我们注意到，尽管列出了前 10 个成交量，但原始 dataframe 的索引没有改变。\n\n### 2.2.2\
    \ 进一步练习\n\n让我们根据 (Image0019.jpg) 做一个稍微高级的练习。使用此公式计算每日收益率。Pandas 是基于 NumPy 的。NumPy\
    \ 速度的关键是一次性对整个数组执行操作，而不是逐行或逐项。因此，我们先将 pandas 序列转换为 `ndarray`：\n\n```python\nadjClose\
    \ = df['Close'].values\n```\n\n输出所示（Image0020.jpg）。为了理解 `adjClose[1:]` 和 `adjClose[:-1]`\
    \ 它们实际上代表什么，我创建了图 2-1，希望从视觉角度容易理解：\n\n```python\nret = (adjClose[1:] - adjClose[:-1])\
    \ / adjClose[:-1]\n```\n\n道斯琼工业平均指数每日收益率 (ret) 数组为：[-0.01622578, 0.0142073, -0.01829148,\
    \ ..., 0.00490133, -0.01557383]$。或者，我们只需要遍历（循环会降低算法速度）Pand dataframe 中的所有项。首先，我们需要定义大小正确的空\
    \ NumPy `ndarray`。你会发现这与定义一个全零的 NumPy `ndarray` 不是回事。应该谨慎使用，如果定义了比需要更大的空数组，会导致数组末尾出现额外的非零值，反过来会混淆或导致我们的计算结果出错。\n\
    \n```python\nret = np.empty(adjClose.size-1)\nfor i in range(adjClose.size-1):\n\
    \    ret[i] = (adjClose[i+1] - adjClose[i]) / adjClose[i]\n```\n"
- fmt: "\n```python\nprint (ret) array([-0.01622578,  0.0142073 , -0.01829148, ...,\
    \ 0.00490133, -0.01557383])\n```\nThe output of the return is the same as the\
    \ first approach. the first method using `Pandas` series feature is much faster\
    \ (probably less intuitive for people who are not familiar with the `Pandas` data\
    \ series structure) and much fancier.\n\n### Exercise 2\nAnother exercise we can\
    \ easily practise is to compute the mean and standard deviation of the daily return:\n\
    ```python\nmean = ret.mean()\nstdv = ret.std()\nprint('the mean of the daily return\
    \ is' , mean)\nprint('the standard deviation is' , stdv)\n```\nthe mean of the\
    \ daily return is `0.0005977280989583951` the standard deviation is `0.007498175157038745`\n\
    \n### Exercise 3\nAfter calculating the return, we will need to store the calculated\
    \ daily return by writing them back into a new csv file. The first way is the\
    \ traditional loop approach (slow!) which involves the insertion of the items\
    \ one by one:\n```python\nadjClose = df['Adj Close']\nadjCloseArray = adjClose.values\n\
    ret = (adjCloseArray[1:] - adjCloseArray[:-1])/ adjCloseArray[:-1]\ni = 0\nwhile\
    \ i < adjClose.size- 1 :\n    df.loc[i, ('return')] = ret[i]\n    i = i+ 1\n```\n\
    `loc[]` works on the row level and to access the column, simply uses `df['xxx']`\
    \ where `xxx` is the column name in the data frame. Above is an example of the\
    \ row and column combination:\n```python\nprint (df)\n```\n![](Image00021.jpg)\
    \ [2771 rows x 8 columns]\n\nThe second approach is to insert converted `Pandas`\
    \ series directly into the whole `DataFrame` without using loop, which is faster\
    \ and more intuitive. We convert the return array into a `Pandas DataFrame` first,\
    \ then use the `insert()` function with relevant parameters:\n```python\ndf_ret\
    \ = pd.DataFrame(ret, dtype = 'float')\ndf.insert(loc = 0, column = 'return ',\
    \ value = df_ret)\n```\nThe outcome looks as follow: ![](Image00022.jpg) We could\
    \ also change the location of this newly created column by changing `loc = 0`\
    \ to some other values as long as `0 <= loc <= len(columns)` There are plenty\
    \ of alternatives such as using the `.apply()` function. I will leave you to explore\
    \ all these if you are interested. The main purpose of this chapter is to introduce\
    \ python or warm up the knowledge of its relevant packages’ applicable usage in\
    \ the financial data world.\n\n### Exercise 4\nAfter calculating the mean and\
    \ standard deviation, we can do a small filter to see what are the outliers in\
    \ the daily return value. We define the outliers as those values are higher or\
    \ lower than twice of the standard deviation from the mean value.\n```python\n\
    upLimit = mean+2*stdv\nlowLimit = mean-2*stdv\n#condition logic to filter out\
    \ the desired row from the dataframe\ndf[(df['return'] > upLimit) | (df['return']\
    \ < lowLimit)]\n```\n![](Image00023.jpg) Figure 2‑2 pandas data framework for\
    \ Index Dow data It is very useful on the daily limit report. Very often, when\
    \ facing a large amount of daily data or historical data, we need to filter out\
    \ how many days or how many entities have exceeded the predefined limit set by\
    \ the business or regulation. A typical example is the `VaR` or `Expected Shortfall`\
    \ analysis. `VaR`(or `ES`) determines the limit a bank can suffer as a loss during\
    \ a set time period. There is a threshold on how many days this limit can been\
    \ exceeded per year (or another time period). Using some simple logics, we can\
    \ easily get these outliers out.\n\n### 2.2.3 Reports generation\nNow we will\
    \ save the new data frame with a newly inserted column value as a report for example,\
    \ a csv file on a local or shared drive.\n```python\ndf.to_csv(r'C:/Temp/DJI_return.csv')\n\
    ```\nYou should be able to see the new file `DJI_return.csv` created under `C:/Temp`\
    \ You may argue that csv file is not that “powerful” and you prefer to use Excel\
    \ as the reporting template with an embedded graphic plot. Below is the full code\
    \ of the Data analysis example on the Down Jones Index historical data, and generate\
    \ an Excel worksheet as a report template with a graphic plot embedded.\n```python\n\
    from pandas import read_csv\nimport pandas as pd\nlocation = r'C:/Temp/DJI.csv'\n\
    df = pd.read_csv(location)\n# now we have created a pandas Data Frames\nadjClose\
    \ = df['Adj Close']\nadjCloseArray = adjClose.values\n# calculate the daily return\n\
    ret = (adjCloseArray[1:] - adjCloseArray[:-1])/ adjCloseArray[:-1]\n# insert back\
    \ the daily return into the data\ndf_ret = pd.DataFrame(ret, dtype = 'float')\n\
    df.insert(loc = 0, column = 'return ', value = df_ret)\n# save Pandas DataFrame\
    \ to Excel sheet\nout_path = r'C:/Temp/Dow_return.xlsx'\nwriter = pd.ExcelWriter(out_path,\
    \ engine = 'xlsxwriter')\ndf.to_excel(writer, sheet_name= 'Sheet1', startrow=0)\n\
    # Get book and sheet objects for further manipulation\nbook = writer.book\nsheet\
    \ = writer.sheets['Sheet1']\n# calculate mean and standard deviation to compute\
    \ the outliers. Here we use 2 times of standard deviation as criteria\nmean =\
    \ ret.mean()\nstdv = ret.std()\nupLimit = mean+2*stdv\nlowLimit = mean-2*stdv\n\
    # Colour outlier values in red using conditional formatting\nformat1 = book.add_format({'font_color':\
    \ '#E93423'})\nsheet.conditional_format('B2:B2771', {'type': 'cell', 'criteria':\
    \ '<=', 'value': lowLimit, 'format': format1})\n# Chart plot for the whole period\n\
    chart = book.add_chart({'type': 'column'})\nchart.add_series({'values': '=Sheet1!B2:\
    \ B2771', 'name': '=Sheet1!B1', 'categories': '=Sheet1!$C$2:$C$2771'})\n# we insert\
    \ the chart of the daily return at the right place\nsheet.insert_chart('K10',\
    \ chart)\nwriter.save()\n```\nYou can see that comparing to generating a simple\
    \ csv file with the results, having an Excel workbook as a report template requires\
    \ more lines of code and configuration. The generated report looks like ![](Image00024.jpg)\
    \ Figure 2‑3 generated report We have explained basic functions which the `Pandas`\
    \ package can provide in terms of data analysis and it is extremely reliant on\
    \ large scale data with repetitive manipulation, for example, daily report generation\
    \ or daily analysis on standard data. In terms of report generation, there is\
    \ further possibility to expand the worksheet features by more personalized formatting\
    \ and having a dedicated title, etc. I will leave you to explore this option.\
    \ Having said that, we do not need to make life too complicated as certain things\
    \ are easier to do on the worksheet directly. In terms of Data Science part, there\
    \ is also a possibility to work directly on the Yahoo data without downloading\
    \ data as a locally saved file, which allows a more advanced “data science” approach\
    \ to analyse the financial market with multiple stock names. Since the portfolio\
    \ management and algorithmic investment is not the topic of this book, I will\
    \ leave you to explore this area at your interest.\n"
