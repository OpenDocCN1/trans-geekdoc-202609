  trans: "\n\n# 1.6 Python 函数\n\n`function`（函数）是一个只有在被调用时才会运行的代码块。当从另一个函数调用或直接从 Python\
    \ 提示符调用时，我们可以传递参数（也称为参数）。函数可以执行打印、修改值、进行代数运算等任务，并返回数据作为结果。我们可以在 Python 控制台中输入代码：\n\
    \n```python\ndef first_function(a):\n    print (\"the input is\", a)\n    result\
    \ = a+a*2\n    return result\n```\n\n`def` 表示这是一个函数，可以通过提供正确的输入在代码的其它地方进行调用。与之前的命令行编码风格相比，它是代码复用一个示例。当我们执行或调用此函数时，我们只需要将数据/参数传递到函数中：\n\
    \n```python\n>>> first_function(2)\nthe input is 2\n6\n```\n此外还有设置默认参数的可能性。默认参数是指当在函数调用中没有为该参数提供值时，它会假设一个默认值的参数。对于上面的示例，我们可以增加它的复杂性：\n\
    \n```python\ndef first_function(a, type = 'int'):\n    print (\"the input is\"\
    , a, \"and the data type is\", type(a))\n    if type == 'int':\n        result\
    \ = a + a*2\n    else:\n        result = a[0] + a[0]*2\n    return result\n```\n\
    \n`a[0]` 是访问列表元素的方法。`a[0]` 是列表的第一个元素，`a[1]` 表示第二个元素，以此此类推。如果尝试访问列表长度之外的元素位置，通常会抛出错误\
    \ `list index out of range`。如果我们在调用函数时不指定 `type = `，它将使用在函数定义参数中设置的默认值（在本例中，它是\
    \ `type = int`）。请注意，许多 Python 预定义函数都有默认参数，使用它们时我们应该注意它们的默认值。\n\n```python\n>>>\
    \ first_function(2)\nthe input is 2 and the type is int\n6\n```\n这里 `6` 是 `a +\
    \ a*2 = 2 + 2*2 = 6` 的结果。\n\n```python\n>>> first_function([2,3,4])\nthe input\
    \ is [2, 3, 4] and the type is int\n[2, 3, 4, 2, 3, 4, 2, 3, 4]\n```\n在这种情况下，在函数中没有指定类型，因此类型为默认值\
    \ `int`，因此计算结果 `a + a*2`（当 `a = [2,3,4]` 时）变为了：`[2,3,4] + [2,3,4] * 2 = [2, 3,\
    \ 4, 2, 3, 4, 2, 3, 4]`。但如果我们修改参数并覆盖了它的默认值，结果就会不同：\n\n```python\n>>> first_function([2,3,4],\
    \ 'list')\nthe input is [2, 3, 4] and the type is list\n6\n```\n这里 `6` 是 `a[0]\
    \ + a[0]*2` 的结果，其中 `a[0] = 2`，是输入列表 `[2,3,4]` 的第一个元素。对于安姆斯特数（Armstrong number）的情况，显示了完整的代码。你应该能够在\
    \ PyCharm 或 Spyder 等 IDE 上运行这段代码。\n\n`arm()` 是用于计算输入数字的安姆斯特数的。\n\n```python\n\
    def arm ( num ):\n    calnumber = 0\n    if len ( str ( num )) < 2 : # 单位数情况\n\
    \        return num * num * num\n    else:\n        string = str ( num )\n   \
    \     for i in string:\n            calnumber = int (i)* int (i)* int (i)+calnumber\n\
    \    return calnumber\n```\n\n`arm_test()` 是用于测试从输入计算出的安姆斯特数是否为安姆斯特数。\n\n```python\n\
    def arm_test ( num ):\n    if num == arm( num ):\n        print ( num , \"is an\
    \ Armstrong number! )\n    else:\n        print ( num , \"isn't an Armstrong number\"\
    )\n\ndef arm_list ( limit ):\n    for i in range ( 1 , limit ):\n        if i\
    \ == arm(i):\n            print (i, \"is an Armstrong number!\" )\n        else:\n\
    \            continue\n\nwhile True :\n    while True :\n        try:\n      \
    \      NUMBER = int ( input ( \"Enter the number:\" ))\n            break\n  \
    \      except ValueError :\n            print ( \" Opps that was not a valid number,\
    \ try again....\")\n    print ( \"You have just entered: %d \" %NUMBER)\n    arm_test(NUMBER)\n\
    \    LIMIT = int ( input ( \"Enter the upper limit:\" ))\n    arm_list(LIMIT)\n\
    \    VAR = input ( \"Would you like to play again? (Y/N): \" )\n    if VAR ==\
    \ \"N\" or VAR == \"n\" :\n        break\n```\n\n取决于你与程序的交互，输出大致如下：\nEnter the\
    \ number:12\nYou have just entered: 12\n12 isn't an Armstrong number\nEnter the\
    \ upper limit:1000\n1 is an Armstrong number!\n153 is an Armstrong number!\n370\
    \ is an Armstrong number!\n371 is an Armstrong number!\n407 is an Armstrong number!\n\
    Would you like to play again? (Y/N): n\n\n如果你对最后一个问题 `Would you like to play again?`\
    \ 回答 `Y`，整个程序将再次运行，因为整个循环会持续。请注意，如果你在第二个输入中选择了一个非常高的上限，Python 代码需要一段时间来计算并找到所有的安姆斯特数。\n\
    \n# 1.7 示例\n\n在通过安姆斯特数示例介绍 Python 基础之后，将演示更多利用 Python 函数和循环的示例，这些都是基础模块。\n\n##\
    \ 1.7.1 第一个示例：欧拉数 e\n\nLeonhard Euler 是 18 世纪的一位瑞士数学家。他对数学的不同分支都有许多贡献。在他许多发现和发展中，我们将观察最著名的数学常数之一——欧拉数\
    \ `e`，它大约等于 2.71828，代表对数的自然底。我们尝试计算或估计与三角学相关的数学常数 `e`。在这个示例中，我们将从金融中的复利中获得灵感。基于复利利率的\
    \ `e` 估计公式所示。\n\n一个更通用的指数函数 `ex` 或 `exp(x)` 可以编写。根据 `ex` 的导数等于 `ex` 本身以及著名的泰勒级数定义，当\
    \ `x = 1` 时，`ex` 可以通过无穷级数的和来计算。\n\n```python\ndef recur_factorial (n):\n    if\
    \ n ==1 :\n        return n\n    else :\n        return n * recur_factorial(n\
    \ -1)\n```\n\n"
- fmt: "\n```python\nj = 1\ne2 = 0\ne = 1+1/1 #initialize e\nwhile j <= 5:\n    if\
    \ j == 2:\n        e2 = 1/2\n        e = e + e2\n        print ('mathematical\
    \ constant e is', e)\n    if j == 3:\n        e2 = 1/6\n        e = e + e2\n \
    \       print ('mathematical constant e is', e)\n    if j == 4:\n        e2 =\
    \ 1/24\n        e = e + e2\n        print ('mathematical constant e is', e)\n\
    \    if j == 5:\n        e2 = 1/120\n        e = e + e2\n        print ('mathematical\
    \ constant e is', e)\n    j = j + 1\n```\nThe output is: mathematical constant\
    \ e is 2.5 mathematical constant e is 2.6666666666666665 mathematical constant\
    \ e is 2.708333333333333 mathematical constant e is 2.7166666666666663\n\nWe set\
    \ the iteration limit as 5 and using the `while` loop to calculate the infinite\
    \ series with finite n equals to 5. This is a standalone calculation and `if`\
    \ condition can continues as long as the iteration limit is not reached. It doesn’t\
    \ call the Python function `recur_factorial(n)` as the calculation of `n!` is\
    \ calculated inline, which is not ideal as with the increasing iteration, this\
    \ calculation becomes complicated and could introduce mistakes hence reducing\
    \ the precision.\n\nMethod 2, using the function `recur_factorial(n)` to calculate\
    \ `n!` and the `while` loop to sum up the factorials. The iteration number set\
    \ as 9.\n- `while j < 10` means the loop stops when `j` reaches 9\n```python\n\
    j = 0\ne = 1.0 #initialize e\nwhile j < 10:\n    e2 = 1/recur_factorial(j +1)\n\
    \    e = e2 + e\n    print ('e is', e, 'and iteration number is', j)\n    j =\
    \ j + 1\n```\nThe output is: e is 2.0 and iteration number is 0 e is 2.5 and iteration\
    \ number is 1 e is 2.6666666666666665 and iteration number is 2 e is 2.708333333333333\
    \ and iteration number is 3 e is 2.7166666666666663 and iteration number is 4\
    \ e is 2.718055555555555 and iteration number is 5 e is 2.718253968253968 and\
