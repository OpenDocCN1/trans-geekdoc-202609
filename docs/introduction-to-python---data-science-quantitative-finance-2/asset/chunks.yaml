  trans: "\n\n## 1.3 Python 开发环境\n\n在开始编程之前，你需要一个代码编辑器，或 IDE - 集成开发环境。`Spyder` 是学者入门的良好选择，特别是对于那些不需要使用\
    \ `PyCharm` 中包含的一些高级功能的人来说。它轻量且易于安装，并且通常带有 Python 包。它不需要许可证，在运行程序时也不会消耗过多内存。`PyCharm`\
    \ 适用于熟悉 IDE 及其集成功能（如调试、单步进入断点、重构以及涉及多个文件、包和多名开发人员的大规模开发）的高级用户。如果你有一个庞大的 Python\
    \ 程序库，你需要一个像 `PyCharm` 这样的工具。\n\n开始 Python 编码的一个很好的选择是使用命令行的 shell 环境或控制台。经典的\
    \ DOS 命令行也可以配合文本编辑器使用。控制台是你在命令解释器内部输入、与数据交互并将其可视化的地方。在控制台中输入的所有命令都会被立即执行，从而允许用户自由地中断任何进程。\n\
    \n另一个流行的开发环境是 `Jupyter Notebook`。它是一个开源 Web 应用程序，允许你创建和共享包含实时代码、方程和图表的文档。它具有与控制台式开发环境相同的优势，但更符合视觉习惯且功能强大。存在各种集成数据科学平台（例如\
    \ `Anaconda`），其中开发环境和开源包已经预先下载。在本书中，所有的代码示例要么基于 `Jupyter notebook`，要么基于 `Python\
    \ Console`（大多数 如 `Spyder` 和 `PyCharm` 都有控制台窗口）。可以在此处下载 `Anaconda` [https://www.anaconda.com/]。`Anaconda\
    \ Navigator` 是一个基于 GUI 的工具，允许你轻松地找到 `Anaconda` 提供的所有不同工具包和软件。运行该程序将显示界面：![](img/Image00005.jpg)\
    \ 如你所见，有很多程序供你使用。点击 Launch 打开 `Jupyter Notebook` 程序。浏览器将打开一个新标签页，显示主目录下的文件夹和文件列表。\n\
    \n## 1.4 Python 中的基本数据类型\n\n我在下表中列出了基本数据类型，并附有相关的注释和示例：\n\n| 类型 | 示例 | 注释 |\n\
    | :--- | :--- | :--- |\n| `bool` | `True`, `False` | 这是一个“逻辑”值 |\n| `int` | `123`\
    \ | 整数 |\n| `float` | `1.23` | Python 中的 `float` 类型指定浮点数，在内部表示为二进制（基 2）分数。大多数小数无法精确地表示为二进制分数，因此在大多数情况下，浮点数的内部表示是实际值的近似。在实践中，实际值与表示值之间的差异非常小，不应引起显著问题\
    \ |\n| `complex` | `1.2+3j` | 复数的指定格式为 `<实部>+<虚部>j`，两者均为浮点数值。 |\n| `Str` | `\"\
    hello\"`, `''` | 字符串是字符数据的序列。Python 中的字符串可以包含你任意数量的字符。唯一的限制是你机器的内存资源。字符串可以是空的\
    \ |\n| `list` | `[1,2,3]`, `[2,5,'python']`, `[[2,4],[3,6]]` | `list` 可以包含一系列相同类型或不同类型的值，并由方括号\
    \ `[]` 定义。Python 中的所有列表都从 0 开始索引。列表不限于单一维度。可以通过逗号分隔多个方括号 `[]` 来声明多个维度。`List` 是动态且可变的。\
    \ |\n| `tuple` | `(1,2,3)` | `tuples` 是类似于列表的一组值，以类似的方式操作。然而，元组的大小是固定的（不可变的），一旦赋值，成员就无法更改。`Tuples`\
    \ 由括号 `()` 定义。 |\n| `dict` | `{'Age': 17, 'name': 'Peter'}` | Python 中的字典是 `Key:\
    \ Value` 对的列表。这是一种强大的数据类型，可以存储大量通过 `keys` 关联的相关信息。字典的主要操作是根据 `key` 名称提取值。与使用索引的列表不同，字典允许使用\
    \ `key` 来访问其成员。字典还可以用于排序、迭代和比较数据。字典使用大括号 `{}` 创建，值对之间用逗号分隔，键和值对之间用冒号关联：字典中的每个\
    \ `Key` 必须是唯一的。 |\n\n以上是 Python 中最常见的数据类型，我们可以使用下面的代码行来检查 Python 数据类型。例如：`type(variable)`\n\
    \n## 1.5 循环与条件\n\n循环可能是编程世界中最重要的逻辑操作之一。只要满足特定条件，循环就会重复执行。\n\n### For 语句\n让我们看看\
    \ `range(x)` 的含义：\n- 迭代器从 0 开始并遍历 `x` 个整数\n- 如果 `x > 2`，则为 `(0, 1,2,…..x)`\n\n\
    ```python\nfor i in range(3):\n    print(i)\n# 输出: 0 1 2\n```\n\n### While 语句\n\
    ```python\nj = 4\nwhile j > 0:\n    print(j)\n    j = j-1\n# 输出: 4 3 2 1\n```\n\
    \n### For 还是 while？\n如果我们知道执行主体的最大次数，则使用 `for` 循环。例如，如果我们正在遍历元素列表，我们知道可能需要的迭代次数是“列表中的所有元素”。相反，如果我们需要重复某些计算直到满足某个条件，且无法预先计算何时发生，那么我们需要一个\
    \ `while` 循环。我们将第一种情况（for 循环）称为“确定性迭代”；后一种情况（while 循环）称为“不确定性迭代”——我们甚至不确定需要多少次迭代！\n\
    \n### 条件语句\n为了编写实用的程序，我们几乎总是检查条件并据此更改程序的行为。条件提供了这种能力。最简单的形式是 `if` 语句：\n\n```python\n\
    if 布尔表达式:\n    语句\n```\n`if` 语句后面的布尔表达式称为 `条件`。如果它为真，则执行所有的缩进语句。如果条件为假会发生什么；我们是做其他事情还是设置另一个条件？另一个条件由\
    \ `elif` 引导，默认语句由 `else` 引导：\n\n```python\nif type(i) == list:\n    print(\"是列表类型\"\
    )\nelif type(i) == int:\n    print(\"是整数类型\")\nelse:\n    print(\"是其他类型\")\n```\n\
    \n"
- fmt: "\n# 1.6 Python functions\n\nA `function` is a block of code that only runs\
    \ when it is called. We can pass parameters (also called arguments) when it is\
    \ called from another function or directly from the Python prompt. The function\
    \ can perform tasks like printing out, modifying value, doing algebra operations\
    \ and alternatively return data as a result. We could type the code in the Python\
    \ console:\n\n```python\ndef first_function(a):\n    print (\"the input is\",\
    \ a)\n    result = a+a*2\n    return result\n```\n\n`def` indicates it is a function\
    \ which can be called elsewhere in the code by providing the right input. It is\
    \ an example of code reusability compared to the previous command line coding\
    \ style. When we execute or call this function, we just need to pass the data/parameter\
    \ into the function:\n\n```python\n>>> first_function(2)\nthe input is 2\n6\n\
    ```\nThere is also the possibility of setting up a default argument instead. A\
    \ default argument is an argument that assumes a default value if a value is not\
    \ provided in the function call for that argument. For the above example, we could\
    \ increase its sophistication:\n\n```python\ndef first_function(a, type = 'int'):\n\
    \    print (\"the input is\", a, \"and the data type is\", type(a))\n    if type\
    \ == 'int':\n        result = a + a*2\n    else:\n        result = a[0] + a[0]*2\n\
    \    return result\n```\n\n`a[0]` is a way to access the element in the list.\
    \ `a[0]` is the first element of the list and `a[1]` indicates the second element,\
    \ etc. If one tries to access the element position outside the list length, it\
    \ will typically throw out an error `list index out of range`. If we call the\
    \ function without specifying `type = `, then it uses the default value which\
    \ is set in the function’s definition argument (in this case, it is `type = int`\
    \ ). Be aware that lots of python predefined function has its default parameter,\
    \ by using it, we should be aware of their default value.\n\n```python\n>>> first_function(2)\n\
    the input is 2 and the type is int\n6\n```\nHere `6` is the result from `a + a*2\
    \ = 2 + 2*2 = 6`.\n\n```python\n>>> first_function([2,3,4])\nthe input is [2,\
    \ 3, 4] and the type is int\n[2, 3, 4, 2, 3, 4, 2, 3, 4]\n```\nIn this case, the\
    \ type is not specified in the function, hence the type is the default value `int`,\
    \ hence the result from the calculation `a + a*2` where `a = [2,3,4]` becomes:\
    \ `[2,3,4] + [2,3,4] * 2 = [2, 3, 4, 2, 3, 4, 2, 3, 4]`. But if we modify the\
    \ parameter and overwrite its default value, the result is different:\n\n```python\n\
    >>> first_function([2,3,4], 'list')\nthe input is [2, 3, 4] and the type is list\n\
    6\n```\nHere `6` is the result from `a[0] + a[0]*2` where `a[0] = 2`, the first\
    \ element of the input list `[2,3,4]`. For the Armstrong number case, the full\
    \ code is shown. You should be able to run this code on an IDE like PyCharm or\
    \ Spyder.\n\n`arm()` is to calculat the Armstrong number for the input number.\n\
    \n```python\ndef arm ( num ):\n    calnumber = 0\n    if len ( str ( num )) <\
    \ 2 : # single digit case\n        return num * num * num\n    else:\n       \
    \ string = str ( num )\n        for i in string:\n            calnumber = int\
    \ (i)* int (i)* int (i)+calnumber\n    return calnumber\n```\n\n`arm_test()` is\
    \ to test whether an calculated arm strong number from the input is an arm strong\
    \ number.\n\n```python\ndef arm_test ( num ):\n    if num == arm( num ):\n   \
    \     print ( num , \"is an Armstrong number! \")\n    else:\n        print (\
    \ num , \"isn't an Armstrong number\")\n\ndef arm_list ( limit ):\n    for i in\
    \ range ( 1 , limit ):\n        if i == arm(i):\n            print (i, \"is an\
    \ Armstrong number!\" )\n        else:\n            continue\n\nwhile True :\n\
    \    while True :\n        try:\n            NUMBER = int ( input ( \"Enter the\
    \ number:\" ))\n            break\n        except ValueError :\n            print\
    \ ( \" Opps that was not a valid number, try again....\")\n    print ( \"You have\
    \ just entered: %d \" %NUMBER)\n    arm_test(NUMBER)\n    LIMIT = int ( input\
    \ ( \"Enter the upper limit:\" ))\n    arm_list(LIMIT)\n    VAR = input ( \"Would\
    \ you like to play again? (Y/N): \" )\n    if VAR == \"N\" or VAR == \"n\" :\n\
    \        break\n```\n\nDepends on the interaction you have with the programme,\
    \ the output is something like:\nEnter the number:12\nYou have just entered: 12\n\
    12 isn't an Armstrong number\nEnter the upper limit:1000\n1 is an Armstrong number!\n\
    153 is an Armstrong number!\n370 is an Armstrong number!\n371 is an Armstrong\
    \ number!\n407 is an Armstrong number!\nWould you like to play again? (Y/N): n\n\
    \nIf you answer the last question: `Would you like to play again?` as `Y`, then\
    \ the whole programme will run again as the whole loop keeps on going. Be aware\
    \ that if you choose a very high upper limit in the second input, it takes a while\
    \ for the python code to compute and find all the Armstrong numbers.\n\n# 1.7\
    \ Further examples\n\nAfter introducing some Python basics using the Armstrong\
    \ number example, more examples utilizing Python function and Looping are going\
    \ to be demonstrated as these are fundamental blocs.\n\n## 1.7.1 First example:\
    \ Euler number e\n\nLeonhard Euler was a Swiss mathematician from the 18th century.\
    \ He has many contribution to different branches of mathematics. Among his many\
    \ discoveries and developments, we will have a look at one of the most famous\
    \ mathematical constant, commonly known as Euler number `e` which is roughly equivalent\
    \ to 2.71828 representing a logarithm’s natural base. We try to calculate or estimate\
    \ the mathematical constant `e` which is linked to trigonometry. In this example,\
    \ we will take the inspiration from the compound interest in finance. The formula\
    \ for `e` estimation based on the compounding interest rate is illustrated in\
    \ Figure 1-1.\n\nA more general exponential function `ex` or `exp(x)` can be written.\
    \ From the fact that the derivative of `ex` equals to `ex` itself and the famous\
    \ Taylor series definition, `ex` can be calculated as the sum of the infinite\
    \ series when `x = 1`.\n\nThe continuous fractional function `n!` is solved in\
    \ a python function using recursion. Recursion is a method of solving a problem\
    \ where the solution depends on solutions to smaller instances of the same problem.\
    \ Such problems can generally be solved by iteration (looping). It is typically\
    \ using functions that call themselves from with their own code.\n\n```python\n\
    def recur_factorial (n):\n    if n ==1 :\n        return n\n    else :\n     \
    \   return n * recur_factorial(n -1)\n```\n"
