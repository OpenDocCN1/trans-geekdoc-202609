  \n### 练习 4\n在计算平均值和标准差后，我们可以进行简单的过滤，查看每日收益率值中的异常值。我们将离群值定义为偏离平均值两倍标准差的值。\n```python\n\
  upLimit = mean+2*stdv\nlowLimit = mean-2*stdv\n### 从数据框中过滤出所需行的逻辑条件\ndf[(df['return']\
