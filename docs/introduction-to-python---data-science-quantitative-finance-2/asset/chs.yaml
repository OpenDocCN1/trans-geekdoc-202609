  \ 2‑5 一图中的两个图表，左侧（红色）为每日收益率时间序列，右轴（蓝色）为调整后收盘价时间序列\n\n与第一个简单图相比，这里有几个特点：\n* 我们有了图表标题和每个轴的名称来指示它们代表的含义\n\
  * 在同一图中绘制了两个不同的刻度值，它们各自拥有自己的刻度\n* 非易处理的 `Date` 类型已正确转换\n\n## 2.4 结论\n\n我们已经了解了什么是编程语言以及什么是\
