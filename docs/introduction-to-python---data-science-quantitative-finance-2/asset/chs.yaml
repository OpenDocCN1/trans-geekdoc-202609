  \n## 3.4 代码实现细节\n\n随机模型的结果非常有趣，对于那些不熟悉经典几何布朗运动（GBM）模型的人来说可能会发现输出很反常。首先，回顾函数：\n\n\
  ```python\ndef stochastic_model(s_1, dt, mu, vol):\n    dW = np.random.randn(1)[0]\
  \ * np.sqrt(dt)\n    ds = mu * s_1 * dt + vol * s_1 * dW\n    s = s_1 + ds\n   \
  \ return s\n```\n\n我们稍微修改了主代码部分以包含随机建模输出 `ndarray` ：\n\n```python\ndef cal(vol):\n\
  \    dt = 0.1\n    r = 0.01\n    mu = 0.04\n    s_1 = 100\n    dt = 0.1\n    sim_step\
  \ = 40\n    time_step = 80\n    stoc_model_output = np.zeros((time_step, sim_step))\n\
  \    stoc_model_output[0:] = s_1 # 我们设置初始值\n    for column in range(0, sim_step):\n\
  \        for row in range(1, time_step):\n            if column == 0:\n        \
  \        det_model_output[row] = deterministic_model(det_model_output[row-1], r,\
  \ dt)\n            stoc_model_output[row][column] = stochastic_model(stoc_model_output[row-1][column],\
  \ dt, mu, vol)\n    return np.mean(stoc_model_output, axis=1)\n```\n\n现在我们开始主部分，包括绘图部分和我们分析的目标变量\
  \ – `volatility`。已经设置了一个不同波动率列表，使用 for 循环，波动率列表中的每个值都发送到函数 `cal()` 进行分析：导入 `matplotlib`。\n\
  \n\n\n\n\n```python\nimport matplotlib.pyplot as plt\nimport numpy as np\nvol =\
  \ [ 0.0 , 0.2 , 0.5 , 0.8 , 1.0 ]\nmu = 0.02\n\nfig = plt.figure()\n\nax = plt.subplot(\
  \ 111 )\n\nfor j in range ( len ( vol)):\n    vol_i = vol [j]\n    x = cal(vol_i)\n\
  \    ax.plot( x , label= '$vol = %.1f$' %vol_i)\n\nax.legend()\nplt.title( 'different\
  \ asset price under different vols for mu = %.2f' %mu ) plt.xlabel( 'time step'\
  \ ) plt.ylabel( 'Asset Price' )\n\nplt.show()\n```\n\n总的来说，与低波动率相比，高波动率具有更多的“随机”轨迹（例如\
  \ `vol = 1.0`）：当 `vol = 0.0` 时，资产价格路径等同于确定性模型的输出。![](img/Image00040.jpg)图 3-7 `mu\
  \ = 0.02` 时不同波动率下的资产价格路径\n\n一旦我们改变漂移率 `mu` (μ) 值，整个情况也会发生变化。当 `μ` 较高时，向上趋势更加明显。看图\
  \ 3-8 ![](img/Image00041.jpg)图 3-8 `mu = 0.18` 时不同波动率下的资产价格路径\n\n如果漂移 `u` 变为负数，趋势将变为向下。看图\
  \ 3-9 ![](img/Image00042.jpg)图 3-9 `mu = -0.1` 时不同波动率下的资产价格路径\n\n现在，我们使用类似的分析机制，重点关注漂移率\
  \ `u` 而不是波动率 `σ`。我们只需保留上述示例中的 `stochastic_model()` 函数，并稍作修改 `cal()` 函数：\n\n```python\n\
  def cal ( mu ):\n    dt = 0.1\n    r = 0.01\n    s_1 = 100\n    sim_step = 40\n\
  \    time_step = 80\n    stoc_model_output = np.zeros((time_step, sim_step))\n \
  \   stoc_model_output [0][:] = s_1\n    for column in range ( 0 ,sim_step):\n  \
  \      for row in range ( 1 ,time_step):\n            stoc_model_output[row][column]\
  \ = stochastic_model(stoc_model_output[row- 1][column], dt, mu , vol)\n    return\
  \ np.mean(stoc_model_output, axis= 1 )\n```\n\n我们还需要修改绘图代码部分并更改全局变量：`u` 的列表。在分析示例中，我们将波动率设置为\
  \ 0.2\n\n```python\nmu = [- 0.2 , -0.1 , 0.0 , 0.2 ]\nvol = 0.2\nfig = plt.figure()\n\
  \nax = plt.subplot(111)\n\nfor j in range(len(mu)):\n    mu_i = mu[j]\n    x = cal(mu_i)\n\
  \    ax.plot( x , label= '$mu = %.1f$' %mu_i)\n\nax.legend()\nplt.title (\"different\
  \ asset price under different drift for vol = %.2f\"% vol) plt.xlabel( 'time step'\
  \ ) plt.ylabel( 'Asset Price' )\nplt.grid()\nplt.show()\n```\n\n![](img/Image00043.jpg)图\
  \ 3-10 `vol = 0.2` 时不同漂移率下的资产价格路径\n\n对于那些关注细节的人，`plt.grid()` 与之前相比为图表添加了网格。看图 3-10\
  \ 较高的 `μ` 驱动了趋势（Higher `μ` drives the trend）。\n\n\n\n\n\n`>>> z.calculate_price()`\
  \ 97.5257618399161 每每次执行上述两行代码时，输出都是不同的，因为每次在调用类函数 `Stochastic_model.calculate_price()`\
  \ 时，都会调用类 `Stochastic_model` 的内部函数 `calculate_dW()` 来生成用于随机价格计算的随机数。这是一个典型的封装示例，它从外部视图“隐藏”了\
  \ `calculate_dW()` 函数及其相关数据。你可以发现面向对象编程（OOP）的缺点：`x`、`y` 和 `z` 对象都有有自己的 `calculate_price()`\
  \ 函数，但在相同的输入变量下输出不同的结果。如果我们不关注每个 `calculate_price()` 函数的类层级实现，困惑和错误将不可避免的。正如之前提到的，市场数据参数是为了说明目的而预定义的。代码的主要部分是：\n\
  \n```python\nimport numpy as np\nvol = 0.1\ndt = 0.1\nr = 0.01 mu = 0.02\ns_1 =\
  \ 100\nsim_step = 40\ntime_step = 80\ndet_model_output = np.zeros(time_step)\nconst_model_output\
  \ = np.zeros(time_step)\nstoc_model_output = np.zeros((time_step, sim_step)) # 设置常量模型输出的值，因为它不需要进行模拟\n\
  const_model_output[:] = s_1 # 第零步初始化\ndet_model_output[0] = s_1\nstoc_model_output[0:]\
  \ = s_1\nfor column in range ( 0 , sim_step):\n    for row in range ( 1 , time_step):\n\
  \        if column == 0 :\n            det_model_output[row] = Deterministic_model(det_model_output[row\
  \ - 1],dt, r).calculate_price() # 先调用其构造函数创建一个随机模型对象\n            s_model_obj =Stochastic_model(stoc_model_output[row\
  \ -1][column], dt,mu,vol)\n            stoc_model_output[row][column] = s_model_obj.calculate_price()\n\
  ```\n\n我演示了两种生成类对象并调用其成员函数的方法。第一种（确定性模型对象）是使用一行代码创建对象并调用其计算价格函数 - `obj.calculate_price()`。第二种方法（随机模型对象）是先调用其构造函数创建一个中间模型对象，然后通过创建的对象调用其函数：`obj\
  \ = model_constructor()` `obj.calculate_price()`\n\n```python\nimport matplotlib\n\
  import matplotlib.pyplot as plt\nfor i in range ( 0 , sim_step):\n    plt.plot(np.transpose(stoc_model_output)[i])\n\
  plt.plot(np.mean(stoc_model_output, axis= 1 ), 'bs' )\nplt.title( 'Stochastic model\
  \ output' )\nplt.xlabel( 'time step' ) plt.ylabel( 'Asset Price' )\nplt.grid()\n\
  plt.show()\n```\n\n对 `stoc_model_output` 使用相同的绘图代码，我们得到了随机建模资产价格路径的图 3-11，这与之前的非\
