  \ `VaR` 或 `Expected Shortfall`预期缺口分析。`VaR`（或 `ES`）决定了银行在特定时间内可以承受的损失限制。对于每年（或其他时间段）超过此限制的天数有一个阈值。使用一些简单的逻辑，我们可以轻松地提取这些异常值。\n\
