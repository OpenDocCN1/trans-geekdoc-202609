  \ 进一步练习\n\n让我们根据 (Image0019.jpg) 做一个稍微高级的练习。使用此公式计算每日收益率。Pandas 是基于 NumPy 的。NumPy\
  \ 速度的关键是一次性对整个数组执行操作，而不是逐行或逐项。因此，我们先将 pandas 序列转换为 `ndarray`：\n\n```python\nadjClose\
  \ = df['Close'].values\n```\n\n输出所示（Image0020.jpg）。为了理解 `adjClose[1:]` 和 `adjClose[:-1]`\
  \ 它们实际上代表什么，我创建了图 2-1，希望从视觉角度容易理解：\n\n```python\nret = (adjClose[1:] - adjClose[:-1])\
  \ / adjClose[:-1]\n```\n\n道斯琼工业平均指数每日收益率 (ret) 数组为：[-0.01622578, 0.0142073, -0.01829148,\
  \ ..., 0.00490133, -0.01557383]$。或者，我们只需要遍历（循环会降低算法速度）Pand dataframe 中的所有项。首先，我们需要定义大小正确的空\
  \ NumPy `ndarray`。你会发现这与定义一个全零的 NumPy `ndarray` 不是回事。应该谨慎使用，如果定义了比需要更大的空数组，会导致数组末尾出现额外的非零值，反过来会混淆或导致我们的计算结果出错。\n\
  \n```python\nret = np.empty(adjClose.size-1)\nfor i in range(adjClose.size-1):\n\
  \    ret[i] = (adjClose[i+1] - adjClose[i]) / adjClose[i]\n```\n\n\n\n\n```python\n\
  print (ret) array([-0.01622578,  0.0142073 , -0.01829148, ..., 0.00490133, -0.01557383])\n\
  ```\n返回值的输出与第一种相同。使用 `Pandas` series 特性的第一种方法快得多（对于不熟悉 `Pandas` 数据序列结构的人来说可能可能那么直观），而且更加高级。\n\
  \n### 练习 2\n另一个我们可以轻松练习的练习是计算每日收益率的平均值和标准差：\n```python\nmean = ret.mean()\nstdv\
  \ = ret.std()\nprint('the mean of the daily return is' , mean)\nprint('the standard\
  \ deviation is' , stdv)\n```\n每日收益率的平均值为 `0.0005977280989583951`，标准差为 `0.007498175157038745`。\n\
  \n### 练习 3\n计算收益率后，我们需要通过将计算出的每日收益率写回新的 csv 文件来存储它们。第一方法是传统的循环方法（缓慢！），它涉及逐个插入项目：\n\
  ```python\nadjClose = df['Adj Close']\nadjCloseArray = adjClose.values\nret = (adjCloseArray[1:]\
  \ - adjCloseArray[:-1])/ adjCloseArray[:-1]\ni = 0\nwhile i < adjClose.size- 1 :\n\
  \    df.loc[i, ('return')] = ret[i]\n    i = i+ 1\n```\n`loc[]` 在行级别工作，要访问列只需使用\
  \ `df['xxx']`，其中 `xxx` 是数据框列名。上述是行和列组合的示例：\n```python\nprint (df)\n```\n![](img/Image00021.jpg)\
