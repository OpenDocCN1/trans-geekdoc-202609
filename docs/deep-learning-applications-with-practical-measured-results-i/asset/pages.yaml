  img_proc: true
- pgno: 213
  md: 'tire manufacturing has been gaining prominence to address challenges such as
    automated tire defects detection.


    Generally, it can be witnessed that in the modern-day scenario, there is a humongous
    and swift growth in the gadgets, equipment, and devices connected to the internet.
    These devices, gadgets, and equipment have profound computing characteristics,
    and at the same time, they are exceedingly performance-oriented [2]. Due to all
    these facts, the concept of deep learning has evolved into a newer dimension,
    and it plays a significant part in processing and recognizing images, speech,
    and video, and so on. Furthermore, the implementation of a deep learning paradigm
    for automation in conventional manufacturing units significantly minimizes the
    usage of physical labor, and it also enhances the overall competence and efficacy
    of these units. Digital shearography is a laser-based measuring approach that
    relies on the processing of digital data, interferometry, and phase-shifting paradigm
    [3–5].


    A shearography system was developed by applying a spatial light modulator for
    controlling the amount of shearing and the direction of the phase light automatically
    and accurately. The system eliminates the nonlinear random error and enhances
    the efficiency of testing [6]. A system was developed using shearography to examine
    the exterior heatproof covering of a cylinder, and defect detection was done using
    an artificial intelligence-based recognition algorithm for deep learning, namely
    Faster R-CNN, which detects the bounding defects [7]. A model was developed using
    a deep convolutional neural network for the detection of defects captured in the
    X-ray images. Moreover, the fully convolutional network was selected for the pixel-wise
    prediction of defect location and segmentation [8]. A binary classification model
    was established using a convolutional neural network to classify the defects in
    pipes into two classes, such as minor defects and major defects, and the case
    study was conducted from 256 shearography images [9]. An algorithm was developed
    based on deep learning for the classification of defects in tires using the proposed
    multi-column convolutional neural network (CNN) by integrating several CNNs [10].


    Our research primarily focuses on the deep learning-based bubble defects detection
    in tire shearography images, which plays a significant role in the automation
    of the tire manufacturing industries. Figure 1 portrays the digital shearography
    set-up for capturing tire shearography images utilizing a digital computer.


    The tire manufacturing process includes five substantial stages compounding, mixing,
    shaping, and vulcanizing, testing. Further, in the course of tire production,
    there is a chance for the bubble defects to appear in the tires, as the air might
    not be entirely removed from the tires.


    Consequently, when the car is driven at high speed, such defective tires seem
    to suffer a greater chance of bursting, hence this scenario might place the human
    lives at risk. Therefore, in order to overcome this issue, the tire manufacturing
    units ensure that the tire is tested successfully by using several quality control
    mechanisms, prior to its dispatch and delivery. During the testing process, detecting
    the bubble defects that are present internally within the tires, turns out to
    be a substantial task. Moreover, the bubble defects in the four different shearography
    images are portrayed in Figure 2. The operator identifies the bubble detects in
    the shearography images and assesses whether the size of the bubble is passable.
    Nevertheless, the quality of inspection significantly relies on the experience
    and expertise of the operator. As a result, the bubble defect detection process
    might need substantial human expertise. Besides, the lassitude of the operator
    might lead to poor judgment and discrepancies in detecting the defects.'
