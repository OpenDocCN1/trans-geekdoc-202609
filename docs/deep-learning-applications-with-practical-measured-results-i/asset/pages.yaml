  md: 'For Problem 1, the objective function is to make the times of corrections through
    the correction area as small as possible while the trajectory length is as small
    as possible.


    In summary, we get a two-objective optimization model with multiple constraints:


    ```

    $$F_1 = \min\left(\sum_{i=1}^{m}(\eta_i + \lambda_i + h_i)\right)$$ $$F_2 = \min\left(\sum_{i=1}^{m}(a_i
    + b_i)\right)$$ s.t. $\begin{cases} \sum_{i=1}^{m} a_i \eta_i \delta < \theta
    \\ \sum_{i=1}^{m} b_i \eta_i \delta < \theta \\ 0 \le \eta_i \le l_{AB} \\ \lambda_i
    = a_i \eta_i \delta, \\ h_i = b_i \eta_i \delta, \quad i = 1,\dots,m \\ a_i, b_i
    = 0,1, \\ a_i + b_i = 1, \\ \lambda_i \le \alpha_1, h_i \le \alpha_2, \\ \lambda_i
    \le \beta_1, h_i \le \beta_2, \end{cases}$$(13)

    ```


    # 3.2. Trajectory Planning Algorithm for the Problem 1


    In order to solve the two-objective optimization model, it should be transformed
    into a single-objective programming model. In order to weigh the optimization
    goals of F1 and F2, we can choose a combination that takes into account both of
    them. The two are given a weight α(α ≤ 1), and α is called a preference coefficient.
    So, the objective function F can be expressed as:


    ```

    $$F = \min\left(\alpha \sum_{i=1}^{m}(\lambda_i + \eta_i + h_i) + (1 - \alpha)
    \sum_{i=1}^{m}(a_i + b_i)\right), \alpha \le 1$$ (14)

    ```


    We have successfully established the objective function and constraints for Problem
    1, and we will begin to solve it. The trajectory planning problem is a nonlinear
    programming problem with multiple constraints, which needs to consider the overall
    optimization, and to minimize the calculation amount while avoiding falling into
    a local optimum, and our study is to find the optimal flight path of an UAV from
    the starting point to the destination in three-dimensional space. Then we use
    the genetic algorithm. The basic idea of a genetic algorithm is to simulate the
    evolutionary process of biological genetics. Based on the principles of “survival
    of the fittest”, with the help of selection, crossing, and mutation, the problem
    to be solved approaches the optimal solution step by step from the initial solution.
    In trajectory planning, each chromosome (individual) of a genetic algorithm represents
    the trajectory of a UAV. The coding method of genes is also the coding method
    of trajectory nodes. The fitness function is changed by the cost function.


    In this research, a UAV trajectory planning problem is combined with the idea
    of the genetic algorithm, and the real number gene coding method and specific
    genetic operator are used to meet the flight path trajectory of various constraint
    parameters to achieve the approximate optimal solution. The specific operation
    process is as follows:


    The first step: using the real number gene coding. Use the fixed-length real number
    gene coding method showed in Figure 3 to convert the position information of an
    UAV in three-dimensional space into the chromosomal gene structure (as shown in
    Figure 4). Each gene of the chromosome contains the three-dimensional spatial
    coordinate (x, y, z) information of the gene, which records the following information
    of the spatial gene: one is whether the gene is feasible, and the other is whether
    the connecting line segment between the gene and the next gene is feasible. This
    gene sequence is only feasible if the above conditions are acceptable.'
