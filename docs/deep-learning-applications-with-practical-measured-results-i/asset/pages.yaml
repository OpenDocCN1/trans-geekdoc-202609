    # 3.5. Module Summary


    In this module, the update strategies under four mainstream tracking frameworks—correlation
    filter, sparse coding (dictionary learning), bag-of-words (features), and deep
    neural network—are discussed, and the progresses are illustrated according to
    the specific examples in recent researches. Questions regarding the challenges
    that remain in the existed update strategies are summarized as below: (1) How
    to build a template set structure that includes more abundant information about
    the target but consumes the least amount of memory as possible; (2) How to more
    effectively choose training samples that contain various kind of target appearances
    and control the distribution of the sample set for deep neural network update;
    (3) How to deal with visible parts of the occluded target and make good use of
    them for update to boost the network’s adaptation to newest appearances; and,
    (4) How to separately use different features of the target and utilize feature-specific
    update methods to make the tracker more robustly adjust to the variation of each
    feature. Contributions of each feature or convolution layer should also be considered
    for the update at the global level.


    # 4. Background Model Update


    The environment of the target existence is background. With the movement of the
    target, the background also varies its appearance, so the correct estimation of
    targets’ surrounding background is the premise of correct location of the target.
    Characters of the background regions that surround the target are especially essential
    to prevent drift to similar objects in the background, which should be distinguished
    from the characters of the target [49]. Compared with the target, the background
    occupies much larger area in the view of a frame, whose appearance features appears
    more complicated, hence there ought to be plenty of available negative sample
    sources, therefore how to more credibly select background samples is also a key
    part in the work of update. Background model update occasion and strategies are
    discussed below.


    # 4.1. Background Sampling Methods


    Sampling of background samples is the key part of the update work, owing to the
    fact that the number of background patches is far larger than that of foreground
    patches. Random selection is adopted in some researches, for instance, background
    “words” are extracted from random regions outside the target area in [31]. Yet,
    an object must exist in a specific environment—it must possess an exact position
    in the background area. Based on this truth, the authors in [2] hold the view
    that all non-overlapped background patches are not equal, and background regions
    with different features affect apparently differently on the sample classification.
    In this research, sampled background patches are clustered into multiple groups;
    afterwards, the specific SVMs are trained using each group of the background and
    target samples. Negative samples distant from the target area are drawn for update
    to make the foreground samples more distinguishable, where the sampling method
    is often utilized in extreme learning machine (ELM) [3,50] frameworks. Some SC
    based trackers also use background patches faraway from the object, i.e., [41,51].


    Nevertheless, not all of the background characters are of valuable use. On the
    basis of animal’s visual tracking mechanism, the background regions near to the
    area of the moving object contain the most valuable information that can help
    with target location; hence, they ought to be the most available parts through
    the entire background, while the influence of the information of background far
    from the position of target are of far less importance. The examples of background
    sample selection policies in last paragraph overlook the relationships between
