- pgno: 220
  md: 'Further, this research establishes a classifier that performs the process of
    detection of bubble defects in treads and sidewalls of tires, which is presented
    in Section 2.3. Moreover, the sliding window described in Section 2.4 is used
    to check the segmented block images sequentially for bubble defects. If the classifier
    classifies a block as containing bubbles, the Faster R-CNN is used to determine
    if the result is a false positive. If the resultant image is not false positive,
    then in the original image, the respective location of the block is encircled.
    As a result, this image is passed on to the professional operators for assessing
    the quality of the tires and also for removing the defective piece. Furthermore,
    this devised semi-automated assessment process offers cost-leadership when compared
    with the traditional manual inspection and also improves the reliability of the
    inspection process.


    # 3. Results


    In this work, the diagnosis of bubble defects in tires established in [13] and
    the Faster Region-based Convolutional Neural Networks approach is amalgamated
    for obtaining 100% detection of defects and also aiding in reducing the false
    alarm ratio. The evaluation metrics, such as the accuracy, sensitivity, and specificity,
    are used for assessing the performance of the proposed hybrid model. These metrics
    are computed using the following expressions:


    Accuracy = (TP + TN) / (P + N) (1)


    Sensitivity = TP / P (2)


    Specificity = TN / N (3)


    where TP stands for true positive, it represents the amount of diagnosed bubble
    patterns, which really possesses the bubble defects, and FP stands for false-positive
    and, it indicates the amount of not bubble patterns, which are wrongly diagnosed
    as bubble defects. True negative (TN) illustrates the amount of not bubble patterns,
    which are diagnosed as not bubble defects. Positives (P) represents the real bubble
    defects and negatives (N) denotes the not bubble defects. Among the evaluation
    metrics, sensitivity is the most necessary measure for achieving the complete
    detection of bubble defects.


    Moreover, a tire company provided the shearography images deployed in this research.
    Usually, the tire bubble defects were physically delineated with the assistance
    of experienced professionals. The amount of training images and blocks are clearly
    organized in Table 2. Further, it is evident that for the training process, the
    tire manufacturer supplied the 325 tire shearography images with bubble defects.
    Subsequently, the image enhancement approach is deployed for imitating 8596 and
    5052 blocks from 223 tire tread images and 102 tire sidewall images containing
    bubble defects. Additionally, Table 3 indicates the test dataset, it comprises
    of 541 tire shearography images deprived of bubble defects and 256 tire shearography
    images having bubble defects.


    Table 2. Training Dataset Details.


    |  | Tire Treads |  | Tire Sidewalls | |

    |---|---|---|---|---|

    |  | No. of Images | No. of Blocks | No. of Images | No. of Blocks |

