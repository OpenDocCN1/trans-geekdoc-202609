    # 3.3. Generative Adversarial Network-Based Neural Audio Caption Model


    The neural audio caption method based on data transformation can generate understandable
    and appropriate evaluations. To make the generated comment closer to the expert
    comment, a Generative Adversarial Network (GAN) is combined [33,34].


    GAN-Based Neural Audio Caption Model is composed of two neural networks, a generative
    neural network and a discriminative neural network. It uses the NACM as its generator,
    which generates comments. Meanwhile, the discriminator evaluates them for authenticity.
    The goal of the generator network is to generate comments that are as similar
    to the samples in the training set as possible. The input of the discriminator
    network is the real sample or the output of the generator network. Its purpose
    is to distinguish the output of the generator network from training data as much
    as possible. Thus, GAN builds a sort of feedback loop where the generator is helping
    to train the discriminator, and the discriminator is helping to train the generator.
    They both get better together. With this structure, the generated comment is closer
    to the real evaluation. The structure of the model is shown in Figure 3.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_260_0.png)


    Figure 3. GAN-Based Neural Audio Caption Model. The model is divided into a generator
    and a discriminator. Among them, the generator follows the Neural Audio Caption
    Model. The discriminator uses an embedding layer, a deep LSTM layer and a fully
    connected layer.'
