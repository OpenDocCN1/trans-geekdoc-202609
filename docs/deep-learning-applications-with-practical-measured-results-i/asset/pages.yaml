  md: 'Article


    # Deep Transfer HSI Classification Method Based on Information Measure and Optimal
    Neighborhood Noise Reduction


    Lianlei Lin, Cailu Chen, Jingli Yang * and Shanshan Zhang


    Department of Test and Control Engineering, School of Electronics and Information
    Engineering, Harbin Institute of Technology, Harbin 150001, China; linlianlei@hit.edu.cn
    (L.L.); chencailu_hit@163.com (C.C.); zhangshanhit@163.com (S.Z.)


    * Correspondence: jinglidg@hit.edu.cn; Tel.: +86-0451-86413532


    Received: 5 August 2019; Accepted: 30 September 2019; Published: 2 October 2019


    Abstract: Land environment is one of the most commonly and importantly used synthetical
    natural environments in a virtual test. To recognize the ground truth for the
    construction of virtual land environment, a deep transfer hyperspectral image
    (HSI) classification method based on information measure and optimal neighborhood
    noise reduction was proposed in this article. Firstly, the information measure
    method was used to select the most valuable spectrum. Specifically, three representative
    bands were selected using the combination of entropy, color matching function,
    and mutual information. Based on the selected bands, a patch containing spatial-spectral
    information was constructed and used as the input of the convolutional neural
    networks (CNN) network. Then, in order to address the problem that a large number
    of labeled samples were required in deep learning method, the HSI classification
    method based on deep transfer learning was proposed. In the proposed method, the
    transfer of parameters ensured the classification performance with small training
    samples and reduced the training cost. Moreover, the optimal neighborhood noise
    reduction was used as the post-processing method to effectively eliminate the
    salt-and-pepper noise and further improve the classification performance. Experiments
    on two datasets demonstrated that the proposed method in this article had higher
    classification accuracy than similar methods.


    Keywords: CNN; hyperspectral image classification; information measure; transfer
    learning; neighborhood noise reduction


    # 1. Introduction


    In recent years, hyperspectral image (HSI) analysis has been widely used in various
    fields [1], such as the monitoring of land cover change [2,3] and the environmental
    science and mineral development [4]. As an advanced machine learning technology,
    deep learning has been widely used in image classification to learn the hierarchical
    features of a deep neural network from low-level to high-level [5]. The image
    classification methods based on the convolutional neural networks (CNN) have shown
    the ability to detect local features of the hyperspectral input data and obtain
    the classification results with high accuracy and stability. Rachmadi et al. proposed
    an adaptation of a convolutional neural network (CNN) scheme proposed for segmenting
    brain lesions with considerable mass-effect, to segment white matter hyperintensities
    (WMH) characteristic of brains with none or mild vascular pathology in routine
    clinical brain magnetic resonance images (MRI) [6]. Krizhevsky et al. proposed
    a large, deep convolutional neural network to classify the 1.2 million-high resolution
