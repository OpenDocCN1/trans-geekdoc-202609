    # A Data-Driven Short-Term Forecasting Model for Offshore Wind Speed Prediction
    Based on Computational Intelligence


    Ioannis P. Panapakidis 1,*, Constantine Michailides 2 and Demos C. Angelides 3


    +   1. Department of Electrical Engineering, Technological Educational Institute
    of Thessaly, 41110 Larisa, Greece

    2. Department of Civil Engineering and Geomatics, Cyprus University of Technology,
    3036 Limassol, Cyprus; c.michailides@cut.ac.cy

    3. Department of Civil Engineering, Aristotle University of Thessaloniki, 54124
    Thessaloniki, Greece; dangelid@civil.auth.gr

    * Correspondence: panap@teilar.gr; Tel.: +30-2410-684325


    Received: 27 March 2019; Accepted: 6 April 2019; Published: 10 April 2019


    **Abstract:** Wind speed forecasting is an important element for the further development
    of offshore wind turbines. Due to its importance, many researchers have proposed
    different models for wind speed forecasting that differ in terms of the time-horizon
    of the forecast, types and number of inputs, complexity, structure, and others.
    Wind speed series present high nonlinearity and volatilities, and thus an effective
    model should successfully deal with those features. An approach to deal with the
    nonlinearities and volatilities is to utilize a time series processing technique
    such as the wavelet transform. In the present paper, an ensemble data-driven short-term
    wind speed forecasting model is developed, tested and applied. The term “ensemble”
    refers to the combination of two different predictors that run in parallel and
    the prediction is obtained by the predictor that leads to the lowest error. The
    proposed model utilizes the wavelet transform and is compared with other models
    that have been presented in the related literature and outperforms their accuracy.
    The proposed forecasting model can be used effectively for 1 min and 10 min ahead
    horizon wind speed predictions.


    **Keywords:** computational intelligence; offshore wind; forecasting; machine
    learning; neural networks; neuro-fuzzy systems


    # 1. Introduction


    # 1.1. Motivation and State-of-the-Art


    The rapid implementation of wind turbines across the globe corresponds to a set
    of challenges during power systems operation and planning. This is due to intermittent
    nature of wind potential. By the end of 2018, the total European Union-installed
    offshore wind capacity reached 19 GW. Total investments in offshore wind in 2018
    were more than 10.3 billion € (WindEurope [1], 2018). This includes investments
    in construction of projects, transmission assets, and refinancing. More than 91%
    of all offshore wind installations were located in shallow or intermediate water
    depths with a mean water depth equal to 27.1 m. The capacities span from few to
    hundred megawatts and the installations differ in terms of hub site, distance
    to shore, water depth and others (Snyder et al. [2], 2009). The reduction of installation
    and maintenance costs but also the reliable assessment of energy production of
    offshore wind parks will signify the next phase of their deployment.


    Wind energy leads to disturbances of the balance between generation and demand
    sides. A wind speed prediction system is a potential solution to the aforementioned
    situation. Apart from the balance, accurate predictions can lead to lower costs
    during the installation in the offshore field of wind turbines and can strengthen
    their reliability during their operation (Soman et al. [3], 2010). A large'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'number of papers exist in the literature aiming at developing robust forecasting
    systems of wind speed. The literature can be divided to research that focuses
    on (a) wind speed predictions, (b) wind farm power predictions, and (c) both wind
    speed and farm power predictions.


    According to (Jung and Broadwater [4], 2014) the forecasting horizon can be classified
    into the following categories; (a) very short-term: few minutes up to 30 min ahead;
    (b) short-term: 30 min up to to 6 h ahead; (c) medium-term: 6 h to 1 day ahead;
    and (d) long-term: 1 day up to 1 week (or more) ahead. Short-term forecasts are
    exploitable in day-ahead power system operations such as scheduling and commitment
    of power units.


    The forecasting models are distinguished into physical and statistical. Physical
    models take into consideration parameters like the topology of the ground (for
    on-site parks) and topology of the wind park and temperature. They use the outputs
    of a Numerical Weather Prediction (NWP) model and provide final forecasts. NWP
    models are used by meteorologists and usually they provide predictions for the
    next 48 up to 172 h ahead. For the case of wind power predictions, the wind speed
    prediction is obtained directly by the NWP and the wind power prediction is obtained
    by using the power curve of a wind turbine. Physical models are appropriate for
    long-term predictions. However, it is difficult to scale the forecasts per wind
    turbine or per wind farm. Also, physical models are complex in terms of inputs
    requirements and execution time. On the other hand, statistical models are favored
    in short-term prediction horizons. The wind is treated as a regression of its
    past values. A relatively large number of historical values are needed to train
    the models and define their optimal composition. Statistical models refer to time
    series models, Artificial Neural Networks, Bayesian Networks, Support Vector Machines,
    and others. Time series models refer to autoregressive models, autoregressive
    models with moving average, and others. The main advantages are their potential
    for removing the trend of time series and their availability in software packages.
    However, there is a difficulty in extracting the optimal structure of the model.
    Also, time series models require a large number of historical values and are not
    definitely suitable for highly nonlinear series. Neural networks are suitable
    for nonlinear series and are a favorable scheme in many forecasting problems.
    Support vector machines are also a well-known forecasting engine but they demand
    large durations for their training and their parameters are optimized by a relatively
    complex process. Bayesian networks are more appropriate for small data sets. Finally,
    various statistical models can be integrated to form ensemble forecasting models
    [4–11].


    In (Sfetsos [12], 2002), a comparison takes place between a persistent model,
    autoregressive integrated moving average (ARIMA) and neural network. The latter
    outperforms the rest. No external variables are considered. The comparison takes
    place in two different sets that refer to one month each. In (Başaran and Filik
    [13], 2017) the authors consider three cases of inputs for the neural network,
    i.e., using only past wind speed values, using past wind speed values and temperature
    and, finally, using wind speed, temperature, and pressure. The test refers to
    five days and two intervals for predictions are taken into account, namely 30
    and 90 s ahead. The case with wind speed, temperature, and pressure leads to the
    lower errors. No comparison with other models is presented. In (More and Deo [14],
    2003) the authors test a feed-forward neural network, a recurrent neural network,
    and an ARIMA model to forecast daily, weekly, and monthly wind speeds at two coastal
    locations in India using only past wind speed values. The feed-forward neural
    network wins the competition. In (Li and Shi [15], 2010), the authors examine
    three types of neural networks, namely, the adaptive linear element, backpropagation,
    and radial basis function. The wind data used are the hourly mean wind speed collected
    at two observation sites in a United States of America (USA) location. The results
    show that even for the same wind dataset, no single neural network model outperforms
    others universally in terms of all evaluation metrics. Moreover, the selection
    of the type of neural networks for best performance is also depends upon the data
    sources. In (Zeng and Qiao [16], 2011) a support vector machine model is presented
    for wind power forecasting. Instead of predicting wind power directly, the model
    first predicts the wind speed, which is then used to predict the wind power by
    using the power–wind speed characteristics of the wind turbine generators. Simulation
    studies are carried out to validate the proposed model for very short-term and
    short-term predictions by using the data obtained'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'from the National Renewable Energy Laboratory of USA. The model is compared
    with feed-forward neural network and radial basis network. The prediction is held
    using only past wind speed values. In (Zhou et al. [17], 2011), the authors present
    a least-squares support vector machine for one-step ahead wind speed forecasting.
    Three kernels, namely linear, Gaussian, and polynomial kernels, are implemented.
    The support vector machine’s parameters considered include the training sample
    size, order, regularization parameter, and kernel parameters. The support vector
    machine’s version are compared with a persistence model and provide better forecasts.
    The Adaptive Neuro-Fuzzy Inference System (ANFIS) is utilized in (Fazelpour et
    al. [18], 2016), and is compared with a feed-forward neural network and radial
    basis network in hour-ahead forecasting in a location in Tehran, Iran. No exogenous
    parameters are used. ANFIS results in better forecasts. In (Fortuna et al. [19],
    2016), the clustering tool is used to form wind speed classes. Then, two models,
    namely the Hidden Markov Model and the Nonlinear Autoregressive are compared for
    predicting the class of each new wind speed data entry. In general, wind speed
    series present volatilities and stochasticity. Depending on the data set, an analysis
    on the wind speed characteristics can take place. For instance, in (Fortuna et
    al. [20], 2014), the authors provide a fractal analysis on wind speed observations.
    Exploitable information can be derived for such analysis for further modeling.


    # 1.2. Contribution of the Present Paper


    A variety of forecasting techniques have been proposed so far from different research
    groups. In the present paper a relatively simple yet efficient model for short-term
    wind speed forecasting based on real measured wind speed data is developed, applied,
    and proposed. The used data set involves inconsistencies of the time sequence
    of the wind speed series due to missing data. Various experiments take place that
    refer to different input combinations. Also, the Discrete Wavelet Transform (DWT)
    is utilized in order to decompose the initial series into a set of wavelet components
    for strengthening the forecasting credibility [21,22]. The model is composed by
    an ANFIS and a Feed-Forward Neural Network (FFNN) [23,24]. In the majority of
    the studies of the literature, the prediction is accomplished using only past
    values. In order to fully examine the level of influence of external variables
    such as temperature and speed directions on the prediction accuracy, in the present
    paper various input combinations of wind speed, wind direction, and air temperature
    are examined. Overall, the purpose of the paper is to test the performance of
    a proposed hybrid computational intelligence model in the wind speed forecasting
    problem under the limitation of using incomplete data for the training and validation
    of the model.


    # 2. Short-Term Wind Speed Forecasting Hybrid Model


    # 2.1. Description


    In this section, an efficient forecasting model is developed and proposed. The
    model consists of an FFNN trained by the Levenberg–Marquardt algorithm and an
    ANFIS [25]. Neural network-based forecasting systems are a favorable scheme in
    recent years in predictions over traditional time series models. Numerous applications
    in load and price forecasting studies have brought forth the advantages of neural
    networks. Recently, neural networks have been used in wind power predictions.
    For full mathematical description of the FFNN the reader is referred to (Graupe
    [24], 2007). A general illustration of an FFNN is shown in Figure 1.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '![](img/8b41ef3997625b78ba4cb189dbc5f7b9_20_0.png)


    Figure 1. A Feed-Forward Neural Network (FFNN) with 4 inputs, 4 outputs, and 2
    hidden layers.


    Another common forecasting system is ANFIS [23]. ANFIS is based on a fuzzy rule-based
    inference mechanism. It is composed of five layers and each layer contains several
    nodes. The nodes are described by a node function. Let $O_i^j$ be the output of
    the $i$-th node in layer $j$. In the 1st layer, every node I is an adaptive node
    with node function:


    $$O_i^1 = \mu A_i(x),\ i = 1,2 \tag{1}$$


    or


    $$O_i^1 = \mu B_{i-2}(y),\ i = 3,4 \tag{2}$$


    where $x$ or $y$ is the input of the $i$th node and $A_i$ or $B_{i-2}$ is a linguistic
    label associated with the node. Hence, $O_i^1$ is the membership grade of a fuzzy
    set $A_1, A_2, B_1$ or $B_2$ and it specifies the degree to which the input $x$
    or $y$ satisfies the quantifier $A$ or $B$. Any continuous and piecewise differential
    function can be used as node function in the 1st layer. In the 2nd layer, each
    node $\Pi$ multiplies the inputs and sends the product in output:


    $$O_i^2 = w_i = \mu A_i(x)\mu B_i(y),\ i = 1,2 \tag{3}$$


    In the 3rd layer, each node N computes the ratio


    $$O_i^3 = \bar{w}_i = \frac{w_i}{w_1 + w_2},\ i = 1,2 \tag{4}$$


    In the 4th layer, each node computes the contribution of the $i$th rule to the
    overall output:


    $$O_i^4 = \bar{w}_i z_i = \bar{w}_i (a_i x + b_i y + c),\ i = 1,2 \tag{5}$$


    where $\bar{w}_i$ is the output of the 3rd layer and $a_i, b_i, c$ are a set of
    parameters.


    Finally, in the 5th layer, the node $\Sigma$ computes the final output as the
    summation of all inputs:


    $$O_i^5 = \sum_i \bar{w}_i z_i = \frac{\sum_i w_i z_i}{\sum_i w_i} \tag{6}$$


    ANFIS topology is displayed in Figure 2.'
