- pgno: 13
  md: 'Chang et al. from Taiwan and India in “Quality Assessment of Tire Shearography
    Images via Ensemble Hybrid Faster Region-Based ConvNets” considered that the bubble
    defect detection is an important issue to filter out defective tires for the improvement
    of driving safety. Therefore, the combination of ensemble convolutional neural
    network and Faster-RCNN was proposed to detect bubble defects in the shearography
    images of tires. In their experiments, for the evaluation of the proposed method,
    3279 tire images were selected as training data; 797 tire images were selected
    as testing data. The results show that the accuracy, sensitivity and specificity
    of the proposed method were higher than those of other methods (e.g., SVM, random
    forest, Haar-like AdaBoost, etc.) [53].


    Sun et al. from China in “High-Resolution Image Inpainting Based on Multi-Scale
    Neural Network” considered that the blurred textures and the unpleasant boundaries
    may be obtained by the image inpainting method based on GAN in the cases of high
    resolution images. Therefore, this study applied the super-resolution using a
    generative adversarial network (SRGAN) to inpaint image and extract the features
    of textures for the improvement of image recognition. In the experiments, COCO
    and VOC datasets which included 135,414 images as training data and 200 images
    as testing data were selected to evaluate the proposed method. The results show
    that the PSNR and SSIM of the proposed method were higher than the PSNR and SSIM
    of other methods [54].


    # 5. Recommendation Systems and Education Systems


    Two papers on recommendation systems and education systems are as follows: (1)
    “Deep Learning-Enhanced Framework for Performance Evaluation of a Recommending
    Interface with Varied Recommendation Position and Intensity Based on Eye-Tracking
    Equipment Data Processing” by Sulikowski et al. [55] and (2) “Generative Adversarial
    Network Based Neural Audio Caption Model for Oral Evaluation” by Zhang et al.
    [56].


    Sulikowski et al. from Poland in “Deep Learning-Enhanced Framework for Performance
    Evaluation of a Recommending Interface with Varied Recommendation Position and
    Intensity Based on Eye-Tracking Equipment Data Processing” considered that high
    correlations may exist between users’ gaze data and interests in human-computer
    interaction for recommendation inferences. Therefore, this study collected eye-tracking
    data to train a deep learning neural network model for building an e-commerce
    recommendation system. In the experiments, 15,922 fixation records were generated
    by eye-tracking devices from 52 participants. The results show that the accuracies
    of training dataset and testing dataset were 98.4% and 98.2%, respectively [55].


    Zhang et al. from China in “Generative Adversarial Network Based Neural Audio
    Caption Model for Oral Evaluation” considered that the massive human work is required
    by oral evaluation for testing children’s language learning. Therefore, an automated
    expert comment generation method based on gated recurrent units (GRUs), LSTM networks
    and GANs was proposed to extract the features of orals and generate expert comments.
    In their experiments, the proposed neural audio caption model (NACM) and the proposed
    GAN-based NACM (GNACM) were implemented and compared; several oral audios from
    the children of 5-6 years old were collected for evaluating the proposed models.
    The results show that scores of GNACM were higher than the scores of NACM; furthermore,
    the average response time of GNACM was lower than that of NACM [56].


    # 6. Conclusions and Future Work


    Four main parts, including (I) environmental information analyses and predictions,
    (II) UAV and object tracking applications, (III) measurement and denoising techniques,
    and (IV) recommendation systems and education systems, are collected and discussed
    in this Special Issue. These articles utilized and improved the deep learning
    techniques (e.g., ResNet, Fast-RCNN, LSTM, ConvLSTM, GAN, etc.) to analyze and
    denoise measured data in a variety of applications and services (e.g., wind speed
    prediction, air quality prediction, underground mine applications, neural audio
    caption, etc.). Several practical experiments were given in these articles, and
    the results indicated that the performance of'
