    # 3.4. M-TCN Model


    The main characteristic of CNN is a local feature by convolving filters. For time
    series forecasting, the local correlation is reflected in the continuous change
    over a period of time within a small time slot. In addition, RNN models, such
    as LSTM, have always been considered as the best standard method to solve sequence
    problems; however, RNNs cannot be parallel, resulting in huge time-consumption
    compared to that of CNN. From those considerations, the overall framework of the
    model is designed based on CNN. Our aim is to distill the best practices in designing
    convolutional networks to be flexible and stable frameworks with a simple architecture
    and high efficiency for multivariate time series'
