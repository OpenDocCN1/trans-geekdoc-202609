    # 4. Result


    # 4.1. Improved Inpainting Network


    We evaluate our proposed image inpainting model on VOC2017 and COCO dataset without
    using tags or other information related to these images. The COCO dataset contains
    118,288 images for training and 100 test images. VOC dataset contains 17,126 images
    for training and 100 test images. These test images are randomly selected from
    the validation dataset.


    We compared the experimental results with PatchMatch [25] and contextual attention
    (Yu J [14]). PatchMatch [25] is one of the most advanced methods in patch synthesis,
    and contextual attention (Yu J [14]) is currently a relatively advanced image
    inpainting network based on deep learning. To be fair, we use all the methods
    to train on our dataset. Yu J [14] trained the model to handle the fixed hole.
    Therefore, we used fixed holes on the testing dataset to make it easy to compare
    the results with PatchMatch [25] and contextual attention (Yu J [14]). The fixed
    hole is located in the center of the input image, with the size 128 × 128. All
    results are generated from directly exported training models, and no post-processing
    is performed.


    First of all, the display comparison between our results and PatchMatch [25],
    contextual attention (Yu J [14]) in high-resolution images is shown in Figure
    5. It can be seen, the inpainting results of our model are more realistic, smoother
    and more similar to the texture of the surrounding area than the other two methods.
    Next, the quantitative comparison in Table 1 also shows the results of the comparison
    between our method and PatchMatch [25], contextual attention (Yu J [14]). We use
    three evaluation indexes: peak signal-to-noise ratio (PSNR), structural similarity
    index (SSIM), and average error (L1 loss). The unit of PSNR is dB, and the larger
    the value is, the smaller the image distortion is. The value range of SSIM ranges
    from 0 to 1, and the larger the value is, the smaller the image distortion is.
    L1 loss is the sum of the absolute difference between input and output, and the
    smaller the value is, the smaller the image distortion is. As you can see from
    the table, the methods based on deep learning have a better performance than the
    traditional methods based on patch in three indexes including PSNR, SSIM and L1
    loss. Our model has improved in terms of data compared with contextual attention
    (Yu J [14]). And it is obvious in Figure 5 that our model can effectively reduce
    the blurred texture and the unpleasant boundaries that inconsistent with the surrounding
    area. Our results are superior to contextual attention, which prove the effectiveness
    of our model in recovering texture details in image inpainting.'
