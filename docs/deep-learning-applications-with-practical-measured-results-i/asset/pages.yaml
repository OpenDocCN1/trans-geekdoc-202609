- pgno: 187
  md: '# 6. Conclusions and Future Work


    This paper implemented two experiments for the illustration and the verification
    of our proposed method for the correction of the kinematic geometric errors produced
    by the movement of the lateral stage of confocal microscopes. The experimental
    results indicate that the mean residual reduced 29.6%, the maximum error reduced
    26.3%, and the sum of squared errors reduced 47.7%.


    The first experiment measured the dot grid targets with extended topography. After
    processing the measurement data, the error correction coefficients defined in
    the mathematical model, i.e., Equations (4) and (5) presented in Part I [18] were
    determined. The uncertainties of the values of those coefficients were also evaluated
    using the Monte Carlo method. The simulation number was 1 × 10⁴. Distributions
    of the uncertainties of each coefficient, as well as their lower and upper boundaries
    of a 95% interval, were indicated.


    The second experiment measured a different area of the same standard artefact.
    By correcting the measurement data using our mathematical model and the determined
    coefficients, the corrected results were obtained. The residuals between the raw
    measured points and their corresponding certified values were compared to those
    between the corrected points and the certified values.


    The data processing algorithms and procedures, such as separations of the flats
    and cylinders, data partitions, outlier eliminations, K-means clustering, cylinder
    centers fittings, etc. were the same for the two experimental studies. The difference
    between the data processing for the two experiments was in the final procedures.
    The first experiment fitted the values of the coefficients used the nonlinear
    least squared method. The second method applied the mathematical models and the
    determined values of the coefficients to the measured data for obtaining the corrected
    coordinate values of the points.


    Results of the experiments demonstrated that our proposed method for lateral stage
    kinematic geometric error correction is efficient and useful.


    Among the next practical steps for improving the proposed method is a focus on
    the stitching algorithm of the optical element [26], which highly needs a calibration
    and correction of the stitching result.


