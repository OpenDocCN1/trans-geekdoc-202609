    # 3. The Approach


    The design details of the method are described in this section. The preprocessing
    method for audios and comments is designed in Section 3.1. The neural audio caption
    model (NACM) is described in Section 3.2. A Generative Adversarial Network (GAN)
    is considered adding to the NACM structure. The GAN-based generative model (GNACM)
    is designed in Section 3.3.


    # 3.1. Data Preprocessing


    Data preprocessing is a critical step in model research. The input of this model
    is audio data, and the output is natural language. The specific methods for processing
    audio data and comment data will be described in the section.


    # 3.1.1. Audio Feature Extraction


    Audio feature extraction base on Mel Frequency Cepstral Coefficient (MFCC) features
    [31]. The first step is to divide the original audio into frames in time series,
    and then extract the MFCC features of each frame. MFCC simulates the processing
    characteristics of human ear to speech to a certain extent and is designed according
    to the knowledge of human ear auditory system. It is a general method for feature
    extraction in speech processing. MFCC feature extraction mainly comprises the
    following steps: Pre-emphasis, Framing, Windowing, FFT, Mel filter bank, computing
    DCT. After the audio above processing, each audio can be represented as a two-dimensional
    matrix ($N_{time} \times N_{mfcc}$), where $N_{time}$ represents the number of
    frames in each audio, $N_{mfcc}$ represents the feature dimension of MFCC. Next,
    according to the MFCC features of the first N frames and the next N frames of
    each frame, we calculate the deltas and delta-deltas for personalized features
    that preserve dynamic information effectively [32]. The approach through this
    step increases the connection between the previous and subsequent frames, thereby
    improving the representation of the feature. The length of different voice files
    causes the number of frames $N_{time}$ to be different after feature extraction.
    To be suitable for batch calculation, it needs to uniform the number of frames
    in each audio. Thus, we set a hyperparameter $N_{max}$ to indicate the maximum
    number of frames. Therefore, for audio with frames less than $N_{max}$, we pad
    zero to its feature matrix until the length reaches $N_{max}$. Finally, the MFCC
    feature sequence $\mathbf{A} = (\vec{a}_1, \vec{a}_2, ..., \vec{a}_n)$ is obtained
    after the source audio processing. Where $\vec{a}_x$ represents the MFCC feature
    vector of each frame of an audio.'
