  img_proc: true
- pgno: 66
  md: 'in the recovered image especially at low compression ratios, according to the
    results reported by their authors.


    Another genre of CNN based compression methods utilize the semantic information
    in images, since preserving semantic information will render the recovered image
    more eye-pleasing. Ballé et al. introduce an end-to-end optimized CNN image compression
    network in [31]. The method is based on non-linear coding rather than linear coding
    used by JPEG. One important contribution of [31] is that the authors propose an
    method which simulates the quantizer in the training procedure to deal with the
    problem of zero derivatives due to quantization. Li et al. point out that in [4]
    it is inappropriate to allocate the same number of codes for each spatial position
    in an image. They propose the importance map to guide the spatially variant bit
    allocation. To further compress the data, they introduce the convolutional entropy
    encoder to compress the binary codes and the importance map. In [32], the authors
    combine the deep-learning-based image semantic analysis into image compression
    as well. Unlike [4] which focuses more on the edge of objects, the method in [32]
    emphasizes the semantic analysis of the whole region. Results in their experiments
    show the method can improve the visual quality under the same compression overhead.
    However, it can be quite complicated to adjust the compression ratios of this
    genre of methods. Moreover, these methods are rarely applied at very low compression
    ratios.


    # 1.3.2. Recurrent Neural Network Based Image Compression


    Unlike the feed-forward CNN, the recurrent neural network (RNN) is state-aware.
    The output of an RNN is not only related to current input, but also the previous
    input. Lyu et al. propose to combine the knowledge of block-sparsity recovery
    into RNN deep learning in [33]. Their method acquires the spatial correlations
    between nonzero elements of block-sparse signals. It is applied to not only images
    but also audio data. However, the method proposed in [33] requires the input data
    to be sparse, which limits its compression capability. In [34], Toderici et al.
    combine the scaled-additive coding framework into RNN-based image compression
    scheme. The highlight in [34] is that the architectures proposed can provide variable
    compression rates during deployment without retraining the network. In [35], Minnen
    et al. propose a spatially adaptive image compression framework with quality-sensitive
    bit rate adaptation. However, though their method outperforms JPEG, it is still
    inferior to JPEG2000 [36].


    # 1.3.3. Generative Adversarial Network Based Image Compression


    Generative adversarial network (GAN) is another promising deep learning method
    developed during recent years. In the GAN scheme, a generator network and a discriminator
    network are optimized simultaneously. The discriminator network is trained to
    determine whether a sample is generated by the generator network, while the generator
    network needs to fool the discriminator into wrong decisions. In regards of image
    compression utilizing GAN, Ripple and Bourdev in [37] propose an architecture
    of autoencoder featuring pyramidal analysis, an adaptive coding module, and regularization
    of the expected code length. It produces images 2.5 times smaller than JPEG and
    JPEG2000, while achieving realtime performance using GPU. Jia et al. in [38] propose
    a light filed image compression framework driven by a GAN-based sub-aperture image
    generation and a cascaded hierarchical coding structure. Their method outperforms
    the state-of-the-art learning-based light field image compression approach with
    on average 4.9% BD-rate [39] reductions. In [40], Agustsson et al. propose a GAN-based
    framework targeting extremely low bitrate compression. Their method pushes the
    bitrate below 0.1 bpp while still achieves eye-pleasing results.


