  img_proc: true
- pgno: 228
  md: 'patch. Although it produces a smoother result, it assumes the texture of the
    inpainting area can be found elsewhere in the image. This assumption does not
    always hold. Therefore, it is good at restoring patterned regions, such as background
    reconstruction, but has difficulty in reconstructing locally unique patterns.


    Generative adversarial network makes the research of image inpainting to a peak.
    Vanilla GANs [26] shows good performance in generating clear images, but has difficulty
    extending to higher-resolution images due to the instability of training. Several
    techniques for stable training processes have been proposed, including DCGAN [27],
    energy-based GAN [28], Wasserstein GAN (WGAN) [29,30], WGAN-GP [31], BEGAN [32],
    and LSGAN [33]. A more relevant task of image inpainting is conditional image
    generation. For example, Pix2Pix [34], Pix2Pix HD [35], and CycleGAN [36] transform
    images in different domains using paired or unpaired data.


    The commonly used loss function of image inpainting based on generative adversarial
    network is a combination of adversarial loss and L2 loss. L2 loss can excite the
    output of the generated network with variance computing, but cannot capture the
    high-frequency details and repair the clear texture structure. So the introduction
    of adversarial loss can effectively solve the problem.


    The basic model of image inpainting based on generative adversarial networks is
    the encoder-decoder used by Deepak [10] et al. To improve the inpainting result
    of face images, it combines L2 loss with adversarial loss. The latest and effective
    image inpainting models based on deep learning are mostly developed on this basis.
    However, the shape of the repaired region is fixed so it has a strong limit in
    practical application. In response to this question, Liu [12] et al. introduces
    partial convolution, which can process any non-central, irregular region. However,
    the method still needs to establish a mask dataset based on deep neural network
    and conduct pre-training on the irregular masks of random lines. Iizuka [11] uses
    dilated convolution to increase the receptive field, which obtains the image information
    in a larger range as much as possible without missing extra information. This
    method is suitable for solving the inpainting problem of non-center and irregular
    region, but it has poor inpainting result on structural objects. In recent years,
    GAN has made a great breakthrough in the application of image inpainting. In the
    future, there will be more research progress on image inpainting based on deep
    learning.


    Yu [14] et al. improves the generated network of image inpainting based on Iizuka’s
    research [11], and proposes a unified feedforward generation network with a novel
    context attention layer. The proposed network consists of two phases. The first
    phase is to roughly extract the missing content after reconstruction loss training
    with dilated convolution. The second phase is to integrate the context attention.
    The core idea of context attention is to use the characteristics of known patch
    as convolution filters to generate patch. The two generating networks are similar
    to UNET.


    Inspired by [14], the issue is divided into two subtasks: (1) The first subtask
    uses the context encoder (CE) [10] to fill in the large areas need repaired according
    to the environmental information. (2) As CE cannot recover high-frequency details,
    the second subtask uses a network similar to SRGAN to capture high-frequency details.


    # 3. The Approach


    # 3.1. Improved Image Inpainting Network


    We first constructed our generated network of image inpainting by copying and
    improving the most advanced inpainting [14] model recently. The network shows
    a good inpainting result in natural images.


    Our improved image inpainting network is shown in Figure 2. We follow the same
    input and output configurations as in [14] for training and inference. The improved
    generated network takes an image with white pixels filled in the holes A and a
    binary mask indicating the hole regions as the input pair, and it outputs the
    final repaired image. The size of the input image is 256 × 256 and the size of
    the'
