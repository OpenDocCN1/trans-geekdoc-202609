    # 2.3. Binary Classification Module


    # 2.3.1. SVM


    The SVM algorithm flow can be represented as the first part of Figure 4. SVM is
    a generalized linear classifier that classifies data according to the supervised
    learning method. Its decision boundary is the maximum margin hyperplane for solving
    learning samples. The purpose of the SVM is to find a hyperplane to divide the
    samples into two categories with the largest interval. The ω obtained by the algorithm
    represents the coefficient of the hyperplane that the algorithm needs to find.
    In mathematical terms, it can be described as Label (1),


    max 1/||ω||, s.t., y_i(ω^T x_i + b) ≥ 1, i = 1, …, n, (1)'
