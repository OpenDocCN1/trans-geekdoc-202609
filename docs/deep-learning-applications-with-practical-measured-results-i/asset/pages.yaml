    The proposed hybrid model has been compared with various classifiers including
    the Support Vector Machine (SVM) [23], Random Forest Model [24], Haar-like AdaBoost
    Method [25], Chang’s method [13], and the integrated model comprising of SVM,
    Random Forest Model, AdaBoost method. Besides, the proposed model was compared
    with these methods for verifying its performance. Table 5 illustrates the diagnosis
    of bubble-defects in treads of tire shearography images for several existing methods
    in comparison with the proposed ensemble hybrid model in terms of the evaluation
    metrics such as accuracy, sensitivity, and specificity. Additionally, Table 6
    depicts the diagnosis of bubble-defects in sidewalls of tire shearography images
    for numerous prevailing approaches in comparison with the proposed ensemble hybrid
    model in terms of the assessment metrics such as accuracy, sensitivity, and specificity.
    Further, it can be witnessed from these tables that the work in [13] and the presented
    ensemble hybrid approach achieve 100 percent sensitivity, by successfully identifying
    each and every bubble-defect. Also, it can be observed that the presented ensemble
    hybrid approach surpasses all other existing approaches in terms of specificity.
    However, the presented ensemble hybrid approach requires a processing time of
    approximately 7 seconds/image, whereas the approach established in [13] takes
    only a processing-time of roughly 6 seconds/image. Nevertheless, the presented
    ensemble hybrid model is superior in other means and also in terms of specificity,
    when compared with the other existing approaches.


    Figure 8a–d illustrate the shearography images or the speckle patterns acquired
    using digital shearography, and Figure 8e–h depict the detection of bubble defects
    in tires using the proposed hybrid Faster Region-based convolutional neural networks
    model. Figure 8e–h indicate the fact that all bubble defects in tires have been
    detected successfully. Figure 9a–d depict the false positive or the false alarm
    inspection results in [13], where the shearography images do not have bubble defects;
    however, they get misrepresented as possessing the bubble defects. Figure 9e–h
    illustrate the assessment results of the hybrid Faster Region-based convolutional
    neural networks model using the same set of input images. It can be witnessed
    in Figure 9e–h that the shearography images have no bubble defects. Besides, it
    reveals the fact that the proposed hybrid Faster Region-based convolutional neural
    networks model effectively reduces the false-positive ratio or the false alarm
