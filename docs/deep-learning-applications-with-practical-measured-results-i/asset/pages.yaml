    # 4. Conclusions


    In the tire manufacturing process, the diagnosis of bubble-defects in the treads
    and sidewalls of shearography tire images represents a significant task. Therefore,
    enabling smart tire quality assessment seems to be an essential way of realizing
    intelligent tire manufacturing practices that can'
