    According to the characteristics of each dataset, it is necessary to preprocess
    the data. Each of the datasets is normalized with a mean of 0 and a standard deviation
    of 1.


    For the Beijing PM2.5 Dataset, PM2.5 is NA in the first 24 h. We will, therefore,
    need to remove the first row of data. There are also a few scattered “NA” values
    later in the dataset, and we use zero'
