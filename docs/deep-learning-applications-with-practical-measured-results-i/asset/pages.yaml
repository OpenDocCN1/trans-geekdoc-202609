    # 6. Conclusions


    The proposed method allows for multiple constraints optimal trajectory planning
    using the improved genetic algorithm (GA) and A* algorithm. The conclusions of
    this research work are: (1) The numerical results of the experiment proved that
    the improved genetic algorithm (GA) and A* algorithm are good for optimal trajectory
    planning. (2) All essential constraints like the correction and turning radius
    of a UAV are satisfied with all solutions obtained from the trajectory planning
    algorithm.


    Future work should take into account more complex and realistic constraints, such
    as threats to the ground or in the air, the avoidance of obstacles, and other
    constraints of the UAV itself (such as its own battery life), improve the algorithm
    optimization model and objective functions (such as considers flight time [28]),
    and ensure that UAVs are able to adapt to more complex environments.


