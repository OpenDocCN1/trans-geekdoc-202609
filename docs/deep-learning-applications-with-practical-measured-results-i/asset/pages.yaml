    # 2.1. Update Using Occlusion Detection


    Occlusion is one of the most challenging factors in the process of tracking. It
    is unavoidable that information of the occluding background part will be integrated
    into the target model if mere frame-by-frame or fixed-time-interval update is
    adopted, which makes the tracker mistakenly detect the occluding background part
    as the target, thus the bounding box stops at the occluding part [8]. Therefore,
    occlusion detection is required for judging whether the target has been occluded.
    Occlusion comprises of partial occlusion and full occlusion. In the latter case,
    almost all of the pixels in the view are background, which means that the target
    has temporarily disappeared. It is hardly possible to observe the variation of
    the target’s appearance, so target model update is usually stopped when full occlusion
    happens. However, when the target is partial occluded, only a part of it is visible,
    hence part of the pseudo target information can be mixed with the target one in
    the target model if the regular update mode is still used in this case. A special
    update mode should be utilized in the case of partial occlusion.


    There are increasing researches dealing with occlusions in recent year. Although
    it is easy for the tracker to identify whether the target is under full occlusion,
    partial occlusion or no occlusion, in quite a few researches, the update is only
    enabled when there is no occlusion, while it is disabled if partial occlusion
    happens. For instance, several small patches will be drawn within and around the
    bounding box after the target is located in a frame in [9] and the patches are
    classified into three types, where the patches from class #A do not overlap with
    the bounding box at all, while those from class #B overlap with the bounding box
    with higher target response and class #C with lower target response. The target
    is regarded to be occluded if the number of patches from class #C reaches the
    threshold, thus the target model is prohibited. Conventional correlation filter
    model update method is adopted in [10], where the fixed learning rate is used
    for target appearance model update when there is no occlusion; otherwise, the
    appearance model remains unmodified. Similar strategy is utilized in [11]'
