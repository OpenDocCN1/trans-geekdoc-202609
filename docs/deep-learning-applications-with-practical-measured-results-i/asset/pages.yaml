    # 3.2. Update Strategy Based on Dictionary Learning and Sparse Coding


    Dictionary learning (DL) and sparse coding (SC) are common generative frameworks
    of visual tracking. The template set is usually made up of the tracking results
    from each frame, while at the beginning stage of tracking it consists of the positive
    and negative samples drawn in the first frame. Two common ways generates the dictionary
    [38], one of which is through learning methods, i.e., principal component analysis
    (PCA), where the dictionary is acquired by the form of iterative training of samples
    in specific frames, the other is to directly insert the tracking result into the
    template set and then select a subset. The latter method is more popularly adopted
    in the recent year.'
