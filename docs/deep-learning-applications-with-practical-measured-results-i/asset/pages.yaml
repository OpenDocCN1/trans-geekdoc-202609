    The proposed forecasting model combines the independent forecasts of FFNN and
    ANFIS. A schematic representation of the hybrid model is shown in Figure 3. The
    models are trained separately. The training set is used to define the optimal
    model parameters. For instance, for the case of the FFNN the parameters that need
    to be defined are the number of hidden layers, the number of neurons in the hidden
