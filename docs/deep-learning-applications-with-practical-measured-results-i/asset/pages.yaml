    # 4.2. Dataset


    The first step in the development of the intelligent oral evaluation system is
    collecting relevant datasets, including audios and expert comments corresponding
    to audios. The data set affects the accuracy and professionalism of the comments
    generated by the final model. Therefore, the training set and testing set should
    include the objective phonemes of different people, different ages, and different
    environments. The data set was provided by children’s language education institutions
    for this paper and is not publicly available. With the consent of the child’s
    guardian, the oral audio of children 5–6 years old was manually collected. During
    the collection process, the children watch a cartoon video and say their thoughts.
    After the audio collection is complete, the relevant children’s language experts
    are invited to comment accordingly. This dataset is called the children oral audio
    dataset.


    # 4.3. Performance Testing


    The NACM and GNACM proposed in this paper will be an essential model of the oral
    evaluation system. The oral evaluation system is used in enterprise software.
    Application software has particular evaluation indicators. Therefore, NACM and
    GNACM are tested using applied evaluation indicators. The evaluation indicators
    and evaluation results of the model are introduced in detail below in this paper.


    # 4.3.1. Evaluation Metrics


    The evaluation metrics of models include three aspects in this paper. The model
    evaluation metrics are the quality score of model generation comments, the average
    response time, and the scalability. The quality score of the model-generated reports
    will be manually reviewed and scored by language education experts. For the performance
    of the model, we assessment the model from the response time and scalability.


    # 4.3.2. Evaluation Results


    The experiments study two models NACM and GNACM. The dataset used is children
    oral audio dataset. The experimental process is shown in Figure 5. Children 5–6
    years old watch cartoon video and answer questions. The child’s oral audio is
    input into two models, and the models automatically generate comments. During
    the experiment, we assessment the model using the model evaluation metrics proposed
    in Section 4.3.1.


    Relevant language experts evaluate the quality score of the comments generated
    by the models, as shown in Figure 6. The Score represents the score of the generated
    comment graded by human experts. The Expert number of the chart represents the
