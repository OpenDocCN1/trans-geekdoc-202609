  md: 'ought to be given the highest importance. For instance, background samples
    that are drawn near to the target region are used for the dictionary model update
    in [52], which is the spatial constraint of the data sampling in the article,
    in which the temporal constraint is that the samples selected for training should
    be from the latest few frames. This distance constraint is also satisfied in [46]
    by the update of the network model. Of the bag-of-words (features) based tracking
    frameworks, as in [7] and [43], words or features in the surroundings near to
    the target are used to update the context (background) bags when the foreground
    bags are usually updated in parallel, which has been illustrated in detail in
    the third subsection of Module 3. The parameter of intersection over union (IoU)
    is usually used to identify whether the patch that is selected around the target
    is foreground, the patch is regarded as a positive sample when which is above
    a higher threshold, or a negative one if below a lower threshold. In [28] and
    [53], IoU is used to help draw positive and negative samples for network update.
    Samples whose IoU are between the two thresholds are also picked out for network
    retraining in order to increase the robustness of target position and make abundant
    use of visible parts of a tracked target when partial occlusions occur.


    Dense sampling is commonly utilized as for the density of sampling, like some
    particle filter based sampling methods, i.e., [51]. Dense sampling means that
    positive and negative samples are drawn within a length of radius according to
    a given distribution, i.e., Gaussian Distribution, in which there is a large overlap
    between any two of the samples of the same class. The advantage of this kind of
    sampling approach lies in that it not only makes abundant use of the background
    information around the target thus strengthen the discrimination capability of
    the tracker, but it also helps to provide more sufficient source of samples, which
    boosts the robustness of deep networks.


    # 4.2. A Kind of Background Unity Estimation Approach: TBE


    Up to now, most tracking algorithms have concentrated a lot on the construction
    and update of target models, while those of background models have been rarely
    researched. The distribution of the feature of the target’s surrounding area is
    usually irregular, owing to the complexity of the background. Therefore, the requirement
    of accurate target location cannot only be satisfied through simple target matching
    methods. When the target is occluded, its appearance has gotten incomplete that
    available target characters have become less, which makes it hard to distinguish
    from the background. An original method, named Tracking by Background Estimation
    (TBE), is proposed in [12], which includes the approach of background modeling
    and update strategy by which foreground pixels are extracted out for target detection
    and location, to achieve more accurate target location especially in the state
    of partial occlusion.


    TBE is based on the principle of background subtraction, through which the preserved
    area of foreground pixels is used for target detection and location; afterwards,
    the appearance model of the target is learned. Suppose that the entire image f_i
    is composed of a target t_i and a background b_i i.e., f_i = {t_i, b_i}, where
    i is the frame index, and the mask of the background b_i in frame i is identified
    as m_i. All the pixels in the image domain of f_i compose the set P_i. Given a
    pixel x ∈ P_i, if x belongs to the background, there is b_i(x) = f_i(x) and m_i(x)
    = 1; otherwise, b_i(x) = 0 and m_i(x) = 0. To eliminate the influence of background
    illumination, “mean-background” is defined and suppose \tilde{b}_i is the mean-background
    in frame i, the corresponding mask of which is \tilde{m}_i. All of the pixels
    in the image domain of \tilde{b}_i compose the set \tilde{P}_i.


    Assume that the camera is stationary, the background in two adjacent frames is
    completely the same, thus t_i = f_i − b_{i−1}, and the target can be recognized
    by means of the subtraction of the frame images. Yet, in almost all cases, the
    camera is in movement sometimes, which brings about the deformation and scale
    variation of the background. Based on this factor, the warped image in frame i
    is identified as \hat{b}_i, which is transformed from the mean-background in the
    last frame, as in (26)


    \hat{b}_i = H_i * \tilde{b}_{i−1}, (26)'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'where * is the transform operator and H_i is the calculated homography matrix.
    The warped \hat{b}_i from the mean-background in frame i - 1 suits to the background
    in the current frame i, making the background subtraction applicable. Thus, the
    mean-background in frame i is calculated by the weighted sum of \hat{b}_i and
    \hat{b}_{i}, as formulated in (27)


    \tilde{b}_i(x) = w_i^T \bullet (\hat{b}_i(x), b_i(x)), s.t. x \in \tilde{P}_{i-1}
    \cup P_i, \quad (27)


    Some background regions in the previous frame do not appear in the current frame
    and new background regions may appear due to the movement of the background. Besides,
    the target must exist in the shared parts of the background regions, i.e., x if
    x \in t_i; hence, the weight w_i is defined as in (28)


    w_i = \begin{cases} (1,0)^T & x \in \tilde{P}_{i-1} \wedge x \notin P_i \\ (\tilde{m}_i(x),
    m_i(x))^T / (\tilde{m}_i(x) + m_i(x)) & x \in \tilde{P}_{i-1} \cap P_i \\ (0,1)^T
    & x \notin \tilde{P}_{i-1} \wedge x \in P_i \end{cases} \quad (28)


    in which \tilde{m}_i is the warped mask. Subsequently, \tilde{m}_i is calculated
    as in (29)


    \tilde{m}_i(x) = \begin{cases} \hat{m}_i(x), & x \in \tilde{P}_{i-1} \wedge x
    \notin P_i \\ \min[T, m_{i-1}(x) + \hat{m}_i(x)], & x \in \tilde{P}_{i-1} \cap
    P_i \\ m_i(x), & x \notin \tilde{P}_{i-1} \wedge x \in P_i \end{cases} \quad (29)


    where T is the predefined threshold that upper bounds the maximum of m_i(x), ensuring
    the contribution of the latest frame, without which the weight of the mean-background
    might rise to a high value and the weight of the input frame will be negligible.


    An update of the background model is performed after the target is tracked in
    every frame that the parameters \hat{b}_i and \tilde{m}_i are obtained and the
    warping operation is done before target detection in the next frame. Afterwards,
    background subtraction is conducted for the detection and location of the target.


    # 4.3. Occasions of Background Update


    Because variation of the background mainly relies on its movement, though some
    of its features may passively vary with the environment, it must exist in every
    frame, the reliability of it should not be given too much consideration, therefore
    sophisticated discussion regarding the background update occasions is not necessary.
    The background appearance is temporarily stable thanks to the variety of background
    patches and the movement along with the target. Usually, fixed-time-interval background
    update is adopted in SC based and deep neural network based models, and unsupervised
    models, like BoW (or BoF), update the background model along with the target model
    frame-by-frame. Negative samples drawn from the latest frames are used for model
    retraining, which is the guarantee of the requirement of the adaptation of the
    tracker to the newest background features.


    # 4.4. Module Summary


    This module discusses background update strategies and occasions, including a
    new background model update strategy named TBE. Although the update of background
    model seems to be much simpler than that of target model, there are still needs
    of improvements in many respects. The questions remaining about the background
    update are as below. (1) How to utilize the background information that is useful
    for discriminating the target and the surroundings for the extraction of key background
    characters that can help with target location; (2) How to determine the density
    of background patch sampling. Background regions containing much more valuable
    information ought to be more densely sampled to boost the efficiency of the tracker;
    (3) How to build the holistic structure of the background.'
