  md: 'Article


    # Characterization and Correction of the Geometric Errors Using a Confocal Microscope
    for Extended Topography Measurement, Part II: Experimental Study and Uncertainty
    Evaluation


    Chen Wang 1, Emilio Gómez 1 and Yingjie Yu 2,*


    1 Department of Mechanical Engineering, Chemical and Industrial Design, ETS of
    Engineering and Industrial Design, Technical University of Madrid, 28012 Madrid,
    Spain; chen.wang@alumnos.upm.es (C.W.); emilio.gomez@upm.es (E.G.)


    2 Department of precision mechanical engineering, Shanghai University. No.333,
    Nanchen Rd., Shanghai 200444, China


    * Correspondence: yingjiyeu@staff.shu.edu.cn


    Received: 15 September 2019; Accepted: 15 October 2019; Published: 24 October
    2019


    Abstract: This paper presents the experimental implementations of the mathematical
    models and algorithms developed in Part I. Two experiments are carried out. The
    first experiment determines the correction coefficients of the mathematical model.
    The dot grid target is measured, and the measurement data are processed by our
    developed and validated algorithms introduced in Part I. The values of the coefficients
    are indicated and analyzed. Uncertainties are evaluated using the Monte Carlo
    method. The second experiment measures a different area of the dot grid target.
    The measurement results are corrected according to the coefficients determined
    in the first experiment. The mean residual between the measured points and their
    corresponding certified values reduced 29.6% after the correction. The sum of
    squared errors reduced 47.7%. The methods and the algorithms for raw data processing,
    such as data partition, fittings of dots’ centers, K-means clustering, etc., are
    the same for the two experiments. The experimental results demonstrate that our
    method for the correction of the errors produced by the movement of the lateral
    stage of a confocal microscope is meaningful and practicable.


    Keywords: geometric errors; rigid body kinematics; lateral stage errors; imaging
    confocal microscope; MCM uncertainty evaluation; dot grid target


    # 1. Introduction


    The increasing demands for manufacturing accuracies and quality control due to
    the rapid development of nanotechnology, ultraprecision machining, micro-, and
    nanofabrications, etc. [1,2] and the requirements for precision in surface finishing
    in different technologies such as additive manufacturing [3], mechanical parts
    with structured surfaces [4], etc., require the use of increasingly sophisticated
    measurement systems and measurement traceability from a metrological point of
    view.


    Calibration provides a wide range of information about microscope performances.
    The ever-increasing demand for improved surface quality and tighter geometric
    tolerances has led to augmentations in the investigations of manufacturing technologies
    [5]. Measurements using optical microscopes are often affected by common path
    noise, disturbance in light source and ambient lighting, etc., which cause measurement
    defects and outliers [6,7], as well as attract investigations on noisy data processing
    [8]. The need for standardization is becoming ever greater as the range of capturing
    three-dimensional (3D) information of microscope techniques continues to increase
    [5,9]. For optical confocal microscopes, the Z-calibrations at nm levels are typically
    good, while the X- and'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'Y-accuracies are often left, without further notice than resolution limits
    of the optics [10,11]. Among the investigations of lateral calibrations, many
    studies focus on the optical system [12]. For example, H. Ni et al. proposed a
    new method to achieve structured detection using a spatial light modulator, which
    modulates the Airy disk amplitude distribution according to the detection function
    in the collection arm [13] and B. Wang et al. presented confocal microscopy with
    structured detection in a coherent imaging process to achieve a higher resolution
    with a comparably large pinhole [14], however, the systematic geometric errors
    which adversely affect the relative position and orientation between measuring
    probes and measurands are usually neglected [15,16]. B. Daemi et al. designed
    a comprehensive verification test by using a high precision metrology method based
    on subpixel resolution image analysis [17]. The calibration of confocal microscopes
    usually relies on traceable standard artefacts, which are commonly made up of
    regular patterns [10].


    This paper describes the experimental studies based on the kinematic modeling
    and algorithms for the correction of the geometric errors developed in Part I
    [18]. Sections 2 and 3 introduce the methodologies for experiments and uncertainty
    evaluation individually. Section 4 presents the experiment on a dot grid target
    for correction coefficients determination and their corresponding uncertainty
    evaluation. Section 5 implements an experiment and corrects the measured data
    with determined coefficients, comparing the residuals with respect to certified
    values before and after corrections. Section 6 presents the conclusions. Following
    Section 6, acknowledgements and references are included.


    # 2. Methodology for the Experimental Study


    The purposes of this experimental study were to, first, determine the error correction
    coefficients, i.e., defined in the kinematic geometric error correction model
    developed in Part I [18] and, secondly, apply the determined parameters of coefficients
    and the correction mathematical model for new measurement data calibration. The
    dot grid target standard artefact was implemented as the measurand of the experiments.
    By comparing the residuals of measured points and corrected points with respect
    to the certified values, the practicality and significance of our developed models
    and algorithms for lateral stage error calibration were observed.


    Two experiments were carried out with our imaging confocal microscope, which is
    a Leica Confocal Dual Core 3D Measuring Microscope (Leica DCM-3D), at the “Laboratorio
    de Investigación de Materiales de Interés Tecnológico” (LIMIT) of the Technical
    University of Madrid. The first experiment measured the dot grid target standard
    for the determination of the correction coefficients. The second experiment measured
    another area of the dot grid standard, processing the measurement data with the
    same developed and validated algorithms implemented in the first experiment. The
    purpose of this experiment was to observe whether the corrected data improved
    as compared with the raw measurement data. Because the second experiment used
    the same measurement parameters, data processing algorithms, and procedures, and
    measured a different area of the same dot grid standard, this comparison is important
    as other factors, which might influence the results, could be excluded majorly,
    such as the uncertainties or inaccuracies generated by algorithms of cylinder
    separation, center fitting, and movement scope of the lateral stage, etc.


    # 3. Methodology and Procedures for Uncertainty Estimation


    A statement of measurement is complete only if it provides an estimate of the
    quantity concerned, as well as a quantitative evaluation of the estimate’s reliability,
    i.e., the associated uncertainty [18]. Accompany measurement results by quantitative
    statements about their accuracy is very important particularly when the result
    are part of a measurement chain tracking back to national standards or when decisions
    about product specifications are taken [19].


    The document issued by BIPM, Guide to the Expression of Uncertainty in Measurement
    (GUM) [20] provides a method and procedure for the evaluation and expression of
    measurement uncertainties [21]. This method is termed the GUM uncertainty framework
    in supplement 1 and supplement 2 (GUM-S1'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'and GUM-S2 [22,23] and other bibliographies [19,24]. The GUM uncertainty framework
    has two main limitations [2,25]. The first limitation is the lack of generality
    of the procedure to obtain an interval to contain the values of the measurand
    with a stipulated coverage probability [25]. In the GUM uncertainty framework,
    the way a coverage interval is constructed to contain values of the measurand
    with a stipulated coverage probability is approximate [22]. The second limitation
    is that insufficient guidance is given for the multivariate case in which there
    is more than one measurand, namely, more than one output quantity [22,25]. In
    order to address these limitations, Working Group 1 of the Joint Committee for
    Guides in Metrology (JCGM) has produced two specific guidance documents, namely
    GUM-S1 and GUM-S2 [23,24], on the Monte Carlo method (MCM) for uncertainty evaluation
    and extensions to any number of measurands (output quantity), respectively [22].


    The MCM provides a general approach to obtain a numerical representation G of
    the distribution function GY(η) for Y. The heart of the approach is making repeated
    draws from the probability density functions (PDFs) for the input variables Xi
    (or joint PDF for X) and the evaluation of the output quantity. Assignment of
    the PDFs for the input variables is dependent on each experiment. The same case
    applies to the evaluation of the output quantity. The distribution function GY(η)
    encodes all information known about the output quantity Y. Properties of Y can
    be approximated using GY(η). The quality of G depends on the number of draws made.
    The symbol y represent the output measurement results. It is determined by the
    input measurement results xi:


    y = f(x1, ..., xN) (1)


    The relationship between the PDF of output measurement results and input measurement
    results is:


    gY(η) = ∫ gX1,...,XN(ξ1, ..., ξN) × δ[η − f(ξ1, ..., ξN)] dξ1 ... dξN (2)


    where η denotes possible values that can be distributed to Y, δ[·] denotes the
    Dirac delta function.


    Figure 1 provides an illustration of the propagation of distributions for input
    and output quantities. The expectation of the output quantities can be obtained
    by its PDF gY(η) as:


    E(Yi) = ∫_{-∞}^{∞} ηi gYi(ηi) dηi (3)


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_173_0.png)


    Figure 1. Illustration of the propagation of distributions for input quantities
    and the obtained output quantities [19].


    The variance of the output quantities can be obtained by its PDF gY(η) as:


    V(Yi) = ∫_{-∞}^{∞} [ηi − E(Yi)]² gYi(ηi) dηi (4)'
