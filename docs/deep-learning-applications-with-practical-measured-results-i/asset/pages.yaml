    Among the types of data inputs, Case#5 leads to considerably lower errors indicating
    the benefit of transforming the volatile wind data into the wavelet domain. This
    is evident in all measures and especially in MARNE. Considering the MAE indicator,
    Case#2 leads to better predictions if the latter is held with FFNN or the hybrid
    model. On the contrary, the data of Case#1, i.e., using only wind speed values
    is more suitable for ANFIS. Using wind speed, temperature, and wind direction
    as inputs, the prediction is less credible. This implies again for FFNN and the
