  md: '# 4.1.2. Calculation Formula for Evaluation of Foreign Object Indicator


    The foreign object indicator performance index based on the target detection algorithm
    is the recall rate and accuracy rate, where TP + FN = 126. AveragePrecision(AP)
    is the integral of the PR-curve, which is the area under the curve (8)–(10):


    $$Precision = \frac{TP}{TP + FP}\tag{8}$$ $$Recall = \frac{TP}{TP + FN}\tag{9}$$
    $$Average\ Precision = \int_{0}^{1} Precision(Recall)\,dRecall.\tag{10}$$


