    # 5.2. Qualitative Advantage Analysis of Some Trackers'' Performance on Typical
    Sequences


    To evaluate the quality of a tracker, its performances under those challenging
    situations, such as occlusion, in-plane or out-of-plane rotation, etc., are usually
    the accordance, which essentially depends on the quality of the model update strategy.
    This subsection gives analysis on specific cases where the performances as well
    as advantage analysis of the recent trackers under the factors of occlusion, background
    interference, rotation, scale variation, and deformation are respectively illustrated.


    (1) Occlusion: Occlusion is a hard problem that almost occurs in all sequences,
    the update strategy under which situation measures the robustness of a tracker
    to a maximum degree. In sequences of Jogging-1 and Subway, the walkers are respectively
    occluded by the telephone pole and other passers-by, only the tracker in TPS [14]
    and the benchmarks of TGP, SCM, and KCF are able to stably track them, which explains
    that updating in local patterns has provided assistance in tracking partial occluded
    objects via visible parts. Local feature representation is adopted in [54], where
    the global feature pattern is fused with local ones to represent the tracked object.
    In the sequence of Walking when the walking woman reappears after occluded by
    the man, the tracker in [54] can successfully recapture the woman, while the compared
    benchmarks, like OAB, MIL, and COM, fail to retrack it. The local-patterned update
    is also adopted by L3SCM [24], which has gained better performances than the compared
    benchmarks. SC based LSA [17] shows strong robustness in handling occlusion thanks
    to the use of stable patches and valid ones for update. In the sequence of Jogging2,
    after the occlusion of the walker by the telephone pole, the compared KCF and
    DSST fail to cope with the drift problem. Different template patches are used
    to represent the tracked object by NMC [42], whereas the distribution of foreground
    and background templates is used for the detection of occlusion, which shows its
    superiority in occlusion handling in Suv and Jogging2.


    Utilization of background models is the key of correct target localization. The
    target is completely occluded in the frames #27 to #36 of Uav, thanks to the constant
    utilization of background model in TBE [12], the appearance of the target is preserved
    before the start of its full occlusion; therefore, it is able to be retracked
    after it reappears, while other compared trackers fail to re-detect it. In the
    sequence of Thuys, the characters of the surrounding is similar to that of the
    target, still only the proposed TBE can correctly track it while drifts to the
    surroundings occur when using other compared trackers. These cases have given
    us the inspiration that the background model is typically essential in dealing
    with occlusions. Bag-of-feature based ALIEN [7] effectively prohibits the drift
    problem in the sequence of FaceOCC1 due to the use of the background characters.
    The background information in the tracking bounding box are used to describe the
    reliability of the tracking result in [40], thus the target model update is prevented
    if there is too much background information, so for the sequences where there
    are partial occlusions, i.e., Coke, Girl, Lemming and Tiger1, the tracker performs
    well.


    Valuable use of positive training samples plays an essential role in dealing with
    target re-detection. In frame #131 of Girl2, where the man’s head moves away and
    the girl’s head return visible, DSARC F [56] is able to perfectly retrack the
    girl’s head while other trackers fail, due to the reliability check of target
    training samples that are used for the spatial weight update; PMC [59] also performs
    well on'
