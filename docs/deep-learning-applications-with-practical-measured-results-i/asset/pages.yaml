  md: '# 5. Validation of the Algorithms with Synthetic Data


    # 5.1. Validation of the Algorithm for Determination of Dots'' Centers and Distance


    To validate the algorithm for determination of dots'' centers, synthetic data
    with known cylinder centers and point cloud distributions is generated. This generated
    data contains 35 cylinders of point cloud, distributed as 5 × 7 along the X-axis
    and Y-axis, as shown in Figure 11.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_161_0.png)


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_161_1.png)


    Figure 11. Plot of the created data for algorithm validation: (a) 3D view of the
    point cloud; (b) view from the Z-axis.


    For each point cloud, the radius of the cylinder is 31.25 μm, with a uniform distribution
    of r ~ U (−0.1, 0.1) μm. The values of the Z-coordinate of each point follows
    a standard normal distribution z ~ N (0, 1) μm. The centers of each cylinder,
    as indicated by red asterisks in Figure 11b, have an interval of 125 μm. Their
    X-coordinates are [0, 125, 250, 375, 500] μm and the Y-coordinates are [0, 125,
    250, 375, 500, 625, 750] μm. The generated data contains X-, Y-, and Z-coordinates''
    values. Those data are saved in a Matlab® file with the suffix name ‘.mat’ for
    processing.


    The generated data are processed using our developed algorithm for the determination
    of dots'' centers. The first step is to separate the data into individual point
    clouds. The results of the point cloud separation are shown in Figure 12, with
    each individual being indicated by numbers and different colors. In this step,
    the algorithm not only separates the point cloud into individuals, but also gives
    an indication of the initial centroids of each cloud.'
