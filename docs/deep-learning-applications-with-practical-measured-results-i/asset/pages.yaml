  md: '# 3.2. Loss Function


    Inspired by Iizuka [11], this paper uses L1 loss while attaching the loss of WGAN-GP
    [31] to the global and local output of the second-stage network, so as to enhance
    the consistency between the global and local. The original WGAN used the Wasserstein
    distance W(P_r, P_g) to compare the distribution differences between the generated
    data and the actual data. Wasserstein is defined as follows:


    $W(P_r, P_g) = \inf_{Y \in \Pi(P_r, P_g)} E_{(x,y) \sim Y} [\|x - y\|]$ (1)


    Of which, Π(P_r, P_g) is the set of all possible joint distributions combined
    by P_r and P_g. For each possible joint distribution Y, we can sample (x, y) ~
    Y from it to get a real sample x and a generated sample y. Then we calculate the
    distance ||x − y|| between the samples. Finally, we calculate the expected value
    E of the distance between sample pairs in the joint distribution Y. On this basis,
    the objective function based on WGAN is established:


    $\min_G \max_{D \in \mathcal{D}} E_{x \sim P_r}[D(x)] - E_{\tilde{x} \sim P_g}[D(\tilde{x})]$
    (2)


    where, $\mathcal{D}$ is a set of 1-Lipschitz functions, $P_g$ is the model distribution
    implicitly defined by $\tilde{x} = G(z)$, and z is the input of the generator.
    In order to realize the Lipschitz continuity condition, the original WGAN clip
    the updated parameter of the discriminator to a smaller interval [−c, c], so the
    parameter gathers at two points of −c and c, which limits the fitting ability
    to some extent.


    WGAN-GP has improved on the basis of WGAN, replacing weight clipping with gradient
    penalty: $\lambda E_{\tilde{x} \sim p_{\tilde{x}}}[ (\|\nabla_{\tilde{x}} D(\tilde{x})\|_2
    - 1)^2 ]$. WGAN-GP uses the penalty limits the value of gradient.


    For image inpainting, we only try to predict region A need repaired, therefore
    gradient penalty should only be applied to pixels in region A. We can achieve
    it by gradient multiplication and mask m. Format is as follows:


    $\lambda E_{\tilde{x} \sim p_{\tilde{x}}}[ (\|\nabla_{\tilde{x}} D(\tilde{x})
    \odot (1 - m)\|_2 - 1)^2 ]$ (3)


    where, the mask value is 0 for missing pixels and 1 for pixels at other locations.
    λ is set to 10 at all LABS.


    The improvement also addresses the problem of the disappearance of training gradient
    and gradient explosion. Moreover, it has a faster convergence speed in deep learning
    than the original WGAN. It can also generate higher quality images and reduce
    the time of parameter adjustment in the training process.


    # 3.3. Generation of Mask Data Sets


    In WeChat or other social networks, some photos of scenic spots with a comfortable
    and clean background are shared by tourists. However, there will be more redundant
    pedestrians in background destroying the beauty and artistic conception of the
    images, especially in popular tourist resorts. So we propose an image inpainting
    task of retaining the target character in the image while filtering out the redundant
    pedestrians in background. In order to complete the image inpainting task described
    above, we construct the relevant mask dataset of image inpainting, which must
    contain various pose to produce a better inpainting result on the character filter
    task. This paper uses the COCO dataset to construct the mask dataset, which is
    a large and rich dataset of object detection, segmentation, and caption. The dataset
    includes 91 types of targets, which contains more than 30,000 images of human,
    mainly from the complex daily scenes to meet the needs of various pose.


    We select images with multiple pedestrians in COCO dataset to construct the irregular
    mask dataset. As shown in Figure 3, first we take the picture C through the Mask-R-CNN
    network to find all the people in the image. Mask-R-CNN is a general instance
    segmentation framework, which can not only find all the target objects in the
    image but also accurately segment them. We could segment them'
