  md: '# About the Special Issue Editors


    Mong Fong Horng received his Ph.D. degrees from the Computer Sciences and Information
    Engineering Department, National Cheng Kung University, Taiwan in 2003. He now
    is a professor with the department of Electronic Engineering at the National Kaohsiung
    University of Science and Technology and Kaohsiung Medical University, Taiwan.
    He is also a technical director of the Institute of Information Industrial. As
    of 2018, Dr. Horng had published 132 academic papers and 6 textbooks about his
    research. Based on the researches, Prof. Horng has been granted 14 Taiwan patents
    and 2 U.S. patents. He serves as a member of IEEE SMC Technical Committee on Computational
    Collective Intelligence, the president of the Taiwanese Association of Consumer
    Electronics (TACE) and Tainan Chapter, Signal Processing Society, IEEE. Dr. Horng
    contributed to the editorial boards of International Journal of Knowledge Engineering
    and Soft Data Paradigms published by Elsevier. Dr. Horng has received awards from
    the Ministry of Science and Technology and Ministry of Education due to his outstanding
    performance in industrial cooperation and supervision of student competition.
    Dr. Horng has hosted 12 research projects funded by the Ministry of Science and
    Technology, and a Special Issue of the Journal of Innovative Computing, Information
    and Control in 2011. His research interests include computational intelligence,
    the Internet of Things, network function virtualization, and the Internet.


    Hsu-Yang Kung received his Ph.D. degree in Computer Science and Information Engineering
    from National Cheng-Kung University, Taiwan, ROC. He is currently a distinguished
    professor in the Department of Management Information Systems, National Pingtung
    University of Science and Technology, Taiwan, ROC. Prof. Kung has published around
    300 academic papers and received 14 best paper awards. He received the special
    talent award 8 times and the excellent team award 8 times in the Open Software
    Development Project Plan from the Ministry of Science and Technology. He received
    the outstanding performance and special contributions award in the Innovative
    Talents Promotion Program for the Communication Software from the Ministry of
    Education. He has led more than 100 industrial and academic research projects
    and owns 26 patents. He also served as a Guest Editor for the journals of Agronomy,
    Electronics, Mathematical Problems in Engineering, Journal of Electrical and Computer
    Engineering, Advances in Multimedia, and IEEE Technology and Engineering Education.
    His research interests include IoT middleware, cloud computing, wireless and mobile
    communications, and intelligent IoT applications in precision agriculture.


    Chi-Hua Chen is a distinguished professor at Fuzhou University and a chair professor
    at Dalian Maritime University. He received his Ph.D. degree from National Chiao
    Tung University (NCTU) in 2013. He has served as an assistant professor for the
    National Tsing Hua University, NCTU, National Taipei University, and National
    Kaohsiung University of Science and Technology. He has served as a research fellow
    for the Telecommunication Laboratories of Chunghwa Telecom Co. Ltd. He has published
    over 230 academic articles and owns 50 patents. Some of these academic articles
    were published in IEEE Internet of Things Journal, IEICE Transactions, etc. He
    has hosted several projects that were funded by the National Natural Science Foundation
    of China, Fujian Province, etc. He serves as an editor for several SCI-indexed
    journals (e.g., IEEE Access, Biosensors, EURASIP Journal on Wireless Communications
    and Networking, International Journal of Distributed Sensor Networks, Discrete
    Dynamics in Nature and Society, Mathematical Problems in Engineering, etc.).'
