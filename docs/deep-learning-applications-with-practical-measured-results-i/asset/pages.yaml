  md: 'attached. For our Imaging CM, the probe is attached to the Z-stage. Therefore,
    it is obvious that the translation of the X and Y carriage, with an offset of
    the position $\vec{P}$, stops at the same point reached by the translation of
    the Z carriage with a probe offset $\vec{T}$, which can be understood as the focus
    of the probe with the measurand. According to this conclusion, a diagram of the
    axis chain vector of 3D imaging microscopy is plotted and shown in Figure 1b.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_152_0.png)


    Figure 1. Manifestation of the vectors in 3D Imaging CM: (a) 3D view; (b) diagram
    of the axis chain vector.


    As shown in Figure 1b, there are two kinematical paths from the coordinate origin
    O(0,0,0) to the laser beam focus, i.e., $\vec{Z} \rightarrow \vec{T}$ and $\vec{X}
    \rightarrow \vec{Y} \rightarrow \vec{P}$. In each kinematical path, the actual
    movement of that axis is affected by the rotational error of its predecessors.
    The movement of $\vec{T}$ is affected by the rotational error of the movement
    of $\vec{Z}$. $\vec{Y}$ is affected by the rotational error of $\vec{X}$. $\vec{P}$
    is affected by the rotational errors of $\vec{X}$ and $\vec{Y}$. Therefore, the
    chain vector shown in Figure 1b for the two kinematical paths, from the same origin
    reaching the same laser beam focus, can be expressed by Equation (1).


    $$\vec{Z} + \mathbf{R}^{-1}(Z)\vec{T} = \vec{X} + \mathbf{R}^{-1}(X)\vec{Y} +
    \mathbf{R}^{-1}(X)\mathbf{R}^{-1}(Y)\vec{P}\tag{1}$$


    After rearrangement of the above equation, vector $\vec{P}$ can be expressed by
    all the other vectors and matrices, as the same result presented by G. Zhang et
    al. [1].


    The rotation can be expressed by the infinitesimal rotation matrix. The vectors
    $\vec{X}$, $\vec{Y}$, $\vec{Z}$ and $\vec{T}$ can be substituted by their position
    matrix. This has been widely accepted and implemented by many former investigators
    [1,15,27,30].


    In the 3D Imaging CM, there are no real X- and Y-carriages, the workpiece is carried
    by a lateral stage mounted on a fixed base [13,27], the Z-stage is mounted on
    another fixed base. In addition to that, the beam focus is considered to be the
    probe. As the focus is always on the workpiece surface and the information is
    acquired exactly at that point, there is no Abbe offset on x, y and z, nor is
    there an angular term. This means $\vec{T}=0$ and $\mathbf{R}(Z)=0$.


    In this work, only geometric errors along the X- and Y-directions are studied.
    After dropping out the Z-stage variables, the geometric error functions for X-
    and Y-stage are:


    $$P_x = x + \delta_x(x) + \delta_x(y) - y \cdot \sigma_z(y)\tag{2}$$'
