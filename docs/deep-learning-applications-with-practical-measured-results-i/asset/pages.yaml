    From a sales perspective, 12% of products in all carts were selected directly
    from the recommendation items. Oddly, this is exactly the same proportion as the
    one of the recommending interface fixation time to task completion time, which
    shows the importance of focusing attention on recommended items. Vertical RC layout
    was responsible for 62% of product selections, while the others were due to the
    horizontal RC layout—the vertical layout turned out to be almost twice as effective
    as the other. This may be related to banner blindness, where banners have historically
    often been placed in the very same area of a website as horizontal recommendations
    in the experiment. In the case of the vertical layout, for RC with all RCi at
    the standard intensity level (VI1), the recommendation-driven purchases (RDPs)
    were evenly distributed among the recommended products. In the case of RC with
    RC2 at the flickering intensity level (VI2), the item attracted four out of nine
    RDPs in the product category; in the case of RC with RC3 on a red background (VI3),
    the item surprisingly attracted only one out of eight RDPs in the product category.
    On the whole, RC2 was the most effective, which means that the second recommendation
    on the vertical list brought the most sales (48% of RDP’s for vertical'
