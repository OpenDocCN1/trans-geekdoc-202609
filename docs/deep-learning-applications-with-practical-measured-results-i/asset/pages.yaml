    # Abstract:


    Oral evaluation is one of the most critical processes in children’s language learning.
    Traditionally, the Scoring Rubric is widely used in oral evaluation for providing
    a ranking score by assessing word accuracy, phoneme accuracy, fluency, and accent
    position of a tester. In recent years, by the emerging demands of the market,
    oral evaluation requires not only providing a single score from pronunciation
    but also in-depth, meaning comments based on content, context, logic, and understanding.
    However, the Scoring Rubric requires massive human work (oral evaluation experts)
    to provide such deep meaning comments. It is considered uneconomical and inefficient
    in the current market. Therefore, this paper proposes an automated expert comment
    generation approach for oral evaluation. The approach first extracts the oral
    features from the children’s audio as well as the text features from the corresponding
    expert comments. Then, a Gated Recurrent Unit (GRU) is applied to encode the oral
    features into the model. Afterwards, a Long Short-Term Memory (LSTM) model is
    applied to train the mappings between oral features and text features and generate
    expert comments for the new coming oral audio. Finally, a Generative Adversarial
    Network (GAN) is combined to improve the quality of the generated comments. It
    generates pseudo-comments to train the discriminator to recognize the human-like
    comments. The proposed approach is evaluated in a real-world audio dataset (children
    oral audio) collected by our collaborative company. The proposed approach is also
    integrated into a commercial application to generate expert comments for children’s
    oral evaluation. The experimental results and the lessons learned from real-world
    applications show that the proposed approach is effective for providing meaningful
    comments for oral evaluation.


    # Keywords:


    oral evaluation; generative adversarial network; neural audio caption; gated recurrent
    unit; long short-term memory


    # 1. Introduction


    Oral evaluation is a language-testing process, which includes pronunciation accuracy,
    fluency, integrity, logical ability, understanding ability and so on. Among them,
    the evaluation of logical ability and understanding ability generally requires
    more personalized expert comments, rather than a single score. Oral evaluation
    plays an important role in the process of language learning. Now there are some
    products and standards available in the market for oral evaluation [1–3]. However,
    most of these approaches are based on the Scoring Rubric [4] that only focuses
    on the pronunciation characteristics but ignoring the semantic characteristics,
    such as context, content, logic, or understanding, of the oral expression. It
    leads to current oral evaluation that can only provide a single ranking score
    [2]. It cannot provide meaningful comments for the oral evaluation. In order to
    improve the quality of the oral evaluation, some companies thus hire massive experts
    to generate comments for the evaluation manually. However, it is expensive and
    inefficient that not all companies could bear it. Therefore, automated comment
    generation in oral evaluation becomes the emerging demand that markets are'
