    More detailed calculations include:


    ```

    X(kf1) = DFT [x(nTs)] = \sum_{n=0}^{N-1} X(nTs) e^{-j(2\pi/N)nk},  (17)


    f1 = 1/T1'',  (18)


    Ts = T1/N'',  (19)

    ```


    where T1 is signal time, f1 is the frequency interval, N is the number of signal
    sampling, and Ts is the signal sampling interval time.


