    pmvincent@vit.ac.in (D.R.V.); deepa.rajesh@vit.ac.in (N.D.)

    - 3 Centre for Disaster Mitigation and Management, Vellore Institute of Technology
    (VIT), Vellore, Tamil Nadu 632 014, India; seismogans@yahoo.com

    - * Correspondence: chuanyu@yuntech.edu.tw


    Received: 18 November 2019; Accepted: 25 December 2019; Published: 28 December
    2019


    **Abstract:** In recent times, the application of enabling technologies such as
    digital shearography combined with deep learning approaches in the smart quality
    assessment of tires, which leads to intelligent tire manufacturing practices with
    automated defects detection. Digital shearography is a prominent approach that
    can be employed for identifying the defects in tires, usually not visible to human
    eyes. In this research, the bubble defects in tire shearography images are detected
    using a unique ensemble hybrid amalgamation of the convolutional neural networks/ConvNets
    with high-performance Faster Region-based convolutional neural networks. It can
    be noticed that the routine of region-proposal generation along with object detection
    is accomplished using the ConvNets. Primarily, the sliding window based ConvNets
    are utilized in the proposed model for dividing the input shearography images
    into regions, in order to identify the bubble defects. Subsequently, this is followed
    by implementing the Faster Region-based ConvNets for identifying the bubble defects
    in the tire shearography images and further, it also helps to minimize the false-positive
    ratio (sometimes referred to as the false alarm ratio). Moreover, it is evident
    from the experimental results that the proposed hybrid model offers a cent percent
    detection of bubble defects in the tire shearography images. Also, it can be witnessed
    that the false-positive ratio gets minimized to 18 percent.


    **Keywords:** intelligent tire manufacturing; digital shearography; faster region-based
    CNN; tire bubble defects; tire quality assessment


    # 1. Introduction


    Industry 4.0 is the novel digital technology meant for industries, and this paradigm
    enables the communication, collection, and analysis of data through machines,
    thereby allowing quicker, more agile, and efficient processes for making superior
    quality goods with minimal expenditure. Moreover, this digital industrial technology
    will assist in enhancing productivity, enabling industrial development, and revamping
    the profile of the personnel involved, thereby nurturing changes in the competence
    of business organizations and states. Further, this paradigm will foster superior
    efficiencies and will modify the conventional production associations between
    the suppliers, manufacturers, and clients and also the communication amongst humans
    and machines. Besides, due to the phenomenal growth in technology and agile expansion
    of Industry 4.0, several manufacturing firms have embraced automation, thereby
    replacing labor-intensive tasks in conventional production units [1]. Also, it
    can be observed that enabling technologies for smart tire quality assessment for
    realizing intelligent'
