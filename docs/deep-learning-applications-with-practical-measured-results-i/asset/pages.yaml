  md: '# Article


    # High-Resolution Image Inpainting Based on Multi-Scale Neural Network


    Tingzhu Sun 1,2, Weidong Fang 3, Wei Chen 1,2,4,*, Yanxin Yao 5, Fangming Bi 1,2
    and Baolei Wu 1,2


    +   - 1 School of Computer Science and Technology, China University of Mining
    Technology, Xuzhou 221000, Jiangsu, China; stz0526@163.com (T.S.); bfm@cumt.edu.cn
    (F.B.); blwu@cumt.edu.cn (B.W.)

    - 2 Mine Digitization Engineering Research Center of the Ministry of Education,
    China University of Mining and Technology, Xuzhou 221116, Jiangsu, China

    - 3 Key Laboratory of Wireless Sensor Network & Communication, Shanghai Institute
    of Micro-system and Information Technology, Chinese Academy of Sciences, Shanghai
    201800, China; weidong.fang@mail.sim.ac.cn

    - 4 School of Earth and Space Sciences, Peking University, Beijing 100871, China

    - 5 School of Communication and Information Engineering, Beijing Information Science
    & Technology University, Beijing 100101, China; yanxin_buaa@126.com

    - * Correspondence: chenwdavior@163.com; Tel.: +86-1392-176-1978


    Received: 10 October 2019; Accepted: 15 November 2019; Published: 19 November
    2019


    **Abstract:** Although image inpainting based on the generated adversarial network
    (GAN) has made great breakthroughs in accuracy and speed in recent years, they
    can only process low-resolution images because of memory limitations and difficulty
    in training. For high-resolution images, the inpainted regions become blurred
    and the unpleasant boundaries become visible. Based on the current advanced image
    generation network, we proposed a novel high-resolution image inpainting method
    based on multi-scale neural network. This method is a two-stage network including
    content reconstruction and texture detail restoration. After holding the visually
    believable fuzzy texture, we further restore the finer details to produce a smoother,
    clearer, and more coherent inpainting result. Then we propose a special application
    scene of image inpainting, that is, to delete the redundant pedestrians in the
    image and ensure the reality of background restoration. It involves pedestrian
    detection, identifying redundant pedestrians and filling in them with the seemingly
    correct content. To improve the accuracy of image inpainting in the application
    scene, we proposed a new mask dataset, which collected the characters in COCO
    dataset as a mask. Finally, we evaluated our method on COCO and VOC dataset. the
    experimental results show that our method can produce clearer and more coherent
    inpainting results, especially for high-resolution images, and the proposed mask
    dataset can produce better inpainting results in the special application scene.


    **Keywords:** image inpainting; content reconstruction; instance segmentation


    # 1. Introduction


    Every day, about 300 million pictures are captured and shared on social networks,
    and a large part of them are human-centered pictures (including selfies, street
    photos, travel photos, etc.). Many human-related research directions have been
    produced in computer vision and machine learning in recent years. Among them,
    target tracking [1] (including pedestrian detection [2], pedestrian reidentification
    [3], human pose estimation [4], etc.), face recognition [5], and face image inpainting
    (including pet eye fix [6], eye-closing to eye-opening [7], etc.) are the research
    hotspots. Many researchers devote themselves in improving the performance of the
    existing network. However, integrating existing researches and enabling them to
    solve common problems in life is also of high practical significance.'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'In our social networks, we can often see street photos as shown on the left
    of Figure 1, but actually, the original images seem as shown on the right side
    of Figure 1. We can see redundant pedestrians in their background destroying beauty
    and artistic conception of the image. So the purpose of our study is to delete
    the redundant pedestrian in the image and ensure the reality of background inpainting.
    It involves pedestrian detection, identifying redundant pedestrians and filling
    in them with the seemingly correct content. This is a challenging problem because
    (1) the result largely depends on the accuracy of redundant pedestrian detection;
    (2) the diversity of background information under the redundant pedestrian area
    is difficult to recover; (3) the training data lacks real output samples to define
    the reconstruction loss. We want to deploy our work in the real world as a working
    application, so we took an interactive approach, removing unnecessary sections
    by manually selecting unnecessary pedestrian areas after pedestrian detection.
    After the user removed the unnecessary parts, our algorithm successfully filled
    the remaining holes with the surrounding background information.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_226_0.png)


    Figure 1. Street photo of the paper’s special application scene. (a) The repaired
    figure, (b) the figure that is not repaired.


    To counter the problems above, we combine the research of instance segmentation,
    image inpainting. Firstly, we need to complete the instance segmentation of human
    which detects the regions existing characters. Then it needs us to identify the
    target character and “protect” the region existing the target character. Finally,
    we use an image inpainting algorithm to repair other regions. To further improve
    the inpainting result of the task, we build a new mask dataset, which collects
    the characters in COCO dataset as a mask, representing various pose. The new mask
    dataset can produce a better inpainting result on character filtering tasks.


    In recent years, deep network has achieved high-quality results in instance segmentation,
    image inpainting, and so on. Instance segmentation is the combination of object
    detection and semantic segmentation. First, it uses an object detection algorithm
    to locate each object in the image with positioning boxes. And then it adapts
    a semantic segmentation algorithm to mark the target objects in different positioning
    boxes to achieve the purpose of instance segmentation. The latest instance segmentation
    is Mask-R-CNN [8], which adds a mask branch of predictive segmentation for each
    region of interest based on Faster-R-CNN [9]. The mask branch only adds a small
    computational overhead but supports rapid systems and quick experiments.


    Image inpainting can be defined as entering an incomplete image and filling in
    the incomplete area with semantically and visually believable content. Since Deepak
    [10] et al. adapts encoder-decoder to complete the inpainting of face images,
    image inpainting has two transformations from dealing'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'with a fixed shape region to dealing with any non-central and irregular region
    [11,12], and from distortion to a smooth and clear inpainting result [13,14].
    Image inpainting based on GAN network has made great progress in recent years,
    but for the high-resolution images, the inpainting results will still appear blurred
    texture and the unpleasant boundaries that are inconsistent with the surrounding
    area. We found SRGAN [15] has proved superiority on restoring finer texture details,
    therefore we put forward a new method based on deep generative model. The methods
    is a two-stage network consisting of content reconstruction and texture detail
    restoration. We further restore the finer texture details inspired by the architecture
    of SRGAN after holding the visually believable fuzzy texture. It can effectively
    solve the problem of structural distortion and texture blur to improve the quality
    of image inpainting.


    In this paper, we propose a high-resolution image inpainting method based on the
    multi-scale neural network and build a new mask dataset for the special application
    scene. The main contributions of this paper are:


    +   (1) Based on the current most advanced image inpainting network, we build
    a texture detail restoration network to restore the details of high-resolution
    images inspired by SRGAN. The experimental results show that our method can generate
    a smoother, clearer and more coherent inpainting result than other methods.


    (2) To remove unnecessary pedestrians from the image, we proposed a new mask dataset,
    which collected various pose and could produce better inpainting results in the
    task of character filtering.


    To train our network, we applied the new mask dataset to simulate the real pedestrian.
    Although we just built the mask dataset to represent the removed pedestrian area,
    we achieved good results in the real-world data.


    The rest is organized as follows. The second part introduces the research status
    of instance segmentation and image inpainting at home and abroad. The third part
    describes the improved image inpainting network, and describes the construction
    of the mask dataset and the special application scene. The fourth part gives the
    experimental results. The fifth part gives the conclusion.


    # 2. Related Works


    In the past ten years, computer vision has made great progress in image processing
    tasks such as classification, target detection, segmentation, and so on. The performance
    of deep network has been greatly improved in these tasks, which lays a foundation
    for the new research difficult problems of image processing and provides support
    for image inpainting in this paper. We briefly review the relevant work in various
    sub-areas related to this article.


    Instance segmentation integrates image classification, image segmentation, and
    target detection in computer vision. The earliest region-based CNN(R-CNN) [16]
    detecting object with a bounding box is to process a certain number of candidate
    object regions on each ROI independently. Faster-R-CNN [9] based on R-CNN improves
    by learning the attention mechanism of Region Proposal Network (RPN). Faster-R-CNN
    is flexible and robust for many later improvements [17–19], and leads the several
    current benchmarks. Li [20] et al. combines the two types of score map [21] and
    the target detection [22] to realize “full convolution instance segmentation”
    (FCIS). Different from the usual method, which predicts a set of position-sensitive
    channels with full convolution, this method abandons full connected layers for
    the shared subtasks of image segmentation and image classification, making the
    network more lightweight. In addition, no trainable parameters exist in either
    the integrated score map or the result, only the classifier exists. The Mask-R-CNN
    [8] used in the paper adds a mask branch of predictive segmentation to each region
    of interest based on Faster-R-CNN [9]. The mask branch only adds a small computational
    overhead and supports rapid systems and quick experiments.


    Traditional inpainting approaches based on diffusion or patch typically use variational
    algorithms or patch similarity to spread information from background to holes,
    such as [23,24]. One of the most advanced methods for image inpainting at present
    is PatchMatch [25], without the use of deep learning, which fills in holes with
    statistical data of available images through iterated search for the most suitable'
