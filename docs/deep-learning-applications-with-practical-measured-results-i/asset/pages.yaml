    T_i^2=\sum T_i H_{Oi}\end{cases}\tag{7}$$

    ```


    Its matrix form is


    ```

    $$\begin{bmatrix}n & \sum H_{ii} & \sum T_i\\\sum H_{ii} & \sum H_{ii}^2 & \sum
    T_i H_{ii}\\\sum T_i & \sum T_i H_{ii} & \sum T_i^2\end{bmatrix}\begin{bmatrix}\hat{\beta}_0\\\hat{\beta}_1\\\hat{\beta}_2\end{bmatrix}=\begin{bmatrix}\sum
