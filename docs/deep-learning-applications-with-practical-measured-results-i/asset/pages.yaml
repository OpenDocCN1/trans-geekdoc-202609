    # 4. Algorithms and Procedures for Measurement Data Processing


    # 4.1. Algorithm and Procedure for the Separation of Flats and Cylinders


    The raw measurement data usually contains defects, outliers, unmeasured points,
    etc. [32]. The measured surface often inclines, as it is impossible to locate
    the measurand surface perfectly perpendicular to the Z-axis. Figure 3 gives an
    example of the measurement of the dot grid target, implementing an objective of
    magnification 50×, numerical aperture of 0.90. The acquisition parameter of measurement
    area was defined as the topography stitching measurement, with 8 × 8 extended
    topographies, covering an area of 1.78 × 1.33 mm². The parameter of the overlapping
    area is 25%, and the correlation takes the XYZ option. The level of resolution
    is 2, and the measured extended topographies contain 2673 × 2003 pixels.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_154_0.png)


