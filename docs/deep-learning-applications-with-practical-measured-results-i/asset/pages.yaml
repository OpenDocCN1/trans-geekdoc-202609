  md: '# 7. Conclusions


    In this article, a deep transfer HSI classification method based on information
    measure and optimal neighborhood noise reduction was proposed. In this method,
    the information measure was used to reduce the dimension of the hyperspectral
    image. Then the fusion of the key spectral information and spatial information
    of the hyperspectral image was achieved, and the redundant spectral information
    was processed. On this basis, a classification method based on deep transfer learning
    and neighborhood noise reduction was proposed. The obtained classification accuracy
    for small samples was higher than 98% on average. Compared with the non-transfer
    learning method, the total classification accuracy was improved by at least 3%.
    For the Pavia University dataset with more samples, the classification accuracy
    of above 99% was obtained. The proposed method can both reduce the computational
    complexity to some degree and solve the problem of lower classification accuracy
    caused by insufficient training samples and salt-pepper-noise.


    This method is suitable for HSI classification with insufficient training samples.
    When this situation occurs, we can use labeled samples in similar scenarios to
    train the network initially, and then adjust the network by transfer learning
    and a small number of labeled samples to achieve accurate classification of object
    scenarios. In addition, another advantage of this method is that by dimensionality
    reduction based on information measure, a pseudo-color image of the hyperspectral
    image can be obtained, and the hyperspectral image can be visualized. It is worth
    noting that the core of this method is based on transfer learning, so its limitation
    is that, at first, we need to get good training on a source scene similar to the
    target scene, which requires a sufficient number of training samples in the source
    scene. In the application of constructing a virtual land environment, it is necessary
    to select some typical scenes for common sensors, mark the samples in these typical
    scenes, and train the initial network. When constructing the virtual land environment
    for a specific area in the virtual test, the initial network trained by appropriate
    scene is selected, and then the high accuracy ground truth of the task area can
    be obtained by using the proposed method. In this paper, we make the validation
    by using public datasets. In future work, we will acquire relevant satellite data
    according to the actual task requirements, and use the proposed method to achieve
    high-precision ground feature information in the construction of a virtual land
    environment.


