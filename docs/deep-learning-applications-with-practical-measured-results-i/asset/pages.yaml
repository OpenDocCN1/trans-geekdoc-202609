    # 2.5. Combination of Long and Short Term Update


    For trackers in many researches, the target model is also updated when a sudden
    appearance variation or occlusion occurs in addition to when the scheduled update
    time is up in order to resist drifts that are caused by abrupt target appearance
    changes or partial occlusion brought about from fixed-time-interval update. It
    is called update in combination of long and short terms (LST).


    For the resistance of impacts of scale variation, deformation, and some other
    sudden factors, “semantic segmentation” mechanism is introduced in [26], where
    the correlative parameters of HoG and RGB feature maps between target-based “segmentation
    map” and position-based “tracking map” are respectively calculated. As long as
    the target state suddenly changes, the correlation parameter between the “segmentation
    map” and the hybrid feature map goes higher than that between the “tracking map”
    and the hybrid feature map, thus the “segmentation signal” is comparably more
    reliable than the “tracking signal”. An immediate target model update is needed
    to satisfy the real-time changes in this case. Unlike conventional fixed-time-interval
    update, in this research a frame is regarded as a key frame when the tracking
    result is judged to be reliable, hence the tracking network is updated when the
    number of key frames reaches a certain amount rather than frame of a specific
    index is reached. To avoid erroneous update aroused from occlusion or background
    clutter, a kind of drift and occlusion detection method is proposed in [27], in
    which the target model and dual network model are short-term updated while using
