    # 2.1. Caption Generation Model


    Caption generation model is widely used in visual recognition for image description
    generating [14,15]. In the typical caption generation model, encoder-decoder architecture
    usually applies to generate captions for each feature vector. In the architecture,
    the encoder relies on deep neural networks to encode images, audio, or video to
    generate intermediate vectors. Then, the decoder accepts the intermediate vectors
    as input, perceives the intermediate vectors in turn, outputs the words one by
    one, and finally generates captions [16,17]. Vinyals O, et al. [18] proposed an
    encoder-decoder image caption generation method based on Convolutional Neural
    Network (CNN) [19] and Long Short-Term Memory (LSTM) [20] network. The approach
    extracts image features through a convolutional neural network. It then generates
    the target language through a long short-term memory network, whose objective
    function is the maximum likelihood estimation of the maximum objective description.
    Since the classic Neural Image Caption (NIC) model only accepts images as input
    at the beginning of the LSTM model. As the length of caption grows, LSTM will
    gradually lose the correspondence between caption and image features. Jia X, et
    al. [21] uses semantic information to guide the LSTM to generate descriptions
    at various moments. Here, descriptions indicate image caption. Various moments
    mean each moment of LSTM for words generation. You Q, et al. proposed a novel
    semantic attention model [22], which combines the mechanisms of top-down and bottom-up.
    The model uses responses from intermediate filters of the classification CNN to
    build a global visual description. In addition, the model runs a set of attribute
    detectors to obtain a list of visual attributes or concepts that are most likely
    to appear in the image. The advantage of this semantic attention model is the
    focus on these aspects and the use of global and local information to generate
    better caption. The sequence-to-sequence learning model for generating image captions
    has become popular, but systems for generating audio captions in the speech field
    are indeed rare. Therefore, this paper study the audio caption model to solve
    the problem of audio caption generation.


    # 2.2. Audio Feature Extraction Model


    The capture of audio feature information is closely related to the generated captions.
    Therefore, feature extraction is a crucial step in the caption generation task.
    With the development of deep learning, researchers have proposed a large number
    of acoustic model (AM) methods based on deep neural networks in speech recognition,
    which is generally divided into hybrid acoustic models and end-to-end acoustic
    models. Hinton G, et al. presented a pioneering work that applied deep neural
    networks in speech recognition tasks, and achieved a significant progress [23].
    Alex Graves and Navdeep Jaitly described a system [24]. The system combined a
    deep bidirectional LSTM network structure and a connectionist temporal classification
    (CTC) [25] objective function. When the network is used in combination with the
    baseline system, compared with the training dataset used in the experiment (LDC
    corpus LDC93S6B and LDC94S13B in the Wall Street Journal corpus), the word error
    rate is reduced to 6.7%. Yangyang Shi, et al. proposed a method that replaces
    the traditional projection matrix with a higher-order projection layer [26]. Experimental
    results show that compared with the traditional LSTM-CTC end-to-end speech model,
    a higher-order LSTM-CTC model can bring a 3–10% decline in relative word error
    rate. It can be seen that the field of speech recognition is developing rapidly.
    Audio caption generation requires speech recognition-related technologies for
    speech processing, thereby completing the task of audio feature extraction.'
