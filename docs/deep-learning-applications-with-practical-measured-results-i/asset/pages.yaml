    h₁ₖ = ReLU(Wₖ * X + bₖ),  (7)

    h₂ₖ = ReLU(Wₖ * X + bₖ),  (8)

    hₖ = h₁ₖ + h₂ₖ,  (9)

    ```


    where h₁ₖ is the result of channel 1, h₂ₖ is the result of channel 2, and hₖ is
    result of unit. * stands for a convolutional operation.


    A residual block contains a channel, which passes through a series of conversion
    functions ℱ, and the final output is added to the input X of the block:


    ```

    o = (x + ℱ(x)).  (10)

    ```


    # 3.4.4. Fully Connected Layers


    Fully connected layers can be replaced by global average pooling (GAP) for better
    efficiency and accuracy in image recognition tasks. However, fully connected layers
    are essential in prediction tasks and can easily change the length of the output
    sequence. Formally, a statistic z ∈ R^C is generated by shrinking X through its
    spatial dimensions H × W, such that the output z is calculated by:


    ```

    z = GAP(x_c) = 1/(H × W) Σ_{i=1}^{H} Σ_{j=1}^{W} x_c(i,j).  (11)

    ```


    The whole spatial feature on a channel is averaged as a global feature. Each feature
    map is averaged into one value, thus the local information of the whole feature
    value is lost, which has a negative impact on the prediction problem.


    The full connection layer is shown in Figure 6, which not only establishes the
    position relationship between feature maps, but also retains the internal feature
    information of the same feature map. This will have a beneficial impact on the
    prediction problem. The disadvantage is that the parameters are greatly increased.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_39_0.png)


    Figure 6. Relation between full connection layers and feature maps.


    # 3.4.5. Multi-Head Model


    The model is further extended so that each input variable has a separate sub-model,
    named after a multi-headed model. This sub-model for each input variable has to
    be defined first. Each sub-model learns the information with different features
    in the sequence separately. In addition, the outputs of those models are then
    combined in series to form a very long vector, which is interpreted by some fully
    connected layers before the prediction is made. An overview of multi-head temporal
    convolutional network (M-TCN) architecture is shown in Figure 7. To provide more
    detail, an overview of convolutions is shown in Figure 8.'
