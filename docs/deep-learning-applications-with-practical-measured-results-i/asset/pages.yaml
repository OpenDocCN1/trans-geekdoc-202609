    # 4.4. Application


    The artificial intelligence oral evaluation system is devoted to creating an online
    testing software that enhances human language proficiency. The software is convenient,
    fast, comprehensive, and inexpensive. With the development of computer technology,
    online education has become routine. Therefore, the intelligent oral evaluation
    system we develop has met the needs of human language education and reduced the
    cost of human and material resources. In this section, we will apply NACM and
    GNACM to the oral evaluation system on the market. The NACM is applied to the
    baseline system of the intelligence oral evaluation for children system. The example
    of GNACM is compared with NACM in application software.


    # 4.4.1. Baseline System Based on NACM


    Language education is an essential part of children’s learning and life development.
    The design of the intelligence oral evaluation for children system will provide
    each child with a language-centric education platform with fluent language skills.
    The research and development of this artificial intelligence product is an important
    step to integrate intelligent technology in the field of children’s education.
    The development of the intelligence oral evaluation system provides a solution
    to personalized services for children’s home education and early childhood school
    education. Each child can use the software according to their own needs. Under
    the guidance of parents and teachers, they can test the development level of language
    skills. The system can also provide suggestions for children’s language skills
    development. At the same time, parents and teachers can monitor the progress of
    children’s language skills in real-time.


    This paper proposes an NACM that automatically generates expert comments, which
    is first applied to the intelligence oral evaluation for children system. We apply
    the trained NACM to the “Speaking Practice” section of the intelligent oral evaluation
    for children system. The basic operating environment of the model is as follows.
    The software environment is anaconda3 (based on Python 3.7), PyTorch V1.3.1, cuDNN
    V7.0, and CUDA V10.1. The hardware environment is Intel (R) Core (TM) i7-9700
    CPU @ 3.00 GHz (8 CPUs) 3.0 GHz, NVIDIA GeForce RTX 2070 SUPER 8 GB, 16 GB RAM.
    The system imitates a language expert to assess the user language ability and
    give personalized'
