    # Quality Assessment of Tire Shearography Images via Ensemble Hybrid Faster Region-Based
    ConvNets


    Chuan-Yu Chang 1,*, Kathiravan Srinivasan 2, Wei-Chun Wang 1, Ganapathy Pattukandan
    Ganapathy 3, Durai Raj Vincent 2 and N Deepa 2


    +   - 1 Department of Computer Science and Information Engineering, National Yunlin
    University of Science and Technology, Yunlin 64002, Taiwan; freesky1952@gmail.com

    - 2 School of Information Technology and Engineering, Vellore Institute of Technology
