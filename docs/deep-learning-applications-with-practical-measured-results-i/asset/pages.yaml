    # 2.2. Image Enhancement


    The classification capability and competence of the convolutional neural networks
    rely heavily on the two vital parameters, namely, the quality and quantity of
    the training samples. Nevertheless, the arduous task for this research is the
    identification of speckle patterns encompassing the bubble defects. In order to
    overcome this issue; hence, the blocks from the speckle patters encompassing the
    bubble defects were randomly chosen. Also, the chosen data were rotated horizontally
    and vertically, and then the resultant dataset helps in achieving the essential
    dataset required for the training process. The imperfect bubble blocks were detached
    physically. In this way, this research could achieve about ten times the training
    data. Hence, this approach makes sure that the patterns of the tire bubble defects
    were adequate for the training process.


