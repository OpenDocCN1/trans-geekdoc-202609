    # 4.7. Spectrum Analysis


    In order to further study the performance of the model, we analyzed the spectrum
    of the test set and the prediction data. Spectrum refers to the representation
    of a time domain signal in frequency domain, which can be used for discrete Fourier
    transform of sequence data. Discrete Fourier Transform (DFT) of k points are computed
    as:


    ```

    X(k) = DFT[X(n)] = sum_{n=0}^{N-1} X(n) W^{nk}  (0 ≤ k ≤ N - 1),  (15)


    W = e^{-i(2π/N)},  (16)

    ```'
  merge: -1
  img_proc: true
