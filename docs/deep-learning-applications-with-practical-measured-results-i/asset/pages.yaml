    2019


    Abstract: The global demand for electric power has been greatly increasing because
    of industrial development and the change in people''s daily life. A lot of overhead
    transmission lines have been installed to provide reliable power across long distances.
    Therefore, research on overhead transmission lines inspection is very important
    for preventing sudden wide-area outages. In this paper, we propose an Overhead
    Transmission Line Classifier (OTL-Classifier) based on deep learning techniques
    to classify images returned by future unmanned maintenance drones or robots. In
    the proposed model, a binary classifier based on Inception architecture is incorporated
    with an auxiliary marker algorithm based on ResNet and Faster-RCNN(Faster Regions
    with Convolutional Neural Networks features). The binary classifier defines images
    with foreign objects such as balloons and kites as abnormal class, regardless
    the type, size, and number of the foreign objects in a single image. The auxiliary
    marker algorithm marks foreign objects in abnormal images, in order to provide
    additional help for quick location of hidden foreign objects. Our OTL-Classifier
    model achieves a recall rate of 95% and an error rate of 10.7% in the normal mode,
    and a recall rate of 100% and an error rate of 35.9% in the Warning-Review mode.


    Keywords: smart grid; foreign object; binary classification; convolutional network


    # 1. Introduction


    Nowadays, people''s daily life and industrial facilities are highly dependent
    on electric power. Therefore, research on electric power facilities inspection
    and maintenance is very important for ensuring a stable power supply. A lot of
    overhead transmission lines have been installed to distribute energy across long
    distances in the world. It is meaningful to prevent sudden wide-area outages caused
    by foreign objects suspended on uninsulated overhead transmission lines.


    At present, foreign objects could be detected by foot patrol, piloted helicopter
    patrol, drones inspection, and transmission line robots inspection. Foot patrol
    is risky or unable to pass through complex areas such as highways, rivers, and
    mountains. Helicopter inspection is expensive and also limited by the shortage
    of pilots. Though unmanned drones and specialized robots are still'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'not used in practice for various limitations such as path planning, law, and
    regulations. However, they are still highly considered by the electric power field
    for future maintenance of smart grids.


    The main challenges of using drones for UAV (Unmanned Aerial Vehicles) maintenance
    are automatic pilot, flight time and communication bandwidth. The authors in [1]
    aim at solving automatic transmission line tracking problems. The authors in [2,3]
    face path planning and routing challenges when UAVs are flying along power transmission
    lines. The authors in [4,5] study wireless charging techniques for the increasing
    of drone’s flight time. The authors in [6] focus on UAV communication toward 5G,
    which supports high-speed camera data transmission.


    The PTL (Power Transmission Line, PTL) maintenance robot equipped with cameras
    can walk through transmission line for inspection. It is possible to perform inspection
    and maintenance work at a low cost in the future. Recently, transmission lines
    have been built with bundled conductors because of the increasing power demand.
    However, conventional robots can only inspect a line while traveling along it
    [7]. Thus, most research focused on developing new robot architectures for smart
    navigation over bundle transmission lines [8–10].


    With the rapid hardware development of smart drones and PTL maintenance robots,
    the demand of automatic data processing for transmission line inspection will
    increase quickly. A number of research works have been carried out to extract
    transmission lines, insulators, and foreign objects from aerial images automatically.
    The authors in [11] use Robot LiDAR data for cable inspection, [12] extracts power
    lines based on Markov Random Field theory, foreign objects are detected with a
    morphology-based approach [13] and a motion compensation based method [14], and
    all of them use traditional algorithms. As reviewed in [15], the potential of
    deep learning in power line inspection is promising. For example, the automated
    inspection of insulator [16], transmission towers [17], and transmission lines
    [18] based on deep learning have already been carried out. The detection of foreign
    objects on transmission lines based on Faster-RCNN and YOLO (You Only Look Once)
    were also studied in [19,20] respectively. However, the foreign object image used
    for the experiment are images with foreign objects by default, so the algorithm
    does not have the classification function. In addition, the amount of data they
    use for experiments is very small, and the number of images in our dataset is
    more than 10 times that of them. There are also some detection algorithms for
    the detection of insulators. It is more challenging to detect foreign objects
    without a fixed shape compared to insulators with regular shapes.


    Enlightened by image classification and object detection architectures based on
    deep learning (i.e., VGG [21], ResNet [22], Inception [23,24], Faster RCNN [25],
    and SSD (Single Shot MultiBox Detector) [26]), a two-stage approach is proposed
    for automated image processing, which detects and marks foreign objects in the
    image. The model is trained, fine-tuned, and tested with images collected by electric
    maintenance departments. The reminder of the article is organized as follows:
    Section 1 reviews related work. Section 2 presents the methodology of the proposed
    model. Section 3 describes the preparation of data set. In Section 4, the experiment
    is analyzed and discussed. Finally, conclusions and contributions of this work
    are drawn in Section 5.


    # 2. Methodology


    # 2.1. Problem Statement


    Detecting foreign objects on overhead transmission lines is a very important work
    regarding power system maintenance. Overhead transmission lines are a primary
    method for transmitting high-voltage power across long distances. The high energy
    of transmission lines requires very thick insulation to prevent the insulating
    material from catching fire itself. If they are insulated, the insulation would
    make power distribution lines too costly and very heavy and thus unlikely to set
    up in air. Thus, unlike low-voltage cable, overhead transmission lines don’t have
    insulation, they are insulated by air. During high-wind events, foreign objects
    such as plastic greenhouses, kites, and balloons blew onto'
