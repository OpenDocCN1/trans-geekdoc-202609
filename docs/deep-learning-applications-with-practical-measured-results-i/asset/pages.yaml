    # 3.2. Neural Audio Caption Model


    The model is based on the neural audio caption method. The basic idea of the model
    is: input the audio MFCC feature sequence $\mathbf{A} = (\vec{a}_1, \vec{a}_2,
    ..., \vec{a}_n)$ and encode it into a fixed-length $\vec{K}$, then decode the
    fixed-length vector and output the predicted evaluation $\mathbf{R} = (\vec{R}_1,
    \vec{R}_2, ..., \vec{R}_n)$. The encoder of the model encodes MFCC features into
    learnable feature vectors. Then, these feature vectors are used to learn the correspondences
    with the training comments. Afterwards, the decoder of the model decodes the feature
    vector into comments. The complete structure of the neural audio caption method
    is shown in Figure 2. The model is divided into an encoder part and a decoder
    part.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_258_0.png)


    Figure 2. Neural Audio Caption Model. The encoder of the model encodes the MFCC
    feature sequence into a learning representation. Because one oral audio corresponds
    to multiple comments, a random vector with a Gaussian distribution is added after
    audio information encoding. The decoder model gets the input learnable audio features
    and corresponding comment vectors, and finally outputs comments.


