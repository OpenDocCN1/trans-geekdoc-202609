- pgno: 37
  md: 'forecasting. The distinguishing characteristics of M-TCN are: (1) the input
    and output lengths of our network could be determined to be flexible for various
    scenarios; (2) M-TCN uses the 1D convolution instead of causal convolutions; (3)
    M-TCN augmented with two different asymmetric residual blocks; (4) M-TCN constructs
    a sub-model for each feature of input data, and the prediction is accomplished
    by a combination of all sub-models. We call this typical structure a multihead
    model. In this work, what we emphasize is the methodology on how to build effective
    networks (i.e., Multihead model) using a combination of network (augmented with
    two different residual blocks) and dilated convolutions. The following are details
    of the network structure.


    # 3.4.1. 1D Convolutions


    TCN uses causal convolutions, where an output at time t is convolved only with
    elements from time t and earlier in the previous layer. In Figure 3, causal convolution
    is used to assume that all data must have a one-to-one causal relationship in
    chronological order. Given an input sequence time series signal X = (x1, x2, x3,
    x4, x5) with x_t ∈ R^n where n is the variable dimension, x_t does not strict
    causality in chronological order. While x1 and x5 may have a direct logical connection,
    causal convolution will make the relationship between x1 and x5 affected by x2,
    x3, x4. This design was limited by the absolute order of time-series and inefficient
    for accurate characteristics learning at a relative time. Thus, in our model,
    only a 1D convolutional network is adopted to avoid this situation.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_37_0.png)


    Figure 3. Visualization of a stack of causal convolutional layers.


    # 3.4.2. Dilated Convolutions


    The dilated convolutions algorithm [13] is used in our model. Since the traditional
    convolution operation process is to convolute the sequence once and then pool,
    which reduces the size of the sequence and enlarges the receptive field at the
    same time. One of the main faults is that some sequential information will be
    lost during the pooling process, while the advantage of dilated convolutions is
    that they don’t need the pooling process and gradually increase the field of perception
    through a series of dilated convolutions, thus leading to the output of each convolution
    encompasses rich information for long-term tracking. Thus, the dilated convolutions
    could be well applied in the problem of long information dependence of sequence,
    such as voice and signal processing, environment forecasting, etc. Dilated convolution
    is defined as


    F(s) = (x *_d f)(s) = Σ_{i=0}^{k-1} f(i) · x_{s - d·i}   (5)


    where d is the dilation factor, k is the filter size, and s − d · i accounts for
    the direction of the past. A filter f : {0, …, k − 1} → N. Figure 4 depicts dilated
    1D convolutions for dilations 1, 2 and 4.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '![](img/8b41ef3997625b78ba4cb189dbc5f7b9_38_0.png)


    Figure 4. Visualization of 1D convolutions with different dilation factors.


    # 3.4.3. Residual Block


    A novel structure is designed by a multilayer and sequential residual network
    and parallel residual blocks. The core of ResNet [14] is to create a shortcut
    for information dissemination in front and back layers. A basic Residual block
    is used in the TCN network; however, the jump connection in ResNet, resulting
    in only a small number of residual blocks’ learning useful information, and thus
    the basic residual block structure is not adapted for time series prediction.
    An alternative way is to increase the convolution kernel size for a better prediction;
    however, the computational load increases sharply. In [31], an asymmetric block
    structures were introduced both for MobileNetV3-Large and MobileNetV3-Small. By
    this way, asymmetric factors will be generated in the whole network structure
    and may make a positive impact on the in-depth learning models. The optimal asymmetric
    structure needs Neural Architecture Search(NAS) [32,33]; however, it is computationally
    expensive. In a more direct way, two asymmetric residual blocks in parallel are
    constructed. The architectural elements in our model are shown in Figure 5.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_38_1.png)


    Figure 5. Residual Block in our network. (left) details of the Unit architecture.
    (middle) Residual Block 1; (right) Residual Block 2.


    The Unit for our model is shown in Figure 5 (left). The Unit has two channels.
    Each channel has dilated convolution and nonlinearity, for which we used the rectified
    linear unit (ReLU) [34]. The residual block 1 is shown in Figure 5 (middle). Within
    a residual block, the model has three units. The output is the sum of the results
    of two channel operations. The residual block 2 is shown in Figure 5 (right),
    which has the same basic structure as residual block 1, but one more unit layer
    is implemented. To be more precise, a dilated convolution with different dilation
    factors and filter size k = 3 are constructed both for residual blocks. In addition,
    an optional 1 × 1 convolution is introduced to adjust the dimensions of different
    feature maps (see Figure 5 (middle, right)) for summation.


    The Unit takes the same input with two different convolutions, and then adds up
    the results. The convolutional layer consists of multiple kernels with different
    sizes. The k-th filter sweeps through the input data X, which can be formulated
    as:


    ReLU(x) = max(0, x), (6)'
