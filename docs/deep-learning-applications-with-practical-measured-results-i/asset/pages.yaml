    3. Initialize the weights and thresholds of the BP neural network and calculate
    fitness. The initial population of the genetic simulated annealing algorithm is
    generated by combining the initial weights and thresholds of the BP neural network
    initialization with the original measured values H_i and temperature T. Each individual
    in the genetic simulated annealing algorithm represents all the weights and threshold
    of a network, and the algorithm then calculates the fitness of each individual
    through a fitness function. The fitness function of this paper adopts the fitness
    stretching method, and the fitness of the i-th individual after improvement is
    calculated by Equation (18).


    fit(i) = e^{f_i/T} / sum_{i=1}^{M} e^{f_i/T} (18)


    Among these values, f_i is the i-th individual fitness before improvement, f_i
    = 1 / |H_Oi - H_Ci|. T_0 and T are the initial temperature and the current temperature
