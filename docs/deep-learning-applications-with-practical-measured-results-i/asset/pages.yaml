    # 4.5. Lesson Learned


    The study finds that people pay attention to the development of language education.
    There is a great demand for intelligent systems for language evaluation in the
    market. Therefore, this paper proposes two models of NACM and GNACM and applies
    them to the intelligent oral evaluation system. Through case analysis, we can
    find that the intelligent oral evaluation system has many advantages. (1) The
    development of the intelligent oral evaluation system will solve the problem of
    time-consuming manual participation of oral evaluation in the market. Compared
    with traditional online systems, the comments generated by the model are personalized
    and comprehensive. (2) The extraction and encoder of audio features are difficult.
    This paper uses the MFCC feature extraction to extract audio features and uses
    the Bi-GRU model to encoder audio features to solve these two problems. Moreover,
    in the audio preprocessing process, we use the method of setting the maximum frame
    and zero-padding to solve the problem of different lengths of audio feature sequences.
    (3) After NACM is completed, the GAN method is added to the NACM, which significantly
    improves the accuracy of the evaluation. The intelligent oral evaluation system
    is more applicable in the business model. (4) The performance test results of
    the model indicate that the proposed approach can generate'
  merge: -1
  img_proc: true
- pgno: 267
  md: 'meaningful expert comments for the oral audio evaluation. It is suitable for
    language learning and testing market. By adjusting the parameters and training
    set, the approach can be also applied in industrial applications. (5) Oral audio
    evaluation is widely used in various domains, including education, security, finance,
    and industry. The proposed approach can be further applied to worker status evaluation
    through analyzing oral questions and answers in many industrial environments.


    The development of the intelligent oral evaluation system solves the pain points
    of intelligent evaluation of language education. However, deficiencies are also
    found during the research of the model. (1) Audio features are extracted through
    MFCC feature extraction. In the encoder, the accuracy of the audio feature encoding
    needs to be further improved. Encoder of the model can still be optimized in the
    future. At the time of comment generation, as the audio feature layer deepens,
    the audio features gradually weaken. It may lead the generated comment, to some
    extent, deviates from the audio. (2) The generated comments have a high similarity
    with the trained expert comments, resulting in inflexible generated comments.
    We want the model to generate a more personalized comment for different participants.
    GAN-based model is hard to generate varieties beyond the training set. Based on
    the deficiencies of the model, we will continue to study the model to improve
    the accuracy of the generated evaluation.


    # 5. Conclusions


    This paper proposes a generative model for the oral evaluation. Compared with
    the traditional method, the proposed model is more effective and efficient in
    oral evaluation. It can generate meaningful comments according to the oral audio
    without manual works. The proposed approach consists of two parts. The first part
    is Neural Audio Caption Model (NACM). It applies a Gated Recurrent Unit (GRU)
    to encode the audio features into the neural network. It also applies a Long Short-Term
    Memory (LSTM) model to discover the mappings between audio features and text features.
    The second part of the approach is the Generative Adversarial Network-Based Neural
    Audio Caption Model (GNACM). It uses the output of NACM as its input to improve
    the quality of generated comments. The proposed approach is evaluated in a real-world
    dataset. It also is applied in a commercial application. The evaluation results
    and the lessons learned from the application show that the proposed approach is
    effective and efficient in oral evaluation. In the future, we plan to apply the
    knowledge graph to process the content and context of oral audio. Therefore, the
    model will consider not only the audio analysis but also the semantic analysis
    for the oral evaluation.


