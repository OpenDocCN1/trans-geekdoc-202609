  md: '# Editorial


    # Deep Learning Applications with Practical Measured Results in Electronics Industries


    Mong-Fong Horng 1, Hsu-Yang Kung 2, Chi-Hua Chen 3,* and Feng-Jang Hwang 4


    1 Department of Electronic Engineering, National Kaohsiung University of Science
    and Technology, Kaohsiung 80778, Taiwan; mfhorng@nkust.edu.tw

    2 Department of Management Information Systems, National Pingtung University of
    Science and Technology, Pingtung 91201, Taiwan; kung@mail.npust.edu.tw

    3 College of Mathematics and Computer Science, Fuzhou University, Fuzhou 350100,
    China

    4 School of Mathematical and Physical Sciences, University of Technology Sydney,
    Ultimo, NSW 2007, Australia; Feng-Jang.Hwang@uts.edu.au

    * Correspondence: chihua0826@gmail.com; Tel.: +86-18359183858


    Received: 11 March 2020; Accepted: 12 March 2020; Published: 19 March 2020


    Abstract: This editorial introduces the Special Issue, entitled “Deep Learning
    Applications with Practical Measured Results in Electronics Industries”, of Electronics.
    Topics covered in this issue include four main parts: (I) environmental information
    analyses and predictions, (II) unmanned aerial vehicle (UAV) and object tracking
    applications, (III) measurement and denoising techniques, and (IV) recommendation
    systems and education systems. Four papers on environmental information analyses
    and predictions are as follows: (1) “A Data-Driven Short-Term Forecasting Model
    for Offshore Wind Speed Prediction Based on Computational Intelligence” by Panapakidis
    et al.; (2) “Multivariate Temporal Convolutional Network: A Deep Neural Networks
    Approach for Multivariate Time Series Forecasting” by Wan et al.; (3) “Modeling
    and Analysis of Adaptive Temperature Compensation for Humidity Sensors” by Xu
    et al.; (4) “An Image Compression Method for Video Surveillance System in Underground
    Mines Based on Residual Networks and Discrete Wavelet Transform” by Zhang et al.
    Three papers on UAV and object tracking applications are as follows: (1) “Trajectory
    Planning Algorithm of UAV Based on System Positioning Accuracy Constraints” by
    Zhou et al.; (2) “OTL-Classifier: Towards Imaging Processing for Future Unmanned
    Overhead Transmission Line Maintenance” by Zhang et al.; (3) “Model Update Strategies
    about Object Tracking: A State of the Art Review” by Wang et al. Five papers on
    measurement and denoising techniques are as follows: (1) “Characterization and
    Correction of the Geometric Errors in Using Confocal Microscope for Extended Topography
    Measurement. Part I: Models, Algorithms Development and Validation” by Wang et
    al.; (2) “Characterization and Correction of the Geometric Errors Using a Confocal
    Microscope for Extended Topography Measurement, Part II: Experimental Study and
    Uncertainty Evaluation” by Wang et al.; (3) “Deep Transfer HSI Classification
    Method Based on Information Measure and Optimal Neighborhood Noise Reduction”
    by Lin et al.; (4) “Quality Assessment of Tire Shearography Images via Ensemble
    Hybrid Faster Region-Based ConvNets” by Chang et al.; (5) “High-Resolution Image
    Inpainting Based on Multi-Scale Neural Network” by Sun et al. Two papers on recommendation
    systems and education systems are as follows: (1) “Deep Learning-Enhanced Framework
    for Performance Evaluation of a Recommending Interface with Varied Recommendation
    Position and Intensity Based on Eye-Tracking Equipment Data Processing” by Sulikowski
    et al. and (2) “Generative Adversarial Network Based Neural Audio Caption Model
    for Oral Evaluation” by Zhang et al.


    Keywords: deep learning; machine learning; supervised learning; unsupervised learning;
    reinforcement learning; optimization techniques'
