    # 5. Conclusions


    In this paper, we introduce an OTL-Classifier, a binary classifier with an auxiliary
    automate marker module. Compared to recent research, our method is much more application
    oriented. We have three main differences:


    +   - Our **OTL-Classifier module can classify images with and without foreign
    objects.** However, recent research only processes images with foreign objects;
    they focused on detecting the type and location of the foreign objects in the
    abnormal images. However, aerial images return by drones and robots inspection
    include much more normal images than abnormal images. Searching abnormal images
    manually is not only time-consuming, but also has poor precision due to attention
    feature of human. Therefore, it is much more important to design a module which
    could automatically extract abnormal images directly from original images returned
    by unmanned vehicles.

    - During the evaluation phase, we consider recall rate as more important than
    precision in our application. A sudden wide-area outage caused by even one undetected
    foreign object will affect people’s lives and industrial production seriously
    and may lead to a lot of economic loss. Therefore, we think it is very critical
    to have a recall rate of 100%, so no abnormal images will be missed during classification.

    - Most recent research evaluated detection speed. For example, RCNN4SPL module
    spends 230 ms per frame, YOLOv3 based module is 46 ms in average, Morphology based
    module is 95.8 ms in average, and Motion compensation-based module is 64 ms. We
    didn’t test execution time because it is highly dependent on the hardware. In
    addition, in our application, we don’t have a very high timing requirement as
    path planning for automatic drive.


    In this article, we have evaluated the classification performance of SVM and three
    Inception variants, and the marking performance of SSD, Faster-RCNN with VGG,
    and ResNet. Experiments shows our module based on Inceptionv3-retrain, and Faster-RCNN
    with ResNet101 achieves best performance on the data set we collected from electric
    maintenance departments.


    We summarize our contributions as follows:


    +   - We proposed an OTL-Classifier module; it can classify images with and without
    foreign objects. It can work in either Warning-Review mode or Normal mode.

    - In the normal mode, the OTL-Classifier works the same as most common classification
    tasks, the module uses optimal parameters that balances recall rate and error
    rate. It can achieve a recall rate of 95% and an error rate of 10.7%.

    - In the Warning-Review mode, the OTL-Classifier achieves a recall rate of 100%
    and an error rate of 35.9%. It has a two-stage workflow. In the first stage, the
    binary classifier module provides the'
