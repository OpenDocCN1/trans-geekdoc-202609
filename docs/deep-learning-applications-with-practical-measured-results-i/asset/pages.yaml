    # Characterization and Correction of the Geometric Errors in Using Confocal Microscope
    for Extended Topography Measurement. Part I: Models, Algorithms Development and
    Validation


    Chen Wang 1, Emilio Gómez 1 and Yingjie Yu 2,*


    +   1. Department of Mechanical Engineering, Chemical and Industrial Design, ETS
    of Engineering and Industrial Design, Technical University of Madrid, 28012 Madrid,
    Spain

    2. Department of Precision Mechanical Engineering, Shanghai University. No.333,
    Nanchen Rd., Shanghai 200444, China

    * Correspondence: yingjieyu@staff.shu.edu.cn


    Received: 2 June 2019; Accepted: 26 June 2019; Published: 27 June 2019


    **Abstract:** This work presents a method for characterizing and correcting the
    geometric errors of the movement of the lateral stage of Imaging Confocal Microscope
    (CM) in extended topography measurement. For an extended topography measurement,
    a defined number of 2D images are taken and stitched by correlation methods. Inaccuracies
    due to linear displacement, vertical and horizontal straightness errors, angular
    errors, and squareness errors based on the assumption of the rigid body kinematics
    are described. A mathematical model for the scale calibration of the X- and Y-
    coordinates is derived according to the system kinematics, the axis chain vector
    of CM, and the geometric error functions and their approximations by Legendre
    polynomials. The correction coefficients of the kinematic modelling are determined
    by the measured and certified data of a dot grid target standard artefact. To
    process the measurement data, algorithms for data partitions, fittings of cylinder
    centers, and determinations of coefficients are developed and validated. During
    which methods such as form removal, K-means clustering, linear and non-linear
    Least Squares are implemented. Results of the correction coefficients are presented
    in Part II based on the experimental studies. The mean residual reduces 29.6%
    after the correction of the lateral stage errors.


    **Keywords:** geometric errors correction; kinematic modelling; lateral stage
    errors; Imaging Confocal Microscope; K-means clustering; data partition; Least
    Squares method


    # 1. Introduction


    The calibration of measuring machines is both important for test acceptance and
    error compensation [1]. Use of software techniques started from the very beginning
    for the correction of the systematic errors of measurement instruments, as the
    mechanical accuracy is expensive while repeatability cost little [2]. Over the
    last several decades, measurement accuracy and error compensation have been an
    area of intensive investigation [3–5].


    Lateral calibration of the X- and Y- coordinates serves as a calibration of the
    magnification of the X- and Y-axis scale [6]. Lateral calibration/correction of
    confocal microscope (CM) can be classified mainly into two groups: imaging system
    calibration and machine system calibration [7]. Calibrations of the imaging system
    studies aberrations of refractive systems of objective lenses [8–10], axial distortion
    by point spread function or refractive-index mismatches [11,12], etc. The machine
    system calibrations investigate geometric errors generated by the movement of
    probes [2,13,14]. The first study of using kinematic geometric errors for error
    compensation of coordinate measurement traces back to the work of G Zhang et al.
    [15]. From then on, characterization and correction of kinematic geometric errors
    has'
  merge: -1
  img_proc: true
- pgno: 151
  md: 'mainly focused on coordinate measuring machines (CMM) [16,17], and has seldom
    been applied for optical measurement instruments.


    However, areal measurement by CM is realized by both imaging systems and machine
    systems. CM scan in the lateral and vertical directions using different physical
    mechanisms [18]. To obtain a surface topography, CM captures a series of two-dimensional
    images by stepping either the specimen holding base or the objectives along the
    Z-stage [19]. For a single topography measurement, the 2D images are acquired
    in lateral directions either all at once by a CCD array (Imaging CM) or by a raster
    scan (Laser Scanning CM) [20,21]. For an extended topography measurement, a defined
    number of 2D images are taken and stitched by correlation methods. Accordingly,
    calibrating the imaging system only is not sufficient for a CM, as its measurement
    is realized by both imaging and machine systems. Lateral calibration or machine
    system calibration is necessary and important. It is worth mentioning that some
    works have been carried out on characterization of metrological characteristics
    defined in ISO 25178-600 [22], such as amplification coefficient, linearity deviation,
    x-y perpendicularity deviation, etc. [23-26]. These metrological characteristics
    imply the whole instrumentation system’s characteristics to some extent.


    In this work, we present a method to characterize and correct the geometric errors
    of the lateral stage of the CM, with implementation of a standard artefact of
    dot grid target. Extended topography measurements are influenced by kinematic
    errors of the measurand holding base, which moves horizontally in the X- and Y-directions.
    This work first introduces the theory and mathematics of the 21 rigid body geometric
    errors applied generally in the study of error compensations for CMM and machine
    tools in Section 2 Afterwards, we develop our own kinematic modelling based on
    the theory of kinematic and geometric errors for the lateral stage movement of
    CM in the same Section. Section 3 introduces the methodology of the study. Mathematical
    models and algorithms for measurement data processing are presented in Section
    4. Section 5 validates our developed models and algorithms using synthetic data.
    Section 6 draws the conclusions. Experimental studies of the calibration and uncertainty
    evaluation are presented in Part II, published as another paper in the same journal.


    # 2. Mathematical Model for the X- and Y-Scale Calibration


    For each of the three axes there exist three translational deviations, i.e. the
    linearity deviation, the straightness deviation and the ortogonality deviation.
    The straightness deviation is defined as the displacement orthogonal to the axis
    of motion, with two straightness deviation functions for each of the orthogonal
    directions. Rotational movements of stages are roll, yaw and pitch, with roll
    denoting a screw like movement, and pitch and yaw denoting angular deviation functions
    that describe movements within a plane [1,15,27]. Some parameters of mechanical
    systems, such as bearing spacing and guideway geometric errors, determine axis
    motion errors of machine axes [28]. T. O. Ekinci et al. categorized machine errors
    into three levels, i.e., geometric errors, joint kinematic errors, and volumetric
    errors [29]. This work clarifies the terminologies and highlights the usefulness
    of a machine error modeling approach.


    For the measurement of a specimen using the 3D Imaging CM, the workpiece is placed
    on the X- and Y-stage above the supporting base, which is usually made of granite.
    As shown in Figure 1a, to focus the laser beam onto the measurand surface, two
    movements are carried ou, i.e., movement along the X- and Y-axis, controlled by
    the lateral stage, and movement along the Z-axis, controlled by the vertical stage.
    For example, to measure the point P on the measurand surface, its position can
    be denoted as $\vec{P}(P_x, P_y, P_z)$ with respect to its coordinate origin $\vec{O}(0,0,0)$.
    For the focus of the probe and the point of workpiece, the first movement include
    translation of X carriage followed by the translation of Y carriage; the second
    movement is the translation of Z carriage. It can be suggested that vectors $\vec{X}$,
    $\vec{Y}$ and $\vec{Z}$ represent the translations of X, Y and Z carriages, the
    rotation matrices R(X), R(Y) and R(Z) denote the angular motion errors caused
    by the translations of X, Y and Z carriages, the vector $\vec{T}$ represents the
    X, Y and Z abbe offsets of the probe with respect to the carriage to which the
    probe is'
