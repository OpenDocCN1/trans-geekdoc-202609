  md: '![](img/8b41ef3997625b78ba4cb189dbc5f7b9_197_0.png)


    # Figure 6. Principle of hyperspectral image classification based on deep transfer
    learning.


    Training was performed on the source dataset to obtain the network model and parameters.
    The shallow layer structure and parameters were directly transferred to the object
    dataset, and the deep layer parameters were randomly initialized. Taking the CNN
    network structure of Figure 6 as an example (including two convolutions and pooling
    layers, and two fully connected layers), if the source hyperspectral dataset is
    highly similar to the object hyperspectral dataset, the adjustment of the deep
    parameters should be in the following order: The last fully connected layer (full-connected2),
    the first fully connected layer (full-connected1). If the source hyperspectral
    dataset is not highly similar to the object hyperspectral dataset, the convolutions
    and pooling layers (conv2 and pooling2) that extract the deep features may also
    need the random re-initialization of the weighting parameters. Specifically, in
    the proposed hyperspectral image classification process based on deep transfer
    learning in this article, the following two situations were mainly considered:


    In the first situation, the object dataset has a small number of samples and is
    similar to the source dataset. In this case, first, the last fully connected layer
    of the pre-trained layers should be removed, and then a fully connected layer
    that matches the number of feature classes of the object dataset is added. The
    weight parameters of other pre-training layers are kept unchanged, and only the
    weights of the newly added layers are randomly initialized. When the sample size
    of the object dataset is small, only the new-added fully connected layer is trained
    using the object dataset to avoid the problem of over-fitting. In details, the
    learning rate of the previous layers of CNN to 0 and only the last fully connected
    layer on the object dataset is trained.


    In the second situation, the object dataset has a large number of samples, but
    the number of samples relative to the source dataset is small, and the relative
    dataset are similar to the source dataset. In this case, first, the last fully
    connected layer of the pre-training network layers should be removed, and then
    a fully connected layer that matches the number of feature classes of the object
    dataset is added. Only the weights of the newly added layers are randomly initialized,
    while the weight parameters of other pre-training layers are kept unchanged. Since
    the object dataset has a large amount of data and is not prone to overfitting,
    the entire network can be retrained. Meanwhile, the features extracted by the
    original convolutional layer can be used to speed up the training for the object
    dataset. The entire network can be trained by the specific method through setting
    the learning rate of the front layeres of the CNN to 0.001.'
