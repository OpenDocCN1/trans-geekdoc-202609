- pgno: 223
  md: 'ensure automated detection of defects. Further, an ensemble hybrid combination
    of the CNN with a high-performance Faster Region-based ConvNets for classifying
    and diagnosing the bubble-defects present in the tire shearography images. The
    proposed hybrid Faster Region-based convolutional neural networks model reduces
    misjudgments caused by human errors and achieves high consistency in the quality
    of bubble-defect detection. It is clearly evident from the results that in addition
    to thoroughly diagnosing the bubble-defects in tires, the hybrid Faster Region-based
    convolutional neural networks model decreases the false alarm ratio of not-bubble
    defects in tires from 20% to a rate of 18%. Also, it has to be noted that this
    hybrid system model was deployed in a tire manufacturing unit, and it produced
    efficient results in automatically diagnosing the bubble-defects in treads and
    sidewalls of tires. In the future work, more advanced CNN enabled approaches can
    be implemented for automated detection of defects [26–30], thus ensuring and realizing
    a sustainable tire manufacturing process.


