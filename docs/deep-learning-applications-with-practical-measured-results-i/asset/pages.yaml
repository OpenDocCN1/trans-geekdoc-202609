    # 2.2. Warning–Review Strategy


    In the first part, the algorithm workflow that constitutes the whole ‘foreign
    object image classification-warning-personnel review’ is introduced. We also introduce
    the framework used in the image classification algorithm and the target detection
    algorithm. In the second part, the preparation and division process of the data
    used in the experiment are described.


    All of the test images in references [19,20] are images with foreign objects,
    which is equivalent to artificially removing the interference image without foreign
    objects before their foreign object detection algorithm detects it.


    However, the images collected by the current intelligent inspection equipment
    contain a large number of images without foreign objects. In order to get closer
    to the real inspection situation, in this paper, the images used for training
    and testing algorithms are composed of the image with foreign objects and the
    image without foreign objects. The whole process is shown in Figure 1, which is
    the biggest difference between the research work of this paper and the previous
    research. After the mixed inspection image passes the classification algorithm
    of the first stage, the image with a foreign object may be marked by the classification
    algorithm, thereby alerting the power grid staff and prompting the staff to review
    the image with the alarm.


    In the first stage, this paper focuses on the 100% recall rate algorithm and trains
    and tests SVM (Support Vector Machine), InceptionV3-retrain, InceptionV3-fine-tuning,
    and InceptionV4-fine-tuning. In the second stage, the inspection image marked
    as the presence of foreign object is sent to the target detection algorithm, and
