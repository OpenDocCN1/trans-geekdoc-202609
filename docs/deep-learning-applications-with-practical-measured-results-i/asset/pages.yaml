    It has to be noted that only direct recommendation driven purchases were considered,
    that is, purchases initiated directly from RC. It was not feasible to reliably
    assess non-direct RDPs, that is, the amount of purchases committed from the general
    product list, yet inspired by recommendation items. Therefore, non-direct RDPs
    were not analyzed in this study. However, it was noticed in the visual analysis
    that a few subjects glanced at a recommendation item and, sometime later, decided
    to select the same product from the general product list, with causation not confirmed.


    Another side remark after visual analysis is connected with the fact that the
    flickering effect (VI2) of a recommendation item seemed to have a prolonged effect
    on fixation after moving to the next product category. This means that, despite
    the visual intensity changing to standard, this recommendation location continued
    to attract attention.


    # 4.2. Results of the Pre-assesment Study of the Proposed Framework for Performance
    Evaluation of a Recommending Interface (PERI)


    Using data described in Section 3.2, the deep neural network was trained for the
    goal of predicting the performance of recommending interfaces. As a performance
    measure, the action of adding a product to cart from the RCi location was used.
    In total, 40 products were selected directly from RCi locations. A custom multilayer
    perceptron with two hidden layers for the binary classification of adding a product
    to cart was built, the number of neurons being computed automatically. The resulting
    neural network consisted of four layers (one input, two hidden and one output).
    The parameters of the neural network are presented in Table 3. Variables rc_location
    and user_cognitive_ability_level were treated as categorical variables and, thus,
    one-hot encoding was performed, resulting in one input neuron for each variable
    value. In both hidden layers and the output layer, sigmoid function was used as
    activation function. For training the neural network, the gradient descent algorithm
    was used, with an initial learning rate of 0.4 and momentum of 0.9. The number
    of neurons in each hidden layer was determined automatically by using iterative
    estimation algorithms (IBM SPSS Statistics). All input variables were normalized
    before training of the network.


    A test sample of 168 records (around 28.3%) was put aside for the accuracy validation
    of the neural network. Due to unbalanced data there, were ten positive samples
    randomly selected. The confusion matrix on the training and testing sample is
    shown in Table 4. Overall classification accuracy is high for both training and
    testing datasets, at 98.4% and 98.2%, respectively. The best results are achieved
    for the not-buying action, with 98.7% and 99.4% of accuracy for both training
    and testing sets. Regarding predicting the buying action, the accuracy is also
    quite high—92.9% and 80.0% for the same sets, respectively. Precision and recall
    accuracy equal 80% and 89%, respectively, and they are the most appropriate metrics
    for the accuracy evaluation of the model.'
