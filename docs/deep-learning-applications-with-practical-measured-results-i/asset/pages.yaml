  md: '# 6. Experiments and Analysis


    # 6.1. Dataset


    In order to verify the proposed method in this article, the experiments were conducted
    on the datasets with similar characteristics. The selected dataset included the
    Indian Pines dataset, the Salinas dataset, the Pavia University dataset, and the
    Pavia Center dataset. Both the Indian Pines dataset and the Salinas dataset were
    acquired by AVIRIS sensors. The corrected spectral dimensions for both datasets
    were 200 and 204, respectively, which were very close. The real ground objects
    were divided into 16 classes [44]. The Pavia University dataset and the Pavia
    Center dataset were collected by ROSIS sensors. The corrected spectral dimensions
    of these two datasets were 103 and 102, respectively, and the real ground objects
    were divided into nine classes [45]. The datasets are gotten from the website
    (http://www.ehu.eus/ccwintco/index.php?title=Hyperspectral_Remote_Sensing_Scenes).


    The Indian Pines dataset and the Salinas dataset were similar, and the Pavia University
    dataset and the Pavia Center dataset were similar. In addition, the former two
    datasets had a smaller sample size than the latter two datasets. Therefore, the
    Salinas dataset and the Pavia Center dataset were used as the source datasets
    in the transfer learning method, while the Indian Pines dataset and the Pavia
    University dataset were used as the corresponding object datasets. First, the
    structures and parameters of the shallow network were obtained and validated from
    the training on the Salinas dataset and Pavia Center dataset. Then the obtained
    structure and parameters were transferred to the Indian Pines dataset and Pavia
    University dataset with relatively small sample sizes. Finally, the structure
    and parameters of the network were fine-tuned.


    There was a big difference between the Indian Pines dataset and the Pavia University
    dataset, which could be used to validate the proposed classification method fully.
    The Indian Pines dataset had a small sample size and can mainly reflect the vegetation
    information, including rich species and mostly regular block distribution, rich
    spectral information and low spatial resolution. The Pavia University dataset
    had a large image size and can mainly reflect the landscape information of the
    urban landscape. Although there were few species, the shape of the object was
    irregular, and the spatial resolution was high.


    # 6.2. Experiments and Result Analysis


    # 6.2.1. Experiments of Dimensionality Reduction Methods


    In order to test the effectiveness of the proposed methods in the dimensionality
    reduction and noise reduction for the hyperspectral images, the classification
    performance of IM, IM_SPE methods, and these methods superimposed with optimal
    neighborhood noise-reduction method (IM_DN, IM_SPE_DN methods) were tested and
    compared with that of the spectral information based CNN classification method
    (SPE) [46], the spatial information based CNN classification method (PCA1, PCA
    first principal component) [47], the CNN classification method based on the integration
    of the spectral information and the first principal component of the spatial information
    (PCA1_SPE), and the CNN classification method based on PCA''s first three principal
    components of the spectral information (PCA3) [48]. We use OA, AA and Kappa coefficients
    to evaluate the performance of different methods.


    (1) Experiments on Indian pines dataset


    The classification performance on the Indian pines dataset is shown in Table 1.
    From Table 1, for the Indian pines dataset, the PCA1_SPE, PCA3, IM, and IM_SPE
    classification methods provided the best classification accuracy. Moreover, the
