  md: '# 3.3.1. Discriminator


    The discriminator network of the model is composed of an embedding layer, a LSTM
    unit and a fully connected layer. The goal of training the discriminator is to
    maximize the probability of correctly classifying a given input as real or fake.
    The inputs of the discriminator are generated pseudo-expert comment and real comment.
    First, the fake/real comment is embed to be a matrix E = (e₁, e₂, ..., eₙ) by
    a embedding layer, then a LSTM unit takes the embedding e⃗ₜ of each word as input
    and outputs a hidden state h⃗ₜ computed by Equations (14)-(19). Last, we feed
    the last hidden state vector into a fully connected layer with sigmoid activation,
    outputting a scalar probability that the input comment is real.


    f⃗ₜ = σ(W_f · [h⃗_{t-1}, e⃗ₜ] + b⃗_f)  (15)

    i⃗ₜ = σ(W_i · [h⃗_{t-1}, e⃗ₜ] + b⃗_i)  (16)

    c̃⃗ₜ = tanh(W_c · [h⃗_{t-1}, e⃗ₜ] + b⃗_c)  (17)

    c⃗ₜ = f⃗ₜ ⊙ c⃗_{t-1} + i⃗ₜ ⊙ c̃⃗ₜ  (18)

    o⃗ₜ = σ(W_o · [h⃗_{t-1}, e⃗ₜ] + b⃗_o)  (19)

    h⃗ₜ = o⃗ₜ ⊙ tanh(c⃗ₜ)  (20)


    The loss function for the discriminator is used to judge the ability of the discriminator.
    The loss function is defined as:


    L^{D}_{real/fake} = - (E(log D_{real/fake}(T̃)) + E(1 - log(D_{real/fake}(G(A,
    z̃)))))  (21)


    where G(A, z̃) represents the comments generated by the generator. D_{real/fake}(x)
    is the discriminator which outputs the scalar probability that x came from the
    truth sample rather than the generator, T̃ represents the real sample.


    # 3.3.2. Generator


    The generator of the model inherits the structure from the Neural Audio Caption
    Model. The generator is divided into an encoder and a decoder. The encoder encodes
    the MFCC features into learnable feature vectors. Then, a Gaussian-distributed
    random vector z̃ is connected to the encoded features. The decoder takes the encoded
    features as input and then generates comments.


    The similarity between the real samples and the comments generated by the generator
    is the primary standard for measuring the generator compliance. Therefore, the
    comments generated by the generator must be similar to the real data to deceive
    the discriminator. The generator loss function is designed to evaluate this ability
    of the generator. The goal of training the generator is to maximize D(G(A, z̃)).
    The loss of the generator is defined as:


    L^{G}_{real/fake} = E(-log D_{real/fake}(G(A, z̃)))  (22)


    where G(A, z̃) represents the comments generated by the generator, and D_{real/fake}(x)
    represents scalar probability that x came from the truth sample rather than the
    generator.


    The results of supervision using only discriminators are uncertain. Therefore,
    we turn the learning problem into an optimization problem. Define a loss function
    to measure the distribution difference between the result and the actual sample
    to minimize the loss. The loss function is as follows:


    L^{G}_{dis} = α × (G(A, z̃) - T̃)²  (23)


    where α is the balance factor and T̃ represents the real sample.'
