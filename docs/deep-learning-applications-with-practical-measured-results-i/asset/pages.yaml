  md: '*Article*


    # Deep Learning-Enhanced Framework for Performance Evaluation of a Recommending
    Interface with Varied Recommendation Position and Intensity Based on Eye-Tracking
    Equipment Data Processing


    Piotr Sulikowski 1,* and Tomasz Zdziebko 2


    +   1. Faculty of Information Technology and Computer Science, West Pomeranian
    University of Technology, ul. Zolnierska 49, 71-210 Szczecin, Poland

    2. Faculty of Economics, Finance and Management, University of Szczecin, ul. Mickiewicza
    64, 71-101 Szczecin, Poland; tomasz.zdziebko@usz.edu.pl

    * Correspondence: psulikowski@wi.zut.edu.pl


    Received: 7 January 2020; Accepted: 30 January 2020; Published: 5 February 2020


    **Abstract:** The increasing amount of marketing content in e-commerce websites
    results in the limited attention of users. For recommender systems, the way recommended
    items are presented becomes as important as the underlying algorithms for product
    selection. In order to improve the effectiveness of content presentation, marketing
    experts experiment with the layout and other visual aspects of website elements
    to find the most suitable solution. This study investigates those aspects for
    a recommending interface. We propose a framework for performance evaluation of
    a recommending interface, which takes into consideration individual user characteristics
    and goals. At the heart of the proposed solution is a deep neutral network trained
    to predict the efficiency a particular recommendation presented in a selected
    position and with a chosen degree of intensity. The proposed Performance Evaluation
    of a Recommending Interface (PERI) framework can be used to automate an optimal
    recommending interface adjustment according to the characteristics of the user
    and their goals. The experimental results from the study are based on research-grade
    measurement electronics equipment Gazepoint GP3 eye-tracker data, together with
    synthetic data that were used to perform pre-assessment training of the neural
    network.


    **Keywords:** recommender system; human computer interaction; eye-tracking device;
    deep learning


    # 1. Introduction


    Fast e-commerce development inspires increasing attention to sales-boosting solutions,
    especially recommending systems, which aim to replace salespeople from traditional
    shops. Shopping online offers the benefit of convenience, but on the other hand
    it is lacking the personal touch of salespeople, especially when a customer has
    to select from a very large number of alternatives. Thus, the optimization of
    user experience, including personalization and implementing recommending interfaces,
    has a crucial role in e-commerce website design. While, in a physical store, a
    salesperson may directly recommend products, in an online shopping environment
    it is the recommending interface that helps promote products which may be interesting
    to the customer. Recommender systems play a vital role in motivating purchase
    decisions and usually prove successful in enhancing sales [1].


    In a recommender system, a user model is usually created, constituting a description
    of a user, in order to facilitate interactions between the user and the system
    [2]. A digital representation of a user model is a user profile, which reflects
    their preferences, transactions, online behavior, etc. [3]. Online systems process
    a wide stream of user data [4–7] essential to build user profiles and recommend
    items which are optimal in terms of fit and, as a consequence, resulting sales.
    A lot of effort has been'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'made to analyze that data spectrum and discover user preferences and needs
    [8,9]. Early solutions were founded on content-based and collaborative filtering
    algorithms [10], which were then extended towards explanation interfaces [11]
    with the use of context [12] and other approaches such as social media data inclusion
    [13,14].


    The final performance of a recommending system, however, depends on factors that
    go beyond the recommendation algorithms themselves [15]. While there is substantial
    research in the area of those algorithms, there are substantially fewer studies
    in the area of the stages which follow in the online recommending process, such
    as item recommendation presentation. Human-computer interaction with recommending
    interfaces can be analyzed using DOM-events-based solutions [4] or gaze tracking
    [16–18]. Results from eye-tracking studies show that gaze data are a valuable
    source for inferring user interest, and the examination of the visual aspects
    of organizing a recommending interface may allow to better integrate those interfaces
    in e-commerce platforms [1,19,20]. In order to optimize the interface, a number
    of factors can be analyzed, such as the number of recommendations, recommendation
    item images, descriptions and layouts [21,22]. Since customers are inundated with
    information, especially marketing content, the habituation effect usually appears,
    which ends in the banner blindness phenomenon. As a result, even recommendations
    that are optimal from the algorithm perspective may provide insignificant results
    unless they are shown to the user in a wise way [23–25]: in the right part of
    a website, at the right moment of the selection and purchase process, with the
    right level of content intrusiveness [26–28], and considering personal preferences
    [29].


    This paper is a substantial extension of a conference paper [30] and proposes
    a validated framework for the performance evaluation of a recommending interface,
    to optimize its efficiency considering individual user characteristics. The evaluation
    is based on a deep learning neural network trained on experimental data from an
    eye-tracking study on the varying visual intensity and position of a recommendation
    and enhanced with data from implicit user tracking and synthetic data for missing
    measures. The framework can be implemented as part of e-commerce personalization
    engine responsible for recommending interface adjustment.


    The remainder of the article is structured as follows: the conceptual framework
    is presented in Section 2. The structure of the experiment and empirical results
    are provided in Section 3 and conclusions are presented in Section 4.


    # 2. Conceptual Framework


    The main objective of this paper is to present a framework for performance evaluation
    of the positioning of a recommendation within a recommending interface of a website
    and the varying visual intensity of a recommendation with regard to attracting
    customer interest. In order to evaluate the viability and usefulness of the framework
    in terms of user experience and marketing goals, a pre-assessment study is performed.
    This evaluation is based on a deep neural network model built on data from a study
    performed with research-grade measurement electronics equipment Gazepoint GP3
    eye-tracker and synthetic data to perform pre-assessment training of the neural
    network.


    The main assumption behind our proposed framework for Performance Evaluation of
    a Recommending Interface (PERI) is that different variants of a recommendation
    interface can have different impact on different users depending on their cognitive
    abilities [31,32], their way of interacting with a website and their goals of
    the visit to an e-commerce website. These assumptions have been confirmed by several
    studies [22,33–35].


    In order to determine user interest, one can ask the user explicitly or observe
    them implicitly. While explicit questioning often disrupts natural behavior and
    constitutes an extra burden on the user [3,36,37], implicit measures are unobtrusive
    and therefore better suited to the purpose of the study. The subjects may focus
    on normally performed tasks, no extraneous cognitive load is generated and no
    additional motivation is required to provide explicit ratings [38–41].'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'techniques of observing human–computer interaction. Within the scope of the
    study, gaze-based data are analyzed and interpreted in a basic e-commerce scenario.
    Eye movements are used to discover which areas of an e-commerce website are most
    looked at, and which of them are the most relevant to the user, attracting user
    attention the most. Raw data collected by the eye-tracker device are processed
    with eye-tracking software and analytics algorithms.


    Eye movements may be unordered in nature and unconscious, yet they are generally
    tightly connected with cognitive processes [42]. Therefore, inference about user
    attention and interest is possible based on gaze data. A literature review by
    Buscher et al. confirms that data from gaze-tracking equipment is an excellent
    source of information on how much attention is paid to particular content on the
    screen [43].


    For the pre-assessment study, total fixation duration is the main gaze-based measure,
    used together with the buying action. Total fixation is used as an indicator of
    attractiveness by a number of research studies [35,44–47]. It is calculated as
    the sum of fixation durations aggregated on a section of a website, in particular
    the recommendation content (RC) section and the main section, with editorial content
    (EC). In the study, in addition to experimenting with the position of a recommending
    interface on a website and the location of a particular recommendation item (RI)
    within that interface, changes in visual intensity are also taken into account.
    Three basic levels of intensity are used. Changing the visual intensity of an
    item is a popular marketing technique used to counteract habituation and attract
    more attention [48]. Data from the eye-tracking study have been supplemented with
    features generated on the basis of those data.


    Figure 1 depicts the architecture of the framework for the performance evaluation
    of a recommending interface utilizing certain recommendation positions and intensities.
    Its key components include the following:


    +   - *User demographic data.* Demographic data about users (i.e., age, education,
    interests) which can be used to identify user cognitive abilities. These data
    can be gathered through registration questionnaires;

    - *User activity implicit and explicit data gathering.* This module is responsible
    for collecting data about user behavior and preferences in an unobtrusive way
    by implicitly tracking their activity, and explicitly by gathering opinions expressed
    mainly in the form of rating stars;

    - *User goal identification.* This module is responsible for the identification
    of the user’s goal. In the case of e-commerce websites, visitors can represent
    different stages of the purchase funnel. A user may be exploring the offer without
    having buying in mind. User goals can be identified based on a phrase typed in
    a search engine, the redirections source, and the relation between the items visited
    by user, usage of product filter utility and history of previous visits;

    - *User cognitive abilities identification.* The role of this module is to assess
    user’s cognitive abilities and classify them at one of a number of selected levels.
    As current cognitive abilities can influence the way a user interacts with a website
    and processes the provided information, presentation methods should be tailored
    to user abilities;

    - *User preference reasoning.* The role of this module is to infer user personal
    preferences about particular products, product features and product categories
    in general. Those preferences are used to construct a user model which is the
    input for the recommender system;

    - *Personalized recommendation engine.* This module is responsible for generating
    the most accurate personalized product recommendations for individuals, which
    fit their preferences and also can reach website goals;

    - *Performance Evaluation of a Recommending Interface (PERI).* This module is
    the core of the proposed framework. It is responsible for the evaluation of the
    performance of a possible set of different ways in which recommendations can be
    presented. The process of evaluation is carried from the perspective of individual
    user’s goals, cognitive abilities and website goals. The heart of'
