    standard humidity value was calculated from the measured values of the precise
    dew point instrument, temperature sensor and pressure gauge. The temperature at
    which the water vapor in the air becomes dew drops is called the dew point temperature.
    The dew point temperature is a means of expressing air humidity. The standard
    humidity value can be calculated by the experimentally measured dew point value,
