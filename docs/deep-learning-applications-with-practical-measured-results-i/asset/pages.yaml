    # 2. Materials and Methods


    A two-stage hybrid model for detecting bubble defects in tires is proposed in
    this work. The primary stage includes a CNN architecture for diagnosing tire bubble-defects,
    and the second stage makes use of a Faster Region-based ConvNets architecture
    for minimizing the false positive or the false alarm ratio (FAR). A flow diagram
    of the proposed two-stage ensemble hybrid model is portrayed in Figure 3.


    # 2.1. Faster Region-Based Convolutional Neural Networks


    A model referred to as Regions with CNN features (R-CNN), which is a scalable
    object detection approach that enhances the mean average precision, was established
    by the research in [15]. In the research desscribed in [16], another improved
    version of the R-CNN model known as the Fast R-CNN was deployed with various novelties
    for enhancing the training and testing speed at the same time augmenting the accuracy
    of detection. Further, the work presented in [17] established a Faster R-CNN that
    introduced an RPN which shares the convolutional features of the full image with
    the network responsible for detection; hence, this ensures that the region proposals
    are achieved at a low cost. It can be observed that the RPN approach is deployed
    instead of the Selective Search (SS) technique [18] in the case of Faster R-CNN/
    Faster Region-based ConvNets. Further, this method considerably reduces the time-period
    necessary for extracting the candidate regions and also for increasing the overall
    efficiency. Figure 4 illustrates the architectural model of the Faster R-CNN network.


    The Faster R-CNN network with a ZF-net exhibits the detection results with an
    accuracy of 59.9% for the PASCAL VOC 2007 test set [19–21]. Besides, for the same
    test set, the Faster R-CNN network with VGG16 architecture accomplishes the detection
    results with 73.2% accuracy [19–21]. Henceforth, it can be observed that the Faster
    R-CNN with VGG16 architecture achieves superior accuracy, which makes it the most
    sought after approach. Moreover, this technique is utilized in this research to
    enhance the detection accuracy of the tire bubble defects. In Figure 5, the architectural
    model of the fully convolutional region proposal network [22] is depicted.


    Figure 5 portrays the fact that the fully convolutional region proposal network
    applies a 3 × 3 window over the feature maps received from the ConvNets. Subsequently,
    for assessing the candidate regions, we make use of the anchors with various areas
    and ratios. Additionally, the chosen candidate expanses are placed into the 256-dimensional
    trajectory, and further, they are passed on as the inputs to the box regression
    layer (reg) and a box-class layer (cls). For each proposal, the outcome of the
    box-class layer approximates the target object or the non-target object probabilities.
    Consequently, a positive label will be allocated for an anchor with an Intersection-over
    Union (IoU) overlay proportion more significant than the value 0.7 in comparison
    to some ground truth box. Besides, the negative label will be allocated for the
    non-positive anchor with an Intersection-over Union proportion lesser than 0.3
    for the remaining ground truth boxes. It can be clearly noted that the anchors
    which are neither positive nor negative have no role in the training for accomplishing
    the target. In the box regression'
