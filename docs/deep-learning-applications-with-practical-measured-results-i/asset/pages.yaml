    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_242_0.png)


    Figure 1. The framework for performance evaluation of a recommending interface.


    The proposed framework can be used for any e-commerce site to automatically adjust
    the recommending interface to the needs, preferences, goals, etc., of individuals
    and optimize the interface performance, optimally setting up the positions and
    visual intensities. The prediction model is based on a deep neural network, due
    to the multi-dimensionality of the preference evaluation task, as this modeling
    technique handles such sophisticated regression problems in the most accurate
    way. In real-world solutions, PERI may produce complex evaluation measures by
    incorporating different user goals. For example, in a scenario where a user is
    only browsing, without having buying in mind, the success of RC can be defined
    as clicking on an RC and then exploring a product page, or just by looking at
    the product description. Moreover, simply attracting user interest to RC, represented
    by fixation time, can also be of huge importance, as users rely on recommender
    systems to enhance their confidence in purchase decisions [1].


    # 3. Experimental Results


    # 3.1. Eye-Tracking Experiment Structure and Procedure


    This section describes the experiment performed to collect the eye tracking and
    behavior data used to train the neural network responsible for the evaluation
    of recommending interfaces.


    Task. Each participant was given the task to shop online in order to furnish a
    studio apartment with six types of furniture. Each subject was asked to move between
    product categories and select one item from each category, according to their
    individual preference.


    Website. The experiment was composed of a recommending interface within a dedicated
    e-commerce website, developed using Drupal CMS. The website was available in Polish
    and consisted of a title, menu, product images and short descriptive text. It
    covered functions such as product list, buying cart and recommendations.


    The editorial content (EC) was placed in the central area of the screen, under
    the main menu. It contained product lists about three screens long with 10 products
    in each product category. Each product had three unique features: name, product
    image and price. There were six product categories (PC): wardrobes, chests of
    drawers, beds, bedside cabinets, tables and chairs. Products in a category were
    quite similar visually and similarly priced. In addition, under the furniture
    description there was an ‘Add to Cart’ button that stored customer choices in
    a database. Upon selection of a product, its short description was available in
    the cart preview and on the main cart page. Of course,'
  merge: -1
  img_proc: true
- pgno: 243
  md: 'it was possible to remove the product from the cart in order to allow the user
    to make changes to the final selection of purchases.


    Recommending interface. There were two alternative recommendation interface layouts,
    i.e., horizontal and vertical recommending mode. This means that the recommendation
    content (RC) section was anchored in one of two dedicated parts of the screen
    below the main menu: either on the left side of the page, next to the general
    product list (in vertical mode), or at the top of the page, above the general
    product list (in horizontal mode). Only one recommendation layout was available
    at a time, so, when horizontal mode was on, the vertical one was deactivated and
    vice versa. Figure 2 shows variants of the recommendation content (RC) location.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_243_0.png)


    Figure 2. Recommendation layouts of the recommending interface: (a) vertical;
    (b) horizontal.


    The RC section consisted of four recommendation items—RC1 to RC4—randomly selected
    from all products in a category. The section in each variant did not change its
    location on the screen when browsing products in the product category, regardless
    of the user scrolling the EC section. In fact, only general product lists were
    made scrollable to ensure reliable subject exposure to the recommendation interface.


    It was ensured that product features, i.e., name, image and price, would not stand
    out from other products in the category. It was assumed that the possible distinction
    of a particular RCi location would be achieved only by means of visual intensity
    VI. Three levels of intensity were used: standard (without any highlight)—VI1,
    flickering (slowly disappears and reappears every 1–2 s)—VI2 and background in
    red—VI3. There was a maximum of one RCi at VI2 or VI3 for each product category.
    An example of visual intensity of the last kind (VI3) is shown in Figure 3.


    Measurement equipment. Research-grade Gazepoint GP3 eye tracker, a 60 Hz update
    rate system, was utilized. The device’s nominal accuracy is 0.5–1 degree of visual
    angle. It allows for ±15 cm range of depth movement and offers 5- and 9-point
    calibration. It is powered by USB.


    Procedure. The experiment proceeded as follows. First, the test person was sitting
    at the test stand in such a way that their eyes were in the optimal range of the
    eye-tracking device’s camera. It was explained what the device for tracking eyeball
    movements is, and then the eye tracker was calibrated with Gazepoint Control software
    and a 9-point calibration method. For greater accuracy, calibration was always
    performed twice, the first time just to familiarize the subject with the process.
    There was a dual monitor setup with the operator screen invisible to the participant.
    Thanks to the correct calibration, the device was able to determine the coordinates
    of the place where the user was looking.


    The participant was then informed of their task but was not told about the purpose
    of the study. After this introduction, the subject had to furnish the apartment.
    After choosing one item from a category, the subject clicked ‘Next’ and was automatically
    moved to the next category. Category by category, the visual intensity of recommendation
    items changed every time. In addition, for the first three categories, the layout
    of RC was vertical and, after moving to the fourth category, it changed to'
