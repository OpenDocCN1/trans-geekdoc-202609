    # 2.3.2. Inception Retrain


    The InceptionV3-retrain algorithm flow can be represented as the second part of
    Figure 4. This method using InceptionV3-retrain as a foreign object classification
    model for power lines mainly utilizes the PB file derived from the InceptionV3
    model based on ImageNet image training. The last softmax layer of the model is
    changed to the foreign object image classifier, and the Bretleneck feature of
    the pre-training network is used as training data for the new classifier. When
    the new two-class network is trained by the retrain method, the parameters of
    all the layers in the previous part of the network are fixed. The program first
    loads the pre-training model of InceptionV3, and then stores the Bottleneck file
    generated after the training data set is input into the network. Then, use the
    feature data stored in the Bottleneck file to train the modified softmax layer
    as a classifier for the new task. Except for the last layer, the parameters of
    the other layers are all solidified and cannot be updated, so the training speed
    is faster and less time-consuming.


    # 2.3.3. Inception Fine-Tuning


    The InceptionV3/V4-fine-tuning algorithm flow can be expressed as the third part
    of Figure 4, and the foreign object classification model is fine-tuned under the
    InceptionV3 and InceptionV4 models provided by Google. The fine-tuning mode is
    to use a CKPT (checkpoint) file, which derived from the InceptionV3 or InceptionV4
    model based on ImageNet image training. During the training process, the parameters
    of the entire network can be modified accordingly, not only limited to the replaced
    softmax layer. The fine-tuning for InceptionV3/V4 is done by loading the pre-trained
    model without loading the parameters of the Logits layer and AuxLogits layer,
    and then fixing the parameters of all layers before. The foreign object training
    data set only trains the newly created Logits layer and AuxLogits layer.'
