    $$\begin{cases}\frac{\partial Q}{\partial \hat{\beta}_0}=2\sum(H_{Oi}-\hat{\beta}_0-\hat{\beta}_1
    H_{ii}-\hat{\beta}_2 T_i)(-1)=0\\\frac{\partial Q}{\partial \hat{\beta}_1}=2\sum(H_{Oi}-\hat{\beta}_0-\hat{\beta}_1
    H_{ii}-\hat{\beta}_2 T_i)(-H_{ii})=0\\\frac{\partial Q}{\partial \hat{\beta}_2}=2\sum(H_{Oi}-\hat{\beta}_0-\hat{\beta}_1
    H_{ii}-\hat{\beta}_2 T_i)(-T_i)=0\end{cases}\tag{6}$$

    ```


    Then Equation (7) is derived.


    ```

    $$\begin{cases}n\hat{\beta}_0+\hat{\beta}_1\sum H_{ii}+\hat{\beta}_2\sum T_i=\sum
    H_{Oi}\\\hat{\beta}_0\sum H_{ii}+\hat{\beta}_1\sum H_{ii}^2+\hat{\beta}_2\sum
