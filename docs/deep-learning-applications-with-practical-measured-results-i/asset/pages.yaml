    # An Image Compression Method for Video Surveillance System in Underground Mines
    Based on Residual Networks and Discrete Wavelet Transform


    Fan Zhang 1,2,*, Zhichao Xu 1, Wei Chen 3,4, Zizhe Zhang 3, Hao Zhong 1, Jiaxing
    Luan 1 and Chuang Li 1


    +   1. School of Electrical and Information Engineering, China University of Mining
    and Technology (Beijing), Beijing 100083, China; generalxzc@hotmail.com (Z.X.);
    anatole_hao@163.com (H.Z.); sqtl1800407113@student.cumbt.edu.cn (J.L.); zqtl1800407138g@student.cumbt.edu.cn
    (C.L.)

    2. Institute of Intelligent Mining and Robotics, China University of Mining and
    Technology (Beijing), Beijing 100083, China

    3. School of Computer Science and Technology and Mine Digitization Engineering
    Research Center of the Ministry of Education, China University of Mining and Technology,
    Xuzhou 221116, China; chenwdavior@163.com (W.C.); z23000@126.com (Z.Z.)

    4. School of Earth and Space Sciences, Peking University, Beijing 100871, China

    * Correspondence: zf@cumbt.edu.cn


    Received: 28 November 2019; Accepted: 13 December 2019; Published: 17 December
    2019


    **Abstract:** Video surveillance systems play an important role in underground
    mines. Providing clear surveillance images is the fundamental basis for safe mining
    and disaster alarming. It is of significance to investigate image compression
    methods since the underground wireless channels only allow low transmission bandwidth.
    In this paper, we propose a new image compression method based on residual networks
    and discrete wavelet transform (DWT) to solve the image compression problem. The
    residual networks are used to compose the codec network. Further, we propose a
    novel loss function named discrete wavelet similarity (DW-SSIM) loss to train
    the network. Because the information of edges in the image is exposed through
    DWT coefficients, the proposed network can learn to preserve the edges better.
    Experiments show that the proposed method has an edge over the methods being compared
    in regards to the peak signal-to-noise ratio (PSNR) and structural similarity
    (SSIM), particularly at low compression ratios. Tests on noise-contaminated images
    also demonstrate the noise robustness of the proposed method. Our main contribution
    is that the proposed method is able to compress images at relatively low compression
    ratios while still preserving sharp edges, which suits the harsh wireless communication
    environment in underground mines.


    **Keywords:** underground mines; intelligent surveillance; residual networks;
    compressed sensing; image compression; image restoration; discrete wavelet transform


    # 1. Introduction


    # 1.1. The Image Compression Demand from Underground Mines


    Coal is one of the major resources in China. In the foreseeable future, China
    will still be the largest consumer and the producer of coal [1]. Therefore, it
    is of great importance to research into technologies that contribute to the advancement
    in intelligent mine monitoring and safe mining practices.


    One of the key components of intelligent mine monitoring is the video surveillance
    system since visual information plays a key role in how a human perceives the
    world. Because digital images usually require large storage, it is natural to
    think of transmitting images with high bandwidth channels, like cable networks.
    Although cable networks could potentially provide enough bandwidth,'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'they are inflexible in that the cable networks are fixed and have to expand
    as the working surface expands. In favor of mobility, wireless networks are usually
    chosen as the information channel in mines. However, the bandwidth can be limited
    because of relatively limited narrow spaces, harsh environment diffraction, attenuation,
    and multi-path effect in underground mines. The problem can be especially serious
    when disasters such as explosion and collapse occur [2]. Therefore, it is necessary
    to investigate image compression methods in order to save the transmission bandwidth.


    # 1.2. From Conventional Image Compressing to Compressed Sensing


    There have been vast investigations into the field of image compression. Among
    the researches, JPEG (Joint Photographic Experts Group) [3] has been quite popular
    and influential. JPEG mainly employs discrete cosine transform (DCT) and entropy
    coding techniques to compress the images. While the JPEG compression method has
    gained widespread popularity, it does introduce visible artifacts including blurring,
    ringing and blocking [4]. JPEG2000 [5] is proposed forward to address the problems
    in JPEG. JPEG2000 adopts 2D wavelet transform and arithmetic coding to achieve
    higher compression efficiency.


    Besides utilizing transforms and entropy coding techniques, a theory framework
    known as compressed sensing (CS) [6–8] was proposed to overcome the limitation
    that a signal must be sampled at the Nyquist sampling rate [9]. The CS theory
    has shed light on the problem of compression and reconstruction. Optimization
    techniques such as total variation (TV) minimization [10] and approximate message
    passing (AMP) [11] can be used in the recovery phase in the CS framework. TV minimization
    for image denoising was first introduced in [12]. TV minimization takes the advantage
    that it can better accurately preserve the edges or boundaries at certain compression
    ratios. In [13], the method “total variation minimization by augmented Lagrangian
    and alternating direction algorithms” (TVAL3) is proposed and has been used widely
    in image recovery problems. Comparisons in [14] suggest that the TVAL3 solver
    turns out to be fast and efficient so long as the reconstruction parameters are
    sufficient for a satisfying reconstruction. Meanwhile, based on the AMP [11] recovery
    algorithm, the D-AMP [15] algorithm is proposed to enhance CS recovery. In the
    scheme of D-AMP, the existing rich knowledge of signal denoiser is utilized to
    design the solver. Tests in [15] show that the D-AMP maintains a low computational
    footprint. Compressed sensing-based techniques have been explored in real-life
    scenarios like mine monitoring image compression [16] and landslide monitoring
    system [17]. The non-learning compressed sensing methods do achieve some success,
    but they struggle to produce sound recoveries at low compression ratios.


    # 1.3. Data-driven Approaches


    Due to the advancement of information technology, more data is within the reach
    of researchers. The data-driven approaches have found their way into various fields
    including signal processing [18], control systems [19–22] and especially vision
    tasks [23–27]. In particular, the deep learning-based method has stood out among
    the data-driven approaches. This section explores the recent development of deep
    learning-based image compression methods.


    # 1.3.1. Convolution Neural Network based Image Compression


    In more recent years, convolution neural networks (CNNs) has gained great attention
    due to the improvement of computing devices. As for image compression utilizing
    CNN, it generally involves designing image codecs with neural networks and constructing
    appropriate loss functions.


    One genre of compression method combines the ideas of compressed sensing into
    CNN. For instance, the network DeepInverse proposed in [28] uses fully connected
    layers to simulate the compression process and stacks convolution layers for decompression.
    Back-propagation is applied to train the networks. This idea is extended further
    by ReconNet [29] which uses more convolution layers to attack the decompression
    problem. In [30], a deep residual reconstruction network is proposed to recover
    images more accurately. However, this series of methods are more likely to blur
    edges'
