    # 4. Results


    # 4.1. Calculation of Various Evaluation Indicators


    # 4.1.1. Calculation Formula for Classifier Evaluation


    After the above test, the paper analyzes the classification results of the first
    stage, and draws the receiver operating characteristic (ROC) curves of the SVM,
    InceptionV3-retrain, InceptionV3-fine-tuning and InceptionV4-fine-tuning models,
    as shown in Figure 7. The abscissa of the ROC curve is false positive rate (FPR),
    the ordinate is true positive rate (TPR), and the area under curve (AUC) is defined
    as the area under the ROC curve. When a positive sample and a negative sample
    are randomly selected, the probability that the current classification algorithm
    ranks the positive example before the negative example based on the calculated
    score is the AUC value. Therefore, the larger the value of AUC, the more likely
    the current classification algorithm is to sort the positive samples before the
    negative samples, which enables better classification. The above values can be
    calculated using Equations (3), (4) and (5), respectively,


    $$TPR = \frac{TP}{TP + FN},$$ (3)


    $$FPR = \frac{FP}{FP + TN},$$ (4)


    $$AUC = \int_{0}^{1} TPR\,dFPR,$$ (5)


    where TP : True positive; TN : True negative; FP : False positive; TN : True negative.
    At the same time, the point selected according to the Youden index is plotted
    in Figure 7. The ROC curve is often used as an evaluation curve for medical diagnosis.
    When a comprehensive evaluation of the diagnosis results is required, the sensitivity
    and specificity can be given the same weight in the medical field. It is characterized
    by the same significance of the missed diagnosis rate and the misdiagnosis rate
    of the research object. The larger the Youden index, the better the screening
    ability. See (6) for the calculation method. The x-axis of the ROC curve is (1
    − specificity), so the final formula can be simplified to Label (7):


    $$Youden\ index = max(sensitivity + specificity - 1),$$ (6)


    $$Youden\ index = max[sensitivity - (1 - specificity)] = max(TPR - FPR).$$ (7)'
