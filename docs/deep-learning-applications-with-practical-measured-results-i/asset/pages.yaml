  md: 'Article


    # Modeling and Analysis of Adaptive Temperature Compensation for Humidity Sensors


    Wei Xu, Xiaoyu Feng and Hongyan Xing *


    Jiangsu Key Laboratory of Meteorological Observation and Information Processing,
    Nanjing University of Information Science & Technology, Nanjing 210044, China;
    xw@nuist.edu.cn (W.X.); 20162281511@nuist.edu.cn (X.F.)


    * Correspondence: xinghy@nuist.edu.cn


    Received: 2 March 2019; Accepted: 8 April 2019; Published: 11 April 2019


    **Abstract:** In addition to being sensitive to humidity, humidity sensors with
    moisture sensitive elements are also sensitive to ambient temperature. The fusion
    of temperature and humidity data is an effective way to improve the accuracy of
    humidity sensors. In view of the problem of insufficient adaptive ability and
    poor universality in the current compensation algorithm, a piecewise processing
    of measured error at different temperatures by using multiple linear regression
    is proposed in this paper. The least squares method and back propagation (BP)
    neural network improved by a genetic simulated annealing algorithm (GSA-BP) were
    used to compensate the measured humidity data of different temperature ranges.
    The efficiency of the GSA-BP algorithm was tested, and the compensation function
    model was established. The compensation accuracy was also compared with the accuracies
    obtained by other methods. The experimental results show that the adaptive segmentation
    compensation method can significantly improve the measured error of the humidity
    sensor over a wide temperature range.


    **Keywords:** humidity sensor; data fusion; nonlinear optimization; multiple linear
    regression; GSA-BP


    # 1. Introduction


    Automatic weather stations monitor changes in the climate environment in real
    time. The meteorological sensors are susceptible to ambient influences and their
    measurement errors exist objectively [1]. Usually, the humidity sensor used in
    automatic weather stations is a voltage output type polymer film humidity sensitive
    capacitance sensor, which senses the humidity through the humidity sensitive capacitor
    and then converts it into a voltage amount by the conversion circuit [2]. The
    humidity sensitive capacitor is mainly composed of an upper electrode, a humidity
    sensitive material, a lower electrode and a glass substrate. The humidity sensitive
    material is a high-molecular-weight polymer with a dielectric constant that changes
    with the relative humidity of the external environment. In addition to being sensitive
    to ambient humidity, humidity sensitive materials are also sensitive to temperature.
    The temperature coefficient is not a constant but a variable. Nonlinear compensation
    for measured data of the sensor is often required [3,4].


    The humidity sensor manufacturer and meteorological calibrator will compensate
    for the influence of temperature on the measurement results, but the compensation
    effect is not ideal under low temperature (−20 °C) or high temperature (+50 °C)
    conditions, and the compensation algorithm is not universal over a wide temperature
    range. It is important to study an efficient and adaptive compensation method
    for improving the calibration efficiency.


    In recent years, many scholars have compensated sensors using both hardware and
    software and have achieved some notable results. References 5 and 6 proposed using
    a conditioning chip and concentric wheatstone bridge circuit to compensate [5,6],
    but this hardware compensation circuit is subject to electronic components’ temperature
    drift and process technology constraints, which results'
