    # 5. Conclusions


    The multivariate time series forecasting is investigated by introducing a novel
    M-TCN model, in order to compare with traditional models and especially deep learning
    (generic recurrent architectures such as LSTM; generic convolutional architecture
    such as TCN; hybrid architectures such as ConvLSTM and MALSTM-FCN.). In M-TCN,
    the dilated network is employed as a meta-network and asymmetric residual blocks
    are constructed. The proposed approach significantly improved the results in time
    series forecasting on benchmark datasets of Beijing PM2.5 and ISO-NE. Our research
    focuses on the trade-off between implementation complexity and prediction accuracy.
    With in-depth analysis and empirical evidence, the results indicate a prominent
    efficiency of M-TCN.


    For future research, we will focus on the extraction technology based on higher-order
    statistical features instead of fully connected layers, which can reduce the parameters
    of the model and training time.


