    Z-range parameter setting. The first step is to choose an area of this raw surface
    with appropriate size and location, targeting at minimizing the influence of defects
    and removing outliers [32] by selecting valid grid positions with loss of the
    uniformity of the grid. Figure 4 shows a surface reconstruction by trimming the
    raw data with 10% edges along the X- and Y-directions. As there are too many measurement
    defects when y > 800 μm, this part is also abandoned.'
