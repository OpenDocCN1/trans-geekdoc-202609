    # 2.2. Performance Assessment


    The performance assessment includes a set of mathematical criteria that measure
    the prediction errors. To fully examine the proposed model performance, we used
    a set of different mathematical criteria. Let $p_m^a$ and $p_m^f$ be the actual
    and predicted wind speed values of the $m$-th day of the test set, $m = 1, 2,
    \dots, M$, respectively. The indicator considered for the assessment are the Absolute
    Error (AE), the Mean Absolute Error (MAE), the Root Mean Squared Error (RMSE),
    and the Mean Absolute Range Normalized Error (MARNE) as defined in Equation (10).
    The AE is defined as


    $$AE = \sum_{m=1}^{M} |p_m^a - p_m^f| \tag{7}$$


    The MAE corresponds to the sum of all AEs:


    $$MAE = \frac{1}{M} \sum_{m=1}^{M} |p_m^a - p_m^f| \tag{8}$$'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'The RMSE is expressed as


    RMSE = 1/M sqrt( sum_{m=1}^{M} (p_m^a - p_m^f)^2 )  (9)


    The MARNE is the absolute difference between the actual and forecast wind speed,
    normalized to the maximum wind speed:


    MARNE = 1/M sum_{m=1}^{M} |p_m^a - p_m^f| / max(p_m^a) × 100  (10)


    As benchmarks for the proposed model test, the individual applications of FFNN
    and ANFIS are used.


    # 3. Simulation Results


    # 3.1. Wind Speed Forecasting


    Computational intelligence-based systems are a favourable scheme in recent years
    in various variable predictions, such as electric load, over traditional time
    series models. However, a careful selection of inputs and a proper training phase
    are essential for the model’s successful implementation and utilization. The selection
    of the types of inputs is crucial to the forecasting success. In the present study,
    various input combinations are examined. The objective is to test computational
    intelligence-based models for the case of incomplete data. Three models are compared
    that refer to an FFNN, an ANFIS, and a proposed FFNN-ANFIS. After the decision
    of the types of inputs, i.e., Case#1–Case#5, the next test is to define the number
    of inputs. This number refers to the historical values of the used parameters:
    wind speed, temperature and wind direction. With the application of the Sample
    Autocorrelation Function (SAF), the historical values are evaluated based on the
    correlation of the present value. Figure 5 displays the SAF that resembles the
    minute-ahead wind speed set. Only the first 20 values are displayed. It is shown
    that the correlation is decreasing progressively when the lagged value becomes
    more time distant. The same conclusions are drawn from the 10 min ahead set. The
    first five values are selected as inputs for the models. Also, the corresponding
    values of temperature and wind direction are proportionally selected.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_23_0.png)


    Figure 5. Sample autocorrelation function values of the wind speed data set.


    Employing the minute-ahead set and the data set of Case#1, a series of experiments
    were conducted for the purpose of defining the optimal FFNN and ANFIS structures.
    The optimal FFNN structure has one hidden layer. The tangent sigmoid function
    is used both for the hidden and output layers. The number of training epochs is
    set equal to 100. The optimal number of neurons in the hidden layer is defined
    also by series of simulations. It differs among the various cases. Thus, a series
    of FFNN executions took place to track the number of hidden layers that minimize
    the RMSE indicator.'
