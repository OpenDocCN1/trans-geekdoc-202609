    # 2.2. Model Assumptions and Multiple Constraints


    The aim of this study is to find the best optimal trajectory planning for an UAV
    under the limit of the positional accuracy of a UAV system, which is a multi-constraint
    combinatorial optimization problem.


    Assume that the flight area of an UAV and the safe positions is as shown in Figure
    1. The starting point is A and the ending point is B. The constraints of its trajectory
    are as follows:


    (1) A UAV needs real-time positioning during flight, and its positioning error
    includes vertical error and horizontal error. For every 1m flight, the vertical
    error and horizontal error will be increased by δ dedicated units, respectively.
    The vertical error and horizontal error should be less than θ units when reaching
    the ending point, and for the sake of simplification, assume that when the vertical
    error and the horizontal error are both less than θ units, an UAV can still follow
    as the planned trajectory to fly.


    (2) A UAV needs to correct the positioning error during flight. There are some
    safety positions in the flight area (called correction points) can be used for
    error correction. The type of the correction point includes horizontal and vertical
    correction points. If a UAV reaches the correct point, the error can be corrected
    based on the type of the correct points, assuming that the safety positions in
    the flight area (i.e., the position of the correction points) is determined before
    flight trajectory planning. Figure 1 is a schematic diagram of a certain trajectory.
    If the vertical error and the horizontal error can be corrected in time, a UAV
    can fly according to the predetermined trajectory, and finally reaches the destination.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_86_0.png)


    Figure 1. Schematic diagram of an UAV trajectory planning area. The yellow points
    are the horizontal error correction point, the blue points are the vertical error
    correction point, the starting point is point A, and the destination is point
    B. The black curve represents a trajectory.


    (3) At the starting point A, the vertical and horizontal error of an UAV are both
    zero.


    (4) After the correction of the vertical error correction point, the vertical
    error will become zero and the horizontal error will remain unchanged.


    (5) After the correction of the horizontal error correction point, the horizontal
    error will become zero and the vertical error will remain unchanged.'
