    The spectral information was processed as follows: Assume that the size of hyperspectral
    data was I1 × I2 × I3. At first, the one-dimensional spectral information of the
    central pixel with the size of 1 × 1 × I3 was superimposed by n times to obtain
    the one-dimensional spectral information of 1 × (n × I3). Then a one-dimensional
    spectral vector equal to m × m was intercepted and reshaped to a two-dimensional
    spectral matrix of m × m. Then a m × m × 6 spatial-spectral patch was obtained
    by superimposing three spectral information layers and combining the superimposed
    information with the three spatial-spectral information extracted by the IM method.


