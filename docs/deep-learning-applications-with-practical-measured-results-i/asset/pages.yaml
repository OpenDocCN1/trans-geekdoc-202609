  md: '# 3. Methodology


    In this section, the time series forecasting problem is formulated first. In addition,
    then the baseline models, ConvLSTM and Multivariate LSTM FCN are presented to
    be used as the methods in our comparative evaluation. Finally, M-TCN model is
    introduced.


    # 3.1. Sequence Problem Statement


    From the nature of machine learning, to minimize the expected error, it requires
    obtaining an ideal nonlinear mapping from a historical dataset to a current state,
    especially for hazard events forecasting. The prerequisite is to employ enough
    characteristic parameters to feature the various phenomena, which makes the current
    state strictly dependent on the historical dataset. The problem of multivariable
    time series prediction is defined as the problem of sequence to sequence in this
    paper. Before defining the network structure, more formally, given an input sequence
    time series signal X = (x1, x2, ..., xT) with x1 ∈ R^n, where n is the variable
    dimension, we aim at predicting corresponding outputs Y = (y1, y2, ..., yh) at
    each time. The target of sequence modeling network is to obtain a nonlinear mapping
    to the prediction sequence from the current state as:


    (y1, y2, ..., yh) = f (x1, x2, ..., xT). (1)


    # 3.2. Baseline Test


    To build a baseline test benchmark, the traditional models, naive forecast, average
    approach forecast and seasonal persistent forecast models are included for a cross
    evaluation.


    Naive forecast model: It takes the value from the last hour prior to the forecast
    period (e.g., 24 h) and uses it as the value of a dataset for each hour in the
    forecast period (e.g., 1 to 24 h). Using the naive approach, forecasts are produced
    that are equal to the last observed value. This model is defined as:


    ŷT+1 = yT, (2)


    where yT is the past data, and ŷT+1 is the next time value.


    Average approach forecast model: In this model, the predictions of all future
    values are equal to the mean of the past data. This method can be used for any
    type of data available in the past and defined as:


    ŷT+1 = ȳ = (y1 + ... + yT) / T, (3)


    where (y1, y2, ..., yT) is the past data, and ŷT+1 is the next time predicted
    value.


    Seasonal persistent forecast model: It defines the same time period a year ago
    as the predicted value. This method accounts for seasonality by setting each prediction
    to be equal to the last observed value of the same season. This model is defined
    as:


    ŷT+1 = yT-Y, (4)


    where yT-Y is the past data, and ŷT+1 is the next time predicted value.


    # 3.3. ConvLSTM Encoder–Decoder Model


    A convolutional LSTM (ConvLSTM) encoder–decoder network is built in this work,
    which reconstructs the input sequence and predicts the future sequence simultaneously.
    The ConvLSTM input layer is designed to be a 4D tensor [timestep, row, column,
    channel], where timestep is the number of subsequences, row is the one-dimensional
    shape of each subsequence, column is the hours in each subsequence and channel
    is the features that we are working with as input. The encoding ConvLSTM compresses
    the whole input sequence into a hidden state tensor and the decoding LSTM unfolds
    this hidden state to give the final prediction. An overview of the ConvLSTM is
    shown in Figure 1.'
