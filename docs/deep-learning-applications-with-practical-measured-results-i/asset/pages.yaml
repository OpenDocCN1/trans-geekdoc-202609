    generated by the baseline model NACM and the quality score of evaluation generated
    by the GNACM model. The two systems output audio comments by inputting different
    audios. Multiple experts score the corresponding comments of the output multiple
    audios. The average score obtained is the system evaluation quality score corresponding
    to each expert. The process of collecting expert comments is that we first get
    the test results, then send the audio and generated comments to the anonymous
    experts, and then the experts send their score results to us, and finally sort
    out each expert score on the quality of the generated evaluation. Among them,
    we asked experts to rate the audio and comments given on a 100-point scale. As
    Figure 6 shown, we can find that the quality score of the comment generated by
    GNACM is better than NACM.'
