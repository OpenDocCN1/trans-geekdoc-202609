    of an UAV throughout the flight, $\eta_i$ represents the distance of an UAV''s
    $i$-th flight, $\lambda_i$ represents the correction distance of the $i$-th flight
    to the vertical error correction point, $h_i$ represents the correction distance
    of the $i$-th flight to the horizontal error correction point, $a_i$ represents
    an UAV''s $i$-th flight reaches the vertical error correction point, and $b_i$
    represents a UAV''s $i$-th flight at the horizontal error correction point.'
