    # 5.2. Segmentation Optimization Compensation Model


    Through the above theoretical analysis and verification of experimental data,
    the influence of temperature on the humidity sensor can be seen. One hundred and
    fifty sets of data obtained by repeating experiments on the same humidity sensor
    were used as training samples, and 15 sets of data were used as network test samples.
    The process of establishing a humidity compensation model is as follows:


    +   1. Read the measured data set and interpolate it. The temperature points set
    in the experiment have some discreteness. So the continuous function is added
    on the basis of the discrete data and that the continuous curve passes all the
    given discrete data points. The interpolated data will be compensated for later.

    2. Read two groups of temperature and corresponding humidity in sequence from
    the temperature of 25 °C, use the binary linear regression function to regress
    the data after interpolation, and determine the regression effect according to
    the value of the criterion R². When R² ≤ 0.911, the regression is stopped. The
    value of R² is 0.8468 when the experimental data stops returning. The'
