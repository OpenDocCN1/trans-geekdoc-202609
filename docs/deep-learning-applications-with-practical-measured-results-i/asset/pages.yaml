    # 4. Discussion and Concluding Remarks


    Offshore wind turbine installations are continually gathering the research interest
    since they are considered an efficient mechanism for covering the electrical needs
    of various isolated loads. The present study emphasizes on the development of
    an effective method for very short-term wind speed forecasting under the limitation
    of wind speed series that do not present consistency in time, i.e., there are
    interruptions in the date sequence. Real measured data are used for the training
    of the developed method. An ensemble data-driven short-term wind speed forecasting
    model is developed, tested, and applied. The term “ensemble” refers to the combination
    of two different predictors that run in parallel and the prediction is obtained
    by the predictor that leads to the lowest error. The proposed'
  merge: -1
  img_proc: true
- pgno: 30
  md: 'model utilizes the wavelet transform and is compared with other models that
    have been presented in the related literature. The main conclusions of the present
    study:


    +   - The proposed forecasting model can be used effectively for 1 min and 10
    min ahead horizon wind speed predictions.

    - The exogenous variables (i.e., wind speed direction and air temperature) decrease
    the prediction accuracy. The best results are obtained using the DWT.

    - The highest errors are met on winter days and especially in instances with high
    wind speed.

    - There is no correlation among the forecasting error and the wind direction.

    - The hybrid model (combination of FFNN and ANFIS) leads to better forecasts in
    all examined data set cases.

    - The proposed model outperforms the accuracy of other forecasting models that
    have been presented in the related literature.


    The research of the present paper will be further expanding by checking the implementation
    of the forecasting problem in the Wind Farm Layout Optimization (WLFO) problem
    incorporating wake effects with the use of specific mathematical or numerical
    models. Forecasted wind speed time series can serve as inputs to the problem.
    By estimating future wind speed values, the WLFO can be modified to a scenario-based
    problem where different wind speed forecasts can lead to various WLFO solutions
    and thus, assessing the level of influence of the future wind speed variations
    in the outputs of the optimization problem.


