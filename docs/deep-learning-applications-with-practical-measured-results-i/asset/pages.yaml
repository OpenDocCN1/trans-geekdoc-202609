- pgno: 143
  md: '# 5.3. Analysis of Failure Cases


    Target re-detection is an essential part in the whole process of tracking, into
    which consideration has to be put by all model update strategies. There are some
    failure tracks that the reappeared targets that have ever been out of the scene
    are retracked in vain due to the lack of re-detection mechanism by the tracker
    or improper update methods serving for re-detection. For instance, the walker
    reappears in the scene after long time of out-of-view in Pedrstrian2. ODLR [39]
    fails to capture it again due to the use of false positive samples for the dictionary
    construction. This is attributed to the lack of the re-detection process that
    ODLR has poor ability in relocating targets after heavy background drifts or target
    losses. Additionally, for Suv, where the target reappears after occlusion, MSRBT
    [54] does poorly in recognizing it. HCF [29] fails to recapture the targets in
    Girl2 and Lemming when they return visible.


    There remains a question of making use of valuable features of small targets in
    visual tracking. ODLR performs not so well on Skiing, owing to the fact that there
    is not sufficient target information for the construction of the target dictionary
    because of much too small size of the target, thus the target cannot be properly
    described by the model. For TBE [12], which puts important attention to the background,
    the background occupies nearly the entire image when the target is excessively
    small, hence appearance features of the target are hard to learn by the tracker,
    thus drift problems exist in some snatches of the sequences where the targets
    are comparably much smaller.


    There are also some failure cases in some videos where situations of fast motion,
    rotation, background clutter, irregular illumination distribution, etc. exist.
    Although DSARCF [56] can handle scale variation and deformation problems perfectly
    due to the use of saliency information, it fails in utilizing the feature information
    of targets with faster moving speed, especially when the background moves together
    with the target, where the saliency map loses its function. For instance, the
    background moves upwards or downwards along with the diving athlete in Jump, in
    which the backgrounds in the adjacent frames have more differences than in the
    normal conditions, which prohibits the filter in the previous frame from valid
    detection in the current frame. The saliency map cannot work well either on the
    sequence of Matrix, where there are influences of low resolution and background
    clutter, bringing about target loss in tracking the later part of the sequence.
    For Dragonbaby, where the face of the baby disappears and its arm becomes distinct,
    the bounding box permanently drifts to the region of the arm. CLIP [34] is not
    to able to cope with the rotation problems in which handcrafted target features
    are used, leading to the drift in MotorRolling where the target rotates and translates
    rapidly simultaneously, which is also failed to track by MSRBT that also utilizes
    handcrafted features with limited robustness only, owing to the fact that target
    rotation implies the transformation of its spatial orientation. Despite the capability
    that PF can well calculate the states of targets in silent videos, it does not
    work well in estimating the states of moving objects, thus performs much poorer
    in the videos where targets move much more drastically. For instance, LSA [17]
    wrongly estimates the target''s states in CarScale. Besides, LSA has poor ability
    in distinguishing responsible patches from occluded ones owing to the mechanism
    of linear regression, hence it has poor performances on the sequences with mixed
    challenging factors, such as Ironman and MotorRolling. Due to the fact that deeper
    layers of a network extract more semantic features, HCF can not discriminate the
    dark target singer and the bright background, since the features that are extracted
    by the first layer are reliable enough to complete the classification.


    # 5.4. Module Summary


    In this module, approaches of model construction and update strategies that are
    based on paper researches in recent years are listed and some typical performances
    of the trackers are briefed in the first subsection. In the second subsection,
    excellent performances of the recent trackers under challenging factors, which
    are occlusion, background interference, illumination variation, rotation, scale
    variation, and deformation are illustrated in order in detail. Advantages of the
    update strategies of each tracker are illustrated based on specific tracking cases
    and analyses regarding model construction and update'
  merge: -1
  img_proc: true
- pgno: 144
  md: 'mechanism are given to account for those merits. In the third subsection, some
    failure tracking cases are listed and the remaining problems of the listed trackers
    are explained.


    Through the performance results, we can draw a conclusion that the framework of
    a tracker lays the foundation of its basic quality, while the update approach
    reflects its robustness and adaptability. Detailed conclusions are drawn by the
    analysis of diverse update mechanisms, which are illustrated below.


    (1) Local representation of a target makes the tracker much easier to detect the
    local parts of the target. An independent update of each local patch guarantees
    that the tracking model can well capture more reliable local appearances of target
    local parts. On the basis of animal’s selective attention mechanism, it is not
    necessary to fix attention on the whole object when tracking it, whereas only
    the typical characters of the target rather than others are sufficient for use
    as the attention for visual detection. In addition, it is better to design a multiple-tracker
    framework that each part of a target is independently tracked to reduce the complexity
    of training samples and the irregularity of sample distribution. Lots of researches
    have proved that frameworks with local patterns perform stronger robustness under
    many challenging situations as compared to that with mere global patterns, especially
    under the state of partial occlusion, although of which state the occluded parts
    of the target template cannot be updated, the remaining visible parts can still
    be used for detection and location and their corresponding parts of the template
    can be dynamically updated to make the model adapt to the newest target appearance.
    Examples of L3SCM [24], TPS [14], MSRBT [54], etc., have verified the robustness
    of tracking under partial occlusions. In addition, rotation problems can also
    be dealt with by local patterns. When in-plane rotation happens, all of the target
    parts remain visible and there is just the rearrangement of places order of the
    parts, while during out-of-plane rotation, some of target parts remain visible.
    Under these cases, the old visible parts contain valuable information regarding
    the location of target parts, thus independent update of each target part makes
    sure that symbolic target parts provide the most assistance for the location of
    the whole target. Some researches also have shown the effectiveness of local patterns
    in dealing with rotations, as for the instance of LSA [17], where the valid patches
    provide a lot of contributions to the target detection under the states of in-plane
    and out-of-plane rotations.


    (2) The utilization of multiple features makes the tracker much more excellent
    in figuring out the target under some special situations. Independent update of
    different feature parameters can make the tracker avoid the disturbances of environmental
    changes, which is also an approach that disassembles the complexity of initial
    training samples. As different features describe a target from diverse respects,
    the contribution of each feature is not constant in different periods of tracking
    [58]; hence, it is better to adopt feature-specific update methods. As for the
    instance of illumination variation, the target passively changes its appearance
    along with the illumination change of the environment, during which period some
    features have undergone apparent changes, i.e., gray feature [54], while some
    do not change so much, i.e., HoG [14]. In this case, illumination-insensitive
    features, like HoG, are of better use for target detection and larger weights
    should be given on it, while features sensitive to illumination, such as gray
    feature, should be given smaller weights to reduce the impact of noise.


    (3) Features that are extracted by layers of different depths in a deep neural
    network also do different performances on tracking, and the highest-level features
    are not always the most effective. In the process of visual tracking, the only
    work is to separate the target from the background and then locate it, rather
    than obtaining the semantic features of the target and its surroundings, thus
    sometimes features that are extracted by deeper layers are less important than
    shallower ones. The failure case of tracking the actor in Singer2 by HCF [29]
    has indicated the drawback of the high-level feature extracted by deep layers,
    whereas the features that are extracted by the first layer do the best performance
    on the contrary under this situation. The example of LSHR [33] has also explained
    that each layer has its own excellence in the discrimination, where features that
    are extracted by the first layer are best at dealing with low resolution problems,
    while features by the third layer do the best in handling with rotations and features
    by the fifth (deepest) layer performs best in occlusion cases. The update strategy
    that'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'takes the contribution of each layer into consideration and gives full play
    to the advantages of each layer improves the robustness of the tracking network
    to a great extent.


    (4) Target re-detection is an especially essential part in tracking, and the positive
    samples from the first frame reused for update help with recovery of the target.
    Tracking failures of MSRBT [54], HCF [29], and ODLR [39] have explained this significance.
    The positive and negative samples are used for the dictionary construction in
    [51], in which the dictionaries are adopted for the target re-detection. The RDLT
    tracker does perfectly under the situations of out-of-view and full occlusion
    thanks to the re-detection mechanism and update policy. Due to the fact that a
    target might also vary its appearance in the process of temporary leaving off
    from the scene or being fully occluded, it is not responsible enough to merely
    use the latest appearance models in the moment before its disappearance. Like
    the training approach in object detection, theoretically target images, including
    all of the target appearances ever appeared, should be used as the retraining
    sample set. However, though positive samples from some best tracked frames can
    also help with re-detection, target samples from the first frame are believed
    as the most credible and share some characters with the recovered target, even
    if the appearance of them may not be so close due to the impact of noise and other
    environmental disturbances, thus the update methods that take the positive samples
    from the first frame into account make better performances on target re-detection.
    Instances of ELMAE [29] and DNT [27] have also verified this effectiveness.


    (5) An excellent update strategy of the background models helps with more precise
    target location. Owing to the continuity of target movement in the background,
    positions of the target in the surroundings in adjacent frames are very close;
    hence, characters of the surroundings of the target contain valuable information
    for target location in the next frame. Examples of BoW (BoF) based models are
    supportive of this conclusion. It is good to adopt dense sampling to make each
    surrounding region more representative since the background has more diversity
    appearances.


    (6) The saliency feature of the target provides the tool for the estimation of
    target scale and shape. The scale and shape of the target in the saliency map
    highly reflects those in the original image due to the characteristic of the target
    that it should be a salient object, thus the saliency feature does well in handling
    scale variation and deformation. The precise estimation of the target scale and
    shape by DSARCF [56] shows its function.


    # 6. Summary and Outlooks


    This review has given detailed analysis of the visual tracking model update approaches
    in recent years, where discussions about target model update occasions and strategies
    as well as approaches of background model update are illustrated in order, and
    specific performances of sequence tracking are then exemplified. The merits and
    drawbacks of the listed trackers in recent researches are illustrated afterwards
    and conclusions regarding the performances with respect to model construction
    and update are briefed. In light of the problems remaining in the latest tracking
    performances posing challenges to future researches, to make future tracker frameworks
    more applicable, focuses with respect to the model update training of visual tracking
    should be fixed on the following aspects.


    (1) Adoption of the background information should be further enhanced and algorithms
    for dynamic background appearance model update need to be designed. In view of
    the truth that a target must exist in a specific environment, information regarding
    the background that surrounds the target provides sufficient information for target
    location, which can wonderfully help with discriminating the true target and the
    similar objects in the surroundings. Encoding and updating the background model
    should well be respectively conceived from the angles of the global pattern and
    local ones, of which the former gives the requirement that relationships among
    each background parts should be encoded for the holistic description, which provides
    useful information for the rough location of the target. When the tracked target
    becomes much too smaller than that in the first frame, the holistic character
    of the surrounding background rather than the target itself is better to be tracked,
    hence the problem of the model construction of small targets can be greatly alleviated.
    Besides, the hard problem of rapidly'
  merge: -1
  img_proc: true
- pgno: 146
  md: 'moving background can also be well settled. Therefore, a network that has the
    ability to recognize the position and distance relationships among different background
    parts should better be designed, which should be an application in object position
    recognition. The latter namely local patterns requires that the set of characters
    in the regions of surroundings which includes the most evident symbols for target
    location should be searched out as the auxiliary feature, which is close to the
    mechanism of animal’s selective visual attention that symbolic background areas
    ought to be given more visual attentions, thus the moving speed of a target can
    be well estimated with the help of these background auxiliaries. Based on the
    tool of the target response map, the response map of background regions should
    be made use of to decide whether the holistic model or the local model needs to
    be updated.


    (2) Saliency information should be adopted as an important feature. As random
    variations of the target scale and shape also constitute the challenging factors,
    though some target state estimation models, like PF, scale CF, etc., perform well
    in calculating the size and shape of targets, they are not always credible due
    to the extent of target movement and restriction of datum complexity, whereas
    the saliency map of the target naturally represents the shape and size of it in
    the original image; therefore, it can be regarded as a responsible feature for
    the state estimation of the target, which gives the guidance of target detection
    under partial occlusions that lays the foundation of target appearance update
    in this situation. Although there are failures that the saliency map does not
    work well on some sequences, it is better to be used after the raw detection of
    the target for further state estimation instead of using as an appearance template
    before target search, and it should be preserved as a state template for the reference
    of target state calculation in the next frame.


    (3) It makes a tracker more robust to make adequate adoption of features extracted
    by different layers to achieve more responsible target detection and location,
    and a multiple-feature based template model should be utilized. Like handcrafted
    features, neural network features that are extracted by different layers express
    the target and background from different aspects, making different contributions
    to the tracking performance, hence the tracking performances by different layers
    ought to be considered for update. To make deep neural network frameworks give
    more adequate play in many computer vision applications, it ought to be an excellent
    idea to make use of layers of any depth for specific usages. In light of the fact
    that the feature that was extracted by one deeper layer is further processed and
    extracted from that by the previous shallower layer, the complexity of the feature
    information increases with the depth of the layer. Yet, the feature information
    by the higher level sometimes provides more contribution, while in other cases
    lower level features contribute the most on the contrary. Inspired by the cascade
    template update approach in [61], cascade adoption of the features by different
    depth of the layers should be taken into consideration to assess the tracking
    performance using the performance score of each layer in depth order. Meanwhile,
    the template corresponding to each layer should be set up. If the performance
    score of the shallower layer is higher than a predefined threshold, the template
    corresponding to this layer needs to be updated meanwhile update of the templates
    corresponding to deeper layers should be temporarily disabled. Target matching
    should also be done in the cascade mode. if the template corresponding to a layer
    matches to the target candidates with too high confidence, those to the matching
    of the templates corresponding to the higher levels should also be stopped in
    this turn. The proposed cascade method is able to prohibit the interference from
    irrelevant features, thus time expense aroused from feature selection can be reduced.


