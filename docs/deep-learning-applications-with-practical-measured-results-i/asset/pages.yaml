  md: 'in high cost and poor compensation. Software compensation has become a research
    hotspot because of its low cost, strong applicability and high compensation accuracy.
    In 2014, reference 7 proposed a combination of hardware and software. The circuit
    was first designed and compensated by the extreme learning machine (ELM) [7].
    The hardware compensation circuit itself would be affected by the ambient temperature,
    the ELM algorithm easily produced the over fitting problem, and the optimal effect
    could not be obtained. Reference 8 proposed using principal component analysis
    (PCA) to improve the back propagation (BP) neural network for nonlinear compensation
    [8]. PCA was the most widely used method of reducing the dimension and error correction.
    In practical applications, when gross corruptions existed, PCA could not grasp
    the real subspace structure of the data well, and the algorithm had no universality.
    In 2015, reference 9 used a particle swarm optimization (PSO) algorithm to optimize
    the nonlinear compensation method of the BP neural network. PSO had no crossover
    and mutation operations [9], and the search speed was fast, but it lacked dynamic
    speed adjustment and would easily fall into a local extremum. The ability to adapt
    to ambient temperature was not strong. In 2016, reference 10 proposed using the
    least squares support vector machine (LS-SVM) to compensate [10]. Compared with
    the artificial neural network, the LS-SVM could overcome the shortage of long
    training time and was faster than SVM in solving equations. The solution satisfied
    the extreme condition, but it could not guarantee that it was a global optimal
    solution, and there was still the problem of easily falling into a local extremum.
    All of these compensation methods simply applied an algorithm to the sensor compensation
    and did not account for the influence of temperature, making the compensation
    method less adaptive, and making it difficult to guarantee the superiority of
    the compensation algorithm over a wide temperature range.


    In recent years, we have conducted considerable research on the nonlinear compensation
    of humidity sensors. From 2012 to 2017, we proposed an improved BP neural network
    nonlinear compensation method, which used a genetic algorithm (GA) to optimize
    the weight and threshold [11,12]. The method avoided the BP neural network plunging
