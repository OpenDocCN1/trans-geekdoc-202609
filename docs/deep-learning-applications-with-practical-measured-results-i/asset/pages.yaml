    # 4. Conclusions


    In this paper, we propose a CNN based image codec network which acts as the basis
    for the compression and recovery of images. We also propose a novel loss function
    that combines the knowledge of discrete wavelet transform to attack the problem
    of edge blurring in the recovered images. The proposed method is more suitable
    for the compression and recovery of underground mine images in that:


    +   - The proposed method recovers sharp edges in the images. For underground
    mines, edges in the image are the key component to distinguish the foreground
    and background. By determining the boundaries of miners and equipment, it is possible
    for further image analysis to carry out.

    - The proposed method features noise robustness. By blurring the dense patterns,
    the proposed method can filter out the noise especially seen in underground mines.

    - Compared to other algorithms, the proposed method excels at low compression
    ratios. General image compression methods tend to strike a balance between the
    compression ratio and the recovery quality. They do not have to work at extremely
    low compression ratios as the transmission bandwidth available is comparably high.
    However, the proposed method is designed to work at low compression ratios to
    adapt to the harsh communication environment in underground mines.


    In future work, we will combine other denoising techniques into the work presented
    in this paper is an attempt to achieve noise robustness without blurring the patterned
    areas. The current design of the DW-SSIM loss is not perfect in that the merits
    of cosine similarity is not fully preserved. Thus it is worth further investigating
    into the design of loss function. We will also train the model on other datasets
    in order to expand the application of the proposed method.


