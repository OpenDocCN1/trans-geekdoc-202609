    # 5. Experimental Study of the Applications of Determined Coefficients


    This section aims to verify the applicability of the determined error correction
    coefficients and the residuals of measured and corrected points with respect to
    certified points are compared.


    This experiment measures the dot grid target standard used in Section 4. The measured
    area of this standard is different from those in Section 4. All the environmental
    and operational parameters are the same as those in Section 4. The measurement
    data are processed using the same algorithms and procedures, until the fitted
    cylinder centers are approximated parallel with the x-axis. Then the fitted centers
    are corrected by the error correction coefficients determined. By comparing the
    mean residuals, the sum of all squared residuals, and the standard deviation of
    residuals of measured points and corrected points with respect to certified positions,
    the effectiveness of the calculated coefficients and our model can be observed.


    Measurement data are processed using our developed and validated algorithms. The
    raw measurement data with form removed are shown in Figure 15, implementing the
    form removal method presented in the pair publication Part I [18] Section 4.1.
    The cylinders are separated from the base with our developed algorithms, with
    results demonstrated in Figure 16. Figure 16a shows the initial separated cylinders,
    Figure 16b shows the cylinders with outliers removed and with clusters classified,
    and Figure 17 shows the histograms of the three coordinates of the cylinders.'
