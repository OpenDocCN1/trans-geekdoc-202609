    data measured with a monitoring system are used in the present paper for developing
    the forecasting model. The monitoring system is placed in the coastal area of
    Neos Marmaras, Greece. Details about the monitoring system (e.g., sensors used
    and verification) can be found in (Michailides et al. [26], 2013). The training
    and test sets cover the periods 01/04/2013–10/08/2013 and 01/09/2013–24/12/2013,
    respectively. The test set is used for the comparison of the models. No filling
    of incomplete or missing data took place. Also, no other preprocessing of the
    data took place. The aim is to build a model applied to raw data obtained from
