  md: 'Review


    # Model Update Strategies about Object Tracking:

    A State of the Art Review


    Deyu Wang 1,2, Weidong Fang 3, Wei Chen 1,2,4,*, Tongfeng Sun 1,2 and Tingjie
    Chen 1,2


    +   - 1 School of Computer Science and Technology, China University of Mining
    Technology, Xuzhou 221000, China; hnsdwdy@126.com (D.W.); suntf@cumt.edu.cn (T.S.);
    2390@cumt.edu.cn (T.C.)

    - 2 Mine Digitization Engineering Research Center of the Ministry of Education,
    China University of Mining Technology, Xuzhou 221116, China

    - 3 Key Laboratory of Wireless Sensor Network & Communication, Shanghai Institute
    of Micro-System and Information Technology, Chinese Academy of Sciences, Shanghai
    201800, China; weidong.fang@mail.sim.ac.cn

    - 4 School of Earth and Space Sciences, Peking University, Beijing 100871, China

    - * Correspondence: chenwdavior@163.com


    Received: 24 September 2019; Accepted: 17 October 2019; Published: 23 October
    2019


    **Abstract:** Object tracking has always been an interesting and essential research
    topic in the domain of computer vision, of which the model update mechanism is
    an essential work, therefore the robustness of it has become a crucial factor
    influencing the quality of tracking of a sequence. This review analyses on recent
    tracking model update strategies, where target model update occasion is first
    discussed, then we give a detailed discussion on update strategies of the target
    model based on the mainstream tracking frameworks, and the background update frameworks
    are discussed afterwards. The experimental performances of the trackers in recent
    researches acting on specific sequences are listed in this review, where the superiority
    and some failure cases on each of them are discussed, and conclusions based on
    those performances are then drawn. It is a crucial point that design of a proper
    background model as well as its update strategy ought to be put into consideration.
    A cascade update of the template corresponding to each deep network layer based
    on the contributions of them to the target recognition can also help with more
    accurate target location, where target saliency information can be utilized as
    a tool for state estimation.


    **Keywords:** visual tracking; update occasion; update mechanism; background model;
    network layer contribution; saliency information


    # 1. Introduction


    With the progress of computer vision technology, moving target tracking is being
    increasingly popularly researched, which has become a challenging topic in the
    area of smart application. As the development of computer hardware devices and
    rapid progress of machine learning and deep learning techniques, researches on
    each respect of moving target tracking has been endowed with great essence. Object
    tracking has been greatly related to many applications in modern life, i.e., player
    identification, vehicle monitor, smart human-computer interactions [1]. The mechanism
    of tracking a moving target is that the target, which is distinguishable from
    the background, is separated out and marked by a bounding box, which is usually
    regarded as a classification issue that target samples and background ones should
    be from different classes. Nowadays, lots of frameworks of image classifiers,
    i.e., support vector machine (SVM) [2], extreme learning machine (ELM) [3], Integrated
    Circulant Structure Kernels (ICSK) [4], etc., have been widely utilized for researches
    of visual tracking. Furthermore, deep learning is getting more and more popularly
    concerned, trackers using which framework have gained more excellent performances
    due to the development of neuroscience.'
