  md: '![](img/8b41ef3997625b78ba4cb189dbc5f7b9_199_0.png)


    Figure 8. Class labels of the central pixel and its eight neighborhood pixels.


    As shown in Figure 8, based on the traversal of all the pixel labels of the hyperspectral
    image, the class label L_(i,j) of one central pixel P_(i,j) and the class labels
    of the eight neighborhood pixels were combined into a 3×3 matrix. The 3×3 matrix
    was transformed into a 1×9 one-dimensional vector. Then the mode M of the nine
    labels and the number m of the mode labels were calculated. The threshold was
    set to N (0 ≤ N ≤ 9), and the pixel label of the hyperspectral image that did
    not need to be classified was set to 0. The central pixel is considered to be
    noise when the following conditions are met: The class label L_(i,j) of the central
    pixel is not equal to the mode of the nine pixel labels, the mode label is not
    0, and the number of the mode labels is m ≥ N. Since the label of 0 means that
    the pixel does not need to be classified, the mode label with the value of 0 is
    excluded to avoid the edge misjudgment. If the central pixel P_(i,j) is confirmed
    to be noise, it is replaced with the mode label of the eight neighborhood pixels.
    The initial value of the threshold N is generally set to 5. When the central pixel
    label L_(i,j) is not equal to the mode label of the nine pixels, the mode label
    is not 0, and the number of the mode labels is m ≥ 5, the central pixel is considered
    to be noise. The threshold N can be modified according to actual conditions. If
    the threshold is too large, the noise-reduction effect may not be obvious; if
    the threshold is too small, the actual information may be misjudged as noise.


    The pseudo-code of the optimal neighborhood noise reduction process is shown as
    follows:


    ```

    Input: The classification result dataset X of the hyperspectral image, the label
    of 0 for the pixels that do not need to be classified, and the threshold N=5

    Output: The noise-reduced classification result data set X of the hyperspectral
    image and classified image with noise reduction.

    Load classification result dataset X

    for i=1; i< X.shape[0]; i++

    for j=1; j<X.shape[1]; j++

    loop traversing each pixel label L_(i,j)

    Transforming the 3×3 matrix composed of the central pixel label L_(i,j) and its
    eight neighborhood pixel labels into a 1×9 one-dimensional vector

    Calculating the mode M and its number m of central pixel label and the eight neighborhood
    pixels labels.

    if the class label L_(i,j) of the central pixel is not equal to the mode number
    M of the nine labels

    if the mode label is not 0 and the number of the mode label is m≥N

    The central pixel P_(i,j) is noise

    Replace the central pixel label L_(i,j) with the mode label M to remove the noise

    end if

    end if

    Update the hyperspectral image classification result label L_(i,j) of each pixel
    P_(i,j)

    end loop L_(i,j)

    end for

