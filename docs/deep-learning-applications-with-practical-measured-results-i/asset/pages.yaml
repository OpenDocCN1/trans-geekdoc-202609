    # 3.4. Update Strategy of Neural Network Models


    A series of neural network framework have been widely adopted in researches of
    visual tracking because of its strong capability of feature extraction and image
    classification, of which researches on the improvement of accuracy, speed, as
    well as the structural layouts are gaining rapid progress. Quantities of labeled
    images are used for iterative training and during training features of different
    depths that describe the trained samples from different aspects are extracted,
    thus a set of parameters with high validity are finally determined thanks to the
    neural structure of it, which greatly alleviates the tedious process of handcrafted
    feature extraction in traditional machine learning models. A huge challenge of
    visual tracking under neural network framework today lies in the shortage of training
    samples as well as in the sensitivity to irregular sample distribution and noisy
    samples [44], of which the sample distribution and quality of training samples
    decides the capacity of a network to a large extent. So as to further boost the
    capacity of tracking networks, the hot topic of tracking under deep neural network
    has recently transferred to the further procession of training samples, which
    is a credible mark of progress in the research of deep learning.


    The distribution of foreground and background stays stable during tracking in
    a short period. The samples used for model update should possess two characteristic
    to make the network adjust to the appearance change of the target: firstly, the
    frames that the positive samples are selected from should be as close as possible
    to current frame to ensure the real-time requirement; secondly, it must contain
    a correctly tracked object that is without the influence of occlusion or drift.
