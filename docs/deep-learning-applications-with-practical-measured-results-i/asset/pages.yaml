    justly tracked into account, in other words, the influence of the maps in the
    previous frames are neglected. To be specific, parameters, like *PAR* and *APCE*,
    etc., vary with different trends during different periods''—usually the variation
    goes faster when the target is being gradually occluded or it moves away from
    the occluding background object during the period of partial occlusion. So as
    to capture the process of the variation of the response map under partial occlusion,
    the parameter *FCDS* is proposed in [21] to learn the'
