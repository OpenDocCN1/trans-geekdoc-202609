    # 4.3. Evaluation Criteria


    Three evaluation metrics, root mean squared error (RMSE), root relative squared
    error (RRSE) and empirical correlation coefficient (CORR) for multivariate forecasting,
    are used and defined as:


    RMSE = sqrt( 1/N sum_{i=1}^{N} (y_i^t - \hat{y}_i^t)^2 ), (12)

    RRSE = sqrt( sum_{(i,t) in Omega_Test} (Y_{it} - \hat{Y}_{it})^2 ) / sqrt( sum_{(i,t)
    in Omega_Test} (Y_{it} - mean(Y))^2 ), (13)

    CORR = 1/n sum_{i=1}^{n} [ sum_t (Y_{it} - mean(Y_i))(\hat{Y}_{it} - mean(\hat{Y}_i))
    / sqrt( sum_t (Y_{it} - mean(Y_i))^2 (\hat{Y}_{it} - mean(\hat{Y}_i))^2 ) ], (14)


    where Y, \hat{Y} \in \mathbb{R}^{n \times T} are ground value and system prediction
    value, respectively, and \Omega_{Test} is the set of time stamps used for testing.
    For RMSE and RRSE, the lower value is better, while, for CORR, the higher value
    is better for evaluation.


    # 4.4. Walk-Forward Validation


    In the test set, the Walk-Forward Validation method is adopted, but the model
    is not updated. In this case, a model is needed to predict a period of time, and
    then the actual data of the current period is provided to the model, so that it
    can be used as the basis for the prediction of subsequent periods. This is not
    only applicable to the way the model is used in practice, but also conducive to
    the model using the best available data.


    In the experiment, the output length is set to 24. For multi-step prediction problems,
    we evaluate each prediction time step separately. Table 3 summarizes the actual
    value and predicted value. Models can be trained and evaluated as follows.


    +   Step 1: Starting at the beginning of the test set, the last set of observations
    in the training set is used as input of the model to predict the next set of data
    (the first set of true values in the validation set).

    Step 2: The model makes a prediction for the next time step.

    Step 3: Get real observation and add to history for predicting the next time.

    Step 4: The prediction is stored and evaluated against the real observation.

    Step 5: Go to step 1.


    Table 3. Dataset Statistics, where h is hour, d is day.


    | Input (Actual Value) | Output (Predicted Value) |

    |---|---|

    | Current 24 h | Next, 24 h |

    | 1d 1 h-1 d 24 h | 2 d 1 h-2 d 24 h |

    | 2d 1 h-1 d 24 h | 3 d 1 h-2 d 24 h |

    | ... | ... |


    # 4.5. Experimental Details


    To be more specific, most models chose input length from {24,72,168}, and the
    batch size is set to 100. The mean squared error is the default loss function
    for forecasting tasks. Adam [35] is adopted as optimization strategy, with an
    initial learning rate set to 0.001. In addition, the learning rate is reduced'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'by a factor of every 10 epochs of no improvement in the validation score, until
    the final learning rate was reached.


    For the LSTM model, a single hidden layer with {50,100,200} units is defined.
    The number of units in the hidden layer is unrelated to the number of time steps
    in the input sequences. Finally, an output layer will directly predict a vector
    with 24 elements, one for each hour in the output sequence. SGD [36] is adopted
    as an optimizer. The learning rate is set to 0.05 with a reduction rate by a factor
    of 0.3.


    In the ConvLSTM Encoder–Decoder model, input data have the shape of [timestep,
    row, column, channel]. Timestep is chosen from {1,3,7}. Row is set to 1. Column
    is chosen from {24,72,168}. Channel is chosen from {2,8}. SGD is adopted as the
    optimization algorithm. The learning rate is set as the same in LSTM. For this
    network, the 1-layer network contains one ConvLSTM layer with 64 hidden states,
    the 2-layer network contains one ConvLSTM layer with 128 hidden states, and the
    3-layer network has 200 hidden states in the LSTM layers. All the input-to-state
    and state-to-state kernels are of size 1 × 3.


    For the MALSTM-FCN network, the optimal number of LSTM hidden states for each
    dataset was found via grid search over {8,50,100,200}. The FCN block is comprised
    of three blocks of 128-256-128 filters. The models are trained using a batch size
    of 128. The convolution kernels are initialized following the work of [24].


    For the TCN network, the optimal number of hidden units per layer for each dataset
    was found via grid search over {30,50,100}. The convolution kernels are of size
    1 × 3.


    In our M-TCN model, Adam is adopted as an optimization strategy with an initial
    learning rate set to 0.001(ISO-NE Dataset), while, for Beijing PM2.5, SGD is adopted
    as an optimization strategy with an initial learning rate set to 0.05.


    The implementations of M-TCN are built based on Keras library with the Tensorflow
    backend. We run all the experiments on a computer with a single NVIDIA 1080 GPU
    (Santa Clara, CA , USA).


    # 4.6. Experimental Results


    Table 4 summarizes the results on multivariate testing sets in the metrics RMSE,
    RRSE and CORR across all forecast hours. The output sequence length is set to
    24, which means that the horizons were set from the 1st hour to the 24th hour
    for forecasting over the Beijing PM2.5 and ISO-NE Electricity data. In the time
    series forecasting, larger horizons shall make the prediction harder. Thus, our
    experiments give a detailed analysis of the results in this large horizon. The
    best results for each data and metric pair are highlighted in bold. To demonstrate
    the effectiveness of the models, the results are compared with three baseline
    methods by the Naive, Average and Seasonal persistent model, as well as four competitive
    algorithms of LSTM, ConvLSTM, TCN and MALSTM-FCN. For RMSE and RRSE, the lower
    value is better, while the higher value is better for CORR. Overall performance
    of neural network based models is better than traditional methods. The performance
    of M-TCN is comparable with LSTM and MALSTM-FCN and outperforms both of them by
    about 10%~20% for both datasets. Furthermore, the ConvLSTM model has weak generalization
    ability, and its prediction ability varies greatly on different datasets.


    Figure 9 presents the results on RMSE for both datasets at a larger horizon from
    the 1st hour to the 24th hour. It is obvious that M-TCN is better than others
    and RRSE maintains a steady increase without obvious fluctuation in the long-term
    forecasting period.'
