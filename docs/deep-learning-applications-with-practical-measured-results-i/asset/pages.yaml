  md: '# 3.2. Band Selection Based on Mutual Information


    Mutual Information (MI) is a measure of the useful information, which is defined
    as the amount of the information contained in a random variable about another
    random variable. The MI between two random variables X and Y is defined as


    $$I(X,Y)=\sum_{i=1\dots n\atop j=1\dots m} p_{XY}(x_i,y_j)\log\frac{p_{XY}(x_i,y_j)}{p_X(x_i)p_Y(y_j)}

    = H(X)+H(Y)-H(X,Y)$$ (7)


    where $p_X(x_i)$ is the probability density function of X, $p_Y(y_i)$ is the probability
    density function of Y, and $p_{X,Y}(x_i,y_j)$ is the joint probability density
    function of X and Y. $H(X)$ is the entropy of the random variable X, and $H(Y)$
    is the entropy of the random variable Y, which is calculated by Equation (1).
    $H(X,Y)$ is the joint entropy of two random variables X and Y, which can be calculated
    by Equation (2).


    Furthermore, Bell proposed the mutual information of three random variables X,
    Y and Z, as shown in the following [42]:


    $$I(X,Y,Z)=H(X,Z)+H(Y,Z)-H(X,Y,Z)

    =-H(Z)-I(X,Y)$$ (8)


    where $H(X,Y,Z)$ is the third-order joint entropy of three random variables X,
    Y and Z.


    The above principle is equally applicable in hyperspectral images. The information
    of one channel can increase the mutual information between the other two channels.
    In this case, as the overlapped information between the two channels is less,
    the interdependence degree between the two random variables is lower, and the
    amount of contained information is greater. In the dimensionality reduction of
    hyperspectral images, it is necessary to consider both criteria, i.e., the largest
    amount of information and the least amount of redundancy.


    Pla proposed the application of standardized mutual information [43]. In this
    article, we used the $k$-th order normalized information (NI) of the band $S =
    \{B_1,\cdots,B_k\}$ as the standardized mutual information, in which NI is defined
    as


    $$NI_k(S)=\frac{k\times I(S)}{\sum_{i=1}^k H(B_i)}$$ (9)


    where $I(S)$ is the mutual information of the bands $B_1$ to $B_k$, and $H(B_i)$
    is the entropy of the band $B_i$.


    # 3.3. Two Strategies for CNN Inputs


    Three spectral bands, $x_R$, $y_B$, $z_G$, were selected for the dimensionality
    reduction of hyperspectral image based on the information measure, and three grayscale
    images were obtained. There were two strategies to enter the CNN network, as shown
    in Figure 5. In the first strategy, the three spectral bands $x_R$, $y_B$, $z_G$
    were directly used to extract the neighborhood around the pixel and classify the
    pixel into a patch of $m \times m \times 3$, which was put into the CNN for classification.
    This method was also called the information measure classification method (IM
    for short) because it directly used the dimensionality reduction results based
    on the information measure. In the second strategy, all the spectral information
    of the pixel was superimposed and classified on the above patch to form a patch'
