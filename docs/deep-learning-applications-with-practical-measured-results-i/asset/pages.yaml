    # 2.4. The Sliding Window Phase


    In this work, the original shearography image had a size of 1360 × 1024 pixels.
    In order to facilitate bubble defect detection, the shearography tire images are
    fragmented into a variety of blocks via the sliding window phase. Subsequently,
    it is evident that the location of the tire bubble defects is not known; consecutive
    sliding windows with 50% overlapping regions for the extraction of speckle patterns
    are used to avoid fragmenting the bubble defects and causing erroneous results.


    The overlapping threshold has been selected to poise the time-period required
    for processing and also for the efficient detection of bubble defects. The abstract
    depiction of the sliding window indicating the overlap is presented in Figure
    7.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_219_0.png)


    Figure 7. The abstract depiction of the sliding window indicating the overlap.'
