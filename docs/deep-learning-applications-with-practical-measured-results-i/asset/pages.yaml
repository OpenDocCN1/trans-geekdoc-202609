    The experimental results show that the band selection method based on information
    measure is better than the feature extraction method based on PCA on Indian pines
    dataset and Pavia University dataset. As we all know, besides PCA, there are some
    common dimensionality reduction methods, such as Kernel-PCA (KPCA), independent
    component correlation (ICA) [49], locally linear embedding (LLE) [50], etc. Research
    shows that machine learning by feature extraction can achieve better generalization
    performance than that without feature extraction. This demonstrates the fact that
    dimensionality reduction can improve generalization performance. Generally speaking,
    KPCA and ICA perform better than PCA—which is explained by the fact that KPCA
    and ICA can explore higher order information of the original inputs than PCA.
    Instead of the sample covariance matrix, (the second-order information) as used
    in PCA, the negentropy in ICA could take into account the'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'higher order information of the original inputs. By using the kernel method
    to generalize PCA into nonlinear, KPCA also implicitly takes into account the
    high order information of the original inputs. A higher number of principal components
    could also be extracted in KPCA, eventually resulting in the best generalization
    performance. LLE is much better than PCA in dealing with so-called manifold dimensionality
    reduction. LLE maps its inputs into a single global coordinate system of lower
    dimensionality, and its optimizations do not involve local minima. By exploiting
    the local symmetries of linear reconstructions, LLE is able to learn the global
    structure of nonlinear manifolds, such as those generated by images of faces or
    documents of text. So, in the future research, we can try to use KPCA, ICA, LLE
    to replace the methods based on information measurement, or compare our in this
    paper with the classification methods based on these dimensionality reduction
    methods for further experimental testing.


    Moreover, entropy and mutual information are used to select the most representative
    band of the hyperspectral image, in order to reduce the dimension. From the introduction,
    we can see that some hyperspectral image classification methods based on RBMS
    or DBN have appeared in the past few years. It is known that Restricted Boltzmann
    Machines (RBMs) based on unsupervised learning can be used to preprocess the data
    and basically to help the "machine learning" process become more efficient. Mousas
    et al. used RBMs to preprocess the motion features of a character’s hand to enhance
    the estimation rate [51]. Nam et al. used sparse RBM to encode the preprocessed
    data into high-dimensional feature vectors in the field of music annotation and
    retrieval [52]. The classification methods based on RBMS or DBN generally take
    all spectral information of each pixel as the input of the network, and realize
    the classification of hyperspectral images only according to spectral information.
    In recent years, some classification methods using spatial-spectral information
    have achieved better classification results. For feature extraction of the image
    after dimensionality reduction, the reason why we use CNN instead of RBMS or DBN
    is that we want to use spatial-spectral information to classify hyperspectral
    images in order to improve classification accuracy. The validity of this method
    is also proved by the experiments.


    # 6.2.2. Experiments of Deep Transfer Learning Methods


    # (1) Transfer experiment from Salinas to Indian pines


    Salinas was used as a source dataset to pre-train CNN. Then the shallow layers’
    weight parameters were transferred to the object dataset, Indian Pines. In addition,
    the fine-tuning of the parameters in the network and the optimal neighborhood
    noise reductions were performed. In this experiment, 5% of the Salinas dataset
    samples were randomly selected to pre-train CNN, 10% of the Indian Pines dataset
    were selected as the training set, and the rest of the dataset were used as the
    test samples.


    In order to fully verify the effectiveness of the transfer learning method, the
    classification method based on all spectrum data of hyperspectral images (that
    is, No Dimensionality reduction, NDR), the IM method, and the IM_SPE method were
    combined with the deep transfer learning method (MIG) to obtain the NDR_MIG, IM_MIG,
    and IM_SPE_MIG methods, respectively. Then the NDR_MIG, IM_MIG, and IM_SPE_MIG
    methods were compared with the classification methods without transfer (i.e.,
    NDR, IM, IM_SPE). At the same time, in order to further verify the effectiveness
    of the proposed noise reduction method, NDR_MIG, IM_MIG, IM_SPE_MIG, were combined
    with the optimal neighborhood noise reduction method (DN) to obtain the NDR_MIG_DN,
    IM_MIG_DN, and IM_SPE_MIG_DN methods, respectively. The classification result
    of each method is shown in Table 3.


