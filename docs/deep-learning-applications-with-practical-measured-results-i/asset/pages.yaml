    conventional machine learning methods [43–56].


    In the future, the federated learning techniques can be considered to train deep
    learning and machine learning models across multiple decentralized servers for
    data privacy and data security in electronics industries. Furthermore, the optimization
    techniques (e.g., gradient descent algorithm, Adam optimization algorithm, particle
    swarm optimization algorithm [57,58], etc.) can be improved for finding the global
    optimal solution.


