    # 3.1.2. Objective Function


    Two objective optimization functions are proposed for minimizing the trajectory
    length of a UAV and the number of times an UAV has been corrected:


    $F_1 = \min\left(\sum_{i=1}^{m} (\eta_i + \lambda_i + h_i)\right)$ (2)


    $F_2 = \min\left(\sum_{i=1}^{m} (a_i + b_i)\right)$ (3)


