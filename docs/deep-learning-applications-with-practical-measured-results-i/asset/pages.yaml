    # 3. Dimensionality Reduction of Hyperspectral Image Based on Information Measure


    # 3.1. Spectral Band Preprocessing Based on Entropy and Color Matching Function
    (CMF)


    Based on the information theory, Shannon first proposed the concept of entropy
    in 1948 [39], in which the amount of information with uncertainty, i.e., the probability
    of the occurrence of discrete random events was measured. The greater amount of
    information indicated a smaller redundancy. The information measure based on Shannon''s
    communication theory has been proven very effective in identifying the redundancy
    of high-dimensional datasets.


    The entropy of a random variable is defined as


    $$H(X) = -\sum_{i=1}^{n} p_X(x_i) \log_b[p_X(x_i)], \tag{1}$$


    where $x_i$ is the event of X, $p_X(x_i)$ is the probability density function
    of X, and b is the logarithmic order.


    Assume X and Y are two random variables, where X has n values and Y has m values.
    Then their joint entropy is


    $$H(X, Y) = -\sum_{i=1}^{n} \sum_{j=1}^{m} p_{X,Y}(x_i, y_j) \log p_{X,Y}(x_i,
    y_j), \tag{2}$$


    where $p_{X,Y}(x_i, y_j)$ is the joint probability density function of X and Y.


    When these measurements are applied to hyperspectral images, it is generally assumed
    that each channel (spectral band) is equivalent to a random variable X, and each
    pixel in the channel is an event $x_i$. In the preprocessing step for the spectral
    band of the hyperspectral image, the channel with less information is eliminated
    based on Shannon entropy, which are described as follows:'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'Firstly, the entropy H(B_i) of each spectral band of the hyperspectral image
    is calculated. The random variable B_i is the i-th spectral band (i = 1, 2, ...
    n), x_i is the pixel of the i-th spectral band, and p_{B_i}(x_i) is the probability
    density function of the band B_i.


    ```

    H(B_i) = - sum_{i=1}^{n} p_{B_i}(x_i) log_0 [p_{B_i}(x_i)] . (3)

    ```


    Secondly, the local average entropy of each spectral band is defined as Equation
    (4), where m is the window size, indicating the size of the neighborhood.


    ```

    overline{H_m(B_i)} = 1/m sum_{p=-m/2}^{m/2} H(B_{i+p}) . (4)

    ```


    Finally, the bands B_i that meet the following conditions are retained.


    ```

    H(B_i) in [ overline{H_m(B_i)} x (1 - sigma), overline{H_m(B_i)} x (1 + sigma)
    ] . (5)

    ```


    where sigma is the threshold factor. The spectral band with higher or lower entropy
    than the range of sigma of the local average entropy overline{H_m(B_i)} is considered
    to be irrelevant.


    The blue line in Figure 2 is the entropy curve, in which the horizontal axis represents
    the spectral dimension and the vertical axis represents the entropy of each spectral
    band. The smoothness of the entropy curve determines the window size m and the
    threshold factor sigma. If the entropy curve is smooth, the change of the adjacent
    spectral band information, i.e., the uncertainty of the band information, is small;
    thus, the number of bands outside the relevant range, i.e., the probability of
    having an uncorrelated band, is also small. In this condition, few spectral bands
    are redundant, thus, smaller sigma and m values should be chosen to improve the
    ability of excluding redundant bands. On the contrary, if the entropy curve fluctuates
    greatly, the change of the adjacent spectral band information, i.e., the uncertainty
    of the band information, is large; thus, the number of bands outside the correlation
    range, i.e., the probability of having an uncorrelated band, is also large. In
    this case, more spectral bands are redundant, thus, larger sigma and m values
    should be chosen to exclude the redundant bands and retain the bands with valid
    information.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_193_0.png)


