  md: 'where y_i ∈ {−1,1}. The larger the score obtained by y_i (ω^T x_i + b), the
    greater the probability of predicting the category. Each image input into the
    SVM is compressed into a matrix of [1 × 3072]. There are two categories in the
    power line image classification. Therefore, the size of the matrix ω is [2 × 3072],
