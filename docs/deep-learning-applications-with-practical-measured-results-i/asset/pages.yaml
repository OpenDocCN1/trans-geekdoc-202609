- pgno: 75
  md: 'From Table 2, it can be learned that the proposed method achieves the highest
    SSIM at every compression ratio for all the images except the Fingerprint image.
    Since the SSIM metric describes structural similarity between the recovered and
    the original images, it can be drawn to the conclusion that the proposed method
    preserves specific characteristics of the images better.


    # 3.3. Visual Quality Evaluation


    Figures 6 and 7 illustrate the recovered images of the proposed method and the
    algorithms being compared. The green boxes zoom in the image patches within the
    red boxes so that the details can be viewed clearly. As can be seen in most of
    the pictures, the proposed method recovers sharper edges with less blurring compared
    to other algorithms. In Figure 7 where the compression ratio is relatively low,
    the edges can still be discerned in the recovered image of the proposed method,
    while other recoveries tend to be more blurred. Combined with Tables 1 and 2,
    it can be found that the characteristic which the proposed method preserves is
    the edges in the image.


    Figures 6 and 7 also demonstrate an interesting phenomenon. In the recovery of
    the Fingerprint image, the proposed method fails to recover the details either
    at a compression ratio r = 0.15 or r = 0.04. This is intended behavior and actually
    the proposed method deliberately “blurs” dense patterns in the recovered images
    to cope with the noise which is often seen in underground mine images. To explain
    the rationale behind this, suppose we take the image patches of size 15 × 15 at
    the same location from the recovered image and the original image of Fingerprint.
    Then 3-level 2D-DWT is applied on both patches and it can be discovered that the
    level 2 or level 3 subband images are almost identical. The major difference of
    the subbands lies in the level 1 decomposition. Recall that in Equation (8) each
    level is given the same significance, the difference between the recovered and
    original patch in level 1 decomposition is in effect “averaged out”. Therefore
    the DW-SSIM loss of the original dense patterned patch and the recovered blurred
    patch will be small, leading the proposed network to learn to blur the dense patterns.


    # 3.4. Robustness against Noise


    Since the tests in previous sections indicate that the proposed method takes an
    advantage when the compression ratio is low, we then test the noise robustness
    of the proposed method at a compression ratio r = 0.04 in this section. As depicted
    in Figures 8 and 9, Gaussian noise is added to the Lena and TBM test images to
    simulate the dusty environment in underground mines. The noise is zero-mean. The
    standard deviation σ of the noise is set to 5, 10, 15, 20, 25 and 30 to emulate
    different levels of noise. The noise-contaminated images are compressed at ratio
    r = 0.04. Then the similarity of the recovered images between the original test
    images is evaluated using the PSNR and SSIM measurement.'
