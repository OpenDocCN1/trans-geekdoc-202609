    measure-based classification method (IM and IM_SPE) had better performance than
    the spectral information-based classification method (SPE) and the PCA-based classification
    method (PCA1, PCA1_SPE and PCA3). Among all classification methods, the IM_DN
    and IM_SPE_DN methods had the best OA, AA, and Kappa coefficients, due to the
    combination of the dimensionality reduction based'
