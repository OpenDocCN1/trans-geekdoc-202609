    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_244_0.png)


    Figure 3. Example of visual intensity VI3 (red background) in the vertical recommending
    interface.


    Each session was monitored live and recorded using Gazepoint Analysis software.
    We constantly double-checked the operator’s monitor to ensure the eyes of the
    subject were in the optimal position relative to the camera, etc. After the participant
    had completed the task, basic data such as age were collected, and a question
    was asked about whether the subject felt they were influenced by the recommendations.
    Finally, all data were saved and stored by the eye-tracking system for further
    analysis. One experimental run typically lasted about 12 min.


    Participants. The initial experimental group of users consisted of 52 people who
    produced valid eye-tracking data. Most of them were undergraduate or graduate
    students invited in person or attracted to advertisements for the study, and they
    were native Polish speakers. They ranged in age from 14 to 54 years (mean = 25.2,
    σ = 8.0).


    # 3.2. Performance Evaluation of a Recommending Interface Experiment Structure
    and Procedure


    This section relates to the next stage of the experiment necessary to preliminarily
    implement the proposed framework for Performance Evaluation of a Recommending
    Interface (PERI). In line with the character of the study, the presented implementation
    does not cover the full spectrum of data described in the proposal, related to
    goal identification and preference reasoning modules which were not used since
    participants were given only one particular task. For the ultimate measure of
    interface performance, the add-to-cart action was chosen in this implementation.
    As mentioned in the framework proposal, other performance measures could alternatively
    be employed, e.g., fixation time on the recommending interface, time spent on
    a product page accessed via the recommending interface, etc.


    Data. Data collected using the eye-tracking device were used to build a deep learning
    solution and perform our pre-assessment study. Fixation data collected with Gazepoint
    Analysis software constitute lines containing information about all fixations
    performed by participants. In total, 15,922 fixation records were generated.'
