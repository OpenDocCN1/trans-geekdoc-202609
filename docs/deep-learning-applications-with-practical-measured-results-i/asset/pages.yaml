    # 4. Case Study


    This section describes the application of the Neural Audio Caption Model (NACM)
    and the Generative Adversarial Network-Based Neural Audio Caption Model (GNACM)
    to actual cases in detail. In Section 4.1, we describe the application scenario
    of the oral evaluation system. We explain the dataset required for model training
    and performance testing of the system in Sections 4.2 and 4.3. We introduce the
    application of the system in the entity enterprise, which fully shows the oral
    evaluation system’s practical application and significance value in Section 4.4.
    The advantages and disadvantages of the model are thoroughly analyzed according
    to the experimental results in Section 4.5.


    # 4.1. Scenario


    At present, the education and training industry has maintained a high growth rate
    of nearly one trillion Chinese Yuan. According to statistics, the scale of China’s
    training market in 2015 was about 882.1 billion Chinese Yuan. Language training
    institutions account for a large proportion in the training market, around 17.3%.
    The size of the education and training market in 2016 has exceeded one trillion
    Chinese Yuan, maintaining a growth rate of 13.1% per year. After investigation,
    the types of language training institutions are increasing in the market. The
    language training institutions mainly includes four categories: comprehensive
    curriculum education institutions, spoken language institutions, study abroad
    institutions, and minor language institutions. According to the survey of the
    language education market, we find that language training institution will be
    a long-standing industry in the future market.


    The development prospects of artificial intelligence language training institutions
