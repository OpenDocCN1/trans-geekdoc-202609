    # Trajectory Planning Algorithm of UAV Based on System Positioning Accuracy Constraints


    Hao Zhou 1,4, Hai-Ling Xiong 1,2,*, Yun Liu 3, Nong-Die Tan 1 and Lei Chen 1


    +   - 1 College of Computer and Information Science, Southwest University, Chongqing
    400715, China; zhouhao19@email.swu.edu.cn (Z.H.); tnd1201@email.swu.edu.cn (N.-D.T.);
    chenlei0207@email.swu.edu.cn (L.C.)

    - 2 Business College, Southwest University, Chongqing 402460, China

    - 3 College of Artificial Intelligence, Southwest University, Chongqing 400715,
    China; yunliu@swu.edu.cn

    - 4 College of Big Data and Artificial Intelligence, Chizhou University, Chizhou
    247000, China

    - * Correspondence: xionghl@swu.edu.cn; Tel.: +86-023-46752718

    - Received: 27 December 2019; Accepted: 29 January 2020; Published: 3 February
    2020


    **Abstract:** This paper describes a novel trajectory planning algorithm for an
    unmanned aerial vehicle (UAV) under the constraints of system positioning accuracy.
    Due to the limitation of the system structure, a UAV cannot accurately locate
    itself. Once the positioning error accumulates to a certain degree, the mission
    may fail. This method focuses on correcting the error during the flight process
    of a UAV. The improved genetic algorithm (GA) and A* algorithm are used in trajectory
    planning to ensure the UAV has the shortest trajectory length from the starting
    point to the ending point under multiple constraints and the least number of error
    corrections.


    **Keywords:** unmanned aerial vehicle; UAV; trajectory planning; GA; A*; multiple
    constraints


    # 1. Introduction


    An unmanned aerial vehicle (UAV) is an aircraft capable of completing missions
    with the autonomous flight capability. UAVs are currently widely used in vision
    systems, such as cargo transfer [1], object detection [2–4], and vision-assisted
    navigation [5–7].


    The idea for scientists to develop UAVs is to fly autonomously and accomplish
    specific tasks. In modern warfare, the air defense system is constantly improving,
    and air defense technology is becoming more and more advanced. Thus, improving
    the autonomy of unmanned aerial vehicles is an important trend for the future.
    Trajectory planning is a key technology to improve the autonomy of a UAV and an
    effective means to implement flight missions. It has important significance in
    both theoretical and practical applications. The aircraft path planning can effectively
    ensure the operational performance of a UAV, which provides technical support
    for a UAV to successfully complete the flight mission, realize the autonomous
    control of a UAV, and to complete the autonomous flight.


    Trajectory planning refers to the planning of an optimal flight path of the aircraft
    between the starting point and the ending point, considering factors such as fuel
    consumption, maneuverability, arrival time, flight area, and threat level. Trajectory
    planning is an important guarantee for the successful completion of a UAV and
    one of the key technologies for mission planning systems.'
