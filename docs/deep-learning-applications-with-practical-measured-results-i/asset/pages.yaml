    The results indicate that the algorithm developed in this work for the determination
    of the centers of cylinder point cloud is valid.


    # 5.2. Validation of the Algorithm for Determination of Coefficients


    Here, we use two methods for the validation of the algorithm for the determination
    of the coefficients.


    The first method is to create a dataset containing points with intervals of 125
    μm as certified positions, while making a little displacement with each point.
    Calculate the correction coefficients and correct the points with the displacement
    using the algorithm defined in Section 4.2. The points with the displacement with
    respect to the certified points represent the measured points in the experiments.
    Therefore, two residuals can be obtained, i.e., the residual between the certified
    points and the points with displacement as well as the residual between the certified
    points and the corrected points. Compare those two residuals to check whether
    the correction is meaningful.


    The algorithm first creates the two data described above. Then it rotates the
    points with displacement to the certified points, aiming at making the axis parallel.
    This arises from the methodology of this work, which requires locating the standard
    artefact that is parallel with the axis. As it is impossible'
