  md: 'Algorithms about the background update in the global level should better be
    designed in future tracking researches, as patches or visual words drawn from
    background are placed in order in the original image.


    # 5. Analysis on Experimental Results


    Challenging factors in visual tracking include occlusion, in-plane and out-of-plane
    rotation, illumination variation, background clutter, fast motion, abrupt deformation,
    and scale variation, etc. The robustness of a tracker is measured by its performances
    under these situations on specific sequences. A successful track means that a
    tracker is able to track the target without drift through the whole sequence in
    spite of any of those factors in the video. Whether a tracker can successfully
    track the target in a sequence depends on the quality of the model update to a
    large extent. This Section will discuss the tracking experiments from recent researches,
    where performances under those challenging factors are talked about in detail.
    The advantages in contrast to the benchmark trackers as well as some failure cases
    are listed and analysis on the merits and drawbacks with respect to the update
    strategies are then illustrated. Improvement measures are proposed among the analysis.


    # 5.1. Update Strategies from Recent Researches


    Some typical tracker models are listed in this subsection to illustrate the merits
    and drawbacks of recent trackers, as in Table 1. Table 2 lists abbreviations for
    the names of the listed frameworks.'
  merge: -1
  img_proc: true
