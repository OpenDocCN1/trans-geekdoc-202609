    # 2.2. Update Using Response Maps


    To judge the responsibility of a tracked object, in the past two years, response
    maps have been widely utilized in the field of visual tracking. A response map
    shows the probability of each pixel belonging to the target, whose maximum value
    point is near to the center of the Gaussian map of the target when the target
    is normally tracked, and when it is projected to a three-dimensional coordinate,
    it appears to have only one sharp peak around which the values sharply decrease
    with farther distance to it. When occlusion or background clutter comes across,
    more than one peak value can appear in the same response map, or even there is
    only one peak, the peak appears not so high enough or it is not sharp enough.
    Processed forms of the response map i.e., *PSR*, *PAR*, *APCE*, etc., are widely
    adopted in some researches to identify the presence of occlusion or background
    clutter, which are the derived parameters that measure the responsibility of a
    tracking result.


    A tracking result is only judged to be reliable when the three-dimensional (3-D)
    response map of the frame image has only one sharp peak. *PAR* [18] is defined
    to represent the fluctuation of a response map to reflect the reliability of a
    tracked target, whose formulation is


    $$PAR = \frac{R_{\max}^2}{\text{mean}\left(\sum_{w,h} R_{w,h}^2\right)}, \tag{1}$$


    in which $R_{\max}$ represents the maximum response value, $R_{w,h}$ is the value
    at a specific position, and the mean function calculates the average value of
    the map. Higher *PAR* indicates a more reliable tracking result. When the *PAR*
    and $R_{\max}$ are both greater than a predefined threshold, the result is judged
    as reliable, thus the correlation filter model in [18] is updated. Similarly,
    *APCE* is defined in [19], as


    $$APCE = \frac{(F_{\max} - F_{\min})^2}{\text{mean}\left(\sum_{w,h} (F_{w,h} -
    F_{\min})^2\right)}, \tag{2}$$


    where $F_{\max}$ and $F_{\min}$, respectively, denote the maximum and minimum
    value of the response map, and this parameter also reflects the fluctuation of
    the map. The context correlation filter in [12] is updated when *APCE* and $F_{\max}$
    are both higher than the threshold.


    The parameter *PSR* is also similarly defined, except that the sharpness of the
    peak is not put into consideration, which is calculated by firstly subtracting
    the mean value and then dividing by the standard deviation, as (3) in [20]


    $$PSR = \frac{R_{\max} - \mu}{\sigma}, \tag{3}$$


    where $\mu$ and $\sigma$, respectively, represent the mean value and the standard
    deviation of the response map. A tracking result is regarded as responsible when
    the *PSR* is above 10 [20], and thus the long-term and short-term filter memory
    models are updated; otherwise, the target is occluded and then further face recognition
    is started.


