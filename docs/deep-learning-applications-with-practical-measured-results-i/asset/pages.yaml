    the object, such as self-rotation, self-deformation, and self-variation of target
    appearance; therefore, a tracker with more robust capacity has to be designed,
    whose framework structure and sample learning strategy are of key importance,
    which guarantees its real-time and accuracy. Consequently, researching an update
    strategy with higher robustness and efficiency has been of greater essence.


    Object tracking framework can be usually typed into two categories: generative
    frameworks and discriminative ones, where, for the former framework, i.e., particle
    filter, sparse coding, linear predictions [5,6], Kalman filter, etc., target and
    background models are established at the beginning and the features of them are
    extracted for the search of similar target or background features in succeeding
    frame images to iteratively locate the target; The latter, i.e., deep neural networks,
    correlation filter, random forest, feature bagging [7], etc., gets the object
    location by drawing candidate target patches within a region and then select one
    that is distinguished from given background patches. With the progress of researches
    on machine learning and deep learning tracking frameworks, the model update has
    become a widely concerned part in recent researches. A good update mechanism is
    a crucial respect measuring the reliability of a tracker. On the one hand, template
    models of the target and background should be constantly updated to catch up with
    the their variation, which is a fundamental requirement of model adaptation. On
    the other hand, the parameter model must be adjusted with the same pace of the
    variations of the samples to satisfy the real-time requirement. Generally speaking,
    when and how to update make the major parts of the update task. In general, a
    less-frequent update cannot make sure that the target model can catch up with
    the change of target appearance, which gives rise to tracking failure, while much
    too frequent update makes it excessively adaptive to new characteristics of targets
    but neglects the influences of historical ones, which leads to background drift
    after a sudden occlusion comes across, thus incurring fatal errors. Up to now,
    specific update methods are designed to deal with tracking under irregular situations,
    such as occlusion and background clutter. For instance, more attention will be
    given to the background analysis when partial occlusion occurs. Although model
    update technology of visual tracking is gaining rapid progress and has obtained
    substantial break through at present, there are too few reviews about it compared
    to other works of tracking, as most reviews still focus on model construction
    and mathematical algorithms. This review will provide discussions on recently-proposed
    model update mechanisms and talk about the merits and drawbacks of them. Measures
    of improvement based on the superiority of existed update strategies and the remaining
    challenging tracking problems are proposed at the end of this paper. The remaining
    part of this paper is organized, as follows:


    In Section 2, target update occasions in recent researches are talked about, in
    which three common tools—occlusion detection, response map, and similarity judgement—and
    two complementary update occasions—conservative update and long-short-term update
    (LST)—are respectively discussed in detail. In Section 3, the update strategies
    of target models are illustrated, where recent strategies under four commonly
    used frameworks—correlation filter (CF), dictionary sparse coding, bag-of-words
    (BoW), and deep neural network—are respectively analyzed in detail. Background
    update mechanisms are then illustrated in Section 4, where a new background update
    framework, called tracking with background estimation (TBE), is briefed. In Section
    5, tracking experiment performances of recent trackers are listed, afterwards
    superior performances under several challenge factors of each typical tracker
    and some failure cases are exampl ed and analyzed. Specific conclusions regarding
    the update mechanisms are drawn from the testing statistics, and improvement measures
    of model update are briefly summarized in Section 6.


    # 2. Review on Target Model Update Occasions


