    # 5. Conclusions


    Image inpainting based on GAN has made great progress in recent years, but they
    can only process low-resolution images because of memory limitations and difficulty
    in training. For high-resolution images, the inpainted regions become blurred
    and the unpleasant boundaries become visible. Many researchers are committed to
    improve the existing image inpainting network framework. We propose a novel high-resolution
    image inpainting method based on deep generative model. It is a two-stage network
    including content reconstruction and texture detail restoration. After obtaining
    the visually believable fuzzy texture, we further restore the finer texture details
    improve the image inpainting quality. Meanwhile, we integrate the existing research
    of instance segmentation and image inpainting to delete the unnecessary pedestrians
    in background and ensure the reality of background restoration. To improve the
    accuracy of image inpainting in the special application scene, we proposed a new
    mask dataset, which collected the characters in COCO dataset as a mask, and could
    produce better inpainting results for the special application scene.


    In our future work, we will experiment with convolutional deep belief network
    (CDBN) [37] and PCANET [38] based on the paper. Like the CNN, CDBN can extract
    the high-frequency features of images. According to the latest research, CDBN
    performs better than CNN in the classification task of large-size images, so it
    may be better to use CDBN instead of CNN for high-resolution images. In addition,
    PCANET can conduct feature fusion of feature maps of different sizes in encoder,
    which strengthens the correlation between input and output. However, the better
    result of PCANET may come at the cost of speed.


