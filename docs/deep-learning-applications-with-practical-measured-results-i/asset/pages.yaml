    NACM model uses our Bi-GRU model. The Bi-GRU model is composed of GRU cells. Given
    the audio MFCC feature token sequence $\mathbf{A} = (\vec{a}_1, \vec{a}_2, ...,
    \vec{a}_n)$, we use the encoder to encode the sequence information and generate
    a single representation $\vec{K}$. A GRU unit takes each token as input and outputs
    a hidden state computed by Equations (1)–(4). Then, a hidden state sequence is
    generated after the GRU network has computed from left to right along the input
    sequence. Meanwhile, a counterpart is calculated by another GRU unit computing
    in the reverse direction. By concatenating the last hidden state vectors and connecting
    the fully connected layer with activation, we finally get the encoded audio feature
    $\vec{K}$'
