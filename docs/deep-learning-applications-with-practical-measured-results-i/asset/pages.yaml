    # 5. Conclusions


    E-commerce platform designers, together with marketers, seek ways of attracting
    the attention of web users and encouraging them to commit to purchases, in particular
    with the use of recommending interfaces. The presented study showed the influence
    of the layout of a recommending interface, the position of a recommendation item
    and various levels of visual intensity applied to it, on user behavior in a simply
    structured shopping website. Thanks to the research-grade measurement electronics
    equipment Gazepoint GP3 eye tracker, as well as tracking participants’ purchase
    decisions,'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'the attractiveness of selected website areas was analyzed. A framework for
    the Performance Evaluation of a Recommending Interface (PERI) was proposed.


    There are several major conclusions. In the experiment, an average of 12% of task
    completion time was used to look at the recommending interfaces and, coincidentally,
    exactly the same percentage of goods were purchased directly from recommendations.
    While comparing the vertical and horizonal recommending interface modes, in terms
    of fixation time, they performed equally, but from the point of view of purchase
    commitments, the vertical layout proved to be almost twice as effective as the
    horizontal one. It is speculated that the worse sales performance of the horizontal
    layout is related to banner blindness, because banners usually occupy a similar
    rectangular space at the top of the screen. In the better performing vertical
    arrangement, the most attractive in terms of fixation time was the position on
    the list, where the effect of slow flickering was used to increase visual intensity.
    On the other hand, the high visual attractiveness of the first item on the list,
    despite the lack of any visual distinction, may be due to the preconception that
    the first is always the best (similar to search engines). The level of attractiveness
    of the dazzling red back background was relatively low, probably due to the excessively
    high content intrusiveness that turned out to be counterproductive. It was also
    found that the first three locations in a recommending interface were the most
    eye-catching, regardless of the layout, with the least popular locations being
    the last ones, bordering the bottom or right edge of the website, respectively,
    for vertical and horizontal layouts. The study justifies considering a vertical
    rather than horizontal layout when designing a recommending interface and suggests
    that it is necessary to search for balanced rather than radical visual intensity
    solutions to counteract the habituation effect without adversely affecting buyers.


    The results, based on deep learning solutions used to implement the framework
    for Performance Evaluation of a Recommending Interface (PERI), showed that the
    obtained multilayer perceptron has a very good overall prediction accuracy (precision:
    80%, recall: 89%) and can be used to assess the performance of different recommending
    interfaces for users with different characteristics. The prediction accuracy of
    the adding a product to basket action is a little lower but still high, which
    is understandable, considering the preliminary character of PERI implementation
    and the fact that the results were obtained based on a relatively small dataset
    with a selected number of features. Nevertheless, we showed that the PERI framework
    can be used to automate an optimal recommending interface adjustment, including
    adjusting the recommendation position and visual intensity, according to the characteristics
    of the user. We are planning to perform an extended research with more complex
    e-commerce stores’ websites and subsamples of users of those stores in order to
    get a wider representation of user characteristics; users will also be given different
    tasks, from searching to buying, in order to include the goal identification and
    preference reasoning modules, and further validate the framework. We are also
    planning to test more types of deep learning networks with more hidden layers
    and neurons, as well as other machine learning techniques, in order to seek the
    best-performing architectures for this sophisticated and multidimensional problem.


