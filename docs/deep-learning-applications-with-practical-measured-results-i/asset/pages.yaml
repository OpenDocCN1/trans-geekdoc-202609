    # 3.3. Update Strategy Based on Bag-of-Words


    Objects in each frame of a tracking sequence can be only classified into two classes—object
    and background. In terms of animal’s vision mechanism, the classification of two
    different types of objects is usually according to the characters that are not
    the same among them, which gives the inspiration of bag-of-words (BoW) model in
    the domain of visual tracking, for the fact that in general characters contained
    in the foreground are distinguished from that in the background, thus there should
    be plenty of symbolic features to assist in object classification. However, there
    have not been too many tracking algorithms that are based on this framework when
    compared to other ones up to now, and less robustness has been shown in the tracking
    performances, for the reason that most of them neglect the consideration of the
    holistic structure of the target and background.


    Visual “words” are the visual characters from the area of the target and background
    in a tracking frame that are used as training samples in discriminative frameworks.
    For instance, in [42], the “words” are classified in a supervised way while using
    SVM. During the update process, new visual foreground “words” and background ones
    are extracted from the region of the object and a random background patch, respectively.


    However, the background and foreground in one frame might share some “words” with
    similar features, therefore a background character might be mistakenly classified
    as a target if it is much too similar to some features in the target feature bag.
    Hence, the target “words” like these cannot be used for discrimination. In [7],
    the authors believe that target occlusion might well happen when there exist features
    in the bounding box that are similar to or even the same as those in the surrounding
    area. If the number of these features is larger than usual, occlusion can be surely
    regarded to have occurred. In usual condition where no occlusion happens, foreground
    and background features in the bounding box are respectively merged into the target
    feature set and the background one; afterwards, other background features are
    searched from the surrounding background in the past few frames and then merged
    into the new background feature set, which has made the background more distinguishable
    that false targets have lower probability to be misidentified as the true one.
    A similar unsupervised way is utilized in [43], in which if the distance between
    a word v_i in the context bag M_t^B and its nearest neighbor word v_n from the
