- pgno: 159
  md: 'where F is the objective function, βi represents the parameters of coefficients
    to be determined. There are 18 coefficients in this part of the work, and hence
    there are 18 partial derivatives:


    ```

    $$\frac{\partial F}{\partial a_1} = \sum_{i=1}^{n} 2 \left( \begin{array}{c} x_{nom}^i
    - x_{meas}^i + a_1 x_{meas}^i + \frac{3}{2} a_2 (x_{meas}^i)^2 + \frac{3}{2} a_3
    (5(x_{meas}^i)^3 - 3x_{meas}^i) + \\ + b_1 y_{meas}^i + \frac{3}{2} b_2 (y_{meas}^i)^2
    + \frac{3}{2} b_3 (5(y_{meas}^i)^3 - 3y_{meas}^i) - \\ - y_{meas}^i \cdot (c_1
    y_{meas}^i + \frac{3}{2} c_2 (y_{meas}^i)^2 + \frac{3}{2} c_3 (5(y_{meas}^i)^3
    - 3y_{meas}^i)) \end{array} \right) \cdot x_{meas}^i = 0 \tag{11}$$

    ```


    ```

    $$\frac{\partial F}{\partial a_2} = \sum_{i=1}^{n} 2 \left( \begin{array}{c} x_{nom}^i
    - x_{meas}^i + a_1 x_{meas}^i + \frac{3}{2} a_2 (x_{meas}^i)^2 + \frac{3}{2} a_3
    (5(x_{meas}^i)^3 - 3x_{meas}^i) + \\ + b_1 y_{meas}^i + \frac{3}{2} b_2 (y_{meas}^i)^2
    + \frac{3}{2} b_3 (5(y_{meas}^i)^3 - 3y_{meas}^i) - \\ - y_{meas}^i \cdot (c_1
    y_{meas}^i + \frac{3}{2} c_2 (y_{meas}^i)^2 + \frac{3}{2} c_3 (5(y_{meas}^i)^3
    - 3y_{meas}^i)) \end{array} \right) \cdot \frac{3}{2} (x_{meas}^i)^2 = 0 \tag{12}$$

    ```


    ```

    $$\frac{\partial F}{\partial f_3} = \sum_{i=1}^{n} 2 \left( \begin{array}{c} y_{nom}^i
    - y_{meas}^i + d_1 x_{meas}^i + \frac{3}{2} d_2 (x_{meas}^i)^2 + \frac{3}{2} d_3
    (5(x_{meas}^i)^3 - 3x_{meas}^i) + \\ + x_{meas}^i \cdot (e_1 x_{meas}^i + \frac{3}{2}
    e_2 (x_{meas}^i)^2 + \frac{3}{2} e_3 (5(x_{meas}^i)^3 - 3x_{meas}^i)) + \\ + f_1
    y_{meas}^i + \frac{3}{2} f_2 (y_{meas}^i)^2 + \frac{3}{2} f_3 (5(y_{meas}^i)^3
    - 3y_{meas}^i) + \\ + x_{meas}^i \cdot (c_1 y_{meas}^i + \frac{3}{2} c_2 (y_{meas}^i)^2
    + \frac{3}{2} c_3 (5(y_{meas}^i)^3 - 3y_{meas}^i)) \end{array} \right) \cdot \frac{3}{2}
    (5(y_{meas}^i)^3 - 3y_{meas}^i) = 0 \tag{13}$$

    ```


    These equations can first be solved by solving the equation for the initial solutions.
    The initial solutions might be far from the correct solutions, as there are too
    many more constraints than unknown coefficients. Those initial solutions can be
    used as the starting point for iteratively finding the nonlinear least squares
    solutions. Extensive work has been done on the nonlinear least squares algorithms
    [40,41]. Let the model for data fitting be [41]:


    ```

    $$E(y) = f(x_1, x_2, \dots, x_m; b_1, b_2, \dots, b_k) = f(\mathbf{x}, \mathbf{b})
    \tag{14}$$

    ```


    where x1, x2, …, xm are independent variables, b1, b2, …, bk are k parameters
    of coefficients to be determined, E(y) is the expected value of the dependent
    variable y. Denote the data points as: (Yi, Xi1, Xi2, …, Xim), where, i = 1, 2,
    …, n. The objective is to calculate the k parameters of coefficients which will
    minimize the squares of the residuals:


    ```

    $$\min \sum_{i=1}^{n} (Y_i - \hat{Y}_i)^2 = \min \|\mathbf{Y} - \hat{\mathbf{Y}}\|^2
    \tag{15}$$

    ```


    This problem can be written as an objective function which aims at optimizing
    the coefficients of each function Yi − Ŷi, denoting the vector of the parameters
    to be optimized as t, where t = [a1, a2, …, f3] in this work. The objective function
    is:


    ```

    $$\min F(\mathbf{t}) = \sum_{i=1}^{k} f_i^2(\mathbf{t}) \tag{16}$$

    ```


    where, fi(t) are functions of the to-be-optimized vector t. When fi(t) are nonlinear
    functions with respect to t, this problem is about nonlinear optimization. The
    solution is to use Taylor expansion to convert fi(t) into linear functions. As
    only the first order of the Taylor series is linear, here we approximate it by
    the first order:


    ```

    $$\begin{aligned} \varphi_i(\mathbf{t}) &= f_i(\mathbf{t}^{(k)}) + \nabla f_i(\mathbf{t}^{(k)})^T
    (\mathbf{t} - \mathbf{t}^{(k)}) \\ &= \nabla f_i(\mathbf{t}^{(k)})^T \mathbf{t}
    - \nabla f_i(\mathbf{t}^{(k)})^T \mathbf{t}^{(k)} + f_i(\mathbf{t}^{(k)}) \end{aligned}
    \tag{17}$$

    ```'
  merge: -1
  img_proc: true
- pgno: 160
  md: 'where ∇f_i(t^(k)) is the value of the first derivative of f_i(t^(k)) on vector
    t evaluated at the point t^(k).


    Substituting f_i(t) in Equation (16) with its Taylor Expansion approximation indicated
    by Equation (17), the approximation of F(t) is:


    min φ(t) = Σ_{i=1}^k φ_i^2(t)

    = Σ_{i=1}^k (∇f_i(t^(k))^T t - ∇f_i(t^(k))^T t^(k) + f_i(t^(k)))^2  (18)


    To simplify the above equation, use A_k to represent ∇f_i(t^(k))^T, and b to represent
    ∇f_i(t^(k))^T t^(k) - f_i(t^(k)). Equation (18) is simplified into:


    min φ(t) = Σ_{i=1}^k (A_k - b)^2  (19)


    where,


    A_k = [∇f1(t^(k))^T; ...; ∇fm(t^(k))^T] = [∂f1(t^(k))/∂t1 ∂f1(t^(k))/∂t2 ... ∂f1(t^(k))/∂tn;
    ...; ∂fm(t^(k))/∂t1 ∂fm(t^(k))/∂t2 ... ∂fm(t^(k))/∂tn]  (20)


    b = [∇f1(t^(k))^T t^(k) - f1(t^(k)); ...; ∇fm(t^(k))^T t^(k) - fm(t^(k))] = A_k
    t^(k) - f^(k)  (21)


    f^(k) = [f1(t^(k)); f2(t^(k)); ...; fm(t^(k))]  (22)


    Therefore, it can be obtained:


    φ(t) = (A_k t - b)^T (A_k t - b)  (23)


    The solution of this equation is:


    t^(k+1) = t^(k) - (A_k^T A_k)^-1 A_k^T f^(k)  (24)


    This solution can be simplified as:


    t^(k+1) = t^(k) - H_k^-1 ∇F(t^(k))  (25)


    where, H_k is the Hessian matrix:


    H_k = 2 A_k^T A_k  (26)


    ∇F(x^(k)) = 2 A_k^T f^(k)  (27)


    Equation (25) can be solved iteratively by starting with an initial solution.'
