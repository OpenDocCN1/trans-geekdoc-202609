    # 2.3. Update Using Similarity Measurement


    Multiple-template models are usually adopted in generative models, i.e., sparse
    coding, in which template sets are updated along with the appearance variation
    of targets-in usual cases, a target appearance model is updated when the appearance
    of the tracking result is similar enough to the templates, while it needs to be
    updated when the similarity is not too low but relatively lower than the normal
    value, which indicates an apparent appearance change. Commonly adopted similarity
    measurements are cosine similarity, L1 norm, Euclidean distance, etc.


    A template set can well represent a tracking result if the similarity values between
    it and the majority of candidates are high enough; therefore, it needs to not
    be updated for calculation reduction, while drift might occur when the similarity
    falls below a degree. Cosine similarity [22] is used for measurement of the similarity
    between the tracking result and the templates, where the template with a low similarity
    value is replaced by the tracked object when the similarity value is between 0.65
    and 0.85 to avoid excessive mixture of background pixels. Similar update mechanism
    is utilized by the extreme learning machine (ELM) framework in [23]; however,
    the ELM model need not be updated only when the similarity is above the threshold,
    since the semi-supervised learning mode of ELM model and its strong discrimination
    ability guarantees the quality of the tracked targets. Soft cosine similarity
    [24] is defined for the measurement rather than conventional cosine similarity
    to cope with combined challenging factors, i.e., out-of-plane rotation and apparent
    scale change simultaneously occur during a period. In [24], a tracking result
    is departed into several parts, anyone of which does not contain too many background
    pixels when the soft cosine similarity between it and the corresponding template
    is no less than a predefined value, therefore that template part is updated in
    a linear interpolation way, otherwise the update is prohibited. Of the multiple-feature
    pattern, the absolute error gets lower as the similarity between the specific
    feature template and the corresponding feature of the tracked target goes larger.
    The sum value of L1 norm of the subtraction matrix of all the template features
    and the tracking result is used to reflect the total difference, which is greater
    than a certain threshold when some of the features have undergone evident variance
    to measure the difference between the result and the templates. The feature template
    with the smallest weight is then updated to adjust to the change of this feature
    of the target.


    # 2.4. A Conservative Updating Strategy


    Usually, the reliability of the tracked object needs to be estimated no matter
    how frequently the model is updated in the regular cases. However, drifts may
    occur when the surrounding patches that are similar to the object are mistakenly
    identified as foreground, incurring fatal impacts in the consequent frames if
    the errors are not erased in time. Under this situation, it is sometimes hard
    to discriminate true appearance change and occlusion when the difference between
    the tracked target and the template gets bigger.


    A conservative update strategy is proposed in [25], in which the reliability of
    the tracked object is not considered, to reduce impacts of drifts under background
    interference. During tracking, a whole sequence is departed into several long
    time periods, each of which is further divided into smaller ones, and several
    rather than one trackers are established, of which the amount is equal to the
    amount of'
