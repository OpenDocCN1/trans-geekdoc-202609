- pgno: 229
  md: 'output image is also 256 × 256. We trained our improved image inpainting network
    on two datasets including COCO and VOC datasets, as described in the Section 4.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_229_0.png)


    Figure 2. Improved image inpainting network.


    To further improve the visual effect of high-resolution image inpainting and reduce
    the blurred texture and the unpleasant boundaries that inconsistent with the surrounding
    area, the network we introduced consists of two stages: 1) content reconstruction
    network, 2) texture details restoration network. The first network is a completion
    network used to complete the image and obtain the rough prediction results, and
    it adopts reconstruction loss when training. The second network is a refinement
    network. It takes coarse prediction results as input to further restore finer
    texture details of high-resolution images without changing semantic information
    of coarse prediction results, and it adopts reconstruction loss and adversarial
    loss when training. The goal of the texture details restoration network is to
    ensure that the image texture of the holes is “similar” to the surrounding area.


    Content Reconstruction Network (Completion Network): Different from [14], we use
    the VGG network as the encoder, which can better obtain the detailed features
    of the images. We use continuous 3 × 3 convolution kernels (using small convolution
    kernels is superior to the use of bigger convolution kernels) for a given receptive
    field. Also, we alternately use four layers of dilated convolution (rate 16, 8,
    4, 2, corresponding feature map size 128, 64, 32, 8) in the intermediate convolution
    layer. The purpose of dilated convolution is to capture a larger field of view
    with fewer parameters so that the part under the remaining holes is consistent
    with its surrounding environment. Then we take the output information of the encoder
    through the decoder. In our implementation, the content reconstruction network
    adapts to the context encoder network.


    As shown in Figure 2, the five-layer encoder gradually samples down, and each
    layer of the encoder is composed of Convolution, Relu, BN, and Dilated Convolution.
    The rate of dilated convolution decreases with the decrease of the size of the
    feature map. The decoder gradually samples features up to the input image scale.
    We use transposed convolution instead of convolution in the decoder.


    Texture Details Restoration Network (Refinement Network): Inspired by SRGAN, we
    add multiple residual blocks and skip connections between input and output in
    the middle layers of the texture detail restoration network. Each residual block
    uses two 3 x 3 convolution layers, 64 characteristic figures, and the batch normalized
    layer (BN) after every convolution layer, and uses ReLU as the activation function.
    The texture detail restoration network uses two sub-pixel convolution layers instead
    of deconvolution to enlarge the feature size. Reducing invalid information through
    the sub-pixel convolution layer can make the high-resolution image smoother, reduce
    the blurred texture and the unpleasant boundaries that inconsistent with the surrounding
    area, and obtain a better visual result.'
