    # 2. The Proposed Image Compression Method


    # 2.1. Overview


    Before introducing the network architecture, it is necessary to understand the
    workflow of the proposed compression method. As shown in Figure 1, a gray-scale
    image or one of the channels of an RGB color image is taken as the input. We view
    the input image as a matrix x. For simplicity, we assume the input image is square,
    which means x has the same number of rows and columns. The image matrix x is “vectorized”
    into one vector x_v by concatenating each row of the matrix. The encoder module
    compresses x_v to a feature vector y. Then the decoder module is applied to approximate
    x using the feature vector y. The approximation of x is denoted as x̂. During
    training, both the recovered image and the original image are fed into the loss
    function. Back-propagation will try to minimize the value of loss by updating
    the weights in the encoder and decoder module.


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_67_0.png)


    Figure 1. The workflow of the proposed method.


    If there are N numbers in the image matrix x and M numbers in the feature vector
    y, then we define the compression ratio r as


    $r = M/N.$ (1)


    In short, the encoder module is responsible for compressing the image and determining
    the compression ratio, while the decoder module takes care of the recovery process.


    # 2.2. The Network Architecture


    # 2.2.1. The Encoder Module


    The weight matrix W of size M × N is multiplied by the “vectorized” image x_v.
    Then the product is added by the bias vector b to derive the feature vector y:


    $y = W x_v + b.$ (2)


    In Equation (2), both the weight matrix W and the bias vector b are parameters
    to be learnt during back-propagation. W is initialized using He initialization
    [41], while b is initialized with zeros.'
