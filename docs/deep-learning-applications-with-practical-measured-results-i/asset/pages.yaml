  md: '# 3.1.3. Multi-Constraints


    The vertical and horizontal errors will increase by δ units when a UAV flies one
    meter each time. The vertical and horizontal errors should be less than θ units
    when the ending point is reached. Therefore, the total value of the vertical and
    horizontal errors of an UAV during the entire flight must be less than θ, and
    the distance η_i of each flight of a UAV will not exceed the displacement l_AB
    of the entire trajectory:


    ∑_{i=1}^m a_i η_i δ < θ  (4)

    ∑_{i=1}^m b_i η_i δ < θ  (5)

    0 ≤ η_i ≤ l_AB  (6)


    For the correction distance λ_i meters of a UAV’s i-th flight to the vertical
    error correction point, when a UAV reaches the vertical error correction point,
    it is assumed that a UAV’s i-th flight, η_i meters will increase its vertical
    error by δ η_i units:


    λ_i = a_i η_i δ, i = 1, …, m  (7)


    For the correction distance h_i meters of an UAV’s i-th flight to the vertical
    error correction point, when a UAV reaches the horizontal error correction point,
    it is assumed that a UAV’s i-th flight, η_i meters will increase its horizontal
    error by δ η_i units:


    h_i = b_i η_i δ, i = 1, …, m  (8)


    During the flight, a UAV is either corrected after reaching the vertical error
    correction point or reaching the horizontal error correction point. In order to
    perform error correction more accurately according to the type of error correction
    of the correction point, for the i-th flight, the binary variables a_i and b_i
    are introduced. The vertical error correction can be performed when a UAV’s vertical
    error is not greater than α1 units and the horizontal error is not greater than
    α2 units. The horizontal error correction can be performed when a UAV’s vertical
    error is not greater than β1 units and the horizontal error is not greater than
    β2 units. The binary variables a_i and b_i can be expressed as follows:


    a_i = { 1, when UAV reaches the vertical error correction point, 0, when UAV does
    not reach the vertical error correction point, }  (9)

    b_i = { 1, when UAV reaches the horizontal error correction point, 0, when UAV
    does not reach the horizontal error correction point, }  (10)


    Then, the objective function should also meet the following constraints, which
    must be satisfied when an UAV performs vertical error correction:


    λ_i ≤ α1, h_i ≤ α2  (11)


    Further, the objective function must be satisfied when an UAV performs horizontal
    error correction:


    λ_i ≤ β1, h_i ≤ β2  (12)


    where λ_i is the corrected distance of an UAV to the vertical correction point
    on the i-th flight, h_i is the corrected distance of an UAV to the horizontal
    correction point on the i-th flight, α1, β1 is the vertical error of an UAV, and
    α2, β2 is the horizontal error of an UAV.'
