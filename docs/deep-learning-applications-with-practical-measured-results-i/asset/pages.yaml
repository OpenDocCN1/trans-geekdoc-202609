    # 2.6. Module Summary


    This module discusses commonly utilized model update occasions. Basic update occasions
    are listed at the beginning and limitations about time-scale-based update method
    are briefed next. Recently adopted update occasion determination methods are then
    illustrated in detail that three kinds of tools for measurement of target’s responsibility—occlusion
    detection, response map, and similarity measurement—and two kinds of newly-proposed
    hybrid updated occasions—the so-called MT with a conservative update mechanism
    and LST are respectively illustrated. A reliability check of the tracked object
    ahead of track can well prohibit erroneous update of the target and tracker model.
    Additionally, the mixture of long and short term update that fuses the advantages
    of different update occasions further enhances the adaptability of the trackers.
    Further solutions to disturbance of similar objects in the target’s surrounding
    area are required in future researches. According to this problem, response check
    on surrounding background regions should be utilized for the recognition of the
    true target-the real position can be obtained by comparison of the similarity
    between the characters of the surrounding background and which of the surroundings
    templates or utilizing the response maps of the surroundings patches, which might
    help to alleviate background drifts.


    # 3. Review on Target Model Update Strategies


    The design of the model update strategy is a hard project in the work of target
    tracking. The strong abilities to discriminate the foreground and the background
    and recover the target after temporary disappearance are not the only requirements
