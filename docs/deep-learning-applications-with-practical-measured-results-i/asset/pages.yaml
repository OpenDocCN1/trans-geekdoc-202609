- pgno: 71
  md: 'within the “window” to derive the decomposition. We define the local low frequency
    DW-SSIM $S_{L,t}$ and high frequency DW-SSIM $S_{H,t}$ of the image patches as


    $$S_{L,t}(\mathbf{c}^{(1)},\mathbf{c}^{(2)}) = \frac{2\left[\sum_u \sum_v c_{LL}^{(1)}[u,v]c_{LL}^{(2)}[u,v]
    + K\right]}{\sum_u \sum_v |c_{LL}^{(1)}[u,v]|^2 + \sum_u \sum_v |c_{LL}^{(2)}[u,v]|^2
    + K}, \tag{7}$$


    $$S_{H,t}(\mathbf{c}^{(1)},\mathbf{c}^{(2)}) = \frac{1}{J}\sum_{j=1}^{J} \frac{2\left|\sum_u
    \sum_v \sum_i c_i^{(1)}[u,v]c_i^{(2)}[u,v]\right| + K}{\sum_i \sum_u \sum_v |c_i^{(1)}[u,v]|^2
    + \sum_i \sum_u \sum_v |c_i^{(2)}[u,v]|^2 + K}, i \in \{LH_j, HL_j, HH_j\}. \tag{8}$$


    In Equations (7) and (8), $K$ is a small positive constant for arithmetic robustness
    and $K$ is set to 0.01. $\mathbf{c}^{(1)}$ and $\mathbf{c}^{(2)}$ refer to the
    corresponding subband images of the original image patch and the recovered image
    patch after 2D-DWT, respectively. The wavelet function we use is the Haar wavelet.
    $t$ is the patch index. $J = 3$ is the maximum decomposition level, and $c_{LH_j},
    c_{HL_j}, c_{HH_j}$ are high frequency subband images at the $j$-th level.


    To better understand Equation (7), one can ignore $K$, “vectorize” (as in Section
    2.2.1) $\mathbf{c}$ into $\mathbf{c}_v$ and rewrite it as


    $$S_{L,t}(\mathbf{c}^{(1)},\mathbf{c}^{(2)}) = S_{L,t}(\mathbf{c}_v^{(1)},\mathbf{c}_v^{(2)})
    = 2\frac{|\mathbf{c}_v^{(1)} \cdot \mathbf{c}_v^{(2)}|}{\|\mathbf{c}_v^{(1)}\|_2^2
    + \|\mathbf{c}_v^{(2)}\|_2^2}$$

    $= 2\frac{\|\mathbf{c}_v^{(1)}\|_2 \|\mathbf{c}_v^{(2)}\|_2}{\|\mathbf{c}_v^{(1)}\|_2^2
    + \|\mathbf{c}_v^{(2)}\|_2^2} \frac{|\mathbf{c}_v^{(1)} \cdot \mathbf{c}_v^{(2)}|}{\|\mathbf{c}_v^{(1)}\|_2
    \|\mathbf{c}_v^{(2)}\|_2}$$

    $= 2\left(\frac{\|\mathbf{c}_v^{(1)}\|_2}{\|\mathbf{c}_v^{(2)}\|_2} + \frac{\|\mathbf{c}_v^{(2)}\|_2}{\|\mathbf{c}_v^{(1)}\|_2}\right)^{-1}
    |\cos(\theta)|. \tag{9}$$


    In Equation (9), the first term is determined by the energy of the subband images.
    It will reach its maximum value 1 only if $\|\mathbf{c}_v^{(1)}\|_2 = \|\mathbf{c}_v^{(2)}\|_2$.
    In the second term, $\cos(\theta) = \frac{\mathbf{c}_v^{(1)} \cdot \mathbf{c}_v^{(2)}}{\|\mathbf{c}_v^{(1)}\|_2
    \|\mathbf{c}_v^{(2)}\|_2}$ is the cosine similarity [50]. If $\mathbf{c}_v^{(1)}$
    and $\mathbf{c}_v^{(2)}$ point to roughly the same direction, the cosine similarity
    will be close to 1. However, the cosine function falls in range $[-1,1]$. Therefore
    we are taking the absolute value so that it falls in $[0,1]$. The interpretation
    of Equation (8) is largely the same with that of Equation (7). Equation (8) additionally
    averages the contribution of each level of subband to the high frequency DW-SSIM
    in order to cope with the patterned noise in underground mine images. This can
    be better understood through the discussion in Section 3.3.


    In the second stage, a weighted sum of $S_{H,t}$ and $S_{L,t}$ is figured out
    to form the final DW-SSIM $S$:


    $$S(\mathbf{x},\hat{\mathbf{x}}) = \frac{1}{T}\sum_{t=1}^{T} \left(\gamma_1 S_{L,t}
    + \gamma_2 S_{H,t}\right), \tag{10}$$


    where $T$ is the total number of image patches, $\gamma_1$ and $\gamma_2$ are
    parameters to adjust the weight of low frequency subband and high frequency subbands.
    Since we want to emphasize high frequency details such as edges and spikes in
    the image, we set $\gamma_1 = 0.2$ and $\gamma_2 = 0.8$.


    The computation of DW-SSIM is summarized with Algorithm 1. The window length $l$
    in the proposed method is set to 15. The stride $s$ that the window will move
    in each iteration is set to 8.'
  merge: -1
  img_proc: true
- pgno: 72
  md: "# Algorithm 1: The procedure to compute discrete wavelet similarity (DW-SSIM).\n\
    \nInput: The original image img-ori and the recovered image img-rec of the same\
    \ height H and width W (H > 0, W > 0); the decomposition level J; the stride s\
    \ that the window will move in each iteration; the window length l; the weights\
    \ γ1 and γ2 in Equation (10)\n\nOutput: The DW-SSIM similarity S between img-ori\
    \ and img-rec\n\n```\nS ← 0;\nt ← 0;\nup ← 0;\nleft ← 0;\nwhile up < H do\n  down\
    \ ← up + l;\n  while left < W do\n    t ← t + 1;\n    right ← left + l;\n    Get\
    \ image patch patch-ori within the window [up, down, left, right] from img-ori;\n\
    \    Get image patch patch-rec within the window [up, down, left, right] from\
    \ img-rec;\n    Derive c^(1) by performing 2D-DWT on patch-ori;\n    Derive c^(2)\
    \ by performing 2D-DWT on patch-rec;\n    Derive S_{L,t} from Equation (7);\n\
    \    Derive S_{H,t} from Equation (8);\n    S ← S + γ1 S_{L,t} + γ2 S_{H,t};\n\
    \    left ← left + s;\n  end\n  up ← up + s;\nend\nS ← S / t;\nreturn S;\n```\n\
    \nDW-SSIM loss. The DW-SSIM defined in Equation (10) falls in range (0,1]. The\
    \ more the original image and the recovered image matches each other, the closer\
    \ DW-SSIM S is to 1. However, the loss should be near 0 if the model has done\
    \ a perfect recovery. Moreover, the loss should fall in range [0,1). Therefore,\
    \ we define the DW-SSIM loss as:\n\nL_S(x, x̂) = 1 − S(x, x̂). (11)\n\n# 2.4.\
    \ Learning the Parameters\n\nThe encoder module and the decoder module can be\
    \ trained in an end-to-end manner using the proposed network architecture and\
    \ the proposed loss function. Mini-batch gradient descent is used to train the\
    \ model with the batch size being 64. The Adam [51] optimizer is utilized as well.\
    \ We set the initial learning rate to 5 × 10⁻⁴. The learning rate is multiplied\
    \ by 0.2 when the loss is not going down during training. The training is stopped\
    \ if the learning rate drops below 1 × 10⁻⁶.\n\n# 3. Results\n\n# 3.1. Overview\n\
    \nIn order to generalize the recovery capability, the network of the proposed\
    \ method is trained on both images from video images we have collected in underground\
    \ mines and images from the COCO 2014 dataset [52]. We build the training set\
    \ by extracting the 100 × 100 center-crop patches from the images, and converting\
    \ them to grayscale images."
  merge: -1
  img_proc: true
- pgno: 73
  md: 'After the model is trained, test images (as in Figure 5) are passed to the
    model to perform the compression and recovery. We test our method on both standard
    images of Barbara, Fingerprint, and Lena to verify its effectiveness. In addition,
    we test the proposed method on images of coal cutter and tunnel boring machine
    (TBM) which are from real underground mines to evaluate the performance in the
    application-specific environment.


    The recovery quality is quantitatively evaluated with peak-signal-to-noise ratio
    (PSNR) and structural similarity (SSIM) [46]:


    PSNR(x, x̂) = 10 log₁₀ d² / (1/N Σᵢ₌₁ᴺ (x[i] - x̂[i])² ), (12)


    SSIM(x, x̂) = (2 μₓ μₓ̂ + C₁)/(μₓ² + μₓ̂² + C₁) · (2 σₓ σₓ̂ + C₂)/(σₓ² + σₓ̂²
    + C₂) · (σₓₓ̂ + C₃)/(σₓ σₓ̂ + C₃). (13)


    In Equation (12), d is the dynamic range of pixel intensities, and N is the number
    of pixels in the image. In Equation (13), μₓ and μₓ̂ are means of x and x̂, and
    σₓ² and σₓ̂² are variances of x and x̂. σₓₓ̂ is the cross correlation of x and
    x̂. The small positive constants C₁ = C₂ = C₃ = 0.01 prevent numerical instability
    of each term.


    To verify the effectiveness of the proposed method, the quantitative evaluation
    at compression ratios of 0.25, 0.20, 0.15, 0.10, 0.04 and 0.01 is carried out,
    with the compression ratio defined in Equation (1). In addition, the proposed
    method is compared to the algorithms of D-AMP [15], ReconNet [13] and TVAL3 [29]
    at different compression ratios. For simplicity, we do not re-implement the algorithms
    but use the demo code provided by the authors’ websites instead.


    Further, visual quality evaluation of recovery is presented at some specific compression
    ratios. Finally, the robustness of the proposed method is tested by recovering
    images contaminated by different levels of Gaussian noise.


    The proposed method was implemented with Pytorch [53] and pytorch_wavelet package
    (https://github.com/fbcotter/pytorch_wavelets). The training process is carried
    out on Ubuntu 18.04.2, with Nvidia Tesla K80 GPU and Intel Xeon CPU. More details
    about the implementation can be found in the code which we have made public on
    the Internet (https://github.com/y0umu/ResCSNet).


    ![](img/8b41ef3997625b78ba4cb189dbc5f7b9_73_0.png)


    Figure 5. The test images: (a) Barbara; (b) Fingerprint; (c) Lena; (d) Coal cutter;
    (e) Tunnel boring machine (TBM).


    # 3.2. Quantitative Evaluation


    Tables 1 and 2 provide quantitative measurements of the proposed method and other
    algorithms at different compression ratios. As the compression ratio r decreases,
    all the algorithms being compared have PSNR and SSIM decreased. It can be interpreted
    from Table 1 that the proposed method is second only to D-AMP at compression ratio
    r ≥ 0.20 for both standard test images and real underground mine images. Yet the
    proposed method achieves the highest PSNR compared to other algorithms at a compression
    ratio r ≤ 0.15. It should be also noted that for the recoveries of images of coal
    cutter and TBM at compression ratios r ≤ 0.04, the proposed method has an edge
    over other algorithms by a margin of at least 1.8 dB, indicating the potential
    of the application-specific usage in mines of the proposed method.'
