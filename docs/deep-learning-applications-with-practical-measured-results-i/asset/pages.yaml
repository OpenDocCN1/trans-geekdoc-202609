    # 6. Conclusions


    The work presented herein is Part I of the whole work, describing our methods
    for characterization and correction of lateral stage geometric errors. With implementation
    of the 21 parametric errors based on the assumption of the rigid body kinematics
    for calculating the machine volumetric errors of a three-axis machine, a mathematical
    model for correcting the lateral stage deviations of the CM was developed.


    According to the measurement principle of CM, a diagram of the axis chain vector
    was drawn. Equation (1) was developed according to the kinematic path of the chain
    vector. After the rearrangement of Equation (1) and its simplification by dropping
    Z→ and T→, this equation was further simplified due to the study specifications
    and characteristics of the CM. The function errors were approximated by Legendre
    polynomials. Finally, Equations (4) and (5) for corrections of kinematic geometric
    errors were obtained. The methodology for calculation and application of the corrections
    coefficients defined in Equations (4) and (5) are introduced afterwards. Experiments
    on a dot grid target standard artefact will be measured and studied in Part II,
    published in the same journal.


    The algorithms that will be implemented for the measurement data processing are
    presented and validated. These algorithms apply a lot of methods, including form
    removal, K-means clustering, linear and non-linear Least Squares. Their mathematical
    models were also introduced. The results of the validation based on synthetic
    data imply that our mathematical models and algorithms are reliable.


