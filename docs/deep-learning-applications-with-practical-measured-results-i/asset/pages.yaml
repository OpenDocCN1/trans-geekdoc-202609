  md: 'Article


    # Multivariate Temporal Convolutional Network: A Deep Neural Networks Approach
    for Multivariate Time Series Forecasting


    Renzhuo Wan 1, Shuping Mei 1, Jun Wang 1, Min Liu 2 and Fan Yang 1,*


    1 Nano-Optical Material and Storage Device Research Center, School of Electronic
    and Electrical Engineering, Wuhan Textile University, Wuhan 430200, China


    2 State Key Laboratory of Powder Metallurgy, School of Physics and Electronics,
    Central South University, Changsha 410083, China


    * Correspondence: yangfan@wtu.edu.cn


    Received: 7 July 2019; Accepted: 5 August 2019; Published: 7 August 2019


    **Abstract:** Multivariable time series prediction has been widely studied in
    power energy, aerology, meteorology, finance, transportation, etc. Traditional
    modeling methods have complex patterns and are inefficient to capture long-term
    multivariate dependencies of data for desired forecasting accuracy. To address
    such concerns, various deep learning models based on Recurrent Neural Network
    (RNN) and Convolutional Neural Network (CNN) methods are proposed. To improve
    the prediction accuracy and minimize the multivariate time series data dependence
    for aperiodic data, in this article, Beijing PM2.5 and ISO-NE Dataset are analyzed
    by a novel Multivariate Temporal Convolution Network (M-TCN) model. In this model,
    multi-variable time series prediction is constructed as a sequence-to-sequence
    scenario for non-periodic datasets. The multichannel residual blocks in parallel
    with asymmetric structure based on deep convolution neural network is proposed.
    The results are compared with rich competitive algorithms of long short term memory
    (LSTM), convolutional LSTM (ConvLSTM), Temporal Convolution Network (TCN) and
    Multivariate Attention LSTM-FCN (MALSTM-FCN), which indicate significant improvement
    of prediction accuracy, robust and generalization of our model.


    **Keywords:** deep learning; multivariate time series forecasting; multivariate
    temporal convolutional network


    # 1. Introduction


    With the explosive growth of Internet of Things (IoT) applications and big data,
    multivariate time series is becoming ubiquitous in many fields, e.g., aerology
    [1], meteorology [2], environment [3], multimedia [4], power energy [5], finance
    [6], and transportation [7]. The precise trend forecasting, as well as for potential
    hazardous events, based on historical dynamical data are a major challenge, especially
    for aperiodic multivariate time series. One of the crucial reasons is aperiodic
    and nonlinearity among variables, which is incapable by models to capture and
    have self-adaption of the complex data features. Traditional methods such as Autoregressive
    (AR) [8] models and Gaussian Process (GP) [9] may fail. As an important part of
    the field of artificial intelligence, deep neural networks (DNNs) provide state-of-the-art
    accuracy on many tasks [10] and has been developed intensively in natural language
    processing (NLP), computer vision (CV), time series classifications and time series
    forecasting.


    Enlightened by algorithms used in NLP (i.e., Sequence to Sequence [11,12] and
    Attention mechanism) and CV (i.e., Dilated convolution network [13] and residual
    structure [14]), in this paper, the M-TCN model is proposed for aperiodic multivariate
    time-series prediction, which constructs'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'the aperiodic data as sequence-to-sequence and a novel multichannel and asymmetric
    residual blocks network. The model is cross validated by a rich set of existing
    competitive models with an aperiodic time series dataset. The reminder of the
    article is organized as follows: Section 2 reviews the background work. Section
    3 presents the methodology of the proposed model. In Section 4, the experiment
    is analyzed and discussed. Finally, conclusions and outlook are drawn in Section
    5.


    # 2. Background


    One of the major challenges of multivariate time series forecasting is nonlinearity
    and aperiodic of data originated by short-term and long-term dynamical behavior.
    Various models have been established based on classical statistic methods or machine
    learning algorithms.


    The prominent classical univariate time series model is Autoregressive (AR) with
    classical statistic algorithms, as well as its progeny. The AR method is well
    used to stationary time series. The improved models, such as autoregressive integrated
    moving average (ARIMA) [15], autoregressive moving average (ARMA) [16], and vector
    auto-regression (VAR) [17], were developed by including flexible exponential smoothing
    techniques. However, for long-term temporal patterns, these models are inevitably
    prone to overfitting and high computational cost, especially for high-dimensional
    inputs.


    Alternative methods by treating the time series forecasting problems as general
    regression with time-varying parameters were applied by machine learning models,
    e.g., linear support vector regression (SVR) [18], random forest [19], ridge regression
    [20] and LASSO [21] models. Those models are practically more efficient due to
    high quality off-the-shelf solutions in machine learning community. Still, machine
    learning based models may be incapable of including complex nonlinearity dependences
    of multivariate large datasets.


    Meanwhile, the well-built deep neural networks of Convolutional Neural Networks
    (CNNs) and Recurrent Neural Networks (RNNs) have been widely applied in time series
    forecasting, which are attributed to the open source deep learning frameworks,
    such as Keras (Keras, available online: https://keras.io), TensorFlow (TensorFlow,
    available online: https://tensorflow.org) and PyTorch (PyTorch, available online:
    https://pytorch.org), including flexible and sophisticated mathematical libraries.
    Some representative models are long short-term memory (LSTM) [22] and its inheritors,
    convolutional LSTM (ConvLSTM) [23] and Multivariate Attention LSTM-FCN (MALSTM-FCN)
    [24], which overcome the challenges involved in training a recurrent neural network
    for a mixture of long and short-term horizons. However, these models are time
    consuming and non-robust for aperiodic data forecasting.


    Another novel method for time-series forecasting is a hybrid multiscale approach,
    such as empirical mode decomposition (EMD) [25], ensemble EMD (EEMD) [26], multi-level
    wavelet decomposition network (mWDN) [27] and variational mode decomposition (VMD)
    [28]. These methods are used to decompose data into different frequencies’ components
    to facilitate forecasting. However, the pre-design decomposition K value is an
    essential prerequisite as an input of training models, which is not versatile
    for complicated multivariate time series prediction.


    Recently, a general architecture for a predictive sequences model by convolutional
    and recurrent architecture on sequence modeling tasks, the Temporal Convolution
    Network (TCN) [29], is proposed. The prominent characteristics of TCNs are casualness
    in convolution architecture design and sequence length. In addition, it is also
    convenient to build a very deep and wide network by a combination of residual
    network and extended convolution. Under this background, our model is designed
    based on TCN and tested for PM2.5 and electric power forecasting.


    For comparison, Table 1 contrasts the advantages and challenges of some common
    methods for multivariate time series prediction.'
