    # 6. Conclusions


    We use this method to compensate for humidity sensors of different temperature
    ranges and different individual temperatures. According to the error curve under
    different ambient temperatures, multiple linear regression analysis was used to
    determine the segmentation points, and different algorithms were used to compensate.
    The results show that the method has strong universality and is effective for
    different temperature ranges and individual measurements.


    In addition, the introduction of independent component analysis method into the
    reconstruction of measured error might further improve the compensation effect
    [20]. It should be added that the initial temperature is 25 °C when determining
    the segmentation point in this method. This temperature is employed because the
    humidity error of the sensor used in this experiment is relatively linear at approximately
    25 °C after multiple measurements. If other sensors are used, the initial values
    will be determined according to the humidity curves of those different sensors.
    However, the initial values will be not very strict, and the nearby values can
    be adaptively processed as initial values.


