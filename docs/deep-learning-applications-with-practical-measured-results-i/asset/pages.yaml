- pgno: 245
  md: '# Preprocessing.


    Data were preprocessed in order to extract fixations concerning individual RC_i
    locations for every product category PC_j and every user who was efficiently involved
    in the study. As a result, 593 rows were generated, each containing the following
    features: RC layout (horizontal/vertical)—rc_layout, RC_i location (1-4)—rc_location,
    recommendation position intensity level (1-3)—rc_location_intensity, total fixation
    time for RC layout—fixation_time_layout, total fixation time for RC_i location—fixation_time_location,
    total time spent on product category page—fixation_time_category, percentage of
    time while fixation was registered inside the RC layout in relation to total time
    spent on category page—share_time_layout_category, percentage of time while fixation
    was registered inside RC_i location in relation to total time spent on category
    page—share_time_location_category, percentage of time while fixation was registered
    inside RC_i location in relation to total time spent on RC layout—share_time_location_layout,
    user age—user_age, level of user’s cognitive abilities—user_cognitive_ability_level,
    adding the product to cart action (and its purchase) from RC—add_to_cart. The
    features concerning the time spent looking at RC were introduced to measure interest
    in the recommending interface.


    All the features beside the last one were used to predict the add-to-cart action,
    which, in the case of our study, was selected as the ultimate efficiency measure.
    This measure was selected due to the purchase task given to participants. In another
    scenario, a different efficiency measure could be applied, for example, interest
    level generated by recommending interface, measured as time spent on recommended
    product pages.


    # Neural network.


    The preprocessed data were used to train a neural network responsible for the
    evaluation of recommending interfaces. Multi-layer perceptron deep neural network
    architecture was chosen as most suitable for the classification problem with a
    low number of features and training records. It allowed for the deep learning
    of the relationship between interactions with different recommending interfaces
    and their efficiency, where success was measured as the add-to-cart action. IBM
    SPSS Statistics was utilized for building the deep learning network.


    # 4. Results


    # 4.1. Eye-Tracking Results of Recommending Interface Efficiency


    After completing the task, 33% of participants responded that they felt their
    selection was influenced by the RC areas of the site (6% felt strongly about it),
    while others claimed the opposite, including 52% who strongly felt they did not
    care about recommendations on the website. The last group did indeed seem to show
    strong resistance to the recommendations—some of those participants, when shown
    the RC sections after the test, were surprised that they might have neglected
    most of them at all, treating them comparably to adverts, which confirms the prevalence
    of the habituation effect.


    The analysis of eye-tracking data shows that the task took, on average, 2.3 min
    to complete. In the study, 312 products were selected for purchase in total. Fixation
    time on the recommending interface was, on average, 16.3 s per person, which is
    12% of the average task completion time. The mean amount of time devoted by subjects
    to observing RC was 8.2 s and 8.1 s for the vertical and horizontal layouts, respectively.
    Thus, in terms of fixation time, the two presented variants of the recommending
    interface layout offered equal performance.


    Table 1 shows in more detail the distribution of these times for all locations
    of recommendation items. It was found that the first three locations, RC_i, were
    the most favorable, irrespective of the layout. The least eye-catching locations
