    is the current genetic evolution algebra, and M is the population size. H_Oi and
    H_Ci are the standard humidity values expected and the humidity values actually
    obtained by the network of the i-th individual.


    4. The genetic simulated annealing algorithm finds individuals with optimal fitness
    based on a series of operations such as selection, crossover, mutation and annealing.
    Compare the current fitness and historical best fitness of each individual in
    the population. If the current value is better, the current value is the best
    value of the history, and save the individual as the best value of history, otherwise
    the best value will not change.


    5. The genetic simulated annealing algorithm obtains the optimal individual as
    the initial weight and threshold of the BP neural network. The optimized BP neural
    network is used to train the humidity data at different temperatures.


