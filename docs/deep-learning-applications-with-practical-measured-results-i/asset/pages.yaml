    # 4. Nonlinear Compensation Model


    The nonlinear interval adopts the BP neural network with strong nonlinear mapping
    ability to compensate. The input of the BP neural network is temperature T and
    the measured value H1, and the output is the compensated humidity value HC. The
    humidity sensor temperature compensation model was established, and the BP neural
    network was trained by multiple sets of data. To improve the local minimum of
    the BP neural network, a genetic simulated annealing algorithm was used.


    The genetic simulated annealing algorithm is an optimization algorithm that combines
    a genetic algorithm and a simulated annealing algorithm. The local search ability
    of the genetic algorithm is limited, but the ability to grasp the overall search
    process is strong. The simulated annealing algorithm has strong local search ability
    and can prevent the search process from falling into the local optimal solution.
    However, little is known regarding the state of the entire search space. It is
    inconvenient to make the search process enter the optimal search area, which makes
    the simulated annealing algorithm less efficient. However, if the genetic algorithm
    is combined with the simulated annealing algorithm, a global search algorithm
    with excellent performance can be developed [17,18].


    The BP neural network based on the genetic simulated annealing algorithm (GSA-BP)
    is mainly divided into the determination of BP network structure and the selection
    of weight and threshold. The specific compensation steps are the following:


    +   1. Determine the topology structure of the BP neural network. The BP neural
    network is set to a three-layer network structure. The original measured value
    of temperature T and humidity sensor H1 are the network inputs, and the number
    of input nodes n1 is 2. The number of hidden layer nodes n2 is set to 7 according
    to the compensation effect. The output of the network is the humidity value HC
    after compensation, and the number of output nodes n3 is 1. The number of optimized
    parameters of the genetic simulated annealing algorithm is determined as follows:
    (n1 + 1)n2 + (n2 + 1)n3 = 29.

    2. Initialize the genetic simulated annealing algorithm. The population size with
    weights and thresholds M is 60; the maximum number of iterations MAXGEN is 2000;
    the crossover probability'
