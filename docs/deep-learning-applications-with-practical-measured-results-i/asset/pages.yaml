    all classification methods, the classification methods combined with transfer
    learning (IM_MIG, IM_SPE_MIG and NDR_MIG) showed the best OA, AA, and Kappa coefficients.
    In particular, the classification accuracy of NDR_MIG_DN method was higher than
    that of the NDR'
