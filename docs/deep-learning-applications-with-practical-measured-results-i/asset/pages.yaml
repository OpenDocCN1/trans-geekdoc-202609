    # 3.1. Multi-Constraints Optimization Problem


    The focus of this research is to plan a trajectory for an UAV from the starting
    point to the ending point, and finding the optimal trajectory satisfied with the
    multi-constraints in Problem 1, so we build mathematical models of the problem.


    # 3.1.1. Correction Area


    The trajectory planned by a UAV is three-dimensional, and it is a space with many
    correction points. (x, y, z) is defined as the coordinates of correction point
    in the correction area, where x is the error in the horizontal direction, y is
    the error in the vertical direction, and z indicates the altitude. The physical
    space of the trajectory planning can be expressed as a set: S = {(x, y, z) | 0
    ≤ x ≤ X_max, 0 ≤ y ≤ Y_max, 0 ≤ z ≤ Z_max} (1)'
