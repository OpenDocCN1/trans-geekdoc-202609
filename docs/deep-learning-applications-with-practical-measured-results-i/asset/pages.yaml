    more apparent for target and background discrimination, while repressing the ones
    not so available. It makes use of those distinguishable features for the detection
    of the targets in the frames with illumination variation, i.e., frame #156 of
    Singer2, frame #22 of Crowds, and frame #408 of David, while the compared benchmarks
    SCM, L1APG, and ALSA perform worse owing to the use of illumination-sensitive
    gray features. By fusing the features of color names (CN), color histograms (CH),
    and HoG in appropriate proportions, CLIP [34] is able to encode the appearance
    of a target from diverse aspects, which performs apparently better than HCF and
    SiamFC on Singer2, in which drastic illumination variation comes across, for the
    reason that the benchmarks have made excessive use of semantic features that are
    not of good use for the discrimination in that situation. Illumination-insensitive
    HoG feature is emphasized by TPS [14], which shows strong robustness on the frames
    of #528, #615, and #703 of Sylvester. The use of the “mean-background” that eliminates
    the influence of illumination variations makes TBE [12] more robust, which shows
    excellent results on frame #177 of Bicycle and frame #202 of Woman.


    (4) Rotation: Rotation of a target can be regarded as a type of target appearance
    variation; however, other challenging factors, such as occlusion or scale variation,
    may occur in the meantime during target’s rotation, thus in-plane and out-of-plane
    rotations are also hard problems to tackle with. In the sequence of Skating, the
    target athlete is rotating in-plane and out-of-plane alternatively, in addition
    in frame #304, it suffers intensive illumination variation; SALSC [41] is still
    able to capture the athlete after frame #304, while its compared benchmarks have
    lost the target. Excellent performance is also shown on Car4 by SALSC. These good
    performances are thanks to the template update mechanism that gives new target
    appearances and old ones with equal importance. When considering that rotation
    is the appearance change of a target that its local parts are rearranged within
    the target area of an image, LSA [17] makes use of valid target patches for the
    representation of newest target appearances that have undergone in-plane or out-of-plane
    rotation. It tracks the targets in the sequences of Basketball and Bolt, in which
    out-of-plane rotation happens much more favorably correctly as compared to L1APG
    and Struck, which do not have the capability of rotation handling. Among the network
    of LSHR [33], the midst layer does the best in coping with the rotation problems,
    in addition features that are extracted by the shallowest layer are also adopted,
    thus the network is able to deal with challenging situations in mixture of low
    resolution and rotation, whereas excellent tracking results are performed on the
    sequences of David and FleetFace. In-plane rotated targets can be spontaneously
    separated from the surroundings, owing to the background subtraction mechanism
    of TBE [12]. Though new characters of the target can appear if it has undergone
    out-of-plane rotation, because of the principle that TBE has acquired abundant
    background information that is of valuable use of background discrimination, newly
    appeared target characters are detected as background correctly; therefore, TBE
    also performs much better under this situation. Robust performances are shown
    on frames #309 and #353 of Polar bear and frames of #101 and #961 of Lemming,
    whereas other benchmark trackers can hardly achieve such correct tracking.


    (5) Scale variation and deformation: The scale of a target varies continuously
    with indeterminacy in frames, the shape of which might also vary along with its
    initiative scale change, because of the movement of targets and the camera. In
    the sequence Sylvester, the tracked doll severely deforms in frames #676 and #1078;
    DSARCF [56] can well capture the doll and precisely estimate its scale and shape,
    while the compared trackers lose the target or wrongly calculate the size during
    tracking. This is owed to the saliency information DSARCF adopts when updating
    the spatial weight map, after all the saliency map of a target can naturally reflect
    the size and shape of it. For the sequence of Bolt where the player deforms his
    body, MSRBT [54] does excellent in tracking him, owing to the local multiple feature
    pattern. In Singer1 the size of the target singer constantly varies due to frequent
    camera distance variation between him LSA [17] tracks the singer much more correctly
    than the benchmarks due to the state search mechanism based on PF. However, it
    lacks the capability to deal with more drastic scale variations.'
