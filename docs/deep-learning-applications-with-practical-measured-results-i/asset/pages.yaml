    In order to realize the autonomous trajectory planning under different planning
    environments, scientists have carried out in-depth research on the trajectory
    planning of an UAV, and proposed various algorithms, such as the Voronoi diagram
    method [8–11], A* algorithm [12–14], particle swarm optimization (PSO) algorithm
    [15–17], genetic algorithm [18–20], neural network algorithm [21,22], artificial
    potential field method [23–25], simulated annealing algorithm [26], and so on.


    The process of finding the best trajectory includes consideration of constraints.
    The optimal path must produce an optimal objective function and satisfy multiple
    constraints. However, conventional methods can only handle one objective function
    at a time, and they cannot handle optimization problems involving two or more
    objective functions. Thus, a combined objective function is formed by mathematically
    aggregating two or more separate objective functions. The weighted values are
    introduced into the combined objective function formula to reflect its relative
    importance. In this work, we propose a trajectory path planning algorithm of a
    UAV based on genetic algorithm and A* algorithm under multiple constraints, and
    then satisfied the system positioning accuracy conditions.


    The paper is organized as follows: Section 2 provides the necessary background:
    problem statement, model assumptions, and multiple constraints. Section 3 describes
    in detail an UAV trajectory planning Problem 1 based on positioning accuracy constraints,
    and uses an improved genetic algorithm to design a trajectory planning algorithm,
    and finally get the results of the trajectory planning. Section 4 describes in
    detail an UAV trajectory planning Problem 2 based on Problem 1, and uses an improved
    A* algorithm to design a trajectory planning algorithm, and finally get the results
    of the trajectory planning. Section 5 presents the performance comparison of the
    proposed algorithm with the traditional swarm intelligence algorithm. Section
    6 concludes the paper and gives the further work.


    # 2. Background


    # 2.1. Problem Statement


    In practical applications, the planning scope is often up to one million square
    kilometers, and the planning area environment is very complicated. In addition
    to the topographical factors, the planning process needs to consider various constraints
    such as aircraft maneuverability, penetration requirements, and flight missions.
    This research is a simplified version of the actual problem, without considering
    the aircraft’s maneuverability, penetration requirements, threats, and many other
    factors. However, there are multiple constraints.


    In this research, we mainly consider the trajectory error correction problem of
    an UAV based on system positioning accuracy constraints. Due to system structure
    limitations, the positioning system of such aircraft cannot accurately locate
    itself. Once the positioning error accumulates to a certain extent, the task may
    fail. Therefore, correcting the positioning error during flight is an important
    task in UAV trajectory planning. The trajectory planning problem of an UAV is
    a complex multi-constrained optimization problem. UAV trajectory planning refers
    to considering the positioning error during the flight due to a series of factors
    such as the environment and weather during the flight. Therefore, some safe positions
    are assumed in the flight area (called correction points) for safety correction.
    In order to enable a UAV to follow the original trajectory planning from the starting
    point to the ending point, several correction points are needed in the flight
    area to correct the trajectory error of an UAV.


    Under the premise of many constraints, the correct point is selected to correct
    the error of a UAV, and the best flight path from the starting point to the ending
    point is planned for an UAV, so that the number of times a UAV is corrected by
    the correct points during the flight is as small as possible, and the trajectory
    length is as small as possible. How to ensure that a UAV meets the various constraints
    and the optimal trajectory requirements, and to quickly and accurately obtain
    the true flight trajectory is the problem that needs to be solved urgently. In
    the aircraft trajectory planning problem, the standard'
