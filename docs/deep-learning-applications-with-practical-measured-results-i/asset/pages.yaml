    # 2.3. The Proposed Loss Function


    # 2.3.1. Combination of Two Types of Loss Functions


    Image recovering problems are conventionally seen as optimization problems that
    minimize the l2 loss between the recovered and original image. However, from the
    perspective of image recovery quality assessment, l2 metric does not reflect every
    aspect of signal fidelity [46]. Therefore, it is necessary to combine other metrics
    that compensate for what is missing in l2 loss when constructing the loss function.


    In this section, we propose a metric termed discrete wavelet structural similarity
    (DW-SSIM) that focuses the recovery of edges of the images. Our loss function
    is the weighted sum of DW-SSIM loss and l2 loss:


    $$L(\mathbf{x},\hat{\mathbf{x}})=\sum_{\mathbf{x}\in\Omega}\left(\beta_{1}L_{F}(\mathbf{x},\hat{\mathbf{x}})+\beta_{2}L_{S}(\mathbf{x},\hat{\mathbf{x}})\right)$$
    $$\beta_{1}+\beta_{2}=1$$ $$0\le\beta_{1},\beta_{2}\le1,$$ (5)


    where Ω represents a set of training image, $L_F(\mathbf{x},\hat{\mathbf{x}})$
    denotes the $l_2$ loss, $L_S(\mathbf{x},\hat{\mathbf{x}})$ denotes the DW-SSIM
    loss, and $\beta_1=0.5$ and $\beta_2=0.5$ are weights. Both $L_F(\mathbf{x},\hat{\mathbf{x}})$
    and $L_S(\mathbf{x},\hat{\mathbf{x}})$ are set up to fall in range $[0,1)$. Section
    2.3.2 will provide the expression of $L_F(\mathbf{x},\hat{\mathbf{x}})$, while
    Section 2.3.3 will explain $L_S(\mathbf{x},\hat{\mathbf{x}})$ in details.


    # 2.3.2. l2 Loss


    We propose to use Frobenius norm in $L_F(\mathbf{x},\hat{\mathbf{x}})$ to derive
    the $l_2$ loss:'
