  md: '# Algorithm 1: Training procedure.


    ```

    1: min_lr = 1e-4; epoch = 200; initial_lr = initial_lr

    2: factor

    3: for n < epoch do

    4:   wait += 1

    5:   if best_score > RMSE

    6:     best_score = RMSE

    7:     save model

    8:   if wait >= 10

    9:     if initial_lr > min_lr

    10:      min_lr = initial_lr × factor

    11:      new_lr = max(new_lr, min_lr)

    12:      wait = 0

    ```


    # 4. Experiments


    In this section, we first describe two datasets for empirical studies. All of
    the data are available online. Then, the parameter settings of model and evaluation
    metrics are introduced in our studies. Finally, the proposed M-TCN model against
    different baseline models is compared.


    # 4.1. Datasets


    Two benchmark datasets are used which are publicly available. Table 2 summarizes
    the corpus statistics.


    Beijing PM2.5 Dataset (available online: https://archive.ics.uci.edu/ml/datasets/Beijing+PM2.5+Data):
    It contains hourly PM2.5 data and the associated meteorological data in Beijing,
    China. The exogenous time series include dew point, temperature, and atmospheric
    pressure, combined wind direction, cumulated wind speed, hours of snow, and hours
    of rain. In total, we have 43,824 multivariable sequences. For this dataset, the
    hourly PM2.5 data are used as a predictive value.


    ISO-NE Dataset (available online: https://www.iso-ne.com/isoexpress/web/reports/load-and-demand):
    The time range of the dataset is between March 2003 and December 2014. The ISO-NE
    Dataset includes hourly demand, prices, weather data and system load. The dataset
    contains two variables, which are hourly electricity demand in MW and dry-bulb
    temperature in °F. For this dataset, the hourly electricity demand is used as
    a predictive value.


    # Table 2. Dataset statistics.


    | Datasets | Length of Time Series | Total Number of Variables | Sample Rate |

    |---|---|---|---|

    | ISO-NE | 103,776 | 2 | 1 h |

    | Beijing PM2.5 | 43,824 | 8 | 1 h |


    In our experiments, ISO-NE datasets have been split into training set (from 1
    March 2003 to 31 December 2012), valid set (the whole year of 2013) and test set
    (the whole year of 2014) in a chronological order. In addition, the Beijing PM2.5
    Dataset has been split into a training set (from January 2, 2010 to December 31,
    2012), valid set (the whole year of 2013) and test set (the whole year of 2014)
    in a chronological order.


