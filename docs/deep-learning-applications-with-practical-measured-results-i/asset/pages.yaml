    # 5. Optimal Neighborhood Noise-Reduction Method


    In order to reduce the salt-and-pepper noise in the initial classification results,
    an optimal neighborhood noise reduction method based on the eight-neighbor mode
    label was proposed in this article. The optimal neighborhood noise reduction method
    was used to reprocess the initial classification result of the hyperspectral image.
    In the method, the hyperspectral image classification label data was used as the
    input, and the central pixel label was compared to the label of its eight-neighborhood
    pixel.


    If L(i,j) is used to represent the classification result label of a central pixel
    P(i,j) of the hyperspectral image, the class labels of the central pixel P(i,j)
    and the eight neighborhood pixels are shown in Figure 8.'
