    Correlations are computed on the native POEM grid (3°×3.75°; second column) by
    applying a 4×4 average pooling to the downscaled fields and on the downscaled
    grid (third column) by applying a low-pass filter to the high-resolution fields
    with a cut-off frequency that is consistent with the chosen spatial scale in POEM
    to be preserved. The global long-term mean absolute error with respect to ERA5
    (fourth column) and the respective error reduction compared with the POEM ESM
    bias (fifth column). The global absolute error in the 95th precipitation percentile
    (sixth column) and the error reduction with respect to the POEM ESM bias (seventh
    column). An estimation of the mean sampling time is also reported (eighth column).
    The best performance is given in bold font.


    # Results


    We evaluate our CM-based downscaling method against an SDE bridge$^{7,8}$ over
    the test-set data. We investigate the performance of downscaling, the ability
    to correct distributional biases in the ESM, the sample spread given a chosen
    spatial scale and the preservation of trends in future climate scenarios.


    # Downscaling spatial fields


    For a qualitative comparison, we show single precipitation fields in Fig. 2. Both
    generative downscaling methods, based on the SDE bridge (Fig. 2e) and CM (Fig.
    2g), can produce high-resolution precipitation fields that are visually indistinguishable
    from the upscaled ERA5 data (Fig. 2a). A similar performance can be seen when
    downscaled simulations from the state-of-the-art GFDL-ESM4 and the more lightweight
    SpeedyWeather$^{1}$ general circulation model, as well as when applying our method
    to initially upscaled ERA5 data as a proof of concept (Supplementary Figs. 3 and
    6).


    When upscaled back to the native ESM resolution using a 4 × 4-kernel average pooling,
    an accurate representation of the low-resolution ESM simulation field is apparent.
    As indicated in Fig. 2f,g, for the case of the Potsdam Earth Model (POEM) model,
    a high Pearson correlation of 0.89 and 0.95 for the SDE and CM methods, respectively,
    is maintained between upscaled corrected and native fields. We provide correlation
    statistics for the entire test set in Table 1. Besides the average pooled fields,
    we also compare the downscaled and linearly interpolated POEM simulation on the
    high-resolution grid by applying a low-pass filter with a cut-off frequency set
    to k$^{*}$ = 0.067 on the downscaled fields before computing the correlation.
    In this way, we test the preservation of the large-scale patterns in the ESM.
    More specifically, we measure how similar the downscaled fields are to the original
    coarse fields when upsampling them back to the same resolution. The SDE bridge
    achieves a mean correlation of 0.918 and 0.916 for the average pooled and low-pass
    filtered fields, respectively. Our CM-based method achieves even higher correlation
    values of 0.954 and 0.941 for the corresponding measures. The CM-based downscaling
    also shows higher correlations when downscaled ERA5 (Supplementary Table 2).


    We estimate the average time it takes to produce a single sample with the SDE
    and CM methods on an NVIDIA V100 32 GB graphics processing unit. The average is
    taken over 100 data points. We note the number of SDE integration steps to 500
    (ref. 17), which is lower than the typical 1,000–2,000 steps$^{12,15}$. The SDE
    takes an average of 39.4 s, whereas the CM samples are much more efficient, taking
    only 0.1 s, scaling linearly with the number of samples.


    We analyse the downscaling performance of the CM and SDE bridge approaches quantitatively
    using power spectral densities (PSDs)$^{8,25}$. The interpolated ESM fields under-represent
    variability at small spatial scales, because these are not present in the low-resolution
    simulation. This implies an underestimation of spatial intermittency, that is,
    overly smooth precipitation patterns, which is highly problematic for impact assessment.
    The generative downscaling methods based on SDEs and CM perform very well in increasing
    spatial resolution and greatly improve the spatial intermittency at smaller spatial
    scales (Fig. 3c). The PSD improvements are found to be consistent when applying
    the CM downscaling to the GFDL-ESM4 and SpeedyWeather$^{1}$ simulations (Supplementary
    Fig. 4).


    We also investigate the change in PSDs as a function of the noise variance schedule
    time t (Fig. 3b), which is directly related to the spatial scale up to which patterns
    are corrected$^{1}$. For minimal noise, that is, t$^{*}$ = t$^{min}$, the CM model
    reproduces the PSD of the ESM, as expected from equation (5) because there are
    no changes made to the ESM field. For maximal variance with t$^{*}$ = t$^{max}$,
    the PSD closely matches the ERA5 reanalysis ground truth. For any t$^{min}$ <
    t$^{*}$ < t$^{max}$, we find a trade-off between the two extreme cases that match
    the PSD above and below the intersection (Fig. 3a, dotted grey line) to a certain
    degree, depending on the spatial scales preserved in the ESM.


    To test the temporal consistency of the downscaled fields, we report temporal
    autocorrelation values computed for each grid cell as global averages (Supplementary
    Fig. 8). We find that the generative and stochastic SDE and CM methods result
    in a more accurate temporal correlation than the deterministic approach of quantile
    mapping and bilinear interpolation.


    # Bias correction


    We compare the ability to correct biases in the ESM with histograms of relative
    frequency and latitude profiles of mean precipitation to investigate the reduction
    in known biases such as double Intertropical Convergence Zone (ITCZ)$^{18}$, following
    the evaluation methodology discussed elsewhere$^{9}$.


    When applied to the ESM simulations with preprocessing via quantile delta mapping
    (QDM), the ability of the CM to correct biases naturally depends on the chosen
    spatial consistency scale (Supplementary Fig. 9). Selecting the smallest scale
    reproduces the ESM without any changes, thereby inheriting its biases. Choosing
    the largest possible scales generates samples with statistics very close to the
    target dataset. However, the fields become increasingly upsampled to the ESM at
    such high noise levels (Fig. 1). A scale between these two extremes can correct
    for biases to a varying degree, depending on the chosen correction scale.


    In terms of relative frequency histograms, the ESM simulations (without QDM preprocessing)
    exhibit a very strong under-representation of the right tail of the distribution,
    that is, of the extremes (Fig. 4a,b). This misrepresentation of extremes is a
    key problem with existing state-of-the-art ESMs and makes future projections of
    extreme events and their impacts, as well as related detection and attribution
    of extremes, highly uncertain.


    Applying QDM to POEM strongly improves the frequency distributions as expected.
    Downscaling the ESM with the SDE further improves the global histograms by an
    order of magnitude, particularly for the extremes. Our CM-based method shows the
    overall largest bias reduction in the global histograms (Fig. 4b). When applied
    to the different ESMs and the upscaled ERA5 data, our method shows a consistent
    bias correction skill (Supplementary Fig. 5).


    We further compute the error in the 95th percentile of the local precipitation
    histogram for each grid cell and aggregate the absolute value globally (Table
    1). The SDE method shows an error of 1.106 mm day$^{-1}$, reducing the error of
    the POEM ESM by 68.15%. The CM method performs slightly better with an error of
    1.080 mm day$^{-1}$ and a respective'
