  md: '![](img/cdba53dcfff3f101fe91360e2f61dbbc_5_0.png)


    Fig. 4 | Comparison of global histograms and longitudinal mean precipitation.
    **a**, Global histograms of relative precipitation frequency for the ERA5 reanalysis
    data (black). POEM simulations without applying QDM preprocessing (grey), POEM
    simulations with QDM (orange), the SDE bridge (cyan) and the CM (magenta). **b**,
    Absolute errors of the histograms in **a** with respect to the ERA5 ground truth.
    **c**, Precipitation averaged over time and longitudes for the same data as in
    **a**, **d**. Absolute errors of the latitude profile in **c**. Both SDE and CM
    downscaling methods are able to further improve on the QDM preprocessing in terms
    of bias correction, most particularly for extreme precipitation.


    particularly when processing large ensembles of ESMs, without noticeable trade-offs
    in accuracy.


    Our CM-based approach can create highly realistic fields that maintain high correlation
    levels with the ESMs at the spatial scales chosen to be preserved. We find slightly
    better and at least competitive results when compared with the much more computationally
    expensive SDE-based method. The efficient single-step generation of ESM fields
    will be particularly relevant for processing large datasets, for example, large
    ensembles as needed for uncertainty quantification, for simulations with a high
    temporal resolution, or long-term studies such as those in paleoclimate simulations.
    The ability to calibrate the ensemble harness and spread using different noise
    scales could be useful for weather prediction tasks, too. When applying our method
    to weather predictions, changes in the training data and splits might be of advantage
    to avoid distributional shifts due to the availability of satellite data. Improving
    the efficiency of current deep learning models is also important from an energy
    consumption perspective; in this regard, our method provides a valuable contribution
    towards greener artificial intelligence ³¹.


    When evaluated on a future very high-emission scenario, we find that our generative
    CM method accurately preserves the trend of the ESM, even for an extreme scenario
    of greenhouse gas


    emissions and associated global warming. This is remarkable as many machine-learning-based
    applications to climate dynamics struggle with the out-of-sample problem imposed
    by our highly non-stationary climate system, when trained on historical data alone.
    In contrast to previous studies ³˒⁴, to achieve this, it is not necessary to add
    specifically formulated physical constraints to our model. Our unconstrained CM
    method, hence, allows for a more natural generalization to unseen climate states,
    inherently translating non-stationary dynamics from the ESM to the downscaled
    high-resolution fields. However, as the global mean of the ESM is only approximately
    conserved with our method, adding a hard architecture constrained as that in ref.
    24 (which fulfils a constraint up to machine precision) could further improve
    our results.


    Grid-cell-wise autocorrelation estimates between subsequent fields suggest that
    a CM-based stochastic downscaling method captures the temporal variability of
    the high-resolution target data, although not explicitly, using temporal information.
    Extending the approach to temporal conditioning or predicting several time steps³²
    or using correlated noise³³ might further improve the temporal dynamics.


    Our downscaling method increases the resolution of the ESM simulations by a factor
    of four in this study. Given a higher-resolution training target and more computational
    resources, it should, in principle, also allow for larger downscaling ratios.'
