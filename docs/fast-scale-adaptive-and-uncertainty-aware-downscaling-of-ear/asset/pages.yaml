    and CM show a similar absolute error for these latitude profiles as when only
    applying SDE alone (Fig. 4c).


    We report the absolute value of the grid-cell-wise error in the long-term mean,
    again averaged globally, for both downscaling methods (Table 1). The SDE downscaling
    results in an error of 0.214 mm day$^{-1}$, reducing the error in POEM by 72.51%,
    and performing slightly better than our CM method, which exhibits an error of
    0.217 mm day$^{-1}$ and a respective error reduction of 72.08% when applied to
    POEM. Evaluated on the ERAS data, we find that the CM method performs slightly
    better than the SDE in terms of mean absolute error and RMSE (Supplementary Table
    2).


    # Quantifying the sampling spread


    Our generative CM-based downscaling is stochastic, with a one-to-many mapping
    of a single ERA5 field to many possible downscaled realizations. It, thus, naturally
    yields a probabilistic downscaling, suitable to estimate the associated uncertainties.
    By selecting a given spatial scale in the ESM to be preserved by the downscaling
    method, one automatically chooses a related degree of freedom to generate patterns
    on smaller scales. Given that our CM method is very efficient at inference, we
    can generate a large ensemble of high-resolution fields that are consistent with
    the low-resolution ESM input, and compute statistics such as the sampling spread,
    which can be interpreted as a measure of the inherent uncertainty of the downscaling
    task.


    We compute an ensemble of $10^{4}$ downscale fields from a single ESM precipitation
    field (Fig. 5a) and evaluate the mean and standard deviation (Fig. 5d,e). The
    ensemble mean shows close similarity to the ESM simulation interpolated to the
    same high-resolution grid. The sample spread shows patterns similar to the mean,
    although with a smaller magnitude.


    We evaluate an ensemble of 100 downscaled realizations of coarse ESM fields using
    the continuous ranked probability score (CRPS)$^{39}$, for three different noise
    scales, corresponding to $t=f_{\min}$, $t^{*}=t$ and $t=f_{\max}$ (Supplementary
    Fig. 7). Further, the CRPS is evaluated as a skill score (continuous ranked probability
    skill score) relative to the baseline ensemble of 100 random high-resolution ESM
    fields. We find that the noise strength enables the calibration of ensemble spread,
    which is sharp for small noise scales and increasingly broad for larger noise
    scales. The intermediate noise scale ($t=t^{*}$) shows the lowest CRPS, and maximum
    noise leads to a similar continuous ranked probability skill score to the baseline
    climatology of drawing random fields. For definitions of the CRPS and continuous
    ranked probability skill score, see Supplementary Section 8.


    # Future projections


    The efficient nature of our CM approach enables the downscaling of long climate
    simulations over a century, such as that prescribed with the SSP5-8.5 high-emission
    scenario from the Coupled Model Intercomparison Project Phase 6. We find that
    the downscaling accurately preserves the global precipitation content of the ESM
    and preserves the nonlinear trends, as expected from the Clausius--Clapeyron relation$^{38}$.
    The network, thus, generalizes to the out-of-sample predictions of increasing
    global mean precipitation without the need for hard-coding auxiliary physics constraints
    in the network, as done in other work$^{34,35,37}$. However, our method can, in
    principle, be extended to such constraints to exactly preserve trends. We note
    that the ability to preserve trends is expected to be related to the noise variance
    used for conditioning the downscaling, as maximum noise corresponds to sampling
    from the learned historical ESM distribution, and the absence of noise does not
    alter the ESM simulation in any way.


    # Discussion


    We introduced a generative machine learning approach for the efficient, scale-adaptive
    and probabilistic downscaling of ESM precipitation fields. Our approach is based
    on CMs, a recently developed method that learns a self-consistent approximation
    of a reversed diffusion process. The CM can generate highly realistic global precipitation
    fields learned from the ERAS reanalysis data, which is used as the ground truth,
    in a single step. Our framework corrects the representation of extreme events
    as well as spatial ESM patterns especially at small spatial scales, which are
    both crucial for impact assessments. Moreover, spatial biases are also corrected
    efficiently.


    For the specific task considered here, the CM method is up to three orders of
    magnitude faster than current diffusion models based on SDEs$^{12,13,15,17}$,
    which need to iteratively solve a differential equation. Crucially, the CM maintains
    a high degree of controllability to guide the sampling in such a way that unbiased
    spatial patterns larger than a chosen spatial scale in ESMs are preserved.


    Similar to the SDE-based method$^{17}$ that apply to idealized fluid dynamics,
    our CM-based model only needs to be trained once on a given high-resolution observational
    target dataset. Because we do not condition on the ESM input during training,
    our method can be applied to any ESM without the need for retraining. Combined
    with the efficient sampling of CMs, our approach is computationally fast.'
