    # 文章


    ![](img/cdba53dcfff3f101fe91360e2f61dbbc_4_0.png)


    ![](img/cdba53dcfff3f101fe91360e2f61dbbc_4_1.png)


    **图 3 | 全球降水场平均空间功率谱密度（PSD）。** a，目标 ERAS 再分析数据（黑色）、插值到相同高分辨率网格的 POEM 模拟（橙色）、SDE
    桥（青色）和 CM 降尺度（品红色）的 PSD 比较。垂直虚线标记了 POEM 和 ERAS 的 PSD 相交的空间尺度，因此是校正截止波数 *k* 的自然选择。反过来，术语
    $\langle f^{2}\rangle$ 是扩散模型中的加噪强度（方程 (11)）。b，针对不同空间尺度应用 CM 降尺度（虚线）于 PCOEM，作为全范围
    $[f_{\min}, f_{\max}]$ 上加噪强度的函数。对较小尺度加噪意味着几乎重现 POEM 模拟，而对较大尺度加噪则对应于与 ESM 的较弱配对（图
    1）。


    和 CM 显示，对于这些纬度剖面，仅应用 SDE 时绝对误差相似（图 4c）。


    我们报告了两种降尺度方法在长期平均值中网格单元格误差的绝对值，再次在全球范围内平均（表 1）。SDE 降尺度导致 0.214 mm day$^{-1}$ 的误差，将
    POEM 中的误差降低了 72.51%，表现略优于我们的 CM 方法，该方法应用于 POEM 时显示出 0.217 mm day$^{-1}$ 的误差和 72.08%
    的相应误差降低。在 ERAS 数据上评估时，我们发现就平均绝对误差和 RMSE 而言，CM 方法的表现略优于 SDE（补充表 2）。


    ## 量化采样分散度


    我们的生成式基于 CM 的降尺度是随机的，将单个 ERA5 场一对一映射到许多可能的降尺度实现。因此，它自然地产生概率降尺度，适合估计相关的 uncertainty。通过选择
    ESM 中由降尺度方法保留的特定空间尺度，自动选择了一个相关的自由度以在较小尺度上生成模式。鉴于我们的 CM 方法在推理方面非常高效，我们可以生成与低分辨率
    ESM 输入一致的大量高分辨率场集合，并计算诸如采样分散度等统计量，这可以解释为降尺度任务内在不确定性的度量。


    我们从单个 ESM 降水场计算了 $10^{4}$ 个降尺度场的集合（图 5a），并评估平均值和标准差（图 5d,e）。集合平均值与插值到相同高分辨率网格的
    ESM 模拟显示出高度相似性。样本分散度显示出与平均值相似的模式，尽管幅度较小。


    我们使用连续排名概率得分（CRPS）$^{39}$ 评估了由粗粒度 ESM 场组成的 100 个降尺度实现集合，对应于三种不同的噪声尺度，分别为 $t=f_{\min}$，$t^{*}=t$
    和 $t=f_{\max}$（补充图 7）。此外，CRPS 是作为相对于由 100 个随机高分辨率 ESM 场组成的基线集合的技能得分（连续排名概率技能得分）来评估的。我们发现，噪声强度使得集合分散度能够进行校准，对于小噪声尺度其很尖锐，而对于较大噪声尺度则变得越来越宽。中间噪声尺度（$t=t^{*}$）显示出最低的
    CRPS，而最大噪声导致与从基线气候学中绘制随机场的连续排名概率技能得分相似。关于 CRPS 和连续排名概率技能得分的定义，见补充章节 8。


    ## 未来预测


    我们 CM 方法的高效性质使得对长达一个世纪的气候模拟进行降尺度成为可能，例如由耦合模式比较计划第 6 阶段（CMIP6）规定的 SSP5-8.5 高排放情景。我们发现，降尺度准确地保留了
    ESM 的全球降水含量，并保留了非线性趋势，正如从 Clausius--Clapeyron 关系$^{38}$ 所预期的那样。因此，网络可以泛化到全球平均降水增加的样本外预测，而无需在网络中硬编码辅助物理约束，如其他工作中所做的那样$^{34,35,37}$。然而，原则上，我们的方法可以扩展到这些约束以准确保留趋势。我们注意到，保留趋势的能力预计与用于条件降尺度的噪声方差有关，因为最大噪声对应于从学习到的历史
    ESM 分布中采样，而没有噪声则以任何方式不改变 ESM 模拟。


    ## 讨论


    我们介绍了一种生成式机器学习方法，用于对 ESM 降水场进行高效、尺度自适应和概率降尺度。我们的方法基于 CM，这是一种最近开发的方法，用于学习逆向扩散过程的自一致近似。CM
    可以在单步中生成从 ERAS 再分析数据（用作基准）学习的高度逼真的全球降水场。我们的框架校正了极端事件的表征以及空间 ESM 模式，特别是在小空间尺度上，这两者对于影响评估都至关重要。此外，空间偏差也被高效地校正了。


    对于此处考虑的具体任务，CM 方法比当前基于 SDE 的扩散模型快多达三个数量级$^{12,13,15,17}$，后者需要迭代求解微分方程。关键在于，CM
    保持了高度的可控性，以引导采样，从而保留 ESM 中大于选定空间尺度的无偏空间模式。


    类似于应用于理想化流体动力学的基于 SDE 的方法$^{17}$，我们的基于 CM 的模型只需要在给定高分辨率观测目标数据集上训练一次。由于我们在训练期间不以
    ESM 输入作为条件，我们的方法可以应用于任何 ESM 而无需重新训练。结合 CM 的高效采样，我们的方法在计算上很快。


    ![](img/cdba53dcfff3f101fe91360e2f61dbbc_5_0.png)


    **图 4 | 全球直方图和纵向平均降水的比较。** **a**，ERA5 再分析数据（黑色）、未应用 QDM 预处理的 POEM 模拟（灰色）、应用 QDM
    的 POEM 模拟（橙色）、SDE 桥（青色）和 CM（品红色）的相对降水频率全球直方图。**b**，相对于 ERA5 基准，**a** 中直方图的绝对误差。**c**，与
    **a** 中相同数据在时间和经度上的平均降水，**d**。**c** 中纬度剖面的绝对误差。SDE 和 CM 降尺度方法都能进一步改善 QDM 预处理的偏差校正，特别是对于极端降水。


    特别是在处理大型 ESM 集合时，且在准确性上没有明显的折衷。


    我们的基于 CM 的方法可以创建高度逼真的场，这些场在与选择保留的空间尺度上维持与 ESM 的高度相关水平。与计算成本高昂得多的基于 SDE 的方法相比，我们发现结果略好或至少具有竞争力。ESM
    场的高效单步生成对于处理大型数据集特别相关，例如，不确定性量化所需的大型集合，高时间分辨率模拟，或诸如古气候模拟等长期研究。使用不同噪声尺度校准集合 harness
    和分散度的能力对于天气预报任务也可能有用。在将我们的方法应用于天气预报时，改变训练数据和划分可能有利，以避免因卫星数据的可用性而导致的分布偏移。从能源消耗的角度来看，提高当前深度学习模型的效率也很重要；在这方面，我们的方法为更绿色的人工智能提供了有价值的贡献$^{31}$。


    当在将来非常高的排放情景下评估时，我们发现我们的生成式 CM 方法准确保留了 ESM 的趋势，即使对于温室气体排放和伴随全球变暖的极端情景也是如此。这是非凡的，因为许多基于机器学习的气候动力学应用难以应对由我们高度非平稳气候系统施加的样本外问题，当仅基于历史数据进行训练时。与先前的研究$^{34}$相反，为此目的，不需要向我们的模型添加专门制定的物理约束。因此，我们无约束的
    CM 方法允许对未见过的气候状态进行更自然的泛化，固有地将 ESM 中的非平稳动力学转化为降尺度后的场。然而，由于我们的方法只是近似守恒 ESM 的全球平均值，添加如参考文献
    24 中那样硬性架构约束（其满足约束直至机器精度）可能会进一步改善我们的结果。


    后续场之间的网格单元格自相关估计表明，基于 CM 的随机降尺度方法捕捉了高分辨率目标数据的时间变异性，尽管没有明确使用时间信息。将该方法扩展到时间条件或预测多个时间步$^{32}$或使用相关噪声$^{33}$可能会进一步改善时间动力学。


    我们的降尺度方法在本研究中将 ESM 模拟的分辨率提高了四倍。给定更高分辨率的训练目标和更多的计算资源，原则上，它也应该允许更大的降尺度比例。


