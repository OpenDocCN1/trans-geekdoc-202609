    ## Scale-consistent downscaling


    As shown in other work$^{45,48}$, adding Gaussian noise with a chosen variance
    to an image (or fluid dynamical snapshot) results in removing spatial patterns
    up to a specific spatial scale associated with the amount of added noise. The
    trained generative model can then replace the noise with spatial patterns learned
    from the training data up to the chosen spatial scale.


    In principle, the spatial scale can be chosen depending on the given downscaling
    task, for example, related to the ESM resolution or variable. Hence, our method
    allows for much more flexibility after training in which the optimal training
    scale could be defined with respect to any given metric. In general, ESM fields
    are too smooth at small spatial scales, which presents a key problem for Earth
    system modelling in general and impact assessments in particular. More specifically,
    when comparing the frequency distribution of spatial precipitation fields in terms
    of spatial PSDs, it can be seen that ESMs lack the high-frequency spatial variability,
    or spatial intermittency, which is a key characteristic of precipitation$^{49}$.
    Hence, a natural choice for the spatial scale to be preserved in the ESM fields
    is the intersection of PSDs from the ESM and the ground-truth ERA5 (ref. 17) (Fig.
    3), that is, the scale at which the ESM fields become too smooth.


    where $k$ is the current training step and $K$ is the estimated total number of
    training steps obtained from the PyTorch Lightning library. The initial discretization
    steps are set to $s_0 = 2$ and the maximum number of steps to $s_n = 150$ (ref.
    23). With $\hat{\theta}$, we denote an exponential moving average over the model
    parameters $\theta$, updated by $\hat{\theta} = \text{stograd}[w(k)\hat{\theta}
    + (1-w(k)\theta)]$, with the decay schedule given by


    ```

    w(k) = exp(s0 log($\alpha_0$) / N(k))

    (9)

    ```


    where $w_0 = 0.9$ is the initial decay rate$^{50}$. For the distance measure $d(\cdot,
    \cdot)$, we follow another work$^{35}$ and use a combination of the learned perceptual
    image patch similarity$^{51}$ and $l^p$ norm:


    ```

    $d(x, y) = \text{LPIPS}(x, y) + \|x-y\|_l$

    (10)

    ```


    Thus, the training of the CMI is self-supervised and closely related to representation
    learning$^{52}$, where a so-called online network $\hat{\text{f}}: \theta$ is
    trained to predict the same image representation as a ''target network'' $\text{f}:
    \hat{\theta}$ (ref. 44). Importantly, the CMI is, therefore, not trained explicitly
    for the downscaling tasks, which are purely performed at the inference stage.


    For Gaussian noise, the variance as a function of time $t$ can be related to the
    PSD of a given wavenumber $k$ and the grid size $N$ by$^{47}$


    ```

    $\sigma^2(t) = N^{p}\text{PSD}(k)$

    (11)

    ```


    Using equation (11), we choose $k^* = 0.0667$ (Supplementary Fig. 2), such that
    it represents the wavenumber or spatial scale at which the PSDs of ESMs and ERA5
    precipitation fields intersect. This corresponds to $t^* = 0.468$ for the CM variance
    schedule and $t^* = 0.355$ for the SDE bridge.


    The diffusion bridge$^{47}$ starts with the forward SDE in equation (1), initialized
    with a precipitation field from the POEM ESM. The forward SDE is then integrated
    until $t = T$. Then, the reverse SDE (equation (2))—initialized at $t = T$—denoises
    the field again, adding structure from the target ERA5 distribution.


    For the CM approach, at inference, we apply the ''stroke guidance'' technique$^{48,53}$,
    where we first sample a noise ESM field $\mathbf{x}^{\text{ESM}} \in \mathbb{R}^{d}$
    with variance corresponding to $t^*$:


    ```

    $\mathbf{x}^{\text{ESM}} \sim \mathcal{N}(\textbf{x}^{\text{ESM}}, \sigma^2(t^*)\mathbf{I})$

    (12)

    ```


    which is then denoised in a single step with the CM:


    ```

    $\mathbf{x} = f(\mathbf{x}^{\text{ESM}}, t^*, \theta)$

    (13)

    ```


    thereby highly efficiently generating realistic samples $\mathbf{x}$ that preserve
    unbiased spatial patterns of the ESM up to scale $k^*$.


