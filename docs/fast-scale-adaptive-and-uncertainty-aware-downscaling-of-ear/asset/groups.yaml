  - '[PAGE 0]


    # nature machine intelligence


    Article


    https://doi.org/10.1038/s42256-025-00980-5


    # Fast, scale-adaptive and uncertainty-aware downscaling of Earth system model
    fields with generative machine learning


    +   - Received: 1 March 2024

    - Accepted: 20 December 2024

    - Published online: 13 March 2025

    - Check for updates


    Philipp Hess $^{1, 2} \odot$, Michael Aich $^{1, 2}$, Baoxiang Pan $^{3, 5} \&$
    Niklas Boers $^{1, 2, 4} \odot$


    Accurate and high-resolution Earth system model (ESM) simulations are essential
    to assess the ecological and socioeconomic impacts of anthropogenic climate change,
    but are computationally too expensive to be run at sufficiently high spatial resolution.
    Recent machine learning approaches have shown promising results in downscaling
    ESM simulations, outperforming state-of-the-art statistical approaches. However,
    existing methods require computationally costly retraining for each ESM and extrapolate
    poorly to climates unseen during training. We address these shortcomings by learning
    a consistency model that efficiently and accurately downscales arbitrary ESM simulations
    without retraining in a zero-shot manner. Our approach yields probabilistic downscaled
    fields at a resolution only limited by the observational reference data. We show
    that the consistency model outperforms state-of-the-art diffusion models at a
    fraction of the computational cost and maintains high controllability on the downscaling
    task. Further, our method generalizes to climate states unseen during training
    without explicitly formulated physical constraints.


    Accurate and high-resolution climate simulations are of crucial importance in
    projecting the climatic, hydrological, ecological and socioeconomic impacts of
    anthropogenic climate change. Precipitation is one of the most important climate
    variables, with particularly large impacts, for example, on vegetation and crop
    yields, infrastructure or the economy $^{1}$. However, it is also the variable
    that is arguably the most difficult to model and predict, especially extreme precipitation
    events, resulting from a complex interaction of processes over a large range of
    spatial and temporal scales that cannot be fully resolved.


    Numerical Earth system models (ESMs) are our main tool to project the future evolution
    of precipitation and its extremes. However, they exhibit biases and have much
    coarser spatial resolution, on the order of 10–100 km, than that needed for the
    reliable assessments of impacts of climate change $^{2}$. Therefore, ESM projections
    have to be downscaled to higher resolution, for which several machine-learning-based


    approaches have recently been proposed. Due to the chaotic nature of geophysical
    fluid dynamics, the trajectory of climate simulations will not match historical
    observations, requiring approaches suitable for unpaired samples to learn such
    tasks. Recently, methods from generative deep learning have shown promising results
    in downsampling or correcting spatial patterns of ESM simulations. Normalizing
    flows (NFs) $^{6}$ and generative adversarial networks (GANs) $^{3,4,7-9}$ can
    perform these tasks efficiently in a single step $^{5,10}$. However, NFs often
    exhibit lower quality, for example, less sharp and less detailed generated images,
    whereas GANs can suffer from training instabilities and problems such as mode
    collapse $^{11}$. Moreover, these approaches require computationally expensive
    retraining of the neural networks for each specific ESM simulation to be processed.
    This makes downscaling large ESM ensembles, as needed in impact assessments, prohibitively
    costly and time-consuming.


    +   1. $^{1}$Earth System Modelling, School of Engineering and Design, Technical
    University Munich, Munich, Germany. $^{2}$PotSDam Institute for Climate Impact
    Research, Potsdam, Germany. $^{3}$Institute of Atmospheric Physics, Chinese Academy
    of Sciences, Beijing, China. $^{4}$Global Systems Institute and Department of
    Mathematics, University of Exeter, Exeter, UK. $^{5}$Present address: Institute
    of Atmospheric Physics, Chinese Academy of Sciences, Beijing, China.


    ✉ e-mail: philipp.hess@tum.de'
  - '[PAGE 1]


    ![](img/cdba53dcfff3f101fe91360e2f61dbbc_1_0.png)


    **Fig. 1 | Sketch of CM for downscaling ESM fields.** Unconditional training of
    score-based diffusion and CMs that learn to reverse a forward diffusion process
    (i). Although the SDE of the diffusion model requires an iterative integration
    over many steps, the CM only takes a single step to generate a global precipitation
    field from noise. The unconditionally trained CM is used to downscale (upsample)
    a low-resolution ESM precipitation field to a four times higher resolution (ii).
    By adding noise of a chosen variance to the ESM field, the spatial scale to be
    preserved in the ESM can be controlled: a small noise variance implies a close
    pairing to the original ESM field with only small changes; a larger variance will
    result in changes at larger spatial scales and in weaker pairing to the ESM field.


    Diffusion-based generative models have demonstrated superior performance over
    NFs and GANs on classical image generation tasks1,2,3. Crucially, iteratively
    solving the reversed diffusion equation allows for strong control over the image
    sampling process.


    This enables foundation models for computer vision and image processing, which
    are only trained to generate target dataset samples from noise and which can later
    be repurposed for different downstream tasks, for example, inpainting, classification,
    colourisation or generating realistic images based on a given “stroke sketch”
    guide as with SDEdit14,15,16.


    So far, such diffusion-model-based approaches have only been applied to downscale
    idealized fluid dynamics17,18 in Earth system science-related tasks. Both studies
    use stochastic differential equation (SDE)-based diffusion models and achieve
    remarkable performance. The iterative integration of the SDE, however, implies
    that the generative network needs to be evaluated up to 1,000 times to downscale
    a single simulation field. This makes such methods unsuitable for processing large
    simulation datasets, for example, at high temporal resolution or over long periods,
    as would be needed in the context of climate change projections and impact assessments.


    Much effort has been taken to improve the sampling speed of diffusion models.
    Using ordinary differential equations instead of SDEs can reduce the number of
    integration steps to around 10–50 (refs. 19,20). Distillation techniques can also
    be applied to improve the sampling speed to a single step21,22. However, they
    require additional training costs and hyperparameter choices. In general, a trade-off
    between the number of generative steps and the resulting image quality scores
    has been found11,13,20. Recently, consistency models (CMs) have been


    proposed that can be directly trained as single-step generative models without
    sacrifices in the controllability of sampling23. CMs have been shown to outperform
    distilled single-step diffusion models on common image benchmarks24.


    In this work, we tackle the shortcomings of standard diffusion models by using
    CMs23 to downscale global precipitation simulations from three different ESMs
    in a single step (Fig. 1). In summary, we aim to establish a generative model
    for downscaling ESM fields that fulfils the following conditions:


    +   * The CM model is trained on the target dataset only, without conditioning
    on the ESM. This makes the method applicable to any ESM without requiring computationally
    expensive retraining.

    * The training minimizes a regression loss that is more stable than the adversarial
    training in previous methods25,6,29,30.

    * The generative downscaling is controllable at the inference stage after training,
    allowing the choice of a characteristic spatial scale up to which unbiased spatial
    patterns are preserved in the ESM.

    * The model only requires a single network evaluation instead of the many iterative
    evaluations in diffusion-model-based downscaling approaches5,7.

    * The model allows to generate a large number of downscaled realizations for a
    single ESM field (that is, a one-to-many mapping), enabling probabilistic downscaling
    and a quantification of the sampling spread.

    * The method does not require specifically formulated physical constraints26 to
    preserve trends27.'
