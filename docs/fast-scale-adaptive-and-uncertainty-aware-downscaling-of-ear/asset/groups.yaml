    ## 表 1 | 对比我们的 CM 方法与作为基准的 SDE 桥接方法的汇总统计


    | 模型 | 相关性（池化） | 相关性（低通） | 平均误差 | %S | 95 分位误差 | 采样时间（秒） |

    |---|---|---|---|---|---|---|

    | SDE | 0.918 | 0.916 | 0.214 | 72.51 | 1.106 | 68.15 | 39.4 |

    | CM | 0.954 | 0.941 | 0.217 | 72.08 | 1.080 | 68.92 | 0.1 |


    相关性是在原生 POEM 网格（$3^{\circ} \times 3.75^{\circ}$；第二列）上通过将对降尺度场应用 $4 \times 4$ 平均池化计算的，以及在降尺度网格（第三列）上通过对高分辨率场应用与
    POEM 中选定空间尺度一致的低通滤波器计算的。第四列为相对于 ERA5 的全球长期平均绝对误差，第五列为与 POEM ESM 偏差相比的相应误差减少量。第六列为
    95 分位降水量的全球绝对误差，第七列为与 POEM ESM 偏差相比的误差减少量。还报告了平均采样时间的估计值（第八列）。最佳性能以粗体显示。


    ## 结果


    我们在测试集数据上评估了基于 CM 的降尺度方法，将其与 SDE 桥接方法$^{7,8}$进行了对比。我们研究了降尺度的性能、纠正 ESM 中分布偏差的能力、给定选定空间尺度时的样本传播情况，以及在未来气候情景中趋势的保持情况。


    ## 降尺度空间场


    为了进行定性比较，我们在图 2 中展示了单个降水场。基于 SDE 桥接（图 2e）和 CM（图 2g）的两种生成式降尺度方法都能产生高分辨率降水场，这些场在视觉上与上采样的
    ERA5 数据（图 2a）无法区分。当对最先进的 GFDL-ESM4 和更轻型的 SpeedyWeather$^{1}$ 大气环流模型的降尺度模拟应用我们的方法时，以及当作为概念证明将我们的方法应用于最初上采样的
    ERA5 数据时（补充图 3 和 6），也可以看到类似的性能。


    当使用 $4 \times 4$ 内核平均池化上采样回原生 ESM 分辨率时，可以清楚地看出对低分辨率 ESM 模拟场的准确表示。如图 2f,g 所示，对于波茨坦地球模型（POEM）模型的情况，上采样后的校正场与原生场之间保持了
    0.89（SDE 方法）和 0.95（CM 方法）的高皮尔逊相关系数。我们在表 1 中提供了整个测试集的相关性统计。除了平均池化场之外，我们还通过将截止频率设为
    $k^{*} = 0.067$ 的低通滤波器应用于降尺度场，然后在计算相关性之前比较高分辨率网格上的降尺度和线性插值的 POEM 模拟。这样，我们测试了 ESM
    中大尺度模式的保持情况。更具体地说，我们测量了当上采样回相同分辨率时，降尺度场与原始粗场有多相似。SDE 桥接方法在平均池化场和低通滤波场的平均相关系数分别为
    0.918 和 0.916。我们的基于 CM 的方法在相应度量上实现了更高的相关值，分别为 0.954 和 0.941。基于 CM 的降尺度在处理降尺度 ERA5
    时也显示了更高的相关性（补充表 2）。


    我们估计在 NVIDIA V100 32 GB 图形处理单元上，使用 SDE 和 CM 方法生成单个样本所需的平均时间。平均值是对 100 个数据点取的。我们将
    SDE 积分步数设为 500（参考 17），这低于典型的 1,000–2,000 步$^{12,15}$。SDE 平均耗时 39.4 秒，而 CM 样本效率更高，仅耗时
    0.1 秒，且采样时间随样本数量线性扩展。


    我们使用功率谱密度（PSDs）$^{8,25}$定量分析了 CM 和 SDE 桥接方法的降尺度性能。插值后的 ESM 场在小空间尺度上的变化表示不足，因为低分辨率模拟中不存在这些变化。这意味着空间间歇性的低估，即降水模式过于平滑，这对影响评估来说是一个高度具有问题性的问题。基于
    SDE 和 CM 的生成式降尺度方法在提高空间分辨率方面表现非常出色，并在较小的空间尺度上极大地改善了空间间歇性（图 3c）。当将 CM 降尺度应用于 GFDL-ESM4
    和 SpeedyWeather$^{1}$ 模拟时，PSD 的改进效果保持一致（补充图 4）。


    我们还研究了 PSD 作为噪声方差调度时间 $t$ 的函数变化（图 3b），这与模式被校正到的空间尺度直接相关$^{1}$。对于最小噪声，即 $t^{*}
    = t^{\min}$，正如公式 (5) 所预期的那样，由于没有对 ESM 场进行任何更改，CM 模型重现了 ESM 的 PSD。对于具有最大方差的 $t^{*}
    = t^{\max}$，PSD 与 ERA5 再分析真值紧密匹配。对于任何 $t^{\min} < t^{*} < t^{\max}$，我们发现这两种极端情况之间存在权衡，在某种程度上匹配交点（图
    3a，灰色虚线）上方和下方的 PSD，具体取决于 ESM 中保留的空间尺度。


    为了测试降尺度场的时间一致性，我们报告了作为全局平均值计算的每个网格单元的时间自相关值（补充图 8）。我们发现，生成式和随机性的 SDE 和 CM 方法比分位数映射和双线性插值的确定性方法具有更准确的时间相关性。


    ## 偏差校正


    我们比较了校正 ESM 中偏差的能力，使用相对频率直方图和平均降水的纬度剖面图，以研究已知偏差的减少，例如双赤道辐合带（ITCZ）$^{18}$，遵循在别处讨论的评估方法$^{9}$。


    当应用于通过分位数 delta 映射（QDM）进行预处理的 ESM 模拟时，CM 校正偏差的能力自然取决于所选的空间一致性尺度（补充图 9）。选择最小的尺度会原封不动地重现
    ESM，从而继承其偏差。选择尽可能大的尺度会生成统计量非常接近目标数据集的样本。然而，在如此高的噪声水平下，场会逐渐变成上采样的 ESM（图 1）。介于这两个极端之间的尺度可以根据所选的校正尺度不同程度上地校正偏差。


    就相对频率直方图而言，ESM 模拟（未经 QDM 预处理）表现出分布右尾（即极端值）的强烈表示不足（图 4a,b）。对极端值的这种错误表示是现有先进 ESM
    的一个关键问题，这使得未来极端事件及其影响的预测，以及相关的极端值检测和归因，高度不确定。


    将 QDM 应用于 POEM 时，如预期那样，频率分布得到了显著改善。使用 SDE 对 ESM 进行降尺度进一步将全球直方图改善了一个数量级，特别是对于极端值。我们的基于
    CM 的方法在全球直方图中显示出最大的整体偏差减少（图 4b）。当应用于不同的 ESM 和上采样的 ERA5 数据时，我们的方法显示出一致的偏差校正技能（补充图
    5）。


    我们进一步计算了局部降水直方图 95 分位数的误差，并在全球范围内汇总绝对值（表 1）。SDE 方法显示的误差为 1.106 mm day$^{-1}$，将
    POEM ESM 的误差减少了 68.15%。CM 方法表现略好，误差为 1.080 mm day$^{-1}$，相对于 ESM 的相应误差减少量为 68.92%。当对最初上采样的
