    but one can train a score network, s(x, t; \theta): \mathbb{R}^{d} \rightarrow
    \mathbb{R}^{d}, to approximate the score function s(x, \theta) \approx \nabla_{x}\log
    p_{t}(x), for example, using denoising score matching (Supplementary Information).
    For sampling, we use the Euler–Maruyama solver to integrate the reverse SDE from
    T to t = 0 in equation (2) with 500 steps.


    ## Methods


    **Training data**


    As a target and ground-truth dataset, we use observational precipitation data
    from the ERA5 reanalysis ^{4} provided by the European Center for Medium-Range
    Weather Forecasting. It covers the period from 1940 to the present, and we split
    the data into a training set from 1940 to 1998, a validation set from 1991 to
    2003 and a test set from 2004 to 2018. We bilinearly interpolate the reanalysis
    data to a resolution of 0.75^{\circ} and 0.9375^{\circ} in the latitudinal and
    longitudinal directions, respectively (that is, 240 \times 384 grid points), which
    corresponds to a four times higher resolution compared with the raw ESM simulations
    with 3^{\circ} \times 3.75^{\circ} resolution (that is, 60 \times 96 grid points).


    For the ESM precipitation fields, we use global simulations from three different
    ESMs with varying complexity and resolutions. The fully coupled POEMSM, which
    includes model components for the atmosphere, ocean, ice sheets and dynamic vegetation,
    is used as the primary model for comparison of two generative downscaling methods
    for past and future climates. To demonstrate the ability of our CM-based method
    to correct any ESM with a coarser native resolution to the training ground truth,
    we further include daily precipitation simulations from the much more comprehensive
    and complex GFDL-ESM4 (ref. 36), with a native resolution of 1^{\circ} \times
    1^{\circ}. We initially upscale the GFDL-ESM4 resolution to the same grid as the
    POEMSM data to allow direct comparisons. We further include SpeadyWeather,^{37}
    with a native resolution of 3.75^{\circ} \times 3.75^{\circ}, which only has a
    dynamic atmosphere and is, hence, less comprehensive than the fully coupled POEMSM.
    Finally, we also use ERA5 data upscaled to the native POEM resolution as the test
    data for which a paired ground truth is available. Applying our method to the
    latter can, hence, be seen as a proof of concept.


    For evaluation, we use 14 years of available historical data from each of the
    simulations, with periods 2004–2018 for POEM, 2000–2014 for GFDL-ESM4, 1956–1970
    for SpeadyWeather, and 2007–2021 for ERA5.


    We apply several preprocessing steps to the simulated input data. We first interpolate
    the input simulation on the same high-resolution grid as the ground-truth ERA5
    data for downscaling purposes and model evaluation. Low-pass filter is then applied
    to remove small-scale artefacts created by the interpolation. QDM^{16} with 500
    quantiles is then applied in a standard way to remove distributional biases in
    the ESM simulation for each grid cell individually. As discussed in the ''Bias
    correction'' section, the generative downscaling only corrects biases related
    to a specified spatial scale. Hence, the QDM steps ensures a strong reduction
    in single-cell biases, whereas generative downscaling corrects spatial patterns
    that are physically consistent. Finally, the ESMs and ERA5 data are log-transformed,
    x = \log(x + e) \rightarrow \log[e] where e = 0.0001 (ref. 5), followed by a normalization
    approximately in the range [−1, 1].


    ### Consistency models


    One major drawback of current diffusion models is that the numerical integration
    of the differential equation requires around 10–2,000 network evaluations, depending
    on the solver. This makes the generation process computationally inefficient and
    costly compared with other generative models such as GANs^{4} or NFs^{3, 30, 32}
    that can generate images in a single network evaluation. Distillation techniques
    can reduce the number of forward steps of diffusion models, which often represent
    a computational bottleneck ^{22, 25}.


    CMs can be trained from scratch without distillation and only require a single
    step to generate a new sample. They have been shown to outperform current distillation
    techniques ^{32}. CMs learn a consistency function, f(x(t), t) = f(x(t^{\prime}),
    t^{\prime}) which is self–consistent, that is,


    $$f(x(t), t) = f(x(t^{\prime}), t^{\prime}), \quad t, t^{\prime} \in [t_{min},
    t_{max}], \quad \mathbf{(3)}$$


    where the time interval is set to t_{min} = 0.002 and t_{max} = 80 (ref. 32).
    Furthermore, a boundary condition (x(t_{min}), t_{min}) for t = t_{min} is imposed.
    This can be implemented with the following parameterization:


    $$f(x, t, \theta) = c_{skip}(t)x + c_{out}(t)F(x, t, \theta), \quad \mathbf{(4)}$$


    where F(\cdot) is a U-Net with parameter \theta. The time information is transformed
    using a sine–cosine positional embedding in the network. The coefficients c_{skip}(t)
    and c_{out}(t) are defined ^{32} as


    $$c_{skip}(t) = \frac{\sigma^{2}_{data}}{(\sigma^{2}_{data} + \sigma^{2}(t))^{2}},
    \quad c_{out}(t) = \frac{\sigma_{data} \cdot \sigma(t)}{\sqrt{\sigma^{2}(t) +
    \sigma^{2}_{data}}}, \quad \mathbf{(5)}$$


    The training objective is given by


    $$\mathcal{L}(\theta, \theta^{\bot}) = \mathbb{E}_{x_{s_{i+1}}\sim D} \| \mu_{f}(x_{s_{i+1}}
    + t_{s_{i+1}}) - \theta \|, \quad \mathbf{(6)}$$


    where \theta^{\bot} \equiv \mathbb{E}_{x_{s_{0}}\sim D, \sim (1/U(N),1\setminus
    N)0.5},x_{s_{0}} \| \| $ and the discrete time step is determined via


    $$t_{n} = \hat{t}^{(p)}_{min} + (n-1)(N-1)(\hat{t}^{(p)}_{min} - \hat{t}^{(p)}_{max})^{1/p},
    \quad \mathbf{(7)}$$


    where p = 7 and the discretization schedule is given by


    $$N(k) = \sqrt{k/k(s^{2}_{1} + s^{2}_{0} - s^{2}_{k} + s^{2}_{0}) + 1}. \quad
    \mathbf{(8)}$$

