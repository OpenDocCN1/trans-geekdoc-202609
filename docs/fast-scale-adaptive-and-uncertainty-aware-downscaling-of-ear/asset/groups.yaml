    ## 网络架构与训练


    我们使用 Diffusers 库中的二维 U-Net$^{18,35}$ 从头开始训练评分网络和一致性网络，该网络包含四个下采样和上采样层。对于这四个层，我们使用了具有
    128、128、256 和 256 个通道以及 3 $\times$ 3 卷积核的卷积、Sigmoid 线性单元（SiLU）激活函数、组归一化，并在架构瓶颈处使用了一个注意力层。该网络总共有大约
    2700 万可训练参数。


    我们使用 Adam 优化器$^{46}$ 对核心网络进行 200 个轮次的训练，批量大小为 1，学习率为 1 $\times$ 10$^{2}$，并对模型权重应用了衰减率为
    0.999 的指数移动平均（补充信息）。


    CM 模型使用 RAdam 优化器$^{47}$ 训练 150 个轮次$^{23}$，采用与评分网络相同的批量大小、学习率和指数移动平均调度（初始衰减率为
    $\alpha_0=0.9$）。我们发现损失在训练过程中以稳定的方式下降（补充图 1）。在 NVIDIA G102 32 GB 图形处理单元上，CM 的 150
    轮训练大约需要六天半，而 SDE 需要四天半。训练超参数的摘要见补充表 1。


    ## 尺度一致的下采样


    正如其他工作$^{45,48}$所示，向图像（或流体动力学快照）添加具有选定方差的高斯噪声，结果是消除直至特定空间尺度的空间图案，该尺度与所加噪声量相关。经过训练的生成模型随后可以将噪声替换为从训练数据中学习到的、直至选定空间尺度的空间图案。


    原则上，空间尺度可以根据给定的下采样任务进行选择，例如，与 ESM 分辨率或变量相关。因此，我们的方法在训练后提供了更大的灵活性，其中最优训练尺度可以根据任何给定的指标来定义。总体而言，ESM
    场在小空间尺度上过于平滑，这是地球系统建模（总体而言）以及影响评估（特别是）的一个关键问题。更具体地说，当从空间功率谱密度（PSD）的角度比较空间降水场的频率分布时，可以看到
    ESM 缺乏高频空间变异性，即空间间歇性，这是降水的一个关键特征$^{49}$。因此，保留在 ESM 场中的空间尺度的一个自然选择是来自 ESM 和真实 ERA5（参考文献
    17）的 PSD 的交点（图 3），即 ESM 场变得过于平滑的尺度。


    其中 $k$ 是当前训练步骤，$K$ 是从 PyTorch Lightning 库获得的估计总训练步骤数。初始离散化步骤设置为 $s_0 = 2$，最大步骤数设置为
    $s_n = 150$（参考文献 23）。我们用 $\hat{\theta}$ 表示对模型参数 $\theta$ 的指数移动平均，其更新公式为 $\hat{\theta}
    = \text{stograd}[w(k)\hat{\theta} + (1-w(k)\theta)]$，衰减调度由下式给出：


    ```

    w(k) = exp(s0 log($\alpha_0$) / N(k))

    (9)

    ```


    其中 $w_0 = 0.9$ 是初始衰减率$^{50}$。对于距离度量 $d(\cdot, \cdot)$，我们遵循另一项工作$^{35}$，使用学习到的感知图像块相似度$^{51}$和
    $l^p$ 范数的组合：


    ```

    $d(x, y) = \text{LPIPS}(x, y) + \|x-y\|_l$

    (10)

    ```


    因此，CMI 的训练是自监督的，并与表示学习$^{52}$密切相关，其中所谓的在线网络 $\hat{\text{f}}: \theta$ 被训练以预测与“目标网络”
    $\text{f}: \hat{\theta}$ 相同的图像表示（参考文献 44）。重要的是，因此 CMI 并非明确为下采样任务进行训练，这些任务纯粹在推理阶段执行。


    对于高斯噪声，时间 $t$ 的方差可以通过$^{47}$与给定波数 $k$ 和网格大小 $N$ 的 PSD 相关联：


    ```

    $\sigma^2(t) = N^{p}\text{PSD}(k)$

    (11)

    ```


    使用方程 (11)，我们选择 $k^* = 0.0667$（补充图 2），使其代表 ESM 和 ERA5 降水场 PSD 相交的波数或空间尺度。这对应于 CM
    方差调度的 $t^* = 0.468$ 和 SDE 桥的 $t^* = 0.355$。


    扩散桥$^{47}$从方程 (1) 中的前向 SDE 开始，初始化为来自 POEM ESM 的降水场。然后前向 SDE 被积分直至 $t = T$。然后，反向
    SDE（方程 (2)）——在 $t = T$ 处初始化——再次对场去噪，从目标 ERA5 分布中添加结构。


    对于 CM 方法，在推理时，我们应用“笔画引导”技术$^{48,53}$，其中我们首先采样一个噪声 ESM 场 $\mathbf{x}^{\text{ESM}}
    \in \mathbb{R}^{d}$，其方差对应于 $t^*$：


    ```

    $\mathbf{x}^{\text{ESM}} \sim \mathcal{N}(\textbf{x}^{\text{ESM}}, \sigma^2(t^*)\mathbf{I})$

    (12)

    ```


    然后通过 CM 在单步内对其进行去噪：


    ```

    $\mathbf{x} = f(\mathbf{x}^{\text{ESM}}, t^*, \theta)$

    (13)

    ```


    从而高效地生成现实样本 $\mathbf{x}$，这些样本保留了 ESM 直至尺度 $k^*$ 的无偏空间图案。


