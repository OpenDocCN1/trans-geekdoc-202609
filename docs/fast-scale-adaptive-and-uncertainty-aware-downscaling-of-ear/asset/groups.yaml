    ¹² 相符。CM 降尺度（品红色）能够以高精度保留这一趋势，特别是考虑到 CM 网络未添加任何物理约束。


    我们在单变量降水模拟中展示了我们的方法，因为降水被认为是建模难度最大的气候变量。扩展到多变量降尺度是我们未来研究的自然延伸。原则上，卷积 CM 网络可以以直接的方式扩展，将更多变量作为额外通道包含进来。一致性尺度将取决于变量（通道），可能需要单独处理。类似地，我们相信我们的方法可以应用于其他时间尺度（例如，每小时以及每月），使用适当调整的声音尺度。选择最优噪音尺度如本文及他处^{2}所做的通过功率谱密度（PSD）的交点，假设谱密度随波数单调递减。虽然我们确信这对大多数气候影响变量成立，但可能存在需要不同方法的例外。我们将这些探索留待未来研究。


    例如高斯分布，到目标数据分布，p(x(t) = 0)=p_{T}，其中 x \in \mathbb{R}^{d} 且 d 是数据维度，用于分布^{3, 5,
    33-35}或图像中像素的一般情况。基于分数的生成^{3, 33, 35}模型^{3, 29}将概率去噪扩散模型^{3, 26, 32}推广到连续时间的随机微分方程（SDE）。


    在此框架中，通过逐步扰动数据的前向扩散过程可以被描述为以下 SDE 的解：


    $$dx = \mu(x, t)dt + g(t)dw, \quad \mathbf{(1)}$$


    其中 \mu(x, t): \mathbb{R}^{d} \rightarrow \mathbb{R}^{d} 是漂移项，w 表示维纳过程，g(t): \mathbb{R}
    \rightarrow \mathbb{R} 是扩散系数。用于从噪声生成图像的反向 SDE 由以下公式给出^{3}：


    $$dx = [\mu(x, t) - g(t)^{2}\nabla_{x}\log p_{t}(x)]dt + g(t)dw, \quad \mathbf{(2)}$$


    其中 t 表示时间反转，\nabla_{x}\log p_{t}(x) 是目标分布的分数函数。分数函数在解析上是不可处理的，但可以通过训练分数网络 s(x,
    t; \theta): \mathbb{R}^{d} \rightarrow \mathbb{R}^{d} 来近似分数函数 s(x, \theta) \approx
    \nabla_{x}\log p_{t}(x)，例如使用去噪分数匹配（见补充信息）。对于采样，我们使用欧拉-马尔可夫（Euler–Maruyama）求解器以
    500 步从 T 到 t = 0 积分方程 (2) 中的反向 SDE。


    ## 方法


    **训练数据**


    作为目标数据集和基准数据集，我们使用由欧洲中期天气预报中心提供的 ERA5 再分析观测降水数据^{4}。它覆盖了从 1940 年至今的时期，我们将数据划分为
    1940 年至 1998 年的训练集，1991 年至 2003 年的验证集以及 2004 年至 2018 年的测试集。我们将再分析数据双线性插值到经度方向
    0.9375^{\circ} 和纬度方向 0.75^{\circ} 的分辨率（即 240 \times 384 个网格点），这比原始 ESM 模拟的 3^{\circ}
    \times 3.75^{\circ} 分辨率（即 60 \times 96 个网格点）高出四倍分辨率。


    对于 ESM 降水场，我们使用来自三个具有不同复杂度和分辨率的 ESM 的全球模拟。完全耦合的 POEMSM，包含大气、海洋、冰盖和动态植被模型组件，作为比较过去和未来气候中两种生成式降尺度方法的主要模型。为了展示我们的基于
    CM 的方法将具有较粗原生分辨率的任何 ESM 校正到训练基准的能力，我们进一步包含了来自更综合且复杂的 GFDL-ESM4（参考文献 36）的日降水模拟，其原生分辨率为
    1^{\circ} \times 1^{\circ}。我们最初将 GFDL-ESM4 的分辨率上采样到与 POEMSM 数据相同的网格，以便进行直接比较。我们还包含了
    SpeadyWeather，^{37} 其原生分辨率为 3.75^{\circ} \times 3.75^{\circ}，由于仅具有动态大气，因此不如完全耦合的
    POEMSM 那么综合。最后，我们还将上采样到 POEM 原生分辨率的 ERA5 数据作为有配对基准可用的测试数据。因此，将我们的方法应用于后者可被视为概念验证。


    对于评估，我们使用每个模拟中可用的 14 年历史数据，POEM 的时期为 2004–2018 年，GFDL-ESM4 为 2000–2014 年，SpeadyWeather
    为 1956–1970 年，ERA5 为 2007–2021 年。


    我们对模拟输入数据应用了几个预处理步骤。首先，我们将输入模拟插值到与基准 ERA5 数据相同的高分辨率网格上，用于降尺度目的和模型评估。然后应用低通滤波器以去除插值产生的小尺度伪影。随后以标准方式应用具有
    500 个分位数的 QDM^{16}，以逐个网格单元去除 ESM 模拟中的分布偏差。如“偏差校正”部分所述，生成式降尺度仅校正与指定空间尺度相关的偏差。因此，QDM
    步骤确保了单格偏差的强烈减少，而生成式降尺度则校正物理上一致的空间图案。最后，对 ESM 和 ERA5 数据进行对数变换，x = \log(x + e) \rightarrow
    \log[e]，其中 e = 0.0001（参考文献 5），然后进行大致在 [−1, 1] 范围内的归一化。


    ### 一致性模型


    当前扩散模型的一个主要缺点是，数值积分微分方程需要大约 10–2,000 次网络评估，具体取决于求解器。这使得与其他生成模型（如 GANs^{4} 或 NFs^{3,
    30, 32}）相比，生成过程在计算上低效且成本高昂，后者可以单次网络评估生成图像。蒸馏技术可以减少扩散模型的前向步骤数量，这通常代表计算瓶颈^{22, 25}。


    CM 可以从头训练而不需蒸馏，并且只需单步即可生成新样本。已证明它们优于当前的蒸馏技术^{32}。CM 学习一致性函数，f(x(t), t) = f(x(t^{\prime}),
    t^{\prime})，这是自洽的，即：


    $$f(x(t), t) = f(x(t^{\prime}), t^{\prime}), \quad t, t^{\prime} \in [t_{min},
    t_{max}], \quad \mathbf{(3)}$$


    其中时间区间设置为 t_{min} = 0.002 且 t_{max} = 80（参考文献 32）。此外，在 t = t_{min} 时施加边界条件 (x(t_{min}),
    t_{min})。这可以通过以下参数化实现：


    $$f(x, t, \theta) = c_{skip}(t)x + c_{out}(t)F(x, t, \theta), \quad \mathbf{(4)}$$


    其中 F(\cdot) 是具有参数 \theta 的 U-Net。时间信息在网络中通过正弦-余弦位置嵌入进行转换。系数 c_{skip}(t) 和 c_{out}(t)
    的定义^{32}为：


    $$c_{skip}(t) = \frac{\sigma^{2}_{data}}{(\sigma^{2}_{data} + \sigma^{2}(t))^{2}},
    \quad c_{out}(t) = \frac{\sigma_{data} \cdot \sigma(t)}{\sqrt{\sigma^{2}(t) +
    \sigma^{2}_{data}}}, \quad \mathbf{(5)}$$


    训练目标由以下公式给出：


    $$\mathcal{L}(\theta, \theta^{\bot}) = \mathbb{E}_{x_{s_{i+1}}\sim D} \| \mu_{f}(x_{s_{i+1}}
    + t_{s_{i+1}}) - \theta \|, \quad \mathbf{(6)}$$


    其中 \theta^{\bot} \equiv \mathbb{E}_{x_{s_{0}}\sim D, \sim (1/U(N),1\setminus N)0.5},x_{s_{0}}
    \| \| $ 且离散步通过以下公式确定：


    $$t_{n} = \hat{t}^{(p)}_{min} + (n-1)(N-1)(\hat{t}^{(p)}_{min} - \hat{t}^{(p)}_{max})^{1/p},
    \quad \mathbf{(7)}$$


    其中 p = 7，离散化时间表由以下公式给出：


    $$N(k) = \sqrt{k/k(s^{2}_{1} + s^{2}_{0} - s^{2}_{k} + s^{2}_{0}) + 1}. \quad
    \mathbf{(8)}$$


