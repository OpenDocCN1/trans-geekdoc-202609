  mdcn: "\n# 利用生成式机器学习实现地球系统模型场快速、尺度自适应且感知不确定性的高分辨率下采样\n\nPhilipp Hess $^{1, 2} \\\
    odot$, Michael Aich $^{1, 2}$, Baoxiang Pan $^{3, 5} \\&$ Niklas Boers $^{1, 2,\
    \ 4} \\odot$\n\n1. 地球系统建模，慕尼黑工业大学工程与设计学院，德国慕尼黑。2. 波茨坦气候影响研究所，德国波茨坦。3. 中国科学院大气物理研究所，中国北京。4.\
    \ 埃克塞特大学全球系统研究所和数学系，英国埃克塞特。5. 现任职单位：中国科学院大气物理研究所，中国北京。\n\n✉ e-mail: philipp.hess@tum.de\n\
    \n**收到：** 2024年3月1日  \n**接受：** 2024年12月20日  \n**在线发表：** 2025年3月13日\n\n**摘要**\n\
    准确且高分辨率的地球系统模型（ESM）模拟对于评估人为气候变化的生态和经济社会影响至关重要，但由于计算成本过高，无法在足够高的空间分辨率上运行。最近的机器学习方法在下采样\
    \ ESM 模拟方面显示出令人鼓舞的结果，超越了最先进的统计方法。然而，现有方法需要为每个 ESM 进行计算成本高昂的重新训练，并且对训练中未见过的气候状态泛化能力较差。我们通过学习一致性模型来弥补这些缺陷，该模型能够以零样本方式高效、准确地下采样任意\
    \ ESM 模拟，而无需重新训练。我们的方法生成概率性的高分辨率下采样场，其分辨率仅受观测参考数据的限制。我们表明，一致性模型以极小的计算成本超越了最先进的扩散模型，并在下采样任务中保持高度的可控性。此外，我们的方法无需明确表述物理约束，即可泛化到训练中未见过的气候状态。\n\
    \n**引言**\n准确且高分辨率的气候模拟对于预测人为气候变化在气候、水文、生态和经济社会方面的影响具有至关重要的意义。降水是最重要的气候变量之一，例如，它对植被和作物产量、基础设施或经济的影响尤为巨大\
    \ $^{1}$。然而，它也是公认的最难建模和预测的变量，尤其是极端降水事件，源于跨越广泛空间和时间尺度的复杂相互作用过程，而这些过程无法被完全解析。\n\n\
    数值地球系统模型（ESMs）是我们预测未来降水及其极端值演变的主要工具。然而，它们存在偏差，且空间分辨率远粗于可靠评估气候变化影响所需的分辨率（通常在 10–100\
    \ km 量级）$^{2}$。因此，必须将 ESM 预测值下采样到更高分辨率，最近已提出了几种基于机器学习的方法来实现这一目标。由于地球物理流动力学的混沌特性，气候模拟的轨迹将与历史观测值不匹配，因此需要适用于非配对样本的方法来学习此类任务。最近，来自生成式深度学习方法在\
    \ ESM 模拟的空间模式降采样或校正方面显示出令人鼓舞的结果。正则化流（NFs）$^{6}$ 和生成对抗网络（GANs）$^{3,4,7-9}$ 可以在单步中高效执行这些任务\
    \ $^{5,10}$。然而，NFs 通常表现出较低的质量，例如生成的图像较不清晰、细节较少，而 GANs 可能会遇到训练不稳定性以及模式坍缩等问题 $^{11}$。此外，这些方法需要为每个特定的\
    \ ESM 模拟进行计算成本高昂的神经网络重新训练。这使得下采样大型 ESM 集合（如在影响评估中所需的）变得极其昂贵且耗时。\n\n![](img/cdba53dcfff3f101fe91360e2f61dbbc_1_0.png)\n\
    \n**图 1 | 用于下采样 ESM 场的一致性模型（CM）示意图。** 基于得分的扩散模型和 CM 的无条件训练学习逆转前向扩散过程（i）。尽管扩散模型的随机微分方程（SDE）需要多步迭代积分，但\
    \ CM 仅用单步即可从噪声生成全球降水场。无条件训练的 CM 被用于将低分辨率 ESM 降水场下采样（上采样）至四倍分辨率（ii）。通过在 ESM 场中加入选定方差的噪声，可以控制\
    \ ESM 中需保留的空间尺度：较小的噪声方差意味着与原始 ESM 场紧密配对，仅有微小变化；较大的方差将导致更大空间尺度的变化，并与 ESM 场较弱配对。\n\
    \n基于扩散的生成模型在经典图像生成任务上表现出优于 NFs 和 GANs 的性能 $^{1,2,3}$。关键在于，迭代求解逆扩散方程允许对图像采样过程进行强控制。\n\
    \n这使得计算机视觉和图像处理的基础模型成为可能，这些模型仅通过训练从噪声生成目标数据集样本，随后可重新用于不同的下游任务，例如修复、分类、着色或根据给定的“笔画草图”指南生成逼真图像，如\
    \ SDEdit $^{14,15,16}$。\n\n迄今为止，此类基于扩散模型的方法在地球系统科学相关任务中仅被应用于下采样理想化的流动力学模拟 $^{17,18}$。这两项研究均使用基于随机微分方程（SDE）的扩散模型并取得了显著性能。然而，SDE\
    \ 的迭代积分意味着生成网络需要评估多达 1,000 次才能下采样单个模拟场。这使得此类方法不适合处理大型模拟数据集，例如在高时间分辨率或长时段内，如气候变化预测和影响评估中所需的那样。\n\
    \n为了提高扩散模型的采样速度，已付出大量努力。使用常微分方程代替 SDE 可以将积分步数减少到约 10–50 步（参见文献 19,20）。蒸馏技术也可以应用于将采样速度提高至单步\
    \ $^{21,22}$。然而，这需要额外的训练成本和超参数选择。一般来说，生成步数与最终图像质量分数之间存在权衡 $^{11,13,20}$。最近，提出了一致性模型（CMs），可以直接训练为单步生成模型，而在采样可控性方面无需牺牲\
    \ $^{23}$。研究表明，CMs 在常见图像基准测试中超越了蒸馏的单步扩散模型 $^{24}$。\n\n在本工作中，我们通过使用 CMs $^{23}$\
    \ 在单步内下采样来自三个不同 ESM 的全球降水模拟，来解决标准扩散模型的不足（图 1）。总之，我们旨在建立一个用于下采样 ESM 场的生成模型，该模型满足以下条件：\n\
    \n- CM 模型仅在目标数据集上进行训练，而不以 ESM 为条件。这使得该方法适用于任何 ESM，而无需计算成本高昂的重新训练。\n- 训练最小化一种比先前方法\
    \ $^{25,6,29,30}$ 中对抗训练更稳定的回归损失。\n- 生成式下采样在训练后的推理阶段是可控制的，允许选择一个特征空间尺度，在此尺度内无偏差的空间模式在\
    \ ESM 中得以保留。\n- 该模型仅需要单次网络评估，而不是基于扩散模型的下采样方法中 $^{5,7}$ 所需的多次迭代评估。\n- 该模型允许为单个\
    \ ESM 场生成大量下采样实现（即一对一多的映射），从而启用概率下采样和采样扩散度的量化。\n- 该方法不需要专门制定的物理约束 $^{26}$ 来保持趋势\
    \ $^{27}$。\n\n"
