    | 搜索方法 | 最佳优先 | 排序 | 最佳优先 |


    缺失导致数据插值无法解决，所使用的行数减少至 2119。目标变量压力、焦虑和抑郁的初始特征集中的预测变量（列）数量为 106 个，事件影响为 91 个。应用特征选择算法后，这些数字有所减少。


    - 2) 机器学习分类器：本研究使用了 4 种机器学习分类器：随机森林（Random Forest）、朴素贝叶斯（Naive Bayes）、支持向量机（Support
    Vector Machine）和逻辑回归（Logistic Regression）。


    ## IV. 结果


    本研究对来自菲律宾的总共 2119 名参与者进行了研究。为了识别可能的病例及其可能原因，本节简要说明了采用的 3 种不同方法。


    ### A. 方法 A


    第一种方法，即方法 A，仅考虑了从创建的调查中收集的数据，不考虑 DASS-21 和 IES-R 的答案。特征选择按预期减少了特征数量。焦虑使用了 9 个特征，而压力、抑郁和事件影响使用了
