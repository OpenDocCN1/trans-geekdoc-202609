    Results show that how an individual rates their own health, and presence of a
    pre-existing neuropsychiatric condition were good predictors for stress. Depression
    had similar predictors as stress, but an addition was that age was a good predictor
    as well. Individuals actively seeking information on the symptoms of the virus,
    being at home longer, and experiencing symptoms such as body pain and difficulty
    breathing, contribute to anxiety levels. The study also found that respondents
    who actively seek information on the pandemic on social media, want to know about
    an effective medicine against the virus, have concern for their family, have feelings
    of being discriminated, and experience cough are connected to adverse psychological
    impact from the pandemic (Impact of event).


    # ## VI. CONCLUSION AND FUTURE WORK


    This research aimed to help identify the possible cases for Stress, Anxiety, Depression,
    and assess the impact of event of the general population in the Philippines using
    machine learning techniques. Manual efforts can be time consuming and it might
    not show all possible results at first glance, especially considering the large
    amount of data present. The results from this research help support the growing
    popularity


    of machine learning in the field of detection and diagnostics of mental health
    conditions. With COVID-19 spreading all over the world, techniques like the one
    used in this research can contribute significantly to find the possible contributing
    factors to mental health issues caused by the pandemic with high accuracy. Psychologists
    and researchers can pursue further studies to validate and describe the effect
    of these identified factors. Once established, improved policies and guidelines
    can be created by stakeholders to help society avoid further mental harm.


