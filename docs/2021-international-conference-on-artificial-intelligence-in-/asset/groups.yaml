    接下来，这些变量经历了特征选择，即从初始集中选取某些特征而忽略其余特征，以便更好地预测因变量。为此，应用了特征选择算法。


    这些算法分为两部分：属性评估器和搜索方法。使用的属性评估器为 CfsSubsetEval 和 InformationGain。使用的搜索方法为 BestFirst
    和 Ranker。在此特定情况下，CfsSubsetEval 与 BestFirst 配对，而 InformationGain 与 Ranker 配对，因为后者是一个要求。


    随后，特征经过机器学习分类器运行以构建预测模型。使用的分类器有随机森林（Random Forest）、朴素贝叶斯（Naive Bayes）、支持向量机（Support
    Vector Machines）和逻辑回归（Logistic Regression）。使用三个获得的指标：准确率、精确率和召回率，来评估分类器的性能。准确率是模型做出的正确预测的百分比。精确率是指示真正正确的正向识别数量的指标。最后，召回率是被正确识别的实际正例的比例。使用应用程序
    WEKA 来执行上述过程。


    本研究采用了三种方法：A、B 和 C。它们性质相似，但使用了不同的特征选择算法和自变量组合，以找到最佳结果。


    - 1) 特征选择：特征选择是机器学习过程的重要组成部分，因为它从初始预测变量集中移除了不相关和冗余的变量[17]。可以使用多种方法，但没有一种方法适用于所有应用[18]。每种方法使用的特征选择算法见表
    II。


