    ## B. 方法 B


    第二种方法，方法 B，将所有自变量视为初始特征集。特征选择使得压力的特征数量减少为 80 个，焦虑使用了 85 个，抑郁使用了 76 个，而事件影响使用了
    72 个。


    随机森林分类器总体准确率最高，平均为 82.70%。平均精确率为 82.68%，召回率为 70.00%。逻辑回归是最差的预测器，平均准确率为 80.13%，平均精确率为
    76.08%，召回率为 71.33%（参见表 VII、VIII 和 IX）。


    ## C. 方法 C


    第三种也是最后一种方法，方法 C，将所有特征视为初始特征集，与方法 B 类似。特征选择为每个因变量产生了以下最终特征数量：压力使用了 21 个特征，焦虑使用了
    25 个，抑郁使用了 18 个，而事件影响使用了 23 个。


    逻辑回归分类器总体准确率最高，平均为 83.25%。平均精确率为 81.55%，召回率为 73.53%。朴素贝叶斯是最差的预测器，平均准确率为 81.44%，平均精确率为
    80.88%，召回率为 68.65%（参见表 X、XI 和 XII）。


    ## V. 讨论


    本研究采用机器学习技术生成预测模型，帮助识别菲律宾普通人群中可能的精神健康状况病例及预测因素。本研究执行了 3 种方法，以实验数据的多种测试用例。


    方法 A 没有使用 DASS-21 和 IES-R 调查答案作为可能特征（参见表 III），而方法 B 和 C 则使用了。所有结果都较低，总体平均准确率为
    67.61%。创建调查的 8 个部分收集的数据不是良好的独立预测器。考虑到这一点，方法 B 和 C 也将其他目标变量作为预测因素。


    与方法 A 相比，方法 B 和 C 的结果有所提高，准确率分别为 81.40% 和 82.45%。这是因为在这些方法中考虑了 DASS-21 和 IES-R
    调查结果。这表明，在预测精神疾病（例如压力）的存在时，其他精神疾病（本例中为焦虑、抑郁、事件影响）的其他目标变量结果作为预测因素是重要的补充。受访者中精神疾病存在的状态是相互间良好的预测因素。话虽如此，来自创建调查的其他自变量（*）在当时与被预测因变量仍有足够好的相关性，足以被视为重要预测因素。


