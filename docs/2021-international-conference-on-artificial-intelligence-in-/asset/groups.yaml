    结果表明，个人对自身健康的评价以及是否存在既往神经精神疾病是压力的良好预测因素。抑郁与压力具有相似的预测因素，但年龄也是一个良好的预测因素。积极寻求病毒症状信息、在家时间更长以及出现身体疼痛和呼吸困难等症状的个体，会导致焦虑水平升高。研究还发现，那些在社交媒体上积极寻求疫情信息、想了解针对病毒的有效药物、关心家人、感到被歧视以及出现咳嗽的受访者，与疫情造成的不良心理影响（事件影响）有关。


    ## VI. 结论与未来工作


    本研究旨在利用机器学习技术帮助识别菲律宾普通人群中压力、焦虑、抑郁的可能病例，并评估事件影响。手动工作可能耗时，且乍看之下可能无法显示所有可能结果，尤其是考虑到存在的大量数据。本研究的结果有助于支持机器学习在精神健康状况检测和诊断领域日益增长的流行度。随着
    COVID-19 在全球传播，本研究所使用的技术可以显著有助于以高精度找出疫情导致精神健康问题的可能促成因素。心理学家和研究人员可以开展进一步研究，以验证和描述这些已识别因素的影响。一旦建立，利益相关者可以制定改进的政策和指南，帮助社会避免进一步的精神伤害。


