    IES-R 分数将划分为正常（0-23）、轻度（24-32）、中度（33-36）和重度（37）。


    - 2) 目标变量：上述提到的压力（S）、焦虑（A）、抑郁（D）和事件影响（P）的测量值是本研究的目标变量。它们拥有一个共同的初始预测变量集，即在创建的调查的
    8 个部分下收集的数据。每个目标变量的附加预测变量是其同行目标变量的测量值。这意味着 A、D、P 的测量值也是 S 的预测变量。S、D、P 的测量值也是 A
    的预测变量。S、A、P 的测量值也是 D 的预测变量，而 S、A、D 的测量值也是 P 的预测变量。


    - 3) 数据准备：数据准备是机器学习（ML）过程中的一个关键步骤。原始数据不足以让 ML 模型进行分析，必须对其进行重构和清洗，以便为模型提供最能揭示预测问题的数据表示[15]。


    共有 2652 名参与者完成了调查，但研究中仅考虑了 2119 名。其余 533 名（20%）参与者因 DASS-21 或 IES-R 调查回答不完整或完全未作答而被排除。


    在处理数值变量和类别变量的缺失值时，对数据集进行了数据插值。在数值变量中，只有 ExtraHoursHome 存在缺失值，这些缺失值已用现有值的均值[16]进行替换。存在缺失值的类别变量如下：


