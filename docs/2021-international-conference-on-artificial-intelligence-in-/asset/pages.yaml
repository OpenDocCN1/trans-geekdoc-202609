    # IV. RESULTS


    The study was done on a total of 2119 participants who come from the Philippines.
    To identify possible cases and their possible causes, the 3 different approaches
    that were taken are briefly explained in this section.


    # A. Approach A


    The first approach, approach A, only considered the data collected from the created
    survey, disregarding the DASS-21 and IES-R answers. Feature selection resulted
    in reduced number of features as expected. Anxiety used 9 features while stress,
    depression, and impact of event used 10.


    The Naive Bayes classifier achieved the best accuracy overall with an average
    of 69.65%. An average precision of 63.08% and recall of 54.23%. Random Forest
    was the worst predictor with an average accuracy of 63.63%, average precision
    and recall of 53.93% and 46.18% respectively (See Tables IV, V and VI).


