    Next, these variables underwent feature selection, which is the process of picking
    certain features from the initial set while disregarding the rest to be able to
    predict the dependent variables better. To do this, feature selection algorithms
    were applied.


    These algorithms are divided into two parts, the Attribute Evaluator and the Search
    Method. The attribute evaluators used were CfsSubsetEval and InformationGain.
    The search methods used were BestFirst and Ranker. In this particular case, CfsSubsetEval
    and BestFirst were paired with each other, while InformationGain and Ranker were
    paired since the latter is a requirement.


    Afterwards, the features were run through machine learning classifiers to build
    models for the predictions. The classifiers Random Forest, Naive Bayes, Support
    Vector Machines, and Logistic Regression were used. The vectors'' performances
    were assessed using three obtained metrics: accuracy, precision, and recall. Accuracy
    is the percentage of correct predictions the models have made. Precision is the
    metric where it shows how many of the positive identifications were truly correct.
    Lastly, recall is the proportion of actual positives that were identified correctly.
    The application WEKA was used to execute the aforementioned process.


    There were three approaches taken in the research, A, B, and C. They were similar
    in nature, but used different combinations of feature selection algorithms and
    independent variables to find the best results


