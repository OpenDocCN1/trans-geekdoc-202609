    # B. Approach B


    The second approach, approach B, considered all of the independent variables as
    the initial feature set. Feature selection resulted in the reduced amount of features
    for Stress as 80, anxiety used 85, depression used 76, while impact of event used
    72.


    The Random Forest classifier achieved the best accuracy overall with an average
    of 82.70%. Along with it, an average precision of 82.68% and recall as 70.00%.
    Logistic Regression was the worst predictor with an average accuracy of 80.13%,
    average precision of 76.08% and recall of 71.33% (See Tables VII, VIII and IX).


    # C. Approach C


    The third and final approach, approach C, considered all of the features as the
    initial feature set, similar to approach B. Feature selection resulted in the
    following final number of features for each dependent variable: stress used 21
    features, anxiety used 25, depression used 18, while impact of event used 23.


