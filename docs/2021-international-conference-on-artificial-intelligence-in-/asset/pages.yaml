    # V. DISCUSSION


    Machine learning techniques were used in this research to generate predictive
    models to help identify possible cases and predictors of mental health conditions
    among the general population in the Philippines. There were 3 approaches executed
    in this study in order to experiment multiple test cases of the data.


    Approach A did not use the DASS-21 and IES-R survey answers as possible features
    (see Table III), unlike approach B and C. All the results were low, with an overall
    average accuracy of 67.61%. The data gathered from the 8 parts of the created
    survey were not good stand alone predictors. Considering this, approaches B and
    C included the other target variables as predictors as well.


    Compared to A, approaches B and C had its results increase, having accuracies
    of 81.40% and 82.45% respectively. This was due to the fact that the DASS-21 and
    IES-R survey results were taken into account in these approaches. This suggests
    that when predicting for the presence of a mental illness, say Stress, the other
    target variable results for the other mental illnesses (In this case Anxiety,
    Depression, Impact of Event)


