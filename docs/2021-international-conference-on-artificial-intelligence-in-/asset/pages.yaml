  md: '# Determining factors contributing to the psychological impact of the COVID-19
    Pandemic using machine learning


    Carlos Alfonso V. Palattao¹, Geoffrey A. Solano¹, Cherica A. Tee², and Michael
    L. Tee³


    ¹Department of Physical Sciences and Mathematics, University of the Philippines
    Manila


    ²National Institute of Health, University of the Philippines Manila


    ³College of Medicine, University of the Philippines Manila


    {cvpalattao,gasolano,catee,mltee}@up.edu.ph


    **Abstract**—The COVID-19 pandemic has created a massive impact in the economy,
    healthcare, education and other aspects of society in each and every respect.
    Also greatly affected is the mental health of individuals. This study aims to
    determine the possible contributing factors to stress, anxiety, depression, and
    adverse psychological impact on the general population of the Philippines using
    machine learning approaches. The data gathered from 2119 participants who answered
    an online survey were analyzed using feature selection methods and machine learning
    classifiers to determine contributing factors to the aforementioned mental health
    issues. The results show that longer hours at home, on social media, age, how
    people rate their own health, pre-existence of a neuropsychiatric condition; wanting
    information on availability and effectiveness of a medicine or vaccine, being
    concerned for their family, feeling discriminated; and symptoms of body pain,
    difficulty breathing, and cough were good predictors of individuals being adversely
    impacted psychologically by the pandemic and others having elevated levels of
    stress, anxiety, depression.


    **Index Terms**—Mental Health, Stress, Anxiety, Depression, Impact of Event, Machine
    Learning, Feature Selection


    # I. INTRODUCTION


    On December 31st 2019, cases of pneumonia of unknown etiology were detected in
    Wuhan City, Hubei Province of China, and authorities identified a new type of
    coronavirus (2019-nCoV) shortly after [1]. The World Health Organization (WHO)
    named the virus COVID-19, and it was declared a pandemic on March 11th 2020 [2],
    [3]. As of February 5 2021, there are over 102 million confirmed cases and over
    2.2 million deaths worldwide spanning 222 countries and territories [4], with
    the Philippines having a total of 531 thousand confirmed cases and over 10 thousand
    deaths [5].


    Just like any pandemic, it has created a massive impact in various aspects of
    society, from economy to healthcare, even to education. Psychological impact is
    also a matter of concern, since the spread of the virus plays a critical role
    in the occurrence of emotional distress and social disorder among the population
    affected [6], [7]. In a recent study performed in Italy of 18147 respondents,
    among several other outcomes, 17.3% reported severe depressive symptoms, 20.8%
    reported severe anxiety symptoms, and 7.3% reported severe


    insomnia symptoms. The study also states that conditions caused by the pandemic
    that were associated with the results were independent from other considerations
    such as previous mental illnesses or childhood traumas [8]. In dealing with mental
    health issues among members of the population, contributing factors must be determined
    for immediate intervention and to prevent further damage. Recent years have seen
    advances in research in the field of machine learning for mental health, and it
    is clear that it can significantly aide in the detection and diagnosis of mental
    health conditions. [9].


    This study aims to determine the possible contributing factors to stress, anxiety,
    depression, and adverse psychological impact on the general population of the
    Philippines resulting from the pandemic using machine learning approaches.


    # II. RELATED WORK


    To date, a few studies have been done on the psychological impact the COVID-19
    pandemic has caused worldwide. As shown in these studies, finding the possible
    contributing factors is a key step in mitigation and prevention of further damage


    A recent study [10] examined the psychological impact of COVID-19 and the restrictions
    set by their government on the perceived stress of Italian adults. Their research
    also targeted to verify some contributing factors to the impact as stated in another
    recent study. Data from a total of 2053 participants was used and statistical
    analysis was performed on it through the JASP software. Further analysis through
    feature selection and machine learning models was done using the WEKA 3.9 software.
    From the questions answered by the participants, 18 were considered as predictors
    of perceived stress. Of those 18, 7 were chosen by the correlation-based feature
    selection algorithm as the best predictors for perceived stress, while the rest
    were considered redundant and irrelevant. To measure the predictive performance
    of these 7 predictors, machine learning models were generated using the classifiers
    Logistic Regression, Support Vector Machines, Naive Bayes,'
