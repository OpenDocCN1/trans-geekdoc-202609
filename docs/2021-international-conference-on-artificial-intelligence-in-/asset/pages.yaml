    to the others makes it weak in terms of predictive purposes in their case.


    Another research conducted by [11] assessed the psychological distress among Korean
    Immigrants in the United States using artificial neural networks (ANN). Their
    data was gathered through a distributed online survey among Korean immigrants
    above the age of 18, collecting 790 total participants as a result. Their predictors
    consisted of discrimination-related variables, coping mechanisms, and socio-demographic
    factors. Among the factors associated with these predictors, the most connected
    to the participants’ psychological distress were their own resilience, experiences
    of discrimination, and the mindset of racial discrimination towards Asians has
    increased in the country.


    In a study done by [12], they did research on the psychological impact of COVID-19
    on the general population of the Philippines by looking into the psychiatric symptoms
    present and determined the factors contributing effects. Online surveys were distributed
    from March 28, 2020 to April 20, 2020 and gathered data including socio-demographics,
    health status, contact history, COVID-19 knowledge and concerns, precautionary
    measures, and information needs. In addition, ratings for the Depression, Anxiety,
    and Stress scale (DASS-21) and the Impact of event scale-Revised (IES-R) were
    taken as well. The researchers used SPSS statistic 24.0 to perform statistical
    analysis on the data. Results from their research showed that factors such as
    Female gender; youth age; single status; students; specific symptoms; recent imposed
    quarantine; prolonged home-stay; and reports of poor health status, unnecessary
    worry, concerns for family members, and discrimination were connected with substantial
    psychological impact and elevated levels of depression, anxiety, and stress. In
    contrast, a sufficient amount of health information, having grown-up children,
    perception of good health status and confidence in doctors’ abilities were linked
    to less adverse impact and decreased levels of depression, anxiety and stress.
    Further investigation of their data could be done using machine learning models
    and feature selection algorithms to verify or discover more possible predictor
    variables to the mental health issues found among the participants.


    # III. METHODOLOGY


    # A. Data set


    Data gathering was done through online means, as the government of the Philippines
    recommended to minimize face-to-face interactions. The online survey platform
    Survey Monkey was used, and the created questionnaire was distributed first to
    students and alumni of the University of the Philippines. Afterwards, they passed
    it on to others after they accomplished the questionnaire. This snowball strategy
    that was implemented helped to reach a total of 2652 respondents.


    1) Predictor Variables: The survey was divided into 7 parts: (A) Demographics;
    (B) Symptoms and physical health status; (C) Contact history; (D) Knowledge and
    belief about COVID-19; (E) Pre-cautionary measures in past 14 days; (F) Additional
    information for COVID-19; (G) Pre-existing condition.


    The demographics collected from the respondents were gender, age, education, country
    of residence, marital status, employment status, if the he was a health care professional,
    parental status, household size, and if the he traveled outside of the country
    of residence in the past 14 days.


    Presence of the following symptoms in the past 14 days included fever, chills,
    headaches, myalgia, cough, difficulty breathing, dizziness, coryza, sore throat,
    nausea, vomiting, and diarrhea. In addition to, if they saw a doctor in the past
    14 days, admitted to the hospital in the past 14 days, gotten tested for COVID-19
    in the past 14 days, quarantined in the past 14 days, if they have medical insurance,
    if they suffer from a chronic illness, and how they self-rated their physical
    health status.


    The extent of the contact history with COVID-19 patients was taken as well, namely
    close contact, indirect contact, and contact with suspected cases and infected
    materials.


    To get the respondents’ knowledge of COVID-19, the variables included known transmission
    routes, satisfaction on health information available and how they obtain it, heard
    numbers on the different types of cases, hours spent on social media to obtain
    COVID-19 information, confidence in their own doctor on the virus, self-rated
    likelihood of contracting and surviving the virus, concerns about their family,
    and whether or not the feel discriminated.


    The variables on precautionary measures included covering of mouth, sharing of
    utensils, hand washing, and wearing masks. The respondents were also asked if
    they feel that COVID-19 has resulted to unnecessary worry, and how many extra
    hours per day did they stay at home because of the virus.


    The respondents’ desire for different types of additional information on COVID-19
    was taken note of as well. These types included: details on symptoms, advice on
    prevention and treatment, regular updates, advice for people who need tailored
    information, availability and effectiveness of a vaccine, number of people affected,
    travel advice, how the virus is spread, and how other countries are doing.


    The respondents were also asked if they had a pre-existing neuropsychiatric condition
    and if they were taking medications for it.


    Furthermore, Anxiety, and Stress Scale (DASS-21) survey to measure their negative
    emotional states of Stress, Anxiety, and Depression [13]. The depression subscale
    had different severity scores of normal (0-9), mild (10-12), moderate (13-20),
    severe (21-27) and extremely severe (28-42). Anxiety scores were divided as normal
    (0-6), mild (7-9), moderate (10-14), severe (15-19) and extremely severe (20-42).
    The stress scores were divided to normal (0 – 10), mild (11 – 18), moderate (19
    – 26), severe (27 – 34) and extremely severe (35'
