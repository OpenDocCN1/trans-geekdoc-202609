  trans: "\n\n* YouTube\n* Apple\n* Dropbox\n* Docker\n* BBC\n* 经济学人\n* 纽约时报\n* IBM\n\
    * Twitter\n* Facebook\n\n## 2. Golang 拥有卓越背景\nGoogle 为其资金支持。它的创建者 Robert Griesemer、Rob\
    \ Pike 和 Ken Thompson 都是天才。他们曾参与过 `C`、`B`、`UNIX`、`JVM` 等卓越项目。Golang 的设计旨在作为一种面向验证语言，以解决眼下的困难并应对未来的挑战。\n\
    \n## 3. Golang 天生是开源的\n对于一种编程语言来说，开源并变得更好、更简洁且效率不断提高，具有极重要的意义。如果代码存在缺陷，`gophers`（`Golang`\
    \ 设计者的称呼）会发现并消除这些问题。\n\n## 4. Golang 运行快速\nGo 具有简单的结构和语法。它没有类等遗留问题。该语言依赖于能力，因此学习起来清晰且快速。它是编译型的，因此可以提供更快的反馈、更短的上市时间，并节省了时间和金钱。它非常简单，因此变得越来越可行，开发也更快、更廉价。\n\
    \n## 5. Golang 支持并发\n并发性在我们的时代至关重要。它允许不同的程序同时充分地运行。`Golang` 拥有强大的并发能力，类似于 `C`、`C++`、`Java`，但得益于\
    \ `go-routines`、`channels` 和垃圾回收，`Go` 中的并发实现要简单得多。\n\n## 6. Golang 跨平台的\n它被用于各种平台，包括\
    \ `Windows`、`Linux`、`UNIX` 和 `BSD` 变体以及手机（从 2015 年开始）。此外，它在许多操作系统上运行良好。\n\n##\
    \ 7. Golang 拥有垃圾回收器\n一种编程内存管理，它影响性能并使并发更加高效。\n\n## 8. Golang 能防范 Bug\n由于它是一种编译语言，具有极其严格的规范，并且是静态组合的，设计者必须日益精确和关注，因此代码更整洁、更安全。\n\
    \n### 硬币的另一面\n`Golang` 也有一些缺点，例如：\n* 与渐进类型语言相比，灵活性较低；\n* 缺乏第三方模块；\n* 它与基于 `C`\
    \ 的语言有很大不同；\n* 没有泛型（泛型允许编写可重用的代码——这有时可以节省时间和精力）。\n\n无论如何，`Golang` 是中庸之道！\n\n*\
    \ `#Go` 对于 PC 来说快速且高效，就像 `C` 和 `C++` 一样。\n* `Golang` 对开发者来说也快速又有趣，因此具有类似精简 `Ruby`\
    \ 和 `Python` 的外观。\n\n考虑到所有因素，`Golang` 是最知名语言特性的完美结合。\n\n# 第 2 章教程\n\n## Golang\
    \ 中的 Hello World\n`Hello, World!` 是任何编程语言中最基础的程序。我们应该按照以下步骤用 `Go` 语言编写主程序：\n\n\
    * 首先，打开 `Go` 编译器。在 `Go` 语言中，程序以 `.go` 扩展保存，它是 UTF-8 内容记录。\n* 现在，首先在你的程序中包含基础包：\n\
    \n```go\npackage main\n```\n每个程序都必须从包声明开始。在 `Go` 语言中，包用于组织和重用代码。在 `Go` 中，有两种可访问的程序：一种是可执行程序，另一种是库。可执行项目是可以可以直接从终端运行的项目，而库是我们可以在自己的程序中重用的项目集合。在这里，打包原则告诉编译器该包必须汇编成可执行程序，而不是通用库。它是程序的起始阶段，并包含\
    \ `main` 函数。\n\n* 在程序中为 `main` 包添加 `fmt` 包：\n\n```go\nimport (\n    \"fmt\"\n\
    )\n```\n在这里，`import` 关键字用于在程序中导入包，`fmt` 包用于执行带有功能的格式化输入输出。现在在 `main` 函数中编写代码，用\
    \ `Go` 语言打印 hello world：\n\n```go\nfunc main() {\n    fmt.Println(\"Hello World!\"\
    )\n}\n```\n\n在上面的代码行中我们有：\n* `func`：用于在 `Go` 语言中创建函数。\n* `main`：它是 `Go` 语言的主函数，不包含参数，不返回任何内容，并在你执行程序时调用。\n\
    * `Println()`：该方法存在于 `fmt` 包中，用于显示 `\"Hello World!\"` 字符串。在这里，`Println` 意为 Print\
    \ line（行打印）。\n\n"
