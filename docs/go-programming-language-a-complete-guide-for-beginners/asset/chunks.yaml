    \ 也发送了该方法的副本。\n\n### 非结构体类型上的方法\n\n到为止，我们已经看到了结构体类型上的方法，但作为方法的含义，它可以识别任何类型作为定义，且方法定义在同一个包中。到目前为止，我们在同一个包中定义了结构体和方法；因此它可以工作。为了证明这一点，我们将尝试为原生类型\
