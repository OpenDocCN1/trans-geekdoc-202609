    \ Go 的并发特性和多通道通信进行开发\n\n为了让这个教学练习保持简短，我不会取悦那些尚未完成 `Go Tour` 的朋友。本次访问将教你跟踪这些任务所需的所有知识。\n\
    \n### 构建一个网络爬虫\n\n正如我在演示中提到的，我们将使用 Go 构建一个简单的网络爬虫（scraper）。请注意，我没有说它是网络爬虫（crawler），因为我们的爬虫可能只深入一层（可能我会在另一篇文章中介绍深度爬取）。我们将组装一个基础的命令行设备，接收一组种子\
    \ URL，对它们进行抓取，并打印出在这些页面上发现的连接。\n\n这是一个真实世界中的案例：\n\n```\ngo run main.go https://schier.co\
    \ https://insomnia.rest\nFound 7 unique urls : \n- https://insomnia.rest \n- https://twitter.com/GregorySchier\
    \  own- https://support.insomnia.rest \n- https://chat.insomnia.rest \n- https://github.com/Kong/insomnia\
    \ \n- https://twitter.com/GetInsomnia \n- https://konghq.com\n```\n\n既然我们已经清楚正在构建什么，我们应该找到一个可行的节奏部分——组装它。为了让这个教学练习更容易处理，我将把它分成若干个限定片段。在检查完每个部分之后，我将把它们整合在一起形成最终项目。我们将涉及的主要部分是发送\
    \ HTTP 请求来获取某些 HTML。\n\n#### 通过 URL 获取网页\n\nGo 内置了一个非常出色的 HTTP 库。`http` 包提供了 `http.Get(URL)`\
    \ 方法，只需要几行代码即可完成。注意，为了保持模型简洁，省略了错误处理等内容。\n\n```\nresp, _ := http.Get(url)\nbytes,\
    \ _ := ioutil.ReadAll(resp.Body)\nfmt.Println(\"HTML:\\n\\n\", string(bytes))\n\
    resp.Body.Close()\n```\n\n发送 HTTP 请求是建立网络请求，既然我们已经知道了如何操作，我们就可以继续处理返回的 HTML 内容了。\n\
    \n#### Web 服务器\n\nGo 语言因在 Web 服务器领域的应用而闻名。在这篇文章中，你将学会如何毫不费力地用 Go 构建你的 Web 服务器。你不需要除了当前内置包之外的任何包！首先，进入你的编辑器。然后，创建一个名为\
    \ `webserver.go` 的文件并输入以下代码：\n\n```go\npackage main\n\nimport (\n\t\"net/http\"\
    \n\t\"io\"\n)\n\nfunc main() {\n\thttp.HandleFunc(\"/\", servePage)\n\thttp.ListenAndServe(\"\
    :8080\", nil)\n}\n\nfunc servePage(writer http.ResponseWriter, reqest *http.Request)\
    \ {\n\tio.WriteString(writer, \"Hello world!\")\n}\n```\n\n我们应该拆分上面的代码块。我们导入 `net/HTTP`\
    \ 包：该包包含了 Web 服务器本身。此时，我们额外导入了 `io` 包；我们稍后将利用它向客户提供内容。\n\n在原理工作上，我们完成了两件事。首先，我们告诉服务器让名为\
    \ `servePage` 的函数处理所有指向 `/` 的传入流量——在这种情况下，这意味着它处理对任何路径的请求。\n\n（注：原文在后半部分存在大量重复，此处已根据优化段落格式的原则清理了冗余逻辑，并保留了核心内容。）\n\
