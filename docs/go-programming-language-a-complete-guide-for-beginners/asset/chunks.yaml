    # 第 1 章 Go 编程语言


    Go 是一种过程化编程语言。它由 `Robert Griesemer`、`Rob Pike` 和 `Ken Thompson` 在 `Google` 于 2007
    年创建；但它在 2009 年作为一种开源编程语言发布。项目通过利用 `packages`（包）进行收集，以有效地管理环境。该语言还支持与动态语言相同的条件接收模式。


    例如，类型推断（`y := 0` 是对类型 `float` 变量 `y` 的合法声明）。有不同的在线 IDE，例如 `The Go Playground`、`repl.it`
    等，可以使用它们在不安装 Go 的情况下运行 Go 程序。


    要在个人电脑或笔记本电脑上安装 Go，我们需要以下两个程序：`Text editor`（编辑器）和 `Compiler`（编译器）。


    ## 编辑器


    `Text editor` 管理为您提供了一个编写源代码的舞台。以下是文本处理器：

    *   `Windows scratchpad`

    *   `OS Edit direction`

    *   `Brief`

    *   `Epsilon`

    *   `vm` 或 `vi`

    *   `Emacs`


    该语言的制定者（全部来自 `Google`）有一个明确的目标——设计一种绝非难于使用的编程语言，同时在处理组织复杂的框架时具有涵盖主要困难的选项。Go 项目的目标是消除
    `Google` 编程进中的笨拙和缓慢，并通过这种方式让过程变得越来越高效和多功能。


    > 这种语言是为编写、阅读、研究和维护庞大编程框架的人编写并设计的。 – `Rob Pike`，`Golang` 创建者 –


    该公司在使用其他日益混乱和复杂的编程语言时经历了了许多不便。例如，如果问题涉及 `C++`，解决答案可能花费一整天的时间。这无论从时间还是收益来看都是不合理的。`Golang`
    的创新完美地解决了这些问题。


    `Golang` 开发者赞誉 `Go` 的易用性和进步性，它依赖于 `C`、`Pascal` 和 `Oberon` 编程语言的优秀特性。组织看重这种语言的性能和健康性。


