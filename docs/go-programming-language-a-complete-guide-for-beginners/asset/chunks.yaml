    # 结论


    `Go` 是一门非常优秀的语言，拥有丰富且高效的可组合库，这是最令人惊讶之一。在 `go` 中编写一个完美、快速且一致的程序比在大多数其他语言中要简单，而
    `Go` 做得很好的一点是允许一个团队在毫不费力的情况下写出清晰、快速且一致的程序。这里描述的优点远超我那些关于“为什么 Go 不能像 Rust 那样”的抱怨列表（尽管这到底有多少是真的？真的没有常量吗？）。我认为这部分内容在很长一段时间内不需要技术更新。`Go`
    并不是解决 `C` 和 `C++` 复杂性的首次尝试，也不会是最后一个。但由于它背后有 `Google` 的支持，并且在几乎每个阶段都免费可用，对于任何希望熟悉一种极具吸引力且具备
    `Google` 式便利的人来说，都是一个很好的选择。它在框架编程和 Web 应用中的实用性，加上简单易学的句子结构，使得 `go` 对资深开发者和新程序员来说都是一种迷人的语言。`GoLang`
    的出现为底层性能敏感硬件和大型可扩展编程框架的复杂应用程序编程带来了巨大的价值扩展。并不意外，在几年之后，它就获得了全球开发者如此之大的关注。


