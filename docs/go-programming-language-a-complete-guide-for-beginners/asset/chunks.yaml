    \ `*AliasPtr`/基类型排序为指针类型 `IntPtr`/特征化指针类型 `*IntPtr`/基类型排序为非指针类型 `struct {age int}`/非特征化非指针类型\
    \ `map[string]int`/非特征化非指针类型 `[]int64`/未定义非指针类型 `func()`/未定义非指针类型\n\n结构体中不允许两个字段具有相似名称，且对于神秘的结构体字段没有特殊情况。根据已安装字段命名标准，未定义的指针类型不能在其等效结构类型中与其基排序一同嵌入。例如，`int`\
    \ 和 `*int` 不能在等效结构类型中嵌入。结构类型不能递归地嵌入自身或其别名。通常，嵌入具有字段或方法的类型是有意义的（后续章节将说明原因）；然而，一些没有字段和方法的排序同样也可以嵌入。\n\
    \n### 类型嵌入的意义是什么？\n\n类型排序背后的目的是将嵌入类型的功能扩展到嵌入类型中，目标是使我们不需要为插入类型重新实现已安装类型的功能。许多其他排列的编程语言使用继承来实现类似的类型插入目标。这两个系统各有有利有劣。在这里，本文将不会探讨哪一个更好。我们应该知道\
