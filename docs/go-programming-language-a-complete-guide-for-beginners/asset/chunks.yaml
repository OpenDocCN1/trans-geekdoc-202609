    # 整数常量


    * 前缀决定了基数或进制：`0x` 或 `0X` 表示十六进制，`0` 表示八进制，留空表示十进制。

    * 整数整数常量也可以有一个后缀，可以是 `U`（大写）和 `L`（大写）的组合，分别表示无符号和长型。

    * 它可以可以是十进制、八进制或十六进制形式。

    * `int` 最多可以存储一个 64 位的整数，有时也会更少。


    以下是整数常量的几个实例：


    * `85` /* 十进制 */`

    * `0213` /* 八进制 */`

    * `0x4b` /* 十六进制 */`

    * `30` /* int */`

    * `30u` /* 无符号 int */`

    * `30l` /* 长型 */`

    * `30ul` /* 无符号长型 */`

    * `212` /* 合法 */`

    * `215u` /* 合法 */`

    * `0xFeeL` /* 合法 */`

    * `078` /* 不法：8 不是八进制数字 */`

    * `032UU` /* 不法：不能重复添加 */`


    ## 复数常量


    复数常量的作用非常像浮点常量。它是一个整数常量（或参数）的排列组合或真实的对，常量之间用逗号隔开，这对被包裹在括号中。第一个常量是实部，第二个是虚部。一个复数常量
    `COMPLEX*8` 使用 8 字节的存储。示例：`(0.0, 0.0)` `(-123.456E+30, 987.654E-29 )`。


    ## 浮点类型常量


    * 浮点型常量包含一个整数部分、小数点、小数部分和一个指数部分。

    * 它可以以十进制结构或指数结构表示浮点型。

    * 当使用十进制结构时，您应该包含小数点、类型或两者。

    * 而当使用指数结构时，我们必须包含数字部分、小数部分或两者。


    以下是浮点点类型常量的实例：


    * `3.14159` /* 合法 */`

    * `314159E-5L` /* 合法 */`

    * `510E` /* 不法：指数不完整 */`

    * `210f` /* 不法：没有小数点或指数 */`

    * `.e55` /* 不法：缺少整数或小数 */`


    # 数组


    Golang 或 Go 语言中的数组与其他编程语言中的非常相似。在程序中，我们有时需要存储一组相同类型的信息，类似于学生成绩列表。这种组合通过一个 `Array`
    存储在程序中。数组是一个固定长度的排列，用于在内存中存储同质的组件。因为它们的固定长度特性，不如 Go 语言中的 `Slice` 那么流行。在数组中，您允许在其中存储至少零个组件。数组的组件通过
    `[]` 列表操作符根据其从 0 开始的位置进行排序，这意味着主组件的记录是 `array[0]`，最后一个组件的记录是 `array[len(array)-1]`。


    ## 创建和访问数组


    在 Go 语言中，数组通过两种独特的方式创建：


    ### 1. 使用 `var` 关键字

    在 Go 语言中，数组通过特定类型的 `var` 关键字、名称、大小和组件创建。

    语法：`var array_name[length]Type` 或 `var array_name[length]Type{item1, item2, item3,
    ...itemN}`


    关键点：


    * 在 Go 语言中，数组是不持久的，目的是你可以利用它。

    * `var array_name[length]Type`

    * 你可以使用索引来设置数组的组件。

    * 数组的类型是字符串。

    * 在 Go 语言中，数组的长度是固定的。

    * 您允许在数组中存储组件。


    示例：

    ```go

    // 字符串类型数组

    var arr [3]string

    // 使用索引

    arr[0] = "Hello"

    arr[1] = "World"

    arr[2] = "Go"

    fmt.Println(arr)

    ```

    ```


    ### 2. 使用简写语句

    在 Go 语言中，数组也可以通过简写表示。它比上面的声明更灵活。

    语法：`array_name := [length]Type{item1, item2, item3}`


    示例：

    ```go

    // 字符串类型数组

    arr := [3]string{"Hello", "World", "Go"}

    fmt.Println(arr)

    ```

