  trans: "\n方法声明类似于函数语句。然而，它包含了一个额外的参数声明部分。这个额外的参数部分可以包含且仅包含一个作为方法接收者类型的参数。这个唯一的参数被称为该方法声明的“接收者参数”（collector\
    \ parameter）。接收者参数必须封装在 `()` 中，并声明在 `func` 关键字和方法名之间。以下是一些方法声明的示例：\n\n```go\n\
    // Age 和 int 是两个不同的类型。我们 // 不能为 int 和 *int 定义方法，// 但可以为 Age 和 *Age 定义方法。\ntype\
    \ Age int\nfunc (azz Age) LargerThan(a Age) bool {\n    return azz > a\n}\nfunc\
    \ (azz *Age) Increase() {\n    *azz++\n}\n\n// 自定义函数类型的接收者。\ntype FF func(in int)\
    \ bool\nfunc (ff FF) Filte(in int) bool {\n    return ff(in)\n}\ntype StringSet\
    \ map[string]struct{}\nfunc (sess StringSet) Has(key string) bool {\n    _, present\
    \ := sess[key]\n    return present\n}\nfunc (sess StringSet) Add(key string) {\n\
    \    sess[key] = struct{}{}\n}\nfunc (sess StringSet) Remove(key string) {\n \
    \   delete(sess, key)\n}\n\n// 自定义结构体类型的接收者。\ntype Book struct {\n    pa int\n\
    }\nfunc (boss Book) Pages() int {\n    return b.pa\n}\nfunc (boss *Book) SetPages(pa\
    \ int) {\n    boss.pa = pa\n}\n```\n\n从上面的示例中，我们意识到接收者基础类型不仅限于结构体类型（struct types），还可以是不同的类型，例如基本类型和容器类型，只要接收者基础类型符合上述记录的\
    \ 4 个条件即可。在其他编程语言中，接收者参数名称通常是固定的 `this`，但在 Go 中这并不是接收者参数名称的规定性标识符。类型 `*T` 的接收者被称为“指针接收者”（pointer\
    \ recipient）；非指针接收者被称为“值接收者”（value receivers）。我并不规定将“指针”这一术语视为“值”这一术语的对立面，因为指针是“异常”这一术语的对立面。\n\
    \n### 指针接收者（Pointer Receivers）\n\n方法声明类似于函数语句。然而，它包含了一个额外的参数声明部分。这个额外的参数部分可以包含且仅包含一个作为方法接收者类型的参数。这个唯一的参数被称为该方法声明的“接收者参数”。接收者参数必须封装在\
    \ `()` 中，并声明在 `func` 关键字和方法名之间。以下是一些方法声明的示例：\n\n```go\n// Age 和 int 是两个不同的类型。我们\
    \ // 不能为 int 和 *int 定义方法，// 但可以为 Age 和 *Age 定义方法。\ntype Age int\nfunc (azz Age)\
    \ LargerThan(a Age) bool {\n    return azz > a\n}\nfunc (azz *Age) Increase()\
    \ {\n    *azz++\n}\n\n// 自定义函数类型的接收者。\ntype FF func(in int) bool\nfunc (ff FF)\
    \ Filte(in int) bool {\n    return ff(in)\n}\ntype StringSet map[string]struct{}\n\
    func (sess StringSet) Has(key string) bool {\n    _, present := sess[key]\n  \
    \  return present\n}\nfunc (sess StringSet) Add(key string) {\n    sess[key] =\
    \ struct{}{}\n}\nfunc (sess StringSet) Remove(key string) {\n    delete(sess,\
    \ key)\n}\n\n// 自定义结构体类型的接收者。\ntype Book struct {\n    pa int\n}\nfunc (boss Book)\
    \ Pages() int {\n    return b.pa\n}\nfunc (boss *Book) SetPages(pa int) {\n  \
    \  boss.pa = pa\n}\n```\n\n从上面的示例中，我们意识到接收者基础类型不仅限于结构体类型，还可以是不同的类型，例如基本类型和容器类型，只要接收者基础类型符合上述记录的\
    \ 4 个条件即可。在其他编程语言中，接收者参数名称通常是固定的 `this`，但在 Go 中这并不是接收者参数名称的规定性标识符。类型 `*T` 的接收者被称为“指针接收者”，非指针接收者被称为“值接收者”。我并不规定将“指针”这一术语视为“值”这一术语的对立面，因为指针是“异常”这一术语的对立面。\n\
    \n### 指针接收者（Pointer Receivers）\n\n方法声明类似于函数语句。然而，它包含了一个额外的参数声明部分。这个额外的参数部分可以包含且仅包含一个作为方法接收者类型的参数。这个唯一的参数被称为该方法声明的“接收者参数”。接收者参数必须封装在\
    \ `()` 中，并声明在 `func` 关键字和方法名之间。以下是一些方法声明的示例：\n\n```go\n// Age 和 int 是两个不同的类型。我们\
    \ // 不能为 int 和 *int 定义方法，// 但可以为 Age 和 *Age 定义方法。\ntype Age int\nfunc (azz Age)\
    \ LargerThan(a Age) bool {\n    return azz > a\n}\nfunc (azz *Age) Increase()\
    \ {\n    *azz++\n}\n\n// 自定义函数类型的接收者。\ntype FF func(in int) bool\nfunc (ff FF)\
    \ Filte(in int) bool {\n    return ff(in)\n}\ntype StringSet map[string]struct{}\n\
    func (sess StringSet) Has(key string) bool {\n    _, present := sess[key]\n  \
    \  return present\n}\nfunc (sess StringSet) Add(key string) {\n    sess[key] =\
    \ struct{}{}\n}\nfunc (sess StringSet) Remove(key string) {\n    delete(sess,\
    \ key)\n}\n\n// 自定义结构体类型的接收者。\ntype Book struct {\n    pa int\n}\nfunc (boss Book)\
    \ Pages() int {\n    return b.pa\n}\nfunc (boss *Book) SetPages(pa int) {\n  \
    \  boss.pa = pa\n}\n```\n\n在某些其他语言中，接收者参数名称通常是固定的 `this`，但在 Go 中这并不是接收者参数名称的规定性标识符。类型\
    \ `*T` 的接收者被称为“指针接收者”，非指针接收者被称为“值接收者”。我并不规定将“指针”这一术语视为“值”这一术语的对立面，因为指针是“异常”这一术语的对立面。\n\
    \n### 指针接收者（Pointer Receivers）\n\n...（此处省略重复内容，直接翻译核心逻辑部分）\n\n```go\npackage main\n\
    import \"fmt\"\n\ntype Employee struct {\n    n string\n    sal int\n}\nfunc(e\
    \ Employee) changeName(newName string) {\n    e.n = newName\n}\nfunc main() {\n\
    \    e := Employee {\n        n: \"Barak Obama\",\n        sal: 20000,\n    }\n\
    \    // e before change of name\n    fmt.Println(\"e before change of name =\"\
    , e)\n    // change name\n    e.changeName(\"John Wick\")\n    // e after change\
    \ of name\n    fmt.Println(\"e after change of name =\", e)\n}\n```\n\n从上面的结果中可以看出，`changeName`\
    \ 方法并没有影响 `e`。这是因为接收者 `e` 只是 `Employee` 的副本。为了修改原始数据，我们需要使用指针接收者：\n\n```go\npackage\
    \ main\nimport \"fmt\"\n\ntype Employee struct {\n    n string\n    sal int\n\
    }\nfunc(e *Employee) changeName(newName string) {\n    e.n = newName\n}\nfunc\
    \ main() {\n    e := Employee {\n        n: \"Barak Obama\",\n        sal: 20000,\n\
    \    }\n    // e before change of name\n    fmt.Println(\"e before change of name\
    \ =\", e)\n    // 获取 e 的指针\n    ep:= &e\n    // change name\n    ep.changeName(\"\
    John Wick\")\n    // e after change of name\n    fmt.Println(\"e after change\
    \ of name =\", e)\n}\n```\n\n通过指针接收者，我们看到 `changeName` 方法成功修改了 `e` 的属性。\n\n"
