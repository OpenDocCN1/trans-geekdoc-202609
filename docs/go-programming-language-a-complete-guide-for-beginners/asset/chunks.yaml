    \ 获得了另一种类型的能力，但类型 `T` 的任何值都不能视为另一种排序的值。\n\n### 封装\n\n封装被描述为将数据封装在一个单一单元中。系统将代码与其控制的数据结合在一起。另一种，实例化是一个防御屏障，防止信息被屏障之外的代码访问。在面向对象的语言中，类的因子或数据被其他类规避，并且只能通过声明它们的所属类的任何部分能力来访问。尽管如此，Go\
    \ 语言不支持类和对象。\n\n封装被描述为将数据封装在一个单一单元中。系统将代码与其控制的数据结合在一起。另一种，实例化是一个防御屏障，防止信息被屏障之外的代码访问。在面向对象的语言中，类的因子或数据被其他类规避，并且只能通过声明它们的所属类的任何部分能力来访问。尽管如此，Go\
    \ 语言不支持类和对象。\n\n#### 导出标识符\n\n导出标识符是从包中发送出的标识符。这些标识符的首字母始终大写写。这表明该能力是导出的工作。导出标识符始终限制在它们声明的包中。\n\
    \n#### 未导出标识符\n\n未导出标识符是那些没有从任何包发送出的标识符。它们始终是小写的。如下例模型所示，标识符未与任何包关联，因此它是未导出的工作，该技术的可可见性限制在该程序本身。\n\
    \n```go\npackage main\n\nimport (\n    \"fmt\"\n    \"strings\"\n)\n\nfunc addition(valzz\
    \ ...int) int {\n    s := 0\n    for x := range valzz {\n        s += valzz[x]\n\
    \    }\n    fmt.Println(\"Total: \", s)\n    return s\n}\n\nfunc main() {\n  \
    \  // main() {\n    slcxx := []string{\"SpanishforSpanish\", \"neo\", \"esp\"\
    }\n    for x := 0; x < len(slcxx); x++ {\n        res := strings.ToUpper(slcxx[x])\n\
    \        fmt.Println(res)\n    }\n}\n```\n\n"
