- raw: "Type the following:\n\nstatus=” I am happy I know” + “how to write programs\
    \ in Python.”    \n\nprint(status) \n\nPython Multiplication of a string to create\
    \ a sequence\n\nmany\\_words=”Great Programmer” \\* 5\n\nprint(many\\_words)\n\
    \nExercise\n\na.    Use a concatenation operator to join the following strings\
    \ in Python\n\nI have realized\n\nthat programming is a passion, \n\ndedication\
    \ and frequent practice.\n\nb.    Use an operator to generate ten times the following\
    \ string\n\nHappy\n\n## Summary\n\nWe have covered what constitutes variables\
    \ in Python. Variables are named storage locations, and for this reason, we have\
    \ variable names. There are numerical and string variables. These are known as\
    \ variable types. In handling variables and indeed any other aspect of Python\
    \ we will encounter and use special words known as reserved words or keywords.\
    \ Keywords are fixed and must be typed the way specified. Keywords cannot be used\
    \ as variable names or identifiers. Comments (preceded using #,’’’ or “) are for\
    \ human readability aspect of a Python program. Indentation is used in Python\
    \ to group lines of codes into blocks. Different types of operators such as the\
    \ arithmetic operators and string operators are used to allow for manipulation\
    \ of variables supported by the user and inbuilt functions in Python.\n\nType\
    \ Conversion and Type Casting in Python\n\nType Conversion refers to the process\
    \ of changing the value of one programming data type to another programming data\
    \ type. Think of dividing two integers that lead to decimal numbers. In this case,\
    \ it is necessary to convert force the conversion of an integer into a float number.\
    \ Python has two types of conversion: implicit type conversion and explicit conversion.\n\
    \n## i.    Implicit Conversion Type\n\nIn this case, Python automatically changes\
    \ one data type to another data type, and the process does not require user involvement.\
    \ Implicit type conversion is mainly used with the intent of avoiding data loss.\n\
    \nExample\n\n### Converting Integer to Float\n\nStart IDLE.\n\nNavigate to the\
    \ File menu and click New Window.\n\nType the following:\n\nnumber\\_int=451\n\
    \nnumber\\_flo=4.51\n\nnumber\\_new=number\\_int+number\\_flo\n\nprint(“the type\
    \ of data of number\\_int-“, type(number\\_int))\n\nprint(“the type of data of\
    \ number\\_flo-“, type(number\\_flo))\n\nprint(“value of number\\_new-“number\\\
    _new)\n\nprint(“type of data of number\\_new-“, type(number\\_new))\n\nExplanation\n\
    \nThe programming is adding two variables one of data type integer and the other\
    \ float and storing the value in a new variable of data type float. Python automatically\
    \ converts small data types into larger data types to avoid prevent data loss.\
    \ This is known as implicit type conversion.\n\nImportant\n\nPython cannot, however,\
    \ convert numerical data types into string data type or string data type into\
    \ numerical data type implicitly. Attempting such a conversion will generate an\
    \ error.\n\nExample\n\nStart IDLE.\n\nNavigate to the File menu and click New\
    \ Window.\n\nType the following:\n\nnumber\\_int=432        #lower data type\n\
    \nnumber\\_str=”241”        #higher data type\n\nprint(“The type of data of number\\\
    _int-“, type(number\\_int))\n\nprint(“The type of data of number\\_str-“, type(number\\\
    _str))\n\nprint(number\\_int+number\\_str)\n\nChallenge: Can you guess why this\
    \ is occurring? Python interpreter is unable to understand whether we want concatenation\
    \ or addition precisely. When it assumes the concatenation, it fails to locate\
    \ the other string. When it assumes the addition approach, it fails to locate\
    \ the other number. The solution to the error above is to have an explicit type\
    \ conversion.\n\n## ii.    Explicit Conversion\n\nHere, programmers convert the\
    \ data type of a named programming object to the needed data type. Explicit conversion\
    \ is attained through the functions float(), int(), and str() among others.\n\n\
    The syntax for the specific or explicit conversion is:\n\n(needed\\_datatype)\
    \ (expression)\n\nIllustration\n\nSumming of a string and integer using by using\
    \ explicit conversion\n\nStart IDLE.\n\nNavigate to the File menu and click New\
    \ Window.\n\nType the following:\n\nnumber\\_int=431\n\nnumber\\_str=”231”\n\n\
    print(“Type of data of number\\_int-“, type(number\\_int))\n\nprint(“Type of data\
    \ number\\_str prior to Type Casting-“, type(number\\_str))\n\nnumber\\_str=int(number\\\
    _str)\n\nnumber\\_sum=number\\_int+number\\_str\n\nprint(“Addition of number\\\
    _int and number\\_str-“, number\\_sum)\n\nprint(“Type of data of the sum-“, type(number\\\
    _sum))\n\nNote: Running this program will display the data types and sum and display\
    \ an integer and string.\n\nExplanation\n\nIn the above program, we added number\\\
    _str and number\\_int variable. We then converted number\\_str from string(higher\
    \ data type) to integer(lower data type)type using int() function to perform the\
    \ summation. Python manages to add the two variables after converting number\\\
    _str to an integer value. The number\\_sum value and data type are an integer\
    \ data type.\n\nRecap:\n\nThe conversion of the object from one data type to another\
    \ data type is known as type conversion. The python interpreter automatically\
    \ performs implicit type conversion. Implicit type conversion intends to enable\
    \ Python to avoid data loss. Typecasting or explicit conversion happens when the\
    \ data types of object are converted using the predefined function by the programmer.\
    \ Unlike implicit conversion, typecasting can lead to data loss as we enforce\
    \ the object to a particular data type.\n\nThe previous explicit conversion/typecasting\
    \ can be written as:\n\nStart IDLE.\n\nNavigate to the File menu and click New\
    \ Window.\n\nType the following:\n\nnumber\\_int=431                #int data\
    \ type\n\nnumber\\_str=”231”                #string data type\n\nnumber\\_str=int(number\\\
    _str)            #int function converting string into int data type\n\nnumber\\\
    _sum=number\\_int+number\\_str    #variable number\\_sum\n\nprint(“Addition of\
    \ number\\_int and number\\_str-“, number\\_sum)\n\nNote: Explicit conversion/Type\
    \ casting requires some practice to master, but it is easy. \n\nThe trick is here:\n\
    \nthe variable name to convert=predefined function for the desired data type (variable\
    \ name to convert)\n\nExercise:\n\nUse the knowledge of type casting/explicit\
    \ data conversion to write a program to compute the sum of:\n\na.    score\\_int=76\n\
    \nscore\\_str=”61.”\n\nb.    count\\_str=231\n\ncount\\_str=”24”\n\nUse the knowledge\
    \ of type casting/explicit data conversion to write a program find the product\
    \ of:\n\nc.    number\\_int=12\n\nnumber\\_str=”5.”\n\nd.    odds\\_int=6\n\n\
    odds\\_str=”2”\n\ne.    minute\\_int=45\n\nminute\\_str=”7”\n\n## Input, Output,\
    \ and Import in Python\n\nIn Python input and output (I/O) tasks are performed\
    \ by inbuilt functions. The print() performs output/display, while input() performs\
    \ input tasks.  The print() is used to output data to standard output devices\
    \ such as a screen. However, it is also possible to copy data to a file. You are\
    \ now familiar with the print function written as a print(). It is an inbuilt\
    \ function because we do not have to write it and specify what and how it works.\
    \ They are normally two main types of functions, inbuilt/built-in and user-defined\
    \ functions that we will handle later. When we want the print function to reference\
    \ or pick the value of a variable, we do not use double quotes.\n\nExample\n\n\
    Start IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \nnumber=6    #variable definition and assignment\n\nprint(number)    #displaying\
    \ value stored in variable number\n\nNote: Now assume we want to offer some explanation\
    \ to the user running this program as he or she will only 6 and does not understand\
    \ why 6 appears on the screen.\n\nnumber=6\n\nprint(“This is a number stored in\
    \ the variable number, it is:” number)\n\nNote: We can display string and other\
