    \ with a letter or an underscore, i.e.\n\n    `num1`\n    \n    `_num1`\n\n2.\
    \  The remaining part of the variable name may consist of numbers, letters, and\
    \ underscores, i.e.\n\n    `number1`\n    \n    `num_be_r`\n\n3.  Variable names\
    \ are case sensitive meaning that capital letters and non-capital letters are\
    \ treated differently.\n\n    `Num1` will be treated differently with `num1`.\n\
    \n**Exercise**\n\nWrite/suggest five variables for:\n\na.  Hospital department.\n\
    b.  Bank.\nc.  Media House.\n\nGiven `scri=75`, `scr4=9`, `sscr2=13`, `Scr=18`\n\
    \nd. The variable names above are supposed to represent scores of students. Rewrite\
    \ the variables to satisfy Python variable rules and conventions.\n\n## Conventions\
    \ When Naming Variables in Python\n\nAs earlier indicated, conventions are not\
    \ rules per se are the established traditions that add value and readability to\
    \ the way we name variables in Python.\n\n1.  **Uphold readability.** Your variables\
    \ should give a hint of what they are handling because programs are meant to be\
    \ read by other people other than the person writing them.\n\n    `number1` is\
    \ easy to read compared to `n1`. Similarly, `first_name` is easy to read compared\
    \ to `firstname` or `firstName` or `fn`. The implication of all these is that\
    \ both are valid/acceptable variables in python, but the convention is forcing\
    \ us to write them in an easy to read form.\n"
  trans: "\n现在输入 `5 +3`，然后按回车键，输出应为 `8`。下一种模式是脚本模式。\n\n### 脚本模式\n\n脚本模式用于运行写在文件中的\
    \ Python 程序；该文件称为脚本。\n\n## 集成开发环境 (IDE)\n\nIDE 为编写和运行 Python 程序提供了一种便捷的方式。也可以使用文本编辑器来创建\
    \ Python 脚本文件，而不使用 IDE，方法是编写代码行并将文件以 `.py` 扩展名保存。然而，使用 IDE 可以简化编写和运行 Python 程序的过程。Python\
    \ 包中自带的 `IDLE` 就是一个带有图形用户界面的 IDE 示例，它会随 Python 语言一起安装。IDE 的优势包括帮助摆脱重复性任务，并为初学者简化编码。IDE\
    \ 提供语法高亮、代码提示和语法检查等功能。也有商业 IDE，如 `PyScripter` IDE，能执行上述大部分功能。\n\n> **注意：**\n>\n\
    > 我们已介绍了什么是 Python、如何下载和安装 Python、Python IDE 的即时模式和脚本模式，以及什么是 IDE。\n\n## 你的第一个\
    \ Python 书面程序\n\n后续的演示将假设你在 Windows 环境中运行 Python 程序。\n\n1.  启动 `IDLE`\n2.  转到“文件”菜单并点击“新建窗口”\n\
    3.  输入以下内容：\n\n```\nprint (“Hello World!”)\n```\n\n4.  在文件菜单上，点击“保存”。输入名称 `myProgram1.py`\n\
    5.  转到“运行”并点击“运行模块”以运行程序。\n\n我们编写的第一个程序被称为“Hello World！”，它不仅用于介绍一门新的计算机编程语言，还用于测试\
    \ IDE 的基本配置。程序的输出是“Hello World！”。发生的情况如下：`Print()` 是一个内置函数，它是预先编写并预加载好的，用于显示括号\
    \ `()` 中包含的任何内容，只要它在双引号之间。计算机将显示双引号内编写的任何内容。\n\n**练习：** 现在编写并运行以下 Python 程序：\n\
    \na.  `print(“I am now a Python Language Coder!”)`\nb.  `print(“This is my second\
    \ simple program!”)`\nc.  `print(“I love the simplicity of Python”)`\nd.  `print(“I\
    \ will display whatever is here in quotes such as owyhen2589gdbnz082”)`\n\n现在我们需要编写一个包含数字的程序，但在编写此类程序之前，我们需要了解一些关于变量和类型的知识。\n\
    \n请记住 Python 是面向对象的，且不是静态类型的，这意味着我们在使用变量前不需要声明它们，也不需要指定它们的类型。让我们解释一下这句话；面向对象语言简单来说就是该语言支持将现实生活场景视为具有子组的群体，这些子组可以被链接和共享，模仿事物的自然秩序和交互。并非所有编程语言都是面向对象的；例如，`Visual\
    \ C` 编程语言就不是面向对象的。在编程中，声明变量意味着我们显式地说明变量的性质。变量可以被声明为整数、长整数、短整数、浮点整数、字符串或字符，包括其是局部可访问还是全局可访问。变量是一个存储位置，其值会根据条件而改变。\n\
    \n例如，`number1` 可以取从 0 到无穷大的任何数字。然而，如果我们显式指定 `int number1`，则意味着该存储位置将只接受整数而不接受分数，幸运的是或不幸的是，Python\
    \ 不要求我们显式说明存储位置的性质（声明变量），因为这由 Python 语言本身来推断。\n\n在探讨变量类型和变量命名规则之前，让我们运行一个简单的程序，以了解在编写\
    \ Python 程序时什么是变量。\n\n1.  启动 `IDLE`\n2.  转到“文件”菜单并点击“新建窗口”\n3.  输入以下内容：\n\n```\n\
    num1=4\nnum2=5\nsum=num1+num2\nprint(sum)\n```\n\n4.  在文件菜单上，点击“保存”。输入名称 `myProgram2.py`\n\
    5.  转到“运行”并点击“运行模块”以运行程序。\n\n该程序的预期输出应为 `9`（不带双引号）。\n\n### 解释\n\n此时，你渴望了解刚才发生了什么，以及为什么\
    \ `print(sum)` 不像我们编写的第一个程序那样带有双引号。以下是解释。\n\n第一行 `num1=4` 意味着变量 `num1`（我们书写 number1、第一个数字的简写形式）在程序运行前已被赋值为\
    \ `4`。\n\n第二行 `num2=5` 意味着变量 `num2`（我们书写 number2、第二个数字的简写形式）在程序运行前已被赋值为 `5`。\n\
    \n计算机解释这些指令并存储给定的数字。\n\n第三行 `sum=num1+num2` 告诉计算机获取 `num1` 所赋的任何值并加上 `num2` 所赋的任何值。换句话说，对\
    \ `num1` 和 `num2` 的值求和。\n\n第四行 `print(sum)` 意味着显示 `sum` 所拥有的任何值。如果我们给 `sum` 加上双引号，计算机将显示单词\
    \ `sum`，而不是这两个数字的和！请记住那句老话：计算机是“垃圾进，垃圾出”。它们遵循你给它们的指令！\n\n> **注意：** `+` 是对变量求和的运算符，还有其他用途，将在后面讨论。\n\
    \n现在，在解释变量类型和变量命名规则之前，让我们先尝试三个涉及数字的练习，以便你更自由地操作变量。请记住变量的值是可变的，例如 `num1` 可以取 `3`、`8`、`1562`、`1`。\n\
    \n遵循打开 Python IDE 的步骤并执行以下操作：\n\n1.  输出应为 `54`\n\n```\nnum1=43\nnum2=11\nsum=num1+num2\n\
    print(sum)\n```\n\n2.  输出应为 `167`\n\n```\nnum1=101\nnum2=66\nsum=num1+num2\nprint(sum)\n\
    ```\n\n3.  输出应为 `28`\n\n```\nnum1=9\nnum2=19\nsum=num1+num2\nprint(sum)\n```\n\
    \n## 变量\n\n我们已经使用了 `num1`、`num2` 和 `sum`，这些变量名并非随意起的，它们必须遵循特定的规则和约定。规则是我们不能违反的，而约定则更像是推荐的做法。让我们从规则开始：\n\
    \n### Python 中命名变量的规则\n\n1.  变量名必须始终以字母或下划线开头，即\n\n    `num1`\n    \n    `_num1`\n\
    \n2.  变量名的其余部分可以由数字、字母和下划线组成，即\n\n    `number1`\n    \n    `num_be_r`\n\n3.  变量名区分大小写，意味着大写字母和小写字母被视为不同。\n\
    \n    `Num1` 将与 `num1` 区别对待。\n\n**练习**\n\n为以下各项编写/建议五个变量：\n\na.  医院科室。\nb.  银行。\n\
    c.  媒体机构。\n\n已知 `scri=75`，`scr4=9`，`sscr2=13`，`Scr=18`\n\nd. 上述变量名旨在表示学生的分数。重写变量名以满足\
    \ Python 变量规则和约定。\n\n## Python 中命名变量的约定\n\n如前所述，约定本身不是规则，而是增加价值和可读性的既定传统，适用于我们在\
    \ Python 中命名变量的方式。\n\n1.  **保持可读性。** 你的变量应暗示其处理的内容，因为程序旨在供编写者以外的其他人阅读。\n\n   \
    \ `number1` 比 `n1` 更易读。同样，`first_name` 比 `firstname`、`firstName` 或 `fn` 更易读。这意味着所有这些在\
    \ Python 中都是有效/可接受的变量，但约定强制我们以易读的形式编写它们。\n\n"
