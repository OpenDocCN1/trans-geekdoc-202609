    \ `Images/image00210.gif`)*\n\n### Exercise\n\nCreate a directory using the Python\
    \ method and name it `Lesson`. Rename it using a Python method to `Python Lessons`.\n\
    \n## Removing File or Directory in Python\n\nThe `remove()` method is used to\
    \ delete a file in Python. Likewise, `rmdir()` is used to remove an empty directory.\n\
    \n### Example\n\nStart IDLE.\n\nNavigate to the **File** menu and click **New\
    \ Window**.\n\nType the following:\n\n```\nos.listdir()\n# ['mine_direct']\nos.rmdir('mine_direct')\n\
    ```\n\n## Errors and Exceptions\n\nWhen the Python interpreter encounters errors,\
    \ it will raise exceptions. For instance, dividing a number by zero will lead\
    \ to an exception.\n\n### Example of an Error\n\nStart IDLE.\n\nNavigate to the\
    \ **File** menu and click **New Window**.\n\nType the following:\n\n```\nif y\
