    \ illustration above, `y` is a global variable and is defined as a `foo()` to\
    \ print the global variable `y`. When we call `foo()`, it will print the value\
    \ of `y`.\n\n## Local Variables\n\nA local variable is declared within the body\
    \ of the function or in the local scope.\n\n### Example\n\nStart IDLE.\n\nNavigate\
    \ to the **File** menu and click **New Window**.\n\nType the following:\n\n```\n\
    def foo():\n    x = \"local\"\n\nfoo()\nprint(x)\n```\n\n### Explanation\n\nRunning\
    \ this program will generate an error indicating `x` is undefined. The error occurs\
    \ because we are trying to access local variable `x` in a global scope whereas\
    \ `foo()` functions only in the local scope.\n\n## Creating a Local Variable in\
    \ Python\n\n### Example\n\nA local variable is created by declaring a variable\
    \ within the function.\n\n```\ndef foo():\n    x = \"local\"\n    print(x)\n\n\
