    ## 用户自定义异常


    有时用户可能需要创建自己的异常，以最符合您的编程需求，这些被称为用户自定义异常。


    用户必须创建一个新类并从 `Exception` 类派生。


    ## 总结


    文件用于持久化存储。要从文件读取，我们需要打开它，完成操作后，必须关闭它以释放 Python 中与文件关联的资源。Python 的内置函数 `open()`
    用于打开文件。调用此函数时，会访问并加载一个文件对象，有时称为句柄，用于相应地修改或读取文件。对于 `readlines()` 方法，它将扫描整个文件的所有行。读取完整个文件后，读取方法将报告空状态。报告空状态的原因是因为没有更多参数供该方法处理。`read()`
    将遍历文件中的每一行，直到没有更多行可扫描。


    `r` 用于以读取模式打开文件，且为默认模式。`w` 用于以写入模式打开文件。对于独占文件创建，我们使用 `x` 模式。如果要创建的文件已存在，操作将失败。另一种模式
    `a` 用于以追加模式打开文件，在文件末尾添加数据的同时保留原有内容。如果文件不存在，`a` 模式将创建一个新文件。对于 `t` 模式，它将以默认文本模式打开文件。`b`
    模式用于以二进制模式打开文件。最后，`+` 模式用于打开文件以允许读取和写入。


    # 第 2 章：机器学习的主要概念


    什么是机器学习工作流？典型的机器学习工作流的核心步骤有哪些？


    本章讨论机器学习项目的工作流，这包括从头构建一个合适的机器学习项目所需的所有步骤。


    我们还将介绍数据预处理、数据清洗、特征探索和特征工程，并展示它们对机器学习模型性能的影响。我们还将介绍一些预建模步骤，这些步骤有助于提高模型性能。


    完成任务所需的 Python 库：


    *   `Numpy`

    *   `Pandas`

    *   `Sci-kit Learn`

    *   `Matplotlib`


    ## 机器学习工作流概述


    ### 理解机器学习工作流


    我们可以将机器学习工作流定义为 3 个阶段。


    1.  收集数据

    2.  数据预处理

    3.  研究最适合该数据类型的模型

    4.  训练和测试模型

    5.  评估


    好的，但首先让我们从基础开始


    ### 什么是机器学习模型？


    机器学习模型可以定义为一段程序，数据科学家或工程师通过使用数据对其进行训练使其变得“聪明”。因此，例如，如果你给模型喂入垃圾数据，它将产生垃圾结果，这意味着如果输入无效数据或垃圾数据，训练好的模型将提供错误或虚假的预测。


    #### 数据预处理


    这是机器学习中必不可少的程序之一。它是使机器学习模型更准确的最重要步骤。在机器学习中，有一个 80/20 法则。每个数据科学家应花费 80% 的时间进行数据预处理，20%
    的时间进行分析。


    ### 什么是数据预处理？


    数据预处理是指清洗原始数据的过程。从现实世界收集的数据通常会被转换为一组干净的数据。每当从不同来源收集数据时，它通常处于原始形式，这种数据不适合分析阶段。


    因此，遵循特定程序将数据转化为精简干净的数据集；这个过程称为数据预处理。


    #### 研究最适合该数据类型的模型


    我们的主要目标是使用预处理后的数据训练出性能最好的模型。


    ##### 监督学习


    在监督学习中，人工智能系统被提供带标签的信息或数据，这意味着每个数据都标记有正确的标签。


    监督学习分为另外两类：回归和分类。


    ###### 分类


    分类问题是指目标变量是分类型的（意味着输出可以被分类——它属于类别 A 或类别 B 或其他）。


    分类问题是指输出变量是一个组别，例如蓝色或红色、无疾病或有疾病、非垃圾邮件或垃圾邮件。


    这些是一些最常用的分类算法。


    *   `KNN`

    *   `Naive Bayes`

    *   `Random Forest`

    *   `Logistic`


    ###### 回归


    当目标变量是连续型时（意味着输出是数值），会发生回归问题。


    回归


    如上图所示，我们可以想象图表的 X 轴是 `Test scores`（考试分数），Y 轴代表 `IQ`。所以我们尝试在给定的图表中创建[最佳拟合线](https://mathbits.com/MathBits/TISection/Statistics1/LineFit.htm)，以便我们可以使用该线来预测给定数据中不存在的任何近似
    IQ 值。


    这些是一些最常用的回归算法。


    *   `Linear`

    *   `Support Vector`

    *   `Decision Trees`

    *   `Gaussian Progresses`

    *   `Ensemble Methods`


    ##### 无监督学习


    对于无监督学习，人工智能系统被输入未分类和未标记的数据，并且系统的算法在训练前处理数据。结果输出取决于编程或编码的算法。让系统接触无监督学习是测试人工智能的方法之一。


    无监督学习分为另外两组，称为聚类和关联。


    ###### 聚类


    一组输入被分成若干组。与分类不同，这些组在开始时是未知的，这使其成为一个无监督的过程或任务。


    用于聚类的方法有：


    *   `K-Means`

    *   `Gaussian`

    *   `Boosting`

    *   `Hierarchical`

    *   `Spectral`


    ### 类别下的模型概述


    ### 在数据上训练和测试模型


    为了训练模型，我们最初将数据分成三个部分：训练数据、验证数据和测试数据。


    分类器通常使用训练数据集进行训练，请确保使用验证数据集准备所需的参数，然后使用未见过的测试数据集测试分类器的功能。需要注意的一个关键点是，当你训练分类器时，只有训练和验证数据集可用。训练分类器时不应使用测试数据集。测试数据集通常在测试分类器时可用。


    如果我必须用几个标题总结 2018 年机器学习进展的主要亮点，这些可能是我会想到的：


    *   AI 炒作和恐惧散布逐渐冷却。

    *   更多地关注公平性、可解释性或因果性等具体问题。

    *   深度学习将长期存在，并且在实践中不仅对图像分类有用（特别是对自然语言处理 NLP）。

    *   AI 框架领域的竞争日益激烈，如果你想出人头地，最好发布一些自己的框架。


    '
