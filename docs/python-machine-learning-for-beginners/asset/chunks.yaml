    # Introduction


    Welcome and much appreciation for downloading this book. The book will cover the
    entire Python programming from an absolute beginner perspective and place more
    emphasis on the first three chapters to enable the reader to get furnished. Chapter
    3 of the book covers how to install and run Python IDE and including your first
    “Hello World Program”.


    This book is written with the understanding that the student is completely new
    to Python programming. For this reason, the author takes measures not to assume
    or leave out any part. Unlike other books, the author decided to split content
    meant for the first chapter into three chapters to gradually introduce the learner
    into Python programming. The author explains systematically how to get started,
    keywords, statements, variables, data types and type conversion among other basic
    areas of Python programming. After providing examples, the author also provides
    exercises. The exercises are carefully selected and will not overwhelm an absolute
    beginner. They are meant to help the learner systematically build skills and confidence
    in Python programming. Once through with the book, the learner will be more than
    ready to handle any Python programming challenge. Let us begin.


    ---


    # Chapter 1: Introduction to Machine Learning


    The topics discussed in this chapter come from an analysis of the main requirements
    in data scientist jobs from popular technology companies. The topics are as listed
    below:


    *   Linear Regression (Simple)

    *   Linear Regression (Multiple)

    *   Evaluating Performance of Models

    *   Hierarchical Clustering

    *   KNN

    *   Kernel SVM

    *   Clustering K-Means

    *   Principle Component Analysis (PCA)

    *   Pandas (Python Library for Handling Information or Data)


    Artificial intelligence, ML, and data science are some of the trending subjects
    in the technology field today. Bayesian analysis and data mining are the ones
    currently trending and this has contributed to the increasing demand for ML (Machine
    Learning).


    ML is a field that focuses on the programming of computer systems hence causing
    them to learn and improve with expertise automatically.


    ### ML Algorithms Applications


    *   Data mining

    *   Games

    *   Robotics

    *   Expert computer systems

    *   Recognition of patterns

    *   Vision processing

    *   Language processing

    *   Stock market trend and weather forecast


    ### Procedures involved in ML


    An efficient ML project entails the following steps:


    *   Definition of the problem

    *   Preparation of data

    *   Evaluation of algorithms

    *   Improving the results

    *   Presentation of the results


    The perfect way of starting on ML using Python is working through a project from
    the beginning to the end and cover the major steps such as summarizing data, evaluating
    algorithms, loading information, and predicting. This will provide you with a
    replicable technique that can be used for each dataset. Adding further data to
    improve the results is also an available option.


    To understand machine learning you are required to understand how files work in
    Python. The following section discusses Python files.


    ## Python Files


    Files are used for future storage. To read from a file we need to open it and
    once through with it, we have to close it to free the resources.


    ### File Opening


    The inbuilt function `open()` in Python is used to launch a file.


    **Example**


    Start IDLE.


    Navigate to the File menu and click New Window.


    Type the following:


    ```

    file_name = open("lesson.txt")

    file_name = open("D:/Tutorials/lesson.txt")

    ```


    **Exercise**


    a. Locate a text file on your computer and open using the Python `open()`

    b. Locate a doc/docx file on your computer and open using Python `open()`

    c. Locate an excel file on your computer and open using Python `open()`


    Additionally, Appending `''a''`, write `''w''`, or read `''r''` the file helps
    indicate the mode when launching the file. The modes are determined by the context
    and can be changed as the need arises. Python also allows us to indicate binary
    or text mode depending on our programming needs. By default, the file is opened
    in text read mode. Images and non-text files are handled in the binary mode.


    ### Python File Modes


    The `''r''` is used to launch the file for reading and is the default. The `''w''`
    is preferred when launching writing permissions. For exclusive file creation,
    we use the `''x''` mode. The operation will be unsuccessful if the file already
    we want already exists. The other mode, `''a''` is used to launch a file for adding
    data at the file end while retaining earlier content. For the `''t''` mode, it
    will launch the file in default text mode. The `''b''` mode is used to launch
    the file in binary mode. Lastly, the `''+''` mode is used for launching the file
    to allow reading and writing.


    **Exercise**


    a. Open an existing `.txt` file on your computer in Python’s read mode.

    b. Open the same text file in a. in Python’s write mode.

    c. Open an existing image on your computer in binary mode.


    ### Specifying the File Encoding Type


    It is encouraged to specify the file encoding type as it varies from operating
    system platform to another and may produce different results if not specified.


