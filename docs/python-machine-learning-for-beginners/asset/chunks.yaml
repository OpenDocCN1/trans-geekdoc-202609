    ], \\[‘g’\\]\\]\n\nExercise\n\nWrite a nested for the following elements: \\[36,2,1\\\
    ],”Writer”,’t’,\\[3.0, 2.5\\]\n\n## Accessing Elements from a List\n\nIn programming\
    \ and in Python specifically, the first time is always indexed zero. For a list\
    \ of five items, we will access them from index0 to index4. Failure to access\
    \ the items in a list in this manner will create index error. The index is always\
    \ an integer as using other number types will create a type error. For nested\
