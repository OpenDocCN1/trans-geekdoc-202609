    # Python Programming Concepts


    ## Fractions in Python


    The computer works with finite numbers and fractions cannot be stored in their
    raw form as they will create an infinite long binary sequence.


    The `fractions` module in Python allows operations on fractional numbers.


    ### Example


    Start IDLE.


    Navigate to the File menu and click New Window.


    Type the following:


    ```python

    import fractions


    print(fractions.my_fraction(2.5))  # Output 5/2

    print(fractions.my_fraction(4))    # Output 5

    print(fractions.my_fraction(2,5))  # Output 2/5

    ```


    > **Important**

    > Creating `my_fraction` from float can lead to unusual results due to the misleading
    representation of binary floating point.


