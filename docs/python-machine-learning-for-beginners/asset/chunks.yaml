    有趣的是，框架领域另一个取得有趣进展的方向是强化学习。


    虽然我认为 RL 研究进展不如往年令人印象深刻（仅近期 DeepMind 的[Impala](https://arxiv.org/pdf/1802.01561.pdf)工作令人印象深刻），但令人惊讶的是，在短短一年内，所有主要
    AI 参与者都发布了 RL 框架。谷歌发布了用于研究的[Dopamine 框架](https://github.com/google/dopamine)，DeepMind（同样隶属谷歌）发布了某种程度上竞争的[TRFL](https://deepmind.com/blog/trfl/)框架。Facebook
    推出了[Horizon](https://research.fb.com/publications/horizon-facebooks-open-source-applied-reinforcement-learning-platform/)，微软发布了[TextWorld](https://www.microsoft.com/en-us/research/blog/textworld-a-learning-environment-for-training-reinforcement-learning-agents-inspired-by-text-based-games/?OCID=msr_blog_textworld_icml_tw)，后者更专注于基于文本游戏的训练智能体。希望这些开源成果能助力我们在
    2019 年见证大量 RL 进展。


    最后，在框架方面，我欣喜地看到谷歌最近在 TensorFlow 之上发布了[TFRank](https://ai.googleblog.com/2018/12/tf-ranking-scalable-tensorflow-library.html)。排序是极其重要的
    ML 应用，近期可能未获得应有的关注。


    ## 结语


    深度学习似乎消除了对数据精心设计的需求，但事实远非如此。


