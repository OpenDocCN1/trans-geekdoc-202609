    # Python 中的类型转换和类型强制转换


    类型转换是指将一种编程数据类型的值更改为另一种编程数据类型的过程。设想一下将两个整数相除从而得到小数的情况。在这种情况下，有必要将整数强制转换为浮点数。Python
    有两种转换类型：隐式类型转换和显式转换。


    ## i. 隐式转换类型


    在这种情况下，Python 会自动将一种数据类型更改为另一种数据类型，该过程不需要用户参与。隐式类型转换主要用于避免数据丢失。


    ### 示例：将整数转换为浮点数


    启动 IDLE。导航到“文件”菜单并点击“新建窗口”。键入以下内容：


    ```python

    number_int = 451

    number_flo = 4.51

