- raw: " The global keyword is used to read and write a global variable within a function.\n\
    \nThe use of global keyword outside a function will have no effect.\n\nExample.\n\
    \nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \nnumber = 3        #A global variable\n\ndef add():\n\n    print(number)\n\n\
    add()\n\nThe output of this program will be 3.\n\nModifying global variable from\
    \ inside the function.\n\nnumber=3                    #a global variable       \
    \ \n\ndef add():\n\n    number= number + 4     # add 4 to 3\n\n    print(number)\n\
    \nadd()\n\nExplanation\n\nWhen the program is executed it will generate an error\
    \ indicating that the local variable number is referenced before assignment. The\
    \ reason for encountering the error is because we can only access the global variable\
    \ but are unable to modify it from inside the function. Using a global keyword\
    \ would solve this.\n\nExample.\n\nStart IDLE.\n\nNavigate to the File menu and\
    \ click New Window.\n\nType the following:\n\nModifying global variable within\
    \ a function using the global keyword.\n\nnumber = 3             # a global variable\n\
    \ndef add():\n\n    global number\n\n    number= number + 1 # increment by 1\n\
    \n    print(\"Inside the function add():\", number)\n\nadd()\n\nprint(\"In main\
    \ area:\", number)\n\nExplanation\n\nWhen the program is run, the output will\
    \ be:\n\n Inside the function add(): 4\n\nIn the main area: 4\n\nWe defined a\
    \ number as a global keyword within the function add(). The variable was then\
    \ incremented by 1, variable number. Then we called the add () function to print\
    \ global variable c.\n\n## Creating Global Variables across Python Modules\n\n\
    We can create a single module config.py that will contain all global variables\
    \ and share the information across several modules within the same program.\n\n\
    Example.\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\n\
    Type the following:\n\nCreate config.py\n\nx=0\n\ny=”empty”\n\nThen create an\
    \ update.py file to modify global variables\n\nImport config\n\nconfig.x=11\n\n\
    config.y=”Today”\n\nThen create a main.py file to evaluate the changes in value\n\
    \nimport config\n\nimport update\n\nprint(config.x)\n\nprint(config.y)\n\nExplanation\n\
    \nRunning the main.py file will generate:\n\n11\n\nToday\n\n## Python Modules\n\
    \nModules consist of definitions as well as program statements.\n\nAn illustration\
    \ is a file name config.py which is considered as a module. The module name would\
    \ be config. Modules are sued to help break large programs into smaller manageable\
    \ and organized files as well as promoting reusability of code. \n\nExample: Creating\
    \ the First module\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\
    \nType the following:\n\nDef add(x, y):\n\n“””This is a program to add two\n\n\
       numbers and return the outcome\"\"\"\n\noutcome=x+y\n\nreturn outcome\n\n##\
    \ Module Import\n\nThe keyword import is used to import. \n\nExample\n\nImport\
    \ first\n\nThe dot operator can help us access a function as long as we know the\
    \ name of the module. \n\nExample\n\nStart IDLE.\n\nNavigate to the File menu\
    \ and click New Window.\n\nType the following:\n\nfirst.add(6,8)\n\nExplanation\n\
    \n## import statement in Python\n\nThe import statement can be used to access\
    \ the definitions within a module via the dot operator.\n\nStart IDLE.\n\nNavigate\
    \ to the File menu and click New Window.\n\nType the following:\n\nimport math\n\
    \nprint(\"The PI value is\", math.pi)\n\nImport with renaming\n\nExample\n\nStart\
    \ IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \nimport math as h\n\n   print(“The PI value is-“,h.pi)\n\nExplanation\n\nIn this\
    \ case, h is our renamed math module with a view helping save typing time in some\
    \ instances. When we rename the new name becomes valid and recognized one and\
    \ not the original one.\n\nFrom…import statement Python.\n\nIt is possible to\
    \ import particular names from a module rather than importing the entire module.\n\
    \nExample\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\n\
    Type the following:\n\nfrom math import pi\n\nprint(\"The PI value is-\", pi)\n\
    \n## Importing all names\n\nExample\n\nStart IDLE.\n\nNavigate to the File menu\
    \ and click New Window.\n\nType the following:\n\nfrom math import\\*\n\nprint(\"\
    The PI value is-\", pi)\n\nExplanation\n\nIn this context, we are importing all\
    \ definitions from a particular module but it is encouraged norm as it can lead\
    \ to unseen duplicates.\n\n## Module Search Path in Python\n\nExample\n\nStart\
    \ IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \nimport sys\n\nsys.path\n\nPython searches everywhere including the sys file.\n\
    \n## Reloading a Module\n\nPython will only import a module once increasing efficiency\
    \ in execution.\n\nprint(“This program was executed”)\n\nimport mine\n\nReloading\
    \ Code\n\nExample\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\
    \nType the following:\n\nimport mine\n\nimport mine\n\nimport mine\n\nmine.reload(mine)\n\
    \n## Dir() built-in Python function\n\nFor discovering names contained in a module,\
    \ we use the dir() inbuilt function. \n\nSyntax\n\ndir(module\\_name)\n\n## Python\
    \ Package\n\nFiles in python hold modules and directories are stored in packages. \
    \ A single package in Python holds similar modules. Therefore, different modules\
    \ should be placed in different Python packages. \n\nData types in Python\n\n\
    ##        Numbers\n\nAs mentioned earlier, Python accommodates floating, integer\
    \ and complex numbers. The presence or absence of a decimal point separates integers\
    \ and floating points. For instance, 4 is integer while 4.0 is a floating point\
    \ number.\n\nOn the other hand, complex numbers in Python are denoted as r+tj\
    \ where j represents the real part and t is the virtual part.  In this context,\
    \ the function type() is used to determine the variable class. The Python function\
    \ instance() is invoked to make a determination of which specific class function\
    \ originates from.\n\nExample\n\nStart IDLE.\n\nNavigate to the File menu and\
    \ click New Window.\n\nType the following:\n\nnumber=6\n\n  print(type(number))#should\
    \ output class int\n\nprint(type(6.0))#should output class float\n\ncomplex\\\
    _num=7+5j\n\nprint(complex\\_num+5)\n\nprint(isinstance(complex\\_num, complex))#should\
    \ output True\n\nImportant: Integers in Python can be of infinite length. Floating\
    \ numbers in Python are assumed precise up to fifteen decimal places. \n\n## Number\
    \ Conversion\n\nThis segment assumes you have prior basic knowledge of how to\
    \ manually or using a calculator to convert decimal into binary, octal and hexadecimal.\
    \ Check out the Windows Calculator in Windows 10, Calculator version Version 10.1804.911.1000\
    \ and choose programmer mode to automatically convert.\n\nProgrammers often need\
    \ to convert decimal numbers into octal, hexadecimal and binary forms. A prefix\
    \ in Python allows denotation of these numbers to their corresponding type.\n\n\
    Number SystemPrefix\n\nOctal‘0O’ or '0o' \n\nBinary‘0B' or '0b' \n\nHexadecimal'0X\
    \ or '0x' \n\nExample\n\nprint(0b1010101)#Output:85\n\nprint(0x7B+0b0101)#Output:\
    \ 128 (123+5)\n\nprint(0o710)#Output:710\n\nExercise\n\nWrite a Python program\
    \ to display the following:\n\na.0011 11112\n\nb.7478\n\nc.9316\n\n## Type Conversion\n\
    \nSometimes referred to as coercion, type conversion allows us to change one type\
    \ of number into another. The preloaded functions such as float(), int() and complex()\
    \ enable implicit and explicit type conversions. The same functions can be used\
    \ to change from strings.\n\nExample\n\nStart IDLE.\n\nNavigate to the File menu\
    \ and click New Window.\n\nType the following:\n\nint(5.3)#Gives 5\n\nint(5.9)#Gives\
    \ 5\n\nThe int() will produce a truncation effect when applied to floating numbers.\
    \ It will simply drop the decimal point part without rounding off. For the float()\
    \ let us take a look:\n\nStart IDLE.\n\nNavigate to the File menu and click New\
    \ Window.\n\nType the following:\n\nfloat(6)#Gives 6.0\n\nccomplex(‘4+2j’)#Gives\
    \ (4+2j)\n\nExercise\n\nApply the int() conversion to the following:\n\na.4.1\n\
    \nb.4.7\n\nc.13.3\n\nd.13.9\n\nApply the float() conversion to the following:\n\
    \ne.7\n\nf.16\n\ng.19\n\n##        Decimal in Python\n\nExample\n\nStart IDLE.\n\
    \nNavigate to the File menu and click New Window.\n\nType the following:\n\n(1.2+2.1)==3.3\
    \ #Will return False, why?\n\nExplanation"
  fmt: "\n# Python Global Variables and Modules\n\n## The `global` Keyword\n\nThe\
    \ `global` keyword is used to read and write a global variable within a function.\n\
    \nThe use of `global` keyword outside a function will have no effect.\n\n### Example:\
    \ Accessing a Global Variable\n\nStart IDLE.\n\nNavigate to the File menu and\
    \ click New Window.\n\nType the following:\n\n```python\nnumber = 3          #\
    \ A global variable\n\ndef add():\n    print(number)\n\nadd()\n```\n\nThe output\
    \ of this program will be `3`.\n\n### Example: Modifying Global Variable (Error)\n\
    \n```python\nnumber = 3          # a global variable\n\ndef add():\n    number\
    \ = number + 4   # add 4 to 3\n    print(number)\n\nadd()\n```\n\n**Explanation**\n\
    \nWhen the program is executed it will generate an error indicating that the local\
    \ variable `number` is referenced before assignment. The reason for encountering\
    \ the error is because we can only access the global variable but are unable to\
    \ modify it from inside the function. Using a `global` keyword would solve this.\n\
    \n### Example: Modifying Global Variable using `global` Keyword\n\n```python\n\
    number = 3          # a global variable\n\ndef add():\n    global number\n   \
    \ number = number + 1   # increment by 1\n    print(\"Inside the function add():\"\
    , number)\n\nadd()\nprint(\"In main area:\", number)\n```\n\n**Explanation**\n\
    \nWhen the program is run, the output will be:\n\n```\nInside the function add():\
    \ 4\nIn main area: 4\n```\n\nWe defined `number` as a `global` keyword within\
    \ the function `add()`. The variable was then incremented by 1. Then we called\
    \ the `add()` function to print global variable `number`.\n\n## Creating Global\
