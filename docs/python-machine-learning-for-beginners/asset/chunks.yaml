    \ 3          # 一个全局变量\n\ndef add():\n    global number\n    number = number +\
    \ 1   # 增加 1\n    print(\"Inside the function add():\", number)\n\nadd()\nprint(\"\
    In main area:\", number)\n```\n\n**解释**\n\n程序运行后，输出将为：\n\n```\nInside the function\
    \ add(): 4\nIn main area: 4\n```\n\n我们在函数 `add()` 内部使用 `global` 关键字定义了 `number`。该变量随后增加了\
    \ 1。接着我们调用 `add()` 函数来打印全局变量 `number`。\n\n## 跨 Python 模块创建全局变量\n\n我们可以创建一个单独的模块\
    \ `config.py`，其中包含所有全局变量，并在同一程序的多个模块间共享这些信息。\n\n### 示例\n\n**创建 `config.py`**\n\
    \n```python\nx = 0\ny = \"empty\"\n```\n\n**创建 `update.py` 以修改全局变量**\n\n```python\n\
