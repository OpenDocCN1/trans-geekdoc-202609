- raw: "ii.    Use descriptive names when writing your variables. For instance, number1\
    \ as a variable name is descriptive compared to yale or mything. In other words,\
    \ we can write yale to capture values for number1, but the name does not outrightly\
    \ hint what we are doing. Remember when writing programs; assume another person\
    \ will maintain them. The person should be able to quickly figure out what the\
    \ program is all about before running it.\n\niii.    Due to confusion, avoid using\
    \ the uppercase ‘O,’ lowercase letter ‘l’ and the uppercase letter ‘I’ because\
    \ they can be confused with numbers. In other terms, using these letters will\
    \ not be a violation of writing variables, but their inclusion as variable names\
    \ will breed confusion.\n\nExercise 1\n\nRe-write the following variable names\
    \ to (1) be valid variable names and follow (2) conventions of writing variable\
    \ names.\n\na.    23doctor\n\nb.    line1\n\nc.    Option3\n\nd.    Mydesk\n\n\
    e.    #cup3\n\nExercise 2\n\nWrite/Suggest variable names that are (1) valid and\
    \ (2) conventional.\n\na.    You want to sum three numbers.\n\nb.    You want\
    \ to store the names of four students.\n\nc.    You want to store the names of\
    \ five doctors in a hospital.\n\n## Summary\n\nVariables are storage locations\
    \ that a user specifies before writing and running a python program. Variable\
    \ names are labels of those storage locations. A variable holds a value depending\
    \ on circumstances. For instance, doctor1 can be Daniel, Brenda or Rita. Patient1\
    \ can be Luke, William or Kelly. Variable names are written by adhering to rules\
    \ and conventions. Rules are a must while conventions are optional but recommended\
    \ as they help write readable variable names. When writing a program, you should\
    \ assume that another person will examine or run it without your input and thus\
    \ should be well written. The next chapter will discuss Variables. In programming,\
    \ declaring variables means that we explicitly state the nature of the variable.\
    \ The variable can be declared as an integer, long integer, short integer, floating\
    \ integer, a string, or as a character including if it is accessible locally or\
    \ globally. A variable is a storage location that changes values depending on\
    \ conditions. Use descriptive names when writing your variables.\n\nTypes of Variables\n\
    \nNow that we have defined what are variables are and the rules to write variable\
    \ names let us explore different types of Variables.\n\n## i.    Numbers\n\nThe\
    \ Python accommodates two kinds of numbers, namely floating point numbers and\
    \ integer numbers. Python also supports complex numbers. When you sign a value\
    \ to a number, then a number object is created. For example:\n\nnumber3 =9\n\n\
    number4=12\n\nDifferent Numerical Types Supported in Python\n\n•    long for example\
    \ 681581903L\n\n•    int for example 11, 123, -151\n\n•    float for example 0.5,\
    \ 23.1, -54.2\n\n•    complex for example 4.12j\n\nExercise\n\nIdentify the type\
    \ of numerical below:\n\na.    234, 19, 312\n\nb.    4.56, 2.9, 9.3\n\nc.    76189251468290127624471\n\
    \nIdentify the numerical type suitable for the following contexts:\n\nd.    Salary\
    \ amount.\n\ne.    Counting the number of students in a class.\n\nf.    Getting\
    \ the census figure in an entire country of China.\n\n## ii. Strings\n\nA single\
    \ or double quote in Python is used to indicate strings. The subsets of strings\
    \ can be taken by using the slice operator (\\[:\\]) and \\[\\]) with indexes\
    \ beginning at () in the start of the string and operating their way from -1 at\
    \ the end. Strings can be joined using the + (plus) sign known as the concatenation\
    \ operator. The asterisk (\\*) is used as a repetition operator. Remember counting\
    \ in programming starts from index zero (the first value)!\n\n![](Images/image00229.gif)\n\
    \nNote: the # (hash sign) is used to indicate a single line comment. A comment\
    \ is descriptive information about a particular line(s) of code. The comment is\
    \ normally ignored by when running the program. The comment should be written\
    \ after the # sign in python. Comments increase the readability of the program\
    \ written.\n\nExercise:\n\nYou will key in/type the following program statement:\n\
    \nstr = 'I think I am now a Programmer.'\n\na.    Write a program statement that\
    \ will display the entire string/statement above.\n\nb.    Write a program statement\
    \ to display characters of the string from the second character to the sixth.\n\
    \nc.    Write a single program statement that will display the entire string two\
    \ times. ( use \\*).\n\nd.    Write a program statement that will add the following\
    \ at the end of the statement above, “ of Python.”\n\n## Keywords and Identifiers\
    \ in Python\n\nAt this point, you have been wondering why you must use print and\
    \ str in that manner without the freedom or knowledge of why the stated words\
    \ have to be written in that manner. The words print and str constitute a special\
    \ type of words that have to be written that way always.   Each programming language\
    \ has a set of keywords. In most cases, some keywords are found across several\
    \ programming languages. Keywords are case sensitive in python meaning that we\
    \ have to type them in their lowercase form always. Keywords cannot be used to\
    \ name a function (we will explain what it is later), name of a variable.\n\n\
    There are 33 keywords in Python, and all are in lowercase save for None, False,\
    \ and True. They must always be written as they appear below:\n\n![](Images/image00230.gif)\n\
    \nNote: The print() and str are functions, but they are inbuilt/preloaded functions\
    \ in Pythons. Functions are a set of rules and methods that act when invoked.\
    \ For instance, the print function will display output when activated/invoked/called.\
    \ At this point, you have not encountered all of the keywords, but you will meet\
    \ them gradually. Take time to skim through, read and try to recall as many as\
    \ you can.\n\nExercise\n\nIdentify what is wrong with the following variable names\
    \ (The exercise requires recalling what we have learned so far)\n\na.    for=1\n\
    \nb.    yield=3\n\nc.    34ball\n\nd.    m\n\n## Comments and Statements\n\n###\
    \ Statements in Python\n\nA statement in Python refers to instructions that a\
    \ Python interpreter can work on/execute. An example is str=’ I am a Programmer’\
    \ and number1=3. A statement having an equal sign(=) is known as an assignment\
    \ statement. They are other types of statements such as the if, while, and for\
    \ which will be handled later.\n\nExercise \n\na. Write a Python statement that\
    \ assigns the first number value of 18.\n\nb. Write a programming statement that\
    \ assigns the second number value of 21.\n\nc.  What type of statements are a.\
    \ and b. above?\n\n### Multi-line Python Statement\n\nSpreading a statement over\
    \ multiple lines is possible. Such a statement is known as a multi-line statement.\
    \ The termination of a programming statement is denoted by a new line character.\
    \ To spread a statement overs several lines, in Python, we use the backslash (\\\
    \\) known as the line continuation character. An example of a multi-line statement\
    \ is:\n\nsum=3+6+7+\\\\\n\n         9+1+3+\\\\\n\n         11+4+8\n\nThe example\
    \ above is also known as an explicit line continuation. In Python, the square\
    \ brackets \\[\\] denotes line continuation similar to parenthesis/round brackets\
    \ (), and lastly braces {}. The above example can be rewritten as\n\nsum=(3+6+7+\n\
    \n         9+1+3+\n\n         11+4+8)\n\nNote: We have dropped the backslash(\\\
    \\) known as the line continuation character when we use the parenthesis(round\
    \ brackets) because the parenthesis is doing the work that the line continuation\
    \ \\\\ was doing.\n\nQuestion: Why do you think multi-line statements are necessary\
    \ we can simply write a single line, and the program statement will run just fine?\n\
    \nAnswer: Multi-line statements can help improve formatting/readability of the\
    \ entire program. Remember, when writing a program always assume that it is other\
    \ people who will use and maintain it without your input.\n\nExercise:\n\nRewrite\
    \ the following program statements using multi-line operators such as the \\\\\
    , \\[\\],() or {} to improve readability of the program statements.\n\na.    total=2+9+3+6+8+2+5+1+14+5+21+26+4+7+13+31+24"
  fmt: "\n## 变量命名规范\n\n### ii. 使用描述性名称\n编写变量时请使用描述性名称。例如，`number1` 作为变量名比 `yale` 或\
    \ `mything` 更具描述性。换句话说，我们可以用 `yale` 来存储 `number1` 的值，但该名称并不能直观地暗示我们在做什么。请记住编写程序时要假设其他人会维护它们。维护者应能在运行程序前快速弄清程序的用途。\n\
    \n### iii. 避免混淆字符\n为了避免混淆，请避免使用大写字母 `O`、小写字母 `l` 和大写字母 `I`，因为它们容易与数字混淆。换句话说，使用这些字母并不违反变量命名规则，但将它们作为变量名会导致混淆。\n\
    \n## 练习 1\n\n将以下变量名重写为 (1) 有效的变量名并 (2) 遵循变量命名约定。\n\na. `23doctor`\nb. `line1`\n\
    c. `Option3`\nd. `Mydesk`\ne. `#cup3`\n\n## 练习 2\n\n编写/建议 (1) 有效且 (2) 符合约定的变量名。\n\
    \na. 你想对三个数字求和。\nb. 你想存储四个学生的姓名。\nc. 你想存储医院里五位医生的姓名。\n\n## 总结\n\n变量是用户在编写和运行 Python\
    \ 程序之前指定的存储位置。变量名是这些存储位置的标签。变量根据情况保存值。例如，`doctor1` 可以是 Daniel、Brenda 或 Rita。`Patient1`\
    \ 可以是 Luke、William 或 Kelly。变量名的编写需遵循规则和约定。规则是强制的，而约定是可选但推荐的，因为它们有助于编写可读的变量名。编写程序时，应假设其他人会在没有你输入的情况下检查或运行它，因此代码应当规范。下一章将讨论变量。在编程中，声明变量意味着我们显式地说明变量的性质。变量可以声明为整数、长整数、短整数、浮点数、字符串或字符，包括其是局部可访问还是全局可访问。变量是一个根据条件改变值的存储位置。编写变量时请使用描述性名称。\n\
    \n## 变量类型\n\n现在我们已经定义了什么是变量以及编写变量名的规则，让我们探索不同类型的变量。\n\n### i. 数字\n\nPython 支持两种主要数字，即浮点数和整数。Python\
    \ 还支持复数。当你给一个数字赋值时，就会创建一个数字对象。例如：\n\n```\nnumber3 = 9\nnumber4 = 12\n```\n\n####\
    \ Python 支持的不同数值类型\n\n- **long**：例如 `681581903L`\n- **int**：例如 `11`、`123`、`-151`\n\
    - **float**：例如 `0.5`、`23.1`、`-54.2`\n- **complex**：例如 `4.12j`\n\n#### 练习\n\n识别下列数值的类型：\n\
    \na. `234`、`19`、`312`\nb. `4.56`、`2.9`、`9.3`\nc. `76189251468290127624471`\n\n\
    确定以下场景适用的数值类型：\n\nd. 薪资金额。\ne. 统计班级学生人数。\nf. 获取中国全国人口普查数字。\n\n### ii. 字符串\n\n\
    在 Python 中，单引号或双引号用于表示字符串。可以使用切片操作符 `[:]` 和 `[]` 获取字符串的子集，索引从字符串开头的 `0` 开始，到末尾的\
    \ `-1` 结束。字符串可以使用 `+`（加号）连接，称为连接操作符。星号 `*` 用作重复操作符。请记住编程中的计数从索引零（第一个值）开始！\n\n\
    ![字符串切片示意图](Images/image00229.gif)\n\n> **注意**：`#`（井号）用于表示单行注释。注释是关于特定代码行的描述性信息。运行程序时通常会忽略注释。在\
    \ Python 中，注释应写在 `#` 符号之后。注释能提高程序的可读性。\n\n#### 练习\n\n请键入/输入以下程序语句：\n\n```python\n\
    str = 'I think I am now a Programmer.'\n```\n\na. 编写一条程序语句以显示上述完整字符串/语句。\nb. 编写一条程序语句以显示从第二个字符到第六个字符的字符串内容。\n\
    c. 编写一条程序语句以显示上述完整字符串两次（使用 `*`）。\nd. 编写一条程序语句在上述语句末尾添加 \" of Python.\"。\n\n##\
    \ Python 关键字和标识符\n\n此时，你可能想知道为什么必须以那种方式使用 `print` 和 `str`，而没有自由或知识去了解为什么这些词必须以那种方式书写。`print`\
    \ 和 `str` 构成了一类特殊的词，它们必须始终以那种方式书写。每种编程语言都有一组关键字。在大多数情况下，某些关键字可在多种编程语言中找到。Python\
    \ 中的关键字区分大小写，意味着我们必须始终以小写形式输入它们。关键字不能用于命名函数（稍后解释）或变量名。\n\nPython 中有 33 个关键字，除\
    \ `None`、`False` 和 `True` 外均为小写。它们必须始终按下表所示书写：\n\n![Python 关键字列表](Images/image00230.gif)\n\
    \n> **注意**：`print()` 和 `str` 是函数，但它们是 Python 中的内置/预加载函数。函数是一组在调用时生效的规则和方法。例如，调用/激活\
    \ `print` 函数时将显示输出。此时你尚未遇到所有关键字，但会逐渐接触到它们。请花时间浏览、阅读并尝试回忆尽可能多的关键字。\n\n#### 练习\n\
    \n找出以下变量名的错误（需要回顾迄今所学内容）：\n\na. `for = 1`\nb. `yield = 3`\nc. `34ball`\nd. `m`\n\
    \n## 注释和语句\n\n### Python 语句\n\nPython 中的语句是指 Python 解释器可以处理/执行的指令。例如 `str = 'I\
    \ am a Programmer'` 和 `number1 = 3`。包含等号（`=`）的语句称为赋值语句。还有其他类型的语句，如 `if`、`while`\
    \ 和 `for`，将在后面处理。\n\n#### 练习\n\na. 编写一条 Python 语句，将第一个数字赋值为 `18`。\nb. 编写一条编程语句，将第二个数字赋值为\
    \ `21`。\nc. a 和 b 属于什么类型的语句？\n\n### 多行 Python 语句\n\n可以将一条语句分散在多行上。这种语句称为多行语句。编程语句的结束由换行符表示。要在\
    \ Python 中将语句分散到多行，我们使用反斜杠（`\\\\`），称为行续行字符。多行语句示例：\n\n```python\nsum = 3 + 6 +\
    \ 7 + \\\n      9 + 1 + 3 + \\\n      11 + 4 + 8\n```\n\n上述示例也称为显式行续行。在 Python\
    \ 中，方括号 `[]` 表示行续行，类似于圆括号 `()`，最后是大括号 `{}`。上例可重写为：\n\n```python\nsum = (3 + 6\
    \ + 7 +\n       9 + 1 + 3 +\n       11 + 4 + 8)\n```\n\n> **注意**：当我们使用圆括号时，去掉了反斜杠（`\\\
    \\`）行续行字符，因为圆括号承担了行续行字符 `\\\\` 的工作。\n\n**问题**：为什么需要多行语句？我们可以简单地写在单行上，程序语句也能正常运行。\n\
    \n**答案**：多行语句有助于改善整个程序的格式/可读性。请记住，编写程序时始终假设是其他人会在没有你输入的情况下使用和维护它。\n\n#### 练习\n\
    \n使用多行操作符（如 `\\\\`、`[]`、`()` 或 `{}`）重写以下程序语句，以提高程序语句的可读性。\n\na. `total = 2 + 9\
    \ + 3 + 6 + 8 + 2 + 5 + 1 + 14 + 5 + 21 + 26 + 4 + 7 + 13 + 31 + 24`\n"
  trans: "\n\n## 变量命名规范\n\n### ii. 使用描述性名称\n编写变量时请使用描述性名称。例如，`number1` 作为变量名比 `yale`\
    \ 或 `mything` 更具描述性。换句话说，我们可以用 `yale` 来存储 `number1` 的值，但该名称并不能直观地暗示我们在做什么。请记住编写程序时要假设其他人会维护它们。维护者应能在运行程序前快速弄清程序的用途。\n\
    \n### iii. 避免混淆字符\n为了避免混淆，请避免使用大写字母 `O`、小写字母 `l` 和大写字母 `I`，因为它们容易与数字混淆。换句话说，使用这些字母并不违反变量命名规则，但将它们作为变量名会导致混淆。\n\
