    \ 用于在 Python 中定义类。Python 类中的第一个字符串用于描述该类，尽管并非总是需要。\n\n### 示例 1\n\n1. 启动 IDLE。\n\
    2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```python\nclass Dog:\n    '''Briefly taking\
    \ about class Dog using this docstring'''\n    pass\n```\n\n### 示例 2\n\n1. 启动\
    \ IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```python\nclass Bright:\n    \"\
    My other class\"\n    b = 10\n\n    def salute(self):\n        print('Welcome')\n\
    \nprint(Bright.b)\nprint(Bright.salute)\nprint(Bright.__doc__)\n```\n\n## Python\
    \ 中的对象创建\n\n### 来自前一个类的示例\n\n打开包含类 `Bright` 的前一个程序文件：\n\n```python\nstudent1 =\
    \ Bright()\n```\n\n### 解释\n\n上述程序将创建对象 `student1`，一个新的实例。对象的属性可以通过特定的对象名前缀来访问。属性可以是方法或数据，包括匹配的类函数。换句话说，`Bright.salute`\
    \ 是一个函数对象，而 `student1.salute` 将是一个方法对象。\n\n### 示例\n\n1. 启动 IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n\
    3. 输入以下内容：\n\n```python\nclass Bright:\n    \"Another class again!\"\n    c =\
    \ 20\n\n    def salute(self):\n        print('Hello')\n\nstudent2 = Bright()\n\
    \nprint(Bright.salute)\nprint(student2.salute)\n\nstudent2.salute()\n```\n\n###\
    \ 解释\n\n尽管存在参数 `self`，我们仍调用了 `student2.salute()`，且无需传入参数即可正常工作。这种现象的原因是，每当对象调用其方法时，对象本身会作为第一个参数被传递。这意味着\
    \ `student2.salute()` 实际上转换为了 `student2.salute(student2)`。这就是 `self` 这个名称的由来。\n\
    \n## 构造函数\n\n1. 启动 IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```python\nclass\
    \ ComplexNumber:\n    def __init__(self, realnum=0, i=0):\n        self.real =\
    \ realnum\n        self.imaginarynum = i\n\n    def getData(self):\n        print(\"\
    {0}+{1}j\".format(self.real, self.imaginarynum))\n\ncomplex1 = ComplexNumber(2,\
    \ 3)\ncomplex1.getData()\n\ncomplex2 = ComplexNumber(5)\ncomplex2.attribute =\
    \ 10\nprint((complex2.real, complex2.imaginarynum, complex2.attribute))\n\n# complex1.attribute\
    \  # 这将引发 AttributeError\n```\n\n## 删除对象和属性\n\n`del` 语句用于在任何时候删除对象的属性。\n\n###\
    \ 示例\n\n1. 启动 IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```python\ncomplex1\
    \ = ComplexNumber(2, 3)\ndel complex1.imaginarynum\ncomplex1.getData()\n\ndel\
    \ ComplexNumber.getData\ncomplex1.getData()\n```\n\n## 删除整个对象\n\n### 示例\n\n1.\
    \ 启动 IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```python\ncomplex1 = ComplexNumber(1,\
    \ 3)\ndel complex1\n```\n\n### 解释\n\n当执行 `complex1 = ComplexNumber(1, 3)` 时，会在内存中生成一个新的对象实例，名称\
    \ `complex1` 与之绑定。对象不会立即被销毁，因为它会暂时保留在内存中，直到垃圾回收器将其从内存中清除。对象的清除有助于释放绑定在对象上的资源并提高系统效率。Python\
    \ 中的垃圾回收指的是对无引用对象的自动销毁。\n\n## Python 中的继承\n\n在 Python 中，继承允许我们指定一个类，该类从基类获取所有功能并添加更多功能。这是\
    \ OOP 的一项强大功能。\n\n### 语法\n\n```python\nclass ParentClass:\n    # 父类主体\n\nclass\
    \ ChildClass(ParentClass):\n    # 派生类主体\n```\n\n### 示例 1\n\n1. 启动 IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n\
    3. 输入以下内容：\n\n```python\nclass Shape:\n    def __init__(self, sides):\n      \
    \  self.sides = sides\n\n    def count_sides(self):\n        return self.sides\n\
    \nclass Rect_mine(Shape):\n    def __init__(self):\n        Shape.__init__(self,\
    \ 4)\n\n    def getArea(self):\n        s1, s2, s3, s4 = self.count_sides()\n\
    \        perimeter = (s1 + s2 + s3 + s4)\n        area = (s1 * s2)\n        print('The\
    \ rectangle area is: %s' % area)\n```\n\n### 示例 2\n\n```python\nr = Rect_mine()\n\
    r.inputSides()\n# Type b1 : 4\n# Type l1 : 8\n# Type b2 : 4\n# Type l1:    8\n\
    \nr.dispSides()\n# Type b1 is 4.0\n# Type l1 is 8.0\n# Type b2 is 4.0\n# Type\
    \ l1 is 8.0\n\nr.getArea()\n```\n\n## Python 中的方法重写\n\n当一个方法同时在基类和派生类中定义时，子类/派生类中的方法将覆盖父类/基类中的方法。在上述示例中，`Rect_mine`\
    \ 类中的 `__init__()` 方法将覆盖 `Shape` 类中的 `__init__()`。\n\n## 多重继承\n\n### 示例\n\n1.\
    \ 启动 IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n![多重继承示例](img/image00224.gif)\n\
    \n在这种情况下，`MultiInherit` 派生自类 `Parent1` 和 `Parent2`。\n\n## 多层继承\n\n从派生类继承称为多层继承。\n\
    \n### 示例\n\n1. 启动 IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```python\nclass\
    \ Parent:\n    pass\n\nclass Multilevel1(Parent):\n    pass\n\nclass Multilevel2(Multilevel1):\n\
    \    pass\n```\n\n### 解释\n\n`Multilevel1` 派生自 `Parent`，而 `Multilevel2` 派生自 `Multilevel1`。\n\
    \n## 方法解析顺序\n\n### 示例\n\n1. 启动 IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```python\n\
    print(issubclass(list, object))\nprint(isinstance(6.7, object))\nprint(isinstance(\"\
    Welcome\", object))\n```\n\n### 解释\n\n类中的特定属性将首先被扫描。搜索将继续延伸至父类。此搜索不会重复搜索同一个类两次。这种搜索的方法或顺序有时被称为\
    \ Python 中多重派生类的线性化。方法解析顺序 (MRO) 指的是确定此顺序所需的规则。\n\n## 运算符重载\n\n内置类可以使用运算符，而相同的运算符在不同类型上会表现出不同的行为。例如\
    \ `+` 运算符，根据上下文不同，会执行两个字符串的拼接、数字的算术加法或列表的合并。运算符重载是一项 OOP 特性，允许根据上下文赋予运算符不同的含义。\n\
    \n## 使类兼容内置特殊函数\n\n### 示例\n\n1. 启动 IDLE。\n2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\
    \n```python\nclass Planar:\n    def __init__(self, x_axis=0, y_axis=0):\n    \
    \    self.x_axis = x_axis\n        self.y_axis = y_axis\n\n    def __str__(self):\n\
    \        return \"({0},{1})\".format(self.x_axis, self.y_axis)\n\nplanar1 = Planar(3,\
    \ 5)\nprint(planar1)  # 输出将为 (3,5)\n```\n\n## 使用更多内置方法\n\n### 示例\n\n1. 启动 IDLE。\n\
    2. 导航至“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```python\nclass Planar:\n    def __init__(self,\
    \ x_axis=0, y_axis=0):\n        self.x_axis = x_axis\n        self.y_axis = y_axis\n\
    \nplanar1 = Planar(3, 5)\nstr(planar1)\nformat(planar1)\n```\n\n### 解释\n\n`__str__`\
    \ 方法允许 `str()` 和 `format()` 函数与自定义对象配合工作。\n"
