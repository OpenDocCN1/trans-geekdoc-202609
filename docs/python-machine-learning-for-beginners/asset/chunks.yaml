    \n## Python 中的目录\n\nPython 允许我们将多个文件整理到不同的目录中，以便于处理。Python 中文件和子目录的集合称为目录。Python\
    \ 中的 `os` 模块包含用于处理目录的方法。\n\n### 在 Python 中获取当前目录\n\n`getcwd()` 方法用于获取当前工作目录。该方法将以字符串形式返回当前工作目录。`getcwdb()`\
    \ 也用于获取目录（以字节形式）。\n\n### 更改目录\n\n`chdir()` 方法有助于修改现有目录。但是，我们打算创建的新路径应作为字符串参数给出。路径元素可以使用反斜杠\
    \ `\\` 或正斜杠 `/` 分隔。\n\n#### 示例\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\
    \n输入以下内容：\n\n```\nos.chdir('C:\\\\Tutorial')\nprint(os.getcwd())\n```\n\n####\
    \ 练习\n\n使用 `chdir()` 更改计算机上 Python 根文件夹中的一个目录。\n\n### 列出文件和目录\n\nPython 中的 `listdir()`\
    \ 方法用于确定目录中的所有文件和子目录。\n\n`listdir()` 方法接受一个路径并返回该特定路径下的文件列表和子目录。如果未指定路径，`listdir()`\
    \ 将从当前工作目录返回。\n\n#### 示例\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n\
    输入以下内容：\n\n```\nprint(os.getcwd())\n# C:\\Tutorial\nos.listdir()\nos.listdir('D:\\\
    \\')\n```\n\n### 创建新目录\n\n`mkdir()` 方法可用于创建新目录。该方法接受新目录的路径，如果未定义特定路径，将在当前工作目录中创建新目录。\n\
    \n```\nos.mkdir('week2')\nos.listdir()\n```\n\n## 在 Python 中重命名文件或目录\n\n在 Python\
    \ 中，`rename()` 方法用于重命名文件或目录。旧名称作为参数 1 给出，新名称作为参数 2 给出。\n\n### 示例\n\n启动 IDLE。\n\
    \n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n*(图片引用：`Images/image00210.gif`)*\n\
    \n### 练习\n\n使用 Python 方法创建一个目录并将其命名为 `Lesson`。使用 Python 方法将其重命名为 `Python Lessons`。\n\
    \n## 在 Python 中删除文件或目录\n\n`remove()` 方法用于在 Python 中删除文件。同样，`rmdir()` 用于删除空目录。\n\
    \n### 示例\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\n\
    os.listdir()\n# ['mine_direct']\nos.rmdir('mine_direct')\n```\n\n## 错误与异常\n\n\
    当 Python 解释器遇到错误时，它将引发异常。例如，用零除以一个数字将导致异常。\n\n### 错误示例\n\n启动 IDLE。\n\n导航到 **File**\
    \ 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\nif y < 3\n    if y < 3\n```\n\n在运行时，仍可能发生错误，例如当我们打开一个不存在的文件时。文件可能不存在是因为它已被重命名，而我们正使用旧名称访问它，或者该文件已被删除。该文件可能具有相同的名称但更改了文件扩展名。每当发生这些类型的运行时错误时，Python\
    \ 将创建一个异常对象。\n\n## Python 内置异常\n\nPython 有多个内置异常，当相关错误出现时会被标记。`dir()` 函数（可能是指\
    \ `local()`）可以帮助列出 Python 中所有的内置异常。\n\n*(图片引用：`Images/image00211.jpeg`)*\n\n##\
    \ Python 异常处理\n\n如果发生异常，程序的执行将停止，并将异常传递给调用进程进行处理。如果异常未被处理，程序将崩溃。\n\n**思考：** 你是否尝试过打开一个显示“应用已停止”的智能手机应用？你能想象一个程序因为找不到你试图附加的图片而崩溃吗？异常处理对于创建有效的程序以及安全性至关重要。你能想象如果黑客意识到你的程序每次无法加载图片就会崩溃并需要重启？黑客将有机可乘来破坏你的软件。幸运的是，异常处理允许我们预判并在程序遇到异常时给出一条出路。\n\
    \n## 在 Python 中通过捕获异常来处理异常\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\
    \n"
