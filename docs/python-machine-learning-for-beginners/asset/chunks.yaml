    \n### 在 Linux 操作系统中安装 Python\n\n![Linux 安装步骤](img/image00228.gif)\n\nv. 现在是时候发出指令在你的操作系统上运行源代码了。\n\
    \n### 在 Windows 操作系统中安装 Python\n\ni. 访问 Python 下载网站（推荐网站）并点击“Download Python 3.7.2”（版本可能与此处所述不同）。\n\
