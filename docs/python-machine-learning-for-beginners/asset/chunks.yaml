    \"\")\n```\n\n### Python 中的转义序列\n\n转义序列使我们能够格式化输出，以增强人类用户的清晰度。程序即使不使用转义序列也能成功运行，但输出对人类用户来说将非常令人困惑。以预期格式编写和显示输出是良好编程实践的一部分。以下是常用的转义序列。\n\
