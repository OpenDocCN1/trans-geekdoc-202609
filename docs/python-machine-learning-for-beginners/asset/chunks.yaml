    ```\n\n## Python Package\n\nFiles in Python hold modules and directories are stored\
    \ in packages. A single package in Python holds similar modules. Therefore, different\
    \ modules should be placed in different Python packages.\n\n# Data Types in Python\n\
    \n## ✓ Numbers\n\nAs mentioned earlier, Python accommodates floating, integer\
