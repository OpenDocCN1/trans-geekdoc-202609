    \ 文本编辑器免费且适合编写源代码（原始文本编程语句）。\n\n## 运行 Python 的方式\n\n现在，在我们开始运行第一个 Python 程序之前，了解我们可以如何运行\
    \ Python 程序很重要。运行、执行、部署或启动程序仅仅意味着我们让计算机处理指令/代码行。例如，如果代码行（程序）要求计算机显示某条消息，那么它就应该显示。以下是运行\
    \ Python 程序的方式或模式。解释器是在安装 Python 包时安装的一个特殊程序，它有助于将文本代码转换为计算机能够理解并执行的语言。\n\n###\
    \ 即时模式\n\n这是一种运行未写入文件的 Python 程序的方式。我们通过在命令行中输入单词 `python` 进入即时模式，这将触发解释器切换到即时模式。即时模式允许直接输入表达式，按回车键生成输出。下面的符号是\
    \ Python 提示符：\n\n```\n>>>\n```\n\nPython 提示符指示解释器接受用户输入。例如，输入 `2+2` 并按回车键将显示输出\
    \ `4`。在某种程度上，此提示符可用作计算器。如果你需要退出即时模式，请输入 `quit()` 或 `exit()`。\n"
