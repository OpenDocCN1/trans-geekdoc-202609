    \ within a program. It becomes easier for another person taking a look at a program\
    \ to have an idea of what the program does by reading the comments in it. Comments\
    \ are also useful to a programmer as one can forget the critical details of a\
    \ program written. The hash (`#`) symbol is used before writing a comment in Python.\
    \ The comment extends up to the newline character. The python interpreter normally\
    \ ignores comments. Comments are meant for programmers to understand the program\
    \ better.\n\n### Example\n\ni. Start IDLE\n\nii. Navigate to the File menu and\
    \ click New Window\n\niii. Type the following:\n\n```\n#This is my first comment\n\
    #The program will print Hello World\nPrint('Hello World') #This is an inbuilt\
    \ function to display\n```\n\niv. On the file, menu, click on Save. Type the name\
    \ of myProgram5.py\n\nNavigate to Run and click Run Module to run the program\n\
    \n### Exercise\n\nThis exercise integrates most of what we have covered so far.\n\
    \na. Write a program to sum two numbers 45, and 12 and include single line comments\
    \ at each line of code.\n\nb. Write a program to show the names of two employees\
    \ where the first employee is \"Daisy\" and the second employee is \"Richard.\"\
    \ Include single comments at each line of code.\n\nc. Write a program to display\
    \ the student registration numbers where the student names and their registration\
    \ are: `Yvonne=235`, `Ian=782`, `James=1235`, `Juliet=568`.\n\n## Multi-line Comments\n\
    \nJust like multi-line program statements we also have multi-line comments. There\
    \ are several ways of writing multi-line comments. The first approach is to type\
    \ the hash (`#`) at each comment line starting point.\n\n### Example\n\nStart\
    \ IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \n```\n#I am going to write a long comment line\n#the comment will spill over\
    \ to this line\n#and finally end here.\n```\n\nThe second way of writing multi-line\
    \ comments involves using triple single or double quotes: `'''` or `\"\"\"`. For\
    \ multi-line strings and multi-line comments in Python, we use the triple quotes.\
    \ Caution: When used in docstrings they will generate extra code, but we do not\
    \ have to worry about this at this instance.\n\n### Example:\n\nStart IDLE.\n\n\
    Navigate to the File menu and click New Window.\n\nType the following:\n\n```\n\
    \"This is also a great \nillustration of\na multi-line comment in Python.\"\n\
    ```\n\n## Python's Docstring\n\nIn Python, docstring refers to words offering\
    \ description and are written as the initial program statement in a function,\
    \ module, method, or class definition. (We will handle this later on). Docstrings\
    \ in Python are written using triple quotes.\n\n## Integrated Exercise\n\nThis\
    \ exercise will utilize several concepts that we covered earlier.\n\na. Given\
    \ the following program statement: `Color1='red'; color1='blue'; CoLor1='yellow'`\
    \ explain why all the three will be treated as different variables in Python.\n\
    \nb. Consider the following Python program and identify what is wrong with it.\n\
    \n```\nstudent1_age=23 #This is the age of the first student\nstudent2_age=19\
    \ #This is the age of the student\nsotal_age=student1_age +student2_age #Getting\
    \ the sum of the ages of the \nprint(age) #Displaying their ages\n```\n\nc. Rewrite\
    \ b. above to be a valid Python program\n\n## Operators (Basic) in Python\n\n\
    So far we have been using the summation (`+`) operator, and it also doubles up\
    \ as a concatenation operator (appending statements). However, we want to expand\
    \ our list of operators, and this leads us to basic operators in Python.\n\n###\
    \ Arithmetic Operators\n\nThe multiplication (`*`), division (`/`), subtraction\
    \ (`-`), and addition (`+`) are the arithmetic operators used to manipulate numbers.\n\
    \n### Exercise\n\nWrite the following programs and run it\n\na. Difference\n\n\
    ```\nnumber1=35 #declaring first number\nnumber2= 12 #declaring second number\n\
    difference=number2-number1 #declaring what the difference does\nprint(difference)\
    \ #Calling the print function to display what difference has\n```\n\nb. Multiplication\n\
    \n```\nnumber1=2 #declaring first number\nnumber2= 15 #declaring second number\n\
    product=number1*number2 #declaring what the product does\nprint(product) #Calling\
    \ the print function to display what product has\n```\n\nc. Division\n\n```\n\
    number1=10 #declaring first number\nnumber2= 50 #declaring second number\ndivision=number2/number1\
    \ #declaring what the division does\nprint(division) #Calling the print function\
    \ to display what product has\n```\n\n### Modulus\n\nThe modulus operator is used\
    \ to return the integer remainder after division. The modulus=`dividend%divisor`.\n\
    \n### Example\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\
    \nType the following:\n\n```\nnumber1=2 #declaring first number\nnumber2= 15 #declaring\
    \ second number\nremainder=number2%number1 #declaring what the remainder does\n\
    print(remainder) #Calling the print function to display remainder has\n```\n\n\
    ### Squaring and Cubing in Python\n\nSquaring a number: `number**2`\n\nCubing\
    \ a number: `number**3`\n\n### Example:\n\nStart IDLE.\n\nNavigate to the File\
    \ menu and click New Window.\n\nType the following:\n\n`Square of 3 in Python\
    \ will be 3**2`\n\n`Cube of 5 in Python will be 5**3`\n\n#### 1. Square of 3\n\
    \nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \n```\nnumber=3 #declaring variable number and assigning value 3\nsquare=number**2\n\
    print(square) #Calling the print function to display what square has\n```\n\n\
    #### 2. Cube of 5\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\
    \nType the following:\n\n```\nnumber=5 #declaring variable number and assigning\
    \ value 5\ncube=number**3\nprint(cube) #Calling the print function to display\
    \ what cube has\n```\n\n### Exercise\n\nUse python operators to write and run\
    \ a python program that finds the following:\n\na. Cube of 7\n\nb. Square of 15\n\
    \nc. Cube of 6\n\nd. Square of 11\n\ne. Cube of 8\n\nf. Square of 13\n\nNote:\
    \ We can still multiply 2 two times to get the square of 2. The reason for using\
    \ the square and cube operators is to help us write compact and efficient code.\
    \ Remember that the interpreter goes through each line including comments only\
    \ that it ignores comments. Using the cube and square operators helps compact\
    \ code and increase the efficiency of interpretation including troubleshooting\
    \ as well as human readability of the code.\n\n## Operators with String in Python\n\
    \nIn Python certain operators are used to help in concatenating strings. The addition\
    \ sign is used to concatenate strings in Python.\n\n### Example\n\nStart IDLE.\n\
    \nNavigate to the File menu and click New Window.\n"
  trans: "\nb. `count=13+1+56+3+7+9+5+12+54+4+7+45+71+4+8+5`\n\n分号也用于在单行中创建多条语句。假设我们要在\
    \ Python 程序中为四名员工赋值并显示年龄。程序可以写成：\n\n`employee1=25; employee2=45; employee3=32;\
    \ employee4=43.`\n\n## Python 中的缩进\n\n在 Python 中，缩进用于将程序行归类为一个代码块。Python 中使用的缩进量完全取决于程序员。但重要的是要确保一致性。按照惯例，使用四个空白字符进行缩进，而不是使用制表符。例如：\n\
    \n![](img/image00231.gif)\n\n注意：我们稍后将解释这是什么类型的程序。\n\nPython 中的缩进也有助于使程序看起来整洁清爽。缩进创造了一致性。但是，在执行行续行时可以忽略缩进。错误的缩进将导致缩进错误。没有缩进的正确\
    \ Python 程序仍然可以运行，但从人类可读性的角度来看，它们可能不够整洁和一致。\n\n## Python 中的注释\n\n编写 Python 程序，实际上编写任何编程语言时，注释都非常重要。注释用于描述程序内部发生的事情。通过阅读程序中的注释，另一个人查看程序时更容易了解程序的功能。注释对程序员也很有用，因为人们可能会忘记自己编写的程序的关键细节。在\
    \ Python 中，井号（`#`）符号用于注释之前。注释一直延伸到换行符。Python 解释器通常会忽略注释。注释旨在供程序员更好地理解程序。\n\n###\
    \ 示例\n\ni. 启动 IDLE\n\nii. 导航到“文件”菜单并点击“新建窗口”\n\niii. 输入以下内容：\n\n```\n#This is\
    \ my first comment\n#The program will print Hello World\nPrint('Hello World')\
    \ #This is an inbuilt function to display\n```\n\niv. 在“文件”菜单上，点击“保存”。输入名称 myProgram5.py\n\
    \n导航到“运行”并点击“运行模块”以运行程序\n\n### 练习\n\n本综合练习涵盖了迄今为止我们学习的大部分内容。\n\na. 编写一个程序来求两个数\
    \ 45 和 12 的和，并在每行代码处包含单行注释。\n\nb. 编写一个程序来显示两名员工的姓名，其中第一名员工是 \"Daisy\"，第二名员工是 \"\
    Richard\"。在每行代码处包含单行注释。\n\nc. 编写一个程序来显示学生注册号，其中学生姓名及其注册号为：`Yvonne=235`，`Ian=782`，`James=1235`，`Juliet=568`。\n\
    \n## 多行注释\n\n就像多行程序语句一样，我们也有多行注释。编写多行注释有几种方法。第一种方法是在每个注释行的起始点输入井号（`#`）。\n\n###\
    \ 示例\n\n启动 IDLE。\n\n导航到“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```\n#I am going to write\
    \ a long comment line\n#the comment will spill over to this line\n#and finally\
    \ end here.\n```\n\n编写多行注释的第二种方法涉及使用三个单引号或双引号：`'''` 或 `\"\"\"`。在 Python 中，对于多行字符串和多行注释，我们使用三引号。注意：当用于文档字符串时，它们会生成额外的代码，但我们目前不必担心这个问题。\n\
    \n### 示例：\n\n启动 IDLE。\n\n导航到“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```\n\"This is also\
    \ a great \nillustration of\na multi-line comment in Python.\"\n```\n\n## Python\
    \ 的文档字符串\n\n在 Python 中，文档字符串是指提供描述的文字，写在函数、模块、方法或类定义的初始程序语句中。（我们稍后将处理这个问题）。Python\
    \ 中的文档字符串使用三引号编写。\n\n## 综合练习\n\n本练习将利用我们之前介绍的几个概念。\n\na. 给定以下程序语句：`Color1='red';\
    \ color1='blue'; CoLor1='yellow'`，解释为什么在 Python 中这三个都将被视为不同的变量。\n\nb. 考虑以下 Python\
    \ 程序并找出其中的错误。\n\n```\nstudent1_age=23 #This is the age of the first student\n\
    student2_age=19 #This is the age of the student\nsotal_age=student1_age +student2_age\
    \ #Getting the sum of the ages of the \nprint(age) #Displaying their ages\n```\n\
    \nc. 重写上述 b 使其成为一个有效的 Python 程序\n\n## Python 中的运算符（基础）\n\n到目前为止，我们一直在使用求和（`+`）运算符，它也可以作为连接运算符（追加语句）。然而，我们想要扩展运算符列表，这引出了\
    \ Python 中的基本运算符。\n\n### 算术运算符\n\n乘法（`*`）、除法（`/`）、减法（`-`）和加法（`+`）是用于操作数字的算术运算符。\n\
    \n### 练习\n\n编写并运行以下程序\n\na. 求差\n\n```\nnumber1=35 #declaring first number\nnumber2=\
    \ 12 #declaring second number\ndifference=number2-number1 #declaring what the\
    \ difference does\nprint(difference) #Calling the print function to display what\
    \ difference has\n```\n\nb. 求积\n\n```\nnumber1=2 #declaring first number\nnumber2=\
    \ 15 #declaring second number\nproduct=number1*number2 #declaring what the product\
    \ does\nprint(product) #Calling the print function to display what product has\n\
    ```\n\nc. 求商\n\n```\nnumber1=10 #declaring first number\nnumber2= 50 #declaring\
    \ second number\ndivision=number2/number1 #declaring what the division does\n\
    print(division) #Calling the print function to display what product has\n```\n\
    \n### 取模运算\n\n取模运算符用于返回除法后的整数余数。取模 = `dividend%divisor`。\n\n### 示例\n\n启动 IDLE。\n\
    \n导航到“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```\nnumber1=2 #declaring first number\nnumber2=\
    \ 15 #declaring second number\nremainder=number2%number1 #declaring what the remainder\
    \ does\nprint(remainder) #Calling the print function to display remainder has\n\
    ```\n\n### Python 中的平方与立方\n\n求一个数的平方：`number**2`\n\n求一个数的立方：`number**3`\n\n###\
    \ 示例：\n\n启动 IDLE。\n\n导航到“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n`Square of 3 in Python\
    \ will be 3**2`\n\n`Cube of 5 in Python will be 5**3`\n\n#### 1. 3 的平方\n\n启动 IDLE。\n\
    \n导航到“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```\nnumber=3 #declaring variable number and\
    \ assigning value 3\nsquare=number**2\nprint(square) #Calling the print function\
    \ to display what square has\n```\n\n#### 2. 5 的立方\n\n启动 IDLE。\n\n导航到“文件”菜单并点击“新建窗口”。\n\
    \n输入以下内容：\n\n```\nnumber=5 #declaring variable number and assigning value 5\n\
    cube=number**3\nprint(cube) #Calling the print function to display what cube has\n\
    ```\n\n### 练习\n\n使用 Python 运算符编写并运行一个 Python 程序，求出以下内容：\n\na. 7 的立方\n\nb. 15 的平方\n\
    \nc. 6 的立方\n\nd. 11 的平方\n\ne. 8 的立方\n\nf. 13 的平方\n\n注意：我们仍然可以通过将 2 相乘两次来得到 2 的平方。使用平方和立方运算符的原因是帮助我们编写紧凑高效的代码。请记住，解释器会遍历每一行，包括注释，只是它会忽略注释。使用立方和平方运算符有助于压缩代码，并提高解释效率，包括故障排除以及代码的人类可读性。\n\
    \n## Python 中的字符串运算符\n\n在 Python 中，某些运算符用于帮助连接字符串。加号用于在 Python 中连接字符串。\n\n###\
    \ 示例\n\n启动 IDLE。\n\n导航到“文件”菜单并点击“新建窗口”。\n\n"
