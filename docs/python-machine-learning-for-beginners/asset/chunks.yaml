- raw: "If the year 2017 was probably the cusp of Artificial Intelligence fear mongering\
    \ and hype (as I mentioned in [last year’s answer](https://www.quora.com/What-are-the-most-significant-machine-learning-advances-in-2017/answer/Xavier-Amatriain)),\
    \ 2018 seems to have been the year where we have started to all cool down a bit.\
    \ While it is true that some figures have continued to push their message of AI\
    \ fear, they have probably been too busy with other issues to make of this an\
    \ important point of their agenda. At the same time, it seems like the press and\
    \ others have come to peace with the idea that while self-driving cars and similar\
    \ technologies are coming our way, they won’t happen tomorrow. That being said,\
    \ there are still voices defending a bad idea that [we should regulate AI](https://www.theverge.com/2017/7/17/15980954/elon-musk-ai-regulation-existential-threat)\
    \ instead of focusing on regulating its outcomes.\n\nIt is good to see that this\
    \ year though, the focus seems to have shifted to more concrete issues that can\
    \ be addressed. For example, there has been a lot of talk around fairness, and\
    \ there are not only several conferences on the topic (see [FATML](http://www.fatml.org/)\
    \ or [ACM FAT](https://fatconference.org/)) even some online courses like [this\
    \ one](https://www.blog.google/technology/ai/new-course-teach-people-about-fairness-machine-learning/amp/)\
    \ by Google.\n\nGeneration Unlimited \n\nAlong these lines, other issues that\
    \ have been greatly discussed this year include interpretability, explanations,\
    \ and causality. Starting with the latter, causality seems to have made it back\
    \ to the spotlight mostly because of the publication of Judea Pearl’s “The Book\
    \ of Why.” Not only did the author decided to write his first “generally accessible”\
    \ book, but he also took to twitter to popularize discussions around causality.\
    \ Even the popular press has written about this as being a “challenge” to existing\
    \ Artificial Intelligence approaches (see this [article in The Atlantic](https://www.theatlantic.com/technology/archive/2018/05/machine-learning-is-stuck-on-asking-why/560675/?single_page=true),\
    \ for example). Even the best paper award at the ACM Recsys conference went to\
    \ a paper that addressed the issue of how to include causality in embedding. That\
    \ being said, many other authors have argued that causality is somewhat of a theoretical\
    \ distraction, and we should focus again on more concrete issues like interpretability\
    \ or explanations. Speaking of explanations, one of the highlights in this area\
    \ might be the publication of the paper and code for [Anchor](https://github.com/marcotcr/anchor),\
    \ a follow up to the well-known [LIME](https://homes.cs.washington.edu/~marcotcr/blog/lime/)\
    \ model by the same authors.\n\nWhile there are still questions about the Deep\
    \ Learning as the most general AI paradigm (count me in with those raising questions),\
    \ while we continue to skim over the nth iteration of the discussion about this\
    \ between Yann LeCun and Gary Marcus, it is clear that Deep Learning is not only\
    \ here to stay, but it is still far from having reached a plateau in terms of\
    \ what it can deliver. More concretely, during this year Deep Learning approaches\
    \ have shown unprecedented success in fields different from Vision, ranging from\
    \ Language to Healthcare.\n\nIt is probably in the area of NLP, where we have\
    \ seen the most interesting advances this year. If I had to choose the most impressive\
    \ AI applications of the year, both of them would be NLP (and both come from Google).\
    \ The first one is [Google’s super useful smart compose](https://ai.googleblog.com/2018/05/smart-compose-using-neural-networks-to.html?m=1),\
    \ and the second one is their [Duplex](https://ai.googleblog.com/2018/05/duplex-ai-system-for-natural-conversation.html)\
    \ dialog system.\n\nA lot of those advances have been accelerated by the idea\
    \ of using language models, popularized this year. We have then seen other (and\
    \ improved) approaches like Allen’s [ELMO](https://arxiv.org/abs/1802.05365),\
    \ [Open AI’s transformers](https://blog.openai.com/language-unsupervised/), or,\
    \ more recently Google’s [BERT](https://github.com/google-research/bert), which\
    \ beat many SOTA results out of the gate. These models have been described as\
    \ the “Imagenet moment for NLP” since they show the practicality of transfer learning\
    \ in the language domain by providing ready-to-use pre-trained and general models\
    \ that can also be fine-tuned for specific tasks. Besides language models, there\
    \ have been plenty of other interesting advances like [Facebooks multilingual\
    \ embedding](https://code.fb.com/ml-applications/under-the-hood-multilingual-embeddings/),\
    \ to name another one. It is interesting to note that we have also seen how quickly\
    \ these and other approaches have been integrated into more general NLP frameworks\
    \ such as [AllenNLP’s](https://github.com/allenai/allennlp/releases/tag/v0.7.2)\
    \ or Zalando’s [FLAIR](https://github.com/zalandoresearch/flair).\n\nSpeaking\
    \ of frameworks, this year the “war of the AI frameworks” has heated up. Surprisingly,\
    \ Pytorch seems to be catching up to TensorFlow just as [Pytorch 1.0 was announced](https://developers.facebook.com/blog/post/2018/05/02/announcing-pytorch-1.0-for-research-production/).\
    \ While the situation around using Pytorch in production is still sub-optimal,\
    \ it seems like Pytorch is catching up on that front faster than Tensor Flow is\
    \ catching up on usability, documentation, and education. Interestingly it is\
    \ likely that the choice of Pytorch as the framework on which to implement the\
    \ [Fast.ai](http://fast.ai/) library has played a big role. That being said, Google\
    \ is aware of all of this and is pushing in the right direction with the [inclusion\
    \ of Keras](https://www.tensorflow.org/guide/keras) as a first-class citizen in\
    \ the framework or the addition of key developer-focused leaders like [Paige Bailey](https://dynamicwebpaige.github.io/info/).\
    \ In the end, we all benefit from having access to all these great resources,\
    \ so keep them coming!\n\nInterestingly, another area that has seen a lot of interesting\
    \ developments in the framework space is reinforcement learning. \n\nWhile I don’t\
    \ think RL research advances have been as impressive as in previous years (only\
    \ the recent [Impala](https://arxiv.org/pdf/1802.01561.pdf) work by DeepMind comes\
    \ to mind), it is surprising to see that in a single year we have seen all major\
    \ Artificial Intelligence players publish an RL Framework. Google published the\
    \ [Dopamine framework](https://github.com/google/dopamine) for research while\
    \ Deepmind (also inside of Google) published the somewhat competing [TRFL](https://deepmind.com/blog/trfl/)\
    \ framework. Facebook could not stay behind and published [Horizon](https://research.fb.com/publications/horizon-facebooks-open-source-applied-reinforcement-learning-platform/)\
    \ while Microsoft published [TextWorld](https://www.microsoft.com/en-us/research/blog/textworld-a-learning-environment-for-training-reinforcement-learning-agents-inspired-by-text-based-games/?OCID=msr_blog_textworld_icml_tw),\
    \ which is more specialized for text-based training agents. Hopefully, all of\
    \ this open source goodness will help us see a lot of RL advances in 2019.\n\n\
    Just to finish up on the front of the framework, I was happy to see that Google\
    \ recently published [TFRank](https://ai.googleblog.com/2018/12/tf-ranking-scalable-tensorflow-library.html)\
    \ on top of Tensor Flow. The ranking is an extremely important ML application\
    \ that is probably getting less love than it deserves lately.\n\nIt might seem\
    \ like Deep learning has ultimately removed the need to be smart about your data,\
    \ but that is far from true. "
