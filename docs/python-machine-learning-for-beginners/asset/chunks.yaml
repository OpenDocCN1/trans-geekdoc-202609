    # Type Conversion and Type Casting in Python


    Type Conversion refers to the process of changing the value of one programming
    data type to another programming data type. Think of dividing two integers that
    lead to decimal numbers. In this case, it is necessary to convert force the conversion
    of an integer into a float number. Python has two types of conversion: implicit
    type conversion and explicit conversion.


    ## i. Implicit Conversion Type


    In this case, Python automatically changes one data type to another data type,
    and the process does not require user involvement. Implicit type conversion is
    mainly used with the intent of avoiding data loss.


    ### Example: Converting Integer to Float


    Start IDLE. Navigate to the File menu and click New Window. Type the following:


    ```python

    number_int = 451

    number_flo = 4.51

    number_new = number_int + number_flo

    print("the type of data of number_int-", type(number_int))

    print("the type of data of number_flo-", type(number_flo))

    print("value of number_new-", number_new)

    print("type of data of number_new-", type(number_new))

    ```


    **Explanation**


    The programming is adding two variables one of data type integer and the other
    float and storing the value in a new variable of data type float. Python automatically
    converts small data types into larger data types to avoid prevent data loss. This
    is known as implicit type conversion.


    **Important**


    Python cannot, however, convert numerical data types into string data type or
    string data type into numerical data type implicitly. Attempting such a conversion
    will generate an error.


    ### Example


    Start IDLE. Navigate to the File menu and click New Window. Type the following:


    ```python

    number_int = 432      # lower data type

    number_str = "241"    # higher data type

    print("The type of data of number_int-", type(number_int))

    print("The type of data of number_str-", type(number_str))

    print(number_int + number_str)

    ```


    **Challenge**: Can you guess why this is occurring? Python interpreter is unable
    to understand whether we want concatenation or addition precisely. When it assumes
    the concatenation, it fails to locate the other string. When it assumes the addition
    approach, it fails to locate the other number. The solution to the error above
    is to have an explicit type conversion.


    ## ii. Explicit Conversion


    Here, programmers convert the data type of a named programming object to the needed
    data type. Explicit conversion is attained through the functions `float()`, `int()`,
    and `str()` among others.


    The syntax for the specific or explicit conversion is:


    ```text

    (needed_datatype) (expression)

    ```


    ### Illustration: Summing of a string and integer using by using explicit conversion


    Start IDLE. Navigate to the File menu and click New Window. Type the following:


    ```python

    number_int = 431

    number_str = "231"

    print("Type of data of number_int-", type(number_int))

    print("Type of data number_str prior to Type Casting-", type(number_str))

    number_str = int(number_str)

    number_sum = number_int + number_str

    print("Addition of number_int and number_str-", number_sum)

    print("Type of data of the sum-", type(number_sum))

    ```


    **Note**: Running this program will display the data types and sum and display
    an integer and string.


    **Explanation**


    In the above program, we added `number_str` and `number_int` variable. We then
    converted `number_str` from string (higher data type) to integer (lower data type)
    type using `int()` function to perform the summation. Python manages to add the
    two variables after converting `number_str` to an integer value. The `number_sum`
    value and data type are an integer data type.


    ### Recap


    The conversion of the object from one data type to another data type is known
    as type conversion. The python interpreter automatically performs implicit type
    conversion. Implicit type conversion intends to enable Python to avoid data loss.
    Typecasting or explicit conversion happens when the data types of object are converted
    using the predefined function by the programmer. Unlike implicit conversion, typecasting
    can lead to data loss as we enforce the object to a particular data type.


    The previous explicit conversion/typecasting can be written as:


    Start IDLE. Navigate to the File menu and click New Window. Type the following:


    ```python

    number_int = 431              # int data type

    number_str = "231"            # string data type

    number_str = int(number_str)  # int function converting string into int data type

    number_sum = number_int + number_str  # variable number_sum

    print("Addition of number_int and number_str-", number_sum)

    ```


    **Note**: Explicit conversion/Type casting requires some practice to master, but
    it is easy.


    The trick is here:


    ```text

    the variable name to convert = predefined function for the desired data type (variable
    name to convert)

    ```


