- raw: "## if…else Flow Control\n\nThe if..else statement in Python is a decision\
    \ making when executing the program. The if…else statement will ONLY execute code\
    \ if the specified condition exists. \n\nThe syntax of if…else in Python\n\nif\
    \ test expression:\n\nStatement(s)\n\nExplanation\n\nThe python program will only\
    \ execute the statements(s) if the test expression is True. The program first\
    \ evaluates the test expression before executing the statement(s). The program\
    \ will not execute the statement(s) if the test expression is False. By convention,\
    \ the body of it is marked by indentation while the first is not indented line\
    \ signals the end.\n\nChallenge: Think of scenarios, real-life, where the if…else\
    \ condition is required. \n\n•    If you have not enrolled for a course, then\
    \ you cannot sit for the exam else sit for the exam.\n\n•    If you have paid\
    \ for house rent then you will be issued with acknowledgment receipt else request\
    \ for more time.\n\n•    If you are a licensed driver then you can drive to school\
    \ else you hire a taxi.\n\n•    If you are tired then you can watch movies else\
    \ can complete the essay.\n\n•    If you are an ethical person then you will acknowledge\
    \ your mistake else you will overlook the damage caused.\n\n•    If you are committed\
    \ to programming then you will practice daily else you will lose interest.\n\n\
    •    If you have signed for email alerts you will be updated frequently else you\
    \ will have to check the website daily.\n\n•    If you plead guilty to all accounts\
    \ you are likely to be convicted else the merit of your case will depend on cross-examination\
    \ of witnesses and evidence presented.\n\nNote: When we use the if statement alone\
    \ without the else part, it will only print/display if the condition is true,\
    \ it will not cater for the alternative, the case where the first condition is\
    \ not present.\n\nExample 1\n\nStart IDLE.\n\nNavigate to the File menu and click\
    \ New Window.\n\nType the following:\n\nnumber=5\n\nif number>0            #The\
    \ comparison operator\n\n    print(number, “The number is a positive number”)\n\
    \nExplanation\n\nThe program contains the if the condition that tests if the given\
    \ number satisfies the if condition, “is it greater than 0” since 5 is greater\
    \ than zero, the condition is satisfied the interpreter is allowed to execute\
    \ the next statement which is to extract and display the numerical value including\
    \ the string message. The test condition in this program is “number>0. But think\
    \ of when the condition is not met, what happens? Let us look at Example 2.\n\n\
    Example 2\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\n\
    Type the following:\n\nnumber=-9\n\nif number>0:\n\n   print(number, “This is\
    \ a positive number”)\n\nExplanation\n\nThe program contains only the if statement\
    \ which tests the expression by testing of -9 is greater than zero since it is\
    \ not the interpreter will not execute the subsequent program code lines.  In\
    \ real life, you will want to provide for an alternate in case the first condition\
    \ is not met. This program will not display anything when executed because the\
    \ if condition has not been met. The test condition in this program is “number>0.\n\
    \nExercise: Write programs in Python using if statement only to perform the following:\n\
    \na.    Given number=7, write a program to test and display only even numbers.\n\
    \nb.    Given number1=8, number2=13, write a program to only display if the sum\
    \ is less than 10.\n\nc.    Given count\\_int=57, write a program that tests if\
    \ the count is more than 45 and displays, the count is above the recommended number.\n\
    \nd.    Given marks=34, write a program that tests if the marks are less than\
    \ 50 and display the message, the score is below average.\n\ne.    Given marks=78,\
    \ write a program that tests if the marks are more than 50 and display the message,\
    \ great performance.\n\nf.    Given number=88, write a program that tests if the\
    \ number is an odd number and displays the message, Yes it is an odd number.\n\
    \ng.    Given number=24, write a program that tests and displays if the number\
    \ is even.\n\nh.    Given number =21, write a program that tests if the number\
    \ is odd and displays the string, Yes it is an odd number.\n\nNote The execution\
    \ of statements after the if expression will only happen where the if the expression\
    \ evaluates to True, otherwise the statements are ignored.\n\nif…else Statement\
    \ in Python\n\nThe if…else syntax\n\nif test condition:\n\n    Statements \n\n\
    else:\n\n    Statements \n\nThe explanation the if statement, the if…else statement\
    \ will execute the body of if in the case that the tests condition is True. Should\
    \ the if…else tests expression evaluate to false, the body of the else will be\
    \ executed? Program blocks are denoted by indentation. The if…else provides more\
    \ maneuverability when placing conditions on the code.\n\nExample\n\nA program\
    \ that checks whether a number is positive or negative\n\nStart IDLE.\n\nNavigate\
    \ to the File menu and click New Window.\n\nType the following:\n\nnumber\\_mine=-56\n\
    \nif(number<0):\n\n    print(number\\_mine, “The number is negative”)\n\nelse:\n\
    \n   print(number\\_mine, “The number is a positive number”)\n\nExercise\n\nWrite\
    \ a Python program that uses if..else flow control to perform the following\n\n\
    a.    Given number=9, write a program that tests and displays whether the number\
    \ is even or odd.\n\nb.    Given marks=76, write a program that tests and displays\
    \ whether the marks are above pass mark or not bearing in mind that the pass mark\
    \ is 50.\n\nc.    Given number=78, write a program that tests and displays whether\
    \ the number is even or odd.\n\nd.    Given marks=27, write a program that tests\
    \ and displays whether the marks are above pass mark or not bearing in mind that\
    \ the pass mark is 50.\n\nChallenge: Write a program that accepts age input from\
    \ the user, explicitly coverts the age into integer data types, then uses if…else\
    \ flow control to tests whether the person is underage or not, the legal age is\
    \ 21. Include comments and indentation to improve the readability of the program.\n\
    \nif…elif…else Flow Control Statement in Python\n\nNow think of scenarios where\
    \ we need to evaluate multiple conditions, not just one, not just two but three\
    \ and more. Think of where you have to choose team member, if not Richard, then\
    \ Mercy, if not Richard and Mercy then Brian, if not Richard, Mercy, and Brian\
    \ then Yvonne. Real-life scenarios may involve several choices/conditions that\
    \ have to be captured when writing a program.\n\n![](Images/image00232.gif)\n\n\
    Remember that the elif simply refers to else if and is intended to allow for checking\
