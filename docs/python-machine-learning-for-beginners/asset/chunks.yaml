    \n```\nlocal\n```\n\n## Python’s Global and Local Variable\n\nUsing both local\
    \ and global variables in the same code.\n\n### Example\n\nStart IDLE.\n\nNavigate\
    \ to the **File** menu and click **New Window**.\n\nType the following:\n\n```\n\
    y = \"global\"\n\ndef foo():\n    global y\n    x = \"local\"\n    y = y * 2\n\
    \    print(y)\n    print(x)\n\nfoo()\n```\n\n### Explanation\n\nThe output of\
    \ the program will be:\n\n```\nglobalglobal\nlocal\n```\n\nWe declared `y` as\
    \ a global variable and `x` as a local variable in `foo()`. The `*` operator is\
    \ used to modify the global variable `y` and finally, we printed both `y` and\
    \ `x`.\n\n## Local and Global Variables with the same name\n\nStart IDLE.\n\n\
    Navigate to the **File** menu and click **New Window**.\n\nType the following:\n\
    \n```\ny = 6\n\ndef foo():\n    y = 11\n    print(\"Local variable y-\", y)\n\n\
    foo()\nprint(\"Global variable y-\", y)\n```\n\n# Python’s Nonlocal Variables\n\
    \nA Python nonlocal variable is used in a nested function whose local scope is\
    \ unspecified. It is neither global nor local scope.\n\n## Example\n\nCreating\
    \ a nonlocal variable.\n\nStart IDLE.\n\nNavigate to the **File** menu and click\
    \ **New Window**.\n\nType the following:\n\n```\ndef outer():\n    y = \"local\
    \ variable\"\n    def inner():\n        nonlocal y\n        y = \"nonlocal variable\"\
    \n        print(\"inner:\", y)\n    inner()\n    print(\"outer scope:\", y)\n\n\
    outer()\n```\n\n# Global Keyword in Python\n\nThe `global` keyword in Python allows\
    \ modification of the variable outside the current scope. The `global` keyword\
    \ makes changes to the variable in a local context. There are rules when creating\
    \ a global keyword:\n\n- A global keyword is local by default when we create a\
    \ variable within a function.\n- It is global by default when we define a variable\
    \ outside of a function and you do not need to use the `global` keyword.\n"
  trans: "\n\n# Python 函数中的变量作用域与生命周期\n\n在 Python 函数内部定义的变量和参数具有局部作用域，这意味着它们从外部不可见。在\
    \ Python 中，变量的生命周期在函数执行期间有效，即变量在内存中存在的整个时期。函数返回时会销毁函数变量。\n\n## 示例\n\n启动 IDLE。\n\
    \n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\ndef function_my():\n \
    \   marks = 15\n    print(\"The value inside the function is:\", marks)\n\nmarks\
    \ = 37\nfunction_my()\nprint(\"The value outside the function is:\", marks)\n\
    ```\n\n# 函数类型\n\n它们大致分为用户定义函数和内置函数。内置函数是 Python 解释器的一部分，而用户定义函数由用户指定。\n\n## 练习\n\
    \n给出 Python 中三个内置函数的例子。\n\n# 函数参数\n\n调用函数需要传递正确数量的参数；否则，解释器将生成错误。\n\n## 说明\n\n\
    启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\ndef salute(name,\
    \ message):\n    \"\"\"This function welcomes the student with the provided message\"\
    \"\"\n    print(\"Welcome\", name + ', ' + message)\n\nsalute(\"Brenda\", \"Lovely\
    \ Day!\")\n```\n\n> **Note:** 函数 `salute()` 有两个参数。因为我们传入了两个实参，所以不会报错。让我们尝试只传一个实参调用函数，看看会发生什么：\n\
    \n```\nsalute(\"Brenda\")  # only one argument passed\n```\n\n运行此程序将生成一个错误，提示\
    \ `TypeError: salute() missing 1 required positional argument`。不传任何实参调用函数时也会发生同样的情况。\n\
    \n## 示例 2\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\n\
    salute()\n```\n\n解释器将生成错误 `TypeError: salute() missing 2 required positional arguments`。\n\
    \n# Python 中的关键字参数\n\nPython 提供了一种使用关键字参数调用函数的方式。使用关键字参数调用函数时，参数的顺序可以改变。函数的值按位置与参数逐一匹配。\n\
    \n> **Note:**\n> 在前面的示例中，函数 `salute` 作为 `salute(\"Brenda\", \"Lovely Day!\")`\
    \ 调用时，将值 `\"Brenda\"` 赋给参数 `name`，将 `\"Lovely Day!\"` 赋给 `message`。\n\n## 使用关键字调用函数\n\
    \n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\nsalute(name=\"\
    Brenda\", message=\"Lovely Day!\")\n```\n\n## 关键字不按顺序排列\n\n```\nsalute(message=\"\
    Lovely Day!\", name=\"Brenda\")\n```\n\n# 任意参数\n\n有时我们可能不知道需要传入函数的所有参数。\n\n**类比：**\
    \ 假设你正在编写一个程序来欢迎本学期所有的新生。在这种情况下，你不知道会有多少人报到。\n\n## 示例\n\n启动 IDLE。\n\n导航到 **File**\
    \ 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\ndef welcome(*names):\n    \"\"\"This\
    \ welcome function salutes all students in the names tuple.\"\"\"\n    for name\
    \ in names:\n        print(\"Welcome\", name)\n\nwelcome(\"Lucy\", \"Richard\"\
    , \"Fridah\", \"James\")\n```\n\n程序的输出将是：\n\n```\nWelcome Lucy\nWelcome Richard\n\
    Welcome Fridah\nWelcome James\n```\n\n# Python 中的递归\n\n用其自身来定义某事物称为递归。递归函数会调用其自身。\n\
    \n## 示例\n\n计算整数阶乘的 Python 程序。\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\
    \n输入以下内容：\n\n```\ndef factorial(n):\n    if n == 1:\n        return 1\n    else:\n\
    \        return n * factorial(n - 1)\n\nprint(factorial(5))\n```\n\n## 练习\n\n\
    编写一个 Python 程序来求 7 的阶乘。\n\n# Python 匿名函数\n\n某些函数可以不指定名称；这些称为匿名函数。`lambda` 关键字用于表示匿名函数。在\
    \ Python 中，匿名函数也称为 lambda 函数。\n\n## 语法\n\n```\nlambda arguments: expression\n\
    ```\n\nLambda 函数必须始终包含一个表达式，但可以有多个参数。\n\n## 示例\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击\
    \ **New Window**。\n\n输入以下内容：\n\n```\ndouble = lambda y: y * 2\n# Output: 10\n\
    print(double(5))\n```\n\n## 示例 2\n\n我们可以使用内置函数如 `filter()` 和 `lambda` 来显示列表/元组中的偶数。\n\
    \n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\nfirst_marks\
    \ = [3, 7, 14, 16, 18, 21, 13, 32]\nfresh_marks = list(filter(lambda n: (n % 2\
    \ == 0), first_marks))\n# Output: [14, 16, 18, 32]\nprint(fresh_marks)\n```\n\n\
    `lambda` 函数和 `map()` 可用于将列表中的各项加倍。\n\n## 示例 3\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击\
    \ **New Window**。\n\n输入以下内容：\n\n```\nfirst_score = [3, 7, 14, 16, 18, 21, 13,\
    \ 32]\nfresh_score = list(map(lambda m: m * 2, first_score))\n# Output: [6, 14,\
    \ 28, 32, 36, 42, 26, 64]\nprint(fresh_score)\n```\n\n# Python 的 Global、Local\
    \ 和 Nonlocal\n\n## Python 的全局变量\n\n在 Python 中，函数外部声明的变量称为全局变量。它们在全局作用域中声明。全局变量可以在函数内部或外部访问。\n\
    \n### 示例\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\n\
    y = \"global\"\n\ndef foo():\n    print(\"y inside the function :\", y)\n\nfoo()\n\
    print(\"y outside the function:\", y)\n```\n\n### 解释\n\n在上图中，`y` 是一个全局变量，并被定义为\
    \ `foo()` 以打印全局变量 `y`。当我们调用 `foo()` 时，它将打印 `y` 的值。\n\n## 局部变量\n\n局部变量是在函数体内或局部作用域中声明的。\n\
    \n### 示例\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\n\
    def foo():\n    x = \"local\"\n\nfoo()\nprint(x)\n```\n\n### 解释\n\n运行此程序将生成一个错误，提示\
    \ `x` 未定义。错误发生的原因是我们试图在全局作用域中访问局部变量 `x`，而 `foo()` 函数仅在局部作用域中有效。\n\n## 在 Python\
    \ 中创建局部变量\n\n### 示例\n\n通过在函数内声明变量来创建局部变量。\n\n```\ndef foo():\n    x = \"local\"\
    \n    print(x)\n\nfoo()\n```\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\
    \n输入以下内容：\n\n```\ndef foo():\n    x = \"local\"\n    print(x)\n\nfoo()\n```\n\n\
    ### 解释\n\n当我们执行代码时，输出将是：\n\n```\nlocal\n```\n\n## Python 的全局变量和局部变量\n\n在同一代码中同时使用局部变量和全局变量。\n\
    \n### 示例\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\n\
    y = \"global\"\n\ndef foo():\n    global y\n    x = \"local\"\n    y = y * 2\n\
    \    print(y)\n    print(x)\n\nfoo()\n```\n\n### 解释\n\n程序的输出将是：\n\n```\nglobalglobal\n\
    local\n```\n\n我们将 `y` 声明为全局变量，将 `x` 声明为 `foo()` 中的局部变量。`*` 运算符用于修改全局变量 `y`，最后我们打印了\
    \ `y` 和 `x`。\n\n## 同名的局部变量和全局变量\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\
    \n输入以下内容：\n\n```\ny = 6\n\ndef foo():\n    y = 11\n    print(\"Local variable\
    \ y-\", y)\n\nfoo()\nprint(\"Global variable y-\", y)\n```\n\n# Python 的 Nonlocal\
    \ 变量\n\nPython nonlocal 变量用于嵌套函数，其局部作用域未指定。它既不是全局也不是局部作用域。\n\n## 示例\n\n创建一个 nonlocal\
    \ 变量。\n\n启动 IDLE。\n\n导航到 **File** 菜单并点击 **New Window**。\n\n输入以下内容：\n\n```\ndef\
    \ outer():\n    y = \"local variable\"\n    def inner():\n        nonlocal y\n\
    \        y = \"nonlocal variable\"\n        print(\"inner:\", y)\n    inner()\n\
    \    print(\"outer scope:\", y)\n\nouter()\n```\n\n# Python 中的 Global 关键字\n\n\
    Python 中的 `global` 关键字允许修改当前作用域之外的变量。`global` 关键字在局部上下文中对变量进行更改。创建 global 关键字时有以下规则：\n\
    \n- 当我们在函数内部创建变量时，global 关键字默认为局部。\n- 当我们在函数外部定义变量时，它默认为全局，你不需要使用 `global` 关键字。\n\
    \n"
