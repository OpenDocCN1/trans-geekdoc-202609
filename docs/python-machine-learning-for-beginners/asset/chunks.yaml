    \n```python\nimport config\nimport update\n\nprint(config.x)\nprint(config.y)\n\
    ```\n\n**解释**\n\n运行 `main.py` 文件将输出：\n\n```\n11\nToday\n```\n\n## Python 模块\n\n\
    模块由定义和程序语句组成。\n\n例如，名为 `config.py` 的文件即被视为一个模块。该模块的名称为 `config`。模块有助于将大型程序拆分为更小、更易管理且结构更清晰的文件，同时也促进了代码的复用性。\n\
    \n### 示例：创建第一个模块\n\n启动 IDLE。\n\n导航至“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```python\n\
    def add(x, y):\n    \"\"\"This is a program to add two\n    numbers and return\
    \ the outcome\"\"\"\n    outcome = x + y\n    return outcome\n```\n\n## 模块导入\n\
    \n关键字 `import` 用于导入模块。\n\n### 示例\n\n```python\nimport first\n```\n\n只要我们知道模块的名称，点运算符就能帮助我们访问其中的函数。\n\
    \n### 示例\n\n启动 IDLE。\n\n导航至“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```python\nfirst.add(6,\
    \ 8)\n```\n\n**解释**\n\n## Python 中的 `import` 语句\n\n`import` 语句可用于通过点运算符访问模块内的定义。\n\
    \n### 示例\n\n启动 IDLE。\n\n导航至“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```python\nimport math\n\
    \nprint(\"The PI value is\", math.pi)\n```\n\n### 重命名导入\n\n**示例**\n\n启动 IDLE。\n\
    \n导航至“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```python\nimport math as h\n\nprint(\"The\
    \ PI value is-\", h.pi)\n```\n\n**解释**\n\n在此例中，`h` 是我们重命名后的 `math` 模块，旨在某些情况下节省输入时间。重命名后，新名称成为有效且被识别的名称，而原名称不再适用。\n\
    \n### `from ... import` 语句\n\n可以从模块中导入特定的名称，而非导入整个模块。\n\n**示例**\n\n启动 IDLE。\n\n\
    导航至“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```python\nfrom math import pi\n\nprint(\"The\
    \ PI value is-\", pi)\n```\n\n### 导入所有名称\n\n**示例**\n\n启动 IDLE。\n\n导航至“文件”菜单并点击“新建窗口”。\n\
    \n输入以下内容：\n\n```python\nfrom math import *\n\nprint(\"The PI value is-\", pi)\n\
    ```\n\n**解释**\n\n在此上下文中，我们导入了特定模块的所有定义，但这**不**被提倡为规范，因为它可能导致难以察觉的命名重复。\n\n## Python\
    \ 模块搜索路径\n\n**示例**\n\n启动 IDLE。\n\n导航至“文件”菜单并点击“新建窗口”。\n\n输入以下内容：\n\n```python\n\
    import sys\n\nsys.path\n```\n\nPython 会在包括 `sys` 文件在内的所有位置进行搜索。\n\n## 重新加载模块\n\
    \nPython 仅会导入模块一次，以提高执行效率。\n\n```python\nprint(\"This program was executed\")\n\
    import mine\n```\n\n### 重新加载代码\n\n**示例**\n\n启动 IDLE。\n\n导航至“文件”菜单并点击“新建窗口”。\n\n\
    输入以下内容：\n\n```python\nimport mine\nimport mine\nimport mine\n\nimport importlib\n\
    importlib.reload(mine)\n```\n\n## Python 内置 `dir()` 函数\n\n要发现模块中包含的名称，我们使用内置函数\
    \ `dir()`。\n\n**语法**\n\n```python\ndir(module_name)\n```\n\n## Python 包\n\n在 Python\
    \ 中，文件存放模块，目录存放包。一个 Python 包包含相似的模块。因此，不同的模块应放置在不同的 Python 包中。\n\n# Python 中的数据类型\n\
    \n## ✓ 数字\n\n如前所述，Python 支持浮点数、整数和复数。小数点的有无将整数与浮点数区分开来。例如，`4` 是整数，而 `4.0` 是浮点数。\n\
    \n另一方面，Python 中的复数表示为 `r + tj`，其中 `r` 代表实部，`t` 代表虚部。在此上下文中，函数 `type()` 用于确定变量的类别。Python\
    \ 函数 `isinstance()` 用于判断对象具体源自哪个类。\n\n### 示例\n\n启动 IDLE。\n\n导航至“文件”菜单并点击“新建窗口”。\n\
    \n输入以下内容：\n\n```python\nnumber = 6\nprint(type(number))          # 应输出 <class\
    \ 'int'>\nprint(type(6.0))             # 应输出 <class 'float'>\n\ncomplex_num =\
    \ 7 + 5j\nprint(complex_num + 5)\nprint(isinstance(complex_num, complex))  # 应输出\
    \ True\n```\n\n**重要提示**：Python 中的整数长度可以是无限的。Python 中的浮点数精度假定为小数点后十五位。\n\n## 数字转换\n\
    \n本节假设您已具备使用手动计算或计算器将十进制转换为二进制、八进制和十六进制的基础知识。请查看 Windows 10 中的计算器，版本 Version 10.1804.911.1000，选择“程序员”模式以自动转换。\n\
    \n程序员经常需要将十进制数转换为八进制、十六进制和二进制形式。Python 中的前缀允许将这些数字标记为其对应的类型。\n\n| 数制 | 前缀 |\n\
    | :--- | :--- |\n| 八进制 | `0O` 或 `0o` |\n| 二进制 | `0B` 或 `0b` |\n| 十六进制 | `0X` 或\
    \ `0x` |\n\n### 示例\n\n```python\nprint(0b1010101)      # 输出: 85\nprint(0x7B +\
    \ 0b0101)  # 输出: 128 (123+5)\nprint(0o710)          # 输出: 456\n```\n\n### 练习\n\
    \n编写一个 Python 程序以显示以下内容：\n\na. `0011 1111` (二进制)\nb. `747` (八进制)\nc. `93` (十六进制)\n\
    \n## 类型转换\n\n有时称为强制转换，类型转换允许我们将一种数字类型转换为另一种。预加载的函数如 `float()`、`int()` 和 `complex()`\
    \ 支持隐式和显式类型转换。这些相同的函数也可用于从字符串进行转换。\n\n### 示例\n\n启动 IDLE。\n\n导航至“文件”菜单并点击“新建窗口”。\n\
    \n输入以下内容：\n\n```python\nint(5.3)   # 结果为 5\nint(5.9)   # 结果为 5\n```\n\n`int()`\
    \ 作用于浮点数时会产生截断效果。它会直接丢弃小数部分而不进行四舍五入。再来看看 `float()`：\n\n启动 IDLE。\n\n导航至“文件”菜单并点击“新建窗口”。\n\
    \n输入以下内容：\n\n```python\nfloat(6)            # 结果为 6.0\ncomplex('4+2j')     # 结果为\
    \ (4+2j)\n```\n\n### 练习\n\n对以下数值应用 `int()` 转换：\n\na. `4.1`\nb. `4.7`\nc. `13.3`\n\
    d. `13.9`\n\n对以下数值应用 `float()` 转换：\n\ne. `7`\nf. `16`\ng. `19`\n\n## ✓ Python\
