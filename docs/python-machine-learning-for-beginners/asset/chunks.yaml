    ## Accessing Elements from a List


    In programming and in Python specifically, the first item is always indexed zero.
    For a list of five items, we will access them from index 0 to index 4. Failure
    to access the items in a list in this manner will create an index error. The index
    is always an integer as using other number types will create a type error. For
    nested lists, they are accessed via nested indexing.


    ### Example


    Start IDLE.


