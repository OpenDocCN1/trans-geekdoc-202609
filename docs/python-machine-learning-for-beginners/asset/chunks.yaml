    \ be written as:\n\nemployee1=25; employee2=45; employee3=32; employee4=43.\n\n\
    ## Indentation in Python\n\nIndentation is used for categorization program lines\
    \ into a block in Python. The amount of indentation to use in Python depends entirely\
    \ on the programmer. However, it is important to ensure consistency. By convention,\
    \ four whitespaces are used for indentation instead of using tabs. For example:\n\
    \n![](Images/image00231.gif)    \n\nNote: We will explain what kind of program\
    \ of this is later.\n\nIndentation in Python also helps make the program look\
    \ neat and clean. Indentation creates consistency. However, when performing line\
    \ continuation indentation can be ignored. Incorrect indentation will create an\
    \ indentation error. Correct python programs without indentation will still run,\
    \ but they might be neat and consistent from human readability view.\n\n## Comments\
    \ in Pythons\n\nWhen writing python programs and indeed any programming language,\
    \ comments are very important. Comments are used to describe what is happening\
    \ within a program. It becomes easier for another person taking a look at a program\
    \ to have an idea of what the program does by reading the comments in it. Comments\
    \ are also useful to a programmer as one can forget the critical details of a\
    \ program written. The hash (#) symbol is used before writing a comment in Python.\
    \ The comment extends up to the newline character. The python interpreter normally\
    \ ignores comments. Comments are meant for programmers to understand the program\
    \ better.\n\nExample\n\ni.    Start IDLE\n\nii.    Navigate to the File menu and\
    \ click New Window\n\niii.    Type the following:\n\n#This is my first comment\n\
    \n#The program will print Hello World\n\nPrint(‘Hello World’)   #This is an inbuilt\
    \ function to display\n\niv.    On the file, menu, click on Save. Type the name\
    \ of myProgram5.py\n\nNavigate to Run and click Run Module to run the program\n\
    \nExercise.\n\nThis exercise integrates most of what we have covered so far.\n\
    \na.    Write a program to sum two numbers 45, and 12 and include single line\
    \ comments at each line of code.\n\nb.    Write a program to show the names of\
    \ two employees where the first employee is “Daisy” and the second employee is\
    \ “Richard.” Include single comments at each line of code.\n\nc.    Write a program\
    \ to display the student registration numbers where the student names and their\
    \ registration are: Yvonne=235, Ian=782, James=1235, Juliet=568.\n\n## Multi-line\
    \ Comments\n\nJust like multi-line program statements we also have multi-line\
    \ comments. There are several ways of writing multi-line comments. The first approach\
    \ is to type the hash (#) at each comment line starting point.\n\nFor Example\n\
    \nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \n#I am going to write a long comment line\n\n#the comment will spill over to\
    \ this line\n\n#and finally end here.\n\nThe second way of writing multi-line\
    \ comments involves using triple single or double quotes: ‘’’ or”. For multi-line\
    \ strings and multi-line comments in Python, we use the triple quotes. Caution:\
    \ When used in docstrings they will generate extra code, but we do not have to\
    \ worry about this at this instance.\n\nExample:\n\nStart IDLE.\n\nNavigate to\
    \ the File menu and click New Window.\n\nType the following:\n\n“This is also\
    \ a great \n\nillustration of\n\na multi-line comment in Python.”\n\n## Python’s\
    \ Docstring\n\nIn Python, docstring refers to words offering description and are\
    \ written as the initial program statement in a function, module, method, or class\
    \ definition. (We will handle this later on). Docstrings in Python are written\
    \ using triple quotes.\n\n## Integrated Exercise\n\nThis exercise will utilize\
    \ several concepts that we covered earlier.\n\na.    Given the following program\
    \ statement: Color1=’red’; color1=’blue’; CoLor1=’yellow’ explain why all the\
    \ three will be treated as different variables in Python.\n\nb.    Consider the\
    \ following Python program and identify what is wrong with it.\n\nstudent1\\_age=23                     \
    \ #This is the age of the first student\n\nstudent2\\_age=19                                     \
    \ #This is the age of the student\n\nsotal\\_age=student1\\_age +student2\\_age    \
    \ #Getting the sum of the ages of the \n\nprint(age)                         \
    \ #Displaying their ages\n\nc.    Rewrite b. above to be a valid Python program\n\
    \n## Operators (Basic) in Python\n\nSo far we have been using the summation (+)\
    \ operator, and it also doubles up as a concatenation operator (appending statements).\
    \ However, we want to expand our list of operators, and this leads us to basic\
    \ operators in Python.\n\n### Arithmetic Operators\n\nThe multiplication (\\*),\
    \ division (/), subtraction (-), and addition (+) are the arithmetic operators\
    \ used to manipulate numbers.\n\nExercise\n\nWrite the following programs and\
    \ run it\n\na.    Difference\n\nnumber1=35                #declaring first number\n\
    \nnumber2= 12                #declaring second number\n\ndifference=number2-number1   \
    \ #declaring what the difference does\n\nprint(difference)            #Calling\
    \ the print function to display what difference has\n\nb.    Multiplication\n\n\
    number1=2                #declaring first number    \n\nnumber2= 15               \
    \ #declaring second number\n\nproduct=number1\\*number2        #declaring what\
    \ the product does\n\nprint(product)                #Calling the print function\
    \ to display what product has\n\nc.    Division\n\nnumber1=10                #declaring\
    \ first number    \n\nnumber2= 50                #declaring second number\n\n\
    division=number2/number1        #declaring what the division does\n\nprint(division)               \
    \ #Calling the print function to display what product has\n\n### Modulus\n\nThe\
    \ modulus operator is used to return the integer remainder after division. The\
    \ modulus=dividend%divisor.\n\nExample\n\nStart IDLE.\n\nNavigate to the File\
    \ menu and click New Window.\n\nType the following:\n\nnumber1=2               \
    \ #declaring first number    \n\nnumber2= 15                #declaring second\
    \ number\n\nremainder=number2%number1    #declaring what the remainder does\n\n\
    print(remainder)                #Calling the print function to display remainder\
    \ has\n\n### Squaring and Cubing in Python\n\nSquaring a number-number\\*\\*2\n\
    \nCubing a number-number\\*\\*3\n\nExample:\n\nStart IDLE.\n\nNavigate to the\
    \ File menu and click New Window.\n\nType the following:\n\nSquare of 3 in Python\
    \ will be 3\\*\\*2\n\nCube of 5 in Python will be 5\\*\\*3\n\n1.  Square of 3\n\
    \nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \nnumber=3                #declaring  variable number and assigning value 3\n\n\
    square=number\\*\\*2\n\nprint(square)                #Calling the print function\
    \ to display what square has\n\n2.  Cube of 5\n\nStart IDLE.\n\nNavigate to the\
    \ File menu and click New Window.\n\nType the following:\n\nnumber=5               \
    \ #declaring  variable number and assigning value 5\n\ncube=number\\*\\*3\n\n\
    print(cube)                #Calling the print function to display what cube has\n\
    \nExercise\n\nUse python operators to write and run a python program that finds\
    \ the following:\n\na.    Cube of 7\n\nb.    Square of 15\n\nc.    Cube of 6\n\
    \nd.    Square of 11\n\ne.    Cube of 8\n\nf.    Square of 13\n\nNote: We can\
    \ still multiply 2 two times to get the square of 2. The reason for using the\
    \ square and cube operators is to help us write compact and efficient code. Remember\
    \ that the interpreter goes through each line including comments only that it\
    \ ignores comments. Using the cube and square operators helps compact code and\
    \ increase the efficiency of interpretation including troubleshooting as well\
    \ as human readability of the code.\n\n## Operators with String in Python\n\n\
    In Python certain operators are used to help in concatenating strings. The addition\
    \ sign is used to concatenate strings in Python.\n\nExample\n\nStart IDLE.\n\n\
    Navigate to the File menu and click New Window."
