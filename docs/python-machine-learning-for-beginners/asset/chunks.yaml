    )\n```\n\n## Python 中的 continue 语句\n\n当使用 `continue` 语句时，解释器仅跳过当前迭代中循环内的其余代码，循环不会终止。循环继续进行下一次迭代。\n\
    \n### Python continue 的语法\n\n```python\ncontinue\n```\n\n### 示例\n\n1. 启动 IDLE。\n\
    2. 导航到 **File** 菜单并点击 **New Window**。\n3. 输入以下代码：\n\n```python\nfor tracker in\
    \ \"bring\":\n    if tracker == \"i\":\n        continue\n    print(tracker)\n\
    print(\"Finished\")\n```\n\n该程序的输出将是：\n\n```text\nb\nr\nn\ng\nFinished\n```\n\n\
    **类比**：假设你正在运行数据恢复软件并指定了跳过 Word 文件（`.doc`、`.docx` 扩展名）。程序将不得不在跳过 Word 文件后继续迭代。\n\
    \n### 练习\n\na. 编写一个使用 `for` 循环的 Python 程序，在字符串 \"Oliver\" 中遇到 \"v\" 时中断。\nb. 编写一个\
    \ Python 程序，在字符串 \"Lemon\" 中跳过 \"m\" 后继续。\n\n## Python 中的 pass 语句\n\n像注释一样，`pass`\
    \ 语句不会影响程序，因为它不执行任何操作。\n\n### pass 的语法\n\n```python\npass\n```\n\n设想一段你计划将来使用但目前不需要的程序代码。你可以将其编写为\
    \ `pass` 语句，而不必在将来插入该代码。\n\n### 示例\n\n1. 启动 IDLE。\n2. 导航到 **File** 菜单并点击 **New\
    \ Window**。\n3. 输入以下代码：\n\n```python\nmy_list = {'k', 'i', 'n'}\nfor tracker in\
    \ my_list:\n    pass\n```\n\n## Python 中的函数\n\nPython 中的函数有助于将大型代码拆分为较小的单元。函数使程序更有条理且易于管理。\n\
    \nPython 函数将采用以下语法形式：\n\n```python\ndef name_of_function(arguments):\n    \"\"\
    \"docstring\"\"\"\n    statement(s)\n```\n\n### 示例\n\n1. 启动 IDLE。\n2. 导航到 **File**\
    \ 菜单并点击 **New Window**。\n3. 输入以下代码：\n\n```python\ndef welcome(salute):\n    \"\
    \"\"The Python function welcomes you to\n    the individual passed in as\n   \
    \ parameter\"\"\"\n    print(\"Welcome \" + salute + \". Lovely Day!\")\n```\n\
    \n## 在 Python 中调用函数\n\n一旦定义了函数，我们就可以从另一个函数或程序中调用它。\n\n调用函数只需键入函数名并附上合适的参数。\n\n\
    1. 启动 IDLE。\n2. 导航到 **File** 菜单并点击 **New Window**。\n3. 输入以下代码：\n\n```python\n\
    welcome('Brenda')\n```\n\n输出将是 `\"Welcome Brenda. Lovely Day!\"`。\n\n### 练习\n\n\
    编写一个函数，调用时输出 `\"Hello (student name), kindly submit your work by Sunday\"`。\n\n\
    ## 文档字符串\n\n文档字符串放在函数头之后作为第一条语句，简要解释函数的功能。文档字符串应始终放在三引号之间以容纳多行字符串。\n\n### 调用/引用之前输入的文档字符串\n\
    \n#### 示例\n\n1. 启动 IDLE。\n2. 导航到 **File** 菜单并点击 **New Window**。\n3. 输入以下代码：\n\n\
    ```python\nprint(welcome.__doc__)\n```\n\n输出将是：\n\n```text\nThis function welcomes\
    \ you to\nthe individual passed in as\nparameter\n```\n\n调用/引用文档字符串的语法是：\n\n```python\n\
    print(function_name.__doc__)\n```\n\n## Python 函数返回语句\n\n### 返回语法\n\n```python\n\
    return [list of expressions]\n```\n\n### 说明\n\n`return` 语句可以返回一个值或 `None` 对象。\n\
    \n### 示例：返回 None\n\n```python\nprint(welcome(\"Richard\"))  # 传递参数并调用函数\n# Welcome\
