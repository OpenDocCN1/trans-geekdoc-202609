- raw: 'Now type 5 +3, and press enter, the output should be 8. The next mode is the
    Script Mode.


    ii.    Script Mode


    The script mode is used to run a python program written in a file; the file is
    called a script.


    ## Integrated Development Environment (IDE)


    An IDE provides a convenient way of writing and running Python programs. One can
    also use text editors to create a python script file instead of an IDE by writing
    lines of codes and saving the file with a .py extension. However, using an IDE
    can simplify the process of writing and running Python programs. The IDEL present
    in the Python package is an example of an IDE with a graphical user interface
    and gets installed along with the Python language. The advantages of IDE include
    helping getting rid of repetitive tasks and simplify coding for beginners. IDE
    provides syntax highlighting, code hinting, and syntax checking among other features.
    There also commercial IDE such as the PyScripter IDE that performs most of the
    mentioned functions.


    Note:


    We have presented what Python is, how to download and install Python, the immediate
    and script modes of Python IDE, and what is an IDE.


    ## Your First Written Program in Python


    The rest of the illustrations will assume you are running the python programs
    in a Windows environment.


    i.    Start IDLE


    ii.    Navigate to the File menu and click New Window


    iii.    Type the following:


    print (“Hello World!”)


    iv.    On the file, menu, click on Save. Type the name of myProgram1.py


    v.    Navigate to Run and click Run Module to run the program.


    The first program that we have written is known as the “Hello World!” and is used
    to not only provide an introduction to a new computer coding language but also
    test the basic configuration of the IDE. The output of the program is “Hello World!”
    Here is what has happened, the Print() is an inbuilt function, it is prewritten
    and preloaded for you, is used to display whatever is contained in the () as long
    as it is between the double quotes. The computer will display anything written
    within the double quotes.


    Exercise: Now write and run the following python programs:


    a.    print(“I am now a Python Language Coder!”)


    b.    print(“This is my second simple program!”)


    c.    print(“I love the simplicity of Python”)


    d.    print(“I will display whatever is here in quotes such as owyhen2589gdbnz082”)


    Now we need to write a program with numbers, but before writing such a program,
    we need to learn something about Variables and Types.


    Remember python is object-oriented and it is not statically typed which means
    we do not need to declare variables before using them or specify their type. Let
    us explain this statement; an object-oriented language simply means that the language
    supports viewing and manipulating real-life scenarios as groups with subgroups
    that can be linked and shared mimicking the natural order and interaction of things.
    Not all programming languages are object-oriented; for instance, Visual C programming
    language is not object-oriented. In programming, declaring variables means that
    we explicitly state the nature of the variable. The variable can be declared as
    an integer, long integer, short integer, floating integer, a string, or as a character
    including if it is accessible locally or globally. A variable is a storage location
    that changes values depending on conditions.


    For instance, number1 can take any number from 0 to infinity. However, if we specify
    explicitly that int number1 it then means that the storage location will only
    accept integers and not fractions for instance, fortunately or unfortunately,
    python does not require us to explicitly state the nature of the storage location
    (declare variables) as that is left to the python language itself to figure out
    that.


    Before tackling types of variables and rules of writing variables, let us run
    a simple program to understand what variables when coding a python program are.


    i.    Start IDLE


    ii.    Navigate to the File menu and click New Window


    iii.    Type the following:


    num1=4


    num2=5


    sum=num1+num2


    print(sum)


    iv.    On the file, menu, click on Save. Type the name of myProgram2.py


    v.    Navigate to Run and click Run Module to run the program.


    The expected output of this program should be “9” without the double quotes.


    Explanation


    At this point, you are eager to understand what has just happened and why the
    print(sum) does not have double quotes like the first programs we wrote. Here
    is the explanation.


    The first line num1=4 means that variable num1(our shortened way of writing number1,
    first number) has been assigned 4 before the program runs.


    The second line num2=5 means that variable num2(our shortened way of writing number2,
    second number) has been assigned 5 before the program runs.


    The computer interprets these instructions and stores the numbers given


    The third line sum=num1+num2 tells the computer that takes whatever num1 has been
    given and add to whatever num2 has been given. In other terms, sum the values
    of num1 and num2.


    The fourth line print(sum) means that display whatever sum has. If we put double
    quotes to sum, the computer will display the word sum and not the sum of the two
    numbers! Remember that cliché that computers are garbage in and garbage out. They
    follow what you give them!


    Note: + is an operator for summing variables and has other users that will be
    discussed later.


    Now let us try out three exercises involving numbers before we explain types of
    variables and rules of writing variables so that you get more freedom to play
    with variables. Remember variables values vary for instance num1 can take 3, 8,
    1562, 1.


    Follow the steps of opening the Python IDE and do the following:


    i.    The output should be 54


    num1=43


    num2=11


    sum=num1+num2


    print(sum)


    ii.    The output should be 167


    num1=101


    num2=66


    sum=num1+num2


    print(sum)


    iii.    The output should be 28


    num1=9


    num2=19


    sum=num1+num2


    print(sum)


    ## Variables


    We have used num1, num2, and sum and the variable names were not just random,
    they must follow certain rules and conventions. Rules are what we cannot violate
    while conventions are much like the recommended way. Let us start with the rules:


    The Rules of When Naming Variables in Python


    i.    Variable names should always start with a letter or an underscore, i.e.


    num1


    \_num1


    ii.    The remaining part of the variable name may consist of numbers, letters,
    and underscores, i.e.


    number1


    num\_be\_r


    iii.    Variable names are case sensitive meaning that capital letters and non-capital
    letters are treated differently.


    Num1 will be treated differently with num1.


    Exercise


    Write/suggest five variables for:


    a.    Hospital department.


    b.    Bank.


    c.    Media House.


    Given scri=75, scr4=9, sscr2=13, Scr=18


    d. The variable names above are supposed to represent scores of students. Rewrite
    the variables to satisfy Python variable rules and conventions.


    ## Conventions When Naming Variables in Python


    As earlier indicated, conventions are not rules per se are the established traditions
    that add value and readability to the way we name variables in Python.


    i.    Uphold readability. Your variables should give a hint of what they are handling
    because programs are meant to be read by other people other than the person writing
    them.


    number1 is easy to read compared to n1. Similarly, first\_name is easy to read
    compared to firstname or firstName or fn. The implication of all these is that
    both are valid/acceptable variables in python, but the convention is forcing us
    to write them in an easy to read form.'
