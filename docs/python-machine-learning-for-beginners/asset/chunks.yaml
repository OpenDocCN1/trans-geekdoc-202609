    # Data Exploration with HVPlot and Bokeh


    This makes much more sense. Here we can infer that around 1970, something happened
    which brought down the rate of measles to almost nil. This is true since measles
    vaccines were introduced in the US around the year 1963.


    The plots above convey the right information but provide no interactivity. This
    is because they are static plots without the functionalities of the pan, hover
    or zoom in a web browser. However, we can achieve this interactive functionality
    by a mere import of the `hvplot` package.


    ## Import hvplot.pandas


    ```python

    diseases_by_year.hvplot()

    ```


    ![Description: https://cdn-images-1.medium.com/max/800/1*rwEJnxATIJDnI1OkCOTGqQ.gif](Images/image00275.gif)


    The outcome that is displayed by the call is known as a [HoloViews](http://holoviews.org/)
    object (HoloViews [curve](http://holoviews.org/reference/elements/bokeh/Curve.html))
    which is displayed as a Bokeh curve or plot. HoloViews curves or plots are richer
    and easy to capture your comprehension while exploring the information.


    Let us view what more can be done using HoloViews:


    ### Capturing important points on the Plot itself


    1963 was important concerning measles and how about we record this point on the
    graph itself. This will also help us to compare the number of measles cases before
    and after the vaccine introduction.


    ![](Images/image00276.gif)


    ![Description: https://cdn-images-1.medium.com/max/800/1*NebOYPn7QpWXVlT9UxEhKQ.png](Images/image00277.gif)


    Holoviews objects preserve the original data as opposed to other plotting libraries.
    For instance, it is possible to access the original data in a tabular format.


    ```python

    print(vaccination_introduced)


    vaccination_introduced.Curve.I.data.head()

    ```


    ![Description: https://cdn-images-1.medium.com/max/800/1*_MDbOOEuPqY4yzm6F1CJXQ.png](Images/image00278.gif)


    Here we were able to use the data that was used for making the plot. Also, it
    is now very easy to break data in many different ways as shown in the code snippet
    below.


    ![](Images/image00279.gif)


    ![Description: https://cdn-images-1.medium.com/max/800/1*e06bgLCzgyKmhXb1BD2bow.gif](Images/image00280.gif)


    Instead of a dropdown, we can place charts side by side for better comparison.


    ```python

    by_state["Alabama"].relabel(''Alabama'') + by_state["Florida"].relabel(''Florida'')

