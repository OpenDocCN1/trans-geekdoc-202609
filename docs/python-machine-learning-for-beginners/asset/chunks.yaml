    steps and new applications that will force people to go back to square one and
    re-consider whether ML is a bane or a boon. I like to imagine that it may be just
    like any other advancement in technology – it is about how you use it. That being
    said let us dive into the upcoming applications of Artificial Intelligence and
    ML this year. These applications are mostly in R&D stages and about to be out
    to the public, or are out to the public but in beta stages, and again to get an
    official flag off.


    ### AI chips


    Remember when you used to play those arcade PC games before you moved on to consoles
    like PS4 and Xbox? When playing low-end games, the CPU (usually Intel or AMD)
    was enough, but when playing the latest high-end games like Tomb Raider and Assasin’s
    Creed Odyssey, you would need a dedicated GPU (or graphics card in layman’s term).
    These are dedicated chips that boost only your graphics experience. Why am I talking
    about this? Well, a new dedicated chip is about to hit the market.


    AI enabled chips have already debuted in a few cell-phones like iPhone XR, Huawei
    Honor Play, and the Galaxy Note 8. In these cell-phones, a dedicated AI chip does
    the heavy lifting during functionalities like ML-based voice assistant, AI-powered
    smart camera and more. This way, the AI chip decreases the workload of the primary
    processor and keeps the phone from lagging. But AI enabled chips in cell-phones
    are just the tip of the iceberg.


    Google, Microsoft, Amazon, Intel, and Facebook are all investing heavily in dedicated
    infrastructure that will boost AI-based functionalities, be it a chip that you
    can buy and plugin or a cloud-based CPU that can be used for ML and neural networks.
    The latest in the news among these are the [Intel Nervana](https://www.intel.ai/nervana-nnp/#gs.C5HAvM5Q)
    (developed by Intel, where Facebook is a significant development partner), [Google
    Cloud TPU](https://cloud.google.com/tpu/), [Microsoft’s project Brainwave](https://www.microsoft.com/en-us/research/project/project-brainwave/),
    and [Amazon’s AWS Inferentia](https://aws.amazon.com/machine-learning/inferentia/).

