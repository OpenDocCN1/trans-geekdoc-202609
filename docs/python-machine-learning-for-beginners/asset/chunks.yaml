- raw: "There are still very interesting advances in the field that revolve about\
    \ the idea of improving data. For example, while data augmentation has been around\
    \ for some time and is vital for many DL applications, this year Google published\
    \ [auto-augment](https://ai.googleblog.com/2018/06/improving-deep-learning-performance.html?m=1),\
    \ a deep reinforcement learning approach to automatically augment training data.\
    \ An even more extreme idea is to train DL models with synthetic data. This has\
    \ been tried in practice for some time and is seen as key to the future of Artificial\
    \ Intelligence by many. \n\nNVidia presented interesting novel ideas in their\
    \ [Training Deep Learning with Synthetic Data](https://arxiv.org/abs/1804.06516)\
    \ paper. In our “[Learning from the Experts](https://arxiv.org/abs/1804.08033),”\
    \ we also showed how to use expert systems to generate synthetic data that can\
    \ then be used to train DL systems even after combining with real-world data.\
    \ Finally, also interesting is the approach of reducing the need to have large\
    \ quantities of hand-labeled data by using weak supervision. [Snorkel](https://blog.acolyer.org/2018/08/22/snorkel-rapid-training-data-creation-with-weak-supervision/amp/?__twitter_impression=true)\
    \ is a very interesting project that aims at facilitating this approach by providing\
    \ a generic framework.\n\nAs far as more foundational breakthroughs in AI, it\
    \ might be me and my focus, but I haven’t seen many. I don’t entirely agree with\
    \ Hinton when he says that this lack of innovation is due to the field having\
    \ “[a few senior guys and a gazillion young guys](https://www.wired.com/story/googles-ai-guru-computers-think-more-like-brains/)”\
    \ although it is true that there is a trend in science where [breakthrough research\
    \ is done at a later age](https://phys.org/news/2011-11-breakthrough-scientific-discoveries-longer-dominated.html).\
    \ \n\nIn my opinion, the main reason for the current lack of breakthroughs is\
    \ that there are still many interesting practical applications of existing approaches\
    \ and variations so it is hard to risk in approaches that might not be practical\
    \ right away. That is even more relevant when most of the research in the field\
    \ is sponsored by large companies. While being highly empirical and using known\
    \ approaches, it opens the door to uncovering new ones since it proves that the\
    \ one that is usually regarded as optimal is not. Another highly exploratory paper\
    \ is the recent NeurIPS best paper award winner [Neural Ordinary Differential\
    \ Equations](https://arxiv.org/abs/1806.07366) which challenges a few fundamental\
    \ things in DL including the notion of layers itself.\n\nInterestingly, this last\
    \ paper was motivated by a project where the authors were looking into healthcare\
    \ data (more concretely Electronic Health Records). I cannot finish this summary\
    \ without referring to the area of research in the intersection of AI and Healthcare\
    \ since that is where my focus at Curai is at. Unfortunately, so much is going\
    \ on in this space that I would need another post only for this. So, I will only\
    \ point you to the papers that were published at the [MLHC conference](https://www.mlforhc.org/)\
    \ and the [ML4H NeurIPS workshop](https://ml4health.github.io/2018/). Our team\
    \ at [Curai](https://www.curai.com/) managed to get papers accepted at both, so\
    \ you will find our papers there among many other interesting ones that should\
    \ give you an idea of what is going on in our world.\n\n## Object and Class in\
    \ Machine Learning using Python\n\nPython supports different programming approaches\
    \ as it is a multi-paradigm. An object in Python has an attribute and behavior.\
    \ It is essential to understand objects and classes when studying machine learning\
    \ using Python object-oriented programming language.\n\nExample\n\nCar as an object:\n\
    \nAttributes: color, mileage, model, age\n\nBehavior: reverse, speed, turn, roll,\
    \ stop, start.\n\nClass\n\nIt is a template for creating an object.\n\nExample\n\
    \nclass Car:\n\nImportant:\n\nBy convention, we write the class name with the\
    \ first letter as uppercase. A class name is in singular form by convention.\n\
    \n## Syntax\n\nclass Name\\_of\\_Class:\n\nFrom a class, we can construct objects\
    \ by simply making an instance of the class. The class\\_name() operator creates\
    \ an object by assigning the object to the empty method.    \n\n## Object/Class\
    \ Instantiation\n\nFrom our class Car, we can have several objects such as a first\
    \ car, second care or SUVs.\n\nExample\n\nStart IDLE.\n\nNavigate to the File\
    \ menu and click New Window.\n\nType the following:\n\nmy\\_car=Car()\n\n   pass\n\
    \nExercise\n\na.    Create a class and an object for students.\n\nb.    Create\
    \ a class and an object for the hospital.\n\nc.    Create a class and an object\
    \ for a bank.\n\nd.    Create a class and an object for a police department.\n\
    \nExample\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\n\
    Type the following:\n\nclass Car:\n\ncategory=”Personal Automobile”\n\n    def\
    \ \\_\\_init\\_\\_(self, model, insurance):\n\n        self.model = model\n\n\
            self.insurance =insurance\n\nsubaru=Car(“Subaru”,”Insured”)\n\ntoyota=Car(“Toyota”,”Uninsured”)\n\
    \nprint(“Subaru is a {}”.format(subaru.\\_class\\_.car))\n\nprint(“Toyota is a\
    \ {}”.format(toyota.\\_class\\_.car))\n\nprint(“{} is {}”.format(subaru.model,\
    \ subaru.insurance))\n\nprint(“{} is {}”.format(toyota.model, toyota.insurance))\n\
    \n## Methods\n\nFunctions defined within a body of the class are known as methods\
    \ and are basic functions. Methods define the behaviors of an object.\n\nExample\n\
    \nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \ndef \\_\\_init\\_\\_(self, model, insurance):\n\n        self.model = model\n\
    \n        self.insurance =insurance\n\n    def ignite(self, ignite):\n\n       \
    \ return \"{} ignites {}\".format(self.model, ignition)\n\n    def stop(self):\n\
    \n        return \"{} is now stopping\".format(self.model)\n\nsubaru=Car(“Subaru”,”Insured”)\n\
    \nprint(subaru.ignite(\"'Fast'\"))\n\nprint(subaru.stop())\n\nImportant\n\nThe\
    \ methods ignite() and stop() are referred to as instance methods because they\
    \ are an instance of the object created.\n\nExercise\n\na.    Create a class Dog\
    \ and instantiate it.\n\nb.    Create a Python program to show the names of two\
    \ dogs and their two attributes from a.\n\n## Inheritance in Machine Learning\
    \ using Python\n\nA way of creating a new class by using details of existing class\
    \ devoid of modifying it is called inheritance. The derived class or child class\
    \ is the newly formed class while the existing class is called a parent or base\
    \ class.\n\nExample\n\nStart IDLE.\n\nNavigate to the File menu and click New\
    \ Window.\n\nType the following:\n\n![](Images/image00222.gif)\n\nExplanation\n\
    \nWe created two Python classes in the program above. The classes were Dog as\
    \ the base class and Pitbull as the derived class. The derived class inherits\
    \ the functions of the base class. The method \\_init\\_() and the function super()\
    \ are used to pull the content of \\_init\\_() method from the base class into\
    \ the derived class.\n\n## Encapsulation in Machine Learning using Python\n\n\
    Encapsulation in Python Object Oriented Programming approach is meant to help\
    \ prevent data from direct modification. Private attributes in Python are denoted\
    \ using a single or double underscore as a prefix.\n\nExample\n\nStart IDLE.\n\
    \nNavigate to the File menu and click New Window.\n\nType the following:\n\n“\\\
    _\\_” or “\\_”.\n\nclass Tv:\n\n    def \\_\\_init\\_\\_(self):\n\n        self.\\\
    _\\_Finalprice = 800\n\n    def offer(self):\n\n        print(\"Offering Price:\
    \ {}\".format(self.\\_\\_finalprice))\n\n    def set\\_final\\_price(self, offer):\n\
    \n        self.\\_\\_finalprice = offer\n\nt = Tv()\n\nt.offer()\n\nt.\\_\\_finalprice\
    \ = 950\n\nt.offer()\n\n\\# using setter function\n\nt.setFinalPrice(990)\n\n\
    t.sell()\n\nExplanation"
