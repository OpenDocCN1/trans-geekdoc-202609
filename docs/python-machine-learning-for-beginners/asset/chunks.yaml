- raw: "# Variable Scope and Lifetime in Python Functions\n\nVariables and parameters\
    \ defined within a Python function have local scope implying they are not visible\
    \ from outside. In Python, the variable lifetime is valid as long the function\
    \ executes and is the period throughout that a variable exists in memory. Returning\
    \ the function destroys the function variables.\n\nExample\n\nStart IDLE.\n\n\
    Navigate to the File menu and click New Window.\n\nType the following:\n\ndef\
    \ function\\_my()\n\n   marks=15\n\nprint(“The value inside the function is:”,\
    \ marks)\n\nmarks=37\n\nfunction\\_my()\n\nprint”The value outside the function\
    \ is:”,marks)\n\n## Function Types\n\nThey are broadly grouped into user-defined\
    \ and built-in functions. The built-in functions are part of the Python interpreter\
    \ while the user-defined functions are specified by the user.\n\nExercise\n\n\
    Give three examples of built-in functions in Pythons\n\nFunction Argument\n\n\
    Calling a function requires passing the correct number of parameters otherwise\
    \ the interpreter will generate an error.\n\nIllustration\n\nStart IDLE.\n\nNavigate\
    \ to the File menu and click New Window.\n\nType the following:\n\ndef salute(name,message):\n\
    \n   \"\"\"This function welcomes to\n\n   the student with the provided message\"\
    \"\"\n\n   print(\"Welcome\",salute + ', ' + message)\n\nwelcome(\"Brenda\",\"\
    Lovely Day!\")\n\nNote: The function welcome() has two parameters. We will not\
    \ get any error as has been fed with two arguments. Let us try calling the function\
    \ with one argument and see what happens:\n\nwelcome(“Brenda”)    #only one argument\
    \ passed\n\nRunning this program will generate an error saying “TypeError: welcome()\
    \ missing 1 required positional argument. The same will happen when we pass no\
    \ arguments to the function.\n\nExample 2\n\nStart IDLE.\n\nNavigate to the File\
    \ menu and click New Window.\n\nType the following:\n\nwelcome()\n\nThe interpreter\
    \ will generate an error “TypeError: welcome() missing 2 required positional arguments”.\n\
    \n## Keywords Arguments in Python\n\nPython provides a way of calling functions\
    \ using keyword arguments. When calling functions using keyword arguments, the\
    \ order of arguments can be changed.  The values of a function are matched to\
    \ the argument position-wise.\n\nNote:\n\nIn the previous example function welcome\
    \ when invoked as welcome(“Brenda”, “Lovely Day!”). The value “Brenda” is assigned\
    \ to the argument name and “Lovely Day!” to msg.\n\nCalling the function using\
    \ keywords\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\
    \nType the following:\n\nwelcome(name=”Brenda”, msg=”Lovely Day!”)\n\nKeywords\
    \ not following the order\n\nwelcome(msg=”Lovely Day!”, name=”Brenda”)\n\n## Arbitrary\
    \ Arguments\n\nIt may happen that we do not have knowledge of all arguments needed\
    \ to be passed into a function. Analogy: Assume that you are writing a program\
    \ to welcome all new students this semester. In this case, you do not how many\
    \ will report.\n\nExample\n\nStart IDLE.\n\nNavigate to the File menu and click\
    \ New Window.\n\nType the following:\n\ndef welcome(\\*names):\n\n“””This welcome\
    \ function salutes all students in the names tuple.”””\n\n    for name in names:\n\
    \n        print(“Welcome”.name)\n\nwelcome(\"Lucy\",\"Richard\",\"Fridah\",\"\
    James\")\n\nThe output of the program will be:\n\nWelcome Lucy\n\nWelcome Richard\n\
    \nWelcome Fridah\n\nWelcome James\n\n## Recursion in Python\n\nThe definition\
    \ of something in terms of itself is called recursion.  A recursive function calls\
    \ other functions.\n\nExample\n\nPython program to compute integer factorials\n\
    \nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \n![](Images/image00237.gif)\n\nExercise\n\nWrite a Python program to find the\
    \ factorial of 7.\n\n## Python Anonymous Function\n\nSome functions may be specified\
    \ devoid of a name and these are called anonymous functions. The lambda keyword\
    \ is used to denote an anonymous function. Anonymous functions are also referred\
    \ to as lambda functions in Python.\n\nSyntax\n\nlambda arguments: expression.\n\
    \nLambda functions must always have one expression but can have several arguments.\n\
    \nExample\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\n\
    Type the following:\n\ndouble = lambda y: y \\* 2\n\n\\# Output: 10\n\nprint(double(5))\n\
    \nExample 2\n\nWe can use inbuilt functions such as filter () and lambda to show\
    \ only even numbers in a list/tuple.\n\nStart IDLE.\n\nNavigate to the File menu\
    \ and click New Window.\n\nType the following:\n\nfirst\\_marks = \\[3, 7, 14,\
    \ 16, 18, 21, 13, 32\\]\n\nfresh\\_marks = list(filter(lambda n: (n%2 == 0) ,\
    \ first\\_marks))\n\n\\# Output: \\[14, 16, 18, 32\\]\n\nprint(fresh\\_marks)\n\
    \nLambda function and map() can be used to double individual list items.\n\nExample\
    \ 3\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\nType\
    \ the following:\n\nfirst\\_score = \\[3, 7, 14, 16, 18, 21, 13, 32\\]\n\nfresh\\\
    _score = list(map(lambda m: m \\* 2 , first\\_score))\n\n\\# Output: \\[6, 14,\
    \ 28, 32, 36, 42, 26, 64\\]\n\nprint(fresh\\_score)\n\n## Python’s Global, Local\
    \ and Nonlocal\n\nPython’s Global Variables\n\nVariables declared outside of a\
    \ function in Python are known as global variables. They are declared in global\
    \ scope. A global variable can be accessed outside or inside of the function.\n\
    \nExample\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\n\
    Type the following:\n\ny= \"global\"\n\ndef foo():\n\n    print(\"y inside the\
    \ function :\", y)\n\nfoo()\n\nprint(\"y outside the function:\", y)\n\nExplanation\n\
    \nIn the illustration above, y is a global variable and is defined as a foo()\
    \ to print the global variable y. When we call the foo() it will print the value\
    \ of y.\n\nLocal Variables\n\n A local variable is declared within the body of\
    \ the function or in the local scope.\n\nExample\n\nStart IDLE.\n\nNavigate to\
    \ the File menu and click New Window.\n\nType the following:\n\ndef foo():\n\n\
        x = \"local\"\n\nfoo()\n\nprint(x)\n\nExplanation\n\nRunning this program\
    \ will generate an error indicating ‘x’ is undefined. The error is occurring because\
    \ we are trying to access local variable x in a global scope whereas foo() functions\
    \ only in the local scope.\n\nCreating a Local Variable in Python\n\nExample\n\
    \nA local variable is created by declaring a variable within the function.\n\n\
    def foo():\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\
    \nType the following:\n\n    x = \"local\"\n\n    print(x)\n\nfoo()\n\nExplanation\n\
    \nWhen we execute the code, the output will be:\n\nLocal\n\n## Python’s Global\
    \ and Local Variable\n\nUsing both local and global variables in the same code.\n\
    \nExample\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\n\
    Type the following:\n\ny = \"global\"\n\ndef foo():\n\n    global y\n\n    x =\
    \ \"local\"\n\n    y = y \\* 2\n\n    print(y)\n\n    print(x)\n\nfoo()\n\nExplanation\n\
    \nThe output of the program will be:\n\nglobal global\n\nlocal\n\nExplanation\n\
    \nWe declared y as a global variable and x as a local variable in the foo(). The\
    \ \\* operator issued to modify the global variable y and finally, we printed\
    \ both y and x.\n\nLocal and Global Variables with the same name\n\nStart IDLE.\n\
    \nNavigate to the File menu and click New Window.\n\nType the following:\n\ny=6\n\
    \ndef foo():\n\ny=11\n\n   print(“Local variable y-“, y)\n\nfoo()\n\nprint(\"\
    Global variable y-\", y)\n\n## Python’s Nonlocal Variables\n\n A Python’s nonlocal\
    \ variable is used in a nested function whose local scope is unspecified. It is\
    \ neither global nor local scope.\n\nExample\n\nCreating a nonlocal variable.\n\
    \nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \ndef outer():\n\n    y = \"local variable\"\n\n    def inner():\n\n        nonlocal\
    \ y\n\n        y = \"nonlocal variable\"\n\n        print(\"inner:\", y)\n\n   \
    \ inner()\n\n    print(\"outer scope:\", y)\n\nouter()\n\n## Global Keyword in\
    \ Python\n\nThe global keyword I Python allows modification of the variable outside\
    \ the current scope. The global keyword makes changes to the variable in a local\
    \ context. There are rules when creating a global keyword:\n\n A global keyword\
    \ is local by default when we create a variable within a function.\n\n It is global\
    \ by default when we define a variable outside of a function and you do not need\
    \ to use the global keyword."
