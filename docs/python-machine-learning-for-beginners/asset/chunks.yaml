    \n    print(\"Now within the else segment\")\n\n## Python’s break and continue\n\
    \nLet us use real-life analogy where we have to force a stop on iteration before\
    \ it evaluates completely. Think of when cracking/breaking passwords using a simple\
    \ dictionary attack that loops through all possible character combinations, you\
    \ will want the program immediately it strikes the password searched without having\
    \ to complete. Again, think of when recovering photos you accidentally deleted\
    \ using recovery software, you will want the recovery to stop iterating through\
    \ files immediately it finds items within the specified range. The break and continue\
    \ statement in Python works in a similar fashion.\n\nExample\n\nStart IDLE.\n\n\
    Navigate to the File menu and click New Window.\n\nType the following:\n\nfor\
    \ tracker in \"bring\":\n\n    if tracker == \"i\":\n\n        break\n\n    print(tracker)\n\
    \nprint(\"The End\")\n\n## continue statement in Python\n\nWhen the continue statement\
    \ is used, the interpreter skips the rest of the code inside a loop for the current\
    \ iteration only and the loop does not terminate. The loop continues with the\
    \ next iteration.\n\nThe syntax of Python continue\n\ncontinue\n\nExample\n\n\
    Start IDLE.\n\nNavigate to the File menu and click New Window.\n\nType the following:\n\
    \nfor tracker in \"bring\":\n\n    if tracker == \"i\":\n\n        continue\n\n\
        print(tracker)\n\nprint(\"Finished\")\n\nThe output of this program will be:\n\
    \nb\n\nr\n\nn\n\ng\n\nFinished\n\nAnalogy: Assume that you are running data recovery\
    \ software and have specified skip word files (.doc, dox extension). The program\
    \ will have to continue iterating even after skipping word files.\n\nExercise\n\
    \na.    Write a Python program using for loop that will break after striking “v”\
    \ in the string “Oliver”.\n\nb.    Write a Python program that will continue after\
    \ skipping “m” in the string “Lemon”.\n\n## pass Statement in Python\n\nLike a\
    \ comment, a pass statement does not impact the program as it leads to no operation.\n\
    \nThe syntax of pass\n\npass\n\nThink of a program code that you plan to use in\
    \ future but is not currently needed. Instead of having to insert that code in\
    \ future, the code can be written as pass statements.\n\nExample\n\nStart IDLE.\n\
    \nNavigate to the File menu and click New Window.\n\nType the following:\n\nmy\\\
    _list={‘k’,’i’,’n’}\n\nfor tracker in my\\_list:\n\n   pass\n\n## Functions in\
    \ Python\n\nFunctions in Python help split the large code into smaller units.\
    \ Functions make a program more organized and easy to manage. \n\nIn Python functions\
    \ will assume the syntax form below:\n\ndef name\\_of\\_function (arguments):\n\
    \n    “””docstring”””\n\nstatements(s)\n\nExample\n\nStart IDLE.\n\nNavigate to\
    \ the File menu and click New Window.\n\nType the following:\n\ndef welcome(salute):\n\
    \n    \"\"\"The Python function welcomes you to\n\n    the individual passed in\
    \ as\n\n    parameter\"\"\"\n\n    print(\"Welcome \" + salute + \". Lovely Day!\"\
    )\n\n## Calling a Function in Python\n\nWe can call a function once we have defined\
    \ it from another function or program.\n\nCalling a function simply involves typing\
    \ the function name with suitable parameters.\n\nStart IDLE.\n\nNavigate to the\
    \ File menu and click New Window.\n\nType the following:\n\nwelcome(‘Brenda’)\n\
    \nThe output will be “Welcome Brenda. Lovely Day!’\n\nExercise\n\nWrite a function\
    \ that when called outputs“Hello (student name), kindly submit your work by Sunday”.\n\
    \n## Docstring\n\nIt is placed after the function header as the first statement\
    \ and explains in summary what the function does. Docstring should always be placed\
    \ between triple quotes to accommodate multiple line strings.\n\nCalling/Invoking\
    \ the docstring we typed earlier\n\nExample\n\nStart IDLE.\n\nNavigate to the\
    \ File menu and click New Window.\n\nType the following:\n\nprint(welcome.\\_doc\\\
    _)\n\nThe output will be “This function welcomes you to\n\n    the individual\
    \ passed in as\n\n    parameter”.\n\nThe syntax for calling/invoking the docstring\
    \ is:\n\nprint(function\\_name. \\_doc\\_)\n\n## Python function return statement\n\
    \nReturn syntax\n\nreturn \\[list of expressions\\]\n\nExplanation\n\nThe return\
    \ statement can return a value or a None object.\n\nExample\n\nPrint(welcome(“Richard”))   \
    \ #Passing arguments and calling the function\n\nWelcome Richard. Lovely Day!\n\
    \nNone                #the returned value\n\nExample of Returning a Value other\
    \ None\n\nStart IDLE.\n\nNavigate to the File menu and click New Window.\n\nType\
    \ the following:\n\n![](Images/image00236.gif)"
  fmt: "\n# Python 程序设计基础\n\n## 使用 if..else 进行流程控制\n\n编写一个程序，使用 `if..else` 流程控制语句检查非闰年并显示相应场景。包含注释和缩进以增强程序的可读性。\n\
    \n## Python 中的 for 循环\n\n在 Python 中，缩进用于分隔 `for` 循环的主体。\n\n**注意**：简单线性列表采用以下语法：\n\
