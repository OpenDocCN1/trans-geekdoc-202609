    \ file could have the same name but has changed the file extension. Python will\
    \ create an exception object whenever these runtime error types occur.\n\n## Inbuilt\
    \ Exceptions in Python\n\nPython has several inbuilt exceptions that are flagged\
    \ when associated errors arise. The `dir()` function (likely intended instead\
    \ of `local()`) can help list all inbuilt exceptions in Python.\n\n*(Image reference:\
    \ `Images/image00211.jpeg`)*\n\n## Exception Handling in Python\n\nIf exceptions\
    \ occur, the execution of a program stops and the exception is passed to the calling\
