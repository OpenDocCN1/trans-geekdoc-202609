  fmt: "\n## if…else Flow Control\n\nThe `if..else` statement in Python is a decision\
    \ making when executing the program. The `if…else` statement will ONLY execute\
    \ code if the specified condition exists.\n\n### The syntax of if…else in Python\n\
    \n```\nif test expression:\n    Statement(s)\n```\n\n### Explanation\n\nThe python\
    \ program will only execute the statements(s) if the test expression is `True`.\
    \ The program first evaluates the test expression before executing the statement(s).\
    \ The program will not execute the statement(s) if the test expression is `False`.\
    \ By convention, the body of it is marked by indentation while the first is not\
    \ indented line signals the end.\n\n### Challenge: Think of scenarios, real-life,\
    \ where the if…else condition is required.\n\n- If you have not enrolled for a\
    \ course, then you cannot sit for the exam else sit for the exam.\n- If you have\
    \ paid for house rent then you will be issued with acknowledgment receipt else\
    \ request for more time.\n- If you are a licensed driver then you can drive to\
    \ school else you hire a taxi.\n- If you are tired then you can watch movies else\
    \ can complete the essay.\n- If you are an ethical person then you will acknowledge\
    \ your mistake else you will overlook the damage caused.\n- If you are committed\
    \ to programming then you will practice daily else you will lose interest.\n-\
    \ If you have signed for email alerts you will be updated frequently else you\
    \ will have to check the website daily.\n- If you plead guilty to all accounts\
    \ you are likely to be convicted else the merit of your case will depend on cross-examination\
    \ of witnesses and evidence presented.\n\n> **Note:** When we use the `if` statement\
    \ alone without the `else` part, it will only print/display if the condition is\
    \ true, it will not cater for the alternative, the case where the first condition\
    \ is not present.\n\n### Example 1\n\n1. Start IDLE.\n2. Navigate to the File\
    \ menu and click New Window.\n3. Type the following:\n\n```\nnumber = 5\n\nif\
    \ number > 0:          # The comparison operator\n    print(number, \"The number\
    \ is a positive number\")\n```\n\n#### Explanation\n\nThe program contains the\
    \ `if` condition that tests if the given number satisfies the `if` condition,\
    \ \"is it greater than 0\". Since 5 is greater than zero, the condition is satisfied\
    \ the interpreter is allowed to execute the next statement which is to extract\
    \ and display the numerical value including the string message. The test condition\
    \ in this program is `number > 0`. But think of when the condition is not met,\
    \ what happens? Let us look at Example 2.\n\n### Example 2\n\n1. Start IDLE.\n\
    2. Navigate to the File menu and click New Window.\n3. Type the following:\n\n\
    ```\nnumber = -9\n\nif number > 0:\n    print(number, \"This is a positive number\"\
    )\n```\n\n#### Explanation\n\nThe program contains only the `if` statement which\
    \ tests the expression by testing if -9 is greater than zero. Since it is not,\
    \ the interpreter will not execute the subsequent program code lines. In real\
    \ life, you will want to provide for an alternate in case the first condition\
    \ is not met. This program will not display anything when executed because the\
    \ `if` condition has not been met. The test condition in this program is `number\
    \ > 0`.\n\n### Exercise\n\nWrite programs in Python using `if` statement only\
    \ to perform the following:\n\na. Given `number = 7`, write a program to test\
    \ and display only even numbers.\nb. Given `number1 = 8`, `number2 = 13`, write\
    \ a program to only display if the sum is less than 10.\nc. Given `count_int =\
    \ 57`, write a program that tests if the count is more than 45 and displays, \"\
    the count is above the recommended number\".\nd. Given `marks = 34`, write a program\
    \ that tests if the marks are less than 50 and display the message, \"the score\
    \ is below average\".\ne. Given `marks = 78`, write a program that tests if the\
    \ marks are more than 50 and display the message, \"great performance\".\nf. Given\
    \ `number = 88`, write a program that tests if the number is an odd number and\
    \ displays the message, \"Yes it is an odd number\".\ng. Given `number = 24`,\
    \ write a program that tests and displays if the number is even.\nh. Given `number\
    \ = 21`, write a program that tests if the number is odd and displays the string,\
    \ \"Yes it is an odd number\".\n\n> **Note:** The execution of statements after\
    \ the `if` expression will only happen where the `if` expression evaluates to\
    \ `True`, otherwise the statements are ignored.\n\n## if…else Statement in Python\n\
    \n### The if…else syntax\n\n```\nif test condition:\n    Statements\nelse:\n \
    \   Statements\n```\n\n### Explanation\n\nThe `if` statement, the `if…else` statement\
    \ will execute the body of `if` in the case that the tests condition is `True`.\
    \ Should the `if…else` tests expression evaluate to false, the body of the `else`\
    \ will be executed. Program blocks are denoted by indentation. The `if…else` provides\
    \ more maneuverability when placing conditions on the code.\n\n### Example: A\
    \ program that checks whether a number is positive or negative\n\n1. Start IDLE.\n\
    2. Navigate to the File menu and click New Window.\n3. Type the following:\n\n\
    ```\nnumber_mine = -56\n\nif number < 0:\n    print(number_mine, \"The number\
    \ is negative\")\nelse:\n    print(number_mine, \"The number is a positive number\"\
    )\n```\n\n### Exercise\n\nWrite a Python program that uses `if..else` flow control\
    \ to perform the following:\n\na. Given `number = 9`, write a program that tests\
    \ and displays whether the number is even or odd.\nb. Given `marks = 76`, write\
    \ a program that tests and displays whether the marks are above pass mark or not\
    \ bearing in mind that the pass mark is 50.\nc. Given `number = 78`, write a program\
    \ that tests and displays whether the number is even or odd.\nd. Given `marks\
    \ = 27`, write a program that tests and displays whether the marks are above pass\
    \ mark or not bearing in mind that the pass mark is 50.\n\n### Challenge\n\nWrite\
    \ a program that accepts age input from the user, explicitly converts the age\
    \ into integer data types, then uses `if…else` flow control to tests whether the\
    \ person is underage or not, the legal age is 21. Include comments and indentation\
    \ to improve the readability of the program.\n\n## if…elif…else Flow Control Statement\
    \ in Python\n\nNow think of scenarios where we need to evaluate multiple conditions,\
    \ not just one, not just two but three and more. Think of where you have to choose\
    \ team member, if not Richard, then Mercy, if not Richard and Mercy then Brian,\
    \ if not Richard, Mercy, and Brian then Yvonne. Real-life scenarios may involve\
    \ several choices/conditions that have to be captured when writing a program.\n\
    \n![Flowchart](Images/image00232.gif)\n\nRemember that the `elif` simply refers\
    \ to `else if` and is intended to allow for checking of multiple expressions.\
    \ The `if` block is evaluated first, then `elif` block(s), before the `else` block.\
    \ In this case, the `else` block is more of a fallback option when all other conditions\
    \ return false. Important to remember, despite several blocks available in `if..elif..else`\
    \ only one block will be executed.\n\n### Example: Three conditions covered but\
    \ only one can execute at a given instance.\n\n1. Start IDLE.\n2. Navigate to\
    \ the File menu and click New Window.\n3. Type the following:\n\n![Code Example](Images/image00233.gif)\n\
    \n#### Explanation\n\nThere are three possibilities but at any given instance\
    \ only one condition will exist and this qualifies the use of `if` family flow\
    \ control statement. For three or more conditions to evaluate, the `if…elif..else`\
    \ flow statement merits.\n\n## Nested if Statements in Python\n\nSometimes it\
    \ happens that a condition exists but there are more sub-conditions that need\
    \ to be covered and this leads to a concept known as nesting. The amount of statements\
    \ to nest is not limited but you should exercise caution as you will realize nesting\
    \ can lead to user errors when writing code. Nesting can also complicate maintaining\
    \ of code. Only indentation can help determine the level of nesting.\n\n### Example\n\
    \n1. Start IDLE.\n2. Navigate to the File menu and click New Window.\n3. Type\
    \ the following:\n\n```\nmy_charact = str(input(\"Type a character here either\
    \ 'a', 'b' or 'c':\"))\n\nif my_charact == 'a':\n    if my_charact == 'a':\n \
    \       print(\"a\")\n    elif my_charact == 'b':\n        print(\"b\")\nelse:\n\
    \    print(\"c\")\n```\n\n### Exercise\n"
  trans: "\n\n## if…else 流程控制\n\nPython 中的 `if..else` 语句是在执行程序时进行决策的机制。`if…else` 语句**仅当**指定条件成立时才会执行代码。\n\
    \n### Python 中 if…else 的语法\n\n```\nif test expression:\n    Statement(s)\n```\n\
    \n### 解释\n\nPython 程序仅当测试表达式为 `True` 时才会执行语句。程序会在执行语句前首先对测试表达式求值。如果测试表达式为 `False`，程序将不会执行该语句。按照惯例，其主体通过缩进标记，而第一行未缩进的代码标志着结束。\n\
    \n### 挑战：思考现实生活中需要 if…else 条件的场景。\n\n- 如果你没有报名课程，则不能参加考试，否则参加考试。\n- 如果你已支付房租，则会收到确认收据，否则请求宽限时间。\n\
    - 如果你是持证驾驶员，则可以开车去学校，否则打车。\n- 如果你累了，则可以看电影，否则可以完成论文。\n- 如果你是正直的人，则会承认错误，否则会忽视造成的损害。\n\
    - 如果你致力于编程，则会每天练习，否则会失去兴趣。\n- 如果你订阅了邮件提醒，则会频繁收到更新，否则必须每天查看网站。\n- 如果你对所有指控认罪，则很可能被定罪，否则你的案件优劣将取决于对证人的交叉盘问和呈堂证供。\n\
    \n> **注意：** 当我们单独使用 `if` 语句而不带 `else` 部分时，仅当条件为真时才会打印/显示内容，它不会处理备选情况，即第一个条件不成立的情况。\n\
    \n### 示例 1\n\n1. 启动 IDLE。\n2. 导航到“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```\nnumber =\
    \ 5\n\nif number > 0:          # 比较运算符\n    print(number, \"The number is a positive\
    \ number\")\n```\n\n#### 解释\n\n该程序包含 `if` 条件，用于测试给定数字是否满足“它是否大于 0”这一 `if` 条件。由于\
    \ 5 大于零，条件成立，解释器被允许执行下一条语句，即提取并显示数值及字符串消息。该程序中的测试条件是 `number > 0`。但试想条件不满足时会发生什么？请看示例\
    \ 2。\n\n### 示例 2\n\n1. 启动 IDLE。\n2. 导航到“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```\nnumber\
    \ = -9\n\nif number > 0:\n    print(number, \"This is a positive number\")\n```\n\
    \n#### 解释\n\n该程序仅包含 `if` 语句，通过测试 -9 是否大于零来对表达式求值。由于并非如此，解释器将不会执行后续的程序代码行。在现实生活中，你会希望在第一个条件不满足时提供备选方案。执行此程序时不会显示任何内容，因为\
    \ `if` 条件未满足。该程序中的测试条件是 `number > 0`。\n\n### 练习\n\n仅使用 `if` 语句编写 Python 程序以执行以下操作：\n\
    \na. 给定 `number = 7`，编写程序测试并仅显示偶数。\nb. 给定 `number1 = 8`，`number2 = 13`，编写程序仅在总和小于\
    \ 10 时显示。\nc. 给定 `count_int = 57`，编写程序测试计数是否超过 45 并显示“the count is above the recommended\
    \ number”。\nd. 给定 `marks = 34`，编写程序测试分数是否低于 50 并显示消息“the score is below average”。\n\
    e. 给定 `marks = 78`，编写程序测试分数是否高于 50 并显示消息“great performance”。\nf. 给定 `number =\
    \ 88`，编写程序测试该数字是否为奇数并显示消息“Yes it is an odd number”。\ng. 给定 `number = 24`，编写程序测试并显示该数字是否为偶数。\n\
    h. 给定 `number = 21`，编写程序测试该数字是否为奇数并显示字符串“Yes it is an odd number”。\n\n> **注意：**\
    \ `if` 表达式后的语句仅在 `if` 表达式求值为 `True` 时才会执行，否则将忽略这些语句。\n\n## Python 中的 if…else 语句\n\
    \n### if…else 语法\n\n```\nif test condition:\n    Statements\nelse:\n    Statements\n\
    ```\n\n### 解释\n\n`if` 语句、`if…else` 语句将在测试条件为 `True` 时执行 `if` 的主体。如果 `if…else`\
    \ 测试表达式求值为 false，则将执行 `else` 的主体。程序块通过缩进表示。`if…else` 在对代码设置条件时提供了更大的灵活性。\n\n###\
    \ 示例：检查数字是正数还是负数的程序\n\n1. 启动 IDLE。\n2. 导航到“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```\n\
    number_mine = -56\n\nif number < 0:\n    print(number_mine, \"The number is negative\"\
    )\nelse:\n    print(number_mine, \"The number is a positive number\")\n```\n\n\
    ### 练习\n\n编写使用 `if..else` 流程控制的 Python 程序以执行以下操作：\n\na. 给定 `number = 9`，编写程序测试并显示该数字是偶数还是奇数。\n\
    b. 给定 `marks = 76`，编写程序测试并显示分数是否超过及格线，及格线为 50。\nc. 给定 `number = 78`，编写程序测试并显示该数字是偶数还是奇数。\n\
    d. 给定 `marks = 27`，编写程序测试并显示分数是否超过及格线，及格线为 50。\n\n### 挑战\n\n编写一个程序，接收用户输入的年龄，显式将年龄转换为整数数据类型，然后使用\
    \ `if…else` 流程控制测试该人是否未成年，法定年龄为 21 岁。包含注释和缩进以提高程序的可读性。\n\n## Python 中的 if…elif…else\
    \ 流程控制语句\n\n现在思考需要评估多个条件的场景，不仅仅是一个，不仅仅是两个，而是三个或更多。设想你必须选择团队成员，如果不是 Richard，则选\
    \ Mercy，如果 Richard 和 Mercy 都不是，则选 Brian，如果 Richard、Mercy 和 Brian 都不是，则选 Yvonne。现实生活场景可能涉及编写程序时必须捕获的多个选择/条件。\n\
    \n![流程图](img/image00232.gif)\n\n请记住，`elif` 即指 `else if`，旨在允许检查多个表达式。首先对 `if` 块求值，然后是\
    \ `elif` 块，最后是 `else` 块。在这种情况下，当所有其他条件均返回 false 时，`else` 块更多是一种后备选项。重要的是要记住，尽管\
    \ `if..elif..else` 中有多个可用块，但任何给定时刻只会执行**一个**块。\n\n### 示例：涵盖三个条件，但在给定实例中只能执行一个。\n\
    \n1. 启动 IDLE。\n2. 导航到“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n![代码示例](img/image00233.gif)\n\
    \n#### 解释\n\n存在三种可能性，但在任何给定实例中只会存在一个条件，这正是使用 `if` 系列流程控制语句的资格所在。对于三个或更多条件的求值，`if…elif..else`\
    \ 流程语句最为合适。\n\n## Python 中的嵌套 if 语句\n\n有时会出现一种条件成立，但存在更多需要覆盖的子条件，这引出了称为嵌套的概念。嵌套的语句数量不受限制，但你应谨慎行事，因为你会意识到嵌套在编写代码时可能导致用户错误。嵌套也会使代码维护变得复杂。只有缩进有助于确定嵌套层级。\n\
    \n### 示例\n\n1. 启动 IDLE。\n2. 导航到“文件”菜单并点击“新建窗口”。\n3. 输入以下内容：\n\n```\nmy_charact\
    \ = str(input(\"Type a character here either 'a', 'b' or 'c':\"))\n\nif my_charact\
    \ == 'a':\n    if my_charact == 'a':\n        print(\"a\")\n    elif my_charact\
    \ == 'b':\n        print(\"b\")\nelse:\n    print(\"c\")\n```\n\n### 练习\n\n"
