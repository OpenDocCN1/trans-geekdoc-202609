- raw: "A relatively new application of ML that has been implemented in China- it\
    \ is a vast ranking system which will be monitoring the behavior of all the citizens\
    \ using surveillance cameras and online activity monitors, to rank them based\
    \ on their “[social credit](https://www.businessinsider.in/China-has-started-ranking-citizens-with-a-creepy-social-credit-system-heres-what-you-can-do-wrong-and-the-embarrassing-demeaning-ways-they-can-punish-you/1-Banning-you-from-flying-or-getting-the-train-/slideshow/63666456.cms).“\n\
    \nAlthough it is supposed to be fully up and running by 2020, its implementation\
    \ has already taken the country by storm, and people are being marked up or down\
    \ depending on acts like smoking in public, boarding a train without a ticket\
    \ or donating to charity. The exact methodology is unknown, but hopefully, a robust\
    \ ML model uses data from various sources to decide whether to decrease a person’s\
    \ score, increase it, or let it remain stagnant. \n\nWhat sounds like a dystopian\
    \ thought and seems like an episode from [Black Mirror](https://www.imdb.com/title/tt2085059/),\
    \ is the reality of millions and we might see the implementation of the system\
    \ covering all of China by the end of this year. And again, although the application\
    \ is very new, the philosophy beyond it is argued by many.\n\n# \n\nConclusion\
    \ \n\nThank you for making it to the end of the book Python Machine Learning for\
    \ Beginners we hope that you found it helpful and informative. Every effort was\
    \ put to ensure that all the chapters give you valuable information. We intentionally\
    \ used simple language to make sure that every person reading it gets empowered. \
    \ The book has deliberately avoided complicated theories and stuck to simple practices\
    \ that one can use at their conveniences when studying machine learning.  \n\n\
    The moment you understand programming basics using Python language, it becomes\
    \ easier to learn machine learning concepts. Machine Learning is essential in\
    \ everyday life.  This book has taken you through many concepts of machine learning. \
    \ There is no one specific thing that a person can do to learn machine learning\
    \ overnight. However, if you follow the right steps with dedication and commitment,\
    \ you will get the results you seek.  Combine a number of practical sessions to\
    \ improve your python programming skills. If you are working with an experienced\
    \ Python programmer, follow all the instructions he/she gives you and keep an\
    \ open communication channel. Get dirty with the IDE and the keyboard.\n\nThe\
    \ next step is to stop reading and start applying the lessons in real life. Do\
    \ whatever you have identified as necessary to improve machine learning in real\
    \ life.  You will find that many people are still ignorant about the proper ways\
    \ of enhancing artificial intelligence and other concepts of machine learning.\
    \ You will realize that the majority of those who seem to have it all together\
    \ lack the basic Python programming skills. To that end, try to engage them and\
    \ teach them a thing or two you have learned herein. You may even recommend or\
    \ gift this book to them.  \n\nYou might also need to refer to this book at a\
    \ later date. Keep it and review it as often as you want. Just because you have\
    \ reached the end of the book does not mean that there is nothing else to learn\
    \ about Python and Machine Learning. Read more and expand your horizons. It is\
    \ the only way you will achieve the mastery you seek. Pay attention to Artificial\
    \ Intelligence particularly because without it Machine Learning is impossible.\
    \ Use some of the tips herein to make the world a better place by coming up with\
    \ your own inventions especially in Artificial Intelligence.  \n\nFinally, if\
    \ you found this book useful in any way, a review on Amazon will be appreciated! \
    \ \n\n#"
