    导航到“文件”菜单并点击“新建窗口”。


    输入以下内容：


    ```python

    list_mine = [''t'', ''r'', ''o'', ''g'', ''r'', ''a'', ''m'']


    del list_mine[1]


    print(list_mine)  # t, o, g, r, a, m

    ```


    ### 删除多个元素


    ### 示例


    ```python

    del list_mine[0:3]

    print(list_mine)  # a, m

    ```


    ### 删除整个列表


    启动 IDLE。


    导航到“文件”菜单并点击“新建窗口”。


    输入以下内容：


    ```python

    del list_mine


    print(list_mine)  # 将生成错误: name ''list_mine'' is not defined

    ```


    `remove()` 方法或 `pop()` 方法可用于移除指定项目。如果不给定索引，`pop()` 方法将移除并返回最后一个项目，并有助于将列表实现为栈。`clear()`
    方法用于清空列表。


    ### 示例


    启动 IDLE。


    导航到“文件”菜单并点击“新建窗口”。


    输入以下内容：


    ```python

    list_mine = [''t'', ''k'', ''b'', ''d'', ''w'', ''q'', ''v'']


    list_mine.remove(''t'')

    print(list_mine)  # 输出将为 [''k'', ''b'', ''d'', ''w'', ''q'', ''v'']


    print(list_mine.pop(1))  # 输出将为 ''b''

    print(list_mine.pop())   # 输出将为 ''v''

    ```


    ### 练习


    给定 `list_yours = [''K'', ''N'', ''O'', ''C'', ''K'', ''E'', ''D'']`


    a. 弹出列表中的第三个项目，将程序保存为 `list1`。

    b. 使用 `remove()` 方法移除第四个项目并将程序保存为 `list2`。

    c. 删除列表中的第二个项目并将程序保存为 `list3`。

    d. 不指定索引弹出列表并将程序保存为 `list4`。


    ## 使用空列表删除整个或特定元素


    ### 示例


    启动 IDLE。


    导航到“文件”菜单并点击“新建窗口”。


    输入以下内容：


    ```python

    list_mine = [''t'', ''k'', ''b'', ''d'', ''w'', ''q'', ''v'']


    list_mine[1:2] = []

    ```


