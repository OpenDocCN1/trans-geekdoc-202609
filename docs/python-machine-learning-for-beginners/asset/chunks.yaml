    提到的大多数项目尚未公开发布，或仍处于 Beta 阶段。因此，2019 年可能是这些项目面世之时，更强大的 AI 芯片将使实时 AI 应用成为现实。


    ### 物联网与 AI 的融合


    两个领域都发生了许多变化，但物联网与 AI 赋能解决方案的真正落地尚未见到。该话题最常被引用的用例是：利用传感器采集汽车数据，并用收集到的数据决定保险金额。但老实说，有多少保险公司真用这种方法计算你的保费？


    2019 年情况将有所改变，随着 AI 芯片的涌现、更廉价更新的云端 AI 服务，以及更多知名企业投资物联网和 AI。许多公司将推出自动驾驶汽车，[CES
    2019](https://www.digitaltrends.com/cars/the-best-self-driving-shuttles-and-cars-ces-2019/)
    让我们一窥物联网与 AI 结合如何助力企业描绘更宏大的蓝图。


    ### 自动化机器学习的更多应用


    虽然 ML（机器学习）是大多数人熟悉的术语，但自动化机器学习（AutoML）可以说仍处于 Beta 阶段。AutoML 指通过将 ML 应用于 ML 本身，利用自动化解决重复性任务。例如，在对不同算法进行测试以找出最适配数据的算法之前，必须先清洗数据。数据清洗耗时巨大，研究表明，这是一个科学家们[不愿在新数据集上反复进行的手动过程](https://hub.packtpub.com/data-cleaning-worst-part-of-data-analysis/)。借助
    AutoML 此类流程可得以解决，正如许多人预测的那样，2019 年将涌现更多 AutoML 应用。


    ### AI 将实现 DevOps 自动化


    IT 服务和基础设施是维持业务顺畅运行必须面对的棘手问题。然而，DevOps 人员执行的各类操作（如监控、调试、扩容等）均可实现自动化。DevOps 将逐渐让位于
    AIOps，这将使普通程序员也能轻松管理流程和流水线，无需承担搭建和维护的烦恼。已有多篇[论文](https://sciencelogic.com/blog/aiops_landscape_2019)预测了
    AIOps 引领下的 DevOps 未来。


    ### 个性化药物


    你吃的安眠药和邻居一样吗？剂量未必适合你；某些成分可能对你不利；甚至因特定原因药物对你毫无作用。为何不定制专属药物？[个性化药物](https://www.england.nhs.uk/healthcare-science/personalisedmedicine/)遵循一套流程——分析患者及其生活方式习惯，随后推荐特定成分的药丸。借助“10
    万基因组计划”，个性化药物预计将在 2019 年迎来巨大增长，尽管可能尚未公开可用。今年还安排了多场大型会议，如[第 11 届个性化、预防性、预测性、预防分子与医学诊断国际会议](https://personalizedmedicine.conferenceseries.com/)。


    ML 将帮助分析患者数据以决定最适合的药物，彻底摒弃“千人一方”的陈旧理论。


    ### 基于 ML 的助手进一步进化


    2018 年，全新升级的 [Google Assistant](https://www.youtube.com/watch?v=d40jgFZ5hXk) 让我们大开眼界。但其商业化应用尚未落地，而这在
    2019 年有望实现。Alexa 等语音助手已从用户处收集海量数据，2019 年这些助手可能变得更智能、更拟人化。语音助手将从客厅走向公共场所、汽车、广播系统、ATM
    机等。许多人押注 2019 将成为[语音助手元年](https://brandequity.economictimes.indiatimes.com/news/digital/five-reasons-voice-assistant-will-dominate-2019/67452823)。


    ### 利用 AI 从机器获取更优指标


    如果能在工厂机器即将报废、故障停工前预知并维修，那该多好？


    技术与工业设备通常按固定计划维护，导致人力浪费，且仍面临突发故障风险。一旦给机器装上传感器，将采集数据输入 ML 模型，即可获得更优性能和更高效的维护计划。


    GE 创建的[数字孪生](https://www.ge.com/digital/applications/digital-twin)即此类实现：为大型机器构建虚拟模型，利用数百个传感器确保孪生体实时同步真实机器状态，从而管理和维护当前部署的
    65 万个孪生体。预计今年全球智能工厂将进一步推广数字孪生应用。


    ### 8. 计算机视觉将塑造监控未来


    计算机视觉与监控已成商场、机场、城市十字路口等场所的刚需。多家[科技公司](https://www.rocketspace.com/corporate-innovation/5-breakthrough-computer-vision-startups-to-watch-in-2019)在全球多地悄悄部署软件，以发现、追踪并上报态势。但应用不止于此：若家庭摄像头发现陌生人闯入，Google
    Assistant 立即报警，岂不惊艳？


    Google 等公司在计算机视觉上投入巨资（还记得访问网站时它让你标记汽车或路牌图片吗？），2019 年将有更多玩家入局。监控系统将大幅提速，监控将不再只是视频流，而是能根据现场态势充当自动化响应的触发器。


    ### 9. 医疗健康将见证更多 AI 落地


    医疗健康历经多年演进，ML 带来的变革远不止个性化药物兴起。近期中国宣称诞全球首例[基因编辑婴儿](https://www.theguardian.com/science/2018/nov/26/worlds-first-gene-edited-babies-created-in-china-claims-scientist)。所用工具
    CRISPR-CAS9 本意是操作 DNA，植入所需基因或敲除致病基因。尽管该成果未经同行评审刊登、真实性待验证，但 AI 已被用于[预测导致癌症的基因组变化](https://www.icr.ac.uk/news-archive/artificial-intelligence-can-predict-how-cancers-will-evolve-and-spread)。


    今年将出现更多利用 AI 进行基因修饰的应用，以对抗新型疾病、优化人类。然而，此类医学奇迹背后的伦理法律困境与争论，仍是科学界的辩论焦点。


    ### 10. 社会信用体系

    '
  trans: '

    提到的大多数项目尚未公开发布，或仍处于 Beta 阶段。因此，2019 年可能是这些项目面世之时，更强大的 AI 芯片将使实时 AI 应用成为现实。


    ### 物联网与 AI 的融合


    两个领域都发生了许多变化，但物联网与 AI 赋能解决方案的真正落地尚未见到。该话题最常被引用的用例是：利用传感器采集汽车数据，并用收集到的数据决定保险金额。但老实说，有多少保险公司真用这种方法计算你的保费？


    2019 年情况将有所改变，随着 AI 芯片的涌现、更廉价更新的云端 AI 服务，以及更多知名企业投资物联网和 AI。许多公司将推出自动驾驶汽车，[CES
    2019](https://www.digitaltrends.com/cars/the-best-self-driving-shuttles-and-cars-ces-2019/)
    让我们一窥物联网与 AI 结合如何助力企业描绘更宏大的蓝图。


    ### 自动化机器学习的更多应用


    虽然 ML（机器学习）是大多数人熟悉的术语，但自动化机器学习（AutoML）可以说仍处于 Beta 阶段。AutoML 指通过将 ML 应用于 ML 本身，利用自动化解决重复性任务。例如，在对不同算法进行测试以找出最适配数据的算法之前，必须先清洗数据。数据清洗耗时巨大，研究表明，这是一个科学家们[不愿在新数据集上反复进行的手动过程](https://hub.packtpub.com/data-cleaning-worst-part-of-data-analysis/)。借助
    AutoML 此类流程可得以解决，正如许多人预测的那样，2019 年将涌现更多 AutoML 应用。


    ### AI 将实现 DevOps 自动化


    IT 服务和基础设施是维持业务顺畅运行必须面对的棘手问题。然而，DevOps 人员执行的各类操作（如监控、调试、扩容等）均可实现自动化。DevOps 将逐渐让位于
    AIOps，这将使普通程序员也能轻松管理流程和流水线，无需承担搭建和维护的烦恼。已有多篇[论文](https://sciencelogic.com/blog/aiops_landscape_2019)预测了
    AIOps 引领下的 DevOps 未来。


    ### 个性化药物


    你吃的安眠药和邻居一样吗？剂量未必适合你；某些成分可能对你不利；甚至因特定原因药物对你毫无作用。为何不定制专属药物？[个性化药物](https://www.england.nhs.uk/healthcare-science/personalisedmedicine/)遵循一套流程——分析患者及其生活方式习惯，随后推荐特定成分的药丸。借助“10
    万基因组计划”，个性化药物预计将在 2019 年迎来巨大增长，尽管可能尚未公开可用。今年还安排了多场大型会议，如[第 11 届个性化、预防性、预测性、预防分子与医学诊断国际会议](https://personalizedmedicine.conferenceseries.com/)。


    ML 将帮助分析患者数据以决定最适合的药物，彻底摒弃“千人一方”的陈旧理论。


    ### 基于 ML 的助手进一步进化


    2018 年，全新升级的 [Google Assistant](https://www.youtube.com/watch?v=d40jgFZ5hXk) 让我们大开眼界。但其商业化应用尚未落地，而这在
    2019 年有望实现。Alexa 等语音助手已从用户处收集海量数据，2019 年这些助手可能变得更智能、更拟人化。语音助手将从客厅走向公共场所、汽车、广播系统、ATM
    机等。许多人押注 2019 将成为[语音助手元年](https://brandequity.economictimes.indiatimes.com/news/digital/five-reasons-voice-assistant-will-dominate-2019/67452823)。


    ### 利用 AI 从机器获取更优指标


    如果能在工厂机器即将报废、故障停工前预知并维修，那该多好？


    技术与工业设备通常按固定计划维护，导致人力浪费，且仍面临突发故障风险。一旦给机器装上传感器，将采集数据输入 ML 模型，即可获得更优性能和更高效的维护计划。


    GE 创建的[数字孪生](https://www.ge.com/digital/applications/digital-twin)即此类实现：为大型机器构建虚拟模型，利用数百个传感器确保孪生体实时同步真实机器状态，从而管理和维护当前部署的
    65 万个孪生体。预计今年全球智能工厂将进一步推广数字孪生应用。


    ### 8. 计算机视觉将塑造监控未来


    计算机视觉与监控已成商场、机场、城市十字路口等场所的刚需。多家[科技公司](https://www.rocketspace.com/corporate-innovation/5-breakthrough-computer-vision-startups-to-watch-in-2019)在全球多地悄悄部署软件，以发现、追踪并上报态势。但应用不止于此：若家庭摄像头发现陌生人闯入，Google
    Assistant 立即报警，岂不惊艳？


    Google 等公司在计算机视觉上投入巨资（还记得访问网站时它让你标记汽车或路牌图片吗？），2019 年将有更多玩家入局。监控系统将大幅提速，监控将不再只是视频流，而是能根据现场态势充当自动化响应的触发器。


    ### 9. 医疗健康将见证更多 AI 落地


    医疗健康历经多年演进，ML 带来的变革远不止个性化药物兴起。近期中国宣称诞全球首例[基因编辑婴儿](https://www.theguardian.com/science/2018/nov/26/worlds-first-gene-edited-babies-created-in-china-claims-scientist)。所用工具
    CRISPR-CAS9 本意是操作 DNA，植入所需基因或敲除致病基因。尽管该成果未经同行评审刊登、真实性待验证，但 AI 已被用于[预测导致癌症的基因组变化](https://www.icr.ac.uk/news-archive/artificial-intelligence-can-predict-how-cancers-will-evolve-and-spread)。


    今年将出现更多利用 AI 进行基因修饰的应用，以对抗新型疾病、优化人类。然而，此类医学奇迹背后的伦理法律困境与争论，仍是科学界的辩论焦点。


    ### 10. 社会信用体系

