    # 12. 区块链可以帮助艺术家从其创意作品中获得更多利润


    Artlery 是一家由技术人员和艺术家创立的公司，正在尝试对雕塑和绘画等实体艺术做同样的事情。但对于大多数艺术家和创作者来说，这并不是一个选择。


    进入基于区块链的平台和名为 *智能合约* 的可编程模板。


    区块链是一个新的技术平台，运行在数百万台设备上，对任何人都开放，在那里不仅信息，而且任何有价值的东西——金钱、产权和地契，但也包括音乐、艺术、科学发现和其他知识产权——都可以被安全、私密地移动和存储，在那里信任不是由电影制片厂、流媒体服务、银行或其他公司等强大的中介机构建立的，而是通过大规模协作和巧妙的代码建立的。


    将这项强大的新技术与一个重视包容性、诚信、交易透明度、尊重权利、隐私、安全和价值公平交换的艺术社区结合起来，你就拥有了一个用于电影、电子游戏和其他创意追求的新生态系统。


