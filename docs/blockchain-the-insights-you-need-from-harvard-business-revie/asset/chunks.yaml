    # 12. Blockchain Could Help Artists Profit More from Their Creative Works


    by Don Tapscott and Alex Tapscott


    Anyone who follows the cultural industries—art, music, publishing, theater, cinema—knows
    of the tussles between artists and those who feed off their talents. The traditional
    food chain in movie-making, for example, is a long one: Between those who create
    a film and those who pay for it—movie goers, cable subscribers, pay-per-viewers,
    advertisers, rights licensees, and institutional sponsors such as the National
    Endowment for the Arts—is a multitude of middlemen: online retailers (Amazon,
    Walmart), streaming video services (Netflix, YouTube, Hulu), theater venues (Wanda’s
    AMC, Regal, Cinemark), product placement and media agencies (Propaganda GEM, Omnicom’s
    OMD), film producers (Columbia Pictures, Marvel Studios, Disney-Pixar), movie
    distributors (Sony Pictures, Universal, Warner Bros.), home marketers (Fox, HBO),
    cable and satellite services (Comcast, DIRECTV), video syndicators (PMI, TVS),
    film libraries and archives (Eastman House, Getty Images), and talent agencies
    (WME, CAA, ICM), each with its own contracts and accounting systems. That’s a
    staggeringly long list.


    Each of these middlemen takes a cut of the revenues and passes along the rest,
    with the leftovers typically reaching the artists themselves months later, per
    the terms of their contracts.


    So concentrated is the power in this feeding frenzy that many actors have taken
    themselves off the menu by launching their own companies within the existing industry
    model. The same is true in music, too. For example, Grammy-award-winning singer-songwriter
    Imogen Heap has been a pioneer in the field with the launch of Mycelia, a think-and-do
    tank whose goal is “to empower a fair, sustainable and vibrant music industry
    ecosystem involving all online music interaction services,” using blockchain.

