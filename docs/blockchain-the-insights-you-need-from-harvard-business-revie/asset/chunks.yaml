    # 引言：区块链与数据完整性革命


    ## 引言


    区块链与数据完整性革命

    作者 Catherine Tucker


    尽管互联网令人目眩的演进改变了我们获取数据和交流的方式，但数据完整性和存储方面的进展却举步维艰。我们可以利用互联网瞬间定位婆罗洲的某家冷门餐馆、观看猫咪视频，或在全球分享我们的观点。但即使在云存储技术出现后，数据仍然会丢失、损坏、被审查、意外删除、被黑客攻击、被盗或被毁灭。

    区块链可以消除所有这些问题。区块链于 2008 年首次出现，作为验证加密货币交易的方法，它由时间戳、仅追加的、不可变数据块序列组成，且不由任何单一实体拥有。一旦使用密码学将一份*区块*数据添加到*链*中，它就无法被移除或修改。恶意行为者无法更改它。审查者无法移除它。黑客无法窃取已分享的内容。它对于数据完整性和记录而言可能与互联网对数据访问的革命性一样具有革命性。

    更好的数据完整性带来新的可能性。许多商业决策都依赖于知道我们所拥有的数据实际上反映了现实。例如，供应链：如果通过审查区块链，能够确切知道库存位于特定地点，或在特定时间到达或离开，那么验证其存在的成本将大幅下降。而且由于这些带时间戳的交易记录无法被操纵，欺诈的可能性也会同样急剧下降。在许多其他行业和职能中，区块链可以减少摩擦、精简官僚程序，以至于全新的商业模式成为可能。本书将帮助你了解将会发生什么变化、何时发生以及如何准备。

    作为专注于数字经济的麻省理工学院教授，以及麻省理工学院加密经济学实验室的联合创始人，我花费大量时间研究区块链将如何影响行业。区块链的影响可能进展缓慢，但最终可能令人震惊。深远的新技术和创新带来的影响可能需要数十年才会显现，而且它们带来的变化往往不会发生在人们预期的地方。伏打在
    1800 年发明了电电池，但开发出适用于工业应用的电池至少花了六十年。2000 年互联网泡沫破裂后，很容易得出互联网作为销售商品方式潜力有限的结论。现在，随着比特币泡沫的破裂和几家区块链初创公司的高调失误，一些人将会犯类似的错误。不要否定区块链，也不要因为它看起来太复杂而忽视它——误判我们所处的关键时刻可能会让你的企业难以追赶。有多少低估互联网的公司如果可以的话希望重来一次
    2000 年？

    *《区块链：哈佛商业评论为您提供的洞见》* 将告诉你现在需要知道的内容，并帮助你更好地预测它将如何影响你的业务和行业。它将帮助非技术领导者，包括高管、董事会成员和任何角色的管理人员，快速掌握相关知识。本书分为三个部分：

    理解区块链是对区块链的深入探讨，涵盖其历史、当前轨迹和设计，以及它能做什么和不能做什么。

    区块链与商业探讨了企业今天如何使用区块链，涉及金融、支付、供应链、营销和创意产业。

    区块链的未来探讨了区块链影响隐私、监控、政府监管和环境可持续性观念的能力。

    在整本书中，请自问几个重要问题，以便更好地理解区块链如何帮助（或颠覆）你的业务、行业或整个社会：

    1. 这种结果在没有区块链技术的情况下也能发生吗？区块链技术在这里真正增加了什么价值？

    2. 区块链的真正价值在于放在区块链上的数据具有更高的完整性，还是主要价值源于数据结构是去中心化的且无人拥有数据？

    3. 哪些企业的商业模式最容易受到区块链的威胁？是银行、保险公司、像谷歌这样的数字平台，还是其他尚未被发现的东西？

    4. 政府会采用区块链吗？他们会将其用于货币、记录保存还是其他用途？在政府背景下，用基于区块链的系统取代旧技术会带来什么独特后果？

    5. 既然无人拥有它，区块链的最终受益者会是谁？是既得利益者还是新兴企业，是公司还是个人，是想要隐私的人还是不想要的人，是政府还是异见者？

    在区块链采用的早期阶段，我们可以承认，即使我们尚不确定区块链技术将如何改变社会，我们也不应袖手旁观，让变革在我们之外发生。本卷中的见解勾勒出，一旦数据完整性取得飞跃，主要行业、政府、营销实践和投资模式如何可能发生实质性变化。利用它们为你自己和你的公司做好准备，迎接充满希望的区块链未来。


    ## 第一部分：理解区块链


    ### 1. 关于区块链的真相

    关于区块链的真相

    作者 Marco Iansiti 和 Karim R. Lakhani


    合同、交易及其记录是我们经济、法律和政治体系中的基本结构之一。它们保护资产并设定组织边界。它们建立和验证身份并记录事件。它们规范国家、组织、社区和个人之间的互动。它们指导管理和社会行动。然而，这些关键工具以及为管理它们而形成的官僚机构并未跟上经济的数字化转型。它们就像堵在赛道上的高峰期交通堵塞，困住了
    F1 赛车。在数字世界中，我们监管和维持行政控制的方式必须改变。

    区块链承诺解决这个问题。比特币的核心技术是

