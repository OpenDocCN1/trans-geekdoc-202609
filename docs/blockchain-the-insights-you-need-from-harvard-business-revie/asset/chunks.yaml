    siphon off one-third of the value held in the application (roughly $50 million)
    to their own


    account. This withdrawal of funds, while unexpected, did not violate either Ethereum’s


    or The DAO’s rules, naive as they may have been. Nor does it appear to have violated


    any laws.


    But, at the end of the day, too many Ethereum community members, including some
    of


    its most prominent leaders, suffered losses, having traded their ether for DAO
    tokens.


    They felt that action had to be taken to reverse their losses. The Ethereum leadership
    was


    able to coordinate with the network stakeholders to create a so-called “hard fork,”
    a


    permanent split of the Ethereum blockchain, so that control of the siphoned-off
    funds


    would be shifted to a group of trusted leaders.


    This hard fork created a new Ethereum blockchain and was labeled a bailout by
    critics.


    The new Ethereum blockchain selectively rolled back losses only for those Ethereum


    blockchain token holders who had unwisely exchanged those tokens for The DAO


    application tokens. If you happened to lose your ether tokens in any other way,
    whether


    through market manipulation or through another hack, the rigid “code as law” doctrine


    still applied—and you were out of luck.


    For some members of the community, the decision to hard fork was a wanton violation
    of


    the community’s core principles, akin to burning down the house to roast the pig.
    In


    protest, they decided to keep running the original Ethereum blockchain unadulterated,


    and thus there are now two Ethereum networks. Somewhat confusingly, the old


    Ethereum network has been rebranded as “Ethereum Classic”; the new network retained


    the original name, Ethereum.


    Blockchain fabulists may claim that smart contract applications like The DAO’s
    will


    displace lawyers and disrupt the legal industry. But as this incident amply demonstrated,


    the reality is that smart contracts have proven to be neither smart nor, for that
    matter,


    enforceable agreements. Blockchain is truly an innovative approach to governance
    for


    networks and machines. But we must resist the temptation to anthropomorphize code
    and


    misapply machine governance to social systems. Code is law for machines, law is
    code


    for people. When we mix up these concepts, we wind up with situations like The
    DAO.


    Consider some of the controversy surrounding bitcoin. First, understand that on
    the


    bitcoin blockchain, power is meant to be distributed among all the stakeholders
    in the


    community. None of these stakeholders should have any greater influence or power
    than


    any other to change the terms of the bitcoin protocol. They are interdependent
    and


    incentivized to cooperate in conserving the extant network rules. Any change to
    the


    33


    4\. Who Controls the Blockchain?


    network rules requires coordination and consensus among all of the stakeholders.
    So


    when bitcoin software developers began debating about how to increase network


    capacity, the discussion devolved into a multistakeholder melee that was dubbed
    a


    “governance crisis” by the popular media. Some of the developers wanted to incorporate


    changes to the bitcoin codebase that would not be backward compatible, and thus
    would


    split the network into multiple blockchains—a hard fork.


    The majority of bitcoin developers have opposed hard-fork scaling proposals in
    favor of a


    more conservative approach that assures the continuity of a single bitcoin blockchain.


    Other stakeholders have begun to view this process as obstructionist, and populist


    campaigns have sprung up to route around it. But despite much Sturm und Drang,
    these


    efforts to alter bitcoin’s power structure and circumvent bitcoin developer consensus


    have thus far failed. For many in the community, bitcoin’s ability to resist such
    populist


    campaigns demonstrates the success of the blockchain’s governance structure and
    shows


    that the “governance crisis” is a false narrative.


    As a blockchain community grows, it becomes increasingly more difficult for


    stakeholders to reach a consensus on changing network rules. This is by design
    and


    reinforces the original principles of the blockchain’s creators. To change the
    rules is to


    split the network, creating a new blockchain and a new community. Blockchain networks


