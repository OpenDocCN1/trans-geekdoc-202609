  trans: '

    # 近乎零交易成本的营销影响


    金融交易具有相当大的成本。零售商通常向信用卡公司支付 3% 的支付处理费，而加油站支付的费用甚至更高。使用 eBay 和 Shopify 的卖家需支付刊登和销售费用，而消费者在
    PayPal 等支付门户上需支付交易费用。所有这些费用都会增加商品成本，通常转嫁给消费者。随着信用卡和借记卡的广泛使用，许多商家为其设定了最低消费，以避免因费用而破坏盈利能力。


    区块链技术可实现近乎零的交易成本——即使在微交易中也是如此。Mastercard 和 Visa 等金融机构已提供通过区块链而非刷信用卡发送任何本地货币的能力，利用该技术的额外安全性和透明度层。此外，能够削减中介并直接连接每笔交易两端的银行，可以避免大多数跨境费用。


    对营销人员和广告商也有影响。营销人员通常试图通过向第三方（如 Facebook）付费来获取客户数据以分享信息。但区块链可以让商家使用微支付来激励消费者直接分享个人信息——无需经过中介。例如，拥有移动应用的超市连锁店可以向用户支付
    1 美元安装应用到手机上，如果允许启用位置跟踪则额外支付 1 美元。每次他们打开应用并至少使用一分钟，零售商可以向他们支付几美分或等值于忠诚积分的商店积分，上限为每天最高额度。在此期间，他们向用户推送优惠和特别促销。确实，量身定制的用户优惠提供了一种合法机制，可根据消费者档案提供个性化价格。这种方法有可能减少欺诈，并最大程度减少目前困扰这些计划的客户不准确或不完整的信息。


    同样，营销人员可以启用“smart contracts”（虚拟协议，可消除由中介进行验证、审查或身份验证的需求），用户在订阅电子邮件通讯或注册奖励计划时可以激活。只要用户与商业电子邮件互动——或与广告互动——微支付就会直接存入用户的钱包，这就引出了我们的下一个观点。


    ## 终结 Google-Facebook 广告双头垄断


    类似的模式可用于网站广告，通过为每次页面浏览补偿消费者。大多数互联网用户不喜欢大多数形式的弹出广告和移动广告，并认为在线广告具有侵入性和负面干扰性。越来越常见的应对方式是安装广告拦截器，这一趋势对行业产生了重大的惩罚性影响。预计到
    2020 年，广告拦截的采用将使出版商损失 350 亿美元。


    区块链技术使营销人员有可能通过不同类型的模式收回部分收入：营销人员直接向消费者支付其注意力的费用——并切除 Google-Facebook 层。


    我们认为，区块链技术很快将威胁到数字广告中的 Google-Facebook 双头垄断。虽然基于关键词的搜索不会完全消失，但其重要性将大大降低。最终，个人可以控制自己的在线资料和社会关系图谱。


    借助区块链技术，公司可以通过直接与消费者互动来绕过当今的社交媒体巨头，并可直接与他们分享广告曝光的回报。据报道，2016 年 Google 通过广告平均每位活跃用户产生
    73 美元。当然，73 美元只是近十亿活跃用户的平均值。可以合理预期，Google 对某些高价值人群的收入远超 1,000 美元。想象一下，当公司能够通过区块链技术实现的自愿消费广告高效地将这些价值转移给消费者时，营销的可能性。


    区块链技术还可以验证广告投放和消费者参与度；避免过度投放广告或电子邮件，这会激怒消费者并使其失去购买意愿；并防止不再相关的跟随广告（例如当消费者已购买该公司或竞争对手的产品时）。


    ## 终结营销欺诈和垃圾邮件


    通过区块链的欺诈验证也有助于验证营销人员的来源和方法。微支付也将有效摧毁目前稀释所有人营销效果的大规模网络钓鱼垃圾邮件概念。


    每天发送约 1,350 亿封垃圾邮件，目前占所有发送邮件的 48%。垃圾邮件发送者每发送 1,250 万封邮件仅收到一个回复。向电子邮件收件人支付一笔非常小的区块链启用付款将通过增加该活动的成本来阻止垃圾邮件发送者。它还应帮助公司通过消费者愿意进行此交换来识别对交易感兴趣的消费者。


    同样，对于互联网而言，每当用户点击链接时，都可能进行一次微支付。在大多数情况下，用户将进行一笔小额微支付（例如，阅读一篇新闻文章花费一美分）。这将挫败 DoS
    攻击——一种招募机器人向网站发送数百万请求导致网站宕机或响应时间变差的网络攻击类型。


    区块链还可能使机器人难以设置虚假社交媒体账户、向用户发送欺骗性信息并窃取大品牌在线广告资金。在线真实性实际上已融入区块链技术。一家正在解决社交媒体欺诈问题的公司是
    Keybase.io，它使个人能够使用区块链证明他们是其各种社交媒体账户的合法所有者。这将使营销影响更容易追踪，营销支出更容易证明——两者都是该行业的重大胜利。


    截至 2016 年，76 亿美元（占显示广告总额的 56%）因欺诈或欺骗性活动而损失，预计该数字将增长至 109 亿美元。通过使用区块链技术追踪其广告，营销团队可以保留对其所有自动化实践的控制，确保营销支出集中于产生投资回报的活动，并直接衡量营销影响直至按用户、按邮件的指标。通过将用户行为和微支付联系起来，区块链可以解决困扰营销人员数十年的归因问题。


    ## 重新货币化媒体消费


    区块链支持的编辑内容可能允许公司加强质量控制和版权保护。例如，（重新发明的）Kodak 创建了 KODAKOne，其特点是数字账本记录个人图像的权利归属，使摄影师能够对其作品主张控制权。目前，在线内容的盗窃是一个普遍问题，创作者除了昂贵的诉讼外几乎没有追回损失资金的途径。在未来，他们将自动、轻松地收到内容使用费。


    此外，创建病毒式内容的普通人，例如观看量大的视频或社交帖子，可以为每次点击获得报酬。（目前，这些创作者

    '
