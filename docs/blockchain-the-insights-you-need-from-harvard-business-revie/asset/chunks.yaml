    The original vision of the Ethereum creators was that computer code should, quite


    literally, be treated as law in their community and serve as replacement for legal


    agreements and regulation. The DAO creators embraced this vision and noted that


    participants should look exclusively to the application’s code as dispositive
    on all matters.


    The code was the contract and the law for The DAO. Unfortunately, The DAO’s smart


    contract was flawed: It allowed a DAO token holder who exploited a bug in the
    code to


    32


