    # 17 让加密货币更具环境可持续性


    作者 Marc Blinder


    区块链有能力在许多方面让我们的世界变得更好。它可以为无银行账户的人提供数字钱包，防止欺诈，并用更高效的系统取代过时的系统。但我们仍然需要这个新且改进的世界是一个我们想要生活其中的世界。最大的加密货币——比特币、比特币现金和以太坊——需要大量能源消耗才能运行。2017
    年，区块链消耗的电力超过了包括乌拉圭、尼日利亚和爱尔兰在内的 159 个国家。毫不奇怪，这正在制造一个巨大的环境问题，对《巴黎协定》构成威胁。

    这对于这样一项前景光明的技术来说是一个残酷的、 albeit 非预期的后果，而“挖矿”正是问题的核心。比特币近十年前首次构想时，只是几百名爱好者的小众迷恋，或“矿工”。由于比特币没有银行监管，矿工使用他们的计算机通过解决密码学难题来验证交易，类似于复杂的数学问题。然后，他们将已验证的交易组合成“区块”并将其添加到区块链（所有交易的公共记录）中以记录它们——所有这一切，都换取少量比特币。但单枚比特币在公开市场上曾经售价不到一美分，现在售价接近
    7,000 美元，而且每天大约有 20 万笔比特币交易。随着这些数字的增长，创建加密货币“矿场”的激励也随之增加——服务器农场现已遍布世界各地，往往规模庞大。想象一下，25,000
    台机器 24 小时不间断地计算数学问题的能源消耗量。

    除了环境问题外，这种低效率也威胁到区块链作为企业有意义平台的地位。高昂的能源成本已嵌入系统之中，而且由于运行网络的成本通过交易费用转嫁，用户最终要为此买单。起初，使用比特币的公司可能看不到财务后果，但随着规模扩大，成本可能会变得致命。

    好消息是：有多种替代方案可以帮助组织削减巨大的能源成本。目前，它们尚未被足够迅速地采用。想要保持头上水面——以及其他所有人——的公司需要自行学习。下面是两个可以开始的好地方。


    ## 绿色能源区块链挖矿


    立即可行的解决方案是使用太阳能和其他绿色能源进行挖矿。仅得克萨斯州每天接收的太阳能就足以取代世界上所有非太阳能发电厂。有许多商业服务可为仅使用清洁、可再生能源的服务器农场上的加密挖矿供电。例如，Genesis
    Mining 能够在云端进行比特币和以太坊的挖矿。该冰岛公司使用 100% 可再生能源，现已成为全球最大的矿工之一。

    我们也需要为未来的区块链激励绿色能源。每个使用区块链的公司也定义了自己的矿工补偿系统。新的区块链可以轻松地为使用绿色能源的矿工提供更好的激励，例如更多的加密货币——最终迫使污染矿工退出。它们也可以要求所有矿工证明他们使用绿色能源，并拒绝向不使用绿色能源的矿工付款。


    ## 节能区块链系统


    虽然比特币、比特币现金和以太坊都依赖于被称为“工作量证明”的能源低效密码学问题求解来运行，但许多更新的区块链使用依赖市场激励的“权益证明” PoS 系统。PoS
    系统上的服务器所有者被称为“验证者”——而不是“矿工”。他们缴纳一笔存款，或“质押”，大量加密货币，以换取将区块添加到区块链的权利。在工作量证明系统中，矿工相互竞争，看谁能最快解决难题以换取奖励，消耗大量能源。但在
    PoS 系统中，验证者由考虑其质押的算法选出。去除竞争元素节省了能源，并允许 PoS 系统中的每台机器一次只处理一个问题，而与工作量证明系统不同，在后者中大量机器争相解决同一个问题。此外，如果验证者未能诚实行为，他们可能会被从网络中移除——这有助于保持
    PoS 系统的准确性。

    特别有前景的是委托权益证明 DPoS 系统，其运作方式有点像代议制民主。在 DPoS 系统中，拥有加密货币代币的每个人都可以投票决定哪些服务器成为区块生产者并管理整个区块链。然而，有一个缺点。DPoS
    的抗审查性略低于工作量证明系统。因为它只有 21 个区块生产者，理论上网络可能因同时的传票或停止令而被停止，使其更容易受到以太坊上成千上万个节点的攻击。但
    DPoS 已被证明在处理交易时速度快得多，同时使用更少的能源，而这是在业内我们应该愿意做出的权衡。

    在最大的加密货币中，以太坊已经在进行向 PoS 的过渡，我们应该采取更多集体行动来加快这一进程。开发人员在创建新的工作量证明区块链之前需要深思熟虑，因为它们越成功，其生态影响可能越糟。想象一下，如果几十年前汽车公司足够明智，聚在一起为自己设定排放标准。那将有助于培育一个更健康的星球——并在这些标准最终被强加于他们时，
    preempted 数十亿美元的成本。区块链行业现在处于类似的转折点。问题是，我们是否会比我们之前改变世界的行业更明智。


    ## 要点


    最大的加密货币需要大量能源消耗才能运行。2017 年，区块链消耗的电力超过了包括乌拉圭、尼日利亚和爱尔兰在内的 159 个国家。这正在制造一个巨大的环境问题，对《巴黎协定》构成威胁。

    随着加密货币价值的增加，创建“矿场”的激励也随之增加——遍布世界各地的庞大服务器农场，24 小时不间断地计算数学问题。

    有多种替代方案可以帮助组织削减与区块链相关的巨大能源成本，但它们尚未被足够迅速地采用。

    立即可行的解决方案是使用太阳能和其他绿色能源进行挖矿。每个使用区块链的公司也定义了自己的矿工补偿系统。新的区块链可以轻松地为使用绿色能源的矿工提供更好的激励。

    使用权益证明系统而非工作量证明系统的区块链能源消耗更少。如果区块链行业现在能做出艰难的选择采用更绿色的决策，它可能避免在未来被迫执行绿色标准。


    ## 注释


    1. “比特币能源消耗指数”，Digiconomist，`https://digiconomist.net/bitcoin-energy-consumption`

