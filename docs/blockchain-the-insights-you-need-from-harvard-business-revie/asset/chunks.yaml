    ## 3. 区块链将对金融系统做互联网对媒体所做的事情


    作者：Joichi Ito、Neha Narula 和 Robleh Ali


    即使在互联网部署多年后，许多人仍认为它只是一时风尚。当然，互联网此后已成为我们生活中的重要影响，从我们购买商品和服务的方式，到我们与朋友社交的方式，再到阿拉伯之春，到
    2016 年美国总统选举。然而，在 1990 年代，主流媒体嘲笑 Nicholas Negroponte 预测我们大多数人很快就会在线阅读新闻而不是从报纸上阅读。


    快进二十年：我们是否很快会看到加密货币和区块链带来类似的影响？当然有很多相似之处。像互联网一样，比特币等加密货币由核心技术的进步以及新的开放架构——比特币区块链驱动。像互联网一样，该技术旨在去中心化，具有“层”，每一层由可互操作的开放协议定义，企业和个人可以在其之上构建产品和服务。像互联网一样，在发展的早期阶段存在许多竞争技术，因此指定你所说的
    *哪个* 区块链非常重要。而且，像互联网一样，区块链技术在每个人都使用同一网络时最强，因此未来我们可能都会谈论“the”区块链。


    互联网及其各层花了数十年时间发展，每一层技术层都释放出创造性和创业活动的爆炸。早期，Ethernet 标准化了计算机通过电线传输比特的方式，像 3Com 这样的公司能够在其网络交换产品上建立帝国。TCP/IP
    协议用于寻址和控制数据包如何在计算机之间路由。Cisco 利用该协议构建了网络路由器等产品，到 2000 年 3 月，Cisco 已成为世界上最有价值的公司。1989
    年 Tim Berners-Lee 开发了 HTTP，又一个开放、无许可的协议，网络使 eBay、Google 和 Amazon 等企业成为可能。


    ### 区块链的杀手级应用


    但这里有一个主要区别：早期的互联网是非商业性的，最初通过国防资金开发，主要用于连接研究机构和大学。它不是为了赚钱而设计，而是为了开发构建网络最稳健有效的方式。这种最初缺乏商业参与者和利益的情况至关重要——它允许形成一种网络架构，以市场驱动系统下不会出现的方式共享资源。


    早期互联网的杀手级应用是电子邮件；它推动了采用并加强了网络。比特币是区块链的杀手级应用。比特币推动其底层区块链的采用，其强大的技术社区和健全的代码审查流程使其成为各种区块链中最安全可靠的。像电子邮件一样，很可能某种形式的比特币会持续存在。但区块链还将支持多种其他应用，包括智能合约、资产登记以及许多将超越金融和法律用途的新型交易。


    我们最好将比特币理解为一种新的、去中心化和自动化的金融系统可能如何运作的缩影。虽然其当前能力仍然有限（例如，与传统支付系统相比，交易量较低），但它提供了一个引人注目的未来愿景，因为代码描述了监管和经济系统。例如，交易必须满足某些规则后才能被接受到比特币区块链中。不同于当前金融系统通过制定规则并任命监管机构监督违规行为的方式，比特币的代码设定规则，网络检查合规性。如果
