    ## TAKEAWAYS


    在艺术和其他创意产业中，创作者与消费者之间常有无数中介。每位中间人抽取收入分成，剩余部分通常数月后才到达艺术家手中。


    基于区块链的智能合约可逆转这一范式，创建以包容、交易透明、尊重权利和价值公平交换为基础的创意追求新生态系统。


    多个公司已在区块链上协作，开发具有艺术家友好功能的生态系统，包括融资机制、微货币化、防盗版和声誉系统。


