    **DOES YOUR IDEA ACTUALLY REQUIRE**


    **BLOCKCHAIN?**


    by Catherine Tucker and Yudan Pang


    One of our main jobs when teaching and advising students who are thinking of founding


    blockchain companies is to get them to question whether or not their idea actually


    requires it. Data integrity is the main benefit conferred by blockchain technology,
    and a


    few questions can help determine whether that’s a particular problem for a given
    business


    or use case:


    1\. If the data that my business collects is corrupted, how much do people suffer?


    2\. Do outsiders (perhaps hackers) have incentives to distort or change the data
    that my business is based


    upon?


    3\. How much does my business depend on other people being able to trust the data
    on which it is built?


    Take, for example, a digital currency—the first use case for blockchain. There,
    if data is


    corrupted or distorted by outsiders, people lose real money, and the outsider
    who


    corrupts the data gains money, making such attacks plausible and to be feared.
    Therefore,


    no one will adopt a digital currency unless they can trust their data will not
    be corrupted


    or distorted. In other words, there’s at least a plausible reason why you’d want


    blockchain technology managing currency transactions.


