    # 第 2 部分：区块链与商业


    ## 7. 区块链如何改变金融


    作者 Alex Tapscott 和 Don Tapscott


    我们的全球金融系统每天转移数万亿美元，服务数十亿人。但该系统问题重重，通过费用和延迟增加成本，通过冗余且繁琐的文书工作造成摩擦，并为欺诈和犯罪提供了机会。举例来说，每年有
    45% 的金融中介机构（如支付网络、证券交易所和汇款服务）遭受经济犯罪；整个经济体的这一比例为 37%，而专业服务和技术行业分别为 20% 和 27%。1
    监管成本持续攀升并仍是银行家最关心的问题也就不足为奇了。所有这些都会增加成本，最终由消费者承担负担。


    这不禁让人问：为什么我们的金融系统如此低效？首先，因为它陈旧，是工业技术和纸质流程的拼凑物，只是披上了数字外衣。其次，因为它集中化，这使其抗拒变革且易受系统故障和攻击。第三，它具有排他性，剥夺了数十亿人使用基本金融工具的权利。银行家在很大程度上回避了那种虽然混乱但对经济活力和进步至关重要的创造性破坏。但解决这一创新瓶颈的方案已经出现：区块链。


    区块链最初是作为比特币等加密货币背后的技术而开发的。它是一个庞大、全球分布式的账本，运行在数百万台设备上，能够记录任何有价值的东西。货币、股票、债券、产权、契约、合同以及几乎所有其他类型的资产都可以安全、私密且点对点地转移和存储，因为信任并非由银行和政府等强大的中介机构建立，而是由网络共识、密码学、协作和巧妙的代码建立。


    在人类历史上首次，两个或更多方，无论是企业还是可能互不相识的个人，都可以在不依赖中介机构（如银行、评级机构以及美国国务院等政府机构）来验证其身份、建立信任或执行关键业务逻辑——即对所有商业形式都至关重要的签约、清算、结算和记录保存任务的情况下，达成协议、进行交易并创造价值。


    鉴于这种颠覆性技术所带来的希望与风险，金融行业中许多公司，从银行和保险公司到审计和专业服务公司，都在投资区块链解决方案。是什么推动了这股资金和兴趣的涌入？大多数公司都提到减少摩擦和成本的机会。毕竟，大多数金融中介机构本身也依赖于令人眼花缭乱、复杂且昂贵的中介机构组合来运营自身业务。欧洲银行桑坦德将潜在节省额定为每年
    200 亿美元。2 咨询公司凯捷估计，通过基于区块链的应用，消费者每年可在银行和保险费用上节省高达 160 亿美元。3


    当然，区块链可能使摩根大通、花旗集团和瑞信等现有机构——它们目前都在投资该技术——能够以更少资源做更多事、精简业务并在此过程中降低风险。但虽然机会主义的观点有利且往往必要，但它很少足够。毕竟，如何从结构已根本改变的企业或市场中削减成本呢？


    在这里，区块链是一个真正的游戏规则改变者。通过降低经济中所有参与者的交易成本，区块链支持点对点大规模协作模式，这可能使我们许多现有的组织形式变得多余。


    例如，考虑一下新商业企业如何获取成长资本。传统上，公司在新业务的早期阶段瞄准天使投资人，后来转向风险投资人，最终在证券交易所进行首次公开募股（IPO）。这一行业支持着众多中介机构，如投资银行家、交易所运营商、审计师、律师以及众筹平台（如
    Kickstarter 和 Indiegogo）。区块链通过使任何规模的公司能够通过全球分布式股票发行以点对点的方式筹集资金，从而改变了这一等式。这种新的融资机制已经在改变区块链行业。2016
    年，区块链公司从传统风险投资人那里筹集了 4 亿美元，几乎 2 亿美元是通过我们所称的首次代币发行（ICO 而非 IPO）筹集的。这些 ICO 不仅仅是伪装成公司的加密货币。它们代表了内容和数字版权管理平台（如
    SingularDTV）、分布式风险投资基金（如 The DAO，即去中心化自治组织），甚至是使投资 ICO 和管理数字资产变得容易的新平台（如 ICONOMI）。ICO
    的管道已经很深，例如 Cosmos，这是一种统一技术，将连接世界上每一个区块链，这就是为什么它被称为“区块链互联网”。其他公司也肯定会效仿。


    现有机构正在关注。纽约风险投资公司 Union Square Ventures（USV）扩大了其投资策略，以便可以直接购买 ICO。Menlo Park 风险投资公司
    Andreessen Horowitz 加入 USV 投资 Polychain Capital，一家只购买代币的对冲基金。区块链行业最大投资者之一的 Blockchain
    Capital 近期宣布，将通过 ICO 发行代币为其新基金筹集资金，这是行业内的首次。当然，像高盛、纳斯达克公司以及拥有纽约证券交易所的美国控股公司洲际交易所等主导
    IPO 和上市业务的公司，已成为区块链投资的最大投资者之一。


    与任何激进的新商业模式一样，ICO 也有风险。监管监督几乎为零。尽职调查和披露可能很少，且一些发行过 ICO 的公司已破产。买者自负是关键词，许多早期支持者更像是赌徒而非资助者。但精灵已经出瓶。做得好的话，ICO
    不仅可以提高筹资效率，降低企业家和投资者的资本成本，还可以使全球资本市场的参与民主化。

