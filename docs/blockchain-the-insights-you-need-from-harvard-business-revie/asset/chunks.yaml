    CAD-coin 的数字货币用于银行间转账。我们预计将出现大量服务于各行业特定用途的私有区块链。


    ## Substitution


    第三象限包含的应用在新颖性方面相对较低，因为它们建立在现有的单用途和本地化应用之上，但在协调需求方面很高，因为它们涉及更广泛且日益公开的使用。这些创新旨在取代整个商业运作方式。然而，它们面临很高的采用壁垒；不仅需要更多的协调，而且它们希望取代的流程可能已在组织和机构内部全面展开并根深蒂固。替代品的例子包括加密货币——新型的、完全成型的货币系统，它们源于简单的比特币支付技术。关键区别在于，加密货币要求从事货币交易的每个参与方都采用它，这对长期以来处理和监督此类交易的政府和机构构成了挑战。消费者也必须改变行为并了解如何实现加密货币的新功能。


    麻省理工学院的一项最新实验凸显了数字货币系统未来面临的挑战。2014 年，麻省理工学院比特币俱乐部为麻省理工学院的 4,494 名本科生每人提供了 100
    美元的比特币。有趣的是，30% 的学生甚至没有报名领取这笔免费资金，而报名者中有 20% 在几周内就将比特币兑换成现金。即使是技术娴熟的人也很难理解比特币如何或在哪里使用。


    最雄心勃勃的替代区块链应用之一是 Stellar，这是一个非营利组织，旨在为从未获得过服务的人提供负担得起的金融服务，包括银行、小额支付和汇款。Stellar
    提供自己的虚拟货币 lumens，并允许用户在其系统上保留各种资产，包括其他货币、电话分钟数和数据积分。Stellar 最初专注于非洲，特别是那里的最大经济体尼日利亚。它在其目标人群中获得了显著的采用，并证明了其成本效益。但其未来绝非确定，因为生态系统协调挑战很高。虽然草根采用证明了
    Stellar 的可行性，但要成为银行标准，它需要影响政府政策并说服中央银行和大型组织使用它。这可能需要数年的 concerted 努力。


    ## Transformation


    完全新颖的应用落入最后一个象限，如果成功，可能改变经济、社会和政治体系的本质。它们涉及协调众多参与者的活动并就标准和流程达成机构共识。它们的采用需要重大的社会、法律和政治变革。


    “Smart contracts” 目前可能是最具变革性的区块链应用。这些应用在协商条件得到满足时自动执行付款和货币或其他资产的转移。例如，智能合约可能在货物交付后立即向供应商发送付款。公司可以通过区块链发出已收到特定商品的信号——或者产品具有
    GPS 功能，这将自动记录位置更新，进而触发付款。我们已经在风险投资、银行和数字版权管理等领域看到了这种自我执行合约的早期实验。


    其影响令人着迷。公司建立在合约之上，从成立到买方-供应商关系再到员工关系。如果合约被自动化，那么传统公司的结构、流程以及律师和会计师等中介机构会发生什么？经理人呢？他们的角色都会发生根本性变化。不过，在我们过于兴奋之前，让我们记住，我们距离智能合约的广泛采用还有数十年的时间。例如，它们在没有机构支持的情况下无法有效运行。需要对智能合约的设计、验证、实施和执行方式进行极大的协调和清晰度。我们认为负责这些艰巨任务的机构需要很长时间才能演变。而且技术挑战——尤其是安全——也令人望而生畏。


    ## Guiding Your Approach to Blockchain Investment


    高管应如何思考区块链对其自身组织的影响？我们的框架可以帮助公司识别正确的机会。


    对于大多数公司来说，最容易开始的地方是单用途应用，因为它们风险最小，因为它们并非新事物，并且与第三方协调很少。一种策略是增加比特币作为支付机制。比特币的基础设施和市场已经发展成熟，采用这种虚拟货币将迫使包括
    IT、财务、会计、销售和营销在内的各种职能部门建立区块链能力。另一种低风险的方法是内部将区块链用作数据库，用于管理有形和数字资产、记录内部交易和验证身份等应用。这可能对
    struggling to reconcile multiple internal databases 的公司尤其有用。测试单用途应用将帮助组织培养其进行更高级应用所需的技能。而且得益于初创公司和亚马逊、微软等大型平台提供的基于云的区块链服务的出现，实验变得越来越容易。


    本地化应用是公司的自然下一步。我们现在看到对私有区块链网络的大量投资，而相关项目似乎已准备好产生真正的短期影响。例如，金融服务公司发现，他们与有限数量的可信交易对手建立的私有区块链网络可以显著降低交易成本。


    组织还可以使用本地化应用解决边界间交易中的特定问题。例如，公司已经在使用区块链跟踪复杂供应链中的物品。这在钻石行业正在发生，宝石从矿山到消费者都被追踪。用于此类实验的技术现在已可直接购买。


    开发替代应用需要仔细规划，因为现有解决方案可能难以撼动。一种方法可能是专注于不会要求终端用户大幅改变行为但能提供昂贵或不吸引人的解决方案的替代品。要获得 traction，替代品必须提供与传统解决方案一样好的功能，并且生态系统必须易于吸收和采用。
