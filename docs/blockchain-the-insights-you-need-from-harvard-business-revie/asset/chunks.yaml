    Introduction: Blockchain and the Data Integrity Revolution


    ## Introduction


    BLOCKCHAIN AND THE DATA INTEGRITY REVOLUTION


    by Catherine Tucker


    While the dizzying evolution of the internet has transformed how we access data
    and


    communicate, advances in data integrity and storage have limped along. We can
    use the


    internet to instantaneously pinpoint an obscure eatery in Borneo, watch cat videos,
    or


    share our views worldwide. But even with the advent of cloud storage technologies,
    data


    still gets lost, corrupted, censored, accidentally deleted, hacked, stolen, and
    destroyed.


    Blockchain could eliminate all of these problems. Pioneered in 2008 as a method
    of


    verifying cryptocurrency transactions, blockchain consists of a time-stamped,
    append-


    only series of blocks of immutable data that is not owned by any single entity.
    Once a


    *block* of data is added to the *chain* using cryptography, it can’t be removed
    or modified.


    Bad actors can’t change it. Censors can’t remove it. Hackers can’t steal what’s
    already


    been shared. It might be as revolutionary for data integrity and recording as
    the internet


    has been for data access.


    Better data integrity brings new possibilities. So many business decisions rest
    on knowing


    that the data we have actually reflects reality. Take, for example, supply chain:
