    “大量未开发的创造性能量被浪费在中心化范式带来的实际问题上，”SingularDTV 首席执行官 Zach LeBeau 写道，SingularDTV 是一个基于区块链的数字内容管理和分发平台。他的愿景是去中心化娱乐产业，让创意人士从参与制作的电影、视频、游戏和艺术中获利。他期望去中心化能“实现一个利用每个人最大潜力的世界”。


