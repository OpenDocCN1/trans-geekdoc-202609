    突破性进展冲击社会，事情肯定会变得有点奇怪。自动驾驶汽车和无人机将使用区块链为充电站和降落平台等服务付费。


    国际货币转账将从需要数天缩短到一小时，然后再缩短到几分钟，可靠性将高于当前系统所能管理的水平。


    这些变化，以及其他变化，代表着交易成本的普遍降低。当交易成本降至不可见的阈值以下时，现有的商业模式会出现突然的、戏剧性的、难以预测的聚合和解体。例如，拍卖过去是狭窄且本地化的，而不是像现在在
    eBay 等网站上那样通用且全球化。随着触达人们的成本下降，系统发生了突然的变化。区块链很合理地预期会触发与电子商务自 1990 年代末发明以来所产生的同样多的连锁反应。


    预测其发展方向很难。有谁预见到社交媒体的到来？谁会预测点击朋友的头像会取代在电视前花费的时间？预测者通常会高估事物的发生速度，而低估其长期影响。但区块链行业内部的规模感是，即将到来的变化将“与互联网最初的发明一样大”，这种说法可能并不夸大。我们可以预测的是，随着区块链的成熟，越来越多的人接受这种新的协作模式，它将扩展到从供应链到可证明公平的网络约会（消除假资料和其他不光彩手段的可能性）等一切领域。而且鉴于区块链在
    10 年内取得的进展，也许未来确实会比我们任何人想象的都要早到来。


    直到 1990 年代末，在互联网上安全处理信用卡是不可能的——电子商务根本不存在。区块链又能多快带来另一次革命性变化呢？请考虑迪拜的区块链战略（披露：我设计了它），即到
    2020 年在区块链上签发所有政府文件，其中大量初始项目早三年就已上线。在世界政府峰会上提出的“协议互联网”概念在此战略基础上，设想利用区块链来平滑因英国脱欧和美国退出跨太平洋伙伴关系协定而造成的一些波折，从而实现全球贸易的实质性转型。这些雄心勃勃的议程必须在实践中得到证明，但迪拜的预期是，成本节约和创新效益将远远超过实验成本。


    ## 2. 区块链简史


    正如 Mariana Mazzucato 在 *《创业国家》* 中所写的那样，创新的前沿，特别是基础设施，往往掌握在国家手中，而在区块链领域似乎注定如此。


    ### 要点


    区块链格局在短短 10 年内从比特币发展到智能合约再到权益证明系统。这些发展都指向未来交易成本的普遍降低。


    当交易成本降至某些阈值以下时，现有的商业模式会出现突然的、戏剧性的、难以预测的聚合和解体。


    预测者通常会高估技术的采用速度，而低估其长期影响。即使如此，区块链行业的观点是，即将到来的变化可能与互联网最初的发明一样大。


    政府和非政府组织已成为区块链创新的驱动力量。


