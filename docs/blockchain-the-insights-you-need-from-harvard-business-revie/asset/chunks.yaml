    # 8. 加密货币崛起，谁还需要银行？


    汇率，以及随之而来的价值不确定性，这引发了对货币贮藏价值的担忧。这必然限制了 Circle 和 Ripple 等初创公司的吸引力——这正是它们远离加密货币，并寻求将技术应用于传统货币并直接与银行和中央银行连接的原因。


    这一领域的金融科技公司将受益于新规，而新规可能成为真正的颠覆者。英国的开放银行倡议和欧盟的 PSD2 指令现在要求银行通过 API 向客户账户提供访问权限。这是关键性变化，因为它使除持币银行之外的各方也能执行转账：个人可以使用自己偏好的智能手机应用进行支付，而无需接受拥有独立货币余额甚至独立货币的世界。应用将通过
    API 访问相关账户，交易即可完成。


    实际上，新规将使货币职能分离。商业银行可能继续以传统货币持有我们的资金余额，并用这些余额向企业放贷，但交易可能由独立的支付技术中介，至少在最终用户看来如此。


    如果我们希望支付系统实现整合，是否还需要多个中介？为什么不直接将支付转账作为中央银行的功能呢？如果每个个人都在中央银行开设账户，且这些账户跨国互联，那将为整个经济体创建一个集中式账本，这无疑会提高支付的速度、安全性和效率。中央银行正在考虑这一想法，但迄今为止已得出结论，金融系统面临的风险非常高，而收益尚不确定。1
    如果真的发生，金融系统无疑将被彻底改变。


    ## 要点


    美元和其他储备货币历史上在作为交换媒介和价值储存方面都表现良好。加密货币在这两方面目前表现都不佳，但它们仍将为金融系统带来大量颠覆。


    人们使用现金的频率越来越低，而将货币数字化的新进入者则绕过了既有的金融体系。例如在东非，手机公司越过了银行成为支付中介。


    区块链作为数字化货币具有优势，因为它提供了传统支付转账系统的完整、自包含的替代方案；就好像所有比特币用户都在同一家银行开户。


    使用加密货币会带来挑战。用户需要担心汇率以及加密货币贮藏价值的不确定性。


    新规可能使货币的交换和储存职能分离。商业银行可能继续以传统货币持有我们的资金余额，并用这些余额向企业放贷，但交易可能由独立的支付技术中介。


