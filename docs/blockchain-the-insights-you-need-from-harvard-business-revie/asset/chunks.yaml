    # 8. As Cryptocurrencies Rise, Who Needs Banks?


    an exchange rate, and all the attendant uncertainty about value, which runs into
    concerns about the storage value of money. This necessarily limits the appeal
    of startups like Circle and Ripple—which is precisely why they have moved away
    from cryptocurrencies and are looking for ways to apply their technology to traditional
    currencies and link directly with banks and central banks.


    Fintech companies in this space will be aided by new regulation, which may prove
    to be the real disruptor. Both the Open Banking initiative in the U.K. and the
    PSD2 directive of the European Union now require banks to provide access, through
    APIs, to customers’ accounts. This is a critical change because it enables parties
    other than the banks holding money to effect transfers: Individuals can use their
    preferred smartphone app to make payments without having to embrace a world with
    separate money balances and possibly separate currencies. The app will access
    the relevant accounts through the APIs, and transactions can be completed.


    In effect, the new regulations will enable a separation of the functions of money.
    Commercial banks may continue to hold our money balances in traditional currencies
    and make loans to businesses with those balances, but transactions may be intermediated
    by a separate payment technology, at least in the eye of the final user.


    And if we want payment systems to be integrated, is there any need for multiple
    intermediaries? Why not simply make payment transfer a central bank function instead?
    If every individual had accounts at the central bank, and these were linked across
    countries, that would create a centralized ledger for an entire economy, which
    would certainly increase the speed, safety, and efficiency of payments. Central
    banks are considering this idea but so far have concluded that the risks to the
    financial system are very high and the benefits are uncertain. 1 If it happened,
    though, the financial system would without doubt be profoundly changed.


    ## TAKEAWAYS


    The U.S. dollar and other reserve currencies have historically performed well
    both as a medium of exchange and as a store of value. Cryptocurrencies don’t do
    well at either of these yet, but they’re still going to usher in a lot of disruption
    to the financial system.


    People are using cash less and less often, and new entrants that are digitizing
    money are bypassing the established financial system. In East Africa, for example,
    mobile phone companies leapfrogged banks as payment intermediaries.


    Blockchain has an advantage as a digitized currency because it offers a complete,
    self-contained alternative to the traditional payment transfer system; it is as
    if all bitcoin users are banking with the same bank.


    Using cryptocurrency presents challenges. Users need to worry about an exchange
    rate and uncertainty around the storage value of cryptocurrency.


    New regulations may enable a separation of the exchange and storage functions
    of money. Commercial banks may continue to hold our money balances in traditional
    currencies and make loans to businesses with those balances, but transactions
    may be intermediated by separate payment technologies.


