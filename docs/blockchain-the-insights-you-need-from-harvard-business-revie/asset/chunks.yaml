    *改编自发布在 hbr.org 上的内容，原发表于 2018 年 11 月 27 日*


    *(产品 #H04O38).*


    # 关于贡献者


    ROBLEH ALI 是 MIT 数字货币倡议的研究科学家。


    ALLISON BERKE 是斯坦福网络倡议的执行主任。


    MARC BLINDER 是基于区块链的初创公司 AIKON 的首席产品官。他开发了名为 MobilePlay 的社交网络（已售予 Good Technology），并在
    Context Optional 和 Efficient Frontier（已售予 Adobe）担任领导职务。请在 Twitter 上关注他 [@mblinder](https://twitter.com/mblinder?lang=en)。


    MICHAEL J. CASEY 是 *《加密货币时代：比特币和区块链如何挑战全球经济秩序》* 的作者。他是 MIT 媒体实验室数字货币倡议的高级顾问，也是
    Agentic Group 的合伙人。


    CHRISTIAN CATALANI 是 MIT 斯隆管理学院 Fred Kayne（1960）创业职业发展教授兼技术创新、创业与战略管理助理教授。Christian
    是 MIT 数字加密货币研究项目的首席研究员之一，该项目于 2014 年为所有 MIT 本科生提供了比特币访问权限。


    PRIMAVERA DE FILIPPI 是巴黎国家科学研究中心（CNRS）的永久研究员。她是哈佛法学院伯克曼·克莱因互联网与社会中心的研究员，在那里她研究“治理即设计”概念与其与在线分布式架构的关系。


    ANTONIO FATÁS 是 INSEAD 的教授。他也是英格兰伦敦经济政策研究中心的客座研究员。


    BRIAN FORDE 是 MIT 斯隆管理学院比特币和区块链高级讲师。他曾在奥巴马白宫担任移动和数据创新高级顾问，并在美国和平队服役后共同创办了尼加拉瓜最大的手机公司之一。Brian
    被评为全球青年领袖，并被世界经济论坛评为比特币和区块链领域最具影响力人物十强之一。


    VINAY GUPTA 是 Hexayurt Capital 的创始人，该基金投资于创建“协议互联网”。他在制定迪拜区块链战略中发挥了关键作用，主导了以太坊区块链平台的发布并发明了
    hexayurt 难民庇护所。


    CAMPBELL R. HARVEY 是杜克大学富夸商学院金融学教授兼 J. Paul Sticht 国际商务教授。他曾担任美国金融协会 2016 年主席。他是
    Man Group PLC 的投资策略顾问，也是 Research Affiliates LLC 的合伙人和高级顾问。


    MARCO IANSITI 是哈佛商学院 David Sarnoff 商务管理学教授，在那里他主持技术与运营管理单元和数字倡议。他为包括 Microsoft、Facebook
    和 Amazon 在内的许多科技公司提供咨询。


    JOICHI ITO 是 MIT 媒体实验室主任兼 MIT 媒体艺术与科学实践教授。


    KARIM R. LAKHANI 是哈佛商学院 Charles Edward Wilson 商务管理学教授兼 Dorothy 和 Michael Hintze
    院士。他也是哈佛创新科学实验室的创始主任。


    MICHAEL MAINELLI 是 Z/Yen Group 的执行主席。Z/Yen 自 1995 年以来一直从事互惠分布式账本工作。他的著作 *《鱼的价格：一种处理棘手经济问题和更好决策的新方法》*
    与 Ian Harris 合著，荣获 2012 年独立出版商图书奖金融、投资与经济金奖。


    CHRISTINE MOORMAN 是杜克大学富夸商学院 T. Austin Finch Sr. 商务管理学教授，也是 *《营销学杂志》* 的拟任主编。


    PATRICK MURCK 是哈佛大学伯克曼·克莱因互联网与社会中心的研究员，在那里他从事数字金融倡议工作并研究区块链、智能合约和金融科技的法律和政策影响。此外，Patrick
    还在全球律所 Cooley 担任特别顾问，隶属于金融科技团队。他被《国家法律杂志》评为“美国 50 位杰出总法律顾问”之一，也是国际货币基金组织金融科技高级别咨询组成员。


    NEHA NARULA 是 MIT 数字货币倡议的研究主任。


    STEPHEN J. OBIE 是 Jones Day 的合伙人，也是公司区块链计划的负责人。


    YUDAN PANG 是哈尔滨工业大学市场营销博士生。


    MARK W. RASMUSSEN 是 Jones Day 的合伙人，也是公司区块链计划的负责人。


    ALEX TAPSCOTT 是 Northwest Passage Ventures 的创始人兼首席执行官，该公司是区块链行业的咨询、顾问公司和投资者。他是
    *《区块链革命：比特币背后的技术如何改变货币、商业和世界》* 的合著者。请在 Twitter 上关注他 [@alextapscott](https://twitter.com/alextapscott%0D%0A)。


    DON TAPSCOTT 是 *《维基经济学》*、*《数字经济》* 以及十多本关于技术、商业和社会的获奖著作的畅销书作者。根据 Thinkers50，Don
    是世界上最重要的四位在世管理思想家之一；他是罗特曼管理学院的兼职教授，也是 Trent 大学的校长。他与儿子 Alex 合著了 *《区块链革命：比特币背后的技术如何改变货币、商业和世界》*。请在
    Twitter 上关注他 [@dtapscott.](https://twitter.com/dtapscott%0D%0A)


    MARC TOLEDO 是专注于区块链和数字转型的普华永道高级顾问。在他在世界银行和苹果的先前工作中，他领导了与网络安全、机器学习和人工智能相关的多个大型项目。


    CATHERINE TUCKER 是 MIT 斯隆管理学院管理科学杰出教授。


    BEATRICE WEDER DI MAURO 是德国美因茨大学经济政策与国际宏观经济学讲席教授。她也是 INSEAD 新兴市场研究所的研究员，以及英格兰伦敦经济政策研究中心的研究员。


    PINDAR WONG 是 VeriFi Ltd. 的董事长，该公司是一家低调的互联网金融基础设施咨询公司，也是 OBOR.IO 的创始人，该公司开创了“
    Belt and Road Blockchain”。他是比特币协议爱好者，并担任 ScalingBitcoin.org 主席。


