    **IDENTITIES IN A DIGITAL WORLD**


    by Michael Mainelli


    “Who are you?” may well be the world’s most frequently asked question. On a website,


    in a nightclub, at an airport, or in front of a bank counter, everyone wants us
    to prove


    that we are who we say we are.


    But 2.4 billion poor people worldwide, about 1.5 billion of whom are over the
