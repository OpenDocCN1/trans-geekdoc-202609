    双方对彼此的动机和做法都心存戒备，因此很难达成妥协。但如果政府和新兴技术公司使用公共区块链，双方都能实现各自想要的目标。公司可以快速发展，而消费者安全和权利将得到保护。


    正如受人尊敬的风险投资家和作者 Tim O’Reilly 所说，“法规规定了如何更详细地执行法律，应被视为与程序员对待其代码和算法的方式大致相同——也就是说，作为实现法律中规定的结果的不断更新的工具集。”
