    to corruption and crime, including people trafficking and slavery. (Insightfully,
    the United


    Nations is aiming to change this, with UN Sustainable Development Goal #16, Peace,


    Justice, and Strong Institutions, aiming to “provide legal identity to all, including
    birth


    registration, by 2030.”)


    Globalization and population growth increase the pressure to find cost-effective
    solutions


    to prove identity. Recent advances in biometrics, from iris scanning to DNA analysis
    and


    voice pattern recognition, are likely to play an important technical role in fixing
    this, yet


    identity is not necessarily something that *is* fixed. Our identities are records
    of our past


    behavior, and they change over time. Our identities can also vary depending on
    who is


    doing the identifying. For example, the tax office probably has little interest
    in your


    school report cards but may care enormously about the days you spent out of the
