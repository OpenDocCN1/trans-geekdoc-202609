    # 9. 全球供应链即将因区块链而变得更好


    供应商可以被授予特殊的加密权限，这些权限在置于区块链环境中时将表现为唯一的、可追溯的标识符——最好是加密的，以保护员工的个人信息。这将使供应链社区的所有成员能够监控彼此持证人员的活动。


    Chipotle 例如，可以实时看到其牛肉供应商拥有的设施中一名持有适当资质的人员是否正在执行适当的杀菌和消毒程序。


    这种可证明的、透明的资质认证对于增材制造尤其重要，增材制造是所谓的工业 4.0 运动中动态、按需生产模式的核心。精密零件制造商 Moog Inc. 的一个团队推出了名为
    VeriPart 的服务，旨在克服其增材制造与创新部门主管 James Regenor 向我们描述的挑战：“美国航空母舰上的维修人员如何能绝对确信，他们下载用于
    3D 打印战斗机新零件的软件文件没有被外国对手黑客入侵？”这凸显了区块链技术最有说服力的论点之一：没有其对信任问题的解决方案，许多人预测的复杂、去中心化、物联网驱动的经济可能根本无法实现。


    这些由迄今为止不可用的信息所推动的潜在效率提升表明，区块链技术可能为各地的公司带来巨大的节省。但首先必须克服重大的障碍。


    一个挑战在于该技术的开发和治理。理想情况下，为了鼓励自由访问、竞争和开放创新，全球供应链应有选择锚定到没有任何实体控制的公共区块链。换句话说，从商业和生产活动中提取的数据将被加密记录在开放账本中。但不可避免的是，由公司联盟运营的私有、封闭账本也会出现，因为其成员寻求保护市场份额和利润。这两种要求都带来了挑战。首先，实现最重要公共区块链——数字货币服务
    bitcoin 和智能合约平台 Ethereum——的全球经济容量受到其开源社区分歧的制约，使得就协议升级达成一致变得困难。其次，需要在私有和公共区块链之间实现互操作性，这将需要标准和协议。


    另一个重大障碍：法律。复杂的法规、海洋法和商法体系规范着世界航运路线及其多个司法管辖区沿线的所有权和占有权利。将那个旧世界的法律体系以及管理它的以人为导向的机构，与区块链和智能合约的数字定义、非物质化、自动化和去国家化特性相结合将是困难的。甚至在各国政府能够被说服支持这一努力并以全球协调的方式进行之前，行业必须在国际边界和司法管辖区之间就技术和合同结构的最佳实践和标准达成一致。在香港，一带一路区块链联盟寻求通过采用
    ICANN（互联网名称与数字地址分配机构，负责管理域名）开创并测试的互联网治理方法来为这一过程带来秩序。作为一个国际、私营部门主导的机构，ICANN 已证明自己是有效的全球管理者和仲裁者。


    这些挑战必须与全球经济的需求相权衡，该经济自 2008 年金融危机以来一直面临挑战，并正在美国和欧洲助长瓦解的孤立主义力量。任何承诺通过消除遏制贸易的商业间摩擦来抵消这些趋势，同时也增强企业及其客户的透明度和控制权的系统都值得深入探索。这就是为什么越来越多的投资者、企业、学者甚至政府开始将区块链技术视为经济复苏急需的平台。


    ## TAKEAWAYS


    大量初创公司和企业正在探索在全球供应链中使用区块链来转移所有权、记录权限并记录活动，以跟踪并加快企业之间以及跨境的货物和服务流动。


    这种分布式跟踪和管理系统的基本优势在于，它解决了利益不一定一致的各方之间的披露和问责问题。相互重要的数据可以实时可靠地更新，消除了与彼此内部记录进行核对的需要。


    治理、私有和公共区块链之间的协作、互操作性以及法律挑战可能会阻碍这些技术的采用。


    *Adapted from content posted on hbr.org, originally published March 13, 2017 (product
    #H03J07).*


    # 10. 区块链对共享经济意味着什么


    *by Primavera De Filippi*


    看看当今互联网巨头的运作方式——例如 Google、Facebook、Twitter、Uber 或 Airbnb——你会注意到它们有一个共同点：它们依赖用户的贡献作为在其平台内创造价值的手段。


    在过去 20 年里，经济逐渐远离传统的集中式组织模式，在该模式下，拥有主导地位的大型运营商通常负责为一群被动消费者提供服务。今天，我们正转向一种日益去中心化的组织新模式，在这种模式下，大型运营商负责聚合多个人的资源，为一群更加活跃的消费者提供服务。这种转变标志着一个新一代“非物质化”组织的出现，它们不需要实体办公室、资产甚至员工。


    这种模式的问题在于，在大多数情况下，群众创造的价值并没有在所有为价值生产做出贡献的人之间平等再分配；所有利润都被运营平台的大型中介捕获。


    最近，一种可能改变这种不平衡的新技术出现了。区块链以安全和去中心化的方式促进价值交换，而无需中介。


    但区块链技术最具革命性的方面是它可以以安全和去中心化的方式运行软件。有了区块链，软件应用程序不再需要在集中式服务器上部署：它们可以在不受任何单一方控制的点对点网络上运行。这些基于区块链的应用程序可用于协调大量个人的活动，他们可以在没有第三方帮助的情况下自行组织。区块链技术最终是个人协调共同活动、直接相互互动并以更安全、更去中心化的方式自我治理的手段。


    已经有相当数量的应用程序部署在区块链上。例如，Akasha、Steem.io 或 Synereo 都是分布式社交网络，像 Facebook 一样运作，但没有中央平台。它们不依赖集中式组织来管理网络并规定应显示哪些内容

