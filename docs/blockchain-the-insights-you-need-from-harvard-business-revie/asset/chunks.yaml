    About the Contributors


    **About the Contributors**


    ROBLEH ALI is a research scientist at the MIT Digital Currency Initiative.


    ALLISON BERKE is the executive director of the Stanford Cyber Initiative.


    MARC BLINDER is chief product officer of blockchain-based startup AIKON. He


    developed a social network called MobilePlay (sold to Good Technology) and held


    leadership roles at Context Optional and Efficient Frontier (sold to Adobe). Follow
    him


    on Twitter [@mblinder](https://twitter.com/mblinder?lang=en).


    MICHAEL J. CASEY is the author of *The Age of Cryptocurrency: How Bitcoin and
    the*


    *Blockchain Are Challenging the Global Economic Order*. He is a senior adviser
    at the


    MIT Media Lab’s Digital Currency Initiative and a partner with Agentic Group.


    CHRISTIAN CATALANI is the Fred Kayne (1960) Career Development Professor of


    Entrepreneurship and Assistant Professor of Technological Innovation, Entrepreneurship,


    and Strategic Management at the MIT Sloan School of Management. Christian is one
    of


    the principal investigators of the MIT Digital Currencies Research Study, which
    gave all


    MIT undergraduate students access to bitcoin in 2014.


    PRIMAVERA DE FILIPPI is a permanent researcher at the National Center of Scientific


    Research (CNRS) in Paris. She is faculty associate at the Berkman Klein Center
    for


    Internet & Society at Harvard Law School, where she is investigating the concept
    of


    “governance-by-design” as it relates to online distributed architectures.


    ANTONIO FATÁS is a professor at INSEAD. He is also a research fellow at the Centre


    for Economic and Policy Research in London, England.


    BRIAN FORDE is senior lecturer for bitcoin and blockchain at the MIT Sloan School
    of


    Management. He was senior adviser for mobile and data innovation in the Obama
    White


    House and cofounded one of the largest phone companies in Nicaragua after serving
    in


    the U.S. Peace Corps. Brian was named a Young Global Leader and one of the 10
    most


    influential people in bitcoin and blockchain by the World Economic Forum.


    VINAY GUPTA is the founder of Hexayurt Capital, a fund that invests in creating
    the


    Internet of Agreements. He was instrumental in creating the Dubai Blockchain Strategy,


