    technology and its business use cases evolve. The first is novelty—the degree
    to which an application is new to the world. The more novel it is, the more effort
    will be required to ensure that users understand what problems it solves. The
    second dimension is complexity, represented by the level of ecosystem coordination
    involved—the number and diversity of parties that need to work together to produce
    value with the technology.


    For example, a social network with just one member is of little use; a social
    network is worthwhile only when many of your own connections have signed on to
    it. Other users of the application must be brought on board to generate value
    for all participants. The same will be true for many blockchain applications.
    And, as the scale and impact of those applications increase, their adoption will
    require significant institutional change.


    We’ve developed a framework that maps innovations against these two contextual
    dimensions, dividing them into quadrants. (See figure 1-1.) Each quadrant represents
    a stage of technology development. Identifying which one a blockchain innovation
    falls into will help executives understand the types of challenges it presents,
    the level of collaboration and consensus it needs, and the legislative and regulatory
    efforts it will require. The map will also suggest what kind of processes and
    infrastructure must be established to facilitate the innovation’s adoption. Managers
    can use it to assess the state of blockchain development in any industry, as well
    as to evaluate strategic investments in their own blockchain capabilities.


    ### FIGURE 1-1


    How foundational technologies take hold


    The adoption of foundational technologies typically happens in four phases. Each
    phase is defined by the novelty of the applications and the complexity of the
    coordination efforts needed to make them workable. Applications low in novelty
    and complexity gain acceptance first. Applications high in novelty and complexity
    take decades to evolve but can transform the economy. TCP/IP technology, introduced
    on ARPANET in 1972, has already reached the transformation phase, but blockchain
    applications (in white) are in their early days.


    ![](index-17_1.jpg)


    ### Single use


    The low-novelty and low-coordination applications in the first quadrant create
    better, less costly, highly focused solutions. Email, a cheap alternative to phone
    calls, faxes, and snail mail, was a single-use application for TCP/IP (even though
    its value rose with the number of users). Bitcoin, too, falls into this quadrant.
    Even in its early days, bitcoin offered immediate value to the few people who
    used it simply as an alternative payment method.


    (You can think of it as a complex email that transfers not just information but
    also actual value.) At the end of 2016 the value of bitcoin transactions was expected
    to hit $92 billion. That’s still a rounding error compared with the $411 trillion
    in total global payments, but bitcoin is growing fast and increasingly important
    in contexts such as instant payments and foreign currency and asset trading, where
    the present financial system has limitations.


