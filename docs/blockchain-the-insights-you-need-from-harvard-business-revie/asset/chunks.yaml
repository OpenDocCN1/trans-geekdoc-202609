    # 11. 区块链如何帮助营销人员与客户建立更好的关系


    除非他们的工作在拥有订阅者的在线渠道上展示，否则几乎收不到或收不到钱。）


    在所有这些场景中，内容创作者能够制作与其成功程度成比例估值的相关作品。


    Coupit 等公司正准备最大化这种改进内容的影响。Coupit 的基于区块链的技术允许营销人员加入选择加入的消费者忠诚度和联盟计划，这些消费者可以相互交易奖励。营销人员获得了可见性和透明度，以区分休眠客户和忠诚客户，从而扩展其策略，为每个群体发送有针对性的优惠。


    即使需要数据聚合商或分析中介，微支付也将使公司能够绕过广告拦截。个人将控制他们分享的个人信息的数量，并将直接因广告曝光而获得奖励，许多隐私问题将得到合理缓解。


    一个例子是 Brave，这是一款由 Mozilla 项目联合创始人、JavaScript 语言创建者 Brendan Eich 创建的新网络浏览器。除了提供新的隐私和安全级别外，Brave
    还正在启用一个基于区块链的系统，旨在改变用户、广告商和内容创作者之间的关系。基本注意力代币（BATs）将允许出版商货币化增值服务并获取与广告相关的部分增长，其中
    73% 由 Facebook 和 Google 主导。


    ## 更好的公司和消费者成果


    随着区块链走向主流，所有中介机构都需要调整其商业模式。决策链将被结构性改变：个人将对如何分享个人信息以及如何花费时间与广告商互动拥有更多控制权。垃圾邮件和网络钓鱼诈骗将因其自身特性而停止——垃圾邮件发送者发送的垃圾邮件越多，从经济角度来看就越不可持续。对于公司而言，这可能意味着对其所有营销工作入站流量的质量拥有更高水平的控制，以及对客户行为的急需的更深入理解。


    另一方面，广告曝光不会在没有向每个受影响个人进行交易性付款的情况下强加。消费者也会有动力在线发布准确的社交资料——详细说明他们感兴趣的内容——因为他们会因此获得报酬。营销人员将直接向消费者付款——而不是社交媒体中间层。针对高价值客户时，激励措施也会相应提高。


    区块链技术有可能使社会变得更值得信赖和更有能力，增加可见性，连接各方，并奖励个人对交易的贡献。营销和广告从根本上受到这些变化的影响。寻找设计和实施措施以实现区块链相关转型的方法，不仅应成为首席营销官的优先事项，也应成为所有战略、财务和技术决策者的优先事项。在运营上，公司可能能够与个人建立新的信任水平，并最终以区块链不可实现的方式和规模将产品和服务与消费者联系起来。


    营销和技术领导者有潜力利用区块链重新打造客户关系。对这一深远技术的早期行动将使公司处于最佳位置，以从我们认为将广泛采用的情况中受益。


    ## 要点


    区块链缩小支付摩擦并使中介机构淡出其视野的能力意味着它有巨大的潜力颠覆营销。


    区块链支持的技术可以让营销人员收回因广告拦截而损失的收入，并通过采用一种新模式来打破 Google-Facebook 广告双头垄断：通过微支付直接向消费者支付其注意力的费用。


    通过区块链进行的欺诈验证，配以微支付系统，可以减少垃圾邮件和网络钓鱼邮件，解决假社交媒体账户的问题，并防止拒绝服务攻击。


    区块链可以加强在线编辑内容的拥有权和版权保护，允许内容创作者，无论是专业还是业余，都能对其创作获得公平的补偿。


    ## 注释


    1. The CMO Survey, “Highlights and Insights Report,” February 2018, https://cmosurvey.org/results/february-2018/

    2. Mimi An, “Why People Block Ads (and What It Means for Marketers and Advertisers),”
    Hubspot, July 13, 2016, https://blog.hubspot.com/news-trends/why-people-block-ads-and-what-it-means-for-marketers-and-advertisers

    3. Jessica Davies, “Uh-oh: Ad Blocking Forecast to Cost $35 Billion by 2020,”
    Digiday, June 7, 2016, https://digiday.com/uk/uh-oh-ad-blocking-forecast-cost-35-billion-2020/

    4. “Google’s Average Revenue per Monthly Active User from 1st Quarter 2015 to
    4th Quarter 2016 (in U.S. Dollars),” Statista, https://www.statista.com/statistics/306570/google-annualized-advertising-arpu/


    *摘自发布在 hbr.org 上的内容，原刊于 2018 年 10 月 1 日（产品编号 #H04K0R）。*


    # 12. 区块链可以帮助艺术家从其创意作品中获得更多利润


    by Don Tapscott and Alex Tapscott


    任何关注文化产业——艺术、音乐、出版、戏剧、电影——的人都知道艺术家与其才能的受益者之间的争斗。例如，电影制作的传统食物链很长：在创作电影的人和为其付费的人——电影观众、有线电视订阅者、按次付费观众、广告商、权利许可方以及国家艺术基金会等机构赞助商——之间存在大量中间商：在线零售商（Amazon、Walmart）、流媒体视频服务（Netflix、YouTube、Hulu）、影院场所（Wanda’s
    AMC、Regal、Cinemark）、产品植入和媒体代理（Propaganda GEM、Omnicom 的 OMD）、电影制作公司（Columbia Pictures、Marvel
    Studios、Disney-Pixar）、电影发行商（Sony Pictures、Universal、Warner Bros.）、家庭营销商（Fox、HBO）、有线和卫星服务（Comcast、DIRECTV）、视频分销商（PMI、TVS）、电影资料馆和档案馆（Eastman
    House、Getty Images）以及经纪公司（WME、CAA、ICM），每个都有自己的合同和会计系统。这是一个令人震惊的长名单。


    这些中间商中的每一个都从收入中抽取一部分并转交剩余部分，剩下的通常要等到几个月后根据合同条款才到达艺术家本人。


    这种喂食狂欢中的权力如此集中，以至于许多演员通过在现有行业模式内创办自己的公司而将自己从菜单上撤下。音乐也是如此。例如，格莱美获奖歌手兼词曲作者 Imogen
    Heap 在该领域是一个先驱，她推出了 Mycelia，这是一个集思想与行动于一体的智库，其目标是“利用区块链赋予一个公平、可持续且充满活力的音乐产业生态系统，该生态系统涉及所有在线音乐互动服务”。


