    breakthroughs hits society, things are sure to get a little weird. Self-driving
    cars and drones will use blockchains to pay for services like charging stations
    and landing pads.


    International currency transfers will go from taking days to an hour, and then
    to a few minutes, with a higher degree of reliability than the current system
    has been able to manage.


    These changes, and others, represent a pervasive lowering of transaction costs.
    When transaction costs drop past invisible thresholds, there will be sudden, dramatic,
    hard-to-predict aggregations and disaggregations of existing business models.
    For example, auctions used to be narrow and local, rather than universal and global,
    as they are now on sites like eBay. As the costs of reaching people dropped, there
    was a sudden change in the system. Blockchain is reasonably expected to trigger
    as many of these cascades as e-commerce has done since it was invented, in the
    late 1990s.


    Predicting what direction it will all take is hard. Did anybody see social media
    coming? Who would have predicted that clicking on our friends’ faces would replace
    time spent in front of the TV? Predictors usually overestimate how fast things
    will happen and underestimate the long-term impacts. But the sense of scale inside
    the blockchain industry is that the changes coming will be “as large as the original
    invention of the internet,” and this may not be overstated. What we can predict
    is that as blockchain matures and more people catch on to this new mode of collaboration,
    it will extend into everything from supply chains to provably fair internet dating
    (eliminating the possibility of fake profiles and other underhanded techniques).
    And given how far blockchain has come in 10 years, perhaps the future could indeed
    arrive sooner than any of us think.


    Until the late 1990s it was impossible to process a credit card securely on the
    internet—e-commerce simply did not exist. How fast could blockchain bring about
    another revolutionary change? Consider that Dubai’s blockchain strategy (disclosure:
    I designed it) is to issue all government documents on blockchain by 2020, with
    substantial initial projects going live three years earlier. The Internet of Agreements
    concept presented at the World Government Summit builds on this strategy to envision
    a substantial transformation of global trade, using blockchains to smooth out
    some of the bumps caused by Brexit and the U.S. withdrawal from the Trans-Pacific
    Partnership. These ambitious agendas will have to be proven in practice, but the
    expectation in Dubai is that cost savings and innovation benefits will more than
    justify the cost of experimentation.


    ## 2. A Brief History of Blockchain


    As Mariana Mazzucato writes in *The Entrepreneurial State*, the cutting edge of
    innovation, particularly in infrastructure, is often in the hands of the state,
    and that seems destined to be true in the blockchain space.


    ### TAKEAWAYS


    The blockchain landscape has grown from bitcoin to smart contracts to proof-of-stake
    systems in just 10 years. These developments all point to a pervasive lowering
    of transaction costs in the future.


    When transaction costs drop past certain thresholds, there will be sudden, dramatic,
    hard-to-predict aggregations and disaggregations of existing business models.


    Predictors usually overestimate how fast technologies will be adopted and underestimate
    their long-term impacts. Even so, the thinking in the blockchain industry is that
    the changes coming may be as large as the original invention of the internet.


    Governments and NGOs are already a driving force in blockchain innovation.


