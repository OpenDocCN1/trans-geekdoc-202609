    # 区块链如何改变金融


    如果风险投资的世界能在一年内发生根本性变化，还有什么不能被改造？区块链可能颠覆行业中的许多复杂中间职能：身份和声誉、转移价值（支付和汇款）、存储价值（储蓄）、借贷（信贷）、交易价值（类似股票交易所的市场）、保险和风险管理，以及审计和税务职能。


    这是否意味着我们所知银行的终结？这取决于既有机构如何反应。区块链对那些拥抱新技术范式并从内部进行颠覆的人来说并不是生存威胁。问题是，金融服务业中谁将引领革命？纵观历史，老范式的主导者一直难以拥抱新事物。为什么
    AT&T 没有推出 Skype，或 Visa 没有创建 PayPal？CNN 本可以建立 Twitter，因为它全是关于金句。通用汽车或赫兹本可以推出 Uber；万豪本可以发明
    Airbnb。区块链技术这股不可阻挡的力量正席卷现代金融的基础设施。如同之前的范式转移一样，区块链将创造赢家和输家。个人而言，我们希望不可避免的碰撞能将旧的赚钱机器转变为全民繁荣平台。


    加密货币允许任何两个或更多方在不依赖中介验证身份、建立信任并执行其他行政任务的情况下缔结协议、进行交易并创造价值。


    区块链使任何规模的公司都能通过首次代币发行（ICO）以点对点、全球、分布式的方式筹集资金。


    区块链可能颠覆金融行业中的许多复杂中间职能，但这是否意味着我们所知银行的终结，可能取决于既有机构如何反应。区块链对那些拥抱新技术范式并从内部进行颠覆的公司来说并不是生存威胁。


    ## 要点


    我们陈旧的金融体系效率低下，易受攻击，具有排他性，且抗拒变革。区块链可以为这一创新瓶颈提供解决方案。


