    # 关于区块链的真相


    除了其他虚拟货币，区块链是一个开放的、分布式的账本，可以高效地以可验证和永久的方式记录双方之间的交易。账本本身也可以被编程以自动触发交易。（参见侧边栏“区块链的工作原理”。）


    ## 区块链的工作原理


    以下是该技术的五项基本原则。


    ### 1. 分布式数据库

    区块链上的每个参与方都可以访问整个数据库及其完整历史记录。没有任何一方控制数据或信息。每个参与方都可以直接验证其交易伙伴的记录，而无需中介。


    ### 2. 点对点传输

    通信直接在对等方之间进行，而不是通过中央节点。每个节点都会将信息存储并转发给所有其他节点。


    ### 3. 透明性与假名性

    每个交易及其相关价值对系统中任何访问者都是可见的。区块链上的每个节点或用户都有一个唯一的、30 多个字符的字母数字地址来标识其身份。用户可以选择保持匿名或向他人证明其身份。交易发生在区块链地址之间。


    ### 4. 记录不可逆性

    一旦交易被输入数据库并更新账户，记录就无法更改，因为它们与之前的所有交易记录相链接（因此得名“链”）。各种计算算法和方法被部署以确保数据库上的记录是永久的、按时间顺序排列的，并且对网络上的其他所有人可用。


    ### 5. 计算逻辑

    账本的数字特性意味着区块链交易可以与计算逻辑相联系，本质上是可以被编程的。因此，用户可以设置算法和规则，自动触发节点之间的交易。


    有了区块链，我们可以设想一个世界，在其中合同被嵌入数字代码并存储在透明的共享数据库中，在那里它们受到防删除、防篡改和防修改的保护。在这个世界里，每一份协议、每个流程、每项任务和每一笔付款都将拥有可被识别、验证、存储和共享的数字记录和签名。律师、经纪人和银行家等中介可能不再必要。个人、组织、机器和算法将能够自由地以极少的摩擦进行交易和互动。这就是区块链的巨大潜力。


    的确，几乎每个人都听过区块链将革新商业并重新定义公司和经济的说法。虽然我们对它的潜力同样充满热情，但我们担心炒作。让我们担忧的不仅仅是安全问题（例如 2014
    年一家比特币交易所的崩溃以及最近其他交易所的黑客攻击）。我们研究技术创新的经验告诉我们，如果要实现区块链革命，许多障碍——技术、治理、组织乃至社会层面的——都必须被消除。在不了解其可能如何扎根的情况下贸然投入区块链创新将是一个错误。


    我们认为，由区块链主导的商业和政府转型仍需数年时间。这是因为区块链不是一种“颠覆性”技术，后者可以用更低成本的解决方案攻击传统商业模式并迅速取代现有企业。区块链是一种*基础*技术：它有潜力为我们的经济和社会系统创造新的基础。但尽管影响将是巨大的，区块链渗透到我们的经济和社会基础设施中仍需要数十年时间。


    采用过程将是渐进而稳定的，而非突然的，随着技术和制度变革的浪潮积聚势头。那种洞见及其战略意义正是本文将要探讨的内容。


    ## 技术采用模式


    在深入区块链战略和投资之前，让我们反思一下我们对技术采用的了解，特别是其他基础技术典型的转型过程。其中最相关的例子之一是分布式计算机网络技术，体现在 TCP/IP（传输控制协议/互联网协议）的采用上，它为互联网的发展奠定了基础。


    1972 年推出，TCP/IP 最初在一种*单一用途*案例中获得 traction：作为 ARPANET 研究人员之间电子邮件的基础，ARPANET 是美国国防部商业互联网的前身。在
    TCP/IP 之前，电信架构基于“电路交换”，其中两个当事人或机器之间的连接必须在交换过程中预先建立并持续维持。为了确保任意两个节点能够通信，电信服务提供商和设备制造商已投入数十亿美元建设专用线路。


    TCP/IP 颠覆了这一模式。新的协议通过将信息数字化并拆分为非常小的包来传输信息，每个包都包含地址信息。一旦释放到网络中，数据包可以采用任何路线到达接收方。网络边缘的智能发送和接收节点可以拆分和重新组装数据包并解释编码数据。无需专用私人线路或庞大基础设施。TCP/IP
    创建了一个开放的、共享的公共网络，没有任何中央权威或负责其维护和改进的方。


    传统电信和计算部门对 TCP/IP 持怀疑态度。很少有人想象在新架构上可以建立稳健的数据、消息、语音和视频连接，或相关系统可以安全且扩展。但在 20 世纪
    80 年代末和 90 年代，Sun、NeXT、Hewlett-Packard 和 Silicon Graphics 等越来越多的公司使用 TCP/IP，部分是为了在组织内部创建*本地化*的私有网络。为此，他们开发了构建模块和工具，使其用途超越电子邮件，逐渐取代更传统的本地网络技术和标准。随着组织采用这些构建模块和工具，它们看到了生产力的显著提升。


    随着 20 世纪 90 年代中期万维网的出现，TCP/IP 进入了广泛的公众使用。新的技术公司迅速出现，提供“管道”——连接现在公共网络并交换信息所需的硬件、软件和服务。Netscape
    将浏览器、Web 服务器和其他工具和组件商业化，有助于互联网服务和应用的开发和采用。Sun 推动了 Java 应用编程语言的发展。随着网络上的信息呈指数级增长，Infoseek、Excite、AltaVista
    和 Yahoo 应运而生，以引导用户浏览。


    一旦这一基础基础设施达到临界规模，新一代公司利用低成本连接，通过创建对现有企业具有吸引力的*替代*互联网服务来获益。CNET 将新闻搬到网上。亚马逊提供的图书比任何书店都多。Priceline
    和 Expedia 使购买机票变得更容易，并为该过程带来了前所未有的透明度。这些新进入者能够以相对较低的成本获得广泛覆盖的能力，对报纸和实体零售商等传统企业施加了巨大压力。


    依靠广泛的互联网连接，下一个浪潮的公司创建了新颖的、*变革性*的应用，从根本上改变了企业创造和获取价值的方式。这些公司建立在新的点对点架构之上，并通过协调用户的分布式网络来创造价值。想想
    eBay

