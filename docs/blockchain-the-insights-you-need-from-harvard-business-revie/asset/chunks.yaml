    # 1. 区块链的真相


    通过拍卖改变了在线零售，Napster 改变了音乐产业，Skype 改变了电信业，而 Google 通过利用用户生成的链接提供更相关结果，改变了网络搜索。


    最终，TCP/IP 花了超过 30 年才经历所有阶段——单一使用、本地化使用、替代和转型——并重塑经济。今天，全球最有价值的上市公司中超过一半拥有由互联网驱动的、基于平台的商业模式。我们经济的根本基础已经改变。


    物理规模和独特的知识产权不再赋予无可匹敌的优势；日益成为经济领袖的是充当“keystones”的企业，它们主动组织、影响和协调广泛的社区、用户和组织网络。


    ## 新架构


    区块链——一种建立在互联网之上的点对点网络——于 2008 年 10 月作为比特币提案的一部分被提出，比特币是一种虚拟货币系统，它摒弃了中央机构发行货币、转移所有权和确认交易。比特币是区块链技术的第一个应用。


    区块链与 TCP/IP 之间的相似之处很明显。正如电子邮件实现了双边消息传递，比特币实现了双边金融交易。区块链的开发和维护是开放的、分布式的和共享的——就像
    TCP/IP 一样。全球一支志愿者团队维护核心软件。就像电子邮件一样，比特币最初在热情但相对较小的社区中流行起来。


    TCP/IP 通过大幅降低连接成本释放了新的经济价值。同样，区块链也可能大幅降低交易成本。它有可能成为所有交易的记录系统。如果那样发生，经济将再次经历根本性转变，因为新的基于区块链的影响力和控制来源出现。


    考虑一下现在的商业运作方式。保存交易的持续记录是任何企业的核心职能。这些记录追踪过去的行动和绩效，并指导未来的规划。它们不仅提供组织内部运作方式的视角，也提供组织外部关系的视角。每个组织都保存自己的记录，而且是私有的。许多组织没有所有活动的总账；相反，记录分布在内部部门和职能中。问题是，在各个独立且私有的账本之间核对交易需要花费大量时间且容易出错。


    例如，典型的股票交易可以在微秒内执行，通常无需人工干预。然而，结算——股票的所有权转移——可能长达一周。这是因为各方无法访问彼此的账本，也无法自动验证资产是否确实拥有并可转移。相反，一系列中介机构在交易记录穿越组织、账本分别更新的过程中充当资产担保人。


    在区块链系统中，账本被复制到大量相同的数据库中，每个数据库由一个感兴趣的各方托管和维护。当在一份副本中输入更改时，所有其他副本会同时更新。因此，随着交易的进行，交换的价值和资产的记录会永久录入所有账本。无需第三方中介来验证或转移所有权。如果股票交易发生在基于区块链的系统上，它将在几秒钟内完成结算，且安全可验证。（臭名昭著的攻击比特币交易所的黑客事件暴露的弱点并非区块链本身，而是与使用区块链的各方相关联的独立系统。）


    ## 区块链采用框架


    如果比特币像早期的电子邮件，那么区块链是否还需要几十年才能达到其全部潜力？我们认为答案是有限制的“是”。我们无法准确预测转型需要多少年，但我们可以猜测哪些类型的应用会首先获得关注，以及区块链的广泛接受最终将如何实现。


    在我们的分析中，历史表明有两个维度会影响基础技术及其商业用例的演变。第一个是新颖性——应用对世界而言的新程度。越新颖，就需要付出更多努力来确保用户理解它解决了什么问题。第二个维度是复杂性，由涉及的生态系统协调水平表示——需要共同合作以利用技术创造价值的各方数量和多样性。


    例如，仅有一个成员的社交网络用处不大；社交网络只有在你自己的许多联系人都加入后才有价值。必须让其他应用用户加入，才能为所有参与者创造价值。许多区块链应用也将如此。随着这些应用的规模和影响力增加，它们的采用将需要重大的制度变革。


    我们开发了一个框架，将创新映射到这两个情境维度，并将其分为四个象限。（参见图 1-1。）每个象限代表技术发展的阶段。确定区块链创新属于哪一个象限，将有助于高管了解它带来的挑战类型、所需的协作和共识水平，以及所需的立法和监管工作。该地图还将提示必须建立何种流程和基础设施以促进创新的采用。管理者可以用它来评估任何行业的区块链发展状况，以及评估自身区块链能力的战略投资。


    ### 图 1-1


    基础技术如何确立


    基础技术的采用通常发生在四个阶段。每个阶段由应用的新颖性和使其可行所需的协调努力的复杂性定义。新颖性和复杂性较低的应用首先获得接受。新颖性和复杂性较高的应用需要数十年才能演变，但可以改变经济。1972
    年在 ARPANET 上引入的 TCP/IP 技术已达到转型阶段，但区块链应用（in white）仍处于早期阶段。


    ![](img/index-17_1.jpg)


    ### 单一使用


    第一象限中低新颖性和低协调性的应用创造了更好、成本更低、高度集中的解决方案。电子邮件，作为电话、传真和 snail mail 的廉价替代品，是 TCP/IP
    的单一用途应用（尽管其价值随用户数量增加而上升）。比特币也落入这一象限。即使在早期，比特币作为一种替代支付方式，也为少数使用者提供了即时价值。


    （你可以把它想成一封复杂的电子邮件，不仅传输信息，还传输实际价值。）到 2016 年底，比特币交易价值预计将达到 $92 billion。与 $411 trillion
    的总全球支付相比，这仍然是微不足道的，但比特币增长迅速，在即时支付和外汇及资产交易等当前金融系统存在局限性的背景下变得越来越重要。


    ### 本地化


    第二象限包括相对新颖但只需有限数量用户即可创造即时价值的创新，因此推广其采用相对容易。如果区块链遵循网络技术所走的道路

