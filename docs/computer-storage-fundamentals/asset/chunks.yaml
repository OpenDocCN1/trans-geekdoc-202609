    **版权所有 © BPB Publications, India**\n**eISBN: 978-93-65893-137**\n保留所有权利。未经出版商事先书面许可，不得以任何形式或任何方式复制、分发或传播本出版物的任何部分，或将其存储于数据库或检索系统中，但程序清单除外，程序清单可录入计算机系统、存储和执行，但不得通过出版、复印、录制或任何电子和机械手段复制。\n\
    ## 责任限制与免责声明\n本书所含信息据作者和出版商所知属实且正确。作者已竭尽全力确保这些出版物的准确性，但出版商不对因本书中的任何信息而导致的任何损失或损害承担责任。\n\
    书中提及的所有商标均被确认为其各自所有者的财产，但 BPB Publications 无法保证该信息的准确性。\n![Copy-Logo](img/BPB_Catalogue_QR.png)\n\
    [www.bpbonline.com](https://www.bpbonline.com)\n## 关于作者\nSusanta Dutta 是一位资深存储研发架构师，在惠普企业\
    \ (HPE) 公司拥有二十多年的行业工作经验。他一直从事各类存储产品开发和解决方案实施工作，涉及最新的存储技术。他毕业于印度国家理工学院 (NIT) Durgapur\
    \ 分校，获电子与通信工程学位。\n## 致谢\n如果没有与同事们的密切合作，本书的成果将不可能实现。导师、前辈和后辈，每个人都直接或间接地为这项工作做出了贡献。\n\
    我要向我的前辈 Srikanth BK 先生表达我最深切、最真诚的感谢，多年前是他带我接触存储领域，并指导我理解基本的存储概念。\n我还要感谢 BPB Publications\
    \ 在本书完成过程中提供的指导和专业知识。这是一段漫长的修订旅程，得益于审稿人、技术专家和编辑的宝贵参与与协作。\n我还要感谢我的单位惠普企业 (HPE)，为我提供了机会和接触不同类型存储产品和解决方案的平台。\n\
    最后，我要感谢我的家人给予的爱、支持和祝福。\n## 前言\n在当今竞争激烈的市场中，学生和 IT 专业人士更加渴望在常规课程之外创造差异化优势，他们更好奇地想了解行业特定技术，这些技术既有助于技术面试，也有助于更高效地完成工作。\n\
    另一方面，数字信息的爆炸式增长在近年来显著增加了存储就业市场的需求。如今，许多大学、工程学院和教育机构都开设了存储技术的本科/研究生课程。\n有许多存储供应商制造存储产品并实施解决方案。大多数供应商通过互联网博客、视频等，使用其专有术语来解释和宣传其产品的功能集。有时，很难理解某项功能的背景、底层概念和更大目标，也难以找到用于概念理解的文档或文章。\n\
    我凭借数十年在存储技术领域的工作经验积累，编写了本书，旨在填补上述空白并满足相关需求。本书在不提及或突出任何供应商产品的前提下，解释了存储功能和特性的概念。它专注于存储技术的基本和底层概念。每个存储供应商都利用这些技术构建其产品。\n\
    因此，以下读者无疑将从本书内容中受益：\n*   **工程专业学生**\n    *   涵盖存储技术的课程/教学大纲\n    *   为有效的校园招聘提升技能\n\
    *   **IT 专业人士**\n    *   新入职员工的快速上手培养\n    *   提升现有员工的人才技能，以高效、有效地完成工作。\n*   **存储管理员：**\n\
    \    *   管理和监控已部署存储系统和解决方案的管理员。\n## 目录\n*   第 1 章：存储系统和解决方案 - 本章讨论存储系统的类型、存储数据的技术，以及部署在中小型和大型组织中的解决方案。您还将了解所有存储系统在解决方案中的使用优缺点。\n\
    *   第 2 章：存储基础设施 - 本章解释存储系统的所有物理组件及其内部连接，以及存储网络和主机服务器的存储组件。此外，本章还解释了软件定义存储的概念。\n\
    *   第 3 章：存储磁盘阵列 - 在本章中，您将了解存储系统各种功能和特性的设计与实现，例如存储控制器操作模式、不同的数据缓存技术，以及如何使用不同的\
    \ RAID 级别将用户数据存储到物理磁盘上。本章还讨论了每种 RAID 级别的优缺点。\n*   第 4 章：存储通信协议 - 协议是主机服务器与存储系统之间通信数据的一组规则和准则。在本章中，您将了解各种标准存储协议，如\
    \ SCSI、FC、iSCSI 和 FCoE、NFS 以及 CIFS/SMB。这包括使用每种协议在读写操作期间主机服务器与存储系统之间如何传输数据。\n*\
    \   第 5 章：用于共享存储的存储网络 - 在本章中，您将了解主机服务器和存储系统连接所采用的不同网络拓扑。您还将了解控制主机服务器对存储系统各种访问的网络配置，例如分区和\
    \ LUN 掩码。由于特定的网络物理连接和访问配置，主机服务器和存储系统之间会创建多条路径。在本章中，您还将了解虚拟卷如何通过多条路径进行访问，以及负载均衡和故障转移。\n\
    *   第 6 章：存储性能 - 在本章中，您将了解存储性能基础知识，包括衡量存储性能的关键因素定义。本章解释如何判断存储性能是缓慢还是快速。您还将了解存储系统内部实现的用于提升性能的重要特性。\n\
    *   第 7 章：容错与数据保护 - 在本章中，您将了解各种功能，这些功能使主机应用程序能够在存储解决方案或存储系统发生故障时继续访问数据。本章还解释了与数据保护相关的存储技术，如快照、克隆和复制，它们允许在数据损坏或意外丢失时进行恢复。此外，本章还重点介绍了组织为在数据丢失时恢复数据而实施的备份解决方案类型。\n"
