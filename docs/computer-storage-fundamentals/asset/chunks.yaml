    of storing less amount of data. Typically, this solution is implemented with either
    DAS or basic SAN or NAS storage. In DAS solution, storage devices can be internal
    to the host server or external. This is simple to manage and a low cost solution.
    It has several limitations, such as, failure of any component can cause loss of
    data, low performance and storage capacity can scale up to few terabytes (TBs).


    ![Figure 1.11: Entry level storage solutions](images/Fig_1.9.png)


    Figure 1.11: Entry level storage solutions


    o Mid-range storage solution:


    Mid-range storage solution is deployed when the organization has a requirement
    of storing about a few 100TBs. Typically, this solution is implemented using SAN
    or NAS storage with host servers in cluster for high availability. This is simple
    to manage and a low cost solution. It has several limitations, such as, failure
    of any component can cause loss of data, low performance, and the storage capacity
    can scale up to few TBs.


    If host servers in cluster configuration for high availability, each storage volume
    is provided access to all host servers in cluster, so that if any host server
    fails, other server can continue to access the data on the volume. Since the volume
    is shared across multiple servers, this volume access configuration is called
    shared volume.


    ![Figure 1.12: Mid-range storage solution](images/Fig_1.10.png)


    Figure 1.12: Mid-range storage solution


    Some storage vendors assemble all the required hardware, pre-configure software
    and fine-tune in factory to consolidate all solutions for ready-made use and sell
    it as a single stock-keeping unit (SKU) product. This is called converged infrastructure
    or converged system.


    o Enterprise storage solution:


    A data center is a facility with adequate power, space and cooling to deploy computer
    servers, storage systems, and network switches to store and process massive amounts
    of data.


    Large enterprise organizations run their business critical applications in a data
    center to store and process hundreds of petabytes of data. For high availability
    and disaster recovery, enterprise organizations also deploy a similar set of hardware
    at another data center located at different site, called remote or secondary site.


    ![Figure 1.13: Enterprise storage solution](images/Fig_1.11.png)


    Figure 1.13: Enterprise storage solution


    Though every storage solution requires backup solution in place to recover data,
    in case of any accidental loss, enterprise storage solution implements backup
    solution that make multiple copies of their critical data at different time interval
    in different systems.


    ## Hyper-convergence


    The Information Technology (IT) industry has been evolving since mid-20th century.
    The XT/AT PCs were in use during 1980s and 1990s, and computer networking came
    into picture during 1990s and 2000s. Further, SAN became popular during 2000s-2010s
    and finally VM came in use during 2010s. In this process of evolution, data centers
    started having multiple servers, storages, clusters, switches, and cables causing
    inefficiency in management, deployment and space, power consumption.


    Hyper-converged infrastructure (HCI) is a type of infrastructure system with a
    software-centric architecture that tightly integrates compute, storage, networking,
    and virtualization resources. This has evolved from the concept of converged system
    discussed in previous section. Unlike converged system, technologies used in a
    HCI cannot be separated into components. For example, in converged system, storage,
    and servers are still separate piece of hardware, whereas in HCI, solutions are
    implemented within the software.


    A hyper-converged system is typically sold as a software or software preinstalled
    on a hardware box. The software is installed on an existing hardware or any commodity
    hardware box.


    All resources are consolidated within a single system to enhance efficiency of
    management, deployment and consumption of space, and power. For ease of management,
    HCI vendors provide single management application for the management of in-build
    technologies in a hyper-converged system, such as compute, storage networking,
    and virtualization.


    ![Figure 1.14: HCI](images/Fig_1.12.jpg)


    Figure 1.14: HCI


    Hyper-convergence is designed to run VM, and the applications are installed inside
    VMs.


    For high availability solution and more scale out resource requirement, multiple
    hyper-converged systems can be grouped together, which is known as the cluster
    of hyper-converged systems. Each system is referred as node. Once the number of
    VMs have reached the capacity, scaling out is easy, just by adding more nodes
    that includes more compute, storage, and networking resources.


    Virtual desktop infrastructure (VDI) is an infrastructure deployment technology
    that hosts a desktop operating system on a centralized server and storage in a
    data center. Many storage vendors design, build, and sell hyper-convergence product
    to deploy and support VDI requirement.


    Hyper-convergence products are not suitable for business critical applications
    that demands high performance and support thousands of users.


    ## Conclusion


    Storage system and storage solutions have evolved since many decades to meet different
    business objectives and use cases. Primary components of storage solutions are
    storage system, host server, switch, HBA, and management software. All these hardware
    components are connected and configured though the management software to deploy
    a storage solution.


    Storage systems are classified based on the technologies used on how data is stored
    and accessed; these storage systems are block, file, and object storage.


    The following table shows the comparison among all these types of storage systems:


    |  || Block storage || File storage || Object storage |


    | --- | --- | --- | --- |


    | Storage solution || SAN || NAS || Cloud |


    | Access data unit || Blocks || Files || Objects |


    | Host server or client system || In-house or within data center || LAN or WAN
    || Internet |


    | Communication protocol || SCSI on Fibre Channel, iSCSI || CIFS/SMB and NFS ||
    REST over HTTP |


    | Recommended for || Structured data (relational databases) and random and frequent
    read/write operations || Unstructured data and shared files and folders || Unstructured
    data with less updates |


    | Advantages || High performance || Simplified access and management || Scalable
    and distributed access |


    Table 1.1: Block storage, file storage and object storage


    Typically, host servers access block storage within data center. They are accessed
    via Fibre Channel or iSCSI protocol. Client systems access file storage via local
    or wide area network using SMB/CIFS or NFS protocol, and mobile devices access
    object storage over internet using Restful API.


    ![Figure 1.15: Block, file and object storage system](images/Fig_1.13.png)


    Figure 1.15: Block, file and object storage system


    Based on the organization’s requirement, storage solutions are built using the
    required type of storage systems; these solutions are SAN, NAS, DAS, and cloud
    storage. Each solution has its advantages and limitations over other solutions.
    For example, typically SAN solution provides high performance, but requires high
    cost, complex management, and on the other hand, DAS solutions are low cost and
    simple management, but performance may not be at the level of SAN solution.


    Although there are different mechanisms to store and access data on different
    types of storage systems, design, and implementation of most of the parts of all
    these storage systems are common. Therefore, now-a-days most storage vendors make
    block, file, and object storages in the single storage system. The next chapter
    has detailed description about storage disk array.


    ![Figure 1.16: Block, file and object on same storage system](images/Fig_1.14.png)


    Figure 1.16: Block, file and object on same storage system


    ## Case studies'
