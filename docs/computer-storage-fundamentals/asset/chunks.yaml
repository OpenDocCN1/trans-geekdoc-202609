    \ are called storage network components. These components vary from type of solution\
    \ implemented. For example, FC SAN network requires one or more FC switches, and\
    \ IP network for NAS solution requires Ethernet switch. The major component in\
    \ the storage network is the switch. DAS solution does not use any switch, instead,\
    \ it just uses a direct cable between host and storage system for communication\
    \ purpose.\n\nMultiple switches are installed and connected to each other to form\
    \ a vast network.\n\nComponents that comprises a storage network are: HBA, switches,\
    \ cables, and connectors. Though HBA is installed inside the host server, and\
    \ is a part of the host server layer, it can also be considered as one of the\
    \ networking components.\n\n![Figure 2.15: Switch, fibre optic cables and SFP](images/Fig_2.9.png)\n\
    \nFigure 2.15: Switch, fibre optic cables and SFP\n\nHBA and switch, both run\
    \ firmware to activate their functionalities.\n\nIn FC based network, FC supports\
    \ both media options and can run on copper cables or optical cables.\n\nOptical\
    \ fibre supports:\n\n- Long distance up to 10Km.\n- High-speed up to 64Gbps.\n\
    - Immunity to induced electromagnetic signals.\n- Requires an SFP at both ends\
    \ of the cable to convert light signal to electric signal. SFP is also referred\
    \ as gigabit interface converter (GBIC).\n\nA fibre optic transceiver or SFP transceiver\
    \ usually consists of a transmitter and a receiver in a single module.\n\n![Figure\
    \ 2.16: Fibre optic transceiver and receiver](images/Fig_2.9a.jpg)\n\nFigure 2.16:\
    \ Fibre optic transceiver and receiver\n\nIn fibre optic data links, the transmitter\
    \ converts the electrical signal into an optical signal from a laser diode or\
    \ LED. The light from the transmitter is coupled into the fibre with a connector\
    \ and is transmitted through the fibre optic cable. The light from the end of\
    \ the fibre is coupled to a receiver where a detector converts the light back\
    \ into an electrical signal.\n\nSFP is hot-pluggable component.\n\nWhen devices\
    \ of different speed are connected, speed negotiation takes place from higher\
    \ speed, then steps down to lower.\n\n![Figure 2.17: Block diagram of an SFP](images/Fig_2.10.jpg)\n\
    \nFigure 2.17: Block diagram of an SFP\n\n1. Light transmission in an optical\
    \ fibre by total internal reflection.\n2. Core.\n3. Cladding material.\n\n![Figure\
    \ 2.18: Light transmission through an optical fibre](images/Fig_2.11.png)\n\n\
    Figure 2.18: Light transmission through an optical fibre\n\nThere are two type\
    \ of fibre cables, multimode and single-mode:\n\n- **Multimode fibre** has a relatively\
    \ large light carrying core, usually 62.5 microns or larger in diameter. It is\
    \ usually used for short distance transmissions with LED based fibre optic equipment.\
    \ In multimode, beams of different photons reaches at different time, it makes\
    \ it difficult to know, 1 or 0. Therefore, supported distance becomes shorter\
    \ with speed.\n- **Single-mode fibre** has a small light carrying core of 8 to\
    \ 10 microns in diameter. It is normally used for long distance transmissions\
    \ with laser diode based fibre optic transmission equipment. Single-mode fibre\
    \ has a recommended maximum length of 10km.\n\nElectrical cables are low cost\
    \ alternative to short distance–30meters.\n\n![Figure 2.19: FC electrical copper\
    \ cable](images/Fig_2.12.jpg)\n\nFigure 2.19: FC electrical copper cable\n\n##\
    \ Software Defined Storage\n"
  trans: "\n\n# NVMe over Fabrics (NVMe-oF)\n\n- NVMe-oF 协议与 NVMe 协议类似，旨在使基于 NVMe\
    \ 的命令能够通过网络在主机计算机和目标固态存储设备之间传输数据。该网络可以是 FC、以太网或 InfiniBand。\n- 本地 NVMe 通过 PCIe\
    \ 总线将命令和响应映射到主机中的共享内存。NVMe-oF 使用基于消息的模型进行主机与目标存储设备之间的通信。\n- NVMe-oF 支持使用替代 PCIe\
    \ 的传输方式，扩展了 NVMe 主机设备与 NVMe 存储驱动器之间的距离。这包括为基于 SSD 的存储系统启用前端接口，以便与 NVMe 主机通信。\n\
    \n## HDD 容量测量\n\n硬盘驱动器制造商定义：1000 字节 = 1 KB，1000 KB = 1 MB，1000 MB = 1 GB = 10\
    \ 亿字节。\n\n而操作系统（即计算机）以 2 的幂次方数值显示，因此，1 千兆字节 (GB) 实际上是 1024 X 1024 X 1024 字节。\n\
    \n- **实际容量：**\n  = 标称或制造商容量 X (1000/1024) X (1000/1024) X (1000/1024)\n  = 标称或制造商容量\
    \ X 0.93\n\n![Figure 2.13: Advertised Vs Actual Capacity](img/Fig_2.7a.png)\n\n\
    图 2.13：标称容量与实际容量对比\n\n- **示例：**\n  - 300GB 的格式化容量等于 300GB X 0.93 = 279GB\n  -\
    \ 1TB 或 1000GB 的格式化容量等于 1000GB X 0.93 = 931GB\n\n容量越大，标称值与实际容量之间的差异就越高。\n\n在某种程度上，旧存储系统错误地使用了\
    \ GB，但其含义却是 1024 X 1024 X 1024 字节。根据美国国家标准与技术研究院 (NIST) 的规定，1024 X 1024 X 1024\
    \ 基本上是 GiB，而非 GB。所有现代存储系统均使用以下单位，定义见 [`http://physics.nist.gov/cuu/Units/binary.html`](http://physics.nist.gov/cuu/Units/binary.html)。\n\
    \n| 单位 | 缩写 | 字节数 |\n| --- | --- | --- |\n| kibibyte | KiB | 1024 |\n| Mebibyte\
    \ | MiB | 1024 X 1024 |\n| Gibibyte | GiB | 1024 X 1024 X 1024 |\n| Tebibyte |\
    \ TiB | 1024 X 1024 X 1024 X 1024 |\n\n表 2.3：存储容量单位\n\n## 硬盘机箱\n\n它是一个包含物理磁盘驱动器池或阵列的机箱。硬盘机箱也称为磁盘柜\
    \ (JBOD，Just a Bunch of Disks)。通常，所有存储阵列都支持多个机箱。\n\n![Figure 2.14: Disk enclosure\
    \ (JBOD)](img/Fig_2.8.png)\n\n图 2.14：磁盘机箱 (JBOD)\n\n可安装的驱动器数量及驱动器的方向取决于设计 JBOD\
    \ 的供应商。所有驱动器均通过背板连接到后部的两个 I/O 模块。固件运行在 I/O 模块内部。使用两个 I/O 模块是为了提供容错和负载均衡能力。\n\n\
    JBOD 使存储系统模块化，因为它允许组织最初购买所需数量的存储。以后，他们可以根据需要购买带机箱的磁盘以扩展存储空间。\n\n由于机箱中包含一组物理磁盘，整个存储系统通常被称为存储阵列或阵列。\n\
    \n## 后端交换机或背板互连\n\n不同供应商的存储系统设计使用不同的技术将物理驱动器连接到控制器。一些供应商通过级联线缆或交换机连接物理驱动器，而另一些则通过背板电路板连接。存储控制器的设备端口连接到这些交换机或背板。同样，磁盘驱动器也连接到这些交换机或背板。\n\
    \n控制器从前端的主机服务器接收的数据经过处理后，传递到后端以存储到相应的磁盘驱动器上。\n\n## 线缆和连接器\n\n线缆和连接器主要用于连接硬盘机箱、电源等。通常使用两根或更多线缆连接一个磁盘机箱，以增加带宽、实现负载均衡，并因线缆故障提供容错能力。\n\
    \n大型或高端存储磁盘阵列可能具有长而复杂的布线，而较小的磁盘阵列可能具有短而简单的布线。\n\n## 机架\n\n这是一个类似冰箱的箱体，所有硬件组件均安装其中，包括存储控制器和硬盘机箱。这确保了所有组件的布线安全完好。较小的磁盘阵列可能不需要整个机架。\n\
    \n## 存储网络组件\n\n在主机服务器和存储系统之间形成网络、并帮助主机服务器与存储系统通信的组件称为存储网络组件。这些组件因实施的解决方案类型而异。例如，FC\
    \ SAN 网络需要一个或多个 FC 交换机，NAS 解决方案的 IP 网络需要以太网交换机。存储网络中的主要组件是交换机。DAS 解决方案不使用任何交换机，而是仅使用主机和存储系统之间的直连线缆进行通信。\n\
    \n安装多个交换机并将它们相互连接以形成一个庞大的网络。\n\n构成存储网络的组件包括：HBA、交换机、线缆和连接器。虽然 HBA 安装在主机服务器内部，属于主机服务器层的一部分，但也可被视为网络组件之一。\n\
    \n![Figure 2.15: Switch, fibre optic cables and SFP](img/Fig_2.9.png)\n\n图 2.15：交换机、光纤线缆和\
    \ SFP\n\nHBA 和交换机均运行固件以激活其功能。\n\n在基于 FC 的网络中，FC 支持两种介质选项，可在铜缆或光缆上运行。\n\n光纤支持：\n\
    \n- 长距离，高达 10 公里。\n- 高速率，高达 64 Gbps。\n- 抗电磁感应干扰。\n- 线缆两端需要 SFP 将光信号转换为电信号。SFP\
    \ 也称为千兆接口转换器 (GBIC)。\n\n光纤收发器或 SFP 收发器通常由发射器和接收器组成，集成在单个模块中。\n\n![Figure 2.16:\
    \ Fibre optic transceiver and receiver](img/Fig_2.9a.jpg)\n\n图 2.16：光纤收发器和接收器\n\
    \n在光纤数据链路中，发射器将来自激光二极管或 LED 的电信号转换为光信号。来自发射器的光通过连接器耦合进入光纤，并通过光纤线缆传输。光纤末端的光耦合到接收器，探测器将光转换回电信号。\n\
    \nSFP 是热插拔组件。\n\n当连接不同速率的设备时，速率协商从较高速率开始，然后逐级降至较低速率。\n\n![Figure 2.17: Block diagram\
    \ of an SFP](img/Fig_2.10.jpg)\n\n图 2.17：SFP 框图\n\n1. 光在光纤中通过全反射传输。\n2. 纤芯。\n\
    3. 包层材料。\n\n![Figure 2.18: Light transmission through an optical fibre](img/Fig_2.11.png)\n\
    \n图 2.18：光在光纤中的传输\n\n光纤线缆有两种类型，多模和单模：\n\n- **多模光纤** 具有相对较大的传光纤芯，通常直径为 62.5 微米或更大。它通常用于基于\
    \ LED 的光纤设备的短距离传输。在多模中，不同光子的光束到达时间不同，这使得难以分辨 1 或 0。因此，随着速率增加，支持的距离变短。\n- **单模光纤**\
    \ 具有直径为 8 至 10 微米的小传光纤芯。它通常用于基于激光二极管的光纤传输设备的长距离传输。单模光纤的推荐最大长度为 10 公里。\n\n电缆是 30\
    \ 米以内短距离传输的低成本替代方案。\n\n![Figure 2.19: FC electrical copper cable](img/Fig_2.12.jpg)\n\
    \n图 2.19：FC 电缆铜缆\n\n## 软件定义存储\n\n"
