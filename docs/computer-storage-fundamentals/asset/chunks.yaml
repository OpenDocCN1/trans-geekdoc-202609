- raw: 'Virtual volume along with all its snapshots is called virtual volume family.


    Depending on the storage system design, vendors set the maximum limit of the number
    of the snapshot that can be created for a virtual volume.


    ![Figure 7.11: Snapshot of snapshot](images/Fig_7.11.jpg)


    Figure 7.11: Snapshot of snapshot


    Clone: The clone is another technology to create a copy of the data on a virtual
    volume. The clone is the same as a snapshot at the time of creation, but data
    blocks get copied in the background and eventually, clone becomes a separate and
    independent volume from the parent volume.


    ![Figure 7.12: Clone creation](images/Fig_7.12.jpg)


    Figure 7.12: Clone creation


    Step A:


    As a first step of clone creation, all blocks are points to corresponding blocks
    in parent volume. This is similar to a snapshot.


    Some vendors allow host access to the clone at this stage itself.


    Step B:


    After the creation of clone, blocks starts copying from parent to newly created
    clone volume in the background. Depending on the size of volume and data in it
    and system load, this process may take sufficient amount of time.


    ![Figure 7.13: Background copy process](images/Fig_7.13.png)


    Figure 7.13: Background copy process


    Step C:


    Once background copy process is completed, clone becomes separate and independent
    from parent volume, now, clone will have the data same as parent volume at the
    time of creation of the clone.


    ![Figure 7.14: Clone separation](images/Fig_7.14.jpg)


    Figure 7.14: Clone separation


    Since, clone is independent volume from parent, primary advantage of clone compared
    to snapshot is, it provides protection of data even in the case of physical failures
    of the parent volume. but for successful creation of a clone, amount of free space,
    same as parent volume, needed in the storage system.


    Clone sync operation:


    Most modern storage systems also allow synchronous operation of clone to its parent
    volume at regular interval, just to copy the difference in data since, it was
    last synced. For example, a clone was created on Monday at 10:00 PM, when it is
    synced with parent on Tuesday at 10:00 PM, instead of copying entire data again,
    only the blocks that are changed since Monday 10:00 PM to Tuesday 10:00 PM are
    copied. Clone can be again synced on Wednesday, and so on.


    During sync operation application must be stopped and host must discontinue accessing
    the clone volume. This sync process helps applications that use the clone for
    analysis or report generation will have access up to data, without creating a
    new clone every time.


    ### Remote replication


    Technologies that copies data from one storage system to other storage system
    are called remote replication. This is typically implemented between two storage
    systems, which are geographically apart. In case of any disaster strikes, such
    as flood, earthquake or fire at either site, application can switch over to surviving
    site and continue its operations. Therefore, remote replication solution is also
    referred as disaster recovery solution. Large enterprise organizations, which
    deal with business critical applications, implement this solution to ensure their
    business continuity in case of any disaster.


    ![Figure 7.15: Storage remote replication](images/Fig_7.15.png)


    Figure 7.15: Storage remote replication


    Different vendor uses different terminologies to name this pair of storage systems
    such as Source and target, local and remote, primary and secondary storages pairs.


    Hosts write data to the virtual volumes in the source array, and the array copies
    the data to the virtual volumes in the destination array. I/O ordering is important
    to maintain across the virtual volumes used an application. A replication group
    is a logical entity that consists of source and target virtual volumes pairs in
    it. This concept is to configure an application data on all the virtual volumes
    in a replication group. Replication group ensures I/O consistency on the destination
    array in the event of a failure of the source array.


    In the following example S\_Vol1 and T\_Vol1 volumes of same size make a replication
    pair and S\_Vol2 and T\_Vol2 also make another replication pair, and so on. An
    application can be configured to use multiple volumes. For example, a database
    requires minimum of three volumes for data, log and archive. In this case, one
    replication group needed to be configured, consists of three replication pairs
    for data, log, and archive.


    ![Figure 7.16: Replication group concept](images/Fig_7.16.png)


    Figure 7.16: Replication group concept


    In replication, failover reverses replication direction for a replication group.
    The destination array assumes the role of the source, and the source array assumes
    the role of the destination. Similarly, failback sets replication direction back
    to original. Failover and failback are done as part of planned maintenance or
    post any unplanned failures.


    Storage system can have multiple replication groups to configure different application
    on each group.


    To have load balance and utilize both storage systems effectively, most vendors
    support bi-directional replication. One or more application can be configured
    on each storage system and other storage system can be used as destination storage.


    ![Figure 7.17: Bi-directional remote replication](images/Fig_7.17.png)


    Figure 7.17: Bi-directional remote replication


    There are typically two different mode of replicating data from source to destination
    storage systems such as synchronous and asynchronous.


    Synchronous replication


    ![Figure 7.18: Synchronous replication operations](images/Fig_7.18.png)


    Figure 7.18: Synchronous replication operations


    Following is the step-by-step process that takes place in synchronous replication:


    Step 1: First host writes data to source storage.


    Step 2: Source storage writes and then sends data to destination storage.


    Step 3: Destination storage sends ACK to source storage.


    Step 4: Source storage sends ACK to host server.


    In synchronous replication, write I/O completion status not returned to host until
    both source and destination storage systems write data. Data is mirrored in real-time.
    Applications for which data consistency is crucial, requires synchronous replication.
    Since, data is replication real-time, this mode of replication can increase response
    time to host, if higher bandwidth of link is not used for replication.


    Synchronous mode of replication is commonly referred as sync replication.


    Asynchronous replication


    ![Figure 7.19: Asynchronous replication operations](images/Fig_7.19.jpg)


    Figure 7.19: Asynchronous replication operations


    Following is the step-by-step process that takes place in asynchronous replication:


    Step 1: First host writes data to source storage.


    Step 2: Source storage writes, stores in temporary location and then sends ACK
    to host server.


    Step 3: Source storage sends data to destination storage.


    Step 4: Destination storage sends ACKto source storage.


    Step 3 and step 4 are independent of step 1 and step 2.


    In asynchronous replication, I/O completion status returned when local write completes.
    Destination writes are deferred until later. Unwritten datastored temporarily
    on the source storage system’s cache memory or any temporary disk space.


    The primary disadvantage of in this mode of replication, unsent data from source
    to destination at risk if source system fails, but improves host write performance,
    as ACK sent immediately after writing to the local storage system.


    Some storage vendors implement asynchronous replication through snapshot. A snapshot
    gets created at user to define the time interval and data on it. and get it copied
    to remote storage system.


    In asynchronous replication, frequent updates of the same block of data is replicated
    only once to the destination within the update period, whereas, in synchronous
    replication every update, even for the same block, gets replicated every time.'
