  trans: "\n\n# 第 3 章：章末习题\n\n## 选择题\n\n**52.** 匹配下列各项：\n\n| | |\n|---|---|\n| i.\
    \ 虚拟卷 | 1. JBOD |\n| ii. LUN | 2. 主机服务器 |\n| iii. 物理磁盘 | 3. 存储系统 |\n\na. (i) -\
    \ (1), (ii) - (2) 和 (iii) - (3)  \nb. (ii) - (1), (i) - (2) 和 (iii) - (3)  \n\
    c. (iii) - (1), (ii) - (2) 和 (i) - (3)  \nd. (iii) - (1), (i) - (2) 和 (ii) - (3)\n\
    \n**53.** `LVM PV` 的物理磁盘可以是：\n\na. 通过 `SCSI` 控制器直接连接到主机的物理磁盘  \nb. 基于主机的 `RAID`\
    \ 控制器的逻辑磁盘  \nc. 从基于 `SAN` 的存储阵列中划分出的虚拟磁盘  \nd. 以上所有\n\n**54.** 以下哪个序列是 `LVM`\
    \ 适当的抽象层级：\n\na. `PV` -> `LV` -> `VG` -> 物理磁盘  \nb. `LV` -> `VG` -> 物理磁盘 -> `PG`\
    \  \nc. 物理磁盘 -> `PV` -> `VG` -> `LV`  \nd. `VG` -> 物理磁盘 -> `PV` -> `LV`\n\n##\
    \ 简答题\n\n1. 解释存储虚拟化的优缺点。\n2. 强调虚拟 `RAID` 相比传统 `RAID` 级别的优势。\n\n## 测验题\n\n1. 什么是存储虚拟卷？为什么我们需要它？\n\
    2. `RAID 1+0` 和 `RAID 0+1` 哪个 `RAID` 级别提供更好的容错能力？为什么？\n3. 如果在具有三个底层物理磁盘的 `RAID\
    \ 0` 虚拟卷上写入 300 个数据块，第 1-100 个块是写入第一个磁盘，然后第 101-200 个块写入第二个磁盘，第 201-300 个块写入第三个磁盘吗？\n\
    4. 一个组织有 14TB 数据需要存储。他们购买了 10 块 1TB 的磁盘。管理员应该选择哪个 `RAID` 级别？\n\n## 术语表和关键术语\n\n\
    *   **`RAID`**：廉价磁盘冗余阵列，一种增强存储容错能力和性能的技术。\n*   **虚拟卷**：由存储控制器创建的模拟磁盘驱动器，作为一个或多个主机的存储空间。主机计算机将虚拟卷视为真实磁盘，具有与相同物理磁盘完全一致的特性。\n\
    *   **主机**：存储系统中代表主机服务器的逻辑实体。虚拟卷被授予访问权限。\n*   **`LUN`**：逻辑单元号。一种用于标识 `SCSI` 设备的\
    \ `SCSI` 约定。主机将虚拟卷视为一个 `LUN`。`LUN` 编号是在导出虚拟卷或将虚拟卷分配给主机时指定的。主机将通过该 `LUN` 查看虚拟卷。在某些情况下，虚拟卷也被称为\
    \ `LUN`。\n*   **`ALUA`**：支持非对称逻辑单元访问的操作系统可以确定优化路径和非优化路径。\n\n## 社区\n\n加入我们的 Discord\
    \ 空间，获取最新资讯、优惠、全球科技动态、新版本发布以及与作者的交流会议：\n\n[`discord.bpbonline.com`](https://discord.bpbonline.com)\n\
    \n![QR-Logo](img/fm1.png)\n\n---\n\n# 第 4 章：存储通信协议\n\n## 简介\n\n主机系统使用标准通信协议与存储系统进行通信。`小型计算机系统接口\
    \ (SCSI)` 协议被操作系统广泛用于对磁盘驱动器进行输入/输出 (`I/O`) 操作。尽管 `光纤通道 (FC)`、`互联网 SCSI (iSCSI)`\
    \ 和 `基于以太网的光纤通道 (FCoE)` 协议是为存储网络设计的，但操作系统仍然使用 `SCSI` 协议通过这些存储网络协议与磁盘驱动器通信。\n\n\
    文件级 `NAS` 存储通常可通过常见的文件级协议（如 `SMB/CIFS` 和 `NFS`）访问。\n\n## 结构\n\n成功完成本章后，您将能够了解存储通信协议的以下关键领域：\n\
    \n*   `SCSI` 协议\n*   `光纤通道` 基础\n*   `iSCSI` 概念\n*   `FCoE` 概览\n*   文件访问协议\n\n\
    ## 目标\n\n协议是主机服务器与存储系统之间通信数据的一组规则和准则。在本章中，您将了解各种标准存储协议，如 `SCSI`、`FC`、`iSCSI` 和\
    \ `FCoE`、`NFS` 以及 `CIFS/SMB`。这包括使用每种协议在读写操作期间，数据如何在主机服务器和存储系统之间传输。\n\n## SCSI\
    \ 协议\n\n`SCSI` 是一组 `美国国家标准协会 (ANSI)` 标准电子接口，允许主机服务器与存储设备通信。\n\n`T10` ([`www.t10.org/`](https://www.t10.org/))\
    \ 负责 `SCSI` 架构和 `SCSI` 命令集标准。几乎所有现代 `I/O` 接口都使用这些标准。\n\n在 `SCSI` 通信中，主机服务器始终是\
    \ **发起者**，存储是 **目标**。任何单个请求均由主机服务器发起。作为目标的存储始终响应发起者的请求。\n\n*   **发起者**：发起者向 `SCSI`\
    \ 设备发出服务请求并接收响应。发起者有多种形式，可能集成在服务器的系统板上，也可能存在于主机总线适配器 (`HBA`) 中。\n*   **目标**：`SCSI`\
    \ 目标通常是存储设备。目标可以是硬盘，也可以是整个存储阵列。\n\n### SCSI 命令描述符块\n\n`SCSI` 命令描述符块 (`CDB`) 是一个描述\
    \ `SCSI` 命令的信息块。命令从 `SCSI` 发起者发送到 `SCSI` 目标，后者是某种存储设备（硬盘、磁带驱动器等）的控制器。几乎每个 `CDB`\
    \ 都包含三个部分：\n\n1.  What 字段（是什么）\n2.  Where 字段（在哪里）\n3.  How Much 字段（多少）\n\n对于某些命令，这些字段是隐含的或不需要的。\n\
    \n**What 字段**称为操作码 (`opcode`)，告诉目标该命令要执行什么操作。例如 `READ` 或 `WRITE`。`READ` 命令将数据从存储设备移动到主机系统，而\
    \ `WRITE` 命令将数据移动到存储设备以供后续访问。\n\n**Where 字段**告诉目标从何处开始操作，以 `逻辑块地址 (LBA)` 表示。该地址范围从零\
    \ (0) 到设备的最大地址。某些命令（如 `INQUIRY`）不需要此字段。\n\n**How Much 字段**告诉目标移动多少个块（或字节）的数据。大多数存储设备的块大小为\
    \ 512 字节，但某些存储设备的块大小可能不同。该字段表示为传输长度（以块为单位）、分配长度（移动到主机的字节数）或参数列表长度（移动到设备的字节数）。使用哪个名称取决于命令本身。\n\
    \n### SCSI 寻址\n\n在 `SCSI` 总线中，每个设备都通过唯一地址（如 `Bus`、`Target` 和 `LUN` (`B.T.L`)）进行标识。以下是一个简单的\
    \ `DAS` 示例：\n\n![图 4.1：DAS 中的 SCSI 地址](img/Fig_4.1.png)\n\n**图 4.1：DAS 中的 SCSI\
    \ 地址**\n\n如果只有高亮显示的插槽安装了磁盘驱动器：\n\n```bash\nshow device list (等效命令)\n```\n\n| 设备\
    \ | 名称 | Bus | Target | LUN |\n|---|---|---|---|---|\n| Disk1 | | 1 | 03 | 0 |\n\
    | Disk2 | | 1 | 04 | 0 |\n| Disk3 | | 1 | 05 | 0 |\n\n*   `Bus` 值由操作系统根据服务器的 `PCI`\
    \ 插槽顺序分配\n*   `SCSI ID` 6 和 7 保留给 `SCSI` 适配器。通常 `SCSI` 适配器默认分配 `SCSI ID` 7。\n\n\
    在 `SAN` 环境中，`bus` 值根据安装 `HBA` 的 `PCI` 插槽分配。`Target` 值基于控制器端口，`LUN ID` 是使用管理软件呈现或导出存储卷时分配的值。\n\
    \n某些 `SCSI` 适配器或 `HBA` 拥有多个端口，称为通道。为了支持这一点，某些操作系统或 `SCSI` 驱动程序使用四个参数进行 `SCSI`\
    \ 寻址：`Host:Channel:Target:LUN` (`H:C:T:L`)。在这种情况下，bus 被称为 channel。\n\n如果不适用，`Channel`\
    \ 值为零。在这种情况下，主机编号即为 bus。\n\n`SCSI` 操作有三个主要阶段：\n\n*   **命令**：发起者通过 `CDB` 发送命令和参数。\n\
    *   **数据交换**：传输数据。主要用于读或写操作。某些 `SCSI` 命令（如 `测试单元就绪 (TUR)`）不使用数据阶段。\n*   **状态**：接收命令执行的确认。\n\
    \n### SCSI 协议写请求示例\n\n"
