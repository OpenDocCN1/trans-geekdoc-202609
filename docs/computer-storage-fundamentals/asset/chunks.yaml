- raw: "A server communicates with a storage array via a protocol known as the SCSI\
    \ protocol:\n\n1\\. Server sends a SCSI write request to the array. The write\
    \ request tells the array, what size the I/O will be.\n\n![Figure 4.2: SCSI write\
    \ request](images/Fig_4.2.png)\n\nFigure 4.2: SCSI write request\n\n2\\. When\
    \ the array is ready to receive the data, it sends a transfer ready to the server.\n\
    \n3\\. The server sends the data.\n\n4\\. The array acknowledges the receipt of\
    \ the data.\n\n### SCSI protocol: Read request example\n\nA server communicates\
    \ with a storage array via a protocol known as the SCSI protocol:\n\n1\\. Server\
    \ sends SCSI read request to the array (the read request telling the array what\
    \ size the I/O will be and what data is being requested via a block address range).\n\
    \n![Figure 4.3: SCSI read request](images/Fig_4.3.png)\n\nFigure 4.3: SCSI read\
    \ request\n\n2\\. The array retrieves the data and sends it to the server.\n\n\
    3\\. Array returns status upon completion.\n\n### Host I/O timeout\n\nHost applications\
    \ and operating systems are designed to retry read/write I/O requests in case\
    \ of delay in response from storage system. These retries are performed for a\
    \ specific period of time. This time period is called host I/O timeout for the\
    \ application or the operating system.\n\n### Parallel SCSI vs. serial SCSI\n\n\
    Two major disadvantages with parallel SCSI are, at a faster bus speed, it becomes\
    \ more difficult to manage the complex signaling and prevent data corruption.\
    \ When you send signals across a parallel bus, there is no guarantee that they\
    \ will all arrive at their destination at the same time. Hence, 80MHz of Ultra320\
    \ SCSI is the highest achievable transmission rate in parallel SCSI. Secondly,\
    \ to ensure data integrity, the maximum cable length for single-ended SCSI decreases\
    \ by half each time the signal speed doubles.\n\nIn serial SCSI , changing from\
    \ 8 bit or 16 bit data transfer widths to one bit at a time might seem like a\
    \ step backwards. However, the dramatic increase in speed allowed by serial communication\
    \ reverses this bandwidth loss.\n\nSerial SCSI includes the SAS and Serial Advanced\
    \ Technology Attachment (SATA) solutions. Following are some differences between\
    \ parallel SCSI and serial SCSI:\n\n|  || Parallel SCSI || Serial SCSI (Serial\
    \ attached SCSI–SAS) |\n\n| --- | --- | --- |\n\n| Architecture || Parallel, all\
    \ devices connected to share bus. || Serial, point-to-point, discrete signal paths.\
    \ Port expander 1 used for fan-out. |\n\n| --- | --- | --- |\n\n| Performance\
    \ || Max speed 320 MBps (Ultra320 SCSI). Performance degrades as devices added\
    \ to shared bus. Speed shared across the entire multi-drop bus. || The basic speed\
    \ is 3 Gbps, the equivalent of 300 MBps data pathway, which can be doubled to\
    \ the equivalent of 600 MBps since the SAS channel is full-duplex. In addition,\
    \ you can use several pathways per device to multiply the available bandwidth.\
    \ Performance is maintained as more drives are added. |\n\n| Scalability || Number\
    \ of devices per cable limited by SCSI IDs to 8 or 16 on a single channel. ||\
    \ Up to 128 devices. 16,384 devices with fan-out expander. |\n\n| Compatibility\
    \ || Incompatible with all other drive interfaces. || Compatible with SATA. |\n\
    \n| Maximum cable length || 12 meters total. Can use SCSI repeaters to exceed\
    \ this limit but they are expensive. || 8 meters per discrete connection; total\
    \ domain cabling thousands of feet. |\n\n| Cable Form Factor || Multitude of conductors\
    \ adds bulk an cost. || Compact connectors and cabling save space and cost. |\n\
    \n| Device identification || Manually set; user must ensure no ID number conflicts\
    \ on bus. || Worldwide unique ID set at time of manufacture uniquely identifies\
    \ devices; no user action required. |\n\n| Termination || Manually set; user must\
    \ ensure proper installation and functionality of terminators. || Discrete signal\
    \ paths enable devices to include termination by default; no user action required.\
    \ |\n\nTable 4.1: Parallel SCSI vs. Serial SCSI\n\n## Fibre Channel basics\n\n\
    FC is a networking technology which is designed to facilitate high-speed data\
    \ transfer between host servers and storage devices. T11 ([http://www.t11.org)](http://www.t11.org/)\
    \ is a technical committee of the InterNational Committee for Information Technology\
    \ Standards (INCITS) defines and maintains technical standards of FC specifications.\n\
    \nFC supports several common transport protocols including IP and SCSI. The support\
    \ for multiple protocols allows FC to merge high-speed I/O with networking functionality\
    \ in a single package. To understand FC, we must discuss the concept of a network\
    \ vs. a channel.\n\nFC carries, or encapsulates, other communication protocols,\
    \ such as SCSI-3, FICON (SBCCS), IP, HiPPI, and so on. FC is like building block\
    \ of a road, where SCSI-3, FICCON and others are vehicles that move the data cargo\
    \ down the road.\n\n•  FC can carry multiple protocols simultaneously to support\
    \ a variety of applications.\n\n•  FC is to SANs what Ethernet is to LANs and\
    \ more:\n\n o Ethernet just defines how data is physically transmitted\n\n o Protocols\
    \ like IP define the logical network\n\n o FC defines both physical and logical\
    \ aspects\n\n![Figure 4.4: FC](images/Fig_4.4.png)\n\nFigure 4.4: FC\n\n### Fibre\
    \ Channel topologies\n\nFabric is logical FC network that is formed using nodes\
    \ of one or two switches. There are three topologies for FC fabrics:\n\nPoint-to-point:\n\
    \n•  Two node ports have the same signaling rate and class of service. For example,\
    \ this topology gets formed when host server directly connected to storage system.\n\
    \n![Figure 4.5: Point-to-point topology](images/Fig_4.5.png)\n\nFigure 4.5: Point-to-point\
    \ topology\n\nSwitched fabric:\n\nIt is the most commonly used FC topology. 16\
    \ million node ports can be interconnected. One or more FC switches can be used\
    \ to build a switched fabric.\n\n![Figure 4.6: Switched fabric topology](images/Fig_4.6.png)\n\
    \nFigure 4.6: Switched fabric topology\n\nA switched fabric can have one or more\
    \ number of switches connected.\n\nArbitrated loop:\n\n•  Organizes up to 127\
    \ FC ports on a ring, and distributes the routing functions among them.\n\n• \
    \ Arbitrated Loop Physical Address (AL\\_PA) is 1 byte assigned during loop initialization.\n\
    \n•  Loop initialization required when a new device is added to a loop requiring\
    \ an AL\\_PA to be assigned to it.\n\n•  In most FC-AL hub, a bypass circuit removes\
    \ the FC device out of FC-AL loop topology when signaling is lost.\n\n•  It is\
    \ used less than the switched topology. Some storage systems are designed to have\
    \ AL to connect all physical disks in its backend.\n\n•  It also costs less than\
    \ switched topology.\n\n![Figure 4.7: AL topology](images/Fig_4.7.png)\n\nFigure\
    \ 4.7: AL topology\n\n### Fibre Channel node and port type\n\n| Short name ||\
    \ Descriptive name || Device type || Port function |\n\n| --- | --- | --- | ---\
    \ |\n\n| N\\_Port || Node port || Node || Port used to connect a node to a FC\
    \ switch |\n\n| --- | --- | --- | --- |\n\n| F-port || Fabric port switches ||\
    \ Switch || Port used to connect the FC fabric to a node |\n\n| L-port || Loop\
    \ port nodes || Node || Port used to connect a node to a FC loop |\n\n| NL-port\
    \ || Node loop || Nodes || Node port which connects to both arbitrated loops and\
    \ switches |\n\n| FL-port || Fabric + loop port || Switches || Switch port which\
    \ connects to both arbitrated loops and switches |\n\n| E-port || Expansion port\
    \ || Switches || Used to cascade FC switches together |\n\n| G-port || General\
    \ port || Switches || General purpose port which can be configured to emulate\
    \ other port type |\n\n| U-port || Universal port || Switches || Initial port\
    \ state on a switch before anything has connected and it changes personality to\
    \ an operation state (E-port, F-port, FL-port) or a transitional state like a\
    \ G-port |\n\nTable 4.2: FC node and port type\n\n![Figure 4.8: FC node and port\
    \ types](images/Fig_4.8.png)\n\nFigure 4.8: FC node and port types\n\n### Fibre\
    \ Channel login processes"
  fmt: "\n# SCSI Protocol\n\nA server communicates with a storage array via a protocol\
    \ known as the SCSI protocol.\n\n## Write Request\n\n1. Server sends a SCSI write\
