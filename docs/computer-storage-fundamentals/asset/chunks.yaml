    \n![QR-Logo](images/fm1.png)\n\n# CHAPTER 8Space Efficiency\n\n## Introduction\n\
    \nFor many years of storage technology evolution, primary focus was performance\
    \ and fault tolerance. Technologies related to efficiently storing data, such\
    \ as thin provisioning, deduplication, compression, reclamation came into implementation\
    \ and practice only in recent years. This is because the explosive growth of data\
    \ in last few years caused demand for more space in the storage system. Today,\
    \ most modern storage systems have these features implemented to ensure data consumed\
    \ less amount disk space.\n\n## Structure\n\nAt the end of this chapter, you will\
    \ learn about Storage system features that enhance the space efficiency of a storage\
    \ system:\n\n•  Thin provisioning\n\n•  Space reclamation\n\n•  Dynamic capacity\
    \ management–volume expansion and shrink"
