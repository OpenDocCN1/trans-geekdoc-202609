    ## Objectives


    In this chapter, you will learn about the storage features that stores data in
    the most efficient way. Those features are thin provisioning, expand, shrink,
    space reclamation (UNMAP), deduplication and compression. Detailed explanation
    of these features, guides you to understand how each feature works and efficiently
    stores the data in a storage system.


    ## Thin provisioning


    Traditionally, when a volume is created, required storage space gets allocated.
    When the volume is deleted space gets released.


    Again, from a host when you write data on to a file system, free space on the
    file system reduces and when you delete data, free space increases in the file
    system.


    Now imagine, similarly, at storage level, if space allocation occurs as and when
    data is written from host, then there would have been many advantages, such as
    sharing available storage space with more number of hosts. This is called thin
    provisioning feature. Thin provisioning feature is commonly available in almost
    all modern storage systems today.


    With thin provisioning feature, a large volume can be created even with less size
    of hard drives, and required drives can be procured as and when data grows. Basically
    pay as you use concept.


    For example, you bought four drives of 2 TB, without thin provisioning feature,
    you can create only one RAID 1 volume of 4 TB. No room left to create any additional
    volume and provide access to another host.


    Whereas, with thin provisioning feature, you can create large size virtual volume
    as many as you want. Let us say, you created three numbers of virtual volumes
    of each size 10 TB. After providing access to hosts, operating system would recognize
    all the volumes as 10 TB. However, if you copy 1TB data to any of those volumes,
    you would be left with 3 TB worth of space to copy data to any of three volumes.


    ![Figure 8.1: Thick and thin volume provisioning](images/Fig_8.1.png)


    Figure 8.1: Thick and thin volume provisioning


    Storage vendors also implement a notification to user when thin provisioning volume
    about to run out of physical space.


    Following is another example to show, without thin provisioning capability, space
    get allocated during volume creation, no matter how much host data is written.
    On the other hand, with Thin Provisioning capability, space get allocated as and
    when host writes data, no matter how big volume is created.


    ![Figure 8.2: Example of a thick volume](images/Fig_8.2.png)


    Figure 8.2: Example of a thick volume


    ![Figure 8.3: Example of a thin volume](images/Fig_8.3.jpg)


    Figure 8.3: Example of a thin volume


    ## Space reclamation


    If data is removed from the thin provisioned volume, space is freed up on the
    file system, but the physical capacity on the storage system remains consumed.
    Most of the modern storages have space reclamation feature nowadays, which is
    a space reclamation mechanism used to return blocks of storage back to the array
    after data which was once occupying those blocks have been moved or deleted. After
    de-allocation, these blocks can be used by other logical volumes or the same logical
    volume later.


    Space reclamation feature is not applicable for thick volume, as all blocks are
    always allocated.


    This feature is based on T10 SCSI UNMAP standard. Some vendor refer space reclamation
    feature as UNMAP feature.


    Some operating systems, such as Microsoft Windows 2012 or later and VMWare vSphere
    ESXi, send SCSI UNMAP commands to the Storage system at regular interval to ensure
    all blocks corresponding to the deleted data are de-allocated at storage system
    level.


    ## Dynamic capacity management


    Storage feature that helps user to expand and shrink virtual volumes is called
    dynamic capacity management. However, different storage vendor may call it with
    different name. When you run out of space on the volume, you may like to expand
    it. Again, to create any additional virtual volume or allow other volume to grow,
    you may like shrink an existing volume, if you anticipate space will not be used
    much in future.


    Modifying the metadata table pertaining to the virtual volume to allocate more
    number of blocks on physical disks for expansion and less number of blocks for
    the shrink.


    Though storage system allows you to change the size of a volume, operating file
    system and application must be intelligent enough to understand this change.


    With popularity of thin provisioning feature, expansion and shrink is not much
    needed, as user can create larger volume than available physical space and share
    available space more efficiently among all virtual volumes. Expand and shrink
    mostly used with thick volumes.


    ## Deduplication and compression


    Data deduplication and compression are techniques to reduce requirement of storage
    space. Both are different techniques and solve the different problems. Deduplication
    removes redundant data, keeping only one, whereas compression keeps all data,
    just brings them closer so that they consume less space.


    ![Figure 8.4: Deduplication process](images/Fig_8.4.png)


    Figure 8.4: Deduplication process


    ![Figure 8.5: Original data](images/Fig_8.5.jpg)


    Figure 8.5: Original data


    Deduplication keeps only one unique instance of the data on storage media, and
    redundant data is replaced with a pointer to the unique data copy.


    ![Figure 8.6: After deduplication](images/Fig_8.6.png)


    Figure 8.6: After deduplication


    Deduplication granularity is referred as amount of data unit at which duplicate
    data are compared and computed. This is also called deduplication chunk size.
    For simplicity of implementation most vendors design deduplication with internally
    fixed value of deduplication chunk size, however some vendors allow user to change
    it as tunable parameter.


    A smaller chunk size results in more granular data and results in identifying
    more duplicates. However, smaller chunks have additional costs of computation
    overhead and fragmentation. Larger chunk size results in a less deduplication,
    faster processing, and less fragmentation.


    Virtual volume with deduplication enabled is commonly referred as dedup volume.


    Compression represents original data with minimum number of bits needed.


    ![Figure 8.7: After compression](images/Fig_8.7.jpg)


    Figure 8.7: After compression


    Deduplication achieves better efficiency against smaller data chunks, whereas
    compression achieves better efficiency against larger chunks.


    ![Figure 8.8: After deduplication and compression](images/Fig_8.8.jpg)


    Figure 8.8: After deduplication and compression


    Not all data is compressible or deduplicable. Again, degree of compression and
    deduplication depends on the number of repeating data the data content and a file
    with common data in it. Depending on data type, deduplication and compression
    can work together. Upon read request storage controller does un-deduplication
    of duplicated data. This process is called rehydration.


    To save time, in most storage systems compression is performed only on unique
    data chunks after deduplication.


    Storage vendors use many different deduplication and compression algorithms. Some
    are more CPU-intensive and sophisticated than others.


    To avoid performance impact, deduplication and compression is generally preferred
    on cold data, meaning the data that is not being accessed by the host actively.
    However, some vendor implement inline deduplication and compression with latest
    hardware and software solutions.


    Inline deduplication and compression reduces data while it is being written to
    the disk, whereas post-process first writes the data on to the disk then reduces
    it later point in time.


    Inline data reduction technologies also reduce the number of I/O operations in
    storage system.


    Space reduction ratios by capacity optimization are depicted as:


    ![equation](images/page208_1.png)'
