- raw: "Here are some features of NVMe over Fabrics (NVMe-oF):\n\n•  The NVMe-oF protocol\
    \ is similar to NVMe protocol, designed to enable NVMe based commands to transfer\
    \ data between a host computer and a target solid state storage device over a\
    \ network. The network can be FC, Ethernet or InfiniBand.\n\n•  Local NVMe maps\
    \ commands and responses to shared memory in the host over the PCIe bus. NVMe-oF\
    \ uses a message-based model for communication between a host and a target storage\
    \ device.\n\n•  NVMe-oF enables the use of alternate transports to PCIe that extends\
    \ the distances across which an NVMe host device and NVMe storage drive. This\
    \ includes enabling a frontend interface of SSD-based storage systems for communicating\
    \ with NVMe host.\n\n#### HDD capacity measurement\n\nHDD manufacturers define:\
    \ 1000 Bytes = 1 KB, 1000KB = 1MB, 1000MB = 1GB = 1 billion bytes\n\nWhereas,\
    \ the operating system (i.e. the computer) shows in powers of two value, therefore,\
    \ a gigabyte (GB) is actually 1024 X 1024 X 1024 bytes.\n\n•  Actual capacity:\n\
    \n = Advertised or manufacturer’s capacity X (1000/1024) X (1000/1024) X (1000/1024)\n\
    \n = Advertised or manufacturer’s capacity X 0.93\n\n![Figure 2.13: Advertised\
    \ Vs Actual Capacity](images/Fig_2.7a.png)\n\nFigure 2.13: Advertised Vs Actual\
    \ Capacity\n\n•  Example:\n\n o Formatted Capacity of 300GB is equal to 300GB\
    \ X 0.93 = 279GB\n\n o Formatted Capacity of 1TB or 1000GB is equal to 1000GB\
    \ X 0.93 = 931GB\n\n The greater the capacity, the higher is the difference between\
    \ advertised value and actual capacity.\n\nIn some way, older storage systems\
    \ incorrectly used GB, but they meant 1024 X 1024 X 1024 bytes. As per National\
    \ Institute of Standard and Technology (NIST), 1024 X 1024 X 1024 is basically\
    \ GiB, not GB. All modern storage systems use following units as defined at [http://physics.nist.gov/cuu/Units/binary.html](http://physics.nist.gov/cuu/Units/binary.html)\n\
    \n| Unit || Abbreviation || Number of Bytes |\n\n| --- | --- | --- |\n\n| kibibyte\
    \ || KiB || 1024 |\n\n| Mebibyte || MiB || 1024 X 1024 |\n\n| Gibibyte || GiB\
    \ || 1024 X 1024 X 1024 |\n\n| Tebibyte || TiB || 1024 X 1024 X 1024 X 1024 |\n\
    \nTable 2.3: Storage capacity units\n\n### Drive enclosures\n\nIt is an enclosure\
    \ that contains pool or array of physical disk drives. Drive enclosure is also\
    \ called Just a Bunch of Disk (JBOD). Typically, all storage arrays support multiple\
    \ enclosures.\n\n![Figure 2.14: Disk enclosure (JBOD)](images/Fig_2.8.png)\n\n\
    Figure 2.14: Disk enclosure (JBOD)\n\nThe number of drives that can go in and\
    \ the orientation of drives are depended on vendors that the JBODs designed. All\
    \ the drives are connected to two I/O modules at rear via a backplane. Firmware\
    \ runs inside I/O module. Usage of two I/O module is to provide fault tolerance\
    \ and load balance capability.\n\nJBOD makes storage system modular, as it allows\
    \ organizations to buy the amount of storage they need initially. Later, they\
    \ can buy disks along with the enclosure as and when they need more storage space.\n\
    \nDue to the array of physical disks in enclosure, the whole storage system commonly\
    \ referred as a storage array or an array.\n\n### Backend switches or backplane\
    \ interconnects\n\nDifferent vendor’s storage systems are designed to use different\
    \ technology to connect physical drives to the controller. Some vendors connect\
    \ physical drives via cascade cabling or switches, while others connect via backplane\
    \ circuit board. The storage controller’s device ports are connected to these\
    \ switches or the backplane. Again, disk drives are connected to these switches\
    \ or the backplane.\n\nThe data received by the controllers from the host server\
    \ at the frontend are processed and passed to the backend for storing them on\
    \ to respective disk drives.\n\n### Cables and connectors\n\nCable and connectors\
    \ are mainly used to connect drive enclosures, power, and so on. Typically two\
    \ or more cables are used to connect a disk enclosure to increase bandwidth and\
    \ load balance and fault tolerance due to any cable fault.\n\nLarge or high-end\
    \ storage disk array may have long and complex cabling, whereas smaller disk array\
    \ may have short and less complex cabling.\n\n### Rack\n\nThis is a refrigerator\
    \ like box in which all hardware components are mounted, including storage controllers\
    \ and disk enclosures. This ensures that cabling of all the components are secure\
    \ and intact. Smaller disk array may not need an entire rack.\n\n### Storage network\
    \ components\n\nThe components that form a network between the host server and\
    \ storage system and help host servers to communicate with the storage system\
    \ are called storage network components. These components vary from type of solution\
    \ implemented. For example, FC SAN network requires one or more FC switches, and\
    \ IP network for NAS solution requires Ethernet switch. The major component in\
    \ the storage network is the switch. DAS solution does not use any switch, instead,\
    \ it just uses a direct cable between host and storage system for communication\
    \ purpose.\n\nMultiple switches are installed and connected to each other to form\
    \ a vast network.\n\nComponents that comprises a storage network are: HBA, switches,\
    \ cables, and connectors. Though HBA is installed inside the host server, and\
    \ is a part of the host server layer, it can also be considered as one of the\
    \ networking components.\n\n![Figure 2.15: Switch, fibre optic cables and SFP](images/Fig_2.9.png)\n\
    \nFigure 2.15: Switch, fibre optic cables and SFP\n\nHBA and switch, both run\
    \ firmware to activate their functionalities.\n\nIn FC based network, FC supports\
    \ both media options and can run on copper cables or optical cables.\n\nOptical\
    \ fibre supports:\n\n•  Long distance up to 10Km.\n\n•  High-speed up to 64Gbps.\n\
    \n•  Immunity to induced electromagnetic signals.\n\n•  Requires an SFP at both\
    \ ends of the cable to convert light signal to electric signal. SFP is also referred\
    \ as gigabit interface converter (GBIC).\n\nA fibre optic transceiver or SFP transceiver\
    \ usually consists of a transmitter and a receiver in a single module.\n\n![Figure\
    \ 2.16: Fibre optic transceiver and receiver](images/Fig_2.9a.jpg)\n\nFigure 2.16:\
    \ Fibre optic transceiver and receiver\n\nIn fibre optic data links, the transmitter\
    \ converts the electrical signal into an optical signal from a laser diode or\
    \ LED. The light from the transmitter is coupled into the fibre with a connector\
    \ and is transmitted through the fibre optic cable. The light from the end of\
    \ the fibre is coupled to a receiver where a detector converts the light back\
    \ into an electrical signal.\n\nSFP is hot-pluggable component.\n\nWhen devices\
    \ of different speed are connected, speed negotiation takes place from higher\
    \ speed, then steps down to lower.\n\n![Figure 2.17: Block diagram of an SFP](images/Fig_2.10.jpg)\n\
    \nFigure 2.17: Block diagram of an SFP\n\n1\\. Light transmission in an optical\
    \ fibre by total internal reflection.\n\n2\\. Core.\n\n3\\. Cladding material.\n\
    \n![Figure 2.18: Light transmission through an optical fibre](images/Fig_2.11.png)\n\
    \nFigure 2.18: Light transmission through an optical fibre\n\nThere are two type\
    \ of fibre cables, multimode and single-mode:\n\n•  Multimode fibre has a relatively\
    \ large light carrying core, usually 62.5 microns or larger in diameter. It is\
    \ usually used for short distance transmissions with LED based fibre optic equipment.\
    \ In multimode, beams of different photons reaches at different time, it makes\
    \ it difficult to know, 1 or 0. Therefore, supported distance becomes shorter\
    \ with speed.\n\n•  Single-mode fibre has a small light carrying core of 8 to\
    \ 10 microns in diameter. It is normally used for long distance transmissions\
    \ with laser diode based fibre optic transmission equipment. Single-mode fibre\
    \ has a recommended maximum length of 10km.\n\nElectrical cables are low cost\
    \ alternative to short distance–30meters.\n\n![Figure 2.19: FC electrical copper\
    \ cable](images/Fig_2.12.jpg)\n\nFigure 2.19: FC electrical copper cable\n\n##\
    \ Software defined storage"
