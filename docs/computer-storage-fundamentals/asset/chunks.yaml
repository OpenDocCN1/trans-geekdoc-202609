    ### Configuring file server storage\n\n- Create `SMB` or `NFS` share. Refer product\
    \ documentation for exact steps to create shares.\n- Assign permission to share\
    \ for desired user.\n\n### Configuring file share client\n\n- Mount the `SMB`\
    \ or `NFS` share using `\\\\Server IP or Hostname\\<Share name>`\n- Supply username\
    \ and password to access the share.\n\n# Conclusion\n\nAll storage vendors develop\
