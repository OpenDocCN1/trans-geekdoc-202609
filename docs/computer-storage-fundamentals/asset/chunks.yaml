    \ Data on the clone volume will same as data on parent virtual volume at:\n\n\
    \ a. 9:00 AM\n\n b. 10:00 AM\n\n c. In between of 9:00 AM and 10:00 AM\n\n d.\
    \ Cannot be determined\n\n 14. RPO for synchronous replication is:\n\n a. 0\n\n\
    \ b. 1 hour\n\n c. 2 hours\n\n d. 3 hours\n\n 15. Which of the following solution\
