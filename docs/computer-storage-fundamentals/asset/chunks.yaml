  fmt: "\n# RAID 技术概述\n\n## 大型顺序 I/O 请求\n\n### 低于 RAID 3 和 5\n\n## 空间效率 vs 可用性 vs\
    \ 性能\n\n选择 RAID 级别始终是在存储空间效率、可用性和性能这三个方面之间的权衡。例如，`RAID 0` 具有最大的空间效率并提供更好的性能，但容错能力极低。任何磁盘的故障都可能导致卷数据丢失。另一方面，`RAID\
    \ 1` 提供更好的容错能力和性能，但空间效率较差。因此，存储管理员根据业务需求选择合适的 RAID 级别非常重要。\n\n![Figure 3.36: RAID\
    \ level tradeoffs](images/Fig_3.36.png)\n\n**Figure 3.36: RAID level tradeoffs**\n\
    \nRAID 技术也随时间演进，目前现代存储系统将多个 RAID 虚拟卷组合起来构建另一层虚拟化。虽然这增加了实现和故障排除的复杂性，但进一步提升了性能和数据可用性。这称为**虚拟\
    \ RAID**。\n\n存储虚拟化是每个存储解决方案中常见的实现技术。RAID 是存储系统内部虚拟化的一个例子。同样，虚拟化也可以跨多个存储系统实现，或在网络层或主机服务器层实现。这提高了性能和空间利用效率。\n\
    \n# 案例研究\n\n## 案例研究 1：性能和空间效率至关重要\n\n让我们看看性能和空间效率：\n\n### 需求\n\n一个组织需要存储卷来测试软件产品。性能和可用容量对他们最重要。如果测试数据丢失，他们可以重新复制。针对该需求可以提出什么解决方案？\n\
    \n### 分析\n\n如 [Figure 3.35](#ch03.xhtml#fig3-35): RAID Level tradeoffs 所示，除 `RAID\
    \ 0` 外，所有 RAID 级别都提供针对任何磁盘故障的数据保护。`RAID 0` 还提供最大性能，因为底层 `RAID 0` 卷的所有驱动器都参与读/写请求。由于\
    \ `RAID 0` 不涉及数据的奇偶校验或镜像，所有驱动器的整个空间都用于存储数据。因此 `RAID 0` 提供最大可用容量。\n\n### 解决方案\n\
    \n推荐使用 `RAID 0` 虚拟卷满足该需求。可参考 [Figure 3.15](#ch03.xhtml#fig3-15): Striped disk\
    \ array without fault tolerance 了解 `RAID 0` 的实现方式。\n\n## 案例研究 2：启用虚拟 RAID 的存储系统中的磁盘故障测试\n\
    \n让我们看看启用虚拟 RAID 的存储系统中的磁盘故障测试：\n\n### 需求\n\n一家公司最近购买了一套包含 120 个磁盘的最新存储系统。该存储系统支持虚拟\
    \ RAID。管理员想要测试当使用所有磁盘配置虚拟 RAID 1 时的磁盘故障模式。\n\n### 分析\n\n虚拟 RAID 将每个物理磁盘分解为更小的物理块，这是物理磁盘的微型版本。当从所有\
    \ 120 个磁盘创建虚拟 RAID 1 时，基于这些块会形成数百个逻辑磁盘，然后将它们连接起来形成一个虚拟卷。每个 RAID 1 逻辑卷块由位于不同物理驱动器上的物理块组成。从宏观视角看，虚拟\
    \ RAID 1 的布局类似于 `RAID 1 + 0`，但在较小物理块的粒度上，而不是像传统 RAID 级别那样考虑整个磁盘。\n\n因此总共会有 60\
    \ 对磁盘。对于测试，管理员最多可以同时拔出 60 个磁盘，但每个驱动器只能是每对中的一个成员。但如果他只拔出两个驱动器，而它们恰好属于同一对，则虚拟卷将进入故障状态。\n\
    \n### 解决方案\n\n参考生产文档以确定 RAID 布局。一旦理解了布局，就可以同时使每对中的一个成员故障或拔出，而不影响虚拟卷。\n\n然而，拔出同一对的两个驱动器可能会影响卷。\n\
    \n# 学习检查\n\n## 客观题\n\n1. 考虑一个由四个 750 GB 磁盘组成的 RAID 阵列，如果创建 RAID 5 卷，可用容量是多少：\n\
    \   - a. 3 TB\n   - b. 1.5 TB\n   - c. 2.25 TB\n   - d. 1 TB\n\n2. 如果您的应用程序大部分时间执行写操作，您不会倾向于选择以下哪种\
    \ RAID：\n   - a. RAID 5\n   - b. RAID 1\n   - c. RAID 0\n   - d. RAID 1 + 0\n\n\
    3. 为什么我们需要配置 RAID 来存储数据（选择所有适用项）：\n   - a. 成本效益\n   - b. 更好的性能\n   - c. 容错\n \
    \  - d. 空间效率\n\n4. 为了获得更好的性能，如果 RAID 在以下哪个层级实现，您会选择哪个选项：\n   - a. 软件层级\n   - b.\
    \ 硬件层级\n   - c. 两个层级\n   - d. 任何层级\n\n5. RAID 1 的主要缺点是什么：\n   - a. 性能差\n   - b.\
    \ 低容错\n   - c. 成本无效\n   - d. 以上全部\n\n6. 您配置了 16 个驱动器的 RAID 1+0，为了测试，您最多可以同时拔出多少个驱动器而不丢失数据：\n\
    \   - a. 2\n   - b. 4\n   - c. 8\n   - d. 16\n\n7. RAID 影响：\n   - a. 容错\n   -\
    \ b. 性能\n   - c. 空间效率\n   - d. 以上全部\n\n8. 在不影响对 RAID 6 卷上数据访问的情况下，最多可以有多少个驱动器同时故障：\n\
    \   - a. 1\n   - b. 2\n   - c. 3\n   - d. 4\n\n9. RAID 4 的主要缺点是什么：\n   - a. 字节级条带化\n\
    \   - b. 奇偶校验驱动器成为瓶颈\n   - c. 块级条带化\n   - d. 奇偶校验分布式\n\n10. 如果用户在两个 10 MB 磁盘的\
    \ RAID 0（条带化）卷上复制一个 12 MB 的文件，哪个陈述是正确的：\n    - a. 前 10 MB 写入第一个磁盘，然后 2 MB 写入第二个磁盘\n\
    \    - b. 10 MB 写入第一个磁盘和 2 MB 写入第二个磁盘同时进行\n    - c. 6 MB 数据同时写入两个磁盘\n    - d.\
    \ 前 6 MB 复制到第一个磁盘，然后 6 MB 复制到第二个磁盘\n\n11. 哪个 RAID 级别没有容错能力：\n    - a. RAID 0\n\
    \    - b. RAID 1\n    - c. RAID 5\n    - d. RAID 6\n\n12. 虚拟 RAID 的缺点是：\n    -\
    \ a. 性能降低\n    - b. 低容错\n    - c. 实现复杂性\n    - d. 故障时数据恢复复杂\n\n13. RAID 0 卷最多可以有多少个驱动器故障而不丢失任何数据：\n\
    \    - a. 3\n    - b. 2\n    - c. 1\n    - d. 0\n\n14. 在三成员 RAID 1 卷中，最多可以有多少个驱动器同时故障而不丢失任何数据：\n\
    \    - a. 3\n    - b. 2\n    - c. 1\n    - d. 0\n\n15. 在三成员 RAID 5 卷中，最多可以有多少个驱动器同时故障而不丢失任何数据：\n\
    \    - a. 3\n    - b. 2\n    - c. 1\n    - d. 0\n\n16. 虚拟 RAID 在安装了 20 个磁盘驱动器的存储系统中实现，用户创建了一个数据与奇偶校验比为\
    \ 4:1 的 RAID 5 卷。假设没有两个驱动器来自同一个逻辑卷块，最多可以有多少个驱动器同时故障而不影响虚拟卷的数据访问：\n    - a. 8\n\
    \    - b. 4\n    - c. 10\n    - d. 5\n\n17. 您购买了一个包含 20 个磁盘的磁盘阵列。您有两个选项：选项 1：使用所有\
    \ 20 个磁盘创建单个 RAID 5 卷；选项 2：使用每组 5 个磁盘创建 4 个不同的 RAID 5 卷。以下哪些陈述是正确的：\n    - a.\
    \ 作为一个整体，选项 1 相比选项 2 会损失更多空间\n    - b. 选项 1 相比选项 2，整个数据丢失的概率更高\n    - c. 相对而言，选项\
    \ 2 预期性能更高\n    - d. 以上全部\n\n18. 创建 RAID 5 至少需要多少个物理驱动器：\n    - a. 2\n    - b.\
    \ 3\n    - c. 4\n    - d. 5\n\n19. 创建 RAID 6 至少需要多少个物理驱动器：\n    - a. 3\n    -\
    \ b. 4\n    - c. 5\n    - d. 6\n\n20. 是否可以为 RAID 0 阵列配置热备盘：\n    - a. 是\n    -\
    \ b. 否\n\n21. 您有一个视频流应用程序，主要进行大块顺序读/写操作，您会选择哪个 RAID 级别：\n    - a. RAID 3\n   \
    \ - b. RAID 4\n    - c. RAID 5\n    - d. RAID 6\n\n22. 您的应用程序需要更多存储性能，您配置了一个 4\
    \ 成员 RAID 0 卷，但应用程序仍因存储超时而失败，接下来您可以考虑什么：\n"
