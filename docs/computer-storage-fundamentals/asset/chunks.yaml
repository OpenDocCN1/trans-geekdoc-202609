    # CHAPTER 7 Fault Tolerance and Data Protection


    ## Introduction


    One of the primary objectives of a storage system is to protect the business critical
    data from all possible hardware and software failures. In the first three chapters,
    we learned that the storage solution and storage systems are designed to prevent
    any disruption of host access to data in the event of hardware failure at every
    level, starting from multipath, multiple controllers, disk enclosures with dual
    path cabling, RAID implementation. In addition to these, all storage vendors implement
    several other features and functionalities, such as snapshot, clone, and data
    replication to protect data. Organizations also take additional precaution to
    implement backup solution that helps to recover data, if required.


    ## Structure


    Upon successful completion of this chapter, you will learn about:


    - Storage features that enhance fault tolerant aspect of the solution

    - Local replication

    - Remote replication and disaster recovery

    - Backup solution

    - Continuous data protection

    - Copy data management


    ## Objectives


    By the end of this chapter, you will learn about various features that enable
    host application to continue accessing the data in the event of failure within
    storage solution or storage system. This chapter also explains storage technologies
    related to data protection, such as snapshot, clone, and replication that allow
    recovery of data in case of any corruption or accidental loss. This chapter also
    highlights different type of backup solutions that organizations implement to
    recover data in case of any loss.


    ## Fault Tolerance and Data Protection


    In the context of storage fault tolerance and data protection, two important terminologies,
    business continuity (`BC`) and disaster recovery (`DR`) are commonly used.


    `BC` is more of proactive planning and strategy that ensures availability of business
    critical data so that organization’s business operates with minimal or no downtime
    or outage. `DR` is reactive measure about how quickly data can be recovered and
    applications are restored back in operation in an event of a disaster. Features
    and functionalities of an intelligent storage system, described below, support
    organizations to implement both business continuity and disaster recovery solution.


    ### Multipath


    `Multipath` is an in-built driver component of any modern operating system running
    on the host server. This component is considered as part of a storage solution.
    In case of any link failure between host server and storage system, `Multipath`
    driver running in operating system redirects all I/O requests to via other surviving
    paths. Link failure can be caused by any cable fault, switch failure or any other
    disruption in the environment. Following diagram shows an example, in which path
    between `HBA2` and `Switch2` failed, in this situation, all read/write requests
    will be processed via `HBA1` paths. During normal operation, if bandwidth utilization
    is more than the bandwidth of `HBA1` path, then failure of `HBA2` paths may impact
    performance of the read/write requests until failed path is restored.


    ![Figure 7.1: Fault tolerance through multipath](`images/Fig_7.1.jpg`)


    *Figure 7.1: Fault tolerance through multipath*


    ### Multiple Controllers


    Every storage system is designed for at least two or more controllers. One of
    the reasons to have multiple controllers is to continue application access in
    case of controller failure. Any hardware or software component of a controller
    can stop functioning, in this situation, application is not even aware about the
    failure, as other surviving controllers seamlessly take over the read/write operations.


    As shown in the following figure, controller 1 (`CTRL1`) failure causes controller
    2 (`CTRL2`) to take over the operations.


    ![Figure 7.2: Fault tolerance through multiple controllers](`images/Fig_7.2.jpg`)


    *Figure 7.2: Fault tolerance through multiple controllers*


    ### Disk Enclosures with Dual Path


    In the backend of the storage system, disk enclosures are also designed to have
    two paths to controllers. This is to ensure, in case of one path failures, communication
    with physical disks still maintained by the controllers. Each physical disk also
    has two ports one connected to one path and other to other path.


    ![Figure 7.3: Fault tolerance in dual path disk enclosure](`images/Fig_7.3.png`)


    *Figure 7.3: Fault tolerance in dual path disk enclosure*


    ### RAID Implementation


    As discussed in [`Chapter 3`](#ch03.xhtml), `RAID` is one of the important considerations
    within storage system to ensure no impact of host accessing data in case of any
    disk failure. Except `RAID` level 0, all other `RAID` levels provide fault tolerance
    in the storage system. For instance, data on a `RAID 6` volume will be accessible
    even after failure of maximum of two disk failure.


    ![Figure 7.4: Fault tolerance in RAID](`images/Fig_7.4.png`)


    *Figure 7.4: Fault tolerance in RAID*

