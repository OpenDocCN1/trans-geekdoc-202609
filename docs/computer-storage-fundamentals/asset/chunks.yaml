  trans: '


    # 存储网络技术


    ## NVMe 协议


    非易失性内存表达 (NVMe) 通过大幅降低延迟和提高吞吐量，彻底改变了存储行业。大多数存储供应商已重新设计其存储系统，以在前端和后端均使用 NVMe 协议。


    第 2 章“存储基础设施”详细解释了存储系统后端磁盘驱动器接口使用 NVMe 协议的情况。


    前端主要使用两种传输协议，即 FC 和 IETF 传输控制协议 (TCP)，用于在发起端主机服务器和目标存储系统之间传输数据和命令。


    基于 FC 的 NVMe 称为 NVMe-oFC 或 NVMe/FC，基于 TCP 的 NVMe 称为 NVMe-oTCP 或 NVMe/TCP。


    支持的 FC HBA 和配备更新驱动程序的 NIC 分别用于支持 NVMe/FC 和 NVMe/TCP。


    现代企业存储系统总共支持四种主机协议：FC、iSCSI、NVMe/FC 和 NVMe/TCP。下图展示了所有类型主机的基础设施，尽管组织可能不需要将所有类型的主机一起部署。


    ![Figure 4.17: Host types based on communication protocol](img/Fig_4.17.png)


    | 主机类型 | 基础设施 | 传输协议 | 数据协议 | 发起端和目标端标识 | 存储卷标识 |

    | --- | --- | --- | --- | --- | --- |

    | FC | FC | FC | SCSI (FCP) | WWN | 逻辑单元号 ID (LUN ID) |

    | iSCSI | 以太网 | TCP | SCSI | IQN | LUN ID |

    | NVMe/FC | FC | FC | NVMe | NQN | 命名空间 ID (NSID) |

    | NVMe/TCP | 以太网 | TCP | NVMe | NQN | NSID |


    表 4.6：传输和数据通信协议


    NVMe 是一项新兴技术。NVMe 的主要优势是每个控制器支持 64K 个队列，从而降低延迟。由于它不需要任何额外的基础设施，大多数组织正在迁移到 NVMe
    环境。


    ## FCoE (基于以太网的光纤通道)


    ### FCoE 概述


    FCoE 解决了组织必须为其 LAN 和 SAN 运行并行网络基础设施的问题。因此，他们必须为这些网络中的每一个分别操作独立的交换机、HBA、NIC 和线缆。即使利用
    VMware 等虚拟化解决方案，实际上也会增加将流量从服务器传出所需的网络适配器数量。


    ### FCoE 减少卡和线缆


    面对如此众多的 NIC、HBA、交换机和线缆，运行数据中心的资本支出和运营支出都会显著增加。FCoE 通过在同一基础设施上运行 LAN 和 SAN，提供了一种大幅减少卡、交换机、适配器和各类线缆数量的方法。根据分析机构
    Enterprise Strategy Group (ESG) 的数据，由于硬件成本降低，部署 FCoE 的成本比传统网络低得多。


    ![Figure 4.18: FC/iSCSI vs. FCoE](img/Fig_4.18.png)


    换个角度看，FCoE 是一种在以太网网络（有线和无线计算机网络的主流）上使用 FC 协议（SAN 的主流）的标准。FCoE 提供了一种通过以太网传输 FC
    SAN 流量的方式，消除了对单独存储网络的需求。


    要理解 FCoE，掌握构成 FC 和以太网术语的两个关键定义非常重要。


    ### FCoE 技术


    #### 光纤通道


    FC 是一种用于高速企业级存储联网的串行数据传输协议和标准。它支持高达 10 Gbps 的数据速率，并通过高速光网络传输存储数据。从本质上讲，FC 是存储设备（如
    HBA、交换机和控制器）进行通信的语言。


    #### 以太网


    以太网是近 40 年前为 LAN 开发的一种架构。早期它支持高达 10 Mbps 的速度。然而，最近这已扩展到 1 Gbps、10 Gbps 及更高。以太网本质上是一种传输介质，使数据能够以帧为单位沿线缆或无线传输。


    FCoE 基本上是一种基于电气和电子工程师协会 (IEEE) 802.3 标准，将 FC 映射到全双工以太网网络上的方式。除了整合 I/O，它还是一种通过消除为存储和网络建立和运行并行网络的必要性来降低复杂性的有效方法。


    该技术可采用机顶 (ToR) 配置部署：支持 FCoE 的交换机位于机架顶部，取代 FC 交换机和以太网交换机。此配置假设使用融合网络适配器 (CNA) 或支持
    FCoE 的通用主板局域网 (LOM)。


    如果需要，可以为每台服务器建立至少两个到 ToR FCoE 交换机的 FCoE 连接，以实现冗余连接。这将取代每台服务器为实现冗余而设置的两个 FC 和两个以太网连接。然后
    ToR 交换机将以太网流量发送到 LAN，将 FC 流量发送到 SAN。


    除了 ToR 交换机，FCoE 还以其他形式提供，例如插入存储骨干的刀片，以及在服务器层面，用于 FCoE 的 CNA 可以替换 FC HBA 和以太网 NIC
    及相关线缆。同一端口可同时支持这两种协议。从整体网络协议栈来看，FCoE 在链路层路由 FC 流量，并使用以太网传输 FC 协议。


    总体而言，向 FCoE 的转变被视为网络融合总体趋势的一部分。近年来，我们在语音和数据等领域看到了融合。过去，电信运营商使用一个网络传输电话线路，另一条线路传输计算机数据流量。这通过互联网协议语音
    (VoIP) 实现了融合，以减少网络混乱并统一流量。


    相同的基本趋势现在开始在存储领域生效，越来越多的硬件可以适应融合网络。例如，服务器可配备通用连接适配器，能够通过主板上的芯片或适配器卡处理几乎任何基于以太网的协议。最终，存储网络可能会与以太网完全融合，但目前，融合和专用存储网络仍广泛部署。


    ## 文件访问协议


    NAS 设备通常利用现有的 IP 网络进行连接，使公司能够降低访问共享存储的入门成本。


    现代企业 NAS 设备固有的 RAID 和集群功能与传统 DAS 相比，提供了大幅提高的可用性。


    因为 NAS 设备控制文件系统，所以在使用快照等高级存储功能时，它们提供了更大的灵活性。


    凭借 10GE 连接，NAS 设备可以提供与许多当前安装的 FC SAN 相当的性能。


    NFS/CIFS (NAS) 存储协议旨在接受主机请求，如 `create-file-Mywork.doc` 或 `read-file-Office.xls`。


    NFS 是一种分布式文件系统协议，最初由 Sun Microsystems 于 1984 年开发，允许客户端计算机上的用户通过网络访问文件，方式类似于访问本地存储。相反，CIFS
    是其基于 Windows 的对应协议，用于文件共享。


    NFS 使用建议性锁锁定实现；进程可以在文件被锁定时读取和写入该文件。但是，进程可以在读取或写入前检查锁是否存在。


    与 SAN 不同，NAS 使用基于文件的协议，如 NFS 或 SMB/CIFS，此时存储是远程的这一事实是明确的，计算机请求的是抽象文件的一部分，而不是磁盘块。DAS
    和 NAS 的关键区别在于，DAS 只是现有服务器的扩展，不一定联网。NAS 旨在作为一种简单且自包含的解决方案，用于通过网络共享文件。


    '
