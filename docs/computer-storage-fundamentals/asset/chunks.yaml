- raw: 'Generally, a storage system comprises specially designed hardware and firmware.
    Primary hardware components are controllers and physical disks. Firmware is designed
    to run on the controller as an operating system. All storage features such as
    RAID, local and remote replication, thin provisioning, de-duplication are implemented
    within the firmware. Management software is the upper layer component that is
    designed to manage the storage system.


    ![Figure 2.20: Storage system with hardware, firmware and management stack](images/Fig_2.13.png)


    Figure 2.20: Storage system with hardware, firmware and management stack


    SDS is a solution implemented inside a customized operating system that can run
    on any commodity hardware, thus, decoupling storage firmware and management software
    from the physical storage hardware. With SDS, end user can buy any commodity hardware
    with required disk space and deploy a virtual machine (VM) in which the customized
    operation system is deployment.


    ![Figure 2.21: SDS: Firmware and management stack decouple from hardware](images/Fig_2.14.jpg)


    Figure 2.21: SDS: Firmware and management stack decouple from hardware


    Primary advance of SDS is cost effectiveness, as it does not require any special
    hardware. However, for enterprise workload regular storage system is best suitable.


    Due to the popularity of SDS, DAS has recently caught attention. Many companies
    buy commodity hardware and configure DAS and deploy SDS on it to have an intelligent
    storage system.


    ### Securing storage infrastructure


    Today almost all organizations store their business critical information as digital
    data on to storage systems. Security of this critical data is a big concern in
    today’s world. Therefore, the computer information data security is a wide subject
    by itself. The primary objective of data security is prevention of unauthorized
    disclosure, data tampering, accidental corruption or deletion.


    As per Storage Networking Industry Association (SNIA) storage security is technical
    controls, which may include data integrity, confidentially and availability controls
    that protect storage resources and data from unauthorized users and uses.


    Confidentiality is disclosure of information only to authorized persons. Integrity
    ensures that information remains in its original form without altering it. And
    availability indicates information is ready to access within stated operational
    parameters. Availability also ensures in case of data corruption of deletion,
    how fast data can be restored to get back business operational.


    Storage infrastructure security is related with the physical, technical, and administrative
    controls as well as the preventive, detective, and corrective controls. That applies
    to the following infrastructure components:


    •  Host server with host bus adapter (HBA)


    •  Storage arrays


    •  Storage network switches


    •  Cable for storage networks


    •  Storage management


    •  Backup systems


    •  Virtualization


    •  Cloud storage


    •  Specialized services such as encryption, compression, and deduplication


    There are several methods and strategies that can be implemented to secure storage
    infrastructure from attackers. SNIA recommends, instead of focusing on abstract
    concepts of confidentiality, integrity, and availability (CIA) the following four
    technology components can be considered to secure storage infrastructure:


    •  Storage system security (SSS): Securing storage controller firmware, the embedded
    operating system and applications that integrates external authentication services,
    centralized logging, and firewalls.


    •  Storage resource management (SRM): Securely provisioning, monitoring, tuning,
    re-allocating, and controlling the storage resources so that data may be stored
    and retrieved.


    •  Data in-flight (DIF): Protecting the confidentiality, integrity and/or availability
    of data as they are transferred across the storage network, the LAN, and the WAN.


    •  Data at-rest (DAR): Protecting the confidentiality, integrity and/or availability
    of data residing on storage arrays.


    ### Managing storage infrastructure


    Managing storage infrastructure is an integral part of storage solution that assists
    the deployment, provision and monitors health of the solution.


    The primary management software is to manage the storage system itself. Every
    storage vendor supplies management software along with the storage array, which
    helps administrator to configure provision and monitor the storage system. Other
    management software allows protecting data by creating copy of data or creating
    backup copy.


    The management software for other hardware components, such as switch, HBA is
    also a part of storage solution. Hardware vendor of HBA and switch supplies management
    software along the hardware to configure and monitor these hardware components.


    [Chapter 9](#ch09.xhtml), Storage Management, explains more about storage management
    and all related software suite.


    ## Conclusion


    Storage infrastructure is collection of hardware, firmware and software components
    that comprises to form a storage solution. Components can be divided into three
    different layers storage, network, and host layers.


    Storage system or the storage disk array is the primary device or component in
    a storage solution. It stores application data and performance host server’s read/write
    requests.


    Storage disk array has six hardware components–storage controller, physical disk
    drives, disk enclosures, backend switches or backplane interconnects, cables and
    connectors and a rack.


    Hardware components of storage network are HBA, switch, cables and connectors.
    HBAs are installed in host servers to connect to the network. Switch is the primary
    complement in a network. Storage network is formed using one or more switches.


    Information data security is big concern in today’s world. Technical controls
    on CIA help protect storage resources and data from unauthorized users and uses.


    Managing storage solution includes initial deployment, providing and monitoring
    all the hardware components. The software suite that enables to manage the infrastructure
    is also part of storage infrastructure.


    ## Case studies


    ### Case study 1: Assembling hardware devices to build a storage solution


    Let us look at assembling hardware devices to build a storage solution:


    #### Requirement


    Your company has received the following hardware devices from a supplier. You
    are asked to connect the devices and implement the storage solution.


    1\. Host server


    2\. FC HBA


    3\. FC switch


    4\. FC cables


    5\. SFPs


    6\. Storage controllers


    7\. JBOD


    8\. Disk drives


    9\. Storage system management software


    #### Analysis


    First, identify the hardware components of different layers discussed earlier
    in the chapter. Disk drives, JBOD, and storage controller belong to the storage
    system layer, SFPs, cable, switch in network layer and host server and FC HBA
    in host layer.


    #### Solution


    •  First, install the disk drives into JBOD. Connect JBOD to device port of storage
    controller.


    •  Connect host port of storage controller using FC cables. Install SFPs in switches
    and connect other end of the FC cable to the switch.


    •  Install HBA in host server connect to switch.


    •  Install management software to configure and deploy the solution.


    ### Case study 2: Converting legacy DAS solution to latest storage technology


    Let us look at converting legacy DAS solution to latest storage technology:


    #### Requirement


    Your company has quite a few unused legacy servers, which are attached with direct
    attached JBODs. Company is looking for an option to utilize these hardwires to
    convert to a high performance and availability storage solution.


    #### Analysis'
