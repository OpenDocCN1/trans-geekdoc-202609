    However, for additional disk space, external disk enclosures are needed to be
    attached to it.


    In `DAS` storage solution, disk storage, file system and application, all layers
    belong to the host server. For this reason, all resources are dedicated to single
    server, and sharing is not possible with other host servers.


    ![Figure 1.8: DAS stacks](images/Fig_1.6.png)


    Figure 1.8: DAS stacks


    #### All Data Finally Stored as Blocks


    Host servers or client systems access storage system via different protocols and
    store data differently. For example, a client system accesses a file storage to
    store files. This is because file storage is designed to communicate via `CIFS`
    or `NFS` protocol via `IP` network interface. Here, according to the client system''s
    perspective, data is stored as a file, but, within the file storage, files reside
    on the file system. File system within a file storage represents the set of data
    blocks on disk as the file to the client system, beneath the file system is storage
    blocks.


    Although the type of storage is determined by the interfaces and communication
    protocol designed for client or host servers, fundamentally every storage is a
    block storage.


    ![Figure 1.9: Data storing technologies](images/Fig_1.7.png)


    Figure 1.9: Data storing technologies


    #### Cloud Storage


    Typically, large enterprise object storage systems are deployed in a data center
    and provided access to client computers and mobile devices stores their data on
    to it through the internet. This service model is called cloud storage.


    It is a great advantage for a user to access the data from anywhere in the world.
    In general, personal files such as pictures, videos, and archival data are stored
    in cloud storage, but not business critical application data, as it requires faster
    response time.


    ![Figure 1.10: Cloud storage](images/Fig_1.8.png)


    Figure 1.10: Cloud storage


    Cloud service provider ensures data availability to users by implementing various
    data protection solutions in the storage systems. Generally, service provider
    charges the user for this service.


    #### Storage Solutions Based on Deployment


    Storage solutions can also be classified based on configuration and level of complexity
