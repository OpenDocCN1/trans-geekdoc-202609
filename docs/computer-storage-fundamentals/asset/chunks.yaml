    # Introduction


    In today’s modern world, almost all information is in the form of digital data,
    such as e-mails, documents, spreadsheets, presentations, databases, graphics,
    audio, and image files. The explosive growth in the volume of digital data in
    last few years caused demand for more computer storage systems. To access and
    process data, it has become more important to store data faster and efficiently.
    Therefore, computer storage skill has become the most important for all Information
    Technology (IT) professionals.


    Almost all companies, small to large enterprises, deploy computers to meet their
    business objectives. These computers are primarily of three categories – servers,
    networking, and storages. All these three components are interconnected to run
    business applications. Applications, run on Servers, read and write data stored
    on to the storage systems.


    ![Figure 1: Servers, network and storage system](images/1.png)


    Figure 1: Servers, network and storage system


    Hard disk drives were introduced in 1956 as data storage for an IBM system. Since
    then, storage evolved to meet requirements of today’s world. With advancement
    of computer, mobile and popularity of internet, social media, digital data is
    growing exponentially. The current total global data is almost double than what
    was there two years back. Not only is the amount of data increasing, its criticality
    is also increasing significantly. This means that the impact due to the loss of
    digital data few years later, would be more severe than today. At the same time,
    the demand for rate of accessing data is also increasing significantly.


    To optimize and improve efficient resource sharing, a storage system is typically
    shared by multiple servers to store their data, therefore it is important to have
    a modern storage system with higher space efficiency, performance and fault tolerance.


    ![Figure 2: Three aspects of a storage system](images/2.png)


    Figure 2: Three aspects of a storage system


    A storage system is considered the best in the market, if it is capable of supporting
    higher degree of all three aspects.


    An interesting part is that most features of a storage system that improves one
    of these aspects, impacts the reduction of other aspects. For example, `RAID 0`
    improves storage performance, but reduces fault tolerance, deduplication improves
    storage efficiency, but impacts performance. It is a challenge for storage vendors
    to develop a storage that provides all the three aspects of storage systems.


    Most storage vendors develop and sell multiple storage applications to manage
    other aspect of storage systems, such as performance, local and remote replication,
    backup and data recovery solutions.


