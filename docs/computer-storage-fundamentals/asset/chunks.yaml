    \ in other words, this can also be described as allocation of storage LUN to that\
    \ server. This is the step performed to provide access LUN to a host server after\
    \ the creation of virtual volume. LUN masking is similar to zoning but is implemented\
    \ in the storage array, not in the switch.\n\nDifferent vendors use different\
    \ terminologies for allow and restrict server access to storage LUN, some of them\
    \ are present and unpresent or export and unexport or assigned and unassigned,\
