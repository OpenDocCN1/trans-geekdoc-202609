    device access speed by satisfying host read requests from its local cache memory
    when possible instead of external storage devices.

    - **Read-ahead**: Cache management technique for improving performance of synchronous
    sequential reads by pre-fetching data from disk and placing it into cache. The
    controller maintains, in the cache, copies of data recently requested by the host,
    and may fetch blocks of data ahead in anticipation that the controller will access
    the next sequential blocks. In normal read cache, host write requests are done
    as usual, without the caching mechanism.

    - **Adaptive**: More advanced technique than read-ahead caching. The adaptive
    cache algorithms anticipate host requests based on previous patterns. The blocks
    of data most likely to be requested are cached for quicker transmission to the
    host.


    ![Figure 3.8: Read caching technique](images/Fig_3.8.png)


    Figure 3.8: Read caching technique


    ### Purpose of Cache Battery


    - Unwritten cache data or unflushed data resides in cache, battery provides power
    to protect it, in case of any power failure.

    - Usually write cache is battery backed up, read cache is not.

    - But if single DIMM is in use, both read and write are battery backed up.

    - Newer storages are being designed with flash-backed cache, hence does not require
    any battery.


    ## RAID Concept


    In 1988, RAID levels 1 through 5 were formally defined by David A. Patterson,
    Garth A. Gibson and Randy H. Katz in the paper, *A Case for Redundant Arrays of
    Inexpensive Disks (RAID)*. The term RAID was first introduced in this paper; it
    spawned the entirestorage industry.


    RAID is an example of storage virtualization, which is discussed in the later
    of part of this book.


    ### What is RAID?


    - RAID - Redundant Array of Inexpensive/Independent Disks.

    - Conceptualized by a paper presented in 1987 at University of California, Berkeley.

    - Fundamentally, RAID is the use of multiple HDDs in an array that behaves in
    most respects like a single large, fast one.

    - Improve availability of data.

    - An attempt to bridge the widening gap between performance of processor vs. performance
    of disks.

    - To support faster data access required by video and multi-media applications
    warranted new storage architecture.


    ### Purpose of RAID


    Due to mechanical and magnetic parts, disk in any storage system has higher failure
    rate than any other component in it. RAID concept brings mainly two advantages:


    - **Performance**: Combine multiple small, inexpensive disk drives into a group
    to yield performance exceeding that of one large, more expensive drive.

    - **Availability**: Support fault tolerance by redundantly storing information
    in various ways. Increase capacity.


    A virtual volume is a logical reference to a portion of a storage subsystem. Virtual
    volume is means of provisioning space to host server.

    '
