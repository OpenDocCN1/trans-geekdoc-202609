- raw: '[Chapter 8: Space Efficiency](#ch08.xhtml) - In this chapter, you will learn
    about the storage features that store data in the most efficient way. These features
    are thin provisioning, expand, shrink, space reclamation (UNMAP), deduplication,
    and compression. A detailed explanation of these features guides you in understanding
    how each feature works and efficiently stores the data in a storage system.


    [Chapter 9: Storage Management](#ch09.xhtml) - Every storage vendor delivers some
    application software and a storage system to manage it. In this chapter, you will
    learn different types of management software and their purposes. This chapter
    explains the basic steps involved in implementing a storage solution, along with
    some examples. By the end of this chapter, you will have a clear idea of how storage
    solution is designed and implemented.


