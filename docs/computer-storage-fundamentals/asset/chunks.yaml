- raw: 'Figure 3.25: RAID 0+1: Mirror of stripes


    •  RAID 0+1 configuration where multiple disks are striped together into sets
    and then sets are mirrored together.


    •  Minimum number of disks required to implement RAID 0+1 is 3, where the data
    is striped across two disks in RAID 0 and then all the data is mirrored on a third
    disk. But it is more common to use a minimum of 4 disks.


    #### RAID 1+0, RAID 10, RAID 1 and 0 (Stripe of mirrors)


    ![Figure 3.26: RAID 1+0: Stripe of mirrors](images/Fig_3.26.png)


    Figure 3.26: RAID 1+0: Stripe of mirrors


    •  RAID 1+0 configuration where data is mirrored in sets and then multiple disks
    are striped together


    •  RAID 0 array of mirrors require a minimum of 4 drives


    #### RAID 1+0 vs. RAID 0+1


    ![Figure 3.27: RAID 1+0 vs. RAID 0+1](images/Fig_3.27.jpg)


    Figure 3.27: RAID 1+0 vs. RAID 0+1


    •  RAID 10 provides better throughput, speed, performance, and latency than all
    other RAID levels (except RAID 0).


    •  Any drive failure will cause the RAID unit to go into degraded state, now the
    chance of second drive failure from another set in RAID 0+1 is more than RAID
    1+0.


    •  In a degraded state, performance, especially read performance does not get
    reduced in RAID 1+0 compared with Raid 0+1.


    •  The rebuild will complete faster after replacing a failed disk.


    •  Generally, all vendors prefer to implement RAID 1+0 in their products.


    RAID level use scenarios


    •  Selecting the proper RAID level for a specific data storage application requires
    consideration be given to the benefits of each


    | RAID || Use |


    | --- | --- |


    | •  RAID 0 (1 disk)•  RAID 1 (2 disks)•  RAID 5 (3 disks)•  RAID 10 (4 disks)• 
    RAID 50 (6 disks)•  RAID 6 (4 disks) || •  Video/audio streaming•  OS boot•  Transaction/webserver• 
    Database•  Data warehousing•  Large capacity disk arrays |


    #### RAID metadata


    •  Metadata is nothing but data about data, in other word, information about another
    information. For example, index of a book.


    •  In RAID, technology metadata is a mapping table between logical disk to physical
    disk.


    •  For example, metadata table looks something similar to the following table.
    If the host server wants to write data on block X of logical disk 1 (RAID 1),
    data essentially gets written to block A of physical disk 1 and block 2 of physical
    disk 2.


    | Metadata || Metadata |


    | --- | --- |


    | Logical disk 1, block X || Physical disk 1, block APhysical disk 2, block B
    |


    | Logical disk 2, block Y || Physical disk 1, block CPhysical disk 2, block D
    |


    Table 3.5: Simple example of a metadata table


    •  In reality, metadata is extremely complex, dynamic and critical part of a storage
    system.


    ## Host-based RAID controller


    External storage system has two or more storage controllers. Storage controller
    also alternatively called as RAID controller. RAID controller can be installed
    within the host server itself and connect to internal or external disk enclosures.
    This DAS configuration is commonly used for entry level cost effective storage
    solutions. This RAID controller is called host-based RAID controller. All modern
    RAID controller supports SAS protocol.


    ![Figure 3.28: Host-based RAID controller](images/Fig_3.28.png)


    Figure 3.28: Host-based RAID controller


    ## Virtual RAID


    Most modern virtualized storage system has Virtual RAID implemented–each disk
    is logically divided into smaller chunks.


    ![Figure 3.29: Physical chunks](images/Fig_3.29.png)


    Figure 3.29: Physical chunks


    For simplicity of implementation, generally the size of physical chunk is fixed
    in a storage system. Larger virtual volume uses more number of logical chunks.


    Logical disks that we discussed above are formed based on those chunks and then
    concatenated them to form a virtual volume for host server to access. Something
    similar to hybrid RAID level discussed in previous section. For instance, Virtual
    RAID 1 is internally RAID 1+0.


    To ensure fault tolerance, each logical volume chunk is formed from physical chunk
    resides on different physical drives, so that failure of any drives should not
    impact virtual chunks, depending on RAID levels.


    ![Figure 3.30: Virtual RAID concept](images/Fig_3.30.png)


    Figure 3.30: Virtual RAID concept


    For example, if you have 20 numbers of 10GB disks and physical chunk size is 1GB,
    when you create a 10GB RAID 1 virtual volume, it actually creates 10 number of
    1GB RAID 1 logical volume chunks underlying to it. Each logical volume chunk again
    has two physical chunks reside on two different physical drives, thus involving
    all 20 physical drives.


    In this case, even if maximum of 10 drives, one from each pair, can fail, still
    data on virtual volume would be intact.


    If you create a 10GB RAID 1 virtual volume on a storage without Virtual RAID implemented,
    it only involves two drives, in which, performance may not be as much as the Virtual
    RAID implemented storage.


    In reality, this design is much more complex. Above example is just to illustrate
    a simple example to describe the concept. In some cases, data recovery also becomes
    complex in the event of multiple drive failure.


    To understand fault tolerance in Virtual RAID, let us consider a user created
    a RAID 6 virtual volume with data and party ratio 4:2 on a storage system with
    18 drives. There would be total three logical volume chunks, each of them formed
    from physical chunk from individual physical disk. Now let us assume that 6 drives
    failed together in such a way that two physical chunks from each logical chunk
    impacted. Since each logical chunks are in RAID 6, none of the logical chunks
    are impacted. Data on virtual volume would also be intact.


    ![Figure 3.31: Disk failure situation in Virtual RAID](images/Fig_3.31.png)


    Figure 3.31: Disk failure situation in Virtual RAID


    But if 3 drives fails together in such a way that one logical volume chunk is
    impacted, in that case data on virtual volume may not be accessible.


    ![Figure 3.32: Logical volume chunk failure situation in Virtual RAID](images/Fig_3.32.jpg)


    Figure 3.32: Logical volume chunk failure situation in Virtual RAID


    In summary, with the Virtual RAID, there can be multiple drive failure may not
    impact data in a virtual volume as long as each logical chunk is healthy, as opposed
    to a storage system with the traditional RAID, where any three disk failure together
    would make data inaccessible.


    Some physical chunks from each drive are kept aside for spare purpose. This is
    called distributed spare. In case of any drive failure, these spare physical chunks
    are used to rebuild each logical chunk. The number of physical chunks allocated
    for spare is typically based on the storage system’s internal design or user-defined
    policy.


    Primary advantages in this design, every virtual volume that user creates are
    resided on all the drives in the storage systems to boost read/write performance
    and degree of fault tolerance.


    Most vendors use different names for physical and RAID volume chunks and keep
    this internal to product design.


    Distributed Sparing: Within the Virtual RAID implementation, physical chunks are
    designated as spare chunks. Storage system internally or allows administrator
    to reserve some space for physical chunks. For example, if each physical chunk
    size is 1GB, disk size is 10GB and administrator reserves two disks capacity,
    then total 20 physical chunks are designated as spare chunks. In case of any disk
    failure, rebuild process generates data on all the chunks on the failed disk and
    stores on to the reserved spare chunks on other working disks. After completion
    of rebuild process logical chunks become healthy and number of spare chunks reduces
    until administrate replaces the failed disk with a working one.


