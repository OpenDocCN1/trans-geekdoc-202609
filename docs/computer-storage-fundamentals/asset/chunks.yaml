    ### Glossary and Key Terms


    - **Data transfer rate**: Amount of data transferred per unit time. Units are
    `MBps`, `GB per hour` and `TB per hour`.

    - **IOPS**: I/O per second, number of I/O requests completed per unit. Unit is
    `IOPS`.

    - **Latency**: Time to process a single I/O request. Unit is millisecond (`ms`).

    - **Response time**: Same as latency, time to process a single I/O request.

    - **Random I/O**: I/O request pattern requested by host server on random block
    on virtual volume.

    - **Sequential I/O**: I/O request pattern requested host server sequentially.

    - **XCOPY**: `EXTENDED COPY`, T10 SCSI standard to copy data within storage without
    needing to transfer the data between the Storage volume and the server.

    - **WSAME**: `WRITE SAME`, T10 SCSI standard, an initiator to zero a large number
    of disk blocks without needing to transfer a large number of zeroed buffers.

    - **QoS**: Quality of service, allows fair share of resources for optimal storage
    performance.


