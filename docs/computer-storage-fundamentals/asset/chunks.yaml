    \n*Figure 2.6: Storage system hardware components*\n\n### Storage controllers\n\
    \nThe primary hardware component that processes I/O request from host server and\
    \ does the read and write operations on to the backend physical disk drives. Different\
    \ vendors call this component different names–node, storage processor, and so\
    \ on.\n\nController itself is a computer and has:\n\n• CPU\n• Memory\n• Cache\
    \ memory for faster storing of user data\n• Application-specific integrated circuit\
    \ (ASIC)\n• Customized operating system, also known as firmware\n• Interfaces\
    \ or ports–typically, a controller has:\n  - Frontend or host ports–for connecting\
    \ to network or FC switches\n  - Backend or device ports–for connecting to drive\
