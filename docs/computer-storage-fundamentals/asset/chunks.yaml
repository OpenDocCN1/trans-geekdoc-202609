  fmt: "\n# Disk Storage Configuration Examples\n\n## Linux Host Disk Configuration\n\
    \n### FC HBA Details\n\n```\n# lspci | grep -i fibre\n0b:00.0 Fibre Channel: Emulex\
    \ Corporation Lancer-X: Light-Pulse Fibre Channel Host Adapter\n```\n\n### WWPN\
    \ of the HBA\n\n```\n# cat /sys/class/fc_host/host?/port_name\n0x1000a0b3cc1c2863\n\
    ```\n\nAlternatively, `WWPN` of `FC HBA` can also be collected from management\
    \ software or utilities provided by HBA vendors or from FC switch.\n\n### Initiator\
    \ IQN Name\n\n```\n# cat /etc/iscsi/initiatorname.iscsi\nInitiatorName=iqn.1994-05.com.redhat:548c8e222b7f\n\
    ```\n\n`iSCSI` initiator component is needed to be installed in host, if not installed\
    \ already.\n\n### Initiator NQN Name\n\n```\n# cat /etc/nvme/hostnqn\nnqn.2014-08.org.nvmexpress:uuid:30393137-3436-584d-5137-333730314a51\n\
    ```\n\n`NVMe` initiator component (`nvme-cli`) can be installed in host, if not\
    \ installed already.\n\n### Step 1: Create Host Entry in Storage System\n\nRefer\
    \ storage system product documentation for steps to create host entry in storage\
    \ system.\n\nCreate a host entry for `iSCSI` in the storage system with `IQN`\
    \ name and operating system details. Similarly create another host entry with\
    \ `WWPN` and operating system details.\n\n### Step 2: Create Virtual Volume and\
    \ Present to Host\n\nRefer storage system product document for steps to create\
    \ a storage volume and present to the host entry.\n\nHost server will use the\
    \ protocol to access the data on storage device based on type of host used to\
    \ present the virtual volume is presented. Though both protocols are supported\
    \ by a host together, but typically either of the protocol is configured and used.\n\
    \n### Step 3: Scan for New Disk\n\nIn case of `iSCSI`, an administration utility,\
    \ `iscsiadm`, part of `iSCSI` initiator component, can be used for discovering\
    \ the `iSCSI` target: `iscsiadm -m discovery -t send targets –p <IP of iSCSI Target>`\n\
    \nExample command:\n\n```\n# iscsiadm -m discovery -t sendtargets -p 10.1.1.1\n\
    10.1.1.1:3260,21 iqn.2000-05.com.vendorname:20210002ac008685\n```\n\nLogin all\
    \ sessions with the node.\n\nRescan sessions: `iscsiadm -m node \\-p <IP of iSCSI\
    \ Target>–rescan`\n\nExample command:\n\n```\n# iscsiadm -m node -L all\nLogging\
    \ in to [iface: default, target: iqn.2000-05.com.vendorname:20210002ac008685,\
    \ portal: 10.1.1.1,3260] (multiple)\nLogin to [iface: default, target: iqn.2000-05.com.vendorname:20210002ac008685,\
    \ portal: 10.1.1.1,3260] successful.\n```\n\nTo list the active `iSCSI` sessions:\n\
    \n```\n# iscsiadm -m session -o show\ntcp: [1] 15.213.67.33:3260,21 iqn.2000-05.com.vendorname:20210002ac008685\n\
    ```\n\nScanning for the disks:\n\n```\n# find /sys/class/scsi_host/host*/scan\
    \ | while read line; do echo - - - > $line; done\n```\n\n```\n# iscsiadm -m node\
    \ -p 10.1.1.1 –rescan\n```\n\n### Step 4: List Devices\n\nLinux native command\
    \ `disk` can be used to list all the disks discovered.\n\n```\n# fdisk -l\nDisk\
    \ /dev/sda: 299.6 GB, 299573968896 bytes\n255 heads, 63 sectors/track, 36421 cylinders\n\
    Units = cylinders of 16065 * 512 = 8225280 bytes\nDevice Boot Start End Blocks\
    \ Id System\n/dev/sda1 * 1 182 1461474 83 Linux\n/dev/sda2 183 36421 585741086\
    \ 8e Linux LVM\nDisk /dev/sdb: 299.6 GB, 299573968896 bytes\n255 heads, 63 sectors/track,\
    \ 36421 cylinders\nUnits = cylinders of 16065 * 512 = 8225280 bytes\nDisk /dev/sdb\
    \ doesn’t contain a valid partition table\n```\n\n### Step 5: Create Partition\n\
    \n`fdisk` command can also be used to create partition on the disk. Here is an\
    \ example to create a partition:\n\n```\n# fdisk /dev/sdb\nDevice contains neither\
    \ a valid DOS partition table, nor Sun, SGI or OSF disklabel\nBuilding a new DOS\
    \ disklabel. Changes will remain in memory only,\nuntil you decide to write them.\
    \ After that, of course, the previous content won’t be recoverable.\nCommand (m\
    \ for help): n\nCommand action\n  e extended\n  p primary partition (1-4)\np\n\
    Partition number (1-4): 1\nFirst cylinder (1-36421, default 3): Using default\
    \ value 3\n```\n\n```\nLast cylinder, +cylinders or +size{K,M,G} (3-36421, default\
    \ 36421): Using default value 36421\nCommand (m for help): w\nThe partition table\
    \ has been altered!\nCalling ioctl() to re-read partition table.\nSyncing disks.\n\
    ```\n\n### Step 6: Create File System\n\n```\n# mkfs /dev/sdb1\nmke2fs 1.41.12\
    \ (17-May-2010)\nFilesystem label=\nOS type: Linux\nBlock size=4096 (log=2)\n\
    Fragment size=4096 (log=2)\nStride=4 blocks, Stripe width=4096 blocks\n18284544\
    \ inodes, 73133904 blocks\n3656695 blocks (5.00%) reserved for the super user\n\
    First data block=0\nMaximum filesystem blocks=4294967296\n2232 block groups\n\
    32768 blocks per group, 32768 fragments per group\n8192 inodes per group\nSuperblock\
    \ backups stored on blocks:\n32768, 98304, 163840, 229376, 294912, 819200, 884736,\n\
    1605632, 2654208, 4096000, 7962624, 11239424, 20480000, 23887872, 71663616\n```\n\
    \n```\nWriting inode tables: done\nWriting superblocks and filesystem accounting\
    \ information: done\nThis filesystem will be automatically checked every 39 mounts\
    \ or 180 days, whichever comes first. Use tune2fs -c or -i to override.\n```\n\
    \n### Step 7: Mount File System\n\n```\n# mkdir /data1\n# mount /dev/sdb1 /data1\n\
    # df -h\nFilesystem Size Used Avail Use% Mounted on\n/dev/mapper/VolGroup00-LogVol00\
    \ 15G 2.4G 12G 18% /\n/dev/sda1 99M 13M 82M 14% /boot\n/dev/sdb1 275G 63M 261G\
    \ 1% /data1\n```\n\nIf all the disk partitions defined and file systems are to\
    \ be automatically mounted whenever the system boots, those entries need to be\
    \ included in `/etc/fstab` file.\n\n```\n# cat /etc/fstab\n/dev/VolGroup00/LogVol00\
    \ / ext3 defaults 1 1\nLABEL=/boot /boot ext3 defaults 1 2\ntmpfs /dev/shm tmpfs\
    \ defaults 0 0\ndevpts /dev/pts devpts gid=5,mode=620 0 0\nsysfs /sys sysfs defaults\
    \ 0 0\nproc /proc proc defaults 0 0\n/dev/VolGroup00/LogVol01 swap swap defaults\
    \ 0 0\n```\n\n```\n/dev/sdb1 /data1 ext3\n```\n\nNow, data can be stored in the\
    \ folder `/data1`.\n\n## Case Study 2: Provisioning Storage Space for a Windows\
    \ Host Server\n\nLet us provision storage space for a Windows host server:\n\n\
    ### Requirement\n\nA Windows host is connected to block storage. Network and SAN\
    \ zoning are already configured. Provide steps to create and configure storage\
    \ volume in host server via `FC` and `iSCSI`.\n\n### Analysis\n\nProcedure to\
    \ provision storage space to Windows host is same as Linux.\n\nIn storage system:\n\
    \n* Step 1: Creation of a host entry.\n* Step 2: Creation and presentation of\
    \ virtual volume to the host.\n\nIn the host server:\n\n* Step 3: Scan and list\
    \ for new disk.\n* Step 4: Initialize and create volume and file system.\n* Step\
    \ 5: Assigning drive letter or mounting file system.\n\n### Solution\n\nStep 1:\
    \ Creation of a host entry in the storage system. Go to Server Manager | Tools\
    \ | iSCSI Initiator.\n\n`iSCSI` initiator component is needed to be installed,\
    \ if not installed already.\n\nNote: Initiator `IQN` name from Configuration tab.\n\
    \n![Figure 9.3: iSCSI Initiator properties](images/Fig_9.3a.png)\n\nFigure 9.3:\
    \ iSCSI Initiator properties\n\nOn Windows 2012 R2 or later version, PowerShell\
    \ cmdlets `Get-InitiatorPort` can be used to get:\n\n```\nPS C:\\> Get-InitiatorPort\n\
    InstanceName NodeAddress PortAddress ConnectionType\n------------ -----------\
    \ ----------- --------------\nPCI\\VEN_1077&DEV_2031&SUBS... 50014380231c70bd\
    \ 50014380231c70bc FibreChannel\nPCI\\VEN_1077&DEV_2031&SUBS... 50014380231c70bf\
    \ 50014380231c70be FibreChannel\nROOT\\ISCSIPRT\\0000_0 iqn.1991-05.com.microsoft:...\
    \ ISCSI ANY PORT iSCSI\nPS C:\\> Get-InitiatorPort | Select-Object -Property NodeAddress\n\
    ```\n\n```\nNodeAddress\n-----------\n50014380231c70bd\n50014380231c70bf\niqn.1991-05.com.microsoft:win-ib813os7csb\n\
    PS C:\\> Get-InitiatorPort | Select-Object -Property PortAddress\nPortAddress\n\
    -----------\n50014380231c70bc\n50014380231c70be\nISCSI ANY PORT\nPS C:\\>\n```\n\
    \n`WWPN` can also be fetched directly from Windows Management Instrumentation\
    \ (WMI) object:\n"
  trans: "\n# 磁盘存储配置示例\n\n## Linux 主机磁盘配置\n\n### FC HBA 详情\n\n```\n# lspci | grep\
    \ -i fibre\n0b:00.0 Fibre Channel: Emulex Corporation Lancer-X: Light-Pulse Fibre\
    \ Channel Host Adapter\n```\n\n### HBA 的 WWPN\n\n```\n# cat /sys/class/fc_host/host?/port_name\n\
    0x1000a0b3cc1c2863\n```\n\n或者，也可以从 HBA 厂商提供的管理软件或工具，或从 FC 交换机中收集 `FC HBA` 的 `WWPN`。\n\
    \n### 发起端 IQN 名称\n\n```\n# cat /etc/iscsi/initiatorname.iscsi\nInitiatorName=iqn.1994-05.com.redhat:548c8e222b7f\n\
    ```\n\n如果主机中尚未安装 `iSCSI` 发起端组件，则需要安装它。\n\n### 发起端 NQN 名称\n\n```\n# cat /etc/nvme/hostnqn\n\
    nqn.2014-08.org.nvmexpress:uuid:30393137-3436-584d-5137-333730314a51\n```\n\n\
    可以在主机中安装 `NVMe` 发起端组件（`nvme-cli`），如果尚未安装的话。\n\n### 步骤 1：在存储系统中创建主机条目\n\n请参考存储系统产品文档，了解在存储系统中创建主机条目的步骤。\n\
    \n在存储系统中使用 `IQN` 名称和操作系统详细信息为 `iSCSI` 创建一个主机条目。同样，使用 `WWPN` 和操作系统详细信息创建另一个主机条目。\n\
    \n### 步骤 2：创建虚拟卷并呈现给主机\n\n请参考存储系统产品文档，了解创建存储卷并将其呈现给主机条目的步骤。\n\n主机服务器将根据用于呈现虚拟卷的主机类型，使用相应协议访问存储设备上的数据。虽然主机同时支持这两种协议，但通常只配置和使用其中一种协议。\n\
    \n### 步骤 3：扫描新磁盘\n\n对于 `iSCSI`，作为 `iSCSI` 发起端组件一部分的管理工具 `iscsiadm`，可用于发现 `iSCSI`\
    \ 目标：`iscsiadm -m discovery -t send targets –p <IP of iSCSI Target>`\n\n示例命令：\n\
    \n```\n# iscsiadm -m discovery -t sendtargets -p 10.1.1.1\n10.1.1.1:3260,21 iqn.2000-05.com.vendorname:20210002ac008685\n\
    ```\n\n登录与节点的所有会话。\n\n重新扫描会话：`iscsiadm -m node \\-p <IP of iSCSI Target>–rescan`\n\
    \n示例命令：\n\n```\n# iscsiadm -m node -L all\nLogging in to [iface: default, target:\
    \ iqn.2000-05.com.vendorname:20210002ac008685, portal: 10.1.1.1,3260] (multiple)\n\
    Login to [iface: default, target: iqn.2000-05.com.vendorname:20210002ac008685,\
    \ portal: 10.1.1.1,3260] successful.\n```\n\n列出活动的 `iSCSI` 会话：\n\n```\n# iscsiadm\
    \ -m session -o show\ntcp: [1] 15.213.67.33:3260,21 iqn.2000-05.com.vendorname:20210002ac008685\n\
    ```\n\n扫描磁盘：\n\n```\n# find /sys/class/scsi_host/host*/scan | while read line;\
    \ do echo - - - > $line; done\n```\n\n```\n# iscsiadm -m node -p 10.1.1.1 –rescan\n\
    ```\n\n### 步骤 4：列出设备\n\n可以使用 Linux 原生命令 `disk` 列出所有发现的磁盘。\n\n```\n# fdisk -l\n\
    Disk /dev/sda: 299.6 GB, 299573968896 bytes\n255 heads, 63 sectors/track, 36421\
    \ cylinders\nUnits = cylinders of 16065 * 512 = 8225280 bytes\nDevice Boot Start\
    \ End Blocks Id System\n/dev/sda1 * 1 182 1461474 83 Linux\n/dev/sda2 183 36421\
    \ 585741086 8e Linux LVM\nDisk /dev/sdb: 299.6 GB, 299573968896 bytes\n255 heads,\
    \ 63 sectors/track, 36421 cylinders\nUnits = cylinders of 16065 * 512 = 8225280\
    \ bytes\nDisk /dev/sdb doesn’t contain a valid partition table\n```\n\n### 步骤\
    \ 5：创建分区\n\n`fdisk` 命令也可用于在磁盘上创建分区。以下是创建分区的示例：\n\n```\n# fdisk /dev/sdb\nDevice\
    \ contains neither a valid DOS partition table, nor Sun, SGI or OSF disklabel\n\
    Building a new DOS disklabel. Changes will remain in memory only,\nuntil you decide\
    \ to write them. After that, of course, the previous content won’t be recoverable.\n\
    Command (m for help): n\nCommand action\n  e extended\n  p primary partition (1-4)\n\
    p\nPartition number (1-4): 1\nFirst cylinder (1-36421, default 3): Using default\
    \ value 3\n```\n\n```\nLast cylinder, +cylinders or +size{K,M,G} (3-36421, default\
    \ 36421): Using default value 36421\nCommand (m for help): w\nThe partition table\
    \ has been altered!\nCalling ioctl() to re-read partition table.\nSyncing disks.\n\
    ```\n\n### 步骤 6：创建文件系统\n\n```\n# mkfs /dev/sdb1\nmke2fs 1.41.12 (17-May-2010)\n\
    Filesystem label=\nOS type: Linux\nBlock size=4096 (log=2)\nFragment size=4096\
    \ (log=2)\nStride=4 blocks, Stripe width=4096 blocks\n18284544 inodes, 73133904\
    \ blocks\n3656695 blocks (5.00%) reserved for the super user\nFirst data block=0\n\
    Maximum filesystem blocks=4294967296\n2232 block groups\n32768 blocks per group,\
    \ 32768 fragments per group\n8192 inodes per group\nSuperblock backups stored\
    \ on blocks:\n32768, 98304, 163840, 229376, 294912, 819200, 884736,\n1605632,\
    \ 2654208, 4096000, 7962624, 11239424, 20480000, 23887872, 71663616\n```\n\n```\n\
    Writing inode tables: done\nWriting superblocks and filesystem accounting information:\
    \ done\nThis filesystem will be automatically checked every 39 mounts or 180 days,\
    \ whichever comes first. Use tune2fs -c or -i to override.\n```\n\n### 步骤 7：挂载文件系统\n\
    \n```\n# mkdir /data1\n# mount /dev/sdb1 /data1\n# df -h\nFilesystem Size Used\
    \ Avail Use% Mounted on\n/dev/mapper/VolGroup00-LogVol00 15G 2.4G 12G 18% /\n\
    /dev/sda1 99M 13M 82M 14% /boot\n/dev/sdb1 275G 63M 261G 1% /data1\n```\n\n如果所有定义的磁盘分区和文件系统都要在系统启动时自动挂载，则需要将这些条目包含在\
    \ `/etc/fstab` 文件中。\n\n```\n# cat /etc/fstab\n/dev/VolGroup00/LogVol00 / ext3\
    \ defaults 1 1\nLABEL=/boot /boot ext3 defaults 1 2\ntmpfs /dev/shm tmpfs defaults\
    \ 0 0\ndevpts /dev/pts devpts gid=5,mode=620 0 0\nsysfs /sys sysfs defaults 0\
    \ 0\nproc /proc proc defaults 0 0\n/dev/VolGroup00/LogVol01 swap swap defaults\
    \ 0 0\n```\n\n```\n/dev/sdb1 /data1 ext3\n```\n\n现在，数据可以存储在文件夹 `/data1` 中。\n\n\
    ## 案例研究 2：为 Windows 主机服务器配置存储空间\n\n让我们为 Windows 主机服务器配置存储空间：\n\n### 需求\n\n一台 Windows\
    \ 主机连接到块存储。网络和 SAN 分区已配置完成。提供通过 `FC` 和 `iSCSI` 在主机服务器中创建和配置存储卷的步骤。\n\n### 分析\n\
    \n为 Windows 主机配置存储空间的过程与 Linux 相同。\n\n在存储系统中：\n\n* 步骤 1：创建主机条目。\n* 步骤 2：创建虚拟卷并呈现给主机。\n\
    \n在主机服务器中：\n\n* 步骤 3：扫描并列出新磁盘。\n* 步骤 4：初始化并创建卷和文件系统。\n* 步骤 5：分配驱动器号或挂载文件系统。\n\n\
    ### 解决方案\n\n步骤 1：在存储系统中创建主机条目。转到“服务器管理器”|“工具”|“iSCSI 发起端”。\n\n如果尚未安装 `iSCSI` 发起端组件，则需要安装它。\n\
    \n注意：从“配置”选项卡获取发起端 `IQN` 名称。\n\n![图 9.3：iSCSI 发起端属性](img/Fig_9.3a.png)\n\n图 9.3：iSCSI\
    \ 发起端属性\n\n在 Windows 2012 R2 或更高版本上，可以使用 PowerShell cmdlet `Get-InitiatorPort`\
    \ 来获取：\n\n```\nPS C:\\> Get-InitiatorPort\nInstanceName NodeAddress PortAddress\
    \ ConnectionType\n------------ ----------- ----------- --------------\nPCI\\VEN_1077&DEV_2031&SUBS...\
    \ 50014380231c70bd 50014380231c70bc FibreChannel\nPCI\\VEN_1077&DEV_2031&SUBS...\
    \ 50014380231c70bf 50014380231c70be FibreChannel\nROOT\\ISCSIPRT\\0000_0 iqn.1991-05.com.microsoft:...\
    \ ISCSI ANY PORT iSCSI\nPS C:\\> Get-InitiatorPort | Select-Object -Property NodeAddress\n\
    ```\n\n```\nNodeAddress\n-----------\n50014380231c70bd\n50014380231c70bf\niqn.1991-05.com.microsoft:win-ib813os7csb\n\
    PS C:\\> Get-InitiatorPort | Select-Object -Property PortAddress\nPortAddress\n\
    -----------\n50014380231c70bc\n50014380231c70be\nISCSI ANY PORT\nPS C:\\>\n```\n\
    \n`WWPN` 也可以直接从 Windows Management Instrumentation (WMI) 对象获取：\n"
