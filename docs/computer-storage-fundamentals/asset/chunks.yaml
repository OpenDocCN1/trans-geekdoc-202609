    ```\nmkfs <device file>\n```\n\nStep 7: Mounting file system:\n\n```\nmount <device\
    \ file> /<mount point>\n```\n\n### Solution\n\nStep 1: Creation of a host entry:\n\
    \nA host entry must be created in storage for the first time configuration for\
