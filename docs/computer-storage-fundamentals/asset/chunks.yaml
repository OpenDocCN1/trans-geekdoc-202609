    \ zoning best practices as per the product documents to provide desired access\n\
    - Create configuration or zone set and enable it\n\n### Configuring storage\n\n\
    - Creation of host\n  - Host is a logical entity in storage that represents the\
    \ host server, which is going to access the virtual volume. Typically host requires\
    \ `WWPN` of `FC` `HBA`s or `IQN` number of `iSCSI` initiator adapters and operating\
