    - b. 从发起者到目标门户无 `IP` 路由

    - c. 从目标门户返回发起者无 `IP` 路由

    - d. 发起者不在目标的访问控制列表中


    ## 60. `iSCSI` 发起者连接到 `iSCSI` 目标网络门户，但未发现任何目标。可能是什么问题？选择所有适用的选项。


    - a. 存储阵列上未配置目标

    - b. 发起者不在阵列中任何目标的访问控制列表上

    - c. 以上都不是


    ## 61. 一个主动-主动存储阵列有两个存储控制器。每个存储控制器有 2 个 `iSCSI` 端口。控制器 A 的端口是 `SA0` 和 `SA1`。同样，控制器
    B 的端口是 `SB0` 和 `SB1`。在此系统上定义了一个 `iSCSI` 目标节点，仅有一个门户组。


    为了确保需要访问此目标的主机具有冗余多路径，该门户组中可以定义哪些门户？选择所有适用的选项。


    - a. `SA0`, `SB0`

    - b. `SA0`, `SB1`

    - c. `SA0`, `SA1`

    - d. `SB0`, `SA1`


    ## 62. 目前 `FC` 结构中最常实现的 `CoS` 是哪一类？


    - a. `Class 1`（1 类）

    - b. `Class 2`（2 类）

    - c. `Class 3`（3 类）

    - d. `Class 4`（4 类）


    ## 63. `FC` 中 `Class 2` 和 `Class 3` 服务类别都提供什么功能？选择所有适用的选项。


    - a. 无连接

    - b. 有确认

    - c. 保证帧按序传递

    - d. 保证带宽


    ## 64. `FC` 中 `Class 1` 和 `Class 4` 服务的区别是什么？选择所有适用的选项。


    - a. `Class 1` 使用专用电路，`Class 4` 使用虚拟电路

    - b. `Class 1` 占用 `N_Port` 100% 带宽，`Class 4` 允许多个连接共享 `N_Port` 的带宽

    - c. `Class 4` 不支持帧的按序传递

    - d. 以上都不是


    ## 65. 如果 `FC` 厂商在其交换机中实现了所有服务类别，对于多媒体（视频/音频）应用程序，同时又不浪费带宽，以下哪项推荐最佳？


    - a. `Class 1`

    - b. `Class 2`

    - c. `Class 3`

    - d. `Class 4`


    ## 66. `FC` 中哪一类服务最适合需要多播功能的应用程序？


    - a. `Class 2`

    - b. `Class 3`

    - c. `Class 4`

    - d. `Class 6`


    ## 67. 使用 `FC-AL Hub` 时，如果环路上的某个节点端口发生故障或关闭，仲裁环会中断吗？


    - a. 是

    - b. 否


    ## 68. 当向环路添加新设备并需要为其分配 `AL_PA` 时，必须执行什么过程？


    - a. 环路主节点选择

    - b. `AL_PA` 分配

    - c. 位置映射

    - d. 环路初始化


    ## 69. `FC` 中的 `BB flow control`（缓冲区到缓冲区流控）用于：


    - a. `N_Ports` 之间

    - b. `E_ports` 之间

    - c. `N_Port` 和 `F_port` 之间

    - d. 以上皆是


    ## 70. `FC` 中的 `End-to-end flow control`（端到端流控）用于：


    - a. `N_Ports` 之间

    - b. `E_ports` 之间

    - c. `N_Port` 和 `F_port` 之间

    - d. 以上皆是


    ## 71. 操作系统中存储 `LUN` 的属性显示 `B.T.L` 为 `3-2-1`。由于某些原因，安装 `HBA` 的服务器 `PCI` 插槽故障，你不得不将其移至另一个
    `PCI` 插槽。现在系统启动时，由于更换 `HBA` 插槽，你预期 `B.T.L` 的哪个值会发生变化？


    - a. Bus（总线）

    - b. Target（目标）

    - c. `LUN`

    - d. 以上都不是


    ## 72. `FC-iSCSI Router` 或 `iFCP router`：


    - a. 将整个 `FC` 帧封装进 `TCP/IP` 数据包

    - b. 从 `FC` 帧中取出载荷并封装进 `TCP/IP` 数据包

    - c. 原样发送 `FC` 帧


    ## 73. `FC` 仲裁环拓扑中的最大设备数量是：


    - a. 64

    - b. 127

    - c. 256

    - d. 512


    ## 74. `FC` 点对点拓扑中的最大设备数量是：


    - a. 16

    - b. 8

    - c. 4

    - d. 2


    ## 75. `FC` 交换结构拓扑的理论最大设备数量是：


    - a. 28

    - b. 216

    - c. 224

    - d. 248


    ## 76. 对于以下哪两项需求，可以推荐使用 `iSCSI`？


    - a. 企业数据中心中业务关键型应用的高性能和高可用性

    - b. 由中低端服务器组成的环境，提供最合适的价格/性能比的解决方案

    - c. 由高端服务器组成、需要高带宽的环境，或包含业务关键数据的数据中心环境

    - d. 较小型区域或部门级数据中心中的业务应用


    ## 77. `iSCSI` 发起者发现了 `iSCSI` 目标，但无法登录到该目标。可能是什么问题？选择所有适用的选项。


    - a. 未为 `iSCSI` 目标配置 `LUN`

    - b. 目标的最大会话数可能已超限

    - c. `iSCSI` 发起者中的 `CHAP` 登录信息配置不当

    - d. 目标门户可能配置在不同的 `IP` 网络上，发起者无网络访问权限


    ## 78. 由 `SCSI` 协议处理的 `SCSI` 寻址组件是什么？


    - a. `SCSI` 总线，逻辑单元

    - b. `SCSI` 总线，目标 ID，逻辑单元

    - c. `SCSI` 总线，目标 ID，适配器编号

    - d. `SCSI` 总线，适配器编号，逻辑单元


    ## 79. `N_Port` A 连接到结构中，在结构登录过程中，它查询交换机目录服务提供的名称服务器。


    如果 `N_Port` 向名称服务器发送请求以获取结构中的端口地址或端口名称列表，则该请求的响应取决于与此 `N_Port` A 进行软分区的 `N_Ports`。


    前面的陈述是否正确？


    - a. 是

    - b. 否


    ## 80. `FC` 技术中的旁路电路是什么？


    - a. 当信号丢失时，自动将 `FC` 设备从交换结构拓扑中移除的电路

    - b. 一种结构管理服务，用于将设备从现有区域中分区出去

    - c. 当信号丢失时，自动将 `FC` 设备从 `FC AL` 环路拓扑中移除的电路


    ## 81. 与使用 `DAS` 相比，使用 `iSCSI SAN` 会给您的组织带来什么优势？


    - a. 传统上昂贵的 `SCSI` 控制器和 `SCSI` 磁盘不再需要在每台服务器中使用，从而降低了总体成本


