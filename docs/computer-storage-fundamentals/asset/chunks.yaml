- raw: "Generally storage systems are designed to have more number of controllers,\
    \ so that it can perform host server’s read/write request quite fast. Data caching\
    \ is another technique that temporary keeps data in faster accessible DIMM to\
    \ add value to the performance. RAIDs are also configured to perform parallel\
    \ read/write on to multiple disks together.\n\nApart from this, clone file blocks\
    \ XCOPY and zero file blocks WRITE SAME are also implemented in a storage system\
    \ to improve data copy performance within the system itself.\n\n## Case studies\n\
    \n#### Case study 1: Throughput, data transfer rate and latency of a storage volume\
    \ for a given workload\n\nLet us look at throughput, data transfer rate and latency\
    \ of a storage volume for a given workload:\n\n#### Requirement\n\nGenerate workload\
    \ of the following characteristics on a storage volume: \n\nBlock size: 8KB\n\n\
    Read/write %: 70% read, 30% write\n\nAccess: Random\n\nDetermine throughput, data\
    \ transfer rate and latency.\n\n#### Analysis\n\nAlthough, performance result\
    \ depends to many other factors such as host configuration, network bandwidth\
    \ and other workload parameters, this test can be performed only on available\
    \ environment with given workload parameters.\n\nThere are several tools available\
    \ to generate workload and measure performance of storage devices. I/OMeter is\
    \ widely accepted free tool for workload measurement and characterization, available\
    \ to download from [www.iometer.org](http://www.iometer.org/) web site.\n\nI/OMeter\
    \ can be used to generate the specified workload and measure throughput, data\
    \ transfer rate, and latency.\n\n#### Solution\n\nFollowing steps can be performed\
    \ to determine throughput, data transfer rate and latency of a storage volume:\n\
    \n1\\. Download the Iometer tool from [http://www.iometer.org](http://www.iometer.org/)\
    \ website and install it on a Windows host.\n\n2\\. Create a virtual volume in\
    \ storage system, present to the host and scan for the new device in the operating\
    \ system.\n\n3\\. Open the tool and go to Access Specifications tab. Click on\
    \ New button.\n\n4\\. Specify a name and the parameters, that is, 8 KB block size,\
    \ 70% read and 30% write and 100% Random.\n\n![Figure 6.11: Diameter Access configuration](images/Fig_6.10a.jpg)\n\
    \nFigure 6.11: Diameter Access configuration\n\n5\\. Assign this access specification.\n\
    \n6\\. Go to Disk Targets tab, select the disk and then click on green flag from\
    \ toolbar to initiate the workload.\n\n7\\. Now, go to Test results tab, move\
    \ update frequency to 1 or 2 seconds to view current workload status.\n\n8\\.\
    \ Note throughput (I/Os per second), data transfer rate (MBps) and Latency (Average\
    \ I/Os response time) (ms).\n\n![Figure 6.12: Throughput and data transfer rate\
    \ in diameter](images/Fig_6.10b.jpg)\n\nFigure 6.12: Throughput and data transfer\
    \ rate in diameter\n\n#### Case study 2: Identifying possible bottleneck for the\
    \ given configuration\n\nLet us identify possible bottleneck for the given configuration:\n\
    \n#### Requirement\n\nYour company has purchased a high-end file storage system\
    \ with SSD drives in it. VMware ESXi server access the storage via NFS protocol.\
    \ ESXi host is also a higher model server. But to migrate a virtual machine of\
    \ size 200 GB to this storage takes about half an hour.\n\n#### Analysis\n\n200\
    \ GB VM takes approximately 30 minutes to migrate, therefore data transfer rate\
    \ is approximately = (200 X 1024) / (30 x 60) = 113 MBps\n\n113 MBps = 113 x 8\
    \ Mbps = 904 Mbps\n\n904 Mbps is very close to 1 Gbps bandwidth speed.\n\nMost\
    \ likely something in the network is causing bottleneck and dropping the data\
    \ transfer rate to 1 Gbps.\n\nTo investigate any performance issue, it is important\
    \ to understand the environment in detail. When information is collected, it is\
    \ understood that the company is using existing LAN for connecting ESXi host to\
    \ file storage. Though, both systems are connected to two different 10 Gb Ethernet\
    \ switches, but both switches are connected via a 1 Gb switch. Hence this component\
    \ is the bottleneck in data transfer. Host server and storage both high-end with\
    \ SSD drives, therefore processing is faster than transport and load touching\
    \ its maximum in the network.\n\n![Figure 6.13: Multi-switch SAN solution](images/Fig_6.11.png)\n\
    \nFigure 6.13: Multi-switch SAN solution\n\n#### Solution\n\n1 Gb switch in between\
    \ host and storage communication can be avoided to eliminate the bottleneck. Storage\
    \ system and host server can be connected to same 10 Gb switch.\n\n#### Case study\
    \ 3: Speeding up month-end closure activities\n\nLet us look at speeding up month-end\
    \ closure activities:\n\n#### Requirement\n\nAn organization recently purchased\
    \ a hybrid storage system which has SSD and SAS both type drives. They have configured\
    \ two set of virtual volumes–one set on SSD for hosting application that their\
    \ customers access and another set on SAS for their internal reporting and analysis.\
    \ During end of every month, they generate huge number of report from second application.\n\
    \n#### Analysis\n\nDemand for accessing data on second set of volumes is high\
    \ during the end of month. Data tiering feature can be used to move second set\
    \ of volumes on to SSD drives during month. Once the activities are completed,\
    \ they can be moved back to home drives.\n\nIf sufficient space on SSD drive is\
    \ not available, first set of volumes can be moved to SAS before moving second\
    \ set of volumes to SSD.\n\n#### Solution\n\nCreate schedule to move first set\
    \ of volumes to SAS disk just before month-end activities. Also create another\
    \ schedule to move second set of volumes to SSD.\n\nAfter completion of the activities\
    \ the volumes can be reverted as per their original disk location.\n\n## Learning\
    \ check\n\n### Objective questions\n\n 1. Your application demands more storage\
    \ performance, basically means the requirement is:\n\n a. More response time\n\
    \n b. More number of I/O requests\n\n c. More number of I/O requests at less response\
    \ time\n\n d. Any of the above\n\n 2. What is the measuring unit of data transfer\
    \ rate?\n\n a. Megabytes (MBs)\n\n b. Gigabits per second (Gbps)\n\n c. I/O per\
    \ second (IOPS)\n\n d. Millisecond (ms)\n\n 3. What is the measuring unit of throughput?\n\
    \n a. Megabytes (MBs)\n\n b. Gigabits per second (Gbps)\n\n c. I/O per second\
    \ (IOPS)\n\n d. Millisecond (ms)\n\n 4. What is the measuring unit of latency?\n\
    \n a. Megabytes (MBs)\n\n b. Gigabits per second (Gbps)\n\n c. I/O per second\
    \ (IOPS)\n\n d. Millisecond (ms)\n\n 5. Which statement related to storage performance\
    \ terminology is true:\n\n a. Throughput is number of jobs (usually I/O requests)\
    \ completed per unit time (IOPS)\n\n b. Data transfer rate is amount of data being\
    \ transferred between two systems per unit time (e.g., KBps, MBps, GB per hour,\
    \ etc.)\n\n c. Latency is time required to complete a job (I/O request)\n\n d.\
    \ All of the above\n\n 6. Which storage would you buy, if cost and capacity is\
    \ same?\n\n a. The one provides 10000 IOPS at 10ms latency\n\n b. The one provides\
    \ 10000 IOPS at 15ms latency\n\n c. Both are same\n\n d. Any of them\n\n 7. Cache\
    \ memory is used in a storage system mainly to improve:\n\n a. Fault tolerant\n\
    \n b. Performance\n\n c. Space efficiency\n\n d. All of the above\n\n 8. Which\
    \ of the following terminology is not used in the context of storage performance?\n\
    \n a. Throughput\n\n b. Space per unit price\n\n c. Data transfer rate\n\n d.\
    \ Response time\n\n 9. Which of the following terminology is used in the context\
    \ of smart data categorization or tiered storage?\n\n a. Performance (IOPS) per\
    \ unit price\n\n b. Space (GB) per unit price\n\n c. Solid state drive (SSD) type\n\
    \n d. All of the above\n\n 10. A customer observes few IOPS, in the range of 100-200,\
    \ on an high-end enterprise storage; he wants to know the possible reasons:\n\n\
    \ a. His host is not demanding enough I/Os from storage\n\n b. Frontend of his\
    \ storage is not capable of processing 100-200 IOPS\n\n c. Backend of his storage\
    \ is not capable of processing 100-200 IOPS\n\n 11. Which of the two among the\
    \ following impact the performance of storage:\n\n a. Dynamic capacity management\
    \ (LUN shrink/expansion) feature\n\n b. Thin provisioning feature\n\n c. Disk\
    \ type\n\n d. RAID implementation"
