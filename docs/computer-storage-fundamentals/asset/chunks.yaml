    \ in a `TCP` frame, whereas `iSCSI` encapsulates `SCSI` commands and data in a\
    \ `TCP` frame. It does not use `FC`.\n\n![Figure 4.13: IP storage](images/Fig_4.13.jpg)\n\
    \nFigure 4.13: IP storage\n\n`iSCSI` enables server host applications to perform\
    \ traditional block-level transactions over a common `IP` network. It is built\
    \ on two of the most commonly understood protocols: `SCSI` and Ethernet, the dominant\
    \ standards for storage and networking. Using an ordinary `IP` network, `iSCSI`\
    \ transports block-level data between an `iSCSI` initiator on a server and an\
    \ `iSCSI` target on a storage device. `iSCSI` protocol encapsulates `SCSI` commands\
    \ and assembles the data in packets for the `TCP/IP` layer. Packets are sent over\
    \ the network using a point-to-point connection.\n\nUpon arrival, the protocol\
    \ translates data back to `SCSI`:\n\n![Figure 4.14: iSCSI target and initiator](images/Fig_4.14.png)\n\
    \nFigure 4.14: iSCSI target and initiator\n\n### iSCSI Naming\n\nInitiator and\
    \ target require `iSCSI` names. This is also referred as `iSCSI` node name and\
    \ `SCSI` device name of `iSCSI` device, and uses up to 255 bytes displayable strings.\n\
    \nThere are two `iSCSI` name types:\n\n- `iSCSI` qualified name (`IQN`)\n- Extended\
    \ Unique Identifier (`EUI`) IEEE EUI-64—also used for `FC` worldwide name (`WWNs`)\n\
    \n![](images/Fig_4.15.png)![](images/Fig_4.15a.jpg)![Figure 4.15: iSCSI names](images/Fig_4.15b.jpg)\n\
    \nFigure 4.15: iSCSI names\n\nExample:\n\n- `iqn.1987-05.com.domain.1234abcdef987601267da232.bet`\n\
    - `iqn.2001-04.com.domain.storage.tape.sys1.xyz`\n- `eui-02004567a425678d`\n\n\
    ### iSCSI Initiator\n\nThere are primarily two types of `iSCSI` initiator:\n\n\
    - **Software `iSCSI` initiator with regular `NIC`**: `iSCSI` stack is implemented\
    \ within software and runs on host server. This is an effective solution but requires\
    \ more `CPU` and memory resources of the host. `iSCSI` traffic consumes `CPU`\
    \ resources that can be utilized by the application. Most modern operating systems\
    \ have in-built software `iSCSI` initiator built.\n- **Hardware `iSCSI` initiator\
    \ with `iSCSI` `HBA`**: `iSCSI` stack is implemented within adapter hardware.\
    \ The adapter is called `iSCSI` `HBA`. All of the work associated with `iSCSI`\
    \ is performed by the `iSCSI` `HBA`, instead of host server resources. `iSCSI`\
    \ `HBAs` are more expensive than regular `NIC`.\n\n![Figure 4.16: Hardware and\
    \ software iSCSI](images/Fig_4.16.jpg)\n\nFigure 4.16: Hardware and software iSCSI\n\
    \nSome vendors make `NIC` card that is `TCP/IP` Offload Engine (`TOE`) capable,\
    \ in which part of the `iSCSI` stack (layer 2) is implemented within the hardware.\n\
    \n### iSNS\n\nInternet Storage Name Service (`iSNS`) is a name registration service\
    \ for `IP` storage devices. This is like `DNS` for `iSCSI` devices. It has the\
    \ following features:\n\n- Provides centralized management capabilities.\n- `iSNS`\
    \ server is a repository of currently active `iSCSI` nodes, as well as their associated\
    \ portals, entities, and so on.\n- Nodes can be initiators, targets, or management\
    \ nodes.\n- Typically, initiators and targets register with the `iSNS` server,\
    \ and the initiators query the `iSNS` server for the list of available targets.\n\
    \n### iSCSI Security\n\nThere are several levels of `iSCSI` security available.\
    \ The basic level is based on the Challenge-Handshake Authentication Protocol\
    \ (`CHAP`). `CHAP` is a protocol that is used to authenticate the peer of a connection\
    \ and is based upon the peers sharing a secret (a security key that is similar\
    \ to a password). `IPsec` is a protocol that enforces authentication and data\
    \ encryption at the `IP` packet layer, which provides an added level of security.\n\
    \n- **One-way `CHAP` authentication**: With this level of security, only the target\
    \ authenticates the initiator. The secret is set just for the target and all initiators\
    \ that want to access that target need to use the same secret to start a logon\
    \ session with the target.\n- **Mutual `CHAP` authentication**: With this level\
    \ of security, the target and the initiator authenticate each other. A separate\
    \ secret is set for each target and for each initiator in `SAN`.\n- **`IPsec`**:\
    \ With this level of security, all `IP` packets sent during data transfers are\
    \ encrypted and authenticated. A common key is set on all `IP` portals, allowing\
    \ all peers to authenticate each other and negotiate packet encryption.\n\n###\
    \ Non-Volatile Memory Express\n"
  trans: "\n\n## 特性与用途\n\n**特性**：组播，即从单个源设备将同一传输的副本发送到结构中的多个目标设备，面向连接、按序交付帧、确认交付。\n\
    \n**用途**：专用应用；支持不广泛。多个 `CoS` 可在结构中共存。\n\n### 流量控制\n\n流量控制的概念旨在解决设备接收帧的速度快于其处理速度的问题。结果，设备被迫丢弃部分帧。换句话说，流量控制是一种机制，用于确保流量（帧）仅在有去处时才移动。\n\
    \n使用流量控制时，接收端口会向发送端口指示其可以接收下一帧。发送端口在知道接收端口有可用缓冲区接受该帧之前，不会发送下一帧。接收端口始终处于控制地位。\n\
    \n`FC` 使用两种内置的流量控制机制：缓冲区到缓冲区（`BB`）和端到端（`EE`）流量控制。\n\n#### 缓冲区到缓冲区（BB）流量控制\n\n\
    - 仅处理 `N_Port` 到 `F_Port` 或点对点模式下的 `N_Port` 到 `N_Port`。\n- `BB_Credit` 在登录期间建立。\n\
    - 每个端口还会跟踪 `BB_Credit_CNT`，其初始值为 `0`。每发送一帧，`BB_Credit_CNT` 就加 `1`。\n- 每从另一端口收到一个接收就绪（`R_RDY`）原语信号，该值就减\
    \ `1`。\n- 发送 `R_RDY` 表示该端口已处理一帧、释放了一个接收缓冲区，并准备好接收下一帧。\n- 如果 `BB_Credit_CNT` 达到\
    \ `BB_Credit`，则该端口在收到 `R_RDY` 之前无法发送另一帧。\n\n#### 端到端（EE）流量控制\n\n- `EE` 流量控制不关心单个链路，而是关心源和目标\
    \ `N_Port`。\n- 适用于除 `Class 3` 之外的所有服务等级。\n- 当两个 `N_Port` 相互登录时，它们交换 `EE_Credit`。\n\
    - `EE_Credit_CNT` 登录后设为 `0`，每发送一帧给另一端口就加 `1`。收到该端口的确认（`ACK`）链路控制帧时递减。\n- `ACK`\
    \ 帧可指示端口已接收并处理 `1` 帧、`N` 帧或整个帧序列。\n\n![Figure 4.11: BB and EE flow control](img/Fig_4.11.png)\n\
    \nFigure 4.11: BB and EE flow control\n\n### iSCSI 概述\n\n`iSCSI` 是一项新兴的行业标准，允许使用\
    \ `TCP/IP` 协议通过网络传输 `SCSI` 块 I/O 协议。由于以太网的最新进展和运行速度的显著提高，`iSCSI` 正成为一种非常流行且常用的存储通信协议。\n\
    \n- `IP` 存储网络提供在 `IP` 内承载存储流量的解决方案\n- 使用 `TCP`，它是一种可靠的传输交付机制\n- 适用于本地数据中心和长距离应用\n\
    - `IP` 内的三种主要协议：\n  - 互联网 SCSI（`iSCSI`）：用于在 `TCP/IP` 连接内传输 `SCSI` `CDB` 和数据。\n\
    \  - 光纤通道过 IP（`FCIP`）：用于在 `TCP/IP` 连接内传输 `FC` 帧——任意 `FC` 帧，不仅仅是 `SCSI`。\n  - 互联网\
    \ FC 协议（`iFCP`）：用于在 `TCP/IP` 连接内传输 `SCSI` `CDB` 和数据。\n\n![Figure 4.12: iSCSI,\
    \ FCIP and iFCP packets](img/Fig_4.12.png)\n\nFigure 4.12: iSCSI, FCIP and iFCP\
    \ packets\n\n`iSCSI`、`FCIP` 和 `iFCP` 这三种协议都使用通用的 `IP` 作为网络传输协议，用于在基于 `IP` 的网络上移动块数据。然而，`iSCSI`\
    \ 从根本上不同于 `FCIP` 和 `iFCP`。`iFCP` 和 `FCIP` 主要用于互连存储区域网络（`SAN`）设备以支持数据移动。`FCIP`\
    \ 将整个 `FC` 帧封装在 `TCP` 帧中，`iFCP` 则提取 `FC` 帧的有效载荷并将其封装在 `TCP` 帧中，而 `iSCSI` 则将 `SCSI`\
    \ 命令和数据封装在 `TCP` 帧中。它不使用 `FC`。\n\n![Figure 4.13: IP storage](img/Fig_4.13.jpg)\n\
    \nFigure 4.13: IP storage\n\n`iSCSI` 使服务器主机应用程序能够通过通用的 `IP` 网络执行传统的块级事务。它建立在两种最常被理解的协议之上：`SCSI`\
    \ 和以太网，这是存储和网络领域的主导标准。使用普通的 `IP` 网络，`iSCSI` 在服务器上的 `iSCSI` 发起端和存储设备上的 `iSCSI`\
    \ 目标之间传输块级数据。`iSCSI` 协议封装 `SCSI` 命令，并将数据组装成数据包供 `TCP/IP` 层使用。数据包通过点对点连接使用网络发送。\n\
    \n到达后，协议将数据转换回 `SCSI`：\n\n![Figure 4.14: iSCSI target and initiator](img/Fig_4.14.png)\n\
    \nFigure 4.14: iSCSI target and initiator\n\n### iSCSI 命名\n\n发起端和目标需要 `iSCSI`\
    \ 名称。这也称为 `iSCSI` 节点名称和 `iSCSI` 设备的 `SCSI` 设备名称，使用最多 255 字节的可显示字符串。\n\n有两种 `iSCSI`\
    \ 名称类型：\n\n- `iSCSI` 限定名（`IQN`）\n- 扩展唯一标识符（`EUI`）IEEE EUI-64——也用于 `FC` 全球名称（`WWN`）\n\
    \n![](img/Fig_4.15.png)![](img/Fig_4.15a.jpg)![Figure 4.15: iSCSI names](img/Fig_4.15b.jpg)\n\
    \nFigure 4.15: iSCSI names\n\n示例：\n\n- `iqn.1987-05.com.domain.1234abcdef987601267da232.bet`\n\
    - `iqn.2001-04.com.domain.storage.tape.sys1.xyz`\n- `eui-02004567a425678d`\n\n\
    ### iSCSI 发起端\n\n主要有两类 `iSCSI` 发起端：\n\n- **带常规 `NIC` 的软件 `iSCSI` 发起端**：`iSCSI`\
    \ 协议栈在软件中实现，并在主机服务器上运行。这是一种有效的解决方案，但需要更多主机的 `CPU` 和内存资源。`iSCSI` 流量消耗本可供应用程序使用的\
    \ `CPU` 资源。大多数现代操作系统都内置了软件 `iSCSI` 发起端。\n- **带 `iSCSI` `HBA` 的硬件 `iSCSI` 发起端**：`iSCSI`\
    \ 协议栈在适配器硬件中实现。该适配器称为 `iSCSI` `HBA`。所有与 `iSCSI` 相关的工作均由 `iSCSI` `HBA` 执行，而非主机服务器资源。`iSCSI`\
    \ `HBA` 比常规 `NIC` 昂贵。\n\n![Figure 4.16: Hardware and software iSCSI](img/Fig_4.16.jpg)\n\
    \nFigure 4.16: Hardware and software iSCSI\n\n一些供应商制造支持 `TCP/IP` 卸载引擎（`TOE`）的\
    \ `NIC` 卡，其中部分 `iSCSI` 协议栈（第 2 层）在硬件中实现。\n\n### iSNS\n\n互联网存储名称服务（`iSNS`）是 `IP`\
    \ 存储设备的名称注册服务。这类似于 `iSCSI` 设备的 `DNS`。它具有以下功能：\n\n- 提供集中管理能力。\n- `iSNS` 服务器是当前活动\
    \ `iSCSI` 节点及其关联的门户、实体等的存储库。\n- 节点可以是发起端、目标或管理节点。\n- 通常，发起端和目标向 `iSNS` 服务器注册，发起端查询\
    \ `iSNS` 服务器以获取可用目标的列表。\n\n### iSCSI 安全\n\n有多个级别的 `iSCSI` 安全可用。基本级别基于质询握手认证协议（`CHAP`）。`CHAP`\
    \ 是一种用于认证连接对等体的协议，基于对等体共享一个秘密（类似于密码的安全密钥）。`IPsec` 是一种在 `IP` 数据包层强制执行认证和数据加密的协议，提供额外的安全级别。\n\
    \n- **单向 `CHAP` 认证**：在此安全级别下，仅目标认证发起端。秘密仅为目标设置，所有想要访问该目标的发起端都需要使用相同的秘密来与目标启动登录会话。\n\
    - **双向 `CHAP` 认证**：在此安全级别下，目标和发起端相互认证。在 `SAN` 中，为每个目标和每个发起端设置单独的秘密。\n- **`IPsec`**：在此安全级别下，数据传输期间发送的所有\
    \ `IP` 数据包均被加密和认证。在所有 `IP` 门户上设置通用密钥，允许所有对等体相互认证并协商数据包加密。\n\n### 非易失性内存表达\n\n"
