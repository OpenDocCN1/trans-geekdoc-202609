- raw: "Generally, more than one storage volumes are configured for an application.\
    \ For ease of management some storage vendors allow to create an additional storage\
    \ object called volume collection, volume set or volume group, which comprises\
    \ set of virtual volumes in it. A volume set relates to an application.\n\nSimilarly,\
    \ another object called host collection, host set or host group for set of hosts\
    \ in it. A host set maps to host’s cluster.\n\nIf a volume set is assigned to\
    \ a host, all the volumes in it gets assigned to the host with a unique LUN ID.\
    \ Again, when a volume set is assigned to a host set, all the volumes in it get\
    \ assigned to all the hosts.\n\nTypically each management software can be accessed\
    \ through multiple interfaces, such as GUI, CLI for performing operations in batch\
    \ through script and Representational State Transfer (REST) API, which is platform\
    \ independent can initiate create, read, update, and delete (CRUD) operations.\n\
    \nStorage management software have several other features such as reporting and\
    \ alerting capabilities, unified management console that allows the administrator\
    \ to manage multiple storage systems through a single pane of glass (SPoG), integration\
    \ with other software solutions, and so on.\n\n## Steps to implement storage solution\n\
    \nTypically four are to be followed to implement a storage solution:\n\n![](images/Fig_9.2.jpg)![Figure\
    \ 9.2: Steps to implement a storage solution and storage solution architecture](images/Fig_9.3.jpg)\n\
    \nFigure 9.2: Steps to implement a storage solution and storage solution architecture\n\
    \nThere are various storage solutions available to meet different purposes. Following\
    \ three are commonly seen configurations:\n\n•  SAN storage connected to multiple\
    \ hosts in cluster\n\n•  Storage connected to host server via iSCSI\n\n•  File\
    \ storage connected to SMB and NFS client systems\n\n### SAN storage connected\
    \ to multiple hosts in cluster\n\nIn SAN environment, fabric comprises of one\
    \ or more FC switches. following is brief description of each step to implement\
    \ SAN storage solution.\n\nPhysical cabling:\n\n•  Connect the cable between storage\
    \ and FC switches.\n\n•  Connect cable between host servers and FC switches.\n\
    \n•  Label each cable. This is most important for troubleshooting any issue in\
    \ future.\n\nConfiguring switches:\n\n•  Identify WWPN of FC HBA\n\n Refer product\
    \ document to determine worldwide port number (WWPN) of N\\_Port device connected\
    \ to fabric\n\n•  Create aliases\n\n Assign meaningful name to each WWPN\n\n• \
    \ Create zone\n\n Follow zoning best practices as per the product documents to\
    \ provide desired access\n\n•  Create configuration or zone set and enable it\n\
    \nConfiguring storage:\n\n•  Creation of host\n\n Host is a logical entity in\
    \ storage that represents the host server, which is going to access the virtual\
    \ volume. Typically host requires WWPN of FC HBAs or IQN number of iSCSI initiator\
    \ adapters and operating system name running on it. Some storage vendor may require\
    \ additional information for creation of host.\n\n In case of cluster environment\
    \ multiple hosts may have to be created.\n\n•  Creation of virtual volume\n\n\
    \ Virtual volume is the logical disk that is created on storage system to provide\
    \ access to host for storing data and read/write operations.\n\n•  Export or presentation\
    \ or assign the virtual volume to the host\n\nThe LUN masking provides access\
    \ of the virtual volume to the host. In case, cluster, single virtual volume is\
    \ needed to accessed to multiple hosts in cluster.\n\nGenerally more than one\
    \ storage volumes are configured for an application. For ease of management some\
    \ storage vendors allow to create an additional storage object called volume collection,\
    \ volume set or volume group, which comprises set of virtual volumes in it. A\
    \ volume set relates to an application.\n\nSimilarly another object called host\
    \ collection, host set or host group for set of hosts in it. A host set maps to\
    \ hosts cluster.\n\nIf a volume set assigned to a host, all the volumes in it\
    \ gets assigned to the host with unique LUN ID. Again when a volume set assigned\
    \ to a host set, all the volumes in it gets assigned to all the hosts.\n\nConfiguring\
    \ host servers:\n\n•  Scan for new disk\n\n•  Create file system\n\n•  Mount file\
    \ system\n\nFollow the operating system and application documentation to configure\
    \ your disk and file system.\n\n### Storage connected to host server via iSCSI\n\
    \nPhysical cabling:\n\n•  Connect cable between storage and Ethernet switches.\n\
    \n•  Connect cable between host servers and Ethernet switches.\n\n•  Label each\
    \ cable.\n\nConfiguring Ethernet switches:\n\n•  Create VLAN.\n\n•  Follow VLAN\
    \ best practices as per the product documents to provide desired access.\n\nConfiguring\
    \ storage:\n\n•  Identify IQN number of iSCSI initiator adapter. Refer product\
    \ documentation to determine the IQN number.\n\n•  Creation of host.\n\nSpecify\
    \ IQN number to create an iSCSI host in storage:\n\n•  Creation of virtual volume.\n\
    \n•  Export or presentation or assign the virtual volume to the host.\n\nConfiguring\
    \ host servers:\n\n•  Open iSCSI initiator console or CLI interface and login\
    \ to iSCSI target\n\n•  Once login is successful, scan for new disk\n\n•  Create\
    \ file system\n\n•  Mount file system\n\nFollow operating system and application\
    \ documentation to configure your disk and file system.\n\n### File storage connected\
    \ to SMB and NFS client systems\n\nPhysical cabling and Ethernet switch configuration\
    \ is the same as iSCSI described above.\n\nConfiguring file server storage:\n\n\
    •  Create SMB or NFS share. Refer product documentation for exact steps to create\
    \ shares.\n\n•  Assign permission to share for desired user.\n\nConfiguring file\
    \ share client:\n\n•  Mount the SMB or NFS share using this \\\\\\\\Server IP\
    \ or Hostname\\\\<Share name>\n\n•  Supply username and password to access the\
    \ share.\n\n## Conclusion\n\nAll storage vendors develop and provide suite of\
    \ software that manages the storage system as well as the solution.\n\nPrimary\
    \ purpose of any management software of a storage system is to provision and configure\
    \ the storage system and also monitor health of the storage system. For example,\
    \ storage administrator uses this software to create a storage volume and monitor\
    \ connection status of all the ports of the storage controllers.\n\nApart from\
    \ storage system management software there is other management software that helps\
    \ to configure and perform local and remote replications; backups monitor storage\
    \ live and past performances, and so on.\n\nTypically there are four fundamental\
    \ steps to configure and access a storage system’s virtual volume such as cable,\
    \ configure switches, create virtual volume and configure host server to access\
    \ the volume.\n\n## Case studies\n\n### Case study 1: Provisioning storage space\
    \ to a Linux host server\n\nLet us provision storage space to a Linux host server:\n\
    \n#### Requirement\n\nA Linux host is connected to a SAN storage. Network and\
    \ SAN zoning are already configured. Provide steps to create and configure storage\
    \ volume in host server via FC and iSCSI.\n\n#### Analysis\n\nFollowing steps\
    \ are followed to provision storage space to a host in the storage system:\n\n\
    Step 1: Creation of a host entry.\n\nStep 2: Creation and presentation of virtual\
    \ volume to the host in the host server: Although there are several methods available\
    \ or third party tools available, configure file system on a storage volume, typically\
    \ these steps are followed using Linux native command and utilities.\n\nStep 3:\
    \ Scan for new disk: find /sys/class/scsi\\_host/host\\*/scan | while read line;\
    \ do echo - - - > $line; done\n\nStep 4: Listing all devices: fdisk -l\n\nStep\
    \ 5: Partitioning disk: fdisk <device file> \n\nStep 6: Creating file system:\
    \ mkfs <device file>\n\nStep 7: Mounting file system : mount <device file> /<mount\
    \ point>\n\n#### Solution\n\nStep 1: Creation of a host entry:\n\nA host entry\
    \ must be created in storage for the first time configuration for a host server.\
    \ To create a host entry, couple of information is important:\n\n•  WWPNs of FC\
    \ HBA, IQN name for iSCSI or NQN of NVMe subsystem\n\n•  Operating system"
  fmt: "\n# Steps to implement storage solution\n\nGenerally, more than one storage\
