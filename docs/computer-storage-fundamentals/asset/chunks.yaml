    \nSpace efficiency vs. availability vs. performance\n\nSelection of a RAID level\
    \ is always a tradeoff among three aspects of a storage space efficiency, availability\
    \ and performance. For example, RAID 0 has maximum space efficiency and provide\
    \ better performance, but fault tolerance is extremely low. Failure of any disk\
    \ can cause data loss of the volume. On the other hand, RAID 1 provides better\
    \ fault tolerance and performance, but has poor space efficiency. Therefore it\
    \ is important for storage administrator to select appropriate RAID level based\
    \ on business requirement.\n\n![Figure 3.36: RAID level tradeoffs](images/Fig_3.36.png)\n\
    \nFigure 3.36: RAID level tradeoffs\n\nRAID technology also evolved over the time\
    \ and currently modern storage systems, combines multiple RAID virtual volumes\
    \ to construct another layer of virtualization. Though this increases complexity\
    \ of implementation and troubleshooting, but enhance performance and data availability\
    \ further. This is called Virtual RAID.\n\nStorage virtualization is commonly\
    \ implemented technology in every storage solution. RAID is an example of a virtualization\
    \ within a storage system. Similarly virtualization can also be implemented across\
    \ multiple storage system, or at network level or host server level. This enhances\
    \ performance and space utilization efficiency.\n\n## Case studies\n\n### Case\
    \ Study 1: Performance and space efficiency are critical\n\nLet us look at performance\
    \ and space efficiency:\n\n#### Requirement\n\nAn organization requires storage\
    \ volume for testing a software product. Performance and usable capacity is most\
    \ important for them. They can copy the test data again, if it is lost. What solution\
    \ can be proposed for this requirement?\n\n#### Analysis\n\nAs shown in [Figure\
    \ 3.35](#ch03.xhtml#fig3-35): RAID Level tradeoffs, all RAID levels provide data\
    \ protection against any disk failure except RAID 0. RAID 0 also provides maximum\
    \ performance, as all drives, underlying to RAID 0 volume, are involved in read/write\
    \ requests. Since there is no parity or mirroring of data involved in RAID 0,\
    \ entire space of all drives are used for storing data. Therefore RAID 0 provides\
    \ maximum usable capacity.\n\n#### Solution\n\nRAID 0 virtual volume is recommended\
    \ for this requirement. The [Figure 3.15](#ch03.xhtml#fig3-15): Striped disk array\
    \ without fault tolerance can be referred to understand how RAID 0 is implemented.\n\
    \n### Case Study 2: Testing of disk failures in Virtual RAID enabled storage system\n\
    \nLet us look at the testing of disk failures in Virtual RAID enabled storage\
    \ system:\n\n#### Requirement\n\nA company recently purchased a latest storage\
    \ system with 120 disks. The storage system supports Virtual RAID. Administrator\
    \ wants to test pattern of disk failures when Virtual RAID 1 is configured with\
    \ all the disks.\n\n#### Analysis\n\nVirtual RAID breaks down each physical disk\
    \ into smaller physical chunk, which is a miniature of a physical disk. When a\
    \ Virtual RAID 1 is created out of all 120 disks, hundreds of logical disks are\
    \ formed based on those chunks and then concatenated them to form a virtual volume.\
    \ Each RAID 1 logical volume chunk is formed from physical chunk resides on different\
    \ physical drives. At larger view, layout of the Virtual RAID 1 is something similar\
    \ to RAID 1 + 0, but at granularity of smaller physical chunk, instead of considering\
    \ whole disk in traditional RAID levels.\n\nTherefore there is going to be total\
    \ 60 pairs of disk. For testing, administrator can pullout maximum of 60 disks\
    \ together, but each drive can be one member of each pair. But if he pulls out\
    \ just two drives and they happen to be part of same pair then virtual volume\
    \ would go into failed state.\n\n#### Solution\n\nRefer production document to\
    \ determine the RAID layout. Once it is understood, one member from each pair\
    \ can be failed or pulled out together without impacting virtual volume.\n\nHowever\
    \ pulling out two drives of same pair may impact the volume.\n\n## Learning check\n\
    \n### Objective questions\n\n 1. Consider a RAID array consisting of four 750\
    \ GB disks, What is the usable capacity if a RAID 5 volume is created:\n\n a.\
    \ 3 TB\n\n b. 1.5 TB\n\n c. 2.25 TB\n\n d. 1 TB\n\n 2. If your application does\
