    \ virtual volume to the host. In case of cluster, single virtual volume is needed\
    \ to be accessed to multiple hosts in cluster.\n\nGenerally more than one storage\
    \ volumes are configured for an application. For ease of management some storage\
    \ vendors allow to create an additional storage object called volume collection,\
    \ volume set or volume group, which comprises set of virtual volumes in it. A\
    \ volume set relates to an application.\n\nSimilarly another object called host\
    \ collection, host set or host group for set of hosts in it. A host set maps to\
    \ hosts cluster.\n\nIf a volume set assigned to a host, all the volumes in it\
    \ gets assigned to the host with unique `LUN` ID. Again when a volume set assigned\
    \ to a host set, all the volumes in it gets assigned to all the hosts.\n\n###\
    \ Configuring host servers\n\n- Scan for new disk\n- Create file system\n- Mount\
    \ file system\n\nFollow the operating system and application documentation to\
    \ configure your disk and file system.\n\n## Storage connected to host server\
    \ via iSCSI\n\n### Physical cabling\n\n- Connect cable between storage and Ethernet\
