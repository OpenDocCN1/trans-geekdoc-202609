    # 第 7 章 故障容错与数据保护


    ## 简介


    存储系统的主要目标之一是保护业务关键数据免受所有可能的硬件和软件故障影响。在前三章中，我们了解到存储解决方案和存储系统旨在防止硬件故障导致主机访问数据中断，涵盖从多路径、多控制器、双路径布线的磁盘机箱到
    RAID 实现的每一层级。此外，所有存储厂商还实现了其他多种特性和功能，如快照、克隆和数据复制以保护数据。组织还会采取额外预防措施实施备份解决方案，以便在需要时恢复数据。


    ## 结构


    成功完成本章后，您将了解：


    - 增强解决方案故障容错能力的存储特性

    - 本地复制

    - 远程复制与灾难恢复

    - 备份解决方案

    - 持续数据保护

    - 副本数据管理


    ## 目标


    本章结束时，您将了解各种特性，使主机应用程序能在存储解决方案或存储系统发生故障时继续访问数据。本章还解释了与数据保护相关的存储技术，如快照、克隆和复制，允许在数据损坏或意外丢失时恢复数据。本章还重点介绍了组织实施的不同类型备份解决方案，以便在数据丢失时恢复数据。


    ## 故障容错与数据保护


    在存储故障容错和数据保护的背景下，两个重要术语——业务连续性 (`BC`) 和灾难恢复 (`DR`) 常被使用。


    `BC` 更多是主动规划和策略，确保业务关键数据可用，使组织业务以最小或零停机时间运行。`DR` 是被动措施，关乎灾难发生时数据恢复和应用程序恢复运行的速度。下文所述的智能存储系统的特性和功能，支持组织实施业务连续性和灾难恢复解决方案。


    ### 多路径


    `多路径` 是运行在主机服务器上的任何现代操作系统的内置驱动组件。该组件被视为存储解决方案的一部分。当主机服务器与存储系统间的链路发生故障时，操作系统中运行的
    `多路径` 驱动会将所有 I/O 请求重定向至其他幸存路径。链路故障可能由线缆故障、交换机故障或环境中任何其他中断引起。下图展示了一个示例，其中 `HBA2`
    与 `Switch2` 间的路径故障，此时所有读/写请求将通过 `HBA1` 路径处理。正常运行期间，若带宽利用率超过 `HBA1` 路径带宽，则 `HBA2`
    路径故障可能影响读/写请求性能，直到故障路径恢复。


    ![图 7.1：通过多路径实现故障容错](img/Fig_7.1.jpg`)


    *图 7.1：通过多路径实现故障容错*


    ### 多控制器


    每个存储系统设计至少包含两个或更多控制器。拥有多控制器的原因之一是控制器故障时仍能继续应用程序访问。控制器的任何硬件或软件组件可能停止工作，此时应用程序甚至无感知故障，因为其他幸存控制器无缝接管读/写操作。


    如下图所示，控制器 1 (`CTRL1`) 故障导致控制器 2 (`CTRL2`) 接管操作。


    ![图 7.2：通过多控制器实现故障容错](img/Fig_7.2.jpg`)


    *图 7.2：通过多控制器实现故障容错*


    ### 双路径磁盘机箱


    在存储系统后端，磁盘机箱也设计为具有到控制器的两条路径。这是为了确保一条路径故障时，控制器仍能维持与物理磁盘的通信。每个物理磁盘也有两个端口，一个连接到一条路径，另一个连接到另一条路径。


    ![图 7.3：双路径磁盘机箱中的故障容错](img/Fig_7.3.png`)


    *图 7.3：双路径磁盘机箱中的故障容错*


    ### RAID 实现


    正如 `第 3 章` 所述，`RAID` 是存储系统中确保磁盘故障不影响主机访问数据的重要考量因素。除 `RAID` 0 级外，所有其他 `RAID` 级别均提供存储系统故障容错。例如，`RAID
    6` 卷上的数据在最多两块磁盘故障后仍可访问。


    ![图 7.4：RAID 中的故障容错](img/Fig_7.4.png`)


    *图 7.4：RAID 中的故障容错*


