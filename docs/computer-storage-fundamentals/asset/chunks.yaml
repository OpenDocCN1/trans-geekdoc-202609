    - c. Originates `SCSI` command operations after arbitrating for the `SCSI` bus

    - d. Returns the status byte for every `SCSI` operation that requests data to
    be transferred


    ## 53. Which of the following statements is true about `SAS` and `SATA` drives?


    - a. `SAS` drives offer high performance, high reliability for mission critical
    environments

