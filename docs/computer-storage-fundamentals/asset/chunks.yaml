- raw: "•  Unused space cannot be used by another host.\n\n•  If the disk fails, data\
    \ is lost.\n\n![Figure 3.33: Non-virtualized environment](images/Fig_3.33.png)\n\
    \nFigure 3.33: Non-virtualized environment\n\nThe virtualization software or device\
    \ uses the metadata to re-direct I/O requests. It will receive an incoming I/O\
    \ request containing information about the location of the data in terms of the\
    \ logical disk (virtual disk) and translates this into a new I/O request to the\
    \ physical disk location.\n\nFor example the virtualized device may:\n\n•  Receive\
    \ a read request for vdisk LUN ID=1, LBA=32\n\n•  Perform a metadata look up for\
    \ LUN ID=1, LBA=32, and finds this maps to physical LUN ID=6, LBA0, and physical\
    \ LUN ID=7, LBA0\n\n•  Sends a read request to physical LUN ID=6, LBA0 and physical\
    \ LUN ID=7, LBA0\n\n•  Receives the data back from the physical LUNs\n\n•  Sends\
    \ the data back to the initiator as if it had come from vdisk LUN ID=1, LBA32\n\
    \nVirtualization benefits–availability: Non-disruptive data migration\n\n•  The\
    \ host only knows about the logical disk (the mapped LUN) and so any changes to\
    \ the metadata mapping is transparent to the host. This means the actual data\
    \ can be moved or replicated to another physical location without affecting the\
    \ operation of any client. When the data has been copied or moved, the metadata\
    \ can simply be updated to point to the new location, therefore freeing up the\
    \ physical storage at the old location.\n\n•  Improved availability by increasing\
    \ fault tolerance of system.\n\nStorage virtualization benefit–improved utilization\n\
    \n•  Utilization can be increased by virtue of the pooling, migration, and thin\
    \ provisioning services.\n\n•  When all available storage capacity is pooled,\
    \ system administrators no longer have to search for disks that have free space\
    \ to allocate to a particular host or server. A new logical disk can be simply\
    \ allocated from the available pool, or an existing disk can be expanded.\n\n\
    •  Storage can be assigned where it is needed at that point in time, reducing\
    \ the need to guess how much a given host will need in the future.\n\n•  Virtual\
    \ volume expand and shrink\n\n### Storage virtualization risks\n\nMetadata becomes\
    \ critical:\n\n•  Once virtualized, the metadata are the glue in the middle. If\
    \ the metadata are lost, so is all the actual data as it would be virtually impossible\
    \ to reconstruct the logical drives without the mapping information.\n\nComplexity\
    \ increases:\n\n•  Management of environment: Although a virtual storage infrastructure\
    \ benefits from a single point of logical disk and replication service management,\
    \ the physical storage must still be managed. Problem determination and fault\
    \ isolation can also become complex, due to the abstraction layer.\n\n•  Infrastructure\
    \ design: Traditional design ethics may no longer apply, virtualization brings\
    \ a whole range of new ideas and concepts to think about.\n\n•  Every data that\
    \ arrives at a virtualized array is torn into multiple pieces, as it has to be\
    \ written on to all drives. Thus, in general, I/OPS become a bottleneck rather\
    \ than bandwidth at frontend.\n\n![Figure 3.34: Storage virtualization and different\
    \ level](images/Fig_3.34.jpg)\n\nFigure 3.34: Storage virtualization and different\
    \ level\n\n## Logical Volume Management\n\nHost-based volume management is a software\
    \ RAID solution implemented within host OS. Logical Volume Management (LVM) is\
    \ an example of storage virtualization at host level. Today most modern Linux\
    \ distributions are LVM-aware.\n\nLVM provides administrator to take advantage\
    \ of storage virtualization by abstracting the physical layout of storage devices\
    \ for easier and flexible administration. RAID volume can be configured with striping\
    \ and mirroring to achieve better fault tolerance and performance. Data can be\
    \ spread across underlying heterogeneous storage devices and migrated online from\
