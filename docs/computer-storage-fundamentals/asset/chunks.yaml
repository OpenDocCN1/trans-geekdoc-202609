  trans: "\n# 图 7.27：高可用存储解决方案\n\n解决方案的示意图如下所示。以上讨论的所有配置都需要进行配置，以使解决方案更加健壮，并防范所有可能的故障。\n\
    \n![图 7.27：高可用存储解决方案](img/Fig_7.27.png`)\n\n## 学习检查\n\n### 客观题\n\n1. 将一个存储的数据镜像到另一个存储属于：\n\
    \   a. 灾难恢复解决方案\n   b. 备份解决方案\n   c. 容量管理解决方案\n   d. 存储管理解决方案\n\n2. RPO 和 RTO\
    \ 术语用于以下哪种场景：\n   a. 性能增强\n   b. 数据保护和备份解决方案\n   c. 容量管理解决方案\n   d. 存储管理解决方案\n\
    \n3. 在复制解决方案中，故障切换和故障恢复操作在以下哪个层级执行：\n   a. 存储系统级别\n   b. 复制组级别\n   c. 虚拟卷级别\n\
    \   d. 存储控制器级别\n\n4. 快照属于：\n   a. 灾难恢复解决方案\n   b. 备份解决方案\n   c. 远程复制\n   d. 本地复制\n\
    \n5. 一个 100 GB 的存储创建了一个 80 GB 的卷。关于快照和克隆创建，以下哪些陈述是正确的？\n   a. 克隆创建将成功\n   b. 克隆创建将失败\n\
    \   c. 快照创建将失败\n   d. 快照创建将成功\n\n6. 本地和远程复制解决方案主要用于：\n   a. 降低数据存储成本\n   b. 提高性能\n\
    \   c. 保护数据\n   d. 以上所有\n\n7. 以下哪两个功能影响存储的容错能力：\n   a. 动态容量管理（LUN 收缩/扩展）功能\n \
    \  b. 精简配置功能\n   c. 磁盘类型\n   d. RAID 实现\n   e. 复制解决方案\n\n8. 一位客户在一个存储系统上将其数据库配置在三个不同的存储卷上（500\
    \ GB、2 TB 和 5 TB）。他现在想要实施远程复制解决方案以获得更好的容错能力，他需要做什么？\n   a. 购买额外的存储，最小可用容量为 7.2\
    \ TB；配置三个复制组，每个包含一个源卷和一个目标卷。\n   b. 无需购买额外存储。在同一存储上配置一个包含这三个源卷的复制组。\n   c. 购买额外的存储，最小可用容量为\
    \ 7.2 TB，配置一个包含这三个源卷和三个目标卷的复制组。\n   d. 购买任意可用容量的额外存储；配置三个复制组，每个包含一个源卷和一个目标卷。\n\
    \n9. 数据对象的快照包含：\n   a. 特定时间点 (PIT) 的数据镜像\n   b. 一段时间内的数据镜像\n   c. 始终相同的数据\n  \
    \ d. 增量数据\n\n10. 以下哪项功能不仅保护数据，还防止对主卷数据的访问中断？\n    a. 复制数据管理\n    b. 快照技术\n   \
    \ c. 备份解决方案\n    d. RAID 1\n\n11. 以下哪项功能仅在存储解决方案中提供容错能力，但不提供数据保护。\n    a. 备份解决方案\n\
    \    b. 快照技术\n    c. 多路径\n    d. RAID 1\n\n12. 以下哪项在虚拟卷底层物理磁盘发生物理故障时不提供数据保护？\n\
    \    a. 快照\n    b. 克隆\n    c. 备份\n    d. 远程复制\n\n13. 克隆于上午 9:00 创建。它于上午 10:00\
    \ 完成后台复制。克隆卷上的数据将与父虚拟卷在以下时间点的数据相同：\n    a. 上午 9:00\n    b. 上午 10:00\n    c. 上午\
    \ 9:00 和 10:00 之间\n    d. 无法确定\n\n14. 同步复制的 RPO 为：\n    a. 0\n    b. 1 小时\n  \
    \  c. 2 小时\n    d. 3 小时\n\n15. 以下哪种解决方案不应用于防止意外删除数据？\n    a. 快照\n    b. 克隆\n \
    \   c. 备份\n    d. 远程复制\n\n### 主观题\n\n1. 描述存储解决方案中以及存储系统内部实现的不同层级的容错功能。从主机服务器到存储控制器后端的物理磁盘。\n\
    \n2. 解释快照的快照的用例和目的。\n\n3. 描述同步和异步模式复制的优缺点。\n\n4. 描述业务连续性 (BC) 和灾难恢复 (DR) 解决方案的区别。与\
    \ BC 和 DR 相关的存储系统功能。\n\n### 测验题\n\n1. COW 和 ROW 的区别是什么？哪种快照技术在可读写快照上提供更好的写性能，为什么？\n\
    \n2. 双向远程复制的目的是什么？\n\n3. 快照仅用于备份目的。你支持这个说法吗？\n\n4. 什么是 WORM？请列举它的三个优势。\n\n## 术语表和关键术语\n\
    \n* **业务连续性**：确保业务关键数据可用性的主动措施。\n* **灾难恢复**：灾难发生后将数据恢复到正常运行状态的过程和程序。\n* **恢复点目标**：灾难发生时你希望恢复的数据的最大允许年龄（即最大数据丢失量）。\n\
    * **恢复时间目标**：从灾难中恢复所需的时间。\n* **时间点**：指保存父卷在给定时间点数据的快照。\n* **快照**：在不中断其 I/O 操作的情况下创建的虚拟卷内容的时间点副本。快照通常用于短期任务，如报表生成和备份。\n\
    * **克隆**：父虚拟卷的副本，但它是一个独立的虚拟卷。\n* **写时复制**：数据首先写入快照，然后更新父卷中的数据。\n* **重定向写入**：数据写入新位置，父卷指向该新位置。快照继续指向原始位置。\n\
    * **持续数据保护**：为数据的每次变更创建副本。\n* **同步复制**：一种远程复制模式，在向主机确认写操作之前，数据已复制到目标端。\n* **异步复制**：一种远程复制模式，先向主机确认写操作，然后在后台将数据复制到目标存储。\n\
    * **应用一致性快照**：在静止主卷上的 I/O 操作并由应用程序刷新内存数据后创建的快照。\n* **崩溃一致性快照**：在不静止 I/O 操作的情况下创建的快照。\n\
    * **扁平备份**：一种备份解决方案，从快照读取数据并复制到备份系统，而不从主机服务器读取数据。\n* **变更块跟踪**：存储系统用来跟踪主机服务器更新的块的技术。备份软件引用这些块执行增量备份。\n\
    * **复制数据管理**：一种软件解决方案，用于高效管理数据副本的数量并满足多副本需求。\n* **一次写入多次读取 (WORM)**：一种以不可篡改方式存储数据的数据归档技术。\n\
    \n## 加入我们的 Discord 空间\n\n加入我们的 Discord 工作区，获取最新资讯、优惠、全球技术动态、新版本发布以及与作者的交流会：\n\n\
    [`https://discord.bpbonline.com`](https://discord.bpbonline.com)\n\n![二维码徽标](img/fm1.png`)\n\
    \n# 第 8 章 空间效率\n\n## 简介\n\n多年来，存储技术演进的主要焦点是性能和容错。与高效存储数据相关的技术，如精简配置、去重、压缩、回收，直到近年来才开始实施和应用。这是因为近年来数据的爆发式增长导致对存储系统中更多空间的需求。如今，大多数现代存储系统都实现了这些功能，以确保数据占用更少的磁盘空间。\n\
    \n## 结构\n\n本章结束时，您将了解提高存储系统空间效率的存储系统功能：\n\n* 精简配置\n* 空间回收\n* 动态容量管理——卷扩展和收缩\n"
