    \n![QR-Logo](images/fm1.png)\n\n# CHAPTER 5Storage Networking to Share Storage\
    \ \n\n## Introduction\n\nWhen computer networking evolved, industry trend had\
    \ changed to multiple cluster servers hosting different applications. So, an additional\
    \ requirement of centralized storage for sharing data evolved. Therefore, a new\
    \ network, called SAN, for sharing storage systems came into picture.\n\nIn other\
    \ words, a computer network is a communication network which allows exchanging\
    \ data among host servers and storages.\n\n![Figure 5.1: Computer networking](images/Fig_5.1.jpg)\n\
    \nFigure 5.1: Computer networking\n\nRefer to the following [Figure 5.2](#ch05.xhtml#fig5-2):\n\
    \n![Figure 5.2: Storage networking to share storage](images/Fig_5.2.png)\n\nFigure\
    \ 5.2: Storage networking to share storage\n\nSAN fabric is a logical entity that\
    \ consists of multiple FC switches connected together. Connection between two\
    \ switches is called inter-switch link (ISL).\n\n## Structure\n\nUpon successful\
    \ completion of this chapter, you will be able to learn following key areas of\
    \ storage networking:\n\n•  SAN topology\n\n•  Zoning\n\n•  LUN masking\n\n• \
    \ Multipath\n\n## Objectives\n\nIn this chapter, you will learn different network\
    \ topologies through which host servers and storage systems are connected. You\
    \ will also learn about network configurations to control various access of storage\
    \ system by the host servers, such as zoning and LUN masking.\n\nIt is because\
    \ of some specific network physical connectivity and access configuration multiple\
    \ paths get created between host server and storage system, in this chapter you\
    \ will also learn about how virtual volumes are accessed over multiple path along\
    \ with load balance and failover.\n\n### SAN topology\n\nAt the time of designing\
    \ SAN, topology is one of the most important considerations. Topology is mainly\
    \ driven by the requirement on how big or small the network is going to be, how\
    \ many host servers and storage storages are going to be connected to it, and\
    \ so on.\n\nOne or two switches are connected to each other to form a fabric.\
    \ Again, one or two fabrics together is called a SAN.\n\nFollowing figure shows\
    \ single fabric and dual-fabric SAN. At least two fabrics are needed to have no\
    \ single point of failure (NSPOF) environment, in which any fabric failure does\
    \ not impact host server communication to storage.\n\n![Figure 5.3: Single fabric\
    \ and dual fabric SAN](images/Fig_5.3.png)\n\nFigure 5.3: Single fabric and dual\
    \ fabric SAN\n\nTo have redundancy, best practice is to have two fabrics and devices\
    \ connect to both. This ensures availability of one path in the event of a fabric\
    \ failure.\n\nThere are three types of topologies available in a SAN fabric:\n\
    \n•  Single switch topology:\n\nOnly one switch is used to form the fabric and\
    \ to connect host server to storage system. This is mainly used for entry level\
    \ storage solution with few number of host servers connected to a storage system.\n\
    \n![Figure 5.4: Single switch topology](images/Fig_5.4.png)\n\nFigure 5.4: Single\
    \ switch topology\n\nThough, this is cost effective solution, failure of the switch\
    \ will cause communication failure between host server and the storage.\n\n• \
    \ Mesh fabric:\n\nIn a mesh fabric, switches are connected to other switch using\
    \ ISL.\n\nMesh fabric is of two types, that is, full mesh and partial mesh. In\
    \ full mesh topology, every switch is connected to every other switch using ISLs.\
    \ Host traverse a maximum of one hop to access its storage. The hop count is defined\
    \ as the number of switches in the path between the host server and storage system.\
    \ Most switch vendors support maximum of 7 hops.\n\n![Figure 5.5: Full and partial\
    \ mesh topology](images/Fig_5.5.png)\n\nFigure 5.5: Full and partial mesh topology"
