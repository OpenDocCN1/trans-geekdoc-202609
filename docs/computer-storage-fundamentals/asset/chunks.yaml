    # Storage Networking Technologies


    ## NVMe Protocol


    Non-Volatile Memory Express (NVMe) has revolutionized the storage industry by
    drastically reducing latency and improving throughput. Most storage vendors have
    redesigned their storage systems to use NVMe protocol at the frontend and as well
    as at the backend.


    [Chapter 2](#ch02.xhtml), Storage Infrastructure, explained more about usage of
    NVMe protocol for disk drive interfaces at the backend of a storage system.


    Majorly two transport protocols, FC and IETF Transport Control Protocol (TCP),
    are used in the frontend to transfer data and commands between an initiator host
    server and a target storage system.


    NVMe over FC is referred as NVMe-oFC or NVMe/FC and NVMe over TCP as NVMe-oTCP
    or NVMe/TCP.


    Supported FC HBA and NIC with updated drive is to support NVMe/FC and NVMe/TCP
    respectively.


    Modern enterprise storage systems support a total of four host protocols: FC,
    iSCSI, NVMe/FC and NVMe/TCP. The following figure depicts infrastructure for all
    types of hosts, though an organization may not have requirement of deploying all
    types of hosts together.


    ![Figure 4.17: Host types based on communication protocol](images/Fig_4.17.png)


    | Host type | Infrastructure | Transport protocol | Data protocol | Initiator
    and target identification | Storage volume identification |

    | --- | --- | --- | --- | --- | --- |

    | FC | FC | FC | SCSI (FCP) | WWN | Logical unit number ID (LUN ID) |

    | iSCSI | Ethernet | TCP | SCSI | IQNs | LUN ID |

    | NVMe/FC | FC | FC | NVMe | NQNs | Namespace ID (NSID) |

    | NVMe/TCP | Ethernet | TCP | NVMe | NQNs | NSID |


    Table 4.6: Transport and data communication protocols


    NVMe is an emerging technology. The main advantage of NVMe is 64K queues per controller,
    which reduces latency. Since it does not need any additional infrastructure, most
    organizations are migrating to NVMe environment.


    ## FCoE (Fibre Channel over Ethernet)


    ### FCoE Overview


    FCoE solves the problem of organizations having to run parallel network infrastructures
    for their LANs and their SANs. As a result, they have to operate separate switches,
    HBAs, NICs and cables for each of these networks. Even utilizing a virtualization
    solution like VMware can actually increase the number of network adapters required
    to carry traffic out of the servers.


    ### FCoE Reduces Cards and Cabling


    With so many NICs, HBAs, switches and cables to deal with, both capital and operational
    costs to run a data center can increase significantly. FCoE represents a way to
    drastically reduce the number of cards, switches, adapters, and assorted cabling
    by running LANs and SANs over the same infrastructure. According to analyst firm
    Enterprise Strategy Group (ESG), FCoE works out considerably cheaper to deploy
    than traditional networks due to reduced hardware costs.


    ![Figure 4.18: FC/iSCSI vs. FCoE](images/Fig_4.18.png)


    To look at it in another way, FCoE is a standard for using the FC protocol (which
    is the mainstay of the SAN) over Ethernet networks (the mainstay of the computer
    networks, both wired and wireless). FCoE provides a way to transport FC SAN traffic
    over Ethernet, eliminating the need for a separate storage network.


    To understand FCoE, it is important to grasp the two key definitions that form
    the terms FC and Ethernet.


    ### FCoE Technology


    #### Fibre Channel


    FC is a serial data transfer protocol and standard for high-speed enterprise-grade
    storage networking. It supports data rates up to 10 Gbps and delivers storage
    data over fast optical networks. Basically, FC is the language through which storage
    devices such as HBAs, switches and controllers can communicate.


    #### Ethernet


    Ethernet is an architecture developed almost 40 years ago for LANs. In its early
    days, it supported up to 10 Mbps. However, more recently this has been extended
    to 1 Gbps, 10 Gbps and more. Ethernet is essentially a transfer medium enabling
    data to travel along cables or wirelessly in units known as frames.


    FCoE is basically a way to map FC over full-duplex Ethernet networks based on
    the Institute of Electrical and Electronic Engineers (IEEE) 802.3 standard. As
    well as consolidating I/O, it is an effective way of reducing complexity by eliminating
    the necessity of establishing and running parallel networks for storage and networking.


    The technology can be deployed in a top-of-the-rack (ToR) configuration: FCoE-enabled
    switch sits on the top of the rack and takes the place of FC switch and an Ethernet
    switch. This configuration would assume the use of converged network adapters
    (CNAs) or a universal LAN on motherboard (LOM) that is capable of supporting FCoE.


    If warranted, redundant connections can be established using at least two FCoE
    connections for each server to the ToR FCoE switch. This would take the place
    of two FC and two Ethernet connections per server for redundancy purposes. The
    ToR switch would then send the Ethernet traffic to the LAN and the FC traffic
    to the SAN.


    As well as ToR switches, FCoE is also available in other formats, such as blades
    that plug into the storage backbone, and at the server level, CNAs for FCoE can
    replace FC HBAs and Ethernet NICs, along with associated cabling. Both protocols
    can be supported on the same port. In terms of the overall network stack, FCoE
    routes FC traffic at the link layer, and also uses Ethernet to transmit the FC
    protocol.


    Overall, the move toward FCoE is seen as part of an overall trend toward network
    convergence. In recent times, we have seen convergence in such areas as voice
    and data. Formerly, telecom utilized one network to carry phone lines and another
    line for computerized data traffic. This has converged using Voice over Internet
    Protocol (VoIP) as a means of cutting down on network clutter and unifying traffic.


    The same basic trend is now beginning to take effect in storage, where more and
    more hardware can accommodate converged networks. Servers, for example, are available
    with universal connectivity adaptors that are able to handle almost any Ethernet-based
    protocol either via chips on the motherboard or through adapter cards. Eventually,
    storage networks may converge completely with Ethernet, but for now, both converged
    and dedicated storage networks remain widely deployed.


    ## File Access Protocols


    NAS devices typically leverage existing IP networks for connectivity, enabling
    companies to reduce the price of entry for access to shared storage.


    RAID and clustering capabilities inherent to modern enterprise NAS devices offer
    greatly improved availability when compared with traditional DAS.


    Because NAS devices control the file system, they offer increased flexibility
    when using advanced storage features such as snapshots.


    With 10GE connectivity, NAS devices can offer performance on par with many currently
    installed FC SANs.


    NFS/CIFS (NAS) storage protocols are designed to accept host requests like `create-file-Mywork.doc`
    or `read-file-Office.xls`.


    NFS is a distributed file system protocol originally developed by Sun Microsystems
    in 1984, allowing a user on a client computer to access files over a network in
    a manner similar to how local storage is accessed. On the contrary, CIFS is its
    Windows-based counterpart used in file sharing.


    NFS uses advisory locks locking implementation; a process can read and write to
    a file while it is locked. However, there is a way for a process to check for
    the existence of a lock before a read or write.


    NAS, in contrast to SAN, uses file-based protocols such as NFS or SMB/CIFS, where
    it is clear that the storage is remote, and computers request a portion of an
    abstract file rather than a disk block. The key difference between DAS and NAS
    is that DAS is simply an extension to an existing server and is not necessarily
    networked. NAS is designed as an easy and self-contained solution for sharing
    files over the network.

