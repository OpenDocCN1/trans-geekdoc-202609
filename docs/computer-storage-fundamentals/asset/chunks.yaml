    \n# CHAPTER 3Storage Disk Array\n\n## Introduction\n\nA storage disk array is\
    \ a storage system that consists of a pool of physical disk drives and one or\
    \ more storage controllers, which stores terabytes of data and performs multiple\
    \ host server’s input/output (I/O) operations. Storage vendors design and implement\
    \ several features in storage system to improve read/write performance and data\
    \ fault tolerance. Some of those features are controller operations, data caching\
    \ technics, RAID concepts, and so on. RAID implementation in storage system has\
    \ greatly influenced both performance and fault tolerance aspects of a storage\
    \ system. For this reason, in the last three decades all storage vendors have\
    \ been implementing it in their storage systems. Modern storage disk array implements\
    \ Virtual RAID, which enhances performance and fault tolerant factors at greater\
    \ extend.\n\nApart from RAID, disk array also has several intelligence features\
    \ implemented to provide highly optimized I/O processing, fault tolerant and efficient\
    \ storage capabilities. Some of those features are storage tiering, quality of\
    \ service (QoS), replication, thin provisioning, deduplication and compression\
    \ and many more. These features discussed in details in following chapters.\n\n\
    Therefore, storage arrays are referred as intelligent storage arrays (ISA) or\
    \ intelligent storage systems (ISS).\n\n## Structure\n\nThis chapter primarily\
    \ focuses on storage system and you will learn about following aspects of a storage\
    \ system:\n\n•  Physical layout and components of storage system\n\n•  Storage\
    \ controller operation modes\n\n•  Caching techniques\n\n•  RAID concept\n\n• \
    \ Virtual RAID\n\n•  Storage virtualization\n\n## Objectives\n\nBy end of this\
    \ chapter you will learn about design and implementation of various features and\
    \ functionalities of a storage system, such as storage controller operation modes,\
    \ different data caching techniques and how user data is stored on to the physical\
    \ disk using different RAID levels. This chapter will also discuss the pros and\
    \ cons of each RAID levels.\n\n## Controller operation modes"
