  trans: "\n# 实施存储解决方案的步骤\n\n通常，一个应用程序会配置多个存储卷。为了便于管理，某些存储供应商允许创建一个额外的存储对象，称为卷集合、卷组或卷组，其中包含一组虚拟卷。卷组与应用程序相关联。\n\
    \n同样，还有另一个对象称为主机集合、主机组或主机组，用于其中的一组主机。主机组映射到主机的集群。\n\n如果将卷组分配给主机，则其中的所有卷都将分配给该主机，并具有唯一的\
    \ `LUN` ID。同样，当卷组分配给主机组时，其中的所有卷都将分配给所有主机。\n\n通常，每个管理软件都可以通过多种接口访问，例如 `GUI`、用于通过脚本批量执行操作的\
    \ `CLI` 以及与平台无关的 `REST` API，后者可以发起创建、读取、更新和删除 (`CRUD`) 操作。\n\n存储管理软件还有其他一些功能，例如报告和告警功能、统一管理控制台（允许管理员通过单一视图\
    \ `SPoG` 管理多个存储系统）、与其他软件解决方案的集成等。\n\n通常需要遵循以下四个步骤来实施存储解决方案：\n\n![](img/Fig_9.2.jpg)\n\
    ![Figure 9.2: Steps to implement a storage solution and storage solution architecture](img/Fig_9.3.jpg)\n\
    \n图 9.2：实施存储解决方案的步骤和存储解决方案架构\n\n有各种存储解决方案可供选择，以满足不同的目的。以下是三种常见的配置：\n\n- 连接到集群中多台主机的\
    \ SAN 存储\n- 通过 `iSCSI` 连接到主机服务器的存储\n- 连接到 `SMB` 和 `NFS` 客户端系统的文件存储\n\n## 连接到集群中多台主机的\
    \ SAN 存储\n\n在 `SAN` 环境中，结构由一个或多个 `FC` 交换机组成。以下是实施 `SAN` 存储解决方案的每个步骤的简要说明。\n\n\
    ### 物理布线\n\n- 连接存储与 `FC` 交换机之间的线缆。\n- 连接主机服务器与 `FC` 交换机之间的线缆。\n- 给每根线缆贴上标签。这对于未来排查任何问题至关重要。\n\
    \n### 配置交换机\n\n- 识别 `FC` `HBA` 的 `WWPN`\n  - 参考产品文档以确定连接到结构的 `N_Port` 设备的全球端口号\
    \ (`WWPN`)\n- 创建别名\n  - 为每个 `WWPN` 分配有意义的名称\n- 创建区域\n  - 遵循产品文档中的分区最佳实践以提供所需的访问权限\n\
    - 创建配置或区域集并启用它\n\n### 配置存储\n\n- 创建主机\n  - 主机是存储中的一个逻辑实体，代表将要访问虚拟卷的主机服务器。通常主机需要\
    \ `FC` `HBA` 的 `WWPN` 或 `iSCSI` 发起程序适配器的 `IQN` 编号以及其上运行的操作系统名称。某些存储供应商创建主机时可能需要额外信息。\n\
    \  - 在集群环境中，可能需要创建多个主机。\n- 创建虚拟卷\n  - 虚拟卷是在存储系统上创建的逻辑磁盘，旨在为主机提供访问权限以存储数据和进行读/写操作。\n\
    - 导出、呈现或将虚拟卷分配给主机\n  - `LUN` 掩码提供主机对虚拟卷的访问权限。在集群情况下，单个虚拟卷需要被集群中的多台主机访问。\n\n通常，一个应用程序会配置多个存储卷。为了便于管理，某些存储供应商允许创建一个额外的存储对象，称为卷集合、卷组或卷组，其中包含一组虚拟卷。卷组与应用程序相关联。\n\
    \n同样，还有另一个对象称为主机集合、主机组或主机组，用于其中的一组主机。主机组映射到主机集群。\n\n如果将卷组分配给主机，则其中的所有卷都将分配给该主机，并具有唯一的\
    \ `LUN` ID。同样，当卷组分配给主机组时，其中的所有卷都将分配给所有主机。\n\n### 配置主机服务器\n\n- 扫描新磁盘\n- 创建文件系统\n\
    - 挂载文件系统\n\n请遵循操作系统和应用程序文档来配置您的磁盘和文件系统。\n\n## 通过 iSCSI 连接到主机服务器的存储\n\n### 物理布线\n\
    \n- 连接存储与以太网交换机之间的线缆。\n- 连接主机服务器与以太网交换机之间的线缆。\n- 给每根线缆贴上标签。\n\n### 配置以太网交换机\n\n\
    - 创建 `VLAN`。\n- 遵循产品文档中的 `VLAN` 最佳实践以提供所需的访问权限。\n\n### 配置存储\n\n- 识别 `iSCSI` 发起程序适配器的\
    \ `IQN` 编号。请参考产品文档以确定 `IQN` 编号。\n- 创建主机。\n  - 指定 `IQN` 编号以在存储中创建一个 `iSCSI` 主机：\n\
    - 创建虚拟卷。\n- 导出、呈现或将虚拟卷分配给主机。\n\n### 配置主机服务器\n\n- 打开 `iSCSI` 发起程序控制台或 `CLI` 界面并登录到\
    \ `iSCSI` 目标\n- 登录成功后，扫描新磁盘\n- 创建文件系统\n- 挂载文件系统\n\n请遵循操作系统和应用程序文档来配置您的磁盘和文件系统。\n\
    \n## 连接到 SMB 和 NFS 客户端系统的文件存储\n\n物理布线和以太网交换机配置与上述 `iSCSI` 相同。\n\n### 配置文件服务器存储\n\
    \n- 创建 `SMB` 或 `NFS` 共享。请参考产品文档了解创建共享的确切步骤。\n- 为所需用户分配共享权限。\n\n### 配置文件共享客户端\n\
    \n- 使用 `\\\\服务器 IP 或主机名\\<共享名称>` 挂载 `SMB` 或 `NFS` 共享\n- 提供用户名和密码以访问共享。\n\n# 结论\n\
    \n所有存储供应商都会开发并提供一套软件，用于管理存储系统以及解决方案。\n\n存储系统管理软件的主要目的是对存储系统进行供应和配置，并监控存储系统的健康状况。例如，存储管理员使用该软件来创建存储卷并监控存储控制器所有端口的连接状态。\n\
    \n除了存储系统管理软件外，还有其他管理软件可帮助配置和执行本地及远程复制；备份监控存储的实时和历史性能等。\n\n通常，配置和访问存储系统虚拟卷有四个基本步骤，例如布线、配置交换机、创建虚拟卷以及配置主机服务器以访问该卷。\n\
    \n# 案例研究\n\n## 案例研究 1：为 Linux 主机服务器供应存储空间\n\n让我们为 Linux 主机服务器供应存储空间：\n\n### 需求\n\
    \n一台 Linux 主机连接到 `SAN` 存储。网络和 `SAN` 分区已配置完成。提供通过 `FC` 和 `iSCSI` 在主机服务器中创建和配置存储卷的步骤。\n\
    \n### 分析\n\n按照以下步骤在存储系统中为主机供应存储空间：\n\n步骤 1：创建主机条目。\n\n步骤 2：在主机服务器中创建虚拟卷并呈现给主机：虽然有多种可用方法或第三方工具可在存储卷上配置文件系统，但通常遵循以下步骤，使用\
    \ Linux 原生命令和工具。\n\n步骤 3：扫描新磁盘：\n\n```\nfind /sys/class/scsi_host/host*/scan |\
    \ while read line; do echo - - - > $line; done\n```\n\n步骤 4：列出所有设备：\n\n```\nfdisk\
    \ -l\n```\n\n步骤 5：分区磁盘：\n\n```\nfdisk <device file>\n```\n\n步骤 6：创建文件系统：\n\n```\n\
    mkfs <device file>\n```\n\n步骤 7：挂载文件系统：\n\n```\nmount <device file> /<mount point>\n\
    ```\n\n### 解决方案\n\n步骤 1：创建主机条目：\n\n必须在存储中创建主机条目，以便对主机服务器进行首次配置。创建主机条目需要以下几项重要信息：\n\
    \n- `FC` `HBA` 的 `WWPN`、`iSCSI` 的 `IQN` 名称或 `NVMe` 子系统的 `NQN`\n- 操作系统\n\n"
