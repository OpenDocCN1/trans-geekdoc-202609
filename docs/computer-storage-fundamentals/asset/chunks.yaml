- raw: 'On a file, storage data is stored and accessed using filename and its directory
    location over local area network (LAN) or wide area network (WAN). In file level
    storage, the storage space is configured to access files with a protocol such
    as Network File System (NFS) or Server Message Block (SMB) or Common Internet
    File System (CIFS).


    File storage system uses block storage internally with a local file system to
    store these files, and host server only has the access for reading and writing
    these files. File storage is deployed mainly in the environment where application
    requires to access data inside files or group of people require to store files
    such as documents, spreadsheets, presentations, audio, and image files in shared
    storage system.


    ![Figure 1.2: File storage](images/Fig_1.2.png)


    Figure 1.2: File storage


    Computer systems that access the files and folder on the file storage are called
    NAS clients. They can run an application to read and write data on to those files
    and other clients access the application over network. For example, hypervisor
    enabled operating system can host VMs on network attached storage (NAS) shares,
    and the client can access those VMs.


    ### Object storage


    Object storage is a relatively new type of storage system that stores data as
    objects along with metadata and unique identifier. This storage has primarily
    evolved in recent years to support storing mass amounts of unstructured data in
    cloud, big data and mobility. Data that is often stored as objects includes songs,
    images, and video clips. Some examples of object storage in the cloud are Amazon
    Simple Storage Service (S3), Azure Blob Storage, and Google Cloud Storage.


    ![Figure 1.3: Object storage](images/Fig_1.3.png)


    Figure 1.3: Object storage


    Representational State Transfer (REST) API over HTTP is used to transfer objects
    to and from a client system.


    ## Storage solutions


    The hardware and software components that make a solution store and protect digital
    data is called a storage solution. A storage solution has the following two primary
    components:


    •  Storage system: The storage system is a hardware device connected to computers
    through a network for storing the data. Storage disk array is an example of a
    storage system.


    ![Figure 1.4: Storage System](images/Fig_1.3a.png)


    Figure 1.4: Storage System


    •  Host server: Applications that run on these computer servers, perform read
    and write datastored on to the storage systems. This is also called application
    server, host computer or simply a host or server.


    ![Figure 1.5: Host Server](images/Fig_1.3b.png)


    Figure 1.5: Host Server


    A storage solution is formed by connecting one or more host servers to storage
    systems.


    ### Types of storage solutions


    Storage solutions are commonly categorized in two ways:


    *   Based on how storage systems are connected to host servers.


    *   Based on configuration and level of complexity of the deployed solution.


    The type of storage solution chosen by the organization is primarily driven by
    requirement. The selection of type of storage system for the solution and connectivity
    with host servers also follows accordingly.


    In the previous section, we learned that the three most popular storage system
    technologies are block storage, file storage, and object storage. Storage systems
    are also primarily identified based on these technologies.


    #### Storage area network


    Block storages are deployed in storage area network (SAN). Typically, SAN storage
    solutions are complex and expensive compared to other storage solutions. SAN is
    generally deployed in-house to host business critical applications that require
    high performance and data availability. Since block storages are generally connected
    in SAN, they are often referred as SAN storage. In SAN storage solution, file
    system is created within host server. Therefore different host servers with different
    operating system and file system can share the same storage system.


    #### Network attached storage


    File level storage deployed in Ethernet network environment. This solution is
    popularly called network attached storage (NAS) storage solution. Since files
    are stored on to the storage system, file system is created within it.


    ![Figure 1.6: NAS storage solution and SAN storage solution](images/Fig_1.4.png)


    Figure 1.6: NAS storage solution and SAN storage solution


    #### Direct attached storage


    In direct attached storage (DAS), disk storage is directly connected to host server.
    A DAS supports block access to data just like SAN. This solution is simple to
    manage and less expensive. Due to multiple limitations, not many companies use
    this storage much today. These limitations are primarily inefficiency of utilization
    disk space utilization by not sharing across multiple servers, no storage virtualization,
    and so on.


    Though this is a traditional storage solution, nowadays, this storage solution
    is becoming popular because of adoption of software defined storage, which is
    discussed in later chapters.


    ![Figure 1.7: DAS storage solution](images/Fig_1.5.png)


    Figure 1.7: DAS storage solution


    There are several models of DAS storage solution:


    *   Server with in-built internal disk enclosure.


    *   Server with external disk enclosure.


    *   Server with internal and external enclosures, both.


    DAS storage with internal built-in disk enclosure saves rack space and power.
    However, for additional disk space, external disk enclosures are needed to be
    attached to it.


    In DAS storage solution, disk storage, file system and application, all layers
    belong to the host server. For this reason, all resources are dedicated to single
    server, and sharing is not possible with other host servers.


    ![Figure 1.8: DAS stacks](images/Fig_1.6.png)


    Figure 1.8: DAS stacks


    #### All data finally stored as blocks


    Host servers or client systems access storage system via different protocols and
    store data differently. For example, a client system accesses a file storage to
    store files. This is because file storage is designed to communicate via CIFS
    or NFS protocol via IP network interface. Here, according to the client system’s
    perspective, data is stored as a file, but, within the file storage, files reside
    on the file system. File system within a file storage represents the set of data
    blocks on disk as the file to the client system, beneath the file system is storage
    blocks.


    Although the type of storage is determined by the interfaces and communication
    protocol designed for client or host servers, fundamentally every storage is a
    block storage.


    ![Figure 1.9: Data storing technologies](images/Fig_1.7.png)


    Figure 1.9: Data storing technologies


    #### Cloud storage


    Typically, large enterprise object storage systems are deployed in a data center
    and provided access to client computers and mobile devices stores their data on
    to it through the internet. This service model is called cloud storage.


    It is a great advantage for a user to access the data from anywhere in the world.
    In general, personal files such as pictures, videos, and archival data are stored
    in cloud storage, but not business critical application data, as it requires faster
    response time.


    ![Figure 1.10: Cloud storage](images/Fig_1.8.png)


    Figure 1.10: Cloud storage


    Cloud service provider ensures data availability to users by implementing various
    data protection solutions in the storage systems. Generally, service provider
    charges the user for this service.


    *   Storage solutions based on deployment:


    Storage solutions can also be classified based on configuration and level of complexity
    of the deployed solution:


    o Entry level storage solution:'
