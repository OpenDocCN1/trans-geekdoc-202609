  trans: "\n\n## 定义\n\n- **适配器管理软件**：允许用户更改 HBA 设置并监控其运行状况和连接性。\n- **GUI**：图形用户界面\n\
    - **CLI**：命令行界面\n- **RESTful API**：一种使用 HTTP 请求来 GET、PUT、POST 和 DELETE 数据的 API。\n\
    - **单一管理视图**：一个集成的管理显示控制台，显示所有存储解决方案组件。\n\n## 结束语\n\n正如本书开头所讨论的，存储系统中实现的每一项功能都会对容错、空间效率或性能产生影响。通常，现代存储系统都实现了所有这些功能，以提供最佳性能、容错能力以及空间效率，从而满足组织的业务需求。\n\
    \n![图 9.11：用于性能、容错和空间效率的存储功能](img/Fig_9.4.jpg)\n\n所有存储系统都实现了 RAID。除 RAID 0 外，所有其他\
    \ RAID 实现都以容错为代价导致存储空间损失。但还有其他功能，如精简配置、去重、压缩，有助于更高效地利用和共享空间。另一方面，多控制器、RAID、多路径有助于在控制器、磁盘驱动器或链路发生任何故障时避免访问存储上的数据。快照、克隆和复制有助于在本地或不同的存储系统上制作数据副本。\n\
    \n还有其他一些特性和功能有助于通过负载均衡、将数据临时复制到缓存区等方式来提高存储系统的性能。\n\n存储栈包含从物理磁盘到应用程序的多个硬件和软件组件。下图显示了\
    \ SAN 存储解决方案的所有存储栈层：\n\n![图 9.12：SAN 存储解决方案的存储栈层](img/Fig_9.5.png)\n\n所有这些硬件和软件组件集成在一起，构建了一个完整的存储解决方案。\n\
