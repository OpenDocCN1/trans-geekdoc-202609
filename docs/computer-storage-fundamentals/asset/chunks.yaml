    ## 文件存储


    在文件存储中，数据通过文件名及其目录位置在局域网（`LAN`）或广域网（`WAN`）上进行存储和访问。在文件级存储中，存储空间被配置为通过协议（如网络文件系统
    `NFS`、服务器消息块 `SMB` 或通用互联网文件系统 `CIFS`）来访问文件。


    文件存储系统在内部使用带有本地文件系统的块存储来存储这些文件，主机服务器仅拥有读取和写入这些文件的访问权限。文件存储主要部署在应用程序需要访问文件内部数据，或一群人需要在共享存储系统中存储文档、电子表格、演示文稿、音频和图像文件等场景中。


    ![Figure 1.2: File storage](img/Fig_1.2.png)


    图 1.2：文件存储


    访问文件存储上文件和文件夹的计算机系统称为 `NAS` 客户端。它们可以运行应用程序以读取和写入这些文件上的数据，其他客户端则通过网络访问该应用程序。例如，启用了虚拟化管理程序的操作系统可以在网络附属存储（`NAS`）共享上托管
    `VMs`，客户端可以访问这些 `VMs`。


    ## 对象存储


    对象存储是一种相对较新的存储系统类型，它将数据作为对象连同元数据和唯一标识符一起存储。这种存储主要在近几年发展起来，以支持在云、大数据和移动场景中存储海量非结构化数据。常作为对象存储的数据包括歌曲、图像和视频片段。云中对象存储的一些示例有
    Amazon Simple Storage Service（`S3`）、Azure Blob Storage 和 Google Cloud Storage。


    ![Figure 1.3: Object storage](img/Fig_1.3.png)


    图 1.3：对象存储


    基于 `HTTP` 的表述性状态传输（`REST`）`API` 用于在客户端系统之间传输对象。


    ## 存储解决方案


    构成解决方案以存储和保护数字数据的硬件和软件组件称为存储解决方案。存储解决方案具有以下两个主要组件：


    - **存储系统**：存储系统是通过网络连接到计算机用于存储数据的硬件设备。存储磁盘阵列是存储系统的一个例子。


    ![Figure 1.4: Storage System](img/Fig_1.3a.png)


    图 1.4：存储系统


    - **主机服务器**：在这些计算机服务器上运行的应用程序，对存储在存储系统上的数据执行读写操作。这也称为应用服务器、主机计算机，或简称为主机或服务器。


    ![Figure 1.5: Host Server](img/Fig_1.3b.png)


    图 1.5：主机服务器


    存储解决方案通过将一台或多台主机服务器连接到存储系统而形成。


    ### 存储解决方案的类型


    存储解决方案通常按两种方式分类：


    - 基于存储系统如何连接到主机服务器。

    - 基于部署解决方案的配置和复杂程度。


    组织选择的存储解决方案类型主要由需求驱动。解决方案中存储系统类型的选择及其与主机服务器的连接方式也随之确定。


    在上一节中，我们了解到三种最流行的存储系统技术是块存储、文件存储和对象存储。存储系统也主要基于这些技术进行识别。


    #### 存储区域网络


    块存储部署在存储区域网络（`SAN`）中。通常，`SAN` 存储解决方案与其他存储解决方案相比较为复杂且昂贵。`SAN` 通常部署在企业内部，用于托管需要高性能和高数据可用性的业务关键型应用程序。由于块存储通常在
    `SAN` 中连接，因此它们常被称为 `SAN` 存储。在 `SAN` 存储解决方案中，文件系统是在主机服务器内创建的。因此，具有不同操作系统和文件系统的不同主机服务器可以共享同一个存储系统。


    #### 网络附属存储


    文件级存储部署在以太网网络环境中。该解决方案通常称为网络附属存储（`NAS`）存储解决方案。由于文件存储在存储系统上，文件系统是在其中创建的。


    ![Figure 1.6: NAS storage solution and SAN storage solution](img/Fig_1.4.png)


    图 1.6：NAS 存储解决方案和 SAN 存储解决方案


    #### 直连存储


    在直连存储（`DAS`）中，磁盘存储直接连接到主机服务器。`DAS` 支持对数据的块访问，就像 `SAN` 一样。该解决方案易于管理且成本较低。由于多种限制，如今不太多公司大量使用这种存储。这些限制主要是磁盘空间利用率低效（因无法跨多台服务器共享）、无存储虚拟化等。


    尽管这是一种传统的存储解决方案，但如今，由于软件定义存储的采用（将在后续章节讨论），这种存储解决方案正变得流行起来。


    ![Figure 1.7: DAS storage solution](img/Fig_1.5.png)


    图 1.7：DAS 存储解决方案


    `DAS` 存储解决方案有几种模型：


    - 带有内置内部磁盘机箱的服务器。

    - 带有外部磁盘机箱的服务器。

    - 同时具有内部和外部机箱的服务器。


    带有内置内部磁盘机箱的 `DAS` 存储可节省机架空间和电力。然而，对于额外的磁盘空间，需要连接外部磁盘机箱。


    在 `DAS` 存储解决方案中，磁盘存储、文件系统和应用程序所有层都属于主机服务器。因此，所有资源专用于单台服务器，无法与其他主机服务器共享。


    ![Figure 1.8: DAS stacks](img/Fig_1.6.png)


    图 1.8：DAS 协议栈


    #### 所有数据最终都以块形式存储


    主机服务器或客户端系统通过不同的协议访问存储系统，并以不同方式存储数据。例如，客户端系统访问文件存储来存储文件。这是因为文件存储设计为通过 `IP` 网络接口使用
    `CIFS` 或 `NFS` 协议进行通信。在这里，从客户端系统的角度来看，数据作为文件存储；但在文件存储内部，文件驻留在文件系统上。文件存储中的文件系统将磁盘上的一组数据块作为文件呈现给客户端系统，文件系统之下是存储块。


    尽管存储类型由为客户端或主机服务器设计的接口和通信协议决定，但从根本上说，每种存储都是块存储。


    ![Figure 1.9: Data storing technologies](img/Fig_1.7.png)


    图 1.9：数据存储技术


    #### 云存储


    通常，大型企业对象存储系统部署在数据中心，并通过互联网为客户端计算机和移动设备提供访问权限以存储其数据。这种服务模式称为云存储。


    用户能够从世界任何地方访问数据，这是一大优势。通常，个人文件（如图片、视频和归档数据）存储在云存储中，但业务关键型应用程序数据一般不存储于此，因为后者需要更快的响应时间。


    ![Figure 1.10: Cloud storage](img/Fig_1.8.png)


    图 1.10：云存储


    云服务提供商通过在存储系统中实施各种数据保护解决方案，确保用户的数据可用性。通常，服务提供商会向用户收取该服务的费用。


    #### 基于部署的存储解决方案


