  trans: "\n\n## 案例研究 1：用户主目录的存储解决方案\n\n让我们来看看用户主目录的存储解决方案：\n\n### 需求\n\n贵公司约有 1,000\
    \ 名员工。每位员工在笔记本电脑和台式机上平均拥有 7 到 8GB 的文件，如演示文稿、电子表格、Word 文档和 PDF 文档。公司计划部署一个存储解决方案来整合并集中管理这些文件。请描述适合此需求的存储解决方案。\n\
    \n### 分析\n\n由于需求仅是存储文件，中端 NAS 解决方案将是最合适的解决方案。可建议存储系统采用 10GB 网络速度，以实现多用户的快速可靠访问。当前的文件存储需要约\
    \ `1000 x 10GB =~ 10TB` 的可用容量。考虑到未来增长，建议至少配备两倍于此存储大小的容量。\n\n### 解决方案\n\n需要采购约\
    \ 20TB 可用空间的文件存储来部署 NAS 解决方案。所有员工均可通过以太网网络访问存储系统。拟议存储解决方案的示意图如下所示：\n\n存储类型：文件存储\n\
    \n存储解决方案：中端 NAS 解决方案\n\n可用容量：20TB\n\n访问带宽：10GB/s\n\n每位员工的空间配额：20GB\n\n![图 1.17：用户主目录的存储解决方案](img/Fig_1.15.png)\n\
    \n图 1.17：用户主目录的存储解决方案\n\n## 案例研究 2：集群主机服务器解决方案上的 MSSQL 数据库应用\n\n让我们来看看集群主机服务器解决方案上的\
    \ MSSQL 数据库应用：\n\n### 需求\n\n某组织希望从独立 DAS 解决方案上的遗留数据库应用迁移到高可用集群主机服务器环境中的 MSSQL\
    \ 应用。数据库大小约为 30TB，请描述适合此需求的存储解决方案。\n\n### 分析\n\n要运行数据库应用，主机服务器需要更快地访问存储系统。从性能角度来看，中端\
    \ SAN 解决方案将是最合适的解决方案。集群中的主机服务器也可以共享存储系统的空间。考虑到未来增长，建议采用 50TB 容量的存储。\n\n### 解决方案\n\
    \n需要采购约 50TB 可用空间的块存储。要部署 SAN 解决方案，还需要为主机服务器采购 FC HBA、FC 交换机以及线缆和连接器。拟议存储解决方案的示意图如下：\n\
    \n存储类型：块存储\n\n存储解决方案：中端 SAN 解决方案\n\n可用容量：50TB\n\n![图 1.18：主机服务器集群的存储解决方案](img/Fig_1.16.png)\n\
    \n图 1.18：主机服务器集群的存储解决方案\n\n## 案例研究 3：用于测试和开发目的的虚拟机\n\n让我们来看看用于测试和开发目的的虚拟机：\n\n\
    ### 需求\n\n某软件供应商希望为其员工部署虚拟机，用于测试和开发活动。共有约 500 名员工，工作区大小约为 100GB。请描述适合此需求的存储解决方案。\n\
    \n### 分析\n\n部署虚拟机的最佳存储解决方案是 HCI。超融合系统预装、预配置并经过调优，可用于部署虚拟机。\n\n该系统在空间和功耗方面也很高效。初始容量需求约为\
    \ `500 x 100GB =~ 50TB`。\n\n### 解决方案\n\n可采购约 50TB 空间的高端超融合系统来部署 HCI 环境。如果供应商不支持在单个超融合系统上运行\
    \ 500 个虚拟机，则可采购多个超融合系统并将它们组成集群，以实现负载均衡，并在发生任何系统故障时实现虚拟机故障转移。\n\n## 学习检查\n\n###\
    \ 客观题\n\n1. 存储的能力主要通过以下哪项衡量：\n\n   a. 容错性\n\n   b. 性能\n\n   c. 空间效率\n\n   d. 以上全部\n\
    \n2. 专用 NAS 操作系统需要哪两个子组件？（选择两项）\n\n   a. 文件系统\n\n   b. 用户界面\n\n   c. 进程调度器\n\n\
    \   d. 通信协议\n\n3. 哪种类型的存储提供卓越的性能：\n\n   a. DAS\n\n   b. NAS\n\n   c. SAN\n\n \
    \  d. 以上全部\n\n4. 从以下列表中，DAS 的主要缺点是什么？\n\n   a. 可扩展性\n\n   b. 成本\n\n   c. 可管理性\n\
    \n   d. 以上全部\n\n5. 云存储服务最适用于：\n\n   a. 业务关键型应用数据\n\n   b. 个人数据——照片、视频\n\n   c.\
    \ OLTP 工作负载\n\n   d. 以上全部\n\n6. 根据其关联性排列这些术语：\n\n   块存储、对象存储、SAN、DAS、云、入门级存储解决方案、高性能、低成本、可扩展。\n\
    \n   a. 块存储 – SAN - 高性能；对象存储 – DAS – 高性能；块存储 – DAS – 云\n\n   b. 块存储 – DAS - 高性能；对象存储\
    \ – 云 - 可扩展；块存储 – DAS – 低成本\n\n   c. 块存储 – 云 - 可扩展；对象存储 – SAN – 高性能；块存储 – DAS\
    \ – 入门级存储解决方案\n\n   d. 块存储 – SAN - 高性能；对象存储 – 云 - 可扩展；块存储 – DAS – 入门级存储解决方案\n\n\
    7. 超融合是一种紧密集成以下内容的基础设施系统：\n\n   a. 计算\n\n   b. 存储\n\n   c. 网络\n\n   d. 以上全部\n\n\
    8. 超融合产品可以构建在：\n\n   a. 专用存储阵列\n\n   b. 厂商专用硬件\n\n   c. 通用服务器硬件\n\n   d. 硬盘驱动器\n\
    \n9. 哪种存储包含文件系统层：\n\n   a. DAS\n\n   b. NAS\n\n   c. SAN\n\n   d. 以上全部\n\n###\
    \ 简答题\n\n1. 描述 SAN、NAS 和 DAS 存储解决方案的优缺点。\n\n2. 解释对象存储的用例以及部署这种存储的存储解决方案。\n\n3.\
    \ 描述存储系统的类型及其在相关解决方案中的用途。\n\n4. 解释数据在存储系统中最终如何作为块存储。\n\n### 测验题\n\n1. 虽然有不同类型的存储系统，即块、文件和对象存储，但存储系统中的数据最终是否总是作为块存储的？\n\
    \n2. 在 NAS 存储解决方案中，文件系统位于何处？\n\n3. 超融合是存储系统的整合还是存储解决方案的整合？\n\n## 术语表和关键术语\n\n\
    - **主机**：运行应用程序并访问存储卷以存储数据的服务器。也是存储系统中代表主机服务器的逻辑实体。虚拟卷被提供访问权限。\n\n- **主机服务器**：访问存储系统以存储数据并对存储系统执行\
    \ I/O 操作的应用服务器。\n\n- **客户端系统**：类似于主机服务器，但访问存储系统上的文件或对象。它不为其他计算机提供服务。\n\n- **存储系统**：连接到存储控制器的磁盘池，用于存储数据并处理来自主机服务器的\
    \ I/O 请求。\n\n- **块存储**：主机服务器跨块读取和写入数据的存储系统类型。\n\n- **文件存储**：客户端系统在其上读取和写入共享文件的存储系统类型。\n\
    \n- **对象存储**：允许客户端系统将数据作为对象存储的存储系统类型。对象包含数据以及元数据和唯一标识符。\n\n- **SAN**：SAN，存储设备和发起程序的网络，用于存储和检索数据。\n\
    \n- **NAS**：NAS，包含文件系统的存储系统。客户端通过网络访问存储在该存储上的文件。\n\n- **DAS**：DAS，直接连接到主机计算机的存储。\n\
    \n- **存储解决方案**：存储解决方案由主机服务器、存储系统、交换机、HBA、线缆和连接器以及存储管理软件组成，为组织存储应用程序数据提供解决方案。\n\
    \n- **云存储**：通常部署多个对象存储并连接到互联网。包括移动设备、平板电脑、PC 在内的所有客户端计算机均可访问该存储以将数据作为对象存储。\n\n"
