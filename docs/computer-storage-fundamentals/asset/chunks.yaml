    \ between only one target port and one initiator port, then only one path would\
    \ be available for server to access LUN.\n\n`Number of paths = Number of paths\
    \ from host server to switch X Number of paths from storage system to switch.`\n\
    \nAll modern operating systems have multipath driver in-built into it. Previously\
    \ storage vendor used to supply multipath application for each operating system.\
    \ There are still some storage vendors who develop and sell multipath as a separate\
