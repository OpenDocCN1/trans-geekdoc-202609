    ## Descriptive questions


    1. Explain different type of SAN topologies and their pros and cons.

    2. Describe purpose and benefits of zoning.

    3. Why do we need single device appearance in operating system when there are
    multiple paths exist?

    4. Describe all levels of configuration and restrictions of storage LUN access
    by host server.


    ## Quiz questions


    1. Physical cabling between a storage system and host server is done to get total
    8 paths for each LUN. Is it possible to configure zoning to increase number of
    paths to 16?

    2. Is multipath implemented only to have NSOF solution?

    3. Is LUN masking configured at host side?

    4. State the formula to determine total number of paths for storage device, when
    number of from host and storage to switch is known?


    ## Glossary and key terms


    - **No single point of failure (NSPOF)**: A storage solution configured in such
    a way that one hardware or link failure would not impact I/O operation of the
    storage system

    - **Multipath**: Two or more data path between host server and storage system.
    Multipath gets created based on how cables are connected between host server and
    storage via a switch and how ports are zoned.

    - **Load balance policies**: Various policies provided by multipath driver in
    the operating. Based on requirements, this user configurable polices directs paths
    utilization by the I/O requests.

    - **LUN masking**: Storage system functionality to configure and restriction virtual
    volume access to host servers

    - **Zoning**: Logical partition with SAN fabric for better management, security
    and performance

    - **Hard zoning**: Physically blocking access to a zone from any device outside
    of the zone.

    - **Soft zoning**: Filtering out a device from zone just prevent visibility in
    it.


    # CHAPTER 6: Storage Performance


    ## Introduction


    The storage system is not only used to store data, but it is important how fast
    application can write and read the data. Therefore, storage performance is an
    important aspect of all storage systems. All storage vendors put significant effort
    to enhance their storage systems and as well as the solutions to get faster access
    to the data. Several features are implemented to ensure data can be accessed as
    fast as possible from a storage system.


    Although some of the features, such as controller operation mode, caching techniques,
    multipathing, RAID levels, let us recap those feature briefly in this chapter
    on how these impacts storage performances.


    **Multipath**: Unlike the above three features within a storage system, multipath
    is an operating system level intelligence that can determine and distribute the
    I/O requests across all available paths between the storage system and host system.
    Multipath gets created based on the number of cables connected and zoned. Multipath
    also has a great impact on performance, especially if each path does not have
    much bandwidth to support the host server’s demand and storage system’s capability.


    ![Figure 6.1: Multipath solution](`images/Fig_6.1.jpg`)


    Figure 6.1: Multipath solution


    **Controller operating mode**: In [`Chapter 3`](#ch03.xhtml), Storage Disk Array,
    we learned the different mode of controller operations, such as active/passive,
    Active-Active. Most storage vendors make storage system with two or more controllers,
    with the maximum of eight controllers. If all controllers operate at the same
    time in parallel, the storage system can process this should come together request
    pretty fast. Therefore multiple controllers in a storage system have added advantages
    to enhance the performance.


    **Caching techniques**: Physical disk drives are much slower than cache memory
    DIMM in the storage system. Therefore, for write operation data is temporarily
    stored in high-speed and faster accessible memory DIMM. Later point in time, data
    is flashed into the disk for permanent storage. because of this technique, host
    server receives a faster response from storage system while writing data. Similarly,
    for reading storage systems can intelligently predict next data to be read, it
    read beforehand from disk keeps in the cache memory.


    **Disk Enclosures with dual path**: Disk enclosures, connected to the backend
    of the storage controller, are designed to have two paths to transfer data more
    efficiently to and from physical disks.


    ![Figure 6.2: Disk enclosures with dual paths](`images/Fig_6.2.jpg`)


    Figure 6.2: Disk enclosures with dual paths


    **RAID level**: As discussed in [`Chapter 3`](#ch03.xhtml), Storage Disk Array,
    there are RAID levels, for example, RAID 0 and RAID 1+0 that stripes and mirrors
    the data and involves more number of disk in parallel to improve the performance.


    ![Figure 6.3: RAID implementation](`images/Fig_6.3.png`)


    Figure 6.3: RAID implementation


    **Physical disk count and type**: Virtual RAID implementation in modern storage
    system enables the involvement of all physical disks for read/write operations,
    thus enhances performance drastically. Therefore, storage system having hundreds
    of physical disks perform much faster, compared to a system with just a few tens
    of drives.


    Type of disks also plays a major role in storage performance. There three type
    of disks used in storage system today are SSD, SAS, and SATA. SATA drives are
    typically low cost, 7.2K RPM and known for high capacity and efficient power consumption.
    Mainly used for data archival purpose. SAS drives more reliable, high-speed, 15K
    RPM, and used for business-critical enterprise applications. Seek times approximately
    two times faster than SATA drive. SSD drives known for performance, offer up to
    100 times faster than traditional hard drives, as there are no moving parts and
    seek time is near to zero.


    ## Structure


    At the end of this chapter you will learn the following:


    - Storage performance basics

    - Measuring storage performance

    - Storage system features that enhance performance


    ## Objectives


    In this chapter, you will learn about storage performance basics that include
    the definition of key factors to measure storage performance. How to determine
    whether storage is performing slow or faster? You will also learn about the important
    features which are implemented within a storage system to enhance the performance.


    ## Performance terminologies


    Storage performance is measured primarily with load and the delay. I/O the storage
    is processing in per unit time. There are primarily two ways to measure load:


    - **Throughput**: Number of jobs (usually I/O requests) completed per unit time
    (usually per second). In other words, the number of I/O requests processed per
    unit time. Unit to measure throughput is I/O per sec (IOPS). Some storage vendors
    refer throughput directly as IOPS.

    - **Data transfer rate**: Amount of data being transferred between two systems,
    per unit time. Unit to measure data transfer rate is KBps, MBps, GB/h, and so
    on. It is also known as bandwidth. Some storage vendors also refer it as throughput.


    In the following figure, throughput = 5 IOPS and data transfer rate = 7 MBps.


    ![Figure 6.4: Data transfer rate and throughput](`images/Fig_6.4.jpg`)


    Figure 6.4: Data transfer rate and throughput


    If all I/O transfer length (request size) are equal, then Throughput can be derived
    from data transfer rate and vice versa.


    `Data transfer rate = Throughput X Average I/O size`


    **Delay**: Indicates how much trouble the array is going through, to process the
    request, in other words, how much time it is taking to complete each request.
    This is a measure of how fast a storage system responds to read and write requests.
    Storage serving faster I/O is considered to be high performing storage; therefore
    latency is expected to be as low as possible.


    **Latency**: Time is taken to complete a single I/O operation. This is also known
    as response time or service time. This is typically measured in milliseconds (ms).

