- raw: "#### Solution\n\nFrom Linux Kernel version 2.6 onward, following command shows\
    \ list of WWPN for the adapters available in the host server:\n\n| \\[root@DV-S563\
    \ ~\\]# cat /sys/class/fc\\_host/host?/port\\_name0x100070106fe8776f\\[root@DV-S563\
    \ ~\\]# |\n\n| --- |\n\nThese example commands are to bring more clarity on the\
    \ concept discussed in the earlier part of this chapter. Output may vary depending\
    \ on the environment, software component versions and configuration.\n\nDevice\
    \ mapped multipath software component is needed to be installed in host, if not\
    \ installed already.\n\n![Figure 5.14: Host server in SAN environment](images/Fig_5.14.jpg)\n\
    \nFigure 5.14: Host server in SAN environment\n\nList of available paths for all\
    \ the devices:\n\n| \\[root@DV-S563 ~\\]# multipath -llmpatha (360002ac0000000000d00728e000184eb)\
    \ dm-2Vendorname,Virtual Volumesize=20G features='1 queue\\_if\\_no\\_path' hwhandler='0'\
    \ wp=rw\\`-+- policy='round-robin 0' prio=1 status=active|- 3:0:0:0 sdb 8:16 active\
    \ ready running\\`- 3:0:1:0 sdd 8:48 active ready runningmpathb (360002ac0000000000d007290000184eb)\
    \ dm-3Vendorname,Virtual Volumesize=30G features='1 queue\\_if\\_no\\_path' hwhandler='0'\
    \ wp=rw\\`-+- policy='round-robin 0' prio=1 status=active|- 3:0:0:1 sdc 8:32 active\
    \ ready running\\`- 3:0:1:1 sde 8:64 active ready running\\[root@DV-S563 ~\\]#\\\
    [root@DV-S563 ~\\]# lsscsi\\[1:0:0:0\\] cd/dvd NECVMWar VMware IDE CDR10 1.00\
    \ /dev/sr0\\[2:0:0:0\\] disk VMware Virtual disk 1.0 /dev/ |\n\n| --- |\n\n| sda\\\
    [3:0:0:0\\] disk Vendorname Virtual Volume2.0 /dev/sdb\\[3:0:0:1\\] disk Vendorname\
    \ Virtual Volume2.0 /dev/sdc\\[3:0:0:254\\] enclosu Vendorname SES 2.0 -\\[3:0:1:0\\\
    ] disk Vendorname Virtual Volume2.0 /dev/sdd\\[3:0:1:1\\] disk Vendorname Virtual\
    \ Volume2.0 /dev/sde\\[3:0:1:254\\] enclosu Vendorname SES 2.0 -\\[root@DV-S563\
    \ ~\\]# |\n\n| \\[root@DV-S563 ~\\]# lsblkNAME MAJ:MIN RM SIZE RO TYPEMOUNTPOINTsr0\
    \ 11:0 1 1024M 0 romsda 8:0 0 30G 0 disk├─sda1 8:1 0 500M 0 part /boot└─sda2 8:2\
    \ 0 29.5G 0 part├─vg\\_b2host1-lv\\_root (dm-0) 253:0 0 25.6G 0 lvm /└─vg\\_b2host1-lv\\\
    _swap (dm-1) 253:1 0 4G 0 lvm\\[SWAP\\]sdb 8:16 0 20G 0 disk└─mpatha (dm-2) 253:2\
    \ 0 20G 0 mpathsdc 8:32 0 20G 0 disk└─mpathb (dm-3) 253:3 0 20G 0 mpathsdd 8:48\
    \ 0 20G 0 disk└─mpatha (dm-2) 253:2 0 20G 0 mpathsde 8:64 0 20G 0 disk└─mpathb\
    \ (dm-3) 253:3 0 20G 0 mpath\\[root@DV-S563 ~\\]#\\[root@DV-S563 ~\\]# ls /dev/mapper/\\\
    * | grep -i /dev/mapper/m/dev/mapper/mpatha/dev/mapper/mpathb\\[root@DV-S563 ~\\\
    ]# |\n\nThe first virtual volume of size 20 GB with LUN ID 0 has been assigned\
    \ with device file /dev/mapper/mpatha, underlying devices / dev/sdb and /dev/sdd.\
    \ The path corresponds to /dev/sdb is via Controller 0 as the Target ID of \\\
    [H:C:T:L\\] = \\[3:0:0:0\\] is 0. The path corresponds to /dev/sdd is via Controller\
    \ 1, as the Target ID of \\[3:0:1:0\\] is 1.\n\nSimilarly, the second virtual\
    \ volume of size 30 GB with LUN ID 1 has been assigned the device file /dev/mapper/mpathb,\
    \ underlying devices /dev/sdc and /dev/sde.\n\n## Learning check\n\n### Objective\
    \ question\n\n 1. A customer bought storage with a controller pair, each controller\
    \ has only single host port. He wants have 4 path for each LUN of that storage.\
    \ What would be your solution?\n\n a. Not possible\n\n b. Install one single ported\
    \ HBA in server and connect it to same fabric where both storage host ports are\
    \ also connected\n\n c. Install two single ported HBAs in server and connect them\
    \ to same fabric where both storage host ports are also connected\n\n d. Install\
    \ two single ported HBAs in server and connect them to two different fabrics where\
    \ each of storage host ports are connected\n\n 2. Number of paths from server\
    \ to a device can be controlled by:\n\n a. Changing physical cabling (Server–switch–storage)\n\
    \n b. Changing zone configuration\n\n c. Changing number of HBA in the server\n\
    \n d. Any of the above\n\n 3. Number of paths to a device can be controlled by:\n\
    \n a. Changing physical cabling between server and switch\n\n b. Changing physical\
    \ cabling between switch and storage\n\n c. Any of the above\n\n 4. LUN is showing\
    \ total 8 paths to storage via fabric. Storage has two controllers, each controller\
    \ has 4 ports. All ports are connected to a fabric. No zone configuration. How\
    \ many HBA the server has?\n\n a. 8\n\n b. 4\n\n c. 2\n\n d. 1\n\n 5. A server\
    \ with two single-ported HBAs connected to storage via fabric. Storage has two\
    \ controllers, each controller has 4 ports. All storage ports are connected to\
    \ a fabric. No zone configuration. One of the cables from storage to switch is\
    \ faulty. How many paths would you expect for each LUN presented from storage\
    \ to this server?\n\n a. 16\n\n b. 14\n\n c. 12\n\n d. 10\n\n 6. A server with\
    \ two single-ported HBAs connected to storage via fabric. Storage has two controllers,\
    \ each controller has 4 ports. All storage ports are connected to a fabric. No\
    \ zone configuration. One of the FC cables from server to switch is faulty. How\
    \ many paths would you expect for each LUN presented from storage to the server?\n\
    \n a. 16\n\n b. 8\n\n c. 4\n\n d. 2\n\n 7. Inter-switch link (ISL) is:\n\n a.\
    \ Connection between servers to switch\n\n b. Connection between switch to storage\n\
    \n c. Connection between switches\n\n d. Connection between servers to storage\n\
    \n 8. SAN might contain both heterogeneous servers and heterogeneous storage:\n\
    \n a. True\n\n b. False\n\n 9. Which component initiate initialization to FC devices?\n\
    \n a. HBA\n\n b. Disk array\n\n c. SAN management\n\n d. SAN switch\n\n 10. Multipath\
    \ I/O is (Choose two):\n\n a. A fault tolerant technique\n\n b. A scalable technique\n\
    \n c. A cost effective solution\n\n d. A performance improvement technique\n\n\
    \ 11. Multipath I/O is:\n\n a. More than one I/O requests, even via single physical\
    \ path between the CPU in the computer systems and its main storage devices\n\n\
    \ b. More than one logical path between the CPU in the computer systems and its\
    \ main storage devices through zoning, storage virtualization\n\n c. More than\
    \ one physical path between the CPU in the computer systems and its main storage\
    \ devices through the buses, controllers, switches and other bridge devices connecting\
    \ them\n\n d. More than one storage devices between the CPU in the computer systems\
    \ and storage disk Array\n\n 12. What are the two major classification of zoning?\n\
    \n a. Software zoning\n\n b. Hardware zoning\n\n c. WWN zoning\n\n d. Port zoning\n\
    \n 13. Zoning is (Choose two):\n\n a. Fabric management service to enable communication\
    \ between switches\n\n b. Fabric management service that can be used to create\
    \ logical subsets of devices within a SAN\n\n c. This enables portioning of resources\
    \ for management and access control purpose.\n\n d. To monitor health of devices\
    \ connected to fabric\n\n 14. Two separate FC switches are having a zone set configured\
    \ in them. An ISL is now cabled between the 2 switches. Both the switches contain\
    \ a zone with the same zone name, but the members of the zone are different in\
    \ the two switches. Which of the following statements is true after an ISL is\
    \ attempted between the 2 switches?\n\n a. The active zone set between the 2 switches\
    \ is successfully merged and the ISL is established.\n\n b. The active zone set\
    \ between the 2 switches cannot be merged and the ISL is isolated.\n\n 15. LUN\
    \ Masking is method to create:\n\n a. A LUN\n\n b. Access control to a LUN\n\n\
    \ c. More number of LUNs\n\n d. Replication between two LUNs\n\n 16. Match the\
    \ following:\n\ni. Zoning 1. Host server\n\nii. Multipath 2. Switch\n\niii. LUN\
    \ masking 3. Storage system\n\n a. (i) - (1), (iii) - (2) and (ii) - (3)\n\n b.\
    \ (i) - (1), (ii) - (2) and (iii) - (3)\n\n c. (ii) - (1), (i) - (2) and (iii)\
    \ - (3)\n\n d. (ii) - (1), (iii) - (2) and (i) - (3)\n\n 17. Which one of the\
    \ following list is the default load balancing policy in most multipath driver:\n\
    \n a. Round robin (RR)\n\n b. Shortest queue requests (SQR)\n\n c. Shortest queue\
    \ bytes (SQB)\n\n d. Shortest queue service time (SQST)\n\n 18. Match the following:\n\
    \ni. Single switch fabric topology 1. Mid-range storage solution\n\nii. Mesh topology\
    \ 2. Entry level storage solution\n\niii. Core-edge topology 3. Enterprise storage\
    \ solution\n\n a. (i) - (1), (iii) - (2) and (ii) - (3)\n\n b. (i) - (1), (ii)\
    \ - (2) and (iii) - (3)"
  fmt: "\n## Solution\n\n从 Linux 内核版本 2.6 开始，以下命令显示主机服务器中可用适配器的 WWPN 列表：\n\n```\n\
    [root@DV-S563 ~]# cat /sys/class/fc_host/host?/port_name\n0x100070106fe8776f\n\
    [root@DV-S563 ~]#\n```\n\n这些示例命令旨在阐明本章前面部分讨论的概念。输出可能因环境、软件组件版本和配置而异。\n\n如果主机中尚未安装设备映射多路径软件组件，则需要安装它。\n\
    \n![Figure 5.14: Host server in SAN environment](images/Fig_5.14.jpg)\n\n**Figure\
    \ 5.14: Host server in SAN environment**\n\n所有设备的可用路径列表：\n\n```\n[root@DV-S563\
    \ ~]# multipath -ll\nmpatha (360002ac0000000000d00728e000184eb) dm-2 Vendorname,Virtual\
    \ Volume\nsize=20G features='1 queue_if_no_path' hwhandler='0' wp=rw\n`-+- policy='round-robin\
    \ 0' prio=1 status=active\n  |- 3:0:0:0 sdb 8:16 active ready running\n  `- 3:0:1:0\
    \ sdd 8:48 active ready running\nmpathb (360002ac0000000000d00729000184eb) dm-3\
    \ Vendorname,Virtual Volume\nsize=30G features='1 queue_if_no_path' hwhandler='0'\
    \ wp=rw\n`-+- policy='round-robin 0' prio=1 status=active\n  |- 3:0:0:1 sdc 8:32\
    \ active ready running\n  `- 3:0:1:1 sde 8:64 active ready running\n[root@DV-S563\
    \ ~]#\n[root@DV-S563 ~]# lsscsi\n[1:0:0:0]    cd/dvd  NECVMWar VMware IDE CDR10\
    \ 1.00  /dev/sr0\n[2:0:0:0]    disk    VMware  Virtual disk 1.0   /dev/sda\n[3:0:0:0]\
    \    disk    Vendorname Virtual Volume 2.0  /dev/sdb\n[3:0:0:1]    disk    Vendorname\
    \ Virtual Volume 2.0  /dev/sdc\n[3:0:0:254]  enclosu Vendorname SES 2.0  -\n[3:0:1:0]\
    \    disk    Vendorname Virtual Volume 2.0  /dev/sdd\n[3:0:1:1]    disk    Vendorname\
    \ Virtual Volume 2.0  /dev/sde\n[3:0:1:254]  enclosu Vendorname SES 2.0  -\n[root@DV-S563\
    \ ~]#\n```\n\n```\n[root@DV-S563 ~]# lsblk\nNAME                      MAJ:MIN\
    \ RM  SIZE RO TYPE  MOUNTPOINT\nsr0                      11:0    1 1024M  0 rom\n\
    sda                       8:0    0   30G  0 disk\n├─sda1                    8:1\
    \    0  500M  0 part  /boot\n└─sda2                    8:2    0 29.5G  0 part\n\
    \  ├─vg_b2host1-lv_root  253:0    0 25.6G  0 lvm   /\n  └─vg_b2host1-lv_swap \
    \ 253:1    0    4G  0 lvm   [SWAP]\nsdb                       8:16   0   20G \
    \ 0 disk\n└─mpatha                253:2    0   20G  0 mpath\nsdc             \
    \          8:32   0   20G  0 disk\n└─mpathb                253:3    0   20G  0\
    \ mpath\nsdd                       8:48   0   20G  0 disk\n└─mpatha          \
    \      253:2    0   20G  0 mpath\nsde                       8:64   0   20G  0\
    \ disk\n└─mpathb                253:3    0   20G  0 mpath\n[root@DV-S563 ~]#\n\
    [root@DV-S563 ~]# ls /dev/mapper/* | grep -i mpath\n/dev/mapper/mpatha\n/dev/mapper/mpathb\n\
    [root@DV-S563 ~]#\n```\n\n第一个大小为 20 GB、LUN ID 为 0 的虚拟卷已分配设备文件 `/dev/mapper/mpatha`，底层设备为\
    \ `/dev/sdb` 和 `/dev/sdd`。对应 `/dev/sdb` 的路径通过 Controller 0，因为 `[H:C:T:L]` = `[3:0:0:0]`\
    \ 的 Target ID 为 0。对应 `/dev/sdd` 的路径通过 Controller 1，因为 `[3:0:1:0]` 的 Target ID\
    \ 为 1。\n\n同样，第二个大小为 30 GB、LUN ID 为 1 的虚拟卷已分配设备文件 `/dev/mapper/mpathb`，底层设备为 `/dev/sdc`\
    \ 和 `/dev/sde`。\n\n## Learning Check\n\n### Objective Questions\n\n1. 某客户购买了一套带有控制器对的存储，每个控制器仅有一个主机端口。他希望该存储的每个\
    \ LUN 都有 4 条路径。你的解决方案是什么？\n\n   a. 不可能  \n   b. 在服务器中安装一个单端口 HBA，并将其连接到两个存储主机端口所在的同一个结构中\
    \  \n   c. 在服务器中安装两个单端口 HBA，并将它们连接到两个存储主机端口所在的同一个结构中  \n   d. 在服务器中安装两个单端口 HBA，并将它们连接到两个不同的结构中，每个存储主机端口分别连接到不同的结构\n\
    \n2. 从服务器到设备的路径数量可以通过以下方式控制：\n\n   a. 更改物理布线（服务器–交换机–存储）  \n   b. 更改分区配置  \n \
    \  c. 更改服务器中的 HBA 数量  \n   d. 以上任一方式\n\n3. 到设备的路径数量可以通过以下方式控制：\n\n   a. 更改服务器和交换机之间的物理布线\
    \  \n   b. 更改交换机和存储之间的物理布线  \n   c. 以上任一方式\n\n4. LUN 通过结构显示到存储的总共 8 条路径。存储有两个控制器，每个控制器有\
    \ 4 个端口。所有端口都连接到一个结构。无分区配置。服务器有多少个 HBA？\n\n   a. 8  \n   b. 4  \n   c. 2  \n \
    \  d. 1\n\n5. 一台配有两个单端口 HBA 的服务器通过结构连接到存储。存储有两个控制器，每个控制器有 4 个端口。所有存储端口都连接到一个结构。无分区配置。从存储到交换机的一根线缆故障。预期从存储呈现给该服务器的每个\
    \ LUN 有多少条路径？\n\n   a. 16  \n   b. 14  \n   c. 12  \n   d. 10\n\n6. 一台配有两个单端口\
    \ HBA 的服务器通过结构连接到存储。存储有两个控制器，每个控制器有 4 个端口。所有存储端口都连接到一个结构。无分区配置。从服务器到交换机的一根 FC\
    \ 线缆故障。预期呈现给服务器的每个 LUN 有多少条路径？\n\n   a. 16  \n   b. 8  \n   c. 4  \n   d. 2\n\n\
    7. 交换机间链路（ISL）是：\n\n   a. 服务器到交换机的连接  \n   b. 交换机到存储的连接  \n   c. 交换机之间的连接  \n\
    \   d. 服务器到存储的连接\n\n8. SAN 可能同时包含异构服务器和异构存储：\n\n   a. 正确  \n   b. 错误\n\n9. 哪个组件发起对\
    \ FC 设备的初始化？\n\n   a. HBA  \n   b. 磁盘阵列  \n   c. SAN 管理  \n   d. SAN 交换机\n\n10.\
    \ 多路径 I/O 是（选择两项）：\n\n    a. 一种容错技术  \n    b. 一种可扩展技术  \n    c. 一种具有成本效益的解决方案\
    \  \n    d. 一种性能改进技术\n\n11. 多路径 I/O 是：\n\n    a. 即使通过计算机系统中的 CPU 与其主存储设备之间的单个物理路径，也有多个\
    \ I/O 请求  \n    b. 通过分区、存储虚拟化，在计算机系统中的 CPU 与其主存储设备之间有多个逻辑路径  \n    c. 通过连接它们的总线、控制器、交换机和其他桥接设备，在计算机系统中的\
    \ CPU 与其主存储设备之间有多个物理路径  \n    d. 计算机系统中的 CPU 与存储磁盘阵列之间有多个存储设备\n\n12. 分区的两大主要分类是什么？\n\
    \n    a. 软件分区  \n    b. 硬件分区  \n    c. WWN 分区  \n    d. 端口分区\n\n13. 分区是（选择两项）：\n\
    \n    a. 用于启用交换机间通信的结构管理服务  \n    b. 可用于在 SAN 内创建设备逻辑子集的结构管理服务  \n    c. 这实现了为管理和访问控制目的而进行的资源分区\
    \  \n    d. 监控连接到结构的设备的健康状况\n\n14. 两个独立的 FC 交换机在各自配置了一个分区集。现在在这两个交换机之间连接了一条 ISL。两个交换机都包含一个同名分区，但该分区的成员在两个交换机中不同。尝试在两个交换机之间建立\
    \ ISL 后，以下哪项陈述是正确的？\n\n    a. 两个交换机之间的活动分区集成功合并，ISL 建立。  \n    b. 两个交换机之间的活动分区集无法合并，ISL\
    \ 被隔离。\n\n15. LUN 掩码是创建以下内容的方法：\n\n    a. 一个 LUN  \n    b. 对 LUN 的访问控制  \n   \
    \ c. 更多的 LUN  \n    d. 两个 LUN 之间的复制\n\n16. 匹配下列项目：\n\n    i. 分区        1. 主机服务器\
    \  \n    ii. 多路径      2. 交换机  \n    iii. LUN 掩码   3. 存储系统\n\n    a. (i) - (1),\
    \ (iii) - (2) 和 (ii) - (3)  \n    b. (i) - (1), (ii) - (2) 和 (iii) - (3)  \n \
    \   c. (ii) - (1), (i) - (2) 和 (iii) - (3)  \n    d. (ii) - (1), (iii) - (2) 和\
    \ (i) - (3)\n\n17. 大多数多路径驱动程序中默认的负载均衡策略是哪一个？\n\n    a. 轮询  \n    b. 最短队列请求  \n\
    \    c. 最短队列字节  \n    d. 最短队列服务时间\n\n18. 匹配下列项目：\n\n    i. 单交换机结构拓扑    1. 中端存储解决方案\
    \  \n    ii. 网状拓扑            2. 入门级存储解决方案  \n    iii. 核心-边缘拓扑      3. 企业级存储解决方案\n\
    \n    a. (i) - (1), (iii) - (2) 和 (ii) - (3)  \n    b. (i) - (1), (ii) - (2) 和\
    \ (iii) - (3)\n"
