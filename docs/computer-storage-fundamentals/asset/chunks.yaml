    # 光纤通道基础


    当 `N_Port` 设备（服务器或存储）连接到交换机时，它会向交换机发送结构登录（`FLOGI`）请求以获取光纤通道 ID（`FCID`）。`FC` 中的
    `FCID` 就像 `TCP/IP` 网络中的 `IP` 地址，设备使用它与结构中的其他设备通信。`FLOGI` 请求类似于 `DHCP` 客户端请求 `IP`
    地址。


    `IP` 地址有两部分：网络 ID 和主机 ID。同样，`FCID` 也有两部分：域 ID（连接到交换机的所有设备均唯一）和端口 ID（连接到交换机的每个
    `N_Port` 设备均唯一）。


    交换机中运行的登录服务器进程为每个连接的设备提供唯一的 `FCID`。类似于 `DHCP`，服务器为每个网络设备提供唯一的 `IP` 地址。


    `FC` 中的 `WWPN` 相当于网络中的 `MAC` 地址。


    ## 链路重置和结构登录


    | `N_Port` | `F_Port` | Sequence | Result |

    | --- | --- | --- | --- |

    |  |  | `NOS` | 链路不可用 |

    | `OLS`→ |  |  | `N_Port` 上电离线状态 |

    |  | `LR`← |  | 链路重置（`LR`） |

    | `LRR`→ |  |  | LR 响应（`LRR`）| 链路激活 |

    | `FLOGI`→ |  |  | 结构登录 |

    |  | `ACC`← |  | 结构登录接受 | 获取地址 |


    表 4.3：链路重置和结构登录


    `N_Port` 通过发送 `OLS` 开始初始化过程后，`F_Port` 尝试通过发送一系列 `LR` 来重置端口。`N_Port` 以一系列 `LRR`
    进行响应。从这一点开始，链路处于激活状态，空闲帧在链路上双向流动。


    当没有帧被传输时，空闲帧会持续发送以维持同步并保持链路激活。在空闲传输字中，第一个字符是 `K28.5`，第二个是空闲字符，最后两个字符是满足差异性的任意字符。`Idles`
    在帧之间传输。


    ## 名称服务器和端口登录


    `N_Port` 设备完成 `FLOGI` 过程后，需要访问连接到结构中的其他设备。运行在交换机中的一项服务称为名称服务器。`PLOGI` 用于一个 `N_Port`
    登录到另一个 `N_Port`，打开会话并交换服务参数。`LOGO` 用于终止登录会话并释放其相关资源。


    | `N_Port` | `F_Port` | Sequence | Result |

    | --- | --- | --- | --- |

    | `PLOGI`→ |  |  | 端口登录到名称服务器 |

    |  | `ACC`← |  | 端口登录接受 |

    | `FCS`→ |  |  | 请求目录 |

    |  | `Directory`← |  | 目录服务响应 |

    | `LOGO`→ |  |  | 从名称服务器登出 |

    |  | `ACC`← |  | 登出接受 | 获取目录 |

    | `PLOGI`→ |  |  | 端口登录到另一个 `N_Port` |

    |  | `ACC`← |  | 端口登录接受 | 参数已交换 |


    表 4.4：端口登录


    现在，`N_Port` 可以登录到其他每个端口并交换服务参数。发起方发送带有其操作参数的 `PLOGI`。目标 `N_Port` 用指定其自身操作参数的 `ACC`
    帧进行响应。`N_Port` 将其个性和功能告知名称服务器。


    ## 进程登录


    | `N_Port` | `F_Port` | Sequence | Result |

    | --- | --- | --- | --- |

    | `PRLI`→ |  |  | 进程登录 |

    |  | `ACC`← |  | 进程登录响应 | 通信已建立 |


    表 4.5：进程登录


    成功完成 `PLOGI` 后，`N_Port` 了解其他每个端口的情况，驱动程序将它们的详细信息存储在参数块中，该节点中的驱动程序可以与与每个节点关联的其他每个驱动程序打开一个通道。当通道成功打开时，例如
    `SCSI` 发起方打开与 `SCSI` 目标的通道，会建立一个镜像对，只要通道保持打开状态，就可以进行通信。如果驱动程序在登出（`PRLO`）时关闭镜像对，则必须在进一步通信发生前重新建立镜像对。


    `PRLI` 在发起方和响应方端口之间建立 `FC-4` 会话，以便在进程镜像对之间交换驱动程序的进程服务参数。


    `PRLO` 终止镜像对之间的现有会话并释放驱动程序资源。


    ## 光纤通道层


    `FC-0`：物理接口、传输、信令、电缆/连接器


    `FC-1`：`8b/10b` 编码/解码、链路控制、有序集规范


    `FC-2`：帧处理、流控制、服务类别、交换/序列管理


    `FC-3`：用于加密、压缩、`RAID` 条带化的应用专用层


    `FC-4`：现有协议和原生 `FC` 协议的协议映射


    ![图 4.9：FC 层](img/Fig_4.9.png)


    图 4.9：FC 层


    - `OX_ID` 由交换发起方设置的唯一 16 位 ID

    - `RX_ID` 由交换响应方设置的唯一 16 位 ID


    在任何时候都有多个交换处于活动状态。


    ![图 4.10：FC 交换、序列、帧和字](img/Fig_4.10.png)


    图 4.10：FC 交换、序列、帧和字


    上层协议（`ULPs`），如 `SCSI`、`ESCON` 和 `IP` 被映射到 `FC-4` 层以进行传输：


    - 信息单元是映射到 `FC` 序列中的 `ULP` 单元。

    - 序列是从一个 `FC` 客户端到另一个 `FC` 客户端构成单个信息组的单向帧集合。

    - 信息单元由一个或多个映射到帧上的块组成。

    - 一帧由 `SOF`、帧头、载荷、`CRC` 和 `EOF` 组成。

    - 帧是传输的独立单元，通常包含来自 `ULPs` 的映射命令或数据包。

    - 最大帧载荷大小为 2112 字节（含可选帧头），典型最大数据载荷为 2048 字节。

    - 接收端口可能只能处理 2KB 或 1KB 的帧，因此 `FC-4` 层必须将信息单元分解为大小合适的块，以便由 `FC` 传递。


    交换是描述两个节点之间对话的双向序列组。


    FC 结构可以通过以下方式与语法对应物进行比较：


    - 字是语音和 `FC` 中对话的基本单位。

    - 帧是字的完整集合，对应完整的思想或句子。

    - 序列是单个序列发起方传输中的帧集合，在书面语中表示为段落。


    交换是由多个序列组成的节点之间的对话：


    - 交换是两个 `FC` 端口用来识别和管理它们之间操作的机制。

    - 每当两个端口之间开始一项操作时，就会打开一个交换。当该操作结束时，交换关闭。


    总之，`FC` 结构类似于语法对应物。字也类似于任何语言中的词。`FC` 帧（36 到 2148 字节）相当于句子。序列（单向）类似于段落，交换（双向）类似于对话。


    ## 服务类别


    `FC-2` 提供不同的服务类别（`CoS`），以满足不同级别的交付保证、带宽和连接性。不同的应用程序需要这些服务的不同级别。


    ### 1 类


    **特性**：独占面向连接、100% 预留带宽、按序帧交付、确认交付


    **用途**：专用应用；不广泛支持


    ### 2 类


    **特性**：帧交换，即根据帧或包头中的地址将数据帧或包路由到目的地，无连接、确认交付


    **用途**：集群、`OLTP`


    ### 3 类


    **特性**：帧交换、无连接、无交付确认、受控环境


    **用途**：当今 `FC` 结构中最常见的实现


    ### 4 类


    **特性**：部分或共享带宽、通过虚拟电路面向连接、按序帧交付和确认交付


    **用途**：专用应用，最推荐用于多媒体（如视频/音频应用），不广泛支持


    | 注：未定义 5 类。 |

    | --- |


    ### 6 类

