- raw: "Deduplication’s effectiveness is expressed as deduplication ratio, meaning\
    \ the ratio of the amount of data sent by host server to the amount of datastored\
    \ in storage. For example, if 40 GB of data is deduplicated and requires only\
    \ 2 GB space to store on disk, the ratio becomes 40:2 = 20:1. A 20:1 ratio means\
    \ that 20 times data from host server is stored than the actual space required\
    \ to store it,\n\nSome vendors express this space reduction ratio as multiples\
    \ or percentage. For above example 20:1 is expressed as 20x or ( 1 - 1/20 ) x\
    \ 100 = 95%\n\nCompression ratio is also calculated using same method as deduplication\
    \ ratio.\n\nSince most vendors perform compression after deduplication, compression\
    \ ratio is expressed as ratio of post-deduplication data and post-compression\
    \ data. In the above example if 2 GB of post-deduplication data further compressed\
    \ to 1 GB, compression ratio becomes 2:1\n\nFollowing is an example to illustrate\
    \ how compression works. In the address table there are some strings which are\
    \ common; the compression algorithm determines the common strings and stores in\
    \ a dictionary table along with unique symbols and then the data table is represented\
    \ by another table which has the symbol of the dictionary.\n\n| Address details\
    \ |\n\n| --- |\n\n| Name || City || State || Zipcode |\n\n| Ramesh Kumar || Bangalore\
    \ || Karnataka || 56037 |\n\n| Rakesh Kumar || Bangalore || Karnataka || 56075\
    \ |\n\nTable 8.1: How compression works\n\n![Figure 8.9: how deduplication works](images/Fig_8.9.jpg)\n\
    \nFigure 8.9: how deduplication works\n\n## Conclusion\n\nStoring data efficiently\
    \ is one of the critical considerations while designing a storage system, as this\
    \ influences cost factor. A storage is said to be good if it is capable to storing\
    \ more amount of on a less disk space.\n\nThere are several features that storage\
    \ vendors implement to enhance the capability of their storage to store data more\
    \ efficiently. Among these features, most commonly used feature is thin provisioning,\
    \ in which blocks of a storage volume get allocated from a free pool of blocks\
    \ as and when host server writes data on the storage volume. Thus, avoids blocking\
    \ of space blocks without using them. Space reclamation is another feature in\
    \ which allocated blocks are released to the free pool when host server deletes\
    \ data on those blocks. This helps to have more blocks in the free pool for other\
    \ usages.\n\nModifying metadata structure a size of virtual volume can be increased\
    \ or decreased. The function to increase size is called expand and decrease is\
    \ called shrink. This is generally done to meet the demand of more space of virtual\
    \ volume or is shrunk to have more blocks in free pool for other use.\n\nDeduplication\
    \ and compressions are two technologies to store more amounts of data on less\
    \ space. As the term deduplication suggests, it removes duplicate information\
    \ and adds a pointer to it for the future un-deduplication. Un-deduplication process\
    \ is called rehydration. On the other hand, compression uses a technique to represent\
    \ the same data with less number of bits.\n\n## Case studies\n\n#### Case study\
    \ 1: Disk configuration to write intensive application\n\nLet us look at disk\
    \ configuration to write intensive application:\n\n#### Requirement\n\nAn administrator\
    \ is looking for a solution to configure volume for an application. Current data\
    \ for the application is about 3 TB. Data is expected to grow 1 TB yearly. Storage\
    \ has total 6 disks each of 1 TB size. What solution can be proposed considering\
    \ requirement for next 5 years?\n\n#### Analysis\n\nIf RAID6 is configured using\
    \ (6 - 2 parity) x 1 TB disks, usable capacity would be approximately 4 TB, for\
    \ RAID 5 usable capacity would be (6 - 1 parity) x 1 TB = 5 TB.\n\nApplication\
    \ data would grow after 5 years to 3 TB + 5 x 1 TB = 8TB\n\nAdministrator can\
    \ create a thin provisioned volume now and later add hard disk as and when the\
    \ space demand increases.\n\n#### Solution\n\n![Figure 8.10: A thin provisioned\
    \ volume with allocated and unallocated space](images/Fig_8.9a.png)\n\nFigure\
    \ 8.10: A thin provisioned volume with allocated and unallocated space\n\nFollowing\
    \ are the type and size of the volumes recommended:\n\nType: Thin provisioning\n\
    \nRAID level: 5\n\nSize: 10TB\n\nNext year total allocated space is expected to\
    \ be 3TB + 1TB = 4TB. New physical disks need to be added into storage to avoid\
    \ write failure toward the end of second year.\n\n#### Case study 2: Effective\
    \ utilization space of a storage solution\n\nLet us look at effective utilization\
    \ space of a storage solution:\n\n#### Requirement\n\nAn organization is concerned\
    \ more about cost aspect of storage, meaning how efficiently the storage can store\
    \ data. The type of data that they have can have approximately 20% of dedup and\
    \ 10% of compression. They have total 15 TB of data and expected growth rate per\
    \ year is about 5 TB. How much of physical usable capacity they should plan for\
    \ next 3 years?\n\n#### Analysis\n\nDeduplication and compression can work in-dependently\
    \ on the same data. Deduplication and compression ratios can be applied on to\
    \ total data after 3 years and calculate actual physical usable capacity required.\n\
    \n#### Solution\n\nData after 3 years = 15 TB + 3 x 5 TB = 30 TB\n\nAssuming dedup\
    \ ratio is D:1; (1- 1/D) x 100 = 20; therefore D:1 = 5:4\n\nAfter deduplication\
    \ 14 TB data can be stored on to (4/5) x 30 TB = 24 TB\n\nAssuming compression\
    \ ratio is C:1; (1- 1/C) x 100 = 10 ; Therefore C:1 = 10:9\n\nAfter compression\
    \ 12 TB data can be stored on to (9/10) x 24 TB = 21.6 TB\n\nAdministrator needs\
    \ to plan for 21.6 TB for 3 years\n\n#### Case study 3: Reclamation of deleted\
    \ space\n\nLet us look at reclamation of deleted space:\n\n#### Requirement\n\n\
    An administrator deleted about 7 TB of data from a thin provisioned volume in\
    \ Windows host. They still do not expected available space in storage system,\
    \ so that he can create some volume for other application. What solution can be\
    \ proposed?\n\n#### Analysis\n\nUpon deletion of data from host server, operating\
    \ system only removes file system references, does not deleted actual data block\
    \ in the storage system.\n\nModern storages have space reclamation feature, which\
    \ it deallocate the blocks so that other volume can consume.\n\n#### Solution\n\
    \nAfter deletion of the data, go to Server Manager | Tools | Defragment and Optimize\
    \ Drives.\n\nSelect the drive and click on Optimize. This operation sends T10\
    \ SCSI UNMAP call to storage to deallocate space.\n\n![Figure 8.11: Optimize Drive](images/Fig_8.9b.jpg)\n\
    \nFigure 8.11: Optimize Drive\n\nPower Shell Cmdlet Optimize-Volume also sends\
    \ UNMAP call to storage device.\n\nPS C:\\\\>Optimize-Volume -DriveLetter D -ReTrim\n\
    \n## Learning check\n\n### Objective questions\n\n 1. With thin provisioning feature,\
    \ space gets allocated as and when you:\n\n a. Create virtual volumes\n\n b. Write\
    \ data on to virtual volume\n\n c. Delete virtual volumes\n\n d. Delete data from\
    \ virtual volume\n\n 2. Space reclamation feature is based on:\n\n a. T10 SCSI\
    \ XCOPY Specification\n\n b. T10 SCSI UNMAP specification\n\n c. T10 SCS I WRITE\
    \ SAME specification\n\n d. None of the above\n\n 3. Thin provisioning feature\
    \ of storage mainly brings benefits in the area of:\n\n a. Fault tolerant\n\n\
    \ b. Performance\n\n c. Space efficienct\n\n d. All of the above\n\n 4. Dynamic\
    \ capacity management (LUN shrink/expansion) feature of storage mainly brings\
    \ benefits in the area of:\n\n a. Fault tolerant\n\n b. Performance\n\n c. Space\
    \ efficienc\n\n d. All of the above\n\n 5. Tiered storage management feature of\
    \ storage mainly brings benefits in the area of:\n\n a. Fault tolerant\n\n b.\
    \ Performance\n\n c. Space efficiency\n\n d. All of the above\n\n 6. Which three\
    \ of the following features impact the space efficiency of a storage:\n\n a. Dynamic\
    \ capacity management (LUN shrink/expansion) feature\n\n b. Thin provisioning\
    \ feature\n\n c. Disk type\n\n d. RAID implementation\n\n e. Replication solution\n\
    \n 7. Shrinking of a virtual volume is mainly done by:\n\n a. Reformatting the\
    \ physically disks with less number of blocks"
  fmt: "\n## Deduplication and Compression Ratios\n\nDeduplication's effectiveness\
    \ is expressed as deduplication ratio, meaning the ratio of the amount of data\
    \ sent by host server to the amount of data stored in storage. For example, if\
    \ `40 GB` of data is deduplicated and requires only `2 GB` space to store on disk,\
    \ the ratio becomes `40:2 = 20:1`. A `20:1` ratio means that 20 times data from\
    \ host server is stored than the actual space required to store it.\n\nSome vendors\
    \ express this space reduction ratio as multiples or percentage. For above example\
    \ `20:1` is expressed as `20x` or `(1 - 1/20) x 100 = 95%`.\n\nCompression ratio\
    \ is also calculated using same method as deduplication ratio.\n\nSince most vendors\
    \ perform compression after deduplication, compression ratio is expressed as ratio\
    \ of post-deduplication data and post-compression data. In the above example if\
    \ `2 GB` of post-deduplication data further compressed to `1 GB`, compression\
    \ ratio becomes `2:1`.\n\nFollowing is an example to illustrate how compression\
