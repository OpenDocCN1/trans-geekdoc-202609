- raw: "Scale out NAS is a type of file level storage that incorporates a distributed\
    \ file system that can scale a single volume with a single namespace across many\
    \ nodes. Scale out NAS file level storage solutions can scale up to several PBs\
    \ all while handling thousands of clients. As capacity is scaled out, performance\
    \ is scaled up.\n\n## Conclusion\n\nHost system and storage systems are designed\
    \ to use standard protocol to communicate each other. Host systems and storages\
    \ can be from the different vendor as long as they both support the standard protocol,\
    \ like SCSI , FC, iSCSI , and FCoE for block storage and NFS and CIFS/SMB for\
    \ file storage. Though, over the network client system uses NFS or CIFS to read\
    \ or write shared files, within the file storage, SCSI protocol used to eventually\
    \ write data on to the disk drive.\n\nSCSI is the fundamental protocol used for\
    \ initiator to perform read/write, FC, iSCSI and FCoE are transport protocol that\
    \ encapsulate the SCSI packet with it for transporting the data.\n\nFC is a carries\
    \ for other protocols like SCSI, FICON, IP or HiPPi. FC is like Ethernet in LAN.\
    \ It defines how data needs to be transmitted. It supports both media option that\
    \ is copper cables or optical cables. There are two types of fibre cables that\
    \ is multimode and single-mode.\n\nMultimode cables are used usually for short\
    \ distance, for example, connecting equipment within a rack, whereas single-mode\
    \ cables are used for long distance, for example, two building within a city or\
    \ a locality.\n\niSCSI is an emerging industry-wide popular SCSI block I/O protocols\
    \ to be transmitted over a IP network. It encapsulate SCSI packet inside IP frame\
    \ and transmits data between instar and target devices.\n\nFile level NAS storage\
    \ use file level protocols such as SMB/CIFS and NFS for I/O operation within shared\
    \ files.\n\n## Case studies\n\n### Case study 1: Identifying SCSI disks in Linux\
    \ host with DAS solution\n\nLet us identify SCSI disks in Linux host with DAS\
    \ solution:\n\n#### Requirement\n\nIn DAS solution, JBOD is connected to Linux\
    \ host server via SCSI adapter. JBOD has total four disk drives in alternate bay\
    \ starting from first bay. Disk in first bay has OS installed. Provide steps to\
    \ identify disk in operating system, so that file system can be configured on\
    \ them.\n\n#### Analysis\n\nAs described in following figure, each disk connected\
    \ via SCSI adapter has a unique SCSI ID. SCSI ID depends on the bay position in\
    \ JBOD.\n\n![Figure 4.19: Identifying disks in a DAS](images/Fig_4.19.jpg)\n\n\
    Figure 4.19: Identifying disks in a DAS\n\nThere are several ways to list storage\
    \ devices in Linux. lsscsi is one of the a commonly used utility to get details\
    \ of SCSI devices along with their B.T.L details.\n\n#### Solution\n\n\\[root@\
    \ localhost ~\\]# lsscsi\n\n\\[2:0:0:0\\]disk VENDORNAME MK5061GS MF00 /dev/sda\
    \ \\[2:0:2:0\\] disk VENDORNAME MK6072FH MF00 /dev/sdb \\[2:0:4:0\\] disk VENDORNAME\
    \ MK5033KS MF00 /dev/sdc \\[2:0:8:0\\] disk VENDORNAME MK5034KS MF00 /dev/sdd\n\
    \n\\[root@localhost ~\\]#\n\nAs channel value is 0, here, bus value is 2 for the\
    \ SCSI adapter installed in host server. Bus value depends on PCI slot of the\
    \ host server in which this SCSI adapter is installed. If second SCSI adapter\
    \ was installed in the server, another bus value would have got assigned to it.\n\
    \n0, 2, 4 and 8 are target values. Target value is also referred as SCSI ID. It\
    \ depends on bay position of the disk in the JBOD. 0 corresponds to disk in bay\
    \ # 1, 1 for bay 2, and so on. SCSI ID 6 and 7 are reserved for SCSI adapter.\n\
    \n### Case study 2: Fibre Channel node and port types for storage devices in SAN\
    \ environment\n\nLet us look at fibre channel node and port types for storage\
    \ devices in SAN environment:\n\n#### Requirement\n\nTwo FC switches connected\
    \ via a cable. Host server connected to first switch and storage to second switch.\
    \ A tape device connected to FC hub, switch connected to second switch. Draw the\
    \ SAN diagram along with FC node and port type.\n\n#### Analysis\n\nAs per [Table\
    \ 4.2](#ch04.xhtml#tab4-2) FC port type depends on the device type and the network\
    \ type to which it is connected. For example, 2 FC switches are connected via\
    \ E-ports. N\\_Port is a node port that is connected to a FC switch. F-port is\
    \ a switch port that is connected to FC fabric. Again L-port is node port that\
    \ is connected to FC loop.\n\n#### Solutions\n\nFollowing figure shows all devices\
    \ mentioned along with their connectivity. FC each port is labeled with the FC\
    \ port type.\n\n![Figure 4.20: FC node and port type](images/Fig_4.20.jpg)\n\n\
    Figure 4.20: FC node and port type\n\n### Case study 3: Cost effective high performance\
    \ storage solution\n\nLet us look at cost effective high performance storage solution:\n\
    \n#### Requirement\n\nYour company is looking for a cost effective high performance\
    \ storage solution for database application. Primarily looking for leveraging\
    \ existing network infrastructure. Describe the solution that is suitable for\
    \ this requirement.\n\n#### Analysis\n\nBlock storage systems are most suitable\
    \ for database application. High performance block storage can only be implemented\
    \ either with FC or iSCSI transport protocol. There are three primary reasons\
    \ that iSCSI storage environments have become popular in recent days.\n\n•  iSCSI\
    \ uses Ethernet as its underlying communications fabric. Leveraging this technology\
    \ avoids the need to build separate infrastructures, including switches, cables\
    \ connectors, and so on.\n\n•  iSCSI is much less expensive than FC and operates\
    \ at speeds of 10Gbps, 25Gbps and 40Gbps, and 100Gbps.\n\n•  iSCSI advances along\
    \ with Ethernet.\n\n#### Solution\n\niSCSI storage solution can be proposed for\
    \ high performance block level storage access. It is also a cost effective solution.\
    \ It uses standard Ethernet switches and cabling. Refer to [Figure 4.13](#ch04.xhtml#fig4-13)\
    \ for schematic diagram of the proposed solution.\n\n## Learning check\n\n###\
    \ Objective questions\n\n 1. N\\_Port device can be member of two separate zones:\n\
    \n a. Yes\n\n b. No\n\n 2. Sequence of login for FC login processes:\n\n a. Process\
    \ login (PRLI), port login (PLOGI), fabric login (FLOGI)\n\n b. Port login (PLOGI),\
    \ process login (PRLI), fabric login (FLOGI)\n\n c. Fabric login (FLOGI), port\
    \ login (PLOGI), process login (PRLI)\n\n d. Fabric login(FLOGI), process login(PRLI),\
    \ port login (PLOGI)\n\n 3. During which Login process N\\_Port informs the fabric\
    \ name server of its personality and capabilities?\n\n a. Port login (PLOGI)\n\
    \n b. Process login (PRLI)\n\n c. Fabric login (FLOGI)\n\n d. Process logout (PLOGO)\n\
    \n 4. Process login can only be between:\n\n a. Two switch ports\n\n b. Two initiators\n\
    \n c. Two targets\n\n d. One pair of initiator and target\n\n 5. As per standard,\
    \ maximum of how many bytes can be accommodated within a FC frame?\n\n a. 2048\
    \ bytes\n\n b. 2112 bytes\n\n c. 2011 bytes\n\n d. 1024 bytes\n\n 6. Which of\
    \ the following statements is related to an exchange is incorrect?\n\n a. Multiple\
    \ exchanges are active at any given time between initiator and target\n\n b. An\
    \ exchange has unique identification number\n\n c. Always two exchanges are active\
    \ at any given time between initiator and target\n\n d. Multiple exchanges may\
    \ occur within a single login session\n\n 7. Originator exchange ID (OX\\_ID)\
    \ and responder exchange ID (RX\\_ID) are:\n\n a. 16 bit\n\n b. 32 bit\n\n c.\
    \ 64 bit\n\n d. 128 bit\n\n 8. Fibre Channel address has:\n\n a. 16 bit\n\n b.\
    \ 24 bit\n\n c. 32 bit\n\n d. 40 bit\n\n 9. During speed negotiation, each port\
    \ starts with:\n\n a. Lower speed, then steps up to higher\n\n b. Higher speed,\
    \ then steps down to lower\n\n c. Randomly selects the speeds\n\n d. Depends on\
    \ vendor’s implementation\n\n 10. Which of the following statements related to\
    \ an idle is incorrect?\n\n a. Idles are sent continuously when no frames are\
    \ being transmitted to maintain synchronization and to make the link active\n\n\
    \ b. Idle frame has all zero bits\n\n c. In an idle transmission word, the first\
    \ character is K28.5, the second is the idle character, and the last two characters\
    \ are any characters that satisfy disparity\n\n d. Idles are transmitted between\
    \ frames"
  fmt: "\n## Scale-out NAS\n\nScale-out NAS is a type of file-level storage that incorporates\
    \ a distributed file system that can scale a single volume with a single namespace\
    \ across many nodes. Scale-out NAS file-level storage solutions can scale up to\
    \ several PBs all while handling thousands of clients. As capacity is scaled out,\
    \ performance is scaled up.\n\n## Conclusion\n\nHost systems and storage systems\
    \ are designed to use standard protocols to communicate with each other. Host\
    \ systems and storages can be from different vendors as long as they both support\
    \ the standard protocol, like `SCSI`, `FC`, `iSCSI`, and `FCoE` for block storage\
    \ and `NFS` and `CIFS/SMB` for file storage. Though, over the network client system\
    \ uses `NFS` or `CIFS` to read or write shared files, within the file storage,\
    \ `SCSI` protocol is used to eventually write data onto the disk drive.\n\n`SCSI`\
    \ is the fundamental protocol used for an initiator to perform read/write; `FC`,\
    \ `iSCSI`, and `FCoE` are transport protocols that encapsulate the `SCSI` packet\
    \ for transporting the data.\n\n`FC` is a carrier for other protocols like `SCSI`,\
    \ `FICON`, `IP`, or `HiPPi`. `FC` is like `Ethernet` in `LAN`. It defines how\
    \ data needs to be transmitted. It supports both media options: copper cables\
    \ or optical cables. There are two types of fibre cables: multimode and single-mode.\n\
    \nMultimode cables are usually used for short distances, for example, connecting\
    \ equipment within a rack, whereas single-mode cables are used for long distances,\
    \ for example, two buildings within a city or a locality.\n\n`iSCSI` is an emerging\
    \ industry-wide popular `SCSI` block I/O protocol to be transmitted over an `IP`\
    \ network. It encapsulates `SCSI` packets inside `IP` frames and transmits data\
    \ between initiator and target devices.\n\nFile-level `NAS` storage uses file-level\
    \ protocols such as `SMB/CIFS` and `NFS` for I/O operations within shared files.\n\
    \n## Case Studies\n\n### Case Study 1: Identifying SCSI Disks in Linux Host with\
    \ DAS Solution\n\nLet us identify `SCSI` disks in a Linux host with a `DAS` solution:\n\
    \n#### Requirement\n\nIn a `DAS` solution, `JBOD` is connected to a Linux host\
    \ server via a `SCSI` adapter. `JBOD` has a total of four disk drives in alternate\
    \ bays starting from the first bay. The disk in the first bay has the `OS` installed.\
    \ Provide steps to identify the disk in the operating system so that a file system\
    \ can be configured on them.\n\n#### Analysis\n\nAs described in the following\
    \ figure, each disk connected via a `SCSI` adapter has a unique `SCSI` ID. The\
    \ `SCSI` ID depends on the bay position in the `JBOD`.\n\n![Figure 4.19: Identifying\
    \ disks in a DAS](images/Fig_4.19.jpg)\n\n*Figure 4.19: Identifying disks in a\
    \ DAS*\n\nThere are several ways to list storage devices in Linux. `lsscsi` is\
    \ one of the commonly used utilities to get details of `SCSI` devices along with\
    \ their `B.T.L` details.\n\n#### Solution\n\n```\n[root@localhost ~]# lsscsi\n\
    [2:0:0:0] disk VENDORNAME MK5061GS MF00 /dev/sda\n[2:0:2:0] disk VENDORNAME MK6072FH\
    \ MF00 /dev/sdb\n[2:0:4:0] disk VENDORNAME MK5033KS MF00 /dev/sdc\n[2:0:8:0] disk\
    \ VENDORNAME MK5034KS MF00 /dev/sdd\n[root@localhost ~]#\n```\n\nAs the channel\
    \ value is `0`, here the bus value is `2` for the `SCSI` adapter installed in\
    \ the host server. The bus value depends on the `PCI` slot of the host server\
    \ in which this `SCSI` adapter is installed. If a second `SCSI` adapter was installed\
    \ in the server, another bus value would have been assigned to it.\n\n`0`, `2`,\
    \ `4`, and `8` are target values. The target value is also referred to as the\
    \ `SCSI` ID. It depends on the bay position of the disk in the `JBOD`. `0` corresponds\
    \ to the disk in bay #1, `1` for bay 2, and so on. `SCSI` IDs `6` and `7` are\
    \ reserved for the `SCSI` adapter.\n\n### Case Study 2: Fibre Channel Node and\
    \ Port Types for Storage Devices in SAN Environment\n\nLet us look at fibre channel\
    \ node and port types for storage devices in a `SAN` environment:\n\n#### Requirement\n\
    \nTwo `FC` switches connected via a cable. A host server connected to the first\
    \ switch and storage to the second switch. A tape device connected to an `FC`\
    \ hub, which is connected to the second switch. Draw the `SAN` diagram along with\
    \ `FC` node and port types.\n\n#### Analysis\n\nAs per [Table 4.2](#ch04.xhtml#tab4-2),\
    \ `FC` port type depends on the device type and the network type to which it is\
    \ connected. For example, two `FC` switches are connected via `E_Ports`. `N_Port`\
    \ is a node port that is connected to an `FC` switch. `F_Port` is a switch port\
    \ that is connected to an `FC` fabric. Again, `L_Port` is a node port that is\
    \ connected to an `FC` loop.\n\n#### Solution\n\nThe following figure shows all\
    \ devices mentioned along with their connectivity. Each `FC` port is labeled with\
    \ the `FC` port type.\n\n![Figure 4.20: FC node and port type](images/Fig_4.20.jpg)\n\
    \n*Figure 4.20: FC node and port type*\n\n### Case Study 3: Cost-Effective High-Performance\
    \ Storage Solution\n\nLet us look at a cost-effective high-performance storage\
    \ solution:\n\n#### Requirement\n\nYour company is looking for a cost-effective\
    \ high-performance storage solution for a database application. Primarily looking\
    \ for leveraging existing network infrastructure. Describe the solution that is\
    \ suitable for this requirement.\n\n#### Analysis\n\nBlock storage systems are\
    \ most suitable for database applications. High-performance block storage can\
    \ only be implemented either with `FC` or `iSCSI` transport protocols. There are\
    \ three primary reasons that `iSCSI` storage environments have become popular\
    \ in recent days:\n\n- `iSCSI` uses `Ethernet` as its underlying communications\
    \ fabric. Leveraging this technology avoids the need to build separate infrastructures,\
    \ including switches, cables, connectors, and so on.\n- `iSCSI` is much less expensive\
    \ than `FC` and operates at speeds of `10Gbps`, `25Gbps`, `40Gbps`, and `100Gbps`.\n\
    - `iSCSI` advances along with `Ethernet`.\n\n#### Solution\n\nAn `iSCSI` storage\
    \ solution can be proposed for high-performance block-level storage access. It\
    \ is also a cost-effective solution. It uses standard `Ethernet` switches and\
    \ cabling. Refer to [Figure 4.13](#ch04.xhtml#fig4-13) for a schematic diagram\
    \ of the proposed solution.\n\n## Learning Check\n\n### Objective Questions\n\n\
    1. `N_Port` device can be a member of two separate zones:\n   a. Yes\n   b. No\n\
    \n2. Sequence of login for `FC` login processes:\n   a. Process login (`PRLI`),\
    \ port login (`PLOGI`), fabric login (`FLOGI`)\n   b. Port login (`PLOGI`), process\
    \ login (`PRLI`), fabric login (`FLOGI`)\n   c. Fabric login (`FLOGI`), port login\
    \ (`PLOGI`), process login (`PRLI`)\n   d. Fabric login (`FLOGI`), process login\
    \ (`PRLI`), port login (`PLOGI`)\n\n3. During which login process does an `N_Port`\
    \ inform the fabric name server of its personality and capabilities?\n   a. Port\
    \ login (`PLOGI`)\n   b. Process login (`PRLI`)\n   c. Fabric login (`FLOGI`)\n\
    \   d. Process logout (`PLOGO`)\n\n4. Process login can only be between:\n   a.\
    \ Two switch ports\n   b. Two initiators\n   c. Two targets\n   d. One pair of\
    \ initiator and target\n\n5. As per standard, maximum of how many bytes can be\
    \ accommodated within an `FC` frame?\n   a. 2048 bytes\n   b. 2112 bytes\n   c.\
    \ 2011 bytes\n   d. 1024 bytes\n\n6. Which of the following statements related\
    \ to an exchange is incorrect?\n   a. Multiple exchanges are active at any given\
    \ time between initiator and target\n   b. An exchange has a unique identification\
    \ number\n   c. Always two exchanges are active at any given time between initiator\
    \ and target\n   d. Multiple exchanges may occur within a single login session\n\
    \n7. Originator exchange ID (`OX_ID`) and responder exchange ID (`RX_ID`) are:\n\
    \   a. 16-bit\n   b. 32-bit\n   c. 64-bit\n   d. 128-bit\n\n8. `Fibre Channel`\
    \ address has:\n   a. 16-bit\n   b. 24-bit\n   c. 32-bit\n   d. 40-bit\n\n9. During\
    \ speed negotiation, each port starts with:\n   a. Lower speed, then steps up\
    \ to higher\n   b. Higher speed, then steps down to lower\n   c. Randomly selects\
    \ the speeds\n   d. Depends on vendor’s implementation\n\n10. Which of the following\
    \ statements related to an idle is incorrect?\n    a. Idles are sent continuously\
    \ when no frames are being transmitted to maintain synchronization and to make\
    \ the link active\n    b. Idle frame has all zero bits\n    c. In an idle transmission\
    \ word, the first character is `K28.5`, the second is the idle character, and\
    \ the last two characters are any characters that satisfy disparity\n    d. Idles\
    \ are transmitted between frames\n"
  trans: "\n## 扩展型 NAS\n\n扩展型 NAS 是一种文件级存储，它包含一个分布式文件系统，可跨多个节点以单一命名空间扩展单个卷。扩展型 NAS\
    \ 文件级存储解决方案可扩展至数 PB 级别，同时支持数千个客户端。随着容量的横向扩展，性能也会纵向提升。\n\n## 结论\n\n主机系统和存储系统的设计初衷是使用标准协议进行相互通信。只要主机系统和存储系统都支持标准协议，它们可以来自不同的供应商，例如用于块存储的\
    \ `SCSI`、`FC`、`iSCSI` 和 `FCoE`，以及用于文件存储的 `NFS` 和 `CIFS/SMB`。不过，通过网络，客户端系统使用 `NFS`\
    \ 或 `CIFS` 来读取或写入共享文件，而在文件存储内部，则使用 `SCSI` 协议最终将数据写入磁盘驱动器。\n\n`SCSI` 是发起端用于执行读/写操作的基本协议；`FC`、`iSCSI`\
    \ 和 `FCoE` 是封装 `SCSI` 数据包以传输数据的传输协议。\n\n`FC` 是 `SCSI`、`FICON`、`IP` 或 `HiPPi` 等其他协议的载体。`FC`\
    \ 就像 `LAN` 中的 `Ethernet`。它定义了数据如何传输。它支持两种介质选项：铜缆或光缆。光纤电缆有两种类型：多模和单模。\n\n多模电缆通常用于短距离，例如机架内设备互联，而单模电缆用于长距离，例如城市或区域内的两栋建筑之间。\n\
    \n`iSCSI` 是一种新兴的、行业广泛采用的 `SCSI` 块 I/O 协议，用于通过 `IP` 网络传输。它将 `SCSI` 数据包封装在 `IP`\
    \ 帧中，并在发起端和目标设备之间传输数据。\n\n文件级 `NAS` 存储使用文件级协议（如 `SMB/CIFS` 和 `NFS`）对共享文件执行 I/O\
    \ 操作。\n\n## 案例研究\n\n### 案例研究 1：在具有 DAS 解决方案的 Linux 主机中识别 SCSI 磁盘\n\n让我们识别具有 `DAS`\
    \ 解决方案的 Linux 主机中的 `SCSI` 磁盘：\n\n#### 需求\n\n在 `DAS` 解决方案中，`JBOD` 通过 `SCSI` 适配器连接到\
    \ Linux 主机服务器。`JBOD` 从第一个托架开始，在交替托架中共有四个磁盘驱动器。第一个托架中的磁盘安装了 `OS`。提供在操作系统中识别磁盘的步骤，以便可以在它们上配置文件系统。\n\
    \n#### 分析\n\n如下图所示，通过 `SCSI` 适配器连接的每个磁盘都有一个唯一的 `SCSI` ID。`SCSI` ID 取决于 `JBOD`\
    \ 中的托架位置。\n\n![Figure 4.19: Identifying disks in a DAS](img/Fig_4.19.jpg)\n\n\
    *Figure 4.19: Identifying disks in a DAS*\n\n在 Linux 中列出存储设备有多种方法。`lsscsi` 是获取\
    \ `SCSI` 设备详细信息及其 `B.T.L` 详细信息的常用实用程序之一。\n\n#### 解决方案\n\n```\n[root@localhost\
    \ ~]# lsscsi\n[2:0:0:0] disk VENDORNAME MK5061GS MF00 /dev/sda\n[2:0:2:0] disk\
    \ VENDORNAME MK6072FH MF00 /dev/sdb\n[2:0:4:0] disk VENDORNAME MK5033KS MF00 /dev/sdc\n\
    [2:0:8:0] disk VENDORNAME MK5034KS MF00 /dev/sdd\n[root@localhost ~]#\n```\n\n\
    由于通道值为 `0`，此处安装在主机服务器中的 `SCSI` 适配器的总线值为 `2`。总线值取决于安装此 `SCSI` 适配器的主机服务器的 `PCI`\
    \ 插槽。如果在服务器中安装了第二个 `SCSI` 适配器，将为其分配另一个总线值。\n\n`0`、`2`、`4` 和 `8` 是目标值。目标值也称为 `SCSI`\
    \ ID。它取决于磁盘在 `JBOD` 中的托架位置。`0` 对应托架 #1 中的磁盘，`1` 对应托架 2，依此类推。`SCSI` ID `6` 和 `7`\
    \ 保留给 `SCSI` 适配器。\n\n### 案例研究 2：SAN 环境中存储设备的光纤通道节点和端口类型\n\n让我们看看 `SAN` 环境中存储设备的光纤通道节点和端口类型：\n\
    \n#### 需求\n\n两个 `FC` 交换机通过电缆连接。一台主机服务器连接到第一个交换机，存储设备连接到第二个交换机。一台磁带设备连接到一个 `FC`\
    \ 集线器，该集线器连接到第二个交换机。绘制包含 `FC` 节点和端口类型的 `SAN` 图。\n\n#### 分析\n\n根据 表 4.2，`FC` 端口类型取决于设备类型及其连接的网络类型。例如，两个\
    \ `FC` 交换机通过 `E_Port` 连接。`N_Port` 是连接到 `FC` 交换机的节点端口。`F_Port` 是连接到 `FC` 结构的交换机端口。同样，`L_Port`\
    \ 是连接到 `FC` 环的节点端口。\n\n#### 解决方案\n\n下图显示了所有提到的设备及其连接情况。每个 `FC` 端口均标注了 `FC` 端口类型。\n\
    \n![Figure 4.20: FC node and port type](img/Fig_4.20.jpg)\n\n*Figure 4.20: FC\
    \ node and port type*\n\n### 案例研究 3：具有成本效益的高性能存储解决方案\n\n让我们看看一个具有成本效益的高性能存储解决方案：\n\
    \n#### 需求\n\n贵公司正在为数据库应用程序寻找一个具有成本效益的高性能存储解决方案。主要希望利用现有的网络基础设施。描述适合此需求的解决方案。\n\
    \n#### 分析\n\n块存储系统最适合数据库应用程序。高性能块存储只能通过 `FC` 或 `iSCSI` 传输协议来实现。`iSCSI` 存储环境近年来变得流行主要有三个原因：\n\
    \n- `iSCSI` 使用 `Ethernet` 作为其底层通信结构。利用这项技术避免了构建单独基础设施（包括交换机、电缆、连接器等）的需求。\n- `iSCSI`\
    \ 比 `FC` 便宜得多，且运行速度可达 `10Gbps`、`25Gbps`、`40Gbps` 和 `100Gbps`。\n- `iSCSI` 随 `Ethernet`\
    \ 共同发展。\n\n#### 解决方案\n\n可以提出 `iSCSI` 存储解决方案用于高性能块级存储访问。这也是一个具有成本效益的解决方案。它使用标准\
    \ `Ethernet` 交换机和布线。有关建议解决方案的示意图，请参阅 图 4.13。\n\n## 学习检查\n\n### 客观题\n\n1. `N_Port`\
    \ 设备可以是两个独立区域的成员：\n   a. 是\n   b. 否\n\n2. `FC` 登录过程的登录顺序：\n   a. 进程登录 (`PRLI`)、端口登录\
    \ (`PLOGI`)、结构登录 (`FLOGI`)\n   b. 端口登录 (`PLOGI`)、进程登录 (`PRLI`)、结构登录 (`FLOGI`)\n\
    \   c. 结构登录 (`FLOGI`)、端口登录 (`PLOGI`)、进程登录 (`PRLI`)\n   d. 结构登录 (`FLOGI`)、进程登录\
    \ (`PRLI`)、端口登录 (`PLOGI`)\n\n3. 在哪个登录过程中，`N_Port` 会向结构名称服务器通报其个性和功能？\n   a. 端口登录\
    \ (`PLOGI`)\n   b. 进程登录 (`PRLI`)\n   c. 结构登录 (`FLOGI`)\n   d. 进程登出 (`PLOGO`)\n\
    \n4. 进程登录只能发生在：\n   a. 两个交换机端口之间\n   b. 两个发起端之间\n   c. 两个目标端之间\n   d. 一对发起端和目标端之间\n\
    \n5. 根据标准，一个 `FC` 帧最多可容纳多少字节？\n   a. 2048 字节\n   b. 2112 字节\n   c. 2011 字节\n \
    \  d. 1024 字节\n\n6. 以下关于交换的陈述哪一项是不正确的？\n   a. 在任何给定时间，发起端和目标端之间可以有多个活动的交换\n  \
    \ b. 一个交换有一个唯一的标识号\n   c. 在任何给定时间，发起端和目标端之间始终有两个活动的交换\n   d. 在单个登录会话中可能发生多个交换\n\
    \n7. 发起端交换 ID (`OX_ID`) 和响应端交换 ID (`RX_ID`) 是：\n   a. 16 位\n   b. 32 位\n   c.\
    \ 64 位\n   d. 128 位\n\n8. `光纤通道` 地址为：\n   a. 16 位\n   b. 24 位\n   c. 32 位\n  \
    \ d. 40 位\n\n9. 在速率协商期间，每个端口从以下哪项开始：\n   a. 较低速率，然后逐步提升到较高速率\n   b. 较高速率，然后逐步降低到较低速率\n\
    \   c. 随机选择速率\n   d. 取决于供应商的实现\n\n10. 以下关于空闲的陈述哪一项是不正确的？\n    a. 当没有帧传输时，空闲会持续发送以维持同步并保持链路激活\n\
    \    b. 空闲帧全为零比特\n    c. 在空闲传输字中，第一个字符是 `K28.5`，第二个是空闲字符，最后两个字符是满足差异的任意字符\n  \
    \  d. 空闲在帧之间传输\n"
