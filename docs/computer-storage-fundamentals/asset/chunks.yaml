- raw: 'To provide fault tolerance and load balance storage controller level, most
    of the storage systems are configured with minimum of two storage controllers.


    There are multiple controller operation modes available. Storage vendors design
    their controller based on their targeted model and pricing of the storage system.


    ### Active/standby


    One of the two controllers is always in idle state and wakes up when other controller
    dies.


    ![Figure 3.1: Active/standby controller operations](images/Fig_3.1.jpg)


    Figure 3.1: Active/standby controller operations


    Since only controller is active at a time, there is no load balance; this configuration
    is not seen in modern storage system.


    ### Active/passive


    Both controllers serve I/O, but only for the logical unit numbers (LUNs) that
    they own.


    ![Figure 3.2: Active/passive controller operations](images/Fig_3.2.png)


    Figure 3.2: Active/passive controller operations


    •  Only owned controller accepts host requests.


    •  LUNs are statically distributed among controllers by setting preferred to certain
    controller. In the figure, for illustration purpose, only one LUN is shown on
    Controller X. There can be many LUNs owned by either of the controllers.


    •  Data is written to the primary controller’s cache, then to the secondary controller‘s
    cache, complete status is sent to the host and then data is written to the disk.


    ### Asymmetrical Active-Active


    Both controllers accept host requests, but only owned controllers interacts with
    backend disks. In the following figure, for illustration purpose, only one LUN
    is shown on Controller X. There can be many LUNs owned by either of the controllers.


    ![Figure 3.3: Asymmetrical Active-Active controller operations](images/Fig_3.3.png)


    Figure 3.3: Asymmetrical Active-Active controller operations


    •  Data is written to the primary controller’s cache, then to the secondary controller‘s
    cache, complete status is sent to the host and then data is written to the disk.


    •  For read through non-optimized paths involves extra path, that is mirror path.
    No impact on write, as both controllers always has the data.


    •  LUNs are statically distributed among controllers by setting preferred to certain
    controller.


    •  Asymmetric Logical Unit Access (ALUA) enabled OS can determine optimized and
    non-optimized paths.


    ### True Active-Active


    Both controllers accept host requests, and also interacts with backend disks for
    a given LUN. Most modern storage systems have this controller operations implemented.


    ![Figure 3.4: True Active-Active controller operations](images/Fig_3.4.jpg)


    Figure 3.4: True Active-Active controller operations


    ## Caching techniques


    A cache is a temporary storage area that keeps data available for fast and easy
    access. Almost all storage systems have caching mechanism implemented, in which
    frequently accessed data is stored in faster memory and respond back to hosts
    without delay. Cache memory is installed in the storage controller, hence, there
    are various caching techniques available for storage system.


    ![Figure 3.5: Caching techniques](images/Fig_3.5.jpg)


    Figure 3.5: Caching techniques


    Some of the commonly used caching techniques are as follows:


    •  Write-back: A cache management method that increases the performance of host
    write requests by decreasing the storage system’s response time. When the host
    requests a write operation, the storage system controller writes the host’s data
    first to the cache memory, completing the host’s request quickly. It performs
    the slower operation of flushing the data to the disk at a later time. The host
    sees the write operation as complete when the data has reached the cache.


    •  Mirrored write-back: In this policy mode, mirrored write-back provides the
    high performance of write-back under normal operation, but reverts to the safety
    of write-through in case of failure. In mirrored, half of each controller’s write
    contains a copy of the companion controller’s write, providing a high level of
    data protection.


    ![Figure 3.6: Write-back caching technique](images/Fig_3.6.png)


    Figure 3.6: Write-back caching technique


    •  Write-through: A cache management technique for holding the write data in cache
    memory as well as writing the data to the disk. The write request operation is
    complete only after the data to be written is received by the disk. This technique
    allows the controller to complete some host read requests for this same data from
    the cache memory rather than from the disk, greatly improving the response time
    to retrieve data.


    ![Figure 3.7: Write-through caching technique](images/Fig_3.7.png)


    Figure 3.7: Write-through caching technique


    •  Read: A block of high-speed memory used by a controller to buffer data being
    read from storage devices by a host. A read cache increases the controller’s effective
    device access speed by satisfying host read requests from its local cache memory
    when possible instead of external storage devices.


    •  Read-ahead: Cache management technique for improving performance of synchronous
    sequential reads by pre-fetching data from disk and placing it into cache. The
    controller maintains, in the cache, copies of data recently requested by the host,
    and may fetch blocks of data ahead in anticipation that the controller will access
    the next sequential blocks. In normal read cache, host write requests are done
    as usual, without the caching mechanism.


    •  Adaptive: More advanced technique than read-ahead caching. The adaptive cache
    algorithms anticipate host requests based on previous patterns. The blocks of
    data most likely to be requested are cached for quicker transmission to the host.


    ![Figure 3.8: Read caching technique](images/Fig_3.8.png)


    Figure 3.8: Read caching technique


    Purpose of cache battery:


    •  Unwritten cache data or unflushed data resides in cache, battery provides power
    to protect it, in case of any power failure.


    •  Usually write cache is battery backed up, read cache is not.


    •  But if single DIMM is in use, both read and write are battery backed up.


    •  Newer storages are being designed with flash-backed cache, hence does not require
    any battery.


    ## RAID concept


    In 1988, RAID levels 1 through 5 were formally defined by David A. Patterson,
    Garth A. Gibson and Randy H. Katz in the paper, A Case for Redundant Arrays of
    Inexpensive Disks (RAID). The term RAID was first introduced in this paper; it
    spawned the entirestorage industry.


    RAID is an example of storage virtualization, which is discussed in the later
    of part of this book.


    What is RAID?


    •  RAID - Redundant Array of Inexpensive/Independent Disks.


    •  Conceptualized by a paper presented in 1987 at University of California, Berkeley.


    •  Fundamentally, RAID is the use of multiple HDDs in an array that behaves in
    most respects like a single large, fast one.


    •  Improve availability of data.


    •  An attempt to bridge the widening gap between performance of processor vs.
    performance of disks.


    •  To support faster data access required by video and multi-media applications
    warranted new storage architecture.


    ### Purpose of RAID


    Due to mechanical and magnetic parts, disk in any storage system has higher failure
    rate than any other component in it. RAID concept brings mainly two advantages:


    •  Performance: Combine multiple small, inexpensive disk drives into a group to
    yield performance exceeding that of one large, more expensive drive.


    •  Availability: Support fault tolerance by redundantly storing information in
    various ways. Increase capacity.


    A virtual volume is a logical reference to a portion of a storage subsystem. Virtual
    volume is means of provisioning space to host server.'
