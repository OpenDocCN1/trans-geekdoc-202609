    # 存储解决方案


    ## 入门级存储解决方案


    当组织需要存储较少量的数据时，会部署此存储解决方案。通常，此解决方案使用 `DAS` 或基本的 `SAN` 或 `NAS` 存储来实现。在 `DAS` 解决方案中，存储设备可以是主机服务器内部的，也可以是外部的。这易于管理且是一种低成本解决方案。它有几个局限性，例如，任何组件的故障都可能导致数据丢失、性能低下，且存储容量只能扩展到几太字节
    (`TBs`)。


    ![Figure 1.11: Entry level storage solutions](img/Fig_1.9.png)


    图 1.11：入门级存储解决方案


    ## 中端存储解决方案


    当组织需要存储约数百 `TBs` 时，会部署中端存储解决方案。通常，此解决方案使用 `SAN` 或 `NAS` 存储以及集群模式的主机服务器来实现，以实现高可用性。这易于管理且是一种低成本解决方案。它有几个局限性，例如，任何组件的故障都可能导致数据丢失、性能低下，且存储容量只能扩展到几
    `TBs`。


    如果主机服务器采用集群配置以实现高可用性，则每个存储卷都会提供给集群中的所有主机服务器访问，以便如果任何主机服务器发生故障，其他服务器可以继续访问该卷上的数据。由于该卷在多个服务器之间共享，因此此卷访问配置称为共享卷。


    ![Figure 1.12: Mid-range storage solution](img/Fig_1.10.png)


    图 1.12：中端存储解决方案


    一些存储供应商组装所有必需的硬件、预配置软件并在工厂进行微调，以整合所有解决方案供即买即用，并将其作为单个库存单位 (`SKU`) 产品出售。这称为融合基础设施或融合系统。


    ## 企业级存储解决方案


    数据中心是一个具备充足电力、空间和制冷设施的场所，用于部署计算机服务器、存储系统和网络交换机，以存储和处理海量数据。


    大型企业组织在数据中心运行其业务关键应用程序，以存储和处理数百 PB (petabytes) 的数据。为了高可用性和灾难恢复，企业组织还会在另一个位于不同站点的数据中心部署一套类似的硬件，称为远程站点或辅助站点。


    ![Figure 1.13: Enterprise storage solution](img/Fig_1.11.png)


    图 1.13：企业级存储解决方案


    虽然每个存储解决方案都需要备有备份解决方案以便在发生意外丢失时恢复数据，但企业级存储解决方案实施的备份解决方案会在不同时间间隔于不同系统中创建其关键数据的多个副本。


    ## 超融合


    信息技术 (`IT`) 行业自 20 世纪中叶以来一直在不断发展。`XT/AT` `PCs` 在 1980 年代和 1990 年代投入使用，计算机网络在 1990
    年代和 2000 年代出现。此外，`SAN` 在 2000 年代至 2010 年代流行起来，最后 `VM` 在 2010 年代投入使用。在这一演变过程中，数据中心开始拥有多台服务器、存储设备、集群、交换机和线缆，导致管理、部署、空间和功耗方面的低效。


    超融合基础设施 (`HCI`) 是一种采用以软件为中心的架构的基础设施系统，可将计算、存储、网络和虚拟化资源紧密集成。这源自前一节讨论的融合系统概念。与融合系统不同，`HCI`
    中使用的技术无法拆分为独立组件。例如，在融合系统中，存储和服务器仍然是独立的硬件设备，而在 `HCI` 中，解决方案是在软件中实现的。


    超融合系统通常作为软件或预装在硬件设备上的软件出售。该软件安装在现有硬件或任何通用硬件设备上。


    所有资源都在单个系统内整合，以提高管理、部署、空间占用和功耗的效率。为便于管理，`HCI` 供应商提供单一管理应用程序，用于管理超融合系统中的内置技术，如计算、存储网络和虚拟化。


    ![Figure 1.14: HCI](img/Fig_1.12.jpg)


    图 1.14：HCI


    超融合旨在运行 `VM`，应用程序安装在 `VMs` 内部。


    对于高可用性解决方案和更多的横向扩展资源需求，多个超融合系统可以组合在一起，称为超融合系统集群。每个系统称为节点。一旦 `VMs` 的数量达到容量上限，横向扩展就很容易，只需添加包含更多计算、存储和网络资源的节点即可。


    虚拟桌面基础设施 (`VDI`) 是一种基础设施部署技术，它在数据中心的集中式服务器和存储上托管桌面操作系统。许多存储供应商设计、构建并销售超融合产品，以部署和支持
    `VDI` 需求。


    超融合产品不适用于要求高性能并支持数千用户的业务关键应用程序。


    ## 总结


    存储系统和存储解决方案经过数十年的发展，以满足不同的业务目标和用例。存储解决方案的主要组件包括存储系统、主机服务器、交换机、`HBA` 和管理软件。所有这些硬件组件均通过管理软件连接和配置，以部署存储解决方案。


    存储系统根据数据存储和访问所用的技术进行分类；这些存储系统包括 `block`（块）、`file`（文件）和 `object storage`（对象存储）。


    下表显示了所有这些类型存储系统的对比：


    | | `Block storage` | `File storage` | `Object storage` |

    | --- | --- | --- | --- |

    | `Storage solution` | `SAN` | `NAS` | `Cloud` |

    | `Access data unit` | `Blocks` | `Files` | `Objects` |

    | `Host server or client system` | In-house or within data center | `LAN` or `WAN`
    | Internet |

    | `Communication protocol` | `SCSI` on `Fibre Channel`, `iSCSI` | `CIFS/SMB` and
    `NFS` | `REST` over `HTTP` |

    | `Recommended for` | Structured data (relational databases) and random and frequent
    read/write operations | Unstructured data and shared files and folders | Unstructured
    data with less updates |

    | `Advantages` | High performance | Simplified access and management | Scalable
    and distributed access |


    表 1.1：块存储、文件存储和对象存储


    通常，主机服务器在数据中心内访问 `block storage`（块存储）。它们通过 `Fibre Channel`（光纤通道）或 `iSCSI` 协议访问。客户端系统通过局域网或广域网使用
    `SMB/CIFS` 或 `NFS` 协议访问 `file storage`（文件存储），移动设备通过互联网使用 `RESTful API` 访问 `object
    storage`（对象存储）。


    ![Figure 1.15: Block, file and object storage system](img/Fig_1.13.png)


    图 1.15：块、文件和对象存储系统


    根据组织的需求，存储解决方案使用所需类型的存储系统构建；这些解决方案包括 `SAN`、`NAS`、`DAS` 和 `cloud storage`（云存储）。每种解决方案相对于其他解决方案都有其优势和局限性。例如，通常
    `SAN` 解决方案提供高性能，但需要高成本、复杂的管理；另一方面，`DAS` 解决方案成本低、管理简单，但性能可能达不到 `SAN` 解决方案的水平。


    尽管在不同类型的存储系统上存储和访问数据的机制不同，但所有这些存储系统的大部分设计和实现是通用的。因此，如今大多数存储供应商在单个存储系统中制作 `block`（块）、`file`（文件）和
    `object`（对象）存储。下一章将详细描述存储磁盘阵列。


    ![Figure 1.16: Block, file and object on same storage system](img/Fig_1.14.png)


    图 1.16：同一存储系统上的块、文件和对象


    ## 案例研究

