    # CHAPTER 9: Storage Management


    ## Introduction

    Storage management is an important aspect of a storage system. Management software
    help administrator right from initial deployment of storage solution to monitoring
    its health and usage on daily basis. Configuration of each feature and functionalities
    discussed in previous chapters are done through these management software suites.


    Every storage vendor provides suite of management applications to manage their
    storage systems and the overall solution. There are two primary purposes of any
    storage system management software:


    a. Provisioning storage: It allows administrator to create storage space, allocates
    to the host servers.

    b. Monitoring health: Helps to monitor health of all physical and logical components.
    Some vendor also allows administrator to monitor current performance of the storage
    system.


    ## Structure

    Upon successful completion of this chapter, you will be able to learn following
    key areas:


    - Storage management software suite

    - Steps to implement a storage solution

    - SAN storage implementation for host servers in cluster

    - iSCSI solution implementation steps

    - SMB and NFS client configuration steps


    ## Objectives

    Every storage vendor delivers some application software along with storage system
    to manage it. In this chapter, you will learn different type of management software
    and their purposes.


    This chapter explains basic steps involved to implement a storage solution along
    with some examples. By end of this chapter, you will have clear idea on how storage
    solution is designed and implemented.


    ## Storage Management Software

    Different storage vendors have different strategy for designing and implementing
    storage software suite. Some vendor implement them within storage system itself,
    some are designed and get installed on separate server. All management software
    are not just provisioning and monitoring health, there are several type of management
    software to manage capacity, performance and availability of data stored and the
    networking devices switches and HBAs.


    Some of the examples are:


    - **Storage system management software**: The primary software that manages storage
    system in terms of provisioning and monitoring health. This software offers storage
    volume creation with different type, such as thin provisioning, deduplication
    or compression enabled and RAID levels, selection of underlying physical disks,
    and so on. Capacity management, expansion and shrink all other management of a
    virtual volume is also performed with this software. Almost all management software
    now days sends alert notification of any error in the storage system. Some management
    software are intelligent enough to perform corrective action automatically.

    - **Performance tuning and monitoring software**: Monitors and collects performance
    data read/write operations. User can view historical or real-time storage system
    performance using charts and graphs. This help to determine trend and pattern
    of usage of the storage system.

    - **Snapshot management software**: Creates deletes and manages the snapshots.
    Most snapshot manager software also allows creating application consistent snapshot.
    Application-consistent snapshots are discussed in detail in [Chapter 7](#ch07.xhtml),
    Fault Tolerance and Data Protection.

    - **Replication management software**: The software that manages local or remote
    replication solution that are discussed in [Chapter 7](#ch07.xhtml), Fault Tolerance
    and Data Protection. Some replication software ensures high availability of application
    in remote replication solution and does automatic failover and failback of replication
    group depending on availability of resources at each site.

    - **Data protection and recovery software**: The software that configure and schedules
    backup jobs to protect data on to a backup system. This also enables user to recover
    data from previously created backups.

    - **Switch management software**: The software that allows configuring and monitoring
    the switches in the SAN.

    - **Adapter management software**: Enables user to change settings of HBA and
    monitor its health and connectivity.


    Though vendors name each of the software differently to highlight their technology
    and brand value, but fundamental purpose of each software is same as described
    above. Based on design and implementation, vendors also combine some of them of
    these software together into one.


    Licensing method of each management software or each storage feature is also different.
    Depending on availability of license, respective component within the management
    software or the feature in the storage gets turned on. For example, vendor may
    design, if thin provisioning license is purchased and installed in storage system,
    user can create thin provisioned storage volume or thin provisioning can be enabled
    through availability of license installed within management software itself.


    ![Figure 9.1: Storage management topology](images/Fig_9.1.jpg)


    Figure 9.1: Storage management topology


    Typically the management software is installed on a PC connected to TCP/IP Network.
    This method of deployment of software is called host-based management software.
    Some vendor''s storage has in-built management inside the storage system itself.
    Administrator just needs to use a web browser to access it.


    All storage systems provide graphical user interface (GUI) and command line interface
    (CLI) management interface to create, update and delete logical storage objects,
    such as storage volume, host, groups etc.

