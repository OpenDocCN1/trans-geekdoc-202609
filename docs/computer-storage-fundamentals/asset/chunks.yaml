  trans: "\n通常，存储系统的设计会包含更多的控制器，以便能够非常快速地执行主机服务器的读/写请求。数据缓存是另一种技术，它将数据临时保留在访问速度更快的\
    \ DIMM 中，以提升性能。RAID 也会被配置为对多个磁盘执行并行读/写。\n\n除此之外，克隆文件块 `XCOPY` 和零填充文件块 `WRITE SAME`\
    \ 也在存储系统中实现，以提高系统内部的数据复制性能。\n\n## 案例研究\n\n### 案例研究 1：给定工作负载下存储卷的吞吐量、数据传输率和延迟\n\
    \n让我们看看给定工作负载下存储卷的吞吐量、数据传输率和延迟：\n\n#### 需求\n\n在存储卷上生成具有以下特征的工作负载：\n\n- 块大小：8KB\n\
    - 读/写百分比：70% 读，30% 写\n- 访问模式：随机\n\n确定吞吐量、数据传输率和延迟。\n\n#### 分析\n\n尽管性能结果取决于许多其他因素，如主机配置、网络带宽和其他工作负载参数，但此测试只能在具有给定工作负载参数的可用环境中执行。\n\
    \n有多种工具可用于生成工作负载并测量存储设备的性能。`I/OMeter` 是一款广泛认可的免费工作负载测量和表征工具，可从 [www.iometer.org](http://www.iometer.org/)\
    \ 网站下载。\n\n`I/OMeter` 可用于生成指定的工作负载，并测量吞吐量、数据传输率和延迟。\n\n#### 解决方案\n\n可执行以下步骤以确定存储卷的吞吐量、数据传输率和延迟：\n\
    \n1. 从 [`www.iometer.org`](http://www.iometer.org/) 网站下载 `Iometer` 工具并将其安装在 Windows\
    \ 主机上。\n2. 在存储系统中创建虚拟卷，呈现给主机，并在操作系统中扫描新设备。\n3. 打开工具并转到“访问规范”选项卡。单击“新建”按钮。\n4.\
    \ 指定名称和参数，即 8 KB 块大小、70% 读和 30% 写以及 100% 随机。\n\n![图 6.11：直径访问配置](img/Fig_6.10a.jpg)\n\
    \n图 6.11：直径访问配置\n\n5. 分配此访问规范。\n6. 转到“磁盘目标”选项卡，选择磁盘，然后单击工具栏上的绿色旗帜以启动工作负载。\n7.\
    \ 现在，转到“测试结果”选项卡，将更新频率移至 1 或 2 秒以查看当前工作负载状态。\n8. 记录吞吐量（每秒 I/O 数）、数据传输率 (MBps)\
    \ 和延迟（平均 I/O 响应时间）(ms)。\n\n![图 6.12：直径中的吞吐量和数据传输率](img/Fig_6.10b.jpg)\n\n图 6.12：直径中的吞吐量和数据传输率\n\
    \n### 案例研究 2：识别给定配置的可能瓶颈\n\n让我们识别给定配置的可能瓶颈：\n\n#### 需求\n\n贵公司购买了一套包含 SSD 驱动器的高端文件存储系统。VMware\
    \ ESXi 服务器通过 NFS 协议访问存储。ESXi 主机也是一款高端服务器。但将一个 200 GB 的虚拟机迁移到该存储大约需要半小时。\n\n####\
    \ 分析\n\n200 GB 的 VM 迁移大约需要 30 分钟，因此数据传输率约为 = `(200 X 1024) / (30 x 60) = 113 MBps`\n\
    \n`113 MBps = 113 x 8 Mbps = 904 Mbps`\n\n904 Mbps 非常接近 1 Gbps 的带宽速度。\n\n网络中的某个组件极有可能导致了瓶颈，将数据传输率降至\
    \ 1 Gbps。\n\n要调查任何性能问题，详细了解环境非常重要。收集信息后得知，公司正在使用现有的 LAN 将 ESXi 主机连接到文件存储。虽然两个系统都连接到两个不同的\
    \ 10 Gb 以太网交换机，但这两个交换机是通过一个 1 Gb 交换机连接的。因此，该组件是数据传输中的瓶颈。主机服务器和存储均为配备 SSD 驱动器的高端设备，因此处理速度快于传输速度，且网络负载已达到最大值。\n\
    \n![图 6.13：多交换机 SAN 解决方案](img/Fig_6.11.png)\n\n图 6.13：多交换机 SAN 解决方案\n\n#### 解决方案\n\
    \n可移除主机和存储通信之间的 1 Gb 交换机以消除瓶颈。存储系统和主机服务器可连接到同一个 10 Gb 交换机。\n\n### 案例研究 3：加速月末结账活动\n\
    \n让我们看看如何加速月末结账活动：\n\n#### 需求\n\n某组织最近购买了一套混合存储系统，同时包含 SSD 和 SAS 两类驱动器。他们配置了两组虚拟卷——一组在\
    \ SSD 上，用于托管客户访问的应用程序；另一组在 SAS 上，用于内部报告和分析。每月末，他们都会从第二个应用程序生成大量报表。\n\n#### 分析\n\
    \n月末期间，访问第二组卷上数据的需求很高。可使用数据分层功能，在月末期间将第二组卷移动到 SSD 驱动器上。活动完成后，可将它们移回原驱动器。\n\n如果\
    \ SSD 驱动器上没有足够的可用空间，可在将第二组卷移动到 SSD 之前，先将第一组卷移动到 SAS。\n\n#### 解决方案\n\n创建计划，在月末活动开始前将第一组卷移动到\
    \ SAS 磁盘。同时创建另一个计划，将第二组卷移动到 SSD。\n\n活动完成后，可根据卷原本的磁盘位置将其恢复。\n\n## 学习检查\n\n### 客观题\n\
    \n1. 您的应用程序要求更高的存储性能，基本上意味着需求是：\n   a. 更高的响应时间\n   b. 更多的 I/O 请求数量\n   c. 在更低响应时间下处理更多的\
    \ I/O 请求数量\n   d. 以上任意一项\n\n2. 数据传输率的度量单位是什么？\n   a. 兆字节 (MBs)\n   b. 千兆比特每秒 (Gbps)\n\
    \   c. 每秒 I/O 次数 (IOPS)\n   d. 毫秒 (ms)\n\n3. 吞吐量的度量单位是什么？\n   a. 兆字节 (MBs)\n \
    \  b. 千兆比特每秒 (Gbps)\n   c. 每秒 I/O 次数 (IOPS)\n   d. 毫秒 (ms)\n\n4. 延迟的度量单位是什么？\n\
    \   a. 兆字节 (MBs)\n   b. 千兆比特每秒 (Gbps)\n   c. 每秒 I/O 次数 (IOPS)\n   d. 毫秒 (ms)\n\
    \n5. 关于存储性能术语，以下哪项陈述是正确的：\n   a. 吞吐量是单位时间内完成的作业数（通常指 I/O 请求数）(IOPS)\n   b. 数据传输率是单位时间内在两个系统之间传输的数据量（例如\
    \ KBps、MBps、GB/小时等）\n   c. 延迟是完成一项作业（I/O 请求）所需的时间\n   d. 以上皆是\n\n6. 如果成本和容量相同，您会购买哪种存储？\n\
    \   a. 在 10ms 延迟下提供 10000 IOPS 的存储\n   b. 在 15ms 延迟下提供 10000 IOPS 的存储\n   c. 两者相同\n\
    \   d. 任意一个\n\n7. 存储系统中使用缓存内存主要是为了提高：\n   a. 容错能力\n   b. 性能\n   c. 空间效率\n   d.\
    \ 以上皆是\n\n8. 以下哪项术语**不**用于存储性能上下文中？\n   a. 吞吐量\n   b. 单位价格空间\n   c. 数据传输率\n  \
    \ d. 响应时间\n\n9. 以下哪项术语用于智能数据分类或分层存储上下文中？\n   a. 单位价格性能 (IOPS)\n   b. 单位价格空间 (GB)\n\
    \   c. 固态硬盘 (SSD) 类型\n   d. 以上皆是\n\n10. 客户在高端企业存储上观测到少量 IOPS，范围在 100-200 左右；他想知道可能的原因：\n\
    \    a. 他的主机没有向存储发起足够多的 I/O 请求\n    b. 他的存储前端无法处理 100-200 IOPS\n    c. 他的存储后端无法处理\
    \ 100-200 IOPS\n\n11. 以下哪两项会影响存储性能：\n    a. 动态容量管理（LUN 收缩/扩展）功能\n    b. 精简配置功能\n\
    \    c. 磁盘类型\n    d. RAID 实现\n"
