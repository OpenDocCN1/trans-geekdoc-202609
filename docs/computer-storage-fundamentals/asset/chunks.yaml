    \nMultipath is operating system level intelligence to determine and distribute\
    \ all I/O request across all available paths. Thus enhances performance and as\
    \ well fault tolerance aspect in storage solution.\n\nTo summarize, following\
    \ three important configuration checks must be met for a host server to access\
    \ storage LUN:\n\na) Physical cabling between server and storage  \nb) Configuring\
    \ zoning to allow access  \nc) Configuring LUN masking to allow access to LUN\n\
    \n## Case Studies\n\n### Case Study 1: Steps to Configure Zoning in a Fabric with\
    \ Brocade FC Switch\n\nLet us look at the steps to configure zoning in a fabric\
    \ with Brocade FC switch:\n\n#### Requirement\n\nYour company is planning to deploy\
    \ a SAN environment that consists of a Linux and a Windows host server connected\
    \ to a storage system via Brocade FC switch. The solution also includes a tape\
    \ device connected to same SAN. Windows server is going to run a backup application\
    \ that requires FC access to the tape device. WWPN details of FC adapters are\
    \ as follows:\n\n- Linux host: `50:01:43:80:24:27:5a:a8`\n- Windows host: `10:00:70:10:6f:e8:77:6f`\n\
    - Storage controller 1: `20:11:00:02:ac:01:84:ea`\n- Storage controller 2: `21:11:00:02:ac:01:84:ea`\n\
    - Tape device: `50:01:43:80:28:ce:4a:7e`\n\n![Figure 5.11: Host servers and storage\
    \ systems](images/Fig_5.11.jpg)\n\nFigure 5.11: Host servers and storage systems\n\
    \n#### Analysis\n\nBoth initiators and target devices are connected to single\
    \ fabric involving single switch. Zoning is required to be implemented only in\
    \ this switch. Two host servers are not in the cluster and running different operating\
    \ systems. Therefore, they need to be in the different zone. Separate zones are\
    \ needed to be created for target devices. As per the requirement, the storage\
    \ system is needed to be accessible by both Linux and Windows hosts and tape device\
    \ by only windows host.\n\nThere are three zones needed:\n\n1. Zone for Linux\
    \ host and storage system\n2. Zone for Windows host and storage system\n3. Zone\
    \ for Windows host and tape device\n\nFor better management of zone configuration,\
    \ each device can have meaningful alias name. Those devices with alias name can\
    \ be member of respective zone, and then finally all zones can be part of a zone\
    \ configuration.\n\n#### Solution\n"
  trans: "\n\n# 存储访问配置：LUN 掩码、多路径和分区\n\n## LUN 掩码\n\n一种允许和限制服务器访问存储 LUN 的方法；换句话说，这也可以描述为将存储\
    \ LUN 分配给该服务器。这是在创建虚拟卷后，为向主机服务器提供 LUN 访问权限而执行的步骤。LUN 掩码类似于分区，但它是在存储阵列中实现的，而非在交换机中。\n\
    \n不同厂商对允许和限制服务器访问存储 LUN 使用不同的术语，其中一些包括 present 和 unpresent（呈现和取消呈现）、export 和 unexport（导出和取消导出）、assigned\
    \ 和 unassigned（分配和取消分配）、LUN 绑定等。\n\n在向主机提供虚拟卷访问权限时，会分配一个唯一的 LUN ID。当向主机呈现多个卷时，它们会被分配唯一的\
    \ LUN ID。如果多台主机不在集群中，则不应向它们呈现同一个虚拟卷。这是为了避免因对虚拟卷进行同时写操作而导致数据损坏。\n\n某些操作系统根据 LUN\
    \ ID 识别存储设备；在集群故障转移后，为了让应用程序引用正确的存储卷，设备命名必须在所有集群成员中保持一致。因此，对于集群解决方案，每个卷必须以相同的\
    \ LUN ID 呈现给所有集群成员。\n\n## 多路径\n\n多路径技术在主机服务器中实现，旨在利用冗余网络的多条路径，在主机服务器和存储设备之间提供高可用性和带宽。\n\
    \n拥有通往存储 LUN 的多条路径主要有两个原因：\n\n1.  **无单点故障 (NSPOF)**：如果一条路径发生故障，I/O 将继续使用其他可用路径。\n\
    2.  **更高带宽**：跨所有可用路径进行负载均衡。\n\n多路径适用于 `iSCSI` 和 `FC` 环境，并在这两种环境中实现。\n\n![Figure\
    \ 5.10: Formation of multipath](img/Fig_5.10.jpg)\n\nFigure 5.10: 多路径的形成\n\n物理布线和分区配置都会影响路径数量。例如，在\
    \ Figure 5.10 中，如果所有目标端口都与所有发起端口分区，服务器将通过多条路径访问每个 LUN；但在此设置中，如果分区仅在一个目标端口和一个发起端口之间进行，则服务器访问\
    \ LUN 只有一条可用路径。\n\n`路径数量 = 从主机服务器到交换机的路径数 X 从存储系统到交换机的路径数。`\n\n所有现代操作系统都内置了多路径驱动程序。以前，存储厂商过去常为每个操作系统提供多路径应用程序。仍有一些存储厂商开发并将多路径作为单独的软件组件出售，它提供更智能的负载均衡和路径故障转移机制。\n\
    \n如果没有多路径软件，每条路径对应一个设备将可见。例如，如果一个 LUN 有四条路径，操作系统将看到总共四个设备。\n\n在同一 LUN 的不同设备上同时写入数据也可能导致数据损坏。\n\
    \n为了便于设备管理，某些多路径软件会隐藏除每个 LUN 一个设备以外的所有设备。\n\n为什么我们需要在操作系统中呈现单一设备？如果没有多路径驱动程序，从主机服务器到存储系统的每条路径都会被操作系统视为一个单独的设备。例如，如果一个具有四条路径的虚拟卷呈现给\
    \ Linux 主机，操作系统会发现四个设备：`/dev/sdb`、`/dev/sdc`、`/dev/sdd` 和 `/dev/sde`，每个对应一条路径。多路径驱动程序在这些底层设备之上创建一个单一的多路径设备，并跨这些可用路径平衡\
    \ I/O 路径。某些多路径驱动程序（如 `Windows MPIO`）会隐藏对应每条路径的设备，以避免混淆和通过不同路径进行的同时写入，这可能导致数据损坏。\n\
    \n### 负载均衡策略\n\n负载均衡的目标是最大化工作负载吞吐量，降低 I/O 延迟并优化资源利用率。为了更好地控制负载均衡，多路径驱动程序允许管理员设置用户定义的策略。尽管不同厂商设计和实现不同的策略集，但从根本上说，它们大同小异。以下是典型的负载均衡策略列表：\n\
    \n- **轮询 (`RR`)**：所有 I/O 请求以 `RR` 方式分发到设备的所有活动路径上。`RR` 是最常用且默认的负载均衡策略，但它没有太多智能，只是以平衡的方式使用所有可用路径。\n\
    - **最短队列请求 (`SQR`)**：每个 I/O 请求被路由到未完成请求数量最少的活动路径。\n- **最短队列字节 (`SQB`)**：每个 I/O\
    \ 请求被路由到未完成数据字节数量最少的活动路径。\n- **最短队列服务时间 (`SQST`)**：每个 I/O 请求被路由到未完成 I/O 请求的总等待时间最短的活动路径。\n\
    - **无负载均衡 (`NLB`)**：所有 I/O 请求通过选定的活动路径路由。\n\n## 结论\n\n根据存储解决方案的需求和复杂性，设计 SAN 拓扑。有三种不同类型的\
    \ SAN 网络拓扑，如单交换机、网状和核心-边缘拓扑。通常单交换机拓扑用于入门级存储解决方案，网状拓扑用于中端解决方案。而企业级存储解决方案使用核心-边缘分层拓扑。\n\
    \n分区和 LUN 掩码更多的是关于存储访问的限制配置和更好的管理。分区是在两个端口之间进行的，即一个来自主机服务器（发起端），另一个来自存储系统（目标端）；而\
    \ LUN 掩码是关于向主机服务器提供虚拟卷的访问权限。\n\n存储解决方案中的这两项功能对于存储解决方案的更好管理和稳定性都很重要。\n\n多路径是操作系统层面的智能，用于确定并将所有\
    \ I/O 请求分发到所有可用路径上。从而增强存储解决方案的性能和容错能力。\n\n总之，要使主机服务器访问存储 LUN，必须满足以下三项重要的配置检查：\n\
    \na) 服务器与存储之间的物理布线  \nb) 配置分区以允许访问  \nc) 配置 LUN 掩码以允许访问 LUN\n\n## 案例研究\n\n###\
    \ 案例研究 1：在具有 Brocade FC 交换机的网络中配置分区的步骤\n\n让我们看看在具有 Brocade FC 交换机的网络中配置分区的步骤：\n\
    \n#### 需求\n\n您的公司计划部署一个 SAN 环境，该环境由一台 Linux 和一台 Windows 主机服务器组成，它们通过 Brocade FC\
    \ 交换机连接到存储系统。该解决方案还包括一个连接到同一 SAN 的磁带设备。Windows 服务器将运行一个需要 FC 访问磁带设备的备份应用程序。FC\
    \ 适配器的 WWPN 详细信息如下：\n\n- Linux 主机：`50:01:43:80:24:27:5a:a8`\n- Windows 主机：`10:00:70:10:6f:e8:77:6f`\n\
    - 存储控制器 1：`20:11:00:02:ac:01:84:ea`\n- 存储控制器 2：`21:11:00:02:ac:01:84:ea`\n- 磁带设备：`50:01:43:80:28:ce:4a:7e`\n\
    \n![Figure 5.11: Host servers and storage systems](img/Fig_5.11.jpg)\n\nFigure\
    \ 5.11: 主机服务器和存储系统\n\n#### 分析\n\n所有发起端和目标设备都连接到涉及单个交换机的单一网络中。分区仅需在此交换机中实现。两台主机服务器不在集群中，且运行不同的操作系统。因此，它们需要位于不同的分区中。需要为目标设备创建单独的分区。根据需求，存储系统需要可被\
    \ Linux 和 Windows 主机访问，而磁带设备仅可被 Windows 主机访问。\n\n需要三个分区：\n\n1.  Linux 主机和存储系统的分区\n\
    2.  Windows 主机和存储系统的分区\n3.  Windows 主机和磁带设备的分区\n\n为了更好地管理分区配置，每个设备可以拥有有意义的别名。带有别名的这些设备可以成为相应分区的成员，最后所有分区可以成为分区配置的一部分。\n\
    \n#### 解决方案\n\n"
