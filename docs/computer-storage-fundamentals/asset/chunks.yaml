    # 存储系统硬件组件


    ## 硬盘驱动器 (HDD)


    存储系统最关键的硬件组件是硬盘驱动器，它本质上存储用户数据。


    磁盘拥有以每分钟转数 (`RPM`) 表示速度旋转的盘片。这是盘片在一分钟内完成完整旋转的次数。磁头固定在臂上，用于从盘片读取和写入数据。由于磁盘臂和磁头固定在一个位置，它经常需要等待盘片旋转到正确的位置。常见的
    `RPM` 值为消费级串行高级技术附件 (`SATA`) 磁盘的 5400 或 7200，以及高性能服务器/存储区域网络 (`SAN`) 磁盘的 10000
    或 15000。


    主要有两种类型的硬盘驱动器可用：


    - **小规格 (`SFF`)**，2.5 英寸磁盘

    - **大规格 (`LFF`)**，3.5 英寸磁盘


    与 `LFF` 相比，`SFF` 磁盘消耗的电力和空间更少。`SFF` 磁盘通常成本较高，采用串行连接 SCSI (`SAS`) 接口，用于高负载环境。`LFF`
    磁盘成本较低，采用 `SATA` 接口，用于大容量存储。


    ![Figure 2.8: SFF and LFF hard drives](img/Fig_2.4.png)


    *图 2.8：SFF 和 LFF 硬盘驱动器*


    每个硬盘驱动器都有一个运行固件的印刷电路板 (`PCB`)。当硬盘驱动器通电时，固件会检查驱动器各部分的健康状况，发送命令启动电机，并稳定和监控转速。这就是驱动器准备好接受来自存储控制器的读/写命令的方式。


    硬盘以磁场的形式存储 0 和 1。硬盘的圆形部分称为盘片，盘片上微小的磁化区域存储一位数据。要在硬盘上写入数据，需在微小区域施加南北 (`N-S`) 或北南
    (`S-N`) 极性的磁场。极性模式代表 1 或 0。


    例如，反转 (`N-S` 到 `S-N` 或 `S-N` 到 `N-S`) 代表 1，而相同极性 (`N-S` 到 `N-S` 或 `S-N` 到 `S-N`)
    代表 0。


    ## 固态硬盘 (SSD)


    固态硬盘 (`SSD`) 没有移动的机械部件，如硬盘驱动器 (`HDD`) 中的盘片或电机。`SSD` 性能显著高于传统机电磁盘驱动器。


    最近，`SSD` 使用非易失性 `NAND` 闪存。一种特殊的金属-氧化物-半导体场效应晶体管 (`MOSFET`)，称为浮栅晶体管，由高电阻层隔离，用于永久捕获带电电子。每个晶体管可存储一位。如果单元未充电则代表
    1，如果已充电则代表 0。


    ![Figure 2.9: SSD](img/Fig_2.5.jpg)


    *图 2.9：SSD*


    设计并使用全 `SSD` 驱动器的存储系统也称为全闪存阵列 (`AFA`)。


    ## 存储级内存


    在计算机系统中，与其他主要组件（如 `CPU` 或 `DRAM` 内存）相比，存储设备是最慢的组件。通常，`DRAM` 以高性能、高成本但低容量著称。另一方面，`SSD`
    和 `HDD` 等存储以高容量、低成本但性能低于 `DRAM` 著称。存储级内存 (`SCM`) 是一种内存类型，其容量和价格类似于存储，但性能类似于内存。


    假设 `CPU` 以秒为单位运行；在这种情况下，从 `DRAM` 获取数据需要几分钟，而从 `HDD` 获取数据则需要几个月。因此，与 `CPU` 和 `DRAM`
    相比，`HDD` 是一个明显较慢的设备。


    虽然 `SSD` 现在已将这一差距缩小到一天以内，但分钟和一天之间仍有巨大差异，因为 `SSD` 比 `DRAM` 慢约 1000 倍。`SCM` 将其降低到约
    100 倍，仅需几小时。


    ![Figure 2.10: Latency of memory and storage devices](img/Fig_2.6.jpg)


    *图 2.10：内存和存储设备的延迟*


    最近，大多数存储厂商计划在其存储系统中实施 `SCM`。基于迄今为止存储设备的演进，预测 `SCM` 未来可能成为主存储，而 `SSD` 可能用作数据归档的辅助存储。


    ### 存储设备的演进


    | 年份 | 计算 | 内存 | 主存储 | 辅助存储 |

    |------|---------|-----|-----------------|-------------------|

    | 1990 年代 | CPU | DRAM | HDD | 磁带 |

    | 2010 年代 | CPU | DRAM | SSD | HDD |

    | 2030 年代 (预测) | CPU | DRAM | SCM | SSD |


    *表 2.2：存储设备的演进*


    ## 非易失性内存表达


    基于 `ATA` 和 `SCSI` 的协议仅支持单个队列。因此，对于访问 `NAND` 闪存和 `SCM` 等高速存储介质，这些协议已成为瓶颈。非易失性内存表达
    (`NVMe`) 是专门为这些存储设备设计的存储协议。


    虽然 `SATA` 和 `SAS` 协议最适合旋转 `HDD`，但 `NVMe` 协议适合 `NAND` 闪存和 `SCM`。`NVMe` 协议通过 PCI
    Express (`PCIe`) 总线上的大量并行操作提供低延迟、高性能。由于接口速度、新存储介质的性能以及靠近 `CPU`，`PCIe` 成为 `NVMe`
    协议更好的存储接口选择。`NVMe` 是一种针对 `NUMA` 优化的协议，允许多个 `CPU` 核心共享队列的所有权、优先级，以及仲裁机制和命令的原子性。


    如下图 `PCIe` 拓扑所示，`NVMe` 磁盘子系统是一个 `PCIe` 端点，主要包含两个组件：`NVMe` 控制器和 `NVM`。


    主机与 `NVMe` 控制器交互以发送读、写、系统调用请求，控制器随即访问连接到它的设备以执行块 I/O (`BI/O`)。


    ![Figure 2.12: NVMe topology](img/Fig_2.7.png)


    *图 2.12：NVMe 拓扑*


    图形和内存控制器中心 (`GMCH`) 也称为内存桥接器、内存中心或北桥。I/O 控制器中心 (`I/OCH`) 也称为 I/O 桥接器、I/O 中心或南桥。


    虽然从根本上说 `PCIe` 总线上的数据传输是串行的，但有了 `NVMe`，每个命令和数据传输都通过多条 `PCI` 通道、多核 `CPU` 和对 `NAND`
    设备的并行访问大规模并行发生。这就是 `NVMe` 实现极高带宽的方式。


    ```

    # ls -l /dev/nvme*

    crw------- 1 root root 245, 0 Mar 30 21:07 /dev/nvme0

    brw-rw---- 1 root disk 259, 0 Mar 30 21:07 /dev/nvme0n1

    brw-rw---- 1 root disk 259, 1 Mar 30 21:07 /dev/nvme0n2

    ```


    `/dev/nvme0` 是 `NVMe` 控制器的字符特殊文件，而 `/dev/nvme0n1` 和 `/dev/nvme0n2` 是连接到控制器的块设备的两个块特殊文件。


    由于基于 `NVMe` 闪存的磁盘访问更快，采用了以下用例和部署模型：


    1. 客户端计算机的启动磁盘

    2. 服务器的内部存储磁盘

    3. 服务器用于频繁使用数据的缓存内存

    4. 存储系统的后端磁盘


    最近，大多数存储厂商正在设计其存储系统以支持基于 `NVMe` 的磁盘，以避免后端的任何磁盘瓶颈并提高整体存储性能。


    ### 命名空间


    命名空间是连接到 `NVMe` 控制器的设备的块集合。这类似于文件系统分区，用于更好地管理存储空间。


    以下是命名空间的一些特性：


    - 从内核角度来看，命名空间只是扇区的线性序列。

    - 每个命名空间都有一个 ID。

    - 命名空间在闪存上创建并连接到 `NVMe` 控制器。

    - `NVMe` 最多可支持 64K 个 I/O 队列，每个队列可包含 64K 个命令。而 `SAS` 和 `SATA` 只能支持单个队列，分别最多可有 254
    和 32 个命令。

    - 每个控制器每个命名空间最多可有 64K 个队列 (`2¹⁶ = 65535`)。总共支持 (`2³² = 2¹⁶ x 2¹⁶`) 个命令。

    - 有两种类型的队列：用于控制器管理获取和设置的管理队列，以及用于 `NAND` 读/写的 I/O 队列。


    ### 网络结构上的 NVMe


    `NVMe` 设计用于通过 `PCIe` 总线在本地使用。因此，`NVMe` 的初始部署是作为计算机中的本地磁盘、服务器中的直连存储 (`DAS`) 以及存储系统中的后端磁盘。


    '
