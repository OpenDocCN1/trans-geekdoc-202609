- raw: "Queue depth: The number of jobs (I/O requests) waiting in a queue in order\
    \ to get processed. This is called the queue length. Concurrency is achieved by\
    \ providing multiple paths to the storage system and using system memory as a\
    \ cache to queue transactions. This leads to this measurement. This indicates\
    \ how many I/O requests a device can handle simultaneously.\n\nThis matches with\
    \ an analogy of doctor checking patients. If the doctor takes more time to complete\
    \ checking a patient and demand is high, queue length will keep on increasing.\
    \ Time to check a patient is similar to latency here and the number of patients\
    \ being checked is similar to throughput and number of patient waiting is queue\
    \ length.\n\nA single disk drive may have a queue length in single or double figures,\
    \ whereas a large Storage system will provide a queue depth into the tens or hundreds\
    \ per LUN, per port or a combination of both.\n\nLoad and delay are exponentially\
    \ related. Latency increases exponentially along with an increase of throughput\
    \ on a storage system. Following figure is an example to show how throughput and\
    \ latency are related to each other.\n\n![Figure 6.5: Throughput and latency](images/Fig_6.5.png)\n\
    \nFigure 6.5: Throughput and latency\n\nHost I/O timeout: The amount of time for\
    \ an initiator host waits for unresponsive disk I/O operations. This is typically\
    \ measured in seconds (sec). \n\nMost operating systems and applications have\
    \ their default I/O timeout set and allow them to configure it. Host I/O timeout\
    \ and latency are two different measurements. The former one is measured from\
    \ host server or application perspective, and it indicates level tolerance level,\
    \ whereas latter primarily indicates how fast received I/O requests are being\
    \ processed within the storage system.\n\nPerformance bottleneck: Bottleneck is\
    \ a situation that can occur within or outside of a storage system that impedes\
    \ data flow. When processing is faster than transport and load touches its maximum\
    \ allowed capability and when transport is faster than processing and the delay\
    \ prevents the increase of load. Therefore, on a loaded system bottleneck always\
    \ exist.\n\n### Workload and its pattern\n\nWorkloads are I/O operations that\
    \ are generated by host applications on to a storage system.\n\nWorkload is characterized\
    \ mainly using three factors:\n\n•  I/O block size: Size of the data block sent\
    \ or received as part of read/write requests. Example 4 KB, 8 KB, 16 KB, 32 KB,\
    \ 64 KB, and so on.\n\n•  Read/write %: Percentage of Read and Write request.\
    \ for example 70% Read indicates host reads 70% of time whereas writes 30% of\
    \ time.\n\n•  Random vs. sequential %: Sequential access pattern is something\
    \ in which next block for read/write operation is predictable. For example, Block\
    \ 5, Block 6, Block 7, and so on. Random is something in which next block is hard\
    \ to predict. For example, Block 3, Block 16, Block 8, and so on.\n\nThere are\
    \ four basic access patterns of workloads that an array can encounter:\n\n•  Random\
    \ reads\n\n•  Random writes\n\n•  Sequential reads\n\n•  Sequential writes\n\n\
    In reality, most of the time a storage system finds a mixture of all four of these\
    \ workloads:\n\n•  Random workloads are typically expected to consist of small\
    \ block I/Os\n\n•  Small block workloads are workloads where the I/O size is between\
    \ 2k–16k\n\nSmall block random workload is also called as online transaction processing\
    \ (OLTP), generally database generates such workload.\n\nGenerally backup operation,\
    \ HD video streaming generates sequential workload and typically these application\
    \ uses large block size, larger than 64 KB\n\nExample of a server’s sequential\
    \ I/O requests can change to a random request due to file system effects, especially\
    \ if file system fragmented.\n\nReads, especially of random, are generally more\
    \ time-consuming than write operations. This is because data for all write get\
    \ written into cache and acknowledges completion to host, whereas data for random\
    \ read access have to fetch directly from disk.\n\n## Tiered storage\n\nMost of\
    \ the storage features create a tradeoff among performance, fault tolerance and\
    \ space efficiency. For example, if you configure RAID 0, you lose fault tolerance\
    \ aspect, but you gain performance and space efficiency. Another example, with\
    \ data compression, you gain space efficiency, but lose performance. To gain one\
    \ aspect, you lose other.\n\nData tiering feature helps to achieve your objective\
    \ by automatically toggling characteristic of your storage volume based on set\
    \ of policies that are defined by end user as well as within storage system.\n\
    \nIf you have a storage system SSD, and SAS HDD with 15K RPM and SATA HDD with\
    \ 7.2K RPM drives, generally storage vendor defines SSD as Tier 0 and 15K HDD\
    \ as Tier 1 and 7.2K HDD as Tier 2. User now defines some policies based on IOPS\
    \ and latency of the virtual volume based on which storage system automatically\
    \ moves the volumes from one tier to other. Volumes which are mostly accessed\
    \ would typically be moved to higher tier and less access volumes to lower tier.\n\
    \nIn summary, tiered storage is a tradeoff between performance (IOPS) per unit\
    \ price and space (GB) per unit price.\n\n![Figure 6.6: Tiered storage with different\
    \ access level of volumes](images/Fig_6.6.png)\n\nFigure 6.6: Tiered storage with\
    \ different access level of volumes\n\n## Quality of service\n\nWith popularity\
    \ of SAN and virtualization, storage systems are now shared by multiple servers\
    \ and applications. Typical challenge in shared environment, any workload intensive\
    \ application that consumes maximum available storage resources and bandwidth\
    \ makes other applications to starve.\n\n![Figure 6.7: QoS implementation](images/Fig_6.7.jpg)\n\
    \nFigure 6.7: QoS implementation\n\nQoS is set of policies defined in the storage\
    \ system, based on service level agreements (SLA) for different application’s\
    \ incoming I/O requests. This is to ensure an application gets its predefined\
    \ share of resources when there is a demand for it. QoS policies are typically\
    \ implemented for virtual volume or group of virtual volumes, host or group of\
    \ hosts and at system level. Policies mainly set minimum and maximum IOPS, bandwidth\
    \ and latency for different workload pattern.\n\n![Figure 6.8: QoS implementation](images/Fig_6.8.jpg)\n\
    \nFigure 6.8: QoS implementation\n\n## Clone file blocks and zero file blocks\n\
    \nDuring usual copy data from one volume to other, server first reads the data\
    \ and then writes to destination volumes.\n\n![Figure 6.9: Regular copy operation](images/Fig_6.9.jpg)\n\
    \nFigure 6.9: Regular copy operation\n\nThe clone file blocks feature allows an\
    \ initiator to copy a large number of disk blocks without needing to transfer\
    \ the data between the storage volume and the server.\n\n![Figure 6.10: XCOPY\
    \ operation](images/Fig_6.10.jpg)\n\nFigure 6.10: XCOPY operation\n\nT10 SCSI\
    \ EXTENDED COPY (XCOPY) specification describes this feature in detail.\n\nSimilarly\
    \ the zero file blocks feature allows an initiator to zero a large number of disk\
    \ blocks without needing to transfer a large number of zeroed buffers. This is\
    \ based on T10 SCSI WRITE SAME (WSAME) specification.\n\nOperating systems, such\
    \ as Microsoft Windows 2012 or later and VMWare vSphere ESXi internally uses these\
    \ storage features that accepts these SCSI commands to offload specific data copy\
    \ and storage management operations to improve performance.\n\n## Conclusion\n\
    \nStorage performance is an important aspect of a storage system, meaning how\
    \ fast storage system can respond to host server’s read/write requests.\n\nStorage\
    \ performance is determined using throughput and latency. Throughput is number\
    \ of I/O requests processed per unit time. And latency is time taken to complete\
    \ a single I/O operation.\n\nData transfer rate, amount of data transferred per\
    \ unit time, is also another way to measure load on the storage system. MBps,\
    \ TB per hour are the units of data transfer rate."
