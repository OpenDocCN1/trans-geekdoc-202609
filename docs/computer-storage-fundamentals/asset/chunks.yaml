    \n# 第 2 章：存储基础设施\n\n## 简介\n\n随着存储虚拟化的发展，当今的基础设施更多地是由软件驱动而非硬件驱动。然而，硬件和软件组件在存储解决方案中都发挥着重要作用。软件不仅用于管理硬件，而且每项存储特性和功能都是通过软件实现的。因此，两者紧密集成以提供所需的解决方案。固件是一种软件，通常涉及基本的低级操作，使硬件设备能够正常工作。在存储解决方案中，几乎所有硬件组件都嵌入了固件。\n\
    \n## 结构\n\n完成本章学习后，您将能够了解存储基础设施的以下关键领域：\n\n• 存储、网络和主机层\n• 存储系统的物理布局和组件\n• 网络硬件组件\n\
    • 主机服务器\n• 主机总线适配器\n• 软件定义存储\n• 存储基础设施安全\n• 存储基础设施管理\n\n## 目标\n\n在本章中，您将了解在数据中心中部署和配置的不同硬件设备和软件组件，以实现存储解决方案。\n\
    \n本章解释了存储系统的所有物理组件及其内部连接，以及存储网络和主机服务器的存储组件。\n\n此外，本章还解释了存储软件定义存储 (SDS) 的概念。\n\n\
    ## 构建存储解决方案\n\n存储解决方案通过网络将一台或多台主机服务器与存储系统连接来实现。该网络由光纤通道 (FC) 或以太网交换机组成。\n\n广义上讲，构建存储解决方案使用以下五类硬件和软件：\n\
    \n• **存储系统**：存储系统是一种通过网络连接到计算机以存储数据的硬件设备。存储磁盘阵列是存储系统的一个例子。存储磁盘阵列拥有一组磁盘驱动器，用于存储大量数据。虽然磁盘阵列常被称为存储系统，但备份和磁带设备也被称为存储系统。\n\
    \n![Figure 2.1: Storage System](img/Fig_2.0a.png)\n\n*图 2.1：存储系统*\n\n备份和磁带设备用于存储主数据的副本；计算机内存和其他计算机内部存储不称为存储系统。\n\
    \n在存储解决方案中，存储系统是目标设备。\n\n• **主机服务器**：在这些计算机服务器上运行的应用程序对存储在存储系统上的数据执行读写操作。这也称为应用服务器、主机计算机或简称为主机。\n\
    \n在存储解决方案中，主机服务器是发起设备。\n\n![Figure 2.2: Host Server](img/Fig_2.0b.jpg)\n\n*图 2.2：主机服务器*\n\
    \n在某些存储解决方案中，主机服务器不托管任何应用程序，而是直接访问存储系统，这些被称为客户端系统。例如，手机访问对象存储系统进行读写操作。在这里，手机是一个客户端系统。\n\
    \n• **交换机**：主机服务器和存储系统连接到交换机以形成网络。网络允许主机服务器与存储系统通信。此网络不用于主机服务器之间的通信。\n\n![Figure\
    \ 2.3: Switch](img/Fig_2.0c.png)\n\n*图 2.3：交换机*\n\n• **主机总线适配器 (HBA)**：这是安装在主机服务器内部以连接到交换机的适配器。第\
    \ 5 章“共享存储的存储网络”将详细讨论该组件。HBA 一词主要用于 FC 环境。在 NAS 解决方案中，主机服务器本身的网络接口卡 (NIC) 可用作\
    \ HBA。\n\n![Figure 2.4: Host Bus Adapter (HBA)](img/Fig_2.0d.jpg)\n\n*图 2.4：主机总线适配器\
    \ (HBA)*\n\n• **管理软件应用程序**：需要一套软件产品来管理和监控存储解决方案。没有这组软件产品，存储解决方案就是不完整的。使用管理软件，存储管理员创建存储卷并提供对主机服务器的访问。然后配置应用程序将其数据存储到卷上。\n\
    \n![Figure 2.5: Management software](img/Fig_2.0e.png)\n\n*图 2.5：管理软件*\n\n## 硬件和软件组件栈\n\
    \n为了更详细地了解存储解决方案的每个组件，让我们将解决方案分为三个不同的层——存储层、网络层和主机层。下表列出了每层的硬件、固件和软件组件：\n\n| 层\
    \ | 硬件 | 固件和软件 |\n|-------|----------|----------------------|\n| 主机 | 主机服务器、HBA、小型可插拔封装\
    \ (SFP) | HBA 固件和驱动程序、适配器管理软件、多路径驱动程序、存储工具 |\n| 网络 | FC 交换机或局域网交换机、SFP、线缆和连接器\
    \ | 交换机固件、交换机管理软件 |\n| 存储 | 磁盘阵列控制器、物理磁盘驱动器、磁盘机箱、后端交换机和连接器 | 磁盘阵列控制器固件、磁盘固件、存储系统管理软件、性能调优和监控软件、快照管理软件、复制管理软件、数据保护和恢复软件\
    \ |\n\n*表 2.1：存储硬件和软件组件栈*\n\n存储解决方案涉及四种主要类型的供应商——存储供应商、交换机供应商、服务器供应商和 HBA 供应商。固件和软件仅由相应的硬件供应商开发。\n\
    \n## 存储磁盘阵列的物理布局\n\n通常，任何存储磁盘阵列都包含以下六个硬件组件：\n\n• 机架\n• 后端\n• 交换机\n• 控制器\n• 硬盘机箱\n\
    • 磁盘驱动器\n\n![Figure 2.6: Storage system hardware components](img/Fig_2.2.jpg)\n\
    \n*图 2.6：存储系统硬件组件*\n\n### 存储控制器\n\n处理来自主机服务器的 I/O 请求并对后端物理磁盘驱动器执行读写操作的主要硬件组件。不同供应商对该组件有不同的称呼——节点、存储处理器等。\n\
    \n控制器本身就是一台计算机，包含：\n\n• CPU\n• 内存\n• 用于更快存储用户数据的缓存内存\n• 专用集成电路 (ASIC)\n• 定制操作系统，也称为固件\n\
    • 接口或端口——通常，一个控制器具有：\n  - 前端或主机端口——用于连接到网络或 FC 交换机\n  - 后端或设备端口——用于连接到硬盘机箱\n \
    \ - 镜像或心跳端口——将所有控制器互连在一起\n\n一些供应商制造带有指定端口的控制器，而另一些供应商允许用户根据需求配置端口。任何控制器中的端口数量取决于供应商的产品设计及其型号。\n\
    \n大多数供应商的存储系统中有两个或更多控制器，以通过负载均衡获得更好的容错能力和性能。\n\n![Figure 2.7: Storage controller\
    \ components](img/Fig_2.3.png)\n\n*图 2.7：存储控制器组件*\n\n在上图中，HP 代表主机端口，DP 代表设备端口。不同的存储供应商对这些端口使用不同的名称。\n\
    \n### 物理磁盘驱动器\n"
