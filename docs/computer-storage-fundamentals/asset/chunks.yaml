    # Virtual Volume Family and Snapshots


    Virtual volume along with all its snapshots is called virtual volume family.


    Depending on the storage system design, vendors set the maximum limit of the number
    of snapshots that can be created for a virtual volume.


    ![Figure 7.11: Snapshot of snapshot](images/Fig_7.11.jpg)


    *Figure 7.11: Snapshot of snapshot*


    ## Clone


    The clone is another technology to create a copy of the data on a virtual volume.
    The clone is the same as a snapshot at the time of creation, but data blocks get
    copied in the background and eventually, the clone becomes a separate and independent
    volume from the parent volume.


    ![Figure 7.12: Clone creation](images/Fig_7.12.jpg)


    *Figure 7.12: Clone creation*


    ### Step A


    As a first step of clone creation, all blocks point to corresponding blocks in
    the parent volume. This is similar to a snapshot.


    Some vendors allow host access to the clone at this stage itself.


    ### Step B


    After the creation of the clone, blocks start copying from the parent to the newly
    created clone volume in the background. Depending on the size of the volume, the
    data in it, and the system load, this process may take a significant amount of
    time.


    ![Figure 7.13: Background copy process](images/Fig_7.13.png)


    *Figure 7.13: Background copy process*


    ### Step C


    Once the background copy process is completed, the clone becomes separate and
    independent from the parent volume. Now, the clone will have the same data as
    the parent volume at the time of the clone''s creation.


    ![Figure 7.14: Clone separation](images/Fig_7.14.jpg)


    *Figure 7.14: Clone separation*


    Since the clone is an independent volume from the parent, the primary advantage
    of a clone compared to a snapshot is that it provides protection of data even
    in the case of physical failures of the parent volume. However, for successful
    creation of a clone, an amount of free space equal to that of the parent volume
    is needed in the storage system.


    ### Clone Sync Operation


    Most modern storage systems also allow synchronous operation of a clone to its
    parent volume at regular intervals, just to copy the difference in data since
    it was last synced. For example, a clone was created on Monday at 10:00 PM; when
    it is synced with the parent on Tuesday at 10:00 PM, instead of copying the entire
    data again, only the blocks that have changed since Monday 10:00 PM to Tuesday
    10:00 PM are copied. The clone can be synced again on Wednesday, and so on.


    During a sync operation, the application must be stopped and the host must discontinue
    accessing the clone volume. This sync process helps applications that use the
    clone for analysis or report generation have access to up-to-date data without
    creating a new clone every time.


    ## Remote Replication


    Technologies that copy data from one storage system to another are called remote
    replication. This is typically implemented between two storage systems that are
    geographically apart. In case a disaster strikes, such as a flood, earthquake,
    or fire at either site, the application can switch over to the surviving site
    and continue its operations. Therefore, a remote replication solution is also
    referred to as a disaster recovery solution. Large enterprise organizations, which
    deal with business-critical applications, implement this solution to ensure their
    business continuity in case of any disaster.


    ![Figure 7.15: Storage remote replication](images/Fig_7.15.png)


    *Figure 7.15: Storage remote replication*


    Different vendors use different terminologies to name this pair of storage systems,
    such as source and target, local and remote, primary and secondary storage pairs.


    Hosts write data to the virtual volumes in the source array, and the array copies
    the data to the virtual volumes in the destination array. I/O ordering is important
    to maintain across the virtual volumes used by an application. A replication group
    is a logical entity that consists of source and target virtual volume pairs. This
    concept is to configure an application''s data on all the virtual volumes in a
    replication group. A replication group ensures I/O consistency on the destination
    array in the event of a failure of the source array.


    In the following example, `S_Vol1` and `T_Vol1` volumes of the same size make
    a replication pair, and `S_Vol2` and `T_Vol2` also make another replication pair,
    and so on. An application can be configured to use multiple volumes. For example,
    a database requires a minimum of three volumes for data, log, and archive. In
    this case, one replication group needs to be configured, consisting of three replication
    pairs for data, log, and archive.


    ![Figure 7.16: Replication group concept](images/Fig_7.16.png)


    *Figure 7.16: Replication group concept*


    In replication, failover reverses the replication direction for a replication
    group. The destination array assumes the role of the source, and the source array
    assumes the role of the destination. Similarly, failback sets the replication
    direction back to the original. Failover and failback are done as part of planned
    maintenance or after any unplanned failures.


    A storage system can have multiple replication groups to configure different applications
    on each group.


    To achieve load balancing and utilize both storage systems effectively, most vendors
    support bi-directional replication. One or more applications can be configured
    on each storage system, and the other storage system can be used as the destination
    storage.


    ![Figure 7.17: Bi-directional remote replication](images/Fig_7.17.png)


    *Figure 7.17: Bi-directional remote replication*


    There are typically two different modes of replicating data from source to destination
    storage systems: synchronous and asynchronous.


    ### Synchronous Replication


    ![Figure 7.18: Synchronous replication operations](images/Fig_7.18.png)


    *Figure 7.18: Synchronous replication operations*


    The following is the step-by-step process that takes place in synchronous replication:


    1. **Step 1:** First, the host writes data to the source storage.

    2. **Step 2:** The source storage writes and then sends data to the destination
    storage.

    3. **Step 3:** The destination storage sends an ACK to the source storage.

    4. **Step 4:** The source storage sends an ACK to the host server.


    In synchronous replication, the write I/O completion status is not returned to
    the host until both the source and destination storage systems have written the
    data. Data is mirrored in real-time. Applications for which data consistency is
    crucial require synchronous replication. Since data is replicated in real-time,
    this mode of replication can increase the response time to the host if a higher
    bandwidth link is not used for replication.


    Synchronous mode of replication is commonly referred to as sync replication.


    ### Asynchronous Replication


    ![Figure 7.19: Asynchronous replication operations](images/Fig_7.19.jpg)


    *Figure 7.19: Asynchronous replication operations*


    The following is the step-by-step process that takes place in asynchronous replication:


    1. **Step 1:** First, the host writes data to the source storage.

    2. **Step 2:** The source storage writes, stores the data in a temporary location,
    and then sends an ACK to the host server.

    3. **Step 3:** The source storage sends data to the destination storage.

    4. **Step 4:** The destination storage sends an ACK to the source storage.


    Steps 3 and 4 are independent of Steps 1 and 2.


    In asynchronous replication, the I/O completion status is returned when the local
    write completes. Destination writes are deferred until later. Unwritten data is
    stored temporarily on the source storage system''s cache memory or any temporary
    disk space.


    The primary disadvantage of this mode of replication is that unsent data from
    the source to the destination is at risk if the source system fails, but it improves
    host write performance, as the ACK is sent immediately after writing to the local
    storage system.


    Some storage vendors implement asynchronous replication through snapshots. A snapshot
    gets created at a user-defined time interval, and the data on it is copied to
    the remote storage system.


    In asynchronous replication, frequent updates to the same block of data are replicated
    only once to the destination within the update period, whereas in synchronous
    replication, every update, even for the same block, gets replicated every time.

    '
  trans: '


    # 虚拟卷家族与快照


    虚拟卷及其所有快照称为虚拟卷家族。


    根据存储系统设计，厂商设定了可为虚拟卷创建的快照数量的最大限制。


    ![Figure 7.11: Snapshot of snapshot](img/Fig_7.11.jpg)


    *图 7.11：快照的快照*


    ## 克隆


    克隆是创建虚拟卷上数据副本的另一种技术。克隆在创建时与快照相同，但数据块会在后台复制，最终克隆会成为独立于父卷的独立卷。


    ![Figure 7.12: Clone creation](img/Fig_7.12.jpg)


    *图 7.12：克隆创建*


    ### 步骤 A


    作为克隆创建的第一步，所有块指向父卷中的相应块。这类似于快照。


    某些厂商允许在此阶段主机即可访问克隆。


    ### 步骤 B


    克隆创建后，块开始在后台从父卷复制到新创建的克隆卷中。根据卷的大小、其中的数据以及系统负载，此过程可能需要大量时间。


    ![Figure 7.13: Background copy process](img/Fig_7.13.png)


    *图 7.13：后台复制过程*


    ### 步骤 C


    后台复制过程完成后，克隆将从父卷中分离并变得独立。现在，克隆将拥有与克隆创建时父卷相同的数据。


    ![Figure 7.14: Clone separation](img/Fig_7.14.jpg)


    *图 7.14：克隆分离*


    由于克隆是独立于父卷的卷，因此与快照相比，克隆的主要优势在于即使父卷发生物理故障，它也能提供数据保护。但是，要成功创建克隆，存储系统中需要有等同于父卷大小的可用空间。


    ### 克隆同步操作


    大多数现代存储系统还允许定期将克隆与其父卷同步操作，仅复制自上次同步以来的数据差异。例如，克隆于周一晚上 10:00 创建；当它于周二晚上 10:00 与父卷同步时，不会再次复制所有数据，而是仅复制自周一
    10:00 至周二 10:00 期间发生变化的块。克隆可在周三再次同步，以此类推。


    在同步操作期间，应用程序必须停止，主机必须停止访问克隆卷。此同步过程有助于使用克隆进行分析或报表生成的应用程序访问最新数据，而无需每次都创建新克隆。


    ## 远程复制


    将数据从一个存储系统复制到另一个存储系统的技术称为远程复制。这通常在地理位置分离的两个存储系统之间实施。如果任一站点发生洪水、地震或火灾等灾难，应用程序可切换到幸存站点并继续运行。因此，远程复制解决方案也称为灾难恢复解决方案。处理业务关键型应用程序的大型企业组织会实施此解决方案，以确保在发生任何灾难时的业务连续性。


    ![Figure 7.15: Storage remote replication](img/Fig_7.15.png)


    *图 7.15：存储远程复制*


    不同厂商使用不同的术语来命名这对存储系统，例如源端和目标端、本地和远程、主存储和辅助存储对。


    主机将数据写入源阵列中的虚拟卷，阵列将数据复制到目标阵列中的虚拟卷。跨应用程序使用的虚拟卷保持 I/O 顺序非常重要。复制组是一个逻辑实体，由源和目标虚拟卷对组成。此概念旨在将应用程序的数据配置在复制组中的所有虚拟卷上。在源阵列发生故障时，复制组可确保目标阵列上的
    I/O 一致性。


    在以下示例中，大小相同的 `S_Vol1` 和 `T_Vol1` 卷组成一个复制对，`S_Vol2` 和 `T_Vol2` 组成另一个复制对，以此类推。应用程序可配置为使用多个卷。例如，数据库至少需要三个卷用于数据、日志和归档。在这种情况下，需配置一个复制组，包含用于数据、日志和归档的三个复制对。


    ![Figure 7.16: Replication group concept](img/Fig_7.16.png)


    *图 7.16：复制组概念*


    在复制中，故障切换会反转复制组的复制方向。目标阵列承担源角色，源阵列承担目标角色。同样，故障恢复将复制方向恢复为原始状态。故障切换和故障恢复作为计划内维护或非计划故障后的一部分进行。


    一个存储系统可拥有多个复制组，以在每个组上配置不同的应用程序。


    为实现负载均衡并有效利用两个存储系统，大多数厂商支持双向复制。可在每个存储系统上配置一个或多个应用程序，另一个存储系统可用作目标存储。


    ![Figure 7.17: Bi-directional remote replication](img/Fig_7.17.png)


    *图 7.17：双向远程复制*


    通常有两种不同的模式将数据从源存储系统复制到目标存储系统：同步和异步。


    ### 同步复制


    ![Figure 7.18: Synchronous replication operations](img/Fig_7.18.png)


    *图 7.18：同步复制操作*


    同步复制中发生的分步过程如下：


    1. **步骤 1：** 首先，主机将数据写入源存储。

    2. **步骤 2：** 源存储写入数据，然后将数据发送到目标存储。

    3. **步骤 3：** 目标存储向源存储发送 ACK。

    4. **步骤 4：** 源存储向主机服务器发送 ACK。


    在同步复制中，直到源和目标存储系统均写入数据后，写 I/O 完成状态才会返回给主机。数据实时镜像。对数据一致性要求至关重要的应用程序需要同步复制。由于数据实时复制，如果未使用更高带宽的链路进行复制，此复制模式会增加主机的响应时间。


    同步复制模式通常称为同步复制。


    ### 异步复制


    ![Figure 7.19: Asynchronous replication operations](img/Fig_7.19.jpg)


    *图 7.19：异步复制操作*


    异步复制中发生的分步过程如下：


    1. **步骤 1：** 首先，主机将数据写入源存储。

    2. **步骤 2：** 源存储写入数据，将数据存储在临时位置，然后向主机服务器发送 ACK。

    3. **步骤 3：** 源存储将数据发送到目标存储。

    4. **步骤 4：** 目标存储向源存储发送 ACK。


    步骤 3 和 4 独立于步骤 1 和 2。


    在异步复制中，本地写入完成时返回 I/O 完成状态。目标写入延迟到稍后进行。未写入的数据临时存储在源存储系统的缓存内存或任何临时磁盘空间中。


    此复制模式的主要缺点是，若源系统故障，未从源发送到目标的数据将面临风险，但它提高了主机写入性能，因为在写入本地存储系统后立即发送 ACK。


    某些存储厂商通过快照实现异步复制。快照按用户定义的时间间隔创建，其上的数据复制到远程存储系统。


    在异步复制中，在更新周期内，对同一数据块的频繁更新仅复制一次到目标端，而在同步复制中，每次更新（即使是同一块）每次都会被复制。


