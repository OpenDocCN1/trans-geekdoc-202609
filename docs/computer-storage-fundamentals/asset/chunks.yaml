    # Storage Technology Examination Questions


    ### Question 23

    Assuming a RAID volume has 10 disks, which of the following RAID levels is the
    most fault tolerant?


    - a. RAID 5

    - b. RAID 6

    - c. RAID 1+0

    - d. RAID 0+1


    ### Question 24

    Assigning a hot spare to a RAID 0 volume is:


    - a. Meaningful

    - b. Meaningless


    ### Question 25

    My manager is planning to store some extremely critical data and given me just
    4 disks. Which RAID level should I go for:


    - a. RAID 1+0

    - b. RAID 0+1

    - c. RAID 6

    - d. RAID 5


    ### Question 26

    In storage virtualized environment, location of the data on physical storage is
    known through:


    - a. Cabling

    - b. Metadata

    - c. Controller

    - d. Cache memory


    ### Question 27

    Which is not a benefit of storage virtualization?


    - a. Improved data availability

    - b. Simple implementation

    - c. Improved storage utilization

    - d. Non-disruptive data migration


    ### Question 28

    Which statement is not true for an active/passive storage?


    - a. Owning controller accepts the host I/O request for the LUN

    - b. LUN gets transferred to non-owning controller, if owning controller fails

    - c. Non-owning controller accepts host I/O request for the LUN

    - d. Mirrored cache can be disabled for a LUN


    ### Question 29

    Which statement is not true for an Active-Active storage?


    - a. Owning controller accepts the host I/O request for the LUN

    - b. LUN gets transferred to non-owning controller, if owning controller fails

    - c. Non-owning controller accepts host I/O request for the LUN

    - d. Mirrored cache can be disabled for a LUN


    ### Question 30

    Battery backup is required mainly for:


    - a. Write cache

    - b. Read cache

    - c. Read and write both

    - d. Read or write cache


    ### Question 31

    Which one of the following are true. Data read from the physical disks is also
    stored into read cache, because:


    - a. For faster processing of current read request

    - b. In case, data is lost, can be found in cache

    - c. If the host requests the same data again, the data can be supplied from cache

    - d. If one controller fails, other controller can find the data in its cache


    ### Question 32

    In write-through technique, data is stored in cache, because:


    - a. For faster processing of write request

    - b. In case, data is lost, can be found in cache

    - c. If host does read request for the same data, the data can be supplied from
    cache

    - d. If one controller fails, other controller can find the data in its cache


    ### Question 33

    In mirrored write-back mode, The I/O is considered to be completed once the data
    is written:


    - a. In owning controller’s cache

    - b. In non-owning controller’s cache

    - c. In both controller’s cache

    - d. To backend disks


    ### Question 34

    Which of the following statements is true for an active/standby storage:


    - a. Data is written to the primary controller’s cache, then to the secondary
    controller‘s cache, complete status is sent to the host and then data is written
    to the disk

    - b. Both controllers accept host requests, but only owned controller interacts
    with backend disks

    - c. One of two controllers is in always idle state and wakes up when other controller
    dies.

    - d. Both controllers serve I/O, but only for the LUNs that they own


    ### Question 35

    Which two of the following statements are true for an Asynchronous Active-Active
    Storage?


    - a. Data is written to the primary controller’s cache, then to the secondary
    controller‘s cache, complete status is sent to the host and then data is written
    to the disk

    - b. Both controllers accept host requests for a given LUN, but only owned controller
    interacts with backend disks

    - c. One of two controllers is always in idle state and wakes up when other controller
    dies.

    - d. Both controllers read and write I/O for all the LUNs irrespective of their
    ownership


    ### Question 36

    Which of the following statements are true for ‘True’ Active/Active Storage?


    - a. Both controllers accept host requests for a given LUN, but only owned controller
    interacts with backend disks

    - b. Both controllers read and write I/O for all the LUNs irrespective of their
    ownership

    - c. One of two controllers is in idle state and wakes up when other controller
    dies

    - d. Both controllers serve I/O, but only for the LUNs that they own


    ### Question 37

    Which statement is incorrect in a non-virtualized storage environment?


    - a. Entire disk is mapped to a host. This may be larger than requirement, thus
    wasting space

    - b. Unused space cannot be used by another host

    - c. Improved storage performance achieved

    - d. If the disk fails, data is lost


    ### Question 38

    Where virtualization can be done?


    - a. At host level

    - b. At network level

    - c. At storage level

    - d. Any of the above levels


    ### Question 39

    Challenges in storage virtualization implementation compared to traditional non-virtualized
    storage are (choose two).


    - a. Multiple level of virtualization – host, network, and storage levels

    - b. Fault isolation

    - c. Components are at multiple layers–hosts, network, storage controller, disks

    - d. Metadata design


    ### Question 40

    What is hot-sparing?


    - a. A spare device to remove and replace a device manually.

    - b. A spare device is available in the subsystem operation without having to
    remove and replace a device.

    - c. A spare device to be removed and inserted into a subsystem without turning
    off the system.

    - d. A spare device to be removed and inserted into a subsystem, when its tuned
    off.


    ### Question 41

    A technique that splits up the stored data among the available drives is called
    what?


    - a. Error checking and correcting

    - b. Parity

    - c. Striping

    - d. Mirroring


    ### Question 42

    Mirror cache is implemented in a storage system mainly to improve:


    - a. Fault tolerant

    - b. Performance

    - c. Space efficiency

    - d. All of the above


    ### Question 43

    Which of the following two statements are true for an active/passive storage?


    - a. Data is written to the primary controller’s cache, then to the secondary
    controller‘s cache, complete status is sent to the host and then data is written
    to the disk

    - b. Both controllers accept host requests for a given LUN, but only owned controller
    interacts with backend disks

    - c. One of two controllers is always in idle state and wakes up when other controller
    dies.

    - d. Both controllers serve I/O, but only for the LUNs that they own


    ### Question 44

    Which one is the default SCSI ID for SCSI HBA?


    - a. 0

    - b. 1

    - c. 2

    - d. 7


    ### Question 45

    If you lose the data in cache due to some reason, what impact would you like to
    expect?


    - a. Your application would not read the data for sure

    - b. Your application may or may not be able to read the data; depending on the
    lost data is just an update of existing data or a portion of required data

    - c. No impact at all


    ### Question 46

    When metadata gets corrupted or lost, what impact would you like to expect?


    - a. Read/write operations would be prevented–storage device would become inaccessible

    - b. You would not be able to read the right and expected data and write the data
    on right location of the physical disks

    - c. No Impact at all


    ### Question 47

    Is it possible to have a storage device from heterogeneous storages at host-based
    virtualization?


    - a. Yes

    - b. No


    ### Question 48

    One of the disks in a mirrored volume set has been removed due to drive failure.
    What will be the status of the volume?


    - a. Degraded

    - b. Failed

    - c. Missing

    - d. Healthy


    ### Question 49

    Which of the two statements are true about stripe size?


    - a. Granularity of data that is rebuilt in case of any drive failure.

    - b. Amount of data that is divided and then stored on all the drives of the array.

    - c. Granularity at which data is stored on one drive of the array before subsequent
    data is stored on the next drive of the array.

    - d. Stripe size is recommended to be close to the size of the system I/O request.


    ### Question 50

    LUN is logical unit of number, which represents:


    - a. The storage controller

    - b. The target port of storage controller

    - c. A path to a physical disk

    - d. A unit of storage disk


    ### Question 51

    Hot-swapping is basically?


    - a. Devices are not allowed to be removed and inserted into a system

    - b. Devices are allowed to be removed and inserted into a system without turning
    off the system

