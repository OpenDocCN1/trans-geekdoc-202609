    \ letter\n\nNow, data can be stored in D.\n\n### Case study 3: Configure and access\
    \ a NFS share from an NFS client\n\nLet us configure and access a NFS share from\
    \ an NFS client:\n\n#### Requirement\n\nVMWare vSphere ESXi host is connected\
    \ to a storage system which has both block and file capability. Network and SAN\
    \ zoning are already configured. Provide steps to create and configure NFS datastore\
    \ in host server.\n\n#### Analysis\n\nFollowing steps are followed to provision\
    \ storage space for NFS file storage:\n\nStep 1: Create NFS share in the storage\
    \ system. Refer product documentation for exact steps to create shares.\n\nStep\
    \ 2: Assign permission to share for desired user.\n\nStep 3: Mount the NFS share.\n\
    \nProcedure to provision block storage space to VMWare vSphere ESXi host is same\
    \ as other host type.\n\nIn storage system:\n\nStep 1: Creation of a host entry.\n\
    \nStep 2: Creation and presentation of virtual volume to the host.\n\nIn the host\
    \ server:\n\nStep 3: Scan and list for new disk. \n\nStep 4: Create VMFS file\
    \ system. \n\nStep 5: Mount the file system.\n\n#### Solution\n\nNFS Share configuration:\n\
    \nStep 1: Creation of NFS share:\n\nRefer storage system product document for\
    \ steps to create a storage volume and present to the host entry.\n\nStep 2: Mount\
    \ the NFS share:\n\nAlthough there are several methods available to configure\
    \ storage space in vSphere ESXi host, here only Center web client referred for\
    \ configuration share and disks.\n\nOpen Center Web Client or ESXi host vSphere\
    \ Client. Right click on the ESXi host, go to Storage menu, then New Datastore.\
    \ Select NFS option and provide NFS server details and share name to mount it.\n\
    \n![Figure 9.7: NFS datastore](images/Fig_9.3e.jpg)\n\nFigure 9.7: NFS datastore\n\
    \nBlock storage configuration via FC:\n\nFor block storage configuration, as a\
    \ first step, create host entry in storage system, create storage volume and present\
    \ it to host.\n\nTo gather WWPN of the FC HBA. Select the ESXi host, and go to\
    \ Storage tab and the select Storage Adapters.\n\n![Figure 9.8: WWPN of FC HBA](images/Fig_9.3f.jpg)\n\
    \nFigure 9.8: WWPN of FC HBA\n\nIn the host server:\n\nStep 3: Scan and list for\
    \ new disk.\n\nRight click on the ESXi host, go to Storage menu, then Rescan Storage.\
    \ Wait for completions rescan tasks.\n\nStep 4: Create VMFS file system.\n\nRight\
    \ click on the ESXi host, go to Storage menu, then New Datastore. Select NFS option\
    \ and provide NFS server details and share name to mount it.\n\n![Figure 9.9:\
    \ File system creation](images/Fig_9.3g.png)\n\nFigure 9.9: File system creation\n\
    \nStep 5: Mount the file system:\n\nGo to Related Objects and then Datastores\
    \ to check newly created datastore.\n\n![Figure 9.10: Datastore](images/Fig_9.3h.jpg)\n\
    \nFigure 9.10: Datastore\n\nNow, VMs can be deployed on to this new datastore.\n\
    \n## Learning check\n\n### Objective questions\n\n 1. A storage management software\
    \ is mainly used for:\n\n a. Managing the storage, such as creation, modifying\
    \ and deletion of objects\n\n b. Monitoring performance of a storage system\n\n\
    \ c. Applying host I/O load on to the storage system\n\n d. Monitoring health\
    \ of storage physical hardware components and the logical objects\n\n 2. Which\
    \ statement from the following is true, if the system running storage management\
    \ application is broken:\n\n a. Host application cannot do read/write operation\
    \ to storage system\n\n b. Further storage space cannot be provisioned to server\n\
    \n c. Remote replication to other storage would stop\n\n d. Scheduled backup operation\
    \ of existing LUNs cannot proceed\n\n 3. What component is a configuration management\
    \ element of an IP storage solution?\n\n a. HBA\n\n b. VSAN\n\n c. ISL\n\n d.\
    \ VLAN\n\n 4. Configuring a server to boot from an array in the SAN involves:\n\
    \n a. Presenting the boot LUN to the server’s HBA ports and configuring the OS\
    \ driver correctly to see the LUN.\n\n b. Presenting the boot LUN to the server’s\
    \ HBA ports and configuring the HBA card BIOS to boot from the LUN.\n\n c. Presenting\
    \ the boot LUN to the server’s HBA ports and only modifying the BIOS settings\
    \ on the server’s BIOS.\n\n d. None of the above\n\n 5. Sequence of management\
    \ task to provision storage to a server:\n\n a. Create virtual volume | assign\
    \ access of virtual volume to the host | create host | discover LUN at host\n\n\
    \ b. Create host | create virtual volume | assign access of virtual volume to\
    \ the host | discover LUN at host\n\n c. Assign access of virtual volume to the\
    \ host | create host | create virtual volume | discover LUN at host\n\n d. Discover\
    \ LUN at host | create host | create virtual volume | assign access of virtual\
    \ volume to the host\n\n 6. What are the main constrains of SCSI in storage networking\
    \ (Choose two)?\n\n a. Implementation complexity\n\n b. Deployment distance\n\n\
    \ c. Number of devices that can be interconnected\n\n d. Complex fault isolation\n\
    \n 7. Match the following:\n\ni. Volume 1. LUN\n\nii. Host 2. A host server\n\n\
    iii. Volume set 3. Host cluster\n\niv. Host set 4. An application\n\n a. (i) -\
    \ (1), (iii) - (2), (ii) - (4) and (iv) - (3)\n\n b. (i) - (1), (ii) - (2) , (iii)\
    \ - (3) and (iv) - (4)\n\n c. (ii) - (2), (i) - (1), (iii) - (4) and (iv) - (3)\n\
    \n d. (iv) - (1), (iii) - (2) , (i) - (4) and (ii) - (3)\n\n### Descriptive questions\n\
    \n 1\\. Describe commonly used storage management applications and their purposes.\n\
    \n 2. Describe the steps that are followed to configure storage space for a FC\
    \ host.\n\n 3. Describe the steps that are followed to configure storage space\
    \ for an iSCSI host.\n\n### Quiz questions\n\n 1\\. Will an application server\
    \ lose access to data, if management application crashes?\n\n 2. What are the\
    \ mandatory details required to create an iSCSI host entry in Storage?\n\n 3.\
    \ Which method requires user access credentials a NFS share or a SAN storage volume?\n\
    \n## Glossary and key terms\n\n*   Storage system management software: Software\
    \ that provisions and monitors storage system.\n\n*   Performance monitoring tool:\
    \ Monitors and collects performance data read/write operations.\n\n*   Snapshot\
    \ management software: Creates, deletes, and maintains storage snapshots.\n\n\
    *   Replication management software: The software that manages local or remote\
    \ replication solution.\n\n*   Data protection and recovery software: The software\
    \ that configure and schedules backup jobs to protect data on to a backup system.\n\
    \n*   Switch management software: The software that allows configuring and monitoring\
    \ the switches in the storage area network."
