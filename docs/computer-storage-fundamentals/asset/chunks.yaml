    \ this topology gets formed when a host server is directly connected to a storage\
    \ system.\n\n![Figure 4.5: Point-to-point topology](`images/Fig_4.5.png`)\n\n\
    *Figure 4.5: Point-to-point topology*\n\n### Switched Fabric\n\nIt is the most\
    \ commonly used FC topology. 16 million node ports can be interconnected. One\
    \ or more FC switches can be used to build a switched fabric.\n\n![Figure 4.6:\
    \ Switched fabric topology](`images/Fig_4.6.png`)\n\n*Figure 4.6: Switched fabric\
    \ topology*\n\nA switched fabric can have one or more switches connected.\n\n\
    ### Arbitrated Loop\n\n- Organizes up to 127 FC ports on a ring, and distributes\
    \ the routing functions among them.\n- `AL_PA` (Arbitrated Loop Physical Address)\
    \ is 1 byte assigned during loop initialization.\n- Loop initialization required\
    \ when a new device is added to a loop requiring an `AL_PA` to be assigned to\
    \ it.\n- In most FC-AL hubs, a bypass circuit removes the FC device out of FC-AL\
    \ loop topology when signaling is lost.\n- It is used less than the switched topology.\
    \ Some storage systems are designed to have AL to connect all physical disks in\
    \ its backend.\n- It also costs less than switched topology.\n\n![Figure 4.7:\
    \ AL topology](`images/Fig_4.7.png`)\n\n*Figure 4.7: AL topology*\n\n## Fibre\
    \ Channel Node and Port Types\n\n| Short name | Descriptive name | Device type\
    \ | Port function |\n| --- | --- | --- | --- |\n| `N_Port` | Node port | Node\
    \ | Port used to connect a node to an FC switch |\n| `F_port` | Fabric port |\
    \ Switch | Port used to connect the FC fabric to a node |\n| `L_port` | Loop port\
    \ | Node | Port used to connect a node to an FC loop |\n| `NL_port` | Node loop\
    \ | Nodes | Node port which connects to both arbitrated loops and switches |\n\
    | `FL_port` | Fabric + loop port | Switches | Switch port which connects to both\
    \ arbitrated loops and switches |\n| `E_port` | Expansion port | Switches | Used\
    \ to cascade FC switches together |\n| `G_port` | General port | Switches | General\
    \ purpose port which can be configured to emulate other port types |\n| `U_port`\
    \ | Universal port | Switches | Initial port state on a switch before anything\
    \ has connected; changes personality to an operational state (E_port, F_port,\
    \ FL_port) or a transitional state like a G_port |\n\n*Table 4.2: FC node and\
    \ port types*\n\n![Figure 4.8: FC node and port types](`images/Fig_4.8.png`)\n\
    \n*Figure 4.8: FC node and port types*\n\n## Fibre Channel Login Processes\n"
  trans: "\n\n# SCSI 协议\n\n服务器通过称为 SCSI 协议的协议与存储阵列进行通信。\n\n## 写请求\n\n1. 服务器向阵列发送 SCSI\
    \ 写请求。写请求告知阵列 I/O 的大小。\n\n![图 4.2：SCSI 写请求](img/Fig_4.2.png`)\n\n*图 4.2：SCSI 写请求*\n\
    \n2. 当阵列准备好接收数据时，它向服务器发送传输就绪。\n3. 服务器发送数据。\n4. 阵列确认收到数据。\n\n## 读请求\n\n1. 服务器向阵列发送\
    \ SCSI 读请求（读请求告知阵列 I/O 的大小，并通过块地址范围告知请求的是什么数据）。\n\n![图 4.3：SCSI 读请求](img/Fig_4.3.png`)\n\
    \n*图 4.3：SCSI 读请求*\n\n2. 阵列检索数据并将其发送给服务器。\n3. 完成后阵列返回状态。\n\n## 主机 I/O 超时\n\n主机应用程序和操作系统的设计初衷是，在存储系统响应延迟的情况下，重试读/写\
    \ I/O 请求。这些重试会在特定时间段内执行。该时间段称为应用程序或操作系统的**主机 I/O 超时**。\n\n## 并行 SCSI 与串行 SCSI\n\
    \n并行 SCSI 有两大缺点：在更快的总线速度下，管理复杂的信令和防止数据损坏变得更加困难。当你跨并行总线发送信号时，无法保证它们会同时到达目的地。因此，Ultra320\
    \ SCSI 的 80MHz 是并行 SCSI 中所能达到的最高传输速率。其次，为确保数据完整性，单端 SCSI 的最大电缆长度每当信号速度翻倍时就会减半。\n\
    \n在串行 SCSI 中，将 8 位或 16 位数据传输宽度更改为一次传输一位，乍看似乎是倒退了一步。然而，串行通信所允许的速度大幅提升扭转了这种带宽损失。\n\
    \n串行 SCSI 包括 SAS 和串行高级技术附件 (SATA) 解决方案。以下是并行 SCSI 和串行 SCSI 之间的一些区别：\n\n| 特性 |\
    \ 并行 SCSI | 串行 SCSI (Serial Attached SCSI–SAS) |\n| --- | --- | --- |\n| 架构 |\
    \ 并行，所有设备连接以共享总线。 | 串行，点对点，离散信号路径。使用端口扩展器 1 进行扇出。 |\n| 性能 | 最大速度 320 MBps (Ultra320\
    \ SCSI)。随着设备添加到共享总线，性能下降。速度在整个多点总线上共享。 | 基础速度为 3 Gbps，相当于 300 MBps 的数据通道，由于 SAS\
    \ 通道是全双工的，可翻倍至相当于 600 MBps。此外，您可以为每个设备使用多条路径来增加可用带宽。随着更多驱动器的添加，性能得以维持。 |\n| 可扩展性\
    \ | 每根电缆的设备数量受限于 SCSI ID，单通道为 8 或 16 个。 | 最多 128 个设备。使用扇出扩展器可达 16,384 个设备。 |\n\
    | 兼容性 | 与所有其他驱动器接口不兼容。 | 兼容 SATA。 |\n| 最大电缆长度 | 总计 12 米。可使用 SCSI 繁殖器超出此限制，但价格昂贵。\
    \ | 每个离散连接 8 米；总域布线可达数千英尺。 |\n| 电缆形态 | 大量导线增加体积和成本。 | 紧凑的连接器和布线节省空间和成本。 |\n| 设备标识\
    \ | 手动设置；用户必须确保总线上无 ID 号冲突。 | 制造时设置的全球唯一 ID 唯一标识设备；无需用户操作。 |\n| 终端 | 手动设置；用户必须确保终端器正确安装和工作。\
    \ | 离散信号路径使设备默认包含终端；无需用户操作。 |\n\n*表 4.1：并行 SCSI 与串行 SCSI*\n\n# 光纤通道基础\n\nFC 是一种网络技术，旨在促进主机服务器与存储设备之间的高速数据传输。T11\
    \ ([`www.t11.org`](http://www.t11.org/)) 是国际信息技术标准委员会 (INCITS) 的一个技术委员会，负责定义和维护\
    \ FC 规范的技术标准。\n\nFC 支持多种常见传输协议，包括 IP 和 SCSI。对多协议的支持使 FC 能够在单一封装中融合高速 I/O 与网络功能。要理解\
    \ FC，我们必须讨论网络与通道的概念。\n\nFC 承载或封装其他通信协议，如 SCSI-3、FICON (SBCCS)、IP、HiPPI 等。FC 就像道路的基石，而\
    \ SCSI-3、FICON 等则是沿道路运送数据货物的车辆。\n\n- FC 可同时承载多种协议以支持各类应用。\n- FC 之于 SAN，正如 Ethernet\
    \ 之于 LAN 甚至更甚：\n  - Ethernet 仅定义数据如何物理传输\n  - IP 等协议定义逻辑网络\n  - FC 同时定义物理和逻辑层面\n\
    \n![图 4.4：FC](img/Fig_4.4.png`)\n\n*图 4.4：FC*\n\n## 光纤通道拓扑\n\n结构是使用一个或两个交换机的节点形成的逻辑\
    \ FC 网络。FC 结构有三种拓扑：\n\n### 点对点\n\n- 两个节点端口具有相同的信令速率和服务等级。例如，当主机服务器直接连接到存储系统时，会形成此拓扑。\n\
    \n![图 4.5：点对点拓扑](img/Fig_4.5.png`)\n\n*图 4.5：点对点拓扑*\n\n### 交换结构\n\n这是最常用的 FC 拓扑。可互连\
    \ 1600 万个节点端口。可使用一个或多个 FC 交换机构建交换结构。\n\n![图 4.6：交换结构拓扑](img/Fig_4.6.png`)\n\n\
    *图 4.6：交换结构拓扑*\n\n交换结构可以有一个或多个相连的交换机。\n\n### 仲裁环\n\n- 在环上组织多达 127 个 FC 端口，并在它们之间分配路由功能。\n\
    - `AL_PA` (Arbitrated Loop Physical Address，仲裁环物理地址) 是环初始化期间分配的 1 字节地址。\n- 当新设备添加到环并需要分配\
    \ `AL_PA` 时，需要进行环初始化。\n- 在大多数 FC-AL 集线器中，当信号丢失时，旁路电路会将 FC 设备从 FC-AL 环拓扑中移除。\n\
    - 其使用频率低于交换拓扑。某些存储系统设计为使用 AL 连接其后端的所有物理磁盘。\n- 其成本也低于交换拓扑。\n\n![图 4.7：AL 拓扑](img/Fig_4.7.png`)\n\
    \n*图 4.7：AL 拓扑*\n\n## 光纤通道节点和端口类型\n\n| 简称 | 描述性名称 | 设备类型 | 端口功能 |\n| --- | ---\
    \ | --- | --- |\n| `N_Port` | 节点端口 | 节点 | 用于将节点连接到 FC 交换机的端口 |\n| `F_port` | 结构端口\
    \ | 交换机 | 用于将 FC 结构连接到节点的端口 |\n| `L_port` | 环端口 | 节点 | 用于将节点连接到 FC 环的端口 |\n| `NL_port`\
    \ | 节点环端口 | 节点 | 同时连接到仲裁环和交换机的节点端口 |\n| `FL_port` | 结构+环端口 | 交换机 | 同时连接到仲裁环和交换机的交换机端口\
    \ |\n| `E_port` | 扩展端口 | 交换机 | 用于级联 FC 交换机 |\n| `G_port` | 通用端口 | 交换机 | 可配置为模拟其他端口类型的通用端口\
    \ |\n| `U_port` | 通用端口 | 交换机 | 交换机上初始端口状态，在任何设备连接前；会变更为操作状态 (E_port、F_port、FL_port)\
    \ 或过渡状态 (如 G_port) |\n\n*表 4.2：FC 节点和端口类型*\n\n![图 4.8：FC 节点和端口类型](img/Fig_4.8.png`)\n\
    \n*图 4.8：FC 节点和端口类型*\n\n## 光纤通道登录过程\n\n"
