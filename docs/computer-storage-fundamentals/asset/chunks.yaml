    \ SCSI write request*\n\n2. When the array is ready to receive the data, it sends\
    \ a transfer ready to the server.\n3. The server sends the data.\n4. The array\
    \ acknowledges the receipt of the data.\n\n## Read Request\n\n1. Server sends\
    \ SCSI read request to the array (the read request telling the array what size\
    \ the I/O will be and what data is being requested via a block address range).\n\
