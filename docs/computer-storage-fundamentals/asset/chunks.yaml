- raw: "### Case study 1: Storage solution for user home directories\n\nLet us look\
    \ at the storage solution for user home directories:\n\n#### Requirement\n\nYour\
    \ company has about 1,000 employees. Each employee has an average of 7 to 8GB\
    \ of files, such as presentations, spreadsheet, word, and PDF documents on their\
    \ laptop and desktop. The company is planning to deploy a storage solution to\
    \ consolidate and centrally manage those files. Describe the storage solution\
    \ that is suitable for this requirement.\n\n#### Analysis\n\nSince the requirement\
    \ is to store only files, mid-range NAS solutions would be the most suitable solution.\
    \ 10GB network speed to the storage system can be recommended for the fast and\
    \ reliable access by multiple users. The current file storage requires approximately\
    \ 1000 x 10GB =~ 10TB of usable capacity. Considering future growth, at least\
    \ twice the size of this storage may be recommended.\n\n#### Solution\n\nThe file\
    \ storage with about 20TB usable space is needed to be procured to deploy a NAS\
    \ solution. All employees can access storage system via Ethernet network. The\
    \ schematic diagram for the proposed storage solution is shown as follows:\n\n\
    Storage type: File storage\n\nStorage solution: Mid-range NAS solution\n\nUsable\
    \ capacity: 20TB\n\nAccess bandwidth: 10GB/s\n\nSpace quota for each employee:\
    \ 20GB\n\n![Figure 1.17: Storage solution for user home director](images/Fig_1.15.png)\n\
    \nFigure 1.17: Storage solution for user home director\n\n### Case study 2: MSSQL\
    \ Database application on cluster host server solution\n\nLet us look at the MSSQL\
    \ Database application on cluster host server solution:\n\n#### Requirement\n\n\
    An organization wants to migrate from legacy database application on standalone\
    \ DAS solution to MSSQL application in a highly available cluster host server\
    \ environment. The database size is about 30TB, and describes the storage solution\
    \ that is suitable for this requirement.\n\n#### Analysis\n\nTo run database application,\
    \ the host servers require faster access to storage system. Mid-range SAN solutions\
    \ would be the most suitable solution from performance perspective. The host servers\
    \ in cluster can also share the space of the storage system. Considering future\
    \ growth, the storage with 50TB of capacity can be recommended.\n\n#### Solution\n\
    \nThe block storage with about 50TB usable space needed to be procured. To deploy\
    \ SAN solution, FC HBAs for host servers, and a FC switch along with cables and\
    \ connectors also needed to be procured. The schematic diagram for the proposed\
    \ storage solution is as follows:\n\nStorage type: Block storage\n\nStorage solution:\
    \ Mid-range SAN solution\n\nUsable capacity: 50TB\n\n![Figure 1.18: Storage solution\
    \ for host server cluster](images/Fig_1.16.png)\n\nFigure 1.18: Storage solution\
    \ for host server cluster\n\n### Case study 3: Virtual machines for test and development\
    \ purpose\n\nLet us look at virtual machines for test and development purpose:\n\
    \n#### Requirement\n\nA software vendor wants to deploy virtual machines for their\
    \ employees for their test and development activities. There are about 500 employees\
    \ and the size of the workspace is approximately 100GB. Describe the storage solution\
    \ that is suitable for this requirement.\n\n#### Analysis\n\nThe best storage\
    \ solution to deploy VMs is HCI. A hyper-converged system is preinstalled, configured\
    \ and tuned for deploying VMs.\n\nThis system is also efficient in space and power\
    \ consumption. The initial capacity requirement would be 500 x 100GB =~ 50TB.\n\
    \n#### Solution\n\nA high-end hyper-converged system with about 50TB space can\
    \ be procured to deploy HCI environment. If the vendor does not support 500 VMs\
    \ on single hyper-converged system, multiple hyper-converged systems can be purchased\
    \ and cluster among them to load balance and failover VMs in the event of failure\
    \ of any system.\n\n## Learning check\n\n### Objective questions\n\n 1. A storage’s\
    \ capability is measured mainly on:\n\n a. Fault tolerant\n\n b. Performance\n\
    \n c. Space efficiency\n\n d. All of the above\n\n 2. Which two sub-components\
    \ are required in a specialized NAS operating system? (Choose two)\n\n a. File\
    \ system\n\n b. User interface\n\n c. Process scheduler\n\n d. Communication protocols\n\
    \n 3. Which type of storage provides great performance:\n\n a. DAS\n\n b. NAS\n\
    \n c. SAN\n\n d. All of the above\n\n 4. Which is from the following list, the\
    \ main disadvantages of DAS?\n\n a. Scalability\n\n b. Cost\n\n c. Manageability\n\
    \n d. All of the above\n\n 5. Cloud Storage service is most suitable for:\n\n\
    \ a. Business critical application data\n\n b. Personal data–photos, videos\n\n\
    \ c. OLTP workload\n\n d. All of the above\n\n 6. Arrange these terms based on\
    \ their association:\n\n Block storage, Object storage, SAN, DAS, Cloud, Entry\
    \ level storage solution, High performance, Low cost, Saleable.\n\n a. Block storage\
    \ – SAN - High performance; Object storage – DAS – High Performance; Block Storage\
    \ – DAS – Cloud\n\n b. Block storage – DAS - High performance; Object storage\
    \ – Cloud - Scalable; Block Storage – DAS – Low cost\n\n c. Block storage – Cloud\
    \ - Scalable; Object storage – SAN – High Performance; Block Storage – DAS – Entry\
    \ level storage solution\n\n d. Block storage – SAN - High performance; Object\
    \ storage – Cloud - Scalable; Block Storage – DAS – Entry level storage solution\n\
    \n 7. Hyper-convergence is a type of infrastructure system that tightly integrates:\n\
    \n a. Compute\n\n b. Storage\n\n c. Network\n\n d. All of the above\n\n 8. Hyper-convergence\
    \ product can be built on a:\n\n a. Special storage array\n\n b. Vendor Specific\
    \ hardware\n\n c. Commodity server hardware\n\n d. Hard drive\n\n 9. Which storage\
    \ has the file system layer in it:\n\n a. DAS\n\n b. NAS\n\n c. SAN\n\n d. All\
    \ of the above\n\n### Descriptive questions\n\n 1. Describe pros and cons of SAN,\
    \ NAS and DAS storage solutions.\n\n 2. Explain the use cases of object storage\
    \ and storage solutions in which this storage is deployed.\n\n 3. Describe the\
    \ types of storage systems and their usages in related solutions.\n\n 4. Explain\
    \ how all the data is finally stored as blocks in a storage system.\n\n### Quiz\
    \ questions\n\n 1. Though there are different type of storage system, block, file\
    \ and object storage, does data in a storage system always stored as blocks finally.\n\
    \n 2. Where does file system reside in a NAS storage solution?\n\n 3. Is hyper-converge\
    \ a consolidation of storage system or storage solution?\n\n## Glossary and key\
    \ terms\n\n•  Host: The server that runs the application and accesses the storage\
    \ volume to store data. Also a logical entity in the storage system that represents\
    \ a host server. Virtual volumes are provided with access to it.\n\n•  Host servers:\
    \ An application server that accesses the storage system to store and performs\
    \ I/O operation on to a storage system.\n\n•  Client systems: Similar to host\
    \ server, but accesses files or objects on storage system. It does not serve to\
    \ other computers.\n\n•  Storage system: Pool of disk vers connected to storage\
    \ controllers that stores and performs I/O requests from host servers.\n\n•  Block\
    \ storage: Type of storage system on which host servers read and write data across\
    \ blocks.\n\n•  File storage: Type of storage system on which client systems reads\
    \ and writes data in to the shared files on it.\n\n•  Object storage: Type of\
    \ storage system which allows client system store data as an object. Object include\
    \ data along with a metadata and a unique identifier.\n\n•  SAN: SAN, a network\
    \ of storage devices and the initiators that store and retrieve data.\n\n•  NAS:\
    \ NAS, a storage system with file system in it. Client accesses files over network\
    \ stored on this storage.\n\n•  DAS: DAS, a storage that is directly connected\
    \ to host computer.\n\n•  Storage solution: Storage solution consists of host\
    \ server, storage system, switch, HBA, cable and connector and storage management\
    \ software that provides a solution to store application data for an organization.\n\
    \n•  Cloud storage: Typically, multiple object storages are deployed and connected\
    \ to internet. All client computers including mobile, tab, PC accesses the storage\
    \ to store data as an object."
