- raw: "Every switch vendor designs switch interfaces differently. Brocade switch\
    \ has GUI and command line interface (CLI) interface. Zone configuration can be\
    \ done using any of these interfaces. Product documentation can be referred to\
    \ understand command and their syntaxes.\n\nCLI commands and syntaxes for Brocade\
    \ FC switches are as follows:\n\nAlias creation:\n\n| Usage: alicreate “<Alias\
    \ Name”, “<WWPN>” |\n\n| --- |\n\n| Switch> alicreate \"Linux\\_Host\",\"50:01:43:80:24:27:5a:a8\"\
    \ |\n\n| --- |\n\nLinux\\_Host is the alias name assigned to the WWPN of the HBA\
    \ installed in Linux host server:\n\n| Switch>alishow Linux\\_Host  alias: Linux\\\
    _Host50:01:43:80:24:27:5a:a8Switch>Switch> alicreate “Windows\\_Host”,”10:00:70:10:6f:e8:77:6f”Switch>\
    \ alicreate “Storage\\_Ctrl1”,”20:11:00:02:ac:01:84:ea”Switch> alicreate “Storage\\\
    _Ctrl2”,”21:11:00:02:ac:01:84:ea”Switch> alicreate “Tape”,”50:01:43:80:28:ce:4a:7e”\
    \ |\n\n| --- |\n\nZone creation:\n\n| Switch> zonecreate \"Linux\\_Storage\",\"\
    Linux\\_Host;Storage\\_Ctrl1; Storage\\_Ctrl2\" |\n\n| --- |\n\nLinux\\_Storage\
    \ is the name assigned to the zone:\n\n| Switch> zoneshowzone: Linux\\_Storage\
    \ Linux\\_Host; Storage\\_Ctrl1;Storage\\_Ctrl2Switch>Switch> zonecreate \"Windows\\\
    _Storage\",\"Windows\\_Host;Storage\\_Ctrl1;Storage\\_Ctrl2\"Switch> zonecreate\
    \ |\n\n| --- |\n\n|  \"Windows\\_Tape\",\"Windows\\_Host;Tape\"Switch> |\n\nConfiguration\
    \ creation:\n\n| Switch> cfgcreate\"Zone\\_Config\",\"Linux\\_Storage;Windows\\\
    _Storage;Windows\\_Tape\" |\n\n| --- |\n\nZone\\_ Config is the name assigned\
    \ for the configuration:\n\n| Switch> cfgshow Zone\\_Config cfg: Zone\\_Config\
    \ Linux\\_Storage;Windows\\_Storage;Windows\\_TapeSwitch> |\n\n| --- |\n\nSaving\
    \ configuration:\n\n| Switch> cfgsave |\n\n| --- |\n\nEnabling the configuration:\n\
    \n| Switch> cfgenable \"Zone\\_Config\" |\n\n| --- |\n\nListing the configuration:\n\
    \n| Switch> cfgshowDefined configuration:cfg: Zone\\_Config Linux\\_Storage; Windows\\\
    _Storage; Windows\\_Tapezone: Linux\\_Storage Linux\\_Host; Storage\\_Ctrl1; Storage\\\
    _Ctrl2zone: Windows\\_Storage Windows\\_Host; Storage\\_Ctrl1; Storage\\_Ctrl2zone:\
    \ Windows\\_Tape Windows\\_Host; Tapealias: Linux\\_Host 50:01:43:80:24:27:5a:a8\
    \ |\n\n| --- |\n\n| alias: Windows\\_Host 10:00:70:10:6f:e8:77:6falias: Storage\\\
    _Ctrl1 20:11:00:02:ac:01:84:eaalias: Storage\\_Ctrl2 21:11:00:02:ac:01:84:eaalias:\
    \ Tape 50:01:43:80:28:ce:4a:7eEffective configuration:cfg: Zone\\_Configzone:\
    \ Linux\\_Storage 50:01:43:80:24:27:5a:a8 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:eazone:\
    \ Windows\\_Storage 10:00:70:10:6f:e8:77:6f 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:eazone:\
    \ Windows\\_Tape 10:00:70:10:6f:e8:77:6f 50:01:43:80:28:ce:4a:7eSwitch> |\n\n\
    As per effective configuration listed above, now, Linux and Windows both hosts\
    \ can access the storage system and only Windows system can access the tape device.\n\
    \n### Case study 2: Modifying existing zone configuration of a fabric with Brocade\
    \ FC switch\n\nLet us modify existing zone configuration of a fabric with Brocade\
    \ FC switch:\n\n#### Requirement\n\nAfter a few months of operation, your company\
    \ decided to deploy a VMWare vSphere ESXi host into the existing SAN. The new\
    \ host will share storage space of the existing storage system. Due to shortage\
    \ of port of the existing switch, a new Brocade switch is also procured.\n\nWWN\
    \ details of the FC adapter in ESXi host is 10:00:00:90:fa:55:9c:8b.\n\n![Figure\
    \ 5.12: Adding a host server in existing SAN via an ISL](images/Fig_5.12.jpg)\n\
    \nFigure 5.12: Adding a host server in existing SAN via an ISL\n\n#### Analysis\n\
    \nSince the company already has an operational SAN. To include a host server to\
    \ it, an available port is needed in the fabric. The new switch must be connected\
    \ to existing switch using an ISL. The ESXi host can be connected to new switch.\n\
    \nNew alias and zone must be created for the new host and added into the existing\
    \ zone configuration. Finally, the zone configuration must be enabled to have\
    \ new zone in effect.\n\n#### Solution\n\nConnect the new switch using a FC cable.\
    \ This is called ISL connection. This will automatically replicate the zone configuration\
    \ to new switch.\n\nAlias creation:\n\n| Switch> alicreate \"ESXi\\_Host\",\"\
    10:00:00:90:fa:55:9c:8b\"Switch> alishow ESXi\\_Host alias: ESXi\\_Host 10:00:00:90:fa:55:9c:8b\"\
    Switch> |\n\n| --- |\n\nZone creation:\n\n| Switch> zonecreate \"ESXi\\_Storage\"\
    ,\"ESXi\\_Host;Storage\\_Ctrl1;Storage\\_Ctrl2\"Switch> zoneshowzone: ESXi\\_Storage\
    \ ESXi\\_Host; Storage\\_Ctrl1; Storage\\_Ctrl2Switch> |\n\n| --- |\n\nZone addition\
    \ into an existing configuration:\n\n| Switch> cfgadd \"Zone\\_Config\",\"ESXi\\\
    _Storage\" |\n\n| --- |\n\nSaving configuration:\n\n| Switch> cfgsave |\n\n| ---\
    \ |\n\nEnabling the configuration:\n\n| Switch> cfgenable \"Zone\\_Config\" |\n\
    \n| --- |\n\nZone enable must be done during off-peak hours, as host read/write\
    \ traffic may get impacted.\n\nListing the configuration:\n\n| Switch> cfgshowDefined\
    \ configuration:cfg: Zone\\_Config ESXi\\_Storage; Linux\\_Storage; Windows\\\
    _Storage; Windows\\_Tapezone: ESXi\\_Storage ESXi\\_Host; Storage\\_Ctrl1; Storage\\\
    _Ctrl2zone: Linux\\_Storage Linux\\_Host; Storage\\_Ctrl1; Storage\\_Ctrl2zone:\
    \ Windows\\_Storage Windows\\_Host; Storage\\_Ctrl1; Storage\\_Ctrl2zone: Windows\\\
    _Tape Windows\\_Host; Tape |\n\n| --- |\n\n| alias: ESXi\\_Host 10:00:00:90:fa:55:9c:8balias:\
    \ Linux\\_Host 50:01:43:80:24:27:5a:a8alias: Windows\\_Host 10:00:70:10:6f:e8:77:6falias:\
    \ Storage\\_Ctrl1 20:11:00:02:ac:01:84:eaalias: Storage\\_Ctrl2 21:11:00:02:ac:01:84:eaalias:\
    \ Tape 50:01:43:80:28:ce:4a:7e |\n\n| Effective configuration:cfg: Zone\\_Configzone:\
    \ ESXi\\_Storage 10:00:00:90:fa:55:9c:8b 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:eazone:\
    \ Linux\\_Storage 50:01:43:80:24:27:5a:a8 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:eazone:\
    \ Windows\\_Storage 10:00:70:10:6f:e8:77:6f 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:eazone:\
    \ Windows\\_Tape 10:00:70:10:6f:e8:77:6f 50:01:43:80:28:ce:4a:7eSwitch> |\n\n\
    As per effective configuration listed above, now Linux and Windows both hosts\
    \ can access the storage system and only Windows system can access the tape device.\n\
    \n### Case study 3: Virtual volume presentation in a host server cluster environment\n\
    \nLet us look at virtual volume presentation in a host server cluster environment:\n\
    \n#### Requirement\n\nAn organization is planning to have four host servers in\
    \ the cluster. Oracle database would be configured on all of them. Space requirement\
    \ for database is 10 TB for data files, 2 TB for archive log and 500 GB for redo\
    \ logs.\n\n![Figure 5.13: Host server cluster environment](images/Fig_5.13.jpg)\n\
    \nFigure 5.13: Host server cluster environment\n\n#### Analysis\n\nSince application\
    \ running on cluster members are going to access same database, same storage volumes\
    \ requires to be presented to all four cluster members. As a best practice of\
    \ zoning, all the host servers and storage can be in single zone.\n\n#### Solution\n\
    \nFollowing steps can be followed to implement storage solution as described in\
    \ the requirement:\n\n1\\. Create a single zone with WWPN of all four host server\
    \ members and storage system.\n\n2\\. Create three virtual volumes in storage\
    \ system:\n\n a. DataVol: 10 TB\n\nb. ArchVol: 2 TB\n\n c. RedoVol: 500 GB\n\n\
    3\\. Present each volume to all four host servers with same LUN ID. For example,\
    \ DataVol with LUN ID 1, ArchVol with LUN ID 2 and RedoVol with LUN ID 3.\n\n\
    4\\. Rescan the LUNs in each member and configure file system.\n\n5\\. Configure\
    \ Oracle application.\n\n### Case study 4: Identifying device files and I/O paths\
    \ for Linux and Windows hosts\n\nLet us identify device files and I/O paths for\
    \ Linux and Windows hosts:\n\n#### Requirement\n\nA Linux host has single HBA\
    \ connected to fabric. A storage system with two controllers connected to fabric\
    \ via two FC cables. All three N\\_Ports are zoned together. Two virtual volumes\
    \ 20 GB and 30 GB are presented to the host with LUN ID 0 and 1 respectively.\
    \ Draw SAN diagram along with identification path and device files.\n\n#### Analysis\n\
    \nThere is single path from host to fabric and two paths from storage system to\
    \ fabric; therefore number of paths from host is expected to be 1 x 2 = 2 paths\
    \ per device.\n\nLUN ID of 20 GB volume is expected to have 0 and for 30 GB its\
    \ 1."
  fmt: "\n# Brocade FC Switch Zone Configuration\n\nEvery switch vendor designs switch\
    \ interfaces differently. Brocade switch has GUI and command line interface (CLI).\
    \ Zone configuration can be done using any of these interfaces. Product documentation\
    \ can be referred to understand commands and their syntaxes.\n\n## CLI Commands\
    \ and Syntaxes for Brocade FC Switches\n\n### Alias Creation\n\n**Usage:** `alicreate\
    \ \"<Alias Name>\", \"<WWPN>\"`\n\n```\nSwitch> alicreate \"Linux_Host\",\"50:01:43:80:24:27:5a:a8\"\
    \n```\n\n`Linux_Host` is the alias name assigned to the WWPN of the HBA installed\
    \ in Linux host server:\n\n```\nSwitch> alishow Linux_Host\nalias: Linux_Host\
    \ 50:01:43:80:24:27:5a:a8\nSwitch>\nSwitch> alicreate \"Windows_Host\",\"10:00:70:10:6f:e8:77:6f\"\
    \nSwitch> alicreate \"Storage_Ctrl1\",\"20:11:00:02:ac:01:84:ea\"\nSwitch> alicreate\
    \ \"Storage_Ctrl2\",\"21:11:00:02:ac:01:84:ea\"\nSwitch> alicreate \"Tape\",\"\
    50:01:43:80:28:ce:4a:7e\"\n```\n\n### Zone Creation\n\n```\nSwitch> zonecreate\
    \ \"Linux_Storage\",\"Linux_Host;Storage_Ctrl1; Storage_Ctrl2\"\n```\n\n`Linux_Storage`\
    \ is the name assigned to the zone:\n\n```\nSwitch> zoneshow\nzone: Linux_Storage\
    \ Linux_Host; Storage_Ctrl1;Storage_Ctrl2\nSwitch>\nSwitch> zonecreate \"Windows_Storage\"\
    ,\"Windows_Host;Storage_Ctrl1;Storage_Ctrl2\"\nSwitch> zonecreate \"Windows_Tape\"\
    ,\"Windows_Host;Tape\"\n```\n\n### Configuration Creation\n\n```\nSwitch> cfgcreate\
    \ \"Zone_Config\",\"Linux_Storage;Windows_Storage;Windows_Tape\"\n```\n\n`Zone_Config`\
    \ is the name assigned for the configuration:\n\n```\nSwitch> cfgshow Zone_Config\n\
    cfg: Zone_Config Linux_Storage;Windows_Storage;Windows_Tape\nSwitch>\n```\n\n\
    ### Saving Configuration\n\n```\nSwitch> cfgsave\n```\n\n### Enabling the Configuration\n\
    \n```\nSwitch> cfgenable \"Zone_Config\"\n```\n\n### Listing the Configuration\n\
    \n```\nSwitch> cfgshow\nDefined configuration:\ncfg: Zone_Config Linux_Storage;\
    \ Windows_Storage; Windows_Tape\nzone: Linux_Storage Linux_Host; Storage_Ctrl1;\
    \ Storage_Ctrl2\nzone: Windows_Storage Windows_Host; Storage_Ctrl1; Storage_Ctrl2\n\
    zone: Windows_Tape Windows_Host; Tape\nalias: Linux_Host 50:01:43:80:24:27:5a:a8\n\
    alias: Windows_Host 10:00:70:10:6f:e8:77:6f\nalias: Storage_Ctrl1 20:11:00:02:ac:01:84:ea\n\
    alias: Storage_Ctrl2 21:11:00:02:ac:01:84:ea\nalias: Tape 50:01:43:80:28:ce:4a:7e\n\
    \nEffective configuration:\ncfg: Zone_Config\nzone: Linux_Storage 50:01:43:80:24:27:5a:a8\
    \ 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\nzone: Windows_Storage 10:00:70:10:6f:e8:77:6f\
    \ 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\nzone: Windows_Tape 10:00:70:10:6f:e8:77:6f\
    \ 50:01:43:80:28:ce:4a:7e\nSwitch>\n```\n\nAs per effective configuration listed\
    \ above, now Linux and Windows both hosts can access the storage system and only\
    \ Windows system can access the tape device.\n\n# Case Study 2: Modifying Existing\
    \ Zone Configuration of a Fabric with Brocade FC Switch\n\nLet us modify existing\
    \ zone configuration of a fabric with Brocade FC switch.\n\n## Requirement\n\n\
    After a few months of operation, your company decided to deploy a VMware vSphere\
    \ ESXi host into the existing SAN. The new host will share storage space of the\
    \ existing storage system. Due to shortage of port of the existing switch, a new\
    \ Brocade switch is also procured.\n\nWWN details of the FC adapter in ESXi host\
    \ is `10:00:00:90:fa:55:9c:8b`.\n\n![Figure 5.12: Adding a host server in existing\
    \ SAN via an ISL](images/Fig_5.12.jpg)\n\n*Figure 5.12: Adding a host server in\
    \ existing SAN via an ISL*\n\n## Analysis\n\nSince the company already has an\
    \ operational SAN. To include a host server to it, an available port is needed\
    \ in the fabric. The new switch must be connected to existing switch using an\
    \ ISL. The ESXi host can be connected to new switch.\n\nNew alias and zone must\
    \ be created for the new host and added into the existing zone configuration.\
    \ Finally, the zone configuration must be enabled to have new zone in effect.\n\
    \n## Solution\n\nConnect the new switch using a FC cable. This is called ISL connection.\
    \ This will automatically replicate the zone configuration to new switch.\n\n\
    ### Alias Creation\n\n```\nSwitch> alicreate \"ESXi_Host\",\"10:00:00:90:fa:55:9c:8b\"\
    \nSwitch> alishow ESXi_Host\nalias: ESXi_Host 10:00:00:90:fa:55:9c:8b\nSwitch>\n\
    ```\n\n### Zone Creation\n\n```\nSwitch> zonecreate \"ESXi_Storage\",\"ESXi_Host;Storage_Ctrl1;Storage_Ctrl2\"\
    \nSwitch> zoneshow\nzone: ESXi_Storage ESXi_Host; Storage_Ctrl1; Storage_Ctrl2\n\
    Switch>\n```\n\n### Zone Addition into an Existing Configuration\n\n```\nSwitch>\
    \ cfgadd \"Zone_Config\",\"ESXi_Storage\"\n```\n\n### Saving Configuration\n\n\
    ```\nSwitch> cfgsave\n```\n\n### Enabling the Configuration\n\n```\nSwitch> cfgenable\
    \ \"Zone_Config\"\n```\n\n> **Note:** Zone enable must be done during off-peak\
    \ hours, as host read/write traffic may get impacted.\n\n### Listing the Configuration\n\
    \n```\nSwitch> cfgshow\nDefined configuration:\ncfg: Zone_Config ESXi_Storage;\
    \ Linux_Storage; Windows_Storage; Windows_Tape\nzone: ESXi_Storage ESXi_Host;\
    \ Storage_Ctrl1; Storage_Ctrl2\nzone: Linux_Storage Linux_Host; Storage_Ctrl1;\
    \ Storage_Ctrl2\nzone: Windows_Storage Windows_Host; Storage_Ctrl1; Storage_Ctrl2\n\
    zone: Windows_Tape Windows_Host; Tape\nalias: ESXi_Host 10:00:00:90:fa:55:9c:8b\n\
    alias: Linux_Host 50:01:43:80:24:27:5a:a8\nalias: Windows_Host 10:00:70:10:6f:e8:77:6f\n\
    alias: Storage_Ctrl1 20:11:00:02:ac:01:84:ea\nalias: Storage_Ctrl2 21:11:00:02:ac:01:84:ea\n\
    alias: Tape 50:01:43:80:28:ce:4a:7e\n\nEffective configuration:\ncfg: Zone_Config\n\
    zone: ESXi_Storage 10:00:00:90:fa:55:9c:8b 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\n\
    zone: Linux_Storage 50:01:43:80:24:27:5a:a8 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\n\
    zone: Windows_Storage 10:00:70:10:6f:e8:77:6f 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\n\
    zone: Windows_Tape 10:00:70:10:6f:e8:77:6f 50:01:43:80:28:ce:4a:7e\nSwitch>\n\
    ```\n\nAs per effective configuration listed above, now Linux and Windows both\
    \ hosts can access the storage system and only Windows system can access the tape\
    \ device.\n\n# Case Study 3: Virtual Volume Presentation in a Host Server Cluster\
    \ Environment\n\nLet us look at virtual volume presentation in a host server cluster\
    \ environment.\n\n## Requirement\n\nAn organization is planning to have four host\
    \ servers in the cluster. Oracle database would be configured on all of them.\
    \ Space requirement for database is 10 TB for data files, 2 TB for archive log\
    \ and 500 GB for redo logs.\n\n![Figure 5.13: Host server cluster environment](images/Fig_5.13.jpg)\n\
    \n*Figure 5.13: Host server cluster environment*\n\n## Analysis\n\nSince application\
    \ running on cluster members are going to access same database, same storage volumes\
    \ requires to be presented to all four cluster members. As a best practice of\
    \ zoning, all the host servers and storage can be in single zone.\n\n## Solution\n\
    \nFollowing steps can be followed to implement storage solution as described in\
    \ the requirement:\n\n1. Create a single zone with WWPN of all four host server\
    \ members and storage system.\n2. Create three virtual volumes in storage system:\n\
    \   a. `DataVol`: 10 TB\n   b. `ArchVol`: 2 TB\n   c. `RedoVol`: 500 GB\n3. Present\
    \ each volume to all four host servers with same LUN ID. For example, `DataVol`\
    \ with LUN ID 1, `ArchVol` with LUN ID 2 and `RedoVol` with LUN ID 3.\n4. Rescan\
    \ the LUNs in each member and configure file system.\n5. Configure Oracle application.\n\
    \n# Case Study 4: Identifying Device Files and I/O Paths for Linux and Windows\
    \ Hosts\n\nLet us identify device files and I/O paths for Linux and Windows hosts.\n\
    \n## Requirement\n\nA Linux host has single HBA connected to fabric. A storage\
    \ system with two controllers connected to fabric via two FC cables. All three\
    \ N_Ports are zoned together. Two virtual volumes 20 GB and 30 GB are presented\
    \ to the host with LUN ID 0 and 1 respectively. Draw SAN diagram along with identification\
    \ path and device files.\n\n## Analysis\n\nThere is single path from host to fabric\
    \ and two paths from storage system to fabric; therefore number of paths from\
    \ host is expected to be 1 x 2 = 2 paths per device.\n\nLUN ID of 20 GB volume\
    \ is expected to have 0 and for 30 GB its 1.\n"
  trans: "\n\n# Brocade FC 交换机分区配置\n\n每个交换机厂商设计交换机接口的方式各不相同。Brocade 交换机具有 GUI 和命令行界面\
    \ (CLI)。分区配置可以使用这些界面中的任意一种完成。可参考产品文档以了解命令及其语法。\n\n## Brocade FC 交换机的 CLI 命令与语法\n\
    \n### 别名创建\n\n**用法：** `alicreate \"<别名名称>\", \"<WWPN>\"`\n\n```\nSwitch> alicreate\
    \ \"Linux_Host\",\"50:01:43:80:24:27:5a:a8\"\n```\n\n`Linux_Host` 是分配给安装在 Linux\
    \ 主机服务器中的 HBA 的 WWPN 的别名：\n\n```\nSwitch> alishow Linux_Host\nalias: Linux_Host\
    \ 50:01:43:80:24:27:5a:a8\nSwitch>\nSwitch> alicreate \"Windows_Host\",\"10:00:70:10:6f:e8:77:6f\"\
    \nSwitch> alicreate \"Storage_Ctrl1\",\"20:11:00:02:ac:01:84:ea\"\nSwitch> alicreate\
    \ \"Storage_Ctrl2\",\"21:11:00:02:ac:01:84:ea\"\nSwitch> alicreate \"Tape\",\"\
    50:01:43:80:28:ce:4a:7e\"\n```\n\n### 分区创建\n\n```\nSwitch> zonecreate \"Linux_Storage\"\
    ,\"Linux_Host;Storage_Ctrl1; Storage_Ctrl2\"\n```\n\n`Linux_Storage` 是分配给该分区的名称：\n\
    \n```\nSwitch> zoneshow\nzone: Linux_Storage Linux_Host; Storage_Ctrl1;Storage_Ctrl2\n\
    Switch>\nSwitch> zonecreate \"Windows_Storage\",\"Windows_Host;Storage_Ctrl1;Storage_Ctrl2\"\
    \nSwitch> zonecreate \"Windows_Tape\",\"Windows_Host;Tape\"\n```\n\n### 配置创建\n\
    \n```\nSwitch> cfgcreate \"Zone_Config\",\"Linux_Storage;Windows_Storage;Windows_Tape\"\
    \n```\n\n`Zone_Config` 是分配给该配置的名称：\n\n```\nSwitch> cfgshow Zone_Config\ncfg: Zone_Config\
    \ Linux_Storage;Windows_Storage;Windows_Tape\nSwitch>\n```\n\n### 保存配置\n\n```\n\
    Switch> cfgsave\n```\n\n### 启用配置\n\n```\nSwitch> cfgenable \"Zone_Config\"\n```\n\
    \n### 列出配置\n\n```\nSwitch> cfgshow\nDefined configuration:\ncfg: Zone_Config Linux_Storage;\
    \ Windows_Storage; Windows_Tape\nzone: Linux_Storage Linux_Host; Storage_Ctrl1;\
    \ Storage_Ctrl2\nzone: Windows_Storage Windows_Host; Storage_Ctrl1; Storage_Ctrl2\n\
    zone: Windows_Tape Windows_Host; Tape\nalias: Linux_Host 50:01:43:80:24:27:5a:a8\n\
    alias: Windows_Host 10:00:70:10:6f:e8:77:6f\nalias: Storage_Ctrl1 20:11:00:02:ac:01:84:ea\n\
    alias: Storage_Ctrl2 21:11:00:02:ac:01:84:ea\nalias: Tape 50:01:43:80:28:ce:4a:7e\n\
    \nEffective configuration:\ncfg: Zone_Config\nzone: Linux_Storage 50:01:43:80:24:27:5a:a8\
    \ 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\nzone: Windows_Storage 10:00:70:10:6f:e8:77:6f\
    \ 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\nzone: Windows_Tape 10:00:70:10:6f:e8:77:6f\
    \ 50:01:43:80:28:ce:4a:7e\nSwitch>\n```\n\n根据上述列出的生效配置，现在 Linux 和 Windows 两台主机均可访问存储系统，且仅\
    \ Windows 系统可访问磁带设备。\n\n# 案例研究 2：修改包含 Brocade FC 交换机的结构的现有分区配置\n\n让我们修改包含 Brocade\
    \ FC 交换机的结构的现有分区配置。\n\n## 需求\n\n运行几个月后，贵公司决定将 VMware vSphere ESXi 主机部署到现有 SAN\
    \ 中。新主机将共享现有存储系统的存储空间。由于现有交换机端口短缺，还采购了一台新的 Brocade 交换机。\n\nESXi 主机中 FC 适配器的 WWN\
    \ 详细信息为 `10:00:00:90:fa:55:9c:8b`。\n\n![图 5.12：通过 ISL 在现有 SAN 中添加主机服务器](img/Fig_5.12.jpg)\n\
    \n*图 5.12：通过 ISL 在现有 SAN 中添加主机服务器*\n\n## 分析\n\n由于公司已拥有一个运行中的 SAN。要向其中添加一台主机服务器，需要结构中有一个可用端口。必须使用\
    \ ISL 将新交换机连接到现有交换机。ESXi 主机可连接到新交换机。\n\n必须为新主机创建新别名和分区，并将其添加到现有分区配置中。最后，必须启用分区配置以使新分区生效。\n\
    \n## 解决方案\n\n使用 FC 线缆连接新交换机。这称为 ISL 连接。这将自动将分区配置复制到新交换机。\n\n### 别名创建\n\n```\n\
    Switch> alicreate \"ESXi_Host\",\"10:00:00:90:fa:55:9c:8b\"\nSwitch> alishow ESXi_Host\n\
    alias: ESXi_Host 10:00:00:90:fa:55:9c:8b\nSwitch>\n```\n\n### 分区创建\n\n```\nSwitch>\
    \ zonecreate \"ESXi_Storage\",\"ESXi_Host;Storage_Ctrl1;Storage_Ctrl2\"\nSwitch>\
    \ zoneshow\nzone: ESXi_Storage ESXi_Host; Storage_Ctrl1; Storage_Ctrl2\nSwitch>\n\
    ```\n\n### 将分区添加到现有配置中\n\n```\nSwitch> cfgadd \"Zone_Config\",\"ESXi_Storage\"\
    \n```\n\n### 保存配置\n\n```\nSwitch> cfgsave\n```\n\n### 启用配置\n\n```\nSwitch> cfgenable\
    \ \"Zone_Config\"\n```\n\n> **注意：** 分区启用必须在非高峰时段进行，因为主机读/写流量可能会受到影响。\n\n### 列出配置\n\
    \n```\nSwitch> cfgshow\nDefined configuration:\ncfg: Zone_Config ESXi_Storage;\
    \ Linux_Storage; Windows_Storage; Windows_Tape\nzone: ESXi_Storage ESXi_Host;\
    \ Storage_Ctrl1; Storage_Ctrl2\nzone: Linux_Storage Linux_Host; Storage_Ctrl1;\
    \ Storage_Ctrl2\nzone: Windows_Storage Windows_Host; Storage_Ctrl1; Storage_Ctrl2\n\
    zone: Windows_Tape Windows_Host; Tape\nalias: ESXi_Host 10:00:00:90:fa:55:9c:8b\n\
    alias: Linux_Host 50:01:43:80:24:27:5a:a8\nalias: Windows_Host 10:00:70:10:6f:e8:77:6f\n\
    alias: Storage_Ctrl1 20:11:00:02:ac:01:84:ea\nalias: Storage_Ctrl2 21:11:00:02:ac:01:84:ea\n\
    alias: Tape 50:01:43:80:28:ce:4a:7e\n\nEffective configuration:\ncfg: Zone_Config\n\
    zone: ESXi_Storage 10:00:00:90:fa:55:9c:8b 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\n\
    zone: Linux_Storage 50:01:43:80:24:27:5a:a8 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\n\
    zone: Windows_Storage 10:00:70:10:6f:e8:77:6f 20:11:00:02:ac:01:84:ea 21:11:00:02:ac:01:84:ea\n\
    zone: Windows_Tape 10:00:70:10:6f:e8:77:6f 50:01:43:80:28:ce:4a:7e\nSwitch>\n\
    ```\n\n根据上述列出的生效配置，现在 Linux 和 Windows 两台主机均可访问存储系统，且仅 Windows 系统可访问磁带设备。\n\n#\
    \ 案例研究 3：主机服务器集群环境中的虚拟卷呈现\n\n让我们看看主机服务器集群环境中的虚拟卷呈现。\n\n## 需求\n\n某组织计划在集群中部署四台主机服务器。所有服务器上均将配置\
    \ Oracle 数据库。数据库空间需求为：数据文件 10 TB，归档日志 2 TB，重做日志 500 GB。\n\n![图 5.13：主机服务器集群环境](img/Fig_5.13.jpg)\n\
    \n*图 5.13：主机服务器集群环境*\n\n## 分析\n\n由于运行在集群成员上的应用程序将访问同一个数据库，因此需要向所有四个集群成员呈现相同的存储卷。作为分区的最佳实践，所有主机服务器和存储可以放在单个分区中。\n\
    \n## 解决方案\n\n可遵循以下步骤实现需求中所述的存储解决方案：\n\n1. 创建一个包含所有四台主机服务器成员和存储系统 WWPN 的单个分区。\n\
    2. 在存储系统中创建三个虚拟卷：\n   a. `DataVol`：10 TB\n   b. `ArchVol`：2 TB\n   c. `RedoVol`：500\
    \ GB\n3. 使用相同的 LUN ID 将每个卷呈现给所有四台主机服务器。例如，`DataVol` 使用 LUN ID 1，`ArchVol` 使用 LUN\
    \ ID 2，`RedoVol` 使用 LUN ID 3。\n4. 在每个成员中重新扫描 LUN 并配置文件系统。\n5. 配置 Oracle 应用程序。\n\
    \n# 案例研究 4：识别 Linux 和 Windows 主机的设备文件和 I/O 路径\n\n让我们识别 Linux 和 Windows 主机的设备文件和\
    \ I/O 路径。\n\n## 需求\n\n一台 Linux 主机有一个连接到结构的 HBA。一个存储系统有两个控制器，通过两根 FC 线缆连接到结构。所有三个\
    \ N_Port 被划分在同一个分区中。两个虚拟卷（20 GB 和 30 GB）分别以 LUN ID 0 和 1 呈现给主机。绘制 SAN 图以及识别路径和设备文件。\n\
    \n## 分析\n\n主机到结构有一条路径，存储系统到结构有两条路径；因此预计从主机到每个设备的路径数为 1 x 2 = 2 条。\n\n20 GB 卷的\
    \ LUN ID 预计为 0，30 GB 卷的 LUN ID 预计为 1。\n\n"
