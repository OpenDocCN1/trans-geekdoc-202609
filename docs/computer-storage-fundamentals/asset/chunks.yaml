- raw: "In a partial mesh topology, not all the switches are connected to every other\
    \ switch. Compared to full mesh, in this topology, hop count may increase, depending\
    \ on connection of host server and storage, but number of ports used by ISLs can\
    \ be saved.\n\n•  Mesh fabric:\n\nThe core-edge topology has two types of switch\
    \ tiers: edge and core. The edge tier is usually composed of low-end switches\
    \ in which host servers are connected. These edge-tier switches are not connected\
    \ to each other; instead they are core tier switches.\n\nThe core tier is usually\
    \ composed of high-end director switches. Generally, one or two storage systems\
    \ are shared by many host servers, hence this topology helps better distribution\
    \ of bandwidth for all host servers to the storage system with minimum number\
    \ of hop count.\n\n![Figure 5.6: Core-edge or tiered topology](images/Fig_5.6.png)\n\
    \nFigure 5.6: Core-edge or tiered topology\n\nThis topology also reduces the port\
    \ utilization by the ISLs.\n\nCore-edge topology is typically used in enterprise\
    \ storage solution.\n\n## Zoning\n\nZoning is logical partitioning of SAN fabric\
    \ into smaller subsets. In the following figure, although both servers and storages\
    \ are connected to same fabric, because of Zone1, and Zone2, Server1 can only\
    \ access Storage1, and Server2 can access Storage2. Zoning is required to restrict\
    \ interference, add security, and simplify management.\n\nZoning can offer a number\
    \ of benefits:\n\n•  Security: Zoning keeps users from accessing information they\
    \ do not need.\n\n•  Performance: Blocks unwanted fabric broadcasts, which improves\
    \ I/O. performance.\n\n•  Manageability: By splitting the SAN up into chunks,\
    \ zoning makes it easier to keep track of devices, storage, and users.\n\n•  Separation\
    \ by purpose: Setting up zones to reflect operational categories, such as engineering\
    \ or human resources, organizes storage logically. It also makes it easy to establish\
    \ specialized networks for testing or other purposes.\n\n•  Separation by operating\
    \ system: Putting different OSs in different zones reduces the possibility of\
    \ data corruption.\n\n•  Allowing temporary access: Administrators can remove\
    \ the zone restrictions temporarily to allow tasks such as nightly backup.\n\n\
    ![Figure 5.7: Zoning: Logical partitioning](images/Fig_5.7.png)\n\nFigure 5.7:\
    \ Zoning: Logical partitioning\n\n Refer to the following figure:\n\n![Figure\
    \ 5.8: N\\_Port devices, zone, and zone set or Configuration](images/Fig_5.8.jpg)\n\
    \nFigure 5.8: N\\_Port devices, zone, and zone set or Configuration\n\n•  Device1\
    \ and Device2 can see each other in Zone1\n\n•  Device2 and Device3 can each other\
    \ in Zone2.\n\n•  Device1 and Device3 will not be able to see each other.\n\n\
    ![Figure 5.9: Multiple zone configurations](images/Fig_5.9.png)\n\nFigure 5.9:\
    \ Multiple zone configurations\n\nOnly one configuration can be enabled at any\
    \ given time, For example, If Config3 is enabled, Device2 and Device1 can see\
    \ each other in Zone4 and Device1 and Device3 can see each other in Zone2.\n\n\
    There is no difference between Config1 and Config2.\n\nNotes:\n\n•  When zoning\
    \ is not configured, all devices connected to a fabric can see each other.\n\n\
    •  If zoning is configured, but some devices are not included in any zone, no\
    \ device can see them. They also cannot see each other.\n\n•  If zoning is configured\
    \ and modified, zone configuration replicates to other switches automatically\
    \ in the fabric\n\n•  Fully NSPOF environment requires at least two fabrics. Zoning\
    \ required to be implemented in each fabric separately.\n\n•  A unique 8 byte\
    \ (64 bit) address is encoded into each FC adapter by the manufacturer is called\
    \ worldwide name (WWN), and the unique address for each port is called worldwide\
    \ port name (WWPN).\n\n•  WWN based zoning: Zone/alias definition by wwn name.\
    \ Downside: if an HBA fails and has to be replaced you have to change zoning information,\
    \ too.\n\n•  Port-based zoning: Zone/alias definition by switch domain ID/port\
    \ number. Downside: you cannot simply plug a cable into another port.\n\n### Hard\
    \ zoning vs. soft zoning\n\n•  Hard zoning physically blocks access to a zone\
    \ from any device outside of the zone.\n\n•  Soft zoning uses filtering implemented\
    \ in FC switches to prevent ports from being seen from outside of their assigned\
    \ zones. The security vulnerability in soft zoning is that the ports are still\
    \ accessible if the user in another zone correctly guesses the FC address.\n\n\
    •  Soft zoning is to think in terms on your unlisted home phone number. However,\
    \ your phone will still ring if someone dialed the correct number. For hard zoning,\
    \ think of caller ID blocking. Even if you do know the number, there is no access.\n\
    \n•  Hard zoning maps devices physically to a port, and soft zoning maps them\
    \ logically. If you use the WWN of the device for zone definition, you are using\
    \ soft zoning. If you use the physical port number, you are using hard zoning.\n\
    \n•  Brocade’s hardware zoning was only enabled when port-level zoning was used.\
    \ This is not the case with all the vendors, as many have port zoning, which is\
    \ still based on software and not secure.\n\n•  Soft zoning is much more flexible\
    \ and easier to implement, especially in very large, complex SANs. If your SAN\
    \ is not as large and complex, or a company has the resources available, hard\
    \ zoning provides greater security.\n\n### Typical zone configuration steps\n\n\
    1\\. Identify each device and its WWNs or the port where the device is connected.\n\
    \n2\\. Assign meaningful alias name for each device or port. Alias creation is\
    \ optional, but recommended step. If alias is not created, WWN can be directly\
    \ used while creating zone.\n\n3\\. Create zones and include the desired devices\
    \ in them.\n\n4\\. Create configuration or zone set and include required zones\
    \ in it.\n\n5\\. Enable the configuration or the zone set.\n\n### Zone conflict\n\
    \nZone conflict is an error condition that occurs when multiple zone configuration\
    \ exist in same fabric. This primarily happens when zone configuration in two\
    \ different switches in same fabric are different. Following potential causes\
    \ for the zone conflict:\n\n•  Link between the two switches went down, and zone\
    \ configuration modified and then the link restored.\n\n•  Configurations are\
    \ changed simultaneously from multiple switches.\n\n•  Zone configuration modified\
    \ from lower model of switch in a mix switch model SAN Procedure to fix it, is\
    \ as follows:\n\n o Identify the switch which has valid zone configuration.\n\n\
    \ o Disconnect the ISL links.\n\n o Clear the zone configuration from other switches.\n\
    \n o Reconnect the links back to replicate the configuration to all the switches.\n\
    \n### Zoning guidelines\n\nThere are several best practices that need to be followed\
    \ while creating zone. Every vendor highlights guideline in their product documentations.\
    \ Following are some generic best practices for zoning:\n\n•  Always implement\
    \ zoning.\n\n•  Apply zoning changes during off-peak hours\n\n•  All type of operating\
    \ systems, Tape and Storage Arrays must be in different zone. All cluster nodes\
    \ must be separated by their cluster configuration.\n\n o Linux1, Linux2 in Zone1\
    \ and Windows1 in Zone2\n\n o Tape\\_Lib1, Host1 in Zone1 and Storage1, Host1\
    \ in Zone2\n\n o Cluster1\\_Member1, Cluster1\\_member2 in Zone1, Cluster2\\_\
    \ Member1, Cluster2\\_member2 in Zone2, and Host1 in Zone3\n\n•  Use single initiator\
    \ zoning.\n\n•  Single initiator (host) and single target (storage) is recommended\
    \ in a zone.\n\n•  WWN based zoning is recommended because of interoperability\
    \ and MPR configuration in the future.\n\n•  Pure port-based and WWN-based zoning\
    \ handledby ASIC (Hardware).\n\n•  Mixed zoning (Port and WWN) handled by name\
    \ server (processor).\n\n•  Alias must be created for each device with a meaningful\
    \ name.\n\n•  Zoning configuration modification is recommended to do on the principal\
    \ switch.\n\n•  Clear unused zoning elements.\n\n•  Do not have tapes and disks\
    \ defined in the same zone.\n\n## LUN masking"
