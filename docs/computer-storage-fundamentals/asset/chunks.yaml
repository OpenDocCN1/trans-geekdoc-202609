    \ 3.5-inch hard drive.\n- **SSD**: Solid State Drive, a high-performance disk\
    \ drive with no mechanical moving components.\n- **SCM**: Storage Class Memory,\
    \ a high-performance storage device.\n- **HDD**: Hard Disk Drive, stores data\
    \ on magnetic media.\n- **AFA**: All-Flash Array, a storage disk array with SSDs.\n\
    - **SDS**: Software-Defined Storage that decouples storage services from underlying\
    \ hardware.\n- **NVMe**: Non-Volatile Memory Express.\n\n# Community\n\nJoin our\
    \ Discord space for latest updates, offers, tech happenings around the world,\
    \ new releases, and sessions with the authors:\n\n`https://discord.bpbonline.com`\n\
    \n![QR-Logo](`images/fm1.png`)\n\n# Chapter 3: Storage Disk Array\n\n## Introduction\n\
    \nA storage disk array is a storage system that consists of a pool of physical\
    \ disk drives and one or more storage controllers, which stores terabytes of data\
    \ and performs multiple host server's input/output (I/O) operations. Storage vendors\
    \ design and implement several features in storage systems to improve read/write\
    \ performance and data fault tolerance. Some of those features are controller\
    \ operations, data caching techniques, RAID concepts, and so on. RAID implementation\
    \ in storage systems has greatly influenced both performance and fault tolerance\
    \ aspects of a storage system. For this reason, in the last three decades, all\
    \ storage vendors have been implementing it in their storage systems. Modern storage\
    \ disk arrays implement Virtual RAID, which enhances performance and fault-tolerant\
    \ factors to a greater extent.\n\nApart from RAID, disk arrays also have several\
    \ intelligence features implemented to provide highly optimized I/O processing,\
    \ fault tolerance, and efficient storage capabilities. Some of those features\
    \ are storage tiering, quality of service (QoS), replication, thin provisioning,\
    \ deduplication, and compression, among many others. These features are discussed\
    \ in detail in the following chapters.\n\nTherefore, storage arrays are referred\
    \ to as Intelligent Storage Arrays (ISA) or Intelligent Storage Systems (ISS).\n\
    \n## Structure\n\nThis chapter primarily focuses on the storage system, and you\
    \ will learn about the following aspects of a storage system:\n\n- Physical layout\
    \ and components of the storage system\n- Storage controller operation modes\n\
    - Caching techniques\n- RAID concept\n- Virtual RAID\n- Storage virtualization\n\
    \n## Objectives\n\nBy the end of this chapter, you will learn about the design\
    \ and implementation of various features and functionalities of a storage system,\
    \ such as storage controller operation modes, different data caching techniques,\
    \ and how user data is stored on physical disks using different RAID levels. This\
    \ chapter will also discuss the pros and cons of each RAID level.\n\n## Controller\
    \ Operation Modes\n"
  trans: "\n# 传统 DAS 解决方案与 SDS\n\n传统 DAS 解决方案并未提供许多用于提升性能和可用性的存储功能。然而，SDS 组件可部署在其之上，使其更加智能。借助\
    \ SDS，可从传统磁盘中划分出具有不同 RAID 级别的虚拟卷。最新的 SDS 解决方案还提供快照、去重和压缩等其他存储服务。\n\n## 解决方案\n\n\
    建议采用 SDS 解决方案以满足此需求。这是一种 VM 的软件组件，可采购并部署到传统硬件上，以实现高性能、高可用性的存储解决方案。\n\n# 学习检查\n\
    \n## 客观题\n\n1. 如果您创建一个 1TB 的存储 LUN 并授予主机访问权限，操作系统中将显示多少容量？\n\n   a. 1024GB  \n\
    \   b. 931GB  \n   c. 1000GB  \n   d. 831GB\n\n2. 如果您从商店购买一块 1TB 磁盘并在笔记本电脑中安装并格式化，可用容量将是多少？\n\
    \n   a. 1024GB  \n   b. 931GB  \n   c. 1000GB  \n   d. 831GB\n\n3. HDD 类型及其物理尺寸：\n\
    \n   a. SFF, 3.5  \n   b. LFF, 2.5  \n   c. LFF, 3.5  \n   d. SFF, 2.5\n\n4. 存储系统的哪个组件连接在存储控制器的后端？\n\
    \n   a. 虚拟卷  \n   b. 物理磁盘  \n   c. 主机  \n   d. 缓存内存\n\n5. 什么是磁盘阵列？\n\n   a. 由机箱组成的\
    \ JBOD，其中托管的一组硬盘驱动器可采用多种组合，如 SCSI 驱动器、SAS、FC 和 SATA。  \n   b. 位于一个或多个控制器后端的独立物理磁盘，允许配置虚拟卷或\
    \ RAID 卷。  \n   c. 包含大量硬盘驱动器的高端服务器。\n\n6. 磁盘阵列的用途是什么？\n\n   a. 性能  \n   b. 容错\
    \  \n   c. 可扩展  \n   d. 以上皆是\n\n7. 存储控制器的设备端口是：\n\n   a. 发起端  \n   b. 目标端  \n\
    \   c. 两者皆是  \n   d. 无\n\n8. 存储控制器的主机端口是：\n\n   a. 发起端  \n   b. 目标端  \n   c. 两者皆是\
    \  \n   d. 无\n\n9. 以下哪项不是磁盘阵列的主要组件？\n\n   a. 网络接口卡  \n   b. 存储控制器  \n   c. 物理磁盘驱动器\
    \  \n   d. 磁盘机箱\n\n10. 存储控制器的哪个接口不用于 I/O 流量？\n\n    a. 前端或主机端口  \n    b. 后端或设备端口\
    \  \n    c. 网络接口端口  \n    d. 控制器互联端口\n\n11. 以下哪些接口用于存储管理和监控目的？选择所有适用项：\n\n   \
    \ a. 前端或主机端口  \n    b. 后端或设备端口  \n    c. 网络接口端口  \n    d. 串口\n\n12. 以下哪个硬件组件不属于存储控制器？\n\
    \n    a. 风扇  \n    b. 电源单元  \n    c. 电源分配单元  \n    d. 电池\n\n13. 以下哪项不是 SAN 组件？\n\
    \n    a. 存储设备  \n    b. FC 交换机  \n    c. HBA  \n    d. DIMM\n\n14. 以下哪项是存储设备按性能排序的正确顺序？\n\
    \n    i. HDD > SSD > SCM > 磁带  \n    ii. 磁带 > HDD > SSD > SCM  \n    iii. SCM\
    \ > SSD > HDD > 磁带  \n    iv. SSD > HDD > SCM > 磁带\n\n    a. (i)  \n    b. (ii)\
    \  \n    c. (iii)  \n    d. (iv)\n\n15. 以下关于单模和多模的陈述哪项是不正确的？\n\n    a. 在多模中，不同光子的光束到达时间不同，导致难以分辨\
    \ 1 或 0。  \n    b. 单模光纤的光学核心为 62.5 微米。  \n    c. 单模支持高达 10 公里的距离。  \n    d. 在多模中，支持的距离随速度增加而缩短。\n\
    \n16. 哪种线缆支持设备间的最长距离？\n\n    a. 单模光纤  \n    b. 多模光纤  \n    c. 铜缆  \n    d. SCSI\
    \ 线缆\n\n17. 当交换机正在运行时，可以更换或替换 GBIC 吗？\n\n    a. 真  \n    b. 假\n\n18. 以下哪项比较没有意义？\n\
    \n    a. NVMe 对比 SSD  \n    b. NVMe 对比 SAS  \n    c. SATA 对比 SAS  \n    d. SSD\
    \ 对比机械硬盘\n\n19. 匹配以下内容：\n\n    i. NVMe — 1. 支持一个队列，其中最多包含 32 条命令  \n    ii. SAS\
    \ — 2. 支持最多 65535 个队列，每个队列最多包含 65535 条命令  \n    iii. SATA — 3. 支持一个队列，其中最多包含 254\
    \ 条命令\n\n    a. (i) - (1), (iii) - (2) and (ii) - (3)  \n    b. (i) - (1), (ii)\
    \ - (2) and (iii) - (3)  \n    c. (ii) - (1), (i) - (2) and (iii) - (3)  \n  \
    \  d. (iii) - (1), (i) - (2) and (ii) - (3)\n\n20. 以下哪种磁盘不是由任何磁盘厂商制造的？\n\n   \
    \ a. SAS 机械硬盘  \n    b. NVMe 机械硬盘  \n    c. NVMe 固态硬盘  \n    d. SATA 固态硬盘\n\n\
    ## 简答题\n\n1. 描述存储控制器内的不同组件。\n\n2. 定义存储安全及其必要性。还要描述可用于保护存储基础设施的技术导向组件。\n\n## 测验题\n\
    \n1. SCM 代表什么？为什么它对下一代存储系统很重要？\n\n2. DAS 解决方案是否在主机和存储设备之间的网络中使用交换机？请证明您的答案。\n\n\
    3. 解释 NVMe 的优势。\n\n# 术语表与关键术语\n\n- **存储磁盘阵列**：一种存储系统，具有一个或多个控制器后端的独立物理磁盘，允许配置虚拟卷或\
    \ RAID 卷。\n- **JBOD**：Just a Bunch of Disks（只是一堆磁盘）。一种磁盘机箱，可容纳连接到一个或多个控制器的多个物理磁盘。\n\
    - **SFF**：小型外形规格，2.5 英寸硬盘驱动器。\n- **LFF**：大型外形规格，3.5 英寸硬盘驱动器。\n- **SSD**：固态硬盘，一种无机械运动部件的高性能磁盘驱动器。\n\
    - **SCM**：存储级内存，一种高性能存储设备。\n- **HDD**：硬盘驱动器，在磁性介质上存储数据。\n- **AFA**：全闪存阵列，一种采用\
    \ SSD 的存储磁盘阵列。\n- **SDS**：软件定义存储，将存储服务与底层硬件解耦。\n- **NVMe**：非易失性内存表达。\n\n# 社区\n\
    \n加入我们的 Discord 空间，获取最新资讯、优惠、全球技术动态、新版本发布以及与作者的交流会：\n\n`https://discord.bpbonline.com`\n\
    \n![二维码徽标](img/fm1.png`)\n\n# 第 3 章：存储磁盘阵列\n\n## 简介\n\n存储磁盘阵列是一种存储系统，由一组物理磁盘驱动器和一个或多个存储控制器组成，可存储\
    \ TB 级数据并执行多台主机服务器的输入/输出 (I/O) 操作。存储厂商在存储系统中设计并实现多种功能，以提高读/写性能和数据容错能力。这些功能包括控制器操作、数据缓存技术、RAID\
    \ 概念等。存储系统中的 RAID 实现极大地影响了存储系统的性能和容错两方面。因此，在过去三十年里，所有存储厂商都在其存储系统中实现了 RAID。现代存储磁盘阵列实现了虚拟\
    \ RAID，这在更大程度上增强了性能和容错因素。\n\n除了 RAID，磁盘阵列还实现了多项智能功能，以提供高度优化的 I/O 处理、容错和高效存储能力。这些功能包括存储分层、服务质量\
    \ (QoS)、复制、精简配置、去重和压缩等。这些功能将在后续章节中详细讨论。\n\n因此，存储阵列被称为智能存储阵列 (ISA) 或智能存储系统 (ISS)。\n\
    \n## 结构\n\n本章主要关注存储系统，您将了解存储系统的以下方面：\n\n- 存储系统的物理布局和组件\n- 存储控制器操作模式\n- 缓存技术\n\
    - RAID 概念\n- 虚拟 RAID\n- 存储虚拟化\n\n## 目标\n\n在本章结束时，您将了解存储系统各种特性和功能的设计与实现，例如存储控制器操作模式、不同的数据缓存技术，以及如何使用不同的\
    \ RAID 级别将用户数据存储在物理磁盘上。本章还将讨论每种 RAID 级别的优缺点。\n\n## 控制器操作模式\n"
