    *   CLI: Command line interface\n\n*   RESTful API: An API that uses HTTP requests\
    \ to GET, PUT, POST, and DELETE data.\n\n*   Single pane of glass (SPOG): An integrated\
    \ management display console that shows all storage solution components.\n\n##\
    \ Concluding remarks\n\nAs discussed in the beginning of this book, every feature\
    \ that is implemented in a storage system has an impact either on fault tolerant,\
    \ space efficiency or performance. Typically a modern storage system has all these\
    \ features implemented to provide best performance, fault tolerance and as well\
    \ as space efficiency to meet an or ganization business demand.\n\n![Figure 9.11:\
    \ Storage features for performance, fault tolerant and space efficiency](images/Fig_9.4.jpg)\n\
    \nFigure 9.11: Storage features for performance, fault tolerant and space efficiency\n\
    \nAll storage systems have RAID implemented. Except RAID 0, all other RAID implementation\
    \ causes loss of storage space at the cost of fault tolerance. But there are other\
    \ features, such as thin provisioning, deduplication, compression which helps\
    \ to utilize and share the space more efficiently. On the other hand, multiple\
    \ controllers, RAID, multipath helps to avoid accessing data on storage in the\
    \ event of any failure of controller, disk drive or link. Snapshot, clone, and\
    \ replication help to make copy of the data locally or on a different storage\
    \ system.\n\nThere are also several features and functionalities that help in\
    \ improving the performance of a storage system through load balancing, temporally\
    \ copying data in cache area, and so on.\n\nA storage stack comprises of multiple\
    \ hardware and software components from physical disk up to the applications.\
    \ The following figure shows all storage stack layers for SAN storage solution:\n\
    \n![Figure 9.12: Storage stack layers for SAN storage solution](images/Fig_9.5.png)\n\
