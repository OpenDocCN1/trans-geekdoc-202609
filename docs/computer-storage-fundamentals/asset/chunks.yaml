    \ Provide steps to create and configure storage volume in host server via `FC`\
    \ and `iSCSI`.\n\n### Analysis\n\nFollowing steps are followed to provision storage\
    \ space to a host in the storage system:\n\nStep 1: Creation of a host entry.\n\
    \nStep 2: Creation and presentation of virtual volume to the host in the host\
    \ server: Although there are several methods available or third party tools available,\
    \ configure file system on a storage volume, typically these steps are followed\
    \ using Linux native command and utilities.\n\nStep 3: Scan for new disk:\n\n\
    ```\nfind /sys/class/scsi_host/host*/scan | while read line; do echo - - - > $line;\
    \ done\n```\n\nStep 4: Listing all devices:\n\n```\nfdisk -l\n```\n\nStep 5: Partitioning\
