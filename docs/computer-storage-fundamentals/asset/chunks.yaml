    # Storage Virtualization


    - Unused space cannot be used by another host.

    - If the disk fails, data is lost.


    ![Figure 3.33: Non-virtualized environment](images/Fig_3.33.png)


    Figure 3.33: Non-virtualized environment


    The virtualization software or device uses the metadata to re-direct I/O requests.
    It will receive an incoming I/O request containing information about the location
    of the data in terms of the logical disk (virtual disk) and translates this into
    a new I/O request to the physical disk location.


    For example, the virtualized device may:


    - Receive a read request for `vdisk LUN ID=1, LBA=32`

    - Perform a metadata look up for `LUN ID=1, LBA=32`, and finds this maps to physical
    `LUN ID=6, LBA0`, and physical `LUN ID=7, LBA0`

    - Sends a read request to physical `LUN ID=6, LBA0` and physical `LUN ID=7, LBA0`

    - Receives the data back from the physical LUNs

    - Sends the data back to the initiator as if it had come from `vdisk LUN ID=1,
    LBA32`


    ## Virtualization Benefits: Availability – Non-disruptive Data Migration


    - The host only knows about the logical disk (the mapped LUN) and so any changes
    to the metadata mapping is transparent to the host. This means the actual data
    can be moved or replicated to another physical location without affecting the
    operation of any client. When the data has been copied or moved, the metadata
    can simply be updated to point to the new location, therefore freeing up the physical
    storage at the old location.

    - Improved availability by increasing fault tolerance of system.


    ## Virtualization Benefits: Improved Utilization


    - Utilization can be increased by virtue of the pooling, migration, and thin provisioning
    services.

    - When all available storage capacity is pooled, system administrators no longer
    have to search for disks that have free space to allocate to a particular host
    or server. A new logical disk can be simply allocated from the available pool,
    or an existing disk can be expanded.

    - Storage can be assigned where it is needed at that point in time, reducing the
    need to guess how much a given host will need in the future.

    - Virtual volume expand and shrink


    ## Storage Virtualization Risks


    **Metadata becomes critical:**


    - Once virtualized, the metadata are the glue in the middle. If the metadata are
    lost, so is all the actual data as it would be virtually impossible to reconstruct
    the logical drives without the mapping information.


    **Complexity increases:**


    - Management of environment: Although a virtual storage infrastructure benefits
    from a single point of logical disk and replication service management, the physical
    storage must still be managed. Problem determination and fault isolation can also
    become complex, due to the abstraction layer.

    - Infrastructure design: Traditional design ethics may no longer apply, virtualization
    brings a whole range of new ideas and concepts to think about.

    - Every data that arrives at a virtualized array is torn into multiple pieces,
    as it has to be written on to all drives. Thus, in general, I/OPS become a bottleneck
    rather than bandwidth at frontend.


    ![Figure 3.34: Storage virtualization and different level](images/Fig_3.34.jpg)


    Figure 3.34: Storage virtualization and different level


    ## Logical Volume Management


    Host-based volume management is a software RAID solution implemented within host
    OS. Logical Volume Management (LVM) is an example of storage virtualization at
    host level. Today most modern Linux distributions are LVM-aware.


    LVM provides administrator to take advantage of storage virtualization by abstracting
    the physical layout of storage devices for easier and flexible administration.
    RAID volume can be configured with striping and mirroring to achieve better fault
    tolerance and performance. Data can be spread across underlying heterogeneous
    storage devices and migrated online from one storage type to another. Volumes
    can be resized dynamically. LVM also offers advanced storage features like snapshotting,
    cloning, expand and shrink.


    ![Figure 3.35: LVM architecture](images/Fig_3.35.png)


    Figure 3.35: LVM architecture


    ### LVM Terminologies and Architecture


    - **Physical volume (PV):** Physical block device, created for each physical disk,
    and used by LVM as the raw building material for higher levels of abstraction.
    This physical disk can also be a logical disk of a host-based RAID controller
    or virtual disk of an RAID storage array.

    - **Volume group (VG):** Combination of PVs into storage pools known as VG.

    - **Logical volume (LV):** A VG can be sliced up into any number of logical volumes.
    Each LV is used to create file system and mount for storing data.

    - **Extents:** VG is segmented into small, fixed-size chunks called extents. Logical
    volumes are expanded or shrunk by adding required number of extents to or removing
    extents from the VG.


    ### Configuring LVM in Linux


    As a first step to configure, physical devices need to be marked as PVs using
    the `pvcreate` command.


    An example command:


    ```

    # pvcreate /dev/sda /dev/sdb /dev/sdc

    ```


    Second step is to add the PVs into a VG:


    ```

    # vgcreate testvg /dev/sda /dev/sdb

    ```


    And the last step is to create LV from VG:


    ```

    # lvcreate -L 20G -n testdata1 testvg

    # lvcreate -L 30G -n testdata2 testvg

    ```


    Following commands can be used to create file system on LV and mount them:


    ```

    # mkfs.ext4 /dev/testvg/testdata1

    # mkfs.ext4 /dev/testvg/testdata2

    # mkdir /data1

    # mkdir /data2

    # mount /dev/testvg/testdata1 /data1

    # mount /dev/testvg/testdata2 /data2

    ```


    Entries for each mount point can be added in `/etc/fstab` file to make the mounts
    persistent across reboot of the system.


    Refer LVM documentation specific to the OS for detailed information.


    ## Conclusion


    Multiple controllers in a storage system provide load balance and fault tolerance.
    Based on storage system model and its design, there are different controller mode
    of operation: active/standby, active/passive, Asymmetrical Active-Active, and
    True Active-Active.


    Among these modes, True Active-Active is the mode that is implemented in most
    modern storage systems. This ensures all controllers in the storage system are
    equally loaded for I/O operations.


    Caching techniques are implemented in most storage systems to have improved performance.
    Data is temporarily stored in cache memory DIMM for faster read/write requests.
    There are several techniques available: write-back, read-ahead, write-through,
    and adaptive caching.


    RAID is also another popular technology that is implemented in all storage systems.
    RAID is basically hard disk configuration during creation of virtual volume for
    host server to access. Host server is unaware of physical drives that are used
    to configure the virtual volume. It treats the volume like a single disk. Depending
    on various RAID levels, it influences performance, availability of data, and space
    efficiency. For instance, RAID 0 stripes the data across all the drives that are
    configured; it provides better performance and space efficiency, but no fault
    tolerance. On the other hand, RAID 6 or RAID 1 with many drive members provides
    best fault tolerance, but performance may not be as good as RAID 0. In summary,
    RAID configuration is a tradeoff among performance, data availability, and space
    efficiency.


    No RAID level increases efficiency of data storing capability, meaning there is
    no RAID level that can store more data on less space. For example, more than 100GB
    data cannot be stored on 10 number of 10GB disks. All RAID levels reduce the usable
    capacity except RAID 0. Only RAID 0 configuration will allow to store maximum
    100GB on 10 number of 10GB disks; RAID 1+0 will allow you to store maximum 50GB.


    ### Comparing RAID Levels


    | | RAID 0 | RAID 1 | RAID 3 | RAID 5 | RAID 6 |

    |---|---|---|---|---|---|

    | I/O performance | Highest | High | Medium | Medium | Low |

    | Fault tolerance | None | Highest | Medium | Medium | High |

    | Space efficiency | Highest | Low | Medium | Medium | Medium |


    Table 3.6: RAID level comparison

