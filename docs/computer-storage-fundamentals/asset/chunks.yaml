    - b. `SATA` 设备支持热插拔

    - c. `SATA` 是点对点架构

    - d. `SATA` 设备可以接受 `SCSI` 命令


    ## 57. 哪种存储协议可以接受类似 `FileA.doc` 或 `FileB.xls` 的主机请求？


