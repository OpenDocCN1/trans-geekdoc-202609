    \ are changed simultaneously from multiple switches.\n- Zone configuration modified\
    \ from lower model of switch in a mix switch model SAN.\n\nProcedure to fix it,\
    \ is as follows:\n\n- Identify the switch which has valid zone configuration.\n\
    - Disconnect the ISL links.\n- Clear the zone configuration from other switches.\n\
    - Reconnect the links back to replicate the configuration to all the switches.\n\
    \n### Zoning Guidelines\n\nThere are several best practices that need to be followed\
    \ while creating zone. Every vendor highlights guideline in their product documentations.\
    \ Following are some generic best practices for zoning:\n\n- Always implement\
    \ zoning.\n- Apply zoning changes during off-peak hours.\n- All type of operating\
    \ systems, Tape and Storage Arrays must be in different zone. All cluster nodes\
    \ must be separated by their cluster configuration.\n  - `Linux1`, `Linux2` in\
    \ `Zone1` and `Windows1` in `Zone2`\n  - `Tape_Lib1`, `Host1` in `Zone1` and `Storage1`,\
    \ `Host1` in `Zone2`\n  - `Cluster1_Member1`, `Cluster1_member2` in `Zone1`, `Cluster2_Member1`,\
    \ `Cluster2_member2` in `Zone2`, and `Host1` in `Zone3`\n- Use single initiator\
    \ zoning.\n- Single initiator (host) and single target (storage) is recommended\
    \ in a zone.\n- WWN based zoning is recommended because of interoperability and\
    \ MPR configuration in the future.\n- Pure port-based and WWN-based zoning handled\
    \ by ASIC (Hardware).\n- Mixed zoning (Port and WWN) handled by name server (processor).\n\
    - Alias must be created for each device with a meaningful name.\n- Zoning configuration\
    \ modification is recommended to do on the principal switch.\n- Clear unused zoning\
    \ elements.\n- Do not have tapes and disks defined in the same zone.\n\n## LUN\
    \ Masking\n"
  trans: "\n\n## 部分网状拓扑\n\n在部分网状拓扑中，并非所有交换机都连接到其他每一台交换机。与全网状拓扑相比，在该拓扑中，跳数可能会增加，具体取决于主机服务器和存储的连接方式，但可以节省\
    \ ISL（交换机间链路）所使用的端口数量。\n\n## 网状结构：核心-边缘拓扑\n\n核心-边缘拓扑包含两类交换机层级：边缘层和核心层。边缘层通常由连接主机服务器的低端交换机组成。这些边缘层交换机彼此不相连；相反，它们连接到核心层交换机。\n\
    \n核心层通常由高端旗舰级交换机组成。通常，一台或两台存储系统由许多主机服务器共享，因此该拓扑有助于以最少的跳数为所有主机服务器到存储系统实现更好的带宽分配。\n\
    \n![Figure 5.6: Core-edge or tiered topology](img/Fig_5.6.png)\n\n**Figure 5.6:\
    \ Core-edge or tiered topology**\n\n该拓扑还减少了 ISL 的端口利用率。\n\n核心-边缘拓扑通常用于企业存储解决方案。\n\
    \n## 分区\n\n分区是将 SAN 结构逻辑划分为更小子集的过程。在下图中，尽管服务器和存储都连接到同一个结构，但由于 `Zone1` 和 `Zone2`\
    \ 的存在，`Server1` 只能访问 `Storage1`，而 `Server2` 只能访问 `Storage2`。分区用于限制干扰、增加安全性并简化管理。\n\
    \n分区可提供多项优势：\n\n- **安全性**：分区可防止用户访问其不需要的信息。\n- **性能**：阻止不必要的结构广播，从而提高 I/O 性能。\n\
    - **可管理性**：通过将 SAN 拆分为多个区块，分区使跟踪设备、存储和用户变得更加容易。\n- **按用途分离**：设置分区以反映运营类别（如工程部或人力资源部），可从逻辑上组织存储。这也便于为测试或其他目的建立专用网络。\n\
    - **按操作系统分离**：将不同的操作系统放在不同的分区中，可降低数据损坏的可能性。\n- **允许临时访问**：管理员可暂时移除分区限制，以允许夜 ly\
    \ 备份等任务。\n\n![Figure 5.7: Zoning: Logical partitioning](img/Fig_5.7.png)\n\n**Figure\
    \ 5.7: Zoning: Logical partitioning**\n\n请参考下图：\n\n![Figure 5.8: N_Port devices,\
    \ zone, and zone set or Configuration](img/Fig_5.8.jpg)\n\n**Figure 5.8: N_Port\
    \ devices, zone, and zone set or Configuration**\n\n- `Device1` 和 `Device2` 在\
    \ `Zone1` 中可以互相看到\n- `Device2` 和 `Device3` 在 `Zone2` 中可以互相看到。\n- `Device1` 和 `Device3`\
    \ 将无法互相看到。\n\n![Figure 5.9: Multiple zone configurations](img/Fig_5.9.png)\n\n\
    **Figure 5.9: Multiple zone configurations**\n\n在任何给定时间，只能启用一种配置。例如，如果启用了 `Config3`，`Device2`\
    \ 和 `Device1` 可以在 `Zone4` 中互相看到，而 `Device1` 和 `Device3` 可以在 `Zone2` 中互相看到。\n\n\
    `Config1` 和 `Config2` 之间没有区别。\n\n**注意事项：**\n\n- 未配置分区时，连接到结构中的所有设备均可互相看到。\n- 如果已配置分区，但某些设备未包含在任何分区中，则没有设备可以看到它们。它们也无法互相看到。\n\
    - 如果配置了分区并进行了修改，分区配置会自动复制到结构中的其他交换机。\n- 完全无单点故障 (NSPOF) 环境至少需要两个结构。分区必须在每个结构中单独实施。\n\
    - 制造商将一个唯一的 8 字节（64 位）地址编码到每个 FC 适配器中，称为全球名称 (`WWN`)，每个端口的唯一地址称为全球端口名称 (`WWPN`)。\n\
    - **基于 WWN 的分区**：按 WWN 名称定义分区/别名。缺点：如果 HBA 故障需要更换，你也必须更改分区信息。\n- **基于端口的分区**：按交换机域\
    \ ID/端口号定义分区/别名。缺点：你不能简单地将线缆插入另一个端口。\n\n### 硬分区与软分区\n\n- **硬分区** 从物理上阻止区域外的任何设备访问该分区。\n\
    - **软分区** 使用 FC 交换机中实现的过滤功能，防止端口被其分配分区之外的设备看到。软分区的安全漏洞在于，如果另一个分区中的用户正确猜中了 FC 地址，该端口仍然可以被访问。\n\
    - 软分区类似于你的未公开家庭电话号码。然而，如果有人拨打了正确的号码，你的电话仍然会响。对于硬分区，可以将其视为来电显示屏蔽。即使你知道号码，也无法接入。\n\
    - 硬分区将设备物理映射到端口，软分区将其逻辑映射。如果你使用设备的 `WWN` 进行分区定义，则使用的是软分区。如果你使用物理端口号，则使用的是硬分区。\n\
    - Brocade 的硬件分区仅在使用基于端口的分区时启用。并非所有供应商都如此，因为许多供应商提供的端口分区仍基于软件，不够安全。\n- 软分区更加灵活且易于实施，尤其是在非常大型、复杂的\
    \ SAN 中。如果你的 SAN 规模不大且不复杂，或者公司拥有可用资源，硬分区能提供更高的安全性。\n\n### 典型分区配置步骤\n\n1. 识别每个设备及其\
    \ `WWN` 或设备连接的端口。\n2. 为每个设备或端口分配有意义的别名。创建别名是可选步骤，但建议执行。如果未创建别名，创建分区时可直接使用 `WWN`。\n\
    3. 创建分区并将所需设备包含在其中。\n4. 创建配置或分区集，并将所需分区包含在其中。\n5. 启用配置或分区集。\n\n### 分区冲突\n\n分区冲突是指在同一结构中存在多个分区配置时发生的错误状况。这主要发生在同一结构中两台不同交换机的分区配置不同时。以下是分区冲突的潜在原因：\n\
    \n- 两台交换机之间的链路中断，修改了分区配置，然后链路恢复。\n- 从多台交换机同时更改配置。\n- 在混合交换机型号的 SAN 中，从低端型号交换机修改分区配置。\n\
    \n修复步骤如下：\n\n- 识别具有有效分区配置的交换机。\n- 断开 ISL 链路。\n- 清除其他交换机上的分区配置。\n- 重新连接链路，将配置复制到所有交换机。\n\
    \n### 分区准则\n\n创建分区时需遵循多项最佳实践。每个供应商都会在其产品文档中强调相关准则。以下是一些通用的分区最佳实践：\n\n- 始终实施分区。\n\
    - 在非高峰时段应用分区更改。\n- 所有类型的操作系统、磁带库和存储阵列必须位于不同的分区中。所有集群节点必须按其集群配置进行分离。\n  - `Linux1`、`Linux2`\
    \ 在 `Zone1` 中，`Windows1` 在 `Zone2` 中\n  - `Tape_Lib1`、`Host1` 在 `Zone1` 中，`Storage1`、`Host1`\
    \ 在 `Zone2` 中\n  - `Cluster1_Member1`、`Cluster1_member2` 在 `Zone1` 中，`Cluster2_Member1`、`Cluster2_member2`\
    \ 在 `Zone2` 中，`Host1` 在 `Zone3` 中\n- 使用单发起程序分区。\n- 建议一个分区中包含单个发起程序（主机）和单个目标（存储）。\n\
    - 推荐基于 WWN 的分区，因为它利于互操作性和未来的 MPR 配置。\n- 纯基于端口和基于 WWN 的分区由 ASIC（硬件）处理。\n- 混合分区（端口和\
    \ WWN）由名称服务器（处理器）处理。\n- 必须为每个设备创建具有有意义名称的别名。\n- 建议在主交换机上进行分区配置修改。\n- 清除未使用的分区元素。\n\
    - 不要在同一个分区中定义磁带和磁盘。\n\n## LUN 掩码\n\n"
