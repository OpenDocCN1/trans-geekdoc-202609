    \n a. Snapshot\n\n b. Clone\n\n c. Backup\n\n d. Remote replication\n\n### Descriptive\
    \ questions\n\n 1\\. Describe different levels of fault tolerance features that\
    \ are implemented in a storage solution and as well within a storage system. Starting\
    \ from host server up to the physical disk behind the storage controller.\n\n\
    \ 2. Explain use case and purpose of snapshot of snapshot.\n\n 3. Describe advantage\
    \ and disadvantage of synchronous and asynchronous mode replication.\n\n 4. Describe\
    \ difference between business continuity BC and DR solutions. Features of a storage\
    \ system associated to BC and DR.\n\n### Quiz questions\n\n 1. Difference between\
    \ COW or ROW, which snapshot technology provides better write performance on to\
    \ a RW snapshot and why?\n\n 2. What is the purpose of bi-directional remote replication?\n\
    \n 3. Snapshots are used only for backup purpose. Do you support this statement?\n\
    \n 4. What is WORM and name three benefits of it?\n\n## Glossary and key terms\n\
    \n*   Business continuity: Proactive measure to ensure availability of business\
    \ critical data.\n\n*   Disaster recovery: Process and procedure of recovering\
    \ data back in normal operation after a disaster strike.\n\n*   Recovery point\
    \ objective: The maximum age of the data you want to restore in the event of a\
    \ disaster.\n\n*   Recovery time objective: The time needed to recover from a\
    \ disaster.\n\n*   Point-in-time: Refers to Snapshot that holds data at given\
    \ PIT of parent volume.\n\n*   Snapshot: A PIT copy of the contents of a virtual\
    \ volume created without interrupting I/O operations on it. Snapshots are typically\
    \ used for short-term tasks, such as report generation and backups.\n\n*   Clone:\
    \ A copy of parent virtual volume, but separate and intendant virtual volume.\n\
    \n*   Copy on write: Data first gets written to snapshot and updates data in parent\
    \ volume.\n\n*   Redirect on write: Data gets written to a new location and parent\
    \ volume points to it. Snapshot continues to point to original locations.\n\n\
    *   Continued data protection: Makes a copy of data for change of data.\n\n* \
    \  Sync or synchronous replication: A mode remote replication, in which data gets\
    \ replicated before acknowledges write operation to host.\n\n*   Async or asynchronous\
    \ replication: A remote replication mode, in which data gets acknowledges first\
    \ to host and then replicates to destination storage in the background.\n\n* \
    \  Application consistent snapshot: Snapshot that is created after quescing I/O\
    \ operations on the primary volume and flashing in- memory data by the application.\n\
    \n*   Crash consistent snapshot: Snapshot that is created without quescing I/O\
    \ operations.\n\n*   Flat backup: Backup solution that reads data from snapshot\
    \ and copies on to a backup system, without reading data from host servers.\n\n\
    *   Changed block tracking: It is technology using which storage system keeps\
    \ track of blocks that got updated by the host servers. Backup software refer\
    \ those blocks to perform incremental backup.\n\n*   Copy data management: It\
    \ is a software solution using which number of copies of data is managed efficiently\
    \ and meets requirement of multiple copies.\n\n*   Write Once Read Many: A data\
    \ archival technology to store data in an unalterable way.\n\nJoin our Discord\
