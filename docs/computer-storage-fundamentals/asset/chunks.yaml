- raw: "A method to allow and restrict server access to storage LUN, in the other\
    \ words this can also be described as allocation of storage LUN to that server.\
    \ This is the step performed to provide access LUN to a host server after the\
    \ creation of virtual volume. LUN masking is similar to zoning but is implemented\
    \ in the storage array, not in the switch.\n\nDifferent vendors use different\
    \ terminologies for allow and restrict server access to storage LUN, some of them\
    \ are present and unpresent or export and unexport or assigned and unassigned,\
    \ LUN binding, and so on.\n\nA unique LUN ID is assigned at the time of providing\
    \ access of a virtual volume to a host. When multiple volumes are presented to\
    \ a host, they are assigned unique LUN ID. Same virtual volume should not be presented\
    \ to multiple hosts if they are not in cluster. This is to avoid data corruption\
    \ by simultaneous write operations on a virtual volume.\n\nSome operating systems\
    \ identify storage device based on their LUN ID, after cluster failover, application\
    \ to refer correct storage volume, device naming must be consistent across all\
    \ cluster members. Therefore for cluster solution, each volume must be presented\
    \ to all cluster members with same LUN ID.\n\n## Multipath\n\nMultipath technique\
    \ is implemented in host server to utilize the multiple paths of a redundant network\
    \ to provide high availability and bandwidth between host server and storage devices.\n\
    \nThere are primarily two reasons to have multiple paths to storage LUN:\n\n1\\\
    . NSPOF, if one path fails, I/O continues using other available paths.\n\n2\\\
    . Higher bandwidth, using load balance across all available paths.\n\nMultipath\
    \ is applicable and implemented for both iSCSI and FC environments.\n\n![Figure\
    \ 5.10: Formation of multipath](images/Fig_5.10.jpg)\n\nFigure 5.10: Formation\
    \ of multipath\n\nPhysical cabling and zoning, both the configurations impact\
    \ number of paths. For example, in [Figure 5.10](#ch05.xhtml#fig5-10), if all\
    \ the target ports are zoned with all the initiator ports, the server would get\
    \ to access each LUN with multiple paths but in this setup, if zoning is done\
    \ between only one target port and one initiator port, then, only one path would\
    \ be available for server to access LUN.\n\nNumber of paths = Number of paths\
    \ from host server to switch X\n\nNumber of paths from storage system to switch.\n\
    \nAll modern operating systems have multipath driver in-built into it. Previously\
    \ storage vendor used to supply multipath application for each operating system.\
    \ There are still some storage vendors who develop and sell multipath as a separate\
    \ software component which provides more intelligent load balancing and path failover\
    \ mechanism.\n\nWithout multipath software, one device for each path would be\
    \ visible. For example, if a LUN has four paths, there would be total four devices\
    \ being seen from operating system.\n\nWriting data simultaneously on to different\
    \ devices for same LUN may also result in data corruption.\n\nFor easy device\
    \ management some multipath software hides all device except one per LUN.\n\n\
    Why do we need single device appearance in operating system? Without Multipath\
    \ driver, each path from a host server to a storage system is treated by the operating\
    \ system as a separate device. For example, if a virtual volume presented to a\
    \ Linux host with four paths, operating system finds four device: /dev/sdb, /dev/sdc,\
    \ / dev/sdd and /dev/sde, one corresponds to each path. Multipath driver creates\
    \ a single multipath device on top of these underlying devices and balances I/O\
    \ paths across these available paths. Some multipath driver, such as Windows MPI/O,\
    \ hides devices corresponds to each path to avoid confusion and simultaneous writes\
    \ via different paths that may lead to data corruption.\n\n### Load balancing\
    \ policies\n\nThe objective of load balancing is to maximize workload throughput,\
    \ reduce I/O latency and optimize resource utilization. To have better control\
    \ on load balancing, multipath driver allows administrator to set user defined\
    \ polices. Though different vendor designs and implements different set of policies,\
    \ fundamentally they are more or less similar. Following are the typical list\
    \ of load balancing policies:\n\n•  Round robin (RR): All I/O requests are distributed\
    \ across all active paths to the device in a RR manner. RR is most commonly used\
    \ and default load balancing policy but it does have much intelligence, it uses\
    \ all the available paths in a balanced way.\n\n•  Shortest queue requests (SQR):\
    \ Each I/O request is routed to the active path with the least number of outstanding\
    \ requests.\n\n•  Shortest queue bytes (SQB): Each I/O request is routed to the\
    \ active path with the least number of outstanding data bytes.\n\n•  Shortest\
    \ queue service time (SQST): Each I/O request is routed to the active path where\
    \ the total outstanding time for pending I/O requests is the least.\n\n•  No load\
    \ balance (NLB): All I/O requests are routed through a chosen active path.\n\n\
    ## Conclusion\n\nDepending on the requirement and complexity of storage solution,\
    \ SAN topology is designed. There are three different type SAN fabric topology\
    \ such as single switch, mesh, and core-edge topology. Typically single-switch\
    \ topology is used in entry level storage solution, and mesh topology is used\
    \ in mid-range solution. And enterprise storage solution uses core-edge tiered\
    \ topology.\n\nZoning and LUN masking are more of configuration of restriction\
    \ and better management of storage access. Zoning is done between two ports that\
    \ is, one from host server (initiator) and other from storage system (target)\
    \ and LUN masking is about providing access to a virtual volume to host server.\n\
    \nBoth the functionalities in storage solution are important consider for better\
    \ management and stability of the storage solution\n\nMultipath is operating system\
    \ level intelligence to determine and distribute all I/O request across all available\
    \ paths. Thus enhances performance and as well fault tolerance aspect in storage\
    \ solution.\n\nTo summarize, following three important configuration checks must\
    \ be met for a host server to access storage LUN:\n\na) Physical cabling between\
    \ server and storage\n\nb) Configuring zoning to allow access\n\nc) Configuring\
    \ LUN masking to allow access to LUN\n\n## Case studies\n\n### Case study 1: Steps\
    \ to configure zoning in a fabric with Brocade FC switch\n\nLet us look at the\
    \ steps to configure zoning in a fabric with Brocade FC switch:\n\n#### Requirement\n\
    \nYour company is planning to deploy a SAN environment that consists of a Linux\
    \ and a Windows host server connected to a storage system via Brocade FC switch.\
    \ The solution also includes a tape device connected to same SAN. Windows server\
    \ is going to run a backup application that requires FC access to the tape device.\
    \ WWPN details of FC adapters are as follows:\n\nLinux host: 50:01:43:80:24:27:5a:a8\n\
    \nWindows host: 10:00:70:10:6f:e8:77:6f \n\nStorage controller 1: 20:11:00:02:ac:01:84:ea\
    \ \n\nStorage controller 2: 21:11:00:02:ac:01:84:ea \n\nTape device: 50:01:43:80:28:ce:4a:7e\n\
    \n![Figure 5.11: Host servers and storage systems](images/Fig_5.11.jpg)\n\nFigure\
    \ 5.11: Host servers and storage systems\n\n#### Analysis\n\nBoth initiators and\
    \ target devices are connected to single fabric involving single switch. Zoning\
    \ is required to be implemented only in this switch. Two host servers are not\
    \ in the cluster and running different operating systems. Therefore, they need\
    \ to be in the different zone. Separate zones are needed to be created for target\
    \ devices. As per the requirement, the storage system is needed to be accessible\
    \ by both Linux and Windows hosts and tape device by only windows host.\n\nThere\
    \ are three zones needed:\n\n1\\. Zone for Linux host and storage system\n\n2\\\
    . Zone for Windows host and storage system\n\n3\\. Zone for Windows host and tape\
    \ device\n\nFor better management of zone configuration, each device can have\
    \ meaningful alias name. Those devices with alias name can be member of respective\
    \ zone. and then finally all zones can be part of a zone configuration.\n\n####\
    \ Solution"
  fmt: "\n# Storage Access Configuration: LUN Masking, Multipath, and Zoning\n\n##\
