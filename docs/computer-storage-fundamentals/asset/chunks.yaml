  trans: "\n\n# 多项选择题\n\n## 第 81 题\nb. 存储资源利用率提高  \nc. 无需停机即可扩展存储空间  \nd. 以上皆是\n\n\
    ## 第 82 题\nLUN 基本上是：\n\na. 主机操作系统用于与设备通信的地址  \nb. 分配给存储设备或存储可支持的每个存储分区的唯一编号  \n\
    c. 硬编码在 `FC HBA` 中的地址，用于标识结构中的各个端口（`N_Port` 或 `F_Port`）  \nd. 用于与 `FC` 设备通信的地址\n\
    \n## 第 83 题\n`WWN` 基本上是：\n\na. 主机操作系统用于与设备通信的地址。  \nb. 分配给存储设备或存储可支持的每个存储分区的唯一编号。\
    \  \nc. 硬编码在 `FC HBA` 中的地址，用于标识结构中的各个端口（`N_Port` 或 `F_Port`）  \nd. 用于与 `FC` 设备通信的地址\n\
    \n## 第 84 题\n制造商编码到每个端口的 `WWN` 地址位数为：\n\na. 16 位  \nb. 24 位  \nc. 48 位  \nd. 64\
    \ 位\n\n## 第 85 题\n结构为所有节点提供哪些服务？\n\na. 结构登录  \nb. 结构地址通知  \nc. 注册状态变更通知  \nd.\
    \ 以上皆是\n\n## 第 86 题\n`FC` 中最小的信息传输单元是什么？\n\na. 包  \nb. 帧  \nc. 序列  \nd. 交换\n\n\
    # 简答题\n\n1. 描述 `SCSI` 命令的不同阶段，并描述 `SCSI` 协议的写和读请求序列。\n\n2. 当服务器或存储连接到结构时，描述为建立通信而发生的每个登录过程。\n\
    \n3. 描述并重点说明 `iSCSI`、`FCIP` 和 `iFCP` 协议的用途。\n\n# 测验题\n\n1. 什么是 `SCSI` 发起器和目标？\n\
    \n2. 如果 `IP` 地址等同于 `FCID`，`MAC` 地址等同于 `WWPN`，那么什么等同于 `DHCP` 客户端和服务器？\n\n3. `FC`\
    \ 结构类似于任何语言的语法等价物。`FC` 字也类似于任何语言中的词。如果 `FC` 帧等同于句子，那么什么等同于段落和整个对话？\n\n4. 什么是 `iSCSI`\
    \ 的 `iSNS` 服务器的类比物？\n\n5. 解释主机 I/O 超时和延迟的区别。\n\n# 术语表与关键\n\n*   **`SAS`**：串行连接\
    \ `SCSI` 接口协议，用于磁盘驱动器。\n*   **`SATA`**：串行高级技术附件接口协议，用于磁盘驱动器。\n*   **`HBA`**：主机总线适配器。用于将主机服务器连接到结构的适配器。\n\
    *   **`SFP`**：小型可插拔收发器，将电信号转换为光信号。\n*   **`WWN`**：全球名称是一个唯一的 `FC` 标识符，由 16 位十六进制数组成。每个\
    \ `FC` 通信端口都需要 `WWN`。\n*   **`WWNN`**：全球节点名称是一个全局唯一的 64 位数字，用于标识节点进程。\n*   **`WWPN`**：全球端口名称是一个全局唯一的\
    \ 64 位数字，用于标识节点端口。\n*   **`ISL`**：站间链路，一个 `FC` 交换机到另一个 `FC` 交换机的连接。\n*   **`FC`**：光纤通道，一种主要用于将存储连接到主机服务器的高速网络技术。`FC`\
    \ 支持包括 `IP` 和 `SCSI` 在内的多种常见传输协议。\n*   **`FCoE`**：以太网上的光纤通道。整合 LAN 和 SAN。\n* \
    \  **`Fabric`**：`FC` 交换机或集线器及其他设备的网络。\n*   **`FCID`**：光纤通道 ID，在结构登录（`FLOGI`）期间获得的\
    \ 24 位 `FC` 地址。\n*   **`iSCSI`**：互联网 `SCSI` 接口协议，用于对 `IP` 存储设备进行块级访问。\n*   **`IQN`**：`iSCSI`\
    \ 限定名，`IP` 存储系统中用于访问 `iSCSI` 设备的唯一名称。\n*   **`iSCSI HBA`**：硬件 `iSCSI` 发起器适配器卡。\n\
    *   **`iSNS`**：互联网存储名称服务，`IP` 存储设备的名称注册服务。\n*   **`CHAP`**：质询握手认证协议，为 `iSCSI`\
    \ 存储卷提供安全性。\n*   **`CNA`**：融合网络适配器，同时具备 `FC HBA` 和以太网 `NIC` 的功能。\n*   **`NQN`**：`NVMe`\
    \ 限定名，类似于 `iSCSI` 限定名，`NVMe` 存储系统中用于访问 `NVMe` 设备的唯一名称。\n\n# 社区\n\n加入我们的 Discord\
    \ 空间\n\n加入我们的 Discord 工作区，获取最新动态、优惠、全球技术动态、新版本发布以及与作者的交流会议：\n\n[`discord.bpbonline.com`](https://discord.bpbonline.com)\n\
    \n![QR-Logo](img/fm1.png)\n\n# 第 5 章：共享存储的存储网络\n\n## 简介\n\n随着计算机网络的发展，行业趋势已转变为多个集群服务器托管不同的应用程序。因此，出现了用于共享数据的集中式存储的额外需求。于是，一种用于共享存储系统的新网络——称为\
    \ `SAN`——应运而生。\n\n换句话说，计算机网络是一种通信网络，允许在主机服务器和存储之间交换数据。\n\n![Figure 5.1: Computer\
    \ networking](img/Fig_5.1.jpg)\n\n图 5.1：计算机网络\n\n请参阅以下 Figure 5.2：\n\n![Figure\
    \ 5.2: Storage networking to share storage](img/Fig_5.2.png)\n\n图 5.2：共享存储的存储网络\n\
    \n`SAN` 结构是一个逻辑实体，由多个相互连接的 `FC` 交换机组成。两个交换机之间的连接称为交换机间链路（`ISL`）。\n\n## 结构\n\n\
    成功完成本章后，您将能够了解存储网络的以下关键领域：\n\n*   `SAN` 拓扑\n*   分区\n*   LUN 屏蔽\n*   多路径\n\n##\
    \ 目标\n\n在本章中，您将学习主机服务器和存储系统连接的不同网络拓扑。您还将学习控制主机服务器对存储系统各种访问的网络配置，例如分区和 LUN 屏蔽。\n\
    \n正是由于特定的网络物理连接和访问配置，在主机服务器和存储系统之间创建了多条路径。在本章中，您还将学习如何通过多条路径访问虚拟卷，以及负载均衡和故障转移。\n\
    \n### SAN 拓扑\n\n在设计 `SAN` 时，拓扑是最重要的考虑因素之一。拓扑主要取决于网络规模的大小、将连接多少主机服务器和存储系统等需求。\n\
    \n一个或两个交换机相互连接形成一个结构。再将一个或两个结构组合在一起称为 `SAN`。\n\n下图显示了单结构和双结构 `SAN`。至少需要两个结构才能实现无单点故障（`NSPOF`）环境，在这种环境中，任何结构故障都不会影响主机服务器与存储的通信。\n\
    \n![Figure 5.3: Single fabric and dual fabric SAN](img/Fig_5.3.png)\n\n图 5.3：单结构和双结构\
    \ SAN\n\n为了实现冗余，最佳实践是拥有两个结构并让设备同时连接到两者。这确保了在发生结构故障时仍有一条路径可用。\n\n`SAN` 结构中有三种类型的拓扑：\n\
    \n*   **单交换机拓扑**：仅使用一个交换机来形成结构并将主机服务器连接到存储系统。这主要用于连接少量主机服务器到存储系统的入门级存储解决方案。\n\n\
    \    ![Figure 5.4: Single switch topology](img/Fig_5.4.png)\n\n    图 5.4：单交换机拓扑\n\
    \n    虽然这是一种具有成本效益的解决方案，但交换机故障将导致主机服务器与存储之间的通信故障。\n\n*   **网状结构**：在网状结构中，交换机通过\
    \ `ISL` 连接到其他交换机。\n\n    网状结构分为两种类型：全网状和部分网状。在全网状拓扑中，每个交换机都通过 `ISL` 连接到其他每个交换机。主机最多只需经过一跳即可访问其存储。跳数定义为主机服务器和存储系统之间路径上的交换机数量。大多数交换机供商支持最多\
    \ 7 跳。\n\n    ![Figure 5.5: Full and partial mesh topology](img/Fig_5.5.png)\n\
    \n    图 5.5：全网状和部分网状拓扑\n\n"
