- raw: 'To increase the degree of fault tolerance, replication can also be one to
    many, multiple hops. Typically, advance storage systems have these implemented.


    Asynchronous mode of replication is commonly referred as async replication.


    Generally replication between two storage systems of same vendor uses their own
    propriety protocol to copy data at block level. This makes the replication faster
    and more reliable. Most of the enterprise organizations prefer and implement block
    level replication in their environment.


    ![Figure 7.20: Block level data replication between same types of storage systems](images/Fig_7.20.jpg)


    Figure 7.20: Block level data replication between same types of storage systems


    There are also software solutions available that accesses virtual volumes from
    both storage systems and copies data from one to other. Copy can be performed
    at file system level or a volume level. This solution is comparably slower and
    less reliable, but can be implemented in two different types of storage systems.
    Software based replication solution is most asynchronous replication.


    ![Figure 7.21: Software-based replication solution](images/Fig_7.21.jpg)


    Figure 7.21: Software-based replication solution


    Achieving RPO objective through data replication:


    Local and remote replication both are data protection solution. For instance,
    to achieve six hours of RPO objective through local replication, you need to create
    snapshot at least every six hours. In synchronous remote replication, RPO value
    is zero. To improve RPO value for asynchronous replication both the storage systems
    must be have sufficient bandwidth available and unwritten data space at local
    storage system. In case of snapshot based asynchronous replication, you need to
    specify replication at least every six hours. Of course, bandwidth must be available
    to copy the change data within six hours of time to avoid overlap with next replication
    cycle.


    ### Backup solution


    Backup solution is a data backup and recovery solution that ensures critical data
    is copied on to another system at a regular internal basis. Backup solution is
    also the part of a storage solution. The system on which data is backed up is
    called backup system; it can have pool of tape drives, disk drives or optical
    disks. Backup system is also called secondary storage, which is typically designed
    to store more data. Primary storage, such as storage disk arrays are designed
    for high performance. Applications run on host server, do not perform direct RW
    operation on to the backup system.


    ![Figure 7.22: Traditional backup solution](images/Fig_7.22.jpg)


    Figure 7.22: Traditional backup solution


    Though remote replication technology copies data from storage system to other,
    it has a disadvantage. In the event of accidental deletion or update of data,
    data corruption, virus infected data also gets replicated other storage system.
    Replication solution does not help these scenarios. Therefore every organization
    must implement backup solution to recover data in case of any loss.


    Backup solution typically consists of a backup server that runs backup software,
    client part of the backup software run on application servers and then backup
    jobs are configured and scheduled to read data from application server and copy
    to backup devices. First backup is called full backup, subsequent backup of the
    same set of data is called incremental backup, as it copies only the changed data
    since last full or incremental backup.


    Some backup solution also copies the on to cloud storage to ensure double protection
    of data and easy access from geographical location.


    Snapshot based data backup solution:


    Recent years storage snapshot based data backup is replacing traditional backup
    solution. Snapshot is a PIT copy of the data of a primary virtual volume. Instead
    of reading data from application server, data directly read from snapshot of the
    virtual volume on which application stores data.


    ![Figure 7.23: Snapshot based backup solution](images/Fig_7.23.jpg)


    Figure 7.23: Snapshot based backup solution


    Every time backup job is run, a snapshot is created and reads the data from the
    snapshot and copy on to a backup system. This method of backup technology is called
    flat backup.


    ![Figure 7.24: Direct backup solution](images/Fig_7.24.jpg)


    Figure 7.24: Direct backup solution


    Latest storage systems or backup system have backup software incorporated within
    it that eliminates the need of a separate backup server in between and copies
    data directly from storage system to backup system. Thus, it improves efficiency
    of data copied further.


    Some storage systems and backup software are intelligent to understand data blocks
    on the snapshot that has user data, software backs up only those blocks, thus
    reduces backup time significantly. However, this impact only first backup.


    Subsequent backups are called incremental backup. Some intelligent storage system
    has changed block tracking (CBT) technology implemented; backup software leverages
    this technology to backup only the blocks that have changed with respect to previous
    snapshot and backup.


    When application is actively performing RW operations on to the storage volumes,
    at any given time there may be some part of data in memory, therefore, PIT snapshot
    may miss in-memory data. Application may find in-consistency upon recovery of
    the data from this snapshot. To create an application consistent snapshot, backup
    software sends a command to application to quiesce the I/O operations and flash
    the data to disk, once completed, snapshot gets created and then I/O is resumed.
    Quiescing is a technique to pause application I/Os for a while to get it is consistent
    state.Snapshot created with this method is called application-consistent snapshots.
    Snapshot created without quiescing application is called crash-consistent snapshot.


    For instance, to achieve six hours of RPO objective through local replication,
    you need to schedule backup at least every six hours.


    ### Continuous data protection


    Continuous data protection (CDP) refers to real-time data backup for every change
    of data. This technology keeps tracks of all the changes of data and ensures backup
    is always occurring. Unlike traditional backup, CDP technology does not require
    any scheduling of backup tasks.


    Data on virtual volume can be reverted to any point in time data. For example,
    suppose the data gets infected or corrupted at 9:41 AM. Data that was at 9:40
    AM can be restored back. Therefore, with CDP technology, RPO value is near to
    zero.


    Most vendors offer CDP through implementing frequent snapshots. Some intelligent
    storage system is capable of keeping track of every change of block in a journal.
    But these frequent tasks create an overhead in the system and impacts host server
    I/O performance. Therefore, frequency of CDP backup becomes a tunable parameter
    and tradeoff for an administrator to decide between performance and granularity
    of data backup.


    Copy data management:


    Data on snapshot or backup sets are not only used for recovery, these copies of
    data can also be used for other purposes, such as report generation, data analytics,
    test, and development. Recent days need for these is significantly growing because
    of big data and ecommerce evolutions.


    Copy data management is a software solution that manages copies of data more efficiently
    and meets the demand of several copies at the same time.


    Write Once Read Many:


    Some storage vendors make backup device or media that allows Write Once Read Many
    (WORM) technology, which is used to archive data for long periodof time in terms
    of years. This way of storing not only prevents accidental deletion or modification
    of data, but also enhances lifespan of storage device or media. Most organizations
    look for this feature compliance for their data protection policies for data security
    and legal reasons.'
