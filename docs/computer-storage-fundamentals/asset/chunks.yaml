    ## Glossary and Key Terms

    - **Thin provisioning**: Type of virtual volume, in which blocks gets allocated
    as and when host servers write on those. This helps to allocate only required
    space in the storage system.

    - **Dedup**: Deduplication that removes redundant data to reduce requirement of
    storage space.

    - **UNMAP**: `T10 SCSI UNMAP` standard, space reclamation feature to free up blocks
    where host data is deleted.

    - **Deduplication chunk size**: Unit of data size at which data is compared for
    duplication.

    - **Deduplication ratio**: The ratio between the amount of data received from
    host server and the actual space required in storing it after duplication.

    - **Compression ratio**: The ratio between amount of data received from the host
    server and actual space required to store it after compression.

    - **Rehydration**: Process of un-deduplication of duplicated data.


