    ### Spare disk


    Spare disk configuration within a storage system adds greater value in fault tolerance
    and data protection. It prevents the system to go in the degraded state. Upon
    failure of a disk, rebuild process usages the spare disk to generate data that
    was on the failed disk and make the virtual volume back to a healthy state.


    Storage system without spare disk configured goes into a degraded state upon failure
    of a disk. Depending on RAID level subsequent failure of the disk can result in
    data loss. Therefore, it is recommended to have multiple spare disks configured
    to avoid any data loss due to disk failures. Whenever spare disk get consumed
    by the rebuilding process, it is also important to have the failed disk replaced
    with working one and have it configured as a spare disk.


    ### Recovery point objective and recovery time objective


    In any data protection solution recovery point objective (RPO) and recovery time
    objective (RTO) are two important parameters that drive on how to deploy the solutions.


    •  RPO: The maximum allowable threshold time of the data that is needed to restore
    in the event of a disaster. For example, if your RPO is 6 hours, you want to be
    able to restore systems back to the state they were in as of no longer than 6
    hours ago.


    •   RTO: The time needed to recover from a disaster—usually determined by how
    long you can afford to be without your systems.


    ## Data replication


    There are multiple terminologies available for data replication. Replication of
    data is nothing but making a copy of data. The primary purpose of replication
    is to recover data in the event of data corruption or data loss. Replication features
    enhance fault tolerance and data protection aspects of a storage system. Primarily
    there are two types of replications implemented.


    ### Local replication


    Technologies that copies data locally to the same storage system are called local
    replication. Snapshot and clone are the examples of such technologies.


    Data on a production virtual volume keep changes, an application constantly accesses
    it for read or write operations. Therefore, there is a need to have a point in
    time copy of data on a virtual volume that can be used for taking an offline backup,
    accessing data to generate report, and so on.


    ![Figure 7.6: Local replication: Snapshot](images/Fig_7.6.png)


    Figure 7.6: Local replication: Snapshot


    Snapshot is a point in time (PIT) copy of data on a virtual volume. For example,
    if a host accesses a snapshot that was created at 9:00 AM, it reflects the data
    of the primary production volume at that point in time. Some storage system allows
    restoring snapshot data back to the primary volume. In case of accidental deletion
    of data on primary volume, data corruption or virus infection, data on latest
    snapshot can be restored back on to the primary volume to recover the data. Data
    of snapshot can also be used for other purposes like generating an offline report,
    analytics, test or development.


    Primary volume is also referred as the parent volume of a snapshot volume. Immediately
    after the creation of a snapshot, all blocks of the snapshot points to its parent
    volume, but as and when data on parent volume changes, old data gets copied to
    the snapshot and occupancy of snapshot increases. Blocks that are not changed
    since the creation of snapshot will continue to have the reference to parent volume.


    Example:


    At the time of snapshot creation, volume had data A, B, and C snapshot would also
    have the same data but all data is just reference to actual location of data on
    volume.


    ![Figure 7.7: Snapshot: After creation](images/Fig_7.7.png)


    Figure 7.7: Snapshot: After creation


    When a block of data is changed, let us say from C to D, data C is first copied
    to snapshot and then updated in parent volume from C to D. Reference from snapshot
    to parent volume for this data is also removed. Allocated size of snapshot grows
    by the size of data C. More writes in parent volume causes more updates and increase
    of allocated size of snapshot. In this process, snapshot continues to have the
    data at the time of creation of snapshot. Updated ones are physically located
    and unchanged ones still maintain reference to corresponding blocks in parent
    volume.


    ![Figure 7.8: Snapshot: After writing or updating data on primary volume](images/Fig_7.8.jpg)


    Figure 7.8: Snapshot: After writing or updating data on primary volume


    In the above method, before every write operation, data block in parent volume
    is copied to snapshot, this method of data update commonly used by most vendors
    and is called copy on write (COW).


    There is another popular method of data update implementation in snapshot technology
    called redirect on write (ROW).


    ![Figure 7.9: ROW After snapshot creation](images/Fig_7.9.png)


    Figure 7.9: ROW After snapshot creation


    ![Figure 7.10: After writing or updating data on primary volume](images/Fig_7.10.png)


    Figure 7.10: After writing or updating data on primary volume


    In ROW, after the creation of snapshot all blocks referred by the snapshot are
    frozen. As shown in above figure, upon any new update for C, the new data D is
    simply written in a new location in the storage and parent volume refers to it,
    instead of C. Whereas snapshot continues to refer the C. Therefore, in this method,
    a copy of operation from parent to snapshot is saved, but data in parent volume
    may get fragmented.


    COW vs. ROW:


    | Copy on write || Redirect on write |


    | --- | --- |


    | More write overhead || Less write overhead |


    | Makes data contiguous || Makes data noncontiguous |


    | Commonly implemented in storage systems || Few storage vendors implement it
    |


    Table 7.1: COW vs. ROW


    Snapshot does not provide protection of data against physical media failures of
    the parent volume. For example, if a storage volume has snapshots and due to multiple
    underlying disks failure, if data on parent volume is no more accessible, in that
    case, snapshots associated with it would also not be accessible. However, logical
    error, such as accidental data deletion or modification from the host server or
    virus infection, previous data can be recovered from the snapshot.


    There are two type of snapshots such as read/only (RO) and read/write (RW). RW
    snapshot allows the host to update data on it. If a copy of production data is
    required for test or development of an application or some other purposes, a RW
    snapshot can be created as a copy of original data and then update data further
    on it.


    Snapshot of snapshot:


    Before making any change on a RW snapshot, another snapshot of it can be created
    to keep a copy of it before application writes data on to it. Snapshot of a RO
    snapshot can also be created to have a second copy of the data.


    If application is continuously writing on to a RW snapshot, a snapshot of this
    snapshot can be scheduled, if the administrator wants to protect data of the snapshot
    at regular interval.


    Snapshot creation of a parent volume at regular interval is called a vertical
    tree and number of a snapshot in the tree is referred to as the depth of the tree.
    In [Figure 7.1](#ch07.xhtml#fig7-1), M is the depth of the vertical tree.


    Similarly, snapshot of a snapshot at regular interval creates a horizontal tree
    and number of snapshots in the tree is referred to as depth the tree. In following
    diagram, N is the depth of the horizontal tree.'
