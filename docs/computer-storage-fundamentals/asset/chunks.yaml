- raw: "#### RAID 3–byte level striping with dedicated parity\n\nEach data block is\
    \ subdivided (striped) and written on the data disks. Stripe parity is generated\
    \ on writes, recorded on the parity disk.\n\n•  Advantages:\n\no The performance\
    \ of the array is identical to the performance of one disk in the array except\
    \ for the transfer rate, which is multiplied by the number of data drives (i.e.,\
    \ less parity drives).\n\no Excellent performance for large, sequential data requests.\n\
    \no RAID level 3 requires a minimum of 3 drives to implement.\n\n![Figure 3.18:\
    \ RAID level 3: Byte level striping](images/Fig_3.18.jpg)\n\nFigure 3.18: RAID\
    \ level 3: Byte level striping\n\n•  Disadvantages:\n\no This technology is fairly\
    \ complex.\n\no Performance is slower for random, small I/O operations.\n\no Speed\
    \ is limited by the slowest disk.\n\n#### RAID 4–block level striping with dedicated\
    \ parity\n\nEach block is written onto a data disk. \n\n•  Advantages:\n\no Parity\
    \ is generated on writes, recorded on the parity disk. \n\no Very high read data\
    \ transaction rate.\n\no RAID level 4 requires a minimum of 3 drives to implement.\n\
    \n![Figure 3.19: RAID level 4: Block level striping](images/Fig_3.19.png)\n\n\
    Figure 3.19: RAID level 4: Block level striping\n\n•  Disadvantages:\n\no Single\
    \ parity drive is involved in every write and becomes the bottleneck as RAID 3\n\
    \no Worst write transaction rate and write aggregate transfer rate\n\n#### RAID\
    \ 5–block level striping with distributed parity\n\nEach data block is written\
    \ on a data disk.\n\n•  Advantages:\n\no Parity for blocks in the same rank is\
    \ generated on writes. \n\no Recorded in a distributed location.\n\no RAID level\
    \ 5 requires a minimum of 3 drives to implement.\n\n![Figure 3.20: RAID level\
    \ 5: Block level striping with distributed parity](images/Fig_3.20.png)\n\nFigure\
    \ 3.20: RAID level 5: Block level striping with distributed parity\n\n•  Disadvantages:\n\
    \no Disk failure has a medium impact on throughput\n\no Most complex controller\
    \ and its firmware design–difficult to rebuild in the event of a disk failure\n\
    \no Medium write data transaction rate\n\no Data on virtual volume becomes inaccessible\
    \ if two disks failed together or second disk fails when volume is in degraded\
    \ state due to previous disk failure\n\nRecovering from a disk failure\n\nRAID\
    \ 5 can tolerate the failure of one of the disks. In the case of failure of a\
    \ drive, data on the failed drive is calculated by RAID controller with parity\
    \ and data on other surviving drives. During this ,the system runs slow, as it\
    \ has to calculate user data from parity. The following table shows a simple example\
    \ on how data(Ax or By) is derived when any disk fails. In reality, parity is\
    \ a complex function of user data (Ax and By)\n\n| Ax || By || P = Ax⊕By ||  ||\
    \ Ax = By⊕P || By = Ax⊕P |\n\n| --- | --- | --- | --- | --- | --- |\n\n| 0 ||\
    \ 0 || 0 || 0 || 0 |\n\n| 0 || 1 || 1 || 0 || 1 |\n\n| 1 || 0 || 1 || 1 || 0 |\n\
    \n| 1 || 1 || 0 || 1 || 1 |\n\nTable 3.2: Recovering data on failed disk from\
    \ parity\n\nRebuild process\n\nWhen a failed drive is replaced with a new one,\
    \ data of the failed drive get generated from existing data and parity and then\
    \ written to the new drive.\n\n![A table showing values for D1, D2, and P, with\
    \ arrows mapping D1 values (0, 0, 1, 1) to New Disk (D2, P) values: (0,0), (1,1),\
    \ (0,1), (1,0). D1 = D2 XOR P.](images/Fig_3.20a.jpg)\n\nTable 3.3: Rebuilding\
    \ data on to a new disk\n\nRAID level comparisons\n\n| RAID 2 || RAID 3 || RAID\
    \ 4 || RAID 5 |\n\n| --- | --- | --- | --- |\n\n| Bit level striping with ECC\
    \ parity || Byte level striping with dedicated parity || Block level striping\
    \ with dedicated parity || Block level striping with distributed parity |\n\n\
    | All disks write and read as one. This lowers the tolerance for non-identical\
    \ drives || Disks write and read independent of on another |\n\n| Good performance\
    \ for large amounts of data or the applications that process large blocks of data\
    \ || Applications that manipulate small amounts of data, such as transaction processing\
    \ applications and fewer writes than reads |\n\n| Not used || Widely used || Rarely\
    \ used || Widely used |\n\nTable 3.4: Raid 2 vs. 3 vs. 4 vs. 5\n\nRAID levels\
    \ 4 and 5\n\nSingle parity drive in RAID 4 is involved in every write, thus limits\
    \ parallelism, whereas RAID 5 distributes the parity blocks among all the N+1\
    \ drives and enables parallelism.\n\n![Figure 3.21: RAID level 4 vs. RAID level\
    \ 5](images/Fig_3.21.png)\n\nFigure 3.21: RAID level 4 vs. RAID level 5\n\nWhy\
    \ RAID 3 provides better large block sequential read/write performance than RAID\
    \ 4 and 5?\n\n•  Each block of data is spread across all the drives in the array.\
    \ All disks serve requests together, but only one host I/O request at a time.\
    \ Hence sequential request and large block perform better on RAID 3. RAID 3 cannot\
    \ service multiple requests simultaneously.\n\n•  In case of RAID 4 and 5, different\
    \ block of data resides on different drives, hence simultaneously random requests\
    \ performs better on them.\n\n•  For an example, a read request for block A consisting\
    \ of some bytes (A0, A1) would require all data disks to seek to the beginning\
    \ first byte and reply with their contents. A simultaneous request for block B\
    \ would have to wait.\n\n•  In case of RAID 4 and 5, a read request for block\
    \ A would be serviced by first disk. A simultaneous read request for block C would\
    \ have to wait, but a read request for B could be serviced concurrently by second\
    \ disk.\n\n![Figure 3.22: RAID Level 3 vs. RAID Level 4](images/Fig_3.22.jpg)\n\
    \nFigure 3.22: RAID Level 3 vs. RAID Level 4\n\n•  If the size of a stripe is\
    \ reduced below the OS block size a RAID 5 array then has the same performance\
    \ pattern as a RAID 3.\n\nWhy does one disk become bottleneck in Raid 4, but not\
    \ in Raid 3?\n\n•  Referring to the [Figure 3.22](#ch03.xhtml#fig3-22), in addition\
    \ to the simultaneous writes of block (A and B) to their respective drives, both\
    \ need also to be written to the parity drive. In this way RAID places a very\
    \ high load on the parity drive in an array.\n\n•  In case of RAID 3, all drives\
    \ synchronously–all serve same requests.\n\n#### RAID 6–bock level striping with\
    \ dual parity\n\n•  Two independent parity computations are used in order to provide\
    \ protection against double disk failure. Two different algorithms are employed\
    \ to achieve this purpose.\n\n•  Essentially an extension of RAID level 5.\n\n\
    •  RAID level 6 requires a minimum of 4 drives to implement.\n\n![Figure 3.23:\
    \ RAID level 6: Block level striping with dual parity](images/Fig_3.23.jpg)\n\n\
    Figure 3.23: RAID level 6: Block level striping with dual parity\n\nDisadvantages:\n\
    \n•  More complex controller and its firmware design\n\n•  Slow write performance\
    \ because of controller overhead to compute parities\n\n•  Requires N+2 drives\
    \ to implement because of dual parity scheme\n\n#### Hardware versus software\
    \ RAID\n\n•  Software RAID:\n\n o A software solution implements the RAID\n\n\
    \ o Software RAID: run on the server’s CPU\n\n o Directly dependent on server\
    \ CPU performance and load\n\n o Occupies host system memory and CPU operation,\
    \ degrading server performance\n\n•  Hardware RAID:\n\n o A piece of hardware\
    \ or hardware controller.\n\n o Hardware RAID: run on the RAID controller’s CPU.\n\
    \n o It does not occupy any host system memory, alsoIt is not operating system\
    \ dependent.\n\n o Host CPU can execute applications while the array adapter’s\
    \ processor simultaneously executes array functions: True hardware multi-tasking.\n\
    \n#### Hybrid RAID levels–RAID X+Y\n\nHybrid RAID levels are implemented by combining\
    \ virtual volumes which already formed from physical drives. Following example\
    \ shows, RAID X is formed from physical drives, now again one more time virtual\
    \ volume is formed using RAID Y of those virtual volumes.\n\n![Figure 3.24: Hybrid\
    \ RAID](images/Fig_3.24.jpg)\n\nFigure 3.24: Hybrid RAID\n\nSome examples:\n\n\
    If X=5, Y=0, If you copy 30MB Data to D1, D2, D4, D5, D7, D8 will get 5MB each\
    \ and D3, D6, D9 will have the parities.\n\nIf X=1, Y=0, If you copy 30MB Data\
    \ to, each drive will get 10MB RAID 0+1,RAID 01,RAID 0&1 (Mirror of stripes)\n\
    \n![Figure 3.25: RAID 0+1: Mirror of stripes](images/Fig_3.25.png)"
