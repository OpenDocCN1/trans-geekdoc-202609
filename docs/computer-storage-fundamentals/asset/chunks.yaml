    ```\n\n或者，也可以从管理软件、`HBA` 厂商提供的实用工具或 `FC` 交换机中收集 `FC HBA` 的 `WWPN`。\n\n请参考存储系统产品文档，了解在存储系统中创建主机条目的步骤。\n\
    \n在存储系统中使用 `IQN` 名称和操作系统详细信息为 `iSCSI` 创建一个主机条目。同样，使用 `WWPN` 和操作系统详细信息创建另一个主机条目。\n\
    \n## 案例研究 3：从 NFS 客户端配置并访问 NFS 共享\n\n让我们配置并从 NFS 客户端访问 NFS 共享：\n\n### 需求\n\n`VMware\
    \ vSphere ESXi` 主机连接到一个同时具备块和文件能力的存储系统。网络和 `SAN` 分区已配置完成。请提供在主机服务器中创建和配置 `NFS`\
    \ 数据存储的步骤。\n\n### 分析\n\n遵循以下步骤为 `NFS` 文件存储配置存储空间：\n\n**步骤 1：** 在存储系统中创建 `NFS`\
    \ 共享。请参考产品文档了解创建共享的确切步骤。\n\n**步骤 2：** 为所需用户分配共享权限。\n\n**步骤 3：** 挂载 `NFS` 共享。\n\
    \n为 `VMware vSphere ESXi` 主机配置块存储空间的过程与其他主机类型相同。\n\n**在存储系统中：**\n\n**步骤 1：** 创建主机条目。\n\
    \n**步骤 2：** 创建虚拟卷并呈现给主机。\n\n**在主机服务器中：**\n\n**步骤 3：** 扫描并列出新磁盘。\n\n**步骤 4：** 创建\
    \ `VMFS` 文件系统。\n\n**步骤 5：** 挂载文件系统。\n\n### 解决方案\n\n#### NFS 共享配置\n\n**步骤 1：创建\
    \ NFS 共享**\n\n请参考存储系统产品文档，了解创建存储卷并呈现给主机条目的步骤。\n\n**步骤 2：挂载 NFS 共享**\n\n虽然有多种方法可用于在\
    \ `vSphere ESXi` 主机中配置存储空间，但此处仅参考 `Center Web Client` 来配置共享和磁盘。\n\n打开 `Center\
    \ Web Client` 或 `ESXi` 主机 `vSphere Client`。右键单击 `ESXi` 主机，转到 `存储` 菜单，然后选择 `新建数据存储`。选择\
    \ `NFS` 选项并提供 `NFS` 服务器详细信息和共享名称以进行挂载。\n\n![图 9.4：NFS 数据存储](img/Fig_9.3e.jpg)\n\
    \n*图 9.4：NFS 数据存储*\n\n#### 通过 FC 进行块存储配置\n\n对于块存储配置，第一步是在存储系统中创建主机条目，创建存储卷并将其呈现给主机。\n\
    \n要收集 `FC HBA` 的 `WWPN`。选择 `ESXi` 主机，转到 `存储` 选项卡，然后选择 `存储适配器`。\n\n![图 9.5：FC HBA\
    \ 的 WWPN](img/Fig_9.3f.jpg)\n\n*图 9.5：FC HBA 的 WWPN*\n\n**在主机服务器中：**\n\n**步骤 3：扫描并列出新磁盘**\n\
    \n右键单击 `ESXi` 主机，转到 `存储` 菜单，然后选择 `重新扫描存储`。等待重新扫描任务完成。\n\n**步骤 4：创建 VMFS 文件系统**\n\
    \n右键单击 `ESXi` 主机，转到 `存储` 菜单，然后选择 `新建数据存储`。选择 `NFS` 选项并提供 `NFS` 服务器详细信息和共享名称以进行挂载。\n\
    \n![图 9.6：文件系统创建](img/Fig_9.3g.png)\n\n*图 9.6：文件系统创建*\n\n**步骤 5：挂载文件系统**\n\n转到\
    \ `相关对象`，然后选择 `数据存储` 以检查新创建的数据存储。\n\n![图 9.7：数据存储](img/Fig_9.3h.jpg)\n\n*图 9.7：数据存储*\n\
    \n现在，可以将 `VM` 部署到这个新的数据存储上。\n\n## 学习检查\n\n### 客观题\n\n1.  存储管理软件主要用于：\n    a. 管理存储，如对象的创建、修改和删除\n\
    \    b. 监控存储系统的性能\n    c. 将主机 I/O 负载施加到存储系统上\n    d. 监控存储物理硬件组件和逻辑对象的健康状况\n\n\
    2.  如果运行存储管理应用程序的系统损坏，以下哪项陈述是正确的：\n    a. 主机应用程序无法对存储系统进行读/写操作\n    b. 无法向服务器进一步配置存储空间\n\
    \    c. 到其他存储的远程复制将停止\n    d. 现有 `LUN` 的计划备份操作无法继续\n\n3.  以下哪个组件是 `IP` 存储解决方案的配置管理要素？\n\
    \    a. `HBA`\n    b. `VSAN`\n    c. `ISL`\n    d. `VLAN`\n\n4.  将服务器配置为从 `SAN`\
    \ 中的阵列启动涉及：\n    a. 将启动 `LUN` 呈现给服务器的 `HBA` 端口，并正确配置 `OS` 驱动程序以识别 `LUN`。\n   \
    \ b. 将启动 `LUN` 呈现给服务器的 `HBA` 端口，并配置 `HBA` 卡 `BIOS` 以从 `LUN` 启动。\n    c. 将启动 `LUN`\
    \ 呈现给服务器的 `HBA` 端口，并仅修改服务器 `BIOS` 上的 `BIOS` 设置。\n    d. 以上都不是\n\n5.  为服务器配置存储的管理任务序列：\n\
    \    a. 创建虚拟卷 \\| 将虚拟卷的访问权限分配给主机 \\| 创建主机 \\| 在主机端发现 `LUN`\n    b. 创建主机 \\| 创建虚拟卷\
    \ \\| 将虚拟卷的访问权限分配给主机 \\| 在主机端发现 `LUN`\n    c. 将虚拟卷的访问权限分配给主机 \\| 创建主机 \\| 创建虚拟卷\
    \ \\| 在主机端发现 `LUN`\n    d. 在主机端发现 `LUN` \\| 创建主机 \\| 创建虚拟卷 \\| 将虚拟卷的访问权限分配给主机\n\
    \n6.  `SCSI` 在存储网络中的主要限制是什么（选择两项）？\n    a. 实现复杂性\n    b. 部署距离\n    c. 可互连的设备数量\n\
    \    d. 复杂的故障隔离\n\n7.  匹配下列项目：\n\n    | 项目 | 描述 |\n    | :--- | :--- |\n    |\
    \ i. 卷 | 1. `LUN` |\n    | ii. 主机 | 2. 一台主机服务器 |\n    | iii. 卷集 | 3. 主机集群 |\n\
    \    | iv. 主机集 | 4. 一个应用程序 |\n\n    a. (i) - (1), (iii) - (2), (ii) - (4) 和 (iv)\
    \ - (3)\n    b. (i) - (1), (ii) - (2), (iii) - (3) 和 (iv) - (4)\n    c. (ii) -\
    \ (2), (i) - (1), (iii) - (4) 和 (iv) - (3)\n    d. (iv) - (1), (iii) - (2), (i)\
    \ - (4) 和 (ii) - (3)\n\n### 简答题\n\n1.  描述常用的存储管理应用程序及其用途。\n2.  描述为 `FC` 主机配置存储空间所遵循的步骤。\n\
    3.  描述为 `iSCSI` 主机配置存储空间所遵循的步骤。\n\n### 测验题\n\n1.  如果管理应用程序崩溃，应用服务器会失去对数据的访问吗？\n\
    2.  在存储中创建 `iSCSI` 主机条目需要哪些强制性详细信息？\n3.  哪种方法需要用户访问凭证，`NFS` 共享还是 `SAN` 存储卷？\n\n\
    ## 术语表和关键术语\n\n*   **存储系统管理软件**：用于配置和监控存储系统的软件。\n*   **性能监控工具**：监控并收集读/写操作的性能数据。\n\
    *   **快照管理软件**：创建、删除和维护存储快照。\n*   **复制管理软件**：管理本地或远程复制解决方案的软件。\n*   **数据保护和恢复软件**：配置和调度备份作业以将数据保护到备份系统的软件。\n\
    *   **交换机管理软件**：允许在存储区域网络中配置和监控交换机的软件。\n"
