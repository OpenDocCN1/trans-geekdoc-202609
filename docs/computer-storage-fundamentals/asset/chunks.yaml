    \ by simultaneous write operations on a virtual volume.\n\nSome operating systems\
    \ identify storage device based on their LUN ID; after cluster failover, application\
    \ to refer correct storage volume, device naming must be consistent across all\
    \ cluster members. Therefore for cluster solution, each volume must be presented\
    \ to all cluster members with same LUN ID.\n\n## Multipath\n\nMultipath technique\
    \ is implemented in host server to utilize the multiple paths of a redundant network\
    \ to provide high availability and bandwidth between host server and storage devices.\n\
