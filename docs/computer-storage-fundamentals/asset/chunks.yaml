    \n![QR-Logo](images/fm1.png)\n\n# CHAPTER 4Storage Communication Protocols\n\n\
    ## Introduction\n\nHost systems communicate with storage systems using a standard\
    \ communication protocol. Small Computer System Interface (SCSI) protocol is widely\
    \ used by operating systems for input/output (I/O) operations to disk drives.\
    \ Though, Fibre Channel (FC), internet SCSI (iSCSI) and FC over Ethernet (FCoE)\
    \ protocols are designed for storage networks, operating systems still use SCSI\
    \ protocol to communicate with the disk drives over these storage network protocols.\n\
    \nFile level NAS storage is usually accessible using common file level protocols\
    \ such as SMB/CIFS and NFS.\n\n## Structure\n\nUpon successful completion of this\
    \ chapter, you will be able to learn following key areas of storage communication\
    \ protocols:\n\n•  SCSI protocols\n\n•  Fabre Channel basics\n\n•  iSCSI concept\n\
    \n•  FCoE overview\n\n•  File access protocols\n\n## Objectives\n\nA protocol\
    \ is a set of rules and guidelines for communicating data between host servers\
    \ and storage systems. In this chapter, you will learn about various standard\
    \ storage protocols, such as SCSI, FC, iSCSI and FCoE, NFS, and CIFS/SMB. This\
    \ includes how data gets transferred between host server and storage system during\
    \ read and write operation using each protocol.\n\n## SCSI protocol\n\nSCSI, is\
    \ a set of American National Standards Institute (ANSI) standard electronic interfaces\
    \ that allow host servers to communicate with storage device.\n\nT10 (https://www.t10.org/[)](http://www.t10.org/)\
    \ is responsible for SCSI architecture and SCSI command set standards. These standards\
    \ are used by almost all the modern I/O interfaces.\n\nIn SCSI communication,\
    \ host server is always initiator and storage is target. Any single request is\
    \ initiated by host server. Storage being target always responds to initiator’s\
    \ request.\n\n•  Initiator: An initiator issues requests for service by the SCSI\
    \ device and receives responses. Initiators come in a variety of forms and may\
    \ be integrated into a server’s system board or exist within a host bus adapter\
    \ (HBA).\n\n•  Target: SCSI target is typically a storage device. The target can\
    \ be a hard disk or an entire storage array.\n\n### SCSI command descriptor block\n\
    \nThe SCSI command descriptor block (CDB) is a block of information that describes\
    \ the SCSI command. Commands are sent from SCSI initiators to SCSI targets, which\
    \ are controllers of some type of storage device (hard disk, tape drive, and so\
    \ on). Almost every CDB contains three parts:\n\n1. What field\n\n2\\. Where field\
    \ and\n\n3\\. How Much field\n\nFor some commands, these fields are implied or\
    \ not required.\n\nThe What field is called the operation code (opcode) and tells\
    \ the target what the command is supposed to do. A couple of examples would be\
    \ READ or WRITE. The READ command moves data from the storage device to the host\
    \ system, while the WRITE command moves data to the storage device for later access.\n\
    \nThe Where field tells the target where to begin the operation and is expressed\
    \ as a Logical Block Address (LBA). This address ranges from zero (0) to the maximum\
    \ address of the device. Some commands, such as INQUIRY, do not require this field.\n\
    \nThe How Much field tells the target, how many blocks (or bytes) or data to move.\
    \ The block size of most storage devices is 512 bytes, but in certain storage\
    \ devices, the block size can be different. This field is expressed as either\
    \ transfer length (in blocks), allocation length (bytes moving to the host), or\
    \ parameter list length (bytes moving to the device). Which name is used, depends\
    \ on the command itself?\n\n### SCSI addressing\n\nIn SCSI bus each device is\
    \ identified with a unique address such as Bus, Target and LUN (B.T.L). Following\
    \ is an example simple DAS:\n\n![Figure 4.1: SCSI address in a DAS](images/Fig_4.1.png)\n\
    \nFigure 4.1: SCSI address in a DAS\n\nIf only filled highlighted slots have disks\
    \ drive installed:\n\n\\> show device list (Equivalent command)\n\n| Device ||\
    \ Name || Bus || Target || LUN |\n\n| --- | --- | --- | --- | --- |\n\n| Disk1\
    \ ||  || 1 || 03 || 0 |\n\n| Disk2 ||  || 1 || 04 || 0 |\n\n| Disk3 ||  || 1 ||\
    \ 05 || 0 |\n\n•  Bus value is assigned by the operating system based on PCI slot\
    \ order of the server\n\n•  SCSI ID 6 and 7 are reserved for SCSI adapter. Typically\
    \ SCSI adapter has default SCSI ID 7 assigned.\n\nIn case of SAN environment,\
    \ bus value is assigned based on PCI slot, in which HBA is installed. Target values\
    \ are based on controller port and LUN ID are the values assigned during presentation\
    \ or export of the storage volume using management software.\n\nSome SCSI adapter\
    \ or HBA have more than one port, called channel. To support this, some operating\
    \ system or SCSI driver use four parameters for SCSI addressing Host:Channel:Target:LUN\
    \ (H:C:T:L). In this case, bus is referred as channel.\n\nChannel value is zero,\
    \ if its not applicable. In that case, the host number becomes the bus.\n\nThere\
    \ are three primary phases of an SCSI operation:\n\n•  Command: Initiator sends\
    \ commands and parameters via CDB.\n\n•   Exchange data: Transfer data. Mainly\
    \ used during read or write operations. There are some SCSI commands, such as\
    \ Test Unit Ready (TUR), do not use data stage.\n\n•  Status: Receive confirmation\
    \ of the command executed.\n\n### SCSI protocol write request example"
