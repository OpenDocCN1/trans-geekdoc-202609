  trans: "\n\n## 重删和压缩比\n\n重删的有效性用重删比来表示，即主机服务器发送的数据量与存储中存储的数据量之比。例如，如果 `40 GB` 数据经过重删后仅需\
    \ `2 GB` 磁盘空间存储，则比率变为 `40:2 = 20:1`。`20:1` 的比率意味着存储的主机服务器数据量是实际所需存储空间的 20 倍。\n\
    \n某些供应商以倍数或百分比表示这种空间缩减比。对于上述示例，`20:1` 可表示为 `20x` 或 `(1 - 1/20) x 100 = 95%`。\n\
    \n压缩比的计算方法与重删比相同。\n\n由于大多数供应商在重删后执行压缩，因此压缩比表示为重删后数据与压缩后数据的比率。在上述示例中，如果重删后的 `2\
    \ GB` 数据进一步压缩至 `1 GB`，压缩比变为 `2:1`。\n\n以下示例说明压缩的工作原理。在该地址表中有一些通用字符串；压缩算法识别这些通用字符串，并将它们连同唯一符号一起存储在字典表中，然后数据表由另一个包含字典符号的表来表示。\n\
    \n| 地址详情 |\n| --- |\n| 姓名 || 城市 || 省份 || 邮编 |\n| Ramesh Kumar || 班加罗尔 || 卡纳塔克邦\
    \ || 56037 |\n| Rakesh Kumar || 班加罗尔 || 卡纳塔克邦 || 56075 |\n\n表 8.1：压缩原理\n\n![图\
    \ 8.9：重删工作原理](img/Fig_8.9.jpg`)\n\n图 8.9：重删工作原理\n\n## 结论\n\n高效存储数据是在设计存储系统时的关键考量因素之一，因为这会影响成本。如果存储系统能在更少的磁盘空间上存储更多数据，则称其为优秀。\n\
    \n存储供应商实现了多种功能以增强其存储系统更高效存储数据的能力。其中最常用的功能是精简配置，即存储卷的块从空闲块池中分配，仅在主机服务器向存储卷写入数据时才分配。从而避免了空间块在未被使用时被占用。\n\
    \n空间回收是另一项功能，当主机服务器删除这些块上的数据时，已分配的块会被释放回空闲池。这有助于在空闲池中拥有更多可供其他用途使用的块。\n\n通过修改元数据结构，虚拟卷的大小可以增加或减小。增加大小的功能称为\
    \ `expand`，减小称为 `shrink`。这通常是为了满足虚拟卷对更多空间的需求，或通过缩减来让空闲池中有更多块供其他用途使用。\n\n重删和压缩是两种在更少空间存储更多数据的技术。顾名思义，重删会移除重复信息，并添加指针以供未来取消重删（还原）使用。取消重删过程称为\
    \ `rehydration`。另一方面，压缩使用技术以更少的位数表示相同数据。\n\n## 案例研究\n\n### 案例研究 1：写密集型应用的磁盘配置\n\
    \n让我们看看写密集型应用的磁盘配置：\n\n#### 需求\n\n管理员正在寻找为应用程序配置卷的解决方案。该应用程序的当前数据约为 `3 TB`。预计数据每年增长\
    \ `1 TB`。存储共有 `6` 块磁盘，每块 `1 TB`。考虑到未来 `5` 年的需求，可以提出什么解决方案？\n\n#### 分析\n\n如果使用\
    \ `(6 - 2 奇偶校验) x 1 TB` 磁盘配置 `RAID6`，可用容量约为 `4 TB`；对于 `RAID 5`，可用容量为 `(6 - 1 奇偶校验)\
    \ x 1 TB = 5 TB`。\n\n5 年后应用数据将增长至 `3 TB + 5 x 1 TB = 8TB`。\n\n管理员现在可以创建一个精简配置卷，随后随着空间需求增加再添加硬盘。\n\
    \n#### 解决方案\n\n![图 8.10：带有已分配和未分配空间的精简配置卷](img/Fig_8.9a.png`)\n\n图 8.10：带有已分配和未分配空间的精简配置卷\n\
    \n以下是推荐的卷类型和大小：\n\n- **类型**：精简配置\n- **RAID 级别**：5\n- **大小**：10TB\n\n预计明年总分配空间为\
    \ `3TB + 1TB = 4TB`。需要向存储中添加新物理磁盘，以避免第二年年底出现写入故障。\n\n### 案例研究 2：存储解决方案的有效空间利用\n\
    \n让我们看看存储解决方案的有效空间利用：\n\n#### 需求\n\n某组织更关注存储的成本方面，即存储数据的效率有多高。他们拥有的数据类型大约可以实现\
    \ `20%` 的重删和 `10%` 的压缩。他们共有 `15 TB` 数据，预计每年增长约 `5 TB`。他们未来 `3` 年应规划多少物理可用容量？\n\
    \n#### 分析\n\n重删和压缩可以在同一数据上独立工作。可将重删和压缩比应用于 `3` 年后的总数据，以计算所需的实际物理可用容量。\n\n####\
    \ 解决方案\n\n`3 年后数据 = 15 TB + 3 x 5 TB = 30 TB`\n\n假设重删比为 `D:1`；`(1- 1/D) x 100\
    \ = 20`；因此 `D:1 = 5:4`\n\n重删后 `14 TB` 数据可存储在 `(4/5) x 30 TB = 24 TB` 上\n\n假设压缩比为\
    \ `C:1`；`(1- 1/C) x 100 = 10`；因此 `C:1 = 10:9`\n\n压缩后 `12 TB` 数据可存储在 `(9/10) x\
    \ 24 TB = 21.6 TB` 上\n\n管理员需要为 `3` 年规划 `21.6 TB`\n\n### 案例研究 3：已删除空间的回收\n\n让我们看看已删除空间的回收：\n\
    \n#### 需求\n\n管理员从 Windows 主机的精简配置卷中删除了约 `7 TB` 数据。他们在存储系统中仍未看到预期的可用空间，以便为其他应用程序创建卷。可以提出什么解决方案？\n\
    \n#### 分析\n\n从主机服务器删除数据时，操作系统仅移除文件系统引用，并不会删除存储系统中的实际数据块。\n\n现代存储具有空间回收功能，它会取消分配这些块，以便其他卷使用。\n\
    \n#### 解决方案\n\n删除数据后，转到 `服务器管理器 | 工具 | 碎片整理和优化驱动器`。\n\n选择驱动器并点击“优化”。此操作向存储发送 `T10\
    \ SCSI UNMAP` 调用以取消分配空间。\n\n![图 8.11：优化驱动器](img/Fig_8.9b.jpg`)\n\n图 8.11：优化驱动器\n\
    \nPowerShell Cmdlet `Optimize-Volume` 也会向存储设备发送 `UNMAP` 调用。\n\n```\nPS C:\\> Optimize-Volume\
    \ -DriveLetter D -ReTrim\n```\n\n## 学习检查\n\n### 客观题\n\n1. 使用精简配置功能时，空间会在您执行以下操作时分配：\n\
    \   a. 创建虚拟卷\n   b. 向虚拟卷写入数据\n   c. 删除虚拟卷\n   d. 从虚拟卷删除数据\n\n2. 空间回收功能基于：\n  \
    \ a. `T10 SCSI XCOPY 规范`\n   b. `T10 SCSI UNMAP 规范`\n   c. `T10 SCSI WRITE SAME\
    \ 规范`\n   d. 以上都不是\n\n3. 存储的精简配置功能主要在以下方面带来收益：\n   a. 容错\n   b. 性能\n   c. 空间效率\n\
    \   d. 以上所有\n\n4. 存储的动态容量管理（LUN 缩减/扩展）功能主要在以下方面带来收益：\n   a. 容错\n   b. 性能\n   c.\
