    ## 评估问题


    **问题选项：**

    - b. 修改与虚拟卷相关的元数据表，以在物理磁盘上分配更少的块

    - c. 限制主机仅访问虚拟卷上更少的块

    - d. 减小每个块的大小


    ### 问题 8

    厚卷（非精简配置）卷上可用的空间回收（`UNMAP`）功能：

    - a. 是

    - b. 否


    ### 问题 9

    当 30 TB 数据存储在去重卷上时，仅使用了 24 TB 空间，求空间减少百分比：

    - a. 1.25%

    - b. 6%

    - c. 80%

    - d. 20%


    ### 简答题

    1. 描述三种增强存储系统空间效率的存储功能。

    2. 举例说明去重率和压缩率是如何计算的？

    3. 举例说明在哪些用例中需要扩容和缩容？


    ### 测验问题

    1. 存储卷能否同时配置去重和压缩？

    2. `T10 SCSI UNMAP` 命令在存储系统中释放空间。哪个设备发起该命令？何时发起？

    3. 管理员从同一个磁盘池创建了两个具有相同 RAID 级别的存储卷，但一个是厚卷，另一个是精简卷。对于写密集型应用程序，预期哪个卷性能更快，为什么？


    ## 术语表和关键术语

    - **精简配置**：一种虚拟卷类型，当主机服务器向这些块写入数据时才分配块。这有助于在存储系统中仅分配所需的空间。

    - **去重**：删除冗余数据以减少存储空间需求的去重技术。

    - **UNMAP**：`T10 SCSI UNMAP` 标准，一种空间回收功能，用于释放主机删除数据的块。

    - **去重块大小**：比较数据以检测重复的数据大小单位。

    - **去重率**：从主机服务器接收的数据量与去重后实际存储所需空间之间的比率。

    - **压缩率**：从主机服务器接收的数据量与压缩后实际存储所需空间之间的比率。

    - **重新水合**：将去重数据还原为非去重数据的过程。


