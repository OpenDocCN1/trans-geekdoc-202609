- raw: "•  VDI: VDI is an infrastructure deployment environment where users access\
    \ multiple VMs with different operating systems and configurations.\n\n•  HCI:\
    \ Consolidated and converged solution within a single system to host VMs for VDI\
    \ environment.\n\n•  Converged system: Converged system refers to a ready-made\
    \ assembled, pre-configured and tuned storage and host servers in single rack.\n\
    \n•  Data center: A facility with adequate space, power, and cooling to deploy\
    \ and install large storage and server solutions.\n\nJoin our Discord space\n\n\
    Join our Discord workspace for latest updates, offers, tech happenings around\
    \ the world, new releases, and sessions with the authors:\n\n**[https://discord.bpbonline.com](https://discord.bpbonline.com)**\n\
    \n![QR-Logo](images/fm1.png)\n\n# CHAPTER 2Storage Infrastructure\n\n## Introduction\n\
    \nWith advancement of storage virtualization, today’s infrastructure is more software-driven\
    \ than hardware-driven. However, both hardware and software components play an\
    \ important role in a storage solution. Software is not only used to manage the\
    \ hardware, but also every storage feature and functionalities are implemented\
    \ through software. Therefore, both are tightly integrated to each other to provide\
    \ desired solution. Firmware is a type of software, typically involved in basic\
    \ low-level operations to make hardware device functional. In a storage solution\
    \ almost all hardware components have firmware embedded into them.\n\n## Structure\n\
    \nUpon successful completion of this chapter, you will be able to learn the following\
    \ key areas of storage infrastructure:\n\n•  Storage, network and host layer\n\
    \n•  Physical layout and components of storage system\n\n•  Network hardware components\n\
    \n•  Host server\n\n•  Host bus adapter\n\n•  Software defined storage\n\n•  Securing\
    \ storage infrastructure\n\n•  Managing storage infrastructure\n\n## Objectives\n\
    \nIn this chapter, you will learn about different hardware devices and software\
    \ components that are deployed and configured in a data center to implement a\
    \ storage solution.\n\nThis chapter explains all physical components of a storage\
    \ system and their connectivity within it and also storage networking and host\
    \ server’s storage components.\n\nIn addition to it, this chapter also explains\
    \ storage software defined storage (SDS) concept.\n\n## Building a storage solution\n\
    \nA storage solution is implemented by connecting one or more host servers with\
    \ storage systems via a network. The network consists of either Fibre Channel\
    \ (FC) or Ethernet switches.\n\nBroadly the following five hardware and software\
    \ are used to build a storage solution:\n\n•  Storage system: Storage system is\
    \ a hardware device connected to computers through a network for storing data.\
    \ Storage disk array is an example of a storage system. Storage disk array has\
    \ a pool of disk drives to store large amount of data. Though a disk array is\
    \ often referred as storage system, backup and tape devices, are also called storage\
    \ system.\n\n![Figure 2.1: Storage System](images/Fig_2.0a.png)\n\nFigure 2.1:\
    \ Storage System\n\nBackup and tape devices are used to store a copy of the primary\
    \ data, computer memory and other in-computer storage is not called storage system.\n\
    \nIn a storage solution, storage systems are target devices.\n\n•  Host server:\
    \ Applications that run on these computer servers, perform read and write datastored\
    \ on to the storage systems. This is also called application server, host computer\
    \ or simply host.\n\nIn a storage solution, host servers are initiator devices.\n\
    \n![Figure 2.2: Host Server](images/Fig_2.0b.jpg)\n\nFigure 2.2: Host Server\n\
    \nIn some storage solutions, where host servers do not host any application, but\
    \ access the storage system directly, are called client systems. For example,\
    \ mobile phone accesses object storage systems, for read write operations. Here,\
    \ mobile is a client system.\n\n•  Switch: Host servers and storage systems are\
    \ connected to the switches to form the network. Network allows host servers to\
    \ communicate with storage systems. This network is not used to communicate one\
    \ host server with another.\n\n![Figure 2.3: Switch](images/Fig_2.0c.png)\n\n\
    Figure 2.3: Switch\n\n•  Host bus adapter (HBA): This is an adapter, installed\
    \ inside the host server to connect to the switch. [Chapter 5](#ch05.xhtml), Storage\
    \ Networking to Share Storage discusses about this component in detail. The term\
    \ HBA is primarily used for FC environment. In case of NAS solution, Network Interface\
    \ Card (NIC) of host server itself can be used as HBA.\n\n![Figure 2.4: Host Bus\
    \ Adapter(HBA)](images/Fig_2.0d.jpg)\n\nFigure 2.4: Host Bus Adapter(HBA)\n\n\
    •  Management software applications: A suite of software products are required\
    \ to manage and monitor the storage solution. A storage solution is incomplete\
    \ without this set of software products. Using management software storage administrator\
    \ creates storage volume and provides access to host servers. The application\
    \ is then configured to store its data on to the volume.\n\n![Figure 2.5: Management\
    \ software](images/Fig_2.0e.png)\n\nFigure 2.5: Management software\n\n## Hardware\
    \ and software component stack\n\nFor better understanding of each component of\
    \ storage solution in detail, let us divide the solution into three different\
    \ layers–storage layer, network layer and host layer. The following table lists\
    \ hardware, firmware, and software components for each layer:\n\n| ![](images/Fig_2.1.png)\
    \ || Hardware || Firmware and software |\n\n| --- | --- | --- |\n\n| Host serverHBASmall\
    \ Form Factor Pluggable (SFP) || HBA firmware and driverAdapter management softwareMultipath\
    \ driverStorage utilities |\n\n| FC switch or LANSwitchSFPCables and connectors\
    \ || Switch firmwareSwitch management software |\n\n| Disk array controllersPhysical\
    \ disk drivesDisk enclosureBackend switch and connectors || Disk array controller\
    \ firmwareDisk firmwareStorage system managementsoftwarePerformance tuning andmonitoring\
    \ softwareSnapshot managementsoftwareReplication management softwareData protection\
    \ and recovery software |\n\nTable 2.1: Storage hardware and software component\
    \ stack\n\nThere are four major types of vendor involved in a storage solution–storage\
    \ vendor, switch vendor, server vendor and HBA vendor. Firmware and software are\
    \ developed by respective hardware vendor only.\n\n## Physical layout of a storage\
    \ disk array\n\nTypically any storage disk array has the following six hardware\
    \ components:\n\n•  Rack\n\n•  Backend\n\n•  Switches\n\n•  Controllers\n\n• \
    \ Drive enclosures\n\n•  Disk drives\n\n![Figure 2.6: Storage system hardware\
    \ components](images/Fig_2.2.jpg)\n\nFigure 2.6: Storage system hardware components\n\
    \n### Storage controllers\n\nThe primary hardware component that processes I/O\
    \ request from host server and does the read and write operations on to the backend\
    \ physical disk drives. Different vendors call this component different names–node,storage\
    \ processor, and so on.\n\nController itself is a computer and has:\n\n•  CPU\n\
    \n•  Memory\n\n•  Cache memory for faster storing of user data.\n\n•  Application-specific\
    \ integrated circuit (ASIC).\n\n•  Customized operating system, also known as\
    \ firmware.\n\n•  Interfaces or ports–typically, a controller has:\n\n o Frontend\
    \ or host ports–for connecting to network or FC switches.\n\n o Backend or device\
    \ ports–for connecting to drive enclosures.\n\n o Mirror or heart beat ports–interconnecting\
    \ all controllers together.\n\nSome vendors make the controller with designated\
    \ ports, while others allow the user to configure port-based on requirement. The\
    \ number of port in any controller depends on vendor product design and its model.\n\
    \nMost vendor’s storage has two or more controllers in a storage system to have\
    \ better fault tolerance and performance through load balance.\n\n![Figure 2.7:\
    \ Storage controller components](images/Fig_2.3.png)\n\nFigure 2.7: Storage controller\
    \ components\n\nIn the preceding figure, HP is host port, and DP is device port.\n\
    \nDifferent storage vendor uses different name for these ports.\n\n### Physical\
    \ disk drives"
