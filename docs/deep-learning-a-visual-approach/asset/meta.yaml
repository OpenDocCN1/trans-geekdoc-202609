- - '###'
  - Bayes’ Rule
- - '##'
  - 用文字表达，我们想要找出 P(F|H)，即在我们刚刚抛掷硬币并看到正面后，拥有公平硬币的概率。为了确定这一点，我们结合了三个信息。首先，P(H|F)，即在我们确实拥有公平硬币的情况下出现正面的概率。我们将其与
    P(F)，即我们确实拥有公平硬币的概率相乘。正如我们所见，这种乘法只是更便捷地评估 P(H,F)，即我们的硬币是公平的 *并且* 它出现了正面。最后，我们除以
    P(H)，即我们的硬币出现正面的概率，*同时考虑到公平和作弊硬币*。这就是我们使用 *任一* 这些硬币来得到正面的可能性有多大。
