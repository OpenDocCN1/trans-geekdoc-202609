- - '#'
  - 当我们开始一个 move 时，如 Figure 21-29(a) 所示，我们会查看当前状态的 Q-table 行，并使用我们的 policy 来选择一个 action，这里以红色显示。该
    action 会被传递给环境。环境会返回一个 reward 以及一个新的 state。如在 Figure 21-29(b) 所示，我们会在 Q-table
    中找到对应新 state 的行，并选择其中最大的 reward（这假设我们在到达新 state 时会选择最大的 action，但我们已经知道这并不总是成立。我们稍后会回到这个问题）。我们通过将该
    reward 乘以 *γ* 来折扣，然后将其与本 move 的即时 reward 相加，得到我们最初选择的 action 的新值。我们使用 *α* 来混合旧值和新值，新值随后被放入原始
    action 在 Q-table 中的单元格。
