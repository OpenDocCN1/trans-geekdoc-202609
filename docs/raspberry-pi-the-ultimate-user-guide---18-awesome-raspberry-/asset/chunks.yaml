  trans: '

    例如，UAE4II 为你提供了极其奇妙复古的 Commodore 家族游戏，你可以前往 RetroArch 寻找各种旧的 Neo Geo、Intellivision、天堂和原版
    PlayStation 1 游戏。


    由于这可能是你第一次使用模拟器，你会发现每个模拟器都有各种设置，需要反复调整，直到你找到游戏运行的合适时机。


    你可能会遇到某些卡顿情况，屏幕会突然冻结，可能让你完全错过你的操作，你只需要调整帧刷新率，或者可能需要断开并重新连接服务器来提升游戏体验。


    如果游戏表现似乎跟不上你从模拟器复古游戏中所听到的所有赞誉，请不要简单放弃。这种热潮是有原因的，它是玩旧游戏的一种极佳方式。继续调整，直到你找到适合自己的设置。


    目前并没有一种标准方案可以在所有设备和服务器的每个人的游戏体验上运行。有些人会制定出各种公式，旨在帮助你计算出配置所需的确切数字。


    与其在数学问题上浪费时间，不如开始尝试不同的数字直到它正常工作。你不会损坏设备或导致服务器崩溃的。


    把它想象成调整电视机上的老式天线。如果你不知道那个俗语的意思，你可能想问问你的父母。


    如果视频游戏不是你的心口，但你仍然想探索一下通过简单编程和像树莓派这样的优秀芯片可以带来的乐趣，可以看看一些很厉害的程序员已经如何通过设置 MIDI 与他们的圣诞灯配合工作。


    在安排 MIDI 播放器与树莓派连接方面，设置非常简单。编程部分对应于用特定的音符控制每一串灯。


    你基本上是将其设置为开关的开启或关闭，你的音符是“开启”或“关闭”。这是非常基础的编程，但在灯光布置方式以及你程序设备响应的音符数量方面，提供了实现高度精细化的大量机会。


    # 第 4 章——关于你的 Pi 的实用技巧


    在你的树莓派的创作之旅中，你将会需要了解这些实用技巧，它们会让你的设备工作变得更加轻而易举。


    如果你非常熟悉 Linux 以及不同的编码和脚本，那么你可能不需要这么多这些技巧，但反过来说，如果你已经精通代码和脚本，你可能根本不会读这些内容。


    当你编写脚本时，实际上有一个命令的功能类似于搜索栏和手机短信服务中的自动填充功能。


    只不过，这一个专门为编码设计的。这难道不棒吗？当你输入提示符时，只需输入前几个字母并按下 tab 键即可。


    如果 shell 能准确识别出你的目标是什么，它就会直接提供给你，但更好的是，它还会给你列出你可能想要的所有其他提示符。


    无论你的代码编写水平如何，这绝对很棒。需要记忆的越少越好。


    你也可以通过简单按下 `ctrl+E` 跳到命令末尾，或按下 `ctrl+A` 跳到命令开头来在你的命令间跳转。


    这就像按下 `ctrl+home` 或 `ctrl+end` 跳到单词文档的开头或结尾一样。


    如果你到目前为止从未接触过代码，那些长串的代码可能会比黑色星期五的结账队伍还要长。


    在你构建你的工作时，你可能想像在 PC 或 Mac 上那样截屏。


    区别在于你需要进行一点“scrotting”（你懂的，运行 `sudo apt-get install scot` 命令），以便将屏幕的数字内容转换为 `PNG`，然后你就可以在任何你想去的地方打开它了。


    如果你还没有遇到过，你在编码时会弹出一个提示符，说你必须是“超级用户”才能执行它。这个糟糕的命令至少听起来是令人沮丧的。你就是“超级用户”！


    幸运的是，有一个很的小技巧可以在这种情况发生时随时让你从困境中解脱。你只需要输入 `sudo !!`，然后 Pi 就会轻松地继续执行你的提示符，就像它是 root
    一样。如果你听到有人提到这个命令，他们称其为“sudo bang bang”。


    # 第 5 章——行业窍门


    每种设备总有一些技巧可以帮助你充分利用它的价值，你很确定，一个为黑客、设计师和程序员设计的设备会有相当数量的技巧。


    有趣的地方在于，树莓派几乎拥有一种第六感，能察觉到人们将把它的潜力推向标准设备的极限。


    你可以做的第一件事之一就是对你的 Pi 进行完全超频。它实际上就是为此而设计的。嗯，不一定是“设计”来这样做，但你可以在不实际导致保修失效的情况下。尝试给你的
    PC 超频，你就可以和保修彻底拜拜了。


    当你离开 Pi 并且需要访问它时，你可以做的另一个技巧就是简单的获取你的 `IP address`（记得你之前写下它吗？）然后使用该信息进行连接。


    如果你使用的是 Windows，你应该使用 `PuTTY`，在任何其他系统上，只需使用 `ssh pi@\[your IP]`。下一秒你就发现自己已经运行起来，并能够从任何你需要的地方连接到你的设备。


    最近 Windows（抱歉 Linux 粉丝们）开放了使用 Windows 10 作为操作系统的能力，将你的 Pi 与不同的软件应用程序配对。


    这为你使用各种通用应用程序使用你的设备开启了全新的全新的可能性。


    即使你像躲避瘟疫一样避开 Windows，现在可能是时候穿上防化服，做好准备，将你的创意和实用功能推向全新的视线了。现在你可以使用 `Visual Studio`
    了。是的，你现在可以直接从 PC 构建自己的应用并使用其他应用。


    另一个也能帮助你树莓派事业的简单技巧并不是什么超级巨大的或完全隐藏的东西，事实上，它是完全的常识（这是我们大多数人偶尔会缺乏的东西）。


    你现在可能已经意识到，`SD card` 是你存储所有编程以及你实际运行树莓派目的的家园。


    你可以想象，随着时间的推移，你会建立起相当大量的 `SD cards` 目录。与其不断地将它们插入阅读器来弄里面有什么，这里有一个技巧：给它们贴标签。


    说认真的，这并不是暗示你不条理，或者你不知道如何标记物品，但这种情况会发生在我们最优秀的人身上，贴标签的这点额外时间将在最后避免很多挫败感，特别是当你有 20
    张存储卡要翻阅时。


    如果你想在组织方面再节省一个额外步骤，与其根据实际内容给卡贴标签，不如用字母数字的方式给它们标记。


    然后你可以创建一个独立的文档，或者拿一些旧式的笔和纸列出每张卡中包含的所有协调软件和脚本。


    这样一来，如果你以后清空卡并重新构建，你只需要更改数据库，而无需担心重新贴标签。

