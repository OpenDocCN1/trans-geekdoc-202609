- fmt: "\nHere are some ideas to get your juices flowing and hopefully set you on\
    \ the course to building something truly unique with your own design in mind.\
    \ Who knows you could be on to the coolest invention since the toaster.\n\n###\
    \ Building Unique Hardware\nYou can build your own jukebox. One up this by setting\
    \ up your music to stream from an online streaming service. Build your box with\
    \ an `AirPlay` receiver and suddenly you can broadcast it around on an FM channel.\
    \ Who needs Sirius now?\n\nJust because it’s small doesn’t mean it’s limited.\
    \ Many programmers are using the `Raspberry Pi` to set up their very own fully\
    \ functioning computer. This sort of project is definitely not for the impatient\
    \ or person with shallow pockets. \n\nIt can require a lot of processor which\
    \ is going to cost some money, but if you want to have full control over everything\
    \ in your computer, why not take the bull by the horns and build your own from\
    \ the ground up?\n\n### Personal Servers and Cloud\nSpeaking of building from\
    \ the ground up, why not go ahead and construct your own personal web server.\
    \ Now you can take it anywhere you go. It’s an in-depth complicated process but\
    \ if you are serious about your own security and ability to retain your access\
    \ wherever you go, this sort of project is going to be right up your alley.\n\n\
    Cloud service is everywhere now. Unfortunately, you give up a lot of control by\
    \ using hosted services, as well as a certain monthly fee if you want any sort\
    \ of serious professional level of storage. Why not go ahead and build your own\
    \ personal cloud storage? You have to invest in buying the actual storage, but\
    \ at least it’s a one-time purchase and the actual storage is yours to own, forever.\n\
    \nBuild your own home arcade studio. Build your own powered and framed digital\
    \ wall art gallery. Build your own digital musical equipment.\n\n### Hacking and\
    \ Ethics\nYou can do just about anything, and one of those things happens to be\
    \ hacking. We haven’t covered hacking for a couple of different reasons. One is\
    \ that even though the `Raspberry Pi` chip is great at hacking software, that\
    \ sort of knowledge in the wrong hands can truly be used for destructive and self-serving\
    \ ends.\n\nIf we knew everyone would use it for the greater good of all of humanity\
    \ it would be great. Hacking can definitely be used for good though, and many\
    \ hackers have found `Raspberry Pi` perfect for its extreme portability. You can\
    \ essentially set up so that you have an encased computer with a touch screen\
    \ display the size of the palm of your hand that can access a computer anywhere\
    \ you go.\n\nPerfect for helping people on the go, also perfect for getting into\
    \ places where you truly don’t belong. If you are going to use your `Raspberry\
    \ Pi` for snooping around don’t be surprised at what sort of trouble you can get\
    \ into. Both personally and legally.\n\n# Conclusion\nLearning some coding isn’t\
    \ going to hurt you, but there are tons of people out there that have already\
    \ done all the coding and embedded it into links available for free.\n\nThe `Raspberry\
    \ Pi` community is great for helping each other out when in programming need.\
    \ This could all be due to the fact that there is something amazing and inherent\
    \ to the process of going against the big-company, multi-zillionaire corporations,\
    \ and building your own devices.\n\nThe grassroots sort of, D-I-Y community that\
    \ constitutes a large portion of the `Pi` ecosphere is hands-down an inclusive\
    \ group that aims to help others fine-tune all of the little bugs until your `Pi`\
    \ project works the way you want it to. You may find that some individuals are\
    \ more secretive about their projects.\n\nMaybe they too are wanting to be a self-made\
    \ zillionaire someday off of their inventions, but for the most part the whole\
    \ culture surrounding `Pi`, is a community build on sharing and bypassing the\
    \ commodity of knowledge. Or at least those seeking to capitalize off of their\
    \ code.\n\nHopefully now you have at least got your `OS` all geared up on your\
    \ `Pi` and a few projects to start working on right away. When in doubt just stick\
    \ to using a breadboard that way you can make any changes easier. It also jus\
    \ helps you move a little quicker in terms of building, which can be great when\
    \ you are first starting out.\n\nAlso if you are working on a project like the\
    \ `Synced Holiday Lights` mentioned earlier, you are probably going to end up\
    \ putting all of your electronics in some sort of casing. In the case of the lights,\
    \ you end up with a lot of wires. Using a breadboard while you are working on\
    \ where everything will go, will make it easier to switch things around a bit\
    \ if you need to in order to get them to suit your case.\n"
