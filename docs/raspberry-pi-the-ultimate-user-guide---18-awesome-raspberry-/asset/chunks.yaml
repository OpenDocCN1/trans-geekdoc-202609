    # 树莓派：终极指南 - 适合初学者的 18 个顶级树莓派项目、技巧与教程！


    ## 目录

    * 引言

    * 第一章 – 首要任务：从 Linux 开始之旅

    * 第二章 – Pi 照片的应用

    * 第三章 – 树莓派酷爱游戏

    * 第四章 – 你的 Pi 实用技巧

    * 第五章 – 行业秘诀

    * 第六章 – 激发你的灵感

    * 结


    ## 引言


    树莓派（Raspberry Pi）是一个真正非常强大的设备，它能为你提供几乎无限的可能性，而且价格并不昂贵。通常基础单元的价格在 30 到 40 美元之间。


    然后，你可以在此基础上添加几乎任何电子设备或小配件中找到的组件，来创建你自己版本的任何成品的 DIY 版本，而如果直接购买成品，其成本会高出得多。你为成品产品所付出的代价不仅仅是金钱，当你选择已经完全制造的产品时，你实际上放弃了大量的控制权。


    当你开始使用树莓派并学习越来越多的编程时，这个过程将为你开辟各种途径，让你能够创建出完全按照你的意愿、在你想要的时间以你想要的方式运行的设备。


    除了夺回控制权之外，你可以构建的许多设备还可以帮助你完全消除支付某些基础服务相关的每月订阅费费用。


    在后面的几个章节中，你将看到一个使用树莓派构建个人云盘的示例，你可以随心随地访问它。再也不需要支付那些无法提供任何实际内容的离谱存储费用了。


    通过这种方式，你实际上控制了空间的大小，而且到头来，你对所有文件拥有完全的所有权。它们存储在你的家里，而不是某个遥远的服务器上。


    虽然树莓派非常适合教学或学习构建自己设备的技术，但它作为一个芯片确实完全可以独立存在，并用于任何绝非初级的严肃项目。


    为了能从某处开始，我们将查看 18 个不同的项目，虽然这些项目的目的和技能水平各异，但它们仍然属于初级类别。但别担心，这并不意味着这些初级项目会无聊或无用。


    虽然市面上一些高级项目会将树莓派作为视频游戏模拟器来玩复古游戏，或者利用 3D 打印材料和树莓派的帮助构建自己的平板电脑，但制作这类项目的人也必须从某个地方开始。对于大多数人来说，那个起点就是从
    Linux 操作系统开始。


    目前其他可以在树莓派上运行的操作系统，但你会发现其他程序员使用的最常见、流行的系统无疑是 Linux。Linux 是程序员的操作系统。


    如果你发现它有点超出你的能力范围，请坚持一段时间。学习代码本身就是一种完整的语言。幸运的是，编写代码有许多内部技巧（我们稍后会实际介绍一些），可以让你从完全不会写代码到编写出自己的运行程序完成过渡。


    你可能在考虑你的 iOS 或 Windows 关联。别担心，这两家公司一直在不断推出利用这两个系统的新方法。


    但在大多数情况下，考虑到 Linux 是开源的，它并行于……


    ## 第一章 – 首要任务：从 Linux 开始之旅


    当你开始使用树莓派时，首先需要的是一个操作系统。虽然有很多选择，但最常见、流行的系统是 Linux。Linux 是程序员的操作系统。


    如果你发现它有点超出你的能力范围，请坚持一段时间。学习代码本身就是一种完整的语言。幸运的是，编写代码有许多内部技巧，可以让你从完全不会写代码到编写出自己的运行程序完成过渡。


    为树莓派创建的官方操作系统是 `Raspbian`。它是专门针对 `Linux` 硬件的 `Debian` 版本。`Raspbian` 带有许多实用工具，如用于
    Python 开发的 `IDLE` 和面向初学者的 `Scratch`。


    要开始，你需要一张 `SD 卡`。将下载 `Raspbian` 镜像并使用 `Raspberry Pi Imager` 等工具将其刷到卡中。一旦卡准备就绪，将其插入树莓派，连接键盘、鼠标和显示器，然后通电。


    首次启动时，你将通过一个设置向导进行操作。在这里你可以设置用户名、密码并连接 Wi-Fi。设置完成后，你就准备好探索树莓派的世界了。


