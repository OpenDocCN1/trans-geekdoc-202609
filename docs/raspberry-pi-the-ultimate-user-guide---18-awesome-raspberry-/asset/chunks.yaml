  trans: "\n\n这里有一些想法，可以激发你的灵感，并希望能带你上道路，根据自己的设计构建出真正独特的东西。谁知道呢，你可能正在发明自烤机机以来最酷的发明呢。\n\
    \n### 构建独特的硬件\n你可以构建自己的点唱机。想更进一步的话，可以设置音乐从在线流媒体服务传输。使用一个 `AirPlay` 接收器构建你的盒子，突然之间你就可以通过\
    \ FM 频道到处广播它了。现在谁还需要 Sirius 呢？\n\n不要仅仅因为它体积小就意味着功能受限。许多程序员正在使用 `Raspberry Pi`\
    \ 搭建属于他们自己的、功能全计算机。这种项目绝对不适合没有耐心或预算有限的人。 \n\n它可能需要大量的处理器，这会花费一些钱，但如果你想对电脑中的一切拥有完全的控制权，为什么不迎难而上，从零开始构建自己的呢？\n\
    \n### 个人服务器与云\n说到从零开始构建，为什么不尝试构建你自己的个人 Web 服务器呢？现在，你可以把它带到任何地方。这是一个深入且复杂的过程，但如果你非常重视自己的安全以及在任何何地都能保留访问权限的能力，这种项目将非常适合你。\n\
    \n云服务现在无处不在。遗憾的是，使用托管服务会让你放弃很多控制权，而且如果你想要任何形式的专业级存储，还需要支付每月费用。为什么不干脆构建你自己的个人云存储呢？你必须投资购买实际的存储设备，但至少是一次性购买，而且实际存储设备永远归你所有。\n\
    \n构建你自己的家庭游戏机工作室。构建你自己的带电带框的数字艺术画廊。构建你自己的数字音乐设备。\n\n### 黑客与伦理\n你可以做几乎任何事情，其中一项恰好就是黑客。我们没有涵盖黑客内容有两个原因。之一是尽管\
    \ `Raspberry Pi` 芯片在破解软件方面非常出色，但这类知识如果落入错误的人手中，确实可以用于破坏性和自利的目的。\n\n如果我们知道所有人都会为了人类的共同利益而使用它，那就太好了。黑客技术绝对可以用于善，许多黑客发现\
    \ `Raspberry Pi` 因其极强的便携性而非常完美。你基本上可以设置一个手掌大小、带有触摸屏显示器的外壳电脑，无论你走到哪里都能访问电脑。\n\n\
    它非常适合帮助在途中的人，也非常适合进入你真正不属于你的地方。如果你打算用你的 `Raspberry Pi` 四处窥探，不要对你可能陷入的麻烦感到惊讶。无论是在个人层面还是法律层面。\n\
    \n# 结论\n学习一些编码对你没有坏处，但世界上有许多人已经完成了所有的编码，并将其嵌入到免费提供的链接中。\n\n`Raspberry Pi` 社区在需要编程帮助时互相帮助的氛围非常棒。这全可能是因为在对抗大公司、万亿富翁企业并构建自己的设备的过程中，本身就具有某种惊人的、内在的特性。\n\
    \n构成 `Pi` 生态系统大部分部分的草根型 DIY（自己动手做）社区无疑是一个包容性强的群体，旨在帮助他人微调所有小错误，直到你的 `Pi` 项目按照你想要的方式运行。你可能会发现某些人对他们的项目更加神秘。\n\
    \n也许他们也希望有一天能通过自己的发明成为自力成功的万亿富翁，但大多数情况下，围绕 `Pi` 的整个文化是一个建立在共享和绕过知识商品基础上的社区。或者至少对于那些试图从代码获利的人来说如此。\n\
    \n希望现在你已经在 `Pi` 上准备好了所有的 `OS`，并有几个可以立即开始的项目。如果有疑问，只需坚持使用面包板，这样你就可以更容易地进行任何更改。它也能帮助你在构建方面移动得快一点，这在你刚开始时非常棒。\n\
    \n此外，如果你正在处理像之前提到的 `Synced Holiday Lights` 这样的项目，你最终可能会把所有的电子元件放入某种外壳中。在灯光的情况下，你会得到很多线。在考虑所有东西放置位置时使用面包板，将会在需要为了适应外壳而进行调整时变得更容易。\n"
