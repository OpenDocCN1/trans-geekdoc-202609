    \ if you decide you want to make things more permanent to your Pi, you can dive\
    \ in and solder away. \n\nIn terms of programming the code is relatively simple.\
    \ \n\nHere is an example of some code script that you can use:\n\n| 1 2 3 4 5\
    \ 6 7 8 9101112131415161718192021222324252627 || import RPi.GPIO as GPIOimport\
    \ time pir\\_sensor = 11piezo = 7 GPIO.setmode(GPIO.BOARD) GPIO.setup(piezo,GPIO.OUT) GPIO.setup(pir\\\
    _sensor, GPIO.IN) current\\_state = 0try:    while True:        time.sleep(0.1)       \
    \ current\\_state = GPIO.input(pir\\_sensor)        if current\\_state == 1:           \
    \ print(\"GPIO pin %s is %s\" % (pir\\_sensor, current\\_state))            GPIO.output(piezo,True)           \
    \ time.sleep(1)            GPIO.output(piezo,False)            time.sleep(5)except\
    \ KeyboardInterrupt:    passfinally:    GPIO.cleanup()  |\n\n| --- | --- |\n\n\
    Use this to get your coding going. If for some reason it doesn’t work be sure\
    \ to check your wiring. Also, feel free to toy around with different numerical\
    \ settings in the code to adjust your different sleep and timer settings on the\
    \ motion detector. \n\nYou can also further develop this setup by adding a webcam\
    \ and a wireless adapter so that your home security system actually sends you\
    \ a notification via email including a snapshot of a trigger along with a link\
    \ to the live fee of the webcam. \n\nNow you can have your complete remote viewing\
    \ system in place in case something happens while you are out of your home. You\
    \ even set the sensor up so that it only covers just the area of your desktop\
    \ so that anybody that may be going beyond their boundaries is caught red-handed.\
    \ \n\nIt’s portable, no monthly service fee to handle the monitoring, and you\
    \ built it yourself. It doesn’t get much better thn that in terms of home monitoring.\
    \ \n\nIf you ever wanted to you could even program it to call into the proper\
    \ authorities with a pre-recorded message. Though, with a few wrong calls your\
    \ apt to lose some respect. \n\n## Make Your Own Time Lapse Video\n\nHave you\
    \ ever seen those wonderful time lapse photos or videos and thought of making\
    \ your own, only to realize that the costs of some of the equipment are well beyond\
    \ your means? Well, Raspberry Pi is to the rescue again. \n\nTo do this you pretty\
    \ much only need to install a camera through the ribbon cable attachment. \n\n\
    Your camera can be as basic or advanced as you like, but the good thing is that\
    \ you drastically save on costs by building this all yourself. Once you have a\
    \ camera set up the coding is as simple as setting the shutter release to go off\
    \ on a variety of intervals. \n\nYou pick the times you want it to go off and\
    \ voilà, you have yourself a series of photos that you can then use to go ahead\
    \ and create your own time-lapse videos. \n\nYou can also use this same sort of\
    \ setup to make great animations where the lapse in shutter release is set far\
    \ enough apart to allow you to make the changes in your design necessary to generate\
    \ the animation effect. \n\n# Chapter 3 – Raspberry Pi Loves to Game\n\nOne of\
    \ the most popular uses off the Raspberry Pi is to make gaming emulators. The\
    \ wide array of emulators that are being made today with the Raspberry Pi run\
    \ the gambit of everything from actual arcade stick and button emulators to emulators\
    \ that use Xbox controllers to plug directly into an HDMI monitor or television.\
    \ \n\nYou really can get as advanced as you want when it comes to building your\
    \ emulator, the best thing about is that you can now play all of those old games\
    \ that used to when you were a kid, and if you happen to be part of a younger\
    \ generation, now you can see what all the hype is about with truly retro games.\
    \ \n\nTo keep things simple, you can start by purchasing a USB controller or joystick\
    \ so that you don’t have to build your own right away. \n\nThis way you can focus\
    \ on getting your Raspberry Pi setup and running with the emulator of your choice.\
    \ \n\nThe setup is best done by using a program from RetroPie that you download\
    \ and then install on your SD card for the Pi. Once you have the software on the\
    \ card plug in your Pi chip and start up the device. \n\nThe basic setup involves\
    \ enabling SSH and then boosting your overlook. These are both options that you\
    \ will see in the configuration of the program upon booting up and expanding the\
    \ file. \n\nWhen you are done you will want to follow the prompts and reboot the\
    \ system. Lastly you need to make sure that your Raspberry Pi has added ROMS.\
    \ To do this you need to go into your network configuration and find your Raspberry\
    \ device. \n\nWhen you open it up you will find the location to store your ROMS.\
    \ You can also choose to go out and download actual FTP software to help you if\
    \ you are unable to add it under your network settings. \n\nIn terms of choosing\
    \ which games you want to play there are as many different available (and free)\
    \ emulators as there are gaming platforms. Nearly every different system has their\
    \ own. "
