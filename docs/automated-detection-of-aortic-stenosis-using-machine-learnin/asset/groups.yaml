    # Automated Detection of Aortic Stenosis using Machine Learning


    Brief Title: Automated Detection of Aortic Stenosis


    Benjamin S. Wexler^a, Zhe Huang^b, Gary Long^c, Stefano Pacifici^d, Nishant Prashar^d,
    Samuel Karmiyd, Roman A. Sandler^d, Joseph Sokol^e, Daniel B. Sokol^e, Monica
    M. Dehn^a, Luisa Maslon^a, Eileen Mai^a, Ayan R. Patel^b, Michael C. Hughes^b


