    \ clinics in over 13 states in the US and data were acquired with ultrasound units\
    \ from 4 major vendors (GE®, Philips®, Teratech®, Acuson®). AS grade was assigned\
    \ by COCATS level III echocardiographer.\n\n## Statistical Analysis\n\nTo evaluate\
    \ the classification performance of each neural network, we report the balanced\
    \ accuracy on the test set. To assess binary discrimination between two classes,\
    \ we also report the area under the ROC curve. For each performance metric, we\
    \ report a 95% confidence interval computed using 5,000 bootstrapped samples of\
    \ the test set. We average this reporting across 3 independent partitions or “splits”\
    \ of the data into training and test.\n\n## Results\n\nThe clinical characteristics\
    \ of the patients included in this study are shown in Table 3a. The primary labeled\
    \ cohort included 577 patients. The median age was 74 (IQR 63-82), 43% of the\
    \ patients were women. 86% of the study population was Caucasian. The hemodynamic\
    \ parameters of the echocardiograms are shown in Table 3b. The median aortic valve\
    \ velocity was 2.89 m/s (2.29-3.67), the median peak gradient was 34.6 mmHg (21.0-54.0\
    \ mmHg), and the average mean gradient was 18.1 mmHg (11.9-30.6 mmHg). The average\
    \ LV ejection fraction was 60% (55-65%).\n\nPartitioning of the dataset is shown\
    \ in Table 2. The fully-labeled set contains both diagnosis and view labels (599\
    \ students representing 577 patients, 43823 total images of which 17270 have view\
    \ labels). After preprocessing, the median study in our dataset contains 70 images\
    \ (5th-95th) percentile range 48-105, min-max range 15-181). The median number\
    \ of images with view labels is 19 (5-95th) range 4.9-71, min-max range 1-107.\
    \ Fully-labeled data were divided into training (60%, 360 studies), validation\
    \ (20%, 119 studies), and test sets (20%, 120 studies).\n\n## View classification\n\
    \nOur view classifiers deliver 97% balanced accuracy on test set when averaged\
    \ over the 3 partitions of TMED-2. Balanced accuracy for the view task increases\
    \ notably as the size of the available training and validation data increases\
    \ from 90.3% with only 56 studies (95% bootstrap CI 87.5-90.4%) to all 97.0% with\
    \ all 476 studies (95% bootstrap CI 95.9-97.5%),\n\n**Supplementary Table 4.**\
    \ Using power-law curve-fitting that has been empirically successful in characterizing\
    \ deep learning performance as dataset sizes increase$^{21}$, we project that\
    \ labeled-set-only balanced accuracy could improve to 98.5% if 1000 labeled studies\
    \ were available for model training and validation (Supplemental Figure 4).\n\n\
    To sanity-check prediction quality, we used Grad-CAM$^{22}$ to generate visual\
    \ explanation heat-maps for our view classifier on select images from our test\
    \ set (Figure 2). These visuals suggest that view predictions depend on relevant\
    \ regions of the aortic root and aortic valve instead of irrelevant background\
    \ data.\n\n## External validation of view classification\n\nAccuracy at recognizing\
    \ A4C views from the external EchoNet dataset is 93.4% (95% bootstrap CI: 93.2-93.8%)\
    \ averaged over 3 splits on the full labeled set (476 studies for training and\
    \ validation, 120 for test). When the available labeled data are smaller, performance\
    \ is naturally less accurate: 81.1% when developed on 165 studies and 66.1% when\
    \ developed on 56 studies (Supplement Table 5).\n\nDiagnosis performance using\
    \ limited 2D images related to a patient\n\n**Supplementary Figure 2** shows how\
    \ study-level diagnosis classification improves with more labeled data across\
    \ two strategies for averaging across all images to make a coherent study-level.\n"
