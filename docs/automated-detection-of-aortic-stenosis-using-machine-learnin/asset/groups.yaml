  - '[PAGE 16]


    automated screening program that uses limited 2D datasets—embedded within or upstream
    of hospital or clinic-based echocardiogram laboratories—might improve case identification
    and referral. While the discriminatory performance of these models appears excellent,
    the positive predictive value is modest. This is related in part to the relatively
    low prevalence of AS and should be viewed in the context of a very high negative
    predictive value (i.e. very few cases will be missed).


    These tools could enable studies to address the profound treatment disparities
    for patients with severe AS$^{25,26}$ or interrogate emerging evidence that many
    patients with severe AS are not treated$^{3,27,28}$ An automated screening could
    allow for large scale studies of the natural history of AS and also uncover potential
    biases in the care pathway of patients with this condition. Certainly, additional
    studies are needed to assess whether automation tools that enable effective screening
    and timely referral can improve outcomes for patients with AS. Automated detection
    of AS might also enable studies of early interventions to halt disease progression.$^{29}$
    Classically, it has been challenging to study early stage disease since early
    AS is asymptomatic. Fully automated interpretation of limited echocardiography
    may be worthwhile if effective treatments emerge, or for enabling trial recruitment
    for treatment of earlier stage disease. The methods presented here do not use
    Doppler images and are so potentially suited to use with POCUS devices.


    The modern networks studied here are attractive for the field of echocardiography
    because they can learn competitive models from small labeled datasets. These models
    used a single frame from the cine loops. Use of the time-varying feature sets
    almost certainly contains additional information, however this added has to be
    balanced against the computational requirements needed to process more complex
    datasets. This network was designed to be scalable and require the least-information
    necessary to be clinically valuable. Additionally, as'
  - '[PAGE 17]


    demonstrated with the external validation study, these networks can ingest complete
    or partial studies and assign a diagnostic label. This flexibility positions these
    methods for use with limited acquisitions in screening environments. Study-level
    diagnoses were achieved using a novel view-prioritized approach which uses a view-classifier
    to identify views deemed relevant for the diagnostic task of interest (here A.S.).
    Diagnostic classifier predictions from these relevant views are then prioritized
    via a weighted average to predict a coherent study-level diagnostic label. We
    present validation studies of the sequential view and diagnostic tasks to emphasize
    the tiered approach used here that we believe can be applied to automate other
    complex imaging diagnoses.


    The data used in these studies are released as part of our Tufts Medical Echocardiogram
    Database version 2 (TMED-2, and code available at https://tmed.cs.tufts.edu/).
    TMED-2 substantially increases the number of publicly released studies, increases
    resolution to 112x112 from 64x64, and increases available view types compared
    to our smaller earlier release.²19 This database covers a range of AS pathologies
    and will support the development of novel methods to automate screening for complex
    imaging diagnoses. The notable accuracy gains possible on external data with 3x
    increases in dataset size illustrate the critical need for efforts to make labeled
    datasets available to researchers worldwide.


    There are a few limitations to this work that must be recognized. The presented
    echocardiograms from a single academic center and diagnostic labels were assigned
    as part of routine clinical care. Non-white patients were under-represented in
    this cohort though the echocardiogram-based imaging diagnosis of AS should not
    have any biologic differences based on race. This study did not include outcome
    data or information from other imaging modalities to confirm disease severity.
    While the number of labeled echocardiograms is modest, these networks are notable
    in that they can learn from small labeled sets. This is important for future'
  - '[PAGE 18]


    Journal Pre-proof


    model development where labels are expensive and time consuming. While more complex
    low flow/ low gradient subtypes may be misclassified, we minimize this risk by
    collapsing moderate and severe AS into a single ''significant AS'' category that
    should be referred for comprehensive study and care. This is by design and is
    important for future screening trials. Prior efforts that focus only on high flow/
    high gradient subtypes¹⁴ would miss a significant number of cases that represent
    severe disease with lower flow profiles. With release of our code and images,
    we encourage additional external validations of our work. We expect performance
    would improve with higher image resolutions, larger neural networks, or use of
    all frames from cineloops rather than the first frame only; we keep resolutions
    modest (112 x 112 pixels) and used only one frame to achieve a tractable balance
    between accuracy and training time. On modern GPUs each neural network we trained
    already requires dozens of hours on the largest version of our dataset.


    # Conclusion


    ML approaches optimized for echocardiography can successfully identify AS using
    limited 2D datasets. These methods lay the groundwork for fully automated screening
    for this disease and future study of interventions to improve outcomes.


    Acknowledgements: This work was supported by the National Institutes of Health
    Tufts CTSI NIH CTSA UL1TR002544. BW received funding from the National Institutes
    of Health (K23 AG055667)


