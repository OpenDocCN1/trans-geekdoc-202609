    区分非显著（无主动瓣狭窄或早期主动瓣狭窄）与显著（中度、重度）主动瓣狭窄。


    ## 外部验证


    使用 Stanford EchoNet Dynamic 数据集对视图分类器进行了外部验证。²20 该数据集包含 10,030 张 A4C 视图图像，这些图像是通过与我们专注于
    Tufts 的数据集完全不同的患者群体、临床团队和标签分配所收集的。由于所有 10,030 张图像均为 A4C 视图，我们报告了我们的视图分类器在该数据集上的准确率。我们使用了该集中所有可用的
    A4C 图像，其分辨率为 112x112（与我们的图像分辨率相同）。


    我们进行了两项针对主动瓣狭窄诊断分类器的外部验证研究。第一项是对 Tufts 医学中心在 2022 年 5 月至 7 月期间进行的经声心动图（TTE）进行的时间外部验证。这些研究代表了临床指征性的
    TTE，其主动瓣狭窄分类经过本研究的独立审查（无主动瓣狭窄、早期主动瓣狭窄、显著主动瓣狭窄，定义方式与模型推导任务相同）。


    接下来，我们对 iCardio.ai 提供的数据进行了外部验证研究。该数据由一家门诊诊断影像公司在 2018-2020 年间执行的 TTE 组成。对于这项验证，我们获得了单一成像视图（PLAX）和该研究的主动瓣狭窄诊断标签。该验证旨在测试模型在有限
    2D 采集上的性能。该队列的 TTE 是在美国超过 13 个州的州的独立医疗机构和诊所进行的，数据使用来自 4 家主要供应商（GE®、Philips®、Teratech®、Acuson®）的超声设备采集。主动瓣狭窄分级由
    COCATS III 级心动图专家分配。


    ## 统计分析


    为了评估每个神经网络的分类性能，我们报告了测试集上的平衡准确率（balanced accuracy）。为了评估两类之间的二分类判别，我们还报告了 ROC 曲线下的面积（AUC）。对于每个性能指标，我们报告了使用测试集
    5,000 次自助采样计算出的 95% 置信区间。我们将此报告在数据划分为训练和测试集的 3 个独立分区（或“划分”）中取平均值。


    ## 结果


    本研究纳入的患者临床特征如表 3a 所示。主要标记队列包括 577 名患者。中位年龄为 74 岁（IQR 63-82），43% 的患者为女性。研究人群中 86%
    为高加索人。心动图的血液动力学参数见表 3b。主动瓣膜中位速度为 2.89 m/s（2.29-3.67），中位峰值差为 34.6 mmHg（21.0-54.0
    mmHg），平均压力差为 18.1 mmHg（11.9-30.6 mmHg）。平均左心室射血分数为 60%（55-65%）。


    数据集的划分如表 2 所示。全标记集包含诊断和视图标签（599 名学生代表 577 名患者，共 43,823 张图像，其中 17,270 张具有视图标签）。经过预处理后，我们数据集中的中位研究包含
    70 张图像（第 5-95 百位数范围 48-105，最小-最大范围 15-181）。具有视图标签的图像中位数为 19 张（5-95 百位数范围 4.9-71，最小-最大范围
    1-107）。全标记数据被分为训练集（60%，360 项研究）、验证集（20%，119 项研究）和测试集（20%，120 项研究）。


    ## 视图分类


    在 TMED-2 的 3 个分区上平均后，我们的视图分类器在测试集上实现了 97% 的平衡准确率。随着可用训练和验证数据规模的增加，视图任务的平衡准确率显著提高：从仅
    56 项研究的 90.3%（95% 自助采样 CI 87.5-90.4%）增加到所有 476 项研究的 97.0%（95% 自助采样 CI 95.9-97.5%）。


    **补充表 4。** 使用在表征随数据集增大而变化的深度学习性能方面已经验成功的幂律曲线拟合$^{21}$，我们预计如果有 1000 项标记研究用于模型训练和验证，仅标记集的平衡准确率可能会提高到
    98.5%（补充图 4）。


    为了对预测质量进行合理检查，我们使用 Grad-CAM$^{22}$ 为测试集中的选定图像视图分类器生成了视觉解释热图（图 2）。这些视觉结果表明，视图预测取决于主动根和主动瓣膜的区域区域，而不是无关的背景数据。


    ## 视图分类的外部验证


    从外部 EchoNet 数据集中识别 A4C 视图的准确率在全标记集（476 项用于训练和验证，120 项用于测试）的 3 次划分平均后为 93.4%（95%
    自助采样 CI：93.2-93.8%）。当可用标记数据较少时，性能自然较低：在 165 项研究上开发为 81.1%，在 56 项研究上开发为 66.1%（补充表
    5）。


    **补充图 2** 显示了在跨所有图像平均以形成连贯研究层级的两种策略下，随着标记数据的增加，研究级诊断分类如何提高。

