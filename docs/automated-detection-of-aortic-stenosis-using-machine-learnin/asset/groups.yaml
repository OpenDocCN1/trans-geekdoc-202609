    # Statistical Analysis


    To evaluate the classification performance of each neural network, we report the
    balanced accuracy on the test set. To assess binary discrimination between two
    classes, we also report the area under the ROC curve. For each performance metric,
    we report a 95% confidence interval computed using 5,000 bootstrapped samples
    of the test set. We average this reporting across 3 independent partitions or
    “splits” of the data into training and test.


    # Results


    The clinical characteristics of the patients included in this study are shown
    in Table 3a. The primary labeled cohort included 577 patients. The median age
    was 74 (IQR 63-82), 43% of the patients were women. 86% of the study population
    was Caucasian. The hemodynamic parameters of the echocardiograms are shown in
    Table 3b. The median aortic valve velocity was 2.89 m/s (2.29-3.67), the median
    peak gradient was 34.6 mmHg (21.0-54.0 mmHg), and the average mean gradient was
    18.1 mmHg (11.9-30.6 mmHg). The average LV ejection fraction was 60% (55-65%).


    Partitioning of the dataset is shown in Table 2. The fully-labeled set contains
    both diagnosis and view labels (599 students representing 577 patients, 43823
    total images of which 17270 have view labels). After preprocessing, the median
    study in our dataset contains 70 images (5th-95th) percentile range 48-105, min-max
    range 15-181). The median number of images with view labels is 19 (5-95th) range
    4.9-71, min-max range 1-107. Fully-labeled data were divided into training (60%,
