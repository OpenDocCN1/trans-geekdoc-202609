    ## Introduction


    Aortic stenosis (A.S) is an enormous public health problem that affects over 12.6
    million adults and worldwide causes an estimated 102,700 deaths annually.1 Recently,
    there has been interest in earlier identification of AS and evidence that many
    patients may not be appropriately treated.2,3

    These observations motivate the study of novel methods to identify AS. Here, we
    evaluate whether machine learning (ML) methods can accurately identify AS using
    limited datasets that are suited for disease screening.


    Little is known about how to improve identification and treatment of AS. Employing
    a population-based comprehensive echocardiogram (TTE) screening approach would
    be prohibitively expensive. An automated interpretation of limited echocardiography
    is an attractive alternative to disease detection, especially with the rise of
    point care ultrasound (OCUS) devices.


    Classically, accurate grading of AS relies on integration of numerous structural
    and hemodynamic parameters from multiple planes.4 From the perspective of disease
    screening, certain features of AS such as valve thickness and calcium burden are
    readily apparent on 2D images. While deep learning methods can now surpass humans
    in certain medical image classification tasks5,6 common classifiers take only
    individual images as input and applications in echocardiography have so far focused
    only on viewpoint identification, segmentation, and assessments of ventricular
    function and myocardial diseases.7-10 ML approaches to AS so far are limited to
    using echocardiogram reports (thereby requiring expert image interpretation to
    work)11,12 or are limited to very small numbers13 focusing only on severe disease.14
    None have focused on assessing the continuum of AS using limited images with the
    goal of establishing tools suitable for disease screening.


