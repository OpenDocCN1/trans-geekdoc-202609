  - '[PAGE 6]


    and discard spectral Doppler, color-flow Doppler, and M-mode recordings, keeping
    only 2D cardiac transthoracic echocardiogram (TTE) images. To minimize compute
    time and enhance transportability and to position these networks for use in future
    screening environments, the first frame of PLAX or SAX AoV loop was automatically
    selected for use in the prediction models. If there were multiple PLAX or SAX
    AoV acquisitions in a study (as is often the case) predictions used the first
    frame from each acquisition to arrive at study-level AS prediction. All images
    were standardized to 112x112 pixel resolution. Consistent with routine clinical
    care, there are no view or diagnostic label annotations available for images when
