    standardized digital imaging and communications in medicine (DICOM) images, these
    methods ter intended to be vendor-independent. Echocardiograms were included based
    on the presence or absence of AS. Images were not selected for inclusion based
    on image quality. Patients with prior aortic valve replacements were excluded.
    Other cardiac findings including other concomitant structural heart disease and
    rhythm abnormalities (i.e. atrial fibrillation) were not excluded.


