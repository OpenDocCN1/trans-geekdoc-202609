    # External Validations


    External validation of the view classifier was done using the Stanford EchoNet
    Dynamic dataset.²20 This dataset contains 10,030 images of the A4C view type,
    gathered using completely different patient populations, clinical teams, and label
    assignments as our Tufts-focused dataset. Since all 10,030 images are A4C views,
    we report our view classifier’s accuracy at this dataset. We used all available
    A4C images in this dataset, which are provided at 112x112 resolution (the same
    resolution for our images).


    Two external validation studies of the AS diagnostic classifiers were done. The
    first was a temporal external validation performed on TTEs done at Tufts Medical
    Center from May to July, 2022. These studies represent clinically indicated TTEs
    with an AS classification that was independently reviewed for this study (no AS,
    early AS, significant AS, defined in an identical fashion to the model derivation
    tasks).


    Next, we performed an external validation study on data provided by iCardio.ai.
    The data consisted of TTEs performed between 2018-2020 by an outpatient diagnostic
    imaging company. For this validation we had access to a single imaging view (PLAX)
    and the AS diagnostic label for the study. This validation was designed to test
    model performance on limited 2D acquisitions. The TTEs for this cohort were performed
    for independent medical practices and clinics in over 13 states in the US and
    data were acquired with ultrasound units from 4 major vendors (GE®, Philips®,
    Teratech®, Acuson®). AS grade was assigned by COCATS level III echocardiographer.'
