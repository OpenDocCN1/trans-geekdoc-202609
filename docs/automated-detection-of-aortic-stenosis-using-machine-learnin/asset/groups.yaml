    ## 摘要：


    目标：动脉脉狭窄 (AS) 是一种变性瓣膜疾病，目前诊断不足且治疗不足。利用有限的 2D 超声心图检测 AS 可以实现筛查，并改善该疾病的适当转诊和治疗。我们旨在开发从有限成像数据自动检测
    AS 的方法。


    方法：使用有限的 2D 经胸超声心图 (TTE) 数据对卷积神经网络进行训练、验证和测试。开发的网络用于完成两个顺序任务：1) 视图识别和 2) AS 的疾病级分级。使用平衡准确率和受者工作特征曲线下面积
    (AUROC) 作为性能指标。


    结果：包含了 577 名患者的标注图像。神经网络在来自 338 名患者的数据（平均 N = 10,253 张标注图像）上进行训练，在 119 名患者上进行验证（平均
    N = 3,505 张标注图像），并在 120 名患者的测试集上（平均 N = 3,511 张标注图像）评估性能。实现了 AUROC 为 0.96 的 AS
    全自动筛查。网络能以 AUROC = 0.86 区分无显著（无、轻度、轻/中度）AS 与显著（中度或严重）AS，并以 0.75 的 AUROC 区分早期（轻度或轻度/中度
    AS）与显著（中度或严重）AS。在 8502 例门诊 TTE 队列中对这些网络的外部验证显示，仅需胸旁长轴成像即可实现 AUROC 为 0.91 的 AS
    筛查。


    结论：使用现代神经网络利用有限的 2D 数据实现 AS 全自动检测是可行的。这些方法为新型 AS 筛查方法奠定了基础。


    **关键词：**动脉脉狭窄，筛查，机器学习，超声心图，经胸超声心图


    ## 缩写：


    - AS = 动脉脉狭窄

    - TTE = 经胸超声心图

    - ML = 机器学习

    - VHD = 瓣膜心脏病

    - AVR = 动脉瓣置换

    - SSL = 半监督学习

    - DICOM = 医学数字影像和通信标准

    - PLAX = 胸旁长轴

    - PSAX AoV = 胸旁短轴主动脉瓣

    - 2：塔夫茨医学中心


