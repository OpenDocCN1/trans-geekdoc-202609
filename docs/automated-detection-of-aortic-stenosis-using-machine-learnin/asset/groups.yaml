    A high-volume tertiary care center (Tufts Medical Center, Boston, MA). The Cardiovascular
    Imaging Center is Intersocietal Accreditation Commission (IAC) accredited and
    is equipped with ultrasound units from major vendors (Philips®, Toshiba®, Siemens®).


    ## Echocardiograms


    This work was approved by the Tufts Medical Center IRB. The echocardiograms originate
