    # Discussion


    Novel approaches to AS case identification are needed to improve treatment rates
    for this condition. Here we develop methods for fully automated detection of AS
    from limited TTE datasets. We show that automated detection of AS is possible
    using modern deep learning classifiers and that these networks are generalizable
    across different datasets. These tools can broadly characterize the presence or
    absence of AS and the severity of disease and are well suited for identifying
    patients who should be referred for comprehensive echocardiography.


    These results represent important steps toward establishing a novel approach to
    AS case identification.


    These models are not designed to comprehensively phenotype AS as can be done with
    complete TTE. Instead, we view this work as a method to move case identification
    upstream of the echocardiogram laboratory. With an estimated incidence rate of
    severe AS of 4.4%/year in the general population >65 years of age, it is clear
    that many patients go unrecognized.23 The sensitivity and specificity of contemporary
    care with cardiac auscultation for detecting significant valve disease is only
    44% and 69% respectively.24 Performance of auscultation is likely to be even lower
    for detecting mild disease where murmurs are less intense. An'
