    利益冲突：BW 曾为 iCardio.ai 提供咨询，没有与本工作相关的商业利益追求。


    ## 资助：


    本工作受 NCATS 资助 UL1TR02544，受 NIH 资助 K23AG05567


    ## 引言


    动脉脉狭窄 (AS) 是一项巨大的公共卫生问题，影响着 1260 万成年人，在全球范围内每年导致估计 10,200 人死亡。7 近期，对 AS 的早期识别引起了兴趣，且证据表明许多患者未得到适当治疗。2,3
    这些观察促使我们研究识别 AS 的新型机器学习 (ML) 方法。


    传统上，AS 的准确分级依赖于多个平面的结构和血动力学参数的整合。4 从筛查的角度来看，AS 的某些特征（如瓣膜厚度和钙负荷）在 2D 图像上显而易见。虽然深度学习方法在某些医学图像分类任务中已经超过人类5,6，常见的分类器仅以单个图像作为输入，且在超声心图中的应用目前主要关注视图识别、分割以及心脏功能和心肌疾病的评估。7-10
    目前 AS 的 ML 方法限于使用超声报告（因此需要专家对图像进行解读才能工作）11,12，或者限于仅关注严重疾病的小样本13。14 尚未研究关注利用有限图像评估
    AS 的连续性，以建立适用于筛查的工具。


    ## 方法


    一家大型三级医疗中心（马州波士顿塔夫茨医学中心）。心血管成像中心已获得国际学会认证委员会 (IAC) 认证，并配备了主要供应商（Philips, Toshiba,
    Siemens）的超声设备。


    ## 超声图


    本工作已获得塔夫茨医学中心伦理委员会 (IRB) 的批准。超声图源于 2011-2020 年间作为常规护理实施的 TTE。通过使用标准的医学数字影像和通信
    (DICOM) 图像，这些方法旨在独立于设备。根据是否存在 AS 纳入超声图。未根据图像质量选择图像。排除既往过动脉瓣置换的患者。其他心脏发现，包括其他结构性心脏疾病和心律异常（如房颤）均未排除。


    ## 图像采集与预处理


    图像由经过培训的超声技师采集，方法与现美国超声心学会 (ASE) 指南一致。15。对于本研究，我们使用元数据来识别'
