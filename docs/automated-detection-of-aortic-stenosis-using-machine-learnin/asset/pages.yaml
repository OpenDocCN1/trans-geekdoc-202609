  md: 'Figure 6. Fully External Validation of the Diagnostic Classifier


    Table 1. Aortic Stenosis Reference Labels


    | Reference AS Severity | Grading Thresholds |

    | :--- | :--- |

    | Severe | valve area of < 1.0 cm², peak velocity > 4.0 m/s, or mean gradient
    > 40 mmHg |

    | Moderate | valve area of < 1.0 cm², peak velocity < 4.0 m/s or mean gradient
    < 40 mmHg and LVOT derived stroke volume < 35 mL/m2 |

    | Mild | valve area of 1.0-1.5 cm², peak velocity 3.0-4.0 m/s, or mean gradient
    20-40 mmHg; valve area of < 1.5 cm², peak velocity 2.6-2.9 m/s, or mean gradient
    <20 mmHg |


    **Table 1. AS Reference Labels.** Aortic severity was assigned using an integrative
    approach consistent with current American Society of Echocardiography Guidelines.
    The Severe AS reference label includes both high gradient and low gradient subtypes.
    AS severity was pulled from the echocardiogram report as assigned by the clinical
    reader. As part of routine care an additional label of ‘Mild to Moderate’ was
    assigned when hemodynamic profiles overlap the ‘Mild’ and ‘Moderate’ severity
    classes. Valve area represents the continuity equation derived valve area. LVOT
    is the left ventricular outflow tract diameter. mmHg is millimeters of mercury,
    m/s is meters per second.'
