    # SO WHAT DOES ALL THIS MEAN?


    What are we trying to say with this long example about segments and emails? When
    most standalone CDPs on the market, acting as systems of insight, pass data to
    systems of engagement, they do so at the segment level only. This can work in
    some instances, such as when you just want to send the same email to members of
    a loyalty program, as we explored in the beginning of the previous example. But
    if you want to send an email, display a web experience, target an ad, etc. containing
    the most relevant content to an individual, you need your system of engagement
    to be able to access individual-level data.


    Thus, our recommendation is to select your system of insight and your system of
    engagement at the same time so you''re thinking about the end-to-end process.
    You will likely find that combining insight and engagement functionality into
    one single solution is the best approach.


    One caveat here: Given the number of channels you will likely include in your
    personalization program, it is not realistic to assume that you will be able to
    find activation capabilities for all of them in one system of engagement. But
    the overall concept still applies: you want to limit the number of solutions you
    include in your personalization program to avoid unnecessary complexities and
    shortcomings.


    # HIGH-LEVEL TECHNOLOGY REQUIREMENTS FOR PERSONALIZATION


    No matter which technologies you decide to incorporate into your tech stack, you''ll
    need a few must-have features for one-to-one'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'personalization. Keep in mind, these are critical aspects of an effective solution,
    not an exhaustive list. Use this list as a starting point for thinking about your
    personalization program requirements.


    # A SINGLE, ACTIONABLE PROFILE FOR EVERY SINGLE PERSON


    By this point, it should be abundantly clear that it''s impossible to deliver
    an experience that is unique and relevant to an individual if you don''t have
    a comprehensive understanding of that individual. Imagine several different people
    observing a shopper in a physical store at different times. Each would observe
    distinct actions, so if they don''t share their observations, they will each have
    a very different view of his preferences and intent.


    In the digital world, successful personalization requires that all of your in-depth
    behavioral data from across channels be captured, synchronized with external attribute
    data, and brought together into a single profile for each visitor, customer and
    account. However, a single profile is not easy to deliver and hard to find among
    vendors. Many martech vendors will appear to provide a complete platform that
    offers capabilities across the full personalization spectrum, but merging data
    sources is either impossible with their existing tools or very complex and time-consuming.


    Look for solutions with clear features for resolving identities, prioritizing
    identifiers, aggregating individual-level data, stitching profiles, and more.
    This functionality provides the foundation for delivering a single, actionable
    profile for each person.


    # ROBUST INTEGRATIONS WITH OTHER SYSTEMS


    Your personalization technology should not introduce another silo into your organization.
    To create that single profile for each'
  merge: -1
  img_proc: true
- pgno: 191
  md: 'individual, you need to be able to bring data in from other sources seamlessly.
    And you need to be able to push data out to trigger actions or keep other systems
    up-to-date. With martech stacks becoming more and more complicated, this is an
    area you can’t ignore in your search for personalization technology.


    Look for systems with robust sets of integration capabilities including out-of-the-box
    integrations, robust documented APIs, ETL capabilities, and a generally extensible
    integration framework that allow your developers to easily connect the platform
    to outside systems.


    # THE ABILITY TO UNDERSTAND BUSINESS CONTEXT


    Every business is different, and each business’s products and content are unique,
    with their own unique attributes. For example, a jeweler cares about the cut and
    carat of its diamonds, while a fashion retailer cares about brands and colors
    of its clothing and accessories. A content publisher may care about the author
    of its articles, while a B2B company cares about the keywords in its blog articles.


    Your business is not about pages or events; it is centered around products and
    content. If your personalization technology can only identify that a jewelry shopper
    viewed three product pages, for example, but it can’t understand cut and carat,
    it won’t be able to recognize that the shopper is interested in princess-cut diamonds
    over 1.00 carat in size. That information is imperative to a jeweler.


    Your personalization technology must be able to understand business context so
    you can know not just which pages a person has visited, but what their behaviors
    and interactions with your products and content actually tell you about who that
    person is and what her interests and affinities are.'
  merge: -1
  img_proc: true
- pgno: 192
  md: '# # THE ABILITY TO CREATE SEGMENTS AND LEVERAGE MACHINE LEARNING


    Good data gives you a strong understanding of your customers, but after you have
    that understanding, you need to be able to act on it.


    As we have already discussed, personalized experiences are typically delivered
    via rules (at the segment level) and machine-learning algorithms (at the individual
    level). Your personalization technology must give you the flexibility to build
    as many segments and rules as you need, as well as the visibility and flexibility
    to pick and modify algorithms to deliver the types of personalized experiences
    you envision.


    # # THE ABILITY TO ACT ON ANY AND ALL DATA IN REAL TIME


    We tend to be forgiving when anyone says that something is available in “real
    time.” We often take that to mean “quickly” or “soon” rather than the phrase’s
    real definition: “the actual time during which a process takes place or an event
    occurs.”⁴⁶


    In terms of personalization, “real time” refers to the actual moment that someone
    is interacting with a company. When we say that the data should be used to deliver
    a personalized experience in real time, we mean it should be delivered the actual
    moment a person is interacting with the company, regardless of the channel—based
    on her behavior in real time. All aspects of every visitor’s complete history
    must be combined with everything she is doing in the moment, and everything you’ve
    learned about her from all relevant sources, to deliver a personalized experience
    across channels—in a matter of milliseconds.


    The term is used liberally in many vendors’ marketing messages— and isn’t always
    meant in its full sense—but true real-time is'
  merge: -1
  img_proc: true
- pgno: 193
  md: 'absolutely essential to delivering relevant experiences that leverage a person’s
    in-the-moment, not past, intent.


    # THE ABILITY TO MANAGE THE TECHNOLOGY WITHOUT THE NEED FOR IT OR ENGINEERING
    INVOLVEMENT


    If you are a marketer, you’ve probably experienced the pain that results from
    relying on other teams in your organization to accomplish your marketing goals.
    Whether you need assistance from engineering, IT, customer success or sales, it
    can be frustrating when other teams—weighted down with their own priorities—fail
    to put your initiatives at the top of the list. When it comes to something as
    important as the customer experience, you don’t want to wholly rely on others.
    So what can you do?


    With the right technology, you and your team should be able to launch, measure
    and adjust personalization campaigns quickly and easily on your own, without intervention.
    Yet the platform needs to be comprehensive enough to address all of your complex
    multi-tactic, cross-channel demands. With some vendors, a platform like this just
    does not exist.


    That said, if your IT and engineering teams are essential marketing partners,
    the right platform should provide the reporting, developer tools, interfaces and
    APIs to enable these teams to accomplish their goals as well. Make sure you understand
    everyone’s needs to determine whether prospective personalization solution vendors
    can meet them.


    # ACCURATE ATTRIBUTION ANALYSIS


    As we described in Chapters 6 and 7, testing, analytics and attribution analysis
    are critical components of any personalization campaign. Without the ability to
    test, you cannot know if your campaigns'
  merge: -1
  img_proc: true
- pgno: 194
  md: 'are successful or if there is anything you can do to improve your approach.
    You need built-in testing and attribution analysis to iterate rapidly and ensure
    your experiences and algorithms deliver the best results possible.


    Some solutions are not transparent when it comes to attribution analysis. Some
    vendors will provide reporting on campaign results but not enable customers to
    run or manage those reports themselves. And many will boldly claim that their
    “black box” solutions have made you hundreds of thousands or even millions in
    incremental revenue—taking credit for growth that may have occurred anyway. When
    selecting a personalization solution, make sure that you have the ability to compare
    the results of every campaign against control and that the solution utilizes sound
    statistical science for accurate and defensible attribution analysis.


    # HOW TO EVALUATE CDP AND PERSONALIZATION VENDORS


    When evaluating any new vendor solution, it can be a challenge to sort out real
    strengths from exaggerated claims. The terms used throughout this book—“one-to-one,”
    “real-time,” “intent,” “attribution,” “integrated”—are common buzzwords in the
    industry. They’re so frequently used that they can lose their meaning. Additionally,
    because virtually every email platform, CMS vendor, large technology company and
    small martech vendor has realized the critical importance of personalization and
    customer data, almost every such provider claims to be a personalization and/or
    customer data platform—whether they truly are or not.


    It is critical, therefore, to ask the right questions. The capability to implement
    one-to-one personalization is out there; it’s just a matter of finding the right
    technology for your needs. These questions should help you unravel and evaluate
    a potential vendor’s sales pitch.'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# Does your solution allow for one-to-one personalization? If so,

    can I see a single unified customer profile?


    If one-to-one personalization is important to you (and we assume it

    is if you’re reading this book), then you need to make sure that each

    personalization vendor you consider can help provide true one-to-

    one experiences. Recall how in the ’90s, BroadVision positioned its

    product as “One-to-One” when it only supported simple rule-based

    communication to broad segments. Many vendors today remain

    about as vague about what their “one-to-one” solutions provide.

    Some only offer recommendations based on what other visitors have

    viewed; others merely enable you to create rules or pass data out to

    other systems to deliver personalized experiences to segments. These

    types of experiences are valuable, of course, but they’re not the unique

    experiences delivered at the individual level that a modern personal-

    ization program should support.


    To ensure that personalization can be delivered at the individual

    level, ask to see a vendor’s single, unified customer profile—the indi-

    vidual profile that stores all of the data on an individual person or.

    for B2B needs, on an individual account. If a vendor cannot produce

    one, or if it can only take in segment data from another system, it

    cannot effectively deliver on its one-to-one claims.


    # What channels do you support? Are all channels supported by the

    same, unified platform and driven by the same, unified customer

    profile?


    The main channels we’ve identified are website, web app, mobile

    web, mobile app, email, search, digital advertising, social, direct mail

    and human. Make sure you determine which channels you want to

    personalize and then ensure that those channels are fully supported

    by the vendor. A vendor’s solution should be equipped to collect in-

    depth data from your selected channels, take in data from other sys-'
