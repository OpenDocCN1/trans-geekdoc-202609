    +   - How will management evaluate staff performance in these roles?

    +   - How will you evaluate personalization success?

    +   - What role would you like your technology and/or agency partners to play
    in personalization campaign strategy creation and execution?

    +   - What channels will you personalize? Will you start with a single channel?
    How will you add others into your process when ready?


    # PLANNING


    +   - How will you manage the ideation and prioritization of personalization campaigns?

    +   - Who will establish and manage your personalization campaign calendar?

    +   - How many campaigns do you expect to launch monthly across the organization
    and within each division?

    +   - What are your busy periods? How will you manage high-traffic campaign development
    differently from other periods?

    +   - How will your personalization team work with other teams to plan and execute
    your personalization campaign strategy?

    +   - How will you share best practices and learnings across divisions?


    # TEAM ASSIGNMENT


    +   - What groups and individuals are assigned to support personalization?

    +   - What roles will each group and person play in your personalization strategy?

    +   - What skill sets are required for the various roles?'
