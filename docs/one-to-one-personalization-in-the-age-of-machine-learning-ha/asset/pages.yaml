    # PERSONALIZATION VIA CONTINUOUS LEARNING


    As we’ve described, A/B testing was primarily designed to give you a single answer.
    If you want to test various aspects of your branding (such as fonts, colors, logos
    or taglines), site design, pricing, etc., you’ll want to use A/B or multivariate
    testing because you don’t plan to tailor the experience to different groups or
    individuals. You expect to find a single solution that beats out your other options.


    But that’s not necessarily your goal with personalization. If you have two different
    promotions to feature on your homepage, for example, A/B testing is designed to
    tell you which of the two options has the broadest appeal with some measure of
    confidence. But that’s not truly your goal as a marketer. In reality, your goal
    is to derive the most business value from the two options. A/B testing cannot
    address that goal. You could get closer to that goal by selecting a few segments
    you think will react differently to the promotions, and use rules to target the
    promotions accordingly. But even then, you still aren’t truly addressing your
    goal of getting maximum value out of each promotion—because no situation will
    be as simplistic as the example in the previous section.


    A machine-learning algorithm, such as Contextual Bandit which we referenced back
    in Chapter 2, can address this goal. Contextual Bandit uses predictive scoring
    and machine learning to evaluate the probability of a person engaging with different
    promotions, images, offers or other experiences. A marketer can give the algorithm
    several different experiences to display in a specific area of the website or
    an email, and it will select the best one (with the highest value or lowest cost
    to the business) for each individual visitor.'
