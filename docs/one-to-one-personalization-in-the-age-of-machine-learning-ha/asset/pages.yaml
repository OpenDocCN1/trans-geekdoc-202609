- pgno: 30
  md: '# CHAPTER 2

    MACHINE LEARNING IS CHANGING THE GAME


    As the title suggests, machine learning is truly revolutionizing marketing at
    the one-to-one level. Before we delve into what that revolution looks like, let’s
    define some terms. Many marketers we’ve spoken to are confused by the industry’s
    inability to settle on a clear definition for “machine learning,” and there is
    frequent confusion between that phrase and “artificial intelligence” (AI). In
    these definitions, note that artificial intelligence is the broader field that
    includes machine learning (as well as other areas, such as speech recognition),
    and that computer science is the broader field that includes AI:


    **Computer science:** The study of the principles and use of computers. It’s a
    broad category that encompasses such areas as software engineering, computer networks,
    computer security, and artificial intelligence.²⁶


    **Artificial intelligence:** The theory and development of computer systems able
    to perform tasks that normally require human intelligence, such as visual perception,
    speech recognition, translation between languages and design-making.²⁷


    **Machine learning:** Programming computers to make intelligent decisions—and
    to draw conclusions—without human involvement. Machine learning has broad applicability
    across fields, but in the context of personalization, it is used to make the best
    decision about which experience or engagement to show each person at the one-to-one
    level.'
  merge: -1
  img_proc: true
- pgno: 31
  md: 'With the terms defined, we can now turn our attention back to personalization.
    In this chapter, we’ll review the two main types of personalization: rule-based
    and machine-learning personalization. We’ll also take a brief look at predictive
    segments, a sort of hybrid that uses machine learning to automatically put people
    into different groups, or “clusters,” in order to reduce the effort associated
    with rule-based personalization.


    To elucidate these personalization types, let’s return to that example Peppers
    and Rogers gave for website personalization back in 1994. They wrote: “A user
    who came to your site and expressed an interest in a particular baseball team,
    for instance, could see a ‘hot button’ for a chat group of that team’s fans when
    he comes to your site for his next visit.” We would probably call that “hot button”
    a call-to-action (CTA) button today, and we wouldn’t have to wait for the person’s
    next visit to personalize his experience or require him to “express” an interest
    for it to be determined, inferred or deduced. Nevertheless, the use case is still
    valid.


    Let’s say you work for a tech company, and in the hero section atop your homepage,
    you have a CTA that invites your site’s visitor to “Explore Solutions.” If the
    visitor is in the healthcare industry, you could modify that CTA to say “Explore
    Healthcare Solutions.” Clicking the link would send him to a page related to health
    and medicine, while any visitor not in the healthcare industry would see something
    different.


    In this example, you would use a rule to implement the campaign: If visitor is
    in healthcare, show the healthcare experience. Rules provide marketers with a
    simple way to personalize an experience. They are extremely useful and will probably
    always be employed in some capacity for personalization, but they are not typically
    applied to one-to-one communication. That is where machine learning comes in.
    Although BroadVision claimed to offer “one-to-one marketing” in the ’90s, its
    rule-based system did not actually allow for scalable'
  merge: -1
  img_proc: true
- pgno: 32
  md: 'one-to-one communication. The same holds true for rule-based personalization
    today.


    # RULE-BASED PERSONALIZATION


    Rule-based personalization allows marketers to deliver experiences and engagement
    to specific groups or segments of people based on the manual creation and manipulation
    of business rules. As our definition suggests, segments form the foundation of
    rule-based personalization. Segments allow you to categorize a subset of your
    prospects and customers according to their attributes and behaviors. You then
    use rules to tailor the experience for each segment.


    The simplest way to think about rule-based personalization is in the form of IF/THEN
    statements: IF a person falls into segment A, THEN show him experience X.


    For example:


    +   IF a visitor is located in Los Angeles,

    +   THEN send her an email, push notification or ad about an event

    +   in the LA area.


    +   IF a visitor is a member of your loyalty program,

    +   THEN change the hero area to address a returning customer.


    Segments can be broad or narrow. A segment created using just one or two data
    points would be considered a broad segment, which means that many individuals
    will fit into it. For example, an online apparel retailer can personalize its
    website according to its visitors’ geolocations, showing everyone in a certain
    region the clothing and footwear appropriate for that climate. A B2B site could
    email customers with industry-specific case studies. In these examples, many'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'people are likely to fit into the segments and will therefore receive the same
    experience.


    Segments that begin to combine multiple data points are narrow segments. They
    often leverage nested “AND” and “OR” logic to identify very specific groups of
    visitors. For instance, the clothing retailer could recognize a repeat visitor
    from Florida who originated from a specific ad campaign and point him to the “sun-lovers”
    sale merchandise with which he engaged in the past. The B2B tech company site
    could recognize prospects from the financia’ services industry who have already
    spent a certain amount of time exploring particular product pages, such as network
    servers, and email a relevant white paper. In these cases, the size of the segment
    will be much smaller— because fewer people will fit the criteria.


    Marketers must decide for themselves whether the effort to design an experience
    for a very small group of people is worthwhile. In some instances, doing so will
    be fruitful. For example, if you’re implementing an account-based marketing (ABM)
    strategy, you want to create highly tailored communications to reach specific
    accounts. However, most marketers probably don’t want to set up rules to speak
    to individuals at the one-to-one level.


    # CASE STUDY: DYN


    Dyn, a cloud-based Internet Performance Management (IPM) company, has two major
    product categories targeted to two different audiences: enterprise and small business/consumer.
    Enterprise audiences are encouraged to fill out a form on the website to speak
    with a salesperson, while small business/consumer audiences are able to purchase
    products directly from the site.


    Due to the priorities of the business, enterprise solutions were given the majority
    of the real estate in the navigation'
  merge: -1
  img_proc: true
- pgno: 34
