  md: '# What does attribution reporting look like within your solution?


    You must be allowed to control your own analytics to dive as deep into the data
    as you wish. You should ask any vendor how their analytics and attribution capabilities
    work. Does the solution allow you to compare all campaign performance against
    a control? How is statistical significance determined? Can you calculate the impact
    of your campaigns on multiple metrics so you can understand site-wide impact?
    Are you able to customize the attribution window to uncover the impact during
    different time periods? If you can''t easily determine the answers to these questions,
    you might be dealing with a “black box” solution.


    # How do you use your own product for digital marketing?


    If you notice a vendor has been a bit vague in some of their responses, try this
    question. While not an essential factor in the decision, any vendor should probably
    be using its own product to deliver personalized experiences in its own marketing
    channels. After all, you wouldn’t trust a chef who doesn’t eat her own cooking,
    would you? Even if you’re a B2C company, you can still learn a lot from how a
    personalization technology vendor leverages its own product. At the very least,
    a vendor should be prepared to cite specific and effective examples of personalization
    on their site. A great vendor should give you a comprehensive demo of personalization
    in action across channels, showing you how relevant and engaging experiences are
    delivered at the one-to-one level—in real time—and explaining what business strategies
    each personalization campaign supports.


    If a vendor can’t offer these examples and demonstrations, that might be an indication
    that the product does not meet some of the criteria we have laid out in this book.
    It could also mean that the solution is difficult or cumbersome to use—and even
    the company’s own marketing team might not be able to leverage it.'
