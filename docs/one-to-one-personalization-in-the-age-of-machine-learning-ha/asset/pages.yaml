  md: '# FACIAL RECOGNITION


    Facial recognition technology also has the potential to provide more personalized
    experiences for consumers in the physical world. The technology is everywhere
    these days. For example, you''ve probably noticed that Facebook can automatically
    tag your friends in your photos. That''s just the beginning. Facial recognition
    is being used to catch shoplifters, to keep an eye on gamblers in casinos, and
    to spot fake passports.⁵⁷


    It is also being utilized by advertisers to deliver more personalized ad content
    and provide more interactive experiences in the real world. For example, GM leveraged
    facial recognition in a video billboard in a mall in Santa Monica to promote the
    GMC Acadia. A visible camera was able to detect how many people were standing
    in front of the ad, the genders of those people, whether there were children in
    the group, and the facial expressions of the viewers. With that information, the
    ad (containing a man who was interacting directly with the audience) played one
    of thirty creative and engaging videos in real time to highlight the features
    of the car.⁵⁸


    Beyond personalized advertising, facial recognition has vast implications for
    B2C marketers. For example, retailers could install responsive screens in their
    front windows that displayed merchandise digitally rather than physically, personalizing
    that content to an individual’s visual demographics as he or she walked by (like
    a physical version of a personalized homepage). Within a store itself, a retailer
    could track a shopper’s behaviors with a multitude of cameras to help determine
    intent—a physical version of the digital tracking we described in this book. That
    data could be added to her individual profile so the retailer could develop a
    full understanding of her interactions with the company and, in turn, use that
    data in future interactions across channels.'
