    You probably receive regular emails from many companies and brands, whether you
    read them or not. You likely see the company''s advertisements on Facebook or
    other places across the web. You may even receive physical mail from the company.
    And you probably interact with a human who represents the company or brand from
    time to time, either in person or on the phone.


    When we talk about cross-channel personalization, we mean the ability to provide
    a consistent and relevant experience across each of these modes of communication
    using both the rules and machine-learning algorithms described in the previous
    chapter. Below, we provide details and case studies on each of these channels.


    # WEBSITE


    Many marketers view their website as their most important digital channel—and
    for good reason. Whether your goal is to drive online sales, generate leads or
    maximize page views, there are typically some key actions you want visitors to
    take while on your site (e.g., sign up, download, add to cart, make a purchase,
    etc.). As a result, many of your online marketing activities are focused on driving
    traffic to your website and encouraging people to take these steps. Given its
    importance, the website is often one of the first channels where marketers begin
    to apply personalization.


    Marketers tend to think about personalization taking place in specific spots on
    a website, such as CTA buttons, product recommendations on product detail pages.
    or a personalized widget or two on the homepage. As we covered in the last chapter,
    any area of the site can utilize rules or algorithms to deliver a more relevant'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'experience, from the hero image; to the categories promoted; to the navigation,
    content and products.


    Considering the importance of the website and the central place it holds in many
    marketers’ strategies, it’s critical to link the website to other channels to
    ensure a seamless, cross-channel experience. With all the work that marketers
    do to drive traffic to their websites, it only makes sense to treat each person
    to a relevant and engaging experience when they get there. Every page should be
    a personalized landing page.


    # CASE STUDY: CARTERA


    Cartera Commerce partners with leading airlines that offer loyalty programs, providing
    a way for airline customers to earn more miles, points or cash by shopping with
    over 900 retailers they already know and love. The company often sends emails
    to its regular shoppers containing promotional offers and other information. Cartera
    wanted a way to remind shoppers of these email offers while they were on the site.
    But because the offers are not sent to all shoppers, Cartera needed to personalize
    the site experience to show only the offers that a shopper had already received
    via email.


    By feeding data from its data warehouse into its personalization and customer
    data platform, Cartera was able to promote consistency between its email and on-site
    offers. As a result, the company realized a 14% lift in traffic to affiliate stores
    from lapsed shoppers—a key goal for the company.'
