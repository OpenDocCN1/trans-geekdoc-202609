    # NATURAL LANGUAGE PROCESSING


    Natural Language Processing (NLP) has been defined as “a way for computers to
    analyze, understand, and derive meaning from human language in a smart and useful
    way.”ⁱ It is not just about machines understanding language: it is about understanding
    how humans communicate in the real world so that machines can respond as a human
    would. Amazon’s Alexa and Apple’s Siri are two examples of NLP in action. We mentioned
    NLP in Chapter 2 as something that can be leveraged for personalization within
    one type of advanced algorithm. But more broadly, NLP has the potential to transform
    how marketers interact with consumers.


    In the future, NLP will be more widely used on websites and apps to provide the
    type of service that a consumer could previously only receive from a fellow human
    in a store, on the phone or via online chat. A shopper could ask a chatbot on
    the site a question about what products are right for him based on his specific
    circumstances.”ᶦᶦ The chatbot can then provide answers to his questions via NLP
    without the need to involve an actual human.”ᶦᶦᶦ With this approach, the shopper
    may feel more confident about his selection and be more likely to buy.


    Retailers have certainly already begun to experiment with this type of technology.
    You may have heard of outdoor apparel brand The North Face’s usage of IBM’s Watson
    technology on its website several years ago. The North Face website provided the
    ability for shoppers to enter details about what they were looking for and what
    conditions they were planning to face. Watson then asked follow-up questions,
    as a human would do, to ultimately recommend'
  merge: -1
  img_proc: true
- pgno: 212
  md: 'appropriate products to meet each shopper’s unique preferences and climate
    conditions—emulating the experience a shopper receives in a store from knowledgeable
    store associates.62


    There is also potential for NLP to help consumers bridge the gap between the digital
    and physical worlds. Consumers could leverage NLP in a retailer’s mobile app while
    in a store to ask questions (and receive answers) about where to find what they’re
    looking for.63 This could help speed up shopping trips for consumers and appeal
    to those who would rather accomplish the task on their own without speaking to
    an in-store associate.


    In short, NLP will increasingly be used to simulate human-to-human interactions
    and to provide better, more personalized customer service across channels.


    # THE INTERNET OF THINGS


    If you are like many consumers, you have incorporated “smart” appliances into
    your home. Maybe you have a smart thermostat, like Alphaber’s Nest, that you can
    control from your phone. You may have a smart speaker, such as Amazon Echo or
    Google Home, that you can use to control various fixtures in your house (such
    as lights or fans). You may have an alarm system that you can control from your
    phone. Your stove might be WiFi enabled. You might even be able to view the inside
    of your refrigerator with a camera while you’re in the grocery store.64


    All of these devices can collect data on your usage. Your speaker knows what music
    you have asked it to play, what you have searched for, and how many times you
    have turned the lights on and off in a certain room. The alarm system knows how
    often you set it and how long you’re away from the house. Your thermostat knows
    your heating and cooling preferences.'
