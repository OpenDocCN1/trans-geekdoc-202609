    As with all messages and experiences, testing callout messages is critical. Test
    out different designs and copy to find the most effective option for your site
    or app. Similar to pop-ups, callouts should be used sparingly, as having multiple
    messages appear on the page whenever a visitor moves her mouse can be disorienting.


    # SEAMLESS EXPERIENCES


    In contrast to the above-described interruptive formats. which are easily distinguishable
    from the rest of the customer''s experience, seamless experiences are an integral
    part of the experience and are often expected by the visitor or recipient.


    # INLINE ADS


    Seamless advertising formats such as banner, search and social ads are more commonly
    seen these days than interruptive formats like pop-ups. These are the ads that
    appear as “sponsored” posts on Facebook or LinkedIn or along the edges (or in
    the middle) of articles on media'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'sites. They do not interrupt the experience, but they’re typically labeled
    as advertisements in some way. These types of ads generally provide a better experience
    for visitors, as they do not physically block visitors from interacting with the
    page’s content.


    Advertisers often leverage retargeting in their inline ads, relying on a person’s
    past website visit behavior to deliver more relevant content. But as we described
    back in Chapter 3, advertisers often use limited data to target these ads, resulting
    in less-than-relevant experiences. Using more detailed behavioral data and other
    data stored in the CDP to understand what a person was truly engaged with (or
    even predict what their future needs will be) results in more appropriate personalization
    and more effective retargeting.


    # OPT-IN EMAIL


    Since a person has to provide his email address to receive opt-in emails, this
    format is considered a seamless rather than an interruptive experience. There
    are three key types of opt-in emails:


    **Transactional Email:** Transactional emails are sent after a person takes an
    action, such as placing an order or subscribing to a newsletter. These emails,
    which are expected by the recipients, are often a great place to deliver personalized
    content to drive upsells or deeper engagement. For example, using everything you
    know about a shopper’s preferences, you can recommend products she may like after
    she has purchased a pair of shoes.


    **Triggered Email:** While less expected than transactional emails, triggered
    emails can be considered seamless experiences as well. As we described in Chapter
    3, triggered emails are often used to remind shoppers of abandoned carts, but
    they can also be used to encourage shoppers to purchase products they were highly'
  merge: -1
  img_proc: true
