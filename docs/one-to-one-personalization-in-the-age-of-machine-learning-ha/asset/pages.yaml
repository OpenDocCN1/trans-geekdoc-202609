    Netflix. We want to make Netflix so engaging you keep choosing it.⁴⁹


    Rather than simply depending on users to search for specific content or listing
    all available content in alphabetical order, Netflix offers specific recommendations
    across its platform to each user based on his or her individual preferences. This
    level of personalization starts with a deep understanding of its users and their
    preferences. Recommendations are generated using a collaborative filtering algorithm,
    which shows users content they are most likely to be interested in based on their
    individual viewing behavior and how that behavior compares to viewers with similar
    behaviors. The algorithm also incorporates variations to show users that there
    are other genres available that they may not have been exposed to before. The
    algorithm learns more about the users from how they interact with those variants—whether
    they engage with them or not—to determine viewers’ interest in those genres (this
    aspect of machine learning is called “self-learning”). Additionally, Netflix’s
    algorithmically generated search results consider an individual’s preferences
    and the popularity of the content. Finally, Netflix is always testing the user
    interface and the functionality of its platform to drive continued improvements
    to the overall experience.⁵⁰


    Personalization stories like Netflix’s make clear that Peppers and Rogers’ vision
    is now possible. Its approach has enabled the company to capture the mindshare
    and wallet share of nearly 150 million'
