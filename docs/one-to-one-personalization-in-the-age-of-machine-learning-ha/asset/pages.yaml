    to the areas a person is driving through? These imaginings don’t fall that far
    outside the realm of possibility.


    Of course, we are not likely to encounter some of these predictions in the immediate
    future. While consumers are typically comfortable allowing their devices to collect
    data on them to improve their experiences with the devices themselves, it is unlikely
    that they will be comfortable with those devices sharing that data with other
    companies for advertising purposes. But there are so many different channels capturing
    data today, and technology is improving at such a rapid rate, that it is not unrealistic
    to think that one day the world we interact with will be completely personalized.


    # THE FUTURE OF B2B


    When B2B products and services are sold through a salesperson, the sales process
    can be easy to personalize: the sales rep can leverage all he or she knows about
    the prospect to guide conversations and provide personalized recommendations.
    And, of course, sales teams can leverage digital data on these prospects to further
    individualize the interactions (as we described in Chapter 3).'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'But not all B2B sales interactions occur between a customer and a salesperson.
    Some B2B products and services are sold online. And even for products that are
    not sold online, today’s B2B buyers conduct substantial research before reaching
    out to the company to see a demo or to speak to a salesperson. B2B marketers,
    therefore, need to provide the best experiences possible in the digital world.


    B2B marketers have traditionally been slower to adopt digital personalization
    than their B2C counterparts. But they are catching up! B2B marketers are exploring
    digital tactics that have been employed primarily by B2C marketers—particularly
    machine-learning personalization—but in a way that is uniquely theirs. B2B marketers
    already understand that their buyers are consumers, too. and they recognize that
    consumer expectations are being set by the Netflixes of the world. Generally content-marketing-focused
    versus ecommerce-driven, B2B companies understand the value of engaging their
    prospects with personalized content. They also recognize that buying decisions
    are most often made at the account, rather than the individual, level. The future
    of B2B marketing and personalization will rely on data to better understand accounts
    and the individuals within them to provide more relevant experiences.


    # INBOUND MARKETING


    Personalization can play a key role in converting more visitors to leads on a
    B2B website. This applies to organizations employing an inbound marketing strategy,
    which is the practice of attracting and engaging audiences on the basis of search-optimized
    content and online ads—and then capturing their contact information in exchange
    for premium content assets like eBooks and webinars, product demonstrations or
    free trials. Such contact information is used for ongoing nurture marketing and/or
    passed on to the sales team for pursuit. With this approach, personalization is
    used to provide the most relevant content and experiences to prospects to'
  merge: -1
  img_proc: true
- pgno: 216
  md: 'ensure that they do, in fact, find enough value that they “convert” and provide
    their contact information.


    # ACCOUNT-BASED MARKETING (ABM)


    While inbound marketing remains valuable for many companies, the future of B2B
    marketing for others is in account-based marketing (ABM). With ABM, a marketer’s
    focus is on engaging individuals within target accounts, industries or sub-industries.
    Marketers that adopt a pure ABM strategy often have a product with a higher selling
    price, a longer sales cycle, and a narrower applicability to certain companies.
    As opposed to a pure inbound marketing strategy, which is ideal for an inside
    sales team or an e-commerce approach, ABM strategies are generally preferred by
    field sales-focused organizations. Many companies adopt a mix of both inbound
    and ABM strategies, falling somewhere in between the two ends of the spectrum.
    They may use inbound marketing to capture leads for smaller deals while targeting
    larger accounts using ABM techniques.


    ABM will be implemented more and more by marketers when it makes sense to do so—predominantly
    by those who are focused on reaching target accounts in the digital world (and
    ensuring that each account receives relevant content and messages that catch their
    attention). Thus, the future of B2B personalization will be in finding the right
    data sources and the right tactics to understand and reach these target accounts
    in a scalable way.


    # UNGATED CONTENT


    In recent years, in light of a glut of B2B company-supplied content, prospects
    have become more reluctant to provide their contact details early in their research
    efforts. As such, more and more companies, especially those pursuing an ABM strategy,
    have adopted a'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'practice of “ungating” their content to drive greater awareness for their company’s
    brand and adjust to the changing B2B buyer behavior.


    Once barriers to content consumption are removed, prospects can quickly and easily
    navigate through a company’s content library to find answers to their questions
    and learn more about the company’s products or services. They no longer need to
    assess whether they will receive enough value from the content to justify giving
    up their contact information. This is objectively a better experience.


    However, it presents a challenge for demand generation marketers who are tasked
    with generating leads. How do you capture leads to pass to the sales team if you
    don’t require contact information? After relying on gated content to fuel their
    demand gen programs for the last decade or more, they need to figure out what
    comes next. For tech-savvy organizations, particularly those with a best-in-breed
    personalization solution, the answer is in remembering return visitors and tracking
    people without required form fills each time.


    For those now relying on an ABM strategy, the effects of ungating may be limited.
    These companies do not need to capture the contact information of everyone who
    visits their sites—just those visitors from target accounts.


    Even those who continue to operate traditional inbound marketing strategies may
    not notice a dramatic impact due to the decreasing quality of their lead data
    in recent years. Within our own data at Evergage before we ungated our content,
    a quarter of leads who filled out eBook forms were classified as “bad data” (meaning
    25% of those who completed a form did so with fake or inaccurate information).
    Another 30% of leads were classified as “not a fit”—they didn’t meet our qualification
    criteria to pursue. In addition, a large number of leads were “not interested,”
    “unresponsive,” or fell into other buckets that indicated they weren’t good'
  merge: -1
  img_proc: true
- pgno: 218
  md: 'leads. It no longer made sense to require downloaders to fill out a form to
    access our content if we did not find the information valuable or usable.


    Going forward, demand gen marketers will need to identify other ways to drive
    leads into the funnel, including how to identify visitors on the site when they
    can''t fill out endless forms—potentially making use of some of the technology
    we have described in this book.


    # THIRD-PARTY INTENT DATA


    One challenge facing both inbound and account-based marketing teams is that there
    is a lot of trial and error involved in the process. Which leads generated from
    inbound marketing efforts are valuable and worth further investment? Which tactics
    produce the best leads? Which accounts are worth dedicating time and budget to
    with account-based marketing tactics? Typically, answering these questions involves
    testing different approaches to find the optimal strategies.


    An emerging category of vendors for B2B marketers are those providing “third-party
    intent” data (also called “B2B buyer intent data”).⁶⁸ This refers to information
    on accounts and even individuals that, based on their behavior on the web (site/pages
    visited, content downloaded, ads engaged with, etc.), are found to be demonstrating
    interest in certain topics or solution areas which could indicate a potential
    fit for a company’s products or services. Many of these vendors also provide sales
    intelligence capabilities that leverage predictive modeling to analyze a company’s
    historical lead and opportunity data in order to identify and score prospects
    to identify ideal customers.⁶⁹ This approach takes some of the guesswork out of
    lead scoring and improves segmentation, targeting and sales follow-up.


    In the future, this predictive style of B2B marketing will become more popular
    and will require more data-driven marketing'
  merge: -1
  img_proc: true
- pgno: 219
  md: 'professionals to manage it. This is also where a CDP will be valuable. These
    marketers will be responsible for identifying, integrating and managing all the
    data sources needed to run successful lead generation and account-based marketing
    programs. They will also leverage AI technologies to pull actionable insights
    from that data and execute more effective cross-channel personalization.


    # DEMAND UNITS


    As they become more advanced in their targeting, B2B marketers will evolve beyond
    targeting accounts to targeting demand units. SiriusDecisions defines the demand
    unit as the group within the account specifically tasked with addressing a need.
    SiriusDecisions says that the “buyer, needs and solution must match for a demand
    unit to exist.” Essentially, ABM is not just about targeting companies that fit
    the profile your team has defined; it is about finding those companies that have
    also identified that they have “pain” around what your product or solution addresses.
    Recognizing those companies online requires much more precise targeting and must
    leverage first-party and third-party intent monitoring, advanced segmentation
    and more.


    To achieve success in the future, B2B marketers must become experts not only in
    their buyers’ pain points, but also in how to leverage data and technology to
    recognize which buying groups within accounts are actually experiencing those
    pain points and researching solutions to address them right now.


    # THE FUTURE OF ENGAGEMENT


    In the near future, personalization will move beyond just selecting the most relevant
    experience for each person within each channel, to'
  merge: -1
  img_proc: true
- pgno: 220
  md: 'picking the _best channel_ to engage each person in the first place. Will each
    of your SaaS customers be more likely to react to your announcement of a new feature
    if you communicate it via email, push notification, text message or in-app message?
    Will each shopper respond to your requests to take a survey via an infobar on
    your site or an ad on Facebook? These are the questions that marketers have today,
    and the technology will certainly exist in the future to answer them.


    We’re not big fans of the phrase “right message, right place, right time” because
    it’s become a marketing cliché—and we believe no technology has been able to truly
    deliver on the “right place” aspect of this promise to date. But that will soon
    change, as the most innovative machine learning-driven personalization technologies
    will be able to understand each person’s levels of engagement with each channel
    over time and use that knowledge to predict their likelihood to engage with particular
    messages in those channels.


    Only when this is possible will we be able to fully deliver on the “right message,
    right place, right time” promise.


    # THE FUTURE OF THE TECHNOLOGY LANDSCAPE


    Selecting the best mix of technologies to execute a marketing strategy has never
    been more difficult. (Recall that in Chapter 6, we noted that the number of martech
    solutions has surpassed 7,000.) As marketers attempt to bring together more data
    sources to reach more consumers and business buyers across multiple channels,
    they are going to become frustrated by the siloed nature of these technologies.
    We will see a trend of marketers looking to do more with fewer solutions (i.e.,
    choosing fully featured platforms over one-off point solutions). The martech industry
    will likely respond to these'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'pressures with continued product development investments and more mergers and
    acquisitions.


    Of course, there will never be a single solution that marketers can use to address
    all of their needs and drive all of their activities. Many solutions, such as
    CRM and email marketing platforms, are deeply ingrained in the daily workflows
    of marketing teams. But we are starting to see the customer data platform emerge
    as the latest cornerstone martech solution (particularly because it collects and
    stores a massive amount of digital data, interprets it and makes it available
    for use across channels and other systems). Every new technology a company adopts
    must easily and seamlessly integrate with the many other martech products that
    exist and that will continue to be adopted. In short, to create a seamless customer
    experience, no piece of technology can be an island.


    # THE FUTURE OF PRIVACY


    Given all that we have described about the future of personalization, we also
    need to talk about privacy. Since the early days of digital personalization, the
    marketing world has been rightly concerned about the proper and ethical use of
    customer and prospect data. Privacy concerns have grown in recent years as laws
    and regulations have been enacted to protect consumers'' personal information.
    The most notable of these is the European Union''s General Data Protection Regulation
    (GDPR), enacted in 2018, that gives EU citizens the right to control how they
    are tracked online—whether the company they interact with is based inside the
    EU or not. The US state of California passed a similar version of the regulation
    shortly after GDPR went into effect.7


    While privacy should have always been a top priority for marketers, laws like
    these are requiring marketers to take privacy very seriously.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'But prioritizing privacy doesn''t mean avoiding personalization. Today, consumers
    recognize that brands are collecting their information. They are generally comfortable
    with this arrangement, particularly when they believe that they are also benefiting.
    In a study by Microsoft, 54% of respondents indicated that they “expect brands
    to really know and understand them as people, and for communications to be tailored
    to their values and preferences.”72 To enjoy this level of personalization, they
    recognize that they need to share their data. But they also want brands to be
    transparent about data collection. The study found that 83% of consumers expect
    brands and advertisers to ask for their permission before they use their digital
    information.73


    In another study by Magnetic, 60% of respondents were comfortable with having
    their shopping interests and behaviors used by retailers to expedite their shopping
    experiences on the site, while 58% believed that the data would provide them with
    a better overall experience.74 Thus, a good rule of thumb is that if consumer
    data is being sold or will be used in unexpected ways, consumers want the ability
    to provide consent. At the same time, they’re generally comfortable with a company
    using their data to provide a better experience with that company.


    The best approach to providing personalization to your customers, prospects or
    shoppers is to focus on improving the individual’s overall experience. We always
    caution that it is not a good idea to personalize simply for the sake of personalization.
    Reminding someone that you know his name, location and past purchases across channels
    without providing any value can certainly come across as “creepy.” What is most
    important—both because it is the right thing to do and because it is best for
    your business in the long run—is that you add value for each visitor and customer.
    You always want to be looking to use your customers’ data to genuinely help them.
    And, of course, you should always obey the law.


    Outside of legal requirements, what is appropriate will vary greatly'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'from industry to industry and from business to business. For example, a fashion
    retailer can provide a valuable experience to its loyal shoppers with obvious
    personalization. Shoppers in the loyalty program could be greeted by name across
    the site and given access to a personalized boutique with products relevant to
    their stated or inferred preferences. But that type of obvious personalization
    might not be appropriate for a financial services site, for example. In that case,
    the site should subtly surface content based on a visitor''s lifecycle stage or
    past behavior. The person will probably not recognize that any personalization
    is taking place, but should be able to find helpful content more quickly and easily.


    In the future, as marketers seamlessly blend subtle personalization with intentional
    customization, consumer control will play a greater role in personalized experiences.
    For example, today Amazon provides the ability to remove purchases from data used
    to determine recommendations across the site. Going forward, more and more both
    B2B and B2C companies will offer individuals the opportunity to control which
    aspects of their profile will and won''t be used for a better experience. While
    the purpose of personalization is to provide more relevant experiences to individuals
    without requiring them to take any action, as personalization evolves, it will
    be more of a partnership between companies and consumers.


    # THE FUTURE OF MACHINE LEARNING


    In Chapter 2, we discussed machine-learning algorithms and how they power personalized
    experiences. We described that the way to customize your own algorithms is to
    start with one or more base algorithms and then layer in filters, boosters and
    variations to make them work for your organization and current needs. This is
    a great way for marketers or other business users without data science experience
    to control their own machine-learning algorithms.'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'In the future, we expect an evolution in the way marketers leverage machine
    learning. There are two main types of machine learning: traditional machine learning
    and deep learning. Traditional machine learning allows you to train an algorithm
    with labeled or structured data to learn and react in a certain way. When you
    have a specific problem you would like to solve or a question you would like to
    answer, you feed data to a machine-learning algorithm to help it learn how to
    solve that problem. Most of what we have described in this book is traditional
    machine learning.


    Deep learning, on the other hand, is much more complicated. It leverages what
    is essentially a group of algorithms, called artificial neural networks, that
    attempt to solve problems as a human would. One of the most common examples of
    deep learning is facial recognition. The ability to analyze and recognize a face
    is complex, and a human cannot explain to a machine which elements of the face
    are important. There are a number of different problems to solve before an algorithm
    can identify a face. At the most basic level, it needs to be able to identify
    which part of a photo contains a face, pull out relevant facial features and match
    them to a network of other faces. Deep learning is required to solve this problem.


    Going forward, deep learning that emulates the way humans interact with other
    humans will increasingly be used in digital personalization. The specifics of
    what that looks like remain to be seen, but we’re looking forward to witnessing
    the evolution of machine learning in customer experiences!


    Another development we anticipate is that machine learning personalization will
    have a significant impact on the needs and functions of content management systems
    (CMSs). Today, organizations typically design and deploy their website pages via
    a CMS. Sometimes, they will use rule-based personalization (leveraging features
    of the CMS or a separate personalization solution) to modify those pages for certain
    audiences. But imagine a world where each page of the website is dynamically created
    for each visitor, personalized to his or'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'her preferences, in real time. In that world, driven by machine learning, the
    personalization engine would be used to present a different version of the website
    to each person, and the CMS would be used largely for the storage of content and
    images. It may seem a little futuristic, but this type of full-site, completely
    dynamic personalization is where we''re headed.


    # MACHINE LEARNING–TAKING PERSONALIZATION TO THE NEXT LEVEL


    Personalization sure has come a long way since the 1990s. Here''s a quick recap
    of the major developments:


    **Surface-level to in-depth data:** The data we can leverage for personalization
    has evolved dramatically over the decades. In the past, the best data we had available
    for web personalization was what a person had clicked on. Today, you can monitor
    a person''s level of engagement with each page, compare it to his level of engagement
    across other pages, and leverage the context of the page itself to uncover his
    preferences, affinities and intent on your site. You can also combine behavioral
    data with data from a multitude of other sources within a CDP to build a complete
    picture of individuals and accounts.


    **Segment-based to true one-to-one targeting:** The in-depth data required of
    true one-to-one, personalized communication is critical for powering machine learning.
    With machine learning, you can synthesize all the information you have available
    to identify the best, most relevant experience for each individual in a scalable
    way. While segment-based communication'
  merge: -1
  img_proc: true
- pgno: 226
  md: '(the only type of web personalization Peppers and Rogers highlighted) continues
    to provide value, the future is in machine learning.


    “Next time” to “real-time” decisioning: Advancements in data processing have dramatically
    improved personalization, allowing personalization engines to collect data in
    the moment, combine it with historical data, and deliver the most relevant experiences
    in real time. The possibility was beyond Peppers and Rogers’ imagination in the
    mid-1990s, and it is still something that marketers struggle with today. But the
    importance of delivering personalization in real time cannot be overstated. In
    today’s fast-moving world, waiting for someone to engage with your brand at a
    later date is a risk that most marketers should not be willing to take.


    Siloed channels to integrated experiences: When developing personalization plans,
    it is easy for marketers to view each of their channels in isolation or even to
    view various pages of their websites as separate from the overall site experience.
    But today we have the ability to be more intentional with our personalization
    strategies. We can create integrated experiences that show customers that we know
    them as individuals across channels and contexts. It is more than adding an infobar
    to a mobile app or a row of product recommendations on a site’s homepage. These
    are just pieces of a broader strategy. When Peppers and Rogers explained personalizing
    a CTA button for a chat room in 1994, they certainly did not have these kinds
    of integrated experiences in mind: the technology to implement a complete cross-channel
    personalization strategy at the one-to-one level did not exist.'
  merge: -1
  img_proc: true
- pgno: 227
  md: 'It should be obvious at this point that the future of one-to-one personalization
    rests with machine learning. Machine learning has transformed the way marketers
    can interact with their shoppers, prospects and customers. Technology has evolved
    to allow marketers to collect and act on vast amounts of customer data in a scalable
    way to create tailored experiences for individuals and companies across channels.


    It should also be clear from this book that we''re headed in the direction of
    increasing personalization. This is not just because we can provide personalized
    experiences. It is because we must provide those experiences. Think about the
    number of messages competing for your attention every day. You probably get more
    emails than you would ever care to read. You hear and see ads everywhere. You
    can''t keep up with all the different TV shows you could possibly watch. When
    you search for something on the web, you could never sift through every result.
    Now more than ever, marketers have to surface information relevant to the individual
    if they want to catch and keep the attention of both consumers and business buyers.


    As a consumer yourself, think about the types of experiences you would like to
    have. When you find yourself on a website you''ve never visited before, how can
    that site capture your attention and prove that it''s relevant to you? When you
    receive emails in your inbox, what would pique your interest enough to want to
    open them and click through? Which online ads would truly capture your attention?
    What would show you that a company you''re loyal to knows you and appreciates
    your business?


    Now think about how you can apply this perspective to your job as a marketer.
    How can you show your shoppers, visitors, prospects or customers that you truly
    know them, or that a particular product or service is right for them? How can
    you cut through all'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'the noise in the market to deliver unique experiences that speak to each individual?


    These are the questions that marketers will be asking themselves for years to
    come. The future of marketing is personalized. It is up to you, right now, to
    make sure that the future of your company''s communications is personalized too.'
  merge: -1
  img_proc: true
