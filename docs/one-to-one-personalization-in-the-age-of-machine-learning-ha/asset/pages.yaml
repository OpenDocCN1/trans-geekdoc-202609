    # TRIGGERED EMAILS


    While open-time email personalization ensures your emails are relevant when recipients
    are ready to engage with them, triggered emails enable you to proactively send
    relevant messages at the most opportune moments. Typically, marketers send “batch
    and blast” emails, which are sent to large lists of recipients at regular times
    (such as monthly, weekly or even daily). Some marketers, particularly in B2B businesses,
    send automated “nurture” email sequences to specific groups of opt-in recipients
    with similar characteristics (e.g., job role,'
  merge: -1
