    # CONVINCING YOUR ORGANIZATION TO INVEST IN PERSONALIZATION


    Before we conclude, let’s take a brief step back. This chapter has explored how
    to establish the processes and strategy to effectively deliver personalization
    in your organization. But what if you can’t get your organization to agree to
    prioritizing personalization in the first place?


    Depending on your role in your organization, you could be facing objections from
    executive leadership, IT or other members of the marketing team, or all of the
    above. The main objections we hear from those in leadership positions include:


    > I don’t see the value.


    As with all new investments, you may need to convince senior leadership of the
    value of personalization. In many cases, though, this will not be necessary. Personalization
    is a common buzzword in the world of marketing, and many leaders are already familiar
    enough with it to understand the value it can bring to their customers and their
    organization.


    But if it is necessary, we hope that after getting this far in the'
