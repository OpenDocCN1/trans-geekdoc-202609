    to share some of that knowledge with your leadership team. It also helps to think
    about the main use cases you have in mind for personalization in your own channels
    and to share those ideas with your leadership team. Think about the impact you
    expect those initiatives will achieve, and quantify it for the team. If you think
    that you could increase your conversion rate, for example, by how much do you
    expect it to increase? What does that mean for your bottom line? For most marketers
    we have spoken to, even modest increases in conversion rate, retention, sign-up,
    upsells, page views, and average order value, etc., can have a substantial impact.
    Be sure to take advantage of tools available to compute the ROI of investments
    in personalization.


    Additionally, the competitive advantage can’t be ignored. Given the history and
    growth of one-to-one communication over the last 20 years, it’s clear that as
    a society we’re headed toward more personalization, not less. The ability to provide
    personalized experiences is often a competitive advantage—for now. In the future,
    a personalized approach will be critical to any business’ success. Explaining
    to your leadership team that it is important to get started now will make a difference.


    # We don’t have the budget.


    No matter how you go about delivering personalization, you will require a budget.
    The tactics you take will vary dramatically depending on your organization. The
    best advice we can give is that, in addition to quantifying the expected impact
    to your KPIs, you should do the math to identify the ROI you would receive. That
    means determining how much you plan to spend on personalization in a year and
    weighing that against the expected (positive) impact to your business. We have
    found that the right technology can pay for itself in spades with the improvements
    gained.'
