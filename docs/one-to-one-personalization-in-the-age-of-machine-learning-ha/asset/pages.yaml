- pgno: 172
  md: '# IDENTIFYING THE RIGHT CAMPAIGNS


    What is a campaign, precisely? Every personalization tactic you launch can be
    identified as a “campaign.” For example, if you place “Complete the Look” recommendations
    on your product detail pages, you may call that a “Complete the Look Recommendations
    Campaign.” Any homepage experience you use to target different industries or consumer
    segments you may call your “Homepage Hero Campaign.” A triggered email sequence
    with relevant open-time email would be called a “Re-engagement Campaign.” You
    would build and publish each of these campaigns in your personalization platform,
    which we will address in the next chapter.


    When planning campaigns, the trouble is often deciding where to start. Even with
    the most robust strategy in place—and even after you have several successful campaigns
    under your belt—it is not always easy to select priorities among all of your campaign
    concepts. These steps may help:


    # 1. IDENTIFY CAMPAIGNS


    Begin by thinking about what you could do to address each of the main goals in
    your strategy. For example, to grow average order size, you .may want to test
    recommendations on your cart page to pair with the items the shopper has in his
    cart. You could also suggest additional items the shopper can purchase that will
    allow him to qualify for free shipping. Or, to reduce bounce rate, you could create
    several different campaigns relevant to each visitor’s referral source or location.


    Continue to brainstorm tactics with your team to address all of your key goals
    and challenges. List out all of the tactics you can think of to address each goal,
    and indicate the channels and timing of these'
  merge: -1
  img_proc: true
- pgno: 173
  md: 'campaigns along with the metric(s) you''ll need to measure their effectiveness.


    # ## 2. PRIORITIZE CAMPAIGNS


    Next, you''ll want to establish a mechanism to help you prioritize your campaigns.
    We recommend something similar to the following image to weigh the anticipated
    impact against the expected level of difficulty to implement. This approach will
    help you determine which potential initiative will best advance your goals (without
    stretching your budget or team too thin). Particularly when you''re just getting
    started with personalization, you should think about casting a wide net with your
    campaigns in terms of audience. Beginning with campaigns that will only reach
    ten people on your site is not the best use of your time. Comparing level of impact
    with expected level of difficulty can help you uncover that kind of high-labor,
    low-impact endeavor quickly.


    If an idea is undemanding but high-impact, it''s a no-brainer. Implement those
    campaigns immediately. Most likely, however, you''ll end up with a chart slightly
    more complicated than that. Regardless, sketching out your concepts as above is
    a good way to begin to prioritize your initiatives.


    # ## 3. TEST AND ITERATE


    As with all of your marketing tactics, you should regularly test and iterate on
    your personalization campaigns. After you launch a new campaign, test it against
    a control to ensure that it provides a lift versus a non-personalized experience.
    Get into the habit of striving for continuous improvement—much like agile software'
  merge: -1
  img_proc: true
