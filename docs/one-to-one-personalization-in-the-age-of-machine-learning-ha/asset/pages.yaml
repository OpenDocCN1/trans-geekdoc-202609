    # CARS


    We all know that we interact with a number of screens (mobile phones, laptops,
    smart watches, etc.) every day. But one screen you may not think about is located
    in your car.


    Most new cars sold today have some sort of screen in the dashboard, and some even
    have “heads up displays” that the driver can see directly ahead of her. With all
    the time commuters spend in the car every day, the car screen holds immense potential
    for marketers.


    Car manufacturers and the big tech players are still working out who owns these
    screens. Apple CarPlay and Android Auto already exist to bring vehicles into the
    Apple and Google ecosystems, but some car manufacturers are trying to retain control
    over the screen by introducing their own cloud platforms.⁶⁵ This struggle over
    the car screen will certainly continue over the next few years, and the'
