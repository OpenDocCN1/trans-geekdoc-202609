    # EMAIL


    Email undoubtedly remains a critical communication channel—one used by nearly
    all businesses today. When thinking about email, it’s always important to consider
    just how many emails your recipients receive each day. The Radicati Group estimates
    that in 2019, the total number of emails sent and received a day will reach 293
    billion. That number is expected to reach 347 billion by the end of 2023.³⁵ Cutting
    through that noise is absolutely critical for all businesses, and ensuring that
    each of your emails is relevant to every individual you reach is a great place
    to start. You don’t want to be tuned out.


    Many marketers already leverage personalization in their emails to some degree.
    In fact, email is the most personalized channel. Yet the majority of those marketers
    are simply incorporating a recipient’s first name or company name, or relying
    on basic segmentation to personalize their emails.³⁶ Those tactics are only the
    start. Let’s take some time to explore more advanced ways to personalize an email.


    # "OPEN-TIME" EMAIL PERSONALIZATION


    In order to ensure that the content of your emails is relevant to an individual,
    you need to consider all you know about that person across channels, particularly
    in terms of individual behavior, history and preferences. That can be accomplished
    by leveraging the same rules and algorithms we described in Chapter 2.


    But what is relevant to a person at one moment may be obsolete'
  merge: -1
