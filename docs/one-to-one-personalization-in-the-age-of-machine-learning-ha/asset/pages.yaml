  md: 'campaigns with an incomplete understanding or your visitors and customers.


    # How do you determine an individual’s affinities and in-the-moment intent?


    An effective and maximally relevant one-to-one experience requires knowing what
    a person likes and what he is looking for right now. Getting to that level of
    understanding requires machine learning to analyze large data sets to garner insights.
    If a vendor is not able to answer how these insights are gleaned with its solution,
    you should be cautious about trusting the accuracy of the resulting personalization.


    # What does machine learning look like in your platform?


    Given the importance of machine learning for one-to-one personalization, you need
    to understand a vendor’s machine-learning capabilities from the beginning. Does
    the vendor’s platform allow you to create smarter segments with automatic clustering
    (as described in Chapter 2)? Is it capable of applying machine learning to do
    affinity modeling to determine a person’s true preferences and intent, and predictive
    modeling to determine a person’s future actions (as explained in Chapter 4)? Can
    the vendor’s platform use machine learning for alerting, troubleshooting, and
    problem and opportunity identification (as described in Chapter 6)? Most importantly,
    can you customize your machine-learning algorithms to deliver one-to-one communication
    across channels? And can you leverage these algorithms to deliver more than just
    product or content recommendations, but also brands, categories, promotions, search
    results, sorted lists and dynamic navigation?


    If any of these areas are important to your personalization strategy, be sure
    to select a vendor that will help you execute them.'
