    # THE FUTURE OF B2C


    There are a few trends facing B2C marketing that will guide personalization in
    the future. First, ask any B2C marketer and he or she will tell you that competition
    for consumer attention is fierce. The internet has lowered the barriers to reaching
    an audience: smaller businesses can easily reach their target consumers with fewer
    resources than larger companies, and anyone can be a content creator with their
    own blog, a video producer with their own channel on YouTube, or a'
  merge: -1
  img_proc: true
- pgno: 207
  md: 'retailer with their own shop on Etsy. As a result, B2C companies are increasingly
    finding that they need to differentiate based on their customer experiences, as
    Netflix has done.


    In the retail industry, this trend is compounded by the influx of retail store
    closings in recent years: 2017 saw retailers close 102 million square feet of
    store space, followed by 155 million square feet in 2018.51 That trend doesn’t
    appear to be slowing down any time soon. B2C companies with a physical presence
    will need to figure out how to innovate and personalize in the “brick-and-mortar”
    space. As they experiment with personalization in their digital channels, they
    will discover that personalization is the path to differentiation in their physical
    channels, too.


    Trends in other industries are advancing the need for personalization as well.
    Most financial institutions believe they are relationship-driven organizations,
    yet 79% of consumers consider their relationship with their bank to be transactional
    in nature.52 In travel, consumers are cost-conscious and not particularly loyal
    when it comes to booking trips; as a result, online travel agencies (OTAs) generally
    compete on the basis of price. The world of media and publishing is overloaded
    with content of all types, so the industry is struggling to provide any level
    of differentiation to effectively engage and retain their readers and viewers.
    Companies across these and other industries are finding that providing a personalized
    customer experience allows them to develop better relationships with, and thereby
    foster the loyalty of their customers.


    Additionally, as often happens in the world of technology, just when you think
    you have something figured out, the landscape changes. The ability to access the
    internet via personal computer was a game-changer for the marketing industry;
    businesses that do not have some kind of internet presence today are considered
    an anachronism. Mobile devices changed the game again more than a decade ago,
    and most marketers are still trying to work out how to creatively'
