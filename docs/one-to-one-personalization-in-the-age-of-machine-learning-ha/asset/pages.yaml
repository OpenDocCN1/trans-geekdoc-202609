    # CROSS-CHANNEL MATURITY CURVE


    What we have explained so far can seem overwhelming to some marketers, particularly
    those who are not using personalization at all or only using it in a single channel.
    As we explained earlier in this chapter, cross-channel marketing of any kind is
    difficult. Most marketers we speak to are not as advanced as they would like to
    be in their cross-channel personalization efforts. Typically, most strategies
    we''ve seen fall roughly at one of these stages: beginner, intermediate and advanced.


    Beginner: Marketers at this stage are typically only personalizing one digital
    channel (such as web, mobile app, email, ads or search). They have only one team
    involved in their personalization efforts, and their main challenges involve getting
    started, defining a strategy and working out a repeatable process.


    Intermediate A: The intermediate stage has two different paths. In the first path,
    marketers have progressed to personalize two or three digital channels. Their
    main challenge stems from the difficulties that arise from coordinating across
    multiple internal teams (we will cover some of these challenges in Chapter 7).


    Intermediate B: In the second intermediate path, marketers are personalizing in
    only one digital channel (as in the beginner stage),'
