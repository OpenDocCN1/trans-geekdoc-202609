- pgno: 170
  md: '# 5. What data sources do we need?


    At this point, you already understand how important data is to a successful personalization
    strategy. But many organizations have data siloed across teams and systems, so
    it can be a lengthy process to bring it all together. You will want to start thinking
    early on about the data you need to reach your goals so you will have all the
    data sources you need to be successful.


    Your data sources and your channels are inextricably linked, as well. Ideally,
    even channels you don’t plan to include in your personalization strategy will
    still be involved via the data they collect. You should aim to bring the data
    from each channel into one system (such as your customer data platform) so it
    can be used to build out each person’s unified customer profile. For example,
    even if you are planning to use personalization solely in your email campaigns
    and in-person channels, you should still aim to collect website and mobile app
    behaviors to help determine the most relevant experiences for each individual.


    # 6. What content and creative do we need?


    Much of the content you will need for personalization likely already exists in
    your organization. Still, it is important to think through this question early
    so you can start identifying any major gaps and planning on potential investments
    to address them. For example, if you want to create multiple homepage experiences
    for different audience segments, you will need to write new copy and design new
    images. Or, if you want to insert product recommendations on a page, you need
    to decide how many items to show and what “look and feel” to apply.'
  merge: -1
  img_proc: true
- pgno: 171
  md: '# 7. What skills do we need?


    You will not get very far with your personalization strategy if you do not have
    people on your team or as part of your PMO with the requisite skills to accomplish
    your aims. But it is highly likely that you have such people on your staff now.
    They’re doing web marketing, email marketing, product marketing, merchandising,
    and/or analytics already. If you use a personalization solution that doesn’t require
    coding or the involvement of large teams, you will dramatically increase the chance
    that you can leverage the skills and talents of your existing staff. (We’ll get
    more into the technology requirements in the next chapter.)


    If you’re starting small, you can probably rely on these existing staff members.
    But if you want to dive into a more advanced strategy right away—or if you’ve
    already tested personalization and want to do more—you may want to hire someone
    to lead your personalization efforts (full- or part-time). We predict that as
    more organizations make personalization a top priority, an increasing number of
    marketing teams will be looking to hire personalization specialists or directors
    of personalization to help them maximize the impact of these efforts.


    While an ideal candidate would have a background in personalization campaigns,
    experience with other digital marketing campaigns (such as conversion optimization
    or demand generation, depending on your industry) could provide a sufficient foundation
    as well. Innovative email marketers, website/online marketers and marketing analytics
    specialists also make great candidates.


    Once you have documented the answers to these questions—with input from all of
    your key stakeholders, of course—you should have a solid foundation for your personalization
    strategy.'
  merge: -1
