- pgno: 130
  md: '# CHAPTER 6 TESTING, ANALYTICS AND ROI


    Nearly every marketer, across industries, is faced with the challenge of juggling
    multiple priorities with limited resources. There is always more to do than seems
    possible. As a result, good marketing is a balancing act. Any decision a marketing
    team makes to pursue a particular strategy, tactic or campaign has to be weighed
    against other potential investments.


    At the same time, measuring the ROI of marketing activities isn’t always easy.
    Not every campaign or activity—such as the many tactics marketers use to influence
    “awareness” or to provide “market education”—can be cleanly tied back to a business
    metric. These activities are often critical to the overall business, but they
    can be tricky or impossible to measure. As a result, marketers don’t always know
    whether the choices they make have real impact.


    This measurement challenge also exists for marketing technology decisions. As
    a marketer, you want to invest in the tools that will be most effective for your
    organization. However, the range of marketing technology (“martech”) solutions
    on the market seems to grow by the minute. Scott Brinker’s yearly marketing technology
    graphic in 2019 included 7,040 solutions—up from 6,829 in 2018 and 3,874 in 2017.42
    Most marketers are using some combination of these 7,000-plus solutions—sometimes
    as many as 20 to 50—to accomplish their goals.43 No wonder Hubspot found that
    proving the ROI of marketing activities is the second greatest challenge facing
    marketers today (after generating traffic).44 When you stitch together a bunch
    of solutions to address a variety of needs, it can be nearly impossible to connect
    your efforts to your company’s bottom line or to assess the value'
