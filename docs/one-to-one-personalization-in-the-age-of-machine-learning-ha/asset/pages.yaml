    rates for highly trafficked pages. After you identify your challenges and goals,
    form some hypotheses about why something is the way it is so you can begin to
    find answers within the data. We know that you have a lot of data available to
    you, so this stage can be quite overwhelming. But this process can help you uncover
    endless opportunities for improvement through personalization.


    **What is actually possible:** At this point in the planning process, you and
