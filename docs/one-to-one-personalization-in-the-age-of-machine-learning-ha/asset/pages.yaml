  md: '# # CHAPTER 3 THINK BIGGER, THINK CROSS-CHANNEL


    Before you started reading this book, what would come to mind when you thought
    about personalization? For some marketers, personalization simply means including
    a name or company field in an email blast. For others, it means Amazon-style recommendations
    on a website. And for others still, it means presenting people with personalized
    messages or offers on select channels, such as a website or mobile app. Regardless
    of what your personalization strategy currently entails, it’s worth reviewing
    the scope of personalization opportunities across a variety of channels.


    Cross-channel marketing is a major challenge for marketers in all industries.
    It isn’t enough to master marketing communications through one channel if your
    current or prospective customers engage with you through many different channels.
    And for most companies, it’s pretty safe to assume that they are. By 2020, there
    will be four connected devices for every person in the world.28 By 2025, there
    will be 5 billion mobile internet users.29 And Forrester predicts that 58% of
    total US retail sales will be digitally impacted by 2022 (in other words, some
    part of the shopping journey for more than half of all retail sales will take
    place through a digital channel).30


    Of course, marketers already fundamentally understand the importance of cross-channel
    marketing. According to a Forrester report, 66% of marketers indicate that cross-channel
    marketing activities should be integrated.31 The problem is not that they don’t
    recognize the importance of this kind of marketing: the problem is in the execution.
    The same report found that only 5% of businesses'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'believe they''re truly organized to deliver great cross-channel experiences.³²


    Why the disconnect? We often see that budgets, skill sets and access to technology
    are spread across companies’ IT, marketing and other business groups. It’s difficult
    to create and measure the success of comprehensive campaigns across channels when
    the skill sets and technologies to do so are decentralized.


    There is even misalignment within marketing itself, both organizationally and
    technologically. Marketers in different disciplines (content marketing, digital
    marketing, product marketing, marketing operations, etc.) are often using a diverse
    set of customer analytics tools and other systems. Each of these systems has useful
    pieces of customer information and insight, but none has the whole picture.


    While these challenges make it difficult to execute generic marketing programs
    across channels, they only become more pronounced with personalization. After
    all, it’s virtually impossible to personalize an experience in a relevant way
    if you have five different profiles spread across five different systems for a
    single person. This inability to recognize and speak to a single person across
    channels is one of the biggest challenges marketers face in cross-channel personalization.


    Despite the challenges, in today’s multi-channel world, getting cross-channel
    customer experiences right is worth the effort. In this chapter, we’ll highlight
    the most important channels for personalization and address some of the challenges
    (and solutions) for executing it effectively across channels.


    # THE KEY CHANNELS TO PERSONALIZE


    Think about the ways in which you interact with companies as a'
