- pgno: 61
  md: 'to that same person later. And we all know that you have no control over how
    and when your email is opened and read. Once the email leaves your servers, the
    recipient chooses when to consume the information. He or she could open it within
    a minute, day or week from when it was sent.


    During this interval, circumstances can change. A recipient might have already
    viewed the content you sent, bought the product your email promotes, taken the
    action your email suggests, or changed his interests altogether. In order to be
    highly relevant to that recipient, the content of your email should be updated
    at open time.


    How does this work? Ordinarily, when an email is opened, the recipient’s email
    client (such as Microsoft Outlook or Gmail) sends a request to a server to provide
    any image(s) to display. If you are using open-time email personalization, the
    personalization platform would make a smart decision about what image(s) to show
    the moment the message is opened (or re-opened). This decision would be based
    on everything it knows about the recipient, taking into consideration all of that
    person’s up-to-the-minute behaviors across channels. The personalized content
    could be product recommendations, promotional offers, eBook or video suggestions,
    or simply informational messages.


    Let’s say, for example, that a retailer sends an email containing three product
    recommendations to a regular customer. Between the time the company sends the
    email and the moment the customer opens it, the customer has purchased Product
    1 via the mobile app, Product 2 went out of stock, and Product 3 dropped in price.
    When he opens the email, Products 1 and 2 would be substituted with different
    (but still relevant) recommendations, and Product 3’s price would be updated.


