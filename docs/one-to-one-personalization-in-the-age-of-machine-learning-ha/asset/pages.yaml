  md: 'menu, while personal and small business solutions were given a smaller corner
    of the navigation. The e-commerce team feared that small business visitors who
    came to the site may not notice that corner in the navigation and assume that
    Dyn was not a good fit for them.


    The team needed a way to show small businesses and consumers that Dyn was relevant
    to their needs, but not at the expense of the company''s enterprise business.
    Dyn used rule-based personalization to modify the site''s navigation menu in real
    time when a small business visitor landed on the site. The company created a segment
    of small business/consumer visitors based on particular referring URLs or originating
    referrer search terms, previous visits to specific product pages, and/or previously
    purchased products.


    When anyone from the small business/consumer segment is on the site, a simple
    rule dynamically modifies the site navigation to display a more relevant experience
    for that group. These visitors see a slimmed-down version of the menu, with small
    business/consumer products prominently displayed. All the enterprise links are
    still accessible to these visitors in a new tab in the navigation called “Enterprise.”
    Meanwhile, the original navigation is still shown to all other visitors who don’t
    fall into the small business/consumer segment.


    With this subtle personalization of the site navigation, Dyn experienced a 20%
    increase in average order value and a 7% increase in conversion rate for its e-commerce
    products—with no negative impact to its enterprise solutions.


    The Dyn case study is an example of a company significantly improving its average
    order value and conversion rate with a single personalization campaign. Remarkably,
    it was able to create this'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'experience using just one simple segment and one rule. The company’s modest
    campaign made a considerable difference.


    But let’s say it wanted to do more to personalize its navigation. Assume it wanted
    to highlight products that small business or enterprise visitors had engaged with
    most while on the site, and it wanted to order the content under the “Resources”
    tab to focus on the resources that a visitor had not yet viewed. This type of
    personalization is possible with rules, and the right personalization solution
    would make it possible to add, manage and prioritize rules to achieve this objective.


    But the more rules you add, the more complicated everything becomes. Personalizing
    at the individual level in just that small section of Dyn’s site would require
    several rules. To personalize the rest of the site, the company would need to
    set up and manage hundreds or even thousands of rules. That’s just not scalable.
    It’s easy to lose track of numerous campaigns running in parallel. If something
    breaks, troubleshooting becomes incredibly difficult and time-consuming—not to
    mention the effort required to build all of those rules and design the corresponding
    experiences.


    That said, under the right circumstances, the use of dynamic variables—a more
    scalable form of rule-based personalization—can help simplify certain rule-based
    campaigns. If Dyn had wanted to cater more to their enterprise prospects, for
    example, perhaps specifically targeting their top 150 strategic accounts as part
    of its ABM strategy, they could present them with a relevant, personalized welcome
    message and a call-to-action with dynamic variables. Instead of setting up 150
    individual campaigns with 150 rules, they could implement one campaign that filled
    in the name of the account as a variable.


    While rules are well-suited to the type of segment-based personalization that
    Dyn uses in its site navigation, this approach is far less suited to one-to-one
    personalization. That type of'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'personalization is much more achievable with machine-learning algorithms, which
    we’ll get to shortly.


    # PREDICTIVE SEGMENTS (AUTOMATIC CLUSTERING)


    As we mentioned at the beginning of this chapter and will describe in more depth
    in the next section, machine learning has revolutionized the way we deliver one-to-one
    personalization intelligently and at scale. Yet it is important to point out that
    machine learning is also revolutionizing the speed, scale and depth of data analysis
    to yield invaluable insights. For example, machine learning can be used to identify
    groups or clusters of visitors with similar behaviors and affinities (called “predictive
    segments” or “automatic clustering”). This algorithmic technique highlights the
    differences in conversion and behavioral statistics between clusters to enable
    more relevant insights and targeting—essentially allowing marketers to create
    smarter segments more quickly and easily.


    The application of machine learning offers two key benefits:


    # UNCOVERING AND ACTING ON DIFFERENCES BETWEEN SEGMENTS


    Machine learning can help you identify differences in behaviors among your existing
    segments that may not be easy to identify from a manual inspection of the data.
    For example, what are the key differences in behavior between a customer who churns
    versus one who stays? What are the attributes and behaviors of a high-value customer
    or prospect who converts versus low-value customers or prospects who don’t convert?
    With those insights, you can react more quickly to business trends and create
    new opportunities to advance your business.


    For example, you could create a “churn risk” segment or a “potential high-value
    customer” segment and include people who exhibit behaviors similar to customers
    who did churn in the first case or to'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'existing high-value customers in the second. Using these segments, you can
    then create appropriate personalized experiences through digital and physical
    channels to encourage high churn risks to stay and potential high-value customers
    to purchase.


    # DISCOVERING AND ACTING ON NEW SEGMENTS OF INTEREST


    When segmenting your visitors, customers, prospects or shoppers, the value of
    some segments is obvious. Yet there are likely other valuable audiences that are
    not obvious to you initially but become apparent in the data. You might find,
    for example, that prospects with an affinity for one category or product end up
    converting at a much higher rate than do others. Or you might discover that visitors
    who read case studies on your site tend to be further down the purchase funnel
    for your solution. Automatic clustering can yield these insights and identify
    groups whom you can then target with relevant, personalized experiences.


    Predictive segmentation enables you to identify valuable segments of which you
    might otherwise be unaware and to learn what makes those segments unique. After
    all, it doesn’t do you any good to create segments and target them with tailored
    experiences if you don’t know if those are the best segments to target. Without
    that knowledge, you must rely on your best guesses about which and how various
    audiences will respond. Machine learning can take the guesswork out of segmentation.


    # MACHINE-LEARNING PERSONALIZATION: REALIZING THE ONE-TO-ONE DREAM


    Now that we’ve described how rules can be used to target experiences to segments
    and how machine learning can be applied to segmentation, we can finally address
    how machine learning'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'makes the dream of one-to-one personalization a reality. But first, let’s put
    forth another important definition. **Machine-learning personalization** utilizes
    algorithms and predictive analytics to dynamically present the most relevant content
    or experience for each and every visitor and customer.


    Essentially, machine-learning personalization provides a highly scalable way to
    provide unique experiences to your visitors and customers—all the way down to
    the individual level. Anything from recommending products, categories, brands,
    articles, promotions and offers, to dynamically modifying site navigation, search
    results and list sorting is possible with machine learning.


    Popularized by household names like Amazon and Netflix, algorithms aren’t just
    for giant e-commerce companies. They can be utilized by marketers from companies
    of any size and in any industry. And while slightly more complex to understand
    than rules, algorithms can be created and managed by marketers or other business
    users with the right solution.


    Because one algorithm can do the work of thousands of rules, algorithms ultimately
    result in simpler deployments. So, if you wanted to personalize your site navigation
    to include the most relevant links for every visitor based on their behaviors
    and individual preferences—without building thousands of rules—you would use machine
    learning. Or in another example, if you wanted to send one batch email to the
    ten million customers in your loyalty program—yet still allow each email to contain
    relevant offers, content, and promotions—you would use machine learning.


    To begin, it helps to understand what makes up a machine-learning algorithm. Assuming
    you’re going to use a customizable algorithm—which you should—you would start
    by selecting one or more base algorithms. Apply filters to include or exclude
    specific variables. Add in boosters to account for individual preferences. Finally,
    determine whether you want to apply any variations. We’ll describe these elements
    of an algorithm in more depth below, using product or content recommendations
    for consistency.'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'But as we’ll elucidate through the rest of the book, algorithms can be used
    for far more than recommendations.


    # # BASE ALGORITHMS


    Base algorithms are the foundation for delivering recommendations and individualized
    experiences and engagement. When choosing a base algorithm, you have the opportunity
    to tell the machine where to begin for selecting items to recommend. There are
    basic algorithms with which you might already be familiar, and more sophisticated
    algorithms that leverage advanced machine-learning principles.


    # # BASIC ALGORITHMS


    Basic algorithms generally rely on specific criteria or the “wisdom of the crowd.”
    Some of the most common are:


    +   - **Trending:** Items are recommended based on what is most popular on the
    site during a specific time period.

    +   - **Recently Published:** Items are recommended based on what has recently
    been added to the site.

    +   - **Soon to Expire:** Recommended items are prioritized based on their upcoming
    expiration dates.

    +   - **Co-Browse:** Items are recommended based on what other people on the site
    have also viewed.

    +   - **Co-Buy:** Items are recommended based on what other people on the site
    have also purchased.'
  merge: -1
  img_proc: true
- pgno: 41
  md: 'Similar Items: Items are recommended based on similarity in product type or
    category.


    Different base algorithms are suited to different use cases. For example, a retailer
    may want to highlight trending or recently published items on the homepage, while
    promoting co-browse items on a product detail page (PDP)—or to do something else
    entirely. It all depends on the site’s goals.


    # ADVANCED ALGORITHMS


    Advanced algorithms are sophisticated and complex. While a basic algorithm would
    show Product X to everyone who looked at Product Y, for example, advanced algorithms
    predict the best experience for each individual, growing smarter over time as
    they have more data to leverage. Here are a few of the most common:


    Collaborative Filtering: Based on a visitor’s engagement with different items,
    he is grouped into a cluster of people with similar likes and dislikes. Items
    are then recommended by comparing him to others in his cluster. (Netflix, for
    example, uses this technique.)


    Random Forest (Decision Trees): Detects the best converting paths, actions and
    content for influencing an individual’s journey toward conversion. The algorithm
    then uses those paths to show him the correct right next step at the right time.


    Contextual Bandit: Using explicit, known visitor data, this algorithm selects
    the best converting offers and promotions even before a user demonstrates interest
    through behavior. (We’ll'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'describe this algorithm in more detail in Chapter 6 when we discuss testing.)


    **Text Analysis:** Utilizing Natural Language Processing (NLP), this algorithm
    determines the strongest keywords within the text-based content a visitor consumes
    and uses that language to affect a personalized experience.


    A discussion of precisely how these algorithms operate is outside the scope of
    this book, but with the right solution, marketers can test and implement algorithms
    like these on their own. And the right approach, as we’ll discuss, is often to
    combine multiple algorithms to form a custom, hybrid algorithm for a particular
    use case.


    # FILTERS


    Many marketers are uncomfortable with the idea of handing over their digital experiences
    to a machine, and that is completely understandable. You likely know your products,
    content and categories well, and it can be unsettling to cede control of something
    so important. But you should never relinquish complete control. Choosing filters
    and other variables enables you to stay in charge.


    After you’ve picked one or more base algorithms, you can customize them by including
    or excluding certain criteria using filters. Filters allow you to exercise control
    over the categories, brands, price ranges, locations and other attributes that
    are shown in your recommendations. In other words, you can add human guidance
    to your machine-learning-driven experiences.


    There are many reasons to use filters. One reason is to use your knowledge of
    your business and products or content to deliver'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'more helpful recommendations. For example, a retailer may want to use the recommendations
    on its product detail pages (PDPs) to help shoppers find other products in the
    same category. On a clothing site, for instance, the retailer may want shoppers
    browsing shoes to see recommendations only for other shoes. In that case, the
    retailer would apply a filter to *include* just that one category. Other retailers
    may decide to use PDP recommendations to drive upsells, such as recommending jewelry
    and other accessories to “complete the look” while a shopper is viewing a dress.
    In this case, the filter would *exclude* the category of the product being shown.


    A B2B site focused on demand generation can leverage filters as well. Most demand
    generation sites have a lot of content assets, as well as many web pages across
    the site where they can recommend that content. On a web page that explains how
    the company serves the financial services industry, the marketing team can choose
    to include content (eBooks, case studies, blog posts, etc.) in the financial services
    category only. Or, assume the same B2B site has a thank you page after a prospect
    has registered for a webinar. The site’s marketing team may want to feature a
    few relevant content assets for her to read after registering—to keep her engaged
    on the site rather than reach a dead-end page. The team may want to *exclude*
    webinars as a content type for that page (since she is already currently registered
    for one), and instead feature other asset types that she can peruse immediately.


    You can also use filters to apply restrictions for business reasons. For example,
    a retailer may wish to exclude Brand A from the product pages of its rival, Brand
    B, due to the request of the manufacturer. In that case, products from Brand B
    will not be shown in recommendations on product pages for Brand A, or vice versa.
    A B2B site focused on demand generation may want to only include content recommendations
    for a specific topic or keyword in a few select areas of the site to align with
    company'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'goals or marketing calendar. In that case, only content around a certain topic
    would be promoted at a certain time.


    # BOOSTERS


    Next, boosting allows you to incorporate and prioritize the specific preferences
    in brand, category, price range, color, gender, content type, keyword, etc. of
    each individual on your site. These preferences can be determined with deep behavioral
    tracking on each individual—incorporating not just what a visitor clicks on, but
    also mouse movement, scrolling, inactivity and time spent per page—combined with
    all the other customer data you have available to give a clear indication of preference
    and level of interest. We''ll cover this in more detail in Chapter 4.


    When you''re able to interpret all of your customer data, you can uncover the
    individual preferences and affinities of each person and use that information
    to “boost” the results of your algorithms and make them even more relevant at
    the one-to-one level. While advanced algorithms are already relevant at the one-to-one
    level, boosting allows you to individualize even basic algorithms.


    There are many different ways in which boosters can be applied to completely individualize
    your experiences and recommendations. They can ensure that a person’s favorite
    brands are prioritized across your site, that she sees recommendations within
    her preferred price range, or that she sees content related to her preferred topics
    or that aligns with her stage of the buyer’s journey.


    For example, if a shoe retailer selected a “trending” base algorithm for product
    recommendations on its homepage, it would show shoes that were most popular on
    the site at that time. To personalize those recommendations, it could choose to
    apply a brand booster. One visitor may see primarily Vans shoes, while another
    may see shoes from Steve Madden—based on which brands the visitor has shopped
    across channels. Note that while the original base algorithm would'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'only show any items that are currently popular, applying boosters allows the
