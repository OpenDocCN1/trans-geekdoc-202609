- pgno: 196
  md: 'tems, and deliver personalized experiences through these channels.


    It is also worthwhile to ascertain how support for each channel was built into
    the vendor''s solution. Did the vendor natively build the capabilities or gain
    them through acquisitions? If the latter, dig into how well the various acquired
    solutions work together. If they do not integrate seamlessly, there could be a
