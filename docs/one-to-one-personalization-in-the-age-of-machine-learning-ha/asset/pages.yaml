- pgno: 200
  md: '# BUILD VERSUS BUY


    Throughout the chapter, we’ve described the requirements of personalization and
    customer data technology with the assumption that you’ll be using a third-party
    vendor (i.e., that you will purchase the technology instead of building it yourself).
    As with any new initiative, marketers must decide whether to build or buy the
    technology that will drive it. For many marketers, particularly those with limited
    development resources, the decision to purchase is easily reached. For others,
    it requires more analysis.


    Businesses tend to (rightly) view personalization as a potential competitive differentiator—one
    that they would like to keep closely guarded. As a result, some explore the possibility
    of building their own technology solution. They don’t want their competitors to
    know how their personalized experiences are being generated and what goes into
    them. If you are considering this approach, we encourage you to ask yourself these
    questions:


    +   • Will building personalization or customer data software distract from your
    core business?

    +   • Can you develop a single unified profile for each individual, and take in
    data from multiple sources to build out those profiles?

    +   • Can you develop all you need for cross-channel personalization, as outlined
    in this book?

    +   • Do you have data scientists to develop the machine-learning algorithms and
    predictive intelligence necessary for one-to-one personalization?

    +   • Can you seamlessly integrate what you build into your existing tech stack?

    +   • Can you develop a solution that is easy for marketers and other business
    people to use?'
  merge: -1
  img_proc: true
- pgno: 201
  md: '+   - Can you launch the solution in a timely fashion and keep up with future
    needs?

    +   - Are you prepared to dedicate resources to maintain the solution?

    +   - Can you keep up with personalization and CDP best practices. strategies
    and tactics?

    +   - How does the cost of building and maintaining your company''s own solution
    compare to that of a third-party solution?


    If you build your own personalization solution, you will have control over the
    features it includes, how it works, and what the user interface looks like. Some
    organizations opt to take this route, particularly when they believe it will give
    them a competitive advantage.


    But realistically, if you choose to buy your personalization technology, you do
    not need to worry about losing your competitive advantage. Your technology will
    only be as good as the work that you put into it. Even if you and your major competitors
    all use the same solution, you will not be using the same customized algorithms,
    designing the same campaigns, or iterating on existing experiences in the same
    way.


    Selecting the best technology for your personalization plan is essential. You
    may have a lot of ideas about how you would like to use personalization as part
    of your marketing strategy, but those ideas will not get off the ground if you
    don''t have the technology to support them. Picking vendors is not a decision
    you should take lightly.


    That said, choosing a personalization solution vendor does not need to be overwhelming.
    As long as you know what to look for, you will be able to separate fact from fiction,
    determine what''s real-time versus “next-time” personalization, and distinguish
    a comprehensive'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'customer data platform that allows you to deliver individualized experiences
    from a CDP that only allows for segment-based communication.


    Here''s a quick recap of the top pitfalls to watch out for when evaluating vendors:


    +   - When data can only be collected from, and experiences only be delivered
    to, one or a limited number of channels

    +   - Instances where “real time” doesn’t mean “the actual moment when an event
    or process occurs”

    +   - When “one-to-one personalization” does not factor in an accurate understanding
    of an individual’s affinities or in-the-moment intent

    +   - CDPs that *collect* data at the individual level, but can only *act on*
    data at the segment level

    +   - Insufficient testing and attribution capabilities, or math that does not
    add up

    +   - Cumbersome user interfaces, or any platform that cannot be operated by a
    non-technical team

    +   - Any over-reliance on buzzwords without the ability to fully explain what
    they mean

    +   - A suite that has been pieced together through poorly integrated acquisitions'
  merge: -1
