    # *What data sources do you support and how easily can they be integrated?*


    Think in advance about what data sources you plan to integrate and utilize for
    your personalization efforts. Do you have data in your CRM, email/marketing automation
    platform, data warehouses, or other places that you need in order to create a
    complete picture of each user (whether that person is known or anonymous)? If
    so, make sure that the data can be leveraged and integrated via out-of-the-box
    capabilities or robust APIs. You don''t want to sacrifice data that could be valuable
