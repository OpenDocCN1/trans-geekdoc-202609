- pgno: 105
  md: '# CHAPTER 5 CONSIDER THE FULL EXPERIENCE


    Throughout the book, we''ve given examples of what''s possible with personalization.
    In this chapter, we''ll switch gears a little to go into more detail about the
    different forms and formats personalization can take. Once you have these basics
    under your belt, it will be much easier to understand what''s achievable when
    planning your own personalization initiatives.


    At the broadest level, there are two types of personalized experiences: interruptive
    and seamless.


    **Interruptive experiences** are messages or content that a person does not necessarily
    expect to see and that are not integral to the current experience he is having.
    Many types of ads, emails and push notifications—as well as any web or app messages
    that overlay the existing page or screen—qualify as interruptive. For example,
    if you were to provide a pop-up message to visitors with personalized content
    based on their location, that pop-up sits on top of the rest of your site and
    is easily recognized as a separate personalized message.


    **Seamless experiences**, in contrast, are usually indistinguishable from the
    existing default experience. Seamless experiences can include any type of content
    that is inserted, replaced, hidden or modified on a page or in-app. For example,
    if you personalize the headline or a CTA button on your landing page, that text
    and image are part of the page itself and blend in with the rest of the content.
    Any human-to-human experiences—such as any time a salesperson, call center agent
    or in-store associate interacts with a customer—would also qualify as seamless.


    In the early days, personalization was limited to more interruptive'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'and intrusive messages with an “in-your-face” approach, but the industry has
    moved toward more seamless personalization. That said, both have their benefits
    and should be selected based on your campaign objectives.


    Let’s get into the specifics.


    # INTERRUPTIVE EXPERIENCES


    Interruptive experiences are best used when you want a message to grab someone’s
    attention or encourage the person to take a specific action. The strength of this
    kind of approach is also its weakness, however. These hard-to-miss messages can
    quickly become annoying, so it’s important to ensure that they are used sparingly
    and are as relevant as possible.


    Creating more effective, less irritating interruptive experiences starts with
    understanding the forms they can take.


    # DIGITAL ADS


    Some ad types can be considered interruptive, like pop-ups or interstitials, since
    they visually interrupt a visitor’s experience. These ads ask visitors to stop
    what they were attempting to do to engage with ad content instead—and that can
    be a tough sell. We’ve all seen pop-ups across the internet that are irrelevant
    and annoying. As a result, ads like these are much less common than they were
    10 to 20 years ago compared to more seamless ad types, but they certainly still
    exist.


    # PUSH NOTIFICATIONS


    Delivered on mobile devices, push notifications are similar to interruptive ad
    formats: they pop up on a user’s screen when he’s not'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'necessarily expecting them. They differ from ads, however, in that users typically
    opt in to receive them, and they''re generally geared toward assisting users versus
    promoting products or offers. They can be sent to any person who has downloaded
    a mobile app—even when that app is not in use. Because they are used to interrupt
    any activity a person is currently engaged with on his phone or tablet, they should
    also be used sparingly. And, as we described in Chapter 3, they should leverage
    all the data a marketer has amassed from that person''s usage of the app (or other
    channels when applicable) to ensure that he receives only relevant notifications.


    # OUTBOUND EMAIL


    Outbound emails are those that a person did not opt-in to receive. While not an
    ideal marketing tactic, using such emails can be valuable under certain circumstances.


    For example, outbound emails are often used by B2B marketers to drive traffic
    to their sponsored booths at trade shows. Marketers may receive a list of attending
    companies in advance, and if they are not given the names of attendees, they may
    use a combination of data sources as well as their judgment about which employees
    might attend. They may then send outbound emails to the people they have identified,
    leveraging effective messaging and incentives to encourage prospects to visit
    the company''s booth.


    In this situation, marketers know very little about the recipients: these people
    have not likely engaged with the company before. Therefore, it is not possible
    to leverage the personalization tactics we''ve described so far in the book. However,
    it is always a good idea to make the emails as relevant as possible. In this case,
    the content should be pertinent to the event as well as tailored to the attendee''s
    industry and job title or role.'
  merge: -1
  img_proc: true
- pgno: 108
  md: '# ONSITE AND IN-APP MESSAGES


    Finally, there are the experiences that take place on a company’s site or in its
    app. These are the messages that a marketer wants to ensure a visitor receives
    while engaging with the channel. Pop-ups, infobars and callouts are the most common
    types of interruptive onsite or in-app experiences. We’ll walk through each of
    these in detail and provide ideal use cases and tips to make them relevant and
    effective.


    # POP-UPS


    As opposed to creating indiscriminate pop-ups that contain advertisements, marketers
    can deliver pop-ups on their own sites and apps with messages for their own visitors
    and customers. Pop-ups tend to be very effective at catching someone’s attention,
    because they typically need to be closed before the visitor can continue to view
    the page. But as we explained earlier, they can be intrusive to the overall site
    or app experience and should be used sparingly.


    As innocuous as a pop-up may be, an irrelevant pop-up could cause someone to leave
    your site without engaging. But there are a few personalization strategies that
    you can use to help make your pop-ups more relevant and less intrusive:


    +   **Timing:** Time a pop-up to display only when a user demonstrates certain
    behaviors such as scrolling down a page, showing intent to exit, spending a certain
    amount of time on a page, or clicking a specific link.


    +   **Individualized Content:** Tailor the message content to the individual’s
    preferences or affinities. For example, an exit message (one that displays when
    a visitor is about to leave the site) could display a product that a shopper showed
    intent to purchase in the'
  merge: -1
  img_proc: true
- pgno: 109
  md: '![](img/34aada5ba30e8eb5b09a67b70056753e_109_0.png)


    Pop-up within a web app displaying an NPS survey'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'session or an eBook not yet downloaded by a B2B visitor but specific to her
    interests. With this degree of relevance, you maximize your odds of re-engaging
    the visitor.


    **Contextual Targeting:** Target your messages to visitors based on their referral
    source, location, device type or other attribute. When the message incorporates
    a relevant frame of reference, it is more compelling and engaging.


    **Lightbox Effect:** If the information you’re looking to convey with a pop-up
    is particularly important, a lightbox effect (also called a “modal”)—which grays
    out the rest of the page—is a good way to focus the visitor’s attention on your
    message and desired action.


    Here are a few key use cases for personalized pop-ups:


    +   **Exit Message:** A retailer may display a pop-up message that features products
    a shopper has left in his cart, perhaps reminding him of any incentives that are
    available to him, to encourage him to purchase before he leaves.


    +   **Email Capture:** A B2B site focused on demand generation may display a pop-up
    to an engaged reader of its blog, encouraging her to sign up for the newsletter
    if she hasn’t yet done so.


    +   **Alert:** A financial services site may display a pop-up when a visitor tries
    to abandon a credit card application, reminding her that her work will not be
    saved


    Clearly, pop-ups should be used judiciously on your site or in your app. As you
    plan new pop-ups, make sure to evaluate your existing experience to ensure that
    you don’t have too many pop-ups running'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'at once. And always test your pop-ups to determine if they''re effective. Consider
    trying different copy, images, CTAs or message types if you don''t see the impact
    you expected.


    # INFOBARS


    Infobars are designed to capture a visitor''s attention by appearing at the top
    or bottom of a page. They persist as “sticky” messages that remain on the top
    or bottom of the user’s screen when scrolling, but they can be designed to be
    easily closed or dismissed.


    Infobars are ideal for reminders, such as for upcoming sales or new content assets.
    They can either contain a simple informational message or a CTA that directs visitors
    to a specific page for more detail. While many sites use infobars to give reminders
    to all site visitors, messages can be tailored to each individual’s attributes
    or behaviors. Here are some examples:


    **Free Shipping/Loyalty Points:** A retailer may want to use an infobar to alert
    a shopper that he qualifies for free shipping or has loyalty points to use. That
    message will appear on any page he visits but will not be obtrusive.


    **Webinar/Tradeshow/Content Registration:** A technology provider may want to
    display an infobar to promote an upcoming webinar only to visitors within a specific
    industry. to alert visitors of upcoming events in their area, or to announce new
    eBooks or white papers that may be relevant to them.


    **Upsell:** An insurance site could display an infobar to subtly inform a customer
    that she qualifies for reduced rates on auto insurance when bundled with the home
    insurance she already has with that company.'
  merge: -1
  img_proc: true
