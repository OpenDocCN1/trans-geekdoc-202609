    key pages of your site, or an automated customer service call from a call center
    to a customer who just made a high-value purchase, or an email to a shopper about
    items left in his cart.


    # How do you define “real time”?


    The definition of “real time” varies across vendors. Make sure that any prospective
    vendor’s understanding of the term aligns with your own. When you ask a vendor
    to define it, the answer should be unequivocal: the solution considers all data
    for each visitor from the current and all past sessions, applies any and all personalization
    logic, renders the personalized experience, and supports reporting and analysis
    of that experience—all in milliseconds. Any answer that involves a delay of any
    kind in this end-to-end process is not, in fact, “real time.”


    # What behavioral data do you collect?


    As we outlined in Chapter 4, combining deep behavioral data with contextual data
    is essential for creating relevant experiences across channels. Without it, you
    cannot truly understand the affinities and in-the-moment intent of each person.
    Still, most vendors, if they are tracking data, only track page visits and clicks.


    Ask about the behavioral data each vendor collects to understand if they are really
    measuring engagement (including time spent, mouse movement, scrolling, hovering
    and inactivity) as well as page-level metadata (such as categories, tags, brands,
    colors and keywords). If they are not, you risk running personalization'
