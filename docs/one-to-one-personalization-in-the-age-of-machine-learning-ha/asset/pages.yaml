  md: '# ESTABLISH A PERSONALIZATION MANAGEMENT OFFICE


    With so much to think about pertaining to personalization, larger organizations
    may consider establishing a “personalization management office” (PMO). As with
    a traditional project management office, a PMO allows organizations to build and
    scale a personalization program efficiently, forge accountability and ensure buy-in.


    A PMO should be comprised of individuals from across different business groups
    and act as the main personalization strategy and solution or technical resource
    for the company, as well serve as the point of coordination across business divisions.
    Since personalization can touch multiple channels and teams, the PMO group can
    help make sure that all areas of the business are working toward the same goals—ultimately
    preventing headaches and greatly increasing the likelihood of success.


    Each organization needs to figure out what the PMO should look like within its
    own context, but there are three broad steps you can take to establish one.


    # 1. CREATE A PMO “CORE” TEAM


    The first step in establishing a PMO is to identify the individuals who will be
    involved. Think of your personalization management office not as an entirely new
    business group, but rather a “task force” comprised of individuals from a variety
    of departments who act as a centralized personalization resource.


    Who you include in the PMO depends on your business, but you should consider including
    key stakeholders from across the company—such as marketing (for all channels),
    analytics and operations. You should also consider nominating a strategic sponsor
    and program manager along with execution, analytics and creative team'
  merge: -1
  img_proc: true
- pgno: 165
  md: 'members. Do your best to keep from overloading the team, however, as having
    too many stakeholders involved can potentially make decision-making and execution
    slow.


    Also, note that in smaller organizations, the PMO may simply be one or two individual
    contributors and an executive sponsor.


    # 2. ESTABLISH YOUR PROCESS AND GOVERNANCE


    Your PMO should be responsible for creating a roadmap for how your company develops
    and manages personalized experiences. Begin by examining what your current processes
    look like. How are customer experience initiatives currently rolled out in your
    organization? Who owns which aspects of that process? Once you identify how the
    customer experience is determined across channels and teams within the organization
    today, you can begin to work through how the process should shift to incorporate
    personalization.


    As you work to incorporate personalization into your current workflows and business
    structure, select which individuals are responsible for different personalization
    tasks—both within the PMO and outside of it. Be explicit about who is involved
    with the personalization process and outline what each person''s role is. Some
    will only be involved in the brainstorming process, with no additional input after
    that. Others will help make decisions about which campaigns to implement. Others
    still will be responsible for setting up and testing the campaigns. These may
    or may not be the same people who will actually publish campaigns. Establish these
    roles early.


    When possible, set up role-based access control within your personalization platform.
    For example, create one set of users who can create campaigns, but not publish
    them. Create another set of users who can test campaigns. Then create a final
    set of those who can deploy campaigns into a published state. This structure will
    eliminate any confusion about roles and ensure that your campaigns are only'
  merge: -1
  img_proc: true
- pgno: 166
  md: 'deployed when the right members of your team review and sign off on them.


    # 3. EXECUTE AND REPORT ON PROGRESS


    The PMO should continue to check in on successful campaigns and determine which
    should be left alone, which can be improved, and which should be phased out. The
    definition of success will vary across companies, industries and channels.


    The benefit of a PMO is that it can help aggregate learnings across teams and
    departments. If your company has multiple websites, you can test out a campaign
    on one site before rolling it out to others. A recommendation algorithm that was
    successful in an email could be rolled out to the website. Without a central group,
    those findings could be lost.


    Finally, in addition to building out the organization''s personalization strategy
    and processes, the PMO should be responsible for reporting results to management
    to ensure the program continues to garner buy-in and support.


    # DEFINE A PERSONALIZATION STRATEGY


    While it is certainly possible to see impressive results without a personalization
    strategy simply by implementing campaigns here and there when you spot an opportunity,
    it is a good idea to develop a broader, long-term strategy, driven by a PMO. Even
    if it is simplistic, defining a strategy will help ensure you''re achieving specific
    goals, prioritizing your ideas, measuring your success, and ultimately creating
    improved customer or prospect experiences.


    The best place to start when developing your personalization strategy is with
    some initial research. We recommend three places to begin:'
  merge: -1
  img_proc: true
- pgno: 167
  md: '**Your challenges and goals:** Begin by thinking about the challenges you''re
    facing and the goals you want to achieve with personalization. Increasing conversions,
    reducing bounce rate, improving ROI of a specific marketing tactic, increasing
    average order value, improving upsells and increasing retention are all common
    goals for marketers employing personalization. Push yourself to think beyond the
    challenge itself. Continue to ask yourself “Why:” whenever you identify a challenge
    or goal. For example, if you want to improve conversions (because everyone wants
    to improve conversions), ask yourself why that remains a goal. Why are you struggling
