  md: 'experiences that delivered targeted offers to visitors within the available
    website space. With this campaign, a visitor from California would see deals specific
    to that region, while a visitor from New York would see different, relevant offers.
    The effort drove a 200% increase in total clickthroughs from the offers on the
    company''s homepage.


    **Database Attributes:** Rather than being detected from the web automatically,
    database attributes are pulled from a database-driven system such as a CRM or
    a data warehouse. They can include anything that you store in those systems, such
    as whether the visitor is a prospect or customer—and what type of customer he
    is (e.g., a high-value customer, a customer in a particular category, etc.). In
    order to tie a website visitor to his data in another system, you need some kind
    of identifier (such as an email address) for that visitor. Some examples of database-driven
    systems that can be used for personalization:


    +   - Customer Relationship Management (CRM) Systems, such as Salesforce, Netsuite
    or Microsoft Dynamics

    +   - Email and Marketing Automation Platforms, such as Oracle Eloqua or ExactTarget
    (Salesforce Marketing Cloud)

