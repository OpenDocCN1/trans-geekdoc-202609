    a few quick and easy campaigns that generate nice lifts in conversion rate, engagement,
    average order size, email capture rate and beyond. If leadership sees the value
    in personalization and is willing to allocate the budget, but is worried about
    these efforts taking too much time from the team, starting small and growing your
    investment from there could lead to success.


    Even once your leadership is on board (or if you are in leadership yourself),
    you may still need to manage objections from other members of your marketing team.
    These are the few we hear most often:


    # I’m already overwhelmed; this will take up too much of my time.


