- pgno: 16
  md: '# CHAPTER 1

    THE EVOLUTION OF THE INTERNET

    TOWARD PERSONALIZATION


    Imagine you’re considering an upgrade to your kitchen. A kitchen remodel is a
    big project—one you’re not likely to undertake without substantial research. So,
    before you make any serious plans, you probably want to check out a few home improvement
    sites for some inspiration.


    After you’ve invested significant time on one of those sites, that site should
    have a good idea of what you’re looking for and of your general preferences. It
    should be able to recognize that you’re primarily interested in ovens, for example,
    and that since you also researched other appliances, you’re likely planning a
    remodel. It should detect that you’re most interested in stainless steel and gain
    an understanding of your preferred price range.


    Most importantly, the site should be able to leverage all of this information
    about you to subtly personalize your experience. The product and category recommendations
    across the site should reflect your preferences. The search results and the way
    those results are ordered should reflect your preferences. The navigation of the
    site should reflect your preferences. Articles and buying guides relevant to home
    remodeling should be surfaced for you. And your whole experience should become
    more and more relevant as you continue to engage with the site.


    Sounds great, right?...Well, it can get even more impressive. If you ultimately
    decide to visit the store in person to talk to an expert about your remodel, the
    in-store staff should be familiar with your preferences so they can help and continue
    to recommend items to you. And any future communication with you, such as emails
    or call center inter-'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'actions, should draw from the same information the site collects.


    Once you’ve experienced this level of service, any non-personalized experience
    falls flat. You may not be able to recognize that a lack of personalization is
    the reason for a lackluster experience, but you’ll feel that any other home improvement
    company isn’t relevant to you, or that it’s too hard to find what you’re looking
    for. You may feel that the retailer has too many product options and that the
    experience just seems overwhelming.


    That feeling of frustration is what drives people away from certain companies
    and toward those that better understand them. It is why personalization is so
    important. Right now, the level of personalization described above is indeed possible,
    and it is a competitive advantage to those companies that are providing it. But
    in the future, it will be table stakes for operating any business. Any site, email,
    app, or store clerk that fails to provide a highly personalized experience will
    be at a disadvantage. So it’s time to invest in personalization now.


    How do we know that this is the way the world is headed? All you have to do is
    look at history. Before we describe how to achieve this level of one-to-one interaction
    with your customers, let’s take a brief step back in time.


    # THE PRE-INTERNET ERA


    Before the Industrial Revolution ushered in a new age of mass production, most
    businesses were local stores. As a proprietor of such a store, you knew all of
    your customers well. You knew how often they visited the store, what they bought,
    and what their home lives were like. This information would reside in your head,
    and you’d use it to help each and every shopper who would walk through your door.
    The approach allowed for an extraordinary level of personalization, but it wasn’t
    scalable.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'When mass production took hold, mass marketing was the name of the game. Appealing
    to the largest swath of people with a singular product was the goal. Leveraging
    mass media, you could reach those consumers in newspapers and print ads, on the
    radio and billboards, and eventually on television—in very large numbers. The
    more people your product appealed to, and the more people you could reach with
    a message for the lowest common denominator, the larger the size of your market.
    This approach is the complete opposite of the local store experience—extremely
    scalable, but not at all personal.


    # THE DAWN OF THE INTERNET AGE


    Technology started to transform the landscape in the early 1990s. The term “one-to-one
    marketing” was first introduced in 1993 and was formally articulated in the book
    *The One to One Future*, by Don Peppers and Martha Rogers.¹ In the book, Peppers
    and Rogers describe the shift they were beginning to see from a focus on “share
    of market” to “share of customer.” They emphasized that we were headed into an
    era where mass marketing would no longer be an effective way to compete. They
    predicted that “using the new media of the one-to-one future, you will be able
    to communicate directly with consumers, individually, rather than shouting at
    them, in groups.”²


    One of the biggest differences between a “share of customer” and a “share of market”
    approach should be obvious—knowledge of the customer. After all, customer information
    is a key differentiating factor between the local store experience and the mass-marketed
    approach. Peppers and Rogers note that:


    > The key share-of-customer requirement is to know your customers 1:1... You must
    know who your loyal customers are, so'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'you can take steps to make sure that yours is the brand they choose even more
    often.


    ... Today’s mass-marketing paradigm has no need for interactive media and computers
    that track individual customer transactions linked over time. Tracking customers
    and conversing with them individually are not tasks that fit into a market-share
    approach to competition.³


    Peppers and Rogers theorized that having large quantities of data at the individual
    level would be a competitive differentiator for businesses as the industry evolved
    to a more relationship-driven world.” While Peppers and Rogers demonstrated incredible
    foresight in their predictions of a one-to-one future, there were two key challenges
    with one-to-one marketing in the early ’90s. First, the type of individualized
    data they described was extremely hard to come by; let alone act on quickly. Most
    of the consumer data available to marketers came from surveys of attitudes and
    stated intentions statistically projected to the population as a whole. This type
    of data is helpful for understanding trends at the segment level (such as how
    young, affluent consumers feel about eco-friendly products), but it isn’t useful
    in a one-to-one capacity.


    The second challenge marketers in the ’90s faced was that the channel with the
    largest potential for one-to-one interactions—the internet—had not reached its
    full potential. Peppers and Rogers themselves struggled to grasp what, exactly,
    would be possible with the internet. Their visions of one-to-one marketing tended
    to remain in the realm of direct mail, phone calls and voicemails, and “facsimile
    machines.” For advice on how to provide personalized experiences online, they
    had this to share:


    > Give your ‘visitors’ the opportunity and incentive to let you know who they
    are. Tag them, if possible, so you will know them'
  merge: -1
  img_proc: true
- pgno: 20
  md: 'when they next visit your site. Think of all the ways you can continue to customize
    your communications and offers to them individually.


    If your firm has a major investment in Web communications, you have no excuse
    for not taking full advantage of the latest customization capabilities made possible
    by companies such as BroadVision. This West Coast firm can actually dynamically
    customize your Web page, based on whether and how a visitor has used it previously.
    A user who came to your site and expressed an interest in a particular baseball
    team, for instance, could see a ‘hot button’ for a chat group of that team’s fans
    when he comes to your site for his next visit.⁵


    The company they mention, BroadVision, was founded around the time The One to
    One Future was published. BroadVision’s One-to-One software was positioned to
    help companies profile website visitors and use that information to tailor marketing
    messages to the individual. The company was described in a Stanford case study
    a few years after its founding as “well positioned to become the leading supplier
    of enterprise-class solutions for personalized, one-to-one business on the Internet.”⁶
    While BroadVision marketed its solution as “one-to-one,” it only allowed marketers
    to leverage simple rules to personalize small parts of their websites to broad
    segments. Although impressive for its time, it was clearly a far cry from the
    one-to-one experiences we described earlier in this chapter.


    Peppers and Rogers can’t be faulted for their lack of specifics around how one-to-one
    marketing could extend to the internet. At the time, e-commerce was in its infancy
    (Amazon didn’t get its start as a bookseller until 1994), and only 23% of US households
    had a computer—never mind internet access.⁷


    Reading Peppers and Rogers’ book in 1994 must have been a fascinating peek into
    the internet’s possible future. George Gendron'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'of Inc. Magazine wrote about the work, “This is not the book of the year. It’s
    not even the book of a decade. It’s one of the two or three most important business
    books written.” It must have opened marketers’ eyes to what personalization could
    someday mean—and to what clearly wasn’t possible yet.


    # THE ROOTS OF PERSONALIZATION


    In 1999, journalists were already commenting that the one-to-one dream wasn’t
    yet a reality and that the vast majority of websites were still treating everyone
    the same. Amazon, of course, was cited as the leader of the pack. In 1999, five
    years after Amazon was founded, owner Jeff Bezos was named Time magazine’s “Man
    of the Year.” Amazon, and Bezos specifically, was credited with popularizing e-commerce.


    Although Amazon’s product recommendations created the standard for personalization,
    other tech companies were quickly springing up to cater to the newly popular e-commerce
    market. One such company, LikeMinds, founded in 1997, developed recommendations
    using an important algorithmic method called collaborative filtering (which we’ll
    discuss again later in the book). It allowed marketers to deliver personalized
    recommendations based on clickstream data, purchase history and product similarities.
    In the early stages of its existence, LikeMinds’ recommendations primarily leveraged
    explicit data, such as preferences that were directly solicited from visitors.


    Some early examples of one-to-one marketing came out of this era. Toyota used
    BroadVision to create a dynamic car-building experience on its site. Visitors
    could volunteer lifestyle information to Toyota and then configure their own cars
    on the site. They also could save their cars and return to them later. Similarly,
    Levi’s asked visitors to answer a few questions about their preferences in looks,'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'music and other forms of entertainment. LikeMinds used this explicit data to
    deliver personalized product recommendations.^11


    It’s worth noting that during this era, “one-to-one” was being attributed to two
    different tactics we apply today: personalization and customization. Today we
    say that a website is **personalized** when it tails itself to the visitor based
    on data it has collected (such as past behavior, known attributes, etc.). **Customization**,
    on the other hand, occurs when visitors intentionally modify their own experiences.


    Currently, when you adjust your Gmail settings to indicate the number of messages
    you want per page and add a signature, you are customizing your email experience.
    But when Gmail displays advertisements to you based on your interests, it’s personalizing
    your experience for you. In the first example, you’re intentionally changing the
    experience. In the second, you’re receiving more relevant ads without taking any
    action yourself.


    In the late ’90s, tools like BroadVision and LikeMinds were used to both personalize
    and customize, and both approaches were described as “one-to-one.” For personalization,
    BroadVision could leverage simple business rules (like in the “hot button” chat
    room example Peppers and Rogers cited). LikeMinds could provide product recommendations
    based on what “others like you” also shopped. While not technically one-to-one
    (more like one-to-many), these tactics are still a form of personalization.


    Yet the Toyota and Levi’s examples are more aligned with what we consider customization
    today. Visitors to Toyota’s site were able to customize and store their own virtual
    cars in their profiles, while Levi’s shoppers were able to customize their shopping
    experience by providing information about themselves. These early one-to-one attempts
    were valuable, but it’s worth making the distinction that they weren’t necessarily
    the type of one-to-one personalization that we think of today.'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# THE EMERGENCE OF REAL-TIME WEB ANALYTICS


    Fast-forward to the late 2000s, roughly 15 years after the introduction of e-commerce
    and Peppers and Rogers’ dream of one-to-one, and we still hadn’t achieved true
    one-to-one personalization. Peppers and Rogers wrote in a follow-up white paper
    that while a lot of progress had been made since 1994, they believed that the
    business world was still on its one-to-one journey.<sup>12</sup>


    At this point, the major impact that the internet would have on one-to-one customer
    interactions was certainly clear. While only 18% of US households had internet
    access in 1997, by 2009 that number had grown to 74%.<sup>13</sup> Meanwhile,
    the 2008 financial crisis made the relationship-driven experiences that strengthened
    loyalty among existing customers even more critical.<sup>14</sup>


    During this period, a technological advancement central to one-to-one personalization
    emerged: real-time analytics. While the importance of consumer data was established
    in the early ’90s, the industry was realizing that the ability to access analytics
    in real time was absolutely essential to one-to-one customer interactions.


    Web analytics began with log files in 1993. At that point, every time someone
    visited a website, the browser made an HTTP request to the site’s server to load
    every item on the page. Since most websites were made up of only one static page
    of content, a single hit to the server represented one page view.<sup>15</sup>
    A record of all of these requests was stored in the log file, but it contained
    a lot of data and was complicated to decipher. As a result, site data was often
    the responsibility of a company’s IT department, and it was used primarily to
    understand site performance.<sup>16</sup>


    Some tools did crop up to make these log files easier to interpret by a company’s
    marketing team, such as WebTrends and Analog.<sup>17</sup> In 1995, a company
    called Web Depot was founded. While it was originally a web consultancy, it moved
    into web analytics when the team'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'realized that their product, called Urchin, could process log files in only
    15 minutes—as opposed to the 24 hours that was common at the time.18


    Yet log files became harder to interpret as the internet evolved. Browsers developed
    the ability to cache—storing a version of a file in the browser so it did not
    need to make a call to the server if a page was loaded multiple times. As a result,
    visits that involved caching did not appear in the log file. Additionally, web
    pages became more complex to contain multiple files (such as images and videos),
    so multiple requests had to be made to a server to load every element of the page.
    This severely complicated the log files.19


    Javascript tags overcame some of these challenges starting in 1997. Javascript-based
    analytics is based on URLs and cookies. A cookie generally represents one person,
    so Javascript tagging remains an easier way to understand an individual’s path
    through a site.20 At this time, Urchin, while still predominantly log-based, added
    a product called Urchin On Demand that leveraged Javascript tagging.21


    In 2005, Urchin was bought by Google. Urchin On Demand became the foundation of
    Google Analytics (while log-based Urchin was phased out), and Javascript tagging
    remains the dominant method for web analytics today.22 Of course, these days Google
    Analytics is a dominant player in the web analytics industry, along with Omniture
    (now Adobe Analytics, which is part of Adobe Marketing Cloud).


    The evolution described above led to the development of real-time data in the
    late 2000s. Patric Timmermans, director of CRM at Infor in 2008, captured the
    spirit of the age—and its limitations:


    Customer dialogue has become the most important manifestation of one-to-one marketing.
    Companies used to cheer about having updated data every six weeks. Then they felt
    great about updating customer data every week. Now we’ve progressed to the point
    where companies can have'
  merge: -1
  img_proc: true
- pgno: 25
  md: 'constantly updated customer information, but I don''t think enough companies
    understand exactly how important real-time customer information can be. 23


    One-to-one personalization requires more than the collection of data: that data
    needs to be actionable. According to Timmermans, the capabilities were there to
    access real-time customer data, but marketers weren''t certain about what to do
    with that data. So while real-time data was available in the late 2000s, the data
    was not quite ready for use in real-time personalization. And, of course, technology
    was still evolving to include more and more channels that complicated the one-to-one
    vision. Notably, the first iPhone was released in 2007, but most marketers had
    not yet thought about collecting data from mobile browsing. Clearly, there was
    more work to be done.


    # ONE-TO-ONE TODAY


    Looking back at all this history, it’s clear that we’ve made great progress. But
    this progress has been slow. One-to-one marketing was envisaged in 1993. Today,
    how many marketers could honestly say that they’re delivering the kind of truly
    personalized, one-to-one experiences described at the beginning of this chapter?
    We’ve spoken to many marketers, and from our experience we can confidently say
    that the answer remains “not many.”


    What happened to the technology providers that were spearheading the one-to-one
    revolution? BroadVision is still around, but it’s fallen a long way since its
    heyday in the ‘90s. Today it is primarily focused on workplace collaboration and
    portal solutions, having “pivoted” after the dotcom bubble collapsed.² LikeMinds
    was acquired by IBM in the early 2000s³ and is still currently marketed for e-commerce
    recommendations.'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'But today, the biggest name in personalization is Adobe, which has made personalization
    a core aspect of its Adobe Marketing Cloud. The truth, however, is that while
    Adobe preaches a vision of one-to-one interactions, its solution to deliver on
    that vision is lacking. It comprises an assortment of products pieced together
    from various acquisitions. They have major functionality gaps, are not well-integrated,
    and are complicated to implement and operate. Key components were built long ago
    without real-time or big data in mind. These are not architectural oversights
    that can be easily fixed.


    We frequently encounter marketers whose experiences with Adobe have led them to
    believe that fully personalized, real-time, one-to-one experiences are beyond
    their reach. They think: *If the market leader can''t enable me to do it, it must
    not be possible.* And who can blame them? They''ve been hearing for decades that
    one-to-one marketing is within reach, when it clearly hasn''t been.


    If you''re struggling with personalization today, perhaps it''s because you''ve
    been unable to execute a personalization strategy at scale, or that you haven''t
    even tried because it seems too difficult to accomplish.


    Personalization has come a long way since it was first introduced in the early
    ''90s, and it will, of course, continue to advance. (We''ll provide some predictions
    for the future in the last chapter of this book.) But there''s already so much
    that can be done today at the one-to-one level with existing technology.


    In the rest of the book, we describe what you need to be truly successful with
    one-to-one personalization today and over the next decade. In brief, achieving
    the one-to-one vision requires:


    +   • Advanced machine-learning algorithms that can synthesize large amounts of
    data in real time and deliver individualized experiences (Chapter 2: Machine Learning
    is Changing the Game)'
  merge: -1
  img_proc: true
