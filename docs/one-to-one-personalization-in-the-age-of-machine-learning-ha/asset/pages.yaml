- pgno: 120
  md: '# SEAMLESS WEBSITE AND IN-APP EXPERIENCES


    As with interruptive formats, seamless formats can be used both on websites and
    within apps. Seamless format types appear to be a part of the page itself, although
    they''re actually delivered through a personalization platform by inserting, replacing,
    hiding or modifying content. Visitors should not realize that what they''re seeing
    is personalized: the content should always blend into the existing page and never
    flicker.


    The two main types of seamless personalization are in-page edits and inline content.
    While they are very similar, there is a distinct difference.


    # IN-PAGE EDITS


    In-page edits refer to any changes made to existing hard-coded content on a page—whether
    that content is modified or hidden completely. This allows you to make subtle
    yet impactful changes to your website to appeal to different visitors and make
    them feel that your website is intuitively relevant to them.


    Examples of in-page edits are essentially unlimited; marketers can usually identify
    numerous ways to personalize their websites from a quick brainstorming session.
    Here are a few to get you started:


    **Homepage Heroes:** Inserting in-page edits to the homepage hero experience is
    a compelling use case for companies across industries. It is one of the easiest
    ways to ensure that your homepage is relevant to any of your major personas or
    segments to reduce homepage bounce and encourage deeper engagement. A B2B demand
    generation site could leverage an ABM approach to deliver a different homepage
    image and copy to'
  merge: -1
  img_proc: true
- pgno: 121
  md: 'each of its target industries. A retail site could display a different homepage
    experience for visitors who have shopped certain product categories. A financial
    services site could deliver different homepage images and copy for target personas
    such as students, homeowners or veterans.


    **CTAs:** CTAs are often tested extensively, but tend to remain static for all
    visitors. A demand generation site could display a different CTA for different
    industries or different stages of the funnel (such as “Explore Financial Services
    Solutions” versus “Explore Healthcare Solutions,” or “Download this Retail eBook”
    versus “Download this Insurance eBook”). Taking it a step further, the company
    could even change the CTA after someone has already taken the action to be maximally
    relevant.


    **Site Navigation:** In-page edits are not limited to page content itself. You
    can change a site or app’s navigation for different groups of visitors, such as
    in the Dyn case study we shared several chapters ago.


    **Irrelevant Information:** A personalized experience can even include hiding
    content that is irrelevant to a particular segment or visitor. For example, a
    retail site could remove a mention of free domestic shipping for international
    visitors. or a blog site could remove a section that encourages subscription to
    a newsletter if the visitor has already done so.


    # INLINE CONTENT


    While in-page edits allow you to edit or hide content that is hard-coded on a
    page, inline content enables you to dynamically add full'
  merge: -1
  img_proc: true
- pgno: 122
  md: 'sections of content to a page. In most cases, visitors will not notice that
    any personalization is occurring or that a new section has been added; the content
    blends in. Essentially, inline content provides a seamless way to display information
    to visitors within the context and construct of the page.


    There are many reasons why you may want to add something specific to a page for
    a group or individual. Some examples:


    **Free Shipping:** An e-commerce site could insert inline content directly onto
    its cart page to encourage shoppers to buy more to qualify for free shipping.
    The site can even include product recommendations that would qualify the shopper
    for free shipping. Visitors who already qualify for free shipping could be shown
    something else in the same space, or the space could be blank without affecting
    the look of the site.


    **Upcoming Webinars:** A B2B company focused on demand generation could include
    an invite shown to select visitors for an upcoming webinar on its webinar recordings
    page, inserted at the top of the page. If that visitor does not qualify or has
    already registered, or if there are no upcoming webinars, no such content would
    appear.


    You may realize that these examples could easily be interruptive message types
    as well. Think about the webinar example from just above. The B2B site could highlight
    its latest webinar in an infobar at the top of the page, or as a callout as a
    visitor’s mouse hovered over a specific section of the website. The difference
    is that in these examples, the message is a part of the site experience itself,
    rather than imposing on it.'
  merge: -1
  img_proc: true
