    preferences, such as co-branded cards or cash-back rewards.


    # USING BOTH BOOSTERS AND FILTERS


    It’s worth noting that boosters and filters may seem very similar, because you
    use them to account for the same variables (such as brand, category, price, etc.),
    but there are clear differences. Filters allow marketers to have more control
    over what *types* of items to show, while boosters allow marketers to individualize
    the *specific* items shown.


    Here’s an example. Many clothing retailers offer products across different categories
    (e.g. men, women, kids). One such retailer may choose to apply a category **filter**
    to recommend only other items on a PDP that are in the same category as the item
    being viewed. In that case, while viewing a woman’s shirt, the shopper would only
    see recommendations for other women’s clothing—not men’s or kids’ products. Clearly,
    the filter refines the products being recommended.'
