  md: '# CASE STUDY: SQUAW VALLEY ALPINE MEADOWS


    Squaw Valley Alpine Meadows (SVAM), an internationally renowned mountain resort,
    caters to a wide swath of customers—from season pass holders to first-time skiers,
    tour groups to families. Each of its visitors has unique interests and priorities.
    SVAM determined that there were eight key personas it needed to target on its
    site, each requiring a different voice and unique content. The company needed
    a way to personalize the website experience to these specific segments to drive
    increased engagement and conversion.


    One group it wanted to target was its high-value season pass holders. Season pass
    holders cannot be detected automatically from the web, but that data did exist
    in the company’s CRM system. By bringing its CRM data into its personalization
    and CDP engine, SVAM was able to target a homepage experience specifically to
    season pass holders with messaging that appealed uniquely to them. These personalized
    experiences increased conversions and revenue per user among several key segments.


    # FIRST-PARTY BEHAVIORAL DATA


    First-party behavior refers to any action taken on your website, in your app or
    in response to your push notifications or email campaigns. It can be broken down
    into four major categories:


    Site-Wide (and App-Wide) Behavior: Site-wide behavior encompasses general behavioral
    analytics such as:'
