    # MULTIVARIATE TESTING


    The insights gained from A/B testing can be extremely valuable, but the approach
    only allows you to test one variable at a time. Multivariate testing (MVT), on
    the other hand, allows you to simultaneously test multiple aspects of a personalized
    experience—including text, graphics, formats, styles, and more—to determine the
    best combination of changes to achieve a desired outcome.


    For example, suppose you are uncertain which header (Header 1 or Header 2) and
    footer (Footer 1 or Footer 2) combination on your company’s website is the most
    effective at driving leads. Using MVT, you can simultaneously test these options
    to determine which combination works best.


