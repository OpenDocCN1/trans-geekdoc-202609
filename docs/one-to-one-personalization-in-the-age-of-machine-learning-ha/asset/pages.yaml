    benefits will outweigh the cost of their time, and determine the initiative’s
    priority relative to others.


    Just like with senior leadership, give some thought to some of the main use cases
    you have in mind for personalization and consider the impact you would see from
    increasing your KPIs. Many team members will be excited by those use cases if
    they improve the end experience for customers or prospective customers. And if
