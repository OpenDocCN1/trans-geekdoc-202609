    # DIGITAL ADVERTISING


    Digital advertising is a tactic that has long been used by marketers across industries
    to raise awareness and drive traffic. But take a moment to consider how much ad
    clutter exists in today’s world. The oft-cited number of ads the average person
    is exposed to daily is 5,000—although there is some debate about the accuracy
    of that figure.7 Regardless of the exact number, we can all agree that the average
    person is exposed to a very large number of ads each day, more than anyone could'
  merge: -1
  img_proc: true
- pgno: 68
  md: 'realistically absorb. And for a marketer, it can be difficult to stand out
    among all of this clutter, particularly when the intended audience is focused
    on another task (such as reading content on a publisher''s site or scrolling through
    a social network''s newsfeed) when an ad is displayed.


    Personalization can help ensure that ads are relevant to each viewer, to better
    catch each person''s attention. Many marketers are already personalizing their
    digital ads, using both “cold” ads and retargeted ads (ads that are targeted to
    people who have previously visited a website or used an app). Such retargeted
    ads will generally contain content relevant to something the visitor looked at
    while on the site. Yet that content is frequently selected based on limited data,
    which often means viewers are shown content they are not really interested in
    (products they have already purchased, eBooks they have already downloaded, etc.).


    The key to relevant digital advertising is to leverage all you know about a person
    from her engagement with your brand across all channels. This will ensure that
    ads are viewed as valuable, relevant messages rather than spam.


    With retargeting, you can advertise to the same segments that you communicate
    with on your website—or any other segment you create. For example, a B2B site
    can create segments of visitors in specific industries and then target relevant
    ads to those industries across the internet. A financial services site could create
    a segment of visitors who had shown an interest in student loans and then target
    those visitors with student-related ads. Marketers could even leverage their adtech
    providers to deliver ads to people who are similar to those in their segments
    via look-alike models.


    # CASE STUDY: MAJOR AIRLINE


