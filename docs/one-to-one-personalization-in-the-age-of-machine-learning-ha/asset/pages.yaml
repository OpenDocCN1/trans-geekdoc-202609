  md: 'In this same example, adding a **booster** can further individualize the women''s
    shirts that are recommended. For example, adding brand and color boosters would
    leverage the shopper''s preferences in these categories, and the site would recommend
    women''s shirts in her favorite brands and colors.


    Similarly, a B2B site focused on demand generation could apply a filter to content
    recommendations on its homepage to only display eBooks, and not any other content
    type in its library. But the recommendations could be further individualized by
    applying a booster to highlight a specific eBook that would best fit the individual
    visitor''s stage of the buyer''s journey.


    Whether you choose to apply filters, boosters, or both is completely dependent
    on your goals and the needs of your specific visitors. Generally speaking, however,
    the more you can individualize your recommendations with boosters, the more effective
    they will be.


    # VARIATIONS


    Finally, you can decide to include some variations in your algorithms. These can
    take several forms. For example, you can set your homepage recommendations to
    be randomized (while still being relevant to each individual) so they stay fresh,
    or you could cap the number of times you show a recommendation to a person to
    minimize apathy.


    Like all of the other aspects of an algorithm that we''ve described in this chapter,
    whether or not you include a variation and which variation you choose is completely
    up to you. It depends on what you think will be most effective for the needs of
    your particular customers.


