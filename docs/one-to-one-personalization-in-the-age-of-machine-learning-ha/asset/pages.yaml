  md: 'While it’s clear that infobars are not as obtrusive as pop-ups, it’s important
    to test each infobar to determine its effectiveness. When in doubt, it’s a good
    idea to test the same message using other formats to see which works best.


    # CALLOUTS


    Generally smaller and less conspicuous than other message formats, callouts draw
    attention to a particular area or feature within a page. We often see these used
    within web apps to point out a product’s new features or to ask users to take
    a tour, but they can be employed anytime you want to call attention to a page
    element.


    There are many ways to incorporate callouts into the experience while providing
    value to the visitor. Here are some examples:


    +   **Ask for reviews:** A retailer could display a callout around a product asking
    a shopper who purchased the product to review it.


    +   **Direct to help content or FAQs:** A technology provider could display a
    callout to customers who appear to be struggling within its product and direct
    them to the appropriate help content or FAQ.


    +   **Indicate a new or unused feature:** A financial services site could display
    a callout to indicate a new feature within its account management tools or could
    call out a feature the customer has not yet used.


    As with pop-ups and infobars, you can display a callout to anyone that visits
    a particular page—making it a non-personalized callout. But there are several
    ways to tailor callouts to make them a bit more sophisticated and relevant to
    specific visitors. Some examples:'
