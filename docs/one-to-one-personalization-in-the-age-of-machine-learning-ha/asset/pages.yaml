    their individual customers. Economies of scope will enable small competitors to
    defeat large ones, at least in the share-of-customer battle for specific, individual
    customers.47


    We can probably all agree that their prediction has become a reality. In the last
    few years, companies have disrupted industries by putting customers first, delivering
    personalized experiences, and creating truly innovative solutions. One such example
    is Netflix. As of this book''s publication, Netflix has nearly 150 million subscribers
    world-wide and is continuing to expand its user base globally. It added 9.6 million
    new subscribers in the first quarter of 2019 alone.48 Netflix can be credited
    with forever altering consumer expectations about content consumption, bringing
    the concept of “binge-watching” mainstream.


    As a streaming video platform, Netflix faces stiff competition from other streaming
    video providers, cable providers, and all other sources of entertainment. Netflix
    differentiates against all of this competition by providing a personalized customer
    experience. Chris'
