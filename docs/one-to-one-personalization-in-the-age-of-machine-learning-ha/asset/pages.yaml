- pgno: 124
  md: '# # PICKING FORMATS


    Of all the formats available, which is the “correct” one to choose? There is,
    of course, no right answer to the question. Different messages will lend themselves
    better to different formats, and there will be many occasions where you will have
    to make a judgment about which format best fits the situation, your brand and
    your customers’ expectations. That is why testing is so critical (and we’ll get
    into it in Chapter 6).


    Broadly, however, it’s important to note that seamless experiences allow you to
    do more with personalization. It’s not a good idea, for example, to personalize
    your website using only pop-ups. Using in-page and inline content, you can subtly
    tailor the full site experience to each individual. That means taking full advantage
    of the machine-learning algorithms we outlined in Chapter 2 and of all of the
    data types we detailed last chapter. You can use these resources to provide recommendations
    for products, brands, content and categories; to personalize list sorting; to
    dynamically modify site navigation; and to otherwise provide well-rounded and
    fully personalized experiences. You can’t do all of that with pop-ups alone. Technology
    has come so far since the days of Peppers and Rogers, and you no longer need to
    limit personalization to interruptive formats or prescribed locations on your
    site.


    We found in our annual study that email campaigns, homepages and landing pages
    are the most common areas where marketers leverage personalization.41 We have
    brought up each of these campaign types in this book, and they are each extremely
    valuable. But to provide a fully personalized experience that exists no matter
    which page a visitor is on or which channel she uses, marketers can expand their
    personalization efforts to include additional pages, search results, navigation
    and more.


    Of course, while it’s completely possible to dive headfirst into full-experience
    personalization, it’s not necessary to do so. We have'
  merge: -1
  img_proc: true
- pgno: 125
  md: 'seen a number of marketers who start with interruptive message types and basic
    seamless experiences targeted to broad segments when they begin personalizing,
    but who then evolve to more sophisticated tactics. A case study illustrates this
    here.


    # CASE STUDY: SHOELINE.COM


    Several years ago, Shoeline.com, an online shoe retailer, began leveraging personalization
    on its website. At the start of its personalization journey, the company was primarily
    focused on capturing email addresses and offering incentives to visitors based
    on referral source. For example, it designed a lightbox-style pop-up for shoppers
    arriving from a Google search. The pop-up included the product that was searched
    for and provided a discount to create urgency to convert.


    After testing the power of personalization and achieving a number of quick wins
    with several similar campaigns, Shoeline wanted to do more. It began to design
    more seamless experiences that leveraged individual shopper intent in the moment.
    Some examples include:


    +   • Personalized homepage experiences display copy based on the shoe category
    shoppers have spent the most time engaging with both in the current session and
    over time. Some of these shoe categories are relevant to very specific groups
    and not at all to others. This campaign allows Shoeline to promote more niche
    categories on its homepage without risking irrelevance to many of its shoppers.
    If a shopper never engaged with nursing shoes, for example, she would never see
    that category on the homepage.


    +   • A personalized shopping companion provides shoppers with easy access to
    the products with which they were most engaged or which they had previously purchased.
    The'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'contents of the tab are completely personalized for each person, and products
    are sorted based on level of engagement with each product in past and current
    sessions.


    +   • Individualized recommendations across product and category pages leverage
    boosters to individualize recommendations based on shoppers’ affinities, helping
    them discover shoes they are most likely to purchase.


    Personalized experiences on Shoeline.com have improved product discovery for visitors
    and driven increased conversions. While clickthroughs of its generic homepage
    banner were typically around 1%, the site’s personalized banners—targeted to key
    shopper personas—achieved clickthroughs up to an incredible 26%. And for visitors
    who engaged with the personalized shopping companion, Shoeline saw a conversion
    rate of 18%, which is a remarkable seven times higher than the average site-wide
    conversion rate.


    Both interruptive and seamless personalization have their place in a successful
    personalization strategy, but seamless personalization across the full customer
    experience is the way of the future. Like Shoeline.com, companies sometimes start
    with simple interruptive messages to dip their toes in the water before making
    personalization a fundamental site component, with more elaborate inline and in-page
    content.


    Generally speaking, with personalization across channels, we’re seeing an increased
    focus on building a relationship with the customer, not just catching their attention
    with something relevant. This means focusing on what will actually be beneficial
    to each person. In the same vein, many marketers are moving from batch-'
  merge: -1
  img_proc: true
