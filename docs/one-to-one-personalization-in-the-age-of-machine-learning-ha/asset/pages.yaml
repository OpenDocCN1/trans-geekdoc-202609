  md: '+   - Total number of site visits

    +   - Total number of logins

    +   - Total number of pages or screens viewed

    +   - Total time spent on-site or in-app

    +   - Average time spent per page

    +   - Time elapsed since last site visit

    +   - Total number of articles read, purchases made, videos viewed, etc.


    This information can be useful in a number of ways. Notably, you can apply it
    to target messages, notifications or experiences to first-time visitors or users.
    Here, the number of times a person has visited the site or app is important in
    determining the experience he receives. You can also use site- and app- wide behavior
    to target a campaign to returning visitors who have not engaged with the channel
    in a defined period of time.


    **Page Visit Behavior:** Page visit behavior refers to data about specific page
    or screen views for an individual, such as:


    +   - Specific pages or screens viewed

    +   - Number of times each page/screen was viewed


    While site-wide and app-wide behavior refers to such metrics as the *total* number
    of pages or screens viewed—or the average amount of time spent per page—page visit
    behavior refers to the *specific* pages visited or screens viewed. For example,
    page visit behavior would tell you that a person viewed Product Page A three times
    and Product Page B once. While still a bit high-level, this data can be valuable
    nevertheless.


    **Deep Behavior and Context:** Deep behavior goes a step further than the previous
    categories and involves information about the page viewed as well as specific
    behaviors taken or not taken on that page.'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'The information includes:


    +   - Time spent on a page

    +   - Mouse movement

    +   - Scrolling

    +   - Hovering

    +   - Inactivity

    +   - In-page context (category, tags, brand, color, keywords, etc.)


    Deep behavior and context combines the level of engagement for each page with
    the attributes of the page itself to provide an accurate indication of an individual''s
    affinities, interests and intent. This type of information is critical to true
    one-to-one personalization.


    **Campaign Engagement:** Campaign engagement refers to the actions an individual
    has taken in response to any of your campaigns across channels. It includes behaviors
    such as:


    +   - Personalized experience views and clickthroughs

    +   - Email opens and/or clicks

    +   - Push notification dismissals or clickthroughs

    +   - Correlation of the above to device, time of day, or other variables


    Derivative in nature, this data is immensely valuable, as it builds your understanding
    of each visitor and further informs your one-to-one personalization efforts.


    Let''s explore how these four behavioral data types differ with an example. Let''s
    say a customer visits a retail site. He''s a regular shopper and has viewed several
    product pages over the past month.


    If you (as a marketer looking to personalize his experience) had access only to
    his *site-wide behavior*, you would only know that he has visited the site three
    times over the last month and that his last visit was one week ago. You would
    know that he typically spends an'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'average of five minutes on the site and that he has viewed 20 pages on the
    site overall. With this information, you don''t know anything about his individual
    preferences or his intent for this site visit, but you could include him in a
    segment for loyal shoppers, for example.


    If you had access to *page visit behavior* as well, you would know which of the
    20 pages he has viewed. You would understand that he has clicked on five product
    pages within the shirt category, five product pages within the pants category,
    and six product pages within the shoe category. These products are evenly spread
    across three different brands and five different colors. From that information,
    you might conclude that he had no brand or color preference, and that he is slightly
    more interested in shoes than shirts or pants. You could provide him with product
    recommendations with a simple co-browse algorithm to show him products that other
    shoppers viewed, but you wouldn''t be able to truly individualize those recommendations
    to him.


    But if you had access to *deep behavioral data*, you could understand much more.
    You would know that while he viewed the category of shoes slightly more than shirts
    or pants, he spent three times as long viewing shirts than either of the other
    categories. You would know that when he clicked on Brand A, he immediately clicked
    away. You would know that he showed much more engagement while looking at shirts
    in blue and green than he did with any of the other colors. And you would know
    that he has spent several minutes engaging with a product page for a particular
    blue shirt, scrolling through photos and reviews, even going so far as selecting
    a size—without yet adding the item to his cart.


    Now, if you applied a machine-learning algorithm that delivered personalized recommendations
    based not only on popularity but also on each shopper''s preferred categories
    and colors, the shopper in this example would see top-selling blue and green shirts.
    Given the alignment of these items with his affinities, you would dramatically'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'increase your chances of engaging him and driving clickthroughs. Taking this
    a step further, if he does click through on certain shirts, adds one or two to
    his cart, or makes a purchase, your campaign engagement data would automatically
    inform the personalization platform of this action. It could then, for example,
    remind him of items left in his cart and avoid suggesting items he already purchased
    when he visits the site again.


    If you want to deliver true one-to-one experiences with the sophisticated algorithms
    we described in Chapter 2, you need deep behavioral data and contextual data combined
    with campaign engagement data to maximize relevancy. That is not to say that the
    other data types are worthless: we have shown numerous examples of successful
    campaigns that leverage all data types. But as we have seen, one-to-one communication
    powered by machine learning is the direction the world is headed, and deep behavioral
    and campaign engagement data is driving much of this transformation.


    # SURVEY DATA


    While you can learn a lot about an individual from all the data types that have
    already been described, sometimes the best way to learn something about a person
    is simply to ask. Most of us don’t enjoy taking surveys, so this may not sound
    like a good option. But the surveys we tend to dislike are those that are lengthy,
    tedious and don’t seem to provide any value to our lives.


    If there is something specific you want to know about your customers to help you
    provide a better experience, go ahead and ask them—but keep it brief. A short
    question or two can color in the picture you’ve created with the rest of your
    data and will likely be more useful to your personalization efforts than a lengthy
    survey. Think about what you are trying to learn about your customers or visitors
    and how you would treat each of them differently based on'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'what you learn. Here are some things to consider when formulating your survey
    questions:


    +   - What questions will customers not mind answering, because they''re quick
    and not overly personal?

    +   - What would each response tell us about the person?

    +   - How would we use the answers to deliver an experience that provides value
    to the customer?


    Once you have your question or questions ready, you can display a short survey
    on your site or in your app, either to everyone who visits or only to those who
    have taken a specific action, spent a specific amount of time on the site, or
    fallen into some other relevant segment. Use their answers to deliver appropriate,
    personalized experiences, either in the moment and/or at some point in the future.
    When you take action on the information you receive right away, visitors will
    understand why you asked the question and appreciate the immediate value received
    in exchange for their feedback.


    For example, a fashion retailer could deploy a quick and visually interesting
    survey on its site in order to better understand its shoppers. Visitors would
    be shown a few images of activities—such as yoga, hiking, DIY crafts, etc.—and
    be asked which they enjoy doing in their free time. Then, once they answer, they
    could be shown product recommendations or helpful articles relevant to that particular
    persona. The retailer also now has that information about each shopper’s interests
    for use in future campaigns.


    # THIRD-PARTY DATA


    Finally, data from third parties can be leveraged for personalization as well.
    Any action an individual takes across the broader internet—from searches conducted
    on search engines, to surveys taken on'
  merge: -1
  img_proc: true
- pgno: 89
  md: 'media sites, to pages viewed and forms submitted—can be used, as can any additional
    attribute data collected by outside sources. This data is often aggregated by
    a variety of vendors and sold for targeting and analytics purposes. Such vendors
    include data management platforms (DMPs), which focus on the B2C market; ABM analytics
    providers, which focus on the B2B market; and social media sites. Some common
    examples of third-party data used in personalization are:


    +   • Demographic data (e.g., age, urban/suburban, income level, etc.)

    +   • Firmographic data (e.g., industry, average selling price, budget cycle,
    etc.)

    +   • Buying signals (e.g., in the market for a new car/home/technology solution,
    etc.)

    +   • Self-defined attributes (e.g., relationship status on Facebook, career data
    on LinkedIn, etc.)


    # PREFERENCES AND INTENT


    Marketers sometimes wonder how such a surplus of detailed data can possibly be
    harnessed and effectively used. The key is to turn everything you learn about
    an individual into something you can act on. But before you can do that, you need
    machine learning to interpret the data and use it to determine people’s preferences
    (or affinities) and intent.


    Affinity modeling with machine learning can synthesize immense amounts of data
    to tell a clear story about an individual that evolves over time. This is yet
    another way that machine learning is changing the game in one-to-one communication.
    To illustrate, let’s refer back to what we know about the retail shopper in the
    previous example. Affinity modeling can take all of that deep data you collected'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'about your shopper and tell you clearly that shirts are his favorite category,
    that he does not like Brand A, and that his favorite colors are blue and green—so
    that you don’t have to manually dive into the data and uncover these insights
    yourself. As our example illustrated, with this information your algorithms can
    boost the shopper’s preferences in his product recommendations and other experiences
    across the site.


    The same process applies to more than just retail examples, of course. With affinity
    modeling, a technology provider could uncover a prospect’s preferred use case,
    content categories, content types, keywords, authors and more to boost those affinities
    in content recommendations across the site. Or in the financial services sector,
    a company could uncover the specific features a prospective customer is seeking
    in a credit card or an insurance plan, for example, and highlight those offerings.


    Understanding a visitor’s preferences isn’t where it ends, however. Once you understand
    a person’s preferences, you also need to identify his intent in the moment so
    that you can understand what he is browsing for and trying to accomplish right
    now. The key to understanding intent is real-time data. Without it, you will always
    be responding to an individual’s intent the next time he is on the site.


    An example might help underscore the importance of real-time data. Let’s say you
    walk into a big-box store to look at storage solutions. You ask a sales associate
    for a recommendation, and he suggests an action figure. You tell him that his
    suggestion doesn’t make any sense; you’re interested in storage, not children’s
    toys. He reminds you that you were interested in children’s toys the last time
    you visited, and therefore that is what he has for you. But if you come back in
    a few hours, he says, he can recommend a storage solution; it will take a little
    while to update your intent in their system.


    Although the above example sounds outlandish, it is exactly the type of experience
    you will give site visitors if you can’t respond'
  merge: -1
  img_proc: true
- pgno: 91
  md: 'to intent in real time. But what does it look like when you do have access
    to real-time data? Returning to the previous example—the retail shopper—the data
    shows that the shopper is demonstrating intent to purchase a blue shirt. With
    that information available to you in real time, you could launch a campaign to
    encourage him to purchase that shirt right now, whether by reminding him of any
    existing offers or credits available, or, perhaps, by letting him know about your
    free returns policy.


    Here are a few other examples. If a B2B site can uncover precisely why someone
    is on the site—doing some general research on a certain technology versus drilling
    down into specific products—and show him relevant information, he is more likely
    to react favorably than if he were blasted with promotions. Or, if a bike shopper
    on a B2C site is trying to decide between road bikes and mountain bikes, he will
    have a much more positive experience if the site delivers content that helps him
    understand the bikes'' different styles and uses than if it pushes products at
    him. Only once it''s clear that he''s going down a particular path, the site should
    help him understand the specific features and benefits of a particular type or
    model of bike.


    Preferences and intent are incredibly nuanced. Getting it right can mean the difference
    between featuring a product that is high-end versus one that''s mid-range, or
    recommending a case study versus a blog post. And the visitor may not even notice
    that an experience is tailored to him. In a world where marketers are competing
    for consumers'' digital attention, showing people something relevant and timely
    can keep them exploring your site longer and can drive them to convert sooner.


    # PREDICTIVE MODELING


    Identifying preferences and intent using affinity modeling allows you uncover
    a person''s _current state_ (or past state, if you''re not operating'
  merge: -1
  img_proc: true
- pgno: 92
  md: 'in real time). But what about the future state? For that, you need predictive
    modeling.


    With predictive modeling, you leverage machine learning to predict a future event
    based on an understanding of past events. When a predictive model has access to
    mass volumes of data inputs, including the real outcomes of situations similar
    to the ones you’re hoping to predict, it will identify patterns and predict what
    will happen when it is given new inputs.


    For example, if you wanted to predict which of your SaaS customers are likely
    to churn, you need to give your model an understanding of which customers have
    churned in the past, as well as all of the data you have available on those customers
    (such their firmographic or demographic details, their plan level, their login
    behavior and how they interacted with your application, how they engaged with
    your emails over time, and much more). The model can take in all of this information
    to identify patterns in churned customers vs. retained customers. Then, you can
    feed it data on all of your existing customers so that it can predict which current
    customers are most likely to churn.


    You can predict just about anything you think would be valuable for your business,
    provided you have enough relevant data to train the model. Some of the main predictions
    that businesses may find helpful may include a person’s:


    +   • Likelihood to purchase

    +   • Likelihood to request a demo or complete an application

    +   • Likelihood to churn (in a subscription-based business)

    +   • Likelihood to purchase again (in a retail business)

    +   • Likelihood to open or click through from an email

    +   • Likelihood to unsubscribe from an email list

    +   • Value to your business within a certain timeframe

    +   • Total predicted lifetime value

    +   • Predicted response to any given promotion or campaign'
  merge: -1
  img_proc: true
- pgno: 93
  md: '+   • Likelihood to qualify for any of your segments (as described in Chapter
    2—such as a loyal shopper segment)


    Some of these have a lot of value when predicted in real time. For example, if
    you want to know which promotion will appeal to each individual website visitor,
    you can use a model to predict how each person will respond to each promotion—and
    then display that promotion in real time (we’ll dive more into this type of personalization
    in Chapter 6). Or, if you want to know if you should offer a small discount to
    encourage an engaged shopper to convert. you can use a model to predict whether
    he is likely to convert in this visit. If there is a high likelihood he will convert,
    you don’t need to lose revenue from a discount (as he is to likely buy without
    one).


    Other predictions are less important to act on in real time, but can make a big
    impact on your business. When you can predict which of your customers are likely
    to churn, you can run marketing campaigns designed to incentivize them to stay
    or work to resolve any issues immediately. When you can predict which of your
    past retail shoppers are unlikely to return and purchase again, you can send more
    targeted emails to them to encourage them to come back.


    The applications of predictive modeling are endless, yet it’s important to note
    that these models can only be effective if they have access to a lot of accurate
    data. When we say “a lot” of data, we mean data from many different individuals
    (breadth), as well as many different data points for each individual (depth).
    Without a breadth of data, the model will not have enough situations to learn
    from. And without a depth of data, the model will be missing big sections of the
    picture. For example, if you want to predict an individual’s lifetime value—but
    you’re only training your predictive models with website data—the prediction will
    understandably be less accurate than it would be if you trained the models with
    data from in-store, mobile, call centers, emails, etc. In another example, if
    the model'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'doesn’t know that a customer has just called your company with a complaint,
    it will be missing a key churn indicator.


    In other words, predictive models can be most accurate when they have access to
    a well-populated customer data platform.


    # CENTRALIZED DATA AND CUSTOMER DATA PLATFORMS


    We can’t end a chapter on data without talking about where you need to store all
    this data. As we mentioned earlier, most businesses store customer data in multiple
    locations across their organizations. But delivering relevant, one-to-one experiences
    requires access to and interpretation of all of that customer data—no matter where
    it currently lives.


    The customer data platform (CDP) has emerged as the solution to this siloed data
    problem. Other tools, like the CRM, were historically thought to be the single
    central location for customer data. But most of those solutions were built in
    a different era when database structures were simpler and volumes of data lower.
    Most importantly, they were not built to handle the mass volumes of behavioral
    data we can access today.


    Think back to our discussion of behavioral data earlier in this chapter. When
    you collect in-depth behavioral website data such as time spent on each page,
    time spent hovering and scrolling on each page, inactive time on each page, etc.,
    it quickly adds up. And when you combine those site behaviors with mobile behavioral
    data, email or push notification campaign engagement, in-person interactions from
    a store or branch location, call center or online chat data, and any attribute
    data from any other system—you have way more data than a typical CRM can handle,
    in formats a CRM is not equipped to process.'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'And, of course, we know that none of this data means anything unless it can
    be interpreted and analyzed. Knowing that someone visited a website on a certain
    date and spent three minutes browsing across 11 pages doesn''t mean much unless
    you can put it in context and, through affinity and predictive modeling, infer
    his preferences and predict his future actions. CRMs were certainly not built
    for that.


    The CDP category is still being defined so no two CDPs offer the exact same set
    of features. But all CDPs must offer, at their core, a single unified customer
    profile.


    # IDENTITY RESOLUTION WITHIN THE UNIFIED CUSTOMER PROFILE


    Central to any CDP is a unified customer profile. Each person, whether known or
    anonymous, must have a single profile that contains all data relevant to him or
    her from a variety of sources.


    This profile should include as much data as possible to help understand the person
    including purchases, browsing history, email interactions, attributes, subscriptions,
    loyalty membership and status, interests and preferences, browser type, location,
    demographics, predictive scores and more. And this profile should include and
    unify many identifying data elements such as cookies, email address, full name,
    physical address, phone number, system ID. etc. Once the profile is in place,
    it can be used as the foundation of any personalization campaign across any channel
    going forward.


    While the goal is to create a single profile for each individual, it''s still
    possible to end up with multiple profiles for the same person. Thus, when data
    comes from different sources, it needs to be stitched together into one single
    profile. This is simple when there is clear identifying information (for instance,
    the same email address), but'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'not every person will clearly identify themselves in every channel for every
    interaction. Consider these situations:


    +   1. A visitor to a B2B site fills out a form to download a report and includes
    her name and email address. Now the company can identify her when she is on the
    website. However, some time later she uses a different browser. Her named profile
    still exists, but after that point, a new profile is created to capture her website
    activity as an anonymous visitor.


    +   2. A shopper in a retail store makes several purchases with his loyalty number.
    The retailer has his name and other identifying information through the loyalty
    program, as well as a history of his in-store purchases. Later, he browses the
    e-commerce site numerous times but never makes a purchase or identifies himself
    in any way, so his named in-store profile remains separate from his anonymous
    website behavioral profile.


    +   3. A customer of a bank or insurance company receives an email from that firm,
    reads the email, and then clicks through to the website. Later she calls the call
    center to discuss the same topic covered in the email and that she researched
    on the company''s website. In this scenario, she may be seen as three different
    people across the company''s email, web and call center systems.


    The separate profiles created in these situations all contain useful customer
    data, but each one doesn''t fully account for the person''s true and complete
    identity. CDPs need to be able to stitch profiles together when the data becomes
    available to do so.


    For instance, let''s assume that Mary Smith has a profile in a company''s CDP
    that encompasses data from several different channels (store, call center, mobile
    app, etc.). But Mary has never identified herself on her laptop. Therefore, she
    has one "Mary Smith"'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'profile and one “anonymous” profile in the CDP. The CDP needs to be able to
    merge both of these profiles together once she identifies herself in some way—such
    as clicking through from an email to the company’s site while on her laptop. Once
    it becomes clear that the anonymous person is actually Mary Smith, both profiles
    need to be stitched together to create a full picture of Mary.


    The same is true across any profile in the CDP. The CDP needs to constantly monitor
    identifying information to determine if two or more profiles represent the same
    identity. This can be done through deterministic matching or probabilistic (heuristic)
    matching.


    With deterministic matching, the CDP stitches profiles together based on clear,
    unique identifiers such as system ID or email address.


    Here’s an example for a site focused on demand generation. Let’s say an unidentified
    prospect views a technology provider’s website twice on his laptop and once on
    his mobile phone without providing his email or filling out a form. The tech provider
    would create two profiles for this person: one (Profile ABC) containing his laptop
    behavior, and one (Profile XYZ) containing his mobile behavior.


    The next time the prospect returns to the site, this time on his laptop, he downloads
    a white paper—providing his email address in the process. The tech provider would
    now be able to update Profile ABC to contain the prospect’s name and email address,
    as well as a history of all the actions the prospect has taken on his laptop so
    far. But Profile XYZ—the mobile profile—is still anonymous. Later, he clicks through
    on an email from the tech provider to the site while on his mobile device. The
    tech provider should now be able to merge Profile XYZ (containing behavior from
    the mobile device) with Profile ABC (containing laptop behaviors), as it can identify
    that those profiles are the same person. Now, when a salesperson reaches out to
    this prospect, she will have a complete profile that includes his mobile, laptop
    and email behaviors. And any personalization that takes place across those channels
    can be fueled from the same profile.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '![](img/34aada5ba30e8eb5b09a67b70056753e_98_0.png)


    Anonymous user profile with deep customer data


    ![](img/34aada5ba30e8eb5b09a67b70056753e_98_1.png)


    Mary Smith is identified in one of many potential ways


    ![](img/34aada5ba30e8eb5b09a67b70056753e_98_2.png)


    Mary''s anonymous profile is merged with her known identity to create one robust
    profile


    With deterministic profile matching, the CDP stitches profiles together based
    on clear, unique identifiers.'
