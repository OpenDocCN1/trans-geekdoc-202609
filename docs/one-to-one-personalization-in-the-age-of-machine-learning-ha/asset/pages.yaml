  img_proc: true
- pgno: 214
  md: 'outcome will determine how the screen will be used as a marketing channel.


    In addition to adding another screen to our lives, some cars today collect a lot
    of data on their drivers and their usage. For instance, Tesla collects data on
    each car’s speed history, odometer information, air bag deployment, battery charging
    history, and more. It even collects videos of accidents.⁶⁶ Could data about who
    is driving the car and how the car has been driven be combined with location data
