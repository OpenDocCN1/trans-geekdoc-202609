    # HUMAN


    The human channel is in some ways the most obvious form of personalization: it’s
    very easy to provide a personalized experience to a customer when you’re in a
    one-on-one conversation. At the same time, it’s also the least considered form
    of personalization, as many marketers do not realize that they can use the same
    principles and data to power their human-based customer interactions as they do
    their digital interactions. The same valuable information you collect in all of
    the previously mentioned channels can also be passed on to call center, customer
    success, and sales personnel to engender more relevant customer engagements.


    There are five categories in which humans can be a part of your cross-channel
    personalization strategy, across both B2C and B2B:


    **Call Center/Chat Agent:** If a person who has been researching credit cards
    on a website dials the call center for assistance or initiates an online chat
