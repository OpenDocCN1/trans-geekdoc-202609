    The Contextual Bandit algorithm has two main benefits: individual-level personalization
    and continuous learning. Since we’ve already covered the value of one-to-one personalization
    in this book, let’s spend a little more time on the continuous learning aspect.


    When you run an A/B test, you have to let the test run for some period of time.
    During that time, some portion of your traffic will be viewing what will ultimately
