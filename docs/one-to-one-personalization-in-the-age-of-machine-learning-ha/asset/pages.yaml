  md: 'of each individual technology investment.


    But personalization isn''t just another marketing tactic, and it shouldn''t just
    be about adding another solution to your tech stack. If you''ve taken anything
    away from this book so far, it should be that personalization can and should fundamentally
    change the customer experience for your company. It can help you show your customers
    and prospects that you understand them at the individual level. This is critical
    in today''s world, where catching someone''s attention—not to mention keeping
    that attention—can be a herculean task.


    In this chapter, we''ll get into the importance of testing in personalization,
    how it works, and how it directly relates to calculating ROI. Testing all your
    personalization campaigns not only allows you to find the campaigns that perform
    best, but also to quantify the impact of your personalization efforts on your
    KPIs to ensure you''re making the most of your investments.


    # A/B TESTING


    Most marketers are familiar with testing and often use it for optimizing email
    subject lines, landing pages, digital advertising copy and more across digital
    and offline channels. Without testing the approaches and tactics they''re currently
    using, marketers would never know what''s working or what could be improved.


    When it comes to personalization, testing can help you understand when a collaborative
    filtering algorithm is more effective than a co-browse algorithm for a specific
    group, or when an inline message is more effective than a call-out. It can also
    tell you whether a particular personalization campaign is more or less effective
    for certain visitor segments, or whether it''s best to reach an individual via
    email or push notification. Much like other marketing tactics, you don''t know
    what types of personalized experiences will work or if they''re optimized until
    you test your ideas. What works for one'
  merge: -1
  img_proc: true
- pgno: 132
  md: 'site, app or email may not necessarily work for another.


    Employing testing on your personalization campaigns can help you find what works
    best for your own business and channels. Also called split testing, A/B testing
    is the most common form of testing that we see. With A/B testing, you typically
    split your site traffic into two groups: an “A” experience for one group, and
    a “B” experience for another. The experience that drives the best results is the
    winner. The same concept, of course, can be applied to three or more groups, which
    is why it is sometimes also referred to as A/B/n testing.


    Let’s look at an example. As a retailer you may want to know if, on a product
    detail page for a pair of boots, it is more effective to show recommendations
    for similar styles or to display recommendations from other categories to “complete
    the look.” Is a product carousel more effective than no carousel? Should there
    be three product recommendations on the page or four? Or, in another example,
    is it more effective to recommend a blog post to a visitor via an interruptive
    message that slides in from the side, or with an inline section inserted right
    into the post being viewed? An A/B test can help you understand which works best
    for your site, app and audiences.


    Typically, when marketers who do not yet use personalization utilize A/B testing,
    they do so to find the best-performing experience for all of their traffic. This
    approach helps them figure out which experience appeals most to the least common
    denominator. But, as we’ve discussed, one-size-fits-all experiences are quickly
    becoming a thing of the past. A/B testing needs to be combined with personalization
    to be maximally effective.


    # USING A CONTROL


    One of the most important components of any personalization test is a control—or
    the default (non-personalized) experience. For example, if you’re testing an algorithm
    to provide product or content'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'recommendations directly in a search bar, you might want to test some portion
    of the traffic with one version of the algorithm (experience A), some portion
    of the traffic with another version (experience B), and the remaining portion
    with no personalized search at all (experience C). In this case, C is the control
    group. You could also test one version of the algorithm (experience A) against
    a control to determine if the personalized experience outperforms a generic one,
    and then test different versions of the algorithm against A going forward to find
    the most effective one. (Just remember that the more experiences you test at once,
    the longer it will take to achieve statistically significant results.)


    When testing personalized experiences, including a control is critical because
    you always want to be sure that personalization outperforms a generic experience.
    It is possible that your idea missed the mark for the segment you targeted, or
    that your personalized experience was confusing to visitors. Measuring against
    a control will help uncover these findings.


    Keep in mind, however, that even if you find that there is no difference between
    a control and test experience—or even that a generic experience outperforms a
    personalized one—that doesn''t mean that personalization does not work. It could
    simply mean that you need to find a more effective personalization strategy for
    that particular use case.


    # CASE STUDY: EVERGAGE


    At Evergage, we discovered a situation in which a test against a control group
    told us we were not providing a sufficiently effective personalized experience.
    We were using a feature called “SmartHistory” to display a tab at the side of
    each visitor’s screen that provided easy access to content (eBooks, case studies,
    etc.) the visitor had previously engaged with or downloaded on the site.


    For the test we conducted, a portion of our traffic saw'
