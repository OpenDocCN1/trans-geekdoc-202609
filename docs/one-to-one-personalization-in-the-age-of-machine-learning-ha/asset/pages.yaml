- pgno: 77
  md: 'We’ve all heard the expression: “Garbage in, garbage out,” which means that
    the quality of the input to a process will determine the quality of the output.
    If your inputs are bad, then your output will be too. The adage applies to any
    type of personalization, but especially to one-to-one personalization. Even the
    most advanced machine-learning algorithm designed to provide a highly individualized
    experience won’t be successful without a deep understanding of each individual,
    and that understanding comes from the data.


    Think about it this way: if you’re a sales associate in a retail store, you probably
    want to provide a personalized experience to every customer. But if you’re trying
    to help a shopper find what she’s looking for or to recommend additional products
    she may be interested in, your help will be completely ineffective if you don’t
    know anything about her. You need to have a conversation with her before you can
    offer any valuable assistance. Likewise, you will not be an effective store associate
    if you don’t know anything about your store’s products and inventory. In the digital
    world, the data you collect acts as that conversation, as well as your inventory
    knowledge, to help you form an accurate representation of each person and your
    business.


    In the context of personalization, “bad data” can have several different meanings.
    Data is bad or ineffective when it’s incorrect, when it becomes outdated, when
    it’s inadequate, and/or when it’s siloed.


    **Incorrect Data:** It’s easy to understand why using incorrect data would lead
    to inappropriate or inaccurate personalized experiences: if an input is wrong,
    the output will be wrong too. For'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'example, you could use data from your CRM to deliver an email to customers
    who are using your product for a particular use case. But if that data was entered
    incorrectly into your CRM for certain customers, the resulting email will be targeted
    incorrectly and won’t make sense.


    **Outdated Data:** Just because something was true a day or even a minute ago
    doesn’t mean that it’s still true. Technology allows us to move very quickly,
    and personalization that doesn’t keep up won’t be accurate. For example, if a
    visitor to a travel site researches and books a ski vacation all in one session,
    it won’t make sense to recommend additional ski vacation packages to him via an
    email or when he’s on the site again later that day (although it may still make
    sense to recommend ski-related content to him). While it is true that those packages
    *were* relevant to him recently, they are not *still* relevant to him.


    **Inadequate Data:** Although it might not be obvious to the topic of “bad data,”
    not having enough data can produce less-than-accurate personalized experiences
    too. We found in our annual study that one of the most common criteria marketers
    use to target personalization campaigns is pages viewed.39 This is a good start,
    but understanding that a person clicked on a few specific pages doesn’t tell the
    whole story. Was she interested in what she found on those pages, or not interested
    at all? If it’s a retail site, is she a loyalty program member? What are her favorite
    categories and brands? If it’s a B2B site, at which stage of the journey is she?
    What topics is she interested in? If it’s a financial services site, is she an
    existing customer? What products does she use? If you only have a few data points
    to paint a portrait of your visitor, you’ll only create a hasty sketch.'
  merge: -1
  img_proc: true
- pgno: 79
  md: '**Siloed Data:** Most marketers collect and store data on one individual in
    multiple places; in fact, Forrester found that marketers have customer data stored
    across 15 different places, on average.41 This data can be found across CRM applications,
    loyalty systems, marketing automation platforms, analytics tools, data warehouses
    and other areas. Sometimes the challenge is that a company’s data is inadequate—specifically
    when it comes to behavioral data, as we’ll see later in the chapter. But more
    often, the company has plenty of data to use for personalization, but the data
    isn’t easily accessible through the silos. The ability to bring data together
    into a single location is a critical first step to one-to-one personalization.


    Clearly, if you have one or more of these issues with your data, your personalized
    experiences will be affected. And realistically, a personalized experience based
    on incorrect data isn’t truly personalized at all. It’s an endeavor that misses
    the mark.


    # DATA TYPES


    Throughout the book, we have described experiences and scenarios where data was
    collected and acted on to personalize an experience. But what specific data types
    are useful for personalization? Any data that gives a marketer insight into an
    individual can be used. That data typically falls into one of four buckets: attribute
    data, first-party behavioral data, survey data and third-party data.


    # ATTRIBUTES


    Attributes describe any characteristic of a visitor. They can be derived from
