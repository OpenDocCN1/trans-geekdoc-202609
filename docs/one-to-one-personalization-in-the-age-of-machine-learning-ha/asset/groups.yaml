    modeling to determine a person’s future actions (as explained in Chapter 4)? Can
    the vendor’s platform use machine learning for alerting, troubleshooting, and
    problem and opportunity identification (as described in Chapter 6)? Most importantly,
    can you customize your machine-learning algorithms to deliver one-to-one communication
    across channels? And can you leverage these algorithms to deliver more than just
    product or content recommendations, but also brands, categories, promotions, search
    results, sorted lists and dynamic navigation?


    If any of these areas are important to your personalization strategy, be sure
    to select a vendor that will help you execute them.


    ## What does attribution reporting look like within your solution?


    You must be allowed to control your own analytics to dive as deep into the data
    as you wish. You should ask any vendor how their analytics and attribution capabilities
    work. Does the solution allow you to compare all campaign performance against
    a control? How is statistical significance determined? Can you calculate the impact
    of your campaigns on multiple metrics so you can understand site-wide impact?
    Are you able to customize the attribution window to uncover the impact during
    different time periods? If you can''t easily determine the answers to these questions,
    you might be dealing with a “black box” solution.


    ## How do you use your own product for digital marketing?


    If you notice a vendor has been a bit vague in some of their responses, try this
    question. While not an essential factor in the decision, any vendor should probably
    be using its own product to deliver personalized experiences in its own marketing
    channels. After all, you wouldn’t trust a chef who doesn’t eat her own cooking,
    would you? Even if you’re a B2C company, you can still learn a lot from how a
    personalization technology vendor leverages its own product. At the very least,
    a vendor should be prepared to cite specific and effective examples of personalization
    on their site. A great vendor should give you a comprehensive demo of personalization
    in action across channels, showing you how relevant and engaging experiences are
    delivered at the one-to-one level—in real time—and explaining what business strategies
    each personalization campaign supports.


    If a vendor can’t offer these examples and demonstrations, that might be an indication
    that the product does not meet some of the criteria we have laid out in this book.
    It could also mean that the solution is difficult or cumbersome to use—and even
    the company’s own marketing team might not be able to leverage it.


    ## BUILD VERSUS BUY


    Throughout the chapter, we’ve described the requirements of personalization and
    customer data technology with the assumption that you’ll be using a third-party
    vendor (i.e., that you will purchase the technology instead of building it yourself).
    As with any new initiative, marketers must decide whether to build or buy the
    technology that will drive it. For many marketers, particularly those with limited
    development resources, the decision to purchase is easily reached. For others,
    it requires more analysis.


    Businesses tend to (rightly) view personalization as a potential competitive differentiator—one
    that they would like to keep closely guarded. As a result, some explore the possibility
    of building their own technology solution. They don’t want their competitors to
    know how their personalized experiences are being generated and what goes into
    them. If you are considering this approach, we encourage you to ask yourself these
    questions:


    - Will building personalization or customer data software distract from your core
    business?

    - Can you develop a single unified profile for each individual, and take in data
    from multiple sources to build out those profiles?

    - Can you develop all you need for cross-channel personalization, as outlined
    in this book?

    - Do you have data scientists to develop the machine-learning algorithms and predictive
    intelligence necessary for one-to-one personalization?

    - Can you seamlessly integrate what you build into your existing tech stack?

    - Can you develop a solution that is easy for marketers and other business people
    to use?

    - Can you launch the solution in a timely fashion and keep up with future needs?

    - Are you prepared to dedicate resources to maintain the solution?

    - Can you keep up with personalization and CDP best practices, strategies and
    tactics?

    - How does the cost of building and maintaining your company''s own solution compare
    to that of a third-party solution?


    If you build your own personalization solution, you will have control over the
    features it includes, how it works, and what the user interface looks like. Some
    organizations opt to take this route, particularly when they believe it will give
    them a competitive advantage.


    But realistically, if you choose to buy your personalization technology, you do
    not need to worry about losing your competitive advantage. Your technology will
    only be as good as the work that you put into it. Even if you and your major competitors
    all use the same solution, you will not be using the same customized algorithms,
    designing the same campaigns, or iterating on existing experiences in the same
    way.


    Selecting the best technology for your personalization plan is essential. You
    may have a lot of ideas about how you would like to use personalization as part
    of your marketing strategy, but those ideas will not get off the ground if you
    don''t have the technology to support them. Picking vendors is not a decision
    you should take lightly.


    That said, choosing a personalization solution vendor does not need to be overwhelming.
    As long as you know what to look for, you will be able to separate fact from fiction,
    determine what''s real-time versus “next-time” personalization, and distinguish
    a comprehensive customer data platform that allows you to deliver individualized
    experiences from a CDP that only allows for segment-based communication.


    Here''s a quick recap of the top pitfalls to watch out for when evaluating vendors:


    - When data can only be collected from, and experiences only be delivered to,
    one or a limited number of channels

    - Instances where “real time” doesn’t mean “the actual moment when an event or
    process occurs”

    - When “one-to-one personalization” does not factor in an accurate understanding
    of an individual’s affinities or in-the-moment intent

    - CDPs that *collect* data at the individual level, but can only *act on* data
    at the segment level

    - Insufficient testing and attribution capabilities, or math that does not add
    up

    - Cumbersome user interfaces, or any platform that cannot be operated by a non-technical
    team

    - Any over-reliance on buzzwords without the ability to fully explain what they
    mean

    - A suite that has been pieced together through poorly integrated acquisitions

