    - **Recently Published:** Items are recommended based on what has recently been
    added to the site.

    - **Soon to Expire:** Recommended items are prioritized based on their upcoming
    expiration dates.

    - **Co-Browse:** Items are recommended based on what other people on the site
    have also viewed.

    - **Co-Buy:** Items are recommended based on what other people on the site have
    also purchased.

    - **Similar Items:** Items are recommended based on similarity in product type
    or category.


    Different base algorithms are suited to different use cases. For example, a retailer
    may want to highlight trending or recently published items on the homepage, while
