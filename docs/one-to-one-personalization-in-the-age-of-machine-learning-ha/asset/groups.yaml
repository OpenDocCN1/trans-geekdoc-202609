    未来，我们预期营销人员利用机器学习的方式将发生演进。机器学习主要分为两种类型：传统机器学习和深度学习。传统机器学习允许你使用标记数据或结构化数据来训练算法，使其以特定方式学习和响应。当你有想要解决的具体问题或想要回答的问题时，你会将数据输入机器学习算法，以帮助它学习如何解决该问题。本书中描述的大部分内容都是传统机器学习。


    另一方面，深度学习要复杂得多。它利用一组本质上被称为人工神经网络的算法，试图像人类一样解决问题。深度学习最常见的例子之一是人脸识别。分析和识别人脸的能力非常复杂，人类无法向机器解释人脸的哪些元素很重要。在算法能够识别人脸之前，需要解决若干不同的问题。在最基本的层面上，它需要能够识别照片中哪部分包含人脸，提取相关面部特征，并将其与其他人脸网络进行匹配。解决这个问题需要深度学习。


    展望未来，模拟人类与人类互动方式的深度学习将越来越多地应用于数字化个性化。具体情形还有待观察，但我们期待着见证机器学习在客户体验中的演进！


    我们预期的另一项发展是，基于机器学习的个性化将对内容管理系统（CMS）的需求和功能产生重大影响。当今，组织通常通过 CMS 设计和部署其网站页面。有时，他们会使用基于规则的个性化（利用
    CMS 的功能或独立的个性化解决方案）来针对特定受众修改这些页面。但请想象一个世界：网站的每个页面都会为每位访客动态生成，根据其偏好进行个性化定制，并且是实时进行的。在那个由机器学习驱动的世界中，个性化引擎将用于向每个人展示不同版本的网站，而
    CMS 则主要用于存储内容和图像。这可能听起来有点未来主义，但这种全站式、完全动态的个性化正是我们所迈向的方向。


    ## 机器学习——将个性化提升到新水平


    自 20 世纪 90 年代以来，个性化已经走得很远。以下是主要发展的简要回顾：


    ### 从表层数据到深层数据：

    我们可用于个性化的数据在过去几十年中发生了巨大变化。在过去，用于 Web 个性化的最佳数据是一个人点击过的内容。今天，你可以监控一个人与每个页面的互动程度，将其与他在其他页面上的互动程度进行比较，并利用页面本身的上下文来揭示他在你网站上的偏好、亲和力和意图。你还可以将行为数据与
    CDP 中大量其他来源的数据相结合，以构建个人和账户的完整画像。


    ### 从细分群体到真正的一对一目标定位：

    真正的一对一个性化沟通所需的深层数据对于驱动机器学习至关重要。借助机器学习，你可以综合所有可用信息，以可扩展的方式为每个人识别最佳、最相关的体验。虽然基于细分群体的沟通（Peppers
    和 Rogers 强调的唯一 Web 个性化类型）继续提供价值，但未来在于机器学习。


    ### 从“下次”到“实时”决策：

    数据处理的进步极大地改善了个性化，使个性化引擎能够实时收集数据，将其与历史数据相结合，并实时提供最相关的体验。这种可能性在 20 世纪 90 年代中期超出了
    Peppers 和 Rogers 的想象，并且至今仍是许多营销人员苦苦追求的事情。但实时交付个性化的重要性无论如何强调也不为过。在当今日新月异的世界中，等待某人在未来某个时间与你的品牌互动是大多数营销人员不应愿意承担的风险。


    ### 从孤立渠道到集成体验：

    在制定个性化计划时，营销人员很容易孤立地查看每个渠道，甚至将网站的各个页面视为与整体网站体验分离。但今天，我们有能力使我们的个性化策略更加有意识。我们可以创建集成体验，向客户展示我们跨渠道和上下文将他们视为个体。这不仅仅是在移动应用中添加一个信息栏，或在网站主页上添加一行产品推荐。这些只是更广泛策略的一部分。当
    Peppers 和 Rogers 在 1994 年解释为聊天室个性化 CTA 按钮时，他们肯定没有想到这种集成体验：在一对一级别实施完整的跨渠道个性化策略所需的技术当时并不存在。


    在这一点上，很明显一对一个性化的未来在于机器学习。机器学习已经改变了营销人员与购物者、潜在客户和客户互动的方式。技术已经发展，使营销人员能够以可扩展的方式收集和处理海量客户数据，从而在跨渠道中为个人和公司创建定制体验。


    从本书中也可以清楚地看出，我们正朝着日益个性化的方向发展。这不仅是因为我们可以提供个性化体验，而是因为我们必须提供这些体验。想想每天争夺你注意力的信息数量。你可能收到的电子邮件比你愿意阅读的还要多。你无处不在能听到和看到广告。你无法跟上你可能观看的所有不同的电视节目。当你在网上搜索某样东西时，你永远无法筛选每个结果。比以往任何时候都更甚，营销人员必须向个人呈现相关信息，如果他们想要吸引并保留消费者和企业买家的注意力。


    作为消费者，想想你希望获得哪些类型的体验。当你来到一个从未访问过的网站时，该网站如何吸引你的注意力并证明它与你相关？当你在收件箱中收到电子邮件时，什么内容能引起你的兴趣，让你想要打开并点击？哪些在线广告能真正吸引你的注意力？什么能让你忠诚的公司向你展示它了解你并感谢你的业务？


    现在思考一下如何将这种观点应用到你作为营销人员的工作中。你如何向购物者、访客、潜在客户或客户展示你真正了解他们，或者某个特定产品或服务适合他们？你如何穿透市场上的所有噪音，提供直击每个人的独特体验？


    这些是营销人员未来多年将不断自我追问的问题。营销的未来是个性化的。现在就取决于你，要确保你公司沟通的未来也是个性化的。


