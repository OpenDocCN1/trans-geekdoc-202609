    ## CHAPTER 7

    ### PLANNING FOR PERSONALIZATION


    Successfully delivering personalized experiences requires a different way of thinking
    than delivering non-personalized experiences. A marketing team putting personalization
    at the core of its strategy must shift from thinking about what they would like
    to tell their audiences, to what each individual audience member wants to see.
    When you implement personalization, instead of asking yourself, “What should we
    highlight on the homepage this month?” you would ask, “What does each of our key
    segments or personas need to learn from our homepage?” Instead of asking, “Which
    products and offers should we push today or this week?” you would ask, “What kinds
    of products and offers would individual visitors with different interests and
    needs prefer to see?” And instead of arranging your navigation or promoting your
    content in a way that makes the most sense to you and your team, you would consider
    how to present your content so that it will be the most relevant to each person
    on your site.


    Essentially, personalization allows you to take the ultimate customer-centric
    marketing approach.


    This is not a small shift that can happen overnight for many teams. Of course,
    as we discussed back in Chapter 5, it is certainly possible (and advisable) to
    dip your toe into the water first and implement a few basic campaigns to achieve
    some quick wins. However, in order to execute the type of one-to-one, cross-channel
    experiences that take full advantage of each person’s preferences and intent with
    machine learning, you need to have a clear strategy.


    Building a personalization program starts with getting the relevant stakeholders
    in your organization on the same page about the value and benefits of the initiative,
    defining a process and clarifying roles across the organization, developing a
    comprehensive strategy, and executing that strategy to achieve and measure success.
    In this chapter, we will address each of these areas in turn.


    ### ORGANIZATIONAL DECISIONS TO MAKE


    Larger organizations typically struggle more than their smaller counterparts when
    organizing for personalization. In small organizations, the number of people and
    teams involved in personalization is limited. Those organizations may have little
    to no established process— they can keep it informal and adapt as they learn more
    about what works and what doesn’t. But when multiple teams need or want to be
    involved, an informal process will no longer cut it. In those situations, you
    should be clear about who in the organization is responsible for personalization
    in which situations and/or in which channels. Ideally, all of that information
    is written down and stored in an easily accessible place to hold everyone accountable
    and keep everyone on track.


    We have assembled some questions you should consider as you get started. Not all
    questions will apply in all organizations, or the answers may be obvious depending
    on your situation or company size, but they are a good guide to use when kicking
    off the conversation.


    ### MANAGEMENT


    - How will you evaluate personalization success as an organization?

    - Will you have a “personalization management office” (we’ll define this later
    in the chapter) and how do you plan to have that office interact with your various
    divisions?

    - Who will establish personalization strategy in each division?

    - Who will assign personalization roles for staff in each division?

    - How will management evaluate staff performance in these roles?

    - How will you evaluate personalization success?

    - What role would you like your technology and/or agency partners to play in personalization
    campaign strategy creation and execution?

    - What channels will you personalize? Will you start with a single channel? How
    will you add others into your process when ready?


    ### PLANNING


    - How will you manage the ideation and prioritization of personalization campaigns?

    - Who will establish and manage your personalization campaign calendar?

    - How many campaigns do you expect to launch monthly across the organization and
    within each division?

    - What are your busy periods? How will you manage high-traffic campaign development
    differently from other periods?

    - How will your personalization team work with other teams to plan and execute
    your personalization campaign strategy?

    - How will you share best practices and learnings across divisions?


    ### TEAM ASSIGNMENT


    - What groups and individuals are assigned to support personalization?

    - What roles will each group and person play in your personalization strategy?

    - What skill sets are required for the various roles?


    ### EXPERIENCE DEVELOPMENT


    - Who will decide the experiences to be developed?

    - Who in your group will design your personalization experiences?

    - Who will manage creative? Will this be a central function or located within
    each division?

    - If more advanced coding is needed, will this be a central function or located
    within each division?

    - Who will approve experience design work?


    ### EXPERIENCE APPROVALS


    - Who will test new experiences prior to launch?

    - How will new experiences be approved prior to launch?

    - Which kinds of experiences will need to be approved centrally and which within
    each divisions?

    - When will experiences be launched?


    ### OPTIMIZATION AND PERFORMANCE


    - What key performance indicators are most important for your group and the larger
    organization?

    - How will you analyze results (lift and impact)?

    - How will you optimize experiences to continually improve results?


    These questions may seem daunting, but don''t forget that personalization can
    and should be an integral component of your customer experience and marketing
    efforts. If you think of it that way, rather than simply as just another one-off
    initiative your company is undertaking, you''ll realize that taking these questions
    into consideration is extremely important.


    We''ll dive into more detail in several of these areas in the rest of this chapter.


