    # THE ABILITY TO MANAGE THE TECHNOLOGY WITHOUT THE NEED FOR IT OR ENGINEERING
    INVOLVEMENT


    If you are a marketer, you’ve probably experienced the pain that results from
    relying on other teams in your organization to accomplish your marketing goals.
    Whether you need assistance from engineering, IT, customer success or sales, it
    can be frustrating when other teams—weighted down with their own priorities—fail
    to put your initiatives at the top of the list. When it comes to something as
    important as the customer experience, you don’t want to wholly rely on others.
    So what can you do?


    With the right technology, you and your team should be able to launch, measure
    and adjust personalization campaigns quickly and easily on your own, without intervention.
    Yet the platform needs to be comprehensive enough to address all of your complex
    multi-tactic, cross-channel demands. With some vendors, a platform like this just
    does not exist.


    That said, if your IT and engineering teams are essential marketing partners,
    the right platform should provide the reporting, developer tools, interfaces and
    APIs to enable these teams to accomplish their goals as well. Make sure you understand
    everyone’s needs to determine whether prospective personalization solution vendors
    can meet them.


    # ACCURATE ATTRIBUTION ANALYSIS


    As we described in Chapters 6 and 7, testing, analytics and attribution analysis
    are critical components of any personalization campaign. Without the ability to
    test, you cannot know if your campaigns'
  - '[PAGE 194]


    are successful or if there is anything you can do to improve your approach. You
    need built-in testing and attribution analysis to iterate rapidly and ensure your
    experiences and algorithms deliver the best results possible.


    Some solutions are not transparent when it comes to attribution analysis. Some
    vendors will provide reporting on campaign results but not enable customers to
    run or manage those reports themselves. And many will boldly claim that their
    “black box” solutions have made you hundreds of thousands or even millions in
    incremental revenue—taking credit for growth that may have occurred anyway. When
    selecting a personalization solution, make sure that you have the ability to compare
    the results of every campaign against control and that the solution utilizes sound
    statistical science for accurate and defensible attribution analysis.


    # HOW TO EVALUATE CDP AND PERSONALIZATION VENDORS


    When evaluating any new vendor solution, it can be a challenge to sort out real
    strengths from exaggerated claims. The terms used throughout this book—“one-to-one,”
    “real-time,” “intent,” “attribution,” “integrated”—are common buzzwords in the
    industry. They’re so frequently used that they can lose their meaning. Additionally,
    because virtually every email platform, CMS vendor, large technology company and
    small martech vendor has realized the critical importance of personalization and
    customer data, almost every such provider claims to be a personalization and/or
    customer data platform—whether they truly are or not.


    It is critical, therefore, to ask the right questions. The capability to implement
    one-to-one personalization is out there; it’s just a matter of finding the right
    technology for your needs. These questions should help you unravel and evaluate
    a potential vendor’s sales pitch.'
