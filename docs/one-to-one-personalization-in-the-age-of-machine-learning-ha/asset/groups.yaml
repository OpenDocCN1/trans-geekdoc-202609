    移动营销活动很重要。但将移动端与其他渠道关联，可提供更具高影响力、更相关的体验。


    ## CASE STUDY: PCH


    PCH.com 是 Publishers Clearing House 的网络目的地，后者是多渠道直销商，销售性价比高的商品、杂志和促销优惠，并是数字“玩赚”娱乐的领先提供商。它运营多个网站；当访问者在这些网站上玩更多游戏时，PCH
    可以推广更多产品并展示更多广告。与此同时，访问者会积累更多代币，赢得更多奖品的机会。


    然而，由于其桌面端和移动端网站之间缺乏连接，访问者在不同网站之间的体验截然不同。一旦访问者在一个网站上完成游戏，就会被鼓励访问其他 PCH 网站。但公司无法将推荐限制在当天未访问过的网站，因此访问者会收到他们刚玩过的游戏。此外，PCH
    只能在访问者处于电商页面时提醒其遗弃的购物车商品。公司希望降低购物车遗弃率，提醒访问者购物车中留下的商品，无论他们身处 PCH 宇宙的哪个位置。


    通过为每个访问者统一多个网站和应用上的体验，并提供个性化的提醒消息，PCH 在实施后的第二天实现了 36,000 美元的收入增长，并在 90 天内实现了超过
    100 万美元的增量收入。


    推送通知是移动端个性化的另一个重要领域。推送通知是公司可以发送给用户的消息，前提是用户的手机或平板电脑上安装了该公司的移动应用。用户无需正在使用该应用甚至无需使用手机就能收到推送通知。它只需出现在用户的设备上，看起来类似于短信或其他移动警报。因此，推送通知对于触达受众非常有效。


    但在考虑推送通知时，不要忘记人们与移动设备之间通常存在的紧密联系。对许多人来说，手机是睡前最后看到的东西，也是醒来后首先看到的东西。一家公司估计，普通人每天要触碰手机高达
    2,617 次！¹ 该设备已成为人们自身的延伸。因此，移动用户希望感到自己能控制手机上显示的内容，并会迅速更改设置以避免任何他们觉得烦人的通知。


    因此，确保您发送的任何推送通知对接收者来说真正相关且有帮助至关重要。例如，新闻应用可以识别出用户通常在移动应用和桌面网站上都阅读关于政治和娱乐的内容。该应用可以仅向用户发送这两个类别的突发新闻——而不是，例如，体育新闻。通过更少、更相关的通知，用户更可能将推送通知视为其应用体验中有价值的一部分，而不是一项烦扰。


    ## EMAIL


    电子邮件无疑仍然是一个关键的沟通渠道——如今几乎所有企业都在使用。在考虑电子邮件时，始终要考虑您的收件人每天收到多少封电子邮件。Radicati Group
    估计，2019 年每天发送和接收的电子邮件总数将达到 2930 亿封。到 2023 年底，该数字预计将达到 3470 亿封。³⁵ 穿透这种噪音对所有企业都至关重要，确保您发送的每封电子邮件都与您触达的每个个人都相关是一个很好的起点。您不希望被用户屏蔽。


    许多营销人员已经在其电子邮件中某种程度上利用了个性化。事实上，电子邮件是最个性化的渠道。然而，绝大多数营销人员只是在电子邮件中加入收件人的名或公司名称，或依赖基本细分来个性化其电子邮件。³⁶
    这些策略只是起点。让我们花些时间来探索个性化电子邮件的更高级方式。


    ## "OPEN-TIME" EMAIL PERSONALIZATION


    为确保您的电子邮件内容对个人相关，您需要考虑您跨渠道了解的关于该人的所有信息，特别是关于个人行为、历史和偏好方面。这可以通过利用我们在第 2 章中描述的相同规则和算法来实现。


    但对一个人在某个时刻相关的内容，对同一个人后来可能已过时。而且我们都知道，您无法控制电子邮件何时以及如何被打开和阅读。一旦电子邮件离开您的服务器，收件人就会选择何时消费信息。他们可能在发送后的一分钟、一天或一周内打开它。


    在此期间，情况可能会发生变化。收件人可能已经查看了您发送的内容，购买了您电子邮件推广的产品，采取了您电子邮件建议的行动，或者完全改变了兴趣。为了对该收件人高度相关，您的电子邮件内容应在打开时更新。


    这是如何运作的？通常，当电子邮件被打开时，收件人的电子邮件客户端（例如 Microsoft Outlook 或 Gmail）会向服务器发送请求以提供要显示的图片。如果您使用的是打开时电子邮件个性化，个性化平台会在消息打开（或重新打开）的那一刻，智能地决定显示哪些图片。此决定将基于它了解的关于收件人的所有信息，并考虑该人跨渠道的最新行为。个性化内容可以是产品推荐、促销优惠、电子书或视频建议，或只是信息性消息。


    比方说，零售商向一位常客发送一封包含三项产品推荐的电子邮件。在公司发送电子邮件和客户打开它之间，客户已通过移动应用购买了产品 1，产品 2 缺货，产品 3
    降价。当他打开电子邮件时，产品 1 和产品 2 将被替换为不同的（但仍相关）推荐，产品 3 的价格将被更新。


    同样，基于 Web 的应用程序可以为新用户提供包含多个在预定时间发送的电子邮件的引导流程。如果流程中的第二封电子邮件包含一个号召性用语，要求用户在应用程序中执行其已经完成的操作，那么电子邮件可以改为建议她采取另一个相关操作，或向她推荐适当的资源。


