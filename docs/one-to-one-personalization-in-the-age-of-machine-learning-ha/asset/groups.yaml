    unique pieces spanning several artists or movements, while others are interested
    in extremely specific one-of-a-kind pieces. Generic communication will not cut
    it for these individuals with vastly different tastes.


    As part of its personalized email program, Invaluable sends batch emails to customers
    that contain recommendations tailored to the specific preferences of each person.
    These recommendations are updated at open time, rather than at send time, to ensure
    the content is up to date. As a result, one-of-a-kind items that are auctioned
    and sold rapidly are removed from the emails and replaced with other relevant
    items. With open-time recommendations, Invaluable has seen a 21% increase in email
    clickthroughs.


    # TRIGGERED EMAILS


    While open-time email personalization ensures your emails are relevant when recipients
    are ready to engage with them, triggered emails enable you to proactively send
    relevant messages at the most opportune moments. Typically, marketers send “batch
    and blast” emails, which are sent to large lists of recipients at regular times
    (such as monthly, weekly or even daily). Some marketers, particularly in B2B businesses,
    send automated “nurture” email sequences to specific groups of opt-in recipients
    with similar characteristics (e.g., job role,'
  - '[PAGE 63]


    industry, buying stage, etc.). Triggered emails, in contrast, are individual emails
    sent one at a time when certain criteria are met or shortly thereafter.


    Such criteria often include behaviors a person has taken or not taken (like abandoning
    a cart or not signing into a SaaS application for a certain period of time), catalog
    updates (such as a product being back in stock or its price reduced), or external
    conditions (like the weather).


    One of the most common use cases for triggered emails in retail is cart abandonment.
    If a person adds a product to his online shopping cart but leaves the site or
    app before purchasing, he can receive a triggered email nudging him to complete
    the purchase. But emails can be triggered even if he doesn’t add a product to
    his cart. If he spends several minutes engaging with a product—reading reviews,
    scrolling through images, selecting different colors and indicating that he might
    be willing to purchase—the retailer can immediately send an email asking if he
    is ready to purchase the product now.


    # CASE STUDY: CARHARTT


    Founded in 1889, Carhartt is a specialty retailer known for its work clothes such
    as jackets, coats, overalls, coveralls, vests, shirts, jeans, dungarees and fire-resistant
    clothing. Many of Carhartt’s customers buy the same work shirt or boots consistently—they’re
    the same products their parents used, and their grandparents used before them.
    While each customer identifies with the Carhartt brand and what it stands for,
    they each have specific needs and preferences. Carhartt uses its rich understanding
    of each of its shoppers to deliver relevant experiences across channels. In one
    example, when a shopper abandons a cart, Carhartt sends him or her a triggered
    email that contains the item left behind. The company uses this opportunity to
    show shoppers that it'
  - '[PAGE 64]


    understands their needs by including other relevant products

    the shopper may like.


    These triggered cart abandonment emails combined with

    personalized recommendations have driven a 7x increase in

    conversion rate.


    Of course, other industries can use triggered emails too. A

    technology provider could have a page on its site asking visitors to

    fill out a form to take a free trial or request a demo of the product.

    If a visitor lands on this page but does not complete the form, the

    company could send an email triggered by this behavior, asking the

    person to take the action—perhaps even providing an incentive or an

    alternate action to drive a conversion.


    And that’s not all. Insurance companies can send content

    about how to file storm-damage claims during a big storm. Travel

    companies can send emails recommending beach vacations during a

    blizzard. Content publishers can trigger one-off emails to individual

    subscribers when they have new articles relevant to the recipients’

    interests. The applications of triggered emails are limitless.


    # PERSONALIZING THE FREQUENCY AND TIMING OF BULK

    EMAIL CAMPAIGNS


    Triggered emails are useful and highly effective, but they cannot be

    used in every situation. Sometimes, marketers have a specific message

    or promotion they want to communicate to a broad audience—either

    to their whole email list or a portion thereof. Bulk emails, such as

    weekly promotion emails or monthly newsletters, are valuable in

    those situations. But to cut down on email clutter, marketers can avoid

    sending those emails indiscriminately to everyone. They can vary the

    frequency and timing to match the implicit preferences of each person.


    To send better bulk emails, you can pay attention to which'
  - '[PAGE 65]


    recipients are regularly opening and engaging with your emails, which do so only
    occasionally, and which never open any emails. Then you can vary the frequency
    of your emails based on that information. For instance, if you want to send an
    email newsletter that highlights rele- vant, recent blog posts for each person
    on your list, you can do so using open-time personalization. But whether or not
    a person receives this particular blast will depend on how he has engaged with
    your emails in the past. A person who has never opened this newsletter may not
    receive it, while someone who always opens them certainly will.


    Beyond the frequency of sends, you can also consider the time of day that makes
    the most sense for each individual. Maybe one person is more likely to open emails
    sent bright and early in the morning, while another tends to open emails during
    her evening commute.


    Essentially, rather than rely on generic best practices of when and how many emails
    you should send, you can use machine-learning algorithms to learn how each person
    engages and then the system will pick the most appropriate frequency and timing
    for that person.


    With these different types of email personalization. employed separately or together,
    you can send much more relevant and timely communications and break through the
    cacophony.


