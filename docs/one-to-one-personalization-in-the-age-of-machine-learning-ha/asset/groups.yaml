    visited a website, the browser made an HTTP request to the site’s server to load
    every item on the page. Since most websites were made up of only one static page
    of content, a single hit to the server represented one page view. 15 A record
    of all of these requests was stored in the log file, but it contained a lot of
    data and was complicated to decipher. As a result, site data was often the responsibility
    of a company’s IT department, and it was used primarily to understand site performance.
    16


    Some tools did crop up to make these log files easier to interpret by a company’s
    marketing team, such as WebTrends and Analog. 17 In 1995, a company called Web
    Depot was founded. While it was originally a web consultancy, it moved into web
    analytics when the team realized that their product, called Urchin, could process
    log files in only 15 minutes—as opposed to the 24 hours that was common at the
