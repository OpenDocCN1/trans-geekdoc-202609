    # CHAPTER 1

    THE EVOLUTION OF THE INTERNET

    TOWARD PERSONALIZATION


    Imagine you’re considering an upgrade to your kitchen. A kitchen remodel is a
    big project—one you’re not likely to undertake without substantial research. So,
    before you make any serious plans, you probably want to check out a few home improvement
    sites for some inspiration.


    After you’ve invested significant time on one of those sites, that site should
    have a good idea of what you’re looking for and of your general preferences. It
    should be able to recognize that you’re primarily interested in ovens, for example,
    and that since you also researched other appliances, you’re likely planning a
    remodel. It should detect that you’re most interested in stainless steel and gain
    an understanding of your preferred price range.


    Most importantly, the site should be able to leverage all of this information
    about you to subtly personalize your experience. The product and category recommendations
    across the site should reflect your preferences. The search results and the way
    those results are ordered should reflect your preferences. The navigation of the
    site should reflect your preferences. Articles and buying guides relevant to home
    remodeling should be surfaced for you. And your whole experience should become
    more and more relevant as you continue to engage with the site.


    Sounds great, right?...Well, it can get even more impressive. If you ultimately
    decide to visit the store in person to talk to an expert about your remodel, the
    in-store staff should be familiar with your preferences so they can help and continue
    to recommend items to you. And any future communication with you, such as emails
    or call center inter-'
  - '[PAGE 17]


    actions, should draw from the same information the site collects.


    Once you’ve experienced this level of service, any non-personalized experience
    falls flat. You may not be able to recognize that a lack of personalization is
    the reason for a lackluster experience, but you’ll feel that any other home improvement
    company isn’t relevant to you, or that it’s too hard to find what you’re looking
    for. You may feel that the retailer has too many product options and that the
    experience just seems overwhelming.


    That feeling of frustration is what drives people away from certain companies
    and toward those that better understand them. It is why personalization is so
    important. Right now, the level of personalization described above is indeed possible,
    and it is a competitive advantage to those companies that are providing it. But
    in the future, it will be table stakes for operating any business. Any site, email,
    app, or store clerk that fails to provide a highly personalized experience will
    be at a disadvantage. So it’s time to invest in personalization now.


    How do we know that this is the way the world is headed? All you have to do is
    look at history. Before we describe how to achieve this level of one-to-one interaction
    with your customers, let’s take a brief step back in time.


    # THE PRE-INTERNET ERA


    Before the Industrial Revolution ushered in a new age of mass production, most
    businesses were local stores. As a proprietor of such a store, you knew all of
    your customers well. You knew how often they visited the store, what they bought,
    and what their home lives were like. This information would reside in your head,
    and you’d use it to help each and every shopper who would walk through your door.
    The approach allowed for an extraordinary level of personalization, but it wasn’t
    scalable.'
  - '[PAGE 18]


    When mass production took hold, mass marketing was the name of the game. Appealing
    to the largest swath of people with a singular product was the goal. Leveraging
    mass media, you could reach those consumers in newspapers and print ads, on the
    radio and billboards, and eventually on television—in very large numbers. The
    more people your product appealed to, and the more people you could reach with
    a message for the lowest common denominator, the larger the size of your market.
    This approach is the complete opposite of the local store experience—extremely
    scalable, but not at all personal.


    # THE DAWN OF THE INTERNET AGE


    Technology started to transform the landscape in the early 1990s. The term “one-to-one
    marketing” was first introduced in 1993 and was formally articulated in the book
    *The One to One Future*, by Don Peppers and Martha Rogers.¹ In the book, Peppers
    and Rogers describe the shift they were beginning to see from a focus on “share
    of market” to “share of customer.” They emphasized that we were headed into an
    era where mass marketing would no longer be an effective way to compete. They
    predicted that “using the new media of the one-to-one future, you will be able
    to communicate directly with consumers, individually, rather than shouting at
    them, in groups.”²


    One of the biggest differences between a “share of customer” and a “share of market”
    approach should be obvious—knowledge of the customer. After all, customer information
    is a key differentiating factor between the local store experience and the mass-marketed
    approach. Peppers and Rogers note that:


    > The key share-of-customer requirement is to know your customers 1:1... You must
    know who your loyal customers are, so'
  - '[PAGE 19]


    you can take steps to make sure that yours is the brand they choose even more
    often.


    ... Today’s mass-marketing paradigm has no need for interactive media and computers
    that track individual customer transactions linked over time. Tracking customers
    and conversing with them individually are not tasks that fit into a market-share
    approach to competition.³


    Peppers and Rogers theorized that having large quantities of data at the individual
    level would be a competitive differentiator for businesses as the industry evolved
    to a more relationship-driven world.” While Peppers and Rogers demonstrated incredible
    foresight in their predictions of a one-to-one future, there were two key challenges
    with one-to-one marketing in the early ’90s. First, the type of individualized
    data they described was extremely hard to come by; let alone act on quickly. Most
    of the consumer data available to marketers came from surveys of attitudes and
    stated intentions statistically projected to the population as a whole. This type
    of data is helpful for understanding trends at the segment level (such as how
    young, affluent consumers feel about eco-friendly products), but it isn’t useful
    in a one-to-one capacity.


    The second challenge marketers in the ’90s faced was that the channel with the
    largest potential for one-to-one interactions—the internet—had not reached its
    full potential. Peppers and Rogers themselves struggled to grasp what, exactly,
    would be possible with the internet. Their visions of one-to-one marketing tended
    to remain in the realm of direct mail, phone calls and voicemails, and “facsimile
    machines.” For advice on how to provide personalized experiences online, they
    had this to share:


    > Give your ‘visitors’ the opportunity and incentive to let you know who they
    are. Tag them, if possible, so you will know them'
  - '[PAGE 20]


    when they next visit your site. Think of all the ways you can continue to customize
    your communications and offers to them individually.


    If your firm has a major investment in Web communications, you have no excuse
    for not taking full advantage of the latest customization capabilities made possible
    by companies such as BroadVision. This West Coast firm can actually dynamically
    customize your Web page, based on whether and how a visitor has used it previously.
    A user who came to your site and expressed an interest in a particular baseball
    team, for instance, could see a ‘hot button’ for a chat group of that team’s fans
    when he comes to your site for his next visit.⁵


    The company they mention, BroadVision, was founded around the time The One to
    One Future was published. BroadVision’s One-to-One software was positioned to
    help companies profile website visitors and use that information to tailor marketing
    messages to the individual. The company was described in a Stanford case study
    a few years after its founding as “well positioned to become the leading supplier
    of enterprise-class solutions for personalized, one-to-one business on the Internet.”⁶
    While BroadVision marketed its solution as “one-to-one,” it only allowed marketers
    to leverage simple rules to personalize small parts of their websites to broad
    segments. Although impressive for its time, it was clearly a far cry from the
    one-to-one experiences we described earlier in this chapter.


    Peppers and Rogers can’t be faulted for their lack of specifics around how one-to-one
    marketing could extend to the internet. At the time, e-commerce was in its infancy
    (Amazon didn’t get its start as a bookseller until 1994), and only 23% of US households
    had a computer—never mind internet access.⁷


    Reading Peppers and Rogers’ book in 1994 must have been a fascinating peek into
    the internet’s possible future. George Gendron'
