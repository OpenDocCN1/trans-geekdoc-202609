    revolution? BroadVision is still around, but it’s fallen a long way since its
    heyday in the ‘90s. Today it is primarily focused on workplace collaboration and
    portal solutions, having “pivoted” after the dotcom bubble collapsed. ² LikeMinds
    was acquired by IBM in the early 2000s ³ and is still currently marketed for e-commerce
    recommendations.

