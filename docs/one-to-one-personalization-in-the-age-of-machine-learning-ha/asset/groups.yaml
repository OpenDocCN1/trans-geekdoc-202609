    In the future, we expect an evolution in the way marketers leverage machine learning.
    There are two main types of machine learning: traditional machine learning and
    deep learning. Traditional machine learning allows you to train an algorithm with
    labeled or structured data to learn and react in a certain way. When you have
    a specific problem you would like to solve or a question you would like to answer,
    you feed data to a machine-learning algorithm to help it learn how to solve that
    problem. Most of what we have described in this book is traditional machine learning.


    Deep learning, on the other hand, is much more complicated. It leverages what
    is essentially a group of algorithms, called artificial neural networks, that
    attempt to solve problems as a human would. One of the most common examples of
    deep learning is facial recognition. The ability to analyze and recognize a face
    is complex, and a human cannot explain to a machine which elements of the face
    are important. There are a number of different problems to solve before an algorithm
    can identify a face. At the most basic level, it needs to be able to identify
    which part of a photo contains a face, pull out relevant facial features and match
    them to a network of other faces. Deep learning is required to solve this problem.


    Going forward, deep learning that emulates the way humans interact with other
    humans will increasingly be used in digital personalization. The specifics of
    what that looks like remain to be seen, but we''re looking forward to witnessing
    the evolution of machine learning in customer experiences!


    Another development we anticipate is that machine learning personalization will
    have a significant impact on the needs and functions of content management systems
    (CMSs). Today, organizations typically design and deploy their website pages via
    a CMS. Sometimes, they will use rule-based personalization (leveraging features
    of the CMS or a separate personalization solution) to modify those pages for certain
    audiences. But imagine a world where each page of the website is dynamically created
    for each visitor, personalized to his or her preferences, in real time. In that
    world, driven by machine learning, the personalization engine would be used to
    present a different version of the website to each person, and the CMS would be
    used largely for the storage of content and images. It may seem a little futuristic,
    but this type of full-site, completely dynamic personalization is where we''re
    headed.


    ## MACHINE LEARNING–TAKING PERSONALIZATION TO THE NEXT LEVEL


    Personalization sure has come a long way since the 1990s. Here''s a quick recap
    of the major developments:


    ### Surface-level to in-depth data:

    The data we can leverage for personalization has evolved dramatically over the
    decades. In the past, the best data we had available for web personalization was
    what a person had clicked on. Today, you can monitor a person''s level of engagement
    with each page, compare it to his level of engagement across other pages, and
    leverage the context of the page itself to uncover his preferences, affinities
    and intent on your site. You can also combine behavioral data with data from a
    multitude of other sources within a CDP to build a complete picture of individuals
    and accounts.


    ### Segment-based to true one-to-one targeting:

    The in-depth data required of true one-to-one, personalized communication is critical
    for powering machine learning. With machine learning, you can synthesize all the
    information you have available to identify the best, most relevant experience
    for each individual in a scalable way. While segment-based communication (the
    only type of web personalization Peppers and Rogers highlighted) continues to
    provide value, the future is in machine learning.


    ### "Next time" to "real-time" decisioning:

    Advancements in data processing have dramatically improved personalization, allowing
    personalization engines to collect data in the moment, combine it with historical
    data, and deliver the most relevant experiences in real time. The possibility
    was beyond Peppers and Rogers'' imagination in the mid-1990s, and it is still
    something that marketers struggle with today. But the importance of delivering
    personalization in real time cannot be overstated. In today''s fast-moving world,
    waiting for someone to engage with your brand at a later date is a risk that most
    marketers should not be willing to take.


    ### Siloed channels to integrated experiences:

    When developing personalization plans, it is easy for marketers to view each of
    their channels in isolation or even to view various pages of their websites as
    separate from the overall site experience. But today we have the ability to be
    more intentional with our personalization strategies. We can create integrated
    experiences that show customers that we know them as individuals across channels
    and contexts. It is more than adding an infobar to a mobile app or a row of product
    recommendations on a site''s homepage. These are just pieces of a broader strategy.
    When Peppers and Rogers explained personalizing a CTA button for a chat room in
    1994, they certainly did not have these kinds of integrated experiences in mind:
    the technology to implement a complete cross-channel personalization strategy
    at the one-to-one level did not exist.


    It should be obvious at this point that the future of one-to-one personalization
    rests with machine learning. Machine learning has transformed the way marketers
    can interact with their shoppers, prospects and customers. Technology has evolved
    to allow marketers to collect and act on vast amounts of customer data in a scalable
    way to create tailored experiences for individuals and companies across channels.


    It should also be clear from this book that we''re headed in the direction of
    increasing personalization. This is not just because we can provide personalized
    experiences. It is because we must provide those experiences. Think about the
    number of messages competing for your attention every day. You probably get more
    emails than you would ever care to read. You hear and see ads everywhere. You
    can''t keep up with all the different TV shows you could possibly watch. When
    you search for something on the web, you could never sift through every result.
    Now more than ever, marketers have to surface information relevant to the individual
    if they want to catch and keep the attention of both consumers and business buyers.


    As a consumer yourself, think about the types of experiences you would like to
    have. When you find yourself on a website you''ve never visited before, how can
    that site capture your attention and prove that it''s relevant to you? When you
    receive emails in your inbox, what would pique your interest enough to want to
    open them and click through? Which online ads would truly capture your attention?
    What would show you that a company you''re loyal to knows you and appreciates
    your business?


    Now think about how you can apply this perspective to your job as a marketer.
    How can you show your shoppers, visitors, prospects or customers that you truly
    know them, or that a particular product or service is right for them? How can
    you cut through all the noise in the market to deliver unique experiences that
    speak to each individual?


    These are the questions that marketers will be asking themselves for years to
    come. The future of marketing is personalized. It is up to you, right now, to
    make sure that the future of your company''s communications is personalized too.


