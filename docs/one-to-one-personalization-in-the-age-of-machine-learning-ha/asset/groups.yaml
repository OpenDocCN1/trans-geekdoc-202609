    removing/changing CTAs for actions a person has already taken)

    - Recommend content, products, brands, and more based on everything that is known
    about that person in the moment while they’re on your site or reading your emails


    Essentially, activation of CDP data looks like all the different forms of cross-channel
    personalization we described in the last chapter.


    There are two main ways to activate on CDP data: the CDP can push data to other
    systems to use, or it can take action directly—that is, if it also offers personalization
    functionality.


    Pushing data to other systems is essential CDP functionality because no single
    martech solution can exist in isolation—and no single solution will allow you
    to do everything you want to do with the data. But you should be aware of the
    limitations. When you push data out to other systems, you can typically only do
