  - '[PAGE 181]


    Personalization can be used to bring the relevant content to the forefront for
    each visitor on your site. For example, rather than relying on the visitor to
    navigate to your resources page and select the right eBook, you can recommend
    that content on any page of your site and when it’s most appropriate for each
    visitor.


    Of course, implementing personalization can help you identify any content gaps
    you may have. But those gaps might not be essential to fill before getting started
    with personalization.


    In this chapter, we have discussed the issues of making important organizational
    decisions relevant to personalization, establishing a personalization management
    office, developing a personalization strategy, executing your personalization
    program, keeping the program running smoothly and addressing objections to personalization.


    Of course, no personalization strategy is complete without the right technology
    to appropriately act on data to provide the most relevant experiences in the moment.
    That’s the focus of the next chapter.'
  - '[PAGE 182]


    # CHAPTER 8

    FINDING THE RIGHT TECH FOR THE JOB


    In the last chapter, we covered how to get started with personalization in your
    organization. But before you can get very far, you need the right technology.
    As the foundation of your personalization program, it is essential that your technology
    has the ability to collect, analyze and act on data in real time to deliver a
    personalized experience. And for one-to-one personalization, the technology must
    incorporate machine-learning capabilities, be highly sophisticated, and garner
    a considerable level of trust from the business user.


    By adopting machine learning, you are entrusting technology to manage pieces of
    your marketing and customer experience delivery. Relinquishing control can be
    disconcerting to many. How do you know what the end result looks like for your
    visitors, users, shoppers and customers if each person''s experience is different?
    How can you guarantee the experiences will be good?


    Most marketers we''ve spoken with feel more comfortable with machine learning
    when they have control over the experiences the machine delivers. Yet many solutions
    operate as a "black box": they provide dynamic experiences (primarily in the form
    of recommendations), but not much insight into how those experiences are determined.
    And if they give you no insight into how they are picking experiences, then they
    certainly don''t give you much insight into how well they are performing or how
    they could be improved.


    In this chapter, we''ll review the main requirements of the technology needed
    to support one-to-one personalization. We''ll also provide tips on how to spot
    black boxes and other potential red flags with vendors.'
  - '[PAGE 183]


    # PERSONALIZATION AND CUSTOMER DATA PLATFORMS


    Throughout this book, we’ve made references to different technologies as your
    “personalization engine,” “personalization platform” or “customer data platform.”
    So you may be thinking, which of these do I need for personalization? Can one-to-one
    personalization be executed with just one solution? Or does it require an ecosystem
    of solutions working together?


    Unfortunately, the answer is “it depends.”


    No single solution on the market today offers the same feature set, nor do they
    all refer to themselves by the same name or category. You need to fully outline
    your company’s needs in the short and long term and compare that against the functionality
    offered in the market to find the solution(s) that best meet your current and
    future needs. However, we do have some recommendations for how to think about
    your tech stack.


    Data is the foundation of any good personalized experience—so first, you must
    collect information about a person. Then, you can decide which experience is the
    most relevant based on that information. With that in mind, you can think about
    your technology as serving two main purposes: insight and engagement.


    In this context, a **system of insight** aggregates customer/prospect data and
    enables analysis of that data.


    A **system of engagement** delivers experiences to customers/prospects in one
    or more channels and enables measurement of the outcome.


    Your tech stack must address both insight and engagement. Organizations sometimes
    break up their purchasing process for these capabilities into two parts. They
    may decide to purchase a solution that serves as a system of insight initially,
    while they decide to purchase or connect it to system(s) of engagement six to
    nine months later after they have made progress with the first solution. This'
  - '[PAGE 184]


    approach is primarily driven by the increasing attention on customer data platforms
    (CDPs)—which, as you''ll remember from earlier in the book, serve as a central
    location for customer data in an organization. In other words, a CDP is a system
    of insight.


    There are two main problems with separating CDP and personalization functionality
    into different systems.


    # 1. LIMITATIONS OF SEGMENTS


    Systems of insight are primarily designed to evaluate and identify audience segments
    and then pass the data about segment membership to a separate system of engagement.
