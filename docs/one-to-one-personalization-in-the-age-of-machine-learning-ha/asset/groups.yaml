    the 2008 financial crisis made the relationship-driven experiences that strengthened
    loyalty among existing customers even more critical.<sup>14</sup>


    During this period, a technological advancement central to one-to-one personalization
    emerged: real-time analytics. While the importance of consumer data was established
    in the early ’90s, the industry was realizing that the ability to access analytics
    in real time was absolutely essential to one-to-one customer interactions.


    Web analytics began with log files in 1993. At that point, every time someone
    visited a website, the browser made an HTTP request to the site’s server to load
    every item on the page. Since most websites were made up of only one static page
    of content, a single hit to the server represented one page view.<sup>15</sup>
    A record of all of these requests was stored in the log file, but it contained
    a lot of data and was complicated to decipher. As a result, site data was often
    the responsibility of a company’s IT department, and it was used primarily to
    understand site performance.<sup>16</sup>


    Some tools did crop up to make these log files easier to interpret by a company’s
    marketing team, such as WebTrends and Analog.<sup>17</sup> In 1995, a company
    called Web Depot was founded. While it was originally a web consultancy, it moved
    into web analytics when the team'
