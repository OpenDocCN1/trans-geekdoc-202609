    With so much to think about pertaining to personalization, larger organizations
    may consider establishing a “personalization management office” (PMO). As with
    a traditional project management office, a PMO allows organizations to build and
    scale a personalization program efficiently, forge accountability and ensure buy-in.


    A PMO should be comprised of individuals from across different business groups
    and act as the main personalization strategy and solution or technical resource
    for the company, as well serve as the point of coordination across business divisions.
    Since personalization can touch multiple channels and teams, the PMO group can
    help make sure that all areas of the business are working toward the same goals—ultimately
    preventing headaches and greatly increasing the likelihood of success.


