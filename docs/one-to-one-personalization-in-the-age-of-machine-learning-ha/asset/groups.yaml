    ## WHY YOU SHOULD CARE ABOUT PERSONALIZATION


    Ever since I started working in the professional world, I''ve needed to buy new
    suits and dress clothes about every six months. I would always go to a department
    store and wander around becoming increasingly frustrated. I didn''t know the current
    trends or the inventory and, frankly, didn''t want to invest the time to get to
    know them. I had a hard time selecting and matching fashionable clothes. Furthermore,
    even though I''d been shopping in the same store for years, the sales associates
    couldn''t easily help me because they didn''t know anything about me. I was on
    my own, wasting my time, and limiting my selections to basic blues and greens.


    Fast-forward to several years ago when, for my birthday, my wife gave me an appointment
    with a personal shopper, Phillip, at a different department store. Now, about
    every six months, I call Phillip and tell him what I need. He knows what I have
    in my wardrobe, and he knows what I like. He also knows what''s in stock, the
    styles that are trending and the sizes I wear. He considers my preferences in
    the context of the current styles, available inventory, and what other men like
    me are buying in order to pick out shirts, suits and ties that look good together
    and complement what I already have. Nowadays, when I go to the store to try on
    what Philip has selected, I typically leave with much more than I had planned
    on purchasing. Without a doubt, this is due to the great experience I had!


    What''s the main difference between my previously frustrating shopping trips and
    the enjoyable ones I now experience? Personalization. Personalization is the act
    of tailoring an experience or communication based on information a company has
    learned about a person. No one at the original store knew anything about me, so
    they couldn''t tailor my experience (it was unpleasant and unproductive as a result).
    Phillip, on the other hand, got to know me, and he makes my shopping experience
    easy and painless by tailoring it to my needs and tastes.


    Today, that level of personalization isn''t just achievable in a store with a
    personal shopper. Technology now allows us to personalize the digital experience
    too—down to the individual level.


    Here''s an example. My primary bank, where I have my main credit card and mortgage,
    proactively reached out to me with an email about refinancing and home equity
    loans. The email directed me to a landing page where I found information that
    got me to consider one of these offers. Later in the day, I went back to the site.
    It showed no knowledge of me. It didn''t mention loans or rates. I even went back
    to the site several times over the week as I comparison-shopped other banks. Eventually
    I took out a loan with one of those other banks. What could my bank have done
    differently?


    The bank could have paid attention to what I was doing—perusing the site for home
    equity line options, risks and rewards. I even put my information into the site''s
    calculator (how much clearer could I have been about my intent?!), but it didn''t
    take that data into consideration and turn it into an opportunity to talk to me
    in a personalized manner. It could have closed the sale by recognizing me and
    my intentions, guiding me to the information I needed, and highlighting the reasons
    I should do business with that bank instead of going elsewhere.


    When marketers think of personalization, they tend to associate the idea with
    certain major online brands, such as Amazon, Netflix and Spotify. They assume
    that personalization is out of reach for smaller companies with fewer resources.
    But the reality is that consumers are getting this type of personalized experience
    from a wide range of companies across channels. Consumers are beginning to expect
    that level of personalization from almost all of the companies they interact with,
    regardless of industry.


    Think about your life as a consumer. How many times has your bank communicated
    to you about a product you already have? How many times have you received an email
    from one of your favorite retailers announcing a sale in a category you''ve never
    shopped (like baby clothes if you''re not a parent or lawn care when you live
    in a high-rise apartment)? In your work life, how many times have you gone to
    a company''s website and been shown a video you''ve already seen, targeted to
    an industry that isn''t yours? Once you become accustomed to personalization,
    these become glaring mistakes. And even though these are simple examples, it''s
    at moments like these that you realize these companies don''t really know you,
    even when you''re a regular customer! And if they don''t know you, they don''t
    really deserve your loyalty.


    Personalization is the direction the world is heading. That''s not a prediction—it''s
    a fact. We''re seeing it now. It is currently impacting our lives as consumers,
    and it will increasingly become an imperative for marketers as time goes on. This
    is the reason I co-founded Evergage: to make it easy for businesses to realize
    this imperative.


    In this book, we describe the past, present and future of personalization. We
