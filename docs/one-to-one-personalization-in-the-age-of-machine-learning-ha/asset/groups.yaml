    your experience for you. In the first example, you’re intentionally changing the
    experience. In the second, you’re receiving more relevant ads without taking any
    action yourself.


    In the late ’90s, tools like BroadVision and LikeMinds were used to both personalize
    and customize, and both approaches were described as “one-to-one.” For personalization,
    BroadVision could leverage simple business rules (like in the “hot button” chat
    room example Peppers and Rogers cited). LikeMinds could provide product recommendations
    based on what “others like you” also shopped. While not technically one-to-one
    (more like one-to-many), these tactics are still a form of personalization.


    Yet the Toyota and Levi’s examples are more aligned with what we consider customization
    today. Visitors to Toyota’s site were able to customize and store their own virtual
    cars in their profiles, while Levi’s shoppers were able to customize their shopping
    experience by providing information about themselves. These early one-to-one attempts
    were valuable, but it’s worth making the distinction that they weren’t necessarily
    the type of one-to-one personalization that we think of today.


