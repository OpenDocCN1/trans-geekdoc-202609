    successfully engaging the right audiences through the right channels? Do your
    messaging and imagery across channels resonate with these audiences? Is there
    a new segment your company wants to better engage and convert? How can you make
    your cross-channel communication even more one-to-one? These are the questions
    that you should be asking as you think about and prioritize new campaign ideas
    and as you decide when and which campaigns to add. There is no universal recommendation
    on how many campaigns you should implement or how frequently you should launch
    them. But if you are not testing new campaigns, your program will certainly stagnate.


    ### Refine a few campaigns:

    Take a look at what you launched last week, last month and last year. Are all
    the campaigns still working? Could they work better if they were improved? Could
    you optimize your rules or algorithms or incorporate new creative? Don’t just
    set a campaign and forget it: test and tweak it until you see improvement—and
    come back to it now and then to ensure it still works.


    ### Discard a few campaigns:

    What worked in the past might not work now. Maybe that campaign that you tweaked
    to perfection several months ago finally ran its course. If you’re not seeing
    any gain from a campaign and all your adjustments aren’t helping, you should let
    it go. Also consider that messaging can become outdated, so you need to monitor
    your campaigns to ensure they’re on-message and on-brand. Toss, replace or update
    them once they’re not.


    ### Evaluate your backbone campaigns:

    Keep in mind that constant iteration doesn’t mean that you always need to be throwing
    out or refining all of your campaigns. Many marketers have “backbone campaigns”
    that they create, iterate on once or twice, and then let run continuously. These
    campaigns often dependably drive results while you are developing other ideas.
    You need to find the right mix that works for you and your organization. But don’t
    forget to evaluate these campaigns regularly to make sure they’re still working.


    Campaigns are challenging to prioritize and update, but their impact is indisputable.
    Use the above tips to develop your own repeatable process that drives a continuously
    improved experience for your visitors and customers.


