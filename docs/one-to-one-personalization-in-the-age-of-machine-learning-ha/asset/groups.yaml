    within the CDP, you cannot pass it to other systems to use in machine-learning
    algorithms. Instead, you can create segments within the CDP and pass segment membership
    to outside systems to use for activation.


    Passing data to outside systems also typically does not occur in real time. This
    is often acceptable for situations such as advertising, emails, push notifications,
    etc. But in situations where you want to respond to any information you have learned
    in real time, such as website or mobile app experiences as well as a call-center
    or in-store/in-branch interaction, real-time response is important.


    When your CDP acts on the data to personalize experiences across channels, it
    can do so at the individual level and in real time. We''ll get into a more complete
    conversation about personalization and CDP technology requirements in Chapter
    8.


    ## ELEMENTS OF GREAT DATA FOR PERSONALIZATION


    Think back to how we described bad data at the beginning of the chapter. Data
    can be “bad” for personalization when it’s inaccurate, outdated, insufficient
    or siloed. Good data, on the other hand, is:


    **Accurate:** Can you rely on your data sources? Consider weighing the cost of
    using any inaccurate source against the benefit of the information it gives you.


    **Real-Time:** Are you able to collect and act on your data in real time? Not
    all data needs to be real time, but some data could be outdated by the time it''s
    used. Think through your real-time needs.


    **In-depth:** Do you have enough data to fully understand each individual? You
    can get started with attributes and simple behavioral data, but truly individualized
    machine learning-driven experiences require in-depth data.


    **Modeled/Analyzed:** Can you analyze the data to understand individual preferences
    and intent? Can you leverage predictive models to make assumptions about the future?
    Making the most of your data means more than just collecting it; it means making
    inferences to understand what it actually means about each individual.


    **Centralized and Actionable:** Is all of your data in one customer data platform
    and usable by a personalization engine to deliver relevant experiences across
    channels? Most marketers have data siloed across their organization. Consider
    which data sources you need to deliver personalized experiences and how you can
    bring them together.


    The foundation of any one-to-one marketing strategy is the customer data. When
    thinking about your own sources of information and marketing technology, the data
    aspect can seem daunting. But it''s worth spending the time to find the right
    partners and data sources. Remember: bad data means bad personalization.


