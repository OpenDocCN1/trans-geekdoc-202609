    ## THE ABILITY TO MANAGE THE TECHNOLOGY WITHOUT THE NEED FOR IT OR ENGINEERING
    INVOLVEMENT


    If you are a marketer, you’ve probably experienced the pain that results from
    relying on other teams in your organization to accomplish your marketing goals.
    Whether you need assistance from engineering, IT, customer success or sales, it
    can be frustrating when other teams—weighted down with their own priorities—fail
    to put your initiatives at the top of the list. When it comes to something as
    important as the customer experience, you don’t want to wholly rely on others.
    So what can you do?


    With the right technology, you and your team should be able to launch, measure
    and adjust personalization campaigns quickly and easily on your own, without intervention.
    Yet the platform needs to be comprehensive enough to address all of your complex
    multi-tactic, cross-channel demands. With some vendors, a platform like this just
    does not exist.


    That said, if your IT and engineering teams are essential marketing partners,
    the right platform should provide the reporting, developer tools, interfaces and
    APIs to enable these teams to accomplish their goals as well. Make sure you understand
    everyone’s needs to determine whether prospective personalization solution vendors
    can meet them.


    ## ACCURATE ATTRIBUTION ANALYSIS


    As we described in Chapters 6 and 7, testing, analytics and attribution analysis
    are critical components of any personalization campaign. Without the ability to
    test, you cannot know if your campaigns are successful or if there is anything
    you can do to improve your approach. You need built-in testing and attribution
    analysis to iterate rapidly and ensure your experiences and algorithms deliver
    the best results possible.


    Some solutions are not transparent when it comes to attribution analysis. Some
    vendors will provide reporting on campaign results but not enable customers to
    run or manage those reports themselves. And many will boldly claim that their
    “black box” solutions have made you hundreds of thousands or even millions in
    incremental revenue—taking credit for growth that may have occurred anyway. When
    selecting a personalization solution, make sure that you have the ability to compare
    the results of every campaign against control and that the solution utilizes sound
    statistical science for accurate and defensible attribution analysis.


    ## HOW TO EVALUATE CDP AND PERSONALIZATION VENDORS


    When evaluating any new vendor solution, it can be a challenge to sort out real
    strengths from exaggerated claims. The terms used throughout this book—“one-to-one,”
    “real-time,” “intent,” “attribution,” “integrated”—are common buzzwords in the
    industry. They’re so frequently used that they can lose their meaning. Additionally,
    because virtually every email platform, CMS vendor, large technology company and
    small martech vendor has realized the critical importance of personalization and
    customer data, almost every such provider claims to be a personalization and/or
    customer data platform—whether they truly are or not.


    It is critical, therefore, to ask the right questions. The capability to implement
    one-to-one personalization is out there; it’s just a matter of finding the right
    technology for your needs. These questions should help you unravel and evaluate
    a potential vendor''s sales pitch.


    ### Does your solution allow for one-to-one personalization? If so, can I see
    a single unified customer profile?


    If one-to-one personalization is important to you (and we assume it is if you’re
    reading this book), then you need to make sure that each personalization vendor
    you consider can help provide true one-to-one experiences. Recall how in the ’90s,
    BroadVision positioned its product as “One-to-One” when it only supported simple
    rule-based communication to broad segments. Many vendors today remain about as
    vague about what their “one-to-one” solutions provide. Some only offer recommendations
    based on what other visitors have viewed; others merely enable you to create rules
    or pass data out to other systems to deliver personalized experiences to segments.
    These types of experiences are valuable, of course, but they’re not the unique
    experiences delivered at the individual level that a modern personalization program
    should support.


    To ensure that personalization can be delivered at the individual level, ask to
    see a vendor’s single, unified customer profile—the individual profile that stores
    all of the data on an individual person or, for B2B needs, on an individual account.
    If a vendor cannot produce one, or if it can only take in segment data from another
    system, it cannot effectively deliver on its one-to-one claims.


    ### What channels do you support? Are all channels supported by the same, unified
    platform and driven by the same, unified customer profile?


    The main channels we’ve identified are website, web app, mobile web, mobile app,
    email, search, digital advertising, social, direct mail and human. Make sure you
    determine which channels you want to personalize and then ensure that those channels
    are fully supported by the vendor. A vendor’s solution should be equipped to collect
    in-depth data from your selected channels, take in data from other systems, and
    deliver personalized experiences through these channels.


    It is also worthwhile to ascertain how support for each channel was built into
    the vendor''s solution. Did the vendor natively build the capabilities or gain
    them through acquisitions? If the latter, dig into how well the various acquired
    solutions work together. If they do not integrate seamlessly, there could be a
    lag when data is passed from one solution to another. Also, determine whether
    all cross-channel functionality can be managed from one platform and whether all
    data from each channel appears in the same unified customer profile. If not, executing
    cross-channel personalization—and real-time personalization especially—might be
    difficult or impossible.


    ### What data sources do you support and how easily can they be integrated?


    Think in advance about what data sources you plan to integrate and utilize for
    your personalization efforts. Do you have data in your CRM, email/marketing automation
    platform, data warehouses, or other places that you need in order to create a
    complete picture of each user (whether that person is known or anonymous)? If
    so, make sure that the data can be leveraged and integrated via out-of-the-box
    capabilities or robust APIs. You don''t want to sacrifice data that could be valuable
    for personalization.


    ### Can the platform pass data and trigger actions to other systems?


    Whether you''re looking for a standalone CDP, a standalone personalization platform,
    or a combination of the two, it won''t be the only system in your marketing tech
    stack. It should be equipped to pass data it collects or processes to any marketing
    technology you use, in batch or in real time.


    Triggered actions are an advanced capability that allow one system to immediately
    inform, update or direct other systems via workflows set up by business users.
    For example, the platform could trigger a task in the CRM to follow up with a
    target prospect account that just spent quality time on key pages of your site,
    or an automated customer service call from a call center to a customer who just
