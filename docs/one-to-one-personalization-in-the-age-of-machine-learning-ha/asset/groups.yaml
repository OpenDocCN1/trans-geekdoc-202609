    time and traffic to reach statistical significance (depending on the amount of
    traffic you have on your site). For example, with a 50/50 A/B test and a 10% control,
    45% of your users will see Test A, 45% will see Test B, and 10% will see nothing.
    But a four-combination multivariate test with a 10% control (as in the above example)
    will mean that only 22.5% of your audience will see each combination. Additionally,
    it is difficult to identify in an MVT test when one section of the test impacts
    conversion, but the other parts do not. For example, let’s say that the combination
    of Header 1 and Footer 1 is the winner. With an MVT test, there is no way of knowing
    whether the header or footer is driving the results.


    So when would you use an A/B test and when would you use an MVT test? The typical
    rule of thumb is that you should use an A/B test for major changes, such as the
    layout of a page, and an MVT test to fine-tune page elements to ensure that they
    all work together. Thus, an A/B test is ideal for testing a hypothesis when you’re
    seeking a specific answer to a question. For example, if you think that one experience
    would perform better as an inline message rather than a pop-up, you can run an
    A/B test to find out. Or, to determine if your shoppers are particularly brand
    loyal, you could test one algorithm for product recommendations that boosts brand
    preference against one that does not. Once you have defined which personalized
    elements work best, you can test all of those elements together with MVT to determine
    the most effective combination.


