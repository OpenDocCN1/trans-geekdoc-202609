    to leverage and drive significant value from this tried-and-true channel. As email
    inboxes become overrun, mail sent to physical inboxes can stand out. Of course,
    the same concepts of avoiding “batch and blast” generic messages apply to this
    inbox too.


    As with other channels, you want to use the data you’ve accumulated about your
    customers and prospects across touchpoints to reach them with effective messaging
    through the mail. You should aim to:


