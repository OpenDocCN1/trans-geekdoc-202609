    **Web Attributes:** These attributes are detected as soon as a person lands on
    a site. They are particularly valuable in helping you personalize an experience
    for first-time visitors who have not yet interacted with your site, although they
    can be used in many other situations as well. Some common web attributes include:


    +   - Geolocation

    +   - Source (such as search, email, social, paid ad, referring site, etc.)

    +   - Industry

    +   - Company

    +   - Company size (revenue or employee count)

    +   - Technology stack

    +   - Time of day

    +   - Browser type

    +   - Device type


