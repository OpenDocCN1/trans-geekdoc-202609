    ## SO WHAT DOES ALL THIS MEAN?


    What are we trying to say with this long example about segments and emails? When
    most standalone CDPs on the market, acting as systems of insight, pass data to
    systems of engagement, they do so at the segment level only. This can work in
    some instances, such as when you just want to send the same email to members of
    a loyalty program, as we explored in the beginning of the previous example. But
    if you want to send an email, display a web experience, target an ad, etc. containing
    the most relevant content to an individual, you need your system of engagement
    to be able to access individual-level data.


    Thus, our recommendation is to select your system of insight and your system of
    engagement at the same time so you''re thinking about the end-to-end process.
    You will likely find that combining insight and engagement functionality into
    one single solution is the best approach.


    One caveat here: Given the number of channels you will likely include in your
    personalization program, it is not realistic to assume that you will be able to
    find activation capabilities for all of them in one system of engagement. But
    the overall concept still applies: you want to limit the number of solutions you
    include in your personalization program to avoid unnecessary complexities and
    shortcomings.


    ## HIGH-LEVEL TECHNOLOGY REQUIREMENTS FOR PERSONALIZATION


