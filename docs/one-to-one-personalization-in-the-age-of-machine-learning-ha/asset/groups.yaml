  - '[PAGE 99]


    But matching isn’t a perfect science. Oftentimes, a CDP needs to use “fuzzy” logic,
    called probabilistic or heuristic matching. In these situations, there is no clear
    identifier. Instead, the CDP makes an educated guess about profiles that likely
    represent the same individual based on a combination of different data such as
    location, behavior, etc.


    One final note about identity. It’s certainly not ideal to have several profiles
    that reflect one individual, but it’s just as bad (if not worse) to have data
    from more than one person reflected in a single profile. In other words, it is
    essential that a CDP doesn’t incorrectly merge profiles together.


    Each business has a different set of identity sources and a different tolerance
    for error and false positives. It’s important to be able to add your own rules
    to instruct the CDP of your view of the trustworthiness of different data types
    and decide what action to take when there is a conflict. This is very business-specific,
    so a business should have control in this area.


    For example, you may want to ensure your CDP merges profiles if they match on
    one type of field, such as email address, but not on another, such as physical
    address. Other businesses may want to match on email address and physical address,
    but prioritize email over physical address. You may also want to value some sources
    more highly than others if two sources conflict. For example, the email address
    from which a person clicks through to the website may be more likely to be accurate
    than the email he adds to a website form (where he may add a fake email address
    to try to download a piece of content, for example). Or, for example, you may
    regard a customer’s loyalty ID as more trustworthy than the phone number.


    There are different scenarios that each business should explore to determine what
    logic makes sense to apply. Resolving identities correctly is critical to successful
    personalization, so it’s worth it to put in some work upfront to ensure the CDP
    takes the correct actions when merging and stitching profiles.'
  - '[PAGE 100]


    # ACTING ON CDP DATA


    The act of bringing data from across an organization into a central location,
    such as a CDP, isn''t something that a reasonable person would undertake just
    for fun. There must always be an end goal dictating how this data will be put
    to use. Most often, that goal is either analysis, activation or both.


    # ANALYSIS: COMBINING A CDP WITH BUSINESS INTELLIGENCE


    Let''s start with analysis. Businesses often have a lot of questions about how
    their business is doing and what it could be doing better. The challenge is not
    that the data doesn''t exist to answer these questions, it''s that the data is
    scattered across the organization.


    But once you have all of your data from many different sources together in a CDP,
    there''s a lot you can learn. You can answer nearly any question you can conceive,
    such as:


    +   * Which customers or groups of customers are most profitable to my business?

    +   * What do my profitable customers have in common? How are they typically acquired?
    Do they share similar demographics (for B2C) or firmographics (for B2B)? What
    are their interests?

    +   * How well do my marketing programs perform? Which marketing tactics appeal
    to which types of customers?

    +   * Which products most appeal to different customer segments? Do I have the
    right inventory mix to address demand?


    Most CDPs will offer the ability to do basic analysis on their own, but giving
    a business intelligence (BI) solution access to CDP data can answer these types
    of advanced questions that business analysts typically ponder.'
