    **Siloed Data:** Most marketers collect and store data on one individual in multiple
    places; in fact, Forrester found that marketers have customer data stored across
    15 different places, on average.41 This data can be found across CRM applications,
    loyalty systems, marketing automation platforms, analytics tools, data warehouses
    and other areas. Sometimes the challenge is that a company’s data is inadequate—specifically
    when it comes to behavioral data, as we’ll see later in the chapter. But more
    often, the company has plenty of data to use for personalization, but the data
    isn’t easily accessible through the silos. The ability to bring data together
    into a single location is a critical first step to one-to-one personalization.


    Clearly, if you have one or more of these issues with your data, your personalized
    experiences will be affected. And realistically, a personalized experience based
    on incorrect data isn’t truly personalized at all. It’s an endeavor that misses
    the mark.


    # DATA TYPES


    Throughout the book, we have described experiences and scenarios where data was
    collected and acted on to personalize an experience. But what specific data types
    are useful for personalization? Any data that gives a marketer insight into an
    individual can be used. That data typically falls into one of four buckets: attribute
    data, first-party behavioral data, survey data and third-party data.


    # ATTRIBUTES


    Attributes describe any characteristic of a visitor. They can be derived from
    two key sources:'
