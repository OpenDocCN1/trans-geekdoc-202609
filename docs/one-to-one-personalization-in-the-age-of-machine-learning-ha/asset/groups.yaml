    your site without engaging. But there are a few personalization strategies that
    you can use to help make your pop-ups more relevant and less intrusive:


    +   **Timing:** Time a pop-up to display only when a user demonstrates certain
    behaviors such as scrolling down a page, showing intent to exit, spending a certain
    amount of time on a page, or clicking a specific link.


    +   **Individualized Content:** Tailor the message content to the individual’s
    preferences or affinities. For example, an exit message (one that displays when
    a visitor is about to leave the site) could display a product that a shopper showed
