    need to make a call to the server if a page was loaded multiple times. As a result,
    visits that involved caching did not appear in the log file. Additionally, web
    pages became more complex to contain multiple files (such as images and videos),
    so multiple requests had to be made to a server to load every element of the page.
    This severely complicated the log files. 19


    Javascript tags overcame some of these challenges starting in 1997. Javascript-based
    analytics is based on URLs and cookies. A cookie generally represents one person,
    so Javascript tagging remains an easier way to understand an individual’s path
    through a site. 20 At this time, Urchin, while still predominantly log-based,
    added a product called Urchin On Demand that leveraged Javascript tagging. 21


    In 2005, Urchin was bought by Google. Urchin On Demand became the foundation of
    Google Analytics (while log-based Urchin was phased out), and Javascript tagging
    remains the dominant method for web analytics today. 22 Of course, these days
    Google Analytics is a dominant player in the web analytics industry, along with
    Omniture (now Adobe Analytics, which is part of Adobe Marketing Cloud).


    The evolution described above led to the development of real-time data in the
    late 2000s. Patric Timmermans, director of CRM at Infor in 2008, captured the
    spirit of the age—and its limitations:


    Customer dialogue has become the most important manifestation of one-to-one marketing.
    Companies used to cheer about having updated data every six weeks. Then they felt
    great about updating customer data every week. Now we’ve progressed to the point
    where companies can have constantly updated customer information, but I don''t
    think enough companies understand exactly how important real-time customer information
    can be. 23


