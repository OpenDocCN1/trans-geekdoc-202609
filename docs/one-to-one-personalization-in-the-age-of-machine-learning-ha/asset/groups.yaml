    # BOOSTERS


    Next, boosting allows you to incorporate and prioritize the specific preferences
    in brand, category, price range, color, gender, content type, keyword, etc. of
    each individual on your site. These preferences can be determined with deep behavioral
    tracking on each individual—incorporating not just what a visitor clicks on, but
    also mouse movement, scrolling, inactivity and time spent per page—combined with
    all the other customer data you have available to give a clear indication of preference
    and level of interest. We''ll cover this in more detail in Chapter 4.


    When you''re able to interpret all of your customer data, you can uncover the
    individual preferences and affinities of each person and use that information
    to “boost” the results of your algorithms and make them even more relevant at
    the one-to-one level. While advanced algorithms are already relevant at the one-to-one
    level, boosting allows you to individualize even basic algorithms.


    There are many different ways in which boosters can be applied to completely individualize
    your experiences and recommendations. They can ensure that a person’s favorite
    brands are prioritized across your site, that she sees recommendations within
    her preferred price range, or that she sees content related to her preferred topics
    or that aligns with her stage of the buyer’s journey.


    For example, if a shoe retailer selected a “trending” base algorithm for product
    recommendations on its homepage, it would show shoes that were most popular on
    the site at that time. To personalize those recommendations, it could choose to
    apply a brand booster. One visitor may see primarily Vans shoes, while another
    may see shoes from Steve Madden—based on which brands the visitor has shopped
    across channels. Note that while the original base algorithm would'
  - '[PAGE 45]


    only show any items that are currently popular, applying boosters allows the retailer
    to show popular items that are also relevant to the individual.


    In a similar vein, a B2B site can leverage boosters on its blog to provide relevant
    article recommendations to each shopper. It could select a “recently published”
    base algorithm to recommend the newest blog articles to all readers, then apply
    a category booster to make the recommendations personalized. One visitor might
    see recommendations for blog posts in the analytics category, while another would
    see recommendations in project management.


    Here’s one last example. A visitor researching credit cards on a banking site
    could be shown offerings that other visitors have looked at with a “co-browse”
    base algorithm. To make those recommendations more personalized, the algorithm
    could boost features that are most relevant to the visitor based on his individual
    preferences, such as co-branded cards or cash-back rewards.


    # USING BOTH BOOSTERS AND FILTERS


    It’s worth noting that boosters and filters may seem very similar, because you
    use them to account for the same variables (such as brand, category, price, etc.),
    but there are clear differences. Filters allow marketers to have more control
    over what *types* of items to show, while boosters allow marketers to individualize
    the *specific* items shown.


    Here’s an example. Many clothing retailers offer products across different categories
    (e.g. men, women, kids). One such retailer may choose to apply a category **filter**
    to recommend only other items on a PDP that are in the same category as the item
    being viewed. In that case, while viewing a woman’s shirt, the shopper would only
    see recommendations for other women’s clothing—not men’s or kids’ products. Clearly,
    the filter refines the products being recommended.'
  - '[PAGE 46]


    In this same example, adding a **booster** can further individualize the women''s
    shirts that are recommended. For example, adding brand and color boosters would
    leverage the shopper''s preferences in these categories, and the site would recommend
    women''s shirts in her favorite brands and colors.


    Similarly, a B2B site focused on demand generation could apply a filter to content
    recommendations on its homepage to only display eBooks, and not any other content
    type in its library. But the recommendations could be further individualized by
    applying a booster to highlight a specific eBook that would best fit the individual
    visitor''s stage of the buyer''s journey.


    Whether you choose to apply filters, boosters, or both is completely dependent
    on your goals and the needs of your specific visitors. Generally speaking, however,
    the more you can individualize your recommendations with boosters, the more effective
    they will be.


    # VARIATIONS


    Finally, you can decide to include some variations in your algorithms. These can
    take several forms. For example, you can set your homepage recommendations to
    be randomized (while still being relevant to each individual) so they stay fresh,
    or you could cap the number of times you show a recommendation to a person to
    minimize apathy.


    Like all of the other aspects of an algorithm that we''ve described in this chapter,
    whether or not you include a variation and which variation you choose is completely
    up to you. It depends on what you think will be most effective for the needs of
    your particular customers.


    # CASE STUDY: ZUMIEZ


    Zumiez—a multi-channel specialty retailer of apparel, footwear, accessories and
    gear for skateboarding, snowboarding,'
  - '[PAGE 47]


    ![](img/34aada5ba30e8eb5b09a67b70056753e_47_0.png)


    Zumiez leverages machine-learning algorithms to display individualized recommendations
    in the “You Might Also Like” section on this PDP.'
  - '[PAGE 48]


    and surf lifestyles—prides itself on its unique customer experience, and has been
    pushing the envelope to develop personalized experiences for many years. Zumiez
    shoppers are provided with true one-to-one experiences across the Zumiez site—from
    the homepage to checkout. Zumiez responds to shoppers’ individual preferences
    to guide which brands they see, which products they discover, and which content
    they are served.


    For example, Zumiez places recommendations in the “Complete the Look,” “You Might
    Also Like” and “Recently Viewed” areas on its product detail pages (PDPs). Zumiez
    also provides personalized recommendations directly in the search results to help
    shoppers more quickly discover new products. In both of these cases, a shopper’s
    preferred brands and styles are used to create relevant product recommendations.


    Zumiez’s efforts have paid off. Shoppers who view and click on a product recommendation
    on one of the site’s PDPs stay on the site nearly four times longer than those
    who do not click on a recommendation. And shoppers who click a product recommendation
    convert to a purchase 2.7 times more often than those who do not. These shoppers
    also spend 2% more per order.


    As the case study explains, Zumiez leverages highly individualized recommendations
    across its site and sees increased engagement, conversions and order value from
    them. Incorporating all of that data to deliver individualized experiences in
    real time would be impossible using rules. And while product recommendations date
    back to the ’90s, they were not complex enough to be personalized to every individual.
    That’s how machine learning is changing the game and realizing the one-to-one
    dream we’ve been promised for over 20 years.'
  - '[PAGE 49]


    While we''ll get into this in more depth later in the book, it''s worth noting
