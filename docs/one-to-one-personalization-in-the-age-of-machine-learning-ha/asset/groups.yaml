    # EMAIL


    Email undoubtedly remains a critical communication channel—one used by nearly
    all businesses today. When thinking about email, it’s always important to consider
    just how many emails your recipients receive each day. The Radicati Group estimates
    that in 2019, the total number of emails sent and received a day will reach 293
    billion. That number is expected to reach 347 billion by the end of 2023.³⁵ Cutting
    through that noise is absolutely critical for all businesses, and ensuring that
    each of your emails is relevant to every individual you reach is a great place
    to start. You don’t want to be tuned out.


    Many marketers already leverage personalization in their emails to some degree.
    In fact, email is the most personalized channel. Yet the majority of those marketers
    are simply incorporating a recipient’s first name or company name, or relying
    on basic segmentation to personalize their emails.³⁶ Those tactics are only the
    start. Let’s take some time to explore more advanced ways to personalize an email.


    # "OPEN-TIME" EMAIL PERSONALIZATION


    In order to ensure that the content of your emails is relevant to an individual,
    you need to consider all you know about that person across channels, particularly
    in terms of individual behavior, history and preferences. That can be accomplished
    by leveraging the same rules and algorithms we described in Chapter 2.


    But what is relevant to a person at one moment may be obsolete'
  - '[PAGE 61]


    to that same person later. And we all know that you have no control over how and
    when your email is opened and read. Once the email leaves your servers, the recipient
    chooses when to consume the information. He or she could open it within a minute,
    day or week from when it was sent.


    During this interval, circumstances can change. A recipient might have already
    viewed the content you sent, bought the product your email promotes, taken the
    action your email suggests, or changed his interests altogether. In order to be
    highly relevant to that recipient, the content of your email should be updated
    at open time.


    How does this work? Ordinarily, when an email is opened, the recipient’s email
    client (such as Microsoft Outlook or Gmail) sends a request to a server to provide
    any image(s) to display. If you are using open-time email personalization, the
    personalization platform would make a smart decision about what image(s) to show
    the moment the message is opened (or re-opened). This decision would be based
    on everything it knows about the recipient, taking into consideration all of that
    person’s up-to-the-minute behaviors across channels. The personalized content
    could be product recommendations, promotional offers, eBook or video suggestions,
    or simply informational messages.


    Let’s say, for example, that a retailer sends an email containing three product
    recommendations to a regular customer. Between the time the company sends the
    email and the moment the customer opens it, the customer has purchased Product
    1 via the mobile app, Product 2 went out of stock, and Product 3 dropped in price.
    When he opens the email, Products 1 and 2 would be substituted with different
    (but still relevant) recommendations, and Product 3’s price would be updated.


    Likewise, a web-based application can have an onboarding flow for its new users
    that contains several emails sent at predetermined times. If the second email
    in the flow contains a call-to-action to do something in the application that
    the user has already done, the email can instead suggest that she take another
    relevant action or recommend appropriate resources to her.'
