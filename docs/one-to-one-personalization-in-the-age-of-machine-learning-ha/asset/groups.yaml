    在此示例中，您将使用规则来实施该活动：如果访问者来自医疗保健行业，则显示医疗保健体验。规则为营销人员提供了一种简单的方式来个性化体验。它们非常有用，并且很可能始终会以某种方式用于个性化，但通常不应用于一对一沟通。机器学习正是在这里派上用场。虽然
    BroadVision 声称在 90 年代提供“一对一营销”，但其基于规则的系统实际上并不允许可扩展


