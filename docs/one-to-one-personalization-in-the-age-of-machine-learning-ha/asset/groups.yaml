    in advance (and getting any necessary approvals when appropriate). That way, if
    you see any negative effects during the test, you''ll be able to know when to
    stop the test before too much damage occurs. Some testers opt to keep testing
    samples low at first when a negative impact is a concern.


    # DETERMINE YOUR TEST DURATION BY YOUR BUSINESS CYCLE


    Most businesses see dramatic shifts in site activity depending on the day. Many
    B2B sites see the bulk of their traffic during the week— with a drop off on the
    weekends. Retailers may see traffic peaks during nights and weekends. With that
    in mind, it doesn''t make sense to run a test from Thursday to Sunday on any given
    week. because the results won''t control for any changes in behavior from the
    beginning of the week to the end. It also wouldn''t make sense to run a test for
    a week and a half (for example, beginning a test on Monday and ending it on Wednesday
    of the following week) because the results will reflect two Mondays, two Tuesdays
    and two Wednesdays but only one Thursday, one Friday, etc. This will skew the
    results.


    A good rule of thumb is never to run a test for less than a week — to ensure you
    see each day of the week reflected in the data — and to'
