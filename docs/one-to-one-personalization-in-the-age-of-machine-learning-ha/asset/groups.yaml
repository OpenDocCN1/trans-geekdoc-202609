    interactions was certainly clear. While only 18% of US households had internet
    access in 1997, by 2009 that number had grown to 74%. 13 Meanwhile, the 2008 financial
    crisis made the relationship-driven experiences that strengthened loyalty among
    existing customers even more critical. 14


