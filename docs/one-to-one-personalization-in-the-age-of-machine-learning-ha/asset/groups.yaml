    当 B2B 产品和服务通过销售人员销售时，销售过程可以轻松实现个性化：销售代表可以利用他们所了解的关于潜在客户的所有信息来指导对话并提供个性化建议。而且，当然，销售团队可以利用这些潜在客户的数字数据来进一步个性化互动（如我们在第
    3 章中所述）。


    但并非所有 B2B 销售互动都发生在客户与销售人员之间。有些 B2B 产品和服务是在线销售的。即使对于不在线销售的产品，当今的 B2B 买家在联系公司观看演示或与销售人员交谈之前，也会进行大量研究。因此，B2B
    营销人员需要在数字世界中提供尽可能好的体验。


    B2B 营销人员传统上采用数字个性化的速度比其 B2C 同行慢。但他们正在赶上！B2B 营销人员正在探索主要由 B2C 营销人员采用的数字策略——特别是机器学习个性化——但以其独特的方式。B2B
    营销人员已经明白，他们的买家也是消费者。他们还认识到，消费者期望是由世界各地的 Netflix 等公司设定的。通常侧重于内容营销而非电子商务驱动，B2B 公司了解使用个性化内容吸引潜在客户的价值。他们还认识到，购买决策通常在账户层面而非个人层面做出。B2B
    营销和个性化的未来将依赖于数据，以更好地理解账户及其中的个人，从而提供更相关的体验。


    ## 入站营销


    个性化可以在 B2B 网站上将更多访问者转化为潜在客户方面发挥关键作用。这适用于采用入站营销策略的组织，该策略的做法是基于搜索优化内容和在线广告吸引和吸引受众，然后以换取高级内容资产（如电子书和网络研讨会、产品演示或免费试用）的方式获取其联系信息。此类联系信息用于持续的培育营销和/或传递给销售团队进行跟进。采用这种方法，个性化用于向潜在客户提供最相关的内容和体验，以确保他们确实能找到足够的价值，从而“转化”并提供其联系信息。


    ## 基于账户的营销 (ABM)


    虽然入站营销对许多公司仍然有价值，但对其他公司来说，B2B 营销的未来在于基于账户的营销 (ABM)。采用 ABM 时，营销人员的重点是吸引目标账户、行业或子行业内的个人。采用纯
    ABM 策略的营销人员通常拥有售价更高、销售周期更长且仅适用于某些公司的产品。与纯入站营销策略（适合内部销售团队或电子商务方式）不同，ABM 策略通常受到侧重外勤销售的组织青睐。许多公司采用入站和
    ABM 策略的混合模式，介于两个极端之间。他们可以使用入站营销来获取小额交易的潜在客户，同时使用 ABM 技术来定位大客户。


    当有必要时，营销人员将越来越多地实施 ABM——主要是那些专注于在数字世界中接触目标账户（并确保每个账户都能收到能吸引其注意力的相关内容和信息）的人。因此，B2B
    个性化的未来在于找到正确的数据来源和策略，以可扩展的方式理解和接触这些目标账户。


    ## 无门槛内容


    近年来，鉴于 B2B 公司提供的内容过剩，潜在客户在研究初期越来越不愿意提供其联系方式。因此，越来越多的公司，尤其是采用 ABM 策略的公司，采用了“无门槛内容”的做法，以提升公司品牌知名度并适应不断变化的
    B2B 买家行为。


    一旦消除了内容消费的障碍，潜在客户就可以快速轻松地浏览公司的内容库，找到问题的答案并了解更多有关公司产品或服务的信息。他们不再需要评估是否能从内容中获得足够的价值，以证明放弃联系信息是合理的。从客观上讲，这是一种更好的体验。


    然而，这对负责生成潜在客户的需求生成营销人员来说是一个挑战。如果不要求提供联系信息，你如何获取潜在客户并传递给销售团队？在依赖门槛内容为其需求生成计划提供燃料十年或更长时间之后，他们需要弄清楚下一步是什么。对于精通技术的组织，特别是拥有顶尖个性化解决方案的组织，答案在于记住回访访客，并在不要求每次填写表单的情况下追踪人们。


    对于目前依赖 ABM 策略的人来说，无门槛内容的影响可能有限。这些公司不需要获取访问其网站的每个人的联系信息——只需获取来自目标账户的访客的联系信息。


    即使是那些继续运行传统入站营销策略的人，由于近年来其潜在客户数据质量下降，也可能不会注意到显著影响。在我们取消内容门槛之前，Evergage 内部数据显示，四分之一填写电子书表单的潜在客户被归类为“坏数据”（意味着
    25% 的填写表单的人使用了虚假或不准确的信息）。另外 30% 的潜在客户被归类为“不匹配”——他们不符合我们跟进的资格标准。此外，大量潜在客户被归类为“不感兴趣”、“无回应”或其他表明他们不是好潜在客户的类别。如果我们认为这些信息没有价值或无法使用，就不再要求下载者填写表单才能访问我们的内容，这已不合理。


    今后，需求生成营销人员需要找到其他方法将潜在客户引入漏斗，包括在访客无法填写无尽表单时如何识别网站上的访客——可能会利用本书中描述的某些技术。


    ## 第三方意向数据


    入站和基于账户的营销团队面临的一个挑战是，该过程涉及大量试错。通过入站营销工作生成的哪些潜在客户有价值且值得进一步投资？哪些策略能产生最好的潜在客户？哪些账户值得使用基于账户的营销策略投入时间和预算？通常，回答这些问题涉及测试不同的方法以找到最佳策略。


    对于 B2B 营销人员来说，一类新兴的供应商是提供“第三方意向”数据（也称为“B2B 买家意向数据”）的供应商。⁶⁸ 这指的是关于账户甚至个人的信息，根据他们在网上的行为（访问的网站/页面、下载的内容、参与的广告等），被发现对某些主题或解决方案领域表现出兴趣，这可能表明与公司产品或服务存在潜在匹配。其中许多供应商还提供销售情报功能，利用预测建模分析公司的历史潜在客户和机会数据，以识别和评分潜在客户，找出理想客户。⁶⁹
    这种方法消除了潜在客户评分中的一些猜测，并改进了细分、定位和销售跟进。


    在未来，这种预测式的 B2B 营销将变得更加流行，并将需要更多数据驱动的营销


