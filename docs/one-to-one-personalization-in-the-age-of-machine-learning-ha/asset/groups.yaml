    professionals to manage it. This is also where a CDP will be valuable. These marketers
    will be responsible for identifying, integrating and managing all the data sources
    needed to run successful lead generation and account-based marketing programs.
    They will also leverage AI technologies to pull actionable insights from that
    data and execute more effective cross-channel personalization.


    # DEMAND UNITS


    As they become more advanced in their targeting, B2B marketers will evolve beyond
    targeting accounts to targeting demand units. SiriusDecisions defines the demand
    unit as the group within the account specifically tasked with addressing a need.
    SiriusDecisions says that the “buyer, needs and solution must match for a demand
    unit to exist.” Essentially, ABM is not just about targeting companies that fit
    the profile your team has defined; it is about finding those companies that have
    also identified that they have “pain” around what your product or solution addresses.
    Recognizing those companies online requires much more precise targeting and must
    leverage first-party and third-party intent monitoring, advanced segmentation
    and more.


    To achieve success in the future, B2B marketers must become experts not only in
    their buyers’ pain points, but also in how to leverage data and technology to
    recognize which buying groups within accounts are actually experiencing those
    pain points and researching solutions to address them right now.


    # THE FUTURE OF ENGAGEMENT


    In the near future, personalization will move beyond just selecting the most relevant
    experience for each person within each channel, to'
  - '[PAGE 220]


    picking the _best channel_ to engage each person in the first place. Will each
    of your SaaS customers be more likely to react to your announcement of a new feature
    if you communicate it via email, push notification, text message or in-app message?
    Will each shopper respond to your requests to take a survey via an infobar on
    your site or an ad on Facebook? These are the questions that marketers have today,
    and the technology will certainly exist in the future to answer them.


    We’re not big fans of the phrase “right message, right place, right time” because
    it’s become a marketing cliché—and we believe no technology has been able to truly
    deliver on the “right place” aspect of this promise to date. But that will soon
    change, as the most innovative machine learning-driven personalization technologies
    will be able to understand each person’s levels of engagement with each channel
    over time and use that knowledge to predict their likelihood to engage with particular
    messages in those channels.


    Only when this is possible will we be able to fully deliver on the “right message,
    right place, right time” promise.


    # THE FUTURE OF THE TECHNOLOGY LANDSCAPE


    Selecting the best mix of technologies to execute a marketing strategy has never
    been more difficult. (Recall that in Chapter 6, we noted that the number of martech
    solutions has surpassed 7,000.) As marketers attempt to bring together more data
    sources to reach more consumers and business buyers across multiple channels,
    they are going to become frustrated by the siloed nature of these technologies.
    We will see a trend of marketers looking to do more with fewer solutions (i.e.,
    choosing fully featured platforms over one-off point solutions). The martech industry
    will likely respond to these'
  - '[PAGE 221]


    pressures with continued product development investments and more mergers and
    acquisitions.


    Of course, there will never be a single solution that marketers can use to address
    all of their needs and drive all of their activities. Many solutions, such as
    CRM and email marketing platforms, are deeply ingrained in the daily workflows
    of marketing teams. But we are starting to see the customer data platform emerge
    as the latest cornerstone martech solution (particularly because it collects and
    stores a massive amount of digital data, interprets it and makes it available
    for use across channels and other systems). Every new technology a company adopts
    must easily and seamlessly integrate with the many other martech products that
    exist and that will continue to be adopted. In short, to create a seamless customer
    experience, no piece of technology can be an island.


    # THE FUTURE OF PRIVACY


    Given all that we have described about the future of personalization, we also
    need to talk about privacy. Since the early days of digital personalization, the
    marketing world has been rightly concerned about the proper and ethical use of
    customer and prospect data. Privacy concerns have grown in recent years as laws
    and regulations have been enacted to protect consumers'' personal information.
    The most notable of these is the European Union''s General Data Protection Regulation
    (GDPR), enacted in 2018, that gives EU citizens the right to control how they
    are tracked online—whether the company they interact with is based inside the
    EU or not. The US state of California passed a similar version of the regulation
    shortly after GDPR went into effect.7


    While privacy should have always been a top priority for marketers, laws like
    these are requiring marketers to take privacy very seriously.'
  - '[PAGE 222]


    But prioritizing privacy doesn''t mean avoiding personalization. Today, consumers
    recognize that brands are collecting their information. They are generally comfortable
    with this arrangement, particularly when they believe that they are also benefiting.
    In a study by Microsoft, 54% of respondents indicated that they “expect brands
    to really know and understand them as people, and for communications to be tailored
    to their values and preferences.”72 To enjoy this level of personalization, they
    recognize that they need to share their data. But they also want brands to be
    transparent about data collection. The study found that 83% of consumers expect
    brands and advertisers to ask for their permission before they use their digital
    information.73


    In another study by Magnetic, 60% of respondents were comfortable with having
    their shopping interests and behaviors used by retailers to expedite their shopping
    experiences on the site, while 58% believed that the data would provide them with
    a better overall experience.74 Thus, a good rule of thumb is that if consumer
    data is being sold or will be used in unexpected ways, consumers want the ability
    to provide consent. At the same time, they’re generally comfortable with a company
    using their data to provide a better experience with that company.


    The best approach to providing personalization to your customers, prospects or
    shoppers is to focus on improving the individual’s overall experience. We always
    caution that it is not a good idea to personalize simply for the sake of personalization.
    Reminding someone that you know his name, location and past purchases across channels
    without providing any value can certainly come across as “creepy.” What is most
    important—both because it is the right thing to do and because it is best for
    your business in the long run—is that you add value for each visitor and customer.
    You always want to be looking to use your customers’ data to genuinely help them.
    And, of course, you should always obey the law.


    Outside of legal requirements, what is appropriate will vary greatly'
  - '[PAGE 223]


    from industry to industry and from business to business. For example, a fashion
    retailer can provide a valuable experience to its loyal shoppers with obvious
    personalization. Shoppers in the loyalty program could be greeted by name across
    the site and given access to a personalized boutique with products relevant to
    their stated or inferred preferences. But that type of obvious personalization
    might not be appropriate for a financial services site, for example. In that case,
    the site should subtly surface content based on a visitor''s lifecycle stage or
    past behavior. The person will probably not recognize that any personalization
    is taking place, but should be able to find helpful content more quickly and easily.


    In the future, as marketers seamlessly blend subtle personalization with intentional
    customization, consumer control will play a greater role in personalized experiences.
    For example, today Amazon provides the ability to remove purchases from data used
    to determine recommendations across the site. Going forward, more and more both
    B2B and B2C companies will offer individuals the opportunity to control which
    aspects of their profile will and won''t be used for a better experience. While
    the purpose of personalization is to provide more relevant experiences to individuals
    without requiring them to take any action, as personalization evolves, it will
    be more of a partnership between companies and consumers.


    # THE FUTURE OF MACHINE LEARNING


    In Chapter 2, we discussed machine-learning algorithms and how they power personalized
    experiences. We described that the way to customize your own algorithms is to
    start with one or more base algorithms and then layer in filters, boosters and
    variations to make them work for your organization and current needs. This is
    a great way for marketers or other business users without data science experience
    to control their own machine-learning algorithms.'
