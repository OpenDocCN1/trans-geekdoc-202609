    A premier consumer financial services company is a leading provider of private
    label credit cards in the US. Through its vast network of partners, the company
    offers a wide range of credit products for financing the purchase of various consumer
    goods and services. The company uses its homepage to promote offers from its retail
    partners from across the country. Real estate on the homepage is limited, so the
    company was unable to promote any regional offers—opting instead to focus on national
    retailers that were more broadly applicable to its visitors.


    By targeting the site’s promotions by geolocation, the company was able to build
    a single campaign with multiple'
