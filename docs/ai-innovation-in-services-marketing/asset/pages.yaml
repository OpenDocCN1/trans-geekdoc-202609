- pgno: 138
  md: 'not much has been done to see the mediating effects of gender and experience.
    Therefore, this paper addresses the question of how artificial intelligence influences
    job performance. We use gender as the moderator variable and experience as the
    mediating variable. To answer our research question, we collected data via online
    questionnaires, and we used EFA, CFA, and path analysis. The findings of our study
    can be summarized as follows: First and foremost, as argued in previous studies,
    we found a significant and positive impact of experience on the job performance
    of Tunisian employees. Second, we showed the absence of an impact of artificial
    intelligence on job performance. Meanwhile, gender has no influence on job performance.
    Finally, we highlighted that the mediating effects of experience and the moderating
    effects of gender have no impact on the artificial intelligence-job performance
    correlation.


    It is worth mentioning the major contributions of our research. First, our result
    depicts the fact that, while our chapter may not demonstrate a direct impact of
    AI on job performance, managers should be aware of the importance of artificial
    intelligence in their businesses. As artificial intelligence is rapidly changing
    the way companies operate, managers may consider the introduction and implementation
    of digital tools in their organizations to remain competitive. Specifically, AI
    is used in customer service, fraud detection, risk evaluation, etc. Second, managers
    must identify both internal factors (i.e., leadership, resources, and the culture
    of the company) and external factors (i.e., data accessibility and the regulation
    of the environment) that may affect the implementation of artificial intelligence.
    For instance, managers may need to focus more attention on small projects if the
    company lacks the resources to invest in artificial intelligence. Third, managers
    need to be aware of the negative effects of artificial intelligence on firm performance
    in order to mitigate them. For example, managers can help their employees learn
    new skills and train them in new technologies. This can reduce workers’ anxiety
    and uncertainty about their employment prospects. They can also effectively provide
    information about the new technology and participate with employees in the selection
    and adoption of the new technology (e.g., through questionnaires, organizing brainstorming
    meetings, etc.). Fourth, it is crucial to acknowledge that some gender stereotypes
    continue to exist in the workplace. However, we found that gender does not affect
    job performance. Therefore, managers should prioritize the selection and promotion
    of the top applicants, regardless of the candidate’s gender. Instead, they should
    make sure that every employee, regardless of gender, has access to equal opportunities
    and make judgments based only on each employee’s performance, skills, and qualifications.
    Indeed, they should promote a culture that encourages gender diversity, as it
    can result in a staff that is more creative, motivated, and productive. In addition,
    the finding that job performance is positively and significantly impacted by employee
    experience has'
