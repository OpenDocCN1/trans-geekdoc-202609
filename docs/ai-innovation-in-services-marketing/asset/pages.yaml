- pgno: 51
  md: '# CONCEPTUAL MODEL PROPOSAL


    As already mentioned, the role of AI has become central in optimizing business
    processes and in the ability to generate competitive advantages. However, the
    inclusion of AI in companies will quickly become a mandatory requirement for companies/brands
    to be able to respond effectively in an increasingly demanding time-to-market.
    In order to understand the role of AI and to design an AI layer in the context
    of companies/brands, this chapter presents a proposal for a conceptual model where
    AI plays a role in facilitating and empowering companies’ ability to understand
    their markets and, accordingly, to make better and faster decisions.


    The proposed model highlights the role of generative AI, which has resulted in
    a kind of democratization of the use of AI for the most varied purposes, whether
    in a context of personal use or in a context of business use. What is certain
    is that AI is no longer a “taboo” subject and/or mentally aligned with technological
    companies or pure research contexts.


    The emergence of many tools supported by AI, for multiple purposes and simple
    to use (e.g., ChatGPT), has made some of the tasks that were time-consuming and/
    or only within the reach of professionals with higher technological skills simple
    and fast for everyone. This reality – generative AI – which can be understood
    in its succinct flow of operation according to figure 1, has provided brand managers
    with a wealth of precious resources that empower their role and their ability
    to understand and make decisions. In this context, AI-driven tools will increasingly
    become productivity tools for marketers and business decision-makers.


    Even though the current stage of AI penetration in companies is the inclusion
    of AI-tools (and this stage will probably be maintained for a long time in small
    companies), the future will be the full addition of a whole new layer of AI in
    the remaining layers, and their processes, of organizations, as happened with
    the layer of classical information systems (non-AI).


    Think about how AI can be strategically and functionally included in companies,
    in order to create a functional link between understanding the market and, in
    particular, customers and their aspirations, and decision making, from its operational
    to strategic aspects, should govern any new information systems architecture.
    However, in our opinion, the inclusion of this AI layer should guarantee the most


    Figure 1. General workflow for making generative AI work (SAP SE, 2024)


    ![](img/4558324dacd73a542f4b08ede646650d_51_0.png)'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'automated operation possible, where AI can be an autopilot for the company
    that, without prejudice to the strategy approved by the human decision maker,
    is a layer that analyzes, understands and takes decisions.


    Figure 2 presents the proposed conceptual model, which is then described in terms
    of its main components and respective contribution.


    The model presented targets large companies, which have the financial and technological
    capabilities to implement (or subcontract the implementation) an AI layer across
    all business processes. In the context we explore, small and medium-sized companies,
    which do not have the capacity for such implementation, will take advantage of
    the AI-tools but will not be capable of implementing an implementation similar
    to what we propose.


    A typical company that the model contemplates is a holding company, which has
    several brands, in different business sectors and/or in the same line of business.
    In this context, there is a need to manage several brands.


    The model presents the “autopilot” vision for brand management, which means that
    it is up to AI to understand how to manage a given brand, whether through the
    extinction or creation of brands. It is up to AI to understand the insights that
    intelligent analysis of data obtained through customer interactions can offer.
    In this way, the company’s response could be the extinction of a brand that is
    not profitable and/or the creation of new brands that embody new products that
    will predictably be successful with customers. The capacity for such perception
    materializes a concept where a brand and its products can be the result of the
    customers’ vision and not the company’s own – customers design the products that
    the company should offer them, shaping them over time.


    # Figure 2. Proposed conceptual model


    ![](img/4558324dacd73a542f4b08ede646650d_52_0.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: 'The Generative AI CRM engine is responsible for managing all the channels that
    brands have to manage their relationships with their customers (e.g., chatbots,
    social networks). This engine is capable of personalizing interactions with each
    customer by taking advantage of customer input to understand their profile at
    all times. Generative AI plays a key role here due to its ability to constantly
    adapt the way in which customer interests are managed, combining them with business
    interests. The ability to perceive insights turns the vision of managing a brand
    and creating or modeling new or existing products into a linear process of managing
    interests where supply tends to adapt to demand in a “perfect” way.


    This approach will contribute to generate in customers a greater sense of belonging
    to the company and a connection that induces in the customer a feeling of almost
    apparent control – the customers feels that they are the focus in a more tangible
    way.


    Upstream of the proposed model is the business process management engine through
    generative AI. This component uses AI to obtain insights into the downstream functioning
    of the model (i.e., the customer interaction component), allowing the company’s
    strategic management level to evaluate and validate proposals for creating new
    brands and products. This component also allows you to generate AI-driven knowledge.


    In this way, better, more effective and faster strategic decisions will be made,
    feeding and empowering top management tasks and marketers who will refine their
    strategies with greater probability of success.


    However, the vision of a conceptual model that tends towards a state of perfect
    equilibrium is not without limitations.


    It is important to understand that generative AI brings with it a very important
    set of strengths and opportunities. However, like any technology, it has weaknesses
    and threats. Figure 3 succinctly presents the result of a reflection on generative
    AI in the form of a SWOT analysis.


    Competition will continue to exist between organizations that have the capacity
    to implement such models. The evolution of generative AI (e.g., as we see in the
    ChatGPT example) will be constantly evolving, with better models and more accurate
    capabilities for predicting and understanding insights. We are of the opinion
    that in the near future, the quality of the AI that a given company can develop
    or acquire (from companies specialized in AI) will be the most important asset
    and the greatest generator of the degree of success and competitive advantage
    that the company can have. The very computational capacity that a company disposes
    will influence its ability to obtain better and faster insights. The field of
    research about the role of human intuition in decision-making will be called into
    question as never before. Will visionaries continue to exist? Here’s a reflection
    that doesn’t fit into this work, but we find appealing – the human factor in the
    success of organizations, in a world of AI.'
