    and abilities required to use AI technologies. Therefore, we make our main hypothesis:


    H1: Artificial intelligence has a negative effect on job performance.


    # 2.2. Gender and Job Performance


    Job performance, which refers to the extent to which workers perform their jobs
    within the rules set by the institution (Al-Makhaita et al., 2014), depends on
    many factors such as age, marital status, education, experience, and gender (Absualma,
    2021; Banjo & Olufemi, 2014; Khan et al., 2022; McDaniel et al., 1988; Quiñones
    et al., 1995).


    There are conflicting results regarding the effects of gender on job performance.
    Actually, it is difficult to compare the performance of men and women in identical
    activities (Rydstedt et al., 1998). This may be explained by differences in gender
    characteristics or the biological differences between men and women (Banjo & Olufemi,
    2014). Absualma (2021) indicated that gender statistically influences job performance
    in Jordanian commercial banks. In detail, men perform better than women. This
    could be due to the fact that men are perceived as more competent and successful,
    as they are more inclined to take risks. In addition, Khan et al. (2022) found
    that gender significantly moderates the relationship between transformational
    leadership and job performance. They claimed that male employees are more likely
    to benefit from transformational leadership compared to female employees. In fact,
    men and women may react differently to the many facets of transformational leadership.
    Furthermore, Banjo and Olufemi (2014) examined the relationship between demographic
    variables (i.e., age, marital status, educational qualification, job tenure, and
    gender) of 113 insurance salesmen and their job'
