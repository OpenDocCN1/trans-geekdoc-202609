    All marketing techniques and tactics that were based on products and other tangible
    goods—also referred to as “goods-dominant logic”—were attacked by Vargo and Morgan
    in 2005. They published S-D logic, which argued that the exchange of services,
    as opposed to only things, is what society, markets, and organizations are most
    concerned with. When it happens, one service is swapped out for another. Additionally,
    they emphasized how all markets are built on the exchange of services, all communities
    have service-based economies, and all firms are service enterprises. To focus
    on service-dominant logic, marketers must switch from G-D reasoning to S-D logic
    and redefine their fundamental methodologies, concepts, ideas, and strategies.
