  md: 'explained that AI can lead to fewer chances for collaboration and job rotation.
    Therefore, employees may feel isolated, insecure, and demotivated. In fact, the
    development of AI may reduce the need for human labor in certain industries. Li
    et al. (2019) suggested that hotel staff members who know more about artificial
