  md: 'performance. They concluded that there was a moderately positive relationship
    between the variables studied and job performance. They also added that about
    13% of the elements influencing insurance salesperson performance may be explained
    by the five demographic characteristics studied. In contrast to previous contributions,
    other studies have shown that companies that reach a critical mass of female employees
    (i.e., more than 35% of the total employees make gender token effects disappear
    (Joecbs et al., 2013; Kanter, 1977). In the same context, Shirom et al. (2008)
    synthesized 30 independent studies to identify the extent to which three sociodemographic
    variables (i.e., gender, age, and tenure) mitigated the meta-correlations of role
    conflict and role ambiguity with job performance. They concluded that gender and
    tenure had no moderating effects. However, Mackey et al. (2019) have shown that
    women generally perform better in the workplace than men, and this difference
    does not seem to change depending on the percentage of women in the company (i.e.,
    women outperform men by an average of one-tenth of a standard deviation). Many
    factors play an important role in predicting women’s performance, such as government
    backing, land ownership, taxation, educational level, prior entrepreneurial experience,
    access to information and financial support, etc. (Alene, 2020). Based on these
    previous findings, we propose the following hypothesis:


    H2: Gender statistically influences job performance.


    # 2.3. The Role of Gender in the Relationship Between AI and Job Performance


    As discussed above, gender is an important individual characteristic that significantly
    influences job performance (Abusalma, 2021; Hoque et al., 2019; Khan & Vieito,
    2013). On the one hand, many contributions (Abusalma, 2021; Allison et al., 2023;
    Hoque et al., 2019; Igbaria & Shayo, 1997) ascertained that men tend to outperform
    women. Due to their talents and diligence, only male employees were more likely
    to achieve excellent performance (Igbaria & Shayo, 1997). On the other hand, Kiefer
    et al. (2022) stated that male-led businesses perform better than female-led businesses.
    However, they also added that female-led companies are outperforming their male-led
    competitors in terms of performance results in certain instances. In the same
    vein, Khan & Vieito (2013) stated that companies tend to have the lowest levels
    of risks when it is led by female CEOs. Therefore, this reduced amount of risk
    may help the company perform better.


    Other studies have looked at the way AI systems affect men and women. Despite
    the ever-evolving global technical landscape, women’s participation in the field
    of artificial intelligence remains disproportionately low (Samuel et al., 2020).
