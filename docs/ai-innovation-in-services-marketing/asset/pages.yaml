    their departure from Vilnius. (A visualization of these texts is shown in Figure
    2.)


    With guidance from a marketing team to a creative agency regarding the campaign’s
    concept and tone of voice of the game characters, artfully designed narratives
    were employed on the postcards. These narratives effectively communicated the
    journey, immersing recipients in their fictional adventure and providing an engaging
    glimpse into Vilnius and its potential for future game development collaborations.
    This innovative approach aligns with the research conducted by Brynjolfsson and
    McAfee (2014) on AI-driven personalization, which enhances engagement and fosters
    a deeper connection. It is worth emphasizing that each card included a QR code
    (see Figure 2) that directed individuals to the game development landing page
    on the Invest Lithuania website when scanned. Furthermore, each postcard incorporated
    symbolic details associated with the game character to elevate the sense of personalization,
    for example, the inclusion of bird-foot prints. According to Upadhayay and McCormick


