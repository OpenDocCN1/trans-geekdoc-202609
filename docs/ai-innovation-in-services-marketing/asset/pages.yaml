    qualitative research collects the data and examines the reasoning behind the answers
    provided. Therefore, this research method helps to get a bigger picture of each
    subjective opinion, expanding the value of the provided answers, which can help
    develop strategies for optimizing engagement in digital marketing campaigns.


    # Research Samples and Sampling Procedure


    The interviews included a sample of Digital Marketing Campaigns potential customers.
    Two demographic groups were examined: a younger group from 20 to 30 years old
    (A20-30), and an older one from 40 to 50 years old (A40-50). Both groups’ of respondents
    were selected only if they engaged with digital marketing campaigns specifically
    in Lithuania in the previous two months. The semi-structured interviews provided
    a deeper comprehension of the research topic while comparing two distinct age
    groups, helping to identify any similarities or differences between their engagement
    level. A flexible approach to these interviews enables the different opinions,
    preferences, and attitudes of each participant, offering new thoughts and perspectives
    on the factors that could increase customer engagement levels.


    Non-probabilistic quota sampling was used to select ten candidates based on defined
    criteria. Respondents were chosen specifically depending on the factors needed
    for the interview, such as age, location, and the level of interaction with the
    digital ads. The judgmental sampling was used by the researcher as it was assumed
    that certain features and criteria for the sample can reflect the population (Efil
    & Negida, 2017). In this case, respondents were chosen according to their age
    category and the action they recently completed online – either clicked or bought
    something from the ad. This method helps to identify the most recent population’s
    needs and wishes and understand how digital marketing campaigns can increase engagement
    through the respondents’ perspectives. Non-probabilistic quota sampling is especially
    helpful when the researcher wants to make comparisons of different'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'groups while trying to understand if their behavior differs or not. Therefore,
    the experiences and insights gained from the respondents of different age categories
    are valuable in helping better understand how to create a positive experience
    with digital marketing campaigns.


    # Research Instrument


    The research instrument used in this study was semi-structured interviews. They
    enabled to provide more precise insights into the topic of what makes respondents
    interact the most with digital marketing campaigns, helping to broaden the experiences
    of each answer.


    The semi-structured interviews were divided into four question groups, which consisted
    of different questions that were supported by theories discussed in a literature
    review part (Table 1). The first question group focuses on questions that reveal
    if the respondent is suitable for the research based on the defined criteria.
    The second question group explores different consumer preferences and behaviors
    with digital ads. The third question group goes deeply into the topic of online
    engagement experiences, trying to get insights about personalized content and
    components that can improve each experience. Finally, the last question group
    focuses on customer engagement dynamics and tries to obtain some suggestions for
    increasing customer engagement and identifying the drawbacks of digital marketing
    campaigns. Respondents were invited to elaborate on each question, providing their
    suggestions and thoughts in detail to get an extensive understanding of their
    experiences. Moreover, at the end of the interview, respondents could provide
    more perspectives on the research topic if they found it relevant.


    # Research Process


    Before starting each interview, participants were asked to fill in a consent form
    that their answers could be later used in the research while complying with data
    protection standards. At the start of each interview, respondents were also asked
    if they allow to record the audio of the interview to get their consent to record
    their answers. Later on, the research topic and goal were explained for the interviewees
    to understand their contribution to the research. The respondents were able to
    ask any questions before and during the interview to get any clarifications needed
    and create an open and comfortable environment for them. Question 5 was explained
    in detail to make it easier for the respondents to understand and answer the question.
    When respondents found it difficult to express their preferences, follow-up questions
    were asked to remind them of some experiences or help to get some ideas.'
