  md: '# 4.3 Confirmatory Factor Analysis and Path Analysis


    To find the underlying factor structure of a data collection, we employed confirmatory
    factor analysis (Jöreskog, 1969). We used IBM SPSS AMOS.26 to perform confirmatory
    factor analysis, test hypotheses, and analyze coefficients’ paths. The maximum-likelihood
    estimator is employed to run the model.


    Three categories of model fit (i.e., absolute fit, incremental fit, and parsimonious
    fit) are considered to evaluate our model. Absolute fit contained GFI (Goodness
    of Fitness Index) = 0.997 ≥ 0.80 (Hashmi et al., 2020), RMSEA (Root mean square
    error of approximation) = 0.035 ≤ 0.08 (Hair et al., 2010); incremental fit comprised
    CFI (Comparative Fit Index) = 0.997 ≥ 0.90 (Bagozzi & Yi, 1988; Hair et al., 2010),
    TLI (Tucker-Lewis Index) = 0.984 ≥ 0.90 (Bagozzi and Yi, 1988), IFI (Incremental
    Fit Index) = 0.997 ≥ 0.90 (Bollen, 1990), NFI (Normed Fit Index) = 0.990 ≥ 0.80
    (Bentler & Bonnet, 1980), AGFI (Adjusted Goodness of Fit Index) = 0.975 ≥ 0.80
    (Jöreskog & Sörbom, 1993); and parsimonious fit included chi-square normalized
    by degrees of freedom (Chisq/df)= 1.436 ≤3 (Bagozzi & Yi, 1988; Kline, 1998),
    PNFI (Parsimony-Adjusted Measures Index) = 0.198 >0.05 (Bentler & Bonnet, 1980).
    Our research revealed that all fitness indicators had been attained and were deemed
    to be sufficiently error-free.


    Structural equation modeling technique (SEM) is employed to conduct a path analysis
    for the relationships among variables in our model. We also used the statistics
    resulting from the path analysis to test our hypotheses (see Table 6).


    According to Table 6, increased awareness of artificial intelligence does not
