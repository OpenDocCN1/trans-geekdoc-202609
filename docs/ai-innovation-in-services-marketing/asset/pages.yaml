    automate various marketing actions, among others.


    By analyzing the feelings of the target audience and/or consumers on social

    networks and other online platforms, it will be possible to obtain feedback on

    how brands are being received by the market and monitor the public’s reaction
    to

    communication based and marketing actions and campaigns.


    AI can, based on data analysis, help predict future trends, anticipating market

    demand. This forecast may allow you to adjust and adapt the launch strategy for

