  md: 'numerous managerial implications: (1) managers have to create a positive work
    environment, such as by developing programs for training; (2) they may classify
    employees based on their experience history to identify high-potential workers.
    Therefore, these high-potential workers may be considered for future leadership
    roles; (3) the employee experience may be greatly improved by giving workers the
    freedom to give feedbacks, propose ideas, decide for themselves and to accept
    responsibility for their job. As a results, managers should be more participative
    to promote engagement and satisfaction.


    Nevertheless, our paper is also subject to some limitations. The first limitation
    is the fact that the outcomes of our research are limited to employees in Tunisia.
    Therefore, our work highlights an opportunity for future researchers to engage
    in empirical studies to investigate the impact of artificial intelligence on job
    performance in different countries to generate our results. First, our paper used
    quantitative techniques as a method of data collection and analysis; therefore,
    future studies may employ other techniques (i.e., case studies, interviews, longitudinal
    studies). For instance, longitudinal studies may track the impact of AI over time.
    Second, there may be gender-specific differences depending on the type of work.
    Thus, it would be interesting to investigate how AI could be used to automate
    manual tasks and how this may affect gender differences in work performance. Third,
    AI''s effect on work performance is complicated and dependent on several variables.
    Future research could, for example, investigate how different AI systems such
    as machine learning, deep learning, and natural language processing affect different
    work tasks. Fourth, employees in our study came from a variety of industries (primary,
    secondary, and tertiary). Thus, researchers may look at how artificial intelligence
    affects work performance in certain sectors. In fact, the adoption of AI may have
    a greater influence on some industries than on others. Fifth, future studies may
    include other moderators/mediators’ variables, such as leadership style.


