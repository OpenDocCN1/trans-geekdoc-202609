- pgno: 308
  md: '# About the Contributors


    Ricardo Correia, with an academic career started in 2003, is Associated Professor
    at the Polytechnic Institute of Bragança (Portugal), where he is the head of the
    Master programme in Tourism Marketing, and visiting Professor at ISM University
    of Management and Economics (Lithuania). Ricardo has served as an external consultant
    in programs such as the European Union Agris Program and Interreg and as consultant
    for Deloitte & Touche. We should also emphasize his regular participation in research
    programs, conferences and international scientific meetings, as well as the publication
    of several chapters in books and articles in international journals.


    ***


    Sathish Kumar B., a distinguished Master of Commerce teacher, brings expertise
    and passion to the classroom with dynamic teaching style and extensive research
    contribute to an enriching educational experience.


    Monika Belhaj obtained her Doctor of Philosophy degree from the University of
    Tasmania, Australia, with a specialization in Management and Commerce. With a
    rich teaching background, she has covered various subjects, such as Project Management,
    Creative Leadership and Management. Furthermore, she has actively contributed
    to several research projects, serving as both a research developer and implementer.


    Oindrila Chakraborty is a gold medalist in her MBA programme from University of
    Calcutta. She has 15 years of teaching experience in management education. She
    has completed her PhD from University of Calcutta and has several publications
    to furnish in National and International Journals of high repute.


    Rta Fontes is a dedicated Ph.D. student specializing in Tourism at Aveiro University.
    With a passion for exploring the fascinating world of travel and leisure, she
    has delved deep into the realm of tourism behavior and spatiotemporal tracking.
    Ruta’s academic journey has been marked by a commitment to research excellence,
    with numerous publications including papers and book chapters.'
  merge: -1
  img_proc: true
- pgno: 309
  md: '**João Pedro Gomes** is an assistant professor at the Instituto Politécnico
    de Bragança (Portugal), where he teaches computer networks and programming. He
    is also the coordinator of the Computer Resource Center and the coordinator of
    the Higher Professional Technical Course in Informatics. He is interested in IoT
    and artificial intelligence, among other areas of research.


    **Richika Jeswal** is currently working as Associate Professor in Amity School
    of Business, Amity University Noida. She has a rich teaching experience of over
    20 years. She did her Ph D from Aligarh Muslim University and MBA from Lucknow
    University. Her research interests’ areas are in the field of Customer Relationship
    Management, Sustainability, Entrepreneurship and the newer trends of Marketing.
    She has several research papers to her credit. She is a part of the review board
    of various indexed journals and book publishing house. She has been associated
    with many conferences and FDPs of premium institutes. Her forte lies in grooming
    the future of young minds. She has been instrumental in shaping the careers of
    several students of BBA over her entire career stint. Her forte lies in teaching,
    tutoring and mentoring students.


    **Sridhar Manohar** currently working In Doctoral Research Center, Chittkara University,
    completed his doctorate in the area of Services Marketing from VIT Business School,
    VIT University. He has a Bachelor of Technology and Dual Masters in Business Administration
    and Organization Psychology. Dr. Sridhar further certified with FDP at IIM-A.
    He is expertise in Service Marketing, Innovation and Entrepreneurship, Scale Development
    Process and Multivariate Analytics and interests in teaching Business Analytics,
    Innovation and Entrepreneurship, Research Methodology and Marketing Management.
    He has published around 20 research papers that includes Scopus listed and ABDC
    ranked International Journals like – Society and Business Review, Benchmarking-An
    International Journal, Electronics Market, Corporate Reputation Review, International
    Journal of Services and Operations Management, International journal of Business
    Excellence and presented papers and ideas in numerous international conferences.


    **Mnica R.** is a Master of Commerce student with a strong passion for finance
    and business strategy, combining theoretical knowledge with practical insights.
    Strong analytical skills, effective communication, and continuous learning contribute
    to academic community, aiming to make impactful contributions in finance and strategic
    management.'
  merge: -1
  img_proc: true
- pgno: 310
  md: '**Carlos Rompante Cunha** is PhD in Computer Science from the University of
    Trás-Os-Montes e Alto Douro, Portugal. He is an Adjunct Professor in the Department
    of Informatics and Mathematics, EsACT-IPB. He is/was research member for 4 research
    projects and is currently co-adviser of 1 PhD student. He published +100 papers
    in international journals and conferences. He is also member of several International
    Journals and Conference’ Scientific Committees for which frequently review papers.
    For several years, he was director of the Informatics and Communications BSc,
    and Coordinator of the Department of Informatics and Mathematics, EsACT-IPB. He
    was also coordinator of the EsACT-IPB Computer Resources Center. He is currently
    vice-dean of EsACT-IPB. Teaching Fields: Programming Languages and Distributed
    Systems. Research topics: Pervasive and Mobile Computing, Distributed Systems,
    IoT, and Machine Learning.


    **Aswin Soju** is a dedicated Master of Commerce student with a passion for finance
    and business strategy. Known for academic excellence, this individual combines
    theoretical knowledge with practical insights gained through internships and extracurricular
    activities. Strong analytical skills, effective communication, and a commitment
    to continuous learning define their approach. Engaged in research projects, they
    contribute to the academic community. Adept at collaborating in diverse teams,
    they bring a proactive mindset to problem-solving. Eager to leverage their skills
    in the dynamic world of commerce, this M.Com student aspires to make impactful
    contributions in the realms of finance and strategic management.


    **Bruno Barbosa Sousa** is Adjunct Professor of Marketing at Polytechnic Institute
    of Cávado and Ave (IPCA), Portugal and PhD in Marketing and Strategy in Universidade
    do Minho, Portugal. Head of Masters Program - Tourism Management and Marketing
    Tourism (IPCA); CiTUR – Center for Tourism Research, Development and Innovation
    and UNIAG research member. He has published in the Journal of Enterprising Communities,
    Tourism Management Perspectives, Current Issues in Tourism, Journal of Organizational
    Change Management, World Review of Entrepreneurship, Management and Sust. Development,
    among others. https://orcid.org/0000-0002-8588-2422.aac5d92a-6e64-4f88-8f01-362429bd4dc7


    **Oumeima Toumia** is an assistant at IHEC of Sousse. She earned her Ph.D. in
    management (Business administration) from the Higher Institute of Management of
    Sousse. Her teaching experience was acquired through her position as an assistant
    from 2016 until 2023. She published papers in high-ranked journals and participated
    in international conferences. Her research interests include status quo, venture
    capital, digital transformation, artificial intelligence, firm performance, COVID-19,
    etc.'
