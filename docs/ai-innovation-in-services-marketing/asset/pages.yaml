  md: 'human judgment and creativity cannot be replaced by AI, (2) AI cannot replace
    interpersonal interactions, and (3) decision-making processes are altered by the
    integration of AI, which leads to job displacement in the social and economic
    domains (Rawashdeh, 2023). Moreover, we have found that gender has no impact on
    job performance (β = 0.055; p = 0.595 > 0.05) (hypothesis 2 is not supported).
    There is no consensus on the impact of gender on job performance. Some studies
    (Mackey et al., 2019; Shirom et al., 2008) have found that there are no significant
    differences in job performance between men and women (Shirom et al., 2008), while
    others support the effects of gender on job performance in certain areas (Abusalma,
    2021; Banjo & Olufemi, 2014; Khan et al., 2022). Our result may be explained by
    the fact that there are no differences between men and women in terms of education,
    experience, funding opportunities, or cognitive capacities (i.e., problem-solving
    ability, creativity, etc.). Therefore, men and women are equally good at the majority
    of occupations. Contrary to our expectations, we found that hypothesis 3 (i.e.,
    moderation of gender has a significant effect on the relationship between artificial
    intelligence and job performance) is not supported. Due to the fact that artificial
    intelligence is not designed to discriminate based on gender, gender has no effect
    on the relationship between AI and job performance. AI is a technology that can
    help people of all genders perform better in the workplace (i.e., AI can make
    workers of both genders more effective and productive). Furthermore, we found
    that the experience of the employee has a positive and significant effect on job
    performance (hypothesis 4 is supported). This implies that job performance increases
    with an increase in employee experience (Abusalma, 2021; McDaniel et al., 1988;
    Quiñones et al., 1995; Ratwani et al., 2020; Schmidt, 1988). This is due to the
    fact that experienced employees are better equipped for their tasks as they have
    more knowledge, expertise, and skills. Finally, hypothesis 5 (mediation of experience
    has a significant effect on the relationship between artificial intelligence and
    job performance) is also not supported. Actually, artificial intelligence may
    be applied to enhance the job performance of workers of all experience levels
    (i.e., applications of artificial intelligence are not biased against employees
    with less experience).


    # 5. CONCLUSION


    Much attention has been given to understanding the potential impact of artificial
    intelligence on job performance (Abusalma, 2021; Larivière et al., 2017; Prentice
    et al., 2020; Wijayati et al., 2022; Wilson & Daugherty, 2018). Artificial intelligence
    is now integrated into nearly every industry (e.g., manufacturing, services, healthcare,
    etc.). Even though studies have been done on artificial intelligence and job performance,'
