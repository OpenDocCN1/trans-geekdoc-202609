  md: 'to understand complex topics and questions better. It can provide new and original
    ideas for the topic analyzed by examining respondents’ perceptions and factors
    that influenced them (Stolle, 2022). This approach provides an opportunity to
    learn about people’s behavior, attitudes, and experiences from different perspectives.
    The research employs a semi-structured interview method that includes open-ended
    questions and enables one to gain a deeper knowledge of different aspects of the
    problem, allowing to explore unique viewpoints. The questions asked would not
