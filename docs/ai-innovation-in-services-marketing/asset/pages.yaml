    # KEY TERMS AND DEFINITIONS


    **Artificial Intelligence:** The capacity of a machine to imitate the human intellect.


    **Confirmatory Factor Analysis:** This is a statistical method for testing hypotheses
    about the basic structure of a data set. It may also be applied to evaluate the
    reliability of measuring instruments.


    **Exploratory Factor Analysis:** It is statistical technique for figuring out
    a group of variables’ underlying structure. It is usually used when the researcher
    does not know the number or nature of the factors.


    **Job Performance:** The extent to which an employee meets or exceeds employment
    requirements.


    **Mediator Variable:** A variable that clarifies the relationship between the
    independent and dependent variables.


    **Moderator Variable:** A variable that modifies the degree of the correlation
    between a dependent and independent variable.


    **Structural Equation Modeling:** It is a statistical method for investigating
    complex correlations between variables. This method combines factor analysis and
    multiple regression analysis.'
