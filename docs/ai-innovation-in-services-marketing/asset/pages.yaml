- pgno: 7
  md: '# Detailed Table of Contents


    +   Preface ........................................................................xiii


    # Chapter 1


    # Where AI Meets Captivating Storytelling: A Case Study of Invest Lithuania .....1


    Monika Belhaj, Mykolas Romeris University, Lithuania


    The widespread adoption of artificial intelligence (AI) has ignited transformative
    changes across diverse domains, including business and marketing. Consequently,
    this study immerses itself in the initiatives undertaken by Invest Lithuania,
    a non-profit foreign direct investment development agency, which orchestrated
    an inventive marketing campaign through the synergy of account-based marketing
    (ABM), storytelling, and artificial intelligence (AI) techniques. The campaign’s
    overarching goal was to effectively engage target contacts and increase business
    opportunities in the game development sector. In this dynamic environment, innovative
    marketing approaches, like those explored in this study, can help build long-term
    relationships and promote sustainable business growth. The results showed that
    the potential is there.


    # Chapter 2


    # The Role of Artificial Intelligence to Empower and Leverage Brands ............27


    Carlos R. Cunha, Research Centre in Digitalization and Intelligent Robotics (CeDRI),
    Laboratório para a Sustentabilidade e Tecnologia em Regiões de Montanha (SusTEC),
    Instituto Politécnico de Bragança, Bragança, Portugal João Pedro Gomes, Instituto
    Politécnico de Bragança, Portugal Vitor Mendonça, UNIAG, Instituto Politécnico
    de Bragança, Bragança, Portugal


    Technological evolution has impelled companies to adopt innovative solutions supported
    by technologies. In a particular way, brands have been migrating from traditional
    marketing to digital marketing, with the vanguard of emerging technologies allowing
    them to obtain competitive advantages. Nowadays, artificial intelligence promises
    to transform the area of marketing, considering that machine learning, natural
    language processing, and predictive analytics are revolutionizing the way'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'brands interact with their consumers, personalize experiences, and make informed
    data-driven decisions. This chapter, after contextualizing artificial intelligence
    within organizations and the competitive advantages it can represent, discusses
    AI as an automatic pilot for brand empowerment and proposes a conceptual model
    that, using artificial intelligence, allows companies to be trained and streamline
    digital marketing functions to empower brands. Finally, the authors also present
    some scenarios in which the proposed model can be applied.


    # Chapter 3

    Increasing Customer Engagement in Digital Marketing Campaigns in a Time of AI..........48


    Urte Dudzinskaite, ISM University of Management and Economics, Lithuania

    Ricardo Correia, Polytechnic Institute of Bragança, Portugal & CiTUR, Portugal

    Dominyka Vincute, ISM University of Management and Economics, Lithuania

    Ruta Fontes, University of Aveiro, Portugal


    The study aims to analyze how customer engagement can be increased in digital
    marketing campaigns to improve connections with customers. To achieve this aim,
    empirical research was conducted to get valuable insights into factors that contribute
    the most to increasing engagement in digital marketing campaigns. The study employed
    a qualitative research method, and 10 semi-structured interviews were conducted
    with potential digital marketing campaigns customers dividing them into two age
    groups of A20-30 and A40-50. The research showed that engagement tactics enhance
    the performance of digital marketing campaigns and substantially influence users’
    willingness to interact with digital ads actively. Relevance, clear message, aesthetic
    design, personalized content, and informativeness have the greatest impact on
    shaping user behavior and starting active engagement. Taking research results
    into consideration, managerial recommendations were provided using the RACE framework
    regarding each phase of the engagement: plan, reach, act, convert, and engage.


    # Chapter 4

    The Role of Health Marketing in the Dissemination of AI and ML Application in
    Preventive Health..........81


    Leticia Moura, 2Ai – Applied Artificial Intelligence Laboratory, School of Technology,
    Polytechnic Institute of Cávado and Ave, Portugal

    Bruno Barbosa Sousa, Polytechnic Institute of Cávado and Ave, Portugal & UNIAG,
    Portugal & CiTUR, Portugal

    Cláudia Miranda Veloso, GOVCOPP, Aberta University, Portugal & ESTGA, University
    of Aveiro, Portugal'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'The development of information and communication technology (ICT) has made
    citizens the protagonists of so-called preventive health, whose focus and importance
    are in disease prevention or early diagnoses to promote faster and more effective
    treatment, and reduce the number of consultations and hospitalizations, which
    impacts on overcrowding in hospitals. Additionally, the amount and speed of data
    generated daily in the health area make the need for technologies capable of capturing,
    crossing, and interpreting information in real-time even greater. Thus, new technologies
    available in the market bring a new scenario of prosperity for patients, doctors,
    and hospitals. Due to web and mobile application solutions, information such as
    medical histories, medical prescriptions, exams, and family history can be stored
    using artificial intelligence and machine learning. This work aims to understand
    and assist in the connection of technologies with preventive health and observe
    how health marketing can help promote this relationship.


    # Chapter 5

    The Effect of Artificial Intelligence Awareness on Job Performance: Gender as
    Moderator and Experience as Mediator .................... 110

    Oumeima Toumia, University of Sousse, Tunisia

    Farouk Zouari, University of Tunis El Manar, Tunisia


    Since artificial intelligence is still a relatively new technology, research on
    the effects of artificial intelligence on work performance in developing countries
    is still limited. Thus, the chapter aims to examine and analyze the effect of
    artificial intelligence on job performance among Tunisian employees, with gender
    as the moderator variable and experience as the mediating variable. A questionnaire
    was developed to test the model based on a dataset of 350 employees in different
    sectors. The generated data were analyzed using IBM SPSS.26 and IBM SPSS AMOS.26.
    The results of exploratory and confirmatory factor analyses showed the absence
    of an impact of artificial intelligence on job performance. In addition, the authors
    found no moderating effect of gender or mediating effect of experience on the
    relationship between artificial intelligence and job performance. However, the
    experience of the employee has a positive and significant impact on job performance.


    # Chapter 6

    The Influence of Artificial Intelligence on Advertising .................... 134

    Milda Budėnaitė, ISM University of Management and Economics,

    Lithuania

    Ricardo Correia, Instituto Politécnico de Bragança, Portugal & CiTUR,

    Portugal

    Dominyka Venciūtė, ISM University of Management and Economics,

    Lithuania'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'This chapter explores the profound influence of artificial intelligence (AI)
    on advertising, covering its historical context, current trends, and future implications.
    Initially, advertising relied on manual data analysis, but AI has shifted the
    landscape towards more targeted campaigns. AI''s role began with predictive analytics
    for weather forecasting in the 1950s and evolved to include collaborative filtering
    by companies like Amazon. Current trends include hyper-personalization through
    predictive analytics, programmatic ad buying, and conversational AI. These AI-driven
    strategies enhance user experience and improve ad targeting. The future promises
    even greater personalization, with advancements in voice and visual search. However,
    ethical considerations regarding privacy and data security have also emerged.
    This analysis underscores the transformative impact of AI on advertising, from
    its inception to its current state, highlighting the continuous evolution and
    future prospects.


    # Chapter 7

    Artificial Intelligence and Service Marketing Innovation........................................150

    Monica R., Christ University, India

    Aswin Varghese Soju, Christ University, India

    Sathish Kumar B., Christ University, India


    The integration of artificial intelligence (AI) into service marketing in India
    is expected to significantly impact marketing strategies and economic dynamics.
    The emphasis on personalization, automation, predictive analytics, and chatbots
    will enhance customer engagement and brand loyalty, leading to increased sales
    and revenue. Automation of marketing workflows will streamline operations, improve
    efficiency, and foster business growth. AI''s predictive analytics capabilities
    will help businesses make informed decisions about their marketing strategies,
    particularly in a diverse market like India. AI-driven chatbots will enhance customer
    satisfaction and engagement, contributing to positive brand perception and loyalty.
    However, there may be concerns about job displacement, particularly in routine
    tasks. The growth of AI-driven service marketing can contribute to the development
    of a technology-driven ecosystem in India, attracting investments, fostering entrepreneurship,
    and stimulating innovation.


    # Chapter 8

    Service Innovation Metamorphosis From Assimilation to Synthesis Approach

    for Building Disruptive Business Strategies ....................................................173

    Sridhar Manohar, Chitkara Business School, Chitkara University, India

    Ruchi Jain, Amity School of Business, Amity University, Noida, India

    Ruchika Jeswal, Amity School of Business, Amity University, Noida,

    India'
  merge: -1
  img_proc: true
- pgno: 11
  md: 'Existing theoretical and empirical researchers associated innovation with technological
    transformations and introduced radical/disruptive products and processes. However,
    considering the approaches and theories would be limited to manufacturing industries,
    innovation in service industries with non-technological aspects needs to be noticed.
    This study emphasises the need for a synthesis approach that could play a major
    role in building/enhancing service business models/frameworks. These frameworks
    need a stronger focus on using organizational, strategic, and marketing innovation
    typologies in formulating service business models resulting in low customer engagement
    and customer experience management. This chapter discusses various new business
    models that have evolved their features and benefits. Finally, this study concludes
    by emphasising the need for incorporating non-technical components when innovating
    in services and services-based firms.


    # Chapter 9


    # The Convergence of Services and AI: The Opportunities and Challenges


    With Special Reference to the Indian Market ....................................201


    Oindrila Chakraborty, J.D. Birla Institute, India


    The chapter explores the far-reaching impact of AI on the Indian service sector,
    focusing on consumer attitudes and perceptions regarding the use of AI in service
    sectors. It addresses potential implications such as job displacement and workforce
    up-skilling. The chapter explores AI adoption in the Indian market, its applications,
    benefits, challenges, and future possibilities. It also offers a glimpse of the
    ethical dilemmas and promising future of AI in the service industry. The data
    gathered through the qualitative survey would provide valuable insights into the
    attitudes and perceptions of Indian consumers on AI use in the Indian market along
    their difficulties and comfort zone about the use of AI in service sectors.


