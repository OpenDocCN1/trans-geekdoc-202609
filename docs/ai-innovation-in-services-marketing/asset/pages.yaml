    # MISSION


    Business processes, services, and communications are important factors in the
    management of good customer relationship, which is the foundation of any well
    organized business. Technology continues to play a vital role in the organization
    and automation of business processes for marketing, sales, and customer service.
    These features aid in the attraction of new clients and maintaining existing relationships.


    **The Advances in Marketing, Customer Relationship Management, and E-Services
    (AMCRMES) Book Series** addresses success factors for customer relationship management,
    marketing, and electronic services and its performance outcomes. This collection
    of reference source covers aspects of consumer behavior and marketing business
    strategies aiming towards researchers, scholars, and practitioners in the fields
    of marketing management.


    # COVERAGE


    +   - Text Mining and Marketing

    +   - Data mining and marketing

    +   - Web Mining and Marketing

    +   - Mobile CRM

    +   - CRM and customer trust

    +   - Cases on Electronic Services

    +   - CRM in financial services

    +   - Ethical Considerations in E-Marketing

    +   - Customer Retention

    +   - Relationship Marketing


