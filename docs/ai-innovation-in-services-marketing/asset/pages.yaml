  md: '# DATA COLLECTION WITHIN THE CASE STUDY APPROACH


    As Blandford (2013) highlights, research approaches vary, and researchers have
    flexibility in data collection and validation methods. While triangulation is
    often discussed as an alternative (Decrop, 1999; Denzin & Lincoln, 2011; Flick,
    2018), Mason (2017) proposes facet methodology as a more flexible and insightful
    approach. Unlike triangulation, which can risk bypassing a thorough engagement
    with the chosen methodology, facet methodology fosters creativity and intuition,
    prioritizing insights over comprehensive knowledge (Mason, 2017). Considering
    this study’s qualitative approach and interpretive stance, facet methodology is
    deemed suitable. It allows for a deeper exploration of the case study organization,
    offering insight into multiple socially co-constructed realities, knowledge, and
    interactions within a natural setting from diverse perspectives.


    Furthermore, in qualitative research, Stake (2013) and Yin (2011) outline six
    sources of evidence in case studies: interviews, direct observation, participant
    observation, documents, archival records, and physical artefacts. These sources
    aid researchers in accessing organizational resources, planning data collection,
    and preparing for unexpected events (Tellis, 1997). Despite this, Krueger and
    Casey (2015) emphasize that research methods vary in effectiveness based on their
    situational use, the researcher’s competence, and the research environment. In
    this study, the primary data collection method involves the responses from target
    contacts, complemented by the examination of secondary sources before the marketing
    campaign.


    An ABM campaign was implemented to engage with ten selected companies operating
    in the game development sector. The campaign targeted four specific individuals
    in each company, making a total of 40 contacts. The aim was to personalize the
    communication to encourage engagement, collect feedback, and pave the way for
    potential future business prospects. Paper postcards were sent to the target contacts
    in various European countries, which included France, Germany, Sweden, Finland,
    Malta, and the United Kingdom. The postcards were dispatched to C-level contacts,
    from CEOs to business development directors. These individuals were chosen for
    their influential decision-making roles and involvement in developing and managing
    business strategies. An interval of three to four days was maintained between
    each mailing. This study also incorporated secondary data sources besides physical
    artefacts, such as postcards.


    # Secondary Data Sources


    According to Coffey (2014), “most qualitative research takes place in settings
    that are ‘documented’ in various ways” (p. 367). For instance, organizations document
    themselves, and many methodological opportunities exist to explore their documentary'
  merge: -1
  img_proc: true
- pgno: 24
  md: 'realities. What can be included as a “document” involves a broad range of textual
    materials, for example, organizational documents, notes, cards, case records,
    email threads and reports, as well as various technological, digital, and social
    media materials, such as websites, social networking sites, and visual or sound
    materials (Coffey, 2014; Tight, 2019). Documentary research can be considered
    secondary data research (Tight, 2019) because the researcher does not directly
    collect or produce such secondary data. This study considered various internal
    organizational documents.


    # Internal Organizational Documents


    Organizational documents are data or evidence of how an organization represents
    and accounts for itself (Coffey, 2014). Therefore, internal organizational documents,
    such as business and marketing plans, research reports, and other additional documents
    related to Invest Lithuania’s business management, were analyzed. Internal documents
    are essential in business research because they help describe an organization
    and its history (Cassell & Symon, 2004). They further provide organizational value
    structures (Kabanoff et al., 1995) or help generate new business models for creating
    shared value (Michelini & Fiorentino, 2012).


    # ANALYSIS OF PRIMARY DATA


    In this study, data analysis was conducted using NVivo 12 Pro, a software package
    developed by QSR International. It is worth noting that no single industry-leading
    data analysis program exists (Bell et al., 2022). The choice of software primarily
    depends on its alignment with the research methodology, the researcher’s experience,
    and its effectiveness in facilitating the analysis process (Silver & Lewins, 2007).
    NVivo 12 Pro was selected for its extensive features, including the ability to
    hierarchically create and organize nodes, seamlessly open or initiate projects,
    user-friendly navigation, robust search functionality, and support for importing
    various formats of materials (Bell et al., 2022).


    Creswell and Báez (2020) point out that text data are dense and time-consuming
    to analyze and interpret. However, the coding process is a crucial step in making
    sense of such data, and NVivo 12 Pro was employed to aid the researcher in this
    endeavor. A set of codes was established before the analysis to streamline the
    coding process. These codes were formulated based on the research objectives and
    critical factors identified in the literature review.


    During the analysis process, a structure of themes emerged. The themes were as
    follows: positive feedback, exploring collaboration, future opportunities, interest
    in game development studios, positive impressions of Vilnius and geographic limitations.'
