    to the accumulation of better ideas from external knowledge sources. The usual
    sources of Innovation for Business models can be competitors, customers, and inter-organizational
    networks. Organizations can bundle better value by integrating external ideas
    with internal knowledge. Three archetype processes for open innovation were identified,
    i.e., Outside-in, inside-out and coupled (Gassmen & Enkel 2004) Figure 1 below.
    Outside-in process realizes the difference in the presence of knowledge creation
    and innovation, encouraging the flow of information from outside to inside the
    company. At the same time, the company can strategically use external channels
    for commercializing its ideas through an inside-out process. The third-coupled
    process integrates the two and harnesses the benefits of both processes for innovation.


    7.3. Gig Economy: The businesses are flexible and adopt a gig-economy business
    model where work is performed on demand. It is characterized by role-based positions
    filled by independent contractors and freelancers. The gig economy leverages digital
    platforms to connect these freelancers with their consumers as and when demanded
    (Harris, 2017). The employer can represent the main source or an extra source
    of income for the worker (Lepanjuuri et al., 2018, p. 12). The cynical views of
    this business model propagate- the erosion of customer relationships, deprivation
    of


    Figure 1. Archetype process of open innovation (Gassmen & Enkel, 2004)


    ![](img/4558324dacd73a542f4b08ede646650d_201_0.png)'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'employee benefits, and minimalistic labor regulations resulting in lower costs
    to the businesses. Also, this business model allows its workers and consumers
    to co-create value in a more adaptable way with the possibility of a flexible
    lifestyle such as Airbnb, Uber, TaskRabbit or Upwork. It is characterized by choice
    to perform, autonomy due to the absence of supervisors and focus on the moment’s
    needs (Ravenelle, 2019, pp. 5-6). Hence gaining popularity and being practiced
    worldwide with variations such as Uberization, Netflix model and cloud sharing.


    **7.3.1. Uberizations:** In the gig economy, Uberization is the business model
    practised, transforming the market for services with the help of the latest technology,
    especially smartphones. In this business model, digital platforms or mobile apps
    replaced the middlemen required to connect talent to the right audience. Such
    platforms enabled comprehensive interaction between the provider and customer
    and ensured the minimum quality standards. The model got its name from Uber, creating
    a platform for people to hire and pay for rides. This uberization extended to
    any on-demand services such as food, stay, transportation, etc.


    **7.3.2. Netflix Model:** The business model adopted by Netflix is an example
    of integrating the latest technology to fulfill customer expectations by disrupting
    established market structures. It redefined most of the value creation and value
    proposition elements by transforming DVD on rent to video streaming services.
    To retain customers and keep them interested, Netflix invests in new and exclusive
    content as its value proposition, thus reaching beyond pricing. Another innovative
    feature that catalyzes success is its recommendation system, which offers suggestions
    to users based on their consumption patterns. This data mining tool has taken
    Netflix to another level in terms of value creation and key resources as the basis
    for the core competencies of its business. It is pre-emptive by forecasting future
    growth and endowing high-scalability solutions in the gig economy.


    **7.3.3. Cloud Sharing:** Cloud technology provides an exciting value proposition
    for businesses to outsource their Information technology ecosystem. It results
    in less cost and more avenues for service-based models, leading to business models’
    operational success and sustainability. The cloud-based business model can be
    Software as a Service (SaaS), Platform as a Service (PaaS), and Infrastructure
    as a Service (IaaS). Interestingly, many more innovative cloud models are evolving
    every day as per the requirements of business processes.


    # 8. DISCUSSION


    A crucial gap exists in existing research and frameworks related to innovation,
    particularly in the context of service industries. While much attention has been
    given to technological innovations and their impact on manufacturing industries,
    there’s a'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'significant need to recognize and address the unique challenges and opportunities
    for innovation within service sectors. Service industries often rely on non-technological
    aspects such as organizational structures, strategic planning, and marketing strategies
    to drive innovation. However, existing frameworks may not adequately capture the
    integration of both technological and non-technological components necessary for
    effective innovation in these sectors.


    One key aspect that emerges is the importance of customer engagement and experience
    management in service innovation. Innovations in service industries must focus
    not only on product or process improvements but also on enhancing the overall
    customer experience. This includes addressing issues such as managing customer
    data, ensuring privacy and security, promoting sustainability, and adhering to
    ethical considerations. Service businesses must navigate complex challenges related
    to data management, privacy concerns, and sustainability while innovating their
    business models. The above chapter also touches upon the evolution of new business
    models within service industries for example Netflix model. These new models often
    incorporate features and benefits that go beyond traditional approaches, emphasizing
    the importance of adaptability and flexibility in today’s dynamic business environment.


    In conclusion, the discussion emphasizes the critical need for incorporating non-technical
    components into innovation strategies within service industries. By addressing
    the limitations of existing frameworks and adopting a more holistic approach that
    integrates technological and non-technological aspects, service-based firms can
    better position themselves for success in today’s competitive marketplace.


    # 9. FORECASTING FUTURE


    The primary source of competitive advantage in the future is service innovation.
    Large businesses have adopted service as the catalyst for their organizations’
    expansion. Revolutionary new services have demonstrated how service innovation
    can drive economic growth in developing countries despite limited societal infrastructure
    or resources. Leading the way in the development of new IT-enabled service models
    is Salesforce.com, which offers customers software as a service rather than a
    licensed software product. IBM, a firm with a century-long history, changed its
    focus from primarily selling computer hardware and software to one that depends
    on service innovation for growth and competitive advantage (Spohrer and Maglio,
    2010). Forecasting service innovation for the future with absolute certainty is
    impossible. However, some aspects like Artificial intelligence and automation
    would be increasingly integrated. Services would be increasingly tailored to an
    individual’s preferences and needs. The subscription and sharing economy models
    are likely'
  merge: -1
  img_proc: true
- pgno: 204
  md: 'to grow further. In the future, industries like fashion and electronics will
    also offer subscription-based services and collaborative consumption options.
    The pace of change of service innovation would be rapid, and businesses need to
    stay adaptable and open to new technologies and trends to remain competitive.


    # 10. CONCLUSION


    Service innovations powered with tools like Artificial intelligence, Machine Learning,
    Augmented and Virtual Reality and Robotics, etc., offer unlimited disruptive business
    strategies for the firms to excel. Service innovation is viewed as a multidimensional
    construct and is now adopted by firms for value creation and value delivery. This
    “synthesis approach,” based on both products and services, is an evolution over
    and above the earlier assimilation approach of service innovation and fueling
    new-age business models. The business frameworks based on the “shared economy”
    have transformed the general concept of ownership and pushed consumers to share
    the access products, thus leading to sustainability. On the same lines, the open
    innovation system leads to the pooling of better ideas from external knowledge
    sources. Firms with IT-based businesses vehhemently use this idea as open source
    software and disrupt the monopoly of proprietary software worldwide. On the other
    hand, innovative business models used by Uber or Netflix represent the essence
    of the Gig economy, where work is performed based on the demand generated. It
    consists of autonomous contractors and freelancers networked with their target
    market through common digital platforms managed by companies like AirBnB or Swiggy.
    In a nutshell, all disruptions provide customers more power with more personalized
    strategies and incessant innovative approaches adopted by service firms.


