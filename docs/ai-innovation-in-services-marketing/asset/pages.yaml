    # # THE TRANSFORMATIONS OF TECHNOLOGY IN HEALTHCARE


    In the definition by Bozic et al. (2004), ‘advances in healthcare’ can be understood
    as “all medications, instruments, and medical and surgical procedures used in
    medical services, as well as the organization and support systems in which these
    services are provided” (p. 1305). The International Business Machines (n.d.) expanded
    the definition presented by Bozic et al. (2004) and added that advances in healthcare
    encompass all technologies developed to assist healthcare institutions, including
    AI, information technology systems, among others.


    The traditional approach to healthcare delivery, focusing on hospitals, presented
    some disadvantages for healthcare professionals, such as limited time to examine
    the patient (which made it impossible to collect information about their daily
    activities, essential for diagnosis and treatment choices), an aging population
    (which required more medical care, increasing the necessary resources), a shortage
    of healthcare professionals, and rising costs associated with service delivery,
    among others (Abdullayeva, 2022).


    The evolution of healthcare services came to address these disadvantages, resulting
    in the development and implementation of medical technologies. Similar to what
    happened in the industry, where technological evolution and innovation were described
    through industrial revolutions (known as Industry 1.0 to Industry 4.0), the evolution
    of healthcare services can be described in four phases, called Health Care 1.0
    to Health Care 4.0 (Kaur et al., 2021; Li & Carayon, 2021).


    +   - Health Care 1.0


    ‘Health Care 1.0’ involved the basic encounter between doctor and patient, including
    consultations, tests, diagnoses, medical prescriptions, and disease management
    plans. In this phase, healthcare delivery was carried out by just one'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'physician, a model still in use in medical practice (Kaur et al., 2021; Li
    & Carayon, 2021; Sony et al., 2022).


    # Health Care 2.0


    ‘Health Care 2.0’ emerged with the development and introduction of new medical
    equipment and devices to support healthcare institutions in making more informed
    decisions, whether in diagnosis or treatment of diseases. During this phase, imaging
    technologies such as ultrasound and magnetic resonance imaging, patient health
    monitoring devices such as pulse oximeters and arterial lines, and surgical and
    life support equipment such as microscopes and ventilators were introduced (Li
    & Carayon, 2021; Sony et al., 2022).


    # Health Care 3.0


    ‘Health Care 3.0’ was marked by the beginning of digitization of procedures, along
    with the introduction of electronic medical records (EMRs) and electronic health
    records (EHRs) (Li & Carayon, 2021; Sony et al., 2022). The development of these
    information systems allowed for the management of patient care across different
    units and departments of healthcare institutions, significantly impacting clinical
    and operational processes (Li & Carayon, 2021; Sony et al., 2022). During this
    phase, there was the digitization of healthcare value chains, including the adoption
    of electronic records after consultations. The use of electronic means improved
    the execution, management, and transmission of reports (Li & Carayon, 2021; Sony
    et al., 2022). Information systems brought about significant changes in healthcare
    services, including telemedicine, remote healthcare, and others, which complemented
    direct contact between doctors and patients, increasing efficiency (Sony et al.,
    2022). Thus, Health Care 3.0 transformed healthcare systems into a multidimensional
    form of patient management (Li & Carayon, 2021; Sony et al., 2022).


    # Health Care 4.0


    ‘Health Care 4.0’ corresponds to the application of technologies developed during
    Industry 4.0 in healthcare services. In this sense, healthcare delivery has become
    a cyber-physical system equipped with radiofrequency identification (RFID) devices,
    wearables, and other types of medical devices and medical robots, which are integrated
    into the cloud through computing. Additionally, data processing involves big data,
    AI, and other decision support techniques, enabling the provision of interconnected
    and intelligent healthcare (Ahmad et al., 2022; Li & Carayon, 2021). This cyber-physical
    system enabled the connection and sharing of information among hospitals, clinics,'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'and medical devices, such as patient medication histories, diagnostic notes,
    and test results. It is important to note that information sharing must follow
    established protocols. The introduction and application of technologies developed
    in this phase of healthcare allowed the creation of a smart and interconnected
    healthcare community (Li & Carayon, 2021).


    Still in the context of Health Care 4.0, it is important to highlight that critical
    data security issues arise due to the digitization and interconnection of healthcare
    systems, including the risk of sensitive information leakage, unauthorized access,
    data integrity, and interoperability challenges. To ensure patient safety and
    privacy, measures such as encryption, user authentication, access control, threat
    monitoring, training, regulatory compliance, and maintenance are widely implemented,
    aiming to protect confidential medical information and ensure data integrity.
    In the case of regulatory compliance, it is essential to have laws that guarantee
    the privacy of patients’ health data, and privacy implies that only authorized
    individuals have permission to view patient health data, and it defines the circumstances
    under which this information can be accessed, used, and shared with third parties.
    For example, to ensure this regulation, laws such as the General Data Protection
    Regulation (GDPR) in the European Union and the Health Insurance Portability and
    Accountability Act (HIPAA) in the United States are in place (Box & Pottas, 2013;
    Hathaliya & Tanwar, 2020).


    # E-HEALTH AND M-HEALTH


    According to Antoja et al. (2019), new scenarios in many sectors are being shaped
    by the rapid advancement of technologies, which have the potential to change people’s
    lives, assuming a special value. Healthcare systems have been facing a scenario
    of changes in the way healthcare services are delivered, whether due to the aging
    population or the increased need for more complex disease management. It is a
    fact that a new service model is needed to connect the system with those who need
    it, thus generating and adding value (Kuziemsky & Vimarlund, 2018).


    As an example of these changes, different measures have been taken worldwide due
    to the need to increase consumer involvement in healthcare. Such measures, which
    can be framed within the concept of e-Health, aim to focus on the development
    of new digital services to increase well-being or address some social challenges,
    such as decreasing resources and the lack of qualified personnel (Vimarlund, 2017).
    Through Pagliari et al.’s (2005) research, it can be observed that most definitions
    of e-Health conceptualize it as “a wide range of medical informatics applications
    to facilitate the management and delivery of healthcare” (p.10).'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'ICTs, exemplified by computers, smartphones, and the Internet, have revolutionized
    how the search and exchange of information enrich the lives of those who use them,
    as well as changed the way people communicate (World Health Organization, 2010).
    The use of technology in health apps, as long as it provides security for its
    users, plays an essential role in improving the lives of those who use it (European
    Commission, 2014).


    In fact, e-Health has come to facilitate the daily lives of healthcare professionals
    and allow patients to be more up-to-date about their own health. Along with the
    use of mobile devices, such as tablets and smartphones, access to information
    and communication has improved, elevating the quality of healthcare provision
    and enabling efficient treatment of patients. The use of apps contributes to patient
    autonomy, as they can manage their health to better understand processes and treatments,
    as well as have solutions for tracking and monitoring their medical histories,
    medication use, and medical appointments (European Commission, 2014).


    In recent years, the development of ICTs, as well as mobile Internet, which ensures
    connectivity anywhere and anytime, has played a fundamental role in healthcare
    solutions. In this context, mobile Health (m-Health) offers healthcare services
    that overcome geographical, temporal, and even organizational barriers. M-Health
    solutions address emerging health challenges, including the growing number of
    lifestyle-related chronic diseases, the high cost of existing national healthcare
    services, the need to empower patients and families to take care of themselves
    and their health, and motivations to provide direct access to healthcare services,
    regardless of time and place (Oldenburg et al., 2015; Silva et al., 2015).


    M-Health technologies, such as health apps and wearable devices (which connect
    to cloud computing), make continuous digital monitoring of citizens’ health data
    possible. This includes monitoring vital signs such as heart rate, blood glucose
    levels, blood pressure, body temperature, brain activity, and other indicators.
    Portable devices, sensors, and smartphone apps allow people to collect significant
    amounts of medical, biological, and physiological information, as well as information
    about their lifestyles and daily activities. This wealth of data enables the capture
    of unique information about each individual’s behavior, genetics, and environment,
    facilitating the delivery of highly personalized and patient-centered healthcare,
    with an emphasis on accuracy (Aydin & Silahtaroglu, 2021; Belliger & Krieger,
    2018; Demiris et al., 2019; Scholz & Teetz, 2022).


    The digital transformation in the healthcare sector, driven by the adoption of
    apps and mobile devices by patients, has brought about significant changes in
    people’s attitudes and behaviors, deeply impacting citizens. They have become
    active participants in managing their own health, having an active voice in interactions
    with healthcare institutions. M-Health has enabled an evolution in the role of'
  merge: -1
  img_proc: true
- pgno: 106
  md: 'the patient, transitioning from a passive recipient of diagnosis and treatment
    to an active, well-informed partner responsible for their own health. Mobile health
    solutions allow patients to make informed decisions and take preventive measures
    based on their own health metric monitoring. This gives citizens greater control
    over decisions related to their healthcare, while also holding them accountable
    for staying informed about their health conditions in order to remain healthy
    (Aydin & Silahtaroglu, 2021; Belliger & Krieger, 2018; Schnurr et al., 2018; Scholz
    & Teetz, 2022; Vial, 2019).


    # THE POWER OF AI IN HEALTH


    AI is the ability of machines to make intelligent decisions, beyond being a revolutionary
    innovation and a new way of programming things. The way brands and customers interact
    has been transformed thanks to AI, as it allows companies to focus on meeting
    customer needs in real time, which constitutes an advantage for marketing professionals
    who can focus more on their clients (Ameen et al., 2021).


    AI can be employed in various marketing processes, empowering professionals in
    the field to reach their audience in different contexts. This application enables
    improving the effectiveness and productivity of systems and operations. By implementing
    AI, companies can connect more efficiently with their customers, as they can develop
    personalized and more engaging ads (Haleem et al., 2022). As exemplified in Figure
    2 below, the application of AI in marketing can be effective in various scenarios,
    from pricing, product management, promotion, and placement, to the creation of
    strategies and planning (Haleem et al., 2022).


    According to Dicuonzo et al. (2023), AI has great potential to improve health,
    enhance processes, reduce costs, improve people’s work efficiency, and ensure
    new mechanisms of growth.


    Furthermore, there are tools belonging to AI that assist in the enhancement of
    this technology, whether in healthcare or in any other area, such as machine learning
    (ML), which is a field that allows computational systems to analyze, learn, and
    interpret data using algorithms and statistical methods. These algorithms can
    identify patterns and trends in information, learn from large datasets, and become
    an important ally in studies in the healthcare sector. Algorithms can also be
    trained to identify three important steps: diagnosis, prognosis, and treatment,
    for example, they can recognize groups or subgroups of people with similar symptoms,
    calculate the chances of recovery from these symptoms, and evaluate the best options
    for treating patients. Moreover, these innovations can not only improve operational
    efficiency but also positively influence brand perception, whether of the professional
    or the institution, in delivering more effective and personalized services (Bag
    et al., 2023;'
  merge: -1
  img_proc: true
- pgno: 107
  md: 'Chang et al., 2022; Delgadillo & Atzil-Slonim, 2022; Haleem et al., 2022; W.
    Lee et al., 2023; Mondal et al., 2022).


    These new technologies will increasingly be present in the healthcare sector,
    mainly to assist various stages of healthcare. Below are some of the main stages
    where AI and ML can act in the healthcare sector:


    +   - Diagnosis: AI can be used to diagnose medical conditions, analyzing exam
    data and patient symptoms. For example, ML algorithms can be trained to detect
    early signs of diseases, such as the emergence of tumors, or to assist in distinguishing
    between various conditions with similar symptoms, such as infection cases (Lebcir
    et al., 2021; Liu et al., 2019).

    +   - Medical Image Analysis: AI can be used to analyze medical images, such as
    X-rays, CT scans, and MRIs. Algorithms can be trained to detect certain features
    in these images that may indicate diseases, making the analysis faster and more
    accurate (Mondal et al., 2022; Tang, 2020).

    +   - Patient Monitoring: AI can be used to monitor patients and predict possible
    complications. For example, algorithms can analyze a patient''s vital signs and
    warn doctors about important changes that may indicate imminent complications
    (Lebcir et al., 2021; Sujith et al., 2022).

    +   - Treatment Personalization: AI can be used to help personalize the treatment
    of each patient, taking into account factors such as age, medical history, genetics,
    and other information. ML algorithms can identify the most effective treatments
    for individual patients based on their personal data (Mondal et al., 2022).

    +   - Drug Discovery: AI can be used to facilitate drug discovery, analyzing large
    amounts of research data to identify potential therapeutic targets and drug combinations
    (Boniolo et al., 2021).


    As emphasized by Gennatas & Chen (2021) and Lebcir et al. (2021), AI with the
    assistance of ML has the potential to transform the healthcare sector, as these
    technologies promise to provide more accurate diagnoses, personalized treatments,
    and more efficient patient monitoring. However, similar to virtual reality (VR)
    and augmented reality (AR) solutions, the implementation of AI in healthcare also
    faces specific institutional challenges; thus, it is noteworthy that regulatory
    barriers in the medical sector may limit the advancement of new technologies,
    affecting areas such as treatment, patient data regulation, and educational processes
    for medical professionals (Kulkov et al., 2023). Therefore, it is crucial to recognize
    and address these barriers to optimize the transformative potential of AI and
    ML in the healthcare sector. It is important to note that trust among industry
    participants is a critical factor in the successful introduction of these technologies,
    so it is necessary to emphasize'
  merge: -1
  img_proc: true
- pgno: 108
  md: 'that technologies do not replace the experience and clinical judgment of doctors
    and other healthcare professionals but rather help them make better and more informed
    decisions and, in the future, will complement their intelligence (Topol, 2019;
    Verghese et al., 2018).


    # PREVENTIVE HEALTH GAINS STRENGTH WITH TECHNOLOGY


    The use of new technologies in healthcare is not limited to state-of-the-art equipment
    found in hospitals, diagnostic centers, or health clinics. The development of
    information technology (IT) has made citizens protagonists in the so-called preventive
    medicine, which focuses on disease prevention or early diagnosis to promote faster
    treatment (Razzak et al., 2020). Thus, the health model that should be applied
    and advocated by public managers is that of promoting physical and mental well-being,
    not the prevailing model in most countries: the care model (Fer tonani et al.,
    2015). In other words, it is necessary to consider preventive measures in human
    health, that is, to reflect on a subject before any instability occurs in the
    body and not just after acquiring a disease, for this it is necessary to pay attention
    to people’s daily routines and habits, emphasizing the improvement of immunity
    and physical strengthening, thus reducing the probability and risks of diseases.
    Therefore, the use of new technological tools helps citizens to put this specialty
    into practice in the healthcare system (He et al., 2021).


    A well-known healthcare model that persists in healthcare systems in various countries
    is the curative model. This model, also known as curative medicine, intervenes
    in what could not be avoided, or what was not even attempted. This process starts
    with the patient themselves, who when feeling ill seeks help from a healthcare
    professional or service, and then follows with diagnosis and prognosis. Thus,
    preventive medicine starts from health with the aim of preserving it, while curative
    medicine starts from disease and the patient with the aim of cure (Lifshitz, 2014).


    Arredondo (2014) emphasizes the need for a transition from a curative model to
    a more holistic model that emphasizes prevention, detection, and long-term monitoring.
    If these changes do not occur, chronic diseases will continue to be poorly detected,
    and consequently, national health coverage will not be effective.


    The proliferation of technology, as mentioned by Mirza et al. (2008), aims to
    link all aspects of a person’s life such as dietary habits, physical behavior,
    surgeries performed, and predisposition to diseases. Thus, they become necessary
    for more thorough and preventive health surveillance of the population, as they
    help doctors to examine the patient holistically, preventing possible chronic
    diseases such as diabetes and hypertension. Therefore, citizens are starting to
    provide data from their'
  merge: -1
  img_proc: true
- pgno: 109
  md: 'lives to facilitate the work of doctors in preventing or detecting diseases,
    resulting in more assertive decisions regarding the most appropriate treatment
    for each case (Mirza et al., 2008).


    As resources evolve, individuals engage in this transformation, and interest in
    prevention increases, thus the importance of health is not based solely on the
    mere cure of the disease. Thus, a paradigm shift emerges, that is, a transition
    to a scenario that pays more attention to the well-being and care of the human
    being in a more harmonious and balanced way (Babatunde et al., 2021; P. Santos
    et al., 2017).


    Moreover, preventive care is important because it reduces the number of consultations
    and hospitalizations, impacting hospital overcrowding, increasing quality and
    life expectancy, and possibly aiding in reducing healthcare spending. Additionally,
    the quantity and speed of data generated daily in healthcare further increase
    the need for technologies capable of capturing, crossing, and interpreting information
    in real-time. Therefore, new technologies available in the market bring a new
    scenario of prosperity for patients, doctors, and hospitals. Through web solutions
    and apps, where information such as medical histories, prescriptions, tests, and
    family histories can be stored, it is possible to search for professionals by
    specialty, schedule appointments, and send notifications via email and SMS (Short
    Message Service) (Babatunde et al., 2021; Oldenburg et al., 2015).


    In this way, technology is allowing hospitals, clinics, and laboratories to reach
    patients more easily, quickly, and economically. Consequently, it will represent
    a significant improvement in the healthcare system, thus, the use of professionals''
    time, the quality of care, and the values spent on patient treatment will reach
    positive levels (Ahern et al., 2011).


    Some new technologies employed in preventive medicine, which assist the entire
    improvement process, include:


    +   Mobile health monitoring devices and health apps: These devices, such as smartwatches
    and activity bracelets, monitor sleep, exercise, heart rate, and other health
    metrics. They can help people lead healthy lifestyles and detect health problems
    early. There are also many apps that can help people manage their health. Examples
    include calorie tracking apps, medication reminder apps, and blood pressure monitoring
    apps (Jiang et al., 2022).


    +   Telemedicine: This remote communication medium allows patients to contact
    doctors and other healthcare professionals through video calls and messages. This
    can be especially useful for people living in remote areas or who have difficulty
    getting to the doctor (Babatunde et al., 2021).


    +   Big Data and AI: These technologies can be used to analyze large amounts of
    health data and identify patterns that can lead to new medical discoveries'
  merge: -1
  img_proc: true
- pgno: 110
  md: 'and preventive treatments. AI can also help customize treatment and identify
    risks early (Razzak et al., 2020).


    +   • Genetic testing: This test allows people to know if they are predisposed
    to certain diseases and can take preventive measures by adopting healthier lifestyles
    or seeking early treatment (Júnior & Ianotti, 2010).


    New technologies have the potential to transform the field of preventive health,
    allowing people to monitor their individual health effectively through more accurate
    information about their physical and mental conditions, so that they receive personalized
    preventive treatment, enabling the prolongation of human life (Jiang et al., 2022).
    However, over the years, there has been a reluctance in the healthcare industry
    to pave the way for preventive medicine. As mentioned by Akhmetov & Bubnov (2015)
    and Terkola et al. (2017), there are specialists who point out that there is a
    lack of research or solid evidence that convincingly shows how the adoption of
    preventive medicine can affect the economy of resources, such as reducing medical
    costs and expensive treatments. This resistance affects the implementation of
    preventive technologies that could improve the population’s health in a personalized
    and effective way, as there is still a need for more studies to prove their financial
    benefits and their effectiveness in managing healthcare resources.


    # FINAL CONSIDERATIONS


    Health apps play a crucial role in implementing preventive healthcare. They act
    as intermediaries between AI, healthcare professionals, and patients. To understand
    the acceptance of health apps, it is necessary to understand how their users perceive
    them, considering the perspectives of both consumers who will use the apps in
    their daily lives and healthcare professionals who will use the apps to complement
    and assist their work. The perception of patients regarding health apps can vary
    greatly depending on various factors, such as their previous experience with these
    tools, their familiarity with technology in general, their specific health needs,
    and even their age and level of education (Peng et al., 2016).


    For some consumers, health apps can be seen as a convenient and affordable way
    to monitor their health and manage chronic conditions, allowing them to have more
    control over their well-being and enabling them to record and track behaviors
    and goals (Alkaldi et al., 2023; European Commission, 2014; Peng et al., 2016).
    These individuals appreciate the ease of access to health information and online
    resources, such as healthy eating tips, exercise routines, and medication reminders.
    They also believe that through apps, they can control their diet and exercise
    routines,'
  merge: -1
  img_proc: true
- pgno: 111
  md: 'track their progress in weight loss cases, stay updated on their health preventively,
    ensuring that tests and appointments are always up to date (Chakraborty & Paul,
    2023; Dennison et al., 2013; Peng et al., 2016).


    On the other hand, there are consumers with different profiles who may be more
    skeptical about health apps and may have concerns about the privacy and security
    of their health data, as it may be accidentally exposed or disclosed to unauthorized
    third parties (Dennison et al., 2013; Stephen et al., 2022). Additionally, some
    people may feel that health apps are not as effective as consulting a doctor in
    person, or may not have access to the necessary technology to use these apps (Mills
    et al., 2020).


    Another barrier to the adoption of these health apps would be the cost of accessing
    this technology. According to research, some users prefer free apps because they
    believe that they already deliver enough to meet their needs, but this does not
    mean that people are not willing to pay for the service. Some people would pay
    a small amount if they found an app worth buying, that is, only if the app had
    exclusive features and functions that other free apps do not have (Alqahtani &
    Orji, 2020; Aydin & Silahataroglu, 2021; Peng et al., 2016).


    In general, the patient''s perception of health apps depends heavily on their
    personal experience and individual health needs, as well as the quality and reliability
    of the available apps. It is important for health app developers to consider these
    factors and work to provide digital health tools that are useful, accessible,
    and secure for all patients. This is what the vast majority seek, whether young
    or old (Lagan et al., 2021; A. Nunes et al., 2019; Stoyanov et al., 2016).


    Health apps have become increasingly popular and accessible in recent years and
    offer a wide range of features to help people manage their health and well-being.
    From the perspective of healthcare professionals, these apps can have various
    importance, namely:


    Improve patient communication and engagement: Health apps can help improve communication
    between patients and healthcare professionals, allowing patients to track and
    share real-time health data. This can lead to better patient engagement and greater
    collaboration between the patient and the healthcare professional (European Commission,
    2014).


    Facilitate screening and management of chronic diseases: Many health apps are
    designed to help people manage chronic diseases such as diabetes, high blood pressure,
    and asthma. These apps allow patients to monitor their symptoms, medications,
    and daily lifestyle habits, which can assist healthcare professionals in assessing
    treatment progress and adjusting the treatment plan if necessary (Krishnan & Selvam,
    2019).


    Increase the efficiency and accuracy of diagnoses: Some apps are designed to assist
    medical professionals in diagnosing and treating diseases. For example, an app'
  merge: -1
  img_proc: true
- pgno: 112
  md: 'that uses AI to analyze medical images can help healthcare professionals identify
    abnormalities more quickly and accurately (Silva et al., 2015).


    Promote a healthy lifestyle: Many health apps aim to help people lead healthier
    lifestyles by providing guidance on exercise, diet, and sleep. This can help healthcare
    professionals promote disease prevention and health maintenance (Balapour et al.,
    2019; Bondaronek et al., 2018).


    Healthcare professionals have varied opinions about health apps, depending on
    the specific context of use. In general, many professionals recognize the potential
    of apps as useful tools to improve the quality of healthcare and engage patients
    in their own care. However, there are some concerns regarding the reliability,
    security, and privacy of personal health information collected by the apps. Additionally,
    some healthcare professionals may be concerned that health apps may replace personal
    medical care rather than complement it, but we see that this should not be a concern,
    as technology can be considered as a support tool, and professionals continue
    to be essential in the healthcare process (Antoja et al., 2019; Arni & Laddha,
    2017; Chakravorty et al., 2018; European Commission, 2014). The results obtained
    from the literature presented demonstrate perspectives that complement each other
    through very similar perceived benefits and barriers. The study presents a limitation
    as it would be necessary to deeply understand these perspectives through interviews
    or questionnaires.


