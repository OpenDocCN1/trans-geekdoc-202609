- pgno: 28
  md: 'The ABM campaign ran from January to March 2023. As discussed earlier, it revolved
    around ten carefully chosen game development companies, emphasizing pinpointing
    their most iconic game characters. After these game characters were identified,
    the researcher started the process of AI-powered image creation (Figure 1). DALL-E
    2 software was selected for this purpose due to its remarkable ability to generate
    lifelike images and artwork from natural language descriptions (Liu et al., 2022).


    As depicted in Figure 1, the postcards generated by the researcher using AI portrayed
    game characters embarking on a business trip to Vilnius, Lithuania''s capital.
    These characters, acting as virtual Vilnius “ambassadors”, sent four postcards
    (from left to right) to the target contacts. The first image depicted the arrival
    in Vilnius and the game character’s mission initiation. The second image introduced
    the landscape of Vilnius, its inhabitants, and noteworthy places to explore. The
    third one provided an overview of the city’s infrastructure. Lastly, the fourth
