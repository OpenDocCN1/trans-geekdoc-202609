    effectiveness (Vajre, 2016). They utilized semi-personalized texts and aligned
    their “follow-up” actions with the narrative conveyed in the postcards, yielding
    evident results.


    # The Results of the ABM Campaign


    The representatives from eight of the ten target companies who received the postcards
    responded positively after receiving the sales team’s first or second follow-up
    message. It is crucial to highlight that due to postage issues, not all recipients
    received postcards; in fact, some postcards were returned. This situation influenced
    the overall response rate. However, in B2B marketing, especially within niche
    sectors like game development, even a few meaningful engagements can hold significant
    value (Taylor, 2017). From an account-based perspective, 80% of the target companies
    responded positively, indicating that the campaign resonated effectively with
