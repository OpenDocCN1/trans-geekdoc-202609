  md: '# 2.5. The Role of Experience in the Relationship Between AI and Job Performance


    It is well documented that employees are likely to exhibit improved job performance
    when they gain more experience in their roles (Abusalma, 2021; Dewanti & Artaya,
    2019; Hunter and Hunter, 1984; Quiñones et al., 1995). For instance, Dewanti &
    Artaya (2019) stated that the performance of employees is influenced by job experience
    by 51.1%. In addition, Shahzad et al. (2023) showed that artificial intelligence
    has a significant impact on human resources tasks. More precisely, artificial
    intelligence promotes recruiting and talent acquisition, increases employee experience
    and engagement, facilitates employee growth, boosts productivity, makes better
    judgments, etc. (Butler & Callahan, 2014; Nam et al., 2021). In the same vein,
    Zel and Kongar (2020) affirmed that if AI tools such as chatbots, virtual HR chatbots,
    and collaboration platforms are effectively deployed, they may be used to improve
    the employee experience. Consequently, it is anticipated that an employee’s experience
    will serve as an intermediary between job performance and artificial intelligence
    awareness. Hypothesis 5 is proposed:


    H5: Mediation of experience has a significant effect on the relationship between
    artificial intelligence and job performance.


    # 3. RESEARCH METHODOLOGY


    A total of 350 online questionnaires were distributed, from January 2023 to March
    2023, to investigate the impact of artificial intelligence on Tunisian employees’
    job performance. The survey used in this paper consisted of three parts: The first
    part covers the demographic information of the respondents, the second part contains
    items measuring artificial intelligence awareness, and the third part includes
    items that measure job performance. The last two parts of the survey items were
    measured using a 5-point Likert scale, with response levels ranging from “strongly
    disagree” (1) to “strongly agree” (5). Artificial intelligence awareness items
    were derived from the contribution of Brougham and Haar (2018), with four factors
    as dimensions. Job performance was evaluated using Çalışkan and Köroğlu’s items
    (2022). Table 1 presents the constructs and scale resources.


    Our sample showed that 51.4% of the respondents were male, while 48.6% were female
    (see Table 2). The majority of respondents were married (56.6%), between the ages
    of 31 and 40 years (47.4%), had a licence degree (49.4%), had experience between
    5 and 10 years (34.3%), and lived in urban areas (86.3%). Regarding the'
