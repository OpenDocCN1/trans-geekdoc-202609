  img_proc: true
- pgno: 311
  md: '# About the Contributors


    **Cláudia Veloso** is a PhD in Social Sciences (Economics and Management). She
    is Professor of Management (Marketing and Finances) at ESTGA - University of Aveiro.
    She is a researcher at GOVCOPP. She was a Member of the Board of the Centro Hospitalar
    do Nordeste (ULSNE) and Technical Adviser of the Ministry of Health of Portugal.
    She participated in 4 R&D projects, published more than 70 publications in peer-reviewed
    journals, book chapters and proceedings, and won 7 scientific awards.


    **Dominyka Venciute** is the Director of Business Management and Analytics Programme
    and International Marketing and Management Programme at ISM University of Management
    and Economics. Her teaching subjects include Marketing Principles and Integrated
    Marketing Communications. Currently Dominyka is involved in post-doctoral studies
    where she is analyzing the role that leader and employee personal branding has
    on organizational outcomes. Her other research interests include entrepreneurship,
    social media marketing, personal branding and employer branding.


    **Farouk Zouari** was born in Tunis, Tunisia, on August 27, 1980. He received
    his Engineer degree in Electrical Engineering, his magister degree in Automatic
    and Signal Processing, and his PhD degree in Electrical, Electronics, and Computer
    Engineering from the National Engineering School of Tunis, University of Tunis
    El Manar, Tunisia, in 2004, 2005 and 2014, respectively. He is currently a researcher
    at Laboratoire de Recherche en Automatique (LARA), École Nationale d''Ingénieurs
    de Tunis, Université de Tunis El Manar. His current research interests include
    artificial intelligence, adaptive control, chaos synchronization, financial systems
    and fractional-order plants.'
