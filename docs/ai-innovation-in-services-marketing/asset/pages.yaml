  md: '(A detailed description can be found in the analysis section.) In this regard,
    NVivo proved invaluable for storing and managing data and ideas, visualizing thematic
    patterns as they unfolded, and facilitating comparisons and in-depth analysis.
    It is important to acknowledge that human involvement remains essential, and software
    cannot replace the role of the researcher in data analysis (Jackson & Bazeley,
    2019).


    # Analysis of Secondary Data


    Secondary data analysis was performed using content analysis within NVivo, a technique
    with a history spanning more than 60 years that has found applications in various
    fields, including business (Neuendorf, 2017). Krippendorff (2018), a recognized
    authority in the field, defines content analysis as a method for drawing replicable
    and valid inferences from texts or other meaningful materials within their contexts
    of use. Content analysis is not limited to written text; it can encompass verbal,
    textual, visual, sound, print, and electronic forms (Bryman, 2016), including
    images (Bell et al., 2022).


    When conducting a case study of an organization, content analysis primarily aims
    to scrutinize media items, various texts, and documents that are either produced
    by the organization, such as annual reports, or written about it, like articles
    in the business press (Bell et al., 2022). In this context, the researcher examined
    diverse content generated by Invest Lithuania, namely internal documents and reports
    related to previous marketing campaigns and their outcomes. Both sources are conceptually
    rich and offer valuable insights into the organization’s description, historical
    evolution, and the development and management of its core concepts.


    # LIMITATIONS


    The qualitative research approach has its limitations. According to Goulding (2002),
    qualitative research is often criticized for being purely descriptive, needing
    a more structured and straightforward procedure, and potentially producing subjective
    data that may not meet rigorous standards. Furthermore, concerns are raised about
    the need for more transparency in the evolving procedures and processes adopted
    during the research (Miles & Huberman, 1994). Additionally, as Denzin and Lincoln
    (2011) pointed out, the criteria for evaluating and interpreting qualitative research
    can be problematic and may lead to misinterpretation. This chapter addresses these
    limitations by explaining the rationale for selecting methods such as content
    analysis and detailing how they were employed. The utilization of Computer-Assisted
    Qualitative Data Analysis Software (CAQDAS) has supported the qualitative data'
  merge: -1
  img_proc: true
- pgno: 26
  md: 'analysis process, ensuring that the research procedures are well-documented
    and

    enabling readers to examine all the methods employed by the researcher.


    Employing a single case study methodology may also be perceived as a limitation.

    Despite the drawbacks of alternative methods, such as conducting multiple case

    studies and facilitating data comparison (Gustafsson, 2017), the single case study

    approach remains a credible choice. Dyer Jr. and Wilkins (1991) argue that a single

    case study can yield more prosperous and nuanced theoretical insights. Moreover,
    it

    allows the researcher to thoroughly examine a single case over an extended period.

    Therefore, a single case study is the most suitable choice when the research objective

    is to study a specific organization (Yin, 2003).


    Additionally, specific risks are involved when using postal services to send

    postcards for a marketing campaign. The delivery process is partially within the

    control of the campaign implementers. Also, the addresses sourced from company

    websites could not be accurate, and the selected target individuals may have left
    their

    respective companies. As such, it is crucial to exercise due diligence and carefully

    consider these potential risks before implementing such campaigns. Despite these

    challenges, Valenti et al. (2023) have found that direct mail effectively drives
    customer

    acquisition in the offline channel.


    # ETHICAL CONSIDERATIONS


    Several ethical concerns merit consideration in this context. One crucial issue

    pertains to confidentiality (Bryman, 2016), explicitly safeguarding the security
    of

    participants’ responses (Robson, 2002). It is essential to emphasize that this
    study

    rigorously upholds a commitment to safeguarding the companies’ confidentiality.

    Also, despite the researcher’s access to potentially sensitive business practices
    and

    information, all matters of confidentiality were diligently managed following
    the

    mutual agreement established with representatives from Invest Lithuania. Any

    documents designated as commercially confidential were deliberately excluded

    from the analysis.


    Regarding participants’ responses, strict measures were implemented to ensure

    anonymity and prevent identification. Each participant was assigned a unique code,

    for example, G1, and their job positions were anonymized using a generic term,

    “strategic-level manager”, to avoid any potential identification.'
