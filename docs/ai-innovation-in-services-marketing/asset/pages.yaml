  md: '# KEY TERMS AND DEFINITIONS


    **Artificial Intelligence:** Refers to computer systems capable of performing
    complex tasks that historically only a human could do, such as reasoning, making
    decisions, or solving problems.


    **Consumer Behavior:** Is the study of individuals, groups, or organisations and
    all the activities associated with the purchase, use and disposal of goods and
    services. Consumer behaviour consists of how the consumer’s emotions, attitudes,
    and preferences affect buying behaviour.


    **Health Marketing:** Is a process of strategic outreach and communications designed
    to attract healthcare consumers, guide them through their healthcare journey,
    and keep them engaged with the health system.


    **Services Marketing:** Is a specialized branch of marketing which emerged as
    a separate field of study in the early 1980s, following the recognition that the
    unique characteristics of services required different strategies compared with
    the marketing of physical goods.'
  merge: -1
  img_proc: true
- pgno: 124
  md: '# Chapter 5


    # The Effect of Artificial Intelligence Awareness on Job Performance: Gender as
    Moderator and Experience as Mediator


    Oumeima Toumia

    https://orcid.org/0000-0002-7377-6366

    University of Sousse, Tunisia


    Farouk Zouari

    https://orcid.org/0000-0002-3108-6447

    University of Tunis El Manar, Tunisia


    # ABSTRACT


    Since artificial intelligence is still a relatively new technology, research on
    the effects of artificial intelligence on work performance in developing countries
    is still limited. Thus, the chapter aims to examine and analyze the effect of
    artificial intelligence on job performance among Tunisian employees, with gender
    as the moderator variable and experience as the mediating variable. A questionnaire
    was developed to test the model based on a dataset of 350 employees in different
    sectors. The generated data were analyzed using IBM SPSS.26 and IBM SPSS AMOS.26.
    The results of exploratory and confirmatory factor analyses showed the absence
    of an impact of artificial intelligence on job performance. In addition, the authors
    found no moderating effect of gender or mediating effect of experience on the
    relationship between artificial intelligence and job performance. However, the
    experience of the employee has a positive and significant impact on job performance.'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# 1. INTRODUCTION


    Nowadays, the world faces many serious challenges (e.g., war, disease, poverty,
    gender inequality, climate change, etc.). Therefore, many researchers and practitioners
    have tried to find tools to help address these challenges and open up new opportunities.
    Among these tools were artificial intelligence (AI) technologies, which came back
    into vogue in the 2010s (Duan et al., 2019). In fact, AI tools have been used
    in various industries, such as tourism, hospitality, manufacturing, finance, education,
    healthcare, etc. (Buhalis & Leung, 2018; García-Madurga & Grilló-Méndez, 2023;
    Kim, 2011; Prentice et al., 2020; Toumia & Zouari, 2024a, 2024b; Yetgin and Toumia,
    2023; Yu & Schwartz, 2006; Zeba et al., 2021; Zouari, 2019). These tools improve
    and increase the operational efficiency of companies (Russell, 2016; Younus, 2021).
    Indeed, it is well documented that artificial intelligence has an impact on all
    departments of a company, such as marketing, human resources, production, etc.
    (Kumar et al., 2019; Mohammadi & Minaei, 2019; Vrontis et al., 2022). Despite
    the benefits of AI, many contributions have highlighted that there are potential
    drawbacks to using AI (Cellan-Jones, 2014; Duan et al., 2019; Rawlinson, 2015).
    Stephen Hawking announced that “the development of full artificial intelligence
    could spell the end of the human race” (Cellan-Jones, 2014). For instance, artificial
    intelligence is now able to beat humans in complicated games (e.g., the AlphaGo
    system and IBM''s Watson system), interpret sounds and language, solve problems,
    improve prediction, provide a deeper level of transparency, create a more rewarding
    workplace, use facial recognition tools, diagnose medical cases, drive a car on
    the road, play games like chess, and imitate the impressionistic imagery in Van
    Gogh''s paintings (Agrawal et al., 2019; Gabbatt, 2011; Jarrahi, 2018; Kaplan
    & Haenlein, 2019; Koch, 2016; Tuomi, 2019).


    While acknowledging the impact of AI on improving the efficiency of businesses
    (Abusalma, 2021; Wijayati et al., 2022), it is important to investigate the relationship
    between artificial intelligence and job performance. Indeed, many studies have
    used sociodemographic mediating variables (e.g., gender, age, and tenure) to investigate
    the relationship between job performance (see Shirom et al., 2008) and other factors
    such as work-related stressors, work-family conflict, and organizational commitment.
    However, to our knowledge, no previous quantitative research dealt with the effect
    of artificial intelligence awareness on job performance in the context of Tunisian
    employees by using gender as the moderator variable and experience as the mediating
    variable. Our present research aims to contribute to filling this gap.


    In order to test our model, a questionnaire was created with a dataset of 350
    employees from various industries. IBM SPSS.26 and IBM SPSS AMOS.26 were used
    to evaluate the generated data. Indeed, we performed the explanatory factor analysis
    (EFA), the confirmatory factor analysis (CFA), and the structural equation'
  merge: -1
  img_proc: true
- pgno: 126
  md: 'modeling technique (i.e., it is employed to conduct a path analysis for the
    relationships among variables in our model).


    This chapter is divided into five main sections. The first section presents the
    introduction. The second section provides a theoretical background for our research.
    The third section describes the methodology used to solve our research question.
    The fourth section introduces and discusses the main findings. The five section
    summarizes the findings and presents the contributions, limitations, and future
    research.


    # ## 2. LITERATURE REVIEW


    # ### 2.1. AI and Job Performance


    The concept of artificial intelligence was first introduced in 1956 by John McCarthy,
    the “father of AI” (Benko & Lányi, 2009). It is defined as the capacity of machines
    to learn from experience, adapt to new inputs, and accomplish human tasks (Brooks,
    1991; Duan et al., 2019). AI can be categorized into analytic AI (it shows only
    features consistent with cognitive intelligence), human-inspired AI (it includes
    elements of both cognitive and emotional intelligence), and humanized AI (it characterizes
    all kinds of competencies such as cognitive, emotional, and social intelligence)
    (Kaplan & Haenlein, 2019). A growing body of literature has emerged that aims
    at introducing the concept of artificial intelligence and examining its role.
    Indeed, there is disagreement among researchers about the role of AI. Many contributions
    (Abusalma, 2021; Agrawal et al., 2019; Edwards et al., 2000; Larivière et al.,
    2017) have highlighted that artificial intelligence can replace human capital
    in the performance of some tasks (i.e., adaptive tasks, contextual performance,
    and organizational performance). More specifically, AI systems may perform an
    increasing number of tasks without the control or supervision of humans (i.e.,
    autonomous machines that make decisions on their own, provide customers with personalized
    offers, find patterns in the data that humans would never look at, and manage
    employees) (Kumar et al., 2019; Shaw et al., 2019; Vrontis et al., 2022; Złotowski
    et al., 2017). Meanwhile, other studies (Jarrah i, 2018; Miller, 2018; Shaw et
    al., 2019; Wilson & Daugherty, 2018) have found that AI should complement human
    capital, not replace it. For instance, AI has been used for decision-making (i.e.,
    strategic, tactical, and operational decisions) (Duan et al., 2019; Edwards et
    al., 2000) and as a decision support tool, not to replace the role of decision
    makers (Duan et al., 2019). In this context, Shaw et al. (2019) added that artificial
    intelligence lacks empathy. More specifically, AI systems may not be able to comprehend
    or respond to emotions in the same way as humans.'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'It is well-documented that artificial intelligence affects job performance
    (Abusalma, 2021; Larivière et al., 2017; Miller, 2018; Prentice et al., 2020;
    Wijayati et al., 2022; Wilson & Daugherty, 2018; Younus, 2021). Abusalma (2021)
    used a sample of 319 managers to investigate the effect of artificial intelligence
    on job performance in Jordan’s banking sector. Their findings showed AI influenced
    job performance. For instance, artificial intelligence assists bank managers in
    administrative decisions and ensures lower transaction costs. In the same vein,
    Wilson and Daugherty (2018) concluded that AI allows employees to make better
    decisions, enhance their analytical and decision-making skills, and increase their
    creativity. They added that companies could benefit from optimizing “human-artificial
    intelligence collaboration” by enabling employees to work effectively with human-machine
    interfaces. It claims to be able to develop “fusion skills”. Similarly, Jia et
    al. (2023) interviewed employees to investigate whether artificial intelligence
    increased their creativity. Their results showed that AI mainly increases the
    creativity of higher-skilled employees. Compared to lower-skilled employees, higher-skilled
    employees are more capable of generating innovative scripts and developing positive
    emotions at work. Wijayati et al. (2022) conducted a questionnaire survey with
    254 employees in the service and banking sectors in Indonesia. They analyzed the
    impact of artificial intelligence on employee performance and engagement, including
    the moderating role of leadership in change. They found that AI has a significant
    positive impact on employee performance and engagement at work. Furthermore, they
    added that change leadership can positively mediate the impact of AI on the performance
    of the employee and their work engagement. Larivière et al. (2017) developed a
    conceptual framework to capture the essence of Service Encounter 2.0 and concluded
    that technology can complement/replace service workers and facilitate network
    connectivity. Prentice et al. (2020) stated that artificial intelligence plays
    a significant mediating role in the performance of employees. Younus (2021) stated
    that artificial intelligence improves staff efficiency and effectiveness (i.e.,
    improves performance, to reach desired goals). Zhang et al. (2022) added that
    AI enhances leadership, improves workplace flexibility, and ensures autonomous
    knowledge acquisition. Miller (2018) stated that a new level of human-machine
    symbiosis is required to augment the capabilities of individuals.


    However, it is also important to be aware of the potential negative impacts of
