  md: 'to achieve excellence in healthcare, providing a better understanding, quality,
    and consistency of all patient touchpoints (D. Lee, 2019; Park et al., 2016; Pisco
    & Biscaia, 2001).


    In this competitive landscape, characterized also by digital health tools that
    educate patients and monitor their own health, professionals must be seen as qualified
    and reliable to meet patients’ needs, expectations, and sacrifices. Therefore,
    it has become essential to adopt effective marketing strategies for healthcare
    professionals to stand out in the market. In addition to digital health tools,
    healthcare marketing should also be seen as a way to educate and inform patients,
    rather than just promoting services and products (Castillo et al., 2017; Tallia
    et al., 2018).


    However, it is important to remember that advertising, which is regulated by specific
    laws, and marketing in the healthcare field must be ethical and responsible; thus,
    marketing strategies must be evidence-based, aiming to protect patients and avoid
    misleading promises. Therefore, it is essential for healthcare professionals and
    institutions to follow these laws when devising their marketing strategies (Castillo
    et al., 2017; Tallia et al., 2018).


    Advertising legislation in healthcare varies according to each country and/or
    region but generally follows common guidelines and is regulated by government
    health agencies. For example, in Brazil, the National Health Surveillance Agency
    (ANVISA) is responsible for regulating advertising of healthcare products and
    services, while in Portugal, the enforcement of these rules is the responsibility
    of the National Authority of Medicines and Health Products (INFARMED) (ANVISA,
    2020; INFARMED, 2023; Decree-Law No. 238/2015 of the Ministry of Health, 2015).


    Advertisements for healthcare products, such as medications, equipment, and medical
    treatments, must be accurate and cannot make false or misleading claims about
    the effectiveness or safety of the product/service. Furthermore, communication
    cannot exaggerate the benefits of the product or even downplay its risks. Healthcare
    professionals must also follow legislation on how they communicate with their
    audience; they cannot make false or misleading claims about products and services
    they offer and must always maintain patient privacy and confidentiality (Abdalla
    & Castilho, 2017; ANVISA, 2020; Decree-Law No. 238/2015 of the Ministry of Health,
    2015; Sato, 2002).


    Nowadays, patients are increasingly aware of the diversity of their options and
    engaged in making better healthcare decisions. Due to the increased demand for
    health information, more and more innovative products are being introduced to
    the market, targeting new patient segments (Purcârea, 2016).


    Marketing has been neglected by healthcare for a long time, but now it has become
    an essential part of the sector’s growth. Healthcare marketing aims to reach both
    those who are ill and seek to regain their health, as well as those'
