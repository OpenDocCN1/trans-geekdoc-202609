  md: '# # THEORETICAL BACKGROUND


    # ## Services Marketing


    According to the Marketing Accountability Standards Board (MASB) (2023a), marketing
    is a set of institutions and processes for creating, communicating, delivering,
    and exchanging offerings that have value for consumers, clients, partners, and
    society as a whole. Marketing is simultaneously considered both an ‘art’ and a
    ‘science’. Through marketing, new products are created and introduced into the
    market, and professionals in the field strive to develop innovative solutions
    to introduce brands, products, and services into the market to meet consumer needs
    (Keller & Kotler, 2013).


    Marketing began in a traditional form with the use of advertising through various
    communication channels such as radio, television, newspapers, among others. As
    the demand for new means of communication increased, new areas within marketing
    emerged such as relational marketing, digital marketing, content marketing, product
    marketing, service marketing, among others (Bhayani & Vachhani, 2014).


    Relational marketing aims to foster brand and/or company loyalty among customers.
    To make them true brand advocates, it is necessary to establish and maintain a
    lasting and trusting relationship between the company/brand and its customers.
    The main idea is to keep the consumer engaged and satisfied, as a loyal customer
    is more likely to make new purchases, recommend the company to others, and even
    acquire products and services at premium prices. Within relational marketing,
    several main strategies are used including personalized service, the use of loyalty
    programs, exclusive promotions, frequent and targeted communication across various
    channels, among others (Keller & Kotler, 2013; Mailchimp, 2023b; Zinkhan, 2002).


    On the other hand, digital marketing combines a set of marketing strategies to
    promote products, services, and/or brands through digital means. These digital
    strategies aim to attract, engage, and convert potential customers into real customers
    by utilizing tools such as Search Engine Optimization (SEO), online advertising,
    marketing automation, data analysis, and other techniques. Digital marketing has
    become increasingly important for companies as consumer behavior undergoes constant
    changes and most people spend a significant amount of time connected to the Internet,
    whether through mobile devices, computers, or tablets. Because of this, investing
    in digital marketing is necessary for companies to show up where their audience
    is, allowing them to reach and connect with their customers more efficiently and
    effectively (Krishen et al., 2021; Mailchimp, 2023a; Torres, 2009).'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'Services have specific market characteristics and needs. The main differences
    between services and products are that services are fundamentally intangible and
    are created through direct interactions with customers (Kotler & Armstrong, 2015).
    Services allow for differentiation, modification, and customization, thereby enabling
    margin and profit. Services range from telecommunications to banking services,
    among others, such as schools, hospitals, professionals, and even domestic services,
    whether through the Internet or retail (Kahtalian, 2000).


    According to Kahtalian (2000) and Kotler & Armstrong (2015), services also need
    to be understood for their specific characteristics, such as:


    +   - Inseparability: each service has a moment when its production and consumption
    are simultaneous/indissociable. This differs from product manufacturing companies
    that have a clearly defined production time and consumption time. Thus, while
    a teacher ‘produces’ their class, it is ‘consumed’ by the students simultaneously.

    +   - Variability: services are variable, meaning they can vary between the provider
    and the customer. This characteristic has both positive and negative aspects.
    The advantage is that variation allows for service customization and differentiation.
    The disadvantage is that it is difficult to establish flawless service standards
    because quality depends on the provider.

    +   - Intangibility: services are not visible or tangible, meaning they cannot
    be seen, tasted, felt, heard, or smelled before purchase. Tangible items serve
    as evidence of service. They are guides, suggestions of what it should be. It
    can even be said that one of the marketing techniques for a service is precisely
    to ‘make the service tangible,’ that is, to make the invisible visible, emphasizing
    what the service promises.

    +   - Perishability: services cannot be stored. They are temporary and delivered
    at a specific time and place, meaning the company must be able to manage the service
    demand. It is important to find the right balance between supply and demand to
    avoid a common problem in services, which can be failing to meet excess demand
    or incurring high operational costs by not meeting necessary demand.


    Thinking about service marketing means thinking about value through performance.
    It values people, internal marketing, relationships established with customers
    and partners. It is understanding and meeting customer expectations through the
    transformation provided by the service (Kahtalian, 2000).


    It is important to remember service marketing excellence to prioritize a better
    customer experience. According to Keller & Kotler (2013) and Kotler & Armstrong
    (2015), this is achieved through the interaction of the following areas:'
