    The advent of AI heralded a new epoch in advertising, marked by a gradual yet
    undeniable shift towards data-driven, automated processes. Goldberg L. (2018)
    provides an insightful examination into the chronological adoption and impact
    of AI in advertising. A notable early instance of AI’s potential impact on consumer
    behavior can be traced back to the weather prediction software developed in 1950
    by Jule Gregory Charney, an American meteorologist. This pioneering application
    of predictive analytics not only revolutionized weather reporting but also enabled
    advertisers to tailor product promotions in alignment with weather conditions,
    thereby enhancing the efficiency and relevance of their campaigns (Huang & Rust
    2021).


    Further developments in AI technology facilitated the emergence of more sophisticated
    targeting strategies. For instance, the concept of predictive behavior modeling,
    introduced by Swedish computational linguist Jussi Karlgren, laid the groundwork
    for contemporary recommendation systems utilized by leading digital platforms
    like Amazon, Facebook, Netflix, and Spotify. These systems leverage collaborative
    filtering and other AI-driven methodologies to offer personalized suggestions,
    thereby significantly enhancing user engagement and satisfaction.


    The evolution of AI in advertising reflects a broader trend towards more intelligent,
    data-driven decision-making processes. This shift has not only improved the precision
    and effectiveness of advertising strategies but has also redefined the boundaries
    of marketing by enabling a level of personalization and responsiveness previously
    unattainable. As AI continues to evolve, its role in advertising is expected to
    deepen, offering unprecedented opportunities for innovation and engagement in
    the digital age (Kietzmann et al., 2018).


    In 2013, AI was first targeted to reduce the labour of content creation. More
    content equals more advertising chances, as content marketing gains popularity.
    But considering the number of advertisements and viewers available, excellent
