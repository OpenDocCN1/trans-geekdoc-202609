  md: 'We employed principal component analysis as the inference method to perform
    EFA. To determine the number of factors to retain, we used the Kaiser-Guttman
    criterion method (see Table 4). According to Kaiser (1960), eigenvalues greater
    than one rule is a frequently applied criteria for the number of components to
    be rotated. In fact, he explained that an eigenvalue of less than one is interpreted
    as an indication of poor reliability of the component values. In our case, we
    kept three factors (i.e., the three extracted components together explained 72.158%
    (> 50%) of the variance).


    # Rotation Method: Varimax with Kaiser Normalization


    As the rotation matrix, we used the varimax method, which is an effective orthogonal
    rotation technique for exploratory factor analysis (Kaiser, 1958). For every variable,
    it is intended to maximize the variance of the squared factor loadings (Kaiser,
    1958). Since the factor loadings in factor analysis are expected to be higher
    than 0.70 (Hair et al., 2010), in order to guarantee that a measure’s items are
    suitably loaded onto the underlying construct, we removed three items. Table 5
    presents the pattern matrix.


