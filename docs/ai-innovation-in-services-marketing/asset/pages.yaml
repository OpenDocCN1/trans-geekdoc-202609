- pgno: 101
  md: 'who are healthy but seek to maintain their well-being. The emergence of new
    Information and Communication Technologies (ICTs) forces this sector to open up
    to the outside and, mainly, to consumers/patients, thus it must increasingly interact
    with all involved parties, i.e., professionals and patients. Healthcare marketing
    is basically a service marketing, in which the consumer/patient is a value co-creator,
    as they actively participate in essential processes, encouraging service interaction
    for value co-creation. This new interaction approach allows enhancing the relationship
    between service quality and satisfaction, which are directly linked to the consumer’s
    experience, in this case, the patient (Anderson et al., 2019; Criré & Chebat,
    2013; D. Lee, 2019).


    In addition to the importance of using marketing in healthcare, we can also add
    some branches within marketing that can serve as strategies to reach consumers.
    Digital marketing and relationship marketing are two important areas within the
    healthcare context because through them, it is possible to communicate about diseases,
    treatments, and prevention, as well as help to retain patients and strengthen
    the image of healthcare professionals (Berkowitz, 2021; Mondal et al., 2022).


    When used in healthcare, relationship marketing aims to establish a lasting connection
    between healthcare professionals and patients through personalized actions, such
    as sending emails and/or text messages to answer questions and offer support in
    difficult times, conducting satisfaction surveys to identify areas for improvement,
    among others. These strategies are important for building a trust relationship
    between patient and healthcare professional. For this relationship to be genuinely
    built and lasting, it is necessary to always provide quality service, transparency
    in communication, and a commitment to consumer satisfaction (Berkowitz, 2021;
    Post Digital, 2023).


    When we turn our attention to digital marketing in healthcare, strategies are
    carefully crafted to fit digital platforms, such as social media (Facebook, Instagram,
    WhatsApp), blogs, websites, and email marketing. These are essential tools to
    promote services, products, and health-related information (Mailchimp, 2023a).


    In the healthcare realm, some recommended practices involve creating relevant
    and informative content aimed at educating the population about diseases and treatments.
    For example, clinics and healthcare professionals can use Facebook or Instagram
    pages to share tips on healthy habits, information about vaccines, results of
    scientific research, thus contributing to improving the image of the sector. In
    addition to educating, this type of content is useful for sparking consumers’
    interest in the services offered and highlighting the skills of healthcare professionals
    to potential patients (Mondal et al., 2022; Radu et al., 2017).


    It is relevant to emphasize that, compared to other industries, the healthcare
    sector has been lagging in engaging with customers through social media due to
    concerns about privacy, time management, and challenges of healthcare service'
