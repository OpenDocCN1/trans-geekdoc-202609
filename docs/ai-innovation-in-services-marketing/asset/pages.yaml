  md: 'al. (2022) argued that respondents thought female AI chatbots were more amiable
    and pleasant, while they thought male AI agents were more capable and reliable.
    Therefore, when it came to utilitarian products (e.g., a laptop), participants
    were more inclined to accept recommendations from male AI agents, whereas female
    AI agents were more likely to suggest hedonic products (e.g., jewelry). This may
    be due to the fact that men are much more likely to be involved with software
    compared to women, who tend to work in jobs that require greater interpersonal
    skills (Webb, 2019). In light of the above discussion, the following hypothesis
    is presented:


    H3: Moderation of gender has a significant effect on the relationship between
    artificial intelligence and job performance.


    # 2.4. Experience and Job Performance


    Work experience, which is generally defined as events that occur in an individual''s
    life, is correlated with job performance (Quiñones et al., 1995). The meta-analysis
    conducted by Quiñones et al. (1995) confirmed earlier findings on the positive
    correlation between work experience and job performance (Hunter and Hunter, 1984)
    and the fact that the most important type of work experience for job performance
    is task-level work experience (Ng and Feldman, 2010). However, they were among
    the first authors to analyze how the relationship between experience and performance
    is influenced by the moderating effects of two dimensions of work experience (i.e.,
    measurement model and degree of sphericity). Abusalma (2021) stated that the number
    of years of work experience has a statistically significant effect on job performance
    in Jordanian commercial banks. More precisely, ten to twenty years of experience
    are required to increase performance efficiency. Ratnawati et al. (2020) conducted
    quantitative research on 40 employees of PT Tirta Kencana Tatawarna Bengkulu.
    They also found that work experience has a positive and significant effect on
    employee performance (i.e., an employee''s performance decreases with decreasing
    work experience). In the same vein, McDaniel et al. (1988) confirmed the previous
    findings of Quiñones et al. (1995) and Abusalma (2021). However, they added that
    the length of experience and job complexity moderated the correlation between
    job experience and job performance. They explained that the highest correlations
    were found in populations with low average work experience and in occupations
    that impose low cognitive demands on workers. Thus, we propose the following hypothesis:


    H4: Experience has a positive and significant effect on job performance.'
