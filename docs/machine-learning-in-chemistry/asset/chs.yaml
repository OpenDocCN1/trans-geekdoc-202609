  \ |\n\n\n\n\n\n值得注意的是，图 3.7 中的决策树将数据分为了三个分支。由于计算的简单性以及为了避免信息的组合爆炸，决策树算法通常执行二分划分。在这种情况下，我们将得到如图\
  \ 3.8 所示的决策树。\n\n![image](img/bk9781788017893-00037-f8.jpg)\n\n图 3.8 使用`ID3` 算法的二叉决策树分类模型。\n\
  \n`C4.5`算法与`ID3`非常相似，但有一些细微的。该算法仍然使用信息/熵，但决策函数基于`信息增益率`(information gain ratio）而不是`信息增益`(information\
  \ gain）。如果将 `ID3` 方程泛地看作：\n\n![image](img/eqn3-36.jpg)(3.36)\n\n`C4.5`算法使用：\n\n\
  ![image](img/bk9781788017893-00037-t49.jpg)(3.37)\n\n关于`C4.5`和增益率的更多信息，请参阅[40]。\n\
  \n决策树算法被认为是“贪婪的”。它们的计算结果是针对下一个节点节点所做出的“最佳”决策。这并不意味着能获得整个数据集的最优分类。此外，决策树不包含任何随机性，因此结果将始终是相同的。为了提高分类效果，可以使用集成决策树方法。\n\
  \n### 3.5.3.3 决策树集成\n\n比一个决策树更好的什么？当然是成千上万棵决策树！然而，刚刚提到决策树遵循非常严格的程序，每次都会产生相同的分类结果，那么执行成千上万棵决策树有什么帮助呢？通过使用原始数据集的不同子集创建决策树，集成方法实现了跨大型数据集的泛化。集成方法可以使用随机选择数据来创建多个决策树。由于数据是不同的，就会创建不同的决策树。两种不同类型的集成方法是`bagging`(41)和`boosting`(42)。\n\
  \n`Bagging`代表“自助聚合”。自助意味着有放回采样。因此，bagging 算法从原始数据集创建新数据集，其中观测值可能会重复。然后从这些新数据集创建决策树。随后将观测值通过所有决策树，并在所有决策树的结果之间进行投票，以决定如何对观测值进行分类。这种方法提高了泛化性并显著减少了过拟合。随机森林（`RF`）是一种`bagging`算法，它除了使用随机随机创建决策树。\n\
  \n`Boosting`是另一种集成决策树方法。提升算法的目标是加强弱分类器；这是通过给所有观测值分配权重来实现的。分类错误的观测值权重增加，而分类正确的观测值权重则会减少。需要注意的是，决策树是顺序生成的。第二棵决策树是第一棵的修改版本，第三棵是第二棵的修改版本，依此类推。\n\
  \n### 结语\n\n决策树和集成方法是分类大量高维数据的一种有效方法，其额外优点是数据可以可以直接使用，无需进行缩放、转换或转换为其他形式。缺点是，在这些方法真正有用之前，需要大量的数据。此外，这种方法仅仅是一种排序算法——模型并没有尝试解释或理解数据与描述符之间的关系。决策树（以及集成方法）已用于药物发现，任务如为大型化合物集合选择信息最丰富的描述符集，以及对\
  \ ADMET 属性进行预测和分类；参考文献 43 中引用了一些示例文章。最近，这些方法（连同`PLS`）被用于在诺华公司创建 Profile-QSAR(44)。\n\
  \n### 3.5.4 支持向量机\n\n支持向量机（`SVM`）算法最初旨在将数据分类为两个组之一，假设是数据是线性可分的(45)。通过找到一个分离数据的超平面来分离数据——超平面一侧的任何数据都被分类为一组，另一侧的数据被分类为第二组。超平面是数学术语，指穿过多维数据数组并将其分离（分类）的层或平面；如果数据是二维的，则该分离器将是直线。\n\
  \n这意味着当描述符是数值且响应数据是二分类的（例如：是/否，1/0，开启/关闭，活跃/不活跃）时，使用了`SVM`算法。`SVMs`可以分为超平面、核和支持向量。\n\
  \n#### 3.5.4.1 超平面\n\n`SVMs`寻找分离数据到各自类别的超平面。但并不是任何超平面都能成功分离数据：它是最大化最近点之间距离的超平面（参见图\
  \ 3.9）。\n\n![image](img/bk9781788017893-00037-f9.jpg)\n\n图 3.9 五个超平面（黑线）。在图 3.9\
  \ 中，两个超平面（斜率最陡的）没有成功分类数据，因为每侧都有一个“o”数据点。剩余的两个超平面分离了数据；然而，到超平面的距离没有最大化。实黑超平面是最优平面，因为数据点距离最大。最大化间隔（后文描述）的逻辑是，如果添加任何数据点，新点可能会靠近现有数据。\n\
  \n#### 3.5.4.2 核\n\n`核`是将转换数据或将数据投影到更高维的函数——所谓的“核技巧”。在图 3.10 中，我们说明了线性可和非线性分离数据的概念，并讨论了用于分类/分离数据的核。\n\
  \n![image](img/bk9781788017893-00037-f10.jpg)\n\n图 3.10 (a) 线性分离数据，和 (b) 非线性分离数据。\n\
  \n只有在使用适当的核时`SVM`模型才可能成功。如果数据如图 3.10(b)所示，则线性核将是不合适的。当数据不是线性分离时，需要使用不同的核。例如，在图 3.10(b)中，我们在二维中绘制了数据。如果我们将数据投影到第三个维度\
  \ *Z*，其中 *Z=x²+y²*，我们可以看到数据分离了（参见图 3.11）。\n\n![image](img/bk9781788017893-00037-f11.jpg)\n\
  \n图 3.11 (a) 从图 3.10(b)投影到第三个维度的数据；(b) 投影后的数据随后绘制在*X*–*Z*轴上，以突显非线性分离数据在转换后现在是线性分离的。\n\
  \n\n\n\n\n转换后，我们可以找到一个分类数据的 `Z` 值。通过这个例子，我们看到使用正确的核函数对于 SVM 模型的成功至关重要。\n\n### 3.5.4.3\
  \ 支持向量\n\n如前所述，最优超平面取决于距离任一类类别最近的点。超平面与最近点之间的距离被称为边界（margin），而距离边界最近的点被称为支持向量。\n\
  \n在图 3.12 中，生成了一个超平面（深黑色线）。超平面的法线是一个垂直于超平面的单位向量。箭头表示单位向量指向数据点的方向。法线在超平面上的具体位置并不重要。\n\
  \n![image](img/bk9781788017893-00037-f12.jpg)\n\n图 3.12 用于计算从超平面到数据点距离的投影向量；箭头指向指向数据点的单位向量方向。超平面显示为深线，法线渲染为虚线。\n\
  \n计算按以下步骤进行：\n\n1. 在超平面上选择一个点。\n2. 找到该点的法线 `w`。\n3. 确保将法线转换为单位向量 `u`。\n4. 生成向量 `p`，它是数据点向量\
  \ `a` 在单位向量方向 `u` 上的投影。\n   ![image](img/eqn3-38.jpg)(3.38)\n5. 我们希望一类中最近数据点的 `p`\
  \ 的模，与第二类中最近点的 `p` 的模相同。\n\n在计算向量 `p` 时，我们计算了点到超平面的距离（`u · a`）。点积产生一个无量纲数字（标量），它给出了到超平面的距离大小。\n\
  \n现在，如果我们定义一个法向量 (`w`) 和一个向量 `x`，其中 `x=(x1, x2,…)` 且 `b` 是交点：\n\n![image](img/eqn3-39.jpg)(3.39)\n\
  \n该方程定义了超平面。但对于不在超平面上的点，该表达式将不等于零：\n\n![image](img/eqn3-40.jpg)(3.40)\n\n代表距离的点积可以是正的或负的，取决于点位于超平面的哪侧。现在，如果我们定义\
  \ `y` 为：\n\n![image](img/bk9781788017893-00037-t50.jpg)(3.41)\n\n如果满足以下条件，所有点都被正确分类：\n\
  \n![image](img/eqn3-42.jpg)(3.42)\n\n对于每个超平面，待优化的方程（`Margin`）给出：\n\n![image](img/bk9781788017893-00037-t51.jpg)(3.43)\n\
  \n法线 `w` 已经通过其模 `||w||` 进行了缩放，使方程具有尺度不变性。如果方程未缩放，法向量的大小将极大影响结果；唯一的因素应该是法线的方向。这通过将法向量转换为单位向量来实现。可以比较具有不同法向量的多个超平面。`Margin`\
  \ 找到了每个超平面最近点的距离，这就是我们想要在所有超平面上最大化的值。\n\n![image](img/bk9781788017893-00037-t52.jpg)(3.44)\n\
  \n由于真实数据存在噪声，数据并不总是可分的。因此，SVM 算法可以包含硬边界和软边界。硬边界意味着所有数据都需要被正确分类，而软边界允许某些点被错误分类以提高泛化能力。SVM\
  \ 算法的解是唯一的，因为它凸问题。关于支持机（Support Machines）的更多信息可以在参考文献 46。\n\n### 结语\n\nSVM 的主要优势之一是可以快速得出分类结果。但在将其应用于大量数据（超过\
  \ 10,000 个点）时需要考虑——与其他机器学习方法一样——它不会随着数据量的增加而扩展。这就是为什么在数据量巨大时会使用深度学习的原因。SVM 已用于药物发现中的性质预测、可及性评估以及活性陡崖的探索——一些示例可以在参考文献\
  \ 47a。\n\n### 3.6 总结\n\n呼。这涉及大量的数学知识。如果你一直读下去，祝贺你——你巩固了自己作为懂行的生物信息学者的声誉！现在你已经接触了一些流行的机器学习方法/工具，你可能在想，“最好的方法是什么？”嗯，交叉验证不仅适用于数据集（记得留出一些！）也适用于机器学习方法——简而言之，尝试所有方法并看看模型喜欢什么。一种方法的成功取决于数据集固有的结构和值。取决于你的需求（分类或回归）或你的数据是否为数值，某些方法可能完全不可用。报道，SVM\
  \ 和集成决策方法在总体分类中被认为更准确；48，然而，没有哪种方法适用于所有情况。\n\n## 致谢\n\n作者受 CRUK Manchester Institute\
