  \n其中一阶展开为：\n\n![image](img/bk9781788017893-00076-t13.jpg)(4.14)\n\n且 `x`^((1))={`P`[`i`],\
  \ `σ`[`P`]; `G`[`i`], `σ`[`G`]} 考虑了化学计量比。相应的高阶项以类似的方式生成 `x`^((2))[`ij`]`={`d`[`iI`],\
  \ `σ`[`d`]; `P`[`i`], `σ`[`P`]; `G`[`i`], `σ`[`G`]} 和 `x`^((3))[`ijI`]`={`θ`^(`I`)[`ij`],\
  \ `σ`[`θ`]; `P`[`j`], `σ`[`P`]; `G`[`j`], `σ`[`G`]}，它们与 Behler 的神经网络或其加权变体的原子中心对称函数相似。\n\
