  \n\n\n\n\n为了评估构建的决策树，使用了测试数据（即多晶型 3-4）进行预测和解释。首先，我们尝试预测测试数据（多晶型 3-4）的光谱。在这种情况下，多晶型\
  \ 3-4 的几何信息是已知的，如表 17.4 所示。如上所述，我们利用多晶型 3-4 位点的几何信息向下移动决策树（参见图 17.7)进行预测；决策树从“小四面体中最小\
  \ Si–O 键长≤1.6 Å”开始。多晶型 3-4 位点的小四面体中最小 Si–O 键长为 1.53 Å；因此，该结果为“真”。下一个真/假判断是“4.5–5.0\
  \ Å 之间的键数量≤4”。对于多晶型 3-4，该值为 15；因此，该结果为“假”。此外，根据表 17.4 中给的多晶型 3-4 信息，达到了簇 2（红色组）。\n\
  \n表 17.4 多晶型 3–4 的几何特征列表。\n\n| 描述符 | 多晶型 3-4 |\n| --- | --- |\n| 小四面体中最小 Si–O 键长\
  \ | 1.53 Å |\n| 键的数量 (4.5–5.0 Å) | 15 |\n| 最大 Si–O* 键长 | 1.60 Å |\n| 小四面体中最大 Si–O\
  \ 键长 | 1.59 Å |\n\n基于位点的几何信息，所提方法表明多晶型 3-4 的光谱特征与簇 2 相似，簇 2 由多晶型 2-2、3-1 和 3-2 组成。多晶型\
  \ 3-4 的实际光谱在图 17.8(a)中给出，同时包含了多晶型 3-1 的光谱，在余弦距离方面，多晶型 3-1 与多晶型 3-4 最相似（参见图 17.8(b)）。我们的方法预测测试数据属于簇\
  \ 2，多晶型 3-4 的光谱特征确实与多晶型 3-1 非常相似，表明该方法可以正确预测光谱特征。\n\n![image](img/bk9781788017893-00424-f8.jpg)\n\
  \n图 17.8 (a) 多晶型 3-4 和 (b) 多晶型 3-1 的计算 O-K 边光谱。改编自文献 83，[`doi.org/10.1038/s41598-018-30994-6`](https://doi.org/10.1038/s41598-018-30994-6)，根据\
  \ CC 4.0 许可，[`creativecommons.org/licenses/by/4.0/`](https://creativecommons.org/licenses/by/4.0/)。接下来，使用我们的方法来解释光谱。我们考虑了另一种情况，即已知光谱特征但不知道多晶型\
  \ 3-4 的材料信息。首先，我们测量了目标光谱（在这种情况下是晶型 3-4 的光谱）与数据库中所有其他光谱之间的余弦距离。在这种情况下，多晶型 3-1 的余弦距离最短，表明该光谱与多晶型\
  \ 3-4 最相似。通过这个过程，可以确定目标光谱的类别。在这个测试用例中，目标光谱归类簇 2，因为多晶型 3-1 属于簇 2。使用图 17.7 中的决策树对光谱进行解释。由于目标光谱与多晶型\
  \ 3-1 最相似，预计材料的材料预计与多晶型 3-1 以及簇 2 中的其他多晶型相似。然而，如上所述，簇 2 中材料的“特征性”特征是无法确定的。为了获得“特征性”特征，我们需要向上遍历图\
  \ 17.7 中的决策树。我们可以从决策树中获得初始信息“小四面体中最大 Si–O 键长≤1.6 Å”以及下一个分支点“最大 Si–O 键长≥1.54 Å”和“4.5\
  \ 到 5.0 Å 之间的键数量”（参见图 17.7）。这些信息与表 17.4 所示的多晶型 3-4 的几何信息一致。我们的方法基于决策树来预测和解释 O-K\
  \ 边光谱是有效的。因此，我们可以通过图 17.7 中的决策树来获得簇 2 材料的“特征性”特征。\n\n\n\n\n\n将这六个属性视为目标变量，通过神经网络进行了回归分析。最佳超参数通过网格搜索确定。训练数据和测试数据的正确值与预测值绘制在图\
  \ 17.10(a)–(f)中。\n\n![image](img/bk9781788017893-00424-f10.jpg)\n\n图 17.10 六种属性的准确值与预测值：(a)\
  \ 平均键长，(b) 平均键角，(c) Voronoi 体积，(d) 键重叠布布，(e) Mulliken 电荷和 (f) 跃能。灰色和深灰色（在线版中为彩色）点分别代表训练数据和测试数据。灰色对角线表示预测值等于实际值。箭头表示误差较大的光谱。改编自文献\
  \ 84，[`doi.org/10.1088/2515-7639/ab0b68`](http://https://doi.org/10.1088/2515-7639/ab0b68)，根据\
  \ CC BY 3.0 许可 [`creativecommons.org/licenses/by/3.0/`](http://creativecommons.org/licenses/by/3.0/)。\n\
  \n灰色和彩色圆分别代表训练数据和测试数据。灰色对角线上的圆表示预测值等于实际值。由于在图 17.10(a)–(f)中大部分彩色圆位于灰色线上，我们的神经网络模型可以准确预测这些局部属性，这表明关于几何和成键属性的信息隐含地包含在核心损失光谱的光谱特征中。此外，预测模型不仅对于键长和键角有效，对于\
  \ Voronoi 体积也同样有效。核心损失通常被认为反映了非常局部的信息（如键长和键角）；但本研究的结果表明，中程信息（如 Voronoi 体积）也被隐含地包含，并且可以通过机器学习进行提取。\n\
  \n除了几何属性外，同样的论点也适用于成键属性。神经网络可以正确预测所有成键属性（参见图 17.10(d)–(f)）。注意，该方法可以“仅”利用光谱特征正确预测激发能。\n\
  \n在核心损失光谱中，光谱特征和激发能通常是分开讨论的；例如，激发能（即化学位移）与氧化态有关，而光谱轮廓反映了导带部分态密度（`PDOS`）更详细和精细的结构。然而，本文的结果表明光谱特征本身包含了激发能的信息，且仅通过光谱特征即可预测能。此外，该方法还可以正确预测基态下的价带信息，即\
  \ Mulliken 电荷和键重叠布。已知核心损失光谱反映了激发态下导带的 `PDOS`，它与价态没有直接关系；但本文的结果表明，光谱特征确实包含了价态的信息。通过神经网络，从核心损失光谱的光谱特征中提取了几何和成键信息。\n\
  \n对图 17.10 进行详细检查发现，某些圆远离对角线（用箭头表示），这表明神经网络的预测在某些材料/位点失效。仔细检查这些圆（即误差较大的光谱）发现，某一属性误差较大的光谱往往在其他属性上也有相似的大误差。具体而言，有\
  \ 13 条光谱在两个以上属性上的误差排名最差十名，6 条光谱在四个以上属性上的误差排名前列。误差较大的光谱在图 17.10(a)–(f)中箭头所示。\n\n\
  详细分析显示了预测错误的两个原因。首先，训练数据中没有包含相似的光谱。其次，当训练数据中包含相似光谱时，相应的属性彼此存在差异。这两个原因都可以归因于独特的电子结构，这些结构无法从训练数据中学习到。^(84)\n\
  \n### 17.3.5 从噪声光谱中结构和属性的量化\n\n我们证明了 ELNES/XANES 可以基于神经网络量化结构和属性。然而，这些研究是使用理论模拟构建的光谱数据集进行的。具体而言，尽管实验光谱必须包含噪声，但图中并未考虑噪声。为了将我们的方法应用于实验光谱，必须研究噪声对预测准确性的影响。\n\
  \n图 17.11 显示了噪声对预测准确性的影响。图 17.11)。根据泊松分布对不包含噪声的计算光谱施加噪声，生成了八种不同噪声水平的光谱。图 17.11(a)显示了无噪声的光谱（蓝色）和带噪声的光谱（黑色）。每个噪声水平都生成了\
  \ 10 条光谱。\n\n![image](img/bk9781788017893-00424-f11.jpg)\n\n图 17.11 (a) 上方的（蓝色）和下方的黑色光谱分别对应无噪声和加噪声光谱。生成了八种不同的噪声水平（从下到上对应从高到低噪声水平）。(b)–(g)\
  \ 不同噪声水平下各属性的平均绝对误差（`MAE`）预测准确性。方形和圆符号分别对应使用和使用数据增强（`DA`）的预测准确性。\n\n\n\n\n使用数据增强（DA）的预测准确率如图\
  \ 17.11(b)–(g)中的圆圈所示。显然，即使对于噪声较大的光谱，使用 DA 的 MAE（圆圈符号）通常低于未使用 DA 的 MAE（正方形符号），这表明\
  \ DA 在构建对噪声鲁棒的预测模型方面非常有效。\n\n在键长、键角、米氏电电荷（Mulliken charge）和跃能方面，预测准确率比无噪声光谱（灰色虚线）更高（参见图\
  \ 17.11(b)(c)(f)(g)）。这种更高的准确率可能是因为比未使用 DA 的训练数据量更多。此外，键重叠布（bond overlap population）的预测准确率没有通过\
  \ DA 提高（参见图 17.11(e)）。尽管这种较差的预测并不明显，但我们可以推测光谱中键重叠布的信息较小且被噪声掩盖了。因此，高质量的小噪声光谱对于通过\
  \ ELNES/XANES 量化键重叠布是不可少的。\n\n最后，我们将我们的模型应用于实验光谱。我们测量了 α-石英样品的 O-K 边。我们使用了配备单色器的球差正扫描电子显微镜（JEM-ARM200F,\
  \ JEOL Ltd.）。由于 O-K 边被电子-空穴寿命展宽了约 0.1 eV，仪器的能量分辨率可以忽略不计。我们通过经 0.1 eV 高斯展宽的数据库重新训练了模型，并预测了实验光谱的性质。图\
  \ 17.12(a) 和 (b) 显示了理论光谱、实验光谱以及这两种性质。\n\n![image](img/bk9781788017893-00424-f12.jpg)\n\
  \n图 17.12 (a) α-石英的实验和理论 O-K 边光谱。(b) 来自实验光谱的理论值和预测值。改编自文献 84，[`doi.org/10.1088/2515-7639/ab0b68`](http://https://doi.org/10.1088/2515-7639/ab0b68)，根据\
  \ CC BY 3.0 许可协议 [`creativecommons.org/licenses/by/3.0/`](http://creativecommons.org/licenses/by/3.0/)。\n\
  \n实验光谱的形状与计算光谱相似；但包含一些噪声。尽管如此，实验光谱的预测性质与准确值非常相似。因此，我们可以得出，使用模拟光谱构建的模型对噪声具有很强的鲁棒性，即使从实验光谱也能准确预测性质。\n\
  \n## 17.4 结论\n\n在本研究中，我们回顾了用于 ELNES/XANES 光谱的“数据驱动”方法。首先，我们将无监督层次聚类和有监督决策树应用于光谱。构建了一个包含聚类图和决策树的二树结构，并将其用于解释和预测光谱。使用\
  \ 14 种金属氧化物和 25 种 SiO[2] 多型体的计算氧 K 边证明了所提方法。通过这种方法，可以根据材料信息（如化学、元素和几何信息）解释 ELNES/XANES\
  \ 光谱。此外，我们的方法在从材料信息预测光谱特征方面是有效的。\n\n此外，通过前馈神经网络从电耗谱中提取了隐藏信息。因此，成功预测了三种几何性质，即平均键长、平均键角和沃罗诺体积（Voronoi\
  \ volume）。这意味着光谱特征不仅反映了短程信息，还反映了中程信息。此外，我们的方法可以同时预测三种键合性质，即键重叠布、米氏电荷和跃能。尽管这些化学键合性质主要源于价带，但本的方法可以正确预测这些键合信息，表明反映导带的损失谱包含与基态价带的信息。\n\
  \n此外，我们还调查了噪声对预测准确率的影响。我们证明数据增强可用于构建对噪声鲁棒的预测模型。我们还确认了我们的方法在大多数情况下可以从光谱特征正确预测材料属性，并适用于带有某些噪声的实验光谱。\n\
  \n我们强调，所提出的机器学习方法不依赖于特定光谱，因此在解释和预测任何光谱数据以及衍射、发射和实验数据方面都应该表现良好。最近构建了一个包含 500,000\
  \ 到 800,000 份计算光谱的大数据库(82,96)。结合该数据库或其他类似的方法可以促进多功能且准确的预测和解释。总之，我们认为我们的方法可以为数据驱动的光谱解释、预测以及材料测量铺平道路。\n\
