  \ | 56.1 | | | | |\n| 48.2 | 0.88 | 88.9 | | | | |\n\n另一种应用于 MMA 聚合的优化策略使用了神经网络和\
  \ `GAs`。该过程通过前馈神经网络进行建模，该网络使用 `GA` 开发和训练以确保近乎优的拓扑结构。随后，求解方法包括应用 `GA`，它在计算决策变量最优值外，还计算目标函数的权重，从而克服了标量目标函数的困难。优化的目标是最小化多分散指数，最大化单体转化率，并获得数值平均聚合度的预设值。该方法更广泛的目标是开发一种基于机器学习技术的通用建模和优化方法论，这种方法可以很容易适应于其他复杂的非线性过程。图\
  \ 10.10 显示了该方法的某些细节。\n\n![image](img/bk9781788017893-00227-f10.jpg)\n\n图 10.10 基于神经模型和遗传算法的优化程序。\n\
  \n神经网络提供的预测通常具有极大的实用价值，能够补充或替代在时间、材料和能量上可能昂贵的实验。考虑到这些模型的工作方式、预测时间以及结果的准确性，它们被推荐用于在线优化程序。进一步的优势在于神经网络类型、结构提供的可能性，或者与其他仪器结合形成混合配置的可能性。\n\
