  \n结果是 8.1 所示的边缘化后验概率分布。\n\n![image](img/bk97817801793-f1.jpg)\n图 8.1 边缘化后验的反应速率分布。\n\
  \n观测约束直接限制了物种的丰度。尽管这种方法具有许多优点，但它对计算能力是巨大的负担。在模型模型本身不是文献 25 所关注的主题时，我们可能会使用机器学习来映射输入到输出。\n\
  \n## 8.4 用于复杂网络的机器学习技术\n\n最终，化学建模者需要依赖完整且准确的反应网络。减少此类网络的不确定性需要结合神经网络、贝叶斯推理和高级蒙特卡洛采样的尖端技术。虽然我们距离实现这些还有很距离，但机器学习技术已开始应用于天体化学。\n\
  \n神经网络被用于模拟完整模型^(26)。通过从完整模型(†)) 的输出中创建训练集，他们能够训练神经网络来预测这些输出。这使得毫秒内计算出观测所需的化学丰度，而运行完整的化学模型则需要分钟级。因此，可以使用完整模型的密切近似来进行计算密集型的参数推理。\n\
  \n此类神经网络在直接解释观测之外的用途。许多辐射流体力学模拟使用高度近似的辐射化学处理来提供气体的冷却速率。这是因为评估神经网络通常是一项小任务，因此可以将预训练的神经网络仿真器插入物理模型中。\n\
  \n机器学习技术在复杂有机分子网络的简化和提高准确性方面可能具有特别意义，特别是那些在 ISM 中尚未探测到的分子。例如，天体化学家的“圣杯”是在空间中寻找氨基酸。氨基酸是蛋白质形成中起关键作用的重要有机化合物。在蛋白质产生过程中，氨基酸连接形成聚合物链，代表蛋白质的结构单元。认为氨基酸的形成确实发生在\
  \ ISM 中，因为它们在陨石中已被明确探测到^(27)。这得到了实验室实验的支持，在实验中，在与天体相关的条件下通过对适当的前体分子进行紫外光子和离子照射，在模型尘颗粒表面形成了氨基酸^(28,29)。\n\
  \n\n\n\n解决此问题的可能方法是使用机器学习（ML）工具从光谱望远镜数据中的氨基酸识别弱信号。在检测分子时，通常通过将观测天体的频率与已知的分子发射频率进行匹配来识别光谱中的强峰。如果发射信号很弱，人类可能无法检测到，或者许多弱线的统计显著性可能会被忽略。通过根据光谱噪声和各种频率下的发射分布，训练一个将光谱分类为是否包含特定分子的分类模型，可以在人类可能漏掉的情况下提供高置信度的检测结果。对于此前未检测到的分子（如氨基酸），可以通过创建许多合成光谱来产生训练集。此外，这种分析可以毫不费力地对数千个目标进行，这对于旨在识别行星大气中分子的系外行星社区来说是一个非常有前景的前景^30\n\
  \n另一种解决方案是通过确定观测氨基酸的最佳条件来缩小范围。如果这些氨基酸存在，它们可能在尘埃颗粒的壳上形成。因此，我们必须确定甘氨酸和丙氨酸等简单氨基酸在尘埃冰壳上形成并随后释放到气相中的最佳条件。\n\
  \n理解甘氨酸和丙氨酸如何以及在哪里形成的关键前提，是确定导致其形成的表面反应，这些反应取决于(i) 动力学温度；(ii) 气体密度；(iii) 气体结构；(iv)\
  \ 冰上其他分子的存在和丰度；以及(v) 紫外和宇宙射线电离率等其他因素。迄为止，尚未根据上述参数对甘氨酸和丙氨酸的形成路径进行大规模预测。\n\n实现这一点的可能方法可能基于信息科学、机器学习和统计学领域开发的先进尖端技术。应该设计并应用统计学和机器学习技术的组合，来执行大规模化学模型，这些涉及气相和表面相化学反应的大型数据集，以推导出每个表面化学反应可行的物理和化学条件。一种值得研究的技术是概率图模型，它是机器学习的一个分支，研究如何使用概率分布来描述一个“模型”具有许多不确定性的特定问题。\n\
  \n最终，对于任何定义良好的物种集合（复杂有机分子 COMs、氨基酸、冰物种等），我们能够同时在大大的物理（密度、温度、辐射场和宇宙射线电离率）和化学（速率系数）参数空间研究它们的形成和破坏路径及效率，并发现这些物种在空间何时、何地以及什么条件下丰富。\n\
  \n## 8.5 结论\n\n利用机器学习和概率方法解决典型的天体化学问题是一个快速发展的领域。随着天体化学中采用更大的化学反应网络和更复杂的模型，对智能数据挖掘算法的需求将增加。显而易见，气相特别是表面反应以及速率系数存在巨大的不确定性，并且缺乏形成和破坏路径的信息。迄为止，这些不确定性仅通过实验室实验和量子力学计算来解决。然而，反应网络的复杂性、缺乏观测冰的先验信息以及每个实验室实验的长度，使得参数探索（例如气体密度、气体温度、紫外和宇宙射线流量）变得不可行。机器学习算法的初步“实验”已被证明是这一挑战的有效途径。\n\
