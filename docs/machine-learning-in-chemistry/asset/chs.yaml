  \ (Eka-silicon) | 72 | 72 | 锗 |\n\n\n\n\n\n| Eka-manganese | 100 | 99 | 镍元素 |\n\
  | Eka-molybdenum | 140 | 未找到 | 未找到 |\n| Eka-niobium | 146 | 未找到 | 未找到 |\n| Eka-cadmium\
  \ | 155 | 未找到 | 未找到 |\n| Eka-iodine | 170 | 未找到 | 未找到 |\n| Eka-cesium | 175 | 未找到\
  \ | 未找到 |\n| Tri-manganese | 190 | 186 | 铇 |\n| Dvi-teurium | 212 | 210 | 鄋 |\n\
  | Dvi-cesium | 220 | 223 | 法� |\n| Eka-tantalum | 235 | 231 | 锕 |\n\n### 指导原则 2：确保\
  \ ML 开发中使用的数据源与目标应用之间保持一致\n\n在构建模型时使用的测量值，或在模拟特定属性时使用的理论，与最终应用保持一致至关重要。由于现有的 ML\
  \ 模型除了其基于的训练数据外不具备任何智能，这一原则是直观的，但可能会被误用，正如我们在下例示例中所展示的那样。\n\n在微电子行业中，新材料被集成到电子设备中以推进摩尔定律。异质材料的集成导致这些材料之间产生许多界面。表征这些界面对于确保集成设备无故障地运行至关重要。这些界面的一个特定属性是粘附力。粘附强度取决于界面的内在化学键以及形成这些界面的外在处理条件。因此，对成分、界面形态和结构进行详细表征对于界面至关重要，但由于这些表面的埋藏性质以及构成设备的多个表面，这种表征变得既困难又耗时。为了解决这个问题，Kong\
  \ *et al.* 评估了估计铜与其他材料之间粘附力的几种方法^(17)。将用于估计界面粘附能量的 `DFT` 模型与基于每个界面润湿角实验量的 `ML` 方法进行了比较，以比较和对比估计粘附力的方法。基于\
  \ `DFT` 的模拟是在低温（0K）下进行的，此时仅考虑电子自由度。润湿实验是在较高的下进行的，因为材料被加热到了其熔点以上，隐含地包含了相变以及产生的结构和化学变化。比较结果见图\
  \ 20.4。(17)\n\n![image](img/bk9781788017893-00512-f4.jpg)\n\n图 20.4 基于量子的模拟与基于实验测量的\
  \ ML 之间的比较。\n\n总体而言，两种估计粘附力的方法在各自范围内范围内都是准确且一致的。由于润湿是在温度升高后测量的，在现实中，材料随着温度的升高可能会形成复杂的化学化合物或相。比较结果见图\
  \ 20.4。\n\n（注：原文中存在大量重复段落，此处根据要求不再重复输出，已翻译核心内容）\n\n### 指导原则 3：相关性不等于因果关系\n\n这是将经验观察联系到潜在原因的最基本的原则之一。科学发现需要区分观察到的相关性与潜在的因果关系。(20)\n\
  \n\n\n\n\n在演化生物学中，当现有条件被用于溯源这些事件的原因时，理解因与果之间的差异至关重要。de Duve^(22) 在列举不同的奇异性机制时给出了一个具体的说明，奇异性被定义为单一结果或事件的发生。de\
  \ Duve 规定了六种可能导致相同结果的不同原因。这些是：1) `确定性必然`（Deterministic Necessity，自然规律导致单一原因产生单一结果）；2)\
  \ `选择瓶颈`（Selective Bottleneck，外部强制约束导致单一结果）；3) `限制性瓶颈`（Restrictive Bottleneck，内部约束演化为单一结果）；4)\
  \ `伪瓶颈`（Pseudo-Bottleneck，除一个结果外所有其他结果随时间变化的进展性损耗）；5) `冻结意外`（Frozen Accident，罕见的统计事件导致单一结果）；6)\
  \ `奇幻运气`（Fantastic Luck，单一或极低概率事件导致单一结果）。基于相同的前提，我们可以列出化学和材料中因果关系复杂性的类似机制。在这些种机制中，结果都是通过实验测量或模拟的材料特定属性，如下所示。\n\
  \n1. **受控测量**：在严格控制的条件下进行测量，并测量所得属性。需要注意的关键点是，测量被充分隔离，使得特定的性质或属性受到控制。示例包括针对弹性模量的拉伸测量、针对化学成分的光谱测量，以及针对电子性能的低温测量。\n\
  \n2. **内外部相互作用**：系统的组件之间相互作用，并与环境相互作用。示例包括材料的多相平衡，以及由测量其的基底调控的薄膜性质。\n\n3. **跨尺度相互作用**：不同尺度之间的相互作用导致了测量的性质或属性。这些特定的相互作用是内部约束函数，如成分、样品尺寸*等*。例如晶粒生长，这又取决于工艺或样品尺寸以及制备条件，这些决定了材料的中观形貌，从而产生多晶材料的测量属性。\n\
  \n4. **跨时间尺度相互作用**：例如使用平衡性质代替随时间变化的动力学，导致仅在狭窄条件下产生相同的化学成分。\n\n5. **罕见事件效应**：这可能是由于影响所测属性的相对罕见事件导致的。示例包括测量仪的污染，或用于校准或计算的软件误差。这对于高灵敏度测量或大型复杂计算特别为适用。\n\
  \n6. **外部错误**：这由于设备设置或人为错误引起，包括分析中使用的确认偏误。示例包括设备设置，或在解卷积和分解复杂性质时存在多个步骤。\n\n这六种机制说明了这样一个原则：将结果与其相应的因果联系起来是非常的。该原则的重点是尝试消除替代机制，以便相关性有更高的概率归因于因果。之前原则之一中周期表形成的示例也存在了将相关性强行联系到因果的问题。尽管原始周期表是基于原子量与物理、化学性质的相关性建立的，但现代周期表结合了基于底层原子序和电子结构的后续科学进展^(23)。因此，通过量子力学，周期表已扩展与因果背后的原理相关。\n\
  \n### 指导原则 4：`在使用 ML 时优化信息提取`\n\n这一原则对于机器学习基于数据构建模式的意图至关重要。由于预计模式将揭底层关系，机器学习的核心是对系统本身信息的量化。我们通过信息指的是底层因果关系，这可能包括物理和自然规律、守恒律、对称性、热力学或其他构成关系。由于对于复杂的化学和材料系统，这些关系易于公式化、计算或测量，因此在数据的适用范围内，使用数据来识别模式是一种强大的替代方案。\n\
  \n确定所有系统的适用定律归于以下原因：复杂的相互作用、感兴趣系统的隔离，以及多体/多尺度效应的量化。当物理规律应用于真实系统时，所涉及特定材料或化学的范围是有限的，因此需要在不牺牲准确性的情况下进行简化。当涉及化学反应时，这变得更加困难，因为原子和电子的运动处于非局部平衡。例如，化学的精确多体模型扩展规模为\
  \ `O(n³-n⁸)`，其中 `n` 是粒子数量^(24)。大多数现实应用包含多个一个分子，并可能包含 `O(10²³)` 个分子。因此，当应用于真实的化学或材料系统时，准确性通过减少化学或材料的复杂性（减少原子或电子数量或缩短时间尺度）来权衡。这在图\
  \ 20.6 中定性说明，我们绘制了从经验观察的数据需求与从基本法则获得的信息（或预测准确性）之间的对比图。从左到右，复杂性通过使用更多的经验数据、使用较少的预测理论、计算或测量来解决。随着我们从左向右移动，框从白色（代表完全的可预测模型）变为基于\
  \ ML 的黑箱模型（代表所有的经验主义）。我们将在下方说明这一指导原则的示例，其中使用 ML 方法利用其他量子化学模型来估计电子相关能。\n\n![image](img/bk9781788017893-00512-f6.jpg)\n\
  \n图 20.6 不同模型与 ML 相比的信息*对比*，显示了物理理论信息与经验数据之间的权衡。\n\n\n\n\n\nHartree-Fock (`HF`)\
  \ 和 `DFT` 模型通常用于计算原子、分子和固态材料的基态能量学。这两种方法都是寻找薛定谔方程的近似解，该方程是描述电子/粒子波函数的多体、三维时间依赖形式体系。这些模型在实际应用中的困难主要在于两点：1)\
  \ 为了获得更高的预测准确性而处理所谓的电子相关能；；2) 如何将计算问题扩展到更大数量的电子和原子，同时不牺牲准确性。误差源于将一个电子与另一个电子之间的相互作用处理为平滑平均电子密度的函数。为了解决第二个困难，人们采用了许多近似方法（包括基于\
  \ `ML` 的近似方法）来表示相关性。Brockherde *et al.*^(25) 使用 `ML` 开发了解决 `DFT` 局限性的方法，而 Miller\
  \ 及其同事^(26,27) 则使用机器学习基于自洽 `HF` 方法构建了更准确的电子相关能模型。我们将使用后者作为示例，说明如何利用 `ML` 优化与相关能相关的信息提取。\n\
  \n在这个示例中，Miller 及其同事^(26,27) 使用 `ML` 构建了模型，以提高量子模型预测的“化学”准确性。这种准确性意味着总误差控制在 ∼1 kcal\
  \ `mol^(−1)`（∼4 kJ `mole^(−1)`）以内。(24) 使用 `HF` 方法引入的误差可能会影响化学键断裂重要的情况。为了解决这个问题，研究人员使用了基于分子轨道性质的特征，例如\
  \ `Fock`、`Coulomb` 和交换矩阵元素。这些特征解决了在预测性与描述符集大小之间权衡的挑战。基于 `ML` 的模型与更准确的后-Hartree–Fock\
  \ 方法（`Coupled-Cluster`、`Moller–Plesset` 扰动理论）进行了比较。通过优化特征集并将其扩展到热条件来进一步完善技术，证明了基于\
  \ `ML` 的模型的扩展性和迁移性，并在 7211 个有机分子上进行了测试。(27) 他们优化信息提取的成功显而易见，因为他们只需要更少的分子几何结构和计算就能达到相同的准确性。这项工作说明了一个指导原则：优化使用\
  \ `ML` 方法可以规避更准确的量子化学模型扩展缓慢的问题，而无需牺牲准确性。\n\n### 指导原则 5：一致地结合不同方法（包括实验、理论和模拟），以提供更大的适用范围\n\
  \n该原则强调需要一致地结合所有四个部分以获得整合解决方案。结合实验、理论、计算和数据可以确保分析的自洽性和系统性。这反过来确保了分析的可预测性和更广泛的适用性。这一原则与其他某些原则保持一致（原则\
  \ 1 限制将 `ML` 用于外推，原则 3 关于因果关系 *对比于* 相关性，以及原则 4 优化信息提取）。如前所述，用于构建构建的理论和测量值与使用 `ML`\
  \ 的最终应用保持一致是非常重要的。\n\n下面提供了一个结合实验方法、数据、计算和理论研究改变癌症代谢的说明性示例。该示例关注透明细胞肾细胞（`ccRCC`）的临床应用。(28)\
  \ 作为肾癌最常见且致命的亚型，`ccRCC` 目前通过部分肾切除术期间术中冰冻分析进行诊断。如果能告知医生哪些组织应该切除，哪些组织应该保留，将大大提高手术成功的几率。\n\
  \n由于分析性质耗时且不可靠，该研究确定了脱吸电喷电离质谱成像（`DESI-MSI`）结合统计 `ML` 方法是否可以作为替代的分子诊断和预后工具，用于划定手术边缘。在这种技术中，组织样本被安装在可以在\
  \ `x` 和 `y` 方向移动的平面表面上。表面受到带电微滴的轰击，更小微滴的溅射进入质谱仪，产生内容极其丰富的二维化学图。在这种情况下，实验涉及 23 对新鲜冷冻的良性和癌症组织样本的\
  \ `DESI-MSI` 成像。根据从 `DESI-MSI` 获取的小分子代谢物、脂肪酸和脂质，成功训练了一个二分类器，每个患者的准确率达到 85%，用于根据代谢物相对丰度的变化来学习良性组织与癌症组织之间的差异。由于训练过程返回的是稀疏模型，该化合物集合具有高度的可解释性，并被用于实验鉴定与正常组织相比，哪些代谢物在癌症组织中过表达或被抑制。模型特征与可识别代谢物之间的联系至关重要，因为为预测提供了信心，并对癌症代谢变化产生了新颖见解，包括三羧酸循环、脂肪酸和氨基酸通路。例如，这种方法发现`葡萄糖`与`花生酸`的比例在区分正常组织和癌症组织方面具有高度预测性（>70%），表明癌症的生长维持依赖于高葡萄糖产生和脂肪酸分解。\n\
  \n尽管最初的目标是改进冰冻切分析，但它可以扩展到“更广泛的适用范围”，即研究肾癌的代谢脆弱性，以指导新治疗药物的开发。值得注意的是，这个示例符合关于优化信息提取的原则\
  \ 4，肾癌代谢利用的变化是通过代谢物相对丰度的差异被捕捉的。\n\n## 20.3 结论与警告\n\n正如前述提到的许多文献所示，`ML` 方法在许多消费应用中被证明是非常强大的，并且在解决化学和材料的许多方面的应用中是有效的。我们在本章中的意图有两点：在实验、理论、计算和数据这四个部分构成的框架下构建\
  \ `ML` 应用，并对使用 `ML` 方法提供警示性观点。我们通过提供五个具体的指导原则以及它们如何用于系统性分析来实现这一点。\n\n\n\n\n\n在第一层，在四个组件内部使用机器学习（`micro`\
  \ 或 `intra` 链接）可以加速分析。示例包括：优化过渡态分析、加速基态能量计算、用于原子尺度模拟的原子间势能学习的机器学习，以及在反应数据（包括失败或未成功的水热合成）上训练的机器学习，用以预测硒酸钒盐类结晶的反应结果等。\n\
  \n在第二层，不同组件之间的关联可以加速整体分析（`macro` 或 `inter` 链接）。组件之间的每种链接都提供了特定的作用：`measurements`\
  \ 测量提供了实验与数据之间的联系，`validation` 验证充当实验与理论之间的纽带，`modeling` 建模是计算与理论之间的联系，而 `simulations`\
  \ 提供了计算与数据之间的联系。示例包括：将机器学习方法与实验相结合以驱动金属玻璃的分析；将实验、计算和数据相结合以控制过程或加速分析；将计算和数据与机器学习相结合以建立表面反应的理论理解；使用深度神经网络洞察基于量子力学的分子稳定性理论；将机器学习与流体反应器相结合以实现多种化学反应的自动化优化；通过结合实验、理论、数据和计算，Zare\
  \ 团队展示了透明细胞肾细胞癌的临床应用（如前一节所述）。\n\n我们的五个指导原则旨在帮助将机器学习应用于物理科学，这些原则基于多年开发和应用方法解决化学和材料科学问题的经验。随着这些技术被更广泛地采用，我们希望这些原则在解决化学、工程和材料科学问题的应用过程中能作为一种保障。同样重要的是，这些原则并非用于指令性规定，而是为希望将机器学习应用于物理科学的科学家和学生提供的指南。这些原则还强调了，机器学习并不是基础性理解所需的四四个关键组件（实验、理论、计算、数据）中任何一个的替代品。\n\
  \n我们通过 1953 年迪森与费米关于介子-质子散射的讨论来说明这一最终的核心原则。他们合作的目的是是将迪森的理论模型和计算与费米的测量结果进行比较。尽管比较结果接近，但费米对截断参数的任意性持批评意见。费米的观点代表了当时物理界的普遍认知，即通过四个任意参数就可以拟合一头大象，而有了五个参数，就能让大象动动鼻子。梅耶等人通过五个复杂的参数证明了事实确实如此。核心信息是：如果没有物理基础，通过参数或方法对实验数据进行验证本身是不靠的。我们希望，机器学习的广泛使用将受到物理法则的约束。\n\
