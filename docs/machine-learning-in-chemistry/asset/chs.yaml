  \n## 7.1 引言\n\n合成化学是药物化学和材料化学的核心。预测分子将如何反应以及如何进行合成需要专家知识。诸如 Reaxys 和 SciFinder 等数据库包含数百万种化合物、反应和参考文献。尽管集成工具允许进行搜索，但分析这些信息仍然是一个手动过程。\n\
  \n逆向合成规划是在给定反应物、试剂和一组反应条件的情况下预测产物。实验主要用于识别反应结果，但实验既昂贵又耗时，并且需要经验化学家。优化反应条件（如催化剂和溶剂）也是合成规划的重要部分。即使是微稍微改变反应条件，也可能导致不同主要产物的形成或反应失败。将\
  \ CASD 与高通量筛选和机器人设备相结合，对于反应优化的未来具有广阔前景。\n\n人工智能、机器学习方法的进步以及大数据的可用重新引发了人们对 CASD 的关注。在本章中，我们将概述反应数据的来源和表示方法，简述专注于合成化学的机器学习方法，并结合当代示例和对比提供\
  \ CASD 的详细方法。\n\n## 7.2 化学数据的性质\n\n### 7.2.1 数据来源\n\n\n\n\n\n训练机器学习算法需要海量的数据。通常，该领域使用监督学习方法（参见第\
  \ 7.3 节）；这些方法需要带标签的数据。这意味着需要每个输入对应的地面真值（ground truth），无论是反应物、产物还是产率数据。反应通常从反应数据库中提取、经过清洗，并重写为机器可读的格式。^(7,8)由于缺乏常规的数据提取方法，导致不同类型的信息以不同的方式进行管理，并被用机器学习方法的输入。数据库存在噪声，并且可能包含重复甚至是错误的反应。这些应该在清洗过程中被移除。\n\
  \n记录的产生多个产物的反应可以通过两种方式管理：可以保留产率最高（*即*主要）的产物并丢弃其他，^(8)或者将反应拆分为多个单产物反应。^(9–12)在逆合成和正合成规划工具中，通常需要原子级映射（Atom-to-atom\
  \ mapping），通常是为了识别反应中心。原子映射索引用于标记反应物物种中所有映射到产物物种原子原子，如图 7.1 所示。索引错误或不完整的反应应该被移除。其他反应信息（例如立体化学）由于可用性稀缺、难以编码为分子描述符或难以整合到模型中，在历史上一直难以结合。\n\
  \n![image](img/bk9781788017893-00169-f1.jpg)\n\n图 7.1 原子映射反应的示例。\n\n科学期刊出版物和专利中报告的反应数据可以通过商业数据库（如\
  \ Reaxys 和 SciFinder）获取。合成化学家使用这些工具检索相关的实验步骤、化学文献和专利。然而，提取大量的反应数据以进行数据分析或训练机器学习模型需要特定的许可证。虽然罕见，但学术研究小组已从\
  \ Reaxys 中提取了约 1250 万条单步反应，并建立了前向反应预测模型^(13,14)、逆合成路线设计^(14,15)以及反应条件的预测。^(16)尽管如此，为了比较模型，需要一个访问不受限制开源数据集。\n\
  \n来自美国专利和商标局（USPTO）的开源专利数据是没有商业许可证时的首选备用数据集。Lowe 解析了 1976 年到 2016 年 9 月的美国专利。^(17)使用文本挖掘提取了反应物、产物、试剂、溶剂、使用的分子量、产率、温度、时间、制备和后处理步骤。^(18)这个常用的基准数据集包含约\
  \ 100 万条单步反应。分子输入线性输入系统（`SMILES`）^(19)字符串（参见第 7.2.2 节）代表每个原子映射反应中的分子。USPTO 数据集对于构建合成设计模型有用，因为它包含了许多常用的化学反应，特别是用于药物化学的反应。该数据集的子集已经过预处理并被分为训练集、验证集和测试集。包含约\
  \ 48 万条反应的 `USPTO_MIT` 子集已用于反应预测。^(20)对于逆合成任务，过滤后的 5 万条反应数据集（`USPTO_50K`）被分为十类反应类型（参见表\
  \ 7.1）。^(21)这使得可以根据单个反应类型对模型进行比较。USPTO 数据集包含预测性示例，即尚未执行的预测实验方法和结果。^(22)\n\n表 7.1\
  \ `USPTO_50K` 中的十种反应类型^(21)\n\n| 反应类别 | 反应名称 | 占比 (%) |\n| --- | --- | --- |\n|\
  \ 1 | 杂原子烷基化和芳基化 | 30.3 |\n| 2 | 酰化 | 23.8 |\n| 3 | C–C 键形成 | 11.3 |\n| 4 | 杂环形成\
  \ | 1.8 |\n| 5 | 保护 | 1.3 |\n| 6 | 脱保护 | 16.5 |\n| 7 | 还原 | 9.2 |\n| 8 | 氧化 | 1.6\
  \ |\n| 9 | 基团转化 | 3.7 |\n| 10 | 基团加成 | 0.5 |\n\n期刊和专利中发表的反应数据倾向于高产率反应；低产率和失败的反应很少被报道。后者可能包括原料完全剩余的反应或导致意外产物的反应。因此，基于发表数据建立的监督学习模型是有限的，因为训练需要反例。失败数据的缺失可以通过生成负样本来克服。这里使用反应模板（参见第\
  \ 7.4 节）生成化学上合理的“错误/假”产物。^(13,15,23)\n\n电子实验室笔记本（`ELNs`）被制药行业的化学家记录实验步骤、条件和注释。它们还存储了产率和谱图等有用数据。ELN\
  \ 包含失败数据，因此可以用于增强监督学习模型，无需生成负数据。ELN 涵盖的限制原料空间包含了常用的反应。这些反应被认为是高质量、可重复且可靠的。由于保密原因，ELN\
  \ 对外公开也不在商业数据库中。然而，在可以访问的情况下，ELN 内部的反应数据已用于建立反应预测模型^(24)、逆合成模型^(8,24)以及反应条件的预测。^(25)\n\
  \n### 7.2.2 分子描述符\n\n为了让机器学习算法从化学结构中学习，这些结构必须表示为算法可以处理的形式。分子描述符基于分子的结构、物理化学、电子或拓扑性质。所使用的描述符类型会影响算法性能，因为它必须捕捉所需的的相关信息。\n\
  \n\n\n\n\n一维描述符将分子表示为结构片段的列表。它们具有快速、易于计算和易于比较的特点。例如分子指纹。这些是由二进制位组成的向量，对应于特定子结构的存在或否。这些编码信息仅定义了分子的一维特征。分子指纹也可以通过编码每个原子的邻域来包含与原子连接性相关的二维信息。三维构象信息也可以被编码。一种名为`Morgan\
  \ circular fingerprints`的指纹被用于通过比较目标分子与知识库中产物的相似性来预测反应物前驱体。^(9) 反应指纹通过产物指纹之和与反应物指纹之和之间的差计算得出，用于分类反应类型。^(26)\n\
  \n二维描述符编码了分子的拓扑结构（即连接性）。例如，分子图包含对应原子的节点和对应连接原子的键边。节点由原子类型标记，键根据键的类型加权。分子图计算快速且易于解释，因为具有相同图的分子是相同的分子。另一种类型的二维描述符是线性记法，它将分子描述为字符序列。最广泛使用的线性记法是`SMILES`及其扩展，，`SMARTS`（SMILES\
  \ 任意目标规范）和`SMIRKS`（一种反应变换语言）。`SMILES`字符串定义如下。\n\n*   原子以其原子符号写出。\n*   单键、双键、三键和四键分别写为“-”、“=”、“#”和“$”，尽管单键通常被省略。\n\
  *   芳香环中的原子使用小写字母编码。\n*   反应可以通过“>”符号将反应物、试剂和产物隔开来写。对于单个分子，多个`SMILES`字符串可能是有效的，因为字符串可以从分子内的任何原子开始。在构建模型时应该考虑到这一点，方法是对对`SMILES`字符串进行规范化，或者构建一个能够理解哪些不同`SMILES`字符串是等价的模型。`SMARTS`字符串是`SMILES`的扩展，包含了额外的逻辑运算符以允许搜索通用子结构。`SMIRKS`是另一种描述通用反应变换的扩展。这些线性记法可以作为机器学习算法的直接输入。^(27–29)\n\
  \n另一类描述符利用量子计算得到的性质。示例包括核磁共位移、静电荷、HOMO/LUMO 能量、振动频率和强度。量子化学计算已作为描述符用于预测产量。^(30)\
  \ 然而，密度泛函理论（`DFT`）计算的成本很高。\n\n## 7.3 机器学习方法\n\n机器学习算法可以根据给的任务分为许多类。本节将关注最流行的两种，即监督学习和无监督学习。在监督学习中，对输入-输出对之间的关系进行建模，以建立预测模型。输入数据可以用各种有效的描述符表示，范围从数值向量到分子图（见\
  \ 7.2.2 节）。监督学习模型处理输入数据并返回数值或二值作为输出数据。监督学习的关键方面是输出值是已知的，并可以作为示例引导学习过程。\n\n如果输出数据是连续或定量的，则（此处原文逻辑似乎有混乱或重复，按原意翻译）...\
