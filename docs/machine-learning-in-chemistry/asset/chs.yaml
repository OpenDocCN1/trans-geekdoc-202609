  \ AND J. DAKKA\n\n^a Schrödinger, Inc. 101 SW Main Street, Portland, Oregon 97204,\
  \ United States\n^b Schrödinger, Inc.120 West 45th Street, New York, New York 10036,\
  \ United States\n\n\\*邮箱：`joshua.staker@schrodinger.com`\n\n## 15.1 引言\n\n化学的应用是非常广泛的。我们所接触和消费的几乎一切事物，从构成药物的分子到驱动科技的电子产品，再到鞋子和眼镜中的材料，都是化学的结果。化学领域的进步对全球范围内范围内提高生活质量具有深远影响。在化学领域工作的一个重要部分是利用技术来加速设计过程，并提高开发的分子和材料的质量。在许多应用中，技术被用于构建分子的模型和模拟，以在计算机中（*in\
  \ silico*）预测分子在现实世界中的相互作用和表现。模型越快越准确，我们的发现工作就越有效。\n\n化学模型有许多种类，包括机器学习模型以及从物理学上推导出来的。严谨的物理计算，例如用于估计分子电子性质的从头算法（*ab\
  \ initio*方法），在准确性方面很难超越[1,2]。然而，严谨方法的计算成本高昂，且在包含许多原子的巨型数据集或化学系统上运行成本往往不可接受。相比于基于物理的计算，机器学习（ML）的计算成本通常较低，并且当使用足够的数据训练灵活模型时，它可以变得非常准确[1]。因此，机器学习对于估计大量分子的性质非常有用。\n\
  \n化学中的许多机器学习方法将分子作为输入，尽管也可以使用描述化学环境的其他特征，或者在分子之外额外包含这些特征。在机器学习中使用分子时，经常会遇到一个困难：大多数机器学习算法无法在标准的分子格式（*例如*SMILES\
  \ 或连接表）上运行，因此方法通常首先要求将分子描述为算法可以理解的形式。我们称这种新形式为“表示（representation）”，获取这种形式的过程称为“特征化（featurization）”。遗憾的是，许多机器学习算法需要固定长度的向量表示，而这种格式并不适合以无歧的方式描述分子。\n\
  \n将分子描述为固定长度向量的一种方法是计算分子的各种性质和描述符，然后将计算出的输出排列成“特征向量”。在这种方法中，很难知道应该计算哪些特征，且特征的选择高度取决于感兴趣的终点。另一种方法是计算分子指纹，其中确定子结构的存在，然后将其编码为固定长度的二进制向量。然而，二进制指纹可能会出现位碰撞，即单个位编码多个子结构，从而降低表示的精确性。分子指纹和计算的特征向量都是粗粒度的表示，它们不可逆地丢弃了分子信息，迫使学习算法依赖不完整的分子表示。此外，这类“非学习型”特征化依赖于预测模型之外的大量预处理。\n\
  \n相反，能够接受复杂数据结构作为输入的灵活机器学习模型为学习更完整的分子表示提供了可能。获取更完整的信息使学习算法能够自动化特征化过程，并利用数据学习与任务相关的特征。最近的神经网络架构支持对复杂输入进行学习，包括图、3D\
  \ 网格和变长序列，这些格式更适合表示分子。学习表示不仅通过对最少处理的数据操作来简化特征化过程，还能产生更准确的模型。\n\n在此，我们对学习表示和非学习表示的区分如下：非学习表示是利用启发式或物理方法从分子推导出的，其输出排列成特征向量；而分子的学习表示是通过机器学习模型从数据中学到的变换产生的中间潜向量。我们对学习与非学习的定义从计算或数学角度来看并不一定严格或严谨，但对于描述和理解每个类别中的各种方法以及各自的通用优缺点是有有帮助的。\n\
  \n深度学习的最新进展重新激发了各行业对利用海量数据学习特征化过程的兴趣，而不是依赖于预定义的启发式来生成特征。随着目前文献、公共库以及商业公司内部产生的大量化学数据，科学家现在有了更大的机会利用更灵活的模型。因此，深度学习在化学领域变得越来越流行，作为一种学习表示和构建更强大模型的方法。虽然学习表示和非学习表示都可以用于进一步的下游建模（包括神经网络），但学习更完整的分子表示的能力是一个重要的区别——对于许多终点（如蛋白质-配体结合），构建包含足够信息以进行可靠预测的特征向量是非常困难的。\n\
  \n\n\n\n在本章中，我们将描述化学领域中常用的常规的、非学习的特征化方法，以及它们的若干局限性，并讨论深度学习如何帮助规避这些局限性。接下来，我们将探索学习型表示背后的动机，即典型的分子数据格式（*例如*，`SMILES`\
  \ 或连接表）如何通过一组学习到的参数转换为新的 n 维空间，该空间对于各种形式的分析和模型构建都是很有用的。最后，我们对用于获取学习表示的几类深度学习架构进行概述。回顾近期文献中出现的所有相关表示学习方法是不可能的，即使是那些与化学直接相关的方法。相反，我们提供了几类架构的高层级概述，作为理解、实现和改进分子表示的切入点。\n\
  \n我们的讨论特别关注如何将经过极少处理的输入数据转换为潜形式，我们鼓励读者查阅文献以获取有关模型构建其他方面的细节，包括优化、各种超参数以及其他实现细节。分子的表示学习仍然是一个相对新的领域，仍然需要许多工作来寻找更通用的表示方法。在整个讨论过程中，我们还涵盖了开发更好表示的某些需求、挑战和机会，特别是在底层物理学的背景下。\n\
  \n## 15.2 非学习分子表示\n\n通常，化学科学从业者可以获得的数据包括标准格式（如 `SMILES`、`SDF` 或连接表）的分子集合，以及一些感兴趣的属性。此类数据集的一种用途是在给定分子和标签的情况下训练模型，然后使用训练好的模型对模型之前未见过的新分子进行属性预测。化学中常用的机器学习方法通常依赖于相对简单的模型，例如逻辑回归或多层感知器（`MLPs`），这些模型需要固定长度特征向量作为输入。在构建此类模型之前，一个紧迫的问题是：如何将一组分子并转换为模型可以使用的格式？幸运的是，分子可以通过几种特征化形式转换为固定长度的向量，每种形式都有权衡，尽管在特征化过程中选择生成哪些特征并不是易事，并且需要对分子中预计会与终点相关的模式类型做出假设。此外，许多特征的计算成本很高；而且，如何获取它们可能并不显而易见，例如如何正确表征与结合预测相关的蛋白质与配体之间的特定相互作用。\n\
  \n从 20 世纪 50 年代开始，分子特征化围绕构建定量结构-活性或性质关系（`QSAR/QSPR`）模型展开^(3)，并在历史上一直通过非学习变换执行。传统的非学习特征化方法包括将分子片段哈希为“指纹”，或计算并排列成“特征向量”的各种物理属性。常用属性的示例包括\
  \ `logP`、量子力学计算、合成可行性、可旋转键数量、手性中心数量等等。值得注意的是，作为机器学习模型输入的许多分子属性本身就是近似值，*例如*，`logP`\
  \ 或 `DFT` 能量；尽管可以使用后文讨论的学习型特征化来近似这些输入属性，但它们在历史上是通过使用相对简单的模型或非学习变换获取的。我们鼓励读者查阅 `Cherkasov\
  \ et al.`^(3)，对常见特征化形式及其与 `QSAR/QSPR` 的关系进行更全面的讨论。拓扑分子指纹是另一种被广泛采用的特征化形式^(4)。指纹在文献中经过了时间的检验，并继续被用作深度学习的基准^(5,6)。其他其他非学习特征化形式，但拓扑指纹和计算属性最为常见，并在接下来的小节中简要描述。\n\
  \n### 15.2.1 分子指纹\n\n并不是每个分子的大小都相同；事实上，分子可以很小（只有几个原子），也可以很大（如天然产物或多肽）。分子指纹生成通常是将\
  \ 2D 或 3D 分子图编码为固定长度的二进制位串，其中“开启”位表示子结构的存在，而“关闭”位表示缺乏子结构。无论分子大小如何，指纹长度都是固定的，为 `ML`\
  \ 提供了合适的表示形式。\n\n目前没有单一标准的指纹形式，已经开发出了多种变体。与机器学习相关的方法共同的原则是将分子片段编码为固定长度的向量。`Cereto-Massagué\
  \ et al.` 描述了指纹的各种形式及其产生方法^(7)\n\n方法之间的主要区别在于如何检测子结构以及哪些子结构被编码到开启位中。例如，`ECFP` 方法从中心原子向径向外考虑原子区域^(8)，而\
  \ `MACCS` 则采用用户提供的 `SMARTS` 模式来定义子结构匹配规则^(9)9))子结构总量是巨大的。与其将每个子结构独立地编码为极长稀疏的向量，不如对子结构进行哈希，将向量限制在用户指定的固定长度内。虽然较长的指纹减少了位碰撞（单个位编码多个子结构）的风险，但向量会变得非常稀疏，所有模型类型都能很好地处理稀疏性，且计算成本几乎会增加。\n\
  \n固定长度指纹向量非常适合直接用于 `ML`，而无需对哪些属性应该被计算并作为特征做出特定假设。指纹的另一个优势是其可解释性。虽然无法从指纹重建原始分子图，但开启位指示了分子中存在哪些子结构，并可以进行可视化和检查。\n\
  \n\n\n\n指纹（Fingerprints）已被证明极其有用，并经常被文献所采用。然而，仍然存在一些端点很难使用指纹进行建模。例如，蛋白质-配体结合涉及分子在\
  \ 3D 空间与蛋白质的相互作用，而蛋白质信息通常不包含在分子指纹中。此外，指纹丢弃了整体图连通性，*即*，它们包含了关于存在哪些子结构的信息，但没有包含它们是如何连接并形成整个分子的，这使得远程相互作用和立体化学的建模变得更加。另一个缺点是，指纹有时需要非常长，因此极其稀疏，以编码大量的不同子结构；这些与分布式表示（distributed\
  \ representations）相比，效率和表达能力较低。它们还忽略了许多内部自由度，例如原子之间的 3D 空间关系，并且不包含足够描述动力学的信息。\n\n\
  总而言之，指纹易于计算，长度固定且与分子大小无关，是二进制且稀疏（能够轻量级存储），并具有可解释性。存在多种形式的指纹，可以在实验期间通过经验方法进行选择和评估。尽管如此，这些优点是以潜在的位碰撞和丢弃整体图连通性为代价的。\n\
  \n### 15.2.2 可计算特征\n\n分子建模特征生成的另一种经过时间考验的方法是计算分子属性，这既可以通过启发式方法也可以基于物理的计算来实现。首先识别并计算所需的特征，然后将它们排列成向量以训练模型。有用的分子属性种类非常多。例如，Ahneman\
  \ *等人* 使用了 120 种不同的计算特征，包括能量学、静电学、振动频率和分子形状。某些软件包可以生成数千个描述符。特定的特征和所使用的不同特征数量是建模设计过程的一部分，并且高度依赖于端点的类型。某些属性具有理论依据，例如量子力学近似，而另一些则纯粹是经验性的或在实践中定义的，*例如*，合成可及性或用于药物相似性的\
  \ Lipinski 规则。包含形状、表面积、体积和灵活性的信息的拓扑描述符也可能有用，甚至基本的物理属性（如分子量）也可能提供价值信号。除了计算或启发式获得的特征外，通过独立构建的模型近似的属性也可以作为其他模型的输入特征。\n\
  \n某些特征基于能量学，可以包含有关分子轨道和电荷密度的信息。同样，可以计算并使用 `HOMO` 和 `LUMO` 能量，以及通过 `DFT` 和量子力学计算中其他理论水平近似的其他属性。在模型中使用物理学时，会获得一些信心。利用物理衍生的特征可能有助于下游近似更密切地遵循物理规律。此外，依赖物理学的模型可能会随着我们对物理学理解和实现的提高而不断改进。\n\
  \n这里提到的示例只是文献中发现许多此类特征和方法的一小部分，包含特征描述及其用途的详细资源已在其他地方发表。我们鼓励读者识别并考虑哪些特定属性可能当前任务有用。\n\
  \n可计算特征，特别是那些使用严谨物理或模拟计算的特征，是极其有用的，特征的广阔范围为选择使用哪些特征提供了极大的灵活性。灵活性结合高质量特征，使研究人员能够使用较小的数据集构建更健壮的模型。然而，选择哪些特征并不总是明确，选择过程通常需要大量的专业知识和实验来确定。在基于物理的计算情况下，生成的特征质量取决于实现的正确性，这些实现有时受限于特定的理论水平，较高水平的计算成本更高。许多特征本身也是从其他模型生成并通过软件提供的。\n\
  \n## 15.3 学习表示的需求\n\n尽管非学习的特征化非常强大并且在文献中表现良好，但它们往往无法捕捉数据中的重要模式，丢弃了构建健壮模型所需的信息。分子属性的获取可能成本很高，*例如*量子力学计算。在使用目前为止的非学习特征时，可能会出现常见问题：\n\
  \n* 为数据应该生成哪些特征？\n* 特征应该捕捉数据中的哪些模式？\n* 应该使用所有特征还是只选择？如果是选择，哪些？\n* 特征是否充分编码了输入，还是信号被丢失？\n\
  * 是否应该包含昂贵的量子力学计算，还是可以避免？\n* 我们如何确保特征与输出相关，而不仅仅是增加噪声？\n\n这些问题是过去十年 ML 文献中突破的主要动力，特别是在使用神经网络的深度学习子领域。深度学习的一个主要目标是将特征提取过程作为模型的一部分进行学习，而不是依赖外部预处理来生成特征。与传统方法相比，将特征化作为模型构建过程的一部分，开启了以数据驱动的方式学习特征化的能力，在降低工程复杂性和可能降低总计算成本的同时，显著提高了模型的灵活性。\n\
  \n学习特征化提供了几个吸引人的益处。首先，学习特征化使得研究人员不再必须花费工程精力来生成和验证各种特征，也不要求从业者具备了解在使用哪些特征及其在模型构建中影响的深厚专业知识。然而，最重要的益处是，数据驱动的特征化可以产生更信息丰富的表示，从而提高模型性能。\n\
  \n\n\n\n或许，特征学习成功广为人知的例子是应用于图像的卷积神经网络。在过去十年深度学习复兴早期，Krizhevsky *等.* 引入了被称为“AlexNet”的卷积架构，该架构仅需极少的预处理，就能在极具挑战性的图像数据集上表现出卓越性能。^(24)\
  \ 几年后，卷积模型被证明在同一图像数据集上的表现超过了人类水平。^(25) 在过去的十年里，深度学习改变了世界处理图像识别、游戏玩、语言、音频生成以及许多领域的许多其他问题的方法。更通用的进展，如注意力机制，^(26)、生成式模型，^(27)以及强化学习，^(28)并不局限于特定的问题领域，为解决各种挑战性问题提供了新颖的新方法。几乎所有这些方法的核心都是深度学习及其将相对原始的数据转换为学习表示的能力。\n\
  \n人们可以想象要手工设计一种特征化方案来描述图像在颜色、光照、物体形状和输入质量的所有变化中产生的细微差别是多么困难。手工描述更困难的是那些需要结合多个输入数据模态或生成高度复杂输出的问题。一些相对极端的例子包括将视频转换为文本^(29)或让静态图像动起来。^(30)\
  \ 通过程序完成这些任务中的任何一项，或者手动设计出足够描述输入的特征，都是极其艰巨的且几乎是不可能的。虽然这些（以及几乎所有的）深度学习应用仍然非常局——仅在训练期间看到的相同数据分布内表现良好——但它们对于许多应用仍然非常强大。人们同样可以化学领域同样复杂且高度非线性的任务，例如蛋白质-配体结合预测、量子力学能量估计、设计合成路线等许多其他。\n\
  \n还可以可视化和分析学习到的表示（通常称为潜表示）。Gómez-Bombarelli *等.* 在 ² 空间中对分子的潜表示进行了降维并可视化，直观的模式随之显现。^(31)\
  \ 数据点的潜表示可以使用任何数量的相似性指标进行比较，以估计潜空间中点之间的距离。在使用到的表示进行分析或得出结论时，重要的是记住潜空间是经验性的，是数据和学习算法的函数。当使用不同的参数或数据重新训练模型时，距离几乎保证会变化。\n\
  \n学习到的表示在生成式模型的背景下也同样强大。生成式模型可以使用潜表示来产生训练期间未见过的新数据。^(32) 除了生成新示例外，Berthelot *等.*^(33)\
  \ 使用变分自动编码器在两幅图像之间进行平滑插值。学习表示而不是依赖于特征工程和选择，既可以简化模型构建过程，又能带来更具表现力的模型。然而，这些收益并非免费的。从原始数据中学习有用的表示通常需要更多的数据、额外的时间和计算。考虑简单模型与神经网络之间的权衡至关重要。分子的机器学习与图像或语言也非常不同。通常，必须整体考虑分子；也就是说每个原子都起着作用。取决于任务，分子可能包含丢弃的噪声（对学习至重要的原子或区域）。这与自然图像或语言形成对比，后者的模式对微妙变化不敏感。例如，在文本中，许多单词可以替换为相似词而不显著改变句子含义。并不总是清楚哪种表示形式对于特定的应用是最合适的，特别是在应用于化学时。此外，重要的是意识到深度学习并非总是最佳选择，非学习的特征化可能更易于处理，或在某些应用中表现更好，特别是当数据有限时。^(6)\
  \ 选择追求哪个算法族通常取决于直觉和实验。在构建模型时，有许多需要考虑的因素，只有指导原则可以帮助我们的决策。关于数据选择和模型设计的多数选择必须基于大量的尝试，并需要通过经过设计的测试集进行严格验证。有关关于表示学习背后的理论和数学的更多信息，以及对整个机器学习社区中看到的许多方法的全面概述，我们强烈建议阅读\
  \ Bengio *等.*^(34)\n\n## 15.4 学习分子表示\n\n尽管存在这些缺点，学习性特征化仍然一种令人兴奋且强大的范式。从原始数据中自动定义表示有助于消除对预测给定终点应包含哪些分子特征做出困难假设的需求。学习表示还可以更好地区分数据中的解释因子，并产生与许多终点相关性更高的表示，从而改进模型。\n\
  \n\n\n\n\n到目前为止，我们对学习表示以及它们在其他领域的用仅描述得相当笼统。然而，我们还没有从实际和示例的角度讨论过用于生成分子学习表示的方法，以及最适合学习此类表示的架构。在本节中，我们将回顾了文献中探索的表示学习算法，特别关注所使用的深度学习架构。无论是以无监督的方式从输入中学习表示，还是在监督学习环境下，化学表示学习的核心在于用于定义学习机制及其参数的架构。在开发和训练\
  \ `ML` 模型时，我们对待学习模型的数据性质和结构做出某些假设。这些假设构成了模型的**归纳偏置**（inductive bias），对学习的有效性起着至关作用。归纳偏置影响我们预期收敛的速度和任何收敛保证、我们假设解决方案所在的参数空间、最终模型的泛化能力以及拟合模型所需的数据量。归纳偏置越强（特别是在假设正确的情况下），学习的所有方面都会得到改进，生成的模型质量通常也更高。在算法中选择哪种架构族构成了模型归纳偏置的重要部分。\n\
  \n在接下来的几个小节中，我们概述了化学 `ML` 文献中常见的几类架构。我们首先考虑图模型（通常称为图卷积），它接收分子的 2D 表示，并在原子之间迭代传递\
  \ `messages`（消息），直到获得原子和分子的潜在表示。接下来，我们讨论了网格模型，信息在 3D 空间中传播，而不考虑任何键合结构，即原子被视为独立的粒子。然后，我们描述了对表示为\
  \ `SMILES` 字符字符串的分子进行序列架构。最后，我们探索了直接受物理学启发的架构设计。\n\n尽管文献中与上述讨论的架构有许多额外的进展和结果，但我们专注于工作的表示学习部分，以及它们如何使研究人员能够以最少的预处理对分子进行学习，并鼓励读者进一步研究文献以获取更多细节。在充分理解表示学习的价值及其权衡与局限性的基础上，我们现在可以考虑用于学习分子表示的不同架构族。\n\
  \n### 15.4.1 图模型\n\n化学中存在大量的图结构数据，从化学反应的有向图、蛋白质的相互作用网络，到小分子自身的拓扑结构。在神经网络架构中假设图先验有助于改进图上的学习，提高鲁棒性并简化优化。然而，在模型中引入图先有多种方法，其选择很大程度上取决于要建模的化学对象。\n\
  \n在讨论图神经网络（GNNs`）之前，让我们重新回顾化学图背景下的分子指纹。扩展连接环形指纹（`ECFP`）算法为理解图卷积提供了坚实的基础，两种算法在通过全局池化步骤整合信息之前，都会在分子内的任何地方应用相同的操作。理解非学习指纹中相似的操作，将为理解其可微泛化形式——神经图指纹（Neural\
  \ Graph Fingerprints）^(35)（一种应用于分子的早期图卷积 `GC` 方法）铺路。\n\n`ECFP` 算法通常标记为 `ECFP(N)`，其中\
  \ `N` 是表示键数量半径的正非零整数。当我们迭代到全键半径时，对于分子图中的每个原子，我们收集其到当前半径的邻居，然后将生成的分子片段传递给哈希函数，为片段分配一个索引。哈希函数确保片段的变化会导致其索引的变化。然后，索引函数将所有索引聚合到一个固定长度的稀疏向量中。在这些片段的“汤”中，可能会发生碰撞，指纹必须足够大以避免重叠。大型稀疏向量对于下游处理的计算开销也很大。这些缺点促成了更高效、更小且更密的表示的发展，仅编码任务相关的特征。然而，要找到能够生成有效且稠密的化学空间表示的良好哈希和索引函数并非易。此外，不同的预测任务可能从使用不同的函数中获益，但并不总是容易预测何时使用哪些函数。幸运的是，深度学习机制提供了从数据中学习有用函数的能力，减少了手动定义或选择函数的需求。环形指纹结合了哈希函数和索引操作，而神经指纹用可微等效物取代了这些。微分的使用允许基于梯度的损失函数优化，使神经指纹变得可学习。损失对参数的梯度可用于引导神经指纹参数，使其与环形指纹相比时预测性能得到提高。神经指纹卓越的预测性能主要归于它能够学习与当前预测任务相关的重要特征^(6,36)\n\
  \n神经指纹通过一系列神经网络层处理输入特征来编码片段。学习的参数（网络权重）及其产生的特征激活提供了一种学习函数，它是非学习指纹中哈希函数的对应物。学习函数是平滑的，使得分子结构相似时激活值也相似。索引函数被学习哈希函数输出向量上的\
  \ `softmax` 取代。通过这种方式，每个原子都被归类为某个学习到的类别，然后跨分子进行求和以生成学习指纹。当这种学习指纹与深度前馈网络端到端训练时，它在多个任务（包括预测溶解性和光伏效率）上优于使用相同前馈架构的标准指纹^(35)。\n\
  \n\n\n\n\n除了神经图指纹外，还有许多其他化学图（GC）方法。已经有一些尝试将 GC 架构推广到一个通用的数学框架。文献中经常提到的此类方法之一是消息传递神经网络（`MPNNs`）。消息传递框架通过将方法分为两个主要阶段：消息传递阶段和读出阶段，推广了化学图上的神经信息传递算法。\n\
  \n在消息传递阶段，对于分子中的每个原子，邻居原子的向量表示将通过一个学习的可微消息函数，然后求和，得到该原子的消息向量。根据消息函数的选择，消息可以包含当前原子、邻居原子以及它们之间键的表示信息。通常，神经网络中的所有节点都使用相同的消息函数。这种在处处使用相同函数使其成为卷积网络，并通过在整个输入上共享参数赋予了额外的不变性。随后，原子的消息向量将与原子的表示一起通过一个学习的可微更新函数，生成该原子的新表示。消息传递步骤的输出是化学图中每个原子的新表示向量，并进行\
  \ `N` 次迭代，允许信息跨越 `N` 个键的距离传播。在完成所有消息传递迭代后，使用一个学习的读出函数将化学图中所有原子的学习表示整合在一起。读出函数产生可用于进一步处理的分子级表示。请参见[图\
  \ 15.1] 以 `MPNNs` 的说明。\n\n![image](img/bk9781788017893-00372-f1.jpg)\n\n图 15.1 在单步\
  \ `t` 中通过消息函数 `M` 和更新函数 `U` 对单个节点 `ν` 进行消息聚合。在 `T` 步之后，所有节点向量都将传递给读出函数 `R`。\n\n\
  对于大多数符合 `MPNN` 框架的架构，键信息没有被考虑。键级表示是可以被学习的，但需要额外的网络。其他实现（如 `D-MPNN`）在有向的键级表示上运行，避免了消息传递中会引入噪声的循环。`D-MPNNs`\
  \ 还将计算的分子特征与学习表示相结合，以克服学习表示在小数据集上的性能局限性，从而在许多专有和公共数据集上达到先进水平。\n\n然而，GNNs 并非没有局限性。在设计神经网络的某些架构组件时需要小心。例如，并不是所有的\
  \ GNN 对其索引的置换都是不变的，在 `MPNNs` 中，读出函数必须设计为处理这种不变性。缺乏图同构不变性的网络对于具有不同原子索引的相同化合物可能会产生不同的原子级或分子级输出。在这些情况下，在生成传递给网络的图之前，应该对图进行规范化（canonicalization），通常通过对\
  \ `SMILES` 进行规范化来实现。在处理图上的非局部属性时也必须进行特殊考虑。GNNs 通常具有固定的传播距离，无法表示远程量子非域性。改进远程消息传递的尝试包括使用连接到分子中所有其他原子的主原子。主原子的潜向量充当一个草板，神经网络可以在消息传递期间对其进行读写操作。`MPNN`\
  \ 的作者还尝试添加一种单独的虚拟键类型，以帮助非键原子之间的信息流。在与捕捉长程相互作用相关的 GC 方法中，另一个设计考虑因素是图遍历算法的选择。Matlock\
  \ *et.* 建议对整个化学图进行基于键的广度优先遍历，将信息从选定的中心原子传播到最远的原子，然后返回。跨越分子的正向后向信息传递可以重复多次。他们证明了该方法在大系统芳香性和共轭性方面的有效性。立体化学是\
  \ GNNs 的另一个强力局限性。虽然立体化学信息可以在传递到图神经网络之前包含在原子和键级特征中，但要表示某些类型（如构象或相对立体化学）尤为困难。这种立体化学局限性促使了使用网格方法学习分子表示。\n\
  \n### 15.4.2 网格模型\n\n在图中，信息的传播通常发生在相邻的成键原子之间。此外，大多数图模型忽略了位置信息和原子之间的空间关系。数据中排除空间信息会导致学习到的表示缺乏某些应用所需的上下文，例如预测量子力学能量或蛋白质-配体结合。在仅通过图中捕捉非键相互作用在较大的系统中变得特别困难。不再仅仅依赖图，可以将原子放置在\
  \ 3D 坐标空间中并以网格表示，使模型能够访问这些空间关系。将输入的笛卡尔坐标置于 3D 网格中实际上是对数据的离散化，使得数据更适合使用 3D 卷积进行处理。通常用于图像识别的熟悉的\
  \ 2D 卷积神经网络（`CNNs`）在用于平面（2D）输入（如图像）时有效，且不适用于 3D 网格，因此使用 3D 卷积。类似于用于图像的 `CNNs`，3D\
  \ 卷积滤波器可以提取描述局部协方差的特征。\n\n\n\n\n3D 网格模型的一个备受关注的领域是在基于结构的药物发现中预测小分子与靶标蛋白的结合。这种方法的一个早期示例是\
  \ `AtomNet` 模型，它利用包含蛋白质-配体复合物的 3D 网格进行 3D 卷积。3D 网格以靶蛋白的结合位点为中心，并在位内对小分子构象进行采样。为了使这种方法生效，需要每个原子在结合位点和分子中的位置。额外的\
  \ 3D 结构信息使模型能够学习任意的、数据驱动的 3D 特征，从而带来更好的泛化能力。学习此类模型的一个目标是捕捉蛋白质与配体原子之间有利和不利的相互作用，然后将该模型应用于训练期间未见过的新蛋白质和配体。尽管在文献中很难找到将\
  \ 3D 网格模型前瞻性应用于基于结构的药物发现项目的有力案例，但该方法仍然具有前景。从原理上讲，同时获取蛋白质和配体可能帮助 3D 模型相对于仅依赖配体的技术具有更好的泛化能力。\n\
  \n深度学习在 3D 空间在药物发现和其他 3D 应用（例如处理点云数据或制造业中的生成式设计）中受到了越来越多的关注。3D 应用的一个挑战是，当在 3D 网格上操作时，表示通常对旋转和平移是不不变的。与其将\
  \ 3D 数据离散化并放置在网格中，不如保留精确的 3D 坐标信息，从而实现更大的旋转和平移不变性。一种利用分子旋转对称性的特别显著的方法是 `Tensor Field\
  \ Networks`。在他们的方法中，使用球面谐和 Wigner D 矩阵生成几何张量。为了实现 `SO(3)` 等变性，每个输入（分子结构）被转换为一组带有关联\
  \ `SO(3)` 组（向量）。本质上，`SO(3)` 组用于描述对象可能的旋转对称性以及对象在空间中的取向，从而保留了 3D 空间中的分子特征。我们将在稍后介绍的“物理启发的架构”章节中进一步探索保持不变性的策略。\n\
  \n### 15.4.3 序列模型\n\n在分子图上通过卷积进行计算的替代方案是使用以 `SMILES` 字符串作为输入的循环神经网络（`RNNs`）。SMILES\
  \ 包含了通常用分子 2D 图表示的相同图形信息，该图被编码为 1D 字符列表。对于给定分子的精确字符顺序由生成 `SMILES` 所用实现方法的特定规则集决定。原子用一个或两个字母的元素符号表示，例如碳用“C”表示，并使用额外的字符表示图中原子之间的分支、手性和其他关系。使用\
  \ `SMILES` 而不是 2D 图的原因之一是，1D 输入可以很方便地“开箱即用”地用在许多 `RNN` 架构中。其他领域中利用注意力、推理或内存的序列算法可以被适配以使用\
  \ `SMILES` 作为输入。大多数情况下，`RNNs` 被用于读取 `SMILES`，尽管也尝试过 1D 卷积。在生成分子时，使用 `RNNs` 输出字符序列也比生成\
  \ 2D 图更直接。\n\n`GNNs` 通常沿着化学键仅向直接邻居节点传递消息，可能需要若干个消息传递步骤才能将信息从分子的一端传播到另一端。在序列模型的情况下，给定上一个状态，通常有一个的隐藏状态，所有原子都有机会连续更新它。在计算更新时访问完整状态意味着原子对整个分子（由状态编码）具有全局访问权限，并且可以捕获远距离相互作用。在\
  \ Yang *et al.* 的生成化学（GCs）方法中，消息传递以键而非原子为中心，消息被强制沿着跨分子的有向路径传输，以避免震荡（消息在原子之间来回传递）。有趣的是，这与\
  \ `RNNs` 处理 `SMILES` 的方式并行。在 `RNNs` 中，状态以有序的方式从原子传递并更新。此外，结合来自正向和反向的消息类似于双向 `RNNs`，在序列上进行正向和反向遍历。\n\
  \n编码序列后，`RNN` 状态是分子的中间潜表示，可用于预测结果。使用 `RNNs` 进行预测通常在监督学习中进行，此时提供 `SMILES` 和标签。然而，最近也有兴趣使用\
  \ `RNNs` 以自监督的方式从 `SMILES` 中学习。自监督（通常称为无监督学习）是指模型负责复制其输入，通常使用自动编码器。简而言之，自动编码器的工作原理是通过输入，学习将其压缩为潜表示，然后将潜表示解码为输入的重构。通过压缩过程，模型学习了数据的显著特征以及最描述输入的结构化模式。学习过程中通常会应用一个或多个约束，以防止自动编码器仅仅学习恒等函数。用于鼓励产生更解耦潜变量的一种约束是针对潜向量应用高斯先验（`μ=0`,\
  \ `σ=1`），并通过最小化 KL 散度来强制。这种受限自动编码器被称为变分自动编码器（`VAE`），它基于贝叶斯推理。`VAEs` 和其他使用自监督训练的\
  \ `RNNs` 形式已成功应用于化学领域，在从头设计应用中已有引人注目的早期案例。\n\n\n\n\n在考虑将 RNN 应用中时，重要的一点是，与 GC 类方法相比，使用基于\
  \ `SMILES` 的 RNN 会带来表示上的代价。RNN 对输入顺序敏感，而在 `SMILES` 中，必须假设某些字符顺序，*即*，某些原子必须在前面。此外，将图视为序列要求模型不仅要学习分子与端点（目标任务）之间的关系，还要学习如何从序列推断图结构。`SMILES`\
  \ 还利用字符来标注原子之间的关系，*例如*用于分支的括号，模型需要学习这些内容以理解图结构，而不是像 GC 方法那样通过模型架构直接对这些信息进行编码（这在\
  \ GC 方法中是对图具有更强的**归纳偏置**）。\n\n### 115.4.4 受物理启示的架构\n\n机器学习可以与基于物理的计算结合使用，其中 ML 模型首先识别出最感兴趣的分子，然后选择其中一部分在更严谨的模拟中进行进一步评估。类似地，经验模型可以利用物理计算作为输入特征。虽然使用物理特征抵消了避免计算开销的优势，但将物理学与机器学习结合可以产生利用两种范式优势的方法。另一种改进学习系统的策略是在模型上施加物理约束，以确保学习到的表示能够捕捉到更多化学中自然存在的不变性。\n\
  \n化学 ML 社区的大部分研究都集中在将其他领域（即图像识别和语言建模）的成功经验引入化学领域。在图卷积与图像分类器中使用的卷积网络之间可以观察到许多相似之处。同样，基于\
  \ `SMILES` 的 RNN 架构也是参考了语言建模和其他序列建模任务的近期成功而设计的。化学深度学习领域的快速进展，以及在不断增长的文献中看到的各种方法和应用，主要通过从其他领域借鉴类比和总结教训并将其适配化学领域来实现的。尽管如此，许多挑战仍然存在。\n\
  \n化学空间是海量的，且取决于任务和所需的泛化程度，通常没有多少可以作为“噪声”或“离群值”被丢弃。仅在类药物空间就有 `10⁶⁰` 个分子，真实规模的数据集在能够包含的相关模式数量上必然是有限的。开发有用且足够大的数据集的困难导致许多模型利用偏置并学习虚假相关性，而不是学习更具通用且不变的特征。此外，评估指标往往忽略了这些弱点，使得难以确定模型和方法的可靠性。在语言建模中，单个单词带有重大的意义和丰富的上下文，但在分子数据格式中，原子本身通常被表示为离散的。因此，分子中的一个子片段在几乎所有其他化学环境中可能具有完全不同的意义，例如，分子在一个蛋白质中的结合*相对于*与另一个蛋白质的相互作用。即使在很小的子片段中寻找通用模式都很困难，这会导致\
  \ ML 模型更加脆弱，可靠性显著变窄，并使化学领域的迁移学习变得特别困难。这通常被称为模型的“适用领域”，要求研究人员非常关注模型相对于化学空间的稳健性。\n\
  \n朝学习更多不变分子表示的自然研究方向，是探索更接近底层物理学的归纳偏置。通过发现并应用与物理相关的更强假设，而不是依赖于具有过于宽泛的先验的且过于灵活的模型，可以显著增强学习能力和泛化能力，并有助于在数据较少的情况下构建出更稳健的模型。\n\
  \n利用物理先验有两种通用的处理方法。第一种是在学习算法中保持显著的灵活性（**弱归纳偏置**），并利用大量数据学习近似通用的物理方程，例如描述量子力学的方程。开发一个直接近似方程的模型的目标是在数据充足的情况下，学习到的函数具有某种程度的迁移性。然而，即使有海量数据，我们也假设测试期间的数据分布与训练期间看到的数据分布相同，或至少非常相似。这种方法通常能产生良好的插值，但在尝试外推时，充其量是不可靠的。Mills\
  \ *等人* 利用了这种数据优先的方法来近似 `Schrödinger equation`。当数据更有限时，补偿模型中缺乏内建不变性的一种方法是通过数据增强。\n\
  \n利用物理学的第二种处理方法是寻找更接近我们对物理学理解的更强先验，并将这些先验和不变性直接整合到模型中。Kondor *等人* 在关于化学神经网络协方性的系列工作中指出，他们对分子进行机器学习的目标并不非要学习物理定律*本身*，而是为了理解并利用物理定律的结构，来告知分子中不变性的类型以及原子间的物理相互作用。在计算原子或原子组的表示及其相互作用时，他们特别强调了原子的位置不变性（置换、旋转和平移）。他们展示了构建在模型中的扩展不变性如何帮助在使用\
  \ `QM9` 属性和 `MD-17` 构象能量超越类似的先进 ML 模型。Smith *等人* 的方法是另一个采用更强归纳偏置的例子，在模型层面实现的旋转不变性消除了网络学习如何编码不同方向相同分子的需求。在\
  \ Gomes *等人* 中，作者利用蛋白质-配体结合的热力学来引导其架构中组件之间的相互作用。此外，Levin *等人* 探索了深度学习与量子纠缠之间的联系。\n\
  \n\n\n\n\nSchütt *et al.* 的工作强调了原子位置的重要性，并为开发能够计算非平衡态构型（势能面中局部最小值之外的位置和轨迹）的分子能量和作用力的\
  \ ML 模型提供了方向。^[62] 他们描述了如何基于物理启发的假设（例如能量守恒力）来设计模型，以鼓励捕捉更具物理意义的表示。分子物理学没有原子相对于固定坐标系的旋转或平移的概念。他们的模型没有使用\
  \ 3D 卡卡尔坐标作为原子特征的一部分，而是利用了原子之间的距离。为了便于训练，使用了径向基函数为距离提供额外的非线性。要学习对相对于坐标系的旋转鲁棒性的模型，需要通过不同的分子取向对数据进行增强，并且无法保证不同取向的同一分子产生相同的结果。其他研究人员也采用了类似的径向处理。[^[59],[60]\
  \ Schütt *et al.* 还利用了偏移 softplus 激活函数来获得在所有阶导数上连续的光滑势能面。Gilmer *et al.* 和 Smith\
  \ *et al.* 的工作（可能还有其他研究）显示，与 DFT 相比，其精度接近化学精度，但计算成本仅为后的一部分。^[1],[5],[59]\n\n作为化学之外的补充，Lutter\
  \ *et al.* 使用拉格朗日学来学习描述机器人运动的物理学。^[63] 他们没有像大多数深度学习系统那样直接从数据近似逆动力学，而是将底层方程作为模型的一部分明确实现，然后近似物理参数和子方程。Schmidt\
  \ 和 Lipson 还讨论了如何从数据中学习自然物理规律。^[64] 化学物理学深根于数学，考虑在我们的模型中引入更强的物理先验可能并非不可能。然而，物理学是非常复杂的。分子的能量和势能无法在原子尺度上分离，而是源于许多亚原子粒子之间复杂的相互作用。Pfau\
  \ *et al.* 超越了原子表示，将单个电子作为其深度神经网络的输入。^[65] 在有限的氢和氮系统中，他们产生的结果显著超过了耦合簇方法的精度。尽管目前范围有限，但使用深度学习对单个粒子进行建模，与目前主要探索的原子模型相比，是一种全新且令人兴奋的方法的开始。\n\
  \n无论是从数据中隐式学习物理学，还是直接在模型中实现，预测物理终点都是有价值的基准。物理基准有助于社区理解我们的模型在从充分编码物理关系、能量和作用力的数据中直接学习表示方面表现如何。例如，将结果与\
  \ DFT 计算的基态能量和电子密度进行比较，还与耦合簇的预测结果进行了比较。^[66] 同样，Schütt *et al.* 训练了一个模型来学习描述量子力学的波函数，如果该表示充分捕捉了物理特性，就能在不需要任何额外训练的情况下预测几乎任何基态性质。^[67]\
  \ 像 Schütt 的工作一样，目前的许多研究方向都假设分子处于基态，最终还需要更多工作来将这些方法扩展到非平衡态条件。\n\n在最近的一次演讲中，^[68]\
  \ Léon Bottou 博士讨论了常见的学习算法如何仅将统计作为作为替代品，而因果关系通常没有得到有效的建模。他证明了舍弃虚假相关性而转向不变关系可以实现更有效的外推。他的演讲并非专门针对化学，但就对\
  \ ML 在化学中的应用引发了宝贵的问题。所有分子数据集都包含某种形式的偏差，主要是由于化学空间极其巨大，在构建数据集时需要做出假设，*例如*允许的原子最大数量。某些化学数据集具有极大的偏差，例如为蛋白质-配体结合开发的枚举数据。在枚举中，分子通常包含非常相似的核心，分子分子之间仅有细微的结构扰动。使用典型的\
  \ ML 方法为此类数据集学习的大多数特征，在其他学习任务中实用的希望不大。模型可能会捕捉到数据集中包含的强偏差，而在该偏差不再存在的地方，模型将会失败。Wallach\
  \ 和 Heifets 显示，药物发现领域使用的许多学习方法正在学习数据集中包含特定偏差，^[52]*例如*，Bottou 所暗示的虚假相关性。也许，如果模型能够学习跨数据集更具不变性的特征（例如更接近化学物理特性的东西），那么学习在各种学习任务中有用的表示的概率更高。更具不变性的特征能够改进迁移学习（从大型数据集构建模型，然后使用较小得的数据集针对另一个应用进行微调），或者在没有额外训练数据的情况下甚至实现外推。学习化学不变性还为对较大系统的改进建模提供了机会，例如基于蛋白质结构的机器学习，并可能增加\
  \ ML 应用于生物学终点或蛋白质折叠预测时的可行性。\n\n尽管预测物理终点仍然是一个有价值的研究方向，但仍需要大量工作来进一步验证深度学习当前形式在充分近似物理方面的有用性。本节提到的示例展示了设计受自然化学中发现的不变性的架构的价值，以及它们在泛化方面可以提供的改进。更接近化学底层物理的更强归纳偏置可能会在各种应用和数据集上带来更好的性能。\n\
  \n## 15.5 数据考虑\n\n\n\n\n数据质量和数量是在几乎任何应用或领域中构建良好模型的首要考虑问题。除了影响模型的好坏外，数据直接影响所学表征的质量；因此，至少简要考虑数据对表征质量的影响是有价值的。因为学习到的表征是数据驱动的，它们的质量直接取决于数据质量。在策划数据时必须小心，以确保数据是正确的，并确保验证集对模型的严谨测试仍然有效用。Wu\
  \ *et al.* 讨论了必须审慎地将分子数据集划分为训练集和验证集。例如，如果具有非常相似骨架的分子同时出现在训练集和验证集中，那么验证可能无法捕捉到针对这些特定骨架的过拟合。此外，神经网络具有极强的灵活性，学习到的潜表示高度依赖于提供给网络的分子的数量和多样性。因此，由于化学空间的巨大性，基本上所有的化学库都将包含某些偏差。在选择训练数据以及将训练好的模型应用于新数据时，都应该保持谨慎。\n\
  \n分子的属性也极依赖于背景。例如，特定分子在一种蛋白质中的结合情况与另一种蛋白质中可能非常不同，将来自多个实验的数据混合可能是灾难性的。实验室实验由于温度、压力、材料以及实验中几乎任何其他成分或条件的细微变化，而闻名的难以复制。发表的实验也可能缺乏足够的实验细节供复制。即使是不同实验室进行、或在同一实验室的不同时间进行的相同实验，也可能是不一致的，专家测量的实验数据可能仍然存在噪声。此外，公开数据的质量往往变异很大。对于恰当的数据处理存在许多原则，我们鼓励读者查阅文献，以获取与他们特定数据集相关的见解。\n\
  \n药物发现及其他化学发现与开发领域经常出现的另一个问题涉及数据集中分子的多样性。筛选库的开发通常包含化学物质的多样化采样，以帮助最大化增加发现命中（hit）的概率，或者在发现多个命中的情况下，发现具有不同骨架的命中。然而，挑战在于多样性的定义比较松散，并且可以使用各种指标以多种不同的方式进行评估。在终点（endpoint）的背景下，了解多样性是否有助于学习稳健的模型也是具有挑战性的。学习表征的一个优势是它们是数据驱动的，可以在训练分布的背景下进行比较。对于本章描述的学习特征化方法产生的表征，可以计算常用的距离指标来衡量分子之间的相似性。在大多数情况下，学习到的表征是连续的，可以使用\
  \ Tanimoto、欧几里得和余弦相似性指标来计算距离。学习表征的降维也可以用于视觉化相似性。Popova *et al.* 展示了降维的示例以及具有相似的分子如何聚集在一起。使用学习表征测量相似性还可以告知人员哪些分子可能距离训练数据远，因此适用于添加到训练集中。\n\
  \n## 15.6 当前挑战与未来研究方向\n\n在应用模型时，记住我们对模型插值与外推的预期是非常重要的。大多数深度学习是高度插值性的，在验证或部署模型时提出的一个关键假设是：输入模型的化学空间分布包含在训练数据的相同分布中。构建更稳健模型的一种策略包括增加训练数据的规模和多样性，但对于许多终点来说，大型数据集并不容易获得。化学中的许多数据集相对较小，在数据稀缺的情况下，利用其他大得多的数据集来提高应用性能的能力可能是变革性的。表征学习的一个主要益处是它有助于促进迁移学习；然而，化学领域的迁移学习仍然面临挑战。在评估迁移学习对于化学数据集是否是一个合理预期时，一个关键问题是：我们可以预期模型学习哪些可以迁移到其他系统的模式？例如，在蛋白质-配体结合中，结合机制在不同蛋白质之间是不同的。在一种蛋白质系统中相关的蛋白质与配体之间的大多数相互作用，在另一个系统中可能没有用。\n\
  \n在大型数据语料上进行预训练，然后针对新应用通过少量示例对训练好的网络进行微调，在图像识别中已取得成功。在迁移学习中，我们假设任务之间存在共同模式，并且学习到的特征是不变的，即它们可以在不同数据中捕获到相同的模式。在上述关于受物理学启发的架构的讨论中，我们提到了更紧密地近似物理学可能有助于迁移学习。在极端情况下，如果我们想象能够完美近似物理学，那么我们实际上学会了一个可以从容执行零样本迁移学习（zero-shot\
  \ transfer learning）的模型。当然，目前无法做到这种程度的物理学近似。然而，我们可以考虑近似物理学可能有帮助的情况，并考虑探索改进近似方法的方向。\n\
  \n构建更接近物理规律的模型在科学上很有趣，并可能有助于学习更多的不变特征，但目前的深度学习方法可能不足以学习此类特征。例如，上述描述的大多数架构产生分布式向量，这些向量可能没有物理意义。即使在特别鼓励解耦潜变量的情况下（例如\
  \ `VAE`），我们对哪些变量被表达也没有任何显式控制，也没有足够的方法解释变量之间的因果关系。学习因果关系是目前正在追求的机器学习（ML）研究中令人兴奋的分支。考虑到因果关系与物理学之间根深源的关系，类似的问题和研究方向在化学机器学习中可能特别相关。无论采取何种方向，对物理学的强力强调——无论是直接学习物理学，还是至少将其用于帮助验证机器学习模型——在未来机器学习进展应用于化学时将是重要的。\n\
  \n## 15.7 结论\n\n\n\n\n\n直接从数据中学习分子表示既简化了化学领域机器学习模型的开发，又能极大地提高训练模型的实用性。表示输入分子的方法有许多，包括图结构或\
  \ 3D 空间中的点，并且可以使用几种不同的架构族，每种都适用于从不同形式的输入中学习，用于对最少处理的数据进行学习。无论使用何种架构，深度学习或任何其他形式化学建模的目标都是开发更实用的工具，以辅助新化学物质的设计与应用并促进科学进步。深度学习优于许多其他机器学习形式的优势之一是，它能够直接从数据中学习表示，而不需要依赖专家策划的特征，这些特征可能缺乏通用性，或者难以获取。\n\
  \n到目前为止，文献中发表的大多数模型受到其他领域（即图像识别和语言建模）开发模型的启发，可能并不总是适用于化学任务。迁移学习仍然是这样一个领域，在其他领域取得的成功在化学领域尚未得到同程度的实现。受物理启发的架构是一条很有前景的研究方向，有望产生更稳健、更强大的模型，并可能有助于更可靠的外推。目前，受物理启发的架构在包含物理知识的程度上大多是保守的，或者目前仅在小系统中经过了测试；因此，还需要更多工作。\n\
  \n深度学习目前是学习分子表示的主导方法。因此，深度学习的所有挑战和缺点在我们的化学模型中都是相关的，包括需要庞大的训练集、架构对超参数的敏感性，以及在应用于适用范围之外的新数据时的脆弱性。目前尚不清楚深度学习是否是学习分子表示的最佳范式，从迁移学习的困难中可以看出，物理学将继续在验证表示的实用性方面发挥重要作用，并进一步为未来的学习算法提供灵感。撇开深度学习的局限性，从原始数据中学习表示的影响是显而易见的，许多利用这些方法的新方法和应用已经发表，它们在较低的计算成本下实现了高准确率。\n\
