  \ | 用于治疗 HIV-1 ，与其他抗病毒药物联合使用 |\n\n具体而言，我们根据最近的筛选评分研究了 MP 得分函数，违规数量小于或等于 4（或 5）的分子被认为具有药物成性。每个分子的得分函数是基于建模的\
