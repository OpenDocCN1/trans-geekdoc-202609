  \ 章\n\n## 非绝热分子动力学的机器学习\n\nJULIA WESTERMAYR(![image](img/p076-1.jpg)0000-0002-6531-0742)^(a)\
  \ AND PHILIPP MARQUETAND(![image](img/p076-1.jpg)0000-0002-8711-1533)\\*^(a,b,c)\n\
  \n^a 维也纳大学，化学学院，理论化学研究所，Währinger Str. 171090 Vienna Austria\n\n^b 维也纳光反应加速研究平台，维也纳大学，Währinger\
  \ Str. 171090 Austria\n\n^c 维也纳大学，化学学院，数据科学 @ 维也纳，Währinger Str. 291090 Austria\n\
  \n\\*邮箱：philipp.marquetand@univie.at\n\n## 4.1 引言\n\n非绝热分子动力学模拟（NAMD）通过包含两个或多个电子态超越了玻恩-奥哈默分子动力学。通过这种方法，可以研究许多处于生死边缘的基础过程，例如光合作用。了解结构与其性质之间的关系有助于设计新材料。\n\
  \n尽管非绝热分子动力学非常重要，但它限于量子化学计算的成本。为了加速模拟并实现长时间尺度，通常必须在准确性和计算效率之间进行折衡，并用更高效的方法替代昂贵的量子化学计算。最近，随着机器学习（ML）的兴起，基态机器学习机器学习已成功成功，但还没有此类力场。与基态相比，激发态机器学习势能开发缓慢的原因有两个：一方面，不仅需要准确描述一个势能面（PES）；另一方面，进行准确模拟不仅需要能量和相应的力，还需要态之间的耦合。\n\
  \n量子化学中的几乎所有方法都基于玻恩-奥哈默近似，该近似允许电子和原子核的自由度分离。玻恩-奥哈默近似适用于许多电子基态的几何结构，特别是大多数分子的平衡态。然而，每当两个或多个态发生强耦合且电子和原子核在极短的时间内发生重组时，该近似就会失效。尽管如此，这种近似的使用对于非绝热分子动力学的有效计算至关重要。它允许混合量子经典动力学，即原子核在由电子组成的势能面上的运动被经典处理，而电子运动则遵循时间相关的薛谔方程。耦合不同势能面的底层元素在势能面接近的区域显示出奇异性，而在其他地方几乎消失。在相同自旋多重性的态接近的构象空间中，非绝热耦合（NAC）非常重要，而自旋-轨道耦合在不同自旋多重态之间的跃迁中起关键作用。这些关键区域分别称为锥形交叉或能交叉，它们不仅给量子化学带来了障碍，随也给势能面的拟合构成了困难。\n\
  \n\n\n\n由于锥形交汇处非绝热耦合（NACs）的奇异性导致的数值困难，导致人们转向其他关注绝热势能对角化（diabatization）的方法^(48,54–57)。使用对角势是有利的，因为哈密顿量的非对角耦合元是平滑变化的性质。另一个优势是贝里（或几何）相位效应会消失，不会影响动力学模拟。贝里相位的重要性取决于动力学方法和研究的化学体系。虽然在某些情况下可以安全地忽略贝里相位，^(50,58)但在其他情况下它起着至关重要的作用，导致锥形交汇处附近出现依赖路径的跃迁概率^(59)。对于后的情况，对角方法是理想的，但寻找有意义的对角势通常是一项枯燥的任务^(48)。量子化学计算的输出是以绝热图景给出的，因为对角波函数不是电子哈密顿量的本征。因此，对角势不是唯一的，而且寻找对角势往往是不可行的，特别是对于较大且更复杂的分子。其中一个原因是，特定能量范围内的电子态数量通常随着分子中原子数量增加而增加，因此提供所有所需电子态的计算量也会增加。最近开发了一些使用机器学习（ML）模型来改进对角化过程的方法^(47–49)。在大分子中，*即*在\
  \ 10 到 100 个原子的范围内，需要需要更广泛的近似，^(47,60)，例如线性振动耦合模型，^(61)。由于它们的讨论超出了本章的范围，读者请参见参考文献\
  \ 54 和 61–64 获取更多细节。尽管激发态动力学在对角图景中是有利的，但由于上述问题以及计算对角势仍然是一项挑战性任务，绝热表示下的在线非绝热分子动力学（NAMD）仍然是常用的。\n\
  \n在 NAMD 模拟中，存在不同的近似方法来考虑不同绝热态之间的非绝热跃迁。面跃迁（surface-hopping）方法通常是性和效率之间很好的折中，因为它在原子经典传播后获得的构型上在线计算势面（PESs）和相应的性质^(65,66)。这种方法一直是近期机器学习驱动的\
  \ NAMD 模拟中的首选方法^(44–46,50)，并允许使用机器学习模型在线探索势面^(44,50)。不同势面之间的跃迁（或所谓的“跳跃”）是随机确定的。有多种计算跃迁概率和方向的算法^(58,66,67)，其中最流行的是\
  \ Tully 算法^(65)。另一种常用的是 Zhu–Nakamura 算法^(58)，它省略了耦合。关于跃迁算法的更多信息，请参见参考文献 68–77。\n\
  \n## 4.2 方法\n\n在这里我们讨论了一些方法。在接下来的章节中，将比较*即*线性模型（LR）、岭回归（KRR）和神经网络（NN），并列它们的优缺点。在\
  \ NAMD 的情况下，重点是神经网络。锥形交汇处 NACs 的奇异性导致的数值困难，导致人们转向其他关注绝热势对角化的方法^(48,54–57)。\n\n###\
