  \ 3 变体模型中优于`ANN`，但总体而言`ANN`分数 4 `logD`模型最优，AUC（95% CI）为 0.92（0.81,1.0）。原始目标数据的分数\
  \ 3 `logP`和`logD`划分的神经网络模型见图 11.4。表 11.11 显示，总体而言，对于分数 4 `logD`，`ANN`分类优于`RF`模型，AUC（95%\
  \ CI）为 0.89（0.77,1.0）。同样，对于分子参数，`ANN`方法优于`RF`分类，分数 4 `logD`达到最优，AUC（95% CI）为 0.95（0.87,0.94）。图\
  \ 11.5 展示了基于分数 4 `logP`和分数 4 `logD`的药物目标 PCA`ANN`图。图 11.6 显示了基于分数 3 `logP`和`logD`变体的药物目标\
  \ PCA`RF`图。\n\n\n\n\n\n对于基于表 11.10 中给出的原始目标数据的卓越 ANN 评分 4 `logD` 模型，相应的变量重要性指标按幅度递减排序分别为\
  \ `PSA`、`logD`、`NRING`、`HBA`、`MW`、`NATOMS`、`ROT` 和 `HBD`，对应的变量重要性向量为 `21.65`、`19.53`、`13.18`、`11.48`、`11.06`、`9.5`、`7.52`\
  \ 和 `6.08`（参见 Hudson 等^(14) 的表 4）。这揭示了与传统的 `MW` 不同，`PSA` 和 `logD` 在 ANN 分类中的贡献更大。根据表\
  \ 11.8（该表报告了基于本章研究的目标数据的 PCA 维度载荷），我们注意到上述变量重要性指标在某种程度上反映了变量上 PCA 载荷的高绝对值序列（参见表\
  \ 11.8），其维度如下：这为 PCA 维度在将目标分类为高分者和低分者时提供了数值增强并增强了其解释性，如图 11.3 所示：\n\n*   `Dim2`:\
  \ `PSA` (载荷=−0.24), `logD` (0.61), `NRING` (0.45)\n*   `Dim1`: `HBA` (0.41), `MW`\
  \ (0.41), `NATOM` (0.39)\n*   `Dim5`: `ROT` (−0.37), `HBD` (0.60).\n\n## 11.4 结论与讨论\n\
  \n本章演示了如何使用 PCA 和违规评分函数来识别药物分子和疾病靶点的隐藏模式。我们新的 PC 分析 MP 和目标构建显示，分子和目标位于分子空间中的特定位置（象限），并根据我们的评分函数分点进行了分层。总体而言，评分\
  \ 4 以上的违规反映了较差的目标，这些目标可以在降维 PCA 空间中被清晰区分并定位（参见图 11.3），在 2D 原始 MP 图和 2D 目标数据图中也可以看到（参见图\
  \ 11.7 和 11.8），这些图还描定了 `bRo5` 和 `eRo5` 区域。我们发现，在分析的完整数据集中，614 个分子实际上位于 `bRo5` 空间内，所有分子均符合\
  \ Ro5 标准，其中 23% 的评分≤4，而 77% 表现为高分>4。虽然有 1174 个分子遵循传统的 Ro5，但只有 34 个（3%）符合 `eRo5`\
  \ 标准，其中 11 个分子位于 Ro5 区域之外，这中的 6 个（18%）得分较低（≤4），而 82% 是高分>4 的违规者。\n\n![image](img/bk9781788017893-00251-f7.jpg)\n\
  \n图 11.7 分子参数 2D 地图：黑色=Ro5（包含扩展）区域，蓝色（图右侧）=bRo5 区域，红色（图左侧的浅色）=eRo5 区域。\n\n![image](img/bk9781788017893-00251-f8.jpg)\n\
  \n图 11.8 目标中位数数据 2D 地图：黑色=Ro5（包含扩展）区域，蓝色（图右侧）=bRo5 区域，红色（图左侧的浅色）=eRo5 区域（图中的点是每个靶点的中位数）。\n\
  \n基于 MP 和 PCA 构建的、用于分类高分目标和低分分子违规者的 RP 和 ANN 规则，证实了将 `logD` 纳入评分函数的价值，验证了 Zafar\
  \ 等^(11,12) 并支持了最近建立的分点^(14,15)。总体而言，RF 模型和 ANN 显示了不同的变量重要性特征。ANN 表现优于 RF，并证实了使用\
  \ `logD` 而非 `logP` 的性。早期工作^(15)。\n\n\n\n\n4. C. Lipinski, *Nat. Rev. Drug. Discovery*,\
