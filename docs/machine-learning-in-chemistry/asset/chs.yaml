  \ *ACS Omega*, 2019, **4**, 3122.\n\n\n\n\n\n在现有的光谱技术中，利用电子或 X 射线的芯损耗谱分析，即电子能量损失近边谱结构（`ELNES`）和\
  \ X 射线吸收近边谱结构（`XANES`），提供了原子级的空间分辨率、纳秒级的时间分辨率以及高灵敏度，可以被视为材料科学中的“终极分析”。`ELNES` 和\
  \ `XANES` 通常源于电子从核心轨道到未占据态的跃迁。由于它们的电子跃迁遵循电子偶极规则，其光谱特征反映了未占据带中的部分态密度（`PDOS`）。因此，`ELNES`\
  \ 和 `XANES` 提供了照射区域内特定元素的局部配位和化学键信息。`ELNES` 和 `XANES` 被用作补充工具。`XANES` 的优势在于灵敏度，即可以观测到\
  \ ppm 级的元素；而 `ELNES` 的主要优势在于其空间分辨率，即可以对单列甚至单个埋入掺杂原子进行观测。近期单色器系统的出现提高了 `EELS` 的能量分辨率，这有利于利用\
  \ `TEM/STEM` 系统识别振动光谱。因此，`ELNES/XANES` 已被用于多种材料的表征，如半导体、陶瓷、电池、电子器件和电容器材料。\n\n仪器的发展伴随着\
  \ `ELNES/XANES` 理论模拟的进步。`ELNES/XANES` 模拟最重要的方面是引入芯空穴，芯空穴是在电子跃迁过程中在核心轨道中产生的。根据核心态和激发电子的位置，`ELNES/XANES`\
  \ 模拟可以分为类：单粒子方法、双粒子方法和多粒子方法。使用单粒子、双粒子和多粒子方法进行 `ELNES/XANES` 模拟的基础已其他文献中综述。除了光谱模拟，人们还提出了用于揭示光谱特征与材料属性之间关系的理论工具。通过结合实验和理论模拟，可以研究价态局部配位、液/气分子振动、晶格振动以及范德华相互作用。近年来，光谱数据迅速增加。`ELNES/XANES`\
  \ 实验通常涉及时间分辨或空间分辨观测。例如，空间分辨 `ELNES` 允许在某一区域内以数千点的分辨率进行光谱成像。在 `XANES` 中，可以实现皮秒或纳秒级的时间分辨观测，并已经开展了追踪化学反应的时间分辨实验。通过这种空间/时间分辨的\
  \ `ELNES/XANES` 观测，单次实验过程中可以观测到多达万条光谱。通过理论计算进行逐个解释是不行的，因为每项 `ELNES/XANES` 计算不仅需要大量的实验和理论知识，还涉及大量的计算。\n\
  \n基于机器学习（`ML`）的数据驱动方法可以克服人工多维数据分析的局限性。`ML` 被广泛用于材料模拟和表征。此类数据驱动方法有助于以高效率发现理想的结构，并获得以往无法通过实验或模拟确定的信息。`ML`\
  \ 也应用于实验观测。与人工分析相比，它允许解释更多的光谱，并能够预测简单光谱中的标量值或离散值，例如 `NMR` 光谱中的化学位移或峰值。此外，它也被应用于\
  \ X 射线吸收精细结构（`XAFS`）和扩展 `XAFS`（`EXAFS`）光谱。\n\n我们已经报道了 `ML` 在材料表征中的应用。特别是，我们利用 `ML`\
  \ 研究了晶体界面和 `ELNES/XANES` 光谱。\n\n\n\n\n\n### 17.2.1 光谱数据库的构建\n\n本节主要回顾了两个任务：光谱解释/预测和属性预测。为了避免意外误差和噪声，我们首先通过\
  \ `via` 模拟构建了光谱数据库（实验光谱和噪声的影响将在稍后讨论）。使用 `CASTEP`^(85,86) 代码进行 `ELNES/XANES` 计算，该计算基于第一性平面波基组赝势方法。模拟了氧化物材料的氧\
  \ K Edge。选择 Perdew–Burke–Ernzerhof (`PBE`）泛能的广义梯度近似 (`GGA`）^(87)来近似交换相关泛能，并将截止能量设置为`500\
  \ eV`。为了引入内空穴效应，生成了激发态赝势并应用于超胞中的激发态氧原子。为了最小化周期性边界条件下激发态原子之间的相互作用，在所有情况下都使用了足够大的超胞（`>10\
  \ Å`）。计算的光谱通过根据费米黄金律计算跃迁概率获得。理论跃迁能量也与先前的研究进行了类似的模拟。^(86) 计算光谱谱的细节见下文。\n\n### 17.2.2\
  \ 光谱数据聚类\n\n使用层次聚类法^(88)对光谱数据进行分类。最初，每个光谱被分配到自己的簇中。然后，将两个最相似的簇合并为一个簇。重复聚类过程，直到获得单个簇。相似性是基于一对光谱之间的余弦距离估计的，该距离通常用于衡量光谱的相似性。^(89,90)\n\
  \n用于衡量簇相似性的聚类链接方案是“双树”法中的“完成”法。在这项研究中，由于我们直接比较光谱特征，所有光谱的起始点都相互对齐。使用光谱的二阶差分来估计起始点的位置。\n\
  \n### 17.2.3 材料信息的决策树\n\n决策树使用树形结构将分类或回归结果可视化。通过反复将数据划分为两个或多个子集，决策树由具有特定标签的子集组成，这些标签与训练数据中的标签相同。由于这种方法是一种监督学习，因此需要训练标签。通过光谱聚类得到的标签被作训练数据。使用分类回归树\
  \ (`CART`) 算法^(91,92)进行训练。\n\n### 17.2.4 前馈神经网络\n\n使用前馈神经网络从光谱特征进行属性预测。前馈神经网络是最简单的一种神经网络。本研究选择它是因为它可以处理高维输入数据（如光谱），并以非线性方式整合它们之间的相互作用。我们使用了基于\
  \ `Adam` 方案的反向传播算法，^(93)来优化网络中的所有学习参数，从而使模型输出与训练目标之间的平均绝对误差最小化。使用修正线性单元 (`ReLU`)\
  \ 作为激活函数，并在未与输出层连接的隐藏层中将丢弃率（dropout rate）固定为`0.5`。超参数，*i.e.*，隐藏层数量和正则化参数，通过使用验证数据集进行五折交叉验证进行了\
  \ `via` 调优。\n\n## 17.3 结果与讨论\n\n### 17.3.1 数据驱动预测与解释方法的概述\n\n所提出的数据驱动光谱分析方法在图 17.1(a)–(c)中示意性给出。首先，构建了一个光谱数据库，其中每个光谱与其材料信息具有一一对应关系，如图图\
  \ 17.1(a)](#BK9781788017893-00424.xhtml#fig1)所示。\n\n![image](img/bk9781788017893-00424-f1.jpg)\n\
  \n图 17.1 光谱数据驱动预测和解释的策略。(a) 具有一一对应关系的光谱数据库和结构的示意图，(b)光谱聚类，(c)以光谱组作为训练数据的结构分类。改编自文献\
  \ 83,[`doi.org/10.1038/s41598-018-30994-6`](https://doi.org/10.1038/s41598-018-30994-6)，根据\
  \ CC BY 4.0 许可条款。\n\n如上所述，我们通过 `via` 模拟构建了光谱。在创建数据库后，根据“相似性”将包含的光谱分组，聚类图示意性地位于图\
  \ 17.1(b](#BK9781788017893-00424.xhtml#fig1);纵轴对应光谱的“差异性”。\n\n在最后一步，通过决策树对材料进行分类。如图\
  \ 17.1(c](#BK9781788017893-00424.xhtml#fig1)所示，`ELNES/XANES` 光谱对应于材料信息。我们方法最重要的方面是材料分类。由于决策树基于光谱组，它建立了材料信息与光谱特征之间的关联。\n\
  \n我们的方法使用了两棵树：聚类图（见图 17.1(b](#BK9781788017893-00424.xhtml#fig1））和决策树（见图 17.1(c](#BK9781788017893-00424.xhtml#fig1))）。与光谱分类和材料信息相关的两棵树相互关联，因为决策树是基于光谱分类的。在构建双树后，就可以预测\
  \ `ELNES/XANES` 光谱。光谱的预测和解释策略分别在图 17.2](#BK9781788017893-00424.xhtml#fig2)(a)和(b)中所示。\n\
  \n![image](img/bk9781788017893-00424-f2.jpg)\n\n图 17.2 (a) “下游”光谱预测和(b) “上游”光谱解释的原理图。改编自文献\
  \ 83,[`doi.org/10.1038/s41598-018-30994-6`](https://doi.org/10.1038/s41598-018-30994-6)，根据\
  \ CC BY 4.0 许可条款。\n\n考虑一种情况：已知目标材料的原子配置，但其 `ELNES/XANES` 光谱未知。这种情况通常发生，是因为我们通常会在观测之前预测光谱分布，以验证实验和样品条件。对于预测，我们将几何和元素信息（如键长、角度和价态）应用于材料信息决策树（图\
  \ 17.2(a](#BK9781788017893-00424.xhtml#fig2)右侧）。\n\n\n\n\n因此，决策树变成了一个真/假图（流程图），`e.g.`，例如三价态和键键的真/假图，如图\
  \ 17.2(a) 所示。利用材料（几何和元素）信息沿真/假图向下移动，我们可以到达任何一个标签，聚类 1、2 或 3，如图 17.2(a) 所示。由于材料信息的决策树与光谱的决策树是相关的，目标光谱应该与该聚类中的光谱相似。这种“下游”方法对应于对已知结构的未知光谱进行“预测”。\n\
  \n接下来，我们描述使用双树结构进行解释的方法。首先，我们定义 `ELNES/XANES` 的“解释”。`ELNES/XANES` 光谱反映了原子结构和电子结构；因此，“`ELNES/XANES\
  \ 光谱的解释`”对应于确定光谱与原子及电子结构之间的关系。\n\n考虑观察到未知区域/材料光谱的情况。在这种情况下，我们需要解释光谱，`i.e.`，需要确定光谱轮廓与材料信息（如键长和配位数）之间的关系。对于这种解释，我们再次使用双树；但我们如图\
  \ 17.2(b) 所示沿决策树向上移动。\n\n解释策略示意性所示图 17.2(b) 。对于未知区域/材料的 `ELNES/XANES` 光谱，首先确定光谱树中与观测光谱最相似的聚类。通过测量目标光谱与数据库中所有其他光谱之间的差异，我们选择与目标光谱最相似的光谱作为相似光谱。在图\
  \ 17.2(b) 所示的示例中，假设观测光谱与聚类 3（红框）中的光谱最相似。那么，通过从聚类 3 开始沿材料信息树向上移动，可以从决策树的分支获取键长和价态等几何和元素信息。然后，利用这些原子和电子结构信息对光谱进行解释。在图\
  \ 17.2(b) 的情况下，我们可以确定观测光谱来自一种具有“短键长”且为“三价态”的材料。\n\n决策树中的分支点在解释中起着至关重要的作用，`i.e.`，当确定了最相似的光谱聚类后，预计目标材料的结构与聚类中的材料相似。然而，无法获得相应聚类的“特征”信息。决策树中的分支点提供了相应聚类中材料的“特征”信息。\n\
  \n在下一节中，我们描述使用这种双树方法对氧 K 边（O-K edge）`ELNES/XANES` 进行预测和解释。选择 `O-K 边`是因为它们可以利用 `GGA`\
  \ 框架下基于密度泛函理论 (`DFT`) 的单粒子方法易于计算，并且它们基本上提供了导带的所有信息。^(46,47,50)\n\n### 17.3.2 单金属氧化物\
  \ O-K 边的演示\n\n我们计算了 39 种氧化材料的 `O-K 边`，包括 14 种单金属氧化物（列在表 17.1）和 25 种多晶型 `SiO[2]`（列在表\
  \ 17.2）。选择这 14 种单金属氧化物是因为它们没有“复杂”的电子结构（例如部分占据的 3d 轨道）或磁性。选择 `SiO[2]` 是因为它有多种晶型且应用广泛。使用这\
  \ 14 种单金属氧化物的 `O-K 边光谱` 来演示我们的方法。实际的解释和预测是通过 25 种多晶型 `SiO[2]` 的 `O-K 边光谱` 完成的。\n\
