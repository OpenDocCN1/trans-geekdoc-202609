  \ SE=92%, SP=89%, C=0.809。 |\n\n### 定义\n- `ANN`: 人工神经网络\n- `AUC`: 曲线下积\n- `logD`:\
  \ 分布系数\n- `logP`: 辛醇/水分配系数\n- `MPs`: 分子参数\n- `RF`: 随机森林\n- `Ro5`: 五倍规则\n- `RP`:\
  \ 递归划分\n- `SOMs`: 自组织映射\n- `SVM`: 支持向量机\n\n如上所述，先导化合物发现或优化涉及对化合物构效关系进行测试，随后对选定的化合物进行合成和实验筛选。研究表明，对化合物结构和物理化学的分析可以增加候选分子针对特定靶点的活性概率，并提高分子在临床前开发中的最终生存率。因此，有许多研究人员试图通过额外的\
  \ `MPs` 来改进 Lipinski 的 `Ro5` 过滤器，并为每个 `MP` 创建不同的违反截断点。\n\n许多物理化学性质（包括 Lipinski 的\
  \ `Ro5`，即经验法则）已被改善 ADMET 属性。需要注意的是，分子描述符的类型和长度影响化学表示的细节，而特征集合的选择取决于预期深度。最近的一项研究了涉及\
  \ `Ro5` 原始 4 个变量以及额外 6 个 `MPs` 的评分可行性：`PSA`、旋转键数量 (`ROT`)、环数量 (`NRING`)、卤原子数量、N\
  \ 和 O 原子数量 (`NATOMs`) 以及 `logD`。他们比较了规则测试 `C`=3、4 或 5 的最佳截断点，确定最有效的类药分类是违反少于等于 5\
  \ 次。\n\n本章的目标有两个：(i) 提出识别成药靶点的计算方法；(ii) 确定 `ANN` 或 `RF` 程序哪种更好地划分靶点空间。对于之前研究的数据集，这尚未正式建立，该数据集间接表明，超过\
  \ 5 次违的分子在经验上与特定靶点相关，但这项研究并未使用与 172 个靶点相关的实际靶点评分测试机器学习方法，并扩展到基于主成分分析 (`PCA`) 的靶点指标。最近直接对特定靶点相关分子的中位数评分使用\
  \ `SVM` 和 `RPs` 的初步性工作表明，`SVM` 在划分中位数 `logD` 得分为 4 或以上的靶点方面优于 `RP`。在本章中，我们将此工作扩展到\
  \ `ANN` 和 `RF` 分析，并同时使用非 `PCA` 结构（基于原始数据）以及根据 `MPs` 和靶点找到的相应 `PCA` 结构。我们使用的截断点与\
  \ Hudson 等人报告的截断点对齐，并部分修改了其他人的截断点。\n\n本章针对原始和基于 `PCA` 的 `MPs` 以及基于靶点中位数评分评估的评分函数包含\
  \ `Ro5` 的 4 个传统参数加 5 个额外的 `MPs`：`PSA`、`ROT`、`NRING`、`NATOMs` 以及 `logP` 或 `logD`。最近，`logD`\
  \ 被认为是比传统使用的 Lipinski 渗透系数 `logP` 更好的渗透预测因子。Hudson 等人开发了考虑物理化学性质的分子成药规则（计算违反次数的评分），并为\
  \ 10 个可能的 `MPs` 中的每一个一个推导了新的截断点。这些截断点记录在表 11.1 中，基于混合聚类判别分析方法，并证明与近期报告的部分 `MPs`\
  \ 的截断点基本一致。我们在本章中使用这些 `MP` 截断点来推导出每个分子和每个靶点的违反评分，测试截断点 `C`=3、4 或 5。\n\n\n\n\n我们分析了来自\
  \ DrugBank 数据库的 1279 个小分子，这是一个独特的生物信息学和化学信息资源，它将详细的药物数据（即化学、药理和药学数据）与药物靶点信息（即序列、结构和通路）相结合，包含\
  \ 6711 个药物条目（候选分子见[表 11.3]）。总共有 105 个不符合 Ro5 规则的分子，其中 681 个为口服给药，598 个为非口服给药。在研究中，发现了代表\
  \ 1279 个分子的 172 个靶点，并获得了分子在给定靶点中的位数得分；在给药方面，99 个靶点主要为口服，73 个为非口服。\n\n表 11.3 DrugBank3.0\
  \ 关于一个候选分子的信息（DB01048 阿卡替韦）。\n\n| DrugBank ID & 名称 & CAS 号 | 分子量公式 | 化学结构 | 类别 |\
