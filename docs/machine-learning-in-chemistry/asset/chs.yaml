  ## 10.1 化学建模的困难\n\n在化学工程中，许多过程和系统的物理化学规律是未知的、有限的或仅有不确定信息。在这种情况下，无法建立机理模型，或者这些模型存在显著误差。此时，基于实验数据的经验建模成为了一种可行的工具，具有提供准确模型的可能性。神经网络属于机器学习（ML）领域，属于此类工具，以“黑箱”的方式处理输入输出数据。\n\
  \n在复杂的非线性化学过程中，除了获取机理模型困难，求解这些通常由微分方程表示的模型还存在其他问题。利用神经网络对输出依赖进行建模是解决该问题的一种可能方法。\n\
  \n控制产品质量的另一个主要困难是某些变量缺乏“在线”测量，且其他测量可能伴随着大量的延迟。\n\n聚合过程建模存在进一步困难。聚合物产品通常包含许多添加剂以增强其性能。获取这些材料最广泛使用的工艺是间歇聚合，当需要更改生产规格进行生产时，这种方法非常有用。间歇操作是一个动态过程，反应条件在很大范围内变化。因此，数据采集和反应器配置面临挑战。\n\
  \n与间歇过程相比，连续聚合受益于大量数据的可用性，以及在关键参数窄操作范围内进行精确调整的可能性。\n\n自由基聚合最重要的特征之一是随着反应的进行粘度显著增加，特别是在本体和溶液聚合等均相体系中。在这种，与反应显著放热相关的传热成为一个难以控制的因素。从动力学角度来看，粘度的变化导致引发、增长、特别是终止步骤变为扩散控制。这些现象通过笼效应、玻璃化效应和凝胶效应来定义，代表了聚合建模中最困难的部分。\n\
  \n聚合反应的另一个问题是多解性。操作条件（如原料浓度、温度、压力催化剂加入速率）的差异会导致相同的聚合物（分子量、密度和成分相同），但产率不同。\n\n\n\n\
  在聚合过程中，确保产品质量远比涉及小分子的传统反应要困难得多，因为聚合物产物的形貌和分子性质会强烈地影响其物理、化学、热学、流变学和机械性能，以及聚合物的最终应用。从这一观点来看，开发能够根据聚合反应器操作工况的知识来预测聚合物质量的数学模型，通常是实现高效、高质量生产以及提高工厂运行水平的关键。许多研究人员对聚合反应器的机理建模进行了详尽的研究。然而，一个完整的机理模型将包含大量的微分方程，求解这些方程需要花费大量时间。此外，模型中出现的许多动力学参数值可能是未知的，或者难以精确确定。此外，当在同一套设备中生产不同规格的若干种聚合物时，在间歇或半间歇歇的操作条件下开发模型（特别是对于扩散控制型反应）是极其困难的。\n\
  \n为自由基聚合建立动力学模型并非易事，特别是当聚合反应在高温高压下进行时。这些困难不仅是因为反应器中同时发生的复杂反应，还因为对包括聚合物在内的混合物相关的物理化学现象的理解有限。\n\
  \n机理建模的一种替代方案是经验建模，它比现象学建模所需的特定工艺知识更少。经验建模需要对被认为对过程行为以及产品或系统质量或性质代表性的变量提供数据（测量值）。统计回归技术和神经网络越来越多地用于建立经验模型。\n\
  \n## 10.2 自由基聚合过程的现象学建模\n\n在将机器学习（ML）技术应用于自由基聚合之前，本节是必要的，至少出于两个原因。首先，这里展示了与建立和求解过程数学模型相关的困难，以及与建模准确性相关的问题。其次，此处引入的机理模型可能构成基于机器学习技术所需的数据生成器。\n\
  \n在通过自由基发生的聚合反应中，选择了甲基丙烯酸乙酯（MMA）和苯乙烯（St）的聚合作为示例，它们在许多方面相似，但具有特定的特征。我们将尝试展示机器学习技术在克服经典建模困难方面的作用，同时也为了对结果的准确性做出重大贡献。此外，并不难证明可能不熟悉这些技术的用户（例如化学工程师）可以轻松操作这些技术以获得他/她所需的预测结果，特别是当软件产品提供图形用户界面时。需要注意的是，这里介绍的案例研究使用的多数软件产品大部分属于本章作者（及其小组），并且其中一些已获得专利。\n\
  \n在自由基聚合反应中，现象学模型从过程的动力学方案开始；对于 MMA，该方案如下：\n\n![display](img/bk9781788017893-00227-t1.jpg)\n\
  \n![display](img/bk9781788017893-00227-t2.jpg)\n\n![display](img/bk9781788017893-00227-t3.jpg)\n\
