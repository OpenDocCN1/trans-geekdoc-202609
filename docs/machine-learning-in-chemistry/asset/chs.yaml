  \ **297**(55), 822.\n\n# 第 5 章：科学中的机器学习 – 机械共情的角色？\n\n## 5.1 引言\n“机械共情”（Mechanical\
  \ Sympathy）这一短语有一个有趣的起源：它由英国赛车手杰基·斯图特（Jackie Stewart）创造。他认为，进入赛车领域不需要成为工程师，但了解发动机可以让你成为更出色的车手。换句话说，为了充分发挥某事物的性能，不要仅仅做一个被动的消费者。作为三次一级方程式赛冠军获得者，也许他的话是有道理的。“机械共情”在人工智能领域会有帮助吗？在这里，我们认为它是可以的。\n\
  \n### 5.1.1 简史\n人工智能（`AI`）最早的应用是专家系统（`ES`）。由于无法进行独立学习，专家系统在当时的标准下是一个原始的工具：\n*  \
  \ `IF` pH 值大于 7，`THEN` 是碱性的\n*   `IF` 红外吸收峰在 1760 cm⁻¹ 处，`THEN` 存在羰基\n\n人工神经网络（`ANNs`）的发展（本章的重点）是人工智能进化的一个关键一步。与专家系统（`ES`）不同，它们不需要指令。尽管构建过程非常耗时，但在许多领域，它们能够匹配并最终超越人类推理。\n\
  \n在 20 世纪 60 年代和 70 年代，人工智能在大学里非常活跃，消耗了大量的 `CPU` 周期。尽管这一进展令人印象深刻，但化学家们仍专注于量子力学和晶体学，程序占据了大量的计算时间。在当时，人工智能是无法被忽视的。像一把多功能瑞士军刀，人工智能演化出了多种工具。尽管如今的“狭义人工智能”一次只能处理一种类型的问题——例如光谱分析或机器人控制——但它的应用范围非常广泛。受快速智能数据处理前景的吸引，化学家们正热情地采用人工智能。\n\
  \n### 5.1.2 挑战\n可能会出现什么问题？事实上，有很多。以下讨论的挑战是科学家首次尝试人工智能时可能面临的。尽管这些挑战主要针对对人工智能经验有限的物理学家，但对于那些熟悉人工智能的人来说也可能有帮助。在这种情况下，科学家放弃人工智能并局限于“传统”方法是否会更安全？答案无疑是否定的。人工智能在社会中变得流行是有原因的——它有效——而且在科学领域也同样着成功。\n\
  \n因此，本章并不是警告（“风险使用人工智能”），而是信息站（深入内部）。为了了解原因，请考虑以下：\n\n你可能会惊讶地发现，这是一个功能完整的计算机程序。它是用极其奇异的语言\
  \ `apl`（**A Programming L Language**）编写的，执行了约翰·霍顿·康威（John Horton Conway）标志性的“生命游戏”，该游戏构成了细胞自动的基础。\n\
  \n很难理解为什么 `apl` 程序会以简洁且不可理解而闻名。你可以从命令行运行它们，但需要一位“真正的”程序员来创建它们或解释它们的工作原理。\n\n在 20\
  \ 世纪 60 年代后期到 70 年代初，`apl` 在科学领域非常繁荣，但它面临着强大的竞争对手。尽管代码远不如简洁，但用 `FORTRAN` 编写的程序更容易理解，避免了实践\
  \ `apl` 的那种不透明性；此外，`FORTRAN` 编程已经在许多物理和生命科学家的技能范围内。像 `QCPE` 这样的组织提供 `FORTRAN` 程序（向全球免费分发穿孔卡盒），非计算机科学家可以无需修改直接使用。有机化学家瞬间成为了分子轨道计算的准专家。\n\
  \n\n\n\n随着 FORTRAN 的兴起，apl 逐渐凋零；当时仅有的少数 AI 程序性能不足、范围有限且奇形古怪，因此几乎没有竞争压力。转眼到 2020\
  \ 年，FORTRAN 已不再流行，而 apl 则被边缘化到了小众领域。相比之下，AI 比其早期的形态强大得多，而且在新型软件的加持下，它比十年前那些晦涩的程序更容易使用。\n\
  \n如果强大且更友好的 AI 软件已经将 apl 和 FORTRAN 抛在脑后，问题出在哪里呢？矛盾的是，危险之处在于易用性：软件变得越用户友好，直接喂入数据并“观察会发生什么”的做法就越具有诱惑力。即使运行软件并不一定简单，通常仍然可以使用软件中设置的任何默认参数，如果结果看起来“合理”，就接受它们。无论输入多么荒谬，大多数\
  \ AI 程序都会生成输出，但对这些输出的信心需要我们理解自己所用软件的局限性。\n\n我们需要了解 AI 内部到底发生了什么。\n\n如果有一点“机械共情”（Mechanical\
  \ Sympathy）就完美了。\n\n让我们深入浅。\n\n## 5.2 问题与解决方案\n\n### 5.2.1 训练 AI 需要多少样本？\n\n核物理学家最青睐工具是位于瑞士欧洲核研究中心的大型对撞机，^(11)，它可以在三分钟内生成\
  \ `10¹⁷` 字节的数据（足以填充 100,000 个 1Tb 硬盘）。产生的数据如此巨大，以至于在实时过滤后几乎全部被丢弃；^(12)只有最有希望的部分会被留下来进行详细分析。\n\
  \n化学家很少以这种速度产生数据，但确实存在大型数据库（包括 `PubChem`，^(13) `无机晶体结构数据库 (Inorganic Crystal Structures\
  \ Database)`，^(14) `Reaxys`、`SciFinder` 和 `ChEMBL`）^(15));其中某些对于本书讨论的应用至关重要。\n\n\
  训练需要多少样本？看起来使用的数据越多，结果越好。但事实并非如此简单。\n\n*注释* 当 `ANNs`（神经网络）首次进入科学领域时，一些研究人员使用整个实验数据集进行训练；然后使用同一组中的样本来测试网络质量。^(16)这在当时看起来可能是个好主意，但你可能已经意识到事实并非。在数据集上“反复利用”（Double-dipping）就像是在测试一个已经学会视谱的六首曲子的钢琴家时，要求他们现场视读他们已经熟悉的其中一首曲。训练和测试是不同的任务：训练期间使用的样本不能重新用于测试。\n\
  \n因此，数据集中的某些样本必须留出用于测试；留多少呢？经验表明，将数据集分为 75% 训练和 25% 测试通常效果良好；如果使用了验证步骤（第 5.2.5 节），将训练、验证和测试按\
  \ 70 : 20 : 10 分配是合理的。然而，这些划分是基于经验而非理论，因此它们并非不可更改。\n\n数据库本身应该有多大？特征与观测值之间的关系越复杂、越多样（见框\
  \ 5.1），网络从中学习所需的数据就越多。在简单问题中，例如通过含有染料的种溶液的吸收光谱确定三种彩色染料的浓度，只有少数基础关系连接着浓度与吸收（如果比尔定律成立，则每种染料一个），小型数据库就足够了；但大多数考虑使用\
  \ `ANN` 的问题都要复杂得多，需要更多的数据。\n\n### 框 5.1 一些术语。\n\n`ANN` 的作用是寻找连接特征（也称为描述符、预测因子、属性、特征向量或指纹）与观测值（也称为目标、地面真值或标签）的关系。例如，如果目标是寻找有机材料新型溶剂的成分，训练数据可能由各种已知溶剂组成，其特征包括分子量、分子偶极、合成可行性、pH、碳原子数量等*，而观测值可以是不同有机固体在这些溶剂中的溶解度。\n\
  \n训练在一个系列循环（或轮次）中进行，在每个循环中，网络都会看到一次整个训练集。\n\n观测值的已知值与网络生成值之间的差异就是测试误差或验证误差（或损失函数）。\n\
  \n对高效合成路线的搜索（书中其他地方讨论）是复杂问题的典型代表，`ANN` 可能有用。化学反应的产率取决于反应剂的种类、催化剂的存在、溶剂、温度和压力、反应相以及因素，因此有许多关系影响着特征和观测值。合适的数据库将非常大。\n\
  \n对于某些复杂问题，数据库实际上可能太大，以至于在留出部分数据后训练变得异常缓慢。这时可能需要使用数据还原（第 5.2.4 节）来精简数据库。\n\n在另一个极端，某些数据库太小，这在化学领域比其他科学更常见。为了填补空白，可以通过进一步实验产生数据，或者从非结构化来源（如期刊出版物）提取信息。Google\
  \ Scholar^(17) 是搜索科学文献的强大工具，最近补充了 Google Dataset Search^(18)，通过关键词对成千上万个商业、非商业、政府和其他网站进行快速搜索，这一过程对于定位未使用的数据库很有帮助。\n\
  \n当数据库较小时，另一种可能的选择是迁移学习，^(19,20)，通常用于图像识别。我们首先使用与感兴趣主题相关的大量数据训练网络。然后将训练好的网络作为较短训练的起点，使用小数据库的样本。这种二次训练的目的是调整之前确定的网络权重；本质上，解决一个问题的网络被调整来解决第二个问题。这种程序非常高效，利用了可能可能小到无法有效学习的数据库，在数据库不平衡时也有益。神经图灵机和模仿学习提供了进一步有效利用小数据集的方法。\n\
  \n\n\n\n问题在于，使用测试集对网络进行最后的抛光 `could` 可能会带来更好的模型，但我们无法确定它 `will` 会这样做，因为没有办法测试更新后的人工神经网络（ANN）。如果测试数据中存在偏差，例如，模型可能会退化而非改进：我们没有手段来检测这一点。同样，如果不对对性能进行独立检查，我们可能会过早终止训练，或者让其运行过久，导致模型训练不足或过度拟合。避免将测试数据反馈回数据集以尝试改进模型；这永远不是明智之举。\n\
  \n### 5.2.2 我们正在合并数据库；困难是否在前方等着我们？\n\n婴儿进入一个丰富且混乱的世界，并立即开始理解声音、形状、光线和味道。如果 AI 能够像婴儿一样，^(19)从随机的、不相关的数据片段中学习，那将节省大量时间；但这并非\
  \ AI 的工作方式。一个成功应用与失败之间的区别可能在于数据策展的精细程度。这涉及什么？\n\n*注释* 没有适当的数据策展，我们的方法就是“听天由意”。这是一个糟糕的策略；事实上，这根本不是一种策略。如果我们只是把数据扔进机器学习（ML）锅里看看会发生什么，我们应该做好失望的准备，特别是当数据是复杂的、长期记录的、受显著噪声影响或来自多个来源时。\n\
  \n数据收集只是策展的第一步。并非所有数据都存在可访问、维护良好的数据库中；有些数据可能埋没在期刊、演示稿、图表、表格、实验笔记本、记录不全的实验，甚至是日记中。如\
  \ `ChemDataExtractor`^(21) 之工具可以查询非结构化来源，但它们产生的数据格式通常与从其他地方获得的数据不兼容。数据必须经过分类和验证、标记、检查相关性和不可读条目、可能需要重新格式化，并以适合未来使用的形式存档——所有这些都是策展任务。\n\
  \n信息也可能存在偏差（无论它是故意的还是无意的；），^(22,23) 无论来源如何，偏差都会减缓学习并降低其有效性。来自廉价、快速和简单实验的数据在数据库中的占比可能比更具挑战性但信息丰富的实验数据更高。正如预期的，研究人员主要贡献他们自己领域的成果，因此这导致某些领域的数据充足，而另一些领域的数据较弱。当商业来源的数据被部分删除时，也会产生偏差，以防止竞争者了解可能具有商业敏感性的领域。即使是失败的反应也可能具有价值，因此这些被忽略或隐藏。这些效应不利于成功机器学习模型的生成，模型要求数据大致均匀地覆盖搜索空间的所有区域。\n\
  \n### 框 5.2 偏差。\n\n数据库的组成以及从中选择样本的方式都会导致学习偏差。以下是一些示例：\n\n- 数据库中易于获取的数据过度表征，而收集较困难但具有潜在价值的数据代表性不足。\n\
  - 与其他相关领域相比，来自自己专业领域的数据在数据库中过度表征。\n- 出于商业原因故意从数据库中隐留相关数据，或以防止他人获得研究优势。\n- 通过排除可能不支持你想要证明的点的样本，仅选择数据集的一部分进行学习。\n\
  - 对所有样本赋予相等权重，尽管某些样本已知或怀疑可靠性较低。\n- 以非随机方式从数据集中选择样本；例如，在没有足够证据证明选择的情况下，仅选择特定年份的数据，或仅选择来自你熟悉或在特定国家工作的研究小组的数据。\n\
  - 选择数据库时没有充分理由说明使用某些而省略另一些的。\n\n策展就像春季耕整花园，是在进行更令人愉悦的收获之前的一项枯燥但不可避免的任务。实际上将数据输入\
  \ ANN 的过程可能花费的时间长得多，但它至关重要。\n\n### 5.2.3 我们使用化学数据库预测反应，但进展甚微。可能出了什么问题？\n\n鉴于高质量、多样化的数据，我们认为已经准备好开始机器学习了。但即使是策展良好的数据库也可能存在漏洞。*注释*\
  \ 重点项目，如预测材料组成，^(7)实现室温，^(24)或设计合成路线，^(25)在技术上具有挑战性，在工业上很重要且具有商业价值。\n\n对于此类项目，大型数据集是必不可少的。这就是所谓的维度灾难：^(26)\
  \ 随着有效学习所需的独立特征数量增加，训练所需的样本数量随特征数量呈指数级增长。考虑合成路线的设计：从有机化学 101 中你可能记得两种有机化学品混合时预期的产物，但在规划可行的、高产的合成路线时，这种知识水平完全不够。\n\
  \n负数据并没有未报道的数据那么棘手；事实上，负数据可以很有价值。ANN 无法从它从未见过的数据中学习，但它可以利用负面结果。^(27) 失败、产率低或极缓慢的反应出现在文献中的概率远低于成功的反应，^(28)\
  \ 但知道某个反应不可行可以让我们排除涉及它的拟议合成路线。如果缺少失败反应的数据，可能可以使用极大似然法，^(25)或外部分析模型进行估计。或者，可以为那些看似合理但可以假设为失败的反应创建推测的负数据。^(29,30)\n\
  \n### 5.2.4 我们的数据库太大，训练将需要永远。我们能做什么？\n\n完美的数据集应该是全面且紧凑、无噪声、机器可读、在搜索空间分布均匀且格式一致。真实的数据集包含噪声、冗余、重复和错误，并可能是混合格式（例如，公制和英制单位的数据，或者数字和文本形式）。更糟糕的是，某些数据库可能臃肿到几乎无法训练。\n\
  \n*注释* 策展并不是一个边界清晰的过程；它与预处理重叠，在预处理期间，我们加工数据库中的信息以改善学习前景。\n\n\n\n\n\n一种简单且常见的预处理类型是数据缩放（scaling）。如果输入\
  \ `ANN` 的特征量级差异巨大，较大的值可能会主导学习过程，导致那些值始终很小的特征在学习过程中仅仅起到噪声的作用。从原则上讲，`ANN` 本身能够缩小大值，使其不至于主导学习。然而，当大值输入到\
  \ sigmoidal 激活函数时，输出对输入的依赖关系非常微弱，因为激活函数在大输入值处会进入平坦区域。此时学习会变得缓慢且可能无效。缩放通过将所有特征值带到大致相同的范围，减少了这种影响。\n\
  \n缩放非常直观，但当数据库大到几乎无法使用时，就会出现一个更关键的挑战。化学领域中一些最大的数据库包含分子数据；例如，`Reaxys` 包含了超过 1 亿种化合物的数据。每个分子可能由数百个特征来表征，包括分子量、`logP`\
  \ 值、手性中心数量、分子极性和分子体积。在数据库中包含极大量的化合物和众多特征提供了极大的灵活性；可以向数据库中添加数据，而无需知道哪些特征在未来的应用中可能具有价值，因此全面的数据库鼓励了广泛的适用性。遗憾的是，这也会导致数据库变得难以处理。\n\
  \n应用中关键的分子特征可能与数百个其他无关或冗余的特征并存，因此某种识别这些关键特征或削减数据集的方法可能是至关重要的。低信息量的特征可以使用遗传算法（`Genetic\
  \ Algorithm`）^(31)来识别，并在训练开始前将其丢弃。或者，可以使用主成分分析（`PCA`）^(32)来创建一个新的线性无关“组件”，每个组件都代表数据中主导特征的混合，并与一个特征值（`eigenvalue`）相关，该特征值量化了该组件所封装的数据变异性。可以使用特征值来决定应该保留多少个组件：使用大特征值的组件，而丢弃小特征值的组件。（你会发现，在我们认为具有“大”特征值并保留的组件，与那些不幸具有“小”特征值并成为移除候选的组件之间，可能存在一个灰色地带。）\n\
  \n作为一个辅助收益，这种对小特征值组件的筛选有助于减少噪声。如果数据集中的信噪比很高，大多数噪声应该集中在小特征值的组件中，因此移除这些组件会减轻其影响，同时让有意义的特征基本保持不受影响。不过，`PCA`\
  \ 过程不可避免地将某种噪声混合到样本特征中，因此在大特征值组件中仍保留了一些噪声；通过丢弃低特征值的组件，某些信息也会随噪声丢失。此外，保留的组件没有简单的物理含义。\n\
  \n尽管如此，数据压缩是有价值的；它通过减小数据集的大小提高了效率，因此训练速度应该更快。它还可以限制由误导性或错误数据引起的失真，因为大型数据集中少数故障样本的整体影响可能大于背景噪声，因此在很大程度上会集中在小特征值的组件中。最后，特征数量的减少降低了过拟合的概率，并产生更简单的模型。虽然保留多少个组件是一个判断问题，但经验和特征值本身都提供了有用的指导。\n\
  \n### 5.2.5 我如何设置参数？\n\nAI 处理的是数据而非意义；无论它们是预测超导体的成分，还是预测洋基队明年赢得世界大赛冠军的概率，它们的运行模式大致相同。灵活性和易用性是它们的吸引力所在，但后者可能是陷阱：如果你使用默认参数“盲目”地训练网络，结果可能会很差。\n\
  \n\n\n\n有多个参数需要设置，我们应该如何进行呢？首先，我们应该意识到，对于许多简单的问题，`ANN` 中的单个隐藏层就足够了。小型网络训练速度快且具有良好的泛化能力，因此，尽管在几何结构上仍必须做出选择，但试错法通常是行的。小型网络也不容易学习数据中的噪声或特定示例，因为描述数据需要所有的权重。因此，一个带有隐藏层的小网络通常是一个合适的起点。\n\
  \n当数据更加复杂时，可能需要多个隐藏层。尽管网络设计变得更加困难，但我们并非完全摸黑。如果使用了 `PCA` 进行降维，保留的主成分数量将是知的，这可以作为网络大小的指导。尽管要设置的参数并不多，但它们相互作用的方式难以预测，因此逻辑方法很有帮助。特别是遗传算法(31)证明是寻找高质量网络的流行工具。它们的缺点是必须有效地整合到\
  \ `ANN` 中，因为手动运行神经网络的遗传算法优化几乎是不行的。\n\n另一种选择是通过扩展或剪枝网络提供的。(33)在第一种方法，训练一个可能太小的网络，并使用测试集评估其性能。然后在隐藏层中添加一个节点，从头开始训练并重新评估。继续添加节点，直到性能（通过测试集判断）显示网络开始学习噪声和示例。以此方法确定“理想”网络的大小。\n\
  \n我们也可以考虑另一种程序，即从一个认为太大的网络开始，反复地训练、评估并剪枝网络，直到性能明显下降。在这两种方法中，前者更实用，因为被测试的网络较小，因此训练较快；而后者训练较慢。\n\
  \n你可能发现了一个困难：对于两个或更多层的网络，每次更新几何结构时都必须决定修改哪一层。虽然在深度网络可以使用单独层来识别数据的不同特征，但在双层或三层网络中，试错几乎不可避免。\n\
  \n### 5.2.6 我的 AI 如何学习了不存在的东西？\n\n你写了一个识别猫的 `ANN` 程序。为了避免偏见，你用相同数量的黑猫、白猫和橘猫图像来训练它，然后用一些猫和狗的新照片测试训练好的网络。`ANN`\
  \ 一致将狗识别为非猫——这令人鼓舞——但奇怪的是它有时正确将一张图像识别为白猫，稍后又将*相同的图像*识别为黑猫。发生了什么？\n\n*注释* 这听起来是一个微小的、可以忍受的干扰；大多数\
  \ AI 工具并不是 100% 正确的，(19)所以我们必须接受偶尔的错误。但可能存在深层的问题。\n\n用于时间数据的 `ANN`（例如患者的病情进展或化工厂的在线控制）通常具有反馈（或循环）结构。这赋予了它们时间记忆；也就是说它们可以学习序列。猫问题出现是因为\
  \ `ANN` 既从训练数据学习，也*从数据呈现的方式*中学习。在我们急于避免偏差的情况下，我们向它展示了一只白猫、一只黑猫、一只橘猫、一只白猫、一只黑猫、一只橘猫、一只白猫……以此类推。算法在无意中被喂了额外信息：``````\n\
  如果你看到一只白猫，下一张图像将是一只黑猫\n```\n并从中学习了。\n\n在时间序列中，了解一个数据点与其邻居点的关系是重要信息，但如果你从不分析此类序列，你可能会觉得可以忽略呈现问题。\n\
  \n但这里有一个根本性问题。数据库通常以逻辑方式组织（甚至是不合逻辑但仍然有顺序的方式）；分子可能按分子量增加的顺序出现，所有涉及氨基酸的化学反应可能聚集在一起，药物可能按效力降低的顺序列出，或者所有来自特定国家研究小组的数据可能分在一起。可以顺带提到，即使整个数据库没有显示这种程度的排序，某种程度的组织也是常见的。上传到数据库的数据往往是有无意偏见的——输入的一块数据可能都来自同一个研究小组，或者都与同一组反应或同一个药物测试计划有关——数据库可能包含不代表整体的区域，除非对整个数据库定期随机化。如果不是以真正的随机方式从数据集中采样，学习可能会受到影响；对于标准前馈算法这也是潜在问题。解决方案很简单：在训练期间只需真正随机选择样本即可。\n\
  \n### 5.2.7 我训练的 AI 测试结果很完美；现在它产出了垃圾\n\n当一个创造性的人“跳出框架思考”时，我们可能会对结果留下深刻印象。当 AI 这样做时，我们可以预计麻烦。你的博士生项目是用\
  \ AI 预测相图，她现在已经放弃去当了一个商人。图 5.1 显示了她最近的实验数据。你想得到完整的图，所以你输入已测量的实验数据，并使用她的 AI 预测剩余部分。你对结果有吗？\n\
  \n*注释* 在解决你学生的问题之前，看看图 5.2](#BK9781788017893-00109.xhtml#fig2)，它显示了身高随年龄的变化。\n\n\
  回到我们的科学示例，完整的实验数据显示在图 5.3](#BK9781788017893.xhtml#fig3)。让我们用数据训练一个 `ANN`，然后问它典型的七岁孩子有多高。它回答：“大约\
  \ 118 厘米”。\n\n这看起来是对的；那么 75 岁的人呢？`ANN` 再次充满信心：580 厘米（约 19 英尺）是它的估计值。当然，错误是我们的，而不是\
  \ `ANN` 的。\n\n\n\n\n![image](img/bk9781788017893-00109-f3.jpg)\n\n图 5.3 丙醇-水混合物气相中丙醇摩尔分数随成分变化的函数图。所有点（包括在低丙醇摩尔分数处显示的点）均为实验数据。\n\
  \n很显然，我们不能合理地期望 AI 能够准确预测图 5.3 中黑色的四个点，如果它在训练期间唯一访问到的数据仅是图 5.1 中所示的数据点。对于超出数据库信息所定义界限的问题，对\
  \ `ANN` 回答的置信度必须很低，而这一观察在处理极大型数据库时可能会被忽视，因为我们可能甚至不知道界限究竟在哪里。我们得出结论：除非有证据证明其学习的数据源恰好涵盖了我们感兴趣的样本范围，否则我们在接受\
  \ `ANN` 的输出时应当保持谨慎。\n\n### 5.2.8 我的 AI 解决了框 5.4 中的挑战；它是如何做到的？\n\n## 框 5.4 以下每个序列的下一个数字是什么？\n\
  \n*   序列 A： 1, 0, 1, 0, 1, 1, 8, ….\n*   序列 B： 6, 6, 7, 9, 8, 6, …\n\n[不确定答案吗？稍后会给出答案。]\n\
  \n如果我们的 AI 解决了这些问题，它用的是才华还是运气？要求解释是没有意义的；`AIs` 不会展示它们的推导过程。\n\n*评注* 解释是基础性的；在缺乏坚实理由的情况下，预测只有在持续正确时才具有说服力。没有证据，正确的预测可能只是海中捞针，或者仅在某些有限的领域内是可靠。\n\
  \n这并不是说不可解释的科学毫无价值。量子力学并没有为波粒二象性提供解释，但它仍然是科学的石。尽管如此，如果一个 `AI` 给出一个没有解释的惊人结论，我们可能会合理地保持谨慎。\n\
  \n尽管 `ANN` 的“知识”被编码在它的连接权重中，但单个权重并没有任何“意义”。这些权重甚至不是无歧义的：几何结构相同且在相同数据上训练的 `ANN` 可能会收敛到完全不同的权重集，但仍然产生相似的预测。是权重与网络几何结构的结合将特征与可观测值联系起来，但训练网络内部编码的数学关系远未能构成一个连贯的解释。\n\
  \n很难察觉小型网络通过其连接权重告诉了我们什么，因此我们可以预见深度网络将带来更大的挑战。它们的多个层级将深层的力量与深层的不可渗透性结合在一起。`DNNs`\
  \ 在围棋和蛋白质折叠等挑战中的表现令人印象深刻，由于其强大，我们可能准备好忍不受充分的解释。然而，在安全关重要的任务中，如民用飞机或核导弹的控制，我们应该警惕使用我们无法质疑其结论的方法。即使在科学的非安全关键应用中，我们也不应该觉得\
  \ `DNNs` 是金标准（参见框 5.5）。在许多类型的问题上，它们的表现并不比小型网络更好，而且难以解释。\n\n## 框 5.5 深度学习网络的一些局限性。\n\
  \n*   网络复杂，具有许多权重，因此需要大量的训练数据。\n*   训练过程很长，因此需要大量的计算资源。\n*   与其他 `ANNs` 一样，由于缺乏理由，`DNNs`\
  \ 的解释能力很差。\n*   `DNNs` 无法整合先验知识；例如，它们目前无法考虑到诸如物理定律。\n*   有证据表明 `DNNs` 有时会被与其训练数据略有不同的数据所误导。\n\
  *   它们不擅长处理人类可以理解的层级知识。\n\n此外，我们应该注意到 `ANNs` 难以解释并非孤例。支持向量机将数据投影到高维空间，而我们只能可视化其中的小部分。支持向量机在解释其所做工作方面并不比\
  \ `ANNs` 更好。\n\n在非安全关键应用中，解释是有帮助的。如果黑箱模型无法解释，就无法进行拆解或改进。`ANN` 无法完成任务，也无法指导人类如何完成该任务。未来的\
  \ `AI` 工具不仅将擅长我们做不到的事情（例如计算蛋白质折叠），还将擅长我们能做的事情（例如驾驶）。如果我们想利用学习了人类技能的 `AI`，那么理解它是如何做出决策并从中学习将是关重要的（甚至被它们教学）。\n\
  \n还有伦理考量。没有“道德正确”的方法来折叠蛋白质或判断黑洞是否位于银系中心，但我们可以想象 `AI` 的决策可能难以预测且难以证明。假设一辆自动驾驶汽车突然面临不可避免的碰撞，这会导致乘客（以及\
  \ `AI` 本身）受伤，或者导致许多行人。如果汽车没有伦理指南——我们现在能想象它是如何学习这种东西的吗——它可能会让自己和你的生存置于他人之上。我们可以对虚拟汽车和人类进行事故实验，看看\
  \ `AI` 如何反应，但如果 `AI` 产生了自己的伦理准则却仍然无法将其表达，我们能感到接受吗？\n\n关键情况出现在其他领域，如化学工厂的控制。随着 `AIs`\
  \ 控制日益复杂的工厂，我们对理解其决策过程的需求将变得更加强烈。随着 `AI` 无处不在，开发能够解释自身的 AI 是一项要求。\n\n### 5.2.9 我的\
  \ AI 认为篮球运动员会导致全球变暖\n\n图 5.4 证明了 `NBA`（美国篮球协会）球员的高薪会导致全球变暖。升高地球温度的其他因素包括挪威大象数量的减少以及比利橡胶靴的价格上涨。\n\
  \n![image](img/bk9781788017893-00109-f4.jpg)\n\n图 5.4 篮球运动员平均薪水与全球平均温度上升之间的关系。(35,36)\n\
  \n当然，它们并没有这样做。\n\n*评注* `AIs` 有能力无智能。它们可以揭示相关性——描述两组数值关联程度的统计量——但 `ANNs` 无法确定相关性是否意味着因果关系，即一个变量的变化直接导致了另一个变量的变化。毫无意义的相关性，例如斯堪纳维亚大象与全球温度之间的相关性，构成了“假发现”问题。\n\
  \n\n\n\n\n虚假发现在上世纪中叶具有特殊的意义。当时，肺癌的发病率正在上升（这种疾病在 20 世纪初非常罕见，以至于许多医生在职业生涯中从未见过病例），但其上升的原因尚不清楚。1950\
  \ 年，布拉德福·希尔（Bradford Hill）和理查德·多尔（Richard Doll）此前曾假设暴露于沥青或汽车废气可能是原因，随后发表的研究表明，吸烟才是罪魁祸首。\n\
  \n烟草的反应在预料之中：完全否认。他们辩称，肺癌不是由吸烟引起的，而是由一种未知的遗传因素导致的，某些人对肺癌异常敏感；同样的因素使人们对烟草成瘾。`smoking↔lung\
  \ cancer`的相关性确实存在，但这种联系在于这个未知的遗传因素，而不是吸烟。遗传学（如果它是真实的解释）就是所谓的混杂变量；一种影响两个完全独立元素的因素——在本例中是肺癌发病率和烟草成瘾——而这两个元素之间没有因果关系。多年以后，公司才承认他们引入混杂因素并非基于任何有意义的数据，而且吸烟确实会导致肺癌。\n\
  \n正如我们在 NBA 球员薪水和全球变暖中看到的，两个属性的值可能相关但并没有连接机制。惊讶的是，反之也可能：一个因素可能直接影响另一个因素，但与其并不相关。一个例子是恒温器，它保持室内恒温。当室外温度下降时，恒温器运行时间更长，加热器燃烧更多的气体。由于室内温度几乎保持不变，恒温器的温度与气体消耗量之间的相关性微乎其微，尽管是恒温器导致了气体消耗的变化。\n\
  \n相关（也称为关联）不是因果关系。但我们如何区分两者呢？理清这种差异可能是复杂的。贝叶斯网络已用于语音识别、天气预报等领域，是某些问题的潜在解决方案。它们比大多数类型的\
  \ `ML` 更容易受到审查，因此在有利的情况下，更容易区分相关性和因果关系。\n\n这里没有足够的空间深入探讨贝叶斯方法，尽管它们很有用，但绝不是检测因果关系的万能药。要传达的信息是，如果你的\
  \ `ML` 应用似乎两个两个之间相关，在假设其中一个导致了另一个的变化时要谨慎。需要科学投入来支持 `ANN` 的结论。\n\n### 5.2.10 我的 AI\
  \ 结果建议我的数据只包含噪声，但我认为可能存在某些东西。我该如何判断？\n\n几乎所有的科学数据集都包含噪声。某些噪声可能会随着 `ML` 的学习而被平均掉，但如果这些噪声根本不是噪声，而学习正在破坏信号呢？\n\
  \n*Comment* 当行星在绕着它们的恒星运行时时，太阳系外的行星可能会经过恒星和地球之间，导致到达我们这里的星光量短暂下降。天文学家利用这些凌日期间强度的变化来推断行星的存在。由于行星远小于恒星，这种变化非常细微，因此信号的改变量可能会被星光的背景变异性所淹没。我们该如何处理这个问题？\n\
  \n一种潜在有效的方法是 `PCA`，我们在 5.2.4 节中遇到过。对数据集进行 `PCA` 处理得到的特征值告诉我们，数据中的每个 `eigenvector`\
  \ 代表了多少变异性。如果数据集中只包含噪声，预计特征值的值将以大致单调的方式减少。如果数据中存在真实的（尽管微小的）信号，这应该反映在一个或多个特征值上，它们的大小使其与仅代表噪声的特征值区分开来。\n\
  \n如果我们知道信号可能是什么样子的，与其使用原始数据训练 `ANN`，不如使用信号的示例来训练它。天文学家渴望探测星际空间中的氨基酸，将其作为银系其他地方生命的可能指标。在陨石中发现了氨基酸的痕迹，因此推断这些分子也存在于星际空间是合理的，但由于浓度显然非常低，因此很难检测。可以使用一组氨基酸的实验室光谱来训练\
  \ `ANN`，然后输入来自天文观测的实验光谱，以寻找可能暗示这些分子存在的极微弱信号。相反的过程（即使用实验天文观测训练 `ANN`，然后向其展示样本氨基酸的光谱）可能成功率较低，因为模型中引入了大量的噪声。由于天文信号极其微弱（如果它们确实存在），这两种方法执行起来都不简单。尽管，AI\
  \ 方法在解释此类微弱信号方面显示了前景。\n\n### 5.2.11 我的 AI 一直表现良好，直到我找到了一些额外数据给给它；为什么数据让它变得更糟了而不是更好？\n\
  \n窄 AI 擅长学习一件事，但难以进一步发展。\n\n*Comment* 我们训练 AI 直到在测试集上的性能衡量达到学习最大化。如果之后恢复训练并使用额外的、以前未见过的数据，之前学到的东西可能会被慢慢遗忘，因为新信息开始覆盖旧信息（但请参见\
  \ 5.2.1 节中的 `Transfer learning`）；如果新数据位于旧数据非常不同的区域，先验学习的丢失尤其为可能。一个训练用于识别狗的算法，如果随后用包含其他动物的更多图像进行训练，它将逐渐失去这种能力。\n\
  \n深度学习避免了这些一些问题，因为可以构建具有限制条件的 `DNN`，这些限制条件可以强制不同层学习数据的不同方面。即使如此，如果向训练好的网络大量位于新区域的新数据，知识将会退化。`DNN`\
  \ 可以下国际象棋、下围棋或折叠蛋白质，但不能同时完成这三项任务。\n\n### 5.2.12 尽管有大量数据，我的 AI 仍然很吃力\n\n能够计算误差或损失函数是\
  \ `ANN` 的绝对要求；如果没有观测值的数据，`ANN` 就无法学习。在学习开始之前，我们必须定义目标；这可能非常简单，例如识别 X 光片中的骨折，或者预测超硬材料的成分。但\
  \ `ANN` 需要标量或向量数值形式的目标，而不是一个通用的、模糊的愿望列表。定义目标可能是挑战性的；有些问题是定义不良。这意味着什么？\n\n目标模糊或难以量化。最常见的原因是总目标包含许多子目标，很难同时满足所有目标。\n\
  \n\n\n\n\n假设我们决定使用 AI 来设计一种新型聚合物膜，这种膜将作为严重烧伤患者的临时皮肤。我们要求该产品应该是有效的、无毒的，并能保持足够长时间的，以便下方的皮肤能够充分恢复。还有其他可能的标准：它应该易于使用，以便未经过训练的人员在紧急情况下使用；它不应粘附在恢复中的皮肤上；成本要廉、保质期长、便于合成并促进愈合。目标列表很长，我们起初可能会认为这是一个优势：目标越多，理想产品的定义就越精确。通过对\
  \ `ANN` 提供关于这些目标的非常具体的指导，难道它不就能够锁定到完全正确的配方吗？事实恰恰相反。\n\n在这个例子中，使用我们的 AI 既存在实际问题，也存在伦理问题。记住，`ANN`\
  \ 试图最小化其对样本的实际输出与预期输出之间的差异。因此，对于数据集中的所有样本，我们必须首先通过结合许多影响因素来确定`observable(s)`，每个因素都经过单独加权以反映它们的相对重要性。但“相对重要性”是一个判断问题。如何平衡产品的易用性与生产过程的复杂性及安全性？什么程度的毒性是可以接受的：如果死了一个人而救了\
  \ 99 个人，这是可以接受的吗？五个人或十个人呢？假设该产品可以救命，但价格昂贵到会消耗其他关键医疗服务的资金；考虑到由于资金缺失而在其他产生的负影响，我们如何判断这种新型聚合物皮肤总体上是否有益？或者——更有问题的是——假设这种聚合物膜对某种特定血型的人有效，而对另一种血型的人完全无效；资助仅对少数人口受益的产品进行开发和部署是否合适？\n\
  \n如果听任其发展，我们无法期望 `ANN` 能够独立地优化每一个观测值。相反，它可能会提出一种既有效又昂贵的产品，或者一种廉价、易用但有毒的产品。因此，在我们尝试训练网络之前，我们必须自己做出这些判断，而且可能是基于非常有限的数据。格式不当的问题并不罕见；它们往往是我们最想解决的真正复杂的问题之一。随着\
  \ AI 能力的增强，会有更多此类问题变得可以应对。构建一个可以解决此类问题的 `ANN` 的技术挑战，与如何结合多个目标这一大问题相比，是微不足道的。即使在伦理问题没有增加复杂性的情况下，这里也没有简单的答案。\n\
  \n## 5.2.13 问题：我的 AI 一直很怪\n\nAI 甚至会产生奇特的结果，即使它们是按照设计要求运行的。\n\n*注释* AI 仅仅刚刚学会走路，所以当应用并不总是按计划进行时，我们不应该感到惊讶。\n\
  \n考虑一下当大多数汽车都是自动驾驶汽车时会发生什么。汽车必须确保乘客和行人的安全，因此如果行人突然从汽车前方的人行道走下，它必须停止，并在行人离开后才移动。如果另一一个行人进入进入路，汽车必须再次停止。在汽车众多的城市里，可能的后果是什么？行人会很快意识到，无论交通多么拥挤，走上路都是安全的。不久之后，交通流将停滞。这也许是道路安全的终极，但使用人脸识别技术等方法对行人行为进行监管的需求可能会变得无法负担。\n\
  \n意外的行为将不仅限于道路。考虑一个 AI，其作用是控制一个工业工厂，化学品流入开放式储罐，发生反应，然后从出口管排出。如果储罐溢出，安全将受到威胁，因此 AI\
  \ 必须学习调整液体流入速率以防止这种情况发生。我们在工厂的虚拟模型上对其进行训练，使用损失函数，每当液体从储罐溢出时就惩罚 AI。它应该很快学会如何将液位保持在安全范围内，但我们可能没有预到它会学会这样做最简单的方法是完全关闭液体流。它是安全的，但不是高效的。\n\
  \n在简单的、易于解释的单元中（如化学系统），可以在早期发现并纠正意外行为。然而，AI 拥有的控制越多，它们的行为就会变得越复杂、不可捉摸；那时，任何建立的系统都能明确证明其以可靠且逻辑的方式运行将变得至关重要。\n\
  \n## 5.2.14 事情搞砸了。我该怎么办？\n\n在最后一个章节中，我们将简要查看你在使用 `ANN` 时可能会遇到的其他一些问题。\n\n### 5.2.14.1\
  \ 网络没有在学习\n\n*检查数据。* 如果几乎没有学习的迹象，请使用经过充分研究的小型数据集（如 `Iris`）测试 `ANN`。该数据集的学习应该在最多几十个循环内几乎完成；如果没有完成，可能是数据读取错误，或者网络工作不正常。`ANN`\
  \ 会不会按列读取数据而不是按行读取，或者`反之`？如果数据读取是正确的，且你能够检查网络权重，请输入单个样本，并在`backpropagation`（反向传播）后手动重新检查权重，看它们是否按预期进行了更新。这很枯燥，但这是发现编程错误的彻底方法。\n\
  \n*检查激活函数。* 阶跃函数不适用于有意义的问题；如果你在使用它，请将其更改为类似 `tanh` 或 `ReLU` 的 sigmoid 函数。\n\n*检查数据标签。*\
  \ 也许数据集中的样本读取是正确的，但标签有误，导致 `observables` 与它们所属的样本没有关系。手动检查数据集部分的标签。如果它们看起来是正确的，仅使用这个检查过的集合训练一个小型网络，看看测试是否显示学习有所提高。\n\
  \n*还有可学习的东西吗？* 数据可能不包含连接输入和输出的内容。如果你在使用大型数据集并选择了部分样本特征和/或 `observables` 进行训练，这种情况更有可能。停止训练，将数据集扩大\
  \ 20%，添加只包含随机数据的样本，然后从头开始训练。如果性能没有变差，说明数据集可能不包含网络可以利用的信息。\n\n*检查网络结构。* 网络可能太大了。如果是这样，它可能会记住数据集中的每个样本，而不发现任何关系，从而避免了学习识别任何测试样本所需的规则。从小型网络和适量的样本量开始训练。如果有学习的证据，逐渐增加样本数量，以证明有网络可以学习的数据。\n\
  \n### 5.2.14.2 我的网络学习非常慢。\n\n*你是不是太急了？* 训练 `ANN` 可能很慢。典型的网络需要几百或几千个 epoch 才能有效学习，如果数据集非常大，需要的更多。检查验证误差的表现如何。如果它正在改进，且测试集上的表现也是如此，请继续吧。\n\
  \n\n\n\n样本包含大量的噪声。如果样本噪声很大，请使用更大的数据集（如果可用）来减小这种影响。如果信号与噪声相当，学习将非常缓慢且可能无效。尝试使用 `PCA`\
  \ 来缩小数据集，并观察移除特征值最小的组件是否能减少噪声。尽管如此 `PCA` 并不是魔术——随着信噪比的下降和信号被噪声淹没，它消除噪声的效率会逐渐降低。\n\
  \n是否可以识别出数据集中比其他样本更可靠的样本（例如来自声誉良好的实验室的实验数据）？尝试从这些样本中学习，看看性能是否有所提高。但要小心——这种做法会引入偏差，因为你正在从数据集中认为最符合你要求的有利部分进行选择。\n\
  \n### 输入与输出之间的关联性差\n数据库可能包含有用信息，但你输入的特征与输出之间的关联可能很弱。\n\n### 数据不平衡\n数据集可能偏向于某一部分低质量样本。也许这些样本掩盖了其他特征值远小于它们的样本；考虑整个数据集是否能从缩放中获益，或者是否可以对单个样本进行加权。如果某一类样本很多，而其他类样本很少，考虑是否可以补充数据集，或者在不损失过多信息的情况下进行修剪以达到平衡。同样，请注意在移除或加权样本时引入偏差的危险。\n\
  \n### 5.2.14.3 损失函数在训练期间减小，测试误差也下降。我本以为测试误差的上升会指示何时停止训练，但这种上升从未出现\n\n**数据库的采样不当。**\
  \ 如何从数据集中抽取训练和测试样本？你已经知道这些样本必须随机抽取，但训练集和测试集的划分必须在训练开始之前完成，之后保持不变。如果你是随机选择一组训练样本，训练一个\
  \ `epoch`，然后用剩余样本进行测试，在下一个 `epoch` 中又抽取另一组随机样本进行训练，并使用测试后剩余的（新）样本，那么你实际上在使用整个数据集进行训练（参见图\
  \ 5.5）。当你使用网络之前见过的样本进行测试时，你可以预计测试性能会随着时间的持续提高，尽管这种提高并没有意义。\n\n![image](img/bk9781788017893-00109-f5.jpg)\n\
  \n图 5.5 随着 ANN 学习，损失函数（实线）和测试误差（点线）的变化。随着学习的进行，测试误差持续下降，尽管它本应该达到一个最小值然后开始上升（虚线）。\n\
  \n### 5.2.14.4 在 20 个 Epoch 中，测试集上的性能提升非常小，然后开始变差。这是否意味着我的网络仅通过 20 次遍历数据集就学会了它所需要的所有知识？\n\
  \n**网络问题。** 如果训练似乎在 20 个 `epochs` 内完成，请考虑以下情况：(i) 是的，学习已结束，但问题太简单了，你根本不需要 `ANN`；(ii)\
  \ 你太不耐烦了——问题可能很难，训练需要更多时间；(iii) 对于你拥有的样本量来说网络太大，导致网络正在学习单个样本（样本数量应该远大于连接权重的数量）；(iv)\
  \ 训练没有起作用。也许 `learning rate` 太高或太低。或者连接权重赋予的初始值太大，导致算法需要很长时间将这些值拉回到可以有效进行学习的范围。\n\
  \n**数据集问题。** 你用于训练和测试的样本可能涵盖了不同的关系集合，因此网络从训练集中学到的东西对于预测测试集的结果价值极小。检查你的数据集是否以某种方式进行了排序，而你没有从整个数据集中使用随机采样。\n\
  \n### 5.2.14.5 我认为我的网络过拟合了；我该怎么办？\n\n**考虑正则化。** 理想的网络封装了数据集中的所有规则，但不包含其他内容。网络越大，它越可能学习噪声和单个样本，因此缩小网络规模可能有所帮助。尝试在代价函数中添加正则化项^(41)\
  \ 以惩罚复杂度。使用对于完整描述数据集所需的最少数量描述符。如果你对样本运行了 `PCA` 并发现只有少数组件具有大特征值而其余的很小，那么你不应该使用大量的特征。\n\
  \n### 5.2.14.6 训练后，我将网络权重与同事使用相同数据集得到的权重进行了比较；它们完全不同。谁是对的？\n\n**参见第 5.2.8 。** 可能没有问题。如果你和你的同事被要求对方程\
  \ `a+b=16` 给出，她可能会建议 `a=5, b=11`，而你提供 `a=b=8`。你们都是正确的，因为——显而易见——存在无限多解。同样，`ANN`\
  \ 可以以无限方式在其权重中编码关系。你不应该期望两个网络的连接权重是相同的，即使它们的性能相似。\n\n## 5.3 结论\n\n科学数据的分析任何时候都具有挑战性，但结合\
  \ AI 方法的分析带来了一丝神秘色彩。`ANN` 中的连接权重是可以检查的，但我们从中汲取的理解是有限的。人们可以将其与拟合数据点直线等数学过程的简单性进行对比。\n\
  \n随着 `ML` 方法使用的扩大，这种解释性的缺乏将继续是一个关键问题。幸运的是，AI 算法正在进化。对能够提供某种解释的软件的需求已得到认可，更智能且更具解释能力的工具正在开发中^(42)。可以合理推测，将来我们的算法将不再局限于对数据集提供可靠但缺乏解释的分析，而是能够策划数据集、选择合适的\
  \ `ML` 方法、在无需用户输入的情况下为所有相关参数选择最优值，并在训练结束后，用我们能理解的语言解释它们发现的内容。\n\n在此期间，在我们等待完全可解释的\
  \ AI 之前，了解底层发生了什么以及在结果不佳时能够诊断问题至关重要。一点“机械共情”（Mechanical Sympathy）有助于确保你的算法有最大的机会生成意义模型。\n\
  \n此外，如果你对第 5.2.8 节问题的解答感兴趣，请查看框 5.6。\n\n## 框 5.6 框 5.4 中问题的答案\n\n在序列 A 中，数字是连续日历月份天数的第二数字，从\
  \ 8 月（31 天）和 9 月（30 天）开始，到 2 月（28 天，非闰年）结束。因此缺失的数字是 1，因为 3 月有 31 天。\n\n\n\n\nB 序列代表了一周内连续几日的字母数量（英语），从周日（6\
  \ 个字母）和周一（也是 6 个字母）开始。缺失的数字是 8，因为周六有 8 个字母。\n\n## 参考文献\n\n1. [`www.autosport.com/performance/feature/8318/how-mechanical-sympathy-improves-speed`](https://www.autosport.com/performance/feature/8318/how-mechanical-sympathy-improves-speed);\
