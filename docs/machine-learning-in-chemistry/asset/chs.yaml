  \ 和 `k[t]` 分别代表引发剂分解、引发、链增长以及歧均终止终止的速率常数。\n\n假设处于稳态且引发阶段没有消耗单体，可以得到以下方程：\n\n![image](img/bk9781788017893-00227-t4.jpg)\n\
  \n![image](img/bk9781788017893-00227-t5.jpg)\n\n![image](img/bk9781788017893-00227-t6.jpg)\n\
  \n![image](img/bk9781788017893-00227-t7.jpg)\n\n![image](img/bk9781788017893-00227-t8.jpg)\n\
  \n![image](img/bk9781788017893-00227-t9.jpg)\n\n![image](img/bk9781788017893-00227-t10.jpg)\n\
  \n![image](img/bk9781788017893-00227-t11.jpg)\n\n其中 `x` 是单体转化率；`λ[k]` 和 `μ[k]` 分别是自由基和死聚合物的矩；`ε`\
  \ 考虑到反应体积的变化；`M[0]` 代表 `t=0` 时的单体浓度，`f` 是引发剂的效率。体系由 (10.1)-(10.8)。\n\n均相自由基聚合的一个主要特征是随着反应的进行，反应质粘度显著增加。在这种情况下，观察到偏离正常动力学行为以及质量传递的变化。\n\
  \n对粘度增加最敏感的是终止步的速率常数 `k[t]`。粘度的增加导致自由基迁移性的剧减会导致 `k[t]` 值下降，从而引起反应的自加速（凝胶效应）。\n\n\
  通常，在低温下进行聚合时，在某一转化率下达到一个转变态，该时刻对应的温度称为玻璃化转变温度。速率常数 `k[p]` 在单体完全消耗之前下降。这就是聚合中的玻璃化效应，也是粘度增加的影响。\n\
  \n最后，在高转化率下，由于粘度的增加，引发剂的效率也会降低，表现为所谓的笼效应。\n\n因此，自由基聚合的一个特定问题是它是扩散控制的，这导致了凝胶效应、玻璃化效应和笼效应的出现。过程建模受到这些因素的影响，因为如图\
  \ 10.1 所示，上述用矩表述的数学模型无法还原实验数据。\n\n![image](img/bk9781788017893-00227-f1.jpg)\n\n\
  图 10.1 在 50、70 和 90 °C 下获得的 MMA 转化率矩曲线和实验数据。\n\n从称为临界转化率的某一转化值开始（对应于实验数据偏离图 10.1\
  \ 动力学曲线），由于转向扩散控制，反应质发生了重大的结构变化。为了获得真实的模型，我们需要一种能够在数学形式中捕捉这些变化的方法。考虑了增长和终止速率常数变化的（凝胶和玻璃化效应）的最广泛使用的模型由\
  \ Chiu 等人提出。\n\n![image](img/bk9781788017893-00227-t12.jpg)\n\n![image](img/bk9781788017893-00227-t13.jpg)\n\
  \n\n\n\n![image](img/bk9781788017893-00227-t14.jpg)(10.11)\n\n![image](img/bk9781788017893-00227-t15.jpg)(10.12)\n\
  \n![image](img/bk9781788017893-00227-t16.jpg)(10.13)\n\n![image](img/eqn10-14.jpg)(10.14)\n\
  \n其中 `k`[`t`0]和`k`[`p`0]是在无凝胶效应和玻璃化效应时的终止和增长速率常数；`A`、`B`、`C`[1]和`C`[2]代表增长和终止速率常数的扩散方程中的项；`I`[0]是时间\
  \ `t`=0 时的引发剂浓度；`θ`[`t`]和`θ`[`p`]是特征迁移时间；`θ`⁰[`t`]`、`θ`⁰[`p`]`是`θ`[`t]`和`θ`[`p`]的预指数因子；`ϕ`[`m`]是单体的体分数；`E`[`θt]`和`E`[`θp]`是`θ`[`t]`和`θ`[`p]`的活化能；`T`是开尔文温度；`T`[`gp]`是聚合物的玻璃化转变温度，`R`是通用气体常数。\n\
  \nCurteanu *等人*^(6) 提出了另一种凝胶和玻璃化效应模型。这些模型通过终止和增长速率常数与单体转化率之间的简单关系来表示，从而量化了它们随反应进行的变化：\n\
  \n![image](img/eqn10-15.jpg)(10.15)\n\n![image](img/eqn10-16.jpg)(10.16)\n\n其中`k`[`t`0]和`k`[`p`0]代表无凝胶效应和玻璃化效应时的终止和增长速率常数，而`A`、`B`、`C`和`D`（分别带有`t`和`p`索引的终止和增长）取决于时间（转化率）和反应条件（温度和反应物浓度）；这些通过实验数据确定。因此，与图\
  \ 10.1 相比，添加包含扩散控制效应的模型可以获得更好的结果（参见图 10.2）。\n\n![image](img/bk9781788017893-00227-f2.jpg)\n\
  \n图 10.2 MMA 聚合在不同温度下单体转化率随时间的变化。\n\n评估数学模型的主要标准是结果的准确性和处理的便利性。理想情况对应于通过数学关系对过程现象（支配过程的物理和化学规律）进行量化。然而，在许多扩散控制效应模型中，需要经验常数来匹配实验数据，或者这些模型完全是黑箱类型的。因此，将人工神经网络用于自由基聚合可以被视为一种有利的替代方案；它所具有的优势克服了所谓的经验性质的缺陷。第三种可能性是将两种模型（现象模型和经验模型）结合起来，将在本章稍后进行描述。\n\
  \n## 10.3 应用于聚合过程的神经网络\n\n鉴于第 1 节提到的聚合过程建模的困难性，人工神经网络（ANN）在聚合物工程领域的广泛应用中证明是非常实用的预测模型。它们能够在在不量化系统物理和化学规律的情况下，学习过程中发生的情况。因此，对于现象学理解有限的复杂非线性过程，它们是被推荐的建模工具。\n\
  \n应用于聚合过程建模的 ANN 操作意味着：从实验或通过机理模型仿真收集训练数据，根据神经网络的类型设置训练和验证数据集，确定网络的架构和参数（训练），最后当网络对未包含在训练集的数据产生结果时，评估神经模型的泛化能力。最后一步真正决定了模型的质量，即其泛化能力。\n\
  \nANN 中的输入变量选择取决于过程，可以基于工程师的经验和知识，也可以通过应用敏感性分析来根据重要性对参数进行排序。输出对应于追求的目标，并与输入变量相关。\n\
  \n神经模型的质量取决于建模可用的数据量、数据的代表性、其在研究空间内分布的均匀性以及用于开发神经模型的方法。最后这一考虑涉及根据建模对象的过程选择最佳模型类型，以及最有可能产生最优或近乎最优模型的训练方法。关于数据量，建议使用大量的数据样本，这比样本的数量对于所属领域具有相对均匀的覆盖更重要。对于复杂的、强非线性系统，需要更多的数据量，随之的是更长的训练时间。显然，实验数据的准确性是一个关键因素。\n\
  \n开发神经网络的拓扑结构是一个关键且有时困难的步骤，特别是在确定最优网络架构时。除了试错法，还测试了不同的技术，其中进化算法被证明是最有效的变体。\n\n关于聚合过程，可以解决诸如根据工作条件（时间、温度、反应物浓度等）估计反应特性（转化率、产量）、根据初始结构和反应条件预测最终性质、识别预定义结构或反应特性的最佳工作条件、识别产生预期最终性质的结构（分子设计）或确定影响最大的参数。专业文献中的许多文章涵盖了利用各种机器学习技术对聚合反应参数进行建模、优化、预测和控制。Noor\
  \ *等人*^(7) 展示了 ANN 在聚合反应中应用的许多重要问题，包括乙酸乙酯聚合、连续共聚过程、气相烯烃聚合、管式反应器中苯乙烯的连续自由基聚合、MMA\
  \ 的自由基聚合、间歇聚合以及尼龙-6,6 的聚合。Curteanu 的文章^(8) 第一部分是一个综述，也将神经网络与聚合过程联系起来。\n\n### 10.3.1\
  \ 聚合物反应工程中基于神经网络的应用类型\n\n在使用神经网络时，一些考虑因素包括神经网络的类型、它与不同应用和不同过程的关系、网络架构的确定，以及它们如何纳入不同的软计算配置中。\n\
  \n\n\n\n\n人工神经网络（ANNs）已被证明是直接和反向神经网络建模、监控（软传感器）以及控制程序的合适工具。除了这些应用外，还可以突出两类方法：1)\
  \ 确定过程性能（效率、产率*等*）或最终产物性质（化学、物理、机械、光学、表面性质*等*）如何依赖于反应条件；以及 2) 分析定量结构性质活性关系（QSPR/QSAR），试图将化合物的结构描述符与其物理化学性质及生物活性相关起来。\n\
  \n### 直接建模\n\n在直接建模中，在了一个或多个变量的输出值与显著影响输出的一系列输入变量之间建立相关性。例如，Chan 和 Nascimento^(10)\
  \ 使用前馈神经网络对高压管壳式反应器中的烯烃聚合进行了建模。最佳网络拓扑结构的选择基于关于均方误差与中间神经元数量之间关系的敏感性分析。\n\n### 反向建模与优化\n\
  \n对于化学反应器，优化涉及确定反应条件，以获得最终产品所需性质的适当值或实现过程的最大效率。反向神经建模可以响应第一种优化变体，尽管执行起来不容易，但与需要存在（确定）良好数学模型并选择优化技术的传统程序相比，它是一种可接受的替代方案.^(11)Fernandes\
  \ 和 Lona^(9) 设计了一种神经网络，用于确定流床反应器中气相乙烯聚合的运行条件（包括单体和共单体的进料、催化剂进料、表面气速和孔隙率），以获得共聚物的所需性质（分子量、多分散性、组成和产率）。另一个与反向神经建模合成聚丙酰胺基水凝胶相关的示例是，以简单且效果良好的方法确定初始反应条件，从而导致预设的反应产率和最大溶胀度.^(12)\n\
  \n### 软传感器与推断模型\n\n在化学工程的许多过程中，“难以测量”的变量根据它们之间的双向对应通过“易测量”的变量进行估计。解决此类问题的方案之一是使用神经网络表示的推断模型或软传感器。例如，Zhang\
  \ 及其同事^(13) 对进行 MMA 聚合的间歇反应器应用推断软传感器。聚物的分子量是根据反应器温度、夹套进口温度、夹套出口温度、单体转化率和冷却剂流量的在线测量估计的。Gonzaga\
  \ 等^(14) 描述了在聚对苯二甲酸酯（PET）生产过程中虚拟传感器的实现。该传感器基于 ANN，利用在线和冗余测量来估计 PET 的粘度。因此，设计了一种控制该工业过程的高效策略，通过神经网络克服了测量困难的缺点。\n\
  \n### 系统识别与控制器设计\n\n另一种应用类型是使用 ANN 进行系统识别和控制器设计，通过将神经模型纳入最优控制策略中实现。Wei 等^(15) 为丙烯聚合过程提出了一种最优控制策略，其整合了基于聚合物性质估计器的简化机理模型和基于熔融指数预测控制模型的前馈神经网络模型。Lifgtbody\
  \ 和 Irwin^(16) 展示了一种旨在改进聚合反应器控制的神经网络建模应用，强调了基于延迟测量的聚合物粘度精确控制问题。使用一个由前馈神经网络组成的非线性预测器来消除由测量延迟带来的限制。\n\
  \n### 10.3.2 聚合过程建模中使用的不同类型神经网络模型\n\n神经网络可以分为大类：*静态*网络（包括前馈神经网络）和*动态*网络（包括全局循环、局部循环、Elman\
  \ 和动态滤波网络）。静态神经网络适用于短期预测，且相对容易开发和训练，而动态网络推荐用于长期预测模型。\n\n前馈（多层感知器）神经网络经常用于化学过程建模，它们的通用逼近器特性在大多数情况下提供了非常好的结果。通常包含合理数量神经元的一个或两个隐藏层就足够了。但在某些情况下，其他类型的网络已被证明在化学工程建模中是有效的，超过了前馈网络的性能。在本节中将对此说明，并与前几节中主要涉及多层感知器的示例进行对比。\n\
  \nCurteanu 和 Petrila 报道了一种用于在半间歇和非等温条件下建模苯烯聚合的前馈网络.^(17) 该方法证明了 ANN 在复杂过程（特殊运行条件，半间歇和非等温）中的作用。在反应的某些阶段（取决于关键转化率）补充添加引发剂或单体有助于控制聚合物的分子量以及其性质。使用了简单的神经网络，即具有中间层的前馈类型，相同的模型适用于不同的运行条件；是通过使用模型的方式而非通过改变其结构来实现的。图\
  \ 10.3 显示了单体转化率对添加引发剂的依赖关系，而 图 10.4 显示了应用非等温程序后的聚合物分子量。\n\n![image](img/bk9781788017893-00227-f3.jpg)\n\
  \n图 10.3 使用前馈神经网络在凝胶效应前添加 5 molm^(⁻³) 引发剂后得到的单体转化率，`I[0]` =15 molm^(⁻³）（实线）；虚线 `I[0]=15`\
  \ molm^(⁻³) 和 划线 `I[0]=20` molm^(⁻³）。\n\n![image](img/bk9781788017893-00227-f4.jpg)\n\
  \n图 10.4 使用前馈神经网络在五阶升温（80, 90, 95, 100, 110 °C）下获得的多分散指数。\n\n循环神经网络的优点是它们提供长期预测，这对于化学工程中的许多过程非常有用。例如，在间歇过程中，目标是优化最终产品的质量（这是聚合过程的常见要求）。因此，在这种情况下，精确、可靠的长期预测至关重要。\n\
  \n\n\n\nTian 等同事^(18) 提出了一种用于乳液共聚反应器的循环神经网络模型，其关键参数为平均数分子量 `M`[`n`]`、共聚物组分 `C`、聚合物转化率\
  \ `X` 以及温度分布 `T`。动态建模假设这些量不仅出现在输出端，还通过之前时刻的值添加到输入端，因为这些先验值会影响最终结果。例如，用于建模 `M`[`n`]`的神经网络的输入为\
  \ `T` (t−1)、`T` (t−2)、`X` (t−1)、`X` (t−2) 和 `M`[`n`]` (t−1)，其中 `t` 代表时间。\n\nJordan-Elman\
  \ 神经网络是一种循环神经网络，它为多层感知器（MLP）提供了上下文单元，这些单元代表了能够记忆过去活动的处理元件。上下文单元为网络提供了从数据中提取时间信息的能力^(19)。一个示例是对包含聚物的聚丙烯胺凝胶合成和溶胀行为的建模^(20)。为了评估反应条件对产量和溶度的定量影响，使用了不同类型的神经网络，其中\
  \ Jordan-Elman 神经网络被证明效率最高。\n\nCurteanu 等同事^(21) 使用模块化神经网络预测聚（硅氧烷-亚甲基亚胺）的液晶晶性质，该预测基于一系列分子和结构描述符，包括完全伸展长度、结构单元直径和偶极矩。这种类型的神经网络并行使用多个\
  \ MLP 网络，并结合它们的结果。由于没有全连接的互连通性，因此权重数量较少，且由于 MLP 分段为模块的方式具有多样性，该结构受益于这种灵活性。所采用的方法提供了非常理想的结果，证明了神经网络在分类问题中的用处，特别是在量化结构-属性关系方面。\n\
  \n以在连续搅拌流反应器（CSTR）中进行的苯乙烯聚合作为案例研究，Haiyan *等人*^(22) 采用了一种用于建模和控制聚合物分子量分布的新方法。他们的技术基于正交多项式前馈神经网络（OPFNN）与循环神经网络（RNN）相结合，产生了作者所谓的“灰盒模型”。当聚合物的分子量分布难以用经典工具准确建模时，该方法可以获得满意的结果。另一个示例^(23)是将神经网络堆叠用于建模基于聚丙烯胺的多组分水凝胶的合成。产品的溶胀度和反应率与工况相关，工况包括单体量、引发剂、交联剂、包含聚物、时间和温度。堆叠模型的性能（见图\
  \ 10.5）与单个神经网络相比表现优。\n\n![image](img/bk9781788017893-00227-f5.jpg)\n\n图 10.5 用于聚酰胺-水凝胶合成建模的神经网络堆叠。\n\
  \n在现象学建模和人工神经网络（ANN）等黑箱技术之间进行选择时，应考虑几个因素。现象学建模的优点是它基于控制过程的物理化学定律，但在大多数情况下，其所包含的近似处理会导致结果不准确。另一方面，通过适当程序进行的经验建模可以提供精确的结果，但无法阐明过程的现象机理。这两类方法代表了可行的建模替代方案，其适用性取决于过程本身和所追求的目的。根据前面的讨论，包含简化的（近似的）现象学模型以及一个或多个神经网络（其的作用是纠正现象学模型的输出或对过程中难以建模的部分）的混合神经网络模型，其效用是显而易见的。这种混合建模提供了提取现象学和经验这两种方法最佳特征的可能性，从而获得精确的结果。\n\
  \n在聚合过程中，有许多难以建模的部分或变量：凝胶效应、笼效应、反应速率、动力学常数、流体流动行为、物理性质等。因此，这些过程是混合神经网络建模的理想候选对象，特别是对于在线基于模型的控制策略^(24)以下是一些示例。\n\
  \nTian 等同事^(1) 使用由简化的现象学模型（忽略凝胶效应）和循环神经网络堆叠（纠正机理模型的残差）组成的混合模型来处理 MMA 的间歇聚合。Nascimento\
  \ 等人^(25) 将类似的策略应用于双螺挤机中尼龙 6-6 聚缩的最后阶段。在混合模型中，关于最终氨基和羧基的信息来自机理模型；随后，使用神经网络模型这些结果计算相对粘度。另一个混合模型示例是为工业聚乙烯工艺设计的^(26)该示例中的机理模型部分用于预测反应器温度、转化率和聚合物分子量分布。对于后者这一评估聚合物末端性能至关重要的参数，基于基础物质和能量平衡的经典建模无法获得满意的结果。然而，添加到现象学模型的前馈神经网络经验部分，使得聚合物分子量分布的精确预测成为可能。Vega\
  \ 等人^(24)为生产聚苯乙烯的环管聚合反应器开发了一种混合神经网络模型。近似的机理模型与用于建模反应速率并额外纠正最终建模误差的神经网络相结合。\n\n\n\
  \n神经网络可以与其他机器学习工具结合，从而开发出性能更优的方法论，并在多种不同的应用中具有可能性：建模、优化或自动控制。最常用的组合包括 `ANNs` 与进化算法，或者神经网络与模糊系统。显然，可以结合的软计算技术数量不仅限于此两种。\n\
  \n例如，进化算法可以用于：1) 优化神经网络的架构和参数，2) 估计神经模型输入的最优参数集，或 3) 优化用神经网络建模的过程。\n\n对于第一种方案，一些研究人员认为，在确定神经网络的拓扑结构方面，进化方法比试错法、经验或统计法、模糊推理以及构造性或破坏性方法等技术更有效。\n\
  \n进化算法搜索染色体种群，其基因编码了神经网络的元素，寻找满足目标函数（称为`适应度函数`）的最佳（自适应的）个体。决定搜索进展的机制基于选择、重组和变异等遗传算子。此类问题被等同于多目标优化，其中解空间由神经网络的各种拓扑结构组成，算法将从中选出最优的一个。该过程是迭代的，每一步之后都会保留较优的解，在某些变体中，适应度最高的解会受到保护以防丢失。文献\
  \ [30] 详细介绍了应用于神经网络设计的神经演化技术。\n\n一个示例是含��的聚甲基硅氧烷/硅复合材料的荧光建模，该建模是基于 `ANNs` 方法执行的（单个或堆叠的聚合形式），并使用遗传算法（`GA`）设计的。`GA`\
  \ 在此处用于确定神经模型的拓扑结构被证明是一种高效且灵活的方法，能够以高概率获得近优的配置。\n\n差异分进化（`DE`）是另一种常用的进化算法，可以应用于典型前馈神经网络空间内的全局搜索。Curteanu\
  \ *等人.* 将 `DE` 应用于模拟苯乙烯自由基聚合的神经网络设计中。该算法提供的良好结果表明这种方法是高效的。\n\n另一个示例是一个由简化的现象模型和使用\
  \ `DE` 算法开发的神经网络组成的混合模型，它解决了苯乙烯的自由基聚合问题。这种方法值得注意的是两个子模型连接的不同方式。假设能够对单体转化和聚合物分子量产生准确预测的最佳变体是通过执行以下步骤完成的：1)\
  \ 对于每种变量组合，自动确定胶凝效应出现的时刻；2) 在此关键时刻之前，应用现象模型；3) 在此关键时刻之后，通过应用 `DE` 算法设计了最优神经模型。\n\
  \n不连续聚合过程的优化涉及与所提目标、决策变量、数学求解方法、包含在优化程序中的模型以及多目标优化的特定方面相关，其中目标函数被表述为标量或向量。开发数学模型的困难在之前的的节中已讨论过。传统优化方法的缺点是众为人知的：1)\
  \ 收敛到最优解取决于初始解的选择，因此无法保证；2) 大多数算法倾向于陷入次优解中；3) 算法的效率取决于所解决问题的特殊性。\n\n除了这些困难外，聚合过程通常涉及多目标优化，这反过来又带来了新问题。形成涉及多个目标加权组合的标量目标函数可以使用简单算法进行求解，但结果很大取决于权重值，并且存在丢失最优解的风险。使用表述为向量的目标函数具有优势，可以提供最优解的\
  \ `Pareto 集合`。\n\n由于这些优势，基于进化算法的技术正在取得进展。它们提供了一种克服上述困难的手段，这既是因为其运行原理的基础，也是因为它们在处理提高性能的不同变体或参数时的灵活性。\n\
  \n一种带有标量多目标的 `ANN+GA` 组合已应用于优化硅氧烷合成过程。在该方法中，神经模型评估了聚合物转化和分子量对反应条件的依赖关系：温度、时间、催化剂和助催化剂的量。优化的目标是最大转化率并获得指定的分子量。使用了简单的\
  \ `GA`，它在计算决策变量最优值的同时，还计算了标量结合两个目标的权重。\n\n一个类似的问题（但基于更复杂的机器学习变体）用于确定合成二甲基甲基烯基氧烷共聚物时的反应条件（温度、催化剂浓度、反应时间及初始组成），以实现转化率最大化并获得所需的分子量。主要参数随时间的变化通过前馈神经网络进行建模，随后该网络为\
  \ `GA` 构思的精英非排序遗传算法（`NSGA-II`）变体计算了 `适应度函数`。目标函数为向量形式，因此优化问题的结果由包含决策变量最优值的非支配 `Pareto\
  \ 前沿` 表示。\n\n神经-模糊混合系统结合了这两类技术的优点，即模糊系统的显式、易理解的知识，与神经网络通过学习获得的隐式知识。这类机器学习方法的一个示例是熔指数的在线监测，熔指数是决定丙烯聚合过程中所得产品质量的重要变量。该软传感器由两个变体组成：自适应模糊神经网络和与支持向量回归关联的自适应模糊神经网络（后者用于参数调优）。\n\
  \n聚丙烯熔指数预测的这一相同问题使用了另一种算法结合：神经网络、粒子群优化和模拟退火。建模使用 `RBF` 神经网络进行；其参数通过改进的粒子群优化变体进行优化并结合模拟退火，从而克服了这两种单独优化方法的缺点。\n\
  \n\n\n\nLeon 及其同事讨论了使用多种机器学习技术来预测主链含有液晶性基团的共聚物的液晶性性质，这取决于一系列分子和结构描述符。^(39)。对比了使用前馈神经网络和分类算法（如决策树、最近邻和贝叶斯归纳）的结果，这些算法在某些变体实现：`C4.5`\
  \ 剪枝、`C4.5` 未剪枝、`random tree`、`random forest`、`naive Bayes`、`nearest-neighbor`、`k-nearest-neighbor`\
  \ 以及非嵌套泛化范例。神经网络和 `k-nearest-neighbor` 方法提供了最佳结果。观察发现，方法的效率主要取决于决定液晶性性质的输入参数集的选择，这一点非常重要。\n\
  \n# 10.5 应用于甲基丙烯酸酯自由基聚合的机器学习技术\n\n在本节中，我们将说明不同机器学习技术在 MMA 建模和优化中的应用。此前，已经基于反应动力学方案和扩散控制效应的量化介绍了现象学建模。我们还强调了现象学建模的困难性，以及包含人工智能工具的方法论的优势。在目前提到的示例基础上，将增加一个更完整的示例，涉及对建模和优化的不同变体（不同的机器学习技术）进行比较和评分的过程，其明确目标是改进结果。\n\
  \n在对 MMA 直接和反向神经网络建模的讨论中，^(10)直接建模遵循单体转化率、聚合物分子量与反应料粘度随时间、单体浓度和温度变化的相关性。反向建模作为优化变体，提供了导致预定转化率和分子量值的反应条件。作为\
  \ ML 技术，使用了前馈神经网络，通过试错确定一个或两个隐藏层。网络具有一个或多个输出变量，被设计为转化率、分子量或粘度的独立模型，或者是一个具有三个输出的单一模型，前提是选择了对所有三个输出都有显著影响的输入变量。\n\
  \n一个有趣的示例在图 10.6 中给出，其中通过 `MLP` 神经模型 (3 : 9 : 3 : 1) 获得的单体转化率、现象学模型以及实验验证数据进行了比较。神经网络更好地捕捉了系统的行为。\n\
  \n![image](img/bk9781788017893-00227-f6.jpg)\n\n图 10.6 使用 `MLP` 神经模型 (3 : 9 : 3\
  \ : 1) 得到的 MMA 聚合中单体的转化率（连续线实线）、现象学模型（虚线）和实验验证数据（○）。\n\n表 10.1 展示了温度 `T` 和引发剂浓度\
  \ `I[0]` 的值，导致了预定的转化率 `x` 和数值平均聚合度 `DP[n]`，其结果通过两种优化方法获得：序列二次规划（`SQP`）和反向神经网络建模（`INN`）。这些过程的结果以完整动力学模型提供的\
  \ `T` 和 `I[0]` 为参考值。应该注意的是，`INN` 的值与参考值非常接近，因此该方法证明优于经典的优化变体。\n\n表 10.1 `SQP` 和\
