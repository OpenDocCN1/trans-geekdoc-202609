  \nYA ZHUO, ARIA MANSOURI TEHRANI AND JAKOAH BRGOCH\n\n休斯顿大学化学系，休斯顿，TX 77204，美国\n\
  *邮箱：jbrgoch@central.uh.edu*\n\n## 13.1 引言\n\n经验主义一直是推动科学进步的核心力量，让我们能够获得并产生关于周围世界的知识和理解。随着我们理解的增加，最终形成了许多以数值表达式形式存在的科学理论，能够描述或复制各种思想或“现实世界”观测，例如牛顿定律的建立。然而，科学的复杂性似乎呈指数级增长，简单的数学表达式并不总是能够解决许多现代问题。幸运的是，计算机的出现以及推动计算建模并最终走向数据科学的思想，改变了研究人员处理科学问题的方式。这种演变被很好地归类为四个范式，如图\
  \ 13.1 所示。[1] \n\n![image](img/bk9781788017893-00311-f1.jpg)\n\n图 13.1 科学的四种范式：经验、理论的、计算和数据驱动的。\n\
  \n化学的发展与其他所有科学分支一样，始于定性的经验观察以及化学直觉的发展，随后为了解释这些观测而构建了定量理论，例如热力学定律。最终源于这第二种范式的先进实验方法的创建和实施标志着一场重大革命，使得对观测结果有了更好的理解。无机固态化学是引入先进表征手段后加强的子领域之一。\n\
  \n解决复杂结构方法的产生产生了大量数据，其中大部分现在存储在数据库中。例如，`ICSD`、`PCD`、`MPDS`、`NIMS`、`MatNav` 和 `ASM\
  \ Phase Diagram` 包含了晶体结构和物理属性的信息。\n\n向第三种计算范式的转变是由计算能力的扩张推动的。随着时间的推移，开发了许多方法，从半经验方法到*ab\
  \ initio*（从头算）方法。密度泛函理论（`DFT`）作为从头算计算的子集，被认为是最广泛的方法。尽管它最早在 20 世纪 60 年代被提出，但由于计算能力的提高，其重要性在\
  \ 20 世纪 80 年代得到了认可。事实上，尽管仍然存在限制，`DFT` 在确定无机固体电子结构方面取得了巨大进步。例如，这些计算通常需要高性能计算集群，而这些并非总是可用。此外，`DFT`\
  \ 在计算无序晶体结构和高度关联系统方面存在困难，尽管 `DFT+U` 可以改进结果。`DFT` 通常只能容纳有限数量的原子，最多只有数百个，这阻止了研究人员在从头算水平上模拟较大尺度的相互作用（如微观结构）。尽管如此，计算能力的扩张允许\
  \ `DFT` 获取数千种无机固体的电子结构，并以高通量的格式实现。\n\n在 2011 年材料基因组计划（`MGI`）启动的支持下，这些高通量计算项目的输出被汇编在大型在线数据库中，提供了可访问、稳健且可信的计算（`DFT`）结果。一些最著名的例子是\
  \ `OQMD`、`MP` 和 `AFLOW`。\n\n\n\n\nMGI 可能不仅是创建这些大型高通量计算数据库的催化剂，还促进了向第四范范式的转变，在这一范式中，这些极其有用的数据库被直接用于研究。此类高质量数据的可用性迫使研究人员思考利用这些“大数据”的最优途径，而这得到了数据分析或信息学等子领域的加强，这些领域侧重于理解数据背后的原理、信息处理实践以及信息系统工程。从这些初步想法开始，数据科学和机器学习已成为分析数据集、识别化学趋势以及为材料化学的发展提供新机会的主要方法论。其目标是通过识别化合物的“成分-结构-性能-工艺”关系中此前未知的关联，以及揭示材料开发的新型定性和定量规则，来加速材料的发现。此外，先进的实验和计算技术凭借其不断增长的数据获取和存储能力，需要新的程序来快速评估和分析收集的大型数据集。机器学习技术和大数据方法也提供了一种途径，通过使用能够模拟材料属性与相关因素之间关系的算法（即使在高维数据中也是如此），来改进这些方法。数据科学还可以帮助破译材料的内在特征，并揭示关于导致成功产品条件的新假设，这些假设对于材料发现来说更具挑战性和关键性。^[17]\n\
  \n鉴于数据科学提供的潜力及其近期在无机材料化学中的流行，本章回顾了某些最近成功的策略，其中机器学习对于材料发现和设计至关重要。它还分析了该领域面临的挑战以及近期未来应该克服的挑战。预计本章可以为数据驱动的材料化学研究提供一个新的视角。在本章的其余部分中，我们首先介绍了与无机材料化学相关的机器学习的正式描述，包括讨论机器学习中常用的步骤，然后重点针对机器学习在无机材料发现中的应用调查了当前的研究现状。特别是，我们强调了使用各种机器学习策略实现的合成工艺优化、晶体结构预测和物理性能预测的显著案例。最后，探讨了该领域最紧迫的挑战和研究机会。\n\
  \n## 13.2 通过机器学习进行材料发现的工作流程\n\n计算机科学中的人工智能是机器展示出的智能，旨在模仿人类与人类智力相关的“认知”功能，例如“学习”和“解决问题”。人们已经尝试通过各种符号方法，以及基于连接原理的方法（如神经网络和感知器）来解决机器获取知识的问题。“机器学习”这一术语由\
  \ Arthur Samuel 在 1959 年创造，源于对人工智能作为一项科学事业的追求。它更强调逻辑和基于知识的方法，而不是符号方法。机器学习的目标是通过开发源自统计和概率理论的方法论和模型，来解决实际性质的可解决问题。受益于年来各种学习算法的发展，机器学习在聚类、分类、回归和其他相关任务中取得了卓越成功。将机器学习专门应用于无机材料化学的例子可以追溯到\
  \ 20 世纪 90 年代中期，当时神经网络等方法首次被预测二元金属化合物的熔点以及陶瓷基复合材料中纤维/基界面的机械行为。^[18–20] 随着材料特定数据库形式的数字化信息可用性的增加，以及以数字格式传输数据的能力，机器学习终于得以繁荣。结果是发表了大量关于性能预测、新材料发现和材料设计等各种主题的研究。\n\
  \n无论所研究的具体问题是什么，机器学习问题都可以分解为以下步骤：数据收集、数据表示、数据降维、模型构建和模型评估（见图 13.2）。在接下来的子节中，将详细解释每个步骤与无机材料化学机器学习相关的联系。\n\
  \n![image](img/bk9781788017893-00311-f2.jpg)\n\n图 13.2 通用机器学习工作流。\n\n### 13.2.1\
  \ 数据收集\n\n任何机器学习任务的首要前提是必须有大量的机器可读格式的数据，这些数据可以作为“训练集”。获取化学信息可能是科学家为了发展这一研究领域必须克服的最紧迫需求。幸运的是，如\
  \ `ICSD` 和 `PCD` 等大型晶体结构数据库、`MPDS` 和 `MatNavi` 等物理性能数据库，以及 `AFLOW`、`OQMD` 或 `Materials\
  \ Project` 等电子结构数据库，已经提供了对可行训练数据的访问。用户甚至可以通过开放的材料应用程序接口 (`API`) 和开源 Python 材料基因学\
  \ (`Pymatgen`) 材料分析包从这些大型数据集中高效提取信息。^[21,22] 此外，大量的科学知识存在于图表、表格和文本段落中。例如，实验笔记本包含可以作为输入数据集的重要信息。^[23]\
  \ 同经评审的出版也包含了大量信息，但这些数据很难使用传统的统计分析或机器学习方法进行分析。一些研究已经使用了监督自然语言处理 (`NLP`)，通过挖掘科学文献来提高对研究文章包含信息的访问。^[24–29]\
  \ 在一个特定的示例中，研究人员将发表文献中存在的材料科学知识编码为信息密集的词嵌入（词的向量表示），这可以在没有人工标记或监督的情况下捕捉周期律的底层结构和材料的结构性能关系。^[30]\
  \ 将所有必要的训练数据提取并聚集到一个位置是任何机器学习项目关键的第一步。\n\n### 13.2.2 数据表示\n\n\n\n\n一旦获得了一组训练数据，下一步是为这些信息创建计算机可以解释的数值表示，这些表示被称为特征、描述符、预测器或属性。在无机材料背景下，特征主要基于与性质相关的组分和晶体结构。前者捕捉了化合物的多种物理和化学性质。这些特征是根据化学式中存在的元素比例，或通过一系列描述各种元素属性的数学表达式建立的。例如，`Ward\
  \ et al.` 使用这种特征集准确地预测了多种性质，包括晶体材料的形成能、带带隙能量，以及金属合金系统中的成玻璃能力，取得了巨大的成功。尽管如此，仅使用成分特征无法描述形成多晶型晶体结构的化合物。例如，石墨和金刚石在机器学习中产生相同的成分特征；然而，它们的力学性能截然不同。那些在成分特征上具有不变性但在对应性质上存在巨大差异的系统是目前算法无法识别的。一种解决方案是引入结构特征或增强成分特征以区分石墨和金刚石。在结构描述符方面，与容易描述为图的分子系统不同，无机晶体结构的传统描述采用原胞平移向量和原子的分数坐标，因此可以通过选择不同的坐标系以无限种等效方式表示晶体。这种表示方法不是唯一的，因此不是学习过程的合适特征集。基于部分径向分布函数\
  \ (PRDF)、`Voronoi tessellations` 或经性质标记的材料片段的表示是解决结构问题的可行方法。目前，已经开发了多个广泛使用的材料信息学软件包，例如\
  \ `Pymatgen`、`Matminer` 和 `MatErials Graph Network (MEGNet)`，以便以最小精力生成特征。\n\n确保表示能够唯一地表征数据集中的每种材料，并与影响目标性质的核心物理化学相关是至关重要的。遗憾的是，还没有一个在整个无机材料化学中都有效的统一特征集。因此，在选择特征时必须小心。例如，晶体化合物的密度预计与组成元素的密度有关。通过将组成元素的平均密度作为描述符，机器学习算法可以识别该值与晶体密度之间的相关性，并建立预测模型。然而，组成元素的平均密度既不能唯一地描述组分，也不能完美地代表化合物的密度。因此，必须包含额外的描述符为该问题创建一个合适的特征集。然而，描述符的选择很少是简单的；例如，该问题中包含的一个可能特征可能是反映原子填充方案的晶体结构信息，但这从未明确。为了克服这一困境，大多数研究人员会创建一个极大的特征集，包含所有可能的特征，并使用数据降维技术来确定与所需预测相关的特定特征。检查最终的特征集，以确保简化后的集代表了实验或化学上合理的信息。以锂离子电导率的预测为例。虽然离子电导率预计受到多种内在和外因素的影响，但只有离子扩散率、平均体积、转变温度和实验温度具有实验价值。因此，有必要确保这些与实验相关的因素保留在学习过程中，而不是在特征选择期间被删除。\n\
  \n最后，一个典型的良好特征集应该是通用的，尽管在受限良好的化学空间内进行分析时这并非严格必要。在逆向设计的情况下，特征还需要能够反向转换材料描述，即将所需的目标属性作为输入来预测成分和结构。\n\
  \n### 13.2.3 数据预处理\n\n数据预处理通常需要数据科学家的大部分时间，是机器学习中最关键的步骤之一。分析未经过仔细预处理的数据可能会产生误导性结果。例如，如果数据集包含大量无关、冗余的信息或嘈杂且不可靠的信息，那么算法在训练步骤中获得的知识可能是可疑的。这个问题在材料化学中通常更为显著，因为数据集在大多数情况下并不是“大数据”，通常在几百到几千条之间。因此，在这样较小的数据集中，每条数据都可能对模型产生影响。数据预处理通常会影响模型的结果或解释结果的能力。因此，适当的预处理对于机器学习模型的准确性至关重要。通常，预处理任务包括数据清洗、转换和降维，如图\
  \ 13.3 所示。在接下来，我们将扩展讨论，同时介绍一些与无机材料化学相关的数据预处理某些步骤的最著名算法。\n\n![image](img/bk9781788017893-00311-f3.jpg)\n\
  \n图 13.3 数据预处理任务和一些常用方法。\n\n### 13.2.3.1 数据清洗\n\n机器学习中的大多数技术依赖于完整且无噪声的数据集。然而，真实的数据是不完整、有噪声且不一致的，这会使分析变得困难。科学数据中的这些缺陷通常是复杂问题的结果，如仪器局限性或数据采集时的技术问题，以及数据重复或人为错误等简单问题。因此，清洗步骤对于将原始信息转换为可靠的数据集至关重要。\n\
  \n缺失值的出现于获取过程中无处不在。缺失值是指由于不存在、采样过程缺陷、成本限制或获取过程局限性而未存储或收集的数据。不完整的数据通常是一个不可避免的问题，但它们往往会给研究人员带来巨大的困难，因为处理缺失值（特别是在材料科学中）通常是困难的。处理缺失值的不当会导致知识提取不足、强偏差和错误的结论。\n\
  \n\n\n\n处理缺失值带来的问题有许多方法。最简单的方法丢弃包含缺失值的实例。然而，这种方法仅在数据集非常大且一个元组中缺失多个值时才是有益的。否则，它可能会由于产生更小的数据集而在学习过程中产生偏差。关于数据插补的开创性工作源于统计学，并依赖于概率函数。例如，可以使用极大似然估计，即采用近似的概率模型来填充缺失值。也可以通过针对给定特征的完整数据集开发回归或分类模型来预测缺失值。\n\
  \n与数据集相关的另一个问题是由于数据采集故障或数据录入错误等来源产生的噪声。数据挖掘算法假设任何数据集都是底层分布的样本，且该分布没有干扰。在特定的机器学习问题中，噪声会对输入特征产生重大影响。当噪声影响输出目标或同时影响输入和输出时，情况会变得更加糟糕，因为这意味着引入的偏差将更加显著。为了消除数据中的噪声，通常有两种方法。第一种是使用数据抛光方法来纠正噪声，特别是当噪声影响到实例的标记时。即使是部分纠正噪声对模型也有益处；然而，这需要对数据集有了解，并且通常局限于纠正少量的噪声.^(41)\
  \ 第二种方法是使用噪声过滤器（例如逐变量的数据清洗）来检测并移除数据集中的噪声实例。使用噪声过滤器的优点是它们易于实现，且对数据集的知识要求最小。噪声的识别和消除仍然是活跃的研究领域.^(42,43)\n\
  \n### 13.2.3.2 数据转换\n\n将清洗后的数据转换为适用于学习过程的格式是下一步。为了数据兼容性，必须进行强制转换。例如，构建了一个分类器来区分金属和绝缘体。由于机器学习模型基于数学方程，如果直接将“金属”或“绝缘体”等类别字符串输入计算机，有时会产生问题。相反，这些内容在建模之前通常会被转换为机器可读的数值，*例如*将金属和绝缘体分别编码为整数“0”和“1”。特征通常也无法以数值形式存在，而是类别的；必须将这些特征转换为数值表示。\n\
  \n可选的质量转换也可以提高模型性能。数据集中的连续特征通常具有不同的尺度；例如，熔点涵盖的范围很广，从几度开尔文到数千开尔文不等。可以使用标准化器将此信息转换为一个尺度，其中`0`代表数据集的平均熔点，而`-1/+1`代表与平均值的一个标准差。通常情况下，学习算法从数据标准化中受益匪浅。如果数据集中存在离群值，则鲁棒缩放（Robust\
  \ scaling）或转换更为合适。如果单个特征不遵循标准分布（通常被认为是均值为 0、方差为 1 的高斯分布），许多流行的机器学习估计器可能会表现得不佳。例如，学习算法目标函数中使用的元素，如线性模型的`l1`和`l2`正则化项或支持向量机的`RBF`（径向基函数）核，假设所有特征都以零为中心，且方差处于同一数量。如果某个特征的方差比其他大几个数量级，它可能会主导目标函数，并使估计器无法从其他特征中充分学习。实践中，数据集转换的方法几乎是无限的。举例来说，基于对数的转换是一种常用的方法。\n\
  \n离散化是预处理步骤中有时需要的另一种操作。例如，在导出决策树和决策规则的过程中，如果包含过多的连续值，某组特征的重要性往往会被高估.^(44) 离散化将连续特征划分为离散值，是解决这一问题的有效方法。离散值比连续值更接近知识表示，使得数据更易于理解和使用，从而提高预测准确性。许多离散化方法已被提出并测试。特征二值化将数值特征转换为二值特征。分桶器将一组连续特征离散化为多个桶。通常，大多数离散化方法可以分为自上而下（划分）方法和自下而上（合并）方法.^(45)\
  \ 自上而下的方法从空切点列表开始，递归地将数据分成较小的区间。例如，Maas 等人根据误差函数检查候选切点，探索边界点的空间以减少分类问题中的错误数量.^(46)\
  \ 反之，自下而上的方法从所有连续值作为切点的完整列表开始，迭代合并相邻区间。一个例子是 Khiops，它基于卡方全局优化对数据进行离散化.^(47) 尽管开发了许多方法，但区间边界的选择以及数值范围离散化的正确粒度仍是未解决的问题。\n\
  \n### 13.2.3.3 数据压缩\n\n用于处理海量数据的技术。处理海量数据会使分析变得困难，导致准确性下降、效率低下和成本增加。执行数据压缩是有价值的，因为它可以通过减少误导数据来提高模型精度，节省存储空间并降低计算需求。适当数据压缩的关键挑战在于产生一个体积更小但保留原始数据集完整性的压缩表示。此外，数据压缩有助于简化模型。模型的复杂性随特征数量的增加而可能会导致过拟合，因为机器学习算法在大量特征上进行训练时，对数据的依赖性会越来越强。避免过拟合是执行数据压缩的主要动机之一，额外的好处是生成的模型通常更加简单。\n\
  \n\n\n\n\n通常使用几种方法来减少数据量。主成分分析（或 `PCA`）是一种统计学方法，它通过将高度相关的特征合并来减少特征数量，而不考虑这些特征含义的重要性。在每次迭代中，正交变换将特征转换为主成分，即是一组线性不相关的值。特征选择是另一种减少数据量的方法，通过识别并移除无关及冗余的特征来实现。简单的特征选择方法包括低方差滤波器（其目的是移除以低方差为特征的信息量较少的特征）以及高相关性滤波器（丢弃相关系数高于阈值的特征，这意味着其他特征携带了相似的信息）。与停止准则相关的算法也用于生成特征子集并评估所提子集的性能。停止准则可以是：(i)\
  \ 包含（或排除）任何特征都不会产生更好的子集；以及 (ii) 根据评估函数获得最优子集。如果没有适当的停止准则，选择过程可能会穷举运行或在子集空间中无限循环。遗传算法（`GA`）是一种著名的特征选择方法。它生成的特征子集仅由在包含于子集或排除在子集的竞争中“胜出”的特征组成。^(48,49)\
  \ 研究还表明，可以使用特定的学习算法作为预处理器来发现有用的特征子集。递归特征消除（`RFE`）是一种用于移除无关特征的启发式方法。首先，在原始特征上训练一个外部估算器，并为每个特征分配权重。然后，通过比较权重指示最不重要的特征，并递归地从后续集合中剪掉这些特征，直到达到所需的特征数量。\n\
  \n降维技术已在生成精简的特征表示以加速模型构建而变得流行。这些思想中的许多也已被材料化学家采用，用于建立工艺-结构-性能关系，并进行探索性数据分析以理解多变量空间中的趋势。^(50)\
  \ 例如，Dey *et al.* 使用 `PCA` 在预测钙钛矿化合物带隙能量的任务中识别导致离群值的特征。^(51) Agrawal *et al.* 采用基于排序的特征选择，以了解输入特征对于钢材疲劳强度预测问题的相对预测潜力。^(52)\n\
  \n### 13.2.4 模型构建\n\n一旦完成了适当的数据预处理，数据就可以用于建模。模型通过数学函数将指纹特征与目标属性连接起来。有许多算法可供选择，其中一些关联输入与输出的实际函数形式（例如支持向量机），而另一些则没有（例如决策树）。此外，输入数据量强烈决定了学习算法的选择。例如，几十到数千条数据可以使用`核岭回归`或`高斯过程`等算法进行充分分析，但对于更大型的数据集（>数十万或数百万），则可能需要`人工神经网络`或`深度学习`。在某些情况下，单一算法的效果可能很差，但在单一学习环境中构建多个估算器可能会提高模型的泛化和鲁棒性；这被称为集成方法，包括`bagging`和`boosting`等方法。此外，智能优化算法（如遗传算法（`GA`）和粒子群优化（`PSO`））有时被用于优化模型超参数。^(53,54)\
  \ 无论采用何种方法，最重要的区别之一是根据输出是否有标签，学习可以是监督的或无监督的。\n\n### 13.2.4.1 监督学习\n\n材料科学中大量的实际机器学习问题依赖于监督学习。它要求真值（或关于样本输出值应该是多少知识）是先验的。监督学习的目标是产生输入特征\
  \ `x` 到输出目标 `y` 的映射函数，以便模型在给定新输入 `x` 时能够预测输出 `y`。监督学习模型预测离散集合或连续集合内的输出值。前者见于分类问题，例如将材料分类为金属或绝缘体，而后者是回归模型的输出，例如预测材料的带隙能量。有多种监督学习算法可以根据特定任务的应用。在模型构建中，选择适当的算法至关重要，因为它极大地影响预测准确性和模型泛化能力。每种方法都有其独特特征，没有一种算法适用于所有场景。下概述了材料化学中一些常用的算法。\n\
  \n最近邻算法（`KNN`）是一种同时用于分类和回归的基于实例的算法。^(55) 它取决于这样一个假设：相似的事物彼此相邻，且描述符超空间中点之间的距离是可以计算的。然后，根据数据中\
  \ K 个“最近邻”的值来确定预测，其中 K 是用户指定的整数。在分类中，预测值是 K 个邻点区域内频率最高的标签，而在回归中，预测值被确定为 K 个邻点的平均值。\n\
  \n决策树（`DT`）是一种非参数算法，它创建一个树状流程图来支持每个决策步骤。^(56) 它能够处理分类和回归任务，尽管对于回归任务来说不太合适。模型通过根据属性值测试递归地划分源集合子集进行训练，直到节点处的子集成员都具有相同的目标值，或者分裂不再为预测增加价值。树的深度决定了决策规则的复杂性和拟合程度。值得注意的是，过度复杂的树无法良好地泛化数据。剪枝、设置节点所需的最小样本数或设置树的最大深度等机制，在某种程度上是避免这一问题的必要的。\n\
  \n\n\n\n内核方法是一类用于模式分析的算法，其最为人知的成员是支持向量机（SVM）、核岭回归（KRR）和高斯过程（GP）。^(57) 内核方法作为数据点之间的相似性函数发挥，*即*，它将两个输入数据点转换为一个能够量化它们相似性的输出。任何内核方法的解决方案都包含两个部分：执行特征映射的内核函数，以及用于发发现高维特征空间中模式的学习算法。一些流行的内核函数包括线性、多项式、sigmoid，而径向基函数（RBF）可能是最常用的之一，因为它在整个\
  \ `x` 轴上具有局部且有限的响应。内核方法具有模块化特征，因为任何内核函数都可以与任何基于内核的算法配合。\n\n人工神经网络（ANN）和深度神经网络（DNN）旨在模仿人类学习方式的计算系统。^(58,59)\
  \ 它们由排列在输入层、输出层以及（大多数情况下）隐藏层的人工神经元组成。在简单的计算中，隐藏层将输入信号转换为输出层可以使用的内容。神经元及其之间的连接通常具有权重，这表示信号的强度。学习是调整权重以尽可能准确地重现训练数据的过程。\n\
  \n### 13.2.4.2 无监督学习\n\n与监督学习不同，无监督学习没有标记输出，因此其目标是推断存在于数据集中的内在结构。无机材料化学中最常见的任务是聚类。聚类不是直接预测新值，而是根据相似性度量将数据分为组，从而揭示模式和类别。目前有多种算法可以自动对数据进行聚类，例如\
  \ `k`-means 聚类、Ward 层次聚类、高斯混合和基于密度的空间应用聚类（DBSCAN）。每种算法都根据几何度量对数据进行划分；例如，`k`-means\
  \ 方法旨在最小化数据与聚类中心之间的平方距离，而高斯混合则根据马哈拉比距离对数据进行分组。有时，在执行聚类分析之前需要定义取决于算法的额外参数，*例如*，聚类数量或距离阈值。迭代算法可能还需要多次不同的尝试以找到最佳分组。聚类分析的结果可以用于下游。使用这种方法的优点是，不同聚类中的材料可能会掩盖某些某些不显见的物理特性，因此可以为每个聚类构建一个单独的模型。通过这种方法，Meredig\
  \ 和 Wolverton 识别了掺杂氧化物的电子结构特征，并预测了氧化锆掺杂剂的稳定性。^(60)\n\n无监督学习在实验领域也变得流行，其中收集的数据被用作指纹。*et\
  \ al.* 开发了卷积神经网络来重构背散射图。^(61) 使用这种方法来识别相的存在也是可能的。^(62) 这对于发现新化合物至关重要。^(65) 将机器学习与此类研究相结合将推动该领域的发展。\n\
  \n### 13.2.5 模型评估\n\n原则上，模型的误差源于三个来源：模型偏差、模型方差和不可约误差，总误差是这三者的和。偏差来自学习者所做的错误假设。方差是对微小波动的敏感性的结果。不可约误差存在于每个模型中，即使是训练良好的模型也是如此，它们源于数据固有的变异或仅仅是离群值。性能不良的模型通常意味着高偏差或高方差。\n\
  \n一个健壮的机器学习模型不仅对现有数据，而且对未见数据也具有足够的预测能力。评估模型质量的一种被广泛方法是将原始数据划分为训练集和测试集。为了避免引入额外的偏差，可以使用采样方法来保持数据分布的一致性。模型性能可以通过评估测试集中输出被预测的准确程度来近似。\n\
  \n交叉验证（CV）作为模型评估的第二种方法，将原始数据划分为互斥的子集。例如，`k`-折交叉验证将数据集划分为 `k` 个相同大小的子集，取 `k-1` 个子集的并集来训练模型，而剩下的一个作为测试集。此过程对每个子集重复进行。一种特殊情况是\
  \ `k` 等于原始数据的数量，称为留一交叉验证（LOOCV）。LOOCV 是一种强大的交叉验证方法，可以确保模型的有效性；但它并不适用于大型数据集，因为交叉验证过程可能需要很长时间，而且它可能人为地低估高度相关数据的误差。最近，留一簇交叉验证（LOCOCV）被提出作为一种针对材料发现的新模型性能标准。^(66)\
  \ 与标准的 LOOCV 不同，LOCOCV 首先生成聚类，然后在交叉验证步骤移除整个聚类。这种方法通过估计模型外推到整类未见材料的能力，提供了一种更现实的评估。\n\
  \n## 13.3 机器学习在无机材料中的应用\n\n数据驱动工具的使用具有产生重大材料进展的潜力，无论是通过实验和计算数据的枚举与分析，还是通过化学直觉的编码。构建预测模型的目的不是为了取代实验和计算，而是为了集中这些研究领域的精力。在本节中，我们重点介绍一些应用此处讨论的许多机器学习技术的研究项目，以推进该领域的发展并降低理解无机材料成分-结构-性能-工艺关系的障碍。\n\
  \n### 13.3.1 合成优化中的机器学习\n\n\n\n\n确定制备无机材料的最优反应条件或工艺流程在历史上很大程度上依赖于启发式方法、理论分析和经验积累。因此，新材料的定向生产一直是材料实现过程中缓慢的一步。一种更有效的方法可能是在特定材料与实现该化合物所需的制备条件之间建立一种全面且易于获取的联系。鉴于合成过程中的极大复杂性，机器学习方法可能是统一合成路线中不同因素并建议最佳条件的最有利方法之一。这种方法在\
  \ Al–Zn–Mg–Cu 系合金的研究已被证明是成功的。Fang *等人.* 使用最小二乘支持向量机（`LSSVM`）模型优化了时火温度和时火时间，以获得具有高硬度和高电导率的目标产品，随后将非支配排序多目标遗传算法（`MOGA`）与\
  \ `LSSVM` 混合，在硬度和电导率之间进行权衡。^(67) Ling *等人.* 采用集成机器学习算法映射了铝合金和镍基超合金中机械性能（如拉伸屈服强度和剪切强度）与工艺步骤（如热处理和压力处理）之间的函数。^(68)\
  \ 神经网络在预测材料合成路线方面也显示出巨大的潜力。Kim *等人.* 开发了一个框架，通过自然语言处理汇编了五十万学术论文中的无机材料合成配方，并利用这些配方训练机器学习模型，以获得在高度自动化水平下合成特定技术相关材料所需的关键参数（如烧结温度）。^(69)\
  \ 在另一项研究中，对从实验室笔记本中收集的失败或未成功的水热合成（称为“暗反应”），使用机器学习模型进行分析，以确定模板化硒酸钒晶化的最优反应条件。^(23)\
  \ 他们的模型超越了人类的直觉策略，并以 89%的成功率成功预测了新的有机模板无机产品形成的合成条件。\n\n考虑到许多竞争因素同时控制着材料的制备，有时通过传统方法用数学表达式对复杂的动力学过程进行直接建模是非常复杂的。模糊神经网络（`FNN`）为处理合成过程中呈现精确不确定性提供了替代方案。它整合了神经网络的卓越学习能力与模糊推理，以提取模糊系统的初始规则。例如，Han\
  \ *等人.* 训练了一个`FNN`预测模型和一个多线性回归（`MLR`）模型进行比较，以建立热加工期间和热处理过程中的工艺参数与 Ti–10V–2Fe–3Al\
  \ 钛合金最终机械性能之间的关系。^(70) 可以根据模糊模型准确选择导致所需机械性能的最优工艺参数。`FNN`方法比`MLR`方法实现了更高的预测精度，并且与实验结果的一致性更好。\n\
  \n此外，将智能模型与模拟技术相结合在某些复杂系统中被证明是有效的。例如，神经模糊模型和基于物理的模型共同用于预测铝合金热机械处理过程中的流变应力和微观结构演变。^(71,72)\
  \ 混合模型中的基于物理组件有助于超越工艺条件的外推，从而与实验数据具有更好的一致性。\n\n### 13.3.2 结构预测中的机器学习\n\n预测晶体结构的倾向一直是人们关注的重点。晶结构决定了电子结构并极大影响其性质。因此，理解固体的成分-晶结构-性质关系是无机化学家的一项重大工作，强调了该课题的重要性。然而，在合成之前没有实用的方法可以预测给定成分的晶体结构。为了实现预先预测的目标，必须根据内在元素属性识别关联，而许多等许多也有影响。Pauling\
  \ 发现了一个简单但重要的关联，即根据阴阳离子半径比预测晶体的配位数。^(73) 随后出现了许多经验关联，为破译无机材料复杂的成分晶结构关系奠定了基础。近期，从头计算计算方法（如`DFT`）的出现，能够数值估计扩展化合物的基态能量，这对预先预测晶体结构产生了重大影响。显然，无法比较所有可能的晶体类型的`DFT`基态能量（即使排除出现新晶体类型的可能性）来指示能量上有利的结构。为了解决这个问题，已经开发了基于进化算法的方法，例如基于粒子群优化的晶结构分析（`CALYPSO`）^(74)\
  \ 和通用结构预测器：进化晶体学（`USPEX`）^(75)，旨在更快达到基态结构。然而，很难确保计算结构处于能量景观的全局最小值而非局部最小值。此外，这些方法的计算成本仍然极其昂贵，特别是对于`k`元（`k>`3`）化合物，这在许多情况下抵消了预先预测的意义。\n\
  \n研究人员还实施了一种结合数据挖掘与第一性原理计算的替代方法。构建了一个概率启发式框架来建议成分的候选结构，以预测金属二元体系的形成。^(76)\n\n\n\n\
  \n# 结构预测\n\n与保林（Pauling）等人为了揭示晶体结构与成分之间关联而创建的原始关联图分析[73,77–80]类似，数据驱动技术也被用于相同的目的。学习算法能够在大数据集中构建复杂的关联，这些关联可能存在人类无法实现的多维空间中。因此，利用这些工具来预测晶体结构是一个自然的转变。到目前为止，研究人员已经利用各种机器学习方法来预测晶体结构类型。例如，Oliynyk\
  \ *等人* 使用随机森林算法对 `AB[2]C` 组合形成赫斯勒结构（Heusler structure）的可能性进行建模[81]。聚类分辨率特征选择（`CR-FS`）结合支持向量分类（`SVC`）被用于预测\
  \ `AB` 和 `ABC` 化物的晶体结构[82,83]。此外，Balachandran *等人* 通过结合群论、机器学习和 `DFT` 计算实现了一个多维度框架来识别非对称材料[84]。此外，研究人员还利用机器学习辅助\
  \ X 射线衍射[85–87]。\n\n这些例子突显了机器学习在预测结构是否存在方面的成功。为了构建一个更通用的结构预测模型，研究人员已经实现了随机森林[88]。这一过程中的主要问题是训练数据不平衡；为了解决这一问题，使用了过采样方法[90]。最后，利用贝叶斯优化开发了一个结构预测引擎[91]。\n\
  \n一个研究项目构建了基于高斯近似势能的随机结构搜索工具，用于开发无机材料。该方法应用于元素磷，正确地预测了它的多型体[92]。\n\n## 材料属性预测\n\n\
  机器学习在预测无机材料物理属性方面的应用，涉及确定属性（通过计算建模或实验测得）与特征集之间的关系。已经开展了许多专门针对属性预测的研究项目。\n\n\n\n\n\
  以高通量进行计算对于最大化数据可用性至关重要，这使得数据收集过程变得高效得多。然而，从计算数据中学习的模型可能存在一些缺点。以带隙为例；高通量 `DFT` 计算可以在\
  \ `PBE` 交换相关泛函水平下获得大量的带隙值。然而，与实验值相比，这些计算显示出对带隙的系统性低估（约 40%）[10, 11]。此外，这些计算通常仅限于有序晶体结构，并且对于高度相关系统会丧失其可靠性[93]。因此，任何使用这些\
  \ `DFT` 数据构建的机器学习模型预期的带隙都会偏估。同时，对于位点混合化合物或高度相关化合物，预测的带隙准确性低于这些有序化合物。另一种，在仅包含实验测得带隙的训练集上进行机器学习，可以解决许多此类局限性[94]。所得模型不会受到\
  \ `DFT` 系统误差的影响，并且实验测得的带隙与预测带隙之间达到了良好的一致性。这种基于实验的模型的成功部分归功于实验数据的相对丰富（约 4000 个带隙），更重要的是特征的恰当选择。这些数据使模型能够捕捉带隙随特征变化的相对变化，最终实现对新化合物带隙的预测。遗憾的是，在大多数情况下，由于报告缺失或数据提取的技术限制等原因，收集大量的实验数据可能是一项艰巨的任务。\n\
  \n传统的机器学习过程对于小型数据集并不理想，因为数据的缺乏会防止模型充分捕捉属性与特征之间的内在关系，导致模型薄弱、预测存在显著的不确定性，从而在筛选过程中选择了非优的材料。幸运的是，一种被称为自适应设计或主动学习的自适应程序在数据稀缺的科学问题中显示出巨大的潜力。这种策略作为一个带有实验反馈的迭代循环在工作。它平衡了“利用”（目标是寻找最可能具有最佳性能的材料）与“探索”（目标是通过搜索采样点较少且不确定性更大的空间来提高模型质量）之间的权。自适应设计已成功应用于计算机科学[95]、工程优化[96]、癌症基因组学[97]以及最近的材料化学领域[98,\
  \ 99]。例如，Xue *et al.* 利用这种自适应设计框架，通过有限的 22 个训练用例发现了低热滞回的 NiTi 基形状记忆合金[99]。首先建立了一个嵌入\
  \ `RBF` 的 `SVR` 回归器，利用从自助引导法获得的不确定性来预测热滞后，然后使用基于知识梯度 (`KG`) 的选择器，利用这些预测值及其不确定性来建议下一个要研究的材料。通过九次迭代学习，从约\
  \ 800,000 种成分的潜在空间中合成并测试了 36 种预测成分，这 36 个新化合物中有 14 个化合物的热滞后低于初始数据集中 22 个化合物中的任何一个。\n\
  \n利用信息学技术预测材料属性也成为一个重要的研究焦点。除了对材料的物理属性（如形成能和熔点）建模外，机器学习还可以用于预测功能属性，例如电池材料的离子电导率或超导体的临界温度[39,\
  \ 100–102]。在预测超导临界温度 (`T*[c]`) 的示例中，识别出了超过 30 种候选材料[102]。学习过程分为两个阶段：首先，分类器将材料分为高\
  \ `T*[c]` 类 (`T*[c]>10K`) 或低 `T*[c]` 类 (`T*[c]<10K`)；然后，回归器对被归类为高 `T*[c]` 类的化合物预测\
  \ `T*[c]` 的值。然而，在许多内部或外部因素会极大影响目标功能属性的问题中，显式地预测功能并不是简单的操作。例如，在寻找新的本质硬材料和超硬材料时，由于报告有限，显式预测硬度受到限制。此外，硬度是依赖负载的属性，而负载并不总是被报告。硬度还与微结构有关，而微结构通常也是未。作为替代，Mansouri\
  \ Tehrani *et al.* 使用体积模量和剪切模量作为硬度的代理，这两种都是从高通量计算数据库中 easily 提取的内在属性[103]。在使用基于成分和结构特征组合的\
  \ `SVM` 构建模型后，预测了十万多个化合物的弹性模量，以筛选高体积模和剪切模化合物，这表明其具有高硬度。选出的顶级候选材料 `ReWC[0.8]` 和 `Mo[0.9]W[1.1]BC`\
  \ 被证明极其硬，在对这些系统进行实验检查后，它们在低压入负载下达到了超硬阈值。类似地，材料的德拜温度可以作为无机荧光体荧光量子产的代理[104]。对具有高预测德拜温度和足够带隙的化合物进行筛选，发现了一种高效的蓝发光磷粉。\n\
  \n## 13.4 挑战与机遇\n\n机器学习已经渗透到整个化学及其大多数子领域，包括无机材料。它影响了我们进行实验、分析数据的方式，甚至在改变我们的教学方法。利用数据驱动的方法推进材料研发（R&D）和制造的机会无疑是很多的；然而，许多挑战仍然存在。材料的发现基于从基础物理、化学和工程的角度来理解和解释多变量相关性。在接下来，确定了限制机器学习在材料化学中应用的一些通用困难，并讨论了解决每个问题的具前景的策略。\n\
  \n## 13.4.1 从小数据集学习\n\n\n\n\n\n或许，渴望使用数据科学的新手研究人员最常问的问题是，他们的问题是否适用于此类方法。无论具体问题是什么，机器学习的前提条件是存在可靠的数据，或者能够以统一且受控的方式生成至少部分关键信息的能力。然而，在材料化学中，我们通常受限于数百个或数千个（有时更少）高质量数据点。最大的阻碍之一是由于表征良好且可靠的材料数量相对较少，且缺乏对这些高质量数据的有效聚合。目前已有几种相当通用的数据基础设施，它们通常提供关于化合物的基础性知识，例如结构或基础物理化学性质，但这些数据库的访问成本可能非常昂贵。其中一些数据库也不允许批量下载数据。例如，无机晶体结构数据库（`ICSD`）是一个包含数万种化合物的晶体学数据权威集合，但要以批量方式下载这些数据并非易事。\n\
  \n通过数据挖掘技术扩展数据集是解决小数据集的一种途径，但对于某些科学问题，可能根本没有更多数据可用。在这些情况下，一种有前景的解决方案是通过修改学习过程。自适应设计（在\
  \ 13.3.3 节中也有提到）是一种显示出卓越能力的方法，其中知识通过迭代快速积累。^(105) 元学习对于处理有限数据集也有用，因为这种方法中的知识是在问题内部以及问题之间获得的。^(106)计算机科学的新进展，如神经图灵机（`NTM`），^(107)迁移学习，^(108)以及模仿学习^(109)使得这一过程成为可能。例如，贝叶斯程序学习（`BPL`）框架最近被证明性能优于近期的深度学习方法，并且在数据有限的单样本学习任务上达到了人类水平的准确率。^(110)这些模型的卓越性能如果应用到数据通常稀缺、极其昂贵且获取缓慢的材料化学领域，将提供令人兴奋的潜力。\n\
  \n### 13.4.2 生成高效的数据表示\n\n通常，输入数据的更合适表示会带来更好的模型，从而可以更准确地学习输入数据与输出数据之间的关系。核心研究工作正致力于开发用于编码复杂材料数据的高效特征。然而，无论是成分特征还是结构特征都强调了利用领域知识的重要性，这导致在驱动行为的物理机制尚未被理解的问题中，机器学习的使用受到了严重限制。一种解决方案是根据材料的原子身份学习其属性。Jha\
  \ *et al.* 设计了一个仅使用元素组成作为特征的深度神经网络模型，以自动学习不同元素之间的化学相互作用和相似性。^(111)这种方法完全依赖表示学习，而不使用任何关于材料的领域知识。\n\
  \n### 13.4.3 增强模型的可解释性\n\n尽管模型具有预测能力，但机器学习算法提取的知识通常难以解释。有几个原因可能导致这种缺陷。首先，知识的呈现方式不是科学家所熟悉的模式；例如，在分类任务中采用\
  \ `SVM` 模型时，用于区分每个类别的最优超平面通常位于多维空间中，复杂到无法可视化。第二个原因是科学家有时对算法产生的信息不确定，无法以任何理性直接的方式将输入与输出联系起来，这使得机器学习真正成为了一个“黑箱”。问题在于如何将“黑箱”变为“白箱”。迄为止，增强机器学习可解释性的研究主要集中在开发与现有黑箱并行运行的方法，以人类可理解的方式生成统计解释。^(112)这些方法从排序特征重要性到构建密切近似原始黑箱但使用更简单、易理解算法（如线性回归）的新模型。对机器学习模型的更好的理解可能会加速科学规律和原理的发现。^(113)\n\
  \n### 13.4.4 提高模型的可用性\n\n目前大多数数据信息学程序都需要用户的编程技能和数据科学知识来分析和管理数据。如果没有这些背景，研究人员可能会很快陷入术语、晦涩的参数或陌生的语法中。因此，数据驱动的材料化学只有具有相关计算机编程和数据科学经验的人才能接触。材料信息学的民主化至关重要。这样社区才能从大规模材料数据分析中受益。为了实现这一目标，需要为材料专家开发直观易用的软件，即使是那些从未接受过计算机科学和数据科学训练的人。此类工具现在已供材料社区广泛使用；例如用于材料属性机器学习预测的\
  \ `AFLOW-ML` 和 `MEGNet`，^(36,114) Materials Project 上的 Pourbaix 图生成器，^(115) Citrine\
  \ Informatics 的热电材料推荐引擎，^(116)以及许多其他。\n\n## 13.5 结语\n\n\n\n\n\n作为数据科学的一个分支和数据分析最强大的工具之一，机器学习在所有科学学科中都引起了前所未有的关注。报告的应用数量正以惊人的速度增长，材料化学也不例外。研究重点已从侧重于实验和计算向数据驱动的研究稳步转变，并保持了计算预测与实验验证之间的紧密协作。研究对象（特别是在无机材料化学领域）非常广泛，包括无机氧化物材料、电解质材料、金属材料、功能材料等多种材料。机器学习算法在开发这些材料中的功能涵盖了从优化合成条件到预测晶体结构和物理性质。使用先进机器学习策略的优势在于它们能够充分利用现有的海量数据（甚至是失败的数据），并加速材料研究进程。机器学习方法在解决回归、分类和聚类等问题方面展现了卓越的能力。最近，这些方法在材料设计和实验数据中也展现出了实用的性能。材料化学领域的应用将继续扩展，并可能带来更重大的进展。某一特定模型的应用通常限于一种材料和一种性质；因此，将不同的模型整合可以开发出一个统一框架，在平衡多个因素的基础上寻找最有前景的化合物。这可能有助于研究产生新型多功能材料。然而，数据科学的应用无论前景多么广阔，都将取决于开源获取渠道的改进、研究人员之间的数据共享，以及更先进的计算机技术（特别是处理小型数据集的能力）。毫无疑问，机器学习正在彻底改变化学，我们正处于无机材料发现的新时代。\n\
