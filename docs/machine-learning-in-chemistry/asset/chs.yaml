  \ 和 `KRR` 计算，如图图 4.8 所示。\n\n![image](img/bk9781788017893-00076-f8.jpg)\n\n图 4.8\
  \ 包含两个避越交叉的反应坐标上的势能曲线。一个避越交叉发生在 `S[2]` 和 `S[1]` 态之间，另一个发生在 `S[1]` 和 `S[0]` 态之间。势能曲线使用\
  \ `QC1` 方法（每个面板中的实线）计算，并与不同的 `ML` 模型（虚线和点线）进行比较。(A) `NN1` 和 `NN2` 表示使用略有不同的网络参数的逆距离矩阵进行预测，如适应采样中所执行的。(B)\
  \ `NN3` 给出了使用库仑矩阵作为描述符的 `NNs` 结果，(C) 使用 `poly.D.` 矩阵作为描述符。(E) 使用 `LR` 获得的曲线，(F)\
  \ `SVR` 和 `inv.D.` 矩阵，以及 (G) 使用 `FCHL` 表示的 `KRR`，后者将梯度视为导数，并提供了此处使用的最复杂的表示。34,50)\n\
  \n用于上述动力学的 `NNs`（带有 `inv.D.` 的 `NN1/NN2`）与具有先进描述符和不同类型回归器的额外 `NN` 模型进行了比较。面板 B 和\
  \ C 分别了了库仑矩阵 (`NN3`) 和 `poly.D.` 矩阵 (`NN4`) 作为表示的 `NN` 势能曲线。这些带来了同样准确的结果，并与面板 A\
  \ 中使用 `inv.D.` 描述符获得的结果相当。不同态之间的两个避越交叉点捕捉的程度不如该方法的其他势面准确，且与 `QC1` 方法相比，这些区域获得的能隙更大。\n\
  \n然而，`NN` 结果与基准模型 `LR` 结果的对比清楚表明 `NNs` 具有更高的预测精度。`LR` 完全无法重现 `S[2]` 态的形状，面板 E 中的\
  \ `SVR` 比具有相同描述符的 `NNs` 更准确。面板 F 中的 `KRR` 产生与 `NNs` 相当的结果。除了回归器不同，与 `inv.D.` 相比，`SVR`\
  \ 和 `KRR`(50,84) 表示也可用于 `KRR`。内核大小取决于数据点，因此更好的描述符可以带来更高的准确性。尽管如此，最准确的结果来自于 `NNs`。在那里，通过更好的描述符无法获得显著提高，因为\
  \ `NNs` 可以通过更深层的架构来补偿描述符的缺陷。\n\n如图 4.8 所示，`S[2]` 态的势能曲线在 `S[1]` 和 `S[0]` 态之间的避越交叉处显示出人为跳跃。量子化学势能这种错误的不连续性没有被\
  \ `ML` 模型重现。`ML` 模型在数据点之间提供平滑插值的能力能够修正此类错误。此外，面板 A 所示，使用 `inv.D.` 矩阵作为描述符的两个略不同的\
  \ `NNs` (`NN1` 和 `NN2`) 在此反应坐标上产生类似的势能曲线。这意味着当使用 `NN1` 和 `NN2` 进行适应采样时，在 `NN` 模型相对于参考值的较大误差区域不需要量子化学计算。通过对模式线性组合进行扫描并在包含\
  \ 770 个数据点的独立测试集上计算特定 `MAE`，也揭示了 `S[2]` 态误差较大的趋势（见表 4.2）。与获得的 `S[0]` 态的 `MAE` 相比，`S[2]`\
  \ 态的 `MAE` 在能量和梯度上增加了一倍。`S[1]` 态的 `MAE` 在能量上接近 `S[0]` 态的 `MAE`，在梯度上处于 `S[0]` 和 `S[2]`\
  \ 态的 `MAE` 之间。\n\n表 4.2 使用来自图 4.8 的 `NN1` 和 `NN2` 以 `inv.D.` 矩阵作为分子描述符，在包含 770 个数据点的测试集上单独计算每个电子态的\
  \ `MAE`。MAE 取自文献 50。\n\n| 态 || MAE 能量 \\[H\\] || MAE 梯度 \\[H/Bohr\\] |\n| --- |\
  \ --- | --- |\n| S[0] | 0.00176 | 0.00444 |\n| S[1] | 0.00200 | 0.00670 |\n| S[2]\
  \ | 0.00335 | 0.00893 |\n\n\n\n\n\n为了完整起见，各机器学习 ML 模型在包含 770 个数据点的相同测试集上针对能量、梯度和\
  \ NAC（非绝热耦合矩阵）得到的平均绝对误差（MAE）如表 4.3 中势能曲线假设的趋势相同，`SVR` 模型也呈现同样的趋势，其精度高于 `LR` 模型，但低于\
  \ `NN` 模型和 `KRR`。\n\n表 4.3 使用包含 770 个数据点的亚甲基铵阳离子测试集，计算了 `LR`、`SVR`、`KRR` 和 `NNs`\
  \ 在使用 `FCHL`、`inv.D.`、`poly.D.` 和 `Coulomb matrix` 作为分子描述符时，针对能量 `[H]`、梯度 `[H/Bohr]`\
  \ 和 NACs `[a.u.]`（在所有状态下平均值）的 MAE。大部分数值取自文献 50。\n\n| Model || MAE energy || MAE\
  \ gradients || MAE NACs |\n| --- | --- | --- | --- |\n| `NN/inv.D. (NN1/NN2)` ||\
  \ 0.00237 || 0.00669 || 0.328 |\n| `NN/Coulomb (NN3)` || 0.00238 || 0.00690 || 0.314\
  \ |\n| `NN/poly.D. (NN4)` || 0.00197 || 0.00617 || 0.335 |\n| `LR/inv.D.` || 0.09240\
  \ || 0.13902 || 0.471 |\n| `SVR/inv.D.` || 0.00618 || 0.01169 || 0.382 |\n| `KRR/FCHL`\
  \ || 0.00300 || 0.00866 || 0.351 |\n\n`KRR` 得到的 MAE 略大于 `NNs` 得到的误差，但比 `SVR` 和 `LR`\
  \ 小。这一趋势再次与图 4.8 中给出的势能曲线精度保持一致。\n\n对于所有属性，`LR` 基准模型产生的精度最低。使用 `inv.D. matrix` 作为描述符对于\
  \ `NNs` 是足够的，但在使用 `SVR` 时，它会导致能量、梯度和 NAC 产生更大的误差。事实上，能量的 MAE 是 `NNs` 的三倍，梯度的 MAE\
  \ 是 `NNs` 获得的 MAE 的两倍，NAC 的 MAE 也更大。当 `KRR` 结合 `FCHL` 表示时，可以获得相比 `SVR` 的显著改进。尽管如此，`KRR`\
  \ 仍略逊 `NNs`，这可能是因为 `NNs` 可以被视为*多态*模型，一个分子结构可以同时关联所有能级。相比之下，`KRR` 只能将一个分子构型与一个输出值关联。这使得\
  \ `NN` 模型拥有更多关于构型与其激发态性质之间关系的信息。\n\n## 4.4 结论与展望\n\n机器学习可以成功计算激发态能量、梯度和 NAC。有了这些属性，由于\
  \ ML 模型的计算成本低，并且在运行时至少使用两个 ML 模型来确保预测的准确性，可以实现比基于量子化学的动力学模拟长得多的时间尺度。此外，不仅可以进行长程动力学模拟，而且比量子化学方法通常情况下可以计算出更多的轨迹。因此，可以获得更好的统计结果，并分析稀有的反应通道。\n\
  \n为了在 ML 轨迹上保持能量，梯度应该从 ML PES（势能面）推导。结果是，ML PES 比通过量子化学得到的 PES 更平滑，且 PES 交叉点出现的不连续性永远无法被完全重现。这一缺点反而变成了一种优势，当由于所选底层\
  \ `ab initio` 方法的缺陷导致量子化学训练数据出现错误的能量跳变时，这些错误的不连续性会在平滑的 ML PES 中自动修正。\n\n通过比较不同的\
  \ ML 模型和分子表示，可以证明将 NAMD 中包含的所有能级处理在一个 ML 模型中是合理的。`NNs` 就是这样使用的，我们发现当直接使用时，`NN` 比\
  \ `LR`、`SVR` 或 `KRR` 得到的势能更准确，因为后者只能将分子输入关联到一个能级。通过使用更复杂的分子表示，`KRR` 的精度可以追上 `NNs`，而为\
  \ `NNs` 使用更好的表示则不会进一步提高。\n\n\n\n\n\n15. Z. Li, J. R. Kermode and A. De Vita, *Phys.\
