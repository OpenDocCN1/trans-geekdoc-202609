  \n[content]\n## 7.3 机器学习方法\n\n机器学习算法可以根据给定的任务分为许多类。本节将关注最流行的两种，即监督学习和无监督学习。在监督学习中，对输入-输出对之间的关系进行建模，以建立预测模型。输入数据可以用各种有效的描述符表示，范围从数值向量到分子图（见\
  \ 7.2.2 节）。监督学习模型处理输入数据并返回数值或二值作为输出数据。监督学习的关键方面是输出值是已知的，并可以作为示例引导学习过程。\n\n\n\n\n\
  约束 `yix[i]−b)≥1` 确保了两个超平面在分离数据的同时也最大化了它们之间的距离，这个距离通常被称为间隔（margin）。为了最大化间隔，两个超平面中的每一个都必须通过至少一个数据点。这些数据点被称为“支持向量”（support\
  \ vectors），这也是该模型的名称来源。SVM 通过最大化间隔来确定“最佳分离”数据的超平面。所得分类超平面的形式为 `w^(t*)x−b=0`，并恰好位于两个超平面的正中间。图\
  \ 7.2 阐释了这一点。如果一个新数据点 `x̂` 满足 `w^(t*)x̂−b≥0`，则分类为 1；如果 `w^(t*)x̂−b≤0`则分类为 -1。之前的描述是基于输入数据是线性可分的假设，但事实通常并非如此。为了考虑到这种情况，需要在\
  \ SVM 公式中引入松弛变量（slack variables）。这些变量通过在代价函数中添加惩罚，允许某些数据点位于最佳分离平面的错误侧，如公式 (7.2)所示。\n\
  \n![image](img/bk9781788017893-00169-t2.jpg)(7.2)\n\n![image](img/bk9781788017893-00169-f2.jpg)\n\
  \n图 7.2 一组线性可数据点的示例。图中还显示了分离它们的最优超平面。高亮点是支持向量。^(33)\n\n在这里，如果数据点 `x[i]` 位于平面的错误侧，则松弛变量\
  \ `ξ[i]` 大于零。代价函数中添加了为 ![inline](img/bk9781788017893-00169-t3.jpg) 的惩罚来解释这种情况。`C`\
  \ 是一个用户定义的参数，用于平衡分类错误的点数与最佳拟合超平面之间的关系。关于此点的深入探讨可以在 Bennett 和 Campbell 的文章中找到，文章还包含了对非线性决策面的扩展。^(34)此外，还可以使用许多其他算法进行分类，这些算法一直是许多综述的主题。^(35,36)\n\
  \n### 无监督学习\n\n无监督学习是一种仅提供输入数据的方法，其目标是在此寻找全局模式（描述整个数据集或分布的属性）。我们将其与数据挖掘区分开来，后者是一个相似的研究领域，但更关注数据中的局部（描述整个数据集子集）模式。在没有模式先验知识的情况下，该方法通过搜索和利用数据中的共性来识别这些模式。完成此任务的标准方法是将数据划分为“相似”数据点的集合，即簇。因此，聚类算法会创建多个簇，每个数据点被唯一地分配到与其最相似的簇。执行此类任务的一种简单而有效的算法是\
  \ `k`-means。^(37)最初，随机选择 `k` 个数据点作为聚类中心。每个簇由距离相应聚类中心最近的数据点子集形成。重新计算聚类中心为分配到簇簇点的平均值。所有不是聚类中心的数据点都被重新分配到它们最近的簇，这个过程不断重复，直到簇不再发生变化。虽然它可以用于分类和回归（参见\
  \ Erman, Arlitt and Mahanti^(38)），但识别聚类的过程主要用于更好地理解相关数据集。尽管 `k`-means 保证能将数据点聚类为\
  \ `k` 个簇，但从聚类中能否推断出有意义的内容取决于从业人员。\n\n另一种流行的无监督学习算法是主成分分析（PCA）。这是一种降维算法，将一组可能相关的变量减少为一组线性不相关的变量，称为主成分。每个主成分的计算方式使其尽可能地保留方差。第一主成分保留了最大的方差，所有后续成分在与之前的主成分正交的前提下保留了最大的方差。这产生了一组能够表示数据的变量；PCA\
  \ 通常被纳入数据可视化中。通过绘制前两个主成分，可以可视化原始数据集的低维表示。这是执行降维的传统算法之一。我们建议读者参考 Maaten, Postma,\
  \ Herik 的综述，以概述旨在克服传统 PCA 限性的最新方法。^(39)*k`-means 是简单的聚类方法之一，我们鼓励读者查看 Fung 的综述以获得对聚类方法的更全面的概述。^(40)\n\
  \n\n\n\n在选择好算法并构建模型后，下一个关注点是评估其性能如何。虽然性能可以通过许多有意义的方式来衡量，但一个关键问题是理解它的泛化能力如何。这就像学校教学生一个主题，然后通过相关的但未见过的问题对他们进行测试；我们使用一组数据来“教”模型，并并在相似但之前未见过的数据上对其进行测试。这使我们能够评估模型是否学到了任何有用的知识，并评估其学习程度如何。\n\
  \n在此类分析中，首先将数据集划分为训练集和测试集（通常按 70:30 划分）。仅使用训练集构建模型，并用其对测试集进行预测。这里的核心思想是，模型以前从未见过测试集，因此它正在利用从训练数据中学得的知识来做出预测。这种方法允许我们说明模型对未见数据点的泛化能力。然而，这可能不是对泛化能力的准确评估，因为它取决于哪些数据点属于训练集和测试集。\n\
  \n`K`-折交叉验证（`K`-Fold CV）是克服这一问题的程序。`K`-折交叉验证不是一次将数据集划分为训练集和测试集，而是执行 `K` 次划分。最初，它将数据集分为\
  \ `K` 个大小相近的集合（或折）。取第一折作为测试集，剩余的 `K`−1` 折作为训练集。模型在训练集上进行训练并在测试集上做出预测。使用每折轮流作为测试集来重复此过程（确保每个数据点都仅作为测试集出现一次）。图\
  \ 7.3 说明了这一点。对于每种训练/测试划分，都可以计算出一个评估模型预测值与实际值接近程度的评分，然后取平均值获得总体评分。关于 `K`-折交叉验证的更多细节，以及其他估计模型准确性和泛化能力的多种方法，可以在\
  \ Kohavi 的研究^(41) 中找到。\n\n尽管 `K`-折交叉验证是减少模型准确性高估的一种快速方法，但数据是随机划分为 `K` 组的。因此，如果数据存在分布偏移，可能会导致对模型性能产生不可靠的高估。如果训练集和测试集非常相似，机器学习模型可能会因为记住了训练集而表现出高准确性^(42,43)在合成路线设计的情况下（见第\
  \ 7.4 节），在构建训练集和测试集时需要格外小心。特别是应该注意，如果训练集和测试集中都存在高度相似的反应，可能会对算法实现的泛化能力做出过于乐观的估计。相反，如果测试集的反应与训练集中的反应太差异，你将尝试在超出合理预期算法学习范围的情况下进行预测。\n\
  \n![image](img/bk9781788017893-00169-f3.jpg)\n\n图 7.3 K 折交叉验证工作原理的示例。这里，`K`=5。\n\
  \n现在我们可以量化模型有多好了，值得考虑如何从一组模型中选出最佳模型。通常，我们应该只比较执行相同任务的模型*例如*两个回归模型。假设我们有两个不同回归模型的\
  \ `K`-折交叉验证结果。选择最佳模型的下一步是使用统计检验来确定性能的差异是否完全由随机性引起。其中一种检验方法是 `t`-检验，其零假设为“均值差等于零”。该检验可用于评估两个数据集均值之间的差异在统计学上是否显著，我们可以轻松地将其应用于我们两个\
  \ `K`-折交叉验证程序的结果中。执行此类测试允许我们接受或拒绝零假设。由于 `α` 定义为当零假设确实成立时拒绝它的概率，因此测试指示拒绝零假设意味着我们有（1−`α`）×100%\
  \ 的确定性认为均值差为零。将 alpha 取设为 0.05，另一种表述方式是：观察到这两个 `K`-折交叉验证结果及其差异由于随机性产生的概率为 0.05。这是一个重要的点，因为如果我们比较三个模型，情况就会发生，这将涉及三个独立的假设检验。假设我们对每个测试的置信度为\
  \ `α`，则其中一个差异由于随机性产生的概率现在为 1−(1−0.05)³=0.1426，约为三倍。为了考虑到这一点，我们使用费龙尼校正（Bonferroni\
  \ Correction），该方法指出在测试 `N` 个假设时，我们每个测试的置信度必须等于![inline](img/bk9781788017893-00169-t4.jpg)。这是适用于多假设检验的许多修正方法之一，参见\
  \ Goeman 和 Solari 的论文^(44)以及 Demšar 的文章^(45) 对机器学习相关的统计测试进行深入探讨。\n\n## 7.4 合成路线设计\n\
  \n设计合成路线分为两类相反的过程。第一类正向反应规划需要反应物前体的先验知识来预测可能的产物。逆合成是第二类，从目标分子反向推，预测可能的断裂以获得更简单的反应物前体。这一步骤递归进行，直到达到市售的前体为止。目标分子的整体合成路线是一系列反应步骤。单步逆合成设计比正向反应预测复杂得多，因为没有唯一的正确答案。这是由于输出（反应物）中存在的官能团在输入（产物）中缺失。在图\
  \ 7.4a](#BK9781788017893-00169.xhtml#fig4)所示的示例 Buchwald-Hartwig 反应中，卤化物离去基团不在产物中。对于单键断裂，多种前体和不同的反应物类型可能是可能的。例如，图\
  \ 7.4 所示目标分子中的 C–N 键可以通过与各种卤物的 Buchwald-Hartwig 反应或 Chan-Lam 反应合成。如果不定义反应类型，多个键可能会被断裂，特别是在较大的分子中。在反应预测中，所有相关的官能团都存在输入（反应物）中。与逆合成相比，这显著减少了可能发生的反应类型数量，从而减少了可能的输出数量。\n\
  \n![image](img/bk9781788017893-00169-f4.jpg)\n\n图 7.4 正向合成规划 (a) 和逆合成路线设计 (b) 和\
  \ (c) 的示例。\n\n\n\n\n\n合成路线设计最显著的方法是使用预定义的启发式规则来编码反应。启发式规则在此语境下也称为反应模板（reaction templates），它们定义了从反应物到产物（或`vice\
  \ versa`）的单一化学转化。基础反应模板包含涉及化学键形成/断裂的原子和键（反应中心），以及任何可能影响反应的相邻原子。由于数据可用性和不一致性，可能不包含额外信息。更复杂的模板可以包含反应条件、活性冲突、保护基需求以及立体选择性和区域选择性。\n\
  \n在多步逆合成分析中，目标是找到最少数量的反应模板，将其应用于目标分子，以达到商业市售的反应物前体。在定义反应模板时，泛化性和特异性之间存在不可避免的权衡。如果模板过于通用，模型将无法感知到任何潜在的活性冲突，并可能导致使用不当。相反，过于具体的模板会导致其对未见分子的泛化能力较差。\n\
  \n### 反应模板生成的演变\n\n反应模板使用用户友好的语法编写，通常专门针对开发者。早期的程序手动手工编码反应模板。这种方法面临三个主要问题：\n1. 需要具有多年经验的专家合成家来编码每种反应。\n\
  2. 这种劳动密集型任务无法扩展到大量的化学体系，结果往往是得到覆盖有限反应类范围的不完整模板库。\n3. 由于活性冲突以及对反应条件的依赖，反应的复杂性并不直接，因此难以编码。\n\
  \n尽管存在这些局限，商业程序 `Synthia`（前身为 `Chematica`）已经证明，只要投入足够的时间，手工编码的反应可以成功用于逆合成预测任务。更高效且更耗时的模板定义方法是从文献中自动提取反应数据。只要数据集中的反应经过原子映射（atom\
  \ mapped），就可以识别出反应中心。可以使用 `Reaction Decoder Tool` (`RDT`）等工具来计算未知的原子映射索引。还开发了一个工具包，用于在定义反应模板时处理立体化学信息。\n\
  \n维护自动提取的模板库要容易得多，而且它们已应用于反应预测。\n\n### 基于模板的方法论\n\n当代的基于模板的方法由两个部分组成：预定义库和评分函数。这些组件可以通过两种不同的方式组合：\n\
  - 第一种是穷举应用所有可能的模板以获得反应物，然后对候选者进行排序。\n- 第二种是对候选者进行排序，仅对输入应用最相关的模板。\n\n`ANNs` 已被应用于候选者排序和模板排序。\n\
  \n### 基于模板方法的局限性\n\n虽然基于模板和基于相似性的方法易于解释（因为它们符合合成化学家的思维方式），但它们有几个局限性：\n 持 持续维护模板库非常耗时，并且在引入新化学体系时可能具有挑战性。\n\
  - 从数据集中自动提取模板严重依赖于原子映射反应，而这些反应并不总是完整或正确的。\n- 常用的原子映射工具基于预定义的专家规则。\n- 反应模板只关注反应中心的局部环境，因此可能会忽略全局环境中的重要基团。\n\
  - 基于模板的方法无法在其模板库之外做出准确预测，因此无法发现新的化学体系\n\n### 无模板方法\n\n基于模板方法的替代方案是无模板方法。这些方法完全由数据驱动，并端到端训练，无需构建预定义的反应启发式规则。因此，无模板方法可以以极小的计算成本扩展到大型数据集，并推广到新的化学体系。\n\
  \n迄目前，无模板模型要么基于图的，要么基于序列的。基于图的模型遵循与基于模板相同的两步程序，即识别反应中心以生成反应物前体或产物（取决于任务）。通过这种方法生成的预测易于解释，因为该方法类似于合成化学家的做法。通过在分子图描述符上的卷积神经网络识别反应中心，以生成产物候选。基于图的模型仅关注反应预测而不关注逆合成。\n\
  \n\n\n\n\n基于序列的模型与上述方法采取了不同的方法。在这里，问题可以被视为一种机器翻译任务，将一种语言（*例如*英语）输入模型，模型将文本翻译成另一种语言（*例如*西班牙语）。当将其应用于反应预测和逆向合成时，分子可以用文本符号表示，例如\
  \ SMILES 字符串（见第 7.2.2 节）。在反应预测中，反应物的 SMILES 字符串被翻译为产物的 SMILES 字符串，逆向合成则*反反之*。序列到序列模型具有由两个循环神经网络和一个额外的注意力机制构成的编码器-解码器架构。在这一类模型中，SMILES\
  \ 字符串中的每个 token 都被认为与其邻居相关，因此会影响邻居 token 的性质。对于每个 SMILES token，这些模型只会学习局部周围的 token，而不会学习序列中较远的\
  \ token。基于 Transformer 的架构已应用于机器翻译任务。这些模型与序列到序列模型不同，因为它们不包含循环神经网络。它们具有完全基于注意力的编码器-解码器架构。由于缺少了循环组件，模型能够关联\
  \ SMILES 字符串中的单个 token，无论其位置如何。与序列到序列模型不同，Transformer 模型能够捕捉 token 之间的长程相互作用。Transformer\
  \ 模型在正向反应预测和单步逆向合成中均取得了成功。基于序列的模型相比两步基于图的模型具有一些优势。它们不需要原子映射、原子特征或任何化学知识。分子的全局环境也隐含地整合到了模型中。基于序列的方法主要缺点是\
  \ SMILES 无效。模型没有直接学习 SMILES 符号的术语，因此无法保证它们能预测出有效的 SMILES。在讨论的所有无模板方法中，注意力机制使得模型具有可解释性。原子的注意力权重（*即*\
  \ SMILES token）可用于识别输入物种的哪些方面影响了输出物种。\n\n合成路线设计模型的性能是准确性、可靠性和适应性之间的平衡。模型准确性可以计算为测试集预测的百分比，其中真实值在给定目标的最预测分子中排名前前-*n*\
  \ 百比。例如，前-1 准确率是正确分子排名前前 1% 的预测百分比。模型应该能够估计其预测的可靠性。置信得分的计算应实现在模型评估中，以识别模型何时可能失败。了解模型的适应性非常重要。一个模型可能有高准确率评分，但它能跨化学空间进行泛化吗？例如，如果在专利数据上进行训练，它能准确预测\
  \ ELN 中涵盖不同化学空间分子的合成路线吗？这些是评估合成路线设计模型时考虑的重要点。\n\n### 7.4.1 逆向合成\n\n#### 7.4.1.1\
  \ 单步逆向合成\n\n基于模板和无模板的模型组合已用于单步逆向合成任务。将目标分子输入模型，模型随后断开一个键并生成可能的反应前驱体。从美国专利中提取的包含\
  \ 50,000 个反应的基准数据集在此被称为 `USPTO_50K`（见第 7.2.1 节），用于训练和测试单步逆向合成预测工具（见[表 7.2]）。Liu\
  \ 等建立了一个基于模板的模型作为基准模型。由反应中心、邻居原子和反应类组成的反应模板从训练数据中自动提取。对于每个目标分子，应用相同反应类中的所有模板来生成反应候选物，并随后对其进行排序。之前描述的基于相似性的方法（另一种基于模板的方法）在每个反应类中均优于基准模型以及\
  \ Liu 等人开发的无模板序列到序列模型。基于相似性的模型不仅关注寻找主要产物，而是对所有可能性进行排序。因此，在预知反应类的情况下，它具有最高的前-5% 准确率，达到\
  \ 81.2%。这种方法限于知识库范围之外，并且总是不利于创造性的断键。\n\n表 7.2 `Baseline` 和 `Similarity` 基于模板的模型以及\
  \ `Seq2seq`、`Transformer – Lin et al.`、`SCROP`、`MT` 和 `Transformer – Karpov et al.*`\
  \ 无模板模型的前-n 准确率。\n\n| 数据 | 模型 | 前-*n* 准确率 (%), *n*= |\n| --- | --- | --- |\n| 1\
  \ || 3 | 5 |\n| 有反应类 | Baseline | 35.4 | 52.3 | 59.1 |\n| Seq2seq | 37.4 | 52.4\
  \ | 57.0 |\n| Similarity | 52.9 | 73.8 | **81.2** |\n| Transformer – Lin et al.\
  \ | 54.6 | **74.8** | 80.2 |\n| SCROP | **59.0** | **74.8** | 78.1 |\n| 无反应类 | Similarity\
  \ | 37.3 | 54.7 | 63.3 |\n| Transformer – Lin et al. | 43.1 | **64.6** | **71.8**\
  \ |\n| SCROP | 43.7 | 60.0 | 65.2 |\n| MT | **43.8** | 60.5 | — |\n| Transformer\
  \ – Karpov et al.* | 42.7 | 63.9 | 69.8 |\n\n\n\n\n\n基于序列且无模板的模型（`Transformer` –\
  \ `Lin *et al.*`、`SCROP`、`MT` 和 `Transformer` – `Karpov *et al.*`）采用了 transformer\
  \ 架构，可以克服这些局限性，即使在反应类型未知的情况下也显示出先进水平（参见表 7.2）。如前所述，这些方法的缺点是会预测出无效的 SMILES。标准的 transformer\
  \ 架构并不学习 SMILES 记法的语法。因此，预测的 SMILES 字符串在语法上可能是无效的，但语法正确的版本可能才是真实值。自纠正逆合成预测器（`SCROP`）相比其他\
  \ transformer 模型多了一个额外组件。一旦预测出反应物 SMILES，就会使用基于 transformer 的语法预测器在 SMILES 字符串不符合语法时对其自动修正。语法预测器的加入降低了\
  \ SMILES 无效率（参见表 7.3），对于前 5% 的 SMILES 字符串，该率保持在 2.0% 以下。`SCROP` 模型的 SMILES 无效率也低于\
  \ `Seq2seq` 和 `Transformer` – `Lin *et al.*` 模型。分子 Transformer（`MT`）模型未报告用于比较的 SMILES\
  \ 无效率。当反应类型已知时，`SCROP` 模型实现了 59.0%的最高 top-1 准确率。\n\n### 表 7.3 `Seq2seq`、`Transformer`\
  \ – `Lin *et al.*`、`SCROP` 的 top-n SMILES 无效率\n\n| 模型 | Top-n SMILES 无效率 (%) |\n\
  | :--- | --- | --- |\n| `Seq2seq` | 12.2 | 15.3 |\n| `Transformer` – `Lin *et al.*`\
  \ | 2.1 | 3.5 |\n| `SCROP` | 1.1 | 9.6 |\n| `MT` | 0.7 | 1.4 |\n| `SCROP` | 1.5\
  \ | 18 |\n\n所有模型均在没有先验反应类型知识的情况下进行训练。移除反应类型会导致 top-1 准确率下降 11%。\n\n### 7.4.2 多步逆合成\n\
  \nCASD 软件的目标不仅是预测目标分子的反应物，还要递归地分解直到获得可用原料。这种多步逆合成任务可以被认为是一棵合成树。合成树将有一个分支因子——可以采取的步骤数——以及深度——直到路径终止所需的步骤数。如果前体可以市售或达到了预设的深度限制，则终止。对于逆合成而言，分支因子通常很大而深度很小。合成路线的数量随着步骤的增加而剧增。CASD\
  \ 工具需要智能算法来识别最有前景的分支，并避免详尽计算。遗憾的是，每一步都选择最佳反应可能不会导致最高效的路径。这种成本与原料的价格、步骤数、产生的废物、绿色程度、产品纯化的难易程度、可持续性以及安全危害有关。市售的\
  \ CASD 程序包括 `InfoChem` 的 `ICSYNTH`、`Wiley` 的 `ChemPlanner™`（原 `ARChem Designer`，现已集成到\
  \ `CAS` 的 `SciFinder` 中）以及 `Synthia™`（原 `Chematica`，`Merck KGaA` 的商标）。这些程序基于反应模板。`Synthia™`\
  \ 包含一个含有*约* 60000 个反应模板的库，由资深合成化学家手工编码。除了反应转化外，模板还编码了可能的不兼容基团、保护基团和反应条件。`ICSYNTH`\
  \ 和 `ChemPlanner™` 从反应数据库中自动提取由反应中心和相邻原子/基团组成的模板。`ICSYNTH` 还提供了从内部数据生成模板库的软件，这些库可以独立使用，也可以与提供的库一起使用。基于用户定义标准的评分函数评估每个合成步骤，并引导至市售底物。`Synthia™`\
  \ 和 `ICSYNTH` 过滤预测结果以消除任何不需要的结构。`Synthia™` 中定义了额外的启发式算法，以惩罚非选择性反应、应力中间体和可能的结构单元。在\
  \ `ICSYNTH` 中，预测的结构与预定义的不可接受结构列表进行比较。`ChemPlanner™` 使用类似的方法过滤官能团不兼容性。`Synthia™`\
  \ 和 `ChemPlanner™` 考虑了区域化学和效应。`Synthia™` 还能处理立体化学和位阻效应。每个程序生成的合成树都带有支持文献引用和原料成本。\n\
  \n\n\nSegler 和 Waller 发布了他们的神经符号模型，该模型由三个神经网络（扩展策略、范围过滤器和展开阶段）组成，并结合蒙特卡洛树搜索（MCTS）来指导多步逆合成搜索。反应模板是从\
  \ Reaxys 数据库中 2015 年之前发布的 1240 万条反应中提取的。扩展策略和范围过滤器共同称为扩展程序，它基于包含 301,671 个含有反应中心的反应模板的知识库。扩展程序被应用于每个目标分子，以预测单步反应的原料前体。在这里，目标分子用指纹表示并输入到扩展策略中，以对反应模板进行优先级排序。将前\
  \ `k` 个模板应用于目标分子以生成反应物候选物。范围过滤器将反应分类为可行或不可行，以过滤掉所有不可行的反应。展开策略基于 17,134 种反应模板（包含反应中心和相邻原子），计算树位置值。扩展程序和展开策略整合到\
  \ MCTS 算法中，形成了 3N-MCTS 模型。根据双盲 AB 测试，该模型为类药化合物生成的预测路径与文献路线无法区分。虽然 3N-MCTS 模型可以考虑立体化学，但它在路径生成过程中不考虑反应条件的预测。\n\
  \n### 7.4.2 反应预测\n\n无论由化学家还是机器预测的逆合成路线，都不保证在实验上是可行的。为了验证这些路线，一种方法是在实验上测试所有可能性，这需要经验丰富的化学家、大量的时间和高成本。另一种验证技术是正向反应预测。在这里，原料、试剂以及可能的反应条件是知的，目标是预测可能的产物。在模型中包含反应条件是非常重要的，因为溶剂或温度的微小变化会导致产率的巨大变化或形成不同的主产物。量子化学计算可用于识别主产物，但计算开销巨大且仅限于较小的分子。机器学习和人工智能可以以较低的计算成本应用于大型系统。\n\
  \n反应预测的基准数据集是 `USPTO_MIT` 数据集（第 7.1 节），由 `ca.* 480K reactions` 组成。反应预测的先进技术是无模板模型（见[表\
  \ 7.4]）。基于图的 Weisfeiler-Lehman 差异网络 (`WLDN`) 模型性能优于序列到序列 (`S2S`) 模型，top-1 准确率提升了\
  \ 5.3%。`WLDN` 模型使用 `Weisfeiler-Lehman Network`（一种图卷积网络）从由原料、试剂和溶剂种类组成的原料池中识别反应中心。然后，另一个图卷积网络\
  \ (`WLDN`) 对通过有针对性枚举生成的候选产物进行排序。基于序列的 Transformer 模型 `Molecular Transformer (MT)`\
  \ 在 top-1 准确率上比基于图的模型 (`WLDN`) 高出 4.8%。所报道的准确率是针对 `USPTO_MIT` 数据集的，该数据集在模型训练和测试之前已经过预处理，用以区分原料和试剂。消除这种区分会导致模型准确率降低，`WLDN`\
  \ 模型下降 5.6%，`MT` 模型下降 1.8%。\n\n表 7.4 `S2S`、`WLDN` 和 `MT` 无模板模型的 top-n 准确率。\n\n|\
  \ 训练集 | 测试集 | 模型 | Top-n 准确率 (%) |\n| :--- | :--- | :--- | :--- |\n| 1 | 2 | 3 |\
  \ |\n| USPTO | USPTO | `S2S` | 80.3 | 86.2 |\n| | | `WLDN` | 85.6 | 92.8 |\n| |\
  \ | `MT` | 90.4 | 94.6 |\n| USPTO | PF-ELN | `WLDN` | 50.4 | 52.2 |\n| | | `MT`\
  \ | 69.0 | 80.3 |\n| PF-ELN | PF-ELN | `MT` | 97.0 | 98.5 |\n\n为了评估 `MT` 模型的适应性，`MT`\
  \ 和 `WLDN` 模型在 `USPTO_MIT` 数据上进行训练，并在 ELN 内的反应数据上进行测试。这两个数据集涵盖了化学空间的不同区域，确保了消除报告模型准确率中的控制偏差。在预测其训练化学空间之外的分子时，`MT`\
  \ 模型预测正确分子的 top-1 概率为 69.0%（见表 7.4）。基于 Transformer 的架构目前是反应预测和单步逆合成中性能最高的模型类型。\n\
  \n### 7.4.3 优化反应条件\n\n识别反应条件需要合成化学家的专家知识和经验。反应可以在多种反应条件下进行，但最常选择的条件是那些在相似反应中证明成功的条件。基于相似性的选择可能是不够的，因为反应结果受到多种反应参数的影响。因此，预测反应条件具有挑战性，特别是反应参数的微小变化可能会导致完全不同的反应结果或反应失败。化学家需要找到一组作用的催化剂、试剂、溶剂、温度和压力组合。来自\
  \ `CASD` 程序和反应预测方法的预测只有在同样预测了相应的反应条件时，才能在实验上进行验证。因此，将条件预测整合到此类工具中至关重要。\n\n反应条件的预测是一个尚未充分探索的领域，主要集中在单一反应条件或单一反应类的优化上。一种二分类模型已用于预测迈克尔加成中使用的催化剂和溶剂类型。基于相似性的方法被用于催化氢化反应（一种脱保护反应）的催化剂鉴定。最大的关注点在于催化剂的预测和优化。催化剂很重要，因为它们可以提高反应速率，并在不对称催化中实现对立体构体的选择性。预测不对称催化剂选择性的努力有望改变催化剂的设计，当有利于某种立体构体时。\n\
  \n希望反应条件预测工具能够预测所有的反应条件。已经建立了一个神经网络，用于预测一系列化学反应的催化剂、溶剂、试剂和温度，这可以大规模应用。机器学习与自动化合成测试模块的结合是反应条件优化的未来。计算机辅助合成规划和机器人流化学平台已用于执行小分预测合成路线。这向全自动合成化学进了一步。\n\
  \n\n\nCASD 程序（见第 7.4.1.2 节）预测分子的多步合成路径，可能具有较高的验证分数，但在没有证据支持其真实价值之前，化学家将继续保持谨慎。目前为止，这些应用主要集中在类药物靶点和生物活性分子上。\n\
  \nInfoChem 与阿斯康（AstraZeneca）合作评估了 `ICSYNTH`（见第 7.4.1.2 节）作为想法生成器的性能。评估了该程序预测阿斯康商业用药物项目或文献中存在的药物目标路线的能力。将预测的路径与文献、头脑风暴提议以及从事该项目的化学家的内部经验进行了比较。在预先头脑风暴提议的情况下，`ICSYNTH`\
  \ 重新发现了已知的化学反应，返回了头脑风暴建议并提供了新的未报道的合成路线。由于其无偏见的性质，它还识别出一种非常规的转化，为问题提供了非直觉的解决方案。`ICSYNTH`\
  \ 能够产生想法来补充合成化学家。\n\n在一个案例研究中，对 `ChemPlanner™`（见第 7.4.1.2 节）提出的合成路线进行了实验验证。将通往药物相关靶点的合成路线与化学家开发的路线进行了比较。`ChemPlanner™`\
  \ 识别出了几乎所有由化学家设计的路线，尽管由于程序内部评分函数的影响，并非所有路线都被识别为最佳路线。它还建议了步骤更少、成本更低的替代路线。因此，`ChemPlanner™`\
  \ 可以帮助合成化学家设计合成路线，节省他们的时间和资金。\n\n`Synthia™`（见第 7.4.1.2 节）利用网络理论、高功率计算、人工智能和专家化学知识来设计逆合成路径。它可以为与药物和工业相关的靶点设计新型合成路线。该程序发现了选定的八种商业生物活性物质和天然产物的合成路线。选择这些产物是因为之前的合成尝试产率低、不可扩展或失败了。对预测的路径进行了实验评估。`Synthia™`\
  \ 设计的路线提高了产率并节省了金钱和时间。它还为一个没有已知合成路线的目标之一设计了成功的路径。`Synthia™` 的扩展功能使用户避开专利路线。在设计新分子的路径时，不违反现有的专利路线是非常重要的。一种键保持方法可以识别对专利至关重要的键，并防止它们在逆合成中断裂。为了验证这种方法，`Synthia™`\
  \ 对三种商业药物苄唑（linezolid）、西格列汀（sitagliptin）和 panobinostat 评估。生成了带有和不带专利约束的预测路径。在没有约束的情况下，`Synthia™`\
  \ 建议了与专利相似的路线。然而，通过选择不应打破的键，程序可以绕过它们并识别出替代路线。\n\n## 7.6 结论\n\n在制药行业中，从早期候选药物到临床前试验是以最快且最具成本效益的方式进行的。合成化学促进了药物的发现和开发。药物化学是药物发现的重要部分，其目标是设计和合成新型小分子候选药物，以测试药物化学假设。对于单一生物靶点，会小规模合成先导化合物的许多类似物进行筛选，以确定结构-活性关系。药物化学家需要可靠的合成路线来快速提供测试材料。因此，药物化学家在设计新分子的路线时，倾向于使用稳健的反应。在\
  \ CASD 程序中使用人工智能和机器学习消除了预测中的这种个人偏见，因此可以拓宽药物化学家的工具箱。\n\n工艺化学是药物开发的关键，通过它扩大活性药物成分的规模并优化反应。工艺化学家通常针对单一靶点分子工作，而不是许多类似物。目标分子的合成路线经过优化以满足\
  \ `SELECT`（安全、环境、法律、经济、控制和吞吐量）标准。分子的合成可及性是影响药物化学中选择合成哪些化合物的若干标准之一，也是工艺化学中的一个重要概念。在进行实验反应之前，了解化合物是否可合成是理想的。最接近已知的方法是具有高信度地预测合成路径。CASD\
  \ 程序可以帮助药物和工艺化学家加速合成规划时间、减少路径中的步骤数、降低成本并建议替代非常规路径。\n\n对于合成化学家来说，将 CASD 整合到日常工作中具有明显的优势。然而，糟糕的模型可解释性引起了合成化学家的怀疑。结果是这些工具的实施非常有限。所谓的“黑箱”工具除非能通过文献证明，最好是通过实验证明，否则将不会被接受。与合成化学家的早期和深度参与将促进\
  \ CASD 更快速的发展，并获得社区更广泛的接受和采用。\n\n为了实现 CASD 的进步，还有其他需要解决的问题。反应数据和代码共享处于列表的首位。需要包含反例的开源大型数据集来训练算法达到最佳性能。反应数据需要是高质量且可重复的，且不包含预测性示例。目前呼吁开放共享机器可读数据并定义出版标准以实现这一点。开放共享将允许对不同方法进行公平的基准测试。需要建立评估模型泛化能力的严谨验证方法，以确保报告的结果不具有误导性。\n\
  \nCASD 程序旨在协助合成化学家进行设计路径的决策。它们并不是为了取代合成化学家；化学直觉仍然是需要的。机器人与 CASD 的结合是自动化反应优化的未来。此类单元将提高合成实验室的生产力，但不会取代实验台化学家。\n\
