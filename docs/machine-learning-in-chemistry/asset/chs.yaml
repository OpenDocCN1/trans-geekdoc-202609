  \ 访问于 2019 年 12 月。\n\n# 第 6 章\n## 未来状态预测：面向国防应用的 AI 化学创新\nTYLER STUKENBROEKER 和\
  \ JONATHAN CLAUSEN\nStrategic Analysis, Inc., 弗吉尼亚州阿灵林顿\n\n## 6.1 引言\n\n美国国防部（`DoD`）在多个方面都是化学独特的消费者。首先，作为\
  \ 290 万士兵、文员和预备役人员的雇主，它对药物、粘粘剂、燃料、涂料和其他化学产品有着无与伦比的需求。其次，许多这些产品是在正常供应链之外使用的，无论是在阿富汗的前线作战基地，还是在太平洋的航空母舰上。最后，某些产品的使用场景可能是动态且非传统的。任务可能需要现场对产品进行定制，以满足战斗员的需求。例如，某种药物可能需要在不使用冷藏的情况下生产，或者可能需要一种能够有效掩盖特定环境的遮蔽剂。\n\
  \n\n\n\n\n传统的化学发现和制造能力依赖于人工规划，这需要专业的知识和培训。为了使用不断扩大的反应、试剂和方法工具箱进行化学合成，需要经过高度训练的化学家或工程师。这在许多军事环境和局势中是不可行的，因为需求可能在短时间内产生，可能出现在基础设施匮乏的偏远地区，或者在缺乏专家人员的情况下。当需要新型化学品时，这些限制变得更加严格——以至于用于防御的新化合物开发仅在少数实验室中进行，这些发现可能需要几年或几十年才能交付战斗员。自动化化学规划和发现的能力将对国防部（DoD）执行任务的能力产生巨大影响。\n\
  \n国防高级研究计划局（DARPA）对国家安全的突破性技术投入了关键投资^(1)。催生了如 GPS、自动驾驶汽车、夜视仪以及互联网等突破性的国防和民用技术。DARPA\
  \ 意识到，需要类似的、导致这些突破的大规模协作努力来解决化学自动化问题，并于 2015 年启动了 Make-It 程序，旨在实现任何分子的自动化合成^(2)。该计划来源于\
  \ DARPA 的战场医学计划，^(3)，该计划建立了一个连续流化学系统，用于按需生产 15 种不同的活性药物成分（API）分子。Make-It 试图将其推向极端：硬件可以自动配置，以执行任何在实验室或化工厂可以完成的有机合成路线。然而，显而易见，这仅代表了挑战的一部分——更艰巨的是开发能够为有机分子合成设计出最佳路线和条件的人工智能（AI）算法。^(4)\
  \ Make-It 揭示了将 AI 应用于领域的挑战。2019 年启动的一项新 DARPA 计划——加速分子发现（AMD），^(5)试图通过将 AI 模型与实验系统集成以实现自主分子设计来解决这个问题。其他美国机构，如美国标准与技术研究院（NIST）、国立卫生研究院（NIH）和国家实验室，也认可了将\
  \ AI 社区专家与材料^(6)和治疗发现^(7)专家相结合的潜力，表明尽管目前处于前沿，但此类合作可能很快变成常态。\n\n本章将讨论计算机辅助合成规划（第\
  \ 6.1 节）、获取和处理用于机器学习的化学数据的挑战（第 6.2 节）、这些挑战的潜在解决方案（第 6.3 节）以及它们与研究工作流的集成（第 6.4 节）。本文并非旨在全面的综述，而是通过近期研究的视角对新兴的挑战和机遇（特别是国防部的）进行调查。*本文中表达的观点和意见仅代表作者，不代表\
  \ DARPA、国防部或美国政府的政策或立场*。\n\n## 6.2 合成搜索引擎：自动化合成规划\n\n在本节中，我们讨论了在该领域其他发现和演示背景下利用机器学习（ML）的算法。首先，介绍了由\
  \ ML 驱动的已知反应优化（见第 6.2.1 节）。其余部分涉及新化合物的合成，从单反应开始（见第 6.2.2 节），然后是完整的逆合成分析（见第 6.2.3\
  \ 节）。\n\n### 6.2.1 优化已知路线\n\n化学实验室进行的大多数实验并不是新反应。研究人员通常是重复文献或实验室笔记本中的反应，目的是合成一种化合物供进一步使用。因此，主要关注的问题不是将形成什么产物，而是生成产物的效率有多高。有很多条件可以被改变：例如时间、温度和溶剂等。化学家可以使用启发式方法和过去的经验来猜测最佳值，但参数的数量使得优化过程更适用于统计算法。事实上，实验设计（DoE）方法已被证明可以使用如分支与拟合的稳定噪声优化（SNOBFIT）等算法，以最少次数的实验找到最佳条件^(8)\n\
  \n2017 年，Zhou *et al.* 证明了一种用于 DoE 优化的 ML 方法。^(9) 使用循环神经网络设计了一个强化学习系统，以优化几种反应的浓度和温度（见\
  \ 方案 6.1）。该系统优于非 ML 算法，识别最佳条件所需的步骤减少了 71%。通过将该系统与液滴筛选平台结合，可以在测试的四种反应在大约 30 分钟内确定最佳反应条件（见\
  \ 方案 6.1）。我们预计看到 ML 算法将继续集成到反应优化系统中，例如学术^(10,11)和制药实验室。^(12,13)\n\n![image](img/0136-s1.jpg)\n\
  \n**方案 6.1** Zhou *et al.* 研究的反应^(9) 转录自文献 9, [`doi.org/10.1021/acscentsci.7b0492`](https://doi.org/10.1021/acscentsci.7b0492)，经美国化学学会许可，版权所有\
  \ 2017。\n\n鉴于 ML 在电源管理，^(14)制造，^(15)物流，^(16)和电信，^(17)等领域优化的长期历史，这类算法能够帮助科学家优化反应并不意外。然而，筛选溶剂或催化剂等非离散变量需要集成更专业的化学知识。Ahneman\
  \ *et al.* 通过采用随机森林预测多种钯催化剂在交叉偶反应中的产率，证明了这种方法的可行性^(18)\n\n\n\n\n\nAhneman 的工作强调了机器学习（ML）与反应筛选相结合的价值。然而，这种结合最大的影响可能在于超越对单一系统的研究。对于单个实验室而言，为了制备少量化合物来改进次优的（*例如*，低产率、差\
  \ E 因子、具有危险性）反应可能并不划算。通过这种方式，现有的路线或原始方案的引用在文献中流传，导致次优路线被反复使用。但只要在从事不同化学合成领域的实验室中分布着这些工具中的几个，就可以确定改进后的条件并在整个领域内传播，从而在时间、能量和材料上实现巨大的累计节省。例如，考虑\
  \ 2-碘氧苯酸 (IBX)，这是一种常用的氧化试剂，由 Hartmann 和 Meyer 于 1893 年首次制备（Scheme 6.2）。^(19) 从历史上看，该试剂极差的溶解性将其用途限制在少数溶剂中。无数化学家一直使用高沸点的\
  \ DMSO，直到 2002 年 Moore 报告该反应在更易得的溶剂中也是有效的。^(20)尽管对于单个化学家来说筛选不同的溶剂系统可能并不划算，但整个领域的累计效益是巨大的。对于不常用的试剂，这个问题可能更为突出，因为发表改进的制备方法或方法的动力进一步减少了。\n\
  \n![image](img/bk9781788017893-00136-s2.jpg)\n\nScheme 6.22 2-碘氧苯酸 (IBX) 的结构。\n\n\
  灵活的流化学系统在可扩展合成中变得越来越常见，即使在实验室级别也是如此。与 ML 算法相结合，这些系统可以连续或离散地对温度、浓度和流速进行实时优化。因此，ML\
  \ 和自动化硬件是降低小规模合成工艺优化障碍的方法。结合适当的文档记录和数据共享（见第 6.3 节），这将导致效率的持续提高，并鼓励采用更绿色的溶剂和试剂。\n\
  \n### 6.2.2 预测反应结果\n\n与反应优化相比，化学活性的预测是一个缺乏先例的领域。由于两个或多个分子之间存在许多相互作用的方式，这个问题在根本上更具挑战性。考虑人类预测活性的方法：\n\
  \n1. 识别反应物上的活性位点（原子）\n2. 确定可能发生的反应类型\n3. 评估特定反应的可能性和程度\n\n遵循这种方法的 AI 系统通常利用下文的反应模板。其他方法可能没有显式地分离这些任务，并被归类为非模板方法，后文描述。\n\
  \n**基于模板的**：分子表示的选择（见第 6.2.4 节）既会影响也依赖于生成和评估候选转换的方法。基于图的表示在基于规则和 ML 方法中被广泛使用，用于将分子与反应模板进行比较，随后识别适用反应和反应中心（见\
  \ Figure 6.1）。由 Coley 及其同事开创的一种方法^(21,22) 应用了从美国专利数据库中提取的 1700 个模板，然后使用神经网络对生成产物的可能性进行排序。这证明了\
  \ ML 进行正向预测的可行性；然而，该方法面临高计算成本的问题，因为对于每个模板都需要判断分子图是否包含与模板同构的子图。为了缓解这个问题，Segler^(23)\
  \ 和 Coley^(24) 都使用神经网络来建议模板，而不是直接与每个模板进行比较。\n\n![image](img/bk9781788017893-00136-f1.jpg)\n\
  \nFigure 6.1 反应模板在正向和反向的应用，包含的相邻键数量增加。重自 ref. 22, [`doi.org/10.1021/acs.accounts.8b00087`](http://https://doi.org/10.1021/acs.accounts.8b00087)，经美国化学学会许可，版权\
  \ 2018。\n\n基于模板的方法在覆盖率、准确性和速度之间存在基本的权衡。这在指定反应核心复杂性时显而易见。仅包含成键/断键原子的模板缺乏分子其他地方电子和位阻效应的关键背景。然而，包含相邻片段的更复杂的模板计算耗时更长，并且可能过度指定某种转换。另一个权衡是使用的模板数量。考虑每种转换是不可能的；因此，模型通常限于检查数百或数千个模板。此参数通常表示反应的累计百分比。遗憾的是，即使对已知反应有良好的覆盖（*例如*，涵盖\
  \ Reaxys 中的 99% 模板），对于复杂的逆合成分析来说也是够的。Szymkuć 对“化学网络”的分析发现反应在文献中出现的次数与其排名之间存在幂律关系.^(25)\
  \ 这种关系表明少数离群值（*即*，很少使用的反应）具有显著影响；Szymkuć 认为这需要数万条化学规则（Chematica 程序），^(26)，这对机器提取规则和人工编码规则都是挑战。\n\
  \n**无模板的**：与直接模板匹配不同，可以直接对 SMILES 字符串进行计算，将反应视为产物和反应物之间的翻译任务（见 Figure 6.2）。这种使用序列编码器-解码器模型（`seq2seq`）的方法分别由\
  \ Nam^(27), Liu^(28) 和 Schwaller^(29) 探索。一些令人惊讶的结果脱颖而出。首先，模型能够在大多数情况下生成有效的产物 SMILES\
  \ 字符串，而无需显式指定或过滤。其次，模型在正向和反向预测之间存在巨大的性能差距。Liu 在反向方向上运行的模型无法超越 Coley 基于模板的模型。然而，报告的最优性能来自\
  \ Schwaller 的 `seq2seq` 模型，该模型正向预测反应产物并包含一个注意力层。注意力模型允许算法关注输入的特定部分，具有提供某些可解释性的额外处，这是与基于模板的模型相比无模板模型通常缺乏的。包含注意力的影响也表明模型架构是未来研究的一个重要领域。事实上，Yang^(30)\
  \ 表明，除了使用的表示之外，神经网络架构对于属性预测任务至关重要。\n\n![image](img/bk9781788017893-00136-f2.jpg)\n\
  \n\n\n\n\n图 6.2 由 Pande 实现的基于注意力的 seq2seq 模型。(28) 输入是一个分子的 SMILES 字符串（此处为甲醇），它被传递到顺序循环神经网络（一个编码器和一个解码器），该解码器输出预测试剂的\
  \ SMILES 字符串。注意力机制允许模型关注输入中的特定字符（通常是原子）。转录自文献 28, [`doi.org/10.1021/acscentsci.7b00303`](http://https://doi.org/10.1021/acscentsci.7b00303)，经美国化学学会许可，版权所有\
  \ 2017。\n\n### 6.2.3 执行逆向合成\n\nCASP 的最终目标是为任何分子（已知的或新新的）可靠地生成多反应合成计划。对于人类化学家来说，这个过程表面上是按照逆向合成的方向考虑的，从目标物向可购买的起始原料。但考虑到反应是从正向进行教学（并发生）的，化学家必然对路径进行整体评估，同时考虑某个特定反应对于构建感兴趣目标的价值，以及该反应产生所需产物的概率。要为这种细致的任务创建算法是具有挑战性的，尽管\
  \ seq2seq 表明可能存在重要的区别，但执行正向任务与逆向任务的算法在预测能力上的差异尚未得到充分探索。(31)\n\n用于制造每个分子的可用反应数量巨大，导致每一步的可能路线呈指数级爆炸。考虑一种树形结构，其根是目标分子，叶子是可购买的底物。根据某些估计，从一个目标出发的不同五步反应合成平均数量可达\
  \ `10¹⁶`。(25) 因此，为了预测目标的逆向合成路线，需要机器学习算法来识别和导航这些树结构中有具前景的部分，而无需对其进行穷尽探索。这种算法必须确定并优先考虑通向可合成分子并最终到达可购买起始原料的转化。模型进行此类排序的标准被称为“成本”或“奖励”，取决于该数量应该被最小化还是最大化。通常，成本或奖励的概念可以包含许多想要优化的因素，例如起始原料的货币成本、反应产率、反应时间、环境因素或反应复杂性。\n\
  \n描述复杂性具有具有欺骗性的挑战性。使用一种直观的关系——分子越复杂制造越昂贵——可以简单地将反应物和产物 SMILES 字符串长度的差异作为反应成本的代理。(25)另一种方法是考虑结构特征，为每个特征分配一个预定的复杂性成本。然而，人类感知的分子复杂性是导航化学空间的一个不可靠的指标。贪婪地应用用于评估转化的复杂性启发式，可能会导致合成捷径被忽略。一个完美的例子是保护基的使用。它们的安装增加了键和原子的数量，但只是暂时的；一个性能良好的模型应将其有效使用视为成本的降低。有机化学中许多优雅的合成都包含了最初看起来不直观、低效或适得其反的转化，但最终建立了高度高效的反应。\n\
  \n一种衡量复杂性的衡量标准是必要的，以便为逆向合成算法赋予专家级的化学直觉。幸运的是，Coley 能够利用现有的机器编码反应数据集开发出 `SCScore`，它预测了从起始原料合成任何分子所需的反应数量（其中某些反应可能会暂时增加键或原子的计数）。(32)\
  \ 通过从数据中学习合成性的整体概念，`SCScore` 指标不仅可以指导逆向合成分析，还可以对药物候选的合成性进行排序，或为化学文库构建识别复杂化反应。\n\n\
  虽然 `SCScore` 提供了一种实用的启发式方法，但它没有规定选择哪些转化将组成最佳合成路线的策略。这可以通过强化学习来实现。这种方法学习一种最优决策策略，接受短期损失以最大化长期奖励。训练后，可以执行该策略以确定逆向合成树上的最优路线。Segler^(23)\
  \ 证明了使用蒙特卡洛树搜索 (MCTS) 方法进行逆向合成的有效性，该方法因 DeepMind AlphaGo 算法在学习复杂围棋方面的成功而闻名。(33)\
  \ 简之，他们的实现通过使用 `MCTS`（见图 6.3）对各种目标完整反应树内可能路线的一个小子集进行模拟“推演”，记录最终结果（到达可购买起始原料的成功或失败），并对分支中的每个反应进行记录。学习过程在最成功路线的推演与未见路线的探索之间平衡，并产生可以成功预测训练期间未见分子的逆向合成的策略。\n\
  \n![image](img/bk9781788017893-00136-f3.jpg)\n\n图 6.3 蒙特卡洛树搜索。对于逆向合成，节点代表化合物，线代表反应。选择一个尚未探索的有前景节点。扩展应用模板或其他策略生成前驱体。推演使用逆向合成步骤尝试到达原料。其成功或失败被确定并回传到父节点，并重复该过程。(23)\n\
  \nSchreck^(34) 发表了使用深度强化学习学习策略的类似方法（见图 6.4）。与贪婪应用基于 SMILES 的复杂性启发式相比，Waller^(23)\
  \ 和 Schreck 在合理时间内找到完整逆向路径的分子数量上取得了显著改进。\n\n![image](img/bk9781788017893-00136-f4.jpg)\n\
  \n图 6.4 由 Bishop 实现的确定成本函数的强化学习。(34) 转录自文献 34, [`doi.org/10.1021/acscentsci.9b00055`](http://https://doi.org/10.1021/acscentsci.9b00055)，经美国化学学会许可，版权所有\
  \ 2019。\n\n### 6.2.4 评估\n\n\n\n\n\nCASP 系统的元素——反应优化、正向预测、逆向合成——每一个都可以被视为独立的问题来处理。但是，`Make-It`\
  \ 程序揭示了这些方面之间是如何相互关联的。为了提供完整的端到端解决方案，逆向合成算法必须根据所需的溶剂和试剂，考虑使用多少个模板来定义分支数并确定成本。目前尚不确定这些任务应该在多大程度上由算法主导。对\
  \ `seq2seq` 模型的研究表明，适当指定的机器学习（ML）模型在某些情况下可以协同地执行这些任务，但可能以牺牲可解释性为代价。\n\n评估模型的性能和价值也不是一项简易的任务。反应数据库中的地面真值（Ground\
  \ truth）经常被用于确定正向反应的“前 1”或“前 5”预测准确率（*即*，算法在其前 `X` 个结果中预测出正确产品的比例）。然而，对于多步逆向合成，还没有类似的衡量指标。生成的路线可以与发表的路线进行比较，但预计它们会根据模型中微小的参数差异而有所不同，甚至可能提供比已知路线更优的方案。已有尝试以人类专家为基准进行测试^(23)。可以设想一种“化学图灵测试”，其中通过意味着化学家无法区分由机器生成的路线还是由传奇合成化学家\
  \ E.J. Corey 生成的路线。但这可能偏向于化学家熟悉的反应，而不是效率最高的反应。最终的验证是执行所提的合成，这既耗时又昂贵。需要新的方法，通过快速实验或*计算机模拟（*in\
  \ silico*）来测试新路线，为这些系统提供反馈。\n\n### 6.2.5 采用\n\n`Make-It` 程序旨在建立一个一键式系统，它能够评估任何分子，告诉用户是否可以合成以及如何合成，并在提供适当原料的情况下，自主生产该分子。然而，要实现这一愿景，甚至只是取得进展，都需要这些工具在短期内具有可证明的用途。`Make-It`\
  \ 技术已被工业界和政府合作伙伴采用，以解决现实挑战。该计划的一个早期成功是由 Grzybowski 及其同事开发的 `Chematica` 软件^(35)。这种基于规则的专家逆向合成系统面临来自\
  \ MilliporeSigma（原 Sigma-Aldrich）的挑战，要求为之前合成尝试失败的目标提供路线。`Chematica` 为 `MilliporeSigma`\
  \ 化学家在挑战限制内成功完成的所有六个目标提供了路线。`MilliporeSigma` 随后购买了 `Chematica`，现在以 `Synthia™` 的名称营销该软件，并在内部使用它扩大其产品目录。\n\
  \n在所有情况下，用户体验对于采用至关重要；系统的实用性取决于其易用性。可用性不仅涉及用户界面设计（*例如*易读的反应方案、简便的立体化学输入），还涉及优先显示最有用信息的能力。例如，在\
  \ `Make-It` CASP 系统的开发早期，搜索输出通常会对非常相似的结果赋予高排名，基本上反复提供具有细微差异的相同路线。软件的后续版本旨在提供多样化的路线，并在向用户展示时将相似的路线分组。另一个实际考虑因素是此类系统的计算需求。即使对于采用昂贵的模板匹配和大型转化库的\
  \ CASP 系统，单步逆向合成所需的时间通常只是人类所需的一部分。然而，系统性能的瓶颈是可能路线的爆炸，需要大量的内存来存储。在 `Make-It` 下开发的系统中，在多核心桌面计算机上计算相当复杂的类药分子的路线可以在\
  \ 6–60 秒内完成^(24)\n\n人们可能会将当前的 CASP 软件描述为搜索引擎的早期版本。正如 `Google` 和 `Bing` 成为互联网的必需品一样，CASP\
  \ 也让化学家能够导航反应空间。上述所有系统允许化学家轻松地链接材料，节省了查阅文献的无数小时。在一个领域常见的反应在另一个领域可能是罕见的，这需要跨学科软件。我们预测当前的\
  \ CASP 系统在复杂性、适用性和性能方面继续增加。最后，应该注意到这些算法可以适应以检查多个目标，识别化合物的最小集合。对于像 `DoD` 这样购买多种化学品的大型，此类工具可以识别构建块和中间化合物，以简化生产并降低成本。\n\
  \n### 6.3 化学统计学习的数据挑战\n\n定量结构活性关系（`QSAR`）最早于 1961 年报道，开启了化学信息学领域^(36)。早期工作主要依赖于物理属性（如\
  \ `logP`）与生物结果的相关性。最终，基于片段和量子力学的描述符开始引入，并在 21 世纪初，神经网络被用于属性预测^(37)。2014 年，美国健康研究院（NIH）、环保保护署（EPA）和食品药品管理局（FDA）赞助了\
  \ `Tox21`，这是一项预测数千分子在毒理学实验中性能的挑战。参赛作品展示了用于预测性的多种机器学习技术，包括随机森林、深度神经网络、支持向量机等^(38)\n\
  \n然而，尽管统计方法在化学信息学建模中非常流行，但机器学习并未被合成化学家接受。2015 年启动的 `Make-It` 程序尝试将许多底层 `QSAR` 技术应用于逆向合成和正向预测。这样做揭示了属性预测和分子设计等复杂任务需要克服的若干挑战。虽然在某些方面这些挑战在机器学习应用中是通用的，但它们具有实验科学特别是化学的独特方面。本节将关注将化学数据整合到统计学习系统的挑战。\n\
  \n机器学习算法在数据充足或至少易于产生且与任务相关的领域发展。计算机视觉（`CV`）和自然语言处理（`NLP`）的进展——机器学习成功的典型范例——极大受益于在线数字数据的普及以及几十年来专注于这些领域的社区的努力。此类数据由公众免费产生，并由研究社区精心策划和注释成标准的、高质量的，以进一步开发模型并提供通用的参考和基准（*例如*\
  \ ImageNet，^(39) `CoNLL Shared Tasks`，^(40)**等*）。\n\n\n\n\n\n这与化学科学形成了鲜明对比，在化学科学中，数据的生成成本相对较高，且通常被视为应当保护而非共享的宝贵知识产权。在学术期刊上发表的数据是公开的，但必须对其进行聚合才能提供机器学习（ML）所需的典型训练数据。这些复合数据集存在\
  \ (1) 偏差、(2) 不可获取以及 (3) 范围狭窄的问题，我们将按顺序讨论这些挑战。\n\n### 6.3.1 数据偏向于成功的实验\n\n期刊优先考虑证实性研究，即实验数据支持某项假设的研究。如果一个项目的实验数据无法用假设解释，则被视为失败，并永远被遗留在实验室笔记本中。这种模式因激励数据和统计操纵而受到批评。^(41)\
  \ 但一个更广泛且被认为更严重的影响是它在科学数据库中产生了对阳性结果的偏差（参见图 6.5）。除少数例外外，化学反应数据库仅包含成功的反应，*即*对于报告产物具有显著产率的反应。负性结果（如无反应或非预期反应）很少被报道。这使得使用监督学习分类器变得困难，因为这些分类器需要每个类别显式的阳性和负性标签。\n\
  \n![image](img/bk9781788017893-00136-f5.jpg)\n\n图 6.5 Reaxys 中报告的聚合产率。感谢 K.Jensen\
  \ 提供，部分于 2019 年 10 月的 Make-It 行业论坛。\n\n这一挑战在 Make-It 项目中遇到了。Coley 在 `Reaxys` 数据库上训练了监督模型，用以预测生成目标产物的反应物（见第\
  \ 6.1 节）。然而，由于训练数据中缺乏失败反应或副产物的示例，模型无法将反应分类为可行。Segler^(23) 和 Coley^(21) 通过生成“合成”负性示例来提供额外的类别标签，解决了这个问题。Coley\
  \ 识别出产率超过 50% 的反应，并推测产物混合物中不存在其他产物（包括预期产物）。Waller 采用了相同的策略，通过对随机的反应物-产物对进行采样，进一步补充了负性数据池，提供了\
  \ 7000 万个错误组合。这使得 `Reaxys` 数据实现了相当良好的性能；然而，这应该被视为一种权宜之计。对模型最有价值的是那些（根据某些人类启发式）预期会产生一种产物，但实际上产生了另一种产物的反应。幸运的是，这些情况在化学研究过程中不断发生；遗憾的是，它们很少被发表或传播。\n\
  \n### 6.3.2 现有数据不可靠且不符合标准\n\n随着化学信息学的流行，出现了一些包含分子式、结构、物理性质和生物活性组合的数据库。这些数据被常用于训练和验证用于各种药物发现和材料应用的\
  \ `QSAR` 模型。除了上述偏差外，数据还可能面临更基础的问题。最近的一项研究审计了六个大型数据库中的结构，发现高达 3.4% 的条目包含不准确结构，例如位置错误的氯原子或交换了羟基和甲氧基。^(42)\
  \ 作者发现，这种程度的错误对基于这些数据训练的模型准确性有重大影响。然而，文献在报告模型性能时往往没有任何实验验证。\n\n如果数据库是不可靠的，人们可能会寻求科学期刊以获取原始数据。化学文献是机器学习的一个非常有吸引力的知识来源，因为与反应数据库不同，它偶尔会描述无效的反应和条件。在化学文献中披露负性结果范围内，通常是通过文本讨论来实现的，而讨论又引用了完全理解所需的图表。人类可以轻松理解这些信息，但语言的细微差别和图表的无限制性限制了机器的自动解释。尽管\
  \ `NLP` 和 `CV` 技术取得了巨大进展，但将这些技术应用于化学领域的努力较少。因此，大多数公开的 `NLP` 和 `CV` 模型由于是在更一般的领域训练的，在应用于化学数据的独特词汇和语法时非常吃力。\n\
  \n最后，人们必须从上信任发表的数据。尽管出版物经过同行评审，但大多数实验并没有被其他实验室复制，因为寻求终职的教职工受到激励展示并发表新发现。即便并非如此，实验对于另一个实验室来说也可能太贵或太复杂，或者详细步骤未公开。正如图\
  \ 6.5 所示，该图显示大量的实验报告的产率被舍入到最近的 10，显然发表的结果并不总是反映真实实验数据的准确报告。这如何以及何影响模型和后续预测，应该仔细考虑。\n\
  \n### 6.3.3 数据仅适用于一组特定的任务\n\n监督学习的一个基本假设（尽管在实践中很少满足）是训练模型的数据与测试模型的数据来自相同的分布。尽管有第一性原理编码和持续学习等方法的帮助，但有效地对与训练数据不同的数据进行外推，仍然是机器学习领域的一个开放研究课题。^(43)\
  \ 在化学中，最有价值的预测是那些对于感兴趣的分布而言缺乏实验数据的分子、反应或性质。挑战就在于此。\n\n\n\n\n\n药物研究具有高度的竞争性，这虽然对于创新至关重要，但产生了大量的专有数据，其中许多数据从未被使用，也因为担心会被竞争对手利用有利的发现而未被发布。但即使可以克服这一问题（vida\
  \ infra），数据也将反映出制药研发总额与其他化学行业之间巨大的不平衡——这种差异也存在于公开数据中。2018 年，排名前 15 的制药公司的研发预算为 1000\
  \ 亿美元，而其他领域排名前 15 的化学公司仅为 110 亿美元。这自然导致了面向制药行业及其应用的数据库的出现。Virshup 通过对流行的 `PubChem`\
  \ 和 `ZINC` 数据库进行分析说明了这一点。首先，整个类药小分子宇宙（估计约有 $\\sim 10^{60}$ 个分子，最初由 Lipinsky 描述）根据其指纹的\
  \ Tanimoto 相似性，使用自组织映射被均匀地映射到 9 万个“箱”或神经元中。随后结果表明，98%的 `PubChem` 化被分配到仅 2%的神经元中，这些神经元主要由低分子量和少环的化合物表征。从这一结果可以得出多种结论，但事实如下：(1)\
  \ 小分子宇宙的很大一部分仍未被探索；(2) 已被探索的部分并不代表整体。\n\n这种数据差异也延伸到了属性空间。Wu 等最近汇总了一系列属性数据集，以为各种属性预测任务建立基准。虽然某些数据集包含许多化合物的属性信息（例如，`PubChem\
  \ BioAssay` (PCBA) 包含超过 400,000 种化合物的生物学活性），但其他属性的数据较少（例如来自 `ChEMBL` 的 4200 种精选化合物的亲脂性值）。数据数量不是模型质量的充分条件；然而，在许多情况下，它是必要条件，特别是对于具有许多参数的复杂深度学习模型，以及当模型开发者无法控制新数据的生成时。图\
  \ 6.6 展示了基于训练集大小的几种不同模型的性能。\n\n![image](img/bk9781788017893-00136-f6.jpg)\n\n图 6.6\
  \ 大数据集的重要性以及几种不同模型在属性预测之间的性能差异。经英国皇家学会许可改编自参考文献。\n\n可用数据与尝试任务之间的这种不匹配表明，如果不生成特定任务的数据，机器学习（ML）将极度依赖于利用现有知识，而不是探索新的化学空间，机器学习在化学领域的大多数成功将局限于社区已经大量投入的领域。这对于国防部（DoD）感兴趣的特定属性来说尤其具有挑战性，因为产生此类数据的研究群体非常小。\n\
  \n## 6.3.4 机器学习模型没有化学数据的标准表示方法\n\n假设可以获取化学机器学习任务的理想数据，向模型呈现这些数据的格式也显而易见。直到最近，NLP\
  \ 和 CV 严重依赖手动特征工程作为预处理步骤，将原始数据转换为模型可以摄取的形式。标准做法是计算多个特征，例如句子的无上下文语法解析，或图像的尺度不变特征变换，然后使用特征选择技术来确定包含哪些特征。\n\
  \n尽管特征工程仍然是机器学习流水线的一部分，但随着深度神经网络的出现，其重要性已有所降低。许多目前的深度神经网络模型改为采用更基础的表示作为输入，例如语料库中每个词的热热向量，或邻近像素的卷积，从中自动导出显著特征。这种技术的优势在于，粗略地说，这些表示比工程化特征更完整，因为它们本质上包含了人类做决策时会使用的相同信息。化学的启示者是自然，提供足够的信息以任意精度求解多电子系统的随时间薛定谔方程是不可能的，因为无法提供所有此类信息，因此问题变成了：自然所拥有的信息的适当抽象是什么？这种抽象又应该如何表示？\n\
  \n这个问题几乎没有单一的答案；适当的表示取决于涉及的化学类型和机器学习任务。分子表示通常分为大类：固定表示（类似于之前描述的工程化特征，它们不随任务而变化，例如分子描述符和指纹）以及在模型背景下开发的学习型表示。图\
  \ 6.7 显示了每种表示的示例。\n\n![image](img/bk9781788017893-00136-f7.jpg)\n\n图 6.7 不良分子表示的示例。\n\
  \n固定表示的一个例子是许多人熟悉的二维原子-键骨架式。它直接对应分子的原子和键排列，并可以被解释为无向图。一种基于文本的表示（人类化学家熟悉，但可能解释性较低）是\
  \ `SMILES`，它是代表分子图连接性的字母数字字符串。分子可以用专家定义的描述符表示，通过流行的 `Dragon` 软件可以计算出数百种描述符。扩展连接指纹（ECFP）通过一个结合分子局部拓扑信息的哈希函数来确定。这些指纹的一个吸引人的特点是，使用\
  \ `RDKit` 等现成工具可以快速地生成，并且便于针对特定应用进行定制。Waller 的逆合成算法（见第 6.2 节）使用指纹来建议适用于给定目标的转化。此类固定表示长期以来一直以各种形式用于许多\
  \ QSAR 方法中。\n\n化学领域的学习型表示是较最近的进展，通常通过对分子的图结构进行操作产生。Duvenaud 开发了此类此类实现，通过在任意分子图结构上进行卷积来进行各种属性预测任务。Coley\
  \ 在 `Make-It` 程序的前向反应预测任务中采取了类似的方法。\n\n\n\n\n\n文献对于在通用预测任务中倾向于使用固定表示（fixed representations）还是学习表示（learned\
  \ representations）尚未达成一致。在预测二分类实验结果时（例如指示某些化合物是否与特定受体结合、抑制某些通路或诱导毒性效应），Wu 发现学习表示往往更具成功，^(48)；而\
  \ Mayr 则认为固定表示的表现更好.^(55) Yang 认为这种差异可能源于评估方案的差异，并进一步证明了结合卷积和描述符的混合表示的优势。^(30)\n\
  \n混合表示所提供的优势说明了一个更广泛的观点：不同的应用空间需要本质上不同的表示方法。与上述讨论的数据集类似，该领域的工作已转向治疗特性的预测，而在应用于预测蒸压或生成热等不同属性时，包含哪些固定特征或如何产生学习特征的细节可能会有所不同。DARPA\
  \ AMD 程序的一个重点是跨多个应用空间开发和评估分子表示，以便对这些问题提供更好的理解。\n\n## 6.4 数据挑战的可行解决方案\n\n数据是 AI 驱动实验室的生命线。在\
  \ 6.3 节中，我们讨论了在将机器学习（ML）应用于化学时，确保数据的客观性、可用性和相关性是对模型性能最大的限制。解决这些问题的具体方法取决于数据来源，无论是来自自己的实验室、外部来源（例如数据库或其他实验室）、模拟，还是从科学文献中提取。在这里，我们重点介绍各种研究人员和组织实施的解决这些数据不足的解决方案。\n\
  \n### 6.4.1 实验数据收集的自动化与标准化\n\n化学家对自己的实验室、自己的设备并按照自己的方案进行的实验具有最大的控制权。因此，这是改变数据生成方式最自然的地方。我们在这里介绍了实验室工作流的三个目标，这些目标对于提高数据效益、客观性和可用性至关重要。\n\
  \n* **目标 1：以机器可读格式记录数据** 推动数据和实验方案的数字化并不新鲜。电子实验笔记本（ELNs）最初出现在 20 世纪 90 年代。^(56)\
  \ 然而，由于许多原因，此类工具的采用缓慢，^(57) 包括对软件成本、数据安全和法律问题的担忧。然而，可用性仍然是最大的挑战。化学家可能难以输入化学反应方案的细微差别^(58)或者被迫采用一种不熟悉的组织方案。ELNs\
  \ 必须在足够通用（以供不同类型的化学家使用）和足够强大（以考虑到每个领域的细微差别）之间取得平衡。\n\n* 开发通用 ELN 的尝试仍在。但遗憾的是，即使有一个高度可用、广泛适用的系统，也不能保证它会被那些可能有根深蒂固偏好和习惯的研究人员所采用。最终，将\
  \ ELN 重塑为辅助观察者，自动记录实验程序并记录数据，可能会更成功。Ley^(59) 实验室探索了使用计算机视觉通过视频监控实验，并使用自然语言处理处理文本并将其转换为标准的、机器可读的格式^(60)。类似的方法是将分析仪器集成到数字存储库中。然而，此类仪器制造商提供的\
  \ API 通常产生每台仪器都不同的专有格式数据。将数据导出到开源格式以进行保存或整合到统计模型中是耗时的，并且可能无法保持原始数据的分辨率。研究界对制造商要求更开放其\
  \ API 的压力可能需要整个社区的努力并辅以激烈的行业竞争。\n\n* NIH 国家转化医学中心（NCATS）的一项名为 ASPIRE 的计划旨在对抗阿片类药物滥用并寻找疼痛管理的更安全的选择，该计划包含一个特定挑战，即开发“下一代开源实验笔记本，作为化学知识门户，允许在合成规划、执行和分析期间进行无偏的数据收集。”^(7)\n\
  \n* **目标 2：算法生成的标准化方案。** 捕获实验的所有可能细节是确保数据真实、可重复的一种方法。另一种是创建强制标准执行的方案和实验计划。华盛顿大学（UW）的生物制造中心^(61)启动了\
  \ Aquarium 软件，监控样品库存并指定制备，但将手动操作留给实验室技术员执行.^(62)这不仅强制了标准数据收集，还强制了实验设计，有助于提高机器学习模型的可用性。华盛顿大学的工作是\
  \ DARPA 协同发现与设计（SD2）计划的一部分，该计划采取数据驱动的方法在广泛领域进行模型构建。^(63)\n\n* **目标 3：无手执行实验：** 机器人实验提供了成本节省和安全性改进，但实验室自动化的另一个驱动力是生成无偏的、完整记录的数据集的能力。通过消除移液、加热、混合等更枯燥任务的人工执行，转而依赖自动化工具，可以进行更多实验，获取更多数据，并提高这些数据的可重复性和特异性。实验室自动化的大规模实现以“云实验室”的发展为代表，这些实验室正迅速成为生物实验的可行方案，在化学领域，机器人自动化具有巨大的领先优势。一个例子是\
  \ Transcriptic，它允许在没有人工参与的情况下运行生物学分析。^(64)另一个是 Emerald Cloud Lab，它提供了有机合成实验室的所有能力，包括固体处理、旋转蒸、纯化和多种分析能力。^(65)\n\
  \n前两个目标与科学数据生成和管理的更大目标相一致，即数据生产者和发布者采用 FAIR（可发现、可访问、可交互、可重用）数据原则。^(66) 虽然其本身不是一个目标，但\
  \ FAIR 原则被认为是化学领域 AI 进行创新和发现的必要条件。^(67)\n\n\n\n\n\n实验室自动化的一个令人兴奋的方面是研究去中心化的能力。这种方法要求数据科学家与实验实验室之间进行快速、清晰的通信。这些协作在今天非常常见，但通常是*临时性的*，即通过从一个小组到另一个小组的“数据倾倒”进行的\
  \ 1:1 伙伴关系。这种情况在研究小组内部也会发生，例如毕业的学生留下了注释糟糕且无组织的数据。无论何种情况，数据科学家或模型构建者都必须花费大量时间清洗数据，这一过程可能会引入解释上的错误。未来，我们预计数据共享将从小型的特定协作转向大规模的公共数据集，并由许多小组持续添加和利用。诸如\
  \ `PubChem` 或 `BindingDB` 等可用数据集，以及 `CAS` 和 `Reaxys` 等商业数据集仍在不断增长，^(68)，但数据格式和准确性问题产生了新的瓶颈。\n\
  \n这些资源的替代方案是结合出版物直接由研究小组产生的数据，某些期刊现在要求使用一致的数据标准。^(66) 化学领域通 FAIR 数据的最佳路径将是这些方法的结合：由许多数据生产者以一致且有效的格式去中心化发布数据，并结合集中数据库的数据管理工具。尽管\
  \ FAIR 原则有许多支持者，但在社区中遵循这一原则尚未成为普遍做法。\n\n使现有数据更符合 FAIR 标准的另一个早期步骤是 Google 数据集搜索。^(69)–71)\
  \ 这一搜索引擎允许用户搜索其他可能难以找到的数据集，因为大多数搜索引擎不会索引托管数据库中的内部记录。目前，该工具要求数据提供者使用开放的元数据格式对其数据集进行注释，并且没有提供除链接到托管站点之外的访问数据的方法。未来，此或其他工具可能会集成\
  \ `API`，允许模型直接利用多个数据集甚至自动搜索它们。\n\n但最终，即使是来自学术和政府实验室的组合数据集，也可能无法与由于竞争或隐私原因无法共享数据的公司和组织的数据相提。出现了一些变通方法来利用这些专有数据，从私立资助的“开放创新”财团到受严格控制的伙伴关系。^(72)一个潜在的可扩展模型是医学机会加速治疗治疗\
  \ (`ATOM`) 联盟，它依赖劳伦斯·利物物尔国家实验室 (`LLNL`) 作为受信的中间人来聚合、管理并安全分析由制药行业成员提供的数据。^(73)这种设置允许成员既从共享数据中受益，也能从\
  \ `LLNL` 提供的强大计算能力和专业知识中受益。在麻理工，药物发现与合成机器学习联盟采用了另一种框架。在这里，`ML` 模型是联合开发的，但在内部部署，以便在公司的专有数据上进行单独训练。^(74,75)这允许了工具和模型的协作开发，但无法从池化数据集中受益。\n\
  \n利用非公开数据的另一种方法是更改数据以隐藏细节，但仍为 `ML` 模型提供信息。同态加密^(76,77)允许在不解密数据或不访问解密密钥的情况下计算。另一个例子是数据混淆。^(78)在这里，数据通过新样本或随机噪声进行增强，使得可以在数据上训练出有效的\
  \ `ML` 模型，但掩盖与单个样本或样本组相关的敏感信息。该领域还需要进一步的研究，以使这些技术更健壮、易于实现并具有更好的性能。\n\n### 6.4.3\
  \ 利用科学文献中描述的实验\n\n与大型结构化数据库相比，化学文献包含无组织和非结构化的数据。即使对于表格和图中明确陈述的数据，其格式和结构表示也不易于机器解释。Olivetti\
  \ 和 McCallum 展示了在材料文献源中获取知识的两种有前景的方法。2017 年，该小组发表了一种无监督技术，从 64 万篇期刊文章语料库中提取 30 种不同氧化物系统的合成参数。^(79)最近，他们构建了一个包含\
  \ 230 种合成程序的数据集，由领域专家标注，并使用表示合成句子语义的标记图进行注释，这可以用于对未见文本进行浅层注释。^(80)这些技术规避了应用 `NLP`\
  \ 方法时常见的人工标注数据集的主要障碍。光学结构识别 (`OSRA`)^(81) 是分类分子结构的较已知系统之一，尽管它假设图像已从文章中提取。Staker^(82)最近开发了端到端深度学习解决方案，用于从文档分割分子结构并从分割的图像预测化学结构。\n\
  \n社区还在通过在出版时开发易访问的元数据，使期刊的机器读性成为内在设计目标。^(83)它目前专注于增强搜索引擎的发现，但如果被广泛采用并扩展到描述文本和图形，可能会消除对复杂的\
  \ `NLP` 和 `CV` 提取技术的需求。\n\n### 6.4.4 通过模拟生成数据\n\n某些数据通过实验收集是不现实的，要么因为成本，要么因为分析设备的限制，因此通过分子动力学（*例如*，预测亲和力的模型^(84))）或量子力学模拟（如密度泛函理论\
  \ `DFT`）获取更为高效。然而，此类模拟所需的时间计算资源提供了另一个利用 `ML` 的机会。Gilmer^(85) 开发了一个在 `QM9` 数据库上训练的\
  \ `ML` 模型，该模型能够在毫秒内近似 `HOMO` 和 `LUMO` 值等量子力学量，准确性与 `DFT` 相当，比基于模拟的 `DFT` 方法快 30\
  \ 万倍。`Gilmer` 开发的消息传递神经网络架构的定向键变体被 Yang^(30) 显示适用于广泛的属性预测任务。\n\n\n\n\nGómez-Bombarelli\
  \ 利用机器学习预测来确定进一步模拟和实验的优先级，以发现高效的有机发光二极管。(86) 他们将简单的片段以供体-受体配置进行组合，创建了 160 万种结构——这一规模之大，无法通过量子模拟进行筛选。因此，通过神经网络生成并分析了分子指纹，以便为量子计算的候选方案进行排序。最初，模型在对随机选择的\
  \ 40,000 个结构的计算值上进行训练。为了提高模型对最高效结构的预测能力，在筛选过程中对其定期进行重新训练。虚拟筛选最终生成了五个候选化合物，这些化合物已通过合成并证明了良好的性能。\n\
  \n### 6.4.5 数据生成与预测模型的闭环整合\n\n在上述技术目前所使用的范围内，数据生成与利用这些数据的模型开发在很大程度上是独立的。我们认为，确保某个特定机器学习任务存在客观、可访问且高度相关数据的最有前景的方法，是将数据生成和预测模型组件集成到闭环工作流中。最近，已经证明了一些方法(43)，让模型本身利用贝叶斯优化或其他主动学习技术，根据模型的假设确定下一次执行的实验、模拟或数据查询。最重要的是，此的明确目标是获取最优数据以为该特定模型提供信息并提高其性能。然后用新数据更新模型的假设，并重复这一过程。\n\
  \n这种范式具有若干影响。首先，通过这种方式设计的实验数据比在环之外进行的实验对模型更具信息量，因此产生准确模型所需的数据更少。事实上，在用于选择下一次实验的优化函数方面，它们具有最大的相关性。这使得在数据稀少的领域能够快速开发模型，并提供了一种智能导航至天文数字般的未探索化学空间的方法，以扩展到新领域。其次，数据是完整且客观的，因为所有的实验条件都可以被指定和控制，且无论结果是否证实假设，都可以被保留。格式可以进行指定，以确保模型对数据的可访问性。最后，这种实验室工作流可能会从自动化演变为自主化——不仅减轻了化学家手动执行实验许多方面的苦差，还减轻了决定执行什么实验及其参数的负担。考虑一下，机器人自动化充当化学家的手，而\
  \ AI 工具则是其大脑。在最广泛的构想中，这种实验室能够在少数技术人员的支持下并在科学家的指导下发现并合成化合物，而科学家只需要提供化学搜索空间和所需的属性。自动化系统将提供完整记录的数据收集和可追溯的结论。\n\
  \n## 6.5 自动驾驶实验室的初步演示\n\n“自动驾驶实验室”（SDL）这一术语由 Aspuru-Guzik ，描述了一种 AI 驱动的实验室，它可以在没有人工干预的情况下生成假设并测试它们。(87)这种闭环特性将自动化实验室提升到了自主实验室。SDL\
  \ 的概念化与人类化学家的工作流（规划、实验、分析）一致，但其实现可能会以意想不到不到的方式简化研究。人类可能对特定类型的反应或分析有偏见，而机器对这些事物是漠不的，因为它的选择完全是由数据驱动的。这里讨论了两个案例。\n\
  \nNikolaev 等利用使用随机森林/遗传算法构建的 AI 规划器优化了碳纳米管生长的条件。(88)作者在 600 次连续的自主实验中成功提高了生长率，并建议这种类型的自主实验（称为\
  \ `ARES`）可以应用于金属、增材制造和化学气相沉积等领域。\n\nXue 及其同事的一项研究发现了镍钛记忆合金。(89)这些在加热时能恢复形状的柔性材料可以通过产生效应的热滞（`ΔT*`）来表征。为了寻找具有最小\
  \ `ΔT*` 的合金成分，研究人员测试了多种回归模型，并应用高效全局优化（EGO)(90)选择算法来建议新的候选成分。在九个实验循环后，系统找到了一种 `ΔT*=1.8\
  \ K` 的合金，这是经证明的最低值。成功的关键在于选择器中平衡探索与优化的能力。\n\n这些以及许多其他展示了自动驾驶实验室在材料合成和发现方面的潜力(91)94)——但在化学领域内的案例很难找到。与材料科学实验的对比表明，主要的挑战是将设计算法应用于非连续的化学空间。需要创新策略将自动驾驶实验室工具转移到化学空间。\n\
  \nCronin 实验室使用名为 `Chemputer` 的实验工作流解决了这个问题，该流程将闭环反应筛选和 AI 模型整合，并具有从数据库或自然语言处理源摄取数据。(95)该系统通过执行系列实验自主探索一组分子的活性，检查并将分类分类为有活性或无活性，同时使用支持向量机预测未测试配对的活性。系统的目标是发现新活性，而非优化特定属性。在一次演示中，系统发现了几种新的多分反应。\n\
  \n\n\n要在自主工作流中真正重现传统的分子设计过程，需要能够模拟人类创造力的模型。目前为止讨论的模型主要是判别性模型，它们估计条件概率 `p(*y*|x*)`。给定一个观测值\
  \ `x`（*例如*，某种分子表示法），模型预测属性 `y`（毒性、溶解性、*等*）的概率。在确定此类判别性模型的表示方法时，性能是首要考虑因素，可解释性性次之。相比之下，生成式模型尝试执行更复杂的任务：估计观测值与属性的联合分布\
  \ `p(*x,y*)`，通过计算 `p(*x*|y*)` 来描述具有所需属性的新观测值。变分自编码器和生成对抗网络等生成式模型在生成新语音、文本和图像方面已广受欢迎，最近也被应用于逆向分子设计^([96])。在这种应用中，逆向设计候选物的可行性也至关重要，因为候选物最终必须被合成。这一问题通过对生成分子图的拓扑结构施加约束^([97])，以及强制使用在分子字符串表示法上编码化学知识的\
  \ Chomsky 类型-2 语法^([98]) 来解决。\n\n生成完全新结构的能力是化学机器学习算法改进带来的最令人兴奋的可能之一。最近，一种生成模型发现了一种新型激酶抑制剂药物^([99])。Zhavoronkov\
  \ 及其同事使用自编码器方法，利用强化学习找到了与纤维化相关的 `kinase` 抑制剂。AI 系统生成和优先排序候选物的能力使其在短短 46 天内就发现并验证了一种纳摩尔级结合物，而典型的时间线需要\
  \ 10 年或以上，且花费数十亿美元^([100],[101])。这项演示研究可能是向复制人类化学直觉迈的大胆的一步，尽管批判性评论也指出了其局限性^([102])。DARPA\
  \ 加速分子发现计划将推动这些边界，探索更广泛的化学空间，并将其整合到用于国防部和其他其他应用的闭环工作流中。\n\n### 6.5.1 自主研究的影响\n\n\
  实验室设计和合成新分子的能力提供了一个未来：疫苗可以在几小时内制造，车辆涂层可以根据特定气候轻松定制，且廉价的定制催化剂可以中和温室气体。但随着 AI 进入实验室，考虑其辅助影响也是明智的。在不意识到对就业可能产生影响的情况下，设计自主系统是不可能的。在大多数情况下，科学自动化一直是为了扩大实验吞吐量，而不是取代实验台化学家。而机器学习的力量导致了数据科学工作数量的巨大增长。然而，这两者都导致了研究人员所需技能类型的转变，而结合这两种趋势将加速这种转变。未来，研究人员将需要成为熟练的编码员，能够解释机器学习结果并熟练地在计算机上操作结构。\n\
  \n化学专业的博士学生学习这些技能并不稀奇，但通常是迫于需要的。在未来，这些内容必须被整合到核心教育课程中。在微流控中进行布洛芬合成或建立一个预测结合的机器学习模型，都可以实施到学生的实验室课程中，而不会牺牲核心化学思想或需要对新设备进行大量投资。然而，这将要求教育者熟悉这些新领域。国家科学基金会、美国化学学会和其他组织可以通过提供教育座讨会和材料来提供帮助；这些材料也可以用于造福工业界工作的化学家，他们也需要精通这些技能。尽管有这些变化，我们相信\
  \ AI 将支持并赋能科学家变得更高效、更有创造力和多产。\n\n在核心研究之外，其他相关领域也将受到冲击。化学安全和环境法规必须适应。传统上，`FDA` 要求测试。今天，`FDA`\
  \ 已经接受了使用 `QSAR` 来预测结果^([103])。随着这些模型变得越来越常见，能够在开发的更早阶段进行评估。这些因素必须在化学科学自动化和自主化开发的同时被考虑，而不是之后。\n\
  \n法律政策和业务结构将受到这些工具发展的巨大影响。一个引人注目的问题是，如果计算机生成分子，谁拥有知识产权（IP）？^([104]) 目前，许多计算工具被用于发现，但它们需要人类指导，因此它们不是源头。但如果\
  \ AI 生成了分子，编写算法的人是否应该保留部分知识产权？想象一种开源工具，它可以使用公开可用数据快速生成高质量的候选物，类似于 Google 用于生成绘画或音乐的开源\
  \ AI。这会变成一场向商标局提交的竞赛吗？或者，如果没有授予知识产权，我们是否看到没有专利的新药？^([105])\n\n2016 年，疟疾杀死了 445,000\
  \ 人^([106])，耐药性细菌杀死了 700,000 人^([107])。对于这类目标，利用科学对抗人类痛苦的道德义务与防止全球动荡的国家利益是一致的。然而，这两个领域吸引的制药投资还没有癌症或中枢系统疾病的分之一^([108])。我们认为国防部完全处于领先地位。2018\
  \ 年 8 月，`FDA` 批准了 18 年来首种疟疾预防药物，该药物是由华特·里德陆研究所开发的^([106])。其他国防部实验室正在开发尖端的防弹塑料^([109])、改进的热光光伏电池^([110])\
  \ 以及更安全的激光^([111])。\n\n\n\n\n\n在私营部门，此类成功将引发投资的大幅增加，这些资金源自巨额利润。政府实验室并非如此，它们的预算相对固定，且无法从大规模的许可交易中获益。然而，我们有机会通过为这些实验室的研究人员提供\
  \ AI 工具，来增强他们正在进行的重要工作。这里讨论的 `DARPA` 项目以及由该机构 20 亿美元 `AINext` 计划支持的许多其他项目，将创建工具，使致力于士兵健康、弹药性能或喷气燃料安全等领域的实验室运行更高效，为作战人员、国家和我们的盟友带来利益。国防部（DoD）对\
  \ `ML` 和自动化的投资将成为这些研究人员的战斗力倍器，并降低学术界和工业界化学与生物研究人员采用这些工具的风险。\n\n## 延伸阅读\n\nI. W.\
