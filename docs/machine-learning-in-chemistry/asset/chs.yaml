  \ 12` | `P4[1]2[1]2` | α方晶石 |\n| `Polymorph 13` | `P6[2]22` | β石英 |\n\n首先，我们将我们的方法应用于\
  \ 14 种单金属氧化物的 `O-K 边`。所有计算的光谱见图 17.3。图 17.3 的上部分显示 `Al[2]O[3]`、`BeO`、`CaO`、`Ga[2]O[3]`、`In[2]O[3]`、`Li[2]O`、`MgO`、`Na[2]O`、`SiO[2]`、`SnO[2]`、`TiO[2]`（金钛矿）、`TiO[2]`（矿石）、`Y[2]O[3]`\
  \ 和 `ZrO[2]` 的计算 `O-K 边`。光谱的聚类分析形成了一个聚类图，如图 17.4 所示。从聚类图底部没有连接开始，相似的光谱或聚类在向上移动时合并。通过在某一水平上水平切割聚类图，我们可以得到一组聚类。切割水平的选择是任意的；我们选择了聚类图中虚线所示的水平，导致产生了四个聚类，聚类\
