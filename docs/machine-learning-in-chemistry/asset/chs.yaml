  \ | HERG | 1 |\n\n设计分子之间预测生物效应的差异，证明了用于开发 ms-QSBER-EL 模型的分子描述符的敏感度和判别能力。另一方面，很明显，每个分子生物效应的预测并不依赖于单一描述符，而是取决于模型中所有描述符的组合。任何情况下，某些物理化学性质和结构特征的影响比其他特征更大，我们通过提供导致分子化学结构观测差异的特定描述符对这些差异进行了了解释。\n\
  \n\n\n\n\n最有前景的分子来自 `AMA-001` 到 `AMA-004`、`AMA-008` 和 `AMA-010`。由于其具有潜在的高抗疟疾活性、低细胞毒性和良好的药代动力学性质，我们在\
  \ `ChEMBL`、`ZINC` 和 `ChemSpider` 等知名数据库中搜索了这些分子，以寻找相似分子。在相似性阈值 ≥0.8 的情况下，仅找到一个匹配。从这来看，分子\
  \ `ChemSpiderID 51375502` 被认为与 `AMA-001` 相似。然而，不同的结构方面证明了这两个分子在化学上的不相似。例如，`ChemSpiderID\
  \ 51375502` 包含一个 4-溴嘧啶环（而不是报道中 `AMA-001` 所含的关键片段 `2-溴嘧啶`）。此外，`ChemSpiderID 51375502`\
  \ 在吡啶环中缺少第二个溴原子，取而代之的是一个乙基。最后，从 `ms-QSBER-EL` 模型提取的物理化学和结构信息来看，`ChemSpiderID 51375502`\
  \ 中的 4-溴嘧啶环对描述符 `D[LnsAq2(E)G]c[j]` 的增加略不利。同时，第二个溴原子的缺乏也不利 `D[LnsAq2(E)G]c[j]` 和\
  \ `D[LnsAq6(HYD)Y]c[j]` 的值。最后，乙基中甲基部分的存在增加了 `D[LnsAq6(AW)M]c[j]` 的值，其不良影响之前解释过。因此，原则上，`ChemSpiderID\
  \ 51375502` 虽然很有前景，但在抗疟疾活性和/或安全性方面，应该略低于 `AMA-001`。\n\n### 16.3.5 药物相似性 (Druglikeness)\n\
  \n通过验证是否符合 `Lipinski 五倍规则` 来评估每个分子的药物相似性，该规则规定，为了表现出良好的口生物利用度，分子应具有不少于 5 个氢键供体 (HBD)、10\
  \ 个或更少的氢键受体 (HBA)、低于 500 Da 的分子量 (MW) 以及辛醇-水分配系数 (logP) 不大于 5。`Lipinski 五倍规则`的一个变体建议\
  \ `logP` 范围在 −0.4 到 +5.6 之间，摩尔折射率在 40–130 cm³ mol(−¹) 之间，`MW` 在 180–480 Da 范围内，原子数\
  \ (nAT) 为 20 到 70。此外，Veber 同事建议在分析化学物质潜在良好的口生物利用度时应仅考虑两个方面：极性表面积 (PSA) 低于≤140 Å，旋转键数量\
  \ (RBN) ≤10。使用 `AlvaDesc v1.0.14` 软件计算了上述六个最有前景分子的所有上述属性（见[表 16.6]）。从物理化学的角度来看，所有设计的分子均符合\
  \ `Lipinski 五倍规则`及其变体。\n\n表 16.6 为设计的分子计算的分子属性。\n\n| ID | HBD | HBA | MW (Da) |\
