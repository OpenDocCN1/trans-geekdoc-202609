  \n## 18.1 引言\n\n毫无疑问，利用机器学习进展的巨大机会在于数据科学与测量科学的交叉领域；算法可以指导测量的选择，而测量反过来可以作为算法的输入。在这个框架下，出现了两类通用的数据科学挑战。第一类是，高通量（HT）仪器产生的数据量不断增加，生成了随后可以进行挖掘的数据库[1]–[5]。此外，许多化学测量受到仪器、动力学或样本的限制，限制了实际可以进行以指导决策的测量数量。后一种情况是本研究的重点，我们引入了“大数据”工具来优化通过尽可能少的测量所产生的信息内容。\n\
  \n相比之下，大多数机器学习方法侧重于对大量预存数据（包括高通量仪器产生的数据）进行分析和训练。高通量筛选已应用于基于的微流控[6]–[10]、蛋白质工程[11]–[15]、代谢组学[16]–[20]、蛋白质组学[21]–[25]、药理毒学[26]–[28]、纳米材料合成[29]–[30]以及小分子合成优化的工作[30]–[31]。这些技术使研究人员能够在更短的时间内收集“大数据”，然后对其进行挖掘以进行模式分析和数据驱动的决策。\n\
  \n反之，机器学习方法已广泛应用于化学数据库的挖掘，涵盖了广泛的领域。算法已被证明具有预测化学活性[32],[33]、预测化合物性质[34]以及确定化学结构[35]–[36]的能力。Zhuo\
  \ 等人开发了一种仅根据成分准确预测无机固体带隙的机器学习模型[38]。模型使用支持向量分类区分金属和非金属，并使用支持向量回归预测带隙。结果比密度泛函计算更接近实验值。Coley\
  \ 等人使用图卷积神经网络预测反应产物[39]。该网络在 85% 的情况下准确预测了产物，比以前的方法有了显著提高。Turcani 等人使用随机森林算法预测了孔有机笼的形状和腔大小[40]。他们的模型在预测形状方面达到了\
  \ 93% 的准确率。这些进展使化学家能够利用其“大数据”做出具有影响力的发现。\n\n“大数据”工具的一个明显局限是要求数据必须很大。由于可用数据的内在稀疏性，许多耗时的实验与传统的机器学习方法并不匹配。一个说明性的例子是位于利物浦尔国家实验室的点火装置，那里拥有世界上最大、能量最高的激光[41]–[43]。该激光（正式由\
  \ 192 台激光组成）每年仅发射约 400 次（1⁻⁵ Hz 重复频率）。此类实验从机器学习工具受益的能力在于根据有限的先验信息优化选择下次实验条件。这种情况最好被描述为“小数据”问题，为整合到新兴的大数据基础设施带来了挑战和机遇。\n\
  \n这些挑战并非新鲜。与其随机的“散枪式”采样，在数据有限的情况下工作的实验室化学家通常会利用前一组测量结果来指导下一次条件的选择（更常见的是，知道要避免哪些条件）。选择下次实验的依据通常是结合迄为止的观察以及研究人员在类似场景下处理类似化合物的经验。将这一决策过程转移到机器学习平台，涉及既能够从相关分子系统的通用知识中捕捉化学家经验的方法，以及优化选择最有信息量的下一组实验的方法。\n\
  \n\n\n\n自主仪器应与自动化仪器区分开来。许多现代实验室通过将以前由手工完成的过程完全自动化，已经提高了实验吞吐量。化学测量科学领域新兴的革命在于将科学方法中的假设制定和实验设计步骤自动化。通过将这些任务委托给算法，可以闭合环路，减少科学方法中的人工干预。\n\
  \n本章的其余部分将深入探讨与机器学习算法和自主仪器相关的课题，以便在“小数据”情况下进行优化数据采集；在这种情况下，实验次数受到时间、样本或成本的限制。关于自主实验设计和执行的概述将详细介绍利用算法产生自主科学决策来实施实验的策略。将详细介绍一种自主化学架构，该架构基于从稀疏采样化学空间概念发展到动态采样化学空间，最后是一种应用于化学成像的动态采样的监督学习方法。此外，还将详细讨论化学背景下使用的算法面临遭受对抗性攻击的风险。讨论表明，降维技术可能易受到对抗性攻击的影响，并为自主科学中基于机器学习的分类器的通用鲁棒性提供了相关背景。文中还讨论了一些提高针对对抗攻击和虚假误分类的通用稳定性的建议和方法。\n\
  \n## 18.2 自主实验设计\n\n自主科学既需要独立行动的能力（自动化），也根据不断演化的知识做出独立决策（智能）。本章的重点完全在于后者，因为在许多支持高通（HT）分析的现代仪器上，自动化在很大程度上是一个解决的问题。自主系统是一个“专家”，能够整合新信息以修订主导假设并引导改进。这个定义可以分解为两个关键组成功能：获取新信息和选择未来实验。这里的重点主要落在旨在减少与绘制化学空间相关的实验负担的自主系统。初步讨论将集中在自主系统运行的一项前提能力：从先之前采样的数据中推断预期实验结果的能力。固定模式稀疏采样策略将用于说明为这一目标可以采取的一些方法。稀疏采样的讨论之后是对动态采样方法的综述，这些方法旨在以最少的测量次数重建化学空间。这些方法与固定模式稀疏采样策略的区别在于，可以利用实时实验观察来即时指导未来的实验。将讨论各种动态采样算法，首先是在直观简单的化学成像背景下，随后是在更抽象的化学空间背景（例如活细胞培养中的蛋白浓度）下。本节将最后对具有多个自主仪器的模块化自主实验室进行简要讨论，这些实验室利用集成各种模块（如通信、数据库、机器人、表征、学习和分析）的先进软件来绘制复杂的特征空间。\n\
  \n### 18.2.1 应对“小数据”挑战的稀疏采样策略\n\n在单次实验相对昂贵的情况下，构建实验地图是一项重大挑战。\n\n\n\n\n在之前的研究中，稀疏采样模式（如随机采样、低差异采样和利萨如曲线轨迹（Lissajous\
  \ trajectories））被用于加速数据采集。Simpson 及其同事开发了一种基于利萨如曲线轨迹成像的光束扫描光学显微镜，在多个同步数据采集通道上实现了高达\
  \ kHz 帧率的光学成像。(57,58)）。他们使用两个快速扫描共振镜引导光束在视场内沿曲折轨迹移动，并使用 `inpainting` 算法对未采样的像素进行插值。\n\
  \n一旦采集了稀疏采样的数据，`inpainting` 算法的任务就是预测未采样条件和位置的值。如果仅考虑测量值之间的局部相关性，可以使用平滑函数进行插值。Garcia\
  \ 及其同事开发了一种 `inpainting` 算法，该算法通过执行平滑函数来填充任意维度数据集中的缺失数据点。(59,60) 该算法使用惩罚最小二乘回归预测缺失值。需要最小化的代价函数如\
  \ eqn (18.1) 所示，其中 `y` 是稀疏采样数据集，`ŷ` 是平滑插值后的数据集，`‖ ‖` 表示欧几里得范数，`s` 是控制平滑程度的参数，`P`\
  \ 是表示平滑后数据集粗糙程度的惩罚项，定义为 `P(ŷ)=‖Dŷ‖²`，其中 `D` 是三对角矩阵，描述了采样像素之间的距离。\n\n![image](img/eqn18-1.jpg)\
  \ (18.1)\n\n`F(ŷ)` 的最小化得到了 eqn (18.2) 中的线性方程组，其中 `I` 是单位矩阵。\n\n![image](img/eqn18-2.jpg)\
  \ (18.2)\n\n为了考虑到缺失数据点，在 eqn (18.2) 中用对角矩阵 `W` 替换 `I`，其中对角元素 `W[ii]` 在 `y[i]` 缺失时等于\
  \ 0，在 `y[i]` 存在时等于 1。\n\n![image](img/eqn18-3.jpg) (18.3)\n\nEqn (18.2) 和 (18.3)\
  \ 可以通过离散变换求解。当采样数据均匀时，可以使用离散余弦变换。\n\n其他算法超越了局部相关性。Bouman 及其同事已经演示了 `inpainting`\
  \ 去采样技术。(61) 在 `MBIR` 中，事实上的去采样是通向去采样的关键步骤。(59)这类方法被称为动态采样，能够实现更快速去采样。(62)–64](#BK9781788017893-00450.xhtml#cit64))\n\
  \n### 18.2.2 用于自主实验设计的单纯形方法\n\n自主设计的早期工作侧重于化学合成和通过单纯形（simplex）进行优化。单纯形是一种特定的动态采样，将某些化学空间映射到具有任意数量顶点和边的几何表示上。从多面体的一个顶点开始使用单纯形。\n\
  \nNelder 和 Mead 详细描述了用于函数最小化的改进单纯形算法。(65) 对于无约束的 `n` 变量函数，首先通过在参数空间采样 `n+1` 个点来最小化。每个采样点都是单纯形的顶点，这便是该方法的名称。为了最小化目标函数，首先计算每组参数的输出。然后将目标函数值最高的顶点（即性能最差的参数集）关于剩余顶点的超平面进行反射，跨越该平面的质心。根据新点是否优于之前的顶点，可以利用扩展或收缩操作，这些操作根据目标函数在反射点附近的局部曲率移动采样位置。通过迭代，该过程将生成一个收敛于目标函数最小值的单纯形，即单纯形的体积将围绕最小点收敛。图\
  \ 18.3 展示了二维优化的过程。\n\n![image](img/bk9781788017893-00450-f3.jpg)\n\n图 18.3 二维单纯形优化步骤。初始单纯形由顶点\
  \ ABC 定义。计算每组参数的目标函数值，并发现 B 是最差的输入。关于线段 AC 的质心生成反射点 B*。随后，算法可以根据局部曲率扩展单纯形（接受新顶点\
  \ D 替换 B*），或收缩单纯形（用 E 替换 B*）。\n\n\n\n\n从 20 世纪 70 年代开始，单纯形算法被应用于化学自动化领域，包括闭环自动化合成平台的诞生。(64,66,67)其他工作利用单纯形算法在\
  \ EDTA 存在的情况下生成与 Ti(IV) 络合的 H[2]O[2]；对试剂进行自动注射，随后进行吸光度谱测量，并增加等待时间以评估产品的稳定性。(68)Denton\
  \ 及其同事对火焰光度计中气溶胶输送的优化是一个简单的例子，它阐明了如何利用单纯形程序进行自动化分析。(66)在这项工作中，气溶胶喷嘴的物理位置是优化空间，步进电机控制正交轴上的\
  \ `x` 和 `y` 位置。其目标是在 422.7 nm 的钙发射线处检测到最大的信号。以图 18.3 为模板，考虑使用三组独特坐标来测量钙发射的情况，分别由顶点\
  \ A、B 和 C 表示。发现顶点 B 产生的信号量最低，因此通过跨越 AC 线反射生成一个新顶点。在新顶点 B* 处的测量结果决定了单纯形是保持在这一新位置、扩展还是收缩。该过程的数学细节在文献\
  \ 65 中有详尽描述。尽管这些最初基于单纯形的自主化学实验方法使用了相对简单的算法，但它们说明了自主实验中动态采样方法的通用架构，尽管存在一个关键区别。单纯形方法旨在优化单个函数，并仅返回最优值。相比之下，下述的动态采样方法使用各种插值和重建算法重建一个完整的目标函数。通过映射目标函数的整个空间，动态采样方法可以解决更复杂的化学问题，例如化学分类。\n\
  \n### 18.2.3 用于动态采样的插值算法\n\n动态采样是自主仪器中的关键组件，因为它就针对目标目标进行最有益的实验提供实时反馈。动态采样可以通过增加每次实验的价值，使仪器的性能超越自动化高通量（HT）系统。\n\
  \nNotingher 及其同事开发了一种用于拉曼显微镜的动态采样算法，通过实时为每个未测量的像素分配评分来确定信息量最丰富的采样位置。(69,70)每个未采样像素的得分通过两种不同插值算法（立方样条值和\
  \ Kriging 插值）预测值之间的差计算得出。重建算法差异最大的像素位置被视为信息量最丰富的像素，然后被选中进行测量。由于插值算法的整合，该方法在效率上比随机采样有所提高。对于生物组织成像，该方法与光栅扫描相比，采样时间缩短了多达\
  \ 30 倍，且具有足够的谱噪比识别单个组织结构。\n\n进一步提高动态采样性能的策略之一是使用在分析前经过训练的算法。这种方法是一种用于动态采样的监督学习方法（SLADS），通过针对所研究样本的训练数据来提高动态采样算法的准确性。\n\
  \n### 18.2.4 用于动态采样的监督学习方法\n\nBouman 及其同事开发的 SLADS 算法是理解自主实验室工作流通用架构的一个说明性案例研究。(62–64)SLADS\
  \ 使用基于机器学习的算法在实时测量期间选择下一个信息最丰富的采样位置。然而，与其他动态采样算法不同，SLADS 使用具有已知真值（ground truth）的训练数据来训练算法计算每个采样位置的预期失真减少（ERD）。利用这种训练，SLADS\
  \ 能够在不显著损失图像质量的情况下，大幅减少重建图像所需的测量次数。SLADS 的理论框架通过图 18.4 中的流程图以及公式 (18.4–(18.6) 得到证明。\n\
  \n\n\n\n在最近的研究中，SLADS 在点成像技术中显示出广泛的应用，例如共聚焦拉曼光谱、同步辐射 X 射线衍射成像和扫描电子显微镜（SEM）。Simpson\
  \ 及其同事将 SLADS 应用于共聚焦自发拉曼成像，这是机器学习方法用于稀疏采样拉曼成像的早期尝试之一。(52) 将 SLADS 集成到光束定位的反馈中，实现了对位置选择和数据采集的全自主控制。通过这种方法，仅需\
  \ 15.8% 的采样率即可以 >99.5% 的准确率获取药物材料的化学图像，与传统的光栅扫描方法相比，测量时间减少了约 6 倍。\n\nSLADS 算法旨在图像中选择最佳采样位置，而拉曼图像中的每个像素都包含含有数千个元素的拉曼光谱。因此，通过对获取的拉曼光谱进行预处理和分类，以识别特定位置测量的化学成分，从而实现了\
  \ SLADS 在拉曼光谱的应用。随后，SLADS 根据根据预测类别中最大的不确定性来选择下一个像素。分类通过结合两种监督学习算法实现：线性判别分析（LDA）和支持向量机（SVM）。(71,72)\
  \ 使用 LDA 进行初始降维，随后通过 SVM 在数据空间中构建最优超平面以分离不同的数据点簇进行分类。反复迭代 SLADS 算法，直到重建图像的最大重建误差（ERD）收敛至阈值以下。\n\
  \n执行了模拟随机采样实验，以比较 SLADS 与其他替代稀疏采样方法的性能和效率。图 18.5D 显示了随机采样和 SLADS 的图像重建误差；随机采样在 15%\
  \ 采样率下的误差为 4.65%，是 SLADS 误差的 20 倍。从随机采样获得的大多数分类错误像素位于不同类别样本颗粒的边界处。从图像分析的角度来看，与图像与其他位置相比，这些边界被认为包含高空间频率信息，这意味着边界是测量中最模糊且信息丰富的位置。随机采样不会根据不同位置的不同空间频率调整其测量密度，这显著降低了其效率。SLADS\
  \ 调整了测量密度，并选择性地测量更多具有高空间频率信息的像素，从而以比相同采样率下随机采样更低的误差百分比实现了图像重建。\n\n![image](img/bk9781788017893-00450-f5.jpg)\n\
  \n图 18.5 使用 SLADS 进行拉曼光谱成像。(A) 仪器原理图，显示了带有双光电扫描镜对的拉曼显微镜。SLADS 实验通过自动控制镜对进行，将激光束置在具有最高\
  \ ERD 的像素处。(B) 每个采样像素分类后的动态采样图像。(C) 使用经过训练的 SLADS 算法重建的图像。(D) 比较随机采样与动态采样之间重建误差的图表。经美国化学学会许可，改编自文献\
  \ 52，版权 2018。\n\nSimpson 及其同事还将 SLADS 算法应用于同步辐射 X 射线衍射实验，由于晶体定位，显著减少了剂量和测量时间。(54)\
  \ 同步辐射设施的大分子衍射需要晶体对中，而 X 射线衍射成像作为一种定位机制越来越流行。在 X 射线光栅扫描中，通过检测散射图中的类布格峰来识别晶体位置。然而，这种额外的\
  \ X 射线暴露可能会导致晶体在数据收集之前产生可检测的损伤。SLADS 以总体积的 31% 和晶体内部的 9% 采样重建了 X 射线图像，大大减少了晶体上的\
  \ X 射线剂量。在阿基根国家实验室的光子束线上实施时，仅需采样 3% 的图像（对应于晶体的约 5%）就获得了可接受的重建结果。动态采样非常适用于单像素获取成本限制整体成像时间的问题，这与本文描述的衍射成像是一致的。这里的成本不仅在于测量时间，还由于\
  \ X 射线诱导损伤导致的样本完整性。\n\nSLADS 是加速 2D 成像的强大工具，但向更高维的扩展仍待证明。从概念上说，可以通过引入时域信息或第三空间维度来简单地扩展维度。添加化学成分随时间的变化为这些测量增加了另一层复杂性。然而，维度灾难使得高维重建变得难以解决。随着维度的增加，测量空间体积快速增长也增加了数据的稀疏性。为了获得可靠的统计显著性，数据量应随维度指数级增长。此外，降维方法也变得越来越具有挑战性，要么是因为在低维空间实现相同分辨率需要更多训练数据，要么是因为协方差模糊了维度。因此，促进扩展到高维的关键步骤是能够生成稳健降维技术和克服这些挑战的分类器。因此，理解这些机器学习方法何时以及如何失效将有助于自主测量方法扩展到更高维度，如第\
  \ 18.3 节关于对抗攻击策略的详细描述。\n\n### 18.2.6 用于自主实验设计的非迭代动态采样\n\n动态采样应用于复杂化学空间的一个示例是由 King\
  \ 及其同事完成的，他们构建了一个名为“Adam”的机器人科学家，能够在功能基因组空间中生成并测试假设。(73) Adam 的设计旨在几乎完全自主地测量微生物样本的生长率。在这项工作中，机器人被用于确定编码酵母生物\
  \ S. cerevisiae 中某些酶的基因。Adam 利用数据库中关于 *S. cerevisiae* 功能基因学的先验知识来选择最具信息量的实验。Adam\
  \ 对 13 对基因与酶之间的关系生成了 20 个假设（例如基因 X 编码酶 Y）。在执行实验并分析数据后，Adam 确认了 20 个假设中的 12 个（零假设\
  \ `P<0.05`）。研究人员通过表达 Adam 认为编码酵母酶的蛋白质，验证了 Adam 的部分结果。对表达蛋白的人工酶活性证实了 12 个结论中的三个，而对科学文献的审查为其中六个结论提供了有力证据，并揭示了机器人一个结论可能存在错误。\n\
  \n\n\n\n\nAdam 开发的关键创新在于整合了模型、数据库和软件，使得这种自主基因组学实验成为可能。一种逻辑模型设计代谢物为节点、以酶为节点间的连接，用于编码关于\
  \ `S. cerevisiae`（酿母菌）代谢的知识.^(74) 连接基因与其编码蛋白质的信息获取自生物信息学数据库，这些信息反过来为 Adam 使用的假设生成软件提供支持。如图\
  \ 18.6 在 `S. cerevisiae` 模型中找到所有孤儿反应（酶未与已知基因连接），2) 确定这些反应中哪些会影响细胞生长，3) 找到这些反应的酶学委员会（EC）分类，4)\
  \ 在其他生物体中找到表达相同 EC 分类酶的基因，5) 在 `S. cerevisiae` 中找到与这些其他生物体中的基因具有相似序列的基因，6) 建立基因与孤儿酶之间关系的假设。额外的软件被用于实验设计、实验室自动化和数据分析。\n\
  \n![image](img/bk9781788017893-00450-f6.jpg)\n\n图 18.6 Adam 使用的动态采样框架图。首先，考虑物种中所有已知的孤儿酶。然后，根据预定义的一系列标准（对细胞生长的影响、与其他生物体中特征良好的酶的相似性等**）选择性地消除候选酶。根据最可能的假设选择最关键的实验。\n\
  \nAdam 使用的实验选择程序与其他动态采样方法不同之处在于它是非迭代的。Adam 的设计目的是从各种数据库和模型中合成知识，将可能的实验集合缩小到最具信息量的假设。相比之下，动态采样领域的更较新的工作探索了从实时实验结果生成*从头开始（*de\
  \ novo*）假设的能力，在本章其他地方有描述（18.2.3–18.2.5, 18.2.7–18.2.9）。由于数据库中可用大量信息，Adam 的非迭代框架非常适合手头的功能基因组学问题。在具有高数据库可用性的类似领域的实验也可以从非迭代动态采样方法中受益。\n\
  \n### 18.2.7 主动机器学习\n\nMurphy 及其同事在应用主动机器学习研究活性化合物对细胞内蛋白质的影响方面，在自主生物化学研究领域取得了创新性工作。主动机器学习简单来说是一种基于观测数据的实验设计策略，该策略动态调整实验以考虑实时测量值.^(75–78)在本章的其他地方，我们将主动机器学习称为动态采样。在他们的首次发表中中，Murphy\
  \ 及其同事通过药物活性对基因表达的模拟和实验结果测试了他们的主动机器学习算法.^(79)本工作中展示的主动机器学习过程见图 18.7。(A) 实验根据目标和条件进行编码。(B)\
  \ 根据实验测量揭示的表型对样本进行聚类。(C) 根据表型分布识别目标与条件之间的相关性。(D) 根据预测模型中的空白选择下一组实验。重复步骤 B–D 直到满足停止条件。\n\
  \n![image](img/bk9781788017893-00450-f7.jpg)\n\n图 18.7 由 Murphy 及其同事描述的主动机器学习过程。(A)\
  \ 样本根据目标和条件进行编码 (B) 根据实验观测将样本聚类为表型。(C) 识别目标、条件和表型之间的相关性。(D) 选择下一组实验。复自文献 79，[`doi.org/10.1371/journal.pone.008396`](https://doi.org/10.1371/journal.pone.008396)，根据\
  \ CC BY 4.0 许可，[`creativecommons.org/licenses/by/4.0/`](https://creativecommons.org/licenses/by/4.0/)\n\
  \n这种方法（以及动态采样方法）的关键组件是用于未来测量的底层预测模型。在该工作中，预测模型由描述对目标和条件的表型依赖性的分布组成。该模型使用聚类算法构建的，这些算法还识别了相关性并产生了分布，共同构成了预测模型。这项工作使用了\
  \ `Greedy Merge` 和 `B-Clustering` 算法。在这种主动机器学习方法中，根据每个未观测实验的评分选择下一个实验。一个未观测实验可能被多个预测分布描述并具有多个预测表型。预测表型最多的实验被认为是最有效的实验，并被选择进行分析。\n\
  \n在他们的第二次发表中，Murphy 及其同事将主动学习算法集成到仪器中，以实现实验中的自主科学.^(80)他们研究了 48 种化学化合物对 48 种蛋白质亚细胞定位的影响。实验是使用自动荧光显微镜、用于细胞培养和化学化合物的自动液体处理机器人以及自动图像分析软件进行的。产生了\
  \ 48 个表达不同 EGFP 标记蛋白的不同克隆，并用 48 种不同化合物之一进行处理。主动机器学习算法根据之前的结果实时引导仪器选择下一个实验的蛋白质药物对。在选定药物加入培养基六小时后，使用荧光显微镜对细胞进行成像。EGFP\
  \ 标记蛋白的亚细胞定位是通过图像分析方法确定的，该方法为每个细胞产生描述蛋白质和 DNA 染色相对位置的向量表示.^(81–84) 在数据采集期间更新预测模型，直到满足停止标准。实验结束时，自主仪器在仅采样\
  \ 29% 的可能实验的情况下实现了 92% 的准确率。\n\n### 18.2.8 材料合成的动态采样\n\n\n\n\n材料合成领域的研究也利用了自主化学测量，正如空军研究实验室的\
  \ Maruyama 及其所示，他们开发了一套自主研究系统（`ARES`）。`ARES` 通过自动化生长反应器、快速原位（in situ）表征和 AI 系统的结合，优化了单壁碳纳米管（CNTs）的生长速率。该系统利用\
  \ AI 规划器迭代地提出新实验，以便在没有底层物理过程先验（a priori）知识的情况下，优化 CNT 的生长速率。在每次实验中，通过化学气相沉积法合成 CNTs，在此过程中生长条件（温度、压力以及乙烯、氢气和水蒸气的分压）发生了变化。使用激光同时对样品加热并作为拉曼光谱的激发源。特征拉曼带强度的变化被用作\
  \ CNT 生长速率的读数，实验确定的生长速率则作为 `ARES` 系统优化 CNT 生长速率的反馈机制。\n\n`ARES` 系统使用随机森林模型对未测试条件下的\
  \ CNT 生长速率进行预测。随机森林是一种与决策树相关的机器学习方法。决策树是一种算法，通过一系列分支的决策节点对数据集执行分类或回归，其中使用最具判别性的特征将数据集划分为两个子集。随机森林简单来说是一组决策树，其中每棵决策树都使用训练数据的随机子集和随机特征集来划分数据。随机森林中所有决策树的平均响应被用算法的输出。在这种情况下，提供了一组\
  \ 84 个用户设计的初始实验作为训练集给随机森林模型，使其能够在自主模式下运行。随后，随机森林模型预测能够实现用户指定目标生长速率的实验条件。在每次实验后，都会更新随机森林模型以考虑最新结果，并进行预测生长速率最接近**的实验。这一过程不断迭代，直到预测值与实验测量的生长速率之间的差异收敛在实验结果的噪声水平内。[图\
  \ 18.8] 显示了 `ARES` 系统产生的 CNTs 的扫描电子显微镜（SEM）图像。图像显示了生长速率分别为 a) `500 s^(−1)`、b) `3000\
  \ s^(−1)` 和 c) `16 000 s^(−1)` 的样本。证明 `ARES` 设计、执行和分析自身实验的速度比传统实验快 100 倍，代表了材料科学中自主研究系统的早期演示。\n\
  \n![image](img/bk9781788017893-00450-f8.jpg)\n\n图 18.8 `ARES` 系统产生的 CNTs 的 SEM 图像。图像显示了\
  \ CNT 生长速率 (a) 500、(b) 3000 和 (c) 16 000 (s^(−1))。比例尺为 500 nm。重录自文献 [85]，[https://doi.org/10.1038/npjcompumats.2016.31]，根据\
  \ CC BY 4.0 许可协议 [https://creativecommons.org/licenses/by/4.0/] 的许可条款发布。\n\n###\
  \ 18.2.9 用于自主实验设计的模块化架构\n\n前几个章节侧重于实验的自主设计，其中通常只有一个自主代理在控制整个过程。在每种情况下，都进行了单次测量，然后为选择下一个最佳参数集提供反馈。如果需要多个仪器来探测感兴趣的化学问题，则需要一个中心枢纽来控制仪器之间的通信、实验执行、目标函数的评估以及下次实验的选择。[图\
  \ 18.9] 说明了一种可用于自主实验室的可能架构。\n\n![image](img/bk9781788017893-0450-f9.jpg)\n\n图 18.9\
  \ 自主实验室的示例模块化布局。数据处理被分为两个通用协议：通信（数据从一个模块传输到另一个）和学习（中心利用可用数据生成模型）。右侧的每个模块被视为整个架构的独立元素，允许根据需要添加新模块以扩展功能。\n\
  \n为了说明中心枢纽如何与各个模块交互，考虑一个假设场景，其目标是烹饪最美味的煎蛋包。在描述的场景中，每个模块都有信息的输入和输出。首先，枢纽可能会通过其数据挖掘模块访问互联网，提供目标数据库输入。数据挖掘模块配备了多种数据挖掘方法，包括提取视频格式教程的图像视频分析工具，以及从互联网挖掘食谱的文本学习模块。这些模块独立访问并学习数据的特征。然后，学习到的特征被传回中心枢纽，枢纽将这些特征与“实验中机器学习”模块相关联。该模块可用于生成回归模型，预测关键变量，例如鸡蛋数量、烹饪容器的温度、添加的盐量、烹饪时间等等。该模块与数据挖掘模块不同，因为它遵循主动学习/动态采样架构，可以整合实验收集的后续信息。回归模型反馈给枢纽，然后调用假设生成模块来预测最优煎蛋包的参数集。有了预测的参数集，枢纽必须通过通信激活控制打碎鸡蛋、搅拌鸡蛋、添加其他配料等的机器人。每个机器人动作都伴随着模块的激活以启动任务，且程序运动的成功执行会将完成信号返回给枢纽，以启动后续的机器人动作。在这个例子中，烹饪过程的开始对应于仪器的激活。烹饪完成后，枢纽接收到完成指令。由于煎蛋包的美味程度需要人工测试，枢纽可以提示用户输出已就绪。可以从用户处获取有关煎蛋包质量的各种反馈，如味道、温度、口感、嗅味等反馈。这些反馈反过来可以从通信模块通过枢纽循环回机器学习模块，以改进模型。\n\
  \n\n\nAspuru-Guzik 及其同事在自主科学的多仪器集成前沿取得了进展，他们开发了 `ChemOS`，一种用于运行自主实验室的软件。`ChemOS`\
  \ 由一组模块或函数组成：(i) 通信、(ii) 数据库、(iii) 机器人、(iv) 表征、(v) 学习和 (vi) 分析。通信模块实现了 `ChemOS`\
  \ 与研究人员之间的交互，而学习模块旨在根据先前的结果为新实验建议参数。该模块提供实时反馈，以建议更具信息量的实验，从而高效调查应用空间。`ChemOS` 已应用于多种实验，证明了该软件解决不同领域问题的多功能性。Aspuru-Guzik\
  \ 及其同事展示了`ChemOS` 可以通过混合染料溶液的实验来描绘“颜色空间”，根据研究人员的反馈学习“龙舌兰日出（Tequila Sunrise）空间”以优化鸡尾酒口味，并为直接进样\
  \ HPLC 分析的机器人采样序列进行校准。这种用于指导自主科学的模块化框架的灵活性表明，它可以应用于各种研究背景。\n\n实现自主实验室的模块化架构允许以动态方式集成新的实验探针和模型。这在“小数据”领域尤为强大，因为单次测量成本高昂或耗时。在可以利用数据库信息的场景下，模块化框架能够根据先前的实验生成模型，并通过动态采样方法提供持续优化。考虑到这一点，至关重要的是，对于许多化学问题，很少有现有数据可以用于构建，因此，机器学习方法在范围和应用上可能会受到限制。下一节将讨论用于解决图像分析中类似问题的现有机器学习方法，重点介绍生成对抗网络（`GAN`）以及一个具有说明性的线性类比示例。\n\
  \n## 18.3 针对数据限制训练的生成对抗方法\n\n上一节强调了集成预训练机器学习工具的益处，这有助于优化减少为化学决策提供信息的样本数量，并支持实验的自主设计。相比之下，本节的重点回到了流水线的上一个层级，关注在面对有限或昂贵的训练数据时，如何优化训练机器学习和传统的化学分类工具以完成这些及其他任务。例如，第\
  \ 18.2.5 节描述的动态采样方法使用拉曼光谱分析来确定图像每个空间位置的成分。该算法使用 `LDA` 进行降维，使用 `SVM` 进行分类边界的识别，这两者都需要较大的训练集来优化。同样，人工神经网络（`ANN`）中可用于优化的大量参数通常无法通过“小数据”输入进行稳定训练，这进一步加剧了在数据稀疏场景下利用机器学习工具的挑战。\n\
  \n生成对抗策略在解决数据受限场景下的许多最隐蔽的训练挑战方面取得了巨大成功。对抗方法支持生成额外的训练数据，这些数据在理想情况下是与原始输入具有相似的底层概率密度函数（`pdf`）随机生成的。如果数据确实来自相同的\
  \ `pdf`，那么它们将与额外实验测量获得的结果是不可区分的。在实践中，生成的输入效用取决于小数据输入在多大程度上捕捉了 `pdf` 的底层特征，以及这些特征通过算法提取的完备程度如何。本节的目标有三点：i)\
  \ 回顾之前使用对抗攻击和通用对抗网络解决非线性问题（例如图像和语音识别）的成功案例，作为扩展到化学应用的基础；ii) 通过在基于更简单的线性光谱分析的更直观模型中设计类似的效应，提高对对抗攻击“内部”操作的理解；iii)\
  \ 为在光谱分析中整合生成对抗攻击奠定。\n\n### 18.3.1 图像识别中生成对抗网络的回顾\n\n`ANNs` 在使用大型数据库训练时设计用于优化性能。`ANN`\
  \ 每个隐藏层中的大量权重共同构成了大量的可调参数，这通常需要大量的训练数据才能可靠训练。在缺乏足够训练数据的情况下，参数与输入之间的差异会导致 `ANN` 输出的统计置信度较低。简之，有限的数据量无法提供足够的约束来防止神经网络架构中的欠确定性。在这种情况下，使用有限数据训练的神经网络可能会产生错误结果或在测试数据分类上置信度较低。\n\
  \n即使在使用较大的的数据集进行训练，`ANN` 权重中表现出的残差噪声贡献仍然存在。在这种情况下，降维后的分类容易受到隐藏“陷阱”的影响。机器学习方法（例如卷积神经网络）对输入数据中伪变化的敏感性已有大量报道。\n\
  \n\n\n\n# 图 18.10 视觉错觉示例：阿德森棋盘阴影。在左图中，区域 `B` 看起来比区域 `A` 亮。在右图中，添加了两个灰色条作为参考，显示出区域\
  \ `A` 和区域 `B` 的亮度相同。经许可自 E. H. Adelson，收录 *On seeing stuff: The perception of materials\
  \ by humans and machines*，Conference on Human Vision and Electronic Imaging VI,\
  \ San Jose, Ca, Jan 22–25; Spie-Int Soc Optical Engineering: San Jose, Ca, 2001;\
  \ pp. 1–12。\n\n对抗攻击在定性上与此相似，但在选择最优攻击时，定量结果有巨大差异。具体而言，由于训练数据集规模有限，神经网络权重中产生的残差噪声通常作为对神经网络分类器发起攻击的“把手”。因此，恶意扰动通常被设计成人类直观检查难以识别的，但对机器学习算法的分类产生深远影响。[图\
  \ 18.11] 展示了手写识别中的对抗攻击示例，这种攻击的效果在事后很容易被合理化。改变手写输入中的几处点会导致数字 `1` 被识别为数字 `4`。仔细观察此示例可以发现，图像中添加的点实际上可以用线连接成一个\
  \ `4` 的形状——这里的神经网络对这些特定像素赋予了足够的权重，以抵消缺乏真实连接的影响，从而生成了完整的 `4` 形状。然而，随着图像维度的增加，对扰动进行追溯性的合理化变得越来越难以直观。\n\
  \n![image](img/bk9781788017893-00450-f11.jpg)\n\n# 图 18.11 对手写识别的对抗攻击。对抗样本（底行）通过轻微修改合法样本（顶行）产生，从而强制模型做出错误预测，而人类可能会正确地分类该样本。经许可自\
  \ N. Papernot, P. McDaniel and I. Goodfellow，Transferability in machine learning:\
  \ from phenomena to black-box attacks using adversarial samples. *arXiv preprint\
  \ arXiv:1605.07277* 2016。\n\n在讨论对抗攻击时，区分在攻击设计之前已知已训练分类器的架构和权重的模型攻击，与这些信息未知的情况很有用。对攻击者完全了解分类结构和权重的网络进行的攻击被称为**白盒攻击**，在这种情况下，通常可以通过解析法计算最优扰动，以针对给定的输入和目标有效地欺骗分类器。攻击策略可以多种多样，针对不同的图像特征。在最常见的实现中，神经网络的反向传播允许确定指向分类边界的最陡梯度，这对应于诱导特定错误分类所需的最小扰动。相比之下，攻击者只能获取分类结果的攻击被称为**黑盒攻击**——此类方法依赖优化方法来生成输入数据的扰动，以产生所需的分类结果。\n\
  \n[图 18.12] 展示了白盒攻击的示例，其中在熊猫图像上添加优化的细微扰动，导致 `GoogLeNet` 图像分类器确信地将图像误分类为长臂猿。在这种攻击中，扰动的元素等于代价函数对输入梯度元素的符号，这种方法被称为快速梯度符号法。直观上，这种方法可以解释为识别分类不确定性最大的方向，并对输入数据\
  \ `x` 添加最小推力。缩放因子 `∈=0.007` 是 8 位图像编码器转换为实数后最小位元的幅度。值得注意的是，这种方法并没有将分类器指向特定结果，而是利用对训练代价函数的完整知识，以最小代价将分类器推向错误的结论。\n\
  \n![image](img/bk9781788017893-00450-f12.jpg)\n\n# 图 18.12 应用于 ImageNet 上 `GoogLeNet`\
  \ 的快速对抗样本生成演示。通过添加不可察的微小扰动，`GoogLeNet` 对图像的分类被显著改变。经许可自 I. J. Goodfellow, J. Shlens,\
  \ and C. Szegedy，Explaining and Harnessing Adversarial Examples. *arXiv e-prints*\
  \ (2014)。\n\n在许多情况下，优化攻击模式的解析解是未知的，此时仅凭神经网络对给定输入的输出即可指导攻击的优化。此类黑盒攻击向输入数据添加微小扰动，测试分类器性能，然后通过数值迭代优化扰动，以实现受代价函数限制的分类置信度。Kevin\
  \ Eykholt 和合作作者展示了一个黑盒攻击的示例，其中扰动被确定会引起图像识别算法对交通标志图像的误读。在这种黑盒攻击中，他们能够通过人类检查难以合理化的扰动，诱导将停止标志误分类为\
  \ `45 mph` 限速标志。在不知道交通标志分类背后的神经网络的情况下，攻击模式从模拟物理动力学（在本例中变化的距离和角度）的分布中采样，并使用掩码将计算出的扰动投影为类似于涂鸦的形状。这种攻击欺骗了两个卷积神经网络\
  \ `LISA` 和 `GTSRB-CNN`，置信度超过 85%。\n\n尽管这些对抗攻击策略在人工神经网络（ANN）中取得了成功，但许多 ANN 固有的非线性本质使得对攻击内在敏感性以及优化攻击模式起源的直观合理化变得复杂。ANN\
  \ 最大的优势可能在于它们通过耦合但高度非线性的变换利用底层模式的能力。然而，ANN 中模式匹配相关的内在非线性性极大地增加了将其映射到谱分析中常用的更直观、易处理的线性框架的难度。要直观理解\
  \ ANN 的优缺点已足够困难，而要解释其数值生成的对抗攻击则更具挑战性。\n\n## 18.3.2 对抗攻击的说明性线性示例：对抗光谱学\n\n在数据受限的情况下，ANN\
  \ 中的许多此类训练挑战在经典的线性降维方法中有直接的对应物，这为解释这些潜在数值不稳定性的起源提供了一个显著更直观且易处理的背景。当用于图像、声音或光谱分类时，神经网络可以被视为降维方法，其中图像或光谱空间中的高维对象产生低维的分类输出。因此，如\
  \ `PCA` 和 `LDA` 等线性降维方法可以作为简单的 ANN 替代方案，用于解释对抗攻击的设计和执行，这正是本节的主题。\n\n\n\n\n\n作为一个说明性示例，将人工神经网络（ANNs）的降维/分类与用于光谱分类的传统\
  \ LDA 进行比较是很有用的。在 `LDA` 中，使用有监督输入来识别一个新的低维空间，该空间旨在最大化被分类输入项之间的分辨率。最大化分辨率在数学上等同于最大化\
  \ Fisher 线性判别量。对于光谱空间中给定的投影 `w`，对应的 Fisher 判别量 `J` 值由 eqn (18.7)给出，其中矩阵 `S[w]` 和\
  \ `S[B]` 分别对应类内和类差/协方差矩阵。\n\n![image](img/bk9781788017893-00450-t3.jpg)(18.7)\n\n\
  在数学上，光谱空间中使 `J` 值最大化的方向可以通过求解 eqn (18.8)中的特征向量/特征值问题找到。\n\n![image](img/eqn18-8.jpg)(18.8)\n\
  \n扩展到多类时，向量 `w` 可以替换为矩阵 `W`，以产生与 `LDA` 生成的降维坐标相应的特征向量集。\n\neqn (18.8)中的矩阵求逆步骤为数据受限的应用提供了潜在的不稳定性来源，这与\
  \ ANNs 的数据受限训练直接类比。具体而言，仅仅当训练光谱的数量大于给定光谱的长度时，`S[w]` 矩阵才是非奇异且在形式上可逆的。当训练数据有限且未满足此标准时，直接使用数值方法估计矩阵求逆操作来应用\
  \ `LDA` 会导致维度选择性很差，极易发生“过拟合”，在这种情况下，数据内部的噪声贡献会显著或主导维度选择，以最大程度地解析分类数据。即使训练数据数量超过了光谱空间的维度，矩阵\
  \ `S[w]` 通常仍然没有足够的过定性，以消除降维用载荷向量中噪声的显著贡献。因此，虚假的噪声贡献可能导致误分类或低统计置信度的分类。在 `LDA` 中，这种对噪声的敏感性在检查“载荷图”（loading\
  \ plots）时显而易见，载荷图对应于每个光谱投影到的光谱空间方向，以便生成 LDA 空间中相应的位置。针对一个模拟的拉曼光谱训练集展示了代表性的载荷图，该集仅足够（1424\
  \ 条光谱）以满足非奇异性要求，见 Figure 18.13\n\n图 18.13 不同数量模拟训练光谱的 `LDA` 载荷图对比。一组原始的 267 条实验拉曼光谱用来自相同统计分布的模拟光谱进行了补充。正如预期，当使用较多训练光谱进行\
  \ `LDA` 时，噪声会显著减少。\n\n用于在有限数据下实现化学分析的生成对抗方法的益处，取决于对抗攻击在识别分类器脆弱点方面的成功。在这种对抗光谱学的说明中，对初始光谱的扰动\
  \ `δ` 被添加到初始样本光谱 `x[s]` 中，以产生扰动光谱 `x′=x[s]+δ`。优化攻击的代价函数由 eqn (18.9)给出为两项之和。第一项 `||D(x[s]+δ−μ[t])||²`\
  \ 最小化了 `LDA` 空间中扰动光谱 `x[s]+δ` 与目标光谱 `μ[t]` 之间的平方偏差。变换矩阵 `D` 将光谱空间差异 `x[s]+δ−μ[t]`\
  \ 映射到 `LDA` 空间，驱动输入数据到达目标类均值的位置并诱导误分类。第二项最小化了扰动的整体幅度 `||δ||²`，将整体扰动限制在很小的范围内并减少初始光谱与受攻击光谱之间的视觉差异。换句话说，第一项欺骗了分类器，而第二项欺骗了人类。缩放参数\
  \ `β` 允许对微妙程度的重要性进行经验性调整；本研究使用了 `β=1`。\n\n![image](img/bk9781788017893-00450-t4.jpg)(18.9)\n\
  \n基于 `LDA` 的降维中载荷图中噪声巨大的表观贡献表明，化学分类的很大贡献包含了训练数据中虚假噪声的贡献，为对抗攻击制造了潜在的敏感性。在 `LDA` 降维操作中引入虚假噪声与\
  \ ANNs 中的“过拟合”直接类比，在那种情况下，分类变得过度依赖于训练数据中的随机特征（包括虚假噪声），这些特征作为对抗扰动的立足点。虽然在原理上，这种对攻击的内在敏感性可以通过增加训练集的大小来降至最低，但实际限制会使此类方法复杂，特别是数据获取昂贵或耗时时。\n\
  \nFigure 18.14 中的示例说明了由 `LDA` 引导的光曼光谱分类的脆弱性。初始未扰动的光谱（**A** 中的顶部）清晰地对应类 I（**B** 的右侧），既通过与类\
  \ I 平均光谱的视觉相似性，也通过其在 `LDA` 空间中的相应位置。未扰动光谱受到攻击，产生受攻击光谱（中间）。随后将其轨迹分类为目标光谱（底部）。注意受攻击光谱（中间）与目标类（底部）没有显著的光谱相似性。\n\
  \n根据 eqn (18.9)中的代价函数对光谱添加扰动会导致光谱视觉上发生微小变化（**A** 中的中间轨迹），但剧烈重分类为类 II（**B** 的底部），基于\
  \ `LDA` 空间中的位置，置信度 >95%。\n\n![image](img/bk9781788017893-00450-f14.jpg)\n\n图 18.14\
  \ 对抗光谱攻击的说明。（**A**）初始未扰动的光谱（顶部）受到攻击，产生受攻击光谱（中间）。随后将其轨迹分类为目标光谱（底部）。注意受攻击光谱（中间）与目标类（底部）没有显著的光谱相似性。分类器被欺骗了，而人类检查无法检测到扰动。（B）`LDA`\
  \ 空间中对抗攻击演示。通过在原始光谱中添加少量噪声，攻击光谱从类 1（右中）移动到类 2（左下）。方框区域表示分类不确定性最大的区域。\n\n\n\n\n这种对对抗扰动的敏感性是通过投影到\
  \ `LDA` 坐标进行降维的内在结果；存在无限多个可能的光谱集合，它们对应于 `LDA-space` 中的相同位置。相应地，对任何初始光谱的无数扰动都可以将其位置移动到\
  \ `LDA-space` 中的目标位置。代价函数的定义从该集合中选择对应于最优扰动的一个光谱（在本例中，为平方幅度最小的扰动）。对于该代价函数，`LDA-coordinates`\
  \ 内部残差噪声的存在会倾向于选择许多细微的“推挤”，而不是在少数波长处进行更明显的大尺度扰动。最重要的是，这些扰动通常**并不会**产生与目标类别预期峰值相似的光谱。图\
  \ 18.14 面板 A 所示的优化扰动在保留原始类别主要光谱特征的同时，以≥95% 的置信度发生了误分类。\n\n本节所示的许多光谱分类器中固有的对抗攻击脆弱性，也为利用对抗策略改进化学分类算法提供了机会。改进化学分类算法的防御策略的潜在收益是下一节的主题。\n\
  \n### 18.3.3 数据生成的示例说明：生成对抗线性分析\n\n对抗光谱学的主要用途可能是其在提高化学分类器通用可靠性方面的潜力。用于创建分类器的训练数据必然是有限的资源，任何实际的数据集都可能受到虚假或恶性误分类的影响。解决这种脆弱性的一种前景的途径是通过光谱化学分析中的生成对抗策略，这灵感来自\
  \ GAN 在图像处理中并行成功实施。(109)\n\n`GAN` 专门用于通过生成“伪造”输入（例如图像），然后对真伪输入进行判别，来识别并加固给定分类器中的潜在弱点。`GAN`\
  \ 通常由两个关键组件的深度神经网络组成：生成器和判别器。随机数组作为生成器的输入，生成器产生伪输入（例如图像）作为输出供判别器使用。判别器的知识被用于训练生成器，通过对抗攻击产生将被归类为目标类别的伪输入。接下来，产生一个新的能够额外区分真伪输入的判别器。然后使用这个新判别器来训练一个新的生成器，这种对抗性的往复反复进行，直到满足某些收敛标准。通过这一过程，最终的判别器对对抗或虚假扰动表现出显著的改进。\n\
  \n`GANs` 的成功可以在信号平均的背景下进行解释。如果我们能设计出一个完美的生成器，其输出产生的光谱或图像在统计上将与真实测量值相同，这反过来可以用于判别器中的噪声抑制，如图\
  \ 18.15 所示。换句话说，完美的生成器捕捉了与描述实验测量的底层 `pdf` 相关的所有复杂且通常是非线性的关系。正如描述数千个测量输入生成的高斯 `pdf`\
  \ 可以仅用两个参数（均值和方差）来描述一样，判别神经网络的生成输入从根本上可以用低维潜空间参数来描述。在神经网络中，`pdf` 的函数形式和底层潜在参数空间的性质通常是未知的，甚至无法通过分析推导出来，而是通过生成器的训练来学习的。\n\
  \n![image](img/bk9781788017893-00450-f15.jpg)\n\n图 18.15 `GAN` 的工作流程。生成器被训练以产生“欺骗”判别器的伪数据，而判别器被训练以区分伪数据和真实数据。通过强制生成器和判别器进行竞争，判别器将变得更加健健。\n\
  \n作者预计，对抗光谱学方法在集成到未来的生成对抗架构后，最终将在化学分类中产生类似的改进。图 18.16 构想了这种方法的实现的概念性概述。以图 18.14\
  \ 中描述的结果为例，测量的光谱数据首先进行降维以抑制噪声并辅助定义分类边界（如最左侧图中的椭圆所示）。随机生成的初始光谱（例如高斯分布的随机值）可以作为针对某一化学类别的发起对抗攻击的起点。这些随机初始光谱投影到降维空间的过程由中间大椭圆所示。使用方程\
  \ (18.9)给出的代价函数，攻击最小化了降维空间中到目标的距离，同时减小了高维光谱空间扰动的整体幅度。接下来，确定一组新的用于降维的载荷图，包括初始真实数据与对随机初始输入进行攻击而生成的伪光谱之间的判别。该过程的迭代具有通过定性上类似于信号平均的机制抑制载荷图内噪声贡献的潜力。此外，对于描述测量中信号或噪声的底层\
  \ `pdfs` 无需显式假设。\n\n![image](img/bk9781788017893-00450-f16.jpg)\n\n图 18.16 光谱分类中生成对抗方法的工作流程涉及以下概念性步骤：(i)\
  \ 通过降维分析初始数据；(ii) 使用随机输入在光谱空间生成“伪”数据并将其投影到此低维空间；(iii) 对每个伪光谱进行对抗攻击扰动，以诱导归类为目标类别之一；(iv)\
  \ 执行新的降维操作以分离真实和伪光谱。然后重复步骤 ii–iv 直到达到所需的收敛水平。\n\n### 18.4 结论\n\n机器学习的最新进展为在小数据应用中利用大数据工具开启了令人兴奋的途径。单个化学测量可能是耗时的且在实践上很困难的，或者成本高昂。为了应对这些挑战，探索了多种减少决策所需的总测量次数的策略。在化学成像中，稀疏采样策略被证明可以利用图像的内在压缩来可靠地填充未采样像素区域的成分。将稀疏采样方法与预测信息量实验的模型相结合，可以实现动态采样，即上一组测量结果动态地指导下次采样位置。\n\
