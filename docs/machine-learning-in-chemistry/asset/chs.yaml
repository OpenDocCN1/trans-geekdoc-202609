  \n\n\n\n## I. L. HUDSON, S. Y. LEEMAQZ AND A. D. ABELL\n\n^a 墨尔本皇家理工学院（RMIT）科学、工程与健康学院数学科学，墨尔本，维多利亚州，澳大利亚\n\
  \n^b 阿德莱德大学阿德莱德医学院罗宾逊研究所，阿德莱德，南澳大利亚\n\n^c 阿德莱德大学纳米尺度生物光子中心（CNBP）阿德莱德节点，化学系，阿德莱德，南澳大利亚\n\
  \n\\*邮箱：`irene.hudson@rmit.edu.au`\n\n## 11.1 引言\n\n药物分子的化学结构影响着其物理化学性质和生物活性。Lipinski\
  \ 的[1–[4] “五倍规则”（`Ro5`）彻底改变了科学家探索分子景观的方式。`Ro5`的引入引发了科学界对于使用分子参数（`MPs`）和其他因素划分化学空间最佳方法的广泛讨论。迄为止，已经出现了许多不同的规则、过滤器和模型，试图根据各种参数和因素对分子和靶进行分类，其中某些被证明比其他的更有效。`Ro5`是一种基于四种简单分子属性（`MPs`）的过滤器：脂溶性（分子溶解在脂肪或脂质中的能力），以辛醇/水分配系数（`logP`）≤5\
  \ 衡量；分子量（`MW`）≤500 Da；氢键供体数量（`HBD`）≤5；氢键受体数量（`HBA`）≤10。这些截止点基于辉瑞高通量筛选的结果，该结果显示具有较低`MW`且更亲水性（极性较大）的分子更有可能成功进入药物开发的下一个阶段[5]。Lipinski\
  \ 进一步推进了这些结果，指出违反两条或更多条 `Ro5` 规则的分子，其作为口服生物利用性药物进行成功开发的概率要低得多[6],[7]。尽管`Ro5`过滤器仅适用于通过被动运输吸收方法的药物[5]，但这对比制药行业探索方法的方向和性质产生了巨大影响。尽管如此，`Ro5`分类仍然是衡量分子成药潜力的常用指标。\n\
  \n然而，许多药理活性分子由于其固有的化学结构，未能上市或给药途径存在问题。最近，化学家开始关注药效提高的新药，这为这种缺陷产生的原因提供了一些新线索[8]。Rafferty[9]进一步证实了这一点，他讨论了工业界和学术界教授的药物探索技术之间的差异。表现出较差物理化学性质的候选药物被认为更有可能因为不良的`AMDET`（吸收、分布、代谢、泄和毒性）性质和药代动力学而流失。人们认为，通过减少在临床前开发阶段流失的潜在候选药物数量，可以将更多的时间和资源投入到进入发现过程后期的候选药物开发中。\n\
  \n在 Lipinski 的工作基础上，最近的研究探索了对成药分类最重要的分子物理化学参数。许多研究人员报告说，脂溶性是一个重要的`MP`，因为它有助于化合物的许多其他参数，如溶解度、渗透性、多效性和选择性[10]。其测量方法也引发了争议，即哪种计算方法（分配系数`logD`或\
  \ Lipinski 最初提出的`logP`）能最准确地捕捉其分子值[5],[11],[12]。在一项研究[13]中报告称，尽管`logP`是一个非常有用的描述符，但它没有考虑到许多分子目前具有的离子化变化[13]。对脂溶性的进一步研究表明，`logD`是脂溶性的更准确的测量方法[11],[12],[14]-[16]。\n\
  \n\n\n\n\n| Lipinski's Ro5 | `MW (Da)≤500, clogP≤5, HBA≤10, HBD≤5` |\n| Oprea &\
  \ Gottfries | `0≤HBD≤2, 2≤HBA≤9, 2≤ROT≤8, 1≤NATOM≤4` |\n| Ro5 的扩展 (Veber *et al.*)\
  \ | `Lipinski cut offs +PSA(A⁰)≤140, ROT≤10` |\n| Ro4 (Congreve *et al.*) | `MW(Da)≤400,\
