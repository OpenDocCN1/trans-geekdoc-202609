  \ (MR-CISD/aug-cc-pVDZ) 被用作参考方法训练神经网络 (NN)，并与 `QC2` (MR-CISD/6-31++G\\*) 获得的锥形相交点进行比较。对于这两个锥形相交点，显示了氮（深灰色）和碳（浅灰色）原子之间的键长，以及碳与氢原子之间的键长。值以埃为单位。给出了虚线标记的四个原子之间的二面角，以及碳与氢原子之间的角（`S`[1]/*S*[0]\
  \ CI）和两个氢原子之间的角（`S`[2]/*S*[1] CI）。经英国皇家学会许可转载自文献 50。\n\n\n\n\n\n### 分析\n从散点图中所示，各种方法找到的最小能量锥形交点彼此非常接近，这也可以通过图\
  \ 4.6 给出的几何结构进行详细验证。在 `S[1]/S[0]` 锥形交点（面板 A）中，跃迁几何结构的分布比 `S[2]/S[1]` 能级交叉点（面板 B）更广。这表明前者态交叉区域的势面更加平滑，允许来自距离最小能量锥形交点的构型发生跃迁。在后者的情况下，`PESs`\
  \ 的斜率更陡，跃迁几何结构与最小能量锥形交点更为相似。这一趋势是通过每方法独立获得的，证明了 `ML` 势面在能量、梯度和 `NACs` 方面的高准确性。\n\
  \n这一假设可以通过对每个锥形交点周围进行势能扫描来进一步测试。扫描分别使用 `QC1` 和 `NN` 方法进行，相应的三维图如图图 4.7 所示。可见，`NN`\
  \ 势面比 `QC1` 势面稍微平滑（比较 `S[2]/S[1]`态交叉的面板 B 和 A，以及 `S[1]/S[0]`态交叉的面板 D 和 C），并在两个接近的表面之间显示出更大的能隙。这些较大的间隙由于\
  \ `ML` 势面在空间任意一点都是可微的。对最小能量锥形交点周围进行的势能扫描分析进一步证明，与 `S[2]/S[1]` 锥形交点相比，`S[1]/S[0]`\
  \ 锥形交点周围的 `PESs` 更浅，从而解释了 `S[1]/S[0]`态交叉周围跃迁几何分布更宽的原因。由于跃迁发生在远离最小能量锥形交点的地方，训练集（通过适应采样获得）对\
  \ `S[1]/S[0]` 锥形交点的覆盖密度不如 `S[2]/S[1]` 锥形交点。因此，`NNs` 重现前者锥形交点的误差也更大。(50)\n\n![image](img/bk9781788017893-00076-f7.jpg)\n\
