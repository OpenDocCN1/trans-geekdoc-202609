  \ 95.9585 | 90 | 100 |\n\n一种混合模型(40)证明对 MMA 建模非常有效，在这种方法中，不包含扩散效应的简化现象学模型以不同方式与神经网络结合：\n\
  \n1. 现象学模型产生的转化率增加误差通过前馈神经网络进行了修正；\n2. `ANN` 用于凝胶和玻璃化效应，为机理模型提供了适当的聚合、终止转移常数，这些受扩散影响；\n\
  3. 交替使用这两种模型，首先是现象学模型，然后是神经网络，从所谓的关键转化率开始——扩散效应变得显著的点。\n\n对于第一种方法，图 10.7 和 10.8\
  \ 显示了近似现象学模型的残差如何通过前馈神经网络在训练和验证阶段对重量聚合度进行修正。\n\n![image](img/bk9781788017893-00227-f7.jpg)\n\
  \n图 10.7 在不同温度和引发剂浓度下，前馈神经网络对重量聚合度残差的训练结果；连续线——训练数据；○——神经模型。\n\n![image](img/bk9781788017893-00227-f8.jpg)\n\
  \n图 10.8 前馈神经网络对重量聚合度残差的验证结果；连续线和虚线——模拟数据；○——神经网络预测。\n\n对于第三种情况，图 10.9 说明了两种模型的接替使用，强调了与参考数据良好的拟合度。\n\
  \n![image](img/bk9781788017893-00227-f9.jpg)\n\n图 10.9 MMA 聚合中单体的转化率，由简化现象学模型（●）和神经网络（○）组成的混合模型得到；连续线——完整现象学模型。\n\
  \n\n\n\n\n第一个示例从 MMA（甲基丙烯酸酯）不连续聚合的完整现象学模型（见第 2 节）开始，该标量化的多目标函数包括最小化反应时间（`t`）、最小化多分散指数（`Q`）以及实现指定的转化率（`x`）和聚合度（DP[`n]`）。决策变量为引发剂初始浓度（`I[0]`）和温度（`T`），由几个等温步骤表示。为了优化，应用了三种方法并对其结果进行了比较：基于序列二次规划（`SQP`）的经典方法、`GA`\
  \ 以及结合 `SQP` 和 `GA` 的混合技术（`HM`）：`GA` 为 `SQP` 提供初始值。比较显示了所有三种方法的有效性，因为在多目标优化中，结果是部分目标之间的折中；因此，根据情况和优先目标，可以选择不同的结果。考虑到操作易用性、结果准确性以及程序计时等因素，混合方法似乎是推荐的方法。\n\
  \n这里有一个示例：设定转化率 `x=0.96` 和数值平均聚合度 DP[`nd`]=1800，三种方法提供了表 10.2 所示的结果。\n\n表 10.2 应用于\
  \ MMA 聚合的三种优化技术的结果。\n\n| 方法 | `I[0]` (mol m^(−³)) | `T` (°C) | `x` | `t` (min) |\
  \ `Q` | DP[`n`] |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| SQP | 31.1\
  \ | 66.1 | 0.47 | 65.8 | 3.65 | 1840 |\n| 80 | 0.74 | 68.7 | | | | |\n| 66 | 0.94\
  \ | 123.5 | | | | |\n| GA | 10 | 86.7 | 0.89 | 33.9 | 3.67 | 1797 |\n| 43.3 | 0.99\
