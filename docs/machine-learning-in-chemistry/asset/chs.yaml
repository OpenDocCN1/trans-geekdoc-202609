  \ 第 12 章\n## 应用于材料预测的人工智能\n\nSTEVEN BENNETT, ANDREW TARZIA, MARTIJN A. ZWIJNBURG\
  \ 以及 KIM E.\n\n^a 英国伦敦帝国学院化学系，分子科学研究中心，White City Campus，Wood Lane，伦敦 W12 0BZ\n\
  ^b 英国伦敦大学学院化学系，20 Gordon Street，伦敦 WC1H 0AJ\n*邮箱：kjelfs@imperial.ac.uk*\n\n 12.1\
  \ 引言\n\n功能性有机材料在许多领域，包括电子、多孔材料、聚合物和离子液体。在此我们将有机材料的范围定义为仅由轻元素组成的小分子或聚合物分子。我们不包括药物和生物材料，因为这些在其他地方讨论，尽管我们会注意到它们面临的问题和应对方法具有相似性。新材料的发现以前由偶然主，但现在迫切需要加速其发现，以应对人类面临的问题，如气候变化和自然资源枯竭。本章的重点是应用人工智能（AI）技术，通过协助预测其结构和性质并引导其针对特定应用进行优化，来加速新型有机材料的发现（见图\
  \ 12.1）。\n\n![image](img/bk978178017893-00280-f1.jpg)\n\n图 12.1 人工智能时代材料发现工作流程的示意总结，由\
  \ (a) 策划数据库和科学文献的数据驱动。从可用数据中，可以使用人工智能推断出 (b) 复杂的多变量的结构-性质关系。在这里，暴力的结构生成和或预测可以输入性质预测器，或者应用反向设计，后者在结构预测之前就会预测目标性质的最优候选者。随后，可以通过人工智能设计的实验\
  \ (d) 来实验探索 (c) 生成的搜索空间，从而高效地探索相空间，获得优化的材料，并通过反馈机制改进材料数据库、搜索空间以及之前的人工智能模型。\n\n\n\
  \n\n有机材料通常比其无机对应物具有优势，包括可持续性提高、加工性增强、最终材料毒性降低以及通常成本更低，这些因素对于材料生产的规模化扩大至关重要。此外，有机化合物相对容易通过大量稳健的合成路线进行改，允许对材料性能进行精细调节。例如，在半导体和其他电子设备的发展中，目前正推动用有机材料取代无机硅基材料。[6]\n\
  \n从建模的角度来看，有机材料与其无机对应物之间的一个主要区别在于，它们通常是分离分子的组合（无论是小分子还是聚合物），而不是单一实体。因此，原则上可以将有机材料表示为孤立分子（可能忽略分子环境的影响，尽管这可能超出了平均场近似的范围，例如固体中的分子间堆积、溶解分子中的溶剂，甚至是界面），或者对整个凝聚态系统进行处理。文献中有许多采用“分子表法”的清晰示例。\n\
  \n然而，为了使这种表法准确且有效，材料的性质必须由单个分子的性质主导。例如，对于多孔分子笼材料，由于单个分子的结构定义了固态孔隙拓扑，因此可以从单个分子确定分子分离的潜力。[7]\
  \ 同样，对于形成无形固体的共轭聚合物，对孤立聚合物链进行 `DFT` 计算与聚合物固体的实验光电子能谱[8] 之间的比较表明，孤立聚合物链可能是预测其光电性能的固体的良好表征。相反，对于本征微孔聚合物（PIMs）[9]，由于分子间空隙源于聚合物链固有的堆积性差，分子表征在预测涌现孔隙方面显然是不够的，需要“凝聚态表征”。表法的选择既关系到训练数据的生成，也关系用于机器学习的描述符类型。正如下文将详细讨论的那样，对于某些性质，计算局限性意味着计算它们的唯一（高效）方法本质上是分子水平的，而分子和凝聚态则使用完全不同类型的描述符。\n\
  \n### 有机材料的搜索空间\n\n新型有机材料的搜索空间不仅包括组成分子的化学空间（估计由 `10⁶⁰` 个分子组成[10]），还必须考虑将单个分子组装成材料的不同方式、其体性质以及实验变量（如合成方案）的影响。[11]\
  \ 通过该领域的现有知识，实验化学家可以显著缩小这一搜索空间。然而，对相空间“已知”区域内微小变化的内在偏，阻碍了针对特定应用最优材料进行相空间的彻底探索。计算方法和算法提供了更廉价、更完整的方法来搜索最优材料的相空间。[12]\
  \ 使用计算方法探索相空间的一个关键方面是能够准确预测每个候选材料感兴趣的材料性质。在这里，通常用由现有结构-性质关系定义的简化模型，来替代多个长度尺度和时间尺度的复杂性。\n\
  \n### 计算优化与药物发现\n\n计算优化已在药物发现领域应用多年，因为那里存在清晰的结构-性质关系。[13] 在早期计算机辅助药物发现的情况下，仅需分子结构（用于计算简单的分子性质，例如利平斯基五倍规则[14]）即可推进药物发现过程。同样，在晶态无机材料领域，定义良好的结构的存在简化了结构-性质关系的确定，因为在许多情况下，晶态材料相对定义良好的电子结构已经包含了有关感兴趣性质的所需信息。[11],[15]\n\
  \n然而，由于弱的非共价相互作用主要定义了许多有机材料的体结构，结构与有机材料性质之间的联系并不总是清晰的。因此，结构-性质关系的开发和理解是一个复杂、多尺度且变量的问题。在数据充足的情况下，可以应用\
  \ AI 理解多尺度结构-性质关系并消除对近似和简化的需求，从而显著提高了预测材料性质的能力。这种能力将驱动反向设计程序的实施，根据材料函数的优化来确定最优候选材料并高效地探索材料搜索空间，而无需测试无数可能的候选者。[16],[17]\n\
  \n可以将 AI 方法应用于现代发现流程的各个方面，从候选者生成、数据提取到分析和性质预测，这提供了一个在不显著损失准确性的情况下大幅加速过程的机会。此外，AI\
  \ 提供了一条条通向材料发现自动化的路径，其速度比人类驱动的发现快得多，成本也更低。AI 应用中的一个重大障碍是现有数据的数量和质量、负样本数据的缺乏[18]，以及化学和物理系统表法的选择。[17]\n\
  \n## 12.2 从文献中提取数据\n\n从使用 AI 方法预测新材料及其及其性质的角度来看，拥有大量高质量、机器可读的数据用于训练至关重要。在整个科学文献中，存在大量以期刊文章、技术文档和专利中的非结构化文本、图形或表格形式存在的实验和理论数据。[19],[20]\
  \ 将这些数据手动收集并整理到机器可读的数据库中在大规模上是不可行的。\n\n幸运的是，科学文献通常以公式化的编写，这允许应用文本挖掘算法自动提取数据。然而，不同科学领域许多惯例中的歧义和变异限制了现有的字典和基于规则的文本挖掘方法的通用性。[19][21]\
  \ 目前大规模信息提取的趋势是使用基于机器学习 (`ML`) 的（或混合）文本挖掘工作流，因为它们比硬编码方法灵活得多。[19],[22–[24]\n\n\n\n\
  \n最近，Cole 及其同事开发了 `ChemDataExtractor` (`CDE`)，这是一种自动提取化学信息的开源软件。`CDE` 在整个自然语言处理（NLP）和命名实体识别（NER）工作流中实现了监督和无监督机器学习模型（参见[图\
  \ 12.2]）。`NER` 用于查找文本中的命名实体，这些包括化学物种、过程、合成条件、材料属性和表征方法，并可以使用机器学习、混合机器学习、字典以及基于规则的方法进行。文本挖掘的一项重大挑战是为每个实体可靠地创建一个唯一标识符，即匹配同义词，这被称为实体归一化。Weston\
  \ 等人对材料科学文献进行了研究，使用 `CDE` 进行分词，使用神经网络（NN）进行 `NER`，并使用词嵌入（一种基于词汇在文本中的共现关系，将每个词映射到稠密向量空间的机器学习映射）进行实体归一化，其目标是构建一个结构化且易于访问的材料数据库。同样，Tshitoyan\
  \ 等人利用来自科学摘要的文本学习了词嵌入，并以此揭示了材料与其潜在属性之间的关系。由于其内置的灵活性，`CDE` 在许多子领域都非常有用。在有机材料领域，Cole\
  \ 及其同事将 `CDE` 应用发现共敏太阳能电池的最佳有机染料对。他们对 9431 种染料候选进行了文本挖掘，建立了一个数据库，将化学结构与光学吸收峰和摩尔消光系数起来。从这个初始数据库开始，应用高通量筛选工作流识别合适的候选染料对，并通过实验验证了所得顶级候选材料功率转换效率的提高。\n\
  \n![image](img/bk9781788017893-00280-f2.jpg)\n\n图 12.2 自然语言处理流水线。文本被分成句子，然后分成单个标记。词性标记器和实体识别器的输出相结合，为每个标记分配单个标签，然后使用基于规则的语法进行解析以生成树结构。通过解释该树结构来提取该句子的单个化学记录，然后将这些记录与整个文档的记录相结合，以解决数据依赖关系并产生统一的记录以存入数据库。显示的标签：`NN`=名词，`CD`=基数，`VBZ`=动词（第三人称单数现在时），`DT`=限定词，`NNS`=名词复数，`IN`=介词，`JJ`=形容词，`CC`=并列词，`CM`=化学提及。转载自文献\
  \ [25]，经美国化学学会许可，版权所有 2016。\n\n## 12.3 构建构建单元库\n\n开发多样化的前体库是材料筛选过程的重要部分，因为它定义了可检查的化学空间。虽然像\
  \ `ZINC`、`GBD` 和 `PubChem` 这样的分子结构库提供了大量多样且可合成的分子，但它们缺乏重点，使得对所有前体候选进行详尽搜索是不可行的，而且其中许多分子并非针对材料设计。通过添加已知的有用功能或系统过程对现有的分子库进行枚举，是扩展构建块库的常用方法。然而，硬编码的转换往往限制了前体库跨越的化学空间，可能会错过占据属性空间中有利区域的化合物。作为哈佛清洁能源项目的一部分，人们通过使用预定义的化学转换结合\
  \ 26 个分子构建单元来枚举化合物，创建了一个超过 1,000,000 个分子的库。此外，Gómez-Bombarelli 等人基于供体-桥接-受体分子设计了一个包含\
  \ 160 万种候选材料的库，并根据化学直觉系统地将额外的基团加入库中。\n\n## 12.4 属性预测\n\n### 12.4.1 训练数据\n\n任何机器学习的应用都需要训练数据，其数量和质量直接影响使用的算法类型以及训练模型的可能准确性。回归（例如高斯过程和核岭回归\
  \ `KRR`）和决策树模型可以使用较小的数据集进行训练，但神经网络需要更多的数据。这两种算法都具有优势；然而，深度神经网络在属性预测方面通常优于传统的机器学习技术。训练数据本身可以从实验或理论计算中获得。在属性预测背景下，实验数据集的大小通常有限；例如，Kim\
  \ 等人分别使用 451 和 173 个实验数据点训练了预测聚合物玻璃化温度和密度的模型。因此，实验数据通常与回归和决策树方法结合使用。来自计算化学的训练数据集可以大得多，多达数百万数据点，并可以从多种方法获得，包括半经验、密度泛函理论\
  \ (`DFT`）和量子化学计算。`DFT` 计算是标准，但现代半经验方法（例如 Grimme 组开发的 `xTB` 系列半经验方法）可以用极短计算时间给出相似准确的结果，从而允许生成比\
  \ `DFT` 可行的（大得多的）训练数据集。相反，如果人们想训练一个机器学习模型来预测与量子化学计算准确性相似的数据，那么必须使用来自量子化学计算的数据进行训练，这是可能的，但非常耗时。\n\
  \n\n\n\n\n尽管有机材料数据库的创建取得了持续进展，但与其他领域相比，数据仍然相对匮乏。例如在药物设计或无机材料领域，在这些领域，自动化计算工作流推动了多个无机材料属性数据库的增长，例如\
  \ `NOMAD`^(41) 和 `Materials Project` 数据库.^(42)。在有机材料领域，有几个数据存储，专注于特定的材料应用（参见表 12.1）。许多数据集包含计算结果，例如\
  \ `Khazana`，^(43)、`Harvard Organic Photovoltaic Dataset`，^(44)、`Open Spectral Dataset`，^(45)、`dye-sensitised\
  \ solar cell database`^(46) 以及 `Organic Materials Database`。^(47)。\n\n从这些存储库中，研究人员利用\
  \ `ML`^(48) 和数据挖掘技术^(49) 建立了新的材料设计原则。Olsthoorn *et al.* 使用晶体结构特征化的原子位置平滑重叠（`SOAP`）核方法，利用来自\
  \ `Organic Materials database`^(50) 的数据通过 `KRR` 预测了带隙。随后，该预测模型被用于筛选包含 30,713 个有机晶体结构的\
  \ `Crystallographic Open Database`，并识别出 15 个被预测具有太阳太阳能电池带隙的候选材料。\n\n### 表 12.1 具有有机材料发现潜力的数据库示例，包含每个数据库存储的属性和现有系统数量。\n\
  \n| 名称 | 属性或结构 | 规模 |\n| :--- | :--- | :--- |\n| `Khazana`^(69) | 原子化能、带隙、介电常数 |\
  \ 1073 个分子 |\n| `Materials Project Nanoporous Database`^(153) | 最大空腔直径、晶体密度、等温线数据\
  \ | 85,000 个网络 |\n| `PoLyInfo`^(154) | 物理、光学、电学、热学、机械性能 | 44,280 个分子 |\n| `Harvard\
  \ Organic Photovoltaic Dataset`^(44) | HOMO/LUMO 能量、带隙、光转换效率、开路电压、短电流密度 | 350 个分子\
  \ |\n| `dye-sensitised solar cell`^(46) | 开路电压、短电流密度、填充因子、光转换效率 | 4000 个分子 |\n|\
  \ `Organic Materials Database`^(47) | 分子结构 | 313 |\n\n由于缺乏大型数据集，迁移学习已成为一种日益受欢迎的方案。在迁移学习中，使用较小的数据集来微调模型。Paul\
  \ *et al.* 应用了类似的方法来预测 `HOMO`^(51)。\n\n### 12.4 描述符\n\n在识别结构-属性关系时，`AI` 通常用于预测属性。一个理想的描述符不应包含不必要的信息。基于分子二维结构的描述符不包含与该分子在固态中更广泛环境（*即*晶态或非晶态）相关的联信息。因此，开发新的描述符来预测由于分子堆积产生的属性引起了巨大的兴趣。\n\
  \n### 12.4.2 描述符\n\n许多结构描述符编码了分子表示，基于分子的成键。成键信息可以通过邻接矩阵的形式捕捉；然而，仅靠成键信息可能无法预测属性所需的化学信息。指纹算法，例如\
  \ `Extended-Connectivity` 或 `Morgan fingerprints`，^(56)编码了分子中存在的不同子结构的哈希，有助于基于单个分子中的片段进行属性预测。\n\
  \n用于模拟固态的描述符通常包含原子环境的几何信息；然而，确保它们对于三维结构中原子的旋转、平移或重新排序具有不变性是一个巨大的挑战。`Coulomb matrices`，^(57)\
  \ 被证明在预测晶体结构属性方面是有效的，尽管它们在描述周期性方面存在问题。^(58)。\n\n![image](img/bk9781788017893-0f3.jpg)\n\
  \n`Bag of Bonds`描述符基于表示分子中键类型的包及其几何距离，用于预测总能和原子化能。^(59)Elton *et al.* 发现，通过键求和计算的描述符在利用\
  \ `KRR` 预测密度、形成热、冲击波速度和爆炸能量时表现最佳。^\n`KRR`。^(60)\n\n\n\n\nSOAP 核函数已被用作固态下分子特性的描述符。^[61]\
  \ 该核函数衡量了环境中原子之间的差异，能够区分三维原子排列结构。为了计算 SOAP 描述符，通过放置在原子位置上的高斯函数来表示原子环境。或者，对称函数在将高维笛卡尔坐标表示转换为低维空间时非常有用。[⁶²]\
  \ 这些表示法随后被用于训练神经网络（NN）；然而，SOAP 在降低计算成本的同时表现出类似的性能。[⁶³] 这些类型的描述符已用于学习原子势，且无需底层的物理假设，使得模拟的原子数量远大于使用*从头计算（ab\
  \ initio）*方法所实现的数量。[⁶⁴]\n\n最近，深度学习（DL）算法被用于仅依赖分子图表示生成底层化学结构的新型表示法。[⁶⁵] 通过自动特征提取，深度学习算法能够从分子结构图中学习自身的表示法，而无需假设关于材料的领域知识。卷积神经网络（CNNs）可以根据分子图学习新的表示法，从而提高所训练机器学习模型的预测性能和可解释性。[⁶⁵]\
  \ 图卷积神经网络（Graph CNNs）不仅限于单分子图表示，已应用于利用晶胞内原子位置对晶体结构进行特征化。[⁶⁶,67] Wu 等人描述了一项基准测试 MoleculeNet，针对学习型和固定的分子描述符，基于它们从基准数据集预测量子化学（QM）能量以及分子物理、生物物理和生理特性的能力。[⁶⁸]\
  \ 结果证明学习的图表示在几乎所有数据集上表现都更好，因为学习到的表示考虑了原子环境的空间细节。然而，这种方法比传统的机器学习方法需要更多的数据。在材料设计中，学习到的表示可能建立起传统描述符无法捕捉的新颖见解，但大型数据集的缺失是使用这些方法实现更强预测能力的重大缺陷。\n\
  \n## 12.4.3 加速特性预测\n\nAI 方法，特别是（监督）机器学习，提供了极大加速特性预测的机会，其速度比例如 DFT 计算快几个数量级，将特性预测的时间从几小时或几天缩短到几秒钟。与逆向设计相比，这种正向问题相当简单。虽然某些有机材料（特别是多孔材料）的特性可能依赖于计算廉价的几何特征，或者可以通过分子动力学模拟的扩散等特性，但大多数有机材料的特性依赖于对材料的准确量子力学描述。执行*从头计算（ab\
  \ initio）*来计算特性对计算能力要求极高，因此从本质上限制了可以研究的材料数量。此外，还存在错失机会的可能，即材料仅针对某一特定特性（例如光电转换效率）进行测试，而实际上它可能具有优异的铁电性，但该特性未被考虑；即使考虑了，它也需要另一套专家级计算。\n\
  \n特性预测的加速已经在许多孤立有机分子的特性中得到证实，例如热化学、电学性质、原子化能、电子密度和溶剂化能。[¹⁷,43,69,70] 固态材料特性建模的下一步显然更具挑战性，但在本章后半部分，针对各种有机材料的案例研究将描述到为止的成功以及该领域的未来潜力。与其他领域一样，关键挑战在于拥有足够数量的高质量数据数据库以供监督机器学习使用；或者拥有在较少数据下依然有效的算法。理想情况下，人们希望对感兴趣特性的实验数据能更准确地反映影响性能的特征的全复杂性，但到目前为止，大多数研究仍集中在基于模拟训练数据的快速预测上。未来的目标将不仅预测材料性能，还要预测设备级性能，并考虑对性质产生宏观影响的多组件系统。\n\
  \n## 12.5 结构预测\n\n由于目前通常没有直接从分子结构或前驱体到体材料性质进行正向预测的路径，若要进行预测，首先必须预测材料的固态结构，无论是无晶态结构还是晶态结构。辅助识别合成材料并探索和挖掘“结构-性质”关系也是一项极有价值的尝试。结构预测本身是一个巨大的领域，AI\
  \ 具有加速这一过程的潜力，这在它的几个方面已经已得到证明。有机分子的晶体结构预测（CSP）有着悠久的历史，这很大程度上是因为制药公司对理解和预测活性药物的多晶型感兴趣。[⁷¹,72]\
  \ 这些方法也被应用于其他有机材料，特别是分子电子学。[⁷³,74] 预测的典型关键步骤（如图 12.4 所示）是：首先构建系统准确的能量描述（例如通过参数化定制的力场），然后进行全局优化搜索，这需要对假设的多晶型进行准确的相对能量排名，原理是低能量的多晶型最有可能被实验观察到。随后可以对多晶型的排列基元或性质进行进一步分析。定期的盲测证明了这些方法处理更复杂系统的的能力不断增强，例如包含分子柔性、共晶和水合物的系统，而使用*从头计算（ab\
  \ initio）*进行能量排名被证明特别有效。[⁷⁵]\n\n```\n![image](img/bk9781788017893-00280-f4.jpg)\n\
  ```\n\n图 12.4 晶体结构预测的关键步骤（上）以及 AI 技术可以改进过程之处（下）。\n\n\n\n\n虽然目前 `CSP` 的典型方法尚未涉及人工智能，但这里存在多种机会（参见图\
  \ 12.4），特别是在新算法的发展方面，正如几项旨在改进过程各个元素的研究所示。机器学习势能（`MLP`）^(76)–78)为可迁移或定制的力场提供了一种替代方案，它们涉及一种更具通用性的拟合方法，并具有获得更高精度的潜力。寻找低能多晶型的方法采用了多种方法，包括遗传算法，^(79)随机搜索和准随机搜索。^(80)尽管尚未应用于分子\
  \ `CSP`，但神经网络对于增强采样或自由能景观的学习是行有效的。^(81,82)由于多晶型的相对能量排名对分子间相互作用的微小差异极其敏感，对多晶型进行准确的能量排名是一项重大挑战。虽然使用带有色散校正的\
  \ `DFT` 计算得出最终能量排名具有价值，但目前这些计算对于极少数结构外，所有计算的成本都高得令人无法接受；因此，在结构搜索的早期阶段使用了力场计算。在这里，利用\
  \ `ML` 改进精确自由能计算可以极大地加速精确能量的计算。^(77)McDonagh *等人* 证明，通过使用 `ML` 利用二阶扰动理论修正二体项，可以提高\
  \ `CSP` 的力场能量，在成本降低五倍的情况下获得更高的精度。^(83)挑战在于如何将此扩展到更灵活的分子，而不是本研究中的刚性分子。\n\nMusil *等人*\
  \ 应用了基于 `SOAP-REMatch` 核的高斯过程回归（`GPR`）来评估晶体堆积的结构相似性，并准确预测了五苯和两种氮并戊堆积的相对能量。^(73)对于最简单的结构五苯，仅需\
  \ 50 个数据点即可达到低于 `1 kJ mol^(−1)` 的精度，但对于分子间相互作用更复杂的氮并戊，则大约需要 1000 个数据点才能达到同等水平的精度。接下来，Musil\
  \ *等人* 使用 `SOAP-REMatch` 进行无监督学习，对数千个晶体结构进行分类，以评估堆积模式的多样性，从而取代了对启发式规则的需求。^(73)Yang\
  \ *等人* 随后证明，对 28 种不同的分子有机半导体进行单多景观分析这种堆积探索是可能的，尽管这需要手动选择核的参数。^(84)最后，通过监督 `ML` 加速属性计算的优势，对于跨越数千个结构的“结构-能量-属性”景观的属性计算具有巨大的用途。\n\
  \n除了通过结构预测来识别具有合成前景的假设材料外，结构预测还可以促进更快的结构识别，这是高通量自动化研究中的一个潜在瓶颈。如果计算了低能的假设晶体结构，就可以模拟它们的粉末衍射图，但如果不投入大量的额外努力，这对于得出结论性的结构识别通常是不的。`NMR`\
  \ 位移的计算已被证明是结构识别的有效途径，^(85)但这需要固态*从头*计算，因此对于常规使用显然是不可行的。然而，最近 Paruzzo *等人* 证明 `ML`\
  \ 可以从 `DFT` 训练数据预测化学位移并达到 `DFT` 级精度，从而识别分子固体。^(86)人们还可以想象将 `ML` 用于加速各种数据的分析。^(87)所有有机材料在固态中都采用晶体堆积，而是形成分子或聚合物。模拟这些系统通常涉及随机堆积，然后是某种退火程序。`ML`\
  \ 在这里最明显的应用是生成 `MLPs`，这不仅可以加速涉及退火的分子动力学模拟，还能模拟更大、更真实的模型。这已经在无机材料中得到证明，例如无定形硅。^(88)尽管我们从仅通过结构快速预测组装还有很长的路要走，但部分过程非常有前景。下一个挑战将是使这些方法具有泛化性和迁移性。当然，除了更好的晶体表示和算法，还需要更多关于分子及其低能多晶型的训练数据来尝试取得飞跃。\n\
  \n## 12.6 相空间探索考虑到分子构建块的巨大可能性，以及已合成数量有限的事实，一个重大挑战是如何有效地采样该化学空间以找到有前景的材料。许多计算研究受到规模极小的初始构建块库的限制（数量级），这大大限制了此类研究的范围。在下一节中，我们将讨论如何从头（de\
  \ novo*）生成新分子，但对于给定的搜索空间，有多种可能的方案来有效高效地采样可能材料的巨大相空间，或者它们的原材料。在搜索空间较小且评估方法廉便宜的情况下，可以使用穷举法，或者可以使用结合化学家直觉规则的随机方法。进入人工智能方法，遗传算法（`GAs`）经常被用作采样相空间并发现候选对象的高效方法。具有\
  \ `SMILES` 表示的 `GAs` 变包括基于图的表示（`GB-GA`）或蒙特卡洛树搜索（`GA-MCTS`）。^(89)最近，`ML` 方法也被应用，包括变分自编码器（`VAE`）、深度神经网络（`DNN`）和循环神经网络（`RNN`）。然而，最近在药物发现分子领域基于\
  \ `GA` 方法与 `ML` 的基准测试表明，`GB-GA` 可以竞争过 `SMILES` 表示的 `RNN`，但在大型数据集上训练的 `RNN` 在化合物质量上优于\
  \ `GA`。^(90)\n\n\n\n当然，对化学空间的有效探索不仅是一个限于计算研究的问题，对于材料发现或材料优化的实验研究也变得越来越重要，特别是随着自动化程度的提高。遗传算法（GAs）、模拟退火和粒子群优化已被用于指导发现、寻找新系统或寻找增强性能的优化条件。实验设计（DOE）是一种用于多变量分析的统计方法，用于同时测试和优化多个变量，从而加速优化并节省时间和资源。这对于由于许多组件和工艺条件而导致高度复杂的材料和设备优化显然具有价值。Cao\
  \ *等人* 发现将 DOE 与机器学习（ML）结合对于优化有机光伏的光电转换效率（PCE）是有效的，他们使用支持向量机机器学习方法基于采样点创建了相图。循环神经网络（RNNs）可能会越来越多地用于选择初始测试集、对化学机器人上的结果进行自动分析（包括结果分类），以及预测和选择下一次测试。后者在有机合成反应中已经实现，可以在机器人上分类“有反应性”和“非反应性”结果，并预测未来的活性。未来这将进一步扩展到更复杂的有机材料问题。\n\
  \n## 12.7 材料构建块的分子*从头*（De Novo）设计\n\n人们对机器学习（ML）以及特别是深度学习（DL）算法用于*从头*分子库设计已表现出极大兴趣，以帮助探索比已知构建块或小型库覆盖范围更大的化学空间。通常，在大规模化学空间探索与创建化学上可合成的新分子之间存在着权衡。神经网络（NNs）具有学习分子输入表示的新颖表示的能力，将输入特征转换为机器解释的潜空间，而深度神经网络（DNNs）由于包含更多的隐藏层，可以创建更复杂的表示。许多方法依赖于对这些学习到的表示进行扰动，从而对机器学习的化学空间进行采样（参见图\
  \ 12.5(a)）。\n\n![image](img/bk9781788017893-00280-f5.jpg)\n\n图 12.5 分子*从头*设计技术总结：(a)\
  \ 变分自动编码器-解码器，其中训练神经网络将分子转换为潜表示；(b) 生成对抗网络，其中生成神经网络创建分子，并使用判别网络将其分类为真实化合物；(c) 强化学习，其中训练神经网络来预测在给定状态下执行的最优操作。\n\
  \nDNNs 将人类可解释的分子表示转换为相空间的能力使其非常适用于分子设计。Gómez-Bombarelli *等人* 使用 DNN 作为 VAE 的一部分，创建了从基于图的分子\
  \ SMILES 表示到潜空间的映射。然后，通过扰动分子在潜空间中的连续向量表示来对分子应用变换，并使用另一个 DNN 作为解码器将其转换回 SMILES。RNN\
  \ 和 CNN 都被尝试作为编码器，其中 CNN 的表现略好一些。这种方法的一个优势是能够在能够在潜空间中进行属性预测，在对该空间区域进行采样时可能允许进行反向设计。迁移学习已被证明对于生成具有理想属性的分子非常有用，它通过调整在大型前体数据集的有效化学\
  \ SMILES 上经过预训练的模型来实现。随后，通过重新训练该模型以生成具有特定属性的化合物。`ChemTS` 库使用蒙特卡洛树搜索，结合 RNN 来规定选择每个搜索路径的概率。Sumita\
  \ *等人* 使用 `ChemTS` 生成了具有理想激发能的分子，将分子生成器的奖励函数与时间依赖 DFT 计算相结合。激发能经过计算后馈入生成器模型，结果识别出五种具有良好振子跃的新型化合物。\n\
  \n强化学习旨在根据模型见过的先验经验学习最佳行动方案，已被证明能使生成模型倾向于创建良好属性的分子。Popova *等人* 使用 `ReLeaSE` 框架生成了具有所需属性的分子。该框架由生成和预测\
  \ NN 组成，结合强化学习，生成 NN 能够提出使单目标优化奖励函数最大的分子，该函数可以调整以最大化目标属性。尽管开发了许多类型的生成算法，但许多算法仍存在严重缺陷。大部分\
  \ GAN 和 RNN 经常产生无效的 SMILES 字符串，限制了它们的用途。虽然在 RNN 中使用长短期记忆（LSTM）架构已被证明可以减轻这个问题，但针对特定目标优化的算法往往会显著降低分子的多样性，特别是在\
  \ GAN 中。\n\n## 12.8 预测可合成材料\n\n\n\n\n\n虽然 AI 方法已被证明能够成功识别具有良好性能的材料，但要确定这些材料在实验上是否可实现仍然困难。由于实验验证潜在新材料需要成本和时间，材料的合成便利性（`SA`）是材料筛选过程的一个重要部分。需要考虑以下几点：(i)\
  \ 材料的前驱体是否可以合成，(ii) 随后能否通过模块化方法高产率和高纯度的正确形式合成材料，(iii) 材料是否可以被加工成正确的形状以获得所需的性能。\n\
  \n在执行高通量筛选程序时，前驱体的 `SA` 可以通过两种方式纳入方法论。前驱体库可以限制在那些之前已经合成过的或不需要复杂的合成程序即可创建的。或者，可以将材料的\
  \ `SA` 定义为数值属性，并在材料优化过程中进行优化。\n\n由于影响 `SA` 的因素众多且计算过程中存在固有的假设，计算 `SA` 时面临着巨大挑战。一个需要多个低产率反应步骤、涉及多个复杂分离过程并使用昂贵试剂的分子，其本质上是难以的。随着新反应的发现和化学价格的波动，材料的\
  \ `SA` 会随时间变化。早期旨在计算有机分子 `SA` 的方法侧重于对具有更复杂结构基团的分子进行惩罚.^(102) 然而，事实证明药物化学家在选择易于合成的目标分子时意见不一，这表明专家化学家的训练数据往往并不可靠.^(103)\n\
  \n机器学习（ML）通过使用数据驱动的方法为预测分子的 `SA` 提供了替代方案。反应数据可以提供对可能的合成转化类型的洞察，从而对一个分子是否可合成做出预测。使用\
  \ `NN`，反应数据库已用于预测分子的 `SA`.^(104) ML 也被证明在逆合成路径预测方面表现良好，能够理解创建分子的可能反应路径。^(105,106)\
  \ 虽然反应步数是决定分子 `SA` 的因素，但另一个重要因素——成本，被证明与合成有机光伏分子的反应步数呈线性相关.^(107) 这类 ML 预测的一个挑战性因素是缺乏信息反应数据。有机反应数据库主要由反应物-产物对组成，不包含与反应相关的产量、溶剂或后处理信息。此外，缺乏失败反应的负样本使得分类任务变得困难。\n\
  \nO'Boyle *et al.* 利用先先合成分子的化学直觉创建了一个前驱体库，用于设计有机光伏的聚合物.^(108) 此外，在创建四聚体时考虑了每个单体的对称性，以增加每个聚合物被合成的概率，代价是缩小了探索的化学空间范围。即使可以使用上述技术预测有机材料中的共价键，预测该分子是否会形成具有理想性能的三维构象仍然具有挑战。例如，在考虑多孔有机笼时，拓扑结构和产生的孔隙率对多种因素敏感，包括溶剂效应、反应条件和前驱体分子的结构特征.^(109)\
  \ 因此，在确定多孔有机笼是否可合成时，应该考虑这些因素。\n\n## 12.9 个研究\n\n### 12.9.1 有机电子\n\n在有机电子领域，小分子、低聚物和/或聚的光电性能被用于制造太阳能、发光二极管、晶体管和热电器。相关分子的潜在化学空间是巨大的；例如，即使从只有\
  \ 500 个单体的有限库中，也可以构建出多达 250,000 个二元有序共聚物.^(37) 因此，在缺乏机器学习模型的情况下，对分子进行虚拟筛选以寻找先导化合物或理解趋势是不可能的。该领域的大多数（并非全部）研究以某种方式利用了单分子近似，并重点关注训练和使用\
  \ ML 模型预测孤立分子的性质，或者利用传统的量子化学计算孤立分子的性质，并使用 AI 预测体材料或设备的性质。\n\n\n\n\n\nAI 在该领域的应用本质上始于使用简单的多变量线性回归（尽管\
  \ Sumpter 和 Noid 在 1994 年就已经证明神经网络在原理上可以用于预测聚合物的性质，包括介电常数等电子性质，更多细节见第 12.9.3 节）。^[110]\
  \ Olivares-Amaya *等人* 使用多变量线性回归结合经典的化学信息描述符（如分子质量和 `logP`），预测了基于有机电子供体聚合物和电子受体富勒烯\
  \ `PCBM` 组合的有机太阳能电池开路电压 (`V[oc]`)、短路电流 (`J[sc]`)、填充因子 (`FF`) 和光电转换效率 (`PCE`)，^[111]，而\
  \ Jabeen *等人* 使用类似的设置来预测聚合物的折射率。^[112] Pyzer-Knapp *等人* 训练了 `GPR` 模型来修正通过 `DFT`\
  \ 计算的包含 `HOPV15` 数据集中有机电子供体的最高占据分子轨道 (`HOMO`) 和最低未占据分子轨道 (`LUMO`) 的能量，以及基于它们的太阳能电池的\
  \ `V[oc]`、`J[sc]` 和 `PCE`，以重现相应的实验测量值。^[113] Lopez *等人* 同样使用了 `GPR` 模型，但侧重于小分子电子受体作为\
  \ `PCBM` 的替代品^[44]。这些 `GPR` 模型的输入是基于 `DFT` 的性质，以及集合中不同分子 `Morgan 指纹` 之间的 `Tanimoto`\
  \ 相似性。Kim *等人* 使用混合化学信息描述符的 `GPR` 来预测共轭聚合物和非共轭聚合物混合物的性质，如带隙、折射率、介电常数和玻璃化温度^[34]。\
  \ Mannodi-Kanakkithodi *等人* 也研究了聚合物的介电性质，但使用的是 `KRR` 而非 `GPR`。^[114] 与这些大多数研究不同，Kim\
  \ *等人* 训练其 `GPR` 来重现实验与 `DFT` 预测性质的混合^[34]。 最后，Musil *等人* 使用 `SOAP` 描述符和 `GPR` 的组合来加速大量多晶型电子传输性质的预测。\n\
  \nGPR 和 `KRR` 主要用于训练实验数据，相比之下，神经网络通常用于训练计算数据。Pyzer-Knapp *等人* 在训练 `GPR` 重现实验与 `DFT`\
  \ 预测性质的混合时，利用 `Morgan 指纹` 对 `DFT` 的 `HOMO`、`LUMO` 能量以及 `PCE` 值预测了 200,000 个来自 Harvard\
  \ 数据库的分子，其中 50,000 个分子用于测试。^[16]。上述所有 `NN` 研究都使用了这 100,000 个分子进行测试。^[115] Gómez-Bombarelli\
  \ *等人* 使用 `Morgan 指纹` 对通过 `TD-DFT` 计算的热辅助延迟荧光 (`TADF`) 速率进行预测，以发现新的 `TADF` 领先的 200,000\
  \ 个分子作为工作流。^[32] Wilbraham *等人* 使用 `Morgan 指纹` 预测电离电位、电子亲和力和带隙的 350,000 个聚合物，其中\
  \ 50,000 个聚合物用于 `NN` 的训练，另外 50% 用于测试^[37]。与其使用 `DFT` 产生的数据，Wilbraham *等人* 使用 `xTB`\
  \ 系列半经验密度泛函紧键方法生成训练数据^[35,36]，通常提供了与 `DFT` 相似的精度，但计算成本降低了至少三个数量级。上述研究使用标准的 `Morgan\
  \ 指纹`。相反，St. John *等人* 在训练预测共轭聚合物光电性质的 `NN` 时，使用了消息传递 `NN` 作为特征选择的输入^[116]。然而，这似乎并不能带来更好的预测。他们发现，为\
  \ `NN` 提供共轭聚合物的 3D 结构信息并不能提高其预测光电性质的性能，这与 Wilbraham *等人* 的观察一致，此类性质在共轭聚合物的不同构象之间变化很小^[8,37]。尽管上述所有研究都是针对非常大的数据集，但其中的结构属于更有限的结构族，例如基于芳香单体的聚合物，或由间隔基分隔的供体和受体组成的\
  \ `TADF` 候选分子。Ramakrishnan *等人* 证明，也可以训练 `NN` 来重现更广泛有机分子的光谱^[38]。他们训练了 `NNs` 来恢复一组包含\
  \ 21,800 个高度多样化分子（最多 80 个原子，包括芳香族和脂肪族分子）的近似簇单态光谱。然而，为了实现这一点，Ramakrishnan *等人* 使用包含\
  \ 3D 结构信息的描述符（`库仑矩阵`、`键袋`）作为输入。\n\n有机电子学领域另一个完全不同的例子是 Bai *等人* 最近的研究，他们使用梯度提升树来研究聚合物的若干预测和测量性质与其作为产氢光催化活性之间的相关性^[118,119]。这些梯度提升树的使用允许作者估计实验测量产氢速率的变化中很大一部分可以用这些材料性质来解释，这是传统的线性回归很难实现的，因为目前没有良好的模型可以将它们联系起来。最后，Sumita\
  \ *等人*^[97] 和 Benjamin Sanchez-Lengeling *等人*^[120] 分别使用了上述讨论过的分子生成工具 `ChemTS`（`GA-MCTS`\
  \ 和 `RNN` 的组合）和 `ORGANIC`（`GAN`）来生成具有所需光学性质的分子以及最大有机太阳能电池 `PCE` 的非富勒烯受体。Yuan *等人*\
  \ 还使用了迁移学习结合 `RNN` 来生成具有目标电子性质的供体-受体低聚物^[101]。\n\n\n\n\n在过去的二十十年里，多孔材料领域发生了多类材料的变革，包括金属有机框架（MOFs）、共价有机框架（COFs）、多孔有机聚合物和多孔分子材料（PMMs）。通过对单元或合成条件进行简单的修改，可以探索多孔材料多样的化学和结构空间，以开发针对特定应用的精细材料。目前，多孔材料最突出的领域是\
  \ MOFs 的研究，因为它们具有（主要是）晶性和扩展性本质（导致了定义良好的结构）、结构和化学的多样性，以及有趣的杂化性质（无机和有机单元存在的结果）。大型的实验性（约\
  \ 70,000 个结构）和假设性（约 150,000 个结构）MOF 结构数据库的存在，简化了许多应用中 MOF 结构-性能关系的开发。纯有机扩展多孔材料（例如\
  \ COFs）和多孔聚合物网络（PPNs）的大数据库确实存在，但它们的结构大多是假设性的或理想化的，因为 COFs 和 PPNs 通常是半晶态或无定材料。利用这些结构数据库的存在，Thornton\
  \ *et al.* 使用神经网络（NN）引导其对纳米孔材料基因组（约 800,000 种多孔材料）探索储氢。为了避免模拟所有多孔材料的吸附性能，他们在仅模拟整个数据库的一个小子集（1000\
  \ 种材料）后，使用 NN 来学习下一步模拟哪些材料。在总共模拟了 3000 种材料并训练了三次 NN（每 1000 次模拟一次，以指导下 1000 种材料的选择）后，他们确定了储氢工作容量材料空隙率的最佳范围，这显示出强烈的权衡效应。\n\
  \n扩展多孔材料孔隙网络的简化描述符（包括溶剂可及表面积、可及孔容和孔径分布）计算成本低，并可以作为扩展多孔材料机器学习（ML）表示中的指纹部分。Bucior\
  \ *et al.* 使用监督机器学习从孔隙网络内部的离散势能预测 MOFs 的储氢能力。同样，Lee *et al.* 使用拓扑数据分析来量化孔隙结构，允许以类似于条形码的方式精确比较两种多孔材料。此外，机器学习已辅助加速了更难获取属性的计算，例如二氧化碳还原中的催化性能、MOF\
  \ 带隙（使用迁移学习）和机械性能。目前，在有机扩展多孔材料的设计和性能预测中尚未使用人工智能。\n\nPMMs 包括多孔有机笼（POCs），是多孔材料的一个分支，其孔隙率源于内部空腔（内在孔隙率）和固体中单个分子的填充（外源孔隙率，由非键相互作用定义）。与有机电子领域类似，某些\
  \ PMMs 的性质可以从单个组分子的性质推断出来。例如，Evans *et al.* 发现使用支持向量机可以合理预测分子是否会形成晶体。Sturluson *et\
  \ al.* 利用 3D 形状和大小的无监督奇异值分解学习了 POCs 的潜空间表示。虽然这是一种概念证明，但他们能够证明潜空间中的最近邻具有相似的孔，并且通过潜空间进行探索是可能的，这可以导致高效探索\
  \ POC 相。目前，无法从该潜空间预测新笼的分子结构，但这项工作代表了探索 POC 搜索的一种令人兴奋的方法。Turcani *et al.* 使用包含约 60,000\
  \ 个假设和已知 POCs 的数据库，利用机器学习预测笼是否会保持形状持久性，如果是，还会预测其孔径。重要的是，他们模型的输入是单元的化学结构和建议的笼拓扑。因此，他们的机器学习算法可以在构建笼模型之前预测笼的属性，这可以极大地加速可能\
  \ POC 的探索。然而，他们的机器学习模型需要在目标子类笼（例如通过亚胺缩形成的特定拓扑笼）上进行训练，才能准确预测该子类内新笼的属性。\n\n进化算法（EA）是探索化学空间的高效方法。特别是\
  \ EA 非常适用于模块化多孔材料的探索，其中：(i) 可以简单方法修改给定材料的单个单元以获得新材料；(ii) 简单描述符预测材料属性；(iii) 材料优化是多个变量的函数。EA\
  \ 已应用于探索 MOFs 的化学和结构空间，以寻找吸附应用的候选材料。Berardo *et al.* 最近实现了一种用于目标发现 POCs 的进化算法。他们实现了一个关注笼的单分子属性（即孔径和窗口大小以及窗口不对称性）的适应度函数，并强调了在系列案例研究中展示一组多样化高排名候选者的能力。\n\
  \n\n\n\n有机聚合物可用于许多其他应用，包括绝缘材料、结构应用甚至信息存储。对有机聚合物替代用途的兴趣日益增长，因为它们的制造成本更低、柔活性更好，且化学抗性优于大多数无机对应物。神经网络（NNs）生成观测值与输出之间复杂非线性关系的能力，使其在预测聚合物性质方面特别有用，而聚物的结构-性质关系通常是复杂或未知的。Sumpter\
  \ 和 Noid 关于聚合物信息学的早期工作基于图论的定量描述符同时预测九种聚合物性质，包括分子体积、热容、玻璃化温度和热导率。尽管仅有 357 种聚合物的小型数据集，但该模型通过交叉验证减少了过拟合，其最大误差仅为\
  \ 8%。生成新的定量结构-性质关系是预测断裂拉伸强有效策略，为块体聚合物材料的强度提供了见解。Cravero *等* 表明，基于聚合物分子量的简单描述符作为输入，其预测模型优于对底层分子结构进行自动特征提取。Menon\
  \ *等* 利用分层机器学习（HML），以 18 种聚氨酯作为真值数据，预测断裂应力、断裂应变和 tan δ，克服了聚合物数据集较小的问题。在 HML 中，一个包含聚合物物理化学性质的中间层被馈入机器学习架构的下一层。事实证明，这种方法比使用随机森林模型利用聚合物组成数据直接预测性质性能更好。最近，Wu\
  \ *等* 采用机器学习预测了高热导率聚合物。采用贝叶斯分子设计过程从已知具有良好性能的化学空间区域生成新的候选聚合物。由于实验热导率数据集较小（包含 28 种聚合物），使用了迁移学习，并筛选并合成了三个候选材料。\n\
  \n填充密度影响许多性质，包括机械、光学和离子电导率。Atif Faiz Afzal *等* 使用来自 Dragon 7 库的 197 个描述符预测了无定形结构的最终填充密度。真值训练数据通过模拟分子装分子盒的分子动力学（MD）获得，并作为深度神经网络（DNN）的预测值。虽然机器学习不仅限于预测光电或机械材料性质，但已应用于预测含羰基分子的还原电位。通过高斯过程回归（GPR）校准半经验方法\
  \ PM7，Jinich *等* 生成了一个比使用基团贡献法更准确的模型。\n\n## 12.10 结论\n\n人工智能对于对于有机材料领域的广泛任务都是非常有用的；从加速性质预测、分子的从头设计并此预测具有所需性质的固体，到评估此类分子的合成可行性。在人工智能的所有应用中，一个主要障碍（如果不是所有任务的障碍）是缺乏足够的数据来训练模型。然而，对于分子表示合理的材料，数据可能比其他材料更容易生成或在文献中找到。因此，人工智能在该领域的应用显然前景广阔，并且已经超越了炒作，这表明有充分理由相信这仅仅是有机发现光辉未来的开始。\n\
