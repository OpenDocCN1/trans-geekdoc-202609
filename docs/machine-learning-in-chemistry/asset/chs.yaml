- "# 化学机器学习实战\n\n\n\n\n\n\n\n\n\n\n***\n\n编辑：\n**Hugh M. Cartwright**\n*英国牛津大学*\n\
  邮箱：`hugh.cartwright@chem.ox.ac.uk`\n\n\n\n\n\n\n\n## 前言\n利用人工智能的化学研究正蓬勃发展：从 2000\
  \ 年少数的发表论文，到 2019 年底，其出版率已增长了 100 倍。几个因素促成了这种增长：\n\n*   可以获取日益庞量的数据；\n*   计算机速度的持续提升；\n\
  *   人工智能软件效率的提高；\n*   创新专用芯片的可用性，如定制神经网络芯片；\n*   将图形芯片重新用作人工智能应用的快速替代 CPU。\n\n我们首先对人工智能的一些核心概念进行介绍，其深度适合该领域的新读者的水平（Allen，第\
  \ 1 和第 2 章）。随后的教程概述了一些最广泛的方法（Lawrence，第 3 章）。后续章节涉及广泛的话题，包括催化的基础研究（Liu，第 19 章）和材料性质的预测（Winkler，第\
  \ 9 章；Jelfs，第 12 章；Brgoch，第 13 章）；合成研究（Stukenbroeker，第 6 章；Hirst，第 7 章；Brgoch，第\
  \ 13 章）；药物设计（Hudson，第 11 章；Speck-Planche，第 16 章）；工业应用（Curteanu，第 10 章；Clough，第 14\
  \ 章）；化学理论领域（Marquetand，第 4 章；Mizoguchi，第 17 章）以及使用人工智能的一些技术方面（Staker，第 15 章）；自主化学（Stukenbroeker，第\
  \ 6 章；Simpson，第 18 章）；以及化学天文学（Viti，第 8 章）。若干章节（包括 Stukenbroeker，第 6 章；Hirst，第 7\
  \ 章；Brgoch，第 13 章；Simpson，第 18 章和 Shankar，第 20 章）涉及了可能会复杂科学中使用人工智能的一些困难，并考虑了如何规避这些困难，而另一章（Cartwright，第\
  \ 5 章）也讨论了在科学中使用人工智能的挑战和解决方案，但主要针对初学者。\n\n\n\n\n\n在那个列表中，我们（谨慎地）加入了未来量子计算机的可用性。目前的观点是，这类计算机特别适用于优化问题，而这类问题在化学中广泛存在（例如：最低能量构象是什么样的？哪种候选药物与蛋白质结合最紧密？哪条合成路线产率最高？）。化学家可以预计自己将是这项技术最大的受益者之一。\n\
  \n本书中的章节由该领域的领先研究小组撰写，提供了 `AI` 如何应用于化学的引人入胜的示例。它们让我们得以一略了 `AI` 在科学领域的迷人前景。\n\nHugh\
  \ Cartwright\n\n加拿大，维多利亚省\n\n# 第 1 章 作为科学家的计算机\n\nTIMOTHY E. H. ALLEN(a,b)\n\n^a\
  \ MRC 毒理学部门, Hodgkin Building, Lancaster Road, Leicester LE1 7HB, UK\n^b 分子信息学中心,\
  \ 剑桥大学化学系, Lensfield Road, Cambridge CB2 1EW, UK\n邮箱: teha2@cam.ac.uk\n\n## 1.1\
  \ 什么是计算科学？\n\n计算机擅长许多人类非常不擅长的任务（见图 1.1）。例如，如果你有一个带有语音助手的手机，试着问它 32761 的平方根是多少。对于手机来说，这个问题非常简单，它几乎能立即返回\
  \ 181 这个正确答案。相反，如果我们问人类同一个问题，他们可能会觉得这非常有挑战性。然而，如果他们能像手机一样快速给出正确答案，我们会认为他们是天才（或者更有可能是他们在作弊！）。现在，作为对比，尝试让你的语音助手讲一个冷笑话（knock-knock\
  \ joke），它并不起灵。与数学挑战不同，机器认为这种社交互动复杂得不可想象，但如果一个人无法参与其中，我们会认为他是个呆。孩子们在学会加法之前就学会了如何讲这些笑话。这说明了为什么计算机是如此优秀的科学伙伴，因为它们帮助科学家在他们天生非常不擅长的事情上做得更好。\n\
  \n\n图 1.1 人类与计算机的优缺点。\n\n计算科学是一个科学领域，它使用计算方法来回答科学问题。计算科学家通常尝试使用计算机科学家开发的算法来回答化学、物理或生物学等领域的问题。这在某些方面类似于实验化学家——他们是使用实验中通过反应制造分子的人，而不是提出该反应的人；又类似于一位科学家通过\
  \ `NMR` 专家设计的程序使用 `NMR` 仪器来确定生物样本的化学成分。这并不是说部署这些技术（这些技术可能是算法的、实验的或其他）的科学家没有他们的发现者那么重要。最具影响力的科学技术是那些具有长期应用价值的技术。\n\
  \n书后部分描述的人工智能 (`AI`）和机器学习 (`ML`) 的使用可以被视为计算科学，但化学领域有着悠久的历史。\n\n量子力学领域只有 100 年历史。1900\
  \ 年，马克斯·普朗克(1)提出能量是以离散量子（或能量包）的形式吸收和辐射的。阿尔伯特·爱因斯坦(2)在 1905 年利用量子理论解释了光电效应，这导致了光既是波又是粒子的理论。路易·德布罗意(3)将波粒粒二象性扩展到所有类型的物质。一旦电子像波一样的行为被接受，埃尔温·薛定谔(4)于\
  \ 1925 年提出了一个数学模型，如下所示：\n\n```\nHψ = Ep\n```\n\n其中 `H` 是哈密顿算符，`ψ` 是波函数，`E` 是一个等于系统能量的常数。薛定谔方程无法对任何系统进行求解。然而，通过适当假设，可以找到近似的概率分布，这告诉我们电子（大约）在哪里。\n\
  \n由于量子计算提供了丰富的细节，使用计算来解释甚至模拟反应至关重要。例如，加州大学洛杉矶分校（UCLA）的侯（Ken Houk）小组多年来一直使用计算探索不对称催化(5）。这类化学反应对于制造具有手性中心的分子至关重要，其中许多分子具有重要的性质。在从反应物到产物的所有化学合理路线中，我们如何选择活化能最低的那一条呢？这种低能路径通常主主反应，因此其产物应该是实验观察到的那个。活化垒的计算可以与实验观察结合起来，以评估假设并获得见解——计算的预期是否与观察一致？如果是，该模型可以通过提供化学物质从反应物变为产物过程中过渡态的结构和动力学信息，为相互作用的化学提供有用的见解。也许，在两个大基团之间是否存在不利的相互作用导致了不利路径的能量升高？或者在有利路径中是否存在任何有利的电子相互作用降低了垒？这些见解随后可以用于设计新的、更高效的反应。为了做到这一点，我们还需要考虑分子在\
  \ 3D 空间中的形状、它们相互作用以及这些系统的能量，从而计算这些所谓的活化能（见图 1.2）。\n\n\n图 1.2 侯小组中用于化学反应计算研究的常用程序。经美国化学学会许可转录自文献\
  \ 5，版权所有 2016。\n\n\n\n\n\n## 定义 AI\n\n定义 AI 的挑战性出乎意料。当我尝试定义它时，我经常会想到通用智能机器（一种能够像人类一样执行广泛不同任务的机器）的概念，因此将智能机器定义为`一种能够执行人类认为是智能行为的机器`。\n\
  \n尽管这可能并不完全完美，但它很好地总结了 AI 科学的目标，因为人类是地球上最智能物种。它与艾伦·图灵在 1950 年开发的著名的图灵测试一致。该测试的标准版本要求一个人类解释者与另外两个隐藏玩家进行对话，并随后进行判断，其中一个是人类，另一个是机器。如果在与两个玩家都过对话后，解释者无法区分机器和人类，则该机器被认为通过了测试，因此被认为是“智能”的（当然是在图灵测试的范围内）（参见图\
  \ 1.3）。^(6) 在背景下，该测试通常被称为“模仿游戏”。\n\n\n图 1.3 图灵测试。\n\n我们可能认为需要某种智能程度的任务包括语音和视觉、科学和医学决策以及策略性游戏。我们在本节的其余部分将考虑这些任务的一些示例。\n\
  \n## AI 历史\n\nAI 自 20 世纪 50 年代以来一直是科学家们的追求。在那十年中，有三次重要的会议：1955 年洛杉矶的“学习机器会议”、1956\
  \ 年达特茅学院的“人工智能夏季研究项目”，以及英国国家物理实验室的“思维过程机械化”研讨会。^(6) 这些早期会议解决了许多今天 AI 研究人员仍在面临的问题。这些包括任务示例，例如模式识别，^(7)语言理解，^(8)以及下国际棋。^(9)\
  \ 还讨论了其他更具机械性的问题，包括模仿人类大脑和中枢神经系统作为学习机器的基础，^(7)以及使用迭代学习来最终提高计算机在学习任务中的性能，^(10)以及意识到需要强大的机器来处理许多这些具有挑战性的的话。\n\
  \n让我们再次考虑之前给出的 AI 定义。人类身上有什么特质让他们变得智能？回答这个问题有助于我们理解机器需要能够做什么才能被认为是智能的吗？\n\n## 早期研究领域\n\
  \n人类通过视觉感知周围的世界。他们通过在世界中移动来探索世界。他们可以相互交流并识别输入的语音。他们还能识别他们遇到的物体模式和经历的事件模式。这些目标目前正在\
  \ AI 的各个领域中探索，包括计算机视觉、机器人、语音识别、自然语言处理和模式识别。让我们涵盖这些不同研究领域 AI 历史的一些示例。\n\n50 年代末初，许多项目尝试使用模式识别算法来辅助识别航空照片中的目标物体（航空侦察）。例如，Philco\
  \ 公司的 Laveen N. Kanal、Neil C. Randall 和 Thomas Harley 试图筛选航空照片中的军事坦克。^(6,11)\n\n\
