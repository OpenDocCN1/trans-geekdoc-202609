  \ *Angew. Chem., Int. Ed.*, 2018, **48**.\n\n# 第 20 章：机器学习在实际应用中的一些指导原则\n\n## 20.1\
  \ 引言\n\n所有影响人类的结构或设备，从微处理器到飞机和桥梁，都基于材料和化学。化学和材料性质及其对外部条件的响应，其系统化表征由以下四个部分组成：**实验、理论、数据**和**计算**。考虑到无机和有机材料的复杂性，这些特定组件对于建立基础性理解至关重要。这些组件如图\
  \ 20.1 所示，它们既是独立的又是相互关联的，这将有助于构建本章。现在我们将简要总结每个组件。\n\n[content]\n**实验**是指用于量化特定条件下材料属性的物理测量。例如，光谱法用于测量化学键和化学品的的成分；X\
  \ 射线衍射测量揭示晶体信息；二次离子质谱用于估计表面和薄膜的成分；激光诱荧光用于检测化学种类和激发态能量；热量法用于测量热特性。在工业环境中，实验用于测量化学品和材料对外部场或条件的响应，例如用于测量电阻的四探针，用于测量设备温度的热电偶、用于测试机械响应的拉伸测试。\n\
  \n**理论**是指对化学材料的基础理解。示例包括用于物质电子结构的量子力学薛定谔方程形式、用于粒子动力学的经典运动方程、用于机械的的构方程、用于化学反应能垒的过渡态理论，以及关联体系的热力学定律。理论为连接计算机模拟和实验测量提供了依据，根据其定义，理论也具有外推性，这一点我们在讨论指导原则时会再次提到。\n\
  \n**计算**与物理实验测量相似（*计算机实验*），是指在计算机中进行的模拟实验。计算方法的示例包括用于微分方程的积分程序、用于概率过程的蒙特卡洛模拟、用于相平衡的热力学方法、用于激发态性质的多体方法，以及用于非均匀和非平衡属性的格林函数方法。计算模拟可能将一种或多种技术与其他组件相结合。例如，密度泛函理论（DFT）作为*理论*薛定谔方程形式的简化，可用于`计算`基态能量。\n\
  \n\n\n`Data` 是第四个组件，被认为对于组件之间信息的传输和链接至关重要。例如，基于光谱测量的化学成分的数据被用于在计算机中构建材料的化学结构，或建立化学反应速率。通过适当的理论和数值形式，可以对这些化学结构进行模拟（使用计算机），以理解与实验测量不同的条件下的动力学。蛋白质折叠模拟就是一个例子，它利用测量的蛋白质晶体结构来估计蛋白质行为的长期动力学。数据也可用于发展理论。其中一个例子是\
  \ `Planck` 利用太阳光谱的实验光谱数据并在现有关联的基础上开发的黑体辐射定律。\n\n为了全面理解真实的化学和材料系统，可以通过等离子体处理的示例来说明所有这些组件结合的重要性。基于等离子体的处理是固态电路大规模集成半制造中最关键的步骤之一，这也是当今计算机的基础。由于等离子体是“冷但高活性”的系统，其电子能量（`10\
  \ 000 K`）远高于离子、分子和其他化学特定物种的能量（大于 `300 K`），等离子体中大多数的活性化学过程处于非平衡态。理解这些非平衡相互作用对于控制半导体中的这些过程是必要的。20\
  \ 世纪 90 年代，由半导体公司联盟开展的一项成功努力系统地量化了全氟氢烃等离子体化学的不同方面。^(1–4)[图 20.2 展示了上述四个组件应用于等离子体处理的示例。为了解决非平衡化学的复杂性，涉及的组件结合了测量（例如离子傅里叶变换光谱法、膜厚度）、理论（例如二体碰撞贝特模型、二体碰撞-偶极模型）、计算（例如变分格林函数方法、等离子体动力学、气相和和表面化学计算）以及数据（例如电子碰撞截面、离子反应速率、刻蚀速率）。\n\
  \n![image](img/bk9781788017893-00512-f2.jpg)\n\n图 20.2 用于等离子体处理的基础化学或材料表征的四个个组件。\n\
  \n## 20.2 机器学习应用的指导原则\n\n一组方法统称为机器学习（`ML`）或基于人工智能（`AI`）的方法，它们基于先验数据，最近成为生物、化学和材料科学领域材料表征和设计的强大方法。^(5–8)\
  \ `ML` 模型是近似模型，用于开发和量化输入数据（“描述符”）与输出信号（“观测值”）之间的关联。这些近似通常在模型准确性确定之前从“训练集”中*学习*得到。\n\
  \n\n\n\n这一原则指出了这样一点：尽管机器学习（ML）方法在模型训练范围内的插值（interpolation）能力非常有效，但在训练集范围之外进行外推（extrapolation）时必须谨慎。与描述所考虑的物理现象及其适用性的理论不同，训练数据取决于可用数据的限制，包括特定的属性或特征、成分和结构范围、实验测量（或模拟）的条件，以及空间/时间尺度。任何经过统计学训练和表征的机器学习模型，在这些限制内都是适用的。然而，在这些限制之外进行外推可能会提供误导性结论，我们将通过元素周期表的制定示例来说明这一点。\n\
  \n分类最成功的应用之一是周期表，它最近被科学家和工程师在 2019 年誉为“元素周期表国际年”。周期表的制定归功于德米·门捷列夫（Dmitri Mendeleev），他在\
  \ 1869 年证明了当时已化学元素按照各自的原子量排列时，表现出周期性。^(14) 门捷列夫最初发表的周期表版本请参见图 20.3。虽然此前已经观察到化学元素行为的模式，但我们将使用门捷列夫周期表的例子来强调插值和外推之间的区别。这是因为门捷列夫在修正现有材料的原子量之外，还对许多新元素及其化学性质做出了极其成功的预测。原子量可以被视为机器学习文献中定义的“描述符（descriptor）”。门捷列夫用于分类元素的几个关键要点总结如下所示，并在他的论文^(14,15)以及其他地方中进行了更详细的讨论：^(16)\n\
  \n1. 元素按照原子量的大小排列时，表现出“属性”的周期性；\n2. 化学性质相似元素的原子量要么具有相似的值，要么以均匀的方式增加；\n3. 按照原子量的排列对应于元素的化价，并在某种程度上对应于它们化学行为的差异，例如\
  \ Li、Be、B、C、N、O、F；\n4. 原子量的大小决定了元素的属性；\n5. 它允许人们预见到许多新元素的发现，例如原子量在 65 到 75 之间的 Si\
  \ 和 Al 的类似物；\n6. 可以预见到某些原子量需要修正，例如 Te 的原子量不能为 128，而应该是 123 到 126 之间的值；\n7. 上表暗示了元素之间新的类比关系；\n\
  \n![image](img/bk9781788017893-00512-f3.jpg)\n\n图 20.3 门捷列夫的原始周期表。\n\n在门捷列夫的“一般推论”中，可以看到许多关键点，这些是当前使用机器学习方法进行模式识别的先驱。他根据原子量将元素分类为组的预测、对可能存在的新元素的预测，以及对现有原子量的修正，都得到了经验观察的验证。门捷列夫能够建立物理属性（例如原子量）与决定元素如何与其他元素结合的化学属性（例如形成酸或碱）之间的区别。直到今天，周期表仍然是分类、描述、分析和预测的工具，正如机器学习方法所声称的那样。尽管门捷列夫使用这种形式来分析化学反应的相似性，并且他的分类似乎解释了一些关键观察结果，但他意识到将这一系统过度扩展到化学反应是有危险的，正如他的话所：^(14)\
  \ “由于简单物质之间存在关系的多样性，人们无法将它们的系统表示为连续序列，因为物质之间的相互关系极其多样化……”。我们强调了“多样化（diverse）”一词，是为了说明化学在可能性上是复杂的，因此任何基于特定数据的插值在应用上都可能是局限的。\n\
  \n基于这种分类，门捷列夫通过原子量的插值预测了几个未知元素的存在。这种方法的成功案例在他对“类硅”（eka-silicon）性质的预测中显而易见，该元素后来被发现并命名为锗（germanium）^(16)（参见表\
  \ 20.1）。\n\n表 20.1 类硅与锗预测属性的比较。改编自文献 16，经 Oxford Publishing Limited 许可，版权 2007。\n\
  \n| 属性 | 类硅 (Easilicon) | 锗 (Germanium) |\n| --- | --- | --- |\n| 原子质量 | 72 | 72.61\
  \ |\n| 密度 | 5.5 | 5.35 |\n| 熔点 (°C) | 高 | 947 |\n| 颜色 | 灰色 | 灰色 |\n| 氧化物类型 | 耐火氧化物\
  \ | 耐火二氧化物 |\n| 氧化物密度 | 4.7 | 4.7 |\n\n门捷列夫进一步使用原子量作为分类参数进行了许多预测。他对原子量的估算，以及成功的预测（例如原子量为\
  \ 44 的类硼）和失败的预测（例如原子量为 0.4 的类钋）在表 20.2 中。从这些预测中可以观察到有趣的现象，其中两个显示了这种方法的局限性：1) 某些原子量的值被估计小于\
  \ 1；2) 预测的成功率约为 50%。在 19 世纪末，原子量被用作基于已知数据分类元素的唯一关键变量，这是一个非常显著的成功率。然而，它也说明了试图根据复杂系统（代表化学领域）的已知模式和行为以简单的图表形式进行外推的困难。20\
  \ 世纪原子序取代了原子量以及量子力学原理的引入，导致了更准确的元素分类方法。新理论、实验测量和计算提供了更详细、更一致的分类。如前提到的，门捷列夫本人在制定期间意识到了局限性，但由于早期的验证（包括新元素的发现，例如\
  \ 1886 年发现锗），他变得更有信心，并尝试进行广泛的外推。已知分类的外推本身是局限的，从门捷列夫的预测（包括小于 1 的原子量）可以看出。这限制了它在化学中的应用，因为复杂性限制了通过简单相关性进行描述。门捷列夫的方法对于研究人员在应用科学原理进行不当语境之外的外推时，起到了红旗警示的作用。\n\
