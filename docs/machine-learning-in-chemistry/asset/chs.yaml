  \n# 第 14 章\n## 化学工程中的机器学习应用\n\nY. YAN, T. N. BORHANI AND P. T. CLOUGH*\n\n克兰菲德大学能源与动力主题，英国克兰菲德，贝德福郡，MK43\
  \ 0AL\n\n\\*邮箱：p.t.clough@cranfield.ac.uk\n\n## 14.1 引言\n\n化学工程可以广义地定义为原料/能量转化为有用产品的过程；无论过程多么复杂，一切都经过设计、优化和控制，以确保生产的经济性、安全性并兼顾环境。化学工程师通常与石化工业相关联，在那里，管道、储罐、反应器和泵随处可见，但这只是化学工程的一个应用领域，化学工程师扮演的角色具有巨大的多样性。通过所谓的第四次工业革命（工业\
  \ 4.0 – 集成自主数据处理的物联网），化学工程师被要求利用其工艺产生的海量数据来使工艺厂变得更“智能”，以获得财务优势；人工智能（AI）的应用即是实现这一任务的一种方法^(1)\n\
  \n人工智能正以更多方式在所有行业中开发，以发现对数据的有用见解和理解，从而提高效率和工艺性能，因此在化学工程中找到应用也是理所当然的。最近，包括 BP^(2)、埃克森孚（ExxonMobil）^(3)、HSE^(4)和\
  \ GE^(5)在内的公司已为化学工程的人工智能应用投入巨资，以提高工艺的安全性和可靠性，识别新的连接和工作流，加速项目周期，并能够快速使用最新的工艺数据。在所有投资中，我们应该记住，人工智能仍然仅仅是“窄人工智能”，这意味着它非常擅长执行某个特定任务；要建立代表性模型来在未知数据之间建立联系，或理解整个工厂/工艺的集成和依赖关系，是非常耗时的。此外，那些被宣传应用于化学工程设施和工艺的\
  \ AI 系统，通常承担数据分析和数据洞察的角色，在数据中寻找人类需要花费多多时间才能发现的模式，而不是运行或优化工厂的运行^(6)这并不意味着先进的数据分析不那么重要；事实上，大多数公司都渴望有机会识别出水泵或压缩机即将故障以便进行更换，而不是等待它故障、导致工厂关闭然后进行冷启动。然而，化学工程中的人工智能很少在线上应用以提供实时数据分析和工艺性能洞察，而这正是化学工程中人工智能未来可能、也应该发展的方向。\n\
  \n虽然当前更快、更强大的计算能力的涌入为所有工业部门（包括化学工程）带来了一波以 AI 为主题的热潮，但人工智能实际上并不新鲜。在机器学习（ML）计算的早期（1980\
  \ 年代），专家系统（ESs）以及随后的遗传算法（GAs）被用于化学工业，以辅助催化剂开发和预测热物理流体属性^(7,8)随着时间的推移，神经网络（ANNs）取代了其他形式的人工智能，因为它们能够很好地适应问题、解决非线性问题，并且有充足的训练数据。机器学习是一个涵盖性的术语，在全文我们将让读者了解它的种类、局限性以及优势。\n\
  \n在本章中，我们探索了机器学习算法应用于化学工程的三个领域：建模与仿真、过程控制以及估计。\n\n## 14.2 建模与仿真\n\n机器学习和人工智能在化学工程的建模与仿真方面应用广泛^(1,9)在这里，我们考虑了化学工程中重要的单元操作；需要注意的是，除了建模和仿真，人工智能在与化学工程相关的优化问题也有实质性的应用^(10)任何\
  \ AI 模型的通用格式如图 14.1 所示。\n\n```\n![image](img/bk97801783-0340-f1.jpg)\n```\n图 14.1\
  \ 人工智能模型的通用格式。\n\n### 14.2.1 人工智能在分离单元的应用\n\n#### 14.2.1.1 馏塔\n\n馏塔的建模和仿真需要精确的工艺模型，包含预测不同参数和物理属性的方程。文献中有许多工艺模型，但分离过程的复杂性限制了模型的通用性。大多数分离系统的机理模型假设平衡。此类模型偏离了现实，因此无法提供真实的描述。为了克服这个问题，引入了非平衡或速率方法。这涉及到每个相的化学反应和质传方程，增加了问题的复杂性。此外，此类模型对计算的要求很高，不适用于实时优化。为了解决这些问题，可以利用人工智能对不同的馏塔或其他吸收塔等单元操作进行复杂的仿真。\n\
  \nChetouani^(11) 使用多层感知器-神经网络（MLP-ANN）方法开发了一个模拟稳态和非稳态馏塔的模型。Khayet 和 Cojocaru^(12)\
  \ 使用神经网络模拟了空气隙膜蒸馏过程。ANN 模型的输入变量是空气隙厚度、冷凝温度、进料温度和盐溶液进料流量，而响应或输出是考虑了渗透量和脱盐率的性能指标。开发模型的结果与实验数据吻合良好。Ochoa-Estopier\
  \ *等人*^(13) 使用神经网络表示了原油馏塔及其集成换热器网络。使用 ANN 模型，作者确定了提高整体工艺经济性的运行条件。Osuolale 和 Zhang^(14)\
  \ 使用 ANN 建模并优化了馏塔的热效率。他们提到，用于实时优化的馏塔机理建模是不可行的。对于这种情况可以使用 ANN 模型，因为 ANN 所需的计算时间非常短，这对实时优化非常有帮助。\n\
  \n\n\n\n#### 14.2.1.2 吸收器与脱离器\n\n吸收和脱离是工业中起着至关重要的单元操作。这些过程最广为人知的例子是从不同的气流（如烟气、天然气和沼气）中去除。与精馏塔相比，吸收塔的机械建模需要复杂的方程求解。使用\
  \ AI 进行黑箱建模对于此类系统是有益的，研究人员可以快速地预测所需的输出。一些发表的研究使用了不同的 AI 工具对吸收脱离塔进行建模。在本节中我们回顾了 Zhou\
  \ 等人开发的自适应神经模糊系统（`ANFIS`）来描述胺的吸收和脱离过程。他们通过改变不同的参数作为输入和输出，`ANFIS` 建模流程如图 14.2 所示。\n\
  \n![image](img/bk9781788017893-00340-f2.jpg)\n\n图 14.2 Zhou 等人开发的用于催化剂活化的吸收器 `ANFIS`\
  \ 建模流程。转载自文献 [18]，经 Elsevier 许可，版权 2013。\n\n作者报告称，除非对输入参数集进行更改，否则场景 #1 和 #2 中的问题无法完全解决。一个重要的观察是通过再生器（`FT-103`）的蒸汽流量。Hafizi\
  \ 等人比较了自适应神经模糊系统和 `ANN` 模型对富氨流量的建模。Mohammadzadeh 等人利用 `ANN` 预测吸收塔中的甜气浓度，使用了二乙醇胺（`DEA`）作为溶剂。实验中试数据用于验证包含\
  \ `DEA` 浓度、`H2S`、`H2O`、温度、压力和输入输出气流量的模型。研究的统计参数和误差分析是满意的。Cozma 等人使用气升反应器利用水作为溶剂物理吸收沼气。作者使用了两种算法：克隆选择（`CS`）与\
  \ `ANN` 的组合以及新算法 `n-MB`；根据实验数据产生了更好的模型。Ahmad 等人使用 `ANN` 执行吸收塔的动态建模。网络的输入是吸收或脱离因子，输出是吸收或脱离效率。不同的误差分析和统计参数显示了他们模型的强度。\n\
  \n#### 14.2.1.3 吸附\n\n吸附是另一种近期引起广泛关注的分离过程，许多研究旨在加速该过程的商业化。与吸收相比，吸附的主要优势是能耗较低。众所周知，溶质在脱离过程中消耗大量的能量。AI\
  \ 在该领域有相当的应用。Salehi 等人应用最小二法向量机预测改性 `CS/PVA` 膜吸附剂对离子的平衡吸附。作者使用了 72 个实验数据点并报告了良好的统计参数。Fawzy\
  \ 等人提出了一个 `ANFIS` 模型来描述使用生物吸附剂（称为 `Typha domingensis`）从水溶液中去除二价镍和二价镉离子。通过该模型，作者识别了影响金属离子去除的实验参数顺序。Ghaedi\
  \ 和 Vafaei 回顾了不同 AI 方法在水溶液染料吸附中的应用。Mazaheri 等人使用包括 AI 在内的不同方法天然碳对双相水溶液中的甲烷蓝（`MB`）和二价镉离子建模。敏感性分析显示吸附剂质量和\
  \ `pH` 是去除的关键因素。Alalm 和 Nasr 使用活性炭从水溶液中吸附危险物质氯噻，然后使用 `ANN` 模型预测吸附容量。通过对开发的 `ANN`\
  \ 模型进行敏感性分析，他们发现 `pH` 是吸附容量的最显著因素。Mahmoud 等人专注于使用纳米零价铁从水溶液中去除磷酸离子。作者使用了结构为 `5.7.1`（5\
  \ 个输入节点、7 个隐藏层节点和 1 个输出节点）的 `ANN` 对该吸附过程建模，并报告了 97.6% 的决定系数。模型的敏感性分析表明，`pH` 是影响最大的输入。\n\
  \n### 14.2.2 AI 在反应器建模与模拟中的应用\n\n反应器及其设计可以被认为是化学工程师处理的最专业的单元操作。反应器具有广泛的应用，从聚合到能量转换过程不等。反应器的建模是一个复杂且耗时的过程，因此研究人员经常采用\
  \ AI 方法进行黑箱建模来模拟反应器。\n\nAzarpour 等人开发了一种结合了原理模型和 `ANN` 的混合模型，用于模拟催化剂活化的工业固定床反应器。该混合模型的元素如图\
  \ 14.3 所示。\n\n![image](img/bk9781788017893-00340-f3.jpg)\n\n图 14.3 用于催化剂活化的固定床反应器（`FBCRs`）混合模型。转载自文献\
  \ [30]，经 Elsevier 许可，版权 2017。\n\nJoshi 和 Singhal 将 `GA` 与 `ANN` 耦合以优化玉米黄质生产的运行条件。作者评估了不同培养时间内空气流速和接种大小的影响。然后利用\
  \ `GA-ANN` 优化条件对气泡柱的体积功率和能量输入进行关联。Zhu 等人引入了一种深度学习方法，从原始图像自动识别热解反应器中的管区域。通过这种方法，可以监测热解管的精确温度和形状。\n\
  \n\n\n使用一种结合了机制建模和 `ANN` 建模的混合 `ANN` 模型对全工业废水处理过程进行了建模。作者报告了该混合模型获得了满意的结果。Tunckaya\
  \ 和 Koklukaya 通过 `ANN`、自回归积分移动平均 (`ARIMA`) 和多元线性回归 (`MLR`) 方法，在影响烟气排放的八个建议工艺参数内，研究了一座真实的\
  \ 180 MW 燃煤热电厂气体排放的影响。根据统计参数和误差分析，`ANN` 模型的表现均优于 `ARIMA` 和 `MLR`。Nourani 等人利用不同的\
  \ AI 方法（如 `FFNN`、`ANFIS`、`SVM` 以及 `MLR`）通过出水生物需氧量、化学需氧量和总氮预测了尼科夫亚废水处理厂的性能。作者报告，`ANN`\
  \ 模型是最成功的模型。\n\n#### 14.2.4 AI 在能源管理建模与仿真中的应用\n\nAI 最近应用的另一个重要领域是能源管理和能源系统。该领域已发表许多研究和综述论文，因此此处仅对其中少数进行了回顾。\n\
  \nZahraee 等人总结了关于在人工智能算法中使用优化技术进行混合能源系统领域的设计、规划以及控制问题的现有研究。作者回顾了的一百多篇相关论文。Jha 等人阐述了\
  \ AI 在实现可再生能源 (`RE`) 相关目标方面的重要性，例如开发利用可用自然资源进行最优生产的新技术、环境意识以及更好的管理和分配系统。他们回顾了 AI\
  \ 在不同类型 `RE`（如太阳能、风能、地热、水能、海洋、生物能和氢）中的应用。Sharifzadeh 等人量化了电网的不确定性，并检查了其行为的可预测性。他们在研究中考虑的预测方法包括\
  \ `ANN`、支持向量回归 (`SVR`) 和高斯过程回归。所有模型都能预测风能和太阳能发电，但只有 `ANN` 模型对电力需求有效。考虑到电网的动态性，人们意识到可再生风能和太阳能发电以及电力需求的预测过程足够快速且准确，可以有效替代替代储能和备用容量。\n\
  \n## 14.3 控制与操作\n\n如果说化学工程是大规模将一种物质转化为另一种物质的科学，那么控制和操作就是任何工艺经济成功的不可缺的一部分。所有化学工程领域工艺控制的共同总目标是实现稳定的稳态运行，使设施在或接近其设计的最高效率点运行。工厂通常会跨越多个反应器，并拥有看似无止尽的管道，在战略位置布置仪器仪表，以深入了解反应器的运行情况并对进料和出口流进行表征。工厂的复杂性和集成程度越高，工艺控制和操作就越困难，这正是新形式的工艺控制开始出现的地方，特别是通过机器学习。\n\
  \n### 14.3.1 工艺控制的基准\n\n比例、积分和微分 (`PID`) 控制器是大多数本科工程专业学生的课程内容，并被广泛认为是工艺控制的标准。`PID`\
  \ 控制器利用设定值变量与实际过程变量值之间的差异产生误差，并利用该误差计算控制信号。这些 `PID` 环的变体可以串联使用，其中一个控制器的输出作为另一个变量控制器的设定值，从而消除了一些动作之间的延迟时间，并将整体工艺控制的复杂性简化为单个变量控制；这被称为级联控制。\n\
  \n如果我们考虑具有多个变量（温度、压力、流速、液位和质量）且每个变量都需要控制，但由于热力学定律本质相互关联的复杂工艺，那么 `PID` 控制器就不再是最佳解决方案。在这些模拟中，可以使用多变量控制技术，该技术可以解耦关联变量控制之间的竞争影响，从而最大限度地减少实现优化稳态运行所需的精力/成本/能量。如果变量之间的相互作用被充分理解（或不存在），这些多变量控制系统运行良好，但如果工艺运行出现轻微偏差，它们将会失效。例如，如果蒸汽甲烷甲烷反应器设计为在水碳比为\
  \ 3 时运行，但后来有人认为应该是 3.5，那么多变量控制解耦将无法考虑到这一偏差，并无法准确控制反应器。\n\n一种可以克服工艺复杂性、变量互连性和依赖性、过程测量延迟、随机扰动，并最大限度减少达到稳定设定点所需的精力/成本/能量的潜在更好替代方案，是机器学习控制，或者至少在模型预测控制出现之前它本可以是。\n\
  \n模型预测控制 (`MPC`) 是一种非常常用的动态系统控制技术，它可以通过线性模型进行模拟，同时满足一组约束。`MPC` 使用过程模型来控制当前时间步的依赖变量，同时在考虑过去值的移动预测视野内计算并优化未来值。这种控制技术之所以被广泛使用，是因为工艺对于\
  \ `PID` 环来说往往太复杂，而且在 20 世纪 80 年代，实现 `MPC` 算法比使用机器学习的控制算法更容易、更便宜。然而，当工艺依赖于数百个变量或工艺是非线性的，`MPC`\
  \ 就会失效（工艺通常如此，尽管某些工艺在较小的运行范围内被认为是线性的）。还有将多个 `MPC` 组合在一起，如果非线性系统可以分解为多个独立的线性系统，这种方法可以提供稳定的控制系统；这种方法已在炼油厂和共聚反应器中的应用得到证明。\n\
  \n### 14.3.2 用于控制化学工艺的机器学习\n\n\n\n\n神经网络在几十年前已被证明适用于控制复杂的化学过程。^([43]) 例如，Savkovic-Stavanovic\
  \ 显示 `ANN`s 可用于控制共沸沸蒸馏过程，并证明了通过对模型数据输入进行时间偏移来改进过程控制的能力，这种方法起到平滑控制器的作用。^([44]) Ramchandram\
  \ 和 Rhinehart 也利用 `ANN` 来控制蒸馏过程，并发现与前馈 `PI` 控制器相比，`ANN` 提供了更优的控制效果，因为它能够考虑到“现象学过程特性”，而标准的\
  \ `PI` 控制器完全无法理解这些特性。^([45]) 这些 `ANN` 通常与过程并行应用，它们在观察和预测过程中不断积累经验和知识，见[图 14.4]。\n\
  \n![image](img/bk9781788017893-00340-f4.jpg)\n\n图 14.4 *ANN 与过程并行训练，利用其预测误差来增加其对过程控制的置信度*。^([46])\
  \ 经 Elsevier 许可转载自文献 [46]，版权所有 1992。\n\nANN 还被用于估计蒸馏塔的液位和组成，从而起到软传感器的作用。^([47])\
  \ 软传感器通常基于 `ANNs`，已被多位研究人员用于在没有特定/昂贵硬件的情况下预测未测量变量，以改进过程控制，^([48]) 例如在燃煤电厂，^([49])、聚合过程中，^([50])、葡萄酒生产中的乙醇浓度测定，^([51])、化学工厂，^([52])\
  \ 以及某些生物过程中。^([53],[54]) 在过程/反应器完全运行的同时在线更新软传感器是这些设备产生长期影响的关键。Lu 和 Chiang 的工作^([55])\
  \ 强调实现这一目标的方法；他们利用两个关键性能指标，并应用 `Hotelling's T²` 多变量统计量来判断 `T²` 值是否超过需要采取行动的报警限制。这项工作的核心创新点在于，软传感器可以在训练数据存在且系统属性已知的边缘工作，并且软传感器的“校准”可以在在线运行期间进行更新。^([55])\
  \ 软传感器的一个主要局限性是它们可能仅适用于某个特定的系统或反应器设置，因此不被认为与另一个相似的过程兼容。过程通常依赖于未知/未测量的变量或无法轻易编程的信息。\n\
  \n### ANN 应用与软传感器\n\n...（其余文本遵循相似逻辑）\n\n\n\n\n显然，将定义不当的目标函数应用于整个化学工厂可能是危险的，这也就是为什么研究人员现在正在探索一种方法，即不再为机器学习化学反应器控制系统定义目标函数，而是允许模型构建其对整个过程的自理解。事实证明，这种方法比给模型提供“人类知识”能够实现更佳、更安全的控制，因为很难将每一项人类知识都提炼为一组目标。深度强化学习也已应用于许多其他简单的控制情景，并取得了高度的成功，但受限于训练程序的时间。然而，通过允许程序进行自学习并强化正确的控制行为，生成的控制算法可以迁移到其他控制问题中。遗传编程也成功应用于流体控制场景，其中目标函数是通过改变入射的水流来使背向阶梯的再循环面积最小化（实现了\
  \ 80% 的减少）。一种具有自学习能力的多代理控制系统已应用于连续水泥生产线，其方法是分解了过程控制的关键点（质量控制、决策者、数据分析师、知识持有者）。这种方法使得整个控制系统对过程中的随机偏差具有更强的韧性，而且能够适应由机器学习控制系统形成的新控制规则。\n\
  \n### 14.3.3 集成机器学习的传统控制器\n\n机器学习控制器的实现通常是为传统的 `PID` 或 `MPC` 控制器提供输入信号。该输入信号可以是预测值或预测的误差估计；这些额外信息被用于提供更接近期望设定点的控制，请参见[图\
  \ 14.5]以了解机器学习增强型反应器控制可实现的改进示例。\n\n![image](img/bk9781788017893-00340-f5.jpg)\n\n\
  图 14.5 利用不同形式反应器控制的连续搅拌釜反应器的温度响应。黑线表示机器学习增强型控制器。转录自文献 [63]，经 Elsevier 许可，版权所有 2018。\n\
  \nDeepa 和 Baranilingesan 利用了带有背景 `ANN` 的 `MPC`，以利用 `ANN` 学习和存储关于模拟连续搅拌釜反应器价值信息的能力。他们的研究利用粒子群优化算法和引力搜索算法来定义初始权重，然后调整\
  \ `ANN` 以更有效地控制过程。\n\n由于 `PID` 控制器仍然很常见，一些研究人员利用机器学习来优化调优过程以改进控制，特别是 Chen 和 Huang，他们的研究采取了一种使用线性化\
  \ `ANNs` 控制非线性过程的实用方法；然而，他们注意到模型需要对不同的运行范围更具灵活性，且数据中的噪声显著影响了控制。Chowdhury *et al.*\
  \ 描述了类似的使用 `ML`-增强型控制器的尝试，他们使用了模糊 `PID` 控制器（一组具有相对重要性的规则），并发现模糊控制器能够更准确地跟踪设定值并减小偏离设定值的幅度。\n\
  \n化学过程的控制高度依赖于对其整体的理解，但由于规模和复杂性，这并不总是可能的。\n\n## 14.4 估计与预测\n\n`AI`（特别是 `ML`）在化学工程中的应用不仅限于控制，还可以用于估计。在本节中，我们将详细概述\
  \ `AI` 和 `ML` 的应用，以及它们的优点和局限性。\n\n### 14.4.1 估算器可用的 AI 算法\n\n众所周知，某些重要的过程参数很难实时测量。诸许多算法如\
  \ `ANNs`、支持向量回归、`fuzzy logic`、`GAs` 和 `ESs` 被用于解决这些问题。近期，通过将 `AI` 应用于估算器已进行了大量研究。因此，本节提供了对每种估计和预测算法的详尽调查。\n\
  \n表 14.1 AI 在化学工程中估计和预测的一些应用。\n\n| 算法 | 目标 | 亮点 | 参考文献 |\n| --- | --- | --- | ---\
  \ |\n| `ANN` | 预测循环流化床的 `SO2` 排放 | 能够预测不同条件下的 `SO2` 排放 | [99] |\n| `ANN` | 预测不同固体燃料的热解、气化和燃烧率\
  \ | 在训练数据充足时准确性良好 | [73], [100] |\n| `ANN` | 估计 `CO2` 捕获率 | 闭循环吸收/解器装置误差小于 0.2%\
  \ | [70], [106] |\n| `ANN` | 估计合成磷酸钙粉的成分 | 可以通过预测成分来优化合成条件 | [107] |\n| `ANN` |\
  \ 通过自助聚合 ANN 对聚合物质量进行推断估计 | 自助聚合 ANN 的预测准确性高于单个 ANN，且置信区间可以显示估计的置信度 | [69], [108]\
  \ |\n| `ANN` | 在温度和熔和成分范围内预测熔渣粘度 | 预测性能优于任何其他数学模型 | [109] |\n\n\n\n\n\n| 方法 | 应用\
  \ | 结果 | 参考文献 |\n| :--- | :--- | :--- | :--- |\n| ANN | 铝铜复合材料中密度、孔隙率和硬度的预测 | 可以估计而非测量出满意的结果\
  \ | [110] |\n| ANN | 炉内传热系数的建模 | 与数值结果和实验结果吻良好 | [111] |\n| ANN | 废水处理厂性能预测 | 针对生物处理厂的高非线性特征提供了高效预测\
  \ | [112] |\n| ANN | 气液平衡预测 | 预测性能高 | [113] |\n| SVR | 气泡反应器中总气含量的预测 | 预测准确率达 97%，平均绝对相对误差为\
  \ 12.11% | [114] |\n| SVR | 管道爆裂率预测 | ANN 的预测结果优于 SVR | [115] |\n| SVR | 空气温度预测\
  \ | SVR 模型比 ANN 模型略准确 | [79] |\n| SVR | 间歇蒸馏柱的软传感器 | 开发的估计器在变化的回流比下具有高精度 | [77]\
  \ |\n| FL | 水泥抗压强度预测 | 低平均百分比误差 –2.69% | [81] |\n| FL | 大流域土壤侵蚀预测 | 易于确定土壤侵蚀 | [116]\
  \ |\n| FL | 混凝土性能预测 | 实验结果与 ANN 和 FL 吻合良好 | [117] |\n| FL | 物物浓度预测 | 适用于在线估计 | [118]\
  \ |\n| GA | 吸附和相平衡问题中的多参数估算 | 多目标优化的有效工具 | [119] |\n| GA | 生物吸附参数估计 | 能够准确找到最优估计值\
  \ | [95] |\n| GA | 液液柱中的估计 | 提供关于溶液对模型参数敏感性的信息 | [91] |\n| ES | 疲劳寿命预测 | 提供中等且保守的预测\
  \ | [85] |\n| ES | 物理属性预测 | 为属性提供咨询建议 | [120] |\n| ANN-FL | 优化 CO2 工艺的操作并提高效率 |\
  \ 混合模型将以高精度模拟实际过程 | [18] |\n| ANN/SVR-GA | 催化设计的建模与优化 | 结合工艺知识从历史数据学习 | [121] |\n\
  | SVR-GA | 压降预测 | 提高预测准确性 | [122] |\n\n### 人工神经网络 (ANN)\n\nANN 是化学工程中作为估计器应用最常用的算法。它受生物神经元的启发，可以学习复杂的非线性和多变量关系。ANN\
  \ 可以充当“黑箱”，根据一组输入数据预测所需的输出。通常情况下，一个 ANN 包含一个输入层、一个或多个隐藏层和一个输出层，每层都包含神经元。它通过计算网络权重和偏置，从历史数据中确定输入与输出之间的关系，从而创建一个训练好的\
  \ ANN，能够根据给定的输入数据预测输出。对于化学过程系统的估计和预测，已经报道了多种类型的 ANN，例如前馈神经网络、循环神经网络和径向基函数神经网络。不同类型\
  \ ANN 的详细比较和描述可以在 [66], [67] 中找到。\n\n训练数据的大小和质量以及 ANN 架构决定了模型的性能和准确性。目前没有获取隐藏层数量及每个隐藏层神经元数量的最优方法；通常采用试错法。模型能达到的泛化程度可能是一个问题。例如，如果一个训练好的\
  \ ANN 可以完美拟合训练数据集中的数据，但其在未见数据上的表现很差，那么这通常表明存在过拟合。目前已报道了许多提高泛化能力和避免过拟合的方法，如自助自助聚合神经网络\
  \ [68]-[70]、正则化 [71], [72] 以及基于早停策略的交叉验证 [73]-[75]。\n\n### 支持向量回归 (SVR)\n\nSVR 是一种基于支持向量机\
  \ (`SVM`) [76] 的机器学习适应，也被广泛用作化学过程系统的估计器。SVR “通过非线性映射将输入数据映射到高维特征空间，随后在该特征空间内获得并求解线性回归问题”\
  \ [76]-[78]。SVR 由保留的核函数生成，与保留核相关的数据点被称为支持向量 (`SV`)。较小比例的支持向量会产生更具泛化性的解，在求解新的未知对象时所需的计算量更少\
  \ [77]。与 ANN 相比，SVR 具有以下优势：回归函数良好的泛化能力、解的稳健性、回归的稀疏性、解复杂性的自动控制以及数据点的知识提取 [76], [79]。然而，在处理海量数据集时，SVR\
  \ 算法受到可用硬件速度和内存限制。\n\n### 其他方法 (FL, GA, ES)\n\n除了 ANN 和 SVR，模糊逻辑、GA 和 ES 也被开发为不同化学过程系统的预测器或估计器。模糊逻辑是一种多值逻辑，区分的不仅仅是真（TRUE）和假（FALSE）；它可以根据一组模糊规则从给定的输入数据映射到输出\
  \ [81]。\n\n它包含四个部分：模糊化、模糊规则库、模糊输出引擎和去模糊。模糊化将输入输出转换为语言子集。模糊规则库包括基于专家知识和/或可用数据构建的模糊\
  \ `IF-THEN` 规则。模糊输出引擎考虑规则库中的规则并学习一组输入输出之间的关系。最后，去模糊将输出引擎的模糊输出转换为数值 [80], [81]。模糊逻辑可以以某种方式将输入输出联系起来，这种方式比\
  \ ANN 更符合人类思维 [81]。\n\n\n\n\n\n专家系统是一种应用人工智能方法，它利用计算机模拟人类专家的决策能力。基于知识的专家系统由两个子系统组成：知识库（事实和规则的集合）和推理引擎（后者可以根据知识库的内容预测结果）。^(7,82)\
  \ 基于专家系统的估计器在预测化学过程中系统中不同参数方面的各种应用，可以参见文献 7 和 82–85。尽管目前有很多关于在化学工程中使用基于专家系统的估计器的报道，但构建一个可靠的专家系统既耗时又昂贵，这限制了它的采用。^(1)\n\
  \n遗传算法最早由 Holland 在 20 世纪世纪 70 年代引入。^(86)这种数值优化算法灵感来自自然界中的遗传和进化机制^(87,88)涉及初始种群生成、适应度评估以及选择、交叉和变异等遗传操作。^(87)关于遗传算法的详细讨论可见文献\
  \ 86–88。报道^(87,89–97)表明，遗传算法是估计化学工程参数和辅助系统优化的有效工具。\n\n由于基于人工智能的算法对于化学过程中系统的估计和预测非常高效，研究人员将算法结合在一起以增强模型能力并解决更复杂的问题。例如，`ANN`\
  \ 和 `SVM` 通常与 `GA`、模拟退火和粒子群优化等智能优化算法相结合，以提高宏观性能预测。^(98)此外，其他算法组合如 `ANN/SVR` 与 `FL`、`ANN/SVR`\
  \ 与 `ES` 或 `FL` 与 `ES` 也可以克服在化学过程中系统中使用单一算法进行估计和预测的缺点。\n\n### 14.4.2 基于人工智能的估计器的选择与应用\n\
  \n选择合适的算法是化学工程中开发基于人工智能的估计预测系统的关键步骤，因为它对预测准确性和泛化能力有显著影响。如前，每种算法都有自己的优势，因此没有一种算法可以适用于所有问题。表\
  \ 14.2 简要比较了不同人工智能算法在化学工程估计和预测中的优势和局限性。\n\n表 14.2 化学工程估计与预测的人工智能算法对比。\n\n| 算法 |\
  \ 优点 | 局限性 |\n| --- | --- | --- |\n| `ANN` | ** 适用于非线性系统<br>** 从历史数据中学习的能力<br>**\
  \ 不需要领域专家即可学习输入输出之间的关系<br>** 训练好的 ANN 模型运行快 | ** ANN 模型的性能在很大程度上取决于训练数据集的大小和质量。<br>**\
  \ 可能需要通过尝试来确定 `ANN` 的最优结构。 |\n| `SVR` | ** 具有卓越的泛化能力和高预测精度<br>** 对输入的噪声不敏感 | **\
  \ 大规模训练集的计算需求高。 |\n| `FL` | ** 易于设计和实现<br>** 能处理不精确和不完整的数据<br>** 提供输入输出关系的知识 | **\
  \ 受规则和隶属函数的影响<br>** 预测精度较低 |\n| `GA` | ** 提供多个可行方案从中选择最优方案<br>** 不需要问题知识<br>** 能同时处理离散和连续变量\
  \ | ** 耗时<br>** 对输入参数敏感<br>** `GA` 模型构建复杂且困难 |\n| `ES` | ** 能够根据详细的过程知识预测结果<br>**\
  \ 快速且易交换 | ** 建立知识库成本高昂且复杂<br>** 知识库的扩展取决于可用性 |\n| `组合算法` | ** 可能克服单一算法在估计和预测中的缺点<br>**\
  \ 提高预测精度<br>** 适用于复杂情况 | ** 实现需要了解不同算法<br>** 构建过程复杂且耗时 |\n\n开发化学工程中基于人工智能的估计器的简单工作流程如图\
  \ 14.6 所示；这可以为研究人员在估计和预测中使用人工智能算法提供基本指南。\n\n![image](img/bk9781788017893-0340-f6.jpg)\n\
  \n图 14.6 化学工程中应用人工智能进行估计和预测的工作流程。\n\n表 14.1 详细介绍了不同人工智能算法在化学工程估计和预测中的应用。\n\n化学工程和化学的相关属性可以使用人工智能进行预测。Ghiasi\
  \ 和 Mohammadi^(123) 使用最小二法支持机对单甲醇胺 (`MEA`)、二乙醇胺 (`DEA`) 和三乙醇胺 (`TEA`) 水溶液不同醇胺浓度和宽范围内\
  \ CO[2] 分压下的平衡吸收进行建模和预测。他们报告的决定系数为 0.98，所有研究系统的绝对相对偏差百分比 (`%AARD`) 小于 6.5%。Norouzbahari\
  \ 等人^(124) 使用 `ANN` 预测了 CO[2]、哌嗪和 H[2]O 三元溶液的 CO[2]负载。他们从可用文献中收集了所需的实验数据，报告了所有数据集较高的决定系数。Afkhamipour\
  \ 等人^(125) 使用 `ANN` 预测了经常用于 CO[2] 吸收过程的不同溶液的热容 (`CP`)。他们将胺的热容视为系统温度、溶剂浓度、CO[2]负载和溶剂分子量的函数。作者报告，对于研究的\
  \ 47 个胺溶液系统，`ANN` 模型结果与实验数据之间的 `AARD` 为 4.3%。对于常规胺，`ANN` 模型与热力学模型对比实验数据的 `AARD`\
  \ 分别为 0.59% 和 0.57%。Borhani 等人^(23) 使用 `MEA` 溶液中 CO[2] 分压的实验数据以及从 Aspen Plus 提取的\
  \ k 值数据，结合 `GA` 和 `MLR` 预测了这些属性，并将该方程应用于旋转填充床脱气塔的过程建模中。\n\n\n\n\nAI 近期的一个重要应用是化学计量学研究。定量结构-性质/活性关系（QSPR/QSAR）由\
  \ Hansch、Fujita 及其同事提出并开发，它表达了材料分子结构特征（描述符）与其性质/活性之间的联系。QSPR/QSAR 研究中的建模（回归）方法分为线性技术，如\
  \ `MLR`（多元线性回归）、偏最小二乘回归和主成分回归，以及此类非线性机器学习技术，如 `ANNs`（神经网络）、遗传编程、`SVM` 和自适应神经模糊推理系统。在\
  \ QSPR 研究中，特别是使用 `MLR` 时，已使用不同类型的经典算法（如逐步前向选择）或进化算法或元启发式算法（如 `GA`、`PSO`、`SA` 和蚁群算法）进行描述符选择，以减少描述符的数量，并在研究性质的预测中保留影响最大的描述符。使用这种方法可以估计不同类型的性质。开发的模型可以用于其他类型的建模；图\
  \ 14.7 所示了 QSAR/QSPR 方法的通用流程图。\n\n![image](img/bk9781788017893-00340-f7.jpg)\n\n\
  图 14.7 QSPR/QSAR 模型开发的流程图。\n\n## 14.5 未来趋势与展望\n\n材料开发、过程估算和故障预测是未来几年 AI 最容易取得突破的三个领域。深度和卷积神经网络是目前\
  \ `ANNs` 受青睐的形式；然而，研究人员正在更深入地探索将多种类型的 AI 结合使用或将 AI 与第一原理知识相结合的混合模型。完全可以想象，尽管目前人们对神经网络和广义\
  \ AI 充满兴趣，但 AI 可能会再次离开投资者的视野（注意之前的两次“AI 寒冬”），或者目前青睐的 `ANNs` 可能会被承诺有更大前景的新型 AI 所代。至少对于化学工程而言，AI\
  \ 还有许多未开发的潜力待探索，毫无疑问，未来还会有有趣的发展。\n\nAI 开始改变的最后一个方面是 AI 模型本身的可解释性。对于大众、利益相关者或工艺工厂经理来说，AI\
  \ 不再被接受为一个只给出答案而没有任何解释的黑箱；这会降低对模型及其结果的信任。因此，未来的 AI 模型需要能够解释其决策和思维处理步骤。目前已有多种 AI\
  \ 解释方法，包括 `LBP`、`SHAP`、`DeepLIFT` 和 `LIME`。这种可解释性不应被低估为易实现的成就，因为 AI 模型的设计（或者说其底层数学设计）并不是为了输出思维处理步骤；即使是击败围棋世界冠军的\
  \ `AlphaGo` 程序，其走法也是以前未见的且看似错误的，但最终帮助它击败了人类对手。对于机器学习在化学工程中的应用，我们必须产生可解释且理解的模型，以便控制器、建模人员或操作人员理解它是如何做出决策的，从而进行验证、检查和确认。在投资者和公司愿意资助\
  \ AI 在化学工程应用中普及之前，这一切都必须发生；而当他们这样做时，可以预期降低运行维护成本并提高过程的安全性和可靠性。\n\n## 参考文献\n\n1.\
