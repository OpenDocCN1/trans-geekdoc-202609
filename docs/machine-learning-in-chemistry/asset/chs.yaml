  \n\n\n\n长期以来，人们已经意识到化学空间可视化不可避免地需要降低分子结构比较过程中固有的维度。这通常通过 `PCA` 等算法以及最近的 `t` 分布随机邻域嵌入^(57)\
  \ 实现。为了可视化分子在化学空间中的分布（主要是靶点的分布），我们对上述描述的物理化学描述符集执行了 `PCA`^(58)（另参见表 11.1）。`PCA`\
  \ 是一种降维的统计方法，允许使用二维和三维图表可视化多维数据，且对原始数据集的信息损失降至最低。正如 Hudson *et al.*^(14) 详细提到的，众所周知，本章分析的几个分子描述符之间存在相关性，在这种情况下使用\
  \ `PCA` 是合适的。`PCA` 通过线性变换将变量矩阵旋转到一组正交轴上，这些轴定义了数据集方差最大的维度^(59)。所得轴被称为主成分或维度（`Dim`），代表原始变量（描述符）的线性组合。矩阵旋转保留了欧几里得距离，并使每个连续主成分对原始数据集总方差的贡献最大化。通过这种变换，第一主成分（`PC1`\
  \ 或 `Dim1`）保留了原始数据集最大比例的方差，第二主成分（`PC2` 或 `Dim2`）包含次大的比例，以此此类推。通过这种方式，n 维数据集（在我们的分析中\
  \ `n=10`）可以使用 m 维主成分图（其中 `m<n`）进行可视化，且信息损失极小。执行 `PCA` 是为了根据 MP 数据和目标中位数数据寻找新的且缩减的维度。\n\
  \n### 11.2.3.2 ANN 和 RF 方法\n\n数据集分别划分为 70% 和 30% 用于训练和测试，以避免模型过拟合。模型的成功通过评估受试者工作特征（`ROC`）曲线下的面积（`AUC`）来确定，这是一个用于预测模型准确性的指标^(60)。为了可重复性，所有模型均使用种子值\
  \ 44 创建。`RF` 模型基于对训练部分的 10 折交叉验证并重复 5 次。由于 `RF` 被认为是一种累积模型算法，唯一调优参数是树的数量。随后在测试数据上对指定树数量的平均模型进行评估。`ANN`\
  \ 模型是通过在训练部分上进行 10 折交叉验证并重复 5 次创建的，并并在训练部分对模型进行评估。所有可能的变量集得分在集成到模型之前都经过缩放和中心化处理。最终模型使用调优网格创建，其中包含\
  \ 0.1 到 0.5 之间步长为 0.1 的衰减（用于通过正则化避免过拟合）参数，以及 1 到 10 之间的尺寸参数（网络中的隐藏节点数）。这些步骤在每个不同的评分函数上执行：`score\
  \ C logP` 和 `score C logD`，其中 `C=3`、4 或 5。这确保了识别出最佳机器学习方法以及无论是基于原始数据还是基于 `PCAs`\
  \ 的最有效评分函数。分析使用 RStudio（一个集成统计软件软件包）完成所有分析。具体而言，使用 RStudio 中的 Husson *et al.* `FactoMineR`\
  \ 包^(61) 完成了所有的 `PCAs`。`Kuhn Caret` 包^(62) 用于所有分类，Beck *et al.* `NeuralNetTools`\
  \ 包^(63) 用于神经模型。\n\n## 11.3 结果\n\n#### 11.3.1 结果\n\n表 11.7 和表 11.8 中的 `PCA` 分别报告了靶点的特征值。综合来看，前三个成分（`Dim1`、`Dim2`\
