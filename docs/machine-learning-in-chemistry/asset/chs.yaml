  \ | 抑制离子通道 HERG50%的浓度。 | 称为 HERG 的离子通道。 |\n\n^(*) 分化学品为正例的值。\n\n为了表征数据集中分子的化学结构，我们计算了被称为非随机矩阵的全局\
  \ `TnsAqk` 和局部 `LnsAqkZ` 原子基二次指数的分子描述符（[46]）。已经证明，二次指数比结合 DRAGON 等流行程序计算的多个分子描述符家族具有更大的判别能力([47]）。二次指数可以根据以下数学形式进行计算：\n\
  \n\n\n\n\n在`eqn (16.1)`和`(16.2)`中，元素`x`代表任何原子物理化学性质，如疏水性（HYD）、电负性（E）、原子量（AW）、极极化率（POL）和极性表面积（PSA）。同时，在`eqn\
  \ (16.1)`中，元素![inline](img/bk9781788017893-00398-t3.jpg)表征分子中任意两个原子之间的邻接性，而在`eqn\
  \ (16.2)`中，![inline](img/bk9781788017893-00398-t4.jpg)具有类似的含义，不同之处在于它关注特定类型的原子（`Z`），例如氢键受体或供体、碳原子（包括脂肪族和芳香族）等。这两类基于原子的二次指数都考虑了原子`i`及其在拓扑距离`d=k`处的处的化学环境（由第`j`个邻居原子组成）。\n\
  \n为了计算上述拓扑指数，将包含所有分子 SMILES 代码的文件后缀手动从`*.txt`更改为`*.smi`。随后，使用`Standardizer v19.18.0`软件将\
  \ SMILES 代码转换为`sdf`格式^(49)。转换为`sdf`格式的唯一目的是获取每个分子的连接性表；没有使用额外的标准化操作。使用`QuBiLS-MAS\
  \ v1.0`软件通过`sdf`文件作为输入计算二次指数^(47,50)。对于此类计算，`QuBiLS-MAS v1.0`软件采用了预定义的配置[代数形式：二次；约束：基于原子的；矩阵形式：非随机；最高阶数：6；截断：保留所有；分组：总量和局部（氢键受体、脂肪族碳原子、芳香碳、末端甲基甲基、卤素和杂原子）；性质：前段已提到；聚合：曼顿距离]。\n\
  \n在`eqn (16.1)`和`(16.2)`中，当通过考虑生物效应的多种测量并针对不同靶点进行测试时，二次指数无法区分分子的化学结构。幸运的是，`ms-QSBER`模型通过应用\
  \ Box-Jenkins 算子^(17,37,51)生成新的分子描述符，这些描述符能够同时考虑化学结构和测试该分子的实验条件集（例如靶点、活性测量方法或毒性等）：\n\
  \n```\n![image](img/bk9781788017893-00398-t5.jpg)\n```\n在`eqn (16.3)`中，`n(c[j])`是在相同实验条件`c[j]`下经过测试并标记为正性的分子数量，即同时考虑相同的生物效应测量方法和相同的靶点。此外，`QI[a]`指任何二次指数（总量或局部），而`avgQI(c[j])`是所有被分配为正性并在相同测试条件`c[j]`下测试的分子的`QI[a]`值的算术平均值。在应用\
  \ Box-Jenkins 算子的相关第二步中，使用了以下表达式：\n\n```\n![image](img/bk9781788017893-00398-t6.jpg)\n\
  ```\n在`eqn (16.4)`中，`DQIa`衡量了一个分子在结构上偏离一组分配为正性的化学品的程度，所有化学品均在相同的测试条件`c[j]`下通过测试。另一方面，`QI[MX]`和`QI[MN]`分别代表定义分子描述的最大值最小值；它们不依赖于实验条件。最后，`p(c[j])`是在特定实验条件`c[j]`下发现化学品的概率：\n\
  \n```\n![image](img/bk9781788017893-00398-t7.jpg)\n```\n在`eqn (16.5)`中，元素`n(c[j])`在`eqn\
  \ (16.3)`中定义，而`N[T]`指的是训练集中化学品的总数。\n\n### 16.2.2 构建 Ms-QSBER 模型\n\n构建`ms-QSBER`模型的步骤如图`16.1`所示。由\
  \ 2139 个化学品组成的数据集被随机分为训练集和测试集。训练集用于寻找最佳模型，由 1616 个正性样本（占 75.6%）组成；测试集用于通过评估其预测能力来验证模型，由\
  \ 523 个负性样本（占 24.4%）组成。\n\n```\n![image](img/bk9781788017893-00398-f1.jpg)\n```\n\
  图 16.1 侧重于`ms-QSBER-EL`模型的开发和应用。缩写“INTP”代表从物理化学角度对每个描述符的解释。为了找到最佳的`ms-QSBER-EL`模型，测试了两种流行的\
  \ ANN 架构：径基函数（RBF）和多层感知机（MLP）。采用了`STATISTICA v13.5.0`软件中的 ANN 包来生成`ms-QSBER-EL`模型^(53)在使用该包时，首次运行是为了评估三个要素：1)\
  \ 最重要的 ANN 架构；2) 影响最大的分子描述符；3) 描述符之间的相关性。\n\n另一方面，重要的 ANN 架构是通过分析训练和测试误差（越低越好）以及不同统计指标的值（越高越好）确定的，例如灵敏度`[Sn%]`、特异性`[Sp%]`、准确率`[Ac%]`和马修斯相关系数（`MCC`）^(54)这些统计指标用于估计训练集（内部质量）和测试集（预测能力）的性能。\n\
  \n\n\n\n正如引言部分定义的，`ms-QSBER-EL` 缩写代表集成学习的多尺度定量结构生物效应关系模型。因此，作为 `ms-QSBER-EL` 模型开发的最后一步，我们没有选择单个\
  \ `ANN`，而是选择了最佳的 `ANNs` 集。这是因为在解决特定问题时，通过提供共识响应，基于不同 `ANNs` 集成的模型性能通常优于创建它们的基础的单个\
  \ `ANNs`。56\n\n## 16.3 结果与讨论\n\n### 16.3.1 Ms-QSBER-EL 模型\n\n本工作中开发的最佳 `ms-QSBER-EL`\
  \ 模型是由三个 `ANNs` 组成的集成，其配置分别为 `MLP 8-61-2`、`MLP 8-67-2` 和 `MLP 8-80-2`。第一个 `ANN`\
  \ 在隐藏层使用 `logistic` 函数，在输出层使用 `softmax` 函数构建。第二个和第三个 `ANNs` 在隐藏层具有相同的激活函数（`hyperbolic\
  \ tangent`）。对于输出层，第二个 `ANN` 采用了 `logistic` 函数，而第三个 `ANN` 采用了 `softmax` 函数。注意，所有\
  \ `ANNs` 在输入层均包含 8 个节点（分子描述符）。它们在输出层的数字二是相同的，因为它们都在预测生物效应分类变量 `BEi` 的两个可能标签（值 `-1`\
  \ 和 `1`）。在任何情况下，这三个 `ANNs` 的隐藏层神经元数量都是不同的。`ms-QSBER-EL` 模型中每个分子描述符的符号和定义见表 16.2，而所有的化学和生物数据均可在**补充信息\
  \ 16.1**中获得。† 三个 `ANNs` 对应的文件可向作者索取。\n\n表 16.2 `ms-QSBER-EL` 模型中存在的分子描述符。\n\n| 分子描述符^(a)\
  \ || 定义 |\n| --- | --- |\n| `D[TnsAq6(AW)]c[j]` | 由原子量加权的 6 阶总非随机（基于原子）二次指数的偏差。\
  \ |\n| `D[LnsAq1(POL)A]c[j]` | 由极化率加权的 1 阶局部非随机（基于原子）二次指数的偏差。该描述符侧重于作为氢键受体的原子及其化学环境。\
  \ |\n| `D[LnsAq4(AW)C]c[j]` | 由原子量加权的 4 阶局部非随机（基于原子）二次指数的偏差。该描述符侧重于作为氢键受体的原子及其化学环境。\
  \ |\n| `D[LnsAq2(E)G]c[j]` | 由电负性加权的 2 阶局部非随机（基于原子）二次指数的偏差。该描述符侧重于作为氢键受体的原子及其化学环境。\
  \ |\n| `D[LnsAq1(POL)G]c[j]` | 由极化率加权的 1 阶局部非随机（基于原子）二次指数的偏差。该描述符侧重于作为氢键受体的原子及其化学环境。\
  \ |\n| `D[LnsAq6(AW)M]c[j]` | 由原子量加权的 6 阶局部非随机（基于原子）二次指数的偏差。该描述符侧重于作为氢键受体的原子及其化学环境。\
  \ |\n| `D[LnsAq2(AW)P]c[j]` | 由原子量加权的 2 阶局部非随机（基于原子）二次指数的偏差。该描述符侧重于作为氢键受体的原子及其化学环境。\
  \ |\n| `D[LnsAq6(HYD)Y]c[j]` | 由疏水性加权的 6 阶局部非随机（基于原子）二次指数的偏差。该描述符侧重于作为氢键受体的原子及其化学环境。\
  \ |\n\n在 `ms-QSBER-EL` 模型中，`BEi` 变量通过两个标签：`-1` 和 `1` 进行预测。三个 `ANNs` 的隐藏层具有不同数量的神经元。三个\
  \ `ANNs` 对应的文件可向作者索取。\n\n\n\n\n`ms-QSBER-EL` 模型执行分类/预测的可靠性是通过根据描述符空间方法定义其适用域来估计的。通常情况下，当使用由描述符空间定义的适用域时，会使用训练集中的所有化合物，并且模型中存在的每个描述符的最大值和最小值构成了不应逾越的边界；任何超出这些边界的化合物都将被认为在适用域之外。在这里，源自描述符空间方法的适用域仅应用于训练集中被\
  \ `ms-QSBER-EL` 模型正确分类的那些化学品（`补充信息 16.3`）。利用 `ms-QSBER-EL` 模型中不同分子描述符的最大值和最小值相关的信息，为每个分子描述符分配了局部评分。当查询分子的描述符值处于上述边界之间时，局部评分等于\
  \ 1；否则，局部评分等于 0。随后，定义总分（`TSAD`）为局部评分之和。由于 `ms-QSBER-EL` 模型由八个分子描述符构建，因此只有 `TSAD=8`\
  \ 的化合物被认为在适用域之内。\n\n### 16.3.3 从分子描述符中收集物理化学和结构信息\n\n如今，使用计算模型对大型异质化学库进行预测已成为一种常见做法。结果是，用于构建模型的描述符中所包含的物理化学和结构信息往往被忽视，且没有提供任何机制解释。本工作中开发的\
  \ `ms-QSBER-EL` 模型预测的是涉及多种类型生物效应和不同目标的非常复杂的数据。因此，无法就分子与分子目标（例如蛋白质）或非分子目标（细胞、亚细胞组分和\
  \ *Plasmodium falciparum* 菌株）相互作用时发生的多种生物和/或生化过程获得机制见解。然而，尽管 `ms-QSBER-EL` 模型的分子描述符没有考虑立体化学，但解释这些描述符可以帮助找到无论在何种目标上测量的、对于不同生物效应都通用的\
  \ 2D 分子模式。\n\n这里的目的是从物理化学和结构的角度解释 `ms-QSBER-EL` 模型中存在的不同分子描述符，以便更好地理解化学品应该具备的特征，以增加其抗疟活性的同时降低其毒性并改善其药动力学特性。从这个意义上说，本节提供的解释将基于四个方面的结合：a)\
  \ `ms-QSBER-EL` 模型中每个分子描述符的影响分析，b) 不同分子描述符变化趋势的阐明，c) 分子描述符的信息内容，以及 d) 基于片段的分析。第一个方面如图\
  \ 16.2 所示，其中分子描述符根据其敏感性值（`SV`）表示。分子描述符的 `SV` 越高，其在 `ms-QSBER-EL` 模型中的影响就越大。\n\n\
  ![image](img/bk9781788017893-00398-f2.jpg)\n\n图 16.2 `ms-QSBER-EL` 模型中分子描述符的相对重要性。\n\
  \n第二个方面记录在表 16.4 中。假设通过比较每个分子描述符基于类别的平均值，可以估计分子描述符应该如何变化以引起抗疟活性的增加、毒性的降低和/或药动力学性质的增强。这种涉及基于分类平均值的方法由\
  \ Speck-Planche 及其同事应用，作为从非线性模型分子描述符中收集信息的方法。需要强调，上述方法仅应用于训练集中被正确分类的化学品。基本上，对于每个分子描述符，计算两个平均值：一个针对分配并正确分类为正性的化合物集，另一个针对注释并恰善分类为负性的化学品集。比较每个分子描述符的两个平均值允许我们确定描述符值应该增加还是减少。必须始终记住，我们在这里处理的是非线性模型，因此从分子描述符中阐明的这些变化趋势是相对的。因此，这里使用的方法可能不包含\
  \ `ms-QSBER-EL` 模型可能覆盖的整个化学空间。尽管如此，该方法旨在关注化学空间的一个定义区域，在该区域可以找到具有所需属性的化合物，在这种情况下，即潜在活性且安全的抗疟药物。\n\
  \n表 16.4 基于分类平均值法的 `ms-QSBER-EL` 模型中分子描述符的变化趋势。\n\n| 符号 | 平均值 | 趋势 |\n| --- | ---\
  \ | --- | --- |\n| 正性 | 负性 | |\n| `D[TnsAq6(AW)]c[j]` | -0.005 | 0.116 | 减少 |\n\
  | `D[LnsAq1(POL)A]c[j]` | -0.011 | 0.162 | 减少 |\n| `D[LnsAq4(AW)C]c[j]` | 0.004\
  \ | 0.009 | 减少 |\n| `D[LnsAq2(E)G]c[j]` | 0.010 | -0.043 | 增加 |\n| `D[LnsAq1(POL)G]c[j]`\
  \ | -0.002 | -0.022 | 增加 |\n| `D[LnsAq6(AW)M]c[j]` | -0.006 | 0.061 | 减少 |\n| `D[LnsAq2(AW)P]c[j]`\
  \ | -0.038 | 0.343 | 减少 |\n| `D[LnsAq6(HYD)Y]c[j]` | -0.003 | 0.062 | 减少 |\n\n(*a*)\
  \ 趋势——它指示描述符值的变化（增加或减少），这种变化可以同时导致抗疟活性的增加、毒性的降低和药动力学性质的改善。\n\n关于第三方面，如前，`ms-QSBER-EL`\
  \ 模型是由总和局部非随机（基于原子）二次索引的偏差构建的，分别符号化为 `DTnsAq[k]c[j]` 和 `DLnsAq[kZ]c[j]`。其中 `x` 是上述任何物理化学原子属性，`c[j]`\
  \ 表示不同的实验条件，拓扑距离（`d=k`，其中 `k` 是二次索引的阶数）。拓扑距离是任意两个原子之间键的数目（不计算键的多级）。使用这个简单实用的概念有助于我们快速准确地了解不同类型的原子（例如脂肪族碳和芳香碳、卤素、等）应该如何分布在整个分子结构中。\n\
  \n\n\n\n\n最后一个方面聚焦于：为分子计算的任何拓扑（基于图的）描述符都可以表示为各种片段（连接和不连接的）在该分子中出现频率的线性组合^(59)。因此，拓扑描述符的这种性质允许我们直接定义不同的分子片段，这些片段的存在对任何拓扑指数值的变化具有正贡献；这些片段随后可以用于设计新分子^(60–62)。\n\
  \n本研究使用的二次索引是一类拓扑描述符，因此它们符合上述性质。因此，在解释时，我们将提供一份不详尽但实用的片段列表，这些片段被认为对 `ms-QSBER-EL`\
  \ 模型中每个分子描述符的相关变化有正向贡献（参见图 16.3）。在此插图中，我们重点关注小型分子片段，因此仅表示了基于拓扑距离 `d`≤4 的描述符。对于关注于\
  \ `d`≥4 的描述符，将不提供基于片段的信息，尽管会对它们的所有物理化学和结构性解释进行说明。\n\n![image](img/bk9781788017893-00398-f3.jpg)\n\
  \n图 16.3 `ms-QSBER-EL` 模型中对不同分子描述符具有良好贡献的分子片段。此处符号指：A=F, –OH, 或 –NH[2]; X=O 或 –NH–；\
  \ Z=–OH 或 –NH[2]；Y=O 或 –NH–； G=F, Cl, 或 Br；G[2]=Cl, Br, 或 I。\n\n`ms-QSBER-EL` 模型中的八个描述符中有四个基于原子重量，这已经表明，同时增加抗疟活性、降低细胞毒性和改善药代动力学特征的最重要因素是与位阻相关的因素。注意，分子量作为一种属性，与分子的大小相关。这些基于原子重量的描述符将取决于分子中原子的数量；它们将直接影响分子量，从而影响分子的大小。\n\
  \n我们有 `D[TnsAq6(AW)]c[j]`，它表征了处于拓扑距离等于六的任意两个原子之间原子重量的减少。这是模型中第五大重要的描述符，它表示分子中原子数量的减少，同时重原子（氟以外的卤素）的数量应尽可能减少。\n\
  \n与 `D[TnsAq6(AW)]c[j]` 一致，描述符 `D[LnsAq4(AW)C]c[j]`（第四重要的）也表示了处于拓扑距离等于四的任意两个原子之间原子重量的减少，其中一个是碳原子。这意味着脂肪族碳的数量应该减少，如果存在，则可以增加它们的取值。\n\
  \n如 `D[LnsAq4(AW)C]c[j]` 所描述，在某些区域存在卤素有利于原子重量的减少（参见图 16.3）。第三个描述符是 `D[LnsAq6(AW)M]c[j]`，它表征了处于拓扑距离等于六的任意两个原子之间原子重量的减少，其中一个是碳。该描述符在\
  \ `ms-QSBER-EL` 模型中的影响最低。\n\n最后，通过分析 `D[LnsAq2(AW)P]c[j]`，我们建议任意两个原子（至少一个是碳）的重量应该减少。注意\
  \ `D[LnsAq2(AW)P]c[j]` 是第二重要的描述符，芳香环的存在是有益的。\n\n`ms-QSBER-EL` 模型中的八个描述符中有四个基于原子重量。`D[LnsAq1(POL)A]c[j]`\
  \ 是影响第七大的，通过考虑氮和氧的存在提供了关于分子极化率的信息。另一个证实位阻效应重要性的描述符是 `D[LnsAq1(POL)G]c[j]`，它通过仅考虑卤素来增加分子的极化率（参见图\
  \ 16.2）。\n\n\n\n\n\n可以推导出，某些原子取决于其化学环境会产生负的疏水性贡献，而另一些原子在 във疏水性标度中具有正值。具有负贡献的原子示例包括大多数脂肪族（饱和）碳，但\
  \ `CHX3`、`CR2X2`、`CRX3` 和 `CX4` 型除外，其中 `X` 为任何电负性原子（`O`、`N`、`S`、`P`、`Se`卤素）。其他具有负疏水性贡献的原子几乎所有的氮原子，除了吡咯、具有至少两个芳香取代基的胺以及三级胺。类似的规则也适用于上述胺的含氧对应物。此处未提到的其他原子将对疏水性产生正贡献。对于芳香碳的特殊情况，虽然\
  \ Ghose 及其同事在此报告了不同的疏水性值（ [63)），但软件 `QuBiLS-MAS v1.0` 的程序人员将此类类型原子的疏水性贡献设为零。话虽如此，几对原子示例（拓扑距离等于六）的共同疏水性贡献降低了\
  \ `D[LnsAq6(*HYD*)Y]c[j]` 的值，例如 G 与任何氮或氧（排除上述例外情况），其中 `G` 代表卤素、硫、硒或磷。\n\n总而言之，分子描述符提供的信息表明，分子结构中卤素的存在是必须的，但它们必须局限于外围区域。此外，根据八个描述符中四个的表征的原子量减少情况，卤素的存在量可能如下：1)\
  \ 一个碘，2) 两个氯，3) 两个溴，4) 一个氯和一个溴，5) 一个氟和一个溴，或 6) 一个氟、一个氯和一个溴。卤有卤素取代的杂芳香环的存在至关重要，因为它们减少了芳香碳的数量（降低了\
  \ `D[LnsAq2(*AW*)P]c[j]` 的值），同时，它们增加了描述符 `D[LnsAq1(*POL*)G]c[j]` 和/或 `D[LnsAq2(*E*)G]c[j]`\
  \ 的值。此类片段的示例包括 2-卤吡啶、2-卤嘧啶和 2-卤唑类。另一方面，分子不应含有甲基基，脂肪族碳可以作为连接杂芳香部分之间的连接剂。\n\n### 16.3.4\
  \ 虚拟强效且安全抗疟药物的计算设计\n\n在对外部化学库预测时，计算模型可以在一定程度上进行可靠的预测。这是因为实验数据通常包含关于测定进行条件的不确定性。其他阻止充分利用计算模型作为虚拟筛选工具的因素还包括对适用性范围（applicability\
  \ domain）定义的缺乏共识，以及分子描述符的非通用性；后者意味着分子描述符只能表征高度多样且复杂的化学空间中的一小部分。\n\n同样重要的是记住，大多数模型将根据预定义值提供预测，这些值对应于被预测分子的描述符。在这种背景下，这些分子大部分可能不符合模型的规则。这与适用性范围或其他任何估计预测可靠性的方法无关，而是与事实有关：在任何模型中，训练集中的分子描述符具有不同程度的层次结构，这些层次结构在现象学上具有意义，即描述了为了提高研究的生物效应而需要主要修改的物理化学和结构特征。因此，分子描述符遵循模型中这种层次/重要性程度的化合物预计预测准确性更高，其理论预测应与实验结果更好地拟合。尽管考虑分子描述符的层次程度是大多数致力于筛选海量数据集的模型所忽略的一个方面，但近期聚焦于基于片段的拓扑设计的方法强调了其对化学空间优化的至关重要作用（(61,64)–67)）。由于预测计算模型的分子描述符无法“控制”待预测的化学空间，因此有人提出，为了获得更高的预测确定性，必须根据模型中分子描述符的物理化学和结构解释来设计化学品（(61,64)–67)）。\n\
  \n为了证明此类建议的真实性，并估计 `ms-QSBER-EL` 模型对分子化学结构微小变化的敏感性，我们进行了以下实验。我们根据以下步骤设计了属于不同化学家族的十种不同分子（见\
  \ 图 16.4）。首先，对于每个设计的分子，使用上述某些片段作为构建单元。其次，通过连接片段组装设计的分子。第三，需要时进行了一系列生物等替代，或添加某些原子或官能团。最后，通过严谨考虑\
  \ `ms-QSBER-EL` 模型中分子描述符的联合解释（从 `AMA-001` 到 `AMA-004`、`AMA-008` 和 `AMA-010`）设计了一系列分子，而其他则根据某些描述符（`AMA-005`\
  \ 到 `AMA-007`）设计。\n\n```\n![image](img/bk9781788017893-00398-f4.jpg)\n```\n图 16.4\
