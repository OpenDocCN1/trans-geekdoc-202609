  \ |\n| `H(R[Low]|RB[10])` | ![inline](img/bk9781788017893-00037-t42.jpg) | `H(R[Med]|RB[10])`\
  \ | ![inline](img/bk9781788017893-00037-t43.jpg) | `H(R[High]|RB[10])` | ![inline](img/bk9781788017893-00037-t44.jpg)\
