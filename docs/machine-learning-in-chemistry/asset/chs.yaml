  # 第 16 章：作为新知识生成器的神经网络解析：抗疟药物发现的案例研究\n\nALEJandro SPECK\na 智利资助计划, 智利理工大学, Ignacio\
  \ Valieso 2409, 智利\nb 食品生产基础与应用研究实验室, 莫斯科国立食品大学, Volokolamskoe shosse, 125080, 俄罗斯联邦\n\
  邮箱: \n\n## 16.1 引言\n\n随着机器学习（ML）方法和计算模型的出现，药物发现领域经历了不断的变革。如今，机器学习在数据挖掘和虚拟筛选等领域的重要性性已得到公认。其中，神经网络（ANNs）已成为关注焦点，特别是由于深度学习等革命性子领域的兴起。事实上，在早期药物发现中，神经网络在分子设计方面已取得了令人深刻的应用。\n\
  \n然而，目前神经网络的效率和成功与极高的成本密切相关，而且人员需要具备高级的编程编码技能，后者需要大量时间来掌握。除了这些限制外，还有两个障碍阻碍了神经网络在药物发现中的充分利用。一方面，基于神经网络的模型继续被视为黑箱，因为它们缺乏解释性；它们无法对其旨在设计或预测的化学品的物理化学性质或结构特征提供解释。另一方面，专注于神经网络的模型只考虑药物发现过程中的特定阶段（通常是药物活性领域）。考虑到药物发现的多尺度性质以及需要筛选的海量化学空间（10⁶⁰\
  \ 个中小型有机化合物），最大的挑战之一是开发出能够整合多种生物数据并设计出具有强效活性、低毒性和良好药代动力学特性的神经网络模型。\n\n在过去的七年里，多个研究小组致力于创建一系列名为多尺度结构-活性关系（ms-QSBER）的计算工具。这些模型整合不同的数据源，允许针对不同复杂度的目标同时预测多个生物终点。在这种情况下，ms-QSBER\
  \ 模型已成功应用于癌症研究、感染病、纳米医学和纳米毒理学、免疫学和免疫毒性以及神经科学等不同领域。此外，多尺度分子设计已成为一种前景良好的范式，它结合了 ms-QSBER\
  \ 的预测能力、化学推理以及基于片段的药物发现的概念，加速了分子的理性设计。\n\n\n\n\n\n考虑到之前所有的观点，本章旨在证明基于神经网络（ANNs）的计算模型可以以一种对化学友好的方式，加速临床前阶段虚拟新型、强效且安全药物的设计。因此，我们报告了首个基于神经网络集合的\
  \ `ms-QSBER` 模型（`ms-QSBER-EL`），该模型致力于对潜在活性且安全的抗微生物剂进行虚拟设计和预测。出于多种原因，这里以抗疟药物发现作为案例研究。首先，疟疾是人类已知最古老的疾病之一，死亡率和发病率很高；2016\
  \ 年全球范围内发生了 44.5 万例疟疾死亡和 2.16 亿例病例([38]）。其次，抗疟治疗的疗效已经降低，因为被广泛认为是疟疾主要病因的*间疟虫*（*Plasmodium\
  \ falciparum*）对抗疟药物产生了药性([39]）。最后，对使用抗疟药物相关的副作用存在严重担忧([40]）。\n\n## 16.2 材料与方法\n\n\
  ### 16.2.1 数据集与分子描述符\n\n`ms-QSBER` 模型的开发已有广泛报道（[13]–[17],[37],[41]），因此，本文仅解释本工作中特定的程序。用于构建\
  \ `ms-QSBER-EL` 模型的所有化学和生物数据均从 `ChEBML` 数据库（[42]–[44]）以 Microsoft Excel 兼容文件的格式提取。本研究使用的数据集包含\
  \ 18,798 种属于许多不同化学家族的药物/化学品。每个分子都通过考虑 7 种生物效应衡量标准（活性、细胞毒性和药代动力学性质）中的一种，并针对至少 20\
  \ 种目标中的一种（包括蛋白质、*间疟虫*菌株、哺乳细胞和肝微粒体）进行了实验测定。如果发现某个分子针对同一目标进行了多次测试且考虑了相同的生物效应衡量标准，则对其值取平均值。在任何情况下，请注意本数据集中报告的大多数药物/化学品仅通过一种生物效应标准且仅针对一个目标进行了实验测试。因此，此处使用的数据集最终包含\
  \ 21369 个统计案例，其特征是数据离散性大。尽管如此，前节提到的 `ms-QSBER` 模型之所以取得巨大成功，是基于它们处理高度离散和异质数据的能力（([13]–[17],[37],[41],[45]）。\n\
  \n数据集中的每个统计案例被标记为正例 `BE[*i*=1]` 或负例 `BE[*i*=−1]`，其中 `BE*i*` 是一个二分类变量，描述了在实验条件 `c[*j*]`\
  \ 下第*i*个案例/化学品的生物效应。应当指出，定义的实验条件 `c[*j]` 取决于给定实验报告的第*q*种生物效应衡量（`me`）以及进行实验的第*r*个目标（`tg`）。因此，每个实验条件可以表示为\
  \ `c*j*`。本工作使用的数据集包含 23 个独特的实验条件（`me`和`tg`元素的元素的组合）。\n\n正例和负例的分配是通过考虑[表 16.1]所示的不同截断值实现的；几个理由证明了选择这些严格截断值的合理性。首先，对从\
  \ ChEMBL 提取的数据集进行检查显示，报告的 FDA 批准药物的生物效应值要么高于也低于低于截断值。这一方面突显了所选截断值的重要性，因为如果查询分子被源自本数据集的模型预测为正例（或负例），则可以将其潜在生物效应与已报道的临床相关药物的效应进行比较。其次，将化合物分配为正例或负例意味着采用了分类方法而非回归方法。与回归方法相比，分类方法不需要预测数据集中不同属性的精确值，因此它们不需要处理数据中潜在的巨大确定性。第三，本研究选择的截断值防止了分配为正例的分子数量与标记为负例的分子数量之间的不平衡。最后，从现象角度来看，尽管数据集中存在临床相关的抗疟药物，但\
  \ `ms-QSBER-EL` 模型的目的是同时对具有高抗疟活性、低细胞毒性和适当药代动力学性质的新化学品进行预测和设计。设计化学结构与现有抗疟药物不同的新分子，表明了寻找抗疟活性新作用机制的想法，并降低毒性以及改进目前大多数抗疟药物中未发现的药代动力学特征。\n\
  \n表 16.1 本研究使用的不同截断值。\n\n| 生物效应衡量标准 (*me*) | 截断值 | 概念 | 目标 (*tg*) |\n| :--- | :---\
  \ | :--- | :--- |\n| IC[50] (nM) | ≤370.00 | 抑制 50%生长所需的浓度。 | *间疟虫*菌株。 |\n| 渗透性\
