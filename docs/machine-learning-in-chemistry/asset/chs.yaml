  \n\n\n\n\n选择了八个参数作为决策树的描述符：(1) 离子的化价，(2) 周期表中的族和(3) 周期，(4) 阴离子和(5) 离子的配位数，以及阳离子在价态和半内层态下的\
  \ (6) s、(7) p 和 (8) d 电子数。图 17.5 展示了基于监督学习构建的决策树；该决策树根据 14 种氧化物最初是否具有 d 电子将其分为两个子集，其中“是否为第\
  \ 1 类元素”划分了一个子集，而“是否为第 4 类元素”划分了另一个。在图 17.4 和 17.5 中所示的两个构建树被用于解释。\n\n![image](img/bk9781788017893-00424-f5.jpg)\n\
  \n图 17.5 基于图 17.4 中训练标签的决策树。改编自文献 83，[`doi.org/10.1038/s41598-018-30994-6`](http://https://doi.org/10.1038/s41598-018-30994-6)，根据\
  \ CC BY 4.0 许可协议[`creativecommons.org/licenses/by/4.0/`](http://creativecommons.org/licenses/by/4.0/)。\n\
  \n为了解释谱图，我们如上所述沿着决策树向上移动。这提供了关于每个簇的信息；例如，簇 3 是“含有第 1 类元素”且“不含 d 电子”，这些之前是从聚类图中考虑的。\n\
  \n在演示中，我们使用了 14 种氧化物的元素信息。然而，谱特征与某些几何信息（如键长和配位数）之间的关系对于 ELNES/XANES 谱图的解释通常很重要。\n\
  \n为了对 ELNES 谱图进行实际解释和预测，我们将该方法应用于 SiO[2] 的 O-K Edge 谱，如下一节所述。\n\n### 17.3.3 多晶型\
  \ SiO[2] O-K 边的解释与预测\n\n接下来，我们考虑了 13 种 SiO[2] 多晶型，其空间群列在表 17.2 中。某些多晶型有多个氧位点，即 2-1,\
  \ 2；3-1–4；5-1, 2；6-1, 2；7-1–3；8-1–5。因此，所有位点都分别进行了计算。因此，共获得了 25 条 O-K Edge 谱，如图 17.3\
  \ 所示。由于成分固定为 SiO[2]，但原子构型是不同的，可以使用 Si–O 键长和 Si–O–Si 角等几何信息来解释谱特征。排除随机选择的数据，对于多晶型\
  \ 3-4（图 17.3 的中间面板），24 条谱用于分层聚类并创建决策树。\n\n这些 O-K Edge 谱的谱特征所示图 17.3，它们清楚地显示了取决于局部结构的各种谱图分布。这\
  \ 24 条谱的聚类图在图 17.6 中。\n\n![image](img/bk9781788017893-00424-f6.jpg)\n\n图 17.6 基于\
  \ 24 种 SiO[2] 多晶型 O-K Edge 谱相似性的聚类图。右轴表示余弦距离。顶部的（紫色）和底部的（蓝色）箭头在文中解释。改编自文献 83，[`doi.org/10.1038/s41598-018-30994-6`](http://https://doi.org/10.1038/s41598-018-30994-6)，根据\
  \ CC BY 4.0 许可协议[`creativecommons.org/licenses/by/4.0/`](http://creativecommons.org/licenses/by/4.0/)。图\
  \ 17.6 中的阈值水平不是任意设置的，而是以数据驱动的方式设置的，并产生了七个簇。簇 4（紫色组，即多晶型 4）在较高水平（如上方的紫色箭头所示）与其他谱分离，表明其谱与其他多晶型高度不同。事实上，多晶型\
  \ 4 的谱特征与其他有显著不同（见图 17.3）。这一结果由多晶型 4 的晶体结构比其他多晶型具有更高对称性这一事实支持。7-2、7-3、8-4、9、10、11、12\
  \ 和 13 形成了簇 5（蓝色），因为它们的谱特征非常相似（见图 17.3 中的蓝色箭头所示）。该组的谱通常在谱阈值处包含一个大峰，随后是若干小峰，如图 17.3\
  \ 所示（蓝色标记的谱）。它们的特征在视觉上与簇 6（黄色）和簇 7（绿色）的谱非常相似。然而，我们的方法表明这三组存在一些难以察觉的差异。详细对比揭示了细微的区别，蓝色组的主峰比其他两组略尖锐。簇\
  \ 5 更尖锐的谱归因于所含材料具有更高的对称结构。实际上，簇 5 中的大多数材料只有一个氧位点，而簇 6 和 7 中的材料在晶胞中有多个氧位点。此外，簇 7（绿色簇）的谱与簇\
  \ 5 的谱一样具有尖锐的第一峰，但第一峰的位置与簇 5 略不同（稍向低能量侧）。这些微小的谱差异肉眼可能无法察觉；但所提出的聚类方法具有识别此类细微差异的潜力。\n\
  \n接下来，我们基于这些多晶型的结构信息构建了决策树。为此，我们选择了 32 个几何特征作为描述符。这 32 个描述符列在表 17.3 中。\n\n表 17.3\
  \ SiO[2] 多晶型的描述符列表。O* 表示氧具有内空穴。\n\n| SiO[2] 多晶型的 32 个描述符 |\n| :--- |\n| 键的数 (1.0–1.5,\
  \ 2.0–2.5, 2.5–3.0, 3.0–3.5, 3.5–4.0, 4.0–4.5, 4.5–5.0, 5.5–6.0 Å) |\n| 较短 Si–O*\
  \ 键长 |\n| 平均 Si–O* 键长 |\n| Si–O*–Si 角 |\n| 较长 Si–O 键长 |\n| 较短 Si–O 键长 |\n| 平均 Si–O\
  \ 键长 |\n| 大/小四面体的体积 |\n| 大/小四面体中的 O–O–O 角 |\n| 大/小四面体中的 O–Si–O 角 |\n\n如前所述，决策树是通过监督学习构建的。图\
  \ 17.7 展示了基于图 17.6 中虚线所示阈值水平构建的决策树。为了确定阈值，我们评估了训练数据的准确率。高于当前线的决策树在训练数据集上的预测准确率为\
  \ 100%。\n\n![image](img/bk9781788017893-00424-f7.jpg)\n\n图 17.7 基于图 17.6 中训练标签的决策树。分支点的每个灰色矩形代表一个划分规则。实线和虚线分别表示“真”和“假”。改编自文献\
