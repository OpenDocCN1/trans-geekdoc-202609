  \ 2672–2680.\n\n## 第 19 章\n# 用于均相催化的机器学习：从构建到应用的全局神经网络势能\n\n马宏，康裴林，尚诚，刘智潘\n\n中国上海复旦大学，上海能源材料化学协同创新中心，上海分子催化与创新材料重点实验室，复旦大学计算物理科学关键实验室，化学系，上海\
  \ 200433，中国\n\n*邮箱：`zpliu@fudan.edu.cn`*\n\n## 19.1 引言\n\n\n\n\n异相催化剂以其材料组成和表面结构的复杂性而闻名。在实验和理论方面，为了解决决定活性和选择性的催化剂活性位点问题一直有着悠久的历史。最近的实验进展体现在高空间分辨率技术（例如球差校正高分辨率透射电子显微镜）以及基于同步辐射的测量（例如扩展\
  \ X 射线吸收精细结构）。作为将原子结构与能量联系起来的直接工具，理论模拟已广泛应用于催化剂结构的建模甚至活性预测，特别是密度泛函理论（`DFT`）计算的出现。然而，`DFT`\
  \ 模拟通常限于数百个原子，因此无法穷尽地探索复杂催化剂（如无形结构或多组分氧化物/合金）的相空间。\n\n从理论上识别催化剂的活性位点，探索暴露面的复杂势能面（PES）至关重要。这不仅需要一种快速可靠的方法来评估结构的能量，还需要一种高效的方法来探索结构相空间。在\
  \ PES 计算方法方面，大多数基于以 `DFT` 计算代表的量子力学，而经验力场计算以及最近的人工神经网络（`NN`）势能方法（见[图 19.1]），尽管在迁移性方面存在局限性，但也经常用于材料应用。\n\
  \n![image](img/bk9781788017893-00488-f1.jpg)\n\n图 19.1 `NN` 势与 `SSW` 全局优化的结合。总能量（所有原子能量之和）可以通过\
  \ `NN` 势获得。原子能量涉及幂型结构描述符（`PTSD`）计算和 `NN` 评估。`SSW` 全局优化被用于探索 PES 并产生新结构。转载自文献 [27]。\n\
  \n由于催化转化涉及化学键的形成和断裂，`DFT` 计算是提供合理成本的反应准确描述的最流行方法。`DFT` 的计算速度敏感于所用密度泛函（例如 `PBE`、`HSE06`）的复杂性，且可扩展性较差（至少为\
  \ `O(NlnN)`）。它在大系统（例如 >100 个原子）中探索反应网络具有很大困难。作为一种有前景的替代方案，过去十年开发的 `NN` 势方法展示了其在处理从气相反应到材料动力学的复杂\
  \ PES 问题方面的威力。最近，它也被用于解决异相催化剂的结构，例如 `Pd(O)`、`Pt(H)`、`CuAu`、`CuCeO` 和 `CuZnO`。与传统的力场势不同，只要训练数据集包含反应数据（如过渡态\
  \ `TS`），`NN` 势就能高精度地描述化学反应。\n\n与 PES 评估方法的进展并行，几十年来开发了许多 PES 探索方法。由于催化反应和结构重建发生在涉及高势垒过程的高温下，传统的分子动力学（`MD`）模拟通常不适用于活性位识别。相反，能够克服\
  \ PES 高势垒的全局优化方法更为理想。常见的全局优化方法包括模拟退火、遗传算法、盆跳和随机表面行走（`SSW`）等。\n\n本概述了催化剂 PES 探索和活性位点识别的最新进展。我们将证明，全局\
  \ `NN` 势与全局优化 `SSW` 方法的结合提供了一个解决催化剂结构的强大平台，最终可以从第一性原理预测催化剂活性。\n\n## 19.2 方法\n\n\
  与利用物理模型描述原子间相互作用的经典力场势不同，`NN` 势是通过大量参数拟合的数值函数。因此，`NN` 势在训练数据集之外的预测能力有限。因此，提高 `NN`\
  \ 势质量的关键很大程度上取决于数据集的 PES 表示能力。为了克服 `NN` 势的这一局限性，我们在 2017 年提出了一种全局到全局的方案，用于为材料模拟生成可靠稳健的全局神经网络（`G-NN`）势。该方案结合了\
  \ `SSW` 全局采样方法、用于 PES 的高维神经网络（`HDNN`）以及扩展数据集并升级 `G-NN` 势的自学习程序。下面我们将介绍该方案的每个部分。\n\
  \n### 19.2.1 高维神经网络架构\n\n人工神经网络最初是为了理解大脑处理而开发的。在随后的几十年里，神经网络演变为一类强大的算法，应用于从数值预测、模式识别到数据分类的各个领域。它通过非线性“黑箱”数据处理建立自变量与目标值之间函数关系的强大能力而闻名。\n\
  \n作为函数拟合的重要工具，标准前馈神经网络（`FFNN`）已自然地用于构建小型分子系统的 PES，例如气相动力学。传统 `FFNN` 势的一个主要缺点是难以扩展到不同尺寸（原子数量可）的系统。Behler\
  \ 和 Parrinello 在 2007 年取得了突破，实现了用于材料模拟的 `HDNN` 架构。该方法适用于数千个原子的高维系统。在该中，系统的总能量 `E[tot]`\
  \ 写为所有原子的求和（见方程 (19.1)），见图 19.2。\n\n![image](img/bk9781788017893-00488-f2.jpg)\n\
  \n图 19.2 高维神经网络架构中的原子中心结构描述方案。每个元素有一个不同的神经网络，每个原子通过其中心的元素和结构描述符来区分。\n\n\n\n\n每个原子都由一个原子神经网络（FFNN）表示，其中输入层是一系列结构描述符，用于表示原子键合环境，输出层产生原子能量\
  \ `E`[`i`]`（`i` 为原子的索引）。这种高维神经网络（HDNN）方案适用于任意数量原子的系统，因为总能量是所有原子能量的线性求和。\n\n![image](img/bk9781788017893-00488-t1.jpg)(19.1)\n\
  \n用于区分原子化学环境的输入节点对于神经网络势能的性能至关重要。它们利用来自邻近原子的径向和角度信息来表示原子之间的多维相互作用。良好的结构描述符必须是单值函数，以便不同的原子环境产生不同的值，并且它们必须是连续可微的，以便计算能量的解析导数^(34–36)\
  \ 关于结构描述符的更多细节将在下一节中讨论。\n\n对于一组结构描述符，原子力和静态应力张量矩阵元素 `σ`[`αβ]`可以根据方程 (19.2)进行解析法推导，其中作用于原子\
  \ `k` 的力分量 `F`[`k,α]`（`α`=`x`, `y` 或 `z`）是总能量相对于其坐标 `R`[`k,α]`的导数。通过与方程 (19.2)结合，力分量可以进一步与原子\
  \ `i` 的能量相对于第 `j` 个结构描述符的导数 `G`[`j,i]`相关起来。\n\n![image](img/bk9781788017893-00488-t2.jpg)(19.2)\n\
  \n同样，静态应力张量矩阵元素 `σ`[`αβ]`可以根据方程 (19.3)使用成对距离进行解析法推导。\n\n![image](img/bk9781788017893-00488-t3.jpg)(19.3)\n\
  \n其中 `r`[`d]`和`r`[`d]`分别是原子 `i` 和 `j` 之间的笛卡尔距离向量及其模，`V` 是结构的体积。\n\n#### 19.2.2 结构描述符\n\
  \n由于神经网络势将结构的几何形状与其能量学相关联，人们会好奇什么样的结构描述符能够实现最佳性能来描述多维势能面（PES）。Behler 和 Parrinello\
  \ 建议了一系列旋转不变对称函数作为结构描述符，这些函数是内在坐标（原子对距离、角度）乘以截断径向函数的数学函数^(31)遵循经验力场的相同术语，这些函数可以分为二体项、三体项等。由于这些函数的径向部分是高斯函数，我们将它们标记为高斯型描述符（GTSD）。最常用的二体\
  \ `G`²和三体 `G`⁴函数在方程 (19.4)–(19.6)]中进行了描述。\n\n![image](img/bk9781788017893-00488-t4.jpg)(19.4)\n\
  \n![image](img/bk9781788017893-00488-t5.jpg)(19.5)\n\n![image](img/bk9781788017893-00488-t6.jpg)(19.6)\n\
  \n其中 `r`[`ij]`是原子 `i` 和 `j` 之间的核间距，`θ`[`ijk]`是以原子 `i` 为中心、`j` 和 `k` 为邻居的角度（`i`,\
  \ `j`, `k` 是原子索引）。GTSD 中的关键要素是在 `r`[`c]` 之外衰减为零的截断函数 `f`[`c]`（参见方程 (19.4)）、高斯型径向函数和三角角函数。通过改变五个参数\
  \ `r`[`c]`、`r`[`s]`、`ζ` 和 `λ`，可以生成一组 `G`²和`G`⁴函数；这些用于区分中心原子 `i` 的原子环境。\n\n为了提高结构描述符在学习\
  \ PES 方面的敏感性，我们设计了一系列新的结构描述符——幂型结构描述符（PTSD），参见方程 (19.7)]–(19.12]\n\n![image](img/bk9781788017893-00488-t7.jpg)(19.7)\n\
  \n![image](img/bk9781788017893-00488-t8.jpg)(19.8)\n\n![image](img/bk9781788017893-00488-t9.jpg)(19.9)\n\
  \n![image](img/bk9781788017893-00488-t10.jpg)(19.10)\n\n![image](img/bk9781788017893-00488-t11.jpg)(19.11)\n\
  \n![image](img/bk9781788017893-00488-t12.jpg)(19.12)\n\n在 PTSD 中，`S¹`和`S²` 是二体函数，`S³`、`S⁴`\
  \ 是三体函数，`S⁶` 是四体函数。用幂函数代替 GTSD 中的高斯函数有几个优势：(i) 降低了计算成本；(ii) 可调参数从两个 (`r`[`s]`）减少到一个\
  \ (`n`），简化了二体函数的搜索；(iii) 幂函数与衰减截断函数结合可以产生具有灵活峰值形状的径向分布，这与高斯函数的作用类似；(iv) 在三体函数中引入不同的幂次\
  \ (`m`, `p`) 可以方便。\n\n#### 19.2.3 神经网络训练\n\n一旦确定了网络结构，下一步是确定每个子网络中的权重和偏置（神经网络参数），这一过程被称为神经网络训练。对于具有两个隐藏层且每层\
  \ 40 个节点的标准 FFNN，权重和偏置的数量通常为 10⁴~1⁶⁶为了训练如此大量的参数，定义了一个性能函数 `J`[`tot]`（参见方程 (19.13)）^(28,37)，该函数衡量了神经网络输出相对于训练集的偏差。其中\
  \ `ρ=`1~100，`τ=`0.1~1。这种这种函数允许同时拟合三个属性。训练过程将最小化 `J`[`tot]`，直到神经网络预测属性的精度达到预设标准^(36,38,39)。训练集是通常从第一性原理计算的具有精确能量和力的大型结构数据集。\n\
  \n许多基于梯度的优化算法被用于优化网络权重和偏置，例如随机梯度下降、共轭梯度、Levenberg–Marquardt (LM) 等。人们公认，拟牛顿法等二阶方法（如有限内存布罗伊登-福莱特-戈尔德-舍农算法\
  \ L-BFGS 和 LM）对于大型数据集能够更快地收敛到真实最小值。应该提到，与使用量子力学生成数据集所需的大量计算相比，神经网络的训练实际上并不是整个神经网络\
  \ PES 构建过程中的限速步骤。\n\n\n\n无疑，用于训练神经网络（NN）的数据集在很大程度上决定了神经网络的质量。之前的工作要么利用局部势能面（PES）数据（例如单个反应的\
  \ MD 轨迹），要么结合不同来源的局部 PES 数据（例如板层和簇）。为了提高神经网络势能的可迁移性并简化数据集的生成，通过全局优化产生的结构似乎是更好、更自然的选择，这些结构能够尽可能多样地代表原子的化学环境。\n\
  \n目前有多种用于结构预测的全局优化方法包括：\n- 模拟退火 (simulated annealing)\n- 遗传算法 (genetic algorithm)\n\
  - 盆地跳 (basin hopping)\n- `SSW`，它能够搜索 PES 上的宽区域并无偏地识别全局最小值，即使是从随机结构开始也是如此。其中，盆地跳和遗传算法通过忽略极值之间的过渡区域来转换\
  \ PES，因此可能会错过重要的结构模式。另一方面，模拟退火和最小跳跃基于高温下大量的 MD 计算，这两种方法很少结合量子力学（即使是 DFT）进行全局搜索。此外，密切相关的\
  \ MD 轨迹中的结构模式对于 NN 训练来说可能是过度冗余的，因此可能需要一种迭代结构方案。在我们的方法中，我们使用 `SSW` 全局优化方法构建数据集。下面我们将详细介绍该方法。\n\
  \n`SSW` 方法的核心思想结合了偏置势驱动动力学和梅特波洛蒙特卡洛（`MC`）。它操控结构配置从 PES 上一个最小值移动到另一个，并根据给定温度下的 `MC`\
  \ 决定是否接受该移动。`SSW` 模拟生成了一系列连续的局部和全局最小值结构，形成一条连续轨迹，可以提供最小值之间反应路径的关键信息。该方法最初为分子和簇等非周期体系开发，已扩展到周期性晶体。\n\
  \n`SSW` 的每一步（也称为 MC 步）包含三个独立部分：\n1. 爬升 (climbing)\n2. 弛豫 (relaxation)\n3. 梅特波洛 MC\
  \ (Metropolis MC)\n\n如图 19.1 中一维 PES 示意所示，此类 MC 步利用爬升模块向上移动，利用弛豫模块寻找最小值。一旦达到最小值，则使用梅特波洛\
  \ MC 判断该结构将被接受还是拒绝。爬升过程是 `SSW` 方法的核心，下文将详细说明。\n\n`SSW` 的爬升模块涉及重复的偏置势驱动结构外推和局部几何优化，这逐渐将\
  \ `R0(t)` 拖动到高能配置 `RH(t)`，其中 `t` 是当前 MC 步的索引（见图 19.1）。从当前最小值 `R0(t)` 开始，`SSW` 首先生成一个随机方向\
  \ `N0(t)`，这是一个指向改变当前几何形状的归一化向量。为了实现对 PES 的无偏探索，初始方向 `N0(t)` 设计结合了两个随机生成的向量，即全局随机模式\
  \ `Ng(t)` 和局部随机模式 `Nl(t)`，如式 (19.14) 所示。\n\n![image](img/bk9781788017893-00488-t14.jpg)(19.14)\n\
  \n其中混合参数 `λ` 控制这两个位移方向的相对比例。具体而言，在我们的实现中，`Ng(t)` 设置为随机生成的归一化向量，它遵循 300 K 下的麦克斯韦玻尔兹曼速度分布（如标准分子动力学所示），用于生成初始随机速度。由于\
  \ `Ng(t)` 分布在一组原子上，它代表了原子的柔和全局位移。相比之下，`Nl(t)` 描述了一种硬性的局部原子运动，在我们的实现中，它被设置为两个远距离原子之间的碰撞运动。\n\
  \n### 优化方法与选择\n（此处重复了前文内容，已在上述）\n\n### 爬升模块\n（此处重复了前文内容，已在上述）\n\n\n\n\n从 `R^(n)[t]`\
  \ 移动到高能构型 `R^(H)[t]` 时使用了改进的势面（PES） `V[mod]`，如公式 (19.20) 所示，其中一系列偏置高斯势能 `v[n]`（`n`\
  \ 是偏置势能的索引，`n=1,2…H`）沿着 `N^(n)[t]` 方向逐个添加，从而在改进后的 PES 上沿着移动轨迹创建出了一系列局部极小值 `R^(n)[t]`。类似的技术已用于元亚动力学（Metadynamics）。^(40)\
  \ 局部极小值 `R^(n)[t]` 通过局部几何优化识别，其中力可以根据公式 (19.21) 进行评估。公式 (19.20) 中的 `w` 和 `ds` 分别控制高斯函数\
  \ `v[n]` 的高度和宽度。虽然 `w` 可以实时计算以保证上坡移动的成功，但 `ds` 在 SSW 模拟中被留作一个可调参数。需要提到的是，`N^(n)[t]`\
  \ 始终会在每个 `R^(n)[t]` 处从初始随机方向 `N⁰[t]` 更新，然后使用 BP 进行精炼。\n\n总之，从 `R^(n)[t]` 到 `R^(H)[t]`\
  \ 的上坡移动是一个包含以下步骤的重复过程：\n(i) 在 `R^(n)[t]` 处更新方向 `N^(n)[t]`；\n(ii) 添加新的高斯函数 `v[n]`\
  \ 并沿着 `N^(n)[t]` 方向将 `R^(n)[t]` 位移一个量级 `ds`；\n(iii) 在改进的 PES 上弛豫到 `R^(n+1)[t]`。\n\
  \nSSW 方法的整体效率取决于表面步长 `ds` 和最大高斯势能数量 `H` 的选择。`ds` 的典型值范围在 0.2 到 0.6 Å 之间，约为典型键长的\
  \ 10% 到 40%。高斯势能的最大数量（`H`）也取决于系统，通常 6~15 是一个合理的选择。通过较大的 `ds` 和较大的 `H`，可以快速探索大范围的\
  \ PES，但是以牺牲极小值之间反应路径的分率为代价的。通常对于复杂的 Lennard-Jones 簇（例如具有多个漏斗和高能垒的 LJ[75]），SSW 模拟在\
  \ `ds=0.6` 且 `H=14` 时，每个 MC 步需要 300~400 次能量/力评估。通常有 70~80% 的计算量（能量和梯度评估）用于爬坡阶段，剩余的\
  \ 20~30% 用于弛豫到极小值。\n\n### 19.2.5 自学习程序\n\n自学习程序的简述如下，另参见图 19.3。在第一阶段，基于第一原理 DFT\
  \ 计算通过并行执行短时 SSW 采样来构建初始数据集。这些 DFT 计算通常限于小系统（通常在 20 个原子以下），并采用低精度设置以加速全局 PES 采样。从\
  \ SSW 获取 PES 数据后，随机选择一小部分数据集并使用高精度设置的 DFT 进行计算。此阶段产生了一个具有高精度的数据集。![image](img/bk978188017893-00488-f3)\n\
  \n图 19.3 的自学习程序，源自 27（https://doi.org/10.1063/1783），用于全局势能的生成，采用 [CC BY 4.0 协议](http://creativecommons.org/licenses/by/4.0/)。使用高精度设置的\
  \ DFT 生成神经网络（NN）势能。\n\n第二阶段是使用数据集 生成神经网络，细节见表 19.1。该 NN 通常具有二三层隐藏层，每层有 50~120 个神经元。通过同时拟合来自公式\
  \ (19.13) 的能量、力和应力，实现了这种大参数空间的优化。这种训练过程由一系列超参数控制，例如能量、力和应力之间的 `ρ` : `τ`、权重初始化方法、神经元激活函数等(45,46)。由于\
  \ PES 的结构多样性，NN 的能量均方根误差（RMSE）精度为为 5~10 meV，力的 RMSE 为 0.1~0.2 eV Å⁻¹。\n\n表 19.1\
  \ 之前工作中使用的超参数。\n\n| 超参数 | 值 |\n| --- | --- |\n| 优化方法 | L-BFGS |\n| 权重比例 1 : `ρ`\
  \ : `τ` | 1 : 5 : 10 |\n| 隐藏层数 | 2~3 |\n| 每层神经元数 | 50~120 |\n| 权重初始化方法 | Xavier\
  \ |\n| 神经元激活函数 | h³ |\n| 训练数据量 | 20000~100000 |\n| 权重和偏置数量 | 10⁴~1⁶ |\n\n## 19.3\
  \ 应用\n\n#### 19.3.1 PES 探索\n\n材料的热力和动力学取决于基础 PES。可以通过 SSW-NN 模拟方便地建立。近年来，我们绘制了多个系统的\
  \ PES，例如单元素晶（硼），^(28)分子晶（冰），^(47)金属氧化物（TiO[2], ZnCr[2]O[4]）。^(48,49) TiO[2] 和 ZnCr[2]O[4]\
  \ 的 PES 被投影到二维等高图中，如图 19.4 所示，其中结构序参数（**OP**）和相对能量分别为 x 轴和 y 轴。图中颜色的密度表示 PES 上的态密度，显示了相同结构序参数下构型的能量简并性。\n\
  \n\n\n\n\n图 19.4 通过 SSW–NN 全局搜索确定的 `TiO[2]` 和 `ZnCr[2]O[4]` 全局势能面（PES）。`x` 轴是晶体的通用结构指纹，即距离加权的\
  \ Steinhardt 型序参数（`OP`），具有不同的角动量 `L`=2, 4, 6，可以区分不同的极小值；`y` 轴是极小值的相对能量（Δ`E`）。美国化学学会许可转载自文献\
  \ 48，版权所有 2018；并经 Springer Nature 许可转载自文献 79，版权所有 2019。\n\n`OP` 由等式 (19.22) 定义。50\n\
  \n![image](img/bk9781788017893-00488-t20.jpg)(19.22)\n\n其中 `Y`[`lm`]` 是次数为 `l`、阶为\
  \ `m` 的球谐函数；`n` 是所有成键原子之间的归一化方向；`i` 和 `j` 是晶格中的原子，`r`[`ij`]` 是原子 `i` 和 `j` 之间的距离，`r`[`c]`\
  \ 设置为 `i` 和 `j` 原子典型单键长度的 60%。`N[bonds]` 是键键的数量。通过选择合适的次数，序参数可以测量晶格中原子的短程和中程有序，从而区分重要的晶体结构和无晶形结构。例如，从\
  \ `OP` 值判断配位数通常是直接的，*例如*在 `TiO[2]` PES 中，`OP`[`2`]`=0.3∼0.5 的六配位 Ti 原子和 `OP`[`2`]`=0.6∼0.8\
  \ 的五配位 Ti 原子。\n\n如图 19.4 所示，`TiO[2]` 和 `ZnCr[2]O[4]` 的 PES 形状相当不同：对于 `TiO[2]`，PES\
  \ 的形状有点像蝴蝶，而对于 `ZnCr[2]O[4]`，PES 是漏斗形的。在 PES 的底部（低能量结构所在），`TiO[2]` PES 表出存在许多能量相似的\
  \ `TiO[2]` 晶相，但具有不同的结构模式，在蝴蝶形状中有多个漏斗。相比之下，`ZnCr[2]O[4]` PES 只有一个定义良好的全局极小值，即尖晶石型结构；所有其他结构的能量都高得多。不足的是，目前已合成了\
  \ 10 种不同的 `TiO[2]` 晶体结构（*例如*锐钛、金刚石、(R) 和 (H) *等*），而 `ZnCr[2]O[4]` 仅已知一种尖晶石相。\n\n\
  除了全局极小值，全局 PES 还可以揭示未知的亚稳结构，这些结构可能作为重要的相变中间态，或表现出吸引的物理化学性质。从冰的全局 PES 中，我们发现了带有空位的低能冰相，这是立方到六方固相变最低能量路径中的关键中间体，该反应是冰核形成的核心。47\
  \ 我们发现固相变受冰基面界面处水空位的促进。这些结果对于理解我们观察的一些日常现象具有深远意义，从云中的湿度到冰异常的光滑性。对于 `TiO[2]`，通用化学已知\
  \ `TiO[6]` 八面体是 `TiO[2]` 晶体的常见构建单元。然而，从全局 PES 中已在图 19.4 中鉴定出了一类前所未有的微孔 `TiO[2]`\
  \ 晶相，命名为 `TiO2`，其特征是特殊的 `TiO[5]` 三角双锥形构建单元、大孔径（5∼7 Å）和高热稳定性。48 这些微孔材料被预测为锂离子电池和钠离子电池的候选负极材料。51\n\
  \n### 19.3.2 负载在 CeO[2] 上的超小 Au\n\n负载催化剂的原子结构在 PES 探索问题中占据首位。纳米颗粒/载体的双重复杂性和界面系统的大尺寸是全局结构搜索的两个主要挑战。随着\
  \ SSW–NN 的出现，解决一些关于负载催化剂的长期谜变得可行，例如二氧化��上阳离金性质。过去的二十年里，人们对金基催化剂产生了巨大的兴趣，它们可能在广泛的反应中表现出卓越的低温催化能力。52,53\
  \ 在催化剂中，二氧化��负载金（Au/CeO[2]）可以从 ~350 K 开始催化水气变换（WGS）产生高品质氢；它具有高稳定性。54,55) 得于良好的储氧能力，56)长期以来认为\
  \ `CeO[2]` 载体上的氧空位在 `Au/CeO[2]` 系统中稳定金颗粒起着关键作用。57) 然而，Fu 等人的开创性工作表明氧化态金（*例如* Au^+\
  \ 或 Au^(3+)）是 WGS 反应的活性位。54) Au/CeO[2] 高催化活性的起源一直一直是争议的热点。\n\n为了探索 CeO[2] 上的超小 Au\
  \ 簇构型并确定其热力学和动力学稳定性，我们进行了 SSW–NN 和增强分子动力学（MD)(58,59)模拟以获取 AuCeO 全局数据集并构建稳健准确的 AuCeO\
  \ G-NN 势。我们的模拟包含每个单元 14 到 444 个原子的结构，并涵盖了不同的 Au:�Ce:�O 比例以及不同的形态，*例如*体体、层和簇。最终的\
  \ AuCeO 全局数据集包含 33,654 个结构。AuCeO G-NN 势每个元素包含 186 个 PTSD，相应地，网络涉及三个隐藏层（186-60-50-50-1\
  \ 网），总网络参数相当于 51,000 个。能量和力的最终 RMSE 分别为 6.115 meV/原子和 0.152 eV�Å^(−1)。\n\n\n\n\n\
  \n通过基于第一性全局数据集建立三元 Au-Ce-O G-NN 势能，我们搜索了一系列 `Au/CeO[2]` 系统的全局最低能量，这些尺寸从四个到十二个原子的\
  \ `Au` 簇，以及载体 `CeO[2]` 包括原始表面、含 O 空位的表面和结构缺陷表面（缺失 O-Ce-O，`CeO[2]\\-SD`），详见图 19.5a–i。鈈上\
  \ `Au` 簇的能量学可以通过将负载系统与未负载表面、`Au` 体金属以及 `O[2]` 分子（如有必要）联系起来来评估。所示，原始 `CeO[2]` 表面\
  \ `Au` 簇的形成能 `E^(Au)[form]` 从 `+0.78 eV` 逐渐下降到 `+0.69` 然后是 `+0.64 eV`（`eV/Au atom`）。与另外两种\
  \ `CeO[2]` 表面相比，它们的能量通常较差，表明超小簇并不倾向于锚定在原始表面上，而较大的簇在热力学上更有优势。有趣的是，O 空位的存在并没有显著增加\
  \ `Au` 簇的 `E^(Au)[form]`。原始 `CeO[2]` 和含 O 空位的 `CeO[2]` 上 `Au` 的相似能量学表明，O 空位并没有引起产生额外的电荷转移，*例如*在形成带负电的\
  \ `Au` 簇时从 `CeO[2]` 载体到 `Au`。事实上，由于表面 O 缺失导致的额外电子储存在附近的表面 `Ce` 原子中，形成了两个 `Ce^(3+)`。DFT\
  \ 计算支持了这一解释，即 `Au[*x]/CeO[2]–O[*v]` 系统的净磁自旋通常大于 2，表明 `Au` 的吸附没有猝灭 `Ce` 原子上的自旋。另一方面，在\
  \ `CeO[2]\\-SD` 上的氧化 `Au` 簇要稳定得多，这体现在较低的 `E^(Au)[form]` 上。特别是，`Au[4]O[2]/CeO[2]\\\
  -SD` 具有负形成能，`−0.085 eV/Au atom`，这表明 `CeO[2]\\-SD` 可以作为小于 4 个 `Au` 原子的超小氧化 `Au` 簇的锚定位。随着簇尺寸增大，`CeO[2]\\\
  -SD` 位点的能量偏好逐渐消失。\n\n![image](img/bk9781788017893-00488-f5.jpg)\n\n图 19.5 由 SSW–NN\
  \ 确定的 `CeO[2]` 上 `Au` 簇的全局最低结构。(**a–i**) 三种不同 `CeO[2]` 表面 `Au` 簇的结构快照。对于 `Au[*x]/CeO[2]\\\
  -SD`，为了起见，展示了俯和视图。O 原子为红色/粉色，`Ce` 原子为白色。表面层 O 和亚表面 O 分别为红色（深）和粉色（浅）。`Au` 原子为黄色（例如，(g)\
  \ 中的中心簇）。氧空位由 `Au[*x]/CeO[2]–O[*v]` 中的虚线圈表示。嵌入的 `Au` 原子用蓝色矩形突出显示。(j) 相对于 `CeO[2]`\
  \ 表面和 `Au` 体的 `Au` 簇形成能。\n\n我们的结果显示，附在表面结构缺陷上的超小阳离子 `Au` 簇是唯一的稳定结构模式，*例如* `Au[4]O[2]/CeO[2]\\\
  -SD`，其中 `Au` 簇可以通过 `Au–O` 键向底层的 `Ce` 供电子（见图 19.5j）。`Au[4]O[2]/CeO[2]\\-SD` 被认为是\
  \ `CeO[2]` 表面上超小 `Au` 簇潜在稳定活性结构。不同 `CeO[2]` 表面上的其他簇具有强烈的能量偏好生长形成块 `Au` 金属。我们证明了全局\
  \ PES 探索对于理解氧化物载体上金属簇的形态至关重要，这现在可以*通过* NN 方法实现。\n\n### 19.3.3 无定形 `TiO[*x]H[*y*]`\
  \ 上的析氢反应\n\n黑钛（`TiO[2]`）在整个可见光谱范围内强吸收，已被发现其析氢反应（HER）活性比传统的 `TiO[2]` 材料高出几个数量级。(60–65)\
  \ 通过对原始 `TiO[2]` 进行氢化合成的，黑 `TiO[2]` 通常表现出核壳结构，具有几纳米厚的无定形壳包裹在锐钛矿晶上。(61,66–68) 无定形壳被认为是催化活性位点并是增强\
  \ HER 活性的原因。然而，从实验和理论上来说，无定形壳的结构确定都是挑战性的。\n\n为了解决无定形 `TiO[*x]H[*y*]` 上的 HER 活性位点，我们对\
  \ `TiO[*x]H[*y*]` 数据集进行了 SSW–NN，以建立一个稳健的 `TiO[*x]H[*y*]` 势能。`TiO[*x]H[*y*]` 网络涵盖了不同的\
  \ `O` 比例，主要是 `TiO[*x]H[*y]`，也包含类似 `H[2]` 系统。`TiO[*x]H[*y*]` G-NN 利用了二体 PTSDs、三体\
  \ PTSDs 和四体 PTSDs。`TiO[*x]H[*y*]` 能量和力的最终 RMSE 分别为 `8 meV per atom` 和 `0.22 eV/Å`。\n\
  \n使用 `TiO[*x*]` 势能，可以确定不同温度压力下与 `H` 接触的 `TiO[2]` 体和表面的热力学相图。\n\n我们发现，在常见的锐钛矿中，只有阶梯状锐钛矿\
  \ (112) 表面可以通过表面 H 原子重构，且局部 H 覆盖率 `0.69 ML`（见图 19.6A）。相反，`Ti-O` 键长分布从 `1.8 Å` 到\
  \ `2.2 Å`，而完美的 `TiO[2]` 表面为 `1.9~2.1 Å`。这种高 H 覆盖率不仅使无定形 `TiO[2]` 呈现黑色（见图 19.6C），还为\
  \ HER 提供了一个低能反应通道：瞬态 `Ti-H` 氢化物可能在暴露的 `Ti` 原子上形成，其与相邻 `OH` 的反应能垒低得多。新生的 `TiH` 氢化物可以与相邻\
  \ `OH` 容易产生 `H[2]`（能垒为 `0.6 eV`），该能垒比通过两个表面 `OH` 的传统的 H 耦合通道（能垒 `>1.9 eV`）低了超过 `1\
  \ eV`，如图 19.6D–F,69\n\n\n\n\n\n图 19.6 (`A` 和 `B`) H 覆盖 (112) 的相对能量和选定结构，覆盖率 `x`\
  \ 从 0 到 0.81 ML 的 `TiO[2]-x-H`。所有能量学数据均来自 DFT 计算，并相对于原始 (112) 晶面和 `H[2]` 分子的能量。在\
  \ (`B`) 中，氢化后的重构表面变为无定形，并出现了多种 Ti 配位。对于所研究的 (4×2) (112) 表面，无定形 `TiO[2]-0.69H` 中存在两个\
  \ `Ti[4c]`、四个 `Ti[5c]` 和两个 `Ti[6c]`。(`C`) `TiO[2]` 晶面的光学吸收谱。(`D`) H 在原始 (112) 表面和无定形\
  \ `TiO[2]-0.69H` 上`via` `OH/OH` 耦合机制和 `TiH/OH` 耦合机制进行耦合的能量剖面。(`E`, `F`) (112) 顶视图的反应快照。Ti：浅灰色球；O：红色（较深）球。H：白色球（反应中的\
  \ H：用虚线连接的球）。经美国化学学会许可，转载自文献 49，版权所有 2018。\n\n我们注意到，在理论工作发表后，最近的实验工作揭示了无定形 `TiO[2]`\
  \ 上存在 `TiH` 氢化物，其中 `1H` 核磁共振谱中的特征 H 化学位移 `δ` 具有一个负峰（−0.6 ppm），该值随氢化时间的增加而增大。(70)\n\
  \n### 19.3.4 ZnCrO 催化剂上的合成气转化\n\n作为 BASF 开发的合成气制甲醇的第一代工业催化剂之一，(71) 氧化锌铬 (`ZnCrO`)\
  \ 催化剂自 20 世纪 30 年代年代以来已得到广泛研究。观察发现，`Zn` : `Cr` 比例会显著影响合成气制甲醇的催化活性和选择性。(72–75) 通常在\
  \ `Zn` : `Cr=1` : `1` 到 `2` : `1` 的范围内获得最佳活性和选择性，例如在 300 °C 下，`Zn` : `Cr=1` : `1`\
  \ 时，甲醇产量为 `90~600 g*kg[cat]^(−1)*h^(−1)`，选择性为 80%。(75) 相比，具有纯 `ZnCr[2]O[4]` 尖晶石结构的\
  \ `Zn` : `Cr=1` : `2` 催化剂活性和选择性较低，`<5 g*kg[cat]^(−1)*h^(−1)`，甲醇选择性为 14%（烷烃为~45%）。(75)\
  \ 此时，反应温度升高到 400 °C 会导致 `Zn` : `Cr=1` : `2` 催化剂上优先产生甲烷而非甲醇（甲烷选择性 ~75%）。对于结构，认为具有晶型的\
  \ `ZnCr[2]O[4]` 是最稳定的相，因为它是在煅烧后形成的。(76) `Zn` : `Cr` 比例在 `1` : `1` 和 `1` : `2` 之间的\
  \ `ZnCrO` 催化剂原子结构仍不确定，因为没有发现 `ZnO` 形成的明确证据，尽管 X 射线衍射 (`XRD`) 图谱相对于 `ZnCr[2]O[4]`\
  \ 尖晶石表现出峰宽化和小峰位移。(75,77,78) 进一步增加 `Zn` : `Cr` 比例 (>1:1)，通过 `XRD` 检测到催化剂中 `ZnO` 的聚集，但定量分析显示，如果假设催化剂是由\
  \ `ZnCr[2]O[4]` 和 `ZnO` 组成的，那么 `ZnO` 的量远小于理论值。(75,77) `ZnCrO` 的结构不确定性阻碍了活性位的解析；没有人知道在\
  \ `Zn` : `Cr=1` : `1` 上的活性位是什么。为了解决合成气如何在 `ZnCrO` 上转化，我们通过 `SSW–NN` 模拟获取 `ZnCrO`\
  \ 全局数据集并构建稳健准确的 `ZnCrO` 电势。我们的模拟包含从 10 到 84 个原子的不同 `Zn` : `Cr` : `O` 比例，例如 `ZnO`、`CrO[x]`、`ZnCr[x]O[y]`。最终\
  \ `ZnCrO` 全局数据集包含 3825 个结构。`ZnCrO` 电势包含每个元素的 324 个 `PTSDs`，例如 132 个二体 `PTSDs`、170\
  \ 个三体 `PTSDs` 和四体 `PTSDs`，相应地，网络共涉及 `（324-80-1）` 层。能量和力的最终 `RMSE` 分别为原子 4.3 meV\
  \ 和 0.128 eV。(79)\n\n基于 `ZnCrO` 电势，我们首次能够随 `Zn` : `Cr` : `O` 变化的 `ZnCrO` 结构演变，并建立\
  \ `Zn-Cr-O` 三相图。\n\n如图 19.7A 所示，尖晶石型晶体结构是 `Zn` : `Cr=0` : `1` 到 `1` : `1` `ZnCrO`\
  \ 的主要模式。`Zn-Cr-O` 热力相图进一步揭示了一个稳定的稳定区域，例如 `Zn` : `Cr` : `O=6` : `6` : `16–3` : `8`\
  \ : `16`，氧化物合金倾向于结晶为尖晶石相（见图 19.7B）。\n\n`Zn` : `Cr` 比例从 `1` : `2` 变为 `1` : `1` 导致了\
  \ `Zn[3]Cr[3]O[8]` 元稳晶相的产生，该相内部含有最高浓度的异常 `ZnO[6]` 八面体（O[h]）。这种微妙的结构差异证明会严重影响合成气的转化活性和选择性。由于\
  \ `[ZnO[6]][Oh]` 的存在，氧空（O[v]）的形成能力随 `Zn` : `Cr` 比例的增加而显著提高，并从表面扩展到表面。在合成气反应条件下，`Zn`\
  \ : `Cr=1` : `1` 的催化剂表面暴露出异常四配平面 `Cr^{2+}`，而在 `Zn` : `Cr=1` : `2` 的催化剂表面可以暴露金字塔几何五配\
  \ `Cr` 阳离子（见图 19.7C）。\n\n\n\n\n\n对 `Zn[3]Cr[3]O[8]` 和 `ZnCr[2]O[4]` 上合成气转化反应的进一步\
  \ DFT 研究证明，`Zn[3]Cr[3]O[8]` 表面的四配位平面 `Cr^(2+)` 阳离子位对于甲醇选择性至关重要。另一方面，`ZnCr[2]O[4]`\
  \ 相表现出较低的催化活性，主要产生甲烷（见图 19.7D).基于 DFT 反应能量的微动力学模拟（`Zn[3]Cr[3]O[8]`上的甲醇产量：∼670 g\
  \ kg[cat]^(−1) h^(−1)；`ZnCr[2]O[4]`上的甲烷产量：∼0.08 g kg[cat]^(−1) h^(−1)）进一步解释了实验中观察到的活性和选择性的巨大差异：`Zn\
  \ : Cr=1 : 1` 的 `ZnCrO` 催化剂表现出高活性和高甲醇选择性（573 K 下甲醇产量为 80∼600 g*kg[cat]^(−1)*h^(−1)，选择性为\
  \ 80%），但 `Zn : Cr=1 : 2` 的 `ZnCrO` 催化剂表现出低活性和低甲醇选择性（573 K 下甲醇产量<5 g*kg[cat]^(−1)，选择性为\
  \ 14%；673 K 下碳烃选择性约为 82%，其中 `CH[4]` 占 91%）。^(75,[80])\n\n### 催化活性与选择性\n\n两种不同尖晶石相之间的催化活性和选择性差异在很大程度上归因于两种表面上\
  \ `CH[3]O` 吸附强度的灵敏性（见图 19.7D）。`ZnCr[2]O[4]` 表面对 `CH[3]O` 的强吸附显然阻碍了 `CH[3]OH` 的形成，并导致\
  \ `CH[4]` 形成的高能垒；而 `Zn[3]Cr[3]O[8]` 表面对 `CH[3]O` 的适度吸附促进了 `CH[3]OH` 通路。对 `ZnCrO`\
  \ 催化剂的发现不仅加强了我们从体相到表面到活性位对氧化物高温合成气转化的理解，而且表明随着 SSW–NN 方法的出现，现在对实验争议的其他复杂氧化物体系（例如\
  \ `ZnZrO`、`CuZnO`、`ZnMnO` 和 `ZnFeO）成为探索。\n\n## 19.4 展望\n\n本章概述了 SSW–NN 方法及其在多相催化中的近期应用。虽然\
  \ `SSW–NN` 在解决多相催化中从催化剂活性位结构到催化活性的某些挑战性任务方面充满前景，但必须记住，`NN` 势的成功应用很大程度上取决于目标问题的采样数据集。未来仍有一些待解决的挑战。\n\
  \n(i) 反应 PES 采样（特别是分子反应）的计算成本高于典型的材料 PES 采样。这是由于分子反应即使在存在表面的情况下也具有较高的反应能垒。捕捉具有尖锐\
  \ `TS` 区域（即以大负曲率为特征）的反应变得尤为棘手，因为随机采样难以捕捉精确的 `TS` 位置。如上所述，目前的 `NN` 势通常关注于 `TiO[2]`\
  \ 和 `ZnCrO` 等材料，一个巨大的进步是将分子反应与固体材料结合，以建立用于多相催化的 `NN` 势。\n\n(ii) 当体系较大且键复杂性增加时，构建全局\
  \ `NN` 势的迭代学习可能需要大量的计算。多元素的键环境是构建 `NN` 势的关键问题。例如，在有机化学中，碳与其他元素（`H`、`O`、`N`）存在多种可能的键，构建通用的有机化学\
  \ `NN` 势具有挑战性。为了增强反应采样并减少系统自由度，我们预计将 WW–NN 与其他技术（如模式识别、粗粒化和刚体方法）相结合，将是解决复杂催化问题的未来方向。\n\
