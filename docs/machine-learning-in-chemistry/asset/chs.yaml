  \n## 9.1 机器学习概述、挑战与机遇\n\n目前，机器学习（ML）是科学、技术和医学领域最令人兴奋的计算技术之一。其之所以令人兴奋的原因是，与必须为了实现目标而精确编写每项操作的传统计算机程序不同，机器学习可以以类似于人类的方式从示例中学习。同一个机器学习程序可以被训练用于建模和预测许多不同类型的实验和场景，并能够考虑异构数据类型，如实验条件、物理和化学性质以及样本的处理历史。([1])\
  \ 机器学习模型可以生成连续属性的模型（如水溶性、生物活性和材料强度），还可以生成分类数据（好/坏、活性/不活性、无毒/中度毒/极毒等）。较新类型的机器学习还能生成非常好的特征，即分子、材料、图像等的内在属性的数学表示，这些特征能生成改进的模型，因为在构建机器学习模型时，特征的质量至关重要。([2])\n\
  \n意不意外的是，人工智能（AI）方法（很大程度上是机器学习）正在广泛的研究和应用领域产生许多新的且具有颠覆性的科学成果。([3]) 使用机器学习的出版物数量正呈指数级增长；其中许多发表在《自然》（Nature）、《科学》（Science）、《细胞》（Cell）以及《美国国家科学院院报》（PNAS）及其系列等顶级期刊上。然而，机器学习并非新事物。第一个神经网络——感知机开发于\
  \ 1958 年。一种简单的统计建模前身——定量结构-活性（或性质）关系模型（QSAR/QSPR）在相似时期出现在化学领域。不久后，神经网络被用于模拟化学结构与有机分子的其他分子物理化性质以及某些有用属性（特别是生物效应）之间的关系。该领域取得了稳步进展，但几个重要的障碍阻碍了这些机器学习方法的更快速进展和更广泛应用。主要问题在于计算技术非常有限、缺乏训练机器学习模型的数据、缺乏如何生成编码有用信息的数学实体的思路、缺乏如何降低机器学习建模问题维度（特征选择）的理解，甚至还有关于衡量机器学习模型预测能力最佳方法的长期学术争论。([4])\
  \ 尽管存在这些局限性，在这一时期内也进行了许多实用的研究；该方法产生了新的候选药物，并预测了它们可能的毒性和代谢负担，随着计算能力在随后的几十年中经历人的发展，计算资源可用性低的许多局限性也得到了缓解。\n\
  \n目前，出现了一个幸运的巧合（或许是刻意的推动）：先进计算技术和算法（例如深度学习 (DL)）、自动化和机器人技术的发展产生了适用于训练机器学习模型的大型数据集，以及更广泛、具有前所未有能力的强大机器学习算法的开发和/应用。机器学习在化学应用中发生的变化还包括，我们为\
  \ QSAR/QSPR 方法（化学领域中的机器学习模型）中许多棘手的障碍找到了非常完美的解决方案。例如，自动编码器/解码器、对抗网络和卷积神经网络等深度学习方法简化了生成用于训练机器学习模型的数学描述符的问题。事实上，这些方法现在可以获取分子实体的简单表示（如\
  \ SMILES 字符串、有机分子的线性文本表示），并在内部生成相关的描述符。我们还采用了强大的新描述符，如碎片和签名描述符([5])，它们能生成非常好的模型。与旧且晦奥的描述符（例如由\
  \ Dragon([6]) 等描述符生成包生成的）相比，它们在分子相互作用和机制方面更容易解释。现在更广泛地使用了高效的稀疏特征选择方法（例如 LASSO），它们消除了糟糕且无信息的描述符，使得模型训练更快、更易解释且更具预测性。\n\
  \n这些发展推动了机器学习向新领域的大幅扩张，例如正向和逆合成反应预测，([7])、材料的热力学动力学稳定性预测、从序列预测蛋白质结构，([8])、用于能源应用的多孔和二维材料的性质和性能预测，([9])\
  \ 以及许多领域。([10]) 最近，这些技术被应用于机器人的自主进化设计，([11])，完美完成了一个闭环：机器人技术允许产生大量数据，这些数据随后被用于训练可以生成新机器人架构的模型。本章将不再讨论这些应用，因为许多应用在书中其他章节已有详细介绍。随着机器人技术、自动化和组学技术的快速发展，数据可用性已大幅增加。代表研究问题领域的海量且化的数据对于机器学习和深度学习等数据驱动建模方法至关重要。然而，可能的获取材料空间的大小（~10¹⁰⁰，本质上无限）显然表明，仅凭实验无论计划多快或多好（例如实验设计），都无法充分覆盖此类空间。需要更有效的方法在巨大的材料可能性海洋中识别“有用孤岛”。这强烈表明，机器学习方法需要与能够高效探索极大空间的进化算法协同工作。这将在本章后后详细讨论。\n\
  \n## 9.2 问题的规模与重要性/复杂材料特殊问题\n\n与机器学习大数据一样，材料科学、再生医学和生物材料领域正经历前所未有的扩张。它们正在利用新的材料合成、表征和测试自动化方法。([12])\
  \ 大多数有趣的研究正发生在材料与生物学的边界，例如生物材料、组织工程、干细胞控制、植入和留置设备、纳米级智能递送系统、用于可穿戴传感器的二维材料、机器人和假肢。\n\
  \n\n\n\n然而，与小型有机药物或类药物分子相比，复杂材料的机器学习建模面临着特殊问题。纳米材料表现出形状和尺寸的分布，其表面会根据其嵌入的环境发生动态变化，且这些材料往往缺乏良好的表征。同样，聚合物也没有经过良好的表征，它们具有多分散性、交联性，其结构并非精确已知*等等*。目前迫切需要系统性研究，以了解这些材料的性质如何影响由其构建的系统的行为。显然，对复杂材料进行数学表征以用于训练机器学习模型是有困难的。针对材料的特定描述符在很大程度上尚不可用，即使可用，也非常晦奥且不可解释。然而，如编码器-解码器网络和通用对抗神经网络等新型深度学习方法将显著改善这一缺陷，因为它们可以从化学结构简单的表表示中“即时”生成内部描述符。\n\
  \n当代机器学习技术提供了巨大的机遇。它们首次提供了解决由于其复杂性而无法触及的科学、医学、社会和技术问题的机会。我们现在描述材料科学中的几个领域，在这些领域，机器学习为非常复杂的问题提供了新的解决方案。其目的是展示机器学习现在是如何被使用的；重点在于有用且有趣的应用，而不是那些前沿但晦涩的应用。\n\
  \n## 9.3 材料科学中的机器学习示例\n\n我们提供了几个示例，展示机器学习如何用于解决能源和环境领域的重要问题。本节内容较短，因为它在其他章节中有所涉及，展示了关于多孔材料和二维材料性质机器学习建模的最新研究。\n\
  \n多孔材料，如金属有机框架（MOFs）、咪唑盐金属有机框架（ZIFs）和共价有机框架（COFs），因其多样性、可调性以及潜在的能量相关应用（如碳捕集、氢气和甲烷储能、二氧化碳电还原和水电解反应的电催化剂及相关应用）而引起了广泛关注。大型多孔材料数据库中存在着数以百万计可能合成的多孔材料；然而，目前还不知道其中哪些是稳定且可合成的。对于每一个报道的成功\
  \ MOF 合成，无疑有成百上千次被尝试过的失败反应。机器学习可以利用成功和失败反应的知识来预测和优化新 MOF 的合成。MOF 的合成涉及金属离子和有机连接体在三维周期网络中的自组装。然而，我们对这种自组装过程的理解仍然太浅，不足以预测哪些组合可以合成，或者哪些合成条件是最佳的。Moosavi\
  \ *等人* 最近使用机器学习，从一组成功和失败的实验中捕捉化学直觉，以合成一种金属有机框架。他们使用随机森林集成学习器来评估由铜离子和 1,3,5-苯三甲酸合成\
  \ MOF 过程中各变量的重要性，从而产生了一种具有前所未有的表面积的材料。Moghadam *等人* 随后应用机器学习预测适用于其应用的 MOF 的机械稳定性。他们首先对包含\
  \ 41 种不同网络拓扑结构的 3385 种 MOF 进行了高通量分子模拟，然后用这些数据来训练一个机器学习模型，用以预测 MOF 的力学性能。他们的模型使用五个可获取的描述符进行训练，可以快速估计新或现有\
  \ MOF 的体弹性模量，这代表了这些材料在典型工作条件下能够承受的关键压力，对于 MOF 社区来说是一个非常有价值的工具。\n\n在能源应用领域，Thornton\
  \ 及其报道了使用机器学习设计用于 CO[2] 还原的沸石催化剂。他们采用了统计和机器学习（QSPR）建模技术，来识别沸石结构特征与通过精确但计算需求巨大的巨正则系蒙特卡洛（GCMC）计算所模拟的\
  \ CO[2] 和氢气吸附性质之间的定量关系。发现了稳健的结构-性能关系，将孔径、表面积和空隙率等结构描述符与沸石性能联系起来。通过对超过 300,000 种沸石结构进行计算筛选，确定了实用的催化剂。其中几个顶选候选者是极具前景的催化能效模板，其预测性能比传统方法高出\
  \ 50%。\n\n\n\n\n目前已知或预测有约 2000 种可合成的二维材料，它们展现出多种潜在的有用特性。例如，最近的一项研究^(17)确定了 1825\
  \ 种可以从已知无机化合物中剥离的二维材料。混合层状二维材料（由两种不同的二维材料组成）对光伏和光子学应用具有巨大意义，因为它们在针对特定应用进行调节方面具有更大的空间。已知的二维材料理论上可以产生约\
  \ 200 万种双层结构和约 10 亿种三层结构。显然，如此大量的混合材料无法通过实验生成和测试，尽管密度泛函理论（DFT）可以预测它们的性质，但计算需求使得预测超过一百种材料的性质也变得不可。机器学习（ML）方法可用于将相对少量的混合二维材料性质准确\
  \ DFT 计算结果扩展到广大的材料空间中。例如，Tawfik *等人* 报告了对几乎 1500 种双层异质结构的层间距和带隙的预测。他们的模型可以预测测试集中混合材料的层间距，平均误差为\
  \ 4%，带隙的均方根误差（RMSE）为 0.2 eV。使用混合 DFT 和机器学习方法可以比仅用 DFT 计算快得多对大量材料进行预测。\n\n## 9.4\
  \ 纳米材料中的机器学习示例\n\n与块体态的相同材料相比，纳米颗粒形式的材料通常表现出有用（但也可能具有危害）的生物学特性。这很大程度上是因为小颗粒与大颗粒相比具有极高的表面积比。材料表面与生物学直接相互作用，因此非常重要。纳米材料在将药物和基因治疗递送到体内靶向组织以及作为诊断成像剂方面显示出巨大前景。机器学习方法已广泛用于理解纳米颗粒的物理化学性质与其如何影响生物学之间的关系。由于几个关键原因，设计纳米颗粒行为的计算模型非常困难：纳米颗粒呈现尺寸和形状的分布，因此比小分子更难表征；它们远大于分子，因此不清楚如何以有意义的方式编码它们的化学性质；在生物系统中，它们会被复杂的蛋白质层（蛋白冠）覆盖，这会显著影响它们产生的生物反应类型；绘制它们在*体内*分布、通过肺部、胃肠道和皮肤摄取的分布图实验非常困难；尽管*体外*实验较简单，但它们通常与*体内*反应的相关性并不良好。\n\
  \n机器学习方法可以简化某些困难，而且它们不需要对纳米颗粒生物反应涉及的机制有完全理解。它们一直是理解商用纳米材料潜在负面生物特性的重要因素。其目标是将机器学习模型作为“设计即安全”（safe-by-design）范式的一部分，以产生副作用最小的商业实用材料。例如，Le\
  \ *等人* 描述了一种用于开发设计安全纳米颗粒的实验和计算方法^(18)。他们生成了一个包含 45 种氧化锌（ZnO）纳米颗粒的库，具有不同的粒径、长比、掺杂类型、掺杂浓度和表面涂层，并测量了人脐静脉内皮细胞或人肝癌细胞的细胞损伤。\n\
  \n![image](img/bk9781788017893-00206-f2.jpg)\n\n图 9.2 机器学习模型（左）和实验结果（右）对纳米颗粒性质的性能。转自文献\
  \ 18，经 John Wiley & Sons, GmbH 许可。\n\n驱动细胞损伤的最重要因素是氧化锌的浓度和颗粒的性质。*等人*还报告了 `ML` 方法如何预测这些复杂复合性质的负面影响^(19)。作为数据驱动的方法，它们的主要问题之一是获取高质量的实验数据。这在纳米材料中尤为困难，因为研究仍然相对较少。这种数据的迫切需求在最近的综述中被识别^(20),21)\n\
  \n两亲性、自组装纳米材料（如立方体体和六角柱体）是一类很有前景的药物递送系统（参见图 9.3）。然而，它们的设计非常复杂，因为它们组装成的纳米相类型取决于温度、时间、药物的物理化学性质等。只有特定的纳米相是有用的。直到最近，预测这些复杂参数对所得纳米相的影响一直被认为是不可解决的。Le\
  \ *等人* 展示了机器学习方法如何准确预测在给定条件下会形成几种（有时共存的）纳米相中的哪一种^(23),24](#BK9781788017893-00206.xhtml#cit24))。他们通过对装载的两亲纳米颗粒进行从头合成并在澳大利亚同步辐射光源上小角\
  \ X 射线实验测定纳米相，验证了他们预测纳米相的机器学习模型（参见图 9.4）。预测准确率为 90%。他们随后展示了机器学习模型如何准确预测两亲药物递送系统的随演变^(25)\n\
  \n![image](img/bk9781788017893-00206-f3.jpg)\n\n图 9.3 两亲性、自组装纳米材料（如立方体体和六角柱体）采用许多纳米结构，并非所有结构都适用于药物递送。在这里，我们展示了反连续金刚石\
  \ QIID (Pn3m)、螺旋青面 QIIG (Ia3d) 和原始立方 QIIP (Im3m) 立方相的示例结构。转自文献 23、[`pubs.acs.org/doi/10.1021/mp3006402`](http://https://pubs.acs.org/doi/10.1021/mp3006402)，经美国化学学会许可，版权所有\
  \ 2013 年。\n\n\n\n\n\n图 9.4 ML 模型预测一系列结合到纳米相的新药的个体相的存在：反向连续金刚型 QIID `(Pn3m)` 立方（蓝色，位于图\
  \ 9.4A 和 B 左侧）、六角形 `HII`（黄色，实心圆）、螺旋面 QIIG `(Ia3d)` 立方（红色）、原性 QIIP `(Im3m)` 立方（紫色，位于图\
  \ 9.4C 和 D 右侧）以及流体各向同性 `FI`（褐色）。生成纳米颗粒的双亲活性剂为 (A) 植物植醇和 (B) 单油酸纳米颗粒。这些颗粒在 25 °C\
  \ 和 37 °C 下装载了新药。圆圈表示随后通过澳大利亚同步加速器的小角 X 射线散射测定的纳米相预测错误。预测准确率达到 90%。这展示了 ML 模型如何根据双亲活性剂、药物类型、药物载量和温度准确预测纳米相行为。重印自文献\
  \ 23，[`pubs.acs.org/doi/10.1021/mp3006402`](http://pubs.acs.org/doi/10.1021/mp3006402)，经美国化学学会许可，版权所有\
  \ 2013。\n\nsiRNA 也可用于治疗，ML 已用于设计 siRNA 库以及更有效的材料来递送这些高电荷分子。2011 年的一篇综述描述了用于辅助 siRNA\
  \ 序列和递送系统理性设计的各种 ML 方法。(26) 例如，Huesken 及其同事利用高通量报告基因系统，在 2182 种针对 34 种 mRNA 物种的随机选择\
  \ siRNA 上训练了神经网络。(27) 该 ML 模型预测了独立测试集中 249 种 siRNA 的活性，`r²` 值为 0.44，处于良好。该 ML 模型被用于设计一个每个基因两个\
  \ siRNA 的全基因组 siRNA 库。这个包含 50,000 个 siRNA 的集合识别了参与细胞缺氧反应的基因。随后 ML 方法能力的极大提升再次燃起了人们对这一重要领域的兴趣。siRNA\
  \ 序列基因沉默效率的预测已显著提高，ML 方法在纳米颗粒基因递送系统的效率方面提供了更好的预测。例如，最近 Han *et al.* 使用深度学习方法提高了\
  \ siRNA 效能预测的准确性。他们的 DNN 从序列和热力学属性中提取了隐藏特征。模型预测 siRNA 效能略好，`r²` 值为 0.53。后续实验表明，他们的模型比其他几种\
  \ siRNA 预测方法更准确。MIT 的 Anderson 团队报告了 siRNA 预测的影响。\n\n## 9.5 生物材料中的机器学习示例\n\n生物材料是再生医学的重要元素，有望替代受损组织、刺激神经生长、为细胞治疗提供环境并精确递送药物。由于可用材料种类几乎无限，使用高通量技术进行筛选并采用\
  \ ML 等计算方法至关重要。到目前，最广泛用于这些目的的材料是聚合物和纳米材料。抗细菌附着和生物膜形成的材料可以减少异物反应（FBR）。显然，表面和界面通常是生物反应的主要驱动力，因此分析、修改和建模表面化学和拓扑结构对于生物材料的发展非常重要。\n\
  \nML 方法已用于建模聚合物支持病原微生物生长的倾向。利用针笔和喷墨打印巧妙生成大型阵列为测量细胞反应提供了手段。在 Langer 小组开创性工作的基础上，Hook\
  \ *et al.* 在最近的出版物描述了这种实验技术。(12,28) 他们发现了数百种聚合物中三种重要病原体——*金黄色葡萄球菌*、*铜绿单胞菌*和尿路致病*大肠杆菌*的附着与表面化学（通过实验表面分析确定）之间的关系。随后使用表面分析作为描述符或单体计算生成的分子描述符对这些数据进行\
  \ ML 建模，得到了病原体附着的稳健且具预测性的模型。(29) 后的研究显示，单个 ML 模型即可同时预测所有病原体的附着，(30)使得对数千种可用但尚未合成的聚合物进行虚拟筛选变得简单得多，以识别出具有低泛性病原体附着能力的聚合物（在图\
  \ 9.5\n\n图 9.5 单个 ML 模型同时预测三种重要病原体的附着。多病原体附着模型的测定和预测附着（使用 GFP 荧光的对数 `logF` 估计）采用了计算分子描述符。重印自文献\
  \ 30，经美国化学学会许可，版权所有 2018。\n\n\n\n\n\n由于生物材料（以及药物）的机器学习模型在历史上一直使用高效但相当晦涩（难以理解）的描述符进行训练，因此，随后的研究表明，特定类型的分子片段描述符可以生成更便于实验材料科学家解释的模型。一种类似的机器学习建模方法被用于寻找干细胞在聚合物库上的贴附关系。最近，机器学习方法被用于对一个包含\
  \ 141 种均聚聚物和 400 种不同共聚物的库进行建模，以评估它们支持人类牙髓髓干细胞贴附、增殖和分化的能力。在这项研究中，使用具有稀疏诱导拉普拉斯先验的贝叶斯正则化神经网络分别对三种干细胞响应进行建模。生成的计算模型将聚合物特性与细胞响应联系起来。这些模型预测干细胞贴附的准确率达到\
  \ 92–95%，增殖的准确率达到 85–92%，分化的准确率达到 82–85%。模型还识别出了几个支持特定细胞响应的关键官能团。\n\n像飞行时间二次离子质谱（`ToF-SIMS`）和拉曼光谱等表面分析方法对于理解生物材料如何与生物相互作用至关重要。这是因为体材料和纳米材料的表面是与细胞和其他生物实体接触的主要位点。`ToF-SIMS`\
  \ 用原子或原子簇撞材料表面，使组成分子碎片，从而提供一种材料表面特有的“指纹”。惊讶的是，分析表面分析方法产生的大型数据集的方法通常涉及相对简单的统计方法，如主成分分析（`PCA`）。当用作编码表面化学的数学描述符时，例如，`ToF-SIMS`\
  \ 的离子峰对于生成表面化学与生物响应之间的定量关系也非常有用。最近，我们和其他人员采用了更复杂的生物信息学和机器学习方法来分析这些数据集，并证明通过这种方式可以获得更多信息。例如，最近的一项研究发现，自组织映射（`SOMs`，一种用于复杂数据非线性聚类的特殊神经网络形式）在提取来自聚合物\
  \ `ToF-SIMS` 实验数据中的信息方面，比常用的主成分分析（`PCA`）更有效。[图 9.6] 显示了 `SOMs` 如何区分化学结构非常相似的尼龙样品，这是\
  \ `PCA` 无法实现的任务。非线性神经网络聚类方法比传统方法能更好地检测少量材料（如抗体），还能区分具有高度化学相似性的材料。\n\n![image](img/bk9781788017893-00206-f6.jpg)\n\
  \n图 9.6 使用自组织映射（`SOMs`）区分化学结构非常相似的尼龙样品。针对正离子 `ToF-SIMS` 数据计算了 10×10 的监督式 Kohonen\
  \ 网络（`SKN`）。使用伪彩色根据样品组来明示网络上的样品位置——请参阅该图的在线版本：（红色、Nylon-6；绿色、Nylon-11；海军蓝、Nylon-12；青色、Nylon-6(3)T；粉色、Nylon-6/6；黄色、Nylon-6/9\
  \ 以及深绿色、Nylon-6/12）。该机器学习模型的类别分配准确率为 98%。经美国化学学会许可转载自文献 [34]，版权所有 2018。\n\n我们和其他人员还证明了使用现代稀疏特征选择方法从模型中移除不驱动生物响应的化学特征的重要性。这些方法使用多种数学方法移除任何与生物响应相关性较低的特征（设置为零）；最广泛使用的是\
  \ `LASSO` 回归以及使用期望算法和稀疏贝叶斯先验的多元线性回归。这使得模型更具解释性，并提高了它们的预测能力，因为最优稀疏模型对新数据的泛化能力最好。这些方法在识别基因表达数据中的少数基因方面非常有效。微阵上的数万个基因可以根据上下文的方式减少为少数相关的基因。例如，Autefage\
  \ 及其同事使用了实验基因表达数据，实验中通过植入生物材料释放的锶驱动间充质干细胞向成骨途径发育。这些植入物证明能减缓骨钙流失，减少骨折和骨质疏松。随后使用稀疏特征选择识别出少数相关的脂肪酸和类固醇合成基因对成骨很重要。随后使用\
  \ `qPCR`、脂质筏和基因表达测量对这些预测进行实验测试，验证了这些未知途径的重要性。在另一项研究中，通过多种化学和物理方法使干细胞发生对称或非对称分裂。在对称分裂中，它们分裂为两个干细胞；而在非对称分裂中，它们分裂为一个干细胞和一个祖细胞。这种分裂过程是干细胞生物学中长期未解释的问题。随后对基因表达微阵列谱的分析鉴定出了\
  \ 5 个干细胞分裂对称性的潜在标记物。使用荧光抗体对这些基因产物的实验验证表明，这些基因确实是分裂对称性的标记物（见 [图 9.7]）。这些标记物中的现在已商业出售。\n\
  \n![image](img/bk9781788017893-00206-f7.jpg)\n\n图 9.7 使用荧光抗体对这些基因产物的实验验证表明，这些基因确实是分裂对称性的标记物。顶部行显示了\
  \ `DAPI` 染色标记的细胞核位置，下方面板显示了标记 `H2A.Z`，它在非对称分裂发生时仅识别两个细胞中的一个（右下角两个面板），在对称分裂发生时识别两个细胞（左下角两个面板）。\n\
  \n\n\n\n细胞治疗（将治疗细胞植入体内）是重要的医疗干预手段，例如用于白血病的骨髓移植（目前）和用于糖尿病的胰岛细胞（未来）。这些治疗成功的关键在于人工生物反应器中培养大量的细胞。材料科学和机器学习方法发挥着日益重要的作用。例如，机器学习方法成功模拟了生物反应器参数（如初始细胞类型和种子密度、细胞因子浓度、反应器类型、培养基等）与后续细胞倍增次数（初始种子浓度增加的倍数）之间的关系。Winkler\
  \ 和 Burden 的这项研究通过 `MLR` 和 `稀疏贝叶斯神经网络方法`，成功且定量地对来自 300 多次生物反应器实验的数据进行建模，模拟了细胞总数以及属于血液分化途径的\
  \ 5 种干细胞或祖细胞类型的增加。除了预测每种细胞类型两倍范围内（有核细胞为三倍）之外，他们的稀疏特征选择方法还识别了驱动每种细胞扩张最重要的化学因素和生物反应器参数，这对于控制生物反应器产生特定类型的细胞非常有用。\n\
  \n## 9.7 机器学习与进化算法\n\n尽管 `ML` 吸引了大部分注意力，但正如我们在引言中所述，估计有 `10¹⁰⁰` 种可能获得的材料，这意味着即使是对高通量实验和\
  \ `ML` 建模能力的最乐观预测也表明，这些方法在没有帮助的情况下，无法探索这一有效无限空间中超过百万分之一的部分。进化算法（`EA`）是探索极大搜索空间的最有效方法之一。因此，采用进化方法来更好地探索材料空间，以发现完全的新材料并优化已发现的材料是符合逻辑的。关于使用进化方法“进化”材料（主要是催化剂和荧光体）的研究有限，因为这些代表了“触手可得的果实”，更容易表示为材料“基因”。进化方法在生物活性化合物和材料发现中的应用才刚刚出现，进展已在最近的综述中总结。\n\
  \n白光 LED 使节能照明成为可能，降低降低温室气体排放。这些设备依赖于荧光体，这些材料通常由稀土氧化物高温烧结而成。荧光体对于演示材料“基因”如何产生以及*计算机模拟*达尔文进化的基本操作非常有用。荧光体可以简单地通过“基因”来表示，例如一个包含每个稀土氧化物成分相对摩尔数的向量。烧结后，测量荧光体的亮颜色（相当于达尔文进化中的物种适应度），并“育种”最好的荧光体以产生具有更高适应度的新荧光体群体。变异操作如精英策略（将最好的荧光体原样传递给下一代）、改变一种稀土的浓度（点突变）以及分裂两个荧光体的基因并将部分组合成新的基因（交叉算子），被应用于给定周期内适应度最高的材料。这种进化循环迭代若干次，直到达到指定的性能水平或算法无法生成改进的示例。通过这种方式，Sharma\
  \ 及其同事通过进化稳定地提高了金属氧化物七维库（`MnO–Na[2]O–Li[2]O–MgO–ZnO–CaO–GeO[2]`）的适应度（亮度和颜色），找到了一种用于背光液晶显示器应用的前景绿色荧光体（见\
  \ `图 9.8`）。他们仅合成了几百种荧光体，但探索了更大的荧光体成分空间以寻找局部最优材料。\n\n```\n![image](img/bk9781788017893-00206-f8.jpg)\n\
  ```\n\n图 9.8 通过围绕该进化循环迭代五次，Sharma 等人提高了荧光体的适应度（亮度和绿色）。上图和下图为重复实验。经 John Wiley and\
  \ Sons 许可，转录自文献 45，版权 © 2009 WILEY-VCH Verlag GmbH & Co.KgaA, Weinheim。\n\n因此，材料科学家在\
  \ `ML` 之后采用的下一种颠覆性技术很可能是遗传技术。这可能会通过两种方式实现：使用高通量实验结合 `EAs` 更高效地搜索材料空间，以及使用 `ML` 和\
  \ `EA` 的协同组合进行更有效的搜索。后者涉及从连续初始轮高通量实验的实验数据构建适应度景观的 `ML` 模型，并在搜索后期使用这些模型来替代实验。已经证明，这种“自适应”进化（生物学鲍尔效应的计算机等价物）允许系统比不使用它的系统进化得更快。\n\
  \n\n\n\n进化方法也首次使得自主发现方法成为可能，即无需“人类参与”的全自动发明机器。广义而言之，这种机器将由一个通用合成机器人、一套用于质量控制和测量特定适应度的自动化表征仪器、一个可以从分子或材料初始种群中筛选最优成员并将其突变为新种群的进化程序，以及一种向机器人合成器指定待合成新分子的方法组成。多个小组正在开发自主化学家和自主材料科学家。其中一些专注于有机合成的自动化，另一些则专注于材料发现。位于波茨坦的马克斯·普朗克胶体与界面研究所正致力于通用有机合成机的主要工作，这是自主有机化学家的前提条件。美国国防高级研究计划局（DARPA）资助了多项国际计划，以帮助消除自主合成系统的障碍。研究团队正在寻求自动化的硬件和软件解决方案。麻省理工学院（MIT）正使用预载盒盒来自动化加热、混合和分离化学品等合成步骤。他们利用\
  \ Reaxys 数据库和美国专利和商标局的数百万反应训练了一个机器学习模型。该机器学习模型学会了应用逆逆合成变换、识别相关的反应条件并估计反应可行性。它被教如何从特定的已知化学反应泛化到新的底物。格拉斯哥大学由\
  \ Lee Cronin 教授领导的团队开发了`Chemputer`，这是一个模块化的桌面级机器人合成器，它可以将基于文本的合成指令编译为机器指令，以驱动每台成本\
  \ 25,000–30,000 英镑（33,000–39,500 美元）的合成机器人。这种方法成功合成了通用常见药物，速度比传统手动合成方法快数量级。他的在线平台`Chemify`允许化学家下载\
  \ Chemputer 的组装指令。\n\n## 9.8 未来展望\n\n机器学习（ML）正处于著名的热度周期的至少第二个阶段。关于机器学习能力的描述往往被夸大，但很明显，在科学、技术、医学、制造和商业等广泛领域，也有许多取得卓越成果的案例。机器学习是一种颠覆性技术，将在未来几十年内改变我们所知的世界。它潜力消除化学和材料研究人员许多枯燥、重复且有时危险的工作，让他们释放出来从事更具创造性的活动。未来发展的主要障碍是：\n\
  \n*   用数学方法描述复杂材料以训练机器学习方法的能力；\n*   训练深度学习模型的数据匮乏；\n*   更好地理解如何减少从示例学习的机器学习模型中的偏差；\n\
  *   开发化学合成语言，能够完全指定反应以提高可重复性，并允许通过合成信息对机器人进行编程；\n*   开发具有广泛适用性的合成机（*例如*，通过将分子或材料合成分解为有限数量的单元操作）；\n\
  *   以及自动化、机器学习与进化之间的优化协同。\n\n机器学习和人工智能（AI）还将给劳动力产生深远影响，即使是会计、法律和医学某些方面等智力工作也将受到影响。正如预测的，人工智能、机器学习、机器人技术和进化方法的结合可能会释放科学研究的新方式，加速我们对材料属性、其与生物的相互作用以及具有高度新颖且实用属性的新分子的发现。除了机器人帮助设计和合成新分子和材料外，我们可能还会看到材料与机器人形态和控制器协同进化，从而产生新的功能性机器人，这是技术领域又一个精妙的“闭环”。\n\
