  \ NAMD 的情况下，重点是神经网络。锥形交汇处 NACs 的奇异性导致的数值困难，导致人们转向其他关注绝热势对角化的方法^(48,54–57)。\n\n在\
  \ NAMD 的情况下，重点是神经网络。锥形交汇处 NACs 的奇异性导致的数值困难，导致人们转向其他关注绝热势对角化的方法^(48,54–57)。\n\n####\
  \ 4.2.1.1 线性模型 (LR)\n\n监督学习以及广义回归的核心目标是拟合一个函数，以找到输入（*即*分子几何构型）与其相应输出之间尽可能可能的关系。在最简单的情况下，这种关系可以用线性函数近似：\n\
  \n```\nY = wX + b\n```\n\n其中 `Y` 是输出性质，`X` 是待拟合的数据，`w` 是系数，`b` 是常数偏置。`scikit-learn`\
  \ 中实现的线性模型使用了普通最小二法回归。为了拟合势面，使用了一个包含 `X` 以及相应 `Y` 的训练集。学习过程基于寻找参数 `w` 和 `b`，使得模型预测的性质\
  \ `Y(p)` 与给定输入下的原始值 `Y` 之间的误差最小。\n\n\n\n\n因此，产生的问题是一个最小化问题，可以通过沿该函数对权重的梯度来求解。\n\n\
  ### 4.2.1.2. 岭岭回归 (KRR)\n\n核岭回归（KRR）是基于岭回归（Ridge Regression）而非线性回归（LR），结合核技巧得出的。岭回归在损失函数中添加了惩罚项，根据以下公式进行最小化：\n\
  \n![image](img/bk9781788017893-00076-t3.jpg)(4.4)\n\n`λ` 是正则化因子，也称为 L2 惩罚，它被添加到权重中并用于控制过拟合。(78)\
  \ 由于由量子化学组成的训练集噪声在计算收敛时被认为很小，在这些情况下 `λ` 也非常小。(82) 核技巧用于将输入与输出之间没有线性关系的训练集映射到高维空间，在该空间中它是线性可分的的。这导致了非线性模型，其非线性由所使用的核\
  \ `K` 的类型决定。(78) 在大多数情况下，会选择高斯核或拉普拉斯核，并以训练集中的每个化合物（分子）`X[i]` 为中心。属性的预测值 `Y(p)` 然后使用公式\
  \ (4.5) 进行计算。回归系数再次根据公式 (4.6) *通过* 线性回归找到。\n\n![image](img/bk9781788017893-00076-t4.jpg)(4.5)\n\
  \n![image](img/eqn4-6.jpg)(4.6)\n\n对于 KRR，使用了 QML 工具包⁸³ 结合 FCHL 表示⁸²，依赖于高斯核函数并将梯度视为能量导数。注意，已经存在一个新版本的\
  \ FCHL 表示法⁸⁴，它允许进行更高效的计算。KRR 通常是量子化学机器学习问题的首选方法。该方法的优点是它可以拟合非线性数据集，同时仍然具有简单和易于使用的优点。(82)\n\
  \n### 4.2.1.3 支持向量回归 (SVR)\n\n支持向量机既可以用于分类，也可以用于回归问题。在这里，重点是后者，也称为支持向量回归（SVR）。与\
  \ KRR 类似，SVR 利用了核技巧。输入数据映射到高维特征空间，在该空间中可以构建线性模型。然而，使用的不是最小损失函数，而是 `ϵ`-不敏感损失函数 `L[ϵ]`，其中\
  \ `ϵ` 是容差裕度：(85)\n\n![image](img/bk9781788017893-00076-t5.jpg)(4.7)\n\n`ϵ`-不敏感区域（其中\
  \ `L[ϵ]=0`）通常被称为 `ϵ-管`（ϵ-tube），优化过程是基于找到包含大多数训练点内部的管道。支持向量代表位于该管道之外的实例，它们在训练过程中具有最大的影响。(86)\
  \ 因此，损失函数仅受预测误差大于 `±ϵ` 的数据点影响。(87) 待最小化的函数是一个正则化的误差函数：\n\n![image](img/bk9781788017893-00076-t6.jpg)(4.8)\n\
  \n其中 `C` 是写在误差项前面的正则化参数。(88)\n\n放置在每个训练点上的常见核类型或基函数是：线性核、径向基函数和多项式。对于这里给出的结果，使用了\
  \ scikit-learn 中实现的径向基函数。(79) SVR 的优点是具有良好的泛化能力，同时实现了高预测准确性。然而，与之前依赖于以训练化合物为中心的基函数的模型一样，模型的深度直接取决于训练集的大小。(86)\n\
  \n### 4.2.1.4 神经网络 (NNs)\n\n与 LR、KRR 和 SVR 不同，神经网络（NNs）的基本概念源于人脑。如图 4.1 所示，神经网络由若干层组成，包括一个包含输入\
  \ `X` 的输入层、若干个由有限数量节点组成的隐藏层，以及一个给出属性 `Y` 的输出层。与大脑中的神经元类似，隐藏层中的 `i` 和 `k` 通过权重 `w`\
  \ 连接。偏置值 `b(j)` 用于通过允许基函数发生位移来实现更大的灵活性。在最后一步，通过线性基函数获取所需的属性。因此，如果没有定义隐藏层，则机器学习神经网络等同于简单形式的线性回归。(88,89)\
  \ 由于隐藏层数和每个隐藏层的节点数定义了网络的深度，模型的复杂性和深度与训练集无关。\n\n为了找到 `X` 和 `Y` 之间最好的关系，要最小化的损失函数是预测值与参考值之间的误差和，如公式\
  \ (4.3 所示。存在多种算法，例如自适应动量估计(90)。为了防止模型过拟合，可以使用不同的技术，例如引入 L1 和 L2 正则化、丢弃（dropout）或早停机制(91)。后者可以通过将整个数据集分为训练集和验证集来实现，这意味着在每个\
  \ epoch 后，当权重更新时，验证集上的误差会被计算并记录。一旦该误差增加，假设模型过拟合并需要停止。(89) `ϵ`-不敏感区域（(92)\n\n\n\n\
  \n与 LR、KRR 和 SVR 相比，神经网络（NNs）包含了更多需要优化的超参数，以实现成功训练并拟合权重以准确预测所需的性质。因此，不仅像 KRR 和 SVR\
  \ 那样需要优化基函数的类型、其宽度和正则化项，还需要优化每层的节点数、层数以及其他若干个超参数。搜索超参数空间的一种常用方法是通过随机网格搜索。^(93)。对于某些实现和更多细节，请参阅参考文献\
  \ 9 或 50。此外，通过减去平均值并除以标准差来对训练集的输入和输出进行缩放是有益的。我们在神经网络中使用了这种缩放方法。\n\n如前所述，神经网络的深度并不取决于数据点的数量，任何规模的训练集都可以构建深层神经网络。出于实际考虑和内存高效计算，因此将训练集划分为所谓的微批次（mini\
  \ batches）是有利的。批次大小取决于问题，无法对其最优值给出经验法则。因此，一个批次是训练集的一个子集，通过梯度下降提供用于优化权的组合梯度。每当使用一个批次进行训练时，权重参数就会更新。遍历完整个训练集后，一个\
  \ epoch（ epoch）即完成；出于实际考虑，建议使用早停机制以防止过拟合。^(93)。在一个 epoch 之后，可以调整权重，还可以调整学习率，学习率定义了每个\
  \ epoch 之后权重的变化幅度，是最关键的超参数之一。较大的初始学习率可以防止神经网络模型陷入局部最优。它可以在优化过程中减小。隐藏层数和每个隐藏层的节点数决定了神经网络的深度。通常，在隐藏层数和每层节点数达到一定数量之前，神经网络变得越来越精确，但在准确性和计算成本方面会收敛于最优值。此外，还需要相应地选择和搜索\
  \ L1 和 L2 正则化率。\n\n由于这种更复杂的架构，神经网络在实践中的应用比 LR、KRR 和 SVR 更困难。然而，神经网络更灵活，可以拟合更复杂的数据。将分子输入与多维输出联系起来也是非常直接的。详细而言，一个模型可以一步预测每个能量状态的值以及相应的梯度。在这种情况下，如果将力\
  \ `F` 包含在损失函数 `L` 中，训练将会改进。还需要添加另一个控制力对损失函数影响的超参数 `η`，如 eqn (4.10) 所示。\n\n![image](img/bk9781788017893-00076-t9.jpg)(4.10)\n\
  \n这种情况对于 NAC（非绝原子耦合矩阵）同样适用，可以构建一个模型来将输入匹配到相同自旋多重态不同状态之间的所有 NAC 向量。因此，相应的模型是能量和梯度的多状态模型，以及\
  \ NAC 的多值模型。根据定义，LR、KRR 和 SVR 是单状态模型。为了使多状态预测成为可能，必须对能量状态进行显式编码，*即*必须为该状态定义一个单独的内核以便一个模型预测所有状态的能量。\n\
  \n为了在动力学中实现能量守恒，力应被视为能量的导数。对于 KRR，可以通过结合高斯内核使用 FCHL 表示(34,84)，将在后续解释\n\n### 4.2.1.6\
