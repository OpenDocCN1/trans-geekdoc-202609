  \ 与血浆结合的百分比。 | 小鼠、鼠和人类血浆。 |\n| *t[1/2] (h)*_Lvm | ≥0.6 | 肝微粒体浓度降低到一半的时间。 | 大鼠和人类的肝微粒体。\
