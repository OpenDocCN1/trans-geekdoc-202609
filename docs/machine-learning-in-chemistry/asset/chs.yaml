  \ 2019 年 9 月。\n\n# 第 3 章\n\n## 药物化学信息学：药物发现中的机器学习简介\n\nMATTHEW G. ROBERTS 和 RAE\
  \ LAWRENCE\n\n英国癌症研究中心 – 曼彻学院，药物发现单元，Alderley Park, Macclesfield SK10 4TG, UK\n\n\
  *邮箱：Rae.Lawrence@cruk.manchester.ac.uk\n\n## 3.1 引言\n\n在深入研究机器学习的奥秘之前，有必要明确指出，任何对计算结果的讨论都应该先以“模型表明……”和“模型是谎言，但它们很有用”这样的陈述开头。在生成模型时，我们是在产生想法——大量的想法。我们充分意识到，这些想法中大多数并不高明；但在平庸想法的泥沙中，蕴含着可以淘出的金子。而残酷的现实是，为了确定一个想法是金子还是泥沙，我们需要礼貌地请我们的湿化学同事进入实验室进行真实的工作。有了这些新出生的真实实验结果，我们的模型就可以进行迭代改进和进化，从而开始接近真理。\n\
  \n### 3.1.1 人工智能与机器学习\n\n近年来，跨多个研究领域（从营销、经济学到药物发现）的一个普遍主题是人工智能和机器学习。目前对于这些术语的含义，以及它们之间如何相互关联和区别，还没有一个清晰的界限。\n\
  \n### 人工智能\n\n在最基本的术语中，人工智能（AI）指的是被编程的机器/计算机，使其能够执行人类目前可以做但做得更好的事情；此外，AI 算法还可以学习人类仅凭大脑无法完成的任务——例如，从噪声中分离信号。结合\
  \ AI 的系统使用海量数据，其目标是利用数据知识和之前的决策使算法能够像人类一样，使用复杂的问题解决技能成功解决新问题。这种方法的一个很好的例子是使用 AI\
  \ 算法让计算机击败国际象棋大师——或者最近，Google 的 DeepMind 应用 AI 技术来解决蛋白质折叠等问题、分析诊断成像结果或对战 Alpha Go。\n\
  \n对于与药物化学相关的例子，让我们考虑让系统整合并学习每一个报道的化学反应，并要求算法为新化学实体设计高效的合成路线（高产率）。这在今天可以做到吗？事实证明在某种程度上是可以实现的。\n\
  \nAI 是否可以汇总所有的蛋白质、配体、活性、选择性、物理化学性质、文献信息等，并建议临床候选药物？这是一个价值百万美元的问题。该领域有许多专门的公司，包括\
  \ BenevolentAI、GTN Ltd. 和 Exscientia，它们都已取得初步的技术成功，并获得了投资者的资金和制药行业的合作，以继续努力完善它们的\
  \ AI 方法，以加速开发周期、减少支出并产生有效的药物。\n\n截至本文写作时，AI 方法尚未常规化、付诸实践或作为“开箱即用”部署。然而，我们认为，目前高度定制的解决方案变得通用化并广泛可用只是时间问题。鉴于投入的时间和资金，预计成功会来得很快。\n\
  \n### 机器学习\n\n相比之下，机器学习（ML）是人工智能的一个分支，但其方法侧重于数据建模并能够提取知识。人工智能的工作方式非常相似；然而，现在许多人将\
  \ AI 视为深度学习方法的同义词，其中数据以不断增加的复杂层进行建模。\n\n在机器学习中，提取的知识会在（现实生活中）接受测试，结果被反馈回机器，并对模型进行完善。例如，可以挖掘数据以发现活性化合物具有特定的结构特征组合。当遇到具有相似特征组合的新化合物时，它可能会被标记为潜在活性，然后提交到设计-制造-测试-优化建模循环（见图\
  \ 3.1），该循环在迭代完善过程中将真实数据纳入模型中。\n\n\n图 3.1 “设计-制造-测试-优化”建模循环说明了通过机器学习进行建模如何与药物化学发现相关。\n\
  \n这种迭代的、循环的过程就是机器学习学习发生的方式。机器学习得比人类慢——它们需要更多示例，但一旦学会，它们预测结果的速度就更快。\n\n计算化学家们长期以来一直使用机器学习成功地对数据进行建模：Hansch\
  \ 在 1962 年的一篇奠基性论文将其称为 QSAR（定量结构-活性关系），其中通过多元回归将植物生长调节与 Hammett 参数和疏水性联系起来。Hansch\
  \ 在《化学信息与建模杂志》上发表的一篇庆祝其生平和贡献的重新出版版文章中，描述了 QSAR 的意外诞生。不久后，Free-Wilson 分析被发表，该方法今天仍在使用（当然，经过了改进）。\n\
  \n你可能刚刚意识到，你已经熟悉了药物化学中的一些机器学习方法了！\n\n### 3.1.2 监督学习与无监督学习\n\n采用“监督学习”的机器学习方法处理的是包含观测值（例如活性或活性）的数据，并将一组特征（描述符、指纹）与观测值联系起来。监督学习方法使用特征集生成预测，这些预测可以被测量并反馈回机器以进一步训练模型。\n\
  \n无监督学习方法不进行预测，而是探索一组数据特征之间的关系。例如，我们可以根据 3D 指纹对分子集合进行聚类；然而，这对于它们对任何靶点的活性没有任何预测。这种方法告诉我们的仅仅是，分子与同一簇成员之间有多相似，或者它们与其他簇有多大差异。\n\
  \n## 3.2 预知胜券\n\n在开始数据挖掘和构建机器学习模型的冒险时，有几个常见的陷阱和局限性需要考虑，将在本节中简要讨论。\n\n### 3.2.1 数据集的组装与策划\n\
  \n随着大数据的可用，组装大型信息变得比以往任何时候都容易。仅 PubChem 就就有接近 960 万个化合物，跨越 100 万项生物实验，并在超过 7 万个靶点上拥有超过\
  \ 2.5 亿个生物活性。ChEMBL 包含接近 200 万条小分子记录。尽管这两个小组都努力策划并确保存档数据正确，但错误是不可避免的。\n\n\n\n\n\
  假设结构或活性中的偶发错误漏掉了，它们也可能被数据集中的噪声所吸收。在构建具有效能信息的结构数据集时，更重要的可能是确保数据来自一致的实验（测定），这样比较才有价值。\n\
  \n需要记住的关键点是，对于任何模型，无论是 `AI`、`ML` 还是其他模型，如果输入的是垃圾，输出的也是垃圾（`GIGO`: Garbage In, Garbage\
  \ Out）。\n\n### 3.2.2 模型建立\n\n将化学结构与活性联系起来的第一步是找到一组描述结构的最佳特征集——描述符（descriptors）或指纹（fingerprints）。我们有能力生成数千个描述符，其范围从简单的拓扑原子计数和组合、键键计数、物理化学性质（测量或计算）、分子体积，到基于分子图理论和\
  \ 3D 构象的更复杂描述符。虽然这些`numerical features`在这里不会详细介绍，但先的一项研究对描述符和指纹有极佳的综述。\n\n如果我们尝试使用`all`可用描述符为数据集构建回归模型，那么模型对训练集的预测可能非常好，但对测试集的预测会极其糟糕。在这种情况下，过拟合的模型已经记住了训练集的信息，无法将其推广到新问题上；模型捕捉的是随机误差而非真实关系。\n\
  \n为了避免过拟合，我们应该目标使用尽可能少的描述符来捕捉分子结构属性特征与其活性之间的关系，并避免对训练数据中的噪声进行建模。这些描述符在广泛的化学空间内应该是有效的，并且应该表现出极小的简并性，这意味着即使差异微小，描述符计算也应该为结构不同的分子生成不同的值。此外，一种良好的做法是确保模型中使用的描述符尽可能正交，即从个体上来说，它们定义了其他描述符未涵盖的特征。\n\
  \n为了选择合适的描述符集，可以使用如`Principal Component Analysis`等降维技术。\n\n### 3.2.3 主成分分析\n\n在药物化学信息学中，常见的降维方法是`Principal\
  \ Component Analysis`。`PCA` 是关于减少描述数据的描述符数量的。`Descriptors` 之所以加上引号，是因为在涉及 `PCA`\
  \ 时，具有化学意义的描述符不再存在了，因为 `PCA` 将相关的描述符合并成成分（因此得名），且每个成分与其他所有成分都正交（不相关）。这些成分随后被用于解释数据集中的方差，并进行排序，使得第一主成分解释最多的方差，第二主成分解释第二多的方差，依此类推。显示每个成分解释的方差量（以百分比表示）的图被称为`scree\
  \ plots`（碎图）。\n\n\n图 3.2 在虚拟数据的碎图中，第一主成分解释了 50% 的方差，第二解释了 30%，第三解释了 10%。\n\n那么根据碎图，你会为模型使用多少成分？曲线从第\
  \ 4 个成分开始变得平坦。这种平坦现象被称为 `PCA` “肘部”，可以作为使用成分数量的截断点。一个通经验规则是选择解释约 80% 方差的成分数量。\n\n\
  ### 3.2.4 当机器在 3D 中学习时，对齐就是一切\n\n2D 描述符已成功用于活性建模。然而，化学和生命发生在 3D 空间中；特征如何映射到分子的生物活性构象通常在\
  \ 3D 中更有趣。\n\n在转化为 3D 模型时，我们需要理解分子在它们的 3D 构象中是如何相互相关的。在三维中对齐分子有多种方法，从`shape only`\
  \ 到`shape+pharmacophore`，再到`shape+electrostatics`，所有这些方法都可能由于不同严格程度的子结构匹配而产生偏差。这些方法都有其价值，但在生成任何模型之前的任何对齐`prior`，关键任务是对对齐进行检查并根据需要进行调整，以确保其合理且一致。\n\
  \n人们总是会倾向于先生成模型，然后查看离群值并根据需要调整对齐，以生成统计数据更好的模型。\n\n**千万不要这样做！**\n\n这会向模型中引入偏差，虽然修改后的模型在模型统计数据上可能有巨大的改进，但该模型实际上是可靠的胡说。最佳实践是花时间查看你的数据集并挖掘出不属于其中的化合物，**然后**计算模型。\n\
  \n### 3.2.5 QSAR 建模的活性范围和活性分布\n\n根据经验，活性范围最好至少有 2–3 个 log 单位，且数据点在整个活性范围内呈均匀分布。活性范围内某一个区间的数据点过多或过少都对模型是有害的。\n\
  \n所有这些警告都可以总结为 GIGO。\n\n遗憾的是，实际上（频率比我们愿意承认的要高），你可能有一组非常干净的数据集、完美的活性范围、描述符和对齐，但你无法提取出一个将活性与结构联系起来的预测模型。幸运的是，该领域的大多数软件公司已通过提供探索数据的工具解决了这个问题。\n\
  \n### 3.2.6 离群值\n\n在`via` 预测活性 `vs.` 实际活性进行模型检查时，偶尔会有数据点严重远离回归线或远离数据的其他部分。我们如何处理它们取决于离群值的性质。\n\
  \n有时，在汇集数据时——特别是从公开来源获取——我们必须考虑报告的活性（甚至是结构！）是否准确，或者该化合物是否具有替代的作用机制。当使用不同的测定时，报告的活性往往存在差异。如果我们不确定数据是否准确、作用机制是否与数据集中的其他成员一致，或者不同测定类型之间的归一化是否充分，删除该数据点是完全可以的，下文所示。\n\
  \n如果离群值不影响模型或任何从模型推导出的假设，可以将其删除并附上注释说明做法。例如，你可能有一个主要跨越某个活性范围的数据集，但有两个点的活性与其他数据部分很远，尽管模型的线性度得到了保留。如果删除该点后回归方程没有发生显著变化，则可以这样做，并附上注释。\n\
  \n\n\n\n\n图 3.3 一组数据点（o）和一个离离群值（`x`）。不包含离群值的回归线为实线，包含离群值的回归线为虚线。离群值的包含（或排除）并不会从实质上显著改变回归线，因此，通过解释性脚注排除该离群值是可以接受的。\n\
  \n通常情况下，移除离群值会导致回归结果发生变化（参见图 3.4），以及相关假设的改变。你可以分别在包含和不包含该数据点的情况下运行分析——如果你选择舍弃离群值，你应该说明哪些点被删除了、原因是什么，以及模型是如何调整的。\n\
  \n\n图 3.4 一组数据点（o）和一个位于极右上角的单个离群值（x）。不包含离群值的回归线为实线，包含离群值的回归线为虚线。在这种情况下，离群值的包含（或排除）改变了回归线的斜率和截距，因此，可以通过脚注排除离群值，并详细说明模型是如何变化的以及排除离群值的原因。\n\
  \n在其他情况下，数据集可能表明该离群值定义了这种关系，如果没有那个离群点，数据将是完全随机的！在这种情况下，应该舍弃离群值，且不应报告该模型具有任何显著性或置信度。\n\
  \n如果你不习惯于舍弃离群值，有时对变量应用平方根或对数等转换可能会产生更合理的模型。或者，你可能考虑到你正在尝试建模的关系是非线性的——这正是机器学习可以大显身手的地方。*但无论任何情况下，理解你的数据、其来源以及观测值与描述符之间可能存在的关系至关重要。*\n\
  \n## 3.3 深度学习与神经网络\n\n近年来，药物发现文献中关于“深度学习”和“神经网络”的在经历了多年的沉寂后再次兴起。深度学习是机器学习的一个分支，它结合了人工神经网络。简单来说，数据是以层进行建模的，每一层的复杂度都不断增加。这种方法的传统应用是语音识别和自然语言处理，但此后它已被应用于许多其他领域。\n\
  \n这些方法超出了本章的范围，但我们建议阅读关于默克分子活性挑战赛的报道^(16)，比赛中受邀参赛者被要求使用结构的数值描述符识别预测生物活性（靶向和离靶）的最佳方法。来自多伦多大学的一个计算机科学小组通过调用多任务深度神经网络赢得了挑战。^(17)\n\
  \n## 3.4 底层数学基础\n\n### 3.4.1 “观测值”与“特征”\n\n在探索药物化学信息学（我们称之为“MedChemInformatics”）中常用的常用机器学习方法之前，我们必须首先考虑哪些特征（变量）应该与观测值建立相关性。\n\
  \n例如，如果我们考虑沸点与烷基链中碳原子数量之间的简单关系，根据有机化学的常识，我们知道较小的烷烃沸点较低，但当引入官能团时，关系会变得更加复杂，因为额外的分子特征（*例如*，极性）参与了分子间的结合，而非逃逸到气态。\n\
  \n一篇旧文章^(18) 详细描述了沸点如何*通过*线性关系与分子特征（通过经验得出）相关：\n\n\n#### 3.4.1.1 分子描述符与指纹\n\n在药物化学信息学中，我们通常对将分子分类为高度相似或高度不同的方法感兴趣。原因有很多，包括但不限于虚拟筛选、识别序列以及建立知识产权位置。\n\
  \n为了评估相似性，我们需要决定哪些特征是重要的。例如，我们可以根据骨架（*例如*，Mur 骨架）将分子聚集在一起，或者相反，我们可以考虑属性（*例如*，类药性、渗透性）。\n\
  \n描述符在许多综述中已经介绍过^(19)，因此在这里仅简要讨论。描述符分为两种：基于实验测量的物理化学性质（*例如*，`logP`、双极矩），以及通过某种方式从结构计算出的。\n\
  \n建模中常用的理论描述符可以进一步分类：\n\n*   零维：这些是捕捉分子构的“计数”（*例如*，碳原子）。\n*   一维：这些捕捉片段和子结构特征（*例如*，指纹）。\n\
  *   二维：这些是源自二维结构的化学图不变性描述符，是捕捉原子连接性的拓扑指数（*例如*，维纳指数）。\n*   三维：这些与分子尺寸、位阻、表面和体积有关。例如，`VSA`（范德华表面积）与分子的部分电荷进行映射。存在三维指纹可以捕捉药团特征。\n\
  *   四维：这些源自三维定量结构活动关系方法，如比较分子场分析^(20) (CoMFA)。对于一组通过其优选（结合模式）三维构象对齐的分子，建立了场或体积采样点，并在空间中计算位阻值。\n\
  \n为了概念什么是指纹，让我们简单地将其视为一组“开启（1）”或“关闭（0）”的复选框，并使用图 3.5 所示图表来比较马和鳄鱼。\n\n\n图 3.5 每个指纹特征的开启/关闭复选框转换为预定义特征的位字符串。\n\
  \n\n\n\n分子指纹是长位字符串，通过查询分子的特征（原子类型、子结构、*等等*）来试图捕捉分子图（原子的 2D 连接性），在 3D 指纹的情况下，则是捕捉官能团之间的相对排列。描述符（Descriptors）和指纹（Fingerprints）在文献中已描述多年，并被广泛应用于商业和开源软件包中，这里这里不会详细讨论这些，但我们建议阅读相关论文以获取更多信息^(21*a*–*c*)\n\
  \n一旦计算出一组分子的描述符，我们就尝试将描述符的组合与可观测值（*例如*，活性）联系起来，以创建具有相似特征和相似活性的分子分组或聚类，或者寻找特征与可观测值之间的数学关系。阐明数学关系的方法将在后文中讨论。\n\
  \n\n为了确定两个分子是否根据其描述符以某种方式相关，我们必须能够确定它们在描述符空间中的相似性（或反之，它们之间的距离）。药物化学中最常用的方法是 Tanimoto\
  \ 相似性（Tanimoto Similarity）、Tversky 指数（Tversky Index）和 Dice 相似性（Dice Similarity）。这些值通常被归一化为\
  \ 0 到 1 之间的数字，其中 1 表示完全相似（100% 匹配）。\n\n### 3.4.2.1 Tanimoto 相似性\n\nTanimoto 相似性^(22)出现在\
  \ 20 世纪 50 年代的文献中，用于植物分类，之后被其他学科广泛采用。这是你最常见的相似性度量。\n\n在描述符空间中，Tanimoto 相似性（指数）公式为：\n\
  \n\n其中 `S[A,B]`=Tanimoto 相似性系数；`n`=特征数量；`j`=索引/计数变量；`x[jA]`=分子 `A` 的第 `j` 个特征；`x[jB]`=分子\
  \ `B` 的第 `j` 个特征。\n\n在指纹空间中，该表达式简化为：\n\n\n其中 `a`=分子 `A` 中“1”位的数量；`b`=分子 `B` 中“1”位的数量；`c`=`A`\
  \ 和 `B` 共“1”位的数量。\n\n如果我们回到马 (A) 和鳄鱼 (B) 的比较：\n\n| 马 || 1 || 1 || 0 || 1 || 1 ||\
  \ 0 || 1 |\n| --- | --- | --- | --- | --- | --- | --- | --- |\n| 鳄鱼 || 1 || 1 ||\
  \ 0 || 0 || 1 || 1 || 0 |\n\n`a` = 5；`b` = 3；`c` = 2\n\n\nTanimoto 指数（或得分）是药物化学信息学（MedChemformatics）中最常见的相似性度量之一。一个通用的规则是用\
  \ 0.85 作为相似分子的截断值^(5)；然而，多项研究表明，当使用不同的分子表示法时，该截断值不可靠的^(21c,23)\n\nTanimoto 虽然常用但也有局限性和缺点——例如，对于结构遥远的分子，经常返回\
  \ 0.3 的 Tanimoto 分数^(24)。如果我们回到马和鳄鱼的比较，对于 0.3 的 Tanimoto 分数，应当意识到这可能是方法产生的伪象。\n\n\
  ### 3.4.2.2 Tversky 相似性\n\n药物化学信息学中另一种常用的相似性度量是 Tversky 系数^(25)，公式为：\n\n\n- `Tvα,β`=Tversky\
  \ 系数；\n- `α,β`=非负权重因子；\n- `a`=分子 `A` 中“1”位的数量；\n- `b`=分子 `B` 中“1”位的数量；\n- `c`=`A`\
  \ 和 `B` 共“1”位的数量。\n\n`α` 相较于 `β` 的值越大，分子 `A` 特有特征的权重就越大，反之亦然。这允许在相似性指数或得分的计算中引入不对称性，并在与参考化合物\
  \ `A` 的比较中探索共同和独特的特征。\n\n当 `α` 和 `β` 设置为一时，Tversky 系数简化为 Tanimoto 相似性。当两个系数都等于 0.5\
  \ 时，Tversky 系数简化为 Dice 相似性。\n\n如果我们再次回到马和鳄鱼的比较，并决定马的重要性是鳄鱼的两倍（`α`=2；`β`=1）：\n\n\
  | 马 || 1 || 1 || 0 || 1 || 1 || 0 || 1 |\n| --- | --- | --- | --- | --- | --- |\
  \ --- | --- |\n| 鳄鱼 || 1 || 0 || 0 || 0 || 1 || 1 || 0 |\n\n\n相反，如果鳄鱼特征重要两倍，Tversky\
  \ 系数将变为 0.28——谢天下，仍然不相似。\n\n### 3.4.2.3 Dice 相似性\n\n化学中常见的第三种计算相似性的方法是 Dice 相似性^(26)Dice\
  \ 相似性最早出现在 20 世纪 40 年代的生态学研究中，现在常用于比较分子。\n\n\n- `Dc[A,B]`=Dice 相似性系数；\n- `n`=特征数量；\n\
  - `j`=索引/计数变量；\n- `x[jA]`=分子 `A` 的第 `j` 个特征；\n- `x[jB]`=分子 `B` 的第 `j` 个特征。\n\n最后一次回到马和鳄鱼的比较：\n\
  \n| 马 || 1 || 1 || 0 || 1 || 1 || 0 || 1 |\n| --- | --- | --- | --- | --- | ---\
  \ | --- | --- |\n| 鳄鱼 || 1 || 0 || 0 || 0 || 1 || 1 || 0 |\n\n\n到这里，你应该对相似性系数感到有些“消化不良”。使用相同的简单指纹，我们得到了三个不同的相似性得分。对于更复杂的分子指纹也是如此。\n\
  \n### 3.4.2.4 哪种相似性度量最有效？\n\n有一些观察结果——例如，Dice 和 Tversky 相似性值通常比 Tanimoto 高，且对称性较低；此外，无论\
  \ Tversky 使用什么参考权重，Tversky 和 Dice 的结果都很。但最终，计算出的相似性得分没有绝对意义——化合物的排名更有意义，^(22*d)所以对于一般用途来说，一个和另一个一样好。\n\
  \n### 3.4.3 模型质量与统计\n\n让我们回到预测模型。在生成模型时，我们使用所有可用数据，很少有人会抱怨数据太多！\n\n如果我们使用所有可用数据来构建模型，我们是将模型限制在一个只能对自身进行交叉验证的训练集中。然后将预测值与测量值进行比较。如果数据量很少，这是可以接受的，但这不是一种可靠的方法。这作为一个早期模型，可以输入设计-制造-测试-优化机器（图\
  \ 3.1），随着可用数据的增加，获得改进的（且具有统计相关性的）的模型。\n\n\n\n\n\n当计算模型时，会报告若干统计参数，这些参数与模型质量（其统计相关性以及模型对新数据的预测能力）有关。\n\
  \n值得注意的是，深度学习中常用 95%/5% 的划分，因为这些模型是使用海量数据构建的。从绝对数量上来说，即使是 5% 的测试集仍然包含**大量**数据点！\n\
  \n### 3.4.3.1 决定系数\n\n对于线性模型（假设数据是连续的），首先想到的第一个值是决定系数（`r`² 或 `R`²），它反映了数据与回归线的拟合优程度。`R`²\
  \ 始终处于 0 和 1 之间；`R`² 的值越高，说明模型对数据的拟合得越好。\n\n`R`² 可以表示为：\n\n\n*   `i`=样本数；\n*   `y[expt(i)]`=第\
  \ `i` 个样本的实验值/测量值；\n*   `y[calc(i)]`=第 `i` 个样本的计算值；\n*   `<y[expt]>`=平均实验值/测量值。\n\
  \n随着实验值与计算值之间的差异趋于零，`R`² 趋于 1，这表明训练集中计算值与观测值之间存在完美相关（模型捕捉了 100% 的方差）。\n\n第二个需要考虑的值是交叉验证决定系数，`Q`²\
  \ 或 `q`²。这与 `R`² 类似；然而，它结合了如果模型在省略一个（留一法 - LOO）或多个（留多法 - LMO）数据点的情况下构建，其预测结果如何。最简单的交叉验证方法“留一法”会每次排除一个样本，并使用比训练集少一个样本的训练集来构建模型，然后计算该变量。随后使用残差（实验值与计算值之间的差异）根据以下公式计算决定相关系数：\n\
  \n\n*   `i`=样本数；\n*   `y[expt(i)]`=第 `i` 个样本的实验值/测量值；\n*   `y[v(i)]`=来自内部验证（LOO\
  \ 模型）的第 `i` 个样本的计算值；\n*   `<y[expt]>`=平均实验值/测量值。\n\n交叉验证旨在评估模型的稳健性和预测能力。`Q`² 越高，模型的性能理应越好。根据经验，`Q`²>0.5\
  \ 且 `R`²>0.6 被认为是模型具有预测能力的证明，但情况并非总是如此。此外，`R`² 和 `Q`² 之间存在 0.2–0.3 的差异，表明可能存在过拟合现象。\n\
  \n`R`² 和 `Q`² 虽然是一个很好的起点，但在评估模型质量时，它们不是唯一的考虑因素。最好的方法是使用外部测试集来评估模型是否具有预测能力。\n\n###\
  \ 3.4.3.2 Kendall Tau 系数\n\n另一个值得考虑的统计参数是 Kendall Tau 系数（Kendall's Tau），它是一种等级相关性度量。计算时，它的值限制在\
  \ 0 到 1 之间，并提供了模型在多大程度上能够正确预测排序的估计，无论其在计算绝对准确的数值方面是否成功。\n\n### 3.4.4 过训练与良好描述符的特征\n\
  \n此前，当 `R`² 和 `Q`² 之间存在巨大差异时，使用了“过拟合”（过训练）一词。这通常在使用过多的描述符来构建模型时发生。当使用足够的描述符来拟合训练集时，模型捕捉了所有的噪声。换句话说，过训练的模型违背了奥卡姆剃刀原则：模型基本上记住了训练数据。\n\
  \n## 3.5 机器学习方法\n\n在本节中，我们将以药物发现为背景，讨论常用的机器学习方法。特征将被称为“描述符”，观测值将被称为“活性”。因此，我们有一组分子（训练/测试/验证集），计算一组捕捉特征的描述符，然后以某种方式将特征与活性联系起来。\n\
  \n### 3.5.1 K-近邻\n\n药物化学中最简单的机器学习算法是 K-近邻（`k`NN）；这种方法可用于分类和回归分析。`k`NN 方法的精髓可以通过这句谚语体现：“当你不清楚一个性格时，看看他的\
  \ `k` 个朋友。”\n\n\n简单的 `k`NN 工作流如图 3.6 所示。\n\n\n图 3.6 基于训练集预测查询活性的 KNN 工作流\n\n在使用\
  \ KNN 建模时，最重要的调整参数是近邻数（`k`）。`k` 值越高，模型预测受更多训练集的贡献，且对离群值更具韧性。这意味着方差较低，但偏差增加。相反，较低或更严格的\
  \ `k` 在描述符与活性之间的关系函数形式可能变化的情况下，提供了最灵活的拟合。较低的 `k` 值产生高方差但低偏差。\n\n***结语***\n\n\n\n\
  \n总结来说，`k`NN 是药物化学信息学家可能遇到的最简单的机器学习方法。尽管它是分类和预测的一种可靠方法（特别是当关系是局部的而非全局的时），但其应用受限于数据存储和计算开销。`k`NN\
  \ 模型已成功应用于药物发现。其中几个例子包括理解 QSAR 以及辅助设计新型强效抑制剂、器官毒性预测、hERG 活性预测以及蛋白质功能预测。关于 kNN 的更详细描述，请参阅文献\
  \ [33]。\n\n### 3.5.2 线性回归\n\n可能的最常见的机器学习方法是基于不同类型的线性回归。线性回归是一种数学尝试，试图通过用一条直线来拟合一组数据点，以将描述符（或一组描述符）与活性联系起来。我们经常在详细\
  \ 2D 和 3D QSAR 模型的文章中看到这种方法。\n\n回归建模基于假设描述符集与测定活性之间存在某种关系。一种方法是假设线性关系：这意味着每个描述符都以`常比例系数`对活性做出独立贡献。因此，预测的活性通过每个描述符的加权和来“解释”；权重的大小表示描述符对活性量级的重要性：\n\
  \n\n*   `P`[`i]`=第 `i` 次观测的预测响应；\n*   `n`=第 `n` 个描述符；\n*   `N`=描述符的最大数量；\n*   `F`[`i,n]`=第\
  \ `i` 次观测对于第 `n` 个描述符的值。\n\n线性回归分析/算法的目标是找到权重值 `w`[`n]`，以使预测活性 (`P`[`i]`）与实验观测活性\
  \ (`R`[`i]`）之间的误差最小化：min ∑`ε`[`i`],\n\n\n普通最小二乘法 (OLS) 和偏最小二乘法 (PLS) 是在不同条件下寻找权重的方法。可以使用或绝对不能使用什么，取决于观测值数量\
  \ (`i`）和不相关描述符的数量 (`n`）。如果需要，可以通过被称为特征选择和特征提取的方法来减少预测活性所需的描述符数量。\n\n特征选择是指选择并使用原始描述符的子集而不进行修改来预测活性的方法。常用的正则回归算法\
  \ Lasso（最小绝对收缩和选择算子）就是特征选择方法的一个示例。Lasso 使用 OLS 方法找到描述符的权重以使误差最小化。然而，Lasso 不仅试图最小化误差，还试图减少回归分析中使用的非零权重数量。这是通过为每个非零权重添加惩罚项来实现：\n\
  \n\n*   `c`=代价函数；\n*   `i`=第 `i` 次观测；\n*   `M`=观测数量；\n*   `R`[`i]`=第 `i` 次观测的响应值；\n\
  *   `j`=第 `i` 个描述符；\n*   `N`=描述符数量；\n*   `w`[`j]`=特征 `j` 的权重；\n*   `F`[`i, j]`=第\
  \ `i` 次观测对于第 `j` 个描述符的值；\n*   `γ`=惩罚系数。\n\n特征提取（如 PCA 中所做的）涉及从原始描述符集中创建新的组件。\n\n\
  ### 3.5.2.1 普通最小二乘法还是偏最小二乘法？\n\n考虑这些方程：\n\n\n如果我们只有方程 (a)，该方程有无限解：(`x`, `y`)=…;\
  \ (5, −1); (4, 0); (3, 1); … (0,4); (−1, 5); … 如果我们有 (a) 和 (b)，存在一个解：(`x`, `y`)=(2,\
  \ 2)。\n\n然而，有了 (a)、(b) 和 (c)，不存在一个满足所有三个方程的解，但存在一个产生最佳平均结果的解：(`x`, `y`) 提供了最佳平均结果。\n\
  \n**当观测数 > 描述符**\n\n只要且仅当观测值数量大于描述符数量时，可能可以使用 OLS 寻找权重。\n\n**当观测数 < 描述符**\n\n当描述符数量多于观测值时，OLS\
  \ 会失效，因为逆矩阵 (***X***^(**T**)***X***)^(−1) 绝对。主成分回归和 PLS 是可能克服这一障碍的两种方法。\n\n\n\n\n\
  虽然主成分回归（PCR）使用了 `OLS`，但它首先会进行特征提取。主成分分析（PCA）使用可以代表相关描述符组合的成分。PCA 在不考虑响应数据的情况下，寻找使描述符空间中方差最大化的成分。成分指的是根据其对应的特征值从大到小进行排序的特征向量。每个成分都是正交的，这意味着成分之间没有相关性。会选取若干个成分——第一个成分解释了最大的方差，第二个成分解释了次大的方差，依此类推。随后在确定了用于预测结果的多少个成分后，就可以使用\
  \ `OLS` 来为每个成分寻找权重（假设观测数量现在大于成分数量）。这种方法的缺点是，解释描述符数据中最大方差的成分并不一定是响应的最佳预测因子。\n\n偏最小二乘（PLS）通过最大化描述符与响应之间的`协方差`来解决这个问题。它通过创建一个协方差矩阵\
  \ `X^T Y` 来实现，其中 `X` 是由描述符数据组成的矩阵，`Y` 是响应数据。PLS 实际上涵盖了一类算法。它引入于 1966 年，在过去的 50 年里得到了改进和增强。一种常用的实现是\
  \ `NIPALS`（非线性迭代偏最小二乘）：`X[0]=X, Y[0]=Y`。\n\n\n初始权重 (`w`) 根据 `S` 的特征向量计算得出：\n\n\n\
  其中 `Eig[max]` 指对应最大特征值的特征向量。\n\n接下来计算更新矩阵 `X` 和 `Y` 所需变量：\n\n\n\n\n接下来，更新矩阵 `X`\
  \ 和 `Y` 并进行消去处理，使得新矩阵成为残差：\n\n\n此过程执行 `r` 次，其中 `r` 为矩阵 `X` 的 `rank`（秩）。`Rank` 指线性无关的行。如果\
  \ `w`、`t` 和 `p` 的所有值分别存储在 `W`、`T` 和 `P` 中，则权重 `B` 可以通过公式找到：\n\n\n其中：\n\n![image](img/eqn3-29.jpg)(3.29)\n\
  \n且 `Z^+` 表示伪逆，使得：\n\n![image](img/eqn3-30.jpg)(3.30)\n\n需要注意的是，PLS 可能会受到描述符缩放（scaling）的影响。描述符变化的变化幅度会影响协方差矩阵，从而改变特征向量，进而以非线性的方式改变权重；正如\
  \ Cramer 所述，这与普通最小二乘法相反，因为改变一个线性无关的描述符会导致权重按变化的倒数因子发生变化。\n\n比较主成分回归 (`PCR`) 和 `PLS`，`PCR`\
  \ 旨在在不考虑响应的情况下最大化描述符空间中的方差，最大描述符可能没有考虑到变异。另一方面，`PLS` 最大化描述符与响应之间的协方差。\n\n### 结语\n\
  \n当观测数量大于描述符数量时，线性回归通常不会出现过拟合问题。如果观测值多于描述符，`OLS` 通常可以良好工作。如果描述符更多，则可以实现 `PLS`。\n\
  \n### 决策树\n\n使用决策树方法对描述符与活动之间的关系进行建模更为复杂且强大。决策树包含了通过对描述符进行仔细排序来划分观测值的算法，主要用于分类分析。决策树根据其结果的可视方式命名。决策树始于单个节点（或`根节点`）。节点代表描述符。分支代表划分准则（决策），从该节点引出，要么足以分类所有符合该决策的观测值，要么引导另一个节点，从而产生另一个决策。不断创建划分，直到所有观测值被正确分类，或者达到树的特定深度。两种早期且流行的决策树算法是\
  \ `ID3` 和 `C4.5`。`ID3` 是一种仅处理分类数据的算法，而 `C4.5` 可以处理分类和连续数据——我们在这里讨论 `ID3`，但关于 `C4.5`\
  \ 的更多信息，请参考 Quinlan 的文章。要理解这些算法如何工作，必须知道什么是`信息`。\n\n#### 3.5.3.1 信息\n\n信息论认为，信息或（香农）熵是不确定性的度量。揭示一个低概率事件的结果通常比高概率事件具有更多信息。对于熵，其公式为：\n\
  \n![image](img/bk9781788017893-00037-t16.jpg)(3.31)\n\n- `H`=熵（信息论者使用 `H` 代替 `S`）；\n\
  - `P[i]`=事件 `i` 发生的概率。\n\n一个 100% 概率朝正面的硬币将产生熵（这也可以看作反面）：\n\n![image](img/bk9781788017893-00037-t17.jpg)(3.32)\n\
  \n具有 90% 概率朝正面的硬币具有略多熵，而公平硬币具有最大的熵（0.5）。值本身并不重要，因为可以使用 `log[2]`。重要的是不同事件的熵值排名。\n\
  \n观察熵的另一种方法是考虑需要多少有效的问题来揭示结果。让我们使用另一个硬币掷实验，这次是 8 次偏向反面的硬币掷。每次掷都可以进行查询；但考虑到硬币偏向反面，这并不有效。更有效的方法是将硬币掷分组，然后问：“这组中有正面吗？”由于硬币偏向反面，稀有事件（出现正面）发生的概率很低。因此，我们预计每个问题后会揭示\
  \ 50% 的剩余结果，并在 3 个问题后揭示所有的投掷结果。这说明了为什么公平硬币比偏硬币具有更多的熵——公平硬币的每次掷都需要查询。\n\n### 3.5.3.2\
  \ 算法\n\n`ID3` 算法使用熵来决定节点使用哪个描述符。首先，按如下公式计算响应的熵：\n\n![image](img/bk9781788017893-00037-t18.jpg)(3.33)\n\
  \n- `H`=熵；\n- `R`=响应；\n- `N`=唯一响应的数量；\n- `P(R[i])`=响应 `i` 的概率，或响应 `i` 与总观测数量之比，使得\
  \ ![inline](img/bk9781788017893-00037-t19.jpg)。\n\n接下来，计算使用描述符划分数据集所获得的信息：\n\n![image](img/bk9781788017893-00037-t20.jpg)(3.34)\n\
  \n- `I(F, H)`=在给定熵 `H` 下通过描述符 `F` 划分获得的信息；\n- `P(F[j])`=描述符 `F` 取值为 `j` 的概率；\n-\
  \ `N`=描述符中最大类别数量；\n- `H(R, F[j])`=描述符 `F` 取值为 `j` 时的响应熵。\n\n考虑在表 3.1 中所示的数据集：表 3.1\n\
