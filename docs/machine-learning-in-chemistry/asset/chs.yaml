  \ 扩展的 Ro5，*Halogens* 卤素个数，*HBA* 氢键受体数，*HBD* 氢键供体数，*logD* 分配系数，*logP* 辛醇/水分配系数，*MW*\
  \ 分子量，*NATOMs* N 和 O 原子数，*NRING* 环数，*PSA* 极性表面积，*ROT* 可旋转键数，*RoX* X 规则。*)\n\n我们建议读者参考两篇综述。第一篇是关于为\
  \ `bRo5` 化合物制定合适的剂型策略以及不同靶标分子要求的计算工具的早期综述。这些作者建议，建立用于预测“可剂型性”的剂型策略可能会增加口服治疗靶标的数量。第二篇是关于通过化学和药学方法克服结构相关问题并获得可接受的\
  \ ADMET 特性的最新综述，这*通过*化学修饰和药剂技术应用来提高类药性（另见 Hudson 最近的综述）。\n\n近年来，机器学习在确定药物活性分子的稳健分类方面发挥着日益增长的作用。特别是，研究表明，`递归划分\
  \ (RP)`、`随机森林 (RFs)`、`支持向量机 (SVMs)` 和，人工神经网络 (ANNs)` 在该领域被广泛采用。诸如 `RP`、`朴素贝叶斯` 和\
  \ `SVM` 等分类方法已用于将小分子分为可药物分子和不可药物分子。在 ADMET 评估中，`朴素贝叶斯` 方法被证明提供了比 `RP` 和 `SVM` 更准确的结果。相比之下，`SVM`\
  \ 在早期药物研究中与其他分类方法相比显示出良好的分类结果。\n\n小分子配体（候选药物）到高分辨率结构的高通量对接现在是药物发现计算方法中的标准。高通量对接在正确识别配体结合模式方面表现良好，但相关的评分函数在预测亲力方面的成功率较低。有趣的是，最近建议了一种混合\
  \ `自组织映射 ANN` 方法作为评估配体（小药）对接实验的计算工具。这些作者展示了添加化学-物理结构对于改进识别治疗良好的候选药物的价值。最近，Hudson\
  \ *et al.* 研究了基于 10 个物理化学 MP 的 `SVM` 和 `RP` 方法，以成功分类具有低分或高违规分（基于偏态混合定义的最佳截断点 `C=5`）的小分子（配体），以及基于逻辑回归（logit）模型。`RP`\
  \ 和 `SVM` 随后用于将高分违规分子从低分（<5）中分类。他们还证明，结合分子描述符的 `SVM` 对违规计数提供了可靠评估，这些计数此前由 Hudson\
  \ *et al.* 建议用于将分子空间划分为所谓的药物分子与不可药物分子。\n\n我们建议读者参考表 11.2 中给出的总结，该基于物理化学 MP 的药物性预测机器学习（人工智能\
  \ AI 的子集）研究的选择。值得注意的是，`AI` 以及最近的深度学习（DL）的发展并不新，高性能计算的进展、大型标记数据集的可用以及实现深度神经网络的新框架，导致了药物基因组学和分子（网络）生物学领域的空前加速。我们还建议读者参考关于药物发现中\
  \ `DL` 方法的最新综述以及预测分子类药性和其疾病或器官分类的机器学习方法综述。\n\n### 表 11.2 基于物理化学分子属性的药物性预测机器学习\n\n\
