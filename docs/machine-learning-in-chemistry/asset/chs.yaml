  \n## 8.1 引言\n\n恒星之间的空间——星际介质（`ISM`）并非空虚。`ISM`充满了星际云和纤维，由气体（约 99%）和尘埃（约 1%）组成。这些云和纤维是恒星起源[1,\
  \ 2]。模拟导致恒星及行星形成的物理化学过程是一个高度非线性、极度依赖时间的问题，涉及气体与尘埃物理化学性质之间多层的相互作用。尽管先进望远镜推动了许多进展，我们距离解决“恒星形成问题”仍然很远：恒星形成于星际介质中的分子纤维或团、冷（∼10\
  \ K）且相对密集（>10⁴ particles cm⁻³）的区域，那里大部分气体呈分子态。这些区域还包含更高密度的核心。类太阳系统形成的前两个阶段涉及高度非线性的物理化学过程，仅通过天文观测难以证实。在第一阶段，某些核心会变得引力不稳定并引发恒星形成。这种坍塌受分子的控制，分子冷却气体并使引力克服静水学平衡。在原恒星阶段，由于核心的高密度和低温度，气相物种“冻结”在存在的尘埃颗粒上并形成冰壳。这两个阶段的气体和表面成分表现出复杂的、随时间变化的非线性化学性质，这强烈依赖于物理环境[3]。关于星际冰，可获得的实验信息很少。未处理的冰的成分是什么？可行表面反应的效率是多少？`ISM`的能量学（宇宙射线、紫外线、冲击波）如何影响经处理的冰？\n\
  \n关键问题的示例甚至涉及最简单的分子：`CO`分子在低于∼25 K 的温度下有效地附着在表面，并在冰中大量存在。其中部分`CO`可以转化为其他物种，而在冰中观测到的`CO[2]`和`CH[3]OH`[4]表明这种*处理过程*确实发生了。`H[2]CO`、`CH[3]OH`和乙醇醛涉及`CO`的表面氢化，确定它们在恒星形成区域的化学性质对于生物化学的研究至关重要[5]。当气体温度升到\
  \ 20 K 以上时，一些冰会返回气相。在较低温度下，非热脱附过程仍可以将分子从固态返回到气相[6]。然而，这些非热机制与冻结作用存在“竞争”。气相化学的约束比表面化学更充分；尽管如此，对于空间观测到的某些最复杂物种（天文学家通常称为复杂有机分子或`COMs`）的形成路径和效率仍存在许多不确定性[7,\
  \ 8]。总而言之，气体和冰壳的成分随时间变化的过程而变化，这高度取决于任何特定云团中气体和尘埃的状态。\n\n在第二阶段，*即*原恒星诞生时，引力能转化为辐射，中心天体（未来的恒星）周围的包层升温。在前一阶段冻在颗粒外壳上的分子获得了迁移性，并可能形成新的、更复杂的物种。当温度达到∼100\
  \ K 的冰壳升华温度时，冰壳中的分子被注入气体中，并在那里发生反应形成新的、更复杂的分子。同时，部分物质以高度超声速准直流和分子流的形式剧烈向外喷射。当流出的物质遇到分子云的静止气体时，会产生冲击波，此时冰壳被（部分）溅射，耐火颗粒被粉碎。一旦进入气相，分子就可以并通过它们的旋转谱被观测到。同样，就像第一阶段，气体与尘埃的相互作用（以及气体成分）在非常短的时间尺度（不到百年）内变化，化学和动力学的影响以复杂的非线性方式相互锁定[9]。\n\
  \n在这两个阶段，分子为分析恒星和行星形成区域的化学物理条件提供了重要工具。每个恒或行星演化阶段都有其化学成分特征，*如果得到适当解释*就能确定其阶段的物理过程。\n\
  \n对这一数百万年恒星形成周期的简单描述凸显了我们面临的挑战。\n\n## 8.2 数据库的完整性与可靠性\n\n通常，目前的 ISM 化学模型使用双体（有时是三体）化学反应数据库；这些数据库包含长长的气相和固相化学反应列表。在气相中，每个反应都提供三个常数。第一个常数（`α`）代表\
  \ 300 K 时的速率，另外两个常数（`β`和`γ`）给出该速率的温度定标值。对于光反应，一组等效常数给出了未屏蔽的星际紫外场中的速率以及该速率对消光的依赖性。这三个常数都有各自相关的不确定性。取决于物理条件，20%到\
  \ 50%的反应可能尚未经过实验研究。因此，某些情况下化学反应速率具有高度推测性。\n\n对于发生在尘埃颗粒上的反应，由于缺乏实验数据，其路径、效率和分支比比气相反应更不确定。因此，表面反应具有高度推测性，通常不包含在天化学模型中。\n\
  \n减少所有反应的不确定性需要数量无法实现的实验室实验。然而，化学模型完全依赖这些数据库，使得其准确性成为天体化学的首要问题。\n\n### 8.2.1 气相网络\n\
  \n\n\n多年来开发的各种天体化学模型计算了涉及数千种化学反应的数百种物质的丰度。气相反应是化学网络的主干，因为它们是大多数分子形成和破坏的主要途径。因此，对速率系数的理解不足会导致星际介质（ISM）中观测到的主要分子丰度产生巨大误差。\n\
  \n我们需要精确速率系数的动力学温度范围和气体密度范围取决于我们需要建模的空间区域，但其范围可能分别从 10 K 到 >1000 K，以及 100 到 10¹⁴\
  \ 粒子 `cm^(−3)`。在这些条件下，化学反应可以在实验室中或通过理论进行研究。然而，每项实验或研究至少需要几个月才能完成。通常，速率系数是根据其他已知的速率系数估算出来的。更重要的是，即使每种反应都经过实验或理论研究，也不可能在适用于\
  \ ISM 的整个范围内进行研究，因此必须进行许多外推。科学界已采取措施汇编了数据库，并在其中进行了某些质量保证。例如，天体化学动力学数据库（KIDA）是一个公共气相网络，它提供了来自各种来源的所有速率系数，并在可能的情况下评估它们的准确性。我们建议读者参考该网络的详细解释。然而，即使是像\
  \ KIDA 这样在透明度和完整性方面做出巨大努力，未能未能用户提供一个完整、准确且可靠的气相网络，涵盖 ISM 中常规观测到的复杂化学涉及的所有可能种类。这对于复杂有机分子（COMs）尤为如此，它们是含有\
  \ 6 个或更多原子的种类，在 ISM 中的丰度通常很低，但对于我们理解空间中的生命前化学至关重要。包括 COMs 形成和破坏的气相网络远不完全，天体化学模型一直难以解释观测到的\
  \ COMs 丰度。虽然目前大多数模型在 COM 的形成上倾向于表面化学而非气相化学，但现在的几项研究表明，COMs 确实可以在气相中形成，但由于涉及 COM\
  \ 的气相网络不完整，无法量化气相反应与表面反应的相对贡献。\n\n### 8.2.2 尘埃表面网络\n\n无疑，尘埃颗粒化学在 ISM 中常规观测到的关键丰富物种（例如\
  \ H[2]O、CH[3]OH 和 NH[3]）的形成中起着至关重要的作用，这些物种主要通过固态化学形成。尽管对于气相反应是否对 COM 的形成有贡献存在争论，但显然后者至少部分是在颗粒表面形成的。\n\
  \n我们知道尘埃颗粒充当了“催化剂”的角色，这意味着——在它们的表面上——表面反应和能量辐射可以从非常简单的分子（例如，当介质温度接近 10 K 时从气体中沉积的\
  \ CO 和 N[2] 以及原子 H、C、O、N、S 等）合成出与生命前物种一样复杂的分子。在过去的几十年里，已经进行了许多实验来评估表面化学反应（参见参考文献\
  \ [18] 中的综述）。\n\n分子氢是第一个在尘埃表面上研究的分子。从那时起，进行了许多实验来研究更复杂分子的形成（例如参考文献 [20]–[22]），以及冰的形貌和冰壳机制（例如参考文献\
  \ [23] 和 [24]）。然而，所有这些实验都是在受限的实验室条件下进行的，这与 ISM 中发现的情况不同：例如，原子通量、冰的温度、冰的形貌和混合比例，实验室中的能量过程将与\
  \ ISM 中的情况不同。因此，从实验推导出的表面分子形成、脱附和破坏途径及速率可能无法完全满足化学建模者的需求。换句话说，星际冰的实验数据有限，因为实验过程既简单也不快速。结果，大多数化学模型要么包含非常简单的表面反应网络，要么包含大多数反应本质上是靠猜测的网络。\n\
  \n## 8.3 贝叶斯方法\n\n在天体化学中，并不常见使用贝叶斯方法从观测中导出模型参数的后验概率分布（PPDs）。第一项此类此的研究利用贝叶斯推断，通过化学模型对气体和冰中物种的观测，推导出暗分子云内部的密度密度和宇宙射线电离率等参数。这项研究特别强调了所处理问题的本质，即天体化学问题通常是非线性的、病态的反演问题，解可能唯一的，或者可能不连续地依赖于观测数据。在一次研究中，采用了基于梅特罗波-哈斯廷斯（MH）算法（马尔可夫链蒙特卡洛算法的一个示例）的贝叶斯方法，并使用了简化版的\
  \ `UCLCHEM`（一种随时间变化的气-颗粒化学模型，现已开源：`https://uclchem.github.io/`）来探索分子云的九维参数空间。他们运行了两组完全相同的八条\
  \ MCMC 链，区别仅在于先验分布信息的设置方式：第一组具有非信息先验信息，表现为观测到的冰的可能取值的接受范围；而第二组的先验则包含了来自观测的所有观测约束，包括气相丰度。与本综述特别相关的是，有趣的是可以看到不同的先验分布如何影响它们其中一个维度的结果后验概率分布（PPD）：某些关键化学反应途径的分支率，例如控制冻结在颗粒上的氧有多少转化为\
  \ H[2]O 或 OH 的途径。使用非信息均匀先验时，PPD 的高密度区域覆盖了分布中过大的部分，这意味着分支率无法得到足够的约束。使用信息先验时，PPD 中的高密度区域减少了，并清楚地表明水的产率优于\
  \ OH。这个例子首次在天体化学中证明了可以通过贝叶斯 MCMC 方法成功估算分支率参数。\n\n\n\n\n\n一项较新的工作^(25) 将上述方法作为概念验证，试图推断有限表面网络中的反应速率，并在此过程中提供了在观测约束下推导出简化网络的方法。在这项工作中，开发了一个简单的化学模型，该模型仅考虑了暗分子云中尘埃颗粒冰壳的固态化学。该简化的模型是一个随时间变化的单点模型，它能根据分子云的物理条件和所定义化学网络的化学参数，生成固相分子丰度的时间序列。该网络仅包含表面反应，并主要涉及常见气相物种的氢化反应。我们在表\
  \ 8.1 中报告了这些反应。\n\n### 表 8.1 参考文献 25 研究中包含的反应。所有反应均发生于颗粒表面。转载自文献 25, [`doi.org/10.3847/1538-4357/aae1fa`](http://https://doi.org/10.3847/1538-4357/aae1fa)，遵循\
