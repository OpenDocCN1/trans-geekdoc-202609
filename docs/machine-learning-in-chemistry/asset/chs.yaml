  \ `FCHL19` 的新版本中得到了优化。之前的版本 `FCHL18` 用于获取结果。\n\n### 4.2.2 训练集的生成\n\n适用于 NAMD 的训练集应包含分子几何结构以及动力学模拟中包含的所有能量态的能量、相应的梯度以及态之间的耦合。不同自旋多重态态之间的自旋轨道耦合非常重要，而\
  \ NAC（核电子耦合）解释了相同自旋多重态态之间的跃迁。在这里，测试系统有三个活跃态，因此将描述 NAC。注意的是，如果适当训练 ML 模型，ML 势能的准确性完全取决于量子化学参考方法。为了减少昂贵的计算，需要以成本效益生成训练集。尽管如此，这个小型训练集应该覆盖分子在动力学模拟过程中访问的相关构象空间。因此，建议从手动生成的初始小集开始，通过自适应采样以有意义的方式扩展该训练集。\n\
  \n#### 4.2.2.1 初始训练集\n\n作为生成 NAMD 模拟训练集的起点，应该包含分子的平衡几何，并将其作为后续所有计算波函数重叠的参考点。因此，应当保存该几何结构的波函数信息以便进一步预处理（见第\
  \ 4.2.3 节）。原则上，每种采样方法都可以用于计算初始训练集的其余点。对于自由度较少的小分子，很好的方法是沿着每个正交模式坐标进行扫描。更好的主意是取关键点的优化点。对于较大的系统，可以使用其他方法，如\
  \ Wigner 采样或通过分子动力学进行采样（例如伞形采样、轨迹引导采样、增强采样或元动力学），在任何情况下，预先考虑动力模拟过程中可能访问的 PES 关键区域或反应坐标是有益的。例如，如果文献已知或化学直觉认为光激发会导致氢解离或碳键断裂，则应扫描相应的反应坐标。一旦认为初始训练集足够大（目前我们使用了大约\
  \ 1000 个点），就可以训练 ML 模型并使用激发态自适应采样进行动力学模拟，将在下方解释。\n\n#### 4.2.2.2 激发态的自适应采样\n\n通常，用于在\
  \ NAMD 模拟中替代量子化学的 ML 模型是数据点之间的插值。因此，在 PES 的插值区域，它可以具有参考方法相同的精度，同时速度极快。然而，在外推区域，它会失效。因此，预先采样分子的构象空间是不够的，必须在动力学运行的任何时候检查\
  \ ML 预测的可靠性。如果检测到某个区域不可信，说明采样不足或未包含在训练集中。检测到不可信的构象应添加到训练集中，并从这个扩展的训练集中重新训练 ML 模型，以便准确且长时间地进行\
  \ ML-NAMD 模拟。使用未知构象扩展训练集并检查 ML 预测准确性的方法通常被称为自适应采样，该方法在基态动力学中已经成熟，并针对激发态动力学进行了修改。该过程如图\
  \ 4.2 所示。\n\n![image](img/bk9781788017893-00076-f2.jpg)\n\n图 4.2 参考文献 32 的自适应采样方案。\n\
  \n详细来说，激发态的自适应采样从 NAMD 模拟开始，其中激发态性质 `Ỹ`^(`p`)[`j]`（PES、力和 NAC）取自至少两个 ML 模型 `J`\
  \ 预测的平均值 `Ȳ`^(`p`)：\n\n![image](img/bk9781788017893-00076-t14.jpg)(4.15)\n\n\n\n\
  \n\n这些机器学习模型是从初始训练集独立训练的，但在初始超参数或起始权重上略有不同。在每个时间步，都会计算机器学习模型预测值 `Y^(*p)[*σ*]` 之间的\
  \ `RMSE`，并将其与预定义的阈值 `ε^(p*)` 进行比较，该阈值是为每个激发态属性设置的。这些阈值是手动定义的，且应该在机器学习模型的验证误差范围内。每个属性都使用一个单独的阈值。每当超过这些阈值中的任何一个时，例如：\n\
  \n![image](img/bk9781788017893-00076-t15.jpg) (4.16)\n\n该预测被认为是不可靠的，且分子几何型被假设为未探索构象空间的一部分。随后，该几何型将作为输入，对每个属性执行额外的量子化学参考计算，无论超过的是哪个属性的阈值。训练集通过此额外数据点进行扩展，并从扩展后的训练集上重新训练机器学习模型。在完成这样一个周期后，阈值通过乘以预定义的因子（例如\
  \ `0.95`）进行调整，以减小阈值幅度并为训练集的生成对构象空间进行全面采样。使用新训练的机器学习模型系进行动力学模拟可以从未知配置继续，采用自适应采样程序，直到训练集覆盖\
  \ NAMD 所的相关空间。(20,50,89)\n\n出于实际考虑和为了高效生成训练集，较优的做法不是用一组机器学习模型启动单条轨迹，而是启动大约 100 条轨迹，这在\
  \ NAMD 中通常是这样做。只有当每条轨迹到达势能面（PESs）的未探索构象区域且相应的数据点均已添加到训练集后，才重新训练机器学习模型。因此，机器学习模型的训练对所有轨迹仅进行一次，而不是针对每个中止的轨迹单独进行。通过这种方式，降低了机器学习模型训练的计算成本。\n\
  \n此外，建议根据机器学习模型在训练集上的误差重新计算阈值，并在训练集规模增加约两倍时从头开始动力学模拟。此外，应该再次扫描并优化机器学习模型的超参数，以找到与扩展后训练集的最佳拟合。这种做法是有建议的，因为轨迹可能不会通向完全相同的构象区域，而可能会探索\
  \ PESs 的不同子空间。(32,50)\n\n总的来说，对于 NAMD 而言，关于训练集有多大并没有指导建议。这更多地取决于目标分子的尺寸和灵活性，以及可能发生的光诱导过程的复杂性和多样性。如果光激发后可以进入不同的反应通道，则可能比刚性分子需要更多的数据点，而刚性分子的大多数轨迹都通向同一个反应通道。另一个重要因素是包含在\
  \ NAMD 中的活跃态数量。通过检查采样程序的收敛行为，可以判断训练集距离其最优尺寸有多近。(50)\n\n对于所有这些参考计算，考虑的状态可能比实际的 ML-NAMD\
  \ 中要多，在选择参考方法时也应考虑到这一点。这对于由两个不同电子态波函数产生的激发态属性尤为重要，例如耦合两个不同态的非绝角耦合（NACs）或跃迁偶极矩。它们的符号（即耦合值\
  \ `C[ij]` 是 `+C[ij]` 还是 `−C[ij]`）取决于每个电子态波函数的相对相位。对于构型非常相似的几何型，耦合可能会任意切换其符号，导致形成的势能出现不一致性。这使得机器学习模型难以找到\
  \ `C[ij]` 值与分子几何型之间的关系。为了能够根据矩阵表示对非对角元素进行有意义的学习，需要进行称为“相位校正”（phase correction）的进一步预处理，以消除几乎所有此类不一致性，并实现机器学习模型的良好学习。为此，有必要计算训练集中每个几何型与训练集生成开始时定义的参考几何型之间的波函数重叠，该参考几何型仍包含了关于波函数的所有信息。(50,111,112)\
  \ 这与 Born–Oppenheimer 分子动力学的训练集生成有所不同，将在后文中解释。\n\n### 4.2.3 波函数相位\n\n整个量子化学参考计算过程中的相位不一致问题可以用亚甲基铵离子离子的分子轨道来说明（图\
  \ 4.3（取自文献 50)）。如图 4.3A 面所示，分子几何型是量子化学计算的输入。这里的插值坐标是 C–N 键的伸长。在 B 面中，给出了从量子计算得到的\
  \ `S[1]` 和 `S[2]` 态的轨道。所示，它们可以切换符号，通过亮度（暗或亮）来表示。同样适用于波函数，它是一个有效的特征函数。如果将其乘以相位因子，它仍然是有效的特征函数。因此，波函数没有唯一定义。结果是态之间的耦合矢量\
  \ `NAC[ij]` 以及一般的矩阵表示中的任何非对角元素 `C[ij]`（源于这两个态的波函数 `Ψ[i]` 和 `Ψ[j]`）可能会沿插值坐标随机改变符号。结果是这些元素显示出不连续的曲线，如\
  \ B 面底部所示。\n\n![image](img/eqn4-17.jpg) (4.17)\n\n![image](img/bk9781788017893-00076-f3.jpg)\n\
  \n图 4.3 亚甲基铵离子 `CH[2]NH[2]+` 沿 C–N 键的一系列量子化学计算。分子构型（量子计算的输入）在 A 面所示，计算出的两个电子态 `S[1]`\
  \ 和 `S[2]` 态的轨道以及它们之间相应的非对角矩阵元素 `⟨S[1]|Ĥ|S[2]⟩` 在 B 面所示。如所示，这些值的符号任意切换。通过应用相位校正算法可以消除这些符号跳变。C\
  \ 面给出了这些元素的结果。转载自文献 50 并经英国皇家学会许可。\n\n为了消除此类相位跳变并使机器学习的正确学习可能，必须应用虚拟全局相位校正。这一过程允许人们修正耦合，以获得平滑的曲线。这种相位校正仅用于确保训练集覆盖的大部分构型空间具有全局相位，以便能够被学习并应用于机器学习模型。该相位校正算法将在下文详细讨论。\n\
  \n\n\n\n\n值得注意的是，由 Berry 相（Berry phase）引起的相位跳变是消除的，更多详情参见参考文献 59。然而，假设这些跳变仅存在于训练集的一个小子空间中，因此可以忽略不计。这得到了理论的进一步验证，例如\
  \ Zhu Nakamura 理论^(58,67,80,113–115)，这些理论在整个 NAMD 模拟过程中不追踪任何相位，但仍能产生准确的结果。\n\n###\
  \ 4.2.4 相位修正算法\n\n为了进行相位修正，必须从预定义的参考构型开始跟踪每个电子态的相位。这可以通过计算两个相邻分子构型 `k` 和 `l` 之间的波函数重叠积分^(74,111,112)`S`\
  \ 来实现，例如在 `WFoverlap` 代码中的实现所示：^(111)\n\n![image](img/eqn4-18.jpg)(4.18)\n\n该矩阵的维度为\
  \ `N^(states)`×`N^(states)`，其中 `N^(states)` 是计算中包含的活跃态数量。如果两个构型 `k` 和 `l` 非常相似，重叠积分将作为对角元素获得，其值接近\
  \ ±1。如果一个态的波函数重叠非常接近 +1，则没有发生相位变化，而接近 −1 的值表示波函数的相位发生了切换。随后可以定义一个相位向量 `p`，它包含每个电子态的\
  \ +1 或 −1 的值，表示相对于上一个构型的相位变化。除了势能面（PES）的关键区域外，`p` 通常对应于 `S` 的对角矩阵元素。\n\n在 PES 的绝热势能能曲线发生避交交叉（avoided\
  \ crossing）且非原子核耦合（NACs）较大的区域，`S` 的非对角元素可能大于相应的对角元素。此时，每个电子态的 `p` 符号通过 `S` 某行中的最大绝对值获得。\n\
  \n在自适应采样期间，会出现这两种构型——*即*本应包含在训练集中的构型与参考构型——不够相似，无法获得绝对值大于 0.5 的重叠积分。在这种情况下，无法获得任何关于相位变化的信息，必须在两个构型之间进行插值，并结合波函数重叠的迭代计算。`p`\
  \ 的项可以使用以下方程获得：\n\n![image](img/bk9781788017893-00076-t16.jpg)(4.19)\n\n如果在相位修正期间需要插值，则最终构型的相位向量\
  \ `p[n]` 计算为所有之前相位向量 `p[0]` 到 `p[n−1]` 的乘积：\n\n![image](img/bk9781788017893-00076-t17.jpg)(4.20)\n\
  \n如果插值步长 `β` 变得很大，建议存储不同构型的波函数以及相应的重叠计算结果，*即* `p`。如果必须向训练集添加新构型，可以计算该构型相对于所有可用波函数信息的其他构型的均方根偏差（RMSDs），并将相位回追溯到\
  \ RMSD 最低的构型。这种中间计算可以显著减少插值步骤的数量，从而减少额外的计算成本。^(50)\n\n在处理包含许多能量上相互接近的态的分子时，必须特别小心。所谓的*侵入态*（intruder\
  \ states）可能成为相位修正的误差来源。这些态在参考构型处的能量非常高，未被计算，但在模拟过程中的另一个构型处能量显著降低，以至于应该被包含在内。因此，从开始包含更多的能量态是有利的。在针对的\
  \ NAMD 模拟中，这些额外的态不会被考虑，因此是可以负担的。\n\n当计算训练集中构型的相位向量时，可以对训练集进行预处理。这应该在自适应采样期间动态完成。相位修正可以使用\
  \ 4.21 哈密顿矩阵 `H`（包含*例如*自旋轨道耦合 SOCs）以及 4.22 两个态之间的 NAC 矢量（包含 *x, y, z* 方向的 `N^(atoms)`\
  \ 个分量）乘以这些态对应的相位值 `p[i]` 和 `p[j]` 来采用。\n\n![image](img/eqn4-21.jpg)(4.21)\n\n![image](img/eqn4-22.jpg)(4.22)\n\
  \n与 NAMD 模拟不同，基态动力学模拟不需要对训练集的预处理，因此不需要相位修正。原因是任何电子态的能量和梯度都是通过相同态的波函数的对角元素计算的，`⟨Ψ[i]|O|Ψ[i]⟩`，相位因子因子两次相互抵消。\n\
  \n### 4.2.5 面跃迁动力学\n\n为了进行 NAMD 模拟，使用了包含任意耦合的面跃迁（SHARC）方法^(115)来实现此处所示的结果。SHARC\
  \ 是 Tully 最小开关面跃迁方法的扩展版本。^(68)在面跃迁方法中，原子核在绝热势能面上运动，这些势面由电子组成并通过量子化学方法计算。势面之间通过自旋轨道耦合或\
  \ NAC 耦合，这直接影响分子的跃迁概率。跃迁是从一个电子态到另一个态的非绝热跃。该事件通过将 0 到 1 之间的随机数与计算出的跃迁概率进行比较来随机计算。由于面跃迁是一种随机方法，因此通过计算轨迹系来近似波包的运动。\n\
  \n\n\n\n为了执行 ML 面面跃迁分子动力学，可以使用 `SHARC` 动力学驱动器的 Python 封装 `pySHARC`^(116)，与传统的 `NAMD`\
  \ 程序 `SHARC` 相比，它省略了文件 I/O 并允许 ML 模型与驱动器之间的直接通信。这大幅缩短了 `SHARC` 的程序运行时间.^(50) 通常，传统的\
  \ `NAMD` 代码不受文件 I/O 持续限制，因为电子性质的量子化学计算通常是此类模拟中的时间瓶颈步骤。然而，当它们被比量子化学快多的 ML 模型取代时，文件\
  \ I/O 可能会成为时间瓶颈。此外，由于目标是长时间动力学模拟，必须考虑到产生的数据量会大幅增加，对结果的分析可能比运行产生花费长时间。在这种情况下，也可以使用\
  \ ML 模型高效地分析数据并探索新概念.^(9) 此外，当动力学变化不大时，建议每隔 10-100 个时间步保存一次，而在发生跃迁和重要过程时则保存每个时间步。例如，当分子在激发态中被长时间捕捉时，没有必要保存每条轨迹的每个时间步；而在势能面（PES）的关键区域，许多不同的过程可以在极短的时间内发生，存储每个时间步的信息对于后续分析非常重要。\n\
  \n用于产生本章提到的所有结果的训练集来自文献 50，包含亚甲基亚铵离子 `CH[2]NH[2]^+` 的构象子空间，该空间是通过使用 `SHARC` 程序和两个\
  \ `NNs` 通过正常模式扫描和自适应采样获得的。它包含三个活跃单线态，并使用考虑了单、双激发的多参考构型相互作用方法 (`MR-CISD`) 计算。使用了双\
  \ Zeta 基组 `aug-cc-pVDZ`；训练集总共包含 4000 个相位修正数据点，每个数据点包含 `xyz`-格式的分子几何结构、三个单线态的能量、相应的梯度和\
  \ `NACs`。永久偶极和跃迁偶极也被包含在内，此处未进行处理。为了比较基于 ML 的 `NAMD` 和基于量子化学的 `NAMD`，在激发到第二激发单线态后，使用\
  \ 0.5 fs 的时间步进行了 100 fs 的 `MR-CISD` 参考动力学计算。得到的单点不属于 ML 模型训练集的一部分，且不能这样使用，因为对这些点没有进行相位修正。有关参考动力学的更多细节，请参阅文献\
  \ 50**\n\n## 4.3 示例：亚甲基亚铵离子\n\n如前所述，使用以下 `NNs` 基于文献 50 研究`dynamics`。在这里，亚甲基亚铵离子\
  \ `CH[2]NH[2]^+` 是测试系统，因为从第二激发态回到基态的跃迁发生在超快尺度上，这得益于 `NNs` 的低计算成本。使用 `NNs` 的 3846\
  \ 条轨迹的总计算时间仍然比从 `NAMD` 计算得到的 90 条轨迹的总计算时间低约 800 倍.^(50)\n\n### 4.3.1 ML 面面跃迁\n\n\
  图 4.4 显示了使用不同方法执行面面跃迁后获得的布布方案。116 指量子化学方法 `MR-CISD(6,4)/aug-cc-pVDZ`（虚线），而 118 指相同的方法但使用了另一个基组\
  \ `MR-CISD(6,4)/631++**`（点线）。从面板 A 可以看出，两种量子化学方法对于传播 100 fs 的 90 条轨迹产生了非常相似的布布方案。初始时，100%\
  \ 的布布处于第二激发态 `S[2]`，从中发生向第一单线态 `S[1]` 的快速布布转移，并返回到基态 `S[0]`。这种动力学可以通过在 4000 个数据点训练集上训练的\
  \ `NNs` 成功复制。结果在面板 B 中直接相互比较。可见，通过 `NN` 计算得到的布布曲线（实线）比通过 `QC1`（虚线）得到的要平滑得多。这是因为不仅用\
  \ `NNs` 传播了 90 条轨迹（源自 Wigner 采样的 11000 个初始条件），还传播了 3846 条轨迹（源自 Wigner 采样的 20000\
  \ 个初始条件）。\n\n![image](img/bk9781788017893-00076-f4.jpg)\n\n图 4.4 `CH[2]NH[2]^+`\
  \ 激发到 `S[2]` 态后的面面跃迁动力学。(A) 使用 `QC1` 和 `QC2` 方法传播 100 fs 的 90 条轨迹的动力学与 (B) `NNs`\
  \ 的对比。(C) 来自 `NNs` 的长激发态动力学获取自 200 条传播 10 ps 的轨迹和 2 条传播 1 ns 的轨迹.^(50)\n\n\n\n\n\
  \n通过采用上述采样方案，对于 `QC1` 方法已不再可行的长时间 NAMD 模拟，可以通过两个神经网络（NN）来实现，该方案确保了动力学运行过程中能量、力以及\
  \ NAC（非绝算耦合矩阵）的势能准确性。与上述描述的自适应采样方案不同，这里采用了迭代采样方案，即不同 NN 之间的比较阈值不再降低，而是在开始时固定并保持不变。使用\
  \ 200 条轨迹的系综生成了长至 10 ps（10⁴ fs）的布居方案，并进一步传播了 2 条轨迹至 1 ns（10⁶ fs）。所示，布居在约 300 fs\
  \ 后转移到电子基态，并在模拟的剩余时间内保持在该状态。仍然发生的跃迁（Hops）可以被视为噪声，由剩余动能引起。在 6 小时内即可完成 10 ps 的动力学模拟，而计算\
  \ 1 ns 的模拟则耗时约 59 天。如果使用 `QC1` 方法，进行 1 ns 的模拟大约需要 19 年。(50)\n\n为了实现长时间的 NAMD 模拟，最好从一开始就把重要的过程（如氢原子解离或不同分子基团的旋转）纳入训练集。这样做可以减少额外的量子化学计算成本，如果上述事件在长时间动力学模拟期间发生，这些计算是必不可少的。例如在氢解离的情况下，在每个时间步相应的\
  \ H 键伸长后，轨迹可能会终止，此时使用 NN 而非量子化学将无法获得收益。事实上，在这种情况下，动力学模拟甚至比参考动力学还要，因为 NN 需要在每个时间步后重新训练，且相位修正程序可能需要额外的插值步骤来正确跟踪每个状态波函数的相位。\n\
  \n### 4.3.2 能量守恒\n\n重要的是，力需要作为 NN 势的导数计算以保持能量守恒。为了检查 NN 动力学沿能量守恒情况，轨迹总能量的均值和标准差见表\
  \ 4.1，取自文献 50。所示，总能量在 `QC1` 和 NN 中同样守恒。显而易见，当禁止跃迁且轨迹必须在整个模拟时间内留在 `S`[2] 状态时，能量守恒变得略微变。这通过较大的标准差得到了证明——这一趋势在两种方法中分别获得。通过将经典核传播的时间步长从\
  \ 0.5 fs 减到 0.05 fs，即使禁止了跃迁，标准差也显著降低。(50)\n\n表 4.1 使用 `QC1` 方法和 NN 传播 1 ns 后，对 90\
  \ 条轨迹（经典传播步长为 0.5 fs）和 5 条轨迹（经典传播步长为 0.05 fs）取平均总能量的 MAE 和标准差（Std.）计算结果。值取自文献 50。\n\
  \n| 方法 | 时间步 [fs] | MAE [eV] | Std. [eV] | 是否允许跃迁? |\n| :--- | :--- | :--- | :---\
  \ | :--- |\n| QC1 | 0.5 | 0.63 | 0.047 | 是 |\n| QC1 | 0.5 | 0.77 | 0.059 | 否 |\n\
  | QC1 | 0.05 | 0.73 | 0.011 | 否 |\n| NN | 0.5 | 0.72 | 0.052 | 是 |\n| NN | 0.5 |\
  \ 0.73 | 0.061 | 否 |\n| NN | 0.05 | 0.80 | 0.017 | 否 |\n\n### 4.3.3 ML 的进一步工具\n\n\
  如上一节所示，可以训练 NN 来准确重现能量、力和 NAC。因此，不仅可以进行 NAMD 模拟，这里讨论了锥形相交点（conical intersections）。锥形相交点对量子化学以及机器学习模型构成了挑战。取自文献\
  \ 50 的沿能量、NAC 的跃迁几何结构分布说明，NN 势足以准确找到正确的最小锥形相交点。图 A 给出了 `S`[1]/*S*[0] 状态交叉的图表，其特征是分子的旋转（见图\
  \ 4.6 第一行），图 B 显示了导致 C–N 键伸长的 `S`[2]/*S*[1] 状态交叉的散点图（见图 4.6 第二行）。\n\n![image](img/bk9781788017893-00076-f5.jpg)\n\
  \n图 4.5 图 A 和 B 分别显示了使用 `QC1`、QC2 和 NN 获得的最小能量锥形相交点周围的跃迁几何分布以及训练集，对应 `S`[1]/*S*[2]\
  \ 锥形相交点和 `S`[2]/*S*[1] 锥形相交点。`QC1` 最小能量锥形相交点的几何结构位于顶部。用于生成散点图的二角和金字角定义见图 C。经英国皇家学会许可转载自文献\
