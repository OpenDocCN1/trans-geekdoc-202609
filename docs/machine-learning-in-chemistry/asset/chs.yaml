  \n## 16.4 结论\n\n疟疾是一种新兴且未解决的健康问题，可以使用药物发现中最先进的 `in silico` 方法来控制。在这种背景下，计算工具对于优先搜索新型、强效且安全的抗疟药物至关重要。目前报道的预测模型超越了筛选大型库的常规目的。必须特别关注从\
  \ `in silico` 模型获取的信息。此处开发的 `ms-QSBER-EL` 模型能够整合抗疟活性、毒性和药代动力学性质，具有良好的准确性。描述符的物理化学和结构解释允许设计出目前科学界可用的候选抗疟化合物。这项工作为针对疟疾的发现开辟了新视野。\n\
