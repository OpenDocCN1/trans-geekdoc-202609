  \n数据通过输入层馈入网络，输出层显示预测或决策。在我们的图像分类任务中，每个像素都根据其灰度被分配一个数字。这些数字列表构成了输入。输出将是与每个图像代表的数值值相关的标签（参见图\
  \ 2.8）。在化学领域，例如我们可能希望训练一个神经网络，根据化学结构来预测化学品的固有溶解度。以化学指纹形式输入的化学结构可以作为我们的特征列表输入，而我们的标签则是实验测得的固有溶解度值。\n\
  \n\n# 图 2.8 如何从手写数字和化学结构中生成不同的特征。\n\n在开始训练之前，必须做出一些重要的决定，特别是关于正在构建的网络架构。神经网络有一个或多个隐藏层，每层包含一定数量的神经元。我们如何知道需要多少层？每层应该由多少个神经元组成？\n\
  \n这些问题的答案并非易事。事实上，ML 工程师通常会考虑许多不同的网络架构，通过试错来确定哪一种是最好的。通常，更复杂的任务（具有更大的输入和输出层、高科学复杂性以及大型训练数据集）需要更深（更多隐藏层）和更宽（每层更多神经元）的网络。然而事实并非如此，较浅且较窄的网络训练速度更快，因此能更快达到解决方案。这些网络也较不容易发生过拟合，这是我们稍后会讨论的现象。正因如此，ML\
  \ 工程师试图遵循奥卡姆剃刀原则，即简单的解决方案比复杂的更有可能是正确的。在 ML 中，对奥卡姆剃刀的搜索涉及尝试许多参数，并选择提供良好模型的最简单集合。\n\
  \n一旦确定了神经元和隐藏层的数量，就是时候考虑神经元之间突触的作用了。我已经提到过突触是一种数学关系，其中最简单的可以采取以下形式：\n\n\n这在 ML 中通常写为：\n\
  \n![image](img/eqn2-2.jpg)(2.2)\n\n其中 `w` 是权重，`b` 是偏置。在训练期间，ML 算法在每个训练步骤中改变权重和偏置值，这种方式希望能帮助它“学习”提供的数据中的模式。然而，如果所有突触都是线性函数，那么网络将无法学习。我们可能希望应用\
  \ ML 的几乎每个意义问题是非线性的，但这无法通过线性函数的线性组合表示。为了克服这个问题，在每个神经元处有两个处理步骤：计算所有输入突触信号之和，然后将结果通过“激活函数”以确定神经元的输出。使用非线性激活函数是神经网络能够学习并预测数据中非线性的关键原因。神经网络中使用的激活函数示例包括\
  \ `Sigmoid`、`Rectified Linear Unit (ReLU)` 和 `TanH` 函数（参见图 2.9）。\n\n\n\n有用的激活函数数量不多，因此它们之间的选择通常通过试错来进行。有时，网络中的每一层都使用相同的激活函数，而其他时间则使用不同的。\n\
  \n## 2.4 训练过程\n\n我们已经构建了问题，选择了我们的数据，并设置了我们的网络。但是训练是如何运作的？首先要考虑的是，网络如何知道它的表现如何。\n\
  \n在分类任务中，给定的预测是正确或错误的。在这种类型的分类任务中，正确预测的百分比被称为准确率，正如你预期的，最好的 ML 分类器将具有最高的准确率。例如，考虑我们对手写数字\
  \ 1 的几次预测，参见图 2.12）。\n\n\n\n\n图 2.12 假设的预测器在某些手写数字上的输出结果，每个预测的得分（正确预测赋值为 1，错误预测赋值为\
  \ 0），以及这些预测的计算出的准确率。\n\n在我们的溶解度预测网络中，网络产生的预测是一个可以与实验测量值比较的数值。这些值越接近，预测越准确；均方根误差（`RMSE`）是衡量这一点的方法之一，越低的\
  \ `RMSE` 值表示模型越优秀。\n\n\n其中 `θ[pred]` 是预测值，`θ[exp]` 是实验值，`n` 是进行预测的数值数量。在这个示例中，`RMSE`\
  \ 成为代价函数的基础，最低的 `RMSE` 最好的模型。\n\n## 2.5 克服缺陷\n\n一旦构建了模型，就是时候观察它的性能了。我们已经讨论过如何使用准确率来评估分类任务，以及如何使用\
  \ `RMSE` 来评估定量预测任务。这里的问题在于如何最好地进行这些评估。\n\n用于训练模型的数据被称为训练集。如前所述，最好的训练集包含大量可靠的数据点。但任何使用训练集计算出的网络性能衡量标准都有一个明显的缺陷——模型已经见过这些示例并从中学习了它们。因此，这可以被视为一项记忆任务，而不是预测任务。这意味着机器并没有在学习如何对新示例做出智能预测，而简单地在背诵它已经获得的信息。因此，为了可靠地评估性能，我们需要使用训练集之外的示例来进行这种评估。\n\
  \n做到这一点的常用方法是使用测试集——整个数据库的一个子集，它在训练过程中被排除在外。这种数据划分方法被称为留出法（holdout method）。通常使用\
  \ 80% : 20% 或 75% : 25% 的比例，并将较大的集合作为训练集。虽然可以使用任何划分比例，但值得注意的是，使训练集太小会使模型难以训练，而使测试集太小会导致验证不可靠（如果测试集只包含一个示例，你会信任一个在测试集分类任务中得分\
  \ 100% 的模型吗？）。有时还会使用第三个集合，称为验证集。在这种情况下，模型在训练集上进行训练，在验证集上进行评估以确保优化训练，最后在测试集上进行测试。这有助于确保生成的最终模型不会受到测试集样本的偏差。\n\
  \n现在我们已经有了训练集和测试集，我们可以在两个集合上评估模型性能，以查看模型的表现。通常，这是训练中重大缺陷显现的时刻——过拟合。过拟合是指模型被训练到了这种程度，以至于它学习了训练集中所有细微的怪癖和特点，在训练数据上表现出最佳性能，但未能学习训练数据中的通用规则和关系，因此在测试数据上的表现糟糕。\n\
  \n在 图 2.13 中，模型被训练到了这种程度，以至于它学习了训练集中所有细微的怪癖和特点，在训练数据上表现出最佳性能，但未能学习训练数据中的通用规则和关系，因此在测试数据上的表现糟糕。（译注：原文后续存在大量重复的段落，根据“不要不要重复输出原文”原则，此处仅保留核心内容的翻译）。]\n\
  \n\n\n在这种情况下，我们的代价函数曲面上只有一个最小值，这非常方便。然而，大多数曲面都有多个最小值（参见图 2.17）。正如我确定你已经发现的，这可能会导致两个统计性能不同的训练网络（参见图\
  \ 2.18），取决于在曲面的哪个位置开始训练以及训练步长有多大。这显然是一个问题，因为其中一个不是全局最小值，因此不是最好的网络。\n\n\n图 2.17 具有多个最小值的更复杂的代价函数。\n\
  \n\n图 2.18 在此曲面上，两次下降可以根据起始点的不同找到不同的最小值。只有一个是全局最小值——代价函数的最低可能值，因此也是最好的模型。\n\n因此，重复训练几次是一种常见的做法——就像你可能会重复实验一样——以确保找到全局最小值并确保计算是可信的。\n\
  \n## 2.6 部署算法\n\n现在，你已经收集了适当的数据，并构建并训练了一个机器学习算法，同时考虑了数据集偏差和过拟合的危险。接下来是什么呢？嗯，希望你已经构建了一个足以应用于来自真实世界的更多外部数据的模型。在我们的示例模型中，这可能涉及对扫描表单上的手写数字进行分类以进行数据输入，或者在新化学开发期间预测物理化学性质以进行评估。\n\
  \n在你出发改变世界之前，我最后想进一步探讨一下模型验证的主题，并提到几个我认为提供了宝贵教训的例子。\n\n在计算科学中，验证可能是一个敏感的话题，每个人都有最喜欢和最不喜欢的统计性能指标（在模型开发期间，你最喜欢的可能会成为那个让你的模型看起来最光彩的指标），但它们都有优缺点。在我们手写数字分类任务中，我们将每个预测标记为正确或错误，这允许我们计算预测的准确率。对于实际答案为“是”或“否”的二分类任务，可以使用混淆矩阵对预测进行分类（参见图\
  \ 2.19）。\n\n\n图 2.19 二分类的混淆矩阵。\n\n在分类任务中，通常会计算真阳性 (TPs)、假阳性 (FPs)、真阴性 (TNs) 和假阴性\
  \ (FNs) 的数量。基于这些指标，可以计算各种统计量，包括：\n\nSensitivity（也称为真阳性率或召回率），实验阳性被正确分类的概率；\n\n\n\
  Specificity（也称为真阴性率或特异性），实验阴性被正确分类的概率；\n\n\nPositive predictive value (PPV, 也称为精确率)，预测为阳性且实验中为阳性的概率；\n\
  \n\nNegative predictive value (NPV)，预测为阴性且实验中为阴性的概率；\n\n\n这些指标各考虑了所做预测的一半，因此它们应该成对考虑。然而，有时取决于建模场景，一个高而另一个低是可以接受的。例如，考虑如果你在丛林中寻找一种稀有鸟类，并且你训练了一个模型来预测该鸟在特定区域的位置。一个高\
  \ PPV 的模型将很有用，因为它减少了徒劳远征寻找该鸟的概率！在这种情况下，高 NPV 并不真的重要，因为你并不不在乎鸟不在。让我们考虑另一个例子，你需要测试大量的水样以检测它们是否被污染。你的机器可以测试样本并预测它们是否来自污染源。在这种情况下，具有高\
  \ NPV 是至关重要的，否则这可能导致污染的水源未被调查。高 PPV 是理想的，但如果你必须对某些安全的水源进行进一步测试，那比让受污染的水源未被处理要好。\n\
  \n其他其他统计量有助于处理数据不平衡，包括：\n\nBalanced accuracy（平衡准确率），它是敏感性和特异性的平均值，有助于考虑正类和负类之间微小的数据不平衡；\n\
  \n\nMatthews correlation coefficient (MCC) 是模型质量的衡量标准，提供 -1 到 1 之间的值。1 表示完美模型，−1\
  \ 表示完全错误的模型（即每个预测都是错误的），0 表示随机分配标签的模型。即使在类别非常不平衡时，也可以使用 MCC；\n\n![image](img/bk9781788017893-00016-t8.jpg)(2.11)\n\
  \n最后，机器学习中一种流行的性能衡量方法是使用受试者工作特征（ROC）曲线并计算其下方的面积（AUC）（参见图 2.20）。\n\n\n图 2.20 ROC\
  \ 曲线显示了真阳性率（Sensitivity）如何随假阳性率（Specificity）变化。AUC 位于虚线右侧；较高的 AUC 与较高的模型性能相关。\n\n\
  这远不是详尽的列表，在评估模型时最好考虑多个质量指标，以确保你不受偏见的影响。通过良好的验证实践，你可以确保产生良好的模型，并在获得额外数据时对它们进行验证，从而衡量它们在真实世界中的表现。毕竟，这是任何机器学习模型的最终目标。\n\
  \n最后一个注释是基于机器学习算法及其在 AI 世界中的地位。早，我认为将 AI 定义为“能够执行人类认为智能的任务的机器”。这个定义表明，AI 内部不仅仅是机器学习算法和神经网络。许多需要智能的任务不需要神经网络来解决。考虑电脑扫雷游戏：只需花少精力就可以编写一个不错的计算机玩家，但训练一个神经网络来学习该游戏可能需要几个小时，而且结果可能并不会。最后，在选择计算方法帮助我们解决科学问题时，必须小心。\n\
