  \ 访问于 2019 年 9 月)。\n\n24. S. Hochreiter 和 J. Schmidhuber, *Neural Comput.*, 1997,\
  \ **9**, 1735–1780.\n\n# 第 2 章\n\n## 机器是如何学习的？\n\nTIMOTHY E. H. ALLEN\n\n^a MRC\
  \ 毒理学部门，Hodgkin Building, Lancaster Road, Leicester LE1 7HB, UK\n^b 桥大学分子信息中心，Lensfield\
  \ Road, Cambridge CB21EW, UK\n\n邮箱：`teha2@cam.ac.uk`\n\n许多计算机科学家相信，人工智能终将展现出通用智能，能够处理复杂问题并提供相应的答案。到那时，与机器进行有趣的对话将成为常态——突破著名的图灵测试。但目前我们只能使用现有的工具。\n\
  \n## 2.1 构建问题\n\n计算机擅长回答某些类型的问题，但不擅长回答其他。因此，使用机器学习（ML）的关键第一步是考虑我们要问的问题类型。考虑你的问题是否适用的一种方法是考虑与它相关的\
  \ `features`（特征）和 `labels`（标签）（见图 2.1](#BK9781788017893-00016.xhtml#fig1)).\n\n\n\
  图 2.1 一个（非常）简单的机器学习算法。\n\n简单来说，机器学习的特征是输入，标签是输出。例如，在图像分类任务中，特征源自图像，而标签描述图像的内容。如果一个问题具有定义明确且逻辑相关的特征和标签，它可能是一个适用于机器学习领域。机器学习算法在识别和分类图像方面展现了惊人且快速的能力，现在在网上可以轻松看到。互联网上的图像太多，无法让人类对每一个进行分类，因此软件会在人类标记过的图像集上进行训练。在我的工作中，我训练机器学习算法来预测分子的生物活性。分子是特征，它们的生物活性就是标签。\n\
  \n## 2.2 收集数据\n\n\n\n\n\n机器学习（ML）的一个关键方面是对大量高质量数据的需求。任何算法程序都无法克服训练数据质量问题。如果一个预测是由在不可靠或低质量数据上训练的算法得出的，那么它的价值就是可的。例如，如果你正试图建立一个模型来预测化学反应的结果，你希望实验是由经过良好的科学家执行的，他们遵循良好的实验室规范并使用高纯度的新试剂。如果数据是定量的，你希望这些信息是通过近期良好校准的设备精确测量的。此外，在进行所有实验期间，温度和压力等实验室条件保持一致或至少被记录，也是理想的。显然，单个数据集符合上述所有陈述的概率极低。即使实验步骤质量很高，数据中的某些不确定性几乎是不可避免的；处理这种不确定性具有挑战性。可以手动检查数据点的一致性，考虑所使用的实验步骤、实验实验室以及执行人员的声誉，但这很快就会变成一项难以胜任且极其枯燥的任务。\n\
  \n贪婪的机器学习系统所需的数据量可能也是巨大的。通常，机器学习算法需要的数据点比传统的统计学应用（如定量结构-活性关系）多，因为前者在数学构建上更为复杂。然而，所有方法都受益于更大的数据源，因为这允许在更多的场景下更好地评估它们的应用。幸运的是，现代技术（如高通量筛选，HTS）允许相对快速地产生许多数据点。HTS\
  \ 使用机器人和自动化实验程序，能够快速且一致地进行大量实验（有时规模达数百万次）。这些程序在药物发现中非常流行，其中通过评估新潜在药物激活或抑制生物学靶点的能力，可以获得它们的结合常数，并评估其可能的治疗活性。总而言之，通常需要在为机器学习模型构建拥有大量数据点，与仅使用可用最高质量数据以确保生成的算法是可信的之间寻求一种平衡。\n\
  \n最后一个重要的考虑因素是机器如何感知数据。作为人类，我们以各种方式感知信息，而我们通常认为这是理所当然的。目前的计算机并不那么幸运，我们需要以机器可以理解的方式将数据输入机器。这通常涉及将数据还原为机器擅长处理的数字字符串。考虑解释手写数字图像的例子，这是机器学习中处理多次的经典案例。人类可以轻松识别图\
  \ 2.2 中的数字。但要将这些图像输入机器，我们需要将每个图像分解为像素，并为每个像素赋予一个值，表示其在图像中的灰度值（见图 2.3）。\n\n图 2.3\
  \ 手写数字可以分解为计算机可读的值。在这个例子中，数字上应用了一个 12×12 的网格，根据每个格子中黑色的程度生成 0 到 1 的 144 个值。\n\n\
  但这与化学有什么关系呢？所有化学家都熟悉与图 2.4 类似方式呈现的化学结构。化学家不需要画图，可以通过电话或电子邮件描述化学物质的主要特征，但这样的描述可能没有我们想象的精确，而且对于机器学习来说显然不够精确。“化学指纹”经常被用来解决这个问题。化学指纹考虑了分子中化学特征的存在，并将这些转换为位字符串中的“开启（on）”位。这可以使用人类易于识别的特征完成，例如\
  \ MACCS 键中特定原子或官能团的存在，或者使用环形指纹算法。扩展连接性指纹（ECFPs）是其中一类，它们可以根据单个原子环境通过计算快速计算出来（见图 2.5）。\n\
  \n图 2.4 人类化学家可以轻松解读的手绘化学结构。人类化学家可能会识别出该分子为对乙酰氨林。\n\n图 2.5 对乙酰氨林分子分解为一组标识符，这些标识符可以通过计算“折叠”到预定义长度的位字符串。\n\
  \n用户选择一个半径，每个原子环境及其在该半径内的邻居被计算机转换为一个整数标识符。用户还选择了输出指纹的长度，计算机将标识符哈希到用户选择的固定长度指纹上。这对于机器学习非常有用，因为算法始终输出相同长度的字符串，无论输入的是哪种分子都能提供一致性。扩展连接性指纹通常用于药物化学，并通过考虑在\
  \ Tanimoto 相似性计算等程序中分子所共享的“开启”位数量来评估两个分子之间的相似性。然而，它们并不是完美的，因为通过解码 ECFP 来寻找父分子是不可能的，因为不同的功能可能会被哈希到同一个位上。这被称为位碰撞（见图\
  \ 2.6）。\n\n图 2.6 对于较大的分子和较短的位字符串长度，多个标识符可以折叠到同一个位上，导致碰撞和化学信息的丢失。\n\n一旦获得了用于机器训练的数据库，就可以为任务选择合适的算法并进行训练。\n\
  \n## 2.3 设置算法\n\n人工神经网络是基于动物大脑工作原理的机器学习算法子类。当你或我学习新信息时，我们大脑中的生物神经元之间会建立连接，允许随后的回想。生物神经元之间的连接被称为生物突触，它们在足够的电“推”下将信号从一个神经元传递到另一个神经元。这些穿过我们大脑的电信号允许我们思考和学习，这也是我们在考虑新的化学问题、经历痛苦或恋爱时，大脑某些区域“亮起”的原因。神经科学家可以使用称为电生理学的技术测量这些电信号，以识别在特定条件下哪些神经元或神经元组是活跃的。\n\
  \n人工神经网络使用人工神经元和人工突触（下简称神经元和突触）模拟这一过程。神经元组织成层，可以被视为数字的占位符。突触通过数学关系将每个神经元与前一层和后一层的的所有神经元连接。第一层神经元被称为输入层，最后一层是输出层，中间的任何层都是隐藏层（见图\
  \ 2.7](#BK9781788017893-00016.xhtml#fig7)).\n\n\n\n\n\n\n\n数据通过输入层馈网络，输出层显示预测或决策。在我们的图像分类任务中，每个像素都根据其灰度被分配一个数字。这些数字列表构成了输入。输出将是与每个图像代表的数值值相关的标签（参见图\
  \ 2.8）。在化学领域，例如我们可能希望训练一个神经网络，根据化学结构来预测化学品的固有溶解度。以化学指纹形式输入的化学结构可以作为我们的特征列表输入，而我们的标签则是实验测得的固有溶解度值。\n\
  \n\n# 图 2.8 如何从手写数字和化学结构中生成不同的特征。\n\n在开始训练之前，必须做出一些重要的决定，特别是关于正在构建的网络架构。神经网络有一个或多个隐藏层，每层包含一定数量的神经元。我们如何知道需要多少层？每层应该由多少个神经元组成？\n\
  \n这些问题的答案显而易见。事实上，ML 工程师通常会考虑许多不同的网络架构，通过试错来确定哪一种是。通常，更复杂的任务（具有更大的输入和输出层、高科学复杂性以及大型训练数据集）需要更深（更多隐藏层）和更宽（每层更多神经元）的网络。然而，事实并非如此，较浅且较窄的网络训练速度更快，因此能更快达到解决方案。这些网络也较不容易发生过拟合，这是我们稍后会讨论的现象。正因如此，ML\
  \ 工程师试图遵循奥卡姆剃刀原则，即简单的解决方案比复杂的更有可能是正确的。在 ML 中，对奥卡姆剃刀的搜索涉及尝试许多参数，并选择提供良好模型的最简单集合。\n\
  \n一旦确定了神经元和隐藏层的数量，就是时候考虑神经元之间突触的作用了。我已经提到过突触是一种数学关系，其中最简单的可以采取以下形式：\n\n\n这在 ML 中通常写为：\n\
  \n![image](img/eqn2-2.jpg)(2.2)\n\n其中 `w` 是权重，`b` 是偏置。在训练期间，ML 算法在每个训练步骤中改变权重和偏置值，这种方式希望能帮助它“学习”提供的数据中的模式。然而，如果所有突触都是线性函数，那么网络将无法学习。我们可能希望应用\
  \ ML 的几乎每个意义问题是非线性的，但这无法通过线性函数的线性组合表示。为了克服这个问题，在每个神经元处有两个处理步骤：计算所有输入突触信号之和，然后将结果通过“激活函数”以确定神经元的输出。使用非线性激活函数是神经网络能够学习并预测数据中非线性的关键原因。神经网络中使用的激活函数示例包括\
  \ `Sigmoid`、`Rectified Linear Unit (ReLU)` 和 `TanH` 函数（参见图 2.9）。\n\n![image](img/bk9781788017893-00016-f9.jpg)\n\
  \n# 图 2.9 三种广泛使用的激活函数：Sigmoid、ReLU 和 TanH。\n\n有用的激活函数数量不多，因此它们之间的选择通常通过试错来进行。有时，网络中的每一层都使用相同的激活函数，而其他时间则使用不同的。\n\
  \n## 2.4 训练过程\n\n我们已经构建了问题，选择了我们的数据，并设置了我们的网络。但是训练是如何运作的？首先要考虑的是，网络如何知道它的表现如何。\n\
  \n然而，如果所有突触都是线性函数，那么网络将无法学习。 (此处抱歉，由于原文逻辑似乎有跳，，重新按逻辑连贯翻译：)\n\n这些问题的答案显而易见。事实上，ML\
  \ 工程师通常会考虑许多不同的网络架构，通过试错来确定哪一种是。通常，更复杂的任务（具有更大的输入和输出层、高科学复杂性以及大型训练数据集）需要更深（更多隐藏层）和更宽（每层更多神经元）的网络。然而，事实并非如此，较浅且较窄的网络训练速度更快，因此能更快达到解决方案。这些网络也较不容易发生过拟合，这是我们稍后会讨论的现象。正因如此，ML\
