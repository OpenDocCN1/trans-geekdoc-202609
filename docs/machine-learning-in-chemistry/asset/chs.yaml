  ### 灵灵游戏\n\n在 60 年代初，有许多项目尝试使用模式识别算法来辅助识别航空照片中的目标物体。另一个早期的模式识别项目涉及人脸。Woodrow W.\
  \ Bledsoe、Charles Bisson 和 Helen Chan 在 Panoramic Research 开发了人脸识别技术。^(6,13) 在这项早期工作中，人类操作员提取了面部坐标，例如眼睛的位置。从这些坐标计算出一组距离，例如眼睛的宽度，并将这些距离存储在计算机中以与未见照片中的相同距离进行比较。返回最近的记录，使用`最近邻`^(14)\
  \ 计算来进行预测（参见图 1.5）。\n\n\n图 1.5 图灵测试。\n\n在`最近邻`模型中，新示例（蓝色星形）被放在与之前所有示例（其他形状）相同的特征空间中考虑。`最近邻`（双向箭头）或更常见的近邻集合（大圆）被用于对新的进行分类。在这种情况下，新示例与圆最贴合。\n\
  \n## 现代进展\n\n1970 年，这项工作由 M.D. Kelly 在斯坦福大学攻读博士期间进一步深化。^(6,15) Kelly 编写了一个计算机程序，该程序能够自动检测面部特征以用于身份识别，极大地减少了所需的工作量。\n\
  \n随后人脸识别软件的发展进展迅速。2007 年美国标准与技术研究院的一份报告显示了在不同光照条件下对七种最先进的人脸识别算法与人类进行测试的结果。^(6,16)\n\
  \n\n\n\n\n真正人工智能的一个目标是制造一种能够理解书面语言和口语的机器。这种机器将接近甚至通过图灵测试。从词汇和句子中获取含义，而不仅仅是识别它们的出现，是一项极大的挑战——正如那些有天赋学习第二语言的人所证证的那样。考虑这个简单的句子：\n\
  \n*“我没说过他偷了我的钱”*\n\n根据重点的不同，这句话可以有七种不同的含义：\n\n* ***我***从没说过他偷了我的钱 —— 是别人这么说的。\n\
  * 我***从没***说过他偷了我的钱 —— 我没说这件事。\n* 我从没***说***过他偷了我的钱 —— 我暗示过。\n* 我从没说过***他***偷了我的钱\
  \ —— 是别人偷了，也许就是他。\n* 我从没说过他***偷***了我的钱 —— 那只是借的。\n* 我从没说过他偷了***我的***钱 —— 是从别人那里偷的。\n\
  * 我从没说过他偷了我的***钱*** —— 他偷了别的东西。\n\n这甚至在我们提到那些真正疯狂的句子之前，例如使用 *“Buffalo buffalo Buffalo\
  \ buffalo buffalo buffalo Buffalo buffalo”*，利用 buffalo 一词的三种含义，通过八个相同单词的重复构建了一个语法允许的句子！\n\
  \n为了帮助计算机完成这项任务，我们将句子拆分为解析树——即表示句子及其结构的图表。由于某些句子有多个含义，因此它们也有多个解析树。这里的一个关键突破是使用概率来识别在给定语境下哪种含义是最可能的。这反过来又允许建立规则，规定哪些单词组合可以以何种顺序出现，从而确定从给定句子中哪些含义是最可能的。编码这些规则所需的海量规则使得编写这样一本规则书变得不可能。幸运的是，通过人类历史编纂的大量书面词汇使其成为下一节将涵盖的算法——机器学习（ML）的完美任务。\n\
  \n## 1.3 什么是机器学习？\n\n机器学习（ML）是人工智能领域的一个分支，特别是模式识别领域。机器学习算法是计算机程序，它们通过检查数据库，且在没有人类程序员显式指令的情况下，学习执行特定任务。这些算法可以回答什么类型的问题？\n\
  \n许多现代人工智能（包括机器学习算法）在训练时需要大量数据。它们还需要定义明确的问题，因为它们目前还不具备独立思考的能力。这将在下一节中进一步探讨，但我想深入研究机器学习世界中的几个例子来为此奠定背景。\n\
  \n首先，我将讨论我自己的研究，包括机器学习算法的发展。化学物质对人体会产生一系列影响。其中一些影响是有益的（例如药物的治疗效果），而另一些则不是。毒理学研究会调查这些不有益的影响，在开方新药、发布新洗发水或在农作物上使用新农剂之前，必须进行这些研究。这些研究的主要目标是确保新化学品对人类和环境是安全的，并考虑到使用的化学品数量（剂量或暴露量）。传统上毒理学研究是使用动物实验进行的，并根据这些测试推算出人类的估计剂量。然而，动物实验既昂贵又耗时且不符合伦理，而且人类和动物的生物学存在差异会影响结果。因此，现在毒理学领域正极力寻找不需要动物的方法；计算毒理学就是这些领域之一。\n\
  \n在我的研究中，我的目的是理解化学物质与人体内蛋白质和酶的相互作用如何导致毒性结果。通过计算机模型，可以在进行任何实验之前对新化学品进行评估。这种基于理解导致毒性结果的相互作用发生如何发生的机制毒理学方法，是解决毒理学问题的有效方法。这些快速且成本效益的计算结果可以后续进行细胞的特定*体外*实验分析，以提供进一步证据。通过利用先进的新计算技术（包括机器学习），毒理学可以成为一门更高效、更道德且更可靠的科学。\n\
  \n构建任何类型的计算模型都需要实验数据。幸运的是，已经对细胞进行了许多生物实验，并且结果广泛。诸如 `ChEMBL` [`https://www.ebi.ac.uk/chembl/]`((http://www.ebi.ac.uk/chembl/))\
  \ 和 `ToxCast` `https://www.epa.gov/chemical-research/toxicity-forecasting`) 等数据库收集了此类大部分数据并开源。这些数据可以为模型提供基础。\n\
  \n最初的建模方法包括使用结构警告，即在实验活性分子中比不活性分子中更常见的分子编码片段。虽然这个程序相对简单，但它在毒理学家中非常流行，因为它允许他们轻松识别出分子中导致计算机认为其具有活性的部分。该程序是非常透明的。此外，毒理学家还可以查看包含该片段的其他分子，这一过程被称为\
  \ `read-across`（类比法），在该过程中，当可以认为两个分子相似时，会将现有化学品的实验结果用于新化学品。在结构警告方法中，使用计算机程序识别用于构建模型的训练数据中的共同化学特征并将其构建到模型中。如果新化学品包含已知的活性特征，算法将将其预测为活性（见`图\
  \ 1.6`）。\n\n在第二种建模方法中，使用了早些在计算科学部分讨论过的量子化学计算。获取了 Ames 突变性试验的数据并对其进行了建模。考虑了几种经过实验测试的化学品，并计算计算了它们的活化能。结果显示与实验结果有良好的相关性——Ames\
  \ 阴性化合物计算出的活化能较高，而 Ames 阳性化合物计算出的活化能较低（见`图 1.7`）。\n\n\n\n\n这是符合预期的：Ames 阴性化合物具有较高的活化能，因此在正常生物条件下不会与\
  \ DNA 反应并导致突变。该研究使我们能够对可能呈 Ames 阳性、阴性及未知（处于中间不确定区域）的化学品建立活化能阈值，这些值未来可用于分类新化学品。\n\
  \n也使用了机器学习（ML）神经网络。这些研究涉及在 `Python 3` 中使用 `TensorFlow` 算法，以类似于结构警报的方式对分子进行分类（参见图\
  \ 1.8）。\n\n\n图 1.8 神经网络可用于预测分子生物学活性。\n\n开源受体结合数据用于训练神经网络，将分子分类为结合剂或非结合剂。这些网络是极其强大的预测器，显示出极高的预测准确性，优于结构警报。网络还能提供置信度估计，说明新分子与它已知的结合剂或非结合剂的匹配程度，这可以被视为预测确定性的衡量标准。\n\
  \n在毒理学中使用机器学习算法的一个缺点是难以理解为什么会做出某种特定的预测。与结构警报不同，训练过的神经网络不会指出新分子中使其产生活性的部分。这是我们一直试图克服的挑战，我们正通过相似性计算并检查网络以何种方式“思考”哪些分子，以便在预测过程中识别化学同类物。\n\
  \n另一个令人兴奋的机器学习案例可以追溯到 2019 年初。(22,23)领先的 AI 研究实验室 DeepMind 和电脑游戏开发公司暴雪（Blizzard\
  \ Entertainment）在 YouTube 上发布了一段 `AlphaStar` 的视频演示，该 AI 在《星际争霸霸 II》游戏中与职业人类玩家进行对战。DeepMind\
  \ 已经具有构建 AI 在`象棋`和`围棋`中与人类对战的经验，但《星际争霸 II》是一个完全不同的挑战，它展示了 AI 变得多么强大，以及它们未来有多大的发展空间。\n\
  \n为什么《星际争霸 II》比`象棋`或`围棋`更复杂？嗯，《星际争霸 II》是一种实时战略（RTS）游戏，这意味着玩家不是轮回合制，而是被要在策略上胜过对手并实时执行动作。此外，《星际争霸\
  \ II》比`围棋`或`象棋`更复杂，在任何给定时间提供的潜在移动要多得多，每局游戏的动作也更多。最后，玩家拥有不完全信息，因为他们无法时刻直接观察整个游戏区域，因此分析其他玩家可能在做什么非常有挑战性。这与玩家始终观察整个棋盘的`围棋`和`象棋`明显不同。由于这些因素，在\
  \ RTS 游戏中成功可以被视为迈向通用 AI 的一步，这种 AI 能够像人类一样解决各种问题。\n\n值得注意的是，在演示中，《星际争霸 II》经过了稍微简化，以辅助\
  \ `AlphaStar` 算法的训练和运行。只考虑了单张地图（而人类玩家预计要在各种不同的地图上进行游戏），且只使用了一个种族——星族（`Protoss`）（而\
  \ RTS 游戏通常有多个种族供选择，每个种族都有自己的优缺点和适用策略）。这使得 `AlphaStar` 与人类职业选手竞争时，完整《星际争霸 II》体验的复杂性降低了一些。尽管如此，`AlphaStar`\
  \ 在演示中也受到了限制。人们可能预期电脑通过在游戏中执行更快的动作而比人类玩家具有优势。与人类玩家不同，`AlphaStar` 不需要点击或按键来执行命令。DeepMind\
  \ 将 `AlphaStar` 的每分钟操作数限制在低于典型的《星际争霸 II》职业玩家的水平。\n\n`AlphaStar` 本身是一种神经网络机器学习算法。该算法以类似于人类玩家的方式观察游戏空间及其不完全信息，然后对采取什么动作做出决策。在感知信息时，`AlphaStar`\
  \ 使用了一种名为长短期记忆（`LSTM`(24)）的神经网络来做出决策（参见图 1.9）。\n\n\n图 1.9 显示 `LSTM` 神经网络的简单图示。`LSTM`\
  \ 是四种机器学习算法的组合（如蓝色框所示）。这些算法可以被视为一个做出整体决策的单元。它们使用当前输入、之前的输出和之前的单元状态来决定：(i) 忘记哪些之前的信息（遗忘门层），(ii)\
  \ 需要记住什么（新记忆）以及这些信息去向何处（输入门层），以及 (iii) 应该做出什么当前决策（输出决策）。当前的单元状态和当前输出再次用于过程重新开始。这种记忆和遗忘的能力使\
  \ `LSTM` 非常适合处理连续性任务，如游戏和语言识别。\n\n\n\n\n4. M. Brooks, *The Times Literary Supplement*,\
  \ 2017, [`www.the-tls.co.uk/articles/public/erwin-schrodinger-misunderstood-icon/`](https://www.the-tls.co.uk/articles/public/erwin-schrodinger-misunderstood-icon/).\n\
