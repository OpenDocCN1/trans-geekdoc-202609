    # 5.3. Evolution of cybercrime in Portugal


    In Portugal, under the generic term of cybercrime, a heterogeneous set of legal
    types of crime is included. These are not only the crimes foreseen in the Portuguese
    Cybercrime Law (Law number 109/2009¹), but also others described in the Penal
    Code and in separate legal sources. Besides these multiple legal categories where
    cybercrimes can be found, some offenses such as the case of OIT not being producing
    a wider phenomenon to which different types of crime apply apply. Therefore, as
    the Portuguese Cybercrime Office argues², the statistical quantification of cybercrime
    is not easy (2020) since judicial statistics aggregate crimes according to their
    legal types (for instance, cases and crimes against copyright), not considering
    autonomously or separately that occur online. A set of mechanisms has been used
    in Portugal to measure cybercrimes, as the existence of an electronic address
    (since 2016) where individuals can send complaints related to illicit activities
    that have occurred online. These complain are then forwarded to the competent
    authorities in Portugal. Therefore, the Portuguese Cybercrime Office has been
    producing reports based on complaints received since 2016. Concerning the evolution
    of cybercrime in the Covid-19 pandemic, the reports launched by this governmental
    institution showed a progressive and persistent increase in complaints received.
    For instance, considering only the period between January and May 2020 (corresponding
    to the peak of lockdown), the complaints were much higher (139% of increasing)
    when compared to the total numbers of 2019. Moreover, they also observed that
    April 2020 was the peak of received complaints, which started to decrease again
    in May. There were four main online offenses reported by the Portuguese Cybercrime
    Office: fraud with MBWAY payments³, fraud with email and SMS containing


