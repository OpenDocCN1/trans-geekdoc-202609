    target, explaining the worsening in the international rankings and the reports
    showing increases in cybercrime.


    # ## 6.6. Conclusion


    South Africa officially declared increase in a State of Disaster in March 2020
    in order to mitigate the rapid increase in Covid-19 infections. However, malicious
    actors were able to take advantage of the situation globally, targeting countries
    as they began a noticeable increase in infections. South Africa was no different,
    and a number of Covid-themed attacks began to emerge. This in itself does not
    indicate an increase in cybercrime, but rather an opportunity for a new level
    for criminals to entrap their victims. However, overwhelming threats illustrated
    an increase in cybercrime with South Africa ranking in the toped countries. Therefore,
    it has to be concluded that while there were shifts in cybercrime tactics, there
    was also a general increase in cybercrime during the pandemic. However, with a
    positive perspective, the South African legislative environment strengthened with
    the enactment of the Cybercrimes Act and the Protection of Personal Information
    Act becoming enforceable, both in 2021. However, these may have come too late,
    and the delays in introducing legislation could have contributed to South Africa
    being targeted during the pandemic. More private-public partnerships are necessary
    to build and increase capacity in both law enforcement and national security incident
    response, cyber defenders and public awareness to better equip South African organizations
    and citizens from present and future cyber threats.


