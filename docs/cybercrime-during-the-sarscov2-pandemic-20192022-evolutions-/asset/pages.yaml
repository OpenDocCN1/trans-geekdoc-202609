  img_proc: true
- pgno: 211
  md: '# 180 CyberCrime during the SARS-CoV-2 Pandemic (2019-2022)


    Three main facets are considered: changes in cybersecurity-related international
    rankings of South Africa; changes in South African legislation and regulations
    related to cybersecurity, crime, and the pandemic; and actual reports of incidents.
    The international rankings provide an indication of South Africa''s standing,
    and this can infer an improving or declining cybersecurity situation. Changes
    in legislation can signal an impact on the cybercrime environment as certain actions
    can be classified as cybercriminal, which needs to be considered during the analysis
    of incidents. The reported incidents give an indication to cybercrime activity
    and trends.


    Data sources include secondary data such as international reports and previous
    research, and this informs both the rankings and precincts trends. Qualitative
    analysis legislation and related commentary, and news reports of incidents, inform
    both the legislation and incident aspects.


    # 6.2. International rankings


    International rankings provide a useful measure to compare national "performance"
    for cybersecurity South Africa as the origin of complaints for the FBI''s Internet
    Crimes Complaint Centre (IC3), which is visualized in Figure 6.2. The table 6.1
    denotes the rank of the country within the top 20 nations from which complaints
    were received, and the lower value in the ranking, the worse the reported crime
    rate (i.e. the 6th highest number of complaints received). Some improvements can
    be seen from 2014 to 2017; however, there is a noticeable decline in 2020, with
    nearly four times the number of complaints, with South Africa jumping from 13th
    most complaints in 2019 to 6th most in 2020. This implies that there was either
    cybercriminal activity or a greater awareness of cybercrime, resulting in more
    complaints. Given that there was a decrease in the number of complaints from 2014
    to 2016, it can be assumed that there was already awareness and therefore an increase
    in cybercrime was the reasoning.


    The only other African country to appear on this list is Nigeria, which ranked
    16th in 2020 but has not appeared in any other reports since 2016 when it ranked
    19th [IC3 17, IC3 21]. This implies that South Africa is targeted more often than
    any other African nations.'
