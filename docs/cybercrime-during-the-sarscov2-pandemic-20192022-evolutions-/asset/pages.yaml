  md: '# Introduction


    Cyberspace is composed of several different layers that are essential to the functioning
    of an unconnected and functional network. The physical, software and informational
    layers, although the functional body, are of little interest to the political
    field. It is, on the contrary, the social stratum that concerns and interests
    politicians and political scientists in particular. This layer includes the set
    of individual behaviors interacting with cyberspace and a collective component
    that affects the policies, sufficient, institutions, laws, norms, regulating and
    framing the interactions and use of cyberspace. Despite the fact that cybercriminals
    may be interested in flaws in software or physical systems to commit their crimes,
    the social character is also fraught with vulnerabilities that each user is responsible
    for his or her actions in the cyberspace and that can be identified and exploited
    by cybercriminals. Considering that each cybersecurity practices are not always
    appropriate or sufficient, the user is simultaneously a potential victim and a
    system gateway. In that sense, systems are vulnerable from the very moment a user
    behaves unsafely.


    By virtue of its supranational character, the cyberspace is particularly difficult
    to govern and secure. Based on the amount of information that passes through the
    networks at all times, supervising and controlling information through and transactions,
    verifying content legitimacy and legality and processing complaints or incident
    reports within a reasonable amount of'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# x Cybercrime During the SARS-CoV-2 Pandemic (2019-2022)


    time, constitute major challenges for supervisory, governmental, industrial, public
    or private bodies. The detection and recovery phases can be affected by those
    capacity limits, making systems non-operational, or exposing them to multiple
    risks.


    Network security and protection are considered a shared responsibility between
    security and law enforcement agencies, government bodies, businesses, organizations
    and individuals. Several social changes have taken place in recent years with
    the increasing dependence on and use of cyberspace. Policies and surveillance
    do not always keep pace with the advances in this space. This is especially true
    in the event of a crisis such as the experienced by all the States during the
    SARS-CoV-2 (or Covid-19) pandemic in 2020.


    During this crisis, cyber risks and cyber threats seem to have increased. Cyber
    risk is the product of the level of threat with the level of vulnerability. While
    cyber risk determines the likelihood of a successful cyber attack [SAN 22], cyberthreat
    represents a potential violation of security, which exists when there is a circumstance,
    capability, or event that can breach security and cause harm [SAN 22]. These two
    notions are fundamental, the cyberization that societies have experienced over
    the past 20 years has contributed to the complexity of cybersecurity issues. In
    2001, U. Beck heralded that the social production of wealth is accompanied by
    the social production of risks [BEC 92]. The SARS-CoV-2 pandemic in 2020 and its
    following multidimensional crisis (social, economic, political, etc.) represent
    a contextual window, which perfectly illustrates the risk society that Beck referred
    to, featuring the multiplication and diffusion of systemic and cross-sector risks
    resulting from technological and industrial developments. Globalization and the
    expansion of cyberspace increase such risks [BEC 92]. During this period, cybercrime
    evolved in a context of globalization and hybridization.


    Cybercrime research primarily focuses on two broad categories of crime:


    +   - Organized cybercrime, large-scale cyber attacks, could be part of the more
    general framework in the study of major crime. Jean-François Gayraud proposes
    four main characteristics for appraising “major crimes":


    +   - i) major crime is chiefly manifest by polycriminality; major criminal groups
    are opportunistic and pragmatic in criminal markets, meaning that they do not
    necessarily develop a specialization of their criminal practices;'
  merge: -1
  img_proc: true
- pgno: 12
  md: '- ii) these groups are territorialized, rooted in a space that allows them
    to create their own biotope, setting up hermetic enclaves inaccessible to the
    public authorities; this favors the territorialized and immaterial expansion into
    the cyberspace;


    - iii) these groups and organizations are considered unsinkable; this is because
    they are highly adaptable to socioeconomic changes and resistant to repression
    by the public authorities or well as the competition from other criminal groups;


    - iv) finally, these groups have a major macroeconomic impact since they manage
    massive, globalized and interconnected financial flows, which facilitate and stimulate
    corruption, as well as the laundering of illicit income [GAY 21].


    - The scope of cybercrime and its study is not limited to organized crime, but
    includes everyday life, ordinary criminal acts, as well as online defamation,
    violent extremism and hate speech on the Internet and social media [BEN 22], radicalization
    [ALA 21], disinformation [PAR 20], etc., which are all common forms of cybercrime.


    Major criminals and ordinary cybercrime play a crucial role in what might be termed
    a “criminological diffuse background”, whose omnipresence and pervasion in the
    cyberspace act as the basis for many illicit practices of interest to cybersecurity
    [BRE 10]. As a result, cybercrime benefits from an immense market bringing together
    the supply (of software, services and available techniques in the cyberspace)
    and the demand from criminal or non-criminal organizations, states and individuals
    whose goal is to exchange a good (data) by means of an increasingly dematerialized
    and fungible currency: the cryptocurrency [BAD 20]. While the aggregation of these
    characteristics has facilitated cybercrime, what can be said about the crisis
    context in 2020?


