    # 3.3. Internet connectivity and violent militancy


    Radicalization is understood here as the process by which individuals evolve from
    the adoption of antagonistic views against people, ideologies or institutions,
    to actual participation in violence aimed at intimidating or coercing a civilian
    population [HUN 20; ALL 21; DEF 21]. It is unquestionably the case that online
    radicalization can be understood with reference to the methodological framework
    of social-movement theory. As Bleakley [BLE 20] has shown, present-day online
    militancy mirrors the basic attributes seen in the militant movements of the Internet
    era, such as the Weather Underground, a violent offshoot of the Vietnam War-Students
    for a Democratic Society. He points out that militant movements of the Internet
    continue to follow Jürgen Habner’s “paradigmatic shift from movements focused
    on economic parity towards those seeking to address non-tangible issues associated
    with human rights” [BLE 20]. Moreover, Internet-era militant groups continue to
    rely on the collection of collective identities that operate as chambers to foster
    shared group identities. These identities help promote a rigid tunnel-vision approach
    to issues that are of concern to militant groups. As Khalil posits, online militant
    settings “function similarly to real-world social spaces in that they can provide
    identity, validation, community and meaning” [KHA 21]. Moreover, online militant
    groups employ these settings as propaganda platforms to attract various levels
    of support and to “shape[e] wider public perceptions of the movement” [BLE 20].


    The above trends are hardly new. They were first observed by social science researchers
    as early as the mid-1990s, when militia movements in the United States were found
    to be utilizing interconnected computer systems to build “an imagined network
    community [...] and expand” [ZOO 96]. Yet, recent research has conclusively demonstrated
    the existence of a significant positive correlation with the increase of Internet
    connectivity and the growth of domestic militancy in post-industrial democracies'
