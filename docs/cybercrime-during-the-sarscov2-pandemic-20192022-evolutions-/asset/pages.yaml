    had an impact on the fear of online crime. However, Yu (2014) did not find any
    significant relationship between those variables.


    To conclude, it is important to take into consideration the main results concerning
    the relationship between technical skills and the fear of online crime. It has
    been hypothesized that the absence of technical skills may increase the risk judgments,
    since individuals perceive themselves to be more vulnerable than others who are
    more skillful. While Virtanen (2017) found a negative relationship between these
    variables, Martins (2018) observed that individuals who were considered to have
    less technical skills reported higher levels of fear of OIT victimization.


    # 5.6. The present study


    The main objective of the present study was to understand the impact of the Covid-19
    pandemic on (i) OIT victimization and (ii) fear and perceived risk of OIT victimization.
    To achieve these goals, a survey previously developed by Guedes et al. (2022)
    was administered to a large sample, adding two groups to the original survey.
    Therefore, data for the current study was obtained in two phases. The first (pre-Covid-19)
    was collected in 2017 through an online self-report anonymous survey, disseminated
    both by the University of Porto (students and staff) and social media channels
    (N = 831). In 2021 (post-Covid-19), the same online survey was administered to
    a sample of 730 individuals, following the same mentioned sampling strategies.'
