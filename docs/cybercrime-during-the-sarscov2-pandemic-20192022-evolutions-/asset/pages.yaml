  md: '# #1 The Evolution of Cybercrime During the Covid-19 Crisis


    # ## 1.1. Introduction


    Since the early months of 2020, several publications have addressed the impacts
    of the pandemic on the evolution of cybercrime.


    In March 2020, the US Congressional Research Service (CRS) published a brief report
    on the subject [FIN 20]; in April 2020, UNOD warned against the risks specifically
    related to the new pandemic context [UNO 20]; followed by the French Senate [SEN
    20] during the same month. In June 2020, the international organization Global
    Initiative against Transnational Organized Crime [MAH 20, WIG 20] and Interpol
    [INT 20] (by means of a survey studying 192 countries) produced numerous reports,
    whose analyses converged on various points:


    +   - the pandemic was a context favoring the acceleration of cybercrime;

    - during lockdown, an increase was observed in crimes in cyberspace, both as "cyber-dependent
    crimes" and "cyber-related crimes";

    - a considerable increase in cybercriminal activities related to Covid-19;


    Chapter written by Daniel VENTRE.


