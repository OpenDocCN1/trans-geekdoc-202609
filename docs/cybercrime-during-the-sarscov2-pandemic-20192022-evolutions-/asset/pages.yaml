  md: '# The Evolution of Cybercrime During the Covid-19 Crisis 35


    - Connection time versus use transformation: Before the pandemic, citizens already
    spent a lot of time online. Due to the high penetration rate of mobile telephony
    in the world, before the crisis, citizens were already practically connected at
    all times. Thus, it is not much the connection duration that evolved with lifestyle
    changes, but the nature of the services involved (teleworking applications, videoconferencing,
    online courses, as well as e-commerce, online games, etc.). Hence, the most important
    variable is not the “connection time”, but the “online uses, applications” variable.


    - Longer time spent by citizens in unsafe places in cyberspace: The nature of
    the place (and the time spent in that place) in which the potential victim moves
    is one of the key factors when considering the degree of exposure to risk. During
    lockdown, the daily life of citizens changed location (from the outside, from
    the company, to the home), but was not the fact of staying at home particularly
    as a condition to risk exposure. It was the fact of accessing systems, networks
    and applications, which were poorly and badly secured or not secured at all, of
    accessing parts of cyberspace which are risk sources (because they were hacked
    by cybercriminals), exposing ourselves to data theft by e-commerce sites, etc.
    By using parts of cyberspace that are high-risk areas, Internet users increasingly
    exposed themselves. What differentiates practices in business at home is the level
    of security of connections, the applications used and the prohibitions or constraints,
    which can be imposed on businesses and forbid access to places in cyberspace which
    are at risk.


    - For cybercriminals, the effort to adapt to the new context was marginal: In
    times of crisis, there was at least an adaptation of cybercriminal tactics. The
    thematization¹⁷ [CIS 20]. Existing cybercrime tools and attack methods remained
