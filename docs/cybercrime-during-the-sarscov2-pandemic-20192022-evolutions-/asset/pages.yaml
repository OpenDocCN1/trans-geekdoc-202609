  md: 'digital technology had to be a tool for creating dearest social ties at a time
    when individuals were forbidden from the slightest face-to-face relationship,
    it had to take citizens out of their isolation and help cope with situations which
    had only existed in works of fiction until then (the all-pervading images of deserted
    cities and millions of individuals at their windows, cloistered by force, awaiting
    liberation).


    While digital technology has contributed, in its own way, to the global effort
    to fight the spread of the virus, it has also exacerbated the already high degree
    of dependence on societies communication technologies, in particular the Internet
    and cyberspace.


    Did cybercrime feed on that particular context, taking advantage of such dependence,
    those vulnerabilities and the increase in the use of digital technology? As the
    above-mentioned indicators have shown, the crises in the world are multiple at
    a time, simultaneous, distributed within the entire international system. These
    are all contexts in crime, and consequently cybercrime, can evolve. This point
    will be essential in the present analysis: Covid-19 cannot be considered as a
    single, isolated crisis. It would be more accurate to refer to Covid-19 “crises”,
    in the plural form, to refer to the crises resulting from the epidemic, its management
    and its effects on societies. These crises are added all those having existed
    before and during the Covid-19 epidemic, an event which took place in a world
    animated by Wie. Crises coexist, become interlocked, can be triggered by the tensions,
    conflicts and calamities and which is still immersed in discord. The pandemic
    itself, or preceding it, for other motives, may also become interdependent, producing
    effects on one another: the epidemic did not spare the already facing wars, other
    diseases, economic difficulties. In addition to the displacement of populations
    due to the climate crisis or to wars or economic or political crises, citizens
    had to cope with the effects of the pandemic itself. Cybercrime erupted into societies
    hitherto affected by multiple crises to varying degrees. One cannot consider the
    evolution of cybercrime in the light of the crises strictly related to the Covid-19
    pandemic, but should integrate them into a broader context made up of multiple
    crises, to which the pandemic was added.'
