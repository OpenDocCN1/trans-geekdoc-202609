    unprecedented experience of the coronavirus pandemic has only strengthened this
    view. Researchers point to – among other variables – the striking speed with which
    the accelerationist rejection of Covid-19 mitigation measures emerged in online
    social-media ecosystems, such as 4chan, Reddit, Facebook and YouTube. Subsequently,
    in efforts to evade growing restrictions imposed by these platforms, the amorphous
    movement proceeded into non-mainstream corners of the social-media universe. This
    led to an unprecedented period of growth for new social media platforms, such
    as Parler, Gab, Signal, WeWe and TRUTH Social, which practice very limited content
    moderation. In the ensuing period, these self-described “alternative” platforms
    have essentially operated as online safe havens for the recruitment, training
    and coordination of various types of violent extremists, ranging from DVEs to
    constitutional militia members. In short, the Internet has been operationalized
    by radical accelerationists as a criminogenic environment, leading to the disinhibition,
    mobilization and activation of large numbers of users [HN 20]. Within this broader
    sociopolitical context, Covid-19 deniers are not simply finding refuge in online
    safe havens but are also transitioning with unprecedented speed toward real-world
    criminal activity. According to United States government reports, QAnon and anti-vaccine
