  md: '# xvi Cybercrime During the SARS-CoV-2 Pandemic (2019-2022)


    distributing resources to some local communities. Though anti-drug efforts continue
    at the state and federal level, officials within the government have largely sided-secured
    security in favor of prioritizing pandemic response Facing the mask crisis [WAN
    20], mask shortages and the inability to ensure sufficient industrial production,
    criminal actors rushed into the breach, hoping to take advantage of the expectations
    of populations. Criminal cyber-operations on the theme of Covid, masks and drugs
    have been carried all over the world [EUR 20a].


    The link between crime and crises has the subject of numerous studies, particularly
    borrowing from the economic theory of crime [DEF 11], but also focusing on other
    categories of crisis such as war, political crises and disasters. For example,
    Kontula [KON 97] considers that crime occurring in exceptional circumstances is
    marked by predatory behavior, the erosion of moral wealth and the reduction of
    punishment, as well as the loss of control of the situation by security actors.
    UNODC [UNO 12] argues that economic factors are important in the evolution of
    crime. But the analysis diverge; when addressing the effects of the 2008 international
    financial crisis, Kurtz [KUR 15] concluded there was no close relationship between
    the two phenomena. In Russia, on the contrary, periods of economic turbulence
    coincided with an upscale in criminal activity in 1998, and later in 2008–2010
    (economic crises and crimes against property to have been highly reactive to changes
    in economic conditions) [IVA 12]. “Peaks” in criminal activity may occur during
    periods of economic crises or “economic stress”.


