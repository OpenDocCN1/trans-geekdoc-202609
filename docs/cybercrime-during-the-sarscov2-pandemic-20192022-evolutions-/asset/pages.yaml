  md: '# Introduction


    significant victimization of people aged 50 and over (less equipped to digitally
    defend themselves and with poorer cyber-hygiene) was observed during the first
    lockdown wave. Cybercrimes as pandemic-themed targeted frauds were particularly
    used by cybercriminals.


    On the whole, there seems to have been both an increase in the number of delinquents
    motivated by the money and the recreational dimension and the presence of targets
    meeting the goals of delinqudelending, especially those lacking well-established
    security habits. To this should be added the fact that areas affected by companies
    from private companies and government agencies. Unavoidable teleworking forced
    employees to focus their attention on helping employees transfer work to their
    homes, but overlooking network securitization. As security was not necessarily
    ensured by cybersecurity services, the responsibility of monitoring a large part
    of the network was entrusted to the police services. Regarding this point, Dupont
    explains that classic police methods and arrest methods are proving insufficient,
    as they are too slow to produce tangible results on a large scale. They are most
    effective when combined with innovative damage prevention and mitigation strategies”
    [DUP 20].


    However, the impacts of forced lockdown were too rapid to deploy preventive measures.
    For example, mitigation advertising campaigns were launched in March and the beginning
    of April 2020 in Canada. The reduction in network protection capabilities and
    resources was a corollary effect of the first lockdown phase.


    Several authors have based their analyses on the routine activity theory in order
    to account for the particular structure of opportunities having arisen as a result
    of lockdown regulations in the United States and the Canadian provinces. The increase
    in the attack surface, in the number of cybercrime actors with diverse motivations
    and resources, and network monitoring issues have all been mentioned as factors
    influencing user and network vulnerability. Added to this is the great adaptive
    flexibility of criminal groups, as described by Gayraud, which has facilitated
    the activity adaptation of such groups to the global pandemic context, by relying
    on the “diffuse criminological background” of cyberspace.'
