  md: '# The Evolution of Cybercrime During the Covid-19 Crisis


    phenomena with any other event or potentially explanatory variable, such data
    may still prove invaluable.


    In particular, they make it possible to observe changes in the long run, not only
    within a reduced time frame (2020–2022): what about the impact of the pandemic
    period on the general evolution of cybercrime trends?


    The data published by the Indian Ministry of Home Affairs include:


    +   - the number of registered cases;

    - the number of individuals arrested.


    Data are provided for each state and distributed via the two main legal corpora:
    the Information Technology (IT) Act and the Indian Penal Code (IPC). For each
    corpus, the number of cases is distributed following each cybercrime category.
    Demographic data are also provided (age brackets of the individuals arrested).


    Those data offer a view on the geography of cybercrime and its demographic aspects
    (age brackets and the evolution of age categories in time and space). The analyst
    can also deduce the average number of individuals involved per case handled, capture
    the most widespread forms of crime and detect which legal corpus is the most often
    summoned in the fight against cybercrime (IT Act versus IPC).


    At the time of writing these lines, the series of reports stops at the year 2020,
    which only offers a partial vision of the developments that may have occurred
    during the pandemic period. However, the level of detail of the available data
    may be deemed sufficient for a preliminary analysis.


    If the official statistics are to be credited, the first year of the pandemic
    was not accompanied by a radical increase in cybercrime. For all categories, growth
    started taking shape around 2010. The number of cases falling under the IT Act,
    the main corpus concerning cybercrimes, even recorded a slight decline in 2020.
    In this case, it may be interesting to access monthly data, which could provide
    a more accurate assessment of the link between the various phases of the pandemic,
    its impact on society and the (concomitant) evolution of cybercrime.'
