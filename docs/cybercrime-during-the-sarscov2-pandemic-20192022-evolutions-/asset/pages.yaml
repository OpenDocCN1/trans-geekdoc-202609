    # ## 1.2. Observing the evolution of cybercrime


    The guiding question to be analyzed will be: Is there a correlation between the
    evolution in cybercrime trends and the various phases of the pandemic?


    This chapter postulates that the evolution of cybercrime can be explained, at
    least in part, by the uses of cyberspace, themselves resulting from a change in
    lifestyle imposed by the pandemic and the various national measures enforced to
    manage the health crisis. Two types of data will be compared: those relating to
    the evolution of cybercrime and contextual data (the restrictions imposed on citizen
    mobility being one of the essential markers of lifestyle changes occurring during
    this period, for which mobility data will be leveraged).'
