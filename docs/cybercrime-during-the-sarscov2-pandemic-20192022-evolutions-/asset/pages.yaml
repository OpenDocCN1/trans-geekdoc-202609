  md: 'Due to its lethality and morbidity, and to the disruption of societies’ working
    mechanisms, the Covid-19 pandemic is considered “a public health crisis without
    precedent in living memory [...] which brings with it the third and greatest economic,
    financial and social shock of the 21st century, after 9/11 and the Global Financial
    Crisis of 2008” [OEC 20]. According to the OECD report, the “shock” occurred at
    several levels:


    +   - a halt or slowing down in production in countries affected by the pandemic
    and the lockdown phases;

    - a disruption of supply chains across the world;

    - a steep drop in consumption;

    - a collapse in “confidence” (which is reflected in the fluctuations of financial
    markets confronted with a scenario of extraordinary uncertainty);

    - the significant loss of human life;

    - proof of the stark weaknesses of healthcare systems around the world, including
    in the richest countries.


    Other elements could be added to this list, such as the emergence of conspiratorial
    and anti-vaccine movements.


    This reveals the *presence of at least* two types of crisis whose effects are
    combined: a health crisis together with an economic and financial crisis.


    # I.1.2. The concept of “crisis”


    The term “Covid-19” was quickly associated with that of “crisis”.


    Crises are particular moments of tension, during which certain phenomena or processes
    are exacerbated. The definitions of “crisis” highlight some of these characteristics:
    “the emphasis is on the idea of a sudden and intense manifestation of certain
    phenomena, signaling a rupture”; “a sudden and intense manifestation, whose duration
    (of a state or behavior) is limited, potentially leading to harmful consequences”;
    “a disturbing situation, due to a disruption of balance and whose outcome is decisive
    for the individual or society”; “a situation of deep unrest in which society or
    a social group is immersed, giving rise to fear or hope for a'
