    at the pandemic onset. Losses associated with cybercrime also increased. These
    increases were accompanied by an evolution of cybercrime as a consequence of the
    crisis. This development was noticed in the targets aimed at health research centers,
    hospitals and government measures (through impersonation or identity theft). Responding
    to the crisis became priority and potentially more lucrative targets for malicious
    actors. Their modus operandi also changed, increasingly resorting to ransomware
    and phishing. Paradoxically, even the decreasing number of cybercrimes caused
    more losses than it had done in the previous years. The strengthening of cybersecurity
    measures (two-factor authentication, for example [MER 21]) or the introduction
    of new measures (digital identity, for example [GRI 22]), and raising awareness
    about better computer hygiene hygiene


    There was an undoubt increase in cybercrime and a change in the practices of malicious
    actors during the pandemic crisis. The targets of these criminals gained, aiming
    not only at the key sectors of the economies of the two states (the pharmaceutical
    sector, among others, and critical infrastructure) and their societies (notably,
    the hospital sector), but also organizations in a more destructive way than they
    had done in the past, through the use of sophisticated ransomware like the Conti
    Group ransomware [INT 21]. Individuals, for their part, became victims of large-scale
    phishing campaigns set in the context of the pandemic crisis rather than of other
    types of cybercrimes.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# SARS-CoV-2 and The Evolution of Cybercrime in the US and Canada


    Nevertheless, in this analysis, one element deserves a nuance, namely the fact
    that it concerns two federal states which are divided either into federated states
    or provinces, inducing a variation between lockdown periods, as well as regulations
    and work-from-home orders and other health measures, not to mention the efforts
    to combat cybercrime. Thus, the reports consulted are also inaccurate, that they
    provide general and unique data at a national scale for the United States and
    Canada, but little information on the federated levels. This results in a poor
    differentiation between states or provinces when disclosing cybercrime information.
    It is difficult to precisely pinpoint where, in states or provinces hard by the
    pandemic, there was an increase (or not) in cybercrime compared to other regions
    spared by the pandemic. These considerations are conducive to general assumptions,
    which potentially come from the interweaving of several reliable pieces of information,
    but which are still imprecise to enable a fine and detailed comparative analysis.


    Although law enforcement agencies in Canada and the United States cooperated with
    one another and with Interpol, the demographic disparities between these countries
    reflected in the different cybercrime statistics should not be overlooked. In
    other words, the United States seems to have a more attractive target for malicious
    actors than Canada. As of July 31, 2020, the United States had approximately 326
    million inhabitants for an Internet penetration rate of 95.6%, while the Canadian
    population was approximately 37 million inhabitants, with a penetration rate of
    89.9% [INT 20c]. This disparity was evident in the number of cybercrime victims
    who filed complaints with the CCC and IC3 services. For example, in 2021, Canada
    recorded 5,788 victims of cybercrime, while the United States figure 4,661 according
    to the IC3 [INT 21].


    In fact, the main concern for conducting the analysis is the lack of sufficient
    quantitative resources over the long term and on a basis. The accuracy of the
    available data can only be computed by an annual breakdown. Additionally, the
    categories of crimes listed change from year to year, as was the case with the
    IC3 2021 report. These information gaps undermine a precise and clear analysis
    on the conclusions to be drawn as to the exact causes of cyber risks due to cybercrime
    and the cybersecurity issues observed in North America. It is difficult to discriminate,
    for example, whether it was the shift to teleworking or the crisis as a whole
    provoked the changes observed in cybercrime, although the former is inevitably
    part of the latter, necessarily forcing the'
  merge: -1
  img_proc: true
- pgno: 103
  md: 'hazardous correlation between these two variables. Any conclusions drawn will
    suffer from these gaps.


    This being admitted, several questions remain unanswered to the future of the
    fight against cybercrime. Firstly, will the measures to combat and monitor cybercrime
    (de-escalation measures, prevention, etc.) during the pandemic remain as important
    once the crisis has been mitigated? Once the crisis passed or is overtaken by
    other crises, will international monitoring and cooperation mechanisms, whether
    between states or the public and private sectors, continue? Secondly, will this
    opportunity to cooperate between states (by means of the harmonization of policies,
    resource allocation, coordination meetings, etc.) leave a mark on international
    relations by deepening the norms and international law in the fight against cybercrime?
    As the crisis set a precedent, it would be logical for cooperation and collaboration
    to persist beyond the context of the crisis and to reduce the divergence of interests
    between states in the long term. One way out be to simply get states to ratify
    the 2001 Cybercrime Convention and have updated it so to match the incredible
    developments which have taken place in cyberspace [PET 21]. Thirdly, the pandemic
    crisis and the reflections it generates become opportunity to create a consensual
    international lexicon on the notions covered by cybercrime, including a typology
    of cybercrimes? Cybercrime continues to increase, year after year, both in terms
    of the number of victims and in terms of estimated losses. What will the tolerance
    threshold of governments and societies endangered by this transnational phenomenon
    be before the recourse to international cooperation deemed a feasible solution?
    The improvement of international statistical data in view of obtaining a clear
    and global portrait would be a first step in this and a major asset in the fight
    against malicious actors. For the moment, in the current international context,
    it seems that the answers to these questions range from the improbable to the
    impossible [KAT 21].


    # 2.6. Conclusion


    This chapter posed the following question: how did the SARS-CoV-2 pandemic and
    its aftermath affect cybercrime in the United States and Canada? It is possible
    to conclude that, in broad terms, the pandemic crisis and the various government
    measures had an impact on cybercrime in Canada and the United States from the
    pandemic onset in North America'
  merge: -1
  img_proc: true
- pgno: 104
  md: 'March 2020 until 2022. It is also possible to affirm that cybercrime increased
    and was transformed, targeting sectors and institutions of interest associated
    with the pandemic. It took maximum advantage of the fear generated by the uncertainties
    of the pandemic, targeting increasingly vulnerable Internet users. However, it
    is difficult to draw a difference between the “natural” increase in cybercrime
    and the increase exclusively due to the pandemic crisis because there is a lack
    of concluding evidence.


    To arrive at this answer, research had to face significant methodological challenges
    which nuance the implications of these findings. One of the methodological challenges
    affecting research lies in the accessibility, the very existence of resources
    and the quality of data about cybercrime. In fact, it was above all the lack of
    reliable, regular and long-term resources which posed a problem for evaluating
    the phenomenon. Indeed, the reports from the Canadian and US government agencies
    are generally published annually. However, these reports have little hindsight,
    be it quantified or qualitative, over several years, in relation to the phenomenon.
    This undermines the possibility of making clear quantitative or qualitative comparisons
    over the long term, and sometimes even, from year to year.


    Not is is a variability in the access to data, but also a variability provoked
    by the vocabulary used in the reports, which directly affects the quality of the
    data available. While cybercrime does not yet have a consensual definition at
    the academic level [DEC 20], the same is true on the operational level. Although
    cybercrime, a cyberattack and a cybersecurity incident are all different phenomena,
    they are difficult to discern empirically due to a “diffuse criminological background”.
    These different types of operations are often confused in the reports, which make
    the data decreasing increasingly accurate. This is, in part, not only due to the
    legal qualification of crimes which differs from one jurisdiction to another,
    from state to state, but also due to the data collection mode [DEC 20], not to
    mention the potential absence of denunciations to the police services. The filing
    of a complaint only lists the crimes or incidents reported, whereas the data collected
    from sensors on the networks only focuses on the cyberattacks they detect. Finally,
    there are also the states that cooperate more or less with international institutions
    in the fight against crime, such as Interpol. In its 2020 report on cybercrime
    and the pandemic, this institution – composed of 195 member states – mentioned
    that 23 out of 35 states in the Americas responded to the organization’s requests
    regarding cybercrime [INT 20b]. Another major obstacle lies in the different methods'
  merge: -1
  img_proc: true
- pgno: 105
  md: 'used by the responsible agencies for compiling and recording complaints. For
    example, IC3 reports warn that a filed complaint may include several cybercrimes,
    and some complaints can thus be filed and recorded several times, creating unwanted
    duplicates [INT 21].


    In the light of this chapter, it is possible to observe an adaptation of criminal
    practices in cyberspace to the pandemic context, since the beginning of 2020 until
    now. There was also an increase in cybercrime during the same period. Government
    anti-cybercrime agencies and private cybersecurity firms clearly noticed. Despite
    This observation, the lack of conclusive data, it is impossible to state that
    the adaptation of malicious actors and their practices were solely and clearly
    caused by the pandemic crisis. It is just as difficult to affirm that such an
    increase was mainly multifactorial and in this etiological complexity, it is difficult
    to isolate the preponderance of the causes explaining the increase and adaptation
    of cyber criminality. The global and real portrait of cybercrimes and cyberattacks
    still remains inaccessible to research.


