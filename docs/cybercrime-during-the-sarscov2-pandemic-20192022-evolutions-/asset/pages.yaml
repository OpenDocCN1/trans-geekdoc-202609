  md: '# 3

    Online Radicalization as Cybercrime: American Militancy During Covid-19


    # 3.1. Introduction


    On January 6, 2021, a swarming amalgamation of far-right militants, self-styled
    “digital soldiers” [FED 21] and followers of an obscure online persona known as
    Q, participated in a mass insurrection that targeted the United States Capitol
    Complex. During the attack, which has no precedent in US history, the insurrectionists
    sought to disturb the nation’s Constitutional order, in the belief that the incoming
    administration of President-Elect Joe Biden was illegitimate. In the process,
    they vandalized the federal bicameral legislature of the United States, while
    parading in its corridors dressed in paramilitary apparel and waving Confederate
