    These considerations feel reflection on the evolution of national legal norms
    (as opposed to international norms) and the local/national dimension of the security
    organization (police, justice) [HOR 21].


    Cybercrime is thought to have been particularly “effective” or active due to the
    convergence of several factors: the online presence of a greater number of Internet
