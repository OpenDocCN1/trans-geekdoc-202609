    The results concerning the relationship between victimization and fear of traditional
    crime have been mixed (Hale 1996). Regarding cyberspace, few studies have analyzed
    the relationship between victimization and fear of online crime. For instance,
    Alshalan (2006) found that prior victimization increased the levels of fear of
    cybercrime, and Randa (2013) observed that previously bullying heightened the
    fear of online crime. Accordingly, Henson et al. (2013), Virtanen (2017), Lee
