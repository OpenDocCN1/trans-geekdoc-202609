    # 2.4. The evolution of cybercrime in North America during the pandemic


    Among all the government measures taken to combat the pandemic and its impacts,
    lockdown was one of the most significant and effective measures. Significant in
    terms of the restrictions on freedom of movement in order to limit the circulation
    and retransmission of the SARS-CoV-2 virus, this upheaval led to a shift of activities
    to the virtual space, notably, teleworking. Cyberization has increased suddenly
    and sharply, transferring work and study from home to digital spaces locking cyber-adapted
    and sufficient safeguard to enable user protection from virtual threats.


    For example, in April 2020, in Canada, 67% of people with a higher education degree
    were working from home, compared to only 8% in 2018. For people whose highest
    educational level is school or less, this rate rose to 16% over the same period,
    compared to 2% two years earlier [TAH 21]. As previously stated, the diversity
    and extent of lockdown experiences in Canada and the United States being highly
    contrasting, it seems of little use to extensively describe this in chapter. The
    purpose of this chapter is rather to describe the impact that the pandemic and
    the different lockdown experiences had on cybercrime in North America.


