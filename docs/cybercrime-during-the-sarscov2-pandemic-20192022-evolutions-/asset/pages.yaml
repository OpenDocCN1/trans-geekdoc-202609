    #  5.7. Conclusion


    The results of the present study, developed in the Portuguese context, suggest
    that self-reported OIT victimization (both direct and indirect) increased during
    the Covid-19 pandemic. These results are in accordance with previous studies that
    analyzed police reports of online fraud (e.g. Buil-Gil et al. 2021; Kemp et al.
    2021) but also with the conclusions presented in the multiple national and international
    reports on cybercrime trends during the Covid-19 pandemic. In fact, individuals
    started more time on the Internet, and expanding the frequency and variety of
    activities online, such as leisure, work and financial tasks (as it was observed
    in the present study). Everyday routines activities, moving from the physical
    to the online space, may have increased the opportunities for cybercrime to occur.
    Our results also showed that not only have online activities increased, but differences
    on specific forms of payments were observed, which may be associated with the
    victimization of OIT. For instance, 34.5% of the pre-Covid sample used credit
    cards, 56.5% to use this form of payment in the post-Covid sample. Home banking
    has also increased substantially, from 25% to 34.9%. Previous studies have found
    a relationship between specific forms of payments and online victimization. For
    instance, Alshalhan (2006) concluded that the more people divulge their credit
    or debit card number, the more they are at risk of becoming victims of cybercrime.
    Nevertheless, MbNet decreased from 32.9% to 16.1%, which may be explained by the
    high prevalence of users of MBWAY as a payment of. Interestingly, in spite of
    only 2.3% of the individuals of our study reporting to have been a victim of MBWAY
    fraud, this, during the Covid-19 pandemic, one of the most reported crimes in
    the Portuguese context.


    The results of present study also showed that, contrary to our expectations, there
    was a decrease in the risky activities by the individuals in the post-Covid sample.
    In fact, individuals opened less dubious links compared to the pre-Covid sample,
    which may be associated with the increase in a specific guardianship behavior
    adopted by individuals observed in the results, that is, the search for more education
    and information about cybercrime. Therefore, in future studies it will be relevant'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'to explore the relationship between the adoption of online risky activities
    and guardianship behaviors (e.g. Leukfeldt and Yar 2016). Concerning the variables
    associated with OIT victimization, and focusing on the post-Covid-19 sample, it
    was possible to observe that individuals who opened more dubious links were more
    victimized. None of the individual dimensions were relevant to the explanation
    of this type of victimization.


    Finally, even though the scientific community has mainly studied the tendencies
    of cybercrimes during and after the Covid-19 pandemic crisis (mainly through statistical
    reports), the literature that analyzes the impact of this event on fear and perceived
    risk of OIT is very scarce or non-existent. In the present study, results suggested
    that the levels of fear of OIT and perceived risk remained the same during the
    considered periods, in spite of increased prevalence of OIT victimization. When
    analyzing the variables associated with fear of OIT, interesting results were
    observed, showing that both individual and contextual dimensions were relevant
    to explain the fear of OIT.


