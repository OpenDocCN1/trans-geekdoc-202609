    # 3.6. Pandemic accelerationism


    These online militant movements are ideologically disparate. They are, however,
    fueled by a common range of ideas, which broadly fall under the social theory
    and strategy of accelerationism. Elements of this theory are rooted in the work
    of the German philosopher Karl Marx, who exposed the view that the capitalist
    system of economic organization contains inherent contradictions. According to
    Marx, these contradictions are fatal and inevitably lead to the system’s eventual
    collapse, regardless of the intentions or efforts of those who live under it [WAL
    21]. These ideas resurfaced in France following what became known as May 1968
    – a 50-day period of widespread unrest, which included general strikes, riots,
    occupations and rallies by leftist student groups and trade unions. The nationwide
    unrest resulted in the strengthening of France’s central government, rather than
    as its initiates had – a revolutionary transformation of society. In its aftermath,
    post-May 1968 French philosophers, Gilles Deleuze and Felix Guattari proposed
    that, rather than resisting a seemingly insurmountable system, its detractors
    seek to hasten its maturation, and in doing so expose its fatal flaws. Thus, “[p]ushing
    forward is posited as the only way to push against” [LAU 17]. The hope was that
    society could finally rise up “only after hitting rock-bottom” [CUL 21]. The views
    of Deleuze and Guattari found their way into the English-language'
  merge: -1
