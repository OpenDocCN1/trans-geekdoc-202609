- pgno: 147
  md: '# 116 CyberCrime during the SARS-CoV-2 Pandemic (2019-2022)


    Nevertheless, we will criticize two alternative concepts before drafting this
    model in an image. The first concept is compatibility. The building of computer
    and technical systems have open and closed (proprietary) sources and standards.
    The open-source idea is to enable the software or hardware to have no limits on
    their adaption to fit almost any system. The notion of compatibility here provides
    a powerful image. It does not matter what the operating system is, as long as
    it is open, one can adapt it to. The openness of the source code, or technical
    standard, will allow the new module to be adapted to the main one and vice-versa.
    Unfortunately, this powerful image cannot have a perfect translation to the understating
    of legal systems. Legal systems are social constructs that have a high degree
    of ruling behavior, which is more unstable than technical constructs. This social
    behavior changes over time and varies from one to another. Therefore, evaluating
    or measuring counts legal compatibility is unattainable theoretically. We can
    use this concept as a metaphor. But it will be useless for our theoretical purposes.
    The other concept is adequacy, which is building metrics to measure data protection
    levels. This concept is still under construction. From a legal-formalist point
    of view, both the General Data Protection Regulation and the Directive (EU) 2016/680
    use this concept. These two European union documents provide guidelines to evaluate
    how the European Commission can determine whether a country is adequate to receive
    and provide personal data to member states. Figure 4.1 summarizes the concept
    of adequacy, relying on Article 36 of the Directive (EU) 2016/680.


    Notwithstanding having the above framework, two rulings – known as Schrems I and
    II – from the Court of Justice of the European Union brought down the European
    Commission’s decisions that recognized the United States as an adequate country
    (Veronese 2021). Do rulings impose the halting of dataflows between the European
    Union member states and the United States? No. The decisions recognized that they
    might lawfully happen, relying on a different data protection basis, allow standard
    contractual clauses. The concept of adequacy will evolve in the next years. So,
    how can we think differently about international cooperation from a theoretical
    point of view? The concept of legal interoperability appears in the literature
    as a concept that has its origin in the management debate (Morando 2013; Mellone
    2014), even in discussing e-justice (Klüster 2012). Also, this concept still serves
    as a basis to build public policies, fostering the interoperability of national
    systems to provide social rights among the member states of the European Union
    (European Union 2017).'
  merge: -1
  img_proc: true
- pgno: 148
  md: 'European Commission (EC) assesses the data protection level of a destination
    country, territory, or organization at least every four years [Article 36(3)(4)(5)(6)].
    It also publishes the results [Article 36(8)].


    Evaluation of three significant aspects.

    1 – Legal order that must comprise the rule of law, respect for human rights and
    fundamental freedoms, relevant legislation, including public security, defense,
    national security and criminal law and the access of authorities to personal data
    [Article 36(2)(a)].

    2 – Protecting systems that grants and enforceable data protection rights by administrative
    and judicial redress, with an independent supervisory authority [Article 36(2)(a)].

    3 – International commitments, conventions or instruments, and participation in
    multilateral or regional systems for data protection [Article 36(2)(c)].


    EU member states must enforce the EC decision to assess whether transfers happen
    only to safe destinations [Article 36(1)]. Also, they must not discriminate transfers
    relying on other lawfully from Articles 37 and 38 [Article 36(7)].


    > Figure 4.1. Article 36 for the European Commission to assess the data protection
    level of adequacy of a non-EU member country, international organization. Source:
    authors’ design


    Amadeo Santuososo and Alessandra Malerba explain legal interoperability as an
    alternative concept for having a new glaze on comparative law and international
    law (Santosuososo and Malerba 2014). The central aspect of the concept is its
    offer to look at dynamic interchanges between different legal contexts. They also
    highlight that the theoretical center of the debate lies in both linguistic and
    cultural understandings. They define three situations. In the first situation,
    there is a legal system with just language in use. It is the temporal transformation
    by which societies shape new legal concepts or modify their interpretation. In
    the second situation, different legal systems use the same language, like the
    United States and the United Kingdom. In the third situation, there are different
    legal systems with different languages. One could state that the core solution
    is to have a perfect translation. However, that is precisely the problem. It is
    almost impossible to have it. So, the solution would be to have an equivalent
    solution. This model of legal interoperability could lead to a better understanding
    of differences:'
