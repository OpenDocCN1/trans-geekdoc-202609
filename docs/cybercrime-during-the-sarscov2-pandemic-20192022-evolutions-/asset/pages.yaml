  md: '# 52 Cybercrime During the SARS-CoV-2 Pandemic (2019-2022)


    on January 25, 2020 in Canada. On March 11, 2020, the WHO declared Covid-19 a
    pandemic [AJM 21].


    On March 13, 2020, a federal health emergency was declared in the United States.
    The federated states distinctly declared it between March 1 and March 15, 2020
    at the latest [AJM 21]. In Canada, Quebec declared a provincial state of emergency
    on March 13, Ontario and Alberta on March 17, British Columbia and Saskatchewan
    on March 18, New Brunswick on March 19 and Manitoba on March 20, 2020 [CAN 21].


    The consequences of this pandemic and the government responses overturned the
    lifestyles of Canadians and Americans. According to a study conducted by the Canadian
    Internet Registration Authority (CIRA) comparing the data of Canada’s Internet
    Factbook, between 2019 and 2020, during the lockdowns, 54% of Canadians worked
    from home in a teleworking format, whereas in 2019, less than 42% had occasionally
    worked from home [AUT 20]. In the United States, during the month of May 2020,
    35.4% of the population aged 16 and over worked from home due to stay-at-home
    orders [USB 20].


    # 2.3. Cybercrime and SARS-CoV-2


    During this health crisis, cyber risks and cyber threats increased [KAT 22]. A
    cyber risk is described as the product of the level of threat and the level of
    vulnerability. While cyber risks determine the likelihood of a successful cyberattack
    [SAN 22], cyber threats represent the potential for violation of security, which
    exists when there are circumstances, capabilities, actions or events that could
    breach security and cause harm. Grasping these two notions is fundamental to understand,
    because the cybersecurity that societies have experienced over the last 20 years
    has largely contributed to the complexity of cybersecurity issues. Back 2001,
    Beck already heralded that “the social production of risks” [BEC 01, p. 36]. The
    SARS-CoV-2 pandemic in 2020 and the 2021 emerging multidimensional crises (social,
    economic, political crisis) represent a contextual window which perfectly illustrates
    the risk of security Beck refers to, characterized by the multiplication and diffusion
    of systemic and cross-sectoral risks stemming from technological and industrial
    developments. Globalization and cyberspaces have a multiplier effect on these
    risks and the occurrence of crises [BEC 01]. During this period, crime'
  merge: -1
  img_proc: true
- pgno: 84
  md: '# SARS-CoV-2 and The Evolution of Cybercrime in the US and Canada


    in general and cybercrime in particular have developed because of the risk of
    society, globalization and cyberization [SAL 22].


    The 2020 crisis provoked by the SARS-CoV-2 pandemic attends to this, since risks
    grow in hand with vulnerabilities. New social interactions, caught within the
    offline-online continuum, brought to light the mutual impacts between tangible
    reality and cyberspace [WAL 17], manifest in all societies fighting the pandemic.
    Indeed, this period of crisis led to an acceleration of the cyber movement born
    in North America around 1995. The targets and victims of cybercrime shifted many
    of their activities to cyberspace, be them individuals or private organizations.
    For some authors such as Hawdon et al., the pandemic crisis was able to illustrate
    the criminological activity theory [COH 79] in a natural context. Stricto sensu,
    according to these authors, the societal forces by the stay-at-home orders quantitatively
    and qualitatively increased cyber risks. This occurred because three conditions
    were met in the space-time, nearly a pool of potential victims combined with the
    presence of motivated malicious actors and the lack of an effective guardian [HAW
    20].


    Out of opportunism, malicious actors adapted and intensified their techniques
    as well as their attack vectors following the crisis context, whereas other types
    of crimes decreased [MOH 20]. Paradoxically, according to Katagiri, the state
    of cyberspace stability was more durable than initially thought, in the face of
    sudden transformations in the behavior of Internet users and organizations. According
    to this author, “hardly any substantive change has occurred to the structure of
    cyberspace dynamics, power relations, and strategic interests of major cyber powers”
    [KAT 22, p. 1], which demonstrates the structural tenacity of cyber anarchy, even
    in times of crisis. However, the number and nature of the targets and potential
    victims changed considerably.


    # 2.3.1. Targets and victims


    The shift of workers from a labor environment controlled and protected by implanted
    and monitored systems to private residences involves risks which can increase
    the vulnerability of businesses and workers to cyberattacks. According to SentryBay,
    a cybersecurity company, in 2020, 42% of residential and private terminals were
    not sufficiently protected in the United States [SEN 20]. These terminals, unprotected
    or poorly'
  merge: -1
  img_proc: true
- pgno: 85
  md: 'protected, represented a possible gateway for malicious actors wishing to attack
    networks and damage business data. “With so many people using compromised laptops
    or home computers to log-in to the corporate network, they are creating a weak
    link in the security chain, and potentially devastating damage to their employer
    at what is already a very testing time” [SEN 20].


    Since the pandemic started, the Federal Bureau of Investigation (FBI) in the United
    States warned private organizations as the need to protect their networks in the
    era of teleworking. According to their warning notice, cybercriminals frequently
    carry out attacks on the private terminals of teleworkers to inject malicious
    software and code into the organization’s protected system, to commit fraud and
    gain deeper access to the network of the company and its employees [FBI 20].


    As with telework, educational institutions were forced to close during the first
    wave lockdown. According to UNESCO, more than 1.6 billion pupils and students
    in approximately 165 states were affected by preventive health measures [UNE 20].
    These figures represent approximately 87% of all the pupils and students worldwide.
    In several cases, schools and higher education institutions were forced to close
    for the entire remaining term (Winter 2020) or until the end of the standard school
    calendar [LAW 22, WIK 22a, WIK 22b]. Teaching, at first temporarily halted for
    a period ranging from a few days to a few weeks, completely online. Remote teaching
    and videoconferencing services were disparate, depending on regions and socioeconomic
    characteristics [MOR 20]. On this subject, security issues were raised by several
    experts regarding the choice of services and their implementation method [BAN
    20]. As was the case with teleworking, security issues were related to related
    habits and cyber hygiene. Unsecured student terminals could potentially open the
    door to cyberattacks against systems connecting hundreds of thousands of users.
    Moreover, given the audience of online teaching tools, some authors warned against
    the safety risks of minors using services which required the use of webcams and
    file transfer [OLO 20, COL 20].


    The closure of several businesses and physical service points as a result of the
    lockdown caused a shift of customers to services and online sales sites [FBI 20].
    According to the report by Absolunet, a consulting service company, certain sectors
    as “furniture and home furnishing”, “food'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'catering); “clothing”, “sports and leisure goods” and “household appliances,
    electronics, materials construction and renovation” witnessed an online sales
    growth of around 106%, 160%, 21%, 105% and 161% respectively, compared to 2019
    [ABS 20].


    However, according to Hawdon et al., online shopping continues to be one of the
    online routines deemed the most dangerous [HAW 20]. For reference, these authors
    also consider the use of social media, online gambling and visiting the dark web
    as practices increasing user risks and of systems targeted by cyberattacks or
    malicious actors. An increase in online transactions implies personal data are
    more vulnerable than when doing in-person purchases at a shop. These data were
    targeted by cybercriminals wishing to commit personal data theft, identity theft
    or fraud [FBI 20].


    It must be noted that relations with cyberspace deepened during the different
    phases of the pandemic crisis in North America. A shift from physical activities
    to online activities was observed in many areas. Rapid and forced changes to cyberspace
    had significant consequences on social relations, government decision-making and
    on cybercrime. In this regard, both individuals and organizations were affected
    by cybercrime.


    With societal changes and the obligation for many individuals to change their
    living, working, socializing and entertainment habits, several authors have argued
    that lockdown measures have actually increased cybercrime practices targeting
    individuals. According to Ahmad et al., cybercriminals wishing to attack individuals
    used social engineering to exploit fears and widespread anxiety around the topic
    of the pandemic [AHM 20, ALZ 20, LAM 20]. This has been defined by Ventrella as
    “the science of using social interactions” [VEN 20, p. 389]. Cybercriminals became
    closely interested in individuals and tried to exploit the new vulnerabilities
    emerging with the pandemic crisis. Alzahrani has described several types of attempts
    exploiting fear, hope or lack of cyber hygiene of individuals: malicious attachments,
    phishing campaigns focusing on physical or financial health, fake online websites
    allegedly selling products, extortion and theft of conversations, as well as brand
    impersonation [ALZ 20]. According to these authors, the purpose is to convince
    individuals that they are dealing with the material or sites by legitimate and
    existing organizations [VEN 20, OLO 20].'
  merge: -1
  img_proc: true
- pgno: 87
  md: 'This type of attack is aimed at a large number of targets in order to increase
    the probability of success. Although the message has to be targeted, it also needs
    to be broad enough as to address a large audience, such as claiming to have a
    cure or offering financial help in a context of distress, at a moment when unemployment
    rates and job insecurity are particularly acute.


    Despite the fact that many of these attempts are made with the intention of stealing,
    directly victimizing individuals or defrauding financial assistance programs,
    some malicious actors target workers, and then access corporate networks or organizational
    security. Individuals rather became a gateway to the real victim, which actually
    was the targeted organization [ALZ 20, MIC 20].


    Children, whose daily lives also shifted toward cyberspace during the first wave
    of the pandemic, were other possible victims of cybercrimes targeting individuals.
    According to the FBI, schools of forced distance learning at the time it paved
    the way for the victimization of children online education platforms. The FBI’s
    newsletter Private Industry Notification stated that platforms provide broader
