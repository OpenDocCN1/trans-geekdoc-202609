- pgno: 23
  md: '# I.3. Our research questions


    This work studies the role of cybercrime in the world and its evolution, during
    the early pandemic period (in the first days of the year 2020), which is still
    not over the time of writing these lines. The cases discussed contribute to reflections
    on the link between cybercrime and crises as well as on the explanatory variables
    of cybercrime.


    # I.3.1. Chapter 1 – The evolution of cybercrime during the Covid-19 crisis?


    The dominant narrative since the first months of the Covid-19 epidemic expressed
    that, through the effects produced on societies, there was a significant (sometimes
    even spectacular) increase in cybercriminal activity. Not only the health crisis
    scenario but also its economic consequences were believed to foster a context
    favoring cybercriminal activity, as well as increasing the risk of online victimization.


    By consulting statistical series produced in several countries, we intend to call
    into question such an assumption: do the figures really confirm this assertion?
    Is the evolution of the cybercrime trend correlated with the various phases of
    the health crisis?


    In an attempt to answer those questions, CERT (Computer Emergency Response Teams)
    reports and police data will be used as the main data sources on the state of
    cybercrime, which will then be compared to data reflecting the changes in citizen
    lifestyles. The lockdown and restrictions on the mobility of individuals being
    one of the main indicators of these modifications, data on mobility is studied
    in depth in order to reconstruct the chronology of the lockdown periods.


    The central question regarding the evolution of cybercrime trends during the health
    crisis will also be addressed by focusing on the evolution of cyberattacks on
    the international scene.


    +   7. Daniel VENTRE, CNRS, CESDIP Laboratory (Guyancourt, France).'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# I.3.2. Chapter 2 – The SARS-CoV-2 pandemic crisis and the evolution of cybercrime
    in the United States and Canada⁸


    In the rest of the world, the pandemic crisis caused by SARS-CoV-2 in 2020 disrupted
    the normal functioning of societies in Canada and the United States. In terms
    of cybersecurity, it is highly probable for malicious actors to have adapted their
    practices to the pandemic context. This means cybercrime evolved and became adapted
    the new context. The chapter outlines these changes based on government and private
    organizations'' reports on cybercrime, offering a critical perspective. Cybercrime
    in the United States and Canada during the pandemic crisis is analyzed in its
    various trends. The need for international cooperation to counter cybercrime and
    the methodological challenges encountered during the study conclude this chapter.


    # I.3.3. Chapter 3 – Online radicalization as cybercrime: American militancy during
    Covid-19⁹


    The January 6, 2021 attack on the Capitol in Washington signaled the culmination
    of a broader period of societal activism in the United States. The trajectory
    of this period, in many ways is still extending, closely followed the spread of
    the SARS-CoV-2 pandemic. The purpose of this chapter is to explore to what extent
    the basic analytical framework of cybercrime theory is still valid under pandemic
    conditions. We argue that the unprecedented pressure of accelerationism experienced
    in the United States during Covid-19 compels us to rethink online radicalization
    as a form of cybercrime. The extraordinary scope, speed and overall dynamics of
    accelerationist activity have challenged secular American institutions in recent
    years are all signs of a new kind of symbiotic association between online and
    offline elements.


    +   8. Prof. Hugo LOISEAU, École de Politique Appliquée, University of Sherbrooke,
    Quebec, Canada.

    9. Joseph FISANAKIS, Professor of Intelligence and Security Studies, Coastal Carolina
    University, United States.

    Alexa MCMHAEL, Special Security Officer, Intelligence Operations Command Center,
    Coastal Carolina University, United States.'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# I.3.4. Chapter 4 – Cybercrime in Brazil after the Covid-19 global crisis:
    an assessment of the policies concerning international cooperation for investigations
    and prosecutions¹⁰


    Cybercrime is not a new topic for the Brazilian authorities. In 2015, Brazil was
    the second most vulnerable country to cybercrime; Brazilian society having lost
    between US$4.1 billion and US$4.7 billion in data theft and financial fraud. How
    did cybercrime evolve during the Covid-19 pandemic period, and what responses
    did the government and Brazilian society provide to these issues? Based on quantitative
    data and interviews with members of the security forces, the chapter outlines
    the main lines of the reforms underway in the fight against cybercrime in Brazil.


    # I.3.5. Chapter 5 – Has Covid-19 changed fear and victimization of online identity
    theft in Portugal?¹¹


    This chapter focuses on online identity theft (OIT), now considered one of the
    fastest growing online crimes and leading to significant financial losses for
    victims. This research, undertaken in the Portuguese context (2017 and 2021),
    intends to (i) analyze the levels of victimization, fear and risk perception of
    online identity theft, before and after the Covid-19 pandemic crisis; (ii) study
    the evolution of routine online activities, both before and after the Covid-19
    pandemic crisis; and (iii) understand the evolution of other forms of online victimization
    over the past 2 years.


