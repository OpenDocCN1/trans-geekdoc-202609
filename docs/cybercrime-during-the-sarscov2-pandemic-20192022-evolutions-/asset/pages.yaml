  md: 'profound change”1. Briefly stated, a crisis is a temporary situation, a turning
    point, moment of instability and stress. However, the aforementioned approach
    assumes the pre-existence of a state of normalcy albeit temporarily interrupted
    – must be regained. The return to the previous state will be considered to be
    the crisis resolution. Although the crisis represents a moment of exception, it
    is a condition one may still cope with.


    For Fein-Banks [FEA 09], a crisis is “a major occurrence with a potentially negative
    outcome affecting the organization, company, or industry, as well as its publics,
    products, services or name. It interrupts normal business transactions and sometimes
    threatens the existence of the organization” [FEA 09, p. 2].


    But normality can also be considered to be the crisis: from that perspective,
    the history of the world would be a series of successive, superimposed, nested
    crises [CAR 18], constituting the normalcy of the world, its structural signature
    [KOS 72].


    Crises are moments of tension, of disorganization having reached a threshold that
    an individual, a group of individuals, or a society can no longer find acceptable
    or tolerable. The peak of intensity cannot last. But it should also be noted that
    crises are maintained over time, which may seem incompatible with their very definition
    (economic, security, climatic, political, social crisis, etc.). Still, the notion
    of duration is highly subjective. Furthermore, it is perhaps not much the duration
    that characterizes the crisis, but the level of disorganization or even destruction
    it engenders, as well as the acceptability of such an exceptional state by an
    individual or society. The crisis signals a moment of unbearable tension. What
    is called the end of crisis, after the crisis, the exit or crisis resolution is
    a return to a level of acceptability, even if the disturbance persists. But it
    is simply less intense or perceived as such. What is called the exit may not always
    refer to the end of the event itself, but the ability to coexist with it, or partially
    accept it. Therefore, risk tolerance is an essential component in the definition
    of a crisis. As such, it may differ from one society to another. Tolerance acts
    as a threshold defining the presence of a crisis or its absence.


    Finally, with the resolution or exit from the crisis, one cannot consider that
    is possible to return to the normalcy prior to it because the crisis has


