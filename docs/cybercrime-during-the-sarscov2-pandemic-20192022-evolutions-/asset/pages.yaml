  md: '# Online Radicalization as Cybercrime: American Militancy During Covid-19 101


    Clearly, America''s domestic threat landscape predates the pandemic. However,
    the interaction of Covid-19 with the cyber domain gained unprecedented vigor to
    a new breed of hybrid militant movements, such as the Boogaloo and QAnon. Although
    ideologically disparate, these movements are jointly fueled by a common belief
    in accelerationism. The theory much as a strategy, accelerationism gains a drastic
    rupture from traditional militant – or even terrorist – strategies in a number
    of important ways. Notably, it views the development of digital communications
    technologies especially social media – as dialectic elements in the capitalist
    system, which can be utilized in highly disruptive ways. In comparison to their
    pre-pandemic progenitors, the resulting militant movements, such as the Boogaloo
    and QAnon, are more politically elite, more difficult to monitor, and far larger.
    This dynamic is largely an outcome of these movements’ which is cyber-infused
    and influencing their outlook and structure in fundamental ways.


    What does this mean for our contemporary understanding of cybercrime? In our view,
    the political radicalism of the pandemic era is inconceivable outside of the cyber
    domain. Not only does the radicalism we witnessed under Covid-19 point to the
    influence of the social media dynamic, it also challenges the traditional dichotomy
    between cybercrime and offline activity, which on traditional definitions of radicalization
    researchers stressed repeatedly that “[the Internet has not led to a rise in terrorism.
    It is largely a facilitative tool; radicalization is enabled by the Internet rather
    than being dependent upon it” [GIL 15]. The experience of the pandemic directly
    challenges that vary. In her pandemic-era essay on the role of technology in violent
    extremism, Lydia Khalil echoes Rita Katz in a question, which we view as central
    to this analysis: are we perhaps witnessing an emergence of a new typology of
    militancy, one that cannot possibly exist without the cyber domain? [KHA 21].
    Our answer is that we are, and that this phenomenon has emerged as a result of
    a new typology of cybercrime. In the fact, the Capitol attack of January 6, 2021,
    may have been an early representative of this new typology of cybercrime.


    Our argument, as outlined in this chapter, is that cybercrime during the pandemic
    era is, at the very minimum, substantively different from that of the pre-pandemic
    era. Far from facilitating radicalization, the social media environment “fundamentally
    changed the conditions around social interaction and reorganized our public sphere
    in a way that has led'
  merge: -1
  img_proc: true
