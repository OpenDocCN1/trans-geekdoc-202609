  md: '# The Evolution of Cybercrime During the Covid-19 Crisis


    entering the pandemic period, cybercrime had its own specificities in each country,
    its unique evolution, a chronology and a specific history, and this despite the
    fact that cyberspace is an inter or transnational space, and that cybercrime can
    be deployed therein without the constraints of territorial borders. The natural,
    endogenous dimension is central because cybercrime or delinquency does not always
    manifest at an international scale. On the other hand, the pandemic evolved at
    significantly different paces from one continent to another, and even from one
    country to another in the same region. The policies accompanying this epidemic
    differed intently from country to country, the populations around the world did
    not all experience lockdown at the same time, teleworking was not imposed everywhere
    in the same way, schools were not closed in all places for the same time lapse,
    etc. Societies did not face the pandemic in the same way, and their lifestyles,
