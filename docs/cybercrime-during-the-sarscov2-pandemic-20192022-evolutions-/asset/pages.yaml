  md: '# 5 Has Covid-19 Changed Fear and Victimization of Online Identity Theft in
    Portugal?


    # 5.1. Introduction


    The Internet plays a crucial role in daily life, allowing the use of several governmental,
    commercial, economic, financial, leisure and educational services (Grabosky and
    Smith 2001; Dias 2012). Therefore, nowadays, the Internet represents a pillar
    of the global economy, especially during and after the Covid-19 pandemic. Despite
    the undoubtable advantages that the Internet has brought, a set of criminal opportunities
    must be taken into consideration. In fact, with its fast and unprecedented development,
    new crimes have emerged, such as hacking, and others (traditional crimes) have
    been extended to cyberspace, such as different types of fraud (e.g. online identity
    theft (OIT), cyberstalking or cyberbullying). This chapter will focus on the OIT,
    which is now considered one of the fastest growing online crimes (Golladay and
    Holftreier 2016; Williams 2016), resulting in relevant financial losses for victims.
    Identity theft is the “unauthorized use or attempted use of an existing account
    (such as credit/debit cards, savings, telephone and online), the unauthorized
    or attempted use of personal information to open a new account or misuse of personal
    information for a fraudulent purpose such as providing false information to law
    enforcement” (Harrell 2015, p. 2).


    Chapter written by Inês GUEDES, Joana MARTINS, Samuel MOREIRA and Carla CARDOSO.'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'As previously mentioned, during the Covid-19 pandemic, the population changed
    their routines and multiple actions are now performed in cyberspace, leading to
    an increasing exposure to risks (Horgan et al. 2020). Consequently, it is important
    to understand that victimization rates have increased (Hawdon et al. 2020), and
    there is also a heightened worry and perceived risk of OIT during the Covid-19
    pandemic. Among the criminological theories that have been used to explain online
    victimization, routine activities theory (RAT) is one of the most empirically
    tested (Cohen and F 1979; Bossler and Holt 2009; Reynolds 2013; Reynolds 2015;
    Reyns and Henson 2015). Therefore, the present study, undertaken in the Portuguese
    context (2017 and 2021), intends to (i) analyze the levels of victimization, fear
    and risk perception of OIT before and after the Covid-19 pandemic crisis; (ii)
    analyze the evolution of online routine activities (exposure, target suitability
    and guardianship behaviors) also before and after the Covid-19 pandemic crisis;
    (iii) understand the victimization of other forms of online victimization during
    the last 24 months. The chapter will start with an overview of the impact of the
    Covid-19 pandemic on cybercrime, followed by the definition of OIT and the determinants
    of its victimization. We will focus not only on the feasibility of the RAT to
    explain victimization, but also on the importance of other individual variables.
    Finally, in the theoretical section we will describe the main variables that have
    been used to address fear and perceived risk of OIT. Next, the methods section
    will describe the survey and procedures used in the present study, followed by
    the obtained results and their discussion.


    # ## 5.2. The impact of the Covid-19 pandemic on cybercrime


    The Covid-19 pandemic and the associated lockdown measures imposed by governments
    to control the spread of the virus has a large impact on several social spheres,
    affecting people''s routine activities worldwide. For instance, many businesses
    and education institutions moved their activities toward home, physical retail
    stores closed, there was reduction in mobility and households were occupied most
    of the time. Consequently, many began using the Internet daily for work, education,
    leisure, socialization and consumption (Buil-Gil et al. 2021; Kemp et al. 2021;
    Buil-Gil and Zeng 2022). Based on the RAT (Cohen and Nelson 1979), it has been
    claimed that these tremendous changes in routine activities brought by the Covid-19
    have influenced crime opportunities, only displacing them from the physical to
    the cyberspace. More specifically, the shift in social activities'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'from the physical to the virtual world increased the likelihood of converging
    motivated offenders and suitable targets (in the absence of capable guardians)
    in cyberspace (Hawdon et al. 2020; Payne; Kemp et al. 2021).


    In fact, on the one hand, studies (e.g. Mohler et al. 2020; Abrams 2021; Buil-Gil
    et al. 2021; Langton et al. 2021) found evidence that many street crimes and crimes
    in outdoor physical spaces theft decreased during the Covid-19 pandemic. Considering
    that people started spending less time on the streets and public spaces, the researchers
    argued that opportunities for physical convergence in time and space of motivated
    offenders and suitable targets in the absence of capable guardians were reduced
    (Mohler et al. 2020; Buil-Gil et al. 2021; Kemp et al. 2021; Langton et al. 2021).
    On the other hand, people started spending more time on the Internet, extending
    the frequency, intensity and variety of activities online (e.g. working, studying,
    shopping and socializing), opportunities for cybercrimes increased (Mohler et
    al. 2020; Buil-Gil et al. 2021; Kemp et al. 2021). As a matter of fact, academic
    research has been demonstrating that cybercrime increased during the pandemic.
    To explore the effect of the pandemic on cybercrime in the United Kingdom, Buil-Gil
    et al. (2021) conducted a time series analyses of online crime data recorded by
    Action Fraud from May 2019 and May 2020. The results indicated that reports of
    cybercrime increased during the Covid-19 outbreak, especially the amount of fraud
    associated with online shopping and auctions, hacking of social media and e-mail.
    Similarly, Kemp et al. (2021) applied a time series analysis to data on cybercrime
    reported to Action Fraud in the United Kingdom to examine a potential increase
    in online crime brought about by the Covid-19 pandemic. The results revealed that
    cybercrime increased after the introduction of lockdown measures beyond predicted
    values, but the changes in victimization were not homogeneous across fraud types.
    On the one hand, they noted a statistically significant increase in online shopping
    fraud, romance fraud and cyber-dependent crimes (e.g. denial-of-service attacks,
    hacking of social media and e-mail). On the other hand, they observed a significant
    decrease in ticket-related offline leisure and transport activities led to a decrease
    in online ticket fraud. The results of other studies are in line with the above-mentioned
    findings. In the United States, an increase in reports of most types of online
    fraud was noticed (e.g. imposter messages, fraudulent text messages, online shopping
    fraud and romance fraud) in the first three months of 2020 compared to the'
