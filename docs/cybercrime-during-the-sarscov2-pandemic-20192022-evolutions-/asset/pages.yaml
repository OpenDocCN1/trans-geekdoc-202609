    # 4.2. Cybercrime in the literature and the Brazilian case


    Despite the vast future challenges, we can assess that some improvements have
    happened in the international arena to fight against cybercrime. Peter Grabovsky
    wrote a paper almost 20 years ago to describe the panorama of both Australia and
    the international issues about cybercrime (Grabovsky 2003). During the beginning
    of the 21st century, the scenario was very different. Since then, many countries
    have passed significant reforms into their law. Also, nowadays, there are some
    international standards. Therefore, the problems evolve into more practical issues
    like defining tools aiming for effective results. The Brazilian case is exemplary.
    In this section, we will provide a literature review that will be helpful to understand
    cybercrime in general.


    The legal debate about cybercrime between the 1980s and 1990s focused on hacking
    as a primary subject. In the United States, hacking federal systems became a crime
    under Section 1030 of Title 18 (Crimes and Criminal Procedure, and Appendix) of
    the US Code. Also, many states followed this track and have statutes'' provisions
    qualifying hacking as a crime. One example is that US Congress approved a bill
    passed into 1984: the Counterfeit Access Device and Computer Fraud and Abuse Act
    (GovInfo 1984). The United States federal statute date from the same year that
    Steven Levy published his book Hackers: Heroes of the Computer Revolution (Levy
    1984). Some years after, Bruce Sterling published The'
  merge: -1
  img_proc: true
- pgno: 144
  md: '# Hacker Crackdown: Law and Disorder on the Electronic Frontier (Sterling 1992).
    At that time, the Internet was far from what it is nowadays.


    Nevertheless, these visionaries saw something coming. This subject was coming
    to stay in the public debate and in the legal literature. Harry Rubin, Leah Fraser,
    and Monica Smith wrote an article about the criminal potential over the Internet
    in 1995 (Rubin et al. 1995). They stated that the adaptation of the law to the
    Internet scenario was something hard to do and even that the 1984 (Counterfeit
    Access Device and Computer Fraud and Abuse Act) and the 1986 (Electronic Communications
    Privacy Act) federal amendments were unable to solve most of the legal issues.
    For Jo-Ann M. Adams, the solution was to amend some more of the 1984 Act, passing
    into law some other provisions, as in the case of the Communications Decency Act
    (CDA) of 1995, to effectively rule over “anarchy on the Internet” (Adams 1996).


    Defining clear lines to separate common crimes from computer crimes was still
    very difficult for criminal law. One reason was that some crimes involve intellectual
    property and intangible goods. David Wall tried to classify cybercrime in parallel
    to actual crimes. He wrote about “cyber-trespass,” “cyber-theft,” “cyber obscurity”
    and “cyber-violence” (Wall 1999). His objective was to criticize both authors
    focused on the crimes themselves authors who tried to classify “new” social behaviors.
    Nonetheless, his classification at that time was too wide and lacking refinement.
    Another way to look at the hardware involved. Carl Benson, Andrew Jablon, Paul
    Kaplan, and Maria Elena Rosenthal proposed this. They define three possibilities
    to classify “computer crime” (Benson et al. 1997). Computers could be targets
    of criminal activities as someone could steal them. Also, a computer could be
    instruments of traditional crimes. We will see that this definition has more refined
    over the years. However, at some point, the logical basis of this classification
    is still valid. Also, the expansion of the Internet comes along with the international
    aspect of cybercrime.


    One example is figuring out how to prosecute crimes outside the borders perpetrating
    intellectual property crimes (CHR 97, ZEV 97–98). In addition, the problem of
    training law enforcement personnel to pursue and prosecute cybercrime was an issue
    in the past and still is a problem. Some technical solutions, and some even saw
    the possibility of using private'
  merge: -1
  img_proc: true
- pgno: 145
  md: 'companies to help law enforcement (Mitchell and Banker 1998). The academic
    debate and policy efforts against cybercrime generated some international solutions.
    The most notable is the Council of Europe’s Convention on Cybercrime of 2001.


    Nowadays, it is not difficult to see that the first proposals to classify cybercrime
    are no longer a problem. Bile Benzouid and Daniel Ventre describing, on Wall’s
    most recent work, there are three kinds of cybercrime (Wall 2007; Benzouid 2016).
    First, the law framed these crimes before the computer age (cyber-assisted crimes).
    Most property and document frauds fall under this definition. Forgery of a credit
    card would still be a crime, whether the Internet is part of the criminal activity
    or not. The second kind encompasses crimes that the Internet makes easier and
    plays an essential role (in cyber-enabled crimes), like the diffusion of computer
    viruses. The third category would be impossible to perform without the Internet,
    like attacking servers (cyber-dependent crime). From a legal point of view, it
    is essential to explain that social conduct needs a clear description to be a
    felony or a misdemeanor legally. Otherwise, the widespread analogical application
    of criminal law would be erratic and even unfair.


    It is crucial to indicate that this chapter follows the effort to provide data
    to a ongoing research program. The article by Bile Benzouid and Daniel Ventre
    describes four subjects in the sociology of cybercrime (Benzouid and Ventre 2016).
    The first is the mapping of criminal hackers. The second is having more significant
    surveys about the crimes and their victims. The third is the qualitative analysis
    of Internet communities and deviant behavior. The fourth is a sociological analysis
    of the ongoing transformation of Internet policing, which demands research about
    surveillance. This chapter’s contribution falls under the fourth subject. It shows
    how Brazilian law enforcement personnel is actively transforming the national
    system to integrate it into a global network against cybercrime. It is also important
    to mention that the Covid crisis pushed the Brazilian law enforcement system to
    bolster its capacity to fight against cybercrime, as Brazil created a payment
    for people affected by the crisis, as the United States administration did (Economic
    Impact Payments, managed by the Internal Revenue Service – IRS).


    With the Pandemic, we saw problems involving the federal government’s emergency
    payment [Coronavirus aid]. In those cases, we saw specific crimes directly involving
    the Internet.'
