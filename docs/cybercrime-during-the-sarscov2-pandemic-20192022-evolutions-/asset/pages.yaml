    Brazilian LEP had to establish operating methods without having the best legal
    tools to hand. We will transcribe and interpret LEP interviews to show how they
    had to use some old international cooperation channels, like Interpol.


    Moreover, they talk about alternative ways of cooperating without a national framework
    with full integration of the international means. This cooperation will pave the
    way to a return to the theoretical problem. Section 4.7 describes a crucial subject:
    the problem of establishing an institutional basis for the country to cooperate
    in the global fight against cybercrime. Also, it brings forth two legal and social
