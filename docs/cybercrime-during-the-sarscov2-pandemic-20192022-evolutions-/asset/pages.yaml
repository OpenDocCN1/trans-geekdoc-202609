    from the ongoing governance and management debate, intertwining with technical
    standards discussions. Section 4.4 describes the about cybercrime in Brazil, focusing
    both on SaferNet and the Federal Prosecutor’s Office databases. It shows the significant
    increase in cybercrime in Brazil, blended with some information from the interviews
    of the LEP. This will also provide an opportunity to understand the current situation
