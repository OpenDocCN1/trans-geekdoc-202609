  md: '# Online Radicalization as Cybercrime: American Militancy During Covid-19 95


    which online forums, such as Reddit, can be used to build virtual ecosystems that
    separate “from mainstream society on a philosophical level, if not a physical
    one” [BLE 20]. This process includes the creation of a shared set of language
    conventions and terminology, which help individuals construct a sense of fraternity
    with each other and establish a group-based “normative philosophy” [BLE 20]. Such
    “virtual safe havens” [NAT 21] are absolutely concrete to the concept of radicalization.
    Upon initial inspection, the process of radicalization that led to the storming
    of the United States Capitol in January of 2021 followed the same steps that researchers
    identified in the past, to DVE radicalization [NSC 21].


    We posit, however, that the unprecedented social, political and economic conditions
    of the pandemic, coupled with the use of social media as virtual safe havens for
    militants, altered the nature of online radicalization in at least four ways:


    +   - first, the social isolation imposed by the pandemic made users susceptible
    to deep deprogramming by militant actors;


    +   - second, there was a migration of users towards a growing milieu of social
    media platforms that reject the very principle of content moderation, with potentially
    far-reaching consequences;


    +   - third, the range of the militia-sphere across all platforms grew to unprecedented
    proportions, allowing for a striking array of heterogeneous extremist groups to
    converge and build ideological confluence;


    +   - finally, the above factors contributed to a new paradigm of online radicalization,
    whose accelerated speed and size appear to be facilitating the radicalization
    of the American population on a mass scale.


    It is not hyperbole to say, that beginning in the spring of 2020, the coronavirus
    pandemic radically disrupted traditional modes of socialization in post-industrial
    societies. Throughout that period, as millions of Americans spent time at home,
    they relied on the Internet as never before. Studies show that, during the first
    year of the pandemic, the daily in-home data usage increased by nearly 40 percent
    on average among American households [MCC 21]. Additionally, nearly 90 percent
    of Americans indicated in surveys that the Internet was at least “important” to
    them during the pandemic, close to 60 percent indicating that it was “essential”
    [CHR 20]. Millions turned to the Internet in attempts to pierce through the long
    bouts of isolation, or in an effort to find financial assistance'
