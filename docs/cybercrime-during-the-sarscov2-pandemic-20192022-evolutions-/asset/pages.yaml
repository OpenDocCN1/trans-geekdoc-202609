    of the network [...], the gel forming from the background pool of users on the
    Internet” [VEL 21].


    # 3.10. Conclusion: meta-radicalization as cybercrime


    Even before the onset of Covid-19, radical accelerationists had instrumented the
    Internet as a criminogenic environment, in efforts to disinhibit, mobilize and
    activate online users. Their goal has always been – and remains today – to facilitate
    the transition of online militia into real-world criminal activity. The purpose
    of this chapter has been to question the extent to which the analytical framework
    of cybercrime theory remains valid under pandemic conditions. Our argument is
    that the unprecedented accelerationist pressure that the United States experienced
    during Covid-19 forces us to seek new ways to understand online radicalization
    as a form of cybercrime. Indeed, the extraordinary extent, velocity and overall
    dynamic of accelerationist activity that has confronted age-old American institutions
    in recent years points to a new type of symbiotic association between cyber and
    offline elements.'
