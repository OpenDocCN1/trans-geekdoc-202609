  md: '# 5.4. Online identity theft (OIT)


    # 5.4.1. Definition and modus operandi


    Cyberidentity can be defined as “the set of physical, physiological, psychological,
    economic, cultural and social elements of an Internet user which corresponds to
    the person’s real identity” (Silva 2014, pp. 16–17). Thus, a person’s cyberidentity
    can be understood as an extension of their identity to the Internet and any act
    that affects should be illicit. Concerning the concept of OIT, different authors
    adopt multiple definitions. Reynolds (2013) argues that identity theft is a term
    used to classify numerous offences, including the fraudulent use of a person’s
    personal information for criminal purposes without their consent. Solove (2002)
    adds that the offender uses the stolen information to generate false information
    about the victim or to assume the victim’. For Newman and McNally (2005), the
    stolen information can also be used to commit other crimes, as well as to obtain
    financial gains. Furthermore, OIT involves the misappropriation of identity tokens
    such as email addresses, passwords to online banking or webpages (Roberts et al.
    2013). In the present work, OIT will be defined as the illicit and improper use,
    via the Internet, of personal and financial data, which were obtained without
    prior consent and knowledge of the cybercriminal.


    Usually, it is possible to identify three stages in the OIT process. First, the
    acquisition that can be undertaken through the use of different techniques such
    as hacking or fraud. In the second stage, the criminal uses the stolen personal
    information for financial gains – the most common use – or to avoid detection
    by law enforcement agencies. The last stage occurs when the victim finds out that
    their identity has been stolen, which can happen in a short span of time or, in
    some cases, it can take much longer for the victim to realize (Newman and McNally
    2005).


    As previously mentioned, there are a set of commonly used techniques to commit
    OIT, which are becoming more complex and sophisticated with the development of
    the Internet. In fact, these techniques employ a mix of information, communication
    technologies and social engineering. For instance, phishing is the most common
    method to commit OIT (Williams 2016), involving sending deceptive e-mails that
    are created to appear like they are sent by legitimate businesses or organizations
    (Ryns and Henson 2015). Once the person receives that e-mail, the individual is
    redirected to a'
  merge: -1
  img_proc: true
- pgno: 187
  md: '# Cybercrime during the SARS-CoV-2 Pandemic (2019-2022)


    fraudulent Internet website with the single purpose of convincing them to reveal
    confidential information such as bank account or credit card information (Ryns
    and Henson 2015; Antunes and Rodrigues 2018). Along phishing, other methods such
    as smishing, which instead of sending e-mails, the offender sends text messages
    to the potential victim (Williams 2016), have been used. Furthermore, OIT can
    also be committed through the resource of pharming. This is a particular case
    of phishing and a more complex technique in which there is an appropriation or
    usurpation of the domain or URL of a legitimate webpage, which translates to the
    forwarding of the users to a fraudulent page in which personal information is
    requested. Once the fraudulent page is accessed, a virus or malicious software
    is installed, allowing personal or financial information to be stolen (Brody et
    al. 2007). Another technique used by the perpetrators is the well-known hacking,
    an unauthorized access, which may lead to malicious purposes such as spreading
    malware (Antunes and Rodrigues 2018).


    # 5.4.2 RAT applied to cyberspace


    The RAT developed by Cohen and Feldman (1979) argued that “structural changes
    in activity patterns can influence crime rates by affecting the convergence in
    space and time of three minimum elements of direct-contact predatory violations:
    (1) motivated offenders, (2) suitable targets, and (3) the absence of capable
    guardians against a violation” (p. 589). This approach was developed to explain
    offenses and victimization that occur in the physical world, specifically in the
    post-World War II scenario, since authors believed that people changed their routes
    after that.


    With the advent of multiple forms of cybercrimes, many authors have been debating
    the applicability of this criminological approach to cyberspace. While Year (2005)
    and Leukfeldt and Year (2016) have been questioning the applicability of RAT to
    cybercrime, arguing that the convergence of victim and offender in time and space
    is essential, authors such as Graboski (2001) consider cyberimes as “new wine
    in old bottles”, and thus defend that this approach can be applied to crimes in
    cyberspace. Accordingly, Eck and Clark (2003) suggest that this criminological
    theory can be extended to cases in which the victim and the offender are part
    of the geographically dispersed network, and therefore the offender is able to
    reach the target through the network. In these authors’ point of view,'
  merge: -1
  img_proc: true
- pgno: 188
  md: Previous studies found mixed results concerning the importance of online exposure
    to explain victimization in cyberspace. For instance, Holt and Bossler (2009)
    did not find a statistically relationship between loss of digital information
    by malware and online shopping, online chatting and online banking. Moreover,
    Leukfeldt (2014) did not observe a relationship between the activities performed
    online and the risk of victimization. On the other hand, Marcum et al. (2010)
    and Ngo and Pateroster (2011) found that the online exposure (e.g. number of hours
    per week that respondents engaged in instant messaging) increased the likelihood
    of experiencing online victimization. Furthermore, van Wilson (2011) observed
    that participation in forums and online shopping increased the likelihood of online
    fraud victimization and, in accordance, Reynolds (2013) found that making reservations
    online, online social networking and purchasing behaviors were related to phishing.
    Specifically in what concerns OIT and RAT, a set of important needs needs to be
    pointed out. For instance, Reynolds (2013) discovered that individuals who used
    online banking and/or e-mail/instant messaging were about 50% more likely to become
    victims of OIT. Furthermore, Reynolds and Henson (2015)
  merge: -1
  img_proc: true
- pgno: 189
  md: '158    Cybercrime During the SARS-CoV-2 Pandemic (2019-2022)


    concluded that some online activities such as online banking and purchasing contributed
    positively to OIT victimization.


    As previously mentioned, another crucial dimension of the RAT approach is the
    target suitability (Cohen and Felson 1979). Generally, when applied to cyberspace,
    this dimension is usually measured through the adoption of online risky activities
    – visits to unprotected websites, providing personal information or having personal
    data posted online (Reyns and Henson 2015) – since all of these activities can
    make the targets more attractive to the offenders (Clarke and Cornish 2000). Multiple
    studies have also been testing this dimension to a set of different cybercrimes.
    For example, Alshalan (2006) found that the more people divulge their credit or
    debit card numbers and disseminate their personal information, the more they are
    at risk of becoming cyber victims. Later, Ngo and Pateroster (2011) observed that
    clicking/opening links were activities that significantly increased the risk of
    acquiring a computer virus. Interestingly, Reyns (2015) showed that individuals
    had their information posted by someone else face a higher victimization risk,
    while those who posted accurate information had a reduced victimization risk.
    In a more recent study, Ngo et al. (2020) found that individuals who use online
    banking and online travel planning had a lower risk of experiencing harassment
    by a nonstranger. Concerning OIT, Reyns and Henson (2015) suggested that having
    personal information posted online increased the victimization, and Leukfeldt
    and Yar (2016) found that targeted browsing, or the search for news influenced
    OIT.


    Finally, the third element of RAT – capable guardianship – reduces the risk of
    victimization through voluntary actions or simply because of its presence. In
    the digital context, the results have been mixed, mostly because there have been
    measures to operationalize the guardianship dimension (Reyns and Henson 2015).
    Holt and Bossler (2008) found that the physical guardian (software) did not reduce
    online harassment. Nevertheless, Ngo and Pateroster (2011) found a positive correlation
    between using secure software and malware victimization and online harassment
    committed by strangers. Choi (2008) discovered that college students who used
    a capable physical guardian had a lower risk of being victim by a computer virus.
    However, Bossler and Holt (2009) and Ngo and Pateroster (2011) did not find a
    significant relationship between malware infection and the computer skills of
    the individuals. Contrarily, Holt and Bossler (2013) found that a low level of
    computer skills and using anti-virus software were'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'among the significant predictors of malware infection. Holt et al. (2020) found
    that having a secured wireless connection decreased the risk of crime.


    Finally, considering the OIT victimization, Reynolds and Henson (2015) found out
    that none of the items included in the capable guardian operationalization were
    relevant to reduce victimization. In turn, Williams (2016) tested if OIT was negatively
    associated with three types of guardianship: active personal, avoidance personal
    and passive physical guardianship. The author concluded that passive guardianship
    (e.g. using anti-virus) was effective in reducing OIT. Another interesting result
    was the positive association between active personal guardianship and victimization,
    explained by the post-victimization security reactions.


    # 5.4.3. Individual variables and OIT victimization


    Regarding the relationship between individual variables (e.g. sociodemographic
    characteristics) and online victimization (including OIT) results were found.
    For instance, Leukfeldt (2014) or van Wislem (2013) did not find evidence that
    suggested the importance of individual characteristics in the likelihood of being
    victimized by OIT. Nevertheless, Alshal (2006) found that more males were victims
    of computer viruses and cybercrime than women. Accordingly, Holt and Turner (2012)
    observed that males were at greater risk of OIT victimization, which is consistent
    with the results presented by Reynolds (2013). Contrarily, Anderson (2006) found
