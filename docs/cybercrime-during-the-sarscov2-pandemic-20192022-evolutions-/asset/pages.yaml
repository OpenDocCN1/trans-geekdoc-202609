  md: '# Cybercrime During the SARS-CoV-2 Pandemic (2019-2022)


    Nevertheless, it should be noted that over the past 2 years, advancements within
    organized cybercrime have had other driving forces than the Covid crisis alone.
    One should bear in mind the necessary adaptation of operating methods, the attack
    tools used, the choice of targets, imposed by technical developments: in that
    sense, cybersecurity can make certain targets too resistant, require too much
    effort on the path of the attackers, making the intended targets less attractive.
    Certain skills may also become necessary while others are no longer required due
    to technical and technological advances.


    +   – The scarcity of opportunities in the confined “offline” world could have
    prompted a shift from “offline” crime to “online” crime [PLA 21]. This hypothesis
    has its detractors [MIR 21] for whom the shift does not occur from offline to
    online crime, but mainly within the online crime category.


    # 1.2.2. Theoretical frameworks


    Focusing on the transformations in the lifestyles and daily practices of hundreds
    of millions of individuals throughout that period at a global scale – which offered
    new opportunities for crime – the routine activity theory [COH 79] became popular
    as the main explanatory framework [HAW 20, KEM 21, GOV 21, HOR 21, PLA 21, CHE
    21, KOP 22, OLO 22, IMS 22].


    According to this, a crime is likely to be committed when three conditions are
    met: the presence of a motivated offender, the presence of an accessible target
    the offender/criminal and the absence of an efficient guardian. Target vulnerability
    increases when all three elements are present. Hawdon [HAW 20] have argued that
    the societal changes forced by the compulsory lockdown quantitatively and qualitatively
    increased those conditions. Vulnerability, or in this case cyber risk, increased
    because the threat (the motivated malicious actor) and the vulnerability (the
    presence of suitable targets) converged on the same place (cyberspace) at the
    same time.


    In Collier et [COL 20], low-level cybercrime (in terms of technical capabilities)
    may have increased due to the rise in the confined teenagers and young adults
    who seemed to be launching small attacks against poorly protected networks for
    fun and to earn a little money. This idea was further discussed by Payne [PAY
