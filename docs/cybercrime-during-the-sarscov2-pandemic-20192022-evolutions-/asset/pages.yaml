  md: '# 102 Cybercrime During the SARS-CoV-2 Pandemic (2019-2022)


    to extremism” [KHA 21]. This extremist logic forms the essence of 21st-century
    accelerationism. What we are now witnessing, therefore, is a form of what can
    be described as meta-radicalization a typology of radicalization that blurs the
    traditional heterogeneity of online and offline activity. This new form of radicalization,
    a product of the digitization of life under Covid-19, prompts us to understand
    cybercrime and offline militancy as an interconnected, experiential process that
    seamlessly spans the digital and physical worlds around us. Undoubtedly, the forces
    we describe in this chapter are still taking shape. They do, however, offer initial
    glimpses of what the future may hold.


