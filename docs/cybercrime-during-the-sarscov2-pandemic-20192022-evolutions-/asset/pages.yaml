    # 3.7. From virtual to real-life criminality


    Accelerationism views the development of digital communications technologies –
    especially networked technologies – as dialectic elements in the capitalist system.
    These, especially in their social media variety, are as lucrative destructive
    weapons that contain the seeds of capitalism’s destruction. For accelerationists,
    social media sites are as instrumental harbingers of a radical corruption of our
    social structures. This is because they embody some of society’s extreme tendencies:
    frantic speed, overestimation and the “data-hungry dystopia” of anarchic globalization
    [DIX 17]. By its very essence, the social media universe embodies unmanageable
    velocity, data-gigantism, abstract detachment and in short, uncontrollable discord.
    This places them in direct opposition to what accelerationists refer to as “folk
    politics”, namely efforts to “secede from the political field of globalized, developed
    capitalism. Associated with these calls for a refer to authenticity, to immediacy,
    to a world that is transparent, human-scaled, tangible, slow, harmonious, simple
    and everyday” [DIX 17]. These are dismissed by accelerationists as romanticized
    attempts to prolong capitalism’s essence. They are therefore seen as stumbling
    blocks that delay the system’s inevitable collapse and prevent the dawn of a post-capitalist
    future.


    Some theorists of 21st-century accelerationism go as far as to suggest that it
    is built on the Internet, especially social media, which constitutes its most
