  md: '# # Cybercrime in Brazil After the Covid-19 Global Crisis: An Assessment of
    the Policies Concerning International Cooperation for Investigations and Prosecutions


    # ## 4.1. Introduction: Brazilian cybercrime and the Covid crisis impact


    Cybercrime is not a new subject for Brazilian authorities. A 2015 article states
    that Brazil was the second most vulnerable country to cybercrime (Muggah and Thompson
    2015). The article also informs us that Brazilian society has lost between 4.1
    and 4.7 billion US dollars in data theft and financial fraud. Most of the targets
    of cybercrime were businesses and citizens who had money in banks. The article
    concludes that the Brazilian government and society should implement more reforms
    to tackle cybercrime. But how is the country performing reforms to achieve this?
    This chapter answers with two evaluations: the most recent reforms and what else
    is coming shortly. In addition, it traces the current situation of cybercrime
    in Brazil after the pandemic crisis using multi-sources data. It uses quantitative
    data available from SaferNet and the Federal Prosecutors'' Office of Brazil and
    qualitative data from four exploratory interviews with law enforcement personnel
    (LEP). SaferNet is a non-profit and non-governmental organization that dates back
    to 2005 (SaferNet, 2021a). Its'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'mission is to support a safer usage of the Internet. It has partnerships with
    many Brazilian state agencies, enterprises and other non-governmental organizations
    (SaferNet, 2021b). The Federal Prosecutors’ Office of Brazil is responsible for
    fighting cybercrime when it has transnational links. The LEP interviews serve
    two purposes. First, they all have a great deal of experience in cybercrime and
    international cooperation for criminal matters and, therefore, have a lot to say
    about the subject. Secondly, they show how the Covid crisis was a watershed moment
    for cyberfighting in Brazil, as LEP-2 describes:


    We had a rise with cybercrime. (...). Many people started using the Internet because
    of the pandemic, and they do not have the skills to protect themselves. They become
    easy prey. (...). In my perception, there was a rise in financial cybercrime and
    in the sexual abuse of minors.


    The increasing expansion of cybercrime led the LEP to organize themselves into
    units and groups all over the country. More pressure from cybercrime led to an
    improvement in the authorities’ response. The most visible change was upgrading
    the debate about international cooperation to fight against cybercrime. This debate
    led to two major reforms. The first reform was the passing into law of some bills
    to better prescribe such conducts as crimes. The second reform is ongoing. It
    is the process of better integrating Brazil into the international networks against
    cybercrime. We use data to provide not only a description of the Brazilian case
    but for interpreting it to raise a theoretical legal problem concerning the interaction
    between authorities of many different countries to fight cybercrime. The conceptual
    transposition of cybersecurity to social sciences is an ongoing debate that requires
    more empirical research to build up an epistemological debate (Loiseau 2020).


    This chapter has six main sections and a conclusion. Section 4.2 presents a literature
    review to enlighten the cybercrime subject, extracting some elements from them
    to assess the Brazilian case. Section 4.3 presents a theoretical debate. We consider
    that fighting against cybercrime demands national efforts to improve international
    cooperation. Nonetheless, that will require an increase in both legal and technical
    solutions. The legal community must try improve a specific legal concept to supply
    the basis for cooperation, for one side. It will also be relevant to create more
    technological systems to exchange and transfer data between authorities'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Cybercrime in Brazil After Covid-19 111


