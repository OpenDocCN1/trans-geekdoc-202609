    # 3.4. The pre-pandemic domestic threat landscape


    The onset of Covid-19 found America’s domestic threat landscape in a state of
    heightened anxiety, following the 8 years of Barack Obama’s presidency and the
    emergence of the phenomenon of “Trumpism” [SAV 19]. The most organized and – far
    most ominous elements of that threat landscape consisted of the heavily armed
    constitutional militias. American federal and state laws classify militias into
    organized and unorganized ones. Organized militias include members of the United
    States National Guard, or established military units. Unorganized militias may
    be composed of American citizens who are not members of organized military units
    but can still be called in times of national emergency, or war [ADL 20]. These
    provisions have given rise to so-called “private” or “constitutional” militias
    – namely armed groups that are not recognized as organized by federal or state
    governments. The constitutional militia movement emerged in the 1990s, to trace
    its ideological roots to the so-called Minutemen militias of the civil-rights
    era, which were informed in almost equal measure by anti-communist and pro-segregation
    ideology [DRA 07]. The constitutional militias of today do not only subscribe
    to white supremacy, yet can be grouped into what is often referred to in the specialist
    literature as the anti-government “patriot movement”. Adherents of this loosely
    affiliated movement are united in the conspiratorial view that United States and
    supranational organizations like the United Nations are secretly building a tyrannical
    global government, referred to as the “New World Order” [GAL 00]. Such groups
    have been known to consciously direct their recruitment efforts at military service
    members, veterans and law enforcement personnel [WAT 21], as this potentially
    augments their tactical capabilities. A contemporary representative of the patriot
    movement is the Oath Keepers organization (founded in 2009), which focuses almost
    exclusively on recruiting or former members of the military, law enforcement and
    first responders communities [CSI 21]. The Oath Keepers assumed a leading role
    in marches across the United States during the coronavirus pandemic. Several of
    their members were subsequently charged by the government with “seditious conspiracy
    and obstruction of Congress” [DRU 22].


    Another constitutional militia that took armed action against the state during
    the height of the Covid-19 pandemic is the Three Perimeters. Founded in 2008,
