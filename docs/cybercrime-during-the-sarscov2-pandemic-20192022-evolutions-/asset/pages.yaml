- pgno: 215
  md: 'of disinformation. The legislation includes the Electronic Communications and
    Transactions Act (Act 25 of 2002), South African Cyberimes Act (Act 19 of 2020),
    the Protection of Personal Information Act (Act 4 of 2013), the Disaster Management
    Act (Regulations) and the Film Publications Board Amendment Act (Act 11 of 2019).
    In addition, South Africa has a National Cybersecurity Policy Framework to guide
    the implementation and development of cybersecurity capabilities within the country
    [SSA 15].


    The Electronic Communications and Transactions Act (ECT) was the initial act introduced
    a number of provisions, which are now expanded upon in later acts. This includes
    the protection of personal information in Chapter VIII, and Cybercrime in Chapter
    XIII. Notably, Section 15 of the ECT Act also explicitly considers the use of
    “data messages” as evidence in legal proceedings. The act also regulates cryptography
    and authentication providers and has other clauses that relate to security [ECT
    02].


    The Cybercrime Act was signed into law in 2021, with some enactments taking effect
    from the 21st of December 2021 [BUS 21b]. Included in the Act are the types of
    harmful messages that have been criminalized in South Africa. These include the
    incitement of damage to property or violence, and the unlawful containment of
    an intimate image [CYB 20]. However, the Act does not give a specific definition
    for cybercrime. Therefore, fake news can be criminalized in a broader sense under
    the relevant legislation, and the spreading of disinformation and misinformation
    via digital technologies then becomes a cybercrime.


    Although the Act has faced numerous criticisms including a major criticism concerning
    the removal of Section 17, which specifically criminalized fake news [MOY 18],
    it has been implied under Section 9 as Cyber fighting and criminalizes, among
    others, the disclosure of harmful data messages and disinformation spread through
    digital mediums such as WhatsApp. While the Cybercrimes Act took approximately
    5 years and three re/amendments prior to enactment, it does work with other laws
    and regulations. The Cybercrimes Act has a number of provisions that interact
    with certain aspects of the Protection of Personal Information Act (POPIA), which
    took almost 5 years to enact and almost 8 years to implement.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# A South African Perspective on Cybercrime During the Pandemic 185


    POPIA specifically regulates the methods used for the lawful processing and protection
    of personal information of natural and juristic persons in terms of storage and
    usage similar to that of the EU’s General Data Protection Regulations (GDPR).
    In cases where any personal information becomes subject to unauthorized access
    or possession, POPIA addresses these issues and premises for the responsible party
    or parties to have taken appropriate measures to secure and safeguard the personal
    information first and foremost; however, when a data breach takes place, it is
    the duty of the responsible party to take reasonable steps to address the breach
    including to report the occurrence to the Information Regulator. Those responsible
    for any unauthorized access or possession of personal information can now also
    be charged with an offence under the Cybercrimes Act [BHA 21]. The POPIA has very
    few specific crimes, although it did not criminalize non-compliant entities. However,
    one of the side effects of the Cybercrimes Act is that it ultimately characterizes
    non-compliance to the POPIA, thereby making the POPIA stronger and more effective
    [GIL 21].


    The South African Disaster Management Act Regulations are currently enforced in
    South Africa. While most aspects of the Regulations are intended to protect public
    health during the Covid-19 pandemic, Section 11(5) of the Regulations creates
    several content-related infringements with respect to publishing statements surrounding
    Covid-19. These infringements are punishable by five to six months imprisonment.
    More specifically, Section 11(5) criminalizes the publication, through “any medium”
    of information with the “intention to deceive any other person about” Covid-19,
    the Covid-19 infection status of any person or government measures taken in response
    to Covid-19 [ART 21]. Specific incidents and cases related to disinformation are
    discussed in section 6.4.4.


    While this legislation was specifically designed to counter the creation and spreading
    of dissemination of disinformation about the Covid-19 pandemic, this type of legislation
    is becoming more relevant in South Africa, although this is at a slow pace. The
    incentive in developing such legislation is due to the creation of privacy laws
    such as POPIA as well as Section 16 of the South African Constitution [CON 96],
    which protects an individual’s right to expression.'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# 6.4. Cybersecurity incidents


    As with the rest of the world, South Africa was affected by cybercrime related
    to the pandemic. Van der Merwe indicated that there was a 10-fold increase in
    affected devices in South Africa, beginning immediately after the state of disaster
    announcement in March 2020 [VAN 20a]. Pieterse provides review of cyber incidents
    in South Africa from 2010 to 2020. While a general increase has been seen over
    the period, the increase from 2019 to 2020 is the largest: from 11 to 19 incidents
    (an increase of 8) [PIE 21]. This supports the report by van der Merwe [VAN 20a]
