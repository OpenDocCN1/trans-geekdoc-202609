    # 5.6.1. Measures


    Three main dependent variables are considered in this study: OIT victimization,
    fear of OIT victimization and perceived risk of OIT victimization. Moreover, a
    set of independent variables (sociodemographic, general fear of crime and online
    activity dimensions) were measured.


    Dependent variables: To measure victimization of OIT, respondents were asked to
    rate on a scale of 0 to more than five times "how many times someone had appropriated,
    via the Internet, personal and financial data without prior consent and knowledge
    and used them improperly" during their lifetime and in the last 12 months. Prevalence
    of OIT victimization in a lifetime and in the last 12 months was computed, resulting
    in two dichotomous variables (0 = no; 1 = yes). Moreover, indirect victimization
    was also measured, asking the respondents to answer yes (=1) and no (=0) to the
    question "do you have any family, friend or acquaintance who has had someone appropriate,
    via the Internet, personal and financial data without prior consent and knowledge
    and used them improperly?


    In turn, fear of OIT was measured through a four-point Likert scale varying from
    1 (not afraid) and 4 (very afraid), asking participants "how fearful would you
    be if (1) somebody stole your personal and financial data online? (2) somebody
    used your personal and financial data online? (3) somebody damaged your reputation
    based on the illegitimate use of your personal and financial data online?" Regarding
    the risk perception of victimization related to OIT, participants were asked to
    rate on a scale from 1 (not likely) to 5 (very likely) the following items: "how
    do you think it is..." (1) somebody could steal your personal and financial data
    online during the next 12 months? (2) somebody could use your personal and financial
    data online during the next 12 months? (3) somebody could damage your reputation
    based on the illegitimate use of your personal and financial data online during
    the next 12 months?


    In addition to the above-mentioned dependent variables, a survey applied post-Covid-19
    included additional questions concerning the victimization of several cybercrimes,
    including cyberbullying, cyberstalking, hacking, phishing, OIT and malware. Respondents
    were asked "in the last 24 months, have any of the following situations happened
    to you?"'
