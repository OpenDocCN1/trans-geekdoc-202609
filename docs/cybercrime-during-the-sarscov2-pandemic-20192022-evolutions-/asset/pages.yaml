    (1) Major crime manifests itself by polycriminality. Major criminal groups are
    opportunistic and pragmatic in criminal markets, in the sense that they do not
    necessarily develop a specialization of their criminal practices. (2) These groups
    are territorialized, rooted in a space that allows them to create their own biotope,
    setting up hermetic enclaves inaccessible to the public authorities. This favors
    their territorialized and immaterial expansion in the cyberspace. (3) These groups
    and organizations are considered highly adaptable to socioeconomic changes and
    resistant to repression by the public authorities or to the competition from other
    criminal groups. (4) Finally, these groups have major macroeconomic impacts since
    they manage massive, globalized and interconnected financial flows that facilitate
