  md: 'Criminals used fake data and Internet cashing systems to receive payments they
    would not qualify for. We saw criminals using dead people''s data to cash checks.
    Also, we saw criminals stealing data from persons who did not need the payments
    and altering them just to cash.


    These cases gave the law enforcement personnel a lot of work. A critical part
    of the process had killed skilled staff identifying frauds and criminals and recovering
    funds (Lima 2020). The criminals were primarily Brazilians. Nevertheless, they
    could use a lot of different routes to transfer funds abroad. A tiny part of the
    federal money was recovered (Rodrigues 2020). This lack of success relates back
    to the need for international cooperation to tackle contemporary cybercrime. The
    following section will present a model to introduce the subject of international
    cooperation from a theoretical point of view.


    # 4.3. A theoretical model for international cooperation


    It is possible to provide a model to compare the countries'' readiness for cybercrime
    fighting and international cooperation procedures and measures. We will use the
    concept of interoperability to reach an advanced theoretical model. Nonetheless,
    we can again state that it is impossible to understand interoperability in legal
    and social terms in the same manner as technical systems (Belli and Foditsch 2016).
    Legal interoperability can happen in various degrees, while technical interoperability
    occurs with a binary response (yes or no). The first variable set of our model
    focuses on the national jurisdictions. But other variables can be added to improve
    the complexity of any analysis, legal regional integration.


    Focusing on national level systems, on the one hand, we can evaluate the crimes''
    definitions compared to some standard social conducts abroad. On the other hand,
    we can evaluate the procedural practices to infer how they are like some standards
    abroad. The second focuses mainly on international means and channels. We can
    begin evaluating how well one country can provide aid to other jurisdictions.
    The model can also measure the country''s capacity to conduct local investigations
    and prosecutions, requesting international cooperation by providing data and distributing
    them along with these four variables.'
