- pgno: 19
  md: '# I.2. Literature review: works on the theme “cybercrime and Covid”


    # I.2.1. Main themes and hypotheses


    The effects of the epidemic on global society have inspired many reflections since
    the first months of 2020. These explore the impacts of the pandemic on:


    +   - the economy: an increase in poverty together with a health crisis plunging
    millions of additional workers into it, as well as an increase in unemployment,
    with “around 200 million unemployed people in 2022, that is, a lot more than the
    187 million in 2019” [ONU 21];


    +   - culture [YU 21], education [ONY 20] and science [GUP 21]:

    - security and defense: the epidemic brought to the weaknesses of the common European
    security and defense policy, highlighted the vulnerabilities of member states
    in terms of infrastructure, supply chain and communications security. The pandemic
    accentuated the retreat of the United States and the EU from the international
    scene, to the benefit of China, posing a challenge in several areas, including
    IT security and cyber capabilities. The pandemic has been described as an accelerator
    of pre-existing trends and an amplifier of instabilities [MEY 21]. The protection
    against the pandemic became a matter of national security; both the economic vitality
    of a nation and its way of life were endangered. Due to the spread of globalization,
    it influenced all states, whose destinies were more closely intertwined than they
    had been in the past centuries. The pandemic was destructive and disruptive. It
    disrupted or paralyzed the security and defense strategies of states, simultaneously
    exposed to several threats or risks such as crime, terrorism and foreign state
    threats. The Covid-19 pandemic was categorized as an event with a profound and
    lasting impact on the international security environment [ORO 22]. The Covid period
    favored and stimulated the development of new criminal activities [EUR 20b] (fraud,
    international trafficking, counterfeiting, etc.) feeding on global instability
    [KEN 21].


    From the early months of 2020 – when the pandemic was still in infancy – articles
    addressed the question of evolution of cybercrime in such a context.'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Introduction xix


    Some guiding themes and hypotheses have emerged from the abundant literature produced
    since then, both academic and non-academic (national and international organizations,
    cybersecurity companies, private and public sectors, etc.). The following should
    be retained:


    +   - By reinforcing the role of the Internet, the management of the Covid-19
    crisis (lockdown, teleworking, social distancing, tracking applications, e-commerce,
    etc.) created favorable conditions for cybercrime. Organized crime could take
    advantage of the enlargement of the attack surface by multiplying or diversifying
    criminal opportunities [TRI 20]. The conditions then created acted both as a catalyst
    [BOU 21] and an accelerator of cybercrime.


    +   - The multiplication of vulnerabilities and criminal opportunities acted as
    a key factor in the evolution of cybercrime since the pandemic onset: the lockdown
    transformed Internet uses, certain online practices as e-commerce was auspicious
    for the theft of personal data; teleworking [TAB 20] isolated employees who could
    be the target of social engineering attacks [VEN 21]. The changes brought about
    by the pandemic in everyday life, particularly the users of “cyber”, played a
    central role in the evolution of cybercrime.


    +   - Attack vectors diversified, involving the creation of new attack scenarios
    [GRY 21]. The thriving of cybercrime during the pandemic was mainly the result
    of its ability to adapt, innovate and renew its operation methods [COR 20], its
    business model [LAA 21] and even the reconfiguration of some of its groups. ANSSI
    discusses the professionalization-of professionalization of organized cybercrime
    groups and the specialization process which has characterized the evolution of
    cybercrime in recent years [ANS 22]. Internet uses changed during the lockdown
    phases, shifting vulnerabilities or creating new ones: cybercrime also had to
    adapt to this reconfiguration of the attack surface in order to seize opportunities
    [LAZ 21]. For example, this was done via “thematized” operations (the registration
    of tens of thousands of domain names using the “Covid” and associated terms) [NAI
    20], or by aiming their actions towards essential sectors in health crisis (health
    industry, vaccine research centers, hospitals, logistics, etc.). The attacks on
    healthcare actors were at the core of the research carried out by Chigata and
    Madzingen [CHI 21]. While crime remained unchanged in its nature or composition,
    it simply adapted to the new scenario. Cybercrime polished its methods, its targets,
    in some cases even its organization, matching the new context in which it evolved.'
  merge: -1
  img_proc: true
