  md: '# A South African Perspective on Cybercrime During the Pandemic


    # 6.1. Introduction


    The World Health Organization (WHO) was notified of a new coronavirus disease
    in December 2019, and by the end of January 2020 it had been declared a “Public
    Health Emergency of International Concern” [WHO 20]. Identified as “Covid-19”
    in February 2020, over 2 million global cases had been reported by mid-April 2020,
    affecting nearly every nation [EUR 20, WHO 20].


    For the purposes of this chapter, the definition of cybercrime used by Stalling
    and Brown [STA 18] will be followed: computers or computer networks are a tool,
    a target or a place of criminal activity. Given the prevalence of other “smart
    devices” connected to networks and the Internet, these will be considered as “computers”
    in the above definition. This aligns with the US Department of Justice categorization
    of cybercrime [DOJ 00]. Essentially a computing device or network can be subjected
    to malicious interference that has the potential to affect the normal functioning
    (computer as a target); computers and networks can be used to conduct criminal
    activity, and computing devices can be used as a passive storage device for illegal
    content [DOJ 00, STA 18].'
  merge: -1
  img_proc: true
- pgno: 209
  md: '# Cybercrime During the SARS-CoV-2 Pandemic (2019-2022)


    The chapter investigates cybercrime activity during the Covid-19 pandemic from
    a South African perspective. There is disagreement whether South Africa saw an
    increase in cybercrime as reported by van der Merwe [VAN 20a], whether there was
    a shift in cybercrime tactics during the pandemic as indicated by Van Walt [VAN
    20b]. The chapter provides exploratory research to investigate cybercrime trends
    in South Africa, and attempts to clarify the question of whether there was an
    increase, a shift in tactics or both. International rankings, national legislature
    and regulations and reports of incidents are considered to analyze the trends.
    A limitation experienced is the lack of formal reporting of cybercrime and cyber
    security incidents in South Africa. Therefore, the information required is obtained
    from news reports on incidents and industry reports and whitepapers illustrating
    trends.


    The chapter is structured as follows: the remainder of the introduction presents
    a background to South Africa’s experience of Covid-19 pandemic in section 6.1.1
    and describes the methodology in section 6.1.2. The three focal aspects, the international
    rankings, the national legislation and regulations and the incident analysis,
    are presented in sections 6.2–6.4, respectively. Section 6.5 discusses and triangulates
    the outcomes from the analysis, and the chapter is concluded in section 6.6.


    # 6.1.1. Background to South Africa and the pandemic


    South Africa announced a state of disaster in March 2020 in relation to the pandemic
    [VAN 20a]. The national disaster regulations were strict: implementing curfews,
    limiting sales to only essential items and outlawing the spread of disinformation.
    The initial intent was to delay the increase of cases to allow the health sector
    to prepare for what was to come.


    The first wave peaked in mid-2020 and had subsided by August. The second wave
    occurred from December 2020 to January 2021, the third wave largely driven by
    the Delta variant occurred in mid-2021. At the time of writing, South Africa was
    experiencing its fourth wave (December 2021 to January 2022), driven by the Omicron
    variant. Figure 6.1 presents the new cases of Covid-19 in South Africa from January
    2020 to December 2021, and the four waves can clearly be seen.'
  merge: -1
  img_proc: true
- pgno: 210
  md: '# A South African Perspective on Cybercrime During the Pandemic


    ![](img/64f4b6927983f9e91632298e812b4fa7_210_0.png)


    Eventually, the lockdown regulations were structured into five levels, with the
    initial lockdown (26 March to 30 April) at level 5, reducing to level 4 until
    31 May and then level 3 until 17 August. The country returned to level 3 from
    29 December 2020 to 28 February 2021, and levels 3 to 4 from 16 June to 12 December
    2021. Between waves, the country on levels 2 and 1 had varying degrees of curfews,
    alcohol bans and gathering numbers. In all levels, the wearing of masks in public
    was mandated, with remote working recommended where possible; however, in the
    initial level 5 restrictions, only the essential services for organizations were
    able to be present on-site [SAG 21].


    Another notable incident that occurred during the pandemic was the incarceration
    of former president Jacob Zuma, which was linked to the massive protests and looting
    in July 2021, particularly in the province of KwaZulu-Natal, around the major
    port city of Durban [BBC 21]. The relationship of these events to to cyber-security
    incidents and disinformation will be discussed in the relevant sections.


    # 6.1.2. Methodology


    The objective of this chapter is to investigate cybercrime from a South African
    perspective during the Covid-19 pandemic. This is mostly exploratory research;
    however, a specific question to be answered is whether cybercrime increased during
    the pandemic.'
