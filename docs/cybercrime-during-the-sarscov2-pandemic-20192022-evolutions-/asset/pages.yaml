    # 5.6.3. Variables associated with online victimization and fear of identity theft


    This section intends to analyze what factors are associated with both victimization
    and fear of OIT. Therefore, the sample after Covid-19 was taken into consideration.
    Concerning the influence of individual variables on online victimization, results
    suggested that gender, perception of socioeconomic status, education and age were
    not associated with the likelihood of being victimized. Nevertheless, when analyzing
    the relationship between online victimization and the contextual variables, it
    is possible to observe individuals who reported to open dubious links present
    a higher likelihood of being victimized ($p=.015$).


    Regarding fear of OIT, results showed that women reported more fear than men ($p
    < .001$) and an absence of correlation between age and fear. Perception of socioeconomic
    status was not related to fear of OIT. Interestingly, a positive correlation between
    this variable and the general fear of crime was observed, meaning that individuals
    who reported feeling insecure when walking in their residential area after dark
    also tend to report higher levels of fear of OIT ($r=.123, p<.001$). Finally,
    when analyzing the contextual variables, a set of important results emerged. In,
    individuals who report higher levels of fear of OIT tend to adopt more avoiding
    security behaviors online. Additionally, considering the target suitability, high
    fear is related to talking less with strangers in the cyberspace ($r=.101, p<.001$).
    Moreover, individuals with lower computer skills perception present higher levels
    of fear of OIT compared to individuals with advanced computer skills'
