- pgno: 123
  md: 'scholarly literature in the mid-1990s through the work of British philosopher
    Nick Land and the Cybernetic Culture Research Unit at Warwick University. Land’s
    view was that neoliberal capitalism was so all-encompassing that it “no longer
    had an outside” [LAU 17] from which its detractors could resist it. This resulted
    in a state of “political, cultural and theoretical paralysis” [LAU 17] of radical
    social movements. However, capitalism could be decisively combated by radicals
    willing to help accelerate the inherent contradictions of the system.


    Although accelerationism includes elements of theoretical radicalization, it signals
