    #  5.5. Fear of (online) crime


    Fear of crime is a serious social problem in its own right, and for that reason,
    it has been vastly studied in the last few decades (Jackson 2005). Researchers
    have been trying to understand not only how to best operationalize fear of crime
    (e.g. Gray et al. 2008), but also to discover the main individual and contextual
    determinants of fearing crime (e.g. Hale 1996; Guedes et al. 2018). The scientific
    community has consistently defined fear of crime as a phenomenon that includes
    three main dimensions: emotional fear of crime, cognitive perception of victimization
    and adopted behaviors for security reasons (avoidance, self-defense and protection)
    (e.g. Madrid 1997; Gabriel and Greve 2003). Even though fear of crime has been
    largely studied, is little known about the fear of online crime and specifically
    about the fear of OIT. In this investigation, we adopted Hille et’s (2015) definition
    of fear of OIT that includes two dimensions: the fear of financial losses and
    reputational damage. While the first corresponds to the fear of illegal or unethical
    appropriation of personal and financial data by unauthorized entity with the objective
    of getting financial benefits, the second corresponds to the fear of misuse of
    illegally obtained personal data with the goal of impersonation, which can cause
    reputational damage to the victim.


    #  5.5.1. Determinants of fear of (online) crime


    Gender is considered the best predictor of fear of crime (Hale 1996). However,
    except for domestic violence and sexual offenses, males are the most victimized,
    which has lead to the study and explanation of what is called the “fear-victimization
    paradox” (e.g. Hale 1996; Rader et al. 2007). When focusing on the fear of online
    crime, several studies found that women also report higher levels of fear of cybercrime,
    even though mixed results were also found. For instance, while Virtanen (2017)
    observed that women presented higher levels of fear of cybercrimes compared to
    men, Yu (2014) did not find any differences between women and men for fear of
    OIT, fraud'
  merge: -1
  img_proc: true
- pgno: 192
  md: 'and computer viruses. Accordingly, Roberts et al. (2013) found that gender
    was not a predictor of OIT, concluding that this type of victimization was mainly
    explained by contextual dimensions and the fear of traditional crime.


    Regarding age, it is possible to observe mixed results in traditional literature
    of fear of crime. For instance, authors such as Reid and Konrad (2004) found that
    the elderly reported more fear, Ziegler and Mitchell (2003) concluded that younger
    people reported more fear in an experimental study. These mixed results can also
    be found in the cyberspace sphere. For instance, Alshalhan (2006) and Lee et al.
    (2019) found that individuals reported higher levels of fear of cybercrime, suggesting
    that older people attribute more value to property and are more afraid of losing
    it. Nevertheless, Henson et al. (2013) and Virtanen (2017) observed that the younger
    people reported more fear than older ones. Roberts et al. (2013) discovered that
    age, with a positive direction, was the only predictor of OIT, but it accounted
    for less than 1% of the unique variance of fear of OIT and related fraudulent
    activities.


    Concerning fear of traditional crime, the negative relationship between fear and
    socioeconomic status is well established. However, this relationship is not so
    clear when it comes to cybercrime (Virtanen 2017). According to Alshalhan’s (2006)
    research, it is not possible to admit a direct relationship between fear and socioeconomic
    status. In contrast, Virtanen (2017) and Brands and Wilsem (2019) found that individuals
    with lower socioeconomic status presented higher levels of fear of cybercrime.
    Indeed, Virtanen (2017) found that experiencing online fraud increased fear among
    low social status individuals, which suggests that these individuals are more
    affected by property-focused victimization. On the other hand, Roberts et al.
    (2013) found that fear of OIT is common to all socioeconomic groups. Reisig et
    al. (2009) found that individuals who reported lower levels of socioeconomic status
    perceived higher levels of risk, which was associated with online protective behaviors
    to avoid the risk of becoming a victim of OIT. Similarly, and taking educational
    levels into consideration, Akdemir (2020) found that more educated individuals
    reported higher levels of fear of cybercrime compared to those who were less educated.
    Moreover, these individuals were more likely to adopt online security measures
    such as the elimination of suspicious emails. In contrast, Brands and Wilsem (2019)
    concluded that lower levels of fear of crime were reported by individuals'
