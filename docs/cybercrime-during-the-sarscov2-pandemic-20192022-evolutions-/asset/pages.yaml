    better to connect the country to the international networks against cybercrime.


    The most important fact is that Brazil finally is in the ongoing process of acceding
    to the Budapest Convention. The Brazilian Senate promulgated Congress Decree No.
    37 and published it on December 17, 2021 (Brazilian Federal Senate, 2021). The
    last step is the deposit of the ratification. We can assume the Covid crisis was
    fundamental for the country to pursue accession to this Convention. The next section
    will describe the Brazilian capacity to fight cybercrime, relying on data from
    an Organization of American States (OAS) report. We will also describe how the
    Brazilian legal system can integrate itself with the Budapest Convention. The
    LEP interviews provide information about how Brazil made this accession and how
    they perceived that this was a water-shedding moment. None of the interviews mention
