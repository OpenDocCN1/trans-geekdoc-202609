    The notion may be manifest as an economic, financial, debt, social, demographic,
    systemic, political (a state of power, a crisis in confidence, a crisis of democracy,
    etc.), humanitarian, migration, climate, environmental, national, international
    or global crime crisis [ALT 07]. Cyberattacks refer to crises resulting from one
    or more cyberattacks. These are rare events with a strong impact, situations when
    one or more malicious action(s) on an information system cause(s) a major disruption
    of the entity, having various and significant impacts, and sometimes causing irreversible
    damage [ANS 21].


