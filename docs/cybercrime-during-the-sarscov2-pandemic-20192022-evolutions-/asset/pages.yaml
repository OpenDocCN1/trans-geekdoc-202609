    # 3.8. Online radicalization during Covid-19


    It is important to stress that some of the trends outlined above were identified
    in the literature long before the onset of the coronavirus pandemic. Indeed, militants
    have used centralized, heavily vetted and encrypted online platforms for command
    and control functions, while also distributing propaganda on easily accessible
    social media platforms in order to attract new followers. That is a time-tested
    model for online militancy that predates our century [MIL 20]. Bleakley, in particular,
    has explained the process'
