  md: '# 2

    The SARS-CoV-2 Pandemic Crisis and the Evolution of Cybercrime in the United States
    and Canada


    # 2.1. Introduction


    The appearance and transmission of the SARS-CoV-2 virus causing the outbreak of
    Covid-19 in China and around the world between 2019 and 2022 has transformed living,
    working and interpersonal relationship habits. This pandemic has even been described
    as a great accelerator of social and digital transformations [PET 21]. The sanitary
    measures imposed by governments and the first lockdowns, worldwide [HOS 22]. This
    crisis generated unprecedented social transformations, which can be described
    as sudden, affected billions of people worldwide, among which lockdowns and social
    distancing policies were the most striking examples. Many societies were affected
    by a widespread and forced shift toward teleworking, online exchanges and dependence
    on remote government and healthcare services, which resulted in a significant
    increase in unemployment. The shift of economic activities from the offices in
    the cities to private residences and the poorly protected networks of individuals
    further exposed millions of individuals to cyberspace risks and threats [LAL 21].


    In a report published in August 2020, Interpol warned:


    Chapter written by Hugo LOISEAU.'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Cybercrime During the SARS-CoV-2 Pandemic (2019-2022)


    With organizations and businesses rapidly deploying remote systems and networks
    to support staff working from home, criminals are also taking advantage of increased
    security vulnerabilities to steal data, generate profits and cause [INT 20b, p.
    4].


    These major social changes triggered by the pandemic raise questions about their
    impact on cybercrime. Were the nature and frequency of cybercrime influenced by
    the shift of daily activities to cyberspace? Did criminals know how to exploit
    the opportunity offered to them to make their criminal activities thrive and,
    if so, how did they proceed? This chapter will study the impact of the SARS-CoV-2
    pandemic on cybercrime in the United States and Canada, by exploring the following
    general research question: how did the SARS-CoV-2 pandemic and its consequences
    affect cybercrime in the United States and Canada?


    The first part of this chapter will draw a rapid portrait of the pandemic crisis
    in Canada and the United States shall societal changes, namely the acceleration
    of society cyberization. Targets, victims and malicious actors (cybercriminals,
    in other words) will be introduced in the second part of the chapter, in the form
    of a literature review. Then, the impacts of the health crisis on the evolution
    of cybercrime in Canada and the United States will be explored. In the fourth
    part, the data presented in the previous part will be analyzed in depth, to finally
    conclude on the difficulties encountered throughout the study.


    # 2.2. The impacts of the SARS-CoV-2 pandemic


    The SARS-CoV-2 pandemic was a health crisis, activated by the way in which governments
    reacted to it. The compulsive shift of workers toward teleworking [CAM 22], the
    reduction of mobility, the shift toward remote teaching in education [TAD 20]
    and the use of the Internet for social contacts restricted by bans on social meetings
    accelerated the cyberization of certain sections of the world’s population. Not
    only did the pandemic crisis alter the evolution of crime [REG 22], but also that
    of cybercrime.


    On a strictly epidemic level, as demonstrated by the two graphs (see Figures 2.1
    and 2.2) compiled by the World Health Organization (WHO)'
  merge: -1
  img_proc: true
- pgno: 82
