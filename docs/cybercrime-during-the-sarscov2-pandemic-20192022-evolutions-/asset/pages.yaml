  md: '# 1.5.2. CVSS as indicators of vulnerability levels


    The number of vulnerabilities detected and their level of severity is another
    measure of the degree of exposure to risks in the cyberspace. Data relating to
    the CVSS produced by the NIST illustrates the evolution of these detections and
    vulnerabilities around the world since 2001 (see Figure 1.34). These vulnerabilities
    constitute part of the exploitable attack surface and reflect the awareness level
    that cybersecurity actors must develop concerning weaknesses.


    ![](img/64f4b6927983f9e91632298e812b4fa7_71_0.png)


    Figure 1.34. Evolution of CVSS depending on their level of severity over time
    (2022 data only covers the period from January to May). Histogram reconstructed
    from: https://nvd.nist.gov/general/vulnerability-visualizations/cvss-severity-distribution-over-time


    Medium-severity vulnerabilities were the most numerous over the entire period.
    In addition, growth was strongly accelerated in 2016. In particular, Covid years
    show no trend changes. Over the entire period, the number of vulnerabilities,
    on the three levels of severity, continued to grow.


    However, the share (expressed in the following figure as a % of the annual total)
    occupied by each level of severity evolved differently: while the “low” severity
    level fluctuated around 10% of the annual total, this was not the case for the
    other two levels: high-severity vulnerabilities decreased from 46% in 2001 to
    20% of the annual total in 2021, while on the contrary, the medium-severity level
    increased from 42 to 64%. Once again, the Covid years did not reverse nor they
    strongly accelerate the dynamics already at work in previous years.'
