  md: 'the international rankings in 2020, with some sectors showing significant increases
    in cybercrime (in some cases well over the global average), while the sectors
    that saw a decrease only did so by a small percentage. South Africa was hard hit
    by Covid-themed attacks, moving from 5th to 2nd between March and April 2020,
    and placing 2nd overall for the number of Covid-related malicious files detected.
    This implies there was both an increase in cybercrime and a shift in tactics.


    Considering disinformation as a cybercrime will inflate the figures, as this categorization
    is fairly recent and has not been included in previous studies. However, it is
    still important to note that malicious actors took advantage of the situation
    to cause further confusion and panic. The rapid change to online and remote work
    saw a rise in new types of nuisance attacks, many zoombombing, which was not prevalent
    before.


    The ITU Global Cybersecurity Index (GCI) defines the ability of a Computer Emergency
    Response Team (CERT) or Computer Security Incident Response Team (CSIRT) to be
    a full member of the Forum for Incidence Response Teams (FIRST) as a measure of
    success. This type of membership serves as confirmation that the CERT/CSIRT meets
    the level of maturity required and verified by the global CSIRT community to deliver
    its services in a trustworthy and effective manner [ITU 21]. Currently, South
    Africa has CERTs that are FIRST members: The National Cybersecurity Hub, the government’s
    Electronic Communications Security – Computer Security Incident Response Team,
    the South African National Research Network Computer Security Incident Response
    Team, the Standard Bank Group’s CSIRT and University of Cape Town Computer Incident
    Response Team [FIR 21]. While South Africa has more CERT/CSIRTs than some other
    nations, the NCPF’s objective of having sector-based CERT/CSIRTs [SSA 15] has
    not been realized given only 3 sectors (government, banking and academia) have
    such a capability. Given the disruption that the ransomware incident in the main
    freight organization caused, it is imperative that CERTs are established for other
    critical infrastructure sectors.


    While South Africa enacted new legislation to address cybercrime, and the Protection
    of Personal Information Act become enforceable in 2021, these measures have not
    come soon enough to mitigate the apparent surge of cybercrime during the pandemic.
    There is still a need to build capacity for the law enforcement sector in order
    to investigate and continue with legal'
