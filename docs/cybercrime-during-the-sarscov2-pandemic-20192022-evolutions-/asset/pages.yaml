  md: '# xii Cybercrime During the SARS-CoV-2 Pandemic (2019-2022)


    Wuhan, as the construction of field hospitals as progress the whole world could
    follow via webcams to the site on a permanent basis. Soon enough many cases and
    victims were identified in various parts of the world. The WHO officially announced
    the outbreak of this new disease on January 30, 2020 and declared it a global
    pandemic on March 11, 2020. As a result, several states in the world decided to
    implement emergency health safety policies. These policies were not implemented
    everywhere at the same time, or in the same way, given the fact that the epidemic
    did not evolve at the same pace around the world. In addition, governments had
    conflicting approaches as to what should be done (to the borders or not, to confine
    the whole population or only certain age brackets or professional categories,
    etc.). Measures took several forms:


    +   1) Those aimed at fighting the epidemic:


    +   - measures prohibiting or restricting movement within the states and/or internationally,
    the lockdown of national or local populations (districts, cities, regions), isolation
    of individuals and social distancing;


    +   - measures restricting social, economic and professional activities: store
    closures, the reduction of international trading volumes and the closure of schools
    and businesses.


    Measures were applied to varying degrees across the different countries - not
    in all states - at different times, and sometimes disparately within the same
    country, following specific schedules for each region (as was the case in France,
    and is still the case in China in 2022, where the population of Shanghai, for
    example, has been forced into strict lockdown, while other regions have not been
    confined).


    +   2) Some states also decided to implement measures to mitigate the negative
    effects produced by health constraints on society, in particular, the impact on
    the economy. It is worth recalling:


    +   - economic security measures: state funding in order to help the economic
    activity of companies, business loans, emergency social benefits, etc.;


    +   - measures to ensure the continuity of activities: not only remote working,
    distance learning, but also hybrid work formulas alternating teleworking and regular
    attendance to the office.'
