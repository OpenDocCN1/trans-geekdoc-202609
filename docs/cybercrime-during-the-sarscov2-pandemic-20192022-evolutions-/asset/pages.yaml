  md: '# Cybercrime in Brazil After Covid-19 133


    After acceding to the Budapest Convention, Brazil will have much legislation to
    reformulate in the next few years and it will have to expand its budget on international
    cooperation to fight against cybercrime. The Covid crisis shows that issues like
    cybercrime and pandemics cannot stay within borders. The accession to the Budapest
