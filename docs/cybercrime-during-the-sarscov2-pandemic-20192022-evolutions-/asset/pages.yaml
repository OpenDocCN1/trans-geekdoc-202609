    accelerationist strategists are systematically encouraging operational autonomy
    among militants, especially after the January 6 insurrection, which prompted the
    full weight of law enforcement to be placed on DVEs [JAR 22]. Yet, the principle
    of decentralization can be so deeply integrated into pandemic-era accelerationist
