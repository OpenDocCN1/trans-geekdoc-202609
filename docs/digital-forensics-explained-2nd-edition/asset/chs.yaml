  \n31. Wondracek, G. H. (2010). 一种对社交网络用户去匿名化的实用攻击。*2010 IEEE Symposium on Security\
  \ and Privacy*.\n\n# 第 10 章 社会工程取证\n\n## 引言\n\n社会工程是指操纵人员泄露信息或执行某些操作。操纵的结果是公司信息的直接流失和/或实现了社会工程攻击者希望的某些操作，例如访问计算机网络。本章讨论了社会工程工程师常用的主要的攻击向量：在线、电话、废弃物管理、移动设备、个人人身接触和反向社会工程。它还讨论了常用的社会工程方法。在调查社会工程事件时，法取证调查人员应遵循某些步骤。调查社会工程攻击的第一步是获取理解。\n\
  \n### 社会工程简介\n\n“社会工程技术专门设计用于绕过昂贵的 IT 安全防御措施，而它们往往以令人惊讶的简易程度做到这一点。”（Mann, 2008,\
  \ p. 1）\n\n社会工程是指操纵人员泄露信息或执行某些操作（Conteh and Schmick, 2016）。操纵的结果是信息的直接流失和/或实现了社会工程攻击者希望的某些操作，例如访问计算机网络。社会工程工程师执行攻击时使用的两种主要方法：基于技术的和基于人的。社会工程师通常结合使用两种方法用来说服目标泄露信息或执行操作。\n\
  \n社会工程工程师执行攻击时常用的主要的攻击向量包括在线、电话、废弃物管理、移动设备、个人人身接触和反向社会工程（Fruhlinger, 2019; Microsoft\
  \ Technet, 2006）。\n\n**勒索软件**是一个用于描述加密或锁定文件的术语，攻击者要求金钱或信息以“解锁”文件或系统（Richardson and\
  \ North, 2017）。勒索软件通常通过各种社会工程向量作为恶意软件分发（Huang et al., 2018）。\n\n## 在线社会工程攻击\n\n\n\
  \n\n\n社会工程学攻击中最常用的方法之一是通过互联网进行通信——无论是通过电子邮件、社交媒体应用还是网站。社会工程工程师会使用电子邮件说服接收者响应请求，以提供信息或访问权限。这可能涉及来自经理的虚假内部邮件，使用\
  \ `spoofing`（欺骗）技术伪装成内部经理来获取信息。攻击者还可以根据受害者在社交媒体上的信息来收集信息。攻击者通过社交媒体帖子或信息收集的信息可能包括受者的工作地点、是否在度假、宠物名称、家庭成员姓名以及受害者发布的其他信息。另一种常见技术是使用电子邮件向接收者提供某种价值的提议。当用户响应此请求时，他们通常需要提供信息，允许社会工程工程师访问其计算机系统。或者，在线消息可能会提供一个网站的链接，当接收者打开该网站时，恶意代码将下载到本地计算机。表\
  \ 10.1 描述了常见的社会工程在线攻击。\n\n表 10.1 常见的社会工程在线攻击\n\n| 攻击目标 || 攻击向量 || 攻击描述 || 攻击结果 |\n\
  | --- | --- | --- | --- |\n| 窃取公司信息 | 电子邮件 | 攻击者伪装成内部用户、供应商或银行机构以获取公司信息。 | 专有机密信息的非法泄露以及潜在的资金损失。\
  \ |\n| 窃取个人和公司信息 | 电子邮件 | 攻击者发送“钓鱼”电子邮件，试图说服接收者披露可以访问个人和公司资源的个人信息。 | 攻击者能够未经授权访问个人和公司计算机资源，导致机密信息的非法泄露和资金损失。\
  \ |\n| 窃取个人和公司信息 | 社交媒体 | 攻击者发送“钓鱼”电子邮件或直接消息，试图说服接收者披露可以访问个人和公司资源的个人信息。攻击者利用从受害者社交媒体帖子中发现的信息（如工作地点、度假地点、宠物名称、家庭成员姓名等）。\
  \ | 攻击者能够未经授权访问个人和公司计算机资源，导致机密信息的非法泄露和资金损失。 |\n| 访问内部计算机系统 | 网站 | 用户被说服点击超链接访问一个网站，该网站将下载如键盘记录器之类的恶意软件。\
  \ | 攻击者获取用户名和密码，并实现对内部计算机系统的访问。 |\n\n## 电话社会工程攻击\n\n社会工程工程师也使用电话，因为它是一种熟悉的媒介，并且可以防止对他们的视觉身份识别。这些攻击被认为相当无风险，因为如果电话接收者产生怀疑或不配合，社会工程工程师只需要挂断电话即可。当然，这与通过不可追踪或公共号码拨打的电话结合使用。社会工程工程师经常利用电话伪装成计算机支持人员或供应商。他们经常利用电话说服秘书和接待台人员等一线员工透露有关公司的信息。攻击者还可以利用社交媒体、网络搜索、翻找垃圾（dumpster\
  \ diving）或其他方法找到受害者信息。表 10.2 描述了常见的社会工程电话攻击。\n\n表 10.2 常见的社会工程电话攻击\n\n| 攻击目标 ||\
  \ 攻击向量 || 攻击描述 || 攻击结果 |\n| --- | --- | --- | --- |\n| 窃取公司信息 | 拨给一线员工的电话 | 攻击者假装成内部员工以获取机密信息。\
  \ | 专有机密信息的非法泄露以及潜在的资金损失。 |\n| 访问内部计算机系统 | 拨给帮助台的电话 | 攻击者假装成内部员工以更改其密码和访问权限。 | 专有机密信息的非法泄露以及潜在的资金损失。\
  \ |\n| 访问内部计算机系统 | 拨给内部员工的电话 | 攻击者假装成外部供应商或技术提供者以获取内部计算机系统的访问。 | 专有机密信息的非法泄露以及潜在的资金损失。\
  \ |\n| 为进一步社会工程攻击准备 | 拨给内部员工的电话 | 攻击者利用电话为未来的社会工程攻击做准备。 | 专有机密信息的非法泄露以及潜在的资金损失。\
  \ |\n\n## 垃圾管理社会工程攻击\n\n社会工程师经常经常公司丢弃的文件和其他信息作为进一步攻击的信息来源。这种行为被称为“翻找垃圾”（dumpster\
  \ diving），可能会检索到各种重要信息，例如内部组织图和目录、专有文档草案以及客户列表及其身份属性。即使是某些粉碎的文档也可以被社会工程工程师重建。表 10.3\
  \ 描述了常见的社会工程垃圾管理攻击。\n\n表 10.3 常见的社会工程垃圾管理攻击\n\n| 攻击目标 || 攻击向量 || 攻击描述 || 攻击结果 |\n\
  | --- | --- | --- | --- |\n| 收集公司背景信息 | 翻找垃圾 | 社会工程师从外部容器中获取文档、丢弃的数字介质和其他信息以获取公司的背景信息。\
  \ | 内部组织结构和员工身份信息；客户信息；机密或专有信息。 |\n| 收集公司背景信息 | 从内部办公箱和垃圾桶中收集文档和信息 | 社会工程师从内部办公箱或垃圾桶中获取文档、丢弃的数字介质和其他信息以获取公司的背景信息。\
  \ | 内部组织结构和员工身份信息；客户信息；机密或专有信息。 |\n\n## 移动设备社会工程攻击\n\n\n\n\n\n移动设备为社会工程攻击提供了新途径。这些途径包括在公共场所对移动电脑用户进行`shoulder\
  \ surfing`（窥视偷窥）、访问家庭计算机网络、`移动恶意软件`，以及使用移动通信设备冒充公司员工。一种日益增长的移动攻击向量是基于移动设备上广泛使用的应用程序。对应用程序的需求为社会工程师提供了机会，让他们能够提供包含恶意软件的程序，这些软件旨在向移动设备中安装键盘记录器或其他软件（Goodchild,\
  \ 2011b）。一旦安装了程序，社会工程师就可以获取用户访问银行等个人来源以及公司资源的访问信息。公共 WiFi 区域是社会工程师的另一个乐场。社会工程师可以轻松在公共\
  \ WiFi 区域建立`rogue wireless access point`（非法无线访问点），从而捕获该处各种移动计算用户的传输数据（Some WiFi,\
  \ 2011）。另一种较新的社会工程攻击是使用语音邮件信息，要求收件人联系其银行或公司（Goodchild, 2010a）。这被称为`vishing`（语音钓鱼），因为其技术和目的与电子邮件钓鱼攻击相似。表\
  \ 10.4 描述了常见的社会工程移动设备攻击。\n\n#### 表 10.4 常见的社会工程移动设备攻击\n\n| 攻击目标 | 攻击向量 | 攻击描述 |\
  \ 攻击结果 |\n| --- | --- | --- | --- |\n| 获取计算机系统的访问权限 | 窥视偷窥 | 社会工程师在机场或 WiFi 中心等公共场所越过移动设备用户的肩膀，获取其用户名和密码。\
  \ | 使用捕获的用户名和密码，社会工程师能够访问目标计算机系统。 |\n| 获取计算机系统的访问权限 | 家庭办公人员 | 社会工程师装成支持技术人员获取家庭办公人员的用户名和密码。\
  \ | 使用捕获的用户名和密码，社会工程师能够访问目标计算机系统。 |\n| 获取计算机系统的访问权限 | 移动应用程序 | 用户下载包含键盘记录器等恶意软件的移动游戏或程序，允许社会工程师获取用户名和密码。\
  \ | 使用捕获的用户名和密码，社会工程师能够访问目标计算机系统。 |\n| 捕获无线传输 | 非法 WiFi 访问点 | 社会工程师在公共 WiFi 设施建立非法无线访问点，以捕获包括用户名密码在内的计算机传输数据。\
  \ | 使用捕获的用户名和密码，社会工程师能够访问目标计算机系统并获取个人和公司信息。 |\n| 获取个人信息 | 语音钓鱼 | 社会工程师发送移动语音邮件，引导收件人联系其银行或公司。\
  \ | 获取个人信息和访问权限。 |\n\n## 个人社会工程攻击\n\n许多社会工程攻击是现场进行的。这些社会工程攻击依赖于许多心理和认知技术来说服人们透露信息（Hadnagy,\
  \ 2010）。四种主要方法证明是社会工程师成功的技巧：威逼、说服、迎合和协助（Microsoft Technet, 2006）。`Intimidation`（威逼）通常涉及社会工程师充当权威人物，例如高级高管，“命令”一线员工配合请求。在某些情况下，社会工程师的外表会影响服从性，例如当社会工程师装成警察或军方人员时（Goodchild,\
  \ 2010a）。大多数人都倾向于试图退出敌对环境，因此使用愤怒可能是一种非常有效的社会工程技术（Heary, 2009）。`Persuasive`（说服性）技术如奉承、同情和提及名人，在获得服从方面同样有效。某些社会工程攻击持续较长时间，期间社会工程师定期与员工交流以建立关系。在建立这种关系期间，在提出最终请求之前，不会要求任何信息（Mann,\
  \ 2008）。这些被称为`ingratiation`（迎合）攻击。最后一种方法是对目标提供`providing help or assistance`（提供帮助或协助），例如冒充支持技术人员。在一个案例中，社会工程师在互联网上购买了一件\
  \ Cisco T 恤，并用它作为 Cisco 技术人员在支持访问期间进入公司。进入内部后，他“丢弃”了各种载有恶意软件的`USB drives drives`，并成功访问了公司网络。这一切都在合法公司员工的注视下完成的（Goodchild,\
  \ 2010a）。\n\n重要的是，经验丰富的社会工程师非常擅长观察肢体语言并使用各种技术与目标建立非语言连接（Hadnagy, 2010; Heary, 2009）。由于人类之间\
  \ 55% 的交流是非语言的，这是一种非常有效的诡计（Heathfield, 2011）。此外，社会工程师通常使用意想不到的替代方法来完成攻击。一个例子是使用挡风玻璃传单说服人们登录某些网站获取更多信息（Goodchild,\
  \ 2010a）。个人社会工程取决于人类信任和乐于助人的本性才能成功。因此，许多人甚至不知道自己已成为社会工程攻击的目标。表 10.5 描述了常见的社会工程个人攻击。\n\
  \n### 表 10.5 常见的社会工程个人攻击\n\n| 攻击目标 | 攻击向量 | 攻击描述 | 攻击结果 |\n| --- | --- | --- | ---\
  \ |\n| 获取物理建筑访问权限 | 尾随 | 社会工程师假装公司员工并跟随一名或多个员工进入建筑，绕过访问控制。 | 一旦社会工程师实现了内部物理访问，他们就能获取文档、数字媒体和计算机访问权限。\
  \ |\n| 获取计算机访问 | 威逼、说服、迎合或协助 | 社会工程师使用一种或多种心理和认知技术来获得目标的服从。 | 获取计算机资源、公司信息以及潜在的资金损失。\
  \ |\n| 获取计算机访问 | 替代技术 | 社会工程师使用意想不到或替代的技术（如挡风玻璃传单）诱导目标访问恶意网站。 | 获取个人信息和资源。 |\n\n\
  ## 反向社会工程攻击\n\n\n\n\n\n反向社会工程是指目标对象主动接触社会工程工程师并提供信息的情况。这通常发生在目标认为自己正在与支持人员交流，因此不产生疑虑的情况下（Microsoft\
  \ Technet, 2006）。在面对计算机或账户问题时，许多人会在没有被要求的情况下向支持技术人员提供访问权限和个人信息。在某些情况下，社会工程工程师会为这种情况的创造环境。例如，伪装成支持技术人员的社会工程工程师可能会移动目标需要访问的文件。随后目标向该工程师寻求帮助，并提供访问权限和个人信息以帮助解决问题。一旦这些访问权限和个人信息被获取，社会工程工程师只需替换文件，目标完全不知道自己刚刚被黑客了。同样，当社会工程工程师伪装成执法人员或军事人员时，他们往往非常成功地说服人们向他们透露信息。表\
  \ 10.6 描述了常见的社会工程反向工程攻击。\n\n#### 表 10.6 常见的社会工程反向工程攻击\n\n| 攻击目标 | 攻击向量 | 攻击描述 |\
  \ 攻击结果 |\n| --- | --- | --- | --- |\n| 身份盗用 | 电话 | 社会工程工程师获取了被“协助”的目标的用户名和密码。 |\
  \ 获取个人和公司信息。 |\n| 信息盗取 | 电话 | 使用目标提供的用户名和密码，社会工程工程师能够访问内部计算机系统。 | 访问计算机资源、公司信息以及潜在的资金损失。\
  \ |\n| 恶意软件 | 电话 | 目标被说服访问一个链接或下载附件以帮助解决问题。 | 网站或附件包含恶意软件，会感染公司计算机系统或安装如键盘记录器或根内核工具包之类的软件。\
  \ |\n\n使用表 10.6 中描述的一项或多种技术，以下是常见社会工程攻击类型的总结。\n\n*   **假说设定法（Pretexting）**涉及创建并使用一个虚构的情景（借口）来说服受害者释放信息或执行操作。这通常通过电话进行，并且通常涉及比简单的谎言更多的内容。通常会有先前的研究，以便成功地利用已知信息的片段来支持伪装（例如\
  \ `DOB`、`ss#`、最后一次账单金额），并在目标心中建立正当性（Conteh and Schmick, 2016）。这种技术经常被用于欺骗公司的初级代表披露客户信息（联邦贸易委员会,\
  \ 2009）。\n\n*   **网络钓鱼（Phishing）**是一种通过欺诈手段获取隐私信息的技术。它通常通过电子邮件进行，社会工程工程师发送一封看似来自合法业务（如银行或信用卡公司）的邮件，要求对信息进行“验证”，并警告称如果不提供将面临某些严重后果（Conteh\
  \ and Schmick, 2016）。邮件通常包含一个指向欺诈网页的链接，该网页看起来很正规——带有公司标志和内容——并有一个请求从家庭地址到 ATM 卡\
  \ PIN 码所有信息的表单（Microsoft Safety and Security Center, 2011）。额外的网络钓鱼攻击还包括针对性钓鱼（spear\
  \ phishing）、针对高管钓鱼（whaling phishing）和业务电子邮件鱼骗（Salahdine and Kaabouch, 2019）。\n\n\
  *   **诱饵攻击（Baiting）**就像现实世界中的洛伊木马，利用物理介质并依赖害者的好奇心或贪婪。在这种攻击中，攻击者在某个会被发现的地方（浴室、电梯、人行道、停车场）留下一个受病毒感染的软盘、CD-ROM\
  \ 或 USB 闪存盘，贴上看似合法且引起好奇的标签，只需等待受害者使用该设备（Conteh and Schmick, 2016）。例如，攻击者可能会制作一张带有公司标志的光盘，并在正面标上“2009\
  \ 年第二季度高管薪资摘要”。员工随后会发现它，并几乎肯定会满足好奇心将光盘插入计算机。一旦安装，恶意软件就会感染该组织的计算机系统（Hadnagy, 2010）。\n\
  \n*   **等价交换（Quid pro quo）**意味着*物物易物*。在等价交换攻击中，攻击者可能会拨打公司内的随机号码，声称是技术支持的回电。最终他们会遇到一个有真实问题的人，对方对有人回电提供帮助心存感激（Conteh\
  \ and Schmick, 2016）。攻击者将“帮助”解决问题，在此过程中让用户输入命令，从而赋予攻击者访问权限或启动恶意软件（Social Engineering,\
  \ 2007）。\n\n    *   在 2003 年的一次信息安全调查中，90% 的办公人员为了换一支廉价笔，在回答调查问题向研究人员提供了用户名和密码（Leyden,\
  \ 2003）。随后的类似调查使用巧克力和其他廉价诱饵获得了类似的结果（BBC 新闻, 2004; Leyden, 2008）。\n\n*   **尾随或搭车（Tailgating\
  \ or piggybacking）**指的是一个人跟随另一个获得授权进入限制区域或通过某些检查点的人的情况（Conteh and Schmick, 2016）。尾随者有多种方法突破安全。\n\
  \n    *   跟随获得授权进入某地的人员，看起来像是被正当护送的\n    *   加入一个获得授权进入的大群，假装是大部分未经过检查的人群的一员\n \
  \   *   找到一个获得授权的人，此人可能疏忽忽略了设施规则，或者被骗认为尾随者是授权的，并友好地允许尾随者跟随。\n\n如上述讨论所示，调查社会工程事件最困难的方面是其隐蔽性。在许多情况下，甚至难以识别事件已经发生。互联网的优势以及通信技术的广度和范围，为社会工程工程师提供了距离和匿名性的掩护。这使得在许多情况下，识别攻击者变得困难甚至不可能。\n\
  \n> 要攻击你们的组织，社会工程黑客利用了你们员工的轻信、懒惰、礼貌，甚至是热情。因此，防御社会工程攻击是很困难的，因为目标可能还没有意识到他们已经被欺骗了……\n\
  \n>\n\n> *(Microsoft Technet, 2006, p. 1)*\n\n### 社会工程取证 [#C02a_toc.xhtml#rsecc010_7_1)\n\
  \n如上所述，在社会工程攻击发生后对其进行调查对于取证调查员来说可能非常令人沮丧。因此，处理社会工程攻击最好的方法是通过广泛的教育和培训计划以及识别和解决漏洞，从根本预防它们。然而，调查社会工程攻击的困难不应阻止取证调查员继续进行。\n\
  \n调查社会工程攻击的挑战之一是实际攻击之前进行的准备工作。社会工程工程师通常花费几周或几个月来收集目标信息。利用之前描述的许多技术，社会工程工程师将收集有关公司及其员工的背景信息。他们随后利用这些信息来开展各种攻击。他们对公司和员工表面的了解是获得目标信任成功的技巧（Goodchild,\
  \ 2010b）。\n\n\n\n\n\n调查社会工程攻击的第一步是通过漏洞评估来获得对组织薄弱环节的解解。这一过程涉及识别各种社会工程威胁，并将其与现有的策略和配置进行匹配，以确定漏洞区域。例如，如果确定存在通过社会工程攻击导致公司专有或机密信息的威胁，下一步将是确定是否有任何应对措施可以防止这种情况的发生。如果已经建立了安全措施，可以防止内部员工根据信息的分类传输机密或专有信息，那么取证调查人员现在知道损失是以其他方式发生的（Mann,\
  \ 2008）。同样，如果对 `Internet` 的访问受到限制，那么对使用 `Internet` 进行社会工程攻击的调查就可以缩小到具有互联网访问权限的人员。审查\
  \ `Internet` 访问日志对于确定谁访问了哪些网站以及执行了哪些操作也很有价值。使用最新的病毒防护软件还可以消除电子邮件附件和网站下载作为恶意软件感染的来源。正如这些示例所示，取证调查人员的首要工作是通过检查当前的漏洞和应对措施来缩小潜在的攻击向量。下表是详细列出的潜在攻击向量漏洞的图表。表\
  \ 10.7 描述了社会工程攻击向量漏洞。\n\n下一步是评估员工在抵抗社会工程攻击方面的人员力量。如果已经进行过社会工程培训和教育，那么常见的社会工程攻击可能不会成功，而可能需要探索更复杂的攻击。此外，如果有严格的政策诱导员工根据后果采取相应行动，从而减少合规性，那么某些社会工程攻击（如泄露密码或物理访问）的可能性可能会降至最低。对社会工程攻击的取证调查还应关注常见的攻击和入口点，例如电子邮件、电话、网站、一线员工以及支持和帮助台技术人员。应该审查并验证访问者、供应商和技术人员的日志。此外，外部支持技术人员的任何访问应追溯到合法请求。如果没有找到，则应对对这种攻击方法进行进一步调查。虽然漏洞映射并不总是能为寻找社会工程攻击的原因提供直接解决方案，但它们可以减少需要考虑的潜在攻击向量数量。\n\
  \n如所述，社会工程攻击以两种方式发生：通过技术和人工接触，以及两者的结合。在检查社会工程攻击的技术方面时，有必要追溯访问计算机系统所需的各种步骤。例如，在攻击通过电子邮件消息开始的情况下，第一步是将该消息追溯到其源头。这是通过跟踪电子邮件头通过其各种传输点完成的（Online\
  \ Tech Tips, 2007）。在恶意软件被引入组织的情况下，调查人员必须探索各种入口，例如电子邮件附件、网站、移动设备和如 `USB` 驱动器之类的周边设备。如果恶意软件可以追溯到其源机器，调查人员就有很大机会发现其起源，并可能追溯其来源和引入方法。\n\
  \n表 10.7 社会工程攻击向量漏洞\n\n| 攻击向量 | 攻击类型 | 描述 | 应对措施 |\n| --- | --- | --- | --- |\n\
  | 在线 | 电子邮件 | 恶意附件 | 维护最新的病毒防护软件 |\n| --- | --- | --- | --- |\n|  | 电子邮件 | 钓鱼 |\
  \ 教育和意识培训 |\n| --- | --- | --- | --- |\n|  | 电子邮件 | 通过电子邮件发送公司文件 | 数据泄露策略以及监控和预防技术\
  \ |\n| 网站 | 恶意下载 | 限制访问互联网 |\n| 电话 | 拨打帮助台电话 | 说服帮助台重置密码 |\n|  | 语音钓鱼 | 说服语音接收者拨打号码\
  \ | 对员工进行广泛培训 |\n| 内部文档收集 | 从内部办公室收集文档和其他信息 | 建立整洁桌面策略 |\n| 外部文档收集 | 从外部垃圾中收集文档和其他信息\
  \ | 移动现场垃圾桶 |\n| 物理安全 | 尾随 | 跟随合法员工进入建筑 | 建立严格的访问控制 |\n| 访问办公室和机房 | 未锁的办公室允许进入内部办公室\
  \ | 锁好空闲办公室和房间 |\n| 人员 | 说服、恐吓、讨好和帮助 | 社会工程师利用各种花招获得顺从 | 教育和培训计划 |\n| 伪装成供应商或支持人员\
  \ | 社会工程师将穿扮并装成外部支持技术人员以获得访问权限 | 建立验证所有访问的策略 |\n\n在调查人为攻击时，取证调查人员可以使用各种方法。在某些情况下，确定公司内部谁在泄露信息方面最脆弱可能是值得的。这可能包括对组织结构、一线员工的角色、具有移动访问权限的员工、假期安排以及技术人员服务历史的审查。\n\
  \n## 总结 (#C02a_toc.xhtml#rsecc10_8)\n\n社会工程攻击在最近几起广为人知的事件中相当非常成功。它们的成功（即使是针对保护良好的公司和军队）也证明了组织在防止社会工程攻击方面面临的挑战。下面描述了少数几个备受关注的社会工程攻击：\n\
  \n* **2020 年 Twitter 攻击** 是一场协调的社会工程攻击，操纵了一组 Twitter 员工。攻击者能够访问管理工具，允许他们以名人身份发布推文（Sirkin,\
  \ 2020）。\n* **Wikileaks 黑客事件** 是内部人员为了获取机密和秘密信息而进行的社会工程攻击示例。美国陆军士兵布拉德利·曼宁被指控访问内部信息源并将这些信息传递给\
  \ Wikileaks 创始人 Julian Assange。“据称，他成功骗了同事让他们以为他在听音乐，而不是偷取机密信息……”（Ibid, p. 1）。\n\
  \n\n\n\n\n*   **Google 破解（Google Hacking）**涉及破解 Google 客户信息以访问 Gmail 账户。在一个例子中，中国社会工程师显然通过“对\
  \ Google 员工进行长时间侦察”实现了攻击（同上，第 2 页）。他们向 Google 员工发送了看似合规的消息，员工点击了嵌入链接，从而在他们的计算机上安装了间谍软件。\n\
  \n*   **Facebook 诈骗（Facebook Scams）**非常常见且几乎每天发生，社会工程师发布受恶意病毒感染网站的链接，促 Facebook\
  \ “朋友”点击这些链接并安装软件。\n\n*   **RSA 攻击（An RSA Attack）**始于向 RSA 内部一组特定员工发送带有附件文件的钓鱼邮件。该邮件标题为“2011\
  \ 招聘计划”。尽管这封邮件被自动发送到了用户的垃圾邮件箱，但一名员工提取了该邮件并打开了附件。“该电子表格包含恶意软件，该软件利用 Adobe Flash 软件中一个此前未知的或‘零日’漏洞来安装后门程序”（Richmond,\
  \ 2011, p. 1）。\n\n*   **Booz Allen 鱼叉式钓鱼攻击（The Booz Allen Spear Phishing Attack）**发生于一次针对鱼叉式钓鱼攻击导致其一名员工打开了一封带有恶意病毒感染附件的邮件。这一次，社会工程师利用这种恶意软件访问了\
  \ Booz Allen 系统（Panataleon, 2011）。\n\n## 参考文献\n\n1. BBC News. (2004). Passwords\
