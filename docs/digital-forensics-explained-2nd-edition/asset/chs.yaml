  _IC3Report.pdf`](http://pdf.ic3.gov)。\n4. 互联网犯罪投诉中心。(2018). 互联网犯罪报告。检索于 2020 年 4\
  \ 月 9 日。[`pdf.ic3.gov/2017\\_IC3Report.pdf`](http://pdf.ic3.gov)。\n5. 互联网犯罪投诉中心。(2019).\
  \ 互联网犯罪报告。检索于 2020 年 4 月 9 日。[`pdf.ic3.gov/2018\\_IC3Report.pdf`](http://pdf.ic3.gov)。\n\
