  \ 隐藏威胁：备数据流. In Windows Security. Retrieved on May 28, 2011 from [`www.windowsecurity.com/articles/alternate_data_streams.xhtml`](http://www.windowsecurity.com)。\n\
  \n# 第 12 章 链接与视觉分析\n\n## 引言\n\n数字取证过程涉及发现信息，以试图对行为和事件提供见解。解释发生情况的细节往往缺失，在某些情况下，对发生了什么几乎一无所知。通过组织且有条理筛选数字媒体可以阐明发生的情况，但可能存在许多看似不相关的信息，使得勾勒出一个清晰的画面几乎是不可能的。链接与视觉分析（LAVA）技术的使用了一种组织和分析调查相关信息的方法，并对感兴趣的活动和事件有更好的理解。\n\
  \n此前，我们回顾了许多取证工具和报告编写。目前已经表明，计算机取证工具的重点已从寻找信息扩展到分析信息。这意味着取证工具的优势在于搜索卷以以恢复文件和产物。然而，通常来说，取证工具的弱点在于它们不擅长聚合信息并以有助于解释的方式呈现出来。商业智能和统计分析中使用的工具和技术未被视为数字取证领域的一部分。唯一常见的聚合和共享信息往往是哈希集（hash\
  \ sets）。\n\n## 链接与视觉分析\n\n文件有多个日期和时间（时间）属性，包括创建时间、修改时间和访问时间。这允许通过这些属性对文件进行时间分析，有助于回答“谁在何时做了什么”的问题。在存在多台计算机、用户、设备和情况的情况下，要确定“谁在何时做了什么”并不易事，也没有观察趋势和关系的方法。其中原因之一是每个设备都有自己的镜像，除非这些镜像可以被常用的取证工具访问，否则无法使用该工具高效地聚合信息。例如，如果移动设备由\
  \ `Cellebrite` 分析，而计算机使用 `EnCase` 分析，那么将这些信息整合在一起就很困难。虽然有方法可以将 `Cellebrite` 提取的信息导入\
  \ `EnCase`，但显然，`EnCase` 并不是一种类似于商业智能中使用的报告和分析工具。`Access Data` 利用 `FTK` 中的一个数据库，这有助于报告，但在分析能力方面仍存在差距。\n\
  \nLAVA 工具通过在数据内部寻找链接和关联来获取信息并开发情报。一个有助于 LAVA 形象化的例子是使用 `i2` 走一个手机场景。我们面临这样一个情况：需要分析四个个人的通话模式。图\
  \ 12.1 显示了一张代表这四个人手机在一个月通话的图表。每个图标代表一个不同的电话号码，每条线代表一次或多次通话。箭头的方向代表谁拨打了电话（通话来源）。指向手机的箭头表示接到的电话，离开手机的箭头表示拨出的电话。\n\
  \n电话网络图提供了关于通话量和方向的某种感受，但通过将数据表示方式更改为组织图，可以使数据更加清晰。图 12.2 展示了四个感兴趣的人员之间的关系。\n\n\
  ![图 12.1 电话网络圆形图。](img/file45.jpg)\n\n图 12.1 电话网络圆形图。\n\n![图 12.2 电话网络组织结构图。](img/file46.jpg)\n\
  \n图 12.2 电话网络组织结构图。\n\n在组织图中出现了一个潜在的模式，其中有一条清晰的路径将四个人连接在一起。我们意识到网络中可能还有更多人可以进一步说清情况，但在此时我们只有这四个人。这就是时间分析提供进一步见解的地方。时间分析是将数据列在时间轴上的分析。我们记得在之前的示例中，两个手机之间的单条线表示个人之间的一次或多次通话。时间分析进一步分解了这一点，使我们能够看到每次通话是在何时拨出的。图\
  \ 12.3 是之前示例中的数据转换为时间视图的表示。\n\n时间呈现表示了与图 12.1 和图 12.2 相同的信息，但数据被过滤为仅限于四个感兴趣手机之间的通话。此外，包含了第五部手机，即卧底探员\
  \ Otting 的手机。情况是：Otting 探员于 1 月 8 日下午 3:00 打电给 Gogolin  1 盎司 Kool-Aid。下午 3:15，Gogolin\
  \ 打电给 Pavlov 确保他们有足够的 Kool-Aid，然后回电给 Otting 探员完成销售安排。1 月 15 日下午 1:30，Otting 探员打电给\
  \ Gogolin 看看是否可以买 8 盎司 Kool-Aid。下午 1:40，Gogolin 打电给 Pavlov 看看他们是否有 8 盎司 Kool-Aid\
  \ 要卖。Pavlov 在下午 1:45 打电给 Emerick，因为他需要更多库存才能完成销售。下午 1:55，Pavlov 回电给 Gogolin 表明他们有足够的库存。下午\
  \ 2:00，Gogolin 打电给 Otting 探员完成销售安排。这一场景在 1 月 25 日和 28 日又重复了两次，因此表明了一个清晰的通信通道，并有力地支持了\
  \ Kool-Aid 犯罪集团存在的概率。\n\n![图 12.3 电话网络时间视图。](img/file47.jpg)\n\n图 12.3 电话网络时间视图。\n\
  \n图 12.3 是 LAVA 的一个很好的例子，其中代表通话的线条是链接，而它在时间轴上的布局方式使得视觉分析成为可能。其他证据可以叠加到此图表中，包括地理信息系统\
  \ (GIS) 数据、银行账户信息以及可能相关的其他活动和事件。尽管某些取证工具可能让你部分获得这种画面，但将来自多个源的信息叠加或聚合到一个中心位置的能力，正是彰显\
  \ LAVA 强大之处的。\n\n\n\n\n\nLAVA 的其他功能还包括统计分析，以提供预测性智能并执行其他功能，协助调查人员处理数字取证调查中常见的海量信息。例如，某些取证工具可以分析通话或通信模式，以帮助确定犯罪团伙或帮派的首领。通话时长、通话发起者、通话频率以及该通话与其他通话的相关性等因素被用于分析组织的层次结构。\n\
  \n例如，如果 `Marco` 给 `Julia` 打打了 45 秒电话，然后 `Marco` 在与 `Julia` 通话结束后 1 分钟拨给了 `Buddy`——且这种模式在一个月内重复了三次——那么这些通话相关的概率非常高。此外，`Julia`\
  \ 和 `Marco` 之间存在某种关系的概率也非常高。相反，如果 `Marco` 给 `Julia` 打打了 45 秒电话，然后在两天后 `Marco`  own\
  \ 拨给了 `Buddy`，那么两次通话相关的概率就很小，`Julia` 和 `Buddy` 之间存在某种关系的可能性也小得多。\n\n来自 `Facebook`、`Twitter`\
  \ 和 `LinkedIn` 等数字源的社交网络在计算机和移动设备上留下了活动痕迹。这些碎片可能有助于确定某些社交网络身份和活动，但 `LAVA` 工具可以帮助识别和分析社交网络关系。由于数字社交网络的普及，掌握网络内部成员和关系是数字取证调查的一个重要方面。\n\
  \n### 中心性衡量指标\n\n社交网络分析的某些因素包括四种中心性衡量指标：`Betweenness`（中介性）、`Closeness`（接近性）、`Degree`（度）和\
  \ `Eigenvector`（特征向量）。这四种中心性指标都有数学依据。中心性观察的是事物位于其他两个点或对象之间的位置。这可以帮助确定某人在社交网络中所拥有的相对重要性或影响力。\n\
  \n- **Betweenness (中介性)**：涉及节点在网络中的重要性——它处于多中心，以及有多少关系通过它进入另一个关系。社交网络中的节点是一个中心点，例如某个人或实体。很强的\
  \ `Betweenness` 指标可以解释为某人是一个犯罪团伙或帮派的中心——在社交网络中非常有影响力。高 `Betweenness` 评分也可能表明某人是一个“守门人”（Gatekeeper），或者他们控制着网络中的通信。\n\
  - **Closeness (接近性)**：是 `Farness`（远度）的对面。它是关系亲近程度的衡量——它们在网络中有多近。具有高 `closeness`\
  \ 评分的节点由于位置接近，可以最快地与其他节点进行通信。\n- **Degree Centrality (度中心性)**：指向节点的链接数量。这可能表明某人在网络中的受欢迎程度，但并不一定衡量某人在网络中的重要性。在社交场合中，拥有大量连接的人具有高\
  \ `Degree` 的 `Centrality`，这可能被视为非常受欢迎。同样，拥有少数连接的人具有低 `Degree` 的 `Centrality`——这可能被视为不受欢迎。然而，在组织环境中，领导者可能只有少数几个直接下属——因此他们的\
  \ `Degree` 的 `Centrality` 会低得多。无论如何，较高的 `Degree` 的 `Centrality` 评分意味着某人在网络中是活跃的。\n\
  - **Eigenvector Centrality (特征向量中心性)**：衡量节点在网络中的影响力。该指标可以反映内部网络的影响，也可以反映离开网络的影响。因此，`Eigenvector`\
  \ 值告知了在考虑某人影响力的情况下，如何解释其 `Degree` 的 `Centrality`。\n\n### 网络分析示例\n\n图 12.4 中的网络可以针对\
  \ `Betweenness`、`Degree` 的 `Centrality`、`Closeness` 和 `Eigenvector` 指标进行分析。某些 `LAVA`\
  \ 包可以计算 `Betweenness`、`Degree` 的 `Centrality`、`Closeness`、`Eigenvector` 以及其他指标，某些软件包也是如此。这在解释大型网络时非常有用。图\
  \ 12.5 显示了网络中每个节点的 `Betweenness`、`Closeness`、`Degree` 和 `Eigenvector` 值。具有强 `Betweenness`\
  \ 的节点有 `Sara JONES`、`Juan RODRIGUEZ`、`Frank EVERS`、`Betty BILFORD` 和 `Tim JOHNSON`，其中\
  \ `Tim JOHNSON` 的得分最高。\n\n![图 12.4 网络分析。](img/file48.jpg)\n*图 12.4* 网络分析。\n\n![图\
  \ 12.5 网络统计分析。](img/file49.jpg)\n*图 12.5* 网络统计分析。\n\n当你最初观察网络时，第一直觉可能是 `Sara JONES`\
  \ 是网络的中心，但 `Betweenness` 评分表明 `Tim JOHNSON` 是最重要的节点，其次是 `Betty BILFORD`、`Frank EVERS`\
  \ 和 `Juan RODRIGUEZ`。`Tim JOHNSON` 还拥有最高的 `Closeness` 评分，这意味着与所有其他节点相比，他离得最近。`Sara\
  \ JONES` 和 `Tim JOHNSON` 具有最高的 `Degree` 的 `Centrality` 评分，这意味着根据网络他们很受欢迎。`Sara JONES`\
  \ 拥有最高的 `Eigenvector` 评分，其次是 `Tim JOHNSON`。记住，`Eigenvector` 衡量的是对网络的影响。综合所有这些指标，`Tim\
  \ JOHNSON` 无疑是一个值得关注的节点。\n\n除了网络分析外，这种统计分析还可以帮助确定数字犯罪的特征，例如攻击模式。这些模式可以把犯罪关联到同一嫌疑者，并揭示群体动态。统计分析提供的定量数据可以证实数字取证检查中的某些假设，但分析也可以表明假设没有得到充分支持。你可能记得在\
  \ 第 1 章 回顾科学过程时，我强调了报告之前验证结果的重要性。错误的报告可能会毁掉无辜者的生活，并可能让罪犯逍遥法外。我怎么强调都不为过：发布之前要验证结果，而验证的一种有力方法是使用替代方法确认。\n\
  \n`LAVA` 应用于许多领域，包括执法、情报、金融、保险、医疗保健以及其他研究链接和关系有助于提供态势洞察的领域。为了发挥全部潜力，`LAVA` 环境中的信息应与\
  \ `Oracle` 或 `Microsoft SQL Server` 等可扩展的数据库环境相结合。这将允许事件、案件、检查人员、分析师和组织之间共享信息。保险行业是利用\
  \ `LAVA` 技术打击保险欺骗的早期采用者。实施保险欺骗的人更换目标公司，这使得发现欺骗模式变得困难。保险公司在共享保险欺骗信息方面做得好得多。其他行业（包括执法）应该学习这种协作信息共享模式。许多\
  \ `LAVA` 工具具有关系型数据库和信息共享服务的接口，但为了实现广泛成功，还需要协调的努力来实现标准化。\n\n数字取证调查的产物和信息也可以通过使用数据库在调查人员和组织之间共享。一旦进入数据库，就可以使用\
  \ `LAVA` 工具通过来自多个案件和来源的信息（“大数据”方法）来挖掘相似性和趋势，而不是试图通过单独查看单个案件来寻找模式。\n\n\n\n\n采取逐案处理的方式继续进行数字取证工作，就像试图用水桶给`泰坦尼克号`排水。需要一种新方法来取得进展并应对数字取证中的挑战。共享案件信息并使用\
  \ `LAVA` 工具进行评估，在帮助调查人员更有效地工作方面显示出前景。统计技术可以帮助验证发现结果，引导调查人员关注他们可能忽略的领域，并通过预测分析提供重点。`LAVA`\
  \ 并不是万灵丹，但它是一个可以显著提高数字取证调查员效率和效果的领域。\n\n# 第 13 章：数字取证的心理学、伦理和文化影响\n\n## 引言\n在我读过的所有涉及数字取证的书中，对心理学、伦理和文化的覆盖似乎被完全忽视了。随着我处理案件，我清楚地意识到，这些领域是数字取证调查的核心方面。我想在本章中涵盖的内容不仅包括被调查人员的心理方面，还包括调查人员自身的心理方面。调查人员面临着许多伦理问题，其中许多问题在检查的后期才会显现。最后，许多文化问题涉及语言和成语表达等非常基础的内容，还包括对涵盖事件的文化概念框架的理解。当我与调查人员讨论语言和文化问题时，他们往往会将这些挑战斥为可以用语言翻译工具处理的问题。但对我来说，这是对复杂情况的过度简化和完全误解。\n\
  \n## 数字取证的心理影响\n毫无疑问，在数字取证领域，我感到准备最不充分的领域是心理因素。当我完成计算机信息系统的本科和研究生学位，并在进入取证领域时已有约\
  \ 20 年的 IT 经验时，发现适应取证的技术挑战相当容易。对各种文件系统获得更深入的理解可能是唯一一个重要的技术学习曲线。当然，有一些流程和方法上的问题需要解决，但就努力而言，技术上的跨越与从大型机到客户端/服务器或从客户端/服务器到\
  \ Web 的跨越没有太大区别。我在获得生物学学位时上过心理学和社会学课程，曾一度主修刑事司法，并上过关于离偏差行为和家庭状况的课程。但即使是这些也没有能让我为数字取证中呈现的情况做好准备。那里确实存在非常扭曲的人和情况，这确实非常消耗精力。\n\
  \n我认为一种可以帮助人们理解我所说的数字取证心理影响的方法，就是简单地回顾我遇到过的一些情况和场景，以提供数字取证调查员可能遇到的近似情况的模拟。我的一位读过空军学院的朋友解释说，飞行员训练的一部分包括心理练习。飞行员在出任务之前必须在脑海中回答问题，以便在到达行动点时能够做出恰当反应。他们不能只是开着轰炸机飞到某个地方，然后决定是否投弹。这些问题必须在进入驾驶舱之前回答。同样，数字取证调查员也有必须提前决定的事情。每位调查人员都必须确定他们能够处理什么类型的案件，以及如何处理这些案件。\n\
  \n当有人决定从事数字取证时，吸引他们的往往是对酷技术的向往——而不一定是特定类型的案件。某人处理的案件类型很大程度上取决于他们的职业道路。地方执法部门花费大量时间处理儿童性侵用材料（`CSAM`）。企业调查员可能与人力资源部门合作，进行诸如审查近期离职员工电脑等工作。他们还可能处理计算机泄露的事件响应。私家侦探通常处理民事和家庭案件，大部分工作集中在离婚情况上。并不是说上述每种环境都与我描述的不同，但调查员应该意识到自己正处于什么样的境地。\n\
  \n从字面上说，我喜欢的描述数字取证的方式是它是对他人灵魂的窥视。当你浏览并恢复删除的文件、照片、电子邮件、互联网历史和时间线时，一个清晰的个人画像开始显现。随着模式的形成，习惯、偏好和倾向会结晶化。在短时间内，产生一种感觉——即这是否是你能够与之相处的人，或者是否是你开始厌恶的人——并不罕见。单单这一点就能在潜意识中影响调查。另一个经常很快出现的方面是，你提供的细节是否与被调查设备上的内容相符。“凡事皆有两面”这句谚言确实适用，如果被调查的设备由很多人共享，那么故事可能有很多面，理解这些事情可能变得非常困难。\n\
  \n我将要描述的案件将经过处理，以确保不违反保密。它们可能是许多案件的组合、学术案例，或者是虚构的描述。然而，它们确实代表了常见的情况。我想包含案例的原因是，人们理解环境很重要。曾经在\
  \ 20 世纪 80 年代中期，当我还是计算机程序员时，有一位高中生请求向我职业实习。我问她想让我向她展示什么，她表示她只想看我在她不在时像往常那样工作。编程有时可以是一个深思熟虑的过程，当她来实习时，正是其中一个时刻。我当时正在开发一个保险承保系统，并编写一些数学模型。在看着我交替打字和思考了\
  \ 15 分钟（我经常在看着天花板时这样做）后，她突然从椅子上站起来，说编程看起来很无聊，她不想当程序员了，然后离开了。我想，她在投入大量时间之前发现自己不想当程序员是好事，但她也没有真正获得对程序员职业的准确想法。\n\
  \n正如任何计算机领域的人所知，经常会接到朋友或其他人的电话，寻求等同于免费的帮助。请求几乎从未得到快速解决。从取证的角度来看，这更加复杂。最常见的请求之一是恢复误删的文件。通常，这些文件是照片。经常用于恢复删除照片的技术是使用全局正则表达式打印（`GREP`）搜索图形文件头来刻录文件。这将恢复所有可恢复的图形文件，这可能比某人想要恢复的要多，并可能导致尴尬的局面，因为互联网上的图形文件也被恢复了。\n\
  \n\n\n\n## 数字取证的挑战与心理影响\n\n数字取证的技术发展非常快。因此，持续的在职教育是必要的。培训场合为调查人员提供了一个建立人脉的机会，并对他们遇到的问题共鸣。\n\
  \n我认识一位调查员，他提到曾有一个邻居请他安装一个新硬盘，因为原来的崩溃了。在更换完硬盘并让电脑重新运行后，调查员询问邻居对旧硬盘想怎么处理。邻居告诉他不在乎，于是调查员把它带了家里，放在了车库的架子子上。大约一年后，他需要一个硬盘，想起了车库里的那个硬盘。他将其取出并连接到`forensic\
  \ tools`上以检查是否可用。\n\n他发现的是一个装满`CSAM`（儿童性虐待内容）的`hard drive`。他的邻居正在州立监狱服刑 10 年。这现在似乎是故事的结束，但想想这两个人居住的社区。整个环境被永远改变了，包括友谊和对待人们的方式。也应该记住那些受害儿童。这类案件中没有理想的结果。\n\
  \n## 在线电子商务中的风险\n\n许多人都有关于 `eBay` 和 `craigslist` 的故事。在这些网站上能发现的东西令人惊讶，更令人惊讶的是，人们甚至会考虑出售旧电脑之类的物品。我总是告诉人们，如果准备售卖电脑，至少要拆除`hard\
  \ drive`。\n\n我的一个朋友是一个 `craigslist` 瘾君。他不断地在 `craigslist` 上买卖和交易。有一次，他在 `craigslist`\
  \ 上买了一台二手电脑，由于他的计算机技能有限，他问我是否愿意快速看一下，确保里面没有不该有的东西。我们将电脑连接到一些`forensic tools`，发现里面充满了自制的撒旦色情，甚至涉及血腥。这些令人不安的图像将刻在你的脑中，就像你遇到的任何案件一样。\n\
  \n## 执法部门协作\n\n私营部门的数字取证调查员应该与执法部门联系并建立关系，因为早晚这两条路会交汇。非执法部门的数字取证调查员迟早遇到需要交给执法部门处理的情况。在某些农村地区，甚至在州一级，执法部门可能需要执法之外的人员协助数字取证案件。\n\
  \n现实情况是，大多数执法机构的培训和专业知识是有限的（Gogolin and Jones, 2010）。你在执法案件中遇到的环境可能是嫌疑人被羁押，而你需要快速检查`digital\
  \ media`以寻找相关证据。我曾处于这样的情况：我正在快速处理各种设备，同时能听到扣留区有人在大大叫、制造混乱。这本身就非常令人不安。\n\n请求协助背后的原因可能令人不安，因为在执法案件中，数字取证调查员经常与性犯罪犯打交道。根据假释条件，性犯罪犯通常被要求不得访问特定类型的网站，或不拥有某些个人的照片。即使满足了假释条件，发现你不想看到的图像仍然常见。久而之，对于某些处理这类案件的取证员来说，这可能会变成某种常规，几乎就像执行任何其他调查任务一样。然而，对另一些人来说，心理代价高到无法接受，因此有必要调整职业方向。\n\
  \n## 高风险调查\n\n执法部门可能依赖数字证据来协助破解未解的案件。脑海中浮出的一个案例是一个初中女孩，她的`iPod`里有一张据称绑架她的人的照片。女孩认识这个绑架者，并且实际上通过社交媒体招募了他进行亲密接触。`iPod`在锁定状态下被找到，没有人知道女孩可能在哪里。\n\
  \n不同类型的设备具有不同类型的安全控制，有些容易绕过，而另一些则几乎是不可能的。学习如何做到这一点的时间不应该在儿童绑架发生期间这种压力巨大的情况下完成。应该建立与硬件供应商的联系，以了解整个过程，不浪费宝贵的时间，并应该主动练习这些技能。此类案件的结果可能特别令人困扰，如果调查员处理得不高效且导致结果不尽人意，可能会对调查员产生持续的心理影响。同样，如果调查员准备充分，获得良好结果的机会更大，这可以转化为得好的心理影响。\n\
  \n## 长期心理代价\n\n之前描述的案例通常是“快节奏型”。你只需要几分钟到几小时就能搞定。最令人困惑的案件通常是那些持续时间达周或几个月的案件。案件可能会经历许多转折，处理这种情况的持续日常琐事可能会在心理上精疲力竭。\n\
  \n一个符合这种描述的案例让我想起一个特定的离婚案。这对夫妇是山村社区一家五金店的共同所有人，妻子对丈夫的行为产生了怀疑。对家庭`computer`的检查发现了丈夫的`e-mail`和其他出轨证据。在`e-mail`调查过程中，显然丈夫还参与了色情内容的交换。进一步检查显示，丈夫对女孩感兴趣，有许多外表年幼且处于不当的女孩照片。最令人困扰的是发现了大量的动画\
  \ CSAM，其中许多学龄前或更小儿童的图像。案件涉及的问题之一是监护权，这对夫妇有几个孩子，其中包括一名青少年女孩。孩子不知道取证调查的细节，但丈夫在利用女孩的情绪，让他自己看起来是害者，而母亲才是那个恶意的人。该地区通常处理此类案件的检察官正在长假，这恰好与大约六个月的调查时间几乎重合。许多管辖区不起诉动画类\
  \ CSAM 案件，因为他们的解释是没有受害者。然而，某些管辖区并不认为动画和图像是没有受害者的，并会进行起诉。负责本案的检察官不在，当时没有进行刑事起诉。然而，案件扩大到了业务电脑和其他数字设备，民事法院显然丈夫确实有心理问题，监护权也随之终止。显然，该案中的许多人都面临着艰难的心理挑战。对于处理此类案件的调查员来说，在这种结果并非完全失败但并不理想的情况下，心理代价导致了长时间的失眠。\n\
  \n\n\n\n挫败感可以通过许多方式表现出来。在某些情况下，调查显然揭露了违反法律的行为，但法律系统拒绝受理案件。这可能是由于许多因素造成的，包括当前的工作负荷、处理类似案件的经验、对相关技术的缺乏了解，甚至是政治动机。\n\
  \n我脑海中浮出的最令人沮丧案件之一是一个侵污案：某人以帮助老年人管理资产为名，从一位老人那里盗取了数百万美元。该侵占者持有委托书，将资产兑换成现金，并竭力隐藏资金来源。大约在那位老人意识到几乎所有资产已流光时，该侵占者突然去世了。这种活动模式表明，极有几个人是共犯，但从表面上看并没有实质性的证据。我受该老年人法律团队的邀请，帮助揭露这一侵污网络，并可能启动一起刑事案件。侵占者的亲属正在出售可能通过侵污活动获得的资产。当时有大量的拍卖行、`eBay`\
  \ 和 `craigslist` 活动，而且物品的价格远低于市场价。\n\n我最初感兴趣的是侵占者的电脑。正当我开始调查时，发现该侵占者也是一名儿童色情制品制造者，电脑必须移交给执法部门。由于嫌疑人已死，程序是销毁所有可能包含\
  \ CSAM（儿童性虐）的数字介质。这有效地销毁了所有证据，没有对任何嫌疑人起诉。人们从一无所有变成了身价百万的富翁，而其中一个人又从万万富翁变成了一无所有。让这起案件以及之前描述的民事/监护权案件尤为令人不安的是，该侵占者和前一个案件中的丈夫都是显眼的基督徒。该侵占者似乎在用盗取的资金购买价值数万美元的宗教器物。而那个丈夫则利用他在教会的地位，与弱势女性建立关系，然后对她们进行性骚扰。作为一名基督徒，我发现这种行为不仅卑鄙，而且给基督教本身蒙下了极其负面的阴影。因此，调查人员应该做好准备，防范追求的对象会亵渎他们所看重的事物。调查人员通常称这些人为“坏人”，但你也可以有自己的说法。\n\
  \n调查人员在处理案件时，经常发现 CSAM 或其他令人不安的材料而不感到意外。在这些情况下，调查人员可以提前做好心理准备，在发现细节时可能不会感到震惊。然而，在未预料到并发现不安细节的案件中，我能对这种情况的最好描述就像掉进冰封湖面的冰面上。这可能像慢动作一样发生，然后你发现自己震惊且身处水下，努力向光亮游去。突然感到冷——非常冷——并不是一种常见的反应。我曾不得不用毯子盖住自己。这种感觉很快就会被帮助儿童的冲动所取代，尽管可能几乎没有办法有效这样做，特别是在国际情况下。这类案件带来的满足感来自于一个现实：如果调查得当，CSAM\
  \ 案件通常会有强有力的诉讼结果，而且持有材料的人即使不是制造者，也将面临严厉的刑罚。\n\n另一个值得注意的调查方面是，在某些情况下，调查人员可能与你正在调查的人认识。这在企业环境中更为常见，因为案件可能具有内部重点。当这种情况发生时，调查人员必须决定是否可以客观进行，还是应该将调查交给他人。\n\
  \n调查人员需要具备应对技巧，帮助他们处理调查过程中可能遇到的心理障碍。通常，调查人员无法谈论案件，因此他们必须长时间将案件细节封锁在心里。应对机制包括心理咨询、运动、写日志和其他技术。这可以允许调查人员释放案件涉及的至少部分情感能量，并有助于减轻压力。调查人员必须保持主动，以防案件压力水平和情感负担不受控制地增长。家属可能不理解这一点，这可能会使情况变得恶化。意识到潜在问题是有效管理这些问题的第一步。\n\
  \n还有许多心理考虑可以涵盖，其中许多带有伦理色彩，但另一个需要涉及的领域是调查结果。调查人员必须对结果绝对确定，对发现内容的解读不能多于或少于证据的支持。如果电脑被许多人使用，那么就很难\
  \ 100% 确定地将某项活动归于一人。调查结果的解读方式可能会永远改变许多人的生活，这一点永远不应忘记。同样，调查人员必须决定他们愿意处理什么类型的案件，并理解接受某些案件的影响。\n\
  \n## Otting 博士在执法执法的职业前景\n\n法医分析师的心理因素不能轻视，除了材料分析师接触的 CSAM 之外，还有其他压力源会加剧并经常增加分析师面临的压力。大多数执法机构的资金极度匮乏，这导致了极端的工作负荷以及人手不足的实验室来处理这些工作。实验室经理通常面临压力，需要快速处理数字证据以跟上法庭程序，并将证据存储保持在较低水平，这将给分析师带来更大的压力。增加压力和工作负载的另一个问题是技术进步，这些技术通常领先法院和执法机构数光年。现代世界中的几乎大多数犯罪都具有证据价值的数字部分。介质容量增大需要更长的处理时间、更长的分析和更长的报告时间，这进一步剧了实验室经理的压力，反过来给分析师带来了更多压力。许多机构强制与心理专业人员进行心理检查。密歇根州警察最近建立了一项同伴咨询计划，以便我们更好地互相照顾，帮助缓解分析师面临的压力。随着领导层对所看材料带来的创伤性压力和工作负荷的更广泛认知，健康的饮食习惯、睡眠模式和远离键盘的时间正越来越受到鼓励。\n\
  \n\n\n作为一名分析师，我接触过无数令人无法忍受的 CSAM（儿童性虐材料），正如戈林博士（Dr. Gogolin）所说，那是对捕食者灵魂的深度观察。在职业生涯早期，我意识到必须维护自己的心理健康，并在有时离开去清醒头脑。出去快速散散步、给亲人打个电话、甚至和同事喝杯咖啡，都能极地改善你的心情并让你继续执行任务。虽然我们作为分析师所看到的材料压力可能是邪恶且几乎无法忍受的，但这份职业本身并非没有荣誉和回报。在一个致力于猎捕并将儿童捕食者从街道和网络上清除的部门工作，会有极大的成就感。这些部门的大多数分析师都认为，我们是对抗这些捕食者战斗中的战士。工作必须完成，但只能以正确的方式完成，这包含了分析师的健康和理性。运动、健康饮食、充足的睡眠、与同事沟通——这些习惯往往显而易见，但它们很容易被忘记并养成坏习惯。避免像滥用酒精这样的拐杖，因为这通常会加剧工作压力并导致更糟糕的问题。\n\
  \n## 数字取证的伦理影响\n\n每位调查员都必须确定自己的个人伦理准则。一旦越过底线，就无法回头。我们已经涵盖了处理压力和情绪的一些心理方面，但还有几个类似的伦理方面。关于伦理已有许多著作，其目的并不是要重新回顾或包装那些庞大的作品。本节的目的是指出一些具有伦理内涵的事物，它们可能不是当前伦理讨论的重点，但仍需要被考虑。\n\
  \n我与对数字取证感兴趣的人讨论的第一点是，不仅工具本身具有惊人的力量，所捕获的信息也同样如此。这种力量伴随着巨大的责任，因为调查员有能力去塑造信息呈现和被感知的方式。在许多情况下，人们接受调查结果是具体且不可置疑的。调查员必须坚持事实，不要试图粉饰解释结果，或通过不提供全貌来影响局势。例如，说在某人的电脑上发现了某个特定文件很容易的。但如果该电脑可能被多个人使用过，或者该文件可能是恶意软件的结果而非计算机所有者的行为，那么就不是提供全貌。\n\
  \n另一个涉及伦理但也是良好调查实践的方法仅仅是验证结果。在验证之前展示发现可能会导致类似于“试图让精灵回到瓶子里”的情况。发现的结果和影响越严重，就越应该严谨地进行验证。第二方的验证和/或多个确认流程是可能的方法。结果的背景和所使用的计算机是其他可能影响验证的因素。\n\
  \n良好的伦理实践和良好的调查实践是相辅相成的，即使从分析的角度来看也是如此。人们经常问，优秀的调查员通常具备哪些共同特征。我的回答是：一个有伦道德的人，喜欢解谜，能够应用科学方法，并能客观地提出竞争性理论来解释情况。取证的定义是应用科学来回答问题，它通常处理大量的未知事实。通过应用科学原理，调查员寻求揭示事实。竞争性理论涉及对某一事件或现象提出多种解释，而不是陷入隧道视野并走上最方便的解释的道路。竞争性理论的目标不是将所有鸡蛋放在一个篮子里并仓忙做出判决，而是从多个角度来看问题。这在可能上庭审判的案件中尤为重要，因为对方可能会提出竞争性理论，如果调查员已经考虑了这些提出的理论，那么处理起来就会容易得多。同样，调查对于被调查者来说可能是一次改变生活的经历。如果被错误指控，可能会造成无法修复的损害。进行粗劣的工作和/或错误指控他人可能是检查员可以陷入的最不伦理的情况之一。展示后来被证明不准确或错误的信息可能会毁掉许多人的家庭。\n\
  \n我在每堂取证课上都强调的一个主题是：你永远不要调查你的家人。我无法告诉你有多少人告诉过，他们曾在家人或认识的人身上尝试过各种取证工具和辅助技术。这不仅不符合道德，在许多情况下还是违法的。使用`keyloggers`（键盘记录器）、`phone\
  \ tracking/tapping software`以及类似的工具，在许多情况下是重罪，甚至可能是联邦犯罪。正如我已经提到过的，当你使用取证工具时，你是在窥视一个人的灵魂。很多时候，没有背景来设定你发现的内容，这可能会导致误解。你可能不喜欢你发现的东西，正如鲍勃·西格（Bob\
  \ Seger）在《逆风而行》（Against the Wind）中唱道的：“我希望我现在不知道我以前不知道的事情。”\n\n最后一个我在文献中没有看到很多、但在实践中看到过的伦理方面是：对他人机器上发现的东西制作个人副本。这可能是简单的`mp3`、`picture`或`video\
  \ file`，也可能是更广泛的内容，如`licensed software`。仅仅因为检查员有权访问某些，并不意味着他们可以自由复制。取证检查员就像银行柜台员——他们可以接触钱，但不能拥有它。永远记住，伦理包含了信任和诚信。如果失去了任何一种，就可能永远无法找回。\n\
  \n## 数字取证的文化影响\n\n尝试衡量互联网对文化的影响将是非常有趣的。在 20 世纪 90 年代末，只有少数人使用万维网，但现在它已无处不在。社交媒体、虚拟世界、在线游戏和电子邮件只是将世界带到指尖的科技之一。由于我们很容易聚集在一起，文化理解变得更加重要。我们需要理解，成语、俚语和手势可能具有与原始意图完全不同的解释。这意味着犯罪可能由地球另一端的人实施。银行抢劫犯局限于当地或区域的时代已经过去。欺凌者仅限于听力范围的时代已经过去。我们处于一个不同的世界，未能适应变化的情况将产生严重的后果。\n\
  \n\n\n数字取证是网络安全的关键技术之一。它可以用于测试、验证、应急响应和分析。由于数字世界的全球化特征，一个人甚至一个国家都无法完全应对所面临的挑战。数字取证和网络犯罪是跨学科领域，需要涵盖法律、计算机科学、金融网络、数据挖掘和刑事司法等多个领域的专业知识（Goel,\
  \ 2010）。此外，大多数国家都有多种通通俗的方言和语言。在美国，精通两种以上语言的人相对较少。美联社（2005 年）的一篇文章报道道，一半的欧洲人会说双语，而只有\
  \ 9%的美国人熟悉两种以上的语言。2010 年，弗朗索瓦·格罗热让（Francois Grosjean）发现量化双语能力非常困难，但他估计欧洲的 56%、英国的\
  \ 38%、加拿大的 35%以及美国的 17%符合双语使用者的标准。语言和文化对网络安全的影响不容低估。在 2010 年的一篇文章中，Coopes 指出全球网络犯罪问题的规模大于全球毒品贸易。在澳大利亚，据报道每\
  \ 3 秒就有一个身份被盗（Coopes, 2010）。网络犯罪调查涉及可能大量的个人和群体，他们需要在许多层级和边界之间通信、共享和决策（Katos and\
  \ Bednar, 2008）。如果忽视其中还存在多元文化问题，那无异于鸵鸟守头。由于调查网络犯罪事件的关键途径之一是数字取证，因此文化理解和语言能力可能是区分优秀调查员与卓越调查员的关键。\n\
  \n家庭状况很大程度上是围绕文化构建的。在世界许多地区，多代人住在同一栋房屋里。在许多如西班牙背景的文化中，家庭和朋友聚会的次数远比典型的美国家庭多。因此，解释某些个人聚在一起的原因可能有文化基础。调查员在检查数字设备时，必须理解这类洞察。对于介质上的事件、通信内容和数字图像，可能有许多解释。一个家庭中可能有多个母亲，如果没有这种理解，信息的含义可能会被误读。\n\
  \n讨论文化时的另一个浮出的方面是，它可以让人们理解某人的想法、他们可能会如何行动，或者他们可能会使用什么技术来掩盖证据。获得这种理解有助于确定动机和方法，而这是任何数字取证调查的关键。能够用外语与嫌疑人交流将开启许多调查大门。如果不花时间研究和理解文化，许多此类线索和机会将会被忽略。检查员需要每一个可以获得的竞争优势，因为取证调查由于其本身就已经足够困难了。\n\
  \n## 结论\n\n本章涵盖了许多深奥的主题，我将第一个承认我没有心理学学位，而且在伦理方面也缺乏正式培训。然而，这些因素对数字取证过程以及执行检查的调查员的影响程度往往被忽视。很少有技术书籍花时间研究心理学、伦理和文化——至少是流行意义上的文化。各种技术和运动中的亚文化偶尔会被提及。但学习文化并能够用多种语言进行交流需要时间、自律，不幸的是，极少有技术课程要求精通外语。这种疏忽可能会削弱规划和应对数字事件（如网络安全违规和技术辅助犯罪）的能力。正如沟通技能是业务领域的核心胜任能力一样，语言和文化技能也是网络安全和数字取证调查的关键能力。\n\
