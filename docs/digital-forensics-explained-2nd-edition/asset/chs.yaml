  # 第 3 章 数字取证工具包\n\n## 引言\n\n很难理解的是在特定情况下应该使用什么工具，以及所有信息是如何结合在一起形成一项调查的。回答这个问题有很多变量，包括调查的类型、调查目标，以及在调查中完成大多数任务有多种方法这一事实。随着时间的推移，调查人员会对某些工具和技术产生偏好，并逐渐形成他们自己的“首选”工具集。\n\
  \n在出版物中描述工具时面临许多挑战。新版本的发布和修改会使描述迅速过时。同样，工具会更改名称、被其他公司收购，或简单地从市场上消失。例如，一个非常有用的工具——`Wireshark`——曾名为\
  \ Ethereal。因此，读者应该意识到这类变化是不可避免的，而且在任何技术领域，新进展都有可能让事物迅速过时的潜力。\n\n## 计算机取证\n\n计算机取证被定义为涉及个人电脑、笔记本电脑、Macintosh\
  \ 电脑和上网电脑的调查过程。计算机取证需要一台或多台调查计算机。使用多台计算机的原因可能是因为调查可能同时进行，而且某些计算机具有专门的工具和功能。使用虚拟化技术允许多台虚拟机在物理机上运行，可能是减少硬件需求的方法，尽管\
  \ `RAM` 和 `USB` 端口数量等因素可能是限制因素。有些供应商配置并销售专门的取证检查计算机，这是一个有力的选择。\n\n两款商业工具主导了计算机取证多年：Access\
  \ Data 的 Forensic ToolKit（`FTK`）和 Guidance Software 的 `EnCase`。然而，随着时间的推移，计算机领域出现了许多新进展，改变了计算机的架构和利用方式。来自各种供应商的新工具已经应对了这些挑战，并在许多情况下获得了市场份额，并成为计算机取证的可行主要选项。在许多情况下，`Magnet\
  \ Axiom`、`Forensic Explorer` 和 `X-Ways` 等工具已成为 `FTK` 和 `EnCase` 更具效率的选项。每个工具都有其优缺点，因此调查人员做出明智的工具选择以最好地支持眼前的调查至关重要。有些机构拥有多种工具的奢侈条件，这在验证调查结果时特别有价值，因为可以使用多种调查技术。关于哪种工具更好通常会有激烈的讨论，我的观点是这些公司倾向于在每次发布新版本时相互超越。这种竞争为调查人员转化为更强大的工具选择。供应商创建了一些非常棒的技术，但据报道供应商偶尔也会表现不佳。\n\
  \n有很多不同的取证工具可以检查计算机。`EnCase` 和 `FTK` 在早期拥有相当的市场份额。除了开源工具，其他几个供应商也进入了市场，包括 Magnet\
  \ 的 `Axiom`、GetData 的 `Forensic Explorer` 和 `Nuix`。某些工具往往有特定的专门关注领域，某些调查人员则偏好特定的用户界面。[图\
  \ 3.1] 显示了 `Axiom Version 4.3` 接口的截图 [图 3.2] 显示了 `EnCase Version 8` 接口的截图。\n\n其他计算机取证选项还如欧洲产品\
  \ `X-Ways` 以及开源替代方案。除了功能外，成本、培训可用性、支持和长期稳定性都是任何技术购买的考虑因素。格局变化非常快，明智的做法是投资于具有稳定性的工具集，以便维护调查结果。之前提到的计算机取证工具可以用于媒体的镜像和分析。集成工具的优势是，你执行的所有搜索和操作的结果都会被集中捕获，使得报告变得更加直观。商业产品的优势是它们通常经过了准确性测试。虽然许多开源工具具有法采信的结果，但某些工具没有经过适当的测试和验证，这意味着它们的发现可能在法庭上不可采信。\n\
  \n虽然这不是唯一的来源，但取证工具验证测试是通过美国标准与技术研究院的计算机取证工具计划进行的，通常被称为 `NIST CFTT`（`NIST.gov`, 2020）。专家证言要在法庭上具有法采信力，必须符合美国最高法院案件\
  \ `Daubert v. Merrel Dow Pharmaceuticals` 确立的 `Daubert` 标准。\n\n## 写保护器\n\n写保护器确保数据在被访问时不会被更改。启动计算机可能会更改计算机中的数百个文件，包括访问时间和和其他文件属性。`write\
  \ blocker` 可以防止这种情况发生。`write blockers` 可以是软件或硬件的。基于软件的写保护器使用软件防止文件修改。硬件保护器利用物理设备防止文件修改。[图\
  \ 3.3] 显示了硬盘写保护器的示例。\n\n\n\n\n调查人员需要多个写保护器选项。IDE 和 SATA 驱动器可能需要一个硬件写保护器，USB 需要另一个，而介质卡等设备则需要另一个。某些写保护器具有切换为读/写接口的能力。为什么有人需要允许写入的写保护器可能会让一些人感到困惑，但这可能是将驱动器和介质连接到取证计算机的良好方法，以便对其进行擦除。了解如何配置读写能力以及如何测试写保护器处于何种配置状态非常重要，这样就可以避免在调查中无意未使用配置了写入选项的保护器。一些供应商会制作不同颜色的保护器，这有助于将写保护器与具有写入能力的保护器区分开来。\n\
  \n## 镜像 (Imaging)\n\n当对计算机、移动设备或其他介质进行取证分析时，通常会进行名为“镜像”的过程。镜像是获取一个与原始文件完全相同的位级（bit\
  \ for bit）副本。镜像的一个关键方面是，可以验证原始版本和副本是完全相同的重复品。可以使用消息摘要 5 (`MD5`) 或安全哈希算法 (`SHA`)\
  \ 等哈希算法来验证副本是原始文件的精确复制。\n\n在镜像过程中，计算机磁盘驱动器通常会位级复制到空白驱动器中。用于接收副本的驱动器通常在镜像过程之前会进行擦除。实现此目的的方法方法包括取证工具、磁盘实用程序和磁盘镜像硬件。一旦磁盘被擦除，就可以以类似于镜像驱动器的方式进行验证。取证工具还提供了视觉化验证过程。使用磁盘镜像器通常是为镜像准备磁盘并执行镜像过程最快的方法。`Figure\
  \ 3.4` 显示了 Ninja 磁盘镜像器正在将主 SSD 复制到目标 SSD 的图片。\n\n![Figure 3.4 Ninja 磁盘镜像器。](img/file12.jpg)\n\
  \n`Figure 3.4` Ninja 磁盘镜像器。\n\n专门的镜像产品可从损坏的介质中提取数据。这些产品的工作方式有多种，包括使用不同类型的读取算法和硬件适配。此类产品中的一种\
  \ Atola Insight，通过防止读取失败和结束条件来修改计算机与磁盘通信的方式。相反，`Insight` 单元将使用替代算法和技术继续从设备中恢复数据。在典型的计算机中，如果发生磁头损坏，读取过程将失败。专门的镜像工具将尝试读取所有不受磁头损坏影响的区域，而不是仅仅对整个驱动器产生读取失败。`Figure\
  \ 3.5` 是 Atola Insight 的图片，用于从损坏介质中恢复数据的专门镜像工具。\n\n![Figure 3.5 Atola Insight 取证。](img/file13.jpg)\n\
  \n`Figure 3.5` Atola Insight 取证。\n\n镜像可能花费大量时间。取决于驱动器的速度、验证情况和所使用的方法，每小时 100 GB\
  \ 是粗略的基准。这意味着仅镜像一个 1 TB 的驱动器就需要 10 小时。如果有多个驱动器，很容易看出调查可能需要耗费长时间。预览驱动器是确定是否需要制作镜像的方法。在磁盘镜像期间，也可以执行一些取证功能。\n\
  \n移动设备镜像在取证过程中可能占据不同的位置。某些移动取证产品采用内部写保护技术，并简单地生成设备上内容的报告。其他移动取证产品则为检查员的审问创建一个镜像。所使用的过程类型取决于检查的要求和可用工具。\n\
  \n## 插件和其他技术 (Add-ons and other technologies)\n\n计算机通常会设置密码，以防止未经授权访问设备上的程序和信息。同样，加密通常被用作安全机制，保护信息免受未经授权的查看。技术上仍然可以访问数据，它们只是处于不可读格式。算法被用于扰乱数据，需要采用反向过程使数据变得可读。遗憾的是，坏人也采用了加密。处理密码和加密是数字取证调查人员的日常任务。\n\
  \n有很多工具可以处理密码。某些工具允许你重置 Microsoft Windows 密码。另一些工具尝试使用字典和暴力破解等攻击方法猜测密码。如 `Veracrypt`\
  \ 等加密工具使用密码锁定容器、分区或驱动器。当输入密码时，就可以以未加密格式访问内容。字典攻击使用单词或单词组合作为猜测密码的方法。攻击使用的字典可以包括各种语言的常用字典。还会有针对缩写或俚语的专门字典。暴力破解攻击生成字母、数字和特殊字符的组合以尝试猜测密码。某些工具允许调查人员使用密码的已知特征为密码工具设置种子，以缩短密码破解过程。\n\
  \n另一种解密和密码猜测机制是使用彩虹表（rainbow tables）。密码通常以哈希格式存储，而不是明文。解密工具需要对字典中的单词进行哈希，然后在密码攻击中使用这些哈希。彩虹表通过对字典进行哈希处理简化了这一过程。提高了效率，因为解密工具在攻击期间不需要对字典进行哈希。\n\
  \n密码越复杂，猜测所需的时间越长。取决于所使用的技术，包含数字、字母和特殊字符的八字符密码可能需要几个月或几年才能破解。可以使用专门的解密计算机来加速攻击。显卡的\
  \ `GPU` 在解密方面比使用计算机的 `RAM` 快数量级。游戏电脑可以配置多个并行的高速显卡，从而大幅提高解密能力。`Figure 3.6` 是带有多个并行显卡的专门密码分析工作站。\n\
  \n![Figure 3.6 Talino 密码分析工作站](img/file14.jpg)\n\n`Figure 3.6` Talino 密码分析工作站\n\n\
  音频、视频和图形文件是调查人员必须处理的常见证据。这些文件通常需要增强，因此熟悉提供这种能力的工具是一项关键技能。这种情况包括处理监控视频、处理低分辨率或对焦的图片以及伪造案件。`Photoshop`\
  \ 等软件是此目的的常见选择，还有许多提供更强大能力的专门技术。\n\n计算机取证工具内置了文件查看器，但有时需要其他查看器。一些常用的查看器包括 `Irfview`、如\
  \ `NavRoad` 等离线 HTML 查看器、VideoLAN 的 `VLC` 媒体播放器以及 Microsoft Office。经常还会遇到压缩文件，因此\
  \ `WinRAR` 等工具非常方便。虽然十六进制编辑器是计算机取证工具的常见功能，但有时外部十六进制编辑器也会有用。同样，如 `HashCalc` 等哈希计算器对于生成文件哈希值非常有用。\n\
  \n\n\n\n计算文件偏移量和基数转换在处理文件系统以寻找文件碎片和遗迹时非常有用。在取证计算机的任务栏上为计算器分配快捷键，是获取方便访问的一种方法。诸如\
  \ `FeelTheBase` 这样的基数转换器可以翻译十进制、二进制、十六进制和 IP 地址，是取证人员工具箱中的另一个插件。\n\n对于涉及恶意软件的检查，诸如\
  \ `Sysinternal’s Process Explorer` 这样的进程监控器将比 Windows 任务管理器（Task Monitor）显示更详细的进程信息。图\
  \ 3.7 显示了 `Process Explorer` 中可用信息的示例。\n\n`Wireshark`、`NetStat` 和 `TCPView` 等工具将提供网络和通信信息，调查人员可以利用这些信息来确定恶意软件的配置和功能。特别是在机器处于运行状态时，端口状态和通信地址在追踪恶意软件活动以及响应黑客事件时非常有用。\n\
  \n谈到活体机器，对 RAM 进行镜像和处理可以是另一种处理恶意软件或黑客取证案件的方法，也可以定位密码。使用一个包含小型实用程序的 USB 驱动器可以将 RAM\
  \ 内容转储到 USB 驱动器，这是获取信息的典型方法。RAM 转储文件是没有格式化的，因此一个可以处理转储文件以寻找感兴趣信息的工具是另一个需要包含在取证人员工具箱中的。RAM\
  \ 镜像和格式可以是 `Magnet` 等数字取证工具套件的一部分，也可以是独立工具。\n\n如果我不提到杀毒软件 (AV) 软件在数字取证过程中的作用，将是我的失职。恶意软件调查可以为确定不在场证明的有效性提供见解，还可以确定恶意软件在组织内的渗透程度。在被指控犯计算机罪时，有人声称是由于恶意软件防御并不罕见。这种立场基于这样一个前提：他们没有做任何错事——相反——是他们的电脑感染了恶意软件，而恶意软件的控制者应对犯罪活动负责。（*由于此处后续文本存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理*）\n\
