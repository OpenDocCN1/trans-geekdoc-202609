  \ A Guide to How Wifi Works.\n\n# 第 11 章 反取证（Anti-forensics）\n\n在深入探索反取证的定义之前，我们需要先回溯并理解刑事调查的概念。埃德蒙·洛卡德（Edmond\
  \ Locard）博士提出了刑事调查原则。\n\n在数字取证的世界中，证据主要存储在计算机存储设备中，形式为文件、日志、注册表项以及其他描绘特定活动的“元素”。\n\
  \n## 反取证的定义与概念\n\n\n\n\n\n# 什么是反取证（Anti-forensics）？\n\n牛顿第三运动定律规定“每一个作用都有一个相等且方向相反的反作用”。如果说取证是“将科学应用于刑事司法系统中由警察机构强制执行的刑事法和民事法律中”，那么“反取证”即是其对立面（Harris,\
  \ 2006）。Garfinkel (2007) 概述道反取证是“阻碍取证工具、调查和调查人员的工具和技术”。另一方面，Peron 和 Legary (2005)\
  \ 将反取证定义为“限制电子数据识别、收集、汇编和验证的尝试”。其他人则简单地将反取证定义为避免检测或隐藏系统入侵的技巧。对于反取证的定义存在多种 `interpretation`。为了本章的需要，反取证被定义为“在取证过程中，任何损害证据的可用性或有用性的尝试”（Harris,\
  \ 2006）。\n\n> *免责声明：* 本章内容仅供信息和教育目的之用，不得用于任何非法、不合伦理、不道德或其他恶意方式。出版者或作者对因使用或误用本章引起的任何损失、伤害和其他损害不承担责任。\n\
  \n# 为什么要使用反取证？\n\n反取证具有广泛的应用领域和目的。这些领域之广远超人类的想象。这就像询问人们为什么要黑入计算机一样。反取证的主要目的是对抗取证。我们只能推测反取证的真实“需求”是什么。以下是一些可能性，或者说说是假设：\n\
  \n*   **保护隐私：** 一些人相信自己在家中的隐私权。\n*   **保护资产和知识产权：** 例如加密和数字水印。\n*   **维护国家安全：**\
  \ 反取证可能对于保护政府机密文件或隐藏特密行动痕迹有用。\n*   **间谍活动：** 反取证在国家、国际和企业情报行动中可能起重要作用。\n*   **防御犯罪活动：**\
  \ 隐藏违法行为的痕迹。\n*   **培养网络战争：** 黑客行动主义、政治权力和霸权。\n\n### 表 11.1 反取证方法分类\n\n| Peron and\
  \ legary | Rogers | Harris |\n| :--- | :--- | :--- |\n| 隐藏 | 数据隐藏 | 隐藏数据 |\n| 破坏\
  \ | 痕迹清除 | 破坏数据 |\n| 防止创建 | 针对过程和工具的攻击 | 消除源 |\n| 操纵 | 痕迹模糊 | 伪造 |\n\n## 反取证方法\n\
  \n通常，执行某项任务有多种方法。进行反取证也是如此。在本节中，我们将讨论一些反取证方法，并根据其目的向量对其分类。正如我们在反取证的定义中所看到的的一样，对反取证方法的分类存在不同的观点。Peron\
  \ 和 Legary (2005)、Rogers (2005) 以及 Harris (2005) 提供了各种框架。\n\n在本节中，我们将讨论一些反取证方法，并根据其目的向量对其分类。正如我们在反取证的定义中所看到的的那样，对反取证方法的分类存在不同的观点。Peron\
  \ 和 Legary (2005)、Rogers (2005) 以及 Harris (2005) 提供了各种框架。\n\n在本节中，我们将讨论一些反取证方法，并根据其目的向量对其分类。正如我们在反取证的定义中所看到的的一样，对反取证方法的分类存在不同的观点。Peron\
  \ 和 Legary (2005)、Rogers (2005) 以及 Harris (2005) 提供了各种框架。\n\n\n\n\n\n许多 Web 应用程序和\
  \ Web 服务器通过脚本查询我们的浏览器。例如，大多数现代浏览器默认都启用了 JavaScript。我们需要留意的是，恶意的 JavaScript 可以在未经我们同意的情况下，泄露任何网站的任何星号密码。图\
  \ 11.1 展示了我们已经输入了一个用户名（`ANTI-FORENSICS`）和一个被掩码的密码（`It’s3@zy2h4k!!`）。图 11.2 展示了通过在浏览器地址栏中解析一个简单的\
  \ JavaScript 命令有多容易地揭示密码。\n\n归根结底，脚本增强了我们浏览器内的功能，并允许轻而地收集取证数据。为了消除证据源，我们可以在浏览器的设置或配置文件中禁用脚本（`JavaScript`\
  \ 和 `CSS`）。大多数现代浏览器都提供“隐私浏览”模式，该模式可能不会保存任何浏览信息或插件。\n\n最后但同样重要的是，是否可能不留任何痕迹？对于这个问题的答案存在争议；然而，简短的答案是：这是可能的，但并不常见。例如，让我们检查内存注入。缓冲区溢出允许攻击者向运行中应用程序的地址空间注入并运行任意代码。因此，结果是改变了受害者应用程序的行为。Garfinkel\
  \ (2007) 解释道，“用户态 execve”允许攻击者在不使用 Unix `execve()` 内核调用的情况下，在受害计算机上加载并执行应用程序。换句话说，反取证程序允许攻击者绕过基于内核的安全系统，这些系统拒绝对\
  \ `execve()` 的访问并将其使用记录到安全日志服务。\n\n事实上，Ripe 和 Pluf (2005) 编写道，“用户态 execve”是一种机制，能够正确且有序地模拟内核在内存中加载可执行文件并运行它时遵循的程序。Garfinkel\
  \ (2007) 补充道，“用户态 execve”可以从网络读取而不写入受害者的存储介质。攻击者不是在受害者的设备上加载漏洞程序，而是可以使用“系统调用代理”，该代理可以接受来自攻击者的远程过程调用。“系统调用代理”还可以协助在受害者设备上执行请求的程序调用，并最终将结果报告给攻击者。Harris\
  \ et al. (2008) 报告说，使用“系统调用代理”shellcode 允许我们在不向目标上传任何文件、且不在目标机器上创建新进程的情况下运行恶意代码。\n\
  \nHarris 等. et al. (2008) 讨论了另一种 shellcode 技术，称为“进程注入”shellcode。它允许攻击者在目标计算机上现有进程的上下文中，在一个独立的执行线程下加载运行完整的代码库。从某种意义上说，我们正在一个现有进程上“搭便车”。通过这种方法，我们可以在现有进程中加载代码，而不会在目标机器上留下更改的痕迹。一旦我们入侵了该进程，我们就可以“跳转”到另一个进程并在必要时迁移我们的代码库。注入的代码可能永远不会被写入目标机器的存储介质。进程注入反取证方法最为人知的工具是\
  \ Metasploit Framework 中包含的 Meterpreter 高级载荷（[www.metasploit.com](http://www.metasploit.com)）。\n\
  \n如果没有提到 Live CD、便携式存储设备和虚拟机，本节将是不完整的。这些方法允许我们运行各种应用程序，同时显著减少证据足迹的来源。让我们来看每种方法：\n\
  \n*   **Live CDs**:\n    *   **合一版 (All-in-one)**:\n        *   **全功能版 Live CD**:\
  \ 允许在只读磁盘上运行操作系统。这些工具有助于减少取证证据足迹（Garfinkel, 2007）。示例有 BackTrack、Hiren、Kali 等。\n\
  \        *   **匿名 Live CD**: 专门为匿名浏览设计的操作系统。示例有 Anonym、Sabayon、Privatix。\n     \
  \   *   **可启动 USB**: 这种方法允许数据写入 USB 设备。攻击者不是在受害者的设备上加载漏洞程序，而是将存储配置为可写模式。\n     \
  \   *   **虚拟机**: 操作系统在虚拟环境中运行。这对于攻击者有利，因为某些安全工具可能发现运行在虚拟环境中的 rootkit。虚拟机状态保存到主机。\n\
  \n最后但同样重要的是，我们需要提到匿名账户。我们可以使用虚假身份和存储来避免本地计算机上的证据（例如 Yahoo!、Gmail、Dropbox）。此外，像 [www.bugmenot.com](http://www.bugmenot.com)、[www.metasploit-us.org/dpl/dpl.xhtml](http://www.metasploit-us.org/dpl/dpl.xhtml)\
  \ 和 [10minutemail.com](http://10minutemail.com) 这样的网站提供了通用账户凭据、设备密码和临时电子邮件地址。此类资源有助于减少取证证据源。\n\
  \n## 隐藏证据 (#C02a_toc.xhtml#rsecc11_4)\n\n如果我们消除证据，可以尝试将其从视野中移除/隐藏。这种技术并不是试图破坏或操纵证据，而是为了在取证调查期间使其不可见。需要注意的是，隐藏证据与隐藏工具几乎同样重要。如果调查人员检测到“隐藏”工具的存在，这一发现本身就可能成为罪证（Harris,\
  \ 2006）。\n\n隐藏的成功取决于人为因素。无法保证隐藏证据一定会成功。我们可以希望将证据隐藏在调查人员可能会忽略的地方。作为一种反取证技术，隐藏利用了物理和数字世界的局限性。文件可以隐藏在“眼皮底下”，利用调查人员的盲点，或者隐藏在其他文件中，利用取证软件的固有局限性（Harris,\
  \ 2006）。\n\n事实上，加密是这样一种让我们有效地隐藏信息的方法。然而，需要注意的是，加密并没有解决加密数据容易被取证工具发现的问题。Garfinkel\
  \ (2007) 指加密数据具有异常高的熵；许多加密工具嵌入了特定的标记、头部和签名，这有助于取证工具发现加密数据。如果调查人员获取了加密密钥，对隐藏数据进行加密也是可能的。\n\
  \n加密方法有很多。其中一种是加密文件系统。加密文件系统在数据写入磁盘时透明地进行加密。如果加密密钥被毁，数据将无法访问。\n\n\n\n\n另一方面，Mah\
  \ (2007) 编写了关于 [www.ironkey.com](http://www.ironkey.com) 的“IronKey”，该产品声称是世界上最安全的优\
  \ 盘。它提供基于硬件的 `AES 256-bit` 加密、可选的反恶意软件保护，以及在密码未正确输入 10 次后对数据进行硬件级覆盖写。加密密钥由符合 `FIPS\
  \ 140-2` 标准的真随机数生成 `True Random Number Generator` 生成。\n\n除了加密文件系统和软件外，我们还需要处理如 `SSL/TLS`\
  \ 和 `SSH` 等加密网络协议。由于大多数人应该都熟悉其中一种，我们将讨论 `I2P`，它被称为“匿名网络”（[www.i2p2.de](http://www.i2p2.de)）。该网络的建立旨在通过提供不可审查、匿名且安全的通信来帮助我们的自由社会。`I2P`\
  \ 将流量路由到其他节点，流量在端到端之间经过多次加密。多种邮件、点对点和 IRC 应用程序均支持 `I2P`。声称 `I2P` 提供 100% 的匿名性是荒谬的。这里的重点在于它可以阻碍司法分析；因此，它在反取证工具和技术中值得提及。作者网站上的图\
  \ 11.3 显示了从 Alice 到 Bob 的流量加密过程。\n\n此外，当我们谈论隐藏和反取证时，我们需要提到来自 [www.torproject.org](http://www.torproject.org)\
  \ 的臭名昭著的“Tor 项目”。`Tor` 帮助我们隐藏在网络其他用户之中。网络上的人越多，分析我们流量就越困难。根据 Tor 网站上的信息，`Tor` 通过将用户交易分发在互联网的多个位置来保护用户。因此，没有任何单点可以将我们与目的地联系起来。我们不像使用\
  \ `I2P` 那样直接从“A”到“B”，而是通过经过多个中继节点的随机路径来掩盖足迹。确定数据源自何处或去向何处非常难以追踪。\n\n![图 11.3 I2P\
  \ 加密流量流。](img/file42.jpg)\n\n图 11.3 I2P 加密流量流。\n\n![图 11.4 数字混合：Alice 向 Bob 发送消息。](img/file43.jpg)\n\
  \n图 11.4 数字混合：Alice 向 Bob 发送消息。\n\n事实上，Geelkerken (2006) 解释说 `Tor` 使用了一种名为匿名代理的技术。匿名代理是一个服务器，它将请求从一个位置重新重定向到另一个位置。此外，`Tor`\
  \ 使用了数字混合的变体。数字混合就像是将信封装在四个不同的信封中，这些信封预先写好了地址并贴上了带有微小信息的“请拆除信封并重新邮寄”。如果接三个收件者都重新邮寄信件，信件到达预期接收者处而不会在第一个发送者和最终接收者之间留下纸质痕迹。图\
  \ 11.4 通过 Alice 向 Bob 发送消息概述了数字混合过程。Alice 将使用公钥加密对其发给 Bob 的消息加密三次。然后她将把消息发送到代理服务器，该服务器将移除第一个密钥。第二个和第三个服务器将分别使用剩余两个密钥中的一个解密并排列消息，直到消息发送到\
  \ Bob。\n\n除了 `I2P` 和 `Tor` 等加密网络外，程序加壳器（program packers）也可以是反取证的一种有效隐藏技术。加壳器用于通过扫描隐藏工具以防止逆向工程或取证检测。来自\
  \ [www.bit-sum.com](http://www.bit-sum.com) 的如 `PECompact` 等加壳器可以做到这一点。`UPX` ([`upx.org`](http://upx.org))\
  \ 这种加壳器支持各种格式，如 EXE、PDF、MP3、脚本等。加壳器用于隐藏工具以防止逆向工程或通过扫描进行取证检测。 (注：此处根据原文逻辑整合，原文中存在部分重复描述)。翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译，翻译。\
  \ (注：此处根据原文逻辑整合，原文中存在部分重复描述。)\n\n事实上，Geelkerken (2006) 解释说 `Tor` 使用了一种名为匿名代理的技术。匿名代理是一个服务器，它将请求从一个位置重新重定向到另一个位置。此外，`Tor`\
  \ 使用了数字混合的变体。数字混合就像是将信封装在四个不同的信封中，这些信封预先写好了地址并贴上了带有微小信息的“请拆除信封并重新邮寄”。如果接三个收件者都重新邮寄信件，信件到达预期接收者处而不会在第一个发送者和最终接收者之间留下纸质痕迹。图\
  \ 11.4 通过 Alice 向 Bob 发送消息概述了数字混合过程。Alice 将使用公钥加密对其发给 Bob 的消息加密三次。然后她将把消息发送到代理服务器，该服务器将移除第一个密钥。第二个和第三个服务器将分别使用剩余两个密钥中的一个解密并排列消息，直到消息发送到\
  \ Bob。\n\n除了 `I2P` 和 `Tor` 等加密网络外，程序加壳器（program packers）也可以是反取证的一种有效隐藏技术。加壳器用于通过扫描隐藏工具以防止逆向工程或取证检测。来自\
  \ [www.bit-sum.com](http://www.bit-sum.com) 的如 `PECompact` 等加壳器可以做到这一点。`UPX` ([`upx.org`](http://upx.org))\
  \ 这种加壳器支持各种格式，如 EXE、PDF、MP3、脚本等。加壳器用于隐藏工具以防止逆向工程或通过扫描进行取证检测。 (注：此处根据原文逻辑整合，原文中存在部分重复描述。)\n\
  \n\n\n亲爱的朋友，当你加入我们的俱乐部时，你做出了正确的决定。如果你不再希望接收我们的出版物，只需回复主题为 `REMOVE`，你将立即从我们的邮件列表中移除。此封邮件的发送符合参议院第\
  \ 1624 号法案；第 5 章；第 301 节！这不是多级营销！\n\n我们有多少人会费心去读这些垃圾信息呢？期待秘密信息的人可以使用相同的网络服务对其进行解码，并收到秘密信息\
  \ `Anti-forensics.`（反取证）。隐写术不仅仅是一种工具，它更是一门艺术和科学！\n\n### 替用数据流 (ADS)\n\n在回顾了隐写术之后，我们需要提到替用数据流（ADS`）。Zadjmool\
  \ (2004) 解释说，`ADS` 是任何版本的 Windows `NTFS`（文件系统）的特性。它是在被攻的系统上隐藏根内核（rootkits）或黑客工具并在不被察觉的情况下执行这些工具的方法。`ADS`\
  \ 的作用是提供在不影响现有文件功能、大小或视觉呈现的情况下，向现有文件附加文件数据的能力。例如，如果我们输入：\n\n*   `C:\\Forensics>\
  \ echo “ANTIFORENSICS are DANGEROUS” > file.txt:hidden.txt`，我们只是向 `file.txt` 添加了一个名为\
  \ `hidden.txt.` 的 `ADS`。冒号 `:` 分隔了 `ADS` 和载体文件。如果我们列出容器文件夹的内容，隐藏的 `ADS` 将不会被显示。请查看以下示例：\n\
  \n```bash\nC:\\Forensics>echo “ANTIFORENSICS are DANGEROUS” > file.txt:hidden.txt\n\
  C:\\Forensics>dir\n```\n\n*   C 盘卷没有标签。\n*   卷序列号是 XXXX-XXXX\n*   目录 C:\\Forensics\n\
  *   05/27/2011 10:19 PM <DIR>\n*   /27/2011 10:19 PM <DIR>\n*   /27/2011 10:19 PM\
  \ 0 file.txt\n    *   1 个文件(s) 0 字节\n    *   2 个目录(s) 30,437,232,640 字节可用\n\n在这个示例中，我们将秘密信息\
  \ `ANTIFORENSICS are DANGEROUS` 注入到 `ADS` (`hidden.txt`) 中而不是 `file.txt`。如果我们打开\
  \ `file.txt`，它将是空的（大小为 `0`）。使用 `Helios Lite`、`LADS` 或替代的 `ADS` 显示工具，我们可以发现文件 `file.txt:hidden.txt`\
  \ 确实是 `27 bytes.`。\n\n```bash\nC:\\Forensics>lads LADS - 免费版 4.10 (C) 版所有 1998–2007\
  \ Frank Heyne Software ([http://www.heysoft.de]) 此程序列出带有替用数据流 (ADS) 的文件\n```\n\n\
  *   请自风险使用 `LADS`！\n*   正在扫描目录 C:\\Forensics\\\n*   文件中的 `ADS` 大小\n*   `C:\\Forensics\\\
  file.txt:hidden.txt`\n*   列出的 1 个 `ADS` 字节\n\n`ADS` 部分引出了根内核。简而言之，根内核通常与木马、后门、远程管理和下载器恶意软件等黑客工具组合相关，它们入侵目标系统并向用户和已知的安全软件隐藏踪迹。一些流行的变体包括\
  \ `Hacker Defender`、`t0rnkit`、`Adore`、`bOstt` 等。Milliron (2010) 报告说，根内核运行在最高权限级别——内核，而这也是操作系统\
  \ (OS) 功能所在的地方。与木马的区别在于，木马运行在 `Ring 3`，这通常与应用程序操作相关。根内核作为独立组件运行。存在以下攻击技术：\n\n* \
  \  **MBR 感染**：主引导记录允许 BIOS（基本输入输出系统）与操作系统交互。根内核可以控制硬件。例如，`13h` 允许直接访问硬盘。\n*   **虚拟机**：虚拟机被定义为在操作系统拦截请求。根内核可以拦截请求并传递给虚拟机。虚拟机管理器可以执行恶意代码。这意味着根内核可以完全擦除信息。\n\
  *   **替用数据流**：替用数据流（ADS）是不可见的，因为根内核可以控制数据。\n*   **空隙空间**：根内核可以隐藏在空隙空间，因为许多安全工具无法有效扫描此处。\n\
  *   **中断钩**：中断请求（IRQ）被操作系统使用。根内核可以拦截请求。\n*   **消息钩**：运行在内存中的应用程序使用消息进行通信。消息钩用于在消息到达目的地之前拦截。\n\
  *   **SSDT 钩**：操作系统使用服务描述符表 (`SSDT`) 来定位服务。如果根内核控制了 `SSDT`，任何尝试使用 `SSDT` 的程序将被重定向。例如，`QueryDirectoryFile`\
  \ 被挂钩，根内核可以提供虚假信息。\n*   **IRP 钩**：I/O 请求包 (`IRPs`) 在程序与硬件通信时使用。例如，如果根内核控制了 `tcpip.sys`，它可以隐藏网络流量。\n\
  *   **DKOM**：直接内核对象操作 (`DKOM`) 允许根内核访问内核对象。它允许根内核进行系统更改，这些更改仅在内存中发生，使得许多恶意软件工具无法检测根内核。\n\
  \n\n\n\n与其将注意力放在删除文件上，我们不如覆盖文件的元数据，如访问、创建和修改时间戳。Garfinkel (2007) 将覆盖元数据描述为重写文件属性的过程。例如，取证人员可以尝试构建活动时间线。可以部署取证工具来按时间顺序分析文件时间戳。`Metasploit`\
  \ 的时间戳功能允许操作 `NTFS` 以创建、修改、访问和删除时间戳。在 Unix 系统上，可以使用 `Defiler` 的工具包或 `touch` 命令来覆盖时间戳。\n\
  \n## 移动端反取证\n\n根据统计，全球至少有 26 亿移动电话用户。中国移动报告称，他们每月新增 600 万新用户。如今，移动设备是紧凑型计算机。移动设备配备了图形化界面、计算资源和连接功能。此类设备存储了更多的个人信息，使其成为取证分析的完美目标（Distefano\
  \ et al., 2010）。由于一些传统的反取证技术可能不适用于移动世界。出于多种原因，对反取证工具的需求非常紧迫。让我们详细研究一下 Android 操作系统的反取证技术。\n\
  \nDistefano et al. (2010) 描述了 Android 移动平台的不同反取证技术：\n\n*   **移动内部取证工具 (MIAT)：**\
  \ 设身于调查者的立场可以帮助我们制定更好的反取证计划。`MIAT` 是一个可以通过 [`miatforensics.org`](http://miatforensics.org)\
  \ 获取的开源移动取证应用。它可以作为一种主动措施，用于发现我们留下的证据/数据。\n*   **利用 Android 特性：** Android 将任何运行的应用程序绑定到安全的\
  \ `Sandbox` 中，如果没有显式权限，它无法与其他应用程序干扰。权限在应用程序安装期间静态定义，在应用程序的生命周期内不会改变。所有应用程序都必须使用开发者证书签名，以便与其他应用程序建立交互。例如，我们可以创建一个保护某些文件或文件夹的应用程序。这种保护是在操作系统层面确保的；因此可以作为一种反取证技术。\n\
  *   **私有文件夹：** 我们可以创建一个私有文件夹，只有指定的应用程序可以访问。该文件夹可以存储文本文件和多媒体等。该文件夹将对其他应用程序隐藏，从而实现了一种信息隐写术。\n\
  *   **反取证应用：** `AFDroid` 是一个创建私有文件夹的应用程序，它还允许执行两个进程：\n    *   **证据导出进程 (EEP)：**\
  \ 将移动设备上的信息导出到私有位置。\n    *   **证据导入进程 (EIP)：** 反转 `EEP` 过程。\n*   **证据导出进程：** [图\
  \ 11.5] 展示了 `EEP` 过程，我们使用 `AFDroid` 导出短信和联系人等信息，并将其导出到安全的 `XML` 文件（私有存储）。\n*   **Honeycomb：**\
  \ 它引入了一个新的 API，支持强制加密存储和密码保护（Hollister, 2011）。Fisher (2011) 报告说 `WhisperCore` 是为移动设备提供加密的替代软件。\n\
  \n    ![图 11.5 Android 平台上的证据导出过程](img/file44.jpg)\n    *图 11.5* Android 平台上的证据导出过程。\n\
  *   **证据破坏：** 如果我们需要删除私有文件夹，只需卸载 `AFDroid` 应用程序。使用 Android 内置的出厂数据重置功能可以删除部分数据，但设备上可能仍残留某些数据。此外，Google\
  \ 的 `Sync`、`Kaspersky Mobile Security` 和 `Microsoft Exchange 2010` 都提供了远程擦移动设备数据的功能。\n\
  \n## 结论\n\n可以使用许多不同的工具和技术来误导取证人员。这些技术中的许多确实构成了重大挑战，并实际上可能导致无法使用典型的取证实践恢复信息。了解反取证工具和技术的方法以及它们如何被使用，可以使取证人员理解反取证实践的优势以及利用其弱点的潜力。\n\
