  \ Research. (2019). Smartphone ownership in advanced economies higher than in emerging.\
  \ Retrieved on April 8, 2020 from [`www.pewresearch.org/global/2019/02/05/smartphone-ownership-is-growing-rapidly-around-the-world-but-not-equally`](https://www.pewresearch.org).\n\
  \n10. Wei, M., Grupp, L., Spada, F., & Swanson, S. (2011). *Reliably Erasing Data\
  \ from Flash-Based Solid State Drives*. Usenix Fast 11 Conference on File and Storage\
  \ Technologies, San Jose, CA.\n\n\n\n\n\n取证是应用科学过程来回答问题。为了使数字取证成为一门被认可的科学，它必须应用科学方法。科学方法是应用一组公认且可验证的步骤来调查某个问题或冲突。数字取证过程需要包含足够彻底的审查以确认发现，并且不应忽略可能导致发现结果失效的痕迹。换句话说，调查人员需要尽到尽责并审查所有事实，而不仅仅是那些产生预期结果的事实。在许多情况下，取证审查会为一方进行，而相同的证据将由对立方进行类似的审查。如果调查人员产生不准确的结果，这可能会当两个对立方的结果在法庭或其他论坛汇合时显现出来。有助于巩固结果的一种方法是在最终确定之前，让第二双“眼睛”对结果进行审查。同样，你也应该审查来自对立团队的取证结果以验证其准确性。正如罗纳德·里根常说过的：“Doveryai,\
  \ no proveryai，”或者说“信任但要验证”。\n\n从取证调查的角度来看，处理案件有多种方法。调查周围的情况会影响调查的开展。例如，公司、民事和刑事案件之间存在差异。可能会有影响调查速度的时间限制，可能涉及新兴技术，媒体可能受损，或者该操作可能有隐秘密要求。因此，说调查应该始终遵循一种规定的方法论可能并不准确。然而，仍然有一些基本元素是必须努力维持的，以保持一致性和准确性。这些元素包括：不要污染证据、保持客观、陈述事实并尽最大努力。\n\
  \n在某些情况下，你只需要做的就是验证设备上是否存在某件物品。例如，我认识一位在矫正部门工作的数字取证调查员，他处理获得假释的人员。他经常对假释人员的手机或电脑进行实地检查。由于他处理的案件量很大，他只有时间寻找特定内容，而不是进行“大捞式”的搜索。\n\
  \n在许多情况下，数字取证检查支持着更大的案件问题。由于数字部分只是整个案件的一部分，通常取证检查会获得相应的关注。如果案件可能通过辩诉交易，那么在案件进入法庭之前或除非，可能花费极少的取证精力。图\
  \ 2.1 显示了 2010 年至 2019 年向互联网犯罪投诉中心（IC3）报告的犯罪。它清楚地描述了数字取证调查员在潜在案件工作量上面临的挑战。记住，除了数字犯罪数量增加外，数字犯罪的复杂性也在增加。\n\
  \n![图 2.1 2010–2019 年向 IC3 报告的犯罪。(ic3.gov.)](img/file1.jpg)\n\n*图 2.1* 2010–2019\
  \ 年向 IC3 报告的犯罪。（[ic3.gov](http://ic3.gov)）\n\n公司调查可能集中在某个特定文件或一组文件、软件或通信记录的与否。我处理过一些案件，其目的是确定谁参与了特定的计划。这不属于犯罪，而更倾向于滥用公司资产。在这种情况下，定罪证据可能位于调查目标之外的人员的服务器或设备上。在我提到的那个案例中，一名员工选择离开组织。对其中一个公司发放的设备进行粗略审查时发现了几个人之间的通信记录，其中详细说明了对公司资源的潜在滥用。对通信记录中人员的电脑和设备进行了进一步检查，以获取有关资源滥用的细节。通过对原始通信中的信息进行关键词搜索发现了信息，随后这些员工被解雇。这是一次针对性的搜索，而不是全面的调查。\n\
  \n我想表达的观点是，人们在数字取证调查中遵循的方法论取决于具体情况。在法庭程序中，这一概念可以决定案件的成败。知道你为什么在调查中做了某些事很重要，但知道你为什么在调查中没有做某些事同样重要。此外，了解这些决策的影响也很重要。我将描述取证检查中的常见步骤及其执行的原因，并尝试说明它们的相对重要性。请意识到技术正在快速演变，这应该被作为指南。\n\
  \n有一些机构和组织为特定目的提供大纲。美国警长协会发布了一份良好的实践指南（ACPO, 2012）。该指南包含四个原则：\n\n- `原则 1`：执法机构或其代理采取的任何行动都不应改变计算机或存储介质上的数据，这些数据随后可能在法庭上被引用。\n\
  - `原则 2`：在人员认为必要访问计算机或存储介质上的原始数据的情况下，该人员必须具备此项能力，并能够提供解释其行为相关性及影响的证据。\n- `原则 3`：应创建并保留应用于基于计算机电子证据的所有过程的审计轨迹或其他记录。独立的第三方应当能够检查这些过程并获得相同的结论。\n\
  - `原则 4`：负责调查的人员（案件官）对确保遵守法律和这些原则负有总责任。\n\n另一个提供取证指导的组织是美国国家标准与技术研究院（NIST）。他们在 [NIST.gov](http://NIST.gov)\
  \ 网站的特别出版物（Special Publications）领域创建了多份涉及数字取取的文档。\n\n这些指南为执行取证检查提供了许多有用信息和考量。指南往往落后于技术进步和取证实践，因此检查员感到自己有点像柯克船长并不常见，因为他们可能需要勇敢地前往无人涉的地方。\n\
  \n\n\n\n\n# 调查访谈方案\n\n在响应情况和开始调查时，访谈应该处于清单的首位。访谈对象可能包括了解案件的同事、嫌疑人或受害者。在许多案件中，律师也会参与，这为发现过程增加了另一个动态。通常，计算机或设备会被移交给调查人员，且没有明确的说明。人们认为调查人员可以神奇地弄出需要做的事情。在许多案件中，有人会“忘记”告知关键信息。\n\
  \n对于数字取证，访谈问题应该根据需要执行的调查类型来构建。考虑一下有用的关键词——电子邮件地址、姓名、地点、电话号码和其他。开发并维护一份潜在的访谈问题清单可以作为未来调查的模板。在响应现场之前，创建一个访谈问题清单是可能的，这样你就会有一个模板可以参考。访谈应该被记录并注明日期。访谈可能成为取证报告的一部分。\n\
  \n## 案件类型差异\n\n人们倾向于认为取证总是针对刑事案件。刑事和民事案件会有许多不同的场景，并可能有许多不同的访谈问题。案件类型在提问以及如何提问中起着至关重要的作用。记住，案件往往并非表面上看起来那样，可能会变得完全不同。访谈问题的清单起点可能像这样：\n\
  \n1. 你的名字是什么？\n2. 你的联系方式是什么？\n3. 与案件的关系/涉及多久？——是证人、嫌疑人还是受害者？\n4. 你认为谁可能参与了？\n5.\
  \ 你什么时候意识到这种情况的？\n6. 你对情况了解多少？\n7. 到目前为止你采取了哪些步骤（你碰过什么吗）？\n8. 你了解哪些电子设备、社交媒体、账户？\n\
  9. 考虑一下电子证物。联系人、社交媒体连接、短信、照片？\n10. 你发现了任何不常的情况吗？\n\n## 现场准备与授权\n\n带到现场处理的设备应该在清单上。如果你发现清单上缺少某样东西，将其加入清单以便下次使用。你不需要在每个现场都带上清单上的所有东西，但在响应案件之前检查清单是很好的准备。我喜欢把东西放在同一个地方并放在衣柜里，以便在部署时进行视觉检查。\n\
  \n在前往现场之前，确保你有授权。书面记录是首选的。如果你处于秘密行动中，告知当地执法部门可能是合理的。无论是与执法部门（`search warrant`）还是民事案件（`court\
  \ order`）相关，都要确保记录详尽，以便你可以带上手手册和笔记本。笔记本中可能有密码或其他信息，可以帮助处理困难案件。\n\n## 核心设备清单\n\n\
  响应情况下可能需要的物品通用清单如下：\n\n1. **响应式计算机**：装在 `Pelican®` 盒中的便携设备，可以在受到磕碰或暴露在元素中时保护它。确保已加载相关手册。\n\
  2. **加密狗（Dongles）**：你不想到达一个地点后却无法预览设备或激活软件。不要依赖互联网来验证取证软件，因为可能无法连接。\n3. **智能手机或其他具有互联网访问功能的设备**：取证计算机通常没有配备接入互联网，以免受到外部影响。智能手机或其他设备具有网络访问功能，你可以访问手册和供应商网站获取技术支持。有些\
  \ 12 岁的孩子可能做过一个 YouTube 视频，展示如何从你不熟悉的设备中取出硬盘。\n4. **镜像设备**：例如 `Voom Hardcopy®`、`Ninja\
  \ Forensic®` 和 `Tableau Forensic Imager®`。对于现场工作，`Ninja` 是我最喜欢的工具之一，因为不需要计算机即可操作。这类工具制作镜像比通过计算机或\
  \ USB 接口更快，并可用于其他目的，如强力介质和从损坏介质中恢复数据。\n5. **扩展线和电源插板**：我倾向于使用独立的扩展线和电源插板，因为如果你只需要插板，就不需要处理额外的电线。首次响应通常发生在压力巨大的环境中，因此将电线放在不会造成绊倒危险的地方。\n\
  6. **相机**：需要一台高分辨率数码相机。许多调查人员使用手机。记住，这样做可能会导致手机受到案件内的搜索（发现），因此使用个人手机可能不是一个好选择。对于某些情况，你可能需要一个小帐篷或遮光板来帮助处理光线反光——特别是对于手机和小设备。\n\
  7. **纸、笔、铅笔**：我高中在杂货店工作时，蔬菜经理告诉我你最好的朋友是铅笔。记下来。\n8. **标签和不褪性墨水笔（如 `Sharpie®`）**：你需要一种可以在大多数环境中书写且不会涂抹或擦除的东西。颜色编码可能很有帮助。我经常用胶带做标签。大力胶带不是好选择，因为它会留下胶水。\n\
  9. **带有联系列表的手机**：联系列表应包括在遇到困难、异常或耗时的情况下可以提供帮助的人。\n10. **食物和饮料**：你几乎从未读到这些，但数字取证可能非常耗时。叫外卖通常是不合适的或没有选择。\n\
  11. **抹布**：污垢可能是关键证据，要拍照。计算机和电缆可能会脏，你可能需要清理一下。\n12. **换洗衣物**：在桌子或其他地方爬可能会弄脏。我曾因为案件压力浸透了衬衫。在很多情况下，你会感激一套新衣服。\n\
  13. **乳胶（或类似的）检查手套**：有些东西是你不想触摸或可能留下指纹的。\n14. **紫外灯**：用于检测蛋白质。这是你可能想要检查手套的主要原因之一。\n\
  15. **工具箱**：应包括从眼镜用的微型螺丝刀到全尺寸的螺丝刀。至少应包括电胶带、大力胶带、绝缘扎带、刀片、钳子、螺丝和螺栓。带有梅花形头的螺丝刀——特别是\
  \ `#6` 和 `#8`——以及其他不规则的头部也方便。\n16. **急救包**：计算机内部可能锋利，所以确保急救包包含绷带。\n17. **网线、集线器、交叉线、IDE/SATA\
  \ 适配器以及 USB 转多接口适配器。**\n18. **启动盘**：这些应该包括 Helix、`Linen`、`Winen` 和 Windows 密码重置工具。\n\
  19. **空白光盘和 DVD**：这些虽然不常见，但值得保留在清单上。\n\n\n\n\n\n### 20. 接地机制\n这些工具通常随电脑工具箱提供。其目的是防止静电损坏组件。接地机制可以是防静手环或其他技术，以防止电击/电荷传输。\n\
  \n### 21. 写写保护器\n这些设备应包含 `USB`、`IDE`、`SATA` 和 `SCSI` 功能。携带超过一种类型，因为有时设备识别固件可能会不稳定，有备选方案会有帮助。我还有一个黄色的读写写保护器，如果你在现场需要即兴制作某些东西，它会很有用。\n\
  \n### 22. 目标硬盘\n它们在到达现场之前应该被擦除。大多数硬盘往往预装了各种实用程序和其他内容。完全擦除它们并使用适当的文件系统对其进行格式化，以便准备就绪。如果你使用镜像工具进行镜像，则可能不需要用文件系统格式化目标硬盘。千万不要扔掉新硬盘自带的塑料袋。在运输和存储目标硬盘及嫌疑硬盘时，使用它们进行静电保护。考虑点：容量、外硬盘、`ATA`、`SATA`、固态硬盘（Solid\
  \ State）以及笔记本电脑/台式电脑/服务器。\n\n### 23. 闪盘\n这些对于手机取证以及计算机的针对性取证非常方便。\n\n### 24. 用于\
  \ RAM 取证的闪盘\n你格式化闪盘时使用的文件系统可能会影响你可以从哪些类型的计算机进行提取。如果相关的源设备具有巨大的 RAM 容量，使用自供电外部 `USB`\
  \ 硬盘可能更实用。\n\n### 25. 移动设备设备\n这包括如 `Cellebrite` 或 `XRY` 等工具，以及法第袋和电池供电的涓流充电器。\n\n\
  ### 26. 头灯和手电筒\n我发现戴着头灯比手持手电筒方便得多，特别是当你在桌子下或夜间的情况下。\n\n### 27. 空背包、提包和其他携带设备\n确保你有一种方法来运输将获取的设备。\n\
  \n### 28. 胶带\n胶带有许多用途，包括作为标签。我喜欢美纹胶，因为它不会留下像胶带那样常见的粘性残留。\n\n### 29. 绳子\n更多用于即兴处理不可预见的情况。\n\
  \n### 30. 剪刀和剥线钳\n有时东西会被胶带或用电线固定在一起，你需要打破这种连接。\n\n### 31. 放大镜\n它有许多用途，包括读取硬盘上的序列号和组件上的标签。\n\
  \n### 32. 毛毯和垫子\n主要是为了在运输过程中保护设备，也可以在需要在地板上爬行时作为屏障。\n\n### 33. 固定带\n这些用于在运输时固定设备和组件。安全带也可能很有用。\n\
  \n### 34. 备用鼠标和键盘\n某些设备可能带有触摸界面，这可能证明很笨拙。\n\n### 35. 吸盘\n这些有多种用途，包括从 `iMac` 中取出硬硬盘。\n\
  \n### 36. 毛巾、肥皂、水和洗手手液\n并不总有洗手的地方——但通常是有需要的。\n\n当你到达现场时，你可能是现场唯一的人——至少是唯一具备必要技术技能的人。我曾与一位同事合作，他深受军用\
  \ `OODA` 循环的影响：观察（Observer）、调整（Orient）、决策（Decide）和行动（Act）。这意味着你需要观察情况、适应环境、决定行动方案，然后执行该方案。那位同事解释说，他读过一位经验丰富的法医调查员的文章，该人员表示在坐在可能包含数字证据的计算机键盘前时，他的第一个动作是把手放在手上。这迫使他进入\
  \ `OODA` 循环，并防止他做出不明智的行为。我将这种“手放在手上”的技术称为“吉姆·琼斯（Jim Jones）”法。\n\n湿实验室（生物）法医分析师不希望有人随意穿过犯罪现场或不分青红处理证据。这样做可能会导致潜在证据失效。同样，如果有人登录到数字设备并开始查阅设备上的日志或其他内容，他们可能会复杂或损害调查。再次强调，情况会影响行动循环。在刑事案件中，保护证据可能与设备所有者想要做的事相背离。在商务环境中，设备所有者可能是企业所有者，因此目的的共性可能更具一致性。但实现目标的方法可能会产生冲突。法医调查员可能想要关闭机器，而这样做可能会降低业务的运行能力。理解并传达此类调查决策点的影响是调查的关键方面。\n\
  \n记录现场是一项重要的考虑因素，因为它定义了环境并有助于解释调查中做出的考虑。记录可以通过图表、文字说明、照片和视频进行。就个人而言，我依赖于图表、文字和照片。视频的好处是它可以自记录，但在个人应对某种情况时，很难利用。当独自工作时，保持视频摄像头的存在、获得适当的分率并留在画面中是一个挑战。在这种情况下，大声说话可能被有用，以弥补视频方面的挑战。要有效利用视频，它需要是主要的焦点。如果现场有多个响应人员，即使是专门的视频摄影师也可能面临准确描述现场的挑战。\n\
  \n网上有许多来自政府来源（如美国“国土安全部”）提供的“装袋与标记（bag and tag）”清单。与其再创建一个清单，我将直接建议你参考这些来源。`URLs`\
  \ 往往会变化，所以 `Google` 是你的朋友。清单上没有提到的是一些外围物品，例如清单。对你带到现场的所有物品和从现场取走的所有物品进行清单。为每个物品贴上带编号的标签比在纸上列出硬盘要有帮助。相反，使用序列号和来源地等信息进行拆分，并与现场拍摄的照片编号匹配。在响应期间，最重要的决策之一是如何处理处理现场系统。这适用于移动设备、计算机和其他组件。现场内存（通常称为物理内存或\
  \ `RAM`）可能包含密码、IP 地址、活动进程、云连接以及对调查非常有用的其他内容。加密卷在挂载到现场系统时可能处于未加密状态，从而可以访问原本加密的数据。如果加密卷密码未知且设备关机，这种能力将会丢失。\n\
  \n可以使用多种工具捕获现场内存。一种方法是将内存获取工具加载到 `USB` 设备上。对于个人计算机，获取现场内存的副本只需将 `USB` 驱动器插入计算机，调出命令行，并在\
  \ `USB` 驱动器上运行一个小程序，将 `RAM` 的内容复制到 `USB` 设备中。这会修改一小部分 `RAM`，但大部分保持完好。现在的计算机配备大量的\
  \ `RAM`，因此 `USB` 设备应该具有较大的容量。\n\n\n\n\n\n在企业环境中对运行中的系统进行响应可能面临更大的挑战。出于安全考虑，服务器可能会禁用\
  \ USB。这意味着，如果你需要像上文所述那样使用 USB 设备获取 RAM 镜像，在不更改配置设置以允许 USB 的情况下，这样做是不可行的。这样做会改变计算机的状态，包括\
  \ RAM 中的部分内容。它还可能需要重启，这会完全违背其初衷。此外，计算机上的 RAM 容量可能有几个 GB 大，因此 USB 设备需要足够的空间。\n\n\
  使用 Helix 和商业取证工具是获取 RAM 的常用技术。挑战在于获取内存镜像后如何处理它，因为它是以未格式化的状态被捕获的。几家供应商提供了足迹极小的内存抓取工具，这意味着它对驻留在\
  \ RAM 中的内容影响非常微小。请记住，在使用内存分析工具进行分析之前，RAM 看起来只是一团杂乱无章的数据。\n\n在企业环境中可能发生的另一种情况是虚拟化。服务器可能被配置为运行多个虚拟机的宿主机。调查目标可能是其中一台虚拟机。获取\
  \ RAM 内容的副本可能很困难，而且如果宿主机运行的操作系统与虚拟机不同，可能会更加复杂。一种方案可能是对虚拟机拍摄快照，将其复制到外部设备，在实验室中恢复，然后对\
  \ RAM 拍摄快照。\n\n移动设备通常需要处于运行状态（live）才能进行取证检查。这些设备通常采用某种形式的密码/访问码/生物识别保护，如果多次输入错误的访问信息，可能会发生设备重置为原始状态。因此，如果移动设备在接收时处于运行状态，那么保持其运行状态可能是有益的。尽管这并不是一个板钉钉的决定，因为远程擦除移动设备（特别是智能手机等设备）是一个相当简单的过程，从而使设备对调查毫无用。将设备开启飞行模式并关闭网络和蓝牙访问可能防止远程擦除，但可能导致意外之外的后果，例如丢失与云端连接或应用程序注销。使用法拉第设备也会引入类似的挑战。\n\
  \n## 响应案件\n\n调查员面临的挑战之一是，他们接受了培训并学习了如何执行各种任务，但这些任务通常是教育背景下经过严格编写的独立任务。培训课程倾向于关注某个特定任务，然后可能会跟进练习。接着会有更多任务或练习循环，直到午餐时间或回家时间。虽然这在学习如何使用取证工具执行特定任务方面可能有用，但在学习如何进行取证检查方面的用处并不大。取证人员应该为每个案件制定调查计划，这与学习如何使用取证工具执行特定任务不是一回事。`第\
  \ 3 章` 涵盖了安全计划和调查计划的制定。\n\n其他培训环境可能以讲座为主。在短时间内未使用的培训会被很快遗忘。似乎大多数培训在一个月后就会被遗忘，因此如果调查员的第一个案件在培训后不久没有发生，他们执行调查的能力可能会受到限制。希望有其他调查员可以帮助初始调查。\n\
  \n当调查员在完成培训后面对第一个案件时，他们可能会发现自己处于不知道从何处开始或采用什么技术的情况下，因为他们没有学习过如何制定调查计划。本节的目的是概述常见的响应方法论，并引入创建调查和安全计划的概念。请记住，案件及其需求会有很大差异，因此这是一份指南——而不是真理。变量包括它是刑事、民事、企业还是其他类型的案件。其他变量包括将使用的工具类型、将检查的设备类型、可检查的时间以及预算。我用于响应计算机事件的标准工具集是\
  \ `Magnet Axiom`、`EnCase Forensic Edition`、`FTK Imager`、`Tableau Write Blockers`、`Ninja\
  \ Forensic Imager`、经过取证擦除的目标存储媒体，以及本章前面提到的响应清单中的工具和物品。如果我在成像过程中使用 `Ninja Forensic\
  \ Imager`，我倾向于利用 `internal drives`（接收镜像的驱动器），因为我通常可以直接连接它们，从而更快成像。对于实际的调查过程，我倾向于将证据和案件信息存储在自供电\
  \ `USB external drive` 或云端。自供电的 `USB external drive` 非常用，因为它提供了一个可以通过 `USB` 轻松访问的自包含环境，而且它们通常比内部硬盘更耐用。内部硬盘并不是为了频繁连接和断开设计的，而那是外部硬盘的设计特性。此外，外部硬盘很容易在箱子里存储和存档，因为它们占的空间较小。所有案件信息的备份副本应存储在单独驱动器上或以冗余方式存储云端。云环境应经过妥善的安全和管理，以确保监管链和访问得到适当处理。请注意，在现场成像响应情况下，可能无法访问云端，或者连接速度可能并不实际。\n\
  \n在响应案件时，有许多特定于场景的情况需要考虑。首先，最重要的是确保你的安全。我有一次在企业环境中执行过一次涉及民事案件的“黑袋作业”（非工作时间抓取）。当我获取证据时，被调查人员出现在了现场，尽管已经有了保护令。该个人离开得还算和平，但在\
  \ 10 分钟后又出现了。这特别令人压力巨大，因为经常听过有人离开现场并在不久后带着武器重新出现。幸运的是，并没有武器，但压力水平很高。\n\n事件响应本身应该经过计划，应急预案应该是计划的一部分。`图\
  \ 2.2` 包含一个指导计算机响应和检查过程的指南。对于我们而言，响应计划是指响应现场和/或获取进行调查所需的设备和证据。调查计划在 `第 3 章` 中涵盖，涉及在获得设备和证据后如何进行调查。响应和调查中都很重要的安全考虑也将在\
  \ `第 3 章` 中涵盖。\n\n\n\n\n可能无法预知嫌疑设备的配置或容量，因此请准备好方案、多个经过取证准备的存储设备以及连接选项。有时目标硬盘可能会故障，因此准备备用硬盘很好。响应可能涉及对多个设备进行镜像，因此要考虑顺序，并在必要时规划同时镜像多台计算机的方法。我目前用于计算机和硬盘存储的指标是每小时能够镜像约\
  \ 100 GB 数据。可以据此推估出目标硬盘镜像过程所需的时间。使用最快的连接和硬盘速度可以缩短镜像时间。压缩的使用也会影响镜像时间。移动设备可能有特定的考虑因素，这些将在第\
  \ 6 章中进行详细介绍。\n\n一旦制定并授权了响应计划，响应人员到达现场后应封现场。在企业环境中，这可能意味着让安保人员阻止进入。在执法环境中，这可能涉及与其他类型的调查人员协调。底线是，如果有人没有帮助，他们就不应该呆在那里。对现场进行绘图和拍照。照片应从多个角度拍摄，并尝试拍摄显示所有设备如何连接到计算机的照片。如果你要带走计算机，请标记电缆和其他设备，以便它们能与计算机相匹配。这在查收多台计算机时尤为重要。在清单表上登记所有设备的序列号和标签。图\
  \ 2.3 是清单表的示例。固定设备以备运输，并将其带回实验室。寻找闪存驱动、打印机和其他外设备，包括说明书、CD 和 DVD。运输过程中要考虑环境，因为你不希望设备暴露在极端温度下。如果发生温度剧变，请让设备达到室温后再通电。\n\
  \n![图 2.3 计算机取证检查表。](img/file4.jpg)\n\n**图 2.3** 计算机取证检查表。\n\n调查人员可能会面临许多场景。企业环境的处理方式可能与典型的执法环境不同。单台计算机涉及的后勤规划没有多台计算机那么多。还有服务器、环境和配置方面的考虑因素。我们将处理的场景是一个单台计算机案例，假设将对嫌疑硬盘进行镜像，然后进行调查。某些取证工具（如\
  \ `EnCase`）具有预编程脚本，可以针对证据文件运行以“自动”处理调查的许多方面。很大程度上，本节介绍的是调查概念，而不是工具如何处理取证分析的特定方面。\n\
  \n根据情况和案件要求，调查人员可能会预览设备以确定是否有必要镜像。镜像意味着对设备上的信息制作可验证的位位（bit-for-bit）复制。预览意味着在镜像证据之前，以取证状态审查潜在证据。如果计算机已开机，请获取\
  \ `RAM` 的镜像，因为 `RAM` 中可能包含密码、机器人和病毒等信息，这些信息对调查有所帮助。考虑开机计算机的另一个方面是，它可能连接到云应用程序或其他活跃的网络连接，提供了访问证据的，而这些证据在计算机关机后可能无法访问。决策点是确定计算机上存在保护或破坏性机制的可能性。如果概率很高，应制定如何镜像计算机的应急预案。如果概率较低，则关闭机器电源，断开并镜像硬盘，将其连接到写保护器和调查机上，并开始镜像过程。某些取证工具包含软件写保护器，在这种情况下，就不需要物理写保护器了。可以使用专门的镜像工具来代替写保护器和调查机。这两种技术在第\
  \ 3 章中均有说明。\n\n嫌疑计算机与镜像之间的哈希值匹配并记录至关重要。哈希值通常表示为 `MD5` 和 `SHA-1` 值。哈希的使用在第 4 章中有详细解释。良好的做法是拍摄嫌疑硬盘标签的照片作为记录调查的一种。序列号、存储容量或扇区计数以及配置是需要记录的内容。应启动嫌疑计算机并检查\
  \ `BIOS` 的时钟和系统设置。确定计算机上事件发生的时间对于许多案件是核心，这可以是关键证据之一。在企业环境中，计算机时钟可能由中央管理，因此也应该进行记录。计算机上文件的修改、访问、创建和删除时间有助于重建事件和活动。确保这些时间准确可以追溯到嫌疑计算机的\
  \ `BIOS` 时间和时区设置。调查人员需要一种可以显示此类信息并允许基于这些时间进行排序和分析的取证工具。\n\n一旦开始实际调查，确保所有扇区都是可见的。这可能需要恢复删除的分区并定位隐藏的分区。之后的步骤可能取决于特定案件，不一定非要遵循我们将要涵盖的精确顺序，但如果调查人员倾向于遵循类似的顺序，出错的概率就会降低。获取硬盘上所有文件的哈希值允许根据哈希值而非文件名或扩展名进行搜索和过滤。例如，所有的\
  \ Windows OS 文件无论位于哪台计算机上都具有一致的哈希值。通过获取嫌疑硬盘上的哈希值并与 Windows 哈希文件进行比较，所有匹配的文件都可以认为是相同的，并从调查中过滤掉。同样，如果感兴趣的文件有哈希值，可以将这些值与嫌疑硬盘上的哈希值进行比较，过滤掉所有不匹配的内容。这是儿童剥案件中的常用程序。\n\
  \n下一步是进行上网历史搜索，这可能涉及几个方面，包括确定个人访问过的网站以及使用计算机进行的搜索类型。在 Windows 环境中，注册表可能包含访问网站的信息，包括访问频率，以及是通过点击超链接还是在浏览器地址栏中输入\
  \ `URL` 访问的。输入 `URL` 可以证明访问特定网站的意图，但需要考虑终端用户的拼写错误。如果一个网站被访问多次，其访问意图比访问一或两次要强得多。\n\
  \n\n\n\n\n未分配的磁盘空间通常包含在基于浏览器的中输入的搜索词。这可以支持对先验知识或预谋意图的辩论。`GREP`（正式名称为全局正则表达式打印）关键词搜索是确定搜索内容最常见的方法之一。不同的搜索引擎会留下不同的痕迹，因此开发能够识别这些特征的搜索关键词至关重要。开发各种搜索引擎关键词的一种方法是在这些搜索引擎中进行几次搜索，并查看地址栏中的搜索结果。该技术在第\
  \ 4 章中有更详细的描述。\n\n电子邮件搜索也是一个频繁的调查步骤。某些电子邮件系统会将邮件消息下载到个人工作站。许多基于互联网和云的电子邮件系统也可以这样配置。这在调查期间可以提供丰富的信息源，因为可能能够恢复电子邮件的完整版本。像\
  \ `Yahoo!` 和 `Gmail` 等电子邮件系统为其免费服务提供了较大的磁盘空间分配，因此许多用户发现，将电子邮件保留在提供商环境中而不下载到个人工作站更具吸引力。然而，仅仅在浏览器中查看网页版邮件通常会在未分配的磁盘中留下可检索的邮件碎片。我曾从未分配的磁盘空间中恢复过\
  \ 5 年前的网页版电子邮件系统的邮件消息副本。\n\n搜索关键词是调查中的另一个逻辑步骤。根据所使用的取证工具，可以在计算文件哈希值、分析文件签名以及搜索电子邮件的同时进行关键词搜索。然而，这可能会消耗大量的资源和时间，因此建议独立地完成这些每项工作。关键词可以通过许多方式构建，包括纯文本和使用\
  \ `GREP`。构建关键词和执行关键词搜索是一门艺术形式，因为如果关键词过于严格，可能会遗漏内容；而如果关键词过于模糊，搜索命中结果可能太多，以至于难以找到调查人员想要寻找的内容。例如，如果有人正在搜索“botnets”（僵尸网络）并构建了搜索为仅查找“botnets”，那么匹配\
  \ `botnet` 或 `bots` 将不会发生。但如果对“bot”进行搜索，那么 `bots`、`botnet` 和 `botnets` 都会被命中。然而，任何包含\
  \ `bot` 的单词也会被命中，包括 `both` 和 `bottom` 等词。这就是构建 `GREP` 关键词变得派上用场的地方，因为可以构建一个以“bot”开头但后面仅跟“net”或“s”的关键词（注意“s”后面的空格——空格在关键词的有效性方面起着关键作用）。\n\
  \n关键词的选择应该考虑到正在处理的案件类型。社交媒体网站可能会留下有助于重建社交媒体使用的特定痕迹。在线游戏活动有其独特的独特痕迹和相关关键词。同样，`eBay`、`craigslist`\
  \ 和 `PayPal` 可能是需要进行关键词搜索的领域。围绕特定的使用类型构建调查背景，会让关键词的产生变得容易得多。\n\n在儿童剥削案件中，对计算机上的图形文件进行审查是调查的一个关键方面。由于嫌疑人经常尝试删除证据，在进行搜索之前，应恢复所有已删除的图形和视频文件。实现此点的方法之一是对磁盘未分配空间中的图形文件文件头执行\
  \ `GREP` 搜索。恢复文件后，可以通过取证工具查看这些图形文件。或者，可以为嫌疑人磁盘上的所有图形文件计算哈希值。这些值可以通过程序化的方式与已确认的儿童剥削图形文件文件的哈希值进行比较。已知的儿童剥削文件的哈希值由联邦机构和执法部门严密掌握，通常无法在这些圈之外使用。如果执法部门以外的调查人员怀疑他们正在审查的设备上存在儿童剥削材料，他们应该停止调查，不要制作副本，并将可疑设备移交执法部门。\n\
  \n聊天日志和即时通讯系统的痕迹可以为调查提供见解，搜索计算机用户可能感兴趣的游戏系统也是如此。搜索如 `Facebook` 和 `Twitter` 等社交网络网站以及共享文件的点对点系统也是调查中考虑的常见元素。大多数计算机还有日志文件，可以提供有关计算机如何使用和维护的详细信息。如果取证调查是为了响应安全漏洞（如黑客攻击），日志文件是首要审查的内容之一。Windows\
  \ 机器上包含指向最近查看文件链接的回收站和“最近”等文件夹是其他常见的审查区域，链接文件本身也是如此。打印文件和“发送到（Send To）”文件可以完善初步调查。\n\
  \n调查完成后，必须编写报告并对案件进行存档。编写报告可能非常耗时，但这种投入是值得的，因为这是证据的呈现，以及对发现内容的陈述。写报告本身是一门艺术，不应被忽视。由取证工具生成的报告通常是不完整或缺失的。应该包括关于调查如何进行、参与者、现场照片和图表，以及报告的总体概述、摘要或总结。报告可能很容易超过\
  \ 100 页，因此摘要或总结变得更加重要。随着调查的进展，取证报告可能需要更新。这是许多原因之一，报告的命名和版本控制需要包含允许更新的机制，同时减少关于哪份报告副本是最新困惑。\n\
  \n案件文件、报告以及可能的取证工具副本应该存档并存储在安全环境中。存档所用取证工具的一个原因是，在案件进入审判或完成之前，工具可能会出新版本，如果案件必须审查，能够获得与调查期间使用的相同的工具是非常重要的。\n\
  \n## 结论](#C02a_toc.xhtml#rsecc002_4)\n\n确定计算机取证检查中合适和必要的内容有很多变量。某些案件非常有针对性，因此之前描述的所有步骤并不必要。相反，某些案件涉及更多的调查。开发资源库应该是每个调查人员的目标。这种资源库包括一个可以协助调查的人脉，无论这种协助是处理设备、提供建议还是提供心理支持。资源库还涉及补充工具和技术、教育和研究能力。正如我提到的，本章的目的是帮助调查人员理解在调查中执行的许多重要步骤。正如俗话所，实际里程和情况可能有所不同。\n\
  \n## 参考文献](#C02a_toc.xhtml#rreferences-1)\n\n1. ACPO. (2012). ACPO Good Practice\
