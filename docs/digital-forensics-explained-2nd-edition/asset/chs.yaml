  \n（注：原文中存在大量重复段落，此处根据要求已进行去重处理，确保不重复输出。）\n\n## 司法取证工具\n\n在收集信息并达成一般共识后，调查员通常会与受害者会面……（此处重复段落已略，直接进入工具部分）\n\
  \n对于分析证据，有很多工具。对于本案，我们将重点关注使用的主要工具。在成像证据后，`AccessData’s FTK` 软件被用于分析图像。`Katana’s\
  \ Lantern` 软件被用于分析多伊的 iPhone。再次，有其他工具，但这些是本案中使用的。在进行检查之前，必须对嫌疑人的原始存储设备进行位位镜像，并使用数字指纹\
  \ `hash` 进行验证。这是在每个检查的硬盘上都要做的。\n\n检查从从存储设备中刻取所有图像文件开始。此时有 90,000 个，检查员必须筛选所有这些图像以找到可能描绘受害者或其他形式儿童色情的图像。在本案中，定位了\
  \ 500 张图像，描绘了从儿童裸体姿势到儿童与成年男性进行性行为的画面。进一步检查存储设备产生了受害者在淋里的裸体图像，这些是用多伊的 iPhone 拍摄的。数字检查员将随后检查图片数据以验证它们是用嫌疑人的\
  \ iPhone 拍摄的，通过向母亲展示照片来确定受害身份，并利用照片中的经纬度信息将其输入 `Google Earth` 中，以证明照片拍摄的位置，这显示了家庭的位置。\n\
  \n\n\n\n与调查中的采访阶段一样，对数字媒体的分析必须保持耐心和仔细，才能为案件的检察官和首席调查员提供一份最具证据价值、最详尽的报告。任何不符合此要求的行为对案件受害者、涉案人员、检察官以及社区都是一种不公。\n\
  \n## 检控与证言\n\n在证据提交给检察官后，案件将经过法院程序和流程。我询问了本案的检察官，她在决定此类审判的策略时会考虑哪些因素。在这样的案件中，她的主要关注点在于儿童受害者对其父亲的证词，以及数字取证调查员的证词是否能让陪审员听懂。电子证据的审查是一门相对较新的科学，对于普通人来说可能不仅听起来像天书，他们还可能失去兴趣，走神到陪审团席外等待着他们自己的世界和问题中。如果发生这种情况，案件在此之前发生了什么就不重要了；他们可能会漏掉要点，而这可能就是辩方提出“合理怀疑”以获得无罪所需的全部。\n\
  \n幸运的是，在本案中，检察官表示本案受害者非常坚强，并且清楚需要做什么。她得到了母亲和姐姐的支持，她的证词不会成为问题。在审判之前，与检察官进行了多次会议，反复审查报告，对证言进行准备，并准备好所有所需的证据并交给检察官供审判使用。我们这些取证领域的人认为，当涉及到计算机的内部运作和电子证据的存储位置时，大多数人都能理解。然而，事实并非如此。首席调查员决定制作一份\
  \ PowerPoint 演示稿，向陪审员简要解释证据的来源，以及他在解释证据时将使用的某些术的定义。根据检察官的说法，这是一个极佳的主意，对案件非常有帮助。陪审员在听到问题形式的询问之前，学习了更多关于电子证据含义的内容，他们似乎理解了并付了更多关注。\n\
  \n在作证时，知道你正在对谁说话也很重要。律师在提问，但证人并不是在试图说服他们，而是试图说服陪审团。我见过有些警员在作证时一次也没有看过陪审团。如果你不能面对陪审团并向他们解释你想表达的内容，他们又如何对受审人员的有罪否做出明智的判断呢？记住要专注听题，转过身体面对整个陪审团而不仅仅是某一个人，这会让他们感到参与了程序中，并更好地理解你所说的，而不是走神。\n\
  \n在本案中，考虑到所有的电子证据，向陪审员缓慢且平实地陈述是非常重要的。是的，PowerPoint 有助于建立一些知识，但你越是冷静、简单地依赖这些信息，这些信息就越能深入人心。辩护律师的任务是在调查员的案件中提出合理怀疑，他们会不择手段地做到这一点。Doe\
  \ 的律师会试图通过技术术语和“万一……”假设来消解对电子证据发现过程的直白描述，以此混淆陪审团，甚至挑战挑战网站在用户点击缩略图后重定向的方式。但这并不是辩护律师要做的工作。\n\
  \n## 需要考虑的因素\n\n在本案中，考虑到所有的电子证据，向陪审员缓慢且平实地陈述是非常重要的。是的，PowerPoint 有助于建立一些知识，但你越是冷静、简单地依赖这些信息，这些信息就越能深入人心。辩护律师的任务是在调查员的案件中提出合理怀疑，他们会不择手段地做到这一点。Doe\
  \ 的律师会试图通过技术术语和“万一……”假设来消解对电子证据发现过程的直白描述，以此混淆陪审团，甚至挑战网站在用户点击缩略图后重定向的方式。但这并不是辩护律师要做的工作。\n\
  \n\n\n\n从查收到判刑的这段时间视具体情况而异，但证据链必须始终保持完整。根据律师所提交的动议，某些案件可能会持续数月，而某些案件可能在 45 天内完成，但证据链条绝不能断裂。一旦发生断裂，该部分证据就可能变得不可采信，并可能摧毁整个案件。\n\
  \n在案件结束后以及上诉期间，证据将以相同的方式保留，直到上诉被审理并做出裁决，届时可以根据机构的查收令对其进行销毁或出售。总之，请妥善照顾你的设备、你的证据以及你维护安全设施的方式。这不仅反映了你个人或你的调查，还会反映了你的机构以及所开展的调查。\n\
  \n## 结论\n\n从投诉的产生，到事实调查、证据收集、出庭证明和起诉，调查员是否成功完全取决于该调查员。如果调查员走捷径、在进行调查时没有表现出谨慎的尽职，或简单地不遵守证据规则，结果可能是灾难性的。耐心、愿意倾听以及对细节的关注将通向成功之路。\n\
  \n在 Doe 案的调查以及最终由于他因对其女儿实施性侵和持有儿童色情物而被成功起诉，在我看来，我观察到的那些调查员是他们机构内卓越的典范，在调查过程中表现出了耐心和专业知识。他们没有放过任何细节，显示出他们不仅关注尽力完成工作，还关注为受害者及其家庭争取正义。如果从这一章中可以汲取什么，那应该是耐心以及从观察中学习的意愿，这将使你成为一名更好的调查员。\n\
  \n在 Doe 被判定有罪并判处 25 年监后，他的另一个孩子站了出来，通过向当局承认 Doe 也曾对她进行性侵害，从而开始了康复过程。Doe 是一个儿童性掠夺者，他不仅在互联网上寻求儿童色情物，还猎捕自己的孩子。多亏本案中的调查员，他无法再这样做了，一个家庭可以尝试开始新的生活。\n\
  \n# 第 8 章 报告撰写与演示\n\n## 引言\n\n报告撰写和结果演示本身就是门艺术。调查员可以从调查对象以及发生的事情中学到很多知识。然而，如果将所学信息记录在报告中，大部分内容将会丢失。记录调查笔记可以用于解释报告中的内容及其得出结论的过程，以及关于调查的背景信息。调查员需要权衡的平衡点在于报告中应放入多少信息。信息过多，细节往往容易被忽视；如果信息太少，报告则显得不完整。\n\
  \n许多取证工具可以根据调查员在办案期间制作的书签和注释生成报告。通常有多种格式类型可供选择，例如 `rtf`、`pdf`、超链接文档或网页。问题在于，取证工具中的报告功能通常无法易于整合来自其他工具或来源的信息。我的倾向是生成一个\
  \ `rtf` 或类似格式的报告，将其导入到 `Microsoft Word` 等工具中，并进行“美化”。某些取证工具生成的报告并不易于在 `Word` 中导入或修改，例如，从\
  \ `Cellebrite` 生成的报告。\n\n## 报告内容与考虑因素\n\n至少，报告应包含首页、目录、授权书/聘用函/调查原因、调查员签名页、摘要/概要概述、取检员意见和证据。大多数取证报告并没有提供让调查员生成此类报告的功能集，这就是为什么通常需要将报告中需要包含的各种产物导入到一个位置。\n\
  \n大多数时候，调查员不会整合他们的报告。他们会为每个工具和或每个每种产物生成独立的报告。这种做法的挑战在于，它让读者自行在不同的文档之间建立联系。很多时候，设备连接到取证工具后，内容直接导出到报告中，变成了缺乏或没有验证的调查。这在科学研究环境中是不合格的，但在执法环境中却是屡见常态。\n\
  \n报告首页应包含标题、案件名称以及案件号或法院案号。此外，关于报告人的信息也应是首页的一部分。这包括调查员的名字和职称、所属机构、任何执照或其他描述调查员资质的信息，以及报告创建日期。在某些州，进行数字取证调查需要专业调查员或执法人员的执照。\n\
  \n目录可以提供报告中所有章节和子章节的位置。对于摘要报告或案件简报，可能不需要目录。一个经验法是，当报告长度接近十页时，开始使用目录。\n\n在民事案件或其他其他形式请求调查的情况下，我总是要求提供一份聘用函，包含对调查的授权以及所请求内容的概述。法院命令通常是民事案件的一部分。这与刑事案件有所不同，后者可能包含搜查令。由于我是一名专业调查员而非执法人员，当接到执法部门帮助请求时，我会要求提供书面的“协助请求”，并通常在报告中使用其来替代聘用函。\n\
  \n大多数取证报告是由非技术读者阅读的，编写报告的人需要记住这一点。长报告可能需要摘要。调查员的意见是报告大放异彩或平庸无奇。首先，应该报告事实，如果调查员发现了与案件可能相关的线索，必须记录下来。同样，如果调查员寻找了某物但没有找到，这也是一种发现，应该记录下来。我所表达的精神是，未发现某物可能会完全改变对某人是否有罪的认知。未能报告未发现某物会导致报告产生偏见，而带有偏见的报告是不符合伦理的，不利于正义。遗憾的是，这种情况非常常见。\n\
  \n\n\n\n报告的受众是非技术人员，这一点可能需要作为报告流程的一部分予以考虑。有时，需要提供一份术语表和或一份关于计算机技术某些方面的简短技术入门指南，以便能够正确地理解报告。术语表通常包含在报告中，而技术入门指南通常是独立的文档，或者在报告演示之前以口头简报的形式呈现。\n\
  \n调查员使用的工具集也应该记录在案。顺便说明一下，调查员应该对所用工具的使用经过培训并具备经验。由于工具更新频繁，只要工具是先前培训和经验的逻辑演进，要求检查员接受所有用过的版本和工具的培训是不切实际的。把这比作看牙医：你期望医生受过培训并胜任，但你并不期望他们每次得到新的钻头时都要上一次课。我之所以提到这一点，是因为我了解到有些执法机构在进行数字取证检查时，其调查员在数字取证方面几乎或完全没有培训，在某些情况下，甚至没有计算机技术的正式教育。尽管为期一周的取证课程经常被吹成合格，但它并不能让某人成为专家，特别是当他们没有其他实质性的计算机培训时。\n\
  \n检查结果应汇总在报告的检查员意见部分。在调查过程中进行关键词搜索时，可能会有数千条搜索命中结果。检查员通常会对这些命中结果进行筛选，并标记具有代表性的样本包含在报告中。书签的数量可以是几百或几千个，这可能导致报告变得非常长。如果没有技术背景，大多数人会迷失在细节中。\n\
  \n书签和证据应该在报告中按逻辑排列，并分为若干章节。章节可能包括：计算机配置信息、电子邮件、图形、在嫌疑人计算机上进行的搜索引擎搜索等。在报告的检查员意见部分，每个章节都应该有一个简短的概述，然后引用每个章节中感兴趣的第一项。这可以是文档中的页码和/或超链接。\n\
  \n证据是在调查涉及的设备上发现的内容。正如刚才提到的，这些内容应该按逻辑顺序排序并按类别排列。这通常从记录设备的信息开始，例如序列号、配置信息和设备照片。照片可能是设备被扣押现场的照片——包含多个角度，以便记录电缆连接和状态信息。也可以包含位置图，以及扣押过程的总结。确保强调源文件哈希值和图像哈希值匹配，并且图像哈希值是在报告结束时提取的且也是匹配的。如果发现证据的方法（例如\
  \ `sector math`）和发现所在位置与案件有关，则也可能需要包含进去。例如，隐藏在备用数据流（Alternate Data Stream）中、使用加密、压缩包或修改了扩展名的文件可以显示意图，而在未分配空间中发现文件可能具有完全不同的含义和解释。\n\
  \n一些检查员认为报告中也应该包含结论。对于这一点我持保留意见，部分原因在于语义问题。我将概述几个问题，你可以得出你自己的“结论”。报告不包含偏见或推测是至关重要的。得出结论可能会同时夹杂这两者。检查员的工作是发现事实，而解释在调查过程中如何以及为什么能发现这些东西则是辩护律师或检察官的责任了。与此相反，结论可以仅仅是：`user-id\
  \ ABC` 在特定日期从 `[www.website.com]` 下载了文件 `DEF`。结论也可以是：计算机上发现了 5000 张非法图像。然而，要证明在问题时间内使用\
  \ `user id ABC` 的 `BadGuy` 坐在键盘前可能是困难的。可以帮助此事的因素包括发现在相似时间对 `BadGuy` 的 Facebook 和电子邮件账户的登录记录，甚至更好的是发现使用\
  \ `BadGuy` 账户创建的 Facebook 帖子和电子邮件。辩护律师只需要反驳一个结论就可以开始进入合理怀疑的领域，因此在得出结论时要非常小心。\n\n\
  ## 示例报告\n\n后面附有几个示例报告，包括一份计算机取证检查的总结报告、一份来自 `MSAD XRY` 的移动设备报告，以及来自 `Cellebrite`\
  \ 的手机检查部分内容。在我们查看报告之前，我想指出应该考虑分发方法。检查员应该向检察官和/或法官咨询关于包含色情内容的报告的指南，因为将设备上发现的图像复制到报告中在技术上可能被解释为分发。再次，要求指南以书面形式给出。\n\
  \n另一个考虑因素是报告报告的媒介或方式。出于多种原因，我不喜欢电子邮件分发，包括报告篡改和未经授权的访问。转发报告并不困难。这可能是一个安全问题。我通常倾向于使用一次写入的介质，如\
  \ `DVD` 或 `CD-ROM`。多花 50 分钱使用 `LightScribe^®` 光刻盘，而不是用 `Sharpie` 笔在盘上书写或使用贴纸标签。这是你对报告留下第一印象的机会，而你只有一次第一印象。第二印象也很重要——确保它的组织方式与之前描述的类似。我有过律师发给我来自“对方”的报告让我解读，因为检查员仅仅使用了取证工具中的报告生成功能，而没有花时间在报告正文中组织和解释发现的结果。\n\
  \n我在报告所在的 `DVD` 上附带了一个 `ReadMe.txt` 文件。以下是 `ReadMe` 中的测试用例：\n\n> 本磁盘中包含的媒体仅用于 Pleasantville\
  \ 法院案件 13-2399-DD。未获得授权参与此案的人员不应审阅此盘。请将其还给 Mirean Law Office,Plankton,MI 49444。\n\
  \n以下是一份计算机取证报告示例。请注意，为了节省空间，我尝试使报告尽可能简短，许多伪迹只是部分表示。考虑到这一点，某些展示内容是以纯文本形式的，而不是重建的网页。\n\
  \n虽然报告可以长得多，但这些应该足够让你对报告有一个大致的感觉。在存在视频和音频文件的情况下，我的倾向是在 `DVD` 上创建一个目录并将文件导出到该目录中。然后我会在检查员意见部分引用包含视频和音频文件的目录。\n\
  \n以下是一封我经常随移动报告一起使用的示例附信。\n\n\n\n\n\n在展示结果时，有几点基本事项需要记住，无论是在公司会议、质证还是法庭环境中。第一是坚持事实并陈述你知道的。当被要求提供推测或意见时，务必非常小心。律师倾向于总结情况并询问你该陈述是否准确和/或是否是你认同的。通常情况下，使用你自己的话更好，因为律师在向你提问时可能已经有了某种想法，他们可能会引导你进入一个你不想去的陷阱。等你回过神来，你就处于一个难以摆脱的境地，而你的工作可能会失去信誉。“不信任任何人”可能听起来有些严酷，但这可能是最好的起点。\n\
  \n关于质证的法律各不相同，因此在提供证言之前，了解相关环境至关重要。这是一份法律记录，所以准确性至关重要。某些州允许你审阅证词笔录，以确保记录准确。允许此类审阅的时间以及你何时可以要求审阅，都是你在提供证言之前需要明确的。考虑在质证开始时表示你希望在提交之前进行审阅。我审阅过自己的一份证言，发现我被归于了一句实际上是对方律师说的评论。幸运的是我在审阅中发现了这一点，因为如果不纠正不准确的归属，该陈述将完全改变我证词的性质。\n\
  \n质证可以在任何地点进行。我曾在图书馆和律师事务所等地方接受过质证。在质证期间，对于任何你不理解或看起来模糊的问题，要求解释是良好的做法。确保你感到很舒服。不要害怕要求休息或其他舒适措施，特别是当过程可能很长时。带笔记本并做笔记是可以的，现场可能还会有其他人作为证人。此外还会有一名法庭记录员记录整个过程。\n\
  \n质证记录了所说的内容，但它们对于理解事情是如何表达的或肢体语言没有帮助。然而，肢体语言和表达方式在法庭诉讼或企业环境中是重要的。眼神交流、自信的姿态和良好的形象都是重要因素。未曾言说的因素可能是你证词中最重要的方面。\n\
  \n作证可能是一种奇怪的经历。要意识到律师只会问他们自己有答案或理论的问题，因此准备工作应该包括对各种情况的准备。另一个需要记住的是，你可能只了解案件的一小部分，当你到达法庭时，你会发现自己所处的环境与你想象的完全不同。由于案件的现实与你预期的大不相同，怀疑自己为什么会出现在那里也不为过分。如果案件涉及陪审团，那么在回答时将注意力转向他们。尽可能与许多人进行眼神交流。\n\
  \n当被要求作证时，你可能会被问几个与案件核心主题几乎没有关系的问题。每个案件都可能涉及对你专业知识的挑战以及试图诋毁你的信誉。有时，对方律师可能会通过进入一段无聊的未知领域的冒险来试图模糊你的证词，以此让陪审团昏睡或将细节埋没在杂丛中。通常，法庭诉讼是一个你被提问并进行回答的环境。你不一定有机会说出你想说的一切，这可能会让人非常沮丧。通过参加法庭审判和熟悉谁会出现在法庭上来积累一些经验。彻底审阅你的笔记，确保你已准备好应对恐吓或歪曲的尝试。一系列引导你回答“是”或“否”的问题通常以“那么你会说……？”开头。\n\
  \n## Otting 博士对刑事案件证词的思考 (C02a_toc.xhtml#rsecc008_5)\n\n在法庭作证是任何数字取证分析师工作的一部分，刑事证言通常与民事质证略有不同。意识到律师只会问他们自己有答案或理论的问题，所以准备工作应该包括对各种情况的准备。另一个需要记住的是，你可能只了解案件的一小部分，当你到达法庭时，你会发现自己所处的环境与你想象的完全不同。由于案件的现实与你预期的大不相同，怀疑自己为什么会出现在那里也不为过分。如果案件涉及陪审团，那么在回答时将注意力转向他们。尽可能与许多人进行眼神交流。\n\
