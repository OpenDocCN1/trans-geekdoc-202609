  \n（由于原文存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理）\n\n（由于原文存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理）\n\
  \n（由于原文存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理）\n\n（由于原文存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理）\n\
  \n（由于原文存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理）\n\n（由于原文存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理）\n\
  \n（由于原文存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理）\n\n（由于原文存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理）\n\
  \n（由于原文存在大量重复和逻辑混乱的乱码式错误，翻译文根据上下文意图进行了去重语义化处理）\n\n\n\n\n移动取证中一个有趣的变量是，它可能具有区域性影响。例如，某些厂商会根据设备部署的位置来调整设备设计和/或配置。我曾遇到过一位来自\
  \ `Micro Systemation` 的工程师，当他访问美国其他地区或其他国家时通常会购买当地的手机设备，因为根据购买和部署位置的不同，看似相同的设备之间可能存在复杂的差异。新手机和功能增强至少每隔几天就会发布一次，这为移动取证产品工程师带来了支持挑战。种类繁多的接口电缆是维护移动取证工具箱的另一个挑战。我们有一个大型手箱尺寸的\
  \ `Pelican®` 箱来存放所有的移动取证电缆，而那个箱子只能装下我们大约一半的电缆。\n\n与计算机取证相比，拥有多个移动取证方案更具价值，因为对每种设备的支持程度可能存在巨大差异。逻辑提取、物理提取和文件系统提取可以提供截然不同的结果，特别是在恢复被删除的遗证方面。通常，同时提供逻辑和物理提取支持的产品在逻辑层面支持的设备远多于其在物理层面支持的设备。通常，物理提取提供的内容涵盖了逻辑提取的大部分内容并提供更多细节。因此，物理提取能力可能是两者中最具潜在价值的，但物理提取支持的设备数量通常不如逻辑提取。文件系统提取在恢复被删除的遗证方面可能特别有用。移动取证中经常使用软件写保护。\n\
  \n在确定最合适的移动取证解决方案时有几个考虑因素。价格、支持、易用性、厂商稳定性、产品稳定性以及提取能力是关键问题。移动取证产品的成本通常比计算机取证产品贵——在某些情况下甚至贵得多。某些移动取证产品的年度维护费用每个许可可能达数千美元。产品支持包括更新频率、每次更新附带的新功能数量和设备支持数量，以及对支持问题的及时响应和解决都是重要因素。\n\
  \n移动取证市场的易用性差异很大。某些工具的运行非常类似于计算机取证工具，而另一些工具则作为独立设备运行。`Cellebrite` 使用独立设备连接到目标设备，并将信息推送到\
  \ `USB` 驱动器或外部设备（如电脑）。导航内置菜单有几个关键步骤，可以由培训极少的人操作。然而，在物理和文件系统提取中搜索以寻找文件碎片与使用其他产品相似。图\
  \ 3.8 显示了 `Cellebrite 通用取证设备 (UFED)`。\n\n![图 3.8 Cellebrite UFED.](img/file16.jpg)\n\
  \n图 3.8 Cellebrite UFED。\n\n厂商稳定性和产品稳定性可以是两个概念。某些公司可能是稳定的，但他们的产品可能会有 Bug 和其他问题。仔细观察这一点很重要，因为在这个市场中存在性能持续不佳的厂商和产品。市场时间长短并不一定是厂商或产品的关键指标，因为一些较新的厂商有一些有趣的产品，而一些老厂商则提供了一些不稳定的产品。\n\
  \n提取能力也许是使用移动取证产品时最重要的变量。两个声称在逻辑或物理层面支持某特定设备的产品可能会产生不同的结果，因为一个产品提取的信息可能远多于另一个。一个产品可能从设备中提取\
  \ 500 条短信，而另一个产品可能提取出 600 条。恢复信息（特别是已删除信息）的变性在不同取证产品之间差异很大。在移动取证调查中，使用多个产品以获得尽可能完整的取证视角是非常常见的。\n\
  \n## 可视化分析\n\n发现遗证和信息只是调查员面临的挑战之一。分析和解释信息可能是一项艰巨的任务。时间分析涉及查看事件发生的时间以帮助解释发现结果。许多取证工具都提供了时间线工具，但可视化分析工具可用于筛选信息并寻找模式和其他特征，以帮助拼凑数字取证的谜图。移动取证章节将更详细讨论可视化分析工具。\n\
  \n## 安全存储\n\n取证员需要一种安全可靠的方法将设备运回实验室。毯子和安全带是穷人的运运方式，而带衬垫的 `Pelican®` 箱是首选方法。这种方法的额外优点是防水，并在掉落时提供某种程度的缓冲保护。\n\
  \n到达实验室后，设备需要一个安全的地方进行记录和存储。这可能是一个安全房间、保险箱、储物柜或这些者的组合。如何处理存储是案件最重要的方面之一，因为监管链可能成为导致案件失败的弱点。从我个人而言，我喜欢使用安装在墙上或地板上的保险箱。枪箱在此时可能很好用。物理安全可以包括锁上的门、门卡访问、视频监控和冗余安全手段。\n\
  \n工具的安全存储是一个经常被忽视的领域。除了磨损外，关注的问题还包括调查中的遗证被缓存或存储在调查设备上。擦除并重建用于案件的计算机和工具可以防止证据泄露问题，但擦除和重建通常在案件完成后才进行——如果做了的话。然而，这并没有解决许多调查持续数周的问题，因此在那种环境下进行擦除和重建是不切行的。这就是为什么工具的安全存储是必要的。\n\
  \n## 损坏介质\n\n## 总结\n\n\n\n\n数字取证的应用是一个广泛且不断演变的领域，需要广泛的工具包。调查人员有许多选项针对计算机、移动设备和恶意软件，这可以了解设备的用途以及可能的操作行为。开发和维护强大的数字取证技能是一项艰巨的任务，并可能消耗大量精力。特别是在涉及恶意软件调查时，调查人员发现面临着巨大的挑战。\n\
  \n## 参考文献\n\n1. NIST.gov. (2020). 计算机取证工具测试程序。7 月 27 日检索于 [`www.nist.gov/itl/software-group/computer-forensics-testing-program`](http://www.nist.gov/itl/software-group/computer-forensics-testing-program)。\n\
  \n2. 美国法院报告. (1993). 最高法院判决案例。7 月 27 日检索于 [`www.supremecourt.gov/opinions/boundvolumes/509.pdf`](http://www.supremecourt.gov/opinions/boundvolumes/509.pdf)。\n\
  \n# 第章章互联网与电子邮件\n\n## 引言\n\n电子邮件是一个有趣的现象，因为它经常以书面格式记录个人的活动和选择——包括签名、日期和收件者。电子邮件可以帮助证明某些事的发生，提供不在场证明或追踪某人。电子邮件是调查员期间关注的最重要区域之一。\n\
  \n互联网活动提供了了解个人兴趣和偏好的窗口，通过审查留下的痕迹可以了解其做了什么。有许多潜在的地方可以寻找线索，包括聊天日志、点对点 (`P2P`) 操作、搜索引擎搜索、社交网络活动以及病毒和恶意软件足迹。注意的是，这些领域的细节随时间变化，因此了解如何适应这些变化是优秀调查人员的必备技能。\n\
  \n## 电子邮件\n\n人们通常有多个电子邮件账户，这些账户通常用于特定的目的。一个账户可能用于工作，另一个用于社交活动，还有另一个可能用于游戏或其他娱乐活动。电子邮件账户经常出现在网站上，因此一旦发现了这些账户，对它们进行关键词搜索可能是发现被遗漏活动的方法。\n\
  \n我执行的首要搜索之一是为我能的所有电子邮件账户创建关键词，例如：[yahoo.com](http://yahoo.com)、[hotmail.com](http://hotmail.com)、[gmail.com](http://gmail.com)\
  \ 等。这通常会产生大量的搜索结果，但找到相关信息的收益是巨大的。\n\n另一件我发现有用的事情是对城市、地标和地区内的名称进行搜索，因为这些通常指向感兴趣的电子邮件或消息。思考电子邮件中可能存在的特殊词，并据此进行搜索以查找电子邮件。我曾使用这种“逆向”技术来帮助解决民事案件，因为未分配空间中可能存在没有邮件头的消息碎片。例如\
  \ badguy@yahoo.com 或简单的 `badguy`，因为初始搜索可能会产生太多无法找到感兴趣的信息。\n\n邮件头可以用于追踪消息的来源和路由地。有时邮件头会被剥离或无法读取，但如果它是完整的，就可以找到物理地址。美国互联网数字分配机构\
  \ ([www.arin.net](http://www.arin.net)) 可用于追踪消息来源。\n\n## 聊天和消息日志\n\n人们有无数通信方式。即时通讯、Yahoo!\
  \ Messenger、社交网络网站和短信只是冰一角。某人拥有一台专门用于此类目的计算机并不罕见。判断某是否正在使用聊天消息另一种方法是查看安装的程序。对于 Windows\
  \ 机器，包括查看 `Software` 注册表项。\n\n如果你怀疑某人删除了他们的聊天消息工具，你可以在注册表中查找留下的痕迹。计算机上可能仍有支持文件。在留言板上与其他调查人员交流是获取反馈和处理思路的好方法。\n\
  \n与电子邮件类似，可以通过 `grep` 搜索在未分配空间中找到活动。如果调查的重点是寻找与特定行为相关的信息，那么对代表该行为的词汇和短语进行关键词搜索可能会发现碎片。在构建关键词时，请考虑地点、操作和俚语。\n\
  \n## 点对点\n\n`P2P` 网络站点用于文件共享，尽管这种做法并不总是合法的。有许多网站属于这一类，新网站频繁涌现。BitTorrent 协议用于共享文件，这些文件通常被拆分成碎片以备后重新组。由于共享的是部分文件而非完整文件，要因盗版或其他行为关闭该网站变得更加困难。涉及此类活动的网站可以快速出现又消失，这使得执法部门更难追踪它们。从数字取证的角度来看，有必要进行研究以找出当前流行的\
  \ BitTorrent 网站有哪些，以及使用它们可能需要安装哪些类型的文件、程序和痕迹，因为这是数字取证领域变化最快的领域之一。\n\n某人拥有一台专门用于\
  \ `P2P` 活动的计算机并不罕见。在没有加载 `P2P` 的计算机上发现异常巨大的音乐收藏，可能预示那里还有另一台未被查收的计算机。这方面的另一个方面是，参与\
  \ `P2P` 的人们通常有多个硬盘。\n\n\n\n\n或许开发用于确定搜索引擎活动的关键词最高效的方法是启动几个搜索引擎并进行搜索。此时会显现出模式，这种模式对于定义关键词非常有用。与技术的其它领域类似，搜索引擎的模式确实会发生变化。根据\
  \ Google 今天呈现搜索术语的方式来创建关键词，并不一定与一两年前相同。这意味着取证员需要创建我所说的“代际化”搜索引擎模式。取证员通常会检查几年前的电脑，因此关键词需要反映这一点，否则可能会遗漏信息。\n\
  \n接下来的每幅图都提供了如何构建关键词以便在基于“数字取证”这一样本搜索准则的搜索引擎法医取证工具中进行关键词搜索的思路。\n\n### 针对 Bing 搜索引擎\n\
  \n![](img/file17.jpg)\n\n此类 Bing 搜索的关键词为 `[bing.com/search?q=]`。\n\n### 针对 Dogpile\
  \ 搜索引擎\n\n![](img/file18.jpg)\n\n此类 Dogpile 搜索的关键词为 `[dogpile.com/search/web?]`。\n\
  \n### 针对 Google 搜索引擎\n\n![](img/file19.jpg)\n\n此类 Google 搜索的关键词为 `[google.com/#hl=en]`。\n\
  \n开发搜索引擎关键词时的一个重要点是测试多个搜索准则，并仔细观察浏览器地址栏 URL 模式。特别是对于 Google，通常会有巨大的差异。调查员还应该意识到，这将调出符合准则的所有搜索——因此结果可能包含数千条记录。\n\
  \n## 互联网历史\n\n取证员在何处查找互联网历史取决于嫌疑电脑上使用的浏览器。微软的浏览器会在 `index.dat` 文件中留下痕迹，取证员必须记住 Windows\
  \ 电脑上有多个 `index.dat` 文件，并且它们被用于不同的用途。采集的信息包括最后访问的几个网站的 URL、最后访问时间以及访问次数。用微软浏览器打开的文件也可以记录在\
  \ `index.dat` 文件中。虽然通常也可以判断一个网页地址是手动输入还是通过超链接访问的，但重要的是记住互联网历史是有限的。`Temp` 文件夹中可能存在与访问过的网站相关的信息。Firefox\
  \ 和 Chrome 等浏览器也会在电脑上留下痕迹，可以提供类似的见解，且其中一些痕迹可能位于浏览器数据库中。\n\nCookies 是确定访问过哪些网站的另一种方法，因为网站通常会在其上放置一个或多个\
  \ Cookies。Cookies 还可能提供操作电脑的人员所使用的网站用户名。\n\n对于互联网历史和电子邮件发现，在可能的情况下重建网页是有用的。这可以通过剥离\
  \ `html` 文件并在外部查看器中打开它来渲染网页来实现。这在报告中可能比文本书签是更具说服力的证据。与浏览器相比，像 `NavRoad` 这样的离线工具在渲染网页方面可能更好。\n\
  \n其他可以提供互联网历史线索的事物还有浏览器插件，如工具栏、扩展程序、播放器和应用程序。某些插件工具可以协助文件共享、盗版视频和知识产权、以及定制化等活动。此外，书签、收藏夹、快捷方式、存储的密码和浏览器设置也可以为用户活动提供支持。\n\
  \n需要指出的是，随着网站地址的发现，许多地址可能无法被取证员识别。这可能意味着取证员需要访问这些网站来查看它们的用途。务必非常小心，因为网站可能会释放恶意软件，从而感染取证员的电脑。这些网站也可能是非法活动发生的场所。我的建议是使用独立的研究电脑或虚拟机来研究这些网站，以降低感染风险——这样通过重装/恢复研究电脑就可以轻松擦除网站碎片。与此相关，网站会存储\
  \ IP 地址，你可能不希望它们获取你的 IP 地址。考虑使用匿名器来保护你的身份。\n\n## 社交网络与游戏\n\nFacebook、Instagram、Twitter\
  \ 和 LinkedIn 等社交网络网站是互联网上最常见的访问网站，应该是所有互联网调查的一部分。与其他领域一样，一个人拥有多个账户是很常见的现象，因此取证员应该花时间尝试识别并识别某人可能使用的所有潜在账户。账户名称通常与电子邮件账户有某种关联，因此找到一个账户名可以引导两条跟进的兴趣线索，例如社交网络和电子邮件。如果你发现了账户名，Google\
  \ 可以成为你的朋友——对账户名进行 Google 搜索可能会获得大量信息。社交网络网站的优势之一是，它们在提供个人背景信息以及其他潜在感兴趣的主题方面非常丰富。第\
  \ 9 节专门介绍社交媒体取证，其中提供了本节未包含的额外信息。\n\n如果取证员不确定从何处开始发现社交网络信息，一种选择是只需对“Facebook”或其他热门或相关网站进行关键词搜索，查看结果并精炼搜索。智能手机可能包含有关社交网络活动的重要信息，可能是另一个寻找线索以辅助构建关键词的领域。\n\
  \n在许多方面，游戏是另一种形式的社交网络。与调查员寻找的内容一致的热游戏网站和主题网站也是潜在的跟进兴趣线索。这还可能包括虚拟世界和类似的场所。收缴的电脑类型可以作为提示，表明是否是游戏爱好者，因为游戏电脑往往是具有改进图形和外围设备的高端机器。一个人进行的许多在线游戏可能是通过\
  \ Xbox、Wii 或 Play Station 等游戏系统进行的。\n\n## 恶意软件与病毒\n\n恶意软件和病毒的存在为调查员提供了多种用途。调查可能试图确定所有者是否是恶意软件作者或管理员。另一种情况是确定感染源。还有一种情况是所有者可能声称恶意软件防御——类似于“不是我干的！我的电脑里一定有病毒”。\n\
  \n如果有人是恶意软件作者，某个地方会有开发工具。这些工具可能在调查员收缴的电脑上，也可能在电脑内部的受保护扇区或虚拟机中。另一个潜在信息是对恶意软件网站、公告板和互联网中继聊天（IRC）痕迹进行关键词搜索。同样，寻找可能的用户名。如果发现了用户名，记住你的\
  \ Google 朋友，并对用户名进行 Google 搜索。\n\n\n\n\n确定感染源可以是一项时间性研究，通过检查文件的目录项（如修改、访问和创建时间，通常称为\
  \ `MAC times`）来完成。在查看计算机网络时，目标是找到组内最早的 `MAC times`，以定位潜在的初始感染位置。这可能是一个耗时且艰巨的过程。缩短调查时间的一些方法包括寻找可能的电子邮件感染源、共享媒体，并从那些计算机操作习惯较为松散的设备入手。\n\
  \n调查病毒防御并不像看起来中那么困难。首先，声称有病毒防御的人，其计算机上必须有一个病毒。其次，该病毒需要处于活跃状态，并能够执行该人员所声称的活动。像 `NetStat`\
  \ 这样的工具对于判断此类情况非常有用。如果计算机上不存在病毒，或者病毒未激活且无法执行该人声称的活动，那么这个人就大祸了。相反，如果这两点都是真的，那么唯一需要检查的就是该人是否为了制造不在场证明而自感染了感染。如果调查人员无法证明自感染，那么将很难说服陪团相信病毒防御是嫌疑人伪造的诡计。\n\
  \n木马和键盘记录器在恶意软件的功能和调查人员搜寻的目标上有许多相似之处。例如，`trojan`、`key logger` 和 `keylogger` 都是搜索时很好的关键词。在\
  \ Windows 机器上，寻找痕迹的某些区域是类似的，包括 `Registry`。调查人员应该寻找启动程序和 `Registry` 指定的可执行文件行为（可执行文件通常被称为“e-x-e’”）。某人可能尝试移除恶意软件，但后来发现它又出现了。恶意软件可以被配置为每次运行可执行文件时重新安装。因此，一种场景可能是：移除恶意软件，然后运行如\
  \ `Microsoft Word` 的程序——它是一个可执行文件，会重新安装恶意软件。\n\n确定恶意软件如何通过修改文件、更改设置和创建新文件来影响机器需要花费大量精力。其中一种方法是使用\
  \ `virgin method`（纯净法）。`virgin method` 是构建一台安装了干净系统的新机器，创建计算机上文件的哈希集（`virgin hash\
  \ set`），用恶意软件感染计算机，对计算机上的所有文件进行哈希计算，然后过滤掉位于 `virgin hash set` 中的文件。剩余的文件将是被修改或创建的文件。\n\
  \n每个文件或文件集合都可以通过算法获得哈希值。算法如 `Message Digest 5` (`MD5`) 和 `Secure Hash Algorithm\
  \ 1` (`SHA-1`) 常用于此目的，且它们的准确性非常高。`MD5` 算法是 128 位，而 `SHA-1` 算法是 160 位。两个不同文件生成相同\
  \ `MD5` 哈希的概率就像从地球到太阳往返的毫米数。两个文件生成相同 `SHA-1` 哈希的概率更是不可能的。尽管两个文件生成相同的 `MD5` 或 `SHA-1`\
  \ 哈希是一种极端情况，但研究表明这是可能。。这种情况被称为 `hash collision`（哈希碰撞）。然而，据我所知，还没有记录显示过单个文件的 `MD5`\
  \ 和 `SHA-1` 哈希值同时发生成功碰撞的实例。换，为文件 `hashtest.txt` 计算 `MD5` 和 `SHA-1` 哈希。尽管极其罕见，但可能创建一个生成相同\
  \ `MD5` 或 `SHA-1` 哈希的文件，但不可能创建一个与 `hashtest.txt` 不同却生成相同 `MD5` 和 `SHA-1` 哈希值的文件。出于这个原因，许多取证工具现在会为文件生成\
  \ `MD5` 和 `SHA-1` 两种格式的哈希值。\n\n也许观察这个问题的一种不那么困惑的方法是将人的姓名以及出生日期视为 `MD5` 哈希。这不太可能重复，但它是可能的。然后将一个姓名以及父母的名字视为\
  \ `SHA-1` 哈希。这不太可能重复，但也是可能的。脑海中想出的例子是前拳击手 `George Foreman`。他有几个儿子名字都叫 `George Foreman`。他的儿子就是\
  \ `SHA-1` 哈希碰撞的一个例子。\n\n\n\n\n移动设备包括功能手机、智能手机和平板设备。功能手机和智能手机具有许多共同功能，但智能手机还可以执行许多通常与计算机相关的任务。许多移动设备包含一个或多个摄像头、地理定位系统（`GPS`）以及与其他互联网联网的技术。手机实际上是一种带有天线、麦克风、扬声器、键盘、显示器和电池的专用无线电设备。手机通过无线蜂窝网络的频率运行。这些蜂窝网络由塔和交换站维护。\n\
  \n## 手机技术\n\n有多种手机技术，包括全球移动通信（`GSM`）、码分多址（`CDMA`）、时分多址（`TDMA`）和数字增强网络（`iDEN`）（Jansen\
  \ and Ayers, 2007）。`GSM` 是最常用的国际标准，而 `CDMA` 在美国有广泛应用。详细介绍这些技术可能会花费大量时间，因此将仅限于对 `GSM`\
  \ 和 `CDMA` 的简要概述。这两种竞争技术在速度和功能方面往往会相互领先，结合其他因素，很难说哪一个绝对比另一个更好。`GSM` 手机使用用户识别模块，通常称为\
  \ `SIM` 卡。`SIM` 卡将手机与网络绑定，并可以在设备之间更换。法医人员对 `SIM` 卡感兴趣，因为它通常包含大量信息，如电话录和配置数据。`SIM`\
  \ 卡通常由纸质或塑料材料制成，上面印有电子特征，因此在处理时必须小心。`SIM` 卡包含国际移动用户识别码（`IMSI`），用于向网络识别用户。\n\n`GSM`\
  \ 和 `CDMA` 技术中都有许多变量，例如蜂小区大小和频率。其中一个区别是，`CDMA` 网络中的相邻小区可以使用相同的频率，因此允许信号在小区之间进行“软切换”（soft\
  \ handover），因为通话可以同时拥有多个连接。当通话在小区之间传输时，会先建立较强的连接，然后断开较弱的连接。相反，`GSM` 依赖于“硬切换”（hard\
  \ handover），这意味着通话只使用一个通道。当通话在小区之间传输时，连接会暂时断开，然后维持新的连接。对于许多使用硬切换的设备，如果新连接无法完成，只要之前的连接仍然可用，它们可以重新建立之前的连接。\n\
  \n用户识别信息包含在 `GSM` 手机的国际设备识别码（`IMEI`）和 Verizon 手机的电子序列号（`ESN`）中。`IMEI` 用于网络识别设备，在\
  \ `CDMA` 网络上也称为移动设备标识符（`MEID`），因为 `MEID` 是为了取代 `ESN` 创建的。这些数字或代码通常显示在设备的贴纸上。许多设备制造商于将贴纸放在电池附近或下方。\n\
  \n## 如何拨号\n\n手机电话通过来自发射器的短波无线连接工作。当手机开启时，它会搜索手机塔信号以建立连接。连接建立后，手机会将识别信息发送到网络，让网络感知该手机。网络验证识别信息并建立服务。决定通话如何进行的变量有很多。例如，从手机到固定电话的通话需要在蜂窝网络和固网网络之间切换以完成通话。从手机到另一个手机的通话可能保持在蜂窝网络内，但也可能从蜂窝网络切换到固网网络然后再返回蜂窝网络。一个例子是美国的手机拨打欧洲的手机。蜂窝网络和固网网络之间切换的其他原因可能包括物理距离太远导致蜂窝技术无法通信、服务、地理、经济、政治，甚至是合同原因。如果人在拨打电话时正在移动，通话将在蜂窝塔之间传输以进行管理。\n\
  \n大多数手机和移动设备都是数字化的，这意味着它们通过二进制代码通信。通信是通过超高频（`UHF`）无线电频谱进行的。在这个频谱内，有一个专门为手机通信指定的频率范围。该频率范围在不同国家或大陆之间有所不同。大多数\
  \ `GSM` 手机的工作频率范围比 `CDMA` 更宽。\n\n## 法医挑战\n\n与计算机相比，移动设备带来了独特的法医挑战。最明显的区别之一是移动设备可能处于的状态数量。Owen\
  \ 和 Thomas (2011) 将移动设备的五种状态描述如下：\n\n- `Off`（关闭态）：电源关闭且取下电池。\n- `Nascent state`（初始态）：无用户数据（出厂状态）。\n\
  - `Quiescent state`（静止态）：设备实际上正在执行功能，但看起来处于不活跃状态。\n- `Semiactive state`（半激活态）：设备等待设定时间以执行功能。\n\
  - `Active state`（激活态）：设备已开启且正在执行任务。\n\n增加移动设备复杂性的因素还包括各种设备、操作系统以及各种设备状态的功能组合。有许多不同的菜单系统、键盘类型和输入方法，以及安全机制。法医人员需要熟悉这些系统、方法和机制，以便有效地处理这些设备。在线供应商网站和如\
  \ YouTube 之类的视频网站对于了解法医人员不陌生的设备非常有帮助。\n\n计算机法医学中一个持续的争论是如何扣收计算机。是否应该从计算机后面拔掉电源，还是应该正常关机，已经有了长时间的讨论。断开电源的支持者认为，机器的状态更能代表其被扣收时的状态，并且可以规避可能被触发以破坏计算机上信息的程序。而正常关机的支持者则认为，电源的中断可能会损坏计算机上的文件。直到最近，讨论中遗漏的一点是，对调查有用的大量信息可能存在于\
  \ `RAM` 中，一旦断电，`RAM` 中的内容很可能会丢失。除了运行进程的信息外，`RAM` 可能还包含密码、服务器名称和 IP 地址。\n\n\n\n\n\
  在获取移动设备时，电源状态方面面临着类似的挑战。如果设备已关机，在重新开机时需要密码或访问码才能访问其内容。此外，在更新后的 iOS 和 Android 操作系统上，连接计算机时的信任选项需要访问码。许多移动设备具有此类功能：如果输入预设次数的错误密码或访问码，设备将擦除数据或恢复到出厂设置。如果设备处于激活状态，则可能被远程擦除。防止远程访问或擦除的一种方法是将设备放在法拉第容器（Faraday\
  \ container）中。这可以阻止设备进行通信。可能需要为设备连接一个独立的电源以维持电池寿命，因为通信中断意味着设备将不断搜索信号，这会迅速消耗电池。仅仅将来自电源插座或车辆电源适配器的电源连接到设备，然后将设备放入法拉第容器是不够的，因为电线可能会像天线一样，破坏容器的法拉第特性。\n\
  \n### 取证考量\n\n移动设备的一个重要考虑因素是设备重置的速度和方法，从而删除数据。这可能包括访问设备时基于访问码的算法、远程擦除以及时间敏感信息。某些移动设备会跟踪人员通话时可能使用的手机塔信息——在某些情况下，即使在未通话、开车经过基站时也会记录。这在\
  \ 2011 年是新闻的热点问题，并引发了消费者隐私问题（Paul, 2011）。虽然已经进行了一些更改，但仍然存在包含此类信息的设备。然而，这些信息处于更难以进行取证的状态，且数据存储的时间也比以前短。对于取证分析师来说，他们必须意识到数据可能被删除的方式，并且还要了解可能根据日期/时间信息删除数据的时间敏感算法。\n\
  \n移动应用程序最近更多地使用位置数据并将其给零售商和市场研究人员以预测购买习惯和消费者兴趣。在美国，大多数州的法律在如何获取位置数据方面有所不同，大多数法律要求搜令才能获取位置数据。\n\
  \n移动取证令人沮丧的方面之一是取证工具对设备的支持可能不稳定。例如，某个取证工具可能声称支持数千种设备，但支持程度往往不同。例如，该取证工具可能可以从某个制造商的设备中提取短信、通讯录和许多其他人工制品，但对另一个制造商的设备可能只能提取通讯录。人们通常有一种误解，认为设备具有相似的支持，并且可以从所有支持的设备中提取相似的人工制品。事实并非如此，这也是为什么移动取证实验室配备多种取证工具是有意义的原因。最近，移动取证人员看到的大多数设备是\
  \ iPhone 和 Android 设备，这使得方法论和数据提取变得更加直接。\n\n## 取证流程\n\n手持设备被认为是嵌入式系统，即主要执行单一项功能的系统。平板电脑和类似设备的移动设备功能已经扩展，因此手持设备与移动设备之间存在能力重叠。因此，下将将手持设备和移动设备视为同义词，尽管它们之间可能某些区别。增加取证复杂性的特征包括手持设备和移动设备的激活设备特性。\n\
  \n### 工具评估与比较\n\n在评估取证工具时保持严谨非常重要，特别是在移动取证市场。进行彻底的实操评估和参考检查可以确保工具是否如广告所示运行。某些工具供应商过度销售其产品的功能和稳定性。我的目的不是推荐或列黑工具，但我强烈建议进行这些检查。\n\
  \n以下是关于移动设备的一些考虑以及与笔记本电脑/台式电脑的区别：\n\n*   **手持设备**：\n    *   嵌入式系统（只执行一项功能）。\n  \
  \  *   激活设备。\n    *   板载存储容量较小。\n    *   取证部分通过激活镜像（active imaging）完成。\n    *  \
  \ 基于推送技术运行。\n*   **计算机**：\n    *   存储设备上需要文件系统。\n    *   静态设备。\n    *   大存储容量。\n\
  \    *   取证部分通过位流镜像（bit stream imaging）完成。\n\n移动设备通常具有远程修改或擦除的能力。这是一项安全功能，但也用于破坏证据并使其在调查中无法恢复。消除这种威胁的方法是利用法拉第技术，例如法拉第袋或法拉第笼。法拉第技术起源于\
  \ 19 世纪的物理学家迈克尔·法拉第（Michael Faraday）。他发现电荷携带在导体的表面，且电荷对导体内部的任何物体都没有影响。通过利用这一原理，可以将手机放在法拉第设备（如法拉第笼或法拉第袋）中，防止其接收手机信号。[图\
  \ 5.1] 显示了法拉第袋的照片。\n\n\n\n\n\n调查人员应当意识到，放置在法第笼容器内的开启蜂窝设备可能会开始搜索服务。这会迅速消耗电池电量。将设备置于飞行模式有助于最大限度地减少电量消耗。通过法第笼容器的开口处穿过电缆将设备连接到充电器可能会像天线一样，从而建立信号连接并违背法第笼容器的目的。可以将一个独立的涓流充电器连接到手机上以保持电池电量，并将手机和充电器都放在法第笼容器内。图\
  \ 5.2 显示了涓流充电器的图片。\n\n![图 5.1 法第袋上的黑莓手机。](img/file21.jpg)\n\n*图 5.1* 法第袋上的黑莓手机。\n\
  \n![图 5.2 连接到涓流充电器的手机。](img/file22.jpg)\n\n*图 5.2* 连接到涓流充电器的手机。\n\n## 来源\n\n调查移动设备和手机的复杂性之一在于信息来源的多样性以及弄清楚它们是如何相互结合的。移动设备中的某些证据来源如下：\n\
  \n*   提供商/运营商\n    *   拨号记录注册 – 通话详情、`IMSI`（用户 ID）、`IMEI`（设备 ID）以及 `PIN/PUK`（个人\
  \ ID/个人解锁密钥）\n*   手机\n    *   通话、`SMS`、`MMS` 和媒体（图形、音频/视频和图片）\n*   SIM 卡\n    *\
  \   短信、电话号码（通常没有图形）\n*   内存卡（图形、音频/视频和图片）\n\n典型的提供商信息包括主叫和被电话号码、`IMEI`、起始和终止基站、服务类型、服务日期/时间以及服务/通话时长。调查人员在提交报告之前应验证这些信息。\n\
  \n## 手机操作\n\n调查人员还必须了解手机的工作原理。无线电将手机连接到基站，基站将蜂窝连接到网络的其他部分。高频率基站之间的距离比低频率基站更近。需要注意的是，蜂窝使用的频率可能因国家而异，这可能会影响设备的配置和功能。\n\
  \n## 信号切换\n\n当拨叫者打开手机时，它会寻找服务。当拨叫者在使用服务旅行时，信号会切换到路径上的不同基站。基站之间常用的信号切换类型包括硬切换（hard\
  \ handoff）和软切换（soft handoff）。\n\n*   **硬切换**：`GSM` 技术使用，通话以“断开后连接”的方式处理。本质上，持有通话的初始基站告诉下一个基站它正在移交通话，然后初始基站中断服务，并假设第二个基站已接手该通话的服务。\n\
  *   **软切换**：`CDMA` 使用，通话以“先连接后断开”的方式处理。初始基站通知下一个基站正在切换通话，但在这种环境下，初始基站会等到第二个基站处理通话后再断开与通话的连接。\n\
  \n## 蜂窝技术代\n\n蜂窝技术代包括 `1G`、`2G`、`2.5G`、`3G`、`4G` 和 `5G`。数字后面的 `G` 代表代。因此 `1G` 是第一代，`2G`\
  \ 是第二代，依此类推。表征每一代的某些特征如下：\n\n*   `1G`\n*   `2G`\n*   `2.5G`\n*   `3G`\n*   `4G`\n\
  *   `5G`\n\n\n\n\n\n一些取证工具（如 Cellebrite）尝试支持尽可能多的设备，并在行业内建立关系，以便能够及时开发对新技术的支持。尽管移动设备取证工具通常会生成详细的报告，但仍应对对设备及其周围情况进行记录。与计算机法医取证类似，移动设备调查可以通过诸如图\
  \ 5.4\n\n**图 5.4** 移动设备扣押表。\n\n链接和视觉分析工具可以分析通话模式，利用诸如谁发起通话、通话时长、个人之间的通话频率以及何时拨打不同人员等属性，来确定在潜在犯罪团中处于领导角色的人，以及特定事件相关的概率。例如，如果\
  \ Jim 给 Jane 打了 1 分钟电话，然后在挂掉 Jane 的电话后 30 秒打给 Steve —— 如果这种模式在一个月内重复了几次，那么 Jim 和\
  \ Jane 之间的通话与 Jim 和 Steve 之间的通话相关的概率非常高。相反，如果 Jim 给 Jane 打了 1 分钟电话，然后在给完 Jane 的第二天打给\
  \ Steve，那么 Jim 和 Jane 之间的通话与 Jim 和 Steve 之间的通话相关的概率要低得多。这种分析可以将人员置于嫌疑人团伙内部或外部。\n\
  \n检查移动设备时需要关注的最重要属性之一是事件发生的时间。仅对手机活动进行时间分析可能不足以解释某种情况，但当分析通过同一时间线图上的其他来源信息进行增强时，通常能够对发生的情况形成更完整、更有说服力的画面。这一点在于，法医手机提取可能有用，但将其与视觉分析能力相结合通常能提供更有用的情报，用于影响更广泛的局面。数字法医中的链接和视觉分析在第\
  \ 13 章中有更详细的介绍。\n\n## 地理定位系统\n\n`GPS` 利用卫星坐标来确定位置和潜在旅行路线。智能手机的进步将 `GPS` 应用和功能整合到一个设备中，这对比独立\
  \ `GPS` 市场产生了重大影响。在使用 `GPS` 技术期间生成的路线、途点和其他信息在调查中可能有用。可能存在地址、收藏、最近的 GPS 坐标和配置文件，这些都提供了感兴趣的细节。\n\
  \n## 相机\n\n数字相机在图片文件中包含元数据，提供有关图片的额外信息。这包括相机名称和型号，以及拍摄地点的 GPS 坐标。相机的大部分相关信息都在存储卡上，尽管某些相机允许通过\
  \ `USB` 等接口进行额外的提取。相机是计算机犯罪中一个潜在的重要方面，应与计算机一同扣押。如果没有存储卡，调查人员应在空白存储卡上拍照，以获取元数据信息用于关键词搜索。\n\
  \n摄像机也是数字法医鉴定人员的信息来源。摄像机通常具有较大的存储容量——甚至可能是硬盘。与计算机一样，调查人员应该检查存储介质是否有删除的文件。视频摄像头鉴定可能更适合计算机法医工具而非移动法医工具，因为计算机法医工具的恢复能力往往比移动法医工具更成熟。\n\
  \n## 常见的提取类型\n\n在进行移动设备提取时，需要考虑几种不同的提取类型和最佳实践。连接到移动设备时，物理提取应作为数据提取的首次尝试。这种提取允许获取最详细的信息，并且会提供删除的数据，因为它本质上是对闪存芯片的逐位比特提取。下一次尝试应该是文件系统提取，这将允许获取所有文件，在某些情况下包括隐藏或受保护的文件。这种类型的提取有恢复删除数据的可能性，但并非确定之。下一种是逻辑提取，在三种提取中它提供的数据最少，但在某些情况下可能是唯一的数据提取方法。还有其他更高级的数据提取方法，需要广泛的培训，除非分析师在这些方法上精通并通过了认证，否则不应尝试，它们包括芯片拆解（chip-off）和\
  \ J-tag 提取。上述提取方法在大多数 Android 设备上均可用。在本文编写时，iOS 设备上目前可用的提取方法是全文件系统提取。\n\n## 信息源和位置信息\n\
  \n\n\n\n移动设备包含了大量关于个人及其活动的信息。密码存储在智能手机文件系统、网络浏览器自动填充中或可能存储在云端。已删除的文件、最近的文件、应用程序数据、最近访问的网站、带有名称和地址的联系人、信用卡号、通话记录、短信以及当前和最近的所在地，都是移动设备上的潜在信息源。还可以从其他来源如\
  \ `Google`、`Apple` 和服务提供商获取额外的地理围栏信息，因为它们维护着包括跟踪和定位在内的用户信息。想一下——如果供应商能够根据你路过的商店向你的智能手机发送优惠券，那么相同的信息就可以在调查期间将你定位在某个特定位置。然而，调查人员应该记住，移动设备与单个基站的通信不足以将设备置于精确位置。需要来自其他基站的其他信息来进行准确的三三角测量。这通常至少需要三个或更多基站，可能还需要信号在设备与基站之间往返所需的时间信息。\n\
  \n## 总结\n\n由于移动设备数量的增加以及其提供的功能的不断扩展，对移动取证的需求正在快速增长。智能手机和平板电脑是许多应用程序流行的平台，这些应用程序可以为取证调查提供额外的证据。移动取证是一个需要大量工具和技术的环境，以便从设备中获取尽可能的情报。取证工具通常辅以视觉分析工具和地理信息系统，以获得对调查的额外见解。此外，移动取证领域正在扩展到车辆取证、智能家居、无人机和物联网技术。\n\
  \n## 移动通信技术概述\n\n移动技术充满了缩写词，以下是调查人员应该注意的几个术语：\n\n*   `GSM`: 全球移动通信。它是全球范围内标准的数字蜂窝通信技术。它可见于\
  \ 160 个多个国家，基于 `TDMA`。\n\n    ![Figure 5.5 SIM card.](img/file26.jpg)\n\n    *图\
  \ 5.5* SIM 卡。\n\n*   `TDMA`: 时分多址。`TDMA` 于 1993 年发布，并迅速成为美国的通信标准。它允许通过为数据流分配特定的时间槽，在\
  \ `single` 频率上维持多个数据通道。每个频率通道有六个时间槽。每次对话都使用两个时间槽（每个人一个）。信息以突发形式发送，并在接收端重组。\n\n*\
  \   `EDGE`: GSM 演进增强数据速率。这是一种 3G 技术，允许 GSM 运营商使用 GSM 无线电频段进行基于 IP 的多媒体服务和应用程序。\n\
  \n*   `CDMA`: 分多址。由于具有更好的网络容量，它比 `GSM` 或 `TDMA` 高得多。这是一种 2G 技术，将多次对话数字化并分解成位，附加只有发送者和接收者才知道的代码，然后进行重组。没有时间槽。`Verizon`\
  \ – 不需要 SIM 卡，在美国境外无法工作。扩频——通道分布在“整个频率”上，而不是专用给某一个。共享一个基站的用户数量没有硬限制。\n\n*   `PCS`:\
  \ 个人通信服务。它不支持\n\n*   `ESN`: 电子序列号。\n\n*   `IMEI`: 国际移动设备识别码。\n\n*   `IMSI`: 国际用户识别码。\n\
  \n*   `MEID`: 移动设备标识符。\n\n*   `SIM`: 用户识别模块。\n\n*   `MSC`: 移动交换中心。\n\n*   `MTSO`:\
  \ 移动交换局。\n\n*   `SMS`: 短信服务。\n\n*   `MMS`: 多媒体短信服务。\n\n*   `iDEN`: 集成数字增强。\n\n*\
  \   `NOR`: 闪存。\n\n*   `NAND`: 闪存。\n\n\n## 引言\n\n上周，你收到了来自你机构最关键、最敏感部门一名经理发出的会议邀请。会议似乎与一次例行的软件供应商访问有关，经理正在寻找某人来代表信息安全团队。你心里想：“没问题，这些年来我做过上百次了。”会议进行十分钟后，你意识到该供应商仅以云服务的形式提供应用程序，而该机构部门对云提供商关于交付速度、易于实施、客户控制力和极低内部信息系统要求的说法感到非常兴奋。该应用程序将包含机构一些最敏感的数据。供应商结束了演示并开放讨论进行提问。每个人看起来都很满意，然后焦点转到了你**身上，现场陷入了尴尬的沉默。也许你本应该对云架构、服务模型、部署模型和安全影响做足功课。\n\
  \n\n\n现在，在参加会议、检查电子邮件收件箱、阅读技术杂志或访问热门 IT 网站时，如果不遇到关于云计算的文章或演示几乎是不可能的。云计算正获得大量的关注。暂不考虑正式的定义，“云”实际上指的是将基于互联网的基础设施和应用程序外包给外部服务提供商，通常利用高度的虚拟化技术。供应商所倡导的云计算长期成本效益主张，对任何首席信息官（CIO）或首席财务官（CFO）来说都具有吸引力。自从亚马逊在\
  \ 2008 年推出针对企业的云服务以来，这一计算领域持续迅速获得关注。鉴于财务节约的诱人承诺，这种计算模式似乎已经成为必然。然而，云计算和云服务对于信息技术领域仍然非常新颖，因此其术语、服务产品以及对当前流程、人员和技术的影响，以及对这一新计算领域的通用知识，仍在演变中。\n\
  \n稍后我们将仔细探讨云服务的挑战、风险和收益，在此之前，稳妥的做法是建立一个云计算的工作定义、常见服务产品和交付模型，作为讨论的基础。最广泛接受的云计算通用定义来自美国国家标准与技术研究院（NIST）。NIST\
  \ 将云计算定义为：“云计算是一种模型，允许通过网络泛在、便利、按需访问共享的可配置计算资源池（例如：网络、服务器、存储、应用程序和服务），这些资源可以以极少的管理努力或服务提供商交互进行快速配置和释放。该云模型由五个基本特征、三个服务模型和四种部署模型组成。”\n\
  \n通过云计算，客户可以控制自己的计算资源需求，并可以通过高度自动化且响应迅速的一套流程按需添加计算资源。这些自动化流程通常不需要与其他人的交互，添加新计算资源的周转时间非常快。想象一个互联网\
  \ Web 应用程序，客户可以在几分钟内登录并添加计算资源。仅从通用客户服务的角度来看，这些特征就非常有吸引力。我无法自己为了内部采购、安装和配置过程等待了几个周或几个月，以便执行新信息系统项目的不同阶段。考虑它为客户提供的灵活性：可以快速添加计算资源，以便在测试周期期间为应用程序施加重负载，以验证应用程序能够处理购物旺季。如果这些计算资源是内部的，可能需要购买、安装和配置额外的服务器、操作系统和系统软件来支持这项测试，然后这些资源可能一直闲置，直到下一次旺季到来。你可能已经注意到，我在描述云特征时没有提到“多租户”或“虚拟化”术语，因为这两个术语经常与云计算相关联。尽管这些是常见特征，但它们并不是要求。\n\
  \n作为构建云计算基础的下一步，让我们仔细查看 NIST 定义中提到的三个服务模型和四种部署模型。云服务通常分为三种服务模型：(1) 基础设施即服务 (IAAS)、(2)\
  \ 平台即服务 (PASS) 和 (3) 软件即服务 (SASS）；以及四种部署模型：(1) 公有、(2) 私有、(3) 混合和 (4) 社区。理解这些模型差异的关键之一是从客户的角度分析服务模型，特别是客户对操作系统、应用程序以及系统软件（如\
  \ Web 服务器和数据库服务器）拥有多少控制权、责任可见性。稍后我们将详细查看这三个服务模型。四种云部署模型描述如下：\n\n1. **公有**：通过网络或互联网使用服务。除基础网络组件外，所有基础设施位于云提供商处。此外，操作系统、系统软件和应用程序在云提供商的一个或多个数据中心的设施内进行部署和管理。\n\
  2. **私有**：基础设施和应用程序在内部托管，但提供云计算的一些类似优势，例如根据需要缩小或扩展计算能力和容量的能力。不习惯将数据和流程放在公有云中但仍喜欢灵活云配置优势的客户可能会发现此选项很有吸引。政府法规和法律也可能促客户选择这种模型。考虑一个带有机密的政府应用程序，由于客户政策或法律，无法部署到多租户模型。\n\
  3. **混合**：这种模型是公有云和私有云的结合。由于私有部署模型中提到的某些相同原因，客户可能选择或由于政策或法规被迫部署系统的一部分，但对其系统和应用程序的其他部分利用公有云服务。\n\
  4. **社区**：这种模型实际上是混合模型的混合。这种模型可以是公有的、私有的或二者兼之，但其与其不同之处在于，使用云服务的客户属于具有共同利益、目标、使命等的“社区”。\n\
  \n现在让我们仔细查看所提供的三个不同服务模型及其特征。\n\n## 基础设施即服务\n\n在这种模型中，为客户提供虚拟机或服务器。客户控制操作系统、存储、网络配置以及任何应用程序和系统软件（如\
  \ Web 服务器、数据库管理系统和包括主机防火墙在内的网络软件）。客户可以按需添加处理能力、虚拟机内存。在这种模型中，客户还负责以下内容：\n\n* 操作系统补丁\n\
  * 系统软件配置\n* Web 服务器管理\n* 数据库管理\n* 所有系统软件的补丁\n* 安全影响，包括由于未正确执行操作系统、应用软件和系统软件的安装、配置和补丁而导致的机密性、完整性和可用性问题。\n\
  \n## 平台即服务\n\n在这种模型中，客户从 `PAAS` 提供商的产品中选择操作系统环境、系统软件和网络配置。客户负责安装和配置应用程序，但云提供商主要负责操作系统和操作系统补丁、存储和网络配置。客户和云服务提供商对\
  \ Web 服务器和数据库管理系统等系统软件可能承担共同责任。云服务提供商可能负责系统软件的安装和配置，但客户可能拥有完全管理权，包括可能覆盖云提供商原始默认配置设置的权限。\n\
  \n\n\n\n客户对业务应用程序的安装和配置，以及网站应用程序的创建、管理数据访问承担完全责任。客户可以共享某些网络责任，例如决定是否将数据库的 `DNS`\
  \ 公开，以支持来自非云提供商托管应用程序的远程连接。云提供商将负责 Web 服务器和数据库管理系统软件的补丁与升级，并可能控制某些管理功能，如数据库和网站的基本备份与恢复。客户增加处理能力和内存的能力可能会受到云提供商的限制。\n\
  \n## 软件即服务 (SaaS)\n\n在这一模型中，云提供商对操作系统、系统软件、网络配置、存储、应用程序安装和配置具有控制权。客户通常使用网络浏览器或极简客户端软件访问应用程序。客户管理员可能对通过\
  \ `SAAS` 应用程序提供的应用程序管理功能具有基于角色的访问权限。\n\n在 `SAAS` 模型中，通过额外的虚拟机、内存或磁盘增加更多处理能力的能力并不由客户控制。这种控制被服务水平协议（`SLA`）所取代，该协议规定了\
  \ `SAAS` 提供商与客户之间的可用性和响应时间。`SAAS` 提供商可能会增加虚拟机、处理器、内存或磁盘以确保满足 `SLA`。\n\n应用程序编程接口（`APIs`）可能用于与应用程序进程和数据交互，包括数据提取、数据更新和集成。集成也可能由\
  \ `SAAS` 提供商或第三方集成服务提供商作为服务提供。\n\n## 服务和部署模型\n\n这些部署模型和服务模型之间的边界可能有些模糊。例如，通过使用虚拟私有网络，可以提供一种实质上是私有的公共云部署。同样，混合模型和社区模型之间的区别也可能是模糊的。上述部署模型和服务模型仅提供了一个框架，可以在框架内提供、消费和评估服务。由于公共模型是最流行的部署模型，且\
  \ `SAAS` 将许多直接安全责任交给了云提供商，我们讨论的重点集中在公共部署模型和 `SAAS` 服务模型上。`图 6.1` 描述了云架构的类型及其和服务部署选项。\n\
  \n![图 6.1 云服务和部署模型。](img/file27.jpg)\n\n*图 6.1* 云服务和部署模型。\n\n## 客户与云提供商的责任\n\n当你从\
  \ `IAAS` 转向 `PAAS` 再到 `SAAS` 服务模型时，客户对操作系统以及系统软件（如 Web 服务器和数据库服务器）配置的控制权会减少。这种控制一直减少到在\
  \ `SAAS` 模型中，客户完全通过通过浏览器或 `API` 交付的抽象应用程序与云服务交互。客户可能无法意识到甚至不在乎是什么操作系统、Web 服务器或数据库服务器托管了\
  \ `SAAS` 应用程序。\n\n如 `图 6.2` 所示，每个连续的服务模型都建立在上一个模型的功能的基础上。`PAAS` 使用 `IAAS` 的基础设施服务，而\
  \ `SAAS` 使用 `PAAS` 的操作系统和系统软件。在 `SAAS` 模型中，基础设施、操作系统软件完全从客户视图中被抽象化。然而，`IAAS` 和 `PAAS`\
  \ 层仍然存在；它们只是由 `SAAS` 提供商管理。考虑到这种模型，没有任何因素阻止 `SAAS` 提供商使用来自独立的 `IAAS` 或 `PAAS` 服务提供商的服务。从客户的角度来看，你越接近使用\
  \ `SAAS` 服务模型，就越依赖云服务提供商提供安全可靠的解决方案。客户越接近 `IAAS` 服务模型，客户在提供安全可靠解决方案方面承担的责任就越多。然而，客户也对他们的数据和过程保持更多控制权。在两种极端情况下，所有的安全问题都需要在\
  \ `SAAS` 模型中通过 `SLA` 合同解决，或者在 `IAAS` 模型中通过构建和实施客户的安全策略和解决方案来解决。\n\n![图 6.2 按服务模型的应用栈。](img/file28.jpg)\n\
  \n*图 6.2* 按服务模型的应用栈。\n\n在 `SAAS` 服务模型中，客户最终不是仍然对安全可靠的解决方案负责吗？是的，他们依赖 `SAAS` 服务提供商维护他们的\
  \ `SLAs`，但客户不能将所有风险和责任转移给云服务提供商。\n\n## 其他服务模型\n\n还有其他云服务模型，它们并不一定完美地归入这些类别之一。这些模型的一个例子是集成即服务（IaaS）。我们在这个模型面临一个直接的问题，因为它的缩写与“基础设施即服务”（`IAAS`）完全相同！集成即服务模型提供了客户遗留系统与\
  \ `SAAS` 应用程序之间的集成，以及云中相互独立的 `SAAS` 应用程序之间的集成。这些集成服务提供商可能提供预建的软件集成适配器，以加速与流行的客户遗留企业资源计划（`ERP`）系统或其他可能在同一业务过程中相关的\
  \ `SAAS` 应用程序的集成。例如，可能一个人力资源 `SAAS` 提供商与一个薪资管理 `SAAS` 提供商合作，并使用集成即服务提供商在其人力资源应用程序与最流行的\
  \ `SAAS` 薪资应用程序之间执行集成（数据移动和转换）。这为客户提供了更多实施和集成完整解决方案的外部选择，同时也带来了更多的安全担忧，因为你向解决方案中引入了另一个服务层。你不仅需要评估\
  \ `SAAS` 提供商，现在还必须对集成提供商进行同样的详尽评估。此外，当你使用集成服务提供商时，谁控制并负责接口？`SAAS` 提供商何时升级他们负责产生接口影响的应用程序？作为客户，你对集成服务提供商提供的接口的可见性有多大？如果你不启动、管理和监控这些接口，你如何知道接口是安全的？你真的能信任\
  \ `SAAS` 提供商和集成服务提供商来代表你作为客户的最佳利益吗？我评估过的一些集成服务提供商允许客户对接口更改保持控制权。在这种模型中，你使用集成服务提供商的基础设施和软件组件来快速配置和管理你的集成。你作为客户控制接口的更改和部署。然而，出于客户服务的考虑，服务提供商可能会提议为客户执行这些。必须在实施速度、长期灵活性、数据质量和风险之间取得平衡。\n\
  \n\n\n\n\n该模型的另一个问题是客户迁移到其他 SAAS 提供商的能力。回到我们上面的人力资源示例，如果客户选择迁移到另一个薪资 SAAS 提供商，他们可能需要涉及人力资源\
  \ SAAS 提供商和集成服务提供商，这两者对于他们的组织来说都是外部的。集成服务提供商是否会限制客户对薪资提供商的选择？人力资源 SAAS 提供商是否需要修改其与集成服务提供商的接口？考虑到这些服务的成熟程度，这两个问题的答案很可能是“是”。如何确保迁移后所有数据都在之前的薪资提供商的设施中妥善销毁？客户与云提供商之间的合同必须解决这些问题。此外，客户可能需要其内部系统使用一些相同的接口组件，导致人力资源接口组件的重复。这无疑会影响财务激励，并可能导致数据质量和一致性问题。在这种情况下，我们现在有多少地方在存储、传输和处理数据？初始实施可能会导致数据和流程所在的地方比客户希望的、或者比他们迁移到云服务之前的数量要多。这无疑增加了事件响应和数字取证过程的复杂性。\n\
  \n在 SAAS 模型中，集成需求并不会消失。事实上，由于你的集成可能必须在公共网络上安全地进行，它们可能会变得复杂得多。此外，并不是所有的 SAAS 服务都是平等的。某些服务提供复杂的编程\
  \ API，而另一些仅提供部分数据的基本导入和导出。在 SAAS 实施项目中，有更多的自定义集成并不罕见。这些集成可能会带来若干安全风险：\n\n1. 静态数据可能需要加密。\n\
  2. 传输中的数据无疑需要在跨网络加密。\n3. 用于加密的私钥和公必须在云提供商内部和外部进行管理。\n4. 你需要依靠与云提供商的 `SLA` 来确保数据的机密性、完整性和可用性。\n\
  \n在图 6.3 中，我们可以看到集成服务提供商可能具有启动数据导入导出、执行远程进程和传输文件的能力。这些过程中的任何都可能导致数据临时或永久地留在集成服务的基础设施中。考虑审计这些数据从\
  \ SAAS 提供商到集成提供商、再到客户、再回到集成提供商、然后到另外一个 SAAS 提供商（包括原始 SAAS 提供商）的移动和转换的复杂性。安全专业人员需要确保数据在所有这些操作期间都是安全的，无论数据是静态的、处理中的还是传输中的。如果客户决定采用集成服务的方法，应该谨慎行事，因为他们正信赖服务提供商来代表他们的长期利益。\n\
  \n![图 6.3 集成即服务。](img/file29.jpg)\n\n*图 6.3* 集成即服务。\n\n## 多租户](#C02a_toc.xhtml#rsecc006_8)\n\
  \n如果说有一个云术语能引起关注安全的 IT 经理注意，那就是“多租户”。多租户是规模效应的驱动因素之一，它使云服务在财务上具有吸引力，并使云服务提供商能够高效地管理运营。多租户真正意味着什么？其含义和服务实可以在每种和服务部署模型中发生巨大的变化。例如，在\
  \ IAAS 模型中，你的硬件将以多租户的方式与其他客户共享，但你的操作系统和系统软件可能不会。在 PAAS 中，你的操作系统和系统软件可能与其他客户共享，但你的应用程序不会。随着你从\
  \ IAAS 到 PAAS 再到 SAAS，多租户的程度将会增加。在 SAAS 中，与其他客户共享同一个物理数据库实例并不罕见。你的数据可能与竞争对手混合在同一个表中！让我们希望云数据库管理员不会意外地错误修改数据库视图或安全组，导致客户能够短暂看到彼此的数据！此外，一次成功的\
  \ `SQL injection` 攻击可能会在该模型中泄露多个客户的数据。让我们思考一下这种 `SQL injection` 攻击。在 `SQL injection`\
  \ 攻击中，攻击者“欺骗”应用程序去执行由攻击者编写并注入 Web 应用程序输入字段的数据库查询。在对多租户 SAAS 服务模型的成功攻击中，这些注入的查询可能导致向攻击者显示多个客户的数据，或跨越客户边界不恰当地修改客户数据。你可能会想：“当然了，但他们只能看到他们权限级别的数据。”情况很可能不是这样。大多数\
  \ Web 应用程序的架构设计使得访问数据库的账户是一个特权账户，与用户登录 SAAS 应用程序时使用的账户是分开的。当有成千上万的用户访问 Web 应用程序时，在数据库级别维护单个用户账户和权限通常是不可行的或不可取的。相反，Web\
  \ 或应用程序服务器将基于角色的用户访问分配给应用程序，然后代表所有用户使用单个特权账户连接到数据库。在 `SQL injection` 攻击中，你利用了相同的特权数据库账户，因此可能会访问整个数据库。\n\
  \nSAAS 销售人员对使用他们软件的大客户感到非常自豪，并不吝将这些大客户作为背书手段。对于攻击者来说，寻找 SAAS 提供商的大客户列表并不困难。某些公司和组织比其他更容易成为攻击目标。客户是否应该将使用同一\
  \ SAAS 知名客户视为威胁（因为他们引来了攻击），还是对产品强有力的背书？我认为大多数客户不会希望与热门的攻击目标共享多租户数据库。\n\n在使用 IAAS\
  \ 或 PAAS 模型的多租户环境中，无法信任构建和部署没有漏洞的应用程序。因此，对客户应用程序、数据和管理权限进行适当隔离至关重要。跨客户共享操作系统账户是不可能的。数据库实例和账户也应该分离。理想情况下，每个客户都应该有自己的数据库实例，并带有实现最小权限原则的独立访问账户。独立的访问账户是常见的，但独立的数据库实例并不常见，并且可能与云提供商的规模效应模型相悖。在多租户环境中，应用程序架构层之间的信任边界变得复杂得多。应用程序架构层不仅需要在彼此之间建立通用的信任边界，还需要在每个应用程序架构层内建立特定特定的信任边界。\n\
  \n## 用户访问与配置](#C02a_toc.xhtml#rsecc006_9)\n\n\n\n\n\nSAAS 应用在管理用户、用户组以及身份验证和授权流程时，必须适应各种客户的能力。SAAS\
  \ 应用可能会提供直接在应用中创建用户、群组和权限的能力，以避免疏远那些不愿投入资金与其身份管理系统进行集成的客户。客户必须有一套独立于其组织中央身份管理系统来管理这些用户和权限信息的策略，或者必须准备好与其中央身份管理系统进行集成。\n\
  \n在独立系统中手动维护用户、组和权限面临着许多挑战。员工的审计、入职和离职流程可能成为一项挑战。用于身份验证和授权的用户数据很容易与客户的中央身份管理系统不同步。确保离开组织的员工能被及时从\
  \ SAAS 应用中移除可能是一项挑战。随着员工在组织中角色的变化，更新用户权限也可能是一项挑战。客户可能需要使用云提供商的 `API` 自定义一个用于审计用户和权限的流程。无论该过程是手动还是自动的，在某些情况下，通过手动过程将用户从\
  \ SAAS 系统中删除时，可能会产生无法接受的延迟。\n\n某些 SAAS 提供商提供不同形式的单点登录（SSO）。SSO 流程允许已通过客户网络身份验证的用户“自动”身份验证到\
  \ SAAS 应用。客户应该调查 SAAS 应用是否允许同时配置 SSO 和直接身份验证。在某些情况下，我曾看到客户被迫在两者二选一而不能兼得。对于客户来说，实施\
  \ SSO 可能可行且理想的，但同时也带来了许多挑战。SSO 主要是为了终端用户的便利，因为它消除了终端用户在已通过客户网络身份验证后再次被提示登录的情况。实施\
  \ SSO 减少了终端用户的密码和登录次数，但并不一定能消除手动维护或对 SAAS 应用进行自定义界面的需求。用户身份和组权限仍然必须在客户和 SAAS 应用之间保持同步。\n\
  \n在 SAAS 应用可以在不先登录客户网络的情况下直接从互联网访问的情况下，SSO 变得更加复杂。客户可能需要 SAAS 提供商重定向到由客户管理的站点，让用户对客户网络进行身份验证，然后将凭据传递给\
  \ SAAS 应用并进行重定向。这不仅给终端用户带来了更多故障点和困惑，还为企图访问 SAAS 应用的攻击者提供了更大的攻击面。其他使 SAAS 提供商 SSO\
  \ 复杂的场景还包括客户网络内的共享计算机。制造区域的员工共享一个连接到网络的常用亭式计算机并不罕见，计算机在启动时使用通用的用户账户和密码。员工可能会被提示登录某些应用程序，然后必须在离开共享计算机之前记住注销。与之前的\
  \ Internet 访问场景类似，即使共享计算机不支持到 SAAS 提供商的 SSO，SSO 集成也必须兼容这些员工。集成的复杂性和攻击面进一步增加，审计和监控员工访问\
  \ SAAS 应用的复杂性也随之增加。\n\n客户在转向云计算时，需要采用标准的身份管理实践和接口。为每个云提供商构建自定义集成是不可持续的。诸如服务配置标记语言（SPML）等标准正在出现，但由于复杂性和投资要求，到目前尚未被广泛接受。今天，客户必须为每个云提供商的\
  \ SPML 实现编写配置服务。这导致了标准的配置方法，但并没有减少客户和云提供商需要维护的复杂性或接口数量。像 SPML 这样的配置接口可以使用标准的可扩展标记语言（`XML`）架构提供基本的用户数据操作，如读取、更新、创建或删除。标准服务还可能提供基本的用户数据搜索操作。其他开放标准如\
  \ OpenID、Yahoo! 和 Google 实现了到云服务提供商的 SSO 和身份验证。然而，这些标准中使用的用户帐户和密码的控制不在客户手中，因此带来了它们自身的一系列风险和挑战。\n\
  \n## 数据保护与泄露\n\n云环境中一种常见的防御和客户要求是在数据在传输和静态存储时进行加密。我不反对这种做法。网络中传输和静态存储的所有数据都应该加密。加密数据有助于防止其他客户或云提供商员工破坏数据机密性。使用的加密方法应根据客户所属行业或政府的政策和建议。然而，当\
  \ Web 应用程序被破解时，这种防御提供的保护有限。例如，如果 SAAS 应用身份验证被绕过或破解，SAAS 应用架构组件可能会将数据请求视为合法，从而允许攻击者以未加密的形式查看加密数据。此外，某些数据加密实现仅防止磁盘驱动器被盗。在这种情况下，任何具有合法或破解的数据库访问权限的人都可以以未加密的形式查看数据，因为如果用户具有数据库访问权限，数据库引擎可能会解密数据。\n\
  \n在所有三个云服务模型中，客户对其数据的加密和密钥管理承担完全（`IAAS` 或 `PAAS`）或共享（`SAAS`）的责任。客户必须分析并理解云提供商如何保护他们的数据。简单说明“我们加密所有数据”并不是足够的答案。这必须包括对云提供商如何管理加密密钥的审查，包括密钥如何生成、密钥存储在哪里、如何控制访问以及谁有权访问加密密钥。客户应该意识到加密密钥如何在\
  \ SAAS 提供商的应用程序架构中跨客户共享。客户可以选择由第三方来管理加密密钥，以降低风险。\n\n\n\n\n\n应用流程和数据的位置无疑受到云提供商类型和模型的强烈影响。然而，即使在\
  \ `SAAS` 模型中，从查看整个业务解决方案来看，应用流程和数据也可能分散在客户的基础设施内部以及云服务提供商外部。在大型组织中，能够完整地迁移支持业务流程的应用流程和数据是非常罕见的。不可避免的是，任何重要的业务应用程序都需要与其他业务应用程序共享数据和过程，这些其他应用程序可能位于不同的云或服务提供商处，或者托管在客户的本地。至少，大多数客户需要将来自所有重要业务应用程序的数据汇集到数据仓库中，以便数据可以与业务的其他领域相结合进行分析。这种数据整合和分析报告通常不是在云端执行，至少目前还没有。了解应用流程和数据的位置对于理解漏洞、审计和日志应该发生的位置以及加密需求至关重要。在云模型中，数据和应用流程的物理位置可能是未知的。在多租户模型中，多个作为热备份的数据中心可能是解决方案的一部分，导致敏感数据分布在多个位置。\n\
  \n从客户到云提供商的数据导入过程可能会引入跨站脚本攻击。在某些跨站脚本攻击中，目标是在网页中插入一些 `HTML` 或 `JavaScript` 代码。为了将\
  \ `HTML` 或 `JavaScript` 引入网页，应用程序必须接受这些 `HTML` 或 `JavaScript` 并将其存储在应用程序的数据库中。当\
  \ Web 应用程序渲染包含插入的 `HTML` 或 `JavaScript` 的网页时，网站已被攻破，导致网站篡改或其他潜在的恶意活动，例如尝试窃用户的 Web\
  \ 应用程序会话。传统上，这种跨站脚本攻击直接发生在 Web 应用程序中，这些应用程序没有正确验证通过 浏览器输入的用户输入。我描述了内部用户、内部系统以及作为集成服务提供者的第三方可能提取、转换、传输和导入数据的场景。这些过程中的任何一个责任方都为攻击者提供了破坏数据的机会，包括通过在处理的数据中插入\
  \ `HTML` 和 `JavaScript` 来实施可能成功的跨站脚本攻击。应用程序漏洞扫描器无法发现此类跨站脚本漏洞。这并不意味着不应该对云提供商的应用程序执行应用程序漏洞评估。云提供商应该定期对其应用程序执行应用程序漏洞扫描器。客户可能希望获得云提供商的合同许可，以便对应用程序运行他们自己的漏洞扫描器。\n\
  \n由于数据泄露导致的操作系统访问也应引起关注。一些大型流行的数据库供应商允许在数据库操作（如数据查询或更新）期间获得操作系统的特权访问。出于显而易见的原因，应该关闭此功能。然而，如果\
  \ `SAAS` 应用程序的设计要求某些操作访问操作系统访问，这可能会给所有共享数据库服务器实例的客户带来漏洞。`SQL` 注入攻击可以通过通过注入的 `SQL`\
  \ 隐式地执行操作系统命令来利用这一漏洞。这些命令可以是移动文件、删除文件或扫描操作系统上的文件等任何操作。客户应该询问数据库实例的配置设置，并要求以安全的方式配置数据库。\n\
  \n数据安全和保护法律可能因国家而异。特别是欧盟的数据隐私法，可能会为试图利用不仅是全球化 `SAAS` 部署，还可能涉及作为服务提供商集成的全球组织带来困扰。任何处理数据的方都必须遵守国家的数据隐私法。在美国完全可以接受的过程在欧洲国家可能是不可接受的，并可能违反法律。例如，在提取、转换和加载（ETL）过程中临时将未加密的数据写入磁盘，可能会违反数据隐私协议，并阻止\
  \ `SAAS` 解决方案的部分部署在最接近终端用户的数据中心，或迫使客户自己执行提取、转换和加载过程的部分。\n\n数据泄露是云计算安全关注事项的首位。敏感数据混合在共享的数据库服务器实例上，甚至可能与其他客户处于同一个数据库中，这会让信息技术经理感到不安。任何在信息技术领域工作过的数据库管理员都知道，只需要几次错误的点击或无意的级联权限更改，就会授予本无意赋予的权限。由于这些原因及其他原因，云中的所有敏感数据不仅应该在静态和传输过程中被加密，还应该从应用程序架构中所有相关位置（包括第三方、内部系统和内部用户）的提取、转换和加载角度被完全理解。加密密钥不应在客户之间共享，并且加密密钥的管理必须被客户理解并同意。\n\
  \n## 信息技术和信息安全治理及变更控制流程\n\n如果客户没有成熟的信息技术和信息安全治理流程，他们在不理解或不管理风险的情况下采用云服务将会变得非常脆弱。根据我的经验，`SAAS`\
  \ 提供商倾向于向客户信息技术以外的领域进行营销，声称 `SAAS` 的巨大优势之一是你不需要太多信息技术和信息安全人员的时间。他们可能声称提供点点式的配置：“只需上传数据文件即可开始。”任何参与过信息技术系统实施和集成的人都知道这绝没那么简单。鼓励终端用户直接上传数据文件或通过电子邮件发送文件是鲁莽的。许多信息技术人员并不理解正确加密和传输数据的需求和方法，更不用应用程序的终端用户了。考虑当终端用户被赋予直接向\
  \ `SAAS` 应用程序上传和下载敏感数据的能力时所带来的额外风险。数据在用户的工作站上加密了吗？数据在上传和下载过程中加密了吗？如果是，则数据必须使用与信息安全团队批准和治理相同的标准和方法进行加密，包括私钥的管理。必须建立赋予终端用户\
  \ `SAAS` 应用程序管理权限的程序，以便能够遵循一致的数据管理和传输方法。如果管理责任超出了传统的边界和信息安全团队的可见范围，这可能会变得越来越困难。\n\
  \n## 服务访问漏洞\n\n\n\n\n\n在所有这些服务模型中，客户端与云提供商进行通信的唯一客户端软件可能是浏览器，或者是一个简单的文件传输协议（FTP）客户端。另一方面，云提供商可能会通过传统的客户端提供其系统软件。例如，PAAS\
  \ 提供商可能允许客户使用数据库供应商的客户端软件连接到数据库服务器。这使得客户能够利用数据库供应商提供的功能完备的管理和开发工具集。这同时也引入了一些安全风险，并将在稍后进行描述。当\
  \ PAAS 提供商允许客户通过数据库供应商的管理和开发工具连接到其数据库服务器时，可能会导致数据库服务器遭受攻击（见图 6.4）。\n\n![图 6.4 数据库目录。](img/file30.jpg)\n\
  \n图 6.4 数据库目录。\n\n图 6.4 是客户端数据库开发工具连接到 PAAS 提供的企业级关系型数据库的快照。这确实引入了漏洞，因为云提供商不再完全控制访问其系统软件资源的软件。在其中一个示例中，PAAS\
  \ 提供商暴露了服务器上安装的所有数据库的列表，尽管客户可能只有其中一个数据库的访问权限。这助长了对非客户数据库的攻击，并为攻击者提供了一些关键的起始信息，即数据库名称。拥有与数据库名称相似的管理员账户并非不可思议。此外，数据库名称本身可能对数据库的性质或与数据库相关的组织提供强有指示。在下方的示例中，客户可以访问单个数据库。该服务器上有成百个不属于客户的数据库，但客户可以通过名称看到它们。使用该数据库名称作为用户帐户和密码的起点的暴力攻击很可能发生。\n\
  \n使用 FTP 服务传输和更新应用程序文件在 IAAS 和 PASS 模型中非常常见。FTP 以未加密的格式传输数据，允许任何访问网络的人都有嗅探或查看流量的能力。应用程序文件通常包含敏感数据，例如数据库用户账户和密码、文件传输用户账户和密码以及网络磁盘驱动器用户账户。许多开发工具允许并实际上通过默认设置鼓励通过直接构建在开发工具中的\
  \ FTP 服务传输敏感的应用程序文件。开发者和管理员在传输应用程序文件时应始终使用安全的文件传输程序。\n\n## 迁移规划\n\n云客户需要确保他们有一个云服务迁移计划（包括数据迁移），以防选择停止当前的云服务或切换到新的云服务。这种担心在\
  \ SAAS 模型中最为显著，因为客户可能无法访问由 SAAS 应用程序控制的原始数据。测试云提供商提取客户数据能力的一种方法是向云提供商提出数据仓库需求，以确定其按照客户指定的格式提取和转换客户数据的能力。另一个云服务提供商能力的迹象是他们多容易地为客户建立开发和测试环境。在内部，如果云提供商拥有成熟的程序来隔离、复制并尽可能混淆敏感数据到测试或开发环境中，那么这对于云提供商来说可能是很容易的。如果云提供商在处理此类请求时显得困难，则应对云提供商的数据迁移能力进行进一步调查。执行\
  \ SAAS 提供商数据的备份并将这些数据恢复到内部数据库，为迁移和恢复的可行性提供了一些保障。\n\n无论如何，客户必须能够及时获取其数据以支持迁移到新的 SASS\
  \ 提供商。理解提取、传输和加载数据所需的时间是必须的。由于客户需要通过 `API` 获取数据，数据提取可能会变得复杂。客户应该检查 `API` 的数据导出能力。如果云提供商的\
  \ `API` 不提供“批量”数据提取，当客户需要迁移到其他地方时，可能会导致自定义且昂贵的数据导出过程。客户还应该彻底了解在之前的云服务提供商处发生的所有数据销毁活动。\n\
  \n## 事件响应\n\n在组织中引入云计算扩大了信息安全团队事件响应流程的范围。客户应该与云提供商定义事件通知程序，包括什么被视为事件、谁将被通知以及何时必须进行通知。客户在调查期间可能需要与云提供商合作。确保在事件发生之前，客户可以获取并分析云提供商的应用程序和系统日志。客户还应该确定云应用程序可以多快地关闭和重启，包括对客户数据的访问。如果发生数据泄露事件，安全团队可能无法将事件限制在组织内部，并被迫涉及一个或多个云服务提供商。组织的事件响应团队可能需要跟踪从员工的笔记本电脑（该电脑可能使用了个人私有加密密钥）、电子邮件或\
  \ `FTP` 泄露到一个或多个云服务提供商的事件。云服务提供商随后代表客户将数据传输到其他云服务提供商，或者作为集成器的中间云服务可能会从 `FTP` 服务器获取数据，对其进行转换，然后将数据传输并加载到一个或多个服务提供商。如果这听起来像是一场噩梦，请考虑如果所有应用程序都在组织内部，步骤可能并不会少，事实上某些步骤可能会更不安全，因为员工在数据位于内部时往往倾向于信任静态数据和传输数据。\n\
  \n## 虚拟化\n\n\n\n\n\n虚拟化与云计算密切相关，并通常构成了部署 `IAAS`、`PAAS` 和 `SAAS` 模型的基础。云的弹性在很大程度上得益于虚拟化，以及在部署和创建额外的计算机操作系统环境及配置时的敏捷性。在\
  \ `IAAS` 模型中，客户可能被允许创建自己的本地虚拟机配置，然后将这些虚拟机部署到 `IAAS` 云服务提供商处。类似于在同一个数据库实例中混合客户数据，客户应该意识到其所部署的虚拟机具有多租户或混合的特性。客户在对安全要求较低的虚拟机进行安全加固时，可能没有那么谨慎。因此，包含高度敏感应用程序和进程的虚拟机可能需要与不包含此类内容的虚拟机隔分开，以防安全性较低的虚拟机产生攻击向量，从而影响到对安全更敏感的虚拟机。此外，传统的网络安全可能并不完全适用于虚拟机配置。虚拟机之间可能不需要通过物理网络进行通信，这可能导致在尝试监控虚拟机之间的流量时，某些网络安全设备和流程失效。\n\
  \n## 云计算的安全优势\n\n云计算真的存在安全优势吗？有一种观点认为，特别是在规模较小或安全策略、程序和资源不成熟的组织中，云计算更加安全。信息安全是非常复杂的。设计、开发和部署安全的操作系统、网络、数据库和网络应用程序极其复杂且昂贵。利用在信息安全方面拥有专业知识的云提供商可以提高组织的安全态势。考虑一家当地的小型信用社银行，从信息安全的角度来看，他们拥有和不拥有哪些资源。他们是否能够吸引并留实施和维护安全计算系统及应用程序所需的人才，还是与一个在安全方面拥有良好记录和声誉的云服务提供商合作会更好？就个人而言，这一线……\n\
  \n## 引言\n\n执法部门在应对涉及计算机技术的犯罪方面面临着许多挑战。许多此类犯罪涉及儿童剥削，而数字取证是为这些案件伸正司法的核心。以下案例摘要就是一个例子，不幸的是，这种情况非常常见。审查此类案件可以帮助调查人员为类似的情况做好准备。\n\
  \n## 案例摘要\n\n据许多描述，约翰·多（John Doe）是社区中一位正直的公民，有一老妻子、两个孩子、好工作和一条宠物狗。作为当地学系统的 IT 主监，他在周围的人面前表现出专业且博学的形象。他像大多数父亲一样带家人度假，并对孩子们百加宠爱。他的爱好包括摄影，并与孩子们一起分享。没有人知道他家里所发生的秘密和恶行，甚至连他的妻子也不知道。\n\
  \n多后来成为了一项调查的对象，并后因在 7 岁到 14 岁期间对其女儿进行性侵犯被定罪，他还发现持有儿童色情物品——其中一些包括他自己的孩子。在尘埃落定后，他的另一个孩子站出来告诉当局，她自己也是性侵犯的受害者。多的痴迷摧毁了他的家庭和自己孩子的纯真，留下一位母亲和两个女儿来治愈由这个来自家中的掠食者造成的情感创伤。\n\
  \n## 调查的启动\n\n刑事调查可以以多种方式开始。它们可能来自拨打执法部门办公室的匿名举报、邮寄、受害者本人或其朋友提供，或者来自学校的转介。在本案中，属于后者。受害者的一位朋友告诉了学校的老师，该老师根据这一信息采取行动通知了当局。在许多情况下，当受害者在如此幼的时候遭受父母的性侵犯时，他们并不知道被要求做的事情是错误的。他们被操纵，并被告知这是一种爱的表现，而且必须保密。多对他的孩子使用了这种操纵，并掠夺他们的纯真来满足自己的欲望。直到多女儿女儿向一个朋友提到她和父亲发生了性关系后，她才知道这并不是所有孩子都会做的事，而此时她害怕告诉任何人，因为担心没有人会相信她，也担心真相给她的母亲带来痛苦。她向最亲密的朋友倾诉，朋友们敦促她站出来，但她仍然做不到。她是自己家里的囚犯，而那里本该是一个孩子感到受保护的地方。\n\
  \n在老师得知她向朋友倾诉的内容后，老师联系了曾在其其他调查中合作过的侦探。这些合作导致了非常漫长、详细且复杂的调查，最终导致对一个危险掠食者的成功起诉。\n\n\
  ## 信息\n\n\n\n\n\n当执法部门获知此类儿童仍面临进一步虐待危险的指控时，迫切需要收集尽可能的信息。这种紧迫性在其他涉及财产犯罪或毒毒品的刑事调查中并不总是存在，因为那些案件有充足的时间进行监视和背景调查。这种紧迫性对于保护儿童是必要的，所采取的步骤必须谨慎且高效。\n\
  \n在此案中，首名侦探立即前往学校与受指受害者交谈，受害者一直在等执法部门的到来。初次访谈至关重要，其目的是确定可信度。因此，能够获取尽可能具体的信息至关重要。这些信息虽然可能很恶劣且难以谈论，但是必要的。在初始访谈中，调查人员询问了她向朋友描述的虐待类型和事件。不仅确定捕食者侵犯受害者的方式很重要，地点、方法以及尽可能多的细节也同样重要。尽管在当时这些细节可能看起来平淡且无关紧要，但如床单类型或房间油漆颜色等细节在未来可能会导致至关重要的证据。\n\
  \n受害者描述了父亲如何等她母亲睡着后，进入她的房间给她读睡前故事，躺在她身边，起初开始用手指操纵她的阴道，然后用阴茎侵入。她还描述了父亲使用一种常见的家用个人卫生用品在她身上以“帮助刺激”她。在访谈中收集的信息被用作理由，用于起草针对该房屋的搜查令，并获取的证据物品。本案中的受害者还描述了父亲如何向她展示色情片，其中一些他的电脑里包含了儿童。她描述了电脑的型号，并说这是他试图引起她兴趣的，随后他会对她进行强奸。\n\
  \n儿童捕食者通常会表现出他们根据欲望的表现采取行动。在此案中，`Doe`曾向女儿展示过色情片，因此预计家中会有数字证据。此时，首席侦探将征请另一名侦探协助，收集所有与可能持有和分发儿童色情片相关的证据。鉴于\
  \ `Doe` 的职业性质，预计住所处会有大量的数字媒体、存储设备、摄像设备和电脑。搜查令不仅将包括与实际攻击的信息，还将包括所有可以存储电子证据的物品。\n\n\
  ## 证据收集\n\n下一步将涉及首席侦探利用在受害者及其朋友初始访谈中收集的信息，撰写搜查令，以从房屋中收集证据。团队将与数字取证调查员一起对房屋执行搜查令。再次，考虑到犯罪的性质和与受害者的关系，时间就是关键，且必须在儿童面临父亲进一步攻击或进一步操纵的危险之前完成。\n\
  \n在离开执行搜查令之前，需要收集外勤工具包。收集所有可能用到的工具非常重要，例如螺丝刀、证物袋，以及便携式成像硬件和软件，以防必须对嫌疑机器进行现场成像。还使用证据日志来记录扣押了什么以及在何处。准备合适的外勤工具包可能需要尝试，但包含相机、日志、袋子、软件和硬件工具是必不可少的。\n\
  \n信息表明母亲对虐待并不知情，且不存在破坏证据的担忧，因此搜查令的执行不会像好莱坞电影中通常描写的那样——警察冲破门并接管房屋。执行过程非常小心且缓慢，考虑到本案中不止一个受害者。整个家庭都是性捕食者的受害者，搜查令对最初受害者的母亲来说将是一个冲击。考虑到这一点，调查人员礼貌地请求进入，以便私下交谈解释指控以及他们来的目的。进入房屋后，向受害者的母亲展示了搜查令，告知了被指控的信息，并由首席侦探进行采访，而其他警察开始收集证据并处理现场。\n\
  \n在开始时，无论犯罪是什么，每个现场都应该被同样对待。在移动或扣押物品之前，对其原始位置进行拍照至关重要。如果电脑处于开启状态，要仔细拍摄屏幕，并观察是否有加密迹象。如果可能，应进行\
  \ `RAM` 倾储，以获取可能存储在 `RAM` 中的任何信息。在特定的案例中，嫌疑人在执行搜查令和扣押证据期间在家，电脑按原样带走。总之，从现场拿走了 `20`\
  \ 个 U 盘、`25` 张 SD 卡、`4` 移动硬盘、`2` 台笔记本电脑和 `1` 台台式电脑。此外，受害者描述的用品也被找到并作为证据带走。现场照片被作为证据，并在可能的情况下从房屋内的人那里获得了书面陈述。\n\
  \n## 访谈与证据分析\n\n一旦 `Doe` 回家并在厨房被告知指控，他被要求来到警察局接受进一步的访谈和审问。在可能的情况下且嫌疑人配合的情况下，访谈应在受控的环境中进行，那里可以进行录像，且远离家的舒适环境。`Doe`\
  \ 的访谈虽然不包含供认，但将为受害者陈述的真实性提供许多线索。\n\n无论犯罪心理想不想听到，撒谎都是违背人性的。虽然话语可能是一套，但表达方式、嫌疑人的肢体语言以及对简单问题的回答将为经验丰富的调查员提供破解谎言并找到真相所需的一切。在这次调查中，首席侦探是顶尖水平。她会战术性引导提问，就像在下棋一样，在许多方面原理是相同的。调查人员必须为几分钟后要问的问题准备好想走的路线，尽管这可能不是认词，但他们承认了指控背后的真相。\n\
  \n\n\n\n主调查员将首先询问多伊（Doe）关于他的家庭、他的女儿以及他们的关系如何。多伊回答说他有一个理想的家庭；他的孩子很听话，是优异的学生，而且关系非常好。她会询问他的婚姻以及他们是否幸福。当然，多伊表示他们很幸福。\n\
  \n在访谈中营造舒适的氛围至关重要。如果调查员一上来就强硬地直接针对指控要求答案，嫌疑人会变得封闭，任何潜在的信息都可能永远丢失——随之消失的成功起诉的机会。一旦多伊放松下来，调查员就开始谈论受害者，即他的女儿。再次，没有询问有关指控的内容，更多是关于她的性格；她是否快乐，是外向还是内向，她是否喜欢做其他青少年做的事情等等。多伊愉快地回答了这些问题，并称她为一个完美的孩子。随后，她会询问他是否认为自己的女儿是个撒谎者或会撒谎，多伊说不会。\n\
  \n此时，调查员开始转变访谈方向，并开始提醒多伊他是如何描述女儿的，并询问他能否想出任何她会为此这件事撒谎的理由。他会说不知道，并且她是一个非常诚实的人。尽管在某些人看来，这个答案既不像是有罪的指控也不仅仅是紧张，但对于受过训练的调查员来说，这可能是对指控真实性的小小承认和认可。结合肢体语言和非语言线索，这为调查员提供了提问方向的洞察。在多伊的案例中，这将导致他所描述的家庭世界与受害者站出来描述的世界产生更多不一致之处。在访谈过程中，当调查员向他提问并描述他女儿报告的行为时，多伊会做出肯定的肢体动作。访谈者不应忽视这一点。例如，当调查员向多伊解释他女儿的报告非常有说服力且描述详细时，可以看到他在点头认同，并回答道：“可能是别人吗？”调查员不应该顺从这种回答，她也没有通过简单将问题引回多伊这样做，而是告诉他女儿在告诉调查员时非常明确地指是他，对此他回答道：“是的。”\n\
  \n尽管多伊没有当面承认他被指控的罪，但在这次访谈中有很多口头和身体上的承认。调查员需要记住的重要点是，访谈——良好的访谈——不应该、也不会很快结束。优秀的调查员可以花费几个小时审问嫌疑人以获得供词，或者对受试进行足够的分析以判断他们是否找对了人。耐心和提问的节奏是访谈室里最重要的东西之一。“好警察、坏警察”的套路只在电视上有效，在现实的调查世界中几乎没有用武。\n\
  \n此时，将对受害者进行更彻底的后续访谈。大多数州要求接受过专门培训才能与儿童谈论虐待。在这次访谈中，是在一个更受控的环境中进行的，速度比获取指控简要概述的原始访谈要慢得多。在这里，调查员可以建立时间线、攻击发生了多少次、地点、实施的方式，以及对虐待期间发生的情况有一个更具描述性的画面。对于起诉和定罪来说，这次访谈比案件启动之初的访谈更为重要。\n\
  \n在收集信息并达成一般共识后，调查员通常会与受害者会面。大多数州要求接受过专门培训才能与儿童谈论虐待。在这次访谈中，是在一个更受控的环境中进行的，速度比获取指控简要概述的原始访谈要慢得多。在这里，调查员可以建立时间线、攻击发生了多少次、地点、实施的方式，以及对虐待期间发生的情况有一个更具描述性的画面。对于起诉和定罪来说，这次访谈比案件启动之初的访谈更为重要。\n\
  \n在收集信息并达成一般共识后，调查员通常会与受害者会面。大多数州要求接受过专门培训才能与儿童谈论虐待。在这次访谈中，是在一个更受控的环境中进行的，速度比获取指控简要概述的原始访谈要慢得多。在这里，调查员可以建立时间线、攻击发生了多少次、地点、实施的方式，以及对虐待期间发生的情况有一个更具描述性的画面。对于起诉和定罪来说，这次访谈比案件启动之初的访谈更为重要。\n\
