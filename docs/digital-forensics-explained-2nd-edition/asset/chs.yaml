  \n# 第 14 章：有人在看\n\n## 引言\n\n想象一下。你度过了漫长的一天，现在只想在家里放松，也许是洗个热水澡，或者在床上拿着笔记本电脑看你喜欢的流媒体节目。这是你的家，你应该在家里应该是安全的，对吧？想象一下自己在浴缸里放松，看着视频或听着音乐。你预期没有人会看你，但如果我告诉你有人正在看，而且他们就在那里，戴着许多面具呢？这种入侵可能发生在小城镇、大城市、乡村或农场。\n\
  \n## 案例概述\n\n在密歇根州的一个旅游小镇，居民们彼此认识，社区中建立了紧密的纽带。他们竭尽所能支持彼此，去教堂，在杂货店打招呼，看着孩子们玩少棒球，聚在一起就像大多数乌托邦社区在画中呈现的一样。但一个社区发现了阴暗的一面。\n\
  \n这始于一位年轻女性在床上用笔记本电脑看她喜欢的节目。她说屏幕上弹出了一个消息，消息告诉她应该自慰。恐惧抓住了她，她关掉电脑，心跳加速，环顾房间，向窗外望去。想象一下，有人在看她。有人可能一直在看。这位年轻女性不知道当她报警报告这件事时打开了什么样的潘多拉魔盒。\n\
  \n## 证据收集\n\n\n\n\n和大多数巡逻人员一样，接警警官可能对黑客技术的内部运作缺乏技术知识，有些人甚至在处理自己的家用电脑时都很吃力。这种观点并不是要侮辱执法部门优秀的男女士们，因为在数字犯罪调查的起步阶段，情况往往是如此，而且目前有专门的数字犯罪调查部门。这些部门接受过适当的数字证据收集程序的培训，并将这些证据交给专家，例如密歇根州警察局网络犯罪部门的分析师，或者更准确地说，就是我自己以及团队中的其他审查员。\n\
  \n在响应该报案时，警官采访了那名年轻女性，她表示她的笔记本电脑出了问题，并请她教会的一位男性帮忙查看，因为她知道他在镇上的一家公司做 IT 工作。她还认识其他也做过同样事情的人，那个人可以修理他们的电脑。她并不觉得他就是黑客。这是不可能的，因为他是家人朋友，而且他还帮修过她母亲的电脑。警官告诉这两位女性，为了安全起见，最好让审查员查看一下她们电脑，以确定到底发生了什么。\n\
  \n笔记本电脑记录在案并分配了证据物品编号，两名女性签署了同意书。同意书允许对笔记本电脑的内容进行搜索。电脑、硬盘、存储媒体、手机等被视为“容器”。作为分析师，你必须在进行分析之前拥有法律权限来搜索这些“容器”。这种许可通过两种方式获得：同意和司法搜查令。同意可以由证据的所有者提供，或者在涉及涉及未成年人的情况下，由法定监护人提供。对于数字证据的搜查令搜索，必须准备一份宣誓书。这份宣誓书必须包含“合理理由”的事实，以确定该设备上存在犯罪证据。这些事实是否符合授权搜索电子证据的标准，由法官决定。在案例中，此时只需要获得同意即可。\n\
  \n我经常向我教的课程的学生解释，在案件的这个阶段，耐心是调查中最关重要的环节之一。此阶段的程序性失误会严重影响案件。通常，调查人员和分析师急于处理证据并开始搜寻。如果他们漏掉了某一步，可能会在后期导致严重的后果。每个调查人员和分析师都应该知道并熟记两个短语。这两个短语是“证据链（the\
  \ chain of custody）”和“毒树之果（fruit of the poisonous tree）”。证据链意味着在证据传输的每一步中，都必须记录证据所处的位置以及由谁保管。如果证据链出现断裂，该证据在司法程序中很可能会被驳回。“毒树之果”意味着任何通过不当手段获得的证据都会污染调查中获得的其他证据，并可能摧毁整个调查。这就是我强调耐心的原因之一，即使在这些看似平淡的事情中。\n\
  \n母亲和女儿的笔记本电脑已在实验室记录并妥善保存。从此时开始进入分析阶段。笔记本电脑的硬盘被拆下，并使用与下方类似的文档进行记录（图 14.1）。\n\n![图\
  \ 14.1 硬盘获取表。为了记录序列号而拍摄的硬盘复印图像。](img/file50.jpg)\n\n*图 14.1* 硬盘获取表。为了记录序列号而拍摄的硬盘复印图像。\n\
  \n## 证据分析\n\n在数字取证分析中，原始证据不被更改至关重要。这就是取证镜像（forensic imaging）的过程。这些哈希值可以比作数字 DNA，除非介质改变，否则永远不会改变。然后将硬盘连接到名为写保护器（write\
  \ blocker）的硬件上。该工具防止对原始介质进行任何写入或更改，并保持原始证据源的完整性。可以通过 `MD5` 和 `SHA-1` 哈希值进行验证。这些哈希值可以比作数字\
  \ DNA，除非介质被更改，否则永远不会改变，在大多数情况下，如下例所示。\n\n**镜像信息：**\n\n* 获取开始：2021 年 5 月 2 日 星期一\
  \ 10:55:49\n* 获取结束：2021 年 5 月 2 日 星期一 12:49:47\n* `GB TOSHIBA HARD DRIVE_ITEM0004.E01`\n\
  \n**镜像验证结果：**\n\n* 验证开始：2021 年 5 月 2 日 星期一 12:49:54\n* 验证结束：2021 年 5 月 2 日 星期一 13:56:33\n\
  * `MD5 checksum`：`4934395c6a776d51e5218ddaad8fb355`：已通过\n* `SHA1 checksum`：`c725db1f8b127125593f8bbeb5dde1bb3d7ee4a2`：已通过\n\
  \n随后利用取证软件处理取证镜像。国际大多数实验室通常使用几个不同的软件公司。在大多数实验室中，拥有多种工具以最大化分析有效性是有关重要的。密歇根州警察实验室使用的软件通常是\
  \ AccessData 的 `FTK`、Magnet 的 `Axiom`、GetData 的 `Forensic Explorer`、`Cellebrite`、MSAB\
  \ 的 `XRY` 以及 `EnCase`。在处理取证镜像后，分析开始。\n\n通常，大多数审查员会随着时间和经验形成自己的分析风格。在我的案例中，我开始进行所谓的“活动文件审查（active\
  \ file review）”，通过检查文件目录来对机器上的内容和活动有一个大致的了解。很快发现受害电脑存在异常。在文件目录中一个标记为 `Xerox` 的文件夹里，有数千张受害者的网络摄像头照片，而她们并不知道照片被拍摄了。观察照片的日期和时间，确定照片是每\
  \ 5 秒拍摄一次的。确定安装在受害者电脑上的两个软件包被用于拍摄照片并允许远程访问。那两个软件是 `Yawcam` 和 `CentraStage`。\n\n\
  此时，我检查了 `Windows System Event Log（Windows 系统事件日志）` 以确定软件的安装日期和时间。我发现安装发生在嫌疑人拥有电脑并提供协助修理期间。根据这些信息以及调查人员收集的其他信息，已为报案中嫌疑人的家用和工作电脑完成了搜查令及申请宣誓书。这些机器和其他存储介质被查封、记录并按前述方法进行安全运输，随后送往实验室进行分析。\n\
  \n检查的第一台机器是嫌疑人的工作电脑。该机器按照与受害者电脑相同的方式按照行业标准进行了镜像，并使用取证软件处理取证镜像。活动文件审查立即显示出远超最初两名受害者的大量活动，调查范围将急剧扩大。\n\
  \n\n\n\n\n随后，我检查了程序文件并定位了 `Yawcam` 软件。在此案发生之前，我并不了解这个软件，并开始结合我的分析对其进行研究。这从软件的 `README`\
  \ 文本文件开始，其中可以找到大量关于该软件的数据。从下方所示 `README` 文件获得的信息在本案中至关重要。\n\n### 将 Yawcam 作为服务运行\
  \ - README\n\n#### 简介\n***\n可以将 `Yawcam` 作为服务运行。这意味着 `Yawcam` 在 Windows 启动后就会在后台静默运行。即使在用户登录系统之前，服务就会运行，并且在所有用户注销后仍在运行。（更多信息请访问：[`en.wikipedia.org/wiki/Windows\\\
  _service`](http://en.wikipedia.org/wiki/Windows\\_service)）当 `Yawcam` 作为服务运行时，你将看不到图形用户界面。这就是为什么先照常启动\
  \ `Yawcam` 并根据偏好更改设置非常重要。你可能希望在启动时启用功能，例如 HTTP 输出（`Settings -> Edit Settings...\
  \ -> Startup`）。当 `Yawcam` 作为服务运行时，它将使用在计算机上安装 `Yawcam` 的用户的设置。\n\n#### 如何操作：\n1.\
  \ 照常启动 `Yawcam`。\n2. 按喜意更改设置。\n3. 在启动时启用所需的输出类型。\n4. 退出 `Yawcam`。\n5. 安装服务。\n6.\
  \ 启动服务。\n\n#### 注意\n***\n在 Windows Vista 及更高版本中，安装、启动/停止和卸载服务必须以管理员身份运行。请右键点击并使用：“以管理员身份运行”。\n\
  \n#### 安装服务\n********************\n从 Windows 开始菜单点击：\n`Start -> All programs ->\
  \ Yawcam -> Service -> Service Install`\n\n服务现在已安装但尚未启动。它将在你下次启动计算机时自动启动。不过，你可以在不重启计算机的情况下手动启动它。\n\
  \n这些信息表明，服务将在用户不知情的情况下后台运行，可以在不被察觉的情况下拍摄图像。\n\n设备上还安装了 `CentraStage` 软件。该软件的背景信息显示，它是信息技术专业人员用于支持的远程监控软件工具。这两个软件程序安装在原始受害者电脑上。在社区开始流传嫌疑人可能“黑进”其他教会成员电脑的消息后，又有几个人站出来。\n\
  \n我分析的下一部分涉及嫌疑人的互联网活动。在检查的这一部分，很明显嫌疑人用户熟悉渗透测试人员或伦理黑客经常使用的几种工具和网站。此外，分析结果显示嫌疑人利用了一个名为\
  \ `Shodan` 的网站，并发现了 `ASUS` 路由器上的一个安全漏洞。位于偏移量 `2330717134/ Sector 1737069200` 处发现了网络流量流量如图\
  \ 14.2 所示。\n\n随后我点击了该链接，它显示了已被修复的 `ASUS` 路由器安全漏洞所影响的 IP 地址，如图 14.3 所示。\n\n在查看该网站的下载内容时，一个\
  \ `shodan-export.csv.gz` 文件包含了全球 2,938 个 IP 地址的列表，包含端口号、主机名、国家、城市和组织。图 14.4 是下载文件夹中电子表格的示例。\n\
  \n随后我继续挖掘文件目录，并了包含原始报告受害者的文件夹，这些文件夹以受害者的字母缩写命名，并包含数千张关于两名女性的照片，她们在床上、浴缸里或在客厅的沙发上，完全不知道自己正被监控。\n\
  \n那么，我们如何确定图像和数据是如何从嫌疑人在其机器上安装软件的本地受害者传输到嫌疑人拥有的机器的呢？分析相关的日志文件是下一步。这些日志文件位于程序文件中，如图\
  \ 14.5 所示。\n\n文件传输的一个示例显示在图 14.6 中，你可以在其中看到文件传输的日期和。\n\n![图 14.2 显示 Shodan 搜索的互联网历史十六视图](img/file51.jpg)\n\
  *图 14.2* 显示 Shodan 搜索的互联网历史十六视图。\n\n![图 14.3 因 ASUS 安全漏洞导致受影响的 IP 地址](img/file52.jpg)\n\
  *图 14.3* 因 ASUS 安全漏洞导致受影响的 IP 地址。\n\n![图 14.4 从 Shodan 网站下载的 Excel](img/file53.jpg)\n\
  *图 14.4* 从 Shodan 网站下载的 Excel。\n\n![图 14.5 显示已安装 CentraStage 软件的文件目录](img/file54.jpg)\n\
  *图 14.5* 显示已安装 CentraStage 软件的文件目录。\n\n![图 14.6 来自 CentraStage 软件的文件传输日志](img/file55.jpg)\n\
  *图 14.6* CentraStage 软件的文件传输日志。\n\n![图 14.7 文件目录中的 Yawcam 照片输出](img/file56.jpg)\n\
  *图 14.7* 文件目录中的 Yawcam 照片输出。\n\n随后我检查了 `Yawcam` 软件的设置，显示摄像头设置为在移动时激活，并每 5 秒拍摄一次图像，输出到桌面上的文件夹中。这些信息位于路径\
  \ `EFI Partition 3\\\\Root\\\\Users\\\\volle\\\\.yawcam\\`，发现了 `yawcam_settings.xml`\
  \ 文件，并根据该文件确定了以下设置：\n\n* 每 5 秒拍摄一次图像\n* 图像保存路径为 `C:\\\\Xerox\\temp\\image {date}\\\
  _{tstamp}.jpg`\n\n在本案中，它是推送 Windows 目录下的 `Xerox` 文件夹，该文件夹是嫌疑人在拥有这些机器时创建的。在嫌疑人的机器上也发现了一个包含许多此类图像的\
  \ `Xerox` 文件夹。该文件夹如图 14.7 所示。`Yawcam` 软件在拍摄时按日期创建子文件夹。\n\n\n\n\n\n人们在没有清楚了解日常工作内容的情况下，往往选择了一条职业路径。在数字取证工作领域，我曾与全球范围内\
  \ 1000 多名学生以及无数执法人员、IT 专业人士和学者共事过。这些人中，很少有人对数字取证职业的样貌有深刻的把握，我深信原因之一是缺乏准确描述该职业内涵的来源。其他原因可能仅仅是因为技术、法律和伦理领域进展如此之快，以至于对这种环境下的职业描述可能在短短几个月内就会过时。我已经提供了心理层面的概述，如果有人能够应对这些挑战，那么判断他们是否能胜任日常场景就是下一步。本章将探讨许多数字取证实践中的真实情况和环境。\n\
  \n## 案例—— 浅浅观察\n\n显然，案件的呈现方式存在差异。企业调查员面临的案件呈现方式可能与私家侦探或执法部门的案件大不相同。然而，这些环境中一个常见的共同点是，会有其他人将案件交给调查员。当然，这也有例外，但通常是有人请求调查员“看看”。在查看之前，务必确保你已经获得了适当的授权。为了进一步强调这一点，请确保在查看之前你已获得了授权——最好是书面形式的。\n\
  \n和其他人一样，调查员审查案件的时间是有限的。决定是否进行全面调查可能取决于许多因素。从法律角度来看，这些因素可能包括犯罪的严重程度和成功起诉的可能性。从民事角度来看，因素可能包括案件可能带来的风险/回报。从企业角度来看，因素可能包括对组织财务或声誉的潜在损害。还存在未来的影响和创新，可能会延迟案件的推进。一个例子是以某种方式封存案件，以便在未来调查实践演进后进行调查，这与涉及生物学证据的悬案案件（cold\
  \ cases）相似，这些案件后来通过实验室能力的进步得以破获。\n\n调查员应该尝试关注每个案件的价值，而不要急于得出结论。尽可能获得清晰的画面是判断是否应该开展某个案件的重要第一步。有时，你是否想与某个案件关联的问题，是决定是否进行调查的最重要方面。这一点不容低估，因为我曾数次在进行调查时，案件突然发生了\
  \ 180 度的大转弯。我被告知的案件情况或我所做的假设，后来被证明与之前的现实大相径庭。这其中可能由于“事事两面性”的俗语，但有时仅仅是因为情况有许多侧面。让我们来看两个情况以提供清晰思路。请注意，本章和本书中的所有案例插图可能与实际案件相似，但为了强调及包括隐私在内的考虑，已对其进行了调整。\n\
  \n## 案例 #1 —— 并非如你所见\n\n一家律师事务所联系我，关于一起挪用资金案件。一个被一位极富翁指定为授权代理人的人进行了多次未经授权的交易，包括出售了价值数百万的股票和房地产。当那位曾经富翁的人发现这一切时，我被要求协助进行民事案件的调查，以追回资金。在案件开始时，该授权代理人去世了，这导致刑事调查宣告终止。我要求的第一件事是死者的电脑。一名法律助理协助我构建事件时间线，显然有有多人参与其中。\n\
  \n我们通过法律手段追回了该电脑，我开始了取证检查。在几分钟内，我发现他们利用拍卖行、社交媒体和类似的方法在短时间内处置了那位富翁的资产。看起来，死者的妻子和至少另外两人参与了这一阴谋。收益通过孙辈名义的账户进行了洗钱，部分资金被用于在死者的财产上建立了一座宗教神庙。由于有许多遗迹且并了在线销售方法，我继续恢复被删除的图形文件。很快，我发现了大量的儿童色情信息。这迅速改变了调查方向。我联系了案件管辖区的当地执法部门，通知他们存在潜在的儿童性虐待材料（CSAM）情况。当时，他们的数字取证能力和理解有限。\n\
  \n与其交谈的侦探希望我将硬盘邮给他，我做不到，因为这是非法的。我告诉他我会妥善保管材料并等他来取。在几天没有回复后，我安排了特勤局将硬盘递交给当地执法机构。当地管辖部门认定，由于犯罪者已去世，没有理由继续调查案件，随后他们销毁了硬盘。硬盘中涉案的人员带着数百万资金逃脱了。那位富翁失去了他的房子，因为他需要支付由于授权代理人出售股票产生的税款，而他需要通过卖房来获得这笔钱。\n\
  \n## 案例 #2 —— 并非如你所见\n\n辩护律师联系我，关于一种情况：他的客户（一名警察）因强奸被捕。律师确信其客户的手机将提供证明清白的证据。在对设备进行审查后，很清楚被捕者在\
  \ Tinder 及类似的社交媒体约会服务上很活跃。手机提供了一条线线索，显示被捕者和指控者离开了一家当地酒吧，与另一个人一起进入森林进行双人跟踪。案件中的一个复杂之处是，下班警察通常携带武器，而这正是该场景的情况。在实施重罪时携带武器会使指控变得严重得多。\n\
  \n初步的数字取证检查没有定论，尽管结果对被捕者并不有利。虽然它确实显示了性冒险的模式，但并没有定性地证明或反驳指控。在延迟几周后，案件莫名其妙地转给了另一个管辖区的另一个法律团队。事实证明，强奸指控只是冰山一角，被捕者一直都在接受与深度参与毒品活动相关的指控的调查。我描述这个案例的观点是，你有时会发现自己处于一种被要求帮助的境地，但实际上你不想与之任何关系——直到调查深入之后你才知道。\n\
  \n## 办理刑事案件\n\n\n\n\n刑事案件的目标通常与民事案件有所不同。刑事案件旨在确定被告有罪或无罪。刑事案件可能涉及地方、州或联邦执法机构，以及法官、检察官、辩护律师、证人和专家证人。数字取证调查员通常为控方一方的执法机构工作——可能以警官或文职调查员的身份任。在辩护方，数字取证调查员通常担任专家证人的角色。\n\
  \n在大多数情况下，调查人员的资质都会被严格审查。资质的范围可能很大，从除了参加过为期一周的厂商课程以获得特定工具认证外，没有任何计算机相关教育背景的人，到拥有网络安全学位并持有调查专业领域认证的人。经验也是考虑资质的因素之一。我见过某些情况，执法部门的调查员几乎没有或完全没有培训，却在处理数字取证案件。我也见过某些情况，专家证人的资质同样不如人意。这是一个伦理困境，因为被指控犯罪的人和犯罪的受害者都理应获得对案件的关注和专业技能。虽然可能存在特殊情况，但重要的是意识到，调查并不总是像应该的那样详尽，这可能导致结果出现偏差。\n\
  \n任何案件中的一个重要步骤都是验证调查结果。这在刑事案件中非常重要，因为其对人们生活的影响可能是巨大的，错误的结果可能会永久性损害相关人员。验证可以通过使用多种工具、让第二双“眼睛”审查结果、进行合理性测试，以及与历史上的类似调查进行对比来完成。此外，要尽力寻找并报告所有信息，而不仅仅是那些符合预期结果的信息。这看起来似乎是一个很显而易见的观点，但其实意义远深于此。调查员很容易产生盲目性，只寻找特定的东西，特别是当案件已经通过其他来源的证据变得非常充分时。调查员经常被要求寻找某个特定物品，而不是寻找所有东西。另一个挑战是，被调查者可能是一个不那么正直的公民，有偏离或恐怖行为的历史。要为一个从某些衡量标准来看可能不值得的人付出额外努力并不是容易的。接下来的两个案件将提供这方面的见解。\n\
  \n## 案件 #3 – 进行彻底调查\n\n开车时短信在整个美国和世界许多地方都是一个严重的问题。这种分心可能导致悲性的后果。我受辩护方委托，在一个因开车时短信导致双杀的案件中提供专家证人证词。这起发生在美国东部的特定案件涉及交通流进入州际公路上的一个施工区域的情况。现场是交通流从两条车道合并到仅剩左侧车道。情况是一个男人和他的儿子坐在左车道的一辆小型轿车里。正如通常，一辆车在右侧加速并在汇合点之前切入轿车前方。两辆车都踩了刹车，轿车被刚刚切入的前车和后方的大型\
  \ SUV 夹在中间。这是一场惨烈的事故，轿车内的两个人员均遇难。\n\n现场执法人员仅要求 SUV 驾驶员交出手机。碰撞前约 80 秒一直有短信活动。侦探员还从\
  \ SUV 中取出了事件记录器。事件记录器记录了 SUV 在碰撞前最后五秒的速度，并发现没有刹车记录。起初，这似乎是一个铁案，SUV 驾驶员负全责。随着调查的进行，有一位在\
  \ SUV 后方开车的证人作证，证称那辆在最后一秒从右侧汇入的车辆导致了事故。这时就清楚了，并没有进行完全的调查。\n\n侦探在审判中作证，SUV 驾驶员在碰撞前\
  \ 80 秒读了短信。根据证据无法做出这一判断。像 `Cellebrite` 这样的移动取证工具在满足多个条件中的任何一个时会将消息标记为已读。该消息实际上已经被读过，但在类似于目标手机的\
  \ `iPhone` 上，还有其他因素会设置此标记。例如，如果 A 向 B 发送了短信，然后让短信界面保持激活状态，那么 B 回复给 A 的短信会被标记为已读，即使\
  \ A 并没有读过。A 可能把手机放在了手套箱里，但如果短信界面仍处于激活打开状态，那么来自 B 的任何消息看起来都像是 A 读过的一样。还有其他类似的情况可以解释为什么消息在设备操作者可能没有看到的情况下被标记为已读。因此，这是调查中的一个重大缺陷。这与计算机调查非常相似，在计算机上发现了信息，但调查员需要其他信息来证明某人正坐在键盘前。\n\
  \n案件中的第二个重大缺陷是只查看了 SUV 的事件记录器。轿车和在最后一分钟汇入的车辆的事件记录器将对这一系列事件提供大量的见解。如果汇入的车辆行驶缓慢并切入一辆行驶缓慢的轿车前方，那么事件记录器将显示它们在碰撞前最后五秒速度很慢。特别是对于轿车的情况，如果显示在碰撞前有剧烈刹车，将支持\
  \ SUV 后方车辆证人的证词，即汇入车辆导致了事故。如果轿车在碰撞前最后五秒行驶速度缓慢，那么将支持 SUV 驾驶员没有注意。事件记录器显示 SUV 在碰撞前保持每小时\
  \ 75 英里的速度。为了让那辆车超过 SUV 和轿车，它的速度必须超过这个数值，这倾向于支持汇入车辆导致事故的论点。\n\n\n\n\n法律程序是一个悖论，因为它好优劣完全取决于投入其中的努力和信息。在信息技术领域，我们有一句格言——垃圾进，垃圾出（Garbage\
  \ In, Garbage Out）——简称 `GIGO`。也许这句话有时也适用于法律程序。我在法庭上目睹侦探作词说那辆 SUV 的驾驶员正在读短信，而且脸埋在手机里。你如何对你并不知的事实进行证言呢？此外，如果最后一条信息是在事故发生\
  \ 80 秒读的，那么驾驶员在碰撞前已经开了一英里路了。那么主要问题是，为什么 SUV 驾驶员没有刹车？当然，一种解释可能是她正在发短信，但她可能被右侧快速行驶并在最后一刻切入的车辆司机分散了注意力。她可能在看后视镜或向肩后看，以确认是否有其他车辆正发生同样的事情。\n\
  \n在法庭案件作词期间，你的角色是回答问题。专家证人不能在没有被提问或没有法官许可的情况下就开始胡口理论。这也是我经常思考这个案件的另一个原因。当辩护团队要求你担任专家证人时，他们通常会询问你对他们辩护策略的意见，并帮助他们解释案件中的证据。如果某些东西没有呈现，陪审团就无法考虑它。因此，在这种情况下，辩护团队理解现有证据的挑战以及调查中可能存在的漏洞至关重要。然后，他们必须在审判中询问这些挑战和漏洞。\n\
  \n## 案例 #4 – 进行彻底的调查\n\n一家大型服务公司联系我，关于一起可能潜在的贪污案件。我被要求调查 5 个人的电脑，以帮助确定是否存在任何与贪污相关的证据。在其中一台电脑上发现了\
  \ `CSAM`（儿童色情内容）的证据，所以我立即联系了执法部门。我过去曾为该机构提供过免费的调查服务，与那些警察和检察官相识。他们的数字取证调查能力有限，因此询问我愿意为他们进行这项调查。\n\
  \n这项特定调查的奇之处在于，涉案电脑属于一位 60 多岁的女性，这并不符合 `CSAM` 害者的典型特征。因此，我并没有闭起旁眼盯着这名 60 岁的女性看，而是寻找了她的电脑可能被使用的其他方式。记住，这是一个公司环境。我发现\
  \ `CSAM` 活动发生在深夜，而不是工作时间。公司日志不支持该女性在那个时间登录她的电脑。我发现了了穿透访问（pass through）的证据，这意味着有人远程登录她的电脑并利用它访问\
  \ `CSAM`。随后列出了一份包含四名潜在嫌疑人的名单，他们具有利用穿透访问的能力和手段。\n\n这变成了一个秘密案件，我必须在非工作时间进行调查，使证据发展到可以识别出犯罪者或多名犯罪者的程度。我开始调查的第一人是\
  \ `LAN 管理员`。一天晚上，我在晚上 7 点左右和该机构的一位高管一起去了他的办公室，但 `LAN 管理员` 还在办公室里。高管和我大约小时后回来，此时\
  \ `LAN 管理员` 正带着几台电脑离开办公室。我们的目标是不被发现，所以在 `LAN 管理员` 离开之前我们一直留在视线之外。进入他办公室后，我注意的第一件事是他的电脑正在擦除硬盘，这立即引起了我的怀疑。第二个可疑点是他更改了他的语音信候语，说他将离开很长时间，并联系他的直属主管。此时，看来我们选择了正确的第一个目标。\n\
  \n高管联系了 `LAN 管理员` 的主管，询问他是否知道关于新语音信箱的消息，他并不知道。主管被问是否知道 `LAN 管理员` 目前在做什么，他表示他正在组织财产内重建一些面向公众的电脑，因为这些电脑上有大量的色情内容。此时，高管准备好与执法部门重新联系并让他们带走\
  \ `LAN 管理员`。我敦促他等我有机会查看一下 `LAN 管理员` 办公室里的 13 台电脑中的至少一部分。让警察在你的妻子和孩子面前因为 `CSAM` 在家里带走你绝对会改变一生——而且如果那人被判定无罪，还可能面临诉讼。\n\
  \n我工作了一整晚，预览了所有电脑，在其中任何一台电脑上都没有发现 `CSAM` 的证据。随后给主管的电话电话发现，是主管要求 `LAN 管理员` 清理面向公众的电脑，因为某些客户是色情内容的来源。事实证明，`LAN\
  \ 管理员` 在任何方面都不对 `CSAM` 负责，而那个语音信箱是为了回应另一个人在他们的信箱里留下了类似的恶作剧问候语。在短短几个小时内，我们从几乎确定某人是罪犯并可能因\
  \ `CSAM` 指控而毁掉他的生活，转变为正确发现他是一个非常尽职的员工，是组织的一大资产。核实并验证，然后再核实并验证，以确保证据是可靠的，并且没有其他合理的解释。\n\
  \n 处理民事案件\n\n民事案件的范围从离婚情况到知识产权盗窃，再到名誉侵毁。在取证阶段，律师之间通常会有很多博弈、传票的使用以及以及对法院命令的请求。执法部门通常不参与，因此民事案件的感觉与刑事案件非常不同——尽管它们有时是联系的。\n\
  \n在取证期间，作为一名法医调查员，我经常发现自己自己在对方律师的办公室工作。原因包括控制潜在证据、能够被观察或仅仅是为了方便。在对方团队的办公室工作可能看起来很奇怪，但通常我更倾向于这样做，因为他们维护证据，我不需要处理监管链的问题。很多时候，我发现我比雇我的律师更了解对方，仅仅是因为和他们共处的时间长。很多时候，双方都承认每个人都在履行自己的职责，但在另一些时候，环境可能会非常充满性。有时我发现我比聘用我的律师更了解对方律师，仅仅是因为和他们相处的时间。\n\
  \n在民事调查中，发现工作参数比刑事案件更严格的情况并不罕见。通常涉及巨款，因此法律预算使得法院命令中规定了非常窄的定义。例如，案件中只能使用特定日期之间的文件或关键词搜索词。从表面上看，这似乎很容易，但在实践中，这完全是另一种情况。文件与许多日期相关——创建日期、访问日期、修改日期和删除日期只是其中几个。不同的文件系统可以捕捉不同类型的日期，并包括文件备份，这些日期很难管理。关键词可能会提供法院命令之外的意外结果。法院命令还可能仅指定由特定\
  \ `user id` 访问的文件。它还可能指定其他明确但在相关环境中并不一定被捕捉的参数。刑事案件可能有相同的情况，但我发现民事案件的这种情况更为普遍。\n\n\
  \n\n\n\n处理民事案件时的另一个挑战是信息流。法官可能会要求调查人员根据法庭指令的规范出报告，但大家都清楚，为了做到这一点，调查人员必须审查指令范围之外的信息，并对哪些内容应进入报告做出判断。之前提到的关键词搜索结果就是一个很好的例子。我多次处于这种境地，通常的情况是两个法律团队就调查术语的拟定表述进行反复拉锯。法庭指令处理完毕后，我将生成一份报告，该报告首先由对方律师审查，以确保其符合指令。如果他们认为符合要求，报告将发送给另一方律师。如果他们认为不符合，就开始了证据“采纳/排除”的拉锯战。\n\
  \n## 在任何调查过程中需要注意的事项\n\n在进行调查过程中可能会产生很多挫败感。技术能力可能导致所需的信息无法获得。对特定技术原理的误解以及信息的误导都是需要警惕的。要记住的首要原则是“睡眠测试”（sleep\
  \ test）。在调查中，你必须做出许多选择，而且通常没有其他人知道这些选择。例如，是将某些内容包含在报告中还是将其排除。睡眠测试非常简单：对于你所做出的决定，你是否能够问之无愧并安稳睡眠？你的声誉是宝贵的，一两个错误的决定就可能毁掉它。\n\
  \n人们会在调查之前、期间和之后向提问很多问题。有时他们只是出于好奇，但有时他们的动机可能并不显而易见。要保持礼貌，但记住也要维护保密性。你的工作虽然很重要，但可能只是谜图中的一角。因此，现实的图景可能无法仅通过你自己的工作被准确勾勒。事情往往并非表面看起来那样，所以最好把事情留存在心里，而不是说出什么以后又不得不收回。在实验室或正常工作区域之外的环境工作时，要格外小心。你认为的友好交谈可能会反过来困扰你。在数字取证调查的世界里，沉默确实是金子。\n\
  \n一旦调查完成且案件归档，还有最后一步。回顾调查的进展情况，识别哪些地方做得好，哪些地方进展不太顺利。尝试找到改进流程的方法，以便未来的调查能够进行得更加顺利。换句话说，制定一个持续改进策略。该策略应该尽可能基于事实和数据指标支持的信息。与参与调查的其他人员咨询也可以提供有用且具有建设性的反馈。熟能生巧。\n\
  \n## 总结\n\n在本书的章节中，我们涵盖了大量内容。许多才智人士提供的建议和贡献提供了极大的帮助。人们不可能全知计算机取证领域的所有知识，因此无论是写书还是进行调查，都不要犹豫与他人商量。新的视角可能正是启动停滞调查的良方，或者有助于解读发现结果。在某些工作场环境中，你可能是唯一的调查员。这并不意味着你必须单打独斗。有无数的用户群组、会议、出版物、播客、视频和其他资源可以提供帮助。建立一个可以交流想法或听取他们对新工具意见的人脉网络，应该是任何调查员的早期优先任务之一。不要等到面临完成任务压力时才开始建立人脉，那只会增加你的压力，而且你联系的人可能自己也很忙碌。\n\
  \n另一个需要记住点是回馈。不要做一个只会寻求帮助的人。相反，要做为更大的利益做贡献的人。这可以通过许多方式实现，包括参与小组和会议、发表、甚至制作几个简单的\
  \ YouTube 视频。世界充满了索取者，我们需要更多的施予者。毕竟，我们投身数字取证领域是为了寻找真相，并给予人们他们需要且应有的慰藉。感谢你对数字取证感兴趣。我们需要你以及你带来的能量。\n\
