- "# 数字取证入门指南（第2版）\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 前言\n\ncodeantra\n\n## 目的与方法\n\n大多数技术书籍往往以工具为中心，通常采用“食谱式”的方法，描述如何使用特定工具。它们展示了大量的截图来阐明这一点。这类书籍有其存在的价值，但那并不是我想写的书籍类型。我追求的是一种解释数字取证概念以及各个部分是如何结合在一起的内容，而不是依赖于某个版本的软件或某项技术。数字取证的挑战在于睁开眼睛，观察大局，并在行动之前进行思考。解决问题有多种方法，只要你理解大局，你就可以自由地使用对你最有意义的方法。\n\
  \n本书的组织结构是首先从数字取证的概述以及你应该了解的内容开始。本章涵盖了取证流程、成为调查员具备的条件、数字取证的趋势以及一些实用的资源。\n\n第 2 章描述了数字取证的方法和最佳实践。其中大部分内容基于我多年开展调查时积累的经验，以及其他调查员的反馈。书中包含了表格和顺序流程概述，以指导调查，以及一个在响应事件时使用的清单。\n\
  \n第 3 章涵盖了检查中常用的工具。这包括商业工具、免费工具和开源工具、计算机和移动设备工具，以及像插件简单的工具。\n\n第 4 章涵盖了互联网和电子邮件调查，第\
  \ 5 章涵盖了移动取证。移动取证包括手机、iPad、音乐播放器和其他小型设备。在许多方面，移动取证比计算机取证更容易掌握，因为它的部件和变数较少。然而，随着智能手机技术的快速发展，环境正迅速变得复杂。\n\
  \n第 6 章是客座作者 Jerry Emerick 写的章节。他从架构的角度涵盖了云计算以及它如何影响数字取证。\n\n第 7 章由 Jason Otting\
  \ 博士编写，他以一种非常引人入胜的方式带我们从头到尾了一个刑事案件。你可以以一种极其个人化的方式看到案件、情感和影响的布局。\n\n案件需要记录和展示，这在第\
  \ 8 章中有所涉及。书中展示了一个简单的计算机调查的示例总结报告，随后是手机调查的封面，然后查看了一份 iPad 报告。该章的后半部分涵盖了展示时的考虑因素，由于报告和展示通常是案件的结束，本章以案件归档的概述作为结束。\n\
  \n社交媒体取证和社交工程取证是大多数数字取证书籍回避的领域。Barbara Ciaritaro 博士和 Molly Cooper 博士解释了为什么这两个章节在提供有助于完善调查的信息方面非常有用。在书的前部，我提到\
  \ `Facebook` 是一个在大多数调查中应例行进行的关键词搜索。第 9 章和第 10 章帮助解释了原因。\n\n调查员经常面临的问题之一是嫌疑人计划方法让其数字活动难以追踪。Velislav\
  \ Pavlov 在第 11 章中讨论了反取证技术和技术。Vel 是那种当你对安全漏洞或想学习新事物时可以寻求建议的人。第 12 章涵盖的链接与视觉分析是研究关系和组合拼图的过程。这是一个在数字取证书籍或课程中并不常见的课题，但我认为对提高有效性至关重要。\n\
  \n尽管它是书的最后章节之一，但第 13 章是我写的第一个章节。很少有文章和书籍探讨数字取证调查相关的心理影响——我主要指的是对调查员产生的影响。如果你想过电影中某些令人惊讶的事物会让你跳起来，那么你对等待调查员的震惊世界就大致有了了。数字取证领域未来会有许多不眠之夜——思考受害者、他们的家人，是的，还有坏人。此外，我想强调伦理，因为我在数字取证领域见过许多不符合道德的行为——包括执法部门内外的调查员的行为。一旦你越过界限进入灰色地带，就很难回来了。该章的最后一部分涉及文化影响。我发现取证调查员的教育和培训中，文化、语言和更广的视野少得令人难以置信。如果调查员想要满足数字取证的需求，就需要学习外语并欣赏其他文化。\n\
  \n\n\n\n\n第 14 章是 Otting 博士的另一个案例概述。它展示了案件如何发生不同寻常的转折。第 15 章《数字取证的现实》作为全书的结尾，回顾了取证检查员将面对的各种情况。书中通过描述几次调查的展开过程，强调了要看到大局，而不是过早下结论。\n\
  \n前言是我最期待写作的部分，因为尽管它是第一部分，但它意味着大项工作已经完成了。写一本书就像训练一场马拉松。在活动开始之前，有大量工作要做，而且训练并不总是完全按照计划进行。会有受伤和挫折，会有不想跑步的日子，以及一些失控的时刻。就像训练一样，似乎总有更多可以做的事——要添加的主题，或者本该能改变一切的新进展。底线是，你无法面俱到——错误不可避免，你会忘记感谢某人，或者图表本可以更清晰——但现在是时候到达起点了。因此，我希望你们能在《数字取证》中发现价值。我随时欢迎反馈，而且凭借我的名字，通过\
  \ Google 找到我很容易。感谢大家，并祝愿未来的事业取得成功！\n\n## 致谢\n\n写一本书绝非易事，没有任何工作是完全凭个人脑力完成的。无论是开发技能、研究材料、在课堂上学习写作，还是仅仅是讨论，无论每个人是否意识到，都有许多人影响了最终产物。写作一直吸引着我，当我撰写详细说明如何使用技术或在开始教书之前的业务实践的“面包屑”类文档时，我收到了同事们非常好的反馈。来自\
  \ `Auerbach/Taylor & Francis` 的 Rich Hanley 在我的一篇发表在《信息安全杂志：全球展望》上的文章后联系了我，询问我是否有兴趣写书。如果没有他的主动性——他极具耐心——我将无法与费里斯斯州大学（Ferris\
  \ State University）的一些才华横溢的教师、技术人员和作家合作。我写了一些由 Barbara Ciaramitaro 博士编辑的章节，她向我展示了合作的价值。她为本书贡献了两个章节——《社交媒体取证》和《社交工程取证》——并在写作中常见的枯颈期帮助我保持精神状态。\n\
  \nJerry Emerick 和我曾在业界一起工作过，他是我有幸合作过的最出色的软件架构师之一。当他在 2011 年秋季成为费里斯斯州大学的教授时——我正处于那些枯颈期之一——我们讨论了云取证的想法。与其侧重于将取证工具应用于云环境的“食谱式”方法，不如退后一步理解云技术，这才能让事半功倍。这本书帮助读者理解数字取证的大局，Jerry\
  \ 的章节帮助你理解云，将两者结合起来，人们应该能够将数字取证技术应用于云端。\n\nVelislav Pavlov 在密歇根州西部一家大型机构担任信息技术工作，我荣幸让他上过我的课堂。当他第一次提交作业时，我曾以为他是从\
  \ NASA 或其他地方抄袭的，因为做得太出色了。在技术技能方面，他相对于大多数人处于一种非常的水平。考虑到他对信息安全和黑客社区的深厚知识和理解，我问他是否愿意写一个关于反取证的章节，我相信读者会发现这是一个特别的收获。\n\
  \nJason Otting 教授是我课堂上接触过的许多执法人员之一。让他们分享经验，并帮助洞察普通执法工作中面临的挑战，特别是犯罪在数字方面的特征，是非常有趣的。Otting\
  \ 博士写了几个章节，引导读者从头到尾了解一个案件，不仅在程序方面，还涉及许多数字犯罪的挑战性本质。Otting 博士在学术界和执法社区都是巨大的资源，我很荣幸能视他为朋友。\n\
  \n感谢密歇根州警察才华横溢的 Rebecca MacArthur 侦探，感谢你的建议、分享了用于书中的扣押表单，以及我们的友谊。你在执法工作中的努力比你想象的有更多的人感激。\n\
  \nMolly Cooper 博士与 Ciaramitaro 博士合作开发了社交媒体和社会工程内容。Cooper 博士是信息安全与情报专业的教授，并活跃于“网络安全女性组织”等活动。她在教室内和外都极具创造力，我非常感谢她的努力。\n\
  \n费里斯斯州大学的学生们为这本书提供了许多想法。理解他们难以掌握的概念为我提供了需要涵盖的内容的灵感。感谢费里斯大学的每一个人。加油，梗犬（Go Bulldogs）!\n\
  \n\n\n\n\n`Greg Gogolin, PhD, CISSP,` 既是一位父亲，也是密歇根州大拉皮德斯费里斯州立大学的资深教授。Greg 在 1999\
  \ 年成为费里斯州立大学教授之前，已经在 IT 领域工作了近 20 年。在费里斯州立大学任期间，他是信息安全与情报学士学位以及信息安全与情报硕士学位课程的主要作者。他曾两次获得富布莱特学者（Fulbright\
  \ Scholar）。在加入费里斯州立大学之前，他曾在小型和跨国公司担任过程序员、数据库管理员、系统分析师和项目经理。Gogolin 博士活跃于 IT 咨询，并是一位专注于数字取证案件的持照私人侦探。他拥有艺术、计算机信息系统、应用生物、计算机信息系统管理和管理学位，并获得密歇根州立大学的博士学位。他目前持有\
  \ `CISSP`、`EnCE` 和 `PMP` 认证，并非常感谢能够在密歇根州费里斯州立大学的信息安全与情报学士和信息系统管理硕士项目中教授世界上最顶尖的学生。\n\
  \nGogolin 博士在《信息安全杂志：全球展望》、《数字调查》、《数字取证实践》等期刊发表过论文，并为 IGI Global 出版的《移动技术消费：机遇与挑战》、《虚拟世界与电子商务：建立客户关系的技术与应用》以及\
  \ Nova Science 出版公司的《犯罪率、类型与热点》等刊物及书籍撰写了章节。他曾在许多会议上进行过演讲，并在全球范围内信息安全和数字取证问题进行合作。他目前的研究兴趣是一项由国家科学基金资助的关于受损介质数据恢复的研究。他曾在四大洲教授过数字取证，并曾与智利调查警察（Policía\
  \ De Investigaciones De Chile）和秘鲁国家警察（Policía Nacional del Perú）的网络犯罪部队进行培训和工作。\n\
  \n贡献者\n\n`Barbara L. Ciaramitaro` 是埃布里-瑞德航空学院的助理教授。Ciaramitaro 博士在商业领域拥有 30 年经验后进入学术界，其中包括在通用汽车担任\
  \ 10 年高管。Ciaramitaro 博士在诺瓦东南南部大学获得信息系统 `PhD` 学位，并获有信息安全研究生证书；在密歇根州立大学获得软件工程管理 `MS`\
  \ 学位；在韦恩州立大学获得心理学 `BA` 学位。Ciaramitaro 博士获得了多项专业认证，包括 `CISSP`（认证信息系统安全专家）、`CSSLP`（认证软件系统生命周期专业人员）和\
  \ `PMP`（项目管理专业）。\n\nCiaramitaro 博士是信息安全、社会工程、项目管理、社交媒体、虚拟世界和隐私等主题的频繁演讲者和作者。她编辑了由\
  \ IGI Global 出版的《虚拟世界与电子商务：建立客户关系的技术与应用》、《移动技术消费：机遇与挑战》以及《组织云计算中的安全与隐私：平衡风险与收益》等书籍，并在书中撰写了章节。她是多个专业组织的活跃成员，包括\
  \ `ISACA`、`ISC2`、`IEEE` 和项目管理协会（PMI）。\n\n`Molly Cooper` 是费里斯州立大学信息安全与情报助理教授。她在诺瓦东南南部大学获得\
  \ `PhD` 学位，在费里斯州立大学获得信息系统管理 `MS` 学位，并在费里斯州立大学获得信息安全与情报 `BS` 学位。她持有支付卡行业专家 (`PCIP`)、认证信息系统审计师\
  \ (`CISA`) 和内部安全评估师 (`ISA`) 认证。她拥有多年安安全行业经验，有多部出版物，并拥有多个成员身份和会金身份。\n\n`Gerald Emerick`\
  \ 在 2011 年秋季作为全职教员加入费里斯 ISI 项目，在此之前他在信息系统商业环境中工作了 20 年，并担任了 10 年兼职教师。在 20 年的信息系统工作期间，他曾在大型国际组织和小型组织中担任许多不同职位。他担任过的职位包括管理顾问、项目经理、软件设计与开发以及数据库管理员。Emerick\
  \ 教授活跃于互联网软件设计开发以及数据库管理咨询。\n\nEmerick 教授正在伊利诺伊大学攻读博士。他在格兰河州立大学获得计算机信息系统 `MS` 学位，在密歇根州大学获得商业计算机系统\
  \ `BBA` 学位。他的许多专业认证包括认证伦理黑客 (`CEH`)、项目管理专业 (`PMP`)、亚马逊云认证架构师助理 (`AWS-CSAA`) 和认证信息系统安全专家\
  \ (`CISSP`)。在课堂之外，Emerick 教授喜欢与家人共度时光、骑自行车、滑水、皮划艇以及任何其他可以让他欣赏密歇根户外活动。\n\n`Jason\
  \ Otting` 是美国海军陆战队退军人，于 1994 年至 1998 年在第 6 陆团服役。他结束军事生涯的目标是追求执法机会。2004 年，他成为密歇根北部某县的副\
  \ sheriff，在此期间曾担任卧底毒品警和网络犯罪部队的侦探。Otting 博士是费里斯州立大学信息安全与情报项目的助理教授，并活跃于密歇根州警察的网络犯罪部队。他在费里斯州立大学获得信息安全与情报\
  \ `BS` 学位，在费里斯州立大学获得信息系统管理 `MS` 学位，并在卡佩拉大学获得 `PhD` 学位。\n\n\n\n\n多年来，我读了许多提供了特定工具及其操作截图的类类书籍。每当工具更新时，这些书籍就会过时。本书侧重于理解数字取证过程所所需的方法论、技术、资源和心态。我以及各章节贡献者的哲学是：对过程的理解是首位的。只有这样才能将这种理解有效地应用于工具和技术中。在获得宏观理解之前，试图对某个特定工具或技术开发出高水平的技能是短视的，并且容易导致错误。任何科学都需要纪律，数字取证也也不例外。\n\
  \n数字取证是将科学原理应用于从数字设备或介质中发现信息的过程。数字取证的形式出现几乎与计算机的发明一样久远，但随着数字取证流程的成熟和需求的日益增长，取证能力在过去几年中证了许多进步。数字取证涉及几乎任何数字设备，而不只是计算机，尽管技术的演进速度往往快于取证能力。数字取证使用的常用领域包括计算机、打印机、手机、移动设备、游戏系统、应用程序（App）、全球定位系统（GPS）、生物识别系统和存储媒体。快速扩展的领域包括汽车系统、物联网设备、办公设备和其他可编程设备。通常存储在设备外部的大数据，已成为数字取证调查员丰富的信息来源。\n\
  \n## 法医学科学\n\n法医学科学开始的确切日期尚不清楚，因为法医学科学可以应用于许多不同的领域。当然，几千年来人们一直在试图确定人的死因。在约 1248\
  \ 年出现的中国书籍《洗冤》（`Hsi Duan Yu`, `The Washing Away of Wrongs`）中，作者详细描述了区分不同死亡影响的方法，例如溺水死与勒息之死的区别（Kind\
  \ and Overman, 1972）。近 700 年后，洛杉矶县警长办公室于 1930 年在美国境内建立了首个刑事科学实验室（De Forest et al.,\
  \ 1983）。曾任乔治·W·布什总统和巴拉克·奥巴马总统顾问的霍华德·施密特（Howard Schmidt）被认为建立了美国首个政府数字取证实验室（Defense\
  \ News, 2010）。尽管法医学科学已经进化了几个世纪，但数字取证是一个相对新的发展领域。\n\n事物要被视为一门科学，就必须研究、描述和调查其领域内的现象。其中的一个关键方面是，通过研究和调查产生的新知识必须是可重复的。通常会遵循同行评审流程，包括实验室内部和出版过程。复杂的调查可能有多次产生错误或误解的机会，而评审过程有助于减少这些错误的发生率。在数字取证领域，工具和技术经常会被评审，但在法庭案件中提交的发现往往由单名调查员完成，因此未经过验证，这并不罕见。在许多情况下，数字取证缺乏像湿实验室（wet\
  \ labs）等其他取证领域具备的科学严谨性。部分原因是数字取证是一门较新的科学，另一个原因是数字技术进步速度之快，导致数字取证流程往往后于技术创新的步伐。`Figure\
  \ 1.1` 是流程图表示。\n\n```\n![Figure 1.1 科学过程。](img/file0.jpg)\n```\n\n我想强调科学过程的三个方面。第一是明确定义问题。第二是定义假设。假设是对现象的潜在性解释。我想强调的第三个方面是，许多对过程的讨论忽略了结果。\n\
  \n数字取证并不局限于刑事调查。它可以用于企业环境，例如从受损设备中恢复文件和重建信息。恶意软件和僵尸网络研究是使用数字取证的其他领域，特别是在试图确定影响时。一个例子是建立设备的基准状态，引入刺激，然后将结果状态与基准进行比较。非刑事的民事案件通常涉及数字取证，例如离婚案件和侵权法案件。\n\
  \n## 成为数字取证调查员需要什么？\n\n数字取证调查员需要各个领域的技能和兴趣。当我问正在考虑这个领域的人时，问的第一个问题是他们是否喜欢谜题。在调查案件时，除了发生了某些事情之外，你可能并不知道任何细节。因此，如果某人需要被展示或告知发生了什么，他们可能不适合这个领域。有时，案件会引起调查员的注意，并附有找出计算机或设备用途的指示。有时这可能是一个开放式请求，而其他时候是在特定的时间范围内。要成为一名成功的调查员，需要毅力和创造力——他们需要成为问题的解决者。\n\
  \n\n\n\n作为法医调查员的另一个关键方面是守口如的能力。案件细节通常需要某种程度的保密性，并且必须予以维持。同样，如果有人想作为私家侦探或执法专业人员进入该领域，犯罪记录可能是强制性要求。在企业环境中，调查员可能不需要执照，但他们确实需要在公司内部保持高度的诚信。我曾检查过许多智能手机和电脑，以确定是否存在不当行为。\n\
  \n无论环境是企业、执法部门还是私家侦探，都可能需要进行背景调查。特别是在执法部门和调查员执许可方面，注册可能是一项要求。私家侦探还需要购买债券和保险。大多数州要求调查员在获得执照之前具有经验，因此刚大学毕业的学生可能会发现工作本身似乎是波动的，而不是持续的。案件往往会涉及多个设备和地点，这可能意味着长时间且不规律的工作时间。对于某些案件，下班调查可能是常态，而且这是预期的。例如，这意味着要对计算机进行法医镜像。通常，应该提前准备好复制镜像的位置。如果计算机有硬盘，可以在另一个硬盘上提取法医镜像。这个法医镜像不应仅仅带有实用程序和其他程序的新硬盘。经验丰富的调查员通常会擦除硬盘，然后覆盖整个硬盘。这个过程需要时间，当时间紧迫时，提前准备法医介质可以节省大量时间。\n\
  \n法医过程将在本书后后的部分进行讨论，包括第 2 章，但让我们完成关于法医准备介质的思考。法医准备介质的目的是让调查员能够证明设备上包含的唯一信息来自嫌疑人，且没有污染的证据。任何不属于法医镜像的内容都是由于擦除过程产生的。哈希算法（如\
  \ `MD5` 和 `SHA-1`）也用于验证是否获取了精确副本，并且尽可能将使用哈希应作为标准程序。\n\n## 教育机会\n\n教育对于成为任何职业的胜任者都是必要的，数字取证也不例外。教育可以采取多种形式，包括大学课程、参加会议、供应商课程、研讨会和自学。这些每项都应该经过评估，以确定其是否有助于他人实现其教育目标。学院和大学的教育机会可以通过多种方式进行评估，例如询问之前的学生以及与课程和项目相关的人员。几种称号和认证级别可以帮助判断课程的成熟度。例如，国家安全局（`NSA`）具有严谨且适当的学术卓越中心标准。国防部设有数字取证学术卓越中心，这是学院为了获得\
  \ `CDFAE` 称号必须满足的特定标准。工程与技术认证委员会（`ABET`）对与数字取证相关的网络安全等领域的学院课程进行认证。\n\n帮助判断学术计划实力的另一个因素是咨询教职员工的经验。可能的问题包括：教职员工是否活跃在数字取证领域进行研究或咨询？他们是否有调查员执照或认证？他们调查过多少案件？学生将接触到哪些工具和技术？班级有多大？是否有实操环节？该机构提供课程多久了？课程是否有在线版本？\n\
  \n供应商课程侧重于他们营销的工具，尽管讲师通常会提供对非供应商产品的补充工具和技术的见解。其中一些课程在线上提供，这在物流上提供了便利，并有助于将成本降最低。商业产品可能很昂贵，可能还需要购买其他工具，因此制定一个整体预算是重要的。供应商还可能赞助自己的会议或参加其他会议。会议是了解产品受欢程度以及还需要考虑其他事事项的好方法。\n\
  \n`SANS Institute` 提供非常优秀且非特定工具的教育和培训。它针对特定主题提供密集的重点教学，可以获得广受认可和尊敬的认证。还有其他类似的组织，但我有三个同事参加过\
  \ `SANS Institute` 的培训，他们给出了非常高的评价。\n\n自学是开发技能的一种廉价方式，但它确实需要大量的时间投入。我个人认为，对于数字取证这样的领域，自学是教育过程的第一步。你可以对该领域有一个合理的了解，并为在会议、大学和研讨会上进行更高级的学习奠定基础。在没有基础的情况下参加教育机会是一种非常不舒服的感觉。由于准备工作不足可能会导致信息过载或本可以通过初步自学避免的简单误解，让你无法充分利用这次体验。\n\
  \n### 数字取证调查员有哪些机会？\n\n数字取证调查员较为常见的领域包括执法部门、联邦政府、公司、律师事务所以及作为私家侦探。典型的执法部门职位是侦探或在犯罪实验室工作，但某些机构会在整个组织中更广泛地部署低级法医工具。矫正部门人员也可能使用法医技术来确保遵守假释条件。执法部门数字取证工作的很大重点包括儿童剥削和性侵待材料，但数字取证的应用在大多数刑事案件中都是很常见的。手机和移动设备分析通常是执法工作中最重要的部分。\n\
  \n\n\n\n联邦政府职位可能存在于 `CIA`、`FBI`、`Secret Service`、`ATF` 和`国防部`等机构内部。大多数人没有意识到的一个广泛使用数字取证的领域是`邮政总局`。`国土安全部`是一个比其他内阁级机构更频繁外包服务的机构，数字取证正处于这一安排之中。不同的机构和部门处理方式各不相同。例如，某个地点可能是通用的数字取证实验室，而另一个地点可能维持更高水平的专业知识。某些地点可能专门从事某些类型的取证活动，而某些机构可能拥有多个级别的专业知识。\n\
  \n一个在数字取证方面实力强大的联邦机构是 `NSA`，它是全球数字取证及相关技术的顶尖机构之一。有兴趣为 `NSA` 工作的人应该考虑就读被指定为`NSA 学术卓越中心`的大学。这些机构毕业的学生在获得职位、实习和奖学金方面通常会被优先考虑。\n\
  \n数字取证领域的企业职位在职责和重点上存在巨大差异。个人可能专注于损坏或删除文件的数据恢复、安全泄露事件的调查，以及对最近离职员工的调查，以了解他们在离职前几天里做了什么。此类调查的部分原因可能是为了查看该个人是否参与了如复制敏感信息等不当活动。其他职责可能包括欺诈调查、员工违规行为以及研发。特别是对于律师事务所，取证调查人员可能涉及电子取证\
  \ (`e-discovery`)。`E-discovery` 使用取证工具在诉讼的发现阶段搜索计算机、网络和存储设备。仅仅寻找文件名是不够的，因为所需要的文档可能是电子邮件，或者可能存在信息是否存在的问题。`E-discovery`\
  \ 工具对计算机、网络和存储介质的爬取，类似于搜索引擎爬取万维网。然而，`e-discovery` 工具爬取是为了搜索各种关键词，而不是像搜索引擎那样索引它发现的所有内容。\n\
  \n私家侦探可能自雇，也可能为较大的机构或律师事务所工作。数字取证涉及的工具和技术可能非常贵，这可能导致人们集中在各个子领域。例如，手机取证工具的购买价格很容易超过\
  \ `$10,000`，且年度维护费用为数千美元。通常情况下调查人员需要多种工具，因此一个装备齐全的手机取证调查人员在培训和其他持续费用外，可能会向工具投入 `$25,000`。计算机取证可能涉及类似的支出，而且这还不包括一些更高级的情况，如密码和加密破解技术。拥有多种工具对于寻找必要的证据和验证结果都至关重要。\n\
  \n## 数字取证的趋势和挑战是什么？\n\n正在发生的一个趋势是取证调查人员的标准化和执照化。某些认证被视为符合资格的。在几个州，在没有获得私家侦探执照的情况下进行数字取证服务是一项重罪。执照要求各不相同，因此应该咨询相应的州政府机构。个人了解其居住地州如何定义数字取证至关重要，以免他们自己陷入法律困境。\n\
  \n我对密歇根州执法部门的一项基线研究 (`Gogolin`, 2010) 表，需要数字取证服务的案件数量迅速增加，且取证调查人员严重短缺。目前已达到大多数刑事案件都具有数字方面，而且往往涉及不止一个数字领域。监控设备以及带有应用程序的手机等普及是数字因素上升的两个主要原因。社交媒体是计划和炫耀犯罪行为的地方，这几乎保证会有数字痕迹。\n\
  \n手机和移动设备的拥有量和使用量在 `2010` 年超过了 `50 亿` (`BBC News`, 2010)。`2018` 年 `Pew Research`的一项研究发现，先进经济体的手机拥有率高于新兴经济体。结果显示，美国的手机拥有率为\
  \ `81%`，另有 `13%` 的成人拥有非智能手机。`Pew Research Center` 还发现，`2015` 年美国 `18–34` 岁人群中 `92%`\
  \ 人拥有智能手机，而 `50+` 岁的人中只有 `53%` 拥有智能手机。到 `2018` 年，Pew 研究人员发现美国 `18–34` 岁人群的手机拥有率已上升至\
  \ `95%`，`50 岁`以上为 `67%`。研究指出，韩国、以色列和荷兰等国家的拥有率更高。这种高拥有率利用带有摄像头等嵌入设备的设备捕捉信息，同时也通过口头以及短信、聊天和电子邮件等技术进行信息的交换。智能手机与万维网及社交媒体的集成提供了丰富且大量的痕迹，这些痕迹可能令数字取证调查人员感兴趣。\n\
  \n大多数手机和配备摄像头的移动设备都具有 GPS 功能。这允许相机将拍摄地点的 GPS 坐标整合到图像文件中。来自手机或监控系统的图像和视频分析是一个爆炸式增长的领域。图像通常需要增强以获得所需的细节，而这种图形方面的专业知识是一项需要培训和技术相结合的技能。\n\
  \n向云环境的移动正改变着数字取证世界。云计算使用来自池的计算和存储资源。池化资源可能来自 `Apple`、`Google` 或 `Dropbox` 等第三方云提供商。第三方通常在许多机构之间共享池化资源。同样，用户可以将其云空间与其他用户共享。云架构的一个关键优势是，如果签约个人或组织短期内需要额外资源，可以从云提供商处租赁资源。当他们不再需要这些资源时，只需恢复到较少资源即可。这通过消除购买短期使用设备的需求为组织节省了资金。\n\
  \n\n\n\n### 云取证中的场景\n\n- **场景 1**：如果云存储设备上的数据在重新投入使用时被删除但未被擦除，那么不具备访问权限的人员有可能重构并访问之前存在于设备上的数据。\n\
  - **场景 2**：如果云存储中的数据在重新投入使用时被删除并擦除，则无法恢复数据或取证——特别是当该存储资源已被另一个实体占用时。\n- **场景 3**：当\
  \ `#C16_chapter11.xhtml#chapter11` 正在被积极使用或处于分配给其他用途的过程中，确定谁有权访问它可能非常困难。需要考虑的可能具有访问权限的潜在包括合同方、合同方共享权限的人员以及云提供商的支持人员。\n\
  \n云环境还意味着取证可能不再包含在单一设备上，这使得发现取证的来源变得复杂。云的本质特征是资源可以被短时间使用然后重新投入使用，这意味着取证在这一刻还存在，下一刻就消失了。犯罪分子可以租赁类似于场景\
  \ 2 中概述的云资源。一旦犯罪者用完这些资源，证据就会被擦除，资源会被他人使用，很可能完全销毁证据轨迹。这种情况多年来一直以僵尸网络和类似技术的形式出现。云计算的进步允许将恶意活动提升到一个全新的水平，这使得取证技术的进步变得更加至关重要。\n\
  \n### 反取证\n\n反取证是试图隐藏、破坏或更改取证结果，以防止通过取证分析对其进行重构。使用反取证技术可以使取证重构变得困难甚至不可能。许多工具的创建是为了为使用高强度算法和技术的个人提供安全。目前几乎没有什么能阻止这些工具被用于不正当意图的活动，这可能会阻碍取证工作。即使已经开发了应对这些工具的方法，击败这些工具和技术所需的时间计算机处理能力通常也是高不可及的。\n\
  \n另一个方面与其说是一种趋势，不如说是世界变得越来越小的证据，即通过便捷的连接所实现的国际化。语言和文化影响，以及犯罪分子在实施违法行为时处于不同国家的能力，给调查人员带来了诸多挑战。极少的技术类学位课程要求精通外语，这可能从从初就阻碍调查。外语和方言在理解诸如\
  \ `e-mail` 等通信内容方面带来了许多挑战，而且俚语和习语表达引入了额外的困难。在一定程度上由于数字设备、互联网使用和网络连接的普及，这些挑战可能只会增加。\n\
  \n### 全球管辖权挑战\n\n连接的全球性带来了其他挑战。存在需要处理的管辖权和合作问题。即使在美国，一个案件在某个县可能被解释为重罪，而在另一个县可能被解释为轻罪，而州界甚至都没有跨越。跨州界或国际边界的犯罪处理起来要困难得多。犯罪分子知道在情况下哪些国家可能会合作，并据此制定计划。服务器通常托管在对特定活动法律松散或缺乏执法的国家。非法在线赌博服务器通常托管在拉丁美洲国家（Menn，2010）。\n\
  \n### 虚拟化与云架构\n\n为了使情况变得更加复杂，使用虚拟技术后服务器的位置可能会迅速变化。虚拟化允许一台物理计算机在其内部运行多个逻辑计算机。一个粗略的例子是某人在家用个人电脑上设置了多个账户。小约翰登录账户，有自己的屏幕背景和配置特征。斯特芬妮使用她的账户登录同一台电脑，并使用独立于小约翰的配置。虚拟化将此更进一步，因为操作系统可以在一台计算机或云上的不同位置安装多次，并且多个安装版本可以同时独立地运行。虚拟化在企业计算机环境中已经存在了几十年，但最近的进展降低了成本和复杂性，使其被非常广泛的人群使用。这些虚拟化能力支持向云架构迁移。个人可以创建一个虚拟机，并可能在几分钟内在计算机甚至国家之间移动或复制它。这在数字取证环境中的影响是巨大的。\n\
  \n### 存储的演变\n\n计算机取证通常关注计算机硬盘等存储介质。硬盘容量正在迅速增加，其他存储技术也在演进。由于具有卓越的访问速度，闪存和固态硬盘（`SSD`）取代了硬盘。Bell\
  \ 和 Boddington (2010) 发现 `SSD` 可以干扰数字取证技术。同样，Wei 等人 (2011) 发现传统的硬盘清理技术对 `SSD` 是无效的。计算机技术将继续演进，这些例子说明取证员必须随着其运行环境的范式演进而演进。除了信息源数量快速增加外，我和章节贡献者\
  \ Jason Otting 发现设备锁定、加密以及应用程序的快速发展和普及是我们在领域看到的特定趋势。这些发现已由数字取证厂商 `Cellebrite` 发布的\
  \ 2020 年数字智能行业报告证实（`Cellebrite`，2020）。我们看到的另一个未在 `Cellebrite` 报告中的趋势是涉及移动设备恶意软件的案件激增，包括作为入侵手段。\n\
  \n虽然还有许多可以涉及的调查方面，但一旦获得了设备或计算机的访问权限，数据的爆炸和存储能力的带来了许多挑战。个人可以以低于 50 美元的价格购买数 TB 的硬盘。这使得存储数\
  \ TB 数据的能力进入了惊人的人群。云源可能使识别内容创建和确定访问权限变得困难。它还意味着企业可以创建以前无法想象的大型数据库和数据仓库。\n\n\n\n\n\
  \n### 数字取证调查员可用的资源\n\n在开始描述某些工具和技术之前，我想先介绍一些可用的组织和其他资源。正式培训是最重要的考虑因素之一。在法律诉讼（如法庭案件）中，调查员的专业能力将是首要评估因素之一。如果调查员缺乏或没有目前相关的专业培训或认证，案件的结果可能会受到质疑。大多数供应商都提供关于其工具的培训，而且许多会议和信息安全组织也提供培训机会。关于什么种标准能让某人成为数字取证专家，这一问题的定义差异很大。我参加过多个法庭案件，在这些中，执法部门的人员被认定为专家，而他们唯一的正式培训仅仅是某个取证工具供应商提供的为期几天的课程。除了执法部门的认证外，他们在高中学历之外没有接受过任何其他培训。这是一个问题，因为计算机科学家在参加了几天的执法培训后不太可能被认定为执法专家，但执法部门的人员在接受了几天培训后往往就能认定为数字取证专家。这是一个重大的问题，因为它可能导致对证据的误读，从而不当地影响案件的结论。\n\
  \n在许多情况下，协助调查员的在线资源是最具价值的。知识库和虚拟社区在解决调查员遇到的问题时是无比拟的。供应商通常提供一个可以搜索的公告板，该产品的用户经常出没。开源工具通常有非常有热情的支持小组。社交网络在获取联系方面非常有价值，这些联系可能有助于对问题提供见解。国际信息系统安全认证联盟\
  \ (ISC²) 等组织提供了与数字取证互补领域的培训、测试和认证。联邦政府有多种计划，如 InfraGard 以及通过国土安全部提供的机会，这些都可能非常有益。[Search.org](http://Search.org)\
  \ 是我发现的许多组织之一，我经常利用它们提供的免费在线资源。\n\n许多大学都有专门从事数字取证的研究小组，他们可能愿意提供帮助。咨询哪所大学或研究小组取决于调查员正在处理的案件类型或情况。例如，如果案件涉及事件响应，卡内基·梅隆大学的\
  \ `CERT` 可能是一个宝贵的资源。但如果事件涉及从受损介质中恢复数据，联系另一大学可能更合适。同样重要的是要意识到，顶尖的研究大学并非唯一的选择。较小大学的研究人员可能比那些以研究为首要目标的大学的研究人员拥有更广泛的接触和实地经验。穿过这个迷宫的一种好方法是寻找第三方参考，例如\
  \ `NSA`。如果大学符合某些标准，`NSA` 会将其指定为“学术卓越中心”，大多数在数字取证领域有重要影响的大学都通过了这一认证过程。此外，`NSA` 认证包含不同的重点领域，这可以进一步帮助寻找潜在资源。\n\
  \n有许多工具和技术可以协助取证鉴定员应对上述描述的挑战。第 3 章 讨论了工具和技术，以及它们如何融入数字取证调查的整体方案中。既有市售的工具，也有开源工具。某些工具非常专业，专注于良好地完成一项特定任务，而其他工具则试图从更广泛的视角解决问题。通常会发生“跳跃式”的情况，某个特定工具的新版本会超过其竞争对手。短之后，竞争对手可能会推出新版本并成为领先者，直到下一次跳跃的发生。因此，我不会尝试对特定的工具和技术进行排名，也不会提供关于如何使用工具执行特定操作的详细说明。然而，我坚信要为自己和任何其他人留下可以遵循的“足迹”。因此，我不犹豫于描述我使用工具的经验。我希望能够指出我遇到过的“坑”，这样你们就可以避开它们或至少为此做好准备。\n\
  \n## 结论\n\n数字取证是一个快速发展的领域，面临着许多挑战和逆风。机会是无限的，但它们并不适合意志薄弱的人。挫败感是常见的常伴，因此坚持下去的能力和心态是一个调查员应该具备的关键特征。一个需要被人教如何做每件事的人可能需要重新考虑他们的职业选择。积极的态度至关重要，但调查员不需要孤军奋战。各种资源可提供协助，大多数通过了学习曲线获得精能力的调查员都非常渴望帮助他人做到同样。。通常，他们也有其他人可以依靠，所以一旦你在别人的帮助下达到了专家水平，请不要忘记回报他人。\n\
