  \n作证可能是一种奇怪的经历。要意识到律师只会问他们自己有答案或理论的问题，所以准备工作应该包括对各种情况的准备。另一个需要记住的是，你可能只了解案件的一小部分，当你到达法庭时，你会发现自己所处的环境与你想象的完全不同。由于案件的现实与你预期的大不相同，怀疑自己为什么会出现在那里也不为过分。如果案件涉及陪审团，那么在回答时将注意力转向他们。尽可能与许多人进行眼神交流。\n\
  \n当被要求作证时，你可能会被问几个与案件核心主题几乎没有关系的问题。每个案件都可能涉及对你专业知识的挑战以及试图诋毁你的信誉。有时，对方律师可能会通过进入一段无聊的未知领域的冒险来试图模糊你的证词，以此让陪审团昏睡或将细节埋没在杂丛中。通常，法庭诉讼是一个你被提问并进行回答的环境。你不一定有机会说出你想说的一切，这可能会让人非常沮丧。通过参加法庭审判和熟悉谁会出现在法庭上来积累一些经验。彻底审阅你的笔记，确保你已准备好应对恐吓或歪曲的尝试。一系列引导你回答“是”或“否”的问题通常以“那么你会说……？”开头。\n\
  \n## Dr.Otting 博士对刑事案件证词的思考 (C02a_toc.xhtml#rsecc008_5)\n\n在法庭作证是任何数字取证分析师工作的一部分，刑事证言通常与民事质证略有不同，正如上文\
  \ `Dr. Gogolin` 所审核的。在刑事法庭中，分析师经常会接受 `Voir Dire`，这是一个关于其背景的法律程序。\n\n以专家身份作证允许你提供基于意见的证言，这在刑事诉讼中经常发生。最好的做法是陈述分析事实，并仅在要求时提供意见，这在刑事审判中是一个重要方面。在这个过程中，留出足够的时间讨论你的教育背景、培训和经验。成为专家需要时间，不要急于求成，在达到目标之前不要感到自己不足，只需不断学习并为此努力。\n\
  \n在现场法庭作证时，有几点需要记住。学习！！！你被允许携带报告以备参考，但你应该熟悉报告中的事实，并仅在绝对必要时才查阅。试着放松。我已经作证过很多次，但在走向证台时有时仍感到紧张。分析师必须记住呼吸，清晰且冷静地说话。说话时，面对陪审团并与他们所有人进行眼神交流，让他们知道你是在对他们说话。\n\
  \n## Archiving (C02a_toc.xhtml#rsecc008_6)\n\n\n\n\n一旦案件提交，即可进行归档。案件卷宗、图像、报告、通信往来和其他文档都需要成为这一过程的一部分。调查员可以做一些最终笔记，以帮助恢复记忆或简单地结束文档编制工作。一个经常被忽视的点是，用于该案件的工具也需要归档。如果你需要审查几年前的案件，却无法在当前版本的工具中调出或复现结果，这种情况是非常不利的。单单这一点就可能为成功的上诉奠定基础。我倾向于使用外部\
  \ USB 硬盘进行归档。保留一台旧电脑以处理旧案件也是一个好主意，因为新版本的操作系统可能不支持已归档的工具集。按日期许可的取证软件可能会出现问题，因为如果许可许可没有得到维护，它们可能无法运行。更令人担忧的是，取证软件供应商可能会停止运营，导致你无法检索之前存档的案件。最终，某些案件可能会达到可以删除或销毁归档信息的阶段。最好拥有一项经过法律审查的政策，规定何时以及是否可以删除或销毁案件信息。\n\
  \n## 总结\n\n所提交的信息和报告旨在作为通用指南，提供关于数字取证报告应包含什么以及如何呈现的思路。案件各不相同，报告的要求也各不相同。本章的重点在于，你需要确保包含基本信息以形成一份有效的报告，最重要的是，要特别注意准确性和伦理规范——记住，人们的生命取决于我们工作的结果。\n\
  \n# 第 9 章 社交媒体取证\n\n## 引言\n随着 Web 2.0 的出现以及用户生成内容和协作的引入，了一系列基于互联网的网站和工具，统称为社交媒体。社交媒体是指允许个人与他人通信、协作并建立社区的基于互联网的技术工具。社交媒体有多个类别，每种类别都为其用户提供不同的信息和功能。上述所有社交媒体网站和技术的共同元素是个人用户发布、创建和链接的海量信息。这些数据集合为取证调查人员提供了无价的资源，在各种调查和分析中都大有用。取证调查涉及寻找数字证据和信息，以支持由执法人员、军事组织、内部调查员、私家侦探和研究人员进行的调查。当我们考虑社交媒体的取证调查时，我们通常关注几个关键问题：我们如何追踪数据和信息通过社交媒体网站和技术的流动？我们如何通过社交媒体追踪人员、他们在组织结构中的角色和位置，以及他们的知识和信息？在传统的数字取证中，会对一个或多个计算机设备进行证据或相关信息的检查。重点主要在单一介质——计算机上。在社交媒体取证中，重点要广泛得多。一个或多个感兴趣的人可以在任何数量的社交媒体网站上使用任何数量的社交媒体技术发布信息。社交媒体取证其本质也将涉及程度的社交网络分析，其中对组织结构和关键人物进行检查和识别。在进行社交媒体取证检查时，在寻找证据或相关信息时保持广泛的视野是非常重要的。\n\
  \n## 社交媒体简介\n随着 Web 2.0 的出现以及用户生成内容和协作的引入，了一系列基于互联网的网站和工具，统称为社交媒体。社交媒体是指允许个人与他人通信、协作并建立社区的基于互联网的技术工具。社交媒体有多个类别，每种类别都为其用户提供不同的信息和功能。我们将回顾最常用社交媒体工具和网站的一些基本元素。\n\
  \n### 社交网络\n如 Facebook ([www.Facebook.com]()) 这样的社交网络网站利用“朋友”作为一种网络技术来与他人建立联系。朋友在他们的“主板”上发布照片、评论、视频和位置。Facebook\
  \ 用户可以对朋友发布在主板上的帖子进行“点赞”或“评论”。Facebook 用户还可以加入按城市、工作场所、学校、地区或任何其他感兴趣的话组织的网络。Facebook\
  \ 登录界面如图 9.1 所示。Facebook 主板的示例如图 9.2 所示。\n\n![Figure 9.1 Facebook login screen –\
  \ https://www.facebook.com/](img/file34.jpg)\n*Figure 9.1* Facebook 登录界面 – [https://www.facebook.com/].\n\
  \n![Figure 9.2 Example of a Facebook wall.](img/file35.jpg)\n*Figure 9.2*  Facebook\
  \ 主板的示例。\n\nInstagram ([www.instagram.com]()) 也是一种常见的社交网络服务，它包含了图片、评论和视频，供“关注者”保持联系并获取更新。Instagram\
  \ 使用话题标签 (#) 来对主题或内容进行分类。Instagram 使用私信（Direct Messages）作为用户保持直接联系的方式。Instagram\
  \ 登录界面如图 9.3 所示。Instagram 页面的示例如图 9.4 所示。\n\n![Figure 9.3 Instagram login screen\
  \ – https://www.instagram.com/](img/file36.jpg)\n*Figure 9.3* Instagram 登录界面 – [https://www.instagram.com/].\n\
  \n![Figure 9.4 Example of an Instagram page.](img/file37.jpg)\n*Figure 9.4* Instagram\
  \ 页面的示例。\n\nLinkedIn ([www.linkedin.com]()) 是一个社交媒体环境，用户可以在其中创建个人简介并发布更新，通知“联系人”他们的当前活动、创业和/或职位。它包含了其他社交媒体工具，如消息、电子邮件、视频聊天、位置识别和多媒体内容的发布。用户可以选择选择地添加朋友、关注者和联系人。\n\
  \n### 微博客\n微博客与博客的区别在于，它允许用户使用非常有限的文本空间来创建帖子。最著名的微博客工具是 Twitter。Twitter ([www.twitter.com]())是一项免费的微博客服务，允许用户发送和接收被称为“推文”（tweets）的消息。推文是最多\
  \ 280 个字符的文本帖子，显示在作者的个人资料页上，并发送给被称为“关注者”的作者订阅者。Twitter 页面如图 9.5 所示。\n\n![Figure\
  \ 9.5 Example of a Twitter page.](img/file38.jpg)\n*Figure 9.5* Twitter 页面的示例。\n\
  \n### 多媒体共享\n互联网已成为共享用户创建的多媒体内容（如照片和视频）的中心仓库。TikTok ([www.tiktok.com]())是一个流行的视频分享应用，用户可以在其中对视频进行评论和点赞。TikTok\
  \ 页面的示例如图 9.6 所示。\n\n![Figure 9.6 Example of a TikTok page.](img/file39.jpg)\n*Figure\
  \ 9.6* TikTok 页面的示例。\n\n\n\nYouTube ([www.youtube.com](http://www.youtube.com))\
  \ 是一个发布用户生成视频的社交媒体网站。多媒体共享网站的一个共同特征是其他用户可以对内容的兴趣程度或质量进行评分或分类。这种用户评分系统提供的信息使得某些内容能够迅速走红。\n\
  \n### 即时消息与通信\n\n`Direct messaging`（私信）和 `instant messaging`（即时消息）是社交媒体应用的常用组件。即时消息是指直接连接或信息应用其他用户的方法。Facebook\
  \ 使用 `Facebook Messenger` 作为其即时消息应用。Instagram 也有 `Direct Message`（直接消息）组件。其他应用包括\
  \ `Google Hangouts` ([hangouts.google.com](http://hangouts.google.com))、`Slack`\
  \ ([slack.com](http://slack.com))、`WhatsApp` ([whatsapp.com](http://whatsapp.com))、`Skype`\
  \ ([skype.com](http://skype.com))、`Snapchat` ([snapchat.com](http://snapchat.com))\
  \ 以及 `Microsoft Teams` ([Microsoft-365.com](http://Microsoft-365.com))。\n\n`Internet-based\
  \ e-mail`（基于互联网的电子邮件）涉及通过互联网向用户发送和接收消息、附件文档和多媒体内容。有多个电子邮件提供商，但最常见和流行的提供商是 `Google`\
  \ 和 `Microsoft`。\n\n### 博客\n\n`blog`（博客/日志）是由个人或组织维护的社交媒体网站，定期发布对事件的评论或描述。博客文章通常按时间倒序序显示。许多博客对特定主题提供评论；另一些则作为更具个人性质的在线日记。典型的博客使用文本、图像、指向其他博客的链接，以及与其主题相关的网站和其他媒体。博客阅读者能够留评论的能力被认为是通过博客建立互动和关系的重要组成部分。还有特定的博客搜索引擎，如\
  \ `Technorati` ([`technorati.com`](http://technorati.com)) 和 `Digg` ([`digg.com`](http://digg.com))，它们允许用户对博客文章进行搜索。\n\
  \n### 活动协调\n\n互联网可以策划具有共同兴趣的用户聚会。一种 `event coordination`（活动协调）社交媒体工具是 `Meetup` ([www.meetup.com](http://www.meetup.com))，这是一个在线门户网站，促进世界各地各线下小组聚会。它允许成员寻找并加入由共同兴趣统一的小组，例如政治、书籍、游戏、电影、健康、宠物、职业或爱好。\n\
  \n### 地位识别\n\n社交媒体的另一个补充是像 `Foursquare` ([foursqare.com](http://foursqare.com))、`Swarm`\
  \ ([swarm.com](http://swarm.com)) 和 `Pokemon Go` ([pokemongo.com](http://pokemongo.com))\
  \ 等提供者利用技术，通过移动设备的 `GPS` 坐标来识别并记录用户在任何特定时刻的地点。这些工具被称为 `location-based`（基于位置的）技术。在许多情况下，这些特定用户的的位置信息随后会被使用。\n\
  \n### 搜索\n\n在互联网上搜索项目已成为最受欢迎的活动之一。最常见的搜索引擎包括 `Google` ([www.google.com](http://www.google.com))、`Bing`\
  \ ([www.bing.com](http://www.bing.com))、`Yahoo` ([www.yahoo.com](http://www.yahoo.com))、`DuckDuckGo`\
  \ ([www.duckduckgo.com](http://www.duckduckgo.com)) 以及 `Baidu` ([www.baidu.com](http://www.baidu.com))。还有其他专注于内容的专门搜索引擎。\n\
  \n### Wiki\n\n`wiki`（维基）是一个创建用以支持用户协作开发的网站。最常见的 wiki 是 `Wikipedia` ([www.wikipedia.org](http://www.wikipedia.org))。根据访问权限的大小，用户可以添加新内容或修改现有内容。Wiki\
  \ 会记录每次编辑，以便可以恢复页面。\n\n### 网络会议\n\n`Web conferencing`（网络会议）是一种用于连接不同地点参与者的技术工具。网络会议软件可以提供多种功能，包括文字聊天、视频会议、桌面共享、文件共享、投票和讨论会议。一些网络会议工具允许对会议进行记录和保存。网络会议的示例包括：`Zoom`\
  \ ([zoom.com](http://zoom.com))、`GoToMeeting` ([gotomeeting.com](http://gotomeeting.com))、`FaceTime`\
  \ ([apps.apple.com](http://apps.apple.com)) 以及 `Skype` ([skype.com](http://skype.com))。\n\
  \n### 虚拟世界\n\n`Virtual worlds`（虚拟世界）是使用计算机技术创建的数字世界。虚拟世界通常模拟现实世界的元素，如建筑、道路、树和其他环境元素。虚拟世界的参与者使用\
  \ `avatars`（虚拟化）代表自己。虚拟像是类似于人类、动物或神话生物的图形角色。虚拟世界允许多个用户共享一个空间，该空间采用各种二维和三维设计的视觉格式。沉浸感是虚拟世界的一个重要方面。参与者越觉得自己是数字创建世界的一部分，他们就越会互动并参与虚拟世界的活动。`Second\
  \ Life` 是著名的虚拟世界，为其用户提供了创建自己环境的机会。此外，像 `World of Warcraft`（魔兽世界）这样的游戏也被认为是虚拟世界。\n\
  \n### 社交媒体取证\n\n上述所有社交媒体网站和技术最共同的元素是发布、创建和链接到个人用户的海量信息。这些数据集合为法医调查人员提供了无价的资源，适用于各种调查和分析。现在，让我们检查各种社交媒体工具，重点关注如何使用它们来进行法医调查。\n\
  \n\n\n传统的数字取证与社交媒体取证之间存在一些重要的区别，这些区别值得引起关注。在传统的数字取证案件中，会对一个或多个计算机设备进行检查以获取证据或相关信息。其重点主要在于单一媒介，即计算机。此外，在传统的数字取证中，重点通常是单个个人或一小群。\n\
  \n然而，在社交媒体取证中，关注范围要广泛得多。一个或多个感兴趣的人可能会在任何社交媒体网站上发布信息，并使用任何社交媒体技术。此外，社交媒体经常被用于组织活动，其中某些活动可能具有不法或敌意的意图。社交媒体取证分析其本质还涉及某种程度的社交网络分析，其中会对组织结构和关键人物进行检查和识别。\n\
  \n在进行社交媒体取证检查时，在搜索证据或相关信息时，扩大搜索范围非常重要。一些常见的社交媒体犯罪类型包括在线威胁、跟踪、网络欺凌、黑客攻击、欺诈、非法购买、犯罪活动视频以及假期抢劫（Khoury,\
  \ 2017）。现在我们来看一些使用社交媒体取证进行社交媒体调查的案例，包括街头帮派、恐怖组织和白领犯罪。同样重要的是，匿名性（预付费手机、分布式网络）可能在复杂取证调查中发挥作用（Rocha\
  \ et al., 2016）。\n\n### 街头帮派\n\n街头帮派是组织的个人群体，通常年龄在 21 岁以下，遵循相对严格的行为准则。加入帮派可能涉及成年礼，要求他们通过对其他帮派的犯罪活动和攻击来证明自己的忠诚和勇猛（Walker,\
  \ 2011）。在国家的许多地区，街头帮派被认为是大量犯罪的来源，包括毒品、卖淫、抢劫和袭击。街头帮派的领导通常非常有权力，并指导其成员的活动。他们与执行犯罪的成员之间往往存在一道匿名之墙。\n\
  \n街头帮派经常使用各种社交媒体工具在成员之间进行通信并策划活动。两种常用的社交媒体工具是 Facebook 和 Twitter（Watkins, 2010）。Facebook\
  \ 用于与整个帮派进行通信，通常通过使用 `Facebook Groups` 功能。帮派成员可能会发布有关其活动的照片、视频或其他信息，以获得认可或关注。帮派经常使用\
  \ Twitter 发送关于会议地点、犯罪地点或其他帮派相关活动的消息（Nurwisah, 2010）。帮派成员在使用这些社交媒体工具时通常会使用化名和特殊的电子邮件地址。最后，使用移动技术访问社交媒体网站和工具也是一种常用方法。\n\
  \n第一步是为帮派调查识别潜在的社交媒体证据和信息来源。这些来源包括 Facebook、Twitter、基于位置的识别、多媒体照片和视频、电子邮件以及移动访问。这些社交媒体源的每一个都为取证调查和分析提供了途径。\n\
  \n`Facebook` 可以提供各种类型的信息来协助社交媒体调查（Nurwisah, 2010）。Facebook 调查的首要目标是尝试以朋友或小组成员的身份查看发布的信息。在最理想的调查中，执法人员能够被接受为\
  \ Facebook “朋友”和小组成员（Moilistina, 2011）。通过使用用户个人资料，帮派成员可以发布各种类型的信息，这些信息可能导致他们的个人身份，例如对活动或地点的引用。另一个\
  \ Facebook 朋友或小组成员就能看到这些信息。\n\n然而，即使调查人员没有建立“友谊”或小组成员关系，还有两种取证调查方法。第一是识别帮派一个或多个成员的用户名和密码。其次，使用\
  \ Facebook 中的小组为调查和识别帮派成员提供了途径。有几种技术可以用于获取社交媒体网站的用户名和密码。一种常见的方法是在 WiFi 区域建立一个非法无线接入点，并捕获通过该网络的消息。这可能是获取帮派成员身份的一种非常有效的方法。警察只需将笔记本电脑放置在帮派成员常用的\
  \ WiFi 会合点附近，如咖啡馆或快餐店。当帮派成员发布消息时，他们的传输将被根据法律授权的执法人员捕捉。\n\n另一种方法是获取帮派成员的电子邮件地址，并使用该地址通过\
  \ `Forgot Password` 函数访问 Facebook（Rafay Hacking Articles, 2010）。第三种方法简单地使用现有的许多密码破解工具来破解密码。使用这些任何一种技术，一旦知道了用户名和密码组合，就可以严密跟踪\
  \ Facebook 上关联帮派成员发布的消息，以解决或预防犯罪的发生。\n\n通过 Facebook 识别帮派成员的第二种方法是通过小组（Groups）和指定网站。2010\
  \ 年的一项研究（Wondracek, 2010）描述了一种在社交网络小组成员访问网站位置时揭露其身份的技术。他们的研究发现，社交网络网站存储的关于用户小组身份的信息足以唯一识别小组成员。所描述的技术使用\
  \ `浏览器历史记录窃取攻击` 来实现这一目标。结果，当社交网络用户访问指定网站时，该网站可以启动这种 `去匿名攻击` 并获取访问者的身份（同上）。\n\n帮派还使用\
  \ Twitter 在其组织内部快速传递短消息，例如会议或犯罪地点。与 Facebook 类似，这些 Twitter 账户可以通过破解密码并访问账户来获取帮派成员的身份。密码破解技术在破解\
  \ Twitter 方面非常成功（Jeffries, 2011）。\n\nTwitter、Facebook、Instagram 和 TikTok 是通过发布到这些社交媒体网站分享照片的常见媒介。许多人并没有意识到，如今大多数手机拍摄的照片会将拍摄地点、日期和时间信息作为照片元数据存储其中。当照片发布到\
  \ Facebook 或 Twitter 等社交媒体网站时，这些元数据就会变得可用。结果，通过检查照片的属性，可以确定其位置的日期、时间和经纬度（Ulbricht,\
  \ 2011）。位置、日期时间和信息作为 `EXIF (Exchangeable Image File)` 的一部分存储在图片中，通常存储在 JPEG 和 TIFF\
  \ 图像中（Windows Guides, 2011）。当执法人员调查帮派成员的犯罪活动时，这些信息被证明是非常有帮助的。\n\n\n\n> 恐怖主义组织传统上寻求利用新型和替代媒体，特别是在互联网上，来传播他们的宣传，并在较小范围内，为潜在的支持者提供行动和战术指导……作为这一趋势的一部分，圣战支持者和圣战战士越来越多地使用\
  \ Facebook（美国及全球范围内最大、最流行且多样化的社交网络网站之一）来传播行动信息……\n\n> (Public Intelligence, 2010,\
  \ p. 1).\n\n恐怖主义组织在利用 `Facebook` 和其他社交媒体网站时带来的另一个挑战是使用了非英语语言，如阿拉伯语、乌尔都语、印度尼西亚语和其他较为人知的语言（同上）。\n\
  \n恐怖主义组织利用 `Facebook` 和 `Twitter` 等社交媒体网站作为与成员及其他共同目标组织的手段（Public Intelligence,\
  \ 2010; Washington Times, 2011）。估计发现，90% 的当前在线恐怖活动发生在社交网络网站（反恐主义实施任务组 (CTITF), 2011）。社交媒体也成为攻击发生时的关键新闻来源（Innes,\
  \ 2015）。他们利用社交媒体分享行动和战术信息，例如炸弹配方和 `AK-47` 武器的维护。恐怖组织利用社交媒体推广他们的信息，并通过链接到其他极端组织和网站，鼓励向新成员传播他们的使命。他们还利用社交媒体进行“为了目标而进行的远程侦察”（Public\
  \ Intelligence, p. 1）。有趣的是，恐怖组织也经常发布关于如何通过虚构数据和新且唯一的密码在社交媒体网站上实现匿名化的信息（同上）。\n\n\
  美国法律禁止被指定的恐怖组织使用社交媒体网站。然而，恐怖分子对社交媒体网站的谨慎且匿名的使用，由于这些网站被许多恐怖组织广泛使用，且缺乏可验证的用户个人简介信息，使得调查人员很难通过\
  \ `Facebook` 隔离并评估可靠的恐怖威胁（Public Intelligence, 2010）。\n\n然而，目前确实有一些活动正在协助对恐怖分子使用社交媒体的调查。亚利桑那大学参与了一项名为“暗网”的研究，该研究使用了多种技术来筛选恐怖组织在社交媒体网站上发布的大量帖子。他们利用这些各种帖子来识别不同恐怖组织和活动之间的关系与链接（[KVOA.Com](http://KVOA.Com),\
  \ 2011）。欧洲刑警组织的“Check the Web”项目也开展了类似的项目（反恐主义实施任务组 (CTITF), 2011）。\n\n值得注意的是，恐怖组织还利用虚拟世界作为组织和训练的工具（PR\
  \ Newswire, 2011）。诸如 `Second Life` 和 `World of Warcraft` 等虚拟世界已成为恐怖组织的模拟训练环境，使用真实武器的虚拟表征（反恐主义实施任务组\
  \ (CTITF), 2011）。据预测，除了继续将虚拟世界用于组织和训练外，它们还将用于筹款、恐怖融资和洗钱（同上）。几年前，美国高级研究计划署（IARPA）发布了一项研究提案请求，被称为\
  \ `Reynard` 项目。该请求的重点是研究识别虚拟世界和多人在线游戏（MMOG）中与用户现实世界特征相关的行为指标，目标是能够自动检测虚拟世界中的“可疑行为”（Mountjoy,\
  \ 2008）。\n\n> 从现实世界（RW）特征反映在虚拟世界（VW）行为中的假设出发，IARPA Reynard 程序旨在识别虚拟世界和多人在线游戏（MMOGs）中与用户现实世界特征相关的行为指标……感兴趣的属性包括：性别、大致年龄、经济状况、受教育程度、职业、意识形态或“世界观”、影响程度、“数字原住民”与“数字移民”、大致的物理地理位置、母语和文化。\n\
  \n> (IARPA, 2020)。\n\n随着可用的新社交媒体工具数量增加且复杂性不断提高，对恐怖分子使用社交媒体工具的取证调查仍然是一项挑战。尽管通过暗网、Check\
  \ the Web 和 Reynard 项目等努力正在取得进展，但执法部门认为有必要开展更、更具全球范围的努力，将法律、技术和意识形态因素结合到反恐怖主义及其对社交媒体的使用斗争中（反恐主义实施任务组\
  \ (CTITF), 2011）。\n\n### 白领犯罪\n\n调查人员通常将社交媒体网站作为他们调查各种白领犯罪的一部分。例如，保险公司通常将社交媒体网站作为与保险欺诈相关的信息来源之一。揭示与医疗索赔或财产损失索赔相关相反信息的帖子，为保险公司提供了打击虚假索赔的证据。在一个案例中，一名女性作证她因受伤而失业，但她的\
  \ `Facebook` 帖子揭露了新工作和薪信息（Duhl, 2011）。然而，在大多数情况下，法律阻止保险调查人员采取更具欺骗性的调查手段，例如与被调查人员“好友”（同上）。\n\
  \n除了更严重的犯罪外，社交媒体网站已成为各种调查中常见信息来源。一些律师甚至在使用社交媒体收集有关潜在陪审员的信息（Burdge, 2011）。在大多数情况下，这些信息可以通过社交媒体用户发布的帖子公开获取，不需要额外使用取证工具。如果需要取证工具，调查人员将不得不获得法律系统的批准才能进行。在所有情况下，新的法院规则都允许律师在取证活动（discovery）中包含对社交媒体信息和帖子的请求（Walker\
  \ et al., 2011）。\n\n> “如 `Facebook` 和 `MySpace` 等社交网络网站已成为雇主、大学招生官和离婚律师进行背景检查的首选场所。凭借这些信息，警察抓住了逃犯，律师损害了证人的信誉……而公司则发现了纸面上完美的申请人从事了非法或仅仅是尴尬的行为（Ethics\
  \ Sage, 2010, p. 1）\n\n此外，社交媒体证据正用于针对大型公司产品责任、人身伤害和就业案件的民事诉讼。社交媒体证据也常用于版权和知识产权案件。\n\
  \n社交媒体提供了一个极其巨大的信息池，其准确程度和预期目的不相同。身份盗窃、欺诈和虚拟跟踪等犯罪变得越来越普遍且破坏性大，如果安全和隐私问题得不到积极且充分解决，目前的互联网形式可能会成为无法逾越的威胁（Gogolin\
  \ et al., 2014）。\n\n取证调查人员需要理解的一个重要点是适用于社交媒体调查场景（如民事诉讼索赔、犯罪调查和恐怖活动）的各种法律法规。调查人员在开始任何调查之前，需要花费大量时间理解他们在社交媒体调查中必须遵循的法律限制（Arshad\
  \ et al., 2019）。\n\n## 摘要\n\n\n\n\n\n我们审查了各种社交媒体工具，并审查了使用这些社交媒体工具实施犯罪或调查犯罪的场景。表\
  \ 9.1 是一张总结表，详细列出了一些社交媒体工具、各方的使用情况以及潜在的调查和应对措施技术。\n\n### 表 9.1 社交媒体总结表\n\n| 社交媒体工具\
  \ | 街头帮派 | 恐怖分子组织 | 白领犯罪 | 调查与应对措施 |\n| --- | --- | --- | --- | --- |\n| 社交网络（例如\
  \ `Facebook`） | * 成员间的通信<br>* 犯罪策划<br>* 发布犯罪活动（如照片） | * 恐怖组织成员间的通信<br>* 招募新成员<br>*\
  \ 与其他恐怖组织的链接<br>* 策划活动<br>* 恐怖主义教育，如制造炸弹和使用武器<br>* 运营数据（如炸弹位置） | * 发布可能揭露欺诈和其他犯罪证据的个人信息\
  \ | * 调查公开披露的数据<br>* 密码识别<br>* 调查小组成员身份<br>* 通过发布的照片获取位置和时间信息<br>* 伪装成小组成员<br>*\
  \ 网络分析（例如 `Dark Room`） |\n| 电子邮件和即时消息 | * 帮派成员间的通信 | * 恐怖组织成员间的通信 | * 可能揭露欺诈和其他犯罪证据的通信\
  \ | * 识别电子邮件用户<br>* 在过程中拦截电子邮件（例如无线访问点）<br>* 传输后分析电子邮件 |\n| 博客 | | * 传播宣传和招募新成员\
  \ | | 发布相反的说服性数据<br>* 识别博客作者和回复者 |\n| 微博客（例如 `Twitter`） | * 成员间的通信<br>* 犯罪策划<br>*\
  \ 发布犯罪活动（如照片） | * 恐怖组织成员间的通信<br>* 策划活动<br>* 运营数据（如炸弹位置） | * 可能揭露欺诈和其他犯罪证据的通信 | *\
  \ 密码识别<br>* 通过发布的照片识别位置和时间信息<br>* 伪装成粉丝 |\n| 位置识别 | * 发布可能与犯罪活动相关的位置信息 | * 发布可能与恐怖活动相关的位置信息\
  \ | * 发布可能揭露欺诈和其他犯罪证据的位置信息 | * 通过 `Foursquare` 等提供商披露的位置<br>* 通过发布的照片获取位置和时间信息 |\n\
  | 事件协调和网络会议 | * 协调帮派成员会议 | * 协调恐怖组织成员及同情者的会议 | | * 伪装成小组的一员 |\n| 多媒体 | * 发布可提供位置、时间、日期和其他信息的多媒体内容<br>*\
  \ 发布可提供犯罪行为证据的多媒体内容 | * 发布可提供位置、时间、日期和其他信息的多媒体内容<br>* 发布可提供恐怖活动证据的多媒体内容<br>* 发布多媒体内容招募新成员或同情者\
  \ | * 发布可提供位置、时间、日期以及欺诈和其他犯罪潜在证据的多媒体内容 | * 发布内容的元数据中包含的用户、位置、时间、日期 |\n| 搜索 | * 搜索与实施犯罪活动相关的内容\
  \ | * 搜索与实施恐怖活动相关的内容 | * 搜索与实施白领犯罪相关的内容 | * 要求提供商披露搜索足迹 |\n| 维基 | | 发布内容招募新成员或同情者\
  \ | | 发布相反信息以瓦解恐怖组织 |\n| 虚拟世界 | | 恐怖会议<br>* 恐怖训练活动 | | 通过行为建模识别恐怖分子<br>* 伪装成小组的一员\
  \ |\n\n如在表 9.1 所示，社交媒体取证调查是强调人员和数据的结合。它依赖于传统的调查方法以及对当前技术和取证工具的掌握。随着社交媒体使用量量的持续增长，它将继续作为取证调查中的主要证据来源之一。\n\
