  \n## 移动端反取证\n\n根据统计，全球至少有 26 亿移动电话用户。中国移动报告称，他们每月新增 600 万新用户。如今，移动设备是紧凑型计算机。移动设备配备了图形化界面、计算资源和连接功能。此类设备存储了更多的个人信息，使其成为取证分析的完美目标（Distefano\
  \ et al., 2010）。一些传统的反取证技术可能不适用于移动世界。出于多种原因，对反取证工具的需求非常紧迫。让我们详细研究一下 Android 操作系统的反取证技术。\n\
  \nDistefano et al. (2010) 描述了 Android 移动平台的不同反取证技术：\n\n*   **移动内部取证工具 (MIAT):**\
  \ 设身于调查者的立场可以帮助我们制定更好的反取证计划。`MIAT` 是一个可以通过 [`miatforensics.org`](http://miatforensics.org)\
  \ 获取的开源移动取证应用。它可以作为一种主动措施，用于发现我们留下的证据/数据。\n*   **利用 Android 特性:** Android 将任何运行的应用程序绑定到安全的\
  \ `Sandbox` 中，如果没有显式权限，它无法与其他应用程序干扰。权限在应用程序安装期间静态定义，在应用程序的生命周期内不会改变。所有应用程序都必须使用开发者证书签名以便与其他应用程序建立交互。例如，我们可以创建一个保护某些文件或文件夹的应用程序。这种保护是在操作系统层面确保的；因此可以作为一种反取证技术。\n\
  *   **私有文件夹:** 我们可以创建一个私有文件夹，只有指定的应用程序可以访问。该文件夹可以存储文本文件和多媒体等。该文件夹将对其他应用程序隐藏，从而实现了一种信息隐写术。\n\
  *   **反取证应用:** `AFDroid` 是一个创建私有文件夹的应用程序，它还允许执行两个进程：\n    *   **证据导出进程 (EEP):**\
  \ 将移动设备上的信息导出到私有位置。\n    *   **证据导入进程 (EIP):** 反转 `EEP` 过程。\n*   **证据导出进程:** [图\
  \ 11.5] 展示了 `EEP` 过程，我们使用 `AFDroid` 导出短信和联系人等信息，并将其导出到安全的 `XML` 文件（私有存储）。\n*   **Honeycomb:**\
  \ 它引入了一个新的 API，支持强制加密存储和密码保护（Hollister, 2011）。Fisher (2011) 报告说 `WhisperCore` 是为移动设备提供加密的替代软件。\n\
  \n    ![图 11.5 Android 平台上的证据导出过程](img/file44.jpg)\n    *图 11.5* Android 平台上的证据导出过程。\n\
