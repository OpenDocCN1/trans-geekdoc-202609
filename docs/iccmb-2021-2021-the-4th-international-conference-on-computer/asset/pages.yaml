    # 1 INTRODUCTION


    This kind of problem often occurs in life. When patients go to the hospital,if
    the doctor wants to know the patient’s previous medical records, he needs to spend
    time reading multiple medical records issued by different hospitals. Due to the
    disadvantages of paper medical records, which are easy to be lost and damaged,
    it is difficult to obtain complete medical records of patients in most cases.Along
    with the development of the Internet and big data technology, informationization
    has gradually toward the medical data on track, but similar to the Electronic
    medical record system (Electronic medical records, EMR), Electronic health record
    system (Electronic health records, EHR), and Personal health record (the Personal
    health records, RHR) this kind of centralized medical data sharing platform, most
    of the management of medical data of the third party, not only easy to encountering
    malicious attacks,Data is tampered, hidden, lost, unable to ensure the security
    and integrity of the data;At the same time, due to the differences in management
    and archiving habits, data sharing among different organizations becomes a problem.Therefore,
    there is an urgent need for a tamper-proof, safe, efficient, transparent and reliable
    technology to solve the current problems in the medical industry.Blockchain, as
    the most concerned emerging technology at present, has become the preferred solution.
    [1]


    Blockchain is a peer-to-peert distributed database, and as the underlying core
    technology of Bitcoin, it has received extensive attention.The core feature of
    blockchain technology is decentralization, that is, each node in the system has
    the same position, there is no super node, the third party management organization
    is abandoned, and each node jointly supervises and maintains this distributed
    bookkeeping book.At the same time, blockchain integration consensus algorithm,
    cryptography principle, distributed storage and other mature technologies are
    used to ensure the security and integrity of data stored on the chain.For example,
    in the blockchain system, the data is packaged into blocks by the structure organized
    as Merkle-tree before being chained. The block head stores the hash value of the
    root. Once a certain position in the tree is slightly modified, the hash value
    in the bulk will change, ensuring the untamability of the data stored on the chain.Blockchain
