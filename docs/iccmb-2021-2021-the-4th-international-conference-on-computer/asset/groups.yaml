    ### 3.2 数据共享流程


    具体流程：


    - (1) 以数据请求者医生为例，将真实身份发送至中央授权机构 CA，并获取 CID。将 CID 发送至各属性授权机构 AA 以获取身份相关属性集 S 和私钥集
    SK。

    - (2) 医生向联盟区块链 Fabric 验证节点集群中的节点发送数据访问请求，其中包括医生的 CID、访问数据的名称和所有者。节点接收到访问请求后，首先验证医生的身份。身份验证通过后，根据被访问数据的名称和所有者在链上检索类交易。找到对应的类交易后，将包含请求内容的相关类交易和医生的
    CID 发送至 IPFS 节点组。

    - (3) IPFS 节点组中的节点首先验证医生的身份。验证通过后，从类交易中提取访问数据对应的 IPFS 哈希值。根据哈希值，在模型中的私有 IPFS 网络中检索患者的完整加密数据。

    - (4) 接收到患者的加密原始医疗数据后，医生使用自身的属性集 S 和与属性相关的密钥对密文进行解密。如果医生的属性值满足患者设定的访问策略，则患者的完整医疗数据将被成功解密。反之，解密失败。


