    # ABSTRACT


    As an important information resource, patients’ medical data can not only help
    them to monitor their physical conditions and check the hidden risks of diseases;it
    an also provide strong evidence for doctor-patient disputes and promote the development
    of medical field.However, most medical institutions use centralized servers to
    centrally manage patients’ electronic medical data.Such centralized servers have
    opaque data storage and are prone to suffer from single point of failure,leading
    to easy tampering or even deletion of medical data.At the same time, different
    standards of data management among medical institutions make it difficult to circulate
    and share data among institutions.The purpose of this paper is to realize efficient
    data sharing and patient access control of medical data under the condition of
    guaranteeing the safe storage of bulk medical data.Combining decentralized blockchain
    technology with distributed file storage platform IPFS, a federated medical blockchain
    data storage access model based on IPFS is proposed.The model uses the multi-privilege
    attribute-base encryption algorithm (MA-ABE) to encrypt the data to ensure the
    safety of the patient’s medical data during transmission and the patient’s ability
    to control their own medical data.Meanwhile the private IPFS network is built
    to improve the upload and download rate of encrypted data.This paper introduces
    the components and principles of the model and elaborates the flow of data upload
    and access.In the mean time, evaluate the performance of the model, summarize
    the advantages and disadvantages of the model and the next research of the paper.


