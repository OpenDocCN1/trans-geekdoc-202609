    ## 基于 IPFS 的联盟医疗区块链数据存储与共享模型


    SHUANG LIU*

    通信与信息工程学院，

    重庆邮电大学，

    重庆 400065，中国；重庆移动通信技术重点实验室，重庆邮电大学(CQUPT)


    HONG TANG

    通信与信息工程学院，

    重庆邮电大学，

    重庆 400065，中国；重庆移动通信技术重点实验室，重庆邮电大学(CQUPT)


    ## 摘要


    作为重要信息资源，患者的医疗数据不仅可以帮助他们监测身体状况并检查疾病的潜在风险；还可以为医患纠纷提供有力证据并促进医疗领域的发展。然而，大多数医疗机构使用集中式服务器集中管理患者的电子医疗数据。这种集中式服务器数据存储不透明，容易出现单点故障，导致医疗数据易被篡改甚至删除。同时，医疗机构之间数据管理标准不一，使得机构间数据流通和共享困难。本文的目的是在保证海量医疗数据安全存储的前提下，实现医疗数据的高效共享和患者访问控制。结合去中心化区块链技术与分布式文件存储平台
    IPFS，提出了一种基于 IPFS 的联邦医疗区块链数据存储访问模型。该模型使用多权限属性基加密算法（MA-ABE）对数据进行加密，以确保患者医疗数据在传输过程中的安全性以及患者对其自身医疗数据的控制能力。同时构建私有
    IPFS 网络以提高加密数据的上传和下载速率。本文介绍了模型组成和原理，并详细阐述了数据上传和访问流程。同时，评估模型的性能，总结模型的优缺点及论文的下一步研究。


    ## CCS CONCEPTS


    - 计算机系统组织；

    - 体系结构；

    - 分布式架构；

    - 点对点架构；


    ## 关键词


    联盟区块链，IPFS，MA-ABE，Fabric，医疗数据存储与共享


    ## ACM 参考格式：


    SHUANG LIU* and HONG TANG. 2021. 基于 IPFS 的联盟医疗区块链数据存储与共享模型. 收录于 2021 年第 4 届管理与商务计算机国际会议
    (ICCMB 2021)，2021 年 1 月 30 日–2 月 1 日，新加坡，新加坡。ACM，纽约，NY，美国，7 页。https://doi.org/10.1145/3450588.3450944


    ## 1 引言


    这种问题在生活中经常发生。当患者去医院时，如果医生想了解患者的既往病历，就需要花费时间阅读不同医院开具的多份病历。由于纸质病历易丢失、损坏等缺点，在大多数情况下很难获得患者的完整病历。随着互联网和大数据技术的发展，医疗数据信息化逐渐步入正轨，但类似于电子病历系统（Electronic
    medical records, EMR）、电子健康记录系统（Electronic health records, EHR）和个人健康记录（Personal
    health records, RHR）这类集中式医疗数据共享平台，大多数医疗数据由第三方管理，不仅容易遭受恶意攻击，数据被篡改、隐藏、丢失，无法保证数据的安全性和完整性；同时，由于管理与归档习惯的差异，不同组织之间的数据共享成为问题。因此，迫切需要一种防篡改、安全、高效、透明且可靠的技术来解决医疗行业当前存在的问题。区块链作为当前最受关注的新兴技术，已成为首选解决方案。[1]


    区块链是一种点对点分布式数据库，作为比特币的底层核心技术，已受到广泛关注。区块链技术的核心特征是去中心化，即系统中每个节点地位相同，没有超级节点，放弃第三方管理机构，每个节点共同监督和维护这本分布式账本。同时，区块链集成共识算法、密码学原理、分布式存储等成熟技术，以确保链上存储数据的安全性和完整性。例如，在区块链系统中，数据在上链前按
    Merkle 树组织的结构打包成区块。区块头存储根的哈希值。一旦树中某处稍有修改，区块中的哈希值就会发生变化，确保链上存储数据的不可篡改性。区块链根据控制系统和是否公开信息分为
    [3]。因此，选择 CP-ABE 算法将解密策略嵌入到密文中。每次加密无需知道接收者的身份信息，且当数据发送给多个用户时，无需多次加密，只需设置访问策略进行一次加密，当用户拥有描述策略的否认者属性阈值以上时即可实现解密。然而，在
    CP-ABE 算法中引入单一授权机构 AA 为每个用户分发密钥，很可能导致用户隐私泄露，面对大量请求，单一属性授权机构（AA）的繁重工作量成为提升系统的瓶颈，在链中节点组的每个节点中，使用共识
    PBFT 算法分析交易类型、获得确认，超过三分之二的共识将此类交易打包上链。


