    ## A Consortium Medical Blockchain Data Storage and Sharing Model Based on IPFS


    SHUANG LIU*

    School of Communication and Information Engineering,

    Chongqing University of Posts and Telecommunications,

    Chongqing 400065, China; Chongqing Key Lab of Mobile Communications Technology,
    Chongqing University of Post and Communications(CQUPT)


    HONG TANG

    School of Communication and Information Engineering,

    Chongqing University of Posts and Telecommunications,

    Chongqing 400065, China; Chongqing Key Lab of Mobile Communications Technology,
    Chongqing University of Post and Communications(CQUPT)


    ## ABSTRACT


    As an important information resource, patients’ medical data can not only help
    them to monitor their physical conditions and check the hidden risks of diseases;
    it can also provide strong evidence for doctor-patient disputes and promote the
    development of medical field. However, most medical institutions use centralized
    servers to centrally manage patients’ electronic medical data. Such centralized
    servers have opaque data storage and are prone to suffer from single point of
    failure, leading to easy tampering or even deletion of medical data. At the same
    time, different standards of data management among medical institutions make it
    difficult to circulate and share data among institutions. The purpose of this
    paper is to realize efficient data sharing and patient access control of medical
    data under the condition of guaranteeing the safe storage of bulk medical data.
    Combining decentralized blockchain technology with distributed file storage platform
    IPFS, a federated medical blockchain data storage access model based on IPFS is
    proposed. The model uses the multi-privilege attribute-based encryption algorithm
    (MA-ABE) to encrypt the data to ensure the safety of the patient’s medical data
    during transmission and the patient’s ability to control their own medical data.
    Meanwhile the private IPFS network is built to improve the upload and download
    rate of encrypted data. This paper introduces the components and principles of
    the model and elaborates the flow of data upload and access. In the meantime,
    evaluate the performance of the model, summarize the advantages and disadvantages
    of the model and the next research of the paper.


    ## CCS CONCEPTS


    - Computer systems organization;

    - Architectures;

    - Distributed architectures;

    - Peer-to-peer architectures;


    ## KEYWORDS


    Consortium Blockchain, IPFS, MA-ABE, Fabric, Medical data storage and sharing


    ## ACM Reference Format:


    SHUANG LIU* and HONG TANG. 2021. A Consortium Medical Blockchain Data Storage
    and Sharing Model Based on IPFS. In 2021 The 4th International Conference on Computers
    in Management and Business (ICCMB 2021), January 30–February 01, 2021, Singapore,
    Singapore. ACM, New York, NY, USA, 7 pages. https://doi.org/10.1145/3450588.3450944


    ## 1 INTRODUCTION


    This kind of problem often occurs in life. When patients go to the hospital, if
    the doctor wants to know the patient’s previous medical records, he needs to spend
    time reading multiple medical records issued by different hospitals. Due to the
    disadvantages of paper medical records, which are easy to be lost and damaged,
    it is difficult to obtain complete medical records of patients in most cases.
    Along with the development of the Internet and big data technology, informationization
    has gradually toward the medical data on track, but similar to the Electronic
    medical record system (Electronic medical records, EMR), Electronic health record
    system (Electronic health records, EHR), and Personal health record (the Personal
    health records, RHR) this kind of centralized medical data sharing platform, most
    of the management of medical data of the third party, not only easy to encountering
    malicious attacks, Data is tampered, hidden, lost, unable to ensure the security
    and integrity of the data; At the same time, due to the differences in management
    and archiving habits, data sharing among different organizations becomes a problem.
    Therefore, there is an urgent need for a tamper-proof, safe, efficient, transparent
    and reliable technology to solve the current problems in the medical industry.
    Blockchain, as the most concerned emerging technology at present, has become the
    preferred solution. [1]


    Blockchain is a peer-to-peer distributed database, and as the underlying core
    technology of Bitcoin, it has received extensive attention. The core feature of
    blockchain technology is decentralization, that is, each node in the system has
    the same position, there is no super node, the third party management organization
    is abandoned, and each node jointly supervises and maintains this distributed
    bookkeeping book. At the same time, blockchain integration consensus algorithm,
    cryptography principle, distributed storage and other mature technologies are
    used to ensure the security and integrity of data stored on the chain. For example,
    in the blockchain system, the data is packaged into blocks by the structure organized
    as Merkle-tree before being chained. The block head stores the hash value of the
    root. Once a certain position in the tree is slightly modified, the hash value
    in the block will change, ensuring the untamability of the data stored on the
    chain. Blockchain according to the control system and whether or not the public
    information is divided into [3]. Therefore, CP-ABE algorithm is selected to embed
    the decryption policy into the ciphertext. Each time the encryption does not need
    to know the identity information of the receiver, and when the data is sent to
    multiple users, it does not need to be encrypted for many times. It only needs
    to set the access policy to perform encryption once, and decryption can be realized
    when the user has more than the property threshold of the denier describing the
    policy. However, the introduction of a single authorization agency AA in the CP-ABE
    algorithm to distribute keys for each user is likely to cause user privacy disclosure,
    and in the face of a large number of requests, the heavy workload of a single
    attribute authorization agency (AA) becomes the bottleneck to improve system in
    the chain of each node in the node group, consensus PBFT algorithm is used to
    analyse the types of deals, get confirmed, more than two-thirds of the consensus
    packaged such deals on a chain.


