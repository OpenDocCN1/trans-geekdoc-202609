    95. 94\n96. 95\n97. 96\n98. 97\n99. 98\n99. 99\n\n# 第一部分 决策心理学\n\n## 大脑如何做决策\n\
    \n探索情绪、认知偏差与神经通路在决策制定中的复杂相互作用\n\n### 决策制定的潜在神经过程\n\n神经决策制定是一个迷人的研究领域，它揭示了大脑如何处理信息并最终选择行动方案。大脑的决策区域包含一个网络区域，其中`prefrontal\
    \ cortex`（前额叶皮层）发挥着核心作用。`prefrontal cortex`位于大脑前部，对规划、判断和决策制定等高级认知功能至关重要。\n\n\
    在决策制定过程中，各个大脑区域相互沟通以评估选项、权衡后果并最终确定选择。`prefrontal cortex`与皮层下结构（如`amygdala`（杏仁核，处理情绪）和`striatum`（纹状体，涉及奖励处理和习惯形成））相互作用。大脑区域之间这种错综复杂的相互作用，使得对影响决策的不同因素能进行细致入微的评估。\n\
    \n神经元，特别是多巴胺分泌细胞，在基于奖励的决策中发挥关键作用，当出现有利结果时，它们会发出愉悦或强化的信号。这种强化机制加强了与成功选择相关的连接，塑造了未来的决策倾向。\n\
    \n"
