    # III. RESULTS AND DISCUSSION


    # A. Performance of ANN model


    This section presents the prediction results of proposed models for India. To
    indicate the overall size of the train and test dataset, the ANN model is evaluated
    with 80% and 20% of daily train-test datasets. For this test, the size is well-suited
    for both cumulative confirmed cases and cumulative deceased cases. The lowest
    RMSE is obtained when trained with 80% data and with 20% data, while the lowest
    RMSE is obtained when the ANN is trained with 30% data, as shown in Fig. 2. Table
    III shows the performance of the proposed ANN model in terms of RMSE, MAE and
    MAPE.


