    # C. Impact of lockdown on the COVID-19


    The COVID-19 outbreak has led to the implementation of various restrictions by
    the Government of India as a measure to reduce human transmission of the disease
    (COVID-19, in 2020). The government implemented a complete lockdown across the
    nation to prevent human movement from one to another. In addition, the places
    of social gatherings such as shopping complexes, markets, were restricted to maintain
    social distancing. These restriction measures reduce the chance of transmission
    of COVID-19 from an infected individual to a healthy person. The impact of lockdown
    on the transmission rate from r = 0.001 to 3.0 has also been analyzed in the study.
    The transmission rate represents the average number of people an infected individual
    can transmit the virus. The strict implementation of lockdown measures, and such
    restrictions helped help to stay safe [27]. Let us assume a scenario where r was
