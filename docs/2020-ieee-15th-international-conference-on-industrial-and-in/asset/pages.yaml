    # II. METHODS


    # A. Study location and data collection


    In this pandemic, the entire world is discussing the most populated country in
    the world, India. [18]. The number of confirmed cases in India recently less;
    however, it has increased rapidly in the past few weeks. By July 20, 2020, the
    number of 1,119,442 confirmed cases were reported in India recently. [19]. The
    Indian government implemented a prolonged lockdown from March 24, 2020, to May
    31, 2020, in several phases to control the spread of the virus [20]. However,
    the government has lifted the lockdown from July 1, 2020, with cases still reported
    daily. Based on the recent increase in cases, experts are warning that India may
    be the next exponent of the COVID-19. The time-series dataset of COVID-19 used
    in this study is collected from the official website of the Government of India.
    [19]. The extracted data includes several variables such as confirmed, recovery
    and deceased cases. The available dataset is time-series data with date, month
    and year information. The data recorded for a period from January 30, 2020 (when
    the first COVID-19 case was reported in India) to July 10, 2020 (162 days) was
    used to develop the prediction model.


    # B. ANN model


    An artificial neural network (ANN) is one of the most utilized technique in the
    artificial intelligence field. Many researchers have used ANNs to solve various
    problems like classification, regression and optimization. ANN-based models are
    highly capable of handling non-linear data and time-series prediction problems.


    of infectious diseases. Besides, statistical models like ARIMA are parametric
    methods that rely heavily on several assumptions. Hypothesized parameters lead
    to poor fitting and low accuracy which is predicting COVID-19 growth. Therefore,
    the statistical models are not sufficient to generalize the patterns in the current
    epidemic.

    Recently, few researchers have used machine learning techniques as an alternative
    to statistical methods. Hu et al. [8] used an autoencoder to predict COVID-19
    cases in China. [21]. Adaptive Neuro-Fuzzy Inference System to estimate COVID-19
    cases in ten days in China. Chimilla et al. [10] proposed a short term memory
    (LSTM) model to predict confirmed COVID cases. However, LSTM is not suitable for
    small learning problems and leads to a high risk of overfitting that is easy to
    occur in small sample learning [11]. Next, the Artificial Neural Network (ANN)
    is one of the effective applied methods in time-series problem because of its
    simple architecture, fast implementation and capability to process non-linear
    data [12]. Owing to their excellent performance many ANN and its variants have
    been employed to predict various infectious diseases such as hepatitis, typhoid
    fever infection, tuberculosis, and others, as shown in Table I. Although ANNs
    are non-parametric methods and do not require prior knowledge of data. Moreover,
    ANNs are non-linear models, which are relatively easy to use and understand for
    the end-users. The ANN-based prediction models have not yet been used for the
    small case of COVID-19.

    However, we are aware of the limitations of statistical models, in this work,
    an ANN-based machine learning model is proposed to predict the growth of COVID-19
    cases in India for the first time. The model is developed using the available
    historical time-series data. Moreover, in our study, we have attempted to use
    a mathematical fitting model to acquaint the proposed ANN-based machine learning
