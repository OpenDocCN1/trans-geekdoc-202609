    $y_j = \frac{1}{1+e^{-x_j}}$ (2)


    The output of neural ($y_j$) is compared to the actual ($a_j$) using an error
    function:


    $$\delta_j = (a_j - y_j)(1 - y_j)$ (3)


    The error for the hidden layer is calculated as follows:


    $$\delta_j = y_j(1 - y_j) \sum^n \delta_k w_{kj}$


    where $\delta_k$ is the error of the output layer, and $w_{kj}$ is the weight
    between the hidden layer and output layer. To adjust the weights of the connection
    layer, the error is backpropagated from the output layer to the input layer as
    follows:


    $$w_{kj}(t+1) = w_{kj}(t) + \eta \delta_j y_k + \alpha(w_{kj}(t) - w_{kj}(t-1))$
    (5)


    where $\eta$ denotes the learning rate and $\alpha$ denotes the momentum factor.
    These parameters influence the learning and stability of the network. The learning
    rate ($\eta$) controls the speed of convergence of the ANN model. A low learning
    rate will slow down the convergence, whereas a large learning rate will increase
    the size of oscillations. Regularization ($\gamma$) ensures the stability of the
    network by reducing the chance of overfitting of the network weights. The network
    is trained until the mean error value reaches a desired threshold. Finally, the
    neural network architecture is optimized with optimized weights is utilized in
    the testing phase.


    A feed-forward neural network was trained in the present study. The previous days''
