    preventive measures such as social distancing and lockdown have a influential
    role in reducing the spread of the disease. Now we consider another scenario in
    which July 10, 2020, 293,802 confirmed cases occur even as social distancing and
    preventive measures followed attentively. In this case, the number of confirmed
    cases with different transmission rates is higher (Fig. 5b). It can be observed
    from Fig. 5b that the strict implementation of preventive measures would be highly
    effective in minimizing the COVID-19 growth rate.


    In work, a machine learning model (e.g., ANN) is proposed to estimate the growth
    of COVID-19 in India. The models are used to predict the number of cumulative
    confirmed cases, daily cases and deceased cases of COVID-19. In addition, a mathematical
    model is proposed to verify the prediction model. The prediction model of the
    transmission rate in India shows exponential growth, due to which the number of
    confirmed cases is expected to show a massive increase in the days. Moreover,
    the impact of preventive measures like social distancing and lockdown is used
    to slow down the spread of the disease. To sum up, this is the first study that
    has used machine learning model to predict the outbreak of COVID-19 in India.
    The study provides insight into the future, which can be used by the government
    and health organizations to organize the necessary medical facilities and resources.
    For future work, the study can be extended to predict the growth of COVID-19 at
    the province level.


