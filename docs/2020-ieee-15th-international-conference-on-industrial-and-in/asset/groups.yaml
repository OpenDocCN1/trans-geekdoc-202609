    memory (LSTM) model to predict confirmed cases. However, LSTM is not suitable
    for small learning problems and leads to a high risk of overfitting that is easy
    to occur in small sample learning [11]. Next, the Artificial Neural Network (ANN)
    is one of the effective applied methods in time-series problem because of its
