    # 15th (IEEE) International Conference on Information and Systems (ICIIS) 2020


    ## Real-time estimation of COVID-19 using machine learning and mathematical models
    - The case of India


    Pratama Kumari

    Department of Computer Science & Engineering

    Indian Institute of Technology

    Roorkee, India

    pkumumari@csitit.in


    Durga Toshni

    Department of Computer Science & Engineering

    Indian Institute of Technology

    Roorkee, India

    durgatoshni@gmail.com


    Abstract—COVID-19 pandemic has stressed out the economy and resources of major
    countries around the world due to its impact on public health. The number of cases
    has skyrocketed in the past, which creates immense pressure on health officials
    and governments. Therefore, prediction models to determine the number of cases
    are necessary. In this study, artificial neural network (ANN) is proposed to forecast
    the COVID-19 outbreak for the first time. Moreover, we used curve fitting to assess
    the performance of the ANN-based machine learning model in estimating the growth
    of COVID-19 under different phases.


    **Index Terms**—COVID-19, infections, prediction, machine learning, neural network


    ### I. INTRODUCTION


    COVID-19 coronavirus caused by acute respiratory syndrome (SARS-CoV-2) is highly
    contagious and declared a global pandemic by WHO in 2020. It belongs to family
    of coronavirus, similar to MERS and SARS-CoV-2 have been seen in the past. The
    virus has fever and cough, and many people die from severe disease such as cancer
    and diabetes. As of July 20, 2020, many confirmed cases and deaths have been reported
    worldwide. Some European countries, including Spain (307,335 cases), UK (294,792
    cases), and many other countries in America (896,550 cases), are the most affected
    by this global health crisis [2]. In this regard, the importance of mathematics
    and sciences are coming forward to predict COVID-19 cases in different countries.
    Recently, Zhao et al. [3] developed a mathematical model to forecast COVID-19
    cases in India. China [1] applied a generalized growth model from Feb to March
    2020. In addition, statistical methods such as Autoregressive Moving Average (ARIMA),
    Moving Average (MA), and linear regression models have been used to predict the
    number of COVID-19 cases in different countries.


    TABLE I: STUDIES ON GROWTH RATE OF SEVERE EPIDEMICS USING ARTIFICIAL NEURAL NETWORK
    (ANN).


    | Methods | Reference |

    | :--- | :--- |

    | ARIMA, ANN | Decrease [1] |

    | BPNN, ANN, and ERNN | [2] |

    | ARIMA, ANN | Typhoid Fever [3] |

    | ARIMA, GRNN, and NFRS | Hepatitis [4] |

    | BPNN, ANN, and NFRS | Dengue Fever [5] |

    | ARIMA, ANN, and MPR | Malaria Fever [6] |


    The developed mathematical model is used to predict the growth under different
    transformations. The developed models can enable COVID-19 forecasting which may
    alert authorities about the crisis, necessary preparations and health infrastructure
    required to accommodate the patients. The rest of the study is organized as follows:
    data collection and method are discussed in Section 2. The results are extensively
    discussed in Section 3, while Section 4 presents the conclusions of the study.


    ### II. METHODS


    ### A. Study location and data collection


    In this pandemic, the entire world is discussing the most populated country in
    the world, India [18]. The number of confirmed cases in India recently less; however,
    it has increased rapidly in the past few weeks. By July 20, 2020, the number of
    1,119,442 confirmed cases were reported in India recently [19]. The Indian government
    implemented a prolonged lockdown from March 24, 2020, to May 31, 2020, in several
    phases to control the spread of the virus [20]. However, the government has lifted
    the lockdown from July 1, 2020, with cases still reported daily. Based on the
    recent increase in cases, experts are warning that India may be the next exponent
    of the-19. The time-series dataset of COVID-19 used in this study is collected
    from the official website of the Government of India [19]. The extracted data
    includes several variables such as confirmed, recovery and deceased cases. The
    available dataset is time-series data with date, month and year information. The
    data recorded for a period from January 30, 2020 (when the first COVID-19 case
    was reported in India) to July 10, 2020 (162 days) was used to develop the prediction
    model.


    ### B. ANN model


    An artificial neural network (ANN) is one of the most utilized technique in the
    artificial intelligence field. Many researchers have used ANNs to solve various
    problems like classification, regression and optimization. ANN-based models are
    highly capable of handling non-linear data and time-series prediction problems
    of infectious diseases. Besides, statistical models like ARIMA are parametric
    methods that rely heavily on several assumptions. Hypothesized parameters lead
    to poor fitting and low accuracy which is predicting COVID-19 growth. Therefore,
    the statistical models are not sufficient to generalize the patterns in the current
    epidemic. Recently, few researchers have used machine learning techniques as an
    alternative to statistical methods. Hu et al. [8] used an autoencoder to predict
    COVID-19 cases in China [21]. Adaptive Neuro-Fuzzy Inference System to estimate
