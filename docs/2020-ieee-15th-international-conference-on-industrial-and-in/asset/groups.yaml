    用于输出输出的有用信息。应用非线性激活函数以获得实际值 ($y_j$)。在该模型中，采用 sigmoid 函数作为激活函数，如下所示：


    $y_j = \frac{1}{1+e^{-x_j}}$ (2)


    使用误差函数将神经网络的输出 ($y_j$) 与实际值 ($a_j$) 进行比较：


    $$\delta_j = (a_j - y_j)(1 - y_j) (3)$$


    隐藏层的误差计算方式如下：


    $$\delta_j = y_j(1 - y_j) \sum^n \delta_k w_{kj}$$


    其中，$\delta_k$ 是输出层的误差，$w_{kj}$ 是隐藏层与输出层之间的权重。为了调整连接层的权重，误差从输出层向输入层按如下方式反传播：


    $$w_{kj}(t+1) = w_{kj}(t) + \eta \delta_j y_k + \alpha(w_{kj}(t) - w_{kj}(t-1))
    (5)$$


    其中，$\eta$ 表示学习率，$\alpha$ 表示动量因子。这些参数影响网络的学习和稳定性。学习率 ($\eta$) 控制 ANN 模型的收敛速度。较低的学习率会减慢收敛速度，而较大的学习率则会增加振荡幅度。正则化
    ($\gamma$) 通过减少网络权重过拟合的概率来确保网络的稳定性。对网络进行训练直到平均误差值达到所需的阈值。最后，利用优化后的权重优化神经网络架构并应用于测试阶段。


    本研究训练了一个前馈神经网络。前几天的数据作为输入提供给输入层。使用了具有不同隐藏神经元配置的 ANN 模型。在训练所提出的 ANN 模型期间，采用了 Levenberg
    Marquardt (LM) 学习算法来优化权重 [23]。


    模型一直训练直到权重得到优化且均方误差 (MSE) 最小为止。表 II 显示了所开发的 ANN 模型的性能。


