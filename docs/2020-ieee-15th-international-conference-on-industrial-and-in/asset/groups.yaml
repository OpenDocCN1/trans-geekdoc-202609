    (MAE) 来分析所提 ANN 模型的性能 [24, 25]。这些指标描述如下：


    $$RMSE = \sqrt{\frac{1}{n}\sum^n(y_i - a_i)^2}$ (6)$$


    $$MAE = \frac{1}{n}\sum^n|y_i - a_i|$ (7)$$


