    # 第15届 (IEEE) 国际信息与系统会议 (ICIIS) 2020


    ## 使用机器学习和数学模型对 COVID-19 进行实时估计 - 以印度为例


    Pratama Kumari

    计算机科学与工程系

    印度理工学院

    鲁尔基，印度

    pkumumari@csitit.in


    Durga Toshni

    计算机科学与工程系

    印度理工学院

    鲁尔基，印度

    durgatoshni@gmail.com


    摘要——由于 COVID-19 疫情对公共卫生的影响，给全球主要国家的经济和资源造成了巨大压力。过去病例数量急剧增加，给卫生官员和政府带来了巨大的压力。因此，建立用于确定病例数量的预测模型是必要的的。在本研究中，首次提出了人工神经网络（ANN）来预测
    COVID-19 的爆发情况。此外，我们还使用曲线拟合来评估了基于 ANN 的机器学习模型在不同阶段估计 COVID-19 增长的性能。


    **索引术**——COVID-19、感染、预测、机器学习、神经网络


    ### I. 引言


    由急性呼吸道综合病毒（SARS-CoV-2）引起的 COVID-19 病毒具有高度传染性，并于 2020 年被世界卫生组织宣布为全球大流行。它属于冠状病毒家族，与过去看到的
    MERS 和 SARS-CoV-2 相似。该病毒会导致发热和咳嗽，许多人因癌症和糖尿病等严重疾病去世。截至 2020 年 7 月 20 日，全球已报告了许多确诊病例和死亡。一些欧洲国家，包括西班牙（307,335
    例）、英国（294,792 例）以及美洲的许多国家（896,550 例），受这一全球健康危机的影响最大 [2]。在这方面，数学和科学在预测不同国家 COVID-19
    病例方面的重要性日益凸。最近，Zhao 等人 [3] 开发了一个数学模型来预测印度的 COVID-19 病例。中国 [1] 在 2020 年 2 月至 3
    月应用了通用增长模型。此外，自回归移动平均（ARIMA）、移动平均（MA）和线性回归模型等统计方法也被用于预测不同国家的 COVID-19 病例数量。


    表 I：使用人工神经网络（ANN）对严重疾病增长率的研究


    | 方法 | 参考文献 |

    | :--- | :--- |

    | ARIMA, ANN | 减少 [1] |

    | BPNN, ANN, 和 ERNN | [2] |

    | ARIMA, ANN | 伤寒 [3] |

    | ARIMA, GRNN, 和 NFRS | 肝炎 [4] |

    | BPNN, ANN, 和 NFRS | 脑热 [5] |

    | ARIMA, ANN, 和 MPR | 疟疾 [6] |


    开发的数学模型用于预测不同转换下的增长情况。开发的模型能够实现 COVID-19 预测，这可能提醒有关部门危机、必要的准备以及收治患者所需的医疗基础设施。本研究的其他部分组织如下：第
    2 节讨论了数据收集和方法；第 3 节详细讨论了结果；第 4 节介绍了研究的结论。


    ### II. 方法


    ### A. 研究地点和数据收集


    在这场疫情中，全世界都在讨论人口最多的国家——印度 [18]。印度近期确诊病例数量较少；但在过去的几周内迅速增加。截至 2020 年 7 月 20 日，印度近期报告了
    1,119,442 例确诊病例 [19]。印度政府从 2020 年 3 月 24 日至 2020 年 5 月 31 日实施了分阶段长期封锁，以控制病毒传播
    [20]。然而，政府已于 2020 年 7 月 1 日 解封，但每天仍有病例报告。根据近期病例的增长，专家警告印度可能是 COVID-19 的下一个指数中心。本研究使用的
    COVID-19 时间序列数据集收集自印度政府官方网站 [19]。提取的数据包括确诊、康复和死亡病例等多个变量。可用数据集带有日期、月份和年份信息的时间序列数据。从
    2020 年 1 月 30 日（印度报告首例 COVID-19 病例）到 2020 年 7 月 10 日（162 天）期间记录的数据用于开发预测模型。


    ### B. ANN 模型


    人工神经网络（ANN）是人工智能领域应用最广泛的技术之一。许多研究人员已使用 ANN解决分类、回归和优化等各种问题。基于 ANN 的模型非常能够处理传染病的非线性数据和时间序列预测问题。此外，像
    ARIMA 这样的统计模型是依赖于多个假设的参数方法。假设的参数会导致拟合效果差和准确率低，从而无法预测 COVID-19 的增长。因此，统计模型不足以泛化当前流行病中的模式。最近，少数研究人员使用机器学习技术作为统计方法的替代方案。Hu
    等人 [8] 使用自编码器预测了中国的 COVID-19 病例 [21]。自适应神经模糊推理系统用于估计中国十天内的 COVID-19 病例。Chimilla
    等人 [10] 提出了长短期记忆（LSTM）模型来预测确诊病例。然而，LSTM 不适用于小样本学习问题，并且在小样本学习中容易发生过拟拟风险 [11]。接下来，人工神经网络（ANN）由于其结构简单、实现速度快且处理非线性数据的能力，是时间序列问题的有效应用方法之一
    [12]。由于其卓越的性能，许多 ANN 及其变体已用于预测肝炎、伤寒、结核等多种传染病，如表 I 所示。尽管 ANN 是非参数方法且不需要预先了解数据。此外，ANN
    是非线性模型，对于终端用户来说相对容易使用和理解。基于 ANN 的预测模型尚未用于 COVID-19 的小规模分析。然而，我们意识到统计模型的局限性，在此工作中，建议使用现有历史时间序列数据开发一种基于
    ANN 的机器学习模型。此外，在研究中，我们尝试使用数学拟合模型来关联所提出的基于 ANN 的机器学习模型的


    ```

    X = x_1w_1 + x_2w_2 + ... + x_nw_n + b \quad (1)

    ```


    其中 X 是输入网络，b 是偏置。隐藏层从输入数据中提取特征并将其转换为。


