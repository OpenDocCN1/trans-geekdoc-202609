    聚类总体上是稳健且稳定的，我们的方法性能优于先进方法。


    为了评估提取方法的质量，我们采用了 $C_v$ [42]。然而，$C_v$ 一致性依赖于人类对一致性的估算。此外，$C_v$ 一致性不依赖于“地面真值”标签，因为它考虑了词对的语义信息。它是使用归一化点互信息（NPMI）来计算词聚类的指标。表
    III 显示了 LDA、Kmeans、NMFK [31] 和 SeNMF 的质量。通过这一分析，我们证明对于大多数分析的文本语料库，我们的方法具有竞争性且/或优于现有方法。


    ## V. 结论


    在本文中，我们引入了一种基于 NMF 且能自动确定主题数量的语义主题模型 SeNMF。SeNMF 具有几个特点：首先，通过使用一种小方法来识别文本初始 TF-IDF
    表示 $X$ 的潜在主题，并构建词-上下文-矩阵 $M$，SeNMF 创建了潜在词对 $\{X_q, X_r\}$ 的表示。接下来，对于每个可能的潜在主题数量
    $k \in \{1, \dots, k_{max}\}$，通过基于 KL 散度和基于 $M_k$ 的正则项进行聚类，对该词的对进行重构。潜在维度通过比较所提取主题集合的稳定性来确定。最终的潜在主题是作为所选主题集的均值提取的。此外，SeNMF
    执行了 $H$-聚类，即对潜在空间中的文档坐标进行 $k$-means 聚类。我们证明了 SeNMF 在五个基准文本语料库上的质量，并将我们的结果与最先进的带有已知“地面真值”标签的预测主题数量、一致性和文档
    EMI 的语义方法进行了比较。


