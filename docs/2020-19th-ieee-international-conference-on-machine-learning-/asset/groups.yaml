    ## C. Document clustering: Identifying similar documents in a text corpus


    After identifying the text, we employ an algorithm that we call H-clustering,
    to classify the documents in the text corpus according to these topics. We employ
    k-means clustering to the elements of H, which represent the centers of each document
    in the topic. To select the most representative topics from H, we use Silhouette
    statistics in a standard way. Finally, we map the identified clusters by clustering
    across the document space and identify the clusters in the text corpus.


    ## IV. NUMERICAL RESULTS


    In this section we validate and evaluate our method, SenMF, introduced in Section
    3. First, we demonstrate that SenMF can accurately determine the number of latent
    topics of free-text corpus by calculating the normalized mutual information (NMI),
    then show the document clusters generated by SenMF and H-clustering of each of
    the analyzed text corpus with the "ground truth" assessed by experts. Finally,
    we calculate the coherence of the extracted topics to assess their quality, and
    to demonstrate that semantic regularization to SenMF performs in better topics.


    ## A. Data


    The five text corpora includes (a) one of the datasets from [24] for topic identification,
    mbc, which belongs to renowned news agency, BBC, and have five topics; two of
    news genres (ng [30]), (s-ng-2, with 2 and 3 topics); and (c) two corpora of Reuters
    [Reuters, 4-5] with 4 and 5 topics respectively. For Reuters, the selection of
    variations is based on the number of classes for the benchmark. We include all
    the documents of the Reuters reports that belong to the top 4 categories. A detailed
    description of the data is provided in Table 1.


    ## B. Preprocessing


    In preprocessing the text, we remove punctuation and the common words in English
    language. From the preprocess text, we ignore the words that occur less than 20
    times.


    The resultant-document matrix becomes a standard log TF-IDF matrix, with document-document
    $L_2$ normalization. We prepare the word-co-occurrence matrix using a document-length
    window. The co-occurrence matrix is then used to calculate the SPPM matrix, M.


    ## C. Experimental setup


    For each one of the analyzed text we run both SenMF and NMF to assess the role
    of the regularization term that accounts for the semantics of the words. For the
    hyperparameters, we adopt the method previously used by NMF. For each corpus,
    we create a random ensemble of matrices based on the TF-IDF representation $X$,
    and the corresponding SPPM matrix $M$. The elements of each matrix are sampled
    from random uniform distributions with element-wise means equal to $X$, and $M_{ij}$.
    For each element $x_{ij}$ of the matrix, it is chosen as $x_{ij}^* = x_{ij}U(1,
    1+\beta)$, where $U(1, 1+\beta)$ is sampled from the uniform distribution $(1,1+\beta)$.
    The amplitude of $\beta$, was varied with $7\%$, $5\%$, $3\%$, $1\%$, $0\%$, to
    explore the stability of the obtained. We also vary the number of $X_q$ in the
    experiment from 20 to 64 by sampling the documents without replacement. We observe
    that the number of clusters does not change more than $15\%$ from the previous
    set. In this case, we run the SenMF and NMF optimizations (usually our approach
    more than 100 iterations). We also explore a range of $k$ values, $\{k_1, k_2,
    ..., k_n\}$, for the number of topics, and for each we minimize $W_q$ and $H_q$
    matrices using Non-negative Singular Value Decomposition (NNDSD) [38]. The parameter
    $\alpha$ was chosen in order for the two loss terms for $X_q$ and $M_q$ to have
    similar values. The clustering and H-clustering were run until convergence or
    at most 100 iterations, but until it converges in ~10 iterations.


