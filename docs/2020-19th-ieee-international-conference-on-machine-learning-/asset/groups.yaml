    # II. RELATED WORK


    # A. Topic Modeling


    There are a number of topic modeling methods: Latent Semantic Analysis (LSA) [2],
    Probabilistic LSA) [3], Latent Dirichlet Allocation (LDA) [4] and Nonnegative
    Matrix Factorization (NMF) [5]. Of these methods, LDA follows a probabilistic
    model, where the model assumes a set of topics follows a Dirichlet distribution.
    NMF follows a linear model which decomposes the corpus using bag-of-words (BoW)
    or TF-IDF of the text corpus. NMF performs factorization similar to similarity
    using singular value decomposition (SVD) for topic representation, which is unsuitable
    and unnatural for topics. The large differences between the two approaches (probabilistic
    and factorizer-based) are significant concerns. Thus, NMF and LDA with KL-divergence
    constraints lead to a generative model [6], which is equivalent to LDA under a
    Dirichlet prior.


    There are many methods within the NMF family, such as OTUPAN [9] which uses semi-supervised
    learning for users who can integrate the NMF algorithm with priors. Other methods
    [10] use the discovery and constrain topics for understanding of large documents.
    A limitation of the classical NMF approaches is its inability to integrate the
    semantics of words, for example, word embeddings [11], which have been widely
    used in deep learning. In [12] they show that word embeddings are equivalent to
    factoring word-co-occurrence matrix.


    Work in [13] incorporates SenMFX through the Shifted Point Matrix Factorization
    (SPFM) topic models. A similar approach [14] simultaneously decomposes topics
    using tri-factorization for topic modeling in short texts. Recently, in [15] NMF
    was applied to short texts, where word-context semantic correlations help learning
    the relationships between words and contexts in a corpus. All semantic-supervised
    NMF methods demonstrate an excellent coverage of the extracted topics and high
    quality document clusters, but they require the number of latent topics, k, as
    a prior. In fact, identifying the number of latent topics is a challenging task
    for all topic models.


