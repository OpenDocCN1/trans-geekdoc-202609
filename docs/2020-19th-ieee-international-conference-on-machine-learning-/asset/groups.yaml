    # Semantic Nonnegative Matrix Factorization with Automatic Mode Determination
    for Topic Modeling


    Ravitija Vanga\*


    *Division, Los Alamos National Laboratory, Los Alamos, NM 77545, USA.

    †Analytics, Intelligence and Technology Division, Los Alamos National Laboratory,
    Los Alamos, NM 77545, USA.

    ‡Department of Science Engineering, University of Maryland, College Park, MD,
    20742


    **Abstract—** Nonnegative Matrix Factorization (NMF) models the topics of a text
    by decomposing its term-frequency (TF-IDF) representation, X into two low-rank
    nonnegative matrices: W, representing the topics and H, mapping the documents
    to topics. One challenge, common to all topic models, is the determination of
    the number of topics. The correct number of topics is important: underestimating
    leads to poor topic separation, overestimating to overlapping topics. Here, we
    introduce SeNMF, a semantic-based NMF topic modeling method that incorporates
    semantic information to guide the determination of the number of topics. SeNMF
    creates a random ensemble of matrices based on TF-IDF coupled factorization to
    acquire stable coherent topics that are robust to noise. Topic determination is
    based on the stability of these topics. We show that SeNMF accurately determines
    the number of topics in various text corpora, compared to other works.

    **Index Terms—** NMF, Topic models, document clustering, NLF


    be seen as dense reduction performed by mapping the documents to the much smaller
    space. In this case, by clustering the coordinates of each topic in the topics
    space, we can derive groups of documents related to some theme, and that is, to
    perform clustering. This is a key challenge in topic modeling: the determination
    of the latent dimension of the corpus. The determination of the correct latent
    dimension is important for meaningful analysis of the corpus, as underestimating
    the number of topics results in poor topic separation, overestimating to overlapping
    topics.


    In this paper, we introduce a new method for topic modeling, SeNMF which utilizes
    the utilization of the Nonnegative Matrix Factorization (NMF) based on Kullback-Leibler
    divergence (KL) to: (a) it takes into account the coupled term-frequency (TF-IDF)
    representation of the corpus, X, and context matrix, M; and (b) using custom resampling
    to determine the latent dimension. Specifically, based on the TF-IDF and word-context
    matrices, X and M, by adding a small noise, ε, to create two noisy versions X''
    and M'', where X''=X+ε and M''=M+ε. SeNMF performs a coupled factorization to
    each of these pairs to acquire sets of topics into some accurate clustering. We
    determine the latent dimension based on the stability of the resulting topics.
    We show that SeNMF can identify the correct number of topics with a benchmark
    compare, and perform as well as state-of-the-art techniques. Finally, we cluster
    the results of each document in the space (obtained by the coupled factorization)
    and identify the groups of documents related to some theme. We observe that the
    number of groups is not always the same as the number of extracted topics, but
    they present meaningful document clusters.


    # I. INTRODUCTION


    With the massive growth of digital content in the world of news articles, social
    media,ic messages, and other textual data, keeping the relevant information from
    noise is a double challenge. To extract and extract rich information from large
    corpora, we need to automatically characterize the content of each document, is
    to detecting the topics that span the meaning of each document. The process of
    extracting and learning latent topics, which are observing hidden thematic information
    across a corpus, is termed topic modeling.


    Topic models are based on the following: (i) each topic is a collection of words,
    and (ii) each document can be represented as a mixture of topics.


    Document clustering identifies the groups of documents in a corpus that belong
    to the same theme or related subjects are grouped in the same group. We demonstrate
    that clustering and clustering are closely related, topic modeling can


