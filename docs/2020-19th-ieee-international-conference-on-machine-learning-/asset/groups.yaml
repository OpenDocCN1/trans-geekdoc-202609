    # 用于主题建模的自动模式确定的语义非负矩阵分解


    Ravitija Vanga*


    *美国洛斯阿拉莫国家实验室，Los Alamos, NM 77545。

    †美国洛斯阿拉莫国家实验室分析、智能与技术部门，Los Alamos, NM 77545。

    ‡马里兰大学大学城帕克分校，科学工程系，College Park, MD, 20742


    **摘要—** 非负矩阵分解（NMF）通过将文本的词频（TF-IDF）表示 $X$ 分解为两个低秩非负矩阵对文本主题建模：其中 $W$ 代表主题，$H$ 将文档映射到主题。所有主题模型共同面临的挑战之一是确定主题的数量。正确的主题数量非常重要：低估计会导致主题分离度差，高估计则会导致主题重叠。在这里，我们介绍了
    SeNMF，一种基于语义的 NMF 主题建模方法，该方法结合了语义信息来指导主题数量的确定。SeNMF 基于 TF-IDF 耦合分解创建随机矩阵系，以获取对噪声鲁棒的稳定相干主题。主题的确定基于这些主题的稳定性。我们证明了与其它工作相比，SeNMF
    能够在各种文本语料库中准确地确定主题数量。

    **索引术—** NMF、主题模型、文档聚类、NLF


    被视为通过将文档映射到小得多的的空间执行的密集降维。在这种情况下，通过对主题空间中每个主题的坐标进行聚类，我们可以导出与某些主题相关的文档组，即进行聚类。这是主题建模中的一个关键挑战：确定语料库的隐维度。确定正确的隐维度对于语料库的有意义的分析至关重要，因为低估计主题数量会导致主题分离度差，高估计会导致主题重叠。


    在本文中，我们引入了一种新的主题建模方法 SeNMF，它利用基于库尔巴贝克-莱布勒散度（KL）的非负矩阵分解（NMF）来实现：(a) 考虑了语料库的耦合词频（TF-IDF）表示
    $X$ 和上上下文矩阵 $M$；以及 (b) 使用自定义重采样来确定隐维度。具体而言，基于 TF-IDF 和词汇-上下文矩阵 $X$ 和 $M$，通过添加微小噪声
    $\epsilon$ 创建两个噪声版本 $X''$ 和 $M''$，其中 $X''=X+\epsilon$ 且 $M''=M+\epsilon$。SeNMF
    对这些对中的每一对执行耦合分解，以获得准确聚类的主题集。我们根据生成主题的稳定性来确定隐维度。我们证明了 SeNMF 能够在基准比较中识别正确的主题数量，并与最先进的技术相当。最后，我们对空间中（通过耦合分解获得）的每个文档结果进行聚类，并识别与某些主题相关的文档组。我们观察到，组的数量并不总是与提取的主题数量相同，但它们呈现了有意义的文档聚类。


    # I. 引言


    随着世界新闻文章、社交媒体、信息消息和其他文本数据数字内容的海量增长，从噪声中保留相关信息是一项双重挑战。为了从大型语料库中提取并提取丰富信息，我们需要自动表征每个文档的内容，即检测跨越每个文档含义的主题。提取和学习隐主题的过程（即观察跨越语料库的隐藏主题信息）被称为主题建模。


    主题模型基于以下原理：(i) 每个主题都是词汇的集合，且 (ii) 每个文档都可以表示为主题的混合。


    文档聚类识别语料库中属于同一主题或相关主题的文档组，并将它们归为一类。我们证明了聚类和聚类之间紧密相关，主题建模可以


    + 本文的主要贡献有：

    - SeNMF，一种用于寻找隐主题数量的鲁棒语义非负矩阵分解方法。

    - 我们推导了带有语义正则化的 KL 散度 NMF 多层。


    > *这些作者具有同等贡献

    ‡通讯：bolan@lnl.gov


    • 我们证明了 SeNMF 能够准确确定文本语料库的主题模型。


    • 我们证明了单词矩阵与语料库 TF-IDF 表示的耦合分解结合统计支持，可以在基准数据集上产生高质量的主题和准确的文档聚类。


    本文结构如下：第二节讨论相关工作。第三节介绍 SeNMF。第四节在五个基准数据集上对我们的方法进行评估。最后，第五节给出结论。


    # II. 相关工作


    # A. 主题建模


    有很多主题建模方法：潜在语义分析（LSA）[2]、概率 LSA [3]、潜在狄利克分配（LDA）[4] 和非负矩阵分解（NMF）[5]。在这些方法中，LDA
    遵循概率模型，该模型假设一组主题遵循狄利克分布。NMF 遵循线性模型，使用词袋（BoW）或 TF-IDF 分解文本语料库。NMF 使用类似于奇异值分解（SVD）的相似性进行主题表示，这对于主题来说是不适用且不自然的。这两种方法（概率的和基于分解的）之间的巨大差异是一个关注点。因此，带有
    KL 散度约束的 NMF 和 LDA 引向了一个生成模型 [6]，该模型在狄利克先验下等同于 LDA。


    NMF 家族有很多方法，例如用于集成 NMF 算法与先验 UPN [9]。其他方法 [10] 用于发现和约束主题。


    # B. 模型确定


    若干启发式方法有助于确定主题数量。其中一些基于主题质量的衡量。最早的指标之一是估计质量困惑度 [4]，它衡量概率模型预测留出测试集的效果。遗憾的是，困惑度不能反映主题的语义内容
    [17]，并提出了一种新的指标——相干性，用于评估主题。


