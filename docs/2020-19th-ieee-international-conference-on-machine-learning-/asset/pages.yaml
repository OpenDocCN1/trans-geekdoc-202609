    # II. RELATED WORK


    # A. Topic Modeling


    There are a number of topic modeling methods: Latent Semantic Analysis (LSA) [2],
    Probabilistic LSA) [3], Latent Dirichlet Allocation (LDA) [4] and Nonnegative
    Matrix Factorization (NMF) [5]. Of these methods, LDA follows a probabilistic
    model, where the model assumes a set of topics follows a Dirichlet distribution.
    NMF follows a linear model which decomposes the corpus using bag-of-words (BoW)
    or TF-IDF of the text corpus. NMF performs factorization similar to similarity
    using singular value decomposition (SVD) for topic representation, which is unsuitable
    and unnatural for topics. The large differences between the two approaches (probabilistic
    and factorizer-based) are significant concerns. Thus, NMF and LDA with KL-divergence
    constraints lead to a generative model [6], which is equivalent to LDA under a
    Dirichlet prior.


    There are many methods within the NMF family, such as OTUPAN [9] which uses semi-supervised
    learning for users who can integrate the NMF algorithm with priors. Other methods
    [10] use the discovery and constrain topics for understanding of large documents.
    A limitation of the classical NMF approaches is its inability to integrate the
    semantics of words, for example, word embeddings [11], which have been widely
    used in deep learning. In [12] they show that word embeddings are equivalent to
    factoring word-co-occurrence matrix.


    Work in [13] incorporates SenMFX through the Shifted Point Matrix Factorization
    (SPFM) topic models. A similar approach [14] simultaneously decomposes topics
    using tri-factorization for topic modeling in short texts. Recently, in [15] NMF
    was applied to short texts, where word-context semantic correlations help learning
    the relationships between words and contexts in a corpus. All semantic-supervised
    NMF methods demonstrate an excellent coverage of the extracted topics and high
    quality document clusters, but they require the number of latent topics, k, as
    a prior. In fact, identifying the number of latent topics is a challenging task
    for all topic models.


    the potential to extend (from [16]) to other application domains such as security.


    # B. Model Determination


    Several heuristics help to determine the number of topics. Some of them are based
    on a measure of the quality of the topics as topics. One of the first metrics
    is to estimate the topic quality perplexity [4], which counts how well a probability
    model predicts a held-out test set. Unfortunately, perplexity does not reflect
    the semantic content of a topic [17], and a new metric, coherence L-was proposed
    for the evaluation of different topics. Another approach, Hierarchical Topic Attention
    (HLTA) [19]. LDA also uses coherence of high-order co-occurrence patterns to determine
    the most coherent topics and the hierarchical structures that lead to a number
    of topics.


    Most of the NMF methods explore various numbers of topics ($k_{max}$) and then
    using some to choose an optimal k. One of the first methods used for estimation
    of the latent density is the L-curve method [20], which represents between the
    balance of the minimization and the number of latent factors. The L-curve method,
    however, does not perform well in the case where it is not clear. Another used
    method is the automatic relevance difference (ARD), originally introduced for
    neural networks by [21] and for adaptive interpretation of NMF by Feve and Tan
    [22].


    Other methods investigate the clusters in the input matrix. Method proposed by
    Brun et al. [23] relies on the stability of the NMF solutions obtained from random
    initializations to consider each k. In this method, the stability of NMF solutions
    is measured using clustering and to determine the number of clusters in X. Generally,
    Green et al. [24] proposed a term-centric stability approach based on the agreement
    between the rankings generated by multiple NMF solutions. In the non-negative
    NMF, the stability of the approach shows low significance. Thus their stability
    can be used to select the topics used by NMF.


    In these approaches, SenMFX is mentioned and uses the ideas of a recent method
