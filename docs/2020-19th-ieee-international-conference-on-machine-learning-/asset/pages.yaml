    of the documents in our method. However, it is known theoretically that (except
    in PLSA) the number of documents in a cluster may not be the number of the latent
    topics (39). We can observe that a document cluster has a variance that requires
    multiple latent topics to explain it, resulting in better clusters than latent
    topics. Such irregularity can be explained by a good topic model.


