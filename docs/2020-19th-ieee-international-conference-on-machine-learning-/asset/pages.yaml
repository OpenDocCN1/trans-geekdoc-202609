    # V. CONCLUSIONS


    In this paper, we introduce a new NMF-based and semantic-topic model with automatic
    determination of the number of topics, SeNMF. SeNMF has several features: First,
    by using a small approach to identify the latent topics of the initial TF-IDF
    representation of the text, $X$, by using a small approach to identify the latent
    topics of the initial TF-IDF representation of the text, $X$, and constructing
    word-context-matrix, $M$, SeNMF creates a representation of latent pairs of words,
    $\{X_q, X_r\}$. Next, for each number of latent topics, $k \in \{1, \dots, k_{max}\}$,
    by performing clustering based on KL-divergence and a regularization term based
    on $M_k$, each pair of this word is reconstructed. The latent dimension is determined
    by comparing the stability of the sets of topics extracted. The final latent topics
    are extracted as the means of the chosen set of topics. Furthermore, SeNMF performs
    $H$-clustering, which performs $k$-means clustering of the documents'' coordinates
    in the latent space. We demonstrate the quality of our SeNMF on five benchmark
    text corpora, and compare our results against'
