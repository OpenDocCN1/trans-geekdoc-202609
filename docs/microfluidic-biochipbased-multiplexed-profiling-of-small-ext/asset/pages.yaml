    # 2.4. Barcode Immunoassay Platform-Based Clinical Sample Testing


    To validate the consistency between our microfluidic chip and mass spectrometry
    results, we performed parallel detection of the 14 candidate proteins in the same
    ESCC patient and healthy con-


    trol cohorts using both platforms. Comparative analysis demonstrated strong concordance
    in differential expression patterns for the majority of proteins across platforms
    (Figures S10 and S11, Supporting Information). Based on the barcode immunoassay
    platform described above, we examine the 14 candidate proteins in the serum small
    EVs from Cohort 1 and Cohort 2. First, the two cohorts of ESCC patients and HC
    have a similar sex ratio (Figure 4A; Figures S12A,C, Supporting Information),
    and the age distribution is predominantly over 50 years (Figure 4B; Figure S12B,D,
    Supporting Information). Thus, potential interference due to age and gender differences
    between groups could be excluded. Additionally, there are no significant differences
    in the basic clinicopathologic characteristics of ESCC patients between the two
    cohorts (Figure S12E, Table S2, Supporting Information), indicating that the two
    clinical cohorts are comparable.


