    # 2.5. Construction and Validation of a Precise Diagnostic Model


    In order to develop an innovative diagnostic method for ESCC using candidate proteins,
    machine learning is employed to create models that precisely predict clinical
    status (Figure 5A). Initially, a model is constructed based on the 14 proteins
    using a random forest algorithm, and model parameters are optimized based on the
    combined scores of accuracy (ACC) and AUC (Figure S19A–C, Supporting Information).
    The optimal values were set at ntree = 145 and mtry = 1.


    Cohort 1 was randomly split into a training set and a test set at a ratio of 7:3,
    while Cohort 2 served as an independent external test set, referred to as test
    set 2. To visualize the model performance, the graphs were generated to compare
    predicted values against actual disease status (ESCC or HC). With a cutoff value
    of 0.5 for classification, the 14-diagnostic markers (DM) model accurately identified
    63.2% of ESCC patients in test set 1 and 78.7% in test set 2 (Figure 5B,C). The
    model demonstrated 100% accuracy in the training set (Figure S19D, Supporting
    Information), with accuracy rates of 79.1% in test set 1 (Figure S19E, Supporting
    Information) and 82.1% in test set 2 (Figure S19F, Supporting Information). The
    AUC values were 0.94 and 0.96 for the respective test sets (Figure 5D).


    To further optimize the model and reduce detection costs, the importance of variables
    in the 14-DM model was ranked using the random forest algorithm. ELA2, CXCL6,
    MMP9, CRP, and BPIFB1 were ranked in the top five based on the average minimum
    depth and node counts (Figure 5E), and the other 9 proteins were applied to further
    analysis. As a result, the 9 protein variables yield the highest combined score
    based on ACC, AUC, and overall performance (Figure 5F). The selected variables
    are MMP9, CRP, CXCL6, FST, EIF2S2, ELA2, BPIFB1, PTX3, and CD16. Excluding the
    variable one by one results in varying degrees of accuracy decline, and it is
    observed that MMP9 presents the most significant decrease (Figure 5G), which means
    MMP9 plays an important role in the diagnostic model.


    An improved random forest model is constructed using the nine variables, optimizing
    parameters with n tree set to 400 and mtry to 1 (Figure S20A–C, Supporting Information).
    This 9-DM model accurately identifies 79.0% of ESCC patients in test set 1 and
    91.5% in test set 2 (Figure 5H,I). Accuracy rates are 88.4% in test set 1 (Figure
    S20D, Supporting Information) and 91.0% in test set 2


    test set 2 (Figure S20E, Supporting Information), with AUC values of 0.96 and
    0.95 for the respective test sets (Figure 5J). These results indicate that the
    9-DM model exhibits high sensitivity and reliability.


    To further validate the generalizability of the selected biomarkers and the 9-DM
    model, an independent validation cohort (Cohort 3) consisting of 30 ESCC patients
    and 30 healthy controls was recruited at Qilu Hospital between January and March
    2025. External validation results demonstrated consistent expression patterns
    of most candidate biomarkers with those observed in Cohorts 1 and 2 (Figures S21
    and S22, Supporting Information), while the 9-DM model maintained robust diagnostic
    performance with 83.3% classification accuracy (AUC = 0.93) (Figure S23, Supporting
    Information), thereby confirming the clinical utility and reliability of our protein
    signature for ESCC detection.


    To assess its effectiveness in diagnosing early-stage ESCC, the 9-DM model is
    applied to differentiate between stage I-II ESCC and HC in both test sets. The
    model successfully identified 85.7% of early ESCC patients and 93.2% of HC, resulting
    in an overall accuracy of 90.8% (Figure S20F,G, Supporting Information) and an
    AUC of 0.96 (Figure S20H, Supporting Information). In clinical settings, early
    detection of ESCC is vital for prompt intervention and radical resection, which
    can reduce surgical difficulties and significantly improve patient survival rates.[28,29]


    # 2.6. The Specificity of Small EVs Protein Markers to Differentiate Cancers


    To evaluate the specificity of the 9-DM model for ESCC diagnosis, serum samples
    were collected from patients with CRC, gastric cancer (GC), and breast cancer
    (BC). The gender and age distribution of patients is presented in Figure S24 (Supporting
    Information). In the serum small EVs of CRC, GC, and BC, the expression levels
    of the 9 markers show significant differences compared to those in ESCC (Figure
    6A; Figure S25, Supporting Information). The PCA based on 9-DM suggests that ESCC
    samples exhibit distinct characteristics when compared to other cancer types (Figure
    6B). However, PCA using the 9-DM fails to effectively differentiate between CRC,
    GC, and BC samples in relation to HC samples (Figure S26A–C, Supporting Information).


    Notably, with the exception of CXCL6 and EIF2S2, the remaining seven markers were
    expressed at lower levels in the serum small EVs of CRC, GC, and BC patients (Figure
    6C–K). Incorporating data from CRC, GC, and BC into the 9-DM model completely
    failed to differentiate them from HC (Figure S26D,E, Supporting Information).
    These findings underscore the specificity of the selected small EVs protein markers
    and the 9-DM model in diagnosing ESCC.


