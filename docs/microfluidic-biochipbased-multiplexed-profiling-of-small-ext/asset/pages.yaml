    Early diagnosis can significantly improve patient prognosis.[26,35] Current endoscopic
    diagnostic and screening methods are limited, creating a need for new non-invasive
    approaches to screen for and continuously monitor precancerous lesions.[1] Although
    liquid biopsy has been explored in recent years, cfDNA has shown less than 20%
    sensitivity for the early diagnosis of EC.[10-12] In contrast, small EVs are widely
    present in biological fluids and possess a double membrane structure, providing
    high stability.[22] While several studies have demonstrated that the miRNAs in
    small EVs can differentiate tumor patients from healthy individuals, few have
    translated effectively into clinical applications.[36,37] Compared to RNA, small
    EVs-derived proteins are more stable and therefore better suited for clinical
    examination.[38] The increasing sophistication of proteomic


    # 3. Discussions and Conclusion


    In this work, although ESCC is taken as a model to test the application of the
    screened small EVs proteins panel to conduct early diagnosis, it is a universal
    method to screen the specific early-diagnosis biomarkers, evaluate the biomarkers
    of treatment efficacy, and accurately prognosis biomarkers of other diseases.


