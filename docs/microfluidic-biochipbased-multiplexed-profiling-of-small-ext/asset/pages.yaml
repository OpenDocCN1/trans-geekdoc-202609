  md: 'assays in recent years has created an opportunity to understand protein function
    in both tumor patients and healthy individuals.[39,40]


    In this study, 4D-DIA was used to identify and characterize all proteins in serum
    small EVs from patients and HC, revealing altered protein compositions in the
    small EVs of patients. Notably, important pathways such as small EVs composition,
    protein binding, and neutrophil degranulation are significantly upregulated, suggesting
    the functional status of their small EVs proteome. Additionally, pathways related
    to tumorigenesis, such as endocytosis, chemokines, and endothelial cell migration,
    are significantly elevated in the KEGG pathway analysis, indicating that small
    EVs proteins play a critical role in tumor formation and progression. This further
    supports the potential for identifying markers within the serum small EVs proteome
    for the diagnosis of cancer.


    Due to the inherent heterogeneity of tumors and the complexity of their microenvironments,[41,42]
    it is challenging for a single marker to accurately reflect overall changes in
    tumor characteristics. Consequently, the combination of multiple markers has become
    a prevailing trend in diagnostic and therapeutic approaches.[43,44] This trend
    places higher demands on detection methods, emphasizing the need for assays with
    low sample consumption and high throughput capabilities, which are invaluable
    for marker detection and cancer diagnosis. CD63, CD81, and CD9 are transmembrane
    proteins present in the small EVs membrane that represent incompletely overlapping
    small EVs populations.[22,24,25] The microfluidic platform developed in this study
    utilizes a mixture of antibodies against CD63, CD9, and CD81 to specifically capture
    serum small EVs, achieving a capture efficiency of over 90% at concentrations
    of 10^8 to 10^10 particles mL^-1. The captured small EVs undergo in situ cleavage
    on the chip, yielding total small EVs proteins, including both membrane and internal
    proteins. This approach minimizes the loss of total small EVs proteins and enhances
    the overall sensitivity of the assay. The entire process requires only 10 µL of
    serum sample volume, significantly reducing sample loss. Furthermore, the barcode
    immunoassy platform enables the simultaneous detection of at least 14 markers
    across 60 clinical samples, significantly reducing the time required for multi-sample
    analysis. This makes it particularly well-suited for screening a diverse population.
    Notably, the detection limit of the chip for proteins is as low as 0.01–96.61
    pg mL^-1, and fluorescence readings are relatively stable. Thus, the barcode immunoassy
    platform developed in this study holds substantial clinical application potential
    for the detection of small EVs proteins.


    While serum small EVs proteomics are suited to characterize proteins in diseases
    and identify promising biomarkers for diagnosis, interpreting complex histological
    data remains a challenge.[16,45–47] Machine learning is increasingly recognized
    as a valuable tool for enhancing the accuracy of medical monitoring and diagnosis.
    In this study, the random forest algorithm was utilized to select the optimal
    model by adjusting parameters based on ACC and the AUC. The accuracy of the diagnostic
    model reaches 79.1% in test set 1. To further improve accuracy and reduce detection
    costs, the best model, the 9-DM, is identified through machine learning, achieving
    an accuracy of 88.4% in test set 1. Additionally, machine learning algorithms
    reveal the predictive potential of certain small EVs proteins that


    are often overlooked by traditional analytical methods. For instance, although
    CD16 and ELA2 did not exhibit significant differences when comparing the overall
    mean values between ESCC patients and HC, these two markers were retained in the
    model''s selection of optimal variables. The machine learning algorithms used
    to create the diagnostic models were validated for generalization and demonstrated
    superior performance compared to clinically available squamous cancer markers.
    Specifically, Cohort 2 was validated as an independent external test set, where
    the 14-DM and 9-DM models achieved accuracies of 82.1% and 91.0%, respectively.
    Notably, the 9-DM model maintained robust performance in the subsequent Cohort
    3 (83.3% accuracy; AUC = 0.93), thereby confirming its generalizability across
    distinct patient populations. Furthermore, the 9-DM model demonstrates strong
    performance in identifying early-stage ESCC patients. In a cohort of stage I-II
    ESCC patients and HC, the model accurately identified 85.7% of early ESCC patients,
    resulting in an overall accuracy of 90.8%, which surpasses existing clinical markers.
    Molecular characterization revealed significant overexpression of PTX3, FST, and
    EIF2S2 in ESCC-derived extracellular vesicles (FC > 10), with tumor-specific expression
    patterns confirmed by immunofluorescence. These findings collectively validate
    the model''s clinical utility while elucidating molecular foundations, supporting
    its further development through expanded validation studies and algorithmic refinement
    for clinical implementation.


    Additionally, serum samples from patients with CRC, GC, and BC were tested in
    this study. Compared to ESCC, the proteins identified in these three cancer types
    generally exhibit lower expression levels. The 9-DM model can accurately identify
    ESCC patients. This further substantiates the specificity of the selected markers
    and the diagnostic model for ESCC. Overall, our strengths lie in performing a
    proteomic analysis of serum small EVs and describing the functional landscape
    of serum small EVs proteins in patients. A set of straightforward protein markers
    has been screened, and a machine learning approach has been applied to construct
    a robust diagnostic model for ESCC, facilitating replication, optimization, and
    clinical application. Additionally, a barcode immunoassay platform has been developed
    that can utilize 10 µL serum samples for simultaneous high-throughput assays involving
    multiple samples and parameters, which holds significant translational value for
    clinical applications.


    This study has several limitations that should be acknowledged. First, as our
    predictive model was developed using relatively quantitative proteomics data,
    its clinical application for ESCC risk assessment in new patients will require
    standardized quality control samples during model implementation. Despite these
    limitations, our work has successfully identified key EVs proteome markers that
    effectively discriminate ESCC from healthy controls, representing a crucial advancement
    toward clinically applicable diagnostic models. Second, the current platform requires
    manual data transfer of test results to the machine learning model, which may
    introduce operational complexity in clinical settings. Moving forward, we will
    pursue absolute quantitative proteomic analysis of these biomarkers in large-scale
    multicenter cohorts to establish clinically relevant reference ranges and detection
    thresholds, while simultaneously working to develop a fully integrated automated
    platform that combines detection, data acquisition, and diagnostic output to enhance
    both clinical utility and operational efficiency.'
