    为评估9-DM模型对ESCC诊断的特异性，从结直肠癌（CRC）、胃癌（GC）和乳腺癌（BC）患者收集血清样本。患者的性别和年龄分布见图 S24（支持信息）。在CRC、GC和BC的血清小EV中，9个标志物的表达水平与ESCC相比显示出显著差异（图6A；图
    S25，支持信息）。基于9-DM的PCA表明，与其他癌症类型相比，ESCC样本表现出独特的特征（图6B）。然而，使用9-DM的PCA无法有效区分CRC、GC和BC样本与HC样本（图
    S26A–C，支持信息）。


    值得注意的是，除CXCL6和EIF2S2外，其余七个标志物在CRC、GC和BC患者的血清小EV中表达水平较低（图6C–K）。将CRC、GC和BC的数据纳入9-DM模型完全无法将其与HC区分开（图
    S26D,E，支持信息）。这些发现强调了所选小EV蛋白标志物和9-DM模型在诊断ESCC中的特异性。


