    为进一步评估筛选的标志物是否优于现有临床标志物，检测了SCC的表达水平，SCC是一种常用的鳞状细胞癌标志物。使用微流控平台，在SCC的不同浓度下测量标准蛋白的荧光强度以创建标准蛋白曲线（图
    S17A，支持信息）。然后在104名ESCC患者和34名健康对照的血清中测量SCC的表达水平（图 S17B，支持信息）。并且根据测量的荧光强度和标准蛋白定量曲线计算浓度。发现只有14.4%的ESCC患者SCC表达水平超过1.5
    ng mL−1（图4D）。此外，与HC相比，ESCC患者中SCC的平均表达水平没有显著差异（图 S17C，支持信息）。


    此外，基于14种筛选蛋白质荧光水平的PCA成功地区分出更明显的ESCC患者亚组与HC（图4E）。使用ROC曲线评估标志物的诊断效能，单个蛋白标志物的ROC曲线下面积（AUC）范围为0.52至0.88（图
    S18，支持信息），而SCC的AUC仅为0.51（图4F）。总之，本研究鉴定的14个标志物显示出对ESCC潜在的临床诊断价值。


    ## 2.5. 精确诊断模型的构建与验证


    为了利用候选蛋白开发ESCC的创新诊断方法，采用机器学习创建能够精确预测临床状态的模型（图5A）。最初，使用随机森林算法基于14种蛋白构建模型，并根据准确率（ACC）和AUC的综合评分优化模型参数（图
    S19A–C，支持信息）。最优值设定为 ntree = 145 和 mtry = 1。


    队列1按7:3的比例随机分为训练集和测试集，而队列2作为独立的外部测试集，称为测试集2。为了可视化模型性能，生成了图表以比较预测值与实际疾病状态（ESCC或HC）。以0.5为分类截止值，14个诊断标志物（DM）模型在测试集1中准确识别了63.2%的ESCC患者，在测试集2中为78.7%（图5B,C）。该模型在训练集中表现出100%的准确率（图
    S19D，支持信息），测试集1的准确率为79.1%（图 S19E，支持信息），测试集2为82.1%（图 S19F，支持信息）。各自测试集的AUC值分别为0.94和0.96（图5D）。


    为了进一步优化模型并降低检测成本，使用随机森林算法对14-DM模型中变量的重要性进行排序。根据平均最小深度和节点数，ELA2、CXCL6、MMP9、CRP和BPIFB1排名前五，其余9种蛋白用于进一步分析（图5E）。结果表明，基于ACC、AUC和整体性能，9个蛋白变量获得了最高的综合评分（图5F）。所选变量为MMP9、CRP、CXCL6、FST、EIF2S2、ELA2、BPIFB1、PTX3和CD16。逐一排除变量会导致准确率下降程度不同，观察到MMP9的下降最为显著（图5G），这意味着MMP9在诊断模型中发挥重要作用。


    使用这九个变量构建改进的随机森林模型，将参数优化为 ntree 设为400，mtry 设为1（图 S20A–C，支持信息）。该9-DM模型在测试集1中准确识别了79.0%的ESCC患者，在测试集2中为91.5%（图5H,I）。准确率在测试集1中为88.4%（图
    S20D，支持信息），测试集2中为91.0%（图 S20E，支持信息），各自测试集的AUC值分别为0.96和0.95（图5J）。这些结果表明9-DM模型具有高灵敏度和可靠性。


    为了进一步验证所选生物标志物和9-DM模型的普适性，在2025年1月至3月期间于齐鲁医院招募了由30名ESCC患者和30名健康对照组成的独立验证队列（队列3）。外部验证结果显示，大多数候选生物标志物的表达模式与队列1和2中观察到的结果一致（图
    S21 和 S22，支持信息），而9-DM模型保持了稳健的诊断性能，分类准确率为83.3%（AUC = 0.93）（图 S23，支持信息），从而证实了我们的蛋白特征在ESCC检测中的临床实用性和可靠性。


    为评估其诊断早期ESCC的有效性，9-DM模型被应用于两个测试集中区分I-II期ESCC与HC。该模型成功识别了85.7%的早期ESCC患者和93.2%的HC，总体准确率为90.8%（图
    S20F,G，支持信息），AUC为0.96（图 S20H，支持信息）。在临床环境中，ESCC的早期检测对于及时干预和根治性切除至关重要，这可以降低手术难度并显著提高患者生存率。[28,29]


