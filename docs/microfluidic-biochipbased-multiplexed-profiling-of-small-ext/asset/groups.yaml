  mdcn: '

    总之，所提出的平台鉴定出具有潜在诊断价值的生物标志物，并构建了整合机器学习算法的诊断模型。此外，已开发出一种条形码免疫分析平台，集成了小EVs捕获、原位裂解和多参数检测，能够实现多样本的快速分析。这些发现增强了对疾病病理学的理解，同时促进了早期检测并开发了多参数小EVs检测的新方法。更广泛地，基于机器学习的小EVs数据解读在肿瘤检测和临床决策中具有明显优势，而所开发的微流控分析平台在实际临床应用中具有重要的转化前景，并可扩展至其他疾病的研究。


    ## 4. 实验部分


    ### 临床队列

    2023年8月至2024年5月期间，66例ESCC患者从山东大学齐鲁医院招募，80例接受体检的HC被纳入，形成队列1。2023年7月至2023年9月期间，另有47例ESCC患者在山东第一医科大学附属省立医院接受治疗，以及20例HC被招募，从而建立队列2。此外，自2025年1月至3月，30例ESCC患者和30例HC在齐鲁医院入组，以建立用于验证研究的队列3（图S28，支持信息）。纳入标准：参与者年龄为18–85岁，经组织学确诊为ESCC，且未接受治疗。排除标准：具有双原发或多原发肿瘤的个体；患有免疫紊乱或自身免疫性疾病的参与者；以及接受过器官移植、非自体骨髓移植或干细胞移植者被排除。健康个体的纳入标准：

    - 已获得书面同意；

    - 年龄在18至85岁之间；且

    - 无恶性疾病。

    上述排除标准同样适用于健康个体。本研究使用的所有样本均回顾性地从已建立的机构生物库中获得。人材料的用途已获得山东大学齐鲁医院医学科学研究伦理委员会批准（批准号：KYLL-2021(K
    S)-011和KYLL-202409(YJ)-024）。所有参与者均自愿签署知情同意书。


    ### 临床样本采集

    从ESCC患者和HC收集血清样本。每位参与者采集5 mL外周静脉血样本。样本在4 °C下于1 h内迅速转移至实验室进行进一步处理。新采集的血液样本在室温（RT）下保持1
    h以允许凝固，然后进行离心。上清液随后在4 °C、1,000 g下离心15 min后小心移除并转移至干净的试管中。为确保完全去除血小板和其他碎屑，样本在4
    °C、10 000 g下进行第二次离心10 min。收集的上清液储存在−80 °C。


    ### 细胞上清液小EVs的收集与分离

    细胞在完全培养基中培养至达到70%汇合度，此时培养基更换为无胎牛血清（FBS）培养基。在无FBS条件下培养48 h后收集上清液。收集的上清液进行连续离心：首先以300
    × g离心10 min，随后以2000 × g离心10 min，然后以10 000 × g离心30 min。然后上清液通过0.22-μm滤器并以100 000
    × g超速离心70 min。离心后获得的上清液被指定为小EVs去除组分。小EVs沉淀随后重悬于磷酸盐缓冲液（PBS）中并进行第二次100 000 × g超速离心70
    min以纯化小EVs。


    ### 纳米颗粒追踪分析

    小EVs被重悬并稀释100-至500倍，以获得每帧20–100个颗粒的浓度。分析使用NanoSight NS300系统（NanoSight Technology,
    Malvern, UK）进行，该系统配备488 nm激光器和高度灵敏的sCMOS相机。在手动将小EVs引入腔室后，每个样本使用13级相机进行三次重复测量，采集时间为30
    s，检测阈值设为7。NTA分析软件版本2.3用于分析每个视频中至少200条完整轨迹。


    ### 透射电子显微镜

    小EVs颗粒用2.5%戊二醛在RT下处理10 min。然后将5–10 μL小EVs悬液的一滴置于铜网上。用滤纸去除多余液体，小EVs样本用PBS洗涤三次，每次洗涤持续10
    min。最后，加入10 μL 1%醋酸铀在铜网上对小EVs进行负染色1 min，然后使用Tecnai G2 F20透射电子显微镜进行检查。


    ### 血清小EVs用于液相色谱-质谱（LC-MS）及数据非依赖采集

    血清小EVs使用EVtrap试剂盒分离和收集。分离后，小EVs经裂解、蛋白提取、还原、烷基化和胰蛋白酶消化以生成用于质谱分析的肽链。接下来，每个样本的肽经受质谱进行DIA分析。更多细节见图S29（支持信息）。


    ### 差异蛋白及通路富集分析

    ESCC患者与HC之间差异蛋白丰度使用R软件中的“limma”包计算。显著性水平设定为校正后P值< 0.05，log2倍数变化（FC）阈值为> 0.58（表示上调）或<
    −0.58（表示肿瘤中下调）。功能富集分析使用KOBAS（http://bioinfo.org/kobas）进行，参数为默认。


    ### 微流控平台的制备

    GOQDs基底玻璃载玻片和PDMS微腔层按照先前报道的相同程序制备。[31] 具有14个平行微通道的微打印芯片首先与GOQD功能化玻璃载玻片键合，该纳米材料基底显示出显著增强的抗体固定化效率。使用精密移液器，将3
    μL捕获抗体溶液分配到每个独立微通道的入口，然后在室温下施加真空力将装载的捕获抗体从入口泵送至出口。捕获抗体在每个相应微通道的基底表面固定化。去除微打印芯片后，基底用1%
    BSA溶液处理以进行表面钝化，随后用3% BSA溶液封闭以饱和微通道外的剩余反应位点。最后，芯片经过严格洗涤、旋干并在4 °C下保存直至使用。微打印芯片包含14个锯齿状微通道，保持完全的流体隔离。每个检测单元包括全部14个微通道的完整循环回路（图S30，支持信息）。为捕获小EVs，将4.5
    μL含有CD63（100 μg mL−1）、CD81（100 μg mL−1）和CD9（100 μg mL−1）抗体的混合溶液加入每个反应单元并过夜孵育。然后使用3%
    BSA封闭10 min，随后用PBS和超纯水连续洗涤以去除未结合组分。为富集小EVs，将10 μL血清样本加入每个反应单元并孵育60 min。然后去除上清液，孔用PBS冲洗。随后，将5
    μL RIPA裂解缓冲液与蛋白酶抑制剂的混合物（100:1比例）加入每个反应单元，以原位裂解捕获的小EVs 30 min。对于抗原检测，微阵列芯片的PDMS微腔用1%
    BSA密封。然后将小EVs裂解液转移至微阵列芯片上的孔中并孵育45 min，之后去除上清液。微阵列芯片在1% BSA中孵育，孔与终浓度为5 μg mL−1的检测抗体孵育45
    min，随后与APC孵育30 min。微阵列用PBS和蒸馏水彻底洗涤然后振干。使用荧光扫描仪测量抗原的荧光强度。本研究使用的商业抗体和蛋白来自R&D Systems、BioLegend、NOVUS、eBioscience、Abcam和Santa
    Cruz Biotechnology等制造商。

