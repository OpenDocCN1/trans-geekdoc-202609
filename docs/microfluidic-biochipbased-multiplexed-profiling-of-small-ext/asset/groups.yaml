    ## 2.3. 用于血清小EV蛋白筛选的条形码免疫分析芯片


    ![](img/1d59dabaa30cead580459a3f47caa4df_2_0.png)


    Figure 1. 用于ESCC诊断的小EV蛋白panel示意图。缩写。DM：诊断标志物；ESCC：食管鳞状细胞癌；EVs：细胞外囊泡；HC：健康对照；PC：主成分。


    小EV的高效捕获和检测对于小EV生物标志物的应用至关重要。开发了一种条形码微流控平台，该平台整合了小EV捕获、原位裂解和EV蛋白检测，以全面分析小EV表面和内部的蛋白，从而提高标志物检测的灵敏度。石墨烯氧化物量子点（GOQDs）已证明其与蛋白质和核酸结合的强能力。[30,31,23]因此，制造了具有60个反应单元的聚二甲基硅氧烷（PDMS）芯片，并将其与GOQDs自组装玻璃基底对齐。[31]CD63、CD81和CD9是小EV常用的四跨膜蛋白，它们代表了重叠但不同的小EV群体。[22,24–26]因此，在每个反应单元中，将CD63、CD81和CD9抗体的混合物固定在GOQDs基底上，以提高小EV的捕获效率（图3A）。然后，将血清样品加载到每个反应单元中，小EV被捕获在芯片上。透射电子显微镜（TEM）和纳米颗粒追踪分析（NTA）的小EV结果显示于图3B、C和图S3（支持信息）。小EV的尺寸主要集中在200
    nm以下。将CD63、CD81、CD9混合抗体的捕获效率与三种单独捕获抗体进行比较，混合抗体在细胞系上清液和血清中均捕获了最多的小EV（图S4A、B，支持信息），促使我们使用混合抗体进行小EV捕获。为评估小EV捕获效率，将一系列不同浓度的小EV引入反应单元。小EV用APC荧光标记，并检测荧光信号，其从10^5到10^10
