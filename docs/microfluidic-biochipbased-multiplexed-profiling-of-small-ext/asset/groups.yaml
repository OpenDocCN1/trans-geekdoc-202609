    ## Microfluidic Platforms Data Analysis

    The detection process involves the following steps: 1) Signal Acquisition: The
    biochip was scanned using a 635 nm laser channel, and fluorescence signals from
    each barcode were quantified using GenePix Pro software, and the average fluorescence
    intensity from the detection area was achieved. 2) Data Normalization: Raw fluorescence
    intensity values were log10-transformed prior to machine learning model input
    to normalize data distribution and enhance model performance.


    ## Diagnostic Predictive Modeling

    A diagnostic prediction model was developed for ESCC using R version 4.4.2, employing
    an integrated machine learning approach for multidimensional analysis. Methodologically,
    multiple R packages were systematically implemented: randomForest for random forest
    modeling, caret for data preprocessing and model tuning, pROC for performance
    evaluation, randomForestExplainer for feature importance analysis, ggplot2 for
    visualization, and Rtsne for high-dimensional data dimensionality reduction. During
    model construction: data standardization and stratified sampling (70% training
    set/30% test set) were first performed using the caret package to ensure balanced
    data distribution. The random forest model was developed using the bootstrap aggregation
    algorithm implemented in randomForest, initially incorporating 14 plasma proteins
    as predictive variables. Through caret-guided grid search validation, the model
    parameters were optimized to: ntree = 145 decision trees, mtry = 14 (number of
    features considered at each node split), and nodesize = 5 (minimum samples per
    terminal node). Parameter optimization was guided by both AUC values calculated
    by pROC and confusion matrix metrics generated by caret. Feature importance analysis
    was conducted using randomForestExplainer, which provided three complementary
    evaluation methods: 1) minimum depth analysis (min_depth_distribution) to identify
    the most classification-critical features; 2) node purity improvement (measure_importance)
    to quantify each feature’s contribution to model accuracy; and 3) root node splitting
    frequency to reflect global feature importance. Based on these analyses, the 9
    most predictive protein biomarkers were selected from the initial 14 features
    for the final model. The validation phase employed a multidimensional evaluation
    strategy: the caret-generated confusion matrix provided key metrics including
    accuracy, sensitivity, and specificity; pROC calculated AUC values from ROC curves;
    ggplot2 produced calibration curves; and Rtsne visualization demonstrated the
    separation pattern between ESCC patients and healthy controls in the protein biomarker
    space. The model outputs individualized prediction probabilities (range 0–1) through
    randomForest’s predict function, with a diagnostic threshold set at 0.5 (probability
    > 0.5 classified as ESCC, ≤0.5 as healthy controls). All visualizations were created
    using ggplot2, including ROC curves, multi-dimensional feature importance heatmaps,
    t-SNE dimensionality reduction scatter plots, and model calibration curves.


    ## Immunofluorescence Staining

    Formalin-fixed, paraffin-embedded sections were deparaffinized through xylene
    and graded ethanol series, followed by antigen retrieval in citrate buffer (pH
    6.0) using microwave heating. After blocking with 10% serum matching the secondary
    antibody host species, slides were incubated with the following primary antibodies
    at 4 °C overnight: anti-FST (1:400, Proteintech #60060-1-Ig), anti-PTX3 (1:200,
    Proteintech #13797-1-AP), and anti-EIF2S2 (1:500, Servicebio #GB111135). Alexa
    Fluor-conjugated secondary antibodies (1:200) were applied for 50 min at room
    temperature, followed by DAPI counterstaining and autofluorescence quenching.
    Sections were mounted with anti-fade medium and imaged using a digital slide scanner.
    PBS washes (3 min × 5 min) were performed between all steps.


    ## Statistical Methods

    The Kolmogorov–Smirnov test was applied to assess the normality of all data, while
    categorical data were analyzed using the chi-square test. And for data that were
    normally distributed, unpaired two-tailed t-tests were utilized for comparisons,
    while the Mann–Whitney nonparametric test was used for non-normally distributed
    data. The linear relationship between fluorescence intensity or optical density
    (O.D.) values and target antigen concentration was evaluated using the R-squared
    (R²) statistic. A p-value of below 0.05 was considered indicative of statistical
    significance. The limit of detection (LOD) was determined by the equation: LOD
    = 3 × δ / S, where δ is the relative standard deviation of the blank value, and
    S denotes the slope derived from the linear regression equation.


    Diagnostic efficiency was assessed using accuracy, ROC curves, and other relevant
    metrics. Analyses were conducted using GraphPad Prism (v.9.5), R software (v.4.4.1)
    (available at https://www.r-project.org/), and Origin (v.2021).


