    # 基于微流控生物芯片的小细胞外囊泡蛋白多重分析结合机器学习用于早期疾病诊断


    Xue Zhang, Yibin Jia, Zhikai Li, Yunhong Zhang, Chao Wang, Yanbo Liang, Jiaoyan
    Qiu, Mingyuan Sun, Xiaoshuang Chen, Miao Huang, Yu Zhang, Jianbo Wang,* Hong Liu,
    Chuanbin Mao,* and Lin Han*


    精准的早期诊断对于预防疾病、提高治愈率和生存率至关重要。目前大多数主要疾病尚无可靠的早期诊断生物标志物。在此，以食管鳞状细胞癌（ESCC）为疾病模型，通过整合条形码免疫分析生物芯片与机器学习，开发了一种用于准确早期诊断的蛋白组生物标志物
    panel 检测平台。该生物芯片可从血清中捕获小细胞外囊泡（EVs），原位裂解，并定量包括 EV 膜蛋白和内部蛋白在内的多种蛋白。其被用于多中心 273 例临床样本的检测。随后利用机器学习对验证集进行分析，得出
    ESCC 的精准诊断模型。该模型基于质谱分析鉴定的差异表达蛋白中筛选出的九个诊断蛋白生物标志物，在外部验证中达到 91.0% 的准确率，在检测早期 ESCC
    时准确率为 90.8%。这些结果显著优于目前用于鳞状细胞癌的生物标志物（仅 14.4%）的准确率。因此，将细胞外囊泡蛋白分析与机器学习相结合为识别 ESCC
    患者提供了一种方法。所开发的细胞外囊泡分析平台为多生物标志物检测方法的临床应用提供了有前景的工具，推动了 ESCC 的早期诊断。


    ## 1. Introduction


    恶性肿瘤是人类最主要的致死原因之一。例如，食管癌（EC）在全球最常见的恶性肿瘤中排名第七，鳞状细胞癌占病例的 90%，且死亡率高，严重影响患者生活质量。[1,2]
    虽然一些传统筛查方法，例如内镜筛查，可降低 EC 的发病率，但这些方法具有侵入性、成本高且需要熟练操作者。[3–5] 此外，组织活检受限于获取样本的困难，且由于肿瘤的时间和空间异质性而存在取样偏差。[6]
    因此，需要更少侵入性的方法来筛查更大比例的人群。[7]


    液体活检微创、安全，且可克服与肿瘤内异质性相关的问题。[8,9] 无细胞 DNA（cfDNA）和游离蛋白是液体活检最常用的标志物；然而，循环 cfDNA 和游离蛋白对早期
    EC 的敏感性低于 20%。[10–12] 小细胞外囊泡是小于 200 nm 的细胞外囊泡（EVs）的一个亚群，广泛存在于组织间隙和体液中，携带指示其细胞来源的分子指纹。[13,14]
    与其他液体活检标志物（如循环肿瘤细胞）相比，小细胞外囊泡在血液中更丰富，包含更多样化的信息，并且由于其完整的膜结构而更稳定。[15] 在多种癌症类型中，包括结直肠癌（CRC）、[16]
    胰腺导管腺癌、[17,18] 前列腺癌、[19] 和卵巢癌、[20] 小细胞外囊泡携带的 RNA 和蛋白可作为有前景的生物标志物，为肿瘤诊断和预后提供可靠信息。


    小细胞外囊泡膜蛋白主要参与如 EVs 形成、细胞间通讯和靶向特异性等功能。[21] 相反，小细胞外囊泡内部的大多数蛋白来源于母细胞的生理或病理状态。这使得小细胞外囊泡内部蛋白能够反映细胞内生物学过程和信号机制，从而为小细胞外囊泡在细胞间信息传递中的作用提供有价值的见解。[22]
    因此，对小细胞外囊泡膜蛋白和内部蛋白进行全面分析可获得更整体、更精确的生物学数据，这对于评估机体整体生理状态至关重要。质谱可筛选小细胞外囊泡膜和内部蛋白，并可鉴定数千种蛋白。然而，质谱检测耗时数天、成本高且需要大量样本体积，这限制了其在临床大规模筛查中的应用。质谱与其他检测技术的结合对临床应用前景广阔，因为质谱可提供差异表达蛋白列表，而另一种检测技术可对少量临床样本进行快速、经济、灵敏的检测。生物芯片因其检测速度快、经济成本低、样本消耗少等优势而受到认可。[23,24]
    目前，基于生物芯片的小细胞外囊泡捕获平台表现出高特异性和灵敏度。[25–29] 然而，现有的小细胞外囊泡标志物检测生物芯片平台主要集中于小细胞外囊泡表面蛋白，缺乏对小细胞外囊泡膜蛋白和内部蛋白进行全面快速检测的平台。


    在此，以食管鳞状细胞癌（ESCC）为模型，我们开发了一种整合质谱和条形码免疫分析生物芯片的小细胞外囊泡蛋白检测平台，以研究患者中的膜蛋白和内部蛋白，并通过血清小细胞外囊泡蛋白质组鉴定出在癌症患者和健康对照中差异表达且具有诊断潜力的蛋白标志物。质谱鉴定出超过
    2000 种蛋白，并提供了早期诊断的潜在蛋白标志物。生物芯片从血清中捕获小细胞外囊泡，原位裂解，并定量分析质谱在两个队列临床样本中鉴定的多种潜在蛋白标志物。然后，基于机器学习算法为
    ESCC 开发了可靠的诊断模型，并在独立临床队列中进行了验证。该平台能够对多中心多个样本进行高通量、快速分析，促进多生物标志物检测向临床应用的转化。


