    相邻正常组织样本显示出肿瘤特异性表达模式，在 ESCC 组织中出现阳性信号，而在组织学正常的相邻区域仅显示微弱或可忽略的染色（图 S27，支持信息）。这些发现与之前记录这些生物标志物肿瘤限制性表达谱的报道一致。[32-34]


    早期诊断可显著改善患者预后。[26,35] 目前的内镜诊断和筛查方法有限，迫切需要新的无创方法来筛查并持续监测癌前病变。[1] 尽管近年来液体活检已被探索，cfDNA
    在 EC 早期诊断中的敏感性低于 20%。[10-12] 相比之下，小细胞外囊泡广泛存在于生物液体中并具有双层膜结构，提供高稳定性。[22] 虽然多项研究表明小细胞外囊泡中的
    miRNA 可区分肿瘤患者与健康个体，但很少有效转化为临床应用。[36,37] 与 RNA 相比，小细胞外囊泡来源的蛋白更稳定，因此更适合临床检查。[38]
    近年来蛋白质组学检测技术的不断完善，为理解肿瘤患者和健康个体中的蛋白功能创造了机会。[39,40]


    ## 3. 讨论与结论


    在本工作中，虽然以 ESCC 作为模型来测试筛选的小细胞外囊泡蛋白 panel 进行早期诊断的应用，但这是一种通用方法，可用于筛选特定早期诊断生物标志物、评估治疗疗效生物标志物以及准确预测其他疾病的预后生物标志物。


    ![](img/1d59dabaa30cead580459a3f47caa4df_8_0.png)


    图 6. ESCC 小细胞外囊泡蛋白的特异性。其他癌症中 ESCC 生物标志物的表达。A) 热图显示 HC 以及 ESCC、CRC、GC 和 BC 患者血清小细胞外囊泡中
    9 个生物标志物的表达。B) 基于 9 个生物标志物的 PCA 图，比较其他癌症和 ESCC。每个点代表一个样本，蓝色点表示其他癌症，红色点代表 ESCC
    样本。百分比值代表解释方差。C) 箱线图显示 ESCC、CRC、GC 和 BC 患者血清小细胞外囊泡中 9 个生物标志物的平均表达水平。缩写。BC：乳腺癌；CRC：结直肠癌；ESCC：食管鳞状细胞癌；GC：胃癌；HC：健康对照；PC：主成分；PCA：主成分分析。


    在本研究中，使用 4D-DIA 鉴定并表征了患者和 HC 血清小细胞外囊泡中的所有蛋白，揭示了患者小细胞外囊泡中蛋白组成的变化。值得注意的是，小细胞外囊泡组成、蛋白结合和中性粒细胞脱颗粒等重要通路显著上调，提示其小细胞外囊泡蛋白质组的功能状态。此外，与肿瘤发生相关的通路，如内吞作用、趋化因子和内皮细胞迁移，在
    KEGG 通路分析中显著升高，表明小细胞外囊泡蛋白在肿瘤形成和进展中发挥关键作用。这进一步支持了在血清小细胞外囊泡蛋白质组中鉴定癌症诊断标志物的潜力。


    由于肿瘤固有的异质性和其微环境的复杂性，[41,42] 单一标志物难以准确反映肿瘤特征的整体变化。因此，多标志物组合已成为诊断和治疗方法的主流趋势。[43,44]
    这一趋势对检测方法提出了更高要求，强调需要低样本消耗和高通量能力的检测方法，这对于标志物检测和癌症诊断至关重要。CD63、CD81 和 CD9 是存在于小细胞外囊泡膜上的跨膜蛋白，代表了部分重叠的小细胞外囊泡群体。[22,24,25]
    本研究开发的微流控平台利用针对 CD63、CD9 和 CD81 的抗体混合物特异性捕获血清小细胞外囊泡，在浓度为 10^8 至 10^10 particles
    mL^-1 时捕获效率超过 90%。捕获的小细胞外囊泡在芯片上原位裂解，产生总小细胞外囊泡蛋白，包括膜蛋白和内部蛋白。这种方法最大限度地减少了总小细胞外囊泡蛋白的损失并提高了检测的整体灵敏度。整个过程仅需要
    10 µL 血清样本量，显著减少了样本损失。此外，条形码免疫检测平台能够在 60 个临床样本中同时检测至少 14 个标志物，显著减少了多样本分析所需的时间。这使其特别适合于筛选多样化人群。值得注意的是，芯片对蛋白的检测限低至
    0.01–96.61 pg mL^-1，且荧光读数相对稳定。因此，本研究开发的条形码免疫检测平台在小细胞外囊泡蛋白检测方面具有巨大的临床应用潜力。


    虽然血清小细胞外囊泡蛋白质组学适用于表征疾病中的蛋白并鉴定有希望的诊断生物标志物，但解读复杂组织学数据仍然具有挑战性。[16,45–47] 机器学习越来越多地被认为是有助于提高医疗监测和诊断准确性的有价值工具。在本研究中，利用随机森林算法通过基于
    ACC 和 AUC 调整参数来选择最佳模型。诊断模型在测试集 1 中的准确率达到 79.1%。为了进一步提高准确率并降低检测成本，最佳模型 9-DM 通过机器学习确定，在测试集
    1 中达到 88.4% 的准确率。此外，机器学习算法揭示了某些小细胞外囊泡蛋白的预测潜力，这些蛋白通常被传统分析方法所忽视。例如，尽管 CD16 和 ELA2
    在比较 ESCC 患者与 HC 之间的总体平均值时未显示出显著差异，这两个标志物仍被保留在模型对最优变量的选择中。用于创建诊断模型的机器学习算法经过泛化验证，并显示出优于临床可用鳞状癌标志物的性能。具体而言，队列
    2 被验证为独立的外部测试集，其中 14-DM 和 9-DM 模型的准确率分别为 82.1% 和 91.0%。值得注意的是，9-DM 模型在随后的队列 3
    中保持稳健性能（准确率 83.3%；AUC = 0.93），从而证实了其在不同患者群体中的泛化能力。此外，9-DM 模型在识别早期 ESCC 患者方面表现出强性能。在
    I-II 期 ESCC 患者和 HC 的队列中，该模型准确识别了 85.7% 的早期 ESCC 患者，总体准确率达到 90.8%，超过了现有临床标志物。分子表征显示
    PTX3、FST 和 EIF2S2 在 ESCC 来源的细胞外囊泡中显著过表达（FC > 10），免疫荧光证实了肿瘤特异性表达模式。这些发现共同验证了模型的临床实用性，同时阐明了分子基础，支持其通过扩大验证研究和算法优化以实现临床实施的进一步开发。


    此外，本研究测试了 CRC、GC 和 BC 患者的血清样本。与 ESCC 相比，这三种癌症类型中鉴定的蛋白总体表达水平较低。9-DM 模型可以准确识别 ESCC
    患者。这进一步证实了所选标志物和诊断模型对 ESCC 的特异性。总体而言，我们的优势在于对血清小细胞外囊泡进行蛋白质组学分析并描述患者血清小细胞外囊泡蛋白的功能图谱。已筛选出一组简便的蛋白标志物，并应用机器学习方法构建了用于
    ESCC 的稳健诊断模型，促进了复制、优化和临床应用。此外，已开发出一种条形码免疫检测平台，可利用 10 µL 血清样本进行多样本和多参数的同时高通量检测，这对临床应用具有重要转化价值。


    本研究有若干局限性应予承认。首先，由于我们的预测模型是使用相对定量蛋白质组学数据开发的，其在新患者中用于 ESCC 风险评估的临床应用将在模型实施过程中需要标准化质量控制样本。尽管存在这些局限性，我们的工作已成功鉴定出关键的细胞外囊泡蛋白质组标志物，可有效区分
    ESCC 与健康对照，代表了迈向临床适用诊断模型的重要进展。其次，当前平台需要将检测结果手动传输到机器学习模型，这可能在临床环境中引入操作复杂性。展望未来，我们将对这些生物标志物在大规模多中心队列中进行绝对定量蛋白质组学分析，以建立临床相关的参考范围和检测阈值，同时努力开发一个完全集成的自动化平台，将检测、数据采集和诊断输出相结合，以提高临床实用性和操作效率。

