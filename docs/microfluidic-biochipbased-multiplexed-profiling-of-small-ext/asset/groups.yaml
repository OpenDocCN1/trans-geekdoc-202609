    Efficient capture and detection of small EVs are crucial for the application of
    small EVs biomarkers. A barcode microfluidic platform is developed, which integrates
    small EVs capture, in situ lysis, and EV proteins detection to comprehensively
    analyze proteins both on the surface and inside small EVs, thereby improving the
    sensitivity of marker detection. Graphene oxide quantum dots (GOQDs) have demonstrated
    their strong capability to bind proteins and nucleic acids.[30,31,23] Consequently,
    a polydimethylsiloxane (PDMS) chip with 60 reaction units is fabricated, and it
    is aligned with a GOQDs self-assembled glass substrate.[31] CD63, CD81, and CD9
    are commonly used tetraspanin of small EVs that represent overlapping but distinct
    populations of small EVs.[22,24–26] As a result, a mixture of antibody CD63, CD81,
    and CD9 is immobilized on the GOQDs substrate in each reaction unit in order to
    improve the capture efficiency of small EVs (Figure 3A). Then, serum samples are
    loaded into each reaction unit, and small EVs are captured on the chip. Transmission
    electron microscopy (TEM) and nanoparticle tracking analysis (NTA) of the small
    EVs are shown in Figure 3B,C and Figure S3 (Supporting Information). The size
    of small EVs is primarily concentrated below 200 nm. The capture efficiency of
    CD63, CD81, CD9 mixed antibodies is compared to that of three individual capture
    antibodies, and the mixed antibodies captured the largest number of small EVs
    both for cell line supernatant and serum (Figure S4A,B, Supporting Information),
    prompting us to use mixed antibodies for small EVs capture. To evaluate the small
    EVs capture efficiency, a series of different small EVs concentrations were introduced
    into the reaction units. The small EVs were labeled by APC fluorescence, and the
    fluorescence signals were detected, which increased pro-


    gressively from 10^5 to 10^10 particles mL^-1 (Figure S4C, Supporting Information).
    By analyzing the fluorescence values between the captured small EVs and small
    EVs in the residue liquid, the small EVs capture efficiency is calculated, which
    reaches 91.9% at 10^10 particles mL^-1, 93.5% at 10^9 particles mL^-1, and 97.7%
    at 10^8 particles mL^-1 (Figure 3D). Through three independent experimental replicates,
    the platform consistently demonstrated EVs capture efficiencies exceeded 90% at
    concentrations ranging from 10^8 to 10^9 particles mL^-1 (Figure S5, Supporting
    Information). Considering the typical small EVs concentration of ≈10^9 particles
    mL^-1 in healthy humans, a concentration of 10^9 particles mL^-1 from a cell line
    is utilized to optimize the incubation time. The amount of captured small EVs
