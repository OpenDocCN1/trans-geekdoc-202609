    ## 2. Results


    ### 2.1. 早期诊断的小细胞外囊泡蛋白分析设计


    本研究的总流程，包括各分析参与者招募的具体细节，见图 1。 具体而言，我们对 12 例 ESCC 患者和 18 例健康对照（HC）的血清小细胞外囊泡进行基于液相色谱-质谱（LC-MS）的
    4D 数据非依赖采集（4D-DIA）方法，以获得其蛋白质组数据。鉴定出超过 2000 种小细胞外囊泡蛋白，并根据差异表达和生物信息学意义筛选出 14 个潜在标志物。然后在队列
    1 中比较 66 例 ESCC 患者和 80 例 HC 中这些标志物的表达。利用机器学习技术探索蛋白谱与临床表型之间的相关性。开发了 ESCC 诊断模型，并优化
    14 个潜在标志物中的 9 个构建 9-DM 模型，并评估其区分 ESCC 患者与 HC 的性能。此外，还采用外部测试集验证机器学习模型的稳健性，该测试集包含
    67 个样本，包括 47 例 ESCC 患者和 20 名健康人。


    ### 2.2. 候选小细胞外囊泡蛋白标志物的筛选


    为表征 ESCC 中血清小细胞外囊泡的蛋白功能，我们对 12 例 ESCC 患者和 18 例 HC 血清样本分离的小细胞外囊泡进行 4D-DIA 质谱分析（图
    2A）。总共在 ESCC 患者血清小细胞外囊泡中鉴定出 2062 种蛋白，而在 HC 中检测到 2370 种蛋白，其中 2053 种蛋白在两组中共存（图 2B）。主成分分析（PCA）有效区分了
    ESCC 样本与 HC，提示 ESCC 血清小细胞外囊泡蛋白质组发生了显著重塑（图 2C）。采用倍数变化（FC）阈值 ≥1.5 且显著性水平 P < 0.05
    进一步分析 ESCC 与 HC 共有的血清小细胞外囊泡蛋白差异。该分析显示，与 HC 相比，ESCC 血清小细胞外囊泡中 203 种蛋白显著上调（图 2D）。此外，差异蛋白的基因本体（GO）分析显示，ESCC
    患者血清细胞外囊泡中的蛋白显著富集于“细胞外外泌体”、“蛋白结合”和“中性粒细胞脱颗粒”相关通路（图 2E）。此外，京都基因与基因组百科全书（KEGG）通路分析显示“核糖体”、“趋化因子信号通路”和“内吞作用”通路显著上调（图
    2F）。上述结果表明，ESCC 患者血清小细胞外囊泡中激活了多个显著的功能和代谢通路。基于 ESCC 患者与 HC 血清小细胞外囊泡蛋白质组差异的分析以及前两个
    GO 通路，筛选出 14 种小细胞外囊泡蛋白，其在 ESCC 中显著升高，作为后续诊断分析的候选标志物（图 2G；支持信息图 S1 和 S2）。

