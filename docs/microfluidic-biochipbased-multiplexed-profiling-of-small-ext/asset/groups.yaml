    # Microfluidic Biochip-Based Multiplexed Profiling of Small Extracellular Vesicles
    Proteins Integrated with Machine Learning for Early Disease Diagnosis


    Xue Zhang, Yibin Jia, Zhikai Li, Yunhong Zhang, Chao Wang, Yanbo Liang, Jiaoyan
    Qiu, Mingyuan Sun, Xiaoshuang Chen, Miao Huang, Yu Zhang, Jianbo Wang,* Hong Liu,
    Chuanbin Mao,* and Lin Han*


    Accurate early diagnosis is essential for preventing diseases and improving cure
    and survival rates. There are no reliable early-diagnosis biomarkers for most
    major diseases. Here, esophageal squamous cell carcinoma (ESCC) is used as a disease
    model to develop a platform for detecting a panel of proteomic biomarkers for
    accurate early diagnosis by integrating a barcode immunoassay biochip with machine
    learning. The biochip captures small extracellular vesicles (EVs) from serum,
    lyses them in situ, and quantifies multiple proteins, including membrane and internal
    proteins of EVs. It is utilized to test 273 clinical samples across multiple centers.
    The validation sets are then analyzed using machine learning, resulting in a precise
    diagnostic model for ESCC. This model, based on nine diagnostic protein biomarkers
    identified through mass spectrometry analysis of differentially expressed proteins,
    achieves an accuracy of 91.0% in external validation, with a 90.8% accuracy in
    detecting early-stage ESCC. These results significantly surpass the accuracy (only
    14.4%) of the currently used biomarker for squamous cell carcinoma. Thus, integrating
    extracellular vesicles protein analysis with machine learning presents can identify
    ESCC patients. The developed extracellular vesicles analysis platform offers a
    promising tool for the clinical application of multi-biomarker detection methods,
    advancing the early diagnosis of ESCC.


    # 1. Introduction


    Malignant tumors are one of the biggest killers of humans. For instance, esophageal
    cancer (EC) is ranked as the seventh most common malignant tumor globally, with
    squamous cell carcinomas accounting for 90% of cases and exhibiting a high mortality
    rate that significantly impacts patients’ life quality.[1,2] While some traditional
    screening methods, for instance, endoscopic screening, reduce the incidence of
    EC, these methods are invasive, costly, and require a skilled operator.[3–5] Additionally,
    tissue biopsies are limited by the challenges of obtaining samples and are subject
    to sampling bias due to the temporal and spatial heterogeneity of tumors.[6] Consequently,
    less invasive methods are desired to screen a larger portion of the population.[7]


    Liquid biopsies are minimally invasive, safe, and can overcome the difficulties
    associated with intra-tumor heterogeneity.[8,9] Cell-free DNA (cfDNA) and free
    proteins are the most commonly used markers


