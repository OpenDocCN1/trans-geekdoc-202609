    for liquid biopsies; however, circulating cfDNA and free proteins have less than
    20% sensitivity for early-stage EC.[10–12] Small extracellular vesicles, a subset
    of extracellular vesicles (EVs) smaller than 200 nm, are ubiquitously found in
    the interstitial space of tissues and body fluids, carrying molecular fingerprints
    indicative of their cellular origin.[13,14] Compared to other liquid biopsy markers,
    such as circulating tumor cells, small EVs are more abundant in blood, contain
    more diverse information, and are more stable due to their intact membrane structure.[15]
    In various cancer types, including colorectal cancer (CRC),[16] pancreatic ductal
    adenocarcinoma,[17,18] prostate cancer,[19] and ovarian cancer,[20] RNA and proteins
    carried by small EVs can serve as promising biomarkers, providing reliable information
    for tumor diagnosis and prognosis.


    Small EVs membrane proteins are primarily involved in functions such as EVs formation,
    intercellular communication, and targeting specificity.[21] In contrast, most
    proteins inside small EVs are derived from the physiological or pathological state
    of the parent cell. This allows the internal proteins of small EVs to reflect
    intracellular biological processes and signaling mechanisms, thereby offering
    valuable insights into the role of small EVs in intercellular information transfer.[22]
    Therefore, a comprehensive analysis of both membrane and internal proteins of
    small EVs can yield more holistic and precise biological data, which is crucial
    for evaluating the overall physiological state of the organism. Mass spectrometry
    can screen both small EVs membranes and internal proteins and can identify thousands
    of proteins. However, it takes mass spectrometry days to conduct the detection,
    is costly, and needs a large amount of sample volume, which limits its applications
    in clinical large-scale screening. The combination of mass spectrometry and other
    detection techniques is promising for clinical applications, since mass spectrometry
    provides a list of differentially expressed proteins, and another detection technique
    conducts the fast, economic, and sensitive detection of small volume of clinical
    samples. Biochips have gained recognition for their advantages in detection speed,
    economic cost, and low sample consumption.[23,24] Currently, small EVs capturing
    platforms based on biochips demonstrate high specificity and sensitivity.[25–29]
    However, existing biochip platforms for small EVs marker detection primarily focus
    on small EVs surface proteins, lacking a rapid platform for the comprehensive
    detection of both the membrane and internal proteins of small EVs.


    Here, using esophageal squamous cell carcinoma (ESCC) as a model, we developed
    an small EVs proteins detection platform integrating mass spectrometry and a barcode
    immunoassay biochip to investigate both membrane and internal proteins in patients
    and identify protein markers (differentially expressed in cancer patients and
    healthy control) with diagnostic potential through serum small EVs proteome. The
    mass spectrometry identified over 2000 proteins and provided potential protein
    markers for early diagnosis. The biochip captures small EVs from serum, lyses
    them in situ, and quantitatively analyzes multiple potential protein markers identified
    by mass spectrometry in clinical samples from two cohorts. Then, a reliable diagnostic
    model is developed for ESCC based on machine learning algorithms, which is validated
    in an independent clinical cohort. This platform enables high-throughput and rapid
    analysis of multiple


    samples from multi-centers, facilitating the translation of multi-biomarker assays
    into clinical applications.


    # 2. Results


    # 2.1. Design of Small EVs Proteins Analysis for Early Diagnosis


    The general process of this study, including specific details on participant recruitment
    for each analysis, is presented in Figure 1. In particular, we employed a liquid
    chromatography-mass spectrometry (LC-MS)-based 4D data-independent acquisition
    (4D-DIA) method on 12 ESCC patients and 18 healthy controls (HC) to obtain proteomic
    data from their serum small EVs. Over 2000 small EVs proteins were recognized,
    and 14 potential markers were screened according to their differential expression
    and bioinformatics significance. The expression of these markers was then compared
    between 66 ESCC patients and 80 HC in Cohort 1. Machine learning techniques were
    utilized to explore the correlation between protein profiles and clinical phenotypes.
    A diagnostic model for ESCC was developed, and 9 of 14 potential markers were
    optimized to build the 9-DM model, and its performance was evaluated in distinguishing
    ESCC patients from HC. Additionally, an external test set was employed to verify
    the robustness of the machine learning model, which has 67 samples, including
    47 ESCC patients and 20 healthy persons.


    # 2.2. Screening of Candidate Small EVs Protein Markers


    To characterize the protein function of serum small EVs in ESCC, we performed
    4D-DIA mass spectrometry on small EVs isolated from the serum samples of 12 patients
    with ESCC and 18 HC (Figure 2A). In total, 2062 proteins were identified in the
    serum small EVs of ESCC patients, while 2370 proteins were detected in HC, among
    which 2053 proteins are common to both groups (Figure 2B). Principal component
    analysis (PCA) effectively separated ESCC samples from HC, suggesting that the
    serum small EVs proteome of ESCC underwent significant remodeling (Figure 2C).
    The differences between the common serum small EVs proteins of ESCC and HC were
    further analyzed using a fold change (FC) threshold of ≥1.5 and a significance
    level of P < 0.05. This analysis reveals that 203 proteins in the serum small
    EVs of ESCC are significantly upregulated compared to those in HC (Figure 2D).
    Additionally, Gene Ontology (GO) analysis of the differential proteins reveals
    that proteins in the serum extracellular vesicles of ESCC patients are significantly
    enriched in the pathways related to “Extracellular exosome,” “Protein binding,”
    and “Neutrophil degranulation” (Figure 2E). Furthermore, Kyoto Encyclopedia of
    Genes and Genomes (KEGG) pathway indicates significant upregulation in the “Ribosome,”
    “Chemokine signaling pathway” and “Endocytosis” pathways (Figure 2F). The above
    findings illustrate that multiple significant functional and metabolic pathways
    are activated in the serum small EVs of patients with ESCC. Based on the analysis
    of the serum small EVs proteomic differences between ESCC patients and HC, along
    with the top two GO pathways, 14 small EVs proteins are selected, which are significantly
    elevated in ESCC as candidate markers for subsequent diagnostic analysis (Figure
    2G; Figures S1 and S2, Supporting Information).'
