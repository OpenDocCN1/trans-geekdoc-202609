    ## 微流控平台数据分析

    检测过程涉及以下步骤：1) 信号采集：使用 635 nm 激光通道扫描生物芯片，并使用 GenePix Pro 软件对每个条形码的荧光信号进行定量，并获得检测区域的平均荧光强度。2)
    数据归一化：在机器学习模型输入之前，对原始荧光强度值进行 log10 转换，以归一化数据分布并增强模型性能。


    ## 诊断预测建模

    使用 R version 4.4.2 为 ESCC 开发了诊断预测模型，采用集成机器学习方法进行多维分析。在方法学上，系统性地实施了多个 R 包：randomForest
    用于随机森林建模，caret 用于数据预处理和模型调优，pROC 用于性能评估，randomForestExplainer 用于特征重要性分析，ggplot2
    用于可视化，以及 Rtsne 用于高维数据降维。在模型构建期间：首先使用 caret 包进行数据标准化和分层抽样（70% 训练集/30% 测试集），以确保数据分布均衡。随机森林模型使用
    randomForest 中实现的自助聚合算法开发，最初纳入 14 种血浆蛋白作为预测变量。通过 caret 指导的网格搜索验证，模型参数优化为：ntree
    = 145 棵决策树，mtry = 14（每次节点分裂考虑的特征数），nodesize = 5（每个末端节点的最小样本数）。参数优化由 pROC 计算的 AUC
    值和 caret 生成的混淆矩阵指标共同指导。使用 randomForestExplainer 进行了特征重要性分析，其提供了三种互补的评估方法：1) 最小深度分析（min_depth_distribution）以识别最关键的分类特征；2)
    节点纯度提升（measure_importance）以量化每个特征对模型精度的贡献；3) 根节点分裂频率以反映全局特征重要性。基于这些分析，从最初的 14
    个特征中选出 9 个最具预测性的蛋白生物标志物用于最终模型。验证阶段采用多维评估策略：caret 生成的混淆矩阵提供了包括准确率、敏感性和特异性在内的关键指标；pROC
    从 ROC 曲线计算 AUC 值；ggplot2 生成校准曲线；Rtsne 可视化展示了 ESCC 患者与健康对照在蛋白生物标志物空间中的分离模式。模型通过
    randomForest 的 predict 函数输出个体化预测概率（范围 0–1），诊断阈值设为 0.5（概率 > 0.5 分类为 ESCC，≤0.5 为健康对照）。所有可视化均使用
    ggplot2 创建，包括 ROC 曲线、多维特征重要性热图、t-SNE 降维散点图和模型校准曲线。


    ## 免疫荧光染色

    福尔马林固定石蜡包埋切片经二甲苯和梯度乙醇系列脱蜡，随后在柠檬酸缓冲液（pH 6.0）中采用微波加热进行抗原 retrieval。经 10% 与二抗宿主种属匹配的血清封闭后，载玻片在
    4 °C 下过夜孵育以下一抗：anti-FST（1:400, Proteintech #60060-1-Ig）、anti-PTX3（1:200, Proteintech
    #13797-1-AP）和 anti-EIF2S2（1:500, Servicebio #GB111135）。Alexa Fluor 偶联二抗（1:200）在室温下作用
    50 min，随后进行 DAPI 复染和自发荧光淬灭。切片用抗淬灭封片剂封固并使用数字切片扫描仪成像。所有步骤之间均进行 PBS 洗涤（3 min × 5
    min）。


    ## 统计方法

    采用 Kolmogorov–Smirnov 检验评估所有数据的正态性，而分类数据则使用卡方检验进行分析。对于呈正态分布的数据，采用非配对双尾 t 检验进行比较，而非正态分布数据则使用
    Mann–Whitney 非参数检验。荧光强度或光密度（O.D.）值与目标抗原浓度之间的线性关系使用 R-squared（R²）统计量进行评估。p 值低于
    0.05 被认为具有统计学意义。检测限（LOD）由方程确定：LOD = 3 × δ / S，其中 δ 为空白值的相对标准偏差，S 表示由线性回归方程得出的斜率。


    诊断效率使用准确率、ROC 曲线和其他相关指标进行评估。分析使用 GraphPad Prism（v.9.5）、R software（v.4.4.1）（可获取于
    https://www.r-project.org/）和 Origin（v.2021）进行。


