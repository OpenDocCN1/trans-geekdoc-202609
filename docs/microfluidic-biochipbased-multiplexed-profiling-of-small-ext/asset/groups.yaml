  - '[PAGE 10]


    In conclusion, the proposed platform identifies biomarkers with potential diagnostic
    value and constructs a diagnostic model incorporating machine learning algorithms.
    Furthermore, a barcode immunoassay platform has been developed that integrates
    small EVs capture, their in situ lysis, and multiparameter detection, enabling
    the rapid analysis of multiple samples. The understanding of disease pathology
    is enhanced through these findings, which also facilitates early detection and
    develops new methods for multi-parameter small EVs detection. More broadly, the
    machine learning-based interpretation of small EVs data offers distinct advantages
    in tumor detection and clinical decision-making, while the developed microfluidic
    assay platform holds significant translational prospects for practical clinical
    applications and may be extended to the study of other diseases.


    # 4. Experimental Section


    Clinical Cohort: Between August 2023 and May 2024, 66 patients with ESCC were
    recruited from Qilu Hospital of Shandong University, and 80 HC who underwent physical
    examinations were included, forming Cohort 1. Between July 2023 and September
    2023, an additional 47 ESCC patients, treated at the Provincial Hospital of Shandong
    First Medical University, and 20 HC, were recruited, thus establishing Cohort
    2. Furthermore, from January to March 2025, 30 ESCC patients and 30 HC were enrolled
    at Qilu Hospital to establish Cohort 3 for validation studies (Figure S28, Supporting
    Information). Inclusion criteria: Participants were aged 18–85 years, had histologically
    confirmed ESCC, and were untreated. Exclusion criteria: Individuals with dual
    or multiple primary tumors; participants with immune disorders or autoimmune diseases;
    and those who had undergone organ transplantation, non-autologous bone marrow
    transplantation, or stem cell transplantation were excluded. Inclusion criteria
    for healthy individuals: 1) Written consent obtained; 2) Age ranged from 18 to
    85 years; and 3) Absence of malignant disease. The exclusion criteria mentioned
    above also applied to healthy individuals. All samples used in this study were
    retrospectively obtained from established institutional biobanks. The use of human
    materials was approved by the Medical Science Research Ethics Committee of Qilu
    Hospital, Shandong University (Approval Nos. KYLL-2021(K S)-011 and KYLL-202409(YJ)-024).
    All participants voluntarily signed the informed consent form.


    Collection of Clinical Samples: Serum samples were collected from ESCC patients
    and HC. A 5 mL peripheral venous blood sample was obtained from each participant.
    The samples were promptly transferred to the laboratory within 1 h at 4 °C for
    further processing. Freshly collected blood samples were kept at room temperature
    (RT) for 1 h to allow clotting before centrifugation. The supernatant was then
    carefully removed by centrifugation at 4 °C and 1,000 g for 15 min and transferred
    to a clean test tube. To ensure complete removal of platelets and other debris,
    the samples underwent a second centrifugation at 4 °C and 10 000 g for 10 min.
    And the collected supernatant was stored at −80 °C.


    Collection and Isolation of Cell Supernatants Small EVs: Cells were cultured in
    complete medium until reaching 70% confluence, at which point the medium was exchanged
    under fetal bovine serum (FBS)-free medium. Supernatants were collected after
    48 h of culture in FBS-free conditions. The collected supernatants underwent serial
    centrifugation: first at 300 × g for 10 min, followed by 2000 × g for 10 min,
    and then at 10 000 × g for 30 min. Then the supernatants were passed through a
    0.22-μm filter and subjected to ultracentrifugation at 100 000 × g for 70 min.
    The supernatant obtained after centrifugation was designated as the small EVs-removed
    fraction. The small EVs pellets were then resuspended in phosphate buffer saline
    (PBS) and underwent a second ultracentrifugation at 100 000 × g for 70 min to
    purify the small EVs.


    Nanoparticle Tracking Analysis: Small EVs were resuspended and diluted 100- to
    500-fold to obtain a concentration of 20–100 particles per frame. Analysis was
    performed using the NanoSight NS300 system


    (NanoSight Technology, Malvern, UK), which features a 488 nm laser and a highly
    sensitive sCMOS camera. Following the manual introduction of small EVs into the
    chamber, each sample was measured in triplicate using a 13-stage camera, with
    a 30-s acquisition time and a detection threshold set to 7. NTA analysis software
    version 2.3 was used to analyze a minimum of 200 complete traces per video.


    Transmission Electron Microscopy: Small EVs particles were treated with 2.5% glutaraldehyde
    for 10 min at RT. A drop of 5–10 μL of the small EVs’ suspension was then placed
    on a copper grid. Excess liquid was removed using filter paper, and the small
    EVs samples were washed three times with PBS, with each wash lasting 10 min. Finally,
    10 μL of 1% uranyl acetate was applied for 1 min to negatively stain the small
    EVs on the copper mesh, which were then examined using a Tecnai G2 F20 transmission
    electron microscope.


    Serum Small EVs for Liquid Chromatography-Mass Spectrometry (LC-MS) and Data Independent
    Acquisition: Serum small EVs were isolated and collected using the EVtrap kit.
    After isolation, the small EVs underwent lysis, protein extraction, reduction,
    alkylation, and trypsin digestion to generate peptide chains for mass spectrometry
    analysis. Next, peptides from each sample were subjected to mass spectrometry
    for DIA analysis. Additional details can be found in Figure S29 (Supporting Information).


    Differential Protein and Pathway Enrichment Analysis: Differential protein abundance
    between ESCC patients and HC was calculated using the “limma” package in R software.
    The significance level was set to an adjusted P-value of < 0.05, with a log2 fold
    change (FC) threshold of > 0.58 (indicating upregulation) or < −0.58 (indicating
    downregulation in the tumor). Functional enrichment analysis was performed using
    KOBAS (http://bioinfo.org/kobas) with default parameters.


    Fabrication of Microfluidic Platforms: GOQDs substrate glass slides and PDMS microchamber
    layers were prepared following the same procedure previously reported.[31] The
    microprinting chip with 14 parallel microchannels was first bonded to GOQD-functionalized
    glass slides, with this nanomaterial substrate demonstrating significantly enhanced
    antibody immobilization efficiency. Using a precision pipette, 3 μL of capture
    antibody solution was dispensed into each inlet of the independent microchannel,
    followed by a vacuum force to pump the loaded capture antibody from the inlet
    to the outlet at room temperature. The capture antibody was immobilized on the
    substrate surface in each corresponding microchannel. After the microprinting
    chip was removed, the substrate was treated with 1% BSA solution for surface passivation,
    followed by blocking with 3% BSA solution to saturate any remaining reactive sites
    outside the microchannels. Finally, the chips underwent rigorous washing, spin
    drying, and storage at 4 °C until use. The microprinting chip contained 14 zigzag-patterned
    microchannels that maintain complete fluidic isolation. Each detection unit included
    a full circulation loop of all 14 microchannels (Figure S30, Supporting Information).
    To capture small EVs, 4.5 μL of a mixed solution containing antibodies of CD63
    (100 μg mL−1), CD81 (100 μg mL), and CD9 (100 μg mL−1) was added to each reaction
    unit and incubated the mixture overnight. Blocking was then performed using 3%
    BSA for 10 min, followed by successive washes with PBS and ultrapure water to
    remove unbound components. To enrich small EVs, 10 μL of serum sample was added
    to each reaction unit and incubated for 60 min. The supernatant was then removed,
    and the wells were rinsed with PBS. Subsequently, 5 μL of a mixture of RIPA lysis
    buffer and protease inhibitor (in a 100:1 ratio) was added to each reaction unit
    to lyse the captured small EVs in situ for 30 min. For antigen detection, the
    PDMS microchamber of the microarray chip was sealed with 1% BSA. The small EVs
    lysate was then transferred to the wells on the microarray chip and incubated
    for 45 min, after which the supernatant was removed. The microarray chip was incorporated
    into 1% BSA, and the wells were incubated with a detection antibody at a final
    concentration of 5 μg mL−1 for 45 min, followed by incubation with APC for 30
    min. The microarrays were thoroughly washed with PBS and distilled water and then
    shaken dry. The fluorescence intensity of the antigen was measured using a fluorescence
    scanner. The commercial antibodies and proteins used in this study were sourced
    from manufacturers such as R&D Systems, BioLegend, NOVUS, eBioscience, Abcam,
    and Santa Cruz Biotechnology.'
  md: '

    In conclusion, the proposed platform identifies biomarkers with potential diagnostic
    value and constructs a diagnostic model incorporating machine learning algorithms.
    Furthermore, a barcode immunoassay platform has been developed that integrates
    small EVs capture, their in situ lysis, and multiparameter detection, enabling
    the rapid analysis of multiple samples. The understanding of disease pathology
    is enhanced through these findings, which also facilitates early detection and
    develops new methods for multi-parameter small EVs detection. More broadly, the
    machine learning-based interpretation of small EVs data offers distinct advantages
    in tumor detection and clinical decision-making, while the developed microfluidic
    assay platform holds significant translational prospects for practical clinical
    applications and may be extended to the study of other diseases.


    ## 4. Experimental Section


    ### Clinical Cohort

    Between August 2023 and May 2024, 66 patients with ESCC were recruited from Qilu
    Hospital of Shandong University, and 80 HC who underwent physical examinations
    were included, forming Cohort 1. Between July 2023 and September 2023, an additional
    47 ESCC patients, treated at the Provincial Hospital of Shandong First Medical
    University, and 20 HC, were recruited, thus establishing Cohort 2. Furthermore,
    from January to March 2025, 30 ESCC patients and 30 HC were enrolled at Qilu Hospital
    to establish Cohort 3 for validation studies (Figure S28, Supporting Information).
    Inclusion criteria: Participants were aged 18–85 years, had histologically confirmed
    ESCC, and were untreated. Exclusion criteria: Individuals with dual or multiple
    primary tumors; participants with immune disorders or autoimmune diseases; and
    those who had undergone organ transplantation, non-autologous bone marrow transplantation,
    or stem cell transplantation were excluded. Inclusion criteria for healthy individuals:

    - Written consent obtained;

    - Age ranged from 18 to 85 years; and

    - Absence of malignant disease.

    The exclusion criteria mentioned above also applied to healthy individuals. All
    samples used in this study were retrospectively obtained from established institutional
    biobanks. The use of human materials was approved by the Medical Science Research
    Ethics Committee of Qilu Hospital, Shandong University (Approval Nos. KYLL-2021(K
    S)-011 and KYLL-202409(YJ)-024). All participants voluntarily signed the informed
    consent form.


    ### Collection of Clinical Samples

    Serum samples were collected from ESCC patients and HC. A 5 mL peripheral venous
    blood sample was obtained from each participant. The samples were promptly transferred
    to the laboratory within 1 h at 4 °C for further processing. Freshly collected
    blood samples were kept at room temperature (RT) for 1 h to allow clotting before
    centrifugation. The supernatant was then carefully removed by centrifugation at
    4 °C and 1,000 g for 15 min and transferred to a clean test tube. To ensure complete
    removal of platelets and other debris, the samples underwent a second centrifugation
    at 4 °C and 10 000 g for 10 min. And the collected supernatant was stored at −80
    °C.


    ### Collection and Isolation of Cell Supernatants Small EVs

    Cells were cultured in complete medium until reaching 70% confluence, at which
    point the medium was exchanged under fetal bovine serum (FBS)-free medium. Supernatants
    were collected after 48 h of culture in FBS-free conditions. The collected supernatants
    underwent serial centrifugation: first at 300 × g for 10 min, followed by 2000
    × g for 10 min, and then at 10 000 × g for 30 min. Then the supernatants were
    passed through a 0.22-μm filter and subjected to ultracentrifugation at 100 000
    × g for 70 min. The supernatant obtained after centrifugation was designated as
    the small EVs-removed fraction. The small EVs pellets were then resuspended in
    phosphate buffer saline (PBS) and underwent a second ultracentrifugation at 100
    000 × g for 70 min to purify the small EVs.


    ### Nanoparticle Tracking Analysis

    Small EVs were resuspended and diluted 100- to 500-fold to obtain a concentration
    of 20–100 particles per frame. Analysis was performed using the NanoSight NS300
    system (NanoSight Technology, Malvern, UK), which features a 488 nm laser and
    a highly sensitive sCMOS camera. Following the manual introduction of small EVs
    into the chamber, each sample was measured in triplicate using a 13-stage camera,
    with a 30-s acquisition time and a detection threshold set to 7. NTA analysis
    software version 2.3 was used to analyze a minimum of 200 complete traces per
    video.


    ### Transmission Electron Microscopy

    Small EVs particles were treated with 2.5% glutaraldehyde for 10 min at RT. A
    drop of 5–10 μL of the small EVs suspension was then placed on a copper grid.
    Excess liquid was removed using filter paper, and the small EVs samples were washed
    three times with PBS, with each wash lasting 10 min. Finally, 10 μL of 1% uranyl
    acetate was applied for 1 min to negatively stain the small EVs on the copper
    mesh, which were then examined using a Tecnai G2 F20 transmission electron microscope.


    ### Serum Small EVs for Liquid Chromatography-Mass Spectrometry (LC-MS) and Data
    Independent Acquisition

    Serum small EVs were isolated and collected using the EVtrap kit. After isolation,
    the small EVs underwent lysis, protein extraction, reduction, alkylation, and
    trypsin digestion to generate peptide chains for mass spectrometry analysis. Next,
    peptides from each sample were subjected to mass spectrometry for DIA analysis.
    Additional details can be found in Figure S29 (Supporting Information).


    ### Differential Protein and Pathway Enrichment Analysis

    Differential protein abundance between ESCC patients and HC was calculated using
    the “limma” package in R software. The significance level was set to an adjusted
    P-value of < 0.05, with a log2 fold change (FC) threshold of > 0.58 (indicating
    upregulation) or < −0.58 (indicating downregulation in the tumor). Functional
    enrichment analysis was performed using KOBAS (http://bioinfo.org/kobas) with
    default parameters.


    ### Fabrication of Microfluidic Platforms

    GOQDs substrate glass slides and PDMS microchamber layers were prepared following
    the same procedure previously reported.[31] The microprinting chip with 14 parallel
    microchannels was first bonded to GOQD-functionalized glass slides, with this
    nanomaterial substrate demonstrating significantly enhanced antibody immobilization
    efficiency. Using a precision pipette, 3 μL of capture antibody solution was dispensed
    into each inlet of the independent microchannel, followed by a vacuum force to
    pump the loaded capture antibody from the inlet to the outlet at room temperature.
    The capture antibody was immobilized on the substrate surface in each corresponding
    microchannel. After the microprinting chip was removed, the substrate was treated
    with 1% BSA solution for surface passivation, followed by blocking with 3% BSA
    solution to saturate any remaining reactive sites outside the microchannels. Finally,
    the chips underwent rigorous washing, spin drying, and storage at 4 °C until use.
    The microprinting chip contained 14 zigzag-patterned microchannels that maintain
    complete fluidic isolation. Each detection unit included a full circulation loop
    of all 14 microchannels (Figure S30, Supporting Information). To capture small
    EVs, 4.5 μL of a mixed solution containing antibodies of CD63 (100 μg mL−1), CD81
    (100 μg mL−1), and CD9 (100 μg mL−1) was added to each reaction unit and the mixture
    was incubated overnight. Blocking was then performed using 3% BSA for 10 min,
    followed by successive washes with PBS and ultrapure water to remove unbound components.
    To enrich small EVs, 10 μL of serum sample was added to each reaction unit and
    incubated for 60 min. The supernatant was then removed, and the wells were rinsed
    with PBS. Subsequently, 5 μL of a mixture of RIPA lysis buffer and protease inhibitor
    (in a 100:1 ratio) was added to each reaction unit to lyse the captured small
    EVs in situ for 30 min. For antigen detection, the PDMS microchamber of the microarray
    chip was sealed with 1% BSA. The small EVs lysate was then transferred to the
    wells on the microarray chip and incubated for 45 min, after which the supernatant
    was removed. The microarray chip was incubated in 1% BSA, and the wells were incubated
    with a detection antibody at a final concentration of 5 μg mL−1 for 45 min, followed
    by incubation with APC for 30 min. The microarrays were thoroughly washed with
    PBS and distilled water and then shaken dry. The fluorescence intensity of the
    antigen was measured using a fluorescence scanner. The commercial antibodies and
    proteins used in this study were sourced from manufacturers such as R&D Systems,
    BioLegend, NOVUS, eBioscience, Abcam, and Santa Cruz Biotechnology.

