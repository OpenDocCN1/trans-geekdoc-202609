  \n# 第 4 章 解释人工智能、机器学习与深度学习模型\n\n由于某些人工智能（AI）和机器学习具有“黑箱”属性，其模型逻辑难以解释的，这对于技术人员和非技术利益相关者都是如此。\n\
  \n首先，考虑到模型逻辑，某些人工智能和机器学习，其可解释性的缺失源于复杂的特征工程。在这种情况下，机器创建的模型输入和关系缺乏人类直觉。\n\n人工智能和机器学习的复杂性既是优点也是缺点。它使得模型能够非常灵活地检测非线性交互和相关性，但也更容易受到训练数据中虚假关系的影响，即过拟合。\n\
  \n人工智能和机器学习被认为利用了较少的统计假设，根据目标函数优化超参数。\n\n通常，风险管理中使用的模型、分析算法和定量计算都受到严格的监管指导，例如对分析方法的概念合理性进行独立评估。人工智能和机器学习内在可解释性的缺失引发了一个根本问题：我们如何评估一个难以解释的模型？\n\
  \n此外，对于缺乏可解释性的模型，很难预见其在使用时的任何意外后果，这增加了在生产环境中部署模型时的操作风险。对于人工智能和机器学习，模型开发过程的审计和监督变得更加重要。\n\
  \n\n\n\n\n正如同事可能会说的那样，“`这有点像薛定谔的猫——`黑盒是不透明的，因此我们不知道猫是活着的还是死去的`。”当然，有可解释性诊断可以帮助解决这个问题。随后的章节将提供这些诊断工具的概述。\n\
  \n## 模型解释与模型理解的区别\n\n解释人工智能（AI）或机器学习是指人类描述模型最重要的输入，并对模型预测结果为何是该结果进行推断的能力。为了解释模型，这些推断不需要完全精确。在这种情况下，也可以用通用的术语对模型进行解释：即模型输入的变化程度以及相关的输出预期变化幅度。一方面，无法保证答案会完全符合用户或消费者的预期，也无法保证结果具有重复性。另一方面，如果一个模型是`可解释的（interpretable）`，那么其数学函数可以被人类直接理解，模型使用输入推导输出的方法也是清晰可见的。这可以保证模型计算是透明的，且输出是可重复的。\n\
  \n根据背景和目的，在风险管理领域的许多高风险决策中，算法必须同时具有可解释性和可理解性。\n\n在许多情况下，风险模型需要内部和外部利益相关者的批准。例如，用于市场风险、流动性和资本充足率的高度重要风险模型，需要对其概念上的完备性进行评估，并获得公司内部独立模型验证部门以及外部监管机构的批准和签署确认。同时，在世界某些地区，用于信用决策的模型要求金融服务提供者向贷款申请人提供理由代码，以告知他们被拒绝贷款的原因，并在使用事后解释（post-hoc\
  \ explanations）时验证其准确性（例如有关《平等信用机会法》和 B 法的监管要求）。\n\n风险管理中也存在一些辅助领域，这些领域使用的模型不需要内部验证和治理团队的批准，也不需要遵守消费者保护法。这些盲点领域可能会影响消费者的评估和决策，因此，尽管这些模型并不一定是可理解的，但任何模型（无论是基于\
  \ AI、机器学习还是传统模型）都需要处于治理框架之下。\n\n## 为什么要解释 AI 模型\n\n风险模型通常用于受监管要求的高优先级决策。因此，从风险经理到高管理层再到外部监管机构的一系列利益相关者，能够对模型的使用及其输出充满信心。然而，对于\
  \ AI 和机器学习，理解模型及其组件往往是困难的。\n\n通常，可解释性的缺乏由于组织孤岛以及跨 AI 和机器学习模型全生命周期的全局可见性而进一步加剧。今天，透明度的缺乏阻碍了公司适当管理其风险模型及相关模型风险的能力，这导致了对\
  \ AI 和机器学习的某种不信任。\n\n与解释风险模型能力相关的主要挑战包括：\n\n*   无法解释算法函数、定量方法以及模型输出是如何产出的。\n*  \
  \ 模型开发过程和假设缺乏透明度。\n*   无法解释或证明用于推导模型及后续决策的数据具有合理性。\n*   对模型在校准范围之外的数据上如何表现缺乏信心。\n\
  *   缺乏 AI 和机器学习治理的全局性框架。\n*   无法评估过拟合、偏见、公平性以及其他意外后果的程度。\n*   由于无法获取模型文档（包括规格细节和假设），导致无法管理和维护模型，从而无法妥善管理其与其相关的模型风险。\n\
  \n极速的发展速度和动态校准可能导致内部和外部利益相关者对接受和批准模型产生抵触。当然，所需的解释性水平也将取决于模型使用的背景以及模型的重要性程度。\n\n\
  作为一个起点，确定模型的用途以及谁来负责和承担责任至关重要。然后，定义利益相关者是谁以及他们需要知道什么。以下是针对不同利益相关者可以提出的问题：\n\n* \
  \  他们是否需要知道如果模型出错会发生什么？\n*   他们是否需要知道模型驱动因素是合理的并符合业务目标？\n*   他们是否需要知道模型运行良好且随时间推保持稳定？\n\
  *   他们是否需要知道模型是如何工作的？\n*   他们是否需要知道模型是如何融入业务流程的？\n*   他们是否需要知道特征工程所遵循的流程？\n*   他们是否需要知道哪些特征驱动了预测？或者哪些特征在单个预测中起作用？\n\
  *   他们是否需要知道 AI 机器学习模型与简单的基准模型之间的性能差异？\n*   他们是否需要知道模型是简洁的（parsimonious），即它尽可能简单，但具有高度的预测能力？\n\
  \n这是一个全面解释模型特征的良好起点，可以使 AI 和机器学习尽可能让各种利益相关者理解。\n\n## 解决模型开发用数据可解释性的常用方法\n\n正如第 2\
  \ 章所述，正确的数据治理框架对于成功且负责任的 AI 和机器学习至关重要。本节进一步强调了标准化和一致的数据管理流程的重要性，以提高 AI 和机器学习的信任、透明度和治理水平。\n\
  \n数据管理指的是访问、获取、转换和准备用于分析的输入数据的过程。为了辅助模型的透明化，涉及数据收集、数据准备、质量验证以及特征工程的流程需要是透明的、可重复（某些情况下）、稳健的且文档良好的。\n\
  \n在模型开发中使用合理的输入有助于增强对 AI 系统的信任。\n\n与数据收集过程相关的数据中心问题：\n\n*   数据源是否可靠、有意义且合理？\n* \
  \  我们是否建立了标准化的数据质量、验证和采样流程？\n*   模型使用的训练数据是否存在偏见，是否能代表模型将应用的人群（例如，少数群体是否过度或不足）？\n\
  \n与变量选择过程相关的数据中心问题：\n\n*   变量选择和压缩遵循什么方法论？\n*   我们是否记录了变量选择和压缩的方法？\n*   自动化流程与人工判断之间的混合比例是怎样的？\n\
  \n与特征工程相关的数据中心问题：\n\n*   生产系统是否支持特征工程逻辑？\n*   特征工程的方法是否是自动化的并得到了模型风险策略的支持？\n*  \
  \ 流程是否可以使用中间样本或近期生产数据的样本进行重复？\n\n## 处理模型和模型输出可解释性的常用方法\n\n\n\n\n\n## 可解释人工智能是一门多学科科学领域，针对特定的领域和主题拥有专门的资源和方法。在本节中，我们将重点介绍风险管理领域流行的几种方法和技术。\n\
  \n### 内置解释性与模型无关解释性\n\n首先，我们区分内置解释性和模型无关解释性。\n\n当今某些人工智能和机器学习是完全可解释且可理解的。我们可以说，可解释的风险模型本质上是可解释的（例如决策树和回归方法）。在风险管理的某些情况下，许多作者认为，对于影响消费的模型或受监管的模型，这些模型更具优势。\n\
  \n当然，在某些情况下，复杂模型提供了准确性的提升。风险模型建模师也可以通过对输入施加约束来提高复杂模型的解释性。在模型开发过程中，建模师可能会对特征添加约束以维护特定领域的规则（例如，开发具有单调性、加性、线性或平滑约束的神经网络）。\n\
  \n另一个关注点是模型无关解释性。模型无关解释性方法独立于建模算法，通常在模型开发后应用。有不同的模型无关方法用于解决人工智能和机器学习中缺乏解释性的各个方面。表\
  \ 4.1 汇总了根据对模型及其输入提出的不同问题，如何应用几种重要的模型无关方法。\n\n表 4.1 中包含的几种方法可以作为事后解释，以更好地理解模型逻辑。此类方法可以同时应用于全局和局部层面。全局方法适用于数据集，而局部方法则解释单个观测值或特定预测的模型结果。\n\
  \n#### 表 4.1 可用于解决模型问题的模型无关技术\n\n| 问题 || 模型无关技术 | 类型 |\n| --- | --- | --- |\n| 哪些是最重要的特征？\
  \ || 特征重要性、相对特征重要性 | 全局 |\n| 驱动因素是如何起的？ || 部分依赖性、个体条件期望、显著图 | 全局/局部 |\n| 针对特定预测的解释是什么？\
  \ || 局部可解释模型无关解释 (LIME)、Shapley 值 | 局部 |\n| 为了让特定预测获得不同的结果，需要改变什么？ || 反事实、对抗性测试\
  \ | 局部 |\n| 模型对特征空间变化的鲁棒性如何？ || 敏感性分析、压力测试 | 全局 |\n\n事后解释包括全局解释性方法（如特征重要性和部分依赖性），以及局部解释性方法（如\
  \ Shapley 值、个体条件解释和局部可解释模型无关解释）。接下去将解释这些方法。\n\n### 事后方法\n\n### 1. 部分依赖图\nPDP（部分依赖图）显示了输入与预测之间的函数关系。它通过扰动单个特征的值来实现这一目标，描绘模型在特征取值范围内的平均预测情况。（见图\
  \ 4.1）。\n\n### 2. 个体条件解释\n与部分依赖图类似，在这种情况下，个体条件解释在个体或局部层面跟踪平均预测值。ICE 图也有助于检测交互作用。（见图\
  \ 4.2）。\n\n![图 4.1 解释特征与标记变量之间函数关系的的部分依赖图示例（全局层面）。](img/c04f001.png)\n\n**图 4.1**\
  \ 解释特征与标记变量之间函数关系的局部依赖图示例（全局层面）。\n\n![图 4.2 局部层面的个体条件解释示例。](img/c04f002.png)\n\n\
  **图 4.2** 局部层面的个体条件解释示例。\n\n### 3. Shapley 值\nShapley 值源于博弈论，通过跨排列平均来解释特征对预测的贡献。Shapley\
  \ 值的一个优点是它以加性的方式将单个特征效应归于整体预测：Shapley 值的总和等于该实例的整体预测。由于它是加性的，因此非常直观，并可以帮助解释单个预测背后的驱动因素。（见图\
  \ 4.3）。\n\n![图 4.3 局部层面的 Shapley 值示例。](img/c04f003.png)\n\n**图 4.3** 局部层面的 Shapley\
  \ 值示例。\n\n### 4. 显著图\n显著图（如图 4.4\n\n**图 4.4** 通常用于计算机视觉的显著图示例（见 https://go.documentation.sas.com/doc/en/pgmsascdc/9.4_3.5/casdlpg/n0rkb1a1p6r6k141f6zaw.htm）。\n\
  \n![图 4.5 局部可解释模型无关解释 (LIME)示例。](img/c04f005.png)\n\n**图 4.5** 局部可解释模型无关解释 (LIME)示例。\n\
  \n### 7. 局部规则解释\n与 LIME 类似，LORE（局部规则解释）通过构建一组决策规则作为代理模型来解释任何模型的预测，帮助解释决策的原因。此外，它还会生成一组反事实规则，解释导致不同结果的特征变化。\n\
  \n### 8. 累计局部效应\nALE（累计局部效应）图通过处理特征相关性扩展了 PDP。\n\n### 9. 模型稳定性/敏感性分析\n敏感性或稳定性分析用于压力测试模型，通过评估模型在训练数据未涵盖的数据范围内的性能和行为来完成测试。这可以使用合成数据来评估模型的鲁棒性。一种常用技术是合成少数类过采样技术\
  \ (`SMOTE`)，或者对神经网络权重施加噪声扰动来评估神经网络相对于准确率的变化。\n\n### 10. 对抗性测试\n某些机器学习算法更容易受到对抗攻击。对抗攻击是故意设计用于导致模型分类错误的攻击。这可以在模型开发期间或之后发生。为了进一步解释对抗攻击如何发生：\n\
  \n*   在模型开发期间，机器学习是基于一致统计分布进行训练的。\n\n\n\n\n\n-   攻击者会向模型引入违反上述统计假设的数据，用以降低模型准确性或导致非预期结果。\n\
  \n可以应用多种防御措施，例如检测方法，包括在深度神经网络内部层计算的 `Shapley values`（Shapley 值）。这些方法可以区分正常输入和对抗输入。另一种选择是在包含对抗样本的数据上训练模型，使模型对这种形式的攻击更具鲁棒性。\n\
  \n### 11. 归因分析\n\n比较机器学习的两种不同场景的输出（例如输入或逻辑的变化），或来自两个不同时间段的数据。这有助于理解模型性能衡量差异背后的驱动因素。换句话说，它让建模人员能够更好地理解模型输入的变化如何影响模型性能或模型做出的预测。例如，将开发样本与模型完全投入产之前的前三个月的预产阶段数据进行比较。\n\
  \n## 流行方法的局限性\n\n多位作者和行业机构强调了事后（post-hoc）可解释性诊断的局限性。\n\n事后解释的一个局限性在于，它仅对模型进行了部分解释，因此可能会产生误导。在其他情况下，它依赖于底层代理模型的准确性。\n\
  \n思考事后可解释性技术的一种方法是观察朋友的度假照片。每张照片都讲述了他们去过的地方以及他们所处的环境。一张照片可能是在 `埃菲尔铁塔` 前，另一张是在 `香榭丽舍大街`\
  \ 随意散步（世界上最著名的街道之一），另一一张是 `蒙娜丽莎`。你能仅通过看照片，就安全且自信地推断出你的朋友确实访问了巴黎吗？\n\n同样，事后诊断提供了观察同一个多维对象的不同视角。每种诊断都提供了一个独特的视角。当这些不同的视角结合在一起时，可能更好地理解模型的运行机制。\n\
  \n然而，请记住，通过在已经复杂的模型上增加事后诊断这一额外的复杂性，可能会进一步增加模型的复杂性，从而增加模型风险。\n\n## 结\n\n等等，纠正：##\
  \ 结\n\n可解释人工智能（`XAI`）现在已是一门成熟的学科，并将继续演变。根据 `Christoph Molnar` 的说法，可解释性是大规模采用人工智能和机器学习的催化剂。随着人工智能和机器学习日益成熟，描述它们的技术也会随之进步。\n\
  \n风险模型通常用于关键（因此受到高度监管）的决策。因此，从风险经理到高层管理到外部监管机构，一系列利益相关者能够信任模型及其输出是非常关重要的。\n\n展望未来，向一系列利益相关者解释模型各个方面的能力，将超出事后诊断的使用，扩展到使用自然语言解释以及可视化——用非技术性术来解释模型，并使用那些能够解释自身并自我记录的模型。\n\
