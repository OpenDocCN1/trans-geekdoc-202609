  \ with Applications` `202`（2022），117271，ISSN `0957-4174`。\n\n\n\n\n\n“…直到你能够教一个机械机器人时，你才算真正理解了一个主题。”\n\
  \n—`Judea Pearl` 和 `Dana Mackenzie`\n\n近期，有关人工智能（AI）和机器学习的伦理使用的话题受到了行业从业者、监管机构和公众的广泛讨论。现在人们已经清楚，人工智能和机器学习的非预期后果之一是产生偏见决策的风险，这可能导致不公平的结果。偏见可能源于用于训练模型的数据中的历史和社会偏见，或是在模型开发过程中本身引入的偏见。偏见模型和决策可能导致非预期后果，例如少数群体在贷款和保险保单发放方面存在差异或缺乏获取机会。\n\
  \n人工智能和机器学习的承诺之一是通过自动化来减少财务决策中的偏见和不公平。然而，尽管有这一承诺，我们并不需要远寻就能找到人工智能和机器学习强化偏见并放大决策不公平现象的例子：从根据性别优先考虑工作申请，到基于种族的歧视性计算机视觉，再到具有性别偏见的信贷额度审批。\n\
  \n由人员、源系统以及跨不同地理区域的应用进行的数据输入和数据采集，可能会由于标签错误、误解或数据处理不完全而导致准确性问题。数据可能无法代表将要应用的人口群体。\n\
  \n当用于模型开发的数据集包含历史偏见结果时，相同的偏见数据集会被用于训练可能产生偏见的模型。在人工智能和机器学习中，导致偏见的问题增加了不公平决策的风险，当使用与保护变量相关的特征或属性时，这种风险会更加严重。保护变量是指具有法律或伦理限制的变量。这些包括在某些司法管辖区内不能歧视的群体（例如性别和种族等人口统计变量）。模型和业务规则也可能引入偏见。\n\
  \n同样重要的是，决策中的偏见可能来自多种来源，而不只是训练数据。这些来源可能包括用于模型开发的数据、模型假设、模型本身，或者业务规则或其他独立于模型做出并影响模型结果的决策。\n\
  \n风险决策通常由于人工评估过程和程序而变得更加复杂，这些结果本质上是定性的。例如，不同的人工评估员、分析师和经理所做的判断性决策。尽管大多数组织已经建立了政策和程序来防止不负责的行为并追究决策者的责任，并不意味着所有决策都能完全免受偏见。\n\
  \n## 评估人工智能系统中的偏见\n\n近年来，关于负责任人工智能的对话已从机器主导决策使用的伦理哲学，演变为一种社会技术讨论，即如何通过量化方法确保自动化系统遵循与人类决策相同的行为准则和伦理标准。\n\
  \n请记住，对于像人工智能和机器学习这样的监督学习，预测建模在设计上就是具有歧视性的，因为其目标是根据标记变量的值进行区分。然而，当算法根据不代表人口群体的数据或具有法律和伦理限制的输入进行歧视时，可能会违反消费者保护法和数据隐私法。在贷款和保险决策的背景下，利用所有合理可用的信息使模型结果尽可能准确，通常符合服务提供者的最大利益。这可能以牺牲消费意愿为代价，因为消费者关注的是最有利的模型结果。这意味着需要在业务目标和公平结果之间进行仔细平衡。\n\
  \n为了对抗偏见，应该将公平性评估嵌入生命周期中（图 5.1）。\n\n```\n图 5.1 评估整个客户生命周期的偏见、公平性和脆弱性。\n```\n\n重要的是，平衡公平性与业务目标需要：\n\
  \n*   评估一系列公平性指标，以减轻不同类型的偏见（数据偏见、模型偏见、评估偏见等）\n*   确保公平性评估嵌入到端到端的模型生命周期中\n*   使用强大的工具在个人和群体层面评估公平性\n\
  \n先进公平性工具的使用支持对保护变量进行仔细分析，并调查公平性风险及其根源。\n\n在本章中，我们解释了与数据和模型相关的偏见、公平性和脆弱性的定义和衡量标准。\n\
  \n## 什么是偏见？\n\n人工智能系统中的偏见发生在基于错误假设的人类偏见成为自动化决策方式的一部分时。一个意图良好的算法可能会无意中做出偏偏决策，从而歧视或区别对待受保护的消费者群体。\n\
  \n偏见可能在模型生命期的任何阶段发生并进入。一个常见的误区是偏见仅源于多样化不足的训练数据，虽然这是自动化系统产生偏见的常见来源，但事实上，偏见可能更早地进入模型生命周期——例如，在问题陈述的制定方式或数据收集的方式中。\n\
  \n\n当偏见未被发现时，它可能会被自动化决策系统系统化并放大。\n\n在风险模型中——包括利用人工智能和机器学习的模型——偏见可能源于训练数据。此类问题可能源于历史偏见，也源于数据采样、收集和处理的方式。这意味着训练数据并没有代表模型将应用的人口。偏见也可能在模型设计阶段产生，导致模型在不同子群体中的表现产生可衡量的差异。例如，模型可能基于年龄、性别、种族、民族和宗教等变量产生偏见。一个例子是历史偏见被信誉评分捕捉，尽管数据包含了还款历史、欠款金额、贷款时长和新信贷信息，这些变量本身导致了非美国人和西班牙裔借款人无法获得平等的机会。偏见将持续产生较低的信誉评分。\n\
  \n## 什么是公平？\n\n公平性被认为是原始的、具有判断性的本性。由于其定性特征，在全球范围内全面定义公平性更具挑战性。公平的哲学超出了技术方法的范围；然而，在向人工智能系统中纳入公平性检查时，大多数社会维护平等和公平。在美国，公平贷款法律，如\
  \ `Regulation B` 和 `Equal Credit Opportunity Act (ECOA)`，保护消费者免受信贷决策中的歧视。法律规定严禁基于种族、肤色、宗教、国籍、性别、婚姻状况或年龄进行歧视。\n\
  \n任何不利的信贷行为都需要证据支持以证明决策并非基于这些。消费者金融保护局最近发布了关于基于人工智能的贷款决策的指南。在算法模型的背景下，广泛的做法是将公平性与跨人口段的等性联系起来。\n\
  \n### Kusner, Russell 和 Silva\n\nKusner 等人进一步定义了公平性的第二层面：当算法对相似的消费者提供相似的预测时。此外，第三层面公平是指算法为人口统计提供机会。最后，第四层面公平观察到算法是反事实公平的——即在实际维度上公平。公平性的问题在于，当公平预期转化为量化术语时，这些术语并非互斥。案例强调了公平性指标的非唯一性。\n\
  \n## 决策中的偏见类型\n\n偏见可能源于多个来源。让我们区分认知偏见和统计偏见。\n\n### 20 世纪 70 年代，Amos Tversky 和 Daniel\
  \ Kahneman\n\n在为人工智能和机器学习建立治理框架时，首先考虑认知偏见的类型以及可以防止这些偏见的控制措施是有帮助的。几种认知偏见包括：\n\n*\
  \   `过度自信`（Overconfidence）源于对控制的错觉和乐观效应：人工智能系统会因为我们的意愿而做出公平的预测。其变体是 `从众心理`（见下文）。\n\
  *   `自利偏见`（Self-serving bias）源于人类将成功归于能力、将失败归于不幸事件的倾向：人工智能系统在数据集上是正确的，但在另一个数据集上不准确是因为人口偏移或其他不可控的原因。\n\
  *   `从众心理`（Herd mentality）是指盲目模仿同伴的行为进行决策。在这种情况下，决策受到启发式简化或情绪的影响，而非独立分析。\n*   `损失厌恶`（Loss\
  \ aversion）是一种对损失的遗憾大于对获利满足感的倾向。\n*   `框架效应`（Framing）是指基于信息的呈现方式做出决策。如果以另一种方式呈现，将得出不同的结论。\n\
  *   `叙事偏见`（Narrative bias）是人类利用故事来理解世界的倾向。不符合故事情节的信息会被忽略。\n*   `锚定效应`（Anchoring）发生在使用预存数据作为参考点并影响后续决策时。\n\
  *   `确认偏见`（Confirmation bias）是一种倾向于寻找信息和数据以确认预存想法的想法。\n*   `代表性启发式`（Representativeness\
  \ heuristic）是一种错觉，认为如果两个对象相似，它们就是相关的。\n\n以下是一些统计偏见的常见来源：\n\n*   `选择偏见`（Selection\
  \ bias）发生在模型开发数据与模型应用的人口之间存在系统性差异时。\n*   `采样偏差`（Sampling bias）指的是由非随机采样引起的错误。这意味着数据将无法代表人口。它可以基于数据收集方法、确认偏见、选择的时间间隔或对原始数据的修改而发生。\n\
  *   `幸存者偏差`（Survivorship bias）是选择偏差的一种变体，即只有在长时间过程中“幸存”下来的人被纳入或排除在分析之外，从而创建了偏偏样本。\n\
  \n### 当前的指南、法律和法规\n\n由于目前普遍缺乏针对人工智能系统公平性的立法，考虑现有的消费者保护框架是一个很好的例子。如前节所述，《公平信贷报告法》和《公平信贷机会法\
  \ (ECOA)》定义了美国公平贷款的标准。\n\n《公平信贷报告法》（《消费者信贷保护法》第六章）强制执行消费者数据保护，并将其用途限制在法案指定的特定用途上。它还允许对争议信息进行调查。\n\
  \n《公平信贷机会法》（`Regulation B`）促进信誉良好的申请人平等获得信贷的机会，并禁止基于种族、肤色、宗教、国籍、性别、婚姻状况或年龄的歧视。它进一步通知申请人对其申请所采取的行动，收集住房相关贷款的种族信息，并保留申请记录。\n\
  \n\n\n\n在金融、保险和医疗保健等不同领域已经开发许多措施，用于识别数据中的偏差并评估模型结果的公平性。对于风险管理，建议将偏差和公平性措施作为控制手段贯穿客户整个生命周期以及风险模型的生命周期（图\
  \ 5.1）。理解公平性指标的局限性至关重要：检测偏差和公平性的指标无法保证偏差与公平性的存在或不存在，也无法由于其他外部因素（如数据变化）导致后期出现公平性问题的可能。接下来，我们将解释一些方法和措施，通过信号触发人工干预来检测并纠正偏差和公平性问题。\n\
  \n在编写时，公平性指标的发展日益成熟，包括针对人工智能和机器学习的指标。\n\n以下是用于检测偏差和公平性的常用方法和指标示例：\n\n1. **人口统计学差异（Demographic\
  \ parity）。** 指评估人口统计变量的每个分段（或“受保护群体”）是否以相同的速率获得相同的正面结果。\n2. **机会均（Equal opportunity）。**\
  \ 该指标验证不同群体之间的真阳性率是否相同。以此类推，它也衡量了跨群体是否观察到相同的真阴性率。\n3. **假阳性率平衡（False positive rate\
  \ balance）。** 衡量不同群体之间的假阳性率（由此产生的真阴性率）是否相等。例如贷款申请人，速率平衡确保了每个群体中被预测为违约的比例具有代表性。\n\
  4. **均等优势或平均优势（Equalized odds or average odds）。** 这假设不同群体之间的真阳性率和假阳性率均相等（等同于真阴性率相等且假阴性率相等）。\n\
  5. **正预测一致性（Positive predictive parity）。** 在此处，不同群体之间的正预测值相等（即每个群体的假阴性预测预测率相同）。这是通过比较每个群体中真阳性的比例与预测阳性的比例来实现的。\n\
  6. **假漏率平衡（False omission rate balance）。** 不同群体之间的假漏率相等（即各群体具有相同的负预测值）。该速率比较了假阴性的比例与被拒绝/负收益的比例。\n\
  7. **特征归因分析（Feature attribution analysis）。** 利用特征归因分析寻找影响决策的驱动因素，例如确保某些因素与受保护变量不相关。\n\
  8. **敏感性分析（Sensitivity analysis）。** 使用扰动来评估对人口统计数据变化的敏感性。\n9. **相关性分析（Correlation\
  \ analysis）。** 当存在与年龄、性别或家庭状况等敏感变量相关的变量时，可能会导致不公平的结果。\n10. **交叉引用（Cross referencing）。**\
  \ 利用结果分析和交叉引用来评估模型在受保护群体和非受保护群体中的准确性。不公平的个人决策可能在特定的人口分段中观察到，但在考虑整个人口时是无法衡量的。\n11.\
  \ **三角测量法（Triangulation）。** 指使用两个以上的来源深入探讨某种情况以验证发现。还有其他类型的三角测量：\n    * *方法论：* 使用一种以上的方法收集数据点，并使用一种以上的措施。\n\
  \    * *数据：* 涉及时间、空间和人员等不同维度。\n    * *调查者：* 涉及多个人参与。\n12. **反事实分析（Counterfactual\
  \ analysis）。** 为了在个人层面评估公平性，在反事实分析中，通过比较同一记录的因果属性与其调整后的版本，来评估结果的变化。\n\n如前所述，一个很好的起点是通过比较模型对不同受保护或“敏感”变量值做出的预测和性能，来评估偏差和公平性（图\
  \ 5.2）。敏感变量的示例是具有人口统计性质的，包括年龄、性别、种族、宗教、家庭状况、婚姻状况和民族等变量。\n\n### 使用人工智能和机器学习检测并纠正偏差：警告\n\
  \n在某些情况下，使用人工智能和机器学习可以帮助自动检测和纠正偏差。与其他人工智能和机器学习用例类似，评估公平贷款风险可能面临相同的解释性挑战（理解预测估值的原因）。确认基于\
  \ AI 的模型的挑战之一是某些传统的模型验证方法或指标并不容易适用。由于输入数据和算法的额外复杂性，无法很容易决策背后的驱动因素或将其与其他变量分离。\n\n\
  ![图 5.2 差异分析评估了跨受保护特征类别的模型性能（在本例中为性别和年龄）。](img/c05f002.png)\n\n**图 5.2** 差异分析评估了跨受保护特征类别的模型性能（在本例中为性别和年龄）。\n\
  \n另一个挑战是理解为什么人工智能和机器学习在识别出高风险偏差时，其内在无法证明模型变量包含的原因（相比之下，变量和参数符号已知的传统统计模型）。\n\nAI\
  \ 系统本身可能隐性或间接地受到受保护变量的影响。在这种情况下，可以应用标准技术确定模型中的相关性。此外，可以使用解释性指标来解释决策背后的主要驱动因素。模型敏感性分析、基准测试和权衡分析是金融机构经常用于测试和确认模型的其他流行方法。\n\
  \n总之，人工智能方法仍然需要遵循现有的消费者保护和监管框架（包括 B 法规和公平信贷法 ECOA）。像任何其他模型一样，AI 模型可能有缺陷并受到偏差的影响，这会影响模型的预测性。偏差可能由数据或算法引起，导致模型训练不足或训练错误。当用于训练模型的样本数据不能充分代表总体人口时，应用于过度代表或代表不足少数群体的模型将具有更高的不公平对待风险。\n\
  \n自动化的一个优势是，如果偏差得到适当解决，自动化决策的潜力比人类决策更具一致性和可追溯性。\n\n在对解释性有严格要求的领域，模型治理框架应扩展人工智能和机器学习的细节。\n\
  \n与基于 AI 的建模方法相关的模型风险可能更加，因为建模过程中通常涉及复杂的算法和输入数据。模型变量的复杂转换或相互依赖可能使得发现可能违反公平信贷法的隐藏模式变得困难。因此，在开发人工智能和机器学习时，确保执行模型风险管理原则和治理至关重要。\n\
  \n\n\n\n\n稳健的模型风险管理框架将收集并随时提供能够一致且可靠地执行公平贷款法要求的信息。这可以进一步扩展到金融机构，使其能够识别并纠正法规之外的潜在歧视风险。\n\
  \n此外，金融机构可以对输入数据实施约束或规则，确保训练数据不包含受保护特征，应用数据质量检查以防止数据衡量受到污染或受主观错误影响，并记录和验证用于数据去偏的方法。\n\
  \n### 脆弱性\n\n如今，并非所有司法管辖区对“脆弱性”客户的识别都有法律规定。尽管如此，理解客户在不公平决策或影响生活方式的变化时，在生命周期中更容易受到干扰，是发行产品和服务的市场参与者的关键考虑因素。这些生命周期包含许多阶段，从意识或调查阶段开始，到关系扩展阶段，即客户会获取更多产品或服务，包括金融服务（包括不受监管的“边缘”贷款贷者）、保险、养老金和电信服务（见图\
  \ 5.3）。\n\n随着市场参与者的客户旅程从意识进展到现有关系的扩展，遭受脆弱性“冲击”的风险可能会增加。市场参与者与客户之间存在许多不同的渠道，这些渠道可以作为互动点，以评估客户脆弱性增加的概率。\n\
  \n![图 5.3 脆弱性是提供产品、商品和服务的市场参与者在整个客户旅程中开始考虑的关键因素。](img/c05f003.png)\n\n`图 5.3` 脆弱性是提供产品、商品和服务的市场参与者在整个客户旅程中开始考虑的关键因素。\n\
  \n在整个 COVID-19 期间，保护脆弱客户免受困难或压力一直是主要考虑因素，并导致许多小企业主面临严重的财务压力和破产。这种压力已延伸到住房领域，抵押贷款者改变了还款方式或推迟了还款。对于金融信贷提供者来说，预测哪些客户在还款延期计划结束后更容易违约具有价值。此类模型关注的是疫情这一重大压力事件，但没有关注\
  \ COVID-19 之前可能存在的脆弱性增加风险。理解和建模这种潜在的脆弱性风险至关重要，特别是考虑到在客户旅程中提供支持的最佳时机（见图 5.3）。\n\n\
  监管机构日益关注更好地理解自动化决策系统运行的背景。更好地保护脆弱客户在 COVID-19 疫情之前就已经受到政府和监管机构的关注，但在近期变得更加突出。\n\n\
  例如，英国能源监管机构燃气和电力市场办公室（OFGEM）于 2013 年发布了首份消费者脆弱性策略。\n\n对于消费贷款，金融行为监管局（同样位于英国）对脆弱消费者有广泛的定义，为“……由于个人情况特别容易受到损害的人，特别是当公司未以适当水平的关怀行动时。”\n\
  \n他们的指南定义了脆弱性的关键驱动因素和特征的细节。关键驱动因素包括健康、财务能力、财务韧性和生活事件。\n\n`FCA` 将可能与消费者脆弱性增加相关的个人、行为、社会和市场驱动的特征定义为：\n\
  \n*   年龄——年幼或老年\n*   居住在偏远地区\n*   低收入\n*   过度负债时期\n*   无家可归\n*   具有原住民背景\n*   阅读、写作和计算能力低\n\
  *   说的母语非该国主要语言\n*   多元的文化背景、假设或态度\n*   患有智力、精神、身体、感官、神经系统或学习障碍\n*   获取技术途径有限\n\
  *   对所提供的产品或服务缺乏经验\n*   向市场发布的信息不足或具有误导性\n\n`FCA` 发布了指南以及如 `Policy 18/19` 等政策，强调了在信贷风险中评估可负担能力的重要性，包括收入和支出信息的使用。2017\
  \ 年，`FCA` 发布了关于宽款行为的指南，帮助指导金融机构如何更好地将公平性和对客户还款能力的评估嵌入到其催收前处理和催收处理策略中。\n\n通过更好地理解脆弱消费者，金融机构可以提供更好的服务、减少损失并避免对不当行为进行昂贵的调查。可以通过以下方式实现：\n\
  \n*   更好地利用内部人口统计数据，以便更好地识别脆弱客户\n*   开发工具包或使用第三方软件来帮助设计框架、治理流程以及产品和服务，以减少脆弱性\n*\
  \   尽早与客户接触，帮助设计产品和服务，以减轻脆弱性的影响\n*   定制产品和服务的供应，以确保其对脆弱客户的适用性\n\n不投资于更好地识别或保护脆弱客户的成本是非常高的。这可能涉及因违反消费者保护法而面临的数百万美元罚款以及声誉损害。另一方面，实施脆弱性保护措施可以产生益处，例如提高客户和员工满意度，并通过为更广泛的客户提供更灵活的产品和服务增加销售机会。\n\
  \n在金融机构，正在进行的努力通常是由合规驱动的。一个例子是缩短解决客户发起的争议所需的时间。一些早期研究利用语音转文本数据进行情感分析，以寻找讨论期间表达的情感序列。这些序列随后被用作分类器来预测争议或非争议目标。\n\
  \n## 结语\n\n使用高级分析来更好地理解偏见、公平性和消费者脆弱性正日益被推向一线，而不是仅在后台或中后台运行。创建用于减轻偏见和评估决策公平性的框架和流程，意味着未来这些方法还可以扩展到其他风险模型，包括用于实时风险评估的模型，以及新兴风险的管理和缓解。\n\
