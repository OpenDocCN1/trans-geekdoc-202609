  \n# 生产环境中机器学习模型与决策的参数优化\n\n我们将优化定义为：在满足所有约束条件的情况下，根据目标（如收益最大化）从一组备选方案中找到“最佳”元素的行为、过程或方法。在当前业务问题的背景下，这种“最佳”元素的影响是深远的：涵盖系统、决策或技术设计。“问题”可以包括但不限于：\n\
  \n*   跨组合资本配置以实现收益最大化\n*   高效利用资源以减少浪费\n*   利用最少信息生成最优决策路径\n\n例如，为了优化跨组合资本，可以在不同的监管制度下将信用风险缓解工具分配给信用风险敞口，并根据特定目标进行操作。在这里，分配的优化方式使公司能够在监管框架内降低其监管资本要求。在这里，监管要求就是优化问题中的约束条件。\n\
  \n\n\n用数学术语来说，优化是指在约束条件的表达式下，对值函数进行最小化或最大化的行为。该函数和约束可以是线性的也可以是非线性的。数学优化是人工智能和机器学习中不可或缺且被广泛使用的（例如，在约束条件下最小化“损失函数”）。这是通过应用优化程序，根据提供的训练数据减少预测误差来提高算法准确性实现的。\n\
  \n数学家们已经开发了数十优化算法。对于现代的风险实务人员来说，选择最佳算法和规范是一项艰巨的任务。算法的选择会影响结果的处理时间、效率和准确性。但在描述用于机器学习的优化之前，最好先描述一下前文提到的“优化受约束的值函数”是什么意思。\n\
  \n以一个实际的风险管理示例为例，商业银行可能希望在 `t` 年内将损失率控制在风险承受范围内（约束），同时最小收益方差（目标函数），并相应地优化人工智能或机器学习。\n\
  \n## 机器学习的优化\n\n尽管优化在人工智能和机器学习中的应用范围很广，但主要的优化问题取决于损失函数是凸的还是非凸的。\n\n凸优化只有一个“最佳”解，因为其假设存在单个局部最优解——即该解也是全局最优解。存在这样的最小值，可以使用多种经过充分测试和验证的方法确定。因此，凸优化的搜索区域（图\
  \ 8.1）本身呈形状，通过沿着负梯度可以达到局部最小值。\n\n非凸优化对于该问题有多个局部最优解。在历史上，机器学习背景下的大多数优化问题被认为是凸的；然而，近年来，随着神经网络和深度学习的应用，非凸优化方法的使用增加。这些算法在非凸区域（图\
  \ 8.2）中运行（即存在多个局部最小值，对这些进行优化的目的是高效地找到局部最小值，因为在这种情况下无法证明存在全局最小值）。\n\n当然，也有目标函数为凹函数的情况。这些仅仅是凸函数的负值，适用相同的原理。\n\
  \n在优化机器学习时，通过优化参数来近似机器学习拟合函数，使得目标函数被最小化或最大化。为了实现这一点，可能会限制输入变量。这些限制就是约束。约束定义了优化目标函数的可行空间。如果约束要求对每个变量应用恒定变化，则该约束是\
  \ `equality constraint`，分解为 `linear constraint`。相反，如果变量的约束是不等的且可以单方面实现，则该约束是 `inequality\
  \ constraint`。将这些概念共同应用于机器学习优化时，我们得到如下：\n\n![图 8.1 凸优化。凸优化的搜索区域呈凸形状，目标函数在该找到局部最小值，其本身也是全局最小值。](img/c08f001.png)\n\
  \n`图 8.1` 凸优化。凸优化的搜索区域呈凸形状，目标函数在该找到局部最小值，其本身也是全局最小值。\n\n![图 8.2 非凸优化。非凸优化的搜索区域有多个局部最小值。](img/c08f0002.png)\n\
  \n`图 8.2` 非凸优化。非凸优化的搜索区域有多个局部最小值。\n\n*   如果目标是凸的、存在的等式约束是线性的，且所有不等式约束都是凹的，则该问题是凸的。\n\
  *   如果问题不是凸的，则是非凸的。至少有一点是真实的：目标是非凸的、存在非线性等式约束，或至少有一个非线性不等式约束不是凹的。\n\n当然，有许多方法可以解决凸或非凸优化问题。这是因为选择作为求解器的算法取决于应用以及分析方法。本节的意图不是解释所有可作为凸和非凸优化求解器的算法。作为介绍，我们将重点关注涉及使用求解器的机器学习函数优化、超参数的值，以及使用随机梯度下降进行模型拟合的优化。以下是三类型的求解器：\n\
  \n1.  **大规模非线性约束求解器**。内点法和活动集算法是很好的例子。这些算法倾向于应用于具有非显性约束的业务模型。\n2.  **大规模无约束求解器**。示例包括非线性共轭梯度\
  \ (`CG`)、有限内存 Broyden-Fletcher-Goldfarb-Shanno 算法 (`LBFGS`)、随机梯度下降 (`SGD`) 和 `Adam`\
  \ 算法。这些算法倾向于应用于最小化单个损失函数的机器学习优化问题。\n3.  **无导优化求解器**。它们在较小维度的问题上通常非常有效，因为它们对目标和约束的结构要求很小。它们通常是调整超参数的最佳选择。\n\
  \n超参数大致分为两类：与模型架构相关的模型训练参数（例如神经网络的层数和每层的神经元数量），以及求解器参数（如算法的学习率或动量）。求解器的选择和设置将显著影响训练过程。\n\
  \n在接下来的章节中，我们将详细讨论每个求解器。\n\n## 使用求解器进行机器学习函数优化\n\n如前所述，有很多求解器可以优化目标函数，这些取决于要求解的函数是凸的还是非凸的。在下一节中，我们将根据目标函数是凸还是非凸，详细介绍选定的求解器示例。\n\
  \n### 目标函数为凸函数时的求解器\n\n当目标函数是凸的时，求解器需要找到一个全局最小值。某些求解器在优化目标函数的同时满足约束。通常，求解器通过利用内点法或活动集法来实现这一点。内点法从可行区域内部开始，并使用障碍函数施加约束。活动集法通过快速猜测活动约束集来寻找解决方案。\n\
  \n\n\n\n如果已知激活约束，则可以丢弃非激活约束，并高效地达到更简单的解。出于这个原因，尽管算法的运行时间较高（称为“最坏情况复杂度”），但活动集方法可以优于相应的内点方法。当仅存在变量边界时（例如，没有其他通用约束），它们通常是首选方法。在可行区域内找到可行点时，算法停止；在该点处，任何进一步优化目标的尝试都将违反至少一个约束。达到平衡点的权重被称为`dual\
  \ variables`；也就是说，它们是约束梯度的乘数，使得目标梯度等于约束梯度的缩放和。通常使用拉格朗日函数在数学上描述该系统，因此对偶变量也常称为 `Lagrange\
  \ multipliers` 。\n\n### 针对非凸目标函数的求解器\n\n当问题是非凸时，有两种可以尝试的方法：\n\n1. 如果问题是大规模的，可以使用多启动（multistart）选项，它本质上是在一组不同的（通常是随机生成的）点应用局部求解器，然后返回最佳结果。多启动方法在高维情况下通常表现最好。\n\
  \n2. 在使用无导数方法的低维情况下，可以采用复杂的采样方法，同时进行全局和局部搜索。因为这些方法不需要梯度进行优化，因此它们的应用更广泛，尽管在所有情况下都不保证能收敛到局部解。由于它们对问题本身的假设较少，因此通常被称为黑盒求解器。\n\
  \n    * 遗传算法是一类局部搜索算法，通过应用自然选择和演化原理寻找最佳解。在这里，`首先选择一个随机候选样本种群，`并对第一代种中的每个成员进行目标函数评估。当前迭代中的个体成员被随机选择，只有具有最佳目标值的成员会被选择解。因此，它们被认为比其他成员更“适应”，并被选择用于下一次迭代。有时解可以作为下次迭代的一部分传递给交叉运算符或变异运算符。搜索空间由变量范围定义，交叉操作允许搜索移动到搜索空间的新区域（结合“父代”解的最优特征来创建“后代”——这种组合构成了搜索空间的新区域）。\n\
  \n        * 变异算子随机改变解，使得对解空间的搜索以一种防止过早收敛到局部最小值的方式进行。\n\n    生成集搜索算法沿搜索方向的正向跨越集搜索改进点。在二维空间中，这可以是北、东、南、西等。当某些隐性假设（如连续性和光滑性）成立时，需要一个正向跨越集来证明收敛到局部最优点。然而，该算法的应用并不需要这些条件。与遗传算法相比，它们每次迭代使用的样本集较少，因此更擅长快速找到局部解。因此，将遗传算法作为全局搜索算法，结合生成集搜索算法来精炼遗传算法发现的潜力点，可以得到一个稳健且高效的混合求解器。\n\
  \n## 参数调优\n\n在 AI 和机器学习模型开发过程中，有大类参数需要调优。这些参数可以在模型训练期间优化，也可以在模型训练过程之外优化。\n\n| 算法\
  \ | 参数实体 | 超参数 |\n| :--- | :--- | :--- |\n| 线性回归 | `线性回归方程的系数包括截距项（常数）和 beta（独立变量的系数）。`\
  \ | `主要的估计方法是普通最小二乘法 (OLS)、简单平均法 (SAM) 和随机梯度下降（同时使用学习率和迭代次数）来估计参数。` | `使用的逐步回归方法可以包括后向\
  \ (Backward)、弹性回归 (Elasticent)、前向 (Forward)、前向交换 (Forwardswap)、LAR、LASSO` |\n| 逻辑回归\
  \ | `逻辑回归方程的系数包括截距项（常数）和 beta（独立变量的系数）。` | `主要的估计方法是极大似然法或随机梯度下降（同时使用学习率和迭代次数）来估计算法参数。`\
  \ | `超参数包括，例如模型选择方法及其使用，可以包括后向 (Backward)、前向 (Forward)、LASSO、无或逐步 (Stepwise) 方法，进入/删除的显著性水平，以及...`\
  \ |\n| 分位数回归 | `每个分位数水平，不同的回归系数包括截距和 beta（独立变量的系数）。` | 无 |\n| 通用线性模型 | `对于关于链接函数和独立变量的变换响应，其系数基于线性关系：截距项（常数）和\
  \ beta（独立变量的系数）。` | `使用极大似然估计 (MLE) 而非普通最小二乘法 (OLS) 来估计参数。` | `使用的逐步回归方法可以包括后向 (Backward)、弹性回归\
  \ (Elasticent)、前向 (Forward)、前向交换 (Forwardswap)、LAR、LASSO、无或逐步 (Stepwise) 方法` |\n\
  | 决策树 | `决策树（如分类和回归树 CART）的参数是从内部改变树结构的参数。` | `定义树拆分的递归划分参数是算法内部的的，因此决定了树的生长方式，例如代价复杂减少误差法。`\
  \ |\n| 随机森林 | `参数包括如何使用类别/区间目标准则对树进行内部划分、最大分支数以及如何使用缺失值作为属性。` | |\n\n\n\n\n* 区间箱数量\n\
  * 树的数量\n* 袋内样本比例\n* 每次分裂的输入数量\n\n### 梯度提升机\n参数分为树特定参数、提升参数和杂项参数。\n\n* 树特定参数：分裂事件所需的最小样本数、终端叶子节点所需的最小样本数、终端叶子节点占总样本数的比例（基于权重）以及最大叶子数。\n\
  \n* L1 正则化\n* L2 正则化\n* 学习率\n* 最大深度\n* 最小叶子大小\n* 区间箱数量\n* 每次分裂的输入数量\n* 树的数量\n* 采样率\n\
  \n* 提升参数是建模的序列树数量。\n* 杂项参数：用于最小化每次分裂的损失函数；当使用其他模型的输出作为 GBM（梯度提升机）的初始估计时所需的输出初始化；用于设置种子的随机样本数（允许固定该数量，但这种固定仍允许随机样本设置种子）；允许在模型拟合时生成不同输出值的详细模式（verbose）；允许在模型之前的拟合基础上拟合额外树的热启动（warm\
  \ start）；以及自动选择数据进行预排序以减少分裂时间的预排序（presort）。\n\n## 神经网络\n* 参数包括激活函数（一种如 `tanh(x)`\
  \ 之类的数学变换）、类似于线性模型中截距的偏置（Bias），以及隐藏层或输出层中神经元连接的权重。\n* 其他参数取决于所使用的激活函数类型——例如非线性参数\
  \ ReLU 激活函数对于负值的斜率参数。\n\n* 隐藏层数量\n* 每个隐藏层中的神经元数量\n* L1 权重衰减\n* L2 权重衰减\n* 学习率\n\
  * 退火率\n\n### 支持向量机\n三类参数为：\n\n* 正则化，决定了根据误分类点惩罚的程度\n* 包含在核函数中的参数，例如核类型（线性、径向基函数、多项式或\
  \ sigmoid）以及每个核函数的核系数\n* £-不敏感值，定义了对错误不进行惩罚的容忍边际\n\n* 惩罚\n* 多项式次数\n\n### 贝叶斯网络\n\
  参数取决于网络的复杂度。这种复杂性基于 `n` 个变量上的概率分布——即代表变量之间关系的每个组合状态的概率。\n\n参数为：\n\n* 预筛选预测变量——指定是否使用目标与每个输入变量之间的独立性检验来预筛选变量。\n\
  * 使用变量选择——指定是否根据网络使用目标与每个输入变量之间的条件独立性检验来选择变量。\n* 独立性检验统计量——用于独立性检验显著性水平的统计量，通过使用独立性检验显著性水平的值指定独立性检验的显著性水平（p\
  \ 值）。\n\n* 网络结构\n* 最大父节点\n* 父节点方法\n* 箱的数量\n\n调优超参数值是模型训练过程的一个关键方面。寻找超参数理想值（针对特定数据集对模型进行调优）的方法是人工的，因此非常耗时。为了设置这些值提供指导，风险模型师通常依赖他们使用机器学习的经验。然而，即使对机器学习及其超参数有专业知识，这些超参数的最佳设置也会随着不同数据而发生显著变化；很难根据以往经验来规定超参数值。能够以更具引导和自动化的方式探索替代配置，有助于减少对人工操作的需求。以下是用于自动超参数调优的常用方法：\n\
  \n* **网格搜索。** 将感兴趣的每个超参数离散化为一组期望值。对所有值的组合进行模型训练和评估。为了设置这些值提供指导，风险模型师通常依赖他们使用机器学习的经验。然而，即使对机器学习及其超参数有专业知识，这些超参数的最佳设置也会随着不同数据而发生显著变化；很难根据以往经验来规定超参数值。能够以更具引导和自动化的方式探索替代配置，有助于减少对人工操作的需求。例如，对于\
  \ 9 个超参数并假设相同的水平（3），网格可能会产生 19,683 种组合。\n\n* **随机搜索。** 通过超参数的随机组合训练并评估候选模型。在随机搜索中，超参数的分布被均匀定义或通过采样方法定义。随机搜索运行得比穷举网格搜索更快，因为选择了随机样本。需要注意的是，在随机搜索中，不会从之前尝试过的参数值或组合中学习。这意味着在单个值的选择上存在“运气”成分。\n\
  \n* **Latin 超立方采样。** 该方法遵循一种实验设计，其中样本在每个超参数上是精确均匀的，但在组合上是随机的。这种方法比纯随机搜索更具结构化，允许对每个超参数进行更均匀的采样，即使没有发现最佳组合，也有助于识别超参数的重要性。\n\
  \n* **优化。** 在这里，搜索是基于最小化模型验证误差的目标，因此从算法的角度来看，每次“评估”都是模型训练和验证的一个完整周期。这些方法旨在利用较少的评估次数，从而节省计算时间。需要注意的是，在用于超参数搜索的优化中，会发生“学习”。这种学习发生在之前尝试过的配置上，它们会影响新配置的选择，同时最小化损失函数。权衡是并行评估的配置较少。理论上，如果有足够的机器，网格或随机配置可以并行评估，但使用优化时，并行化是限制的，因为迭代是必要的。\n\
  \n* **局部搜索。** 类似于“无导优化”，这指的是一类调优算法，可以独立应用许多不同的个体算法。局部搜索优化的一种非标准实现方式是分布式环境的混合框架，它可以帮助克服超参数优化的挑战和成本。\n\
  \n## 风险模型的其他优化算法\n\n针对特定的机器学习模型存在优化算法，包括逻辑回归和神经网络的算法。在本节中，我们列出了这些算法。\n\n#### 逻辑回归\n\
  \n以下技术均用于逻辑回归算法中可能遇到的非线性优化，其中需要重复计算优化标准、梯度向量（一阶偏导数）以及海森矩阵的部分（二阶偏导数）。\n\n\n\n\n\n\
  * 共轭梯度法\n* 双狗腿法\n* 拟对拟拟牛顿法\n* Nelder-Mead 单纯形法\n* 牛顿-拉夫逊法\n* 带岭回归的牛顿-拉夫逊法\n* 置信区域\n\
  \n## 神经网络\n\n* **随机梯度下降。** 该算法的优化问题是求解权重。该算法是梯度下降的一种变体，在每一步中，它不是计算所有观测值的损失梯度来更新权重，而是使用“小批量”（mini-batch）随机观测值来估计损失。采样是不重复抽样的，直到所有观测值都被使用。随机梯度下降的性能与所有优化算法一样，取决于控制参数，而没有默认值适用于所有问题。随机梯度下降的参数包括控制参数，例如：\n\
  \    * 控制选择新权重步长的学习率\n    * 用于自适应衰减率和退火率，以调整每个权重和每个时间的学习率\n    * 用于避免缓慢震荡的动量参数\n\
  \    * 用于采样观测子集的大小\n\n# 作为优化工具的机器学习模型\n\n我们已经讨论了数学优化以及它在算法中的应用。然而，正如章节开头所解释的那样，优化是指一种行为、过程或方法，用于根据当前问题使“某物”尽可能充分发挥功能或高效。这种“某物”在风险管理中的影响深远——从系统、决策、技术设计，当然还有机器学习算法。以下是风险管理中业务应用的示例，这些应用需要优化以实现效率最大化。\n\
  \n## 用于减少贷款决策策略规则的决策科学优化工具\n\n尽管应用于贷款申请的策略规则代表了个人信用风险特征的潜在损失函数，但它们也反映了组织的风险偏好。这意味着策略规则会随着时间的推移而扩大或缩小，以收紧或放信用政策。它们还需要用于贡献或作为理由代码生成器来批准或拒绝贷款。然而，策略规则的应用往往是主观的，通常会减慢决策响应时间。\n\
  \n此外，尽管策略规则对于贷款决策至关重要，但策略规则有五个被忽视的方面存在优化机会：\n\n1. **单变量。** 策略规则通常作为单变量规则（`IF`、`AND`、`OR`、`WHERE`）应用，并且由于监管和其他合规原因需要持续更新。\n\
  2. **重复性。** 为了跟上法规和合规要求，由于新规则的产生，规则数量通常会增加。这导致策略类别之间产生叠加效应，并导致了不必要的复杂性。\n3. **决策缓慢。**\
  \ 大量的策略规则导致决策响应时间变长，并且对于哪些个人策略或策略组合促成了决策缺乏清晰度。\n4. **合理化。** 风险团队可以通过简单确定它们捕获记录的频率（考虑命中率）来优化规则数量。在指定时间范围内平均命中率的规则可能会被手动删除。\n\
  5. **监管压力。** 由于管理行为方面的法律和其他监管指令导致需求增加，意味着任何试图使用命中率减少策略规则的努力都是无效的。\n\n一个使用近似（或函数近似）机（机器学习）来模拟最终决策结果的决策科学优化工具可以：\n\
  * 增强策略规则的优化\n* 替换规则或规则组合\n* 预测做出最终决策所需的规则\n* 通过缩短决策时间来改善客户体验\n\n决策科学优化工具仔细考虑了零售贷款申请的贷款流程。策略规则通常被实现在决策引擎中，但某些银行会先对申请运行信用模型（即评分卡），然后运行策略规则，以确保信用拒绝不会被策略规则覆盖。\n\
  \n无论在贷款申请上运行策略规则或信用模型的顺序如何，做出的决策通常是模型和策略规则的混合，这些可以由人工评估人员进行调整。人工评估人员可以覆盖自动化决策。在某些情况下，覆盖过程会延长决策时间，并导致已批准的申请未被。过度的策略覆盖通常与过多的规则和复杂性有关。\n\
  \n图 8.3 所示的设计原理说明如下：\n\n* 通常，初始评分卡会评估申请的信用风险。\n    ![图 8.3 减少策略规则的决策科学优化工具的设计原理。重要的是，该工具应该允许对决策的两种力量进行评估——即评分卡和策略规则。](img/c08f003.png)\n\
  \    图 8.3 减少策略规则的决策科学优化工具的设计原理。重要的是，该工具应该允许对决策的两种力量进行评估——即评分卡和策略规则。\n\n* 对于策略规则优化，执行两步流程：\n\
  \    * 第一，识别与最后决策相关的变量。\n    * 然后，使用这些变量来确定策略规则类别的近似程度。\n* 近似程度较低的策略规则类别可以被删除，或者如果仍需要，则可以使用机器学习对子段进行建模。\n\
  \n重要的是，决策科学优化工具可以同时分析贷款决策过程的两个方面，即信用模型和策略规则。最后的决策通常很难建模，因为贷款申请决策是由模型、策略规则和人工评估干预驱动的，因此具有客观性和主观性。\n\
  \n该工具提供了机器学习洞察，但重要的是，这些洞察可以利用贷款过程早期的最终批准或拒绝来缩短决策时间。此外，机器学习的优势可以通过确定高价值、有还款能力且应避免过长时间决策的客户群体来优化收益。\n\
  \n## 抵押品优化\n\n抵押是指对方同意转移的资产、其他担保或证券，这些资产等于或超过卖方提供的应收款和债务。抵押的作用是降低卖方面临对方未履行协议（例如对方违约）的风险。\n\
  \n* 资产是指未来可以转换为现金的任何价值物品。例如现金及现金等价物、债券、股票、货币市场工具、房地产和加密货币。\n* 交易对手是指个人或法律实体，如公司、商业银行或政府机构。\n\
  \n管理抵押品需要涉及复杂的多种决策，因为管理取决于银行是作为卖方还是对方（如资本市场中所示）。在一般水平，这些决策包括：\n* 证券类型。\n* 为抵押品基础资产分配的价值。\n\
  * 抵押品的机会成本——这些涉及基础资产的管理成本和交易对手风险。\n\n\n\n\n\n当可分配的资产只有少数敞口时，抵押品管理非常简单且直观，这意味着抵押品管理可以很容易地手动完成。\n\
  \n*   `Cost model.` 该模型可以最小化抵押品成本以及资金成本。\n*   `Allocation model.` 这可以通过方法实现，例如通过成本模型对资产从低到高进行排序，或者通过线性规划来实现。\n\
  \n## 结语\n\n利用人工智能、机器学习和高级分析进行优化是一个快速发展的领域。在本章中，我们解释了机器学习算法优化。这涉及`solvers` 的使用、对`hyperparameters`\
  \ 的自动调优以及使用`stochastic gradient descent` 进行模型训练优化。此外，嵌入机器学习的优化算法是解决特定风险业务问题的强大工具。请记住，尽管优化非常强大，但它在数学上是复杂的，并且可能涉及大量的计算资源。好消息是，存在使用机器学习应用优化的自动化方法，可以将部分复杂性转移，帮助简化决策流程，使风险部门能够专注于优化所产生的业务价值。\n\
