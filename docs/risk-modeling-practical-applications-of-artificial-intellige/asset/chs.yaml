  \ Gary、Cara 和 Isabella。感谢你们让我开怀。保持好奇心，永远心怀梦想。\n\n**Stephen J. Tonna：** 感谢我亲爱的妻子\
  \ Nini 和刚出生的儿子 Sebastian，他们都听过凌晨笔记本电脑键盘的“敲击声”……对所有的噪音表示歉意，但惊喜的结果是，小 Sebastian 现在既热衷于在笔记本上打字帮助爸爸，又在学习机器学习算法的原理！\n\
  \n# 前言\n\n## 风险建模的未来\n\n人们说我们正在进入第五次工业革命：人工智能时代。计算机开始执行人类任务（称为人工智能，AI）的能力，以及检测非线性关系和自学习的复杂算法（称为机器学习）的广泛使用，正从实验走向生产成熟，并反过来彻底改变了金融服务的许多方面。\n\
  \n\n\n\n\n这些技术在流程自动化和数字化客户旅程中的应用在许多行业中呈指数级增长，但我们观察到在金融风险管理领域的应用更为保守且缓慢。在一个关于人工智能和机器学习应用信息无处不在的时代，金融机构对于其在要求决策合规和透明的受监管区域的适用性持谨慎态度。\n\
  \n与此同时，数字革命正发生在一个日益不确定的世界背景下。波动性处于历史高位。风险管理职能每天都在应对新类型的风险。全球各机构正在应对各种风险，例如新冠疫情后杂乱无章的恢复、通货膨胀上升、不断累积的地缘政治风险以及气候变化的影响。\n\
  \n通过这本书，我们希望强调人工智能和机器学习的优缺点，并解释如何将两者有效应用于日常风险管理问题，以及如何高效地评估不确定性冲击（如全球大流行病和气候变化）的影响。在全文中，我们旨在通过清晰的解释消除对人工智能和机器学习使用的误解，同时为将这些技术纳入组织的风险管理框架提供实用的建议。\n\
  \n通过适当的控制，人工智能和机器学习可以带来切实的利益，并成为风险职能工具箱中实用的工具。与人类主导或其他传统的决策方法相比，它们可以提高风险评估的准确性和速度，同时通过增加自动化为风险管理引入新的工作方式。创新的回报并非没有其自身的风险，而且这些技术在今天很大程度上仍缺乏监管（尽管这在未来将发生变化）。在书中，我们还强调了组织在使用人工智能和机器学习时面临的障碍，并提供了克服这些障碍的方法。\n\
  \n本书的结构旨在于金融风险建模的背景下介绍人工智能和机器学习，包括各种数据集的入入和准备。在整书中，我们提供了真实的风险管理应用案例。书中包含了关于模型实施、可解释性以及处理偏差与公平性的专门材料。它还详细介绍了如何将模型治理框架扩展到人工智能和机器学习、机器学习中优化的使用，以及人工智能和机器学习如何帮助风险管理人员更好地评估和应对气候变化等新类型的风险。\n\
  \n随着人工智能和机器学习的变革性进展，加上新领域开发的激进速度，作为一个行业，我们在金融风险管理中的实际应用仅是触皮一角。通过这本书，我们旨在使组织能够继续建立正确的框架和基础设施以支持现代技术，更重要的是，在人工智能和机器学习方面建立专业知识和能力。\n\
  \n# 第一章：引言\n\n*“到目前为止，人工智能最大的危险在于人们过早地得出他们理解了它的结论。”*\n\n—Eliezer Yudkowsky\n\n毫无疑问，我们作为一个社会，正以以前所未有的速度进入技术的新进展阶段。数字数据的快速增长和计算能力的提高为生活的每个领域转型提供了无限可能。同时，这些发展也驱动着人类行为、消费需求和预期的前所未比的变化。人们认为，我们现在正在进入下一波革命浪潮：第五次工业革命或人工智能（AI）时代。据说，在这个时代，机器确实能够进行不同程度的自我决决、推理和“思考”，并与人类协同工作。作为一种技术，人工智能渗透到每一个行业，包括金融服务。它也开始作为一种实用的工具走向成熟。\n\
  \n然而，`AI` 是一个广泛的术语，由不同的行业机构定义。《牛津词典》将其定义为“能够执行通常需要人类智能的任务（如视觉感知、语音识别、决策制定和翻译）的计算机系统的理论和发展。”作为一门科学学科，`AI`\
  \ 包含了几个子学科，例如机器学习（深度学习和强化学习是其例子）、机器推理（包括知识表示、演绎）和机器人学（包括传感器）。\n\n尽管真正的 `AI` 系统能给人类带来巨大的变革性收益，但人工智能的什么特质让我们脊背发凉？可以说，这种寒意源于在人类历史上第一次，我们正在与技术的`智能`部分进行交道。另一个原因是好莱坞！令人惊讶的是，电影史上最难忘的时刻之一来自斯坦利·库布里克\
  \ 1968 年的作品《2001：太空漫游》。其他电影和科幻小说中也有场景描绘了人工智能最终崛起并控制社会。在许多方面，赋能人工智能的系统已经整合到我们的个人生活中。例如，像\
  \ `Google Assistant`、苹果的 `Siri` 和亚马逊的 `Alexa` 等虚拟助手，它们使用源自传统的 `LISP` 进行语音识别。\n\n\
  通过继续增强并在有时自动化手动工作或日常任务，赋能人工智能的应用继续改变着我们的个人和职业生活。人工智能正在让曾经的科幻变成科学事实。在考虑以下四个主要因素的综合影响时，这种情况将持续：\n\
  \n- **摩尔定律**：据说计算能力每两年翻一倍，且在可预见的未来将持续如此。\n- **数据**：数据的创建和复制每年翻一倍。估计地球上每位人类每秒产生 1.7\
  \ 兆字节的新信息，这意味着从 2010 年到 2020 年，数据增长了 5000%——从 2010 年的 1.2 万亿 GB 增长到 2020 年的 59 万亿\
  \ GB。数据的指数级主要受数字化驱动，预计并将持续。\n- **资金**：人工智能资金每两年翻一倍，主要受所需计算能力的可用性驱动。\n- **时间的检验**：有\
  \ 50 年成熟的人工智能和定量研究支持着更好的算法。\n\n## 风险建模：定义与简史\n\n近年来，金融机构使用的风险模型数量剧增，每年增长 10%-25%。\n\
  \n因此，在书中，除非另有说明，`模型`是指金融风险模型。有趣的是，大多数现代风险和概率理论都是源于过去 200 到 300 年科学、经济和技术的创新。\n\n\
  \n\n\n此外，斐波那契在 13 世纪访问位于阿尔及利亚某处港口的父亲时，从交易者那里学习了印度-阿拉伯数字系统。数学、贸易和金融领域的创新似乎是密不可分的——但这也许是另一本书的主题。风险模型的使用很可能可以追溯到我们现在认为的保险精算科学的前身。在\
  \ 18 世纪，这些前现代的分析师通过研究数据来估算预期寿命，以此为保险费定价。\n\n回到现代；基于大卫·休姆（David Hume）和尼古拉斯·伯努努利（Nicholas\
  \ Bernoulli）等人的工作，哈里·马科维茨（Harry Markowitz）在 1952 年开发了投资组合理论。今天，我们可以将模型定义为定量方法、系统或方案，它应用统计、经济、金融或数学理论、技术和假设，将输入数据处理为定量估计。\n\
  \n风险模型在金融服务中无处不在。原因之一是全球金融危机前后大量的新规。在过去的十年中，层出新监管扩大了机构需要管理的模型数量。此外，机构增加了模型的使用量以保持竞争力——用分析方法取代人工活动和决策，同时提高了模型的复杂性。模型还被用于跟上大数据和数字化等行业趋势。\n\
  \n全球金融危机的影响不仅增加了管理的模型数量，还增加了它们的复杂性。机构开始添加不同类型的模型——包括计量经济模型、用于拨备的金融和前瞻性模型，以及企业压力测试。这导致模型之间、其运行方式以及定义它的过程（即风险模型生命周期）之间的依赖关系和相互连接日益增加。\n\
  \n随着 COVID19 疫情凸显了风险模型生命周期的低效率，新模型开始获得更多的关注。这些问题在新冠 19 疫情期间在前瞻性损失模型中观察到的波动中尤为明显。金融机构意识到，风险模型需要在有效性与由于新冠\
  \ 19 疫情导致的潜在长期恶化状况以及增加的宏观经济不确定性之间取得平衡。长期状况和增加的不确定性可能会继续对许多不同类型的风险模型产生“冲击”。在写作此时，许多大型银行加速了重新校准工作，包括使用替代数据和建模方法，原因在于：\n\
  \n* 消费者和投资组合行为的变化导致风险排名和风险剖析差异\n* 由于与宏观经济指标的相关性变化导致风险模型直接失效\n\n在风险管理中使用人工智能和基于机器学习的算法需要对风险模型生命周期进行重新思考。通常，一个传统的统计模型需要风险建模团队投入几个月的开发工作。可能会认为，需要漫长的过程来确保所需的准确性、性能和验证水平，但经验表明，大量的精力浪费在了由于风险模型生命周期中碎片化、遗留系统导致的低效上。例如，根植于业务活动孤岛的僵化流程可能会延迟审批，并且可能存在一种支持在每个模型开发活动中都“重造轮子”心态的文化。\n\
  \n新冠 19 的一个教训是，基于风险的决策的构建和部署模型周期过长会导致次优决策。使用人工智能和机器学习提供了一个极大缩短“建模时间”并获得相应回报的机会。\n\
  \n## 风险建模中人工智能和机器学习的使用\n\n作为一套工具，人工智能和机器学习具有变革性潜力，与传统模型相比，可以提高准确性，处理大型结构化和非结构化数据集，并帮助机构对市场状况的变化敏捷响应。这套工具已有效用于解决问题，并且随着大数据技术和数字化的快速采用，其应用可能会进一步加速。\n\
  \n在金融服务领域，人工智能和机器学习的使用在新冠 19 爆发前几年就开始了，并涵盖了金融服务的多个领域，包括风险管理。对于风险职能，人工智能和机器学习通过自动化枯燥任务和处理大量多样化数据，带来了切实的益处。这些工具可以灵活地识别数据中隐藏的复杂关系，从而与传统统计方法相比，实现更高水平的模型准确性。然而，为了大规模和长期地使用人工智能和机器学习，需要将科学思维更地植根于文化中以及企业各团队创新的方式中。\n\
  \n在将科学思维应用于人工智能和机器学习时，技术通常用于解决特定问题，而不是试图利用该技术来顺带解决现有问题。一旦确定了问题，就可以利用涉及数据、人员和流程的科学基础对假设进行适当测试。接下来我们将解释传统的风险管理职能如何应对新的和新兴风险发生改变，以及人工智能和机器学习如何能够更轻松地应对这些产生的需求。\n\
  \n## 新的风险管理职能\n\n风险管理不仅是合规措施的集合，更是满足内外部治理机构持续需求和期望的功能。目前的风险管理框架正在适应新的和新兴风险、宏观经济环境不确定性的增加，并解决金融决策中的透明度和公平性问题——特别是涉及客户和影响环境的问题。新兴风险、数字化、更激烈的竞争和新规对现代风险职能提出了更高要求，特别是在新冠\
  \ 19 和气候变化的背景下。\n\n在写作此时，一种名为严重急性呼吸道病毒冠病毒（SARS-CoV-2）的微小单链 RNA 导致了新冠肺炎（COVID-19）和潜在的危及呼吸道感染，它已迅速扩散成为全球大流行。\n\
  \n由于抑制措施导致的剧烈波动，幸运地得到了财政政策的应对，包括对借款人的短期援助以及各国政府和中央银行引入的其他计划。无论抑制措施的程度如何，银行资产负债表中建立的韧性——由于全球金融危机后加强监管的结果的大额资本缓冲区依然存在。\n\
  \n谁能想到一根微小的 RNA 链可以在短短几个月内引发如此宏观经济动荡？许多企业不得不适应新定义的“常态”。\n\n尽管疫情的影响迅速且严重，但恢复也同样迅速，因为各国和地区走出新冠限制，数万亿美元的刺激措施提振了经济。\n\
  \n疫情高峰期的宏观经济影响对机构的风险和盈利水平产生了强烈的负面影响，并要求政府进行快速干预。例如，对于金融服务而言，众，风险与盈利已知与宏观经济影响密切相互作用（根据信用周期或利率周期）。此外，金融服务在稳定企业业务运营所需的市场方面发挥着必要且重要的作用。\n\
  \n\n\n\n财务和非财务风险的主要类型总结在表 1.1 中。\n\n几十年来，人们对气候变化有了认知。自 1992 年以来，联合国已经承认全球气候格局的变化（主要是由于温室气体排放）给世界带来了严峻问题。\n\
  \n### 表 1.1 风险类型及相关定义\n\n| 风险类型 | 定义 |\n| --- | --- |\n| 信贷风险 | 因借人未能履行还义务而导致财务损失的风险。\
  \ |\n| 市场风险 | 因市场价格波动导致机构收益损失的风险。 |\n| 运营风险 | 因内部流程失败、人员、系统或外部事件导致损失的风险。 |\n| 保险风险\
  \ | 提供保障的有害或意外事件、威胁或危险。 |\n| 流动性风险 | 公司无法在到期时履行短期义务而产生的风险。 |\n| 声誉风险 | 因舆论导致的财务和非财务损失风险。\
  \ |\n| 战略风险 | 因不利的业务决策或对行业和经营环境的变化缺乏反应而产生的风险。 |\n| 合规风险 | 因违反法律法规、内部政策和程序或伦理标准而产生的风险。\
  \ |\n| 利率风险 | 因利率波动导致损失的风险。 |\n\n气候的稳定性和金融服务业通过宏观经济、金融和气候系统之间复杂的相互作用层紧密联系在一起。\n\n\
  ## 借助自然的力量克服技术和 AI 的采纳障碍\n\n此时，你可能在自问，是否完全是因为我们正在等待真正的“AI”被创造出来才成为主流，还是有其他因素在起作用阻碍了采用？缩小大规模大规模采纳的源性障碍的一种方法是回顾过去的工业革命时期。\n\
  \n当像通信手段和社会系统等新技术进步产生协同效应时，它们创造了工业革命，反过来通过创新推动了社会现代化。\n\n有时需要一个像 `ATM` 这样的推动变化的推力，结合气候事件，来加速技术创新的采用。然而，尽管是重复且平凡的，转型并非易事，需要巨大的努力。为了让有机创新取得，像\
  \ `ATM` 甚至电话这样的技术变化通常需要通过实验而非强制来获得经验，这样才能充分理解变化的需求、必要性以及其机会和风险。考虑到这一点，甚至可以创造出对变化的渴望。\n\
  \n同样，在风险建模中 `AI` 和机器学习的主流采用也需要实验和经验才能被充分理解。正如 `ATM` 示例所示，虽然采用新技术有时需要一种冲击，但当技术改善了客户体验时，就会发生广泛采用。如果没有发生这种情况，那么\
  \ `AI` 和机器学习的切实利益可能无法得到充分利用。\n\n## 本书：它是什么以及不是什么\n\n通过本书，我们旨在提供示例和信息来揭示 `AI` 和机器学习的概念，从而提高对其许多益处的认识，并了解它们如何应用于解决日常风险管理问题（例如，如何评估全球大流行和气候变化等极端事件的财务影响）。我们还强调了与风险管理中的\
  \ `AI` 和机器学习相关的某些增量风险和意外后果，以及解决这些问题的方法，从而使组织为对其采用和负责任的使用做好准备。在可能的情况下，我们旨在提供 `AI`\
  \ 和机器学习在风险管理中带来切实利益的实际用例。\n\n## 尾记\n\n1. 1. 牛津出版社，《The Oxford Dictionary of Phrase\
