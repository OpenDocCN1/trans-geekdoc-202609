  \ and Integer Programming`. Wiley, 1998.\n\n# 第 9 章：气候与稳定性之间的相互联系\n\n几十年来，关于气候变化的讨论一直是广泛辩论的话题。日益明确的是，尽管温度正在升高（正如卡尼在\
  \ 2015 年所说的那样），但央银行和监管机构已经采取了措施。\n\n许多中央银行、监管机构和行业协会已发布了应对财务风险的指南。虽然我们在某些领域观察到了趋同——例如使用前瞻性场景分析和标准化报告——但这些仍处于婴儿阶段。由于我们正处于向低碳经济过渡的关键十年，金融机构迫切需要帮助管理财务性和非财务性风险。在下一节中，我们将讨论更多细节。\n\
  \n## 气候不稳定的程度：理解气候风险管理的“为什么”\n\n首先，在讨论可能的解决方案之前，理解主要问题、科学原理和数据非常重要。在金融服务行业，与其他行业一样，气候风险正成为企业决策的主流：气候不稳定的程度将影响财务决策的大多数方面。为了评估和应对气候变化，可以借鉴*科学*方法——使用*科学*思维方式来调查历史数据和观察研究，构建问题，然后形成假设。然而，这种方法也有自己的局限性，因为气候变化没有历史先例。\n\
  \n### 气候变化危机：不仅仅是 CO[2] 排放\n\n关于气候变化以及它是否真的是紧急情况或真实存在的讨论并不是新鲜话题，已经存在了几十年。然而，在写作时，97%\
  \ 的气候科学家同意气候变化确实存在。\n\n\n\n\n\n具体而言，处理和分配化石燃料的污染设施增加了大气中温室气体的水平，导致了变暖效应。主要的罪祸首是\
  \ `CO[2]` 以及甲烷等污染物，但也包括氧化亚二和氟化气体。\n\n研究表明，人类活动导致了温室气体排放与上世纪观测到的地球平均温度升高之间的联系。\n\n\
  然而，气候变化不仅仅是全球变暖：它被定义为“平均天气状况显著变化”，在几十年或更长时间内变得更热、更潮湿或更干燥。在这种情况下，长期趋势将气候变化与自然天气波动区分开来。\n\
  \n人类活动对气候的其他影响包括：\n\n* 环境温度在热和冷之间的波动：\n    * 最近的一个例子是极端高温和长期干旱，这导致了 2019–2020 年澳大利亚史所未有的森林火灾。火灾焚毁了\
  \ 4600 万公顷（72,000 平方英里）。\n    * 冰的形成和强降雪。\n* 垃圾填埋场在分解时释放甲烷和氧化亚二。\n* 频繁且更剧烈的降水导致降水量增加，从而引发化学风化（沿沿海地区和水道产生侵蚀的碳酸）。\n\
  * 人类定居点的扩张和基础设施建设导致的洪水和高水位。\n* 森林砍伐以及通过伐木或皆伐森林移除碳汇。\n\n我们需要意识到，人类文明在稳定的气候中才能繁荣，而根据极端天气事件频率和严重程度的增加，地球可能正在向不稳定状态加速。与极端天气事件相关的社会经济影响和危害在人员生命损失方面是巨大的，例如\
  \ 2010 年俄罗斯热浪导致了 55,000 人死亡。哈维飓风造成的资金损失等同于 1250 亿美元（相当于 2017 年美国人均损失了约 380 美元）。如前提到的，气候变化加剧了极端天气事件的危害；例如，据估计，由于全球气候变化，俄罗斯热浪发生的概率增加了三倍。\n\
  \n一个由 11,000 名科学家组成的全球小组认可了过去 40 年来对各项措施的研究，这些研究支持了世界正面临气候紧急状况的假设；研究表明以下情景是可能的：\n\
  \n* 二年后，南亚人口稠密的地区将更频繁地面临大于或等于 34°C 的威胁生命的热浪。\n* 撒哈拉沙漠到 2030 年将跨越地中海。这意味着非洲人口稠密的海岸地区将被挤在沙漠和上升的海平面之间，影响数百万人。\n\
  * 根据 2021 年至 2050 年火灾季节的变化（以 1971–2000 年作为比较基准），亚马逊雨林的易燃性将显著增加。\n* 中国、日本和韩国的海岸将经历过去罕见天气事件（如台风）频率增加。在本世纪晚些时候，系统性洪水将带来严重问题。\n\
  \n## 联合国与气候变化\n\n自 1992 年以来，联合国一直意识到全球气候模式以及区域模式的变化给世界带来了严重问题。过去 28 年关于气候变化及其即将产生的影响的科学证据指导了各项协定。《巴黎协定》也不例外。\n\
  \n### 表 9.1 联合国气候协议历史\n\n| 年份 || 联合国会议及相关协定 |\n| --- | --- |\n| 1992 || 联合国气候变化框架公约\
  \ (UNFCCC) |\n| 1995 || 柏林授权 |\n| 1997 || 京议定书 |\n| 2001 || 在德国波恩进行的《京都议定书》谈判，关注排放交易和如何计算碳汇\
  \ |\n| 2005 || 《京都议定书》生效，不包括美国 |\n| 2007 || 开始谈判《京都议定书》 2.0 |\n| 2009 || 哥本哈根协定\
  \ |\n| 2010 || 坎昆协议 |\n| 2011 || 拟于 2015 年通过的新法律约束力协议草案。《京都议定书》2.0 延长至 2017 年 |\n\
  | 2013 || 应对气候变化损害和损失的华沙国际机制。还就名为 REDD+ 的终止森林砍伐倡议达成一致。 |\n| 2015 || 巴黎协定 |\n| 2018\
  \ || 确定巴黎协定规则 |\n| 2019 || 联合国气候行动峰会，各国根据《巴黎协定》提交国家自主贡献计划 |\n| 2020 || 因新冠 19 疫情推迟谈判。由于疫情，全球排放下降，但这种减少不会持续。\
  \ |\n| 2021 || 格拉斯哥 COP26 峰会 |\n\n2015 年，《巴黎协定》设定了全球气温净增长的目标，限制在 1.5 到 2 摄氏度之间。通常，参与国有两种方式来实现其约定的排放目标。第一是随时间推移逐渐减少排放，第二种是更激进的方法通过关闭污染设施来消除排放。后者可以通过用可再生能源替代化石燃料生产来实现。在考虑这些选项之前，让我们先看看为什么要实现排放目标的科学原因。\n\
  \n## 巴黎协定目标的局限性\n\n即使气温上升幅度低于 2 摄氏度，也会影响到生活和生计：它可能导致由于极端降水频率增加而引起的洪水、海平面上升以及火灾范围的扩大。此外，为了实现巴黎目标，参与国需要在行业部门和能源使用方面做出并维持改变，到\
  \ 2030 年每年减少 6%。\n\n一些关于气候变化的研究表明，巴黎目标并非合理可行，且 3 到 4 摄氏度的升温是一个更有可能的结果。\n\n在第五次评估报告中，政府间气候变化委员会（IPCC）确定了一组代表性浓度路径（RCPs），描述了不同变暖情景下的温室气体浓度（而非排放）轨迹。\n\
  \n## 关联：气候与金融稳定\n\n在《巴黎协定》和 COP26 之后，人们广泛意识到低碳经济转型带来了巨大的风险、新挑战，但也为金融服务提供了投资机会。几个领先行业机构提供了全球适用于清晰指导，例如：\n\
  \n* 气候相关披露工作组 (TCFD)，由金融稳定委员会成立，旨在帮助公司理解金融市场对气候披露所需的类型见解。在写作时，虽然英国和新西兰强制要求 TCFD\
  \ 披露，但已有 3000 多家机构加入，许多机构自愿报告其气候披露。\n* 金融体系绿色网络 (NGFS)，由一组央行和监管机构于 2017 年发起，支持向可持续经济转型，从\
  \ 2020 年起创建并改进气候相关情景。NGFS 等发布了对央行在披露和治理方面的预期指南。NGFS 强调，环境、金融服务业和客户通过宏观经济金融与气候系统之间复杂的相互作用层相互联系。\n\
  \n\n\n\n政策框架、指南和原则均得到了关键评估和报告数据的支持。\n\n为了让机构能够有效评估并应对与气候变化相关的风险，评估气候变化影响金融部门的渠道是有帮助的。这些包括：\n\
  \n*   **物理风险**。物理风险是指由于天气事件（如飓风、洪水、干旱和热浪）增加而导致物理性损害的风险。随着一个地区经历更多与气候相关的干扰，还将通过经济中断、潜在的供应链问题以及商业资产和房屋价值的下降，对企业产生间接影响。\n\
  *   银行已经在对资产进行物理风险评估，我们将在将在实践案例部分更详细地探讨这一主题。\n*   **转型风险**。转型风险源于向低碳经济的转型。主要的影响因素是气候政策、消费者偏好和碳定价。\n\
  \n这些气候风险类别的每一种都会从宏观和微观经济层面通过经济体传导，转化为金融风险，如信贷风险、市场风险、流动性风险、运营风险和声誉风险。\n\n# 使用人工智能和机器学习评估气候变化的影响\n\
  \n对于风险从业人员而言，为了评估气候变化对投资组合的影响并将气候风险评估纳入决策，关于气候风险模型的准确性和可靠性的问题随处可见。重点强调了以下考虑因素：\n\
  \n*   关于气候事件发生的时间规模存在大量不确定性。\n*   宏观经济与财务资产负债表之间的非线性关系是复杂的。\n*   物理风险和转型风险对宏观经济和财务资产负债表都有直接和间接的影响。\n\
  *   物理风险与转型风险之间存在额外的复杂性和相互作用。\n\n根据巴塞尔委员会的说法，“银行评估其所有重大业务气候风险总体敞口的能力，将很大程度上取决于其\
  \ IT 系统的质量以及聚合和管理大量数据的能力。”\n\n`start?上述内容已影响了越来越多的工作`\n\n气候变化问题的规模和复杂性要求新闻以及客户的预期和需求。这是一个旅程！\n\
  \n## 监管指南与合规措施\n\n在大多数情况下，金融机构并没有等待政府来推动缓解金融风险所需的大规模行动。它们正在响应来自机构投资者（如 `IIGCC`）的信号。\n\
  \n中央银行和监管机构正在发布前瞻性的气候压力测试和披露预期，这些大多基于气候相关财务披露工作组（`TCFD`）的建议。\n\n为了评估气候变化的影响，许多机构正在将其情景分析和压力测试框架扩展到包含气候风险情景。这也是许多中央银行采用的方法。情景分析是一个非常有用的工具，首先可以符合气候相关的监管压力测试，其次可以让各种利益相关者更好地理解在一系列前瞻性情景下的短期长期影响，并此制定计划。\n\
  \n\n\n开展气候相关的压力测试是一个很好的起点。请记住，对于金融机构而言，通常情况下监管压力测试的叙事可能不足以捕捉气候变化带来的独特影响。监管压力测试依赖于少数几种场景和泛化的模型假设，而这些假设并不一定适用于特定企业的风险概况。测试结果很大程度上依赖于人类判断。\n\
  \n尽管计划使监管和行业场景更具细粒度，但目前可用的场景尚未涵盖所有潜在的路径。此外，这些场景没有考虑到政策变化或缓解措施：例如，在财务损失发生之前，通过可再生能源的技术改进等缓解事件来避免物理风险。\n\
  \n在大多数情况下，目前使用的压力测试模型没有考虑到通过微观和宏观驱动因素进行传播渠道，也没有考虑到风险因素之间的非线性关系，这主要是因为广泛使用了`linear\
  \ modeling`（线性建模）技术。\n\n除了有助于对复杂的非线性关系进行更细粒度的分析外（即有助于确定物理风险和转型风险对微观和宏观经济，随后对个人及关联层面的财务资产负债表的直接和间接影响），\n\
  \n\n\n## 压力测试：入门\n\n一旦基础工作到位，银行建立其气候风险管理能力最简单的方法就是将其压力测试框架扩展，以纳入气候风险场景和模拟。这种扩展要求运行时间跨度长得多的场景（到\
  \ 2050 年甚至 2100 年）。如前所述，监管机构和其他行业机构正在发布前瞻性的气候压力测试，以减轻金融机构自行设计场景的负担。在这些测试中，英国银行审监管局（`PRA`）发布了迄为止最全面的气候压力测试之一。\n\
  \n### 两年探索性场景\n\n英国银行开发了 2021 年两年探索性场景（`BES`），该场景借鉴了 2019 年保险压力测试中气候场景的经验。其目标是：\n\
  \n* 帮助理解参与机构气候风险的财务敞口规模。\n* 识别气候风险给模型带来的挑战。\n* 帮助加强参与机构和金融系统气候风险的管理。\n\n`BES` 的关键特征总结在图\
  \ 9.1 中，关键方面包括：\n\n* 三种场景（或风格化的气候路径），包括物理风险和转型风险变量，这些变量被映射到宏观经济和财务变量。\n\n  ![Figure\
