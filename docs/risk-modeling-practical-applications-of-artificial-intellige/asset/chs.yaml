  \ Bank of England, 2019. Discussion Paper—The 2021 biennial exploratory scenario\
  \ on the financial risks from climate change, London, United Kingdom: Bank of England.\n\
  \n* 场景包括：\n    * 1. 早期政策行动：向碳中和经济转型较早，且根据巴黎协定发生了低于 2 摄氏度的升温事件。\n    * 2. 晚期政策行动：为了符合全球气候目标而延迟了向碳中经济的转型。\n\
  \    * 3. 无政策行动\n* 气候风险变量包括：\n    * 物理风险变量\n        * 全球和区域温度路径\n        * 具有重大敞口的地区特定气候相关危害的频率和强度（包括英国的洪水、沉降和冻结）\n\
  \        * 寿命\n        * 农业生产力\n    * 转型风险变量\n        * 碳价路径\n        * 排放路径（总量，并按地区和部门分解）\n\
  \        * 商品和能源价格（包括可再生能源），按燃料类型\n        * 能源结构\n    * 相应的宏观经济和财务变量包括：\n     \
  \   * 宏观经济变量\n        * 实际`GDP`（国内总产）——总量及按部门分解\n        * 失业率\n        * 通货膨胀\n\
  \        * 利率\n        * 企业利润——总量及按部门分解\n        * 家庭收入\n        * 住宅和商业物业价格\n \
  \       * 财务变量\n        * 主要经济体的债券收益率\n        * 主要经济体的企业债券收益率——投资级和高收益\n      \
  \  * 股票指数\n        * 汇率\n        * 银行利率\n\n作为衡量资产气候场景风险规模的一部分，参与者根据三个细粒度级别进行建模，即：企业敞口、家庭敞口和政府敞口。对于这些敞口，鼓励参与者使用如`TCFD`发布的气候披露信息来评估单个企业交易对手风险。面临的挑战在于，由于没有标准化的排放数据信息可用，如何在交易对手层级评估企业交易对手。监管机构利用这项探索性练习的结果，来评估在不同场景下金融系统的安全性和稳健性，并确定是否需要额外的资本来吸收气候风险损失。根据参与者的反馈和监管机构的分析，`CBES`练习的一项关键发现是，气候风险将拖累银行的盈利，使系统对未来的潜在冲击变得更加脆弱。在此阶段，监管机构尚未引入针对气候的特定资本附加。\n\
  \n### 金融系统绿色化网络开发的气候场景\n\n金融系统绿色化网络（`NGFS`）于 2020 年发布了气候场景，并在 2021 年发布了更新版本。基于这些维度提供了一组六场景：\n\
  \n* **有序场景**。气候风险政策较早引入并随着时间的推移变得严格。\n* **无序场景**。气候风险政策推迟，或在不同国家和部门之间存在差异。\n* **温室场景**。气候风险政策仅在某些司法管辖区实施，但全球努力不足以应对气候变化。\n\
  \n尽管气候压力测试、场景分析和模拟存在对专家判断的高度依赖挑战，但欧洲、中东和非洲（`EMEA`）以及亚太地区（`APAC`）等地区的若干金融机构正在通过收集气候数据、将其与现有的数据管理流程相结合，并进行与`NGFS`大致保持一致的早期压力测试和场景分析，以建立改进量化气候风险的能力。金融机构要么通过增加气候变量来扩用其现有的风险模型，要么创建新的气候风险模型。\n\
  \n## 企业可以从加强其分析框架开始\n\n考虑到这一切，各机构不知道从何开始也难怪了。\n\n\n\n\n\n尽管大多数中央银行已发布相关指南，指导受监管实体（包括银行）如何应用审慎实践管理气候风险，但在许多管辖区，在以下方面仍然缺乏明确性：\n\
  \n* 不同压力测试场景的关键数据和参数要求\n* 除由 NGFS（全球绿色金融网络）提供的场景外，对其他信誉且常用的场景的支持\n* 关于机构应如何进行短期和长期场景分析的细节\n\
  \n为了避免措手不及，对于机构而言，一个良好的起点是审查其能力，看其是否符合稳健分析生态系统的基础（图 9.2）：\n\n1. 数据溯源及其管理，包括数据验证和质量保证。\n\
  2. 利用定量技术和程序从数据派生洞察的风险建模平台。\n3. 风险计算和模拟能力。\n4. 与影响评估、业务决策和报告的整合。\n\n机构需要细粒度的物理风险和转型风险数据，这些数据将需要使用先进的数据质量程序来确保数据质量。高性能并行处理引擎可以适应细粒度数据需求和前瞻性风险模拟周期的频率。\n\
  \n众所周知，数据是任何分析派生结果的基础。如果没有数据的质量、验证和保证措施，结果可能是低劣。鉴于气候风险建模是一个较新的的话题，用于衡量财务影响的气候风险数据并不容易获得，特别是贷款级的信息，且质量尚不足以支持大规模、稳健的模型开发和模拟。\n\
  \n![图 9.2 创建气候风险生态系统的建议性框架。](img/c09f002.png)\n\n图 9.2 创建气候风险生态系统的建议性框架。\n\n为了更好地应对这些局限性，机构需要关注以下领域，以使其在气候风险管理工作中实现稳健性：\n\
  \n* **确保数据质量**：\n    * 建立与 `BCBS`（巴塞尔银行监督委员会）239 原则一致的稳健数据质量框架，适用于内部和第三方气候相关数据。\n\
  \    * 提供完全的透明度，例如数据来源、转换变量的方法以及地理空间级的细粒度。\n* **扩大场景覆盖范围**：\n    * 增强场景分析能力。\n \
  \   * 简化多场景管理。\n    * 纳入组合增长的灵活性，以反映业务策略和注销假设。\n    * 快速高效地应对监管压力测试日益增长的挑战，包括更长的时间跨度和扩展的风险因素。\n\
  \    * 扩展支持基于场景业务规划的能力。\n* **改进建模**：\n    * 建立更复杂的建模环境，用于开发物理风险和转型风险模型，同时丰富如预期信用损失（`ECL`）和风险加权资产（`RWA`）等模型。\n\
  \    * 确保建模环境可以扩展到现代 AI 和机器学习模型。\n* **提高效率**：\n    * 通过更简单的模型部署机制加速模型实施，以便调整和重新校准。\n\
  \        * 自动化手动流程以及对分析派生结果的调整和覆盖进行记录。\n* **加强协作**：\n    * 集中协调整个气候风险管理流程。\n   \
  \ * 确保跨企业的一致性流程。\n    * 确保气候风险成为企业风险治理框架的一部分并与现有的风险系统集成。\n\n## 实践示例\n\nAI 和机器学习在规模化复杂关系方面非常有效，而这正是气候风险方面所要求的。AI\
  \ 和机器学习的广泛应用使其在对抗气候变化的工具方面尤为有效。本节包含几个具体的示例，展示了 AI 和机器学习如何有效用于协助气候风险管理。\n\n随着云计算采纳的增加，一个例子是云计算提供商（即\
  \ Google），他们启动了一项名为 `Deepmind` 的机器学习应用，以提高其数据中心冷却的能源效率。`Deepmind` 项目采用神经网络集成来预测能源效率。这些模型捕捉了传感器观测到的温度、水泵速度以及数据中心其他参数之间的动态相互作用。该项目导致能源消耗显著减少了\
  \ 40%。\n\n另一个例子是洪涝风险的增加。由于自然灾害风险的增加，洪水风险增加是一个主要的物理风险。物理危害（如洪水）不仅可能影响与银行风险口相关的抵押品价值，还可能影响资本成本和保险的可负担性。它可能会对业务、供应链以及一个地区的长期信誉产生连锁影响。最近，一位美国城市规划师在一个智慧城市项目中使用了\
  \ AI 和机器学习，以更好地保护居民免受河流洪水灾害。通过安装传感器和雨量计实时监测水位，并利用这些数据和分析来预测洪水风险，居民可以获得主动预警，并重新规划交通路线。在这种情况下，AI\
  \ 和实时数据的使用缓解了洪水风险增加带来的社会经济影响。\n\n### 气候风险管理解决方案\n\n考虑到企业级气候风险解决方案的需求，亚太地区的一家一线银行扩展了其压力测试解决方案，通过自下而上的分析方法来量化气候风险的影响。他们采用了在有内部和外部报告支持的场景分析。气候风险模型评估了每个行业或子行业资产价值下降的影响，并量化了风险敞口水平上的气候风险。它将银行组合策略与其财务和审计流程挂钩，用于业务规划和政策决策。\n\
  \n### 亚太地区金融公司中的环境、社会和治理应用\n\n对于金融机构而言，评估交易方的碳排放在数据收集方面面临着实际挑战。在这种情况下，该公司利用 AI 和机器学习在云平台上平台上上传并处理可持续性报告及交易对手信息。来自第三方提供者的地理位置数据、场景和其他风险数据通过\
  \ `APIs` 上传。通过对交易方的房地产数据、灾害预测数据和财务数据进行建模，预测财务影响程度以及对抵押品价值的影响。这些信息随后被用于评估气候风险对对方资产负债表和损益表的影响。\n\
  \n### 可持续性投资筛选\n\n瑞典的一家分析公司创建了一套可持续性投资筛选解决方案来帮助其客户。通过其网络界面，金融投资者可以选择比其他公司更具可持续性的公司。该解决方案基于非结构化数据、机器学习算法和智能分拣流程进行投资筛选和监控。\n\
  \n\n\n\n\n具体而言，该解决方案整合了现有投资中的公司实体。该应用程序通过丹麦注册机构下载客户金融投资者正在考虑投资的每家公司的年度报告，以非结构化文本信息的形式呈现。此外，它通过机器人流程自动化（RPA）从联合国全球数据库获取可持续发展报告。在这种情况下，由于无法使用\
  \ API，因此需要使用 RPA。RPA 执行屏幕抓取，提取信息并将其存储在结构化数据集中。可持续发展报告包含了可持续发展目标（SDGs），以及人权、劳动权、环境和反腐败信息。\n\
  \n人工智能和机器学习用于通过使用新类型数据识别特定气候信息、生成 SDG 评分以及分析趋势和变化来改进这一流程。\n\n## 结语\n\n对于金融机构而言，迫切需要将气候风险纳入其财务决策和风险管理过程中。由于我们正处于向低碳经济转型的关键性十年，金融机构迫切需要在此可持续金融方面发挥领导作用，并帮助管理转型过程中的财务和非财务风险。问题的规模和复杂性要求新的思维和新技术。鉴于此，组织必须尽早建立其气候风险管理能力：采用前瞻性的气候风险建模方法，并负责任地使用人工智能和机器学习。\n\
