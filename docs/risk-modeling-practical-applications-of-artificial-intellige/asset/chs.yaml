  \ John Kotter，《领导*（马萨诸塞州波士顿：哈佛业务出版社，1996 年）。\n\n# 数据管理与准备\n\n数据已成为组织、实体和政府的重要资源。自作为一门学科诞生以来，数据管理一直。从全球金融危机中获得的一个关键教训是，银行的信息技术（IT）和数据架构无法支持。这对银行本身以及金融系统的稳定产生了严重后果。作为回应，巴塞尔监管委员会（BCBS）制定了一项关于有效风险原则的标准，编号\
  \ 239。\n\n近年来，数字化以及消费者和企业留下的数字足迹导致可用数据的快速增长。如今，风险职能运行在一个对更好的数字服务和数据驱动决策需求日益增加的世界。其他倡议，如开放银行（或基于许可的数据交换）、大量专有和开源工具的可用性以及云计算，对金融服务的价值创造产生了重大影响。随着这些倡议的增长以及高级分析和机器学习的主流使用，这些创新需要强大的数据基础。\n\
  \n尽管拥有更多数据有其好处，但也带来了更多挑战，包括获取高质量数据、网络安全以及个人数据的负责任使用。随着建模方法变得更加数据驱动，稳健的数据管理对于人工智能（AI）和机器学习的应用至关重要。\n\
  \n大数据术语是指如此巨大、如此快速或如此复杂以以难以使用传统方法处理的数据。\n\n大数据概念在行业分析师 Doug Laney 使用三个 *V* 定义其时获得了动力：\n\
  \n- **量（Volume）**：组织从各种来源收集数据，包括业务交易、第三方数据提供者、新闻文章等。过去，存储这些数据是一个问题，但云平台和数据湖上更廉的存储减轻了负担。\n\
  - **速度（Velocity）**：随着实时数据的增长，数据以不断加快的速度进入企业，必须及时处理。\n- **多样性（Variety）**：使用更大的数据意味着必须利用不同类型的数据，这些数据并不一定结构化为维度表。非结构化数据源（如传感器数据、图像和社交媒体更新）增加了数据的多样性。\n\
  \n\n\n\n\n展望未来，监管机构的预期显而易见：风险计算需要在更细的颗粒度上进行，并更加强调高质量数据的使用，特别是在使用高级算法进行风险模型开发时。\n\
  \n在风险管理中引入这些新兴数据源（例如“替代数据”）的风险在于，这些数据可能违反消费者保护法和公平贷款法。这可能导致 AI 和机器学习在使用过程中产生意之外的后果。AI\
  \ 和机器学习的意之外后果往往会被放大，因为 AI 和机器学习缺乏可解释性掩盖了底层的数据问题。深度学习算法层中隐藏的抽象性是现有数据质量方法可能力不从心的地方：组织可能转向\
  \ AI 来管理数据中的风险。\n\nAI 和机器学习的使用不能脱离现有的业务流程。为了让组织从其使用中获益，需要一种全面的企业数据管理方法，跨越采集、建模、下游流程、报告和披露的数据孤岛。从本质上，对于\
  \ AI 和机器学习而言，数据治理变得与模型治理一样重要。\n\n# 数据治理对风险职能的重要性\n\n从历史上来看，许多组织缺乏数据管理和准备的战略性方法。对于金融机构而言，遵循\
  \ `BCBS239` 原则意味着组织必须通过跟踪用于风险衡量和管理的数据的准确性、完整性和完整性，加强其数据聚合和报告能力。\n\n`BCBS239` 指南自全球金融危机后开发以来，对全球金融机构而言代表了重大的转型挑战。`BCBS239`\
  \ 指南包含四个密切相关的主题，有助于更好地更统一的风险敞口管理：\n\n1. 风险治理与基础设施\n2. 风险数据聚合\n3. 风险报告实践\n4. 风险监督审查\n\
  \n这四个主题由 11 项原则支持，如图 2.1 第 239 号标准的框架。¶ BCBS239 自全球金融危机后开发以来，对全球银行代表了重大的转型挑战。](images/c02f001.png)\n\
  \n图 2.1 巴塞尔银行标准 (BCBS) 第 239 号标准的框架。¶ `BCBS239` 自全球金融危机后开发以来，对全球银行代表了重大的转型挑战。\n\n\
  其他法规，如 `GDPR`（通用数据保护条例）和开放银行，也要求金融机构加强数据治理。\n\n无论监管预期如何，强有力的数据管理实践都是数据驱动决策的竞争优势。对于高质量的模型和决策，高质量的数据是先决条件。\n\
  \n作为第一步，组织需要建立企业级数据治理框架。随后将通过良好的数据集成和数据准备实践进行补充。\n\n然而，如果没有建立起数据准备及其管理的基础——这包括使用数据字典、标准化数据集以及数据质量和验证程序——要遵循\
  \ `BCBS239`（图 2.1）对许多金融机构来说仍然是一个挑战，许多机构仍处于完全采纳的过程中。\n\n# 数据管理的基础\n\n可以使用许多工具来探索数据并为风险建模做准备，但常见的情况是，为传统模型采用的样本设计和方法通常被认为足够让\
  \ AI 和机器学习进行严谨的应用。这假设金融机构内部已经具备数据准备及其管理的基础。不幸的是，即使在全球金融危机发生 14 年后，这些基础并不总能达到意义上的程度，特别是在支持数据驱动算法方面。\n\
  \n为了更容易实现数据准备和管理的基础，并确保数据能够以利用高级算法，需要一种支持 AI 和机器学习最佳实践的企业数据战略。让我们来看每一个基础性主题。此外，AI\
  \ 和机器学习可以用于更轻松地实现这些目标。\n\n## 主数据管理\n\n组织可以获得大量的内部和外部数据。然而，无论大小的金融机构面临的最大差距之一是数据目录（data\
  \ catalogs）这一核心概念。许多机构试图通过基于电子表格的数据集描述来填补这一空白，但随着新列或新行（如新金融产品）的添加，这些描述会迅速过时。AI 和机器学习实现的自动化可以帮助构建数据目录，该目录包含轻松搜索数据以及跨数据集搜索共享列或观测值的能力。搜索查询利用自然语言处理来提高易用性。组织可以使用程序化方法构建自定义解决方案，或利用内置\
  \ AI 技术的供应商应用程序。\n\n例如，标准数据目录为每个数据集提供以下基本元数据：\n\n* 列详细信息\n* 行详细信息\n* 数据大小\n* 数据完整性（即“缺失”字段的数量）\n\
  * 如何访问数据以及数据位于何处\n* 数据安全\n* 数据用途（可以手动添加或自动生成）\n* 数据血缘和使用历史（即使用该数据完成了多少份报告、模型和作业，以及该表的主要用户）\n\
  \n## 标准化数据集并确保数据质量\n\n对于 AI 和机器学习，风险管理团队可能会认为今天生成的所有数据概览（data profiling）指标已经足够了。\n\
  \n我们记得一位多产教授在会议上被质疑模型输出结果时说过的一句非常深刻的话：“好吧，数据就是数据！”这可能是正确的。在风险模型中源并使用的数据确实是“数据”，但重要的是，可以使用复杂的认知数据质量控制进行改进和清洗。这些措施可以根据数据的唯一性以及描述性统计数据（如平均值、中位数、众数和标准差）确定数据。当使用更先进且可重复的技术时，那种“一点猜测”就消失了，数据清洗变得不再那么手动。\n\
  \n在实际操作中，数据目录信息可以进一步扩展，通过描述性数据质量指标以及数据是否符合预期分布（例如，如果目录期望整数数据但实际上是字符串，则会被记录为不匹配）。数据质量指标对于提供数据集完整性的详细信息也极其有用。这些包括但不限于：\n\
  \n* 唯一性频率、缺失值、不匹配次数\n* 提供列信息的元数据测量，包括其类型、格式、长度和主键候选项\n* 自动检测包含个人身份识别或敏感信息的列的安全性评分\n\
  * 语义类型，通过结合数据质量算法和自然语言处理来自动生成元数据（例如，代表数值、识别码和邮政编码的列）\n\n\n\n\n\n通过自动化手动数据质量任务来确保为\
  \ AI 提供高质量数据，可以更好地解决 AI 开发、部署和管理方面面临的挑战。\n\n利用认知数据质量方法是实现数据验证过程自动化的一种方法。认知数据质量可以自动生成数据质量检查和清洗程序，从而减少对人工投入的需求。这些代码可以作为稳健且重复的数据准备控制计划的一部分执行。这些方法可以扫描结构化或非结构化的数据，并建议可能的数据质量转换方案。\n\
  \n# AI、机器学习和深度学习的其他数据考虑因素\n\n## 利用“替代数据”\n\n所谓的替代数据是指从非传统数据源收集的任何数据——例如在线数据或地理位置数据、传感器数据、社交媒体、卫星图像或网络数据。用于开发风险模型的数据越来越多地成为传统类型和替代类型的混合体，特别是在利用\
  \ AI 和机器学习的应用中。\n\n通常，传统数据源是结构化的，并存储在关系型数据库中。在某些情况下，AI 系统会采用替代数据，包括以实时交易数据、新闻推送、网页浏览、地理空间数据等形式存在的非结构化数据。\n\
  \n在使用 AI 方法处理更大数据量时，一个常见的数据挑战是时间历史长度不足以满足回回测试的需求（例如，数据采集可能最近才开始）。\n\n用于构建风险模型的两种数据类型（传统和替代数据）在表\
  \ 2.1 生成风险模型使用的数据类型\n\n| 数据类型 | 定义 | 传统 | 替代 |\n| --- | --- | --- | --- |\n| 交易数据\
  \ | | <br>* 结构化且详细的信息，捕捉客户交易的关键特征（如分期付款和现金转账）<br><br>* 存储在大规模在线交易处理 (OLTP) 关系数据库中\
  \ | <br><br>* 聚合的、结构化的，通常通过聚合为平均值等方式在较长的跨度内进行总结 | <br><br>* 粒度化，允许开放银行聚合 |\n| ---\
  \ | --- | --- | --- |\n| 内部数据 | <br>* 客户、产品和交易历史 | <br><br>* 存储在企业数据库中 | <br><br>*\
  \ 叫中心数据<br>* 数字轨迹<br>* App 使用情况 |\n| 外部数据 | <br>* 可从第三方数据提供者和公共信息获取 | <br><br>*\
  \ 例如，来自少数信用局的正面和负面信用数据<br><br>* 来自统计局的宏观经济信息 | <br><br>* 多源第三方数据（例如：征信数据、开放银行聚合、公用事业支付数据、在线平台购买数据、订阅信息、浏览历史、天气和位置数据）<br><br>*\
  \ 公共信息<br>* 社交媒体数据（在使用涉及客户同意的数据时需谨慎） |\n| --- | --- | --- | --- |\n| 非结构化数据 | <br>*\
  \ 未存储在预定义结构化格式的数据 | <br><br>* 传统上需要人工进行分析 | <br><br>* 文字文档（例如：电子邮件、网页、理赔表）<br><br>*\
  \ 多媒体内容<br><br>* 网络信息（即：所有结构、供应商、流动性、对手之间的法律依赖） |\n\n## 为 AI 和机器学习将风险数据扩展到“替代数据”\n\
  \n风险模型开发的数据准备及其管理于识别相关数据源。在某些情况下，这些来源需要证明合理性，这意味着必须证明使用数据的理由是合适的，以确保不会产生偏差或不公平的结果（图\
  \ 2.2）。\n\n重要的是，当风险模型人员选择数据源时，需要考虑关键的组织流程和政策。无论 AI 或机器学习是替代了传统风险模型，还是增强了传统风险模型，任何此类考虑都继续适用。这些考虑取决于模型的类型。无论模型是传统的还是创新的风险模型，确保所选数据源对于模型的预期用途是合适且合理的总是好的。在这种情况下，预期用途指的是模型的目标、目的以及模型将应用的环境。例如，在风险部门，通常会使用多种类型的模型。下面列出并解释了选定的某些风险模型类型，以及风险模型人员利用替代数据源的示例。例如，来自手机和公用事业的替代数据有助于许多国家没有银行服务或银行服务不足的人群。这对消费者和微型企业者获得信贷产生了重大影响，并进一步帮助历史上处于劣势地位的国家确保更公平的信贷获取：![图\
  \ 2.2 一个典型的关系风险管理数据模型。¶ 数据类别支持常规 (BAU) 风险模型，但通过替代和第三方数据源扩展到 AI/ML 模型。](img/c02f002.png)\n\
  \nFigure 2.2 一个典型的关系风险管理数据模型。¶ 数据类别支持常规 (BAU) 风险模型，但通过替代和第三方数据源扩展到 AI/ML 模型。\n\n\
  *   **决策模型，例如申请和行为评分卡。** 对于决策模型，风险模型人员可以使用交易数据作为替代数据的来源，用以预测收入损失等短期和即时事件。通过用替代源丰富现有数据，可以获得更细致的信贷风险视图，不仅使用银行数据，还使用电信数据（如订阅数据）。有关这些示例的更多信息，请参阅第\
  \ 3 章。\n*   **针对违约概率 (PD)、违约损失 (LGD) 和违约风险额 (EAD) 的信用风险参数估计。** 风险参数广泛用于监管资本、准备金、压力测试和其他内部计算。风险模型人员正在利用房产智能平台和地图应用的数据来开发位置评分。风险模型人员使用这些评分来改进消费贷款组合和中小企业\
  \ (`SMEs`) 贷款的违约概率 (`PD`) 和违约损失 (`LGD`) 模型。\n\n\n\n\n\n# 第三章：用于风险管理的人工智能、机器学习和深度学习模型\n\
  \n尽管过去几年炒作不断不断，但人工智能（AI）和机器学习已证明它们是风险管理中有用的工具。如前所述，主要原因是海量数字数据的可用性、更强大的计算能力，以及通过现有的建模工具更易地访问复杂的分析。近期，由于\
  \ COVID-19 疫情的影响，数字化渠道的采用和生成数据的增加都有所加速。而此时，金融机构正面临着数无数的内部和外部需求：\n\n*   监管需求——遵守新一轮的审慎监管和财务报告标准\n\
  *   宏观经济需求——持续的低利率和低效率对盈利能力造成了压力并增加了成本，部分原因源于合规成本的膨胀\n*   技术进步——高级分析、大数据、开放银行、基于云的和高性能计算\n\
  *   新兴风险——网络攻击、COVID-19 疫情引发的风险、气候变化以及地缘政治不确定性\n*   数字化转型——新客户需求对传统银行模式的挑战，以及更新、更敏捷的金融科技公司的崛起\n\
  \n虽然人工智能和机器学习的使用本身也面临挑战，但它是组织提高应对这些需求敏捷性的有效方法之一。人工智能和机器学习在风险管理中的一些优势包括：能够更好地、更实时地响应市场状况的变化，从自动化中获得效率效益，同时能够理解数字化产生的海量数据。\n\
  \n压力测试。这些是前瞻性的分析，用于评估不利情景如何影响金融机构资产负债表的韧性。这通常通过对宏观经济变量（如 GDP 国内生产总值、失业率和房价指数）施压力来完成。金融机构可以将其个人投资组合和粒度风险因素，使用内部定义的场景对其风险参数进行压力测试。分析可以从新闻文章和社交媒体中提取见解，以评估对地缘政治不确定性等新兴风险的情绪。对于气候风险评估，基于场景的分析利用如金融系统绿色网络（NGFS）提供的气候场景。\n\
  \n## 合成数据生成\n\n随着人工智能和机器学习的使用以及额外计算能力的可用，合成数据的使用日益增加。通常，用于训练人工智能和机器学习的可用数据存在局限性，例如时间序列中的空白、历史数据不足或粒度水平不够。模拟数据可以帮助克服这些缺陷。通常采用的方法从偏偏调整（例如用于拒绝推理的模糊方法）、重复采样（自助法）和合成少数类过采样（SMOTE），到生成市场状态的受限玻尔兹曼机。\n\
  \n某些人工智能和机器学习方法从本质上生成其自己的数据（生成对抗网络、变分自动编码器）。这些方法可以帮助对模型压力测试，从而作为模型验证的一部分提高模型的稳健性。虽然这些方法适用于高维数据，但需要注意的是，通过算法方法或近似来模拟数据，可能会引入额外的模型风险。\n\
  \n## 典型数据预处理，包括特征工程\n\n如前，人工智能和机器学习越来越多地被用于风险管理以增强传统的风险模型，因为它实现了长期以来需要的风险转型，以自动化琐碎任务并处理大量数据。\n\
  \n为人工智能和机器学习获取正确的数据通常涉及标准任务。其中几个已经得到了涵盖，例如数据质量、认知数据质量以及将风险数据扩展到“替代数据”。风险模型生命周期也经常涉及特征工程和降维。\n\
  \n特征工程有助于从输入数据自动构建一系列特征。通过使用更简单的特征，人工智能和机器学习变得更容易解释，并且可能随着时间的推移而更容易维护。良好的特征还减少了优化机器学习参数所需的精力。特征工程同样重要，因为随着输入数量的增加，高维数据在数据点往往表现出稀疏性。这意味着随着特征的增加，特征空间会增大。\n\
  \n某些机器学习算法对离值更为敏感，这意味着输出模型会向离值群体倾斜。离值在集中很难识别，且需要时间来解释。即使是训练良好的分析专家也需要时间探索数据以寻找离值，然后决定如何处理它们。它们是真实的还是由于真正的错误？由于数据中的系统错误，用于开发人工智能和机器学习的数据中可能存在离值群体，例如在发生更新时、数据文件在不同系统之间传输时，或者由于对内部政策、操作流程和程序的误读导致的数据录入错误。\n\
  \n探索离值群体之间存在的关系也是重要的，因为这些关联关系有助于解释数据集内部以及数据集之间的离值。\n\n存在一些稳健的分析技术，有助于识别离值。其中一种方法包括使用主成分分析（PCA）。另一种无监督技术是使用\
  \ T-SNE 数据可视化。可以进一步研究聚类或“离值”，以确定它们是可能被单独建模的真实子群体，还是由于数据集中的错误导致的离值。\n\n## 结语\n\n\
  为了实现有效的数据管理，组织依赖于有效的数据集设计及其现行的风险和控制自评估框架。这些包括跟踪用于风险衡量和管理的数据的准确性、完整性和完整。特征是，尽管并非总是如此，人工智能方法倾向于利用更大数量的数据，因此数据质量和数据处理变得更加突出。以目录、血缘追踪以及透明数据和模型管道形式的技术赋能者增强了数据过程的控制和可审计性。\n\
  \n为了充分利用人工智能和机器学习，可以使用自动化和可重复的过程更轻松地解决当前有效数据管理的障碍。\n\n## 尾注\n\n1. 1. Naeem Siddiqi,\
  \ *When Lending Inequities Fuel Housing Disparities* (Chicago: BAI, 2021).\n2. 2.\
  \ Samuel Cohen, Derek Snow, and Lukasz Szpruch, *Black-Box Model Risk in Finance*\
  \ (Mathematical Institute, University of Oxford, and The Alan Turing Institute,\
  \ School of Mathematics, University of Edinburgh, February 9, 2021).\n\n\n\n\n\n\
  - **挑战者模型。** 人工智能和机器学习通过识别准确率的提升，能够有效挑战现状。在人工智能和机器学习领域，可以利用多种算法。\n- **自动化复杂的风险流程（CCAR（综合资本分析与审查），CECL/IFRS\
  \ 9）。** 人工智能和机器学习可以通过机器人流程自动化（RPA）使复杂的风险流程实现自动化。\n- **近似复杂的风险计算。** 人工智能和机器学习在近似复杂风险计算方面非常有效，例如在衍生品定价。\n\
  - **改进风险数据质量。** 人工智能和机器学习可以检测并修复数据质量问题。\n- **基于风险的优化。** 人工智能和机器学习可以有效应用于在特定约束条件下进行基础优化。\n\
  - **自动化模型开发过程中的步骤。** 人工智能和机器学习可以通过自动特征工程和自动机器学习来加速模型开发过程。\n\n通常，当现有模型符合当前预期时，人们对人工智能和机器学习的抵触情绪源于这个问题：“如果我目前的模型在风险画像方面非常有效，且性能足以可能在可预见的未来持续下去，那么为什么要使用机器学习呢？”这是一种普遍情绪，特别是在那些为传统模型建立了既有流程并对其感到舒适的高度受监管行业中。是的，目前的模型可能设计得很好，能够有效应对上述上述风险参数估计的挑战——传统模型能够在某种程度上捕捉非线性相互作用。然而，存在一些隐藏的风险，更新的人工智能和机器学习方法更适合且更高效地识别这些风险。\n\
  \n例如，金融科技公司利用人工智能和机器学习提供个性化的客户体验并处理法律文件。极端信用和欺诈风险事件以及占投资组合中比例极小的其他异常，通过机器学习算法可以更有效地建模。机器学习在近似复杂风险计算方面同样有效：例如，神经网络的架构复杂，但执行起来却惊人地简单。机器学习在自动化特征工程等模型开发任务方面也同样有效。在新冠肺炎疫情期间，各机构转向机器学习以适应市场动态的变化——例如，通过更细粒度的交易数据识别还款困难较大的客户，从而检测压力的早期信号。此外，机器学习还可以有效应用于将投资组合划分为微细分。\n\
  \n创新的模型需要创新的风险模型开发和部署方法。随着自动化程度的提高风险模型生命周期的加速，特别是在当前或即将发生的外部事件（如新冠肺炎）背景下，风险经理可以更快速地响应动态市场状况。\n\
  \n此前，加速过程往往受到额外监管要求的阻碍。此类措施包括由于不同市场间经济数据差异产生的不确定性而对预期信贷损失准备金设置的缓冲区。然而，新模型开发的缓慢也可以归因于开发的人工性质和遗留流程。此外，缺乏重复和标准化框架的技术可能会导致风险模型开发周期出现瓶颈。新冠肺炎疫情提供了一个关注识别模型开发和决策周期中瓶颈的方法，这凸显了将增加自动化与人类决策水平相结合的必要性，以便机构以更具前瞻性的方式应对。\n\
  \n风险模型开发和部署的加速将使机构能够在现有人员和时间表的情况下，比目前生产环境中的模型开发并部署更多模型。更多的模型也意味着更多的自动化监控流程。它们可能还需要被更频繁地（可能是每天）审查，以快速识别任何重新校准的需求。\n\
  \n本章进一步定义了人工智能和机器学习，并包含了关于如何使用人工智能和机器学习加强风险管理的案例研究。尽管本章将提供人工智能的一些历史应用，但它包含了实际案例，以展示目前是如何被利用的。\n\
  \n## 使用机器学习进行风险建模\n\n我们大多数人最早注意到人工智能是在 1996 年，当时 `Deep Blue` 在象棋比赛中击败了卡斯波夫，随后在 2001\
  \ 年 `IBM Watson Supercomputer` 著名地击败了《危险边缘》（Jeopardy）参赛者。抛开玩笑，先进的人工智能和机器学习已广泛用于云部署中的预测分析，许多公司现在已接受其使用。\n\
  \n- 全球办公用品零售商 `Staples`，它创建了智能订购系统\n- `General Motors`，它分析驾驶者的偏好和决策\n- 全球制药公司 `GlaxoSmithKline\
  \ (GSK)`，它允许客户通过语音和文本提问\n- 英国`南汉普顿大学`，它创建一个提供在线研究模块的认知计算模块\n\n还有日益越来越多的全球系统性重要银行、国内重要银行、商业银行以及保险和金融科技公司正在试点或已利用这些技术。应用范围非常广泛：从呼叫中心的聊天机器人到用于贷款发放和欺诈检测的机器学习模型，再到用于压力测试场景模拟和合成数据。今天，对于许多机构而言，人工智能和机器学习的使用直接或间接地参与了风险管理流程、决策和/或复杂的风险计算。\n\
  \n然而，由于复杂性和准确性之间存在权衡，风险管理的重点应放在人工智能和机器学习合理的应用上。并不是每一个问题都是人工智能问题。例如，如果保留传统模型进行监管计算是有有意义的，那么就没有需要用人工智能和机器学习来取代这些模型。此外，对于数据较少的简单二分类目标预测问题，更简单的技术可以提供易行的解决方案。\n\
  \n### 拉美洲的一线商业银行\n\n一家总部位于拉丁美洲的一线商业银行涵盖零售和批发银行业务，该银行在通过获取新客户以实现宏大增长目标的同时，面临维护贷款投资组合资产质量的难题。为了有效扩大规模，该银行决定投资一个新的风险建模平台，使风险模型生命周期运营化。该平台需要足够健壮，以自动化机器学习模型的开发和部署。它变成了一个“机器学习模型工厂”，在那里建立了高度结构化和工业化的模型开发与部署流程。这些包括数据准备和模型开发过程，在这些过程中，可以为选定的市场领域开发非监管机器学习模型并将其自动部署到生产环境中。\n\
  \n\n\n\n该银行利用这一机会实现了技术现代化，同时也改进了其流程。它分析了模型构建过程中的每一个步骤，并识别了瓶颈及其产生。这使得银行能够改进流程，例如将模型数据集创建的时间从几个月缩短到几天。这传达了一个重要的教训——仅仅购买新技术而不解决现有的基础设施、人员或流程问题，是无法取得巨大成效的。\n\
  \n`Machine Learning Factory` 将模型开发和部署时间从 12 个月以上大幅缩短到不到一天。目标市场能够以更细粒度的级别进行分割，从而产生更优且预测结果更准确的模型。更快、更高效的模型生命周期允许开发和部署更多模型，使管理下的模型数量增加了五倍。这是通过改进模型流水线设计实现的，使得某些机器学习算法能够动态更新，并持续开发“挑战模型”用以竞争生产环境中的“冠军模型”。当挑战模型被认为性能更优时，它会自动部署到生产环境中。\n\
  \n这导致了贷款质量的提高，并避免了数百万美元的信贷损失。新贷款也可以更轻松地发放，使得银行的投资组合能够在多个市场中扩张。\n\n## 亚太地区的一一级金融机构\n\
  \n亚太地区的许多金融机构正积极地在非监管环境中使用机器学习。一个有趣的应用是检测指示欺诈情况的复杂交易。在某些情况下，银行依赖于专攻 AI 的金融科技公司来构建这些模型。但随着获取平台以及\
  \ AI 和机器学习无代码/低代码接口变得越来越容易，越来越多的机构正在自己开发这些模型。\n\n信贷申请欺诈的发生占人口的比例极小，不足 1%。然而，其造成的损失通常是严重的。亚太地区一家一级商业银行的一大主要担忧是，尽管欺诈案件数量很少，但绝大多数案件绕过了银行现有的欺诈规则。这是一个复杂的问题。银行付出了最大努力，包括人工干预和联系申请人，但仍有一些事件溜过了信贷和欺诈检查流程。\n\
  \n为了检测欺诈行为，银行根据已批准申请的实际历史数据，使用 `gradient boosting machine`（`GBM`）构建了预测模型。这种技术使用数千棵决策树和数百个变量作为基础生成弱预测模型，并通过评分将它们集成为最终的预测结果。\n\
  \n尽管 `GBM` 模型非常擅长检测可疑行为，但银行面临的障碍是当前的基础不够稳健，无法支持如 `GBMs` 等高级机器学习模型的部署和实施。最终，`GBM`\
  \ 的复杂性不得不完全简化为 `linear model`（线性模型），这意味着预测能力有所降低。这个故事说明了机器学习在改进预测方面的巨大潜力——但它提醒我们，在将资金和时间形式的资源投入机器学习项目之前，必须解决基础设施能力的问题。\n\
  \n## 理赔处理的流程自动化\n\n一些机构已开始使用 AI 和机器学习来开发基于 AI 的行为模型，这些模型可以支持其他应用程序以改善客户体验。其中一个模型是利用十余年的保险数据开发的，旨在寻找提问组与最具利润的\
  \ 20–40 个客户细分之间之间的隐藏路径。基于模型的见解，此前用于确定病史的 30 多个问题减少到了 7 个用于确认或否认覆盖范围的关键问题。该模型提供的预测性承保能力提供了更快、更简单且更准确的保险结果，极大提升了客户体验。\n\
  \n其他 AI 和机器学习模型也被开发用于识别排除某些医疗保险客户的关键原因，例如具有特定类型残疾的人员，以及被排除的人群在未来某个时间提出理赔的可能性是否更高。同样，这通过减少做出保险决策所需的时间、成本和文书工作，有助于更高效的承保流程。\n\
  \n该项目开发的所有模型的一个共同条件是必须具有透明性，这意味着所有的输入和输出决策都可以被轻松解释。在金融机构中，避免“黑箱”模型而选择易于解释的模型是一个常见需求。因此，可解释\
  \ AI 是任何开发项目的关键考虑因素，并在第 4 章中进行了更详细的讨论。\n\n## 应对新冠肺炎风暴\n\n与全球许多金融机构一样，亚太地区的一级商业银行在新冠肺炎期间为符合条件的小企业客户提供了还款假期。由于无法使用系统和流程衡量客户的违约风险，由于参考还款期，付款似乎是及时的，这给银行带来了风险。如果在还款假期期间损失收入，当前的行为模型无法准确反映这些事件，因为这些模型并非旨在预测短期和临时事件，例如由于大范围停产导致的收入损失。\n\
  \n突然，银行需要评估这将如何影响客户还款，为此他们转向了机器学习。银行使用了 COVID-19 疫情爆发前的数据，使用了 3 个月的历史数据，而不是遗留行为模型所使用的\
  \ 12 个月性能窗口。3 个月的较短历史期意味着需要推导出受 COVID-19 影响巨大的短期变量，而不是使用当前模型的长期驱动因素。对于短期变量，建模人员通过对客户交易数据进行高级特征工程推导出了这些变量，以确保现金流的近期变化能被算法检测和建模。重要的是，基于交易数据的特征工程使用了受\
  \ COVID-19 影响巨大的收入和支出变量。模型中使用的其他变量包括时点比率、客户群体层面的早期违约，以及与变化速度相关的驱动因素，如利用率、可支配收入、特定业务的风险驱动因素和自雇标记。银行观察到，深度较小且树数\
  \ `<100` 的 `GBM` 能够更好地预测哪些客户可能遭受收入突然损失事件，并并在 COVID-19 假期还款计划结束后可能发生违约。\n\n## 复杂风险计算的近似\n\
  \n与其他复杂的风险计算一样，预期信贷损失计算通常作为批处理后台过程运行。会对一系列场景计算前瞻性的边缘损失，将其折现为现值，并根据场景概率进行加权。如果违约概率自发放以来显著增加，则该贷款被识别为\
  \ `stage 2` 并确认其寿命损失。如果没有，则将 12 个月的损失作为预期信贷损失准备金。\n\n\n\n\n在决定新的贷款之前，这种情景下的预期信用损失（expected\
  \ credit loss）是多少？这可以使用机器学习来近似。机器学习的益处在于，它可以在贷款发放时实时提供预估的预期信用损失信息，从而做出更好的决策。\n\n\
  ## AI、机器学习和深度学习的定义\n\n尽管我们已经讨论了 AI 和机器学习在风险管理中的实际案例，但了解 AI 和机器学习的定义以及所使用的主要类型也同样重要。\n\
  \n### 人工智能\n\n1950 年，著名的英国数学家艾伦·图灵（Alan Turing）提出了一个问题：“机器能思考吗？”\n\n随后的 1955 年，美国“人工智能之父”、计算机科学家约翰·麦卡锡（John\
  \ McCarthy）在准备一个探索如何让机器像人类一样推理、能够抽象思维并解决问题的会议时，首次创造了 `artificial intelligence`（人工智能）这一术语。\n\
  \n通常情况下，AI 被用来描述能够思考、学习并对环境刺激做出反应的计算机系统。重要的是，与人类智能一样，AI 计算系统随后也可以对这些刺激做出反应并创建自己的目标。\n\
  \n让我们通过一个纯假设的“回形针极大化器”情况来进一步巩固对 AI 的理解。\n\nAI 已经深度融入社会，并被我们大多数人每天使用，即使我们并未察觉。AI\
  \ 的广泛可用是对麦卡锡遗产的进一步致敬。麦卡锡留给我们的不是关于机器和智能的理论集合和探索性问题，而是“列表处理”（`LISP`），这是自然语言处理（NLP）功能的首选语言。\n\
  \n支持 LISP 的 AI 系统的一些优秀现代例子，包括 iPhone 中的 Siri 或 Amazon Alexa 中使用的语音识别技术，这些技术允许移动设备解释人类语言的要素元素以返回答案。\n\
  \n### 机器学习\n\n机器学习是由阿瑟·塞缪尔（Arthur Samuel）在 IBM 开发 AI 的极早期创建的。塞缪尔创建了一个程序，能够学习函数参数，以评估在游戏期间棋盘上国际跳棋子的位置。\n\
  \n回到机器学习的定义，它是 AI 的子集。在过去的几十年里，它已经成熟成为一门学科，专注于使用借自统计学和概率论的模型和方法来解决可解决的实际问题。\n\n\
  本质上，机器学习指的是机器从数据中学习并在无需人工干预的情况下不断提高其性能的能力。\n\n#### 监督学习\n\n监督学习是指机器学习使用带有目标变量的学习方法来做出预测。\n\
  \n* 梯度提升机 (`GBM`）\n* 随机森林和决策树\n* 朴叶贝斯分类\n* 支持向量机\n* 集成方法\n\n作为监督机器学习在风险管理中应用的示例，如\
  \ `GBM` 和随机森林等机器学习算法已用于决策科学应用，以提高准确性，并在更大、更高维的数据集上表现良好。\n\n### 梯度提升机\n\n梯度提升是一种用于回归和分类问题的集成方法。它遵循提升方法，将一组模型（弱学习器）组合成一个复合模型（强学习器）。梯度提升使用回归树进行预测，并通过通过在残差上拟合模型来迭代构建模型。它通过允许目标函数的优化来实现泛化。\n\
  \n##### 随机森林\n\n随机森林是树预测器的组合，每棵树都取决于随机选择的模型开发数据（或训练数据）样本（或子集）。\n\n#### 无监督学习\n\n\
  无监督学习是机器学习的另一类别，但与监督学习不同，它使用未标记数据集进行知识发现。因此，无监督学习算法不包含目标变量。以下方法使用算法构建对数据的理解，允许机器学习自识别数据中的模式：\n\
  \n* 聚类\n* 奇异值分解\n* 独立成分分析\n\n#### 强化学习\n\n强化学习不同于监督和无监督学习，因为它模拟了“代理”（一种理解如何根据过去的正负面经验做出决策的实体）通过响应奖励刺激的寻求目标行为来学习的方式。\n\
  \n当人类可以指定目标，但不确定最佳路径时，强化学习效果良好。\n\n### 深度学习\n\n到为止描述的机器学习方法具有局限性，因为它们依赖程序员来确定哪些信息对于实现预设目标的决策是有用的。\n\
  \n更具扩展性的机器学习算法——`deep learning` 则并非如此，其性能依赖于大量数据来更准确地构建模型。\n\n深度学习性能不会随着数据规模增加而恶化的原因是因为算法能够通过识别数据中的结构来独立学习（图\
  \ 3.1）。它随后关注这些结构的部分以实现目标。\n\n为了模拟大脑生物神经网络的复杂性并创建深度学习模型，人工神经元像生物细胞一样工作，接收一组输入（`x`）或脉冲，每个脉冲都被分配一个特定的权重（`w`）。神经元随后在每个已加权的输入上计算多个函数（`y`）。![图\
  \ 3.1 深度学习是监督机器学习中最复杂的形式。它可以扩展，因为随着用于训练的数据量的增加，没有性能限制。图中还显示了其他监督和无监督机器学习算法/技术。气泡的大小表示了其相对于每个象限内其它元素的复杂性。](img/c03f001.png)\n\
  \n`图 3.1` 深度学习是监督机器学习中最复杂的形式。它可以扩展，因为随着用于训练的数据量的增加，没有性能限制。图中还显示了其他监督和无监督机器学习算法/技术。气泡的大小表示了其相对于每个象限内其它元素的复杂性。\n\
  \n一个经典的挑战是过拟合。神经网络可能会出现过拟合，即算法产生的模型在训练样本上每次都表现完美，但在实践中会失败。当使用的参数过多而训练数据点不足时，就会出现过拟合问题。\n\
  \n加权输入的计算方式取决于所使用的激活函数类型。激活函数是一种充当传递函数的数学变换：它将输入信号翻译为输出信号。常用的激活函数有：\n\n* 线性的恒等函数。用于训练的参数值不改变，其范围可能不受限。\n\
  * Sigmoidal 函数是 S 形的，如逻辑和双曲正切（或 `tanh`）函数，产生范围在 0 到 1 或 -1 到 1 之间的边界值。\n* Softmax\
  \ 函数是多个逻辑函数，是逻辑回归的广义表示，强制使其值和为 1。\n* 值函数是钟形函数，例如高斯函数。\n* 指数函数和倒数函数受限于 0 和 1 之间。\n\
  \n\n\n\n\n线性激活函数对每个加权输入进行线性组合，而像 sigmoid 函数这样的非线性激活函数则将加权输入的之和代入逻辑函数中。例如，在学习时，sigmoid\
  \ 逻辑函数最初近似于一个指数方程。请注意，sigmoid 逻辑函数的这些内在特性不要与第 8 章中讨论的机器学习优化相混淆。此外，对于 sigmoid 神经元，返回的值在\
  \ 0 和 1 之间，并取决于求和的加权输入。例如，如果加权和为负数，则返回的值接近“0”。尽管存在局限性，但 sigmoid 神经元的使用频率比线性神经元更高，因为生成的算法在比较之下通用得多。\n\
  \n神经元也是人体整个神经系统的构建模块，接收来自外部环境的感官信息，并向肌肉发送指令等许多其他已知功能。\n\n### 人工神经网络\n\n深度学习算法中的人工神经网络的创建方式类似于生物神经网络，因为其创建依赖于许多相互作用：从输入数据、许多神经元之间的交互，到从神经网络响应生成的输出。深度学习算法由于类似于层结构的神经网络网络而变得更加复杂。输入层的神经元连接到实际输出或问题的答案，它们不需要相互连接；而输出层的神经元则相互连接并直接接收输入数据。该网络可以是前向的，即输入层神经元与输出层神经元之间没有连接；也可以是递归的，即输入层和输出层之间存在连接。\n\
  \n在输入层和输出层之间可能存在隐藏层。隐藏层本身是网络发挥神奇力量解决问题并推导出输入数据特征的地方，这些特征被提取以学习并导出输出。从技术上讲，隐藏层涉及某种类型的额外转换，但不需要额外的参数。有趣的是，隐藏层是深度学习中“深”这一层面的来源——具有许多隐藏层的神经网络被认为是“深”的。![图\
  \ 3.2 带有隐藏层的人工神经网络架构图。](img/c03f002.png)\n\n`图 3.2` 带有隐藏层的人工神经网络架构图。\n\n*   输入层和第一个隐藏层\n\
  *   当多个隐藏层时，从一个隐藏层到下一个隐藏层的连接\n*   最后一个隐藏层和输出\n\n### 自动化机器学习\n\n现在已有提供自动化机器学习（AutoML）的平台。这些平台为各种算法提供了预开发的模型模板。这允许预定义的模型流水线针对训练数据集并行运行，并自动执行、训练和评估每个模型的预测准确性，且只需要极少的人工干预。当建模者不确定算法选择时，AutoML\
  \ 非常有用。\n\n总的来说，AutoML 通过评估不同的模型流水线来找到针对数据集的最优预测模型，从而减少建模者需要做的假设，以便开发出最拟合数据集的最佳预测模型。模型流水线可以基于模板，这些模板可以包含数据处理、应用监管约束以及检查模型结果的偏差和公平性。此外，由\
  \ AutoML 生成的模型仍需要审查和证明，包括解释其解释和决策都是公平、安全且透明的。我们在第 4 章和第 5 章中解释了这些内容。\n\n### 机器人流程自动化\n\
  \n一旦机器被教会解决问题，其生成的逻辑就可以用于机器人流程自动化（RPA）。当机器能够执行业务流程时，RPA 这种技术就实现了自动化。在某些情况下，RPA 能够降低成本。\n\
  \n### 总结\n\nAI 和机器学习在全球范围内迅速发展。然而，应该注意到，在某些国家其采用速度较慢。\n\n### 备注\n\n1.  1 IBM Watson,\
