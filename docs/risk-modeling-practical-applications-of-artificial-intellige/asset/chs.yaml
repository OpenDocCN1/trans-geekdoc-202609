  \ 机器学习的部署、实现与决策制定\n\n正如我们在之前的章节中所建立的，问题不在于人工智能和机器学习是否具有变革性潜力——这是不而易见的——而在于如何以伦理、负责任且可持续的方式来运营它们。\n\
  \n这些模型提供的机遇是广泛的：更高的准确性、对大数据的更深洞察，以及自动化带来的效率提升。无论人工智能或机器学习在实验室中看起来多么完美，只有在部署到现实世界时它们才能产生价值。\n\
  \n随着算法复杂性的增加，部署正成为组织面临的日益严峻的障碍。根据 Gartner 2021 年的一份报告，只有 53% 的 POC（概念证明）模型离开了实验室，而且这一过程平均需要\
  \ 9 个月。今天生产环境中人工智能和机器学习数量较少的原因之一是与遗留环境相关的局限性。从设计上来说，这些系统并不是为了较新的人工智能和机器学习设计的。\n\n\
  许多组织已经建立了与遗留环境相关的流程。虽然遗留系统是主流的，并且对于现有模型来说已经达到了可以运行的操作水平，但它们并非没有挑战——正如下一节所解释的。部署缓慢的原因之一是，历史上，风险模型的开发和部署是在物理和逻辑上都分离的系统中进行的。用于开发和生产的不同系统通常具有不同的节奏，并且通常使用不同的编程语言。\n\
  \n无法大规模部署人工智能和机器学习开始在整个分析价值链中产生瓶颈。由于模型被困在数据科学项目中，人工智能和机器学习通过为生产环境决策贡献而产生的业务价值无法实现。\n\
  \n该领域创新的主要驱动力是企业数字化转型。它从根本上改变了包括金融服务在内的组织与其客户和其他利益者互动的方式。为了满足超个性化和全天候服务的期望，决策变得更加数字化、相关且实时。通常，数字化转型努力的目标不仅是提供数字渠道，还在提高运营效率、敏捷性和速度，将新的数字服务和产品推向市场。\n\
  \n## 典型的模型部署挑战\n\n\n\n\n如前所述，创新的关键驱动力是组织的数字化转型目标。全球趋势是金融服务机构通过结合本地和云端架构来实现其技术基础设施的现代化，从而产生更加开放的生态系统，以及开发人员与运维人员之间更紧密的合作。例如，现代基础设施已从物理服务器演变为云原生或混合架构（后者是本地环境与公云的结合）。此外，新应用的开发过程和管理已从传统的瀑布式方法演变为敏捷方法，而重大更新的部署也从偶尔的升级（每年一次或两次）进展到遵循持续集成/持续开发范式的软件应用进行更新部署。\n\
  \n正是在这种具有更高分布性和复杂性的环境中，现代风险模型在生产环境中被开发、部署和维护的。\n\n在实现精简和自动化部署方面存在的这些瓶颈不仅限于人工智能和机器学习——这些问题也适用于传统的统计模型，但鉴于其复杂性和自学习特性，使用人工智能和机器学习往往会加剧部署方面的挑战。基于此，让我们来审视组织在模型部署方面所面临的关键挑战。\n\
  \n### 缺乏结构化的部署流程\n\n分析项目在大多数组织中通常以孤岛模式进行——这反映了数据是如何根据每个内部部门进行组织的。这导致了碎片化分析倡议和能力的形成。这也意味着分析倡议的治理和结构化被留给每个部门自行负责，导致模型部署周期变长，且缺乏一种标准化的企业级分析项目方法。\n\
  \n另一个障碍是开发环境与部署环境之间的分离。在某些情况下，组织采取了实验性的分析方法，这意味着模型开发是以随性的方式进行的，而不是遵循为生产环境简化部署而设计的标准化流程。由于由于模型逻辑、输入数据的规范不正确或操作系统的局限性（例如，某些生产系统无法处理非线性变换），模型往往无法成功部署。\n\
  \n许多组织正在积极寻求有助于模型开发和部署过程集中的技术能力。`SAS` 平台引入了这种能力，允许组织定义和跟踪用于模型生命周期管理的自定义工作流。图 6.1\
  \ 展示了如何将端到端流程结构化为一系列用于开发、验证和批准模型的任务。\n\n![图 6.1 简化的模型生命周期管理工作流。](img/c06f001.png)\n\
  \n图 6.1 简化的模型生命周期管理工作流。\n\n### 手动重编码复杂模型的需求\n\n如上所述，由于模型通常在孤岛中开发，需要将模型逻辑从一个应用程序系统翻译到另一个系统。以一个假设的例子来说，后台可能使用自定义软件应用程序进行统计建模，以开发新的损失预测模型。该模型需要在常规月度减值计算过程中应用，还需要在前台系统中用于为新的商业贷款定价。这需要将模型逻辑翻译到用于月度减值计算的系统中，以及翻译到信贷分析师在构建新交易时使用的前台系统中。这是一项挑战，因为它增加了操作模型风险（例如，翻译过程中的编码错误可能导致减值金额不准确）、延迟了模型为组织提供价值的时间（因为重编码新模型需要时间），并且在需要更改模型时缺乏进行模型更改的灵活性。\n\
  \n通过遵循“一次构建，随处部署”方法的一致封装算法代码和数据，可以避免低效、重复和手动的部署任务（图 6.2）。此外，它还提高了模型部署的可扩展性和敏捷性。\n\
  \n![图 6.2 直接部署到批处理。](img/c06f002.png)\n\n图 6.2 直接部署到批处理。\n\n### 管理多种分析工具和编程语言\n\n\
  近年来，随着开源技术的快速发展，风险模型建模人员具有更大的灵活性，可以接触到各种建模技术，并获得开源社区论坛的支持。对于负责管理新风险模型部署的 IT（信息技术）部门来说，需要了解多种不同的编程语言。无论模型开发语言如何，针对一系列风险模型遵循相同的标准化流程（图\
  \ 6.3）的单一部署方法为模型开发人员的编程语言偏好提供了灵活性。\n\n### 签字与批准\n\n为了将新的风险模型投入生产，需要来自内部（有时是外部）利益相关者的适当签字、文档记录和批准。将新模型纳入“在线”生产系统可能需要额外的技术批准和文档记录。模型部署以及模型在生产系统中的持续维护受治理框架的约束，包括建立必要的模型应急计划。\n\
  \n![图 6.3 标准化的模型开发和部署流程。](img/c06f003.png)\n\n图 6.3 标准化的模型开发和部署流程。\n\n### 采用敏捷实践进行\
  \ ModelOps\n\n在软件开发和部署中使用敏捷实践取得的成功和熟练，导致这些实践在开发和部署分析模型中也越来越受到采用。实现敏捷实践的关键在于根据组织的特定需求使用适当的技术。正确的技术能够实现软件高效可靠的部署、提供用于改进的快速反馈，并允许进行更多的实验来测试新想法——这些都是敏捷方法的关键目标。\n\
  \n同样，组织也希望在分析模型上实现这些目标。然而，分析模型不仅仅是代码——它们依赖数据、有精确的监控要求，并用于驱动关键业务决策。正因为这些差异，仅采取 IT\
  \ 驱动的敏捷方法会面临挑战，因为为软件开发设计的有效工具对于分析模型来说是无效的。因此，如果组织要采用针对模型的敏捷实践（也称为 `ModelOps`），它必须能够设计一种包含适当分析工具的流程，这些工具能够与现成功的敏捷软件开发实践相结合。\n\
  \n## 部署场景\n\n如何部署模型取决于模型输出如何被消费。部署场景的选择涉及在模型结果的使用背景下，处理模型所需的特定基础设施需求。通常，这些场景类似于以下类型。\n\
  \n### 在批处理中部署模型\n\n\n\n\n批量处理（图 6.2）是部署许多风险模型的常用方法。一段时间内收集的大量数据可以在方便时进行批处理。这种方法对于对时间不敏感的用例是一种非常高效的模型评分方式。通常，批量部署所需的基础设施比实时部署所需的简单。例如，为了对额度增加审批进行每月评分，该流程将从源系统提取数据，并应用数据转换、模型评分和其他后处理逻辑来计算模型输出（包括预授权的额度）。批量处理的主要优点之一是可以规划计算资源。它可以被用于定期处理，或调度在低峰期运行：\n\
  \n* 为对时间不敏感的业务决策生成模型输出。\n* 在评分前，积累一段时间的数据输入。\n\n## 实时部署模型\n\n在当今世界，社会已经习惯了瞬时响应的服务和系统。在这种情况下，模型输出具有时间敏感性，通常要求按需可用。\n\
  \n金融机构在提供实时服务和风险决策方面的竞争日益激烈。在这种情况下，风险模型必须实时部署。例如，对于新贷款审批，根据输入数据立即生成客户的风险评估，以决定批准还是拒绝申请。\n\
  \n另一个例子是欺诈检测与预防。金融机构通常拥有基于历史可疑交易开发的欺诈检测模型。这些系统根据客户和交易信息的组合对每笔新交易进行评分，以发现可疑活动。由于目标是阻止欺诈交易被处理，这些模型需要提供实时答案：\n\
  \n* 用于业务决策的模型输出具有时间敏感性。\n* 模型输出在交易级生成。\n* 模型输出速率必须尽可能接近数据输入速率。\n\n现代基础设施正在演进，我们看到模型在批处理或实时应用中的部署上存在差异。\n\
  \n在某些情况下（主要针对批量部署），模型逻辑可以部署在数据库内部执行，减少对数据移动的需求，并提高评分过程的速度和效率。\n\n金融机构还越来越多地采用云微服务架构，将模型作为分析服务部署在容器中。通过这种方式，模型以尽可能轻量的方式部署在云端。容器软件管理操作系统，并可以通过\
  \ `API` 端点轻松访问。此选项同时支持批量和实时部署场景。\n\n接下来我们将解释风险模型的三个部署选项：数据库内部署、部署到轻量级容器、或直接部署在业务决策工作流中。\n\
  \n## 数据库管理系统中的模型部署\n\n随着数据的爆炸，大型数据集通常存储在数据库管理系统中。为了减少数据移动的需求，现代技术允许将数据准备、模型逻辑和决策逻辑部署在数据所在地，而不是将数据移动到计算环境进行处理。这样做的好处是减少了系统间传输数据的输入/输出、更好的性能以及分析处理所需的更小的内存占用。\n\
  \n## 模型部署到轻量级容器\n\n模型也可以部署为轻量级容器。在这种情况下以及通常情况下，容器通过 `API` ，允许从更广泛生态系统的任何地方访问。随着软件应用程序作为容器部署的日益普及，这种方法也被引入模型——这对于开源模型特别有效，因为在容器中运行可以更容易更容易管理模型的包和依赖项。\n\
  \n将模型放入容器使其成为组织在云端运行高效分析负载的理想选择。容器模型允许组织根据业务需求灵活扩展运行模型的基础设施。模型容器部署可以适用于批量和实时范式，因为容器可以扩展以满足计算需求——例如，每月（批处理）或当更多用户从实时\
  \ Web 应用请求模型输出时（实时）。\n\n此外，在云架构中，模型容器化可以极大简化模型与其他应用程序的集成。作为容器的模型与其他软件应用程序由相同的容器编排工具和\
  \ CI/CD 基础设施管理，本质上将其作为分析微服务进行管理。\n\n## 业务决策工作流中的部署\n\n模型的输出可以预测概率或预测数值的形式存在。虽然这些结果具有参考价值，但通常需要与业务规则相结合，以交付特定的业务结果（图\
  \ 6.4）。\n\n![图 6.4 模型部署到决策策略。](img/c06f004.png)\n\n图 6.4 模型部署到决策策略。\n\n在欺诈检测的情况下，孤立的欺诈模型会产生交易欺诈的预测概率。然而，需要与后处理决策逻辑进行集成。例如可以将交易金额和欺诈概率结合以计算预期欺诈金额。预期欺诈金额有助于优先对标记的交易进行调查。\n\
  \n通过与决策工作流和业务逻辑集成，才能从分析模型中提取真正的业务价值。具有自动化集成技术能力的组织将更高效地实现人工智能和机器学习的投资回报。\n\n## 案例研究：全球性银行的企业级决策\n\
  \n全球最大的银行之一选择为未来加强其数字化能力。他们希望为客户提供跨业务线的无缝体验：信贷风险、催收和欺诈检测。该平台支持他们的数字化转型目标，提供一致且具有情境的客户旅程。此外，在价值证明期间，它提高了信贷决策的速度（直通处理\
  \ STP 率从 60% 提高到 75%），而此前其抵押贷款组合平均需要六个月部署的新模型现在可以在几周内完成。同样，为其消费贷款组合部署新机器学习模型的时间从几周缩短到了几天。\n\
  \n## 实际考虑因素\n\n### 以终为始\n\n在回顾第 3 章所示和图 6.5 中展示的风险模型生命周期时，每一步都会影响模型的部署。例如，流程的第一步是模型开发项目的启动。首先，逻辑上应该是：模型将在哪里部署？模型输出将如何被消费？用户多久以及何时需要模型输出？\n\
  \n其次，模型的数据准备和转换将形成评分逻辑的一部分。逻辑上应该是：需要哪些数据源来准备数据并对模型评分？\n\n\n\n\n第三，请记住，通常情况下，AI 和机器学习算法在开发阶段需要大量的计算能力，但在进行评分时可能出奇地轻量（例如，用于函数近似的神经网络）。\n\
  \n此外，建模后的过程（包括决策逻辑和对模型定期监控的反馈）全都是影响部署易用性的设计决策。接下来我们将描述定期、持续模型监控的关键考虑因素。\n\n![图 6.5\
  \ 在法律、伦理和监管约束下的风险模型生命周期中的步骤。](img/c06f005.png)\n\n图 6.5 在法律、伦理和监管约束下的风险模型生命周期中的步骤。\n\
  \n## 持续模型监控\n\n传统上，金融机构对风险模型建立了标准的监控流程。风险模型通常受监管合规性，需要定期的性能跟踪。\n\n随着风险模型数量的不断增加，金融机构部署的建模方法的复杂性也日益提高。这在采用\
  \ AI 和机器学习时尤为明显，因为这通常需要更高的透明度。随着新数据的可用，AI 和机器学习通常会动态更新，这要求对模型性能进行动态监控。通过跟踪许多指标来确保模型按预期运行，包括数据质量、模型漂移、可解释性、模型稳健性和偏差。\n\
  \n通过自动和动态地跟踪性能（包括冠军模型和挑战者模型），风险部门将能够更好地地主动发现可能导致模型故障的问题（图 6.6）。\n\n## 模型编排\n\n模型生命周期的管理（特别是在部署后）至关重要。如果模型开始漂移，在新的数据上重新训练需要多长时间？如果需要用新的冠军模型替换，需要采取哪些步骤在生产环境中实施新模型？此外，随着云和容器等更新创新技术的采用，将分析作为这些系统的一部分需要一个能够仔细引导工作流从分析平台进入其他软件和\
  \ IT 环境的过程。\n\n![图 6.6 生产环境中模型的持续监控。](img/c06f006.png)\n\n图 6.6 生产环境中模型的持续监控。\n\n\
  为了确保模型生命周期可以被管理，拥有一个能够同时实现自动化和治理的编排层至关重要。自动化是实现速度的关键，无论是确保模型可以重新训练、尽可能快速部署，还是实施到业务规则中。同时，治理对于确保由正确的利益相关者做出正确的审批是重中之重。通过允许审批和用户输入，组织可以确保其模型生命周期过程是透明且可审计的，并允许业务用户在模型从分析平台移动到由\
  \ IT 主导的生产环境时与 IT 进行更有效的协作。\n\n## 结语\n\n无法大规模部署 AI 和机器学习会导致分析工作出现瓶颈，并意味着模型意图产生的价值无法实现。当一个新模型被困在数据科学项目中时，它会削弱更先进、更复杂模型的“惊艳”效应。\n\
  \n好消息是，近年来模型部署技术取得了进步，这意味着 AI 和机器学习可以直接或通过 API 更好地集成到现有服务和前端应用程序中。\n\n## 脚注\n\n\
  1. 1。Melissa Davis, *Gartner: Accelerating AI Deployments—Paths of Least Resistance.*\
  \ (Framingham, MA: IDG Connect, 2021)。\n\n# 第 7 章：扩展机器学习验证和持续监控的治理框架\n\nAI 和机器学习的益处并非没有风险的。内部和外部利益相关者理智地担心典型的挑战，范围从\
  \ AI 和机器学习的伦理使用到解释算法工作原理的能力，再到决策中传播偏差的风险增加。然而，最困难的挑战之一是创建一个合适且稳健的持续性能监控框架，使其能够适应并响应\
  \ AI 和机器学习日益增加的模型风险。在保持资源投入不变的同时维持低成本是许多风险管理人员关注的重点。建立监控框架的影响超了模型风险管理的监管和生产前方面。通常情况下，AI\
  \ 和机器学习监控框架应该熟练地处理：\n\n*   **模型退化。** AI 和机器学习的退化速度往往比传统的和经过历史调优的统计模型更快。\n*   **偏差预测。**\
  \ AI 和机器学习倾向于识别数据中隐藏传统模型无法察觉的复杂和非线性模式。这些模式可能会导致偏差的决策，或隐藏损坏的数据。在某种程度上，机器学习需要免受数据中偏差的影响，因为这些偏差可能导致其所参与的不公平决策。决策的其他部分包括策略规则、业务角色和人工手动干预。所有导致决策的方面（不限于模型）都可能导致偏差预测。\n\
  \n通常情况下，风险模型（包括用于日内或近实时计算的模型）是在具有现有且既定治理实践的环境中使用。随着使用更先进的技术和方法（如 AI 和机器学习），模型风险往往更高（如下一节所述），因此对这些模型进行近实时性能跟踪变得至关重要。\n\
  \n稳健的 AI 和机器学习治理框架将 AI 系统和机器学习的使用监督与组织的战略和价值观对齐。AI 治理是定义策略和程序的策略，以建立 AI 系统和机器学习安全开发、部署和使用的问责机制。这些方面是康威律的核心原则——一个组织的效率缺陷总会体现在其产品中。因此，AI\
  \ 和机器学习治理反映了组织的思维方式。\n\n2019 年，OECD 定义了一套 AI 原则，旨在保护人权的同时促进使用 AI 进行创新。\n\n除了 AI\
  \ 治理监管外，2021 年，美国联邦贸易委员会定义了对负责任使用 AI 的期望，特别是在消费者公平结果的背景下。\n\n2021 年，货币监察局更新了其模型风险管理标准，以考虑到\
  \ AI 和机器学习的使用。\n\n从某种意义上说，所有模型都是现实的表示，其本质上会有某种程度的不确定性和不准确性。越早地了解模型的特性和局限性，模型验证功能在管理和监控生产中的模型时就越有信息。\n\
  \n\n\n具体而言，在金融服务领域，基于原则的治理框架将促进模型的恰当使用、适当的责任分层和透明度，并确保风险模型在开发、部署和使用方面的一致性。\n\n##\
  \ 建立适当的内部治理框架\n\n凡用于决策的模型（无论是传统模型还是 AI 和机器学习），组织都应该关注基于错误或误用模型而做出的决策可能可能导致的负面后果，并应通过积极的模型风险管理来应对这些后果。这些负面后果可能包括限于潜在的资金损失和声誉风险。\n\
  \n关于 AI 和机器学习治理的理念在行业机构中引起了广泛讨论。这部分源于广为人知的 AI 模型失败案例（例如，聊天机器人 `Tay`）以及对自动化系统运行方式的误解，人们对负责任使用\
  \ AI 和机器学习存在普遍的不信任感，这进一步凸显了对更好模型治理的需求。\n\n大多数组织已经为其传统风险模型建立了强大的治理框架。根据监管指南，只要有适当的控制措施，现有框架就可以扩展到\
  \ AI 和机器学习。\n\n根据货币监理员办公室（`OCC`）在 `SR11/7` 中的规定，一个有效的模型治理框架包括稳健的模型开发、实施和使用，以及有效的验证、健全的治理、政策和控制。\n\
  \n`OCC` 强调，模型风险随着模型复杂性的增加、输入增多以及对模型假设不确定性的增加而增加。由于潜在使用范围可能更广，一旦模型出错，其潜在影响也会更大。\n\
  \n涉及到有效的模型风险管理和监管机构的预期，组织必须证明他们对模型不准确性、意外后果及其影响以及缓解措施的理解。\n\n通常情况下，根据背景和风险模型的实质性（materiality）来调整治理水平是有帮助的。请记住，模型治理方法应与组织规模、模型重要性，以及意外后果发生时产生的影响保持一致。如果有额外的用户在使用某个模型，则建议重新评估该模型的重要性。在实践中，我们发现，如果一个组织仅关注集团层面的模型性能（无论是传统模型还是机器学习），那么子公司可能会被忽略，而子公司的模型重要性可能大不相同。这可能在集团层面不会产生重大的敞口，但可能在子公司层面带来重大的模型和声誉风险。\n\
  \n为了提供必要的治理和监督，对于影响高风险决策的风险模型，从外部监管机构到董事会再到高层管理的一系列利益相关者都参与了风险模型生命周期的各个阶段。除了直接参与模型生命周期的利益相关者外，适当的治理框架将进一步增强其他用户和其他消费者对模型的信任和透明度。\n\
  \n## 治理开发机器学习模型\n\n在启动 AI 或机器学习之前，要问自己一个重要问题是：“我们如何建立适当的治理护栏，以确保从实验室投入生产的模型能够继续符合用途并交付预期的价值？”正如提到的，一种方法是加强对数据、模型建立更强的信任，并将预期结果与业务目标对齐。\n\
  \n配备适当的人员、流程和政策将有助于在企业层面实现 AI 和机器学习处理的标准化。由于许多模型开发步骤可以自动化，与传统的统计模型相比，AI 和机器学习通常更容易开发，但它需要更高水平的监控，且根据用例的不同，AI\
  \ 和机器学习需要更频繁地进行监控。\n\n通过 AI 和机器学习治理，在整个生命周期中都可以提出关于“使用”的问题：\n\n*   如何评估机器学习的概念性完备性？\n\
  *   特征是如何生成和选择的？\n*   是否可以用技术性和非技术性术语解释模型及其关键驱动因素？\n*   基准（benchmark）是否具有解释性？\n\
  *   我计划如何确保机器学习保持符合用途？\n*   如果模型出现显著恶化，多快可以更换？\n\n这些以及其他问题记录在 `Figure 7.1` 中。由于这些原因，现有的治理框架可能不足以处理与\
  \ AI 和机器学习相关的增加的模型风险。\n\n正如提到的，通常情况下，使用 AI 和机器学习的模型风险往往更高。此外，事后解释性（post-hoc explainability）和解释性增加了另一层复杂性。由于数据质量差导致的模型错误风险以及延续社会或个人偏见的风险也在增加。`Figure\
  \ 7.2` 记录了上述挑战，这些挑战往往随着 AI 和学习而增加模型风险。\n\n为了更好地管理对模型治理日益增长的需求，标准的行业实践仍在演变，受到内部外部利益相关者影响力力量的影响：\n\
  \n*   促进 AI 和机器学习伦理化使用的公众压力和倡导。\n*   遵守法律法规，这些法律法规强制组织在使用 AI、机器学习以及个人数据时尊重人们的权利和利益。\n\
  \n\n\n\n-   对人工智能（AI）、机器学习和自主系统的独立审计。\n\n## 监控人工智能与机器学习\n\n机器学习与其他模型一样需要治理，而且程度更为迫切。在某种程度上，这是因为这些模型的设计旨在通过经验进行自动改进。它们“学习”的能力使其具有更高的准确性和可预测性，但也可能极大增加其模型风险，并导致基于其能够识别的数据模式而产生偏差。组织建立严谨的治理流程至关重要，这些流程能够快速识别模型何时开始失效，并对输入（数据）和输出（模型结果）定义明确的操作控制。人工智能和机器学习的动态特性意味着它们需要更频繁的性能监控、持续的数据审查和基准测试。随着模型数量的增加，需要对上下文模型清单有更好的理解并制定具操作性的应急预案。\n\
  \n即使组织已将其模型治理扩展到人工智能和机器学习，对于人工智能和机器学习的持续监控，仍有一些超出之前章节中已实施和讨论范围的进一步考量。\n\n我们在本章中已经解释过，传统上，组织拥有一标准的模型治理框架，包括对监管和非监管风险模型进行定期监控报告和审查。所有风险模型通常都要经过内部和外部验证，这需要通过性能和操作计算指标对模型进行定期跟踪。\n\
  \n随着新的监管要求随时间推移调整模型以及风险模型的数量，随着人工智能和机器学习的主流采用，建模方法的复杂性正在增加，并将持续增长。人工智能和机器学习通常是动态更新的（即更容易用用新数据进行校准），这意味着需要随时间对一系列指标进行跟踪，以确保模型运行在业务目标和合规措施预期的边界内。\n\
  \n当从下方列出的维度以及图 7.3\n\n[图 7.3 在更全面地审视模型健康状况时应考虑的人工智能和机器学习的进一步考量，包括在性能下降被测量之前识别出需要立即关注模型的措施。\n\
  \n### 模型衰减\n\n建立模型验证的既有行业实践通常包括模型性能的监控、模型输入的稳定性和模型校准。这些指标对于人工智能和机器学习仍然有效。此外，对于人工智能和机器学习，特别是持续更新的模型，有必要持续监控模型的可解释性和潜在偏差。重要的是，性能监控结果应以某种方式汇总，让用户理解问题根源所在之处，以便在上下文中审查性能结果。\n\
  \n例如，如提到的，由于其复杂性，人工智能和机器学习倾向于捕捉数据中可能暂时的关系。为了解释时间波动，必须更频繁地监控模型。\n\n模型下降通常是数据漂移或概念漂移的结果：\n\
  \n-   `Data drift`（数据漂移）发生在特征属性分布随时间相对于模型开发样本发生变化。这需要对样本数据与生产数据进行监控——当模型更新更频繁时，复杂性随之增加。\n\
  -   `Concept drift`（概念漂移）发生在市场状况或政策改变了模型解释。在模型解释改变的情况下，通常需要对开发数据重新标记并重新训练模型。可以通过评估驱动模型预测的特征之间的历史关系来衡量概念漂移。\n\
  \n### 稳定性\n\n人工智能或机器学习及基准模型的稳定性通常通过评估数据输入、群体和特征的稳定性来实现。\n\n#### 群体漂移\n\n群体稳定性指数（`PSI`）是衡量模型结果随时间保持稳定的方法之一。它是传统统计或计量经济模型的既有指标。它是一种散度指标，用于衡量两个分布（例如，当前群体和模型开发样本）之间的距离。它通常被解释为一种经验法则，也可以使用置信区间进行解释，这对于机器学习模型的持续监控可能更为合适。\n\
  \n### 特征漂移\n\n群体稳定性指数也可用于计算特征层面的散度，即特征稳定性指数（`CSI`）。它衡量了模型特征的分布与开发样本之间的差异。\n\n评估人工智能或机器学习特征稳定性的另一种方法是使用自助法（bootstrapping）或随机扰动。这可以通过子采样或随机扰动开发数据来创建\
  \ `n` 个数据集。将选择特征的算法应用于 `n` 个数据集，并创建 `m` 个特征。通过确定跨 `n` 个数据集的选特征的相似性来衡量特征的稳定性。\n\n\
  它也可以使用 t-分布随机邻域嵌入（`T-SNE`）进行计算。\n\n#### 稳健性、基准测试和回测\n\n稳健性（无论是否基于机器学习）是指模型在泛数据上的良好泛化能力。模型稳健性可以通过泛化和停止剪枝方法来提高。过拟合也可以通过交叉验证进行评估。这些测试包括基准测试、回测和稳定性评估。\n\
  \n\n\n\n传统模型可以作为 AI 和机器学习的基准。基准模型通常在与 AI 和机器学习相同的重大假设下开发。随后，可以对传统模型与 AI 或机器学习模型的稳健性和性能进行衡量和比较，以是否存在统计学上的显著差异。\n\
  \n## 可解释性\n\n传统模型倾向于使用可以直接解释的定义变量选择和模型拟合方法。例如，广义模型（`GLM`）的参数估计可以直接解释，反映了特征的贡献，因此模型从其参数估计来看具有解释性。而像梯度提升机（`GBM`）等机器学习模型的系数无法直接解释，因此它们需要替代的解释性指标。\n\
  \n### 变量重要性\n\n缺乏解释性对 AI 和机器学习来说是次优的，因为需要一种一致的方法来评估不同方法之间的变量重要性。评估 AI 和机器学习变量重要性的通用方法是拟合一个决策树来近似模型预测，以按重要性顺序识别并对变量进行排序。另一种方法是创建一个扩展了线性回归经典\
  \ `R2` 方法的参数，该参数提供了模型预测与输入特征之间关系的描述。\n\n### 部分依赖性\n\n部分依赖性（`PD`）图是一种模型无关的解释性指标，可从全局层面解释\
  \ AI 和机器学习。像 `PD` 图这样的模型无关指标被应用于监督式 AI 和机器学习。\n\n![图 7.4 变量重要性：一个示例。这里，训练重要性值对应于变量对模型成功的贡献——值越高，该变量代表预测真实原因的可能性越大。](img/c07f004.png)\n\
  \n**图 7.4** 变量重要性：一个示例。这里，训练重要性值对应于变量对模型成功的贡献——值越高，该变量代表预测真实原因的可能性越大。\n\n`PD` 图（图\
  \ 7.5）通过衡量模型预测随特征值变化而变化的方式来衡量每个特征的贡献。这是通过扰动输入数据并对整个数据的特征影响取平均来实现的。第 4 章中提供了关于 `PD`\
  \ 图的更详细描述。通过一个描述性示例，`PD` 图显示了预测估计随当前还款状态增加而增加。`PD` 图显示了输入特征（独立变量）与目标变量之间的关系。`PD`\
  \ 图有助于显示变量对预测结果的“边际效应”。\n\n### 个体条件期望\n\n个体条件期望（`ICE`）图（图 7.6）为每个观测值或子组级别分离 `PD`\
  \ 函数。它们有助于识别趋势、差异和交互作用。\n\n ![图 7.5 部分依赖（PD）图：一个示例。独立变量 x1 与模型结果条形图，在考虑了模型中其他独立变量的平均影响后。](img/c07f005.png)\n\
  \n**图 7.5** 部分依赖（`PD`）图：一个示例。独立变量 `x1` 与模型结果条形图，在考虑了模型中其他独立变量的平均影响后。\n\n![图 7.6\
  \ 个体条件期望（ICE）图的图形表示。ICE 图显示了与结果模型预测的关系。](img/c07f006.png)\n\n**图 7.6** 个体条件期望（`ICE`）图的图形表示。`ICE`\
  \ 图显示了与结果模型预测的关系。\n\n### Shapley 值\n\nShapley 值是另一种模型无关的模型解释性指标。Shapley 值通过平均所有联盟的边际贡献来计算变量贡献。这使得\
  \ Shapley 值能够控制变量交互。例如，在图 7.7 中，变量按升序排列。水平位置显示了该值的影响与较高或较低的预测相关。在这个示例中，由局部实例 `8001441`\
  \ 标记的观测值在模型训练数据中的预测值为 `0`。借款人当前的还款计划状态和额度余额贡献了预测。\n\n![图 7.7 使用内核解释器计算 Shapley 值：一个示例。](img/c07f007.png)\n\
  \n**图 7.7** 使用内核解释器计算 Shapley 值：一个示例。\n\n## 异常检测\n\n理想情况下，AI 和机器学习的异常检测系统应该具有从高维数据中收集有用特征并发现偏离正常行为的能力。自编码器可以为\
  \ AI 和机器学习设计异常检测系统，因为它们可以减少神经网络隐藏层单元的数量来降低数据维度。自编码器作为一种特征提取方法。在这里，自编码器学习“正常”数据点——训练数据中不存在异常。当自编码器进行重构时，异常数据点将失败。\n\
  \n## 偏差\n\nAI 和机器学习容易受到性能或结果偏差的影响。我们讨论了性能偏差的概念。具体来说，结果偏差是指模型输出与另一个“群体”或从模型开发数据确定的基准样本相比在统计学上存在差异。为了监控\
  \ AI 和机器学习中的偏差，使用合适的计算指标（例如人口统计学差异）来衡量结果偏差。偏差可能通过各种原因间接引入，包括内部政策变化、外部监管合规，或者一个“群体”相比另一个群体缺乏足够的观测历史。当观察到差异时，会触发审查以识别偏差产生。\n\
  \n### 模型调整\n\nAI 和机器学习通常利用先进方法来优化算法的目标函数。AI 和机器学习经常使用新的训练数据进行重新训练。风险模型需要重新训练的原因有很多，例如：\n\
  \n- **外部环境**。利率更新、系统更新和相关数据等因素会启动重新训练模型的需求。\n- **策略变化**。如果在开发期间发现模型未能捕捉业务变化或业务策略的变化，模型可能需要重新训练。\n\
  - **业务性能**。模型使用和性能的变化（例如由于新冠肺炎疫情导致的变化）可能会触发模型重新训练工作。\n\n## 合规考量\n\n全球的监管机构开始对 AI\
  \ 和机器学习的所有方面提出法规和合规指南，包括数据隐私使用、伦理指南和特定的模型风险管理框架。然而，这些法规和合规指南的深度和范围取决于 AI 和机器学习在各地区的采用率。需要关注的选定合规考量包括：\n\
  \n- 通用数据保护条例（`GDPR`）。\n- 平等信机会法（`ECOA`）——针对小企业贷款 更新。\n- `SR Letter 11-7` 函——针对 AI\
  \ 和机器学习的更新指南。\n\n\n\n\n* 欧盟委员会——制定关于人工智能（AI）的统一规则。\n* 欧盟可信 AI 指南。\n\n### GDPR（通用数据保护条例）\n\
  \n这项欧洲法律规范了欧盟联盟和欧洲经济区的数据保护和隐私法。`GDPR` 于 2019 年发布了《可信 AI 伦理指南》。为了让 AI 符合 `GDPR` 的规定，需要仔细考虑其他因素（关键问题的总结请表\
  \ 7.1）。\n\n### ECOA（平等信贷机会法）\n\n美国联邦贸易委员会（下简称 `FTC`）管理着各种消费者保护法，包括防止商业活动中出现不公平竞争方法以及禁止不公平和欺骗性行为或做法的法律。`FTC`\
  \ 长期以来一直利用其权力监管私营部门对个人信息和直接影响消费者的算法的使用。`FTC` 行使此类权力的方式之一是根据《平等信贷机会法》（`ECOA`）。`ECOA`\
  \ 帮助保护消费者获得平等的信贷机会，保护他们免受基于种族、肤色、性别、宗教、年龄和婚姻状况等受保护变量的歧视。\n\n#### 表 7.1 遵循 GDPR 指南时的关键问题\n\
  \n| 指南 | 简要说明 |\n| --- | --- |\n| 不受自动化决策影响的权利 | 仅当决策完全基于自动化处理，并且对数据主体产生法律影响或对其产生类似程度的重大影响时，才禁止其受到自动化决策的影响。然而，如果该过程是在获得数据主体的明确同意的情况下进行的，或者控制者已采取了充分的安全措施，则是允许的。在这种情况下，需要提供的安全措施包括：引入人工干预以清晰透明的方式分析并处理系统的目的、限制、要求和决策；在隐私政策中清楚地解释自动化决策，以便在处理数据之前通知客户；并获得明确同意，告知数据主体该决策是算法决策的结果，且他们正在与聊天机器人、机器人或其他对话系统等\
  \ AI 代理进行交互。 |\n| 透明化处理 | 数据主体应被告知处理的存在和目的，特别是当数据处理活动涉及自动化决策时。关于此类处理的逻辑、意义和预期后果的实质性信息应对对用户明确透明。\
  \ |\n| 删除权 | 由于为了使 AI 需要收集和整理大量数据，而导致的数据共享和数据开放，数据控制者很难确保第三方数据服务器执行了删除操作，或者需要删除的数据已从其他联合控制者或数据处理器中完全删除。\
  \ |\n| 数据最小化 | 去标识化（伪匿名化）允许在 AI 中使用更多、处理和分析更多数据。伪匿名化符合 `GDPR` 的数据最小化原则，而匿名化意味着数据主体不再是或无法被识别。`GDPR`\
  \ 促进伪匿名化作为一种适当的安全措施，以便组织在不获得额外同意的情况下重新使用数据。 |\n\n2020 年和 2021 年，`FTC` 指出，如果公司使用的算法直接或间接地通过差异性影响在信贷决策方面对受保护群体产生歧视，那么\
  \ `FTC` 就可以根据 `ECOA` 对该类行为提出挑战。此外，2020 年和 2021 年更新的指南为使用 AI 的组织提供了预期方面的见解。示例包括：\n\
  \n* **从头开始。** 组织需要寻找训练数据集是否包含对受保护群体的差异性对待。\n* **测试。** 在使用前并定期对算法进行测试，以确保它们不会基于上述受保护变量产生歧视。\n\
  \n算法的公平性可以通过考虑以下问题来评估：\n\n* 数据集的代表性如何？\n* 数据模型是否考虑了偏见性？\n* 基于大数据的预测准确性有多高？\n* 对大数据的依赖是否引发了伦理或公平性担忧？\n\
  * 算法是否弊大于利？组织应该应该自问，他们的 AI 和机器学习是否弊大于利。如果是这样，`FTC` 可能会根据《FTC 法案》第 5 条将其视为“不公平”，并对其采取强制执行措施。\n\
  \n### SR-Letter 11-7\n\n美国联邦储备体系董事会和货币监事局于 2011 年发布了名为《模型风险管理监管指导》的 `SR Letter 11-7`\
  \ 信函。该信函已成为模型风险管理的金标准，也是监管机构对模型风险管理预期最重要的声明之一。美国受监管的银行和金融机构有义务将 `SR 11-7` 原则落实到其模型风险管理框架中。\n\
  \n在美国境外，其他许多监管机构也发布了模型风险管理的监管预期，例如欧洲中央银行（`ECB`）、欧洲银行管理局（`EBA`）以及国家监管机构，如加拿大金融机构监管局（`OSFI`）和澳大利亚审慎局（`APRA`，根据审慎标准\
  \ `CPS 220` 管理和信贷风险管理审慎标准 `APS 220`）。特别是 `ECB` 在 2015 年将 `SR 11-7` 原则纳入其内部模型针对性审查（`TRIM`）。\n\
  \n`SR 11-7` 影响深远，概述了风险管理的所有监管预期，包括定义什么是模型，以及银行必须对所有“模型”实施的过程和内部控制。这有助于确保银行以控制的方式开发、实施和使用模型。`SR\
  \ 11-7` 的原则至关重要，因为所有模型（包括 AI 和机器学习）都存在因不准确或控制不当而导致损失的风险。这里的损失范围广泛，从计算不准确到开发和实施模型的成本，再到做出不公平决策带来的负面声誉影响。\n\
  \n如果没有建立定义的模型风险管理政策，各种模型开发应用带来的灵活性可能会导致组织面临严重的误用和损失。在这种情况下，还可能缺乏适当的控制和审批，导致随后的错误。有效的模型风险管理有助于提供稳健性并减少上述模型风险。\n\
  \n### 欧盟可信 AI 指南\n\n2021 年，欧盟委员会已对欧洲 AI 系统的使用进行了立法。\n\n## 进一步总结\n\n基于风险，AI 和机器学习的广泛使用意味着现有的模型风险治理计划需要扩展。但同时，重要的是理解当前模型风险管理程序的局限性，这些限制防止了从数据、模型输入、基准、稳定性、性能和决策等方面获取模型健康的全局视角。\n\
  \n\n\n今天，全球对于伦理 AI 框架的设计和部署尚未达成共识。然而，在已建立的法规和指南中，使用了与公平、伦理、问责和透明度相关的相同伦理原则。伦理 AI\
  \ 合规指南和法规的深度和广度很大程度上取决于各管辖区对 AI 和机器学习采用的成熟程度。例如，亚太地区的监管机构继续完善伦理 AI 框架，以帮助实现公平目标（例如，澳大利亚政府最近发布了《AI\
  \ 伦理框架》，香港金融管理局了以《监管科技采用实践指南》形式发布的监管指导，其中包含了“AI 治理框架”的先决条件）。\n\n## 结语\n\n随着 AI 和机器学习的使用，风险部门应该拓宽思路，扩展其性能监控框架，以便在不过度依赖人工代码的情况下实现\
  \ AI 和机器学习的透明化。通过动态跟踪一系列相互关联的类别——包括但不限于输入数据、模型衰减和模型稳健性——风险部门可以更很好地理解潜在的 AI 和机器学习局限性，并主动识别可能导致模型故障的问题。监管机构和中央银行也希望风险部门在验证\
  \ AI 和机器学习时遵守某些合规措施。我们在本章中解释了主要概念。\n\n然而，即使在缺乏 `SR 11-7` 中明确定义的模型风险管理监管预期的情况下，模型风险管理仍然应该是关注重点，因为与\
  \ AI 和机器学习相关的模型风险可能会导致量化的损失，从风险计算的不准确到开发和实施模型的成本，再到做出不公平决策的负面影响。当 AI 和机器学习在治理模型开发、部署和使用的稳健模型风险管理框架之外运行时，这些风险会进一步加剧。\n\
