    When there are only a few available assets to be distributed between a handful
    of exposures, the management of the collateral is quite simple and intuitive,
    meaning that the management of the collateral can easily be done manually.


    *   `Cost model.` This model minimizes collateral cost as well as funding costs.

    *   `Allocation model.` This can be done by for example, ranking the assets from
    lowest to highest by the cost model, or by linear programming.


    ## CONCLUDING REMARKS


    The use of AI, machine learning, and advanced analytics for optimization is a
    rapidly evolving field. In this chapter, machine learning algorithmic optimization
    was explained. These involve the use of `solvers`, the automated tuning of `hyperparameters`,
    and model training optimization using `stochastic gradient descent`. In addition,
    optimization algorithms with embedded machine learning are powerful tools to solve
    risk-specific business problems. Keep in mind that although powerful, optimization
    is mathematically complex and may involve intensive compute resources. The good
    news is that there are automated ways to apply optimization using machine learning
    that transfer some of the complexity to help streamline decision-making, so that
    risk departments can focus on the business value that optimization can generate.


    ## ENDNOTES


