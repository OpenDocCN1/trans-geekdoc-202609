- raw: "When there are only a few available assets to be distributed between a handful\
    \ of exposures, the management of the collateral is quite simple and intuitive,\
    \ meaning that the management of the collateral can easily be done manually.\n\
    \n*   **Cost model.** This model minimizes collateral cost as well as funding\
    \ costs. \n\n*   **Allocation model.** This can be done by for example, ranking\
    \ the assets from lowest to highest by the cost model, or by linear programming.\
    \  \n\n    ## CONCLUDING REMARKS\n\n    The use of AI, machine learning, and advanced\
    \ analytics for optimization is a rapidly evolving field. In this chapter, machine\
    \ learning algorithmic optimization was explained. These involve the use of solvers,\
    \ the automated tuning of hyperparameters, and model training optimization using\
    \ stochastic gradient descent. In addition, optimization algorithms with embedded\
    \ machine learning are powerful tools to solve risk-specific business problems.\
    \ Keep in mind that although powerful, optimization is mathematically complex\
    \ and may involve intensive compute resources. The good news is that there are\
    \ automated ways to apply optimization using machine learning that transfer some\
    \ of the complexity to help streamline decision-making, so that risk departments\
    \ can focus on the business value that optimization can generate.\n\n## ENDNOTES\n\
    \n1.  [1](#c08.xhtml#R_c08-note-0001).  Stephen Boyd, and Lieven Vandenberghe,\
    \ *Convex Optimization*, 1st ed. (Stanford, CA: Cambridge University Press, 2004).\n\
    \n2.  [2](#c08.xhtml#R_c08-note-0002).  Boyd and Vandenberghe, *Convex Optimization*.\n\
    \n3.  [3](#c08.xhtml#R_c08-note-0003).  Ed Hughes, Steve Gardner, Josh Griffin,\
    \ and Oleg Golovidov, *The New solveBlackbox Action in SAS® Optimization 8.5*\
    \ (SAS Global Forum, 2020). Paper SAS4494-2020. [https://www.sas.com/content/dam/SAS/support/en/sas-global-forum-proceedings/2020/4494-2020.pdf](https://www.sas.com/content/dam/SAS/support/en/sas-global-forum-proceedings/2020/4494-2020.pdf)\n\
    \n4.  [4](#c08.xhtml#R_c08-note-0004).  SAS Institute Inc., *SAS® Optimization\
