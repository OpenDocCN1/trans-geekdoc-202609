- raw: "Robust model risk management framework will collect, and make readily available,\
    \ information that consistently and reliably enforces fair lending laws. This\
    \ can be further extended to financial institutions having the ability to recognize\
    \ and remediate the potential for discrimination above and beyond regulations.\n\
    \nIn addition, financial institutions can enforce constraints or rules on input\
    \ data, ensure that the training data does not have protected characteristics,\
    \ apply data quality checks to prevent data measures from contamination or influence\
    \ by subjective errors, and document and validate the methods used to debias the\
    \ data.\n\n### Vulnerability\n\nToday, the identification of customers that are\
    \ “vulnerable” is not regulated in all given authorities. Despite this, understanding\
    \ that customers are more vulnerable to disruption in the customer lifecycle by\
    \ unfair decisions, or changes that impact lifestyle is a key consideration by\
    \ market players that issue products and services. These lifecycles have many\
    \ stages, ranging from the point of awareness or investigation through to an expanding\
    \ relationship where more products or services are acquired by a customer, including,\
    \ financial services (including unregulated “fringe” lenders), insurance, superannuation,\
    \ and telecommunications ([Figure 5.3](#c05.xhtml#c05-fig-0003)).\n\nAs a customer\
    \ journey with a market player progresses from awareness through to expanding\
    \ the existing relationship the risk to vulnerability “shocks” can increase. There\
    \ are many different contact channels that exist between a market player and a\
    \ customer that can serve as interaction points to assess the increased likelihood\
    \ of customer vulnerability.\n\n ![Figure 5.3 Vulnerability is a key consideration\
    \ that market players that offer products, goods, and services are starting to\
    \ consider throughout their entire journey with customers.](images/c05f003.png)\n\
    \n[**Figure 5.3**](#c05.xhtml#R_c05-fig-0003) Vulnerability is a key consideration\
    \ that market players that offer products, goods, and services are starting to\
    \ consider throughout their entire journey with customers.\n\nProtecting vulnerable\
    \ customers from hardship or stress has continued to be a major consideration\
    \ throughout the COVID-19 pandemic and left many small business owners facing\
    \ serious financial stress and insolvency. The stress has shown to also extend\
    \ to homeownership, where mortgagees have changed their repayments or deferred\
    \ them. For financial credit providers, there is value in predicting which customers\
    \ are more likely to default after the expiration of a repayment deferral program.\
    \ Such models focus on the major stress event of a pandemic, but not on the increased\
    \ risk of vulnerability that may have existed before the COVID-19 pandemic. Such\
    \ latent vulnerability risk is important to understand and model, especially considering\
    \ the best opportunity to provide support through the customer journey ([Figure\
    \ 5.3](#c05.xhtml#c05-fig-0003)).\n\nRegulators are increasingly focusing their\
    \ attention on better understanding the context in which automated decision systems\
    \ operate. Better protecting vulnerable customers has been receiving attention\
    \ from the government and regulatory bodies long before the COVID-19 pandemic\
    \ but has become more pronounced in recent times.\n\nFor example, the energy regulator\
    \ in the United Kingdom, Office of Gas and Electricity markets (OFGEM), published\
    \ its first consumer vulnerability strategy in 2013.\n\nFor consumer lending,\
    \ the Financial Conduct Authority (also in the United Kingdom) has a broad definition\
    \ for vulnerable consumers as “…someone who, due to their personal circumstances,\
    \ is especially susceptible to detriment, particularly when a firm is not acting\
    \ with appropriate level of care.”\n\nTheir guidance defines the details on the\
    \ key drivers and characteristics of vulnerability. Key drivers include health,\
    \ financial ability, financial resiliency, and life events.\n\nThe FCA defines\
    \ the personal, behavioral, social, and market-led characteristics that may be\
    \ associated with increased vulnerability of consumers as:\n\n*   Age—young or\
    \ old\n\n*   Living in a remote area\n\n*   Low income\n\n*   Periods of over-indebtedness\n\
    \n*   Homelessness\n\n*   Having an indigenous background\n\n*   Low reading,\
    \ writing, and numerical skills\n\n*   Speaking a primary language other than\
    \ the predominant language of a country\n\n*   Diverse cultural background, assumptions,\
    \ or attitudes\n\n*   Having either an intellectual, psychiatric, physical, sensory,\
    \ neurological, or learning disability\n\n*   Having limited access to technology\n\
    \n*   Inexperience with products or services offered\n\n*   Insufficient or misleading\
    \ information released to the market\n\nThe FCA published guidance as well as\
    \ policies like Policy 18/19 that highlights the importance of assessing affordability\
    \ in credit risk, including the use of income and expenditure information. In\
    \ 2017, the FCA published guidance on conduct for forbearance that helps guide\
    \ financial institutions on how to better embed fairness and assessments of the\
    \ customer’s ability to repay into their pre-collections and collections treatment\
    \ strategies.\n\nBy better understanding vulnerable consumers, financial institutions\
    \ can offer better services, reduce losses, and avoid costly investigations into\
    \ misconduct. This can be achieved by:\n\n*   Making better use of internal demographic\
    \ data so that vulnerable customers are better identified\n\n*   Developing toolkits\
    \ or using third-party software to help design frameworks, governance processes,\
    \ and products and services to reduce vulnerability\n\n*   Engaging with customers\
    \ at the earliest time possible to help with the design of products and services\
    \ to mitigate the impacts of vulnerability\n\n*   Tailoring offerings of products\
    \ and services to ensure appropriateness for vulnerable customers\n\nThe costs\
    \ of not investing in better identifying or protecting vulnerable customers are\
    \ high. This can involve multi-million-dollar penalties imposed due to the violation\
    \ of consumer protection laws as well as reputational damage. On the other side,\
    \ implementing vulnerability safeguards can generate benefits such as better customer\
    \ and employee satisfaction and improved sales opportunities from more flexible\
    \ products and services for a wider range of customers.\n\nAt financial institutions,\
    \ the efforts underway are often driven by regulatory compliance. An example is\
    \ reducing the time needed to resolve customer-initiated disputes. Some of the\
    \ early studies have leveraged sentiment analysis using voice-to-text data to\
    \ find sequences of sentiments that are expressed during a discussion. These sequences\
    \ are then used as classifiers to predict dispute or nondispute targets.\n\n##\
    \ CONCLUDING REMARKS\n\nThe use of advanced analytics to better understand bias,\
    \ fairness, and the vulnerability of consumers is increasingly being brought to\
    \ the frontline, rather than functioning in the back or middle office. Creating\
    \ frameworks and processes to mitigate bias and assess fairness in decision-making\
    \ will mean that in future these can also be expanded to other risk models, including\
    \ those used for real-time risk assessments, and the managing and mitigation of\
    \ emerging risks.\n\n## ENDNOTES"
  fmt: '

    Robust model risk management framework will collect, and make readily available,
    information that consistently and reliably enforces fair lending laws. This can
    be further extended to financial institutions having the ability to recognize
    and remediate the potential for discrimination above and beyond regulations.


    In addition, financial institutions can enforce constraints or rules on input
    data, ensure that the training data does not have protected characteristics, apply
    data quality checks to prevent data measures from contamination or influence by
    subjective errors, and document and validate the methods used to debias the data.


    ### Vulnerability


    Today, the identification of customers that are “vulnerable” is not regulated
    in all given authorities. Despite this, understanding that customers are more
    vulnerable to disruption in the customer lifecycle by unfair decisions, or changes
    that impact lifestyle is a key consideration by market players that issue products
    and services. These lifecycles have many stages, ranging from the point of awareness
    or investigation through to an expanding relationship where more products or services
    are acquired by a customer, including, financial services (including unregulated
    “fringe” lenders), insurance, superannuation, and telecommunications ([Figure
    5.3](#c05.xhtml#c05-fig-0003)).


    As a customer journey with a market player progresses from awareness through to
    expanding the existing relationship the risk to vulnerability “shocks” can increase.
    There are many different contact channels that exist between a market player and
    a customer that can serve as interaction points to assess the increased likelihood
    of customer vulnerability.


    ![Figure 5.3 Vulnerability is a key consideration that market players that offer
    products, goods, and services are starting to consider throughout their entire
    journey with customers.](images/c05f003.png)


    [`Figure 5.3`](#c05.xhtml#R_c05-fig-0003) Vulnerability is a key consideration
    that market players that offer products, goods, and services are starting to consider
    throughout their entire journey with customers.


    Protecting vulnerable customers from hardship or stress has continued to be a
    major consideration throughout the COVID-19 pandemic and left many small business
    owners facing serious financial stress and insolvency. The stress has shown to
    also extend to homeownership, where mortgagees have changed their repayments or
    deferred them. For financial credit providers, there is value in predicting which
    customers are more likely to default after the expiration of a repayment deferral
    program. Such models focus on the major stress event of a pandemic, but not on
    the increased risk of vulnerability that may have existed before the COVID-19
    pandemic. Such latent vulnerability risk is important to understand and model,
    especially considering the best opportunity to provide support through the customer
    journey ([Figure 5.3](#c05.xhtml#c05-fig-0003)).


    Regulators are increasingly focusing their attention on better understanding the
    context in which automated decision systems operate. Better protecting vulnerable
    customers has been receiving attention from the government and regulatory bodies
    long before the COVID-19 pandemic but has become more pronounced in recent times.


    For example, the energy regulator in the United Kingdom, Office of Gas and Electricity
    markets (OFGEM), published its first consumer vulnerability strategy in 2013.


    For consumer lending, the Financial Conduct Authority (also in the United Kingdom)
    has a broad definition for vulnerable consumers as “…someone who, due to their
    personal circumstances, is especially susceptible to detriment, particularly when
    a firm is not acting with appropriate level of care.”


    Their guidance defines the details on the key drivers and characteristics of vulnerability.
    Key drivers include health, financial ability, financial resiliency, and life
    events.


    The `FCA` defines the personal, behavioral, social, and market-led characteristics
    that may be associated with increased vulnerability of consumers as:


    * Age—young or old

    * Living in a remote area

    * Low income

    * Periods of over-indebtedness

    * Homelessness

    * Having an indigenous background

    * Low reading, writing, and numerical skills

    * Speaking a primary language other than the predominant language of a country

    * Diverse cultural background, assumptions, or attitudes

    * Having either an intellectual, psychiatric, physical, sensory, neurological,
    or learning disability

    * Having limited access to technology

    * Inexperience with products or services offered

    * Insufficient or misleading information released to the market


    The `FCA` published guidance as well as policies like `Policy 18/19` that highlights
    the importance of assessing affordability in credit risk, including the use of
    income and expenditure information. In 2017, the `FCA` published guidance on conduct
    for forbearance that helps guide financial institutions on how to better embed
    fairness and assessments of the customer’s ability to repay into their pre-collections
    and collections treatment strategies.


    By better understanding vulnerable consumers, financial institutions can offer
    better services, reduce losses, and avoid costly investigations into misconduct.
    This can be achieved by:


    * Making better use of internal demographic data so that vulnerable customers
    are better identified

    * Developing toolkits or using third-party software to help design frameworks,
    governance processes, and products and services to reduce vulnerability

    * Engaging with customers at the earliest time possible to help with the design
    of products and services to mitigate the impacts of vulnerability

    * Tailoring offerings of products and services to ensure appropriateness for vulnerable
    customers


    The costs of not investing in better identifying or protecting vulnerable customers
    are high. This can involve multi-million-dollar penalties imposed due to the violation
    of consumer protection laws as well as reputational damage. On the other side,
    implementing vulnerability safeguards can generate benefits such as better customer
    and employee satisfaction and improved sales opportunities from more flexible
    products and services for a wider range of customers.


    At financial institutions, the efforts underway are often driven by regulatory
    compliance. An example is reducing the time needed to resolve customer-initiated
    disputes. Some of the early studies have leveraged sentiment analysis using voice-to-text
    data to find sequences of sentiments that are expressed during a discussion. These
    sequences are then used as classifiers to predict dispute or nondispute targets.


    ## Concluding Remarks


    The use of advanced analytics to better understand bias, fairness, and the vulnerability
    of consumers is increasingly being brought to the frontline, rather than functioning
    in the back or middle office. Creating frameworks and processes to mitigate bias
    and assess fairness in decision-making will mean that in future these can also
    be expanded to other risk models, including those used for real-time risk assessments,
    and the managing and mitigation of emerging risks.


    ## Endnotes

    '
  trans: '


    稳健的模型风险管理框架将收集并随时提供能够一致且可靠地执行公平贷款法要求的信息。这可以进一步扩展到金融机构，使其能够识别并纠正法规之外的潜在歧视风险。


    此外，金融机构可以对输入数据实施约束或规则，确保训练数据不包含受保护特征，应用数据质量检查以防止数据衡量受到污染或受主观错误影响，并记录和验证用于数据去偏的方法。


    ### 脆弱性


    如今，并非所有司法管辖区对“脆弱性”客户的识别都有法律规定。尽管如此，理解客户在不公平决策或影响生活方式的变化时，在生命周期中更容易受到干扰，是发行产品和服务的市场参与者的关键考虑因素。这些生命周期包含许多阶段，从意识或调查阶段开始，到关系扩展阶段，即客户会获取更多产品或服务，包括金融服务（包括不受监管的“边缘”贷款贷者）、保险、养老金和电信服务（见图
    5.3）。


    随着市场参与者的客户旅程从意识进展到现有关系的扩展，遭受脆弱性“冲击”的风险可能会增加。市场参与者与客户之间存在许多不同的渠道，这些渠道可以作为互动点，以评估客户脆弱性增加的概率。


    ![图 5.3 脆弱性是提供产品、商品和服务的市场参与者在整个客户旅程中开始考虑的关键因素。](img/c05f003.png)


    `图 5.3` 脆弱性是提供产品、商品和服务的市场参与者在整个客户旅程中开始考虑的关键因素。


    在整个 COVID-19 期间，保护脆弱客户免受困难或压力一直是主要考虑因素，并导致许多小企业主面临严重的财务压力和破产。这种压力已延伸到住房领域，抵押贷款者改变了还款方式或推迟了还款。对于金融信贷提供者来说，预测哪些客户在还款延期计划结束后更容易违约具有价值。此类模型关注的是疫情这一重大压力事件，但没有关注
    COVID-19 之前可能存在的脆弱性增加风险。理解和建模这种潜在的脆弱性风险至关重要，特别是考虑到在客户旅程中提供支持的最佳时机（见图 5.3）。


    监管机构日益关注更好地理解自动化决策系统运行的背景。更好地保护脆弱客户在 COVID-19 疫情之前就已经受到政府和监管机构的关注，但在近期变得更加突出。


    例如，英国能源监管机构燃气和电力市场办公室（OFGEM）于 2013 年发布了首份消费者脆弱性策略。


    对于消费贷款，金融行为监管局（同样位于英国）对脆弱消费者有广泛的定义，为“……由于个人情况特别容易受到损害的人，特别是当公司未以适当水平的关怀行动时。”


    他们的指南定义了脆弱性的关键驱动因素和特征的细节。关键驱动因素包括健康、财务能力、财务韧性和生活事件。


    `FCA` 将可能与消费者脆弱性增加相关的个人、行为、社会和市场驱动的特征定义为：


    *   年龄——年幼或老年

    *   居住在偏远地区

    *   低收入

    *   过度负债时期

    *   无家可归

    *   具有原住民背景

    *   阅读、写作和计算能力低

    *   说的母语非该国主要语言

    *   多元的文化背景、假设或态度

    *   患有智力、精神、身体、感官、神经系统或学习障碍

    *   获取技术途径有限

    *   对所提供的产品或服务缺乏经验

    *   向市场发布的信息不足或具有误导性


    `FCA` 发布了指南以及如 `Policy 18/19` 等政策，强调了在信贷风险中评估可负担能力的重要性，包括收入和支出信息的使用。2017 年，`FCA`
    发布了关于宽款行为的指南，帮助指导金融机构如何更好地将公平性和对客户还款能力的评估嵌入到其催收前处理和催收处理策略中。


    通过更好地理解脆弱消费者，金融机构可以提供更好的服务、减少损失并避免对不当行为进行昂贵的调查。可以通过以下方式实现：


    *   更好地利用内部人口统计数据，以便更好地识别脆弱客户

    *   开发工具包或使用第三方软件来帮助设计框架、治理流程以及产品和服务，以减少脆弱性

    *   尽早与客户接触，帮助设计产品和服务，以减轻脆弱性的影响

    *   定制产品和服务的供应，以确保其对脆弱客户的适用性


    不投资于更好地识别或保护脆弱客户的成本是非常高的。这可能涉及因违反消费者保护法而面临的数百万美元罚款以及声誉损害。另一方面，实施脆弱性保护措施可以产生益处，例如提高客户和员工满意度，并通过为更广泛的客户提供更灵活的产品和服务增加销售机会。


    在金融机构，正在进行的努力通常是由合规驱动的。一个例子是缩短解决客户发起的争议所需的时间。一些早期研究利用语音转文本数据进行情感分析，以寻找讨论期间表达的情感序列。这些序列随后被用作分类器来预测争议或非争议目标。


    ## 结语


    使用高级分析来更好地理解偏见、公平性和消费者脆弱性正日益被推向一线，而不是仅在后台或中后台运行。创建用于减轻偏见和评估决策公平性的框架和流程，意味着未来这些方法还可以扩展到其他风险模型，包括用于实时风险评估的模型，以及新兴风险的管理和缓解。


