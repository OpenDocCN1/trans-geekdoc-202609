- raw: "If the active constraints are known, then inactive constraints may be discarded\
    \ and a much simpler solution can be efficiently reached. For this reason, despite\
    \ the run-time of the algorithm being higher (referred to as “worst-case complexity”),\
    \ active-set methods can outperform their interior-point counterpart. They are\
    \ often the method of choice when only variable bounds are present (e.g., there\
    \ are no other general constraints). The method stops when a workable point is\
    \ found within the feasible region; at such a point, any attempt to further improve\
    \ the objective will violate at least one constraint. The weights that achieve\
    \ these balance points are known as *dual variables*; that is, they are multipliers\
    \ of the constraint gradients such that the objective gradients equal the scaled\
    \ sum of the constraint gradients. A Lagrangian function is often used to describe\
    \ this system mathematically and hence dual variables are often called *Lagrange\
    \ multipliers*.\n\n### Solvers for the Target Objective Function That Is Nonconvex\n\
    \nWhen the problem is nonconvex, there are two options to try:\n\n1.  If the problem\
    \ is large scale, a multistart option can be used, which essentially applies local\
    \ solvers at a diverse set of (often randomly generated) points and then returns\
    \ the best. A multistart method tends work best at higher dimensions.\n\n2.  In\
    \ lower dimensions, where derivative-free methods are used, deployment of sophisticated\
    \ sampling methods can be performed that conduct global and local searches simultaneously.\
    \ Because these do not require gradients to perform optimization, they are more\
    \ generally applied, although convergence to even a local solution is not in all\
    \ cases guaranteed. Because they make little assumptions on the problem itself,\
    \ they are often referred to as black-box solvers. \n\n    *   Genetic algorithms\
    \ are a family of local search algorithms that search for best solutions by applying\
    \ principles of natural selection and evolution. Here, *first a sample population\
    \ of random candidates gets selected,* and the target objective function evaluated\
    \ for each member of the first population. Individual members of the iteration\
    \ that are current are stochastically chosen, and only the members with the best\
    \ objective values as solutions are chosen. Therefore, they are considered more\
    \ “fit” than others, and are thus selected for the next iteration. There are times\
    \ when solutions can pass onto a crossover operator or a mutation operator as\
    \ part of the next iteration. The search space is defined by variable ranges,\
    \ and the crossover operation allows the search to move to new areas of the search\
    \ space (best characteristics of “parent” solutions are combined to create “offspring”—the\
    \ combination is a new area of the search space).\n\n        Mutation operators\
    \ randomly vary the solution, so that the search over the solution space performs\
    \ in a way that prevents the convergence at the local minimum to be premature.\n\
    \n    *   Generating set search algorithms that search for improved points along\
    \ a positive-spanning set of the search direction. In two dimensions, this could\
    \ be north, east, south, west, for example. A positive-spanning set is needed\
    \ to prove convergence to local optimal points when certain assumptions implicitly\
    \ hold (such as continuity and smoothness). Such conditions are not needed, however,\
    \ for the algorithm to be applied. Because they are using a minimal set of samples\
    \ per iteration compared to a genetic algorithm, they are much better at quickly\
    \ finding a local solution. Thus, using the genetic algorithm as a global search\
    \ algorithm paired with a generating set search algorithm to refine the promising\
    \ points found by the genetic algorithm can lead to a robust and efficient hybrid\
    \ solver.\n\n## TUNING OF PARAMETERS\n\nThere are two broad classes of parameters\
    \ that require tuning during AI and machine learning model development. These\
    \ can be optimized during model training or external to the model training process.\
    \ There are typically hyperparameters associated with model-training (e.g., number\
    \ of layers in a neural network and the number of neurons at each layer) and the\
    \ solvers used for training (e.g., learning rate, momentum).\n\nSettings for both\
    \ the model training parameters and solver parameters of hyperparameters can significantly\
    \ influence the accuracy of the models. [Table 8.1](#c08.xhtml#c08-tbl-0001) lists\
    \ examples of parameter entities and hyperparameter attributes across both model\
    \ training parameters and solver parameters for a selection of algorithms.\n\n\
    [**Table 8.1**](#c08.xhtml#R_c08-tbl-0001) Key Algorithms and Their Associated\
    \ Parameter Entities, Including Model Training Parameters and Solver Parameters\
    \ of Hyperparameters.\n\n| Algorithm || Parameter entities || Hyperparameters\
    \ attributes |\n\n| --- | --- | --- |\n\n| Linear regression || \n\n*   Coefficients\
    \ of the linear regression equation include the intercept term (constant) and\
    \ betas (coefficients for the independent variables).\n\n*   The main estimation\
    \ methods for the coefficients are ordinary least squares (OLS), simple averaging\
    \ method (SAM), and stochastic gradient descent (using both the learning rate\
    \ and epochs) to estimate parameters.\n\n || The stepwise regression approach\
    \ to use can consist of Backward, Elasticent, Forward, Forwardswap, LAR, LASSO,\
    \ None or Stepwise methods, and what cut-off values for adding/removing terms,\
    \ such as the significance level for entry when the significance level is used\
    \ as the select or stop criterion, and the significance level for removal when\
    \ the significance level is used as the select or stop criterion. |\n\n| --- |\
    \ --- | --- |\n\n| Logistic regression || Coefficients of the logistic regression\
    \ equation include the intercept term (constant) and the betas (coefficients for\
    \ the independent variables). The main estimation methods are maximum likelihood\
    \ or stochastic gradient descent (using both the learning rate and epochs) to\
    \ estimate the logistic regression algorithm parameters. || Hyperparameters include,\
    \ for example, the model selection method and use that can consist of Backward,\
    \ Forward, LASSO, None, or Stepwise methods, the significance levels for entry/removal,\
    \ and the lassobase regularization parameter for the LASSO methods and the number\
    \ of steps for the LASSO method. |\n\n| Quantile regression || Each quantile level,\
    \ the distinct set of regression coefficients include the intercept and betas\
    \ (coefficients for the independent variables). || None |\n\n| General linear\
    \ model || For the transformed response in terms of the link function and the\
    \ independent variables, the coefficients are based on a linear relationship:\
    \ the intercept term (constant) and the betas (coefficients for the independent\
    \ variables). Maximum likelihood estimation (MLE) rather than ordinary least squares\
    \ (OLS) estimates the parameters. MLE relies on large-sample approximations. ||\
    \ The stepwise regression approach to use that can consist of Backward, Elasticent,\
    \ Forward, Forwardswap, LAR, LASSO, None or Stepwise methods, and what cut-off\
    \ values for adding/removing terms such as the significance level for entry when\
    \ the significance level is used as the select or stop criterion, and the significance\
    \ level for removal when the significance level is used as the select or stop\
    \ criterion. |\n\n| Decision trees || The parameters of decision trees such as\
    \ classification and regression trees (CART) are those that change the tree structure\
    \ from the inside. Recursive partitioning parameters that define the tree splits\
    \ are internal to the algorithm and thus determine how the tree grows, such as\
    \ cost complexity and reduced error methods. || \n\n*   Maximum depth\n\n*   Minimum\
    \ leaf size\n\n*   Interval input bins\n\n*   Grow criterion\n\n |\n\n| Random\
    \ forests || Parameters include those on how the trees are split internally using\
    \ the class/interval target criterion to apply, maximum number of branches, and\
    \ how missing values as attributes are used. || \n\n*   Maximum depth\n\n*   Minimum\
    \ leaf size"
