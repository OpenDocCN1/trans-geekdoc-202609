- raw: 'In mathematical terms, optimization refers to the act of minimizing or maximizing
    a value function subjected to constraints as an expression. The function and constraints
    can be linear or nonlinear. Mathematical optimization is integral and extensively
    used in AI and machine learning (e.g., minimizing a “loss function” subject to
    constraints). This is achieved by applying an optimization routine to improve
    the accuracy of the algorithm based on the provided training data by reducing
    the error in predictions.


    Mathematicians have developed optimization algorithms for many decades. For the
    modern-day risk practitioner, selecting the best algorithm and specification can
    be a daunting task. The choice of algorithm impacts the processing time, efficiency,
    and accuracy of the outcome. But before we describe the use of optimization for
    machine learning, it is best to describe what is meant by “*optimizing a value
    function that is subject to constraints”* as mentioned earlier.


    Taking a practical risk management example, a commercial bank may want to minimize
    the variance of returns (the objective function) while keeping their loss rates
    within risk appetite over *t* years (the constraints) and optimize the AI or machine
    learning accordingly.


    ## OPTIMIZATION FOR MACHINE LEARNING


    Even though the range of optimization applications in AI and machine learning
    is wide, two main optimization problems depend on whether the loss function is
    convex or nonconvex.


    Convex optimization has only one “best” solution, as the assumption is that a
    single local optimum exists—that is also the global optimum. Such a minimum exists
    that is determinable using a variety of well-tested and validated methods. Thus,
    the search area for convex optimization ([Figure 8.1](#c08.xhtml#c08-fig-0001))
    in itself takes on a convex shape, whereby following the negative gradient a local
    minimum is reached.


    Nonconvex optimization has multiple locally optimal solutions for the problem.
    Historically, most optimization problems in a machine learning context were considered
    convex; however, in recent years, with the application of neural networks and
    deep learning, the use of nonconvex optimization methods has grown. These algorithms
    work in the nonconvex landscape ([Figure 8.2](#c08.xhtml#c08-fig-0002)) (i.e.,
    where there is more than one local minimum and the optimization of these is to
    efficiently find the local minima, because in this case a global minimum is impossible
    to prove).


    Of course, there are also times when the objective function is concave. These
    are simply the negative of a convex function where the same principles apply.


    When optimizing machine learning, the machine learning fit function is approximated
    by optimizing the parameters so that the objective function is either minimized
    or maximized. To do that, there may be times when the input variables are restricted.
    These restrictions are constraints. Constraints define the feasible space over
    which the objective function is optimized. If the constraint requires a constant
    change applied to each variable, then the constraint is an *equality constraint*
    that decomposes to a *linear constraint*. Conversely, if the constraint is unequal
    for variables and can be achieved unilaterally, then the constraint is an *inequality
    constraint*. When applying these concepts together for machine learning optimization
    we get the following:


    ![Figure 8.1 Convex optimization. The search area for a convex optimization takes
    on a convex shape where the objective function finds a local minima that is itself
    a global minimum.](images/c08f001.png)


    [**Figure 8.1**](#c08.xhtml#R_c08-fig-0001) Convex optimization. The search area
    for a convex optimization takes on a convex shape where the objective function
    finds a local minima that is itself a global minimum.


    ![Figure 8.2 Nonconvex optimization. The search area for a nonconvex optimization
    has more than one local minima.](images/c08f002.png)


    [**Figure 8.2**](#c08.xhtml#R_c08-fig-0002) Nonconvex optimization. The search
    area for a nonconvex optimization has more than one local minima.


    *   A problem is convex if the objective is convex, equality constraints are linear
    if present, and all inequality constraints are concave.


    *   A problem is nonconvex if it is not convex. At least one is true: the objective
    is nonconvex, nonlinear equality constraints are present, or at least one nonlinear
    inequality constraint is not concave.


    Of course, there are myriad ways to solve convex or nonconvex optimization problems.
    This is because the choice of algorithm to use as the solver depends on the application
    as well as the analytical method. The intention of the section is not to explain
    all algorithms available as solvers for convex and nonconvex optimization. By
    way of an introduction, we''ll focus on machine learning function optimization
    that involves the use of solvers, the values of hyperparameters, as well as model
    fit optimization using stochastic gradient descent. Here are three types of solvers:


    1.  **Large-scale nonlinear constrained solvers.** Interior-point and active-set
    algorithms are good examples. These tend to be applied to business models that
    have nontrivial constraints.


    2.  **Large-scale unconstrained solvers**. Examples include the nonlinear conjugate
    gradient (CG), limited-memory Broyden-Fletcher-Goldfarb-Shanno (LBFGS), stochastic
    gradient decent (SGD), and the Adam algorithm. These tend to be applied to machine
    learning optimization problems where a single loss function is minimized.


    3.  **Derivative-free optimization solvers.** These tend to be very effective
    at smaller dimensional problems as they require little structure to the objective
    and constraints to operate. They are often the best fit for tuning hyperparameters.


    Hyperparameters broadly fall into two categories: model training parameters that
    relate to the model architecture (e.g., the number of layers of a neural network
    and neurons in each layer) and solver parameters such as the learning rate or
    momentum of an algorithm. The choice of solver and the solver settings will significantly
    affect the training process.


    In the next sections, we will discuss each of the solvers in more detail.


    ## MACHINE LEARNING FUNCTION OPTIMIZATION USING SOLVERS


    As defined earlier, there are many solvers to optimize an objective function,
    and these are dependent on whether the function to solve is convex or nonconvex.
    In the next section, we detail selected examples of solvers based on whether the
    objective function is convex or nonconvex.


    ### Solvers for When the Target Objective Function Is Convex


    When the objective function is convex, a solver needs to find one global minimum.
    Some solvers satisfy constraints while optimizing the objective function. Typically,
    solvers perform this by utilizing either an interior-point method or an active-set
    method. Interior-point methods start in the interior of the feasible region and
    use barrier functions to impose constraints. Active-set methods look to find a
    solution by quickly guessing the set of active constraints.'
