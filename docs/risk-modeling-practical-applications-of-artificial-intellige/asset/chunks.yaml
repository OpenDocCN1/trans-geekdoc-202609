    The challenges with developing, deploying, and managing AI are better addressed
    by automating manual data-quality tasks to assure good quality data for AI.


    Leveraging cognitive data-quality methods is one way to achieve a level of automation
    in data validation processes. Cognitive data quality autogenerate the data quality
    and cleansing routines, thus reducing the need for manual effort. This code can
    be executed as part of robust and repeatable data preparation control plans. The
    methods can scan the data, either structured or unstructured, and suggest possible
    data-quality transformations.


    # Other Data Considerations for AI, Machine Learning, and Deep Learning


    ## Utilizing “Alternative Data”


    Alternative data is said to be any data gathered from nontraditional data sources—for
    example, online or geolocation data, sensor data, social media, satellite images,
    or network data. Increasingly, data used to develop risk models is becoming a
    blend of traditional and alternative types especially in applications utilizing
    AI and machine learning.


    Typically, traditional data sources are structured and stored in relational databases.
    In some instances, AI systems employ alternative data that includes unstructured
    data in the form of real-time transactional data, news feeds, web browsing, geospatial
    data and so on.


    A common data challenge with AI approaches when utilizing larger data volumes
    is that the time history is not sufficiently long for back-testing purposes (e.g.,
    data capture may have started recently).


    The two data types used to build risk models, traditional and alternative, are
    summarized in [Table 2.1](#c02.xhtml#c02-tbl-0001). Before we progress to the
    next parts of this chapter, we wanted to take time to expand on the common steps
    for “alternative data” before it becomes useful for analytically driven insights
    and models. Commonly, unstructured “alternative data” must be structured into
    a more useful tabulated form, so that it can be combined with existing data used
    for risk management purposes, like risk modeling. The process also standardizes
    the data and reduces its dimensionality. For the inclusion of personal data, the
    firm will need to implement an information management standard to help govern
    its use. Such a framework is based on customer or consumer consent, ethical considerations,
    and regulations, as well as the internal guiding principles of the institution.
    Furthermore, organizations should also comply with the principles of BCBS239 to
    “alternative data”, as done for the more traditional data.


    [Table 2.1](#c02.xhtml#R_c02-tbl-0001) Data Types Used to Generate Risk Models


    | Type of Data | Definition | Traditional | Alternative |

    | --- | --- | --- | --- |

    | Transactional | | <br>* Structured and detailed information that captures key
    characteristics of customer transactions (i.e., installment payments and cash
    transfers)<br><br>* Stored in massive online transaction processing (OLTP) relational
    databases | <br><br>* Aggregated, structured, and typically summarized over longer-term
    horizons by aggregating into averages etc. | <br><br>* Granular, allowing for
    open banking aggregation |

    | --- | --- | --- | --- |

    | Internal data | <br>* Customer, product, and transactional history | <br><br>*
    Stored in enterprise databases | <br><br>* Call center data<br>* Digital journeys<br>*
    App usage |

    | External data | <br>* Data available from third-party data providers and public
    information | <br><br>* For example, positive and negative credit data from a
    small group of bureaus<br><br>* Macroeconomic information from bureau of statistics
    | <br><br>* Multiple sources of of third-party data (e.g., bureau data, open-banking
    aggregation, payment data from utilities, purchasing data from online platforms,
    subscription information, browsing history, weather, and location data)<br><br>*
    Public information<br>* Social media data (care is needed if using especially
    concerning customer consent) |

    | --- | --- | --- | --- |

    | Unstructured data | <br>* Data not stored in a predefined structured format
    | <br><br>* Traditionally required human effort to analyze | <br><br>* Text documents
    (e.g., emails, web pages, claim forms)<br><br>* Multimedia content<br>* Network
    information (i.e., ownership structures, suppliers, liquidity, legal dependencies
    between counterparties) |


    ## Extending Risk Data to “Alternative Data” for AI and Machine Learning


    Data preparation and its management for risk model development starts with the
    identification of the relevant data sources. In some cases, these sources need
    to be justified, which means that the reason for using the data must be evidenced
    as appropriate for the model to be built without causing bias or unfair outcomes
    ([Figure 2.2](#c02.xhtml#c02-fig-0002)).


    Importantly, when risk modelers select data sources, there are key organizational
    processes and policies to be considered. Any such considerations will continue
    to apply whether AI or machine learning replace traditional risk models or when
    AI or machine learning augment traditional risk models. The considerations depend
    on the type of model. Regardless of whether it is a traditional or innovative
    risk model, it is always good to ensure that the data sources selected are appropriate
    and justified for the model''s intended use. In this case, the intended use refers
    to the model objective, purpose, and the setting in which the model will be applied.
    For example, in risk departments, a range of model types are commonly used. A
    selected set of risk model types are listed and explained below, as well as examples
    of how risk modelers are utilizing alternative data sources. For example, alternative
    data from mobile phones and utilities helps lend to the unbanked and underbanked
    in many countries. This has a significant impact on access to credit for consumers
    and micro-entrepreneurs, and further helps to ensure fairer access to credit in
    countries that have historically disadvantaged groups: ![Figure 2.2 A typical
    relational risk management data model. ¶ The data categories support business
    as usual (BAU) risk models but are extended for AI/ML models using alternative
    and third-party data sources.](images/c02f002.png)


    [Figure 2.2](#c02.xhtml#R_c02-fig-0002) A typical relational risk management data
    model. ¶ The data categories support business as usual (BAU) risk models but are
    extended for AI/ML models using alternative and third-party data sources.


    *   **Decision models, such as application and behavioral scorecards.** For decision
    models, risk modelers may use transactional data as a source of alternative data
    to predict short-term and immediate events like loss of income. By enriching existing
    data with alternative sources, a more nuanced view of credit risk can be achieved,
    not only using banking data, but also telecommunications data like subscription
    data. For more information on the examples, refer to [Chapter 3](#c03.xhtml).

    *   **Credit risk parameter estimates for probability of default, loss given default,
    and exposure at default.** Risk parameters are widely used for regulatory capital,
    provisions, stress testing, and other internal calculations. Risk modelers are
    utilizing location data from property intelligence platforms and map applications
    to develop location scores. Risk modelers then use these scores to improve prediction
    of probability of default (`PD`) and loss given default (`LGD`) models for consumer
    loan portfolios and loans to small and medium enterprises (`SMEs`).

