  trans: '


    正如同事可能会说的那样，“`这有点像薛定谔的猫——`黑盒是不透明的，因此我们不知道猫是活着的还是死去的`。”当然，有可解释性诊断可以帮助解决这个问题。随后的章节将提供这些诊断工具的概述。


    # 模型解释与模型理解的区别


    解释人工智能（AI）或机器学习是指人类描述模型最重要的输入，并对模型预测结果为何是该结果进行推断的能力。为了解释模型，这些推断不需要完全精确。在这种情况下，也可以用通用的术语对模型进行解释：即模型输入的变化程度以及相关的输出预期变化幅度。一方面，无法保证答案会完全符合用户或消费者的预期，也无法保证结果具有重复性。另一方面，如果一个模型是`可解释的（interpretable）`，那么其数学函数可以被人类直接理解，模型使用输入推导输出的方法也是清晰可见的。这可以保证模型计算是透明的，且输出是可重复的。


    根据背景和目的，在风险管理领域的许多高风险决策中，算法必须同时具有可解释性和可理解性。


    在许多情况下，风险模型需要内部和外部利益相关者的批准。例如，用于市场风险、流动性和资本充足率的高度重要风险模型，需要对其概念上的完备性进行评估，并获得公司内部独立模型验证部门以及外部监管机构的批准和签署确认。同时，在世界某些地区，用于信用决策的模型要求金融服务提供者向贷款申请人提供理由代码，以告知他们被拒绝贷款的原因，并在使用事后解释（post-hoc
    explanations）时验证其准确性（例如有关《平等信用机会法》和 B 法的监管要求）。


    风险管理中也存在一些辅助领域，这些领域使用的模型不需要内部验证和治理团队的批准，也不需要遵守消费者保护法。这些盲点领域可能会影响消费者的评估和决策，因此，尽管这些模型并不一定是可理解的，但任何模型（无论是基于
    AI、机器学习还是传统模型）都需要处于治理框架之下。


    # 为什么要解释 AI 模型


    风险模型通常用于受监管要求的高优先级决策。因此，从风险经理到高管理层再到外部监管机构的一系列利益相关者，能够对模型的使用及其输出充满信心。然而，对于 AI
    和机器学习，理解模型及其组件往往是困难的。


    通常，可解释性的缺乏由于组织孤岛以及跨 AI 和机器学习模型全生命周期的全局可见性而进一步加剧。今天，透明度的缺乏阻碍了公司适当管理其风险模型及相关模型风险的能力，这导致了对
    AI 和机器学习的某种不信任。


    与解释风险模型能力相关的主要挑战包括：


    *   无法解释算法函数、定量方法以及模型输出是如何产出的。

    *   模型开发过程和假设缺乏透明度。

    *   无法解释或证明用于推导模型及后续决策的数据具有合理性。

    *   对模型在校准范围之外的数据上如何表现缺乏信心。

    *   缺乏 AI 和机器学习治理的全局性框架。

    *   无法评估过拟合、偏见、公平性以及其他意外后果的程度。

    *   由于无法获取模型文档（包括规格细节和假设），导致无法管理和维护模型，从而无法妥善管理其与其相关的模型风险。


    极速的发展速度和动态校准可能导致内部和外部利益相关者对接受和批准模型产生抵触。当然，所需的解释性水平也将取决于模型使用的背景以及模型的重要性程度。


    作为一个起点，确定模型的用途以及谁来负责和承担责任至关重要。然后，定义利益相关者是谁以及他们需要知道什么。以下是针对不同利益相关者可以提出的问题：


    *   他们是否需要知道如果模型出错会发生什么？

    *   他们是否需要知道模型驱动因素是合理的并符合业务目标？

    *   他们是否需要知道模型运行良好且随时间推保持稳定？

    *   他们是否需要知道模型是如何工作的？

    *   他们是否需要知道模型是如何融入业务流程的？

    *   他们是否需要知道特征工程所遵循的流程？

    *   他们是否需要知道哪些特征驱动了预测？或者哪些特征在单个预测中起作用？

    *   他们是否需要知道 AI 机器学习模型与简单的基准模型之间的性能差异？

    *   他们是否需要知道模型是简洁的（parsimonious），即它尽可能简单，但具有高度的预测能力？


    这是一个全面解释模型特征的良好起点，可以使 AI 和机器学习尽可能让各种利益相关者理解。


    # 解决模型开发用数据可解释性的常用方法


    正如第 2 章所述，正确的数据治理框架对于成功且负责任的 AI 和机器学习至关重要。本节进一步强调了标准化和一致的数据管理流程的重要性，以提高 AI 和机器学习的信任、透明度和治理水平。


    数据管理指的是访问、获取、转换和准备用于分析的输入数据的过程。为了辅助模型的透明化，涉及数据收集、数据准备、质量验证以及特征工程的流程需要是透明的、可重复（某些情况下）、稳健的且文档良好的。


    在模型开发中使用合理的输入有助于增强对 AI 系统的信任。


    与数据收集过程相关的数据中心问题：


    *   数据源是否可靠、有意义且合理？

    *   我们是否建立了标准化的数据质量、验证和采样流程？

    *   模型使用的训练数据是否存在偏见，是否能代表模型将应用的人群（例如，少数群体是否过度或不足）？


    与变量选择过程相关的数据中心问题：


    *   变量选择和压缩遵循什么方法论？

    *   我们是否记录了变量选择和压缩的方法？

    *   自动化流程与人工判断之间的混合比例是怎样的？


    与特征工程相关的数据中心问题：


    *   生产系统是否支持特征工程逻辑？

    *   特征工程的方法是否是自动化的并得到了模型风险策略的支持？

    *   流程是否可以使用中间样本或近期生产数据的样本进行重复？


    # 处理模型和模型输出可解释性的常用方法


    '
