    \ Strengthen scenario analysis capability.\n    * Streamline the management of\
    \ multiple scenarios.\n    * Incorporate flexibility for portfolio growth to reflect\
    \ business strategy and run-off assumptions.\n    * Quickly and efficiently meet\
    \ the expanding challenges of supervisory stress testing to include longer time\
    \ horizons and expanded risk factors.\n    * Expand capabilities to support scenario-based\
    \ business planning.\n* **Improve modeling**:\n    * Put in place a more sophisticated\
    \ modeling environment that can be used to develop models for physical and transition\
    \ risk, to also enrich models such as those used for expected credit losses (`ECL`)\
    \ and risk-weighted assets (`RWA`).\n    * Ensure that the modeling environment\
    \ can be extended to include modern AI and machine learning models.\n* **Improve\
    \ process efficiency**:\n    * Accelerate model implementation through a more\
    \ simplified model deployment mechanism for adjustment and recalibration.\n  \
    \      * Automate manual processes and the documentation of adjustments and overrides\
    \ of analytic-derived outcomes.\n* **Increase collaboration**:\n    * Centrally\
    \ orchestrate the entire climate risk management process.\n    * Ensure consistency\
    \ processes across the enterprise.\n    * Ensure climate risk forms part of the\
    \ enterprise risk governance framework and is integrated with existing risk systems.\n\
    \n## PRACTICAL EXAMPLES\n\nAI and machine learning are very effective at modeling\
    \ complex relationships at scale and that is exactly what is required in terms\
    \ of climate risk. The broad set of applications of AI and machine learning makes\
    \ it particularly effective as a tool in the fight against climate change. Included\
    \ in this section are a few tangible examples where AI and machine learning are\
    \ effectively employed to assist climate risk management.\n\nWith the increased\
    \ adoption of cloud-based computing, an example of that is a cloud computing providers,\
    \ namely Google, who initiated the development of a machine learning application,\
    \ called `Deepmind`, to improve energy efficiency in the cooling of their data\
    \ centers. The `Deepmind` project employs ensembles of neural networks to predict\
    \ energy efficiency. The models capture the dynamic interactions between the temperature\
    \ observed from sensors, power pump speeds, and other parameters within their\
    \ data centers. The project led to a significant reduction in energy consumption\
    \ of 40%.\n\nAnother example is in the increased risk of flooding. The increased\
    \ risk of flooding is a major physical risk due the increased risk of natural\
    \ disasters. Physical hazards, such as flooding, have potential to impact not\
    \ only the collateral values associated with banks' exposures, but also the cost\
    \ of capital and affordability of insurance. It can have a knock-on impact on\
    \ businesses, supply chains, and the long-term creditworthiness of a region. Recently,\
    \ an American town planner employed AI and machine learning on a smart city project\
    \ to better protect residents from river flooding. By installing sensors and rain\
    \ gauges to monitor water levels in real-time and using that data and analytics\
    \ to predict flood risk, residents can be warned proactively and traffic is rerouted.\
    \ In this case, the use of AI and real-time data mitigates the socioeconomic impacts\
    \ of the increased risk of flooding.\n\n### Climate Risk Management Solution\n\
    \nRecognizing the need for an enterprise climate risk solution, a Tier 1 bank\
    \ in Asia Pacific extended their stress testing solution to quantify the impacts\
    \ of climate risk following a bottom-up analytical approach. They employed scenario\
    \ analysis with supporting internal and external reports. A climate risk model\
    \ assesses the impacts of each industry or subindustry's decline in asset values\
    \ and quantifies the climate risk at exposure level. It links the bank's portfolio\
    \ strategy with its finance and auditing processes for business planning and policy\
    \ decision-making.\n\n### Environmental, Social, and Governance Application in\
    \ APAC-Based Financial Companies\n\nFor financial institutions, assessing the\
    \ carbon emissions of counterparties presents practical challenges in data collection.\
    \ In this case, the firm employed AI and machine learning to upload and process\
    \ sustainability reports and counterparty information on a cloud-based platform.\
    \ Geo-location data, scenario, and other risk data from third-party providers\
    \ are uploaded through `APIs`. By modeling the real estate data, disaster prediction\
    \ data, and financial data of the counterparty, the degree of financial impact\
    \ and the impact on collateral value are projected. The information is then used\
    \ to assess the impacts of climate risk on the counterparty's balance sheet and\
    \ P&L.\n\n### Sustainability Investment Screening\n\nAn analytics company in the\
    \ Nordics created a sustainability investment screening solution to help their\
    \ clients. By utilizing its web interface, financial investors can select companies\
    \ that are more sustainable than others. The solution performs investment screening\
    \ and monitoring based on the use of unstructured data, machine learning algorithms,\
    \ and an intelligent triage process.\n"
  trans: "\n\n尽管大多数中央银行已发布相关指南，指导受监管实体（包括银行）如何应用审慎实践管理气候风险，但在许多管辖区，在以下方面仍然缺乏明确性：\n\
    \n* 不同压力测试场景的关键数据和参数要求\n* 除由 NGFS（全球绿色金融网络）提供的场景外，对其他信誉且常用的场景的支持\n* 关于机构应如何进行短期和长期场景分析的细节\n\
    \n为了避免措手不及，对于机构而言，一个良好的起点是审查其能力，看其是否符合稳健分析生态系统的基础（图 9.2）：\n\n1. 数据溯源及其管理，包括数据验证和质量保证。\n\
    2. 利用定量技术和程序从数据派生洞察的风险建模平台。\n3. 风险计算和模拟能力。\n4. 与影响评估、业务决策和报告的整合。\n\n机构需要细粒度的物理风险和转型风险数据，这些数据将需要使用先进的数据质量程序来确保数据质量。高性能并行处理引擎可以适应细粒度数据需求和前瞻性风险模拟周期的频率。\n\
    \n众所周知，数据是任何分析派生结果的基础。如果没有数据的质量、验证和保证措施，结果可能是低劣。鉴于气候风险建模是一个较新的的话题，用于衡量财务影响的气候风险数据并不容易获得，特别是贷款级的信息，且质量尚不足以支持大规模、稳健的模型开发和模拟。\n\
    \n![图 9.2 创建气候风险生态系统的建议性框架。](img/c09f002.png)\n\n图 9.2 创建气候风险生态系统的建议性框架。\n\n为了更好地应对这些局限性，机构需要关注以下领域，以使其在气候风险管理工作中实现稳健性：\n\
    \n* **确保数据质量**：\n    * 建立与 `BCBS`（巴塞尔银行监督委员会）239 原则一致的稳健数据质量框架，适用于内部和第三方气候相关数据。\n\
    \    * 提供完全的透明度，例如数据来源、转换变量的方法以及地理空间级的细粒度。\n* **扩大场景覆盖范围**：\n    * 增强场景分析能力。\n\
    \    * 简化多场景管理。\n    * 纳入组合增长的灵活性，以反映业务策略和注销假设。\n    * 快速高效地应对监管压力测试日益增长的挑战，包括更长的时间跨度和扩展的风险因素。\n\
    \    * 扩展支持基于场景业务规划的能力。\n* **改进建模**：\n    * 建立更复杂的建模环境，用于开发物理风险和转型风险模型，同时丰富如预期信用损失（`ECL`）和风险加权资产（`RWA`）等模型。\n\
    \    * 确保建模环境可以扩展到现代 AI 和机器学习模型。\n* **提高效率**：\n    * 通过更简单的模型部署机制加速模型实施，以便调整和重新校准。\n\
    \        * 自动化手动流程以及对分析派生结果的调整和覆盖进行记录。\n* **加强协作**：\n    * 集中协调整个气候风险管理流程。\n \
    \   * 确保跨企业的一致性流程。\n    * 确保气候风险成为企业风险治理框架的一部分并与现有的风险系统集成。\n\n## 实践示例\n\nAI 和机器学习在规模化复杂关系方面非常有效，而这正是气候风险方面所要求的。AI\
    \ 和机器学习的广泛应用使其在对抗气候变化的工具方面尤为有效。本节包含几个具体的示例，展示了 AI 和机器学习如何有效用于协助气候风险管理。\n\n随着云计算采纳的增加，一个例子是云计算提供商（即\
    \ Google），他们启动了一项名为 `Deepmind` 的机器学习应用，以提高其数据中心冷却的能源效率。`Deepmind` 项目采用神经网络集成来预测能源效率。这些模型捕捉了传感器观测到的温度、水泵速度以及数据中心其他参数之间的动态相互作用。该项目导致能源消耗显著减少了\
    \ 40%。\n\n另一个例子是洪涝风险的增加。由于自然灾害风险的增加，洪水风险增加是一个主要的物理风险。物理危害（如洪水）不仅可能影响与银行风险口相关的抵押品价值，还可能影响资本成本和保险的可负担性。它可能会对业务、供应链以及一个地区的长期信誉产生连锁影响。最近，一位美国城市规划师在一个智慧城市项目中使用了\
    \ AI 和机器学习，以更好地保护居民免受河流洪水灾害。通过安装传感器和雨量计实时监测水位，并利用这些数据和分析来预测洪水风险，居民可以获得主动预警，并重新规划交通路线。在这种情况下，AI\
    \ 和实时数据的使用缓解了洪水风险增加带来的社会经济影响。\n\n### 气候风险管理解决方案\n\n考虑到企业级气候风险解决方案的需求，亚太地区的一家一线银行扩展了其压力测试解决方案，通过自下而上的分析方法来量化气候风险的影响。他们采用了在有内部和外部报告支持的场景分析。气候风险模型评估了每个行业或子行业资产价值下降的影响，并量化了风险敞口水平上的气候风险。它将银行组合策略与其财务和审计流程挂钩，用于业务规划和政策决策。\n\
    \n### 亚太地区金融公司中的环境、社会和治理应用\n\n对于金融机构而言，评估交易方的碳排放在数据收集方面面临着实际挑战。在这种情况下，该公司利用 AI\
    \ 和机器学习在云平台上平台上上传并处理可持续性报告及交易对手信息。来自第三方提供者的地理位置数据、场景和其他风险数据通过 `APIs` 上传。通过对交易方的房地产数据、灾害预测数据和财务数据进行建模，预测财务影响程度以及对抵押品价值的影响。这些信息随后被用于评估气候风险对对方资产负债表和损益表的影响。\n\
    \n### 可持续性投资筛选\n\n瑞典的一家分析公司创建了一套可持续性投资筛选解决方案来帮助其客户。通过其网络界面，金融投资者可以选择比其他公司更具可持续性的公司。该解决方案基于非结构化数据、机器学习算法和智能分拣流程进行投资筛选和监控。\n\
    \n"
