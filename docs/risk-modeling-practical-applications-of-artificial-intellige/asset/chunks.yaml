    -   攻击者会向模型引入违反上述统计假设的数据，用以降低模型准确性或导致非预期结果。


    可以应用多种防御措施，例如检测方法，包括在深度神经网络内部层计算的 `Shapley values`（Shapley 值）。这些方法可以区分正常输入和对抗输入。另一种选择是在包含对抗样本的数据上训练模型，使模型对这种形式的攻击更具鲁棒性。


    ## 11. 归因分析


    比较机器学习的两种不同场景的输出（例如输入或逻辑的变化），或来自两个不同时间段的数据。这有助于理解模型性能衡量差异背后的驱动因素。换句话说，它让建模人员能够更好地理解模型输入的变化如何影响模型性能或模型做出的预测。例如，将开发样本与模型完全投入产之前的前三个月的预产阶段数据进行比较。


    ## 流行方法的局限性


    多位作者和行业机构强调了事后（post-hoc）可解释性诊断的局限性。


    事后解释的一个局限性在于，它仅对模型进行了部分解释，因此可能会产生误导。在其他情况下，它依赖于底层代理模型的准确性。


    思考事后可解释性技术的一种方法是观察朋友的度假照片。每张照片都讲述了他们去过的地方以及他们所处的环境。一张照片可能是在 `埃菲尔铁塔` 前，另一张是在 `香榭丽舍大街`
    随意散步（世界上最著名的街道之一），另一一张是 `蒙娜丽莎`。你能仅通过看照片，就安全且自信地推断出你的朋友确实访问了巴黎吗？


    同样，事后诊断提供了观察同一个多维对象的不同视角。每种诊断都提供了一个独特的视角。当这些不同的视角结合在一起时，可能更好地理解模型的运行机制。


    然而，请记住，通过在已经复杂的模型上增加事后诊断这一额外的复杂性，可能会进一步增加模型的复杂性，从而增加模型风险。


    ## 结


    等等，纠正：## 结


    可解释人工智能（`XAI`）现在已是一门成熟的学科，并将继续演变。根据 `Christoph Molnar` 的说法，可解释性是大规模采用人工智能和机器学习的催化剂。随着人工智能和机器学习日益成熟，描述它们的技术也会随之进步。


    风险模型通常用于关键（因此受到高度监管）的决策。因此，从风险经理到高层管理到外部监管机构，一系列利益相关者能够信任模型及其输出是非常关重要的。


    展望未来，向一系列利益相关者解释模型各个方面的能力，将超出事后诊断的使用，扩展到使用自然语言解释以及可视化——用非技术性术来解释模型，并使用那些能够解释自身并自我记录的模型。


    ## 脚注


    1. 1. `Lael Brainard 州长`，“支持金融服务中人工智能的负责任使用和公平结果，”`联邦储备委员会理事会，AI 学术研讨会，华盛顿特区`（虚拟活动），2021
    年 1 月 12 日），`https://www.federalreserve.gov/newsevents/speech/brainard20210112a.htm`](https://www.federalreserve.gov/newsevents/speech/brainard20210112a.htm)

    2. 2. `Peter Quell`，`Anthony Graham Bellotti`，`Joseph L. Breeden` 和 `Javier Calvo
    Martin`，“机器学习与模型管理，版本 1.0，”`模型风险经理协会`（2021 年 3 月 8 日），`https://mrmia.org/wp-content/uploads/2021/03/Machine-Learning-and-Model-Management.pdf`](https://mrmia.org/wp-content/uploads/2021/03/Machine-Learning-and-Model-Management.pdf)

    3. 3. `美国联邦法规，第 1002 部分，平等信贷机会法（法规 B）`，（2022 年 6 月最后更新），`https://www.ecfr.gov/current/title-12/chapter-X/part-1002`](https://www.ecfr.gov/current/title-12/chapter-X/part-1002)

    4. 4. `消费者保护局采取行动保护公众免受算法黑箱信贷模型的影响于 2022 年 5 月 26 日），`https://www.consumerfinance.gov/about-us/newsroom/cfpb-acts-to-protect-the-public-from-black-box-credit-models-using-algorithms/`](https://www.consumerfinance.gov/about-us/newsroom/cfpb-acts-to-protect-the-public-from-black-box-credit-models-using-algorithms/)

