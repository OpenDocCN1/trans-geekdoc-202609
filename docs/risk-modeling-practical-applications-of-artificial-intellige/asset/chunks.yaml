  trans: '


    展望未来，监管机构的预期显而易见：风险计算需要在更细的颗粒度上进行，并更加强调高质量数据的使用，特别是在使用高级算法进行风险模型开发时。


    在风险管理中引入这些新兴数据源（例如“替代数据”）的风险在于，这些数据可能违反消费者保护法和公平贷款法。这可能导致 AI 和机器学习在使用过程中产生意之外的后果。AI
    和机器学习的意之外后果往往会被放大，因为 AI 和机器学习缺乏可解释性掩盖了底层的数据问题。深度学习算法层中隐藏的抽象性是现有数据质量方法可能力不从心的地方：组织可能转向
    AI 来管理数据中的风险。


    AI 和机器学习的使用不能脱离现有的业务流程。为了让组织从其使用中获益，需要一种全面的企业数据管理方法，跨越采集、建模、下游流程、报告和披露的数据孤岛。从本质上，对于
    AI 和机器学习而言，数据治理变得与模型治理一样重要。


    # 数据治理对风险职能的重要性


    从历史上来看，许多组织缺乏数据管理和准备的战略性方法。对于金融机构而言，遵循 `BCBS239` 原则意味着组织必须通过跟踪用于风险衡量和管理的数据的准确性、完整性和完整性，加强其数据聚合和报告能力。


    `BCBS239` 指南自全球金融危机后开发以来，对全球金融机构而言代表了重大的转型挑战。`BCBS239` 指南包含四个密切相关的主题，有助于更好地更统一的风险敞口管理：


    1. 风险治理与基础设施

    2. 风险数据聚合

    3. 风险报告实践

    4. 风险监督审查


    这四个主题由 11 项原则支持，如图 2.1 第 239 号标准的框架。¶ BCBS239 自全球金融危机后开发以来，对全球银行代表了重大的转型挑战。](images/c02f001.png)


    图 2.1 巴塞尔银行标准 (BCBS) 第 239 号标准的框架。¶ `BCBS239` 自全球金融危机后开发以来，对全球银行代表了重大的转型挑战。


    其他法规，如 `GDPR`（通用数据保护条例）和开放银行，也要求金融机构加强数据治理。


    无论监管预期如何，强有力的数据管理实践都是数据驱动决策的竞争优势。对于高质量的模型和决策，高质量的数据是先决条件。


    作为第一步，组织需要建立企业级数据治理框架。随后将通过良好的数据集成和数据准备实践进行补充。


    然而，如果没有建立起数据准备及其管理的基础——这包括使用数据字典、标准化数据集以及数据质量和验证程序——要遵循 `BCBS239`（图 2.1）对许多金融机构来说仍然是一个挑战，许多机构仍处于完全采纳的过程中。


    # 数据管理的基础


    可以使用许多工具来探索数据并为风险建模做准备，但常见的情况是，为传统模型采用的样本设计和方法通常被认为足够让 AI 和机器学习进行严谨的应用。这假设金融机构内部已经具备数据准备及其管理的基础。不幸的是，即使在全球金融危机发生
    14 年后，这些基础并不总能达到意义上的程度，特别是在支持数据驱动算法方面。


    为了更容易实现数据准备和管理的基础，并确保数据能够以利用高级算法，需要一种支持 AI 和机器学习最佳实践的企业数据战略。让我们来看每一个基础性主题。此外，AI
    和机器学习可以用于更轻松地实现这些目标。


    ## 主数据管理


    组织可以获得大量的内部和外部数据。然而，无论大小的金融机构面临的最大差距之一是数据目录（data catalogs）这一核心概念。许多机构试图通过基于电子表格的数据集描述来填补这一空白，但随着新列或新行（如新金融产品）的添加，这些描述会迅速过时。AI
    和机器学习实现的自动化可以帮助构建数据目录，该目录包含轻松搜索数据以及跨数据集搜索共享列或观测值的能力。搜索查询利用自然语言处理来提高易用性。组织可以使用程序化方法构建自定义解决方案，或利用内置
    AI 技术的供应商应用程序。


    例如，标准数据目录为每个数据集提供以下基本元数据：


    * 列详细信息

    * 行详细信息

    * 数据大小

    * 数据完整性（即“缺失”字段的数量）

    * 如何访问数据以及数据位于何处

    * 数据安全

    * 数据用途（可以手动添加或自动生成）

    * 数据血缘和使用历史（即使用该数据完成了多少份报告、模型和作业，以及该表的主要用户）


    ## 标准化数据集并确保数据质量


    对于 AI 和机器学习，风险管理团队可能会认为今天生成的所有数据概览（data profiling）指标已经足够了。


    我们记得一位多产教授在会议上被质疑模型输出结果时说过的一句非常深刻的话：“好吧，数据就是数据！”这可能是正确的。在风险模型中源并使用的数据确实是“数据”，但重要的是，可以使用复杂的认知数据质量控制进行改进和清洗。这些措施可以根据数据的唯一性以及描述性统计数据（如平均值、中位数、众数和标准差）确定数据。当使用更先进且可重复的技术时，那种“一点猜测”就消失了，数据清洗变得不再那么手动。


    在实际操作中，数据目录信息可以进一步扩展，通过描述性数据质量指标以及数据是否符合预期分布（例如，如果目录期望整数数据但实际上是字符串，则会被记录为不匹配）。数据质量指标对于提供数据集完整性的详细信息也极其有用。这些包括但不限于：


    * 唯一性频率、缺失值、不匹配次数

    * 提供列信息的元数据测量，包括其类型、格式、长度和主键候选项

    * 自动检测包含个人身份识别或敏感信息的列的安全性评分

    * 语义类型，通过结合数据质量算法和自然语言处理来自动生成元数据（例如，代表数值、识别码和邮政编码的列）


    '
