    \ the additional complexity of the input data and algorithms.\n\n![Figure 5.2\
    \ Disparity analyses assess model performance across classes of protected characteristics\
    \ (in this case, gender and age).](images/c05f002.png)\n\n[**Figure 5.2**](#c05.xhtml#R_c05-fig-0002)\
    \ Disparity analyses assess model performance across classes of protected characteristics\
    \ (in this case, gender and age).\n\nAnother challenge is to understand why the\
    \ AI and machine learning identified a high risk of bias given its inherent inability\
    \ to justify the inclusion of model variables, compared to a traditional, statistical\
    \ model where the variables and signs of parameters are known.\n\nThe AI system\
    \ itself may be subject to protected variables implicitly or indirectly. In this\
    \ case, standard techniques to determine correlations in the model can be applied.\
    \ In addition, explainability metrics can be used to explain the main drivers\
    \ behind decisions. Model sensitivity analysis, benchmarking, and trade-off analysis\
    \ are other popular methods that are often used by financial institutions to test\
    \ and confirm models.\n\nIn summary, AI approaches will still need to follow existing\
    \ consumer protection and regulatory frameworks (including Regulation B and the\
    \ ECOA). Like any other type of model, AI models can be flawed and are also subject\
    \ to bias, which impacts model predictability. Bias can be caused by either data\
    \ or algorithms that cause the model to be insufficiently or incorrectly trained.\
    \ When the sample data used to train the models does not sufficiently represent\
    \ the population, the model that will be applied to over- or underrepresenting\
    \ minority groups will have higher risk of unfair treatment. If the AI is biased,\
    \ that bias will be perpetuated and potentially be amplified through automated\
    \ decision-making.\n\nA benefit of automation is that if the bias is properly\
    \ addressed, automated decision-making has the potential to be more consistent\
    \ and traceable than human decision-making. In areas with strict requirements\
    \ for explainability, model governance frameworks should be extended with the\
    \ specifics for AI and machine learning.\n\nModel risks associated with AI-based\
    \ modeling approaches can be more pronounced as complex algorithms and input data\
    \ are usually involved in the modeling process. Complex transformations or interdependence\
    \ of model variables can make it more challenging to uncover hidden patterns that\
    \ may potentially violate fair lending laws. Thus, it is more important for institutions\
    \ to ensure model risk management principles and governance are enforced when\
    \ developing AI and machine learning.\n\nThese principles aid the evaluation of\
    \ AI-based approaches as many organizations have in place model risk and data\
    \ governance systems.\n\nFinancial institutions must prove their understanding\
    \ of the model inaccuracies and potential for unintended consequences (i.e., risk\
    \ of noncompliance with fair lending laws).\n"
  trans: "\n\n在金融、保险和医疗保健等不同领域已经开发许多措施，用于识别数据中的偏差并评估模型结果的公平性。对于风险管理，建议将偏差和公平性措施作为控制手段贯穿客户整个生命周期以及风险模型的生命周期（图\
    \ 5.1）。理解公平性指标的局限性至关重要：检测偏差和公平性的指标无法保证偏差与公平性的存在或不存在，也无法由于其他外部因素（如数据变化）导致后期出现公平性问题的可能。接下来，我们将解释一些方法和措施，通过信号触发人工干预来检测并纠正偏差和公平性问题。\n\
    \n在编写时，公平性指标的发展日益成熟，包括针对人工智能和机器学习的指标。\n\n以下是用于检测偏差和公平性的常用方法和指标示例：\n\n1. **人口统计学差异（Demographic\
    \ parity）。** 指评估人口统计变量的每个分段（或“受保护群体”）是否以相同的速率获得相同的正面结果。\n2. **机会均（Equal opportunity）。**\
    \ 该指标验证不同群体之间的真阳性率是否相同。以此类推，它也衡量了跨群体是否观察到相同的真阴性率。\n3. **假阳性率平衡（False positive\
    \ rate balance）。** 衡量不同群体之间的假阳性率（由此产生的真阴性率）是否相等。例如贷款申请人，速率平衡确保了每个群体中被预测为违约的比例具有代表性。\n\
    4. **均等优势或平均优势（Equalized odds or average odds）。** 这假设不同群体之间的真阳性率和假阳性率均相等（等同于真阴性率相等且假阴性率相等）。\n\
    5. **正预测一致性（Positive predictive parity）。** 在此处，不同群体之间的正预测值相等（即每个群体的假阴性预测预测率相同）。这是通过比较每个群体中真阳性的比例与预测阳性的比例来实现的。\n\
    6. **假漏率平衡（False omission rate balance）。** 不同群体之间的假漏率相等（即各群体具有相同的负预测值）。该速率比较了假阴性的比例与被拒绝/负收益的比例。\n\
    7. **特征归因分析（Feature attribution analysis）。** 利用特征归因分析寻找影响决策的驱动因素，例如确保某些因素与受保护变量不相关。\n\
    8. **敏感性分析（Sensitivity analysis）。** 使用扰动来评估对人口统计数据变化的敏感性。\n9. **相关性分析（Correlation\
    \ analysis）。** 当存在与年龄、性别或家庭状况等敏感变量相关的变量时，可能会导致不公平的结果。\n10. **交叉引用（Cross referencing）。**\
    \ 利用结果分析和交叉引用来评估模型在受保护群体和非受保护群体中的准确性。不公平的个人决策可能在特定的人口分段中观察到，但在考虑整个人口时是无法衡量的。\n\
    11. **三角测量法（Triangulation）。** 指使用两个以上的来源深入探讨某种情况以验证发现。还有其他类型的三角测量：\n    * *方法论：*\
    \ 使用一种以上的方法收集数据点，并使用一种以上的措施。\n    * *数据：* 涉及时间、空间和人员等不同维度。\n    * *调查者：* 涉及多个人参与。\n\
    12. **反事实分析（Counterfactual analysis）。** 为了在个人层面评估公平性，在反事实分析中，通过比较同一记录的因果属性与其调整后的版本，来评估结果的变化。\n\
    \n如前所述，一个很好的起点是通过比较模型对不同受保护或“敏感”变量值做出的预测和性能，来评估偏差和公平性（图 5.2）。敏感变量的示例是具有人口统计性质的，包括年龄、性别、种族、宗教、家庭状况、婚姻状况和民族等变量。\n\
    \n### 使用人工智能和机器学习检测并纠正偏差：警告\n\n在某些情况下，使用人工智能和机器学习可以帮助自动检测和纠正偏差。与其他人工智能和机器学习用例类似，评估公平贷款风险可能面临相同的解释性挑战（理解预测估值的原因）。确认基于\
    \ AI 的模型的挑战之一是某些传统的模型验证方法或指标并不容易适用。由于输入数据和算法的额外复杂性，无法很容易决策背后的驱动因素或将其与其他变量分离。\n\
    \n![图 5.2 差异分析评估了跨受保护特征类别的模型性能（在本例中为性别和年龄）。](img/c05f002.png)\n\n**图 5.2** 差异分析评估了跨受保护特征类别的模型性能（在本例中为性别和年龄）。\n\
    \n另一个挑战是理解为什么人工智能和机器学习在识别出高风险偏差时，其内在无法证明模型变量包含的原因（相比之下，变量和参数符号已知的传统统计模型）。\n\n\
    AI 系统本身可能隐性或间接地受到受保护变量的影响。在这种情况下，可以应用标准技术确定模型中的相关性。此外，可以使用解释性指标来解释决策背后的主要驱动因素。模型敏感性分析、基准测试和权衡分析是金融机构经常用于测试和确认模型的其他流行方法。\n\
    \n总之，人工智能方法仍然需要遵循现有的消费者保护和监管框架（包括 B 法规和公平信贷法 ECOA）。像任何其他模型一样，AI 模型可能有缺陷并受到偏差的影响，这会影响模型的预测性。偏差可能由数据或算法引起，导致模型训练不足或训练错误。当用于训练模型的样本数据不能充分代表总体人口时，应用于过度代表或代表不足少数群体的模型将具有更高的不公平对待风险。\n\
    \n自动化的一个优势是，如果偏差得到适当解决，自动化决策的潜力比人类决策更具一致性和可追溯性。\n\n在对解释性有严格要求的领域，模型治理框架应扩展人工智能和机器学习的细节。\n\
    \n与基于 AI 的建模方法相关的模型风险可能更加，因为建模过程中通常涉及复杂的算法和输入数据。模型变量的复杂转换或相互依赖可能使得发现可能违反公平信贷法的隐藏模式变得困难。因此，在开发人工智能和机器学习时，确保执行模型风险管理原则和治理至关重要。\n\
    \n"
