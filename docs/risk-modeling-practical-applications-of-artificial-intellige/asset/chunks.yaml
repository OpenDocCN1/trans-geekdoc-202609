    当可分配的资产只有少数敞口时，抵押品管理非常简单且直观，这意味着抵押品管理可以很容易地手动完成。


    *   `Cost model.` 该模型可以最小化抵押品成本以及资金成本。

    *   `Allocation model.` 这可以通过方法实现，例如通过成本模型对资产从低到高进行排序，或者通过线性规划来实现。


    ## 结语


    利用人工智能、机器学习和高级分析进行优化是一个快速发展的领域。在本章中，我们解释了机器学习算法优化。这涉及`solvers` 的使用、对`hyperparameters`
    的自动调优以及使用`stochastic gradient descent` 进行模型训练优化。此外，嵌入机器学习的优化算法是解决特定风险业务问题的强大工具。请记住，尽管优化非常强大，但它在数学上是复杂的，并且可能涉及大量的计算资源。好消息是，存在使用机器学习应用优化的自动化方法，可以将部分复杂性转移，帮助简化决策流程，使风险部门能够专注于优化所产生的业务价值。


