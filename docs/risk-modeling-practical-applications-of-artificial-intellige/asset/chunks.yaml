  trans: '


    财务和非财务风险的主要类型总结在表 1.1 中。


    几十年来，人们对气候变化有了认知。自 1992 年以来，联合国已经承认全球气候格局的变化（主要是由于温室气体排放）给世界带来了严峻问题。


    ### 表 1.1 风险类型及相关定义


    | 风险类型 | 定义 |

    | --- | --- |

    | 信贷风险 | 因借人未能履行还义务而导致财务损失的风险。 |

    | 市场风险 | 因市场价格波动导致机构收益损失的风险。 |

    | 运营风险 | 因内部流程失败、人员、系统或外部事件导致损失的风险。 |

    | 保险风险 | 提供保障的有害或意外事件、威胁或危险。 |

    | 流动性风险 | 公司无法在到期时履行短期义务而产生的风险。 |

    | 声誉风险 | 因舆论导致的财务和非财务损失风险。 |

    | 战略风险 | 因不利的业务决策或对行业和经营环境的变化缺乏反应而产生的风险。 |

    | 合规风险 | 因违反法律法规、内部政策和程序或伦理标准而产生的风险。 |

    | 利率风险 | 因利率波动导致损失的风险。 |


    气候的稳定性和金融服务业通过宏观经济、金融和气候系统之间复杂的相互作用层紧密联系在一起。


    ## 借助自然的力量克服技术和 AI 的采纳障碍


    此时，你可能在自问，是否完全是因为我们正在等待真正的“AI”被创造出来才成为主流，还是有其他因素在起作用阻碍了采用？缩小大规模大规模采纳的源性障碍的一种方法是回顾过去的工业革命时期。


    当像通信手段和社会系统等新技术进步产生协同效应时，它们创造了工业革命，反过来通过创新推动了社会现代化。


    有时需要一个像 `ATM` 这样的推动变化的推力，结合气候事件，来加速技术创新的采用。然而，尽管是重复且平凡的，转型并非易事，需要巨大的努力。为了让有机创新取得，像
    `ATM` 甚至电话这样的技术变化通常需要通过实验而非强制来获得经验，这样才能充分理解变化的需求、必要性以及其机会和风险。考虑到这一点，甚至可以创造出对变化的渴望。


    同样，在风险建模中 `AI` 和机器学习的主流采用也需要实验和经验才能被充分理解。正如 `ATM` 示例所示，虽然采用新技术有时需要一种冲击，但当技术改善了客户体验时，就会发生广泛采用。如果没有发生这种情况，那么
    `AI` 和机器学习的切实利益可能无法得到充分利用。


    ## 本书：它是什么以及不是什么


    通过本书，我们旨在提供示例和信息来揭示 `AI` 和机器学习的概念，从而提高对其许多益处的认识，并了解它们如何应用于解决日常风险管理问题（例如，如何评估全球大流行和气候变化等极端事件的财务影响）。我们还强调了与风险管理中的
    `AI` 和机器学习相关的某些增量风险和意外后果，以及解决这些问题的方法，从而使组织为对其采用和负责任的使用做好准备。在可能的情况下，我们旨在提供 `AI`
    和机器学习在风险管理中带来切实利益的实际用例。


