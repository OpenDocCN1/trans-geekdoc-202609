- raw: 'Before deciding on a new loan, what is the expected credit loss under this
    scenario? This can be approximated using machine learning. The benefit of machine
    learning is that it can quickly inform the estimated expected credit loss in real
    time, at the time of loan origination, leading to better decisions.


    ## DEFINITIONS OF AI, MACHINE, AND DEEP LEARNING


    Although we have discussed practical use cases of AI and machine learning in risk
    management, it is also important to appreciate how AI and machine learning is
    defined, and the major types that are used.


    ### Artificial Intelligence


    In 1950, the famous English mathematician Alan Turing asked the question, “Can
    a machine think?”


    Later in 1955, the American father of AI, the computer scientist John McCarthy,
    first coined the term *artificial intelligence* while preparing for a conference
    that explored ways to make machines reason like humans, capable of abstracting
    thought and solving problems.


    In general, AI is often used to describe computer-based systems that can think,
    learn, and respond to stimuli in their environment. Importantly, like human intelligence,
    the AI computing system can also subsequently act in response to these stimuli
    and create its own objective.


    Let us further solidify the understanding of AI by taking a purely hypothetical
    situation of a “paper clip maximizer”


    AI has already become deeply embedded in society and used by most of us daily,
    even if we are not aware. The wide availability of AI is a further tribute to
    the legacy of McCarthy. McCarthy did not leave us with a collection of theories
    and exploratory questions on machines and intelligence, but “list processing”
    (LISP), which was the language of choice for natural language processing (NLP)
    functions.


    Some great contemporary examples of LISP-enabled AI systems include the voice
    recognition technology used in iPhone''s Siri or Amazon''s Alexa that allow mobile
    devices to interpret essential elements of human language to return an answer.


    ### Machine Learning


    Machine learning was created by Arthur Samuel at IBM very early in the quest to
    develop AI. Samuel created a program that had the ability to learn parameters
    of a function for evaluating the position of checkers on a board during a game
    of play.


    Coming back to the definition of machine learning, it is a subset of AI, and over
    many decades, has matured into a discipline to focus on solvable, practical problems
    using models and methods borrowed from statistics and probability theory.


    In essence machine learning refers to the ability of a machine to learn from data
    and to keep improving its performance without need of human interference.


    #### *Supervised Learning*


    Supervised learning is where machine learning uses learning methods with a target
    variable to make a prediction.


    *   Gradient boosting machine (GBM)


    *   Random forest and decision trees


    *   Naive Bayes classification


    *   Support vector machines


    *   Ensemble methods


    As an example of how supervised machine learning is used in risk management, machine
    learning algorithms such as GBM and random forests have been used in decision
    science applications to improve accuracy and perform well with larger and higher
    dimensional datasets.


    ##### Gradient Boosting Machines


    Gradient boosting is an ensemble method for regression and classification problems.
    It follows a boosted approach, whereby a group of models (weak learners) are combined
    to form a composite model (strong learner). Gradient boosting uses regression
    trees for prediction purposes and builds the model iteratively by fitting a model
    on the residuals. It generalizes by allowing optimization of an objective function.


    ##### Random Forests


    Random forests are a combination of tree predictors such that each tree depends
    on a sample (or subset) of the model development data (or training data) selected
    at random.


    #### *Unsupervised Learning*


    Unsupervised learning is another category of machine learning, but unlike supervised
    learning, it uses unlabeled datasets for knowledge discovery. As such, an unsupervised
    learning algorithm does not include a target variable. The following methods use
    algorithms to construct understanding of data that allows for machine learning
    to self-identify patterns in the data:


    *   Clustering


    *   Singular value decomposition


    *   Independent component analysis


    #### *Reinforcement Learning*


    Reinforcement learning differs from both supervised and unsupervised learning
    as it mimics the way that “agents”—an entity that understands how to make a decision
    based on past positive and negative experiences—learn by goal-seeking behavior
    in response to a reward stimulus.


    Reinforcement learning works well when humans can specify the goal but are uncertain
    about the optimal path.


    ### Deep Learning


    The machine learning approaches described thus far have limitations in that they
    rely on a programmer to determine what is informative for making a decision that
    can achieve a preset goal.


    This is not the case with a more scalable machine learning algorithm referred
    to as *deep learning* where performance relies on large amounts of data to build
    models more accurately.


    The reason deep learning does not deteriorate in terms of performance as the size
    of data increases is because the algorithms are able to learn independently by
    identifying structures in data ([Figure 3.1](#c03.xhtml#c03-fig-0001)). It then
    focuses on parts of these structures to achieve a goal.


    To mimic the complexity of the biological neuronal network of the brain and create
    a deep learning model, the artificial neuron works like a biological cell where
    it receives a set of inputs (*x*) or impulses, each of which is assigned a specific
    weight (*w*). The neuron then computes numerous functions (*y*) on each of the
    now weighted inputs. ![Figure 3.1 Deep learning is the most complex form of supervised
    machine learning. It can scale because there are no performance limitations as
    the amount of data used for training increases. Also shown in the graph are other
    supervised and unsupervised machine learning algorithms/techniques. The size of
    the bubbles indicates complexity relative to others within each quadrant.](images/c03f001.png)


    [**Figure 3.1**](#c03.xhtml#R_c03-fig-0001) Deep learning is the most complex
    form of supervised machine learning. It can scale because there are no performance
    limitations as the amount of data used for training increases. Also shown in the
    graph are other supervised and unsupervised machine learning algorithms/techniques.
    The size of the bubbles indicates complexity relative to others within each quadrant.


    A classical challenge is overfitting. It is possible that a neural network becomes
    overfitted where the model produced by the algorithm perfectly performs each time
    on the training sample but fails in practice. The issue of overfitting occurs
    when too many parameters have been used and not enough training data points.


    The way in which the weighted inputs are computed depends on the type of activation
    function used. An activation function is a mathematical transformation that acts
    as the transfer function: it translates the input signal to the output signal.
    The more common activation functions used are:


    *   Identity functions that are linear. The value of the argument used for training
    is not changed and its range is potentially not bounded.


    *   Sigmoidal functions are S-shaped like logistic and hyperbolic tangent (or
    tanh) functions that produce bounded values with a range of 0 to 1, or –1 to 1.


    *   Softmax functions are multiple logistic functions and are a generalized representation
    of logistic regression that forces the sum of their values to be 1.


    *   Value functions are bell-shaped functions such as a Gaussian function.


    *   Exponential and reciprocal functions are bounded by 0 and 1.'
