- raw: "Looking ahead, the expectations from regulators are clear: risk calculations\
    \ will need to be performed at much higher levels of granularity, with greater\
    \ emphasis on the use of high-quality data, especially when advanced algorithms\
    \ are being used for risk model development.\n\nThe risks of incorporating these\
    \ emerging data sources in risk management, such as “alternative data,” are that\
    \ these may violate consumer protection and fair lending laws. That may lead to\
    \ unintended consequences in the use of AI and machine learning. The unintended\
    \ consequences of AI and machine learning are often amplified, as the lack of\
    \ explainability of the AI and machine learning masks the underlying data issues.\
    \ The abstraction hidden in the layers of a deep learning algorithm is where existing\
    \ approaches for data quality may fall short: organizations may have to turn to\
    \ AI to manage the risks in the data.\n\nThe use of AI and machine learning cannot\
    \ function outside existing business processes. For organizations to benefit from\
    \ its use, a comprehensive approach to enterprise data management is required,\
    \ spanning across the silos of data collection, modeling, downstream processes,\
    \ reporting, and disclosures. In essence, for AI and machine learning, the governance\
    \ of data becomes as important as the governance of the models.\n\n## IMPORTANCE\
