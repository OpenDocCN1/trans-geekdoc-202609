    今天，全球对于伦理 AI 框架的设计和部署尚未达成共识。然而，在已建立的法规和指南中，使用了与公平、伦理、问责和透明度相关的相同伦理原则。伦理 AI 合规指南和法规的深度和广度很大程度上取决于各管辖区对
    AI 和机器学习采用的成熟程度。例如，亚太地区的监管机构继续完善伦理 AI 框架，以帮助实现公平目标（例如，澳大利亚政府最近发布了《AI 伦理框架》，香港金融管理局了以《监管科技采用实践指南》形式发布的监管指导，其中包含了“AI
    治理框架”的先决条件）。


    # 结语


    随着 AI 和机器学习的使用，风险部门应该拓宽思路，扩展其性能监控框架，以便在不过度依赖人工代码的情况下实现 AI 和机器学习的透明化。通过动态跟踪一系列相互关联的类别——包括但不限于输入数据、模型衰减和模型稳健性——风险部门可以更很好地理解潜在的
    AI 和机器学习局限性，并主动识别可能导致模型故障的问题。监管机构和中央银行也希望风险部门在验证 AI 和机器学习时遵守某些合规措施。我们在本章中解释了主要概念。


    然而，即使在缺乏 `SR 11-7` 中明确定义的模型风险管理监管预期的情况下，模型风险管理仍然应该是关注重点，因为与 AI 和机器学习相关的模型风险可能会导致量化的损失，从风险计算的不准确到开发和实施模型的成本，再到做出不公平决策的负面影响。当
    AI 和机器学习在治理模型开发、部署和使用的稳健模型风险管理框架之外运行时，这些风险会进一步加剧。


