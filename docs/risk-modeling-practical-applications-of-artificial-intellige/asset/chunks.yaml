- raw: 'Moreover, Fibonacci learned the Hindu-Arabic numerical system from traders
    while visiting his father at a port in Algeria in the thirteenth century. Innovations
    in mathematics, trading, and finance seem inextricably linked—but that is perhaps
    a topic for another book. The use of risk models can likely be traced back to
    the precursor of what we now consider actuarial science in insurance. In the eighteenth
    century, these pre-modern-day analysts poured over data to estimate life expectancy
    on which to price insurance premiums.


    Fast forward to modern times; based on the work of others like David Hume and
    Nicholas Bernoulli, Harry Markowitz developed portfolio theory in 1952. Today,
    we can define a model as a quantitative method, system, or approach that applies
    statistical, economic, financial, or mathematical theories, techniques, and assumptions
    to process input data into quantitative estimates.


    The use of risk models is now ubiquitous in financial services. One reason is
    the swaths of new regulations before and after the Global Financial Crisis. In
    the last decade, regulation after new regulation has expanded the volume of risk
    models that organizations need to manage. In addition, organizations have increased
    model usage to remain competitive—replacing manual activities and decision-making
    with analytical methods, while improving the sophistication of their models. Models
    are also used to keep up with industry trends such as big data and digitalization.


    The effects of the Global Financial Crisis did not only increase the number of
    models to manage—it also increased their complexity. Organizations began adding
    different model types—including econometric models, financial and forward-looking
    models for provisioning, and enterprise stress testing. That resulted in a growing
    number of dependencies and interconnections between the models, how they operate,
    and the process that defines it (i.e., the risk model lifecycle).


    New models have started to gain even more traction as the COVID-19 pandemic highlighted
    inefficiencies in the risk model lifecycle. The issues were particularly evident
    in the volatility observed in forward-looking loss models during the COVID-19
    pandemic. Financial institutions realized that risk models need to balance their
    efficacy with potentially longer-term degraded conditions and increased macroeconomic
    uncertainty, caused by the COVID-19 pandemic. The longer-term conditions and increased
    uncertainty are likely to continue to create “shocks” to many different types
    of risk models. At the time of writing, many large banks have accelerated their
    recalibration efforts, including the use of alternative data and modeling approaches,
    due to:


    *   Risk-ranking and risk profiling discrepancies caused by shifts in consumer
    and portfolio behavior


    *   Risk models simply breaking down due to shifts in correlations with macroeconomic
    indicators


    The use of AI and machine-learning-based algorithms for risk management requires
    a rethink of the risk model lifecycle. Typically, a traditional statistical model
    takes a risk modeling team several months of development effort. One can argue
    that a lengthy process is needed to ensure a desired level of accuracy, performance,
    and validation, but experience has shown that a lot of effort is spent on inefficiencies
    due to fragmented, legacy systems across the risk model lifecycle. For example,
    rigid processes that are entrenched in silos of business activity may delay signoffs
    and there can be a culture that supports a mentality to “reinvent the wheel” for
    each model development activity.


    One lesson from COVID-19 is that long cycles of building and deploying models
    for risk-based decision-making lead to suboptimal decisions. The use of AI and
    machine learning presents an opportunity to greatly reduce the “time to model”
    and reap the resulting rewards.


    ## USE OF AI AND MACHINE LEARNING IN RISK MODELING


    As a suite of tools, AI and machine learning have transformational potential to
    improve accuracy compared to traditional models, handle large structured and unstructured
    datasets, and help assist organizations with agile responses to changes in market
    conditions. Together, the suite has been effectively used in problem-solving,
    and is likely to accelerate given the faster adoption of big data technologies
    and digitalization.


    In financial services, the use of AI and machine learning started some years prior
    to the COVID-19 outbreak and in many diverse areas of financial services, including
    risk management. To the risk function, AI and machine learning have delivered
    tangible benefits by automating mundane tasks and processing large volumes of
    diverse data. These tools can flexibly identify complex relationships hidden in
    data and thus achieve higher levels of model accuracy, compared to what is possible
    with traditional statistical methods. However, for the large-scale and long-term
    use of AI and machine learning, adoption of a scientific mindset needs to be better
    embedded in the culture and in the way innovation is approached by teams across
    the enterprise.


    When applying the scientific mindset to AI and machine learning, technology is
    typically applied to solving a specific problem, rather than attempting to use
    the technology to *incidentally* solve an existing problem. Once a problem has
    been identified, then a hypothesis can be tested appropriately, utilizing the
    scientific fundamentals that involve data, people, and processes. We will next
    explain how the traditional function of risk management is changing in response
    to new and emerging risks, and how AI and machine learning can enable an easier
    response to the demands created.


    ## THE NEW RISK MANAGEMENT FUNCTION


    Risk management can be viewed as more than a collection of compliance measures
    and a function to meet continued demands and expectations of internal and external
    governance bodies. Current risk management frameworks are adapting to new and
    emerging risks, increased uncertainty in the macroeconomic environment, and addressing
    transparency and fairness in financial decision-making—especially those concerning
    customers and those that impact the environment. Emerging risks, digitalization,
    stronger competition, and new regulations demand more from the modern risk function,
    especially against a backdrop of COVID-19 and climate change.


    At the time of writing, a tiny, single-stranded RNA called severe acute respiratory
    syndrome coronavirus 2 (SARS-CoV-2) that causes Coronavirus Disease-2019 (COVID-19)
    and potential life-threatening respiratory infections, had quickly spread to become
    a global pandemic.


    Part of the dramatic volatility caused by containment measures were fortunately
    countered by fiscal policy, including short-term relief for borrowers and other
    programs introduced by national governments and central banks. Irrespective of
    the extent of containment measures, the resiliency built into banks'' balance
    sheets—large capital buffers put in place as a result of enhanced regulatory scrutiny
    following the Global Financial Crisis


    Who would have thought that a tiny strand of RNA could create such macroeconomic
    upheaval in as little as a few months? Many businesses had to adapt to a newly
    defined “normal.”


    Even though the impacts of the pandemic were quick and severe, the recovery was
    almost as quick, as countries and sovereign states emerged from the COVID-19 restrictions
    and trillions of dollars in stimulus measures boosted economies.


    The macroeconomic effects at the peak of the pandemic created strong negative
    impacts on risk and profitability levels of organizations and demanded quick intervention
    from governments. For financial services, for example, risk and profitability
    are known to interact very closely with macroeconomic effects (as per the credit
    cycle or interest rate cycle). In addition, financial services play a necessary
    and important part in stabilizing markets for businesses to operate.'
