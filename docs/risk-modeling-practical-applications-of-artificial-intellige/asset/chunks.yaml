  trans: '


    * 欧盟委员会——制定关于人工智能（AI）的统一规则。

    * 欧盟可信 AI 指南。


    ### GDPR（通用数据保护条例）


    这项欧洲法律规范了欧盟联盟和欧洲经济区的数据保护和隐私法。`GDPR` 于 2019 年发布了《可信 AI 伦理指南》。为了让 AI 符合 `GDPR` 的规定，需要仔细考虑其他因素（关键问题的总结请表
    7.1）。


    ### ECOA（平等信贷机会法）


    美国联邦贸易委员会（下简称 `FTC`）管理着各种消费者保护法，包括防止商业活动中出现不公平竞争方法以及禁止不公平和欺骗性行为或做法的法律。`FTC` 长期以来一直利用其权力监管私营部门对个人信息和直接影响消费者的算法的使用。`FTC`
    行使此类权力的方式之一是根据《平等信贷机会法》（`ECOA`）。`ECOA` 帮助保护消费者获得平等的信贷机会，保护他们免受基于种族、肤色、性别、宗教、年龄和婚姻状况等受保护变量的歧视。


    #### 表 7.1 遵循 GDPR 指南时的关键问题


    | 指南 | 简要说明 |

    | --- | --- |

    | 不受自动化决策影响的权利 | 仅当决策完全基于自动化处理，并且对数据主体产生法律影响或对其产生类似程度的重大影响时，才禁止其受到自动化决策的影响。然而，如果该过程是在获得数据主体的明确同意的情况下进行的，或者控制者已采取了充分的安全措施，则是允许的。在这种情况下，需要提供的安全措施包括：引入人工干预以清晰透明的方式分析并处理系统的目的、限制、要求和决策；在隐私政策中清楚地解释自动化决策，以便在处理数据之前通知客户；并获得明确同意，告知数据主体该决策是算法决策的结果，且他们正在与聊天机器人、机器人或其他对话系统等
    AI 代理进行交互。 |

    | 透明化处理 | 数据主体应被告知处理的存在和目的，特别是当数据处理活动涉及自动化决策时。关于此类处理的逻辑、意义和预期后果的实质性信息应对对用户明确透明。
    |

    | 删除权 | 由于为了使 AI 需要收集和整理大量数据，而导致的数据共享和数据开放，数据控制者很难确保第三方数据服务器执行了删除操作，或者需要删除的数据已从其他联合控制者或数据处理器中完全删除。
    |

    | 数据最小化 | 去标识化（伪匿名化）允许在 AI 中使用更多、处理和分析更多数据。伪匿名化符合 `GDPR` 的数据最小化原则，而匿名化意味着数据主体不再是或无法被识别。`GDPR`
    促进伪匿名化作为一种适当的安全措施，以便组织在不获得额外同意的情况下重新使用数据。 |


    2020 年和 2021 年，`FTC` 指出，如果公司使用的算法直接或间接地通过差异性影响在信贷决策方面对受保护群体产生歧视，那么 `FTC` 就可以根据
    `ECOA` 对该类行为提出挑战。此外，2020 年和 2021 年更新的指南为使用 AI 的组织提供了预期方面的见解。示例包括：


    * **从头开始。** 组织需要寻找训练数据集是否包含对受保护群体的差异性对待。

    * **测试。** 在使用前并定期对算法进行测试，以确保它们不会基于上述受保护变量产生歧视。


    算法的公平性可以通过考虑以下问题来评估：


    * 数据集的代表性如何？

    * 数据模型是否考虑了偏见性？

    * 基于大数据的预测准确性有多高？

    * 对大数据的依赖是否引发了伦理或公平性担忧？

    * 算法是否弊大于利？组织应该应该自问，他们的 AI 和机器学习是否弊大于利。如果是这样，`FTC` 可能会根据《FTC 法案》第 5 条将其视为“不公平”，并对其采取强制执行措施。


    ### SR-Letter 11-7


    美国联邦储备体系董事会和货币监事局于 2011 年发布了名为《模型风险管理监管指导》的 `SR Letter 11-7` 信函。该信函已成为模型风险管理的金标准，也是监管机构对模型风险管理预期最重要的声明之一。美国受监管的银行和金融机构有义务将
    `SR 11-7` 原则落实到其模型风险管理框架中。


    在美国境外，其他许多监管机构也发布了模型风险管理的监管预期，例如欧洲中央银行（`ECB`）、欧洲银行管理局（`EBA`）以及国家监管机构，如加拿大金融机构监管局（`OSFI`）和澳大利亚审慎局（`APRA`，根据审慎标准
    `CPS 220` 管理和信贷风险管理审慎标准 `APS 220`）。特别是 `ECB` 在 2015 年将 `SR 11-7` 原则纳入其内部模型针对性审查（`TRIM`）。


    `SR 11-7` 影响深远，概述了风险管理的所有监管预期，包括定义什么是模型，以及银行必须对所有“模型”实施的过程和内部控制。这有助于确保银行以控制的方式开发、实施和使用模型。`SR
    11-7` 的原则至关重要，因为所有模型（包括 AI 和机器学习）都存在因不准确或控制不当而导致损失的风险。这里的损失范围广泛，从计算不准确到开发和实施模型的成本，再到做出不公平决策带来的负面声誉影响。


    如果没有建立定义的模型风险管理政策，各种模型开发应用带来的灵活性可能会导致组织面临严重的误用和损失。在这种情况下，还可能缺乏适当的控制和审批，导致随后的错误。有效的模型风险管理有助于提供稳健性并减少上述模型风险。


    ### 欧盟可信 AI 指南


    2021 年，欧盟委员会已对欧洲 AI 系统的使用进行了立法。


    ## 进一步总结


    基于风险，AI 和机器学习的广泛使用意味着现有的模型风险治理计划需要扩展。但同时，重要的是理解当前模型风险管理程序的局限性，这些限制防止了从数据、模型输入、基准、稳定性、性能和决策等方面获取模型健康的全局视角。

