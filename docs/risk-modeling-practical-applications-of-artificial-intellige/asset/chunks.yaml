- raw: "Batch processing ([Figure 6.2](#c06.xhtml#c06-fig-0002)) is a common way to\
    \ deploy many risk models. Large volumes of data that are collated over a period\
    \ can be processed in batch when convenient. This method is a highly efficient\
    \ way to score models for use cases that are not time sensitive. Typically, the\
    \ infrastructures required for batch deployments are simpler than those required\
    \ for real-time deployments. For example, to perform monthly scoring for limit\
    \ increase approvals, a process will extract data from source systems and apply\
    \ the data transformation, model scoring, and other post-processing logic to calculate\
    \ the model output, including the pre-approved limits. One of the main benefits\
    \ of batch processing is that compute resources can be planned for. It can be\
    \ made available for regular processing or scheduled to run off-peak:\n\n*   Generate\
    \ model output for business decisions that are not time sensitive.\n\n*   Data\
    \ inputs that are accumulated over a period before models are scored.\n\n### Deploying\
    \ Models in Real Time\n\nIn today's world, society has grown used to services\
    \ and systems that respond instantaneously. In this scenario, model outputs are\
    \ time sensitive, often with the expectation to be available on demand.\n\nFinancial\
    \ institutions are increasingly competing in supplying services and risk decisions\
    \ instantly. In such a scenario, risk models must be deployed in real time. For\
    \ example, for new loan approvals, the risk assessment of a customer based on\
    \ the input data gets generated immediately on request to decide to approve or\
    \ reject the application.\n\nAnother example is in fraud detection and prevention.\
    \ Financial institutions often have in place fraud detection models that were\
    \ developed on historical cases of suspicious transactions. These systems score\
    \ each new transaction based on a combination of customer and transaction information\
    \ to find suspicious activity. As the goal is to stop a fraudulent transaction\
    \ from being processed, these models need to supply answers in real time:\n\n\
    *   Model outputs for business decisions are time sensitive.\n\n*   Model outputs\
    \ are generated at the transactional level.\n\n*   Model output rates must be\
    \ as close as possible to data input rates.\n\nModern infrastructures are evolving\
    \ where we see variations to the deployment of models to batch or real-time applications.\n\
    \nIn some instances, mostly for batch deployments, the model logic can be deployed\
    \ to execute within a database, reducing the need for data movement, and increasing\
    \ the speed and efficiency of the scoring process.\n\nFinancial institutions are\
    \ also increasingly adopting a cloud-based, microservices architecture where models\
    \ are deployed as analytic services in containers. In this way, models are deployed\
    \ in the cloud as lightweight as possible. The container software manages the\
    \ operating layer and is accessed easily through an API endpoint. This option\
    \ supports both batch and real-time deployment scenarios.\n\nWe next explain three\
    \ deployment options for risk models: in-database deployment, to lightweight containers,\
    \ or directly in business decision workflows.\n\n### Deployment of Models in Database\
    \ Management Systems\n\nWith the explosion of data, big datasets are typically\
    \ stored in database management systems. To reduce the need for data movement,\
    \ modern technologies enable the deployment of data preparation, model logic,\
    \ and decision logic to where the data is residing, rather than moving the data\
    \ to a compute environment for processing. The benefits are reduced input/output\
    \ to transfer the data between systems, better performance, and a smaller memory\
    \ footprint needed for analytical processing.\n\n### Deployment of Models to Lightweight\
    \ Containers\n\nModels can also be deployed as lightweight containers. In this\
    \ case and in general, the container is exposed by an API to allow it to be accessed\
    \ from anywhere within a wider ecosystem. With the progressive adoption of software\
    \ applications being deployed as containers, this approach has been adopted for\
    \ models as well—it being particularly effective for open-source models, as running\
    \ in a container allows for easier management of the packages and dependencies\
    \ of the models.\n\nPutting models into containers makes it ideal for an organization\
    \ to run efficient analytical workloads in the cloud. Models deployed in containers\
    \ allow an organization to flexibly scale the infrastructure for running models,\
    \ as per their business needs. Model container deployment can suit both batch\
    \ and real-time paradigms, as containers can be scaled to meet computational requirements—for\
    \ example, every month (batch) or as more users are requesting model output from\
    \ a live web application (real time).\n\nAdditionally, within a cloud-based architecture,\
    \ containerizing models can greatly ease the integration of models with other\
    \ applications. Models as containers are managed by the same container orchestration\
    \ tools and CI/CD infrastructure as other software applications, essentially managing\
    \ them as analytical microservices.\n\n### Deployments in Business Decision Workflows\n\
    \nThe output of models can take on the form of predicted probabilities or predicted\
    \ numerical values. While informative, these results often need to be integrated\
    \ with business rules to deliver business-specific outcomes ([Figure 6.4](#c06.xhtml#c06-fig-0004)).\n\
    \n ![Figure 6.4 Deployment of models to decision strategies.](images/c06f004.png)\n\
    \n[**Figure 6.4**](#c06.xhtml#R_c06-fig-0004) Deployment of models to decision\
    \ strategies.\n\nIn the case for fraud detection, in isolation, the fraud model\
    \ would produce a predicted probability of a transaction being fraudulent. However,\
    \ there needs to be an integration with post-processing decision logic. An example\
    \ of that could be a combination of the transaction amount and the fraud probability\
    \ to compute an expected fraud amount. The expected fraud amount can help in prioritizing\
    \ flagged transactions for investigation.\n\nIt is through the integration with\
    \ decisioning workflows and business logic that the true business value can be\
    \ extracted from analytical models. Organizations with the technological capability\
    \ to automate the integration will realize the return on investment in AI and\
    \ machine learning more efficiently.\n\n## CASE STUDY: ENTERPRISE DECISIONING\
    \ AT A GLOBAL BANK\n\nOne of the largest banks in the world chose to strengthen\
