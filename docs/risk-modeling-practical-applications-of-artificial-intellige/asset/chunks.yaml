  fmt: '

    As mentioned, a key driver for innovation is the organization''s digital transformation
    objectives. A global trend is for financial services to modernize their technological
    infrastructure by combining on-premises and cloud-based architectures, resulting
    in a much open ecosystem and closer cooperation between developers and operations.
    For example, modern infrastructures have evolved from physical servers to cloud-based
    or hybrid architectures, which is a combination of on-premises environments and
    the public cloud. Also, the development process and management of new applications
    have evolved from a traditional waterfall approach to agile approaches, while
    the deployment of major updates has progressed from occasional upgrades (once
    or twice yearly) to software applications that follow a continuous integration/continuous
    development paradigm for deployment of updates.


    It is in this environment, with a greater degree of distribution and complexity,
    that modern risk models are developed, deployed, and maintained in production.


    These bottlenecks in having a streamlined and automated deployment in place are
    not limited to AI and machine learning—these apply to traditional, statistical
    models too, but given their complexity and self-learning characteristics, deployment
    challenges are often exacerbated with the use of AI and machine learning. With
    that in mind, let us review the key challenges in model deployment that organizations
    face.


    ### Lack of Structured Deployment Processes


    Analytical projects are often conducted in silos within most organizations—a reflection
    of how data is organized according to each internal department. This has led to
    the formation of fragmented analytics initiatives and capabilities. It also means
    that the governance and structuring of analytical initiatives is left to the responsibility
    of each department in turn, leading to longer model deployment cycles, without
    having a standardized enterprise-wide approach for analytical projects.


    Another hurdle is the separation between development and deployment environments.
    In some instances, organizations have adopted an experimental approach to analytics,
    which means that the model development is done in an ad-hoc way, rather than following
    a standardized process that is designed for a simplified deployment in production.
    Often, models are prevented from successful deployment due to the incorrect specification
    of the model logic, the input data, or limitations in operating systems (e.g.,
    some production systems cannot handle nonlinear transformations).


    Many organizations are actively seeking technological capabilities, which help
    centralize model development and deployment processes. The `SAS` platform introduces
    this capability by allowing organizations to define and track custom workflows
    for model lifecycle management. [Figure 6.1](#c06.xhtml#c06-fig-0001) is an example
    of how the end-to-end process can be structured in a series of tasks for developing,
    validating, and approving a model.


    ![Figure 6.1 A simplified workflow for model lifecycle management.](images/c06f001.png)


    [Figure 6.1](#c06.xhtml#R_c06-fig-0001) A simplified workflow for model lifecycle
    management.


    ### The Need to Manually Recode Complex Models


    As mentioned above, as models are typically developed in siloes, it requires translation
    of the model logic from one application system to another. Taking a hypothetical
    example, the back office may use a custom software application for statistical
    modeling to develop a new loss forecasting model. This model will need to be applied
    during a regular monthly impairment calculation process, as well as in a front
    office system for the pricing of new commercial loans. This will require the translation
    of the model logic into the system used for monthly impairment calculations, as
    well as into the front office system used by credit analysts as they structure
    new deals. This is a challenge as it increases the operational model risk (e.g.,
    potential for coding error in translation resulting in incorrect impairment values),
    delays in the model delivering value to the organization (as it takes time to
    recode the new model), and a lack of flexibility to make changes to the model
    in the event of a required model change.


    With consistently packaged algorithmic code and data that follows a “build once,
    deploy anywhere” approach, inefficient, repetitive, and manual deployment tasks
    can be avoided ([Figure 6.2](#c06.xhtml#c06-fig-0002)). In addition, it improves
    the scalability and agility of model deployments.


    ![Figure 6.2 Direct deployment to a batch process.](images/c06f002.png)


    [Figure 6.2](#c06.xhtml#R_c06-fig-0002) Direct deployment to a batch process.


    ### Managing Multiple Analytical Tools and Programming Languages


    In recent years, with the rapid development of open-source technologies, risk
    modelers have more flexibility and access to a range of modeling techniques, combined
    with support from open community forums. For the IT (information technology) departments,
    responsible for managing the deployment of new risk models, it requires knowledge
    of a range of different programming languages. A single deployment approach, regardless
    of model development language, that follows the same standardized process ([Figure
    6.3](#c06.xhtml#c06-fig-0003)) for a range of risk models provides flexibility
    to model developers in their preferences of programming language.


    ### Signoff and Approvals


    To productionize new risk models, proper signoffs, documentation, and approvals
    from internal and sometimes external stakeholders are needed. To include a new
    model in a “live” production system may require additional technical approvals
    and documentation. The model deployment and the ongoing maintenance of a model
    in a production system are subject to the governance framework, including having
    the necessary model contingency plans in place.


    ![Figure 6.3 Standardized model development and deployment process.](images/c06f003.png)


    [Figure 6.3](#c06.xhtml#R_c06-fig-0003) Standardized model development and deployment
    process.


    ### Adoption of Agile Practices for ModelOps


    Success and proficiency in the use of agile practices in developing and deploying
    software has led to the increased adoption of these practices for developing and
    deploying analytical models as well. Crucial to enabling agile practices is the
    use of the appropriate technology for an organization''s specific needs. The right
    technology enables efficient and reliable deployment of software, fast feedback
    for improvement, and enables greater experimentation to test new ideas—all of
    which are key goals of an agile method.


    Similarly, organizations are looking to achieve the same goals for analytical
    models. However, analytical models are more than just code—they are data dependent,
    have precise monitoring requirements, and are used to drive key business decisions.
    It is because of these distinctions that there is a challenge in taking only an
    IT-led agile approach, where tools designed to be effective for software development
    are ineffective for analytical models. Therefore, for an organization to adopt
    agile practices for models, also known as `ModelOps`, it must be able to design
    a process that includes appropriate analytical tools that can integrate with its
    existing successful agile software development practices.


    ## DEPLOYMENT SCENARIOS


    The decision on how to deploy a model is determined by how the outputs of the
    model are consumed. The choice of deployment scenario involves a distinct set
    of infrastructural requirements for the processing of the models within the context
    of how the model outcomes will be used. Typically, these resemble the following
    types of scenarios.


    ### Deploying Models in Batch Processes

