- raw: "Running climate-related stress tests is a good starting point. Keep in mind\
    \ that, for financial institutions, in general, the narratives of regulatory stress\
    \ testing may not be sufficient to capture the unique impacts of climate change.\
    \ Regulatory stress tests rely on only a handful of scenarios and broad-brush\
    \ model assumptions that are not necessarily specific to a firm's risk profile.\
    \ Responses are heavily reliant on human judgment.\n\nAlthough there are plans\
    \ to make regulatory and industry scenarios more granular, the scenarios currently\
    \ available do not capture the full range of potential pathways. In addition,\
    \ these do not account for policy changes or mitigating actions: for example,\
    \ mitigating events such as technological improvements in renewable energy to\
    \ avoid the physical risks before financial losses are realized.\n\nIn most cases,\
    \ the stress testing models in use today do not account for propagation channels\
    \ through micro- and macroeconomic drivers, nor the nonlinear relationships between\
    \ risk factors, mostly due to the popular use of linear modeling techniques.\n\
    \nIn addition to facilitating a more granular level of analysis of complex, nonlinear\
    \ relationships, i.e., help ascertain the direct and indirect influences of physical\
    \ and transition risks on the micro- and macroeconomy, and subsequently on financial\
    \ balance sheets, at the individual and interrelated level,\n\n### Stress Testing:\
    \ Getting a Foot in the Door\n\nOnce the fundamentals are in place, the simplest\
    \ way for a bank to build their climate risk management capacity is to extend\
    \ their stress testing framework to incorporate climate risk scenarios and simulations.\
    \ The extension will require to run scenarios with much longer time horizons (to\
    \ 2050 and even 2100). As mentioned earlier, regulators and other industry bodies\
    \ are releasing forward-looking climate stress tests to help ease the burden on\
    \ financial institutions having to design their own scenarios. Of these, the Bank\
    \ of England's Prudential Regulatory Authority (PRA) has published one of the\
    \ most comprehensive climate stress tests to date.\n\n#### *Biennial Exploratory\
    \ Scenario*\n\nThe Bank of England developed a 2021 biennial exploratory scenario\
    \ (BES) that draws on the lessons learned from climate scenarios in the 2019 Insurance\
    \ Stress Tests. The aim is to:\n\n*   Help understand the size of financial exposures\
    \ of participating organizations to climate risk.\n\n*   Identify what the challenges\
    \ are to models posed by climate risks.\n\n*   Help strengthen the management\
    \ of climate risk of participating organizations and financial systems.\n\nThe\
    \ key features of the BES are summarized in [Figure 9.1](#c09.xhtml#c09-fig-0001)\
    \ Key aspects include:\n\n*   Three scenarios, or stylized climate pathways, including\
    \ physical and transition risk variables that are mapped to macroeconomic and\
    \ financial variables.\n\n    ![Figure 9.1 Key features of the Bank of England\
    \ (BOE) biennial exploratory scenario (BES). ¶ Source: Adapted from Bank of England,\
    \ 2019. Discussion Paper—The 2021 biennial exploratory scenario on the financial\
    \ risks from climate change, London, United Kingdom: Bank of England.](images/c09f001.png)\n\
    \n    [**Figure 9.1**](#c09.xhtml#R_c09-fig-0001) Key features of the Bank of\
    \ England (BOE) biennial exploratory scenario (BES). ¶ Source: Adapted from Bank\
    \ of England, 2019. Discussion Paper—The 2021 biennial exploratory scenario on\
    \ the financial risks from climate change, London, United Kingdom: Bank of England.\n\
    \n    *   The scenarios include:\n\n*   *   1.  Early policy action where transition\
    \ to a carbon-neutral economy occurs early and a warming event of less than 2\
    \ degrees Celsius occurs in line with the Paris agreement\n\n        2.  Late\
    \ policy action to align with global climate goals with a delay to transition\
    \ to a carbon neutral economy\n\n        3.  No policy actions\n\n*   *   The\
    \ climate risk variables include: \n\n        *   Physical risk variables \n\n\
    \            *   Global and regional temperature pathways\n\n            *   Frequency\
    \ and severity of specific climate-related hazards in regions with material exposure\
    \ (including UK flood, subsidence, and freeze)\n\n            *   Longevity\n\n\
    \            *   Agricultural productivity\n\n        *   Transition risk variables\
    \ \n\n            *   Carbon price pathways\n\n            *   Emissions pathways\
    \ (aggregate, and decomposed into regions and sectors)\n\n            *   Commodity\
    \ and energy prices (including renewables), by fuel type\n\n            *   Energy\
    \ mix\n\n        *   The corresponding macroeconomic and financial variables include:\
    \ \n\n            *   Macroeconomic variables\n\n            *   Real GDP (gross\
    \ domestic product)—aggregate and decomposed by sector\n\n            *   Unemployment\
    \ rate\n\n            *   Inflation\n\n            *   Central bank rates\n\n\
    \            *   Corporate profits—aggregate and decomposed by sector\n\n    \
    \        *   Household income\n\n            *   Residential and commercial property\
    \ prices\n\n        *   Financial variables \n\n            *   Government bond\
    \ yields for major economies\n\n            *   Corporate bond yields for major\
    \ economies—investment grade and high yield\n\n            *   Equity indices\n\
    \n            *   Exchange rates\n\n            *   Bank rates\n\nAs part of sizing\
    \ the risks on their assets of the climate scenarios, participants modeled the\
    \ impact based on three levels of granularity, namely: corporate exposures, household\
    \ exposures, and government exposures. For these exposures, participants were\
    \ encouraged to assess individual corporate counterparty-risk using climate disclosures\
    \ like those released by the TCFD. A challenge was how to assess corporate counterparties\
    \ at the counterparty level, given that there is not a standardized set of information\
    \ on emissions data available. The regulator used the findings from the exploratory\
    \ exercise to assess the safety and soundness of the financial system under the\
    \ different scenarios, and to determine whether additional capital to absorb climate\
    \ risk losses is necessary. Based on the responses from participants and the analysis\
    \ of the regulator, a key finding from the CBES exercise is that climate risk\
    \ will place a drag on the profitability of banks, making the system more vulnerable\
    \ to future potential shocks. At this stage, the regulator did not introduce a\
    \ climate-specific capital add-on.\n\n#### *Climate Scenarios Developed by the\
    \ Network for Greening the Financial System*\n\nThe Network for Greening the Financial\
    \ System (NGFS) published climate scenarios in 2020 and their updated version\
    \ in 2021. A set of six scenarios were provided based on these dimensions:\n\n\
    *   **Orderly scenarios.** Climate risk policies are introduced early and become\
    \ more stringent over time.\n\n*   **Disorderly scenarios.** Climate risk policies\
    \ are either delayed or vary across countries and sectors.\n\n*   **Hothouse scenarios.**\
    \ Climate risk policies are implemented in some jurisdictions only, but overall\
    \ global efforts are insufficient to address climate change.\n\nDespite the challenges\
    \ associated with climate stress testing, scenario analysis and simulations, and\
    \ heavy reliance on expert judgment, several financial institutions in jurisdictions\
    \ such as those across Europe, the Middle East, and Africa (EMEA) and Asia Pacific\
    \ (APAC) are building capacity to improve quantifying climate risk by collecting\
    \ climate data, integrating that with their incumbent data management processes,\
    \ and performing early-stage stress testing and scenario analysis that are broadly\
    \ aligned to those of the NGFS. Financial institutions are either utilizing their\
    \ existing risk models by augmenting with climate-based variables, or creating\
    \ new climate risk models.\n\n### Firms Can Start by Strengthening Their Analytics\
    \ Frameworks\n\nWith all this in mind, it is no wonder that organizations are\
    \ not sure where to start."
  fmt: "\nRunning climate-related stress tests is a good starting point. Keep in mind\
    \ that, for financial institutions, in general, the narratives of regulatory stress\
    \ testing may not be sufficient to capture the unique impacts of climate change.\
    \ Regulatory stress tests rely on only a handful of scenarios and broad-brush\
    \ model assumptions that are not necessarily specific to a firm's risk profile.\
    \ Responses are heavily reliant on human judgment.\n\nAlthough there are plans\
    \ to make regulatory and industry scenarios more granular, the scenarios currently\
    \ available do not capture the full range of potential pathways. In addition,\
    \ these do not account for policy changes or mitigating actions: for example,\
    \ mitigating events such as technological improvements in renewable energy to\
    \ avoid the physical risks before financial losses are realized.\n\nIn most cases,\
    \ the stress testing models in use today do not account for propagation channels\
    \ through micro- and macroeconomic drivers, nor the nonlinear relationships between\
    \ risk factors, mostly due to the popular use of `linear modeling` techniques.\n\
    \nIn addition to facilitating a more granular level of analysis of complex, nonlinear\
    \ relationships, i.e., help ascertain the direct and indirect influences of physical\
    \ and transition risks on the micro- and macroeconomy, and subsequently on financial\
    \ balance sheets, at the individual and interrelated level,\n\n## Stress Testing:\
    \ Getting a Foot in the Door\n\nOnce the fundamentals are in place, the simplest\
    \ way for a bank to build their climate risk management capacity is to extend\
    \ their stress testing framework to incorporate climate risk scenarios and simulations.\
    \ The extension will require to run scenarios with much longer time horizons (to\
    \ 2050 and even 2100). As mentioned earlier, regulators and other industry bodies\
    \ are releasing forward-looking climate stress tests to help ease the burden on\
    \ financial institutions having to design their own scenarios. Of these, the Bank\
    \ of England's Prudential Regulatory Authority (`PRA`) has published one of the\
    \ most comprehensive climate stress tests to date.\n\n### Biennial Exploratory\
    \ Scenario\n\nThe Bank of England developed a 2021 biennial exploratory scenario\
    \ (`BES`) that draws on the lessons learned from climate scenarios in the 2019\
    \ Insurance Stress Tests. The aim is to:\n\n* Help understand the size of financial\
    \ exposures of participating organizations to climate risk.\n* Identify what the\
    \ challenges are to models posed by climate risks.\n* Help strengthen the management\
    \ of climate risk of participating organizations and financial systems.\n\nThe\
    \ key features of the `BES` are summarized in [Figure 9.1](#c09.xhtml#c09-fig-0001)\
    \ Key aspects include:\n\n* Three scenarios, or stylized climate pathways, including\
    \ physical and transition risk variables that are mapped to macroeconomic and\
    \ financial variables.\n\n  ![Figure 9.1 Key features of the Bank of England (BOE)\
    \ biennial exploratory scenario (BES). ¶ Source: Adapted from Bank of England,\
    \ 2019. Discussion Paper—The 2021 biennial exploratory scenario on the financial\
    \ risks from climate change, London, United Kingdom: Bank of England.](images/c09f001.png)\n\
    \n  [`Figure 9.1`](#c09.xhtml#R_c09-fig-0001) Key features of the Bank of England\
    \ (`BOE`) biennial exploratory scenario (`BES`). ¶ Source: Adapted from Bank of\
    \ England, 2019. Discussion Paper—The 2021 biennial exploratory scenario on the\
    \ financial risks from climate change, London, United Kingdom: Bank of England.\n\
    \n* The scenarios include:\n    * 1. Early policy action where transition to a\
    \ carbon-neutral economy occurs early and a warming event of less than 2 degrees\
    \ Celsius occurs in line with the Paris agreement\n    * 2. Late policy action\
    \ to align with global climate goals with a delay to transition to a carbon neutral\
    \ economy\n    * 3. No policy actions\n* The climate risk variables include:\n\
    \    * Physical risk variables\n        * Global and regional temperature pathways\n\
    \        * Frequency and severity of specific climate-related hazards in regions\
    \ with material exposure (including UK flood, subsidence, and freeze)\n      \
    \  * Longevity\n        * Agricultural productivity\n    * Transition risk variables\n\
    \        * Carbon price pathways\n        * Emissions pathways (aggregate, and\
    \ decomposed into regions and sectors)\n        * Commodity and energy prices\
    \ (including renewables), by fuel type\n        * Energy mix\n    * The corresponding\
    \ macroeconomic and financial variables include:\n        * Macroeconomic variables\n\
    \        * Real `GDP` (gross domestic product)—aggregate and decomposed by sector\n\
    \        * Unemployment rate\n        * Inflation\n        * Central bank rates\n\
    \        * Corporate profits—aggregate and decomposed by sector\n        * Household\
    \ income\n        * Residential and commercial property prices\n        * Financial\
    \ variables\n        * Government bond yields for major economies\n        * Corporate\
    \ bond yields for major economies—investment grade and high yield\n        * Equity\
    \ indices\n        * Exchange rates\n        * Bank rates\n\nAs part of sizing\
    \ the risks on their assets of the climate scenarios, participants modeled the\
    \ impact based on three levels of granularity, namely: corporate exposures, household\
    \ exposures, and government exposures. For these exposures, participants were\
    \ encouraged to assess individual corporate counterparty-risk using climate disclosures\
    \ like those released by the `TCFD`. A challenge was how to assess corporate counterparties\
    \ at the counterparty level, given that there is not a standardized set of information\
    \ on emissions data available. The regulator used the findings from the exploratory\
    \ exercise to assess the safety and soundness of the financial system under the\
    \ different scenarios, and to determine whether additional capital to absorb climate\
    \ risk losses is necessary. Based on the responses from participants and the analysis\
    \ of the regulator, a key finding from the `CBES` exercise is that climate risk\
    \ will place a drag on the profitability of banks, making the system more vulnerable\
    \ to future potential shocks. At this stage, the regulator did not introduce a\
    \ climate-specific capital add-on.\n\n### Climate Scenarios Developed by the Network\
    \ for Greening the Financial System\n\nThe Network for Greening the Financial\
    \ System (`NGFS`) published climate scenarios in 2020 and their updated version\
    \ in 2021. A set of six scenarios were provided based on these dimensions:\n\n\
    * **Orderly scenarios.** Climate risk policies are introduced early and become\
    \ more stringent over time.\n* **Disorderly scenarios.** Climate risk policies\
    \ are either delayed or vary across countries and sectors.\n* **Hothouse scenarios.**\
    \ Climate risk policies are implemented in some jurisdictions only, but overall\
    \ global efforts are insufficient to address climate change.\n\nDespite the challenges\
    \ associated with climate stress testing, scenario analysis and simulations, and\
    \ heavy reliance on expert judgment, several financial institutions in jurisdictions\
    \ such as the across Europe, the Middle East, and Africa (`EMEA`) and Asia Pacific\
    \ (`APAC`) are building capacity to improve quantifying climate risk by collecting\
    \ climate data, integrating that with their incumbent data management processes,\
    \ and performing early-stage stress testing and scenario analysis that are broadly\
    \ aligned to those of the `NGFS`. Financial institutions are either utilizing\
    \ their existing risk models by augmenting with climate-based variables, or creating\
    \ new climate risk models.\n\n## Firms Can Start by Strengthening Their Analytics\
    \ Frameworks\n\nWith all this in mind, it is no wonder that organizations are\
    \ not sure where to start.\n"
  trans: "\n开展气候相关的压力测试是一个很好的起点。请记住，对于金融机构而言，通常情况下监管压力测试的叙事可能不足以捕捉气候变化带来的独特影响。监管压力测试依赖于少数几种场景和泛化的模型假设，而这些假设并不一定适用于特定企业的风险概况。测试结果很大程度上依赖于人类判断。\n\
    \n尽管计划使监管和行业场景更具细粒度，但目前可用的场景尚未涵盖所有潜在的路径。此外，这些场景没有考虑到政策变化或缓解措施：例如，在财务损失发生之前，通过可再生能源的技术改进等缓解事件来避免物理风险。\n\
    \n在大多数情况下，目前使用的压力测试模型没有考虑到通过微观和宏观驱动因素进行传播渠道，也没有考虑到风险因素之间的非线性关系，这主要是因为广泛使用了`linear\
    \ modeling`（线性建模）技术。\n\n除了有助于对复杂的非线性关系进行更细粒度的分析外（即有助于确定物理风险和转型风险对微观和宏观经济，随后对个人及关联层面的财务资产负债表的直接和间接影响），\n\
    \n\n\n## 压力测试：入门\n\n一旦基础工作到位，银行建立其气候风险管理能力最简单的方法就是将其压力测试框架扩展，以纳入气候风险场景和模拟。这种扩展要求运行时间跨度长得多的场景（到\
    \ 2050 年甚至 2100 年）。如前所述，监管机构和其他行业机构正在发布前瞻性的气候压力测试，以减轻金融机构自行设计场景的负担。在这些测试中，英国银行审监管局（`PRA`）发布了迄为止最全面的气候压力测试之一。\n\
    \n### 两年探索性场景\n\n英国银行开发了 2021 年两年探索性场景（`BES`），该场景借鉴了 2019 年保险压力测试中气候场景的经验。其目标是：\n\
    \n* 帮助理解参与机构气候风险的财务敞口规模。\n* 识别气候风险给模型带来的挑战。\n* 帮助加强参与机构和金融系统气候风险的管理。\n\n`BES`\
    \ 的关键特征总结在图 9.1 中，关键方面包括：\n\n* 三种场景（或风格化的气候路径），包括物理风险和转型风险变量，这些变量被映射到宏观经济和财务变量。\n\
    \n  ![Figure 9.1 Key features of the Bank of England (BOE) biennial exploratory\
    \ scenario (BES). ¶ Source: Adapted from Bank of England, 2019. Discussion Paper—The\
    \ 2021 biennial exploratory scenario on the financial risks from climate change,\
    \ London, United Kingdom: Bank of England.](img/c09f001.png)\n\n  `Figure 9.1`\
    \ 英国银行（`BOE`）两年探索性场景（`BES`）的关键特征。来源：改编自 Bank of England, 2019. Discussion Paper—The\
    \ 2021 biennial exploratory scenario on the financial risks from climate change,\
    \ London, United Kingdom: Bank of England.\n\n* 场景包括：\n    * 1. 早期政策行动：向碳中和经济转型较早，且根据巴黎协定发生了低于\
    \ 2 摄氏度的升温事件。\n    * 2. 晚期政策行动：为了符合全球气候目标而延迟了向碳中经济的转型。\n    * 3. 无政策行动\n* 气候风险变量包括：\n\
    \    * 物理风险变量\n        * 全球和区域温度路径\n        * 具有重大敞口的地区特定气候相关危害的频率和强度（包括英国的洪水、沉降和冻结）\n\
    \        * 寿命\n        * 农业生产力\n    * 转型风险变量\n        * 碳价路径\n        * 排放路径（总量，并按地区和部门分解）\n\
    \        * 商品和能源价格（包括可再生能源），按燃料类型\n        * 能源结构\n    * 相应的宏观经济和财务变量包括：\n   \
    \     * 宏观经济变量\n        * 实际`GDP`（国内总产）——总量及按部门分解\n        * 失业率\n        * 通货膨胀\n\
    \        * 利率\n        * 企业利润——总量及按部门分解\n        * 家庭收入\n        * 住宅和商业物业价格\n\
    \        * 财务变量\n        * 主要经济体的债券收益率\n        * 主要经济体的企业债券收益率——投资级和高收益\n   \
    \     * 股票指数\n        * 汇率\n        * 银行利率\n\n作为衡量资产气候场景风险规模的一部分，参与者根据三个细粒度级别进行建模，即：企业敞口、家庭敞口和政府敞口。对于这些敞口，鼓励参与者使用如`TCFD`发布的气候披露信息来评估单个企业交易对手风险。面临的挑战在于，由于没有标准化的排放数据信息可用，如何在交易对手层级评估企业交易对手。监管机构利用这项探索性练习的结果，来评估在不同场景下金融系统的安全性和稳健性，并确定是否需要额外的资本来吸收气候风险损失。根据参与者的反馈和监管机构的分析，`CBES`练习的一项关键发现是，气候风险将拖累银行的盈利，使系统对未来的潜在冲击变得更加脆弱。在此阶段，监管机构尚未引入针对气候的特定资本附加。\n\
    \n### 金融系统绿色化网络开发的气候场景\n\n金融系统绿色化网络（`NGFS`）于 2020 年发布了气候场景，并在 2021 年发布了更新版本。基于这些维度提供了一组六场景：\n\
    \n* **有序场景**。气候风险政策较早引入并随着时间的推移变得严格。\n* **无序场景**。气候风险政策推迟，或在不同国家和部门之间存在差异。\n*\
    \ **温室场景**。气候风险政策仅在某些司法管辖区实施，但全球努力不足以应对气候变化。\n\n尽管气候压力测试、场景分析和模拟存在对专家判断的高度依赖挑战，但欧洲、中东和非洲（`EMEA`）以及亚太地区（`APAC`）等地区的若干金融机构正在通过收集气候数据、将其与现有的数据管理流程相结合，并进行与`NGFS`大致保持一致的早期压力测试和场景分析，以建立改进量化气候风险的能力。金融机构要么通过增加气候变量来扩用其现有的风险模型，要么创建新的气候风险模型。\n\
    \n## 企业可以从加强其分析框架开始\n\n考虑到这一切，各机构不知道从何开始也难怪了。\n\n"
