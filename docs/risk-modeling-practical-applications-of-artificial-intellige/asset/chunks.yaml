- raw: "Traditional models can be used as benchmarks for AI and machine learning.\
    \ Benchmark models are typically developed under the same major assumptions of\
    \ the AI and machine learning. The robustness and performance of both the traditional\
    \ and AI or machine learning model can then be measured and compared for statistically\
    \ significant differences.\n\n### Interpretability\n\nTraditional models tend\
    \ to use defined variable selection and model fitting methods that are directly\
    \ explainable. For example, the parameter estimates of a generalized-linear model\
    \ (GLM) can be interpreted directly, reflecting the contributions of the features,\
    \ and thus the model is interpretable from its parameter estimates. The coefficients\
    \ of a machine learning model like a gradient-boosting machine (GBM) cannot be\
    \ interpreted directly, and so they need alternative measures of interpretability.\n\
    \n#### *Variable Importance*\n\nThe lack of interpretation is suboptimal for AI\
    \ and machine learning, as it needs a consistent method to assess variable importance\
    \ across a range of methods. A generalized way of assessing the variable importance\
    \ of AI and machine learning is to fit a decision tree to approximate model predictions\
    \ to identify and prioritize variables in order of importance. Another way is\
    \ to create a parameter that extends the classical R2 method of linear regression\
    \ that provides a description of the relationship between model predictions and\
    \ input features.\n\n#### *Partial Dependence*\n\nPartial dependence (PD) plots\
    \ are a model-agnostic explainability measure that can be used to interpret an\
    \ AI and machine learning at the global level. Model-agnostic measures like PD\
    \ plots are applied to supervised AI and machine learning.\n\n![Figure 7.4 Variable\
    \ importance: An example. Here, the train importance value corresponds to the\
    \ contribution the variable makes to the success of the model—the higher the value,\
    \ then the more plausible it is that the variable represents the true cause of\
    \ prediction.](images/c07f004.png)\n\n[**Figure 7.4**](#c07.xhtml#R_c07-fig-0501)\
    \ Variable importance: An example. Here, the train importance value corresponds\
    \ to the contribution the variable makes to the success of the model—the higher\
    \ the value, then the more plausible it is that the variable represents the true\
    \ cause of prediction.\n\nThe PD plot ([Figure 7.5](#c07.xhtml#c07-fig-0004))\
    \ measures the contribution of each feature by measuring how the model prediction\
    \ changes with changes in the feature values. This is done by perturbing the input\
    \ data and averaging the effect of a feature for the entire data. A more detailed\
    \ description of PD plots is provided in [Chapter 4](#c04.xhtml). Using a descriptive\
    \ example, a PD plot shows the increase in prediction estimate with an increase\
    \ in current payment status. The PD plot is displaying the relationship between\
    \ the input feature (independent variable) and target variable. PD plots are useful\
    \ to display the “marginal effect” of a variable on the prediction outcome.\n\n\
    #### *Individual Conditional Expectation*\n\nIndividual conditional expectation\
    \ (ICE) plots ([Figure 7.6](#c07.xhtml#c07-fig-0005)) separate the PD function\
    \ for each observation or at the subgroup level. They are helpful to identify\
    \ trends, differences, and interactions.\n\n ![Figure 7.5 Partial dependence (PD)\
    \ plot: An example. The independent variable x1 vs. the model outcome bar, after\
    \ considering the average effect of other independent variables in the model.](images/c07f005.png)\n\
    \n[**Figure 7.5**](#c07.xhtml#R_c07-fig-0004) Partial dependence (PD) plot: An\
    \ example. The independent variable x1 vs. the model outcome bar, after considering\
    \ the average effect of other independent variables in the model.\n\n![Figure\
    \ 7.6 Diagrammatical representation of the individual conditional expectation\
    \ (ICE) plot. The ICE plot displays the relationship to the outcome model prediction.](images/c07f006.png)\n\
    \n[**Figure 7.6**](#c07.xhtml#R_c07-fig-0005) Diagrammatical representation of\
    \ the individual conditional expectation (ICE) plot. The ICE plot displays the\
    \ relationship to the outcome model prediction.\n\n#### *Shapley Values*\n\nShapley\
    \ values are another model-agnostic measure of model explainability. The Shapley\
    \ value calculates the variable contributions by averaging the marginal contribution\
    \ across all coalitions. This enables Shapley values to control for variable interactions.\
    \ For example, in [Figure 7.7](#c07.xhtml#c07-fig-0006), variables rank in ascending\
    \ order. The horizontal location displays whether the effect of that value is\
    \ associated with a higher or lower prediction. In this example, the observation\
    \ demarcated by local instance 8001441 has a predicted value of 0 in the model\
    \ training data. The borrowers' current payment plan status and limit balance\
    \ have contributed to the prediction.\n\n### Anomaly Detection\n\nIdeally, anomaly\
    \ detection systems for AI and machine learning should have ability to collect\
    \ useful features from high-dimensional data and find deviations from normal behavior.\
    \ Autoencoders can design anomaly detection systems for AI and machine learning,\
    \ as they reduce the number of units in the hidden layers of a neural network,\
    \ for example, to reduce the dimensionality of data. The autoencoder functions\
    \ as a feature extraction method. Here, the autoencoder learns the “normal” data\
    \ points—anomalies are absent from the training data. When the autoencoder reconstructs,\
    \ anomalous data points will fail. ![Figure 7.7 Shapley value calculation using\
    \ the kernel explainer: An example.](images/c07f007.png)\n\n[**Figure 7.7**](#c07.xhtml#R_c07-fig-0006)\
    \ Shapley value calculation using the kernel explainer: An example.\n\n### Bias\n\
    \nAI and machine learning are susceptible to either performance or results bias.\
    \ We discuss the concept of performance bias in [Chapter 5](#c05.xhtml). Specifically,\
    \ results bias refers to the model output that is statistically different for\
    \ one “group” compared to another, or to benchmarks determined from the model\
    \ development data or another benchmark sample. For the purposes of monitoring\
    \ bias in an AI and machine learning, results bias is measured using a suitable\
    \ computed metric (e.g., demographic parity), including tolerance thresholds.\
    \ Bias may be introduced indirectly for various reasons, including internal policy\
    \ changes, external regulatory compliance, or that there is not a sufficiently\
    \ long history of observational data available for one “group” compared to another.\
    \ When differences are observed, it can trigger a review to identify the cause\
    \ for bias.\n\n### Model Adjustments\n\nAI and machine learning typically utilize\
    \ advanced methods to optimize the objective function of the algorithms. AI and\
    \ machine learning are often regularly retrained using new training data. Risk\
    \ models need retraining for several reasons. For example:\n\n*   **External conditions.**\
    \ Factors such as updated interest rates, updated systems, and associated data\
    \ can initiate the need to retrain models.\n\n*   **Strategy changes.** If it\
    \ becomes clear during the development period that the model is not capturing\
    \ business changes or changes in business strategy, the models could require retraining.\n\
    \n*   **Business performance.** Changes in the use and performance of a model,\
    \ for example, due to the COVID-19 pandemic, can trigger a model retraining effort.\n\
    \n## COMPLIANCE CONSIDERATIONS\n\nRegulatory bodies around the world are starting\
    \ to propose regulations and compliance guidelines on all aspects of AI and machine\
    \ learning, including data privacy usage, ethics guidelines, and specific model\
    \ risk management frameworks. However, the depth and breadth of these regulations\
    \ and compliance guidelines depends on the rate of adoption of AI and machine\
    \ learning in jurisdictions. Selected compliance considerations to be aware of\
    \ include:\n\n*   Global Data Protection Regulation (GDPR).\n\n*   Equal Credit\
    \ Opportunity Act (ECOA)—updated CFPB for small business loans.\n\n*   SR Letter\
    \ 11-7—updated guidance for AI and machine learning."
  fmt: "\nTraditional models can be used as benchmarks for AI and machine learning.\
    \ Benchmark models are typically developed under the same major assumptions of\
    \ the AI and machine learning. The robustness and performance of both the traditional\
    \ and AI or machine learning model can then be measured and compared for statistically\
    \ significant differences.\n\n## Interpretability\n\nTraditional models tend to\
    \ use defined variable selection and model fitting methods that are directly explainable.\
    \ For example, the parameter estimates of a generalized-linear model (`GLM`) can\
    \ be interpreted directly, reflecting the contributions of the features, and thus\
    \ the model is interpretable from its parameter estimates. The coefficients of\
    \ a machine learning model like a gradient-boosting machine (`GBM`) cannot be\
    \ interpreted directly, and so they need alternative measures of interpretability.\n\
    \n### Variable Importance\n\nThe lack of interpretation is suboptimal for AI and\
    \ machine learning, as it needs a consistent method to assess variable importance\
    \ across a range of methods. A generalized way of assessing the variable importance\
    \ of AI and machine learning is to fit a decision tree to approximate model predictions\
    \ to identify and prioritize variables in order of importance. Another way is\
    \ to create a parameter that extends the classical `R2` method of linear regression\
    \ that provides a description of the relationship between model predictions and\
    \ input features.\n\n### Partial Dependence\n\nPartial dependence (`PD`) plots\
    \ are a model-agnostic explainability measure that can be used to interpret an\
    \ AI and machine learning at the global level. Model-agnostic measures like `PD`\
    \ plots are applied to supervised AI and machine learning.\n\n![Figure 7.4 Variable\
    \ importance: An example. Here, the train importance value corresponds to the\
    \ contribution the variable makes to the success of the model—the higher the value,\
    \ then the more plausible it is that the variable represents the true cause of\
    \ prediction.](images/c07f004.png)\n\n[**Figure 7.4**](#c07.xhtml#R_c07-fig-0501)\
    \ Variable importance: An example. Here, the train importance value corresponds\
    \ to the contribution the variable makes to the success of the model—the higher\
    \ the value, then the more plausible it is that the variable represents the true\
    \ cause of prediction.\n\nThe `PD` plot ([Figure 7.5](#c07.xhtml#c07-fig-0004))\
    \ measures the contribution of each feature by measuring how the model prediction\
    \ changes with changes in the feature values. This is done by perturbing the input\
    \ data and averaging the effect of a feature for the entire data. A more detailed\
    \ description of `PD` plots is provided in [Chapter 4](#c04.xhtml). Using a descriptive\
    \ example, a `PD` plot shows the increase in prediction estimate with an increase\
    \ in current payment status. The `PD` plot is displaying the relationship between\
    \ the input feature (independent variable) and target variable. `PD` plots are\
    \ useful to display the “marginal effect” of a variable on the prediction outcome.\n\
    \n### Individual Conditional Expectation\n\nIndividual conditional expectation\
    \ (`ICE`) plots ([Figure 7.6](#c07.xhtml#c07-fig-0005)) separate the `PD` function\
    \ for each observation or at the subgroup level. They are helpful to identify\
    \ trends, differences, and interactions.\n\n ![Figure 7.5 Partial dependence (PD)\
    \ plot: An example. The independent variable x1 vs. the model outcome bar, after\
    \ considering the average effect of other independent variables in the model.](images/c07f005.png)\n\
    \n[**Figure 7.5**](#c07.xhtml#R_c07-fig-0004) Partial dependence (`PD`) plot:\
    \ An example. The independent variable `x1` vs. the model outcome bar, after considering\
    \ the average effect of other independent variables in the model.\n\n![Figure\
    \ 7.6 Diagrammatical representation of the individual conditional expectation\
    \ (ICE) plot. The ICE plot displays the relationship to the outcome model prediction.](images/c07f006.png)\n\
    \n[**Figure 7.6**](#c07.xhtml#R_c07-fig-0005) Diagrammatical representation of\
    \ the individual conditional expectation (`ICE`) plot. The `ICE` plot displays\
    \ the relationship to the outcome model prediction.\n\n### Shapley Values\n\n\
    Shapley values are another model-agnostic measure of model explainability. The\
    \ Shapley value calculates the variable contributions by averaging the marginal\
    \ contribution across all coalitions. This enables Shapley values to control for\
    \ variable interactions. For example, in [Figure 7.7](#c07.xhtml#c07-fig-0006),\
    \ variables rank in ascending order. The horizontal location displays whether\
    \ the effect of that value is associated with a higher or lower prediction. In\
    \ this example, the observation demarcated by local instance `8001441` has a predicted\
    \ value of `0` in the model training data. The borrowers' current payment plan\
    \ status and limit balance have contributed to the prediction.\n\n## Anomaly Detection\n\
    \nIdeally, anomaly detection systems for AI and machine learning should have ability\
    \ to collect useful features from high-dimensional data and find deviations from\
    \ normal behavior. Autoencoders can design anomaly detection systems for AI and\
    \ machine learning, as they reduce the number of units in the hidden layers of\
    \ a neural network, for example, to reduce the dimensionality of data. The autoencoder\
    \ functions as a feature extraction method. Here, the autoencoder learns the “normal”\
    \ data points—anomalies are absent from the training data. When the autoencoder\
    \ reconstructs, anomalous data points will fail. ![Figure 7.7 Shapley value calculation\
    \ using the kernel explainer: An example.](images/c07f007.png)\n\n[**Figure 7.7**](#c07.xhtml#R_c07-fig-0006)\
    \ Shapley value calculation using the kernel explainer: An example.\n\n## Bias\n\
    \nAI and machine learning are susceptible to either performance or results bias.\
    \ We discuss the concept of performance bias. Specifically, results bias refers\
    \ to the model output that is statistically different for one “group” compared\
    \ to another, or to benchmarks determined from the model development data or another\
    \ benchmark sample. For the purposes of monitoring bias in AI and machine learning,\
    \ results bias is measured using a suitable computed metric (e.g., demographic\
    \ parity), including tolerance thresholds. Bias may be introduced indirectly for\
    \ various reasons, including internal policy changes, external regulatory compliance,\
    \ or that there is not a sufficiently long history of observational data for one\
    \ “group” compared to another. When differences are observed, it can trigger a\
    \ review to identify the cause for bias.\n\n### Model Adjustments\n\nAI and machine\
    \ learning typically utilize advanced methods to optimize the objective function\
    \ of the algorithms. AI and machine learning are often regularly retrained using\
    \ new training data. Risk models need retraining for several reasons. For example:\n\
    \n- **External conditions.** Factors such as updated interest rates, updated systems,\
    \ and associated data can initiate the need to retrain models.\n- **Strategy changes.**\
    \ If it becomes clear during the development period that the model is not capturing\
    \ business changes or changes in business strategy, the models could require retraining.\n\
    - **Business performance.** Changes in the use and performance of a model, for\
    \ example, due to the COVID-19 pandemic, can trigger a model retraining effort.\n\
    \n## Compliance Considerations\n\nRegulatory bodies around the world are starting\
    \ to propose regulations and compliance guidelines on all aspects of AI and machine\
    \ learning, including data privacy usage, ethics guidelines, and specific model\
    \ risk management frameworks. However, the depth and breadth of these regulations\
    \ and compliance guidelines depends on the rate of adoption of AI and machine\
    \ learning in jurisdictions. Selected compliance considerations to be aware of\
    \ include:\n\n- Global Data Protection Regulation (`GDPR`).\n- Equal Credit Opportunity\
    \ Act (`ECOA`)—updated CFPB for small business loans.\n- `SR Letter 11-7`—updated\
    \ guidance for AI and machine learning.\n"
  trans: "\n传统模型可以作为 AI 和机器学习的基准。基准模型通常在与 AI 和机器学习相同的重大假设下开发。随后，可以对传统模型与 AI 或机器学习模型的稳健性和性能进行衡量和比较，以是否存在统计学上的显著差异。\n\
    \n## 可解释性\n\n传统模型倾向于使用可以直接解释的定义变量选择和模型拟合方法。例如，广义模型（`GLM`）的参数估计可以直接解释，反映了特征的贡献，因此模型从其参数估计来看具有解释性。而像梯度提升机（`GBM`）等机器学习模型的系数无法直接解释，因此它们需要替代的解释性指标。\n\
    \n### 变量重要性\n\n缺乏解释性对 AI 和机器学习来说是次优的，因为需要一种一致的方法来评估不同方法之间的变量重要性。评估 AI 和机器学习变量重要性的通用方法是拟合一个决策树来近似模型预测，以按重要性顺序识别并对变量进行排序。另一种方法是创建一个扩展了线性回归经典\
    \ `R2` 方法的参数，该参数提供了模型预测与输入特征之间关系的描述。\n\n### 部分依赖性\n\n部分依赖性（`PD`）图是一种模型无关的解释性指标，可从全局层面解释\
    \ AI 和机器学习。像 `PD` 图这样的模型无关指标被应用于监督式 AI 和机器学习。\n\n![图 7.4 变量重要性：一个示例。这里，训练重要性值对应于变量对模型成功的贡献——值越高，该变量代表预测真实原因的可能性越大。](img/c07f004.png)\n\
    \n**图 7.4** 变量重要性：一个示例。这里，训练重要性值对应于变量对模型成功的贡献——值越高，该变量代表预测真实原因的可能性越大。\n\n`PD`\
    \ 图（图 7.5）通过衡量模型预测随特征值变化而变化的方式来衡量每个特征的贡献。这是通过扰动输入数据并对整个数据的特征影响取平均来实现的。第 4 章中提供了关于\
    \ `PD` 图的更详细描述。通过一个描述性示例，`PD` 图显示了预测估计随当前还款状态增加而增加。`PD` 图显示了输入特征（独立变量）与目标变量之间的关系。`PD`\
    \ 图有助于显示变量对预测结果的“边际效应”。\n\n### 个体条件期望\n\n个体条件期望（`ICE`）图（图 7.6）为每个观测值或子组级别分离 `PD`\
    \ 函数。它们有助于识别趋势、差异和交互作用。\n\n ![图 7.5 部分依赖（PD）图：一个示例。独立变量 x1 与模型结果条形图，在考虑了模型中其他独立变量的平均影响后。](img/c07f005.png)\n\
    \n**图 7.5** 部分依赖（`PD`）图：一个示例。独立变量 `x1` 与模型结果条形图，在考虑了模型中其他独立变量的平均影响后。\n\n![图 7.6\
    \ 个体条件期望（ICE）图的图形表示。ICE 图显示了与结果模型预测的关系。](img/c07f006.png)\n\n**图 7.6** 个体条件期望（`ICE`）图的图形表示。`ICE`\
    \ 图显示了与结果模型预测的关系。\n\n### Shapley 值\n\nShapley 值是另一种模型无关的模型解释性指标。Shapley 值通过平均所有联盟的边际贡献来计算变量贡献。这使得\
    \ Shapley 值能够控制变量交互。例如，在图 7.7 中，变量按升序排列。水平位置显示了该值的影响与较高或较低的预测相关。在这个示例中，由局部实例 `8001441`\
    \ 标记的观测值在模型训练数据中的预测值为 `0`。借款人当前的还款计划状态和额度余额贡献了预测。\n\n![图 7.7 使用内核解释器计算 Shapley\
    \ 值：一个示例。](img/c07f007.png)\n\n**图 7.7** 使用内核解释器计算 Shapley 值：一个示例。\n\n## 异常检测\n\
    \n理想情况下，AI 和机器学习的异常检测系统应该具有从高维数据中收集有用特征并发现偏离正常行为的能力。自编码器可以为 AI 和机器学习设计异常检测系统，因为它们可以减少神经网络隐藏层单元的数量来降低数据维度。自编码器作为一种特征提取方法。在这里，自编码器学习“正常”数据点——训练数据中不存在异常。当自编码器进行重构时，异常数据点将失败。\n\
    \n## 偏差\n\nAI 和机器学习容易受到性能或结果偏差的影响。我们讨论了性能偏差的概念。具体来说，结果偏差是指模型输出与另一个“群体”或从模型开发数据确定的基准样本相比在统计学上存在差异。为了监控\
    \ AI 和机器学习中的偏差，使用合适的计算指标（例如人口统计学差异）来衡量结果偏差。偏差可能通过各种原因间接引入，包括内部政策变化、外部监管合规，或者一个“群体”相比另一个群体缺乏足够的观测历史。当观察到差异时，会触发审查以识别偏差产生。\n\
    \n### 模型调整\n\nAI 和机器学习通常利用先进方法来优化算法的目标函数。AI 和机器学习经常使用新的训练数据进行重新训练。风险模型需要重新训练的原因有很多，例如：\n\
    \n- **外部环境**。利率更新、系统更新和相关数据等因素会启动重新训练模型的需求。\n- **策略变化**。如果在开发期间发现模型未能捕捉业务变化或业务策略的变化，模型可能需要重新训练。\n\
    - **业务性能**。模型使用和性能的变化（例如由于新冠肺炎疫情导致的变化）可能会触发模型重新训练工作。\n\n## 合规考量\n\n全球的监管机构开始对\
    \ AI 和机器学习的所有方面提出法规和合规指南，包括数据隐私使用、伦理指南和特定的模型风险管理框架。然而，这些法规和合规指南的深度和范围取决于 AI 和机器学习在各地区的采用率。需要关注的选定合规考量包括：\n\
    \n- 通用数据保护条例（`GDPR`）。\n- 平等信机会法（`ECOA`）——针对小企业贷款 更新。\n- `SR Letter 11-7` 函——针对\
    \ AI 和机器学习的更新指南。\n"
