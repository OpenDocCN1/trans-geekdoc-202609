- raw: 'Specifically, the solution incorporates the corporate entities of existing
    investments. The application downloads the annual reports of each company that
    the client''s financial investors are considering for investing, via the Danish
    registry, in the form of unstructured textual information. In addition, it uses
    sustainability reports from the UN Global Database via Robotic Process Automation
    (RPA). In this case, RPA was needed because an API was unavailable. The RPA performs
    screen-scraping, extracts the information, and stores it in a structured dataset.
    The sustainability reports include sustainability development goals (SDGs), as
    well as human rights, labor rights, the environment, and anti-corruption information.


    AI and machine learning are used to improve the process by identifying climate-specific
    information using new types of data, generating SDG scores, and analyzing trends
    and variations.


    ## CONCLUDING REMARKS


    For financial institutions, there is a pressing need to incorporate climate risk
    in their financial decision-making and risk management processes. As we find ourselves
    in the decisive decade with regards to transitioning to a lower carbon economy,
    there is an urgency for financial institutions to lead the way in sustainable
    finance and help manage both the financial and nonfinancial risks of the transition.
    The scale and complexity of the problem demand new thinking and new technologies.
    With that in mind, it''s imperative for organizations to build their climate risk
    management capacity early: in forward-looking climate risk modeling approaches
    and employing AI and machine learning responsibly.


