    the status quo by identifying accuracy improvements. In the case of AI and machine
    learning, a range of algorithms can be utilized.


    *   **Automate complex risk processes (CCAR (Comprehensive Capital Analysis and
    Review), CECL/IFRS 9).** AI and machine learning can automate complex risk processes
    with robotic process automation.


    *   **Approximate complex risk calculations.** AI and machine learning are effective
    at approximating complex risk calculations, for example, in derivatives pricing.


    *   **Improve risk data quality.** AI and machine learning can detect and remediate
    data quality issues.


    *   **Risk-based optimization.** AI and machine learning can effectively be applied
    to optimize based within a set of constraints.


    *   **Automate steps in the model development process.** AI and machine learning
    can accelerate the model development process with automated feature engineering
    and automated machine learning.


    Often, when existing models meet current expectations, reluctance in using AI
    and machine learning is based on this question: “Why use machine learning when
    my current model are effective at risk profiling, with sufficient performance
    that is likely to continue for the foreseeable future?” This is a common sentiment,
    especially in highly regulated industries that have established processes for
    traditional models in place, and a level of comfort around them. And yes, current
    models may be effectively designed to respond well to the challenges listed above
    in estimating risk parameters—traditional models are able to capture nonlinear
    interactions to some degree. However, there are masked risks that newer approaches
    of AI and machine learning are better suited for, and are more efficient to identify.


    For example, financial technology companies employ AI and machine learning to
    provide personalized customer experiences and process legal documents. Extreme
    credit and fraud risk events and other anomalies that represent a small percentage
    of portfolios are more effectively modeled by machine learning algorithms. Machine
    learning is also effective at approximating complex risk calculations: a neural
    network, for example, is sophisticated in its architecture but surprisingly easy
    to execute. Machine learning is also effective at automating model development
    tasks such as feature engineering. In the COVID-19 pandemic, organizations have
    turned to machine learning to adapt to changes in market dynamics—for example,
    detect early signals of stress by identifying customers with higher repayment
    difficulty, from more granular transactional data. Furthermore, machine learning
    can also effectively be applied to segment portfolios into micro-segments.


    Innovative models need an innovative approach to risk model development and deployment.
    With more automation and an accelerated risk model lifecycle, especially in the
    context of current or impending exogenous events, like COVID-19, risk managers
    can more quickly respond to dynamic market conditions.


    Previously, acceleration was often impeded by additional regulatory demands. Such
    measures included buffers to expected credit loss provisions due to the uncertainty
    created by divergent economic data across markets. However, the slowness to develop
    new models can also be attributed to the manual nature of model development and
    legacy processes. In addition, technologies that lack repeatable and standardized
    frameworks can cause bottlenecks in the risk model development cycle. The COVID-19
    pandemic provided a means to focus on identifying bottlenecks in model development
    and decision-making cycles, and this highlighted the need to combine increased
    automation with a level of human-based decision-making so that organizations can
    better respond in a forward-looking manner.


    The acceleration of risk model development and deployment will enable organizations
    to develop and deploy more models into production with the same number of staff
    and timelines compared to models currently in production. More models will also
    require more automated monitoring processes. They might also need to be reviewed
    more frequently—potentially daily—to quickly identify any recalibration needs.


    This chapter further defines AI and machine learning and includes case studies
    on how AI and machine learning are used to strengthen risk management. Although
    the chapter will provide some historical applications of artificial intelligence,
    machine and deep learning, it also includes practical use cases to demonstrate
    how machine learning can be leveraged at present.


    ## RISK MODELING USING MACHINE LEARNING


    Most of us first started to take notice of AI in 1996 when Deep Blue beat Garry
    Kasparov in a chess match, and then in 2001 when the IBM Watson Supercomputer
    famously beat contestants of the game show *Jeopardy*.


    With all jokes aside, advanced AI and machine learning are extensively utilized
    for predictive analytics in cloud-based deployments, and many companies have now
    embraced its use.


    *   The global office supply retailer Staples, which created a smart ordering
    system


    *   General Motors, which analyzes drivers'' preferences and decision-making


    *   The global pharmaceutical company GlaxoSmithKline (GSK), which enabled customers
    to ask questions by voice and text via online advertisements


    *   The University of Southampton, in the United Kingdom, which created a cognitive
    computing module that offers research modules online


    There is also a growing list of Global Systemically Important Banks, Domestic
    Important Banks, commercial banks, and insurance and financial technology companies
    that are piloting or have leveraged advanced AI and machine learning to improve
    customer experience and offer new products and services. The range of applications
    is wide: from chatbots in call centers to machine learning models used for loan
    originations and fraud detection to simulating scenarios and synthetic data for
    stress testing. Today, for many organizations, the use of AI and machine learning
    is either directly or indirectly involved in risk management processes, risk decision-making,
    and/or complex risk calculations.


    What follows are AI and machine learning stories to highlight the practical ways
    that financial institutions are using these advanced techniques. However, as there
    is a tradeoff between complexity and accuracy, the focus for risk management should
    be on the applications of AI and machine learning where it makes sense. Not every
    problem is an AI problem. For example, if it makes sense to retain traditional
    models for regulatory calculations, then there is no need to replace these models
    with AI and machine learning. In addition, for simple binary target prediction
    problems where there is little data available, simpler techniques can provide
    easy solutions.


    ### Tier 1 Commercial Bank in Latin America


    A Tier 1 commercial bank, headquartered in Latin America, comprising both retail
    and wholesale banking operations, had a problem with maintaining asset quality
    in their loan portfolio, while meeting ambitious growth targets by acquiring new
    customers. It became especially challenging against a backdrop of rising interest
    rates and increases in loan-level defaults.


    To effectively scale, the bank decided to invest in a new risk modeling platform
    that operationalized the risk model lifecycle. The platform needed to be robust
    enough to automate the development and deployment of machine learning models.
    It became a “machine learning model factory” where highly structured and industrialized
    model development and deployment processes were put in place. These included data
    preparation and model development processes, where nonregulatory machine learning
    models for selected market segments could be developed and automatically deployed
    into production.'
