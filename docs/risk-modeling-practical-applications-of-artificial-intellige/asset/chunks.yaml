    \n5.  [5](#c07.xhtml#R_c07-note-0005).  Office of the Comptroller of the Currency,\
    \ *Safety and Soundness, Model Risk Management,* Version 1.0 (August 2021), [https://www.occ.treas.gov/publications-and-resources/publications/comptrollers-handbook/files/model-risk-management/pub-ch-model-risk.pdf](https://www.occ.treas.gov/publications-and-resources/publications/comptrollers-handbook/files/model-risk-management/pub-ch-model-risk.pdf)\n\
    \n6.  [6](#c07.xhtml#R_c07-note-0006).  Government of the United Kingdom, *Algorithmic\
    \ Transparency Standard* (2021), [https://www.gov.uk/government/collections/algorithmic-transparency-standard#:~:text=The%20Algorithmic%20Transparency%20Standard%20is,making%20in%20the%20public%20sector](https://www.gov.uk/government/collections/algorithmic-transparency-standard#:~:text=The%20Algorithmic%20Transparency%20Standard%20is,making%20in%20the%20public%20sector)\n\
