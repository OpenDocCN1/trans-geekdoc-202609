    Today, there is no global consensus on the design and deployment of ethical AI
    frameworks. However, within developed regulations and guidelines, the same ethical
    principles relating to fairness, ethics, accountability, and transparency are
    used. The depth and breadth of ethical AI compliance guidelines and regulations
    largely depend on the maturity of AI and machine learning adoption in the respective
    jurisdictions. For example, regulators in Asia Pacific are continuing to address
    ethical AI frameworks to help ensure that fairness objectives are achieved (e.g.,
    the Australian government recently released the “AI ethics framework,” and the
    Hong Kong Monetary Authority has released regulatory guidance in the form of the
    “RegTech Adoption Practice Guide” that includes prerequisites for an “AI governance
    framework”)


    # CONCLUDING REMARKS


    With the use of AI and machine learning, risk departments should broaden their
    thinking to extend their performance monitoring framework so that transparency
    of AI and machine learning can be achieved without overly depending on manual
    code. By dynamically tracking a range of interconnected categories—including,
    but not limited to, the input data, model decay, and model robustness, risk departments
    can better understand potential AI and machine learning limitations and proactively
    identify issues that may lead to model failure. Regulatory bodies and central
    banks also expect risk departments to adhere to certain compliance measures when
    validating AI and machine learning. We have explained the main concepts in this
    chapter.


    However, even in the absence of clearly defined regulatory expectations of model
    risk management as outlined in `SR 11-7`, model risk management should still be
    top of mind, as the model risks associated with AI and machine learning can cause
    quantifiable loss, from inaccurate risk calculations, to the costs involved with
    developing and implementing models, to adverse impacts of making unfair decisions.
    These risks are worsened when AI and machine learning function outside of a robust
    model risk management framework that governs the development, deployment, and
    use of the models.


    # ENDNOTES


    1. [1](#c07.xhtml#R_c07-note-0001). Artificial intelligence, [https://www.oecd.org/going-digital/ai/principles/](https://www.oecd.org/going-digital/ai/principles/)

    2. [2](#c07.xhtml#R_c07-note-0002). Personal Data Commission, `Model Artificial
    Intelligence Governance Framework` ed. (Singapore: Infocomm Development Authority,
    and Personal Data Commission, 2020), [https://www.pdpc.gov.sg/-/media/files/pdpc/pdf-files/resource-for-organisation/ai-sgagovframework2](https://www.pdpc.gov.sg/-/media/files/pdpc/pdf-files/resource-for-organisation/ai-sgagovframework2)

    3. [3](#c07.xhtml#R_c07-note-0003). European Commission, `Proposal for a Regulation
    of the European Parliament and the Council: Laying Down Harmonised Rules on Artificial
    Intelligence (Artificial Intelligence Act) and Amending Certain Union Acts`, Eur-Lex,
    Brussels, (April 21, 2021), [https://eur-lex.europa.eu/legal-content/EN/TXT/?qid=162335154975&uri=CELEX%3A5221PC026](https://eur-lex.europa.eu/legal-content/EN/TXT/?qid=162335154975&uri=CELEX%3A5221PC026)

    4. [4](#c07.xhtml#R_c07-note-0004). Elisa Jillson, `Aiming for truth, fairness,
    and equity in your company''s use of AI`, Federal Trade Commission (April 19,
    2021), [https://www.ftc.gov/news-events/business-blog/2021/04/aiming-truth-fairness-equity-your-companys-use-ai](https://www.ftc.gov/news-events/business-blog/2021/04/aiming-truth-fairness-equity-your-companys-use-ai)

    5. [5](#c07.xhtml#R_c07-note-0005). Office of the Comptroller of the Currency,
