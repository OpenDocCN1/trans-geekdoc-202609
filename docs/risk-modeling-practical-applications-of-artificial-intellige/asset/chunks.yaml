    - **挑战者模型。** 人工智能和机器学习通过识别准确率的提升，能够有效挑战现状。在人工智能和机器学习领域，可以利用多种算法。

    - **自动化复杂的风险流程（CCAR（综合资本分析与审查），CECL/IFRS 9）。** 人工智能和机器学习可以通过机器人流程自动化（RPA）使复杂的风险流程实现自动化。

    - **近似复杂的风险计算。** 人工智能和机器学习在近似复杂风险计算方面非常有效，例如在衍生品定价。

    - **改进风险数据质量。** 人工智能和机器学习可以检测并修复数据质量问题。

    - **基于风险的优化。** 人工智能和机器学习可以有效应用于在特定约束条件下进行基础优化。

    - **自动化模型开发过程中的步骤。** 人工智能和机器学习可以通过自动特征工程和自动机器学习来加速模型开发过程。


    通常，当现有模型符合当前预期时，人们对人工智能和机器学习的抵触情绪源于这个问题：“如果我目前的模型在风险画像方面非常有效，且性能足以可能在可预见的未来持续下去，那么为什么要使用机器学习呢？”这是一种普遍情绪，特别是在那些为传统模型建立了既有流程并对其感到舒适的高度受监管行业中。是的，目前的模型可能设计得很好，能够有效应对上述上述风险参数估计的挑战——传统模型能够在某种程度上捕捉非线性相互作用。然而，存在一些隐藏的风险，更新的人工智能和机器学习方法更适合且更高效地识别这些风险。


    例如，金融科技公司利用人工智能和机器学习提供个性化的客户体验并处理法律文件。极端信用和欺诈风险事件以及占投资组合中比例极小的其他异常，通过机器学习算法可以更有效地建模。机器学习在近似复杂风险计算方面同样有效：例如，神经网络的架构复杂，但执行起来却惊人地简单。机器学习在自动化特征工程等模型开发任务方面也同样有效。在新冠肺炎疫情期间，各机构转向机器学习以适应市场动态的变化——例如，通过更细粒度的交易数据识别还款困难较大的客户，从而检测压力的早期信号。此外，机器学习还可以有效应用于将投资组合划分为微细分。


    创新的模型需要创新的风险模型开发和部署方法。随着自动化程度的提高风险模型生命周期的加速，特别是在当前或即将发生的外部事件（如新冠肺炎）背景下，风险经理可以更快速地响应动态市场状况。


    此前，加速过程往往受到额外监管要求的阻碍。此类措施包括由于不同市场间经济数据差异产生的不确定性而对预期信贷损失准备金设置的缓冲区。然而，新模型开发的缓慢也可以归因于开发的人工性质和遗留流程。此外，缺乏重复和标准化框架的技术可能会导致风险模型开发周期出现瓶颈。新冠肺炎疫情提供了一个关注识别模型开发和决策周期中瓶颈的方法，这凸显了将增加自动化与人类决策水平相结合的必要性，以便机构以更具前瞻性的方式应对。


    风险模型开发和部署的加速将使机构能够在现有人员和时间表的情况下，比目前生产环境中的模型开发并部署更多模型。更多的模型也意味着更多的自动化监控流程。它们可能还需要被更频繁地（可能是每天）审查，以快速识别任何重新校准的需求。


    本章进一步定义了人工智能和机器学习，并包含了关于如何使用人工智能和机器学习加强风险管理的案例研究。尽管本章将提供人工智能的一些历史应用，但它包含了实际案例，以展示目前是如何被利用的。


    ## 使用机器学习进行风险建模


    我们大多数人最早注意到人工智能是在 1996 年，当时 `Deep Blue` 在象棋比赛中击败了卡斯波夫，随后在 2001 年 `IBM Watson Supercomputer`
    著名地击败了《危险边缘》（Jeopardy）参赛者。抛开玩笑，先进的人工智能和机器学习已广泛用于云部署中的预测分析，许多公司现在已接受其使用。


    - 全球办公用品零售商 `Staples`，它创建了智能订购系统

    - `General Motors`，它分析驾驶者的偏好和决策

    - 全球制药公司 `GlaxoSmithKline (GSK)`，它允许客户通过语音和文本提问

    - 英国`南汉普顿大学`，它创建一个提供在线研究模块的认知计算模块


    还有日益越来越多的全球系统性重要银行、国内重要银行、商业银行以及保险和金融科技公司正在试点或已利用这些技术。应用范围非常广泛：从呼叫中心的聊天机器人到用于贷款发放和欺诈检测的机器学习模型，再到用于压力测试场景模拟和合成数据。今天，对于许多机构而言，人工智能和机器学习的使用直接或间接地参与了风险管理流程、决策和/或复杂的风险计算。


    然而，由于复杂性和准确性之间存在权衡，风险管理的重点应放在人工智能和机器学习合理的应用上。并不是每一个问题都是人工智能问题。例如，如果保留传统模型进行监管计算是有有意义的，那么就没有需要用人工智能和机器学习来取代这些模型。此外，对于数据较少的简单二分类目标预测问题，更简单的技术可以提供易行的解决方案。


    ### 拉美洲的一线商业银行


    一家总部位于拉丁美洲的一线商业银行涵盖零售和批发银行业务，该银行在通过获取新客户以实现宏大增长目标的同时，面临维护贷款投资组合资产质量的难题。为了有效扩大规模，该银行决定投资一个新的风险建模平台，使风险模型生命周期运营化。该平台需要足够健壮，以自动化机器学习模型的开发和部署。它变成了一个“机器学习模型工厂”，在那里建立了高度结构化和工业化的模型开发与部署流程。这些包括数据准备和模型开发过程，在这些过程中，可以为选定的市场领域开发非监管机器学习模型并将其自动部署到生产环境中。


    '
