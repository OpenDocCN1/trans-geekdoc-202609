    # 第 6 章 机器学习的部署、实现与决策制定


    正如我们在之前的章节中所建立的，问题不在于人工智能和机器学习是否具有变革性潜力——这是不而易见的——而在于如何以伦理、负责任且可持续的方式来运营它们。


    这些模型提供的机遇是广泛的：更高的准确性、对大数据的更深洞察，以及自动化带来的效率提升。无论人工智能或机器学习在实验室中看起来多么完美，只有在部署到现实世界时它们才能产生价值。


    随着算法复杂性的增加，部署正成为组织面临的日益严峻的障碍。根据 Gartner 2021 年的一份报告，只有 53% 的 POC（概念证明）模型离开了实验室，而且这一过程平均需要
    9 个月。今天生产环境中人工智能和机器学习数量较少的原因之一是与遗留环境相关的局限性。从设计上来说，这些系统并不是为了较新的人工智能和机器学习设计的。


    许多组织已经建立了与遗留环境相关的流程。虽然遗留系统是主流的，并且对于现有模型来说已经达到了可以运行的操作水平，但它们并非没有挑战——正如下一节所解释的。部署缓慢的原因之一是，历史上，风险模型的开发和部署是在物理和逻辑上都分离的系统中进行的。用于开发和生产的不同系统通常具有不同的节奏，并且通常使用不同的编程语言。


    无法大规模部署人工智能和机器学习开始在整个分析价值链中产生瓶颈。由于模型被困在数据科学项目中，人工智能和机器学习通过为生产环境决策贡献而产生的业务价值无法实现。


    该领域创新的主要驱动力是企业数字化转型。它从根本上改变了包括金融服务在内的组织与其客户和其他利益者互动的方式。为了满足超个性化和全天候服务的期望，决策变得更加数字化、相关且实时。通常，数字化转型努力的目标不仅是提供数字渠道，还在提高运营效率、敏捷性和速度，将新的数字服务和产品推向市场。


    ## 典型的模型部署挑战


