  trans: "\n\n线性激活函数对每个加权输入进行线性组合，而像 sigmoid 函数这样的非线性激活函数则将加权输入的之和代入逻辑函数中。例如，在学习时，sigmoid\
    \ 逻辑函数最初近似于一个指数方程。请注意，sigmoid 逻辑函数的这些内在特性不要与第 8 章中讨论的机器学习优化相混淆。此外，对于 sigmoid 神经元，返回的值在\
    \ 0 和 1 之间，并取决于求和的加权输入。例如，如果加权和为负数，则返回的值接近“0”。尽管存在局限性，但 sigmoid 神经元的使用频率比线性神经元更高，因为生成的算法在比较之下通用得多。\n\
    \n神经元也是人体整个神经系统的构建模块，接收来自外部环境的感官信息，并向肌肉发送指令等许多其他已知功能。\n\n### 人工神经网络\n\n深度学习算法中的人工神经网络的创建方式类似于生物神经网络，因为其创建依赖于许多相互作用：从输入数据、许多神经元之间的交互，到从神经网络响应生成的输出。深度学习算法由于类似于层结构的神经网络网络而变得更加复杂。输入层的神经元连接到实际输出或问题的答案，它们不需要相互连接；而输出层的神经元则相互连接并直接接收输入数据。该网络可以是前向的，即输入层神经元与输出层神经元之间没有连接；也可以是递归的，即输入层和输出层之间存在连接。\n\
    \n在输入层和输出层之间可能存在隐藏层。隐藏层本身是网络发挥神奇力量解决问题并推导出输入数据特征的地方，这些特征被提取以学习并导出输出。从技术上讲，隐藏层涉及某种类型的额外转换，但不需要额外的参数。有趣的是，隐藏层是深度学习中“深”这一层面的来源——具有许多隐藏层的神经网络被认为是“深”的。![图\
    \ 3.2 带有隐藏层的人工神经网络架构图。](img/c03f002.png)\n\n`图 3.2` 带有隐藏层的人工神经网络架构图。\n\n*   输入层和第一个隐藏层\n\
    *   当多个隐藏层时，从一个隐藏层到下一个隐藏层的连接\n*   最后一个隐藏层和输出\n\n### 自动化机器学习\n\n现在已有提供自动化机器学习（AutoML）的平台。这些平台为各种算法提供了预开发的模型模板。这允许预定义的模型流水线针对训练数据集并行运行，并自动执行、训练和评估每个模型的预测准确性，且只需要极少的人工干预。当建模者不确定算法选择时，AutoML\
    \ 非常有用。\n\n总的来说，AutoML 通过评估不同的模型流水线来找到针对数据集的最优预测模型，从而减少建模者需要做的假设，以便开发出最拟合数据集的最佳预测模型。模型流水线可以基于模板，这些模板可以包含数据处理、应用监管约束以及检查模型结果的偏差和公平性。此外，由\
    \ AutoML 生成的模型仍需要审查和证明，包括解释其解释和决策都是公平、安全且透明的。我们在第 4 章和第 5 章中解释了这些内容。\n\n### 机器人流程自动化\n\
    \n一旦机器被教会解决问题，其生成的逻辑就可以用于机器人流程自动化（RPA）。当机器能够执行业务流程时，RPA 这种技术就实现了自动化。在某些情况下，RPA\
    \ 能够降低成本。\n\n### 总结\n\nAI 和机器学习在全球范围内迅速发展。然而，应该注意到，在某些国家其采用速度较慢。\n\n### 备注\n\n\
