    The policy frameworks, guidelines, and principles are all supported by key assessments
    and reported data.


    For organizations to effectively assess and address the risks associated with
    climate change, it is helpful to evaluate the channels by which climate change
    impacts the financial sector. These include:


    *   **Physical risk.** Physical risk is the risk of physical damage caused by
    increased weather events such as hurricanes, floods, droughts, and heatwaves.
    As a region experiences more climate-related disruptions, there will also be indirect
    impacts on businesses through economic disruptions, potential supply-chain issues,
    and decline in values of commercial assets and homes.

    *   Banks are already incorporating physical risk assessments of assets, and we
    explore the topic in more detail in the practical examples section.

    *   **Transition risk.** Transition risks arise from transitioning to a lower-carbon
    economy. The major contributing factors are climate policies, consumer preferences,
    and carbon pricing.


    Each of these climate risk categories transmits through the economy at both macroeconomic
    and microeconomic levels, to financial risks such as credit risk, market risk,
    liquidity risk, operational risk, and reputational risk.


    # ASSESSING THE IMPACTS OF CLIMATE CHANGE USING AI AND MACHINE LEARNING


    For risk practitioners, to assess the impacts of climate change on portfolios
    and incorporate climate risk assessments in decision-making, questions about the
    accuracy and reliability of climate risk models prevail. The following considerations
    are highlighted:


    *   There exists a large amount of uncertainty about the timing and magnitude
    of climate-based events.

    *   The nonlinear relationships between the macroeconomy and financial balance
    sheets are complex.

    *   There are direct and indirect influences of both physical and transition risks
    on the macroeconomy and financial balance sheets.

    *   There is additional complexity and interactions between physical and transition
    risks.


    According to the Basel Committee, “A bank''s ability to assess its overall exposure
    to climate risks across all of its significant operations will be heavily dependent
    upon the quality of its IT systems and its ability to aggregate and manage large
    amounts of data.”


    `start ?The above have influenced a growing amount of work`


    The scale and complexity of the climate change problem demand news, and customer
    expectations and needs. This is a journey!


    ## Regulatory Guidance and Compliance Measures


    In most cases, financial institutions are not waiting for governments to drive
    the large-scale action needed to mitigate financial risks. They are responding
    to signals from institutional investors (such as the `IIGCC`).


    Central banks and regulators are releasing forward-looking climate stress tests
    and disclosure expectations, mostly based on the recommendations by the Task Force
    on Climate-Related Financial Disclosures (`TCFD`).


    To assess the impacts of climate change, many organizations are extending their
    scenario analysis and stress testing frameworks to include climate risk scenarios.
    This is also the approach adopted by many central banks. Scenario analysis is
    a helpful tool to, firstly, comply with climate-related regulatory stress testing
    and secondly, allow various stakeholders to better understand the shorter- and
    longer-term implications under a range of forward-looking scenarios, and plan
    accordingly.

