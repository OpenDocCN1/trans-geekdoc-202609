  trans: "\n\n32. 32. Sharon Thiruchelvam, *监管机构青爱的气候风险指标是否足够可靠？* ([Risk.net](http://risk.net)\
    \ 出版, 2021), [`www.risk.net/regulation/7899226/does-regulators-favourite-climate-risk-metric-measure-up`](https://www.risk.net/regulation/7899226/does-regulators-favourite-climate-risk-metric-measure-up)。\n\
    \n33. 33. Petropoulos 等人, *Deep-Stress*.\n\n34. 34. Petropoulos 等人, *Deep-Stress*.\n\
    \n35. 35. 英国英银行, *讨论论文——2021 年气候变化金融风险两年探索性场景* (伦敦：英国英银行，2019)。\n\n36. 36. 英国英银行,\
    \ *气候两年探索性场景结果* (2022 年 5 月 24 日), [`www.bankofengland.co.uk/stress-testing/2022/results-of-the-2021-climate-biennial-exploratory-scenario`](https://www.bankofengland.co.uk/stress-testing/2022/results-of-the-2021-climate-biennial-exploratory-scenario)\n\
    \n37. 37. Richard Evans 和 Jim Gao, *DeepMind AI 使 Google 数据中心冷却账单降低了 40%* (2016\
    \ 年 7 月 20 日), [`www.deepmind.com/blog/deepmind-ai-reduces-google-data-centre-cooling-bill-by-40`](https://www.deepmind.com/blog/deepmind-ai-reduces-google-data-centre-cooling-bill-by-40)\n\
    \n# 关于作者\n\n**Terisa Roberts** 是 SAS 公司风险建模与决策部门的主监兼全球解决方案负责人。她在量化风险管理、监管合规以及模型治理与验证方面拥有丰富经验。她曾工作于金融服务、电信、政府、能源和零售行业。\n\
    \n她负责为全球的银行和监管机构提供关于风险建模与决策的良好实践，以及人工智能和机器学习的负责任使用提供建议。她经常在国际会议上就创新模型在风险管理中的应用进行演讲。\n\
    \n她拥有运筹学与信息学博士学位，与家人一起生活在澳大利亚悉尼。\n\n**Stephen J. Tonna** 是 SAS 的高级银行解决方案顾问。他是一位经过博士训练的专业人士，拥有\
    \ 10 年的统计学、科学和行业经验。\n\n发现将人工智能以及机器学习、深度学习等相关方法作为转型工具的实用方法，是他每天早晨充满活力的动力之一！\n\n\
    在 SAS，Stephen 凭借其专业知识，在信贷评分与决策、模型风险管理等主要领域提供建议，并指导如何利用这些以及许多其他产品在云端实现风险转型。\n\n\
    他非常享受复杂的变更管理项目，并发现通过建立思想领导力来推动数字化变革以及发现流程中未开发的改进领域令他兴奋。\n\nStephen 住在澳大利亚墨尔本，与妻子\
    \ Nini 和儿子 Sebastian James 生活在一起。\n\n# 索引\n\n* 页码后跟 *f* 和 *t* 分别指图和表。\n\n* 累积局部效应\
