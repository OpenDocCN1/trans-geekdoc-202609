    \ models are trained and assessed by using random combinations of hyperparameter\
    \ values. In random search, distributions for the hyperparameters are defined,\
    \ either uniformly or with a sampling method. Random search runs faster than an\
    \ exhaustive grid search because a random sample of combinations is selected.\
    \ It is important to note that with random search, no learning from previously\
    \ tried hyperparameter values or combinations of values takes place. This means\
    \ that there is an element of “luck” that takes place for the selection of the\
    \ individual hyperparameter values and their combinations.\n\n*   **Latin hypercube\
    \ sampling.** This method follows an experimental design in which samples are\
    \ exactly uniform across each hyperparameter but random in combinations. The approach\
    \ is more structured than a pure random search and allows for a more uniform sample\
    \ of each hyperparameter, which can help identify hyperparameter importance even\
    \ if the best combination is not discovered.\n\n*   **Optimization.** Here, the\
    \ search is based on an objective of minimizing the model validation error, so\
    \ each “evaluation” from the algorithm's perspective is a full cycle of model\
    \ training and validation. These methods are designed to make use of fewer evaluations\
    \ and thus save on computation time. It is important to note that with optimization\
    \ for hyperparameter search, “learning” occurs. The learning occurs with previously\
    \ tried configurations that influence the selection of new configurations while\
    \ minimizing the loss function. The trade-off is that fewer configurations can\
    \ be evaluated in parallel. Theoretically, with enough machines, grid or random\
    \ configurations could be evaluated in parallel, but with optimization the parallelization\
    \ is limited, as iterations are necessary to learn.\n\n*   **Local search optimization.**\
