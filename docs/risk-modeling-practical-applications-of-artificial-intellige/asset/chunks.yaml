    # 第 4 章 解释人工智能、机器学习与深度学习模型


    由于某些人工智能（AI）和机器学习具有“黑箱”属性，其模型逻辑难以解释的，这对于技术人员和非技术利益相关者都是如此。


    首先，考虑到模型逻辑，某些人工智能和机器学习，其可解释性的缺失源于复杂的特征工程。在这种情况下，机器创建的模型输入和关系缺乏人类直觉。


    人工智能和机器学习的复杂性既是优点也是缺点。它使得模型能够非常灵活地检测非线性交互和相关性，但也更容易受到训练数据中虚假关系的影响，即过拟合。


    人工智能和机器学习被认为利用了较少的统计假设，根据目标函数优化超参数。


    通常，风险管理中使用的模型、分析算法和定量计算都受到严格的监管指导，例如对分析方法的概念合理性进行独立评估。人工智能和机器学习内在可解释性的缺失引发了一个根本问题：我们如何评估一个难以解释的模型？


    此外，对于缺乏可解释性的模型，很难预见其在使用时的任何意外后果，这增加了在生产环境中部署模型时的操作风险。对于人工智能和机器学习，模型开发过程的审计和监督变得更加重要。


