    \n5.  [5](#c08.xhtml#R_c08-note-0005).  Adriano A. Rampini and S. Viswanathan,\
    \ “Collateral, risk management, and the distribution.” *Journal of Finance* 65(6)\
    \ (2010): 2293–2322.\n\n6.  [6](#c08.xhtml#R_c08-note-0006).  Manmohan. Singh,\
    \ *The Changing Collateral Space* (Washington, D.C, USA: International Monetary\
