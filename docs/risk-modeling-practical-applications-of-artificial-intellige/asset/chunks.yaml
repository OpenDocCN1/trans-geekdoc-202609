    The main types of financial and nonfinancial risks are summarized in [Table 1.1](#c01.xhtml#c01-tbl-0001).


    Changes to the climate have been understood for many decades. Since 1992, the
    United Nations has recognized that changes to the global climate patterns, mostly
    due to greenhouse gas emissions, pose serious issues to the world.


    ### [Table 1.1](#c01.xhtml#R_c01-tbl-0001) Types of Risk and Associated Definitions


    | Risk Type | Definition |

    | --- | --- |

    | Credit risk | Risk of financial loss due to a borrower''s failure to repay loan
    obligations. |

    | Market risk | Risk of loss to institutions earnings from movement in market
    prices. |

    | Operational risk | Risk of loss from a failed internal process, people, system,
    or external event. |

    | Insurance risk | Harmful or unexpected event, threat, or peril for which insurance
    is provided. |

    | Liquidity risk | Risk arising from a firm''s inability to meet its short-term
    obligations as they become due. |

    | Reputation risk | Risk of financial and nonfinancial loss due to public opinion.
    |

    | Strategic risk | Risk from adverse business decisions or lack of responsiveness
    to changes in the industry and operating environment. |

    | Compliance risk | Risk from violations of laws or regulations, internal policies
    and procedures, or ethical standards. |

    | Interest rate risk | Risk of loss due to movements in interest rates. |


    The stability of the climate and financial services industry is intricately connected
    by complex layers of interaction between the macroeconomic, financial, and climate
    systems.


    ## OVERCOMING BARRIERS TO TECHNOLOGY AND AI ADOPTION WITH A LITTLE HELP FROM NATURE


    At this point you may be asking yourself, is it purely that we are waiting for
    true “AI” to be created before it becomes mainstream in its use, or are other
    factors at play acting as barriers of uptake? One way to narrow down the naturally
    derived barriers of larger-scale adoption of new technologies is to look back
    in time at periods of industrial revolutions.


    When a new technological advancement like means of communication and societal
    systems synergize, it has created industrial revolutions that in turn have acted
    to modernize society through innovation.


    A little push to drive change like the `ATM`, coupled with a climate event, is
    at times needed to accelerate the adoption of technological innovation. However
    repetitive and mundane, transformation is not easy and requires hard work. For
    organic innovation to progress, technological changes like the `ATM` and even
    telephone often require experience through experimentation rather than mandates
    so that the needs and necessities of change, as well as its opportunities and
    risks, can be fully understood. With that in mind, eventual desire for change
    can even be created.


    Similarly, the mainstream adoption of `AI` and machine learning in risk modeling
    requires both experimentation and experience to be fully understood. As suggested
    by the `ATM` example, while adoption of new technology may, at times, require
    a shock, broad adoption occurs when the technology improves the customer experience.
    If that does not take place, then the tangible benefits of `AI` and machine learning
    may not be fully leveraged.


    ## THIS BOOK: WHAT IT IS AND IS NOT


    With this book, we aim to provide examples and information to demystify the concepts
    of `AI` and machine learning, thereby increasing the awareness of its many benefits
    and how it can be applied to solve everyday risk management problems (e.g., how
    to evaluate the financial impact of extreme events such as global pandemics and
    changes in climate). We also highlight some of the incremental risks and unintended
    consequences associated with `AI` and machine learning in risk management and
    ways to address these, thereby enabling organizations to be better prepared for
    its adoption and responsible use. As far as possible, we aim to provide practical
    examples of use cases where `AI` and machine learning have delivered tangible
    benefits in risk management.


    ## ENDNOTES


