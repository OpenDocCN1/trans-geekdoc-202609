    \ SAS, Stephen advises with specialized expertise in risk in the main areas of\
    \ credit scoring and decisioning, model risk management, and how these and many\
    \ other offerings can be used to realize risk transformation in the cloud.\n\n\
    He thoroughly enjoys complex change management projects and finds it exciting\
    \ to instill thought leadership to effect digital change and discover unrealized\
    \ areas of process improvement.\n\nStephen lives in Melbourne, Australia, with\
    \ his wife, Nini, and son, Sebastian James.\n\n# Index\n\n* Page numbers followed\
    \ by *f* and *t* refer to figures and tables, respectively.\n\n* Accumulated local\
