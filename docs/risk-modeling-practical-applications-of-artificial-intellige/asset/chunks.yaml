- raw: "The policy frameworks, guidelines, and principles are all supported by key\
    \ assessments and reported data.\n\nFor organizations to effectively assess and\
    \ address the risks associated with climate change, it is helpful to evaluate\
    \ the channels by which climate change impacts the financial sector. These include:\n\
    \n*   **Physical risk.** Physical risk is the risk of physical damage caused by\
    \ increased weather events such as hurricanes, floods, droughts, and heatwaves.\
    \ As a region experiences more climate-related disruptions, there will also be\
    \ indirect impacts on businesses through economic disruptions, potential supply-chain\
    \ issues, and decline in values of commercial assets and homes.\n\n*   Banks are\
    \ already incorporating physical risk assessments of assets, and we explore the\
    \ topic in more detail in the practical examples section.\n\n*   **Transition\
    \ risk.** Transition risks arise from transitioning to a lower-carbon economy.\
    \ The major contributing factors are climate policies, consumer preferences, and\
    \ carbon pricing.\n\nEach of these climate risk categories transmits through the\
    \ economy at both macroeconomic and microeconomic levels, to financial risks such\
    \ as credit risk, market risk, liquidity risk, operational risk, and reputational\
    \ risk.\n\n## ASSESSING THE IMPACTS OF CLIMATE CHANGE USING AI AND MACHINE LEARNING\n\
    \nFor risk practitioners, to assess the impacts of climate change on portfolios\
    \ and incorporate climate risk assessments in decision-making, questions about\
    \ the accuracy and reliability of climate risk models prevail. The following considerations\
    \ are highlighted:\n\n*   There exists a large amount of uncertainty about the\
    \ timing and magnitude of climate-based events.\n\n*   The nonlinear relationships\
    \ between the macroeconomy and financial balance sheets are complex.\n\n*   There\
    \ are direct and indirect influences of both physical and transition risks on\
    \ the macroeconomy and financial balance sheets.\n\n*   There is additional complexity\
    \ and interactions between physical and transition risks.\n\nAccording to the\
    \ Basel Committee, “A bank's ability to assess its overall exposure to climate\
    \ risks across all of its significant operations will be heavily dependent upon\
    \ the quality of its IT systems and its ability to aggregate and manage large\
    \ amounts of data.”\n\n start ?The above have influenced a growing amount of work\n\
    \nThe scale and complexity of the climate change problem demand new thinking and\
    \ new technologies, including the use of AI and machine learning. AI and machine\
    \ learning are very effective at modeling complex relationships at scale, and\
    \ that is exactly what is required in terms of climate risk. There are various\
    \ auxiliary functions that are leveraging AI and machine learning to better assess\
    \ and address climate change, including its use to better understand the extent\
    \ of the problem, to monitor progress, and to address data quality issues.\n\n\
    Firstly, analytics can help to better understand and define the climate risk problem.\
    \ There is a lot of climate data available, like geospatial data, sensor data,\
    \ and satellite images, but innovation is needed to analyze and combine it with\
    \ traditional risk data and processes. New methods are needed to analyze new and\
    \ unique types of data, including unstructured data (such as sentiment).\n\nFor\
    \ example, with climate change it is well known that there is an increased risk\
    \ of flooding—more frequent flooding will not only impact collateral values, but\
    \ also supply chains and the long-term creditworthiness of a region. With the\
    \ use of “smart city” analytics, sensors and rain gauges, residential areas can\
    \ be better protected from flooding. By using newer technologies, monitoring water\
    \ levels in real-time to predict flood risk, lives and livelihood can be better\
    \ protected.\n\nSecondly, to reduce greenhouse gas emissions, energy intensive\
    \ and high-carbon industries will likely turn to buying carbon offsets. There\
    \ are still open questions on how carbon offset markets are governed and how to\
    \ guarantee the integrity of such a market, but computer vision and sensors can\
    \ help monitor the greenhouse gas emissions of carbon offset projects.\n\nAnd\
    \ lastly, the use of AI and machine learning can assess data quality (see [Chapter\
    \ 2](#c02.xhtml)) and address data gaps through synthetic data creation.\n\nBut\
    \ for now, we want to further explain the measures taken by the United Nations\
    \ that have set targets to limit the rise of global temperatures to between 1.5\
    \ and 2 degrees Celsius, and how the most current targets are being used as the\
    \ basis of climate risk scenarios for climate risk stress testing.\n\n## USING\
    \ SCENARIO ANALYSIS TO UNDERSTAND POTENTIAL ECONOMIC IMPACTS\n\nFinancial institutions\
    \ have started strengthening their climate risk assessment capacity. Now that\
    \ the definition of climate risk is beginning to take shape, banks are in the\
    \ planning stages of building the right governance frameworks.\n\nFinancial institutions\
    \ will need well-considered environmental risk management expertise, but it is\
    \ important that the banking industry develop their own capacity and not solely\
    \ rely on regulators for guidance. Ideally, financial services industry will collaborate\
    \ with regulators to further develop and refine regulations. There will also need\
    \ to be local adjustments as each country has a unique set of social, economic,\
    \ regional, and political conditions. Thus, the approaches to climate risk management\
    \ will evolve over time.\n\nFor example, the Swedish regulator put a new policy\
    \ in place: an aggressive target for its country to become the world's first net-zero\
    \ fossil fuel emissions nation, as part of its Roadmap 2050.\n\n*   Energy cost\
    \ increases could lead to significant increases in cost of electricity for households,\
    \ business closures, and job losses.\n\n*   Significant supply chain issues would\
    \ further drive an increase in the costs of goods and services.\n\n*   There are\
    \ contagion effects on other downstream industries such as petrochemical plants\
    \ that have infrastructure designed to derive chemical products.\n\n*   Living\
    \ costs will increase.\n\n*   Inflation will increase.\n\nThis is not to say that\
    \ complacency is welcome. Climate risk has a direct impact on the economic environment\
    \ that the financial services industry operates in, their business operations,\
    \ and counterparties. Organizations will need to be proactive and disciplined\
    \ to make progress toward responding to climate risks. A fine balance between\
    \ mitigating climate risk and ensuring financial stability will need to be established,\
    \ which will be influenced by the vulnerabilities to climate risk and how it evolves,\
    \ government policy responses, and customer expectations and needs. This is a\
    \ journey!\n\n### Regulatory Guidance and Compliance Measures\n\nIn most cases,\
    \ financial institutions are not waiting for governments to drive the large-scale\
    \ action needed to mitigate financial risks. They are responding to signals from\
    \ institutional investors (such as the IIGCC\n\nCentral banks and regulators are\
    \ releasing forward-looking climate stress tests and disclosure expectations,\
    \ mostly based on the recommendations by the Task Force on Climate-Related Financial\
    \ Disclosures (TCFD).\n\nTo assess the impacts of climate change, many organizations\
    \ are extending their scenario analysis and stress testing frameworks to include\
    \ climate risk scenarios. This is also the approach adopted by many central banks.\
    \ Scenario analysis is a helpful tool to, firstly, comply with climate-related\
    \ regulatory stress testing and secondly, allow various stakeholders to better\
    \ understand the shorter- and longer-term implications under a range of forward-looking\
    \ scenarios, and plan accordingly."
