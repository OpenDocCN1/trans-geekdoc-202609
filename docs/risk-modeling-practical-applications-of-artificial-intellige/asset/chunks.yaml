  trans: '


    具体而言，该解决方案整合了现有投资中的公司实体。该应用程序通过丹麦注册机构下载客户金融投资者正在考虑投资的每家公司的年度报告，以非结构化文本信息的形式呈现。此外，它通过机器人流程自动化（RPA）从联合国全球数据库获取可持续发展报告。在这种情况下，由于无法使用
    API，因此需要使用 RPA。RPA 执行屏幕抓取，提取信息并将其存储在结构化数据集中。可持续发展报告包含了可持续发展目标（SDGs），以及人权、劳动权、环境和反腐败信息。


    人工智能和机器学习用于通过使用新类型数据识别特定气候信息、生成 SDG 评分以及分析趋势和变化来改进这一流程。


    ## 结语


    对于金融机构而言，迫切需要将气候风险纳入其财务决策和风险管理过程中。由于我们正处于向低碳经济转型的关键性十年，金融机构迫切需要在此可持续金融方面发挥领导作用，并帮助管理转型过程中的财务和非财务风险。问题的规模和复杂性要求新的思维和新技术。鉴于此，组织必须尽早建立其气候风险管理能力：采用前瞻性的气候风险建模方法，并负责任地使用人工智能和机器学习。


    ## 脚注


