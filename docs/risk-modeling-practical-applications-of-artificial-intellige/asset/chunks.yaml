    Specifically, in financial services, a principle-based governance framework will
    promote the proper use of models, the right layers of accountability and degrees
    of transparency, together with consistency in the development, deployment, and
    use of risk models.


    # ESTABLISHING THE RIGHT INTERNAL GOVERNANCE FRAMEWORK


    Where models are used for decision-making, whether traditional or AI and machine
    learning, organizations should be attentive to the possible adverse consequences
    of decisions based on models that are incorrect or misused and should address
    those consequences through active model risk management. These adverse consequences
    may include, but are not limited to potential for monetary loss, and reputational
    risk.


    The concept of AI and machine learning governance is much debated by industry
    bodies. Based in part on highly publicized AI model failings (take, for example,
    the chatbot `Tay`) and misconceptions of how automated systems operate, there
    is a general sense of distrust in the responsible use of AI and machine learning
    that further highlights the need for better model governance.


    Most organizations have set up strong governance frameworks for their traditional
    risk models. According to regulatory guidance, with the right controls in place,
    existing frameworks can be extended to AI and machine learning.


    According to the Office of the Currency Comptroller (`OCC`), in `SR11/7`, an effective
    model governance framework includes robust model development, implementation,
    and use, as well as effective validation, sound governance, policies, and controls.


    The `OCC` highlights that model risk increases with greater model complexity,
    with more inputs and more uncertainty about model assumptions. With a potential
    broader extent of use, the potential impact, if the model goes wrong, is larger.


    When it comes to effective model risk management and expectations from supervisors,
    organizations must prove their understanding of model inaccuracies and unintended
    consequences, their implications, and mitigating actions.


    In general, it is helpful to align the level of governance based on the context
    and the materiality of the risk model. Keep in mind that the model governance
    approach aligns to the size of the organization and materiality of the model,
    as well as the impacts, if unintended consequences are realized. If additional
    users are using a model, then it is recommended that the model materiality be
    reassessed. In practice, we have found that if an organization focuses on the
    performance of models—be that traditional models or machine learning—at group
    level only, then subsidiaries can be ignored, where the materiality of the models
    could be vastly different. This might not create a significant exposure at the
    group level but could pose significant model and reputational risk at the subsidiary
    level.


    To provide the necessary governance and oversight, for risk models that impact
    high-stakes risk decisions, a range of stakeholders, from external regulators
    to the board, to senior management, are involved in various stages of the risk
    model lifecycle. In addition to stakeholders directly involved in the risk model
    lifecycle, the right governance framework will further foster trust and transparency
    in the models for other users and consumers.


    # DEVELOPING MACHINE LEARNING MODELS WITH GOVERNANCE IN MIND


    An important question to ask yourself before launching an AI or machine learning
    is: “How do we put the right governance guardrails in place to ensure that models
    from the lab put into production continue to remain fit for purpose and deliver
    value expected?” One approach, as mentioned, is to build stronger trust in the
    data, the models, and align expected outcomes with the business objectives.


    Having the right people, processes, and policies in place will help standardize
    the treatment of AI and machine learning at the enterprise level. As many of the
    model development steps can be automated, AI and machine learning are often easier
    to develop compared to, say, traditional statistical models, but it requires higher
    levels of monitoring, with AI and machine learning needing to be monitored more
    frequently depending on the use case.


    With AI and machine learning governance, questions about use can be raised throughout
    the lifecycle:


    *   How were the conceptual soundness of machine learning assessed?

    *   How were features generated and selected?

    *   Can the model and its key drivers be explained in technical and nontechnical
    terms?

    *   Is the benchmark interpretable?

    *   How do I plan to ensure machine learning remains fit for purpose?

    *   How fast can the model be replaced if it shows significant deterioration?


    These questions and others are captured in `Figure 7.1`. For these reasons, existing
    governance frameworks may not be sufficient to handle the increased model risk
    associated with AI and machine learning.


    As mentioned, in general, with the use of AI and machine learning, model risk
    tends to be higher. In addition, post-hoc explainability and interpretability
    add an additional layer of complexity. There is also an increased risk of model
    error due to poor data quality and the risk of perpetuating societal or individual
    biases. `Figure 7.2` captures the mentioned challenges, in addition to others,
    that tend to increase model risk with AI and learning.


    Standardized industry practices to better manage the increasing demands pertaining
    to model governance are still evolving with influential forces across internal
    and external stakeholders:


    *   Public pressure and advocacy to promote the ethical use of AI and machine
    learning.

    *   Compliance with laws and regulations that compel organizations to respect
    the rights and interests of people with respect to how they use AI and machine
    learning, together with personal data.

