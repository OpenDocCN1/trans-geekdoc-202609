    \n# CHAPTER 4  \n\nExplaining Artificial Intelligence, Machine Learning, and Deep\
    \ Learning Models\n\nDue to the black box nature of some, not all, artificial\
    \ intelligence (AI) and machine learning algorithms, the model logic and the subsequent\
    \ decisions are often hard to explain. This inability to explain the modeling\
    \ approach, mechanics, and limitations may apply to both a technical and nontechnical\
    \ stakeholder. For example, a model validator will want to assess that the model\
    \ is performing as expected, while senior management will want to understand what\
    \ will happen if the model produces incorrect predictions. In both cases, if the\
    \ functional form of the model does not lend itself to human intuition, and/or\
    \ the model development process is opaque, these questions become difficult to\
    \ answer.\n\nFirstly, considering the model logic, for some AI and machine learning,\
    \ the lack of explainability stems from the complex engineered features that may\
    \ include sophisticated and nonlinear transformations. In this case, the machine-created\
    \ model inputs and modeled relationships between inputs lack human intuition.\n\
    \nIn some cases, the lack of explainability stems from the model optimization\
    \ process that is driven by the model itself rather than human intelligence, which\
    \ means that the “learning” of the model is often captured within the model rather\
    \ than by a human.\n\nIn a speech,\n\nThe complexity of AI and machine learning\
    \ is both strength and weakness. It makes the models very flexible to detect nonlinear\
    \ interactions and correlations, but also more prone to model spurious relationships\
    \ in the training data, otherwise known as overfitting. In some cases, complexity\
    \ is associated with opacity. Therefore, there is a trade-off between the opacity\
    \ of the algorithm and its business benefits—for example, improved accuracy or\
    \ efficiency.\n\nAI and machine learning algorithms are said to utilize fewer\
    \ statistical assumptions but optimize hyperparameters based on an objective function.\n\
    \nIn general, models, analytical algorithms, and quantitative computations used\
    \ in risk management are subject to strict regulatory guidance, like the independent\
    \ assessment of the conceptual soundness of the analytical approach. The lack\
    \ of inherent explainability of AI and machine learning raises a fundamental question:\
    \ How can we assess the conceptual soundness of a model that is hard to explain?\n\
    \nIn addition, with a model that lacks explainability, it is difficult to foresee\
    \ any unintended consequences from model usage, and this increases the operational\
    \ risk when implementing the model in production. With AI and machine learning,\
    \ process audit and oversight of the model development process become more prominent.\n\
    \nA lack of explainability impedes not only the ability to explain the model logic\
    \ but also the individual decisions made by the model. This is an important aspect\
    \ in areas where consumer protection laws are in operation (such as credit decisions\
    \ where reason codes are required) or other highly regulated industries."
