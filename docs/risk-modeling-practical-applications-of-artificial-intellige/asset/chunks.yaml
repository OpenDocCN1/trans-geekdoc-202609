    # 可解释人工智能是一门多学科科学领域，针对特定的领域和主题拥有专门的资源和方法。在本节中，我们将重点介绍风险管理领域流行的几种方法和技术。


    ## 内置解释性与模型无关解释性


    首先，我们区分内置解释性和模型无关解释性。


    当今某些人工智能和机器学习是完全可解释且可理解的。我们可以说，可解释的风险模型本质上是可解释的（例如决策树和回归方法）。在风险管理的某些情况下，许多作者认为，对于影响消费的模型或受监管的模型，这些模型更具优势。


    当然，在某些情况下，复杂模型提供了准确性的提升。风险模型建模师也可以通过对输入施加约束来提高复杂模型的解释性。在模型开发过程中，建模师可能会对特征添加约束以维护特定领域的规则（例如，开发具有单调性、加性、线性或平滑约束的神经网络）。


    另一个关注点是模型无关解释性。模型无关解释性方法独立于建模算法，通常在模型开发后应用。有不同的模型无关方法用于解决人工智能和机器学习中缺乏解释性的各个方面。表
    4.1 汇总了根据对模型及其输入提出的不同问题，如何应用几种重要的模型无关方法。


    表 4.1 中包含的几种方法可以作为事后解释，以更好地理解模型逻辑。此类方法可以同时应用于全局和局部层面。全局方法适用于数据集，而局部方法则解释单个观测值或特定预测的模型结果。


    ### 表 4.1 可用于解决模型问题的模型无关技术


    | 问题 || 模型无关技术 | 类型 |

    | --- | --- | --- |

    | 哪些是最重要的特征？ || 特征重要性、相对特征重要性 | 全局 |

    | 驱动因素是如何起的？ || 部分依赖性、个体条件期望、显著图 | 全局/局部 |

    | 针对特定预测的解释是什么？ || 局部可解释模型无关解释 (LIME)、Shapley 值 | 局部 |

    | 为了让特定预测获得不同的结果，需要改变什么？ || 反事实、对抗性测试 | 局部 |

    | 模型对特征空间变化的鲁棒性如何？ || 敏感性分析、压力测试 | 全局 |


    事后解释包括全局解释性方法（如特征重要性和部分依赖性），以及局部解释性方法（如 Shapley 值、个体条件解释和局部可解释模型无关解释）。接下去将解释这些方法。


    ## 事后方法


    ### 1. 部分依赖图

    PDP（部分依赖图）显示了输入与预测之间的函数关系。它通过扰动单个特征的值来实现这一目标，描绘模型在特征取值范围内的平均预测情况。（见图 4.1）。


    ### 2. 个体条件解释

    与部分依赖图类似，在这种情况下，个体条件解释在个体或局部层面跟踪平均预测值。ICE 图也有助于检测交互作用。（见图 4.2）。


    ![图 4.1 解释特征与标记变量之间函数关系的的部分依赖图示例（全局层面）。](img/c04f001.png)


    **图 4.1** 解释特征与标记变量之间函数关系的局部依赖图示例（全局层面）。


    ![图 4.2 局部层面的个体条件解释示例。](img/c04f002.png)


    **图 4.2** 局部层面的个体条件解释示例。


    ### 3. Shapley 值

    Shapley 值源于博弈论，通过跨排列平均来解释特征对预测的贡献。Shapley 值的一个优点是它以加性的方式将单个特征效应归于整体预测：Shapley
    值的总和等于该实例的整体预测。由于它是加性的，因此非常直观，并可以帮助解释单个预测背后的驱动因素。（见图 4.3）。


    ![图 4.3 局部层面的 Shapley 值示例。](img/c04f003.png)


    **图 4.3** 局部层面的 Shapley 值示例。


    ### 4. 显著图

    显著图（如图 4.4


    **图 4.4** 通常用于计算机视觉的显著图示例（见 https://go.documentation.sas.com/doc/en/pgmsascdc/9.4_3.5/casdlpg/n0rkb1a1p6r6k141f6zaw.htm）。


    ![图 4.5 局部可解释模型无关解释 (LIME)示例。](img/c04f005.png)


    **图 4.5** 局部可解释模型无关解释 (LIME)示例。


    ### 7. 局部规则解释

    与 LIME 类似，LORE（局部规则解释）通过构建一组决策规则作为代理模型来解释任何模型的预测，帮助解释决策的原因。此外，它还会生成一组反事实规则，解释导致不同结果的特征变化。


    ### 8. 累计局部效应

    ALE（累计局部效应）图通过处理特征相关性扩展了 PDP。


    ### 9. 模型稳定性/敏感性分析

    敏感性或稳定性分析用于压力测试模型，通过评估模型在训练数据未涵盖的数据范围内的性能和行为来完成测试。这可以使用合成数据来评估模型的鲁棒性。一种常用技术是合成少数类过采样技术
    (`SMOTE`)，或者对神经网络权重施加噪声扰动来评估神经网络相对于准确率的变化。


    ### 10. 对抗性测试

    某些机器学习算法更容易受到对抗攻击。对抗攻击是故意设计用于导致模型分类错误的攻击。这可以在模型开发期间或之后发生。为了进一步解释对抗攻击如何发生：


    *   在模型开发期间，机器学习是基于一致统计分布进行训练的。


