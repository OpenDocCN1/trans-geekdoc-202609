    Third, keep in mind, in general, that AI and machine learning algorithms require
    heavy compute power for development, but may be surprisingly light when it comes
    to scoring (e.g., neural networks for function approximation).


    Furthermore, the post-modeling processes, including decision logic and the feedback
    for regular monitoring of the model, are all design decisions that will affect
    the ease of deployment. We next describe key considerations of regular, continuous
    model monitoring.


    ![Figure 6.5 The steps in the risk model lifecycle within the context of legal,
    ethical, and regulatory constraints.](images/c06f005.png)


    [Figure 6.5](#c06.xhtml#R_c06-fig-0005) The steps in the risk model lifecycle
    within the context of legal, ethical, and regulatory constraints.


    ## Continuous Model Monitoring


    Traditionally, financial institutions have in place standard monitoring processes
    for risk models. Risk models are typically subject to regulatory compliance that
    requires regular performance tracking.


    As the number of risk models are ever increasing, the sophistication of modeling
    methods deployed by financial institutions is also increasing. This is particularly
    clear with the adoption of AI and machine learning, where enhanced transparency
    is often needed. As new data becomes available, AI and machine learning are often
    dynamically updated, which requires that the performance of the model is monitored
    dynamically. Many metrics are tracked to ensure that the model is performing as
    expected, including data quality, model drift, explainability, model robustness,
    and bias.


    By automatically and dynamically tracking the performance, including champion
    and challenger models, risk departments will be better equipped to proactively
    find issues that may lead to model failure ([Figure 6.6](#c06.xhtml#c06-fig-0006)).


    ## Model Orchestration


    How the lifecycle of a model is managed, especially after deployment, is crucial.
    If a model starts to drift, how long does it take to retrain on new data? If it
    needs to be replaced with a new champion, what steps need to be taken to implement
    a new model in production? Furthermore, with newer innovations and adopted technologies
    such as cloud and containers, integrating analytics as part of these systems requires
    a process that can carefully guide workflow from analytics platforms into other
    software and IT environments.


    ![Figure 6.6 Continuous monitoring of models in production.](images/c06f006.png)


    [Figure 6.6](#c06.xhtml#R_c06-fig-0006) Continuous monitoring of models in production.


    To ensure that the model lifecycle can be managed, it is important to have an
    orchestration layer that can enable both automation and governance. Automation
    is key to enabling speed, whether it''s ensuring that models can be re-trained,
    or deployed as quickly as possible, or even implementing into business rules.
    At the same time, governance is paramount to ensure that the correct approvals
    are made by the correct stakeholders. By enabling approval and user input, organizations
    ensure that their model lifecycle processes are transparent and auditable, as
    well as allowing the business users to collaborate more effectively with IT, as
    the model moves from the analytics platform into the production, IT-led environment.


    ## Concluding Remarks


    An inability to deploy AI and machine learning at scale creates bottlenecks in
    analytical efforts and means that the value the models intend to generate is not
    realized. When a new model is trapped as a data science project, it erodes the
    “wow” effect of newer, more sophisticated models.


    The good news is that the technologies for model deployment have also advanced
    in recent years, and this means that AI and machine learning can be better integrated
    into existing services and front-end applications, either directly or via APIs.


    ## Endnote


    1. [1](#c06.xhtml#R_c06-note-0001). Melissa Davis, *Gartner: Accelerating AI Deployments—Paths
    of Least Resistance.* (Framingham, MA: IDG Connect, 2021).


    # Chapter 7: Extending the Governance Framework for Machine Learning Validation
    and Ongoing Monitoring


    The benefits of AI and machine learning do not present themselves without risks.
    Internal and external stakeholders are rightly concerned about the typical challenges
    ranging from the ethical use of AI and machine learning to the ability to explain
    the workings of the algorithms, to the amplified risk of propagating bias in decision-making.
    However, one of the toughest challenges is creating a suitable and robust continuous
    performance monitoring framework that can adapt and respond to the increased model
    risk of AI and machine learning. Keeping up with the same number of resources
    and keeping costs low is a key concern for many risk managers. Having a monitoring
    framework in place spans beyond the regulatory and pre-production aspects of model
    risk management. In general, an AI and machine learning monitoring framework should
    be adept to handle:


    *   **Model degradation.** AI and machine learning tend to degrade faster than
    traditional and historically tuned statistical models.

    *   **Biased predictions.** AI and machine learning tend to identify complex and
    nonlinear patterns in data that are hidden from traditional models. These patterns
    may propagate biased decision-making or hide corrupted data. In a way, the machine
    learning needs to be protected from the bias in data that can contribute to unfair
    decisions that they are a part of. Other components of decision making are policy
    rules, business roles, and human-based manual overrides. All aspects that contribute
    to decisions, not limited to models, can result in biased predictions.

    *   **Balance.** High materiality models have always required a high level of
    human oversight. The same applies to the use of AI and machine learning: closed,
    fully automated, black-box systems that lack human oversight and ability to override
    are not recommended. There are also other key considerations to account for, such
    as the context in which the model will be used, and privacy implications of the
    data.


    Typically, risk models, including those used for intra-day or near-real-time calculations,
    are used in settings with existing and established governance practices in place.
    With the use of more advanced technologies and approaches, like AI and machine
    learning, model risk tends to be higher (as explained in the next section), therefore
    near-real-time performance tracking of these models becomes critical.


    A robust AI and machine learning governance framework aligns the oversight of
    the use of AI systems and machine learning to the corporate strategy and values
    of an organization. AI governance is that strategy that then defines the policies
    and procedures to establish accountability for the safe development, deployment,
    and use of AI systems and machine learning. These aspects are central tenants
    of Conway''s law—that an organization''s dysfunction always reveals itself in
    its products. Thus, AI and machine learning governance reflects the organization''s
    mindset.


    In 2019, the OECD defined a set of AI principles to promote the use of AI for
    innovation while protecting human rights.


    In addition to regulations on AI governance, in 2021, the Federal Trade Commission
    in the United States defined its expectations for the responsible use of AI, especially
    in the context of fair outcomes for consumers.


    In 2021, the Office of the Currency Comptroller updated its model risk management
    standards to take into account the use of AI and machine learning.


    In a sense, all models are representations of reality, and by its nature, will
    have some degree of uncertainty and inaccuracy. The better the characteristics
    and the limitations of the model are understood—up front—the better informed the
    model validation function will be in managing and monitoring the model in production.

    '
  trans: '

    第三，请记住，通常情况下，AI 和机器学习算法在开发阶段需要大量的计算能力，但在进行评分时可能出奇地轻量（例如，用于函数近似的神经网络）。


    此外，建模后的过程（包括决策逻辑和对模型定期监控的反馈）全都是影响部署易用性的设计决策。接下来我们将描述定期、持续模型监控的关键考虑因素。


    ![图 6.5 在法律、伦理和监管约束下的风险模型生命周期中的步骤。](img/c06f005.png)


    图 6.5 在法律、伦理和监管约束下的风险模型生命周期中的步骤。


    ## 持续模型监控


    传统上，金融机构对风险模型建立了标准的监控流程。风险模型通常受监管合规性，需要定期的性能跟踪。


    随着风险模型数量的不断增加，金融机构部署的建模方法的复杂性也日益提高。这在采用 AI 和机器学习时尤为明显，因为这通常需要更高的透明度。随着新数据的可用，AI
    和机器学习通常会动态更新，这要求对模型性能进行动态监控。通过跟踪许多指标来确保模型按预期运行，包括数据质量、模型漂移、可解释性、模型稳健性和偏差。


    通过自动和动态地跟踪性能（包括冠军模型和挑战者模型），风险部门将能够更好地地主动发现可能导致模型故障的问题（图 6.6）。


    ## 模型编排


    模型生命周期的管理（特别是在部署后）至关重要。如果模型开始漂移，在新的数据上重新训练需要多长时间？如果需要用新的冠军模型替换，需要采取哪些步骤在生产环境中实施新模型？此外，随着云和容器等更新创新技术的采用，将分析作为这些系统的一部分需要一个能够仔细引导工作流从分析平台进入其他软件和
    IT 环境的过程。


    ![图 6.6 生产环境中模型的持续监控。](img/c06f006.png)


    图 6.6 生产环境中模型的持续监控。


    为了确保模型生命周期可以被管理，拥有一个能够同时实现自动化和治理的编排层至关重要。自动化是实现速度的关键，无论是确保模型可以重新训练、尽可能快速部署，还是实施到业务规则中。同时，治理对于确保由正确的利益相关者做出正确的审批是重中之重。通过允许审批和用户输入，组织可以确保其模型生命周期过程是透明且可审计的，并允许业务用户在模型从分析平台移动到由
    IT 主导的生产环境时与 IT 进行更有效的协作。


    ## 结语


    无法大规模部署 AI 和机器学习会导致分析工作出现瓶颈，并意味着模型意图产生的价值无法实现。当一个新模型被困在数据科学项目中时，它会削弱更先进、更复杂模型的“惊艳”效应。


    好消息是，近年来模型部署技术取得了进步，这意味着 AI 和机器学习可以直接或通过 API 更好地集成到现有服务和前端应用程序中。


    ## 脚注


    1. 1。Melissa Davis, *Gartner: Accelerating AI Deployments—Paths of Least Resistance.*
    (Framingham, MA: IDG Connect, 2021)。


    # 第 7 章：扩展机器学习验证和持续监控的治理框架


    AI 和机器学习的益处并非没有风险的。内部和外部利益相关者理智地担心典型的挑战，范围从 AI 和机器学习的伦理使用到解释算法工作原理的能力，再到决策中传播偏差的风险增加。然而，最困难的挑战之一是创建一个合适且稳健的持续性能监控框架，使其能够适应并响应
    AI 和机器学习日益增加的模型风险。在保持资源投入不变的同时维持低成本是许多风险管理人员关注的重点。建立监控框架的影响超了模型风险管理的监管和生产前方面。通常情况下，AI
    和机器学习监控框架应该熟练地处理：


    *   **模型退化。** AI 和机器学习的退化速度往往比传统的和经过历史调优的统计模型更快。

    *   **偏差预测。** AI 和机器学习倾向于识别数据中隐藏传统模型无法察觉的复杂和非线性模式。这些模式可能会导致偏差的决策，或隐藏损坏的数据。在某种程度上，机器学习需要免受数据中偏差的影响，因为这些偏差可能导致其所参与的不公平决策。决策的其他部分包括策略规则、业务角色和人工手动干预。所有导致决策的方面（不限于模型）都可能导致偏差预测。


    通常情况下，风险模型（包括用于日内或近实时计算的模型）是在具有现有且既定治理实践的环境中使用。随着使用更先进的技术和方法（如 AI 和机器学习），模型风险往往更高（如下一节所述），因此对这些模型进行近实时性能跟踪变得至关重要。


    稳健的 AI 和机器学习治理框架将 AI 系统和机器学习的使用监督与组织的战略和价值观对齐。AI 治理是定义策略和程序的策略，以建立 AI 系统和机器学习安全开发、部署和使用的问责机制。这些方面是康威律的核心原则——一个组织的效率缺陷总会体现在其产品中。因此，AI
    和机器学习治理反映了组织的思维方式。


    2019 年，OECD 定义了一套 AI 原则，旨在保护人权的同时促进使用 AI 进行创新。


    除了 AI 治理监管外，2021 年，美国联邦贸易委员会定义了对负责任使用 AI 的期望，特别是在消费者公平结果的背景下。


    2021 年，货币监察局更新了其模型风险管理标准，以考虑到 AI 和机器学习的使用。


    从某种意义上说，所有模型都是现实的表示，其本质上会有某种程度的不确定性和不准确性。越早地了解模型的特性和局限性，模型验证功能在管理和监控生产中的模型时就越有信息。

    '
