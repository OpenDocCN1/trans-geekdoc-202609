    \ 2021).\n\n12.  [12](#c07.xhtml#R_c07-note-0012). Andrea Tang, “Making AI GDPR\
    \ compliant,” *ISACA Journal* (5) (2019), [https://www.isaca.org/resources/isaca-journal/issues/2019/volume-5/making-ai-gdpr-compliant](https://www.isaca.org/resources/isaca-journal/issues/2019/volume-5/making-ai-gdpr-compliant)\n\
    \n13.  [13](#c07.xhtml#R_c07-note-0013). European Commission, *Proposal for a\
    \ Regulation of the European Parliament*.\n\n14.  [14](#c07.xhtml#R_c07-note-0014). European\
    \ Commission, *Ethics guidelines for trustworthy AI* (April 8, 2019), [https://digital-strategy.ec.europa.eu/en/library/ethics-guidelines-trustworthy-ai](https://digital-strategy.ec.europa.eu/en/library/ethics-guidelines-trustworthy-ai)\n\
    \n# CHAPTER 8  \n\nOptimizing Parameters for Machine Learning Models and Decisions\
    \ in Production\n\nWe can define optimization as the act, process, or method that\
    \ is employed to find the “best” element from a set of alternatives based on the\
    \ objectives, such as maximizing yield, while satisfying all the constraints.\
    \ Within the context of a current business problem, this “best” element can be\
    \ far-reaching: from a system, decision, or technical design. “Problems” can include\
    \ but are not limited to:\n\n*   Capital allocation across portfolios to maximize\
    \ yield\n\n*   Efficient use of resources to minimize waste\n\n*   Optimal decision\
    \ path generation with the least amount of information\n\nFor example, to optimize\
    \ capital across portfolios, the allocation of credit risk mitigants to credit\
    \ risk exposures under different regulatory regimes can be done with a specific\
    \ objective in mind. Here, the allocation is optimized in a way that allows a\
    \ firm to reduce their regulatory capital requirements within the context of a\
    \ regulatory framework. Here, the regulatory requirements are the constraints\
    \ within the optimization problem."
