  trans: '


    -   对人工智能（AI）、机器学习和自主系统的独立审计。


    ## 监控人工智能与机器学习


    机器学习与其他模型一样需要治理，而且程度更为迫切。在某种程度上，这是因为这些模型的设计旨在通过经验进行自动改进。它们“学习”的能力使其具有更高的准确性和可预测性，但也可能极大增加其模型风险，并导致基于其能够识别的数据模式而产生偏差。组织建立严谨的治理流程至关重要，这些流程能够快速识别模型何时开始失效，并对输入（数据）和输出（模型结果）定义明确的操作控制。人工智能和机器学习的动态特性意味着它们需要更频繁的性能监控、持续的数据审查和基准测试。随着模型数量的增加，需要对上下文模型清单有更好的理解并制定具操作性的应急预案。


    即使组织已将其模型治理扩展到人工智能和机器学习，对于人工智能和机器学习的持续监控，仍有一些超出之前章节中已实施和讨论范围的进一步考量。


    我们在本章中已经解释过，传统上，组织拥有一标准的模型治理框架，包括对监管和非监管风险模型进行定期监控报告和审查。所有风险模型通常都要经过内部和外部验证，这需要通过性能和操作计算指标对模型进行定期跟踪。


    随着新的监管要求随时间推移调整模型以及风险模型的数量，随着人工智能和机器学习的主流采用，建模方法的复杂性正在增加，并将持续增长。人工智能和机器学习通常是动态更新的（即更容易用用新数据进行校准），这意味着需要随时间对一系列指标进行跟踪，以确保模型运行在业务目标和合规措施预期的边界内。


    当从下方列出的维度以及图 7.3


    [图 7.3 在更全面地审视模型健康状况时应考虑的人工智能和机器学习的进一步考量，包括在性能下降被测量之前识别出需要立即关注模型的措施。


    ### 模型衰减


    建立模型验证的既有行业实践通常包括模型性能的监控、模型输入的稳定性和模型校准。这些指标对于人工智能和机器学习仍然有效。此外，对于人工智能和机器学习，特别是持续更新的模型，有必要持续监控模型的可解释性和潜在偏差。重要的是，性能监控结果应以某种方式汇总，让用户理解问题根源所在之处，以便在上下文中审查性能结果。


    例如，如提到的，由于其复杂性，人工智能和机器学习倾向于捕捉数据中可能暂时的关系。为了解释时间波动，必须更频繁地监控模型。


    模型下降通常是数据漂移或概念漂移的结果：


    -   `Data drift`（数据漂移）发生在特征属性分布随时间相对于模型开发样本发生变化。这需要对样本数据与生产数据进行监控——当模型更新更频繁时，复杂性随之增加。

    -   `Concept drift`（概念漂移）发生在市场状况或政策改变了模型解释。在模型解释改变的情况下，通常需要对开发数据重新标记并重新训练模型。可以通过评估驱动模型预测的特征之间的历史关系来衡量概念漂移。


    ### 稳定性


    人工智能或机器学习及基准模型的稳定性通常通过评估数据输入、群体和特征的稳定性来实现。


    #### 群体漂移


    群体稳定性指数（`PSI`）是衡量模型结果随时间保持稳定的方法之一。它是传统统计或计量经济模型的既有指标。它是一种散度指标，用于衡量两个分布（例如，当前群体和模型开发样本）之间的距离。它通常被解释为一种经验法则，也可以使用置信区间进行解释，这对于机器学习模型的持续监控可能更为合适。


    ### 特征漂移


    群体稳定性指数也可用于计算特征层面的散度，即特征稳定性指数（`CSI`）。它衡量了模型特征的分布与开发样本之间的差异。


    评估人工智能或机器学习特征稳定性的另一种方法是使用自助法（bootstrapping）或随机扰动。这可以通过子采样或随机扰动开发数据来创建 `n` 个数据集。将选择特征的算法应用于
    `n` 个数据集，并创建 `m` 个特征。通过确定跨 `n` 个数据集的选特征的相似性来衡量特征的稳定性。


    它也可以使用 t-分布随机邻域嵌入（`T-SNE`）进行计算。


    #### 稳健性、基准测试和回测


    稳健性（无论是否基于机器学习）是指模型在泛数据上的良好泛化能力。模型稳健性可以通过泛化和停止剪枝方法来提高。过拟合也可以通过交叉验证进行评估。这些测试包括基准测试、回测和稳定性评估。


    '
