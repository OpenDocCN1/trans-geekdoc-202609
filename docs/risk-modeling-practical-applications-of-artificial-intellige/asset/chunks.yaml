    # Explainable AI is a multidisciplinary scientific field with dedicated resources
    and methods specific to the respective domain and subject areas. In this section,
    we will highlight a few approaches and methods that are popular in the risk management
    domain.


    ## Intrinsic vs. Model-Agnostic Explainability


    First, we distinguish between intrinsic and model-agnostic explainability.


    There are AI and machine learning that exist today that are fully explainable
    and interpretable. We can say, interpretable risk models are intrinsically explainable
    (e.g., decision trees and regression methods). In some instances, for risk management,
    several authors reason that these are preferred for models impacting consumers
    or models that are regulated.


    Of course, in some cases, complex models offer accuracy improvements. Risk modelers
    may also opt to improve the explainability of complex models by applying constraints
    to inputs. During the model development process, modelers may add constraints
    to features to maintain domain-specific rules (e.g., developing neural networks
    with constrained monotonicity, additivity, linearity, or smoothness).


    Another area of focus is model-agnostic explainability. Model-agnostic explainability
    methods are independent of the modeling algorithm and typically applied after
    model development. There are different model-agnostic methods used to address
    the various aspects of a lack of explainability in AI and machine learning. [Table
    4.1](#c04.xhtml#c04-tbl-0001) summarizes how several important model-agnostic
    methods can be applied, depending on the questions being asked of the model and
    its inputs.


    Several of the methods included in [Table 4.1](#c04.xhtml#c04-tbl-0001) can be
    applied as post-hoc explanations to better understand the model logic. Such methods
    can be applied at both the global and local level. A global method applies to
    the dataset while a local method explains the model outcome for an observation
    or for a particular prediction.


    ### [Table 4.1](#c04.xhtml#R_c04-tbl-0001) Model-agnostic Methods as Techniques
    That Can Be Applied to Address Model-Related Questions


    | Question || Model-agnostic Technique || Type |

    | --- | --- | --- |

    | What are the most important features? || Variable importance Relative variable
    importance || Global |

    | How do the drivers work? || Partial dependence Individual conditional expectation
    Saliency maps || Global/Local |

    | What is the explanation for a particular prediction? || Local interpretable
    model-agnostic explanations Shapley values || Local |

    | What needs to change to get a different outcome for a particular prediction?
    || Counterfactuals Adversarial testing || Local |

    | How robust is the model to changes in the feature space? || Sensitivity analysis
    Stress testing || Global |


    Post-hoc explanations include global interpretability methods such as feature
    importance and partial dependence, as well as local interpretability methods such
    as Shapley values, individual conditional explanations, and local interpretable
    model-agnostic explanations. These will be explained next.


    ## Post-hoc Methods


    ### 1. Partial dependence plots

    PDP (partial dependence plots) show the functional relationship between the input
    and the prediction. It achieves this by perturbing the values of a single feature
    to depict the average prediction of the model for the range of values of the feature.
    (See [Figure 4.1](#c04.xhtml#c04-fig-0001).)


    ### 2. Individual conditional explanations

    Like partial dependence plots, but in this case, individual conditional explanations
    track the average prediction at the individual or local level. ICE plots are also
    helpful to detect interactions. (See [Figure 4.2](#c04.xhtml#c04-fig-0002).)


    ![Figure 4.1 Example of a partial dependency plot explaining the functional relationship
    between the feature and the labeled variable (at the global level).](images/c04f001.png)


    [**Figure 4.1**](#c04.xhtml#R_c04-fig-0001) Example of a partial dependency plot
    explaining the functional relationship between the feature and the labeled variable
    (at the global level).


    ![Figure 4.2 Example of an individual conditional explanation at the local level.](images/c04f002.png)


    [**Figure 4.2**](#c04.xhtml#R_c04-fig-0002) Example of an individual conditional
    explanation at the local level.


    ### 3. Shapley values

    Shapley values have their roots in game theory and explain the contributions of
    the features to a prediction by averaging across permutations. A benefit of Shapley
    values is that it attributes individual feature effects to the overall prediction
    in an additive way: the Shapley values sum up to the overall prediction for the
    instance. As it is additive, it is intuitive and can help explain the drivers
    behind an individual prediction. (See [Figure 4.3](#c04.xhtml#c04-fig-0003).)


    ![Figure 4.3 Example of Shapley values at the local level.](images/c04f003.png)


    [**Figure 4.3**](#c04.xhtml#R_c04-fig-0003) Example of Shapley values at the local
    level.


    ### 4. Saliency maps

    Saliency maps, as shown in [Figure 4.4](#c04.xhtml#c04-fig-0004), are heat maps
    that use color to indicate the region in the feature space that is contributing
    to the prediction. It is a popular method in computer vision.


    ### 5. Local interpretable model-agnostic explanations

    LIME (local interpretable model-agnostic explanations) explains the predictions
    of any model by building a local interpretable surrogate model.


    ### 6. Counterfactual analysis

    A counterfactual explanation of a prediction (assuming a causal relationship)
    describes the smallest change to the features that will lead to a different outcome.


    ![Figure 4.4 Example of a saliency map typically used in computer vision (See
    https://go.documentation.sas.com/doc/en/pgmsascdc/9.4_3.5/casdlpg/n0rkb1a1p6r6k141f6zaw.htm).](images/c04f004.png)


    [**Figure 4.4**](#c04.xhtml#R_c04-fig-0004) Example of a saliency map typically
    used in computer vision (See https://go.documentation.sas.com/doc/en/pgmsascdc/9.4_3.5/casdlpg/n0rkb1a1p6r6k141f6zaw.htm)).


    ![Figure 4.5 Example of local interpretable model-agnostic explanations (LIME).](images/c04f005.png)


    [**Figure 4.5**](#c04.xhtml#R_c04-fig-0005) Example of local interpretable model-agnostic
    explanations (LIME).


    ### 7. Local rule-based explanations

    Like LIME, LORE (local rule-based explanations) explains the predictions of any
    model by building a local interpretable surrogate model as a set of decision rules
    that can help explain the reasons for a decision. In addition, it generates a
    set of counterfactual rules that explain the changes to the features that will
    lead to a different outcome.


    ### 8. Accumulated local effects

    ALE (accumulated local effects) plots extend PDP by handling feature correlations.


    ### 9. Model stability/sensitivity analysis

    Sensitivity or stability analysis is used to stress test the model by assessing
    the performance and behavior of a model on data ranges not captured by the training
    data. This can be done by using synthetic data to assess model robustness. A common
    technique is synthetic minority oversampling technique (`SMOTE`), or by applying
    noise perturbation to the weights of neural network to evaluate changes to the
    neural network with respect to accuracy.


    ### 10. Adversarial testing

    There are machine learning algorithms that are more vulnerable to an adversarial
    attack. Adversarial attacks are intentionally designed to cause models to misclassify.
    This can occur during or after the model development. To further explain how an
    adversarial attack can occur:


    *   During model development, machine learning is trained to optimize based on
    consistent statistical distributions.

    '
