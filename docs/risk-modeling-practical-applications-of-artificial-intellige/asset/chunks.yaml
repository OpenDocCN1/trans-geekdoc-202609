    # CHAPTER 3: Artificial Intelligence, Machine Learning, and Deep Learning Models
    for Risk Management


    Despite the hype of the last few years, artificial intelligence (AI) and machine
    learning have proven themselves as useful tools in risk management. As stated
    earlier, the main reasons are the availability of vast amounts of digital data,
    greater computing power, and easier access to complex analytics via available
    modeling tools. More recently, both adoption of digital channels and increase
    in generated data have accelerated due to the COVID-19 pandemic. This came at
    a time when financial institutions were already facing myriad internal and external
    demands:


    *   Regulatory demands—compliance to new waves of prudential and financial reporting
    standards

    *   Macroeconomic demands—sustained low interest rates and inefficiencies putting
    pressure on profitability and increasing costs, due in part by the inflated cost
    of compliance

    *   Technological advancements—advanced analytics, big data, open banking, cloud-based
    and high-performance computing

    *   Emerging risks—cyberattacks, those created by the COVID-19 pandemic, climate
    change, and geopolitical uncertainty

    *   Digital transformation—challenges to the traditional banking model from new
    customer demands and the rise of newer, more nimble financial technology companies


    Although not without challenges of their own, the use of AI and machine learning
    is one effective way that organizations can improve their agility to respond to
    these demands. Some of the benefits of AI and machine learning in risk management
    include a better, more real-time ability to respond to changes in market conditions
    and efficiency benefits from automation, while making sense of the copious quantities
    of data from digitalization.


    Stress testing. These are forward-looking analyses to assess how adverse scenarios
    affect the resilience of a financial institution''s balance sheet. This is normally
    done by stressing macroeconomic variables like GDP (gross domestic product), unemployment
    rates, and house price indices. A financial institution may take its individual
    portfolios and granular risk factors and stress its risk parameters using internally
    defined scenarios. Analysis can be applied to extract insights from news articles
    and social media to assess sentiment on emerging risks such as geopolitical uncertainty.
    For climate risk assessments, scenario-based analytics utilize climate scenarios
    such as those provided by the Network for Greening the Financial System (NGFS).


    ## Synthetic Data Generation


    With the use of AI and machine learning and the availability of additional compute
    power, the use of synthetic data is rising. Often, the available data used for
    training AI and machine learning has data limitations, such as gaps in the time
    series, insufficient data history, or in the level of granularity. Simulated data
    can help overcome these gaps. The methods that are typically applied range from
    bias adjustments (e.g., the fuzzy method for reject inferencing), repeat sampling
    (bootstrapping), and synthetic minority oversampling (SMOTE) to those that generate
    market states like restricted Boltzmann machines.


    Some AI and machine learning methods intrinsically generate their own data (generalized
    adversarial networks, variational auto-encoders). These methods can help stress
    test models and therefore improve the robustness of models as part of model validation.
    While these apply to high-dimensional data, it bears noting that by simulating
    data based on either an algorithmic approach or approximation, additional model
    risk can be introduced.


    ## Typical Data Preprocessing, Including Feature Engineering


    As described previously, AI and machine learning are increasingly leveraged in
    risk management to augment traditional risk models, because it realizes the long-needed
    risk transformation to automate mundane tasks and to process large volumes of
    data.


    Getting the data correct for AI and machine learning typically involves standard
    tasks. Several of these have been covered, such as data quality, cognitive data
    quality, and extending risk data to “alternative data”. The risk model lifecycle
    also routinely involves feature engineering and dimensionality reduction.


    Feature engineering helps to automatically build a range of features from input
    data. By using simpler features, AI and machine learning become easier to interpret
    and, possibly, to maintain over time. Well-engineered features also reduce the
    effort needed to optimize parameters for machine learning. Feature engineering
    is also important because high-dimensional data often observe sparsity in the
    data points as the number of inputs grow. This means that as more features are
    added, the feature space increases.


    Certain machine learning algorithms are more sensitive to outliers, meaning that
    the output model is skewed toward the outlier population. Outliers are not easy
    to identify in a dataset and take time to interpret. Even well-trained analytics
    experts require time to explore the data for outliers and to then determine what
    to do with them. Are they real or due to a bona fide error? Outlier populations
    can be present in the data used for development of AI and machine learning due
    to system errors in data, for example, when updates occur, or files of data are
    transferred between different systems, or due to data entry errors caused by misinterpretation
    of internal policy, operational processes, and procedures.


    It is also important to explore the relationships that exist between outlier populations,
    as these linked relationships can be helpful to interpret the outliers within,
    and between, datasets.


    There are robust analytical techniques that are helpful to identify outliers.
    One way includes the use of Principal Components Analysis (PCA). Another unsupervised
    technique is the use of T-SNE data visualizations. The clusters or “outliers”
    can be further studied to determine if they are real sub-populations that could
    be separately modeled, or are outliers due to errors in the dataset.


    ## CONCLUDING REMARKS


    For effective data management, organizations rely on effective dataset design
    and their prevailing risk and control self-assessment frameworks. These include
    tracking the accuracy, integrity, and completeness of data used for risk measurement
    and management. Characteristically, although not always, AI approaches tend to
    utilize higher quantities of data, and therefore data quality and data processing
    become more prominent. Technology enablers in the form of catalogs, lineage tracking,
    as well as transparent data and model pipelines enhance the controls and the auditability
    of data processes.


    To fully take advantage of AI and machine learning, current impediments to effective
    data management can be more easily addressed using automated and repeatable processes.


    ## ENDNOTES


    1. [1](#c02.xhtml#R_c02-note-0001). Naeem Siddiqi, *When Lending Inequities Fuel
    Housing Disparities* (Chicago: BAI, 2021).

    2. [2](#c02.xhtml#R_c02-note-0002). Samuel Cohen, Derek Snow, and Lukasz Szpruch,
    *Black-Box Model Risk in Finance* (Mathematical Institute, University of Oxford,
    and The Alan Turing Institute, School of Mathematics, University of Edinburgh,
    February 9, 2021).

