- raw: 'Like a colleague would say, “…*it''s a bit like Schrodinger''s cat*—*the black
    box is not transparent, we therefore don''t know if the cat is alive or not*.”
    Of course, there are explainability diagnostics to help with that. An overview
    of these is provided in a subsequent section.


    ## DIFFERENCE BETWEEN EXPLAINING AND INTERPRETING MODELS


    Explaining an AI or machine learning refers to the ability of a human to describe
    the most important model inputs and draw inferences on why the model predictions
    are what they are. To explain the model, the inferences need not be exact. In
    this case, the models can also be explained in general terms: the degree of changes
    to model inputs and associated magnitude of the expected changes in outputs. On
    the one hand, there is no guarantee that the answer will exactly match the expectations
    of users or consumers, or that the results are reproducible. On the other hand,
    if a model is interpretable, then the mathematical function can be directly interpreted
    by a human, as well as the method for how the model uses the inputs to derive
    the outputs. There is a guarantee that the model calculations are transparent,
    and the output is reproducible.


    Based on their context and purpose, for many high-stakes decisions in the risk
    management domain, algorithms must be both explainable and interpretable.


    In many instances, risk models require approval from internal and external stakeholders.
    For example, highly material risk models used for market risk, liquidity, and
    capital adequacy require an assessment of their conceptual soundness, approval
    and sign-off from both an independent model validation function internal to a
    firm and from the external regulator. At the same time, in some parts of the world,
    models used for credit decisions require financial services providers to supply
    reason codes to loan applicants to inform them why they have been denied credit
    and when using post-hoc explanations to validate their accuracy (see, for example,
    regulatory requirements pertaining to the Equal Credit Opportunity Act and Regulation
    B,


    There are also auxiliary areas in risk management where models can be used that
    do not require approval from at least an internal validation and governance team
    nor adhere to consumer protection laws. These blind-spot areas can feed into assessments
    and decisions impacting consumers, and therefore, although these models need not
    necessarily be interpretable, any model, whether AI and machine learning-based
    or traditional, needs to be subject to a governance framework.


    ## WHY EXPLAIN AI MODELS


    Risk models are typically used for high-priority decisions subject to regulatory
    requirements. It is therefore important that a range of stakeholders, from risk
    managers to senior management to external regulators, can have confidence in the
    use of the models and their outputs. However, with AI and machine learning, it
    is often difficult to understand the model and its components.


    Often, the lack of explainability is further exacerbated by organizational silos
    and a lack of holistic visibility across the model lifecycle of AI and machine
    learning. Today, the lack of transparency inhibits a firm''s ability to appropriately
    manage their risk models and associated model risk, which has led to a degree
    of distrust of AI and machine learning.


    Some of the main challenges associated with the ability to explain risk models
    are:


    *   An inability to explain the algorithmic functions and quantitative methods
    and how the model output is produced.


    *   A lack of transparency in the model development process and assumptions.


    *   An inability to explain or prove that the data that was used to derive a model
    and subsequent decision is justifiable.


    *   A lack of confidence in how the model will behave on data outside of its calibration
    range.


    *   A lack of a holistic framework for AI and machine learning governance.


    *   An inability to assess for the degrees of overfitting, bias, fairness, and
    other unintended consequences.


    *   Lack of access to the model documentation that includes the details of the
    specification and assumptions leading to an inability to manage and maintain the
    models, and therefore manage its associated model risk appropriately.


    The overwhelming speed of development and dynamic calibration can lead to a resistance
    by internal and external stakeholders to accept and approve the model. Of course,
    the level of explainability that is needed will also be decided by the context
    in which the model will be used and the materiality of the models.


    As a starting point, it is important to determine what the model will be used
    for and who would be responsible and accountable. Then, define who the stakeholders
    are and what they need to know. Here are some questions that can be asked relevant
    to a diverse set of stakeholders:


    *   Do they need to know what will happen if the model gets it wrong?


    *   Do they need to know that the drivers are justifiable and aligned to the business
    aim?


    *   Do they need to know that the model is performing well and stable over time?


    *   Do they need to know how the model works?


    *   Do they need to know how the model fits into the business process?


    *   Do they need to know the process followed for feature engineering?


    *   Do they need to know which features are driving the predictions? Or which
    features mattered in individual predictions?


    *   Do they need to know the performance differences between the AI and machine
    learning model and a simpler benchmark model?


    *   Do they need to know that the model is parsimonious, that is, that it is as
    simple as possible, yet has a high degree of predictive power?


    This is a good starting point to explain the characteristics of the model in a
    well-rounded way to make the AI and machine learning as accessible as possible
    to a range of stakeholders.


    ## COMMON APPROACHES TO ADDRESS EXPLAINABILITY OF DATA USED FOR MODEL DEVELOPMENT


    As mentioned in [Chapter 2](#c02.xhtml), the right data governance framework is
    crucial for successful and responsible AI and machine learning. This section further
    emphasizes the importance of standardized and consistent data management processes
    to improve trust, transparency and governance of AI and machine learning.


    Data management refers to the process of accessing, acquiring, transforming, and
    preparing input data for analysis. To aid in the transparency of the model, processes
    that relate to the data collection, data preparation and quality validation, as
    well as feature engineering need to be transparent, reproducible (in some cases),
    robust, and well documented.


    The use of justifiable inputs for model development will help foster trust in
    AI and machine learning systems.


    Data-centric questions related to the data collection processes are:


    *   Are the data sources reliable, meaningful, and justifiable?


    *   Do I have standardized data quality, validation, and sampling processes in
    place?


    *   Is my model using training data that is free from bias and representative
    of the population that the model will be applied to (i.e., are minority groups
    over-/underrepresented)?


    Data-centric questions related to variable selection processes are:


    *   What is the methodology followed for variable selection and reduction?


    *   Do I have the methods/approaches to variable selection and reduction documented?


    *   What is the mix between automated processes and human judgment?


    Data-centric questions related to feature engineering are:


    *   Will the production systems support the feature engineering logic?


    *   Are the methods/approaches to feature engineering automated and supported
    by my model risk policy?


    *   Are the processes reproducible using either a down-the-middle sample or sample
    of recent production data?


    ## COMMON APPROACHES TO ADDRESS EXPLAINABILITY OF MODELS AND MODEL OUTPUT'
