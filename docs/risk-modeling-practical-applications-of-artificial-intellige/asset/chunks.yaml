    \n*   Number of bins\n\n |\n\nTuning hyperparameter values is a critical aspect\
    \ of the model training process. The approach to finding the ideal values for\
    \ hyperparameters (tuning a model to a particular dataset) has been a manual effort\
    \ and thus time consuming. For guidance in setting these values, risk modelers\
    \ often rely on their experience using machine learning. However, even with expertise\
    \ in machine learning and their hyperparameters, the best settings of these hyperparameters\
    \ will change significantly with different data; it is often difficult to prescribe\
    \ the hyperparameter values based on previous experience. The ability to explore\
    \ alternative configurations in a more guided and automated manner helps reduce\
    \ the need for manual effort. Below are common approaches used for automated hyperparameter\
    \ tuning:\n\n*   **Grid search.** Each hyperparameter of interest is discretized\
    \ into a desired set of values. Models are trained and assessed for all combinations\
    \ of the values across all values for the hyperparameters (as a grid). The values\
    \ of the hyperparameters are the levels of the grid. The combinations of potential\
    \ values of the hyperparameters that are searched across each “grid” depend on\
    \ the levels of the hyperparameters. For example, for each “grid” where all parameters\
    \ have the same number of levels, the search number of total combinations is calculated\
    \ using *n* (levels) raised to the power of *k* (parameters). The processing for\
    \ grid search quickly becomes prohibitively expensive. An example to illustrate\
    \ how expensive this grows is with GBM from [Table 8.1](#c08.xhtml#c08-tbl-0001).\n\
    \n    For the 9 hyperparameters and assuming the same number of levels (say 3),\
