    批量处理（图 6.2）是部署许多风险模型的常用方法。一段时间内收集的大量数据可以在方便时进行批处理。这种方法对于对时间不敏感的用例是一种非常高效的模型评分方式。通常，批量部署所需的基础设施比实时部署所需的简单。例如，为了对额度增加审批进行每月评分，该流程将从源系统提取数据，并应用数据转换、模型评分和其他后处理逻辑来计算模型输出（包括预授权的额度）。批量处理的主要优点之一是可以规划计算资源。它可以被用于定期处理，或调度在低峰期运行：


    * 为对时间不敏感的业务决策生成模型输出。

    * 在评分前，积累一段时间的数据输入。


    ## 实时部署模型


    在当今世界，社会已经习惯了瞬时响应的服务和系统。在这种情况下，模型输出具有时间敏感性，通常要求按需可用。


    金融机构在提供实时服务和风险决策方面的竞争日益激烈。在这种情况下，风险模型必须实时部署。例如，对于新贷款审批，根据输入数据立即生成客户的风险评估，以决定批准还是拒绝申请。


    另一个例子是欺诈检测与预防。金融机构通常拥有基于历史可疑交易开发的欺诈检测模型。这些系统根据客户和交易信息的组合对每笔新交易进行评分，以发现可疑活动。由于目标是阻止欺诈交易被处理，这些模型需要提供实时答案：


    * 用于业务决策的模型输出具有时间敏感性。

    * 模型输出在交易级生成。

    * 模型输出速率必须尽可能接近数据输入速率。


    现代基础设施正在演进，我们看到模型在批处理或实时应用中的部署上存在差异。


    在某些情况下（主要针对批量部署），模型逻辑可以部署在数据库内部执行，减少对数据移动的需求，并提高评分过程的速度和效率。


    金融机构还越来越多地采用云微服务架构，将模型作为分析服务部署在容器中。通过这种方式，模型以尽可能轻量的方式部署在云端。容器软件管理操作系统，并可以通过 `API`
    端点轻松访问。此选项同时支持批量和实时部署场景。


    接下来我们将解释风险模型的三个部署选项：数据库内部署、部署到轻量级容器、或直接部署在业务决策工作流中。


    ## 数据库管理系统中的模型部署


    随着数据的爆炸，大型数据集通常存储在数据库管理系统中。为了减少数据移动的需求，现代技术允许将数据准备、模型逻辑和决策逻辑部署在数据所在地，而不是将数据移动到计算环境进行处理。这样做的好处是减少了系统间传输数据的输入/输出、更好的性能以及分析处理所需的更小的内存占用。


    ## 模型部署到轻量级容器


    模型也可以部署为轻量级容器。在这种情况下以及通常情况下，容器通过 `API` ，允许从更广泛生态系统的任何地方访问。随着软件应用程序作为容器部署的日益普及，这种方法也被引入模型——这对于开源模型特别有效，因为在容器中运行可以更容易更容易管理模型的包和依赖项。


    将模型放入容器使其成为组织在云端运行高效分析负载的理想选择。容器模型允许组织根据业务需求灵活扩展运行模型的基础设施。模型容器部署可以适用于批量和实时范式，因为容器可以扩展以满足计算需求——例如，每月（批处理）或当更多用户从实时
    Web 应用请求模型输出时（实时）。


    此外，在云架构中，模型容器化可以极大简化模型与其他应用程序的集成。作为容器的模型与其他软件应用程序由相同的容器编排工具和 CI/CD 基础设施管理，本质上将其作为分析微服务进行管理。


    ## 业务决策工作流中的部署


    模型的输出可以预测概率或预测数值的形式存在。虽然这些结果具有参考价值，但通常需要与业务规则相结合，以交付特定的业务结果（图 6.4）。


    ![图 6.4 模型部署到决策策略。](img/c06f004.png)


    图 6.4 模型部署到决策策略。


    在欺诈检测的情况下，孤立的欺诈模型会产生交易欺诈的预测概率。然而，需要与后处理决策逻辑进行集成。例如可以将交易金额和欺诈概率结合以计算预期欺诈金额。预期欺诈金额有助于优先对标记的交易进行调查。


    通过与决策工作流和业务逻辑集成，才能从分析模型中提取真正的业务价值。具有自动化集成技术能力的组织将更高效地实现人工智能和机器学习的投资回报。


    ## 案例研究：全球性银行的企业级决策


    全球最大的银行之一选择为未来加强其数字化能力。他们希望为客户提供跨业务线的无缝体验：信贷风险、催收和欺诈检测。该平台支持他们的数字化转型目标，提供一致且具有情境的客户旅程。此外，在价值证明期间，它提高了信贷决策的速度（直通处理
    STP 率从 60% 提高到 75%），而此前其抵押贷款组合平均需要六个月部署的新模型现在可以在几周内完成。同样，为其消费贷款组合部署新机器学习模型的时间从几周缩短到了几天。


    ## 实际考虑因素


    ### 以终为始


    在回顾第 3 章所示和图 6.5 中展示的风险模型生命周期时，每一步都会影响模型的部署。例如，流程的第一步是模型开发项目的启动。首先，逻辑上应该是：模型将在哪里部署？模型输出将如何被消费？用户多久以及何时需要模型输出？


    其次，模型的数据准备和转换将形成评分逻辑的一部分。逻辑上应该是：需要哪些数据源来准备数据并对模型评分？


