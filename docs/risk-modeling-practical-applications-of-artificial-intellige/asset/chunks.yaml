- raw: "The challenges with developing, deploying, and managing AI are better addressed\
    \ by automating manual data-quality tasks to assure good quality data for AI.\n\
    \nLeveraging cognitive data-quality methods is one way to achieve a level of automation\
    \ in data validation processes. Cognitive data quality autogenerate the data quality\
    \ and cleansing routines, thus reducing the need for manual effort. This code\
    \ can be executed as part of robust and repeatable data preparation control plans.\
    \ The methods can scan the data, either structured or unstructured, and suggest\
    \ possible data-quality transformations.\n\n## OTHER DATA CONSIDERATIONS FOR AI,\
    \ MACHINE LEARNING, AND DEEP LEARNING\n\n### Utilizing “Alternative Data”\n\n\
    Alternative data is said to be any data gathered from nontraditional data sources—for\
    \ example, online or geolocation data, sensor data, social media, satellite images,\
    \ or network data. Increasingly, data used to develop risk models is becoming\
    \ a blend of traditional and alternative types especially in applications utilizing\
    \ AI and machine learning.\n\nTypically, traditional data sources are structured\
    \ and stored in relational databases. In some instances, AI systems employ alternative\
    \ data that includes unstructured data in the form of real-time transactional\
    \ data, news feeds, web browsing, geospatial data and so on.\n\nA common data\
    \ challenge with AI approaches when utilizing larger data volumes is that the\
    \ time history is not sufficiently long for back-testing purposes (e.g., data\
    \ capture may have started recently).\n\nThe two data types used to build risk\
    \ models, traditional and alternative, are summarized in [Table 2.1](#c02.xhtml#c02-tbl-0001).\
    \ Before we progress to the next parts of this chapter, we wanted to take time\
    \ to expand on the common steps for “alternative data” before it becomes useful\
    \ for analytically driven insights and models. Commonly, unstructured “alternative\
    \ data” must be structured into a more useful tabulated form, so that can it can\
    \ be combined with existing data used for risk management purposes, like risk\
    \ modeling. The process also standardizes the data and reduces its dimensionality.\
    \ For the inclusion of personal data, the firm will need to implement an information\
    \ management standard to help govern its use. Such a framework is based on customer\
    \ or consumer consent, ethical considerations, and regulations, as well as the\
    \ internal guiding principles of the institution. Furthermore, organizations should\
    \ also comply with the principles of BCBS239 to “alternative data”, as done for\
    \ the more traditional data.\n\n[**Table 2.1**](#c02.xhtml#R_c02-tbl-0001) Data\
    \ Types Used to Generate Risk Models\n\n| Type of Data || Definition || Traditional\
    \ || Alternative |\n\n| --- | --- | --- | --- |\n\n| Transactional || \n\n*  \
    \ Structured and detailed information that captures key characteristics of customer\
    \ transactions (i.e., installment payments and cash transfers)\n\n*   Stored in\
    \ massive online transaction processing (OLTP) relational databases\n\n || \n\n\
    *   Aggregated, structured, and typically summarized over longer-term horizons\
    \ by aggregating into averages etc.\n\n || \n\n*   Granular, allowing for open\
    \ banking aggregation\n\n |\n\n| --- | --- | --- | --- |\n\n| Internal data ||\
    \ \n\n*   Customer, product, and transactional history\n\n || \n\n*   Stored in\
    \ enterprise databases\n\n || \n\n*   Call center data\n\n*   Digital journeys\n\
    \n*   App usage\n\n |\n\n| External data || \n\n*   Data available from third-party\
    \ data providers and public information\n\n || \n\n*   For example, positive and\
    \ negative credit data from a small group of bureaus\n\n*   Macroeconomic information\
    \ from bureau of statistics\n\n || \n\n*   Multiple sources of third-party data\
    \ (e.g., bureau data, open-banking aggregation, payment data from utilities, purchasing\
    \ data from online platforms, subscription information, browsing history, weather,\
    \ and location data)\n\n*   Public information\n\n*   Social media data (care\
    \ is needed if using especially concerning customer consent)\n\n |\n\n| Unstructured\
