- raw: 'The bank used the opportunity to modernize its technology to also improve
    its processes. It analyzed each step in its model-building process and identified
    bottlenecks and their causes. This allowed the bank to improve, for example, model
    dataset creation from months to days. This delivered an important lesson—simply
    buying new technology without addressing existing infrastructure, human, or process
    issues does not yield great results.


    The Machine Learning Factory dramatically reduced model development and deployment
    time from more than 12 months to less than one day. Target markets were able to
    be segmented at a more granular level, producing better models with more accurate
    prediction outcomes. A faster, more efficient model lifecycle allowed for more
    models to be developed and deployed, increasing the number of models under management
    fivefold. It was achieved by improved model pipeline designs that enabled some
    machine learning algorithms to update dynamically, with continuous development
    of challenger models that were used to contest the production champion models.
    When the challenger was deemed to be better performing, it was deployed into production
    automatically.


    This resulted in better quality of loans and millions of dollars in credit losses
    avoided. New loans could also be issued with more ease, which enabled expansion
    of the bank''s portfolio across many markets.


    ### Tier 1 Financial Institution in Asia Pacific


    Many financial institutions in Asia Pacific are actively using machine learning
    in nonregulatory settings. One interesting application is the detection of complex
    transactions that indicate instances of fraud. In some cases, banks are relying
    on financial technology companies that specialize in AI to build these models.
    But with easier access to platforms and no-code/low-code interfaces for AI and
    machine learning, increasingly organizations are developing these themselves.


    The occurrence of credit application fraud represents a very small fraction of
    the population, less than 1%. However, the losses are typically severe. A major
    concern at a Tier 1 commercial bank in Asia Pacific was that although the number
    of fraud cases was small, the vast majority bypassed the bank''s existing fraud
    rules. This was a complex problem. The best efforts of the bank, including manual
    interventions and contacting applicants, meant that some incidents still slipped
    through the credit- and fraud-checking processes.


    To detect the fraudulent behavior, the bank built predictive models based on actual
    historical data of the approved applications using a gradient boosting machine
    (GBM). This technique used thousands of decision trees and hundreds of variables
    as a basis of generating weak prediction models that get ensembled to a final
    prediction via a score.


    Although the GBM models were great at detecting suspicious behavior, the obstacle
    the bank faced was that the current infrastructure was not robust enough to support
    the deployment and implementation of advanced machine learning models like GBMs.
    In the end, the sophistication of the GBM needed to be completely stripped back
    to a linear model, which meant that the predictive capability was reduced. This
    story illustrates the potential power of machine learning in improving predictions—but
    it also reminds us that infrastructure capability needs to be addressed before
    deploying resources, in the form of funds and time, toward a machine learning
    project.


    ### Process Automation for Claims Processing


    Several organizations have started to use AI and machine learning to develop AI-based
    behavioral models that can be used to support other applications to improve customer
    experience. One such model was developed using over a decade of insurance data
    to find hidden pathways that exist between the question sets asked and the most
    profitable 20–40 customer segments. Based on the insights of the model, over 30
    questions previously used to ascertain medical history were reduced to 7 key questions
    needed to confirm or deny coverage. What this predictive underwriting capability
    of the model supplies is faster, easier, and more accurate insurance outcomes
    that greatly improve the customer experience.


    Other AI and machine learning models have been developed to identify the key reason
    for excluding customers for medical insurance, such as those with a particular
    type of disability, and whether the excluded population has a higher propensity
    to make claims at a later point in time. Again, this has contributed to a more
    efficient underwriting process by reducing time, cost, and paperwork needed to
    make insurance decisions.


    The one condition for all models developed for this project was that it needed
    to be transparent, meaning that all the inputs and output decisions can be easily
    explained. The avoidance of “black box” models in favor of those that can be explained
    easily is a common requirement in financial institutions. As such, explainable
    AI is a key consideration with any development project and is discussed in greater
    detail in [Chapter 4](#c04.xhtml).


    ### Navigating through the Storm of COVID-19


    Like many financial institutions across the globe, a Tier 1 commercial bank in
    the Asia Pacific region provided repayment holidays to eligible small business
    customers during the COVID pandemic. Since the customers'' risk of default could
    not be measured using current systems and processes, payments appeared up-to-date
    due to the referred repayment period, putting the bank at risk. If income were
    lost during the repayment holiday period, the current behavioral models would
    not accurately reflect these events, as these models were not designed to predict
    short-term and immediate events, like a sudden loss of income due to widespread
    business shutdowns. What this meant is that the current definition of “delinquency”
    were not a reliable differentiator of risk for small business customers who received
    deferral arrangements under emergency procedures enacted during COVID-19.


    Suddenly, the bank needed to assess how this would affect customer payments, and
    to do this they turned to machine learning. The bank used data immediately before
    the COVID-19 pandemic, using 3 months of historical data rather than the 12 months
    performance window used by the legacy behavioral models. The smaller historical
    period of 3-months meant that shorter-term variables that are highly impacted
    by COVID19 needed to be derived, rather than using the long-term drivers of the
    current models. For the short-term variables, the modelers derived these using
    advanced feature engineering techniques from customer transactions data, to ensure
    that recent changes in cash flows could be detected and modeled by the algorithm.
    Importantly, the transaction data–based feature engineering used income and expense
    variables highly affected by COVID19. Other variables used in the model included
    point-in-time ratios, early delinquency at customer group level, and drivers related
    to velocity of change such as utilization, disposable income, and business-specific
    risk drivers and self-employment flags. The bank observed that a GBM with a small
    depth and <100 trees were able to better predict which customers were likely to
    suffer sudden loss of income events and likely to experience default post-expiry
    of the COVID-19 holiday repayment scheme.


    ### Approximation of Complex Risk Calculations


    Like other sophisticated risk calculations, expected credit loss calculations
    are typically run as a batch, back-end process. Forward-looking, marginal losses
    are calculated for a range of scenarios, discounted back to the net present value,
    and weighted according to the probability of the scenario. If the probability
    of default has significantly increased since origination, the loan is recognized
    as stage 2 and lifetime losses are recognized. If not, a 12-month loss is recognized
    as provision for expected credit loss.'
