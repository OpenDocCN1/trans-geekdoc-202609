- raw: "More specifically, polluting facilities that process and distribute fossil\
    \ fuels increase the levels of greenhouse gases in the atmosphere, leading to\
    \ a warming effect. The main culprits are CO[2] and other pollutants such as methane,\
    \ but also include nitrous oxide and fluorinated gases.\n\nResearch indicates\
    \ that human activities contribute to the association between greenhouse gas emissions\
    \ and the average rise in the planet's temperature observed in the last century.\n\
    \nHowever, climate change is more than global warming: it is defined as *“a significant\
    \ variation of average weather conditions”*: becoming warmer, wetter, or drier—over\
    \ decades or more.\n\nIn this case, the longer-term trend differentiates climate\
    \ change from natural weather variability.\n\nOther impacts of human activity\
    \ on the climate range from:\n\n*   Ambient temperature oscillations between hot\
    \ and cold: \n\n    *   The most recent example is the extreme heat and long-term\
    \ dry conditions that contributed to the unprecedented bushfires in Australia\
    \ in 2019–2020. Bushfires burned through 46 million hectares (72,000 square miles).\n\
    \n    *   Ice formation and heavy snowstorms.\n\n*   Landfill releasing methane\
    \ and nitrous oxide as it breaks down.\n\n*   Increased precipitation from frequent\
    \ and more intense rainfalls, leading to chemical-based weathering (carbonic acid\
    \ that creates erosion along coastal regions and watercourses).\n\n*   Floods\
    \ and high-water flow due to the expansion of human settlements and construction\
    \ of infrastructure.\n\n*   Deforestation and the removal of carbon sinks via\
    \ logging or clearcutting.\n\nWe need to appreciate that human civilization flourishes\
    \ in a stable climate and that the planet is potentially accelerating toward instability\
    \ based on the increased frequency and severity of extreme weather events. The\
    \ socioeconomic impacts and hazards associated with extreme weather events are\
    \ dramatic in terms of loss of human life, exemplified by the 2010 Russian heatwave\
    \ that killed 55,000 people. Monetary losses of Hurricane Harvey equated to $125\
    \ billion (about $380 per person in the United States lost in 2017). As mentioned,\
    \ climate change has worsened the hazards of extreme weather events; for instance,\
    \ the Russian heatwave was estimated to be three times more likely due to global\
    \ climate change.\n\nA global group of 11,000 scientists have endorsed 40 years\
    \ of research on a range of measures that supports the hypothesis that the world\
    \ is now facing a climate emergency; the research suggests that the following\
    \ scenarios are plausible:\n\n*   Twenty years from now, heavily populated parts\
    \ of South Asia will more regularly face life-threatening heatwaves greater or\
    \ equal to 34°C.\n\n*   The Sahara Desert will cross the Mediterranean Sea by\
    \ 2030. This will mean that the heavily populated coast of Africa will be squeezed\
    \ between the desert and the rising sea levels, impacting millions of people.\n\
    \n*   Flammability of the Amazon will increase significantly based on a change\
    \ in the fire season from 2021 to 2050 (using 1971–2000 as baseline for comparison).\n\
    \n*   The coasts of China, Japan, and Korea will experience an increased frequency\
    \ of what would have been rare rain events in the past, such as typhoons. Later\
    \ in the century, systemic floods will present serious issues.\n\n### United Nations\
    \ and Climate Change\n\nSince 1992, the United Nations has been recognizing that\
    \ changes to global climate patterns, and those at regional levels, pose serious\
    \ issues to the world.\n\nScientific evidence on climate change and its impending\
    \ impacts over the past 28 years has directed the accords. The Paris Agreement\
    \ is no exception.\n\n[**Table 9.1**](#c09.xhtml#R_c09-tbl-0001) History of United\
    \ Nations Climate Accords\n\n| Year || United Nations talk and associated accords\
    \ |\n\n| --- | --- |\n\n| 1992 || UN Framework Convention on Climate Change (UNFCCC)\
    \ |\n\n| --- | --- |\n\n| 1995 || Berlin Mandate |\n\n| 1997 || Kyoto Protocol\
    \ |\n\n| 2001 || Negotiations on the Kyoto Protocol that focused on emissions\
    \ trading and how to account for carbon sinks in Bonn, Germany |\n\n| 2005 ||\
    \ Kyoto Protocol takes effect excluding the United States |\n\n| 2007 || Negotiations\
    \ begin on Kyoto Protocol 2.0 |\n\n| 2009 || Copenhagen Accord |\n\n| 2010 ||\
    \ Cancun Agreements |\n\n| 2011 || Draft of a new legally binding agreement to\
    \ take place in 2015. Extension of Kyoto 2.0 to 2017 |\n\n| 2013 || Warsaw International\
    \ Mechanism for loss and damage with climate change impacts. Agreement also on\
    \ initiative to end deforestation known as REDD+. |\n\n| 2015 || Paris Agreement\
    \ |\n\n| 2018 || Rules for Paris Agreement decided |\n\n| 2019 || UN Climate Action\
    \ Summit for countries to submit nationally determined contribution plans as per\
    \ the Paris Agreement |\n\n| 2020 || Talks postponed due to the Covid19 pandemic.\
    \ Emissions fall worldwide due to the pandemic, but reductions are not set to\
    \ last. |\n\n| 2021 || COP 26 Summit in Glasgow |\n\nIn 2015, the Paris Agreement\
    \ set a target for the net increase in global temperatures, to be limited to between\
    \ 1.5 and 2 degrees Celsius. In general, there are two ways for participating\
    \ countries to reach their agreed emissions targets. The first is to reduce emissions\
    \ gradually over time, and the second, and more drastic approach, is to eliminate\
    \ emissions by shutting down polluting facilities. The latter can be achieved\
    \ by replacing fossil fuel production with renewable alternatives. Before we look\
    \ at these options, let us look at the scientific reasons behind why emissions\
    \ targets should be met.\n\n### Limitations of the Paris Accord Target\n\nEven\
    \ a temperature increase of less than 2 degrees Celsius will affect lives and\
    \ livelihood: it will likely lead to flooding caused by an increase in frequency\
    \ of extreme rainfall, an increase in sea levels, and an increased extent of wildfires.\
    \ In addition, to meet the Paris targets, participating countries will need to\
    \ make and sustain changes in industry sectors and energy usage to reduce emissions\
    \ by at least 6% annually until 2030.\n\nSome research studies on climate change\
    \ are suggesting that the Paris targets are not reasonably achievable, and that\
    \ a 3 to 4 degrees Celsius warming is a more likely outcome.\n\nIn its Fifth Assessment\
    \ Report, the Intergovernmental Panel on Climate Change (IPCC) identified a set\
    \ of representative concentration pathways (RCPs) that depict the greenhouse gas\
    \ concentration (not emissions) trajectories under a range of warming scenarios.\n\
    \n## INTERCONNECTED: CLIMATE AND FINANCIAL STABILITY\n\nFollowing the Paris Agreement\
    \ and COP26, there is broad awareness that transitioning to a low carbon economy\
    \ poses significant risks, new challenges, but also investment opportunities for\
    \ financial services. Several leading industry bodies provided well-defined guidance\
    \ with global applicability such as:\n\n*   The Task Force on Climate-Related\
    \ Disclosures (TCFD), formed by the Financial Stability Board to help companies\
    \ understand what type of insights financial markets need on climate disclosures.\
    \ At the time of writing, while TCFD disclosures are mandatory in the United Kingdom\
    \ and New Zealand, over 3,000 organizations have joined and many are voluntarily\
    \ reporting their climate-related disclosures.\n\n*   The Network for Greening\
    \ the Financial System (NGFS), started by a group of Central Banks and supervisors\
    \ in 2017, supporting the transition toward a sustainable economy creating and\
    \ improving climate-related scenarios since 2020. The NGFS has, among other things,\
    \ issued guidance on what is expected from central banks for disclosure and governance.\
    \ The NGFS highlighted that the environment, the financial services industry,\
    \ and customers are interconnected by a complex layer of interactions between\
    \ the macroeconomic financial and climate systems.\n\n*   The United Nations (UN)\
    \ Environment Programme Finance Initiative developed a set of principles for the\
    \ financial services industry, outlining responsibilities for climate change and\
    \ climate-related risks."
