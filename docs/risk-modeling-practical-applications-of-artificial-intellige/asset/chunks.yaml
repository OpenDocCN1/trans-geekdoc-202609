    通过自动化手动数据质量任务来确保为 AI 提供高质量数据，可以更好地解决 AI 开发、部署和管理方面面临的挑战。


    利用认知数据质量方法是实现数据验证过程自动化的一种方法。认知数据质量可以自动生成数据质量检查和清洗程序，从而减少对人工投入的需求。这些代码可以作为稳健且重复的数据准备控制计划的一部分执行。这些方法可以扫描结构化或非结构化的数据，并建议可能的数据质量转换方案。


    # AI、机器学习和深度学习的其他数据考虑因素


    ## 利用“替代数据”


    所谓的替代数据是指从非传统数据源收集的任何数据——例如在线数据或地理位置数据、传感器数据、社交媒体、卫星图像或网络数据。用于开发风险模型的数据越来越多地成为传统类型和替代类型的混合体，特别是在利用
    AI 和机器学习的应用中。


    通常，传统数据源是结构化的，并存储在关系型数据库中。在某些情况下，AI 系统会采用替代数据，包括以实时交易数据、新闻推送、网页浏览、地理空间数据等形式存在的非结构化数据。


    在使用 AI 方法处理更大数据量时，一个常见的数据挑战是时间历史长度不足以满足回回测试的需求（例如，数据采集可能最近才开始）。


    用于构建风险模型的两种数据类型（传统和替代数据）在表 2.1 生成风险模型使用的数据类型


    | 数据类型 | 定义 | 传统 | 替代 |

    | --- | --- | --- | --- |

    | 交易数据 | | <br>* 结构化且详细的信息，捕捉客户交易的关键特征（如分期付款和现金转账）<br><br>* 存储在大规模在线交易处理 (OLTP)
    关系数据库中 | <br><br>* 聚合的、结构化的，通常通过聚合为平均值等方式在较长的跨度内进行总结 | <br><br>* 粒度化，允许开放银行聚合
    |

    | --- | --- | --- | --- |

    | 内部数据 | <br>* 客户、产品和交易历史 | <br><br>* 存储在企业数据库中 | <br><br>* 叫中心数据<br>* 数字轨迹<br>*
    App 使用情况 |

    | 外部数据 | <br>* 可从第三方数据提供者和公共信息获取 | <br><br>* 例如，来自少数信用局的正面和负面信用数据<br><br>* 来自统计局的宏观经济信息
    | <br><br>* 多源第三方数据（例如：征信数据、开放银行聚合、公用事业支付数据、在线平台购买数据、订阅信息、浏览历史、天气和位置数据）<br><br>*
    公共信息<br>* 社交媒体数据（在使用涉及客户同意的数据时需谨慎） |

    | --- | --- | --- | --- |

    | 非结构化数据 | <br>* 未存储在预定义结构化格式的数据 | <br><br>* 传统上需要人工进行分析 | <br><br>* 文字文档（例如：电子邮件、网页、理赔表）<br><br>*
    多媒体内容<br><br>* 网络信息（即：所有结构、供应商、流动性、对手之间的法律依赖） |


    ## 为 AI 和机器学习将风险数据扩展到“替代数据”


    风险模型开发的数据准备及其管理于识别相关数据源。在某些情况下，这些来源需要证明合理性，这意味着必须证明使用数据的理由是合适的，以确保不会产生偏差或不公平的结果（图
    2.2）。


    重要的是，当风险模型人员选择数据源时，需要考虑关键的组织流程和政策。无论 AI 或机器学习是替代了传统风险模型，还是增强了传统风险模型，任何此类考虑都继续适用。这些考虑取决于模型的类型。无论模型是传统的还是创新的风险模型，确保所选数据源对于模型的预期用途是合适且合理的总是好的。在这种情况下，预期用途指的是模型的目标、目的以及模型将应用的环境。例如，在风险部门，通常会使用多种类型的模型。下面列出并解释了选定的某些风险模型类型，以及风险模型人员利用替代数据源的示例。例如，来自手机和公用事业的替代数据有助于许多国家没有银行服务或银行服务不足的人群。这对消费者和微型企业者获得信贷产生了重大影响，并进一步帮助历史上处于劣势地位的国家确保更公平的信贷获取：![图
    2.2 一个典型的关系风险管理数据模型。¶ 数据类别支持常规 (BAU) 风险模型，但通过替代和第三方数据源扩展到 AI/ML 模型。](img/c02f002.png)


    Figure 2.2 一个典型的关系风险管理数据模型。¶ 数据类别支持常规 (BAU) 风险模型，但通过替代和第三方数据源扩展到 AI/ML 模型。


    *   **决策模型，例如申请和行为评分卡。** 对于决策模型，风险模型人员可以使用交易数据作为替代数据的来源，用以预测收入损失等短期和即时事件。通过用替代源丰富现有数据，可以获得更细致的信贷风险视图，不仅使用银行数据，还使用电信数据（如订阅数据）。有关这些示例的更多信息，请参阅第
    3 章。

    *   **针对违约概率 (PD)、违约损失 (LGD) 和违约风险额 (EAD) 的信用风险参数估计。** 风险参数广泛用于监管资本、准备金、压力测试和其他内部计算。风险模型人员正在利用房产智能平台和地图应用的数据来开发位置评分。风险模型人员使用这些评分来改进消费贷款组合和中小企业
    (`SMEs`) 贷款的违约概率 (`PD`) 和违约损失 (`LGD`) 模型。


