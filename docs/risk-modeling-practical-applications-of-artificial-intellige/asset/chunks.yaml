    \ step, a “mini-batch” random sample of observations is used to estimate loss.\
    \ The sampling occurs without replacement until all observations have been used.\
    \ The performance of stochastic gradient descent, as with all optimization algorithms,\
    \ depends on control parameters for which no default values are applicable to\
    \ all problems. Stochastic gradient descent parameters include control parameters\
    \ such as: \n\n    *   A learning rate that controls the step size for selecting\
    \ new weights\n\n    *   An adaptive decay rate and an annealing rate to adjust\
    \ the learning rate for each weight and time\n\n    *   A momentum parameter to\
    \ avoid slow oscillations\n\n    *   A size for sampling a subset of observations\n\
    \n## MACHINE LEARNING MODELS AS OPTIMIZATION TOOLS\n\nWe have discussed mathematical\
    \ optimization and how that is used in algorithms. However, and as explained at\
    \ the beginning of the chapter, optimization refers to an act, process, or method\
    \ that is employed to make “something” as fully functional or effective as possible\
    \ based on a current problem. That “something” can be far reaching in risk management—from\
    \ a system, decision, a technical design, and of course the machine learning algorithms.\
    \ What follows are examples of the business applications in risk management that\
    \ require optimization to maximize effectiveness.\n\n### Decision Science Optimization\
    \ Tool to Reduce Credit Decisioning Policy Rules\n\nAlthough the policy rules\
    \ that are applied to consumer loan applications represent a latent loss function\
    \ of the individual credit risk profile, they also reflect the risk appetite of\
    \ an organization. This means that the policy rules expand and contract to tighten\
    \ or loosen credit policy over time. They are also needed to either contribute\
    \ or act as reason code generators to approve or decline loans. However, policy\
    \ rules are often applied subjectively, which often slows down decision response\
    \ time.\n\nFurthermore, although policy rules are critical for lending decisions,\
    \ there are five overlooked aspects of policy rules that create opportunities\
    \ for optimization:\n\n1.  **Univariate.** Policy rules are typically applied\
    \ as univariate rules (IF, AND, OR, WHERE), and require continuous updates for\
    \ regulatory and other compliance reasons.\n\n2.  **Repetitive.** To keep up with\
    \ regulations and compliance, often the rules increase in number due to the creation\
    \ of new rules. This creates a doubling-up effect across policy categories and\
    \ leads to unnecessary complexity.\n\n3.  **Slow decisions.** A plethora of policy\
    \ rules result in slow decision response times and a lack of clarity on which\
    \ individual policies or combinations of policies contribute to a decision.\n\n\
    4.  **Rationalization.** Risk teams may optimize the number of rules by simply\
    \ ascertaining the frequency of records captured by them (considering the hit\
    \ rate). Rules with a low hit rate, on average over a specified time, may be removed\
    \ manually.\n\n5.  **Regulatory pressure.** Increased demand due to laws governing\
    \ conduct aspects, and other regulatory mandates means that any effort to reduce\
    \ policy rules using hit rates are ineffective.\n\nA decision science optimization\
    \ tool that uses approximation (or function approximate) machine learning to simulate\
    \ what the final decision will be could:\n\n*   Enhance optimization of policy\
    \ rules\n\n*   Replace rules or combinations of rules\n\n*   Anticipate rules\
    \ required to make the final decisions\n\n*   Better the customer experience by\
    \ reducing decision time\n\nThe decision science optimization tool carefully considers\
    \ the lending process flow of a retail loan application. Policy rules are often\
    \ implemented into a decision engine, but some banks run credit models (i.e.,\
    \ scorecards) against applications first and then policy rules to ensure that\
    \ credit declines are not overridden by policy rules.\n\nIrrespective of the sequence\
    \ of running a policy rule or credit model on the loan application, decisions\
    \ made are often a blend of models and policy rules, and these can be adjusted\
    \ by manual assessors. Manual assessors can override automated decisions. In some\
    \ cases, the override process prolongs the time to decision and can result in\
    \ non-take-up of approved applications. Excessive amounts of policy overrides\
    \ are often associated with too many policy rules and complexity.\n\nThe design\
    \ principles shown in [Figure 8.3](#c08.xhtml#c08-fig-0003) are explained below:\n\
    \n*   Typically, an initial scorecard assesses the credit risk of the application.\
    \ \n\n    ![Figure 8.3 The design principles of a decision science optimization\
    \ tool to reduce policy rules. Importantly, the tool should allow for both forces\
    \ of the decisioning to be assessed—these being both the scorecard and policy\
    \ rules.](images/c08f003.png)\n\n    [**Figure 8.3**](#c08.xhtml#R_c08-fig-0003)\
    \ The design principles of a decision science optimization tool to reduce policy\
    \ rules. Importantly, the tool should allow for both forces of the decisioning\
    \ to be assessed—these being both the scorecard and policy rules.\n\n*   For policy\
    \ rule optimization, a two-step process is performed: \n\n    *   First, identify\
    \ the variables that correlate with the last decision.\n\n    *   Then, use these\
    \ to determine how well the categories of policy rules can be approximated.\n\n\
    *   Policy rule categories with low approximation can either be removed or, if\
    \ still required, the sub-segments can be modeled using machine learning.\n\n\
    Importantly, the decision science optimization tool could allow for both aspects\
    \ of the originations decision process, namely the credit models and policy rules,\
    \ to be analyzed at the same time. The last decision is typically difficult to\
    \ model because decisions on loan applications are driven by models, policy rules,\
    \ and manual assessment interventions, and thus are both objective and subjective\
    \ in nature.\n\nThe tool provides machine learning insights, but importantly,\
    \ these insights can be used to shorten decision time by utilizing final approvals\
    \ or rejections early in the lending process. Furthermore, the strength of the\
    \ machine learning can be used to optimize revenue by determining customer segments\
    \ that are high net worth, have ability to repay, and should not undergo unnecessarily\
    \ long decisioning times.\n\n### Collateral Optimization\n\nCollateral refers\
    \ to assets, other guarantees, or securities that a counterparty agrees to transfer\
    \ to the seller that are equal or exceed the receivables and liabilities provided\
    \ by the seller. Collateral acts to mitigate the risk to the seller of the counterparty\
    \ not completing its agreement if, for example, the counterparty defaults.\n\n\
    *   **Assets** refer to anything of value that can be converted to cash in the\
    \ future. Examples include cash and cash equivalents, bonds, equity, money market\
    \ instruments, real estate, and cryptocurrencies.\n\n*   **Counterparties** are\
    \ individuals or legal entities, like a business, commercial bank, or government\
    \ body.\n\nManaging collateral requires multiple decisions that involve complexity,\
    \ because the management depends on whether the bank is acting as the seller or\
    \ counterparty (as is the case in the capital markets). At a general level, these\
    \ decisions include the following:\n\n*   The type of security.\n\n*   Value to\
    \ assign to the underlying asset of the collateral.\n\n*   Opportunity costs of\
    \ the collateral—these relate to the underlying asset administration costs, and\
    \ the counterparty risk."
  fmt: "\n* Conjugate-gradient\n* Double dogleg\n* Dual quasi-Newton\n* Nelder-Mead\
    \ simplex\n* Newton-Raphson\n* Newton-Raphson with ridging\n* Trust-region\n\n\
    ## Neural Networks\n\n* **Stochastic gradient descent.** The optimization problem\
    \ of this algorithm is to solve for the weights. This algorithm is a variation\
    \ of gradient descent in which, instead of calculating the gradient of the loss\
    \ over all observations to update the weights at each step, a “mini-batch” random\
    \ sample of observations is used to estimate loss. The sampling occurs without\
    \ replacement until all observations have been used. The performance of stochastic\
    \ gradient descent, as with all optimization algorithms, depends on control parameters\
    \ for which no default values are applicable to all problems. Stochastic gradient\
    \ descent parameters include control parameters such as:\n    * A learning rate\
    \ that controls the step size for selecting new weights\n    * An adaptive decay\
    \ rate and an annealing rate to adjust the learning rate for each weight and time\n\
    \    * A momentum parameter to avoid slow oscillations\n    * A size for sampling\
    \ a subset of observations\n\n# MACHINE LEARNING MODELS AS OPTIMIZATION TOOLS\n\
    \nWe have discussed mathematical optimization and how that is used in algorithms.\
    \ However, and as explained at the beginning of the chapter, optimization refers\
    \ to an act, process, or method that is employed to make “something” as fully\
    \ functional or effective as possible based on a current problem. That “something”\
    \ can be far reaching in risk management—from a system, decision, a technical\
    \ design, and of course the machine learning algorithms. What follows are examples\
    \ of the business applications in risk management that require optimization to\
    \ maximize effectiveness.\n\n## Decision Science Optimization Tool to Reduce Credit\
    \ Decisioning Policy Rules\n\nAlthough the policy rules that are applied to consumer\
    \ loan applications represent a latent loss function of the individual credit\
    \ risk profile, they also reflect the risk appetite of an organization. This means\
    \ that the policy rules expand and contract to tighten or loosen credit policy\
    \ over time. They are also needed to either contribute or act as reason code generators\
    \ to approve or decline loans. However, policy rules are often applied subjectively,\
    \ which often slows down decision response time.\n\nFurthermore, although policy\
    \ rules are critical for lending decisions, there are five overlooked aspects\
    \ of policy rules that create opportunities for optimization:\n\n1. **Univariate.**\
    \ Policy rules are typically applied as univariate rules (`IF`, `AND`, `OR`, `WHERE`),\
    \ and require continuous updates for regulatory and other compliance reasons.\n\
    2. **Repetitive.** To keep up with regulations and compliance, often the rules\
    \ increase in number due to the creation of new rules. This creates a doubling-up\
    \ effect across policy categories and leads to unnecessary complexity.\n3. **Slow\
    \ decisions.** A plethora of policy rules result in slow decision response times\
    \ and a lack of clarity on which individual policies or combinations of policies\
    \ contribute to a decision.\n4. **Rationalization.** Risk teams may optimize the\
    \ number of rules by simply ascertaining the frequency of records captured by\
    \ them (considering the hit rate). Rules with a low hit rate, on average over\
    \ a specified time, may be removed manually.\n5. **Regulatory pressure.** Increased\
    \ demand due to laws governing conduct aspects, and other regulatory mandates\
    \ means that any effort to reduce policy rules using hit rates are ineffective.\n\
    \nA decision science optimization tool that uses approximation (or function approximate)\
    \ machine learning to simulate what the final decision will be could:\n* Enhance\
    \ optimization of policy rules\n* Replace rules or combinations of rules\n* Anticipate\
    \ rules required to make the final decisions\n* Better the customer experience\
    \ by reducing decision time\n\nThe decision science optimization tool carefully\
    \ considers the lending process flow of a retail loan application. Policy rules\
    \ are often implemented into a decision engine, but some banks run credit models\
    \ (i.e., scorecards) against applications first and then policy rules to ensure\
    \ that credit declines are not overridden by policy rules.\n\nIrrespective of\
    \ the sequence of running a policy rule or credit model on the loan application,\
    \ decisions made are often a blend of models and policy rules, and these can be\
    \ adjusted by manual assessors. Manual assessors can override automated decisions.\
    \ In some cases, the override process prolongs the time to decision and can result\
    \ in non-take-up of approved applications. Excessive amounts of policy overrides\
    \ are often associated with too many policy rules and complexity.\n\nThe design\
    \ principles shown in [Figure 8.3](#c08.xhtml#c08-fig-0003) are explained below:\n\
    \n* Typically, an initial scorecard assesses the credit risk of the application.\n\
    \    ![Figure 8.3 The design principles of a decision science optimization tool\
    \ to reduce policy rules. Importantly, the tool should allow for both forces of\
    \ the decisioning to be assessed—these being both the scorecard and policy rules.](images/c08f003.png)\n\
    \    [Figure 8.3](#c08.xhtml#R_c08-fig-0003) The design principles of a decision\
    \ science optimization tool to reduce policy rules. Importantly, the tool should\
    \ allow for both forces of the decisioning to be assessed—these being both the\
    \ scorecard and policy rules.\n\n* For policy rule optimization, a two-step process\
    \ is performed:\n    * First, identify the variables that correlate with the last\
    \ decision.\n    * Then, use these to determine how well the categories of policy\
    \ rules can be approximated.\n* Policy rule categories with low approximation\
    \ can either be removed or, if still required, the sub-segments can be modeled\
    \ using machine learning.\n\nImportantly, the decision science optimization tool\
    \ could allow for both aspects of the originations decision process, namely the\
    \ credit models and policy rules, to be analyzed at the same time. The last decision\
    \ is typically difficult to model because decisions on loan applications are driven\
    \ by models, policy rules, and manual assessment interventions, and thus are both\
    \ objective and subjective in nature.\n\nThe tool provides machine learning insights,\
    \ but importantly, these insights can be used to shorten decision time by utilizing\
    \ final approvals or rejections early in the lending process. Furthermore, the\
    \ strength of the machine learning can be used to optimize revenue by determining\
    \ customer segments that are high worth, have ability to repay, and should not\
    \ undergo unnecessarily long decisioning times.\n\n## Collateral Optimization\n\
    \nCollateral refers to assets, other guarantees, or securities that a counterparty\
    \ agrees to transfer to the seller that are equal or exceed the receivables and\
    \ liabilities provided by the seller. Collateral acts to mitigate the risk to\
    \ the seller of the counterparty not completing its agreement if, for example,\
    \ the counterparty defaults.\n\n* Assets refer to anything of value that can be\
    \ converted to cash in the future. Examples include cash and cash equivalents,\
    \ bonds, equity, money market instruments, real estate, and cryptocurrencies.\n\
    * Counterparties are individuals or legal entities, like a business, commercial\
    \ bank, or government body.\n\nManaging collateral requires multiple decisions\
    \ that involve complexity, because the management depends on whether the bank\
    \ is acting as the seller or counterparty (as is the case in the capital markets).\
    \ At a general level, these decisions include the following:\n* The type of security.\n\
    * Value to assign to the underlying asset of the collateral.\n* Opportunity costs\
    \ of the collateral—these relate to the underlying asset administration costs,\
    \ and the counterparty risk.\n"
  trans: "\n\n* 共轭梯度法\n* 双狗腿法\n* 拟对拟拟牛顿法\n* Nelder-Mead 单纯形法\n* 牛顿-拉夫逊法\n* 带岭回归的牛顿-拉夫逊法\n\
    * 置信区域\n\n## 神经网络\n\n* **随机梯度下降。** 该算法的优化问题是求解权重。该算法是梯度下降的一种变体，在每一步中，它不是计算所有观测值的损失梯度来更新权重，而是使用“小批量”（mini-batch）随机观测值来估计损失。采样是不重复抽样的，直到所有观测值都被使用。随机梯度下降的性能与所有优化算法一样，取决于控制参数，而没有默认值适用于所有问题。随机梯度下降的参数包括控制参数，例如：\n\
    \    * 控制选择新权重步长的学习率\n    * 用于自适应衰减率和退火率，以调整每个权重和每个时间的学习率\n    * 用于避免缓慢震荡的动量参数\n\
    \    * 用于采样观测子集的大小\n\n# 作为优化工具的机器学习模型\n\n我们已经讨论了数学优化以及它在算法中的应用。然而，正如章节开头所解释的那样，优化是指一种行为、过程或方法，用于根据当前问题使“某物”尽可能充分发挥功能或高效。这种“某物”在风险管理中的影响深远——从系统、决策、技术设计，当然还有机器学习算法。以下是风险管理中业务应用的示例，这些应用需要优化以实现效率最大化。\n\
    \n## 用于减少贷款决策策略规则的决策科学优化工具\n\n尽管应用于贷款申请的策略规则代表了个人信用风险特征的潜在损失函数，但它们也反映了组织的风险偏好。这意味着策略规则会随着时间的推移而扩大或缩小，以收紧或放信用政策。它们还需要用于贡献或作为理由代码生成器来批准或拒绝贷款。然而，策略规则的应用往往是主观的，通常会减慢决策响应时间。\n\
    \n此外，尽管策略规则对于贷款决策至关重要，但策略规则有五个被忽视的方面存在优化机会：\n\n1. **单变量。** 策略规则通常作为单变量规则（`IF`、`AND`、`OR`、`WHERE`）应用，并且由于监管和其他合规原因需要持续更新。\n\
    2. **重复性。** 为了跟上法规和合规要求，由于新规则的产生，规则数量通常会增加。这导致策略类别之间产生叠加效应，并导致了不必要的复杂性。\n3. **决策缓慢。**\
    \ 大量的策略规则导致决策响应时间变长，并且对于哪些个人策略或策略组合促成了决策缺乏清晰度。\n4. **合理化。** 风险团队可以通过简单确定它们捕获记录的频率（考虑命中率）来优化规则数量。在指定时间范围内平均命中率的规则可能会被手动删除。\n\
    5. **监管压力。** 由于管理行为方面的法律和其他监管指令导致需求增加，意味着任何试图使用命中率减少策略规则的努力都是无效的。\n\n一个使用近似（或函数近似）机（机器学习）来模拟最终决策结果的决策科学优化工具可以：\n\
    * 增强策略规则的优化\n* 替换规则或规则组合\n* 预测做出最终决策所需的规则\n* 通过缩短决策时间来改善客户体验\n\n决策科学优化工具仔细考虑了零售贷款申请的贷款流程。策略规则通常被实现在决策引擎中，但某些银行会先对申请运行信用模型（即评分卡），然后运行策略规则，以确保信用拒绝不会被策略规则覆盖。\n\
    \n无论在贷款申请上运行策略规则或信用模型的顺序如何，做出的决策通常是模型和策略规则的混合，这些可以由人工评估人员进行调整。人工评估人员可以覆盖自动化决策。在某些情况下，覆盖过程会延长决策时间，并导致已批准的申请未被。过度的策略覆盖通常与过多的规则和复杂性有关。\n\
    \n图 8.3 所示的设计原理说明如下：\n\n* 通常，初始评分卡会评估申请的信用风险。\n    ![图 8.3 减少策略规则的决策科学优化工具的设计原理。重要的是，该工具应该允许对决策的两种力量进行评估——即评分卡和策略规则。](img/c08f003.png)\n\
    \    图 8.3 减少策略规则的决策科学优化工具的设计原理。重要的是，该工具应该允许对决策的两种力量进行评估——即评分卡和策略规则。\n\n* 对于策略规则优化，执行两步流程：\n\
    \    * 第一，识别与最后决策相关的变量。\n    * 然后，使用这些变量来确定策略规则类别的近似程度。\n* 近似程度较低的策略规则类别可以被删除，或者如果仍需要，则可以使用机器学习对子段进行建模。\n\
    \n重要的是，决策科学优化工具可以同时分析贷款决策过程的两个方面，即信用模型和策略规则。最后的决策通常很难建模，因为贷款申请决策是由模型、策略规则和人工评估干预驱动的，因此具有客观性和主观性。\n\
    \n该工具提供了机器学习洞察，但重要的是，这些洞察可以利用贷款过程早期的最终批准或拒绝来缩短决策时间。此外，机器学习的优势可以通过确定高价值、有还款能力且应避免过长时间决策的客户群体来优化收益。\n\
    \n## 抵押品优化\n\n抵押是指对方同意转移的资产、其他担保或证券，这些资产等于或超过卖方提供的应收款和债务。抵押的作用是降低卖方面临对方未履行协议（例如对方违约）的风险。\n\
    \n* 资产是指未来可以转换为现金的任何价值物品。例如现金及现金等价物、债券、股票、货币市场工具、房地产和加密货币。\n* 交易对手是指个人或法律实体，如公司、商业银行或政府机构。\n\
    \n管理抵押品需要涉及复杂的多种决策，因为管理取决于银行是作为卖方还是对方（如资本市场中所示）。在一般水平，这些决策包括：\n* 证券类型。\n* 为抵押品基础资产分配的价值。\n\
    * 抵押品的机会成本——这些涉及基础资产的管理成本和交易对手风险。\n\n"
