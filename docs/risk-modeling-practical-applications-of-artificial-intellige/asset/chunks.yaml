- raw: '*   Independent audit of AI, machine learning, and autonomous systems.


    ## MONITORING AI AND MACHINE LEARNING


    Machine learning need governance just like other models, only more so. In part,
    this is because these models are designed to improve automatically through experience.
    Their ability to “learn” enables greater accuracy and predictability, but it can
    also greatly increase their model risk and result in biases based on patterns
    in data that they are able to identify. It is critical that organizations establish
    rigorous governance processes that can quickly identify when a model begins to
    fail, complete with defined operating controls on inputs (data) and output (model
    results). The dynamic nature of AI and machine learning means that it requires
    more frequent performance monitoring, constant data review, and benchmarking.
    With the increased volume of models, a better understanding of the contextual
    model inventory and actionable contingency plans is needed.


    Even when organizations have extended their model governance to AI and machine
    learning, there are further considerations about the ongoing monitoring of AI
    and machine learning that should be considered beyond those currently enacted
    and discussed in previous sections.


    We have explained in this chapter that, traditionally, organizations have in place
    standard model governance frameworks that include regular monitoring reporting
    and reviews for regulatory and nonregulatory risk models. All risk models are
    typically subject to internal and external validation, which requires regular
    tracking of models by performance and operational computed metrics.


    As new regulatory requirements necessitate the need to adjust the models and the
    number of risk models over time, the sophistication of modeling methods is increasing
    and will continue to do so with the mainstream adoption of AI and machine learning.
    AI and machine learning are often dynamically updated (i.e., calibrated with new
    data with more ease), which means that a slew of metrics will need tracking over
    time to ensure that the model is performing within the boundaries as expected
    by business goals and compliance measures.


    These are best explained when taking a holistic view of the “health” of an algorithm
    across the dimensions listed below and shown in [Figure 7.3](#c07.xhtml#c07-fig-0003):


    *   Input data and data quality.


    *   Features and variable importance.


    *   Model assumptions and limitations—made during model development, including
    the data limitations used to engineer features.


    *   Benchmarks applied and how these were derived.


    *   Stability at the level of the population and characteristics (or engineered
    features).


    *   Performance of the model over time, comparing performance to benchmark.


    *   Decisions made such as purely model-derived decisions or in combination with
    rule sets or other post-modeling processes.


    Complementary to holistic model health, there are ways in which organizations
    can validate that the model is performing in line with expectations. These metrics
    can be automated and run at regular time intervals: annually, quarterly, monthly,
    weekly, daily, intraday, or near-real-time. A selection of metrics are included
    and described in more detail below: model decay, stability, robustness, interpretability,
    bias, and model adjustments.


    ![Figure 7.3 Further considerations of AI and machine learning that should be
    taken when taking a more holistic view of model health, including measures that
    can identify models that require immediate attention before drop in their performance
    can be measured.](images/c07f003.png)


    [**Figure 7.3**](#c07.xhtml#R_c07-fig-0003) Further considerations of AI and machine
    learning that should be taken when taking a more holistic view of model health,
    including measures that can identify models that require immediate attention before
    drop in their performance can be measured.


    ### Model Decay


    The established industry practices for model validation typically include the
    monitoring of the performance of the model, the stability of model inputs, and
    model calibration. These metrics are all still valid for AI and machine learning.
    In addition, for AI and machine learning, especially models that continuously
    update, it is necessary to continuously monitor the models'' explainability and
    potential for bias. Importantly, the performance monitoring results should be
    summarized in a way that provides understanding to users of where the root causes
    of issues reside, so the performance results can be reviewed in context.


    For example, as mentioned, given their complexity, AI and machine learning tend
    to pick up relationships in the data that may be temporary. To account for temporal
    fluctuations, the models must be monitored more frequently.


    Model degradation is typically a consequence of data or concept drift:


    *   *Data drift* occurs when the distributions of feature attributes change over
    time when compared to the model development sample. This requires monitoring of
    the sample data vs. production data—the complexity increases when a model is updated
    more frequently.


    *   *Concept drift* occurs when a change in market conditions or policy changes
    the model interpretation. In the case of a model interpretation change, typically,
    the development data needs to be relabeled and model retrained. Concept drift
    can be measured by evaluating the historical relationships between features that
    are driving the model''s predictions.


    ### Stability


    The stability of an AI or machine learning and benchmark model is typically performed
    by assessing the stability of the data inputs, the population, and the features.


    #### *Population Drift*


    The Population Stability Index (PSI) is one way to measure that the model outcomes
    are stable over time. It is an established metric for traditional statistical
    or econometric models. It''s a divergence metric that measures the distance between
    two distributions (e.g., the current population and the model development sample).
    It is often interpreted as a rule of thumb but can also be interpreted using confidence
    intervals, which may be more appropriate for continuous monitoring for machine
    learning models.


    ### Feature Drift


    The population stability index can also be used to calculate divergence at the
    characteristic level, namely the characteristic stability index (CSI). This measures
    how the distributions of the model characteristic differ from the development
    sample.


    Another approach to assess the feature stability of AI or machine learning is
    by bootstrapping or random perturbation. This can be done either by sub-sampling
    or by randomly perturbing the development data so as to create *n* datasets. The
    algorithm for selecting features is applied to *n* datasets, and *m* features
    are created. The stability of the features is measured by determining the similarity
    of the features selected across the *n* datasets.


    It can also be calculated using the *t*\-distributed stochastic neighbor embedding
    (T-SNE).


    #### *Robustness, Benchmarking, and Backtesting*


    The robustness of a model, whether machine learning–based or not, refers to the
    model''s ability to generalize well on new data. Model robustness can be improved
    by generalization and stopping and pruning methods. Overfitting can also be evaluated
    by cross-validation. These tests include benchmarking, backtesting, and stability
    assessments.


    Traditionally, benchmarking is where the results of the model are compared to
    a benchmark. By example, the benchmark sample could stem from the initial periods''
    implementation data. Backtesting is performed when the model logic is applied
    to historical data to evaluate how stable the predicted values are against the
    actual values.'
