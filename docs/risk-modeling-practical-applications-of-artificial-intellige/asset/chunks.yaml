- raw: "*   European Commission—laying down harmonized rules on AI.\n\n*   EU guidelines\
    \ for trustworthy AI.\n\n### GDPR (Global Data Protection Regulation)\n\nThis\
    \ European law regulates data protection and privacy laws in the European Union\
    \ and European Economic Area. Released by GDPR in 2019 was the “Ethics Guidelines\
    \ for Trustworthy AI.” For AI to comply with the GDPR provisions, additional factors\
    \ need to be carefully considered (see [Table 7.1](#c07.xhtml#c07-tbl-0001) for\
    \ a summary of key questions).\n\n### ECOA (Equal Credit Opportunity Act)\n\n\
    The United States Federal Trade Commission (FTC) administers a wide variety of\
    \ consumer protection laws, including those that prevent unfair methods of competition\
    \ in commerce and prohibit unfair and deceptive acts or practices. The FTC also\
    \ has a long history of using its authority to regulate private sector uses of\
    \ personal information and algorithms that directly affect consumers. One of the\
    \ ways that the FTC exercises such authority is by the Equal Credit Opportunity\
    \ Act (ECOA). The ECOA helps to protect consumers in gaining equal access to credit\
    \ by protecting them from discrimination based on protected variables such as\
    \ race, color, sex, religion, age, and marital status.\n\n[**Table 7.1**](#c07.xhtml#R_c07-tbl-0001)\
    \ Key Questions When Complying with GDPR Guidelines and AI\n\n| Guideline || Explanation\
    \ brief |\n\n| --- | --- |\n\n| Right to not be subject to automated decision-making\
    \ || The right to not be subject to automated decision-making is prohibited only\
    \ if the decision-making is based solely on automated processing and produces\
    \ legal effects concerning the data subject or similarly significantly affects\
    \ them. However, it is allowed if the process is done with the data subject's\
    \ explicit consent, or the controller has put sufficient safeguards in place.\
    \  \n\nIn this scenario, the safeguards that need to be provided include: involvement\
    \ of human intervention to analyze and address the system's purpose, constraints,\
    \ requirements, and decisions in a clear and transparent manner, explaining the\
    \ automated decision-making clearly in the privacy policy to notify clients before\
    \ processing their data, and obtaining explicit consent to notify a data subject\
    \ that a decision is the result of an algorithm decision and they are interacting\
    \ with an AI agent like chatbot or robot or other conversational system. |\n\n\
    | --- | --- |\n\n| Transparent processing || Data subjects should be informed\
    \ of the existence and purpose of the processing, especially when the data-processing\
    \ activities involve automated decision-making. Meaningful information about the\
    \ logic, significance, and envisaged consequences of such processing should be\
    \ explicitly transparent to users. |\n\n| Right to erasure || As a result of data\
    \ sharing and data openness needed to collect and collate large amounts of data\
    \ for AI to be of use, it is hard for data controllers to ensure that a third-party\
    \ data server implements the deleting operation or if the data required to be\
    \ erased are deleted completely from other joint controllers or data processors.\
    \ |\n\n| Data minimization || De-identification (pseudonymization) allows more\
    \ data to be used, processed, and analyzed in AI. Pseudonymization meets the GDPR\
    \ principle of data minimization, unlike anonymization, which means that the data\
    \ subject is no longer or not identifiable. The GDPR promotes pseudonymization\
    \ as an appropriate safeguard for organizations to repurpose data without additional\
    \ consent. |\n\nIn 2020 and 2021, the FTC notes that if a company uses an algorithm\
    \ that either directly or indirectly through disparate impact discriminates against\
    \ a protected class with respect to credit decisions, then the FTC can challenge\
    \ the practice under the ECOA. In addition, the updated guidelines in 2020 and\
    \ 2021 supply insights into expectations for organizations using AI. Examples\
    \ include:\n\n*   **Start from the beginning.** Organizations need to find whether\
    \ training datasets include disparate treatment of protected groups.\n\n*   **Testing.**\
    \ Test algorithms before use and on a regular basis to make sure that they do\
    \ not discriminate on the basis of above-mentioned protected variables.\n\n  \
    \  The fairness of algorithms can be assessed by considering these questions:\n\
    \n    *   How representative is the dataset?\n\n    *   Does the data model account\
    \ for biases?\n\n    *   How exact are the predictions based on big data?\n\n\
    \    *   Does the reliance on big data raise ethical or fairness concerns?\n\n\
    \    *   Does the algorithm do more harm than good? Organizations should ask themselves\
    \ if their AI and machine learning cause more harm than good. If they do, then\
    \ the FTC can consider them “unfair” under section 5 of the FTC Acts and subject\
    \ to enforcement measures.\n\n### SR-Letter 11-7\n\nThe Board of Governors of\
    \ the Federal Reserve System and Office of the Comptroller of the Currency published\
    \ the SR Letter 11-7 in 2011 titled: “Supervisory Guidance on Model Risk Management.”\
    \ The letter has become the gold standard for model risk management and one of\
    \ the most important statements of a supervisor's expectations on management of\
    \ model risk. Supervised banks and financial institutions in the United States\
    \ are obligated to have implemented SR 11-7 principles into their model risk management\
    \ frameworks.\n\nOutside of the United States, a number of other supervisors have\
    \ released regulatory expectations for model risk management, such as the European\
    \ Central Bank (ECB), European Banking Authority (EBA), and national supervisors\
    \ like the Canadian Office of the Superintendent of Financial Institutions (OSFI)\
    \ and the Australian Prudential Authority (APRA, under Prudential Standard CPS\
    \ 220 Risk Management and the Credit Risk Management Prudential Standard APS 220).\
    \ In particular, the ECB incorporated SR 11-7 principles into its Targeted Review\
    \ of Internal Models (TRIM) in 2015.\n\nSR 11-7 is far reaching and outlines all\
    \ the regulatory expectations on risk management, including defining what a model\
    \ is, and the processes and internal controls that banks must implement for all\
    \ “models,” irrespective of type. This helps to ensure that banks appropriately\
    \ develop, implement, and use models in a controlled manner. The principles of\
    \ SR 11-7 are critical, because all models, including AI and machine learning,\
    \ risk sustaining losses due to inaccuracy or poor controls. The losses here can\
    \ be far ranging, from inaccurate risk calculations, to costs involved with developing\
    \ and implementing models, to the adverse reputational impacts of making unfair\
    \ decisions.\n\nWithout a defined model risk management policy in place, the flexibility\
    \ introduced by a range of model development applications can expose organizations\
    \ to significant misuse and loss. In such a setting, there can also be an absence\
    \ of appropriate controls and approvals, subsequent errors. Effective model risk\
    \ management helps supply robustness and reduce the mentioned model risks.\n\n\
    ### EU Guidelines for Trustworthy AI\n\nIn 2021, the European Commission has legislated\
    \ the use of AI systems in Europe.\n\n## FURTHER TAKEAWAY\n\nBased on the risks,\
    \ the wider use of AI and machine learning means that current model risk governance\
    \ programs in place need to extend. But, at the same time, it is important to\
    \ understand the limitations of current model risk management programs that prevent\
    \ a holistic view to model health across data, model inputs, benchmarks, stability,\
    \ performance, and decisions.\n\nIt is important to note that any high-materiality\
    \ model, irrespective of whether an AI and machine learning is used, either directly\
    \ or indirectly, always requires a high level of human oversight. Regulatory bodies\
    \ around the world are either extending their current regulation and compliance\
    \ for model risk management to accommodate AI and machine learning or have created\
    \ voluntary guidelines for a range of aspects of AI and machine learning, including\
    \ data privacy usage and ethics."
