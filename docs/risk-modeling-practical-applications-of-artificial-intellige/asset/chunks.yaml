    The uptake of these technologies for process automation and in digital customer
    journeys is growing exponentially in many industries, yet we are observing a more
    conservative and slower uptake in financial risk management. In an era where so
    much information is available on the use of AI and machine learning, financial
    organizations are cautious about its pertinence in regulated areas that expect
    compliance and transparency in decision-making.


    At the same time, the digital revolution is occurring against a backdrop of an
    increasingly uncertain world. Volatility is at an all-time high. The risk management
    function is contending with new types of risks every day. Organizations around
    the world are dealing with myriad risks such as a haphazard recovery from the
    COVID-19 pandemic, rising inflation, cumulating geopolitical risks, and the impacts
    of climate change.


    With this book, we want to highlight the strengths and weaknesses of AI and machine
    learning and explain how both can be effectively applied to everyday risk management
    problems, as well as efficiently evaluating the impacts of shocks under uncertainty,
    such as global pandemics and changes in the climate. Throughout the text, we aim
    to clarify misconceptions about the use of AI and machine learning using clear
    explanations, while offering practical advice for implementing the technologies
    into an organization’s risk management framework.


    With the right controls, AI and machine learning can deliver tangible benefits
    and become useful tools in the toolkit of the risk function. It can improve the
    accuracy and speed of risk assessments compared to human-led or other traditional
    methods of decision-making, and at the same time introduce new ways of work in
    risk management through increased automation. The rewards for innovation are not
    without risks of their own, and these technologies are largely underregulated
    today (although, that will change in the future). In this book, we also highlight
    the barriers that organizations face in using AI and machine learning and provide
    ways to overcome them.


    The book is structured to introduce AI and machine learning in the context of
    financial risk modeling, including the onboarding and preparation of diverse datasets.
    Throughout the book, we provide real-world risk management applications. The book
    contains dedicated material on model implementation, explainability, and addressing
    bias and fairness. It also provides details on extending model governance frameworks
    to AI and machine learning, the use of optimization in machine learning, and how
    AI and machine learning can help risk managers better assess and address new types
    of risks like climate change.


    With the transformational advances in AI and machine learning, together with the
    radical speed of new development, as an industry, we are only scratching the surface
    in its practical application in financial risk management. With this book we aim
    to enable organizations to continue putting in place the right frameworks and
    infrastructure to enable modern technologies, and more importantly, build proficiency
    and capacity in AI and machine learning.


    # CHAPTER 1: Introduction


    *“By far, the greatest danger of Artificial Intelligence is that people conclude
    too early that they understand it.”*


    —Eliezer Yudkowsky


    No doubt, we, as a society, are entering into new advances in technology at ground-breaking
    speed. The rapid growth in digital data and advances in computing power open endless
    possibilities for transformation in every sphere of life. At the same time, these
    developments are also driving unparalleled change in human behavior, consumer
    demand, and expectations. It is believed that we are now entering the next wave
    of revolution: the fifth industrial revolution or the age of artificial intelligence
    (AI). In this age, it is said that machines are truly capable of varying degrees
    of self-determination, reason, and “thought,” working with humans in unison. As
    a technology, AI is pervasive in every industry, including financial services.
    It is also starting to mature as a useful tool.


    However, `AI` is a broad term and defined by various industry bodies. The `Oxford
    Dictionary` defines it as “the theory and development of computer systems able
    to perform tasks normally requiring human intelligence, such as visual perception,
    speech recognition, decision-making, and translation.” As a scientific discipline,
    `AI` includes several subdisciplines, such as machine learning (of which deep
    learning and reinforcement learning are examples), machine reasoning (which includes
    knowledge representation, deduction), and robotics (which includes sensors).


    Despite the enormous transformational benefits that true `AI` systems can bring
    to humanity, what is it about AI that sends shivers down our spines? Arguably,
    the shivers are caused by the fact that for the first time in human history, we
    are engaging with the `intelligence` component of technology. And another reason
    is Hollywood! It is quite amazing that one of the most memorable moments in cinema
    is from Stanley Kubrick''s 1968 production `2001: A Space Odyssey`. There are
    scenes from other movies and science fiction novels that depict AI as ultimately
    rising and taking control of society. In many ways, AI-enabled systems are already
    integrated into our personal lives. Take, for example, virtual assistants like
    `Google Assistant`, `Apple''s Siri`, and `Amazon''s Alexa` that use the traditionally
    derived `LISP` for voice recognition.


    By continuing to augment, and at times automate, manual jobs or daily tasks, AI-enabled
    applications continue to transform our personal and professional lives. AI is
    making what was once science-fiction into science-fact. This will continue to
    be the case when considering the consolidated impact of four major factors:


    - **Moore''s law**: Computing power is said to double every two years and will
    continue to do so for the foreseeable future.

    - **Data**: The creation and replication of data have doubled each year. It is
    estimated that 1.7 megabytes of new information are created every second for every
    human being on the planet, meaning that from 2010 to 2020, there was a 5000% growth
    in data—from 1.2 trillion gigabytes in 2010 to 59 trillion gigabytes in 2020.
    The exponential growth in data is largely driven by digitalization, and is expected
    to continue.

    - **Funding**: AI funding has doubled every two years, largely driven by the availability
    of required computational power.

    - **Test of time**: There is 50 years of established AI and quantitative research
    that is underpinning better algorithms.


    ## RISK MODELING: Definition AND BRIEF HISTORY


    In recent years, the number of risk models employed by financial institutions
    increased dramatically, by 10–25% annually.


    Henceforth, in this book, the term `model` refers to a financial risk model unless
    otherwise stated. Interestingly, most of the modern-day risk and probability theory
    evolved from innovation in science, economics, and technology in the last 200
    to 300 years.

    '
  trans: '


    这些技术在流程自动化和数字化客户旅程中的应用在许多行业中呈指数级增长，但我们观察到在金融风险管理领域的应用更为保守且缓慢。在一个关于人工智能和机器学习应用信息无处不在的时代，金融机构对于其在要求决策合规和透明的受监管区域的适用性持谨慎态度。


    与此同时，数字革命正发生在一个日益不确定的世界背景下。波动性处于历史高位。风险管理职能每天都在应对新类型的风险。全球各机构正在应对各种风险，例如新冠疫情后杂乱无章的恢复、通货膨胀上升、不断累积的地缘政治风险以及气候变化的影响。


    通过这本书，我们希望强调人工智能和机器学习的优缺点，并解释如何将两者有效应用于日常风险管理问题，以及如何高效地评估不确定性冲击（如全球大流行病和气候变化）的影响。在全文中，我们旨在通过清晰的解释消除对人工智能和机器学习使用的误解，同时为将这些技术纳入组织的风险管理框架提供实用的建议。


    通过适当的控制，人工智能和机器学习可以带来切实的利益，并成为风险职能工具箱中实用的工具。与人类主导或其他传统的决策方法相比，它们可以提高风险评估的准确性和速度，同时通过增加自动化为风险管理引入新的工作方式。创新的回报并非没有其自身的风险，而且这些技术在今天很大程度上仍缺乏监管（尽管这在未来将发生变化）。在书中，我们还强调了组织在使用人工智能和机器学习时面临的障碍，并提供了克服这些障碍的方法。


    本书的结构旨在于金融风险建模的背景下介绍人工智能和机器学习，包括各种数据集的入入和准备。在整书中，我们提供了真实的风险管理应用案例。书中包含了关于模型实施、可解释性以及处理偏差与公平性的专门材料。它还详细介绍了如何将模型治理框架扩展到人工智能和机器学习、机器学习中优化的使用，以及人工智能和机器学习如何帮助风险管理人员更好地评估和应对气候变化等新类型的风险。


    随着人工智能和机器学习的变革性进展，加上新领域开发的激进速度，作为一个行业，我们在金融风险管理中的实际应用仅是触皮一角。通过这本书，我们旨在使组织能够继续建立正确的框架和基础设施以支持现代技术，更重要的是，在人工智能和机器学习方面建立专业知识和能力。


    # 第一章：引言


    *“到目前为止，人工智能最大的危险在于人们过早地得出他们理解了它的结论。”*


    —Eliezer Yudkowsky


    毫无疑问，我们作为一个社会，正以以前所未有的速度进入技术的新进展阶段。数字数据的快速增长和计算能力的提高为生活的每个领域转型提供了无限可能。同时，这些发展也驱动着人类行为、消费需求和预期的前所未比的变化。人们认为，我们现在正在进入下一波革命浪潮：第五次工业革命或人工智能（AI）时代。据说，在这个时代，机器确实能够进行不同程度的自我决决、推理和“思考”，并与人类协同工作。作为一种技术，人工智能渗透到每一个行业，包括金融服务。它也开始作为一种实用的工具走向成熟。


    然而，`AI` 是一个广泛的术语，由不同的行业机构定义。《牛津词典》将其定义为“能够执行通常需要人类智能的任务（如视觉感知、语音识别、决策制定和翻译）的计算机系统的理论和发展。”作为一门科学学科，`AI`
    包含了几个子学科，例如机器学习（深度学习和强化学习是其例子）、机器推理（包括知识表示、演绎）和机器人学（包括传感器）。


    尽管真正的 `AI` 系统能给人类带来巨大的变革性收益，但人工智能的什么特质让我们脊背发凉？可以说，这种寒意源于在人类历史上第一次，我们正在与技术的`智能`部分进行交道。另一个原因是好莱坞！令人惊讶的是，电影史上最难忘的时刻之一来自斯坦利·库布里克
    1968 年的作品《2001：太空漫游》。其他电影和科幻小说中也有场景描绘了人工智能最终崛起并控制社会。在许多方面，赋能人工智能的系统已经整合到我们的个人生活中。例如，像
    `Google Assistant`、苹果的 `Siri` 和亚马逊的 `Alexa` 等虚拟助手，它们使用源自传统的 `LISP` 进行语音识别。


    通过继续增强并在有时自动化手动工作或日常任务，赋能人工智能的应用继续改变着我们的个人和职业生活。人工智能正在让曾经的科幻变成科学事实。在考虑以下四个主要因素的综合影响时，这种情况将持续：


    - **摩尔定律**：据说计算能力每两年翻一倍，且在可预见的未来将持续如此。

    - **数据**：数据的创建和复制每年翻一倍。估计地球上每位人类每秒产生 1.7 兆字节的新信息，这意味着从 2010 年到 2020 年，数据增长了 5000%——从
    2010 年的 1.2 万亿 GB 增长到 2020 年的 59 万亿 GB。数据的指数级主要受数字化驱动，预计并将持续。

    - **资金**：人工智能资金每两年翻一倍，主要受所需计算能力的可用性驱动。

    - **时间的检验**：有 50 年成熟的人工智能和定量研究支持着更好的算法。


    ## 风险建模：定义与简史


    近年来，金融机构使用的风险模型数量剧增，每年增长 10%-25%。


    因此，在书中，除非另有说明，`模型`是指金融风险模型。有趣的是，大多数现代风险和概率理论都是源于过去 200 到 300 年科学、经济和技术的创新。


    '
