    # 第三章：用于风险管理的人工智能、机器学习和深度学习模型


    尽管过去几年炒作不断不断，但人工智能（AI）和机器学习已证明它们是风险管理中有用的工具。如前所述，主要原因是海量数字数据的可用性、更强大的计算能力，以及通过现有的建模工具更易地访问复杂的分析。近期，由于
    COVID-19 疫情的影响，数字化渠道的采用和生成数据的增加都有所加速。而此时，金融机构正面临着数无数的内部和外部需求：


    *   监管需求——遵守新一轮的审慎监管和财务报告标准

    *   宏观经济需求——持续的低利率和低效率对盈利能力造成了压力并增加了成本，部分原因源于合规成本的膨胀

    *   技术进步——高级分析、大数据、开放银行、基于云的和高性能计算

    *   新兴风险——网络攻击、COVID-19 疫情引发的风险、气候变化以及地缘政治不确定性

    *   数字化转型——新客户需求对传统银行模式的挑战，以及更新、更敏捷的金融科技公司的崛起


    虽然人工智能和机器学习的使用本身也面临挑战，但它是组织提高应对这些需求敏捷性的有效方法之一。人工智能和机器学习在风险管理中的一些优势包括：能够更好地、更实时地响应市场状况的变化，从自动化中获得效率效益，同时能够理解数字化产生的海量数据。


    压力测试。这些是前瞻性的分析，用于评估不利情景如何影响金融机构资产负债表的韧性。这通常通过对宏观经济变量（如 GDP 国内生产总值、失业率和房价指数）施压力来完成。金融机构可以将其个人投资组合和粒度风险因素，使用内部定义的场景对其风险参数进行压力测试。分析可以从新闻文章和社交媒体中提取见解，以评估对地缘政治不确定性等新兴风险的情绪。对于气候风险评估，基于场景的分析利用如金融系统绿色网络（NGFS）提供的气候场景。


    ## 合成数据生成


    随着人工智能和机器学习的使用以及额外计算能力的可用，合成数据的使用日益增加。通常，用于训练人工智能和机器学习的可用数据存在局限性，例如时间序列中的空白、历史数据不足或粒度水平不够。模拟数据可以帮助克服这些缺陷。通常采用的方法从偏偏调整（例如用于拒绝推理的模糊方法）、重复采样（自助法）和合成少数类过采样（SMOTE），到生成市场状态的受限玻尔兹曼机。


    某些人工智能和机器学习方法从本质上生成其自己的数据（生成对抗网络、变分自动编码器）。这些方法可以帮助对模型压力测试，从而作为模型验证的一部分提高模型的稳健性。虽然这些方法适用于高维数据，但需要注意的是，通过算法方法或近似来模拟数据，可能会引入额外的模型风险。


    ## 典型数据预处理，包括特征工程


    如前，人工智能和机器学习越来越多地被用于风险管理以增强传统的风险模型，因为它实现了长期以来需要的风险转型，以自动化琐碎任务并处理大量数据。


    为人工智能和机器学习获取正确的数据通常涉及标准任务。其中几个已经得到了涵盖，例如数据质量、认知数据质量以及将风险数据扩展到“替代数据”。风险模型生命周期也经常涉及特征工程和降维。


    特征工程有助于从输入数据自动构建一系列特征。通过使用更简单的特征，人工智能和机器学习变得更容易解释，并且可能随着时间的推移而更容易维护。良好的特征还减少了优化机器学习参数所需的精力。特征工程同样重要，因为随着输入数量的增加，高维数据在数据点往往表现出稀疏性。这意味着随着特征的增加，特征空间会增大。


    某些机器学习算法对离值更为敏感，这意味着输出模型会向离值群体倾斜。离值在集中很难识别，且需要时间来解释。即使是训练良好的分析专家也需要时间探索数据以寻找离值，然后决定如何处理它们。它们是真实的还是由于真正的错误？由于数据中的系统错误，用于开发人工智能和机器学习的数据中可能存在离值群体，例如在发生更新时、数据文件在不同系统之间传输时，或者由于对内部政策、操作流程和程序的误读导致的数据录入错误。


    探索离值群体之间存在的关系也是重要的，因为这些关联关系有助于解释数据集内部以及数据集之间的离值。


    存在一些稳健的分析技术，有助于识别离值。其中一种方法包括使用主成分分析（PCA）。另一种无监督技术是使用 T-SNE 数据可视化。可以进一步研究聚类或“离值”，以确定它们是可能被单独建模的真实子群体，还是由于数据集中的错误导致的离值。


    ## 结语


    为了实现有效的数据管理，组织依赖于有效的数据集设计及其现行的风险和控制自评估框架。这些包括跟踪用于风险衡量和管理的数据的准确性、完整性和完整。特征是，尽管并非总是如此，人工智能方法倾向于利用更大数量的数据，因此数据质量和数据处理变得更加突出。以目录、血缘追踪以及透明数据和模型管道形式的技术赋能者增强了数据过程的控制和可审计性。


    为了充分利用人工智能和机器学习，可以使用自动化和可重复的过程更轻松地解决当前有效数据管理的障碍。


    ## 尾注


    1. 1. Naeem Siddiqi, *When Lending Inequities Fuel Housing Disparities* (Chicago:
    BAI, 2021).

    2. 2. Samuel Cohen, Derek Snow, and Lukasz Szpruch, *Black-Box Model Risk in Finance*
    (Mathematical Institute, University of Oxford, and The Alan Turing Institute,
    School of Mathematics, University of Edinburgh, February 9, 2021).


