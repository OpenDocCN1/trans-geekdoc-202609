    \n[Figure 9.2](#c09.xhtml#R_c09-fig-0201) A proposed framework to create a climate\
    \ risk ecosystem.\n\nTo better address the limitations, organizations will need\
    \ to focus on the following areas to achieve robustness in their climate risk\
    \ management efforts:\n\n* **Ensure data quality**:\n    * Establish a robust\
