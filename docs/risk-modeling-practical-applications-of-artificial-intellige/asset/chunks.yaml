  trans: '

    具体而言，在金融服务领域，基于原则的治理框架将促进模型的恰当使用、适当的责任分层和透明度，并确保风险模型在开发、部署和使用方面的一致性。


    # 建立适当的内部治理框架


    凡用于决策的模型（无论是传统模型还是 AI 和机器学习），组织都应该关注基于错误或误用模型而做出的决策可能可能导致的负面后果，并应通过积极的模型风险管理来应对这些后果。这些负面后果可能包括限于潜在的资金损失和声誉风险。


    关于 AI 和机器学习治理的理念在行业机构中引起了广泛讨论。这部分源于广为人知的 AI 模型失败案例（例如，聊天机器人 `Tay`）以及对自动化系统运行方式的误解，人们对负责任使用
    AI 和机器学习存在普遍的不信任感，这进一步凸显了对更好模型治理的需求。


    大多数组织已经为其传统风险模型建立了强大的治理框架。根据监管指南，只要有适当的控制措施，现有框架就可以扩展到 AI 和机器学习。


    根据货币监理员办公室（`OCC`）在 `SR11/7` 中的规定，一个有效的模型治理框架包括稳健的模型开发、实施和使用，以及有效的验证、健全的治理、政策和控制。


    `OCC` 强调，模型风险随着模型复杂性的增加、输入增多以及对模型假设不确定性的增加而增加。由于潜在使用范围可能更广，一旦模型出错，其潜在影响也会更大。


    涉及到有效的模型风险管理和监管机构的预期，组织必须证明他们对模型不准确性、意外后果及其影响以及缓解措施的理解。


    通常情况下，根据背景和风险模型的实质性（materiality）来调整治理水平是有帮助的。请记住，模型治理方法应与组织规模、模型重要性，以及意外后果发生时产生的影响保持一致。如果有额外的用户在使用某个模型，则建议重新评估该模型的重要性。在实践中，我们发现，如果一个组织仅关注集团层面的模型性能（无论是传统模型还是机器学习），那么子公司可能会被忽略，而子公司的模型重要性可能大不相同。这可能在集团层面不会产生重大的敞口，但可能在子公司层面带来重大的模型和声誉风险。


    为了提供必要的治理和监督，对于影响高风险决策的风险模型，从外部监管机构到董事会再到高层管理的一系列利益相关者都参与了风险模型生命周期的各个阶段。除了直接参与模型生命周期的利益相关者外，适当的治理框架将进一步增强其他用户和其他消费者对模型的信任和透明度。


    # 治理开发机器学习模型


    在启动 AI 或机器学习之前，要问自己一个重要问题是：“我们如何建立适当的治理护栏，以确保从实验室投入生产的模型能够继续符合用途并交付预期的价值？”正如提到的，一种方法是加强对数据、模型建立更强的信任，并将预期结果与业务目标对齐。


    配备适当的人员、流程和政策将有助于在企业层面实现 AI 和机器学习处理的标准化。由于许多模型开发步骤可以自动化，与传统的统计模型相比，AI 和机器学习通常更容易开发，但它需要更高水平的监控，且根据用例的不同，AI
    和机器学习需要更频繁地进行监控。


    通过 AI 和机器学习治理，在整个生命周期中都可以提出关于“使用”的问题：


    *   如何评估机器学习的概念性完备性？

    *   特征是如何生成和选择的？

    *   是否可以用技术性和非技术性术语解释模型及其关键驱动因素？

    *   基准（benchmark）是否具有解释性？

    *   我计划如何确保机器学习保持符合用途？

    *   如果模型出现显著恶化，多快可以更换？


    这些以及其他问题记录在 `Figure 7.1` 中。由于这些原因，现有的治理框架可能不足以处理与 AI 和机器学习相关的增加的模型风险。


    正如提到的，通常情况下，使用 AI 和机器学习的模型风险往往更高。此外，事后解释性（post-hoc explainability）和解释性增加了另一层复杂性。由于数据质量差导致的模型错误风险以及延续社会或个人偏见的风险也在增加。`Figure
    7.2` 记录了上述挑战，这些挑战往往随着 AI 和学习而增加模型风险。


    为了更好地管理对模型治理日益增长的需求，标准的行业实践仍在演变，受到内部外部利益相关者影响力力量的影响：


    *   促进 AI 和机器学习伦理化使用的公众压力和倡导。

    *   遵守法律法规，这些法律法规强制组织在使用 AI、机器学习以及个人数据时尊重人们的权利和利益。

    '
