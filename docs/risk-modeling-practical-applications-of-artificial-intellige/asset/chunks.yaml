    Looking ahead, the expectations from regulators are clear: risk calculations will
    need to be performed at much higher levels of granularity, with greater emphasis
    on the use of high-quality data, especially when advanced algorithms are being
    used for risk model development.


    The risks of incorporating these emerging data sources in risk management, such
    as “alternative data,” are that these may violate consumer protection and fair
    lending laws. That may lead to unintended consequences in the use of AI and machine
    learning. The unintended consequences of AI and machine learning are often amplified,
    as the lack of explainability of the AI and machine learning masks the underlying
    data issues. The abstraction hidden in the layers of a deep learning algorithm
    is where existing approaches for data quality may fall short: organizations may
    have to turn to AI to manage the risks in the data.


    The use of AI and machine learning cannot function outside existing business processes.
    For organizations to benefit from its use, a comprehensive approach to enterprise
    data management is required, spanning across the silos of data collection, modeling,
    downstream processes, reporting, and disclosures. In essence, for AI and machine
    learning, the governance of data becomes as important as the governance of the
    models.


    # Importance of Data Governance to the Risk Function


    Historically, many organizations have lacked a strategic approach to data management
    and preparation. For financial institutions, compliance with the `BCBS239` principles
    meant that organizations had to fortify their data aggregation and reporting capability
    by tracking the accuracy, integrity, and completeness of the data used for risk
    measurement and management.


    The `BCBS239` guidance represented a major transformational challenge for financial
    institutions around the globe since its development in the wake of the Global
    Financial Crisis. The `BCBS239` guidance has four very closely related topics
    that help with better and more uniform risk exposure management:


    1. Risk governance and infrastructure

    2. Risk data aggregation

    3. Risk reporting practices

    4. Risk supervisory review


    These four topics are supported by 11 principles, as shown in [Figure 2.1](#c02.xhtml#c02-fig-0001).
    Several of these principles focus on improving data quality and data management
    to help with better and more uniform risk exposure management.


    ![Figure 2.1 The framework of the Basel Banking Standards (BCBS) standard number
    239. ¶ The BCBS239 has represented a major transformational challenge for banks
    around the globe since its development in the wake of the Global Financial Crisis.](images/c02f001.png)


    [Figure 2.1](#c02.xhtml#R_c02-fig-0001) The framework of the Basel Banking Standards
    (BCBS) standard number 239. ¶ The `BCBS239` has represented a major transformational
    challenge for banks around the globe since its development in the wake of the
    Global Financial Crisis.


    Other regulations, such as `GDPR` (Global Data Protection Regulation) and open
    banking, also require financial institutions to strengthen data governance.


    Regardless of regulatory expectations, strong data management practices are a
    competitive advantage for data-driven decision-making. For good-quality models
    and decisions, good-quality data is a prerogative.


    As a first step, organizations need to establish an enterprise data governance
    framework. This will then be supplemented by sound data integration and data preparation
    practices.


    However, without the fundamentals of data preparation and its management in place—that
    includes the use of data dictionaries, standardized datasets, and data quality
    and validation routines—adhering to `BCBS239` ([Figure 2.1](#c02.xhtml#c02-fig-0001))
    will continue to be a challenge for many financial institutions, and many are
    still in the process of full adoption.


    # Fundamentals of Data Management


    Many tools can be used to explore data and prepare it for risk modeling, but what
    is commonly encountered is that the sample design and approaches adopted for traditional
    models are often considered enough for AI and machine learning to be applied with
    rigor. This assumes that the fundamentals of data preparation and its management
    are present within the financial institution. Unfortunately, these fundamentals
    are not always in place to a meaningful degree, especially to support data-driven
    algorithms, even 14 years after the Global Financial Crisis.


    For the fundamentals of data preparation and management to be more easily achieved
    and to ensure that the data is fit-for-purpose to leverage advanced algorithms,
    an enterprise data strategy that will support best practices for AI and machine
    learning is needed. Let us look at each of the fundamental topics. In addition,
    AI and machine learning can be used to achieve these objectives more easily.


    ## Master Data Management


    Organizations have access to copious amounts of internal and external data. However,
    one of the largest gaps faced by financial institutions large and small is the
    key concept of data catalogs. Many institutions attempt to fill this gap with
    spreadsheet-based descriptions of data-sets that quickly become outdated as new
    columns or rows are added, like new financial products. Automation enabled by
    AI and machine learning can help build data catalogs that include the ability
    to easily search for data and shared columns or observations across datasets.
    The search queries utilize natural language processing to improve ease of use.
    Organizations can build custom solutions using a programmatic approach or utilize
    vendor-provided applications with built-in AI technologies.


    For example, a standard data catalog provides the following basic metadata for
    each dataset:


    * Column details

    * Row details

    * Size of the data

    * Completeness of the data (i.e., number of “missing” fields)

    * How the data is accessed and where it is located

    * Data security

    * Purpose of the data (this can be manually added or automated)

    * Data lineage and history of usage (i.e., how many reports, models, and jobs
    have been completed using the data, and the main users of the table)


    ## Standardizing Datasets and Ensuring Data Quality


    For AI and machine learning, risk management teams may decide that all the data
    profiling metrics generated today are enough.


    We recall a very profound statement made by a prolific professor at a conference
    when challenged about the output results of a model: “Well, the data is the data!”
    This can be true. Data that is sourced and used in a risk model is “the data,”
    but importantly, it can be improved and cleansed using sophisticated cognitive
    data-quality controls. These measures ascertain the data with regards to its uniqueness
    and descriptive statistics such as average values and mean, median, mode, and
    standard deviation. When more sophisticated and repeatable techniques are used,
    that “little bit of guesswork” is removed and the data cleansing becomes less
    manual.


    In practical terms, the data catalog information can be extended further, by descriptive
    data quality metrics and whether the data matches the expected distributions (e.g.,
    if the catalog expects integer data but it is a string, then it will be recorded
    as a mismatch). Data-quality metrics are also extremely useful to provide details
    on the completeness of the dataset. These include, but are not limited to:


    * Frequency of uniqueness, missing values, number of mismatches

    * Metadata measures that provide information on columns, including its type, format,
    length, and candidates for primary keys

    * Security scores that will automatically detect columns that contain personally
    identifiable or sensitive information

    * Semantic types by combining data-quality algorithms and natural language processing
    to automatically generate metadata (e.g., the columns representing numeric values,
    identification numbers, and postcodes)

