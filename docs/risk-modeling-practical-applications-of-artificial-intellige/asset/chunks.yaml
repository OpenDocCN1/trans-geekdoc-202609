- raw: "Today, there is no global consensus on the design and deployment of ethical\
    \ AI frameworks. However, within developed regulations and guidelines, the same\
    \ ethical principles relating to fairness, ethics, accountability, and transparency\
    \ are used. The depth and breadth of ethical AI compliance guidelines and regulations\
    \ largely depend on the maturity of AI and machine learning adoption in the respective\
    \ jurisdictions. For example, regulators in Asia Pacific are continuing to address\
    \ ethical AI frameworks to help ensure that fairness objectives are achieved (e.g.,\
    \ the Australian government recently released the “AI ethics framework,” and the\
    \ Hong Kong Monetary Authority has released regulatory guidance in the form of\
    \ the “RegTech Adoption Practice Guide” that includes prerequisites for an “AI\
    \ governance framework”)\n\n## CONCLUDING REMARKS\n\nWith the use of AI and machine\
    \ learning, risk departments should broaden their thinking to extend their performance\
    \ monitoring framework so that transparency of AI and machine learning can be\
    \ achieved without overly depending on manual code. By dynamically tracking a\
    \ range of interconnected categories—including, but not limited to, the input\
    \ data, model decay, and model robustness, risk departments can better understand\
    \ potential AI and machine learning limitations and proactively identify issues\
    \ that may lead to model failure. Regulatory bodies and central banks also expect\
    \ risk departments to adhere to certain compliance measures when validating AI\
    \ and machine learning. We have explained the main concepts in this chapter.\n\
    \nHowever, even in the absence of clearly defined regulatory expectations of model\
    \ risk management as outlined in SR 11-7, model risk management should still be\
    \ top of mind, as the model risks associated with AI and machine learning can\
    \ cause quantifiable loss, from inaccurate risk calculations, to the costs involved\
    \ with developing and implementing models, to adverse impacts of making unfair\
    \ decisions. These risks are worsened when AI and machine learning function outside\
    \ of a robust model risk management framework that governs the development, deployment,\
    \ and use of the models.\n\n## ENDNOTES\n\n1.  [1](#c07.xhtml#R_c07-note-0001).  Artificial\
    \ intelligence, [https://www.oecd.org/going-digital/ai/principles/](https://www.oecd.org/going-digital/ai/principles/)\n\
    \n2.  [2](#c07.xhtml#R_c07-note-0002).  Personal Data Protection Commission, *Model\
