  fmt: "\nLinear activation functions take a linear combination of each weighted input,\
    \ while nonlinear activation functions like the sigmoidal function take a sum\
    \ of the weighted inputs into a logistic function. For example, when learning\
    \ the sigmoidal logistic function initially approximates an exponential equation.\
    \ Please note that these intrinsic characteristics of the sigmoidal logistic function\
    \ are not to be confused with machine learning optimization discussed in [Chapter\
    \ 8](#c08.xhtml). Furthermore, with a sigmoidal neuron, the value that gets returned\
    \ is between 0 and 1 and is dependent on the weighed input that gets summed. For\
    \ instance, if the weighed sum is negative, then the returned value is close to\
    \ “0.” Despite their limitation, sigmoidal neurons are used more often than linear\
    \ neurons, as the generated algorithms are much more versatile in comparison.\n\
    \nNeurons are also the building blocks of the entire nervous system of the body\
    \ and receive sensory information from the external environment and send commands\
    \ to muscles among many other known functions.\n\n### Artificial Neural Networks\n\
    \nAn artificial neural network in a deep learning algorithm is created in an analogous\
    \ manner to a biological neural network in that its creation is dependent on many\
    \ interactions: from the input data, between many neurons, and the output generated\
    \ from the neural network's response. Deep learning algorithms are further complicated\
    \ by nets of neural networks that resemble layers. Neurons at the input layer\
    \ are connected to the actual output or answer to the problem and need not connect\
    \ to each other, while neurons at the output layer are connected to one another\
    \ and directly receive input data. The network can be feed-forward where there\
    \ are no connections between neurons at the input to those at the output layer,\
    \ or recursive where there are connections between input and output layers.\n\n\
    There can also be a hidden layer that exists between the input and output layers.\
    \ The hidden layer itself is where the wondrous power of the network solves problems\
    \ and derive features of the input data that are extracted to learn and derive\
    \ an output. Technically, the hidden layer involves an extra transformation of\
    \ some type but requires no extra parameters. Interestingly, the hidden layer\
    \ is where the “deep” aspect of deep learning gets derived—a neural network with\
    \ many hidden layers is considered “deep.” ![Figure 3.2 Schema of an artificial\
    \ neural network with hidden layers.](images/c03f002.png)\n\n[`Figure 3.2`](#c03.xhtml#R_c03-fig-0002)\
    \ Schema of an artificial neural network with hidden layers.\n\n*   The input\
    \ layer and first hidden layer\n*   One hidden layer to the next hidden layer\
    \ when there is more than one hidden layer\n*   The last hidden layer and the\
    \ output\n\n### Automated Machine Learning\n\nThere are now platforms available\
    \ that offer automated machine learning (AutoML). These offer predeveloped model\
    \ templates for a range of algorithms. This allows the predefined model pipelines\
    \ to run in parallel against a training dataset and automate, train, and evaluate\
    \ predictive accuracy of each model, with very little human intervention required.\
    \ AutoML is useful when modelers are not certain of choice of algorithm.\n\nOverall,\
    \ AutoML allows for fewer assumptions to be made by a modeler by evaluating different\
    \ model pipelines to find the most predictive model for the dataset, so that the\
    \ best predictive models that are the best fit for the dataset are developed.\
    \ Model pipelines can be based on templates that can include data processing,\
    \ apply regulatory constraints and check for bias and fairness of model outcomes.\
    \ In addition, the models generated by AutoML still need review and justification,\
    \ including explaining both the interpretations and decisions are fair, safe,\
    \ and transparent. We explain these considerations in [Chapters 4](#c04.xhtml)\
    \ and [5](#c05.xhtml).\n\n### A Further Note: Robotic Process Automation\n\nOnce\
    \ a machine has been taught to solve a problem, the resulting logic can then be\
    \ deployed—this is the aim of a machine learning algorithm. When deployment of\
    \ the machine replaces a business process, is truly self-sustaining, and requires\
    \ little human intervention, then that automation is referred to as robotic process\
    \ automation (RPA). In some cases, RPA is successfully deployed to replace the\
    \ traditional strategies of cost savings, such as offshoring and outsourcing business\
    \ operations.\n\nRPA has started to replace traditional cost-saving strategies\
    \ because it is estimated in some cases to run at a much lower total cost of a\
    \ typical human resources. In addition, RPA has been shown to dramatically reduce\
    \ processing time and eliminate error rates.\n\n### Putting It All Together\n\n\
    To summarize the terms of reference\n\n## CONCLUDING REMARKS\n\nAI and machine\
    \ learning are progressing rapidly in the financial services industry around the\
    \ globe. However, it should be noted that some countries have much slower rates\
    \ of adoption due to the unease around its use for regulatory compliance purposes.\n\
