- raw: "*“…you do not really understand a topic until you can teach it to a mechanical\
    \ robot.”*\n\n—Judea Pearl and Dana Mackenzie\n\nIn recent times, topics related\
    \ to the ethical use of artificial intelligence (AI) and machine learning have\
    \ been much debated by industry practitioners, regulators, and the public. It\
    \ is now well understood that one of the unintended consequences of AI and machine\
    \ learning is the risk of making biased decisions that can lead to unfair outcomes.\
    \ The biases can stem from the historical and societal biases in the data that\
    \ is used for training the models or introduced in the model development process\
    \ itself. Biased models and decisions can lead to unintended consequences such\
    \ as disparity or lack of access to the issuance of credit and insurance policies\
    \ for minority groups.\n\nOne of the promises of AI and machine learning is to\
    \ reduce bias and unfairness in financial decision-making, facilitated through\
    \ automation. However, despite the promise, we do not need to look far to find\
    \ examples where AI and machine learning reinforced bias and amplified unfairness\
    \ in decision-making: from prioritizing job applications based on gender, to computer\
    \ vision that discriminates based on race, to credit limit approvals that are\
    \ gender biased.\n\nData input and data capture by people, source systems, and\
    \ applications that vary across different geographic localities can result in\
    \ inaccuracies due to mislabeling, misinterpretation, or incomplete data processing.\
    \ The data may not be representative of the population that the data will be applied\
    \ on.\n\nWhen the dataset used for model development includes historically biased\
    \ outcomes, the same biased dataset is then used to train potentially biased models.\
    \ In AI and machine learning, the issues that lead to bias increase the risk of\
    \ unfair decisions and are made worse when characteristics or features that are\
    \ correlated to protected variables are used. Protected variables are variables\
    \ with legal or ethical restrictions. These can include groups that cannot be\
    \ discriminated against in certain jurisdictions (e.g., demographic variables\
    \ like gender and race). The models and business rules may also introduce bias.\n\
    \nIt is also important to consider that bias in decision-making can originate\
    \ from a range of sources, not only the training data. These sources may include\
    \ the data used for model development, model assumptions, the models themselves,\
    \ or business rules or other decisions made independently from the model that\
    \ are impacting the model outcome.\n\nRisk decisions are often further complicated\
    \ by manual assessment processes and procedures where outcomes are by nature qualitative.\
    \ An example includes judgmental decisions made by different manual assessors,\
    \ analysts, and managers. Although most organizations have policies and procedures\
    \ in place to guard against irresponsible conduct and hold decision makers accountable,\
    \ it does not mean that all decisions are fully exempt from bias.\n\n## ASSESSING\
    \ BIAS IN AI SYSTEMS\n\nIn recent years, the conversation of responsible AI has\
    \ evolved from the philosophy of ethics in the use of machine-led decision-making,\
    \ to a sociotechnological discussion on quantifiable ways to ensure automated\
    \ systems are upheld by the same codes of conduct and ethical standards as human\
    \ decision-making.\n\nKeep in mind that with supervised learning, like AI and\
    \ machine learning, predictive modeling is discriminatory by design, as the goal\
    \ is to differentiate based on the values of a labeled variable. However, when\
    \ the algorithm discriminates based on data that is nonrepresentative of the population\
    \ or inputs with legal and ethical restrictions, it may violate consumer protection\
    \ and data privacy laws. In the context of lending and insurance decisions, it\
    \ is generally in the best interests of the services provider that the model outcome\
    \ is as accurate as possible using all reasonably available information. This\
    \ may come at the expense of the desire of the consumer, which is interested in\
    \ the most favorable model outcome. This means that a careful balance is needed\
    \ between business aims and fair and responsible model outcomes. Addressing bias\
    \ and ensuring that decisions are made equitably can help safeguard vulnerable\
    \ consumers from exploitation throughout their lifetime. To counter bias, fairness\
    \ assessments should be embedded across the customer lifecycle ([Figure 5.1](#c05.xhtml#c05-fig-0001)).\
    \ In this diagram, models at the point of loan onboarding have been selected as\
    \ the working example, but assessing the fairness of outcomes is needful for model\
    \ types across the customer lifecycle, including those used for account management\
    \ and collection strategies.\n\n ![Figure 5.1 Assessing bias, fairness, and vulnerability\
    \ across the customer lifecycle.](images/c05f001.png)\n\n[**Figure 5.1**](#c05.xhtml#R_c05-fig-0001)\
    \ Assessing bias, fairness, and vulnerability across the customer lifecycle.\n\
    \nFor example, biased decisions at the time of onboarding, either from the model\
    \ design or data capture, can result in measurable differences in the treatment\
    \ of consumers with similar risk profiles, and are considered unfair.\n\nFairness\
    \ is concerned with the fair decisions of models and the equitable distribution\
    \ of benefits. Consumers' vulnerability is measured along the customer journey\
    \ and is typically marked by circumstantial changes that can be worsened by unfair\
    \ decisions. For services providers, it is becoming increasingly important to\
    \ incorporate the vulnerability of consumers in their decision-making. For example,\
    \ a change in circumstances can lead to financial stress and may require active\
    \ account management.\n\nImportantly, balancing fairness with business objectives\
    \ will require:\n\n*   Assessing a range of fairness metrics to mitigate different\
    \ types of bias (data bias, model bias, evaluation bias, etc.), including an ability\
    \ to select metrics appropriate to the context in which the model is used\n\n\
    *   Ensuring that fairness assessments are embedded in the end-to-end model lifecycle\
    \ and decisioning processes\n\n*   Using powerful tools to assess fairness at\
    \ an individual and group level\n\nThe use of advanced fairness measurement tools\
    \ supports the careful analysis of protected variables, the investigation of fairness\
    \ risk, and its root causes.\n\nIn this chapter, we explain the current definitions\
    \ and measures of bias, fairness, and vulnerability as they relate to data and\
    \ models. It must be noted that most risk models, whether traditional, statistical\
    \ models, or those developed using AI and machine learning, need to be assessed\
    \ for latent bias and unfairness. With AI and machine learning, bias and unfairness\
    \ are more challenging to detect by human intuition alone. In this chapter, we\
    \ focus on the application of models as it relates to impacting consumers. That\
    \ does not preclude other types of models from the risk of leading to unfair decisions.\
    \ Having said that, this chapter will pay attention to vulnerability concerns\
    \ throughout the customer journey. This will be helpful to ensure that automated\
    \ systems are able to deliver on the promise of addressing fairness in decision-making\
    \ and thus increasing the value of the risk models to organizations, consumers,\
    \ and society.\n\n## WHAT IS BIAS?\n\nBias in AI systems occurs when human prejudice\
    \ based on mistaken assumptions becomes part of the way automated decisions are\
    \ made. A well-intentioned algorithm may inadvertently make biased decisions that\
    \ may discriminate against or treat protected groups of consumers differently.\n\
    \nBias may occur and enter at any point in the model lifecycle. A common misnomer\
    \ is that bias stems only from training data that is not well diversified, and\
    \ although that is a common source for bias to arise in automated systems, in\
    \ fact, bias may enter the model lifecycle much earlier—for example, in the way\
    \ the problem statement is formulated or in the way data gets collected."
