    \ John Wiley & Sons, 1998).\n\n# CHAPTER 9  \n\nThe Interconnection between Climate\
    \ and Financial Stability\n\nOver decades, the discussions about climate change\
    \ have been topics of both wide debate and scientific research. Questions have\
    \ ranged from “*What is climate change?*” to “*How can climate change be any different\
    \ from natural climate variations*?” to *“Are we heading to a climate apocalypse?”*\
    \ The accumulated scientific research found that globally, atmospheric temperatures\
    \ are rising above natural variations with potentially devastating consequences\
    \ to people, communities, and impacting financial stability.\n\nThe tragedy of\
    \ the horizon, as Mark Carney put it in his ground-breaking speech in 2015,\n\n\
    Many industries have taken steps to better understand, quantify, and report on\
    \ climate-related risks, and to devise strategies to mitigate the impacts of climate\
    \ change. It is important to note that these initiatives are in their infancy.\
    \ In the financial services industry, central banks, and regulators are raising\
    \ awareness about the financial risks and opportunities of climate change. Recently,\
    \ in 2021, more than 450 financial institutions representing $130 trillion of\
    \ total assets committed to net-zero targets by 2050, as part of the Glasgow Financial\
    \ Alliance for Net Zero (GFANZ).\n\nIt highlighted that the financial services\
    \ industry has a key role to play in tackling climate change, in:\n\n*   Ensuring\
    \ the stability and resilience of the financial system in facing emerging risks.\
    \ \n\n*   Helping to manage the financial and nonfinancial risks associated with\
    \ climate change. \n\n*   Helping to lead the transition through portfolio decarbonization\
    \ and greening initiatives and supporting the transition toward a more sustainable\
    \ economy through lending and investment activities, including the creation of\
    \ the Network for Greening the Financial System (NGFs) by a group of Central Banks\
    \ and supervisors in 2017. \n\n    Many central banks, regulators, and industry\
    \ bodies have published guidelines and policies to address financial risks posed\
    \ by climate change. While we do observe convergence in some areas of guidance\
    \ across jurisdictions—for example, the use of forward-looking scenario analysis\
    \ and standardized reporting—for the Board and the risk management function, a\
    \ profusion of divergent regulatory frameworks, guidance, and standards exist.\
    \ What is becoming clearer is that financial institutions are focusing on a broad\
    \ range of topics covering climate-related calculations, controls, conduct, communication,\
    \ culture, and their customers. These considerations include:\n\n    *   Development\
    \ of plausible, short- and long-term climate risk narratives in the form of forward-looking\
    \ scenarios that involve warming potential, supported by climate models that incorporate\
    \ physical and transition risks.\n\n    *   Identification of the impacts on financial\
    \ risks such as credit and market risks and disclosures that involve forward-looking\
    \ models, insights, and metrics.\n\n    *   Standardized reporting and calculations\
    \ that will ensure a level playing field and comparable results.\n\n    *   Appropriate\
    \ levels of conduct to ensure artificial “greening” of portfolios does not occur,\
    \ referred to as *greenwashing*.\n\n    *   Adherence to national laws. Regular\
    \ communication with regulators, investors, employees, clients, and the public.\n\
    \n    *   Development of internal environmental risk assessment capacity.\n\n\
    \    *   Engagement with stakeholders, especially those expected to be impacted\
    \ by climate change.\n\n    *   Support and engagement with customers during the\
    \ responsible transition period that the institution decides to take.\n\n    As\
    \ we find ourselves in the decisive decade in transitioning to a lower carbon\
    \ economy, there is an urgency for financial institutions to help manage both\
    \ the financial and nonfinancial risks. In the next section, we will be discussing\
    \ more details.\n\n## MAGNITUDE OF CLIMATE INSTABILITY: UNDERSTANDING THE “WHY”\
    \ OF CLIMATE CHANGE RISK MANAGEMENT\n\nFirstly, it is important to understand\
    \ the main issues, the science, and the data before discussing possible solutions.\
    \ In the financial services industry, as in other industries, climate risk is\
    \ becoming mainstream in corporate decision-making: the magnitude of climate instability\
    \ will impact most aspects of financial decision-making. To assess and address\
    \ climate change, a *scientific* approach can be borrowed—where a *scientific*\
    \ mindset is used to investigate historic data and observational studies, build\
    \ questions, and then formulate a hypothesis. However, this approach has its own\
    \ limitations, as there is no historical precedent for climate change.\n\n###\
    \ Climate Change Crisis: Not Just about CO[2] Emissions\n\nDiscussions on climate\
    \ change, and whether it is indeed an emergency or real, are not new and have\
    \ been around for decades. However, at the time of writing, 97% of climate scientists\
    \ agree that climate change exists."
