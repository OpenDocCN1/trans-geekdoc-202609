    \ of the data.\n\nTypically, risk models, including those used for intra-day or\
    \ near-real-time calculations, are used in settings with existing and established\
    \ model governance practices in place. With the use of more advanced modeling\
    \ technologies and approaches, like AI and machine learning, model risk tends\
    \ to be higher (as explained in the next section), therefore near-real-time performance\
    \ tracking of these models becomes critical.\n\nA robust AI and machine learning\
    \ governance framework aligns the oversight of the use of AI systems and machine\
    \ learning to the corporate strategy and values of an organization. AI governance\
    \ is that strategy that then defines the policies and procedures to establish\
    \ accountability for the safe development, deployment, and use of AI systems and\
    \ machine learning. These aspects are central tenants of Conway's law—that an\
    \ organization's dysfunction always reveals itself in its products. Thus, AI and\
    \ machine learning governance reflects the organization's mindset.\n\nIn 2019,\
    \ the OECD defined a set of AI principles to promote the use of AI for innovation\
    \ while protecting human rights.\n\nIn addition to regulations on AI governance,\
    \ in 2021, the Federal Trade Commission in the United States defined its expectations\
    \ for the responsible use of AI, especially in the context of fair outcomes for\
    \ consumers.\n\nIn 2021, the Office of the Currency Comptroller updated its model\
    \ risk management standards to take into account the use of AI and machine learning.\n\
    \nIn a sense, all models are representations of reality, and by its nature, will\
    \ have some degree of uncertainty and inaccuracy. The better the characteristics\
    \ and the limitations of the model are understood—up front—the better informed\
    \ the model validation function will be in managing and monitoring the model in\
    \ production."
