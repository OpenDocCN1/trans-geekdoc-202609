    # CHAPTER 9: The Interconnection between Climate and Stability


    Over decades, discussions about climate change have been topics of wide debate.
    What is becoming clearer is that although temperatures are rising, as Carney put
    it in 2015, central banks and supervisors have taken steps.


    Many central banks, regulators, and industry bodies have published guidelines
    to address financial risks. While we observe convergence in some areas—for example,
    the use of forward-looking scenario analysis and standardized reporting—these
    are in infancy. As we find ourselves in the decisive decade in transitioning to
    a lower carbon economy, there is an urgency for financial institutions to help
    manage both financial and nonfinancial risks. In the next section, we will be
    discussing more details.


    ## MAGNITUDE OF CLIMATE INSTABILITY: UNDERSTANDING THE “WHY” OF CLIMATE CHANGE
    RISK MANAGEMENT


    Firstly, it is important to understand the main issues, the science, and the data
    before discussing possible solutions. In the financial services industry, as in
    other industries, climate risk is becoming mainstream in corporate decision-making:
    the magnitude of climate instability will impact most aspects of financial decision-making.
    To assess and address climate change, a *scientific* approach can be borrowed—where
    a *scientific* mindset is used to investigate historic data and observational
    studies, build questions, and then formulate a hypothesis. However, this approach
    has its own limitations, as there is no historical precedent for climate change.


    ### Climate Change Crisis: Not Just about CO[2] Emissions


    Discussions on climate change, and whether it is indeed an emergency or real,
    are not new and have been around for decades. However, at the time of writing,
    97% of climate scientists agree that climate change exists.

