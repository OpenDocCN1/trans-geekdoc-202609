- raw: "The uptake of these technologies for process automation and in digital customer\
    \ journeys is growing exponentially in many industries, yet we are observing a\
    \ more conservative and slower uptake in financial risk management. In an era\
    \ where so much information is available on the use of AI and machine learning,\
    \ financial organizations are cautious about its pertinence in regulated areas\
    \ that expect compliance and transparency in decision-making.\n\nAt the same time,\
    \ the digital revolution is occurring against a backdrop of an increasingly uncertain\
    \ world. Volatility is at an all-time high. The risk management function is contending\
    \ with new types of risks every day. Organizations around the world are dealing\
    \ with myriad risks such as a haphazard recovery from the COVID-19 pandemic, rising\
    \ inflation, cumulating geopolitical risks, and the impacts of climate change.\n\
    \nWith this book, we want to highlight the strengths and weaknesses of AI and\
    \ machine learning and explain how both can be effectively applied to everyday\
    \ risk management problems, as well as efficiently evaluating the impacts of shocks\
    \ under uncertainty, such as global pandemics and changes in the climate. Throughout\
    \ the text, we aim to clarify misconceptions about the use of AI and machine learning\
    \ using clear explanations, while offering practical advice for implementing the\
    \ technologies into an organization’s risk management framework.\n\nWith the right\
    \ controls, AI and machine learning can deliver tangible benefits and become useful\
    \ tools in the toolkit of the risk function. It can improve the accuracy and speed\
    \ of risk assessments compared to human-led or other traditional methods of decision-making,\
    \ and at the same time introduce new ways of work in risk management through increased\
    \ automation. The rewards for innovation are not without risks of their own, and\
    \ these technologies are largely underregulated today (although, that will change\
    \ in the future). In this book, we also highlight the barriers that organizations\
    \ face in using AI and machine learning and provide ways to overcome them.\n\n\
    The book is structured to introduce AI and machine learning in the context of\
    \ financial risk modeling, including the onboarding and preparation of diverse\
    \ datasets. Throughout the book, we provide real-world risk management applications.\
    \ The book contains dedicated material on model implementation, explainability,\
    \ and addressing bias and fairness. It also provides details on extending model\
    \ governance frameworks to AI and machine learning, the use of optimization in\
    \ machine learning, and how AI and machine learning can help risk managers better\
    \ assess and address new types of risks like climate change.\n\nWith the transformational\
    \ advances in AI and machine learning, together with the radical speed of new\
    \ development, as an industry, we are only scratching the surface in its practical\
    \ application in financial risk management. With this book we aim to enable organizations\
    \ to continue putting in place the right frameworks and infrastructure to enable\
    \ modern technologies, and more importantly, build proficiency and capacity in\
    \ AI and machine learning.\n\n# CHAPTER 1  \n\nIntroduction\n\n*“By far, the greatest\
    \ danger of Artificial Intelligence is that people conclude too early that they\
    \ understand it.”*\n\n—Eliezer Yudkowsky\n\nNo doubt, we, as a society, are entering\
    \ into new advances in technology at ground-breaking speed. The rapid growth in\
    \ digital data and advances in computing power open endless possibilities for\
    \ transformation in every sphere of life. At the same time, these developments\
    \ are also driving unparalleled change in human behavior, consumer demand, and\
    \ expectations. It is believed that we are now entering the next wave of revolution:\
    \ the fifth industrial revolution or the age of artificial intelligence (AI).\
    \ In this age, it is said that machines are truly capable of varying degrees of\
    \ self-determination, reason, and “thought,” working with humans in unison. As\
    \ a technology, AI is pervasive in every industry, including financial services.\
    \ It is also starting to mature as a useful tool in risk management function.\n\
    \nHowever, *AI* is a broad term and defined by various industry bodies in different\
    \ ways. The *Oxford Dictionary* defines it as “the theory and development of computer\
    \ systems able to perform tasks normally requiring human intelligence, such as\
    \ visual perception, speech recognition, decision-making, and translation between\
    \ languages.”\n\nAs a scientific discipline, AI includes several subdisciplines,\
    \ such as machine learning (of which deep learning and reinforcement learning\
    \ are examples), machine reasoning (which includes knowledge representation, deduction,\
    \ and induction), and robotics (which includes sensors and the integration of\
    \ other techniques into cyber-physical systems). Despite the enormous transformational\
    \ benefits that true “AI” systems and platforms can bring to humanity, what is\
    \ it about “AI” that sends shivers down our spines? Arguably, the shivers are\
    \ caused by the fact that, for the first time in human history, we are engaging\
    \ with the *intelligence* component of technology and the fear of the unknown.\
    \ And another reason is Hollywood!\n\nIt is quite amazing that one of the most\
    \ memorable moments in cinema is from Stanley Kubrick's 1968 production of Arthur\
    \ C. Clarke's *2001: A Space Odyssey*.\n\nThere are scenes from other movies and\
    \ science fiction novels that depict AI as ultimately rising and taking control\
    \ of society. In many ways, AI-enabled systems are already safely integrated into\
    \ our personal lives. Take, for example, virtual assistants like Google Assistant,\
    \ Apple's Siri, and Amazon's Alexa that use the more traditionally derived and\
    \ AI-puritan List Processing (LISP) for voice recognition. Such “AI” has been\
    \ widely adopted\n\nBy continuing to augment, and at times automate, manual jobs\
    \ or daily tasks, AI-enabled applications continue to transform our personal and\
    \ professional lives. AI is making what was once science-fiction into science-fact.\
    \ This will continue to be the case when considering the consolidated impact of\
    \ four major factors:\n\n*   **Moore's law.** Computing power is said to double\
    \ every two years and will continue to do so for the foreseeable future.\n\n*\
    \   **Data.** The creation of data and replication have doubled each year. It\
    \ is estimated that 1.7 megabytes of new information are created every second\
    \ for every human being on the planet, meaning that from 2010 to 2020, there was\
    \ a 5,000% growth in data—from 1.2 trillion gigabytes in 2010 to 59 trillion gigabytes\
    \ in 2020. The exponential growth in data is largely driven by digitalization,\
    \ and is expected to continue.\n\n*   **Funding.** AI funding has doubled every\
    \ two years, largely driven by the availability of required computational power.\n\
    \n*   **Test of time.** There is 50 years of established AI and quantitative research\
    \ that is underpinning better algorithms.\n\nTaking these four factors into account\
    \ and the current state of play, AI is not merely hype. Although we are going\
    \ through a hype cycle where expectations may not be realistic, there is great\
    \ potential that will likely be realized in the coming years.\n\n## RISK MODELING:\
    \ DEFINITION AND BRIEF HISTORY\n\nIn recent years, the number of risk models employed\
    \ by financial institutions increased dramatically, by 10–25% annually.\n\nHenceforth,\
    \ in this book, the term model refers to a financial risk model unless otherwise\
    \ stated. Interestingly, most of the modern-day risk and probability theory evolved\
    \ from innovation in science, economics, and technology in the last 200 to 300\
    \ years."
