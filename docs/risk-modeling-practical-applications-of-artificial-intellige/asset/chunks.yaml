    # CHAPTER 6 Machine Learning Deployment, Implementation, and Making Decisions


    As we have established in previous chapters, the question is not whether AI and
    machine learning have transformational potential—that''s given—but rather how
    to operationalize them in an ethical, responsible, and sustainable way.


    The opportunities that these models present are broad: better accuracy, deeper
    insights into big data, and efficiency gains from automation. Regardless of how
    impressive AI or machine learning looks in the laboratory, it only delivers value
    when deployed in the real world.


    With the increased sophistication in algorithms, deployments are an increasingly
    challenging hurdle organizations are facing. According to a Gartner report in
    2021, only 53% of POC (proof of concept) models made it beyond the lab, and this
    process still took on average 9 months. One reason for the small number of AI
    and machine learning in production today is the limitations associated with legacy
    environments. By design, these systems were not set up for newer AI and machine
    learning.


    Many organizations have established processes associated with legacy environments.
    Although incumbent, legacy systems have reached a workable level of operation
    for existing models, these are not without their own challenges—as explained in
    the next section. One reason for slow deployments is that historically, the development
    and deployment of risk models occurred in systems that are both physically and
    logically separate. Different systems that are in use for development and production
    typically have different cadences, and often different programming languages.


    The inability to deploy AI and machine learning at scale has started to create
    bottlenecks across the analytical value chain. The business value that AI and
    machine learning can generate from contributing to decisions in a production environment
    cannot materialize as the models are trapped as data science projects.


    A major driver for innovation in this area is enterprise digital transformation.
    It has radically changed the way in which organizations, including financial services,
    engage with their customers and other stakeholders. To meet expectations for hyperpersonalized
    and always-on services, decision-making is becoming more digital, relevant, and
    real-time. In general, the goals of digital transformation efforts are not only
    to provide a digital channel but also to improve operational efficiency, agility,
    and speed to bring new digital services and products to market.


    ## TYPICAL MODEL DEPLOYMENT CHALLENGES

