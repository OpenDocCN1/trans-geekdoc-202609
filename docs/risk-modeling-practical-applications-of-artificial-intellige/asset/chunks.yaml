    \ parameters: the minimum number of samples needed for splitting events, the minimum\
    \ number of samples needed in a terminal leaf, the fraction of the total number\
    \ of samples needed in a terminal leaf (weight-based), and the maximum number\
    \ of leaves.\n\n || \n\n*   L1 regularization\n\n*   L2 regularization\n\n*  \
    \ Learning rate\n\n*   Maximum depth\n\n*   Minimum leaf size\n\n*   Number of\
    \ interval bins\n\n*   Number of inputs per split\n\n*   Number of trees\n\n*\
    \   Subsample rate\n\n |\n\n|  || \n\n*   Boosting parameter is the number of\
    \ sequential trees for modeling.\n\n*   Miscellaneous parameters: the loss function\
    \ used to minimize each split, initialization of the output that is needed when\
    \ the outcome of another model is used as the initial estimates for a GBM (gradient\
    \ boosting machine), the random sample number used for seeding to allow for this\
    \ number to be fixed but this fixing still allows for random samples to be seeded,\
    \ verbose that allows for different values to be generated as outputs when the\
    \ model fits, warm start that allows for additional trees to be fitted on previous\
    \ fits of a model, and presort that automatically selects the data to be presorted\
