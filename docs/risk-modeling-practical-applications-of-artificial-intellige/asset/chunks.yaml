    # 数据管理与准备


    数据已成为组织、实体和政府的重要资源。自作为一门学科诞生以来，数据管理一直。从全球金融危机中获得的一个关键教训是，银行的信息技术（IT）和数据架构无法支持。这对银行本身以及金融系统的稳定产生了严重后果。作为回应，巴塞尔监管委员会（BCBS）制定了一项关于有效风险原则的标准，编号
    239。


    近年来，数字化以及消费者和企业留下的数字足迹导致可用数据的快速增长。如今，风险职能运行在一个对更好的数字服务和数据驱动决策需求日益增加的世界。其他倡议，如开放银行（或基于许可的数据交换）、大量专有和开源工具的可用性以及云计算，对金融服务的价值创造产生了重大影响。随着这些倡议的增长以及高级分析和机器学习的主流使用，这些创新需要强大的数据基础。


    尽管拥有更多数据有其好处，但也带来了更多挑战，包括获取高质量数据、网络安全以及个人数据的负责任使用。随着建模方法变得更加数据驱动，稳健的数据管理对于人工智能（AI）和机器学习的应用至关重要。


    大数据术语是指如此巨大、如此快速或如此复杂以以难以使用传统方法处理的数据。


    大数据概念在行业分析师 Doug Laney 使用三个 *V* 定义其时获得了动力：


    - **量（Volume）**：组织从各种来源收集数据，包括业务交易、第三方数据提供者、新闻文章等。过去，存储这些数据是一个问题，但云平台和数据湖上更廉的存储减轻了负担。

    - **速度（Velocity）**：随着实时数据的增长，数据以不断加快的速度进入企业，必须及时处理。

    - **多样性（Variety）**：使用更大的数据意味着必须利用不同类型的数据，这些数据并不一定结构化为维度表。非结构化数据源（如传感器数据、图像和社交媒体更新）增加了数据的多样性。


