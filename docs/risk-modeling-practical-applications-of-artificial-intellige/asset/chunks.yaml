- raw: "Although most central banks have issued guidelines on how regulated entities,\
    \ including banks, can apply prudent practices for climate risk management, in\
    \ many jurisdictions a lack of clarity remains on:\n\n*   The key data and parameter\
    \ requirements for different stress testing scenarios\n\n*   Endorsement of credible\
    \ and commonly used scenarios apart from those provided by the NGFS\n\n*   Details\
    \ on how institutions should conduct short- and long-term scenario analysis\n\n\
    To not be caught off guard, for organizations a good starting point is to review\
    \ their capability to see if it meets the fundamentals of a robust analytic ecosystem\
    \ ([Figure 9.2](#c09.xhtml#c09-fig-0201)):\n\n1.  Data sourcing and its management,\
    \ including data validation and quality assurance.\n\n2.  A risk-modeling platform\
    \ for data-derived insights leveraging quantitative techniques and procedures.\n\
    \n3.  Risk calculations and simulation capability.\n\n4.  Integration with impact\
    \ assessments, business decision-making, and reporting.\n\nOrganizations will\
    \ need granular physical and transition risk data, and that data will require\
    \ use of advanced data-quality procedures to assure data quality. High-performance,\
    \ parallel-processing engines can accommodate the granular data requirements and\
    \ frequency of forward-looking risk simulation cycles.\n\nAs we know, data is\
    \ the foundation of any analytics-derived outcome. Without the quality, validation,\
    \ and assurance measures of data, the outcome is likely to be inferior. Provided\
    \ that climate risk modeling is a relatively new topic, climate risk data for\
    \ measuring financial impacts is not that readily available, especially loan-level\
    \ information, and not yet of adequate quality to support large-scale, robust\
    \ model development and simulation.\n\n ![Figure 9.2 A proposed framework to create\
    \ a climate risk ecosystem.](images/c09f002.png)\n\n[**Figure 9.2**](#c09.xhtml#R_c09-fig-0201)\
    \ A proposed framework to create a climate risk ecosystem.\n\nTo better address\
    \ the limitations, organizations will need to focus on the following areas to\
    \ achieve robustness in their climate risk management efforts:\n\n*   Ensure data\
    \ quality: \n\n    *   Establish a robust data-quality framework consistent with\
    \ BCBS (Basel Committee on Bank Supervision) 239 principles for internal and third-party\
    \ climate-related data.\n\n    *   Supply full transparency, such as source of\
    \ the data, methods used to transform variables, and geospatial level of granularity.\n\
    \n*   Expand scenario coverage: \n\n    *   Strengthen scenario analysis capability.\n\
    \n    *   Streamline the management of multiple scenarios.\n\n    *   Incorporate\
    \ flexibility for portfolio growth to reflect business strategy and run-off assumptions.\n\
    \n    *   Quickly and efficiently meet the expanding challenges of supervisory\
    \ stress testing to include longer time horizons and expanded risk factors.\n\n\
    \    *   Expand capabilities to support scenario-based business planning.\n\n\
    *   Improve modeling: \n\n    *   Put in place a more sophisticated modeling environment\
    \ that can be used to develop models for physical and transition risk, to also\
    \ enrich models such as those used for expected credit losses (ECL) and risk-weighted\
    \ assets (RWA).\n\n    *   Ensure that the modeling environment can be extended\
    \ to include modern AI and machine learning models.\n\n*   Improve process efficiency:\
    \ \n\n    *   Accelerate model implementation through a more simplified model\
    \ deployment mechanism for adjustment and recalibration. \n\n        *   Automate\
    \ manual processes and the documentation of adjustments and overrides of analytic-derived\
    \ outcomes.\n\n*   Increase collaboration. \n\n    *   Centrally orchestrate the\
    \ entire climate risk management process.\n\n    *   Ensure consistency processes\
    \ across the enterprise.\n\n    *   Ensure climate risk forms part of the enterprise\
    \ risk governance framework and is integrated with existing risk systems.\n\n\
    ## PRACTICAL EXAMPLES\n\nAI and machine learning are very effective at modeling\
    \ complex relationships at scale and that is exactly what is required in terms\
    \ of climate risk. The broad set of applications of AI and machine learning makes\
    \ it particularly effective as a tool in the fight against climate change. Included\
    \ in this section are a few tangible examples where AI and machine learning are\
    \ effectively employed to assist climate risk management.\n\nWith the increased\
    \ adoption of cloud-based computing, an example of that is a cloud computing providers,\
    \ namely Google, who initiated the development of a machine learning application,\
    \ called Deepmind, to improve energy efficiency in the cooling of their data centers.\
    \ The Deepmind project employs ensembles of neural networks to predict energy\
    \ efficiency. The models capture the dynamic interactions between the temperature\
    \ observed from sensors, power pump speeds, and other parameters within their\
    \ data centers. The project led to a significant reduction in energy consumption\
    \ of 40%.\n\nAnother example is in the increased risk of flooding. The increased\
    \ risk of flooding is a major physical risk due the increased risk of natural\
    \ disasters. Physical hazards, such as flooding, have potential to impact not\
    \ only the collateral values associated with banks' exposures, but also the cost\
    \ of capital and affordability of insurance. It can have a knock-on impact on\
    \ businesses, supply chains, and the long-term creditworthiness of a region. Recently,\
    \ an American town planner employed AI and machine learning on a smart city project\
    \ to better protect residents from river flooding. By installing sensors and rain\
    \ gauges to monitor water levels in real-time and using that data and analytics\
    \ to predict flood risk, residents can be warned proactively and traffic is rerouted.\
    \ In this case, the use of AI and real-time data mitigates the socioeconomic impacts\
    \ of the increased risk of flooding.\n\n### Climate Risk Management Solution\n\
    \nRecognizing the need for an enterprise climate risk solution, a Tier 1 bank\
    \ in Asia Pacific extended their stress testing solution to quantify the impacts\
    \ of climate risk following a bottom-up analytical approach. They employed scenario\
    \ analysis with supporting internal and external reports. A climate risk model\
    \ assesses the impacts of each industry or subindustry's decline in asset values\
    \ and quantifies the climate risk at exposure level. It links the bank's portfolio\
    \ strategy with its finance and auditing processes for business planning and policy\
    \ decision-making.\n\n### Environmental, Social, and Governance Application in\
    \ APAC-Based Financial Companies\n\nFor financial institutions, assessing the\
    \ carbon emissions of counterparties presents practical challenges in data collection.\
    \ In this case, the firm employed AI and machine learning to upload and process\
    \ sustainability reports and counterparty information on a cloud-based platform.\
    \ Geo-location data, scenario, and other risk data from third-party providers\
    \ are uploaded through APIs. By modeling the real estate data, disaster prediction\
    \ data, and financial data of the counterparty, the degree of financial impact\
    \ and the impact on collateral value are projected. The information is then used\
    \ to assess the impacts of climate risk on the counterparty's balance sheet and\
    \ P&L.\n\n### Sustainability Investment Screening\n\nAn analytics company in the\
    \ Nordics created a sustainability investment screening solution to help their\
    \ clients. By utilizing its web interface, financial investors can select companies\
    \ that are more sustainable than others. The solution performs investment screening\
    \ and monitoring based on the use of unstructured data, machine learning algorithms,\
    \ and an intelligent triage process."
