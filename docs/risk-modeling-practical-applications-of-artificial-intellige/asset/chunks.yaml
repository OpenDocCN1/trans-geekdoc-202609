- raw: "Many measures have been developed in different areas, such as finance, insurance,\
    \ and healthcare, to identify bias in data and to assess the fairness of model\
    \ outcomes. For risk management, it is recommended that bias and fairness measures\
    \ are embedded as controls throughout the lifecycle of the customer and across\
    \ the risk model lifecycle ([Figure 5.1](#c05.xhtml#c05-fig-0001)). It is important\
    \ to understand the limitations of fairness metrics: the measures to detect bias\
    \ and fairness cannot guarantee the presence or absence of bias and fairness or\
    \ expunge the fact that fairness concerns can appear later due to other exogenous\
    \ factors, such as changes to data. Next, we will explain some of the methods\
    \ and measures that can be used to detect and remediate bias by signaling for\
    \ human intervention to correct bias and fairness issues.\n\nAt the time of writing,\
    \ the development of fairness metrics is maturing, including metrics for AI and\
    \ machine learning.\n\nFollowing are examples of common approaches and metrics\
    \ used to detect bias and fairness:\n\n1.  **Demographic parity.** This is where\
    \ each segment of a demographic variable, or “protected class,” is assessed to\
    \ receive the same positive outcome at an equal rate.\n\n2.  **Equal opportunity.**\
    \ The metric validates that the true positive rate between segments is the same.\
    \ By extension, it also measures that an equal true negative rate is observed\
    \ across segments.\n\n3.  **False positive rate balance.** It measures that the\
    \ false positive rates (and by virtue, the true negative rates) between segments\
    \ are equal. An example is loan applicants, where the rate balance ensures a representative\
    \ fraction of each segment that is predicted to default on their loan.\n\n4. \
    \ **Equalized odds or average odds.** This assumes that the true positive rates\
    \ between segments and the false positive rates between segments are equal (equivalently,\
    \ equal true negative rates and equal false negative rates).\n\n5.  **Positive\
    \ predictive parity.** Here, the positive predictive value between segments is\
    \ equal (i.e., each segment has the same false negative predictive rates). This\
    \ is achieved by comparing the fraction of true positives to the fraction of predicted\
    \ positives in each segment.\n\n6.  **False omission rate balance.** The false\
    \ omission rates between segments are equal (i.e., the segments have equal negative\
    \ predictive value). The rate compares the fraction of false negatives to the\
    \ fraction of rejections/negative benefit.\n\n7.  **Feature attribution analysis.**\
    \ Utilize feature attribution analysis to find drivers that affect decisions,\
    \ for example, to ensure that factors are not correlated with protected variables.\n\
    \n8.  **Sensitivity analysis.** Perturbations are used to assess sensitivity to\
    \ changes in demographics.\n\n9.  **Correlation analysis.** When there are variables\
    \ that are correlated with sensitive variables such as age, sex, or family status,\
    \ it can lead to unfair outcomes.\n\n10.  **Cross referencing.** Utilize outcome\
    \ analysis and cross-referencing to assess model accuracy across protected and\
    \ nonprotected groups. An unfair individual decision may be observable in a particular\
    \ demographic segment but is not measurable when the entire population is considered.\n\
    \n11.  **Triangulation.** This is where a situation is explored in depth using\
    \ more than two sources to validate findings. There are other types of triangulations:\
    \ \n\n     *   *Methodology:* using more than one method to gather data points\
    \ and where more than one measure is used.\n\n     *   *Data:* involving varying\
    \ dimensions such as time, space, and person.\n\n     *   *Investigator:* where\
    \ more than one person is involved.\n\n12.  **Counterfactual analysis.** To assess\
    \ fairness at the individual level, in counterfactual analysis, to evaluate the\
    \ change in outcome, the causal attributes of the same record is compared with\
    \ an adjusted version of the record.\n\nAs mentioned previously, a good starting\
    \ point is to assess for bias and fairness by comparing the prediction and performance\
    \ made by a model for different values of protected or “sensitive” variables ([Figure\
    \ 5.2](#c05.xhtml#c05-fig-0002)). Examples of sensitive variables are those that\
    \ are demographic in nature, including variables such as age, gender, race, religion,\
    \ family status, marital status, and ethnicity.\n\n### Using AI and Machine Learning\
    \ to Detect and Remediate Bias: A Word of Caution\n\nIn some cases, the use of\
    \ AI and machine learning can help detect and remediate bias automatically. Similar\
    \ to other AI and machine learning use cases, to assess fair lending risk may\
    \ pose the same challenges of explainability (understanding the reason for a prediction\
    \ estimate). One of the challenges to confirming AI-based models is that some\
    \ traditional model validation approaches or metrics are not readily applicable.\
    \ The drivers behind the decisions cannot be easily found or separated from other\
    \ variables due to the additional complexity of the input data and algorithms.\n\
    \n ![Figure 5.2 Disparity analyses assess model performance across classes of\
    \ protected characteristics (in this case, gender and age).](images/c05f002.png)\n\
    \n[**Figure 5.2**](#c05.xhtml#R_c05-fig-0002) Disparity analyses assess model\
    \ performance across classes of protected characteristics (in this case, gender\
    \ and age).\n\nAnother challenge is to understand why the AI and machine learning\
    \ identified a high risk of bias given its inherent inability to justify the inclusion\
    \ of model variables, compared to a traditional, statistical model where the variables\
    \ and signs of parameters are known.\n\nThe AI system itself may be subject to\
    \ protected variables implicitly or indirectly. In this case, standard techniques\
    \ to determine correlations in the model can be applied. In addition, explainability\
    \ metrics can be used to explain the main drivers behind decisions. Model sensitivity\
    \ analysis, benchmarking, and trade-off analysis are other popular methods that\
    \ are often used by financial institutions to test and confirm models.\n\nIn summary,\
    \ AI approaches will still need to follow existing consumer protection and regulatory\
    \ frameworks (including Regulation B and the ECOA). Like any other type of model,\
    \ AI models can be flawed and are also subject to bias, which impacts model predictability.\
    \ Bias can be caused by either data or algorithms that cause the model to be insufficiently\
    \ or incorrectly trained. When the sample data used to train the models does not\
    \ sufficiently represent the population, the model that will be applied to over-\
    \ or underrepresenting minority groups will have higher risk of unfair treatment.\
    \ If the AI is biased, that bias will be perpetuated and potentially be amplified\
    \ through automated decision-making.\n\nA benefit of automation is that if the\
    \ bias is properly addressed, automated decision-making has the potential to be\
    \ more consistent and traceable than human decision-making. In areas with strict\
    \ requirements for explainability, model governance frameworks should be extended\
    \ with the specifics for AI and machine learning.\n\nModel risks associated with\
    \ AI-based modeling approaches can be more pronounced as complex algorithms and\
    \ input data are usually involved in the modeling process. Complex transformations\
    \ or interdependence of model variables can make it more challenging to uncover\
    \ hidden patterns that may potentially violate fair lending laws. Thus, it is\
    \ more important for institutions to ensure model risk management principles and\
    \ governance are enforced when developing AI and machine learning.\n\nThese principles\
    \ aid the evaluation of AI-based approaches as many organizations have in place\
    \ model risk and data governance systems.\n\nFinancial institutions must prove\
    \ their understanding of the model inaccuracies and potential for unintended consequences\
    \ (i.e., risk of noncompliance with fair lending laws)."
