  trans: '

    该银行利用这一机会实现了技术现代化，同时也改进了其流程。它分析了模型构建过程中的每一个步骤，并识别了瓶颈及其产生。这使得银行能够改进流程，例如将模型数据集创建的时间从几个月缩短到几天。这传达了一个重要的教训——仅仅购买新技术而不解决现有的基础设施、人员或流程问题，是无法取得巨大成效的。


    `Machine Learning Factory` 将模型开发和部署时间从 12 个月以上大幅缩短到不到一天。目标市场能够以更细粒度的级别进行分割，从而产生更优且预测结果更准确的模型。更快、更高效的模型生命周期允许开发和部署更多模型，使管理下的模型数量增加了五倍。这是通过改进模型流水线设计实现的，使得某些机器学习算法能够动态更新，并持续开发“挑战模型”用以竞争生产环境中的“冠军模型”。当挑战模型被认为性能更优时，它会自动部署到生产环境中。


    这导致了贷款质量的提高，并避免了数百万美元的信贷损失。新贷款也可以更轻松地发放，使得银行的投资组合能够在多个市场中扩张。


    ## 亚太地区的一一级金融机构


    亚太地区的许多金融机构正积极地在非监管环境中使用机器学习。一个有趣的应用是检测指示欺诈情况的复杂交易。在某些情况下，银行依赖于专攻 AI 的金融科技公司来构建这些模型。但随着获取平台以及
    AI 和机器学习无代码/低代码接口变得越来越容易，越来越多的机构正在自己开发这些模型。


    信贷申请欺诈的发生占人口的比例极小，不足 1%。然而，其造成的损失通常是严重的。亚太地区一家一级商业银行的一大主要担忧是，尽管欺诈案件数量很少，但绝大多数案件绕过了银行现有的欺诈规则。这是一个复杂的问题。银行付出了最大努力，包括人工干预和联系申请人，但仍有一些事件溜过了信贷和欺诈检查流程。


    为了检测欺诈行为，银行根据已批准申请的实际历史数据，使用 `gradient boosting machine`（`GBM`）构建了预测模型。这种技术使用数千棵决策树和数百个变量作为基础生成弱预测模型，并通过评分将它们集成为最终的预测结果。


    尽管 `GBM` 模型非常擅长检测可疑行为，但银行面临的障碍是当前的基础不够稳健，无法支持如 `GBMs` 等高级机器学习模型的部署和实施。最终，`GBM`
    的复杂性不得不完全简化为 `linear model`（线性模型），这意味着预测能力有所降低。这个故事说明了机器学习在改进预测方面的巨大潜力——但它提醒我们，在将资金和时间形式的资源投入机器学习项目之前，必须解决基础设施能力的问题。


    ## 理赔处理的流程自动化


    一些机构已开始使用 AI 和机器学习来开发基于 AI 的行为模型，这些模型可以支持其他应用程序以改善客户体验。其中一个模型是利用十余年的保险数据开发的，旨在寻找提问组与最具利润的
    20–40 个客户细分之间之间的隐藏路径。基于模型的见解，此前用于确定病史的 30 多个问题减少到了 7 个用于确认或否认覆盖范围的关键问题。该模型提供的预测性承保能力提供了更快、更简单且更准确的保险结果，极大提升了客户体验。


    其他 AI 和机器学习模型也被开发用于识别排除某些医疗保险客户的关键原因，例如具有特定类型残疾的人员，以及被排除的人群在未来某个时间提出理赔的可能性是否更高。同样，这通过减少做出保险决策所需的时间、成本和文书工作，有助于更高效的承保流程。


    该项目开发的所有模型的一个共同条件是必须具有透明性，这意味着所有的输入和输出决策都可以被轻松解释。在金融机构中，避免“黑箱”模型而选择易于解释的模型是一个常见需求。因此，可解释
    AI 是任何开发项目的关键考虑因素，并在第 4 章中进行了更详细的讨论。


    ## 应对新冠肺炎风暴


    与全球许多金融机构一样，亚太地区的一级商业银行在新冠肺炎期间为符合条件的小企业客户提供了还款假期。由于无法使用系统和流程衡量客户的违约风险，由于参考还款期，付款似乎是及时的，这给银行带来了风险。如果在还款假期期间损失收入，当前的行为模型无法准确反映这些事件，因为这些模型并非旨在预测短期和临时事件，例如由于大范围停产导致的收入损失。


    突然，银行需要评估这将如何影响客户还款，为此他们转向了机器学习。银行使用了 COVID-19 疫情爆发前的数据，使用了 3 个月的历史数据，而不是遗留行为模型所使用的
    12 个月性能窗口。3 个月的较短历史期意味着需要推导出受 COVID-19 影响巨大的短期变量，而不是使用当前模型的长期驱动因素。对于短期变量，建模人员通过对客户交易数据进行高级特征工程推导出了这些变量，以确保现金流的近期变化能被算法检测和建模。重要的是，基于交易数据的特征工程使用了受
    COVID-19 影响巨大的收入和支出变量。模型中使用的其他变量包括时点比率、客户群体层面的早期违约，以及与变化速度相关的驱动因素，如利用率、可支配收入、特定业务的风险驱动因素和自雇标记。银行观察到，深度较小且树数
    `<100` 的 `GBM` 能够更好地预测哪些客户可能遭受收入突然损失事件，并并在 COVID-19 假期还款计划结束后可能发生违约。


    ## 复杂风险计算的近似


    与其他复杂的风险计算一样，预期信贷损失计算通常作为批处理后台过程运行。会对一系列场景计算前瞻性的边缘损失，将其折现为现值，并根据场景概率进行加权。如果违约概率自发放以来显著增加，则该贷款被识别为
    `stage 2` 并确认其寿命损失。如果没有，则将 12 个月的损失作为预期信贷损失准备金。

    '
