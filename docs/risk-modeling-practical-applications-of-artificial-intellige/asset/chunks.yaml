    ### 梯度提升机

    参数分为树特定参数、提升参数和杂项参数。


    * 树特定参数：分裂事件所需的最小样本数、终端叶子节点所需的最小样本数、终端叶子节点占总样本数的比例（基于权重）以及最大叶子数。


    * L1 正则化

    * L2 正则化

    * 学习率

    * 最大深度

    * 最小叶子大小

    * 区间箱数量

    * 每次分裂的输入数量

    * 树的数量

    * 采样率


    * 提升参数是建模的序列树数量。

    * 杂项参数：用于最小化每次分裂的损失函数；当使用其他模型的输出作为 GBM（梯度提升机）的初始估计时所需的输出初始化；用于设置种子的随机样本数（允许固定该数量，但这种固定仍允许随机样本设置种子）；允许在模型拟合时生成不同输出值的详细模式（verbose）；允许在模型之前的拟合基础上拟合额外树的热启动（warm
    start）；以及自动选择数据进行预排序以减少分裂时间的预排序（presort）。


    ### 神经网络

    * 参数包括激活函数（一种如 `tanh(x)` 之类的数学变换）、类似于线性模型中截距的偏置（Bias），以及隐藏层或输出层中神经元连接的权重。

    * 其他参数取决于所使用的激活函数类型——例如非线性参数 ReLU 激活函数对于负值的斜率参数。


    * 隐藏层数量

    * 每个隐藏层中的神经元数量

    * L1 权重衰减

    * L2 权重衰减

    * 学习率

    * 退火率


    ### 支持向量机

    三类参数为：


    * 正则化，决定了根据误分类点惩罚的程度

    * 包含在核函数中的参数，例如核类型（线性、径向基函数、多项式或 sigmoid）以及每个核函数的核系数

    * £-不敏感值，定义了对错误不进行惩罚的容忍边际


    * 惩罚

    * 多项式次数


    ### 贝叶斯网络

    参数取决于网络的复杂度。这种复杂性基于 `n` 个变量上的概率分布——即代表变量之间关系的每个组合状态的概率。


    参数为：


    * 预筛选预测变量——指定是否使用目标与每个输入变量之间的独立性检验来预筛选变量。

    * 使用变量选择——指定是否根据网络使用目标与每个输入变量之间的条件独立性检验来选择变量。

    * 独立性检验统计量——用于独立性检验显著性水平的统计量，通过使用独立性检验显著性水平的值指定独立性检验的显著性水平（p 值）。


    * 网络结构

    * 最大父节点

    * 父节点方法

    * 箱的数量


    调优超参数值是模型训练过程的一个关键方面。寻找超参数理想值（针对特定数据集对模型进行调优）的方法是人工的，因此非常耗时。为了设置这些值提供指导，风险模型师通常依赖他们使用机器学习的经验。然而，即使对机器学习及其超参数有专业知识，这些超参数的最佳设置也会随着不同数据而发生显著变化；很难根据以往经验来规定超参数值。能够以更具引导和自动化的方式探索替代配置，有助于减少对人工操作的需求。以下是用于自动超参数调优的常用方法：


    * **网格搜索。** 将感兴趣的每个超参数离散化为一组期望值。对所有值的组合进行模型训练和评估。为了设置这些值提供指导，风险模型师通常依赖他们使用机器学习的经验。然而，即使对机器学习及其超参数有专业知识，这些超参数的最佳设置也会随着不同数据而发生显著变化；很难根据以往经验来规定超参数值。能够以更具引导和自动化的方式探索替代配置，有助于减少对人工操作的需求。例如，对于
    9 个超参数并假设相同的水平（3），网格可能会产生 19,683 种组合。


    * **随机搜索。** 通过超参数的随机组合训练并评估候选模型。在随机搜索中，超参数的分布被均匀定义或通过采样方法定义。随机搜索运行得比穷举网格搜索更快，因为选择了随机样本。需要注意的是，在随机搜索中，不会从之前尝试过的参数值或组合中学习。这意味着在单个值的选择上存在“运气”成分。


    * **Latin 超立方采样。** 该方法遵循一种实验设计，其中样本在每个超参数上是精确均匀的，但在组合上是随机的。这种方法比纯随机搜索更具结构化，允许对每个超参数进行更均匀的采样，即使没有发现最佳组合，也有助于识别超参数的重要性。


    * **优化。** 在这里，搜索是基于最小化模型验证误差的目标，因此从算法的角度来看，每次“评估”都是模型训练和验证的一个完整周期。这些方法旨在利用较少的评估次数，从而节省计算时间。需要注意的是，在用于超参数搜索的优化中，会发生“学习”。这种学习发生在之前尝试过的配置上，它们会影响新配置的选择，同时最小化损失函数。权衡是并行评估的配置较少。理论上，如果有足够的机器，网格或随机配置可以并行评估，但使用优化时，并行化是限制的，因为迭代是必要的。


    * **局部搜索。** 类似于“无导优化”，这指的是一类调优算法，可以独立应用许多不同的个体算法。局部搜索优化的一种非标准实现方式是分布式环境的混合框架，它可以帮助克服超参数优化的挑战和成本。


    ## 风险模型的其他优化算法


    针对特定的机器学习模型存在优化算法，包括逻辑回归和神经网络的算法。在本节中，我们列出了这些算法。


    #### 逻辑回归


    以下技术均用于逻辑回归算法中可能遇到的非线性优化，其中需要重复计算优化标准、梯度向量（一阶偏导数）以及海森矩阵的部分（二阶偏导数）。


    '
