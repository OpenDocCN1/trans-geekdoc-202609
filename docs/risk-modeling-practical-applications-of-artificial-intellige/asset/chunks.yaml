  trans: '

    此外，斐波那契在 13 世纪访问位于阿尔及利亚某处港口的父亲时，从交易者那里学习了印度-阿拉伯数字系统。数学、贸易和金融领域的创新似乎是密不可分的——但这也许是另一本书的主题。风险模型的使用很可能可以追溯到我们现在认为的保险精算科学的前身。在
    18 世纪，这些前现代的分析师通过研究数据来估算预期寿命，以此为保险费定价。


    回到现代；基于大卫·休姆（David Hume）和尼古拉斯·伯努努利（Nicholas Bernoulli）等人的工作，哈里·马科维茨（Harry Markowitz）在
    1952 年开发了投资组合理论。今天，我们可以将模型定义为定量方法、系统或方案，它应用统计、经济、金融或数学理论、技术和假设，将输入数据处理为定量估计。


    风险模型在金融服务中无处不在。原因之一是全球金融危机前后大量的新规。在过去的十年中，层出新监管扩大了机构需要管理的模型数量。此外，机构增加了模型的使用量以保持竞争力——用分析方法取代人工活动和决策，同时提高了模型的复杂性。模型还被用于跟上大数据和数字化等行业趋势。


    全球金融危机的影响不仅增加了管理的模型数量，还增加了它们的复杂性。机构开始添加不同类型的模型——包括计量经济模型、用于拨备的金融和前瞻性模型，以及企业压力测试。这导致模型之间、其运行方式以及定义它的过程（即风险模型生命周期）之间的依赖关系和相互连接日益增加。


    随着 COVID19 疫情凸显了风险模型生命周期的低效率，新模型开始获得更多的关注。这些问题在新冠 19 疫情期间在前瞻性损失模型中观察到的波动中尤为明显。金融机构意识到，风险模型需要在有效性与由于新冠
    19 疫情导致的潜在长期恶化状况以及增加的宏观经济不确定性之间取得平衡。长期状况和增加的不确定性可能会继续对许多不同类型的风险模型产生“冲击”。在写作此时，许多大型银行加速了重新校准工作，包括使用替代数据和建模方法，原因在于：


    * 消费者和投资组合行为的变化导致风险排名和风险剖析差异

    * 由于与宏观经济指标的相关性变化导致风险模型直接失效


    在风险管理中使用人工智能和基于机器学习的算法需要对风险模型生命周期进行重新思考。通常，一个传统的统计模型需要风险建模团队投入几个月的开发工作。可能会认为，需要漫长的过程来确保所需的准确性、性能和验证水平，但经验表明，大量的精力浪费在了由于风险模型生命周期中碎片化、遗留系统导致的低效上。例如，根植于业务活动孤岛的僵化流程可能会延迟审批，并且可能存在一种支持在每个模型开发活动中都“重造轮子”心态的文化。


    新冠 19 的一个教训是，基于风险的决策的构建和部署模型周期过长会导致次优决策。使用人工智能和机器学习提供了一个极大缩短“建模时间”并获得相应回报的机会。


    ## 风险建模中人工智能和机器学习的使用


    作为一套工具，人工智能和机器学习具有变革性潜力，与传统模型相比，可以提高准确性，处理大型结构化和非结构化数据集，并帮助机构对市场状况的变化敏捷响应。这套工具已有效用于解决问题，并且随着大数据技术和数字化的快速采用，其应用可能会进一步加速。


    在金融服务领域，人工智能和机器学习的使用在新冠 19 爆发前几年就开始了，并涵盖了金融服务的多个领域，包括风险管理。对于风险职能，人工智能和机器学习通过自动化枯燥任务和处理大量多样化数据，带来了切实的益处。这些工具可以灵活地识别数据中隐藏的复杂关系，从而与传统统计方法相比，实现更高水平的模型准确性。然而，为了大规模和长期地使用人工智能和机器学习，需要将科学思维更地植根于文化中以及企业各团队创新的方式中。


    在将科学思维应用于人工智能和机器学习时，技术通常用于解决特定问题，而不是试图利用该技术来顺带解决现有问题。一旦确定了问题，就可以利用涉及数据、人员和流程的科学基础对假设进行适当测试。接下来我们将解释传统的风险管理职能如何应对新的和新兴风险发生改变，以及人工智能和机器学习如何能够更轻松地应对这些产生的需求。


    ## 新的风险管理职能


    风险管理不仅是合规措施的集合，更是满足内外部治理机构持续需求和期望的功能。目前的风险管理框架正在适应新的和新兴风险、宏观经济环境不确定性的增加，并解决金融决策中的透明度和公平性问题——特别是涉及客户和影响环境的问题。新兴风险、数字化、更激烈的竞争和新规对现代风险职能提出了更高要求，特别是在新冠
    19 和气候变化的背景下。


    在写作此时，一种名为严重急性呼吸道病毒冠病毒（SARS-CoV-2）的微小单链 RNA 导致了新冠肺炎（COVID-19）和潜在的危及呼吸道感染，它已迅速扩散成为全球大流行。


    由于抑制措施导致的剧烈波动，幸运地得到了财政政策的应对，包括对借款人的短期援助以及各国政府和中央银行引入的其他计划。无论抑制措施的程度如何，银行资产负债表中建立的韧性——由于全球金融危机后加强监管的结果的大额资本缓冲区依然存在。


    谁能想到一根微小的 RNA 链可以在短短几个月内引发如此宏观经济动荡？许多企业不得不适应新定义的“常态”。


    尽管疫情的影响迅速且严重，但恢复也同样迅速，因为各国和地区走出新冠限制，数万亿美元的刺激措施提振了经济。


    疫情高峰期的宏观经济影响对机构的风险和盈利水平产生了强烈的负面影响，并要求政府进行快速干预。例如，对于金融服务而言，众，风险与盈利已知与宏观经济影响密切相互作用（根据信用周期或利率周期）。此外，金融服务在稳定企业业务运营所需的市场方面发挥着必要且重要的作用。

