    Phrase and Fable* (2006), [https://www.oxfordreference.com/view/10.1093/oi/authority.20110803095426960](https://www.oxfordreference.com/view/10.1093/oi/authority.20110803095426960)

    2. [2](#c01.xhtml#R_c01-note-0002). The European Commission''s High Level Expert
    Group on Artificial Intelligence, *A Definition of AI: Main Capabilities and Disciplines*
    (European Commission, 2018).

    3. [3](#c01.xhtml#R_c01-note-0003). Office of the Comptroller of the Currency,
    *Comptroller''s Handbook: Safety and Soundness. Model Risk Version 1* (Federal
