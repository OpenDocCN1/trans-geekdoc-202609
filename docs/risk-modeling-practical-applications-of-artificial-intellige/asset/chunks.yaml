    - An adversary will introduce data to the model that violates the mentioned statistical
    assumption to diminish model accuracy or lead to undesirable outcomes.


    Several defenses can be applied, such as detection methods including `Shapley
    values` that are computed at the internal layers of a deep neural network. These
    can discriminate between normal and adversarial inputs. Another option is to train
    a model on data that includes adversarial examples so that the model is more robust
    to this form of attack.


    ## 11. Attribution analysis


    The outcomes of two different scenarios of the machine learning are compared (for
    example, a change in inputs or logic) or data from two different time periods.
    This allows for an understanding of the drivers behind differences in measures
    of model performance. In other words, it allows modelers to better understand
    how changes to model inputs have impacted model performance or predictions made
    by the model. For example, comparing a development sample with the first three
    months of pre-production data prior to the model being fully productionized.


    ## LIMITATIONS IN POPULAR METHODS


    Several authors and industry bodies highlighted the limitations of post-hoc explainability
    diagnostics.


    A limitation of post-hoc explanations is that it only partially interprets the
    model and may therefore be misleading. In other instances, it relies on the accuracy
    of the underlying surrogate model.


    One way to think about post-hoc explainability techniques is by looking at your
    friends'' vacation photos. Each picture tells a story of where they have been
    and the environment they found themselves in. One picture might be in front of
    the `Eiffel Tower` and another of a casual stroll down the `Champs-Élysées` (one
    of the most recognizable streets in the world), and another is the `Mona Lisa`.
    Can you safely and confidently infer, only by looking at the pictures, that your
    friends did indeed visit Paris?


    Similarly, post-hoc diagnostics supply different lenses looking at the same multidimensional
    object. Each diagnostic supplies a unique perspective. When the different lenses
    are combined, it is possible to achieve a better understanding of the functioning
    of the model.


    However, keep in mind that by adding another layer of complexity in the form of
    post-hoc diagnostics to an already complex model, it may further increase model
    complexity and therefore increase model risk.


    ## CONCLUDING REMARKS


    Wait, correction: ## CONCLUDING REMARKS


    Explainable AI (`XAI`) is now an established discipline and will continue to evolve.
    According to `Christoph Molnar`, explainability is the catalyst for large-scale
    adoption of AI and machine learning. As the use of AI and machine learning matures,
    so will the techniques that describe them.


    Risk models are often used for critical (and therefore highly regulated) decisions.
    It is therefore important that a range of stakeholders, from risk managers to
    senior management to external regulators, can trust the model and its outputs.


    Looking ahead, the ability to explain various aspects of a model to a range of
    stakeholders will extend beyond the use of post-hoc diagnostics, to using natural
    language interpretation, as well as visualization—to explain the model in nontechnical
    terms, to models that explain and self-document themselves.


