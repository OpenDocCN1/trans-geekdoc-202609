    # Data Management and Preparation


    Data has become a vital resource for organizations, entities, and governments
    alike. Since its inception as a scientific discipline, data management has always
    been underpinned by. A critical lesson learned from the Global Financial Crisis
    was that banks'' information technology (IT) and data architectures were inadequate
    to support. This had severe consequences for the banks themselves and the stability
    of the financial system. In response, the Basel Committee on Banking Standards
    (BCBS) developed a standard with principles for effective risk under number 239.


    In recent years, digitalization and the digital footprints left by consumers and
    businesses have caused a rapid growth in data available for analysis. Today, the
    risk function is operating in a world with increasing demand for better digital
    services and data-driven decision-making. Other initiatives like open banking
    (or consent-based data exchange), the availability of a plethora of proprietary
    and open-source tools, and cloud computing have a significant impact on value
    creation in financial services. With the growth of these initiatives and the mainstream
    use of advanced analytics and machine learning, these innovations require strong
    data foundations.


    Notwithstanding the benefits of having more data, it also presents an increased
    number of challenges, including access to good-quality data, cybersecurity, and
    the responsible use of personal data. Robust data management is critical for the
    adoption of artificial intelligence (AI) and machine learning as the modeling
    approaches become much more data driven.


    The term big data refers to data that is so large, fast, or complex that it is
    difficult or impossible to process using traditional methods.


    The concept of big data gained momentum when industry analyst Doug Laney articulated
    its definition using three *V*s:


    - **Volume**: Organizations collect data from a variety of sources, including
    business transactions, third-party data providers, news articles, and more. In
    the past, storing it would have been a problem, but more economical storage on
    cloud-based platforms and data lakes has eased the burden.

    - **Velocity**: With the growth in real-time data, data streams into businesses
    at an ever-increasing speed and must be handled in a timely manner.

    - **Variety**: Using larger data means that diverse types of data must be leveraged
    that is not necessarily structured as dimensional tables. Unstructured data sources
    such as sensor data, images, and social media updates add to the variety of data.

