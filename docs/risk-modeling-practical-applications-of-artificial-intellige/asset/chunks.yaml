    When the bias stays undetected, it may be systematized and amplified by automated
    decision systems.


    In risk models—including those leveraging AI and machine learning—bias may stem
    from the training data. Such issues may arise from historical biases as well as
    the ways in which the data is sampled, collected, and processed. This means that
    the training data is not representing the population to which the model will be
    applied, leading to unfair decisions. Bias can also be created during the model
    design phase. That can create measurable differences in the way a model performs
    in definable subpopulations based on a profile. For example, the profile can be
    based on the variables included or approximated in model construction like age,
    gender, race, ethnicity, and religion. An example is the historical racial bias
    that has been captured by credit bureau scores. Although the scores are not capturing
    race directly, they have been developed on historical data that includes payment
    history, amounts owed, length of credit history, new credit, and credit mix information.
    These variables are themselves influenced by the generational wealth that African
    American and Hispanic borrowers did not have equal access to. This bias will continue
    to produce lower credit scores and lower ability to access credit for these groups.


    ## What is Fairness?


    Fairness is considered a moral primitive and is by nature judgmental. Given its
    qualitative character, it is more challenging to define fairness comprehensively
    and globally across applications. Distinct cultures will have different definitions
    of what constitutes a fair decision. The philosophy of fairness is outside the
    scope of the book; however, when it comes to the technological approaches to incorporate
    fairness checks in AI systems, in recent years, system integrators and software
    providers have started to package fairness detection and remediation techniques.


    Most societies uphold values of equality and equity. In the USA, fair lending
    laws, such as `Regulation B` and the `Equal Credit Opportunity Act (ECOA)`, protect
    consumers from discrimination in lending decisions. The statute makes it unlawful
    for any creditor to discriminate against any applicant with respect to any aspect
    of a credit transaction based on race, color, religion, national origin, sex,
    marital status, or age.


    Any adverse action for credit needs to be supported by evidence to prove the decision
    is not based on a prohibited characteristic. The Consumer Financial Protection
    Bureau has recently published a report with guidelines on the use of AI-based
    lending decisions.


    In the context of algorithmic models, the widespread practice is to associate
    fairness with equitable decisions and parity in the distribution of benefits across
    demographic segments.


    ### Kusner, Russell, and Silva


    Kusner et al. go further in defining a second level of fairness when an algorithm
    gives similar predictions to similar consumers. In addition, a third level of
    fairness is seen when the algorithm supplies equality of opportunity and similarity
    across demographics. Finally, a fourth level of fairness is observed when an algorithm
    is counterfactually fair—that is, fair in the actual dimension, as well as in
    the counterfactual dimension.


    A problem with fairness is that when fairness expectations are translated into
    quantifiable terms, these terms are not mutually exclusive. A recidivism example
    highlighted the nonexclusivity of fairness metrics.


    ## Types of Bias in Decision-Making


    Bias may stem from multiple sources. Let us differentiate between cognitive and
    statistical biases.


    ### In the early 1970s, Amos Tversky and Daniel Kahneman


    When putting in place a governance framework for AI and machine learning, it is
    helpful to first consider the types of cognitive bias to be aware of, and the
    controls that can safeguard against these.


    A few of the cognitive biases are:


    *   `Overconfidence` results from a false sense of control, optimism, and the
    desirability effect: an AI system will make fair predictions because we want it
    to. A variant of that is the `herd mentality` (see below).

    *   `Self-serving bias` results from a human tendency to attribute good success
    to skills and bad success to unfortunate events: an AI system is correct on a
    set of data because the model is well developed, and inaccurate on another, not
    due to poor construction, but population drift or other uncontrollable reasons.

    *   `Herd mentality` is when decision-making is performed by blindly copying what
    peers are doing. In this case, the decision is influenced by heuristic simplification
    or emotion rather than independent analysis.

    *   `Loss aversion` is a tendency to experience larger regret from losing than
    satisfaction from winning.

    *   `Framing` is when a decision is made based on the way the information has
    been represented. If it was represented in another way, a different conclusion
    would be reached.

    *   `Narrative bias` is a human tendency to make sense of the world using stories.
    Information that does not fit the storyline gets ignored.

    *   `Anchoring` occurs when preexisting data is used as reference point and influences
    later decisions.

    *   `Confirmation bias` is a tendency to seek out information and data to confirm
    preexisting ideas.

    *   `Representativeness heuristic` is a false sense that if two objects are similar,
    they are correlated.


    Here are some common sources of statistical bias:


    *   `Selection bias` occurs when the data for model development is systemically
    different from the population to which the model will be applied.

    *   `Sampling bias` refers to an error caused by non-random sampling. It means
    that the data will not be representative of the population. It can occur based
    on the data collection method, confirmation bias, the selected time interval or
    changes made to the raw data.

    *   `Survivorship bias` is a variant of selection bias, the phenomenon where only
    those who “survived” a lengthy process are included in or excluded from the analysis,
    thus creating a biased sample.


    ### Current Guidance, Laws, and Regulations


    As there is, in general, a lack of legislation on fairness in AI systems, a good
    example to consider is existing consumer protection frameworks. As mentioned in
    the previous section, the `Fair Credit Reporting Act` and the `Equal Credit Opportunity
    Act (ECOA)` defined the standards for fair lending in the United States.


    The `Fair Credit Reporting Act` (Title VI of the Consumer Credit Protection Act)
    enforces the protection of consumer data and limits its use to specific purposes
    as specified by the act. It also allows for the investigation of disputed information.


    The `Equal Credit Opportunity Act` (Regulation B) promotes equal access to credit
    to creditworthy applicants and prohibits discrimination based on race, skin color,
    religion, national origin, sex, marital status, or age. It goes further to notify
    applicants of actions taken on their application, to collect information on race
    for dwelling-related loans, and to keep records of applications.


    Even though fair lending in credit decisions has been regulated in some jurisdictions
