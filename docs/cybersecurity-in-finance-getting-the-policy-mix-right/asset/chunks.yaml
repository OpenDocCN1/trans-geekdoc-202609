    # 5. 强化预防的补充政策


    ## 5.1 促进网络卫生


    ### 5.1.1 什么是网络卫生？


    对于金融机构而言，管理和缓解网络环境中的风险至关重要。实践网络卫生的主要原则是成功的网络安全组合的关键要素之一。网络卫生被定义为“一种适当保护和维护 IT
    系统及设备并实施网络安全最佳实践的手段”。为了使这些预防、检测和行动措施有效，必须是可行、可认证且负担得起的。


    ### 5.1.2 核心原则

    '
- fmt: '

    At present, the below principles could be for example emphasised. This list is
    not exhaustive and may change in the near future since underlying cyber-threats
    may change significantly in a short period of time.


    ### Principle 1. Conduct cybersecurity education and awareness activities

    The human factor is a key resource in cyber-hygiene. Therefore, the first best
    practice is the implementation of user education and awareness. Everyone from
    employees to third-party contractors needs to be able to recognise cyber-threats,
    such as malware or phishing emails, in order to successfully prevent cyberattacks.
    In this regard, compliance is not enough. Instead, cyber-hygiene demands all staff
    to look beyond the technology and keep all of their devices safe.


    ### Principle 2. Update programs regularly and patch systems

    All systems, devices and programs must be kept up to date. Security patches are
    crucial to preventing corporate systems from becoming vulnerable to attacks. Financial
    firms should upgrade their ageing digital infrastructure and apply mobile device
    security. Any critical system or program that is not patched is a meaningful security
    risk for the entire corporation.


    ### Principle 3. Create complex passwords and change them frequently

    Creating complex passwords and changing them frequently is an important aspect
    of cyber-hygiene. Passwords should be strong and kept in secure locations. The
    use of different passwords for different applications as well as their frequent
    change increases cybersecurity. In that respect, the human factor should be taken
    into consideration. Most individuals typically choose passwords with a certain
    logic, which can be detected and calculated by specific machines. To counter that
    problem, consumer awareness regarding cyber-risk and the use of complex passwords
    are essential.^(31)


    ### Principle 4. Use micro-segmentation, multifactor authentication and encryption

    Micro-segmentation, multifactor authentication and encryption of sensitive data
    are important and effective ingredients of cyber-hygiene. Micro-segmentation means
    that the corporate IT environment should be divided into several parts to make
    the entire system less vulnerable to cyberattacks. Multifactor authentication
    and encryption ensure that access to data is only granted to verified and eligible
    staff.


    ### Principle 5. Implement the least privilege principle

    Access to critical business and financial data should be based on the least privilege
    principle, which means that access to information is only provided on a ‘need
    to know’ basis. By keeping the number of employees and third-party contractors
    with data access at the necessary minimum, the risk of data breaches as well as
    the impact of a potential cyberattack can be reduced. The same principle should
    be applied to systems and programs, which should perform their tasks but nothing
    more.


    ### Principle 6. Shadow IT: deal with rotting data and connections to third-party
    financial intermediaries

    A large share of data possessed by financial firms is rotting and dark data, which
    is either partly or fully beyond the control of the corporate IT department. Therefore,
    the firms must secure their rotting and dark data. Furthermore, vulnerabilities
    can arise from connections to third-party financial intermediaries. Cyber-hygiene
    demands that organisations remain secure when they outsource activities. A layered
    approach with different measures on different levels is thus necessary to contain
    cyber-threats.


    ### Principle 7. Establish an incident response and reporting plan

    Financial organisations need to be prepared in case of cyber-incidents. This includes
    the design of appropriate cyber-response plans and mechanisms to combat cyberattacks.
    In addition, schemes need to be in place to decide about reporting and data sharing
    of cyber-incidents.


    ## 5.2 Use of certifications: A must-do?

