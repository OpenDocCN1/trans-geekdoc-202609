    # 4. NEED FOR BENCHMARK STATISTICS ON CYBER-TRENDS


    ## 4.1 Statistics on the number of incidents


    ### 4.1.1 Other policy areas have their benchmarks


    At the beginning of policy initiatives, regulators generally need accurate, consistent
    and verifiable statistics in order to analyse market dysfunctions and possible
    remedies. The consistency of statistics is necessary to conduct effective impact
    assessment of existing and future policies. As such, in most cases, for each main
    group of European policies, there is a correspondent statistical database. The
    `ECB` relies on a large set of macrodata contained notably in its Statistical
    Data Warehouse.^(26) The analysis and reports produced by the European Commission’s
    Directorate General for Economic and Financial Affairs use the `AMECO` annual
    macroeconomic database.^(27) `Eurostat` provides statistics for use in analysing
    a large sample of European and national policies: social policies (notably with
    the European Union Statistics on Income and Living Conditions, `EU-SILC`),^(28)
    labour policies (the European labour force survey),^(29) etc.


    ### 4.1.2 Cyber-criminality does not have such statistics at the moment


    As regards cyber-criminality, no benchmark for statistics could be identified.
    Task Force members in charge of cybersecurity in their respective firms confirmed
    that they use statistics produced by their own organisation or by consulting firms.
    High fragmentation in the sources used and high diversity in the values for each
    specific element were observed. What is the state of play at the moment for this
    issue? Article `7.7` of the Proposal for a Regulation of the European Commission
    on `ENISA` reads:


    > ENISA shall prepare a regular EU Cybersecurity Technical Situation Report on
    incidents and threats based on open source information, its own analysis, and
    reports shared by, among others: Member States’ `CSIRTs` (on a voluntary basis)
    or `NIS` Directive Single Points of Contact (in accordance with `NIS` Directive
    Article `14 (5)`); European Cybercrime Centre (`EC3`) at Europol, `CERT-EU`. Recital
    (26) reads: To understand better the challenges in the field of cybersecurity,
    and with a view to providing strategic long term advice to Member States and Union
    institutions, the Agency needs to analyse current and emerging risks. For that
    purpose, the Agency should, in cooperation with Member States and, as appropriate,
    with statistical bodies and others, collect relevant information and perform analyses
    of emerging technologies and provide topic-specific assessments on expected societal,
    legal, economic and regulatory impacts of technological innovations on network
    and information security, in particular cybersecurity. The Agency should furthermore
    support Member States and Union institutions, agencies and bodies in identifying
    emerging trends and preventing problems related to cybersecurity, by performing
    analyses of threats and incidents.


    `ENISA` should be in charge of providing relevant analyses on trends. However,
    no clear strategy or methodology is defined for `ENISA` to develop its own statistics
    that could be the reference for policy-makers, authorities, consumers alike. No
    indication is provided on the need to have consolidated statistics at European
    level. The risk is to continue having high fragmentation in the quoted sources
    and the value of their statistics. In the context of poor consistency across sources,
    the risk that the cyber-policies and strategies of organisations are not well-founded
    rises.


    ### 4.1.3 Incident reporting: Statistical parallel with offline criminality


    What is the solution? Criminality is a specific case. Given its illegal nature,
    only part of it can be properly measured. A statistical parallel could be drawn
    with offline criminality. Different types of offline criminality are measured
    by robust macro statistics: intentional homicide, assault, robbery, kidnapping,
    theft, burglary, drug offences, etc.^(30) The main statistical bias concerns offences
    that are not recorded by police. The share of unrecorded offences can vary across
    countries and its level is hard to assess. But, overall, macro statistics on recorded
    offences are extensively used by authorities to implement, justify and enforce
    specific policies. Granular data can often be found, notably by administrative
    entity: at district, city, region, country or European level. Statistically speaking,
    the record of offences could be perceived somehow as a process of “incident reporting”.
    By following a similar logic for cyber-criminality, it seems that if a centralised
    hub is developed for incident reporting, robust and relevant macro statistics
    could be developed at national and European level. The creation of robust macro
    statistics could be achieved only if certain conditions have been met.


    ### 4.1.4 Conditions for compiling robust macro statistics

