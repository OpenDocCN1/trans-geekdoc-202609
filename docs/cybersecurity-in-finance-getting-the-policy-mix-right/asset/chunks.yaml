- fmt: '

    The European economy increasingly depends on the frictionless use of ICT products
    and services. In recent years, these digital technologies have become more complex
    and more diverse, while at the same time the threat level of the cybersphere has
    increased. Firms and consumers using ICT products often do not have the knowledge
    to fully understand the cybersecurity dimension of the new technologies they use.
    Therefore, information asymmetries persist between software providers and software
    users, which could be detrimental to the effective functioning of the single market.


    In order to limit the negative effects of this information asymmetry, some EU
    member states have put in place national cybersecurity certification schemes.
    These schemes attest that certified ICT products and services fulfil the most
    important cybersecurity standards. Table 4 presents national certification schemes
    that operate in the European Union. One of the main issues with current national
    cybersecurity certification schemes is their high fragmentation and lack of mutual
    recognition by other member states, except for countries participating in the
    `SOG-IS MRA` framework. In addition, almost half of EU member states do not have
    a national cybersecurity certification scheme in place.


    ![Image](Images/9.png)


    Against this background, the European Commission announced in September 2017 its
    regulatory proposal for a European Cybersecurity Certification Scheme, as one
    of the core initiatives of the Cybersecurity Package. The Certification Scheme
    is expected to define common standards, procedures and technical requirements.
    While remaining voluntary, it would benefit from recognition by all member states,
    thereby addressing the issue of fragmentation. The Commission’s plan for the new
    scheme is to be operated by a new EU Cybersecurity Agency, for which `ENISA` shall
    be revised and equipped with a permanent mandate as well as more financial and
    human resources. Aside from harmonisation, the core objective is to strengthen
    Europe’s cyber-resilience capabilities.^(32) Yet there remain important challenges
    regarding the Commission’s proposal, as it raises many questions about the pros
    and cons of a European Cybersecurity Certification Scheme. Can the new European
    Certification Framework achieve the desired harmonisation or would it rather add
    another layer of complexity to the existing system? Can voluntary certification
    effectively increase Europe’s cyber-resilience capabilities? Does `ENISA` have
    the required resources to fulfil the role of a certification agency? And, most
    important, is the private sector in general, and financial institutions in particular,
    likely to accept and participate in the new voluntary scheme?


    Firstly, the regulatory proposal has the European Cybersecurity Certification
    Scheme superseding existing national frameworks and thereby setting common standards
    while reducing fragmentation and information asymmetries. In principle, such a
    “one-stop shop” system with mutual recognition by member states sounds desirable.
    However, there is a risk that the new European framework could add another layer
    of complexity and thereby further increase fragmentation. For instance, it remains
    unclear what the role and responsibilities of a revised `ENISA` as the certifying
    agency will be in the existing structure of supervisory authorities such as the
    `ECB` and `EBA`.^(33) The regulatory proposal foresees the member states being
    responsible for “supervisory, monitoring and enforcement tasks”. Instead of centralisation
    and harmonisation, this will likely increase complexity.^(34)


    Secondly, a European certification could indeed raise the awareness of firms and
    citizens in respect of cybersecurity-related issues. Yet there is a risk of a
    false sense of security if software users regard their products as secure simply
    because they are certified. As emphasised earlier in this report, cybersecurity
    can be enhanced if firms and consumers embrace prevention, especially by following
    the principles of cyber-hygiene. If they care less about cybersecurity because
    their ICT products are certified, certification might trigger counterproductive
    effects.


    Thirdly, the proposal should provide practical answers to the question of how
    the certification process intends to deal with the high diversity of products,
    services and processes in cybersecurity. The creation, constant updates and, potentially,
    supervision of the certification scheme is a complex and burdensome task, especially
    if `ENISA` would also be responsible for coordination and cooperation between
    the EU and member states. This requires adequate human and financial resources.
    The Commission’s plan to increase the budget from €11 million to €23 million and
    the number of staff from 84 to 125 over five years does not seem to be well-aligned
    with the large amount of products and services to be certified and the wide range
    of new tasks for the agency.^(35) Operational concerns also persist regarding
    the agency’s necessary sensitivity and trust, as business secrets might need to
    be disclosed during the certification process.^(36) While clearly unintended,
    the collection of information on ICT products, services and business practices
    could render `ENISA` a valuable target for cyberattacks.


    Fourthly, the certification process needs to keep up with the fast pace of technological
    change in the digital sphere. Cybersecurity-related issues are volatile and change
    rapidly over time. The Commission’s proposal foresees certificates being valid
    for five years, but the practical question of how these certificates can reflect
    and integrate changes over time remains unanswered. Do (time-critical) software
    updates and patches need to be recertified? If so, the certification process might
    eventually appear rather unpractical and cost-inefficient. Furthermore, recertification
    would likely lead to a time delay until software users are able to update their
    systems, which could be harmful to cybersecurity.


    Fifthly, *a priori* the most important condition for the success of a European
    Cybersecurity Certification Scheme is large-scale private sector engagement, as
    the new scheme would be voluntary. Widespread private sector acceptance can only
    be achieved if the value added of the new certification framework exceeds the
    costs of certification.^(37) These costs can be significant, as shown by other
    certification schemes. Higher prices for ICT products and services could be the
    consequence for consumers.


    In conclusion, it remains unclear whether a European Cybersecurity Certification
    Scheme is desirable. The current proposal reflects high ambitions but falls short
    of providing a holistic concept as to how these objectives can be achieved. For
    the certification framework to be successful, its value added must be greater
    than the additional costs. In its current form, the proposed framework’s weaknesses
    seem to outweigh its potential advantages.


