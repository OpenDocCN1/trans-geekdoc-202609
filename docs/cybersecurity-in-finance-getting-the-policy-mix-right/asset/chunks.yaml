    Several recent new EU regulations and directives include incident reporting requirements
    in the event of a cyber-breach. The requirements for an institution or data controller
    to report or notify specific authorities, and in some cases the public, in the
    event of a cyber-breach are notably covered in the following legislation:


    - `General Data Protection Regulation (GDPR)` in Articles 33 and 34⁷

    - `Payment Service Directive 2 (PSD2)` in Article 96 as well as the corresponding
    `EBA Guidelines`⁸

    - `Directive on Security of Network and Information Systems (NIS)` in Articles
    6, 14 and 16⁹

    - `Regulation on Electronic Identification and Trust Services for Electronic Transactions
    in the Internal Market (eIDAS)` in Article 19^(10)

    - `Cyber-incident reporting of the European Central Bank`^(11)

    - `TARGET2`^(12)


    As shown in Table 2, high fragmentation can be observed between rules in taxonomy
    for reporting, reporting time frame, the template to be used and the threshold
    to trigger an incident. For instance, whereas there is no undue delay in the reporting
    time frame for the `NIS`, the deadline is 72 hours for the `GDPR`, 24 hours for
    the `eIDAS` and 48 hours for `Target2`. The template is not clearly defined in
    `GDPR` and `NIS`, while it is provided for the `eIDAS` (via document for `ENISA`
    reporting but not defined in member states) and for `TARGET2` (via document in
    Annex II).


    ![Image](Images/6.png)![Image](Images/7.png)


    There is also great diversity in the types of authorities that have to collect
    incident reports (see Table 3). Some of these authorities are European bodies,
    such as the `ECB` for `ECB` cyber-incidents. Others are national: national `NIS`
    authorities for the `NIS` Directive, `NCA` for the `PSD2` (the information is
    then reported to the `EBA` which eventually reports it to the `ECB`), national
    data protection authorities for the `GDPR`, national certification authority for
    the `eIDAS` Regulation and national central banks for `Target2`. Also, some requirements
    and the related authority in charge concern only financial firms: `PSD2` or `Target2`.
    Some others are multisectoral: `eIDAS`, `NIS` Directive and `GDPR`. Finally, each
    piece of legislation defines a different set of criteria to determine the type
    of financial firm that needs to comply with the reporting requirements.


    In addition to incident reporting to the competent authorities, most regulations
    require the notification of consumers which have been affected by a cybersecurity
    incident. The `GDPR` requires the supervisory authority, unless the financial
    institution has already done so, to inform consumers without undue delay if the
    data breach has a high risk to impact their rights and freedoms negatively. Similarly,
    the `eIDAS` Regulation requests consumer notification with appropriate information
    in case of major security breaches or integrity losses. The `NIS` Directive defines
    either the necessity of public awareness or public interest as the threshold for
    incident reporting to consumers. `PSD2` requires the payment service providers
    to inform their affected consumers without undue delay about both the cybersecurity
    incident and the remedial measures if the incident has or may have an impact on
    the financial interests of consumers.


    While these regulations all cover reporting requirements to consumers, significant
    heterogeneity can be observed in terms of the criteria, standards, thresholds,
    time frames and general approaches to consumer notification. Different interpretations
    across legislations might further raise the degree of this fragmentation. Moreover,
    the reporting requirements are characterised by discretion, meaning that for instance
    financial institutions are obliged to assess consumers’ personal and financial
    risks arising from a data breach. Therefore, the consumer dimension and scope
    of cyber-incident reporting as well as the difficulties due to legal fragmentations
    should not be underestimated. ![Image](Images/8.png)


    ## 2.2 Need to develop a common taxonomy for incidents reporting


    The development of a common taxonomy for incident reporting is needed for various
    reasons. First, as cyberspace is global, cyberinsecurity is often a multi-country
    issue. Often, similar patterns of threat can simultaneously affect organisations
    located in different countries. As such, cross-border exchange of information
    is needed to address cybersecurity issues better and manage cyber-incidents efficiently
    and effectively. Fragmentation in taxonomies across jurisdictions is likely to
    impede the efficiency of cross-border exchanges of information, as the process
    of understanding the incident could be slower. As such, convergence in taxonomies
    should contribute to help respond to multi-country cyberattacks better.


    Secondly, as shown in Table 2, there is an increase in incident reporting requirements.
    A standard taxonomy, adopted across all regulations and directives, regardless
    of whether it is on a cross-border basis, should facilitate smooth and efficient
    interactions between authorities and `CSIRTs`, especially by contributing to avoiding
    inconsistencies in the reported information. In principle, the creation of a distinct
    taxonomy for each piece of legislation should not be justifiable. Finally, as
    emphasised by `ENISA` (2018),^(13), persistent fragmentation in taxonomies will
    slow the emergence of automation in incident reporting and responses.


    Nevertheless, the development of a common taxonomy for incident reporting faces
    specific challenges. First, cyberspace is constantly evolving. As a result, cyberattacks
    are changing on a regular basis and new forms of attacks continuously appear.
    A non-flexible taxonomy that sets rigid standards for long periods is therefore
    ill-adapted. Secondly, existing taxonomies are often designed for specific economic
    sectors or companies. Organisations often have different needs and expectations.
    As such, `CSIRTs` often end up developing their own incident classifications for
    internal use (`ENISA`, 2018). As highlighted by `ENISA` (2018), one possibility
    for strengthening convergence in incident taxonomies is to develop a centralised
    repository for hosting all relevant taxonomies.


    Questions remain about which body should be in charge of such a task. Given the
    global nature of many cyberattacks, it would *a priori* make sense to design a
    global repository. But the development of a final consensus at the global scale
    might be unrealistic. Therefore, as a first step, it would be preferable to focus
    on an EU depository developed by the EU agency in charge of cybersecurity, namely
    `ENISA`. The next objective would be to develop only one taxonomy that encompasses
    all the processes in the scope. This taxonomy should include specific sections
    to cover the variants applicable to the different sectors, if relevant. Given
    the constant changes in the type and nature of cyberattacks, the common taxonomy
    should also be sufficiently flexible to be continuously updated.^(14)


    ## 2.3 Need to develop an efficient legislative and institutional framework for
    incident reporting

