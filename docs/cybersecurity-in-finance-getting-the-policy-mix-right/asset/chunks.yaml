    \ \n\n# 6.   COMPLEMENTARY POLICIES TO STRENGTHEN RESPONSES IN CASE OF CYBERATTACKS\n\
    \n## 6.1   Attribution and criminalisation: Reinforcing cross-border cooperation\
    \ and legal convergence\n\nWhen cyberattacks occur, two of their characteristics\
    \ make their management particularly delicate: their global dimension and increasing\
    \ sophistication. The Internet has been developed on the back of a ‘no boundaries\
    \ principle’. All its autonomous systems speak a common language, which is a set\
    \ of data formatting, naming, addressing and routing standards collectively known\
    \ as “the internet protocols” (Mueller, 2017).^(38) The most basic of these is\
    \ Internet Protocol (IP). As such, cyberspace has been growing by ensuring technical\
    \ compatibility on a global scale. Because cyberspace is primarily global, cybercrime\
    \ respects no border. It is likely that a significant share of cyberattacks is\
    \ shaped and launched on a cross-border basis. A cybercriminal in country A can\
    \ have colleagues in country B, use servers in country C and targets users in\
    \ country D. Given the complexity of these attacks, it is highly difficult to\
    \ compile robust statistics on the provenance and destination of cyberattacks.\
    \ Some researchers have been trying to develop relevant proxies, such as the use\
    \ of a global network of honeypots,^(39) to detect and assess the volume of active\
    \ reconnaissance^(40) by hackers (F-secure, 2017).^(41) Some statistics developed\
    \ by F-secure revealed that cross-border active reconnaissance within the EU originated\
    \ well outside of EU borders. In the second half of 2016, it was believed that\
    \ the main source countries in terms of IP addresses were, in order of importance:\
    \ Russia, the Netherlands, the US, Germany and China. Most countries were targeted\
    \ by Russian IPs, including Russia. The US, the Netherlands, Germany, China and\
    \ the UK were the top target countries for attacks on the honeypot network. The\
    \ will of financial firms to handle cross-border attacks has been tested by severe\
    \ challenges. First, in the wake of an attack, attribution often results from\
    \ a complex, costly and lengthy process, frequently involving external experts\
    \ and local authorities.^(42) The task proves to be even more complex on a cross-border\
    \ basis, as exchanges of information between countries concerning cybersecurity\
    \ matters have been thus far poorly regulated and generally require the use of\
    \ “official” bureaucratic channels. Should the attribution be successful, the\
    \ criminalisation of perpetrators proves to be another daunting task. Given the\
    \ lack of harmonisation in cybercrime laws, perpetrators are often inclined to\
    \ seek refuge in countries where there are no, or insufficient, cybercrime laws\
    \ to implement an extradition request. Also, as analysed by Hakmeh (2017),^(43)\
    \ many countries have double criminality requirement, implying that a suspect\
    \ can be extradited to stand trial in a foreign country for breaking its law only\
    \ if there is a similar law criminalising that offence in the extraditing country.\
    \ As such, should relevant laws not be in harmony between investigating states,\
    \ perpetrators can roam free. Against this background, there is an urgent need\
    \ for policy-makers and supervisors to develop a framework that greatly facilitates\
    \ the exchange of information and electronic evidence for the purpose of cybercrime\
    \ prevention, investigation and prosecution. When the criminals behind cross-border\
    \ attacks are identified, there is a need for convergence in national legal frameworks\
    \ in order to facilitate their extradition. In April 2018, the European Commission\
    \ proposed new rules whose objective is to make it easier and less time-consuming\
    \ for police and judicial authorities to access the electronic evidence they need\
    \ in investigations to catch and convict criminals and terrorists.^(44) Such proposed\
    \ legislation should contribute to facilitate the investigation and criminalisation\
    \ related to cyberattacks in the financial sector. An ambitious approach for the\
    \ case of cross-border requests of electronic evidence would be essential for\
    \ this legislation to contribute fully to better treatment of cross-border cyberattacks.\
    \ \n\n## 6.2   Best practices in remedies in case of cyberattacks"
