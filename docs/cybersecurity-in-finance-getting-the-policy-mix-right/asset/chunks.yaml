    First, as emphasised in chapter 2, a similar typology of cyber-events needs to
    be adopted throughout the `EU` and all economic sectors. This typology needs to
    be widely accepted by the `CSIRTs` community. This is the only way to develop
    consistent statistics across organisations, sectors and countries. Secondly, some
    tools should be developed to control for statistical biases. A large share of
    cyber-incidents will most likely not be reported. The absence of record can be
    intentional, as the firms do not want to damage their reputation, or unintentional.
    The scale of the former should decrease with the obligation of reporting cyber-incidents
    within the context of the new rules analysed in chapter 2. Regular auditing that
    integrates the cyber-dimension is essential to ensuring that financial firms systematically
    comply. Unintentional absence cannot be corrected solely by statistics and will
    rely on the quality of internal cybersecurity systems that can continuously detect
    attacks. Thirdly, questions will remain as to which body should be in charge of
    compiling such statistics. Should a framework based on sectoral hubs be the final
    institutional choice, it would make perfect sense for these hubs to be responsible
    for compiling and maintaining macro statistics. In that case, strong coordination
    would be needed to ensure methodological consistency across sectors.


    ## 4.2 Encouraging best practices for financial impact statistics


    One big issue remains regarding statistics on financial impacts. This information
    is essential to better understanding the overall impact of cyberattacks and adjusting
    cyber-policies and strategies as needed. However, the complexity of the task at
    firm level has made it thus far impossible to have consistent methodologies across
    organisations. Following a cyberattack, many factors can trigger a financial cost.
    They can be typically divided between “tangible” factors and “intangible” factors.
    Among “tangible” factors, there are revenue losses resulting from downtime, infrastructure
    damage, cost to implement compensation controls, technical investigation, customer
    breach notification, regulatory compliance, public relations, attorney fees and
    litigation, loss of intellectual property, etc. A typical challenge to measuring
    these costs concerns the time span during which they appear. Costs can indeed
    be triggered over many years. For instance, the identification, extradition and
    prosecution of criminals can take many years, resulting in recurring legal and
    investigation costs throughout the process. On the other hand, “intangible” factors
    can also trigger significant financial impact: value of lost contract revenue,
    devaluation of trade name, etc. “Intangible” factors are often more difficult
    to measure accurately than “tangible” factors. Yet an adequate estimation of the
    costs resulting from intangible factors is crucial to forming an accurate picture
    of the overall financial impact of a successful attack. Promoting the use of robust
    methodologies to quantify the overall financial impact of successful attacks should
    be one of the priorities of supervisors and regulators alike. A principle-based
    list could be developed at the `EU` level, with the aim of reinforcing convergence
    in practices at national level. This list would be particularly needed for the
    estimation of costs resulting from intangible factors and would encourage standardization
    in damage quantification methodologies, valuation methods, etc. Convergence should
    be achieved provided that collaboration is improved between cyber-authorities,
    `CSIRTs`, chief financial officers and chief information officers of organisations,
    authorities in charge of setting accountancy norms, etc. The possibility that
    information on financial impacts could be shared via incident reporting should
    be carefully assessed. Eventually, should convergence in financial assessment
    be observed, more reliable macro-data could be developed on the aggregate financial
    impact of cyberattacks.


    ## Footnotes


    ^(26) See `[http://sdw.ecb.europa.eu/]`. ^27) See `[https://ec.europa.eu/info/business-economy-euro/indicators-statistics/economic-databases/macro-economic-database-ameco_en]`.
    ^28) See `[http://ec.europa.eu/eurostat/web/microdata/european-union-statistics-on-income-and-living-conditions]`.
    ^29) See `[http://ec.europa.eu/eurostat/web/microdata/european-union-labour-force-survey]`.
    ^30) See Eurostat crime and criminal justice statistics at `[http://ec.europa.eu/eurostat/web/crime/overview]`.


    # 5. COMPLEMENTARY POLICIES TO REINFORCE PREVENTION


    ## 5.1 Promoting cyber-hygiene


    ### 5.1.1 What is cyber-hygiene?


    For financial firms it is imperative to manage and mitigate risk in the cyber-sphere.
    Practicing the major principles of cyber-hygiene is one of the key elements of
    a successful cybersecurity mix. Cyber-hygiene is defined “as a means to appropriately
    protect and maintain IT systems and devices and implement cybersecurity best practices”.
    To be effective these measures of prevention, detection and action need to be
    attainable, accreditable and affordable.


    ### 5.1.2 Core principles

