    Could a fund designed specifically for the financial sector be the solution? A
    parallel could be drawn with the `Single Resolution Fund` established in 2014.
    This fund can be used by the `Single Resolution Board` in order to ensure the
    efficient application of resolution tools and the exercise of the resolution powers
    conferred to the `Single Resolution Board` for the management of large banks in
    financial distress. The fund can be used only when the bank needs to be resolved.
    One particularity of the resolution fund is that it is fully funded by financial
    firms.^(52) Should a similar fund be established for cyber-risks in the financial
    sector only? In the financial sector, cyberattacks should be approached in accordance
    with their potential impact on financial stability. So far, as shown in Box 1,
    no successful cyberattack has managed to trigger systemic risks in the financial
    sector. Yet, no one knows if this will happen in the future. Overall, given the
    still ambiguous relationship between cyber-risks and systemic risk in the financial
    sector, there is no sufficient ground to develop an emergency cyber-fund only
    for the financial sector. It should be up to banks to decide whether to do so.
    What about a fund for all operators of essential services? Should an emergency
    cyber-fund be designed for specific sectors or stakeholders, one possibility would
    be to extend it to all operators that have already been assessed as critical for
    cybersecurity. The `NIS` (2016), for example, asked member states to list operators
    of essential services in seven sectors: energy (electricity), transport (air,
    rail, water and road), banking (credit institutions), financial market infrastructure
    (trading venues, central counterparties), health (healthcare settings), water
    (drinking water supply and distribution) and digital infrastructure (Internet
    exchange points, domain name system service providers, top-level domain name registries).
    One option for the EU would be to assess the possibility and need of developing
    a hybrid fund combining private and public funding for these different operators.


