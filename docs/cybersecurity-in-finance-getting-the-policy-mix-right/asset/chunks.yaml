    ⁸ The Directive text can be found at [https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32015L2366&from=EN](https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32015L2366&from=EN).
    ⁹ The Directive text can be found at [http://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32016L1148&from=EN](http://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32016L1148&from=EN).
    ^(10) The Directive text can be found at [https://ec.europa.eu/futurium/en/system/files/ged/eidas_regulation.pdf](https://ec.europa.eu/futurium/en/system/files/ged/eidas_regulation.pdf).
    ^(11) Some elements on ECB incident reporting can be found at [www.bankingsupervision.europa.eu/press/publications/newsletter/2017/html/ssm.nl170517_3.en.html](http://www.bankingsupervision.europa.eu/press/publications/newsletter/2017/html/ssm.nl170517_3.en.html).
    ^(12) Some TARGET 2 elements can be found at [www.ecb.europa.eu/explainers/tell-me/html/target2.en.html](http://www.ecb.europa.eu/explainers/tell-me/html/target2.en.html).
    Contrary to the PSD2, eIDAS, GDPR and NIS, TARGET2 is a market infrastructure
    rather than legislation. TARGET2 provides some guidelines that request concerned
    firms to notify the national central banks in case of incident. ^(13) See Reference
    Incident Classification Taxonomy, Task Force Status and Way Forward, ENISA, January
    2018 ([www.enisa.europa.eu/publications/reference-incident-classification-taxonomy](http://www.enisa.europa.eu/publications/reference-incident-classification-taxonomy)).
    ^(14) For example ENISA (2018) promotes the use of “Other” or “Unknown” in the
    “Tag” field by the owners of taxonomies as an indicator to revise taxonomies.
    This field can be used if there is an increase in that category with incidents
    or events of the same type. ^(15) Harmonisation of templates is a clear policy
    objective, but given the different purposes of the pieces of legislation as well
    as different interests pursued by national regulators, complete harmonisation
    will be very challenging. Yet it is worth striving for a more convergent implementation
    of European or international standards. There are indeed possibilities for harmonisation
    within the existing legal framework for cyber-incident reporting. For example,
    parts of the Target2 template are similar to the NIS template provided by ENISA.
    The sections “description of the incident”, “cause of the incident” and “remedial
    action” in the Target2 template are likely the same information as the sections
    “general description of the security incident”, “detailed causes” and “mitigating
    security measures” of the corresponding NIS template. ^(16) An example of such
    incident reporting based on standard messaging services is SWIFT’s Customer Security
    Programme (CSP), which legally requires all participating financial institutions
    to report and share their information on cyber-threats and incidents as soon as
    they have occurred. In the case of SWIFT, the CSP is supported by an “Information
    Sharing and Analysis Centre” to exploit the gathered data for data sharing and
    analysis. It was not possible to identify the extent to which this mechanism is
    used, but based on preliminary evidence current usage is likely limited. ^(17)
    For the financial sector, given the existing distribution of tasks between multiple
    supervisors (national central banks, European central bank, twin-peak models including
    one supervisor for the macro-prudential part and another for micro-prudential
    tasks, etc.), the development of a new body to cover the tasks of a sectoral hub
    at the European level might be the preferred option.


    # 3.   OPTIMISING INFORMATION SHARING


    ## 3.1 Different models of information sharing

