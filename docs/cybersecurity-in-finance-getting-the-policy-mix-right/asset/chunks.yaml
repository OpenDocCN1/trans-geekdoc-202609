- fmt: "\nThe damage inflicted by large cyberattacks can be significant for both financial\
    \ firms and clients. While major insurers nowadays offer cybersecurity insurance\
    \ to firms, consumers are usually uninsured against cybersecurity risks. As demonstrated\
    \ by the case study in Box 1, cyberattacks such as the hacking of Tesco Bank’s\
    \ online banking system impact consumers through financial fraud and/or identity\
    \ theft. This poses an important question of remedies for cyberattacks.\n\nWhat\
    \ are the legal and regulatory consequences of cyberattacks in which, for example,\
    \ consumer current accounts have been misappropriated and/or personal data have\
    \ been stolen?\n\nThe first challenge is to clarify the degree to which clients\
    \ and/or providers share the liability for the hack. Secondly, a distinction can\
    \ be made between financial fraud on clients’ accounts and the theft of data.\
    \ The former results in immediate financial losses for the affected consumers\
    \ or firms. The latter impacts the clients’ rights as the data could later on\
    \ be used for identity theft and eventually incur financial losses to clients.\
    \ Thirdly, the best remedies for each situation need to be assessed. \n\nWhile\
    \ both financial institutions and consumers are victims of cyberattacks, questions\
    \ remain as to how to assess whether mistakes or negligence on the side of one\
    \ party or both parties is partly responsible for the occurrence of an attack.\
    \ As emphasised by De Werra et al. (2018),^(45) the civil liability resulting\
    \ from such attacks raises complex legal issues because of the diversity of potentially\
    \ applicable liability regimes (personal data protection, product liability regulations,\
    \ etc.). Regulatory standards of “reasonable cybersecurity measures” can vary,\
    \ depending on the context and the nature of the affected data. In addition, assessing\
    \ the liability can be challenging when a chain of parties may have contributed\
    \ to the attack and its spread, whether or not they did it unintentionally.\n\n\
    Specifically to the financial sector, `Articles 73` and `74` of `PSD2` provide\
    \ some elements in the context of an unauthorised transaction. If it is proved\
    \ that consumers can be blamed for the unauthorised transaction, financial firms\
    \ are nevertheless required to bear their consumers’ financial losses after notification.\
    \ However, consumers can be held accountable by their banks for a share of the\
    \ financial damage, up to `€50`. If the liability for the unauthorised transaction\
    \ lies with providers, however, `PSPs` are required to immediately refund the\
    \ financial losses on their customers’ accounts. For both cases, the regulatory\
    \ standards set by `PSD2` are generally favourable to consumers, as their `PSPs`\
    \ have to bear the financial damage in any case, with the exception of the `€50`\
    \ threshold in case of consumer liability (see `Article 74` of `PSD2`).\n\nTaking\
    \ a closer look at the case of liability on the side of `PSPs`, according to `PSD2`,\
    \ `PSPs` are only required to follow the minimal principle of “what is lost is\
    \ due”. As regards additional compensation, `Article 73 (3)` of `PSD2` emphasises:\n\
    \n> Further financial compensation may be determined in accordance with the law\
    \ applicable to the contract concluded between the payer and the payment service\
    \ provider or the contract concluded between the payer and the payment initiation\
    \ service provider if applicable.\n\nTherefore, the right of consumers for additional\
    \ compensation remains vague in `PSD2`. Questions arise as to how and to which\
    \ extent customers can be compensated for the inconvenience resulting from an\
    \ unauthorised transaction, such as the inability to use a payment card for a\
    \ certain time or the temporary shutdown of all operations and services. Those\
    \ non-financial consequences can be severe, as the Tesco Bank case study demonstrates.\
    \ Further investigation of the pros and cons of the creation of a more systematic\
    \ compensation mechanism would be desirable.\n\nThe question of liability and\
    \ appropriate remedies also concerns cyberattacks that target data theft. Stealing\
    \ personal data usually does not directly inflict financial damage, but it does\
    \ impact consumer rights, as the data could for instance later be used for identity\
    \ theft, which in turn could possibly be leveraged for financial fraud. Under\
    \ the current regulatory environment of `PSD2` and `GDPR`, financial firms that\
    \ suffer data theft are required to report these data breaches to their supervisors\
    \ and consumers within a given time frame. Yet in order to encourage best practices,\
    \ financial firms should not only notify their customers but follow up on the\
    \ actual damage. In that respect, `Article 82 (1)` of `GDPR` emphasises:\n\n>\
    \ Any person who has suffered material or non-material damage as a result of an\
    \ infringement of this Regulation shall have the right to receive compensation\
    \ from the controller or processor for the damage suffered.\n\nDifferent examples\
    \ of damages are notably provided in the `Recital (75)` of the regulation and\
    \ can concern damage to the reputation, loss of confidentiality of personal data,\
    \ etc. The scope of the liability is clearly defined in the `Article 82` of the\
    \ `GDPR`, as it concerns only cases where the Regulation has been infringed. However,\
    \ it remains challenging to properly quantify the damage resulting from a data\
    \ theft. In that respect, as is the case for additional compensation in the context\
    \ of unauthorised transactions, should a more systematic compensation mechanism\
    \ be developed?\n\nIn its communication on “Building A European Data Economy”\
    \ (2017),^(46) the European Commission emphasised its objective “to enhance legal\
    \ certainty with regard to liability in the context of emerging technologies and\
    \ thereby create favourable conditions for innovation”. The development of a legislative\
    \ framework where “liability could be” systematically “assigned to the market\
    \ players generating a major risk for others or to those market players which\
    \ are best placed to minimize or avoid the realisation of such risk”,^(47) might\
    \ motivate firms to reinforce the quality of their cyber-infrastructures. It could\
    \ also impede innovation, however, as the more innovative the financial firm might\
    \ be in employing digital technologies, the more exposed it could become to lawsuits.\n\
    \nSince financial firms need to comply with `PSD2` and `GDPR`, the coming years\
    \ will provide a good opportunity to assess best practices in terms of liability\
    \ allocation and remedies in the financial sector. Court cases and regular monitoring\
    \ of these elements could help EU and national supervisors to compile a list of\
    \ best principles that could be regularly adjusted in response to the rapidly\
    \ changing cyber-landscape. In particular, these principles should cover the use\
    \ of robust methodologies to assess the degree to which firms and/or clients share\
    \ the cyber-liability. They should also help firms assess when consumer financial\
    \ compensation that goes beyond the actual financial loss incurred should be provided.\
    \ Finally, these principles should also provide guidelines on the best type of\
    \ remedies in case of data theft without immediate financial loss.\n\n## 6.3 Is\
    \ an emergency fund needed in case of large cyberattacks?\n\nIn its impact assessment\
    \ conducted in connection with the Cybersecurity Package, the Commission mentioned\
    \ the possibility of developing an `EU Cybersecurity Emergency Fund`.^(48) This\
    \ fund was defined as follows:\n\n> The EU Cybersecurity Emergency Fund is an\
    \ initiative developed in the context of the review of the Cybersecurity Strategy\
    \ on the example of existing crisis mechanisms in other EU policy areas. It will\
    \ provide the possibility for Member States to seek help at the EU level in case\
    \ of major incident. It could be used to support, directly or indirectly, citizens,\
    \ companies or public administrations hit by cyberattacks.\n"
