  trans: "\n随着电子商务不可阻挡的兴起，网络犯罪分子也随之不断兴起。网络犯罪已成为全球增长最快的犯罪。它从五年前甚至未列入全球十大业务风险之单，一路跃升至第二。对于某些国家而言，网络攻击已成为最受关注的风险。过去担心脚本小子（script\
    \ kiddie）对网站进行低水平攻击的时代已经过去。如今的攻击者是多层且复杂性日益增加，范围从高级持续性威胁（APT）、企业间谍活动、有组织犯罪和“黑客行动主义”到网络恐怖分子，他们日益精通且资金日益充足。网络安全已从一个技术问题变成了政治和董事会问题。金融市场尤为重要，因为它们是所有成员国经济运行的润滑剂。那么，网络安全的优先事项应该是什么？网络犯罪的增长是否如此快速和广泛，以至于我们应该将重心更多地转向网络韧性？有三个核心主题需要解决：1.\
    \ 治理（涵盖组织、国际和国家所有层面）2. 风险管理（兼顾背景和情报驱动）3. 能力（通过设计和默认实现网络安全，使用适用于特定背景的标准框架）。金融部门需要解决许多问题。我们的工作小组选择关注某些关键问题，而不是试图编写一本百科全书式的著作。任何报告都只能代表某一个时刻的快照，随着技术和威胁的进步，持续进行沟通将尤为重要。我希望我们工作小组在编制此报告方面所做的工作将为网络安全政策的发展，以及对欧盟成员国经济及其所依赖的金融市场的保护和维护做出宝贵贡献。Richard\
    \ Parlour，工作小组主席，2018 年 6 月 \n\n# 执行摘要\n\n在 2017 年发生多次大规模网络攻击的背景下，欧盟委员会于 2017\
    \ 年 9 月通过了其跨部门网络安全方案。尽管这项倡议应该有助于加强欧盟金融机构的网络韧性和应对能力，但仍存在若干政策问题和悬而未决的问题。为了分析与金融领域（零售银行、企业银行、资本市场、金融基础设施和保险）相关的问题，CEPS-ECRI\
    \ 在 2017 年 9 月至 2018 年 5 月期间组织了一个工作小组，成员包括来自金融业、技术行业、国家监管机构和欧洲机构的专家，还包括来自一家消费者协会和一家律师事务所的人员。为了增强金融业应对当前和未来威胁的网络韧性，还需要进一步解决九项政策问题。这些问题在下方列出，随后是对每个问题进行更深入的讨论。\n\
    \n## 主要政策建议\n\n1. 需要实现网络事件分类法的趋同。\n2. 需大幅改进事件报告框架，以对金融机构的网络韧性做出充分贡献。\n3. 机构应评估中央枢纽持有的数据应如何以及在什么程度上与监管机构、公司和客户共享。\n\
    4. 需要雄勃的政策来开发关于网络趋势的统一、可靠且可利用的统计数据。\n5. 监管机构和监督机构应不断增强网络卫生的最佳实践。\n6. 需要加强欧洲网络安全认证计划，以对网络安全、网络风险管理和能力做出更好的贡献。\n\
    7. 为了改进归因分析和引渡程序，加强跨境合作和法律统一仍是首要任务，无论是在欧盟内部还是在更广泛的范围内。\n8. 需要进一步鼓励网络攻击补救措施的最佳实践。\n\
    9. 政策制定者应进一步评估建立应对大型网络攻击的应急基金的优缺点和可行性。\n\n## 1. 网络事件的通用分类法\n\n跨法规、跨管辖区和跨部门的通用分类法有助于理解跨国和跨部门的网络攻击，并最终加强响应质量。考虑到网络空间瞬息变化的本质，参考分类法应具有足够的灵活性以便定期进行修订。此外，为了方便\
    \ `CSIRTs` 阅读，这种通用分类法应包含适用于不同部门的特定章节。在可能的情况下，立法层面需要实现事件报告模板的趋同。然而，由于立法目的的多样性，模板的完全统一仍面临挑战。\n\
    \n## 2. 开发高效事件报告框架的需要\n\n不同报告要求的出现（特别是在 `GDPR`、`PSD2`、`NIS Directive`、`ECB/SSM`、`eIDAS\
    \ regulation` 和 `Target 2` 中）引发了关于什么是最适合提高金融机构韧性的框架的问题。为此，监管机构、监督机构和金融公司需要解决五个问题。首先，要在欧盟范围内统一\
    \ `NIS Directive` 和 `GDPR`。其次，在不同国家运营的大型公司需要建立集团层面“整体风险”的整合流程。第三，机构应能够利用事件报告的内容来为\
    \ `CSIRTs` 提供信息和建议。为此，政策制定者和公司应共同评估开发信息服务的风险与机遇。第四，创建一个负责金融的欧洲行业枢纽，负责汇总所有事件报告、向利益相关者发送正确信息并向机构和\
    \ `CSIRTs` 提供建议，可以极大加强事件报告框架。最后，为了创建一个能够有效处理跨部门网络攻击并防止部门间传染的韧性网络安全框架，枢纽还应涵盖欧盟经济的所有部门。\n\
    \n## 3. 中央枢纽持有的数据与监管机构、公司和客户共享\n\n机构应鼓励建立促进金融公司之间自愿交换信息的平台。同时，机构应确保事件报告要求对金融机构的网络韧性做出充分贡献。为此，在认为相关的情况下，报告包含的信息应迅速与相关的利益相关者共享。首先，负责事件报告的中央枢纽应迅速向相关监管机构提供网络攻击的正确信息。其次，枢纽还需要向金融公司共享相关信息，前提是在建立网络攻击集体响应与保护公司利益之间找到正确的平衡。为了向这些公司提供技术支持，枢纽需要监管机构的明确授权。基于市场而非监管倡议，通过开发反映供应商（及其潜在客户）所面临网络风险的网络评级，与公司的潜在客户共享某些信息是可行的。无论选择哪些政策方案，中央枢纽管理的数据的高安全性都应被视为首要任务之一。\n\
    \n## 4. 构建宏观统计基准的需要\n\n"
