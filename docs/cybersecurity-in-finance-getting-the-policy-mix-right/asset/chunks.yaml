    欧洲经济日益依赖于信息通信技术（ICT）产品和服务的无缝使用。近年来，这些数字技术变得更加复杂和多样化，同时，网络空间的威胁水平也在提高。使用 ICT 产品的公司和消费者往往缺乏知识来充分理解他们所用新技术在网络安全方面的维度。因此，软件提供者与软件用户之间持续存在信息不对称，这可能对单一市场的有效运行产生不利。


    为了限制这种信息不对称的负面影响，一些欧盟成员国实施了国家网络安全认证计划。这些计划证明了经过认证的 ICT 产品和服务符合了最重要的网络安全标准。表 4
    展示了在欧盟境内运行的国家认证计划。目前国家网络安全认证计划的主要问题之一是其高度的碎片化，且缺乏其他成员国的相互认可（参与 `SOG-IS MRA` 框架的国家除外）。此外，近一半的欧盟成员国尚未建立国家网络安全认证计划。


    ![Image](img/9.png)


    在此背景下，欧盟委员会于 2017 年 9 月发布了关于欧洲网络安全认证计划的监管建议，作为网络安全一包的核心倡议之一。该认证计划预计将定义共同的标准、程序和技术要求。虽然保持自愿性，但它将从获得所有成员国的认可中获益，从而解决碎片化问题。委员会的新计划将由一个新的欧盟网络安全安全机构运营，该机构将对
    `ENISA` 进行修订，并赋予其永久授权以及更多的财政和人力资源。除了统一之外，核心目标是加强欧洲的网络韧性能力。³² 然而，委员会的建议仍面临重要挑战，因为它引发了许多关于欧洲网络安全认证计划优劣的疑问。新的欧洲认证框架是否能够实现预期的统一，还是说会给现有系统增加另一层复杂性？自愿认证是否能有效提高欧洲的网络韧性能力？`ENISA`
    是否拥有履行认证机构角色所需的资源？最重要的是，私营部门（总体而言，特别是金融机构）是否可能接受并参与这一新的自愿计划？


    首先，该监管建议由欧洲网络安全认证计划取代现有的国家框架，从而设定共同标准，同时减少碎片化和信息不对称。原则上讲，这种具有成员国相互认可的“一站式”系统听起来是理想的。然而，存在一种风险，即新的欧洲框架可能会增加另一层复杂性，从而进一步加剧碎片化。例如，修订后的
    `ENISA` 作为认证机构，在像 `ECB` 和 `EBA` 等监管机构的现有结构中的角色和职责尚不清楚。³³ 监管建议预计成员国负责“监督、监控和执法任务”。这可能不会导致集中和统一，反而会增加复杂性。³⁴


    其次，欧洲认证确实可以提高公司和公民对网络安全相关问题的意识。然而，如果软件用户仅仅因为产品通过了认证就认为它是安全的，就会存在虚假安全感的风险。正如本报告早期强调的，如果公司和消费者拥抱预防，特别是遵循网络卫生原则，就可以增强网络安全。如果他们因为
    ICT 产品通过了认证而不再关注网络安全，认证可能会产生适得其反的效果。


    第三，该建议应当就认证过程意图如何处理网络安全中高度多样化的产品、服务和流程提供实际的答案。认证计划的创建、持续更新以及可能的监管是一项复杂且繁琐的任务，特别是如果
    `ENISA` 还要负责欧盟与成员国之间的协调与合作。这需要充足的人力物力资源。委员会计划在五年内将预算从 1100 万欧元增加到 2300 万欧元，并将员工从
    84 人增加到 125 人，这似乎与待认证的大量和服务以及该机构承担的广泛新任务并不匹配。³⁵ 关于该机构必要的敏感性和信任，运营层面的担忧依然存在，因为在认证过程中可能需要披露商业秘密。³⁶
    虽然这并非本意，但对 ICT 产品、服务和业务实践信息的收集可能会使 `ENISA` 成为网络攻击的重要目标。


    第四，认证过程需要跟上数字领域技术变革的快速节奏。网络安全相关问题具有波动性，且随时间变化迅速。委员会的建议预计证书有效期为五年，但这些证书如何反映并整合随时间变化的实际问题仍未解决。对于（时间紧迫的）软件更新和补丁是否需要重新认证？如果是的话，认证过程最终可能显得非常不实际且缺乏成本效益。此外，重新认证可能会导致软件用户更新系统时出现时间延迟，这会对网络安全产生危害。


    第五，*先验*来看，欧洲网络安全认证计划成功的最重要的条件是私营部门的大规模参与，因为新计划是自愿的。只有当新认证框架的附加值超过认证成本时，才能实现私营部门的广泛接受。³⁷
    如其他认证计划所示，这些成本可能是巨大的。ICT 产品和服务的价格上涨可能是消费者面临的后果。


    结论是，欧洲网络安全认证计划是否理想尚不明。目前的建议反映了很大的雄心，但在提供如何实现这些目标的整体概念方面尚不足。要使认证框架成功，其附加值必须大于额外成本。目前拟议框架的缺点似乎超过了其潜在优势。


