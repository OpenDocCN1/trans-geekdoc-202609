- fmt: "\nThe emergence of different reporting requirements raises questions about\
    \ the most adequate legislative and institutional framework for shaping the relationships\
    \ between `CSIRTs` and authorities. Eventually, the objective is to ensure that\
    \ the framework helps financial firms protect themselves from cyberattacks and,\
    \ in case of cyberattacks, helps these firms activate timely and efficient responses.\
    \ Responses that are timely and efficient should contribute to limiting the short-term\
    \ and mid-term damages to firms and, in some circumstances, are likely to prevent\
    \ the expansion of attacks to other firms and sectors. The framework as developed\
    \ should aim at reinforcing cyber-resilience and business continuity as much as\
    \ possible. In order to do so, regulators, supervisors and financial firms should\
    \ focus on the following five issues.\n\n### Issue 1. Convergence in templates\
    \ across the EU \nFor each piece of legislation whose purpose is to develop incident\
    \ reporting, convergence in templates should be ensured across the EU. This priority\
    \ concerns mainly the `NIS Directive` and the `GDPR`, as related templates should\
    \ be primarily defined at national level.\n\n As regards the `GDPR`, one of the\
    \ roles of the `Data Protection Article 29 Working Party` and the future `European\
    \ Data Protection Board` (the latter will replace the former once the `GDPR` takes\
    \ effect, see `Recital 139` of `GDPR`) should be to reinforce the harmonisation\
    \ in those national templates.\n\n### Issue 2. Adequate governance at group level\
    \ \nFor financial firms that have activities across different jurisdictions, high\
    \ fragmentation in templates and typologies could impede the ability of `CISRTs`\
    \ to understand the overall picture of the incidents impacting the banking group.\
    \ Against this background, the banking group could be compliant with the respective\
    \ incident reporting requirements at national level, while not being able to understand\
    \ holistically what is at stake.\n\nEffective governance at `HQ` level, with adequate\
    \ consolidation processes of the “overall cyber-risk” at group level, is therefore\
    \ also needed. This is a key condition for the authority in charge to have a clear\
    \ idea of the overall level of risks triggered by specific cyber-incidents.\n\n\
    ### Issue 3. Assessing the possibilities to develop an infrastructure with bidirectional\
    \ flows \nAt present, all incident reporting processes are defined with a single\
    \ direction flow, from `CSIRTs` to authorities in charge. None of the legislation\
    \ emphasizes or designs two-way flows. There was a broad consensus within the\
    \ `Task Force` that a bidirectional process with respect to incident reporting\
    \ will eventually be needed.\n\nIn other words, authorities should be able to\
    \ exploit the content of incident reporting to inform and advise `CSIRTs` in return.\
    \ One of the options to achieve two-way flows concerns the development of specific\
    \ network infrastructure channels that provide secure messaging services. This\
    \ would imply that financial firms use a common application to report incidents.\
    \ The development of `SWIFT` messages on the interbank market could be inspirational\
    \ in this respect.\n\nIn the end, information about cyber-incidents could be sent\
    \ and received in a secure, standardised and reliable environment. This model\
    \ should contribute to streamlining incident reporting processes. High standardisation\
    \ of templates should in principle increase processing speed and response. Given\
    \ that speed is one of the main criteria for coping with large-scale cyberattacks,\
    \ this benefit could be precious.\n\nHowever, one of the main issues to address\
    \ in order to create a common application for cyber-incidents concerns the nature\
    \ and type of information encoded in the message. The diversity of templates across\
    \ pieces of legislation (and likely, for two of them, across countries) can be\
    \ justified by the fact that each piece of legislation has a specific purpose.\
    \ The development of standard messages should ensure that this diversity can be\
    \ replicated in that new system. The different authorities need to be able to\
    \ retrieve the right information within the expected time.\n\nThere is a significant\
    \ risk that incident reporting based on standard messages might end up too generic\
    \ to be exploited by authorities. Should the financial sector decide to go in\
    \ that direction, questions would remain about the funding of such: Should it\
    \ be by governments? Or should it be a hybrid model?\n\n### Issue 4. Assessing\
    \ the possibility of developing a centralised hub \nA hub should be developed\
    \ with the objective of centralising all incident reports and dispatching them\
    \ to the right authorities. The hub could also play the role of coordinator between,\
    \ on one hand, all authorities and on the other hand, `CSIRTs`. Given the global\
    \ nature of cybersecurity, the hub should be established at European level. The\
    \ mandate of existing agencies such as `ENISA` could be significantly extended\
    \ to cover these tasks or a new agency could be built from scratch.\n\nA priori,\
    \ the former option that builds upon the existing institutional framework would\
    \ be preferable. The objective is to avoid the multiplication of EU agencies that\
    \ cover broadly similar topics. But, in order to handle all reporting requirements\
    \ and distribute key information to the right stakeholder, the chosen agency will\
    \ need a large amount of resources in terms of staff and budget. In order to fulfill\
    \ its mission of technical adviser, the centralised hub would also need a clear\
    \ mandate from regulators.\n\n### Issue 5. Assessing the possibility of covering\
    \ all economic sectors \nSo far, many of the recorded large-scale cyberattacks\
    \ not only have affected more than one country; they have also disrupted more\
    \ than one sector. The institutional framework therefore needs to handle multi-sectoral\
    \ dimension. The objective is to ensure that any cyberattacks are confined to\
    \ one or a few firms in a specific sector and do not spread to others.\n\nIf there\
    \ is for example a high risk of a cyber-incident spreading from the energy sector\
    \ to the financial sector, the supervisor should be able to provide real-time\
    \ information to financial firms on the nature of the attack and, if possible,\
    \ on the best way to respond to it. Two options can be considered to cover the\
    \ multi-sector dimension of cyberattacks. The first is to build a centralised\
    \ hub that is in charge of all sectors including the financial one. The second\
    \ concerns the establishment of a multi-sectoral network for cyber-incidents where\
    \ one hub is developed for each sector of the economy: finance, energy, telecommunications,\
    \ food, etc. Each hub would be in charge of one given economic sector for everything\
    \ that relates to the dispatching of incident reports, notification and advice\
    \ of firms in return, coordination of all stakeholders.\n\nIn order to handle\
    \ multi-sectoral attacks, a network of sectoral hubs would be established, preferably\
    \ at European level, with a hub of hubs. The preferred option should be the centralised\
    \ hub for the whole EU economy. One of the main risks of a network of sectoral\
    \ hubs is the development of sectoral silos that struggle to find agreement on\
    \ relevant topics. The quality of information sharing processes might also decrease\
    \ in a network of hubs, given the greater complexity of such processes and the\
    \ greater risks of some sectoral hubs being unaware of the need to provide the\
    \ right information to the right counterpart. The establishment of a centralised\
    \ hub for the whole economy would nonetheless require expertise from the different\
    \ sectors in order to properly understand the peculiarities.\n"
