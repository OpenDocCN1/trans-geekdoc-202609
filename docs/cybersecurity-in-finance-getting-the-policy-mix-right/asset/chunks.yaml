    \ September 2017 and May 2018 under the chairmanship of Richard Parlour, Principal\
    \ at Financial Markets Law International. It was established by rapporteurs Sylvain\
    \ Bouyon, Research Fellow and Head of Fintech and Retail Finance at `CEPS` and\
    \ `ECRI`, and Simon Krause, Visiting Researcher at `CEPS`.\n\nThe policy recommendations\
