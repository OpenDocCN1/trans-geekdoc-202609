    最近的若干项欧盟法规和指令均包含了在发生网络违规时的事件报告要求。机构或数据控制者在发生网络违规时向特定机构（在某些情况下向公众）报告或通知的要求在以下立法中得到了显著涵盖：


    - `通用数据保护条例 (GDPR)` 第 33 条和第 34 条⁷

    - `支付服务指令 2 (PSD2)` 第 96 条以及相应的 `EBA 指南`⁸

    - `网络和信息系统安全指令 (NIS)` 第 6、14 和 16  条⁹

    - `欧盟内部市场电子交易电子身份识别和信任服务条例 (eIDAS)` 第 19 条¹⁰

    - `欧洲中央银行网络安全事件报告`¹¹

    - `TARGET2`¹²


    如表 2 所示，在报告分类、报告时间范围、使用的模板以及触发事件的阈值方面的规则之间可以观察到高度碎片化。例如，虽然 `NIS` 的报告时间范围内没有不当延迟，但
    `GDPR` 的截止日期为 72 小时，`eIDAS` 为 24 小时，`Target2` 为 48 小时。`GDPR` 和 `NIS` 中没有明确定义模板，而
    `eIDAS`（通过 `ENISA` 报告文档提供但在成员国未定义）和 `TARGET2`（通过附件 II 中的文档）则提供了模板。


    ![Image](img/6.png)![Image](img/7.png)


    收集事件报告的机构类型上也存在巨大的多样性（见表 3）。其中一些机构是欧洲机构，例如负责 `ECB` 网络安全事件的 `ECB`。其他是国家级的：负责 `NIS`
    指令的国家 `NIS` 机构、负责 `PSD2` 的 `NCA`（信息随后报告给 `EBA`，最后由 `EBA` 报告给 `ECB`）、负责 `GDPR`
    的国家数据保护机构、负责 `eIDAS` 法例的国家认证机构以及负责 `Target2` 的国家中央银行。此外，某些要求和相关主管仅涉及金融公司：`PSD2`
    或 `Target2`。另一些是跨部门的：`eIDAS`、`NIS` 指令和 `GDPR`。最后，每项立法都定义了一套不同的标准，以确定需要遵守报告要求的金融公司类型。


    除了向主管机构报告事件外，大多数法规还要求通知受网络安全事件影响的消费者。`GDPR` 要求监管机构（除非金融机构已采取行动）如果数据泄露对消费者的权利和自由可能产生高风险的负面影响，则应在不当延迟的情况下通知消费者。同样，`eIDAS`
    法例要求在发生重大安全漏洞或完整性损失时提供带有适当信息的消费者通知。`NIS` 指令将公众意识的必要性或公共利益定义为向消费者报告事件的阈值。`PSD2`
    要求支付服务供应商如果事件发生或可能影响消费者的财务利益，必须在不当延迟的情况下告知受影响的消费者网络安全事件及补救措施。


    虽然这些法规都涵盖了对消费者的报告要求，但在标准、规范、阈值、时间范围和消费者通知通用方法方面可以观察到显著的异质性。法律之间的不同解释可能会进一步增加这种碎片化程度。此外，报告要求具有裁量性，这意味着例如金融机构有义务评估数据泄露给消费者带来的个人和财务风险。因此，消费者维度、网络安全事件报告的范围以及法律碎片化带来的困难不应被低估。![Image](img/8.png)


    ## 2.2 开发事件报告通用分类法的必要性


    出于各种原因，需要开发一种用于事件报告的通用分类法。首先，由于网络空间是全球性的，网络不安全通常是一个跨国问题。相似的威胁模式往往同时影响位于不同国家的组织。因此，需要跨境交换信息以解决网络安全问题，并高效、有效地管理网络事件。跨司法管辖区之间分类法的碎片化可能会阻碍跨境交换信息的效率，因为理解事件的过程可能会变慢。因此，分类法的融合有助于更好地应对跨国网络攻击。


    其次，如表 2 所示，事件报告要求正在增加。一种在所有法规和指令中采用的标准分类法（无论是否基于跨境基础）应该促进机构与 `CSIRTs` 之间顺畅高效的互动，特别是有助于避免报告信息的不一致。从原则上说，为每项立法创建一个独立的分类法是不合理的。最后，正如
    `ENISA` (2018) ¹³ 所强调的，分类法的持续碎片化将减缓事件报告和响应自动化的出现。


    然而，开发事件报告的通用分类法面临特定挑战。首先，网络空间不断演变。因此，网络攻击经常变化，新的攻击形式不断出现。一个长期设定固定标准的缺乏灵活性的分类法是不适应的。其次，现有的分类法通常针对特定的经济部门或公司设计。组织通常有不同的需求和预期。因此，`CSIRTs`
    往往开发自己的内部使用事件分类 (`ENISA`, 2018)。正如 `ENISA` (2018) 所强调的，加强事件分类收敛的一种可能性是开发一个中央库来托管所有相关的分类法。


    关于哪个机构负责此类任务仍存在疑问。鉴于许多网络攻击的全球性，从理论上，设计一个全球库是有意义的。但在全球范围内达成最终共识可能是不现实的。因此，作为第一步，最好关注由负责网络安全的欧盟机构即
    `ENISA` 开发的欧盟存储库。下一个目标是开发一个涵盖范围范围内所有过程的单一分类法。该分类法应包含特定章节，以涵盖适用于不同部门的变体（如果适用）。考虑到网络攻击类型和性质的不断变化，通用分类法也应具备足够的灵活性以便持续更新。(14)


    ## 2.3 开发高效事件报告立法和制度框架的必要性


