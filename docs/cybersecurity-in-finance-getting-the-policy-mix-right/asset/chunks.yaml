    一个专门为金融部门设计的基金可能是解决方案吗？可以与 2014 年建立的`单一决议基金`（Single Resolution Fund）进行类比。该基金可由`单一决议委员会`（Single
    Resolution Board）使用，以确保处置工具的有效应用，并行使授予`单一决议委员会`用于管理陷入困境的大型银行的处置权。该基金仅在银行需要进行决议时方可使用。决议基金的一个特点是它完全由金融机构出资。⁵²
    是否应该仅针对金融部门的网络风险建立一个类似的基金？在金融部门，处理网络攻击时应考虑其对金融稳定性的潜在影响。目前，如框 1 所示，还没有成功的网络攻击能够引发金融部门的系统性风险。然而，没有人知道未来是否会发生这种情况。总而言，鉴于金融部门网络风险与系统性风险之间仍存在模糊的关系，没有充分理由开发一个仅针对金融部门的应急网络基金。这应该由银行自行决定。那么针对所有关键服务运营者的基金又如何？如果要为特定部门或利益相关者设计应急网络基金，一种可能性将其扩展到所有已被评估为网络安全关键的运营者。例如，`NIS`(2016)
    要求成员国列出七个部门的关键服务运营者：能源（电力）、交通（航空、铁路、水路和道路）、银行（信用机构）、金融市场基础设施（交易场所、中央结算对手）、健康（医疗机构）、水务（饮用水供应和分配）以及数字基础设施（互联网交换点、域名服务提供商、顶级域名注册机构）。欧盟的一种选择是评估为这些不同运营者开发一种结合私人和公共资金混合基金的可能性和必要性。


