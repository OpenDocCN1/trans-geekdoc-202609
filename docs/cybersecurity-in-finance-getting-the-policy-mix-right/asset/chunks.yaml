    the content of incident reporting to inform and advise CSIRTs in return. One of
    the options to achieve two-way flows concerns the development of specific network
    infrastructure channels that provide secure messaging services. This would imply
    that financial firms use a common application to report incidents. The development
    of SWIFT messages on the interbank market could be inspirational in this respect.
    In the end, information about cyber-incidents could be sent and received in a
    secure, standardised and reliable environment. This model should contribute to
    streamlining incident reporting processes. High standardisation of templates should
    in principle increase processing speed and response. Given that speed is one of
    the main criteria for coping with large-scale cyberattacks, this benefit could
    be precious. However, one of the main issues to address in order to create a common
    application for cyber-incidents concerns the nature and type of information encoded
    in the message. The diversity of templates across pieces of legislation (and likely,
    for two of them, across countries) can be justified by the fact that each piece
    of legislation has a specific purpose.^(15) The development of standard messages
    should ensure that this diversity can be replicated in that new system. The different
    authorities need to be able to retrieve the right information within the expected
    time. There is a significant risk that incident reporting based on standard messaging
    services might end up being too generic to be adequately exploited by CSIRTs and
    authorities.^(16) Should the financial sector decide in any event to go in that
    direction, questions would remain about the funding of such an application: Should
    it be funded by financial firms? by governments, for the sake of cybersecurity?
    Or should it be a hybrid model combining both funding channels? Issue 4. Assessing
    the possibility of developing a centralised hub A hub should be developed with
    the objective of centralising all incident reports and dispatching them to the
    right authorities. The hub could be in charge of incident reporting for the whole
    financial sector and handle relationships with all concerned authorities, regardless
    of whether these authorities are national or European, and cover all sectors or
    only the financial sector. In return, the hub would be in charge of informing
    and advising financial firms on cyber-incidents. By centralising all incident
    reports for the financial sector, the hub would have a broad and clear picture
    at any given time of the cyber-risks in this sector. Strong analytical capabilities
    would be needed in this respect. The purpose would not be to have a hub that is
    only a dispatcher of incident reports. The hub could also play the role of coordinator
    between, on the one hand, all authorities in charge and, on the other hand, authorities
    and CSIRTs. Given the global nature of cyber-insecurity, the hub should be established
    at European level. The mandate of existing European agencies such as ENISA could
    be significantly extended to cover these complex tasks or a new agency could be
    built from scratch to focus primarily on these attributes. *A priori*, the former
    option that builds upon the existing institutional framework would be preferable.
    The objective is to avoid the multiplication of EU agencies that cover broadly
    similar topics. But, in order to be able to handle all reporting requirements
    and distribute key information to the right stakeholder, the chosen agency will
    need a large amount of resources in terms of staff and budget. In order to fulfil
    its mission of technical adviser, the centralised hub would also need a clear
    mandate from regulators. Issue 5. Assessing the possibility of covering all economic
    sectors So far, many of the recorded large-scale cyberattacks not only have affected
    more than one country; they have also disrupted more than one sector. The institutional
    framework therefore needs to handle a multi-sectoral dimension. The objective
    is to ensure that any cyberattacks are confined to one or a few firms in a specific
    sector and do not spread to others. If there is for example a high risk of a cyber-incident
    spreading from the energy sector to the financial sector, the supervisor should
    be able to provide real-time information to financial firms on the nature of the
    attack and, if possible, on the best way to respond to it. Two options can be
    considered to cover the multi-sectoral dimension of cyberattacks. The first is
    to build a centralised hub that is in charge of all sectors including the financial
    one. The second concerns the establishment of a multi-sectoral network for cyber-incidents
    where one hub is developed for each sector of the economy: finance, energy, telecommunications,
    food, etc. Each hub would be in charge of one given economic sector for everything
    that relates to the dispatching of incident reports, notification and advice of
    firms in return, coordination of all stakeholders, etc.^(17) In order to handle
    multi-sectoral attacks, a network of sectoral hubs would be established, preferably
    at European level, with a hub of hubs. The preferred option should be the centralised
    hub for the whole EU economy. One of the main risks of a network of sectoral hubs
    is the development of sectoral silos that struggle to find agreement on relevant
    topics. The quality of information sharing processes might also decrease in a
    network of hubs, given the greater complexity of such processes and the greater
    risks of some sectoral hubs being unaware of the need to provide the right information
    to the right counterpart. The establishment of a centralised hub for the whole
    economy would nonetheless require expertise from the different sectors in order
    to properly understand the peculiarities. '
