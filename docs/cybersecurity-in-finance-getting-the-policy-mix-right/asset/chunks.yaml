- fmt: "\nWith the inexorable rise of e-commerce comes the inexorable rise of the\
    \ e-criminal. Cybercrime is now the world’s fastest growing crime. It has leapt\
    \ to number two of the top ten business risks worldwide, from not even appearing\
    \ in that list five years ago. For certain countries, cyberattack is now the risk\
    \ of greatest concern. Gone are the days of concern about a low level hack of\
    \ a website by a script kiddie. Today’s attackers are multi-faceted and increasing\
    \ in sophistication, ranging from advanced persistent threats, corporate espionage,\
    \ organised crime and ‘hactivists’ to cyberterrorists, ever more competent, and\
    \ ever better funded. Cybersecurity has moved from being a technical issue to\
    \ a political and boardroom issue. Financial markets are particularly important\
    \ as they oil the wheels of all member state economies. So what should the priorities\
    \ of cybersecurity be? Is the rise of cybercrime so fast and extensive that we\
    \ should be changing the focus more to one of cyber resilience? There are three\
    \ core themes to address: 1. Governance (at all of organisational, international\
    \ and national levels) 2. Risk Management (both contextually and intelligence\
    \ driven) 3. Capability (cybersecurity by design and by default, using a standard\
    \ framework applied to context) There is a multitude of issues that the financial\
    \ sector needs to address. Our Task Force has chosen to focus on certain key issues\
    \ rather than attempt to produce an encyclopaedic tome. Any report can only represent\
    \ a snapshot in time and it will be particularly important to continue to communicate\
    \ as technology and the threat advances. I hope that the work that our Task Force\
    \ has undertaken in producing this report will make a valuable contribution to\
    \ the advancement of cybersecurity policy and protection and safeguarding of the\
    \ economies of the EU member states and the financial markets on which they depend.\
    \ Richard Parlour Chairman of the Task Force June 2018 \n\n# EXECUTIVE SUMMARY\n\
    \nAmid several large cyberattacks in 2017, the European Commission adopted in\
    \ September 2017 its multi-sector cybersecurity package. Whereas this initiative\
    \ should contribute to strengthening the cyber-resilience and response of EU financial\
    \ firms, several policy issues and unanswered questions remain. In order to analyse\
    \ the issues that are considered to be relevant to financial fields (retail banking,\
    \ corporate banking, capital markets, financial infrastructure and insurance),\
    \ CEPS-ECRI organised a Task Force between September 2017 and May 2018 with a\
    \ group of experts from the financial industry, tech industry, national supervisors\
    \ and European institutions, as well from one consumer association and one law\
    \ firm. Nine more policy issues need to be further addressed in order to bolster\
    \ the financial industry’s cyber-resilience against current and future threats.\
    \ These issues are itemised below, followed by a more in-depth discussion of each\
    \ issue. \n\n## Main policy recommendations\n\n1. Convergence in the taxonomies\
    \ of cyber-incidents is needed.\n2. The framework for incident reporting needs\
    \ to be greatly improved to fully contribute to the cyber-resilience of financial\
    \ firms.\n3. Authorities should assess how and to what extent the data held by\
    \ the centralised hub should be shared with supervisors, firms and clients.\n\
    4. Ambitious policies are needed to develop consistent, reliable and exploitable\
    \ statistics on cyber-trends.\n5. Best practices for cyber-hygiene should be continuously\
    \ enhanced by regulators and supervisors.\n6. The European Cybersecurity Certification\
    \ Scheme needs to be strengthened to contribute better to cybersecurity, cyber-risk\
    \ management and capability.\n7. In order to improve the processes of attribution\
    \ and extradition, the reinforcement of cross-border cooperation and legal convergence\
    \ remains a priority, both within the EU and more widely.\n8. Best practices in\
    \ remedies in case of cyberattacks need to be further encouraged.\n9. Policy-makers\
    \ should further assess the pros, cons and feasibility of creating an emergency\
    \ fund in case of large cyberattacks. \n\n## 1. A common taxonomy for cyber-incidents\n\
    \nA common taxonomy across regulations, jurisdictions and sectors should ease\
    \ the understanding of multi-country and multi-sector cyberattacks, and eventually\
    \ strengthen the quality of responses. Given the ever-changing nature of cyberspace,\
    \ the reference taxonomy should be flexible enough to be revised on a regular\
    \ basis. Also, for better readability by `CSIRTs`, this common taxonomy should\
    \ include specific sections on the variants applicable to different sectors, if\
    \ relevant. Wherever possible, convergence in templates for incident reporting\
    \ is needed across legislation. However, given the diversity in the purposes of\
    \ legislation, full harmonisation in those templates remains challenging. \n\n\
    ## 2. Need to develop an efficient legislative and institutional framework for\
    \ incident reporting\n\nThe emergence of different reporting requirements (notably\
    \ in `GDPR`, `PSD2`, `NIS Directive`, `ECB/SSM`, `eIDAS regulation` and `Target\
    \ 2`) raises questions about what is the most adequate framework for boosting\
    \ the cyber-resilience of financial firms. For that purpose, regulators, supervisors\
    \ and financial firms need to address five issues. First, national templates for\
    \ the `NIS Directive` and the `GDPR` should be harmonised across the EU. Secondly,\
    \ large firms active in different countries need to develop adequate consolidation\
    \ processes of the “overall-risk” at group level. Thirdly, authorities should\
    \ be able to exploit the content of incident reporting to inform and advise `CSIRTs`.\
    \ For that purpose, policy-makers and firms should assess together the risks and\
    \ opportunities of developing a system of messaging services. Fourthly, the creation\
    \ of a European sectoral hub for finance in charge of centralising all incident\
    \ reports, dispatching the right information to stakeholders and advising both\
    \ authorities and `CSIRTs` could greatly reinforce the incident reporting framework.\
    \ Finally, in order to create a resilient cybersecurity framework that could efficiently\
    \ handle multi-sectoral cyberattacks and prevent contagion from one sector to\
    \ another, the hub should also be able to cover all the other sectors of the EU\
    \ economy.\n\n## 3. Sharing of the data held by the centralised hub with supervisors,\
    \ firms and clients\n\nAuthorities should encourage the set-up of platforms aimed\
    \ at facilitating the voluntary exchange of cyber-information between financial\
    \ firms. In parallel, authorities should ensure that incident reporting requirements\
    \ fully contribute to the cyber-resilience of financial firms. For that purpose,\
    \ when deemed pertinent, the information contained in incident reporting should\
    \ be quickly shared with the most relevant stakeholders. First, the centralised\
    \ hub in charge of incident reporting should quickly provide relevant supervisors\
    \ with the right information on cyberattacks. Secondly, the hub also needs to\
    \ share relevant information with financial firms, provided that the right balance\
    \ is found between building up an efficient collective response to cyberattacks\
    \ and safeguarding firms’ interests. To provide technical assistance to those\
    \ firms, the hub would need a clear mandate from regulators. Sharing some information\
    \ with firms’ potential clients through the development of cyber-ratings that\
    \ mirror the cyber-risk to which each supplier, and therefore their potential\
    \ clients, is exposed should be based on market rather than regulatory initiatives.\
    \ Whatever policy options are selected, tight security of the data managed by\
    \ the centralised hub should be considered one of the main priorities. \n\n##\
    \ 4. The need to build a benchmark for macro statistics\n"
  raw: "With the inexorable rise of e-commerce comes the inexorable rise of the e-criminal.\
    \ Cybercrime is now the world’s fastest growing crime. It has leapt to number\
    \ two of the top ten business risks worldwide, from not even appearing in that\
    \ list five years ago. For certain countries, cyberattack is now the risk of greatest\
    \ concern. Gone are the days of concern about a low level hack of a website by\
    \ a script kiddie. Today’s attackers are multi-faceted and increasing in sophistication,\
    \ ranging from advanced persistent threats, corporate espionage, organised crime\
    \ and ‘hactivists’ to cyberterrorists, ever more competent, and ever better funded.\
    \ Cybersecurity has moved from being a technical issue to a political and boardroom\
    \ issue. Financial markets are particularly important as they oil the wheels of\
    \ all member state economies. So what should the priorities of cybersecurity be?\
    \ Is the rise of cybercrime so fast and extensive that we should be changing the\
    \ focus more to one of cyber resilience? There are three core themes to address:\
    \ 1. Governance (at all of organisational, international and national levels)\
    \ 2. Risk Management (both contextually and intelligence driven) 3. Capability\
    \ (cybersecurity by design and by default, using a standard framework applied\
    \ to context) There is a multitude of issues that the financial sector needs to\
    \ address. Our Task Force has chosen to focus on certain key issues rather than\
    \ attempt to produce an encyclopaedic tome. Any report can only represent a snapshot\
    \ in time and it will be particularly important to continue to communicate as\
    \ technology and the threat advances. I hope that the work that our Task Force\
    \ has undertaken in producing this report will make a valuable contribution to\
    \ the advancement of cybersecurity policy and protection and safeguarding of the\
    \ economies of the EU member states and the financial markets on which they depend.\
    \ Richard Parlour Chairman of the Task Force June 2018 \n\n# EXECUTIVE SUMMARY\n\
    \nAmid several large cyberattacks in 2017, the European Commission adopted in\
    \ September 2017 its multi-sector cybersecurity package. Whereas this initiative\
    \ should contribute to strengthening the cyber-resilience and response of EU financial\
    \ firms, several policy issues and unanswered questions remain. In order to analyse\
    \ the issues that are considered to be relevant to financial fields (retail banking,\
    \ corporate banking, capital markets, financial infrastructure and insurance),\
    \ CEPS-ECRI organised a Task Force between September 2017 and May 2018 with a\
    \ group of experts from the financial industry, tech industry, national supervisors\
    \ and European institutions, as well from one consumer association and one law\
    \ firm. Nine more policy issues need to be further addressed in order to bolster\
    \ the financial industry’s cyber-resilience against current and future threats.\
    \ These issues are itemised below, followed by a more in-depth discussion of each\
    \ issue. \n\n## Main policy recommendations\n\n  1. Convergence in the taxonomies\
    \ of cyber-incidents is needed.   2. The framework for incident reporting needs\
    \ to be greatly improved to fully contribute to the cyber-resilience of financial\
    \ firms.   3. Authorities should assess how and to what extent the data held by\
    \ the centralised hub should be shared with supervisors, firms and clients.   4.\
    \ Ambitious policies are needed to develop consistent, reliable and exploitable\
    \ statistics on cyber-trends.   5. Best practices for cyber-hygiene should be\
    \ continuously enhanced by regulators and supervisors.   6. The European Cybersecurity\
    \ Certification Scheme needs to be strengthened to contribute better to cybersecurity,\
    \ cyber-risk management and capability.   7. In order to improve the processes\
    \ of attribution and extradition, the reinforcement of cross-border cooperation\
    \ and legal convergence remains a priority, both within the EU and more widely.\
    \   8. Best practices in remedies in case of cyberattacks need to be further encouraged.\
    \   9. Policy-makers should further assess the pros, cons and feasibility of creating\
    \ an emergency fund in case of large cyberattacks. \n\n## 1. A common taxonomy\
    \ for cyber-incidents\n\nA common taxonomy across regulations, jurisdictions and\
    \ sectors should ease the understanding of multi-country and multi-sector cyberattacks,\
    \ and eventually strengthen the quality of responses. Given the ever-changing\
    \ nature of cyberspace, the reference taxonomy should be flexible enough to be\
    \ revised on a regular basis. Also, for better readability by CSIRTs, this common\
    \ taxonomy should include specific sections on the variants applicable to different\
    \ sectors, if relevant. Wherever possible, convergence in templates for incident\
    \ reporting is needed across legislation. However, given the diversity in the\
    \ purposes of legislation, full harmonisation in those templates remains challenging.\
    \ \n\n## 2. Need to develop an efficient legislative and institutional framework\
    \ for incident reporting\n\nThe emergence of different reporting requirements\
    \ (notably in GDPR, PSD2, NIS Directive, ECB/SSM, eIDAS regulation and Target\
    \ 2) raises questions about what is the most adequate cyber-incident framework\
    \ for boosting the cyber-resilience of financial firms. For that purpose, regulators,\
    \ supervisors and financial firms need to address five issues. First, national\
    \ templates for the NIS Directive and the GDPR should be harmonised across the\
    \ EU. Secondly, large firms active in different countries need to develop adequate\
    \ consolidation processes of the “overall cyber-risk” at group level. Thirdly,\
    \ authorities should be able to exploit the content of incident reporting to inform\
    \ and advise CSIRTs in return. For that purpose, policy-makers and firms should\
    \ assess together the risks and opportunities of developing a system of standard\
    \ messaging services. Fourthly, the creation of a European sectoral hub for finance\
    \ in charge of centralising all incident reports, dispatching the right information\
    \ to stakeholders and advising both authorities and CSIRTs could greatly reinforce\
    \ the incident reporting framework. Finally, in order to create a resilient cybersecurity\
    \ framework that could efficiently handle multi-sectoral cyberattacks and prevent\
    \ contagion from one sector to another, the hub should also be able to cover all\
    \ the other sectors of the EU economy. \n\n## 3. Sharing of the data held by the\
    \ centralised hub with supervisors, firms and clients\n\nAuthorities should encourage\
    \ the set-up of platforms aimed at facilitating the voluntary exchange of cyber-information\
    \ between financial firms. In parallel, authorities should ensure that incident\
    \ reporting requirements fully contribute to the cyber-resilience of financial\
    \ firms. For that purpose, when deemed pertinent, the information contained in\
    \ incident reporting should be quickly shared with the most relevant stakeholders.\
    \ First, the centralised hub in charge of incident reporting should quickly provide\
    \ relevant supervisors with the right information on cyberattacks. Secondly, the\
    \ hub also needs to share relevant information with financial firms, provided\
    \ that the right balance is found between building up an efficient collective\
    \ response to cyberattacks and safeguarding firms’ interests. To provide technical\
    \ assistance to those firms, the hub would need a clear mandate from regulators.\
    \ Sharing some information with firms’ potential clients through the development\
    \ of cyber-ratings that mirror the cyber-risk to which each supplier, and therefore\
    \ their potential clients, is exposed should be based on market rather than regulatory\
    \ initiatives. Whatever policy options are selected, tight security of the data\
    \ managed by the centralised hub should be considered one of the main priorities.\
    \ \n\n## 4. The need to build a benchmark for macro statistics"
