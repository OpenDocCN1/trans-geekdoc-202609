    As cyberattacks increase in sophistication, the EU cyber package provides the
    right opportunity to develop an ambitious EU cyber-policy in the financial sector.
    However, several issues still need to be addressed to raise the cyber-resilience
    of financial firms and improve the response in case of attacks. The emergence
    of a coherent cyber-policy for financial firms will require the clear definition
    of the roles and responsibilities of the parties involved: end-users, industry,
    regulators and supervisors. In order to reduce cybercrime, consumers should practise
    cyber-hygiene whenever relevant and possible. Cyber-education and consumer awareness
    are key to promoting this behaviour. Good governance is essential within financial
    firms. Well-informed boards that understand cyber-threats can set a realistic
    risk appetite and challenge their executives with good quality management information.
    This notably implies the promotion of cyber-hygiene at all levels of the organisation,
    as well as the continuous sharing of relevant information with authorities and
    other firms. Regulators should ensure that the most adequate rules and institutional
    frameworks are in place to boost the cyber-resilience of financial firms. Regulators
    need to be agile to respond to the ever-changing nature of cyberspace. While the
    prevention of cyberattacks and the reinforcement of cyber-resilience are the key
    objectives of regulators and supervisors, rules still need to be created and reinforced
    to shape mechanisms in case of attacks. In particular, this report emphasises
    the need to improve the processes for attribution, extradition, emergency funding
    and remedies. Supervisors should support the information sharing on cybersecurity
    issues and ensure incident reporting requirements can significantly contribute
    to the cyber-resilience of financial firms. This could imply that specific cyber-bodies
    would play the role of technical advisers. In order to be fully operational, one
    cyber-agency would need a clear mandate from regulators on the nature of their
    missions and on the types of tools they can use to achieve their objectives.


