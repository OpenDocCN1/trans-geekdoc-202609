    关于金融和保险服务中最常见的网络攻击类型，有很多统计数据。尽管不同来源的这些统计数据存在差异，但总体上有一个广泛的共识：拒绝服务（`DoS`）⁵、网络应用程序攻击和支付卡盗刷⁶构成了绝大多数的安全事件。正如预期的那样，这些攻击的最常见动机是财务利益，而小部分是由间谍活动和其他目的驱动的。对于绝大多数网络攻击而言，泄露的数据是凭据。个人数据和支付数据的占比要小得多。很大比例的网络攻击的影响有限，仅影响一个或少数个人。但在过去的十年中，金融领域已识别出几次大规模网络攻击，对短期和长期都产生了显著影响。如表
    11 所示，这些广泛的攻击影响了广泛的金融领域：零售支付、医疗保险、投资、消费信贷、信贷登记处等。似乎金融部门的任何领域都可能成为大规模网络攻击的目标。


    ### 框 1. 特 esco 银行网络攻击：直接影响消费者的攻击案例


    针对英国特斯科 银行的网络攻击展示了此类攻击的消费者维度，以及消费者对可靠、关键数字基础设施的依赖。2016 年 11 月 5 日至 6 日周末，特斯科 银行的客户经历了账户欺诈以及支付卡和账户被封的情况。约
    9,000 名客户的在线银行账户资金被盗，总损失金额达 250 万英镑。其他客户则因特斯科网上银行系统运行临时暂停而受到影响。此外，卡片暂时无法在 ATM
    机和 POS 终端上进行交易和支付。这次网络攻击损害了银行的声誉，并给客户带来了不便。虽然特斯科 银行承担了攻击成本并全额退还了受影响客户的资金，但这次网络攻击引发了对关键数字支付系统（如在线银行和支付卡交易）安全的质疑。特斯科
    银行在攻击之前的七年中投入了 5 亿英镑构建其在线技术平台。这项投资未能阻止黑客大规模地利用特斯科在线银行系统中的漏洞。大多数网络专家评论说，每个 IT 系统都有弱点，即使是最复杂的系统也是如此。对消费者以及金融机构的普遍意义是：银行提供的在线产品和服务越多，它们面临网络威胁的风险就越大。在这种背景下，最恰当的做法应该是什么？消费者能否保护自己免受此类攻击？虽然不存在针对网络攻击的绝对保护，但消费者和银行需要遵循网络卫生原则，这些原则在报告稍后的部分详述（见第
    5.1 节）。然而，特斯科 银行网络攻击的案例表明，当金融机构的 IT 系统成为复杂攻击的目标时，消费者的行动能力受到了限制。


