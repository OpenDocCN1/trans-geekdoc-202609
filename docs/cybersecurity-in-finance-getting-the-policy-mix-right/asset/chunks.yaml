    ## 脚注


    ⁷ 规例文本可以在[`eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32016R0679&from=EN`](http://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32016R0679&from=EN)找到。⁸
    指令文本可以在[`eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32015L2366&from=EN`](https://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32015L2366&from=EN)找到。⁹
    指令文本可以在[`eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32016L1148&from=EN`](http://eur-lex.europa.eu/legal-content/EN/TXT/PDF/?uri=CELEX:32016L1148&from=EN)找到。¹⁰
    指令文本可以在[`ec.europa.eu/futurium/en/system/files/ged/eidas_regulation.pdf`](https://ec.europa.eu/futurium/en/system/files/ged/eidas_regulation.pdf)找到。¹¹
    关于欧洲央行（ECB）事件报告的一些要素可以在[www.bankingsupervision.europa.eu/press/publications/newsletter/2017/html/ssm.nl170517_3.en.html](http://www.bankingsupervision.europa.eu/press/publications/newsletter/2017/html/ssm.nl170517_3.en.html)找到。¹²
    关于 TARGET 2 的一些要素可以在[www.ecb.europa.eu/explainers/tell-me/html/target2.en.html](http://www.ecb.europa.eu/explainers/tell-me/html/target2.en.html)找到。与
    PSD2、eIDAS、GDPR 和 NIS 不同，TARGET2 是一个市场基础设施而非立法。TARGET2 提供了一些指南，要求相关企业在发生事件时通知国家中央银行。¹³
    参见《参考事件分类分类法、工作组状态及未来道路》，ENISA, 2018 年 1 月（[www.enisa.europa.eu/publications/reference-incident-classification-taxonomy](http://www.enisa.europa.eu/publications/reference-incident-classification-taxonomy)）。¹⁴
    例如，ENISA (2018) 鼓励分类法所有者在“标签（Tag）”字段中使用“其他”或“未知”作为修订分类法的指标。如果该类别的同类型事件或事件增加，则可以使用该字段。¹⁵
    模板的统一是一项明确的政策目标，但考虑到各项法律文件的目的不同，以及各国监管机构所追求的利益也不同，完全统一将非常具有挑战性。然而，努力实现欧洲或国际标准更具收敛性的实施是值得的。在现有的网络事件报告法律框架内，确实存在统一的可能性。例如，Target2
    模板的部分内容与 ENISA 提供的 NIS 模板相似。Target2 模板中的“事件描述”、“事件原因”和“补救措施”部分可能与相应 NIS 模板中的“安全事件一般描述”、“详细原因”和“缓解安全措施”部分具有相同的信息。¹⁶
    这种基于标准消息服务的事件报告示例是 SWIFT 的客户安全计划（CSP），它法律上要求所有参与的金融机构在网络威胁和事件发生后立即报告并共享其信息。在 SWIFT
    的情况下，CSP 受“信息共享与分析中心”的支持，以利用收集的数据进行共享和分析。目前尚无法确定该机制范围，但根据初步证据，目前的使用情况可能有限。¹⁷ 对于金融部门，考虑到现有任务分配在多个监管机构（国家中央银行、欧洲中央银行、双峰监管模式，包括一个负责宏观审慎、另一个负责微观审慎任务的监管机构等），开发一个涵盖欧洲级行业枢纽任务的新机构可能是首选方案。


    # 3.   优化信息共享


    ## 3.1 不同的信息共享模型


