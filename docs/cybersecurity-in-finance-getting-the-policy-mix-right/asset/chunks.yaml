- fmt: "\nAs analysed in chapter 2, an important pillar of the proposed new European\
    \ hub for cyber-incidents should be incident information sharing across different\
    \ stakeholders. Financial firms and supervisors would benefit from sharing such\
    \ information, in the form of higher reactivity on the regulatory side and stronger\
    \ cyber-resilience capabilities on the financial sector side. Questions remain\
    \ about how and to what extent customers could benefit from this information sharing.\n\
    \nCurrently, there are three leading models of cyber-incident information sharing\
    \ in place across Europe.\n\nFirstly, industry-led incident information sharing\
    \ schemes are based on the voluntary participation of financial institutions.\
    \ For example, the members of the “Investment Banking Special Interest Group for\
    \ Information Security” voluntarily share their knowledge of emerging risks and\
    \ threats with other firms of the financial sector.^(18) Additionally, on a global\
    \ and cross-sectional basis, there is the “Financial Services Information Sharing\
    \ and Analysis Centre”, which functions as a leading industry group for reducing\
    \ cybersecurity threats facing the financial sector.^(19) Regulators or supervisors\
    \ are not part of this incident information sharing scheme.\n\nSecondly, European\
    \ as well as national regulators and supervisors gather data on cybersecurity\
    \ incidents based on current regulatory requirements. In particular, this concerns\
    \ the `NIS Directive`, `GDPR`, `eIDAS`, `PSD2`, and the `ECB` with the `SSM` and\
    \ `Target 2`. Within regulators and supervisors, incident data can be stored and\
    \ combined, yet the information is generally not shared with the wider financial\
    \ sector.\n\nThirdly, two-way cyber-incident information sharing can be facilitated\
    \ by models of cooperation between authorities and the financial sector. Under\
    \ such a scheme, information sharing and analysis centres (`ISACs`) collect information\
    \ on cyber-threats and enable data sharing between the private and the public\
    \ sector.^(20) An example for such a joint initiative is the “Cyber Security Information\
    \ Sharing Partnership” in the UK, which effectively links financial firms to their\
    \ peers and technical advice from the National Cyber Security Centre in the UK.^(21)\
    \ Another example concerns the `ECB` which recently established the `Euro Cyber\
    \ Resilience Board (ECRB)` for pan-European Financial Infrastructures.^(22) \n\
    \nAccording to a recent study conducted by the World Bank, joint initiatives of\
    \ the public and private sectors are the best practice in cybersecurity reporting\
    \ and incident information sharing. Regulators are expected to establish common\
    \ risk and incident taxonomies as well as requirements for cybersecurity reporting,\
    \ based on which information sharing can be facilitated.^(23)\n\nTherefore, the\
    \ model for incident information sharing developed in this chapter is a centralised\
    \ hub for incident reporting, which should be set up by supervisors and combine\
    \ the different pieces of legislation (as highlighted in chapter 2). On the basis\
    \ of this centralised hub, two-way cyber-incident information sharing between\
    \ regulatory authorities and the financial sector can be established. This approach\
    \ should raise markedly the positive contribution of legal reporting requirements\
    \ to the cyber-resilience of financial firms and ensure that such requirements\
    \ do not only constitute an umpteenth compliance rule.\n\nA large amount of valuable\
    \ information that is not required in the forms of an incident reporting exercise\
    \ is exchanged within the first model of voluntary participation of financial\
    \ firms. The setup and development of such platforms need to be constantly encouraged\
    \ by supervisors, as they are a precious complement to the model based on incident\
    \ reporting requirements. In theory, the development of two parallel and non-interactive\
    \ models for cybersecurity information sharing is suboptimal, as it might raise\
    \ the complexity and fragmentation of information sharing. But, given the rapid\
    \ change in cyber-trends, the existence of two parallel models might be needed\
    \ to ensure sufficient flexibility and reactivity to changes in cybersecurity\
    \ and related challenges.\n\n## 3.2 Sharing of relevant information with different\
    \ types of stakeholders\n\n### 3.2.1 With other regulators and supervisors\n\n\
    Provided that it has sufficient analytical skills at its disposal, a centralised\
    \ hub managing reported cyber-breaches for the whole financial sector should be\
    \ able to better understand cyber-risks on a continuous basis. Fast response in\
    \ the sharing of information on risks with other relevant supervisors will be\
    \ key to developing a robust cyber-risk response framework. By receiving relevant\
    \ information, policy-makers could also have a better view on emerging threats,\
    \ thereby calibrating their policies in a more adequate manner.\n\n### 3.2.2 With\
    \ other financial firms\n\nAs emphasised in “Priority 3” of section 2.3, the objective\
    \ of the new infrastructure for incident reporting should be to develop bidirectional\
    \ flows. This notably implies that the hub in charge of gathering information\
    \ on cyber-incidents could share relevant information with other firms. The frontier\
    \ between what is deemed “relevant” and what is not will be at the discretion\
    \ of the centralised hub. As the relevant information most likely comes from one\
    \ or a few of the financial firms, this body should carefully choose the information\
    \ to share between companies, by ensuring that the right balance is found between\
    \ building up an efficient collective response to cyberattacks and safeguarding\
    \ firms’ interests.\n\nTo put it in another way, the sharing of this information\
    \ should for example help other firms protect themselves from an ongoing cyberattack,\
    \ whilst at the same time not distorting competition between those firms and not\
    \ providing firms with information on their competitors that could be used unfairly.\
    \ The sharing of information with firms for the purpose of better protection against\
    \ cyberattacks could be perceived as technical advice. The hub in charge of providing\
    \ this type of information will therefore need a clear mandate from regulators\
    \ to fulfil the mission of a technical adviser.\n\n### 3.2.3 With potential clients\
    \ of financial firms\n"
