    Many statistics can be found on the most common types of cyberattacks in financial
    and insurance services. Although differences can be observed in these statistics
    across sources, overall there is a broad consensus that denial of services (`DoS`),⁵
    web application attacks and payment card skimming⁶ represent the vast majority
    of security incidents. The most common motive for these attacks is, as expected,
    financial, whereas a small share is driven by espionage and other purposes. For
    the vast majority of cyberattacks, the compromised data are credentials. Personal
    and payment data represent a much smaller share. A large share of these cyberattacks
    has limited impact and affects only one or a few individuals. But, over the last
    decade, a few large-scale cyberattacks have been identified in the financial sector,
    with marked impact in both the short and long term. As shown in Table 1, these
    extensive attacks have affected a broad range of financial segments: retail payments,
    health insurance, investment, consumer credit, credit registers, etc. It seems
    that any segment of the financial sector can be the target of a large-scale cyberattack.


    ### Box 1. The Tesco Bank cyberattack: A case study of an attack directly impacting
    consumers

    The cyberattack on Tesco Bank in the UK showed the consumer dimension of such
    attacks and the dependency of consumers on reliable, critical digital infrastructure.
    On the weekend of 5-6 November 2016, Tesco Bank customers experienced fraud on
    their accounts as well as blocked payment cards and accounts. About 9,000 customers
    had money stolen from their online banking accounts, with total losses amounting
    to £2.5 million. Other customers were affected by the hack through a temporary
    suspension of Tesco’s web banking system’s operations. Furthermore, cards could
    temporarily not be used for transactions and payments at ATMs and POS terminals.
    The cyberattack damaged the bank’s reputation and caused inconvenience for its
    customers. While Tesco Bank has borne the costs of the attack and fully refunded
    affected customers, the cyberattack has raised questions about the security of
    critical digital payment systems, such as online banking and transactions with
    payment cards. Tesco Bank had invested £500 million in building its online technology
    platform in the seven years prior to the attack. This investment did not prevent
    hackers from exploiting a vulnerability in Tesco’s online banking system at scale.
    Most cyber-experts have commented that every IT system has a weakness, even the
    most sophisticated ones. The general implication for consumers as well as for
    financial institutions is that the more online products and services are provided
    by banks, the more vulnerable they are to cyber-threats. Against this background,
    what should the most adequate practices be? Can consumers protect themselves against
    these kinds of attacks? While there is no such thing as absolute protection against
    cyberattacks, consumers and banks need to follow the principles of cyber-hygiene,
    which are elaborated later in this report (see section 5.1). The case study of
    the Tesco Bank cyberattack, however, has demonstrated that the ability of consumers
    to act is constrained when the IT system of a financial institution is targeted
    by a sophisticated attack.


    ![Image](Images/2.png)![Image](Images/3.png)![Image](Images/4.png)![Image](Images/5.png)


    ## Footnotes


    ¹ The publication can be found at [www.ncsc.nl/english/current-topics/Cyber+Security+Assessment+Netherlands/cybersecurity-assessment-netherlands-2017.html](http://www.ncsc.nl/english/current-topics/Cyber+Security+Assessment+Netherlands/cybersecurity-assessment-netherlands-2017.html).
    ² In practice, most cyber experts believe that an IT system can hardly be completely
    cyber-secured, as there are too many threats both external and internal to ever
    reach this level of comfort. Cyber-risk can be reduced but not completely eliminated.
    ³ The UK’s National Cyber Strategy defines cyber-security as follows: in this
    strategy, ‘cyber-security’ refers to the protection of information systems (hardware,
    software and associated infrastructure), the data on them, and the services they
    provide, from unauthorised access, harm or misuse. This includes harm caused intentionally
    by the operator of the system, or accidentally, as a result of failing to follow
    security procedures. (See Section 2.11 in: [https://www.ncsc.gov.uk/content/files/protected\_files/document\_files/National%20Cyber%20Security%20Strategy%20v20.pdf](https://www.ncsc.gov.uk/content/files/protected_files/document_files/National%20Cyber%20Security%20Strategy%20v20.pdf)).
    ⁴ The publication can be found at [www.enisa.europa.eu/publications/enisa-position-papers-and-opinions/enisa-overview-of-cybersecurity-and-related-terminology](http://www.enisa.europa.eu/publications/enisa-position-papers-and-opinions/enisa-overview-of-cybersecurity-and-related-terminology).
    ⁵ Denial-of-service attack (`DoS attack`) is a cyberattack where the perpetrator
    seeks to make a machine or network resource unavailable to its intended users
    by temporarily or indefinitely disrupting services of a host connected to the
    Internet. Denial of service is typically accomplished by flooding the targeted
    machine or resource with superfluous requests in an attempt to overload systems
    and prevent some or all illegitimate requests from being fulfilled. ⁶ Credit card
    skimming is the act of using a skimmer to illegally collect data from the magnetic
    strip of a credit, debit or ATM card. This information, copied onto another bank
    card’s magnetic stripe, is then used by an identity thief to make purchases or
    withdraw cash in the name of the actual account holder.


