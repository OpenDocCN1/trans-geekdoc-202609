    \ with a malicious intent, the data held by the centralised hub would provide\
    \ any wrongdoer with a concise list of all previous cyber-breaches, as well as\
    \ the particular weaknesses of individual businesses or industries on an unprecedented\
    \ scale. The related cyber-risk should be therefore carefully handled. To this\
    \ end, the physical security of the data handled by the hub should be considered\
    \ one of the most crucial factors. Also, the hub should assess how and to which\
    \ extent such data could be anonymised or aggregated, so misappropriation of data\
    \ and illegitimate access to such data does not directly affect financial institutions\
    \ or their customers. Finally, questions remain as to the ability of the hub to\
    \ share sensitive data with entities from outside of the EU. Large-scale cyberattacks\
    \ often occur across different continents. In order to contribute to a strong\
    \ global response, should the centralised hub in the EU systematically share relevant\
    \ information with non-EU counterparts? To which extent, could international sharing\
    \ of firms’ incident data be performed? One key criterion concerns the state of\
    \ data protection in the corresponding country. Some mechanisms have already been\
    \ put in place by the EU for the case of personal data.^(25) It will be needed\
    \ to assess what type of legal mechanisms could be established for the international\
    \ sharing of firms’ data. \n\n## Footnotes"
