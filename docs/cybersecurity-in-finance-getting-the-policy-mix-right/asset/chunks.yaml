    找到。⁵ 拒绝服务攻击（`DoS attack`）是一种网络攻击，攻击者试图通过临时或无限地中断连接到互联网的主机服务，使其预期的用户无法使用机器或网络资源。拒绝服务通常通过向目标机器或资源发送过多的请求来实现，意图使系统过载，并防止部分或所有非法请求被处理。⁶
    信用卡盗刷是指使用读卡器非法地从信用卡、借记卡或 ATM 卡的磁条上收集数据。这些信息被复制到另一张银行卡的磁条上，然后被身份窃取者用以以账户持有人的名义进行购买或提取现金。

