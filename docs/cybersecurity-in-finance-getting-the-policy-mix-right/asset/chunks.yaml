    The absence of a benchmark for macro statistics on cyber-trends and the poor consistency
    across sources raise the risk that the cyber-strategies of firms and cyber-policies
    are not well-founded. If a centralised framework is developed for incident reporting,
    robust and relevant macro statistics could be developed at national and European
    level. Specifically, the creation of robust statistics on the financial impact
    of cyberattacks is necessary to better understand the overall impact of attacks
    and to adjust cyber-policies and strategies as needed. However, the complexity
    of measuring the financial impact at firm level has made it so far impossible
    to have consistent methodologies across organisations. A principle-based list
    should operate at EU level, with the aim of enhancing best practices to measure
    both “tangible” and “intangible” factors. Convergence should be achieved provided
    that collaboration is improved between cyber-authorities, CSIRTs, chief financial
    officers and chief information officers of organisations, authorities in charge
    of setting accountancy norms, etc.


    ## 5. Promoting cyber-hygiene


    Authorities should continue to enhance best practices in terms of cyber-hygiene.
    Principle-based lists should be updated on a regular basis. At present they should
    for example include conducting adequate education and awareness activities, updating
    programs regularly and patching systems, creating complex passwords and changing
    them frequently, using micro-segmentation, multifactor authentication and encryption
    of sensitive data, implementing the least privilege principle, developing an adequate
    strategy to handle shadow IT and establishing an incident response and reporting
    plan.


    ## 6. The European Cybersecurity Certification Scheme needs to be strengthened
    to contribute to improve cybersecurity


    Given the rising importance of digital technologies and their vulnerability to
    cyberattacks, authorities need to address persistent information asymmetries and
    the fragmentation of standards in national certifications. A European Cybersecurity
    Certification Scheme could be a powerful tool for reinforcing harmonisation, raising
    awareness and ensuring mutual recognition. Yet the current Commission’s proposal
    might lack practical operability and add unnecessary complexity. As the scheme’s
    success depends on the voluntary participation of the private sector, it is imperative
    that its value added exceeds its costs. With too many issues left unclear, the
    current European Cybersecurity Certification Scheme needs to be strengthened to
    have a clear positive impact on cybersecurity.


    ## 7. Reinforcing cross-border cooperation and legal convergence in order to improve
    the processes of attribution and criminalisation


    Authorities need to develop further a cross-border framework that facilitates
    the exchange of information and electronic evidence for the purpose of prevention,
    investigation and attribution of cross-border cybercrimes. When the cyber-criminals
    behind cross-border attacks are identified, there is a need for convergence in
    relevant national legal frameworks in order to facilitate their extradition.


    ## 8. Enhancing best practices in remedies after cyberattacks


    Best practices in remedies in case of cyberattacks need to be encouraged by EU
    and national supervisors through the creation of core principles. These principles
    should cover the use of robust methodologies to assess the degree to which firms
    and/or clients share the cyber-liability. They should also help firms assess when
    consumer financial compensation that goes beyond the actual financial loss incurred
    should be provided. Finally, these principles should also provide guidelines on
    the best type of remedies in case of data theft without immediate financial loss.


    ## 9. Assessing the pros, cons and feasibility of creating an emergency fund in
    case of large cyberattacks


    Authorities should assess further the pros, cons and feasibility of developing
    an emergency cyber-fund aimed at alleviating the risk of financial instability
    in case of major cyberattacks in the financial industry. Should the EU proceed
    in that direction, criteria for a cyber-incident to qualify and necessary conditions
    for the fund to be used will have to be well defined in advance. The benefits
    and costs of the different options available to create such a fund should be carefully
    analysed. In particular, could existing EU funding schemes for natural disasters
    be extended to large-scale cyberattacks? Who should bear the costs? Would it preferable
    to design a fund specifically for the financial sector? Or would it make more
    sense to create a fund that covers all operators of essential services, as defined
    in the `NIS Directive`?


    # 1. CHARACTERISATION OF CYBER-INCIDENTS


    ## 1.1 Definitions


    Cybersecurity can be defined as a particular state, which could be qualified as
    “optimal”, or as a collection of activities that ensures the achievement of a
    particular state. As defined by the Dutch Cybersecurity Supervisor (2017),¹ a
    system is cyber-secured when it reaches a state that is free of danger or damage
    caused by a disruption or failure of IT or through the abuse of IT.² ³ Overall,
    the danger or damage caused by abuse, disruption or failure may comprise a limitation
    on the availability and reliability of the IT, violation of the confidentiality
    of information stored in IT environments or damage to the integrity of that information.
    According to ENISA (2017),⁴ cybersecurity comprises all activities necessary to
    protect cyberspace, its users and impacted persons from cyber-threats. Cyberspace
    is the time-dependent set of tangible and intangible assets which store and/or
    transfer electronic information. The present report will use “cybersecurity” indistinctly
    as a state and as a collection of activities that ensures that state.


    ## 1.2 Types of cyberattacks in financial services

