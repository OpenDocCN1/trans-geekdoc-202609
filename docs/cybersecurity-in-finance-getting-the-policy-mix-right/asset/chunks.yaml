    首先，正如第 2 章强调的那样，整个 `EU` 和所有经济部门需要采用一种类似的网络事件分类法。这种分类法需要被 `CSIRTs` 社区广泛接受。这是跨机构、跨部门和国家制定一致统计数据的唯一途径。其次，应该开发一些工具来控制统计偏差。绝大多数网络事件很可能不会被报告。记录的缺失可能是故意的，因为公司不希望损害其声誉；也可能是无意的。在第
    2 章所分析的新规则背景下，随着报告网络事件义务的增加，前者的规模应当随之减少。整合了网络维度的定期审计对于确保金融机构系统性地合规至关重要。无意的缺失无法仅通过统计数据来纠正，而将依赖于能够持续检测攻击的内部网络安全系统的质量。第三，关于由哪个机构负责编制此类统计数据的问题仍然存在。如果基于行业枢纽的框架成为最终的制度选择，那么由这些枢纽负责编制和维护宏观统计将是完全合理的的。在这种情况下，需要强有力的协调以确保跨部门的方法论一致性。


    ## 4.2 鼓励财务影响统计的最佳实践


    关于财务影响的统计仍然存在一个大问题。这些信息对于更好地理解网络攻击的整体影响并根据需要调整网络政策和策略至关重要。然而，公司层面任务的复杂性使得目前无法在各机构之间建立一致的方法论。在网络攻击发生后，许多因素可能会触发财务成本。这些因素通常可以分为“有形”因素和“无形”因素。在“有形”因素中，包括停机导致的收入损失、基础设施损坏、实施补偿措施的成本、技术调查、客户违约通知、监管合规、公共关系、律师费和诉讼费用、知识产权损失等。衡量这些成本的一个典型挑战在于它们出现的时间跨度。成本确实可能在多年后被触发。例如，对罪犯的识别、引渡和起诉可能需要多年时间，导致整个过程中产生反复的法律调查成本。另一方面，“无形”因素也会引发重大的财务影响：损失的合同收入价值、商誉的贬值等。“无形”因素往往比“有形”因素更难准确衡量。然而，对无形因素产生的成本进行充分估计，对于形成成功攻击整体财务影响的准确图景至关重要。促进使用稳健的方法论来量化成功攻击的整体财务影响，应该是监管机构和管理者的优先事项之一。可以在
    `EU` 层面制定一份基于原则的清单，旨在加强国家层面实践的趋同。该清单对于估计无形因素产生的成本特别需要，并将鼓励损害量化方法、估值方法等的标准化。只要加强网络安全部门、`CSIRTs`、机构首席财务官和首席信息官以及负责制定会计准则的机构之间的协作，就可以实现趋同。应当仔细评估通过事件报告共享财务影响信息的可能性。最终，如果观察到财务评估的趋同，就可以根据网络攻击的聚合财务影响开发更可靠的宏观数据。


