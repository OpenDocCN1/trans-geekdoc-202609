    大型网络攻击造成的损害对金融机构和客户而言都可能是重大的。虽然大型保险公司现在为企业提供网络安全保险，但消费者通常没有针对网络安全风险的保险。正如表 1 中的案例所示，如乐购超市银行（Tesco
    Bank）在线银行系统被黑等网络攻击通过财务欺诈和/或身份盗窃影响消费者。这引发了网络攻击救济措施的重要问题。


    在网络攻击中，例如消费者的活期账户被挪用和/或个人数据被盗，其法律和监管后果是什么？


    第一个挑战是阐明客户和/或提供者对黑客攻击承担责任的何种程度。其次，可以将客户账户的财务欺诈与数据盗窃区分开来。前者会导致受影响的消费者或公司产生直接的财务损失。后者则影响客户的权利，因为数据以后可能被用于身份盗窃，并最终给客户带来财务损失。第三，需要评估每种情况的最优救济措施。


    虽然金融机构和消费者都是网络攻击的受害者，但对于如何评估一方或双方的错误或疏忽是否对攻击的发生负责任，仍然存在疑问。正如 De Werra 等人 (2018)
    (45) 所强调的，此类攻击导致的民事责任由于潜在责任制度的多样性（个人数据保护、产品责任法规等），引发了复杂的法律问题。对于“合理的网络安全措施”的监管标准可能会根据背景和受影响数据的性质而异。此外，当一系列参与方可能对攻击及其传播做出了贡献时（无论他们是否是无意为之），评估责任可能是具有挑战性的。


    专门针对金融部门，`PSD2` 的第 `73` 条和第 `74` 条为未经授权交易的背景提供了一些要素。如果证明消费者对未经授权的交易有责任，金融机构仍须在通知后承担其消费者的财务损失。然而，银行可以要求消费者承担部分财务损失，最高不超过
    `€50`。但是，如果未经授权交易的责任在于提供者，则 `PSPs`（支付服务提供商）必须立即还客户账户中的财务损失。对于这两种情况，`PSD2` 设定的监管标准通常有利于消费者，因为无论情况下其
    `PSPs` 都必须承担财务损失，但消费者责任情况下的 `€50` 门槛除外（见 `PSD2` 的第 `74` 条）。


    仔细观察 `PSPs` 方面责任的情况，根据 `PSD2`，`PSPs` 仅需遵循“所失即得”的最低原则。关于额外补偿，`PSD2` 的第 `73 (3)`
    条强调：


    > 进一步的财务补偿可以根据支付方与支付服务提供商之间签订的合同所适用的法律，或在适用的情况下，根据支付方与支付启动服务提供商之间签订的合同所适用的法律来确定。


    因此，消费者在 `PSD2` 中获得额外补偿的权利仍然很模糊。问题产生于，如何以及在何种程度上对客户因未经授权交易导致的不便进行补偿，例如在一段时间内无法使用支付卡或所有业务和服务的临时关闭。正如乐购超市银行案例所示，这些非财务后果可能是严重的。对建立更具系统性的补偿机制的优缺点进行进一步调查是理想的。


    责任和适当救济措施的问题也涉及针对数据盗窃的网络攻击。盗取个人数据通常不会直接造成财务损害，但它会影响消费者权利，因为数据以后可能被用于身份盗窃，反过来可能被用于财务欺诈。在当前的
    `PSD2` 和 `GDPR` 监管环境下，遭受数据盗窃的金融机构必须在规定范围内向其监管机构和消费者报告这些数据泄露。然而，为了鼓励最佳实践，金融机构不仅应通知客户，还应跟进实际损害。在这方面，`GDPR`
    的第 `82 (1)` 条强调：


    > 任何因违反本条例而遭受物质或非物质损害的人员，都有权从控制者或处理者处获得就遭受损害的补偿。


    该条例的序言 `Recital (75)` 特别提供了损害的各种示例，可能涉及声誉损害、个人数据机密性丧失等。责任的范围在 `GDPR` 的第 `82` 条中有明确定义，因为它仅涉及违反本条例的情况。然而，要准确量化数据盗窃造成的损害仍然具有挑战性。在这方面，正如未经授权交易背景下的额外补偿一样，是否应该开发一种更具系统性的补偿机制？


    欧盟委员会在其关于“构建欧洲数据经济”的公报 (2017) (46) 中，强调了其目标是“增强新兴技术背景下责任的法律确定性，从而为创新创造有利条件”。开发一种法律框架，其中“责任可以”被系统地“分配给对他人产生重大风险的市场参与者，或分配给最有利于最小化或避免此类风险发生的市场参与者”(47)，可能会激励企业加强其网络基础设施的质量。然而，可能会阻碍创新，因为金融机构在采用数字技术方面越创新，面临的诉讼风险就越大。


    由于金融机构需要遵守 `PSD2` 和 `GDPR`，未来几年将为评估金融领域责任分配和救济的最佳实践提供良好机会。法院案件对这些要素的定期监测可以帮助欧盟和国家监管机构编制一份最佳原则清单，并根据快速变化的网络格局进行定期调整。特别是，这些原则应涵盖使用稳健的方法来评估公司和/或客户承担网络责任的程度。它们还应帮助企业评估何时应提供超出实际损失的消费者财务补偿。最后，这些原则还应为没有直接财务损失的数据盗窃提供最佳救济类型的指南。


    ## 6.3 发生大型网络攻击时需要应急基金吗？


    在与网络安全包一起进行的影响评估中，委员会提到了开发 `欧盟网络安全应急基金` 的可能性。(48) 该基金定义如下：


    > 欧盟网络安全应急基金是在审查网络安全战略时参考其他政策领域现有危机机制提出的一项计划。它为成员国在发生重大事件时在欧盟层面寻求帮助提供了。它可以直接或间接地支持遭受网络攻击的公民、公司或政府部门。


    '
- fmt: '

    In an interview he gave on the occasion of presenting the Cybersecurity Package
    (13 September 2017), Commissioner `Andrus Ansip` made a parallel with the “need
    for emergency funding in case of a hurricane or an earthquake”. According to him,
    “It is the same story with large-scale cyber-attacks”. As regards the financial
    sector, the main advantage of an emergency cyber-fund would be to alleviate financial
    stability risk in case of major cyberattacks. The development of a fund to help
    financial firms recover from cyberattacks raises specific questions and needs
    to address specific issues.


    ## What type of damages could be funded?


    The impact assessment of the European Commission mentioned a few types of actions
    that could be funded through this fund:


    > The Fund could deploy a rapid response capability in the interests of solidarity
    and finance specific emergency response actions such as replacing compromised
    equipment or deploying mitigation or response tools to assist victims.


    Echoing the findings of section `3.1`, a proper estimation of the financial impacts
    of large cyberattacks will be needed. These statistics should contribute to shaping
    the fund and estimating the required aggregate amounts.


    ## Should existing EU schemes for natural disasters be extended to large-scale
    cyberattacks?


    EU support in case of natural disasters has been recently strengthened through
    the launch of a new EU financial mechanism in July 2017. Member states affected
    by a natural disaster can activate this special EU financial mechanism and fund
    reconstruction operations with an exceptional EU co-financing rate of 95% under
    a cohesion policy programme, instead of the programme’s normal co-financing. The
    EU needs to assess the possibility of extending existing EU funding schemes for
    natural disasters to large-scale cyberattacks.


    ### Cyber-incident criteria


    One of the main questions concerns the type of incident for which a special fund
    could be used. The term “major incidents” emphasised in the impact assessment
    could use the definition provided in the `Blueprint of the European Commission
    on Coordinated Response to Large Scale Cybersecurity Incidents and Crises (2017)`:


    > A cybersecurity incident affecting organisations in more than one Member State
    or even the entire Union with potential serious disruptions to the internal market
    and more broadly to the network and information systems on which the Union economy,
    democracy and society rely on... A cybersecurity incident may be considered a
    crisis at Union level when the disruption caused by the incident is too extensive
    for a concerned Member State to handle on its own or when it affects two or more
    Member States with such a wide-ranging impact of technical or political significance
    that it requires timely coordination and response at Union political level.


    Another criterion could concern the role of private insurance. Once all private
    insurance options have been exhausted, then the EU scheme could be activated.
    This would notably concern very large attacks that insurance companies are unable
    to handle. Whatever criteria are chosen for a successful cyberattack to qualify,
    the authority in charge of the fund will need to be able to assess very rapidly
    whether these criteria are fulfilled following a request to use the fund. Speed
    is indeed essential to ensuring an efficient response to a large scale attack.


    ## Box 2. Can cyberattacks be systemic?


    In recent years, one of the most intense debates with respect to cybersecurity
    has been over whether a systemic cyberattack can occur or is more myth than reality.
    Systemic risk is generally defined as the possibility that an event at the company
    level could trigger severe instability or collapse an entire industry or economy.
    The understanding of the systemic risk has been significantly refined since the
    financial crisis of `2008`.


    Two types of financial firms can be considered a systemic risk:

    1. The first concerns very large financial corporations and is often called “too
    big to fail”.

    2. The second relates to organisations that are highly interconnected with others.


    Systemic risk occurs when one firm considered “too big to fail” and/or “too connected
    to fail” collapses or is on the verge of doing so. Given the connectivity of such
    financial firms with the rest of the financial sector and the economy, the crisis
    can rapidly spread to most of the sector, thereby raising markedly financial instability
    and risks of other collapses.


    Typically, large financial crises are triggered by the economic behaviours of
    agents. For example, resulting from inadequate investments and/or sharp macroeconomic
    reversals, the publication of much higher than expected financial losses for a
    systemic bank could trigger a panic among a large share of investors and savers.
    The loss of confidence of agents in the ability of the bank to recover could result
    in bank runs (a large share of savers withdraw their liquidity) and the freezing
    of credit on the interbank market, as other banks believe the affected bank cannot
    reimburse them. Given the high interconnectedness between financial firms, the
    eventual collapse of the affected firm could result in a rapid propagation of
    the crisis to many other firms.


    The question is therefore whether a large cyberattack can affect one or several
    financial firms to an extent that economic agents lose confidence in the former’s
    ability to recover in the medium and long term. Major cyberattacks have already
    paralysed the IT systems of large financial firms via large-scale `DoS`, but generally
    during a limited period of time or within a specific part of the firm. So far,
    no cyberattack in the financial sector has approached what can be called a systemic
    risk. At worst, massive theft of consumer data, as was the case with `Equifax`,
    can raise serious concerns about the long term viability of the Internet. Yet
    this type of large attack has not resulted in significant economic disturbances.


    ## Does it mean that cyberattacks and systemic risk are and will remain two distinct
    elements?


    Does it mean that cyberattacks and systemic risk are and will remain two distinct
    elements in the financial sector? In our ever-changing world, this bet would be
    too risky to take. A very wide `DoS` paralysing most of the IT infrastructure
    of a few systemic banks could eventually result in a large loss of confidence
    among economic agents, thereby leading to serious economic disturbances. Should
    such a cyberattack occur during a large financial crisis, when economic agents
    have already lost significant confidence, then perhaps the systemic impact could
    become reality.


    ## What conditions must be respected?


    One of the main disadvantages of an EU Cybersecurity Emergency Fund concerns the
    problem of moral hazard. As their costs in case of attacks could be covered by
    the fund, some financial firms might be less cautious regarding the quality of
    their cybersecurity defences. There is therefore a risk that the establishment
    of a fund for cyber-incidents would alter the willingness of some financial firms
    to reinforce their cyber-resilience. Against this background, the most appropriate
    approach to solving the problem of moral hazard is defining several clear conditions
    for using the fund. Some possible remedies to address the problem of moral hazard
    have already been added to the impact assessment of the European Commission `2017)`.
    According to the assessment, member states could have access to such a fund only
    if:


    > They had put in place a prudent system of cybersecurity prior to the incident,
    including full implementation of the `NIS Directive`, mature risk management and
    respective supervisory frameworks at national level.

    '
