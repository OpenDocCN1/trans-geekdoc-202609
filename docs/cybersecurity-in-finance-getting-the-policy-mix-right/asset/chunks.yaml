- fmt: "\nThe opportunities offered by a centralised hub should also be assessed with\
    \ respect to bank clients. Typically, there has been an information asymmetry\
    \ between clients and their financial providers regarding the degree to which\
    \ the latter’s IT systems are cyber-secured. In other words, clients have had\
    \ relatively poor information on the cyber-risks to which their financial suppliers\
    \ are exposed. By forcing firms to inform consumers of breaches of their data,\
    \ the `GDPR` should increase transparency between consumers and their suppliers\
    \ for cybersecurity matters. However, when consumers are looking for a provider,\
    \ they have little information on how often and to what extent each supplier has\
    \ been the victim of cyberattacks, excluding media reports. \n\nOne possibility\
    \ would be to assess if the data managed by the hub can be used to build specific\
    \ ratings mirroring the cyber-risk to which each supplier, and therefore its clients,\
    \ is exposed. Should the sample of cyber-incidents recorded by the hub be sufficient,\
    \ labels could be elaborated in order to reinforce the protection of consumers\
    \ and corporations which use financial services. \n\nA potential rating may focus\
    \ on two different aspects of the cyber-issue:\n- “process” focus: the labelling\
    \ process could assess the quality of the processes used by the financial firms\
    \ to alleviate cyber-risks related for example to data breaches;\n- “result focus”:\
    \ while the “process focus” option places the emphasis on the quality of the means\
    \ used by the financial firms to limit cyber-risks, the “result focus” essentially\
    \ considers results. The latter can for instance reflect the number and gravity\
    \ of cyberattacks that have affected the firm in the previous year.\n\nExternal\
    \ ratings on the cyber-risks to which financial firms are exposed could generate\
    \ different advantages, especially by addressing some market dysfunctions. For\
    \ clients, such a practice should contribute to alleviating the risk of moral\
    \ hazard sparked by information asymmetries with respect to cybersecurity. Furthermore,\
    \ the choice made by clients should be eased with a consistent methodology of\
    \ assessment across the financial sector. As regards financial providers, external\
    \ ratings could help the best performing ones to highlight the benefits of their\
    \ offers when compared to those of their competitors. It could eventually encourage\
    \ more firms to raise their cybersecurity standards.\n\nNevertheless, the implementation\
    \ of external ratings systems can trigger significant risks and disadvantages.\
    \ First of all, the effectiveness of external ratings as a communication tool\
    \ can be questioned. For example, in the food industry, the use of labels for\
    \ clients has often been revealed as inconsistent. In addition, some clients may\
    \ simply lack interest in the information provided by the label. Even though clients\
    \ may be interested in the rating, many clients might find the use of ratings\
    \ difficult, as they contain too much information, much of it being not understood,\
    \ confusing and poorly presented. If customers do not trust the body providing\
    \ ratings on the cybersecurity of financial firms, such external ratings might\
    \ even be counterproductive. The reputation and credibility of the external assessor\
    \ are therefore essential to ensuring a proper rating system.\n\nFinally, and\
    \ this might be the main argument, there is a great risk that the use of cyber-ratings\
    \ could destabilise even further those financial firms with lower ratings. Low\
    \ ratings could provide incentives for cyber-criminals to launch other attacks\
    \ on firms with IT infrastructure that has been assessed as weak. Financial firms\
    \ that have been affected by a significant cyberattack could also see their rating\
    \ decrease rapidly as more attacks follow. In this context, there is a great risk\
    \ that the value of such ratings could prove to be too volatile to be exploitable.\
    \ Overall, given the number of risks and drawbacks, it is likely too early for\
    \ supervisors and regulators to develop such tools. The creation and use of cyber-ratings\
    \ should be based on market initiatives, not regulatory ones. Should cyber-ratings\
    \ be offered, supervisors should nonetheless ensure monitoring of their negative\
    \ effects.\n\n## 3.3 Need for a high level of protection of data held by the EU\
    \ hub\n\nThe data held by the centralised hub itself would require a high level\
    \ of security. With reference to the reporting standards prescribed by the `EBA`\
    \ guidelines in `Annex 2`,^(24), whether at the initial, intermediate or final\
    \ report stage, the level of detail required for incident reporting would have\
    \ to be carefully considered to ensure a sufficient level with which to draw meaningful\
    \ conclusions and also safeguard European companies’ interests. \n\nDespite this\
    \ principle, however, the centralised hub would require a lot of critical information\
    \ in order to be operational. If this information were to be obtained by third\
    \ parties with a malicious intent, the data held by the centralised hub would\
    \ provide any wrongdoer with a concise list of all previous cyber-breaches, as\
    \ well as the particular weaknesses of individual businesses or industries on\
    \ an unprecedented scale. The related cyber-risk should be therefore carefully\
    \ handled. To this end, the physical security of the data handled by the hub should\
    \ be considered one of the most crucial factors. Also, the hub should assess how\
    \ and to what extent such data could be anonymised or aggregated, so misappropriation\
    \ of data and illegitimate access to such data does not directly affect financial\
    \ institutions or their customers. \n\nFinally, questions remain as to the ability\
    \ of the hub to share sensitive data with entities from outside of the EU. Large-scale\
    \ cyberattacks often occur across different continents. In order to contribute\
    \ to a strong global response, should the centralised hub in the EU systematically\
    \ share relevant information with non-EU counterparts? To which extent, could\
    \ international sharing of firms’ incident data be performed? One key criterion\
    \ concerns the state of data protection in the corresponding country. Some mechanisms\
    \ have already been put in place by the EU for the case of personal data.^(25)\
    \ It will be needed to assess what type of legal mechanisms could be established\
    \ for the international sharing of firms’ data.\n\n## Footnotes\n"
