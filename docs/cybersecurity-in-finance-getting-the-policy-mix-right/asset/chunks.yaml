    # 6. 强化应对网络攻击响应的补充政策


    ## 6.1  归因认定与刑事化：加强跨境合作与法律趋同


    当网络攻击发生时，其两个特征使得管理工作变得尤为棘：全球化维度和日益增长的复杂性。互联网是基于“无边界原则”发展的。它所有的自主系统都使用同一种语言，即一组数据数据格式化、命名、寻址和路由标准，统称为“互联网协议”（Mueller,
    2017）。³⁸ 其中最基础的是互联网协议 (`IP`)。因此，网络空间通过确保全球范围内的技术兼容性而不断增长。由于网络空间主要是是全球性的，网络犯罪不分国界。很大比例的网络攻击可能是基于跨境的形式策划并发起的。A
    国的网络犯罪分子可以在 B 国拥有同事，使用 C 国的服务器，并目标指向 D 国的用户。鉴于这些攻击的复杂性，要对网络攻击的来源和目的地编制稳健的统计数据非常困难。一些研究人员试图开发相关的代理指标，例如使用全球蜜罐网络，³⁹
    来检测和评估黑客进行主动侦察⁴⁰ 的规模（F-secure, 2017）。⁴¹ F-secure 开发的一些统计数据显示，欧盟内部的跨境主动侦察源于欧盟边界之外。在
    2016 年下半年，据认为 `IP` 地址的主要来源国按重要性排序分别为：俄罗斯、荷兰、美国、德国和中国。大多数国家（包括俄罗斯）都是俄罗斯 `IPS` 的攻击目标。美国、荷兰、德国、中国和英国是蜜罐网络攻击的首要目标国家。金融机构处理跨境攻击的意愿面临着严峻挑战。首先，在攻击发生后，归因认定往往是一个复杂、昂贵且漫的过程，通常涉及外部专家和地方当局。⁴²
    该任务在跨境方面被证明更加复杂，因为目前为止，国家之间关于网络安全事务的信息交换监管较少，且通常需要使用“官方”官僚渠道。如果归因成功，对犯罪分子进行刑事化处理证明是另一项艰巨的任务。鉴于网络犯罪法缺乏统一，犯罪分子往往倾向于在没有网络犯罪法或法律不足以执行引渡请求的国家寻求庇护。此外，正如
    Hakmeh (2017) 所分析的，⁴³ 许多国家具有双重犯罪性要求，这意味着只有当引渡国也有类似的法律将该罪行定为犯罪时，嫌疑人才能被引渡到外国接受审判。因此，如果调查国之间的相关法律不一致，犯罪分子就可以逍遥在外。在此背景下，政策制定者和监管机构迫切需要制定一个框架，极大促进为了预防网络犯罪、调查和起诉所需的信息和电子证据交换。当跨境攻击背后的犯罪分子被识别后，需要各国法律框架趋同以促进其引渡。2018
    年 4 月，欧盟委员会提议了新规则，其目标是让警察和司法机关能够更容易、更快速地获取调查所需的电子证据，以抓捕并定罪罪犯和恐怖分子。⁴⁴ 此类拟议立法应有助于促进金融领域与网络攻击有关的调查和刑事化。对于跨境电子证据请求，采取雄进的方法对于该立法充分贡献于更好地处理跨境网络攻击至关重要。


    ## 6.2  发生网络攻击时补救措施的最佳实践


