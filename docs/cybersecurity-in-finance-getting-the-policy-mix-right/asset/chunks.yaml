    # 4. 网络趋势基准统计的需求


    ## 4.1 事件数量的统计数据


    ### 4.1.1 其他政策领域拥有其基准


    在政策倡议的初期，监管机构通常需要准确、一致且可验证的统计数据，以分析市场失灵和可能的补救措施。统计的一致性对于对现有和未来政策进行有效的影响评估是必要的。因此，在大多数情况下，每一组主要的欧洲政策都有一个相应的统计数据库。`ECB`依赖于其统计数据仓库中包含的大量宏观数据。²⁶
    欧洲委员会经济和财务总部产生的分析和报告使用`AMECO`年度宏观经济数据库。²⁷ `Eurostat`提供了用于分析大量欧洲和国家政策的统计数据：社会政策（特别是[欧盟收入与生活状况调查
    EU-SILC]²⁸、劳动力政策²⁹等）。


    ### 4.1.2 网络犯罪目前缺乏此类统计数据


    对于网络犯罪，尚未发现此类统计基准。负责网络安全的任务小组成员确认，他们使用各自组织产生的或咨询的统计数据。网络犯罪目前缺乏此类基准。由于来源高度碎片化，各具体元素呈现出高度多样性。目前该问题的基准现状如何？关于
    `ENISA` 的拟议草案第 `7.7` 条规定：


    > 为了更好地理解网络安全领域的挑战，并向成员国和欧盟机构提供长期建议，ENISA 需要与成员国以及适当与统计机构和其他合作收集相关信息，分析新兴技术，并对创新对网络安全（特别是网络安全）的预期社会、法律、经济和监管影响进行特定主题的评估。该机构还应通过成员国、欧洲组织的欧洲犯罪中心（EC3）以及
    `CERT-EU` 的公开信息、自身分析以及基于 `NIS` 指令的自愿报告定期编制网络安全威胁形势报告，支持成员国、欧盟机构和机构识别新兴趋势并预防与网络安全相关的问题。


    `ENISA` 应负责提供相关趋势的分析。然而，尚未为 `ENISA` 开发一套供政策制定者、当局及消费者参考的统计数据的明确策略或方法。目前没有在欧洲层面建立整合统计数据的指示。风险在于引用的来源继续保持碎片化，影响统计数据的价值。在来源一致性较差的情况下，组织网络政策和策略缺乏依据的风险将会增加。


