  trans: "\n\n不同报告要求的出现，对如何构建 `CSIRTs` 与机构之间关系的最恰立法和制度框架提出了问题。归根结底，其目标是确保该框架能够帮助金融机构免受网络攻击的侵害，并在发生网络攻击时，帮助这些机构启动及时且高效的响应。及时且高效的响应有助于有助于对公司遭受的短期和中期损害，在某些情况下还可能防止攻击扩散到其他公司和行业。所开发的框架应旨在尽可能地增强网络韧性和业务连续性。为了实现这一目标，监管机构、监督机构和金融机构应关注以下五个问题。\n\
    \n### 议题 1 欧盟范围内模板的趋同 \n对于每一项旨在制定事件报告机制的立法，都应确保欧盟范围内模板的趋同性。这一优先事项主要涉及 `NIS 指令`\
    \ 和 `GDPR`，因为相关的模板应主要在国家层面定义。\n\n关于 `GDPR`，`数据保护第 29 条工作组`和未来的`欧洲数据保护委员会`（后者将在\
    \ `GDPR` 生效后取代前者，见 `GDPR` 的`序言 139`）的角色之一应该是加强这些国家模板的协调性。\n\n### 议题 2 集团层面的适当治理\
    \ \n对于在不同司法管辖区开展活动的金融机构，模板和分类类型的高度碎片化可能会阻碍 `CISRTs` 理解影响银行集团的事件整体状况的能力。在此背景下，银行集团可能符合国家层面的相应事件报告要求，但无法从整体上理解面临的风险。\n\
    \n因此，还需要在 `HQ` 层面实施有效的治理，并在集团层面对“整体网络风险”进行充分的整合处理。这是主管机构能够清晰了解特定网络事件触发的风险总体水平的关键条件。\n\
    \n### 议题 3 评估开发具有双向流基础设施的可能性 \n目前，所有事件报告流程都定义为单向流，即从 `CSIRTs` 流向主管机构。目前没有哪项立法强调或设计了双向流。`工作组`\
    \ 内部存在广泛共识，认为最终需要一种针对事件报告的双向流程。\n\n换句话说，监管机构应当能够利用事件报告的内容，反过来为 `CSIRTs` 提供信息和建议。实现双向流的方案之一是开发提供安全消息服务的特定网络基础设施通道。这意味着金融机构将使用通用应用程序来报告事件。银行间市场中\
    \ `SWIFT` 消息的发展在这方面具有启发意义。\n\n最终，关于网络事件的信息可以在安全、标准且可靠的环境中发送和接收。这种模型应该有助于简化事件报告流程。模板的高度标准化在原则上应该提高处理速度和响应能力。鉴于速度是应对大规模网络攻击的主要标准之一，这一益处可能是极其宝贵的。\n\
    \n然而，为了给网络事件创建一个通用应用程序，需要解决的主要问题之一涉及消息中编码信息的性质和类型。不同立法之间模板的多样性（很可能对于其中两项立法，跨国家层面也是如此）是合理的，是因为每项立法都有特定的目的。标准消息的开发应确保这种多样性在新系统中得以复制。不同的机构需要能够在预期时间内检索到正确的信息。\n\
    \n存在一种重大风险，即基于标准消息的事件报告最终可能过于笼统，而无法被机构利用。如果金融部门决定朝这一方向发展，关于此类项目的资金问题仍然存在：应该由政府提供吗？还是应该是混合模式？\n\
    \n### 议题 4 评估开发中央枢纽的可能性 \n应当开发一个枢纽，目标是汇总所有事件报告并将其分发给正确的机构。该枢纽还可以扮演所有机构与 `CSIRTs`\
    \ 之间协调者的角色。鉴于网络安全的全球性质，该枢纽应在欧洲层面建立。现有机构（如 `ENISA`）的职责范围可以大幅扩展以涵盖这些任务，或者从零开始建立一个新机构。\n\
    \n先，基于现有制度框架建立的前者方案是更优的。其目标是避免涵盖广泛相似主题的欧盟机构数量倍增。但是，为了处理所有的报告要求并将关键信息分发给正确的利益相关者，所选机构在人员和预算方面需要大量的资源。为了履行其作为技术顾问的使命，中央枢纽还需要来自监管机构的明确授权。\n\
    \n### 议题 5 评估覆盖所有经济部门的可能性 \n到目前为止，记录的大多数大规模网络攻击不仅影响了多个国家；还扰乱了多个部门。因此，制度框架需要处理多部门的维度。其目标是确保任何网络攻击都局限于特定行业的一家或几家公司，而不扩散到其他公司。\n\
    \n例如，如果网络事件从能源部门扩散到金融部门有高风险，监督机构应当能够向金融机构提供有关攻击性质的实时信息，并在可能的情况下提供应对攻击的最佳方法。可以考虑两种方案来涵盖网络攻击的多部门维度。第一是建立一个负责所有部门（包括金融部门在内）的中央枢纽。第二是建立一个针对网络事件的多部门网络，为经济的每个部门开发一个枢纽：金融、能源、电信、食品等。每个枢纽将负责一个特定经济部门的所有事务，涉及事件报告的分发、反向对企业的通知和建议，以及所有利益相关者的协调。\n\
    \n为了处理多部门攻击，将建立一个多部门枢纽网络，最好在欧洲层面建立，并设有一个“枢纽的枢纽”。首选方案应是针对整个欧盟经济的中央枢纽。多部门枢纽网络的主要风险之一是产生部门孤岛，导致在相关主题上难以达成共识。由于此类流程的复杂性增加，且某些部门枢纽未意识到需要向相应对象提供正确信息的风险增加，枢纽网络中的信息共享流程质量也可能会下降。尽管如此，为整个经济建立中央枢纽仍然需要不同部门的专业知识，以便正确理解其特殊性。\n\
    \n"
