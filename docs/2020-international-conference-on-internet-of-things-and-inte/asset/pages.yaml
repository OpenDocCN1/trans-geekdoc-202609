    **Abstract.** The relevant comment texts of agricultural products on the e-commerce
    platform contain various and complex emotions of consumers, and reflect customer
    experience and views on those products. The analysis of sentiment in a complex
    context has benefits in deep learning. This article explores the issue of sentiment
    analysis of agricultural products by constructing CNN, BI-LSTM and BERT for fine-tuning
    deep learning models. The research objective is to analyze the review data of
    agricultural products on e-commerce platform. Results show that the trend of consumer
    sentiment has shifted from positive to negative, and the classification method
    generated achieves a eight percent difference among the three models. The accuracy
    of the Text-CNN convolutional neural network reached 99.2%. The results confirm
    that Text-CNN has high accuracy and good performance for polarity classification
    in processing agricultural product e-commerce comment data, and the sentiment
    review data provides an important reference for manufacturers to accurately distinguish
    user feedback and enhance market competitiveness.


    accurate and comprehensive evaluation from various amounts of data.


    In the field of agricultural product e-commerce sites, the focus has always been
    on the emotional expression of consumers. For example, "the packaging box has
    several damages, it is very good, juicy and sweet" reflects different aspects
    of sentiment analysis. As shown in Figure 1, "very good" refers to the product
    quality. Aspect-based sentiment analysis can help users understand emotional expressions
    based on contextual and emotional information.


    **Keywords:** Sentiment analysis; deep learning; Text-CNN; BERT; BI-LSTM


    # I. INTRODUCTION


    With the gradual acceleration and development of China agricultural e-commerce
    network a large number of agricultural enterprises have begun to settle in the
    e-commerce platform or build their own e-commerce. The trend of online sentiment
    has resulted in a large amount of consumer review data on e-commerce platforms.
    There is a need to analyze the trend of online sentiment for agricultural products.
    Feedback from users is an important consideration for agricultural production
    and operations to increase market competitiveness. However, the sentiment is sensitive
    to product strategy, so to improve the product''s sales strategy, market competitiveness,
    and optimize in the agricultural consumer market environment, is inaccurate to
    rely on traditional rating methods as the overall product evaluation results.
