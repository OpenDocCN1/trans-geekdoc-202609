    # VI. CONCLUSION


    Compared with traditional analysis methods, this article uses three mainstream
    models of deep learning to explore agricultural e-commerce platform data for sentiment
    classification. To obtain scientific and reliable results, this article uses R
    language to build a web crawler and gathers 23418 data on agricultural reviews
    on the e-commerce platform. The text-CNN convolutional neural network got unexpected
    results: the accuracy of emotion classification reached 99.2% and outperformed
    the Bi-LSTM model on longer sentiment reviews, which is because of sentence feature
    higher. The BERT classification model is about 4% higher, which proves the excellent
    sentiment classification performance of Transformer product data. The results
    of this article provide a valuable and practical reference in the field of emotional
    analysis of agricultural review. Research and management enterprises can easily
    obtain the benefit of feedback consumer opinion, improve product service capabilities,
    improve market competitiveness, and optimize agricultural products online stores.


