    # B. Algorithms based on traditional machine learning


    Si Liu & Ičaj Lee [14] proposed a hybrid framework for data sentiment analysis
    using negative word frequency word document model for feature extraction and classifier.
    Vani Amin Fitiri [15] uses the Bayes algorithm in the RapidiMiner tool to obtain
    an accuracy of 86.43 from the Twitter test case, which is higher than 82.7%. Xu[16]
    proposed other algorithms (decision tree and forest) and the maximum entropy of
    the training corpus for sentiment analysis.


    # C. Deep learning-based methods


    To obtain higher accuracy in Chinese sentiment analysis, Wei[17] proposed the
    MLAE-model in the research, which combines BI LSTM [18] and CNN, and introduced
    a multi-head attention mechanism. Experiments show that the model not only solves
    the problem but also improves the polarity classification. Cheng[19] proposed
    a public opinion analysis framework based on sentiment analysis, which expressed
    the opinion and the target correctly without ambiguity between the two. The sentiment
    of Weibo is reduced to a sequencing labeling problem, and RNN recurrent neural
    networks are used to train the deep learning-based sentiment analysis model. The
    model built with the integrated two-channel CNN-LSTM model, which uses CNN[21]
    and BI-LSTM branches in parallel has achieved good results on challenging data
    sets as the Stanford text benchmark.


