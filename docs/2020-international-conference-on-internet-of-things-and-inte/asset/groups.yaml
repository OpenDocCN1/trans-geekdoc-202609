    In the model of this, the initial learning rate is 1e-5, and the transformer fully
    connected layer is added to the output of the BERT model for fine-tuning. The
    result of the model is Output-Loss (test loss - test loss)=0.1629, Test Acc (test
    accuracy)=0.9539.


    ## C. Convolutional Neural Network-CNN Model


    As one of the most important in the field of learning, a convolutional neural
    network is a type of feedforward neural network that includes convolution layers
    by pooling layers. Convolutional Neural Networks (CNN) is an algorithm that uses
    convolutional networks to extract visual features. The CNN is mainly used for
    image classification, object detection and image recognition. Here we use CNN
    for text classification. The proposed CNN model consists of an input layer, a
    convolutional layer (feature extraction), a pooling layer (down-sampling), a fully
    connected layer and the word vector is converted to solve related applications
    of NLP to sentiment analysis tasks. The core idea of CNN is to use different convolutional
    layers to extract the local features of the text. The so-called local feature
    in the text is a sliding window of various kernel sizes. The advantage of a convolutional
    neural network is that it can automatically filter and combine the sliding window
    to obtain semantic information of different levels.


    ![](img/6c7c6de0926aa37fb422b317b45221c2_2_0.png)


    Fig. 3. CNN-convolution neural network


    Fig. 2. BERT-fine-tuning classification model


