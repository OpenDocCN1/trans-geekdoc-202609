    # II. RELATION WORK


    Sentiment analysis is an application of natural language processing (NLP). Its
    main purpose is to analyze the sentiment polarity of the text proper from a large
    number of texts, to judge whether the sentiment is positive or negative. In recent
    years, sentiment analysis systems have been applied to many different types of
    texts, including comment data [1–6], [7] and tweets on Twitter and Weibo posts
    [8]. The research methods of sentiment analysis are mostly divided into the following
    categories:


    # A. A method based on a sentiment dictionary


    S. Zhang [11] proposed the extraction and construction of related dictionaries
    based on degree adversary, negative dictionary and other related dictionaries
    to expand the sentiment dictionary and improve weighting value-based sentiment
    dictionary analysis. Tan, Chang Feng [12] built a Weibo sentiment dictionary based
    on the NKI dictionary, which was used to improve Weibo sentiment and Sina API
    access data, and analyzed Chinese Weibo sentiment information. Wanghan [13] used
    many data sources to create an emotion analysis framework to extend the domain
    by 23% to 24%. Finally, a sentiment analysis method based on the sentiment dictionary
    of Dalian University of Technology, the sentiment dictionary of National Taiwan
    University and the HotNet dictionary are produced.


    # B. Algorithms based on traditional machine learning


    Si Liu & Ičaj Lee [14] proposed a hybrid framework for data sentiment analysis
    using negative word frequency word document model for feature extraction and classifier.
    Vani Amin Fitiri [15] uses the Bayes algorithm in the RapidiMiner tool to obtain
    an accuracy of 86.43 from the Twitter test case, which is higher than 82.7%. Xu
    [16] proposed other algorithms (decision tree and forest) and the maximum entropy
    of the training corpus for sentiment analysis.


    # C. Deep learning-based methods


    To obtain higher accuracy in Chinese sentiment analysis, Wei [17] proposed the
    MLAE-model in the research, which combines BI LSTM [18] and CNN, and introduced
    a multi-head attention mechanism. Experiments show that the model not only solves
    the problem but also improves the polarity classification. Cheng [19] proposed
    a public opinion analysis framework based on sentiment analysis, which expressed
    the opinion and the target correctly without ambiguity between the two. The sentiment
    of Weibo is reduced to a sequencing labeling problem, and RNN recurrent neural
    networks are used to train the deep learning-based sentiment analysis model. The
    model built with the integrated two-channel CNN-LSTM model, which uses CNN [21]
    and BI-LSTM branches in parallel has achieved good results on challenging data
    sets as the Stanford text benchmark.


    Compared with traditional machine learning methods and sentiment analysis methods,
    deep learning [22,23] has high classification accuracy, strong learning ability,
    ability to learn complex features, strong and excellent effects in processing
    nonlinear data. Numerous scholars have confirmed that abstract features of deep
    learning can easily adjust the words, and better simulate the relationship between
    words, which can make it more effective than traditional methods [24,25]. It is
    significance to select machine learning models and traditional sentiment dictionary
    methods for research, this paper builds a mainstream framework in the field of
    deep learning, starting from the perspective of agricultural review and constructs
    a review model based on agricultural product composition, where Pos for positive
    and neg negative. Deep learning BERT model, Text-CNN model and the Text-CNN model
    are used to obtain the optimal sentiment analysis for classification of agricultural
    review data. Experimental proves that the Text-CNN model is the best for sentiment
    classification and we use the Text-CNN model to get a good analysis result.


