    text-CNN data preprocessing stage of this article, word segmentation is used,
    and meaningless content is deleted through stop operations. The Text-CNN model
    constructed in this paper uses three convolutional layers and dropout (negative
    log-likelihood loss function) to enhance the return capacity of the network.

