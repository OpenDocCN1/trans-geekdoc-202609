    微调分类模型和 Bi-LSTM 分类模型。总之，基于 Text-CNN 卷积神经网络的农业电商评论数据情感分类效果更好。虽然 CNN 没有像 LSTM 模型那样可以捕捉长距离依赖的结构，也不具备基于
    BERT 微调模型的词嵌入特征，但其卷积层捕捉局部信息的能力和池化层提取局部信息的能力恰恰证明了 Text-CNN 卷积神经网络模型对于 35 字的农产品评论文本集具有良好的情感分类效果。


    ![](img/6c7c6de0926aa37fb422b317b45221c2_4_0.png)


    # V. 结果分析


    Bi-LSTM 双向短期记忆网络、基于 BERT 的微调分类模型和 Text-CNN 卷积神经网络使用了预处理数据和 Neg 集进行分类实验。表 5 显示了每个分类器的实验结果。精确率是准确率的指标，意味着分类器正确分类的数量占




    表 IV


    | 指标(%) | 类型 | 准确率/% | 精确率/ | 召回率/ | F1分数 % |

    |---|---|---|---|---|---|

    | BERT | 正类 | 95.39 | 94.02 | 96.77 | 95.38 |

    | | 负类 | 96.79 | 94.05 | 95.40 | |

    | Text-CNN | 正类 | 99.92 | 99.90 | 99.95 | 99.92 |

    | | 负类 | 99.95 | 99.99 | 99.93 | |

    | Bi-LSTM | 正类 | 91.70 | 95.62 | 93.62 | |

    | | 负类 | 93.60 | 95.59 | 91.65 | 93.58 |


    # VI. 结论


    与传统分析方法相比，本文使用了三种主流深度学习模型来探索农业电商平台数据进行情感分类。为了获得科学可靠的结果，本文使用 R 语言构建了网络爬虫，并收集了网上商店的消费者意见数据。Text-CNN
    卷积神经网络获得了意外之外的结果：分类准确率达到了 99.2%，优于 Bi-LSTM 模型，而 BERT 分类模型高出约 4%，这证明了其卓越的情感分类性能。本文的结果为管理领域提供了极具价值和实践性的参考，提高了提高市场竞争力。


