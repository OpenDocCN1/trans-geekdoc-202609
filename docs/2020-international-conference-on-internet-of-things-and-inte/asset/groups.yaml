    # B. BERT fine-tuning classification model based on pre training.


    BERT Bidirectional Encoder Representations from Transformers is a pre-trained
    language model developed by Devlin J [226], BERT is a Transformer that implements
    multiple deep bidirectional models based on Transformer. Unlike other language
    representation models, BERT aims to pre-train deep bidirectional representations
    and then adjust for specific tasks. The pre-trained BERT means that it can be
    fine-tuned with an output layer, and is suitable for the construction of the most
    advanced model for a wide range of tasks, without the need to design a new architecture
    from scratch. BERT uses 11 natural language processing tasks as it is proposed.
    In the field of sentiment analysis, many foreign scholars have applied it to English
    sentiment classification and [27] proposed using BERT''s hierarchical attention
    network for document classification and achieved results. Xie Q [28] used the
    pretrained BERT for latent Dirichlet allocation (LDA) topic model, which allows
    the topic evolution of monolingual and multilingual topic similarity settings.
    BERT is very effective in the field of natural language processing and can be
    used as a model for Chinese sentiment analysis and testing.


