    # D. Bi-LSTM neural network based on deep learning


    # IV. ENVIRONMENT


    Recurrent Neural Network (Recurrent Neural Network) is a neural network used to
    process sequence data. The gradient disappearance of RNN is because it has a short-term
    memory, which has hidden layer modification to solve the problem of gradient disappearance
    of RNN, so that the recurrent network has long-term memory capabilities. This
    type of recurrent network is called Long-term Memory LSTM (Long Short Term Memory).
    Bi-LSTM (Bidirectional Long-Term Memory) is a kind of LSTM, which is composed
    of two-way recurrent neural networks and short-term memory. At each time t, the
    output is provided to these two networks in opposite directions as the context
    is output by the two unidirectional recurrent networks. In the field of sentiment
    analysis, due to the advantages that LSTM can learn to better capture the long-distance
    dependencies. And LSTM modeling cannot encode back-to-front problems, but LSTM
    can better capture the two-way sentence dependence.


