  \ Pell, Sotiris Moschoyiannis, and Emmanouil Panaousis\n\nDOI 10.1201/9781003109952-4\n\
  \n第五代移动网络（5G）承诺带来一系列新功能，包括更高的数据速率和更多的连接用户。为了支持这些新功能和用例，5G 核心网络（ics）本质上将是动态且可重配置的，以应对需求。正是这些改进也给传统的安全监控方法和技术带来了挑战，这些技术需要适应新的网络架构。增加的数据量和动态的网络架构意味着，需要一种方法来将安全监控资源集中在最需要的地方，并对网络变化做出实时响应。在考虑多阶段威胁场景时，需要一种协调的、中心化的安全监控方法，以便早期检测影响网络不同部分的攻击。在本章中，我们将识别应对这些挑战的潜在解决方案，首先从识别\
  \ 5G 网络威胁开始，以确定 5GCN 中合适的安全监控位置。\n\n## 4.1 引言\n\n\n\n\n\n计算机安全分析已成为识别安全风险、评估漏洞以及指导网络保护决策的重要工具。近年来，网络复杂性不断增加，促使了安全模型的发展，以进行有效的安全分析\
  \ [1]]。网络复杂性演进的一个典型例子是 5G 移动网络。5G 将整合一系列新技术，包括软件定义网络 (`SDN`)、网络函数虚拟化 (`NFV`)、多接入边缘计算以及向云化服务的转型。所有这些技术都为\
  \ 5G 网络提供了满足性能需求并支持多种新用例的能力，但它们也增加了攻击面并引入了一系列新威胁。\n\n5G 核心网（5GCN）架构仍在开发中，目前处于规范阶段\
  \ [2]]。5GCN 的具体细节和行业级部署可能在若干年后才能实现，但 5GCN 的总体架构和关键组件已如图 4.1 所示所示。图中展示了关键构建区块，这些区块是迄今各种威胁评估的重点。5GCN\
  \ 的构建区块继承了许多现有技术，在不同行业中存在大量虚拟化、云化部署的示例。从安全角度来看，让 5GCN 面临独特挑战的是它相对于上一代移动网络的剧烈转型。这种转型包括了网络切片\
  \ (`NS`) 的引入、从集中式硬件和唯一接口转向面向不同用户设备 (`UE`)、第三方应用以及其他移动网络服务提供者的不同接口。每一个接口都对于提供电信网络所需的功能至关重要，但它们也引入了传统企业网络之外的攻击面。围绕各个技术赋能器相关的安全问题，有大量文献评估了每种技术的安全风险\
  \ [3]]。现在工业界和研究人员面临的最大挑战是，评估当这些技术结合时 5GCN 的整体安全风险。这包括了 5GCN 内部以及与核心网对接接口的外部服务之间的信任边界。网络架构和漏洞构成了传统的基于漏洞的安全风险评估的基础。鉴于目前\
  \ 5GCN 的成熟度，这构成了一个重大问题，因为传统的安全风险评估并不适用于当前的开发状态，而替代方法（包括基于威胁的风险评估）可能更为合适。适用于 5G 网络的安全模型应该对电信业务提供商面临的各种新旧威胁采取整体视角。特别是在考虑多阶段攻击场景时，合适的模型应该考虑攻击步骤链，以及每一步对网络状态产生的局部和整体性后果。\n\
  \n这种挑战需要考虑攻击者的最终目标、网络入侵的威胁以及其间的每一个攻击步骤。最受认可的网络安全框架之一是美国国家标准与技术研究院 (`NIST`) [4]]。`NIST`\
  \ 框架的核心包含了管理网络安全风险五个阶段，即`识别` (identify)、`保护` (protect)、`检测` (detect)、`响应` (respond)\
  \ 和 `恢复` (recover)。在基于威胁的风险评估中，`NIST` 框架的第一步涉及`识别`。`PASTA` 框架由七阶段组成 [5]]，其中包含了`威胁分析`。从识别\
  \ 5GCN 开始，我们在 5G 网络中应用这些框架。\n\n本章的后续结构如下：在第 1.2 节中，我们介绍了相关工作。在第 1.3 节中，我们提出了一种针对\
  \ 5GCN 的方法。在第 1.4 节中，我们描述了如何将 `PASTA` 框架用于多阶段攻击。最后，本章第 1.5 节概述了挑战和未来工作。\n\n## 相关工作](#contents.xhtml#re-2)\n\
  \n在本节中，我们回顾了与 5GCN 相关的文献。\n\n### 4.2.1 5GCN 威胁](#contents.xhtml#re-3)\n\n随着新技术引入\
  \ 5G，已有多项 5G 威胁评估产生 [3]、6]、7]、8]。在这些工作中，针对 `SDN`、`NFV` 以及 5G 中新的基于服务的架构 (`SBA`)\
  \ 评估了威胁。专注于 `SDN` 和 `NFV` 的 [9] 研究了了 `NFV` 组件（如防火墙和入侵检测系统 `IDS`）以及数据面、控制面和应用面接口的威胁。5G\
  \ 最大的转型之一是引入 `SBA`。在这种架构下，网络功能 (`NF`) 使用 `HTTP/2` 进行通信，这引入了开放性和活性，但协议的通用性引入了许多新威胁\
  \ [7]。一份关于 5G 网络威胁格局的欧盟报告 [8] 提供了威胁分类，并识别了哪些 5GCN 基础设施组件面临每种威胁场景的风险。表 4.1 汇总了当前文献中识别出的\
  \ 5G 网络威胁。\n\n表 4.1：识别出的 5GCN 关键威胁\n\n| 威胁描述 | [8]] | [3]] | [6]] | [7]] |\n| ---\
  \ | --- | --- | --- | --- |\n| `NF` 泛洪攻击 | ✓ | ✓ | ✓ | ✓ |\n| `SBI` 窃听 | ✓ | | ✓\
  \ | |\n| 获取 `NF` 数据 | ✓ | | ✓ | ✓ |\n| 在 `NFV` 环境安装恶意软件 | ✓ | | ✓ | |\n| 修改信令流量\
  \ | ✓ | ✓ | | ✓ |\n| 修改应用数据 | ✓ | | | ✓ |\n| 修改配置数据 | ✓ | | | ✓ |\n\n\n\n\n\n| API\
  \ 漏洞利用 | ✓ | ✓ |  |  |\n| 网络协议利用 | ✓ | ✓ |  |  |\n| SDN 控制器攻击 | ✓ | ✓ | ✓ |  |\n\
  |  lawful 拦截功能滥用 | ✓ |  |  |  |\n| 漫游场景攻击 | ✓ | ✓ | ✓ |  |\n\n### 4.2.2 多阶段攻击建模\n\
  \n在文献中识别出的 `5GCN` 威胁可以被视为通过多阶段攻击场景实现攻击者目标的抽象表示。最初，攻击者需要获得核心网的访问权限，随后执行若干攻击步骤，以实现表\
  \ 4.1 中威胁所示所示的某些目标。攻击图已作为一种多阶段攻击建模和安全风险量化的解决方案被广泛研究`[10, 11]`。攻击图既可以用于设计设计阶段`[12]`，也可以通过告警关联用于实时入侵检测`[13,\
  \ 14, 15]`。当网络拓扑发生变化或发现新漏洞时自动生成攻击图的过程`[16]`对于许多现代网络而言已至关重要，因为这些网络具有 `5GCN` 式的动态特性。由于攻击图已被证明是进行安全风险分析的有效工具，已经出现了多种用于自动生成攻击图的工具`[17,\
  \ 18, 19]`。尽管在可读性和生成时间方面已发现缺点，但人们公认为其输出是建模攻击场景的价值工具。\n\n攻击图通常依赖于对网络拓扑的了解以及网络内已知漏洞，以识别攻击者为实现特定目标可能采取的潜在攻击步骤。与攻击图相比，威胁图在安全风险分析中的应用较少。威胁图已用于企业网络的风险评估`[20]`，并评估威胁对组织安全目标的影响，以帮助评估安全控制的效果`[21]`。虽然威胁图比攻击图更抽象，但它涵盖了软件和硬件漏洞利用之外的一系列额外威胁。\n\
  \n针对 5G 网络，`[22]` 的作者提出了一种与 `5GCN` 分层网络架构关键资产相关的多阶段攻击场景图模型。在这项工作中，提出了一种基于攻击者行为的自动化攻击和防御框架。尽管该模型中的漏洞是通用的，而非特定的硬件或软件漏洞，但它仍然依赖于对\
  \ 5G 网络漏洞的了解。与许多方法一样，任何关注于软件漏洞以进行多阶段攻击建模的技术往往会忽略其他类型的威胁，例如内部威胁、零日漏洞或供应链威胁等。\n\n\
  ## 4.3 5GCN 的威胁建模\n\n参考一些成熟的威胁建模框架，例如用于改进关键基础设施的 NIST 框架`[4]`以及攻击模拟与威胁分析过程 (PASTA)，我们识别出一些关键活动：\n\
  \n#### 识别 (Identify)\n这组活动构成了网络的一部分，并概述了关键资产。该过程的输出包括网络攻击面网络边界。\n\n#### 威胁分解 (Threat\
  \ Decomposition)\n安全监控的重要部分是理解网络。在传统模型中，这将包括对特定软件和硬件的了解，但考虑到开发的成熟度，这种方法并不适用于 `5GCN`。此外，预计不同的服务提供可能会使用不同的供应商，因此没有我们可以参考的代表性\
  \ `5GCN` 部署。出于此原因，我们建议根据最新的 3GPP 规范使用高层架构，如图 4.1 所示的基础架构。\n\n#### 图威胁建模 (Modeling\
  \ Threats with Graphs)\n对于我们的模型，我们建议使用图将威胁源映射到目标。我们在第 1.3 节提供了图的进一步定义。\n\n#### 4.3.1\
  \ 识别 (Identification)\n为了建模威胁和相关的多阶段攻击，我们首先需要理解拓扑结构。我们定义如下：\n\n- **组件 (Components)**：代表属于\
  \ `5GCN` 子系统的一个资产组，提供整体功能。这些是管理和编排 (`MANO`)、`SDN`、`NFV` 以及由物理基础设施 (`PI`) 和虚拟基础设施\
  \ (`VI`) 组成的云基础设施以及 `SBA` 应用层的虚拟化网络函数。\n- **威胁场景 (Threat Scenario)**：一组与多个威胁源和目标相关的威胁事件。\n\
  - **威胁事件 (Threat Event)**：可以被视为威胁场景中某些意外结果的特定攻击步骤。\n- **威胁源 (Threat Source)**：用于发起威胁事件的网络组件术语。\n\
  - **威胁目标 (Threat Target)**：用于被威胁事件攻击的网络组件术语。\n\n#### 4.3.2 威胁分解 (Threat Decomposition)\n\
  威胁分解过程涉及将文献中识别出的威胁场景产生一组威胁事件并分配潜在的源和目标。我们提供该过程的一个运行示例：\n\n- **威胁场景**：*应用程序接口 (API)\
  \ 漏洞利用*\n- **威胁事件**：*SQL 注入*、*缓冲区溢出*、*远程代码执行*\n- **威胁源**：*外部网络*\n- **威胁目标**：*网络函数*、*MANO*\n\
  \n\n\n\n\n在本示例中，文献中识别出的威胁 `API vulnerability exploit`（API 漏洞利用）可以通过几种不同的威胁事件来实现，每个事件都是攻击者可能用于利用提供给\
  \ 5GCN 的面向的 API 技术。MANO 以及某些 5GCN 网络功能（如网络暴露函数 `NEF`、接入管理功能 `AMF` 和安全边缘代理 `SEPP`）都提供了面向的\
  \ API，因此是该威胁场景的潜在目标。这些组件为外部网络和系统与 5GCN 的交互提供了接口，因此在本示例中，潜在的威胁源是外部网络。\n\n除了有助于指导\
  \ 5GCN 安全监控需求的决策外，威胁分解过程还有助于助于识别（如果检测到的话）威胁事件属于多阶段攻击的哪一个阶段。虽然得出的威胁事件不如某些安全风险评估中使用的已知漏洞利用程序那样具体，但它们确实提供了攻击步骤的抽象表征。这种方法与\
  \ MITRE ATT&CK 框架具有相似之处，该框架提供了一组针对企业网络的攻击者常用的技术、战术和程序（TTP）。MITRE ATT&CK 框架将战术（tactic）定义为每个攻击步骤的目标或目的，将技术（techniques）定义为实现战术的方法或“如何做”。在过程中，我们描述了可以被认为类似于技术的威胁事件，即威胁场景是如何实现的。MITRE\
  \ ATT&CK 框架中定义的战术代表了与高级持续性威胁（APT）攻击典型的多阶段攻击场景相关的 12 个不同阶段。尽管这超出了我们工作的范围，但将特定技术或威胁事件分配给战术组有助于检测\
  \ APT 多阶段攻击。我们在章的结论部分讨论了使用这种方法的相关工作。\n\n### 4.3.3 将 5GCN 威胁建模为图\n\n作为一种多阶段攻击的建模工具，攻击图可以用于映射攻击步骤与网络基础设施之间的关系。我们并不是使用图来映射相对于漏洞利用的攻击步骤，而是研究了使用图来建模与\
  \ 5GCN 基础设施相关的威胁场景。\n\n威胁场景可以映射到网络基础设施上，不同组件之间的图边可以帮助识别在网络的什么位置放置网络安全传感器以检测威胁事件。网络威胁可以定义为`恶意尝试破坏或干扰计算机网络或系统的可能性`。我们将这一概念扩展到包括关于网络组件的威胁源和目标目标。在\
  \ 5GCN 的语境下，这涉及到我们已识别的关键组件。任何威胁场景 `T` 都可以定义为元组 `T = (src, dst, scenario)`，其中 `src`\
  \ 是恶意动作源自组件，`dst` 是威胁 `scenario` 攻击的目标或被攻击的组件。作为一个简单的示例，`T = (External Network,\
  \ NEF, API Exploit)` 描述了从外部网络利用 `NEF` API 的威胁。我们可以以图的形式对 5GCN 威胁建模。\n\n**定义 1. 威胁图**\
  \ 给定一组威胁场景 `t` ∈ `T`，一组 5GCN 基础设施组件 `c` ∈ `C`，一个威胁源 `T [s]` ⊆ `C` × `T` 以及一个威胁目标\
  \ `T[t]` ⊆ `T` × `C`，威胁图 `G` 是一个有向图 `G = (C ∪ T, T [s] ∪ T[t] )`，其中 `C ∪ T` 是顶点集，`T\
  \ [s] ∪ T[t]` 是边集。\n\n威胁图模型的一个重要特征是多阶段攻击步骤之间的关系。图的组件节点既可以作为威胁目标，而且如果该攻击步骤成功，还可以为源自受损组件的进一步攻击提供平台。结果，该组件将成为由图中出边表示的威胁源。同样，网络组件节点的入边代表一个威胁目标。这一概念在多阶段攻击检测中起着关键作用。对于我们的威胁图模型，我们假设攻击者从\
  \ 5GCN 外部开始，因此图的初始节点由外部网络节点表示。从外部网络开始的图边代表多阶段攻击的第一步，从 5GCN 组件到威胁场景的后续每条边代表 `1 +\
  \ n` 个攻击步骤。\n\n### 4.3.4 5GCN 威胁图示例\n\n通过威胁的图表示法以及 5GCN 基础设施组件之间的关系，我们可以表示多阶段攻击场景的进展。图\
  \ 4.2 中的示例威胁图展示了文献中识别的威胁如何与 5GCN 组件相关联。\n\n![Figure 4.2 5GCN threat graph.](img/fig4.2.jpg)\n\
  \n*图 4.2* 5GCN 威胁图。\n\n从示例威胁图中，我们识别出两个多阶段攻击场景，并解释了它们在图中是如何表示的。\n\n**威胁场景 1**\n1.\
  \ 攻击者获得了 MANO 组件的凭据。\n2. 攻击者能够更改配置，将恶意 NF 引入 SBA。\n3. 恶意 NF 开始通过窃听 SBA 来收集敏感数据。\n\
  \n**威胁场景 2**\n1. 攻击者利用了 `NEF` API 的漏洞。\n2. 攻击者与 5GCN 的 `NEF` 建立了远程连接。\n3. 攻击者利用虚拟化程序的漏洞并访问\
  \ PI。\n4. 攻击者能够访问存储 SBA 中所有 NF 数据的内存。\n\n在上述场景中，威胁图展示了攻击者在 5GCN 组件之间横向移动时可能采取的步骤。这种方法提供了一个全局视图，展示了攻击者如何攻击多步骤威胁场景中的不同关键组件，而不仅仅关注孤立组件相关的安全事件。由红色边强调的场景\
  \ 1 和由蓝色边强调的场景 2 显示了攻击者如何通过不同的向量攻击 5GCN，以实现获取敏感数据的相同目标。关于安全监控的放置，我们可以看到攻击可能从何处产生以及哪些组件可能成为目标，因此提供了检测威胁事件的传感器放置指导。在第\
  \ 1.4 节中，我们将参考示例威胁图进一步讨论安全监控需求。\n\n## 4.4 5GCN 基础设施基于图的安全监控\n\n\n\n\n\n网络内部有效的安全监控包括两个重要方面：(1)\
  \ 明确应该在网络的什么位置应用安全监控，以及 (2) 需要什么类型的安全监控。由于 5G 网络流量流量和连接设备数量预计将超过以往的水平，传统的安全监控方法可能不再适用。\n\
  \n由于核心网的动态性和可重构性，对安全监控的分析可能会迅速过时。例如用于检测威胁的流量深度包检测（`DPI`）技术将仅需要在需要的地方和时间应用。由于网络中传输大量数据，许多现有的\
  \ `DPI` 工具无法实时处理结果，并可能遗漏可疑数据包。\n\n在本章中，我们描述了一个涉及威胁分解的过程，通过将威胁映射到 5G 组件，以识别应该将安全监控放在何处以检测威胁事件。威胁分解过程还能识别威胁事件，从而为检测威胁的方法提供进一步的指导。该框架的最后一个阶段是提供一组监控需求，这些需求可以转换为适用于\
  \ 5G 网（5GCN）的一组规则。\n\n在考虑特定威胁的安全监控时，示例包括使用防病毒软件检测恶意软件，或使用可以监控流量流以检测恶意连接的防火墙。在大多数情况下，安全监控的类型取决于对使用何种攻击的了解。安全传感器在网络中的部署取决于对网络架构的了解、关键资产的识别以及对这些资产构成的威胁。\n\
  \n### 入侵检测系统\n\n涉及安全监控特别是入侵检测系统（`IDS`）时有两种类型可以应用。第一种是基于主机的入侵检测系统（`HIDS`），顾其名，它负责监控特定主机。参考\
  \ 5GCN 架构，这可能包括物理主机和虚拟主机，如 `VNF`、`SDN` 和 `MANO`。第二种安全监控是基于网络的入侵检测系统（`NIDS`），侧重于监控网络内部的流量和连接。在\
  \ 5GCN 基于流量的安全环境中，监控对于检测不同 5GCN 组件之间的威胁事件至关重要。为了理解这些位置需要什么类型的监控，我们进一步评估了威胁事件并识别了需要监控的网络参数。\n\
  \n### 威胁场景\n\n#### NF 的洪水攻击\n- **安全监控**: 流量负载、网络连接、资源使用和错误代码。\n- **描述**: 有若干威胁事件可能导致对\
  \ `NF` 的洪水攻击。此类类型威胁的检测依赖于识别威胁源和目标组件之间的异常流量流，这可能包括用户设备产生的流量增加，或恶意 `NF` 产生额外的流量。在这两种场景下，监控流量负载以及可能由非法\
  \ `HTTP/2` 流量产生的任何错误代码有助于识别这种威胁。\n\n#### 对 SBI 的窃听\n- **安全监控**: 不适用（n/a）\n- **描述**:\
  \ 直接检测正在窃听的 `NF` 是一项艰巨的任务。相反，建议监控窃听的症状，例如通过异常的文件大小或类型对截获的通信进行数据收集。此外，监控 `NFs` 的可疑行为有助于识别注册在\
  \ `SBA` 中的恶意 `NF`。\n\n#### 获取 NF 上的数据访问\n- **安全监控**: 监控对数据存储的访问。\n- **描述**: 数据存储中存储了大量敏感数据。检测攻击者访问数据将依赖于对访问的监控，特别是被系统拒绝的尝试访问。应该监控访问频率和数据请求大小等属性，以发现异常。\n\
  \n#### 在 NF 环境中安装恶意软件\n- **安全监控**: 防病毒软件监控新软件的系统日志，并监控资源使用和系统调用等行为的异常。\n- **描述**:\
  \ 在大多数情况下，使用防病毒软件被认为在检测恶意软件方面是。考虑到 `APTs` 和为了保持不被发现而付出的努力，使用任何恶意软件可能需要额外的努力来规避防御。攻击者可能会在应用程序或可执行文件中伪装恶意软件、部署零日攻击，甚至向\
  \ 5GCN 引入恶意 `NF`，这可能会绕过防病毒软件。因此，除了防病毒软件外，可能还需要监控新应用程序或软件的安装及其行为以识别副作用。\n\n#### 修改应用数据\n\
  - **安全监控**: 监控系统日志。\n- **描述**: 修改应用数据可能是意图操作，但也可能指示恶意活动。尽管这不是恶意活动的确定信号，但在修改应用数据时应使用系统日志触发告警，包括执行更改的用户信息。\n\
  \n#### 修改配置数据\n- **安全监控**: 监控系统日志。\n- **描述**: 在 5GCN 内修改配置数据预计是正常行为。路由表、网络切片和虚拟网络函数在本质上是可重构和动态的，以支持网络需求。攻击者可能会利用这一特性进行流量重定向，或向\
  \ `NF` 的配置引入漏洞。\n\n#### API 漏洞利用\n- **安全监控**: 监控应用程序日志。\n- **描述**: 监控提供 `APIs` 的公开应用程序日志以检测行为异常有助于检测尝试或成功的利用。由于\
  \ 5GCN 预计产生大量流量，`DPI` 可能无法进行实时分析。可以部署应用程序防火墙来检测无效输入，作为尝试利用的指标。\n\n#### SDN 控制器攻击\n\
  - **安全监控**: 监控系统日志、资源使用以及访问、流量流。\n- **描述**: `SDN` 控制器在 5GCN 中起着关键作用。对 `SDN` 控制器的攻击范围从\
  \ DoS 类攻击、重定向流量的恶意配置更改以及获取路由表知识。应使用一系列监控不仅来检测更改，还要监控任何恶意活动的症状。\n\n#### 滥用合法截获（LI）功能\n\
  - **安全监控**: 监控 `LI` 功能的使用。\n\n\n\n\n\n*   **描述：** 监控 `LI` 函数的滥用并非一项易事。监控 `LI` 函数的使用情况并与相关机构进行核实是最可靠的检测方法。对于通过访问移动网络使用\
  \ `LI` 函数的情况，网络运营商维护一个信任/不信任访问网络的白名单或黑名单有助于识别误用行为。\n\n*   **威胁场景：** *漫游场景攻击*\n\n\
  *   **安全监控：** 监控黑名单网络并关联用户位置跟踪。\n\n*   **描述：** 漫游场景威胁构成了多种威胁事件。可以使用多种方法来检测漫游场景的滥用，包括维护欺诈访问网络请求的黑名单以及对用户设备进行地理跟踪，以检查位置是否与用户的预期位置相符。\n\
  \n所识别的检测方法为生成潜在疑行为的警报提供了途径。在许多情况下，这些警报可能是正常操作，但检测并关联的威胁事件越多，检测出多阶段攻击的概率越高，同时检测的误报率应该降低。预计将检测到许多可疑用户登录活动或网络重配置等警报。我们在本章第\
  \ 1.5 节中讨论了告警过滤和关联的过程。\n\n## 4.5 开放研究挑战与未来工作\n\n在本章中，我们描述了一个用于检测 5G 网络特别是 `5GCN`\
  \ 多阶段攻击的框架。该框架采用三阶段方法，将高层威胁场景转化，并使用图将其建模为针对 `5GCN` 基础设施组件的威胁事件。在本节中，我们讨论了进一步开发 5G\
  \ 网络 APT 检测框架面临的挑战和未来工作。\n\n### 4.5.1 多阶段攻击场景的检测\n\n目前已经评估了基于安全告警检测多阶段攻击的不同方法。[[23]]\
  \ 中介绍了将安全告警关联到涉及多个战术组的“攻击生命周期”的优点。其核心思想是，在多阶段攻击期间，不同的战术会按时间顺序部署，从网络入侵开始，通常导致某些数据从网络中外泄。攻击者会部署\
  \ `MITRE ATT&CK` 框架中识别的战术，以便在网络中横向移动时保持不被发现，获取访问所需的权限，并在最终将其传输出网络之前收集数据，有时通过建立命令与控制节点来隐藏该过程。通过这些事件的时间顺序，可以根据告警发生的顺序及其所属的战术组来关联安全告警。如果存在一个可能指示可疑用户登录的安全事件，随后是同一用户账户在网络内发生的某些与恶意配置更改相关的事件，那么这两个事件存在关联的可能性。这种概念与许多攻击图模型一样，假设在此之前会发生某种前提操作或状态。在威胁图中，也存在同样的假设。如果我们考虑基于服务的接口\
  \ (`SBI`) 中的信令攻击威胁，其中一个 `NF` 是源，另一个 `NF` 是目标，我们假设该源组件已被攻破并受到攻击者的控制。\n\n除了根据发生的顺序及其所属的战术组来关联安全事件外，威胁-还可以可用。（注：文本似乎与原始源一致）\n\
