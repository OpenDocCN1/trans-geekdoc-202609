  \n\n\n\n\n技能缺口是雇主、学术界以及任何制定应对数字技能标准的部门之间持续讨论的话题。由于这不是一个新问题，政府一直在致力于寻找资金来支持大数据、人工智能（AI）和网络安全（Cyber）领域出现的机遇。全球各国政府提出的方案需要技术技能，例如理解和管理数据库以及处理数据、编程，以及员工可以用来支持其终身学习的软技能，例如项目管理。持续的变化催了诸如“学习如何学习”等主题，以及支持个人持续发展的各种元技能（meta-skills）。这导致了三个层级的责任领域，以开发这些数字技能，同时也解决网络安全技能的缺口问题。\n\
  \n### 11.2.2 第一层：雇主\n\n组织正寻求满足合规性要求，并培养一支具有安全意识的员工队伍。雇主有责任继续提升员工的技能，并为他们提供教育以理解所需的各种工具和技术。雇主和组织不仅有责任创造出所需的技能，还有责任考虑个人可能具有的多样学习策略。\n\
  \n网络安全涵盖广泛的专业技能和角色，人们认为任何单一的教育计划（无论是学位、学徒制还是认证）都无法涵盖该行业所需的全部技能方面。最近，国家网络安全教育倡议（`NICE`）强调，目前的教育格局未能提供解决技能缺口所需的具体技能集。值得注意的是，许多计划侧重于政策制定和规划，或合规审计，而不是支持组织构建网络安全系统所需的实质性技能。观察发现，许多教育计划侧重于理论而非实操经验。因此，从雇主的角度来看，为了解决这一缺口，通过应用型学习方法解决这些问题是至关重要的。\n\
  \n组织在识别和招聘网络安全专家方面面临着严峻挑战。在他们需要保护系统的同时，也需要支持来识别一个既可以接受教育、又能获得实践经验准备的人才库，并建立一个更稳健的人才储备。\n\
  \n### 11.2.3 第二层：学术界\n\n英国政府一直在探索技能缺口，以及如何支持高等教育机构创建新的网络安全技能。护理与助产委员会（`NMC`）（2016）报告为高等教育机构提供了一个五年的规划，并确定了研究发现利用技术可以改进教学和在高等教育部门提供更多机会的主要领域。特别是，他们的研究重点关注于开发竞争性的教育模式，试图帮助机构脱离传统课程；尽管此类方法可能对政策、领导和实践产生影响，但仍被视为一种突破性方法。\n\
  \n多年来，解决并进一步发展高等教育与雇主之间的关系一直有着强有的动力。高等教育被要求在工业 4.0 进步的背景下变得更具响应性，在增强知识和技能的同时，赋予批判性反思学习者能力。政府发布了许多讨论高等教育未来的报告，例如\
  \ 2003 年英国政府报告、2008 年 HEFCE 报告、2011 年政府白皮书（`Vasileiou, 2018`）以及 2015 年关于提高就业能力的\
  \ Advance HE 框架。\n\n高等教育机构已将就业能力视为组织承诺和愿景的关键方面之一。在传统学位中，提供了短期的、基于工作的学习模块，学生在与雇主合作的同时完成学术工作（`GOV.UK,\
  \ 2017`）。此外，学生可以在进入学位最后一年之前，在第二年结束时参加为期一年的可选实习。\n\n英国的 Advance HE 框架经常被采用以嵌入就业能力，并可以根据学位类型和预期结果进行定制。重要的是，任何高等教育机构都应成为开发嵌入就业能力课程的关键动力，以解决技能缺口。英国大学倾向于根据专业机构对其学位进行认证。在计算机科学学科及其网络等相关领域内，定期更新课程对于培养具有就业能力的毕业生和缩小技能缺口至关重要。像\
  \ `BCS`（英国特许信息技术学会）这样的专业机构通过通过高等教育质量保证标准，在开发和认证课程方面着领先作用。此外，它们还支持并加强了高等教育（`HE`）与雇主之间的关系以及对基于技能的方法的深入理解。尽管如此，这可能会产生新问题，即专业机构不理解高等教育的质量保证标准，导致认证变成一种竞争行为，而非促进卓越发展的指导性行为（`Vasileiou,\
  \ 2020`）。\n\n在许多欧洲国家，学位学徒制（Degree Apprenticeships）的开发始于 2016 年前。它主要依赖于毕业生所需的技能集，这些技能是由各国政府的分析和发布的标准定义的（`Vasileiou,\
  \ 2020`）。学徒制学位将学习与就业相结合，最终证书不仅是理解该学科的学位，也是对个人已有技能的验证。开发和引入的学徒标准是工作与需要进行的学习的结合。换句话说，二者不可不可。英国的学习技能被映射到专业标准中，并重点关注\
  \ `SFIA` 框架（`2018`）和 `CIISec` 技能框架（`CIISec, 2019`）。这些专业机构与政府合作非常紧密，并向相关的学徒制先锋者提供信息，以确保我们不仅在学术上弥补了缺口，而且被网络安全社会广泛认可。虽然开发任何学术元素都可以丰富网络安全领域，但仍然不断需要映射工作，以对现在和未来已习得和所需的技能提供定期更新。\n\
  \n### 11.2.4 第三层：政府\n\n政府负责支持教育部门和利益相关者，使其参与讨论如何将这些努力整合为统一的方法。政府通过先锋小组（trailblazer\
  \ groups）不断识别出连接学术界和雇主所需的新技能集。在美国，`NICE` 大力致力于标准化绩效衡量并将其与 `NICE` 网络安全劳动力框架对齐。同样，在英国，英国网络培训学院（UK\
  \ Cyber Training Academy）正在开发短期强化课程计划以提升劳动力技能。最后，如上述所示，大量的努力和设计被投入创建新型学位，即通过将实操经验与理论相结合的学位学徒制。\n\
  \n## 11.3 制定网络安全技能议程\n\n\n\n\n\n网络安全劳动力技能缺口是经济发展和安全领域关注的主要关注点之一。在全球经济快速数字化的背景下，构建一个涵盖网络安全教育、基于问题的培训以及持续劳动力发展的生态系统至关重要。为了减少技能短缺，目标应该是在网络安全技能的背景下开发出一种通用的方法。\n\
  \n关于识别网络技能缺口的英国报告（Furnell, 2020）指出，自 2018 年报告以来情况没有发生任何变化。该报告重申了这样一个事实：机构花费了更多时间在制定政策和培训员工如何识别网络风险上，但既没有足够的技能提升，也没有足够的进入网络领域的切入路径。\n\
  \n云计算、`AI` 和机器学习等领域通常伴随着网络领域的技能缺口而出现。关于未来所需的技能以及如何改善人才储备，存在各种讨论。有趣的是，有许多报告讨论了网络安全领域的技能缺口。所有这些报告的明确共同点是，结果的重点集中在教育的重要性上。报告强调，网络技能教育需要从小学阶段就开始。\n\
  \n### 11.3.1 网络安全学科的演变\n\n当特许信息安全学会（Chartered Institute of Information Security）最初开发`Skills\
  \ Framework`时，它分为两个部分：技术技能和软技能。最初，它的设计目标是定义特定工作和活动的要求。在这个阶段，展示`Skills Framework`的样貌是重要的。`Figure\
  \ 11.2` 显示了技能是如何分组的以及它们涵盖了什么。\n\n![Figure 11.2 针对安全学科的技能。](img/fig11.2.jpg)\n\n\
  *图 11.2* 针对安全学科的技能。\n\n这项倡议被各种网络安全专业人士采用，例如 `e-Skills UK`，随后被国家网络安全中心（`NCSC`）采用。\n\
  \n### 11.4 解决网络技能缺口的框架\n\n网络领域的技能缺口适用于所有学科和领域。随着数据池的增长，数据的处理和评估变得占据主；无论我们关注的是医疗保健、`IT`还是教育等，提出一种提升技能和识别新人才的方法都变得越来越重要。这正是基于工作的学习方法被证明是积极的，并对缩小缺口产生了影响（Advance\
  \ HE, 2015）。在医疗保健或教育等领域，学徒制路径是常态。护士、医生和教师通过实践进行学习。当我们观察网络职业时，会产生关于如何以类似的成功方式实施该职业的问题。\n\
  \n随着`Degree Apprenticeships`（学位学徒制）的增长，显显然需要一个新的框架。“知识”和“胜任力”框架开始培养基于实践的学术学位（Lester,\
  \ S., Bravenboer, D. and Webb, N., 2016）。在`Degree Apprenticeships`中，学习也是雇主主导的。当利益相关者开始思考如何开发此类进入网络路径时，他们将面临一些艰难的决策。你如何平衡学术学习与专业学习（Anderson,\
  \ A; Bravenboer, D; Hemsworth, D., 2012）？高等教育中这种新的整合方法确实可以解决技能缺口。如 `BCS` 和 `CIISEC`\
  \ 等专业机构现在可以将其标准映射到批判性思维、评估和反思等技能上。高等教育的这些专业价值转化了`Degree Apprenticeships`路径，障碍也随之消除。跨学科技能反映了毕业生在学术工作中所需的通用能力，学术与专业标准的整合成为了核心。\n\
  \n当模式和过程正在转型高等教育时，它们同样在改变行业。英国学费的上涨改变了格局。学徒制、学位和证书之间一直存在讨论和比较。学生们从成年早期开始就一直在做出这些艰难的决策（Vasileiou,\
  \ 2020）。我们经常看到有能力的学生往往无法就读大学。截至为止，`Higher Apprenticeships`（高等学徒制）尚未提供像`Degree Apprenticeships`那样的整体性学习方法（Beech\
  \ and Bekhradnia, 2018）。尽管出现了机会，但年轻群体仍在挣苦于寻找能引导他们进入学徒制的就业机会，或者他们的雇主没有对他们的整体和终身教育进行投资。因此，在开发`Degree\
  \ Apprenticeships`时，迫切需要将其不仅仅作为雇主的财务投资，而是通过与政府和专业机构合作，以激励和培养新一代人（`NCSC`, 2019）。\n\
  \n同时对学习者进行培训和教学成为一个重要主题，但它同样可能引发一系列问题。整合各种教学方法，脱离传统的教条方法，可以增强并赋能学习者以及获得学位的过程。仅仅理解法规框架通常是不够的。`Degree\
  \ Apprenticeships`交付的不仅仅是一套标准。它们探索了合作与机会，以促进所需的灵活学习，支持均等机会并满足多样化的背景。一些例子包括神经多样性、更多女性进入网络领域以及任何其他未被代表的领域。此类方法深受雇主和学生的欢迎。\n\
  \n网络课程的开发需要审慎考虑如何展望未来以及该学科将如何扩展。仅仅关注现在是不够的，一旦专业机构创建了新技能，将无法取得积极的成果，或者会导致课程改革的延迟。这种整体性方法和进入网络领域的新路径让雇主获益匪浅，因为他们变得更符合技能框架，并对该领域有了更深入的理解。\n\
  \n## 11.5 建议\n\n`Degree Apprenticeships`的实施可以被视为缩小网络领域技能缺口的一种极佳途径和方法。由于此类开发涉及许多利益相关者，表\
  \ 11.1 总结了学术界、雇主和政府如何合作共同构建人才管道的步骤和建议。\n\n*表 11.1* 构建缩小网络技能缺口人才管道的步骤\n\n| 问题 | 学术界/高等教育\
  \ | 机构 | 学徒 |\n| --- | --- | --- | --- |\n| 战略 | 创建实施学位学徒制的机构化方法。 | `Degree Apprenticeships`应该是组织`CP0`活动的一部分。\
  \ | 实施此类方法以支持工作与教育的管理。 |\n| 协作 | 尽早接触雇主。 | 与高等教育的合作。开发符合组织需求的学位。 | 与导师、学者和部门经理创建并实施分诊。\
  \ |\n| 三角测量 | 赋能并拥抱三种不同的经验：雇主和学术。 | 你的技能缺口是什么？识别特定的技能短缺并并通过学徒制进行改进。为员工提供`CPD`支持并识别学位学徒制的可能路径。\
  \ | 持续发展`CPD`。 |\n| 持续专业发展 (`CPD`) | 重新定义和设计教学学习方法的交付。 | 为员工提供`CPD`支持并识别学位学徒制的可能路径。\
  \ | 不适用 |\n\n\n\n\n\n| 拓展 (Outreach) | 向学校和学院推广学位学徒制。 | 神经多样性：识别新人才。 | N/A |\n|\
  \ 职业技能 | 嵌入专业机构的技能和框架。 | 在学徒的工作和培训中嵌入专业机构的技能和框架。 | N/A |\n\n展望未来，上述建议可供对开发学位学徒制感兴趣的利益相关者使用，以解决技能缺口。此外，也可供面临技能短缺并寻求提升员工技能方法的组织使用。\n\
  \n雇主可以引入全机构的策略，说明如何识别技能缺口，并让现有员工提升技能或招募新人才。`表 11.1``可以促进所有方之间的讨论，并帮助他们设计策略以增加对学位学徒制计划的参与。\n\
  \n## 11.6 结论\n\n本章不仅反思了网络安全领域广为人知的技能缺口问题，还反思了高等教育中网络学位学徒制的发展。本章的目的是为培养网络专业人士提供一条新路径，并强调此类路径对雇主具有价值，并且实际上可以解决并改善技能缺口。随着越来越多的雇主识别其组织在网络领域的技能缺口，`CIISec`\
  \ 和 `NCSC` (2019) 等专业机构正在接受、推广和认可学位学徒制路径。这导致了许多组织和高等教育机构快速增长，以提升技能或雇用新的网络专业人士。例如，即使是像\
  \ `HP` 和 `IBM` 这样的大公司也在该领域提升现有员工或通过学位学徒制路径投资新人才。\n\n尽管人们认为现阶段任何战略性方法可能不是 100%完美，但学位学徒制的实施已证明能够带来网络学科的人才稳定招聘。同样，学术界进入学徒世界并转变教学方法可以被视为组织的一个突破。事实证明，此类路径的发展对于学徒、学术界和雇主来说都是一种非常有前景的战略方法。事实证明，影响网络专业人士快速增长的最重要因素是将学徒制的发展与高等教育战略以及雇主的愿景和使命保持一致。对该领域有的雇主可以推动变化并预见。与此同时，围绕网络安全开发课程正变得极其重要。尽管各方都有迫切需求交付目前缺失且快速增长的网络技能，但以相同的学位通过不同的格式来满足雇主的需求，不仅识别合适的人员，还要识别能力的人员，同样是一项巨大的挑战。\n\
  \n仍然需要探索的其他领域是扩大参与面和包容性。高等教育（HE）为所有类型的学习者提供了支持，让每个人都有作为个人、作为毕业生以及为社会做贡献的机会。尽管此类教育模式可以为无法获得学生贷款的学生提供灵感并消除障碍，但高等教育对学生群体和入学人数的影响越来越小。雇主将提供其劳动力，通过将专业标准嵌入课程，扩大参与度的方面被外包给了所有这些利益相关者。\n\
  \n尽管面临新挑战且高等教育格局正在发生变化，现阶段值得注意的是，专业机构正与雇主和政府合作，试图重新定义学位教育的意义。在大学仍在开发和建立各种学位学徒制的同时，需要对雇主和专业机构的角色进行反思（Husband,\
  \ S., 2018）。后两者应该支持高等教育机构开发和调整其材料以弥补技能缺口（Lester et al., 2016）。目前，此类学位的实施并不由雇主或专业机构负责，但通过三角化方法，建议需要建立一个问责制度，让所有各和利益相关者协作解决网络技能短缺。重要是，任何政府、任何雇主以及所有专业机构都要适应并理解，缩小技能缺口只能通过共同的方法和为增长留出空间来实现。如果实现了这一点，政策背景就可以发生变化，变得更具包容性，并使任何大学学历与企业和组织的需求对齐。\n\
  \n根据所有激励措施，网络技能缺口的缩小速度并没有人们所希望的那样快（`Gov.uk`, 2020）。相反，快速的在线发展、新冠的影响以及数字化转型的影响意味着，`Computer\
  \ Science` 学科的任何学位或证书都需要嵌入围绕安全和隐私的技能与知识元素。网络领域可以得到学位学徒制路径的充分且成功的支持，而培训人员和/或学生将持续接触日常工作中真实的问题和挑战，而不仅仅关注理论方面。雇主大多数时候都提供尖端技术，因此这为学术界提供了保持与前同步并提供最新理论框架的机会。因此，让专业机构参与进来比以往任何时候都重要。他们是收集、整理和界定职业的人，提供持续的支持和指导。显而易见，在快速变化和增长的网络领域嵌入这些框架不仅是学术界的挑战，也是他们重塑自身产品并培养出具有专业和学术经验毕业生的机会（Vasileiou,\
  \ 2020）。一种嵌入网络的方法，结合嵌入的技能框架，将培养出具有终身学习特征的网络专业人士，反过来这将成为任何组织和网络职业的资产。\n\n网络安全技能缺口问题是优先于任何事情的问题。它应该被优先考虑，让所有利益相关者意识到在该领域培养新一代人的必要性。政府仍在努力理解学位学徒制应该是怎样的，并正在探索下一步。同样，雇主一直在评估这些网络路径的有效性，当然，考虑到新冠的突发影响，这已成为一个有趣的议题。许多企业因新冠影响面临的财务困难引发了对学位学徒制未来的担忧。然而，网络技能缺口正在不断扩大，疫情暴露了更多系统。尽管那里有针对特定技能的众多认证，但像网络学位学徒制这样的整体方法可以成为弥补缺口的创新战略方法。\n\
