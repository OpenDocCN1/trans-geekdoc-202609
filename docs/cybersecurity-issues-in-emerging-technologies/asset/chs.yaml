  \ 年 6 月。\n\n# 第 10 章 整体免疫\n\n## 一种应对网络领域混合威胁的综合模型\n\nAthanasios Kosmopoulos\n\n\
  DOI: [10.1201/9781003109952-10](http://doi.org/10.1201/9781003109952-10)\n\n## 10.1\
  \ 引言：背景与驱动力\n\n在过去的几年里，混合威胁和行动已经从一个理论框架演变为事实，并应用于当代作战领域 [[1]]。本章介绍并讨论了一种应对混合威胁的模型，其方式并非防御性的，而是从更广泛的意义上对它们产生免疫力\
  \ [[2]]。免疫是指在国家范围内开发的一系列流程，以便在演变为攻击之前的初始阶段，预测、响应并中和混合威胁及其结构组成部分。本章还关注了对当前问题提供有效高效响应所需的要素。整体免疫增强了组织或国家在需要实际防御之前成功应对混合威胁的能力。创建免疫力的主要方法是建立连续的检测和响应层次，从虚假新闻/虚假信息\
  \ [[3]]、网络防御、关键基础设施保护和国土安全开始。整体免疫模型提供了在混合行动尚未完全部署且仍处于初始阶段之前采取主动反应的能力 [[4]]。我们的主要重点是网络安全和网络防御。\n\
  \n## 10.2 问题定义——网络危机管理\n\n“网络冲突”和“网络战争”的出现是作为混合威胁范围内使用新技术的范例 [[5]]。网络战争是指一个国家（或非国家行为体）针对目标国家的信息技术发起的持续性计算机网络攻击\
  \ [[6]]。这种发生在战争第五维度的敌对行动示例是 2007 年俄罗斯试图虚拟封锁爱沙尼亚的互联网基础设施，作为对爱沙尼亚从市中心移除世界纪念碑的单方面反措施和报复\
  \ [[7]]。紧随其后的是 2008 年针对格鲁吉的复杂网络行动。\n\n这些构成了“网络型”混合威胁；可以说，正是这种新型且易于获得的技术使得这些威胁如此强大\
  \ [[8]]。指挥控制能力可以在较短的时间内通过极少的精力即可建立 [[9]]。媒体可以用于影响公众舆论，作为国内外心理作战（`PSYOPS`）的手段。网络威胁通过影响指挥控制能力来直击现代战争的核心，而这些能力已变得越来越容易受到网络攻击。此类网络威胁能力也直击了我们后工业现代社会的核心\
  \ [[10]]。将“网络”作为一种独立的威胁类别或作为执行其他多模态攻击的辅助工具的可能性可能会增加，因此其在混合威胁背景下的整体作用将会提升 [[11]]。\n\
  \n虽然在网络空间中许多不同的参与者都可能发挥作用。\n\n在网络防御中需要联合行动模型并非新事 [[12]]。公共调查和质询确定的发现和教训强调了此类情况：技术层服务本可以合作得更好，并与战略层决策者表现出更大部分程度的沟通、合作和协调\
  \ [[13]]。这就是为什么需要改进操作级管理以便在中间发挥作用。\n\n在加强技术层和战略层利益相关者之间联合工作的同时，显而易见的是，需要所有响应实体以联合和协调的方式运作。\n\
  \n促进联合工作的政策和程序构成了响应服务学说的基础。在事件的早期阶段，应用简单的联合工作原则尤为重要，因为在往往快速变化的环境中，需要以最小的延迟做出清晰、稳健的决策和行动。\n\
  \n这些原则在并在所示。它们通常（但并非总是）会按照呈现的顺序被遵循。\n\n*   **同地化（Colocate）**：在可行的情况下尽快将所有操作人员安置在一个单一、安全且易于识别的地点。\n\
  *   **沟通（Communicate）**：使用通俗的语言进行清晰交流。技术层与战略层实体之间意义且有效的沟通加强了有效的联合工作，并确保向公众传递高效的信息。信息的共享和理解有利于共享态势的发展，这是获得事件最可能结果的基础。\n\
  *   **协调（Coordinate）**：通过就核心问题达成共识来进行协调。识别有效响应所需的优先级、资源和能力，包括所有输入的技术数据。\n*   **共同理解风险（Jointly\
  \ understand risk）**：通过共享有关威胁和危害的可能性及潜在影响的信息，对潜在的控制措施达成共识。\n*   **共享态势感知（Shared\
  \ situational awareness）**：通过共同的标准操作程序（`SOPs`）建立联合决策模型并为战略层提供决策建议。\n\n给操作管理模型带来挑战因素主要涉及\
  \ [[14]]：\n\n*   **协调（Coordination）**，即同步能力以改进决策和风险管理，\n*   利益相关者之间**风险的共同理解（A common\
  \ understanding of risks）**，\n\n\n\n\n\n* **提升情报和态势感知能力**，以便在早期识别来自弱信号的威胁，并快速推进分析，\n\
  * **推进跨部门联盟**，跨越公共与私营、国外与国内的划分，\n* **为现有结构内的政策建议和决策提供信息**，\n* 确保**信息将被指定为关键领域，特别是出于公共传播之目的**，**\n\
  * **演练与训练。**\n\n运营管理方案应提供规划、实施和控制满足需求所需的 `SOPs`，并执行以下操作确定的行动：\n\n* 为 `Standard Operating\
  \ Procedures`（标准作业程序）建立标准，\n* 根据标准对 `Standard Operating Procedures`（标准作业程序）实施控制，以及\n\
  * 在必要范围内记录信息，以确保 `Standard Operating Procedures`（标准作业程序）已按计划执行。\n\n高效网络危机管理最大的问题之一是无法全面了解到底发生了什么、对社会产生的精确影响是什么，以及应该启动哪些缓解措施来处理上述影响。\n\
  \n缓解信息融合并支撑有关行动层面参与者的情报流具有非常重要的意义。这将有助于战略层实体汇集可用信息，协调可能不同的优先事项，并做出有效决策。来自不同参与者的不同类型情报必须在行动层面进行整合和评估。\n\
  \n在此背景下，建立共同态势图（common operating picture）具有极重要的意义，它是通过利用全面的态势感知获得的。\n\n我们将共同态势图定义为“通过对来自多个源的信息进行评估和融合而创建的对事件的共同概述，并在相关的指挥、控制和协调小组之间共享，以支持联合决策”。\n\
  \n在实践语言中，构建“共同态势图”对于应急响应组织之间清晰的通信和行动至关重要。这意味着在参与不同地点危机管理行动的不同机构和司法管辖区之间，实现足够的信息共享水平，以便所有参与者都能随时理解各自的局限，以及在给定条件下他们之间协作与支持的可能组合。共同态势图是相关人员的单一参考点，并支持联合决策。\n\
  \n通常，技术层面参与者提供的数据并不能被决策者充分观察或理解。解读是一项需求。回答以下问题有助于帮助建立共同态势图，并有助于建立共享的态势感知：\n\n* **发生了什么？**\
  \ – 发生了什么，现在正在发生什么，正在采取什么措施？\n* **那又如何？** – 可能产生什么影响和更广泛的影响/伤害？\n* **未来可能会发生什么？**\n\
  \n共同态势图的形式首先取决于技术要求和实践。它必须随着事件和输入的变化，以及随着进一步工作结果的可用（例如回答“那又如何？”或“可能发生什么？”问题的分析）而进行更新。\n\
  \n共同态势图应与建立的指挥、控制和协调小组（包括计算机安全事件响应团队 (`CSIRTs`））保持清晰的关系，并应通过适当弹性且安全的公共信息共享平台访问。\n\
  \n在其他语境下，行动层面的共同态势图可能是一个动态仪表板，使用地图、图形以及文本提供事件的概述。\n\n一场重大的网络危机可能是针对某实体的组合混合操作中的主要元素。\n\
  \n应对混合威胁是当务之急。混合威胁的概念被广泛定义为传统与非传统方法（即外交、军事、经济）的混合，国家或非国家参与者可以使用这些方法来实现特定目标，同时保持在战争阈值之下。应对混合威胁的关键概念——韧性——也难以捉摸。它通常是指承受和恢复的能力，其中关键基础设施起着关键作用。\n\
  \n重大网络危机管理涉及实体的领导作用，而这种作用并非显而易见。检查有关决策过程的网络治理模式，我们可以识别出三种基本模型：\n\n* 参与者治理的网络，\n\
  * 主导组织治理的网络，\n* 网络管理组织。\n\n第一种模型涉及网络成员自身所谓的“共享治理”，其特征是成员平等以及网络内部高水平的信任。第二种模型（主导组织模型）使用更加集中和层次化的方法，由主导机构负责网络内部活动和决策的协调。第三种模型（网络管理组织）涉及一个独立的外部实体来专门管理网络活动。\n\
  \n\n\n\n在军事背景下，OODA 循环描述了获取、处理和根据信息采取行动的能力，并与对手执行这些操作的能力进行对比。“进入对手的决策循环”这一常用术语，是指能够比对手更快地完成此循环。图\
  \ 10.1 概述了博伊德（Boyd）的 OODA 循环与其他常见循环方法的对比。\n\n![图 10.1 OODA 循环与其他循环过程的对比。](img/fig10.1.jpg)\n\
  \n*图 10.1* OODA 循环与其他循环过程的对比。\n\n正如博伊德在他在其《空中攻击研究》（1964）中暗示的那样，OODA 循环（见图 10.2《网络空间行动》中所描述，这前三层是：\n\
  \n1. **物理网络**层包含网络空间的物理元素。这些物理元素是支持运行的硬件、系统软件和基础设施。\n2. **逻辑网络**层包含与物理层相关的网络元素，这些元素是从物理层抽象抽象的。`JP\
  \ 3-12(R)` 举了一个网站的例子，该网站可以托管在多个位置，但通过单个 `URL` 访问。\n3. **数字人格**层是更高层次的抽象，它使用逻辑层的规则来开发用户的数字\
  \ `[18]` 表示。\n\n在网络空间中增加**认知维度**将网络空间行动的分析从寻找硬件和软件漏洞转变为一种包含信息行动的对抗。建议的修订网络空间层级所示图\
  \ 10.3。\n\n![图 10.2 OODA 循环。](img/fig10.2.jpg)\n\n*图 10.2* OODA 循环。\n\nOODA 循环分析的天才之处在于博伊德意识到对手视角的预测性分析可以被武器化，导致未来态势感知丧失。也就是说，采取与对手预期不一致的行动，从而剥夺对手的态势感知。\n\
  \n![图 10.3 网络空间的四层。](img/fig10.3.jpg)\n\n*图 10.3* 网络空间的四层。\n\n由于“当前的循环塑造了未来导向的特征”，博伊德提出了五种技术，旨在将信息置于环境中以破坏未来导向。这五种\
  \ OODA 循环操控技术是：\n\n* **模糊性**：对事件可能发生或可能未发生的替代或竞争印象。\n* **欺骗**：对并非事实事件的印象。\n* **新颖性**：与不熟悉或以前经历过的事件/想法相关的印象。\n\
  * **快速瞬态机动**：从一个机动事件/状态到另一个状态的不规则且快速/突然的转变。\n* **努力**：针对或通过允许有机整体存在的特征而投入的能量支出或暴力的爆发。\n\
  \n收集和分析历史事件是回顾性的解释性分析。将过去的知识应用于当前事件是并发态势感知。预测未来的攻击将模仿先前的攻击是前瞻性的预测分析。虽然无疑，更快地识别、分析和理解新攻击使防御更快地适应变化的事件，但这并非预测性活动，而是一种反应性活动。人工智能和机器学习系统的重要性异常，因为它们能够比人类执行此任务更快地处理历史信息。\n\
  \n现在检查“混合威胁”格局，我们可以清楚地区分出四个主要支柱：\n\n1. **误导/虚假信息和假新闻** `[19]`\n2. **破坏稳定**——基于民族或意识形态基础对国内团体进行觉醒和支持\n\
  3. **网络攻击** – 网络恐怖主义、对关键基础设施的攻击\n4. **传统手段**，如政治、军事、外交、财务和宗教手段。\n\n根据手中混合行动的具体部署和性质，上述支柱可能会同时出现或仅出现其中之一\
  \ `[20]`。\n\n在本章中，我们主要关注第三支柱。\n\n为了成功应对这一挑战，关键利益相关者应该以全面的方式开发以下内容：\n\n1. **态势感知**\n\
  2. **事件响应**\n3. **公共传播**\n\n我认为，上述三个领域应该以预测性的而非响应的方式提供服务。目前，不同的威胁之间相互关联，以至于作为响应的混合防御是不够的。一旦检测到混合行动，部署防御措施就太晚了。损害已经在进行，且不易停止。\n\
  \n## 10.3 建议的模型](#contents.xhtml#re_h-10-3)\n\n我提出了一种混合、整体的多层免疫模型，该模型将在行动部署之前有效保护国家资产并提前覆盖漏洞。\n\
  \n该模型由来自不同领域和国家的不同 SOP 层级以及利益相关者的参与组成，形成一个专注的工作组，不断评估和分析所有可用数据。\n\n图 10.4 展示了该模型。\n\
  \n![图 10.4 混合免疫模型。](img/fig10.4.jpg)\n\n*图 10.4* 混合免疫模型。\n\n第一层是关于一种检测假新闻 `[21]`\
  \ 的机制，假新闻通常出现在重大网络事件之后。\n\n第二层涉及反误导信息行动，以便在网络危机管理期间就公共传播需求做出适当响应。\n\n第三层涉及国土安全力量和与可能威胁的情报\
  \ `[22]`。\n\n第四层由传统的网络安全实体（CSIRTs、SOC 等）组成，主要是基本服务和关键基础设施的运营商。\n\n第五层也是一层涉及武装部队并涉及其网络防御能力。\n\
  \n整体混合免疫模型提供了一种任何防御模型无法提供的就绪状态和准备能力。\n\n\n\n\n\n所有这些主动性的层级都确保了有效的就绪水平和韧性，以便能够充分应对由国家或非国家行为者发起的未来混合行动。\n\
  \n共享相关信息是增强混合韧性有效方法的一个重要方面，因为它符合公共部门和私营部门利益相关者的利益 [23]]。这是因为这增加了集体的意识，从而使每位利益相关者都能够根据威胁格局的演变来调整自身的安全态势。另一方面，集体应对是成功准备艰难时期的最佳方式，尽管最佳应对措施必须是预判性的。\n\
  \n## 10.4 结语\n\n正如美国国立标准与技术研究院（NIST）指出的，威胁和攻击传统上一直是组织安全和网络风险讨论的中心；关注这些问题是一种直观的反应，因为为了防止网络损害，我们必须了解自己在网络空间中可能如何受到攻击。评估所产生损害的一种方法是能够预判此类威胁及其可能的意图。这种威胁驱动型方法的替代方案是，将安全风险分析的重点首先放在资产和影响上\
  \ [24]。\n\n通用网络安全危机响应框架在整合目标和合作模式方面正处于十字路口。必须确定相关的参与者、机构和当局，明确他们在应对重大网络危机在运营方面的贡献。必须制定标准操作程序（SOP），对态势感知、事件响应和通信需求进行规范，以识别不断演变的混合威胁。\n\
  \n在技术层面，观察到的主要关注点是“风险和威胁的影响”。在运营层面，在应对混合行动时，“损害”更具相关性。\n\n态势感知是一个多维且经过充分研究的现象，可以从几个不同的视角来看待。对于作战指挥控制案例，本文认为态势感知的技术面和认知面是紧密相关并在某种程度上交织的。网络安全不应仅关注硬件、软件和网络问题，而应该扩展到涵盖网络领域混合行动中包含的认知问题\
  \ [25]。\n\n应急事件响应过程中最具挑战性的部分正是检测和评估可能的网络安全事件——确定并识别是否发生了个人事件，然后定义响应活动的目标——最后以适当的方式进行调查，以检查该事件是否包含在综合混合行动的语境中。下一步是控制损害，并最终恢复和还原一切到正常运行。\n\
  \n运营层面管理中的一个重要组成部分是危机通信计划。战略级决策者必须在紧急情况发生后的几小时或几天内，能够做出及时、准确且自信的响应。必须针对许多不同的受众提供符合其利益和需求的特定信息。处理重大网络安全事件不仅是一个需要解决的技术问题，它还涉及必须解决的通信和声誉影响。\n\
  \n响应机制的形象可能会受到公众对事件处理感知的积极或负面影响。运营层面应当能够就适当的通信提供建议。\n\n运营管理和决策过程通过一种深思的基于 OODA 循环的过程（收集数据、理解数据并创建建设性的、知情的决策和受控的），将允许利用其优势，特别是在通用混合行动的背景下部署网络攻击时\
  \ [26]]。\n\n最重要的是，国家或企业环境中必须有一个单一的自主且能力的实体来接管（指挥、控制和协调）所有运营层活动，并对来自技术层的所有可用数据、情报和信息进行融合。\n\
  \n治理网络安全的重点和方向必须来自实体（无论是国家还是企业）的最高层。实现可接受安全水平的方法必须得到充分的推动。\n\n## 10.5 术表\n\n**混合威胁**：强制性与非强制性手段的混合（例如外交、军事、经济、技术），可由国家或非国家行为者在低于正式战争门槛的情况下使用。\n\
  \n**综合方法**：一种意味着全政府和全社会参与的整体模型。\n\n**OODA 循环**：（观察/调整/决策/行动），由约翰·博伊德提出，旨在操纵环境以抑制对手的能力。\n\
