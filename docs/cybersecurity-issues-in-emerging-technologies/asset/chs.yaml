  \ 150 多篇论文。\n\n\n\n\n\nOne Source Consultoria Informática Lda.\n葡萄牙，科布拉\n\n**Paulo\
  \ Simões**\n科布拉大学, DEI, CISUC\n葡萄牙，科布拉\n\n**Richard Smith**\n蒙特福特大学\n英国，莱斯特\n\n\
  **Aikaterini Vardalaki**\n欧洲与美国研究学院\n荷兰，莱顿登\n\n**Ismini Vasileiou**\n蒙特福特大学\n英国，莱斯特\n\
  \n**Giorgos Vasiliadis**\n希腊研究与技术基金会\n希腊，赫拉克利昂\n\n**Vasileios Vlachos**\n塞萨利阿里大学\n\
  希腊，沃洛斯\n\n# 第 1 章 硬件辅助安全性的演进\n\nGeorge Christou, Giorgos Vasiliadis, Elias Athanasopoulos,\
  \ and Sotirios Ioannidis\n\nDOI: [10.1201/9781003109952-1](http://doi.org/10.1201/9781003109952-1)\n\
  \n在本章中，我们研究了现代架构中实现的安全机制。从本质上讲，基于硬件的安全对于强大的攻击更为有效，同时可以最大限度地减少带来的运行时开销。本章的结构如下：在第\
  \ 1.2 节中，我们介绍了当前生态系统中各种攻击的概述。第 1.3 节介绍了近期提出的学术界或工业界机制，这些机制旨在阻止与安全相关的威胁。在第 1.4 节中，我们介绍了利用精简\
  \ `TCB`（信任计算基础）的硬件内存隔离技术，这些技术可以部署以提供强大的安全性。最后，第 1.5 节介绍了源于复杂硬件设计的漏洞。\n\n## 1.1 引言\n\
  \n软件应用程序、服务或协议通常受不同的安全工具和架构保护，其中大多数基于坚实的基础以确保其有效性。然而，攻击者仍然能够通过将攻击重定向到下方的软件层来绕过它们。系统由软件组件组成链链，其安全性取决于最薄弱的环节点；因此，只有当软件栈的每一层都是安全的，系统才是真正安全的。应用程序、系统库、操作系统、驱动程序和虚拟机监控程序都必须经过加固。然而，即使这样可能也不够的。硬件本身必须是安全的，并为在其之上构建的所有软件层提供适当的能力。为了解决上述问题，将安全机制从软件层向下推到系统栈硬件层是不可避免的。硬件安全机制的优点是攻击者很难（甚至不可能）绕过。这背后的主要原因是硬件通常不像软件那样是可以修改的。同时，硬件安全机制在性能、简单性和功耗方面具有更高的效率。最后，硬件层维持着整个系统状态的完整视图。由于芯片面积的快速增长，许多功能被推向硬件层，而不必剥夺软件层的资源。构建坚实安全的基础是迈向目标的第一步。\n\
  \n## 1.2 威胁格局\n\n### 1.2.1 常见的软件漏洞\n\n大多数软件漏洞源于今天应用程序中存在的软件漏洞。软件漏洞会导致程序执行中出现未定义行为。攻击者旨在控制这些未定义状态，以形成其攻击所需的原语。这些原可以是进程地址空间中的任意读取或写入原语，也可以改变受影响进程的控制流。\n\
  \n`Buffer overflows`（缓冲区溢出）是攻击者利用的不安全语言中最常见的软件漏洞。在缓冲区溢出期间，程序向缓冲区写入数据而不检查实际大小，超出了为缓冲区分配的边界，并覆盖相邻的内存区域。攻击者可以利用缓冲区溢出漏洞在任意位置写入数据，甚至通过覆盖控制流值（例如返回地址）来劫持进程的控制流。\n\
  \n`Buffer over-read`（缓冲区越界读取）与缓冲区溢出类似，但不是覆盖相邻数据，而是程序读取了缓冲区之外。这些漏洞被攻击者利用来映射进程地址空间。\n\
  \n`Use-after-free`（释放后使用）是一种软件漏洞，在内存释放后指向该内存的指针未失效。当内存再次分配时，该指针可能被用于引用内存区域，导致未定义的程序行为。\n\
  \n### 1.2.2 软件利用\n\n`Code Injection`（代码注入）是一种众知的安全利用手段 [30。通过向系统发送特制的数据，可以由于缓冲区溢出漏洞将代码段覆盖为恶意代码，劫持系统功能。另一种方法是写入恶意代码并将执行引导至。这可以通过将返回地址覆盖为恶意代码的起始地址来实现。由于返回地址和数据缓冲区都位于栈中，因此缓冲区溢出可以将返回地址覆盖为攻击者所需的地址。这些攻击不仅局限于二进制级别。\n\
  \n`Return-to-libc`（返回 libc）是代码注入攻击的自然演进，由于不可执行数据保护机制，此类攻击通常已不再可能 [7]。由于数据执行（DEP）阻止了注入恶意代码的执行，现代攻击不再依赖于注入恶意代码并转移执行。因此，攻击者将重点转向使用可执行地址空间中存在的代码来实现非法目的。“返回-to-libc”攻击依赖于覆盖调用栈上的返回地址，指向进程内存中已存在的子程序地址。在许多程序中，大多数系统库随应用程序一起加载，为攻击者提供了大量的函数来破坏系统。\n\
  \n`Code reuse attacks (CRAs)`（代码重用攻击）依赖于执行漏洞应用程序中已有的代码。现实中最常见的 CRA 是返回定向编程。返回定向编程（ROP`）是一种软件利用技术，侧重于劫持目标程序的控制流，以强制其离开正常的指令执行序列。它影响许多常用的处理器架构，包括\
  \ `x86`、`ARM`（高级 RISC 机器）[25] 和 `SPARC`（可缩处理器架构）[13]。它是栈溢出的一种更高级的版本，区别在于它利用修改栈的漏洞来覆盖存储在其中的返回地址。随后，新的返回地址被用于将可执行文件的控制流更改到攻击者所需的路径。\n\
  \n\n\n\n\n由于攻击者现在已经拥有对栈的控制权，并随后获得了对返回地址的控制，他跳转到程序地址空间中的任何可执行内存。逻辑上的下一步是识别他想要运行的代码，并将返回地址指向该代码。这些识别出的代码段被称为\
  \ `gadgets`（getget）。`gadgets` 是短小的指令序列，通常以返回指令结束。攻击者通过缓冲区溢出等与栈相关的漏洞，将每个 gadget 的地址推入栈中，从而将这些\
  \ gadget 链接在一起。由于 `gadgets` 以返回指令结束，因此在执行结束时，一个 gadget 将跳转到推入栈的下一个地址。攻击者可以通过反汇编程序来识别某个\
  \ gadget 将提供什么功能，或者在二进制文件不可用于分析的情况下，通过观察每个 gadget 对栈以及整体控制流产生的影响来识别，正如 Bittau 等人在《Hacking\
  \ Blind》\\[11] 中所示。在 CISC 处理器中，gadgets 更加常见，且由于攻击者可以将执行流指向指令的任何字节，因此可以导致指令的解释偏离其原始功能。\n\
  \n## 1.3 硬件安全机制 (#contents.xhtml#re_h-1-5)\n\n在后续章节中，我们将回顾许多旨在提高系统安全性的流行处理器特性。我们还介绍了新的扩展，这些扩展存在于较新的处理器中，但在当前的软件中尚未标准化。幸运的是，这些技术在即将推出的软件中的采用正日益流行。软件中包含这些功能的进展缓慢，是因为需要对源代码进行重新编译、代码重构，以及需要采用面向安全的编程风格。此外，编译器必须调整其处理流程以包含这些功能，以便产生在性能、安全性以及这些新技术的利用方面经过优化的可执行文件。\n\
  \n### 1.3.1 保护环 (#contents.xhtml#re_h-1-6)\n\n保护环（Protection Rings）的概念是首批硬件支持的安全机制之一。本质上，它们实现了操作系统与运行在其之上的应用程序之间的隔离。通常，允许操作系统对机器资源和应用程序进行完全控制。另一方面，应用程序以较低的权限运行，以限制它们在没有监控的情况下控制机器的其余部分。常见的\
  \ RISC 架构（如 `ARM` 和 `SPARC`）仅提供两个隔离级别，通过 `supervisor` 位进行控制。当处理器执行操作系统代码时，`supervisor`\
  \ 位被设置，当处理器被应用程序占用时，该位被清除。`supervisor` 位阻止了若干机器指令的执行，以及对特定机器和处理器控制寄存器的控制。采用 `x86`\
  \ 架构的 CPU 包含许多不同级别的权限（即 `protection rings`），以隔离设备。攻击者可以将执行流指向指令的任何字节，从而导致指令的解释偏离其原始功能。操作系统始终在\
  \ `Ring 0` 执行，并启用硬件辅助的虚拟化。1.1\n\n![1.1 x86 处理器的保护环，来自维基百科，CC BY 3.0](https://commons.wikipedia.org/w/index.php?curid=895144)\n\
  \n![1.1 保护环，来自维基百科，CC BY 3.0](https://commons.wikipedia.org/w/index.php)\n\n 1.3.2\
  \ 主机模式执行防护 (#contents.xhtml#re_h-7)\n\n为了增加保护粒度，现代处理器的迭代包含了某些特性，以防御软件攻击。`SMEP`（主机模式执行防护）是其中一项，限制内核执行用户代码。`SMAP`（主机模式访问防护）是\
  \ `SMEP` 的互补，保护内核访问数据。\n\n 1.3.3 数据执行防护 (#contents.xhtml#re_h-8)\n\n数据执行防护（`DEP`）是一种硬件特性，当程序计数器指向数据内存时，该机制会停止应用程序。由于大多数漏洞依赖于越界内存访问（例如超出数组大小），该机制可以有效发现许多安全漏洞。\n\
  \n`DEP` 根据处理器的不同有不同的缩写 \\[2]。在 Intel 处理器中，它被称为 `XD` 位（执行禁用）。当该位为 0 时，假设页面包含代码并可以执行；如果值为\
  \ 1，则页面不可执行。AMD 使用相同的方法，将其称为增强防护。在 `ARM` 架构中，它通过 `XN` 位（禁止执行）放置在页表项中。在 `SPARC V8`\
  \ 中，该机制通过引用 MMU 使用，具有只读、读写/执行权限策略。\n\n### 1.3.4 Intel 内存保护扩展 (#contents.xhtml#re_h-9)\n\
  \n内存保护扩展（`MPX`）是 Intel 处理器在 2015 年引入的一种特性。部署这些扩展的软件通过为每个指针关联上下边界来增强安全性。每当引用指针时，都会检查其关联边界。如果存储在指针中的地址越界，则会抛出边界异常。\n\
  \n然而，该特性吸引人的安全保证带来了较高的运行时开销。如果检查的边界不在寄存器中，则即将引用的指针边界必须从存储在主内存的 `Bounds Table` 移动到边界寄存器中。这种操作是非常昂贵的，因为需要类似于\
  \ `TLB`（转换查找缓冲区）缺失的过程在 `Bounds Table` 中查找指针地址。此外，每个指针相关的边界给缓存系统带来了巨大压力。平均，使用 `ICC`\
  \ 部署 `MPX` 在 `SPEC` 基准测试中产生了 50% 的开销 \\[3]。\n\n2018 年，`GCC` 和 `Linux` 提议移除对 `MPX`\
  \ 的支持 \\[17, 27]。这些决定的做出由于对 `MPX` 有性的严重担忧。尽管 `MPX` 是软硬件协同设计，但其带来的开销是无法接受的。它没有提供时间内存安全，因此不支持多线程。编译器必须重新设计，以显式同步内存边界。\n\
  \n\n\n\n\n在 Intel 处理器引入此前之前，边界检查（bounds checking）在文献中是一项被广泛研究的技术。纯软件实现（例如，[9], [114]]）有几个缺点，使得它们并不吸引人。它们需要对源代码进行非平凡的修改，违规检测非常有限，而且运行时开销非常大。像\
  \ Hardbound [16]] 和 CHERI 的 [40]] 指针边界检查系统等硬件方法基于**胖指针（Fat Pointers）**的概念。在这里，每个指针的值都与元数据（如基地址和长度）关联，以验证指针在变化时仍保持在边界内。这些硬件方法实现了更好的细粒度，同时引入的开销也在可接受范围内。\n\
  \n### 1.3.5 Intel 内存保护密钥\n\n内存保护密钥（MPK）[33]] 是 Intel 最近引入的一种硬件机制。它允许用户空间进程更改一组页的权限。每个页组都与一个唯一的密钥关联，每个应用程序最多可以拥有\
  \ 16 个页组。MPK 还支持每线程视图，即不同的应用程序线程可以与每个密钥（即页组）关联有不同的访问权限。与页表相比，MPK 的主要优势是性能的提升，因为更改权限不再需要切换到内核态。此外，不同的线程可以在同一个进程内进行隔离。对页组支持的访问权限有：(i)\
  \ 读/写，(ii) 只读，以及 (iii) 无访问。\n\n由于 MPK 是一种完全无特权的机制，设计为从用户级代码进行控制，因此当攻击者控制了 `PKRU`\
  \ 寄存器或可以执行任意指令时，它是没用的。然而，当它与能够防止任意代码执行的机制结合时，它可以增强应用程序抵御其他类型攻击，例如内存泄露。\n\n### 1.3.6\
  \ ARM 内存标记\n\n该机制建议用于未来的 ARM 版本（8.5 及更高版本）[8]]。该机制的核心思想是，每个 16 字节的内存块将使用 4 位值进行标记。每个指针的\
  \ 4 位高位将存储可访问有效内存块的标记。因此，只有当地址和目标具有相同标记时，加载和存储操作才能生效。内存块在释放时会重新打标记。这种机制可以防止许多依赖于任意内存访问的利用技术。例如，指向缓冲区的指针将无法访问缓冲区边界的连续内存块，从而在缓冲区溢出时有效保护相邻内存不被重写。该机制的一个潜在问题是\
  \ 4 位标记提供的熵较低，因此该机制的性能开销尚未经过测量。\n\n![图 1.2 内存标记](img/fig1.2.jpg)\n*图 1.2 内存标记*\n\
  \n### 1.3.7 指令集随机化\n\n代码随机化技术 [34], [32]]] 试图通过打乱代码位置来增加代码重用的难度，但事实证明简单的泄露就可以暴露文本段\
  \ [35]]。指令集随机化（ISR）[23]]]提供了针对信息泄露的防御，因为 ISR [10]]] 是在执行前加密主内存中的指令。\n\n最初，ISR 是为了防御代码注入而提出的，因为攻击者需要加密密钥才能注入意义的代码。另一方面，XnR\
  \ 将所有可执行文件标记为不可读；因此任何披露布局的尝试都会导致内存违规。ISR 不仅可以用于二进制文件的随机化，也可以用于解释型语言（例如 Perl）。\n\n\
  ![图 1.3 指令在主内存中始终加密，在指令缓存中进行解密](img/fig1.3.jpg)\n*图 1.3 指令在主内存中始终加密，在指令缓存中进行解密*\n\
  \n### 1.3.8 控制流完整性\n\n与其隐藏代码，另一种阻止利用的途径是防止非良性代码的执行。一个很有前景的方向基于以下观察：现代利用引入了并非程序良性控制流图（CFG）部分的控制流。1.4\
  \ 控制流完整性（CFI）[5]]，因为 CFI [31]]]建议运行的程序应该只表现出源代码定义的程序原始 CFG 中的控制流。基本上，CFI 要求任何间接跳转不能指向程序中的任何指令，而是被限制在预定义的允许地址范围内。\n\
  \n尽管已经提出了许多机制且在防御软件利用方面非常有效，但在软件中实现时，它们通常面临两个问题。首先，大量的安全检查会产生巨大的运行时开销。其次，它们可以被绕过，因为信任计算根很大，攻击者可以针对许多信任组件之一，例如操作系统和固件。例如，研究人员提出了松弛的\
  \ CFI 方案以分摊运行时开销 [42]]，但目前已公认此类方法可以被绕过 [18]]。另一方面，硬件增强的安全机制被证明在防御利用方面方面有效得多，并且在性能开销方面更具实用性\
  \ [15]]。\n\n\n\n\n\n前向边缘 CFI（Forward-Edge CFI）指的是对前向边缘分支的强化，即间接调用指令。间接调用利用存储在内存中的函数指针来寻找目标。遗憾的是，这些指针并没有安全地存储在内存中，极易受到篡改而损坏。前向边缘\
  \ CFI 验证间接调用是否到达了属于授权分支目标组的目标。这会将调用限制在极少数的间接分支目标上，希望这些目标没有攻击者可以利用的。\n\n后向边缘 CFI（Backward-Edge\
  \ CFI）指的是对后向边缘分支的强化，即返回指令。返回指令像间接调用一样利用存储在栈中的指针作为分支目标。由于该指针位于栈中，因此它极易受到篡改。后向边缘 CFI\
  \ 跟踪返回地址，并验证每个返回指令确实到达了其目标。\n\n![图 1.4 控制流完整性规定允许通过 CFG 分析发现的控制流跳转](img/fig1.4.jpg)\n\
  \n*图 1.4* 控制流完整性规定允许通过 CFG 分析发现的控制流跳转。\n\n### 1.3.8.1 Intel 控制流强制技术\n\n控制流强制技术 (CET)\
  \ [4] 是 Intel 在 2016 年 6 月宣布的一种技术。CET 定义了一个影子栈（shadow stack）以保护后向边缘控制流传输。当启用 CET\
  \ 时，调用指令负责将返回地址推入影子栈，同时也推入原始栈中。任何 `ret` 指令都会导致弹出影子栈，并确保其与从应用程序栈中获取的返回地址匹配。如果不匹配，将抛出异常并停止应用程序执行。影子栈的完整性由\
  \ MMU 保护，以防止攻击者覆盖其中的返回地址。任何尝试访问影子栈内容的内存指令都会被 MMU 拦截并触发页错误。为了保护前向边缘控制流传输，使用 `ENDBRANCH`\
  \ 指令来标记应用程序代码中调用和间接跳转指令的合法落地点。当执行跳转时，CET 进入 WAIT FOR ENDBRANCH 状态。如果 `ENDBRANCH`\
  \ 指令不是程序流中的下一条指令，处理器将引发控制保护故障。\n\n### 1.3.8.2 ARM 指针完整性\n\n该机制利用密码原语（哈希）在在使用控制流指针之前验证其是否未被损坏。每个控制流指针的指针认证码（PAC）存储在指针的未用位中（即指针的\
  \ 24 个高位位）。PAC 使用自定义指令进行计算和验证：\n\n- `PAC <pointer>, &<pointer>`（通常在栈中）：使用进程密钥计算\
  \ MAC。\n- `AUTH <pointer>, &<pointer>`：使用进程密钥验证 MAC。\n\n每个进程都有一个唯一的密钥，用于计算和验证控制流指针。使用的加密算法是\
  \ `QARMA`。这项技术已经部署在近期使用 `ARMv8.3` 的 Apple 产品中。Google Project Zero 的一项近期研究识别了该技术中的多个漏洞\
  \ [19]。\n\n## 1.4 可信执行环境\n\n如果操作系统存在漏洞，几乎任何软件安全机制都无法防御系统的功能。可信执行环境（TEEs）定义了具有强大攻击者的威胁模型。推向极端，由这些安全机制定义的可信计算基础（TCB）缩小到仅包含处理器的可信部分\
  \ 1.5。\n\n### 1.4.1 仅执行内存\n\n研究文献中存在许多类似的提案，旨在缩小可信计算基础，使其仅包含处理器芯片 [26, 36]。XOM（仅执行内存）[26]\
  \ 通过通过为每个缓存行打上容器标签，支持许多容器（称为区域）之间的隔离。此外，它在处理器的内存控制器中集成了加密和 HMAC 验证，因此它可以验证存储在片外内存中的数据完整性。然而，XOM\
  \ 容易受到重放攻击，即内存区域被之前存在该区域的旧数据覆盖。\n\n![图 1.5 可信执行环境中减少的攻击面。受保护的应用程序只信任芯片和将在 TEE 中运行的代码](img/fig1.5.jpg)\n\
  \n*图 1.5* 可信执行环境中减少的攻击面。受保护的应用程序只信任芯片和将在 TEE 中运行的代码。\n\n### 1.4.2 Aegis\n\nAegis\
  \ [36] 只信任一个小型安全内核，该内核还负责隔离应用程序。它使用内存加密和完整性检查来保护存储在片外内存中的数据，并使用 Merkle 树防止片外内存的重放攻击。\n\
  \n### 1.4.3 ARM TrustZone\n\n`TrustZone` [1] 允许将执行域分为可信和不可信域。可信执行域留给可信系统代码，而第三方应用程序在不可信域中执行。这种分离扩展到内存和外设，以实现系统级安全，例如，具有\
  \ DMA 能力的外设被禁止访问可信执行域的内存区域。\n\n![图 1.6 带有 Trustzone 的 ARM SoC 概述。CPU 拥有两个执行域。Flash\
  \ 和 SRAM 定义了可信和不可信区域。外设可以根据安全考虑定义为可信或不可信。当然，DMA 也应该受到限制](img/fig1.6.jpg)\n\n*图 1.6*\
  \ 带有 Trustzone 的 ARM SoC 概述。CPU 拥有两个执行域。Flash 和 SRAM 定义了可信和不可信区域。外设可以根据安全考虑定义为可信或不可信。当然，DMA\
  \ 也应该受到限制。\n\n\n\n\n\nIntel Software Guard eXtensions (SGX) 于 2013 年提出，并于 2015 年引入\
  \ Intel 的 Skylake 微架构。其安全保障机制为用户级应用程序的不同部分提供了强有隔离，并进一步增强了即使驱动程序、操作系统和 BIOS 被完全攻破也能保持这种隔离性\
  \ `1.5.`。有效而言，可信计算基础（TCB）被缩小到仅剩处理器硬件。通过这种机制，开发者可以将代码和数据封装在名为 `enclaves` 的实体中以对其进行保护。SGX\
  \ 机器码指令用于创建和初始化 enclave，并移动其中的代码和数据。底层硬件为 enclave 提供了机密性和完整性。驻留在主内存中的 enclave 数据始终是加密的。它们仅在移动到处理器内部时才会解密，并在那里通过完整性检查测试。负责这些操作的组件是内存加密引擎\
  \ `[21]`。因此，即使被动攻击者窃听处理器和主内存之间的总线，所获取的数据也是无用的。在主动攻击者覆盖 SGX 内存区域的情况下，MEE 将检测到伪造。目前，为\
  \ enclave 分配的大小限制为 128 MB。下一版本的 SGX (2.0) 将支持动态内存分配。此外，每个处理器独有的封存密钥（Seal Key）可以在应用程序终止时存储整个\
  \ enclave 以备未来之用。SGX 的另一个卖点是安全远程计算 `[6]`。想要使用远程计算的用户可以验证运行在远程 enclave 中的软件是合法的，并确保发送到远程主机的数据不会被主机所有者访问。因此，用户仅信任运行在\
  \ enclave 中的软件的作者以及处理器制造商（即 Intel）。\n\n## 1.5 硬件漏洞 (#contents.xhtml#re_h-1-21)\n\
  \n现代通用处理器硬件设计复杂性的增加及其各种优化，为一类新型硬件漏洞的出现铺辟了道路。恶意方可以利用这些漏洞发起强大的攻击，例如泄露敏感数据或获取基主机的完全控制权，即使基主机已受到最强隔离技术的保护。这些漏洞的主要原因是处理器的硬件资源在不同进程之间被积极共享，主要是为了性能和利用率。\n\
  \n### 1.5.1 瞬态指令执行 (#contents.xhtml#re_h-1-22)\n\nSpectre `[24]` 证明了以推测或乱序方式执行的指令会导致缓存修改。能够控制缓存并观察瞬态执行指令影响的攻击者能够泄露原本无法访问的内存。Spectre\
  \ 首且最持久的变体是边界检查绕过。该攻击的场景是：在访问增量内存地址的循环期间，由于分支预测器会被训练为采取该分支，处理器会在计算边界检查之前推测性地访问数组边界之外的内存。能够在沙箱环境（例如\
  \ JavaScript 引擎）中运行代码的攻击者可以推导出原本无法访问的内存。\n\nMeltdown `[28]` 是另一种漏洞。Spectre-V2 `[24]]`\
  \ 可以泄露内核内存。RIDL `[39]` 可以针对微架构组件，如 Fill Buffers 和 Load ports。SGX `[12]` 可能会受到这些攻击的影响。\n\
  \n### 1.5.2 作为侧信道的缓存 (#contents.xhtml#re_h-1-23)\n\n对于攻击者而言，观察微架构状态的变化同样重要。在不同的学术出版物中，作者利用\
  \ FLUSH+RELOAD `[41]` 和 Prime+Probe `[37]`，攻击者填充填充部分缓存集。\n\n### 1.5.3 建议的防御措施 (#contents.xhtml#re_h-1-24)\n\
  \n上述漏洞极难解决，因为它们需要禁用硬件资源共享和激进推测，这样做会大幅降低 CPU 性能。同样，目前的软件缓解措施只能解决有限数量的不同攻击变体，同时引入了巨大的性能开销。内核页表隔离（KPTI）是\
  \ Linux 中用于防止 Meltdown 攻击的机制。KPTI 基于 KAISER `[20]]`，并能有效防止内核内存泄露。\n\n\n\n\n\n针对\
  \ Spectre 的第一个变体，英特尔（Intel）建议在访问敏感内存的基本块开头使用 `fence` 指令 [22]。通过这种方式，处理器将被强制对之前取取的指令进行序列化执行，而不会瞬态执行敏感分支。然而，这种技术要求开发者对敏感的基本块进行标记以插入\
  \ `fence` 指令，并且可能会抑制能够显著优化应用程序性能的*良好*预测。英特尔针对分支目标注入（Branch Target Injection）变体的缓解措施引入了一系列机制，可以防止攻击者利用这一系列漏洞。根据应用程序的需求，可用策略提供了：(i)\
  \ 限制间接分支预测的选项，(ii) 防止分支预测器被其他线程控制，以及 (iii) 间接分支预测器屏障（Indirect Branch Predictor Barriers），可以在切换到处理敏感数据的应用程序时发出以刷新分支预测器值。\n\
  \n为了修复近期利用侧信道破坏进程隔离机制的攻击（即使在可信执行环境中也是），研究人员提出了关键的架构更改来防止信息泄露。`MI6` 是一种乱序处理器，即使攻击者可以观察微架构状态（例如缓存内容、内部缓冲区）并利用预测状态和分支预测器，它也能防止来自隔离（enclave）执行的信息泄露。`MI6`\
  \ 的关键架构修改是对硬件资源进行严格划分，以防止通过对手可观察的延迟导致信息泄露。因此，隔离应用程序永远不会与普通应用程序共享硬件资源（例如缓存、微架构状态寄存器等）。`MI6`\
  \ 还依赖于在处理器调度新进程时刷新隔离执行的微架构状态，以擦除任何依赖于执行的状态。最后，`page-faults`（页错误异常）被直接路由到隔离区，以防止通过观察隔离执行的页错误异常来泄露信息\
  \ [38]。\n\n## 1.6 结论\n\n尽管生产系统中已经启许多缓解技术，但对现代系统的利用无疑仍然可能的。为了解决这个问题，趋势正转向将安全机制从软件向系统栈栈向下推。硬件安全机制的优势在于性能、简单性和功耗方面更高效，同时还能保持对整个系统状态的完整概述，且不像像软件那样可以被修改。\n\
  \n在本章中，我们介绍了现代商用处理器中提供的常用安全机制。这些机制在加固软件应用程序、服务或协议的安全性方面可以发挥重要作用，并为不断变化的威胁格局提供更强大的保护保障。\n\
