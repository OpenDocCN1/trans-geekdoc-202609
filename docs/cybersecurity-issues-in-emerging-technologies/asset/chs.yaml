  \ 30 届年会论文集，2017 年。\n\n# 3. 引言\n\n### 3.1 背景\n\n工业控制系统 (ICS) 指一组自动化技术，如监控控制与数据采集系统\
  \ (`SCADA`) 和分布式控制系统 (`DCS`)，它们为国家提供核心服务。2013 年签署的一项美国行政命令指出，“网络威胁持续增长，并是我们必须面对的最严峻挑战之一”。这些基础设施通常由工业控制系统\
  \ (`ICS`) 支撑，这些系统管理的过程如果不能以预测的方式执行，可能会导致伤亡、人员损失、环境破坏，以及严重的财务问题，例如对国家经济产生负面影响的生产损失\
  \ [19, 24, 27, 17, 10, 21, 9]。\n\nNaedele [23] 认为，ICS 安全涉及的成本高得令人接受，特别是在关键系统中，当对组织或基础设施的感知风险无法被充分量化且业务理由未被充分阐述时。这通常导致部署的运行环境中事件响应能力开发不足\
  \ [18, 6]。\n\n多年来，项目管理方法遵循线性设计，例如瀑布模型 [26]，在前一阶段完成之前，后一阶段无法开始，一旦该阶段完成，在不投入巨额成本的情况下就不会重新访问。这最主要的例子是需求捕，对需求的任何更改都被证明是代价昂贵的，并且往往会导致延迟、成本增加或项目失败\
  \ [28]。随着软件变得越来越复杂，客户对更快的交付和部署周期的需求增加，显而易见，许多情况下需要更灵活、适应性强的方法。这最终导致了《敏捷宣言》[20]的发布，它定义了敏捷开发的四个核心价值：\n\
  \n- 个人和互动优于过程和工具\n- 运行软件优于详尽文档\n- 客户合作优于合同谈判\n- 响应变化优于遵循计划\n\n\n\n\n\n通过采用这 4 个价值观，结合敏捷宣言中提出的\
  \ 12 条准则，软件团队能够缩短产品上市时间，并在整个项目生命周期内应对快速变化的需求 [16]]。在敏捷宣言发布后的 18 年里，敏捷方法的采用率迅速增加，某些调查显示，现在\
  \ 97% 的受访者正在使用某种形式的敏捷实践 \\[15]]。这种创新的方法针对的是变化瞬息万且目标和优先级变化极快的环境 [12]]。通过采用敏捷工具和技术，所提议的方法有助于安全事件的处置。\n\
  \n僵化的程序化事件响应流程增加了防御工作的可预测性，但在快速切换和多管齐下的网络攻击背景下，使得保护剩余的基础设施和业务功能变得更加困难。特别是当事件响应（`IR`）跨越信息技术（`IT`）/运营技术（`OT`）边界时，利益相关者（通常来自不同的学科和组织层级）之间的通信经常受到阻，情态感知随之降低。另一方面，敏捷方法欢迎需求的变化，并由价值以及能够管理冲突利益相关者需求的跨职团队对系统的理解所驱动。因此，这种方法适用于变化持续存在、且环境和目标未明确识别或定义的环境。本提议主张整合和评估在\
  \ `Scrum` 和 `Kanban` 等领域使用的敏捷方法和实践，以使安全事件响应团队具备快速响应变化的能力，同时保持对业务及其价值链的关注。从本质上说，事件响应需要适应网络攻击的高度动态性，并预判攻击者进一步的利用路径\
  \ \\[13]]，且这需要跨学科的团队协作才能做出有效响应。\n\n## 3.2 遵守法律要求及运营指南\n\n《网络和信息安全指令》（`NISD`）要求关键服务运营者（`OESs`）和数字服务提供商（`DSPs`）在“无不当延迟”的情况下向相关机构通知对其提供的关键服务连续性产生重大影响的安全事件\
  \ \\[18]]。在英国，这一时间被定义为组织意识到事件发生后不于 72 小时。\n\n在英国，`OES` 的义务包括“采取适当且比例的技术和组织措施，管理对其关键服务所依赖的网络和信息系统安全构成的风险”。他们必须“向指定的主管通知任何对该\
  \ `OES` 提供的关键服务连续性产生重大影响的事件”。`NIS` 指令允许成员国设定其罚款阈值。在英国，信息专员办公室可以处以高达 1700 万英镑的罚款。任何事件管理的敏捷方法必须符合欧洲法规和国家法律，以确保组织不会面临罚款。近期，出现了专门针对\
  \ `NIS` 指令要求 \\[8]\\]或整合了多项法规 \\[3, 2]\\]的网络安全成熟度评估框架。这些框架既可以作为组织的自评估工具，也可以作为国家主管的审计工具。一个需要回答的重要问题是：在使用敏捷方法（特别是在事件管理中）时，如何调整这些框架以确保高效。\n\
  \n## 3.3 工业控制环境事件管理中的当前问题\n\nBraun 和 Clarke 描述的主题分析 \\[5]\\] 已用于分析对 18 位事件响应专的访谈，以识别关键压力点和敏捷技术可以产生价值的领域。研究表明：\n\
  \n*   事件在数量和影响上如何变化，以及这如何影响 `IR` 及其有效性。\n*   存在信息过载与可用信息匮乏并。具体来说，似乎经常缺乏关于系统以及系统如何运行的信息，这通常归因于\
  \ `OT` 系统可能非常老旧且复杂，以及缺乏具备适当知识的人员。\n*   `IR` 团队关注个人任务和责任，而不是团队目标，而运营室中往往缺乏 `OT` 人员。\n\
  *   部门以及 `IT` 和 `OT` 专家之间缺乏沟通。在涉及第三方公司时情况也是如此。第三方公司可能位于不同的国家，这使得通信更具挑战性。\n*   他们的方法通常是自适应的，但仅在识别出适应需求时才如此。专业人士指出，他们对常见案例遵循一致的方法，仅在需要变化的更复杂案例中进行调整。\n\
  *   媒体和外部沟通是一个非常令人关注的问题。似乎人们不愿与机构分享事件信息或与媒体交谈；据此，外部沟通总是由层级较高的人员处理。\n\n\n\n\n\n敏捷开发重视个人和交互，而非流程和工具。工业控制系统（ICS）高度重视个人的专业知识。负责\
  \ ICS 运行和维护的人员需要具备多样化的知识，以理解复杂系统之间的依赖关系。ICS 系统不仅涉及控制系统和 IT 系统的安全，还涉及物理安全，这要求人员理解安全与安保之间的联系\
  \ [4]。网络攻击的最终目标通常是安全系统；然而，这些系统在设计时通常不会考虑组件的故意故障。因此，人员的专业知识和判断是影响 ICS 事件响应决策的要素因素。事件处理不能仅仅依赖于预定义的流程和工具\
  \ [25]。\n\n敏捷开发重视运行的软件而非详尽的文档。运行软件已成为替代详尽文档的衡量进展的主要标准。在安全事件调查期间，会收集大量的安全相关信息，如日志文件、指标、先兆症状和事件报告。这些是重要的交付物，可以在事件响应的“跟进”阶段用于学习和防止未来的攻击。然而，安全专业人员被这些信息淹没，无法妥善地审查并从以往事件中学习。有一些尝试使用安全保障方法将安全知识可视化\
  \ [14]；但为了事件学习和共享之目的，应考虑运行的软件（即交付物） [1]。\n\n敏捷开发重视客户协作而非合同谈判。ICS 事件响应要求不同利益相关者之间的协调，例如管理层、控制工程师和操作员、IT\
  \ 部门以及组织中的其他角色 [4]。由于控制工程和 IT 的文化通常差异很大，跨文化的理解与协作将是协调事件响应的关键 [1]。此外，大多数控制系统都是互连的或具有依赖关系，而且大多数针对国家关键基础设施的控制系统安全攻击都是协调的，这再次强调了\
  \ ICS 中协调事件响应的重要性。\n\n敏捷开发通过遵循计划来响应变化。敏捷旨在使安全事件响应团队具备快速响应变化的能力。理想情况下，事件响应应该适应高度动态的网络攻击，并预判对手进一步的利用路径；然而，遵循预定义的计划将增加组织防御努力的可预测性。频繁的软件补丁和更新不适用于\
  \ ICS，因为系统可用性被高度优先，且 ICS 过程本质上是连续的 [29, 22]。需要一个能够准确模拟 ICS 并评估补丁和系统更新影响的仿真环境。\n\n\
  为了帮助事件响应团队采用敏捷方法，可以从软件领域借鉴许多技术。这些技术强化了敏捷方法的核心价值和原则，极大影响了团队成员的态势感知（见图 3.1）。以下包含了一些核心技术：\n\
  \n![图 3.1 一个敏捷 ICS 事件响应决策框架。](img/fig3.1.jpg)\n\n图 3.1 一个敏捷 ICS 事件响应决策框架。\n\n* \
  \  **冲刺（Sprints）**——冲刺不是采用线性方法，而是一个时间限制的迭代，在此期间发生事件的目标是更早地产生业务价值。冲刺改变了团队的操作程序，工作得到了更好的分配和估算，并增加了沟通。由于事件的性质变化极快，冲刺使事件响应团队能够\
  \ 地识别并适应威胁，并在识别最佳防御努力方面变得更加主动。\n\n*   **每日站会（Scrum 会议）**——全队成员参加的每日站会。这些会议不应超过 15\
  \ 分钟，但应包括最近一次冲刺的关键行动。会议促进了团队内部更高的可见性和信息共享，减少了徒劳工作和背道而驰。会议为控制工程师提供了机会，就影响当前调查和响应的更多\
  \ ICS 方面提供技术专家。在事件响应（IR）背景下，可能需要更频繁的站会。其他 Scrum 会议，如计划、评审和回顾也适用于缩短周期。\n\n*   **事件待办列表（Incident\
  \ backlog）**——所有活动被分为成功管理事件所需的待完成项目。这些项目应该经过适当的详细说明，随时间演变、进行估算、排序（DEEP），然后可以分组成主题，例如法医调查、日志分析等。自组织是敏捷团队行为的一个基本方面，在事件期间管理任务的协作方法对于最大化成功响应至关重要。事件待办列表由一人所有，负责在响应期间对交付物进行排序。\n\
  \n*   **看板（Kanban board）**——一种旨在优化工作流和增加信息共享的可视化工具。管理事件所需的所有活动都包含在内，将当前活跃的项目和已标识完成的项目分开。通过确保所有团队频繁完成并更新看板，团队成员的态势感知能力提高，整合新成员所需的时间显著减少。这些更新通常与站会相关，并捕捉和引导口头更新。\n\
  \n## 3.5 评估活动 #contents.xhtml#re_h-3-5\n\n为了评估敏捷技术的效，2019 年 9 月在英国莱斯特的德蒙福特大学（De\
  \ Montfort’s）校区进行了为期三天的红蓝对抗演习。该活动利用了德蒙福特大学（DMU）的 CYRAN 网络范围，这是一种混合网络范围，为沙箱环境提供虚拟和物理系统。为了增加场景的真实性，范围内整合了许多操作技术设备。在行动开始之前，蓝队参与者接受了敏捷方法的使用培训，并被允许熟悉时间，以便理解他们将要防御的网络和系统。双方都提供了场景文档，提供了事件的背景和上下文信息。这包括每方的特定交战规则和目标。\n\
  \n### 3.5.1 场景 #re_h-3-6\n\n活动 1 的海事场景选择为一个正在遭受复杂、多维度网络攻击的港口。由于设备的可用性，该场景将利用罗尔斯·莱斯（Rolls\
  \ Royce）船总线测试平台。场景中涉及三个独立的网络：\n\n*   企业网络\n\n*   港口的操作技术\n\n*   船用总线网络\n\n\n\n\n\
  蓝队将负责防御所有这些网络上的元素。每个网络将包含多个机器，并加入真实的流量生成，以确保红队的任何行动都不会立即被察觉。\n\n### 3.5.2 蓝队组成\n\
  \n蓝队由来自工业界和政府的 16 个人组成。与真实的事件响应小组一样，成员在活动期间根据人员的可用性而波动。成员中代表了多种技能组合，其中安全运营分析师最为常见。\n\
  \n在活动期间，蓝队参与者占据三个角色之一：事件负责人（`IO`）、敏教练（`SM`）或团队成员。\n\n- `Incident Owner`（事件负责人）——来自工业界的参与者。该参与者具有传统的管理经验和军事小队指挥经验。敏捷技术的采用在整个练习过程中各异。在早期，他们承担了较为被动的角色，侧重于行动的战略管理。随着场景的推进和妥陷指标变得越来越明显，他们对会议和任务分配了更大的控制权。\n\
  - `Scrum Master`（敏捷教练）——来自军事的参与者。该参与者习惯于低层级指挥，且之前没有该角色的经验。他很好地执行了任务并在练习开始时控制了 Scrum\
  \ 会，但随着场景的展开，由于 `IO` 强化了其领导风格，他采取了更多被动的角色。\n- `Team Members`（团队成员）——来自工业界、军事和政府的参与者。蓝队的许多参与者具有军事背景。这种人口统计意味着引入了对某种操作模式的无意识认知偏见，即层级化的、自上而下的方法。在练习的早期，部署了更扁平的团队结构，团队成员能够自选大多数所执行的任务。随着练习的进行，任务变得越来越复杂，团队成员变得越来越关注特定类型的任务，通常是他们经验最丰富的任务，例如防火墙配置或威胁狩猎。需要注意的是，到练习结束时，每位团队成员都自愿完成了一项他们他们不熟悉的领域的任务。\n\
  \nAIR4ICS 旨在创建一个能够整合到现有 CERT（计算机应急响应小组）操作程序中的框架，尽可能在任何地方提供额外价值，而不是立即强制团队进行范式转变。为此，事件负责人和敏捷教练的角色并不严格遵循敏捷软件工程中发现的方法。事件负责人将履行传统的\
  \ IR（事件响应）经理职责，因此需要对事件保持战略监督；同时，他们能够妥善地分配团队资源。他们还负责确保收到的任何威胁情报被识别并整合到响应中。敏捷教练将负责维护团队的态势感知并领导\
  \ Scrum 和冲刺会议。他们的核心重点是团队内部的沟通；他们负责确保事件待办列表（backlog）和 Scrum 板的维护和更新。他们还担任协调员，安排团队成员之间需要进行的任何小组会议。\n\
  \n### 3.5.3 敏捷方法\n\n蓝队采用的方法详述如下。通过问卷和讨论会从参与者那里获得了反馈，以确定最佳实践。\n\n#### 3.5.3.1 冲刺（Sprints）\n\
  \n为了在分配的时间内最好代表真实事件的时间跨，冲刺持续了 3 小时。尽管随着场景推进事件压力增大，但整个过程中都使用了冲刺计划和回顾。焦点小组强调的关键要素之一是冲刺概念：参与者认为，将时间分段化并花时间分析整体情况是非常有益的。\n\
  \n#### 3.5.3.2 冲刺计划（Sprint Planning）\n\n在早期的交流中，冲刺计划会议是开放的，并观察到了不同参与者之间的沟通。敏捷教练保持讨论进行，参与者能够选择他们认为最胜任的任务。在活动的后期，事件负责人对会议采取了更直接的控制，讨论变成了围绕特定任务的态势更新。结果，任务根据行动的关键性被分配给个人。\n\
  \n#### 3.5.3.3 冲刺回顾（Sprint Retrospectives）\n\n所有参与者都参加了冲刺回顾。这些会议被用于对之前的 3 小时进行复盘（hotwash）。学习矩阵（见节\
  \ 1.5.3）的引入鼓励了所有团队成员参与讨论。这些会议让参与者根据上一次冲刺的经验确定下一次冲刺的任务优先级。\n\n#### 3.5.3.4 Scrum\
  \ 会议\n\n在整个活动期间，定期举行了持续 15 分钟的 Scrum 会议。第一天，Scrum 每 30 分钟举行一次，每个冲刺 4 次。参与者的反馈表明，虽然有用，但\
  \ 30 分钟不足以完成某些更复杂的任务。在第 2 天和第 3 天，删除了每个冲刺一次的 Scrum 会并将 Scrum 之间的时间延长到 45 分钟。在转向更长的会议后，所有参与者都同意\
  \ Scrum 会议是有用的，并让他们对整体行动有更清晰的了解。这是活动时间缩短的产物。在真实事件中，预计 Scrum 会将每天举行，或在快速变化的行动中每天两次。Scrum\
  \ 会议的时间应该足够频繁，以确保所有团队成员对事件响应保持良好的态势感知，但又不至于对行动产生负面影响。\n\n### 3.5.4 任务分配\n\n敏捷促进了任务的动态分配，以便根据发展的形势快速重新分配资源。\n\
  \n#### 3.5.4.1 任务的自选\n\n从事件待办列表中选择的任务分配（自选）发生在冲刺计划会议期间。参与者能够选择他们认为最符合其个人技能组合或兴趣的关键任务。这使得蓝队在准备日取得了良好的初步进展。随着场景的推进，IR\
  \ 团队恢复了更熟悉的层级结构。这被认为部分是由于事件负责人的授权增加，部分是由于在及时结果至关重要时对在自身专业之外行动缺乏信心。在没有人自愿承担的冲刺中，事件负责人直接分配了任务。失败的恐惧被确定为参与者决策的驱动因素，凸显了练习对个人发展的重要性。在没有明确妥陷指标的压力刺激下，参与者更愿意接触未接触的技术并增加基础理解。\n\
  \n#### 3.5.4.2 T 型团队（T-Shaped Team）\n\n\n\n在第 1 天和第 2 天，具备操作技术的参与者被纳入团队中。在这些日子，OT\
  \ 专家不仅用于调查，还充当了其他成员的协调员。通过结合成员的技能组合，OT 专家能够承担更具战略性的角色，同时为分析师提供了足够的信息，以从可用流量中得出结论。对广泛知识的需求在活动期间被凸显。不熟悉\
  \ OT 的参与者将 SCADA 日志误认为是系统流量，由于记录数量庞大，他们无法识别出其中的有用信息。这导致了红队行动的证据，例如新系统的用户创建被丢失了。\n\
  \n### 3.5.5 敏捷工具\n\n参与者在冲刺回顾期间利用了以下工具，以辅助他们的情境意识和决策。\n\n### 3.5.5.1 事件待办 (Incident\
  \ Backlog)\n\n初始事件待办创建于准备日。它包含了高级任务，并随着更多信息的可用而设计了可立即分配的任务的任务。这种动态资源在整个事件过程中被定期使用并更新。为了辅助战略规划，所有任务都进行了优先级排序，尽管对工作的估算被认为是抽象的。\n\
  \n![图 3.2 AIR4ICS 事件 Scrum 板](img/fig3.2.jpg)\n\n*图 3.2 AIR4ICS 事件 Scrum 板*\n\n\
  随着活动的进行以及新信息/基础设施的可用（例如提出的新挑战），事件待办进行了相应的更新。事件待办被视为一种实用的战略规划工具，允许参与者快速地识别当前和未来的任务。\n\
  \n### 3.5.5.2 Scrum 板\n\nScrum 板为 Scrum 会提供了一个动态焦点并被广泛使用（见 `Figure 3.2`）。参与者在问题出现时将新任务添加到待办部分。在\
  \ Scrum 会期间，由负责的成员自然地采取了这种模式，团队成员能够操作任务看板，但通常专注于完成任务和内容，以等待 Scrum 会的中断。这种方法限制了其他成员的情境理解，因为它不再能准确代表工作。因此，随着练习的进行，IO\
  \ 和 SM 在 Scrum 会之外变得更加主动地更新任务。\n\n所有参与者都认为 Scrum 板在快速节奏的活动期间是有益的。它让他们通过更好地组织自己的任务、识别依赖关系以及消除参与者可用性导致的信息共享瓶颈，提高了他们的效率。\n\
  \n![图 3.3 学习矩阵示例](img/fig.3.jpg)\n\n*图 3.3 学习矩阵示例*\n\n### 3.5.5.3 学习矩阵\n\n参与者同意学习矩阵在回顾中是一个实用的工具（见\
  \ `Figure 3.3`）。所有参与者都能在四个象限之一提供信息：\n\n* 良好的方面\n* 糟糕的方面\n* 表现优秀者\n* 对下一阶段的建议\n\n\
  想法被汇总成主题，并通过开放讨论选出前五个。这种关键的反思允许蓝队识别新的操作方法，将精力集中在感知最大的风险上，并强调需要注意的问题。通过利用匿名便利签作为沟通方法，允许了可能不会参与冲刺回顾的成员提供意见。\n\
  \n### 3.5.6 事件问卷\n\n每个参与者在每次冲刺回顾期间都完成了问卷。这些问卷旨在评估每个参与者的心理负荷、信任和情境意识。主要发现总结如下：\n\n\
  1. 该研究早期的发现（对从业者的访谈）得到了研究小组设计的问卷初步结果的支持，该问卷调查了工业控制系统响应（IR）的当前实践和挑战。\n2. 决策风格：在敏捷训练和实践后，严谨性、控制力、犹豫和理想主义增加了。\n\
  3. 团队决策：在敏捷训练和实践后，分数略有提高。\n4. 正面和负面影响：培训后正面影响有所增加，但某些元素的负面影响也增加了。\n5. 团队人际信任：信任倾向、感知信任度和协作行为有所增加，而监控行为有所减少。\n\
  \n## 3.6 讨论与结论\n\nICS 事件响应与传统的 IT 事件响应有所不同。尽管存在某些重叠，但 IT 中的许多响应实践无法直接应用于 ICS。因此，需要一种新方法，一种能够快速适应并促进利益相关者之间沟通的方法。对行业专业人员的访响应进行了主题分析，涌现了一些关键主题，如沟通和情境意识的批判性。四大敏捷价值被映射到\
  \ ICS 事件响应的范围内以满足这些需求，并辅以了一些帮助现场响应团队的工具。适当的事件响应可以改进与 ICS 相关的技术归因 `[[7]]`。\n\n未来的研究将关注业务案例研究，探讨通过探索性工业案例研究的实施，敏捷价值的整合是否可以改进\
  \ ICS 流程。未来的研究还包括特定敏捷技术（如 Scrum 或看板）的选择和评估，以根据 Scrum 团队中多个团队和利益相关者的协调来解决响应中的挑战，并引入响应协调员来促进响应团队内部的最佳实践，担任\
  \ Scrum Master 的角色。\n\n## 3.7 术语表\n\n**事件响应 (Incident Response)**：一种用于处理和管理安全泄露或网络攻击后果的组织化方法。\n\
  **敏捷 (Agile)**：一组通过自组织、跨职能团队协作演进解决方案的方法和实践。\n**ICS (工业控制系统)**：一个涵盖用于工业过程控制的多种控制系统及相关仪的术术。\n\
  **冲刺 (Sprint)**：开发团队工作完成设定工作量的短时间时间盒周期。\n**NISD**：关于网络和信息安全的指令。\n\n\n\n3. Aliyu\
