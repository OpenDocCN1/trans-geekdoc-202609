  \n30. Jie Sun, Zhao-hui Wu, and Gang Pan . 上下感知智能汽车：从模型到原型, *浙江大学报(工版)*, 10(7),\
  \ 1049–1059, 2009 年 7 月.\n\n31. K. Trishank, A. Brown, S. Awwad, D. McCoy, R. Bielawski,\
  \ C. Mott, S. Lauzon, A. Weimerskirch, and J. Cappos . Uptane：保障汽车软件更新. In *International\
  \ Conference on Embedded Security in Car*, 2016.\n\n32. R. V. Stokar . 通过空中更新汽车\
  \ ecu (fota), 2013 年 9 月 16 日.\n\n33. Anthony Van Herwege, Dave Singele . Can-a：一种简单的向后兼容的认证协议.\
  \ In *ECRYPT Workshop on Lightweight Cryptography*, Vol. 20, 2011.\n\n34. Marko\
  \ Wolf and Timo Gendrull . 车辆安全模块的设计、实现与评估. In *International Conference on Information\
  \ Security and Cryptology*, 302–318.\n\n35. Shi Zhendong, Lu, Yu Qing, and Zeng\
  \ Xing . 基于红外传感器的智能控制系统, *湖北汽车工业*, 3, 11–14.\n\n# 第 9 章：新兴恶意软件威胁\n\n## 勒索软件案例\n\n\
  *Aikaterini Vardalaki and Vasileios Vlachos*\n\nDOI: [10.1201/9781003109952-9](http://doi.org/10.1201/9781003109952-9)\n\
  \n## 9.1 勒索软件的演变\n\n随着恶意攻击者不断发现新方法来利用安全、基础设施和社会层弱性，网络威胁格局不断变化。创新精神和简单的试错是其驱动力，其核心目标是以攻击者最低的风险榨取尽可能多的信息或财物。此时，“勒索软件”一词应运而生：一种具有传染性、自我传播的恶意软件，它采用各种加密方法拒绝用户访问系统文件。随后，它会索要金钱价值，通常是比特币或其他难以追踪的支付方式。\n\
  \n首例勒索软件感染案例可以追溯到 1989 年，当时攻击者开始通过电子邮件发送受感染的磁盘，这些磁盘据称包含有关艾滋病的信息。当用户插入磁盘时，系统文件被锁定，攻击者要求通过邮寄将\
  \ 378 美元的实体付款发送到巴拿市的一个邮政信箱。这一特定的历史案例在当时并未被识别为勒索软件攻击，尽管它体现了勒索软件攻击的常见类型：(1) 加文件，从而将其作为人质；(2)\
  \ 向受感染的用户索要付款以解锁或解密系统；(3) 在付款后提供解密密钥或选择忽略用户。\n\n\n\n\n\n互联网网络犯罪威胁评估（IOCTA）由欧洲刑警组织（Europol）提供年度报告，旨在识别网络犯罪的威胁格局。IOCTA\
  \ 报告已勒索软件连续三年列为首要威胁，也是网络空间中最主导的威胁 [[[15\\] (IOCTA, 2018, 2019, 2020)。换句话说，勒索软件正变得越来越具有针对性和细节，不断适应并克服每年可能出现的任何安全标准。为了推进研究并更好地理解这一现象，有必要对著名且破坏性最大的勒索软件变种进行历史回顾，并对其的类型和操作模式进行简要说明。遵循历史路径，将简要阐述当前的威胁格局，以及勒索软件成本的概述。之后，将讨论勒索软件最常见的传播技术和通用法律问题。最后，通过对本章内容的讨论来结束本章的介绍。\n\
  \n## 9.2 新兴威胁\n\n为了更好地理解勒索软件现象，有必要讨论勒索软件之前的时代。在世纪初，出现了新型网络诈骗。`恐吓软件（Scareware）`活动因其恐吓策略而得名，它们通过巧妙的社会工程学手段针对缺乏经验的用户。其目标是说服他们购买无用的软件以摆脱虚构的病毒\
  \ [20]\\]，或者支付赎金以避免因被控犯了他们从未犯过的网络犯罪而受到起诉。两种最常见的恐吓软件活动是`假杀毒软件（Fake AntiVirus Software）`和`锁机软件（Lockers）`。\n\
  \n网络犯罪分子向单纯的用户出售了大量的假杀毒（`FakeAV`）软件和其他无效的网络安全产品 [46]]。起初，犯罪分子利用保护不当的、运行 `Microsoft\
  \ Windows` 操作系统或 `Internet Explorer` 网页浏览器的个人电脑（PC）的各种已知漏洞和缺陷。随后，他们反复向这些系统的所有者显示大量伪警告信息。这些信息虚假地声称电脑感染了大量病毒。建议的解决方案是购买建议的杀毒产品来清理和修复系统。实际上，建议的程序是毫无用的。虚假的\
  \ `AntiVirus` 除了一个据称显示消毒进度的图形用户界面外，没有任何任何有用的功能。结果，用户被操纵购买了一个没有功能的应用程序，用以从未被感染的系统中清除不存在的计算机病毒和其他虚构的网络威胁。这些活动也出现在各种网站的各种虚假广告中。一家名为“创新营销（`IM`）”的公司甚至雇佣了一个团队来处理恐吓软件活动，并在乌克兰运营期间，2004\
  \ 年至 2008 年间似乎获得了 1.63 亿美元的收入 [20]]。通常，受害者支付的平均价格在 60 美元到 80 美元之间，而网络犯罪子的总利润接近 1.3\
  \ 亿美元 [47]]。仅在这样一个案件中，美国联邦调查局（`FBI`）就捣毁了一个利用恐吓软件感染 96 万用户 [1]\\]并收集了近 720 万美元的犯罪网络。\n\
  \n另一种流行的恐吓软件活动是`警察锁机（Police Locker）`、`警察木马（Police Trojan）`或`警察勒索软件（Police Ransomware）`。声称犯了非法活动相关网络犯罪\
  \ [13]\\]的用户可以通过支付赎金获得自由。网络犯罪分子利用 `Java`、`Flash` 和 `PDF` 查看器等流行软件中存在的已知漏洞获取系统的访问权限。随后，他们能够锁定系统并在主屏幕上根据地理位置显示来自\
  \ `FBI` 或其他国家警察力量的消息。在这两种情况下，这些攻击的目标大多数都是缺乏经验的用户，他们无法识别诈骗迹。希望 `FBI` 或任何国家警察力量仅仅因为嫌疑犯同意支付一小笔费用就释放其犯罪，完全是不合理的。尽管如此，对于技术先进的用户来说，相信自己的个人电脑同时感染了多种病毒，而修复方法简单且只需点击一下就能解决，是非常罕见的。\n\
  \n尽管 `FakeAV` 和 `Police Locker` 活动在财务上取得了成功，网络犯罪分子决定采取更激进的策略。在 2013 年至 2015 年间，`CryptoLocker`、`CryptoWall`\
  \ 以及其他仿制的勒索软件变种非常活跃且具有突破性。首先，2013 年的 `CryptoLocker` 使用 `P2P Gameover ZeuS` 恶意软件（一种基于旧木马的僵尸网络）发送了带有恶意链接的大批量垃圾邮件\
  \ [28]\\]。这是历史上第一次使用已感染的计算机网络和受感染的网站分发勒索软件。它还利用钓鱼邮件针对 `Microsoft Windows` 用户。攻击成功后，将使用强非对称加密的\
  \ 2048 位 RSA 密钥对对各种文件进行加密。这意味着解密受影响的文件只有通过攻击者提供的私钥才能实现，并且必须在感染后的前三天内支付 300 美元 [36]]。`CryptoLocker`\
  \ 从影响企业和业务开始，然后扩展到个人电脑。在 2014 年，在 `FBI`、国际刑警组织、学术界和其他安全专家的联合执法行动“托瓦行动”后，`CryptoLocker`\
  \ 被瓦解。当时，模仿者已经复制了它的操作模式。考虑到网络格局受影响之快，`CryptoLocker` 的继者 `CryptoWall` 的出现并不意外。到 2015\
  \ 年，估计有 1800 万美元从受害者手中被盗，这导致 `FBI` 发布了警告声明。\n\n\n\n\n\n`Petya` 和 `NotPetya` 勒索软件使用了相同的方法，使其能够进行适应和变异以避免检测。与\
  \ `CryptoLocker` 和 `CryptoWall` 变体不同，`Petya` 针对整个系统，覆盖主引导记录 (`MSB`)。2017 年，`Petya`\
  \ 的新版本（后来命名为 `NotPetya`）利用了 Windows 中名为 `EternalBlue` 的漏洞。`EternalBlue` 是 `NSA`\
  \ 网络武器的一部分，旨在成功地在内部网络中传播，从其他系统中提取登录信息，并最终利用这些信息横向传播到其他网络 [17]。`EternalBlue` 由一个名为\
  \ `Shadow Brokers` 的黑客组织在网上泄露。该小组还揭露了 `NSA` 拥有自己版本的 `Mimikatz`，这是一种强大的密码窃取工具。`NotPetya`\
  \ 会加密并覆盖超过 100 种不同的文件扩展名，并要求支付 300 美元的 `Bitcoins` 以解密。`Petya` 和 `NotPetya` 使用的感染方法包括通过钓鱼攻击获取对选目标的访问权限。事实上，`NotPetya`\
  \ 被证明是全球最危险、破坏性最大的勒索软件之一。随后的分析认为，`NotPetya` 使用的加密程序是不解密的。即使是攻击者也无法提供解密密钥，导致受感染的数据和系统完全不可逆转且丢失\
  \ [17]。根据美国司法部的说法，`NotPetya` 是俄罗斯军情报机构 `GRU` 开发的，作为全球网络战争行动的一部分，发起了了针对乌克兰政府和其他乌克兰关键基础设施的攻击\
  \ [16]。最近的证据表明，俄罗斯黑客利用 `NotPetya` 干扰了大量活动。例如，它据称干扰了 2018 年平昌冬奥运会，阻碍了禁止化学武器组织 (`OPCW`)\
  \ 对谢尔盖·斯克里帕尔及其女儿遭到的诺维乔克中毒的调查，攻击了英国国防科学技术实验室 (`DSTL`)，并最终干预了法国选举 [1]。2017 年，一家拥有全球业务的丹麦航运公司\
  \ `Moller-Maersk` 感染了 `Not-Petya`，并报告了价值在 2.5 亿至 3 亿美元之间的财务损失 [4]。与 `Petya` 和 `NotPetya`\
  \ 类似，`WannaCry` 勒索软件极具灾难性，瘫痪了 150 个国家的企业。它利用了帮助 `Petya` 和 `NotPetya` 勒索软件传播的相同 `EternalBlue`\
  \ 漏洞 [38]。在分类方面，`WannaCry` 被认为是蠕虫和勒索软件的混合体。此外，它利用服务器消息块 (`SMB`) 协议中的 Windows 漏洞来获取访问权限，并采用随机和局部扫描的传播策略\
  \ [11]。\n\n\n\n\n勒索软件像任何犯罪活动一样，会针对不同的目标进行调整，且其预期也会根据每个最终目标而形成。在私人和个人家庭系统受感染的情况下，面临危险的数据包括个人信息、照片或家庭视频，有时还包括工作文件。对于受感染的个人来说，个人文件可能重要到足以支付赎金的程度。这总计需要用\
  \ `Bitcoins` 支付 400 美元。个人保留不支付赎金的选项，因此面临着丢失文件的风险。与企业相比，同样的感染每年可能导致数百万美元的损失，更不用说未记录在案的案例了。根据\
  \ `Accenture` 2019 年的年度网络威胁报告，公司的平均感染成本达到 260 万美元。尽管如此，受感染机构的真正区别在于，他们不能简单地格式化系统并重新开始。这一方案是不可行的。但如果组织能够掩盖事件，以避免因使客户信息面临风险而遭受巨额\
  \ `GDPR` 罚款，那么这种财务成本可能是值得支付的。更不用说公众发现感染后，备受预期的消费者信任损失了。\n\n根据 `McAfee Labs` 2019\
  \ 年 8 月的威胁报告，大型组织可能被犯罪分子视为彩虹后的黄金，尽管中小型企业（`SME`）面临着更大的危险。`SMEs` 受到恶意攻击者的针对比个人更频繁，因此带有更大的风险。这可以归因于多种原因。首先，较小的公司避免报告之前针对他们发生的攻击，要么是为了避免法律法案规定的违规罚款，要么是为了避免再次被其他攻击者盯\
  \ [44]。这导致了感染数量的影子数字，因为绝大多数勒索软件攻击未被报告。此外，`SMEs` 被认为是易攻之目标，因为它们中的大多数没有维护专门的网络安全团队\
  \ [24]，并希望自己不会成为目标。它们与大型公司一样存储着有价值的数据，但可能不像大型组织那样配备保险。这可能被进一步解释为一种虚假的安全感，因为较小的企业觉得自己不够显眼，导致延迟更新或修补其系统\
  \ [48]，从而使安全漏洞长时间处于无人维护的状态。成为一个易攻的目标助长了犯罪分子，给了他们继续进行非法活动的信心和余地，同时从掩盖事件中获益良多。\n\n\
  值得注意的是，处理勒索软件的成本并不完全由赎金本身涵盖。隐藏成本包括修复、法律费用，以及之前提到的可能的罚款。正如 `Sophos` 2020 年关于勒索软件状态的报告所承认的，通常组织的规模与恢复成本相关。损失的基本考虑包括停机时间、员工时间、设备成本、网络成本以及资本收益的机会损失。`Emsisoft`\
  \ 在其 2019 年关于美国勒索软件状态的年度报告中评估，平均勒索软件事件导致 16 天的停机。尽管如此，必须考虑客户失去的信任，因为他们的数据显然没有得到充分的保护，而此类事件的公布会阻碍未来的潜在客户使用该公司或机构。对于政府感染或地方市政府，规定他们必须向当局报备攻击\
  \ [29]。虽然私营部门也可能是强制性的，但目前的研究显而易见，组织和公司可能会避免执法部门的干扰，从而创造了未记录案例的影子数字。因此，无法估计勒索软件攻击的真实成本，但假设是肯定的：它绝对高于我们已知并记录的成本。\n\
  \n强调网络犯罪并行的平行经济——网络安全保险服务的存在和作用至关重要。保险公司提供协议，在客户遭受侵害时支付赎金，以避免数据丢失并最大限度地减少可能持续几周到几个月的停机时间。`Sophos`\
  \ 指出，五个组织中仅有一个没有获得勒索软件保险覆盖。在大多数情况下，维持勒索软件网络保险保单的机构其赎金由该保险公司支付。令人惊讶的是，公共部门通常不受保险覆盖，可能是被高昂的成本和维护费用所抑制。显然，勒索软件保险的存在有利于并延续了犯罪叙事：“最终会有人付钱的。”在大多数企业案例中，那个“某人”就是保险。它保证向犯罪者付款，并受到对停机后果和公众声誉毁坏之恐惧的维持。\n\
  \n未记录的案例、选择支付赎金以避免影响的大量公司，以及向犯罪分子保证付款的保险公司，无意中助长了勒索软件活动。例如，`SamSam` 变种在 2019 年增加了要求的赎金金额，根据\
  \ `Sophos Labs` 2019 年年度威胁报告，其价值从 10,000 美元增加到 50,000 美元。犯罪分子似乎知道他们会拿到钱，无论要求的赎金是多少。`Sophos`\
  \ 报告称 `SamSam` 变种每天至少感染系统一次。这导致每周至少产生 70,000 美元的损失，如果每个受感染的系统都支付赎金，将以前所未有的方式维持并助长犯罪活动。另一个变种\
  \ `Gandcrab` 与之前的几年和类似变种相比已被报道为价格过高，向受感染的用户索要 1,000 美元。`ENISA`（欧盟网络安全局）在其 2019 年的年度威胁报告中声称，2019\
  \ 年有 45% 的受害组织支付了赎金。`Symantec` 在其威胁报告中强调 `SamSam` 主要针对美国境内的组织。尽管如此，事实是勒索软件案例正在增加，其赎金要求也在增加。无论财务价值对勒索软件犯罪者来说有多重要，终端用户作为受害者的身份也同样参与了犯罪活动。为了进一步理解这一全球化现象，需要与最常见的传播方法：网络钓鱼一起讨论终端用户。\n\
  \n## 9.4 勒索软件与社会工程\n\n虽然恶意软件传播背后的方法论在功能基础上是一种技术现象，这一事实是不争争的的，但攻击的接收端——用户，需要被考虑。有许多重要的研究讨论了所使用的模型和攻击周期\
  \ [12, 30]、传播机制的方法 [3]，甚至是缓解措施 [8]，而仍然只考虑了活动光谱的一端。这涉及已有的安全措施、未修补的漏洞、网络分以及目标系统的整体安全性。然而，安全的人性方面可以被轻易操纵，且不需要物理攻击那么大的努力。人类受特质、情感、意识形态、好奇心、同情、恐惧\
  \ [2] 以及单纯的情绪变化支配。因此，他们的日常行为可能会导致被利用 [7]。\n\n\n\n社会工程被描述为诱导用户妥协信息系统的艺术，这种攻击形式随着勒索软件感染的流行而变得日益。对于勒索软件和恶意软件，除了利用系统漏洞或使用社会工程外，没有其他传播手段。社会工程被认为是最阻力最小的路径，因为它利用了用户本身来协助传播。\n\
  \n凯文·米特尼克（Kevin Mitnik）确定了一个社会工程攻击周期模型，包括四个攻击阶段：信息收集、建立关系与信任、利用上述信任，以及最后利用前述阶段的结果。这遵循逻辑且实用的叙述：\n\
  1. 首先，攻击者收集欺骗用户所需的必要信息，了解他们的习惯、最常访问的网站甚至是他们的电子邮件客户端。\n2. 其次，他们接触用户并自然而费力地提供信息。\n\
  3. 第三，利用他们所建立的信任，诱导用户下载并运行可执行文件，或点击链接或自行提供敏感信息。\n4. 最后，攻击者利用收集到的信息进行犯罪活动的最后步骤。\n\
  \n与上述模型类似，Gallegos-Segovia 等人在关于社会工程作为勒索软件部署方法的研究中，识别出三种不同类型的社会攻击，即自尊攻击、同情攻击和欺凌攻击。自尊攻击和同情攻击模型相似，通过与受害者建立信任和直接沟通来轻松说服他们采取行动。欺凌模型使用恐吓和胁迫，同时保持紧迫感。值得注意的是，紧迫感在社会工程攻击中很常见，以防止受害者意识到攻击者叙述中的逻辑漏洞。受害者对他们正在执行的行为思考得越少，攻击就越及时、高效。上述技术在大规模感染案例中特别危险，例如在企业中，员工被恶意行为者利用以获取权限。因此，解决勒索软件的首要社会工程方案攻击——钓鱼，至关重要。\n\
  \n钓鱼作为一种方法非常高效，因为网络犯罪完全基于人类心理的特征。人与系统的交互可能是其被利用的原因。在某些情况下，同情攻击比恐吓攻击更有效，因为受害者产生积极反应的可能性较高，这意味着奖励或中奖的感觉将导致恶意软件的下载。例如，钓鱼看起来像是点击网络上关于免费优惠券或你常用航空公司航空里程的看似无害的广告。这意味着用户实现其目标的动机（人类心理中的驱动力）被通过积极肯定所利用。目标无论多么平凡，如预订机票或寻找食谱，都可以被恶意行为者利用以高成功率诱骗受害者。\n\
  \n如果一个用户在大型组织中工作，一个与同事类似的电子邮件地址请求进行典型的转账以完成合同，会怎样？也许用户的银行要求他们在在使用 6 个月后更改之前的电子银行密码。这些示例被用作常见的钓鱼诈骗，诱导用户点击看似无害的链接或提供敏感个人信息。通过注意统一资源定位符（`URL`），用户可能会避免受害。犯罪分子试图模仿一个具有说服力的\
  \ `URL`，这与用于诱导点击的提示目的相似。避免疑虑是成功钓鱼攻击的首要任务。另一方面，恐吓攻击会导致用户寻求第三方咨询，从而降低下载的可能性。显而易见，一个人的人为错误可能导致整个网络或组织的崩溃，特别是当没有采取分段措施来阻止感染扩散到某些系统时。\n\
  \n尽管要理解人类与安全威胁交互背后的完整原因和动机具有挑战性，但意识培训是组织可以采取缓解人为因素的少数有效途径之一。虽然系统的安全性可能已经更新、监控和监督，但总有天真的用户将恶意软件引入其计算机，或者在最坏的情况下，引入组织中。技术本身无法对抗人类脆弱性所采取的所有可能形式。实施稳固的以人为本的实践来增加决策意识，建立清晰的用户与安全部门之间的通信渠道，在发生错误时建立机制并重复安全培训可以减少人为因素的影响。\n\
  \n尽管安全培训过去被用于降低感染机会，但它们可能不足以减轻风险。特别是对于抵制培训或无法记住培训内容的非技术人员，在没有安全部门经验的情况下学习新技能是挑战性的。此外，培训可能没有得到组织的良好监控以证明其有效性，或者没有重复，导致所学知识流失。\n\
  \n\n\n关于针对社会的新型且持续的威胁（如勒索软件）的讨论，如果不涉及立法视角，那么对单方面的解决方案将不会产生建设性的贡献。每项新技术及其能提供的无尽用途都在创造出尚未受任何法律约束的利益领域，并对法律概念构成了挑战[40]。法律是一种适应性的工具[39]]，其目的是应对社会问题，并提供指导、澄清以及解决办法。新时代威胁（特别是在网络领域）的问题在于其全球化特征，以及有效起诉往往是不可能的现实。当国家级的技术和取证研究手段与犯罪分子的能力不匹配时，定义非法行为是一项艰巨的任务。然而，刑事勒索可能是可能的，某些国家（如美国）正在不断演进，并采取措施调整立法以涵盖勒索软件攻击。例如，在马里兰州，自\
  \ 1 月以来已开始讨论确定持有勒索软件是否构成非法行为，即使在没有使用意图的情况下也是如此。尽管本小节无法穷尽勒索软件的法律方面，但最相关的点包括两个主要主题：(a)\
  \ 现象的全球化，以及立法实现现代化并创建一个综合性的网络犯罪法的需求；(b) 法律本质是否足以起到威作用并减轻未来的勒索软件攻击。\n\n勒索软件从本质上无法局限于国家边界之内。如前所述，它已被多次用于对敌对国家施加政治压力。当没有合作条约或协议的国家发生冲突时就会出现起诉问题。例如，在巴基斯坦创建并部署的勒索软件几乎没有机会进入乌克兰法院。如果进入了，几乎可以确定开发者和违规者不会在乌克兰法院受到制裁。如果犯罪国属于欧盟且在欧盟境内发动攻击，那么立法问题可能会得到解决[32]。这归功于《布达佩斯公约》，这是\
  \ 2001 年提出的一项条约，它为网络犯罪提供了一个框架，试图协调网络犯罪法并在签署国之间建立合作。但当考虑哪些国家签署了该条约时，问题就出现了。尽管它有 65\
  \ 个国家参加，但与欧盟内部的 27 个国家相比，一些领先网络犯罪的关键国家仍然缺席，即伊朗、中国、俄罗斯和印度。例如，印度被认为是 2020 年受勒索软件攻击最严重的国家。最后，对《布达佩斯公约》存在大量批评，特别是关于该条约宽泛的术语和抽象性。然而，在欧盟和美国，尽管立法涵盖了勒索软件，但勒索软件攻击中使用的支付方式`Bitcoin`非常难以追踪，并可能被引向不配合的司法管辖区。这一点是显而易见的，因为目前尚没有针对勒索软件攻击者定罪的判例可用[32]。另一方面，美国起诉了两个个人——Anthony\
  \ R. Murgio 和 Yuri Lebedev（Yuri Lebedev），指控他们运营一个`Bitcoin`交易所财务系统，该系统通常被勒索软件攻击的受害者使用[45]。两人本质上违反了美国联邦反洗钱法。值得注意的是，两人已经居住在美国并根据美国联邦法律运营。尽管自\
  \ 2019 年发生大规模国家级勒索软件感染以来，美国在勒索软件法律方面的反应最积极，但事实仍然是，美国没有涵盖勒索软件的综合性网络联邦法。美国联邦法仅有一项可以涵盖勒索软件案件的法律，即《计算机欺诈与滥用法》（`CFAA`）[5]，该法编纂在`Title\
  \ 18 USC 1030`中。它于 1986 年颁布并经过了多次修订[35]。显然，`CFAA`没有专门提到勒索软件，但它涵盖了联邦计算机、银行计算机以及接入互联网且未经授权被访问的计算机[6]。各州已制定了涵盖勒索软件的规定，目前包括加利福尼亚州、康涅狄格州、密歇根州、德克萨斯州以及最近的马里兰州（2019\
  \ 年 1 月 14 日的《院法案 30》）。在欧洲层面不存在平等或类似的框架或综合立法。由于不同的社会经济背景和意识形态，据假设在多个国家实施是困难的。建立通往更安全网络空间的共同道路需要时间和大量的研究。以`GDPR`及其强制实施为例，人们可以注意到它在最初几个月带来的困难和困惑，并且仍然给小型组织造成破坏。此外，它不适用于尚未签署该条约的国家，如中国或俄罗斯。只有在欧盟境内运营的业务和公司才必须遵守其规定。很清楚，如果没有执行手段，法律将是无效的。法律与其他伦理和社会结构一起，起着威慑作用[23]。然而，如果存在取证和司法管辖权问题，那么政治问题将一直存在，这意味着法律失效了。2019\
  \ 年，Emsisoft 关于勒索软件状态的报告声称，停止感染的唯一方法是使其无利，这承认了核心问题：目前没有任何缓解策略是有效的。显然，无论是否有立法框架，犯罪分子都在不断适应，并在每次攻击中变得越来越精细。迈向缓解法律框架的一步是在国际水平上实施类似于《布达佩斯公约的方法。通过在司法管辖权问题上建立国际合作，并在需要时提供引渡选择，法律在首次获得定罪后可能起到更有效的威慑作用。这一步将需要难以想象的谈判时间、起草尝试和修订；然而，它是产生立法成果的第一步。最后，在法律效力建立之前，免受勒索软件侵害的责任落在终端用户身上。\n\
  \n## 9.6 结论](#contents.xhtml#re_h-9-6)\n\n\n\n\n在本章中，讨论了勒索软件的危险以及它对社会和法律产生的影响。自\
  \ 1989 年以来，这一现象已得到广泛报道，且不断变化和适应以规避检测并使其失效。这种策略增强了攻击的成功率，并给个人和企业造成了数以百万计的资金损失。从早期的恐吓软件和虚假杀毒软件到针对邻国的精细政治导向攻击，勒索软件在过去连续三年仍被认为是最危险的活跃恶意软件（IOCTA,\
  \ 2018, 2019, 2020）。本章将勒索软件视为针对个人家用电脑以及专业系统设备的当前且活跃的威胁。因此，我们进行了简要的研究，思考了感染的简短历史、支付赎金造成的财务影响、企业停机和损害修复成本、传播和扩散方法，最后是勒索软件引起司法干预的法律挑战。\n\
  \n一些流行的勒索软件变种包括著名的 `CryptoLocker`、`CryptoWall`、`Petya`、`NotPetya` 和 `WannaCry`。每种病毒都利用了\
  \ `MS Windows` 操作系统不同的漏洞，使用了复杂的加密方法，并感染了多个政府设施、个人电脑、公司和医疗机构。所有不同的恶意软件变种都有多个部署阶段和改进，并由其开发者或复制感染过程某些部分并创建新细节的镜像不断不断调整。其中一些是由整个犯罪团队开发的，并针对国家部署，以迫使它们做出决策或施加政治压力。事实是，损害仍被认为是无法衡量的，由于企业和个人的报告不足，真实的财务成本仍然处于隐性状态。此外，感染率的提高催生了一个平行经济。勒索软件网络安全保险的概念在公司和大型组织中很常见，如果上述公司发生感染，该保险将确保向犯罪分子支付款项。尽管如此，犯罪者的货币收益以及\
  \ `Bitcoins` 提供的匿名性仍然是攻击者继续改进恶意代码和传播勒索软件的两大主要驱动力。传播成功的深层推理指向了 (a) 缺乏司法执法和 (b) 社会因素。\n\
  \n社会工程学被视为阻最小路径，因为终端用户是打开感染大门的人。不需要精细的黑客技术或复杂的代码；感染可以在下载食谱或预订机票等普通活动中发生。由 Kevin\
  \ Mitnik 首次提出的社会工程学模型描述了四个攻击阶段：信息收集、建立关系与信任、利用这种信任，最后利用前述阶段的结果 [37]]。在上述模型之后，研究了更多的社会学模型，但重要的因素是操纵人性以获得未经授权的系统访问。利用信任或紧迫感等观念会导致感染。钓鱼是个人和大规模感染中勒索软件最常见且最名昭著的方法。尽管过去几年已经采用了意识培训来应对人为因素，但它们还不足以减轻真正的勒索软件风险。为了让员工记住新信息，进行调整和重复是必要的。研讨会的呈现方式应确保不威胁到用户的普通自由，以避免产生“反抗心理”现象，即用户因为担心限制而排斥新方向。降低钓鱼统计数据的建议解决方案是使用现实中的安全事件、积极的意识培训，并避免对用户进行惩罚。\n\
  \n最后，本研究解释了勒索软件立法面临的管辖权和司法问题。诸如现象的全球化和定义网络世界的困难等共同问题，为勒索软件犯罪的有效起诉带来了问题。美国等国家以及欧盟等经济或政治联盟已经存在监管法规和法律。另一方面，将犯罪分子带上法庭被认为几乎是不可能的，因为目前没有关于勒索软件起诉的判例。此外，竞争国家之间的分歧产生了引渡问题，这对立法程序构成了威胁。与美国类似，欧盟没有涵盖勒索软件的统一网络犯罪法，只有《布达佩斯公约》，该公约现在急需及时修订。法律是一种工具，其本质是适应性的。建立通往更安全网络空间的共同路径是成功减轻勒索软件风险的唯一解决方案。\n\
  \n本章试图解释并讨论了勒索软件的基本问题轨迹，以及它对所代表的每一个法律方面构成的风险。我们承认，这项研究在任何方面、形状或形式上都没有完成。需要更多具有学科视角的研究论文来充分解释这一现象，并在长期方法之前建立可行的解决方案。（注：此处原文中存在大量重复句子，已按要求保留并翻译）。\n\
