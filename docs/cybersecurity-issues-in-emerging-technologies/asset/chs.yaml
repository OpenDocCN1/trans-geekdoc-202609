  \n\n\n\n\n随着自动驾驶车辆持续融入道路交通，人类驾驶车辆与自动驾驶车辆之间的交互至关重要 [29]]。由于技术和汽车制造公司不断宣传其自动驾驶技术，混合交通行为迫在眉睫。然而，自动驾驶车辆控制对车队使用的无线通信信道提出了极其严苛的安全性要求\
  \ [14]\\] [8]]。连接式自动驾驶车辆（CAVs）的部署被认为是智能交通系统（ITS）中增强道路安全、提高基础设施效率和降低燃料消耗的关键因素。联网车辆通常通过车间通信（Inter-Vehicle\
  \ Communication）交换协作感知消息（CAMs），以协调其运动 [19]]。这些消息基于 IEEE 802.11p 标准，使用专用短距离通信（DSRC）和车载环境无线接入（WAVE）技术每秒传输多次。\n\
  \n然而，无线通信极易受到各种攻击的影响 [13]], [11]\\] 由于拓扑结构的不断且快速变化以及车辆的高移动性，在车载移动自组织网络（VANET）环境中，拒绝服务（DoS）攻击特别难以被检测。更困难的是，如何检测区域内是否存在无意干扰，并将其与试图干扰并影响两个合法车辆之间无线通信的恶意干扰器区分开来。射频（RF）干扰是一种\
  \ DoS 攻击，恶意节点可以利用它来破坏无线网络节点之间的传输 [30]], [25]]，因为大多数节点都使用单一频段。\n\n在过去的几年里，已经出现了几种干扰检测的实验方法\
  \ [4]], [13]], [30]\\]。其中只有极小部分使用了机器学习技术 [30]\\]。具体而言，[30]\\] 中的作者专门探讨了 [30]\\]\
  \ 干扰检测，而 [10]\\] 中的机器学习方法被应用于干扰检测 [30]\\]。\n\n在本文中，我们提出了一种新的干扰检测方法，利用交叉层指标，结合了监督学习算法\
  \ k-Nearest Neighbors、随机森林（`random forests`）以及一种数据融合方法。为了增强所提出的交叉层检测系统（IDS），我们引入了应用（APP）层的指标，即信速率变化（`V\
  \ RS`），以及物理（PHY）层的交叉层特征，如信速率（`RS`）、接收信号强度指示（`RSSI`）、信干扰比（`SINR`）以及数据包交付率（`PDR`）。我们探讨了物理层（PHY）中信速率变化（`V\
  \ RS`）如何区分不同类型的干扰攻击。通过结合 `KNN` 和 `RaFo` 交叉层算法，我们能够有效地区分干扰攻击与无意干扰的情况。我们在区域内的干扰水平、“智能”干扰策略以及干扰器与接收机之间相对速度的真实值下评估了所提出的方案。\n\
  \n### 7.1.1 动机 (#contents.xhtml#re_h-7-2)\n\n在相关文献中，一小部分研究在车载自组织网络中使用单输入多输出（SIMO）\
  \ [38]\\]或多输入多输出（MIMO） [20]\\] 技术来抑制物理层的干扰效应。因此，需要一种不需要额外硬件的方法来检测干扰攻击。这可以通过所提出的基于发射机与接收机之间无线通信的交叉方案\
  \ [17]\\] 来实现，该方案基于物理层。\n\n此外，我们将所提出的 `V RS` 指标与开放系统模型（OSI）层的指标相结合，通过交叉层方法用于不同的干扰场景。在一般情况下，干扰会降低接收器的\
  \ SINR，这是一个可以通过经典算法解决的问题。然而在许多应用中，由于 `SNR` 和 `PDR` 下降的真实原因，甚至是攻击的本质，很难判断 SINR 的降低是由于干扰攻击还是无意干扰。这就是我们提议使用\
  \ `V RS` 指标的主要动机。我们的结果表明，所提出的方案可以有效区分干扰攻击与干扰源。这是我们系统至关重要的一个方面，因为这两个问题应该以不同的方式解决，即：在干扰情况下，需要干扰消除（`IC`）方案\
  \ [3]\\]，或者针对干扰攻击采用频谱规避（信道跳转、空间规避）方案。许多措施也从不同的技术角度针对频率干扰问题。例如，跳频扩频（`FHSS`）、直接序列扩频（`DSSS`）以及混合\
  \ `FHSS/DSSS` [22]\\] 等技术已被广泛采用，通过快速切换频率或在更宽的带内扩展信号来避免频率干扰。\n\n\n\n\nRF 干扰在经典的 802.11\
  \ 网络背景下已得到广泛研究，但尚未考虑车对车（V2V）通信的特殊性。除了 802.11p 与其他 802.11 修订在 PHY 设计上的差异外，由于车载环境的变化迅速，VANET（车载车载网络）的传播条件在根本上是不同的。VANET\
  \ 中已经研究了许多不同的干扰攻击[24]。两种最重要的 RF 干扰攻击类型是 `constant jamming`（持续干扰）和 `reactive jamming`（反应式干扰）。持续干扰在不检查信道状态（空闲）的情况下在信道上传输随机生成的数据。反应式干扰仅在攻击者感知到信道上两个合法节点之间有活动时发生。在[31]中，作者们观察到持续性、周期性反应性的\
  \ RF 干扰器都会严重阻碍大传播区域的通信，从而威胁道路安全。反应式干扰攻击具有很高的干扰效率，在某些应用场景下甚至可以提高干扰器的能量效率[38]。此外，它们可以轻松高效地实现在商用现成（COTS）硬件上，例如通用软件无线电外设（USRP）电台[38]],[28],[5]。然而，更重要的是，由于“智能”攻击模型，反应式干扰攻击更难检测，该模型允许干扰信号隐藏在合法用户执行的无线传输活动之后[26]。通过分析这些文章，我们可以得出：干扰器的速度是所有\
  \ VANET RF 通信中试图抑制或检测 RF 干扰攻击技术的关键指标。\n\n## 7.3 基于相对速度估计的 RF 干扰分类 (#contents.xhtml#re_h-7-4)\n\
  \n近期处理 RF 干扰攻击检测的文献通常使用实时 MAC 干扰检测方法，以满足车载网络安全应用的需求。这些方法运行在两种假设下：一种每次 CAM 传输都伴有随机抖动[23]；另一种检测器（监控器）的决策取决于对\
  \ V2V 信道中事件的历史观察[6]。这些检测方法区分了通信中的三种现象：竞争冲突、干扰和干扰攻击。在[15]中，作者提出了一种无线传感器网络（WSNs）中的\
  \ DoS 攻击检测方法。该方法首先基于传感节点的聚类方法，其中提议使用每个节点的时间戳，其次基于从一个节点到另一个节点计算的 PDR（数据包接收率）。以上所有论文都使用基于阈值的方法，其中阈值被估计为边界，以区分正常场景和干扰场景（即存在干扰攻击）。然而，准确估计此阈值是一项必要任务，它显著影响该方法在检测概率方面的性能。最后，N.\
  \ I. Mowla 等人[27]针对飞行的自组网络（FANET）提出了一种基于联邦学习的设备干扰攻击检测安全架构，在检测 RF 干扰攻击方面取得了良好的准确结果。\n\
  \nKaragiannis 等人[16]提出了一种使用聚类无监督学习的 RF 干扰攻击检测方案。上述论文的创新之处在于利用了干扰器与接收器之间的相对速度指标与其他参数，以区分故意干扰和无意干扰，并识别每种干扰攻击的独特特征。然而，这种相对速度指标是从接收车辆的车载无线设备中获得的，而不是通过从无线介质获得的真实信号估计的。\n\
  \n我们必须提到，大多数提出的基于机器学习的方案仅使用 MAC 或 PHY 层的参数进行训练和测试，而没有在跨层干扰检测方法中使用上层特征。只有[10]中的作者采用了跨层方法来检测和分类不同形式的\
  \ RF 干扰。然而，相对速度的变化估计未作为分类特征被考虑。我们提出的系统是文献中第一个在 VANET RF 通信中使用点对点通信来估计相对速度的系统。相对速度的变化被用于有效区分干扰和干扰，通过区分每种攻击的独特特征。此外，我们使用监督学习方案，收集发射机和接收机之间存在或不存在干扰器的无线通信数据。\n\
  \n### 7.3.1 系统模型 (#contents.xhtml#re_h-7-5)\n\n我们的系统拓扑涉及作为干扰器目标的接收机 `R`、发送有用信号的车辆\
  \ `T` 以及试图干预 `R` 与 `T` 通信的干扰车辆 `J`。\n\n```\n图 7.1 本考虑的拓扑。A 为仅干扰的情况；B 为存在干扰器的情况。蓝色箭头表示\
  \ V2V 通信。\n```\n\n在区域内，还有一个 RF 干扰器干扰 `T` 与 `R` 之间的 V2V 通信。这是一个简单的农村场景，用于我们系统的初步验证，我们提出的扩展性将在不同的节点密度下进行测试。在图\
  \ 7.1 中，A 展示了干扰场景，我们假设在该拓扑中没有干扰器。该场景对于评估我们方法区分干扰和干扰的效率至关重要。车辆行驶时，在某一点通过了一个由路侧单元（RSU）引起显著\
  \ RF 干扰的区域。B 展示了干扰情况。`R` 的移动速度 `uRx` 等于 `T` 的移动速度 `uTx`。发现目标后，干扰器开始跟随它并开始持续或周期性地干扰（以便尽可能长时间不被发现）。这种干扰行为总结了所有潜在的\
  \ DoS 干扰。\n\n为了表示 `T` 与 `R` 之间的无线信道，我们使用了一种考虑到 VANET 多径效应的高级 V2V 随机模型。接收节点收到的信号是来自发射机的合法传输信号加上通过随机无线\
  \ V2V 信道的干扰器干扰信号，并建模为[17]中的公式 (2)。\n\n相对速度指标 (∆u*) 定义为干扰器与接收机之间的相对速度[16]：\n\n```\n\
  Δ u = u → J x − u → R x || (7.1)\n```\n\n\n\n其中 `u` `[Jx]` 和 `u` `[Rx]` 分别是干扰器的速度和接收器的速度。\n\
  \n为了在干扰器-接收器的信道模型中包含干扰器与接收器之间的相对速度（见 [17] 中的关系 (11)），我们将干扰器发射信号的多普勒频率 `f` `[D,j]`\
  \ 写为：\n\n| f D , j = Δ u f c   cos   ϕ i c || (7.2) |\n| --- |\n\n其中 `f` `[c]` 是载波频率，值为\
  \ 5.9 GHz（这是专门用于 V2V 通信的频段）。此外，cos `φ` `[i]` 是干扰器与接收器之间的离去入射角 (AOD)，`c` 是光速。\n\n\
  ### 7.3.2 干扰攻击场景\n\n我们研究了三种不同的攻击场景——即干扰场景、智能攻击场景和恒定攻击场景——每种场景代表一种可能影响现实生活中车载自机网络\
  \ (VANET) 的干扰攻击。\n\n**干扰：** 在干扰场景下，我们假设网络中不存在干扰器。该场景有助于评估我们的方法区分干扰与普通噪声的效率。车辆在行驶时，在某一点通过一个具有显著射频（RF）干扰的区域，影响与其他车辆或路侧单元\
  \ (RSU) 的通信。\n\n**智能干扰：** 智能攻击场景模拟了智能干扰器的行为 [20]]。这种“智能”干扰器被设计为在感知到超过特定阈值的能量时以响应的方式开始传输。我们将该阈值设置为\
  \ 75 `dBm`，根据经验确定，这是干扰器灵敏度和误报传输检测率之间的平均阈值 [35], [31]]。使用此最小阈值，每项正在进行的传输都可以被响应式干扰器检测到。如果在特定时间范围内检测到的能量超过了阈值，干扰器将开始持续时间为\
  \ (`T` `[duration]` = 64 `µs`) 的传输，以干扰包头的大部分内容以防止被接收器解码。具体而言，“智能”干扰器在传输干扰信号的同时开始跟踪受害者车辆。当干扰器到达距离约为\
  \ (8 10) `m` 的目标时，它会撤退到另一个位置以保持不被察觉，并按上述描述以响应方式传输。文献中最常用的方法 [35]] 是干扰器选择其最佳传输功率\
  \ [9]]，从而在不需要改变与目标距离的情况下，实现相同的通信中断或阻断（DoS 攻击）。通过我们的“智能”攻击，我们的目标是影响 `T` `[x]`-`R`\
  \ `[x]` 对的通信，且干扰器的检测更具性，这突出了所提的 `V RS` 指标对检测准确率结果的重要性。因此，“智能”干扰器还会改变其位置以保持不被察觉。干扰信号的传输速率可以变化，代表不同的“智能”干扰策略。我们表示了一种周期响应式干扰器形式的干扰行为，它在靠近目标时增加传输速率，以便干扰器在保持不被察觉的同时提高效率。我们将响应式干扰器的传输速率范围在区间\
  \ [10] 内表示。周期响应式干扰器的传输速率在靠近目标时增加。[10] 这种形式的周期响应式干扰行为影响了 `T` `[x]`-`R` `[x]` 对的通信，这种“智能”干扰的检测更为困难。这种响应式干扰的特征是\
  \ 64 `µs` 的 ON 状态和 10 `µs` 的 OFF 状态。\n\n**恒定干扰：** 在恒定攻击场景下，我们研究一种在恒定功率下持续传输的情况。**恒定**和**智能**\
  \ 干扰器配置文件在图 7.2 中比较时域。我们观察到**智能**干扰攻击针对物理层收敛协议 (PLCP) 头部，使其无法被接收器解码。\n\n![图 7.2\
  \ 恒定和智能干扰器配置文件](img/fig72.jpg)\n\n*图 7.2* 恒定和智能干扰器配置文件在时域中\n\n### 7.3.3 相对速度指标的估计\n\
  \n在本节中，我们展示了指示干扰器与接收器之间相对速度的 `u` 值。基于获得的值，创建了 [25] `V RS` 指标并用于分类。在我们的系统中，通过连续时间发送已知导频符号使用\
  \ 802.11 标准。同时，干扰器在连续时间内传输接收器。随后，`T` `[x]` 和 `R` `[x]` 之间的复合信道在干扰器干预的情况下，使用最小均方误差\
  \ (MMSE) 估计器进行估计 [37]]。通过利用多普勒效应对发射器-接收器之间的视距 (LOS) 信道 `h` [2] 以及整合到多普勒频率中的 [17]]，我们可以估计上述相对速度。\n\
  \n### 7.3.4 相对速度变化 (V RS) 算法\n\n为了增强我们检测方法的鲁棒性，而不仅依赖物理层和网络层指标，我们还使用了来自应用层且可以从信号交换中高效估计的\
  \ `V RS` 指标。我们的方法将这种新指标作为跨层方法的额外特征，以提高分类效率。\n\n为了用于分类生成 `V RS` 指标，我们做了三个基本假设：\n\n\
  1. 当相对速度为零且保持不变时，表明存在跟踪受害者车辆的恒定干扰器。\n2. 当相对速度不为零且保持不变时，表明不存在移动干扰器，因为接收器的速度等于干扰器的速度为零。\n\
  3. 当相对速度在一段时间内不为零，随后变为零并保持不变时，表明干扰器在到达目标后开始跟踪。\n\n### 7.3.5 基于监督学习的提出的 IDS\n\n\n\
  \n\n本工作中使用的监督学习方法包括 `KNN` [36]]和随机森林 [21]]。这两种监督学习技术都非常流行，其中 `KNN` 对从真实城市环境中获得的噪声训练数据具有良好的鲁棒性，而随机森林是最准确的算法之一，因为它减少了过拟合的概率（通过对几棵树取平均，显著降低了过拟合概率）。我们的检测方案目前基于离线训练，利用采集的测量数据集来训练分类器。如前所述，我们的方法在跨层方法中将新的\
  \ `V RS` 指标作为额外特征，并结合物理层的其他指标进行分类过程。\n\n为了避免使用“之前见过的数据”进行测试导致分类结果出现偏差，我们必须确保训练集和测试集完全分离。因此，在展示分类结果之前，我们必须定义训练集和测试集的大小以及使用的观测总数，以使其更具可解释性。为了避免过拟合，仅使用总观测数的\
  \ 30% 用于训练，其余 70% 用于测试。\n\n## 7.4 使用数据融合技术增强所提 IDS\n\n所使用的每种监督学习机器学习算法在独立实现时都能生成准确的结果。然而，结合使用这些算法可能有助于提高所提\
  \ IDS 的整体性能。我们评估了不同的方法，以评估是否可以通过应用数据融合技术来改进分类结果。\n\n集成学习已用于结组合来自不同分类技术的输出 [2]]。集成学习是指通过策略性地选择和组合多个分类器来解决特定的计算智能问题的过程。该方法主要用于提高模型的分类性能。常用的集成学习算法之一被称为装袋法（bagging）[12]]。装袋法的想法非常简单：我们想要拟合几个独立模型并对它们的预测取“平均值”，以获得方差更低的模型\
  \ [33]]。在这种方法中，使用了每个分类器（`RaFo`, `KNN`）的训练数据的自助副本。因此，对于测试数据集中的每个实例，都会从每个分类算法单独估计所检查三个类别中每个类的概率。由于\
  \ IDS 的预期输出是两个分类算法的组合，因此使用贝叶斯规则作为一种数据融合技术，对所提 IDS 中的每个类估计条件概率。在装袋法的最后一步，使用多数投票决组合规则来决定检测系统的最终预测。图\
  \ 7.3 表示了 `KNN` 算法和 `RaFo`算法之间所提数据融合方法的所有步骤。\n\n![图 7.3 KNN 与 RaFo 算法之间的数据融合。](img/fig7.3.jpg)\n\
  \n*图 7.3* KNN 与 RaFo 算法之间的数据融合。\n\n## 7.5 仿真与性能评估\n\n关于仿真设置的细节，参与合法通信的车辆速度（`u` `[Tx]`,\
  \ `R` `[x]`）范围在 (15 到 25) m/s 之间，干扰器与 `R` `[x]`−`T` `[x]` 对之间的初始距离（`dist` `[initial]`）为\
  \ 200 m，整个仿真过程中分离接收器与发射器的距离（`dist` `[Tx]`, `R` `[x]`）为 35 m，所有传输信号的功率（`P` `[Tx]`,`J`\
  \ `[x]`）为 100 mW，参考距离（`dist` `[ref]`）为 100 m，用于估计路径损耗系数。最后，最小接收灵敏阈值为 −85 dBm。\n\n\
  从干扰器和发射器传输的每个信号由 500 位长的比特流组成。在所有情况下，发射器的传输速率 (`TR` `[Tx]=100 packets/s)。使用 0.1\
  \ s 的时间采样，我们对系统进行了 100 s 的仿真并获得了 1000 个测量值。\n\n我们使用了 Veins，结合了城市移动仿真 (SUMO) 和 OMNET++/VEINS\
  \ [34]]。采用 SUMO 作为我们的交通仿真器，并使用 OMNET++ 仿真无线通信。此外，GEMV（一种基于几何的 V2V 高效传播模型）[7]] 工具被集成到\
  \ VEINS 网络仿真器中，以对物理层进行更真实的仿真 [20]]。最后，为了之前获得的数据设置并测试我们的分类算法，我们选择使用 R 语言 [1]]。使用了埃尔兰根市的一部分（参见\
  \ [18]] 中的评估设置）来进行仿真。\n\n### 7.5.1 不同 ∆ 值下的检测性能\n\n我们的 RF 攻击检测系统基于离线训练，使用在 15 m/s\
  \ 或 25 m/s 速度下采集的测量数据集在测试之前训练分类器。我们使用 15 m/s 速度或约 25 m/s 的更高速度的测量数据来评估所提检测系统。在表\
  \ 7.1 中，我们总结了分类准确率，利用了所提 `V RS` 指标作为额外特征，通过使用 15 m/s 和 25 m/s 速度的测量值训练获得。\n\n*表\
  \ 7.1* 使用低速和高速测量值训练时的分类准确率百分比\n\n| | 用 15 m/s 训练 | 用 25 m/s 训练 |\n| --- | --- |\
  \ --- |\n| 15 m/s 测试(`KNN` ) | 82.27% | 74.31% |\n| 15 m/s 测试(`RaFo`) | 80.04% |\
  \ 74.41% |\n| 25 m/s 测试(`KNN` ) | 66.97% | 94.46% |\n| 25 m/s 测试(`RaFo`) | 69.84%\
  \ | 94.61% |\n\n从这些分类结果中可以得出一个基本结论：当使用更高速度的数据进行训练时，分类准确率会提高。较高的分类准确率源于速度的增加负面影响了干扰效应。更具体地说，在*持续攻击场景*（Constant\
  \ Attack Scenario）中，干扰器更快超过发送-接收对；在*干扰场景*（Interference Scenario）中，发送-接收对留在干扰区域的时间更短；在*智能攻击场景*（Smart\
  \ Attack Scenario）中，干扰器更快到达目标，因此在较低速度下观察到的逐渐干扰效应大大减少。以上所有因素导致了获得测量质量的显著提高，从而带来了更高的分类准确率，并更好地区分影响通信的不同类型干扰器。\n\
  \n\n\n\n\n为了研究所提出的 `V RS` 指标如何影响（`智能攻击`）与（`干扰`）类之间的二分类问题中的 RF 干扰攻击检测，我们将所研究的两种 RF\
  \ 干扰场景（`持续攻击`、`智能攻击`）合并为一类。训练集中使用的测量值是在 18 `m/s` 的速度下采集的，测试集中使用的测量值在相同速度下采集。我们通过使用检测率和接收者工作特征（ROC）曲线在图\
  \ 7.4a 中评估了攻击检测器的性能。在图中，使用 `V RS` 特征对每个假阳性率（FPR）值检测 RF 干扰攻击的影响是显而易见的。使用 `KNN` 算法检测\
  \ RF 干扰攻击时，使用 `V RS` 指标的准确率为 86%，而在不使用 `V RS` 指标时，准确率为 69%（参见图 7.4a）。使用 `RaFo` 算法时，使用\
  \ `V RS` 指标检测 RF 干扰攻击的准确率为 88%，不使用时为 60%（参见图 7.4b）。\n\n![图 7.4 RF 干扰攻击检测。(a) 使用\
  \ KNN 分类算法时或不使用所提 V RS 指标的 ROC 曲线，(b) 使用 RaFo 分类算法时或不使用所提 V RS 指标的 ROC 曲线。](img/fig7.4.jpg)\n\
  \n*图 7.4* RF 干扰攻击检测。(a) 使用 KNN 分类算法时或不使用所提 V RS 指标的 ROC 曲线，(b) 使用 RaFo 分类算法时或不使用所提\
  \ V RS 指标的 ROC 曲线。\n\n因此，当我们使用 `RaFo` 算法时，所提 `V RS` 指标的效果更为明显。\n\n我们现在研究所提 IDS 在多分类问题中的检测率，该问题考虑了所有三类（`智能攻击`、`持续攻击`、`干扰`）。我们在表\
  \ 7.2 和 7.3 中展示了使用 `KNN` 算法的`混淆矩阵`，取决于是否使用 `V RS` 指标，其中行代表分类输出，列代表真实值。在这些实验中，训练集中使用的测量值是在约\
  \ 20 m/s 的较高速度下采集，而测试集中使用的测量值在相同速度下采集。\n\n*表 7.2* 特征间使用 V RS 指标的混淆矩阵\n\n| 场景 ||\
  \ 干扰 || 智能攻击 || 持续攻击 |\n| --- | --- | --- | --- |\n| 干扰 || 703 || 0 || 0 |\n| ---\
  \ | --- | --- | --- |\n| 智能攻击 || 0 || 399 || 17 |\n| 持续攻击 || 0 || 286 || 654 |\n\
  \n*表 7.3* 特征间不使用 V RS 指标的混淆矩阵\n\n| 场景 || 干扰 || 智能攻击 || 持续攻击 |\n| --- | --- | ---\
  \ | --- |\n| 干扰 || 688 || 2 || 3 |\n| --- | --- | --- | --- |\n| 智能攻击 || 1 || 411\
  \ || 30 |\n| 持续攻击 || 14 || 272 || 638 |\n\n我们可以观察到，当在使用训练和测试监督机器学习算法的其它特征的同时使用 `V\
  \ RS` 指标时，我们在`干扰`和`RF 干扰情况`之间实现了完美区分，而两种 RF 干扰攻击形式之间存在一些分类错误（参见表 7.2）。具体而言，使用 `KNN`\
  \ 算法结合 `V RS` 指标时，预测模型实现的准确率为 85.28%，而在不使用 `V RS` 时，准确率为 82.9%。另一方面，使用 `RaFo` 算法时，使用\
  \ `V RS` 指标的准确率为 91%，不使用时为 86%。\n\n最后，我们想要研究当“智能”干扰器在接近目标时区分其传输速率时，使用 `RaFo` 算法所实现的准确率。如第\
  \ 7.3.2 节所述，这种干扰行为具有周期性响应干扰器的形式，它在接近目标时增加传输速率，以便干扰器保持不被检测的同时提高其效率。我们将响应干扰器的传输速率范围跨在\
  \ [10,100] 个信号/每个检测到的 802.11p 帧范围内。在图 7.5，中，展示了当响应干扰器的传输范围跨在 [10,100] 个信号/每个检测到的\
  \ 802.11p 帧范围内检测响应干扰攻击的准确率结果。\n\n![图 7.5 传输速率的“智能”干扰器的响应干扰检测准确率。](img/fig7.5.jpg)\n\
  \n*图 7.5* 传输速率的“智能”干扰器的响应干扰检测准确率。\n\n当干扰器每帧检测到的 802.11p 帧传输 10 个信号时，使用 `V RS` 指标实现的准确率为\
  \ 90%，不使用所提指标时为 87.5%。另一方面，当干扰器将其传输速率增加到每帧约 100 个信号时，使用 `V RS` 指标的准确率下降到 75%，而不使用所提指标时约为\
  \ 62%。这种准确率结果的恶化是因为，当干扰器增加传输时，它趋向于持续干扰行为，导致两个对应类别（`智能攻击`、`持续攻击`）之间出现一些分类错误。\n\n\
  ### 7.5.2 不同干扰水平下的评估\n\n为了验证所提 IDS 对所考虑的 RF 干扰攻击的鲁棒性，我们评估了区域内不同的节点密度值。SINR 特征在 (7.3)\
  \ 中定义为特定感兴趣信号的功率（`P [Tx]`）加上干扰器发送到接收者的干扰信号功率（`P [Jx]`），除以干扰功率（来自所有干扰信号）（`I`）和背景噪声功率（`N`）之和。\n\
  \n```\nS I R R = P T x + P J x / I + N\n```\n\n因此，该参数的分母结合了不同的节点密度值。在图 7.6a 中展示了低节点密度场景（10\
  \ 个干扰节点）的 SINR 值，与区域内同样存在“智能”干扰器的情况对比。每个场景由 400 个时间步组成，红色代表`干扰 + 智能干扰器`场景，蓝色代表仅有`干扰`场景。在这里，我们可以观察到两个研究案例之间的\
  \ SINR 值存在完美分离。在图 7.6b 中展示了高节点密度场景（100 个干扰节点）的 SINR 值，与区域内同样存在“智能”干扰器的情况对比。相反，使用这些干扰水平时，所考虑场景的\
  \ SINR 值之间没有的分分离。这一事实可能导致这些情况之间出现若干分类错误。这是因为在 100 个干扰节点的情况下，分母中的干扰功率相对于分子中的干扰信号功率大幅增加。结果是在在这些干扰水平下，“智能”干扰攻击的影响不再明显。这一事实证明了在分类过程中需要使用与干扰器移动模式相关的上层特征。\n\
  \n![图 7.6 不同节点密度下的 SINR 值。(a) 低密度下干扰案例与智能干扰案例之间的 SINR 值对比，(b) 高密度下干扰案例与智能干扰案例之间的\
  \ SINR 值对比。](img/fig7.6.jpg)\n\n\n\n\n\n*图 7.6* 不同节点密度下的 SINR 值。(a) 低密度下 `Interference`\
  \ 情况与 `Smart Jamming` 情况的 SINR 值对比，以及(b) 高密度下 `Interference` 情况与 `Smart Jamming`\
  \ 情况的 SINR 值对比。\n\n基于上述分析，我们可以得出结论：区域内的节点密度越高，使用所提 IDS 检测 RF 干扰攻击的准确率就越低（见图 7.7）。当区域内有\
  \ 10 个干扰节点时，使用 `V RS` 指标所的准确率为 89%，而不使用所提指标的准确率为 86%。另一方面，当区域内的干扰节点增加到 100 个时，使用\
  \ `V RS` 指标的准确率下降到 83%，而不使用所提指标的则约为 79%。\n\n![图 7.7 不同节点密度下的 RF 干扰检测准确率。](img/fig7.7.jpg)\n\
  \n*图 7.7* 不同节点密度下的 RF 干扰检测准确率。\n\n### 7.5.3 数据融合结果](#contents.xhtml#re_h-7-14)\n\
  \n在本小节中，我们希望结合两个监督机器学习分类器（`KNN`、`RaFo`），以获得比单一分类器更好的性能，详见第 7.4 节。在图 7.8，中，将数据融合技术实现的\
  \ RF 干扰攻击检测准确率与仅使用 `KNN` 或 `RaFo` 的准确率进行了对比。上述报告的准确率结果已使用每个分类器的 ROC 以及数据融合技术的不同\
  \ ROC 进行了绘制。\n\n![图 7.8 数据融合、KNN 和 RaFo 之间 RF 干扰攻击检测的准确率评估。](img/fig7.8.jpg)\n\n\
  *图 7.8* 数据融合、KNN 和 RaFo 之间 RF 干扰攻击检测的准确率评估。\n\n## 7.6 讨论与结论](#contents.xhtml#re_h-7-15)\n\
  \n在本章中，我们提出了一种特定特定 DoS 攻击（即 RF 干扰）的新方法，该方法基于跨层特征集和监督机器学习。我们引入了一种来自应用层的新颖指标，即干扰器与目标之间的`相对速度变化`（variations\
  \ of the relative speed）。相对速度是通过目标车辆处的期望信号与干扰信号的组合值结合网络指标进行被动估计的，且物理层可以用于跨层方法来检测\
  \ RF 干扰攻击。为了评估所提指标的显著性及其对检测率的影响，我们实现了三个不同的场景——两个包含干扰器的场景和一个只有干扰的场景。\n\n通过我们的工作，引入了一种针对潜在\
  \ RF 干扰攻击的主动方法，能够区分干扰与恶意 RF 干扰。此外，它还能区分每种攻击的独特特征，特别是当离线训练的速度高于 15 *m/s* 时。我们还评估了各种相对速度值对\
  \ RF 干扰检测率的影响。干扰器与接收器之间的相对速度越高，RF 干扰攻击的检测概率越高。这一特定事实归因于所考虑 RF 干扰攻击的特性。\n\n通过评估结果，我们强调了相对速度及其变化在干扰检测、无意干扰区分以及整体预测准确率提高中的关键作用（加上从物理层获取的其他指标）。具体而言，在训练和测试中将所提的\
  \ `V RS` 指标与其他特征结合使用，在某些条件下和“智能”干扰策略（例如相对速度值、区域内的节点密度或干扰器的传输速率）下，我们将 RF 干扰检测准确率提升了超过\
  \ 10%。最后，提出了一种数据融合方法，结合了所使用的两种监督机器学习算法的结果。\n\n作为未来的工作，所提 IDS 可以升级为实时 RF 干扰检测系统，其中训练过程将使用名为历史数据的过去测量值。\n\
  \n## 7.7 术语表](#contents.xhtml#re_h-7-16)\n\n| CAVs | Connected Autonomous Vehicles\
  \ (联网自动汽车) |\n| --- | --- |\n| ITS | Intelligent Transportation Systems (智能交通系统)\
  \ |\n| CAMs | Cooperative Awareness Messages (协作感知消息) |\n| DSRC | Dedicated Short\
  \ Range Communication (专用短距离通信) |\n| WAVE | Wireless Access in Environments (环境无线接入)\
