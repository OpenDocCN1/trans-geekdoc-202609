- "# 新兴技术中的网络安全问题\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n\n# 前言\n\n近期信息与通信技术的爆炸性进展，以及对未来应用的大量研究，要求我们对基础设施、应用以及服务提供方式的安全有一个全面的视角。\n\
  \n本选著《新兴技术中的网络安全问题》（*Cybersecurity Issues in Emerging Technologies*）为各种技术面临的网络安全问题提供了一种详尽且全面的方法，这些技术在不久的将来将在我们的生活中占据主导地位——其中一些将迅速成为我们日常交易的一部分。\n\
  \n书的章节不仅涵盖了这些新兴技术需要应对的特定安全和隐私问题，还从人类因素问题到攻击组织方式为安全问题提供了通用方法。\n\n读者将在书中发现新新技术（如 `5G`、`blockchain`\
  \ 和连接汽车）将面临或更准确地说是已经遭受的主要问题。此外，相关的书籍章节还涵盖了更具行业特定性的应用（如自动驾驶船舶）以及基础硬件组件问题，这些问题可能产生广泛影响但尚未得到充分评估和检查。各章节的讨论提出了缓解这些应用领域可能漏洞的影响的方法。各章节的讨论展示了缓解这些应用领域可能漏洞影响的方法。针对网络物理系统安全的分析，虽然每个章节可以独立阅读，但材料的呈现在很大程度上是统一的。\n\
  \n**Christos Douligeris 教授**\n信息系\n皮埃亚大学\n\n# 前言\n\n数字基础设施的发展是所有国家的主要目标之一。此外，全球许多机构旨在成功数字化转型，特别是在\
  \ COVID-19 疫情之后，几乎所有的活动都变得数字化。任何数字化转型的成功很大程度上取决于数据和基础设施的安全，无论是在公共部门还是私人部门。\n\n威胁格局正以惊人的速度演变。我们面临着极其快速的攻击面，具有多样化的攻击向量、攻击者与防御者之间的不对称性、数十亿联网\
  \ `IoT` 设备、主要是响应性的检测和缓解方法，最后是大数据挑战。攻击的不对称性和海量数据是额外的关注点，使得有必要重新思考网络安全方法，以缩小攻击面并使其动态化，自动化检测、风险评估和缓解，利用\
  \ `blockchain`、人工智能和机器学习等新兴技术研究攻击的预测和预防。\n\n许多因素促成了本书的编写。由于日益增长的安全关注以及技术的迅速扩张，网络安全赢得了青睐。技术越多，需要的越高效的网络安全框架。本书有两个明确的目标：第一个是提出新技术出现产生的重要安全问题，第二个是强调可能解决这些问题的各种解决方案。专家们展示了为实现这些目标所付出的努力。\n\
  \n本书包含了涵盖新兴技术各种网络安全问题的十一章节。这些涵盖了智能连接汽车、无人船舶、`5G/6G` 连接、`blockchain`、敏捷应急响应、硬件辅助安全、勒索软件攻击、混合威胁以及网络技能差距。\n\
  \n\n\n\n\n\n\n\n\n\n在`第 6 章`中，描述了另一种针对 5G 核心组件攻击检测的方案。它由一个应用入侵检测与防御系统以及一个事件处理与可视化平台组成。以\
  \ `5G Network Exposure Function` 为例，设计并实现了该架构的概念证明。\n\n在`第 7 章`中，读者将了解到基于 `KNN`\
  \ 和 `RaFo` 算法的人入侵检测系统 (IDS)，以及一种结合两者结果的数据融合方法。这是一种跨层 IDS，旨在检测无线车载网络中的射频干扰攻击。通过引入应用层指标并将其与物理层或介质访问层\
  \ (`MAC`) 的某些特征相结合进行训练和测试，实现了更高的准确性。\n\n\n\n\n`第 11 章` 提出了一种多维度方法，证明了获取工业 4.0 所需特定网络技能的必要性，以及通过教育家庭用户和提高他们的意识来缩小用户与网络安全专业人员差距的方法。\n\
