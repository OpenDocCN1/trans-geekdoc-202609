  \ and Security, 14(9), 2387–2399, 2019.\n\n# 第 8 章 智能汽车与空中下载\n\nPanagiotis Efstathiadis,\
  \ Anna Karanika, Nestoras Chouliaras, Leandros Maglaras, 和 Ioanna Kantzavelou\n\n\
  DOI: 10.1201/9781003109952-8\n\n## 8.1 引言\n\n研究人员一直在研究如何终极智能汽车。智能汽车是指具有特定自动化水平的车辆。目前，智能汽车并非自动驾驶汽车；尽管在该方向付出了许多努力，但现有技术尚未达到实现汽车自动化所需的高工智能水平。\n\
  \n\n\n\n许多智能汽车系统被设计为分布式方式运行，因此需要通过无线或有线网络与其他系统进行连接和通信。此外，与任何其他系统一样，当有新版本可用时，智能汽车系统也必须更新到新版本。空中下载（OTA）更新是一项在电信领域已经过开发、尝试和测试的技术，由于其具有多项优势，汽车行业已对其开展了研究。然而，与外部网络的任何连接默认都是一个安全漏洞，必须视同漏洞对待。因此，必须找到一种解决方案来克服这一问题，避免其对上述系统产生影响。如果威胁真的实现，系统可能会发生故障，并导致可能危及生命的事故。\n\
  \n尽管 OTA 更新看起来像是万灵妙药，但新的漏洞仍不断出现。如果攻击者在后端或传输过程中向车辆引入恶意更新，他们就可以获得控制权 \\[9\\]。历史表明，软件系统在发生变化时，在安全和防护方面失效的风险最高\
  \ \\[2\\]。OTA 更新是一项重大的变化；因此，确保安全性至关重要。为了呈现智能汽车的整体模型，并包含让汽车变得“智能”的所有不同技术，欧盟网络安全局（ENISA）去年发布了一份报告，其中分析了与智能汽车相关的各种威胁和网络安全风险，并提出了多项安全措施。该报告考虑了这种高度复杂、异构且多变环境的特殊性，以及没有任何现代系统是可以孤立进行分析的事实。在这份报告中，展示了传感器、人工智能、机器学习算法、云计算和连接性的互连性，并分析了来自智能汽车所有这些组件的威胁。在报告提出的一个情景中，在黑入原始设备制造商（OEM）后端服务器后，大规模部署恶意固件会影响\
  \ OTA，并导致车辆的正常运行。\n\n本节的其余部分结构如下：第 8.2 节包含了对汽车工业的建议。相反，第 8.3 节介绍了通过使用此类技术而产生的多种威胁和漏洞。第\
  \ 8.4 节关注展示这些问题的现有解决方案。在第 8.5 节中将对我们的发现进行讨论。最后，第 8.6 节致力于对智能汽车和空中更新问题给出最终结论，并强调安全性。\n\
  \n## 8.2 益处\n\n早在 2007 年，\\[25\\]的作者就建议在汽车行业中使用固件空中下载（FOTA）技术来提高客户满意度。更具体地说，他们引用了以下理由作为采用该技术的动力：首先，车辆去维修厂安装固件更新并不总是易方便的；这种解决方案提供了位置无关性。其次，当利用空中技术时，安装的停机时间可以更短，因为车辆不需要去维修厂。仅仅是往返经销商处的时间就足以成为应用\
  \ FOTA 的动力。然而这并不是唯一的理由；停机时间可能会进一步推迟，因为车辆在接入并更新固件时可能需要排队。此外，由于通过电线进行的正常安装包含在汽车保修范围内，技术人员和客户不可避免地会浪费时间和金钱，因为他们本可以处理其他付费任务；因此，空中更新降低了汽车公司的保修成本，并简化了所有参与者的流程。此外，这种方便的固件更新安装方式可以为主动纠正周期铺道路；特别是新的更新——包括漏洞修复和新功能——可以非常快速地进行安装、测试、评审和扩展，从而实现产品质量的巨大改进。更不用说制造公司可以接收诊断信息，并对某些功能实现和配置的成功或失败创建可靠的统计数据，允许他们以更低的成本获得更优的控制。此外，固件更新可以存储在云服务器上，由其检查数据质量，而不是发给大量经销商导致他们丢失或损坏相关文件。这种安装方法可以确保车辆始终更新到最新软件，并缩短更新的上市时间（TTM）。此外，如果客户无法主动启动更新（因为由于安全原因，电子控制单元（ECU）有时必须立即重新编程），则可以自动在车辆空闲时安排强制更新安装，就像在个人电脑和移动设备上已经发生的那样。此外，FOTA\
  \ 还可以提高车辆的安全性；由于 FOTA 能够缩短 TTM，重要的安全更新很可能比预期早得安装，并且可以更早避免因软件故障导致的事故，而这比经销商通过电缆安装固件更新要快得多。此外，FOTA\
  \ 技术已经在电信行业经过开发和测试，并且运行良好，已确认为一项稳健的技术。因此，它可以在不进行过多修改的情况下被汽车行业采纳；毕竟，“轮子”已经被发明了。因此，正如\
  \ \\[20\\]的作者所提到的，汽车软件空中更新将带来更高的客户满意度、更低的维护成本、质量提升，以及最重要的——销售的增长。\n\n近年来，汽车中越来越多的功能从机械实现转向电子实现。这种变化导致嵌入车辆的软件体积增大。因此，现在比以往任何时候都需要更多、更大的更新，而空中更新可以最大程度地促进这一过程\
  \ \\[32\\]。\n\n在 \\[5\\]中，提出了一种智能汽车 OTA 更新的改进方案；不再从云数据中心存储相关文件并提供更新服务，作者建议使用边缘计算。由于边缘节点更接近大多数相关车辆，特别是通过他们所提出的用于监控智能汽车移动并调整服务位置的移动管理算法，OTA\
  \ 更新安装将变得快得多。\n\n## 8.3 威胁与漏洞](#contents.xhtml#re_h-8-3)\n\n\n\n\n\n在我们工作的后续中，我们将研究并介绍智能汽车一些最重要的漏洞，特别是其空中系统更新（over-the-air）的功能。正如我们所看到的，像特斯拉这样的大型新型汽车公司，以及\
  \ `Ford` 或 `BMW` 这样试图从传统汽车向智能汽车转型的老公司，正在创建和测试新模型，并构建新的操作系统，以改进其智能汽车在各个领域的关键部分。因此，如果我们将所有这些汽车视为独立的计算机，将会发现许多共同威胁。与计算机、手机以及所有其他物联网（`IoT`）设备相比，汽车事故可能导致人员生命损失，因此这些操作系统绝对没有容许任何错误的空间。除了生命损失外，我们还必须考虑对企业财务和消费者公众形象可能造成的损害。\n\
  \n### 8.3.1 智能汽车组件\n\n现代智能汽车由约 60 到 100 个电子控制单元（`ECUs`）组成。所有这些电子控制单元处理智能汽车内外的各种功能，它们连接到\
  \ 75 个或更多传感器（`雷达`、`声呐`、`摄像头`、`加速度计`、`温度计`、`雨量传感器`等）。它们之间的通信是通过总线实现的，任何消息都会发送到所连接的部件。对于我们的调查而言重要的网络（我们可以在\
  \ `[28]` 中阅读更多信息）包括控制器区域网络（`CAN`）、局部互连网络（`LIN`）、`FlexRay`（与 `CAN` 相同，但速度快得多）和面向媒体的系统传输（`MOST`）。在这些网络中，控制区域网络（`CAN`）是最容易受到攻击的目标。除了内部通信网络，汽车就像任何其他\
  \ `IoT` 设备一样，支持 `Wi-Fi`、`蓝牙`和全球移动通信系统（`GSM`）连接，这是每个乘客都会使用的功能，但它们可能是危险的，特别是当用于更新软件时。\n\
  \n### 8.3.2 攻击者的目标\n\n根据 `[28]` 和 `[27]`，有人攻击汽车的原因如下：\n\n1. **盗窃**\n   传统老旧人工驾驶汽车的主要问题是盗窃。被盗的汽车被拆解成零件，状况良好的部件直接卖给非法交易者，其余部分要么以稍低的价格出售，要么报废处理。现在，对于汽车来说，优质部件的价格更高。购买新的电子零件非常昂贵，因此备件需求增加。\n\
  \n2. **计划事故**\n   黑客试图获得对车辆的控制，以制造计划好的事故。实现这一目标的方法包括 (i) 锁定刹车系统，(ii) 在汽车行驶时停止发动机，或\
  \ (iii) 阻塞转向系统。\n\n3. **拦截个人数据**\n   如配对手机、通话记录、地理位置数据和安装的应用等信息是敏感的，可能会导致其他数据泄露。\n\
  \n4. **ECU 源代码盗窃**\n   受竞争汽车行业驱动的黑客可能会雇佣在汽车网络上使用数据包嗅探工具。通过这种方式，有人可以使用后门进入汽车的 `ECU`\
  \ 系统，获取其源代码，并复制专利或方法论。\n\n5. **改装和其他改进**\n   如果升级汽车的马力或改变发动机扭矩，每辆汽车都会变得质量更高。此外，里程数减少的汽车以更高的价格出售。为了在智能汽车上安装备件，必须拥有某些管理员权限以绕过软件限制。如果汽车的操作系统被破解，上述所有过程都可以被避免。\n\
  \n6. **伦理黑客**\n   有些人将破解智能汽车视为一种挑战。他们可以通过发现新漏洞，帮助公司防范潜在威胁，保护其汽车。\n\n尽管已经开发了多种防御机制，但攻击者进行了多次成功尝试。注意到的某些结果包括未经授权用户的访问增加、数据损坏、针对汽车的拒绝服务（`DoS`）和分布式拒绝服务（`DDoS`）攻击以及盗窃。\n\
  \n### 8.3.3 OTA 更新与安全问题\n\n运行在电子设备上的软件定期更新。与消费设备相比，车辆是一个非常特殊且独特的类别，因此出于安全考虑，其处理非常谨慎。每天都会部署改进车辆性能的新固件版本。偶尔会出现重大漏洞，导致制造公司大规模召回，如\
  \ `[14]` 所描述。例如，`Chrysler` 在 2015 年召回了 140 万辆汽车，而一辆 `Jeep Cherokee` 被安全人员远程破解。攻击者使用连接到\
  \ `Sprint` 蜂网络的笔记本电脑，将信息系统作为进入仪表盘功能、转向和传输入口。\n\n最近，几位学者研究了智能汽车安全问题领域 `[17]`，特别是与\
  \ `OTA` 相关的问题。`OTA` 更新系统必须能够抵抗欺骗、篡改、否认、信息泄露、拒绝服务和权限提升等攻击。生态系统的不同部分（如`云`、`服务站`和`汽车`或\
  \ OEM 后端）可能会产生多种安全和隐私问题，必须结合多种安全方法来应对这些威胁。更新信息的实时性也需要保持，以防止重放攻击。此外，`OTA` 更新期间的软件分发必须确保高安全性、低延迟和持续的数据保护。\n\
  \n#### 8.3.3.1 OTA 更新攻击分类\n\n此时，我们将分析并分类在 `OTA` 更新过程中成功攻击期间可能发生的问题。根据 `[19]`，关键类别如下：\n\
  \n1. **下载失败**\n   如果攻击者找到方法并实现在车辆下载更新时停止整个过程，我们可以观察到这不会影响车辆的安全，因为没有任何关键服务被更改。如果使用用于评估问题的量表，此问题在量表上的得分将很低。\n\
  \n2. **刷写失败**\n   停止并禁用车辆上的软件更新无疑会引起正常运行出现问题，我们无法第一眼就看出哪个部分受影响最大，因为这取决于更新完成的百分比。此问题对安全有很大影响，因为它可能会影响负责刹车或转向系统的\
  \ `ECUs`。\n\n3. **任意刷写**\n\n\n\n\n\n最后，对于所有恶意用户来说，最大的成功就是下载并安装他们自己的软件，从而在硬件管理上拥有无限的权限。他们将能够改变引擎的能力——不仅是启动和停止，还有扭矩和马力——改变制动系统的行为、驾驶辅助系统等。这对于乘客的安全来说将是灾难性的，无论是因为他们为了提高车辆性能，还是因为某些人想要破坏车辆。在这种情况下，乘客安全威胁指数将处于一个极高水平。\n\
  \n总之，我们展示了表 8.1，，它描述了三个类别以及安全等级（从 2 到 8）。\n\n表 8.1 固件空中更新（OTA） ECU 安全等级](#c8.xhtml#re_TNF-CH008_CIT0019)\n\
  \n| ECU 分类 | 下载故障 | FOTA 攻击（刷写） | 任意刷写 |\n| :--- | :--- | :--- | :--- |\n| 动力总 (Powertrain)\
  \ | 5 | 7 | 8 |\n| 车辆安全 (Vehicle safety) | 5 | 7 | 8 |\n|舒适性 (Comfort) | 3 | 5 |\
  \ 6 |\n| 信息娱乐 (Infotainment) | 2 | 4 | 5 |\n| 远程信息 (Telematics) | 2 | 4 | 5 |\n\n\
  ### 8.3.3.2 对 OTA 更新的攻击](#contents.xhtml#re_h-8)\n\n恶意用户对 OTA 更新有非常特定的目标。最常见的问题发生在服务器与车辆之间的\
  \ [#c8.xhtml#re_TNF-CH008_CIT0019)] 之间。攻击者可以实现“读取更新”、“拒绝更新”、“拒绝功能”或“控制车辆”。考虑到这些点，相应的攻击者必须具备以下技能：\n\
  \n1. **破坏网络的能力**\n   利用蜂窝网络访问更新服务器，或使用车辆的 `Wi-Fi`、`Bluetooth` 和 `USB` 端口更新特定的 `EC`。\n\
  \n2. **侵入车辆 ECU 安全协议的能力**\n   绕过安全并访问来自外部的数据。\n\n3. **密码学方面的专长**\n   目标是篡改软件更新的签名。\n\
  \n4. **访问存储库**\n   通过某种方式，攻击者可以访问之前的更新，并处理尚未修复的漏洞，或者在长期范围内发现新的漏洞。\n\n人们可能用来实现这些目标的安全攻击基于我们在存储\
  \ [#c8.xhtml#re_TNF-CH008_CIT0013)]遇到的漏洞：\n\n1. **读取更新**\n   - i. **窃听攻击**\n   \
  \  来自存储库的未加密软件更新可能导致数据泄露。为了利用这一漏洞，黑客实施窃听攻击。利用不安全的网络通信访问智能汽车发送或接收的数据。\n\n2. **拒绝更新**\n\
  \   - i. **丢弃请求攻击**\n     攻击者试图阻止车辆 `ECUs` 获取任何更新。实现此目标的方法是阻塞所有网络流量。\n   - i. **检索攻击**\n\
  \     攻击者以非常缓慢的数据流响应客户端，导致更新过程永远无法完成。\n   - i. **无限冻**\n     攻击者继续向软件更新系统呈现已经看过的文件。结果是客户端对新文件毫无感知。\n\
  \   - i. **部分包安装攻击**\n     有时当车辆电源耗尽时可能会发生。这里的核心主意是在 `ECUs` 安装更新的过程中尝试中断它们。\n\n\
  3. **拒绝功能**\n   - i. **回滚攻击**\n     入侵者向更新系统隐藏每一次新更新，只显示那些存在问题和缺陷的版本。用户没有新软件的证据，只安装黑客想要的内容。\n\
  \   - i. **无限数据攻击**\n     攻击者接受包含数据循环的下载请求。这可能给 `ECUs` 带来许多问题，例如缓冲区溢出。\n   - i.\
  \ **混合包攻击**\n     入侵者不是创建新软件，而是尝试在不同的 `ECUs` 上同时安装不兼容软件。结果是 `ECUs` 无法正常工作且无法相互交互。\n\
  \   - i. **混合攻击**\n     在存储库中，除了官方同步更新外，还有其他旧版本。这种攻击的结果是安装了错误的包，可能会导致车辆操作系统混乱。\n\
  \n4. **控制车辆**\n   - i. **任意软件攻击**\n     最后，我们提出了我们可能面临的最糟糕的情况，即无论所有者是否同意都完成了非法软件的安装。在这种攻击中，攻击者删除汽车的官方软件，并安装他们实现目标所需的内容。\n\
  \n### 8.4 现有解决方案](#contents.xhtml#re_h-9)\n\n用户安全很大程度上取决于车辆升级的方式。空中更新（OTA）必须遵循某些规则，以确保安全和乘客安全。随着技术的演进，出现了新的创新解决方案来应对威胁。在本节中，我们将描述已经构建的保护机制并探索它们的一些可能性。\n\
  \n#### 8.4.1 考虑因素](#contents.xhtml#re_h-10)\n\n为了在更新安全方面确定最佳机制，28] 指出了存在的以下限制，这些限制阻止了制造商应用现代技术来有效防御智能车辆系统。\n\
  \n1. **硬件**：车辆无法与电脑和手机相比，因为它们的 `ECUs` 性能远不如目前的 CPU。这会直接影响例如复杂加密算法的应用，因为强加密所需的高级计算无法实时完成。\n\
  2. **实时性**：尽管车辆的 `ECUs` 能力有限，但 OTA 更新必须在特定时间内完成，而不能长时间占用系统。\n3. **自主性**：由安全系统执行的功能应尽可能自主地执行，不需要驾驶员或车辆所有者的交互。\n\
  4. **生命周期**：由于车辆的生命周期比其他标准长得多，我们需要找到一种在多年后都实用的安全工具。\n5. **兼容性**：开发的系统必须适用于所有车型，包括新车和旧车。这将降低成本。此外，安全系统不应限制使用其他通信协议的外部源。\n\
  \n#### 8.4.2 外部防护](#contents.xhtml#re_h-11)\n\n针对上述问题，我们找到了可以解决这些问题的现有解决方案。许多攻击发生在传输的数据以及汽车与制造商骨干之间的通信上。有一些项目可以保护车辆的外部通信系统。\n\
  \n\n\n\nEVITA 项目 \\[8\\] 是一种完整的网络解决方案，其目标是保护从一辆智能车辆到另一辆智能车辆以及从智能车辆到互联网服务器的通信。它结合了硬件和软件来实现其目标。特别是，所提的架构包含了硬件安全模块（`HSMs`），用于安全且高效地执行加密操作和其他安全技术。\n\
  \n同样地，SEVECOM 项目 \\[22\\] 使用安全管理器作为项目架构中的主要组件。它启动并管理所有其他 `HSMs` 的组件，并确保加密模块的运行。为了应对不同的入侵情况，安全管理器维护了不同的策略集，这些策略的目标都是根据系统状态启用模块、禁用模块或更改其参数，以维护车辆的安全。为了实现上述所有目标，它利用\
  \ `HSMs` 存储私钥并执行加密算法。\n\n此外，\\[27\\] 的作者建议利用 \\[3\\] 中提出的轻量级可扩展区块链来安全地连接车辆、软件提供商、制造商、云存储和服务中心。该区块链被实现在集群网络上，以减少原始工作量证明共识算法的资源需求。\n\
  \nOVERSEE 项目 \\[6\\] 提供了一个主要的框架，将所有通信协议（如上述协议）保留实现在单个 `OVERSEE ECU` 上。\n\n### 8.4.3\
  \ 内部保护 (#contents.xhtml#re_h-8-12)\n\n攻击也可以针对汽车的内部通信。针对此类攻击的大多数解决方案基于密码学、异常检测和 `ECU`\
  \ 软件完整性。\n\n为了确保机密性并防止数据泄露给未经授权的方，必须对其加密。加密在今天的环境中非常普遍，几乎出现在每种使用的主要协议中。因此，通过使用专门用于密钥管理的\
  \ `HSMs` 和 `ECUs`，我们可以像 \\[34\\] 中提出的那样，在传输前对每个数据进行加密。\n\n另一个可以通过密码学解决的问题在 \\[28\\\
  ] 中描述。如果控制区域网络上当前没有正在传输的消息，每个节点都可以开始发射，但这种情况下的问题是发送者无法通过身份验证。诸如 `CANAuth` \\[33\\\
  ] 和 `LiBraCAN` \\[7\\] 等项目通过在 `CAN 总线` 上实现消息认证协议解决了这个问题。此外，在异常检测领域，最近的一个项目 \\[18\\\
  ] 提出了一种通过监控总线上的所有数据来保护 `ECUs` 并检测未经授权传输的方法。每个 `ECU` 检测到来自其他 `ECUs` 传输带有自身 ID 的 `Data\
  \ Frames`。此类数据传输被视为未经授权的消息。如果 `ECU` 检测到未经授权的消息，那么它会立即发送一个 `Error Frame` 以在消息传输完成之前覆盖该消息。\n\
  \n另一种与传统入侵检测系统（`IDS`）实现非常相似的方法在 \\[26\\] 中描述。入侵检测系统（`IDS`）构成了增强车辆安全的一种方式 \\[1\\\
  ]。与传统的 `IDS` 不同，`IDS` 必须是轻量级的，因为 `ECU` 的计算资源非常有限。在这个项目中，每个交易都会被记录。如果两次消息之间的时间间隔短于正常值，`IDS`\
  \ 会认为该消息是注入的。此外，为了确保 `ECU` 软件的完整性，如 \\[28\\] 所示，可以使用 \\[8\\] 中提到的技术。通过使用 `OVERSEE`，安全可以保持在很高水平，特别是在多媒体\
  \ `ECUs` 上 \\[22\\]。这种方法使用了名为 `XtratuM` 的虚拟机 \\[26\\]。虚拟机程序的主要工作是测试来自不受信源的软件。使用严格策略的虚拟机程序可以防止此类软件被成功安装。最后，\\\
  [16\\] 的作者证明了多输入技术可以用于车载自组织网络作为防御机制，以避免干扰器威胁 \\[15\\]并计算通信被阻塞的区域，采取适当的路由决策可以进一步提高性能。\n\
  \n### 8.4.4 特定更新保护 (#contents.xhtml#re_h-8-13)\n\n在 \\[31\\] 中，提出了 `Uptane`，这是一个专门为车辆设计的安全空中更新平台。它的核心思想是将特定任务委托给特定的角色。特别是，从云发送到车辆的更新数据由五个不同的角色使用相应的私钥进行签名。当智能汽车接收到更新时，相关的\
  \ `ECU` 会解包并验证其真实性。\n\n[23\\] 的发明者创建了一个系统，存储了代表车辆使用情况的概率图。系统的任务是根据概率图和预计停机时间调度软件更新安装，并在确保车辆确实在使用后按计划进行安装。\n\
  \n## 8.5 讨论 (#contents.xhtml#re_h-8-14)\n\n在本节中，我们对汽车空中软件更新主题方面的工作进行了简要讨论。该领域的研究已经跨越了十年，自\
  \ 2007 年以来。惊讶的是，从那时起，OTA 更新尚未集成到每一个新车型中。即使集成了，这些更新通常也并不关重要，或者发布间隔较短 \\[24\\]。这表明智能汽车制造商仍然对这项技术感到畏惧，还没有准备好完全接受它。尽管其益处由于其实用性非常奇妙，但它们似乎并不重要。\n\
  \n\n\n他们是正确的，因为如果这项技术没有得到正确且尽可能安全的实施，它会使他们的产品变得脆弱得多。空中下载（OTA）需要无线通信，这构成了访问汽车系统的新途径。攻击者现在可以拦截并重放发送给车辆或从车辆发出的，并向车辆或与其通信的基础设施发送自己的消息。这些可能性让攻击者能够控制汽车系统的部分或全部功能。此外，汽车系统也可能扮演攻击者，在车辆在使用期间尝试安装新更新。这两种情况都会导致事故。\n\
  \n为了解决这些问题，研究人员主要关注通过使用加密、入侵检测、软件验证和职责委派来确保车辆内部或外部通信的安全。在内部，还开发了智能汽车系统，根据车辆使用情况执行软件完整性验证和更新安装调度。这些解决方案涵盖了关于智能汽车\
  \ OTA 更新出现的大多数问题。\n\n尽管如此，仍然存在需要填补的空白。我们认为，应该专门针对车辆在使用期间避免安装更新进行更多研究。在指定时间的软件安装命令可能会绕过安全机制并进入汽车系统。如果车辆在指定时间恰好移动并由于某种原因尝试安装，系统可能会关闭并导致车辆对数字或物理命令无响应。\n\
  \n事实上，汽车行业应该警惕这项技术，并尽一切确保为客户提供最大的安全性。一旦修复了最细微的问题并经过充分测试，发布安全更新应该排在他们清单的首位。此外，每个系统都应该有自己的支持团队，在客户使用的期间专门对其进行修复和优化；停止支持可能是致命的，因为新威胁每天都会出现，而且一个系统的解决方案可能与其他系统不兼容。\n\
  \n## 8. 结论\n\n智能汽车已开始席世界，在不久的将来，它们可能会成为汽车行业的新常态。空中下载软件更新已经在电信行业开发并建立，并证明了它们的价值。由于这涉及到人类生命，它们在汽车行业的应用面临挑战。人们在缩短这一差距方面已经做了大量工作，以至于这项技术已经应用于市场上的车型中，有时成功，有时则不然。在差距消失之前，仍然有许多学习和改进的空间。本文描述了与智能汽车和空中下载更新相关的优势、威胁和漏洞；收集了针对这些问题的现有解决方案列表，并对当前相关研究和行业状况进行了简要检查。\n\
  \n## 8. 术语表\n\n**智能汽车 (Smart Car):** 一种具有先进电子、人工智能和可以辅助车辆操作员的多代理系统的汽车。\n\n**空中下载\
  \ (OTA):** 向移动设备无线传输新软件或数据。无线运营商和原始设备制造商（OEM）使用 `OTA` 实时向汽车发送更新数据。\n\n**电子控制单元 (ECU):**\
  \ 汽车电子中的嵌入式系统，控制车辆中的一个或多个电气系统或子系统。\n\n### 参考文献\n\n1. Ahmed Ahmim, Leandros Maglaras,\
