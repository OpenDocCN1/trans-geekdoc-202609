  \n## 6.1 引言\n\n与前代无线通信网络（4G）相比，5G 网络提供了更高的数据速率、更优的服务质量（QoS）、极低的延迟（Ahmad, et al.,\
  \ 2017）以及高设备密度。这不仅允许大量的手持设备，还能大规模连接物联网（IoT）、机器间通信（M2M）以及信息物理系统（CPS）。考虑到 5G 网络带来的新应用场景，以及服务类型和连接设备（种类和数量上）的增加，这一新一代网络的威胁格局已大幅扩大。\n\
  \n### 6.1.1 前几代的安全性\n\n每一代无线移动网络都存在安全问题。第一代（1G）由于其模拟本质，众所周知地面临拦截和克隆的挑战。第二代（2G）变为数字化，并通过用户设备（UE）匿名化、认证、信令和用户数据保护提供了一些安全特性能。然而，它也存在一些安全问题，例如只有单向认证（用户设备未验证运营商），并且容易受到垃圾信息、不必要的广播和虚假信息注入的影响（Ahmad,\
  \ et al., 2017）（Ahmad, et al., 2019）。此外，加密算法被逆向工程，导致密码算法受到多种攻击（Cattaneo, Maio, &\
  \ Petrillo, 2013）（Golić, 1997）。再者，它无法通过升级来提高其安全性。第三代（3G）带来了更高的数据速率和新服务。基于 IP 的通信也开始成为基础设施的一部分。尽管\
  \ 3G 显著提升了安全性（在 `TS33.102` 中规定了五组安全特征（3GPP, 1999）），但它仍存在一些明显的缺陷，例如基于 IP 的漏洞。随着 4G\
  \ 的到来，IP 通信扩展到移动网络的更多节点，增加了由 IP 流量引发的安全风险。Ahmad 等人详细说明了从 1G 到 4G 无线技术的安全机制和挑战（Ahmad,\
  \ et al., 2019）。\n\n### 6.1.2 M5G 项目的结构\n\n5G 移动器（M5G）是一个为期 36 个月的项目，于 2018 年启动，汇集了工业和学术伙伴，旨在研发集成到第五代移动网络（5G）的产品和解决方案。产品分为四个主要领域：网络边缘、网络核心、机器间通信（M2M）和人类通信。\n\
  \n该项目分为不同的领域，本章提出的概念证明（PoC）与 5G 的产品和服务有关。\n\n### 6.1.3 保护 5G 核心的性\n\n5G 的安全挑战范围广泛，因为服务多样性较前代显著增加，且网络架构发生了一些范式变化。虚拟化预计将被广泛采用，以及多租户支持，如果不加处理，可能会带来新的安全问题。\n\
  \n### 6.1.4 提议\n\n本提案包含在安全框架中，并关注 5G 核心。具体而言，它包含两个不同的组件：入侵检测与防御系统（`AppIDPS`）以及由\
  \ `Event Collector` 和 `Dashboard` 组成的事件处理平台（`EPVP`）。为了验证它，使用了网络功能（`NEF`）作为示例。图 6.1\
  \ 展示了典型 5G 网络的主要组件。\n\n![](img/fig6.jpg)\n\n图 6.1 5G 系统组件及 PoC – 改编自 (ETSI, 2020)。\n\
  \n### 6.1.5 章节结构\n\n本章剩余部分分为以下结构：第 6.2 节提供了 5G 安全的概述。第 6.3 节描述了学术界发表的相关工作。第 6.4\
  \ 节详细介绍了此处提出的 PoC 架构和组件。第 6.5 节包含组件测试结果和集成场景。第 6.6 节总结本章。\n\n## 6.2 5G 安全\n\n本节概述了\
  \ 5G 安全的现状以及与 PoC 相关的研究。\n\n### 6.2.1 5G 网络安全架构\n\n5G 的安全挑战范围广泛，因为服务多样性较前代显著增加，且网络架构发生了一些范式变化。5G\
  \ 规范的设计是为了应对这些新挑战。虚拟化预计将被广泛采用，以及多租户支持，如果不加处理，可能会带来新的安全问题。此类技术的示例包括 `SDN`、`NFV`、`Mobile\
  \ Edge Computing` 和 `Massive Input Multiple Output`(Ahmad, et al., 2019）。NGMN（NGMN\
  \ 联盟, 2015）列出了 5G 的建议，并指出了局限性（Liyanage, Ahmad, Abro, Gurtov, & Yliantila, 2018）：闪暴网络流量、无线接口密钥的安全、用户面完整性、强制性网络安全、用户级安全策略的一致性以及针对基础设施的\
  \ DoS 攻击。\n\n5G 的安全基于三个主要原则的愿景：卓越的内置安全、灵活的安全机制和自动化（Liyanage, Ahmad, Abro, Gurtov,\
  \ & Ylianttila, 2018）。此外，它遵循国际电信联盟（2005）和 3GPP（2018）定义的安全架构以提供一种系统化的方法，从而产生一个分为六个主要领域的安全框架，分别是：(1)\
  \ 网络接入安全、(2) 网络域安全、(3) 用户域安全、(4) 应用域安全、(5) 基于服务的架构域安全，以及(6) 可视性与配置性安全。\n\n### 6.2.2\
  \ 当前研究\n\n\n\n\n\n5G 的安全性方面一直引起学术社区的关注。作为一个总体概述，Cao 等人（Cao, et al., 2019）讨论了与用户设备（UE）接入和切换方法相关的\
  \ 5G 网络安全方面，包括物联网（IoT）、设备到设备（D2D）、车类一切（V2X）以及网络切片的安全性。作者们还列出了每种用例的可能解决方案，并描述了未来研究的一些开放性。在这一第五代技术中，UE\
  \ 与网络之间的认证使用了长期演进（LTE）中引入的演进分组系统认证和密钥协议（EPS-AKA），因为尽管它引入了一些通信开销和延迟，但到为止尚未发现任何安全漏洞。Ferrag\
  \ 等人（Ferrag, Maglaras, Argyriou, Kosmanos, & Janicke, 2018）在一篇讨论 4G 和 5G 无线移动网络安全现有综述的论文中提出了一种分类\
  \ 4G 和 5G 网络攻击的威胁模型。他们将攻击分为四类：隐私、完整性、可用性和身份认证。\n\n5G 网络的安全性还将取决于在不同的实现中所做的选择。规范中极其广泛的可能性提供了配置选项，这些选项可能导致网络出现安全漏洞，增加网络遭受攻击的脆弱性（Jover\
  \ & Marojevic, 2019）。例如，系统仍然支持空加密和空认证，而有效的网络配置可能会使用它们。另一个例子是 Li 等人（Li, et al., 2018）描述的功能链配置，在其中他们提出了一种规则管理框架，用于实现带有异常解决的安全规则配置。还有一些机制可能只有在全球合作下才有用，而这不太可能发生。这种合作对于保证防止身份认证前的消息攻击是必要的，而且每个通用用户识别模块（SIM）都必须无例外地包含全球所有网络运营商的公钥，这在实现上是极其困难（甚至是不可能的）。\n\
  \n## 6.3 相关工作\n\n5G 基础设施的安全性一直是学术界的研究课题。为了解决 5G 中基于 SDN 的网络安全问题，Luo 等人（Luo, Wu,\
  \ Li, Guo, & Pei, 2015）利用攻击图算法和层次分析法（AHP）对基于 SDN 的移动网络提出了漏洞评估。Arfaoui 等人（Arfaoui,\
  \ et al., 2018）遵循 ITU-T 的 X.805 安全架构，提出了一种 5G 安全架构。他们将其呈现为基于以下要素的系统安全实例化方法：(1) 域隔离，(2)\
  \ 通过从高层视角对在共同威胁环境中相互相关的协议、数据和功能进行分层分类，(3) 安全域，以及 (4) 安全控制类。在 Fang、Qian 和 Hu（2017）中提出的另一种\
  \ 5G 网络安全架构在切换程序和信令负载分析场景下进行了测试。他们指出了 3GPP 5G 网络安全架构中定义的四个安全域：(1) 网络接入安全，(2) 网络域安全，(3)\
  \ 用户域安全，以及 (4) 应用域安全。\n\n安全服务的 部署和配置也会决定系统的整体安全性。5G 架构可以通过将不同功能链联起来组成。这同样适用于其安全系统。如果规则配置错误，配置安全系统的规则会对安全产生影响。不同系统可以有不同的规则，链具有不同规则的组件会增加这种风险。Li\
  \ 等人（Li, et al., 2018）提出了一种规则管理框架，以降低安全功能链环境中规则误配置的风险，从而最大限度地减少安全架构中的漏洞。\n\n利用基于\
  \ 5G 的车载网络环境，Xu, Dong, Ota, Wu 和 Li 提出了一种软件定义动态安全防御。该方法基于 5G 的车载网络环境，并根据机密性、完整性和可用性三个维度进行评估。这种软件定义防御通过基于模糊\
  \ A 和和数技术排序与理想解解法（TOPSIS）生成并部署安全策略。该方法针对 5G 核心网络，评估了信息安全的三个方面：机密性、完整性和可用性。本章提出的\
  \ PoC 由应用级 IDPS（AppIDPS）和事件处理与可视化平台（EPVP）组成，并作用于 5G 核心组件。\n\n## 6.4 架构与组件\n\n所提出的\
  \ PoC 的组件如图 6.2 所示，是 5G 网络更完整安全架构的子集。NEF 将作为保护的核心组件，其活动将由 IDPS 进行监控。为了背景目的，图 6.2\
  \ 还包含了可能向 EPVP 发送事件的其他组件，例如域名系统 IDPS、蜜罐网络和漏洞扫描器，这些在本文中未进行讨论。\n\n![图 6.2 5G 安全框架概述](img/fig6.2.jpg)\n\
  \n*图 6.2* 5G 安全框架概述。\n\n### 6.4.1 事件处理与可视化平台\n\nEPVP 接收来自多个 5G 核心节点的安全事件，并通过简单易懂的\
  \ 界面呈现给操作人员。它的任务是接收、处理、记录并展示处理后的事件数据相应的节点指标。它遵循微服务架构，并基于三个主要的组件/微服务构建：负责事件转发和汇集的\
  \ Kafka 集群；负责预处理、数据处理函数以及节点数据计算的中间件；以及用于向安全人员输出处理信息的 Web UI（仪表板）。EPVP 的部署使用 Docker\
  \ 容器，简化了管理和部署过程。选择 `Docker` 也考虑了扩展性，配合易于扩展的 `Kafka` 服务。\n\n该架构（图 6.3）旨在实现最优事件处理。通过将\
  \ Web 界面和数据处理分离到不同的组件，我们可以获得更高的吞吐量和更好的整体性能，在不损害数据完整性的情况下有效分担负载，同时保持所有数据的相关性和实时性。还有一个专门为存储旧事件创建的数据存储器，这直接减少了中间件的资源消耗。用户随后可以在\
  \ Web 界面查询这些事件。\n\n\n\n\n\n接收到的事件以 JSON 格式传输，并使用指定了消息结构和变量限制的通用数据模型。它包含所有组件通用的通用字段以及可扩展的元数据字段，以便进行定制适配。\n\
  \n### 6.4.2 AppIDPS\n\nAppIDPS 是作为应用层的一个额外安全层而开发的。它通过分析所选安全组件的信息以及其 API 处理的请求，来检测来自恶意实体的威胁。AppIDPS\
  \ 具有基于规则的算法，能够检测新兴威胁并报告给 EPVP。\n\n#### 6.4.2.1 内部视图\n\nAppIDPS 通过特定的 API 从其他服务收集信息以进行安全分析。AppIDPS\
  \ 的总体视图如图 6.4 所示。\n\n![Figure 6.4 AppIDPS – general perspective.](img/fig6.4.jpg)\n\
  \n*图 6.4* AppIDPS – 总体。\n\nAppIDPS 的内部架构包含多种元素：(1) 可扩展的组件，用于从需要保护的网络功能（NFs）和应用功能（AFs）收集信息；(2)\
  \ 关联组件，根据一组规则和安全算法执行安全分析，利用提供的信息检测安全漏洞和攻击；(3) 安全服务器组件，确保不同组件之间的信令是安全的，并与外部仪表板进行集成；(4)\
  \ 实时数据库组件，负责提供实时信息以支持关联组件的安全分析。内部视图如图 6.5 所示，主要的内部组件在表 6.1 中描述。\n\n![Figure 6.5\
  \ AppIDPS – internal view.](img/fig6.5.jpg)\n\n*图 6.5* AppIDPS – 内部视图。\n\n*表 6.1*\
  \ App IDPS 组件描述\n\n| 组件 | 组件描述 |\n| --- | --- |\n| Policyenforcer | 响应特定事件时应用策略，并在内部数据库中记录已应用的策略。\
  \ |\n| MQTT | `MQTT` 是一种基于 ISO 标准的发布/订阅型消息协议。该组件是此类消息的代理，允许与外部组件接收和发送数据。 |\n| Telegraph\
  \ | 一种用于收集和报告指标及数据的代理。其插件允许与多个数据源交互。在这种情况下，它从 `MQTT` 接收数据并将收集到的数据馈送给 `InfluxDB`。\
  \ |\n| InfluxDB | 时间序列数据库，针对时间序列数据的快速、高可用存储和检索进行了优化。它存储了来自 Telegraph 的大量监控数据。 |\n\
  | Kapacitor | 数据处理引擎，使用自定义逻辑或用户定义函数处理 `InfluxDB` 的数据，以通过动态阈值处理告警、匹配指标模式、计算统计异常，并根据这些告警执行特定操作（如动态负载重平衡）。\
  \ |\n| Dashboard | 允许人类与系统交互，并定义规则和策略。它还处理自动系统无法自行处理的情况。 |\n| SecurityDB | 带有 ACL（访问控制列表）的数据库，为\
  \ `MQTT` 服务器及其主题提供访问控制。它还包括针对 `MQTT` 服务器和仪表板的 AAA（认证、授权和计费）。 |\n\n#### 6.4.2.2 指标和策略消息\n\
  \n探针在发生任何操作时向 AppIDPS 发送指标并接收策略。消息使用 JSON 和 `MQTT` 协议发送。用于分析的发送包含多种项目，并包含通用头和带有特定特定信息的正文。通用头中的字段包括应用程序客户端的源\
  \ IP、访问时间戳、网络功能 ID 和网络功能类型（根据 3GPP 规范）。对于策略，正文格式也由每个应用定义。\n\n### 6.4.3 NEF\n\nNEF\
  \ 是一个 5G 标准组件，以对开发者友好的方式暴露网络服务和能力的 API。在此 PoC（概念验证）中使用的 NEF 是遵循 3GPP OpenAPI 规范用\
  \ Python 开发的。NEF 的内部组件包括 (1) API 工作节点本身，作为无状态 RESTful 服务运行，可以轻松扩展/收缩；(2) 位于 API\
  \ 前的负载均衡器，具有双重目的：在现有 API 工作节点之间分配负载，并拦截来自恶意实体的请求（这反映了与 AppIDPS 的现有集成，AppIDPS 接收来自位于\
  \ NEF 内部的安全探针的信息，该探针正在分析所有请求）；(3) 包含每个 NEF 客户端（AF）执行的所有交换和订阅的数据库。扩展策略基于外部编排器，并基于\
  \ NEF 内部监控代理收集的指标和性能指示。扩容通过启动额外的 API 工作节点并通知负载均衡器来实现。\n\n## 6.5 初步结果\n\n本章的子节将描述对\
  \ EPVP、AppIDPS 和 NEF 进行的测试，以及全局集成场景。\n\n### 6.5.1 事件处理与可视化平台测试\n\n考虑到前述的 EPVP 架构，有一个关键组件需要测试，鉴于输入数据可能产生瓶颈，那就是中间件。至于\
  \ Kafka Broker(s)，其性能已经在学术界得到过研究（L. Bougé, Costan and Noach 2017），因此将不再进行单独测试。在中间件上进行的测试包括事件的平均处理时间，以及验证其在处理无效或错误数据时健壮性的完整性测试。所有测试均在\
  \ VMWare 虚拟机上进行，配置配置为 4 个 vCPU – Intel Xeon X5660 @ 2.80GHz，16 GB DDR RAM 和 40 GB\
  \ SSD 存储。\n\n中间件和仪表板组件共同工作，将从 Kafka Broker 消耗的数据转换为易于理解的视觉元素，供终端用户对随时间变化的 5G 核心网安全行为进行解释。在中间件收集和处理传入事件时，其在给定时间内存储的数据量存在限制。数据保留在内存中，以便\
  \ WebUI 通过 WebSocket 快速、方便地访问。然而，随着数据量的增加，必须研究在不影响性能的情况下在内存中可以保留的事件数量，从而在不消耗过多资源的情况下优化仪表板的用户体验。\n\
  \n\n\n\n当新事件到达时，`Middleware` 会重新计算考虑整个内存事件 set 的指标。关于 `Middleware` 平均事件处理时间的测试，其目标是估算\
  \ `Middleware` 在任何给定时刻应保留的事件最大数量，且在重新计算指标时不会显著影响处理速度。一旦达到该限制，`Middleware` 将开始丢弃较旧事件。由于数据存储在数组数据结构中以便\
  \ `Dashboard` 轻松访问，数据量越大，直接导致数组周期时间越慢。这些测试在不同的单次保留最大事件数（10000、25000、50000、75000\
  \ 和 100000）值下运行（即 `Middleware` 缓冲区），然后获取了处理时间样本（参见图 6.6）并进行了比较。事件是使用合成事件生成器随机生成的，有效地模拟了实时事件流，同时施加了之前列出的不同缓冲区容量。每个缓冲区容量值都重复了三次。由于\
  \ `NodeJS`（该组件基于的编程语言）本质上是单线程的，因此缓冲区按顺序填充，事件通过 `Kafka Consumer` 模块到达 `Middleware`，该模块直接从\
  \ `Kafka Broker` 消费事件。随后，事件被处理并与该事件相应的必要视觉数据一起发送到 `Dashboard`。`Middleware` 内存中也存储了该事件的副本。\n\
  \n![图 6.6 事件处理时间线。](img/fig6.6.jpg)\n\n*图 6.6* 事件处理时间线。\n\n容量测试结果显示，当事件缓冲区大小超过五万事件时，平均处理时间（图\
  \ 6.7）增加了多达 16 倍。增加缓冲区大小会导致平均事件处理时间的快速增长，这为每个进入的事件给系统增加了开销。这种开销部分归因于 `NodeJS` 本身的局限性（主要是缺乏多线程支持——这意味着没有并行事件处理），部分归因于缓冲区数组的大小，在较大尺寸下，需要遍历整个数组的操作会变得显著变慢。因此，根据获得的结果，建议将缓冲区大小保持在七万五千条目目或以下，以确保最佳的\
  \ `Middleware` 事件处理时间。这项测试有助于找到 `Middleware` 中保留数据量与处理事件所需时间之间的良好比例。然而，重要的是该问题已实现了一个解决方案：一个侧边应用程序用于从磁盘存储/检索旧事件，以便进行数据日志以及通过\
  \ `Dashboard` 本身查找旧事件，从而解决了将所有数据保留在内存中的问题。这样，`Middleware` 可以在内存中保留相关的新数据和从中获得的所有指标，同时为用户提供查找旧事件的方法。\n\
  \n![图 6.7 针对所提每个“缓冲区”容量阈值的有效处理时间测试](img/fig6.7.jpg)\n\n*图 6.7* 针对所提每个“缓冲区”容量阈值的有效处理时间测试。\n\
  \n还进行了 `Middleware` 棒性测试。测试分为两类：(1) 消息结构——验证 `JSON` 元组消息及其结构的完整性，以及强制字段的存在；(2) 消息内容——验证\
  \ `JSON` 消息字段。所有测试的事件均被正确识别为有效或无效。\n\n### 6.5.2 网络暴露函数测试\n\n对 `NEF` 进行了测试以评估其性能和扩展能力。测试使用了不同数量的\
  \ `AFs`（应用函数）发送连续请求，在两种特定场景下，分别使用一个和两个 `NEF` 实例。每个变体的测试持续时间为 210 秒。图 6.8 中的结果显示，当使用一个\
  \ `NEF` 实例运行不同数量的 `AF` 实例时，处理的总请求数相似。这表明 `NEF` 始终处于最大处理能力。当增加到两个 `NEF` 实例时，我们可以观察到请求平均数的增加，显示增加\
  \ `NEF` 实例数量带来了有效的性能提升。\n\n![图 6.8 NEF 请求处理](img/fig6.8.jpg)\n\n*图 6.8* NEF 请求处理。\n\
  \n还对 `NEF` 进行了测试，以评估通过 `AppIDPS` 实施的安全措施的有效性。在这种场景下，`AppIDPS` 以预定义的时间间隔从 `NEF` 接收数据并进行分析以检测攻击。每当检测到这些攻击时，`AppIDPS`\
  \ 会向 `NEF` 提供反馈，告知攻击源，随后随后被用于触发针对恶意 IP 地址请求的拦截动作。图 6.9 中，经历了两种情况，可以观察到检测到攻击时拦截动作的影响，因为攻击期间响应时间下降了近一半。在图\
  \ 6.10 中，可以理解到在攻击被拦截后，被处理的有效请求数量有所增加。\n\n![图 6.9 NEF 响应时间拦截](img/fig6.9.jpg)\n\n\
  *图 6.9* NEF 响应时间拦截。\n\n![图 6.10 有无 AppIDPS 反馈的 NEF 请求处理](img/fig6.10.jpg)\n\n*图\
  \ 6.10* 有无 AppIDPS 反馈的 NEF 请求处理。\n\n### 6.5.3 集成场景\n\n使用 PoC 设计并实现了一个集成场景。该应用场景使用名为\
  \ `BodyKit` 的设备，它与 5G 基础设施交互以更改网络参数。`BodyKit` 是一种供应急人员（如消防员或警察）佩戴的可穿戴设备，通过提供现场数据来增强当前指挥中心的能力，包括先进的双向语音、视频通信以及从环境（如气体、烟、温度、湿度、位置）和生物传感器（如心电图、呼吸率、血压、心率、体温）收集的大量数据。它还具有检测倒倒事件和危险的环境状况（如高温和毒气体水平）。所有发送到\
  \ 5G 网络的信息都根据其服务质量 (`QoS`) 配置进行排序。为了实现这一点，`BodyKit` 服务器通过网络暴露函数 (`NEF`) 与 5G 核心交互，在策略控制函数处请求所需的\
  \ `QoS` 配置。\n\n在这种场景下，`BodyKit` 正在被使用并通过 `NEF` 组件请求更改。在某些时刻，攻击者与系统交互，向 `NEF` 发送未经授权的请求，通过更改网络参数或通过过载\
  \ `NEF` 组件触发拒绝服务 (`DoS`) 来损害 `BodyKit` 的操作。针对 `NEF` 的请求由 `AppIDPS` 分析，并检测到了异常的 `NEF`\
  \ 请求模式。作为响应，`AppIDPS` 向 `EPVP` 发送安全事件，该事件显示在仪表板上供安全人员分析并采取相应行动。\n\n#### 6.5.3.1\
  \ 测试床描述\n\n集成场景在测试床中搭建，相关服务部署在虚拟机 (`VMs`) 中，其交互关系遵循图 6.11 所示的图表。\n\n\n\n\n![图 6.11\
  \ 集成场景的测试床](img/fig6.11.jpg)\n\n*图 6.11* 集成场景的测试床。\n\n插图所示的组件描述可以在表 6.2 中找到。\n\n\
  *表 6.2* 组件描述\n\n| 组件 | same |\n| --- | --- |\n| AppIDPS VM | 包含 Tick Stack（Telegraph,\
  \ Influx, Cronograf 和 Kapacitor）、Postgres 和 `eMQTT`。它使用 `Probe API` 从 `NEF` 获取数据。\
  \ |\n| BodyKit VM | 运行通过 `REST API` 向 `NEF` 发起请求的服务。 |\n| Dashboard | Web 界面旨在作为所有其他核心\
  \ 5G 组件以及内部 `Event Collector` 元素的集中监控站。它接收来自 `Middleware` 经过处理的实时数据。 |\n| Kafka\
  \ | `Kafka Broker` 处理事件收集，并向下游转发给不同的 `Event Collector` 组件。 |\n| NEF | 该虚拟机运行 `NEF\
  \ service` 和 `Probe`。 |\n| Middleware | 将来自 `Kafka Broker` 的数据处理成指标并发送到 `Dashboard`。\
  \ |\n| Dashboard VM | 包含 仪表板所需的所有元素。 |\n| Auth | 处理 Dashboard 用户身份验证、角色分配和访问权限。\
  \ |\n| Monitoring | 通过使用 `NetData agents` 从其他 `Event Collector` 组件收集监控数据并发送到 `Dashboard`。\
  \ |\n| Backlog | 包含协同工作为 `Dashboard` 用户提供 DB 连接的元素，用户可以使用它查询旧的 DB 数据。**Middleware**\
  \ – 连接到 Web `Dashboard` 并允许用户在 `DB` 中搜索由于数据持久化原因而存储的旧数据。它向下游的 `Elasticsearch` 数据库发送请求。**Elastic**\
  \ – 存储事件的 DB 元素，供 Web `Dashboard` 用户未来进行搜索。**Connector** – 直接从 `Kafka Broker` 消费数据，以避免\
  \ `Middleware` 额外的处理开销，并将其存储在 `Elasticsearch Database` 中以供用户未来查找。 |\n\n#### 6.5.3.2\
  \ Dashboard\n\n5G 核心网的安全通过仪表板进行监控，如图 6.12 所示。`Dashboard` 显示按严重程度划分的事件总数、接收到的事件列表，并允许安全员访问每个事件的详情。还可以访问\
  \ `Backlog Datastore` 中的较旧事件。\n\n![图 6.12 EPVP 操作员仪表板](img/fig6.12.jpg)\n\n*图 6.12*\
  \ EPVP 操作员仪表板。\n\n## 6.6 结论\n\n在本章中，作者设计并实现了一个概念验证（PoC）架构，以 5G 网络暴露函数（`NEF`）为例，提高了\
  \ 5G 核心组件的。创建了一个测试床，`NEF` 是攻击目标，攻击被 `AppIDPS` 检测到，并产生安全事件经过处理后展示给安全操作员。未来的工作将改进性能和集成测试，扩展监控的核心组件数量。还将解决扩展性问题。\n\
