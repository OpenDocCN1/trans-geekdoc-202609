  \ Katsikas 和 Georgios Kavalleratos*\n\nDOI: [10.1201/9781003109952](http://doi.org/10.1201/9781003109952)\n\
  \n## 2.1 引言\n\n海运行业正活跃地致力于在不久的将来让遥控和自主船舶投入航行；这一活动构成了海运业中工业 4.0 进程的体现，并被称为“航运 4.0”。此类船舶包含了许多信息物理系统\
  \ (CPS)，它们执行着对船舶安全运行至关重要的功能；因此，解决它们的网络安全挑战至关重要。\n\n无人船的概念并不新鲜，早在 20 世纪 70 年代就出现了对这类船舶的设想，并一直定期出现[5]。1973\
  \ 年，Schönknecht 等人[37]对无人船的愿景描述如下：\n\n> 在这个理性化自动化的时代，想象一艘没有船员的船并不困难。完全可能在未来的未来某一天，船长将在岸上的办公楼内履行职责。他在船上留下一台计算机，来承担所有的航海艺术任务并控制船舶，而且事实上，它会更高效地完成这项任务。\n\
  \n1980 年，日本的智能船项目目标是“实现无需船员帮助即可运行的‘智能船’”，并提出了主从船模型，根据该模型，机器人船将组成编队。1994 年，Kai Levander\
  \ 针对短程航运提出了“无人员船”。\n\n\n\n\n\n> 一艘没有船员的船舶可以在 GPS 链的辅助下并在交通站的引导下航行。引航员可以在港口附近登船，并将[船舶]引入港口。自动泊位系统可以在没有船员帮助的情况下，将[船舶]固定在码头上。\n\
  \n1996 年，Bertram 和 Kaeding 建议人工智能（AI）与远程操作的结合对于船舶是可行的。然而，在当时，由于维护成本高，这一概念对航运公司仍然没有吸引力。2007\
  \ 年，Waterborne TP（一个欧洲海运利益相关者联盟）在一篇关于海洋行业未来发展的论文中重新提出了这一概念。尽管这篇论文建议更先进的自动化和改进的传感器可能是理想的，但并未主张全自动化。五年后，受这一理念的启发，欧洲研究小组在欧盟的资助下启动了名为\
  \ MUNIN（通过网络智能进行海事无人航行）的合作项目。MUNIN 项目得出结论：无人船只是可行的，但仅限于深海作业。2013 年，DNV GL 提出了 `Yara\
  \ Birkeland`，这是一艘长 60 米、电池驱动的自主船舶。2014 年，罗尔斯·莱斯通过人工智能和远程操作提出了 `unmannedership`。2016\
  \ 年，罗尔斯·莱斯在芬兰启动了一个名为 `ReVolt` 的联合项目，这是一艘自主集装箱船。2022 年，世界上第一个自主集装箱渡轮 `Yara Birkeland`\
  \ 预计将就绪。\n\n国际海事组织（IMO）使用 `MASS`（海洋自主水面船舶）术语来表示自主级别：\n\n- AL0：有船员的船舶\n- AL1：有海员的远程控制船舶\n\
  - AL2：无海员的远程控制船舶\n- AL3：全自主船舶\n\n无论自主级别如何，任何行业中 ICT（信息与通信技术）的采用一直伴随着该行业所临风险的扩大和多样化。这主要是因为传统操作在设计时没有考虑网络安全，而现代支持\
  \ ICT 的操作被允许通过企业系统进行访问和控制。由于企业系统通常连接到互联网，结果是缺乏安全意识的系统（如控制系统或导航系统）暴露给了外部人员。因此，几乎所有已知的针对工业控制系统的攻击都是通过首先入侵企业系统，随后将其作为跳板攻击控制系统而发起的，这并不令人意外。\n\
  \n在本章中，我们概述了无人船网络安全的现状。我们首先讨论了无人船的架构参考模型和通用系统架构。然后，我们利用这些模型来分析此类通用架构的网络风险。接下来，我们系统地阐述了无人船上三个最脆弱的\
  \ CPS（信息物理系统）的安全需求，即：自动识别系统（`AIS`）、电子海图显示与信息系统（`ECDIS`）和全球海事遇助安全系统（`GMDSS`）。这些内容结合风险分析，用于指导基准安全控制的选择，以设计安全架构。\n\
  \n无人船的概念意味着两种通用替代方案：\n\n- 远程控制船舶（AL1, AL2）\n- 自主船舶（AL3）\n\n在本节中，将讨论无人船的两种视图。第一个是`扩展海事架构框架\
  \ (eMAF)`，该框架被用于描述海洋领域技术系统、用户与相关治理方面之间的关系，以促进该领域新系统开发的协调。第二个是无人船 CPS 的通用架构，包括它们的相互连接和相互依赖关系，该架构的开发是为了对无人船进行安全分析。\n\
  \n\n\n\n\n一种海洋架构框架（Maritime Architecture Framework, MAF）被提出于 46](#c2.xhtml#re_TNF-CH002_CIT00046)]，旨在促进海事领域新系统和技术的开发与采用。MAF\
  \ 的开发过程遵循了智能电网体系模型 [8]；因此，MAF 的开发充分考虑了现有的海事架构，包括通用岸基系统架构 [1] 和国际海事组织（IMO）的电子航海架构\
  \ [17]。\n\nMAF 的核心元素是`多维立方体`（multidimensional cube），它结合了不同的视角，以为底层海事领域和所研究的系统架构提供图形化表示。该立方体捕获了三个维度，又称为`轴`（axes），即：互操作性、层次化和拓扑结构。拓扑轴代表技术组件所在的逻辑位置。互操作轴涉及海事系统的通信、数据与信息、使用以及语境。层次轴涵盖了海事领域的管理和控制系统；它从所研究系统分类到其活动领域开始，一直持续系统特定的操作，最后将系统分解为技术服务及其组件，以及接口化的物理组件\
  \ [46]。\n\n每个轴又细分为若干个`层`（layers）。拓扑轴的层（船舶、链路和岸基）源自 IMO 对海事领域的划分 [32]。互操作轴的层（规章与治理、功能、信息、通信和组件）涵盖了组织、信息和技术层方面，并包含了\
  \ IMO 电子航海愿景中所述的不同交互级别（操作、功能、技术和物理级） [16]。最后，层次轴的层（活动领域、操作、系统、技术服务、传感器与执行器以及运输对象）涵盖了海事系统的经济、技术和物理方面。\n\
  \n信息、技术和人员是无人船生态系统的关键元素 [12]，而 MAF 能够捕捉这些元素。因此，原则上 MAF 可以用于表示和分析无人船生态系统。然而，原始形式的\
  \ MAF 无法捕捉无人船的特定特征。如 [26] 所，为了描述相关的新概念和技术，拓扑轴应扩展以包含无人船、SCC（岸基控制中心）以及它们之间的链路。`无人船层`（Unmanned\
  \ ship layer）代表船侧实体，例如船舶的基础设施、运行和功能目标、流程和系统。`SCC 层`（SCC layer）代表岸基设施的实体，以及促进与海事部门内部或外部实体交互的流程和系统。`链路层`（Link\
  \ layer）代表无人船、SCC 以及其他实体（包括船舶）之间的电信方法和协议。所得的扩展 MAF（eMAF） [26] 如图图 2.1 所示。\n\n![图\
  \ 2.1 扩展的 MAF.](img/fig2.1.jpg)\n\n*图 2.1* 扩展的 MAF。\n\n## 2.2.2 无人船的 CPS\n\n根据文献提供的信息，包括\
  \ [31]、[6] 以及 IEC 61162 系列标准，在 [25] 中提出了一种基于 e-MAF 三层（无人船、SCC 和链路）的 CPS 通用架构。该架构的示意图如图图\
  \ 2.2 所示。在后续，我们将重点关注无人船层。\n\n![图 2.2 系统架构。](img/fig2.2.jpg)\n\n*图 2.2* 系统架构。\n\n\
  在无人船内部，下一层由`轮机自动化系统 (EAS)`、`驾驶台自动化系统 (BAS)` 和 `ICT 基础设施`组成。\n\nEAS 包含所有生成和管理船舶动力及推进系统的系统。这些包括：\n\
  \n*   `自主轮机监控与控制 (AEMC)`，它监控船舶的机械部分，并包括`机舱自主控制 (AC-ER)`，后者负责监控和控制推进系统、发电系统、燃料系统、舵机系统和蒸发系统；`应急处理\
  \ (EmH)`，包括报警系统；以及`轮机数据记录器 (EDL)`，它记录所有关于发动机运行的所有信息。\n*   `轮机效率系统 (EES)`，它监控并控制船舶的高效运行，包括用于维护的预防性工具。\n\
  *   `维护系统 (MIS)`，为机舱提供技术、管理和行政维护。它还包含一个 `EmH`实例。\n\n`驾驶台自动化系统 (BAS)` 包括驾驶台上的所有子系统，特别是用于船舶导航和控制的系统。这些包括：\n\
  \n*   `自动导航系统 (ANS)`，它为船舶提供导航，即确定位置、速度和方向等方面。ANS 包括`航行数据记录器 (VDR)`，它收集并存储有关船舶状况、位置、移动以及发动机和无线电系统的记录；`自动识别系统\
  \ (AIS)`，它是一种利用 VHF 移动频段内四个全球信道的通信系统，用于交换导航数据；`电子海图显示与信息系统 (ECDIS)`，它是一种用于航海的地理信息系统，符合国际海事组织（IMO）法规，作为纸质海图的替代方案；`先进传感器系统\
  \ (ASS)`，它提供船舶位置的信息以及多种导航辅助，如`自动驾驶仪`、`雷达`、`声呐`、`深度计`、`陀螺`和`避碰系统 (CA)`。\n*   `自主控制器\
  \ (ASC)`  SCC 评估传感器提供的数据以控制船舶运行。它包括`全球海事遇险安全系统 (GMDSS)`，这是一套国际公认的安全程序、设备类型和通信协议，旨在提高安全性并更容易救援遇难船舶、船只和飞机，由几个系统组成，旨在执行以下功能：警报（包括遇困单元的位置确定）、搜救协调、定位（寻呼）、海事安全信息广播、通用通信以及船对船通信，并提供冗余的遇险警报手段和应急电源；`货物管理/货物控制室\
  \ (CCR)`，负责对货物的有效控制和管理；一个 `EmH` 实例；`卫星通信系统`以及`监控监控系统 (CCTV)`。\n*   `ICT 基础设施` 包括船舶上使用的所有网络和计算设备；如`访问控制系统\
  \ (AC)` 等系统，负责控制对船舶的访问（无论是物理还是远程的）；以及`乘客服务系统 (PSS)`，它为船舶客户/乘客提供服务，目标是在船舶基础设施中实施高效的身份管理和访问控制。\n\
  \n\n\n\n\n`Shore Control Center (SCC)` 用于从岸上控制和导航一或多艘船只；它包含了 `human-machine interface\
  \ (HMI)` 和 `remote maneuvering support system (RMSS)`，后者是一种允许在 `SCC` 的控制下执行安全自主程序的信息系统。\n\
  \n`Link` 包含了船舶用于与其环境中的实体（包括 SCC 和其他船舶）进行通信的所有通信系统。\n\n为了完成无人船的架构描述，还需要识别 CPS（物理信息系统）之间的互连关系、依赖关系和相互依赖关系。当两个\
  \ CPS 之间存在信息交换时，它们是 `interconnected`（互连）；当两个 CPS 连接且其中一个系统的状态影响另一个系统的状态时，这些系统是 `dependent`（依赖）；当两个系统之间存在相互依赖关系时，它们是\
  \ `interdependent`（相互依赖）。无人船系统之间的互连和依赖关系分别如图图 2.3 和图 2.4 所示，其中每个图的节点代表系统，边代表连接/依赖关系。\n\
  \n![图 2.3 互连](img/fig2.3.jpg)\n\n*图 2.3* 互连。\n\n![图 2.4 依赖](img/fig2.4.jpg)\n\n\
  *图 2.4* 依赖。\n\n## 2.3 无人船的网络风险\n\n目前存在许多适用于通用 IT 系统的风险评估方法。虽然这些方法可以且已经应用于海洋领域的 IT\
  \ 系统，但它们无法准确评估与 CPS 相关的网络风险[2]]。CPS 的网络风险评估方法通常是领域特定化的，因为它们除了“传统的”机密性、完整性和可用性影响因素外，还需要将安全性作为一种影响因素考虑在内[6]]。在海事领域，有一篇关于网络安全风险评估方法的综述出现在[48]中。Rødseth\
  \ 等人在[35]中提出了一种针对无人商船的风险评估方法。尽管该方法旨在识别安全和防护风险，但特别关注了危害识别和相应的风险，网络安全问题在很大程度上没有得到解决。Tam\
  \ 等人在[43]中提出了一种基于 MaCRA 模型的的海事网络风险评估框架，并将其应用于多个示例场景[44]]。然而，MaCRA 的目的不是评估特定系统的风险或缺陷，而是为了促进对海事领域网络风险的理解。Svilicic\
  \ 等人在[41]中提出了一种用于评估船舶网络风险的框架，并将其应用于电子海图显示与信息系统（ECDIS）案例。\n\n文献中的几项工作分析了用于特定类型自主和遥控船舶的特定系统的安全威胁和风险。其中，Bolbot\
  \ 等人在[7]中识别并分析了自主内陆渡轮中的安全相关网络攻击；他们的分析了涉及渡轮航行和推进系统的安全方面。Silverajan 等人在[39]中探索了针对智能船舶系统的安全问题和网络攻击。Awan\
  \ 等人在[3]中分析了 59 起记录在案的事故，以更好地理解集成桥系统（IBS）组件的脆弱性。Svilicic 等人在[42]中介绍了一项关于从事国际贸易的\
  \ RoPax 船上安装的集成导航系统（INS）网络韧性的研究。Wang 等人在[45]中提出了一种安全的相对集成导航方法，以应对注入的故障测量攻击。Balduzzi\
  \ 等人在[4]中通过引入影响实施（通过在线提供商）和协议规范的威胁，对自动识别系统（AIS）进行了安全评估。Lund 等人在[28]中描述了针对 INS 及其集成\
  \ ECDIS 的概念验证攻击，并在船舶上演示了该攻击。\n\nKavallieratos 等人在[25]和[24]中开发并使用了改进版本的 STRIDE [38]]和\
  \ DREAD [29]]方法来识别潜在的网络攻击场景，并评估了无人船生态系统中多个 CPS 相应的风险。这些方法可以有效分析由异构组件组成的高度互连的 CPS\
  \ [22]]，而且与其他需要此类需求才能产生有效结果的方法相比，它们最适用于分析正在开发中的系统（其详细的操作和功能需求尚未建立）。\n\n表 2.1 和表\
  \ 2.2 描述了通过应用 DREAD 计算的每个 CPS 针对每个 STRIDE 威胁的相应风险值。表 2.1 表明，欺骗（Spoofing）和拒绝服务（Denial\
  \ of Service）在机舱和 SCC 中都是最严重的威胁。同样，表 2.2 表明，欺骗、篡改（Tampering）和拒绝服务在驾驶台上面临最高风险。篡改和信息泄露（Information\
  \ disclosure）是中等风险威胁。此外，可以为每个系统分配单一风险值，等于这些风险中的最大值；这些值显示在表 2.1 和表 2.2 的最后一行。\n\n\
  *表 2.1* 机舱和岸中心 (SCC)的网络风险\n\n*表 2.2* 驾驶台的网络风险\n\n\n\n\n\n| DREAD | 2 | 2.42 | 2.5\
  \ | 2.5 | 2.58 | 2.17 | 1.5 | 2.08 | 2.25 | 1.5 | 1.75 | 2.16 | 1.75 |\n\n## 2.4\
  \ 无人船网络安全需求\n\n由于无人船生态系统具有高度复杂性，且其组成信息物理系统（CPS）之间存在复杂的互联、依赖和相互影响，在尝试建立网络安全需求（涵盖整个生态系统以及系统中的每个单独\
  \ CPS）时，需要遵循系统化的方法。`[21]` 提出了一种结合 `eMAF` 参考架构与 `SecureTropos` 方法 `[30]` 的无人船生态系统安全需求爬取过程。该过程如图图\
  \ 2.5 所示。\n\n![Figure 2.5 安全需求爬取过程。](img/fig2.5.jpg)\n\n*图 2.5* 安全需求爬取过程。\n\n在 `[21]`\
  \ 中，还报告了将此过程应用于整个无人船生态系统以及三个最脆弱的船载 CPS（即 `AIS`、`ECDIS` 和 `GMDSS`）所产生的安全需求。这些需求被分为组：*系统特定*需求和*通用*需求。前者包括与每个单独系统相关的需求，而后者包含适用于所有三个所研究系统的需求。这些需求根据\
  \ `ISO/IEC 27001:2013` 和 `ISO/IEC 27002:2013` 标准的分类方案分类如下：\n\n### 人员资源安全：\n\n1.\
  \ 系统管理员必须经过良好培训，并熟悉系统的功能性和非功能需求（例如 `AIS` 模式和通信能力）。\n\n### 资产管理：\n\n1. 必须对数据和信号进行识别并划分保护级别；\n\
  2. 必须维护第三方组件文档、版本控制以及已发布的系统漏洞记录。\n\n### 访问控制：\n\n1. 必须执行强密码策略，规定每种凭据组合的长度和有效期（例如，登录\
  \ `ECDIS` 的密码应定期更换）；\n2. 必须通过适当的身份验证机制确保从 `SCC` 或物理方式对船载系统执行的操作具有不可否认性和可追溯性；\n3.\
  \ 系统必须在系统管理员请求或在配置的空闲时间后能够实现锁定机制；\n4. 必须指定对系统的连续登录尝试次数；\n5. 系统必须支持多因素认证；\n6. 系统必须仅接受来自授权实体、授权海事人员的输入。\n\
  \n### 密码学：\n\n1. 系统必须支持加密；\n2. 系统必须支持保护数据机密性和完整性的加密算法；\n3. 系统必须能够确定所发送数据的真实性。\n\n\
  ### 物理和环境安全：\n\n1. 系统必须受到妥善保护以防止物理损坏；\n2. 系统的安装必须防止淹水或火灾。\n\n### 运行安全：\n\n1. 船载系统必须能够在拒绝服务攻击下运行；\n\
  2. 必须确保维护过程以防止恶意入侵；\n3. 船载和岸基系统必须定期备份；\n4. 系统必须能够确定某操作是否由授权人员执行；\n5. 必须保护数据的完整性；\n\
  6. 必须保护数据的机密性；\n7. 应确保数据的新鲜性；\n8. 系统更新必须由授权实体执行；\n9. 系统不允许降级到旧软件版本。\n\n### 通信安全：\n\
  \n1. 船载系统与外部实体之间的数据交换应进行加密；\n2. 必须确保船载组件的隔离；\n3. 必须建立船载系统与外部实体之间的连接；\n4. 船载系统必须进行相互认证；\n\
  5. 必须对进出系统的流量进行监控；\n6. 系统应能够确定源自船载数据的来源；\n7. 船载系统之间的数据交换应以可以验证其真实性的方式建立；\n8. 系统必须使用传输层安全保护数据；\n\
  9. 系统应能够检测恶意包；\n10. 船载系统与外部实体之间的服务必须经过认证；\n11. 船载系统之间应具有通信冗余；\n12. 系统间通信的最大允许延迟应符合相关标准和系统需求。\n\
  \n### 系统获取、开发和维护：\n\n1. 系统开发和部署必须遵循网络安全标准；\n2. 更新过程必须防止“检查与使用时间”（TOCTOU）攻击；\n3.\
  \ 软件源必须经过认证；\n4. 船载和岸基系统必须定期进行维护；\n5. 系统的安装应考虑网络分和物理访问；\n6. 系统更新/升级必须由授权实体执行；\n\
  7. 必须确保维护过程的完整性；\n8. 系统维护必须由经过良好培训的人员执行；\n9. 配置和安装必须由授权人员执行；\n10. 船舶基础设施必须经过良好设计，并根据船舶类型妥善安装系统。\n\
  \n### 供应商关系：\n\n1. 必须采用适当机制验证来自供应商的硬件、软件和数据；\n2. 对对供应商的安全策略进行严格审查。\n\n### 信息安全事件管理：\n\
  \n\n\n\n\n1. 系统必须检测异常数量的请求（例如来自用户或外部操作者）并产生警报；\n2. 在发生 GMDSS 干扰等安全事件期间，应维持系统的功能性和非功能需求；\n\
  3. 检测到系统异常时，必须通知 SCC。\n\n### 信息安全连续性方面：\n1. 必须确保系统运行的连续性；\n2. 船上或岸上系统必须能够使用替代电源；\n\
  3. 系统必须能够 24/7 运行；\n4. 应考虑到无人船及其运行的复杂性，安装冗余系统。\n\n### 合规性：\n1. 必须获得符合相关法律法规要求的正式认证。\n\
  \n信息技术与运营技术的日益融合以及互联物理系统（CPS）的激增，带来了识别协调、一致且不冲突的安全与安全需求的挑战。一种针对系统生命周期设计阶段 CPS 的集成安全与安全工程方法被命名为\
  \ `SafeSec`，并已应用于无人船上最脆弱的 CPS [27]]。\n\n## 2.5 处理无人船的网络风险\n\n一种符合 ISO/IEC 27005\
  \ 标准的无人船风险管理方法已被提出 [24]]，并在图 2.6 中所示，其中规定了六个子过程及其输入输出。环境分析子过程在 [26]]完成；威胁分析子过程在\
  \ [25]]完成；安全需求爬取子过程在 [21]]完成；网络风险评估过程和控制选择子过程在 [24]]完成。安全架构设计过程仍是未来工作的课题。\n\n![图\
  \ 2.6 安全控制选择过程](img/fig2.6.jpg)\n\n*图 2.6 安全控制选择过程*\n\n许多来源提供了可以进行选择的安全控制集（例如 [10,\
  \ 19, 18]]）。这些来源均属于信息系统而非 CPS；因此它们在无人船上的适用性有限。然而，《NIST 工业控制（ICS）安全指南》的附录 G [40]]提供了\
  \ `ICS 覆盖层`，它是对控制和控制基线的部分剪裁 [19, 18]]，增加了针对 ICS 的特定补充指导。该来源被用于 [24]] 根据以下标准集选择控制（该标准改编自\
  \ [15]]）：\n\n* C1: 需要保护的 CPS 种类；C2: 需要保护的安全方面。\n* C3: 需要消除的威胁。\n* C4: 潜在的控制方案。\n\
  * C5: 根据重要性待保护的 CPS 价值。这已在攻击路径分析过程中进行了评估 [23]]。\n* C6: 威胁发生的概率。这源于在风险评估过程中执行的威胁分析\
  \ [24]]。\n* C7: 替代控制提供的风险覆盖率。\n\n例如，针对 AIS 欺骗威胁的控制选择标准值如下：\n\n* C1: 导航类 CPS；\n*\
  \ C2: 完整性和可用性：这些源于在 [21]]中建立的安全需求。\n* C3: 欺骗/篡改/拒绝服务（DoS）：这些源于在 [25]]中执行的威胁分析结果。\n\
  * C4: 加密/防篡。\n* C5: 高：这已在攻击路径分析过程中进行了评估 [23]]。\n* C6: 极有可能：这源于在风险评估过程中执行的威胁分析 [24]]。\n\
  * C7: 低：已有替代控制并导致了选择 `IA-3` 类别 [40]]。\n\n属于该类别的控制示例是建立和使用设备身份验证基础设施，例如在 [14, 13]]中提出的。\n\
  \n将上述过程应用于无人船上三个脆弱的系统（AIS、ECDIS 和 GMDSS），结果是确定了每个系统的基线安全控制。某些控制（设备识别与身份验证 `IA-3`、加密保护\
  \ `SC-13`、拒绝服务保护 `SC-5`、物理访问控制 `PE-3` 以及内部系统连接 `CA-9`）建议适用于所有系统，而另一些建议适用于两个或一个系统。在安全架构设计阶段，需要对所有系统的控制进行重新考虑、整合，并检查其在特定环境中的适用性、对指南的等。\n\
  \n正如典型的风险处理策略，应用安全控制会修改（减少）风险而非消除风险。为了完成风险处理过程，需要评估所应用控制的有效性，考虑特定环境和组织背景下的剩余风险，并可能重复该过程直到剩余风险低于可接受水平。这一过程在无人船整体安全架构确定后可以有效执行；因此，这也是未来工作中可能的项目。\n\
  \nCPS 的一个独特特征是能够动态互连，有时会超出最初预定的范围。这通常会导致突发性的、即不可预测的行为。为了在这种情况下有效保护 CPS，建议进行网络风险的动态评估。[24]]中的方法无法捕捉这种行为。然而，可以为了此目的进行扩展，遵循\
  \ [22]]所采用的路线。\n\n\n\n\n\n无人船船队在海洋上航行的时代已近在咫尺。尽管这种发展将对经济产生巨大影响，但同样需要承认的是，它可能会释放出巨大的网络攻击潜力。考虑到高效且有效的网络保护不能仅仅通过修补补丁来实现，而是需要开发“内生安全”（secure-by-design）的系统，因此，为无人船设计安全架构的重要性变得变得显而易见。在定义出这种具有实际应用价值且证明安全的架构之前，需要回答许多问题并解决许多难题。在本章中，我们概述了与无人船概念相关的网络安全问题，并展示了研究结果，希望能有助于解决这些问题。然而，在实现目标之前，还需要大量的研究。\n\
