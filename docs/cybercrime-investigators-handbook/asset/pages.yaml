- pgno: 279
  md: '# Conclusion


    account for their actions may be a very difficult and complex operation requiring
    a significant investment in time and resources, regardless of whether a law enforcement
    or civilian investigator is tasked to work the case. Most of the luck and advantage
    is with the cybercriminal; however, the investigator will find many breadcrumbs
    that reveal their true identity. These breadcrumbs originate from the crime scene
    and many a cybercriminal have been surprised to find the knock on their front
    door is from law enforcement seeking their arrest, especially when they believed
    they were 100 percent anonymous online.


    Despite the perception, not all cybercriminals are located in international jurisdictions,
    hiding behind many layers of technology. Many are within our organizations, or
    have links to them, such as being a business competitor. These people are accessible
    within your jurisdiction and may be held accountable. This is where your scene
    examination and evidence management is so important, as your investigation methodologies
    will be examined in depth in the courtroom.


    As technology develops, more evidence becomes available to criminal and civil
    investigators. Locating evidence is restricted only by the imagination of the
    investigator, as increasingly interconnected world collects more and more data
    on our activities. The Internet of Things (IoT) can make the cybercriminal''s
    job easier, but it can also be used to your advantage as you investigate offences
    where you suspect the criminal physically has been at crime scene.


    As an investigator, your job has more complex: however, there is significantly
    more evidence available to progress your investigations if you know where to look
    for it and what devices to do and the evidence they may contain. Incorporating
    this evidence into your investigation is a skill you will refine throughout your
    career, with positive results achieved, honest mistakes learned, and a higher-skilled
    investigator emerging.


    The digital evidence you obtain may be very volatile, and the skills you learn
    and practice will be crucial in many investigations. As a digital/cyber investigator,
    you will be of value to many forms of investigations, not only involving cyber
    or internal fraud. Whenever an offense takes place, in today''s society there
    is a very strong expectation that digital evidence will be involved in the investigation.
    For example, a homicide scene at a home with many devices may reveal a lot to
    investigators about the actions leading to the deceased''s death and who is culpable.


    As you investigate the many forms of cybercrime, you will have your wins and you
    will have investigations where you cannot identify a suspect. On some occasions,
    your investigation will work perfectly using the methodology you'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'have developed through your experience, and on other occasions you will use
    the same methodology and find you do not get off first base. This is the nature
    of conducting any form of investigation and the law enforcement officer who has
    been working cases will under understand the frustration of doing everything right
    and not solving the case as they wish.


    Each investigation is an opportunity to learn and develop your skills and share
