- pgno: 232
  md: '# # CHAPTER THIRTEEN


    # ## Identifying, Seizing, and Preserving Evidence from Internet of Things Devices


    S TECHNOLOGY HAS developed, its role in our lives has become intrusive. With the
    new generation of technology being introduced into our homes, workplaces, community
    areas, and other spaces, is fast reaching the stage where there is little the
    connected person can do that is not recorded on a digital device somewhere. While
    a separate discussion can be held on the privacy and security relevance of technology
    monitoring and creating DNA personality profiles on individuals, this chapter
    places a focus on how the investigator can use this technology to progress their
    investigation. This new generation of connected devices is called the "Internet
    of Things" and is becoming well established in society and our lives.


    # ## WHAT IS THE INTERNET OF THINGS?


    The Internet of Things (IoT) refers to the billions of devices that are connected
    to the Internet. Although we are familiar with computers and phones being connected,
    now we have dryers, refrigerators, thermostats, and car components that are connected,
    as well as smart homes and buildings. While many IoT devices may not initially
    be seen as being relevant to the cybercrime'
  merge: -1
  img_proc: true
- pgno: 233
  md: '# Preserving Evidence from Internet of Things Devices


    investigator, with a bit of lateral thinking they can become highly relevant and
    provide previously unattainable evidence.


    Examples of IoT devices that may be relevant to the investigator (excluding traditional
    devices such as computers) include sensors in buildings, swipe-card access devices,
    light sensors; Bluetooth-enabled motor vehicle peripherals, remote security cameras,
    and more. Each of these and many more may be relevant to understanding how a security
    breach occurred and by placing a particular person at a particular location at
    the specific point in time that the alleged offense occurred. The scope of the
    IoT devices that may be used to assist the investigator is limited only by their
    understanding of digital devices, or may have been, at a crime scene.


    The idea with IoT devices is to understand what the device is doing and what it
    is capturing. The home assistant will capture a lot of data that may provide evidence
    to the criminal investigator as to who was at the scene of the homicide. The smart
    building may provide evidence to the cybercrime investigator as to who backed
    the keyboard of a compromised computer at 2:00 p.m. when corporate Intellectual
    Property (IP) was copied.


    This chapter seeks expand the cyber investigator''s thinking so that the IoT environment
    is incorporated into the investigation plan, especially when a suspect is an internal
    employee of a business or a person who had physical access (approved or not) to
    the cybercrime scene.


    # WHAT IS THE RELEVANCE TO YOUR INVESTIGATION?


    Digital evidence is everywhere, including in wearable technology such as Internet-connected
    watches. Everything that captures data tells a portion of a story: even if it
    is a seemingly unrelated piece of data, it may provide assistance in the future.


    Computers record what they observe in log files, and while they may tell an investigator
    that IP was taken by a person in an office using a specific device, knowing who
    was at the keyboard of that device may be difficult to work out, especially if
    it is a shared device with a shared password. However, evidence from the IoT may
    provide a few clues as to who was near the device at the time the IP was taken.
    A very simple example: while five people may have access to the suspect device
    used to copy IP onto a USB, devices within a smart room may identify that three
    of these people were not near the device at the time in question, leaving two
    suspects.'
  merge: -1
  img_proc: true
- pgno: 234
  md: As the cybercrime investigator, expanding your thinking to include IoT places
    you one step ahead of the criminal intent to the victim entity. Often they will
    be so focused on committing the crime and obtaining their data that they will
    be unaware that their devices are leaving digital fingerprints behind or recording
    that they are at a location that in the future they intend to deny
  merge: -1
  img_proc: true
- pgno: 235
  md: 'being anywhere near at the time in question. They will also be largely unaware
    of the many IoT devices within the workplace, which will be recording evidence
    of their activities and locations.


    # WHERE IS YOUR INTERNET OF THINGS DIGITAL EVIDENCE LOCATED?


    With cloud evidence, the investigator should understand where IoT device stores
    its evidence. Unlike the cloud, physical devices can be accessed, triaged, and
    examined in the traditional manner. If the logs of the IoT device are not stored
    in the device, inquiries may be made of the system administrator or device manufacturer
    to locate them. Reading the device''s End User Licence Agreement (EULA) may also
    provide some direction.


    In summary, IoT evidence may be stored in the device, or on a remote server operated
    by the IoT device manufacturer.


    # LAWFUL SEIZURE OF INTERNET OF THINGS EVIDENCE


    As with all evidence, seizure must be lawful. A complainant in most instances,
    will be able to provide authority in instances but must be aware of the value
    of IoT-connected devices when petitioning a court for a search warrant or civil
    court order. If it is likely to provide evidence and examination can be justified
    by the court official, explain its relevance and seek authority to seize and examine
    the device.


    The key point of this chapter is to look broadly when seeking evidence in a digital
    investigation. Society becomes connected digital fingerprints are being left in
    numerous locations, providing evidence toward identifying a suspect. Many IoT
    devices have little or no-security which can become a very valuable attack vector
    for the cybercriminal, leading to network intrusions through unexpected devices—such
    as smoke detectors, webcams, refrigerators, and televisions—which are connected
    to a network that is unpatched and not secure.


    As the lack of security provides opportunity to the cyber- or internal criminal,
    so it also provides opportunity to the investigator, as the breadcrumbs of evidence
    these devices will leave in and around the criminal scene will provide the opportunity
    to uniquely identify a person and place them at the crime scene at the time of
    the activity under investigation.'
