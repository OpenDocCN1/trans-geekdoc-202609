- pgno: 112
  md: 'The scene property receipt is a very important document, as it is a record
    of what you have taken as agreed to by the property owner/custodian. The receipt
    may believe in itself, and a copy is provided showing not only what is being taken
    but by whom and where it is to be secured. Note also on the top-right corner of
    the receipt is a receipt number, which assists in the credibility of the document.


    # AVAILABILITY AND MANAGEMENT OF EVIDENCE


    This section identifies and discusses examples of the forms of digital evidence
    that exist. There is no definitive list covering every possible example of digital
    evidence available, as technology evolves daily; however, this section will provide
    investigators with an understanding of what technology is included in crime scenes
    and may hold evidence.


    Digital evidence may be defined as:


    Any data stored or transmitted using a computer that supports or refutes a theory
    of how an offence occurred or that critical elements of the offense such as intent
    or alibi.¹


    This is a wide-ranging definition; however, it is very accurate as the technology
    available today will be very different from that when Casey made this statement.
    Casey also states that digital evidence must be of probative value and collected
    in a manner acceptable to a court of law.¹


    The evidence you are seeking must be relevant, reliable, and sufficient. That
    is, the evidence must be relevant in proving ingredients of the matter being investigated,
    reliable in that it purports itself to be, and sufficient in that the evidence
    must allow the matter being investigated to be fully investigated.²


    With technology evolving on a daily basis, the forms of digital evidence the investigator
    may consider are restricted only by the limits of their imagination. Digital evidence
    may come in traditional forms, with computers. USB drives, routers, switches and
    phones, and wearable devices, such as iWatches. Smart devices reside in home and
    on business premises and may assist in informing the investigator as to who was
    in a specific location or conducting the defining activities at the time of the
    suspected offenses. The Internet of Things (IoT) has created numerous technology
    items in our lives, and home devices gather data, which may progress your investigation.'
  merge: -1
  img_proc: true
- pgno: 113
  md: '# Technical Items


    For technological evidence, look around your scene and record all the technology
    you can see. Understand what it is for and question yourself to under-stand what
    data it is collecting and where it may reside. The data may be in the device itself,
    on a local server, or in cloud-computing databases. Understanding the technology
    you see and what it does may lead you to new avenues of inquiry or to finding
    definitive evidence that links a suspect to a specific location at a time they
    denied being there.


    For example, a suspect may be denying it at the time data was downloaded from
    a computer to an external hard drive. An examination of the router in the office
    may show, but at that specific time Media Access Control (MAC) address of the
    suspect''s mobile phone was recorded leaving its unique identifier as identified
    to connect to the router. That means that the suspect''s phone was present in
    the room at the time of the data theft, while not 100 percent conclusive, means
    that the suspect was there well, placing you in a strong position as your suspect
    list is narrowed down and strong evidence for a follow-up interview is built.


    The lists that provide examples of technical, nontechnical, and physical evidence
    that may be used to advance an investigation. By the nature of particular items,
    some may appear on more than one. These lists are not exhaustive and the development
    of new technologies will expand the lists. The explanations provided are to give
    the investigator an understanding of the potential value of each item of evidence.


    # TECHNICAL ITEMS


    +   Event logs. These logs are like a CCTV camera recording what happens at a
    scene during a crime. The logs that were recorded and are accessible will tell
    you what happened in the system, when it happened, in what order, and by whom.
    Refer to Chapter 11 for more information on event logs and the other forms of
    logs available to assist in your investigation. While a skilled criminal may modify
    logs to cover their activity, this may also provide evidence of intent and the
    criminal''s skill set.


    +   Application whitelisting schedule. Application whitelisting is a service available
    from the system administrator that allows only preapproved programs to run on
    a system. Its purpose is to ensure that programs that have security vulnerabilities
    or that leak data are not to run on the system and create new security vulnerabilities.
    If an application is on this list without the approval of the system administrator,
    then the criminal may have'
  merge: -1
  img_proc: true
- pgno: 114
  md: '# Investigating the Cybercrime Scene


    been able to gain administrator privileges, which is valuable evidence in its
    own right.


    +   - Antivirus logs. Ant Virus (AV) logs provide information on the operation
    of the AV system. Evidence available shows when the AV application was installed,
    updated, when servers were operated, and their results.


    +   - Proxy logs. A proxy server acts as an intermediary between an endpoint device,
    such as a networked computer, and another server, such as a web server. It records
    the activity from the endpoint device and may possess evidence of interactions
    between the endpoint device and an external device, such as the transfer of files.


    +   - Virtual private network logs. A Virtual Private Network (VPN) provides an
    encrypted path from the local device or network to the Internet, where the details
    of the connection are not recorded on the normal log files. Look for who initiated
    the VPN session, time of connection, where the VPN service connected to, how long
    the connection was open, and whether the time frame for the connection coincides
    with the time frame for the event you are investigating. A suspect who uses a
    VPN may have evidence of it located on their device, in which case you can compare
    connection times from the suspect''s device to those on the device or network
    compromised.


    In some instances you may be able to contact with the VPN service and obtain log
    records from the suspect''s account. This is not an option in all cases, as many
    VPN services do not record client logs because of confidentiality or host their
    services in locations where foreign court orders are not honored. However, like
    all investigation options, if you do not, you will not find out, and in this instance,
    making the inquiry progresses thorough.


    +   - Domain name server logs. Domain Name Server (DNS) logs show your computer
    connects to when seeking the address of websites searched for on the Internet.
    If the computer is going to a regularly visited website, it does not connect to
    a DNS as it will already have the address of the site it is. However, if the user
    is looking for a website previously visited, the computer will connect to the
    designated DNS server and locate the address of the website, which is then sent
    back to the client''s computer, who then commences to make a connection with the
    website they wish to contact. These logs are particularly useful when seeking
    connection pathways and associated times for websites to create data taken from
    a complainant.


    +   - Dynamic Host Configuration Protocol logs. Dynamic Host Configuration Protocol
    (DHCP) is the process by which Internet addresses'
  merge: -1
