  md: 'have committed a civil or criminal offense. These rights vary according to
    jurisdictions, however several of the most common ones are:


    +   - The right to speak to a lawyer and/or support person and have them present
    during the interview

    - The right to silence and/or not to incriminate themselves

    - The right to speak to a union representative and have them present during an
    interview in a civil investigation

    - The right to fully understand what the interview is about and what they are
    being accused of

    - The right to decline be interviewed unless compelled by local legislation

    - The right for the interview to be electronically recorded and to be provided
    a copy of the recording (check local laws on electronically recording interviews)

    - The right to terminate the interview part of the way through desired

    - The right to the interview not being oppressive

    - The right to speak to a translator if the suspect cannot communicate in the
    language spoken by the interviewer

    - The possible to have the home country''s embassy/consulate alerted should the
    suspect be a national of a foreign country (this requirement may exist in the
    instance of a law enforcement investigator)


    Failure to provide or any of the safeguards a jurisdiction demands means that
    the interview and all the evidence from it may be excluded when the matter goes
    before the court or that its value may be diminished. In turn will damage your
    reputation among your colleagues and the court, especially should you lose the
    case and your company is liable for costs.


    # WITNESS INTERVIEWS


    The interview is different from that of the suspect; however, many of the same
    courtesies apply. In most cases the witness is there voluntarily and is keen to
    help. You will find some instances where the witness is more evasive than a suspect
    and extracting information from them is nearly impossible. This will be because
    of reasons important to them, such as be the case if you are interviewing a manager
    whose employee has committed a large-scale fraud against the company. While the
    manager is not suspected of being involved, they are scared for their career,
    blamed for being negligent, and losing their job.'
  merge: -1
  img_proc: true
- pgno: 253
  md: '# Preparing for an Interview 247


    For example, I interviewed a middle manager of a large organization whose member
    of their staff had allegedly fraudulently obtained in excess of $15 million. The
    manager was highly evasive and obstructive in the witness interview, despite being
    told on many occasions that they were not a suspect and were only viewed as a
    witness providing background on the suspect and their duties.


    This manager was not trying to be disruptive, but their interview goal was to
    extricate themselves from the investigation, as they were concerned the interview
    would provide evidence of their negligence as a manager, which would have been
    used by their supervisors for dismissal. This would have meant losing their job
    and having to remove children from their private school, so in their mind avoiding
    dismissal was a higher priority than the investigation.


    Alternatively, witnesses may try to be very helpful to an investigation, and this
    is to be appreciated. However, sometimes evidence may be inadvertently embellished
    by the witness. This is not a measure of their dishonesty, but an unconscious
    attempt to provide as much information as the investigation possible. Their evidence
    must be restricted to the events within their knowledge and not hearsay, which
    includes telling of events they have heard from other parties (not the suspect).
    Information the suspect told them themselves may be acceptable evidence, but stories
    they''ve heard in the lunchroom most likely not be.


    Finally, think about the order in which you interview people. One strategy is
    to build as much understanding as possible about events from witnesses before
    you approach a suspect. Your circumstances may dictate the order of interviews
    due to availability, suspects being nearby, or a lack of knowledge about events
    and the need to build a deep understanding of events and the environment.


    # PREPARING FOR AN INTERVIEW


    Regardless of whether an interview is of a suspect or witness, preparing for an
    interview saves time and embarrassment later. Having a well-prepared interview
    room with experienced interviewers greeting the subject projects a professional
    image.


    Whether you are interviewing a witness or suspect, the success of an interview
    is in the planning. Creating an environment that allows the person being interviewed
    to provide the information during a more engaging process'
  merge: -1
  img_proc: true
- pgno: 254
  md: 'is preferable to the traditional police interview where the questions are asked
    by the police officer and answered by the interviewee in the order of interest
    to the police officer. What is important to the police officer conducting the
    interview may be very different from information the interviewee wants to give
    in the first place.


    When interviewing members of the organization that is the victim of the cyber
    event, understand the business and the role of the person being interviewed before
    the interview begins. This not saves time, it shows the interviewee that you are
    briefed on your topic and do not need to waste valuable time on unnecessary basics.
    Even so, asking some basic questions of the interviewee allows them to work their
    way into the interview with some simple answers unrelated to the mechanics of
    the event. Some examples include:


    +   - How long has the business been in existence?

    - How long have you been with the organization?

    - What is your role?


    Along with the legislated safeguards a particular jurisdiction provides, there
    are other matters that a skilled interviewer will attend to. Examples include:


    +   - Plan for the safety of yourself, other persons present, and the interviewee.

    - Plan the interview for a mutually acceptable time should circumstances allow.

    - Have the interview in a quiet place where there is no background noise or to
    be interrupted by people walking into an office. Background noise could come from
    a lunchroom next door or a noisy air conditioner in the room itself. Alternatively,
    depending on the circumstances you may need to electronically record a preliminary
    interview with a witness at the side of a road with traffic driving past—which
    although not desirable, may be necessary due to the unique circumstances of the
    case.

    - Build a rapport with the person to be interviewed. Learn their background and
    interests to encourage a friendly conversation before the interview begins in
    order to break down barriers and settle nerves.

    - Be careful what you tell a witness about a case. Do not make any negative comments
    about the suspect, as this will likely be repeated to other witnesses or may even
    be recorded by a witness who wants their own electronic copy of the interview.'
  merge: -1
  img_proc: true
