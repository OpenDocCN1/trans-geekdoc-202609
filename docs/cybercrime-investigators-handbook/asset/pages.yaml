  md: '# # 14

    CHAPTER FOURTEEN

    # Open Source Evidence


    SOURCE EVIDENCE is that which may be captured online from services such as social
    media, government and corporate databases, and news sites. There are numerous
    categories of open source material available to assist an investigation and specialist
    investigators exist who do nothing but seek open source material for their clients.
    In essence, the Internet is their workspace.


    # ## THE VALUE OF OPEN SOURCE EVIDENCE


    The value of open source material is that it is freely available so that obtaining
    it rarely requires a search warrant. The most commonly searched open source sites
