- pgno: 32
  md: '# Drive-By Downloads of Malicious Software


    An effective form of cyber-attack is the taking control of the website of a legitimate
    company, installing malicious software, and waiting for visitors to the site to
    unknowingly downloading the malicious software. As it is a reputable site, the
    visitors will not view the site as high risk, raising the prospects of more success
    for the attacker.


    # Investigator Considerations


    Investigating this form of cybercrime involves gaining an understanding of the
    technical vulnerabilities of the site exploited. Look to see where the repository
    of the data has been sent, which is usually a website controlled by the attacker.
    As noted precisely, discussions with cyber security companies (such as Sophos
    and Symantec) may provide you with information as the technical components of
    the attack and the leads you may generate from them.


    # Interfering with Access to a Network


    Denial of Service (DoS) and Distributed Denial of Service (DDoS) attacks are technical
    attacks to overload the website and server, restricting customers and staff from
    accessing the Internet.


    Ex-employees have been known to cause damage to networks after leaving their employment
    by loading malicious software onto the system, installing backdoor pathways into
    the system to allow access once their legitimate access has been removed, or deleting
    valuable files.


    # Investigator Considerations


    Reasons for a DoS or DDoS attack may be as simple as an extortion attempt, political
    motivation (as a party holds a personal grudge against the target), or business
    reputational damage, previously discussed.


    Speaking to the complainant may provide some valuable information, especially
    if there has been communication with the attacker. In these cases, there may have
    been a demand for a ransom to be paid to a virtual currency account or a demand
    to modify a stated company philosophy.


    # Ransomware


    Here, the attacker encrypts the hard drives of the devices they can access and
    also encrypts the backups, if accessible. If the victim has no offline backups,'
