  md: '# CYBERCRIME CASE STUDY II


    A woman met a person on the Internet through a dating site and over the following
    months a relationship developed. She believed she was in a legitimate online relationship
    and that there was to a future with her new partner once he made his way to Australia.
    He represented himself as an engineer who needed to finalize his work overseas
    before returning to Australia.


    To assist him with his finances, the woman sent sums of money to help pay for
    his living expenses, business fees, and personal tax charges he said had to be
    paid before he left the country. Over the course of six months she forwarded approximately
    $250,000 to him, which was to be paid back once he made it to Australia with the
    proceeds of his venture.


    As is the case with this form of fraud, there is always delay, another request
    for money; and another problem that can only be solved by the victim sending money
    as a “final payment” prior to the journey being undertaken and the couple meeting
    up. The victim stated that she no longer had access to money, as she sent all
    the cash she had, fully mortgaged her home, borrowed what she could from friends,
    sold her car, obtained money from her pension fund in a hardship claim. Despite
    this, there were further requests for money from her online partner.


    At this time, she was desperate to keep the relationship alive and meet her partner.
    She was also desperate to recover the money she lent him. She was also a respected
    accounting manager in a business that had a significant cash flow.


    In desperation, she decided to “borrow” a sum of money from her employer with
    the internal promise to repay it as soon as her partner arrived with money. She
    forwarded the money and was met with further requests for money and regular commitments
    of love and the future they would have together. Realizing that no one had noticed
    the $10,000 she''d borrowed, she continued borrowing and sending money until she
    had obtained in excess of $350,000 from her employer.


    When the fraud was noticed, she left the company, traveled interstate, and attempted
    to restart her life. She was located, prosecuted, and sentenced to five years’
    imprisonment. No reparation could be made.


    People becoming victims in online relationship frauds are a very common occurrence
    and the financial and emotional toll on the victims can be extreme. They have
    been defrauded financially and emotionally and some times they do not know which
    is worse.'
