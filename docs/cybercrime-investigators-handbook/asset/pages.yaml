  md: '# Cybercrime Offenses


    they are required to pay a ransom to the attacker to regain access to their data.
    This attack may also include the theft of data from the device or network before
    the encryption process completes.


    # Investigator Considerations


    As previously discussed, there will be a form of communication from the suspect.
    Usually this is in the form of an email or note left on the victim''s computer.
    Identify the virtual currency account that payment is to be made and identify
    the volume of payments being made to it. In the case of Bitcoin, you can use Block
    Explorer on the Blockchain site (https://www.blockchain.com/explorer) to input
    the address where the Bitcoin payment is to be made to gain an understanding of
    the magnitude of the crime and whether it is a random attack or specifically targeted.


    # Phishing Attacks and Money Laundering


    Fraudulent emails are sent to induce people to log on to a site they are member
    of (such as a bank, credit card, or finance company) by using their names and
    passwords. The link included in the email is to a site the criminal has created,
    which is an exact image of the legitimate site the potential victim is familiar
    with.


    Once the account owner enters their user name and password, the criminal has access
    to the client''s account. The difficulty for the cybercriminal is if the victim
    has two-factor authentication on their account; then they will have to develop
    a further strategy to defeat this level of security.


    The next stage for the cybercriminal once they have direct access to the account
    is to remove the funds. This may present a further logistical hurdle if they are
    in a different country from their victim and they cannot directly transfer the
    proceeds of their crime overseas.


    The experienced cybercriminal may monitor the account for several weeks to get
    a full understanding of how money flows through the account. Examples of activities
    include when the victim''s pay goes into their account and when mortgages and
    utilities are paid, effectively mapping the flow of money and when to identify
    in a pay cycle there the most money in the account.


    Some financial institutions have daily limits on transfers of money from an account.
    To maximize the financial return cybercriminals will transfer the balance of the
    daily available funds at 23:59 hours and then the new daily balance at 00:01 hours
    the following day.'
