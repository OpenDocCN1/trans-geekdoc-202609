- pgno: 281
  md: '# Glossary


    HIS GLOSSARY provides a general understanding of technical terms located throughout
    this book. It is to provide a working understanding only and does not provide
    a detailed analysis of the terms listed.


    **APT: advanced persistent threat** A compromise of a device or network, usually
    by a highly skilled attacker, group, or nation state. Once the attack is successful
    and the attackers are within the device/network, they navigate to the data they
    are looking to extract. Many APT attackers stay within a device/network for months,
    collecting new data as it is created.


    **ARP: Address Resolution Protocol** The ARP is used within a network to relate
    an internal IP address to a media access control (MAC) address. A MAC address
    uniquely identifies a device on a network. The MAC address can be located on the
    NIC, which is the physical device allowing communication between one and others.
    A device also has an internal IP address, which is known as the subnet address.
    The ARP table correlates the MAC and IP addresses and sits within the router that
    the device is connected to.


    **authentication server** A computer server that determines whether a person or
    application is who it represents to be when trying to access a computer network.


    **AV: antivirus** Software detects and eliminates viruses. **botnet** A collection
    of compromised devices used to commit a distributed denial of service (DoS) attack.
    A botnet may be made up of thousands of compromised devices. Compromised devices
    can include desktop computers, laptops, and any of a multitude of IoT devices.


    **BYOD: bring your own device** A device belonging to an employee on which the
    employee has been authorized to perform company work, and which has access to
    the corporate network and data.


    **CEM: child exploitation material** Pornographic images of children.'
  merge: -1
  img_proc: true
- pgno: 282
  md: '# Glossary


    **CERT: computer emergency response team** CERT teams have different roles in
    each country; however generally provide education and training, information sharing
    (indicators of compromise, cyber security briefings), linkage between Government
    and industry, international collaboration and direct incident response support
    to government as well as critical infrastructure. Some CERT teams provide services
    to industry clients.


    **CSP: cloud service provider** A business that provides cloud-computing services
    to customers. Examples include Amazon Web Services and Microsoft Azure.


    **DHCP: Dynamic Host Configuration Protocol** DHCP is the method by which server
    dynamically assigns IP addresses to computers on its network; it takes the place
    of a system administrator assigning addresses manually.


    **DMZ: demilitarized zone** A layer of securing the Internet that provides a first
    line of defense to a local area network against cyber-attacks.


    **DNS: domain name server** A DNS is the location your computer sends a request
    when attempting to locate the address of a computer on the Internet you have not
    previously visited. Your computer asks the DNS server the address and is not the
    location. Your computer directs its request to the site you visit. In most cases
    your DNS is also your Internet service provider.


    **DDoS: distributed denial of service** A DDoS is a multitude of computers that
    attack a device with the intention of damaging the capacity of the target device
    to function and be accessible to other computers.


    **DoS: denial of service** ADoS is a computer attack from a device with intention
    of damaging the capacity of the target device to function and be accessible to
    other computers.


    **Faraday bag** A designed to stop external communication channels from reaching
    the devices inside. A Faraday bag may be used to store a cell phone in order to
    prevent a suspect from remotely logging into the device and deleting your evidence.


    **FTP: File Transfer Protocol** A protocol for transferring files from one platform
    to another, for example, from a laptop computer to a USB drive.


    **GDPR: General Data Protection Regulation** GDPR is European Union legislation
    covering security and response in a breach of personally identifiable information
    of citizens of the European Union.


    **hash** A hash algorithm makes a mathematical compilation of data and produces
    a specified output. The value returned is a unique number, so if you change a
    single character in the data being subject to the hash process, you'
  merge: -1
  img_proc: true
- pgno: 283
  md: 'will get a different result. For example, the hash value for the word “cyber-crime”
    is 507C9BFA2890047DE24226C755ECDE. However, if we add another character to the
    word—for example, change it to “cybercrime”—the hash value becomes FF5D162B91779BD2897F27792E1A2CC,
    using one of the hash protocols available.


    A hash value is used to validate the authenticity of the evidence you have secured
    that has its integrity and has not been manipulated, as if one character is changed
    in the source data, the output changes.


    hypervisor The hypervisor is software or a device that operates a virtual machine’s
    operating systems.


    IaaS infrastructure as a service A form of cloud computing where the CSP provides
    the basic infrastructure and the client providers operating the system and applications.
    An example of IaaS is Amazon EC2.


    IDS intrusion detection system Monitors a network for activity that may harm it
    and reports it for review and possible action.


    IoT: Internet of Things The collective term for the multitude of devices connected
    to the Internet.


    IP: intellectual property Data has been created by an entity that is unique to
    it and has value.


    IP: Internet protocol [address] A unique identifier for an ISP account. The ISP
    assigns an IP address to their client for a fixed or dynamic period of time. When
    you trace an IP address, you are generally tracing it to the account at the ISP.


    IPS: intrusion prevention system Monitors a network for activity that may harm
    it and has the capacity to respond automatically to threats.


    IR: incident response Action involved in responding to a cyber event.


    ISP: Internet service provider Provides a client access to the Internet. May also
    act as the DNS server.


    IT: information technology A very general descriptor for the many forms of technology
    in our society.


    LEA: law enforcement agency The police or an associated agency involved in investigating
    breaches of the law.


    MAC: media access control [address] A unique identifier for a device attempting
    to access network resources. The MAC address is resident on the physical network
    interface card (NIC) within a device. The device may have one unique MAC address
    for Ethernet access and a separate for wireless access.'
  merge: -1
  img_proc: true
- pgno: 284
  md: 'MLAT: mutual legal assistance treaty An international treaty where law enforcement
    agencies provide assistance to each other upon request from fellow- treaty members.


    NIC: network interface card An NIC is a physical body within a computer that facilitates
    access to a network. A device may have separate NICs for Ethernet and wireless
    connections.


    NIST: National Institute of Standards and Technology The NIST is an agency of
    the United States Department of Commerce.


    OS: operating system An operating system is a computer program that allows a physical
    device to operate and interface with the multitude attached to it. Common operating
    systems include Microsoft Windows 10 and Apple Mojave.


    PaaS: platform as a service A form of cloud computing where the CSP provides basic
    infrastructure and tools required for application development. An example of PaaS
    is Google''s App Engine.


    PII: personally identifying information Specific identifying data about a individual,
    such as full name, address, Social Security number, and date of birth.


    port A location in a computer where data travels to and from. Ports specific to
    the application using them; for example, port 80 is used for web traffic and 25
    is for email traffic.


    proxy server A computer server whose function is to receive requests from network
    devices seeking resources from other networked devices. Examples include web and
    email servers.


    RAID: Redundant Array of Independent Disks [system] Data is stored across a series
    of drives in the system to increase redundancy and performance quality.


    RAM: random access memory Stores data and code as it is being used by the device
    will not have to direct every instruction to the operating system and specific
    applications within the device.


    SaaS: software as a service A form of cloud computing where the CSP provides basic
    infrastructure as well as the operating system and applications chosen by the
    user. The user has little to control over a SaaS system, as they have contracted
    with the CSP to provide and manage the services. An example of SaaS is Microsoft''s
    Office 365.


    SANS Institute The SANS Institute provides high-quality education and training
    to security professionals across a wide range of IT disciplines.


    shadow IT Applications and online services installed on a device/network without
    the authority of the system''s security administrators. Examples'
  merge: -1
  img_proc: true
- pgno: 285
  md: 'include cloud-computing services that users operate to assist them when working
    outside of the office when they do not have VPN access.


    **SIEM: security information and event management** SIEM software provides security
    information and event management for real-time analysis of potential threats to
    a network. It is an integrated system that gathers data from multiple sources
    and provides alerts about potential security violations.


    **subnet** A subnet is the division in an IP address providing two or more distinct
    networks within that IP address. It is used in domestic and corporate environments
    with subnets communicating with each other through routers on that internal network.
    For example, there may be separate subnets for the human resources, finance, and
    research departments.


    **vulnerability management software** The process of identifying and correcting
    vulnerabilities within an operating system or application.


    **zero-day exploit** A new piece of computer malware not known to security vendors,
    operating systems, and applications.'
  merge: -1
  img_proc: true
