- pgno: 131
  md: '# Scene Investigation


    the evidence number the scene search locates. This assists in ensuring that the
    minimum number of people have access to exhibits and that they are appointed to
    be responsible for maintaining their integrity.


    Once the decision has been made to seize an exhibit, take a photograph of it in
    situ, so that years later you can recall exactly what the scene looked like and
    where that specific piece of evidence was located if necessary. Place a label
    on the exhibit recording the data, time of seizure, investigation identifier,
    person locating, and person seizing. Attaching an exhibit running sheet to the
    exhibit will help maintain the chain of custody.


    The running sheet may also record:


    +   - A unique identifier, such as a model and serial number. This can be linked
    to the item number on the property receipt register issued at the scene when the
    exhibit was first seized.


    +   - Who accessed the exhibit, and the time and location at which it was found
    and seized.


    +   - Who had custody of the exhibit throughout the time it has been held.


    +   - Where the exhibit has been stored, especially once it has been taken away
    from the scene.


    +   - Who checked the evidence in and out of storage, and when and why it was
    done.


    +   - Specialist examinations conducted on the exhibit (if any), such as fingerprint
    or digital examination, along with the details of the person moving the exhibit.


    +   - Who returned the exhibit to the storage facility and the time it was returned.


    +   - Damage to the exhibit (if applicable), how it occurred, when it was discovered,
    and who discovered it. Also record the extent of the damage.


    From this report, the chain of custody report for each exhibit should be prepared.
    This will be very handy if you are questioned about the exhibit in court.


    # SCENE INVESTIGATION


    After discussed the general principles of evidence seizure, the remainder of this
    chapter introduces and discusses the practicalities of scene examination. First
    we will discuss initial actions prior to leaving the scene.'
