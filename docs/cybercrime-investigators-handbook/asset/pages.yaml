- pgno: 30
  md: '# Potential Cybercrime Offenses


    Identifying who is the beneficiary of the transaction is a more productive pathway
    for the investigator investigating individual card-not-present frauds.


    # Gaining Access to a System or Device through Malicious Software


    These attacks seek to gain access to a computer system through the delivery of
    malicious software. This may be either an internal or external attack. An example
    is an Advanced Persistent Threat (APT), where a person gains unlawful access to
    a computer device and maintains their hidden presence, gathering new data each
    day. An APT may be present from a week to several years before being found.


    # Investigator Techniques


    Identifying the malicious software used in the crime is one of the first steps
    for the investigator. Contact the organization''s security vendor, which may have
    resources available to immediately identify the malicious software and its characteristics.
    Many of these companies have very knowledgeable investigators who can provide
    you with information about the people andor syndicates behind the attack. You
    may use this valuable information to leverage off their technical inquiries.


    This will be a portion of your investigation and supplement the investigation
    into the crime via usage of the malicious software.


    # Damaging the Reputation of a Competitor to Gain a Market Advantage


    As competition is tough in the marketplace, damaging the reputation of a competitor
    may provide the attacker advantage. An example would be a tender submitter launching
    an online attack on a competitor just before a tender sits to decide who will
    win the latest tender, raising serious questions about the victim''s cyber security.


    # Investigator Considerations


    In the early days of the investigation, look to see who is the beneficiary of
    the reputational damage of your client. While this may be a random attacker with
    an extortion motive, if the company is in the process of delicate negotiations
    with a potential client or tendering for a new contract, there may be clear signals
    as'
