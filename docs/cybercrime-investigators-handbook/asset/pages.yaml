    # Returning to Your Location


    Upon returning to your location or storage facility, several actions need to be
    undertaken for your evidence and investigation:


    +   - Account for all evidence. This is in effect double-checking the accuracy
    of your seizure.

    - Store evidence in a secure location. If you are reviewing documents, one option
    is to photocopy originals and work off copies. Secure originals.

    - Have a team debrief where everyone is encouraged to present their thoughts and
    what they learned. The search team members often see and hear things other team
    members do not.

    - Verify that there are no health or safety considerations.

    - Collect copies of notes from team members'' notebooks. This is important information
    and obtaining it immediately helps to avoid looking for it months when team members
    may be on vacation or gone from the organization, the notebook has been misplaced,
    and so forth.

    - Witness statements will be required from team members and these should be obtained
    as soon as possible after the search/examination. The digital investigator will
    have a lot of work to do once returning to the office and their statement will
    be a continual work in progress while the examination is undertaken.

    - From the information obtained, prepare a schedule of follow-up inquiries. There
    may be further visits to the corporate offices of the complainant'
