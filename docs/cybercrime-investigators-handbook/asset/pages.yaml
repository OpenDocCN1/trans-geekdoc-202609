- pgno: 272
  md: '# Digital Evidence and Its Admissibility


    representative on your team will be playing a major role here, seek their advice
    early and regularly. The greatest piece of evidence you have is of no value if
    it is inadmissible.


    # DIGITAL EVIDENCE AND ITS ADMISSIBILITY


    In a civil matter, a civil lawyer may potentially be added to the investigation
    team to assist in obtaining court orders, restraining the suspect from using the
    data unlawfully obtained, obtaining computer evidence, or freezing bank accounts
    and assets of the suspect. This may then lead to further court action or even
    a prelude to a criminal complaint being made to police. As each jurisdiction is
    different, obtaining the legal advice of an experienced lawyer may be by time
    and money well spent before planning any such action.


    Your digital evidence will be as relevant to the court hearing as any other evidence.
    However, digital evidence needs care in its presentation to ensure its relevance
    is understood.


    All matters of evidence will be decided by your local jurisdiction(s) and rules
    of evidence are decided with local legislation and judicial rulings. Examples
    of considerations when placing evidence before the court with your brief non-legal
    descriptions are as follows:


    +   1. Relevant. Evidence that goes toward proving orproving an element of the
    charges before the court.

    2. Authentic. This rule is to show that the evidence placed before the court is
    what it purports to be. For example, that a document presented as evidence is
    authentic and not a fraudulently created document to prove or disprove an element
    of the charge. A witness who gave credible evidence, accepted by the court, that
    they created the specific document can prove authentication of the document.

    3. Not hearsay or admissible. Evidence where the witness provides evidence that
    is within their direct knowledge. For example, a rumor in the office luncheon
    that a specific person admitted committing a crime would not be admissible evidence
    in most jurisdictions because the witness has no direct knowledge of the alleged
    confession.

    4. Best evidence. In a perfect world, original copies of documents and images
    are presented to the court. With digital evidence, the original may be a digital
    copy which is generated and presented as evidence. A court will generally accept
    this unless there are legal or other reasons why not to.'
  merge: -1
  img_proc: true
- pgno: 273
  md: '5. Not unduly prejudicial. The evidence presented does not create an unfair
    prejudice against the accused, such as presenting evidence of similar convictions
    in the past. Also, because you located material on their computer showing that
    the suspect is of bad character does not mean it can be introduced to the court
    as evidence unless it is relevant to the prosecution. For example, finding evidence
    on the suspect''s computer that they have been been misbehaving on social media
    is unlikely to be admissible evidence when you are investigating them for stealing
    data from their employer.


    # PREPARING FOR COURT


    Technology can be extremely complex, and although the evidence presented may be
    very relevant, the party presenting it needs to ensure its value is highlighted
    and not lost in the complexity of the underlying technology, as can be the case
    with cloud-based evidence. Consequently, investing time in developing a technology
    plan for the court is well spent, especially when the defendant''s lawyer is using
    a strategy of making the technology sound as complex as possible to the jury.


    If your technological evidence is highly complex, having an independent expert
    as a witness who knows little about the case but a lot about the technology helps
    present the court with an understanding of the crucial technology in the case
    without any hint of bias towards the party who asked them to give testimony. This
    person is an expert witness to the court and not to the party who brought them
    to testify. If you are introducing a person as an expert in their field, they
    will not be accepted by the court as an expert until they have established their
    qualifications and expertise and the other side''s lawyers have had the opportunity
    to challenge them if they choose. In most jurisdictions a person is only an expert
    when the court agrees they operate.


    A problem juries have following the volume of evidence in complex cases. Evidence
    moves quickly across witnesses, and it is human nature take time to understand
    the complex evidence and its meaning in the context of the case. If a piece of
    evidence is highly complex but provides limited value, review with your lawyers
    whether it should be presented, as its value may be overwhelmed by its complexity.


    Providing a monitor and/or device (tablet) for the jurors to have access to the
    digital evidence as it is presented allows them to hear the testimony at the same
    time that they are seeing it. They may also review exhibits from'
  merge: -1
  img_proc: true
- pgno: 274
  md: 'the device as they require. This assists those who learn by doing as well as
    those who learn by listening.


    When reviewing the range of offending by the defendant, should there be a long
    period of offending whether there is any benefit in prosecuting every instance
    of offending over several years and confusing the court. An alternative strategy
    is to identify the main period of offending and to prosecute based on this time
    frame. The potential sentence for using technology to fraudulently obtain $15
    million is not much different from using technology to fraudulently obtain $16
    million, especially when there is no possibility of reparation. If the main period
    of offending involves the $15 million and your evidence is very strong, the evidence
    is weaker and confusing for the remaining $1 million, a common strategy is to
    stick to your strengths.


    When choosing your experts, determine their qualifications and experience. While
    not every digital investigator needs to be an expert, they must be able to show
    their qualifications and experience in using the technology to capture and assess
    digital evidence to the standard required by the court. In effect, the court wants
    to see competency in their actions and the credibility of the results and interpretations.


    Assisting your lawyers in understanding your investigation is an often overlooked
    ingredient of an investigation. Lawyers are often overrun with matters and sometimes
    have limited time to get an understanding of the nuances of the case they are
    to prosecute. It is in your interests to prepare a complete summary of matters
    and the evidence to ensure they have the knowledge to represent your case in a
    court/tribunal. A well-crafted executive summary is worth the time taken to prepare
    it. Include a schedule of the main evidence and why it is relevant. Preparing
    a chain of custody should also be greatly appreciated. If you cannot convince
    your lawyers of your evidence and in a clear and precise manner, you will struggle
    to convict a jury.


    Working with your lawyers is an investment. You may have a legal representative
    on your team and this may not be the same person who presents the case in court.
    Be prepared to accept the advice of your lawyers even when you do not like it,
    as they are the ones who have to present your case in court and learned the hard-won
    lessons from the courtroom and the requirements of the judiciary. If they want
    a line of inquiry investigated further, this must be treated as a priority.


    From the time of initially commencing your investigation, understand that everything
    you do may be questioned in court where you will be required to justify your actions.
    This applies to your investigation methodologies as well as evidence management.
    We have discussed taking notes of decisions made and'
  merge: -1
  img_proc: true
- pgno: 275
  md: 'circumstances known at a particular time, and this is where they will prove
    valuable. A decision may be made later proven wrong; however, when you are working
    at a scene or speaking with a suspect, you do not have the luxury of waiting for
    all the information you require, and that decision may have been reasonable at
    the time. You work with what you know and use your experience. It is a rare occurrence
    when you conduct a post-investigation review and do not think that you would have
    made different decisions at key times if you had information that became available
    at the time the decisions were made.


    When you make a claim before the court, ensure that your evidence is strong enough
    to prove it. As mentioned, having an independent party, such as a lawyer, review
    your case and evidence will be beneficial, as it provides an opportunity for the
    beliefs you have developed during the investigation to be challenged. Unfortunately,
    despite the best efforts of the investigation team, you may become convinced of
    their theories involving evidence and a suspect that alternative theories for
    the facts uncovered may be missed. Having your evidence challenged before you
    begin a prosecution and correcting any shortcomings is preferable to the shortcomings
    identified and highlighted by the defendant’s lawyers in the court. Standards
    of proof to win a case may vary between criminal and civil law. Understand the
    thresholds for conviction in the court which you are seeking to prosecute.


    With development of technology, the seizure, examination, and storage of the device
    and image may be a factor in the court determining its admissibility. When choosing
    the method of seizing digital evidence, understand that the court wishes to see
    methodologies it can place reliance upon. The courts have ruled upon matters involving
    technology and digital evidence over many years and your jurisdictions will have
    plenty of legal precedents providing guidance.


    If your methodologies seem very complex, plan the explanation carefully. Courts
    have been interpreting complex evidence for generations. Once, fingerprint evidence
    was new and challenging; now it has been accepted for decades. Since then, courts
    have successfully many new forms of evidence, including computers, mobile devices,
    and DNA. In each case the explanations of this evidence and its accuracy would
    have been carefully planned prior to its introduction.


    New technology is evolving faster than the courts can be introduced to them. For
    example, cloud-computing technology is no longer new to the marketplace and the
    Internet of Things (IoT) is already rapidly evolving, meaning evidence is being
    placed before the court that judicial officers may not be familiar with and that
    may not have a clear precedent to rely upon when they consider its integrity and
    authenticity. There may be instances in the future'
  merge: -1
  img_proc: true
- pgno: 276
  md: 'important evidence comes from a new form of digital device and the opposing
    party puts the technology and its accuracy on trial rather than focus on the evidence
    it produces and its implication for their client. This evidence often does not
    get challenged because the parties involved do not understand the technology themselves
    and do not know the questions to ask.


    As a part of your preparation for court, prepare your witnesses. Many people who
    are witnesses have never been in a courtroom before and their understanding of
    what they see on TV. It is common for witnesses to be nervous before attending
    court, as they are stepping into the unknown against skilled lawyers who see the
    courtroom as their second home and know the rules of the court intimately.


    A positive strategy is to take key or nervous been to show them an empty courtroom
    before they give evidence. Show where they are to sit, the lawyers will be situated,
    and teach them court protocol, how to respectfully address the judge and present
    themselves in the best positive light. In effect take the mystery out of the courtroom.
    Allow them to review their statement to refresh their memory (where local laws
    allow), as the court hearing may take place years after the alleged offense when
    their statement was taken. Also introduce them to your lawyers, who will appreciate
    the opportunity to review the evidence with their witness and clarify any matters.


    Explain courtroom procedures, such as the role of the court registrar (or similar
    official, depending on your jurisdiction), who provides the oath or affirmation
    and what their role is. In a high profile matter, there may be media presence
    and they have their own role, which is to record events in the courtroom. Explain
    that there may be members of the community present who have no involvement in
    the case but are interested because of the media reports.Teaching your witnesses
    some of the tricks of giving evidence is a valuable strategy you can apply in
    preparing for court. Some good advice includes sticking to what you know; not
    providing opinion unless you are an expert witness and the court allows such evidence;
    and being aware of tactic of silence, where the witness provides their answer
    and the defense lawyer stays silent, waiting for further information the witness
    had no intention of giving. The silence prompts the witness subconsciously that
    more information is required, and they may say something they later regret.


    Other tips are to stay professional, to not make derogatory comments about the
    defendant, to not make smart/sarcastic comments, and to attend court dressed professionally
    and respectfully. The witness should not use foul language unless it is a direct
    quote directly relevant to the evidence and'
  merge: -1
  img_proc: true
- pgno: 277
  md: 'testimony, such as “When challenged as stealing the intellectual property,
    the defendant said *****.” The judge and jury will assess the character of the
    person providing evidence as rigorously as the evidence itself, and showing professionalism
    with respect to the court is a foundation of being a quality and credible witness.


    A further tip to give your witnesses to a question is that they are allowed to
    say do not know the answer or that they cannot remember when they are giving evidence.
    Making up answers from fragments of memory is not quality evidence and they may
    be questioned as to why these memories were not included in their original statement
    but only recalled several years later. If something is remembered that was not
    included in the original statement, an addendum statement should be recorded and
