  md: '# # CHAPTER FOUR

    # Determining That a Cybercrime Is Being Committed


    HERE ARE many forms of warning that a cyber security incident has occurred that
    need an incident response and possible investigation. These may be technical,
    nontechnical, or a combination of both. It is highly beneficial for the investigator
    to be familiar with such warnings as they commence their investigations, as they
    will provide a pathway to where some of the most valuable evidence they will be
    located and provide direction as to the motivation of the attacker.


    The alert may be electronically generated using technology such as a fire-wall
    or an Intrusion Detection System (IDS); alternatively, a systems administrator
    may discover a new systems file they were unaware of in a foreign language. Unfortunately,
    alerts may be missed due to short staffing of technical teams or because so many
    alerts are being received from poorly configured soft-ware the genuine alert is
    seen as a false positive.


    The National Institute of Standards and Technology (NIST) describes a security
    incident as follows:


    +   A security incident is a violation or imminent threat of violation of computer,
    security policies, acceptable use policies, or standard security practices.^1'
  merge: -1
  img_proc: true
- pgno: 49
  md: '# Determining That a Cybercrime Is Being Committed


    There are many ways a party may become aware that they are the target of a cyber-attack.
    The list in this chapter, while not exclusive, covers many of the potential warnings
    system administrators or users may encounter.


    # CYBER INCIDENT ALERTS


    A list of 27 potential cyber incident alerts follows:


    +   1. An alert from a security application, such as an IDS or Anti Virus (AV).
    Both the IDS and the AV monitor anomalies on a system and may provide an early
    warning of an intrusion or intrusion attempt. Just because a warning is generated
    does not mean the system is under attack. It may mean there is an anomaly investigation
    to determine what is behind the alert being generated.¹ The 2018 Australian Government
    Information Security Manual identifies a series of data sources that may identify
    a cyber security incident. These include monitoring the logs of the domain name
    system, email servers, the Operating System (OS), the virtual private network,
    and web proxies.

    2. A firewall identifying a successful intrusion or attempt to gain unlawful access
    to a network or device.¹n3. Unusual network activity, such as heavy usage when
    staff is not working or scheduled updates being installed over the network.

    4. A user identifying unusual activity on their device. A user knows how their
    device operates in normal circumstances.¹ Signs such as very slow processing or
    hot batteries on devices they are not using may be indicators of unusual processes
    operating in the background. Overheated batteries on mobile devices that are not
    being used are a particularly good sign that apps are operating, and these may
    include stalking apps.

    5. Vulnerability scanners are legitimate applications used by systems administrators
    to test the security of their networks and websites. The misuse of such software
    by unauthorized parties may be evidence of a cybercriminal seeking unlawful pathways
    into a corporate network, device, or website.¹n6. Unusual log-on behavior, which
    may include unrecognized IP addresses or log-times outside of normal user times.

    7. An AV alert that malicious software has been located or is attempting to install
    itself on a system or device. An example would be AV software identifying unknown
    software attempting to encrypt a device''s database in a possible ransomware attack.¹'
  merge: -1
  img_proc: true
- pgno: 50
  md: '8. Identifying a file name with unusual characters, especially if recently
    installed without permission.^{1,3}


    9. Repeated, failed-log attempts from an unknown Internet Protocol address. This
    would be evidence of an attempt to break a password using brute force or someone
    trying to guess a password.^{1,3}


    10. Gaps or missing logs indicating an attempt to remove evidence. An example
    would be all logs after a recent date on an established device wiped.


    11. Repeated attempts to log on sensitive files or folders. This suggests a party
    has obtained access to the network and is targeting specific data. The attack
    may originate from inside or outside the network.


    12. Unusual attempts to create profiles or increase privileges. Generally as user
    privileges escalate, access to more valuable information is granted.


    13. Unknown processes running or the identification of applications installed
    or operated by systems personnel.


    14. The downloading of sensitive files to remote locations, indicating that unlawful
    access to sensitive data has been obtained and is being removed to a device external
    to the network. A review of File Transfer Protocol (FTP) logs will confirm the
    downloading of sensitive files.


    15. The identification of unusual activity, as valuable Intellectual Property
    being downloaded onto an external drive without authority or prior to a staff
    member registration, through an internal audit.^{3}


    16. A network outage, which may indicate an external attack or a hardware/software
    issue.


    17. Bounced emails, some of which may contain malicious software or links. This
    can indicate that someone is trying to guess the syntax of a person''s email account
    or that a criminal is using an out-of-date email list containing the details of
    persons who no longer work for the company.^{1,3}


    18. A breach of acceptable usage policies. This may identify internal staff inappropriate
    content (such as pornography) or installing unapproved applications (such as personal
    cloud computing services). The appearance on corporate networks of peer-to-peer
    software that is being used to download movies and music should be seen as a serious
    risk to corporate security.


    19. External parties identifying suspicious emails coming from the corporate account.^{3}
    The message may be very different in wording or content from what is normal, suggesting
    a criminal is using the hacked corporate account to try to breach the security
    of another company or user.


    20. An overt act such as a Distributed Denial of Service (DDoS) attack. DDoS is
    a large-scale cyber-attack against a company that attempts to take'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'offline by clogging up its web server with large volumes of traffic. This is
    a direct attack against the ability of the network to operate, causing significant
    financial and reputational damage.


    +   21. Encrypted volumes, such as a ransomware attack. This is evidence of extortion
    against a company.


    +   22. A notification coming from an external source, such as a law enforcement
    agency, the media, customers, or the attacker.³


    +   23. A Security Information and Event Management (SIEM) alert logs experiencing
    unusual activity, such as one or more of the activities on this list. SIEM software
    processes log entries generated within a network, looks for anomalies, and provides
    alerts to suspicious activity.¹


    +   24. The identification of unauthorized changes by file monitoring software.
    Application files have a set hash value; when changes are made to the application
    without authority, the hash value changes and provide system administrators notice
    of unauthorized modifications to software.¹


    +   25. A user logging into valuable intellectual property or files and exiting
    within a short time without having made any attempt to action the files within
    the realm of their duties.


    +   26. The corporate website being defaced.


    +   27. A threat from issue-based activists.¹,³


    When the breach is first discovered, the system administrators will not have many
    facts at hand and start trying to identify what is happening, whether in fact
    an attack is underway, how bad it is if there is, what is being targeted, and
    so on.


    If it is identified there is in fact a cyber-attack underway, there will be a
    wide range of human emotions on display, which may include fear, panic, stress,
    anxiety, and somters. Human nature dictates that decisions in this environment
    may not always be consistent with best practice. As there will be limited knowledge
    and managers will be demanding answers and immediate containment of the attack,
    the team assigned to dealing with the attack in the first instance will be operating
    under a level of pressure until the IR team is assembled and starts executing
    their duties.


    It is time that the decisions made in this high-stress environment may inadvertently
    destroy the evidence needed by cyber investigators. With the extent and seriousness
    of the incident being unknown, any thought of evidence identification and preservation
    may not be of major concern to the initial responders.'
