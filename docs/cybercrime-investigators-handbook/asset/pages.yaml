    Defense lawyers are skilled practitioners at reading witnesses and identify-ing
    strategies to reduce the impact of their evidence. This is their job and they
    are there to represent their client to the best of their ability.


    In summary, your investigation may provide very strong evidence to id-ify the
    offender, their methodologies, and their motivations for committing a cybercrime.
    However, unless you are able to prove the facts when required, your conclusions
    will remain unproven.'
