  md: 'to the potential suspect may be. Your client may be able to point you in this
    direction.


    # Changes to Computer Systems or Devices


    # Investigation Considerations


    This is a very personal attack where there is no obvious suspect. Damaging data
    to induce the company into making poor business decisions is not of any great
    benefit to the average cybercriminal who is seeking a personal financial return.


    Speaking to the complainant will provide direction as to potential beneficiaries
    of the crime. Also understanding how the action was identified will provide further
    direction of assistance.


    A person motivated to commit such an attack would include a disgruntled former
    employee who modifies the data before they leave as retribution for a perceived
    grievance. Never underestimate the motivation of an angry ex-employee.


    # Vandalism to Prove the Skills of the Attacker


    Hackers like to prove their skills and build their portfolio of companies that
    they have successfully attacked. A company may be the random victim of a hacker
    who is seeking to build their credibility in the hacking community.


    # Investigator Considerations


    As the victimization of this crime may be put down to pure bad luck, there may
    be a few leads for the investigators to consider from the perspective of motivation.


    Investigators who know their way around the bulletin boards and websites cybercriminals
    communicate on may pick up some details on who was behind the attack. New cybercriminals
    testing their skills like to let everyone know about their successful attacks
    for the purpose of building their reputation. These criminals'' vulnerability
    related to the need to promote themselves to see what you can find out them and
    to build profiles on them.'
