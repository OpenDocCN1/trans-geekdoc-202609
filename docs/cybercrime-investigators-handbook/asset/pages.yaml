  md: '# CYBERCRIME CASE STUDY


    A male was on an online relationship site when he met a person he felt he had
    a future with. He invested a lot of time with her and built a strong emotional
    relationship despite being in separate countries. She encouraged the building
    of the relationship saying all the phrases he needed, like “I love you,” which
    was a very powerful phrase he would never hear again.


    At some stage in the early grooming phase, he disclosed that his brother had of
    a congenital heart defect and that this placed an emotional burden on his life.
    The fraudster identified this as a form of vulnerability and later introduced
    him to her son. Over time the fraudster convinced him that they had a future,
    and that his four-year-old started asking, “Are you going to be my new daddy?”
    This sealed the relationship as far as the victim was concerned, as he was desperate
    to be parent.


    Once the relationship was secured, the child mysteriously developed a congenital
    heart defect requiring regular sums of money for medication and later surgery.
    The victim demanded that the child was to receive the best of health care and
    spent large sums of money for the child’s health care, medication, and he cashed
    his pension, paid all costs as they incurred, and was provided medical receipts,
    which were later proven to be fake. The child’s health failed, for an urgent heart
    transplant at the request of the mother, her pastor, physician, and other “friends
    of the family."


    Upon identification of the fraud, a search warrant was conducted at the suspect’s
    address that identified communication logs, phone records, financial receipts,
    and partial admissions, proving the guilt of the female. She was sentenced to
    five years’ imprisonment.


