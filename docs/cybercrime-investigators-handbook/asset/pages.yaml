  img_proc: true
- pgno: 42
  md: 'Examination of the pathway through a network that an external hacker has traveled
    may show their level of familiarity with the internal network, especially if they
    travel directly to the target and take the data sought. Alternatively, the attacker
    who stumbles around the network missing key data may be evidence of a cybercriminal
    with limited skill looking to see what they can find. An examination of system
    logs prior the attack may find evidence of the attacker conducting extensive reconnaissance
    of the network and its security.


    The cybercriminal may be internal or external to the network, or a contractor.
    While the usual understanding of a cybercriminal is a person physically remote
    from the network they are attacking, an internal employee may be taking copies
    of valuable IP with them to their next employer or selling it to competitors.
    A malicious internal employee may also be prepared to execute a program on a USB
    device, allowing an attacker they know remote access to their employer''s corporate
    network.


    # COMMON MOTIVATORS


    The following are examples of cybercriminals'' common motivators for their crimes.
    The list is not exhaustive, as the important point to understand is that the motivation
    for the attack will make sense to the criminal during the time of preparing for
    and committing the offense. Therefore the list of potential motivations may be
    far more extensive than this list.


    # Revenge


    An attacker may commit a criminal offense against a company after a perceived
    injustice against themselves. The attacker may be a current or former employee,
    a competitor, or an issue-motivated group. A current or former employee may be
    motivated by having been passed over for a promotion, by having not received a
    pay that met their expectations, or by having been disciplined for their behavior
    and having not met job performance standards.


    The form of attack will vary based on the skills and resources available to the
    attacker.


    # Opportunity


    In the instance of an internal employee, there may be no initial motivation by
    the employee to commit any form of crime against their employer. However,'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'while undertaking their duties they may identify a vulnerability in the internal
    systems where money or data could be removed without anyone else being able to
    identify their actions. From there, they may decide to exploit the vulnerability
    to their benefit and commence taking money or data to be sold to other parties.


    The decision to commit the offense may develop a significant period after identifying
    the potential vulnerability, when the opportunity proves too much of a temptation
    to them. Examples include accounting staff adding fake-employees to the accounting
    system and sending the pay to their bank account, the accounting manager operating
    a second set of books to hide their dishonest behavior, and the creation of false
    invoicing, with the creditor’s payment going to their personal bank account.


    # Greed


    No surprises here. Greed is a common motivator for the criminal, whether internal
    or external to the company. The potential to enrich their lives at the expense
    of others is an enticing option to them, with little to no concern for the damage
    they do to others. Greed is not listed as one of the deadly sins by accident.


    The investigator may uncover this motivator very quickly, in which case the emphasis
    will be on locating the proceeds of the crime with a view to mitigating the potential
    damage.


    # Test of Skill


    Some cyber criminals may commit technical attacks against others as a training
    exercise to develop their skills for a more financially lucrative attack. They
    may also use these attacks to advertise their skill set and their successful system
    compromises to build their credibility on cyber websites.


    Script kiddies are new entrants to the cybercrime community who rely heavily upon
    the technology and education provided by more experienced cybercriminals. They
    may have a low level of technical skill; however, they start their careers by
    learning tools and tradeoff from criminal websites and forums. As they develop
    and test their skills, their range of options to commit crime expands.


    # Business Competitor


    The marketplace can be a very aggressive environment for businesses, with each
    placing an emphasis on developing a strategic advantage. One way is to steal the
    competition’s IP through computer hacking to provide an advantage.'
  merge: -1
  img_proc: true
- pgno: 44
  md: 'Another is to damage the competitor’s reputation through a technical attack,
    leaving existing and potential clients with concerns about doing business with
    a company under a technical attack.


    These strategies may be very successful when a tender involving the victim company
    is to be decided.


    # Professional Criminal


    The professional criminal’s motivation is seeking personal financial advantage.
    The attack is rarely personal and the attack on the target company is nothing
    more than a business venture to make money.


    A type of professional criminal is the contractor who is available to do the work
    of a client, and therefore the motivation is financial, with no element of personal
    grievance against the target. These people may be located online, including on
    the dark web, and offer their services (such as hacking) to the highest bidder.


    # Issue-Motivated Attacker


    This is a personal attack and the victim may be targeted for a political reason
    rather than any other event. Examples may be an advertiser who is the subject
    of a consumer boycott or a business product or service that members of the community
    may disagree with. It can also involve the target making a comment on social media
    that is perceived as wrong.


    # Geopolitics


    A state actor is a government agency or aligned group who conducts activities
    on behalf of that government. The motivation may be to seek the IP of specific
    industries in foreign countries to gain a competitive advantage. Alternatively,
    they may seek to target the infrastructure of a hostile company or country to
    cause as much damage as possible.


    # Terrorism


    With the world being connected, the opportunity exists for persons in remote locations
    to target the critical infrastructure of an entity they wish to cause extreme
    harm. A person in a remote location may see their goals advanced by causing a
    massive security failure in another nation’s critical infrastructure—such as power,
    nuclear energy, or water delivery—that leads to a large-scale loss of life.'
