    developing methodologies and the ways cybercriminals control their activities.


    An advantage of cybercrime to a criminal, when compared to other forms of crime,
    is the lack of structural complexity. When compared to a crime as illegal drug
    trafficking, cybercrime lacks the managerial complexities that are prevalent in
    crimes involving physical property. A drug trafficker may be required to structure
    the business, distribution, processing, transportation, competition, threats,
    network, and money laundering. In cybercrime, there are fewer of these considerations
    involved. As opposed to the illegal drug trade, where parties involved may personally
    known to each other and build relationships, those involved in partnerships in
    cybercrime may never physically meet each other, assisting each other on their
    areas of expertise. Also, a valuable consideration is that there are no turf wars
    involved in cybercrime, as are in the illegal drugs trade.¹


    There are many reasons why cybercrime is attractive to the criminal. One of these
    is the financial reward available compared to other forms of crime. Joseph Schafer
    and his colleagues found that on average the bank robber obtain $2,500, the fraudster
    $25,000, and the cybercriminal $250,000. They also found that the cost of the
    technology to an organization is approximately $1.9 million.²


    Alongside the financial rewards, a further attraction of cybercrime to the criminal
    is that certain actions are easy to carry out and hard to detect. The Internet
    provides anonymity for skilled cybercriminals, who use available technological
    resources (such as free web-based email accounts). Schafer and his colleagues
    found that the anonymity cybercriminals are operating under'
