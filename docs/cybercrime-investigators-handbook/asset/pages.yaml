- pgno: 259
  md: '# The Interview Process


    # Witness’s Knowledge of Suspect


    +   - Who do you think may be behind the cybercrime being investigated?

    - Describe any unusual events that have occurred recently, especially involving
    technology.

    - How did you become aware of the cyber incident that occurred?

    - How do you know this person? (This question is relevant for an internal investigation.)

    - How long have you known this person? (This question is relevant for an internal
    investigation.)

    - What are their daily duties? (This question is relevant for an internal investigation.)

    - What does a typical day look like for this person? (This question is relevant
    for an internal investigation.)

    - Who is their manager? (This question is relevant for an internal investigation.)

    - What is their attitude toward the workplace and management like? (This question
    is relevant for an internal investigation.)

    - Describe any instances of negative or suspicious behavior by this person. (This
    question is relevant for an internal investigation.)

    - Describe your knowledge of their skills with respect to technology. (This question
    is relevant for an internal investigation.)


    # Witness’s Knowledge of the Event under Investigation


    +   - What is your understanding of the event under investigation?

    - How was it discovered?

    - What is your involvement in this investigation?

    - What evidence is there that a offense was committed?

    - When did the incident occur?

    - When was the incident initially discovered?

    - Who discovered the incident?

    - Who has been responsible for the investigation?

    - What are the estimated damages from the incident? (This question is relevant
    for senior managers and may include financial, reputation, and opportunity cost
    losses.)

    - Who gave the order to secure the event? (Relevant when a person has been directed
    to secure evidence)

    - Who identified what evidence was be secured?

    - Where is the evidence collected to date stored and who has had access to it?

    - What actions have been taken to identify, collect, preserve, or analyze the
    data and devices involved?'
