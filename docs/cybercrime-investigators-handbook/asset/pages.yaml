- pgno: 263
  md: '# # 17

    CHAPTER SEVENTEEN


    # # Review of Evidence


    NCE THE scene examination has been completed, exhibits examined and safely stored,
    interviews conducted, and open source inquiries completed, there comes a time
    to review all the evidence gained in the investigation and to attempt to gain
    a clear picture of the event and what evidence you have. This picture may develop
    very quickly or be very complex. You may find that avenues of inquiry that originally
    looked very promising end leading to dead ends and that other lines of inquiry
    that were being undertaken primarily as a matter of being thorough lead to the
    smoking-gun evidence.

    During the initial phase of your investigation you have been building the foundation,
    although it is always a great outcome when you find evidence linking the offender
    to the crime while still at the scene, this is not the case. It is through the
    review of the evidence that the picture becomes clearer and you gain a greater
    understanding of what has occurred.


    Avoid having a preconception of events and suspects as you review the evidence.
    This may not be as easy, as the evidence may initially seem quite conclusive.
    If you wish in mind for the evidence to point to a specific person or Modus Operandi
    (MO), your thinking will subconsciously make the evidence point to your theory,
    even if it is hopelessly wrong. If you do not challenge the evidence and theories,
    you can be sure that the defendant''s lawyer will


