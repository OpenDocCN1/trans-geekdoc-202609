- pgno: 144
  md: '# Computer as an Exhibit


    If you are seeking to examine a computer, at first leave it where it is and call
    in the digital investigator. If the device is turned off or locked down, do not
    turn it on. If the device is on, photograph the device and what is on the screen,
    even if there are no tabs open. Some jurisdictions will allow you to open the
    tabs on the device for viewing and photographing, although you will need to balance
    that against the need to have minimal interaction with the device before the digital
    investigator begins their work.


    If the evidence you are seizing has any damage, photograph this before it is seized
    so that no allegation can be made that the damage was caused by the investigation
    team. Your entry in your notes and property schedule could read: “iPhone seized
    with cover. Home button damaged."


    Figure 10.8 is an example of a device showing damage that was present located.


    # Digital Evidence Order of Volatility


    Create an order of volatility of digital evidence. This is discussed earlier in
    this chapter, under “Acquisition of Digital Evidence."


    ![](img/72f0382a5bc36845e84220db7d6f6b77_144_0.png)


    **FIGURE 10.8** Image of damaged iPhone.

    Source: Photo © Graeme Edwards.'
  merge: -1
  img_proc: true
- pgno: 145
  md: '# Encryption


    Without keys, encryption will cause problems. As the scene investigation is undertaken,
    locating potential sources of passwords will assist the digital investigator back
    at their laboratory as they attempt to gain access to the device and evidence.
    Keys may be provided by a device owner/controller, or located on pieces of paper,
    in a notebook, or on a sticky note under a desk.


    If a device is operating, the forensic examiner may conduct a live acquisition
    of the RAM as keys may be resident in plain text.


    # Sketch Map of Scene If Required


    A sketch map of the scene and evidence located may be very valuable when identifying
    exactly where evidence was located. This will support the scene photographs.


    # Who Is Present at the Scene?


    Scenes may vary greatly and knowing who was present at a specific time allows
    the investigator to understand the scene: who belongs in it, who is a visitor,
    and who was not present.


    # Identify Potential Suspects (Are They Present?)


    Identify suspects) to reduce the potential for them to damage evidence. Remember
    that digital evidence may be remotely wiped. As an example, a person in the office
    may phone a colleague at a client''s office to let them know an investigation
    team is looking at their computer, unaware that the person they are calling is
    a suspect. As previously discussed, upon alerted the suspect may be motivated
    to remotely wipe the drive using a cloud-based application.


    # Locate Passwords


    As looking for encryption passwords, these may be stored in notebooks or on sticky
    notes attached to a device. USB devices can also contain sets of passwords. You
    may also ask the person operating a device for the password.


    # Identify Potential Witnesses and Availability (Digital Recording Where Local
    Laws Allow)


    Some witnesses may need to be interviewed at the time of initial engagement. For
    example, a key witness may be about to leave the following day with no contact
    possible for the following month.'
  merge: -1
  img_proc: true
- pgno: 146
  md: '# Who Is Not Present We Need to Interview?


    Key witnesses may not be present and may need to be contacted urgently. For example,
    the system administrator may be on leave and have valuable evidence regarding
    the network, its design, and previous security events.


    # How Do Workers Access the Scene?


    Should a device be present at a scene where there is concern that the attack was
    initiated by an internal employee, obtaining electronic records of staff entering
    the scene at the time may assist in confirming who was present at the time of
    the event occurring. A physical key may be required for access; however, a Radio
    Frequency Identification (RFID) swipe card will be very useful for the investigator,
    as there may be a log entry of swipe cards gaining access that will show which
    card was used and the time access gained.


    For example, if logs data was removed from a device in the early evening, security
    logs may show who was still present at the location. Also consider CCTV footage
    showing people entering and leaving the premises: this can be read along with
    device/network access logs.


    # Obtain an Employee List


    Having a full list of staff and where they work helps to identify potential suspects
    and witnesses.


    # Identify Subject Devices


    In a network attack much of the corporate infrastructure may be touched by an
    attacker. There may be initial confusion as to which device(s) have been compromised
    and this will need to be managed at the scene with system administrators and the
    IR team.


    In some instances, the subject device may have been removed from the network and
    secured awaiting the arrival of the investigation team, meaning the hard work
    of identifying the breached device has already been done.


    # Who Has/Had Access to the Scene and Subject Devices?


    Computers are usually accessed by passwords; however, it is not uncommon for staff
    to share passwords or for a device to have a generic password. Should a device
    have a shared or generic password, identifying a suspect may prove difficult.
    If the password is left on a piece of paper next to the device, your list of suspects
    extends beyond those authorized to access the device.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Record Witness Comments and Details Regarding Who They Are, Access, Job Title,
    and the Like


    Identify who is the usual user of a subject device and whether anyone uses it.
    For example, some offices are becoming focused on hot desking to reduce costs.


    # User/Administration Access


    What level of access to a subject device does a user have? Do they have administrator
    or general user access?


    # Evidence Preservation and Seizure


    Treat all items seized as potential evidence in court and obey the rules of evidence
    for each item, regardless of its initial perceived value.


    All evidence is to be tagged and secured with unique identifiers. Use antistatic
    bags and record who secured the exhibit, when, and where.


    As discovered, property receipts are to be issued for all evidence seized and
    the exhibits officer''s receipt and the receipt from the person whom the property
    is being seized should show a full and accurate description of the property and
    should agree. Providing a copy to the property owner is good practice.


    Where there are numerous exhibits in a series of locations (such as suite of offices)
    it is possible for exhibits to be overlooked or left behind when you leave. This
    is a logistical mistake caused by human error when people are under stress or
    involved in numerous matters, as scenes can be a volatile location. To prevent
    this from occurring, brief the exhibits officer to detail every item they are
    seizing with the person whom it is seized prior to leaving the location. Cross-reference
    the exhibits schedule against the property receipt and physically compare it to
    the physical exhibit or digital capture. This is good practice, as it provides
    the opportunity to confirm the accuracy of the property receipt you are issuing
    to the property owner or custodian. Ensure that the original evidence is subject
    to minimal handling.


    Transporting evidence from the location is a further requirement of the scene
    and exhibits manager. Prior to leaving for the scene, have a designated secure
    storage facility where all evidence is to go once to your office. Once evidence
    is seized it must be accounted for until presented in court and a decision is
    made as to what happens to it there.'
  merge: -1
  img_proc: true
- pgno: 148
  md: '# Obtain Statements Preserving the Chain of Custody


    Preserve the chain of custody of all exhibits by obtaining statements straight
    off while people''s memory is still fresh.


    # Digital Examination of Subject Devices with External Specialist Support


    Suitably qualified examiners must be the ones to make digital investigations of
    evidence located at the scene. In some instances the subject device may be copied
    and examined at the crime scene, with mobile forensic devices (such as Celebrite''s
    mobile software examination device) being commonly used.


    # Network Records and Time Synchronization


    Where evidence is being obtained across a network, record the times and zones
    of all devices and software operating off of it. This is particularly relevant
    for investigations involving cloud evidence, where different providers provide
    software from across time zones.


    # Possession of Intellectual Property


    When seizing Intellectual Property the investigator is responsible for ensuring
    that it is secure and they do not lose possession of it. Consider encrypting it
    for safekeeping.


    # External Storage Devices


    Identify storage media that may contain evidence. Identify devices in smart buildings
    and homes that may record evidence. Speak to the digital and lead investigator
    to determine whether the digital evidence from smart devices that may assist in
    the investigation can be legally seized.


    # Security of Digital Evidence


    Keep all electronic devices separate from electromagnetic signals that may damage
    the evidence.


    # Notes


    Ensure all steps taken by all investigators are thoroughly documented. These documents
    may be evidence in their own right and be subject to critical examination.'
  merge: -1
  img_proc: true
- pgno: 149
  md: '# Digital Evidence Examination


    The digital investigator will image the devices seized using a write blocker in
    their laboratory. Never view a device at the scene, as a quick check to see if
    evidence is there when deciding to seize an exhibit or will damage the forensic
    integrity of the device.


    # Seize Any Backups That Involve the Suspect''s Device


    Where a mobile device is seized, place it in flight mode, recording this action
    in your notes. A Faraday bag is a special device designed to reduce the ability
    of a mobile device to access a network, preventing an opportunity for a suspect
    to remotely wipe the device in transport. You can also remove the SIM card.


    Identify the location of the evidence, finder serial number, model number, hostname,
    MAC address (where possible), IP address (where possible), time, date of seizure,
    photo of exhibit in situ, and snapshot of system prior to remediation.


    Verify and account for all evidence seized with the person from whom it is being
    taken. This may be a complainant, witness, or suspect.


    # Final Inspection Prior to Leaving


    Conduct a final inspection to ensure that nothing has been left behind, such as
    investigators'' notebooks, evidence, personal mobile phones, and so on. All of
    these items have been left at crime scenes before, requiring a hurried return
    to the location to recover an item.


    # Identifying the Network Architecture


    When an investigation requires an understanding of the flow of data through-a
    network, creating or obtaining a network architecture topology assists the investigator
    visually understand the system infrastructure. This understanding helps the investigator
    locate potential points of evidence collection and open new lines of inquiry.


    This sort of inquiry may be relevant when the investigator needs to understand
    how an attacker worked their way through a network from the time of breaching
    the corporate firewall to locating and removing data.


    A network system administrator may have a topology diagram or be able to produce
    one from network tools or their own resources.


    Corporate network architectures can be very complex. The history of the organization
    may show a series of system administrators building on the work'
  merge: -1
  img_proc: true
