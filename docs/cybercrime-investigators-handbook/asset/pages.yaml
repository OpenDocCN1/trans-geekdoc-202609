    # Computer Hacking to Gain Access to System Resources


    Corporations and educational and governmental organizations have access to large
    and powerful computer systems with processors and bandwidth. An attacker may break
    into a system to host a criminal site (such as a fraudulent online pharmacy) or
    to use the bandwidth to launch a Denial of Service (DoS) attack against another
    target. Alternatively, they may seek to use these resources to mine Bitcoin.


    This form of attack may be lost in the traffic of normal day-to-day activity where
    there is a high volume of activity on internal and external networks; however,
    use of the bandwidth resources confers a cost to the victim company.


    # Investigator Considerations


    This is a unique form of investigation, as many victims of this form of cybercrime
    do not make complaints due to the potential for reputational damage. If you are
    entrusted to investigate these crimes, look toward who is the beneficiary of the
    offense, such as the online pharmacy or the Bitcoin miner. Details about the compromise
    may also be of interest, as the obvious benefit may be the byproduct of an initial
    hack seeking IP and student/staff details.


    Academic institutes are a haven for valuable IP being developed by postgraduate
    and doctoral students, which is highly prized by nation'
