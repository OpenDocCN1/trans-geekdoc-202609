- pgno: 24
  md: '# Potential Cybercrime Offenses 11


    online reduces their personal inhibitions, especially since the potential for
    being identified and held accountable for their actions is low.2


    Of further benefit to the cybercriminal that the proceeds of their crime (data)
    can be virtualized and geographically distributed, creating technical and jurisdictional
    challenges for law enforcement and other investigating agencies. Digital forensic
    investigations to obtain evidence may not be obtained in a timely manner, meaning
    valuable evidence may not be available to investigators.3


    An additional benefit to the cybercriminal that their crimes can be disseminated
    very quickly, and the cross-jurisdictional manner of the crime results in the
    need for collaboration between police services at the national and international
    level.2 To add a further layer of complexity for an investigating agency, cybercriminals
    may operate in failed or failing states that provide a safe haven.4


    The specific or criminal offense in each instance depends upon the legal jurisdiction
    and the wording of the specifics of the offense as defined in legislation. While
    there are many forms of civil and criminal offenses involving technology, this
    chapter lists examples of offenses where technology is a major factor in the cyber
    investigator is required to respond to. Also understand when you are dealing with
    a certain form of cybercrime, this cyber event and the suspect lies in a foreign
    legal jurisdiction, even though their action may be a very serious criminal or
    civil offense in your jurisdiction, the act may not be an offense in your country.
    In effect, in their jurisdiction they are doing nothing wrong.


    As an investigator, be aware there may more than one offense occurring at the
    same time. While you are responding to a certain form of cybercrime, this may
    be merely a distraction to divert the attention of the Incident Response (IR)
    security team, as the attacker''s main goal may be elsewhere on the network. For
    example, there may be an attack against the company web server, and while the
    IR team is focused on mitigating this attack, the criminal can be stealing data
    from the email server or corporate database.


    The remainder of this chapter provides examples of different forms of cyber-offending
    followed by a brief explanation. These are not specific offenses, as each jurisdiction
    will have different wording for these activities and there may be multiple offenses
    you can identify from a single description.


