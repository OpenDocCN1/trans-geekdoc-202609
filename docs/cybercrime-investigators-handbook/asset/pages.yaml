  md: 'the computer of a contractor rather than a major Hollywood studio, which has
    more resources to defend itself.


    # Investigator Considerations


    Look closely at what was taken and who may benefit from the attack. In the example
    given of a Hollywood contractor, look to see whether the offender went directly
    to the IP or whether the IP was only located as a byproduct of examining the system.


    While we may think cybercriminals are very structured, motivated and skilled types
    of people, sometimes they are lucky and stumble across very valuable IP without
    initially understanding what they are hacking. In effect, they got lucky.


    # Stealing Credit Card Data for Selling Online,

    or Card-Not-Present Fraud


    These attacks deliberately target credit card information for exploitation or
    selling online through the criminal trading markets. This information includes
    names, addresses, credit card numbers, dates of birth, next of kin, phone numbers,
    and so on.


    The card numbers are used to purchase goods from online retailers using Internet
    services, with the cybercriminal having the goods delivered to a predetermined
    address. This may be an unknown colleague''s address, work address, rental property,
    or a pickup point that specializes in receiving parcels for clients, as some postal
    services operate. This is known to retailers as "card-not-present" fraud and carries
    a significant financial cost for the retailer, as the credit card company reverses
    the charge to the retailer.


    As an alternative, a cybercriminal may sell information from the cards to clients
    as a bulk item, charging per unit or at a volume discount. The information from
    cards of particular value, such as an American Express Platinum card, may be sold
    individually at a negotiated price.


    # Investigator Considerations


    These tend to be large-volume crimes, with hundreds of millions of credit cards
    available for sale online in the criminal markets. As mentioned previously, do
    not even consider going onto the criminal markets unless you are very skilled
    in online tradecraft, or even better, have brought in cyber investigator who is
    experienced in this field.'
