    has been caught bringing about their crimes or leaving behind evidence of their
    associates. While some are very protective of their social media profiles, others
    are very careless, and the evidence they leave open to investigators has been
    used in court by the prosecution.


    Open source material is particularly valuable as it can be captured by one of
    the many device-based recording devices, such as Microsoft’s Expression Encoder.
    The website or social media site is open to public, the European'
