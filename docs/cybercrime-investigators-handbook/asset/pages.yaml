- pgno: 55
  md: '# Determining That a Cybercrime Is Being Committed


    complicate the investigation, as valuable evidence will have been destroyed.

    Identifying an APT intrusion will give the investigator a very clear indication
    that the attacker has a high level of skills and capabilities. APT intrusions
    take significant time and resources to maintain, in some instances including the
    updating of malware that has been placed on the network to keep ahead of the AV
    security on the network.


    # CYBERCRIME CASE STUDY I


    A multinational company installed new fraud-detection software in their accounting
    systems. A systems administrator stated it was a highly regarded product, which
    when turned on was "lit up like a Christmas tree". Over the coming months, the
    system continually identified fraudulent accounting transactions and provided
    warnings.

    Members of the system operator''s team were so annoyed by the constant warnings
    that they determined the application was working incorrectly and turned it off.
    Unfortunately, the application was working correctly and each of the alerts were
    an accurate identification of a suspicious transaction. The total loss to the
    multinational was in excess of $20 million, and much of that was lost after the
    fraud detection system had been installed and turned off. In this case, the technology
    was working correctly but was not understood by the operators.


    # CYBERCRIME CASE STUDY II


    An employee of an organization was in the process of being disciplined for a range
    of activities. The disciplinary process was heated, and the employee faced dismissal
    if the charges were proven.

    Late one evening returned to work and placed a hardware keylogger on the back
    of the computer of the manager who was investigating him. The mouse and keyboard
    were attached to the keylogger, which sat between these devices and the device
    port on the back of the computer. The keylogger captured all the activity on the
    computer.

    By coincidence, the next day the manager cleared his desk and noticed the keylogger.
    To most people the keylogger would look like part of the infrastructure of the
    computer and arouse no suspicion; however, this manager quickly'
