    # SUSPECT INTERVIEWS


    Should you be in a position where you are considering interviewing a suspect,
    whether you are the right person to conduct the interview or if there is someone
    on your team who would be more appropriate. The most senior is not always the
    best interviewer. Also whether a member of your team has a rapport with the suspect,
    as this may prove to be a tactical advantage or benefit the interview. It is uncommon
    for a suspect to build resentment toward the lead investigator who has been designated
    the interviewer, but have a rapport with the person designated to do another job,
    such as collecting the exhibits. This may be a matter of personal chemistry and
    ego should not play any part in the interview.


    As an example, early in my police career I arrested a young male for stealing,
    a charge that he denied despite being caught driving it at 2:00 a.m., not being
    able to give the name of the owner, and having plenty of prior convictions for
    stealing cars. My partner, a female officer who along with her husband raced cars
    at a local raceway, took over the interview and spoke the language of motor racing
    to him, and he could not confess to stealing the car and several others quickly
    enough. As the arresting officer and lead interviewer I was happy to pass over
    control of the interview to her, as results were obtained and did not care which
    of obtained the confession as admissible evidence. Although he was also going
    to be arrested for stealing the car all along, the admission during the interview
    meant he pleaded guilty to the initial charge and several others as soon as he
    faced the court.


    the best policy is not to interview the suspect and leave it to police, as was
    mentioned previously. Often a suspect will provide only one interview that may
    be best left to police. Regardless of whether you or a colleague interview the
    suspect, remember they are to be provided safeguards to protect themselves in
