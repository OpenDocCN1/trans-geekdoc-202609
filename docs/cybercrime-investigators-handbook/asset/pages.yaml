  md: 'on an honest misunderstanding of circumstances. They may be relieved to find
    your investigation found no evidence of an internal fraudster or security breach.


    As an investigator, there will be times when you are required to tell the complainant/client
    things they do not want to hear, such as agreeing with them that there was a data
    breach and that a certain employee is a strong suspect, but there is no standard
    of evidence to prove it. Reviewing the evidence and investigation will direct
