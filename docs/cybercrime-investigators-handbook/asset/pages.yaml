    - Record contact details for all witnesses.

    - Obtain signed statements for each witness at the earliest opportunity.

    - Record qualifications and experience for witnesses involved in technical evidence
    identification, capture, and storage.

    - Record addendum statements as necessary. Addendum statements are secondary statements
    from witnesses that are recorded due to new information located or a new line
    of questioning, unexplored at the time of the initial interview, being asked of
    witnesses.


    # IDENTIFYING SUSPECTS


