- pgno: 167
  md: '# CHAPTER ELEVEN

    Log File Identification, Preservation, Collection, and Acquisition


    OGS RECORD events on the computers and the many devices that are part of a network.
    The activities they record may be valuable evidence to the investigators as they
    try to understand what has happened, the extent of the activity, and the identity
    of the person who may be involved. Sources of computer logs include operating
    systems, applications programs, and the many devices that make up a computer network.1


    Examples of sources of logs include firewalls, Anti Virus (AV) software, network
    working equipment (such as switches and routers), proxy servers, File Transfer
    Protocol (FTP) servers, Intrusion Detection System (IDS) and Intrusion Prevention
    System (IPS) software, web servers, computer devices, Domain Name Service (DNS)
    and Dynamic Host Control Protocol (DHCP) logs, and access authentication logs.1,5
    Each of these logs records activities on the network, and when combined with other
    logs can give the investigator an understanding of what was happening at the time
    of the event and who may be involved.


    Your digital investigator will seek to capture the logs while conducting the forensic
    image. Alternatively, the system administrator may provide these logs and have
    access to historical records of log activity prior to the event. They are as much
    as any other device or paper collected throughout the investigation. A system
    administrator may be using Security Information and Event Management (SIEM) software,
    which collates logs from many sources and presents a picture of network activity.2


    Cybercrime Investigators Handbook, First Edition. Grame Edwards,PhD.

    © 2020 John Wiley & Sons, Inc. Published 2020 by John Wiley & Sons, Inc.

