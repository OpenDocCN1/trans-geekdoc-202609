  md: '# CHAPTER THREE


    # Motivations of the Attacker


    WE HAVE seen in Chapter 2, cybercrime offenses cover a wide range of territory.
    The boundaries of offending are limited only by the imagination of the attackers.
    Cybercriminals come in many shapes and sizes and are motivated by reasons that
    make sense to them at the time of their attack. Once identified, the attack, motivation,
    or methodology not necessarily make sense to the victim or investigator, as they
    are not the ones who decided their reasons were sufficient to commence the attack
    in the first instance.


    While the investigator may commence an investigation with a perceived understanding
    of what they are going to locate the coming days, the reality of what they discover
    may be very different. If they commence their investigation with a tunnel view
    of what happened, they will misread the evidence and ignore what does not suit
    their unconscious bias. In short, follow the evidence and make your mind up to
    what happened and the reasons why at the end of the investigation. If you have
    an open mind, the evidence will lead you on the correct path.


    Without knowing the identity of the attacker, the motivation for an attack may
    be identified from the methodology used or the damage that was caused. Alternatively,
    an attacker may contact their victim after the attack has been discovered and
    may make their motivation clear by an extortion demand.


    29


    Cybercrime Investigators Handbook, First Edition. Graeme Edwards, PhD.

    © 2020 John Wiley & Sons, Inc. Published 2020 by John Wiley & Sons, Inc.'
