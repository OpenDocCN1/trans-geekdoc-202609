- pgno: 224
  md: '# Cloud-Computing Investigation Framework


    217


    # Step 25: Protect the chain of custody.


    Plan and prepare for preservation of the chain of custody with signed, legally
    admissible witness statements.


    Progress to step 26.


    # Step 26: Viewing of cloud-based data.


    Discussions may be undertaken between technical representatives of the requesting
    law enforcement agency and the CSP as to the manner in which the target data may
    be viewed, establishing confidence in the integrity of the evidence. This is of
    particular relevance if the CSP acquires the data using proprietary forensics
    or if the data is stored in a manner where it cannot be viewed with traditional
    applications.


    Progress to step 27.


    # Step 27: Qualifications and skills of digital investigators.


    Evidence of the qualifications and skills of the digital investigator are required
    to be presented to the court as evidence of the accuracy and completeness of the
    evidence. This statement would be sought at the time that the evidence was extracted
    from the CSP’s servers. A forensic examiner may be requested by the court to state
    their qualifications and experience in the field of seizure evidence.


    Progress to step 28.


    The following section progresses the evidence collection process by examining
    the investigative template using the legislation proposed in this thesis from
    the initial application to the courts to seize a suspect’s online account to the
    receipt of evidence from the CSP.


    # Seizure of Evidence


    # Step 28: Physical acquisition of the evidence.


    The physical relocation of the evidence must be planned; through an investigative
    officer going to the target country to collect it from the CSP or law enforcement
    agency that obtained the data. Alternatively, it may be forwarded through a secure
    registered courier or electronic transport where feasible. Always consider the
    preservation of the chain of custody when making this decision.


    Progress to step 29.


    # Step 29: Prepare logistics of obtaining evidence.


    Plan for the receipt of the evidence, as cloud data can be considerable in size
    and require significant amounts of storage. This consideration can be addressed
    in discussions with the CSP, who can advise you as to the amount'
  merge: -1
  img_proc: true
- pgno: 225
  md: 'of data that the court order can produce and how much storage capacity you
    will need.


    Progress to step 30.


    # Step 30: Forensic examination of evidence once obtained.


    Upon receipt of evidence, traditional forensic techniques can be applied depending
    on the format in which the evidence is obtained.

    Proceed to step 31.


    # Step 31: Legality of possession of evidence.


    Considerations need to be made of the nature of the material in the cloud account
    you have successfully sought, you may discover during your examination of it illegal
    material, such as stolen IP, fraudulent identities, stolen credit card numbers,
    or CEM. You should discover this material, seek immediate legal advice and contact
    your local police for direction.

    Progress to step 32.


    # Step 32: Consider the necessity of further court orders or evidence capture.


    Upon review of the evidence, consider whether further court orders are required
    from foreign jurisdictions. The potential exists for further court orders to be
    executed, indicating that the initial application may open new avenues of investigation.

    Should there be a requirement to obtain evidence from an international jurisdiction,
    the law enforcement investigator will return to step 22. If further orders are
    not required, progress to step 33.


    # Step 33: Seek and obtain corroborate evidence.


    Evidence corroborating that from the CSP must be sought where available to increase
    the integrity of the evidence obtained. This may be obtained from open source
    material, evidence from the suspect''s electronic devices, inquiries made in the
    investigating jurisdictions (such as telecommunication/banking records), and so
    on.

    Progress to step 34.


    # Step 34: Review ability to present evidence in court.


    Should the evidence not be able to be supported by way of a witness statement
    and no legal instrument exist to compel a member of the CSP to produce the evidence,
    then the evidence may be accepted by the court within its discretion. Alternatively,
    it may not be acceptable or it may have a reduced standard of value. Review how
    the inability to obtain all the relevant witness statements affects the strength
    of your case.

    Progress to step 35.'
