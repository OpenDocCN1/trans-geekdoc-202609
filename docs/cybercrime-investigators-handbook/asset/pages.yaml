    First we shall examine the makeup of the investigation team.


    # THE INVESTIGATION TEAM


    The members of the scene investigation team are some of the most critical components
    of your investigation, as these are the people who will collect the evidence that
    much of the remainder of your investigation will rely upon. Law enforcement spells
    spend significant time training their officers in scene investigation and management,
    which reflects the fact that these are skills that are continually developed and
    adapted, as all scenes are different in some way.


    # How Many People Do You Need?


    This will be determined by the circumstances of your investigation and the amount
    of time you have available. Be aware that circumstances can change quickly on
    location as more information about the investigation is discovered, and having
    extra staff available is invaluable. While it is preferable to have exactly the
    number of people required, having an additional person available during the initial
    phase of the scene examination until you have a full understanding of the dynamics
    of the situation may be beneficial. If you find you too many people at a location,
    they can always be released to other duties.


    # Determine the Skills Required


    Digital investigators are highly skilled individuals and having one on your team
    is recommended unless you are collecting evidence to deliver the digital investigator
    that has already been preserved. Understanding the skills of your team in areas
    such as interviewing, evidence location, exhibits management, and general searching
    is required pre-event.


    The cybercrime scene may range from a laptop computer to a suite of corporate
    offices. At the physical location, the lead investigator is responsible for maintaining
    the crime scene and the lawful, orderly discovery, seizure, and preservation of
    evidence. As each scene is different, the resources required will differ and be
    managed according to the experience and requirements of the scene manager as well
    as the local rules of evidence.'
