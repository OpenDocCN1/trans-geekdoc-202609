- pgno: 74
  md: '# CHAPTER SEVEN

    Initial Meeting with the

    Complainant


    THE PRE INVESTIGATION meeting seeks to obtain an understanding of the event requiring
    investigation and set the terms of engagement. This is the opportunity to identify
    the known extent of the event and what exactly the client wants from their investigators.
    The initial investigation meeting may cover a lot of ground and needs to be structured
    to allow a full understanding of the event and the role of the investigator.


    People who can be interviewed in this initial stage may include the manager with
    designated responsibility for corporate oversight of the incident response, members
    of the legal team (especially valuable when a suspect is identified within the
    organization), the systems administrator and others responsible for operation
    of the network (internal and external to the organization), and device users.


    # INITIAL DISCUSSION


    In this initial phase of the investigation, the investigators gain an understanding
    of the event and the goals of management. These may change throughout the investigation,
    however, so at the start, the civilian investigators need to have a formal agreement
    in writing as to the expectations of management.'
