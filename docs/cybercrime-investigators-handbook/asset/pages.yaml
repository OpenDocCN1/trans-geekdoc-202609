  img_proc: true
- pgno: 227
  md: '# Preserving Evidence from Cloud-Computing Platforms


    Fellow workers were suspicious of his actions and decided to check his activities.
    As his computer was not logged off they were able to check his email, where they
    discovered he had forwarded the entirety of the company’s IP, conservatively valued
    at $15 million, to his personal cloud-computing account.


    A complaint was immediately made to police and a preservation request was made
    to the CSP with the authority of an MLAT and with the cooperation of the CSP.
    The request sought a copy of the suspect''s cloud account, including metadata.


    The immediate concern of the complainant and police was what the suspect had since
    he''d left the office. As it was sent to a cloud account, it could have moved
    to multiple locations as well as downloading to his home computer and external
    storage devices. Another cause of concern was that competitors were trying to
    obtain the IP of the company, including through an offer to buy the company, and
    if John released the IP to the complainant were ever facing bankruptcy within
    six months.


    As the data was in the suspect''s personal cloud, the complainant and police had
    no access to it to prevent further offenses while the initial phase of the investigation
    was continuing.


    A search warrant was executed on John''s residential address that evening, as
    links could be made between the data theft and his home. John was very surprised
    at police raiding his home and stated that he believed at worst would be liable
    for an Employment Court hearing and not a criminal investigation for the theft
    of $15 million of property. He made a full confession, and despite having the
    law explained he refused to believe that he had done anything wrong (which is
    very common when employees take corporate data when they move to new employment).


    Although he had signed a document at the commencement of his employment stating
    that he had no ownership or rights to the IP he helped to develop, he felt that
    he had a right to copy of it when he left the company. He also liked to keep a
    collection of his best work, which included large volumes of the company IP, for
    his resume.


    An examination of his personal computer devices showed that he had not downloaded
    the IP from the cloud service. An examination of the cloud service showed that
    he had not moved the IP to any other account. An examination of his computer at
    home identified that he had already taken several copies of the company IP over
    the preceding year as well as personnel, salary, board, and management files.


    In this instance, the usual offender motivations were not applicable and the reasons
    for the crime were seen irrational. However, the motives were'
  merge: -1
  img_proc: true
