- pgno: 63
  md: '# Legal Considerations When Planning an Investigation


    ALL INVESTIGATIONS must be conducted with the understanding that the actions of
    the Incident Response (IR) and the investigation teams may be required to be accounted
    for in a court of law should a prosecution commenced against an individual. Even
    when an investigation is conducted for insurance requirements or for management
    information, the investigators must be aware of the potential for a critical review
    at a later date, especially if the investigation identifies the event is far more
    serious than initially thought and the decision is made to refer the matter to
    police or to some another.

    The investigation team''s actions or lack thereof may be subject to question,
    as well as the order of actions taken, evidence handling, and examination procedures.
    For these reasons, investigators must be mindful to operate within the guidelines
    provided, to keep management informed of progress, and to act consistently with
    the laws and rules of evidence within their jurisdiction.

    It may be that a management team requests that an investigation be undertaken
    for their information and understanding of a cyber incident and as the investigation
    develops the breach comes to be identified as falling under the reporting requirements
    of legislation such as state breach notification laws in the United States, Singapore''s
    Cybersecurity Act, Australia''s Privacy Amendment (Notifiable Data Breaches) Act
    2017, or the European Union''s General Data Protection Regulation (GDPR). Alternatively,
    a suspect may be


