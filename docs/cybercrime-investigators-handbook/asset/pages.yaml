- pgno: 45
  md: '# Cybercrime Case I 33


    The skill set of the attacker may vary; however, with the vast array of network
    and attack tools freely available online with support instructions available,
    the threshold in becoming a cybercriminal is very low.


    As mentioned earlier, motivations may make no sense to the complainant or investigator.
    In fact, some motivations may never be uncovered. What is important is that to
    the attacker, the motivation made sense as to commence a criminal offense.


    While the nation state and criminal contractor may be perceived as actors, they
    still have specific motivations to conduct the attacks.


    # CYBERCRIME CASE STUDY I


    The accountant of a business was directed to create false invoices to a financing
    company, which was purchasing the invoices at 80 percent of their face value.


    “Factoring” is a legitimate financing arrangement in which a company sells its
    accounts receivable to a third party at a discount. In this case, the arrangement
    was to provide cash flow to the company in question. The remainder of the funds,
    less a 3 percent fee, was paid to the company the invoice had been paid by the
    debtor.


    The company was in poor financial shape and the factoring company had not made
    a thorough investigation into the financial health of their new client prior to
    agreeing to structure the factoring agreement. the company was creating fake invoices
    to sell to the factoring company. It was also attempting to produce false invoices
    for the investors as well as government tax offices.


    As the company books were required by many sources, including the finance company,
    the owner directed the accountant to create different sets of books for different
    audiences. When the frauds were identified, the company had five sets of books
    located on the company network.


    The digital evidence included logs showing false invoices delivered to the finance
    company that were created by the accountant as well as the owner''s, who would
    create them after hours using their unique identifier and password to access the
    system. He would then create a schedule detailing the false invoices to the accountant
    the following morning for inclusion in the designated set of books. These schedules
    were located on the company owner''s private drive on the network, with logs showing
    no other party had access to this portion of the storage.'
