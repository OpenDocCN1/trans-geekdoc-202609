- pgno: 132
  md: '# Prior to Leaving for the Scene


    In preparation for a successful search, an investigation plan is required so that
    everyone will understand the circumstances of the search/examination, why they
    are there, what they are looking for, what everyone''s tasks are, and the legality
    of their actions. Topics that may be included in preparation for attending the
    scene are covered in the sections that follow.


    # Staff Safety


    Before beginning any scene investigation/examination, consider staff safety, especially
    when attending at a location where a suspect may be present. People realize that
    they have been caught committing a serious offense in many different ways, and
    their reaction sometimes involves violence or seeking to physically destroy evidence.
    Desperate people may make desperate decisions.


    Where feasible, when attending to a business crime scene, speak to management
    and identify whether there are any suspects within the organization and whether
    there are any potential risks to the safety of the investigation team. This may
    include staff members who have a history of violence or poor behavior in the workplace,
    or a history of abusing alcohol, prescription medication, and/or illegal drugs.
    The time spent making inquiries may be seen as an investment in the safety of
    your team, yourself, and any others present.


    # Are There Weapons Present?


    The definition of a weapon is broad and can include any object a person could
    use to cause injury to a member of the IR team, investigation team, or any other
    person. It could be used against any person present as the suspect tries to leave
    the scene.


    Suspects know their homes and workplaces and will occasionally position weapons
    where they can reach if necessary. When searching homes, for reasons unknown,
    many conversations are held in kitchens where knives are present. Ideally, move
    any conversation away from locations where weapons are visible and remove any
    obvious temptations: for example, place knives in a drawer or the dishwasher,
    or secure them with the investigation team as circumstances and experience dictate.


    In a law enforcement environment, police will usually have the authority under
    a court order to restrict the movement of persons at a location where they are
    executing the search warrant. A civil search and seizure order may'
  merge: -1
  img_proc: true
- pgno: 133
  md: 'not contain such authority, requiring search members to ensure their personal
    protection through observation and using their communication skills. If there
    is a potential threat of violence in the execution of a civil search order, consider
    asking police to attend to ensure the safety of all concerned.


    # Pre-search Briefing


    Conduct a pre-search briefing so everyone understands all the circumstances of
    the event under investigation and their roles. Present any safety risks and mitigation
    strategies. Share intelligence about the location, search, evidence, and individuals,
    as well as the known facts of the cybercrime.


    # Legality of Attendance


    Understand and explain the legality of your attendance at the location and your
    actions. This may be by court order or consent of the party under control of the
    location and evidence. Ensure that you and your team understand the powers that
    court orders provide.


    Each country has its own laws regarding search and seizure of evidence, and such
    legislation will provide guidance as to the legality of your actions. For example,
    in the United States the Fourth Amendment to the Constitution provides society
    with safeguards against unreasonable search and seizure.


    # Is the Suspect Likely to Be Present?


    In the initial stages of an investigation, you will likely not know who the suspect
    is or even that person is an internal employee. Many police investigations have
    interviewed the offender in the initial interview phase and did not identify them
    as a potential suspect until weeks later. This is not a failing, as it highlights
    the fact that in the initial stages of an investigation you will have very limited
    knowledge of all the individuals and relationships you will be dealing with. You
    will also have limited evidence to direct your investigation to whom the suspect
    may be or to what the exact details of the offense may be.


    If a person is named as a suspect with evidence supporting this claim, the civilian
    investigator may wish to consider their options. If you are dealing with an investigation
    likely to be referred to police, an option is to leave the suspect interview to
    police, who are highly skilled at suspect interviews. Alternatively, you may interview
    the person if a member of your team has the skills, but remember that you will
    be conducting a suspect interview in a serious matter'
  merge: -1
  img_proc: true
- pgno: 134
  md: 'with limited information, which may mean many valuable questions will not be
    asked. Although this is not always the case, suspects usually only interview once
    and the skilled investigator will want to make sure that they have all the information
    they need. Interviews are discussed in more detail in Chapter 16.


    # Plan for Evidence Control and Capture, and for Preservation of Its Integrity


    As not all scenes you attend will involve an IR team, plan to prevent any person
    from interfering with the evidence. Controlling the movement of people in the
    scene and you will go a long way towards controlling the preservation of the physical
    evidence. When dealing with a situation in which the suspect is possibly present,
    even apparently innocent action as a person using their phone may hinder your
    evidence capture, as they may be sending a prepared code to an associate to destroy
    potential evidence. Ensure the suspect has no direct or indirect access to digital
    devices, including remote access via mobile devices.


    When devices are cloud based, any person can access the service with a mobile
    device. Therefore, while you and your team are at a scene, a suspect or their
    associate could cloud-based services to delete the crucial evidence you are seeking.
    Mobile phones may contain a remote wiping service through features as Find My
    iPhone.


    Plan also to prevent the evidence from being altered in any way. This is particularly
    relevant to volatile digital evidence, such as that in RAM and VMs, that cannot
    be recovered. Discuss this activity with the digital investigator prior to leaving
    for the scene. Evidence may also be lost if a device is closed and the data source
    was on an encrypted volume or device.


    Evidence may also be damaged by innocent actions as storing digital devices near
    liquids or electromagnetic sources. Static electricity may damage digital evidence,
    securing devices in boxes, bags, or Faraday bags will assist in the preservation
    of the integrity of the evidence. Prevent the potential for electromagnetic discharge
    damaging the digital evidence by touching a safe metal object to remove any static
    electricity on your person prior to picking up the digital evidence. In a perfect
    situation, there will be no changes to the status of the evidence obtained: however,
    if there is, document it immediately and explain the reasons why changes were
    made.


    Some suspects especially concerned about the potential of being identified build
    a kill switch into devices, so if law enforcement or another investigator'
  merge: -1
  img_proc: true
- pgno: 135
  md: 'seeks to seize the device as evidence, they can press the kill switch, which
    will delete the data or encrypt the device. This is in effect a panic switch of
    last resort, when the cybercriminal no opportunity to manually defend their device.
    Depending on the circumstances of your search and whether you are attending a
    scene where a suspect is likely to be, this may be a very relevant consideration.


    # What Time of the Day Will the Scene Search Be Conducted?


    The investigation team called into a corporate environment will often attend during
    business hours. This is when the bulk of the employees are present and attending
    to do their daily tasks. The attendance of an IR and investigation team will likely
    cause concern to employees as they see a lot of activity they may have only previously
    seen on TV, such as computers being imaged and friends interviewed, and the general
    dynamics of the IR and investigation teams going about their business.


    There is no set answer to the question of whether you should conduct your investigation
    of a corporate crime scene during business hours or after, as circumstances such
    as working with the IR and the availability of witnesses will drive this decision.
    However, management may request that certain activities, such as interviews, be
    conducted after hours so that witnesses have a clear mind of the distractions
    of their daily duties. This is examined in more detail in Chapter 16. Other issues,
    such as the need for a prompt response and resources availability, will influence
    law enforcement searches.


    # Can the Scene Be Isolated by Bystanders?


    In your preparation to conduct your investigation and examination, you will plan
    for a clear environment in which to work. However, this is not possible, as you
    may create your crime scenes as you find them. Removing everyone away from a location
    so your digital investigator can image devices and other items can be considered
    best practice, but when a company needs to keep operating, you may have to plan
    to work in the environment as best you can while recording notes of the circumstances
    in which you are operating. The civilian client invites the investigation team
    into the workplace, and although you are not in charge of working the scene, management
    may require that the scene not be entirely shut down as you would wish. Law enforcement
    officers responding to a complaint may require a location to be shut down and
    this would be a separate discussion.'
  merge: -1
  img_proc: true
- pgno: 136
  md: '# Prepare for the Possibility of People Arriving at the Scene during the Search


    Crime scenes are dynamic, and it is not an uncommon occurrence for a search to
    be undertaken and for people to walk into the scene pathway through the search.
    Generally this is not a problem, as notes recorded will account for this occurring.
    Particularly in a corporate office, people may arrive from meetings elsewhere
    unaware that an IR and investigation team has been working in the office for the
    past two hours, and will need a short briefing as to what is happening. Prepare
    for this possibility and have a designated officer tasked with meeting and recording
    their details.


    # Be Aware of Any Natural or Other Physical Hazards, Such as Exposed or Damaged
    Electricity Connectors, Rainwater, Leaking Pipes, and the Like


    Not all crime scenes are in professional offices, and the circumstances of your
    investigation will dictate where you work. Suspect''s homes are highly variable,
    and we have discussed potential safety hazards. Be aware of loose or damaged wires
    and other routine hazards, including items spread around a room, insecure flooring,
    and so on. Water leaks are their own danger and magnetic devices may be a hazard
    to digital devices.


    # Have a Provisional Understanding of the Scene Boundaries


    Document the provisional boundaries of the scene to be examined and provide a
    briefing to team members on the nature of the offense, the evidence being looked
    for, the known risks, and those that may occur, and identify the scene exhibits
    officer. This briefing may include what evidence is being seized, which will be
    governed by whether the search is consent (as in the case of a complainant) or
    under the authority of a court order (such as when searching a suspect''s resident
    or location of business).


    # Designate Team Roles


    As discussed previously, ensure that all team members have been briefed on the
    safe way to handle digital evidence; alternatively, have team members locate digital
    exhibits and the designated exhibits officer (who is trained in digital evidence
    seizure) physically secure exhibits. Ensure they have the resources to undertake
    their duties.'
  merge: -1
  img_proc: true
- pgno: 137
  md: 'Identify an exhibits officer who will handle evidence from inception to presentation
    in court. This may be their only duty on a large team, or this responsibility
    may be delegated in conjunction with other duties on smaller teams. Do not neglect
    the potential consequences of poor evidence-handling procedures.


    # Understand and Obey the Rules of Evidence


    Even if this is a regular feature of your work, ensuring a competency in updated
    legislation and case law is advantageous.


    # Work within the Boundaries of Your Knowledge


    No one is an expert on everything, so do not afraid to ask for assistance. It
    is not a sign of weakness to ask others, even more junior staff, for advice. You
    engage specialists to assist in the search/examination, allow them to do their
    jobs without a need to display authority. This applies to briefings as well attendance
    at the scene.


    # Plan for Dealing with Large Volumes of Online Data to Be Seized


    For example, downloading terabytes of data from cloud servers takes a very long
    time, even on high-quality networks. To ensure the chain of custody, experienced
    digital investigator will be required to be present, or have a methodology available
    to prove that no person had the capacity to interfere and denigrate the quality
    of the evidence. This question can be decided in discussions with the complainant
    using the benefit of your experience. Note the reasons why evidence was not collected
    and be prepared to be challenged in court should potential evidence not be collected
    because of the cost involved.


    Live capture should be used to record data as it moves through a network without
    shutting the network down. This is particularly valuable in circumstances where
    a business needs to continue operating while the IR and investigators operate.


    Any examination of digital evidence should be by a qualified digital investigator.
    There have been many cases where investigators have had a “quick look” at a device
    to see if evidence is there, which changes log files within the device.


    # What Evidence Not to Collect


    There is a cost of collecting digital evidence, and it may take significant time,
    resources, and expense to collect evidence lawfully from cloud servers. A decision
    about how much evidence should be seized and what to leave behind'
  merge: -1
  img_proc: true
- pgno: 138
  md: '# 130 Investigating the Cybercrime Scene


    not capture needs to be made. This is a very difficult balancing act, as what
    you leave behind may be the very evidence defense counsel decides to be the crucial
    evidence that would clear their client. Having team members on site incurs significant
    costs, especially with experienced digital investigators.


    Once you have planned for the search/examination, the next process is attendance
    at the location.


    # Scene Action by Investigators


    The actual scene examination covers the principles and strategies included in
    the preceding section: however, we now look at the actual examination of the lead
    investigator will direct. As we mentioned earlier, the location where a criminal
    offense occurs is a crime scene, so the event ultimately end up in a court of
    law will be held to the same level of accountability regarding evidence location,
    seizure, collection, handling, and examination as any detective.


    While we think that the cybercrime scene will be an office, it could be a person''s
    device if an employee was working from home. It could be a location external to
    the business if the company has outsourced its information technology to a specialist
    company. As another option, the scene could be located in a vehicle placed by
    a suspect. As we discuss in Chapter 12, the crime scene could be a cloud-computing
    service. In these cases, your response may be guided by the legal contracts and
    service agreements with the third party or cloud-computing providing.


    Should your search be at a large corporate office, break the search area into
    components and assign these components to your team members, recording who is
    assigned to which component. One of searching a designated area is to search in
    a clockwise direction after designating a specific point as the location to commence
    your search. This may be the left-hand side of a specific desk and covering all
    the area to a specific filing cabinet, where the adjacent search team is communicating
    their search.


    While searching desks and cabinets, do not forget to search floors, under desks,
    and the floor under cabinets and the above these items. It may be that it makes
    no sense for valuable data to be stored in a particular location (such as the
    one under a filing cabinet), it may make perfect sense to the person who was in
    possession of the incriminating data and looking for a place people would not
    bother looking at it as it was unlikely or difficult to move. Remember, the motivation
    of the person hiding the evidence may be greater than members of the search team
    to find it, as they are facing a potential term of imprisonment should the key
    evidence against them be located.'
  merge: -1
  img_proc: true
- pgno: 139
  md: '# Scene Investigation 131


    Evidence identification and preservation are primary considerations and respect
    for the rules of evidence of the jurisdiction(s) you are working in to be a primary
    goal of the investigation. The end game for initial action in a cybercrime scene
    or when seizing a digital device containing potential evidence is a court where
    the rules of evidence will be applied to your actions. You will be held to the
    same standards as those for the investigation of a serious crime, in which a qualified
    detective locates, preserves, seizes, and examines evidence.


    From the beginning, the cyber investigator will have many duties to perform not
    only of the event they are investigating, but the crime scene, its dynamic nature,
    and locations of potential evidence. The initial interview with the complainant,
    as detailed in Chapter 7, may provide some of this information, but it is just
    likely that the manager providing the briefing has little understanding as to
    what has taken place. As the investigator takes control of the scene and commences
    the crime scene management, it is worth remembering that every action they take
    and every decision made may be subject to questioning in court several years later
    should suspect be identified and prosecuted in a civil or criminal court. In this
    instance, the volumes of notes recorded during the examination will be very valuable
    source of assistance in refreshing your memory as what was done, when, and by
    whose authority.


    # On-Scene Safety Assessment


    As has been mentioned previously, safety is a paramount consideration through
    all aspects of the search/examination. The team leaders as well as all team members
    will be constantly assessing it. On scene, safety assessment does not start and
    finish when you arrive at the location. It is to be constantly evaluated through
    the scene and it is not a responsibility owned by senior members of the team but
    by all team members.


    From the start, you will ensure the safety of staff at the scene. Digital crimes
    may not carry the same perceived level of threat to investigators as a drug raid,
    risks may still exist. As we have mentioned, cornered suspects sometimes make
    panicked decisions. For example, should the cybercriminal be discovered to be
    an internal staff member stealing IP; there is no telling what their actions may
    be, including potentially assaulting members of the investigation team, once they
    see they have identified.


    Also understand when attending at a suspect''s address with a court order to search
    for, locate, and seize evidence, they will commonly feel threatened. Being in
    their home is invading the location they feel most secure and a'
  merge: -1
  img_proc: true
- pgno: 140
  md: '# Investigating the Cybercrime Scene


    search team arriving may be seen as very threatening and challenging. A house
    is full of potential weapons and the suspect knows where they all are, ranging
    from knives in kitchens and other rooms to firearms hidden through the house.


    # Introduce Yourself and the Team to All Required Persons


    If attending by the authority of a court order, ensure it is present and is available
    for viewing, as required by the laws of your jurisdiction. As required, provide
    safeguards to suspects, such as a right to silence, access to legal advice, and
    the ability to contact your union representative. These will also be guided by
    the legislation in your jurisdiction.


    If by consent, meet with the person who invited you. Chapter 7 identifies areas
    of interest to discuss with the complainant and Chapter 16 discusses areas to
    discuss with suspects and witnesses. Continue to conduct threat analysis at all
    stages as long as you are at the location.


    # Control Activity


    When arriving at the location, control the scene, people, and access to evidence.
    As discussed previously, this will vary depending upon the circumstances of your
    presence, as you will not be as direct with the staff of the complainant as you
    would with a suspect.


    # Photograph the Scene and Evidence Located


    Taking a series of photographs of the crime scene when it is first located allows
    a potential judge and jury to understand the layout of the scene and where the
    evidence was located. It also serves as a memory prompt to the investigator who
    should be required to give evidence in a future court hearing.


    As further evidence is located throughout the scene, photograph it in situ (where
    it is) before moving. Link all evidence seized to the exact location it was found.
    This is a valuable investigation tool and shows suspects before they have time
    to react to what is happening.


    Avoid using your own phone, as in some jurisdictions defense may subpoena your
    phone to extract their own copy of the images.


    When dealing with a suspect device, recording what is on the screen may be a valuable
    source of evidence. It should be a suspect''s computer, seeing windows are open
    and what can be seen without clicking on links may provide direction to an investigation
    and to the location of future evidence. For'
  merge: -1
  img_proc: true
- pgno: 141
  md: 'example, a suspect''s computer may be open to a webmail account that no one
    knew about or a victim''s computer may show a ransomware demand.


    List what is attached to a suspect device, such as Ethernet cables, a mouse, a
    keyboard, and storage devices. If necessary, draw a configuration diagram showing
    how devices are connected to the network. Record unique identifiers for devices,
    such as model, and serial numbers.


    Photograph all cords and connections to the device. Seize the cords and chargers,
    especially when the device is uncommon. The digital investigator may need to charge
    the device back in the office and not have the required charger. Tag all devices
    so you can remember which cables belong to which device.


    # Fingerprinting of Evidence


    Depending on the case, evidence may need to be fingerprinted. This is a specialist
    process in law enforcement and specialist officers undertake these duties. At
    the scene, if an item of evidence needs to be fingerprinted, use gloves and pick
    up the item by the edges at places least likely to have been touched by an offender.
    Secure the item so that no other team member can touch it and mark the bag with
    a label such as "Exhibit to be fingerprinted" prior to securing it in order to
    alert all team members that the exhibit should be treated with particular care.


    # Document All Activity


    Crime scenes can be chaotic places, with decisions made on the run as preserving
    evidence, interviewing witnesses, and controlling the scene. Decisions made in
    the head of the moment may be correct with the very limited information available,
    but later prove to be incorrect once more information becomes available. While
    everyone has 20/20 vision once an event is under control and all the information
    is available, the scene investigator does not have the luxury of postponing all
    decisions until all information is available and has to work with what they have
    and balance that their experience.


    If a decision made at the head of the moment proves incorrect, documentation recorded
    at the time will show it was made with limited information and in good faith,
    and that it may have been a prudent decision at the time given limited information
    available. Detailed notes not have been recorded throughout the decision-making
    process, justifying what time shows has been an incorrect decision leaves the
    investigator open to claims of incompetence or of deliberately destroying evidence.'
  merge: -1
  img_proc: true
- pgno: 142
  md: '# Understand the Requirements of an Investigation


    In the initial briefing with management, understand exactly what they want you
    to do and the boundaries they want you to operate within. While there is always
    the presumption investigation may end up in a courtroom, a manager should be able
    to tell you exactly what they investigated. For example, they may only want you
    to investigate the intrusion against the web server and not spend any time looking
    at the email server, which they believe, was not affected in an attack.


    As a civil investigator, the initial terms of engagement document present the
    boundaries of the investigation and related information, such as time available,
    internal support available, and so on.


    # Managerial Support, Including Human Resources and Legal


    At a corporate scene, having the support of management eases the pathway for the
    investigator. They can provide prompt decisions, allocation of resources, access
    to key staff, and refine the boundaries of the investigation as the need dictates.


    As the search is being undertaken, make the effort to keep channels open between
    managers and the investigators undertaking the search. They will be interested
    to get any feedback regarding the value of evidence they are seizing and whether
    there are any new avenues of originating from the search. This also helps in keeping
    the searchers motivated, knowing their work is valued and contributing to the
    overall investigation.


    The HR department and legal officers in the organization have access to very valuable
    information when you are investigating an incident involving an internal suspect.


    # Allow for the Continuation of the Business of the Client Evidence Is Being Collected


    Few businesses will want to close down while the cyber investigation is undertaken,
    as offline costs money. Also, internal investigations can be very intrusive and
    disruptive to staff members, who may have concerns to the future of the company.
    It is the role of the investigator to discuss these matters with a senior manager
    to plan a response to allow a client to continue trading while the investigation
    is undertaken.


    Explain to the staff what is going on and the need for their cooperation. Explain
    why certain activity, such as the imaging of computers, is going on. If you do
    not explain to staff what is happening and, rumors will start,'
  merge: -1
  img_proc: true
- pgno: 143
  md: 'people will develop their own theories and their level of cooperation may be
    reduced.


    # Confirm the Location of the Offense within the Larger Scene


    Confirm exactly where the crime scene is. It may be a physical location, such
    as a computer on a desk in an office, an internal network, or a cloud server located
    in a foreign legal jurisdiction.


    In some locations, the area to be searched may be a large office containing a
    series of offices along a hallway. Each needs to be treated as potential locations
    of evidence and defined such as. An action as simple as that in Figure 10.7 clearly
    defines an office on the scene map and can be linked to evidence within it.


    Just because you are conducting a high-tech investigation does not mean a low-tech
    solution cannot be very effective. Use it when necessary.


    # Methodical Search


    Methodically search the location and find the evidence and record details of the
    search and exhibit seizure.


    ![](img/72f0382a5bc36845e84220db7d6f6b77_143_0.png)


    **FIGURE 10.7** Identifier of hallway office.

