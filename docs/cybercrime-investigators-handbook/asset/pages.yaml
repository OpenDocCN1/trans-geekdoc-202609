- pgno: 124
  md: '# Evidence Capture and Handling


    Digital evidence capture is the art of lawfully seizing evidence from a digital
    device in a manner that will be accepted by the court for relevancy, complete-,
    and accuracy. Evidence is captured for the purpose of providing direction to an
    investigation, and when relevant, proving an ingredient of the charges before
    the court. Once digital evidence has been captured, it must be preserved in such
    a manner that the court can be assured of its authenticity and reliability. The
    evidence should be captured and preserved in a manner that is not consistent with
    the laws of evidence that jurisdiction, the risk exists that the court will not
    accept the evidence or reluctantly and with reservations, downgrading its value.


    As legal jurisdiction has its own laws and precedents, this chapter will only
    provide a general overview of evidence capture and handling. It is the responsibility
    of the investigator and scene examiner to understand the laws and precedents of
    any jurisdiction in which they are operating.


    The International Organization for Standardization (ISO) and the International
    Electrotechnical Commission (IEC) has produced standard ISO/IEC 27037:2012. Information
    Technology—Security Techniques—Guidelines for Identification, Collection, Acquisition
    and Preservation of Digital Evidence, which identifies the initial handling processes
    for digital evidence.² These processes relate to:


    +   - Identification of potential digital evidence

    - Collection of potential digital evidence

    - Acquisition of potential digital evidence

    - Preservation of potential digital evidence


    This ISO/IEC standard identifies four procedures to ensure that the integrity
    and reliability of potential digital evidence is maintained by following a series
    of fundamental principles.² are:


    +   - Minimize the handling of original digital devices and digital evidence.

    - Account for any changes and document any actions taken.

    - Comply with the local rules of evidence.

    - The investigators should not take any actions beyond their level of competence.


    As you review these procedures, you will notice that they are very similar to
    the ACPO principles introduced in Chapter 6 under “Protecting Digital Evidence.”'
  merge: -1
  img_proc: true
- pgno: 125
  md: '# Technical Items 117


    We have discussed that the location of a cyber incident may be viewed as a crime
    scene by the court that ultimately hears a prosecution. The rules of evidence
    require that the digital evidence be treated with the same care and respect as
    evidence from a homicide scene, as the legal rules of evidence for both crime
    types are the same, although the offenses are obviously very different in nature
    and seriousness. Whoever presents evidence in a court is required to account for
    it to the required standard, with the integrity of the evidence being critical
    consideration.


    All data capture and handling must be consistent with the local rules of evidence
    of the relevant legal jurisdiction(s). Due to digital evidence being resident
    across multiple legal jurisdictions, as is the case with cloud servers, there
    may be jurisdictions, requiring that local rules of evidence and laws of seizure
    in each be adhered to. As the potential exists to be questioned in court regarding
    theality of the data capture methodologies used, the digital crimes investigator
    will need to make inquiries with lawyers to ensure the laws of each jurisdiction
    are respected.


    The cybercrime will provide both digital and physical evidence. A schedule of
    the potential evidence the investigator may locate discussed earlier in this section,
    and illustrated in Figure 10.3. The digital evidence may be captured from a device,
    network, or through online sources. Each will potentially provide evidence and
    further avenues of inquiry.


    The IR plan prepared by an entity pre-event will cover many components of the
    response to an incident or perceived threat. As previously mentioned, the first
    priority of the IR Team may be to mitigate and attack, but such an approach may
    likely involve the destruction of valuable digital evidence that may be required
    for the review phase of the IR plan, management briefing, or prosecution once
    a suspect has been identified. In this instance, the IR team lead, who makes such
    decisions, must document the reasons for taking actions that destroy potentially
    valuable evidence and the environment that existed at that moment the decision
    was made. In hindsight their decision may turn out to be correct, but it needs
    to be accounted for in case their actions are challenged.


    As the investigator examines the scene and potential evidence, special care and
    priority must go to understanding the volatility of the digital evidence, especially
    as the cybercriminal may still have physical or remote access to the device or
    network and begin destroying the evidence once they realize that they have been
    discovered. Also, as devices are shut down, potential evidence in memory will
    be lost. Depending on storage capabilities, logs may be overwritten.'
  merge: -1
  img_proc: true
- pgno: 126
  md: '# Investigating the Cybercrime Scene


    Digital investigators undertake specialist training in how to seize digital evidence
    in a forensically sound manner. They will also generally have a strong understanding
    of the rules of evidence of jurisdiction and its requirements to account not only
    for the possession of the evidence but how it was obtained and preserved. The
    lead investigator must confirm the skills and qualifications of the digital investigator
    to ensure that they are qualified to undertake the tasks designated. As there
    are many forensic tools available for digital evidence capture, ensure that the
    digital investigator is qualified to use the tools they''re using and will be
    able to account for their expertise should they be required in a court of law.
    Examples of digital examination tools include Forensic Toolkit, EnCase, and those
    from Celebrite.


    In larger corporations or cloud server services, the forensic tools used may be
    proprietary to that that they have been designed internally and have never been
    subject to independent peer review. Identify whether the forensic software used
    has been independently validated against proprietary infrastructure, such as cloud
    servers.


    It is preferable to have a qualified digital investigator present when seizing
    digital evidence, but this may not be the case in every instance. For example,
    you may attend to a scene where the evidence has been collected by the system
    administrator and stored on an external device. Alternatively, the investigator
    may be at a scene of a traditional investigation where there was no perception
    that digital evidence were going to be seized, when digital evidence they were
    unaware existed was located at the scene. This can extend to discovery when investigating
    related to an unrelated offense, such as a drug possession matter from a vendor
    on the criminal markets is located on a computer.


    To assist with the capture and handling of digital evidence, ensure that the digital
    investigator is provided with a full briefing of the facts of the case before
    their attendance at the scene, ensuring that they know what they are trying to
    achieve and the investigation boundaries they are likely to encounter.


    Having introduced the principles of evidence, the following section discusses
    how these principles should be identified and managed using the ISO/IEC 27037:2012
    framework as a guide.²


    # Identification of Evidence


    Identifying what may be an exhibit is not necessarily always clear cut. Cybercrime
    scenes come in many shapes and sizes, and exhibits do as well. Earlier in'
  merge: -1
  img_proc: true
- pgno: 127
  md: '# Technical Items


    # 119


    this chapter we identified examples of the different types of digital evidence
    that may exist; however, it is rare that all will be relevant to all investigations.


    Members of the investigation team will be briefed before entering the scene not
    only about the event that has brought them there but also which exhibits may contain
    evidence. However, as experienced scene investigator will explain, chance findings
    or leads followed up on the initial lead may lead to further exhibits being located
    that were originally thought to be irrelevant or not thought of at all. Understand
    what you are able to seize by consent or court order.


    Investigators must keep their mind open while conducting the scene investigation
    and identification of exhibits. While a court order may restrict what exactly
    can be taken from a suspect in the complainant’s scene, evidence may be taken
    with the consent of the owner. However, beware if the suspect is an internal employee,
    as seizing personal property (such as their mobile phone) or conducting a search
    of their desk may require legal consideration and direction from the company lawyers.
    Bringing Your Own Device (BYOD) policies are particularly troublesome, as the
    device itself is owned by the employee with data and potential evidence belonging
    to the corporation resident upon it. If the suspect has committed the alleged
    crime using a BYOD computer, seeking early legal advice would be very advantageous
    to the investigation team. Looking in the employment agreement with the user may
    provide some guidance as managing BYODs and the corporate data on.


    The evidence identified may be physical, as a computer device, or logical, as
    data captured over a network communication channel. For computer devices, identify
    and record the time on the devices, including time zones, as this will allow for
    synchronization of digital evidence, especially logs.


    Once evidence has been identified, it must next be collected.


    # Collection of Digital Evidence


    As we have discussed, evidence collected from a cybercrime scene must be relevant
    to the investigation, legal to possess, and seized with lawful authority (such
    as a court order or consent). An example of evidence that it would not be legal
    to possess would be a computer that has evidence of the crime being investigated
    (such as data theft) that later is identified to have Child Exploitation Material
    (CEM) stored on it. In this instance, contact police immediately for their advice
    and action. Should a device or other potential evidence not be seized, note the
    reasons.


    Be aware of staff member safety when conducting a seizure of evidence, including
    when dealing with electrical devices. The physical location may'
  merge: -1
  img_proc: true
- pgno: 128
  md: '# Investigating the Cybercrime Scene


    a hazard, such as might be the case with the room in a suspect''s home where the
    subject devices are being seized. As mentioned previously, cases exist of offenders
    hiding weapons in their rooms. Also electrical leads may be in poor condition,
    leading to the potential for a team member to be electrocuted or the room having
    loose flooring.


    As exhibits are collected, the competence and experience of investigators in the
    roles they are undertaking. Role of exhibit manager, for example, is critical
    to any investigation, and the control of evidence from the commencement of a search
    to presentation to the court relies upon the competence and accuracy of the exhibits
    officer.


    Once evidence has been seized, it is the responsibility of the investigation lead
    to maintain its security and integrity. The next topic is acquiring digital evidence
    from a network or from an operating physical device, such as a server or desktop
    computer.


    # Acquisition of Digital Evidence


    Acquiring evidence involves capturing a local or digital copy of the evidence
    from a network or physical device. A suitably trained and qualified person who
    knows exactly what they are doing be the only person who does this.


    The European Convention on Cybercrime allows for the capture of digital evidence
    that is in plain view (check to see what your local legislation allows).³ An is
    the capture of a web page that is not restricted to view. This may be recorded
    and used as evidence using a program such as Microsoft''s Expression Encoder or
    a web browser plugin. Once captured, it becomes evidence as much as any other
    item seized and should be documented and preserved.


    As with a member of the IR team, the role of the digital examiner is a specialist
    role, and this book does not seek to define it in detail; many other books and
    courses can provide such a definition.


    While investigators would like to seize every piece of digital evidence available,
    this may not be possible as the IR team contains and eradicate the threat. As
    cyber events come in many different forms and levels of severity, it is not possible
    to provide a working template to cover all the needs of the IR team and investigators.
    Communication and mutual respect for each other''s roles will smooth any conflicts
    in this area. Be aware that you may be operating in a highly volatile environment
    in which corporate data is lost and networks further infected by malicious software,
    meaning your requirements as an investigator may be placed behind protecting the
    network by the corporate decision makers.'
  merge: -1
  img_proc: true
- pgno: 129
  md: 'Plan also to prevent the evidence from being altered in any way. This is particularly
    relevant to volatile digital evidence such as in Random Access Memory (RAM) and
    Virtual Machines (VMS) where the evidence cannot be recovered. Discuss this activity
    with the digital investigator prior to leaving for the scene. Evidence may also
    be lost if a device is closed and the data sought was in an encrypted volume or
    device.


    # Identify the Order of Volatility of Digital Evidence


    Digital evidence may be lost through routine events, such as logs being overwritten
    and memory being shut down. A web browser that does not record logs will lose
    any trace evidence if it be shut down, including what the user had been looking
    at. Identify the evidence that may be subject to such a loss and plan its capture
    with your forensic examiner.


    An example of an order of volatility as provided by the Australian Computer Emergency
    Response (AusCERT) team is:⁴


    +   1. Registers and cache

    2. Routing tables

    3. ARP (Address Resolution Protocol) cache

    4. Process table

    5. Kernel statistics and module

    6. Main memory

    7. Temporary file systems

    8. Secondary memory

    9. Router configuration

    10. Network topology


    A suggested process of electronic evidence in situ (where it is), including capturing
    images on screen.


    +   1. Photograph the evidence in situ (where it is)

    2. Identify the order of volatility and follow guidance from the digital investigator.

    3. Allow the digital evidence investigator to secure the volatile evidence.

    4. Keep the communication flowing from all sources, such as the IR team, scene
    manager, other searchers, and any other involved personnel.

    5. Locate passwords and the like from the device or network owner/operator, sticky
    notes on walls, notebooks, and other locations. The ability to view data on suspect''s
    devices may rely upon your work at the scene.'
  merge: -1
  img_proc: true
- pgno: 130
  md: '# Investigating the Cybercrime Scene


    +   6. If the device is on, do not turn it off without the direction of the digital
    investigator. If it is off, leave it off and secure it as a physical exhibit.

    7. Where appropriate, remove network access from the device if it is on so remote
    action cannot affect it.

    8. If there is a suspicion that a device is destroying evidence based on a command
    given by a suspect, external party, or other condition, seek the advice of the
    digital investigator; otherwise, crash the device by removing the power. This
    is a decision that can only be made in the individual circumstances.

    9. Record all identifiers on devices, such as serial numbers, model and brand
    names, existing damage to the device, and even other identifiers (such as personal
    stickers) that can later be used to confirm the device was found at a specific
    location and under the possession of a specific person.

    10. Keep devices away from anything that can damage the integrity of the stored
    data, such as water, electromagnetic discharge, and remote network access.

    11. Codes and manuals are also valuable, as they will assist the digital investigator
    when back in their laboratory.

    12. Document all your actions and ensure the exhibits officer is aware of all
    evidence being taken. Each item is to have a unique identifier attached to it.


    Once evidence has been collected and captured, it must be preserved be able to
    maintain its integrity and prove its authenticity.


    # Preservation of Evidence


    Preservation of evidence—protecting it from loss, damage, or tampering—is a key
    responsibility of members of the scene team. This is everybody''s responsibility.
    Whatever activity is taken regarding the exhibits from the time of discovery through
    presentation in court must be recorded. The team must also be able to explain
    to the satisfaction of the court why the evidence can be relied on and is in the
    same state when discovered by explaining the maintenance of its integrity and
    authenticity, including the chain of custody.


    A key task is to record the team member who located the exhibit, where it was
    found, and who seized it. The person locating it may be different from the person
    formally seizing it for examination, and it may help in smaller searches if one
    team member is designated as an exhibits officer who seizes all'
