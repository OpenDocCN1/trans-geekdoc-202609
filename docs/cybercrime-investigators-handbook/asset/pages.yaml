- pgno: 57
  md: '# # CHAPTER FIVE

    Commencing a Cybercrime Investigation


    The main goals in any investigation are to follow the trails that offenders leave
    during the commission of a crime and to tie the perpetrators to the victims and
    the crime scene.¹


    THIS CHAPTER provides guidelines that may be used to investigate cyber events
    that originate either internally or externally to an organization. It is only
    a guide and will need to be applied to the unique circumstances of each organization,
    legal environment, type of event under investigation, potential evidence available,
    and level of investigation required by the client. The investigation plans developed
    using this knowledge may be merged into an Incident Response (IR) plan or sit
    parallel to it, with a designated investigation manager working in partnership
    with the IR lead.


    # WHY INVESTIGATE A CYBERCRIME?


    Conducting a cyber investigation may be initiated for many reasons and not just
    to find out who the bad guy is and prosecute. Some reasons include identifying
    where weaknesses in systems are, how they were exploited, how to'
  merge: -1
  img_proc: true
- pgno: 58
  md: '# Commencing a Cybercrime Investigation


    tighten security, and developing training packages for staff to make them more
    aware of cyber safety. Clients who have their data stolen may want answers to
    the severity of the attack, and should the data stolen belong to another party,
    there is the potential for litigation to follow. A final reason is that cyber
    insurers may want to know whether there security failures that allowed the attack
    to occur or if system flows magnified the attack.


    Of the number of cyber-attacks occurring each year, few are reported to police
    or even internally investigated. The main focus is to fix the problem, make sure
    it does not happen again, and get back to business. While this may make sense
    to managers, it provides a platform for the near-perfect crime by the cyber-attacker.
    Break into a company, steal what you want, and do as much damage as you want,
    safe in the knowledge that the company will never report to police or even try
    to find out who you are. There is no real weakness in this criminal business model.


    # THE CYBER INVESTIGATOR


    The role of the cyber investigator is different from that of the IR team. The
    investigator is like the detective at the homicide scene. The lead detective directs
    the investigation, including tasked experts to perform photography, scientific
    examination, area inquiries, forensic examination of exhibits, ballistic examination,
    interviews, and so on at the scene. The investigator does not have to be an expert
    in each of these fields, but be able to direct the experts, and be able to understand
    the relevance of the evidence each produces, which will lead to further lines
    of inquiry. Whereas on television a cyber investigator may be an expert on everything
    digital they see and touch, in a real-world investigation this is not even close
    to reality. There is just much technology; it is constantly changing and no one
    person is an expert on everything.


    # MANAGEMENT SUPPORT


    When the decision is to conduct an investigation after a cyber event, the appropriate
    levels of management within the organization must provide authority and active
    support. This will include financing in the case of a civil investigation, as
    well as authorizing appropriate staff members to provide'
  merge: -1
  img_proc: true
- pgno: 59
  md: 'evidence and statements, and organizing members of the internal/external IR
    teams to assist in the investigation. The IR team may be tasked with providing
    copies of notes taken, explaining reasons for actions taken, supplying copies
    of digital files, and cooperating fully in the recording of a statement for referral
    to law enforcement or for internal use. This may need to be a part of the terms
    of engagement between the client and the IR team.


    Whether the complaint initially reveals civil or criminal, in planning the investigation
    investigator will be operating within the boundaries outlined by the client/complainant.
    However, these boundaries may change if the investigation reveals that the cyber
    event is significantly larger than initially believed and senior management believes
    the investigation should be expanded. An investigation operating within the initial
    boundaries defined identifies the cybercriminal as a trusted employee in the organization,
    there may be strong evidence to support civil litigation or a referral to police.


    An investigator operating within the initial boundaries defined must be aware
    that the terms of engagement may subsequently change, and the evidence identification
    and collection strategies may become subject to future scrutiny. Consequently,
    evidence identified and collected must be always treated as valuable and accountable,
    in a so-called "for management information only" investigation.


    Digital evidence can be the target of the crime, an instrument of the crime, or
    something of evidence that documents the crime itself. Digital evidence may be
    highly volatile, and the actions of IR team members, who are required to mitigate
    and eradicate an attack, may limit the potential to undertake a complete investigation
    in which all potential evidence may be legally and forensically obtained and seized.
    In fact, the roles of the IR and the investigation team leads may be regularly
    in conflict, as the IR lead seeks to protect the network and its data while the
    investigation lead seeks to preserve secure evidence to progress post-event investigations.
    While each event will be different, the understanding of each other''s roles and
    responsibilities, accompanied with respectful communication, will assist in managing
    a high-stress environment and competing responsibilities.


    In an ideal world, the threshold for the form of cyber event requiring an investigation
    to commence will have been determined by senior management prior to an event occurring.
    This may be governed by internal policy or by legislation, such as data breach
    reporting legislation. However, in reality, few companies have made such a determination.
    Therefore, it is helpful to determine exactly what a cyber event is before we
    discuss in how'
  merge: -1
  img_proc: true
- pgno: 60
  md: 'investigate it. The United States National Institute of Standards and Technology
    (NIST) describes it as:


    > > [An] identified occurrence of a system, service or network state, indicating
    a possible breach of information security policy or failure of safeguards, or
    a previously unknown situation that may be relevant to security.²2


    When called to the scene of a cyber event as an investigator, speak to the system
    administrator to see if a previous documented event has occurred that may be used
    to provide some direction to the new investigation. A previous incident may have
    attempts by the attacker to map the system or find ways to break through the differing
    levels of security and provide evidence of how the crime was committed. It will
    also be beneficial to the external investigator to understand the nature of the
    business, which fits in the marketplace, and the information in the organization
    that would be most valuable to an attacker.


    When an IR team arrives at the scene of a cyber event, they need to assume from
    the start that the event is continuing.² This is more complex in cloud-computing
    environment, as access to evidence of the event is restricted by the nature of
    the service the complainant has. The infrastructure of a cloud platform may be
    made up of different infrastructure providers, meaning access to evidence may
    be restricted and therefore time consuming to collect. Cloud-computing investigations
    are discussed in detail in Chapter 12.


    # IS THERE A RESPONSIBILITY TO TRY TO GET THE DATA BACK?


    A question to be considered by directors is if the company has its Intellectual
    Property (IP), customer, or files stolen, is it a natural or rational decision
    to attempt to get them back prior to their being exploited? Would a shareholder
    expect the directors to seek to investigate the matter and try to get the data
    back before it is exploited, or at the very least refer the matter to police?


    Currently there are very few referrals to police in these instances, as entities
    typically instead seek to bolster their defenses and ensure the breach does not
    reoccur. The prospect of investigating the matter and referring the matter to
    police raises the potential for public disclosure of the breach and the'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'reputational damage that follows. Consequently, the cybercriminal operates
    within a secure environment where they understand they may attack any corporation
    they wish and will make any effort to identify the attacker or refer the matter
    to police. For the cybercriminal, this is truly a best-case scenario.


    # CYBERCRIME CASE STUDY


    Bill (not his real name) was an employee of a web host who was a system administrator
    as well as being involved in the development of clients'' web pages. Bill had
    a very hostile attitude towards his boss, the company owner, whom he considered
    to be an inferior program coder. Bill felt he was unanticipated and deserved a
    significantly higher salary to reflect his importance to the company.


    After resigning, Bill went home and launched a series of technical attacks against
    his former employer. These included the company''s resources to attack other companies—including
    a Denial of Service (DoS)—downloading pornography from the company''s Internet
    address, and deleting all the clients'' web pages and the backups from the web
    server.


    The victim of the attacker suffered reputational damage, as their Internet provider
    cut their Internet access due to the attacks on other companies. The company was
    also charged for the excessive data usage used in the attacks.


    When arrested, Bill explained he was very angry at his former employer and felt
    his actions were justified. He pleaded guilty to the offenses in court. An examination
    of his computers located corroborated evidence as well as Child Exploitation Material
    (CEM), leading to further charges and convictions.


    Chapter 6 will identify and discuss some of the legal considerations the investigation
    must understand. The discussion is neutral and covers a range of the main concepts
    the investigation must operate within. As legal jurisdictions have different legislation
    and courts provide different case law for guidance, it is the role of the investigator
    to understand the laws of the jurisdiction they operate within. This extends to
    multijurisdictional investigations, as what is legal activity in one jurisdiction
    may be a criminal offense in another jurisdiction they are operating in. For specific
    examples of these hazards we see Chapter 12, which discusses cloud-computing investigations
    and highlights the main legal and technical problems investigations will face
    when cloud-computing servers and the evidence they store are located across many
    jurisdictions.'
  merge: -1
  img_proc: true
