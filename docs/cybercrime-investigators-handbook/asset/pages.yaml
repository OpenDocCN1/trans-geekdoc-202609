- pgno: 174
  md: '# Identifying, Seizing, and Preserving Evidence from Cloud-Computing Platforms


    AS YOU read this chapter, you will notice a slight change in the writing style,
    with more instances of academic referencing. This is because part of the knowledge
    in this chapter originates from my doctoral thesis "Investigating Cybercrime in
    a Cloud Computing Environment" as well as the learned practical knowledge of investigating
    cybercrime in this environment. Whereas the majority of the knowledge included
    in other chapters in this book originated from many years of conducting financial
    and cybercrime investigations, as some knowledge originated from academic sources,
    it is appropriate to reference where the knowledge came from and acknowledge other
    people''s work in this field.


    # WHAT IS CLOUD COMPUTING?


    Cloud computing is the name used for an increasingly common method of storing
    data of personal and corporate users. Once all data storage was in devices that
    were physically accessible, such as computers, external hard drives, USB devices,
    DVDs, and now storage devices are owned, operated, and secured by external companies
    who may manage all aspects of the operation on behalf of their clients, usually
    from foreign legal jurisdictions.


    Cybercrime Investigators Handbook, First Edition. Graeme Edwards,Ph.D.

    © 2020 John Wiley & Sons, Inc. Published 2020 by John Wiley & Sons, Inc.'
  merge: -1
  img_proc: true
- pgno: 175
  md: '# Preserving Evidence from Cloud-Computing Platforms


    There are many advantages to a entity using a cloud service compared to buying,
    maintaining, and operating their own system architecture. This may include cost,
    time saving, access to highly specialist security staff, and not having to maintain
    the many operating systems and applications a company may operate. All the traditional
    issues involving maintenance, security, updating software, and others may be outsourced
    to the cloud service (depending on the cloud product used), meaning the cloud
    can focus its resources on their business, not technology issues.


    To the cybercrime investigator, cloud computing takes on relevance as industry
    and governments are developing cloud-first policies that dictate when technical
    infrastructure needs to be replaced, a very strong and compelling argument needs
    to be given as to why physical infrastructure and network architecture needs to
    be purchased, housed, and maintained by the entity and not a Cloud Service Provider
    (CSP). Consequently, as a cyber investigator will become well acquainted with
    the cloud-computing environment, much as previous generations of investigators
    need to understand previous iterations of technology.


    There are many forms of cloud services, and apart from providing a brief introduction
    it is not the intention of this chapter to cover all the cloud architecture options
    an investigator may encounter. We will take the view of an international cloud
    provider where the client''s data is stored on cloud servers across many local
    and international jurisdictions (multijurisdictional) and intermingled with data
    from other clients of the CSP (multitenancy). This is known as a public cloud
    and the version you will encounter in most investigations.


    Cloud computing provides many challenges the investigator does not face with traditional
    digital evidence and these will be discussed in later in the chapter in “Cloud
    Barriers to a Successful Investigation.\ The initial stages of this chapter will
    provide a general understanding of what a cloud-computing service is, but it is
    worth the effort to obtain a specific definition of what a particular cloud service
    is and what are the key features of the cloud. With this information, the cybercrime
    investigator will be able to relate their investigative strategies to this evolving
    technology.


    In 2014, the International Organization for Standardization (ISO) produced standard
    ISO/IEC 17788:2014, which identified the six key characteristics of cloud computing.
    They are:


    +   1. Broad network access. A feature where the physical and virtual resources
    are available over a network and accessed through standard mechanisms that promote
    use by heterogeneous client platforms.¹'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# What is Cloud Computing? 169


    This means that cloud services can be accessed remotely from any location using
    any compatible device. Your cloud service can be accessed equally easily from
    your office in Singapore and when you are traveling in New York, Hong Kong, Thailand,
    Melbourne, or Johannesburg.


    +   **Measured service.** A feature where the measured delivery of cloud services
    is such that usage can be monitored, controlled, reported, and billed.¹


    This means the client uses and is charged only for the resources and services
    they use and is not billed for excess storage and processing capacity they would
    rarely if ever required.


    +   **Multitenancy.** A feature where physical or virtual resources are allocated
    in such a way that multiple tenants and their computations of data are isolated
    and inaccessible to one another.¹


    This means the cloud provider shares its infrastructure and network architecture
    with many clients. When stored, the client''s data is interrupted to provide the
    maximum efficiency in data storage.


    +   **On-demand self-service.** A feature where a cloud service customer can obtain
    capabilities, as needed, automatically or with minimal interaction with the cloud
    provider.¹


    This means the service can be expanded or contracted as required by the client
    without the need to formally interact with the CSP staff.


    +   **Rapidity, elasticity, and scalability.** A feature where physical or virtual
    resources can be rapidly and elastically adjusted, in some cases automatically,
    to quickly increase or decrease resources.¹


    This is a service where extra storage or processing capacity can be obtained for
    the period of use only. The storage/capacity reverts back to the previous configuration
    once the extra services are no longer required. For example, a business may require
    extra processing capacity at the end of the financial year and may incorporate
    this capacity for the several weeks until the accounts are finalized. Once the
    extra storage/capacity is no longer required the service contracts to its original
    level.


    +   **Resource pooling.** A feature where a cloud service provider''s physical
    or virtual resources can be aggregated in order to serve one or more cloud service
    customers.¹


    This means you share the architecture and resources of the CSP with the other
    clients of the CSP.


    For the digital crimes investigator seeking evidence from a cloud service, it
    helps to understand that they are dealing with a very different environment from
    one in which they locate a computer on a suspect''s desk in an office and get
    the digital investigator to locate the evidence. In fact, there no'
  merge: -1
  img_proc: true
- pgno: 177
  md: '# Preserving Evidence from Cloud-Computing Platforms


    similarities between the two, as with a cloud server the investigator will never
    get to physically see the cloud crime scene or servers the evidence resides within.
    Think about this from the perspective of one day having to answer questions in
    court where your evidence came from, how it was obtained, international jurisdictions,
    the chain of custody, and the like.


    Cloud computing is a dynamic legal environment with little known legal precedents
    to guide investigators as to what the court will require. Until legal precedent
    is established, investigators must be prepared to guide the court on why this
    form of evidence can be relied upon. Discussions with the CSP should be encouraged
    in this matter, as they will have the resources to provide the court with the
    validation of the credibility of their evidence.


    An introduction to forms of cloud services, there are many products CSP offer
    their clients. Depending upon their needs, clients generally migrate toward three
    major offerings: Software as a Service (SaaS), Platform as a Service (PaaS), and
    Infrastructure as a service (IaaS). The relevance of understanding these CSP products
    is that they offer different levels of evidence to the investigator, as each provides
    different levels of control to the client.


    +   * Software as a Service. With the SaaS product the client has no ownership
    or direct control over the applications making up the service or the infrastructure.
    Their ability to configure the service is restricted to the options within the
    application (e.g., Microsoft Office) and the client has little to no access to
    logs. These are under the control of the CSP and application providers. which
    may contain evidence in its own right. Access to the applications that make up
    the SaaS product is via a web browser or app.


    Obtaining evidence to advance the investigation will require the cooperation of
    the CSP and third-party providers of the service. The End User Licence Agreement
    (EULA) may provide some assistance in obtaining evidence, but this cannot be relied
    upon. The client is viewing via a Virtual Machine(VM) which possesses its own
    set of logs that may be used to progress the investigation.


    +   * Platform as a Service, PaaS is a similar product to SaaS; however, add-ons
    are provided to allow clients to create customized applications to suit their
    needs. With SaaS and IaaS, the underlying infrastructure is owned and controlled
    by the CSP. As with the SaaS model, significant assistance may be required from
    the CSP in the seizure of evidence.


