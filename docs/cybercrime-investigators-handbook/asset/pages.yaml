    operate off the internal IP address range (192.168.\*\*\*\*) and leave the network
    through a central IP address (such as 207.123.\*\*\*\*).


    Within a network, there are two ways device within the network can obtain an internal
    IP address. The first is the system administrator or an equivalent person allocating
    an IP address to a specific MAC address within the routing table.


    The other way is (as referenced earlier) DHCP, where devices allowed onto an internal
    network are allocated internal IP addresses without the direct hands-on intervention
    of the system administrator. This is common in large networks where there are
    literally too devices for internal addresses to be allocated individually.


    These internal addresses travel throughout the network and will be captured by
    the forensic investigator they should need to examine network traffic. The system
    administrator will be able to direct you to identify which device a specific IP
    address is allocated to.\⁵


    # Public IP Address Range


    The IP address range is the range of IP addresses the public may use to access
    the organization. Asking the system administrator or searching domain registration
    search sites (such as centralops.net) can yield valuable information.\⁵'
