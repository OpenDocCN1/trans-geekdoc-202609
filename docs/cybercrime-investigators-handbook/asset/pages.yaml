    As their evidence will ultimately be crucial to an investigation, when assembling
    your investigation team ensure they are technically competent for this duty, with
    the capacity to deliver their evidence in court if required. They will need to
    be able to produce independent evidence of their qualifications and training,
    prove that their skill sets are current, and prove that the digital tools they
    use are suitable for the tasks they are undertaking and are qualified and competent
    to use them.


    +   **Interviewer**: The person assigned the task of interviewer may be any member
    of the team who has the proven skills. Alternatively, they may be assigned this
    task if they have (a) person(s) in mind.


    As the investigation team will attend to the scene while the Incident Response
    (IR) team is operating, the reality is that they may have limited knowledge of
    the event apart from a brief initial outline. This is the case in many police
    investigations when investigations are begun with very limited information, and
    important decisions are made in this environment.


    While there be no conscious decision to investigate a suspect at the scene, circumstances
    sometimes overrun this plan and a suspect may be identified during a routine conversation
    without any preplanning or warning. In effect your initial interview will commence
    and having a digital'
