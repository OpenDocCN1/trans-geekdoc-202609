- pgno: 270
  md: '# # CHAPTER EIGHTEEN

    Producing Evidence for Court


    REVIEWING the investigation and evidence, a person may be identified who can be
    prosecuted for the event. This may be in a tribunal (such as an employment court),
    or be a civil—or even a criminal—prosecution. With rare exceptions, the party
    bringing the matter before the court has the burden of proving the case against
    the other party.


    This is where the professionalism and thoroughness of your investigation will
    be examined critically. The defense lawyer will see their job as challenging your
    alleged offense, but they may also extend their challenge by questioning your
    team about the scene examination, evidence collection, protection of the chain
    of custody, and qualifications of your investigation team for the work they undertook.
    While your review of the investigation focused on questioning the evidence, the
    defense lawyer''s job is to represent their client to the best of their abilities
    and this involves focusing strongly on your investigation, evidence, and conclusions.


    Consequently, in your pre-court evaluation be prepared to only explain why the
    accused person committed the offense, but also why the person next did not. For
    example, if a computer device is shared by five people who use a shared user name
    and not the other, why is this before the court as the defendant and not the other?
    As part of your court preparation,'
