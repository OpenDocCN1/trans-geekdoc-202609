- pgno: 10
  md: '# About the Author


    Dr. Graeme Edwards is a financial and cybercrime investigator located in Brisbane,
    Australia. He has 26 years’ experience in policing, with 17 years as a detective
    specializing in the investigation of financial crimes and cybercrimes.


    He has successfully completed a doctorate in information technology with his thesis,
    “Investigating Cybercrime in a Cloud-Computing Environment.” He has also successfully
    completed a master of information technology (security).


    Dr. Edwards is a regular conference presenter, speaking on a wide range of topics
    related to financial crimes and cybercrimes; he also conducts training events
    for organizations and senior management as well as undertaking post investigation
    analysis of cyber events. He was the president of the Brisbane chapter of the
    Association of Certified Fraud Examiners from 2016 to 2018.'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Foreword


    CYBERCRIME INVESTIGATION is a discipline relevant to an increasingly diverse audience.
    It’s a profession that has evolved with technology and that is constantly being
    presented with challenges in determining the truth behind alleged events. As part
    of the broader security profession, investigators in large part are valued for
    their practical experience, vendor certifications, and trustworthiness in delivering
    investigative outcomes—whether that be to prove or disprove alleged affiliation.


    Graeme Edwards embodies these qualities. He forged a career as one of Australia’s
    first true cybercrime detectives with the Queensland Police Service. Like many
    in our profession he took it upon himself to continue to self-develop, through
    learning and adapting to new technology environments, and through advancing his
    new education. His doctorate furthered his expertise in cloud investigations and
    forensics, anticipating the growing need for this subspecialization.


    Cybercrime Investigators Handbook is a life work for Graeme. It provides an opportunity
    for readers to directly benefit from his unique expertise and lifelong learning
    experiences. Its content steps readers through the investigative process from
    a cybercrime perspective, capturing key practical and observational gems readers
    can readily apply to their own challenges.


    Thanks to others like Graeme, our profession can continue to evolve and benefit
    from the passing on of key lessons and knowledge for the benefit of practitioners
    and those looking to move into the exciting field of cybercrime investigations.
    It’s a very timely contribution. I trust you’ll benefit from its content as I
    have. Thank you, Graeme, for advancing our profession in this meaningful way.


    Professor David Lacey

    Managing Director, IDCARE

    Director, Institute for Cyber Investigations and Forensics, USC'
  merge: -1
  img_proc: true
