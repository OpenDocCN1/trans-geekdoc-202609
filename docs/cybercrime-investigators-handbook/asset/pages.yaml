- pgno: 219
  md: '# Step 6: Can the evidence be obtained by the consent of the CSP?


    Assess from discussions what evidence can be obtained from the CSP with the consent
    of the data owner, complainant, or CSP, and the value this will have in the subsequent
    investigation, with consideration of the totality and integrity of evidence. This
    step will largely depend on the nature of the complaint and the evidence that
    is sought, such as where the cloud account has been hacked. This step will also
    rely upon whether the evidence sought is from the cloud server of the complainant
    or the suspect. If the former, the CSP may be prepared to supply the evidence
    with the agreement of the complainant; however, if the evidence is from the suspect''s
    cloud account, it is unlikely to be obtained with consent. If the evidence can
    be obtained with the consent of the CSP, progress to step 28; otherwise proceed
    to step 7.


    # Step 7: Is the CSP a co-complainant?


    Consider the nature of the offense and whether the CSP may also be a victim of
    the offense and interested in making a complaint. If the CSP becomes a co-complainant
    and is willing to provide the required evidence, progress to step 28; otherwise
    move to step 8.


    # Step 8: Is the CSP obliged to advise the suspect of the inquiries made by law
    enforcement or private investigators?


    Discuss with the CSP whether the service of a court order or law enforcement places
    a legal or contractual obligation upon them to notify the suspect party whose
    data is being obtained that a court order has been served on them. If so, reconsider
    options and whether they can continue with the investigation and seek such evidence
    after the suspect has been interviewed.


    In jurisdictions, such as in the United States, law enforcement can seek an order
    from the court prohibiting the CSP from advising their client that evidence is
    being sought against their cloud account


    If the CSP was advising the suspect, review the investigation timetable and the
    implications for it. If not, progress to step 9.


    # Step 9: Assess the resources required.


    These resources may be in the form of financial, personnel, specialist IT, or
    legal support needed, and in a civilian investigation, will not be inexpensive.
    Do you have the storage capacity or forensic tools to deal with such large volume
    of data that is written in a proprietary format?


    Progress to step 10.


    # Step 10: Consider the potential criticism if cloud evidence is sought.'
