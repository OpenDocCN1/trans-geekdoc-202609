    # Theft of Information Such as Identities, Staff Files, and Accounts


    Similar to industrial espionage, this may be a specifically targeted or random
    attack. The identities may be sold online, held for later exploitation, or sold
    back to the company as a ransom. These attacks may be internal or external to
    the network.


    Examples of Personally Identifiable Information (PII) stolen include names, addresses,
    Social Security numbers, passwords, phone numbers, email accounts, credit card
    numbers, next-of-kin details, mother''s maiden name, and so on. The value of this
    information to the attacker is that it may be useful in creating databases on
    persons of specific interest within the organization: other data can be located
    through source investigation (such as social media) to develop a more detailed
    profile of the individual. The profile may be used to commit identity theft against
    the organization or a financial institution, or sold on criminal markets as a
    product.


    # Investigator Considerations


    Although this is a very common crime, with hundreds of millions of identities
    and credit card details stolen every year, the consequences to victims are not
    lessened. There is a saying in the law that you take your victims as you find
    them, and while one victim of identity or credit fraud may make the'
