- pgno: 256
  md: '# THE INTERVIEW PROCESS


    This section provides a general introduction to the interview and its structure.
    As has been stated in other sections, your local laws and regulations will dictate
    how your interview is conducted and the standards required by your courts. Use
    the following sections as a guideline only and incorporate them into your interview
    plan as your laws and circumstances allow.


    # Introduction to the Witness Interview


    When the safeguards have been provided and you are ready to begin the interview,
    start with the basics to establish who the interviewee is and their relevance
    to the investigation. Being able to answer questions they are comfortable with
    allows them to build up their confidence. This is just as relevant in both witness
    and suspect interviews.


    The questions you ask during the interview will be determined by events; however,
    the list of questions that may be used for either a witness or a suspect interview.
    Use open-ended questions (questions starting with “explain,” “who,” “what,” “when,”
    “where,” “why,” and “how”), which preclude yes or no answers. Also keep questions
    brief, as there are things more difficult for the person being interviewed than
    a question that lasts several minutes and includes several subquestions.


    Examples include:


    +   * Where do you work?

    * What are your duties?

    * Who is your manager?

    * How many staff do you have reporting to you?

    * How long have you been in your current position?

    * When did you join the company?

    * What would a routine day consist of with respect to your duties?


    These questions are very general in nature and allow the subject to ease their
    way into the interview by being able to give detailed answers to questions that
    are familiar and comfortable with. As the interviewee’s confidence builds, more
    evidence-related questions can be asked.'
  merge: -1
  img_proc: true
- pgno: 257
  md: '# Body of Interview


    Allow the interviewee to talk about what is important to them is a valuable way
    of opening the main body of the interview process. The witness/suspect may have
    valuable information they wish to disclose and are looking for the first opportunity
    in the interview to disclose it.


    Note what they are saying and the manner in which they are saying it. This technique
    may also allow evidence to be disclosed that you had not even thought of. The
    experienced interviewer will note that a witness may provide details on many of
    the points being raised, whereas the suspect may provide great detail on unrelated
    matters but noticeably minimal information on the specifics of the offense investigated.


    Once you have established the relevance of the person to the matter investigation
    you may move into more relevant questions. Again, ensure that the questions asked
    are open ended designed to solicit detail answers. Should you identify inconsistencies
    between what the subject is saying and what you know, not jump in and contradict
    them, as this breaks their flow and confidence.


    The type of offense being investigated will dictate the direction of the interview
    from now. The senior executive will be different from the interviewing line manager
    of a suspect, as their knowledge of events is likely to be very different.


    The following list covers a wide range of interview questions that may be covered
    in an interview; where possible, it would be helpful to know some of this information
    prior to the interview. This is not always possible; however; pre-interview preparation
    is often as important as the interview itself. The list is very general in nature,
    as it is not practical to provide a schedule of interview questions covering each
    of the many types of cybercrimes.


    # Witness’s Knowledge of Devices Related to the Investigation


    +   * What devices do you use?

    * Who owns the device? (This question pertains to interviews conducted on a suspect''s
    home or when a Bring Your Own Device (BYOD is involved.)

    * What duties do you carry out on these devices?

    * Who has access to these devices? (Is the device in a person’s office or in a
    shared space?)

    * How do you gain access to the device? Do you use an individual or a shared password
    to gain access?'
  merge: -1
  img_proc: true
