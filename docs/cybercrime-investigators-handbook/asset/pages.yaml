- pgno: 264
  md: '# 258 Review of Evidence


    walk through the exercise in minute detail should appear in court and be required
    to defend your investigation. Follow the evidence with an open mind and see where
    it leads you!


    During the investigation, you will have obtained a lot of material from potentially
    many sources. Some will carry more weight than others and some evidence will be
    determined to have no value. In some jurisdictions there will be a requirement
    to return seized evidence once you have examined them and identified them to be
    of no value. In these circumstances keeping a copy of the exhibit may be beneficial,
    as the evidence determined to be of no value may develop into a crucial exhibit
    weeks later in the investigation.


    In large investigations there is a benefit to creating a spreadsheet that is who''s
    of the many people you encountered and includes their different roles in the investigation
    and evidence related to them. Creating a chronological timeline of events will
    also allow a wide variety of complex evidence to be presented in a manner that
    any person reviewing the investigation can use to get a quick grasp of events.


    In summary, when reviewing your investigation and the evidence, here are 1-2 quick
    tips to assist your review:


    +   1. Review all interviews to ensure that you have a strong understanding of
    the nature of the complaint and what has all allegedly happened. Obtain an addendum
    (second statement) if required. This is not a sign of weakness in your initial
    interview, as reviewing the case in its totality will provide a greater understanding
    of events, the witnesses'' roles, and potentially new lines of questioning of
    witnesses. Having addendum statements is a sign you are being thorough in your
    investigation and you are chasing every lead.


    +   2. Review the digital evidence, including the reports provided by the technicians.
    If you cannot understand the technical evidence there is an excellent chance the
    jury will not, either. This is the opportunity for you to walk through the technical
    evidence, with your experts so that you can understand exactly what they are saying
    in their report. Take lots of notes if you need to, as these will be helpful in
    understanding the evidence.


    +   One way of gaining an understanding of technical evidence is having an opportunity
    to use the forensic tools the examiner used, under their supervision and on a
    separate device. This will be done on a copy of the initial image to ensure that
    no damage is done to the integrity of the evidence. People who learn by doing
    activity will find this helpful.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# Review of Evidence 259


    For example, the forensic examiner may be able to guide you in following the recorded
    evidence as the attacker moved through the network and gained access to valuable
    corporate data.


    Ideally your technician will provide their report in clear language and avoid
    technical terms where possible. As you review the evidence, you do not need to
    be an expert on what the expert is saying, but you must be able to accurately
    describe the evidence in court if the defense lawyer asks you.


    +   3. Witness statements are to be completed and signed during the initial phase
    of your investigation, as people may leave the company or even the country and
    it may be impossible to locate them later. This also completes a line of inquiry.
    Many times statements will have been recorded digital recordings at the scene
    and then translated into formal interview statements back in the office. These
    statements will then need to be reviewed and endorsed by the witness.


    The temptation may be to record the statement and focus on promising lines of
    inquiry, as suspect identification, with the intention of meeting the witness
    to review the statement at a later date. You will find your investigation clearer
    when you have the written statement recorded and signed by the witness, as it
    means they have formally adopted a version of events as the investigation continues.
    It is one less thing you have to plan and provides a solid foundation to your
    investigation.


    +   4. Human Resource (HR) documents are particularly useful when there is an
    internal security breach. Secure them early and identify which members of staff
    can introduce them as evidence and explain the contents.


    Your investigation into an internal data breach may depend on the HR documentation,
    as it details acceptable use of computers, policies regarding the use of Bring
    Your Own Devices (BYOD), and ownership of Intellectual Property (IP) created during
    the term of employment. When dealing with a suspected internal data breach, speak
    to HR officers and obtaining the personnel file with documents will determine
    early in your investigation the potential legality of a suspect''s actions.


    When reviewing evidence gained from examination of the scene, HR documents may
    determine whether your investigation should continue or is complete. For example,
    if there is no document detailing ownership of IP created during the suspect''s
    term of employment, seek legal advice as to whether there was any offense committed
    by the suspect copied it.'
