- pgno: 250
  md: '# Interviewing Witnesses and Suspects


    not have any all, the witness you were only speaking to as a matter of being thorough
    in your investigative methodology may disclose information that brings them right
    into the center of the investigation as a crucial witness or suspect. The key
    in both instances is treat each interview as a unique event, to actively remove
    any bias from what you expect to hear, and to be prepared for the interview to
    be very different from what you expected.


    One piece of advice this chapter can provide is to listen and allow the person
    being interviewed to do the talking. This applies equally to suspect and to witness
    interviews. An interviewing trap may fall into asking a question, then focusing
    on the next question to be asked instead of actively listening and digesting the
    words that the interviewee is. In this scenario valuable information will be missed
    and the point of the interview, which is to gain all the knowledge the subject
    has to offer. defeated. This is where having a colleague as your interview partner
    will help, as they may be able to identify evidence that the main interviewer
    may miss.


    Silence is also a powerful interview strategy. Suspects in particular may provide
    a rehearsed answer to what they expected and anticipate a new question be asked
    immediately after they have stopped, allowing them to lead the interview away
    from an area they feel uncomfortable with. By staying silent, the interviewer
    is projecting the impression that they see the answer as being only complete and
    that they are waiting for the suspect to provide speaking again. Depending on
    the personality of the suspect and their experience in being interviewed, may
    will inadvertently start speaking again. saying things they had previously rehearsed
    not saying. Many lawyers in court are experts using this strategy when cross-examining
    witnesses.


    In contrast to silence as an interview strategy, many interviewers feel they need
    to be constantly talking over the other party as a sign of controlling the interview,
    or they need to immediately challenge the interviewee when something is said that
    is different from what the interviewer expects or wants to hear. A very rough
    rule of thumb, try to let the witness/suspect speak about 90 percent of the time
    compared to your 10 percent.


    As a general guide, if you are conducting an interview and it resembles something
    from your favorite cop on television, the chances you are doing it wrong, as many
    of police interviews on television are necessarily dramatized for story development
    and entertainment, and not portrayed by the rigorous accountability you will need
    to demonstrate in court up to two years later. That joke or put-down that seemed
    highly effective during the suspect interview looks very ugly when it is played
    before a judge and jury'
