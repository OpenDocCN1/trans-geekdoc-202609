- pgno: 64
  md: '# Legal Considerations When Planning an Investigation


    positively identified and the management team decide to initiate civil action
    or refer the incident to police for further investigation and potential prosecution.


    Investigators place their own personal credibility on the line when conducting
    an investigation, and their actions must be accurate, transparent, and ethical.
    Their reputation travels with them across jobs and courts. Judges speak to each
    other behind closed doors and swap notes as much as any occupational group, if
    an investigator is identified as playing fast and loose with the rules of evidence
    they may become a negative topic of conversation among members of the judiciary.


    The following sections provide guidelines as to considerations the investigator
    must keep in mind during all phases of the investigation.


    As mentioned, the information provided is jurisdiction neutral and general in
    nature, as each jurisdiction has its own laws and judicial precedents. It is the
    responsibility of an investigator to understand the legislation and rules of evidence
    of the jurisdiction(s) they are operating within.


    # ROLE OF THE LAW IN A DIGITAL CRIMES INVESTIGATION


    While the rules of evidence may differ among legal jurisdictions, they have generally
    been developed through a process of legislation, case law, and legal convention
    developed over many years of hearings during which matters have been challenged
    and judges have provided rulings, a process that in turn has established legal
    precedents. The rules are there to ensure that the evidence, produced in a matter
    is consistent and accurate in its meaning, quality, and integrity. This is effectively
    so that the judicial officer presiding can have the required level of confidence
    in the evidence before them.


    When initiating an investigation you will be constantly reviewing the evidence
    to determine it leads your investigation. You will instantly decide that some
    of it is highly relevant and should be presented to the court should your investigation
    progress that far. However, in many instances you may not understand the full
    value of your evidence until later in the investigation: nevertheless, it must
    be preserved as secure as that which you immediately identified as key evidence.


    The law is constantly evolving, and it is your responsibility to keep up to date
    with the law. It is worth having a lawyer who is either a part of your team or
    easily accessible who is a specialist in digital evidence and cybercrime law to
    provide expert evidence if required.'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# PROTECTING DIGITAL EVIDENCE


    Digital evidence may be highly volatile and obtained from numerous sources. The
    infrastructure, storage, and retrieval methods and tools used in seizing the evidence
    may differ widely across investigations and it is the role of the investigator
    to understand these nuances during the investigation, not just prior to a hearing.
    The investigator must take control of the scene and in a prompt manner assess
    the value of potential evidence and its likelihood of being lost or damaged.


    Whether the digital crime scene is a physical or logical location (virtual or
    network), preferably the evidence should be located in situ (in the original place).
    All actions involving the crime scene and the evidence need to be documented and
    accounted for in case of a challenge at a later date in court.


    To protect digital evidence, the scene investigator would ideally be a person
    who has a strong understanding of digital evidence, has practical scene management
    experience, and possesses an understanding of the ease with which evidence can
    be damaged or destroyed. A pre-search briefing on the volatility of digital evidence
    and the existence of strong guidelines regarding the management of such evidence
    will be of benefit to all investigators, especially those who may not have experience
    in this form of evidence. The volatility of evidence and the order for its capture
    is discussed in Chapter 10, in the section "Acquisition of Digital Evidence."


    Digital evidence may be highly volatile and easily damaged or lost. It is the
    responsibility of the investigator to protect evidence and account for its state
    from the time of capture to presentation in court. Where there are changes, extensive
    notes explaining what happened and why are to be recorded in a chronologically
    ordered notebook with numbered pages to negate arguments that were created well
    after the event. When a mistake is made, it should be acknowledged and the reasons
    for it. Acknowledging a mistake may enhance the perceived integrity of the investigator,
    as it shows they are not trying to cover anything up: a cover-up is significantly
    worse and more damaging than the initial mistake.


    The Association of Chief Police Officers (ACPO) in the United Kingdom has made
    a series of recommendations as to how digital evidence should be handled to ensure
    compliance with the requirements of the court:


    +   1. No action taken by a law enforcement agency or others should change data,
    which may be subsequently relied upon in court.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 56 Legal Considerations When Planning an Investigation


    2. In circumstances where a person finds it necessary to access original data,
    that person must be competent to do so and be able to give evidence explaining
    the relevance and the implications of their actions.


    3. An audit trail or other record of all processes applied to digital evidence
    should be created and preserved. An independent third party should be able to
    examine these processes and achieve the same results.


    4. The person in charge of the investigation has overall responsibility for ensuring
    that the law and these principles are adhered to.¹


    When presenting evidence before court, the party presenting must prove its relevance
    to the case and why it can be relied upon. This includes the tools used for evidence
    capture. For the opposing party, having incriminating evidence excluded under
    challenge is a proven method for advancing their side of the matter. The onus
    is on the party presenting to show it is of a standard the court can place trust
    in and of a credibility that can be relied upon. Honest mistakes occur—particularly
    in live situations, such as when attending scenes—and being transparent when challenged
    assists your credibility before the court.


    For digital evidence, it is not always practical, or possible to obtain a full
    bit-by-bit image of a device due to the volume of the evidence. Seek advice from
    the digital investigator before making any decisions. The decision that eventually
    made may be based on a risk assessment or for technical/nontechnical reasons.
    Account for the reasons for your decisions as you would seizing any other exhibit.


    # PRESERVATION OF THE CHAIN OF CUSTODY


    The chain of custody is a combination of written statements, reports, and oral
    evidence documenting the identification, lawful seizure, examination, and movement
    of evidence from the time of identification through presentation in court as evidence.
    For example, a computer located in an office may be an exhibit, and the chain
    of custody would require identification of the person(s) who found the exhibit,
    seized it, stored it, transported it for forensic examination, and conducted the
    examination, as well as how it was secured after examination and other information
    regarding not only the physical computer seized but also the images created by
    the examiner.


    All exhibits are required to have a person prepare a statement supporting these
    criteria. Creating a schedule that includes dates and times of custody'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Preservation of the Chain of Custody 57


    helps to ensure continuity. By failing to ensure the chain of custody, the potential
    exists for evidence to be excluded or have a reduced value in court, as its credibility
    can be questioned.


    The exhibits officer is the person designated at the commencement of the investigation
    to take custody and secure all exhibits seized. They are also responsible for
    ensuring the chain of evidence of all exhibits, recording where they were found
    and by whom. The exhibits officer must be able to record the history of the evidence
    at any time of identification, seizure, examination, and so custody it was at
    the time of identification. A schedule provides a quick, convenient, and transparent
    method of accounting for the evidence and identifies any gaps in the chain of
    custody that needs to be investigated.


    Note is that both the physical item and images taken to be accounted for when
    dealing with digital evidence. Originals should never be used in a forensic examination.
    The examiner may obtain the original disk from the exhibits officer and create
    a series of images. The chain of custody will account for this and the examiner''s
    statements will differentiate between the original and images.


    Maintaining the integrity of the chain of custody of the digital evidence is accomplished
    by creating documentary evidence of all actions involving the evidence from identification
    to collection or acquisition to present status and location. This may include:


    +   Uniquely identifying each exhibit you are going to seize and recording exactly
    where it was found, and by whom. Photographs help to support the accuracy of seizure.


    +   Maintaining a written log of events for each exhibit attached to the exhibit
    by a tag or label.


    +   Taking notes to record the time of location, seizure, preservation, securing,
    transport, logging into your storage facility, and the like. Recording time is
    critical to proving that you have control of your exhibits from identification
    to presentation in court.


    +   Signing, sealing, and dating digital evidence seized. In some instances evidence
    may be stored in bags that can be sealed, in case you can sign and note the date
    across the seals to provide a higher level of exhibit security.


    +   Recording the investigation identifier on the exhibit packaging and log. When
    you work in a busy office with lots of investigators pursuing their cases, human
    error may unfortunately mean that some exhibits end up'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Legal Considerations When Planning an Investigation


    close to those of another case. While this is not best practice, it is the reality
