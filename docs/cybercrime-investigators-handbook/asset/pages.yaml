  md: '# CHAPTER FIFTEEN

    The Dark Web


    HE DARK web is that portion of the Internet where search engines such as Google,
    Yahoo, and Bing do not index the content of the websites. Dark web sites specifically
    block these legitimate companies from indexing their pages using a secure spying
    on their communications to increase the privacy of the activities that take place
    on.


    The US Naval Research Laboratory created the concept of the dark web for the legitimate
    purpose of helping their people communicate over the Internet using an increased
    form of security.¹ It is also highly beneficial for persons who are in countries
    hostile to human rights to be able to communicate over the Internet using secure
    communications channel that prevents the government from spying on their communications²


    To access the dark web a user needs to use a specific browser, such as Tor, whose
    name is derived from The Onion Router, the original project name. The Tor browser
    is available at www.torproject.com. There are other options available but the
    Tor browser is the most commonly used.


    Your pathway onto the dark web is made up of specific locations that are in different
    legal jurisdictions, meaning tracing the activity of Internet Protocol (IP) addresses
    via traditional investigative strategies is not feasible due to the time required
    to locate this form of evidence. Also, Tor nodes do not keep log records derived
    by a session.


