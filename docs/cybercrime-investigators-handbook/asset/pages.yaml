- pgno: 154
  md: '# Private/Internal IP Addressing


    The range of subnetted IP addresses within an organization that external parties
    do not see or have access to. In the example cited above, this range of addresses
    would start with 192.168.1 and the number of addresses would be dictated by the
    needs of the organizations and the size of the subnetwork created.


    # Remote Access Point


    A remote access point is a hardware device that allows a user to connect a wireless
    device to a wired network. An example of a remote access point is a router.


    # Domain Name Servers


    A Domain Name Server (DNS) serves as the pathway from a user within a network
    and the Internet. When a user seeks to go to a website they have not been before,
    they do not know the pathway. The DNS server will receive the request, locate
    the web address the user is seeking, and send a reply with the address to the
    user''s device. The user may connect to the web address.


    # Demilitarized Zone Zones


    A demilitarized zone (DMZ) is the external-facing portion of a network, such as
    a web server. The only data that can be viewed is that which the owner has specifically
    allowed to be viewed, meaning that external visitors cannot directly access private
    corporate data.


    # Domain Controllers


    A domain controller operates within a Microsoft Windows environment responding
    to security authentication requests. Examples of requests include passwords and
    the permissions of a user to access specific resources, including data.


    # Servers/Databases


    Servers and databases contain corporate data of value to an attacker. A cybercriminal
    may steal copies of the data, delete the data, or modify it. The latter strategy
    is particularly damaging to a company, as they make decisions based on the accuracy
    of data stored on a database.'
  merge: -1
  img_proc: true
- pgno: 155
  md: '# Email Systems


    Email systems record email flow into, within, and leaving the network. Evidence
    may show content of email communications, associations, time stamps, and the like.
    It may also show an internal suspect emailing confidential IP outside of the business.5


    # Classified Systems


    Some servers contain very sensitive commercial material, which senior managers
    may not want to include in an investigation. This will need to be addressed on
    a case-by-case basis by the investigator, who will be identifying evidence the
    system contains and how it may progress the case. Should management deny access
    to a system the investigator believes may be crucial to an investigation, take
    detailed notes about the reasons, the identity of the person denying access, and
    what inquiries you felt necessary on the system.5


    # Dealing with Fixed and Networked Devices


    Devices may be connected to a network by cable or wireless connection. Examples
    include desktop computers, mainframes, switches, hubs, routers, and the like.
    Evidence passes through each of these devices and it is the responsibility of
    the investigator to ensure that all relevant evidence is captured, not just that
    is easily accessible. As has previously discussed, capturing this evidence is
    a job for the digital forensic investigator as it may provide valuable direction
    as to the suspect and their attack methodology.


    The digital investigator may look to see what activity the device is undertaking
    on the network, including data moving from the device. The examiner will photograph
    the device and connections, and where possibly identify where the device is connected.


    Using the network map prepared in the investigation of a network intrusion helps
    the investigator understand how data flows into and out of the network. A wireless
    signal detector may assist in identifying devices on a network that the system
    administrator is unaware of, such as mobile devices or a covertly installed server
    with software allowing it to capture and store network traffic.


    # Devices That Are Turned On


    Digital evidence may be turned on or off when the investigator arrives at the
    scene. If the device is off, do not turn it on. If it is on, do not turn it off
    until'
