    software and their criminal documents will not be located. For example, the default
    extension for a Word document would be identities.doc, while the criminal may
    manually change it to identities.exe.


    The metadata in a document may show who created a document, when it was created
    and last accessed, and whether it was modified using a program as Photoshop. This
