    offending you have been tasked to investigate.


    # Gaining or Exceeding Authorized Access Levels to Obtain Highly Restricted Data


    Users of a network may seek to increase their level of access to highly confidential
    data. Alternatively, a hacker may gain a user''s credentials within the organization
    and on escalating their access to the confidential data through compromising accounts
    associated with the user. For example, a hacker may gain access to their supervisor''s
    account, then use this to gain access to the personnel manager''s account, and
    so on.


    This is a major concern for all organizations and government agencies and their
    contractors who have been compromised in this manner.


    # Investigator Considerations


    Escalating privileges involves navigating a pathway through a series of users''
    accounts from low to higher levels to find where users gain access to confidential
    data. You may have to work backwards from the point of identification of the breach
    to find whose account was compromised in the first instance and how this was achieved.
    This will provide evidence of the attacker entering the organization and gaining
    the lowest levels of privilege. For example, find a link between the attacker''s
    Internet Protocol address found at the initial compromise of the junior personnel
    clerk''s account and the Internet Protocol address the stolen data was forwarded
    to.


    Understanding pre-offense behaviors, including reconnaissance, testing of vulnerabilities,
    and phishing attacks, may provide details about offender behavior and intention.


    # Exploiting Information Security Weaknesses through the Supply Chain, Including
    Third-Party Contractors


    Third-party contractors often fail to provide the level of security their client
    is capable of providing. For example, independent contractors in Hollywood may
    have been the ones hacked when movies are taken and held for extortion prior to
    release to the public. The criminals have determined it is easier to'
