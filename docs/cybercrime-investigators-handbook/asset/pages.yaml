    # Investigator Considerations


    The cybercriminal is usually in a foreign jurisdiction using disposable web accounts,
    disposable phones, and fake identities. This is a very difficult crime to investigate,
    and it is very difficult to identify a real-world suspect.


    You will require cooperation from law enforcement or civilian investigators in
    foreign jurisdictions. Your local evidence will include phone records, Internet
    Protocol addresses, and money transfer receipts, as well as copies of communication
    on applications such as Skype.


    # Inheritance Fraud


    With the abundance of material available about people online, learning the background
    of people is easy, with social media and genealogy sites providing valuable resources
    to the cybercriminal.


    An inheritance fraudster will prepare a letter of introduction to their target
    using the name of a legitimate foreign law and identify a relative of their target
    whose research shows lived and died overseas. The fraudster will represent that
    the relative left a large sum of money to the target. The letter of introduction
    will include many family references, which can be independently verified by the
    target.


    The victim will be instructed to make payment of fees, charges, taxes, and the
    like before the funds can be released. Depending on the skill of the cybercriminal,
    these costs can reach into the hundreds of thousands of dollars.


    # Investigator Considerations


    As with the relationship fraud, the frauder will usually be overseas and hidden
    behind layers of technology. The large sums of money sent may provide avenues
    of inquiry in the foreign jurisdiction, as phone records, message records, and
    IP addresses.


    These are several examples of the many cyber-related attacks you may be involved
    in investigating in your career. There are many more and each requires a level
    of lateral thinking by the investigator to understand attack methodologies, motivations,
    and consequences.


    Chapter 3 will identify a series of factors motivating people to commit cybercrime,
    including which specific companies or individuals are targeted.'
