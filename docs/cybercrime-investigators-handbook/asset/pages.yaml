  img_proc: true
- pgno: 105
  md: '# The Investigation Team 97


    At the beginning there may be three levels of authority: the lead investigator,
    who has total authority of the investigation; the scene manager, who will execute
    search warrants/court orders; and the exhibits officer, who will secure the exhibits
    seized and maintain the chain of custody. Also present will be the search officers,
    who conduct the physical search/examination of the location. The scene manager
    be a person designated by the lead investigator to control the search and evidence-collection
    phase. Depending upon the scene size, number of people in the location, and resources
    and skills available, the lead investigator and scene manager may be the same
    person. Having a separate exhibits manager takes a significant workload off the
    lead investigator and scene manager.


    Each person at scene, such as searchers, digital investigators, exhibits officer,
    and others, will have specific responsibilities. Ensure that people understand
    their duties and have the equipment required prior to arrival at the scene.


    A brief explanation of who the members of the scene examination team are as follows:


    +   **General Searchers:** Persons who physically search for evidence and locate
    it. They will work closely with the exhibits officer and record what they find,
    where they found it, and what time they found it, and provide a description of
    the exhibit. An example of their notebook entry after finding a Dell laptop might
    be:


    +   Item 1: Located one Dell laptop computer, model ABC, serial number 12345678,
    on the desk of Joe Smith at 09:17 a.m. Laptop was turned off. Silver in color
    with black Dell carry bag. Leads to laptop in bag secured as well. Scratches observed
    on the base of device.


    +   **Exhibits Officer:** Appointing a designated exhibits officer helps reduce
    the workload of the lead investigator; they are responsible for making sure they
    have everything they need to manage the exhibits.


    This person is responsible for accounting for all evidence seized. They will have
    the exhibits delivered to them by the general searchers and take responsibility
    for preserving the chain of custody. An example of an entry in their field log
    might be:


    +   Item 1: Received one Dell laptop computer, model ABC, serial number 12345678,
    from Mary Jones at 09:22 a.m. Silver in color with leads in a black Dell carry
    bag.'
  merge: -1
  img_proc: true
