  img_proc: true
- pgno: 157
  md: 'Issues the digital investigator will consider that the lead investigator would
    benefit from knowing about include:


    +   * Identifying what network or Internet activity is taking place.

    * Photographing the layout of the network and devices connected to it where possible.

    * Identifying the level of trust in programs on the system. There will be some
    you are not familiar with and there may be pirated copies of operating systems
    and applications.

    * Using only validated tools that are known and trusted by the courts unless you
    are required by circumstances to use proprietary tools, such as would be the case
    on a corporate network with proprietary database.

    * Documenting all actions throughout the examination process. Forensic software
    may contain a documentation-recording process.

    * Using the copied image and documenting its hash value once it contains the copied
    image. This allows a form of accountability throughout the investigation process
    to prove the images'' authenticity.

    * Using a wireless detector to locate devices on the network that are unknown.
    Sometimes on a network there are devices attached that do not appear on the official
    network map. These may be mobile devices or a server installed by the cybercriminal
    with the purpose of intercepting all network traffic.

    * Instituting a hard shutdown to prevent corruption of the OS and documents. A
    hard shutdown will also prevent changes to time stamps and changes to file attributes.5
    A hard shutdown is cutting power from the device, such as removing the power cord.

    * Instituting a graceful shutdown to help locate connections.5 A graceful shutdown
    is using OS commands such as Ctrl-Alt-Delete-Shutdown. A graceful shutdown may
    lose some system files and may activate destructive programs.5 Considering acquisition
    of volatile data in memory when encryption is suspected. “Acquisition of Digital
    Evidence” in this chapter provides a suggested order of acquisition by order of
    volatility, as provided by AusCERT.4

    * Using a reliable time source and documenting the time of each performed action.

    * Being cautious about the existence of logic bombs or destructive tools installed
    by the cybercriminal. A logic bomb is a small application or code designed to
    execute upon a designated event occurring, such as a date or attempt at triage.'
  merge: -1
  img_proc: true
- pgno: 158
  md: 'Seizing USB devices. When a USB is used on a device, the serial number is stored.
    The investigator may assist the digital investigator by ensuring all USB devices
    that may be relevant to an investigation are seized and later cross-referenced
    to the devices. This links a USB device to a computer.


    Any VM operating on the system when the plug is pulled will be shut down and cannot
    be retrieved in the state it was. This means any evidence on the VM will be lost.
    Avenues of investigation that may have originated now be shut down and any evidence
    of the offense will be located from other sources. The investigator may also face
    questioning in court as to why the VM was shut down, as a defense lawyer may aggressively
    argue that the evidence would have cleared their client resident in memory or
    in the VM at the time of the investigator destroying the device.


    # Devices That Are Turned Off


    If a subject device is located at the scene and is turned off, do not turn it
    on even if it is suspected of containing potential evidence.


    Secure the device as an exhibit and allow the digital investigator to conduct
    their examination at the forensics lab using forensically sound tools and methodologies.


    # Network Servers


    On some occasions a storage device may be too large to be completely imaged. Examples
    include RAID (Redundant Array of Independent Disks) systems and cloud services.
    A RAID server means a collection of drives is combined to operate as one, providing
    a higher quality level of data storage, service, and reliability. In these instances,
    the digital investigator will discuss this with the complainant and their technical
    staff to gain an understanding of the most likely places evidence can be found.
    Alternatively, the system may be too important to the business to be taken offline
    for a forensic image to be taken, or a court order may only authorize specific
    activity on the subject device.


    # Live Capture of Digital Evidence


    The digital investigator will commence live capture of data for devices turned
    on. Record all actions, including using the password and the reason for capturing
    live data. It is generally not best practice to wake a device from sleep'
