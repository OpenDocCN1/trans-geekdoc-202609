  md: '# Step 1: Identify whether the complaint is criminal or civil.


    As the cyber event is triaged, there may be the decision made by the victim entity
    to conduct further inquiries in an attempt to locate the offender. As soon as
    possible, attempt to determine whether the complaint is a criminal or civil matter.
    If the matter is to be referred to law enforcement, there must be sufficient evidence
    to justify a criminal complaint. If it is a civil matter, management must support
    the decision and supply adequate resources for the investigation.


    Progress to step 2.


    # Step 2: Identify the appropriate investigative jursdiction.


    It is a theme throughout this topic that the multurisdictional nature of cloud
    computing brings the search for evidence into the realm of many different legal
    jurisdictions. This raises the question of which legal jurisdiction is the most
    appropriate to conduct an investigation, as evidence may be resident in different
    servers in different legal jurisdictions within the CSP. Also, where the breach
    be investigated: where the complainant is resident, where the CSP has its registered
    offices, or where the suspect is resident? Depending on the circumstances, there
    may be a strong argument for any of these options.


    Consider the potential for multiple law enforcement agencies to conduct a joint
    investigation. For example, where a suspected offender can be identified as being
    in a foreign jurisdiction to the complainant, a complaint can be received and
    forwarded to that jurisdiction for investigation, with support inquiries being
    as required by the referring police. In this instance, conduct your preliminary
    investigation and refer the complaint to the foreign jurisdiction. If the matter
    is not to be referred, progress to step 3.


    # Step 3: Does the complaint meet the predetermined investigation threshold?


    If evidence exists of an offense and potential evidence resides on a cloud platform,
    confirm that the cyber event is of a sufficient nature and seriousness to continue
    the investigation. This level preferably needs to be determined pre-event in the
    IR plan or identified once facts about the event begin emerging.


    The law enforcement investigator will assess whether the event is serious enough
    to conduct what may be an international investigation compared to the other complaints
    they are processing, and whatever'
