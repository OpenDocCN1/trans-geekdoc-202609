  md: '# CHAPTER SIXTEEN

    Interviewing Witnesses and Suspects


    INTERVIEWING is an art, and the more interviews you do the more you improve. There
    is no fast way to become an expert interviewer, as it is a skill that requires
    many years of continual practice. When interviewing, accept that your 100th interview
    will be infinitely better than your first and your 200th will be significantly
    better than your 100th. This is an art that you are always learning, as each subject
    is different and has varying motivations, and human personalities are dynamic,
    so an interviewing strategy that is an outstanding success in one instance may
    be a dramatic failure in the next.


    There are many factors involved in being a skilled interviewer, with different
    models being used by law enforcement and private investigators. This book does
    not seek to teach the art of the interview, but to provide content that may be
    used with your chosen strategy as you see relevant in the circumstances facing
    you.


    The interview is a search for facts to deepen your understanding of the person’s
    knowledge and relevance to the matter being investigated. Their relevance may
    be very clear from the time you first approach them to take part in the interview,
    or may you be interviewing to be thorough and ensure that all potential avenues
    of inquiry are covered. In both circumstances your initial thoughts may prove
    correct or alternatively, to listen to them, your opinion may undergo a radical
    shift. The witness you felt had evidence may


    243

    Cybercrime Investigators Handbook, First Edition. Graeme Edwards,PhD.

    © 2020 John Wiley & Sons, Inc. Published 2020 by John Wiley & Sons, Inc.'
