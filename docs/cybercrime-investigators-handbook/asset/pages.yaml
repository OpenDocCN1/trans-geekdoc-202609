- pgno: 14
  md: '# CHAPTER ONE


    # Introduction


    CYBER-ATTACKS AGAINST businesses and individuals have been occurring for decades.
    Many have been so successful that they were never discovered by the victims and
    only identified while the data was being exploited or being sold on criminal markets.
    Cyber-attacks damage the finances and reputation of a business and cause significant
    damage to those whose data has been stolen and exploited.


    From the criminal''s perspective, the current cyber environment effectively gives
    them a free pass when it comes to attacking their target. They can do whatever
    they like to an individual or business online, cause immense damage of a professional
    or personal nature, and make large sums of money safe in the knowledge the complainant
    will rarely report the matter to police. This is a strange anomaly about cybercrime:
    a company has millions of dollars of intellectual property (IP) stolen from them,
    all the personally identifying information (PII) of the staff and stolen, and
    the act of reporting it to police or investigating who is behind the attack is
    rarely considered or undertaken unless by local legislation. Consequently, from
    the criminal''s perspective, there is little to no downside to a cybercriminal.
    They operate on a high-financial-return, low-risk model.


    Due to the high volume and complexity of cyber-attacks, should a victim decide
    to refer to police that they cannot always rely upon to be'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'available to undertake an investigation and locate the offender. Police resources
    are stretched and skilled cyber investigators in law enforcement are few and overworked.
    This means organizations subject to a cyber-attack that wish to find information
    about who is behind the attack will need to hire an experienced cyber investigator
    (scarce and very expensive) or investigate the matter themselves. Alternatively,
    they will not conduct an investigation and instead focus on increasing security.


    The decision by victims to not investigate acrime is made for many reasons, including
    the time and money to be expended on an investigation, the focus of the business
    being directed on the investigation, the internal disruption it causes, and the
    reputational harm when the community finds the company security has been breached
    and all the data entrusted to them are stolen. Also, directors would not look
    forward to the day that they stand before a public annual general meeting and
    explain to the shareholders that all the company data was on their watch and that
    they have made no effort to recover it or who did it.


    To members of an incident response (IR) team or the cyber investigator, responding
    to an attack is often an inexact science as the attackers’ motives and skill levels
    vary. Whereas an attack against a single desktop computer may be easily contained
    and investigated, an attack against a complete distributed corporate network will
    require significant resources and an experienced team to protect the company,
    their data, and clients. As the method varies, the investigation strategy will
    not necessarily follow the exact path each time.


    Investigating a cyber-attack may be a critical part of the continuation of the
    business. When the attack is discovered, a mixture of panic, stress, anxiety,
    and fear is seen among staff, and those tasked to mitigate and eradicate the attack
    may make the future of the company rests upon their shoulders. Many employees
    will be concerned as to their personal future, as they will be familiar with the
    stories of businesses hit by a cyber-attack that no longer exist months later.
    Staff members of the organization being interviewed as a part of the incident
    response may also feel that they are held responsible and the interview is a method
    of laying blame at their feet.


    Why conduct an investigation and gather evidence? Why should a company start investigating
    the crime and try to track down the offender? With the proliferation of the instances
    of cybercrime, there is an expectation among the community that those who are
    entrusted with the PII take their responsibilities seriously and ensure their
    data is secure.'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Introduction 3


    Shareholders of companies who find the value of their shares and/or dividends
    is affected by a breach may demand efforts by the company to identify and prosecute
    the attacker. In the initial aftermath of the attack, there may be the possibility
    of locating the suspect and the digital property taken and recovering it is exploited.
    It may be argued that the duties and responsibilities of a director include trying
    to recover the stolen corporate data before it is exploited.


    Outside of law enforcement and large businesses, such as the major accounting
    companies, there are few options for those who want to have an investigation into
    a cyber-attack conducted. The IR team may find evidence pointing to a suspect,
    but it is not their job to prepare a case for police or lawyers. A cyber investigator
    is a very specialized position and is roughly the equivalent of a police detective
    conducting a criminal investigation, as the rules of evidence the court demands
    are the same whether you are an experienced detective or a civilian investigator.


    The cyber investigator is viewed as the person who is tasked with finding evidence
    of the person behind the attack, and in some cases preparing a referral to police
    or commencing a civil prosecution. While many attackers originate from overseas
    and are hidden behind multiple legal jurisdictions, anonymity, bots, or other
    technology, people have their own motivations to commit crimes—and these people
    may include current or former employees residing within your local jurisdiction.


    For the benefit of this book, the digital investigator is the person who conducts
    a forensic examination of a device or network and produces a report on the evidence
    seized and identified.


    This book is intended for the person assigned the task of investigating the cyber
    event with a view to gaining a full understanding of the event and where recovering
    the IP/PII before it is exploited. They may also be tasked with finding evidence
    to support an action in a tribunal (e.g., employment court) or a potential prosecution
    in a civil or criminal court should the attacker be identified. It will also be
    of benefit to the manager/executive/lawyer who is tasked to review an investigation
    to understand the actions of the investigation team and why certain decisions
    were made and to gain an understanding of the evidence available from a crime
    scene and the follow-up investigation. This is not a book that describes how to
    technically respond to and mitigate a cyber-attack, as there are many books covering
    this topic in great detail. There are also many courses offered by organizations
    that teach the many aspects of responding to a cyber-attack from the technical
    perspective.'
  merge: -1
  img_proc: true
- pgno: 17
  md: '# 4 Introduction


    Although this book makes some references to material from third parties, it is
    not intended to be an academic book. This is because much of the material is from
    academic literature or web sources, but from the experience of the author as a
    cybercrime investigator. The major exception to this is Chapter 12, which relies
    on evidence from the author''s doctoral thesis on cybercrime investigation in
    a cloud-computing environment and where academic references from a literature
    review are noted. Where explanations are provided, in the glossary, they are largely
    kept at a low-level technical definition to allow those new to this field of work
    to understand the material and its relevance without having to learn a whole new
    language technology.


    Due to the dynamic nature of evidence, advances in technology, and the evolution/legal/court
    decisions, this book is not intended to be an exclusive guide in every legal jurisdiction
    or to cover every potential cyber event. Where material in this book conflicts
    in any way with the laws of your jurisdiction, the legal environment(s) you operate
    in will always take precedence. The book intends, to provide critical thinking
    among management, IR team managers, and investigators should be identified and
    subsequent evidence need to be presented in court.


    This book contains many of the steps a cybercrime investigator will take, from
    the initial identification of a cyber event to considering a prosecution. There
    are many lists of things the investigator may consider. These are not exhaustive
    lists and are provided to expand the thinking as to what to do, where evidence
    may reside, and how to legally obtain and manage it. Use this book as a prompt
    and as a definitive step-by-step template, as each cyber investigation is different
    and each jurisdiction has its own legal requirements.


    The lists in this book provide a handy point of direction in each stage of the
    investigation. As you will discover, at each stage there are many things to do
    and no one can remember them all time. So, the lists are provided as a memory
    prompt of things to consider and apply the circumstances, legislation in your
    jurisdiction, and your experience. Not all items in the lists will be relevant
    in all instances. The explanations are in plain language and technical terms are
    kept to a minimum to assist your understanding of new concepts.


    In Chapter 2 we provide an introduction to the cybercriminal and a series of offenses
    an investigator may be called upon to investigate. These will vary according to
    the laws of the jurisdiction(s) you are operating in and for terms for the offenses
    you will vary. By gaining an understanding of the cybercriminal and'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Introduction 5


    their chosen cyberimes, we gain an understanding of how the crime was committed
    and why it was committed in the manner it was, as well as gaining some understanding
    of the type of identity we are seeking.


    Once we understand typical offenses, in Chapter 3 we will learn the motivations
    of the attacker. will provide a stronger pointer as to who is the offender, especially
    in cases of internal offenses. Motivations will vary across the many forms of
    cyber-attack we will investigate. It is worth understanding the reasons why a
    criminal attacks a specific target, as this will make great sense to them, even
    if the motive seems unusual to the investigator.


    In Chapter 4 we will look at examples of the alerts that will be the first indicators
    of the cyber event, as well as the offender''s methodologies. These alerts and
    methodologies may be evidence in their own right and provide indicators to the
    identity of the offender. While an alert will be generated before the investigator
    is brought in, the evidence from the alert will provide direction for the investigator
    to use as a platform for their investigation.


    In Chapter 5 we will learn the process of commencing a cybercrime investigation.
    We will discuss the many reasons why an investigation is commenced and introduce
    who a cyber investigator is. While the common response to a cyber event is to
    fix the system and prevent an attack from happening again, we will also ask whether
    there is a responsibility on the part of the data owner to identify the attacker
    and attempt to get the stolen data back before it is exploited.


    Once we have an understanding of offenses, offenders'' motivations, initial alerts,
    and attack methodology. In Chapter 6 we will learn about the role of the law in
    your investigation. Should an attacker be identified and presented before the
    court, every aspect of your investigation is subject to critical examination by
    the defendant''s lawyers, and your actions and their legality may be as much on
    trial as the activity of the defendant.


    Whether you are conducting a civil or criminal investigation, the complainant
    will provide direction to the investigation they want from you. You will have
    information on which to base your investigation as well as the authority to provide
    the resources you require. In Chapter 7 we will cover the many aspects of your
    initial meeting with the complainant, including numerous questions you may find
    relevant to ask them at this meeting.


    Chapter 8 provides a general introduction to the role of the digital investigator
    for the cyber investigator. Although the cyber investigator will not necessarily
    be involved in the technical aspect of the incident response while the attack
    is underway, it will be of benefit to them to understand what the IR examiners
    are doing and the consequences of their actions influencing the digital evidence.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Introduction


    The cyber investigator will be involved in preserving evidence and in discussion
    with the digital investigator and IR teams as to the seizure of evidence, including
    a priority on preserving digital evidence, especially that which is most volatile.


    The cyber environment provides unique challenges to the investigator, and a variety
    of these challenges are introduced in Chapter 9. As you are operating in a dynamic
    environment, the challenges you face vary according to the circumstances of your
    case and the evidence you are seeking.


    In Chapter 10 we move into the cybercrime scene investigation and cover many of
    the areas of a search you need to be aware of and understand. Cybercrime investigations
    involve unique challenges to the investigator and these are identified and discussed.
    As you are operating in a physical and digital environment the challenges faced
    will differ among investigations, and the investigator will need to expand their
    thinking to understand their changing environment.


    Log files are critical to cybercrime investigations: when activated and secured,
    they will tell you lot about the attacker, their methodologies, and the data they
    accessed. In Chapter 11 we will introduce many log types, which can be found,
    and what they mean to you as an investigator.


    Log files are like video cameras at a crime scene. Like a camera, if they are
    turned off or not preserved, they can be totally unusable. Log record activity
    on a device and network may provide very valuable evidence as to what happened,
    how it happened, when the breach occurred, and in some instances, what was behind
    it. The investigator may need to work with the digital investigator to understand
    what the logs are saying; however, this form of technical evidence may be crucial
    to your investigation—to the point where you might be criticized in court if you
    did not follow this potential evidence trail.


    Chapter 12 addresses legal and technical issues involved in locating and lawfully
    seizing evidence from a cloud-computing platform. As data is now stored on multiple
    computer servers in multiple legal jurisdictions, identification and preservation
    has become a far more complex procedure than when the examiner could physically
    seize a device that was suspected of being breached. Chapter 12 covers many of
    the legal and technical issues to be considered by the investigator, with suggested
    pathways to advancing your investigation in the cloud.


    Chapter 13 provides a very brief introduction to the Internet of Things (IoT),
    which includes the multitude of devices connected online. Evidence'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Introduction


    may now be gathered from anywhere there is a device connected to the Internet,
    and the digital investigator may use this technology to support their investigation.


    Open source material is material that can be captured from online sources. There
    are numerous forms of open source information available and many cyber investigators
    are finding valuable information to support their investigations by conducting
    online searches. Chapter 14 introduces a sample of the many forms of open source
    information available and how this information can assist your inquiries.


    As cybercrime has become more professional over the past decade, the criminal
    community has created specialized markets where they can trade goods and services
    with customers. Criminal markets as Silk Road and AlphaBay obtained a great deal
    of publicity through identifying the manner in which members of the criminal community
    operate and the level of support provided to each other in training and other
    support mechanisms. In Chapter 15 we introduce the dark web and its relevance
    to the investigator, with a warning not to venture into the criminal unless you
    as an investigator are well trained and understand the environment in which you
    will be operating. In some jurisdictions, it is an offense to access the dark
    web.


    Interviewing witnesses and suspects is an art that many police officers and investigators
    take years to master. It is not a simple process, as each interview is unique
    and may be evidence in its own right. Chapter 16 will discuss many of the considerations
    to be undertaken when conducting an interview and safeguards that may be applied
    depending on the jurisdiction you are operating within.


    Chapter 17 discusses how to review evidence collected and direction as how to
    proceed. Sometimes you will have strong leads to the suspect, sometimes you may
    have enough evidence to commence or refer an investigation, and times you will
    be facing a dead end with a recommendation to complete your investigation.


    Should you have enough evidence to refer to a tribunal, civil court, or police,
    Chapter 18 discusses ideas for how to prepare your evidence for court. Each jurisdiction
    has its own rules, and your priority will be to obtain experienced legal advice
    to ensure the requirements of the law and court are met. How you present your
    evidence is sometimes as valuable as the strength of your prosecution.


    Finally, in Chapter 19 we provide a summary of the contents of the book.'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'A glossary is also provided. It is prepared using nontechnical language, as
    readers will come from many backgrounds, many of which are not technical. Its
    aim is to provide a very general understanding of the new terminology mentioned,
    so you may continue reading with an understanding of the concept and the circumstances
    in which it is referenced. Should you require a more technical understanding of
    these concepts, there are many online resources available to you.


    As a prime reason cyber security exists is the criminal, we commence this book
    with an examination of the potential criminal offenses that may be committed in
    a digital and cyber environment.'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# CHAPTER TWO

    Cybercrime Offenses


    THE potential offenses a criminal may commit against an entity or individual is
    limited only by the imagination of the attacker. The cybercriminal may be a long-term
    trusted employee within the organization or a person located on the other side
    of the world. They could also be a contractor who takes advantage of operating
    within the corporate network to install malicious software or access information
    by installing a server on the network to intercept and record all traffic without
    the authority of the system''s administrator.


    This chapter seeks to present to the investigator an understanding of the many
    forms of cybercrime they may be required to investigate. While the investigation
    techniques presented in this book may be similar across each crime type, an understanding
    of the crime goes a long way towards understanding the criminal. This provides
    direction as to where to locate digital evidence within the physical and digital
    crime scene as well as to understanding the criminal''s motivation.


    As technology evolves, so do the opportunities for the criminal community to evolve
    with it. As new technological products are released into the marketplace, criminals
    view the product or service with a view as to how it may be exploited to progress
    their criminal ventures. For example, when gaming provide an internal hard drive
