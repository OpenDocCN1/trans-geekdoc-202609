  md: '# PROTECTION OF EVIDENCE


    While preserving the chain of evidence is crucial, there is also a wide range
    of work that is required to be undertaken with exhibits to preserve their authenticity.
    Each person involved in examining, involving, storing, and transporting exhibits
    needs to understand their responsibilities to their safety and security. Seven
    considerations for investigation and exhibit officers follow:


    +   1. Chain of custody

    See the previous section, “Preservation of the Chain of Custody,” for discussion.

    2. Secure storage

    Securing an exhibit requires that it be placed in an environment where there is
    no opportunity for it to be interfered with and its credibility vanished. Law
    enforcement use designated storage units and locked facilities whose access is
    restricted and recorded. Only persons who have a lawful and necessary reason to
    access an exhibit should be anywhere near once seized.

    First off, where a device has access to wireless or cellular networks, the device
    should be placed in flight mode (or similar method, depending on the device) and/or
    where feasible, placed into a Faraday bag similar container that inhibits network
    access. When a device is connected to a wireless network, you may disconnect the
    connection. With a cellular device, removing the SIM card will be of benefit.
    Record notes of your actions involving the device, as will affect the logs within
    the device. As a back up proceed a very basic way of helping to stop any potential
    interference with digital evidence connected to the Internet by a remote suspect
    or their associate is to place it in a clean metal container with a secure seal
    and/or wrap the device in aluminum foil.

    3. Statements and exhibit schedulenThe statement covering the integrity of the
