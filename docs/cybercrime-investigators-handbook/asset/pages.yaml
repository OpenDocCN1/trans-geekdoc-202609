- pgno: 160
  md: 'required to obtain further documentation, statements, and the like, as well
    as make inquiries based on information learned. New avenues of inquiry may be
    identified and assigned to team members.


    # WHAT COULD POSSIBLY GO WRONG?


    When human beings are involved, there is always the potential for things to go
    wrong. No matter how experienced the team, how well resourced, led, or controlled,
    things sometimes goes wrong because mistakes happen, or circumstances overrun
    your management.


    When dealing with suspects in particular, things can go very quickly with little
    to no warning. The suspect who is cooperative may take advantage of a distraction
    to destroy evidence, run away, or assault the investigation team. The follow section
    details instances of things going wrong, which need to be addressed and mitigated
    as events occur.


    The circumstances covers a wide range of offenses that have occurred at crime
    scenes (not just financial/cybercrime scenes) and will give you a sample of the
    volatility that can occur.


    # Assault of Investigators


    When dealing with a suspect, despite inquiries made you will be operating with
    limited information about their personality and behavior under stress. Even the
    most mild-mannered individual may behave in an aggressive manner when it has been
    identified that their criminal behavior has been discovered and they are facing
    prosecution and the civil foriture of their personal and family assets.


    Law enforcement investigators are well trained and resourced to deal with these
    circumstances, whereas the civilian investigator may not be unless they come from
    a law enforcement background. When attending to a suspect’s home address or even
    their business premises, remember that desperate people make poor decisions when
    under stress.


    # Honest Mistakes Being Made


    In any investigation, there is the potential for honest mistakes to be made. This
    may be as simple as misreading or misinterpreting a document, or may involve recording
    a device''s serial number incorrectly, which will cause confusion when attempting
    to reconcile exhibits.'
  merge: -1
  img_proc: true
- pgno: 161
  md: '# What Could Possibly Go Wrong? 153


    It is important to understand that no investigation is perfect every time and
    honest mistakes occur. When they do, it is important to rectify them when possible.
    Covering them up and denying them when questioned in court is an act worse than
    the initial mistake. The cover-up is worse than the initial mistake.


    # Exhibits Left at the Scene


    When you are securing several hundred items at commercial premises it is easy
    to miss an item and only realize that it has left behind when doing an audit back
    in the office. We have discussed the process of physically accounting for every
    exhibit on an exhibit form to prevent this from occurring. Despite this, occasionally
    something will go wrong and an exhibit will fall on the floor and be missed when
    the investigation team leaves the scene after being present for the last 12 hours.
    If this occurs in the complainant''s office it not be a major problem and may
    be able to easily rectified and recorded in your notebook; however when it happens
    at a suspect''s address to which you gained access through a court order, there
    is a very good probability that the exhibit will no longer be there when you return.


    Exhibits range in size from large physical devices to small pieces of paper. There
    are also data storage devices, such as SIM cards, which can easily be misplaced
    where there are literally hundreds of items to be removed from the premises. The
    exhibits officer is in charge of these and needs a plan to ensure that all items
    are accounted for when leaving the premises. One way to do this is for the exhibits
    officer to personally place each exhibit in numerical order to a large storage
    container and tick each exhibit off on their copy of the exhibit schedule. This
    may be a very slow process that takes place after the investigation team has left
    and everyone is tired, but it is also an investment in the infrastructure of the
    investigation and the exhibits officer must be allowed to do their job professionally
    and thoroughly.


    # Changing Terms of Reference by the Complainant


    As scenes and incidents are volatile, the civilian complainant may not have fully
    defined what is required from the investigation team when asking for your assistance.
    They are not experienced in the fields of crime scene investigation, management,
    and follow-up investigations. They also may not have a full understanding of events
    and their seriousness until you start briefing.


    As you locate information about the cyber security breach, they may subsequently
    expand the scope of the investigation and require that your investigation be referred
    to the police, despite originally stating that this'
  merge: -1
  img_proc: true
- pgno: 162
  md: '# 154 Investigating the Cybercrime Scene


    not a consideration. This will in turn affect your methodology; however, as discussed
    in the beginning of this book, your aim in any investigation will always be to
    be prepared for your investigation and evidence to be presented in a court of
    law, even if your initial terms of engagement stated that this was not a requirement.


    # Poor Record Keeping


    With the volume of evidence that may be seized, the number of people to be interviewed,
    the number of documents to be reviewed, and the amount of digital evidence to
    be examined, it is easy to let record keeping be ignored as other events take
    precedence. Notebooks need to be constantly updated to record new information
    and it is very easy to forget some new piece of information or action taken.


    When questioned at a later date or preparing your statement, poor record keeping
    will leave holes in your evidence, which may be exploited by the lawyers of the
    defendant.


    # Loss of the Chain of Evidence


    The chain of evidence preserves the integrity of your evidence. Losing track of
    who was in secure possession of the evidence at any time and being unable to account
    for its authenticity leaves the evidence open to challenge and potentially being
    excluded from your case.


    # Not Obtaining Statements When You Had the Chance


    It is recommended that statements be obtained as soon as possible after interviewing
    a person. This includes statements from the investigation and IR teams. People
    are transient in their employment, and the system administrator is a key witness
    in your investigation and provided valuable data may take another employment opportunity
    overseas months after your interview and may not be able to be located.


    Obtaining a statement as soon as possible after an interview will prevent a situation
    where you have key evidence but no capable of presenting it in court. If you have
    the evidence and a statement recorded at the time of interview, even if a witness
    cannot be located the statement and evidence can be presented to the court and
    an argument stating that the evidence should be allowed even though there is no
    opportunity for the witness to be cross-examined. This will be very dependent
    on the court rules within your jurisdiction.'
