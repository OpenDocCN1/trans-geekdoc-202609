- pgno: 110
  md: '# Investigating the Cybercrime Scene


    +   A camera/video recorder/GoPro camera or similar device. Do not use your personal
    phone unless absolutely necessary, as defense lawyers may ask to examine it. A
    GoPro camera or similar device may be very useful if dealing with a large number
    of people or if there may conflict involved in your attending the location. It
    also record the level of professionalism of the investigation team and prevent
    accusations of being made against you. Check the laws in your jurisdiction as
    to the recording of interviews and related matters.


    +   A Faraday bag to restrict external access to live mobile devices. This prevents
    an external party from remotely interfering with the mobile device, such as deleting
    evidence. If a Faraday bag is not available, an empty (unused) metal container
    is sometimes a suitable substitute, as is using aluminum foil to wrap the exhibit.
    While latter methods seemsophisticated in a digital world, as long as they work
    there is no need to discount them when a Faraday bag is unavailable.


    +   A laptop. A laptop is useful for many reasons, including for Internet access,
    recording exhibits, having a copy of portions of the investigation file, and so
    on.


    +   Digital recorders to record conversations as required. The laws of your jurisdiction
    will determine the legality of recording conversations.


    +   External hard drives for securing evidence with the assistance of the digital
    examiner. Use new or reformatted devices to prove that the evidence located is
    not contaminated by previous investigations.


    +   A series of computers for recording statements.


    +   A portable printer to print statements to sign if there are no facilities
    available where you are.


    +   Preprinted labels and forms for recording exhibits and the team member locating
    them. These support the notebooks of the investigation team.


    +   Stationery and materials for writing and marking items, including pens, pencils,
    marker pens, and related items.


    +   A bag of small tools, such as a flashlight, a pair of scissors, screwdrivers
    of various sizes, and the like.


    This is not a definitive list and scene managers/exhibits officers will add further
    items as required. Technology management is also expanding and consideration of
    the need for developing technology will be required. Some of these are similar
    to those used by the digital investigator and may be included in the investigator''s
    kit bag as a backup to the digital investigator in the event a larger volume of
