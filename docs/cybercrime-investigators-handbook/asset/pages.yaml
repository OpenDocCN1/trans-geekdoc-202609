    for the many reasons discussed throughout this chapter. However, this, does not
    mean that evidence is beyond the investigator or inquiries should not be pursued.
    It means that the investigator must understand and respect this challenging environment
    and that obtaining evidence from a cloud-computing environment is not business
    as usual.


    The CSP provides a lawful product and does not like its services being misused
    by criminal entities. Many of the issues addressed in this chapter can be navigated
    by open communication with the CSP early in the investigation. A few ideas to
    advance your investigation follow.


    +   **Establish cooperation with the CSP before the incident.** In a perfect world,
    gaining access to the required staff at a CSP would be as easy as responding to
    an incident as it was during the recruitment phase. However, this is not always
    the case. It is recommended that a data owner obtain the emergency contact details
    of the key people at their CSP in the event of an incident, and that this be incorporated
    into their Incident Response (IR) plan.


    +   **Contact the CSP early in the investigation.** The issues discussed in this
    chapter are not new and CSP lawyers and digital investigators have the capability
    to greatly assist you. As has been mentioned regularly in this'
