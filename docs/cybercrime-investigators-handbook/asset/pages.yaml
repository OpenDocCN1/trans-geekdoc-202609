- pgno: 109
  md: 'recorder (where your jurisdiction allows) will be of great benefit. Details
    about suspect interviews are covered in Chapter 16, "Suspect Interviews."


    In summary, the basics of investigation team membership need to be established
    before attending any scene. Also allow for team members who have holidays upcoming,
    training courses, and other Human Resource (HR) considerations that mean they
    may not be available at a specific time or for follow-up investigation. To alleviate
    these potential problems, having staff to cover a multitude of positions is recommended,
    as well as having multiple options available for the specialist position of digital
    investigators. Over time, where possible and practical, rotate staff to different
    positions on the investigation team as it keeps them motivated and develops their
    skills.


    Now that we have an understanding of the people who make up the membership of
    the search team, we will examine the equipment they may need at the scene.


    # RESOURCES REQUIRED


    There are a lot of items scene examiners may take to a scene to assist them and
    secure evidence. The list that follows a lot of material, and the experienced
    scene examiner will add to or delete items as their experience and the unique
    characteristics of each scene dictates. Digital investigator will have an additional
    list of requirements.


    +   - Containers for carrying a large volume of exhibits. These may be cardboard
    boxes, specific storage containers, carry bags, and the like.

    A Notebook with numbered pages. Tear out the pages of a notebook, even if a mistake
    is made, as defense lawyers will want to know if anything is being hidden. Cross
    out mistakes so they can be read. Honest mistakes and misspellings occur.

    A Master exhibit register to record all items seized and the movement of exhibits.

    A receipt book or document to provide a receipt to the party you are seizing evidence
    from that they are aware of exactly what has been taken. This document will also
    be of value when recording the chain of custody. An example is included in Figure
    10.3.

    Labels to attach to items seized, such as computer devices, hard drives, and the
    like. Also tags to attach to leads and cables so that they can be uniquely associated
    with the device they were located/connected to.'
