    is routinely stored in the cloud.)

    - What external storage devices are associated with the subject device? Examples
    include USB devices, mobile phones, and portable hard drives.

    - What examples are of shadow IT (Information Technology)? (This includes applications
    and services installed by a user without the approval or knowledge of the system
    administrator.)

    - What is your account identifier and email address? Do you have any other user
    names associated with the device/network?

    - What cleaner programs (such as CCleaner or BleachBit) are used on the computer?
    When were they installed and by whom?

    - If an internal employee committed a suspected offense, how can it be determined
    that it was a deliberate action of dishonesty and not a person exceeding their
    authority?'
