- pgno: 266
  md: 'Continue to ensure the chain of custody of the exhibits when conducting the
    review. Prepare a schedule explaining all movements of security for the exhibits,
    as this is very useful the exhibits officer be cross-examined in court regarding
    the exhibit chain of custody. Your legal team will also greatly appreciate this
    document to help them clarify exhibit custody.


    As the investigating officer, when reviewing the chain of evidence you may find
    there is evidence you did not know was seized or evidence relevance you did not
    understand at the time. For example, notebook seized from a suspect''s desk may
    contain numerous notes covering their daily duties but also contain their passwords
    or details of other staff members'' passwords that they have accumulated.


    Keep the client informed of the investigation progress. There is no need to explain
    every theory, as these may change regularly, but the client will be very interested
    in the investigation progress, cost, and potential to identify a suspect, especially
    if there is suspicion of an internal offender.


    As you review the evidence, suspects may change, new theories develop, legal issues
    may be encountered, and the relevance of evidence change. The complainant has
    placed a lot of trust in the investigation team, and as you review the evidence
    and the case in general, they will be wondering about what is happening and the
    progression of the evidence, and will appreciate regular communication from you,
    even if it is only a five-minute courtesy phone call.


    When making a recommendation to the client or making a decision to prosecute,
    ensure every claim in the recommendation is supported by admissible evidence.


    Compare the evidence against the elements of the offenses investigated. If there
    are elements of the potential charges that cannot be proved, then further inquiries
    will be required or the investigation will have to terminate. Clearly identify
    which witnesses are presenting or supporting the evidence that substantiates the
    elements of the alleged offense.


    Your evidence review will project the professionalism of your investigation and
    knowledge of evidence. Understand the laws you are considering and link the evidence
    to the ingredients of the offense. If you cannot support the claim, be prepared
    to say so.


    Question whether the evidence supports the allegation. This is not always the
    case, as you may find the person referring the complaint it made based'
