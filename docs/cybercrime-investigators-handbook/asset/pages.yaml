  md: 'identified the device and understood its meaning. A covert camera was installed
    in his office, which captured the employee returning the following evening and
    looking for the keylogger, which had been removed.


    Police were called and the employee charged criminally. The scene examination
    of his home identified purchase receipts for the device and bank records showed
    a payment transaction. His personal computer''s web history showed him purchasing
    the keylogger online. Computer logs also showed the keylogger being tested on
    the employee''s personal computer, providing a direct link between the attacker
    and the keylogger.


