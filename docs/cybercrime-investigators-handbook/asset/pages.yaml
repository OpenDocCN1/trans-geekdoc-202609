- pgno: 260
  md: '+   Explain in your own words the relevance of the evidence that has been secured.

    What is your relationship to the evidence? (This question is relevant if the witness
    has access to a shared device.)


    Note that the questions are all open ended, meaning that the interviewee cannot
    answer with a yes or no. Also note that the questions are all very short and direct.


    # CLOSING THE INTERVIEW


    Once you are satisfied that you have obtained all the evidence you can from the
    interviewee, it is time to close the interview. At this time, it is helpful to
    repeat your understanding of the information obtained from the interviewee in
    your own words, which allows the interviewee to correct you on your understanding
    and possibly add any new material that they have suddenly remembered.


    Closing the interview can involve several questions to prove that the interview
    process has been fair to the witness/suspect and to protect your integrity before
    the court. Examples of such questioning may include:


    +   Did you take part in this interview of your own free will?

    Do you have any further information you think may be relevant to this matter that
    I have not asked of you?

    Do you have any complaints about the manner in which you have been treated?

    Was there any threat, promise, or inducement given today to persuade you to undertake
    this interview?


    Always thank the interviewee for their time and keep them informed of developments
    where practical.


    # REVIEW OF THE INTERVIEW


    Once an interview is completed, the temptation is to move on to the next line
    of inquiry and to build on what benefit you''ve gained from the interview. Experienced
    interviewers understand that there may have been important evidence or indicators
    they missed during the interview, and they will review'
  merge: -1
  img_proc: true
- pgno: 261
  md: '# Preparation of Brief for Referral to Police 255


    the recording to see if there is anything of value they''ve missed. Some examples
    of inductors identifying that a person was uncomfortable with a line of questioning,
    gave very specific answers to some questions but was vague in answering others,
    changed references to themselves from the first to the third person, moved about
    in their chair when uncomfortable, or moved their eyes nervously when discussing
    certain points. While these may seem obvious after the fact, when conducting the
    interviewer may be concentrating on the evidence and miss some vital nonverbal
    indicators of discomfort or nerves.


    Sometimes as an investigation develops there may be a need to reiterate-a witness.
    This is not a sign that the original interview was not conducted well but instead
    new information develops through any investigation and new lines of questioning
    eleve, meaning questions never originally considered relevant.


    Depending on your local laws, record a new statement and reference the original.
    For example, the introductory sentence of the new statement may read:


    This statement is an addendum to the statement I provided on October, 2018.


    # PREPARATION OF BRIEF FOR REFERRAL TO POLICE


    Whether or not it the initial goal of the client/complainant to have their complaint
    referred to police for a follow-up investigation, there will be instances the
    facts uncovered during the investigation require a referral to police. When preparing
    the investigation for referral, remember your covering report will be read by
    police who have no knowledge of the matter and need to identify within the first
    two paragraphs the most important information about your referral. If you require
    police searching through your report for details about what the complaint is,
    who the complainant/suspect is, what evidence you have, and why it is a criminal
    matter, the chances are very high that police will lose interest in your referral
    very quickly. They do not have the time to go for the facts, which should be highlighted
    by the person making the referral.


    When a cybercrime is very serious, you may contact your police cybercrime experts
    for advice and they may (depending on resource available) be prepared to take
    your complaint at once.'
