- pgno: 103
  md: '# Investigating the Cybercrime Scene 95


    At a scene detects use the saying "Control the people and you control the scene."
    This means that people at the scene and their actions are one of the biggest risks
    to the integrity of scene management, and the digital investigator must ensure
    that only persons who are required at the scene are present, that their presence
    is documented, and that their actions are recorded in notebooks, which may become
    evidence in its own right. This may be difficult in a commercial scene where the
    day-to-day business is continuing, the burden remains on the investigation team
    to work within this environment and preserve the scene and collected evidence
    to the standard required by the local courts.


    A pre-plan event records many aspects of responding to a digital event, and the
    scene manager is in the detective who has control over the event from the start.
    The pre-plan event will be discussed in subsequent sections of this chapter. The
    investigation manager and team members need to understand the crucial role of
    evidence preservation and the preapproved authority to manage the event as they
    deem necessary in the circunstancias. This may involve the authority to tell senior
    members of the organization to stay away from the scene while emergency action
    is being taken and provide briefings in a separate location on a regular basis
    or when new information comes to hand. Should a senior manager of an organization
    start the investigators to do their job, the senior manager may be required to
    attend court in the trial of a defendant, explain the reasons for their directions,
    and detail their experience in scene management and evidence preservation, as
    well as take responsibility for any negative consequences arising from their directions.


    As a final thought before progress into the investigation processes, understand
    that your job at the scene is not necessarily to solve the crime within the first
    hour, although that is a great result if you can. One of your key tasks is to
    lay a solid foundation for the main investigation phase through scene management
    and evidence collection.


    This chapter discusses the many different aspects of scene management. It will
    take a very generic view of evidence identification, collection and seizure, as
    the laws in each legal jurisdiction vary. It is the responsibility of the investigator
    to understand the rules of evidence and scene management in their jurisdiction
    using this chapter as a supporting document. The principles of this chapter may
    apply to searches at a complainant''s premises as well as those of a suspect,
    where you attend the scene with a court order. Note that Figures 10.1 through
    10.8 are re-creations of these. These images have been included in the book to
    add all relevance. The original images'
