- pgno: 34
  md: '# Potential Cybercrime Offenses 21


    When the funds have been accessed and the money is to be moved across international
    borders, the cybercriminal will need another victim or unknow-associate to assist
    in moving the funds to a jurisdiction they can access. The unknowing associate
    becomes in effect a money mule.


    The money mule is an unknown person who believes they are involved in a legitimate
    business venture or who has been socially engineered to believe they are in a
    relationship with a legitimate person. They shall be viewed separately. As these
    are common methods of removing money across international jurisdictions, the investigator
    may be required to interview them to identify their level of culpability.


    # Business Money Mule


    The business money mule is a person who has responded to an online adver-isement
    for what they believe is a legitimate job. The most common job they are recruited
    for is to receive money into their bank account on behalf of the company employing
    them while it sets up in the host country.


    As money is placed into their account, they are recruited to immediately send
    it to a specific account or to a person using money transfer services, exchange
    it into virtual currency, or use their personal bank account to transfer the money
    overseas. They are permitted to keep a specified amount as a commission, which
    reinforces their belief they are involved in a legitimate business venture.


    This is a risky time for the cybercriminal, as they are trusting a third party
    to be an integral part of their cybercrime. To mitigate the risk, they may imme-diately
    contact their money mule by phone and keep them on the phone while the money is
    obtained and transferred. This may require an investment of sev-eral hours of
    their time but helps to mitigate the risk of the money mule deciding to keep an
    apparent windfall for themselves.


    # Socially Engineered Money Mule


    This is a very different type of person from the business money mule, as they
    believe they are in an established relationship with another person. This rela-tionship
    may be several years long. The most common form of person to fit this category
    is a person who has been victimized through online relationship fraud, where they
    have sent money to their new friend to support and bring them to their home country.


    As the relationship develops, the victim is asked to receive money into their
    bank account to help facilitate a business venture their online friend needs to'
  merge: -1
  img_proc: true
- pgno: 35
  md: 'complete to finalize their travel to meet the victim. At this time, there is
