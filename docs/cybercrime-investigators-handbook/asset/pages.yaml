- pgno: 115
  md: '# Technical Items


    (192.168.***, or 10.*** *** in a large internal network) are allocated to computers
    on an internal network. Internal networks are called subnets, or subnets. A DHCP
    address will start with 192.168 or 10.***, as these numbers represent the internal
    addressing system within a network. If you have an Internet Protocol (IP) address
    for a company but do not know which computer on the network was involved in an
    event, DHCP logs retrieved by the system administrator will tell you which computer
    on the network you are looking for.


    The alternative to DHCP is if the system administrator designates every computer
    and device on an internal network by a specific IP address within the dedicated
    range.


    An investigator may seek this information, for example, if they have an Internet
    Protocol (IP) address that links to a large corporate office from an employee
    has been making threats to another person. The investigator has the evidence to
    point to the company, but does not know which of the many people in the organization
    is the behind the threats. Speaking to the system administrator and providing
    the website in question and the threats were made provides the opportunity to
    check the internal network logs to identify who in the company was logged onto
    that website at the time the threat was made.


    The system administrator will be able to see that the activity was generated by
    a person on their network with address 192.168.213.57 and will be able to identify
    the terminal the threat originated from. From there, suspect inquiries can be
    made, conducting a digital examination of the device, and asking the victim if
    they know the person who was logged onto the device.


    +   **Cloud services.** Computing is discussed in Chapter 12. In general, a complainant
    or suspect may see evidence on a cloud server owned and operated by companies
    such as Apple Dropbox, Amazon Web Services, Microsoft, and Cisco. Storage may
    be located throughout the world and the evidence might be spread across many data
    centers in different legal jurisdictions.


    +   Cloud-based evidence may include logs, documents, audio recordings, and the
    like. Subscriber details may include IP addresses to log on and access account
    details, credit card details, and more.


    +   **Webmail accounts.** Web providers such as Gmail, Hotmail, and Yahoo offer
    free services to customers. Webmail accounts contain a large amount of data, including
    registration details, sign-up and log-on IP addresses, communication content,
    and address lists. For paid services,'
