    the defense with an argument that the evidence showing your client''s innocence
    has not been collected because logistics, time, expense, complexity, or the lack
    of resources? Evidence from the CSP required? Reconsider methodology (such as
    using screen capture of the evidence) that was to be used as an investigative
    tool. If the evidence from the CSP is not required, continue the investigation
    using traditional methodologies without the cloud-based evidence. If it is required,
    progress to step 11.


    # Step 11: Is sufficient evidence to get a court order?


    Is there sufficient evidence available to satisfy judicial authorities in all
    jurisdictions when seeking a court order for the evidence from the cloud platform
    that has been committed and that evidence resides with the CSP? Failure to prove
    this point reduces the potential to obtain judicial orders from either jurisdiction.
    This applies equally to criminal and civil investigators. If sufficient evidence
    exists, progress to step 12. If not, refer back to step 2 and review the evidence
    held.


    # Step 12: Identify the number of court orders required.


    Identify from discussions with the CSP whether multiple court orders need to be
    obtained for evidence held in different legal jurisdictions. The multijurisdictional
    nature of cloud storage, where the location of potential evidence is distributed
    throughout many different servers, and potentially in different legal jurisdictions,
    has been regularly discussed in other sections of the book. This is particularly
    relevant when the CSP is a reseller of cloud services.


    Progress to step 13.


    # Step 13: Identify the exact wording to go on the court orders to obtain full
    evidence.


    Discuss with the CSP the exact wording that they require to avoid fusion and ensure
    that you are obtaining the totality of evidence that you require. Issues have
    arisen in the past where court orders have been served on a CSP that do not make
    sense, request evidence that does not exist, that apply to the wrong jurisdiction,
    request only a portion of the available evidence, or leave the CSP in the position
    of having to breach legislation to comply.


    Progress to step 14.'
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Step 14: Identify legal requirements with the foreign jurisdiction.


    Discuss with the law enforcement agency or local lawyers in the tar-get jurisdiction
    the legal process that must be undertaken and the level of evidence required to
    obtain data through a court order or a similar legal instrument. The laws of each
    country may vary markedly and what may be accessible in one country may not be
    accessible in another. Also, laws change and what may have been an acceptable
    legal application in a pre-vious investigation may no longer be applicable.


    Progress to step 15.


    # Step 15: Are dual criminality requirements for mutual legal assis-tance treaties
    or civil court applications met?


    Establish whether the offense being investigated is an offense in the jurisdiction
    where the evidence is to be sought. In some countries dual criminality may be
    a necessity to obtain foreign cooperation in obtaining a court order and the seizure
    of evidence. If so, this may hinder the inv-igator''s ability to obtain a court
    order to obtain evidence. Whether this is a condition of a treaty or civil application
    depends on the agreement in the legislation between both countries. If dual criminality
    requirements are met, progress to step 16. If not, refer to step 2 and reevaluate
    your evidence and options.


    # Step 16: Confirm the legal requirements for content and noncontent data.


    Decide on what evidence you are seeking subject to the investigation you are undertaking,
    and the results of the advice provided by the CSP legal department and foreign-based
    legal advice. Generally, a subpoena may access noncontent data such as logs and
    a search warrant obtains both content and noncontent data.


    Progress to step 17.


    # Step 17: Seek metadata.


    When obtaining content data, seek the metadata that is behind the con-ter than
    just a copy of the sought-after documentary evidence. This is valuable evidence
    and may significantly advance your investigation and help to identify the person
    behind the offense. An example of valuable meta-data is the identity to who created
    a document, when it was created, and when it was last accessed.


    Progress to step 18.


    # Step 18: Consider the legality and technical feasibility of remote forensic
    technology.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Cloud-Computing Investigation Framework 215


    Despite technology being available to conduct a remote forensic examination of
    the target computer, this should only be of consideration when the issues of legality
    in all jurisdictions, cooperation of the CSP, and completeness of the sought-after
    evidence have been fully addressed. Failure to lawfully account for the collection
    of data can result in evidence excluded from court proceedings and the party doing
    the data capture in the remote jurisdiction may face legal proceedings in that
    jurisdiction. Also, being unable to prove lawful capture of data may make evidence
    inadmissible. If the decision is not made to use this technology, proceed to step
    19; if technically and legally able to do, undertake evidence capture and proceed
    to step 30.


    # Step 19: Obtaining foreign evidence.


    Consider options to obtain evidence from the CSP. If using a traditional MLAT
    application, prepare the application and seek authority through designated channels
    to obtain a treaty request in the target jurisdiction.


    If using civil lawyers in the target jurisdiction, the process of obtaining the
    evidence will be through the directions of your foreign lawyers, allowing for
    the different requirements of the foreign legal jurisdictions.


    If a law enforcement agency, proceed to step 20. If a civilian investigator, proceed
    to step 22.


    Again, steps 20 and 21 identify a proposed methodology for law enforcement investigators
    using MLAT legislation to obtain evidence from a CSP in a foreign legal jurisdiction.
    It is not applicable to civilian investigators.


    # Law Enforcement Investigator


    # Step 20: Prepare and submit treaty application.


    MLAT requests must be prepared and forwarded to the law enforcement representatives
    in the target country through designated channels. The agency and their legal
    representatives will ensure the request complies with local legislation, including
    the rules of evidence.


    If approval is given to forward the submission, progress to step 21.


    # Step 21: Comply with mutual legal assistance treaty applications.


    MLAT legislation places requirements on law enforcement officers seeking evidence
    from foreign legal jurisdictions. It is outside of the boundaries of this book
    to examine such procedures, as each law enforcement agency will already have established
    procedures for obtaining such evidence through designated channels. In Australia,
    these channels operate through'
  merge: -1
  img_proc: true
- pgno: 223
  md: '# Preserving Evidence from Cloud-Computing Platforms


    the Attorney-General''s Department and in the United States through the office
    of the Department of Justice.

    Progress to step 23.


    If you are a civilian investigator, you will go to step 22 after step 19: as mentioned
    previously, steps 20 and 21 apply only to law enforcement investigators.


    # Civilian Investigator


    **Step 22: Prepare and submit legal documentation.**

    The civilian investigator will need to invest time with the lawyers in their jurisdiction
    as they prepare their international request for evidence. A partnership will need
    to be established with lawyers in the foreign jurisdiction.

    Progress to step 23.


    Law enforcement investigators will proceed from step 21 to 23; civilian investigators
    from step 22 to step 23.


    **Step 23: Keep in contact with CSP.**

    The requesting officer must keep in regular contact with the CSP and advise them
    of the progress of the treaty application, as an application can take a significant
    period of time depending on the workloads of the legal representatives in all
    related jurisdictions and as well as the quality of the treaty application. Failure
    to keep in contact with the CSP may result in the stored evidence being no longer
    required and disposed of. Speak to the CSP regularly and confirm how often they
    need to be kept informed of the progress of the legal proceedings.


    Note that MLAT applications from outside the United States may take a very long
    time to pass through the layers of bureaucracy. It is not unusual for MLAT requests
    to take up to two years from the time of preparation to obtaining the evidence
    from the CSP. Many CSPs are not aware of the layers of bureaucracy involved and
    may need to be advised that the delay between the request for evidence preservation
    and the court order authorizing the release is not the investigator''s fault.

    Progress to step 24.


    **Step 24: Consider potential for third-party providers.**

    Should the third-party providers of the CSP''s infrastructure component have evidence
    that cannot be obtained from the CSP, a separate court order via a treaty application
    seeking the data may be considered.

    Progress to step 25.'
