- pgno: 73
  md: '# CYBERCRIME CASE STUDY


    Executing search warrants and civil court orders on commercial premises provides
    advantages in terms of controlling the evidence, scene, and inhabitants; however,
    you are in effect hindering the operation of a business. Your presence will have
    been authorized by the court as legal, but you will need to balance the needs
    of your investigation against the requirements of a legitimate business to keep
    operating.


    A business was raided by suspicion of fraudulently providing financial services.
    The allegations were that the business was engaging in a combination of cyber
    fraud, where fraudulent websites had been created showing impressive financial
    returns over the preceding years, and the social engineering of victims through
    phone and email communication.


    The business claimed that the search warrant hindered its capacity to operate
    what it stated was a legitimate business and that it was concerned at the loss
    of trading, its computer servers, and its personal and business reputation. It
    was also concerned that its employees would no longer work for it there should
    be suspicions that the company was engaging in a series of frauds.


    The investigators understood these concerns when seizing the company servers and
    multitudes of documents, and also understood that they were effectively shutting
    down the business permanently. Subsequently, corroborative evidence supporting
    the seizure of the evidence from the digital crime scene was located, including
    evidence of the selling of financial services without a license, of employees
    using fake identities, and of the claims of the financial success of the products
    being fake. Also, a review of digital printouts located evidence of several phoenix
    companies, providing a long list of suspected financial frauds.


    Chapter 7 introduces the initial engagement meeting with the complainant, where
    the boundaries of the investigation are set, resources allocated, and authority
    delegated.


    # NOTE


    +   1. Janet Williams, ACPO Good Practice Guide for Digital Evidence, March 2012,
    Association of Chief Police Officers.'
