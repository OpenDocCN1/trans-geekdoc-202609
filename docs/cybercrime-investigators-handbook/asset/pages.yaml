  img_proc: true
- pgno: 54
  md: '# Attack Methodologies


    9. Keylogger. A keylogger is either a physical device attached to a computer or
    a piece of software installed on a targeted device/network that captures every
    keystroke or mouse click. This allows the attacker to capture all activity on
    the device, including reports and passwords.


    10. The insider threat. Using trusted employee access to a network is another
    method of breaching the corporate firewall. Employees have access not only to
    corporate data but also to physical devices. Insiders have their own motivations
    to commit criminal offenses against their employer, and an external cybercriminal
    exploiting a person greatly expands their attack platform.


    11. Operating systems and attack exploitation. Operating systems and applications
    need to be updated regularly, as the cybercriminal will learn the vulnerabilities
    an update repairs. Technical products can undertake port scans to identify current
    operating systems and applications in use and identify which version they are.
    With this information, the cybercriminal can develop an attack strategy to exploit
    the unlinked vulnerability.


    12. Malicious software. The term "malicious software," or "malware," covers a
    wide range of computer viruses. Trojans, worms, and the like. While this form
    of attack has been present on the Internet for several decades, it is still a
    productive method of attack for the cybercriminal.


    A particularly dangerous form of attack is one that is unknown and stays undetected
    within the system for an extended period of time while corporate data is being
    extracted. As discussed in Chapter 2, these are called. Advanced Persistent Threats
    or APTs. An attacker using an APT to infiltrate a network and have the APT undetected
    while it gathers as much information as possible about the network and its activity.
    The APT controller will seek to increase their access privileges over time to
    gain access to the most sensitive corporate data.


    PTs are generally associated with well-resourced, organized groups whose aim is
    for the APT to remain undetected within the network as long as possible. This
    may be months, or years.


    n advantage of APT exploitation to the attacker is that they gain updated data
    as it is generated, with the ability that they are alerted should their intrusion
    be detected. Upon realizing that they have been discovered, in some instances
    APT controllers seek to destroy any potential evidence of the intrusion and their
    activity, meaning the IR team will have difficulty in identifying the boundaries
    of the intrusion and its seriousness. This will'
