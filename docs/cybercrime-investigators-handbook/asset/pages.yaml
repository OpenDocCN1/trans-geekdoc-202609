  md: '# 66 Initial Meeting with the Complainant


    In general, police do not need such formal written guidelines, as their authority
    comes with the complaint being received and because of their legislative authority.


    Although investigator may have conducted numerous investigations and attended
    numerous crime scenes throughout their career, each is different, and the investigators
    must keep their minds open to unique features of the complaint, scene, attack
    methodology, and persons they are to interact with. Having tunnel vision in the
    initial stages of an investigation means the investigator will end up in a predetermined
    location and miss important factors.


    An investigator needs to take full advantage of this interview, as the more senior
    the manager within an organization, the harder it will be to speak to them, as
    they will be involved in running the many aspects of the business. Although they
    are asking for your assistance, they may designate another person to be your point
    of contact in the organization after the initial interview.


    At the very beginning of conversations, identify any potential safety risks to
    the investigation team or other persons. This is a critical point, while the initial
    interview is taking place, other team members may be dispersing to commence their
    duties. Details of potential risks, such as suspects being present, must be immediately
    communicated to all team members and others whose safety may be at risk.


    Examples of questions the investigator may ask in the initial interview include:


