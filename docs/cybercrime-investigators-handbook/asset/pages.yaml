- pgno: 278
  md: '# 19

    CHAPTER NINETEEN

    Conclusion


    THE world becomes more connected and technology expands into every aspect of our
    lives, targets become easier to locate and attack for cybercriminals. With the
    development of technology, it is often said you can reach out and touch the world
    from your home. However, the inverse of this is that the cybercriminal can now
    reach into your home and/or business from their location anywhere in the world.
    The cybercriminal has realized that it is easier and safer to commit a cybercrime
    against a person or company on the other side of the world than it is to commit
    a crime against their neighbor.


    The threshold for becoming a cybercriminal is very low, and there is no turf war
    between cybercriminals demanding that no other person intrudes on their turf,
    which is not the case with all crime types. The Internet is open season on everyone.
    The emerging cybercriminal needs only a very limited skill set, as there are volumes
    of training resources available provided by more experienced criminals sharing
    their trade, as well as automated tools doing the hard work of breaking into home
    devices and corporate networks. The rewards are unfortunately great, and the damage
    done to the innocent victims is often horrific and life changing.


    Due to the many technical issues discussed throughout this book, from the cybercrime
    investigator''s perspective locating the offender and harming


