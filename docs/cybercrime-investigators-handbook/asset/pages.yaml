    ^1 Expression Encoder records the page as seen by a web user and allows it to
    be stored in an easy-to-view format.


    To produce the most accurate and complete version of a recording as possible,
    download and display an atomic clock, which may be adjusted for time accuracy
    at the commencement of the recording and viewed throughout the evidence capture.
    This allows a viewer to see a complete capture of the evidence and the time it
    was captured, providing proof that no manipulation of the evidence (such as being
    edited out of the recording) has taken place.


    There are numerous forms of open source evidence that may be available to an investigator
    and there are many excellent books and courses covering this material. Open source
    tools are produced by many organizations and individuals, including Toddington
    International (https://www.toddington.com), IntelTechniques (https://inteltechniques.com),
    Qquare (https://www.ququare.com), and OSINT Framework (https://osintframework.com).


    Should you decide to capture open source material, there is a specific skill required
    to do so without compromising your investigation. Technically skilled criminals
    would conduct counterintelligence on their websites to see who has visited and
    what they have been looking at. For example, using web analytic tools they may
    find an Internet Protocol (IP) address they wish to find out about and determine
    that it can be traced to a law enforcement agency, private investigator, or similar
    entity investigation. This will alert them that they are under investigation and
    may lead them to destroy the evidence you are seeking or launch a counterattack
    against.


    Open source investigations require their own skill sets and it is recommended
    that you seek specialist advice before proceeding in this area. Several examples
    of the skills you will require:


    +   - Using a specialist laptop device that can have the Operating System (OS)
    reinstalled without concern

    - Using a Virtual Private Network (VPN) for connection before commencing your
    investigation

    - Using a virtual system

    - Using a connection that has no link to your organization

    - Having a high level of security on your device and ensuring that the OS and
    all applications have recently been patched


    As referenced in previous chapters: understand the laws in the relevant jurisdictions
    to understand the legality of undertaking open source investigations.


    This chapter will introduce examples of the forms of open source material available
    to an investigator and discuss their benefits.'
