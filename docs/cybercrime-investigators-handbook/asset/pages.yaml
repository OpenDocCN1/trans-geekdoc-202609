  img_proc: true
- pgno: 163
  md: '# Being Underresourced


    Crime scenes may be very volatile places. Having sufficient team members and equipment
    is an investment. Taking too many people to the scene is far preferable taking
    too few, as excess staff can be released to attend to other duties if they are
    not needed.


    Being underresourced at a scene may be by having too few spare drives to capture
    data or equipment that is out of date for the tasks required.


    # Careless Comments by the Investigation Team Being Overheard


    Should a suspect be identified at a scene, be very aware of what you say. You
    may have loyal friends nearby who may overhear derogatory comments made about
    the suspect, and you cannot assume that their loyalty will be to the company/investigation
    team.


    In today''s society, assume someone is recording everything you do and say at
    a crime scene. The phone left on the desk next to where you are speaking with
    your staff may have been deliberately left with the recording feature on to capture
    your conversation.


    Technically knowledgeable suspects have the capacity to remotely turn on a device
    which you have seized and activate the microphone remotely. This will capture
    your conversations, including conversations taking place in the office when you
    are having your team debrief. The conversation could then be synced into a cloud
    account, from where the suspect or their associates can listen to you and your
    discussions. As previously discussed, placing mobile devices in flight mode and
    then into a Faraday bag or similar container will assist your team security.


    The following cybercrime case study provides an example of attending a corporate
    office to obtain technical evidence from the corporate network after a threatening
    email had been forwarded to another person with a corporate IP address in the
    email header.


    # CYBERCRIME CASE STUDY I


    A female sex worker had a client who developed a fixation on her and believed
    that they were developing a personal relationship, which was obviously false as
    the worker had made it very clear that the relationship was only a business relationship.
    The client began to research the worker and identified her true identity and residence.'
