  md: '# EXAMPLES OF OPEN SOURCE EVIDENCE


    There are numerous online locations to locate evidence, which is freely accessible.
    Some examples follow.


    +   - **Blogs.** A blog is a website where author(s) discuss issues of interest
    to them and their readers. Depending on the mood and interest of the author(s),
    it may address a specific subject, such as politics, or cover a wide range of
    topics.

    There are several hundred million blogs in existence, with emerging daily. Of
    value to the investigator is the potential to link a person to a user name, which
    may be used across different sites. It is also helpful to understand the dynamics
    of a specific topic relevance to an investigation.

    - **Dark web.** The dark web is a portion of the Internet where traditional search
    engine tools (such as Google) do operate due to restrictions imposed on them.
    Although there are legitimate reasons for using the dark web, it is commonly understood
    to be a place where criminals communicate and hot markets sell different forms
    of illegal goods and services, such as stolen credit cards, stolen identities,
    Intellectual Property (IP), and more. Specific tools and applications are needed
    to enter the dark web.

    The investigator who believes evidences for their investigation resides on the
    dark web should practice extreme caution before proceeding, the criminal community
    conduct robust countersveillance in this environment and show suspicion towards
    persons they suspect of investigators, law enforcement officers, and others who
    may pose a risk to them. If you are not confident in this environment, unsure
    about the legality of going onto the dark web from your jurisdiction, or concerns
    about your security (personal or digital), refer this area of inquiry to specialist
    investigators who have knowledge and experience in this field.

    The web will be discussed in detail in Chapter 15.

    - **Domain lookup tools.** Domain lookup tools provide details about the owner
    of an Internet domain. While the details regarding the owner of a domain may be
    blocked or false, they are a very useful place to commence inquiries, as many
    registrations contain correct information.

    Domain lookup tools also provide information on a web page or email server located.
    Examples of tools include CentralOps (https://centralops.net), Whois (https://www.whois.com/whois/index.html),
    and the reverse Internet protocol check at ViewDNS (http://viewdns.info/reverse/).

    - **Email tracing.** The header information included on an email may provide the
    Internet Protocol address of the sender. This is not always the case, as'
