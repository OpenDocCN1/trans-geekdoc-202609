- pgno: 156
  md: '# Investigating the Cybercrime Scene


    digital investigator, who will have triaged the device, gives approval. The only
    exception to this rule is if you have grounds to believe that the device is in
    the process of destroying evidence, such as a case of the offender using a remote
    logon to wipe a drive with incriminating evidence.²


    While the digital investigator will be the authority on digital evidence seizure,
    this section will provide an understanding of investigators of what the digital
    examiner will consider when making their decisions. This information will be valuable
    when conducting a post-search review, preparing court documents, and when the
    search team only has a limited number of members.


    When you arrive at the scene, there will most likely be devices operating. Sometimes
    it will be very clear which devices are of interest to your investigation and
    on other occasions you will have no idea. Your primary interest may be data traveling
    over the network, with locating and securing devices (such as desktop computer,
    laptop, or other devices connected to the network) secondary. In the discussion
    about preserving volatile data, the forensic examiner will make choices about
    the order of evidence seized from the live network, as identified in the section
    "Acquisition of Digital Evidence."


    After prioritizing the volatility of the device, the digital investigator will
    acquire it using forensically sound tools and methodologies. They will record
    the times on the devices and date-time settings, which are particularly important
    when the investigator logs activity of processes, security applications, and so
    forth.


    Once the evidence has been seen from a live device, the investigator will decide
    whether they need to take the device or leave it operating. When it is a business-critical
    device such as a web server, the client may want a digital image of the evidence
    captured and the investigation will continue using the logical image captured.
    Document your reasons for each decision you should be asked in why the device,
    which later was determined to be a key exhibit, or was not seized.


    The digital investigator will create a master copy of the image of the subject
    device and then the examiner will work from a copy, all copies are potential evidence
    and need to be treated accordingly. Having a copy image to work off preserves
    the original and means any problems encountered only occur on the copy of the
    image.


    By taking a forensic image of a live device, the potential exists for passwords
    to be located in the memory. This is an opportunity not to be missed, as encryption
    software installed on a suspect''s device may prohibit access from ever being
    gained.'
