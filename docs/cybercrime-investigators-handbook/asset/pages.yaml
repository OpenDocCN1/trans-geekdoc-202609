- pgno: 52
  md: '# Attack Methodologies


    To assist in these duties, the cyber crime investigator may join the IR team in
    the first instance. Alternatively, they may be brought in once all Incident Response
    (IR) activity has been completed. The investigator will review all evidence and
    seek avenues of investigation in an attempt to identify who was behind the attack,
    their motives, and what potential there is to recover the data stolen. They may
    also work with the IR team to scope the seriousness and extent of the attack.


    As the IR team has been operating at a crime scene, the investigator must take
    control of the evidence generated and become familiar with the activities of the
    IR team, their actions, and what they have identified. It is generally not the
    role of the cyber investigator to provide a detailed analysis of the security
    vulnerabilities and mitigation strategies, as the IR team has predefined skills
    in this area and is better to provide this advice to management. The cyber investigator
    will seek to identify potential lines of inquiry from the IR team and commence
    a full cybercrime investigation.


    # ATTACK METHODOLOGIES


    Understanding the indicators of a cybercrime occurring leads to identify the attack
    methodologies being undertaken. Understanding the attack methodology of the offender
    puts context to their goals and provides indication of the potential evidence
    available. It will also provide evidence of the skill level of the attacker and
    whether it was an attack using specific tools that may be sought in follow-up
    examinations of an identified suspect''s computer. The investigator may use this
    information to direct lines of inquiry and locating evidence. A list of 12 attack
    methodologies follows.


    +   1. External/removable media (inside threat).¹ A USB or external drive is attached
    to the internal network and a file with malicious software (such as a Trojan virus)
    is opened. This opens a path to the downloading of more malicious software that
    infects devices and networks. The advantage of this strategy to the attacker is
    that they have breached the security of the external-facing corporate network
    security without having to attack directly.


    +   2. Brute force (attrition).¹ The attacker tries to break the passwords used
    to gain access to a system.


    +   3. Web-based attack/hacking.¹ The attacker destroys or damages a website,
    or gains unauthorized access to a network or device.'
  merge: -1
  img_proc: true
- pgno: 53
  md: '4. Email (phishing/social engineering).¹ A fraudulent email is designed to
    entice the user to click on the enclosed link or to open a file attachment so
    that malicious software may be downloaded, giving the attacker unauthorized access
    to the system. As with the attack that uses external/removable media, this attack
    breaches corporate security without having to find an unexpected vulnerability
    in external-facing infrastructure.


    5. Breach of acceptable-use policies and the internal threat.¹ Internal policies
    are designed to keep a network safe and to prevent users from accessing high-risk
    sites (such as pornographic sites). Many sites restricted by company policies
    contain material inappropriate for viewing in a work environment or carry a high
    risk of infecting the corporate network (such as a file-sharing site).


    Improper usage can also lead to malicious software being introduced the corporate
    network by using an external drive from home that has been infected by a computer
    virus.


    6. Loss or theft of equipment (USB/computer).¹ USB and external devices contain
    massive amounts of corporate data. Should one be lost that is not encrypted, the
    finder will have access to the corporate records.


    7. Cloud-computing compromise. Storing corporate data in a cloud-computing environment
    should only be done with the approval of management and systems administrators.
    Should an internal or external attacker compromise a cloud service, the corporate
    data will be at risk. Users often create cloud-computing storage to assist them
    when working from home, uploading corporate documents to the new cloud account
    without the knowledge or approval of the system administrators tasked with protecting
    the corporate networks and data.


    The cloud account used may be any of many available on the market, and valuable
    corporate data may be stored in unknown legal jurisdictions and being protected
    by unknown security systems. In the end user license agreement, some examples
    of small cloud services stipulating that data stored in the cloud service transfers
    to the ownership of the Cloud Service Provider (CSP) or that a lifetime nonrevocable
    license to the data is provided to the CSP.


    8. Social engineering. Building a personal relationship with a key person in an
    organization and exploiting that relationship is a common way that corporate data
    is lost. The relationship does not have to be intimate in nature, but a personal
    professional relationship where trust has been built over time results in the
    potential for valuable corporate data to be sent to an attacker.'
