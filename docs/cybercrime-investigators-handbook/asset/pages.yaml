- pgno: 213
  md: '# CLOUD-COMPUTING INVESTIGATION FRAMEWORK


    As cloud computing is a significantly different platform for the investigator
    to operate within, in the manner which evidence is obtained may present legal
    and logistical challenges. Where the cloud servers are entirely within your local
    jurisdiction, many of the issues discussed will not be relevant; however, given
    the manner in which cloud servers are built throughout the world there is a fair
    chance that at some stage in your career you will be seeking evidence from a cloud-computing
    server in a foreign jurisdiction.


    The following section presents a proposed methodology that may be used to legally
    obtain this form of evidence. It is a proposed methodology only, and the laws
    in your legal jurisdiction will affect the relevance of this proposal. As with
    many of the ideas presented throughout this book, use it as a basis for expanding
    your thinking about the legal and logistical issues you may encounter and modify
    as you require.


    Throughout the methodology are references to law enforcement agencies using MLAT
    warrants as the circumstances dictate. Although civilian investigators do not
    have access to these warrants, they are able to access legal assistance using
    court orders in the target jurisdiction. In fact, civilian investigator may be
    able to progress their investigations more quickly than their law enforcement
    counterparts, as the MLAT process is known for being cumbersome and bureaucratic.


    # Proposed Investigative Framework


    To assist in following the proposed framework, a flowchart is presented to provide
    a visual representation of the proposed investigative methodology. This section
    provides the proposed template for your consideration and takes a generic way
    of locating and obtaining evidence from a public cloud facility. The order of
    events is a generic representation only and is advantageous to the investigator
    may find in its circumstances it to the order of investigative steps. Also, the
    considerations may not be applicable in all instances, depending upon the multiple
    versions of cloud-computing products and structures that are available to clients
    as well as the laws in all jurisdictions involved.


    The flowchart also attempts to incorporate the processes of criminal and civil
    investigators, which are identified in the explanations given for each step.


    Figure 12.1 shows a framework that may be used in a cloud-computing environment.'
