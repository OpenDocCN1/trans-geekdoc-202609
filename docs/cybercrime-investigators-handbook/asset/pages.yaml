- pgno: 168
  md: '# 160 Log File Identification, Preservation, Collection, and Acquisition


    This is a very valuable tool for the investigator, as issues such as time zones
    and log formatting will have already been addressed, meaning that it will be easier
    to read evidence.


    Of particular interest to the investigator is logs may be recorded on a separate
    server away from the device subject to the suspected attack. This will be of value,
    as a device may have been compromised or even physically stolen, the server containing
    the logs of activities on the device may be still accessible, recording evidence
    of the attack and uncorrupted by ever. Once logs have been generated, they need
    to be safely stored and secured to preserve their authenticity and integrity,
    just like any other piece of evidence.


    Log files not generally come in one standard format. They vary among operating
    systems, applications, and system files. Different vendors of applications may
    use different formats. Sometimes they are in a format that can be read by a human
    and sometimes they are not. When a log is generated, it is usually time-stamped.
    The investigators will need to understand the format and time zone, as these are
    not a standard feature of log format design. This is where preconfigured SIEM
    system is so helpful to the investigator.


    # LOG CHALLENGES


    Some of the challenges an investigator may encounter with log files include:


    +   - Access logs in the first place, particularly from a cloud server. Access
    may be restricted by the service providing the infrastructure and system architecture.

    - There will be many different log sources depending on the operating systems
    and applications used. The investigator will need to discuss with technical staff
    the attack methodology and what logs will be required to assist the investigation.
    If in doubt, obtain the logs; if you change your mind, they may no longer be available.

    - Manufacturers may use different formats.

    - The data in the log files may differ across applications.

    - Time stamps reflect different time zones. As you commence your assessment of
    logs and compare systems to applications, you will want all your logs recorded
    in the same time zone format.

    - The times on the systems that generate the log files may not be synchronized,
    meaning there will be a variation in the times recorded on different'
  merge: -1
  img_proc: true
- pgno: 169
  md: '# Logs as Evidence


    devices. ² Where there are many logs involved, time synchronization is off by
    a fraction of a second it may affect the investigation and your ability to determine
    what happened.


    +   - Logs may be held for short periods of time due to the cost of long-term
    storage.

    - ³ Businesses that generate large volumes of log records may keep them only for
    a short period of time, as storage is an additional expense.

    - Because of the costs involved in storage, not all logs generated may be recorded.³
    Also, system administrators may perceive that there is no need to record or keep
    a form of log.

    - Logs may be very complex to read and unreadable without specialist applications.⁵


    Logs generated on cloud services may be stored on multiple servers, not necessarily
    always be in the same location, and may not be accessible without the consent
    and assistance of the cloud provider.


    Monitoring of logs as they are created may reveal important information about
    the offense being investigated and lead to the person behind the attack. Although
    the attacker may destroy logs, if certain logs cannot be located, be strong evidence
    of an attempt to cover someone''s activity and should be noted and investigated.
    This may also show the level of skill and attacker knowledge of the network.


    As logs take up a lot of storage over a period of time, systems generally overwrite
    logs on a recurrent basis, prompting action will be required by the investigator
    to secure this valuable source of evidence before it is destroyed. For example,
    a cloud server may overwrite logs every month depending on client activity while
    a company having an in-house Information Technology (IT) system may keep logs
    for six months. The cost of keeping logs across many systems is not insignificant
    and the log data you need as evidence may not have been kept or may have been
    disposed of as a budgetary measure months before the attack.


    # LOGS AS EVIDENCE


    For the investigator, understanding log files is a skill that takes time to learn.
    There are many forms of logs, and they are confusing and come from many different
    sources. However, despite this, they provide an excellent commentary on what happened,
    how it happened, and what the attacker did, and may also provide direction as
    to who the attacker is.'
  merge: -1
  img_proc: true
- pgno: 170
  md: '# Log File Identification, Preservation, Collection, and Acquisition


    To assist the digital investigator, the digital examiner on your team will be
    skilled in understanding and interpreting logs, and the system administrator of
    the company whose logs you are investigating will also be to provide assistance.
    Communicating with these people will assist the investigator, as they will be
    able to translate the log data into meaningful data for the investigator to progress
    their investigation. As technology develops, there are many tools available that
    are able to collect the log data from many sources and provide a graphical view
    of events, which makes understanding the data significantly easier.


    When examining logs, look for evidence of the incident as well as reconnaissance
    events over the preceding days or weeks. Logs may show a so-called dry run or
    a scouting view of the target before the main attack was undertaken. Experienced
    hackers will undertake extensive reconnaissance on their target before committing
    their crime.


    In a perfect world, the following information will be included in the structure
    of the logs seized:


    +   * Time stamp of each activity, to be recorded in a human readable standard
    format across all applications, the Operating System (OS), databases, and the
    like.³

    * A single synchronized time zone.²

    * Details of the user relating to each activity, as user details for a log-on
    authentication attempt.³

    * Standard format across all logs secured across all sources.²

    * If authentication fails, the reason why and how many times it failed.³

    * Session Identifier (ID), which records the activity of a user at a website.³

    * Details of all activity relating to the access and modification of data and
    system resources.

    * Internet Protocol address of the network user or external party conducting the
    activity that generated the log.³


    As mentioned, there are many forms of logs created from many sources. The remainder
    of this chapter will provide a general understanding of the sources and meaning
    of the variety of logs an investigator may encounter.


    # TYPES OF LOGS


    Logs originate from many sources, including device operating systems and applications,
    and across networks. It is not feasible to cover all sources of logs, so this
    chapter will focus on those originating from Windows operating systems to provide
    an understanding of what evidence is available from logs and where'
