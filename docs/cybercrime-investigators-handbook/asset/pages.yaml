  img_proc: true
- pgno: 226
  md: '# Cybercrime Case Study 219


    # Step 35: Consider the complexity of the evidence to be presented to the court.


    Should the cloud-based evidence be required to be introduced in a court of law
    as evidence, consideration should be given as to its complexity and the ability
    of a judge and jury to understand it. To assist in this, consider the use of an
    independent expert.


    Progress to step.


    # Step 36: Disseminate outcomes of court rulings.


    Outcomes of court hearings where the cloud-based evidence has been challenged
    and a determination of the evidence provided by the court needs to be disseminated
    through legal channels, so the decision can be factored into future investigations
    and an understanding of the direction the courts are taking with cloud-based evidence
    gained.


    This chapter has provided a template to be considered and modified by civilian
    and law enforcement investigators. It is not intended to be a definitive guide,
    but provides a basis that can be modified to meet the unique circumstances of
    your investigation and the legal boundaries within which you operate. As a final
    point to be repeated, you will likely be operating in multiple legal jurisdictions
    so always consider the legality of the target legal jurisdiction and seek professional
    advice.


    # CYBERCRIME CASE STUDY


    John (not his real name) worked in a technical position in a successful company.
    He was highly respected and produced high-quality work in conjunction with his
    two employees. However, unknown to management, John had a crash on one of his
    female staff that was not reciprocated.


    The business had a downturn in the market and decided to leave several staff go,
    one of whom was the female John was infatuated with. The day he was told leaving
    the company was furious and aggressively fought against management for her keep
    job. While the severance package was generous with training support, John refused
    to allow her to leave the company without a fight.


    In a sign of very visible solidarity, John resigned his position and made sure
    all of the staff knew why. After a meeting where he was given the opportunity
    to reconsider his decision over the coming days, John insisted that he would leave
    at the same time as his employee.


    After his resignation reluctantly accepted, he returned to his desk and worked
    on his computer for several minutes before storming from the office.'
