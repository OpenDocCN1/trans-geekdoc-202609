- pgno: 108
  md: 'To prevent claims that the scratches on the laptop were caused by the base
    of investigation team, the photographer would take a photo of the scratches on
    the base of laptop at the time it is found and Mary would record this in her notebook.


    To corroborate the desk is Joe''s, the photographer may also take photos of personal
    items on the desk, such as handwritten notes, family photographs, a wallet, personal
    documents, and the like.


    The scene manager will also find the photographer invaluable when exhibits of
    value, such as cash, are found. Filming the finding of the cash and the amount
    by electronically recording the serial numbers of each note provides a level of
    security to the investigation team against accusations of theft being made against
    them. Also, if the cash is seized as an exhibit, recording the serial numbers
    ensures that if there is a miscount, the person can clearly show it was only an
    error and nothing dishonest.


    +   **Digital Investigator**: As discussed, this person will have specific skills
    and knowledge and will be responsible for overseeing the capture of digital data,
