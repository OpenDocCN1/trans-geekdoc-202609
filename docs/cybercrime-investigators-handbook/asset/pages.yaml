    there was thought to be many more instances of fraud.


    The digital records of the company''s accounting system revealed that they had
    been manipulated to hide the activity. These digital records showed the senior
    manager to be the person who created the fraudulent documentation, who provided
    the false descriptors of the purchases on the accounting application, and authorized
    the invoices for payment as legitimate expenses related to the building of the
    switchboards.


    A search warrant executed on the senior manager''s home located corroborated evidence
    of large-scale spending in excess of his legitimate income, and a large quantity
    of objects from the interior of the home (electronic goods, fittings, furniture,
    etc.) were seized as proceeds of crime. The tax return of the suspect was located
    and corroborated that the lawful declared income was significantly less than expenditures.


    Once arrested, the senior manager pleaded guilty to the fraudulent charges supported
    by the technical evidence. His wife was also charged and pleaded guilty to fraud,
    as she had knowingly participated in the accounting for the family finances and
    was aware her husband was committing large-scale fraud against his employer.


    Chapter 8 introduces activities that are undertaken by the IR team to mitigate
    and eradicate the breach. This introduction is provided for the information of
    the investigator, so they will have an understanding of the role of members of
    the IR team, as their evidence will be incorporated into any potential court matter.
    It will also provide an understanding of the duties and actions of IR team members,
    so evidence identified and secured can have its origins understood.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# CHAPTER EIGHT


    # Containing and Remedating the Cyber Security Incident


    HERE ARE many high-quality guides available to describe in detail the duties of
    the Incident Response (IR) team, including those provided by organizations such
    as the SANS Institute. It is not the intention of this chapter to repeat their
    lessons, but rather to make the investigator aware of what the IR team is doing
    while the investigator undertakes their duties, as their roles may be seen as
    complementary.


    The US National Institute of Standards and Technology (NIST) has identified an
    incident response framework for the IR team. It lays out the IR stages as preparation:
    detection and analysis; containment, eradication, and recovery; and post-incident
    activity.


    The containment and eradication stages reference the capture of evidence and its
    subsequent handling. In this capture we will identify several of the opportunities
    for the investigation team to work in partnership with the IR team in obtaining
    evidence, a partnership that can be used to advance your investigation.


    # CONTAINING THE CYBER SECURITY INCIDENT


    Containing the cyber security event is generally the role of a specified team
    that has been designated prior to the event. The IR team may be made up of internal'
  merge: -1
  img_proc: true
- pgno: 86
  md: 'staff members or be a team of experts brought in from outside the organization.
    The investigation team may be requested by the IR team manager to participate
    in event management when there is evidence of a civil or criminal offense that
    will require investigation after mitigation.


    The goal of the IR team in the containment phase is to restrict the damage that
    can be done to the system, whether this is the loss of confidential corporate
    data or damage to the integrity of the network. This phase also allows for the
    capture of evidence.¹ If the attacker is still within the network, the IR team
    will seek to restrict any further exploitation and remove them from the system
    and devices. At this time evidence may become available to the network vulnerability
    identified by the investigation team and how it was exploited. This should be
    communicated as a line of inquiry for your investigations.


    There are a series of actions the IR team may take that can produce evidence for
    you at the start while they are containing the attack. This may not always be
    the case depending on the logs recorded and damage done to systems by the attacker;
    however, be aware the potential exists to be found by the IR team that you can
    use building a foundation at the beginning of your investigation. NIST identifies
    such as¹


    +   - The identification information on the compromised devices

    - Location where the evidence is found

    - Chain of custody procedures

    - Details of an attacker''s IP address

    - Attack methodology as determined


    Ensure the IR team understands your role and its requirements. As you are all
    in effect working towards the same goal, having a shared understanding and respect
    of each other''s tasks and how they intersect is. Large-scale professional IR
    teams will understand your requirements; however, small-inhouse team may not you
    until you tell them.


    Other examples of potential avenues of inquiry the IR team can provide include:


    +   - Preserving authentication logs that show attempts to log onto the system.
    These records will show successful and unsuccessful attempts to gain access to
    the system or the locations of valuable intellectual property. For example, the
    evidence may show that the attacker gained immediate access to the corporate database
    on the first try using the compromised credentials of a legitimate employee or
    that they used a brute force attack'
  merge: -1
  img_proc: true
- pgno: 87
  md: '# Containing the Cyber Security Incident 79


    in an attempt to crack a password. This information will be of interest to the
    investigator, as it provides an understanding of whether the attacker is an insider,
    an external person who has somehow compromised legitimate credentials (another
    line of inquiry), or an attacker who has no previous skills into the cyber network.


    +   - Obtaining a copy of any malicious software used by the attacker. The investigator
    may refer to online resources to gain an understanding of the malware, or if the
    attack is a zero-day exploit (which, as previously discussed, the exploitation
    of a previously unknown vulnerability in an Operating System (OS) or application),
    the investigator will become aware that they are dealing with an experienced cybercriminal
    with significant technical skills.


    +   - If passwords are compromised, identify whether there are multiple passwords
    or just one belonging to a single user. Initial inquiries may involve identifying
    the access privileges of that user and their position in the company, meaning
    the investigator may start working on understanding how the attacker gained those
    credentials. Investigating the profile of the user exploited may provide some
    guidance to the IR and investigation teams as the initial point of compromise
    in the device or network.


    +   - If damage has been done to the corporate website in an issue-motivated attack,
    ensure the IR team keeps a copy of the damaged site as a foundation for your investigation.
    Should you locate a suspect, you will seek to show the court the damage they have
    done, especially if the content displayed by the company is malicious.


    The IR team will be covering many areas of potential compromise and may have few
    answers to your questions until they have had the opportunity to review logs,
    understand the attack methodology, and clarify the nature and extent of the attack.
    Depending upon the circumstances of the attack and size of the complainant entity,
    this may take several hours or days. In some cases this can extend to weeks. Be
    aware that the IR team will be operating under great pressure.


    Other areas the IR team will be concentrating on which, depending on the circumstances,
    you may find as sources of evidence:


    +   - Closing ports where data comes into and leaves the network. If a port is
    activated and has no function within the network, this may have been a pathway
    of compromise. As different ports are used for different forms of digital traffic,
    identifying which ports are the subject of compromise may provide a small step
    forward in your investigation and knowledge of'
  merge: -1
  img_proc: true
- pgno: 88
  md: 'how the attack was initiated. For example, port 80 may be for web traffic,
    whereas port 25 may be related to email traffic. The IR team will be able to provide
    you with this information and an explanation of its meaning. Identifying and removing
    compromised or suspect devices from a network where feasible is of particular
    interest to the investigator, as you will want to work in partnership with your
    digital investigator to image the devices and identify evidence of the compromise.
    A problem may occur if the compromised device is critical to the organization,
    such as the database where all the corporate records required for day-to-day operation
    are stored. Taking this database offline may mean the company will cease to function.
    An example of this situation would be an online company whose server is damaged
    and needs to be taken offline. This would mean that the company is not able to
    trade until the server is secured or an alternative host is located.


    An example of a conflict between the IR and investigation teams would be where
    a virtual machine has been infected by malicious software (malware) and the IR
    team wishes to shut it down and reboot a new instance of the machine, eradicating
    the malware. While this may prove very effective in containing and eradicating
    the attack, it would also destroy valuable evidence that not be able to be recovered
    and the investigation team would be interested in. This action may be favored
    by management, as it is a quick and clean way of eradicating malware; however,
    your evidence will now be gone and will not be able to be recovered.


    While containment is the prime responsibility of the IR team, the cyber investigator
    will be included in this process to oversee evidence collection and initiate new
    lines of inquiry. A valuable part of your evidence is to see the notes of members
    of the IR team to understand what they saw, what actions they took, the reasons
    for the decisions they made, and the consequences of containing and eradicating
    the event. These notes can be used in the preparation of statements by IR team
    members, and in the instance where a suspect is identified and prosecuted, will
    be part of the evidence of the prosecution.


    # ERADICATING THE CYBER SECURITY INCIDENT


    With the containment phase, the IR team is responsible for eradication of the
    threat and the cyber investigator is responsible for providing investigation and
    evidence collection support. The investigator will continue with investigations
    after the IR team has completed their duties.'
  merge: -1
  img_proc: true
- pgno: 89
  md: '# Eradicating the Cyber Security Incident


    Eradication involves removing the threat and securing the exploited vulnerabilities
    after the attack has been contained.¹ The containment and eradication processes
    may be completed within several hours, or in the cases of large corporate networks
    attacked by very experienced and well-resourced cybercriminals, weeks or months
    later¹ Prepare for the possibility of the latter case, as logistics will take
    careful planning and resourcing. Also, continual communication with management
    is essential, as they will be concerned about costs and disruption to the day-to-day
    functioning of the business.


    While you will have collected valuable information during the containment phase,
    the eradication process has the potential to destroy valuable evidence, which
    will not be able to be recovered. As mentioned previously, closing virtual machines
    is an effective manner of eradicating malware, but it also eradicates value evidence
    you may require from within the virtual machine.


    Listed below are examples of some of the processes IR team undertakes that may
    be of interest to the investigation team:


    +   - Identifying other devices that may have been compromised.¹ The investigator
    will be interested in examining these devices, as, too, may contain new or corroborating
    evidence to support information gained in the containment phase.

    - Reinstalling the OS and pertinent applications. Once the OS and applications
    are reinstalled, potential evidence is overwritten. Ensure you have all your evidence
    from the OS and pertinent applications before reinstallation.

    - Reinstalling trusted copies of the database, OS, and other applications, which
    will then be monitored. The IR team will be aware the experienced attacker may
    still have remote access to the network, which has not been detected in the detection
    and eradication phases. Alternatively, the attacker may have left malware that
    has not been identified or activated. It would of beneficial to keep in contact
    with the IR team and system administrators over the days following reinstallation
    to confirm there have been no further compromises of the network.

    - Conducting testing to ensure the vulnerabilities exploited by the attacker have
    been fixed.¹ You will be interested in this information as additional confirmation
    of the attack vectors used by the cybercriminal.


    There are many processes the IR team undertakes in the containment and eradication
    phases. The examples listed here are meant to provide insight into their duties
    and how their work can be used as a foundation for your investigation. It is strongly
    recommended that where practical you communicate with'
  merge: -1
  img_proc: true
- pgno: 90
  md: 'the IR team prior to the start of incident response to an event—or immediately
    upon being brought into the event, should you be a party external to the entity
    under attack.


    # NOTE


    +   1. Paul Cichonskiki, Thomas Millar, Tim Grance, and Karen Scarfone, Computer
    Security Incident Handling Guide, Special Publication 800-61 Revision 2, August
    2012. National Institute of Standards and Technology, United States Department
    of Commerce.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# CHAPTER NINE

    Challenges in Cyber Security

    Incident Investigations


    GAINING AN understanding of the crime under investigation is more complex in a
    cyber environment than in a physical domain. As much of the evidence is digital,
    it may be very volatile and subject to loss or damage should prompt action not
    taken to ensure its preservation. Also, with distributed data servers—such as
    cloud computing—becoming more common, the evidence the investigator is seeking
    can be spread across multiple jurisdictions and be lost very quickly due to the
    suspect deleting evidence of their crime. Alternatively, Cloud Service Provider
    (CSP) resource maximization policies may result in log evidence being overwritten.


    In the initial phases, the investigator may be unaware of the extent or boundaries
    of the investigation—or even the precise crime under investigation—when commencing
    action. As we discovered in Chapter 8, evidence may be slow in being obtained
    as the (Incident Response) IR team seeks to contain the threat and build their
    technical understanding of the attack, sometimes with limited consideration of
    the requirements of the cyber investigator. You may also find management support,
    with some managers wanting the problem to go away so that they can get back to
    business as usual, albeit with a higher standard of security that the problem
    does not reoccur.'
  merge: -1
  img_proc: true
- pgno: 92
  md: '# Challenges in Cyber Security Incident Investigations


    The crime scene in a cyber investigation differs from that of a traditional, physical
    crime scene in which the investigator has control of the scene from the start,
    provide direction to all inquiries, and can ensure the scene and exhibits are
    not contaminated. As discussed, the first responsibilities of the Incident Response
    (IR) team may to mitigate and eradicate the attack, with event investigation and
    the collection of forensic evidence being important responsibilities—instead of
    premier features—incorporated into the response.


    For a traditional crime, the detective examining the scene will want to start
    their examination instead as close to the state order left it as possible. With
    means controlling access to the scene, protecting it from damage from events such
    as weather in the case of an outdoor scene, photographing the scene and evidence,
    and so on. The investigator will be working in a very different environment in
    the case of a cyber-attack, with different consequences to scene management and
    evidence protection.


    Whether the cyberattack is continuing when the cyber investigator first attends
    or has been remediated, the scene and evidence will look very different from when
    the crime was first identified, and they will need to look retrospectively to
    account for all actions taken after the identification of the cyber event in partnership
    with the IR team. These are dynamic investigations, and the decision to seize
    valuable evidence later during the response may be a decision later regretted.


    This chapter will discuss in brief a series of the unique challenges cybercrime
    investigator may discover when compared to other crime types.


    # UNIQUE CHALLENGES


    # Defining Investigation Boundaries and Management Objectives


    As the extent of the crime may be unknown, the initial direction from management
    to the aims of the IR investigation may change throughout the investigation. The
    initial direction may be to provide a report for the information of management
    only; however, the investigation may find significant evidence to identify the
    attacker or may find that the attack was far greater than initially thought, resulting
    in the management wishing to begin legal proceedings against the identified attacker
    and/or report the matter to police and/or the data privacy officers within your
    jurisdictions.'
  merge: -1
  img_proc: true
- pgno: 93
  md: '# Unique Challenges


    > Tip: Define the boundaries of the investigation broadly and narrow them as the
    situation becomes clearer. It is easier to start wide inwards towards the opposite,
    as evidence outside your investigation boundaries may be lost or destroyed. Always
    be prepared to have your evidence and investigation processes challenged in a
    court of law, even when the initial instructions provided by your client are to
    provide a report for management only.


    # Identifying Potential Offenses (Criminal and/or Civil)


    In understanding the crime, the investigator needs to ensure that they are aware
    that there may be more one action by the attacker in the cyber event. For example,
    a Distributed Denial of Service (DDoS) attack may be initiated against the web
    server of the target company for the purpose of diverting the attention of the
    security team from the real target of the attack: the stealing of corporate Intellectual
    Property (IP) from the database of separate server.


    > Tip: While the obvious attack must be addressed, be aware of the potential for
    it to be a diversion attack is important. Having a member of the system security
    staff continue to monitor other activity across the network is an investment the
    attacker may not expecting.


    # Identifying Compromised Data and/or Resources


    Systems records may not always be available to the investigator, as mitigation
    and eradication actions may have permanently deleted data the investigator would
    use. Also, in many instances logs are not kept due to the expense of maintaining
    large volumes of log data from previous months from the many operating systems
    and applications.


    > Tip: An IR plan should be devised to incorporate the role of the investigator.
    This will also teach team members about the value of each other''s role. Also
    run IR training events across a variety of attack scenarios, during which the
    value of various logs can be identified and incorporated into the log preservation
    policy.'
  merge: -1
  img_proc: true
- pgno: 94
  md: '# Identifying Suspects and Motivations


    Offenders may be located literally anywhere in the world and be hiding behind
    anonymizing applications and other technology. Offenders may also be located in
    the organization under attack, so the insider threat cannot be discounted. They
    may also destroy the evidence of their presence before an event is even identified.


    A cybercriminal who is experienced at computer crime has the capacity to make
    it incredibly difficult for an investigator to locate them. Even identifying the
    international region they are in is a significant challenge in itself. Using technical
    resources such as Virtual Private Networks (VPNs), proxy servers, encryption,
    anonymizers, fraudulent identities, and cloud services destroys evidence as it
    is created; with an attack potentially crossing many legal jurisdictions, the
    response time may be significantly behind the progression of the offense.


    > Tip: There is no fast and easy method of mitigating this problem. Involving
    one of the large IR companies may provide some valuable assistance, as these companies
    have international resources, visibility, and extensive awareness of cybercriminal
    behavior.


    # Identifying Exploited Vulnerabilities


    The methodologies of the attacker are only limited by their skill and imagination.
    While they may apply successful general methodologies, skilled attackers modify
    their attack strategies to fit the circumstances and to reflect the environment
    they are operating within.


    The investigator must understand a broad range of attack methodologies and, if
    possible, identify the motivations of the attacker early in the investigation
    in order to understand how they moved around the network and evaded security.


    > Tip: Pre-training of system security staff and access to experienced IR teams
    brings the knowledge of current attack methodologies into your IR and investigation
    teams. Often you may not have the skills required to successfully defend the network
    and you will require external assistance. This information can be shared with
    the investigators to provide direction as they commence their inquiries.'
  merge: -1
  img_proc: true
- pgno: 95
  md: '# Securing Evidence


    The primary roles of the IR team are to contain the threat, mitigate it, and return
    the company to a higher standard of security. To accomplish this, the IR team
    has to work quickly and make rapid decisions, which may conflict with the wishes
    of the lead investigator. We previously explained the example of the IR team deciding
    that shutting down a virtual server and rebooting it in a state would eradicate
    a threat coming from a cloud server that has been infected. While this action
    may be the best option for containing the threat, valuable log data, which may
    provide evidence of the suspect and their activities, will be destroyed and not
    be able to be recovered.


    In the course of the IR team''s operations, the thought of commencing a post-event
    investigation to locate a suspect may not be surface. However, once the extent
    of the breach has been identified, the decision may be made to begin an investigation
    and refer the matter to police. Unfortunately, as stated previously, valuable
    evidence will have been destroyed and not able to be recovered.


    The cyber investigator should seek all available evidence from a multitude of
    sources. However, evidence may not always be available without external cooperation,
    in the instances where third parties, such as cloud-computing providers, control
    systems hardware/software.


    The investigator needs to be aware of all the different sources of evidence that
    can be generated by computer devices and ensure that they are properly secured.


    > Tip: Pre-event training exercises highlight the role of the IR and investigation
    teams and how their objectives may complement or conflict with each other. Building
    the rules and duties of each party into a response plan will help to preserve
    evidence. A direction from management to the IR team that evidence is to be collected
    as a part of their duties will assist the investigator.


    Where a live event is occurring and there is no IR plan in place, communication
    and respect for each other''s role is required, with management providing direction
    to all parties.


    # Understanding the Legal Jurisdiction Where the Incident Occurred and the Evidence
    Exists


    As a cybercriminal may reside in a country separate from their target, the law
    of that country may be very different from that of the victim''s country. What
    may'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'be a serious criminal offense in the victim’s jurisdiction may not be an offense
    at all in the attacker’s country, and may in fact be a legal activity.


    > Tip: If you have identified the attacker as being in a foreign jurisdiction
    where they have not committed an offense by attacking your network, Liaise with
    law enforcement to determine whether they are able to conduct their investigation
    and identify a suspect. In the event of a major breach where the suspect is in
    a legal jurisdiction beyond the reach of an investigation, law enforcement may
    be able to obtain an arrest warrant that provides for the suspect being arrested
    if they leave their local jurisdiction.


    # Locating Digital Evidence in a Timely Manner


    The investigator will need to work in partnership with the IR team or system administrators
    to determine what devices contain evidence and to ensure its accountable capture.


    Digital evidence may be lost very quickly after an event, as evidence such as
    log data is regularly overwritten. Also, the attacker may still have access to
    the system and start destroying evidence once they identify they have been compromised.


    Criminals have also been known to remotely wipe their phones after being seized
    by police if the phone was not put in flight mode or stored in a Faraday bag.
    Mobile phones may also be used as a listening device, meaning that you should
    legally seize the device, the owner may have the capacity to remotely turn on
    an application and listen to your conversations while you conduct your investigation.


    > Tip: Determine early in the investigation the order of volatility of evidence
    and respond accordingly. This is discussed in Chapter 10’s section "Acquisition
    of Digital Evidence."'
  merge: -1
  img_proc: true
- pgno: 97
  md: '# Maintaining the Chain of Evidence across Multiple Jurisdictions


    Because digital evidence may be located in international jurisdictions, as may
    be the case with cloud servers, the responsibility of the investigator to maintain
    the chain of evidence becomes more complex, although no less important.


    > Tip: This is a basic component of your investigation. Understand the process
    of obtaining your evidence across international jurisdictions and the people who
    are involved. Obtain statements immediately, obtaining them a year later will
    be likely with a mixed response. Map your evidence pathway from source to courtroom
    so that you can be thorough and accurate in your evidence.


    # Understanding the Complexity of the Evidence


    Digital crimes can be very complex, as a unique technical language will apply.
    Remember that technology is designed to function according to specification, not
    with the requirements of the court to understand it in mind.


    > Tip: Plan for the complexity. Consider bringing an independent person into the
    court to present overtly technical evidence. In the investigation phase, designate
    a technically minded person to research the technology and its processes.


    # Synchronizing the Time on Event Logs across the System Architecture


    With the many different components being built into computer architecture, manufacturers
    of hardware, operating systems, and applications may not always use the same formats
    for recording logs. Some are not readable by humans. The time recorded on logs
    may spread across different time zones, meaning that a translation process will
    be required before the log analysis commence. This process may also need to be
    explained to the court.'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Challenges in Cyber Security Incident Investigations


    > Tip: This is very important, as logs do not always operate in the same time
    zone. Ensure all logs are in or converted to a designated time zone and record
    the process in which this was done. Also look to confirm that times from logs
    are consistent, even as a one-second difference between different sets of logs
    will confuse your investigation.


    # Understanding the Cost of Multijurisdictional Investigations


    Obtaining evidence across international boundaries is particularly difficult and
    expensive for civil investigators. Whereas criminal investigators may benefit
    from using Mutual Legal Assistance Treaties (MLATs) to assist their investigations,
    civil investigators have no such formal support. Costs can escalate very quickly
    and having a defined budget at the commencement of the investigation can provide
    the investigation team with some clarity.


    > Tip: With a civil investigation, set a budget and monitor it with regular reviews.
    The cost of investigative and legal support across international boundaries is
    very expensive, and the cost of the investigation can quickly exceed the cost
    of the cyber attack.


    # Assessing Impact Costs


    An investigator may be employed to provide a report to management to support a
    cyber-insurance claim. With the dynamic nature of digital evidence, assessing
    the extent of the crime and its associated cost may prove difficult.


    > Tip: When submitting a cyber-insurance claim, there may be a requirement to
    provide expert evidence to support the claim. This also applies in court, where
    you should win your case, the judge will be interested in obtaining an assessment
    of the cost of losses so as to determine their options, including damages to be
    awarded to the complainant.'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Cybercrime Case Study 91


    Be prepared for the estimate of losses to be challenged by the defendant, their
    future sentence or punishment will be determined by factors that include the cost
    of their actions. Use qualified expert support from legal representatives, investigators,
    and/or assessors who can provide expert evidence to the court about the cost of
    losses.


    Understanding these challenges is a skill learned by experience only. Lessons
    learned will be incorporated into the updated IR plan, but also into the collective
    knowledge of the investigation team. With this information, investigation of subsequent
    cybercrime scenes will be undertaken.


    # CYBERCRIME CASE STUDY


    A marriage breakup was followed by contested hearings in court over marital assets
    and associated issues. The wife was experiencing difficulty in court on the normal
    of the stresses involved in a marriage breakup.


    She had been communicating with her lawyer and personal support network through
    her webmail account. As time progressed, she noticed that her soon-to-be-ex-husband
    seemed to know what she was doing and who she was associating with, as well as
    details about her communication with her lawyer.


    The level of knowledge he had become very specific and applied across conversations
    she was having. She suspected that he might be hacking into her online email account,
    which he had set up years previously. He changed the password but this made little
    difference as to the information he knew about her activities.


    Inquiries were made with a friend who had technical skills, and he checked the
    settings on her email account. It was found that the husband had redirected the
    account, meaning that all email correspondence in and out of the account was forwarded
    to him.


    A consideration when police reviewed the complaint which had jurisdiction the
    responsibility of investigating the complaint: Australia, where the suspect and
    complainant were resident, or the United States, where the computer servers were
    located. It was determined that because of local legislation, local courts had
    jurisdiction even though the computer servers were located in the United States,
    as the husband and his activity were based in Australia.


    Digital evidence included the Internet Protocol addresses used to access the account
    as well as evidence of the redirect email account belonging to'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'the husband. Computer logs on the husband’s computer identified log-on activity
    and time stamps of logging onto his Hotmail account, where the redirected emails
    were sent.


    Upon the court hearing the matter, the husband was convicted and sentenced to
    a noncustodial sentence.'
  merge: -1
  img_proc: true
- pgno: 101
  md: '# # CHAPTER TEN

    Investigating the Cybercrime Scene


    ALTHOUGH A cybercrime event may occur in a digital environment, the location of
    the device or network affected is in effect a crime scene. It is where the offense
    occurred and/or evidence resides. The crime scene where the investigator gains
    lawful access consent or a court order may be commercial premises and/or the suspect''s
    home address. It may also be a public place where the suspect has joined a free
    Wi-Fi network and used unverified access as a means to anonymize their activities.


    This chapter is particularly relevant to law enforcement investigators but will
    apply to civilian investigators as well. For example, the scene management involved
    in investigating an allegation of an internal theft of Intellectual Property (IP)
    will differ from involving an external Distributed Denial of Service (DoS) attack,
    and the contents of this section will apply based on the circumstances as well
    as the experience, knowledge, and requirements of the investigators of the day.
    Care of exhibits should be at the same standard for all cyber scenes; however,
    activities such as photographing the scene may not be relevant in the example
    of the DDoS attack.


    Crime scenes differ in size, and a single scene may have been committed across
    multiple locations. Your cybercrime scene may be a large commercial office or
    a small office where a manager who committed fraud against their clients worked.
    Alternatively, you may be required to attend to a business and collect a single
    device for investigation with little scene work required.


    Cybercrime Investigators Handbook, First Edition. Graeme Edwards,PhD.

    © 2020 John Wiley & Sons, Inc. Published 2020 by John Wiley & Sons, Inc.'
  merge: -1
  img_proc: true
- pgno: 102
  md: '# Investigating the Cybercrime Scene


    For example, the offender who is an employee of a company may have committed offenses
    against their employer at work through the internal network, as well as from their
    home address where they had remote log-on access. Crime scenes may cross local
    and international borders, with law enforcement and industry cooperating to locate
    whose locality they committed the crime in turn becomes a crime scene. The legality
    of lawful access to the crime scene will depend on the circumstances and be determined
    with qualified legal advice.


    It is the examination of the crime scene and evidence that leads to follow-quiries
    may in turn lead to identification of the offender and the evidence to conduct
    a successful prosecution if required. The experienced investigator will understand
    that the investment of time and effort in examining the scene will show its true
    value years later when being cross-examined about their work by the defendant’s
    lawyer. The word “investment” is specifically used, as your work at the crime
    scene and evidence identification/seizure/collection will prove to be valuable
    parts of the foundation to your investigation.


    Management of the crime scene is a skill many detects significant periods of their
    career learning, as each crime scene may differ. While a digital crime scene will
    obviously look very different from a homicide scene, the principles surrounding
    the rules of evidence remain the same and must be dealt with at the standard court
    demands. Although a computer is a different piece of evidence from a blooded knife
    next to a body, it does not mean the applicable rules of evidence have a lower
    threshold of accountability.


    Should the scene and evidence be poorly handled, the evidence may be excluded
    or admitted reluctantly, with a consequent weakening of its value. Many cases
    have been weakened in court because the crime scene and exhibits were poorly managed
    and their integrity could not be explained to the standard required by the court.
    This may lead to the awarding of costs to the benefit of the defendant, particularly
    in a case heard in a civil court or tribunal.


    A high-quality, complete examination of the crime scene gives the opposing party''s
    lawyers an insight into the capabilities of the investigators. Should they review
    the examination and conclude it was poorly managed, with evidence unaccounted
    for or documentation that is incomplete, their view will be that the rest of the
    investigation was of a similar standard. This may make the difference between
    a lawyer recommending that their client admit the charges against them and the
    lawyer challenging the evidence, your investigation, and the accusations of guilt.'
