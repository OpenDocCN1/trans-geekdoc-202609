  img_proc: true
- pgno: 218
  md: '# Cloud-Computing Investigation Framework 211


    the offense is serious enough to reach the legislated threshold of MLAT legislation.
    The civilian investigator will continually monitor the costs of the investigation
    against the budget supplied. International legal costs may be very expensive and
    prove ultimately prohibitive to progressing the investigation past the initial
    defined budget.


    If the investigation is to be progressed, then advance to step 4. If not, discuss
    other options with the complainant, as commencing disaster recovery procedures
    and improving network security.


    # Step 4: Identify where the cloud evidence is located.


    Assess the potential evidence to be obtained from a cloud server involves the
    location and seizure of evidence from a domestic or international jurisdiction.
    A complainant may be able to give advice to whether their CSP data is stored in
    a specific region or international jurisdiction. If the complainant cannot identify
    this, communicating with the CSP’s lawyers is recommend. If the evidence is located
    within the local jurisdiction, continue the investigation using traditional evidence
    collection methodologies and request evidence preservation. If the evidence is
    in an international or unknown jurisdiction, make inquiries with the CSP.


    Progress to step 5.


    # Step 5: Contact the legal department of the CSP to determine what evidence is
    available and request that evidence be preserved.


    Discuss what evidence is available and what may have been overwritten. Article
    29 of the Budapest Convention holds that a law enforcement investigator may request
    that the CSP or central authority, in association with MLAT legislation, preserve
    a copy of the data sought pending the service of a legal instrument authorizing
    the release of such data. Despite CSP mirroring their data for backup, not all
    data in a data center may be replicated outside of that country to local legislation,
    such as in the EU. Consider whether the alleged suspect still has access to the
    cloud platform with the potential to commit further offenses or delete evidence.
    Also advise the complainant to update security settings and passwords to prevent
    a repetition of the attack.


    The civilian investigator should also seek the support of the CSP legal team and
    identify which legal orders are required to seek to obtain all available evidence.
    Issues identified in the previous section may also be discussed with the CSP at
    this time.


    Progress to step 6.'
