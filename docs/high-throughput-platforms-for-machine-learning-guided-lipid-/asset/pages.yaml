    In the screening process for the discovery of in vivo therapeutics, in vitro assays
    are used largely to eliminate potential LNP formulations on the grounds of poor
    transfection efficiency. However, improving the throughput of higher resolution
    in vitro assays may provide new or supplementary information which can help to
    prevent against the inclusion of false positives or negatives in later animal
    model screens.


    # LNP barcoding for high-throughput in vivo analysis


    Since the early 2020s, LNP barcoding has been increasingly leveraged to enable
    the simultaneous testing of multiple formulations in the same animal151,152. LNP
    barcodes primarily consist of DNA151, mRNA153, protein products from RNA transcripts154
    or distinct molecules155,156 (Fig. 5b,c). By leveraging next-generation sequencing
    and bioinformatic tools, nucleic acid barcoding of LNPs enables the assessment
    of biodistribution and translational efficiency of individual LNPs within a pool
    (Fig. 5c). Each ‘barcode’ is a nucleic acid sequence that can be isolated


    from genomic DNA151. Together with a unique molecular identifier, these sequences
    can be demultiplexed, and their relative abundance in different cell and tissue
    types can be quantitated151,153. Barcode analysis has been used to study LNP tropism151,157
    — the relative accumulation of LNPs in different organ types — along with cellular
    association and uptake within different organs158,159, cellular internalization
    pathways, and has even been combined with single-cell RNA sequencing to obtain
    multi-omics readouts from individual cells158,160. Among nucleic acid barcodes,
    DNA barcodes were the first to be used to screen pooled LNPs151. In this approach,
    part of the therapeutic cargo is replaced with a DNA barcode, allowing many different
    barcodes to be used across LNPs carrying identical therapeutic cargo. RNA barcodes
    offer comparable multiplexing capability and readout resolution, but they generally
    have shorter half-lives than DNA barcodes (Fig. 5c). Structural and chemical modifications
    can be made to mRNA to prolong its half-life, but the biological implications
    of these modifications have not been widely assayed across cell types161. Although
    DNA barcodes are more stable and can be more easily interchanged than RNA barcodes151,
    the inclusion of a DNA barcode within LNPs already carrying RNA as the therapeutic
    cargo may result in physicochemical differences to the LNP, potentially altering
    biological data for a given formulation153. Peptide barcodes provide an additional
    level of detail from RNA barcodes in that they'
