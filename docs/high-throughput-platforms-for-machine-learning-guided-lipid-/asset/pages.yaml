- pgno: 11
  md: '# Perspective


    widely available, the use of such methods may further streamline the process of
    experimental standardization.


    As of now, the LNP design space must be screened for each distinct biological
    application. For example, the optimal LNP for lung gene editing14,50,178 is entirely
    distinct from the optimal LNP for in vivo delivery to macrophages or monocytes68,179.
    Nonetheless, advancements in the automation of lipid synthesis and LNP formulation
    will decrease the timescale necessary to perform these screens. Ultimately, consistently
    generated, publicly available data may be used to train models through multi-objective
    learning, which might be trained on transfection efficiency, tissue tropism or
    even more detailed multi-omics readouts to generate a ‘foundation model’ that
    can best predict LNPs for a particular desired biological response. These generative
    models, which might suggest new lipid structures or stoichiometries, could be
    heavily weighted to suggest lipids that are chemically distinct from previous
    lipids, while simultaneously assigning high weight to their ‘synthesizability’,
    potentially by integrating existing software to suggest reagents and possible
    synthetic strategies.


    Although each therapeutic or prophylactic indication requires different biological
    properties from a delivery vehicle, the use of ML models for the prediction of
    new LNP formulations substantially narrows the potential design space for a given
    application, drastically shortening the discovery and early development process
    for each drug. Combining automation with these computational tools will enable
    the development of LNPs for a broad set of unmet clinical needs and enable a much
    more rapid response to emerging infectious diseases in the future.


