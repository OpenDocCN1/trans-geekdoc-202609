    # Size of the LNP design space


    To understand the potential of ML models for LNP discovery, it is important to
    understand the size of the design space for any given formulation. When referring
    to a design space, what is understood is a representation of the entire possible
    set of lipid structures and their representative combinations. Given the constraint
    in resources, we can only traverse small representative sections of this design
    space, which is, for example, what is done in a ‘design of experiments’ approach23,24
    that typically relies on holding the stoichiometric ratio of certain lipid components
    fixed while varying across others to establish correlations across the data set.
    However, given the size of the design landscape, it is possible to spend considerable
    time screening without finding the optimal candidate.


    # Variability in lipid structure


    The potential design space for an LNP is generally constrained to a combination
    of four lipid components – the helper lipid, the steroid, the polyethylene glycol
    (PEG) lipid and the ionizable lipid – and a nucleic acid cargo25. Considering
    published lipids, if we conservatively estimate that there exist at least 103
    ionizable lipids, 102 possible steroids26, 103 helper lipids and 103 PEG lipids,
    there already exist 1013 possible LNPs at a single compositional ratio27 (Fig.
    2a). The function of each lipid defines its number of potential structures (Fig.
    2b). Helper lipids are commonly phospholipids that largely define LNP curvature28,29.
    Structural modifications include changes to fatty acid tail length and structure,
    and modification of headgroup polarity and size30. The steroid component contributes
    to the internal order of the other lipids. Although cholesterol is commonly used
    in LNP formulations, many other steroids have been tested given their variable
    effects on LNP stiffness31,32. PEG lipids are surface-presenting lipids that contribute
    to particle size, colloidal stability and circulation times33,34. Structural alterations
    to PEG length and lipophilic tail length markedly change the rate at which PEG
    desorbs from the LNP surface32. Finally, ionizable lipids promote escape of the
    nucleic acid from the endosome and have by far the greatest structural variability19,35.
    These lipids consist of an amine-modified ‘core’ and long lipophilic tails. Common
    structural motifs include piperazine head groups36–38, which react with epoxides18
    or acrylates38,39 on lipophilic tails in one-pot syntheses.


    Although greater theoretical structural variability might exist among these lipids,
    our approximation is based on contemporary literature, generating estimates on
    the number of possible structures by extrapolating from those already tested or
    those that could be conceived through slight structural modifications – such as
    changes in the number of carbons in each fatty acid tail. Assuming at least 102
    compositional ratios of these lipids result in biological differences, there exist
    at least 1015 possible LNPs to screen (Fig. 2a). For each biological indication,
    the optimal formulation may change entirely. In terms of the nucleic acid cargo,
    there exist a massive number of potential functional variants of each small interfering
    RNA40, mRNA25, circular RNA41, self-amplifying mRNA42 and gene-editing cargo43,44.


    # Biological implications of lipid structure


    Changing the lipid structures or ratios within this design landscape leads to
    different outcomes both in and ex vivo. Large screening efforts varying composition
    and lipid structure have identified formulations capable of cell-specific delivery,
    as demonstrated in models for both ex


    vivo37,45 and in vivo T cell46 transfection with chimeric antigen receptor (CAR)
    mRNA. Although lipids often share structural motifs, these motifs do not indicate
    similarities in biological performance. For instance, although the ionizable lipids
    C12-200 and C14-494 both centrally feature piperazine moieties, LNPs incorporating
    these lipids function optimally for different applications, hepatic transfection35,47
    and ex vivo CAR T cell transfection37,48, respectively (Table 1). Beyond the most
    structurally diverse lipid – the ionizable lipid – changes to the helper lipid
    modulate the efficiency of endosomal escape12,28. LNPs can be redirected to specific
    cell types or organs such as the lung20,32,49–51 or the spleen52 through the addition
    of permanently charged lipid components. This strategy promotes extrahepatic tropism
    yet can result in additional toxicity53.


    In vivo behaviour is particularly difficult to predict given the relationship
    between surface chemistry, topology and the recruitment of different biomolecular
    corona proteins54,55. As early as 30 s after entering the bloodstream56, a series
    of proteins will adsorb on the surface of LNPs, dynamically binding and interchanging
    based on charge and topology37,58. This protein corona can have marked effects
    on particle biodistribution49, transport mechanisms both intracellularly and through
    the bloodstream37, cellular metabolism56 and immunogenicity59,60.


    Thus far, deep learning models have been used to generate virtual lipid libraries
    based on experimentally validated synthetic pathways. Although some of these candidates
    have been screened in vitro to predict new ionizable lipid structures61, the biological
    performance of these lipids can vary, owing to differences in the structural features
    that are most relevant to function across cell types61,62. Thus, the generation
    of new lipids or prediction of formulations that perform better than existing
    standards for a given biological function probably requires training of the ML
    model on data collected from the specific biological system being studied, necessitating
    continued screening in vivo.


    # High-throughput synthesis and characterization of lipid libraries


    The synthesis of new lipids is integral to the generation of new LNP formulations.
    Driven by growing interest in drug carriers, combinatorial chemistry has experienced
    a notable resurgence since the 2020s. This revival has led to innovations that
    have enabled the automation of synthesis and purification of new chemical compounds63.
    Pairing these high-throughput platforms with ML tools can help in creating a feedback
    loop54,65, wherein automated systems can generate products, analyse them and optimize
    reaction schemes with minimal human input66.


    # Synthetic schemes and methods


    Although many potential structures for each chemical component of the LNP exist,
    the ionizable lipid is the most structurally diverse of all lipids19,23,37. From
    early development, ionizable lipids have been designed to be synthesized combinatorially.
    These modular combinatorial schemes use a weakly nucleophilic and ionizable amine
    core that reacts with a number of fatty acid-like ‘tail’ components bearing an
    electrophilic head group4,6,36,67 in a single step, in one pot, and with minimal
    work-up47 (Fig. 3a). Thus, as chemical diversity scales multiplicatively with
    the number of each component, the ionizable lipid is the most readily applicable
    of all LNP components for automation of synthesis4,36,47. Typical examples of
    the head groups on these fatty acid-like tails include epoxides37,68 or enones38,
    reacting with the amine-functionalized cores in SN2-type38,39 or aza-Michael-type69,70
    additions. These combinatorial libraries can then be formulated into LNPs'
