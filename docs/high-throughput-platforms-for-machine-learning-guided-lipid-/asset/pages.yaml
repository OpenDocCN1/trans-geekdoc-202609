    drastically declines and the complexity of automation may increase with each additional
    reaction step necessary. Although there are still extensive swaths of chemical
    space in single-step, multicomponent reactions that have yet to be explored¹⁴,
    an important advantage from the application of ML models to lipid synthesis is
    the generative prediction of lipids from previously unexplored design spaces,
    potentially involving more complicated synthetic strategies. More modular synthetic
    instrumentation, such as modular fluidic reactors⁶⁶, could widen the accessible
    chemical space, but throughput would decrease drastically owing to a lack of parallelization.
    Furthermore, downstream screening processes such as particle formulation and screening
    are still probably rate limiting at their current throughput. Thus, developments
    in the application of automation to lipid synthesis should carefully consider
    the current balance between increasing lipid complexity and throughput, as well
