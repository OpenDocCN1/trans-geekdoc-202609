    # LNP formulation and characterization


    Although techniques for the automated and parallelized synthesis of many lipids
    have existed since the early 2000s, a current limitation in the throughput of
    LNP screening is the controlled mixing of the organic phase solubilizing the lipids
    with an acidic, aqueous buffer bearing the nucleic acid cargo. Current efforts
    to improve the throughput of this mixing process to generate distinct LNP formulations
    focus on adapting existing automation, such as liquid handlers, to mix together
    organic and aqueous phases, developing new interfaces between mixing devices and
    many distinct fluidic inputs, or implementing parallelized architectures for the
    distribution of fewer fluidic inputs to generate many formulation outputs. New
    technologies must deliver not only improved throughput but also high batch-to-batch
    consistency and the ability to use the same mixing technique across all scales
    of clinical development.


    # High-throughput mixing methods


    Even though individual lipid components can be generated at high throughput, these
    components must be combined in a nanoprecipitation reaction with a nucleic acid
    cargo to generate an LNP.'
