- pgno: 8
  md: '# Perspective


    lipids must serially interface with the same mixing device to generate new products.
    To improve throughput, scaffolds have been developed for connecting multiple fluidic
    inputs to the same chip¹¹³ and input delivery and output collection have been
    automated¹²⁰. Some schemes for microfluidic automation exist, producing LNP formulations
    on the order of ten formulations per hour (Unchained Labs Sunscreen), yet this
    technology does not currently allow for generation and screening of multiple nanoparticle
    formulations at the rate of an automated liquid handler. An emerging automated,
    microfluidic platform using parallelized delivery of single fluidic inputs but
    at different stoichiometric ratios to many independent mixing units has scaled
    in throughput beyond that of automated liquid handlers, to a throughput of around
    one distinct LNP formulation every 3 s, while delivering the precision mixing
    capabilities of microfluidics¹²¹.


    Emerging and future work to accelerate formulation rates should include additional
    means of monitoring the mixing process, enabling the engineering of highly consistent,
    scalable mixing devices wherein distinct lipid and nucleic acid inputs can be
    automatically interfaced with a mixing device and many different stoichiometric
    ratios can be formulated simultaneously.


    # High-throughput characterization


    High-throughput LNP generation demands matching throughput in characterization
    to determine whether each batch of formulation falls within a set of standards
    of quality. Metrics to evaluate formulated products include particle size and
    polydispersity¹²². Most commonly, dynamic light scattering or optical tracking
    methods are used for determining LNP size. For example, a technology similar to
    nanoparticle tracking analysis but performed in-line on a microfluidic chip has
    been developed¹²³. It is also important to determine the relative encapsulation
    of nucleic acid in the nanoparticle, most commonly through fluorescence assays
    such as the RiboGreen. Parts of the assay have been automated (Unchained Labs
    Sunscreen and Unchained Labs Stunner), yet separate robotic units are required
    for formulation and dialysis, requiring transfer between each.


    Although size and encapsulation efficiency are useful metrics, advanced characterization
    techniques are also needed to further probe core structure, some of which have
    been adapted for high-throughput characterization. By coupling liquid handlers
    with a beamline, high-throughput small angle X-ray scattering (SAXS)¹⁰⁶ has been
    performed on a library of LNPs, providing data about lipid packing, core density
    and core phase in an automated manner at a throughput of around one formulation
    per minute. To enable in-line formulation, processing and characterization, additional
    workflows have integrated SAXS directly after asymmetric field flow fractionation
    (AF4) – a commonly used downstream processing step for LNPs to remove excess organic
    solvent¹²⁴. However, the generally slow throughput of AF4 combined with the complexity
    of SAXS data means that the latency between LNP formulation and analysis can be
    up to 40 min.


    Although characterization techniques to confirm the structure and determine the
    purity of individual lipid components have been largely adapted from existing
    workflows, analysing the compositional ratios of LNP at the single-particle level
    remains a challenge. Single LNPs provide insufficient signal for standard chemical
    characterization techniques such as HPLC or NMR. To address this, microfluidic
    platforms have been used for in-line optical detection, allowing high-throughput
    assessment of size, relative composition and number of RNA per LNP¹²⁵,¹²⁶. In
    these workflows, fluorescently labelled lipid and cargo components are separated
    in a micrometre scale capillary


    and analysed with fluorescent coincidence detection at a throughput of 3,000–5,000
    events per minute. Additionally, solution-phase Raman analysis has allowed for
    high-throughput quantification of relative lipid amounts¹²⁷ and quantification
    of particle surface ligand in antibody-coated LNPs (SPARTA analysis of LNPs).
    To move beyond labelled approaches, mass spectrometry has emerged has an alternative
    method to determine the number of mRNA per particle¹²⁸,¹²⁹. At the bulk scale,
    compositional distributions across entire LNP formulations have been assessed
    using HPLC coupled with charged aerosol detection¹³⁰.


    Although few feedforward ML-driven optimization schemes exist¹³¹, data-driven
    analyses of the relation between lipid ratios and physicochemical properties have
    been performed¹⁶¹,⁶²,¹³². Autonomous systems wherein the output of a system continuously
    informs input conditions have been widely adopted in applications from chemical
    synthesis⁸⁴ to inorganic materials generation¹³³ and droplet microfluidics¹³⁴.
    Rapid in-line characterization techniques may be used in the future to optimize
    physical conditions, such as total flow rate, or chemical conditions, such as
    the selection and combination of lipid components, for the production of LNPs
    with a desired set of properties.


    Currently, no physicochemical characterization method provides the same depth
    of insight into LNP performance as those available in analogous fields such as
    inorganic materials synthesis, wherein diffraction-based methods have enabled
    closed-loop discovery of new materials¹³⁵–¹³⁷. However, larger studies involving
    advanced solution-based characterization methods combined with ML-driven data
    analysis may elucidate design rules relating LNP performance in biological systems
    to formulation input parameters, presenting a path forward for closed-loop LNP
    optimization.


    # In vitro and in vivo characterization


    In vitro and in vivo screening data correlate most strongly with the therapeutic
    success of an LNP and, thus, provide the most relevant data for training ML models.
    In vitro metrics include toxicity against a particular cell type¹³⁸, transfection
    or expression efficiency¹³⁹–¹⁴² (Unchained Labs Sunscreen), rate of transcytosis¹⁴³,
    identity of protein corona⁵⁴,¹⁴⁴, and rate of cell association¹²² (NxGen technology).
    Although there is only a minimal correlation between in vitro and in vivo performance,
    in vitro metrics can help to narrow the potential design space to be tested in
    animal models, by identifying which particles have little to no capacity for transfection²⁴.
    Methods for screening formulated particles in a pooled fashion, such as LNP barcoding,
    have drastically accelerated the throughput of in vivo assays (Fig. 5a).


    # High-throughput in vitro assays


    The most general paradigm for scaling the throughput of in vitro assays involves
    the automation of liquid handling using plate robotics, flow-based assays, or
    optical techniques. For example, one common early-stage screen involves the quantification
    of a luminescence reporter – a proxy for relative LNP transfection – using automated
    reagent and plate handling¹⁴⁵. Plate automation can also be used in flow-based
    assays to interchange samples for high-resolution in vitro analysis of LNP effects.
    Highly multiplexed flow cytometry has been leveraged to obtain time-resolved single-cell
    measurements of LNP transfection¹⁴¹. Mass cytometry can multiplex detection of
    mRNA transcripts and proteins within single cells to identify transcriptomic alterations
    brought about by LNP transfection¹³⁹,¹⁴⁶. Optical methods have also been used
    for single-cell measurements¹⁴⁷. For example, confocal microscopy has been used
    to quantify fluorescent protein'
