    LNP nucleation typically involves nanoprecipitation of lipids in ethanol into
    a buffered aqueous cosolvent, wherein the ionizable lipid undergoes electrocomplexation
    with the cargo solubilized in the


    aqueous phase.⁹⁶ Nucleation that occurs at different Reynolds numbers (correlating
    to the laminarity or turbulence of a flow regime) results in LNPs with different
    internal structures⁹⁷,⁹⁸ and ultimately different downstream biological effects⁹⁹,¹⁰⁰.


    The most common mixing methods used for the high-throughput formulation of LNPs
    include bulk precipitation¹⁰¹, turbulent mixing¹⁰²,¹⁰³ and chaotic advective microfluidic
    mixing¹⁰⁴,¹⁰⁵ (Fig. 4a). Bulk precipitation, typically seen in pipette mixing,
    can generate LNPs at high throughput using automated liquid handlers¹⁰¹,¹⁰⁶,¹⁰⁷,
    but mixing is intrinsically heterogeneous and inefficient, resulting in batch-to-batch
    variations in nanoparticle physicochemical properties⁹⁹,¹⁰⁸. Turbulent mixers
    such as confined impinging jet mixers have been used far more widely at high volumes
    in polymeric and lipid nanoparticle applications, and are often capable of achieving
    mixing times below one millisecond¹⁰⁹.


    However, turbulent mixers are generally difficult to use at low volumes¹¹⁰, and
    thus suboptimal for generating larger libraries of particles owing to material
    limitations (Fig. 4a). Furthermore, intrinsic nonlinearities and flow rate variance
    in scaling turbulent flow result in the unpredictability of local flow conditions,
    meaning that though mixing is occurring rapidly across the entire solution, mixing
    is not necessarily even throughout¹¹¹.


    As the mixing environment has an important effect on the physicochemical and ultimately
    biological properties of LNPs, an ideal LNP formulation system would allow for
    identical local mixing conditions at every step of the drug development process,
    from discovery to batch scale¹⁰⁷ (Fig. 4b). Particles across the device should
    ‘experience’ the same mixing conditions at all the flow rates necessary for development,
    as a particle produced differently at the discovery and scale-up phases may behave
    differently in a biological setting. For scale-up of LNP production in industrial
    settings, flash nanoprecipitation¹¹², a formulation method involving highly turbulent
    mixing, is widely used for its design simplicity and robustness to continuous
    processing. However, turbulent mixing techniques often change total flow rates
    through the mixer dependent on the amount of formulation being made, thus resulting
    in potentially different local mixing conditions for different particle batch
    sizes. Liquid handlers could theoretically scale to higher volumes by parallelizing
    the mixing across multiple wells, but they suffer from the same variabilities
    experienced in turbulent mixing regimes. Additionally, scaling to higher volumes
    using liquid handlers requires the use of different pipettes, therefore different
    geometries and thus mixing environments, to operate effectively across all scales
    of development. Microfluidic mixing techniques are capable of generating LNPs
    in quantities relevant for small animal testing¹⁸,⁶⁸. When this mixing architecture
    is parallelized on the same device, the production volumes required for larger
    animal studies and human-scale applications can be met¹⁰⁴,¹⁰⁵. Thus, microfluidic
    mixing is the only scale-invariant technique of those mentioned here.


    Microfluidic mixing techniques offer high batch-to-batch consistency, but they
    are often fairly low throughput owing to inherent flow rate limitations through
    micrometre-scale devices and challenges in rapidly interfacing many distinct solutions
    through the same device¹¹³. A number of microfluidic mixing devices have been
    used to generate LNPs¹¹⁴–¹¹⁸. These devices often result in thorough mixing, but
    their performance tends to decline at higher flow rates required for clinical-scale
    particle production¹¹⁹; typical operating flow rates for bifurcating mixers range
