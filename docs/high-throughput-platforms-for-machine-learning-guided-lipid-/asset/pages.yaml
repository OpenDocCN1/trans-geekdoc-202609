- pgno: 10
  md: '# Perspective


    identify not only relative accumulation of a nucleic acid but its relative activity
    within a given population[^154]. However, because the primary readout of peptide
    barcodes involves tandem mass spectrometry, achieving resolution beyond the tissue
    scale remains low throughput owing to the time-consuming steps of cell lysis and
    transfer into the MS inlet. Finally, small molecules have been increasingly used
    as barcodes for nanoparticle[^155,^156]. Although the theoretical structural landscape
    and, thus, potential number of small-molecule barcodes are massive, these species
    must often be detectable either optically — thus suffering from spectral overlap[^162]
    — or by using analytical techniques such as tandem mass spectrometry or gas chromatography–mass
    spectrometry, wherein they are often difficult to distinguish from the molecular
    background signal of the cell and have a high limit of detection relative to nucleic
    acids[^155]. Strategies incorporating chemically distinct aryl-halide-based compounds
    called halocodes[^155] show low to mid-nanomolar limits of detection; however,
    the ability to multiplex beyond around ten samples has yet to be shown.


    Thus far, the number of barcoded LNPs tested per animal experimentally falls short
    of the theoretical limit dictated by the information density of the barcode. Although
    an eight-nucleotide sequence can generate 4⁸ = 65,536 unique barcodes, LNP barcoding
    experiments have only screened on the order of 10² barcodes per animal[^163,^164].
    Although error prevention techniques, such as differentiating barcode sequences
    at multiple positions, reduce the number of usable barcodes[^165], the practical
    number of barcoded particles used at any one time is probably further limited
    by physicochemical disparities between particles, which may cause interparticle
    interactions or “drug–drug” interactions in vivo. Additionally, limitations in
    the throughput of other parts of the LNP formulation process are prohibitive to
    the screening of greater numbers of barcoded LNPs at a single time.


    Largely as a result of this scalability and the ubiquity of next-generation sequencing,
    nucleic acid barcoding has been the most widely used form of parallelized in vivo
    screening for LNPs. Nonetheless, as mass spectrometry or imaging-based readouts
    improve in throughput, the scalability of techniques such as peptide barcoding,
    which would provide more resolution in terms not only of LNP localization but
    of cargo translation, or chemical barcoding, wherein intracellular localization
    could be visualized, may improve.


    Ultimately, because in vivo and in vitro environments fundamentally differ, in
    vitro data — such as transfection or cytotoxicity — are limited in their capacity
    to serve as training data for ML models used to predict in vivo LNP behaviour.
    Although this lack of correlation is well profiled, ML models capable of integrating
    highly multimodal data sets[^166] could undergo multiple rounds of fine tuning,
    first on large (>10³–10⁴ samples) in vitro data sets, upstream of smaller in vivo
    data sets. As seen in an active learning approach[^131], multiple rounds of in
    vitro screening could be used to iteratively improve the predictive capacity of
    the model before moving to in vivo testing. As the automation and parallelization
    of LNP formulation improve, these approaches could be more increasingly leveraged
    to minimize resource and time costs.


    # Outlook


    High-throughput screening has substantially accelerated the development of LNPs
    for a broadening set of therapeutic indications. These advancements have been
    enabled by recent advances increasing screening throughput, despite the many complex
    processes involved from lipid synthesis to in vivo testing. As more advanced characterization
    techniques are developed, the data sets generated by LNP screens are


    becoming increasingly large and multifactorial, rendering computational tools
    more useful in understanding how the inputs for a given formulation — that is,
    the different lipid structures, the ratio of lipids, and the mixing method — alter
    its biological effects.


    ML models are now being leveraged in the discovery of new LNP formulations. Model
    architectures such as support vector machines, random forests or gradient boosting,
    trained on relatively small training data sets (tens to hundreds of samples) of
    largely physicochemical and in vitro data, have been used to predict the transfection
    efficiency of new formulations, as shown across the polymeric nanoparticle[^167–^169]
    and increasingly the LNP literature[^14,^61,^62]. These applications demonstrate
    the success of these models in predicting some output variable such as transfection
    efficiency across a small number of input features — for example, compositional
    variables such as phospholipid-to-PEG ratio, and the type of phospholipid/sterol
    used. Explanatory frameworks such as Shapley additive explanations are further
    able to deconvolute the relevance of distinct features as they relate to biological
    performance such as transfection efficiency[^61,^62].


    Increasingly, far more data-intensive neural network-based models[^61,^131,^166]
    have been used to predict entirely new ionizable lipid structures. These models
    reference embed lipid structure as some high-dimensional representation, commonly
    a graph, which is coupled to some experimental output such as transfection efficiency,
    to fine-tune an existing neural network which has been trained on millions of
    virtual chemical compounds. Thus far, in the LNP space, ML models pretrained on
    physicochemical and in vitro data from hundreds to thousands of samples have been
    used to fine-tune these models to ultimately generate new ionizable lipid structures[^61,^131,^169].
    These models have either leveraged large existing data sets or been used to develop
    new automation to generate and screen sample sizes large enough to fine-tune neural
    networks largely pretrained on existing graph-based molecular descriptors. In
    future iterations, these models might be able to suggest new lipid structures
    and their relative ratios that might be able to generate an LNP with a particular
    function in vivo[^37,^154].


    Ultimately, developing models for the function-led generative design of LNPs using
    neural networks would require the generation of large libraries of sufficient
    size, at least thousands of samples each, to be tested across multiple relevant
    biological models[^166,^170,^171]. Given the inherent inconsistency of most biological
    data in comparison to physicochemical data, future predictive models will probably
    require larger data sets than are currently generated in single studies. Although
    discrepancies in the methods used to generate a data set will always exist, the
    number of different factors — lipid purity, mixing method and post-formulation
    processing, to name a few — that can confound biological performance is drastically
    higher in LNPs than in small-molecule development, wherein ML models have successfully
    improved drug performance[^172,^173].


    Moving towards the generation of open-source predictive frameworks that, for a
    given biological function, can suggest lipids and their relative ratios for an
    LNP formulation would require both that data be generated in a more standardized
    fashion and that source data be made more widely available. Examples of such standardized
    databases in formats ready for use in learning applications are present in the
    polymer literature[^174,^175]. Such collaborative initiatives would incentivize
    the development of better standardized methods of synthesis, characterization,
    formulation and screening to generate publicly available data sets for future
    LNP discovery. Resources for ML implementation in nanoparticle and biomaterials
    applications[^13,^16,^177] can assist in the cleaning and encoding of these data.
    Finally, as automation for LNP synthesis and formulation improves and becomes
    more'
