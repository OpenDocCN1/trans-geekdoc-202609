    \n此函数对给定值执行算术运算。此函数使用的参数是数值值。在 Python 中，此函数被频繁使用和首选。示例：\n```python\n>>> V = divmod(30,5)\n\
    >>> print(V)\n```\n输出：`(6, 0)`\n\n#### `enumerate()` 函数（重复）\n\n`enumerate()` 函数基于索引序列。通过使用元素的序列和索引，它可以生成一个具有数值值的对象。示例：\n\
    ```python\n>>> W = enumerate([4,5,6])\n>>> print(W)\n>>> print(list(W))\n```\n\
    输出：\n```\nenumerate object at 0x...\n[(0, 4), (1, 5), (2, 6)]\n```\n\n#### `dict()`\
    \ 函数（重复）\n\n`dict()` 函数返回一个字典。此函数生成三种：\n- 空字典：当没有参数时。\n- 相同的键值字典：当给定潜在参数时。\n-\
    \ 关键字和值添加字典：当是关键字参数时。示例：\n```python\n>>> N = dict()\n>>> V = dict(c=4,d=5)\n>>>\
