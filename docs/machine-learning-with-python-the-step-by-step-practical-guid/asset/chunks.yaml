    # 第 8 章：Python 中的库


    在之前的章节中，我们研究了 Python 的重要概念，例如数据结构、隐式能力、因子、特殊情况、策略、循环和声明。在接下来的章节中，我们将深入考虑对任何活动都可能重要的
    Python 模块（modules）、库（libraries）和包（bundles）。导入（import）是 Python 内部的核心思想。沿着此，通过利用这一思想，我们可以考虑许多可以在
    Python 中使用的库。此外，Python 编程和数据科学是相辅相成的。Python 是数据科学领域的一种极佳语言，对于想要进入数据科学领域的人来说至关重要。它提供了数以计的库和框架，为了以一种完美且极其高效的方式处理数据科学提供了选择。各种框架和库背后都有特定的使用解释，应该根据你的核心需求进行选择。


    ## 8.1 Python 通用库


    Python 以“内置电池”（batteries-included）的编程语言而闻名。Python 基本上建议并附带了不同的预装库。无论如何，都有许多库对于解释器、异常状态开放的。此外，Python
    是一种非常实用的编程语言。在增加 Python 流行程度的各种组件中，它们庞大的库社区是非常重要的一个。大多数库和包都是许多编程语言的包或集合，为设计师提供了访问支持。以下可能是
    Python 中使用的最基础的库。


    ### Requests


    主要的 Python 通用库之一是 `Requests`。它期望让 HTTP 请求变得更加符合人类习惯且更方便。该库在 Apache2 许可证下批准，并用
    Python 编写；`Requests` 是 Python 设计师在在使用 Python 设置 HTTP 期望时使用的真实标准。使用 `Requests`
    库向服务器发送 HTTP 销售，它还允许将结构化数据、内容、标头、多部分记录等包含在其中。通过该库，开发者无需在 URL 中添加查询语句或手动编码 POST
    数据。`Requests` 库将设置 HTTP 期望的不同复杂性抽象为基础 API，以便设计师可以更多地关注与服务器的通信。该库还对 `Python 2.7`、`Python
    3.4` 或更高版本提供权威支持，并与 `PyPy` 完美工作。


    独特特性：

    - 它允许多部分记录传输和流式下载。

    - 它自然地处理解包和程序解压缩。

    - 它的程序风格是 SSL 认证。

    - 在此库中，亮点可以根据需要调整和改进。

    - 该库保持活跃并为全局区域和 URL 提供池支持。


    ### PIL


    `PIL` 或 `Python Imaging Library`（Python 图像库）是一个免费的 Python 库，为 Python 增加了图像能力。简单来说，`PIL`
    允许在 Python 中控制、打开和保存各种的图像文件。该库由 Alex Clark 和贡献者创建。`Pad` 是 `PIL` 库的子集。此外，该库提供了强大的图像处理能力；`PIL`
    提供了出色的内部表示和广泛的文件关联支持。相关的焦点 Python 库建议用于快速访问存储在几个中心像素计划中的数据集。


    不寻特性：

    - 该库在通过使用 `show()` 方法检查支持方面非常强大。

    - 该库是批量处理应用程序的理想选择。

    - 在相关的库因素和检查中涵盖了大量的记录计划。

    - `PIL` 还提供了 `BitmapImage`、`PhotoImage` 和 `DIB` 接口。

    - 在此库中，`histogram` 方法允许从图像中提取一些估计值，可用于自定义分离和整体统计分析。


    ### Scrapy


    `Scrapy` 也是一个免费开源的 Python 框架，广泛用于网页和各种任务，包括自动化测试和数据挖掘。最初，`Scrapy` 是为了在线抓取而产生的，但在其发展过程中已更新以满足各种目的。该库还为从网站爬取和隔离数据提供了一个快速且异常的状态。该库用
    Python 编写。`Scrapy` 是围绕基本上自主的爬虫设计的，这些爬虫被如此大量的规则。符合 DRY 原则，`Scrapy` 使收集和扩展某些网页任务变得更加容易。


    异常特性：自- `Scrapy` 创建网站和集中数据并不困难。

    - 它遵循 DRY 原则。

    - 提供一个网络爬虫 shell，允许架构师测试网站的引导。

    - 支持使用标题行传递数据。


    ### Tkinter


    当我们与 `Tkinter` 工作时，Python 为 GUI 应用程序的提供了一种简单且快速的方法。该库被认为是 Python 编程的标准 GUI 库。它为工具箱提供了一个惊人的对象化界面。我们应该记住，使用
    `Tkinter` 构建 GUI 应用程序是非常简单的。


    异常特性：

    - 该库伴随着帮助领导策略的设备范围。

    - 它在制作 GUI 应用程序时提供了便利。

    - `Tkinter` 支持一个惊人的文章界面。


    ### Six


    我们需要承认 `six` 是 Python 库中最简单的。它是一个惊人的 Python 库，旨在简化 Python 2 和 Python 3 之间的差异。`Six`
    的创建是为了支持可以同时尝试 `Python 2` 和 `3` 而无需更改的代码库。`Six` 库由于作为单一文件提供而被认为极易于使用。因此，将 `Six`
    库复制到 Python 环境中是极其容易的。名字 `Six` 反映了 `Python 2 x Python 3`。


    异常特性：

    - `Six` 易于使用这些能力，以使 Python 代码变得很棒，

    - 由于 `Python 2.6`，该库支持每个 Python 适配。

    - 在存档中，即使使用 `Six` 库是极其简单的。


    ### Pygame


    `Pygame` 是一个开源的 Python 库，设计用于完成视频和基于声音的应用开发。特别是它支持二维游戏之旅。因此，它通常被新和老 Python 游戏设计师使用。在
    Python 编译器或 IDE 中，Pygame 使用 `SDL`，即简单的媒体层。像 `SDL` 库一样，`Pygame` 库非常有益，并为许多阶段和工作结构提供帮助。`Pygame`
    可以伴随着基于 Android 的设备，类似于手机和平板。由于某些原因，应该倾向 `pg4a`，它是 Pygame 的一部分。


    异常特性：

    - 该库不需要 `OpenGL`。

    - 它鼓励以简单的方式使用 CPU。

    - 在使用此库时，你会发现 Python 代码简单且清晰。

    - `Asyncio` 帮助于宽范围的循环。

    - 该库易于使用。

    - `Pygame` 用于汇编代码和高级代码。


    ### Bokeh


    `Bokeh` 是一个用于 Python 语言的直观表示库；它奖励在现代程序内部可视化数据。准备在不同的打印格式关联和精细的跨阶段条件下提供第一的图形。无论提供简单的计划还是巨大的数据集，`Bokeh`
    库允许制作仪表盘、数据应用和图表。


    额外特性：

    - 在使用此库时，带有清晰标题的真实图表可以被有效地构建。

    - `Bokeh` 表示可以被有效地带入两个最正常：`Django` 和 `Flask`。

    - 它提供了在许多编程语言中制作优秀和常规的能力。


    ### Asyncio


    该库用于使用 `async` 和语言结构创建并发代码。在程序的更大部分，`async` 库对于 IO 密集和高级协调框架是理想的。`Asyncio` 已用于
    Python 非同步结构，提供数据库、第一类框架和网络工作，并且基本上更多。相关的库带有不同的高级和低级 API。


    异常特性：

    - `Asyncio` 用于传输的约定。

    - 在使用此库时，你会发现 Python 代码简单且清晰。

    - `Asyncio` 帮助于宽范围的循环。


    ## 8.2 数据科学库


    Python 库变得越来越可用和有用。作为开源语言集，大量的数据研究人员使用工具和库增强 Python。目前提供了以下最好的数据科学库。


    ### NumPy


    `NumPy` 是一个重要的数据科学库，被推用于注册二维数组。此外，该库提供了可选的限制以及用于 `C++` 和 `FORTRAN` 代码的工具。拥有 `NumPy`
    的工作数据对于使用 Python 的工智能之旅是基础性的。`NumPy` 提供了文章的特殊表示。在称为 `display` 的 `ndarray` 对象中，你可以存储不同类型的物品。


    独特特性：

    - `NumPy` 是一个非常智能的库，它也很简单。

    - 使用 `NumPy` 时，数学问题被很容易理解。


    ### Pandas


    `Pandas`

    - 在 Python 中，我们使用二维表格来检查数据 `SQL` 或 `Excel`。最初，Python 没有这个组件。但是，`Pandas` 被引入了。事实上，`Pandas`
    是“Python 的 SQL”。简单来说，`Pandas` 是帮助我们处理缺失数据的库，它管理缺失数据更加简单，支持处理从不同资源收集对比数据，并支持修改的数据计划。此外，它提供了数据评估工具和结构，如合并、增强或裁剪数据集，使用
    Pandas 库让软件工程师处理命名或社会信息变得更加简单和直观。它还提供了丰富的、快速和多功能的数据结构。Pandas 被设计为执行数据评估的基础高级结构，在使用
    Python 作为一种编程方法时使用。


    `Pandas` 最著名的方面之一是使用无关的标题来解释复杂的信息练习。此外，智能库在合并、隔离和组装信息的方法方面工作不。它还具有时间操作的便利性。


    异常特性：

    - 使用 `Pandas` 时，自定义的操作可以被有效地完成。

    - 使用 `Pandas`，信息控制变得更加简单和容易。


    ### Matplotlib


    `Matplotlib` 是一个具有前所未有的表示模块的二维绘图库。它准备好在不同的打印格式关联和精细跨阶段条件下传递顶级图形。除了在 Python shell、Python
    内容和 `IPython` shell 中使用外，`Matplotlib` 还可以用于：

    - `Jupyter Notebook`

    - Web 应用程序

    - GUI 工具箱


    正如 `Matplotlib` 的官方网站所说，这个 Python 库试图“让简单变得简单，让困难变得可能”。这个二维绘图 Python 库允许用更少的代码行交付视觉图表、误差框图、直方图、图表、散点图等。


