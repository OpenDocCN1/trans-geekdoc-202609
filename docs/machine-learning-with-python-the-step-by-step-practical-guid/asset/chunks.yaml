    # 第一章：Python 入门


    在讨论 Python 的起源时，我们需要讨论 20 世纪 80 年代中期使用的 `ABC` 编程语言。正是 `ABC` 编程语言的影响促进了 Python
    的发展和崛起，而 Python 目前是世界上最著名的编程方言之一。在 20 世纪 80 年代中期，Van Rossum 是一位 PC 架构师和数学家在 `Centrum
    Voor Wiskunde en Informatica` 担任一种名为 `ABC` 的编程语言的任务协调员。在 20 世纪 80 年代末，Van Rossum
    开始寻找具有另一种语言结构的脚本语言，例如 `ABC`，当时他正在尝试另一种名为 `AMOEBA` 的流行工作框架，该框架可能会从 `ABC` 获取框架调用。因此，Van
    Rossum 本人开始编写另一种基础编程语言，以解决 `ABC` 编写计算机程序语言的局限性。最后，Van Rossum 在 20 世纪 90 年代中期交付了他编程语言的主要实现。最初，他的编程语言采用了
    `Modula-3` 模块结构。我们现在将他的编程语言称为 `Python`。


    人们通常认为 `Python` 是以蛇或蟒蛇命名的，甚至 `Python` 的符号图中显示了两蛇，第一条是蓝色的，第二条是金色的。然而，我们中并没有很多人知道
    `Python` 名字背后的真实故事。20 世纪 70 年代 `BBC` 有一部有趣的讽刺电视节目叫做《蒙提派恩飞行戏团》（Monty Python''s
    Fly Circus）。Van Rossum 恰是该节目的疯狂粉丝。基于此，在 Rossum 将他最近构思的语言命名为：`Python`。


    ## 1 学习 Python 的步骤


    Python 是每个工程师每个应该了解的最基础编程结构和方言之一。大多数软件工程师利用这种语言来构建网站、创建学习计算和执行其他编程任务。从刚开始学习 `Python`
    可能会感到不知所措、困惑和困难，特别是当你不知道如何处理工具和资源时。


    你可能发现的最大挑战之一是所有学习材料和资源的统一方式。假设你对学习和编写 `Python` 感兴趣。考虑到，你会发现在考虑做你感兴趣的事情之前，任何编写资源都需要你花费大量的时间在
    `Python` 的语法结构上。这种不规律使得某些软件工程师学习 `Python` 变得困难。经验丰富的软件工程师还会向你提出这样的观点：“天哪，伙们！这太简单了，甚至不需要考虑学习
    Python！”他们甚至经常向你保证。


    尽管如此。实际上，即使是几行看起来简单的代码也可能难以想象地令人混乱。例如，即使是一行代码也会让你困惑！在 `Python` 中：

    * `django.http` 是什么意思！

    * 为什么某些代码行中有闭包？


    当你对 `Python` 一无所知时，很难看出它是如何运作的。这里的根本问题是，你必须理解 `Python` 的构建模块才能开发出有趣的东西。上述代码片段
    `django.http` 使用主流的 `MVC` 工程来创建网站的视图（view），这是网站的关键结构之一。如果你不具备编写代码来构建视图的能力，那么考虑到，在这个阶段你是不可能创建一个独特的网站的。


    大部分 `Python` 教程和课程假设你在开始某事之前应该理解关于 `Python` 语言结构的所有内容。这种结果导致在你真正需要分析信息、创建网站时，在语法结构上浪费了很长时间精力。通常，投入所有精力思考结构会导致动力丧失。我们可能想将其看作是“枯燥的”。一些教程和课程建议你应该安排足够的“无聊”来进入“令人兴奋的地方”，然而，相信我们，这是学习
    Python 的唯一方法！你可能会发现经过“无聊”的循环后会有更好的结果。例如，环绕“无聊”并直接到达顶部。你应该投入最少精力学习基础，然后。在这个阶段，我们将逐步告诉你如何重复这个过程，无论你是否需要学习。


    ### 动力


    在你开始探索和进入 Python 世界之前，有必要学习它，因为这是一个漫长且困惑的旅程。没有足够的动力，你无法坚持！所以，动力非常重要，比你想象的要得多！大多数人在学校和通过课程记住；通过另一种方式，动力将帮助你找到一个明确的目标，而不是感到困惑。当你开始学习
    Python 时，你可以选择你感兴趣的领域。Python 提供了许多你可能感兴趣的领域：

    * 数据科学（Data Science）

    * 机器学习（Machine Learning）

    * 人工智能（Artificial Intelligence）

    * 手机设备（Smartphone Devices）

    * 游戏开发（Game Development）

    * 硬件/技术/机器人（Hardware/Tech/Robotics/Sensors）

    * 自动化脚本（Automation Scripts）


    至少选择一个你感兴趣并准备好寻找的领域。在你的领域中，你可以思考你的学习，并在最后创建项目。


