    到目前为止，我们指尖下可以依赖的编程语言几乎一样多。编程方言如此丰富，每种 PC 编程语言都有其独特之处。这些是使某种语言区别于其他语言的属性。最终，语言可能会因为其特性被移动或选择用于更广泛的任务。因此，在开始学习
    Python 思想之前，让我们先研究 Python 的实用性、独性和用途等。在接下来的部分中，你将熟悉 Python 的基本思想、特性、应用和设计，这使其与许多不同语言相比显得新颖且稳健。


    ## 2.1 Python 的独特特性


    让我们从 Python 的一些显而易见的亮点开始。


    ### 代码简单

    当我们使用“基础”或“简单”的 Python 编程时，我们需要以完全不同的视角来看待。我们之前读过 Python 语言是一门高级语言。通常情况下，由于关键字和标识符并不多，你会发现
    Python 代码类似于英语。任何开发者甚至非软件工程师只要看一眼代码，就能知道这段代码的作用。无论如何，Python 是逐行执行的，这需要空间。这种能力使得
    Python 代码更加稳定且易于理解。此外，在我们编写完第一个程序后，我们可以说在 Python 中编写代码非常容易。我们可以看到 Python 比其他编程语言更易于编写。在几个小时内，具有编程基础的人就能精通
    Python 的语法。尽管如此，要成为精通标准、模块和包的 Python 编程专家仍需要一些努力。总而言之，我们可以说 Python 是一门对开发者友好的语言。


    ### 开源且免费

    最重要的是，你可能知道 Python 是免费的，而且在许多平台上都可以获取。它的官方网站是下载和介绍 Python 最可靠的来源，例如，`https://www.python.org/`。第二点是
    Python 是一门开源编程语言。开源意味着社区可以随时访问 Python 的源代码。事实上，即使是非大师也可以下载、调整、使用和分发 Python。FLOSS
    通常将这类编程或语言称为“自由、许可和开源软件”。所有的 Python 开发者都在追求 Python 领域的一个共同目标，即提升 Python 及其实用性。Python
    为此将源代码变成了开源代码。


    ### 高级语言

    从书开头开始，我们一直在讨论一个观点，即 Python 是一门高级计算机编程语言。作为工程师，你不需要考虑或复习你的计算机或设备的设计。你用 Python
    编写的代码可以用于国际上的任何程序、机器或框架。你无需额外考虑框架的内存。这种能力使得在 Python 中编写和编码变得更简单。因此，我们可以如前所述将 Python
    称为一种“开发者友好型语言”。


    ### 便捷的语言

    假设你在运行 Windows 操作系统的电脑上构建了一个 Python 程序或应用程序。假设你只需要在运行 MAC OS 系统的电脑上运行该程序。现在，你不需要编写如此大量的
    Python 代码变体。你可以将来自 Windows 电脑的 Python 代码取出来，并在任何操作系统机器上运行它。这样，如果你使用 Python，就不需要以特殊的方式为不同的设备或工作框架编写代码。这种
    Python 特性使我们的语言，特别是脚本语言变得意义重大。在这种情况下，你只需要记住一点，并且要避免任何底层框架。


    ### 解释型语言

    如果你现在是 C++ 或 Java 工程师或其他编程语言学习者，你必须理解你应该先编译你的代码，然后才有运行或完成任务的选择。但是，当你选择 Python
    作为你的编程语言时，代码不会被编译。Python 将机器内的代码转换为一种快速类型，称为字节码。最后，当你的电脑或单元解析 Python 代码时，你可以说它是立即执行每一行，而不是整个代码。这种
    Python 工作使得调试代码比其他语言（例如 Java）更简单，但与 Python 的优势相比，这并不重要。


    ### 面向对象式

    我们从开始讨论这个观点，Python 可以重塑这一现实。因此，它是一门面向对象的编程语言。OOP 语言围绕对象和数据。尽管如此，Python 支持过程化编程和模型，这使得
    Python 成为最强大的编程语言。此外，Python 是一门支持单一报告的语言，相对于 Java。


    ### 可扩展语言

    假设你是某种语言的工程师。你需要编写 Python 代码来使用其他语言，例如 C++。这种 Python 特性使其成为一种真正可扩展的语言，这意味着它可以被扩展以记住其他语言。


    ### 安装型语言

    我们在过去阶段编写代码，其他语言也可以包含在源代码中。同样，你可以将 Python 代码引入其他语言，例如 C++。这允许我们加入其他语言的脚本能力。


    ### 大标准库

    有了丰富的包和库，你可以下载 Python，因此不需要为你的产品每项任务编写完整代码。更丰富的库通常用于表达式、不同年龄、测试单元、网站构建、字符串、数据库支持、图形界面、消息维护以及多种图像控制。


    ### 图形界面编程

    除了制作图形界面 (GUI)，任何应用程序或编程都是易用的。通过你的产品的图形界面，任何用户编程都可以关联。Python 提供了范围。在这些特性中，`wxPython`、`JPython`
    和 `Tkinter` 是著名的。Python 提供这些工具箱，允许你有效地快速地开发界面。


    ### 动态类型语言

    Python 是一种强大的组合编程语言。这意味着在运行时，你的电脑或框架将决定任何值的类型，而不是在此之前。在 Python 中，我们不需要在定义或声明时确定数据类型。


    ## 2.2 Python 版本


    ### 第一阶段

    Python 在 1994 年 1 月在其主要时期创建并发布了第一个版本，即 `Python 1.0`。实用编程工具例如 `reduce`、`filter`、`lambda`
    和 `map` 是该版本实现的关键特性。`Python 1.2` 是 Rossum 先生仍在 CWI 时发布的最后一个更新。此版本发布于 1995 年。1995
    年，Van Rossum 先生在 WWI 研究中心工作，专注于 Python 语言。从那时起他发布了几个不同的 Python 版本。随着 `Python 1.4`
    的到来，Python 增加了一些新特性和隐藏特性。在这些特性中 广为人知。为了引起争议，使用了 `Modula-3`。它们在 `Python 1.4` 中通过名称修饰实现了基本的类型覆盖。Van
    Rossum 还介绍了名为 `CP4E` 的“全民计算机编程”。他的目标是让具有多种计算机语言命令能力的编程对普通人可用。Python 在这方面承担了基本功能。解释是
    Python 有一种简单的语法。`Python 1.6` 是后续版本。通过一些错误修复，`Python 1.6` 发布另一个版本。


    ### 第二阶段

    在 Python 的下一个阶段，Python 发布了版本 `Python 2.0.0`。它于 2000 年 10 月发布。Python 在这个版本中实现了一个关键改进，将
    Python 的类合并，即顺序中的独立类。这一变化是 Python 成为对象编程语言的基本原因。`Python 2.2` 是后续版本。`Python 2.2`
    于 2001 年发布。`Python 2.6.1` 和 `Python 2.7.0` 是 Python 在第二阶段发布的后续版本。`Python 2.6`
    是为了帮助 `Python 3.0` 创建的。`Python 2.7` 再次发布以帮助 `Python 3.1`。


    ### 第三阶段

    在 Python 进化的第三阶段，Python 发布了 `Python 3.0.0`。通常被称为 `Py3K` 或 `Python 3000` 的 `Python
    3.0` 于 2008 年发布；`Python 3000`。此外，为了克服 Python 的缺陷，创建了 `Py3K`。


    '
