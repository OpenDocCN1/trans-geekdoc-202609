  trans: "\n\n# 第 5 章：Python 编程中的数据类型、运算符和变量\n\nPython 的主要概念是数据类型、运算符和变量，它们被视为这种高级\
    \ PC 编程语言的基础结构单元。通常情况下，我们使用它们来编写程序，并通过它们的特性来实现基本功能。在这些概念中，数据类型是核心概念，如果不掌握这些基本概念，没有人能学会\
    \ Python 编程。作为一种计算机编程语言，我们将在本部分介绍一些基础运算符、变量和 Python 数据。\n\n## 5.1 Python 变量\n\n\
    Python 标识符的另一个名称是`变量`。变量是一个指代机器或设备内存区域的术语。你不需要在 Python 中定义这些类型的变量，因为 Python 是一种引入且足够智能可以自动分类类型的编程语言。此外，我们可以说\
    \ Python `变量` 是存储各种信息的内存区域，例如整数或字符。\n\n在 Python 中，变量是可更改且可的，因为它们利用多种不同的操作。无论如何，变量需要一个字母或下划线。建议使用小写字母作为变量名。这在\
    \ Python、Java 和 C 中都是优秀的组成部分。\n\n### 命名变量或标识符\n\n标识符的条件是变量。为了想象程序中使用的精确系数和整数，会使用变量。对于\
    \ Python，以下是命名变量的规则：\n\n*   字母或下划线 `_` 必须是标识符的起始字符。\n*   除了特殊字符外，每个字符可以是 `\"a-z\"\
    `、`\"A-Z\"` 字母、下划线或小写的 `\"0-9\"` 数字。\n*   变量名不能包含任何空格或空白区域或任何特殊或未定义的字符，例如 `@`、`#`、百分号、`^`\
    \ 和 `*`。\n*   变量名不能看起来像你 Python 程序语法中描述任何表达式。\n\n在 Python 中，变量是区分大小写的。例如，`I'm`\
    \ 和 `cool` 是不等等的。\n\n**有效标识符示例：** `n696`、`v`、`v69` 等。\n**无效标识符示例：** `5a`、`vpercent69`、`x69`\
    \ 等。\n\n### 多变量赋值\n\n在单语句中（通常称为多变量赋值），Python 允许为多个标识符保持打开门。它通常有两种可选方式使用：要么为多个标识符声明一个空变量，要么同时将多个属性赋值给多个变量。\n\
    \n#### 模型 - 1\n打开 Python 终端或 IDE 并输入声明变量的命令。\n```python\n>>> n=v=w=987\n>>> print\n\
    >>> print (n, v, w)\n```\n输出：当你输入打印变量值的命令时，输出将如下所示。\n```python\n>>> 987, 987,\
    \ 987\n```\n\n#### 模型 – 2 \n```python\n>>> n, v, w = 987, 876, 765\n>>> print\
    \ (n)\n>>> print (v)\n>>> print (w)\n```\n输出：对于输出，当你输入命令时。\n```python\n>>> 987\n\
    >>> 876\n>>> 765\n```\n\n## 5.2 Python 中的运算符\n\n总之，运算符是语言特定的语法标记，需要某些操作来完成。运算符主要源自科学标准。例如，“乘法指示\
    \ (`*`)”是一个 Python 运算符。它用于两个数字的乘积。在 Python 中，运算符被描述为能力的符号表示，为了实现某些真实且想要的结果，在两个操作数之间执行特定的演示。Python\
    \ 提供的运算符已说明。这里是一些广泛使用的：\n\n*   数值运算符\n*   数学运算符\n*   任务运算符\n*   逻辑运算符\n*   位运算符\n\
    *   成员运算符\n\n在书的这一部分，我们将讨论之前提到的部分运算符。数学运算符为了获得理想的结果，数值处理运算符用于执行复杂的数值处理任务。这种情况涉及两个操作数，通过运算符在它们之间执行操作，从而产生某些显著且直接的值。以下是\
    \ Python 中常用、重要且有价值的数学运算符：\n\n*   加法 (`+`)：此运算符用于两个操作数之间以执行加法或整体操作。\n    ```python\n\
    \    >>> n, v = 25, 25\n    >>> n + v\n    ```\n    你的输出将打印 \"50\"。\n*   减法 (`-`)：此运算符取主操作数，并从第一个操作数减去第二个操作数。\n\
    \    ```python\n    >>> n, v = 25, 25\n    >>> n - v\n    ```\n    你的输出将打印 \"\
    0\"。\n*   除法 (`/`)：此运算符取后续操作数并将第二个操作数除以主操作数，并根据你的演示给出余数。\n    ```python\n    >>>\
    \ n, v = 6, 2\n    >>> n/v\n    ```\n    你的输出将打印 \"3.0\"。\n*   乘法 (`*`)：此运算符执行主操作数和第二个操作数之间的乘法，如之前。\n\
    \    ```python\n    >>> n, v = 6, 3\n    >>> n * v\n    ```\n    你的输出将打印 \"18\"\
    。\n*   取模 (`%`)：此运算符负责除法操作，并将余数作为你的结果。\n    ```python\n    >>> c, w = 4, 2\n \
    \   >>> c % w\n    ```\n    你的输出将打印 \"0\"。\n\n### Python 比较运算符\n\n当我们谈论 Python\
    \ 时，比较运算符用于查看两个操作数并分别返回一个布尔类型，即 TRUE（真）或 FALSE（假）。\n\n*   `==`：当且仅当值相等且有效时，使用此运算符。\n\
    *   `!=`：当值精确但不一致时，使用此运算符。\n*   `<=`：当主操作数小于或等于后续操作数时，使用此运算符。\n*   `>=`：当你的第一个操作数大于或等于后续操作数时，使用此运算符。\n\
    *   `<>`：如果且仅当两个值不等时，使用此运算符。\n*   `>`：当你的第一个操作数大于后续操作数时，使用此运算符。\n*   `<`：如果主操作数小于后续操作数，则使用此运算符。\n\
    \n### Python 赋值运算符\n\n在 Python 中，我们使用赋值运算符将右侧项目的评估分配给左侧操作数。\n\n*   `=`：此运算符通常用于将左操作数的值分配给右侧项目。\n\
    *   `+=`：通过评估右操作数，使用此运算符增加左操作数的值并将更改后的赋值返回左侧操作数。\n    ```python\n    >>> n = 2,\
    \ v = 4\n    >>> n += v\n    ```\n    这等于\n    ```python\n    >>> n = n + v\n\
    \    >>> print (n)\n    ```\n    此外，如果 `n` 是 \"6\"，你的输出可能会打印该值。\n*   `-=`：考虑到这一点，左操作数的值减少了右侧操作数的值，并将调整后的赋值返回左侧操作数。\n\
    \    ```python\n    >>> n, v = 4, 2\n    >>> n -= v\n    ```\n    你的输出可能会打印 \"\
    2\"。\n*   `*=`：通过评估右操作数，使用此运算符增加左操作数的值并将更改后的奖励返回左侧操作数。\n    ```python\n    >>>\
    \ n, v = 4, 2\n    >>> n *= v\n    ```\n    你的输出可能会打印 \"8\"。\n*   `%=`：此运算符负责将左操作数的计数除以右操作数并将更新委托回左侧操作数。\n\
    \    ```python\n    >>> n, v = 4, 2\n    >>> n %= v\n    ```\n\n### Python 逻辑运算符\n\
    \n当语句 'C' 是逻辑的且语句 'W' 同样明显的时，那么结果是正确的。在某些其他函数中结果将不是正确的。此表可以帮助你更好地理解“与运算符”。\n\n"
