    \n`filter()` 函数通过提供两个参数（函数和变量）对值进行过滤。在没有函数的情况下，它只返回。示例：\n```python\ndef filterdata(w):\n\
    \    if w>4:\n        return w\nresult = filter(filterdata,(1,2,7))\n>>> print(list(result))\n\
