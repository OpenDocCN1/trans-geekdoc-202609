    \n## 7.1 Python 中的函数\n\nPython 函数是极其实用的小型代码块，可以被调用来执行特定任务。它们在程序中被用来扮演特殊角色。基本上，它们是一些被包含在\
    \ `{}` 内部的唯一语句。在 Python 中，你可以根据需要无限次调用函数。\n\n### Python 函数的优势\n\n以下是 Python 函数的一些主要优势：\n\
    - 通过使用函数，我们可以避免代码的重复。通过单条语句，就可以调用整个函数。这节省了大量时间！\n- 它们是可重用的，这种可重用性是一个非常具有吸引力的特征。它们在程序中可以被多次调用。\n\
    - 通过使用这些函数，一个较大的程序可以被分成多个函数。这增强了可用性。\n\n### Python 的函数\n\nPython 编程语言中有许多函数。它们可以从解释器包中被调用并用于任何程序中。如果没有这些函数，Python\
    \ 对软件社区将毫无吸引力。如今，它们被全球范围内用于执行所有主要的编程任务。\n\n#### `abs()` 函数\n\n此函数主要用于数值。当我们向程序输入任何整数时，它会返回绝对值。它专门用于获取针对单个参数的绝对值。这里是关于绝对数值的一些示例，以理解该概念。\n\
    \n示例：\n```python\n# int number\n>>> integer = -25\n>>> print('abs value of -25\
    \ is', abs(integer))\n# float number\n>>> float = -55\n>>> print('abs value of\
    \ -55', abs(float))\n```\n输出：\n```\nabs value of -25 is: 25\nabs value of -55\
    \ is: 55\n```\n这些结果显示了 `abs()` 函数是如何工作的。\n\n#### `bin()` 函数\n\n此函数 `bin()` 返回整数的二进制结果。二进制输出在值的开头有前缀\
    \ `0b`。\n\n示例：\n```python\n>>> n=20\n>>> v= bin(n)\n>>> print(v)\n```\n输出：\n```\n\
    在这种情况下，你的控制台将打印出 0b10100\n```\n\n#### `bool()` 函数\n\n此函数通过真值测试方法输出布尔类型的值。它是 Python\
    \ 的一个基础的内置函数。如果有任何输入值，结果为真；否则它打印假。\n\n示例：\n```python\n>>> v1=[5]\n>>> print(v1,\
    \ 'is',bool(v1))\n>>> v1= No-value\n>>> print(v1, 'is',bool(v1))\n```\n输出：\n```\n\
    [5] is True\nNo-value is False\n```\n\n#### `bytes()` 函数\n\n在 Python 中，`bytes()`\
    \ 函数对于获取字节形式的对象非常有帮助。它属于 `byte-array` 命令。大多数 Python 编程专业人士通过此命令生成对象来帮助。\n\n示例：\n\
    ```python\n>>> string= \"Hi Friend.\"\n>>> array= bytes(string, 'utf-8')\n>>>\
    \ print(array)\n```\n结果：`Hi Friend`\n\n#### `callable()` 函数\n\n相关函数会调查并在当对象看起来可调用的时显示\
    \ True，否则显示 False。此函数可以通过通过单条命令通知用户对象的可用性来节省时间。\n\n示例：\n```python\n>>> v= 12\n\
    >>> print (callable(v))\n```\n输出：`False`\n\n#### `compile()` 函数\n\n此函数 `compile()`\
    \ 通过 Python 的编译器对源代码进行操作，并最终生成一个该代码的对象。稍后我们可以使用另一个函数 `exec()` 执行这段代码。\n\n示例：\n\
    ```python\n>>> yourcode_str=\"print('hello world')\"\n>>> yourcode=compile(yourcode_str,'<string>','exec')\n\
    >>> exec(yourcode)\n```\n输出：\n```\nhello world\n```\n\n#### `exec()` 函数\n\n`exec()`\
    \ 函数在 内置函数中具有一定的重要性。它运行 Python 程序产生输出。没有这个函数，Python 程序无法执行。\n\n示例：\n```python\n\
    >>> v=\"print(12)\"\n>>> exec(v)\n```\n输出：\n```\n12\n```\n\n#### `sum()` 函数\n\n\
    在 Python 中，当我们使用数值数据进行算术运算时，`sum()` 函数变得不可或缺。我们使用此函数来对列表中的值求和。\n\n示例：\n```python\n\
    >>> v = sum([1, 2, 3, 4, 5])\n>>> print(v)\n```\n输出：\n```\n15\n```\n\n#### `any()`\
    \ 函数\n\n`any()` 函数在 Python 中提供布尔类型的结果，可能是真或假。当列表中任何真值时，它打印真。如果没有真值，它返回假。它也是一个处理大数据的有用函数。\n\
    \n示例：\n```python\n>>> V=[4, False]\n>>> print(any(V))\n>>> V=[]\n>>> print(any(V))\n\
    ```\n结果：\n```\nTrue\nFalse\n```\n\n#### `ascii()` 函数\n\n`ascii()` 函数在 Python 中有重要作用。此函数的输出值总是字符串。记住它不打印其他的\
    \ ascii 字符。\n\n示例：\n```python\n>>> vQ='Have a good day'\n>>> print(ascii(vQ))\n\
    >>> wQ='Have a nice day'\n>>> print(ascii(wQ))\n```\n输出：\n```\n'Have a good day'\n\
    'Have a nice day'\n```\n\n#### `bytearray()` 函数\n\n`bytearray()` 函数在 Python 编程中起着重要作用。为了创建一个对象，此函数帮助用户或软件专业人士不浪费时间。示例：\n\
    ```python\n>>> string1=\"Computer Programming\"\n>>> array1= bytearray(string1,\
    \ 'utf-8')\n>>> print(array1)\n```\n结果：`bytearray(b'Computer Programming')`\n\n\
    #### `eval()` 函数\n\n`eval()` 函数在 Python 编程中起额外作用。此函数在运行程序中执行自身以帮助代码管理器完成工作。示例：\n\
    ```python\n>>> w= 6\n>>> print(eval('w+1'))\n```\n输出：`7`\n\n#### `format()` 函数\n\
    \nPython 中的 `format()` 函数让程序员的编码变得更容易。通过格式化值和其他给定数据，它节省了时间。示例：\n```python\n>>>\
    \ print(format(15, \"d\")) # 整数\n>>> print(format(15.7, \"f\")) # 浮点数\n>>> print(format(15,\
    \ \"b\")) # 二进制\n```\n输出：\n```\n15\n15.700000\n11111\n```\n\n#### `frozenset()`\
    \ 函数\n\n`frozenset()` 函数提供一个冻结集合（frozen-set）对象。示例：\n```python\n>>> letter = ('j',\
    \ 'k', 'm', 'p')\n>>> frozset = frozenset(letter)\n>>> print('Frozen set:', frozset)\n\
    >>> print('set with no value:', frozenset())\n```\n输出：\n```\nFrozen set: {'j',\
    \ 'k', 'm', 'p'}\nset with no value: {}\n```\n\n#### `getattr()` 函数\n\n相关函数在 python\
    \ 语言中起着非常重要的作用。通过此函数，用户能够获取对象的属性。软件程序员使用此函数为对象赋值。示例：\n```python\nclass Details:\n\
    \    age = 25\n    name = \"faheel\"\ndetail = Details()\n>>> print(getattr(detail,\
    \ \"age\"))\n```\n输出：`25`\n\n#### `globals()` 函数（重复）\n\n`globals()` 函数允许用户获取全局符号表，包含所有变量和方法的信息。它是任何程序中使用所有符号的强制性函数。示例：\n\
    ```python\n>>> Id =72\n>>> print(globals()['Id'])\n```\n输出：`72`\n\n#### `hasattr()`\
    \ 函数\n\n`hasattr()` 函数基于布尔类型返回，即 True 和 False。示例：\n```python\n>>> v = [0, False,\
    \ 5]\n>>> print(hasattr(v, 'any'))\n>>> v = []\n>>> print(hasattr(v, 'any'))\n\
    ```\n结果：`True`, `False`\n\n#### `iter()` 函数\n\n`iter()` 函数通常用于，因为它处理对象（通常是列表）内部的值。它一个一个打印列表中的值。示例：\n\
    ```python\n>>> list_ = [6,7,8]\n>>> listIter = iter(list_))\n>>> print(next(listIter))\n\
    >>> print(next(listIter))\n>>> print(next(listIter))\n```\n输出：\n```\n6\n7\n8\n\
    ```\n\n#### `len()` 函数\n\n这是一个 Python 编程中非常简单但重要的函数。用户可以使用此函数测量项的长度。示例：\n```python\n\
    >>> stringW = 'Data'\n>>> print(len(stringW))\n```\n结果：`4`\n\n#### `list()` 函数\n\
    \n`list()` 函数是最常用的函数之一，用于生成给定指令的完整列表。示例：\n```python\n>>> String = 'abcde'\n>>>\
    \ print(list(String))\n>>> tuple = (1,2,3,4,5)\n>>> print(list(tuple))\n```\n\
    输出：\n```\n['a', 'b', 'c', 'd', 'e']\n[1, 2, 3, 4, 5]\n```\n\n#### `locals()` 函数（重复）\n\
    \n`locals()` 函数提供布尔类型的结果根据定义的程序。它两个输入并返回真或假。示例：\n```python\ndef localsBeta():\n\
    \    return {}\ndef localsAlpha():\n    return True\n>>> print('localsBeta:',\
    \ localsBeta())\n>>> print('localsAlpha:', localsAlpha())\n```\n结果：`{} , True`\n\
    \n#### `map()` 函数\n\n`map()` 函数非常重要，因为你可以通过此函数处理项的列表。示例：\n```python\ndef calculateAddition(n):\n\
    \    return n+n\nnumbers = (1, 2, 3, 4)\nresult = map(calculateAddition, numbers)\n\
    >>> print(result)\n```\n输出：\n```\n<map object at 0x...>\n```\n\n#### `delattr()`\
