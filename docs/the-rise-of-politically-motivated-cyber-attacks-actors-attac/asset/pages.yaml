  md: '# THE EU SANCTIONS


    In 2020, as a part of the EU''s cyber diplomacy toolbox, the Council imposed the
    first restrictive measures against six individuals (Chinese and Russian individuals)
    and three entities (two Russian and one North-Korean entities) attributed to being
    involved in various cyber attacks, such as the attacks against the Organisation
    for the Prohibition of Chemical Weapons (OPCW), and the WannaCry, NotPetya, and
    Operation Cloud Hopper attacks. These sanctions are added to the list of people
    involved in attacks with chemical weapons, i.e. the UK Salisbury attack conducted
    in early 2018. In 2020, a hacking group and individuals from Russia were attributed
    to the cyber attack against the German Bundestag in 2015 which was also added
    to the Cyber Sanction List (Simmons + Simmons, 2020; Dumortier et al., 2020; EC,
    CoEU, 2020). The sanctions can only be imposed against non-state actors, such
    as natural or legal persons, other entities, or bodies different from a State.
    These sanctions include both the travel ban and assets freeze. They also prohibit
    EU individuals and entities from making funds available to those on the sanction
    list (EC, CoEU, 2020; Dumortier et al., 2020; Botek, 2021).


    Sanctions can be seen as an option to enhance the costs of being involved; both
    the actual sanctions and the public naming and shaming can have a deterrent and
    dissuasive effect. However, there are limitations to these measures developed
    by the EU. In practice, the option to impose sanctions has a limited effect beyond
    the signal they send to a broader audience. Often, the attacks are conducted on
    behalf of the state, so they have a limited effect on the state''s decision-making
    process. However, the penalties set out in the EU Directives on Attacks against
    Information Systems 2013 could be applied towards the state-sponsored actors that
    might have a deterrent effect depending on the state''s ties to the attacker (Dumortier
    et al., 2020; EU, 2013).


    # THE US INDICTMENTS AND ARREST WARRANTS


    In 2018, the US indicted seven Russians associated with APT 28 (Fancy Bear) for
    their involvement in persistent and sophisticated cyber attacks affecting US persons,
    corporations, and international organisations. The US argued that these Russian
    citizens'' campaigns from 2014 to at least 2018 had a strategic interest in the
    Russian Government (Westby, 2020). In 2020, the US DoJ announced criminal charges
    against six Russian military intelligence officers employed by GRU. These officers
    have been linked to the Sandworm. VoodooBear''s cyberactivities, i.e. the 2018
    Olympic Winter Games and the 2018 attack against the UK''s Defence Science and
    Technology Laboratory (GOV.UK, 2020; Borger, 2020). The US DoJ also opened three
    indictments against the Chinese APT41 group members in 2020. DoJ brought charges
    against five Chinese nationals and two Malaysians for a widespread series of network
    intrusions. The APT41''s activities have been linked to a Chinese company known
    as Chengdu 404 Network Technology. This company is'
  merge: -1
  img_proc: true
- pgno: 157
  md: 'believed to operate at the command of the Chinese MSS. The indictments covered
    intrusions across over 100 victim organisations in several countries (Hlevek,
    2020; US DOJ, 2020).


    # ATTRIBUTION AFTER THE SOLARWIND ATTACK


    The US President Biden signed in 2021 an executive order imposing sanctions on
    Russia after several malicious cyber attacks against the US and its allied. These
    sanctions included the attackers behind the 2020 SolarWind attack formally attributed
    to the Russian state-sponsored APT29 (Cosy Bear) (Sexton, 2021b). The sanctions
    also include 32 individuals believed to have participated in government efforts
    to influence the 2020 election and Russian private-sector cybersecurity firms
    for their work supporting government efforts (Brandom, 2021). The Russian spokesperson
    Peskov reacted to the sanctions by stating that Russia would retaliate against
    the new sanctions. “The principle of reciprocity applies ... to best ensure our
    own interests” (Roth, 2021).


    # ATTRIBUTION AFTER THE MICROSOFT EXCHANGE ATTACK


    After the Microsoft Exchange attack in 2021, the US and a broad coalition of allies,
    the EU, NATO, UK, Australia, Japan, New Zealand, and Canada, have accused the
    Chinese Government of hiring hackers to attack the West. The states and institutions
    increased the rhetoric by claiming that China has action maliciously and irresponsible.
    The US has also issued a public warning about the conduct of China. The NSA, CISA,
    and the FBI all consider China poses a serious threat to the US and its allies
    in its pursuit of strategic military and economic objectives by using state-sponsored
    actors to target political, economic, military, and educational entities (The
    White House, 2021h; CISA, 2021). Concerns have been raised whether this hack signifies
    a change from targeted espionage to damaging raid-like attacks, which means China
    is changing its cyber behaviour (BBC News, 2021j).


    The US government claimed that the Chinese authorities paid hackers using the
    so-called HfH method. Thereby, China has fostered an ecosystem of criminal hackers
    operating on the political and criminal levels. According to the US, the Chinese
    MSS uses criminal contract hackers to conduct unsanctioned cyberoperations globally,
    also non-political attacks (Vincent, 2021; The White House, 2021h; Holland & Chiaucu,
    2021; Holland & Chiaucu, 2021). The EU and the UK NCSC supported these claims
    by highlighting that some of APT40’s attacks were conducted against maritime industries
    and naval defence contractors in the US and Europe, whereas APT31 were involved
    in attacks on the governmental entities, i.e. the attack on the Finnish Parliament
    in 2020 (Vincent, 2021; CoEU, 2021; NCSC, 2020).


    These direct attributions to China follow a string of political disagreements
    between the US and China over trade, the military, the South Chinese Sea, democracy
    activists in Hong Kong, and Uyghurs in the Xinjiang region'
  merge: -1
  img_proc: true
- pgno: 158
  md: '(Holland & Chiau, 2021). Although the Western states call out to end this practice,
    the US has not imposed sanctions on China similar to the economic sanctions given
    to Russia after the SolarWind attack in 2020 (Vincent, 2021; Brandom, 2021). However,
    the US DoD announced criminal charges against four named MSS hackers for being
    involved in year-long global cyber campaigns against foreign governments and entities
    in key sectors (Vincent, 2021; US DoJ, 2021). China reacted to these accusations
    by the US and its allied by stating that the state condemned all forms of cybercrime,
    and these claims were fabricated and unreasonable (BBC News, 2021j). The strong
    rhetoric used by the US and its allies makes it difficult for them to use proxies
    for politically motivated cyber attacks against China and other states. It will
    backfire if China and Russia can provide evidence of these states using the same
    means and methods. China fuelled the verbal conflict by highlighting the attacks
    conducted by the US, which China argues conduct the most significant number of
    cyber attacks (Janofsky, 2021). The active Chinese defense is linked to Mao''s
    strategy: "[W]e will not attack unless we are attacked, but we will surely counter-attack
    if attacked" (China Ministry of National Defense, 2015; APRS, 2019). Therefore,
    it is unlikely that the public attributions of China''s involvement in the Microsoft
    Exchange hack will end the conflict; it is more likely to increase because of
    this.


    # Conclusion


    In cyberwar and warfare, states are operating below the threshold of international
    law by using proxies to conduct the attacks. The normless area facilitates these
    actions where the frequency of attacks increases and society is more severely
    impacted. Different strategies are developed to manage the attacks and defence.
    However, the lack of international rules and norms for politically motivated activities
    in cyberspace has a detrimental effect beyond the original scope of the attacks.
    The protection of CIs, private businesses, and online users is circumvented to
    archive states'' overall aim. Despite international pressure, the attacking state''s
    payoff is too high, and the initiative to stop these practices does not incite
    changes.


