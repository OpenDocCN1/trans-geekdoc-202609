- pgno: 61
  md: '# 3 Cyber Attacks, Means, and Methods


    # Introduction


    The online environment creates an architecture that offers numerous opportunities
    for politically motivated actors to launch attacks that exploit computer technologies,
    devices, and networks. The technological development opens up new avenues allowing
    the attackers to enter and manoeuvre undetected, often for a long time before
    they are discovered and the vulnerabilities used are patched. The frequency and
    severity of these attacks have reached a level that cannot be recreated in the
    offline environment. The previous chapter outlined the different actors linked
    to politically motivated attacks to generate a comprehensive understanding of
    the different groups’ motivations. This chapter aims to define how the attacks
    are conducted and the tools available to the attackers. Finally, this chapter
    offers insight into various means and methods used by the actors.


    # *Cyber-dependent and Cyber-enabled Attacks*


    Politically motivated cyber actors have several means available for their activities,
    and these have been extended over the years. The attackers are capitalising on
    modern technologies and the lack of security. Therefore, these actors continually
    develop their modus operandi to exploit computer technologies, systems, and networks
    to fulfil their political agenda. Some attacks mirror offline crime, but there
    is a difference in the scope and the reach. Whereas other attacks are innovative
    and can only be conducted in online environments. These constitute a new way of
    attacking propelled by constant technological development. The attack types fall
    into two categories, cyber-dependent and cyber-enabled attacks deriving from the
    cybercrime typologies (Holt & Bossler, 2016; McGuire & Dowling, 2013; Rokven et
    al., 2018).


    Previously, politically motivated actors were considered in the realm of either
    cyberwar or cyberterrorism. Yet, the scope has been extended significantly to
    cover states, terrorists, state-sponsored hacking groups, or state-supported groups
    and actors outside the state sphere, where online activism or hacktivism are emerging.
    These groups are using the same means and'
  merge: -1
  img_proc: true
- pgno: 62
  md: 'Table 3.1 Cyber-dependent and cyber-enabled attacks


    | Typology | Characteristic | Examples |

    | :--- | :--- | :--- |

    | **Cyber-dependent attacks** | New types of crime These attacks are **dependent**
    on the online environment and cannot be replicated in the offline environments
    | Malware, ransomware, APTs, supply-chain attacks, DoS and DDoS attacks, etc.
    |

    | **Cyber-enabled attacks** | Mirrors offline crimes The online environment **enables**
    these attacks, and they can be replicated in the offline environment | Espionage,
    surveillance, disinformation, doxxing, defacement and trolling, etc. |


    Source: UK CPS (2019).


    methods, and they all are linked to a political motivation, but the actions and
    the groups are considered differently. Therefore, it is crucial to consider the
    motivation behind these groups and individuals to categorise the attack.


    Cyber-dependent attacks are those crimes that can only be committed using information
    and communication technology (ICT) devices. In this context, the device becomes
    both the tool for committing the crime and the actual target, i.e. developing
    and propagating malware for financial gain, hacking to steal, damage, alter, or
    destroy data, computer systems or networks – or particular online activities.
    These can, for example, be developing and circulating malware, hacking, stealing
    sensitive personal or industrial data, attacking using denial-of-service (DoS)
    or distributed denial-of-service (DDoS) attacks to overflow web pages or mailboxes
    with requests to face financial or reputational damage (Clough, 2015, p. 11; Europol,
    2020, p. 14; HM Government, 2016, p. 17; Munk, 2018, p. 235; Rokven, et al., 2018,
    p. 28; UK CPS, 2019). Hackers are central to developing these new attack forms
    as well as hacking into systems.


    Cyber-enabled attacks are those crimes that mirror crimes committed in an offline
    environment, where the Internet and cyberspace create opportunities to offend
    on an unprecedented scale. By using ICTs to conduct attacks, it is possible to
    reach out to a broader number of targets using computers, networks, or other forms
    of ICT (Clough, 2015, p. 11; Munk, 2018, p. 235; Rokven et al., 2018, p. 28; UK
    CPS, 2019).


    # Politically Motivated Cyber-dependent and Cyber-enabled Attacks


    The different types of cybercrime, dependent or enabled by the online environment,
    can be separated into three areas depending on the offender''s motivation. These
    are personal cybercrime, financial cybercrime, and political cybercrime. The motivation
    is the drive behind the actions; however, this'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'is not necessarily a clear-cut distinction. For example, the attackers can
    be involved in a politically motivated campaign and benefit financially from the
    attack. Alternatively, the motivation can predominately be personal, but the target
    is political. This makes it difficult to make a precise classification of the
    attackers. Many attacks are originating from Russia, China, North Korea, Iran,
    and other places. Countries like the US and Israel are also involved in large-scale
    cyberwarfare campaigns. However, threats are also emerging from other countries
    and regions as well as domestically. New regional cybercrime hotspots are also
    beginning to threaten South Asia and West Africa, which creates a growing concern
    (HM Government, 2016, p. 17).


    The aim and motivation behind the attacks can be multifold, but they are mostly
    linked to damage, distorting or destroying data or networks (UK CPS, 2019). Several
    different means and methods are being used. Hostile takeovers or extortion, such
    as ransomware, are methods that are rapidly increasing. These attack forms have
    proven effective, and politically motivated actors have adopted them, tricking
    victims into downloading innocent-looking software to enable access. The software
    used encrypts the data on the computer or server, preventing the targets from
    accessing the systems unless they pay a ransom (EuroPol, 2020; Jeffrey, 2014,
    p. 5).


    There is some confusion about the typology used to separate these two areas. A
    cyber-dependent crime could be an organised cyber attack using malicious software
    or malware, such as a virus, a worm, a Trojan horse, or a logic bomb to carry
    out the attack. However, the categorisation is not straightforward in determining
    whether this is a personal cybercrime, a financial cybercrime, or a politically
    motivated crime. The attack could be politically motivated carried out against
    financial institutions because of the business cases. However, it could also be
    that the political group needed money to finance their other activities. Is this
    a financial attack, or is it politically motivated? For example, in terms of attributing
    an attacker, it is nearly impossible to identify whether an attack originates
    from a military unit, an independent hacker or an organised crime group. All these
    would use the same means and methods. Of course, all of them could have been involved
    in the same attack (Klimburg, 2009, 2011, pp. 41–42; Munk, 2015, p. 49).


    # Hacking and Hackers


    There has been a shift in the targets of cyber attacks. The motivation for attacks
    is not necessarily linked to targeting the public sector, the government, or the
    establishment; businesses, corporations, groups, and individuals are equally targeted
    by the politically motivated groups and individuals. Hacking does not have a single
    comprehensive definition. Instead, it covers several different activities. The
    phrase ‘hacking’ covers both those who write the codes and those exploiting them.
    The people involved in these two processes have different goals. Nevertheless,
    both groups’ means and methods are linked to problem-solving techniques (Erickson,
    2008, p. 10).'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'It is essential to consider the actual impact of the hack and all the impacts
    associated with the primary behaviour. The impact of the actions goes beyond the
    actual hack. For states, groups, companies, and individual users, there are financial
    losses related. However, there might also be long-term effects, such as get the
    system up again or actual damage to physical or virtual assets. Hacks that modify,
    alter, or subvert security protocols are illegal in most jurisdictions (UK CPS,
    2019). Hacking can also be used to obtain information or access computer systems
    and other protected computer technologies or networks to further an illegal act
    (Holt et al., 2018, p. 69). The actual hack does not necessarily introduce anything
    new to the systems, but it enables the hackers to derive everything from the hosts''
    protocols and procedures. Often the hack is deployed to understand how the system
    operated, and the hacker experiment with different manipulations linked to the
    system’s initial programming and interconnected devices (Gunkel, 2018, p. 6).


    New vulnerabilities have appeared, allowing hackers to develop tools and pathways
    that follow new technologies. Most hackers are still involved in the process,
    but their activities have been diversified to fulfil a demand from less technical
    skilled groups and individuals. Beyond the actual hacking, some hackers are developing
    and selling hacking software solutions on the Dark Web, which makes it easy for
    less technical skilled hackers to access computer systems and networks illegally.
    Hackers are developing advanced hacking tools, for example, botnet, control server
    infrastructure, remote access tools, malware creation and obfuscation services,
    source-code writing services, and targeted exploitation toolkits available on
    various underground markets (An, 2017; Palmer, 2019).


    # Hackers


    Ludlow claimed in 1996 that the word ‘hackers’ had a twofold meaning:


    > Originally, a hacker was someone who liked to hack computer code (i.e., write
    programs) or, in some cases, hack electronic hardware (i.e., design and build
    hardware). Thanks to the news media, ‘hacker’ has also come to have a negative
    connotation, usually meaning those who illicitly hack their way into other people’s
    computer systems. Some folks have tried to preserve the original (good) sense
    of ‘hacker’ by introducing the term cracker to cover cases of electronic trespassers.
    However, like all attempts to fight lexical drift, their efforts have failed.
    (Ludlow, 1996, p. 125)


    As Ludlow argued, hackers are perceived negatively, but hackers can also be individuals
    who enable technologies to be used in new innovative ways for legitimate and illegitimate
    activities (Gunkel, 2018, pp. 3–4; Holt et al., 2018, pp. 69, 678). The term ‘cracking’
    is a more accurate term for describing illegal'
  merge: -1
  img_proc: true
- pgno: 65
  md: 'access to computer systems (hacking) for criminal purposes by misusing computer
    systems. The word ‘cracking’ is a combination of ‘criminal’ and ‘hacker’. However,
    strangely enough, this term has never really been adopted as a typology to describe
    the criminal intent behind the hack (Moore, 2011, p. 19). Instead, hack and hacking
    are the preferred words to describe both legal and illegal intrusions into computer
    systems.


    In the early days of the Internet, the hackers from both groups (legal and illegal)
    needed to understand programming to conduct the hacks. Compared with offline typologies,
    a hack is different from random violence or a simple form of vandalism. Hacking
    is a calculated and very precise incision into computer systems, programme, or
    networks. This practice was codified into the unofficial hacker commandments stating
    that “thou shalt not destroy” (Gunkel, 2018, pp. 6–7). Although these hackers
    were deeply involved in exploring computer systems and networks, they argued that
    they did it to learn, discover, and freely share their findings with a broader
    audience. Damaging computer systems and networks were considered unethical and
    incompetent (Yar & Steinmetz, 2019, p. 53). The hacker commandment demonstrates
    the key element of hacking associated with the pride of those with superior computer
    skills. The hackers did not aim to do anything unauthorised to damage or destroy.
    In the early days of computing, hacking merely described someone skilled in developing
    creative, sophisticated, and practical solutions to computer problems (Gillespie,
    2019, p. 28; Kirwan & Power, 2013, p. 53; Yar & Steinmetz, 2019, p. 53).


    # WHITE, GREY, AND BLACK HAT HACKERS


    The time has changed, and hacking is no longer seen as something ethical. Instead,
    the term ‘hackers’ is overshadowed by the notion of illegal activities. Hackers
    use all available means and methods to access, steal, damage, destroy, or circulate
    information. Hackers are divided into three different overall categories. These
    are white hat hackers, grey hat hackers, and black hat hackers. Of course, those
    engaged with the early development of hacking did not call themselves criminals,
    crackers, computer intruders, computer trespassers, or something similar awkward.
    Instead, the word ‘hackers’ is widely accepted despite attempts to make this more
    detailed by introducing under-categories, such as newbies, scripts kiddies, hacker-taggers,
    microserfs, cyberterrorists, and hacktivists (Kirwan & Power, 2013, pp. 55–57).
    See Table 3.2.


    In a simple explanation of a complex area, white hat hackers are traditionally
    ethical hackers or pen-testers commonly associated with hackers employed by companies
    or states to seek vulnerabilities in systems to make them more secure by filling
    the gaps. White hat hackers are using hacking techniques to test various security
    measures following ethics, processes, and practices established by the owner of
    the networks and systems (Gillespie, 2019, p. 29; Kirwan & Power, 2013, p. 54;
    Poppy, 2019). The white hat hackers’ practices are predominately linked to cybersecurity
    and building up resilience,'
  merge: -1
  img_proc: true
