    # Limitations


    This book only included a selection of states, actors, and attacks as the number
    of attacks launched cannot be included. It is not possible to analyse all state
    and non-state actors engaged in politically motivated attacks. Therefore, some
    need to be excluded. The selection process is based on the dominance of actors,
    attributions, and media coverage these attacks have received, predominantly in
    2020 and 2021. The selection process has been conducted objectively based on media
    attention, attack attribution, and targets. Therefore, the selection does not
    represent the author’s own opinion.


    Most of the events included in this book have been unfolding during the research
    period, making this book topical. However, this has led to a limitation in the
    use of academic books and journal articles. Nevertheless, updated information
    about legislations, policy papers, reports, and online material from key institutions
    are included. The cases studies are being supported by mass media reporting of
    significant cyber attacks. Yet, the sources are being subjected to a credibility
    selection process. The media websites used are well-established news outlets,
    computing news magazines used within the tech industry, and blogs written by experts
    in this field. The information from these sources have been double checked to
    ensure the validity of the information.


