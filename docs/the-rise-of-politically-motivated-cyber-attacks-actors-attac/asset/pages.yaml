  md: '# Conclusion


    With a constantly changing threat landscape, the response needs to follow the
    exact directions. Therefore, it is essential to assess the risks and develop a
    response accordingly. There is no linear solution to the issues as numerous actors
    are involved in various cooperations. Cybersecurity and anticipatory governance
    are currently implemented in a complex nodal system with multiple actors, various
    strategies, and dynamics, which must be flexible to adhere to the constantly changing
    risks. The flexibility enables the actors to adjust to the constantly changing
    technological environment and various types of ecosystems. The strategic positions
    and cost impositions are essential to consider when developing proactive and reactive
    responses. Numerous cybersecurity strategies have been developed, and the different
    states or cooperations have different perspectives. However, one of the most significant
    issues is the lack of an international framework for dealing with the attacks.


