    # Attacks on CI: The Colonial Pipeline and JBS


    In 2003, the US DHS Director, Ridge, argued that for causing significant damage,
    the terrorist no longer needed bombs or explosives to damage the financial sector
    or take down a power grid. Instead, they can use computer technologies and interconnected
    networks to carry out the atrocities (Weimann, 2004, p. 3). The ransomware attacks
    have a dangerous impact. On national levels, there are a large number of different
    systems supporting CIs. Systems are interlinked, and there is a high level of
    cyber dependencies. However, for a conventional terrorist to cause terror, archive
    strategic goals, or have a notable effect, the attackers need to launch multiple
    attacks over a long period. Traditional terrorist groups would have to attack
    multiple targets simultaneously for a long time to create terror, archive the
    strategic goals, or have a noticeable effect (Lewis, 2002). However, the ransomware
    attacks are different; one attack can cause a long-term effect for several people
