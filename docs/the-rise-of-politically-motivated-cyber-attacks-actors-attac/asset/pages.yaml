    # CYBER UNITS


    The Russian Military Intelligence Unit, GRU, is presumed to be the mastermind
    behind many cyber attacks targeting political institutions, businesses, media,
    and sport. Predominately, the unit is using state-sponsored actors to carry out
    the online attacks. The Main Directorate of the General Staff of the Armed Forces
    of the Russian Federation (abbreviated GU) has replaced the Main Intelligence
    Directorate. Although the name has changed, this unit is still known by its previous
    abbreviation GRU (Faulconbridge, 2018; Reuters, 2009; Hodge, 2020). The overall
    aim of the Main Directorate is to supply intelligence to the President and the
    Government as well as to ensure the state’s military, economic, and technological
    security. GRU is an aggressive and well-funded organisation with direct access
    to and support from President Putin. It is considered a principal Russian cyberagency,
    and it enjoyed the rights and freedoms linked to the support given by state authorities
    (Faulconbridge, 2018). President Putin has publicly called this unit legendary
    and praised the officers’ patriotism (Hodge, 2020).'
