    # Attacks on Healthcare Services and Research


    Hospitals and other medical centres have been a popular target among ransomware
    groups: the attacks on these facilities generated fear and uncertainty. Alone,
    in 2020, the attacks have cost millions of dollars in ransomware and the public
    from delay in treatment and potential loss of life (Ransomware Task Force, 2021).
    There are numerous entry points into healthcare networks, making it attractive
    for threat actors to access hospital computers and networks, deliver payload malware,
    and steal data (Branch et al., 2019). During the pandemic, these groups targeted
    vulnerable institutions and threatened patient care and safety using a similar
    tactic to conventional terrorists. Moreover, the ransomware groups took advantage
    of the global situations and the fear in society to intimidate and coerce for
    economic gain (Hathaway, 2021). At the beginning of the COVID-19 pandemic, the
    Maze ransomware group released a statement on their website claiming that they
    would not attack healthcare organisations during the pandemic. This was a part
    of the group’s misinformation campaign linked to their activities. The group had
    already attacked an urgent care centre in Texas and released stolen patient data
    when the ransom demand was refused. The selected examples in Table 6.6 show the
    impact ransomware has on the victim and the wider society.


    Attacking healthcare services and facilities have been a significant target during
    the COVID-19 pandemic, which increased the dangers for citizens. The attacks are
    not only directed towards US services, but they had launched globally. The increase
    of medical technology and the need to access information online to provide critical
    care, make appointments, and run the facilities have increased the risks (Branch
    et al., 2019).


    Stealing data or disrupting the use of facilities falls under the scope of terrorism.
    Stealing data might be dangerous, but it depends on the data type (Patel, 2021,
    p. 32). However, the threat of double or triple-extortion can determine the victims’
    decision-making process when weighing up the cost and the consequences. The consequences
    severely affect the organisation’s ability to operate and access essential data
    to provide essential services. This can force the target to pay the ransom against
    advice from law enforcement'
