    and patching vulnerabilities. The grey hat hackers are slightly different, and
    they are operating in a grey zone. The activities of the grey hat hackers are
    associated with the early hackers driven by a curiosity about what they can find
    and what they can access. However, these practices are still illegal and linked
    to unauthorised access to computer systems and networks (Gillespie, 2019, p. 29;
    Kirwan & Power, 2013, p. 54; Moore, 2011, p. 25). Finally, the black hat hackers
    intend to access systems and networks unauthorised to exploit information or software.
    Their activities are overly malicious hackers, with the primary goal to steal,
    destroy, or damage files, servers, or websites (Gillespie, 2019, p. 29; Moore,
    2011, p. 24).


    Hackers can, in some situations, be understood as information terrorism. The black
    hat hackers are feared for their powers to access computer systems undetected.
    In the sense of politically motivated hackers, the black hat hackers are using
    their powers against governmental bureaucracies and international capital and
    regimes. Whereas in other situations, the hackers are not aiming to destroy or
    amend existing systems, programmes, or networks. Instead, the'
  merge: -1
  img_proc: true
- pgno: 67
  md: 'hackers aim to beat the machine in an ongoing trial of human strengths vs computer
    technologies (Green, 2001, p. 177).


    # HACKING-FOR-HIRE (HFH)


    Not all politically motivated groups have the necessary skills for carrying out
    attacks, but there are ready-made solutions. Since the mid-1990s, many political
    actors have enabled their activities by using tools and techniques developed by
    hackers. The mobilisation of these means and methods has developed in different
    directions (Yar & Steinmetz, 2019). Groups and individual hackers are involved
    in political cyber attacks despite not being a part of the political grouping.
    These hackers operating from a purely financial motivation are spreading their
    services to also including politically motivated areas.


    HfH groups and individuals engage in these activities for personal or economic
    gain regardless of the customers'' motivation. For example, they are seeking profits
    by selling their hacking skills and software on the Dark Web. Europol (2020) raised
    concerns about current trends, such as crime-as-a-service (CaaS), influencing
    various attack types. Cybercriminals develop and use prolific malware as a commodity
    for others to use. Widespread collaboration between hackers enables them to share
    infrastructure, services, and compromised credentials (Europol, 2020). They might
    also profit from their botnets and DoS/DDoS attack services for hire against either
    state, corporations, or groups by leveraging their infrastructure to facilitate
    attack (Holt & Bossler, 2016; Holt et al., 2018, p. 385). HfH customises the hacking
    service to enable individual or group attacks based on a specified agreement between
    the service provider and the customer. This service type adds another layer to
    the actors and the practices developed to carry out politically motivated large-scale
    attacks (McNemar, 2020).


    The HfH group behind the Dark Basin campaign in 2017 pursued powerful actors who
    may not have sophisticated cybersecurity resources. The Dark Basin''s operations
    targeted thousands of individual groups and industries with links to the political
    environments. This form of custom-made attacks opens up for an increase in the
    numbers of political attacks conducted against political entities in all sectors
    of society spanning from politics, advocacy, and government to global commerce
    (Muncaster, 2020; Murphy & Shubber, 2020; Scott-Railton et al., 2020). Another
    group, Bahamut (2020), has been involved in numerous highly sophisticated attacks
    and disinformation campaigns against government officials, leading industry, non-governmental
    organisations (NGOs), and individuals. Despite the range of targets and attacks,
    a notable lack of discernible pattern or unifying motive indicates that the group
    is likely an HfH mercenary. The group operates above average and has shown exceptional
    attention to detail, and the hackers surveil their target over a long time (BlackBerry,
    2020; Coker, 2020; Palmer, 2020; Sheridan, 2020; Teiss, 2020).'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Politically Motivated Attacks


    A cyber attack in the traditional sense can be defined as “an assault launched
    by cybercriminals using one or more computers against a single or multiple computers
    or networks” (Check Point, 2020). A cyber attack is a malicious and unauthorised
    attempt to breach the information system of another individual or organisation
    with the intent of causing damage. Generally, the attacker aims to gain benefits
    from accessing the victim’s network. For example, to disable, disrupt, destroy
    computer systems, or alter, delete, manipulate, or steal the data (Check Point,
    2020; CISCO, 2021; Pratt, 2021). Although various attack tools are available to
    buy on the Dark Web, attacks against critical infrastructure (CI) require an understanding
    of the systems’ target, preparations, and reconnaissance to exploit new vulnerabilities
    in systems. It is believed that future attacks would be conducted by compromising
    the development and engineering phase of industrial systems to embed hidden vulnerabilities
    only known to them (Europol, 2019, p. 21).


    Cyberspace and the Internet provide online offenders with global resources for
    moving data and information around and finding safe havens for conducting cybercrimes
    and attacks. Communications are routed through multiple jurisdictions, and the
    online environment offers anonymity for the users. This signifies that the different
    cyber offences are challenging to prevent, detect, and investigate. It is increasingly
    easy to cover up an identity, take on a fake identity or hide behind VPNs or the
    Dark Web. Portability and transferability of devices and data make it difficult
    to trace the offenders as data can be stored on various portable devices, cloud
    storage, and the Internet (Clough, 2015, pp. 7–9; Gillespie, 2019, p. 13; Munk,
    2018). The politically motivated attackers are progressively targeting governmental
    entities, units, and businesses with close ties to the state or CIs. Although
    governmental targets are on the agenda, the impact of attacks against a wider
    group of targets demonstrates the vulnerabilities in contemporary societies. Financial
    institutions, businesses and corporations, cybersecurity companies and units,
    academic institutions, research labs, Internet service providers (ISPs), tech
    companies, and social media businesses all have a role to play to understand,
    analyse, and respond to the constant changing behaviours, technologies, and online
    trends and to help to secure various online platforms and computer technologies.


    According to Specops Software (2020), the US has been the target of substantial
    cyber attacks over the last 14 years compared with other countries (Brasseur,
    2020; Specops, 2020). The attacks conducted include attacks on government agencies,
    defence, and high-tech companies. The US has experienced 156 significant cyber
    attacks between May 2006 and June 2020. In the second place, the UK has 47 attacks
    included on this list. The Labour Party’s digital platform experience two DDoS
    attacks during the general election campaign in 2019 (Walker & Hern, 2019; Woodcock,
    2019). Third on the list is India, which has suffered 23 cyber attacks. Nine attacks
    recorded'
  merge: -1
  img_proc: true
- pgno: 69
  md: 'in 2020 were against human-rights activists where the malware logged the victims’
    keystrokes, recorded their audio, and stole personal credentials (Brasseur, 2020;
    CISI, 2020; Specops, 2020).


    Interestingly, the number of states attributed to these attacks is also in the
    top 20 most attacked countries (Brasseur, 2020). Both Iran and China have been
    targeted 15 times, Russia has been targeted 8 times, North Korea has suffered
    6 significant large-scale attacks (Brasseur, 2020; Specops, 2020). Australia had
    16 attacks during the period placing the country as number 6 on the list. Included
    is the 2020 attack, where sophisticated large-scale cyber attacks targeted government
    agencies and critical businesses and services (Specops, 2020; Taylor, 2020). On
    the other end of the top 20 list is North Korea. North Korea has only been targeted
    five times in contrast to neighbouring South Korea, which suffered from 18 major
    cyber attacks (Specops, 2020). The data from Secops show that no state is fully
    resilient towards attacks, and most counties worldwide are involved in attacking
    other counties (Brasseur, 2020; Specops, 2020).


    Attempts from politically motivated groups and individuals, state and non-state
    actors, penetrating networks for political, diplomatic, technological, commercial,
    and strategic advances are a growing concern. These groups are principally targeting
    governments, defence, finance, energy, and telecommunication sectors. The capacity
    and impact of these actors are varied where the most technologically advanced
    groups and individuals continue to update their capabilities and methods using
    encryption and anonymised services to remain covert. State, state-sponsored, and
    state-supported actors hold the highest level of sophistication in their use of
    technologies and attack routes. Other non-state actors do not have the same abilities
    to reach a political end. However, they can archive similar impacts using the
    necessary tools and techniques because of the low level of cybersecurity imposed
    by the targets (HM Government, 2016, p 18).


    # Essential Cyber Attacks


    Historically, large-scale attacks using destructive malware mainly were associated
    with attacks against states and state-owned CIs. Different means and methods are
    used to carry out attacks, from stealing and leaking information to malware to
    DDoS attacks against different CIs. In 2007, the head of Britain’s Security Service
    (MI5), Evans, warned that an increasing number of online threats originated from
    Russian and China. Evan claimed that:


    > A number of countries continue to devote considerable time and energy trying
    to steal our sensitive technology on civilian and military projects, and trying
    to obtain political and economic intelligence at our expense. They ... increasingly
    deploy sophisticated technical attacks, using the Internet to penetrate computer
    networks.

    > (CISI, 2020; Fidler & Palmer, 2007; Grant, 2007)'
