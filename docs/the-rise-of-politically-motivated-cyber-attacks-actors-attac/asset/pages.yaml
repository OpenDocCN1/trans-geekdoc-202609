- pgno: 138
  md: '# Russia


    Russia has developed a Cold War mentality believing in hostile ideologies and
    actors surrounding its territory. The tactic is more aggressive about following
    the state’s foreign politics, military strategic, and current events, influencing
    how it is perceived internally and externally. This indicates that Russia is less
    likely to restrain its strategies or operations online or offline (Manjikian,
    2021, p. 291). Russia uses cyberspace as an asymmetric means to engage with Western
    states that dominate other sectors, such as economic and military. In contrast
    to China, Russia deliberately utilises cyberoperations to project its powers by
    creating chaos and uncertainties (Puyvelde & Brantly, 2019, p. 83). Yet, Russia
    shares the aspiration with China about becoming a dominant world power online
    and offline. This aspiration is the drive along with protecting the state’s interests
    and reputation.


    The state has a slightly imprecise definition of information warfare and information
    security. Russia does generally not refer to this as cyber or cyberwarfare. Instead,
    the state, similar to China, is using ‘information’ when conceptualising online
    operations. This means that their activities cover a far-reaching spectrum of
    information warfare (informatsionnaya voyna) (Connell & Vogler, 2016, p. 2; Lilly
    & Cheravitch, 2020, p. 3). Nevertheless, information security is a component of
    information warfare covering two areas: the technical and psychological or cognitive
    elements. These two areas cover a large mixture of different technical tools and
    systems to conduct attacks, as well as a strategy of cognitively influencing populations
    and decision-makers of the conflicting state to erode their willingness to fight
    and their decision-making structures and processes (Lilly & Cheravitch, 2020,
    pp. 133–134; Connell & Vogler, 2016, p. 3).


    Russia’s cyberoperations are not conducted in a strategic vacuum. The operations
    are enabled by broader geopolitical considerations with close links to the military’s
    institutional culture, intelligence, and political leadership, build on evolution
    from the immediate post-Soviet period to the contemporary leadership. Russia is
    engaged in an evolving asymmetric interstate competition conducted just below
    the threshold for an all-out conflict (Lilly & Cheravitch, 2020, p. 130). It is
    recognised that the state has been involved in cyber attacks for more than 20
    years. During that time, Russia’s military and political leadership have fundamentally
    changed its concept of warfare and incorporated cyberoperations in the strategies
    (Westby, 2020; Lilly & Cheravitch, 2020, p. 129). According to the Military Doctrine
    of the Russian Federation (2010), an essential feature in modern warfare is the
    early implementation of information warfare measures to archive political objectives
    without mobilising military force. As a result, Information warfare becomes a
    legitimate tool in peace and war (Connell & Vogler, 2016, p. 6).


    Russian is primarily using state-sponsored and state-supported groups (organised
    cybercrime groups). These groups’ activities feed into the overall'
