    # Responding to the Attacks: DarkSide and REvil


    # DARKSIDE


    The Darkside RaaS group attempted to distance themselves from the Colonial Pipeline
    attack, arguing that their goal was to make money, not creating societal problems
    (Palmer, 2021a). The DarkSide stated: “We are apolitical, we do not participate
    in geopolitics, do not need to tie us with a defined government and look for other
    our motives [sic]” (KrebsOnSecurity, 2021; Bostrup, 2021). The actors claimed
    that they now have established a check on their partners to avoid similar disturbances.
    This step back was caused by the widespread attention and the pressure caused
    by this attack. The harsh reaction to the attack from the US might have an impact
    on its future attack routes. Moreover, the reaction should also be considered
    in line with the JBS attack that triggered the link between ransomware groups,
    national security threats, and terrorism. It is not the first time this group
    has tried to make a PR spin regarding their activities. In a modern Robin Hood
    style, they claim to take from the rich and give something back to the poor. In
    2020, the group announced on its public blog that they would donate parts of the
    ransom income to the non-profit organisations: Child International and The Water
    Profit (Otto, 2021; Vaas, 2021). After the Colonial Pipeline attack, the pressure
    on the DarkSide group increased, and they uploaded a message to their affiliates
    stating that an unnamed law enforcement agency has disrupted a large part of its
    public infrastructure. Shortly after this public statement, DarkSide’s name-and-shame
    blog, ransom collection site, and breach data delivery network were seized, and
    their cryptocurrency wallet funds were removed (Affi-Sabet, 2021; Vaas, 2021).


    Yet, this attack has shaken the ransomware community and it has been described
    as a mistake that transformed a lucrative but overlooked area to become subjected
    to intensive governmental scrutiny and policy change labeling the activities as
    national security threats. The administrators for a widely used Russian cybercrime
    forum, XSS, suddenly banned all ransomware advertising and activities on its platform,
    including promoting services and discussions (Affi-Sabet, 2021; DataBreaches.net,
    2021). The ransomware Babuk has also ceased its operation, handing over its ransomware
    source code to a new team (Affi-Sabet, 2021). This might be an immediate but temporary
    retreat due to the negative attention. However, most operators are operating'
