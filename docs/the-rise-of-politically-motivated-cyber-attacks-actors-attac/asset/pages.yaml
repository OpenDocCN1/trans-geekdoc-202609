    et al., 2020; Munk, 2015). Even with constantly ongoing online conflicts, the
    response should not be solely linked to deterrence or defence. States should be
    prepared to use diplomacy and communicate to prevent an escalation of operational
    conflicts. It is essential to consider various types of proactive and reactive
    responses on multiple levels. If states are not prepared to engage in this and
    accept restrictions on their own capabilities and capacities, they cannot expect
    other states will limit their attack strategies (Kolbe, 2020).


    With the laws of war, most states agree on some common principles to create order
    in cyberspace. If these were not generally followed, the issues would be much
    worse than seen at this stage. However, it is time to address the complexity of
    managing politically motivated attacks that constantly develop new technological
    innovations, capabilities, and capacities. Although it is generally acknowledged
    that cyber attacks on CIs are not legitimate weapons of attack – nor are they
    acceptable during kinetic wars where the analogy is made to biological and chemical
    weapons – they are still the primary target (Barletta et al., 2011, p. 81).


    Although many of the SolarWind targets are state institutions or military entities,
    the majority are not. Therefore, there is a violation of the use of force in an
    armed conflict and the principle of distinction. The use of state-sponsored actors
    to attack might be a strategic move by state actors to circumvent international
    law. However, the same move also impacts the state-sponsored actors as they are
    removed from the protection provided to military combatants in armed conflict.
    Thereby, these state-sponsored actors can be prosecuted under national law in
    the victim state (Hathaway et al., 2012, p. 854).


    # Cyber Defence


    # PERSISTENT ENGAGEMENT AND DEFEND FORWARD


    The US has developed its strategy from persistent engagement to defend forward.
    The argument is that persistent engagement is a strategic prescription based on
    an analysis of adversaries'' behaviour in cyberspace. However, the continuous
    attacks have become normalised, and therefore, a new strategic position is needed.
    A defend forward concept is considered a useful replacement for persistent engagement
    as part of layered cyber deterrence (US DoD,'
  merge: -1
  img_proc: true
- pgno: 153
  md: '2018b). The argument is that the US, for too long, has been held back in this
    defensive strategy. In contrast, cyber-capable nations have escalated their actions
    worldwide, which not only have had a significant impact on the targets, but these
    actions have undermined the US as a cyberpower (Devanny, 2021, p. 6).


    The concept of ‘defend forward’ includes several proactive measures, such as anticipatory
    processes and practices to observing, pursuing, and countering adversaries’ operations.
    The strategic position should be included imposing costs in the day-to-day competition
    to disrupt and defeat the constant malicious cyber campaigns, deter future campaigns,
    and reinforce favourable international norms of behaviour by using all national
    instruments available (Borghard, 2020b; Valeriano, 2020). Yet, this strategy cannot
    stand alone. It needs to be linked to costs and diplomacy, and internationally
    developed norms and behaviours in cyberspace. There should also be a requirement
    for more engagement by private actors to enhance cybersecurity.


    # US’ DEFEND FORWARD


    The US has used the defend forward strategy in responding to the attacks originating
    from Russia. However, it is difficult to see how successful this strategy is as
    the frequency of attacks is escalating and society’s impact becomes more prominent.
    The current stance by Western states offers little incitement to change the balance
    between cost–benefit calculations. Moreover, this tactic did not impact the tactical
    or operational level, as Russian actors conducted a large-scale supply-chain exploit
    in 2020. The SolarWind attack is considered a prominent cyber attack targeting
    various public and private entities, not only in the US but worldwide (Jensen
    et al., 2020). However, the SolarWinds attack in 2020 has shown that the US approach
    is somehow ineffective as large-scale cyber attacks continue to emerge (Schneier,
    2020)


    Under customary law of countermeasures, an attacking state that violates its obligations
    not to intervene in another sovereign state can be met with lawful countermeasures
    from the victim state. That customary law also applies to harmful cyber attacks,
    and the countermeasures might go beyond passive defence. However, the active defence
    still needs to meet the requirements of necessity and proportionality (Hathaway
    et al., 2012, p. 858; Kramer & Rodihan, 2020). The defend forward strategy was
    used to stop the Russian Internet Research Agency’s activities concerning the
    2018 US midway election and the period before the US Presidential election in
    2020.


    According to USCYBERCOM, Russia used the 2018 mid-term election as a ‘warm-up’
    for the 2020 US Presidential Election. To secure these elections, USCYBERCOM worked
    closely with the defence teams from the Department of Homeland Security (DHS),
    the FBI, and industry sectors with knowledge about previous Russian hacker attacks
    (The Washington Post, 2019). The new powers included in the defend forward strategy
    allowed USCYBERCOM and the NSA to conduct attacks on adversaries’ territorial
    space. In 2018, US'
