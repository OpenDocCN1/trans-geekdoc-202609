    # Means and Methods: Deterrence and Defence


    The new groups of politically motivated actors differ from the 2010s hacktivist
    groups. They are less engaged with launching DDoS attacks to disrupt and destroy
    computer networks and systems. To a large extent, they operate in a grey zone
    using available public data, find the information in politically available open
    source, and then exploit the information. Groups like APT-69420 Arson Cats have
    carved out their route to conduct politically motivated attacks within this regulatory
    lacuna. The Gen Z/K-pop stans are slightly different. These groups explore legal
    routes for political activism, where some mirror DDoS attacks but are launched
    differently. Law enforcement keeps a close eye on these new groups, and there
    is already one case underway against Koffmann from APT-69420 Arson Cats. The Federal
    Bureau of Investigation (FBI) also has DDoSecrets under observation after they
    published BlueLeaks with information from Anonymous. Law enforcement has been
    targeted by'
  merge: -1
  img_proc: true
- pgno: 235
  md: 'all these groups, and so have other governmental and political entities, private
    corporations, and individuals.


    # Attacks against Public and Private Entities: New and Old Methods


    In most political activities in the US and other Western states, politically motivated
    groups have the power to be a force for change and disrupt through their peaceful
    actions. A coalition of online protesters used the hashtag #Resistance on Twitter
    to confront US President Trump on his favourite social media site. However, they
    have had very little success until the stans got involved and promoted the hashtag
    to the group. The message was circulated widely, triggering the groups’ sense
    of activism (Ohlheiser, 2020a). This was a popular way to make a political stance,
    and it is for the social media sites to regulate behaviour on their platforms.
    The social media site has made changes for political actors online by blocking
    content and close down accounts. Several US Republicans moved to Parler, a right-wing
    social media platform after US President Trump was permanently banned from Twitter
    in 2021. Trump was banned for his potential to incite following the US Capitol
    Hill insurrection on the 6th of January (Dzhanova, 2021; Pardes, 2020). However,
    the tech companies, Google, Apple, and Amazon, collectively showed their regulatory
    powers by withdrawing the platforms hosting web services for Parler forcing the
    site to close its business (Newhouse, 2021).


    # THE TUSLA EVENT


    The online environment and the interconnectivity have been instrumental in several
    political actions combining the online and offline environments. Gen Z/K-pop stans
    joined forces to show their unhappiness with US President Trump during the 2020
    election campaign. The young online users explored a legal way to hijack the Tulsa
    political election rally and publicly humiliate the President (Bedingfield, 2020;
    Herrmann, 2020). The planned action gained momentum online within the groups,
    and a substantial amount of people reserved tickets for the Tulsa event without
    intentions of attending (Bedingfield, 2020; Ohlheiser, 2020b). The action was
    successful for the Gen Z/K-pop groups as they unexpectedly exposed the weaknesses
    in the campaign ticket system. Before the event, the Trump campaign expected a
    crowd size of approximate 1 million participants based on the reservations and
    data collected online about the event. On the day, only 6,200 people attended
    the event in a half-empty arena, to a huge surprise to the organisers (Lorenz
    et al., 2020; Porter, 2020).


    The TikTok platform was instrumental in the false registration drive, leading
    to empty seats in the stadium and outside the arena. The way the Gen Z/K-pop stans
    engineered the moment was widely celebrated (Herrmann, 2020; Lorenz et al., 2020;
    Ohlheiser, 2020b). Although the Gen Z/K-pop stans members did not have an electoral
    ability to make a difference, they still had'
  merge: -1
  img_proc: true
- pgno: 236
  md: 'a voice, and they demonstrated that they had strength in the numbers (Hoise,
    2020; Lorenz et al., 2020). There is nothing in this action by the Gen Z/K-pop
    stans that are illegal. The groups exploited a clear security gap in how the event
    was organised. Reserving tickets for free is a service provided by several event
    organisers. Nevertheless, the Tulsa event was instrumental in creating the myth
    of these young people becoming politically radicalised. Other young people joined
    the #Resistance afterwards to form a powerful coalition of political actors (Ohlheiser,
    2020b).


    # PERCEPTION OF ACTIONS


    The actions of the Gen Z/K-pop stans are seen as the liberal''s choice of actions
    similar to the 4chan hacktivist groups were to older generations. They are an
    army of anonymous Internet warriors, which a majority of people like to praise
    but do not really understand. The groups follow a personal agenda and do not align
    with conventional politics (Ohlheiser, 2020b). Although Gen Z/K-pop stans’ activities
    archived media attention similar to the established hacktivists got in their prime
    time, they are still perceived as a joyful group of pranksters having fun rather
    than a political force with impact. These young online users archived this outcome
    by exercising their rights to express themselves through association and assembly.
    They are likely to continue this form of protest (The UN, 1966). The owners of
    these online platforms can regulate their use if they want to limit the actions.
    The monopoly of tech companies and social media businesses has regulatory powers
    to control their platforms. However, the same companies are driven by data extraction
    and behavioural modifications, which balances conduct against revenue generated
    by the use (Fernandez, 2021; Zuboff, 2019). Therefore, it is unlikely they will
    change terms and conditions to regulate the large group of young and active online
    users when their actions are not illegal.


    # Attacking CI Services: Anonymous, and Gen Z/K-pop


    Both Anonymous and Gen Z/K-pop have been active in supporting the BLM movement.
    Anonymous uses their usual tactic, whereas Gen Z/K-pop has exposed new innovative
    ways to bring down webpages, but they operate within an uncontested grey zone
    within the law. Protecting computing infrastructure is a policy priority for actors
    worldwide. CIs such as banking, energy, transportation, and manufacturing rely
    on interconnected computers that have been vulnerable to exploitation online.
    These entities operate essential services, and companies and citizens trust their
    data to distant servers in return for more convenient and reliable services (Lindsay
    & Gartzke, 2016, p. 1). The latest attacks from state and non-state actors have
    shown substantial gaps in cybersecurity. However, it is concerning that hacktivists
    using low-sophisticated tools are still able to attack without much effort. In
    2010, Anonymous launched one of its most well-known actions, #OpPayback, to'
  merge: -1
  img_proc: true
- pgno: 237
  md: 'revenge PayPal and other companies for suspending payments and server access
    to WikiLeaks following the publication of classified US documents (Brooking, 2015).
    The group also has a history of targeting various US federal and state government
    entities, such as the CIA and the US Senate. Anonymous was behind the Arizona
    Department of Public Safety in 2011 (Kelly, 2021, p. 1681). A decade later, the
    group can launch severe attacks against essential services and obtain and exploit
    data, showing that there are still issues with the level of cybersecurity.


    # ANONYMOUS


    In 2020, group members actively supported the BLM protests after the police killing
    of George Floyd (Griffin, 2020; Rosenblatt, 2020a). Tweets and Facebook posts
    by the hacktivist collectively received millions of supports from new followers.
    The group indicated it aims to expose the many crimes of police forces worldwide
    (Griffin, 2020; Mehrotra & Taraby, 2020; Molloy & Tidy, 2020). Hacktivists, leaktivists,
    and public disclosure organisations have been highlighted in the US counter-intelligence
    strategy 2020–2022 as constituting significant threats (AFP, 2020; Menn, 2021;
    The White House, 2020, p. 2). With this enhanced strategic focus, together with
    the very public statements from Anonymous about future actions, CI and ICTs providers
    and operators should see it as a warning to ensure that their cybersecurity is
    updated and system gaps are patched. Police forces should be particularly concerned
    as the group has previously targeted them.


    After the killing of Floyd, Anonymous threatened to expose crimes within the department.
    The group launched a DDoS attack against the Minneapolis Police Department, which
    temporarily brought down the website. However, this is not a particularly new
    and sophisticated attack form. It would have been possible to prevent the attacks
    if the police forces had enough cybersecurity enacted (Ropek, 2020; Vaas, 2020).
    For example, Anonymous attacked in 2020 the Atlanta Police Department in retaliation
    for killing a black man, Brooks. The cyber attack was embarrassing for the City
    of Atlanta, which had invested hugely in cybersecurity after a ransomware attack
    in 2018. Still, the police were unable to detect and prevent such an attack (Vaas,
    2020). Law enforcement and other government agencies who provide essential services
    to the public should have a high level of cyber-resilience, especially as several
    police forces have been subjected to attacks in the past.


    Anonymous is still operating illegally and using the same old means and methods
    compared with the new groups. This makes it challenging for the group to claim
    that their actions should be seen as legitimate, similar to peaceful offline protests.
    The hacktivists often considering themselves as virtual vigilantes working for
    a cause beyond the individual’s self-interest. Despite their noble intentions
    and aims to improve equality, justice, or human rights, they still act illegally
    (Crowdstrike, 2021). Yet, the only issue with these attacks is not their legality
    but how to prevent the attack. Very little attention'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'is given to resilience and preparedness. The legal framework deals with attribution
    and prosecution of the attacks afterwards. However, the impacts on victims and
    a wider group of citizens that cannot access services should be included in the
    preventive strategies to enhance resilience. Most of the challenge is that the
    national cybersecurity framework relies on the actors to invest sufficient cybersecurity
    measures to decrease the threats. Only a limited number of private CIs are required
    to implement a particular cybersecurity level (Chung, 2018, p. 449).


    # GEN Z/K-POP STANS


    Political actions by Gen Z/K-pop stans have highlighted that it is not only the
    illegal methods that can bring down a webpage; a joint action can have the same
    effect to halt public services (Alexander, 2020). Like Anonymous, the groups were
    supportive of the mass protests in response to police brutality in the wake of
    Floyd’s death. These protests resulted in mass arrest and violence against protesters
    and press members (Alexander, 2020). In June, the K-pop stans took down the Dallas
    Police Department’s app by overloading it with fancams, short clips of Korean
    K-pop groups, or idols performing live (Bedingfield, 2020).


    The groups reacted to a tweet by the Dallas Police Department asking people to
    send videos of “illegal activity from the protests’ to a special app called iWatch
    Dallas during the protests. The K-fans took up this request and downloaded the
    app (Alexander, 2020; Lorenz et al., 2020; Ohlheiser, 2020a). Instead of using
    the illegal tactic similar to group Anonymous and other hacktivist groups, the
    fanbases stayed within the law, albeit bending it in an innovative way (Ohlheiser,
    2020a). The group uploaded a constant and overwhelming flow of short fan-produced
    videos, bringing the system down similarly to DDoS attacks (Alexander, 2020; Lorenz
    et al., 2020). Additionally, numerous one-star reviews appeared on the app’s pages
    on Google Play and Apple’s App store marketplace with text including #BLM (Black
    Lives Matter) and #ACAB (All Cops Are Bastards). Later, the Dallas Police Department
    announced that the app was offline (Alexander, 2020; Ohlheiser, 2020a). When the
    app was down, the K-pop fanbase responded to the messages by uploading a mix of
    clips from K-pop groups performances, games like Animal Crossing, anime GIFs,
    and other pop culture references to celebrate their success (Alexander, 2020).
    However, it was not only the Dallas Police Department who experienced this form
    of activism. Similar activities were launched against a portal set up by a Michigan
    Police Department, where witnesses could upload pictures or videos of protests.
    Similarly, Kirkland, a Washington Police Department, requested footage of a local
    demonstration, but their apps were flooded and clogged by K-pop fans (Andrews,
    2020).


    Although the actions are not prohibited, the actions mirror the illegal use of
    DoS and DDoS attacks. These means and methods will likely be deployed in the future
    in a larger context to avoid prosecution. However, to have any'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'effect, there needs to be a substantial number of people involved at the same
    time. The stans have gained a new and appreciative online audience for their online
    activism. Other online users praised the K-pop stans for their engagement in political
    and social causes by pushing for justice beyond their relentless promotion of
    groups like BTS, Blackpink, or EXO (Ohlheiser, 2020a). By looking at actions like
    this, it is possible to draw similarities between the K-pop stans and more established
    hacktivist groups like Anonymous. However, the main differences are the illegal
    vs legal discourse (Ohlheiser, 2020a). From the security perspective, the new
    groups are more unpredictable than the old types of activist groups. The actions
    highlight the need for proactive measures so that public and private services
    are less vulnerable to disruptions. Yet, it leads to the question about when Human
    Rights protect actions and when they are not.


    # Strategies and the Game


    There are two groups of actors; the public and private actors on one side and
    the protesters on the other. Both groups need to weigh up costs and benefits and
    change the other side’s strategic position. The key factor influencing the protesters
    to take action is the probability of success (Buenrostro et al., 2007). For example,
    the protester might successfully promote their cause and gain support for social
    and political change. However, they bear the risk of not being successful. Instead,
    they might get a negative payoff from costs imposed by the opposition. For example,
    if they hack into systems or launch DDoS attacks, they might be prosecuted. They
    might also face costs from other actors. ISPs, tech companies, and businesses
    provide the protesters with resources to facilitate collective actions, i.e. access
    to the Internet, social media sites, communication platforms, etc. (Stockemer,
    2012, pp. 210–211). Finally, there might be costs in cybersecurity where it becomes
    challenging to breach the systems due to a lack of skills or time. As a reaction,
    the protesters might substitute costly activities with lower-cost actions to attain
    the desired goal (Patil et al., 2018; Pierskalla, 2010, p. 121; TrapX, 2020).
    Some online activists have decided to fulfil their goals using less intrusive
    means, but when a large group collaborates, it has the same effect, i.e. the Gen
    Z/K-pop stans. These methods might not have the same effect, but they still gain
    attention, and they also manage to bring down webpages in a similar way to DDoS
    attacks.


    The cost–benefit balance would change by enhancing cybersecurity, and it would
    be more difficult for hacktivists to gain a positive payoff. The key is to make
    it more difficult to attack the different entities. Cybersecurity is not only
    about updating computer systems and network security. However, it is also about
    enhancing training, processes, and practices to work online and protect data,
    access credentials, and passwords. As long as it is relatively easy to conduct
    these attacks and gain access to systems and information, the activist will continue
    to do so. Cybersecurity is complicated as computer technology changes and the
    attackers change tactics. However, most of these attacks are'
  merge: -1
  img_proc: true
- pgno: 240
  md: 'not sophisticated, and most of them could be prevented with updated security
    measures. Deterrence and successful protest are decided by the cost–benefit calculation
    of winning an open conflict, the cost of repression, and the cost of escalation
    (Pierskalla, 2010, p. 125). The costs are linked to a failure of the attack (deterrence
    by denial) or retaliation (deterrence by punishment). The essential operation
    of deterrence is the communication by the defender where the opponent’s attacks
    are made more costly than the benefits it produces (Vogeley, 1993, p. 30).


    # Cybersecurity and Deterrence


    The majority of online attacks are conducted on the lower end of the spectrum.
    These attacks are less likely to have a significant effect that can cause physical
    damage to the population. Therefore, it is not a surprise that comprehensive public
    and private strategies are missing. It seems like states are more focusing on
    preventing the state-sponsored/supported attacks and have overlooked this area.
    With state and state-sponsored/state-supported actors, some governmental actors
    cooperate and develop adequate responses, including raising the security level,
    knowledge exchange, minor sanctions, name and shame tactics, which have not prevented
    the attacks from developing (Lindsay, 2015). When it comes to hacktivism, it is
    less likely that the states will cooperate and develop common strategies, and
    it is left to national strategies and actors to manage the area.


    The hacktivists'' success is not necessarily linked to their skills, but more
    of their ability to finding vulnerabilities in weak applications, webpages, and
    servers with inadequate security (Mansfield-Devine, 2011). It is a challenge for
    organisations to defend themselves from hacktivist attacks. The threats are multifold,
    spanning from simple non-sophisticated attacks to well-executed large-scale attacks
    on multiple levels. Managing the threats is complex and requires protection from
    internal and external sources (Caldwell, 2015). As a part of developing national
    cybersecurity strategies, the states have included their cybersecurity resources
    to enhance their cyber capabilities, such as information sharing, cybersecurity
    standardisation, and risks management plans. There is no requirement for private
    entities to do the same, and systematic guidance is not provided to the private
    sector to ensure that they can withhold attacks (Siboni & Sivan-Sevilla, 2018).
    A multilayered approach is covering different levels of complex infrastructure
    and at the same time applying multiple different protective layers. However, it
    is also a continual process involving monitoring, threat detection, training,
    etc., to detect vulnerabilities and eliminate malicious activities (Impact, 2020;
    Jett, 2021). This includes the physical boundaries, network firewalls, and intrusion
    detection systems. It also includes the different bureaucratic procedures to constantly
    keep software patches and antivirus definitions updated, educate users about operational
    security, monitor network activity, investigate suspicious activities,'
  merge: -1
  img_proc: true
- pgno: 241
  md: 'coordinate with cybersecurity actors, and law enforcement before and after
    an attack (Lindsay & Gartzke, 2016).


    # INCLUDING COST-IMPOSITIONS


    To increase cybersecurity, organisations need to factor in the integrity and resilience
    of the related businesses and social processes into the constant development of
    complex technologies. It is not enough to see cybersecurity as purely a matter
    of protecting the systems and networks (WeForum, 2020). As long as it is relatively
    easy to conduct these attacks and gain access to systems and information, the
    activist will continue to do so. Better security practices would have prevented
    APT-69420 Arson Cats and Kottmann from finding log-in credentials to Verkada’s
    super admin account online (Vincent, 2021a, 2021b).


    # UNDERINVESTMENT IN CYBERSECURITY


    For years public and private entities have underinvested in cybersecurity, processes,
    and practices to protect vital assets. The vulnerabilities to these actors digital
    technologies create risks to CIs, business continuity, intellectual property,
    trade, and consumer secrets and privacy (Siboni & Sivan-Sevilla, 2018). Underinvesting
    does not mean they are not investing at all. They just do not invest enough to
    manage the actual threats proactively. Most organisations invest based on a cost–benefit
    analysis by quantifying the benefits associated with their potential investment
    opportunities (Gordon et al., 2014, p. 80). However, various organisations tend
    to take a somewhat reactive approach to significant cybersecurity investments
    deferring investments unless they need to react to an incident (Gordon et al.,
    2015). Security strategies should incorporate computer technologies, management,
    budgets risks assessments, etc., encompassing the whole organisational structure
    from managers to employees within all aspects of the CI structure (Mansfield-Devine,
    2011). These plans could enable public and private entities to become more robust
    and consider cybersecurity in all steps they take. It concerns how hacktivists
    managed to DDoS and access data from law enforcement and police forces worldwide
    during the second wave of attacks. A decade later, they are still vulnerable to
    attacks.


    No business or governmental agencies are immune from attacks; over the years,
    hacktivism has grown from being a nuisance to pose a significant threat. Hacktivism
    has exposed the fragile digital systems and infrastructure that underpins most
    public and private entities (Bradford, 2014; Vamosi, 2011). A DDoS attack, for
    example, interferes with an organisation’s online operations during the attack.
    However, they often have long-term consequences, such as a monetary impact. Some
    online users or customers might permanently change to a competing service provided
    that has a more reliable online service. Revenue loss is one side effect, reputational
    damage is another. The latter might prevent the actors from getting an opportunity
    to'
