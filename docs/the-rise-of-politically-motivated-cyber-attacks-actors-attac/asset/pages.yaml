  md: '# 8 Conclusion


    # Introduction


    Society’s dependencies on computer technologies, systems, and communication platforms
    have exposed significant vulnerabilities by politically motivated actors. These
    attacks have increased their scope and reach with severe consequences. The book
    has demonstrated a rise in cyber attacks against CI, and these attacks are linked
    to obtaining information, disturbing data traffic, or destroying vital assets.
    The attacks have significant political, economic, and societal implications, short
    term as well as long term. The analysis of current attacks has revealed definitional,
    legal, and strategical issues with the responses to the problems. The book chapters
    have focused on three main areas, motivation, actors, and means and methods used.
    Having analysed these areas, it is clear that issues need urgent attention to
    enhance the cybersecurity level to withstand these attacks and change the strategic
    payoff.


    # Concluding Remarks


    The book highlighted problems in two overarching areas. First, the politically
    motivated attacks are escalating, and different types of groups are becoming more
    involved in attacks. The attacks might differ in sophistication, but the attackers
    are using similar types of means and methods. One type of group appears to be
    independent of the state, but the state sponsors their actions. These groups act
    under the direction of the state, but they decide how to carry out the tasks by
    acting as direct proxies for the state (Chapter 5). Another important group is
    non-state actors acting independently, but these actors benefit from following
    the state’s political agenda (Chapter 6). Finally, there is a group of politically
    motivated actors acting entirely outside the realm of the state (Chapter 7). There
    are also serious issues with how these groups are managed, and the legislative
    framework applied. The regulatory framework and the offences are not designed
    to manage these cyber attacks.'
