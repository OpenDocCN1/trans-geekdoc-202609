    # Strategies and the Game


    With no legislative global cyberwarfare framework in place, the use of cyberspace
    for attacks reveals a borderless environment for the states to act within. States
    are using cyberspace to alter the balance of information and gain advantages in
    the long-term cyber competition. The complexity of various cybersecurity frameworks
    developed regionally and nationally creates an unbalanced level of rules, participants,
    and responses. The current game plan for states includes cyber espionage as a
    broader coercive campaign and crisis bargain. Through these attacks, the actors
    signal their capacities or determine their rivals'' capabilities and resolve (Jensen
    et al., 2020). Considering the actual issues in the light of game theory, recent
    cyber attacks have shown that the vision of persistent engagement calls for preventively
    imposing costs on adversaries to sharpen competition (Valeriano, 2020; Jensen
    et al., 2020). Imposing costs are included in a layered cyber deterrence strategy
    to influence the decision-making procedures (US Cyberspace Solarium Commission,
    2020). Yet, the costs imposed do not have a level that outweighs the actual benefit
    from the operations. The payoff of a successful attack is too high for attacking
    states to have any deterrence effect in the absence of international rules in
    this area (Valeriano, 2020; US Cyberspace Solarium Commission, 2020).


