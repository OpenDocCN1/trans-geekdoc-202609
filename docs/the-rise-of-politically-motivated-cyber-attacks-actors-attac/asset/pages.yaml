- pgno: 77
  md: '| Type | Characteristics |

    |---|---|

    | Malware | An umbrella term for different types of malicious software deployed
    to attack computer systems, devices, and networks |

    | Ransomware | A form of malware that prevents or limits victims from accessing
    their system until a ransom is paid |

    | Data compromise | Illegally accessing individual user credentials or accessing
    large databases with potentially sensitive information |

    | Denial-of-service (DoS) | An attack that overflood a server with traffic until
    the targeted website or resource is unavailable |

    | Distributed-denial-of-service (DDoS) | A DoS attack that are using multiple
    computers or machines to overflood a targeted website of resource |

    | Botnets | A collection of internet-connected devices infected by malware to
    allow hackers to take control over them |

    | Defacements | Any unauthorised modification of web pages, which included additions,
    removals, or alterations of existing content |

    | Espionage | A process of obtaining information that usually is hidden to the
    public using technical means (hacking) |

    | APTs | A prolonged and targeted attack where the hacker gain access to the computer
    systems and networks and remains undetected for a long period |

    | Zero-day vulnerability/exploit | An attack that exposes an unpatched software
    security flaw known to the software vendor |

    | Brute force attack | An attack that uses trial and error to guess login info,
    encryption keys, or find a hidden web page by working through all possible combinations
    |

    | Supply-chain attack | A cyber attack that is targeting less secure elements
    in a supply chain to damage an organisation |


    Sources: Akamai (2021); CIS (2021); Europol (2020a); Fortinet (2021); Fruhlinger
    (2020); Holt et al. (2018, p. 73); M15 (2021); Norton (2020); Rosencrance (2020).


    # Malware


    Malware is an umbrella term covering diverse types of malicious software deployed
    to attack computer systems, devices, and networks. Malware is designed to target
    specific computers, systems, or networks (Holt et al., 2018, p. 73). Malware can
    be viruses where the online users actively perform a task to release the virus
    into the system. For example, by clicking on a link or opening an attachment.
    Malware can also be a more sophisticated work as it can replicate and transmit
    itself without any activities from the online user. Trojan horses are malware
    concealed as something else which looks like a legit function or website. However,
    the malware is being launched into the system from the host. These can be coded
    to transmit information back (spyware), or they can be set to destruct at a particular
    time (Logic bomb) (Lavorgna, 2020,'
  merge: -1
  img_proc: true
- pgno: 78
  md: 'p. 62). The actors are using different means and measures to load the malware
    into the systems.


    For example is the Stuxnet attack (2010), which was launched using malware (McAfee,
    2020). Another example is the Document of 20 (G20) Summit in 2011, where an email
    containing a PDF document with an embedded malware-targeted French governmental
    computers. In total, 150 of the French Finance Ministry''s computers were infected
    by the malware (Sword, 2016). Researchers from Cisco Talos (2019) has also uncovered
    a large number of politically charged malware campaigns, distributing ransomware,
    remote access Trojans (RATs) using a variety of political themes or names of prominent
    politicians to trick the victims into downloading the malware, such as the former
    US President Trump, Russia''s President Putin, and North Korean ruler Kim Jong-un
    (O''Donnell, 2019).


    # Ransomware


    Ransomware is a form of malware that prevents or limits victims from accessing
    their system. This malware either locks the system’s screen or files upon the
    ransom payment (Fruhligner, 2020; Trend Micro, 2021b). Users are shown instructions
    for how to pay a fee to get the decryption key. The costs can range from a few
    hundred dollars to thousands, payable to cybercriminals in Bitcoin. This method
    has been used in state-sponsored attacks where weaponised ransomware has destroyed
    data, i.e. WannaCry and the NotPetya attacks in 2017 (Hern, 2017b). The standard
    hacking tool used to inject the malware can be phishing emails to trick online
    users into handing over passwords or sensitive data. This move allows the attacker
    access to the computer systems and networks (Ranger, 2018, p. 43). The surge in
    ransomware attacks in 2020 and 2021 has changed the perception of these attacks.
    Previously, the attacks have been perceived as financial cybercrime and managed
    in isolation, but it is now considered a national security threat/terrorism. The
    change is based on the groups constantly targeting CIs and the impact these attacks
    have on society (Associated Press, 2021a; Shaban et al., 2021).


    # Data Compromises and Data Breaches


    After ransomware, data compromises and data breaches are a growing threat. These
    attacks are mostly linked to illegally obtaining sensitive data using phishing,
    data breaches, and information-gathering malware (Europol, 2020). A data breach
    happens when the entity responsible for securing the data suffers a security incident
    that results in a breach of confidentiality, availability, or integrity. A data
    breach is based on authorised access to computer systems or networks, where the
    attacks obtain or disclose sensitive, confidential, or otherwise protected data
    (Hanna et al., 2021; Trend Micro, 2021a). Data compromises and breaches can, for
    example, occur in relation to ransomware groups’ data extortion before the ransomware
    is injected into'
  merge: -1
  img_proc: true
- pgno: 79
  md: 'the system. These attacks can also be linked to espionage campaigns where data
    are obtained during the attack. However, this method is not limited to ransomware
    groups and their double or triple extortion schemes. An example of a data breach
    is the attacks during the 2016 US presidential election. The Democratic National
    Committee (DNC) and the Democratic Congressional Campaign Committee (DCCC) were
    hacked by Russian state-sponsored groups. The group used techniques such as spearphishing,
    RATs, implants, and C2 servers, which are traditionally associated with the financial
    types of cybercrime (BBC News, 2016b; Green & Ng, 2020). Later, WikiLeaks uploaded
    thousands of emails onto the Internet from the DNC hack concerned Clinton''s presidential
    campaign (BBC News, 2016a; Maffli, 2017).


    # DoS/DDoS Attacks


    Various actors widely use DoS and DDoS as they do not require a high level of
    computer knowledge. DoS is conducted to overflow Internet websites or with a large
    amount of data that consume all the resources of the target computer. This attack
    form overloads the system until the target computer or system crashes. The goal
    for the attackers is not to access the system but to prevent other users from
    accessing it. DoS attacks have been further developed with DDoS as technological
    development has enabled the systems to manage a more substantial amount of data
    (Moore, 2011, pp. 39–40). DDoS are linked to cyber attacks against several actors,
    agencies, and online users by sending multiple repeated messages to servers housing
    online content to overload these servers and disrupt their performance (Attrill,
    2015, p. 269). The difference between these two denials of service techniques
    is that DDoS is more potent by sending multiple requests simultaneously (Holt
    et al., 2018, p. 669). These types can cause both economic damages and reputational
    damage to the victim. The attackers aim to take down the system or network and
    send a strong signal to the target and similar commodities as part of mission
    fear. The DoS/DDoS attacks show off the attackers cyber capabilities and create
    uncertainties about their other tools and abilities to attack (Office of the National
    Counterintelligence Executive, 2011, p. i). Attacks can cause significant losses
    lost when customers cannot access web pages or services. The tactic is also used
    where the bot master blackmails the owners into paying a ransom to stop the attack
    – or it can be used to distract IT personal while they carry out a more damaging
    attack against the entity (Holt et al., 2018, p. 142).


    # DOS/DDOS ATTACKS AND THE USE OF BOTNETS


    Politically motivated actors are also deploying botnets designed to infect and
    gain control of numerous personal computers. The botnets allow cybercriminals
    to harvest identities and carry off many tasks. The botnet connects an army of
    zombie computers infected with a malicious code designed to access a target. The
    cybercriminal will activate the master zombie'
  merge: -1
  img_proc: true
- pgno: 80
  md: 'computers to attack at a time. The process begins when the master zombie computers
    send attack commands to the slave computers in the botnet. The process overflows
    the victim''s computer system for some time. However, the process can be repeated
    until the victim can patch the vulnerabilities in the systems (Lavorgna, 2020,
    p. 61). The problems regarding botnets are the unknown number of computers involved
    in the attacks, making it nearly impossible to locate the people behind the attacks.
    The botnets are helpful to generate a large-scale attack, which affects information
    systems, causes considerable damage, disrupts the data transmission, and causes
    financial costs or loss of personal data (EC, 2013, p. 3; Munk, 2015, p. 51).
    Although the 2016 Mirai attack is not attributed to any political actors, it is
    still a powerful attack. It demonstrated the powers of botnets by interlinking
    a large number of insecure IoT devices such as everyday things like digital cameras,
    printers, and digital video recorder (DVR) players where the factory settings
    have not been changed. This cyber attack brought down a large part of the American
    Internet in a coordinated DDoS attack towards DYN, a company controlling a large
    amount of the Internet''s domain system infrastructure. This attack prevented
    access to companies such as Twitter, the Guardian, Netflix, Reddit, and CNN (Antonakakis
    et al., 2017, p. 1063; Munk, 2018, p. 235; Woolf, 2016).


    # Defacements


    Website defacement is an unauthorised modification of web pages. This includes
    the addition, removal, or alteration of existing content (CIS, 2021). Attackers
    compromise a website or web server and replace or alter the hosted website information
    by posting their messages. Unskilled actors primarily focus on website defacements
    due to the low sophistication needed (CIS, 2021; Europol, 2021; Trend Micro, 2021c).
    These actors are using automated applications to test vulnerabilities of websites,
    i.e. SQL injection attacks. The attack are then launched against unpatched or
    misconfigured web pages or systems (CIS, 2021). The defacement of public and private
    websites belonging to governments, corporations, and businesses are increasing.
    Although the case numbers are lower than the other attack forms, they are common
    (Europol, 2021). This attack form can act as a DoS attack by preventing access
    to information. Moreover, the attack form is used to post graphic images or information
    to shock the reader and disrupt and damage the target''s reputation (CIS, 2021;
    Trend Micro, 2021c).


    Defacements have for a long time been used by hacktivist groups. Other less cyber-sophisticated
    state-sponsored hackers have also embraced this attack form. For example, in 2009
    and 2010, the Iranian Cyber Army hacked into Twitter, launching a political message
    on Iranian opposition supporters on the social media platform (Arthur, 2009).
    In 2010, the group disrupted the Chinese search engine Baidu, which commands 60%
    of the Chinese market. On Baidu, the attacker directed to online uses to a web
    page which had an'
  merge: -1
  img_proc: true
- pgno: 81
  md: 'Iranian political message: “This site has been hacked by the Iranian Cyber
    Army” next to a picture of the Iranian flag (BBC News, 2010; Branigan, 2010).
    This attack was partly repeated in an attack against Saudi Aramco in 2012, where
    the Shamoon malware wiped out thousands of Saudi Aramco computers’ hard drives,
    leaving behind a picture of a burning American flag on the screens (Munk, 2015,
    p. 179; The Economist, 2014).


    # Espionage


    Cyberespionage is an attack form conducted against a competitive company or governmental
    entity. The overarching goal is to gather sensitive or classified data, or secrets,
    where information is obtained to give the attacker a competitive advantage over
    the target (Crowdstrike, 2021; Gillis, 2021a). Cyberespionage is often referred
    to as APTs. These attacks are part of cyberwarfare where one nation-state launch
    the attack against another. Using APTs, that attacker can remain undetected for
    an extended period. However, these attacks are often complicated and expensive
    to conduct, but they are equally difficult to detect (Crowdstrike, 2021; Gillis,
    2021a). The emerging level of sophistication associated with these attacks opens
    up the possibility of coordinated and advanced attacks that have a significant
    disruptive impact on several modern-day services, i.e. operation of the electricity
    grid, disturbance to financial markets, and interference in primary elections
    (Crowdstrike, 2021). States and state-sponsored actors are developing various
    programmes to access information from other states. However, tools are accessible
    on the Dark Web for less skilled actors where market spaces and carding forums
    are trading software and skills (HM Government, 2016, p. 18).


    # APTs


    APTs are a reasonably new attack form that requires a high level of computing
    knowledge of the attackers. APTs are a prolonged and targeted attack where the
    intruder gets access to the computer systems and networks and remains undetected
    there for an extended period. These attacks are aimed at organisations, for example,
    national defence, manufacturing, and financial institutions, by accessing the
    intellectual property, military plans, and other security data from governments
    (Rosencrance, 2020). To enable hackers to remain in the system without being discovered,
    they continuously rewriting malicious code to avoid detection and other advanced
    evasion methods. Some of these techniques are so complex that they require full-time
    administrators to maintain the compromised access to systems and software. The
    attacks are developed in different phrases. First, the attackers need to access
    the target (Belding, 2019; Rouse, 2020). The groups use advanced attack methods
    such as exploits of zero-day vulnerabilities, targeted spearfishing, and social
    engineering (Crowdstrike, 2021). These methods enable the hackers to get a foothold
    inside the computer systems and networks. When they are inside, the'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'attackers create backdoors to move around or later enter the system (Belding,
    2019; Kaspersky, 2021; Rouse, 2020).


    # Zero-day Attacks


    Accessing zero-day vulnerabilities are another tool widely used by hackers. The
    zero-day vulnerabilities are bugs, flaws, weaknesses in software, hardware, or
    firmware that the developer has not discovered or patched. Exploiting the zero-day
    vulnerabilities allows the attackers access to or control over systems. These
    flaws are particularly useful as nothing stops attackers from misusing this access
    until the pathway is patched (FireEye, 2021; Ranger, 2018, p. 44; Trend Micro,
    2019). The zero-day vulnerabilities can be a result of improper computer or security
    configurations and programming errors. Hackers write codes targeting specific
    security weaknesses which are being released using a zero-day exploit to compromise
    or change the behaviour of a computer system (Norton, 2020). These attack forms
    are rarely discovered until later; it can take months or years before the target
    becomes aware of the vulnerability (FireEye, 2021). There is a growing trade in
    zero-day exploits that allow attackers to sidestep security procedures. It is
    believed that states are stockpiling zero-day exploits to be used in espionage
    or as a cyberweapon. Zero-day exploits were an essential part of the Stuxnet cyberweapon
    to access the facilities. Compared with conventional weapons, zero-day exploits
    are reusable, and when discovered, the exploits can be analysed and reused by
    the original target (Ranger, 2018, p. 44).


    Zero-day exploit malware can take many forms. The malware can be designed to steal
    data, allow hackers to take unauthorised control over the computer systems or
    networks, install other malware corrupting files, or access contact lists to send
    spam messages – or install spyware to steal sensitive information (Norton, 2020).
    In 2021, threat actors used LinkedIn to send messages with malicious links to
    governmental officials in Western states. Google attributed four zero-day exploits
    to Russian SVR hackers to attack Google Chrome, Internet Explorer, and Safari
    for iOS users. Three of these are linked to commercial surveillance vendors arming
    state-sponsored hackers, and one is linked directly to a Russian APT group (Cimpanu,
    2021a; Gatlan, 2021).


    # Brute Force Attacks


    A brute force attack is using excessive forceful attempts to access the computer
    systems. This attack form is usually introduced in the early stages of a cyber
    kill chain during the reconnaissance and infiltration states where the attackers
    need a point of entry (Peters, 2021; Swinhoe, 2020). The attack forms are repeatedly
    linked to a trial-and-error process and systematically submitting usernames and
    passwords to guess login info, encryption keys, or find a hidden web page that
    will enable access. The attackers are working'
  merge: -1
  img_proc: true
- pgno: 83
  md: 'through numerous combinations to find the correct usernames, passwords, passphrases,
    and personal identification numbers (PINs). The attackers let the computers do
    the work using a script or bot to try different combinations. Automated tools
    are also developed to enable less computer-skilled attackers to conduct these
    attacks (Kaspersky, 2021; Peters, 2021; Swinhoe, 2020).


    # Supply-chain Attacks


    A supply-chain attack occurs when the hacker accesses the computer system through
    an outside partner or provider with access to the system (Korolov, 2021). The
    supply chain is based on a network of all individuals, organisations, resources,
    activities, and technologies. The attackers target the weak points in a supply
    chain in order to succeed. The critical element is that the attackers exploit
    the trust that a company or organisation has in third-party vendors (Gillis, 2021b).
    Supply-chain attacks are an increasingly common form of hacking. This attack type
    is based on a technique in which an attacker injects a malicious code or a malicious
    component into trusted software or hardware. By compromising a single supplier,
    the attacker can hijack the distribution systems to turn any application, software,
    or physical equipment into Trojan horses. With one well-placed intrusion, the
    attacker creates a route into the networks of a supplier''s customers, and thereby,
    they can attack a large number of victims linked to the supply chain (Greenberg,
    2021).


    This attack form is challenging to manage, as demonstrated in 2020. It was revealed
    that Russian state-sponsored attackers hacked into the software company SolarWinds
    and injected the malicious code into Orion''s IT management tool. This allowed
    access to approximately 18,000 customers'' networks worldwide using the Orion
    tool, including multiple US governmental departments, including the US Treasure
    and Commerce (Constantin, 2021; Greenberg, 2021; Korolov, 2021). The risks associated
    with a supply chain attack are high, and new tools are constantly developing.
    There is a going awareness of the threats deriving from this attack type. However,
    the attackers have more resources and tools available, which create the perfect
    storm (Korolov, 2021).


    # Conclusion


    This chapter provides an understanding of hackers and hacking, which have developed
    significantly from the early days of computing, where their curiosity drove hackers.
    Cyber attacks are not following one particular pathway; there are numerous means
    and methods developed and used. The attack routes are constantly changing, and
    the attackers exploit new techniques, making the attacks challenging to prevent
    and detect. At present, hacking underpins most elements of cyber attacks, and
    this area is constantly developing with new computer technologies and innovative
    attack forms. Some of the actors have considerable technical skills, but it is
    not a requirement. Hacking software'
  merge: -1
  img_proc: true
- pgno: 84
  md: 'and HfH are commodities on the Dark Web. This chapter has highlighted some
    of the most used hacking tools. However, these only represent a snapshot of the
    most used attack forms.


