- pgno: 264
  md: 'This part of politically motivated attacks is not comparable to the state and
    state-sponsored/supported actions. However, the actors have a profound political
    and social foundation, and they are using the same means and methods as the other
    actors. It would be useful to consider these attacks in conjunction with the other
