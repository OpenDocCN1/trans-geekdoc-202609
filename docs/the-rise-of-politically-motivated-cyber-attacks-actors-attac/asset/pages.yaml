  md: '# 4 Cybersecurity and Strategies


    # Introduction


    This chapter follows the previous two chapters to conceptualise politically motivated
    cyber attacks. This chapter creates a theoretical framework to provide an insight
    into current cybersecurity issues and strategies developed to manage the threats.
    Risk, nodal governance, and complexity are essential areas to understand the current
    cybersecurity framework. This chapter includes international, regional, and national
    security strategies. Key international actors have developed several cybersecurity
    strategies, covering essential national, regional, and international approaches.
    This section highlights the diversity and the similarities in developing cybersecurity
    strategies as well as the challenges.


    # Risk Management


    The nature of protecting various CI forms and structures means that governance
    is centred around means of calculation, imagining worst-case scenarios to prepare
    for possible scenarios and mitigate the attack afterwards. The different governing
    authorities or agencies involved in the process have different knowledge and techniques
    useful for enhancing the security level (Dean, 2010, p. 18; Munk, 2015, pp. 64–65).


    Public and private cybersecurity actors respond to the constant developing risks
    by qualifying and prioritising risks in the decision-making procedure. Risk, as
    a concept, is linked to the assumption that the risks cannot be abolished, and
    100% security cannot be archived. Instead, risk needs to be recognised and managed
    before mutating into actual threats. The usefulness of risk management is that
    it enables actors to assess and classify the risks and impose possible solutions
    to enhance the security level. Moreover, it enables actors to consider possible
    outcomes if the risks are not managed or only partly managed (NCSC, 2020). Integrated
    into the different procedures are cyber assessments to identify what might compromise
    computer systems and networks – this is also an attempt to identify how severe
    these risks might be (IT Governance, 2020)'
  merge: -1
  img_proc: true
- pgno: 93
  md: 'Risk management is based on ‘not-yet’ events by simulating precautionary actions
    against imagined attack types. Future events are anticipated from speculative
    risk scenarios to avoid the unwanted consequences of events. However, there is
    no guarantee that these imagined risks will materialise; it is more a way of categorising
    something that ‘might happen’. Beck (1992) has defined risks as “a systematic
    way of dealing with hazards and insecurities induced and introduced by modernisation
    itself” (p. 260). In this context, risks in society derive from a boomerang effect
    where the producers of risks also are exposed to them. This boomerang effect is
    linked to the use of computer systems and technologies in everyday life. Online
    users benefit from the extended online connectivity for communications, exchanges,
    searches, work, etc. The same computer systems and technologies can also be turned
    into powerful weapons that can be used against online users. Beck’s notion of
    risk is linked to globalisation, where states and private actors face an equal
    uniform set of non-quantifiable, uncontrolled risks on multiple levels. Geographical
    risks are hard to measure and manage, as security problems in one place tend to
    affect other areas, and risky events can happen anywhere (Munk, 2015, pp. 76–77).
    These are the core elements of Rumsfeld’s speech from 2003 that illustrates the
    complexity, uncertainty, and unpredictability of risk assessment:


    > The message is that there are no ‘knowns’. There is a thing we know that we
    know. There are known unknowns. That is to say, there are things that we now know
    we don’t know. But there are also unknown unknowns. There are things we don’t
    know we don’t know.

    > (Logan, 2009; NATO, 2002)


    The ‘unknown unknowns’ are featuring heavily in cybersecurity assessment processes.
    Attackers and politically motivated actors are constantly exploring new ways to
    attack. These attacks can be conducted using known means, new methods using existing
    means, or by developing innovative and detrimental means. For example, an attack
    can suddenly emerge, which no one had predicted, such as Gen-Z/K-pop’s actions
    in 2020 (Alexander, 2020; Bedingfield, 2020).


    Risk assessment and management trigger an imaginative outset where scenarios and
    responses are predicted without knowing if they would be used or correctly designed
    in accordance with the perceived risks. Recognition of potential targets can enhance
    the cybersecurity level. Past knowledge about the attackers, their grouping, and
    their attack modus operandi would be added to the assessments. According to the
    UK NCSC (2015), not engaging in cybersecurity is no longer an option. Preventing,
    detecting, or disrupting cyber attacks at an early point in the process limit
    the impact and the potential reputational damage afterwards (NCSC, 2015). It is
    important to recognise limitations in knowledge. Understanding past vulnerabilities
    and attack forms do not indicate that this understanding can be transferred to
    all'
  merge: -1
  img_proc: true
- pgno: 94
  md: 'new attacks. There are constant insecurities about whether these means and
    methods would be used again or whether attack forms have developed further. These
    uncertainties call for a complex cybersecurity strategy framework and tactics
    that consider and implement proactive processes where the attack predictability
    and likelihood are calculated and assessed.


    # Resilience and Preparedness


    Included in anticipatory governance forms are resilience building and preparedness.
    Both areas are linked to imminent threats and foreseeable threats – as well as
    potential risks related to the development of computer technologies and networks.
    For example, cyber attacks are a security risk and attacks would be conducted
    based on various political motivations. However, it is uncertain how and when
    it would happen – and which entities would be the target. Both resilience and
    preparedness are preconditions and responses to threats. Resilience is linked
    to the ability to imagine increasingly uncertain and traumatic futures, where
    measures are imposed that can adapt and respond to uncertain situations (Munk,
    2015, p. 84; O’Malley, 2012, p. 6). To manage cybersecurity, it is vital to have
    a system of foresight analysing alternative future scenarios by monitoring prospective
    events, prompt warnings to alert actors about potential consequences.


    By using different proactive and reactive techniques and assessing future risks
    based on past knowledge, it is possible to secure potential targets and attack
    routes. Areas to include in the risk assessment are malware types, CI, CNI, CII,
    and ICT vulnerabilities, the Internet architecture, platforms, and devices and
    online user behaviours (Goldsmith, 2008; Munk, 2015, p. 90; Sandin, 1999, p. 892).
    In terms of CIs, it has been established that all the areas incorporated within
    this umbrella term are particularly vulnerable. Resilience is closely linked to
    proactive security to either prevent an attack or make it difficult for attackers
    to enter. This increases the likelihood of discovering the attack before it can
    cause significant damage to the system or society.


    Cybersecurity and governance of cyberthreats are based on an understanding of
    the interaction of political, social, and economic resilience and human adaptability
    based on the complexity of the differentiated systems and technologies, i.e. self-organisation,
    functional diversity, and non-linear behaviours (Joseph, 2013, p. 2; Munk, 2015,
    p. 86). This also means that cybersecurity and resilience are not static but constant
    processing of assessing and responding to new means and methods developed by the
    threat actors.


    The WannaCry ransomware attack in 2017 on the UK National Healthcare Service (NHS)
    displayed the importance of constantly assessing computer systems and security
    maintenance to enhance resilience. In 2014, the UK Department of Health and the
    Cabinet warned NHS trusts about the security level. The department stated it was
    essential to develop resilience plans and move away from using old software. Before
    the attack, NHS Digital conducted an on-site cybersecurity assessment. Out of
    23 health trusts, 88 were assessed,'
  merge: -1
  img_proc: true
- pgno: 95
  md: 'and none of these trusts passed the tests. However, the agency did not have
    the power to take remedial actions despite security concerns (Hern, 2017; Syal,
    2018).


    Protect, detect, respond, and recover are areas largely incorporated in all cybersecurity
    strategies. In 2013, US President Obama issued an Executive Order (EO) 13636 to
    improve CI cybersecurity. The Order instructed the US National Institutes of Standards
    and Technology (NIST) to work with relevant stakeholders to develop a voluntary
    framework based on existing standards, guidelines, and practices to reduce the
    cyber risks to CI (NIST, 2020). The European Union (EU) created its cybersecurity
    strategy around similar areas. The 2020 EU Cybersecurity Strategy goes beyond
    traditional cyber policies and compliance by including three key areas: resilience
    and technological sovereignty; the ability to prevent, deter, and respond to cyber
    attacks; and, finally, increased focus on teamwork (Van Impe, 2021).


    Prevent, detect, and respond cover both physical and cybersecurity. Traditionally,
    cybersecurity has been introduced to prevent a successful adversary attack. However,
    that is not possible unless other mechanisms are used in conjunction with preparedness
    plans. The stage after an attack has been launched also needs to be taken into
    account. Preparedness plans are introduced to detect attacks that are progressing
    and minimise the damage caused by these attacks. It is a crucial feature in cybersecurity
    that victims can restore the systems and networks quickly and effectively afterwards
    to ensure continuity, especially CI attackers were services and structures unpinnning
    vital areas of society. These risks are expected to be mitigated where services
    and structures continue with limited or no disruption to the users. Lessons learned
    from responses are included in a continuous cybersecurity loop where the experiences
    are factored into future preparedness plans (Bayuk, et al., 2012, p. 2; Munk,
    2015, p. 90).


    # Cybersecurity and Nodal Governance


    Cybersecurity and nodal governance forms are created on a multistakeholder structure
    involving transnational and cross-sectoral organisations, groups, and individuals
    beyond the actual object. In terms of CIs, several stakeholder groups and individuals
    are involved in running and maintaining the services. The management structure
    is linked to a fragmented and differentiated security construction where security
    should be multilayered. The actual anticipatory governance structure aims to be
    proactive by including several actors working together in different nodes, ad
    hoc or permanent (Munk, 2015, pp. 64–65). The nodal governance is the overarching
    foundation for perceiving, managing, and responding to the online dangers before
    they develop further. The cybersecurity responses need to mirror the attack types.
    In the current environment, the attackers can deploy a wide range of cyberweapons.
    There might be crossovers between the means and methods used, combining several
    tactics in one attack. For example, the attackers might target the supply chain
    by'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'combining brute force to enter with APTs for a persistent presence within the
    system to spy on the target and steal intellectual property over a long period
    (Skopik, 2017, p. 194).


    The multistakeholder approach can best explain the organisation of cybersecurity
    and the management of CI resources. Preventing cyber attacks requires a coordinated
    response with several actors working across traditional divisions, i.e. national
    and international, public and private. The different collaborative nodes are situated
    in complex institutions, organisations, and apparatuses involving state and non-state
    actors. For example, the structure of the network can include regulatory state
    bodies, international institutions and agencies, self-regulating bodies of industry,
    and corporations governing numerous quasi-autonomous initiatives within the security
    apparatus (Lentzso & Rose, 2009, pp. 233–234; Miller & Rose, 2008, p. 55; Munk,
    2015, p. 65).


    Individual organisations or security agencies might develop plans to coordinate
    their responses. At present, politically motivated cyber attacks are launched
    against public and private entities. Therefore, the focus is on coordinated cooperation
    across all communities of interest (Bayuk et al., 2012, p. 38). Threat intelligence
    communities and cybersecurity nodes are embracing the concept of standardised
    and automated information exchange, including actors with similar profiles and
    technical infrastructures. Pooling resources and exchanging knowledge are essential
    parts of cybersecurity. Despite this, the different nodes are inherently closed
    by being restricted by specific criteria or invitations (Skopik, 2017, p. 187).
    When assessing the different areas, such as cyberwar and warfare, cyberterrorism,
    and other political cyber attacks, it is evident that attack groups and actions
    are assessed in isolation.


    Transnational cooperation is one of the cooperation types which influence governance
    structure in cybersecurity. The global aspect included in online communications
    and interconnectivity is present on all levels. All types of illegal online activities
    and attacks can originate outside the national jurisdiction and create challenges
    to managing the risks. The main obstacles to efficiently managing these areas
    derive from:


    > [J]udicinay limits, insufficient intelligence gathering/sharing capabilities,
    technical difficulties, disparate investigative and forensic capacities, lack
    of trained staff, and inconsistent cooperation with other stakeholders involved
    in cybersecurity.

    > (EC, 2012, p. 3)


    The cross-sectoral element is equally important as public and private entities,
    computer systems, devices, and networks are interlinked on an unprecedented scale.
    All the actors involved are facing the same level of online risks. Cross-sectoral
    cooperation has obtained a central position based on a particular relationship
    between the state and private security actors. This implies that governance derives
    from the mobilising exchange of knowledge, capacity, and'
  merge: -1
  img_proc: true
- pgno: 97
  md: 'resources of various organisations, groupings, and individuals. Everyone can
    become the target for politically motivated actors, and this risk encourages public
    and private actors to participate and take responsibility for security within
    their interest domain (Munk, 2015, p. 127).


    Public and private actors’ brings together a diverse range of resources, capabilities,
    priorities, and perspectives that sometimes compete or are incompatible. The two
    sets of actors are aligned on the tactical level to develop efficient cybersecurity
    solutions. By maximising their collective resources, it is possible to create
    practical and sustainable security solutions (Germano, 2014, p. 1). For example,
    regulators, private cybersecurity actors, supply-chain actors, and customers have
    practical knowledge for managing the area and understanding the impact of attacks
    (Crawford & Lister, 2004, p. 21; Dupont, 2006; Johnson, 1992; Munk, 2015, p. 68).
    This nodal security structure has resulted in an extended hybrid formation that
    is neither public nor private. In terms of CI areas, cybersecurity collaborations
    often include the actual partners involved in the daily running of these services
    and structures.


    # Collaborative Networks


    Collaborative networks are expanding beyond the traditional regulatory framework
    where numerous actors facilitate information sharing and establish standards of
    practice and performance. Several actors experience the same types of risk, and
    their operations are interlinked. Therefore, it is beneficial for all actors to
    collaborate in nodes to enhance security. Learning from each other, pooling resources
    together and developing functional responses are positive outcomes. However, these
    collaborative hybrid structures become very complex and challenging to manage.
    There is, therefore, a risk of vital information about cybersecurity getting lost
    or duplicated along the communication line.


    Closer collaborations have been developed based on the cybersecurity strategy
    areas: prevent, detect, respond, and recover. Important global security actors
    and agencies have created platforms for transnational and cross-sectoral cooperation.
    The international police cooperation, Interpol, collaborates with states and private
    cybersecurity partners to share up-to-date knowledge about threats, trends, and
    risks. The shared data create cyber intelligence to support states in developing
    preventive strategies to manage current and future threats (Interpol, 2020). In
    2000, The US Federal Bureau of Investigation (FBI) created an Internet Crime Complaint
    Centre (IC3) to provide a reliable and convenient reporting mechanism for suspected
    Internet facilitate crimes (FBI, 2021). The European police cooperation, Europol,
    established European Cybercrime Centre (EC3) in 2013 to strengthen cybersecurity
    and police cooperation aiming to improve responses and facilitate cooperation
    between the member states. This agency includes prevention and stakeholder management,
    strategy and development, forensics, and cyber intelligence (Europol, 2020).'
  merge: -1
  img_proc: true
- pgno: 98
  md: '# Complexity Theory


    Cybersecurity collaborations can be linked to various systems incorporated in
    the complexity theory. Complexity theory enhances understanding of how systems
    like CIs, the Internet, corporations and actors, and the economy appear, develop,
    and grow. Additionally, the theory aims to understand how complex relationships
    and interactions among the members enable collective behaviours (Sammut-Bonnici,
    2015, p. 1). There are substantial internal and external complexities included
    in the different cybersecurity collaborations. The nodes consist of multi-identities,
    redefinition of public and private entities, and eroding boundaries between public
    and private actors. Complex non-linear systems consist of several similar, independent
    and interdependent actors and entities that constantly communicate. The actors
    need to adapt to new situations to address the cyber risks and create order in
    the chaotic systems. Still, the organisation of the nodes is based on spontaneous
    self- organisation within the system to ensure adaptiveness. To ensure that the
    groups function, some local rules are developed within the collaboration. These
    rules apply to all actors, but they should not be created in a way that ruins
    flexibility. Finally, it is essential that the actors can develop together within
    the collaboration (Erkoçak & Açıkalın, 2013).


    Complexity theory is helpful to understand how systems develop from chaotic situations.
    For example, organisations and agency formations are complex and organic structures,
    and each actor acts autonomously within the system, driven by their self-interest
    and establishment. However, each entity involves several self-organising components
    of employees, business units, resources, and stakeholders. This flexibility is
    paramount in a technological environment that is continuously exposed by hackers
    and politically motivated actors (Sammut-Bonnici, 2015, p. 1). None of the actors
    has the same structure, nor do they face the same risks. Therefore, it is impossible
    to address the risks and responses like-for-like – or develop strategies that
    cover all the risks. However, the complexity is also linked to the way attacks
    are carried out and the type of the targets. Cyber-physical attacks are significantly
    different from pure cyber attacks. Cyber-physical attacks are traditionally linked
    to compromise devices and domains’ safety or physical integrity. In comparison,
    the pure cyber attacks are predominantly linked to threats against cybersecurity,
    such as the confidentiality, integrity, and availability of devices (Liu et al.,
    2017).


    # Game Theory


    Just as the attacking groups follow a strategy and an incitement to pursue a political
    agenda by launching attacks, the cybersecurity actors are also developing international,
    national, and organisational strategies to respond to the growing number of cyber
    risks. The different strategic positions are linked to game theory and the payoff
    that can be archived by weighing up the costs and the benefits. The outcome of
    these calculations is essential for both'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# Table 4.1 Strategic games


    | Type | Game | Actions |

    | --- | --- | --- |

    | Decision-making under risk | Based on the inherent uncertainties linked with
    the consequences of actions, i.e. taking chances calculated together with the
    probabilities of occurrence Other decision-makers are perceived as non-strategic
    fixed targets | The right choices yield the greatest expected return The expected
    return can be monetary, enhanced security, psychological, or physical satisfaction
    |

    | Game-theoretic decision-making | Based on actors pursuing their own goals while
    considering their existing knowledge of adversaries, i.e. a knowledge game to
    predict future movements based on past known behaviours and possible changes Other
    decision-makers are not fixed targets, but the situation and actions can continually
    develop and change | An ongoing circle of assessments and predictions and multiple
    directions and possibilities Closely linked to the current cyber-risk assessments
    and worst-case scenarios, i.e. known knowns, known unknowns, or unknown unknowns
    |


    Source: Niou & Ordeshook (2015, pp. 2–3).


    groups and their decision-making: what would generate the best payoff (Niou &
    Ordeshook, 2015, pp. 2–3).


    There are two game theories that is important to understand the strategies that
    underpins cybersecurity. The first direction is ‘decision-making under risks’,
    and the second direction is ‘game-theoretical decision making’.


    # Strategic Positions and Payoff


    The way CIs are organised and interlinked in large and distributed systems creates
    a complicated network of actors. These different systems are targets for attacks.
    At the same time, they are facing many security challenges that require a robust
    and flexible strategic foundation (Liu et al., 2017, p. 13). The games are developed
    to predict the outcome of attacks, strategic moves and priorities in collaboration,
    counterattack measures, and enhance general resilience and preparedness. Therefore,
    the security actors constantly calculate the cost and benefit to get a positive
    strategic payoff.


    The actors in the cyber attack game are individual entities, and the decision-making
    is entwined with each game move. It is crucial to notice that each of the actors
    (players) discerns the actions of the other participants in the strategic game.
    The decision-making strategy predicts the potential behaviour of'
  merge: -1
  img_proc: true
- pgno: 100
  md: 'the opponent, the move, and the payoff. The payoff is the amount of satisfaction
    each actor archive from the game; these can be both positive and negative – and
    the payoff is made known by the end of the game (Patil et al., 2018, pp. 12987–12988).


    In cybersecurity, many games can be considered stimulation to enhance the payoffs
    for the individual players. Some cybersecurity actors will be involved to enhance
    their position, where other actors focus on the group. Other cybersecurity actors
    engage in a lengthy tit-for-tat game with their opponents. Additionally to the
    actors’ strategic positions, some games are ongoing and develop over time. Whereas
    other games are linked to one particular problem, and the game is over when the
    strategic position is stated. These games can be linked back to the complexity
    theory, where the strategies are developed in a non-linear way as the actors and
    the problems they face cannot be easily compared.


    Actors have different levels of knowledge and self-interest. Resources, skills,
    and problems are not always levelled and comparable. These inconsistencies in
    the knowledge and application make the actual management of cybersecurity difficult.
    Interpol’s Secretary General Stock (2021) has called for all police agencies to
    form a global collaboration with industry partners to prevent the increasing number
    of ransomware attacks. Stock suggested that global police forces should develop
    the same international collaboration structure used to fight terrorism, human
    trafficking, and organised crime to prevent and disrupt ransomware attackers.
    The online threats have reached a level where it is impossible for one actor or
    sector to manage the risks alone. The magnitude and the likelihood of these attacks
    call for collective responses to improve the cybersecurity level across sectors.
    The different responses to the risks should make it more risky and costly for
    the attackers to launch ransomware attacks. Thereby, the attackers’ payoff will
    be reduced (Interpol, 2021).


    # The Game


    Two opponents can play the game, where one actor is the attacker, and the other
    is the defender. The attacker makes malicious entries into the system to threaten
    the current security level by seeking out vulnerabilities. The strategies of the
    attackers can go in multiple directions. For example, they can span from a single
    action to a sequence of interlinked activities or be directed towards an ultimate
    goal. The defender in this game would be the opponents responsible for applying
    cybersecurity based on defence techniques to secure the ICs from malicious attacks.
    To counter possible attacks, the defender has prepared several strategies to monitor
    and protect computer systems, devices, networks, and physical assets. Each successful
    attack is a negative payoff for the cybersecurity actors. Depending on the actors
    involved, the payoff can be preventing or not preventing an attack. An example,
    North Korean hackers attempted in 2020 on attacking Israeli defence manufacturers.
    The payoff was negative for the North Korean hackers as the Israeli defence successfully'
  merge: -1
  img_proc: true
- pgno: 101
  md: 'stopped the attack (CSIS, 2020). By contrast, an Iranian hacking group suc­cessfully
    targeted significant US companies and governmental agencies by exploiting vulnerabilities
    in high-end network equipment. In this attack, the hacking group created backdoors
    for other groups to use, and that move is a negative payoff for the cybersecurity
    actors (CSIS, 2020).


    The strategic game can also involve two actors developing strategies or agreements;
    the payoff is the level of success in the negotiations. There has been made several
    attempts of developing global cybercrime conventions or agreements on conduct
    in cyberspace; most of these negotiations have failed, so some of the actors might
    have perceived that outcome as a success whereas others see it as failure depending
    on the starting point and what has been offered during the negotiations. Attempts
    have been made within the United Nations (UN), but these have failed. For example,
    Russia and China have blocked UN attempts in 2010 of creating an international
    cybercrime treaty. The discussions ended as Russia, China, and several developing
    countries dis­agreed with the US, Canada, the UK, and the EU regarding national
    sov­ereignty and human rights (Masters, 2010; Munk, 2018, p. 240). In 2010, Russia
    proposed a cybercrime treaty at the Twelfth UN Crime Congress, but the negotiations
    stalled because of disagreements on complicated national sov­ereignty and online
    rights (Ballard, 2010; Masters, 2010; Walker, 2019). Again, the status quo is
    upheld with no change in the strategic position or the payoff.


    Contrary to traditional approaches, the outcome of game theory is linked to both
    the actions of the current player and the other players in the game. Therefore,
    this approach is extremely accessible and flexible. In cybersecurity, this flexibility
    is paramount as the dependencies and development of com­puter technology and networks
    are both increasing and transforming (Kakkad et al., 2019, p. 681). In the game,
    all players are considered to be instrumentally rational. However, the utility
    is subjective and is linked to the perceived outcome for the individual actors.
    The game does not imply that the actors will succeed and obtain their shared objectives.
    These actors might receive an outcome different from what they expected. All the
    available strate­gic game models are based on the assumption that the actors primarily
    use past knowledge, interpreted in the present time, to decide future outcomes.
    It might be that the actors are not fully informed about the current situation.
    Therefore, the actors base their strategy on limited information or misinfor­mation
    (Zagare, 2019, p. 47). The actors might not have relevant or complete information
    about their opponents/attacker, but they can draw into other types of knowledge
    to develop a strategy.


    # International, Regional, and National Cybersecurity Strategies


    Developing strategies to manage large-scale cyber attacks is about consequences
    interlinked with the payoff of the actions taken. The different means included
    are based on a categorisation of their level of appropriateness to archive success.
    Therefore, the strategy’s effect is not directly linked to the'
  merge: -1
  img_proc: true
- pgno: 102
  md: 'nature of the means used but the consequences of using this mean to reach the
    desired end (Cilluffo & Clark, 2015, p. 10; Grey, 2013). There are obstacles to
    developing strategies as actors need to consider protecting the state sovereignty,
    national security concerns, and perceptions of the risks based on the states’
    societal, cultural, and legal background. Finally, there are issues with the general
    weakness of the implementation of the strategies. States and other actors are
    reluctant to engage with immediate or long-term cooperation if they do not directly
    gain from it. Not being engaged in the collaborations can also be the desired
    outcome and a positive payoff. States and security actors can benefit from unregulated
    cyberspace, where norms, processes, and practices are underdeveloped. The most
    technically advanced states can use cyberspace to their advantage on others’ expenses
    (Jakobi, 2020, p. 216).


    # International Institutional Frameworks


    # UNITED NATIONS


    The UN has increasingly focused on ICT-related issues for almost two decades,
    driven by positive benefits and malicious purposes deriving from the increased
    dependency on ICTs. The international system includes a series of built-in safety
    mechanisms that enable mitigating existing and new emerging threats. Different
    areas are priorities within this organisation, such as developing norms and standard
    behaviour and confidence and capacity-building in responding to online threats
    (UNIDIR, 2017, pp. 1–2). However, only a limited number of regulatory initiatives
    have progressed; yet, the progress has been slow due to geopolitics and different
    states’ priorities.


    In 2018, the UN General Assembly set up two separate groups to study international
    law and norms concerning cyberspace due to the deadlock of developing this area.
    A UN Resolution 73/27 was proposed by states, including Russia, to create the
    Open-Ended Working Group (OEWG). Another group of states, including Australia,
    France, Germany, the UK, the US, supported another proposal advocating to continue
    the existing Group of Governmental Experts (GGE) (Achten, 2019; EU Cyber Direct,
    2020; Peters, 2019; UN, 2019). These two groups are now working in parallel.


    The GGE and the OEWG groups aim to address cyber norms, confidence-building, and
    issues surrounding the implementation of international laws to cyberspace (Achten,
    2019; Geneva Internet Platform, 2020; Walker, 2019,


