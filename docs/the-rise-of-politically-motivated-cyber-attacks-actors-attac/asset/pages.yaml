    to the UN, funds stolen by the North-Korean state-sponsored hackers are used to
    finance the state, including the Korean People''s Army''s weapon and nuclear program
    (Cascar, 2021; Parsons & Bureau, 2020; Nichols, 2019). For example, between 2015
    and 2016, APT38, the Lazarus group, launched a wave of attacks over the SWIFT
    banking network, which generated 80 million dollars in hard currency (TrendMicro,
    2018; Vijayan, 2021; Parsons & Bureau, 2020).


    Within RGB, hackers are trained to attack for political and financial gains aligning
    with the state strategy. The RGB department consists of six bureaus with compartmented
    functions. These include operations, reconnaissance, technology and cyber capabilities,
    overseas intelligence, inter-Korean talks, and service support (US DoD, 2018a,
    p. 20; Cascar, 2021). In 2013, the Korean Leader, Kim Jong-un, praised the hackers
    working in the unit by calling them the “brave RGB”, and “warriors ... for the
    construction of a strong and prosperous nation” (Cascar, 2021). The RGB was formed
    in 2009, and it is supposed to counter the US Directorate of National Intelligence.
    The RGB formed Office 91 as the headquarter for hacking operations (Park, 2016).


    Within the structure of Office 91, Unit 110 and Bureau 121 are operational. Despite
    limited Internet capacity in North Korea, Bureau 121 is an elite cyberwarfare
