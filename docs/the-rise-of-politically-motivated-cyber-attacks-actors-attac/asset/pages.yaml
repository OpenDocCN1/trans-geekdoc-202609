- pgno: 132
  md: '# Motivation and Actors


    Cyberwar can be broadly understood as a war fought in cyberspace by targeting
    ICTS. The exact definition of cyberwar is still undefined. The global reliance
    on CI, CNIs, CIIs, and ICTs demonstrates that cyber conflicts’ potential scope
    and reach can be linked to the national state’s security and economic well-being
    (Touéré, 2011, p. 7). The innovations and new areas included in modern cyberwar
    and attacks are often perceived as ‘risk-free’ hi-tech ‘clean war’ of ‘surgical’
    strikes and minimised casualties (Merrin, 2018, p. 42). Cyberwar and warfare are
    not very different from conventional warfare on land, sea, or air. Direct cyber-warfare
    has the same dangers as conventional offline war, where a conflict quickly can
    escalate. Therefore, there is an incitement to have minor low-level, but well-executed,
    attacks that do not disrupt the global or geopolitical order (Kshetri, 2014; Parker
    & Kremling, 2017, p. 113; Barletta et al., 2011). China, North Korea, Russia,
    and the US are increasingly involved in cyberwar and warfare, building up capacities
    and capabilities on multiple levels. However, these states have different motivations
    to be involved in cyber attacks. Cyber attacks are also intricately linked to
    cybersecurity, so the states are engaged on multiple levels: offensive actions
    on adversaries’ virtual territory and cyber-defence of their own and allied’s
    virtual space. All actors use a hybrid method, including state actors and state-sponsored
    actors, to conduct the operations on behalf of the state.


    # China


    Over the years, Chinese state and state-sponsored actors have developed sophisticated
    means and methods for conducting cyber attacks. Many of these cyberactivities
    are conducted over a long time following the state strategy for political and
    economic growth. One of the means used is persistent advance threats against CI
    structures and services of public and private entities. Due to zero-day exploits,
    the threat actors can stay within the computer systems and networks for a long
    time until the vulnerabilities are patched.


    China has capitalised on cyberspace’s interconnectivity to make the state superior
    to other states worldwide. China was previously regarded as a second-tier cyberpower.
    However, the state has aggressively and consistently pursued its strategic goals
    of enhancing its cybercapacities and competencies to become one of the world’s
    leading cyberactors. The Chinese Communist Party uses its cyberstrategy to prioritise
    computer science and technology education to create a consistent talent pipeline
    for cybermilitary operations (Hlevek, 2020). The Chinese warfare strategies are
    based on the two areas. First, the strategies incorporate modern People’s War
    tactic. Second, they also incorporate the ancient 36 Stratagems by Sun Tzu by
    focusing on deceptive knowledge-based warfare tactics and an asymmetrical advantage
    over its enemies (Burrow, 2013, p. 10).'
  merge: -1
  img_proc: true
