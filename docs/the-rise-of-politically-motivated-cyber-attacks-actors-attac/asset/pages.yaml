    Over the years, several significant attacks have made headlines worldwide and
    enhanced people''s knowledge of the powers of these attacks. However, also security
    actors have increasingly reacted to these attacks.


    # DDOS ATTACK: ESTONIA


    The Estonian cyber attack in 2007 was a wake-up call, and it showcased the impact
    of cyber powers. European security institutions, governments, and private companies
    realised that there were considerable consequences to developing an advanced information
    society. This attack called for strengthening cybersecurity, regulation, and awareness
    is national and trans-national and cross-sectorial (European Commission (EC),
    2008, p. 2; EC, 2013; McGuinness, 2017; Roxana, 2013, p. 12; Tikk, 2011, p. 119).
    In Estonia, hackers closely linked to Russia blocked websites and froze the entire
    Internet infrastructure, i.e. banks, governmental activities, official documents,
    and email accounts (Archer, 2014, p. 611; BBC News, 2007; McGuinness, 2017). The
    attack was an international revelation because it exploited the vulnerabilities
    in the digital society with a significant impact on the population. Similarly,
    Georgia suffered a large-scale cyber attack during the 2008 conflict where pro-Russian
    hackers launched a DDoS attack towards Georgian websites. The attack was coordinated
    with the military invention during the Russo-Georgian war. The Russian hackers
    played an essential role in bringing'
  merge: -1
  img_proc: true
- pgno: 71
  md: 'down the network system, albeit without the same significant media coverage
    as the Estonia attack (Archer, 2014, p. 612; Siapera, 2018, p. 121).


    Although there have been other large-scale cyber attacks in the following years,
    the Estonia cyber attack stands out as a powerful attack and a starting point
    for considering cybersecurity and protection of CIs. After the attack on Estonia
    in 2007, the speaker of the Estonian parliament said:


    When I look at a nuclear explosion and the explosion that happened in our country
    in May, I see the same thing.

    (Munk, 2015, p. 176; Poulsen, 2007)


    State, state-sponsored, and state-supported actors are increasingly engaged in
    online attacks by developing and deploying offensive cyber capabilities targeting
    crucial infrastructures and services. Although destructive attacks are relatively
    limited, the numbers are rising (HM Government, 2016, p. 18).


    # MALWARE: STUXNET


    In 2010, the International Atomic Energy Agency visited the uranium enrichment
    plant in Natanz, Iran. At an early stage, the inspectors noticed failures in the
    centrifuges used to enrich the uranium gas. Later, a cybersecurity company from
    Belarus found malicious files on one of the systems. These files led to the discovery
    of what is now the first digital weapon, the Stuxnet worm. The worm was dissimilar
    to existing worms as it did not hijack the computers or stealing information from
    them. Instead, the aim was to cause physical destruction on equipment controlled
    by the infected computers (Zetter, 2014).


    The worm was based on an unprecedentedly masterful and robust malicious code that
    attacked in three phases. First, the worm attacked Microsoft Windows machines
    by replicating itself. Second, the worm targeted Siemens control systems, especially
    those controlling the Iranian uranium enrichment project’s centrifuges damaging
    1,000 centrifuges and delaying the project. Finally, the worm compromised programmable
    logic controllers allowing the attackers to spy on industrial systems and damage
    the fast-spinning centrifuges (Kushner, 2013; Ranger, 2018, p. 45). The size and
    the sophistication of the worm led experts to believe that it could only be developed
    with the sponsorship of a state. The US and Israel allegedly developed the worm,
    yet, this attribution remains unconfirmed (Kushner, 2013; Ranger, 2018, p. 45).
    The Stuxnet worm added a new dimension to cyberweapons by showing the powers of
    tailored malware and how they can simultaneously attack the physical and virtual
    world. The worm has been used as a base for other weaponised malware, such as
    Duqu, Flame, and Gauss. In 2012, the US cooperation, Chevron, admitted that Stuxnet
    had spread across its machines. This confirmation highlighted that the worm cannot
    be contained to its original target but works through machines based on its code
    (Kushner, 2013; McAfee, 2020).'
