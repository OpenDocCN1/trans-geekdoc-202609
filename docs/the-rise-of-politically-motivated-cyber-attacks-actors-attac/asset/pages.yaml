    In 2016, the member states agreed on prioritising their national networks

    and infrastructure, which also induced cyber education capabilities; mutual

    training and exercises; information sharing; and mutual assistance in

    preventing, mitigating, and recovering cyber attacks. One of the biggest

    challenges for the Alliance is to recognise the private industry and the civilian

    government’s involvement. The threat arising from cyberspace cannot purely

    be managed by military means, and the attackers are not necessarily state

