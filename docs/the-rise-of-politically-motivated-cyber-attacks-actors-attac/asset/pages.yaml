- pgno: 189
  md: '# The Political Element


    The groups do not have the same feature as traditionally actors promoting a particular
    political stance. These groups are political because they exploit a regulatory
    vacuum and gain support from national states allowing them to act with near impunity
    if their activities align with the state’s cyber strategy.


    # RANSOMWARE GROUPS: STATE-SUPPORTED GROUPS


    Attacks launched against Western states should be seen in synergy with the state-sponsored
    actors. The state-sponsored groups are separated by one degree from the state
    as they act alone under state actors’ direction. The state-supported groups are
    separated by two degrees from the state as they act solely on the group’s initiatives
    within a context defined by the state (Gross, 2021). On the one side, the ransomware
    groups do not have close ties to the state similar to state-sponsored groups.
    Usually, ransomware actors are non-state actors with no direct employment by the
    States. On the other side, they are not non-state actors exercising their right
    to protest. So the challenge is to classify these actors and identify the link
    to the state. States use various groupings to distance themselves from the activities
    – or indirectly support the actors as their activities align with the political
    agenda. Another method deployed by states is to indirectly support the actors,
    which creates a buffer zone between the state and the actors. This makes it easier
    for the state to deny involvement if these attacks are detected. The strategy
    to support or sponsor politically motivated actors is also beneficial in terms
    of the diplomatic repercussions of the cyber attacks (Hernández, 2021). The ransomware
    groups are not operating on the request of Russia, but they operate with the tactical
    acceptance of Russian strategies in terms of target selection (Khurshudyan & Morris,
    2021).


    # THE ''ONE RULE''


    The cybercriminals follow their agenda, mixing criminal and political activities
    with the state’s indirect support. The rationale behind the growing number of
    attacks originating from Russia is the ‘one rule’ of Russian hacking. The ransomware
    groups can attack anyone as long as the attack is not launched on friendly soil
    (Tidy, 2021b; Khurshudyan & Morris, 2021). In return, they are left alone by the
    state without the risks of prosecution. Because of the high ransom payment, these
    attacks are financially successful. This tactic creates a vicious circle where
    the attack form keeps developing and drawing more people into the illegal enterprise
    (Palmer, 2021a).


    There seem to be handshake agreements in place between the ransomware groups and
    the Russian state. As long as the ransomware groups leave Russia and selected
    countries alone, they can do whatever they want to and make money the way it suits
    them (Khurshudyan & Morris, 2021; Lee, 2021; Palmer, 2021a). As a result, the
    ransomware groups are becoming increasingly bold,'
  merge: -1
  img_proc: true
- pgno: 190
  md: 'showing off their wealth obtained from these ransomware attacks, knowing that
    tracing, arresting, and prosecuting would not happen within the safe states. The
    groups can operate freely as long as they play by the ‘one rule’ (Lee, 2021).


    The ransomware codes are evidence that precautions are taken. The ransomware codes
    are written not to be installed on systems that have Russian-language keyboards,
    coming from Russian IP addresses, or have installed Russian-language packs to
    prevent breaking the ‘one rule’ agreement (Khurshudyan & Morris, 2021). The underlying
    conditions from the ‘one rule’ agreements are as follows: leave Russia and Russian
    interests alone, and when the state needs the hackers, the groups will provide
    the help (Palmer, 2021a). Groups, such as DarkSide and REvil, are aware of the
    dangers of breaking the rule. The groups takes precautions to ensure they follow
    the ‘one rule’. For example, they vet business affiliates and customers. They
    conduct interviews in Russian to seek out potential Western intelligence actors
    to prevent them from infiltrating the organisations (Khurshudyan & Morris, 2021).


    Not all ransomware attacks are linked to state or state interests despite originating
    from a country well known to be involved in attacks. However, intelligence services
    likely co-operate with cybercriminals to engage in intelligence gathering. When
    the US Treasury Department sanctioned the group Evil Corp in late 2019, the department
    has also claimed that the Russian security service, the FSB, cultivates and co-opts
    hackers to engage in ransomware attacks (Khurshudyan & Morris, 2021). This loose
    partnership between groups allows state actors to explore enemies’ computer systems
