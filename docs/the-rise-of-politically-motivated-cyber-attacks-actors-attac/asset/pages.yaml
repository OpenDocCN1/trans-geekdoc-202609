  md: '# # 2 The Growing Online Threat


    The Actors


    # ## Introduction


    Politically motivated cyber attacks are not a new phenomenon. However, online
    attacks are increasing in frequency and severity where the attackers exploit the
    technological development, interconnectivity, and interdependencies on computer
    systems and services. The motivation for attacking and how the online attackers
    operate is essential to understand how they use the online environment, developing
    means and methods to access, exploit, disrupt, and destroy vital online assets
    and services.


    This chapter sets out critical questions for understanding problems related to
    the current classification of the groups and the legal and strategical issues,
    which are focus points throughout this book. The chapter focuses on defining different
    groups and actors offline and online and takes it outset in the classifications
    of offline groups. The groups are very diverse, but they are either state or non-state
    actors. The critical part of the classification is whether the groups have links
    to state actors or act purely outside the state apparatus. This chapter also includes
    a brief introduction to the architecture of the Internet platforms to understand
    the usefulness of the virtual space to launch attacks and communicate.


    # ## Cyberspace and Politically Motivated Actors


    Cyberspace is often perceived from two contrasting perspectives, increasing the
    complexity of defining activities and actors. Cyberspace creates opportunities
    for new ways of carrying out attacks. It is widely recognised as a strategic environment
    for future conflicts: irregular and traditional (Macdonald & Mair, 2015, p. 10).
    There is a diversity of actors involved in cyber attacks; some individuals or
    groups are engaged in the thrill, the challenge, or the money. Other actors conduct
    attacks to damage or destroy critical infrastructures (CIs), such as power grids,
    water supplies, hospitals, etc. The dangers are numerous, spanning from stealing
    sensitive data or holding the hostage to potentially damage nuclear power plants,
    which can constitute a threat to everyday life – or have the ability to kill people
    (Parker & Kremling, 2017, p. 89). The groups'
  merge: -1
  img_proc: true
- pgno: 33
  md: 'Table 2.1 Actor characteristics


    | Groupings | Characteristics |

    | :--- | :--- |

    | **State actors** | Sophisticated attacks<br>More resources are available to
    develop and conduct high-level attacks<br>Hierarchical command lines |

    | **Non-state actors** | Less sophisticated attacks<br>Innovative activities,
    using operational capabilities to develop new methods<br>No or limited hierarchical
    command lines |


    Source: Holt et al. (2018, p. 392).


    are often separated due to their involvement with the state, i.e. state actors
    and non-state actors.


    The state actors are operating within the confinement of the hierarchical structure
    of the state. Non-state actors come together in loosely formed networks to communicate
    and plan their actions using web forums, instant messaging, and social networking
    sites to enable new networked formations useful for the attack. This formation
    is beneficial to these actions as the actors can quickly join the network to complete
    the attack to disband the collaboration upon completion (Holt et al., 2018, p.
    392). This is also a tactic that has been used by the state-supported groups who
    are enjoying a high level of freedom as longs as they operated within the overarching
    strategies of the state.


    # The Definitional Lacuna


    The lack of clear definitions of cyber attacks has been an issue from the early
    days of using the Internet for politically motivated attacks. In 1999, the then
    US President Clinton used the term ‘computer hackers’ about ‘cyberterrorists’.
    Yet, no definition was developed to distinguish hackers and terrorists. At the
    same time, Clarke, the US’ national coordinator for counterterrorism efforts,
    used information warfare in relation to hackers. Clarke linked information warfare
    to rogue states, terrorist groups, or criminal cartels that could carry out an
    illegal intrusion into computer systems on the national level. The overall effect
    could be compared with the strategic bombing of CIs during World War II (WWII)
    (Bowman-Grieve, 2015, p. 93; Ranger, 2018). The number of attacks has increased
    significantly, and new means and methods makes it important to define groups and
    attack forms.


    Just as several cybercrime groups and individuals expose the online environment
    for personal and financial gain, the political actors do the same. Politically
    motivated cybercrime crimes have developed since the late 1980s, but online attacks
    have dominated the area since the late 2010s, where reports'
  merge: -1
  img_proc: true
- pgno: 34
  md: 'of new attacks are constantly being broadcasted. Cyberspace, the Internet,
    and virtual spaces are progressively embedded in political actors’ strategies
    within the online environment. There are significant overlaps between political
    groupings in the offline environment and those developing online. However, there
    are also distinct features. The threats come from national states, groups, and
    individuals following a political agenda (Anderson, 2008). The actors embrace
    technological developments to expose gaps in computer systems, networks, and infrastructures
    underpinning the online environment. New large-scale attacks have emerged based
    on known means and methods, whereas new types develop parallel to them, making
    the area difficult to define. Understanding the different online politically motivated
    attacks and groupings needs to be considered in light of offline political systems
    and offences.


    # Politically Motivated Actors


    Politically motivated groups can be challenging to conceptualise. There are several
    different groupings, motivations, and activities, spanning from warfare situations
    to activism. This broad political spectrum includes state actors, para-militant
    or patriotic groups, terrorists, hacktivists, and activists groups. Regarding
    ordinary and political crime, the “law is formal expression


    Table 2.2 Outline of war and warfare groups and tactics


    | Types | Characteristics | Actors |

    |---|---|---|

    | War and warfare | War is defined as large-scale violence | Organised between
    political units |

    | Proxy war | The product of a relationship between a state and non-state actors
    external to a conflict. Providing weapons, training, and fundings to a proxy |
    The proxy replaces the state Avoiding being dragged into a costly and often lengthy
    war. |

    | Hybrid war | Low-level conflict that includes the full spectrum of capabilities
    Synchrounise various instruments of powers simultaneously and intentionally |
    Combines state and non-state actors under the state authority Merging conventional
    and unconventional warfare |

    | Irregular warfare | Consisting of surprise attacks, guerrilla tactics, and terrorism
    to reach a political objective | Predominately used by non-state actors who do
    not have the monopoly of the legitimate use of force |


    Sources: Bull (1977); Hoffmann (2009); Kiras (2019, pp. 184–185); Mumford (2013a,
    p. 11, 2013b); Naëjer (2020); Williams (2008, p. 157).'
