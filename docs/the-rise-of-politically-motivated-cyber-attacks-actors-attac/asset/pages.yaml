- pgno: 197
  md: 'increased the rhetoric stating that Russia appears to harbour groups like DarkSide
    and REvil. Yet, there is no clear evidence that Russia is directly involved in
    these activities (Khrushdyan & Morris, 2021). The cost–benefit calculation is
    essential to consider in relation to the accommodation offered by the host government
    to the groups. The ransomware groups know that they can operate freely if it does
    not create collateral damage for the host country. However, this position might
    change if the international society imposes a cost. For example, with the new
    link between ransomware and terrorism, the targeted states might impose harsher
    measures as deterrence. For example, the targeted states have different options
    to change the status quo. They can decide to do nothing or impose costs by retaliating
    against the groups and their sponsors (Sandler & Arce M, 2003, p. 7). They can
    also decide to enhance their defensive measures by making it more difficult to
    launch successful attacks. That would involve closer cooperation with relevant
    stakeholders, national and transnational. They can also do both by developing
    a multilayered strategy.


    # STRATEGIES AND COSTS


    The ransomware operators’ essential tactics and operations are usually associated
    with terrorism. The preferred tactic is intimidation, coercion, extortion, property
    damage, disruption of services, and public order. All these elements are included
    in terrorism definitions worldwide. This means that the global community should
    consider all these threats as terrorism based on the apparent threat to economic
    prosperity and security. However, little has been done to make this link beyond
    the US stance. It is time for authorities to start managing the threats, including
    classifying ransomware activities as a form of terrorism (Hathaway, 2021). NATO
    has highlighted that Russia constitutes a threat due to its intensified hybrid
    actions against its member states and partners, including proxies’ actions. The
    cyber threats to the member states’ security are complex, destructive, and coercive,
    were systematically and frequent ransomware attacks and other malicious cyber
    attacks constantly target CIs and democratic institutes (NATO, 2021).


    Governmental counter-terrorism strategies are either proactive or reactive. Proactive
    strategies allow the state actors to go aggressively after the groups to eliminate
    their operational capacities, such as destroying their resources, infrastructure,
    and actors. The reactive strategy includes a proactive measure to limit the consequences,
    such as diverting the attack (Sandler & Arce, 2003, p. 7; Arce & Sandler, 2005,
    p. 184). Therefore, states should weigh the cost and the payoff for each deterrence
    and defensive strategy they choose to impose for both the host state and the groups.
    Russia and the ransomware groups are currently benefiting from their relationship.
    As long as the cost is not increasing, Russia has no reason to change its strategic
    position. The groups fulfil Russia’s agenda by causing chaos and uncertainty in
    Western states. However, if the Western states begin to impose costs, such as
    sanctions'
