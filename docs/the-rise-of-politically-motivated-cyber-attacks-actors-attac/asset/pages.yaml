- pgno: 266
  md: 'Protecting CIs is becoming a significant challenge, and the number of attacks
    has revealed numerous vulnerabilities in the current structure. The escalating
    cyber attacks and the complexity of systems are some of the main issues (Gilligan,
    2021). Public and private entities are operating in a complex, global, and digital
    ecosystem. The reliance on CIs is growing. People are beginning to understand
    the damage these politically motivated attacks can inflict on society, where computer
    systems run services at hospitals, emergency services, power and water plants,
    etc. (Janicke, 2018). The systems are primarily interlinked entities with customers,
    suppliers, and managed system providers. All these entities form a complex system
    that creates obstacles for the actors to assess their vulnerabilities: Due to
    the interconnectivity, they are equally exposed to those of their participants.
    Additionally, the actors are trying to implement cybersecurity and standards and
    adhere to fragmented regulations in this area (Bravo, 2020).


    The number of attacks highlighted in Chapters 5, 6, and 7 demonstrate that the
    current security level is patchy. There is a constant flow of attacks targeting
    CIs which are depending on the online environment to function. Attackers are testing
    the resilience level of different systems. So far, they have been successful in
    finding substantial weaknesses (Gilligan, 2021). With the current structure, it
    is not likely that this is going to change. Therefore, a more comprehensive approach
    is needed, which includes cooperation between key public and private stakeholders
    to enhance the resilience level across sectors. Although most states have developed
    cybersecurity strategies, there needs to be a more interactive approach for cooperation
    in the borderless online space. It is in both the public and private interest
    that the security level increases. Like the national strategies, the private sectors
    should develop similar policies that link into a multilayered approach covering
    both the technical and human sides.


    In the aftermath of the breach on the Colonial Pipeline, US President Biden signed
    an exclusive order to enable specific security mitigation to enhance the security
    and responses to the attack (Huey et al., 2021). Similarly, CISA and the FBI issued
    a list of recommendations for owners and operators to reduce the risk of ransomware
    attacks. These recommendations included multifactor authentication for remote
    access to the information technology and the operational technology, etc. (Magill,
    2021; CISA, 2021). It is good that initiatives are launched to secure these areas,
    but these reactive responses came too late when several attacks had caused substantial
    damage. Attacks on CIs are not new, and they should already be a high level of
    cybersecurity awareness and measures to create resilience towards attacks. Additionally,
    there should be a requirement of introducing proactive measures to ensure the
    facilities, the networks, and the computer systems. Proactive measures would preemptively
    identify security weaknesses and threats before the attack. Yet, this should be
    combined with reactive measures to immediately mitigate the incidents and prevent
    repeating attacks (ThinkTech Advisors, 2021).'
