- pgno: 126
  md: '# 5 Cyberwar and Warfare


    # State and State-sponsored Attacks


    # Introduction


    Although most states worldwide have developed cyber capacities and capacities
    for deterrence and defence, there are a growing number of incidents where states
    are directly attacking foreign public and private entities. However, these attacks
    are low-key events launched below the threshold of cyberwar, which makes them
    problematic to manage. States are increasingly relying on state-supported actors
    to conduct the attack. This use of proxies removes the state from the actions
    where these groups act independently but under the directions of the state. States
    claim that they adhere to international law. At the same time, they are using
    a tactic not covered by the international framework. There is a legislative lacuna
    regarding the protection of vital assets, online users, and behaviours that is
    exploited by states. Therefore, this chapter will online the essential parts of
    international law and apply them to the online actors and actions. The chapter
    focuses on a selection of states which are constantly engaged in online attacks,
    i.e. China, North Korea, Russia and the US. The main discussions are centred around
    motivations, the actors and the means and methods used. These three areas will
    be linked to the current cybersecurity framework and the lack of legislation to
    manage the area.


    # Conceptualising War and Warfare


    For years, cyberwarfare or information warfare has been considered an exaggerated
    threat unlikely to cause impact beyond the time-limited attack. However, this
    stance has changed substantially from an abstract idea to a core element of modern
    warfare. States and military units have adopted cyberwar and warfare as a core
    strategy for future wars and ongoing disputes where control, attack and defences
    are instrumental. Several attacks are linked to espionage or disrupting CIs using
    sophisticated techniques or zero-day exploits (Shaikh, 2014). Strategic targets
    in cyberwar and warfare are to attack privately owned and publicly operated platforms
    and services where the impact on the civil population is severe, i.e. businesses,
    corporations, groups, and individuals. These attacks can be part of espionage,
    an act of warfare,'
  merge: -1
  img_proc: true
- pgno: 127
  md: 'or retaliation. CIs act as a pathway to attack and target politically motivated
    adversaries (Zittrain, 2017, p. 300).


    Modern war and warfare are regulated through a set of international laws. Violence
    and attacks are not necessarily interlinked. However, violence is common in all
    types of war and warfare situations, where the intensity differs depending on
    the type of conflict and the weapons used. Moreover, the violence used in these
    situations is also linked to the existing regulation (Jakobi, 2020, p. 136). The
    basic framework of cyberwar and warfare is mainly developed during the last century
    as a part of conventional warfare, and some key documents are still useful for
    assessing state-based cyber attacks. The Charter of the UN (1945), the NATO Treaty
    (1949), the Geneva Conventions (1949), the Geneva Protocol I (1977) were introduced
    to protect victims in international conflicts. At the same time, the Hauge Conventions
    included the laws and customs of war (Hauge II, 1899; Hauge IV, 1907).


    Additionally, the Convention on Prohibitions or Restrictions on the Use of Certain
    Conventional Weapons (1980) covers weapons that might be considered excessively
    Injurious or has indiscriminate effects (UN, 2020; NATO, 1949; ICRC, 1949; ICRC,
    1977; ICRC, 1907; UN, 1980). The laws apply to military activities and operations
    to prevent unnecessary suffering and destruction in wars (Westby, 2011, p. 84).
    Concerning cyberwarfare, special attention should be drawn to civilians. In cyber
    conflicts, these civilians are individual online users, businesses, and civil
    society as a whole. This includes entities with no links to governmental actors
    or the actual conflict. They should have the same protection as civilians in conventional
    warfare.


    # Offline War and Warfare Definitions


    JUS AD BELLUM


    The fundamental rule in the use of force in war and warfare is the prohibition
    of the threat or use of force included in article 2(4) of the UN Charter (Gray,
    2004, pp. 5, 29). Concerning Jus ad Bellum, the principle is founded primarily
    in Articles 2(3)—(4) and Chapter VII of the UN Charter, stating that all member
    states should settle international disputes by peaceful means to avoid that international
    peace and security is endangered (Article 3). According to this principle, member
    states should refrain from threats or use force against other states’ territorial
    integrity or political independence (Article 4) (Morris, 2019, pp. 117–118). Included
    in the concept of Jus ad Bellum are just cause, legitimate authority, right intervention,
    last resort (necessity), proportionality, and the prospect of success. For example,
    a sovereign authority can wage war, but there must be a just cause for war, such
    as self-defence or enforcing human rights. The principle also states that all
    peaceful means for resolving a dispute should be exhausted before taking action.
    Moreover, it should be considered that it is likely that the actions taken would
    be successful (Hough, 2008, p. 39; Finlay, 2019, p. 28; Westby, 2011, p. 84).'
  merge: -1
  img_proc: true
- pgno: 128
  md: "Jus in Bello has two principal subdivisions. These are generally named ‘Geneva\
    \ law’ and ‘Hague law’ to recognise the principal treaty series they founded.\
    \ The Geneva laws regulate the protection of the victims in armed conflicts. Currently,\
    \ the Geneva laws are based on the four 1949 Geneva Conventions covering (I) wounded\
    \ and sick on land; (II) wounded, sick, and shipwrecked at sea; (III) prisoners\
    \ of war; and (IV) civilians (ICRC, 1949). Additionally, Article 48 of the 1977\
    \ Protocol I to the Geneva Conventions of 1949 set out the basic rules:\n\n> [T]he\
    \ Parties to the conflict shall at all times distinguish between the civilian\
    \ population and combatants and between civilian objects and military objectives\
    \ and accordingly shall direct their operations only against military objectives.\n\
    > \n> (ICRC, 1977)\n\nThis is an important principle as it is directly applicable\
    \ to the online environment (Dinstein, 2012). Unfortunately, little attention\
    \ is given to online users about cyberwarfare and ongoing online conflicts involving\
    \ state and state-sponsored actors. Online users of all ages suffer unnecessarily\
    \ and disproportionally from a large-scale attack against CIs due to the disruption,\
    \ the damage, the espionage, and the theft of personal data from these activities,\
    \ the risks of becoming a victim, and uncertainties associated with these types\
    \ of attacks. Therefore, rules to protect online users who are not a part of the\
    \ cyber conflicts should be prioritised\n\nThe Hague laws regulate the methods\
    \ and means employed in war and warfare. These include control on types of weapons,\
    \ usage, tactics, and the general conduct of hostilities. The Hague laws are based\
    \ on the Hague Conventions of 1899 and 1907 in conjunction with the 1977 Additional\
    \ Protocol III to the Geneva Conventions (ICRC, 1899; ICRC, 1907; ICRC, 1977).\
    \ This protocol includes methods and means of warfare and discrimination in bombardment\
    \ (Morris, 2019, p. 171). Military targets are those, that by nature, location,\
    \ purpose or use, effectively contribute to an enemy's military capabilities,\
    \ which can be totally or partially destroyed or neutralised during the attack\
    \ to enhance legitimate military objectives. In the Geneva Conventions, protected\
    \ targets are outlined, such as hospitals, transportation of wounded or sick,\
    \ religious or cultural areas, or safety zones. There are limitations to this\
    \ provision; if these targets are exploited for military purposes, they might\
    \ become legitimate military targets (Westby, 2011; ICRC, 1949). Yet, it is significant\
    \ that attacks are launched towards CI online systems and networks, with no links\
    \ to military purposes.\n\nThe different worst-case scenarios are weighed up against\
    \ each other. For example, the wrong of non-resistance should be greater than\
    \ the wrong of fighting. The payload should be considered together with means\
    \ and"
  merge: -1
  img_proc: true
- pgno: 129
  md: 'methods. Especially, if the method enacted deliberately killing people who
    otherwise are immune from attacks. In this context, it is essential to consider
    whether the harms inflicted are unnecessary for pursuing the military objective,
    are disproportionate to the goal/values, or the military activities are less likely
    to satisfy the criteria of Jus in Bellum regarding immunity. The principles incorporated
    in Jus in Bello states that the measures used need to be proportionate to the
    wrong being rectified. Therefore, these means should not be introduced beyond
    what is necessary, and they should not be used as retributions (Hough, 2008, p.
    39; Finlay, 2019, p. 28; Westby, 2011, pp. 84–85).


    # International Law and Cyberspace


    The UN Charter, the Geneva Conventions, the Hague Conventions, and the NATO Treaty
    are silent about cyber conflict and online attacks as a part of an ongoing conflict.
    Although the UN Charter and the NATO Treaty include territorial integrity, armed
    force, air, land or sea forces, and armed attacks, no amendments have been adopted
    to cover cyberspace. Therefore, online military conflicts are not directly covered
    by international law (UN, 2020; ICRC, 1949; ICRC, 1899; ICRC, 1907; ICRC, 1977;
    NATO, 1949; Westby, 2011, p. 86).


    The frequency, scale, and impact of cyber attacks are escalating. The states have
    embraced the online environment to conduct different types of attacks depending
    on their overall strategies. There is not only one technique, one target type,
    or one pathway to take. The online environment provides an incredible number of
    possibilities for attacking. Because of the increased use of proxies acting on
    behalf of states or in close cooperation, the role of these actors should be established.
    The critical point is how the state uses these state-sponsored actors to create
    a buffer between the state and the target. This use of proxies enables the state
    to overcome the different prohibitions in international law and custom. NATO has
    highlighted that state and state-sponsored attacks present an imminent challenge
    as these attacks can substantially impact cyberspace or the physical domain. However,
    state and state-sponsored groups’ activities are different from other politically
    motivated actors as the cyber attacks conducted require a high level of detailed
    knowledge, skills, and abilities. Developing and conducting these attacks requires
    substantial financial and organisational resources. It is unlikely that other
    actors than states and their proxies have the funds to meet this threshold (Davis,
    2019, p. 2).


    The Estonia attack in 2007 was a wake-up call, and cybersecurity strategies have
    been widely developed to manage cyber defence against attacks and enhance the
    resilience and preparedness level. Nevertheless, very little has been done to
    develop cyberwarfare conventions to regulate online conduct, weapons, protection
    of particular targets and civilians (online users). There is a legislative lacuna
    regarding cyber weapons and the groups involved in cyberwar and warfare. These
    areas should be regulated under the Hague'
  merge: -1
  img_proc: true
- pgno: 130
  md: 'Conventions. Additionally, there is a call for broader protection of CIs to
    prevent unnecessary damage, harm, and suffering. These provisions should ensure
    that essential communication routes, entities, services, and networks are constantly
    international.


    The first Tallinn Manual 1.0 (2013) covers the laws applicable to armed conflicts,
    whereas the second Tallinn Manual 2.0 (2017) covers a broader scope, including
    cyber operations in and outside an armed conflict. However, the two manuals do
    not outline a doctrine (Schmitt, 2013; Schmitt, 2017). They only provide an attempt
    on applying international law to cyberspace at the time they were drafted. The
    Tallinn Manual 1.0 has removed the uncertainty regarding the nature of cyber operations
    by extending customary international law to cyber conflicts. The Tallinn Manual
    recognises that the use of force regardless of means violates customary international
    law. However, the manual also states that a cyber attack must not rise to the
    level of an armed attack, and the manual does not rule out cyber attacks as illegal
    (The Cyber Diplomat, 2019; NATO CCDCOE, 2013; NATO CCDCOE, 2017; Seker, 2020).


    # Cyberwar and Warfare


    For military operations, technological development has sharply increased the combat
    capabilities for troops. By selectively targeting the adversary’s computer systems,
    networks, infrastructure, and services of military and civilian actors, it is
    possible to terminate a conflict before deploying kinetic combat operations (Barletta
    et al., 2011, p. 75). Yet, it does mean that there is no impact beyond the computer
    systems and networks. The harmfulness and frequency of attacks can have far-reaching
    potential. Attacks can impose considerable online damage, as well as extensive
    physical damage. The contagious element of persistent and sustained cyber attacks
    creates a pathway for various political actors to engage in asymmetric cyberwarfare
    (Barletta et al., 2011). Businesses, governments, and utilities are increasingly
    dependent on computer systems, networks, and the Internet. This makes these areas
    attractive pathways for state and state-sponsored actors. Cyberwarfare offers
    state actors and governments several possibilities to weaken their opponents.
    These actors weigh up their strategic possibilities by using cyber attacks often,
    but on a level that does not trigger an actual war (Simmons, 2011; Kshetri, 2014,
    p. 5).


    # STATE-SPONSORED GROUPS


    Outside the core areas of the state, non-state actors are included in war and
    warfare. Instead of entering a war conflict alone, a state might hire help from
    non-state actors to get the job done (Salehyan, 2010, p. 494). The conventions
    are straightforward; only lawful combatants authorised by a governmental authority
    can engage in the hostilities. However, irregular forces can still be'
  merge: -1
  img_proc: true
- pgno: 131
  md: 'engaged, but that should happen under the command of state actors. There are
    clear rules for this person-in-command. The state actors should be recognisable
    from a distance, carry arms openly, and conduct operations in accordance with
    the law of wars conventions (Westby, 2011, p. 84). However, a tactic used by states
    is to empower rebel organisations or para-militant groups as substitutes. By doing
    so, the state circumvents the international requirements included in Jus ad Bellum
    and Jus in Bello by distancing themselves from the attacking groups (Salehyan,
    2010, p. 494). Empowering non-state actors have clear benefits for the military
    units. Non-state actors are cheaper, act faster, and the rule of wars does not
    bind them. The state actors can also complement their political agenda using non-state
    actors in joint military operations (Salehyan, 2010, p. 494).


    The justification for using state-sponsored groups goes in two directions. First,
    it is cost-effective as the proxies do not require much support. Often, it is
    enough to give the hackers a target list with vectors, and then, they work their
    way through the list autonomously. This process distances the state even further
    from the actions. The hackers can be mobilised quickly, and they can also easily
    be disbanded when their skills are no longer needed. Often, the state-affiliated
    or sponsored actors are aligned with the state''s political, commercial, or military
    interests. The primary motive for state-sponsored activities is to destabilise
    the political and financial balance to promote their own goals (Pratley, 2015;
    Goud, 2019). Second, proxies create a buffer between the attack and the state,
    where the hackers create a distance to the state apparatus to cause confusion
    about the attack.


    Various types of irregular cyber forces should be made illegal. The attacker can
    be an insider, a lone hacker, a rough actor, an organised criminal, a terrorist,
    or a national state. It is a difficult task to track and trade the attackers and
    criminal activities. Often, it is impossible to attribute the attack to a particular
    individual, group, or state. Moreover, this buffer ensures that investigations
    into attacks rarely create the direct link between the target, attack route, state,
    governmental networks, or Internet protocol (IP) addresses (Connell & Vogler,
    2016, p. 9).


    Contrary to the rules of war, the attackers or the people involved in the attack
    do not wear distinctive emblems. They cannot be identified from a distance. Even
    skilled researchers and investigators can struggle to find the attacker, the origin
    of the attack, and the attack''s motivation. Often attacks are attributed to known
    hackers, known groups'' motivation, and an identifiable means and method, rather
    than a clean-cut identification (Westby, 2011, p. 90). State-sponsored attacks
    have proven very rewarding and can be conducted at relatively cost/low risk. The
    likelihood of gaining clear evidence sufficient to link the attacker to an even
    and a state is extremely low. Moreover, there is a high success rate associated
    with these operations. States that have used this practice have increased their
    capabilities significantly, whereas the states not using this strategy are left
    behind (Pratley, 2015).'
