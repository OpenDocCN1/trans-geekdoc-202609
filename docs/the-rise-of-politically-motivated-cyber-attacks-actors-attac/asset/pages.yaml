    # # Ransomware-as-a-Service ( RaaS)


    RaaS is a new model designed to enable an attacker with little knowledge of malware,
    coding, or cyber attacks to conduct an attack, such as ransomware, to generate
    a profit (CIS, 2021). The RaaS enterprise enables non-technical criminals to launch
    ransomware attacks by leasing ransomware variants. The franchised use of ransomware
    can enable everyone to get the operation up running quickly and affordably. The
    RaaS groups allow other cybercriminals to lease ransomware variants for operations.
    However, the methods vary from simple attacks to increasingly sophisticated attacks
    conducted by technically knowledgeable criminals (Crowdstrike, 2021; Ransomware
    Task Force, 2021, p. 5).


    The RaaS businesses provide a user-friendly service that allows attackers to select
    their victim, claim a ransom, provide a bitcoin wallet address, and'
  merge: -1
  img_proc: true
- pgno: 185
  md: 'deploy the ransomware attack. The RaaS services, then, take a percentage of
    the paid ransom (CIS, 2021). The RaaS groups are competitive online. They run
    marketing campaigns, business websites, videos, white papers and have an active
    Twitter presence (Crowdstrike, 2021). These forums often require a deposit from
    the customers, which they will get back if the ransomware does not perform as
    expected (Europol, 2020; Goodin, 2020). Other more established ransomware groups
    have already raised the bar by only allowing trusted affiliates into their programs.
    To be accepted, the customers need to have displayed their capabilities to infect
    large companies. Moreover, RaaS groups like REvil expels groups that cannot infect
    large companies or are inactive on the platform for more than a week. (Europol,
    2020, p. 27; KrebsOnSecurity, 2021).


    DarkSide surfaced in 2020 on Russian language hacking forums. The DarkSide sells
    malware and hacking services to cybercriminals, who breach companies. The attackers
    use DarkSide’s services to lock up data, progress the ransomware negotiation,
    and leaking files if the victim does not pay the ransom (Brewster, 2021; Gross,
    2021; Bostrup, 2021). DarkSide also promotes services on the Dark Web, where several
    main Russian-language forums function as both advertising platforms and a facilitator
    allowing various groups to interact and form partnerships (Gross, 2021; Bostrup,
    2021). This group claims that it only targets big companies. It has imposed a
    form of attack ethics forbidding its affiliates from launching attacks on organisations
    within several industries, such as healthcare, funeral services, education, the
    public sector, and non-profits (KrebsOnSecurity, 2021). In 2019, the REvil was
    identified as behind several high-profile attacks and they increased their activities
    (KrebsOnSecurity, 2019; KrebsOnSecurity, 2021). REvil has also based its operations
    on the RaaS business model to conduct operations, recruit affiliates or partners,
    and spread the malware (Palmer, 2020; BBC News, 2021a).


    # Means and Methods: Deterrence and Defence


    Ransomware is currently the most flourishing criminal industry, which constitutes
    a risk to individuals’ personal and financial security and threatens national
    security and human life (Ransomware Task Force, 2021, p. 7). A series of uncoordinated
    attacks have been launched against energy infrastructure, healthcare, and transportation
    services. A group of attackers’ intent to cause chaos could infect several systems
    online in simultaneous attacks aiming to crippling numerous elements of CI and
    NCIs (Chapple, 2021). Beyond the economic impact, where the attackers gain monetary
    reward for their attacks. Attackers also select their target based on their profile
    and whether the attacks will impact societal, political, and economical.


    The targeted institutions and industries lack an adequate level of protection
    against these attacks. Public institutions and IC services often have irreplaceable
    data that would have a long-term impact if they were made unavailable. This makes
    it more likely that the victims would pay the ransom to get the encryption code
    and restore the computer network (Lutkevich,'
  merge: -1
  img_proc: true
