    # Means and Methods: Deterrence and Defence


    States agree that international law applies to activities in cyberspace, including
    the principles of sovereignty and non-intervention. However, the interpretation
    of these rules differs. This has created legal uncertainties. Some states prefer
    this as it allows more room for their actions. Moreover, they believe that stricter
    rules could be damaging for pursuing their interest in cyberspace. Adhering to
    rules is essential for state actions, and a clear legal base would clarify how
    and when to engage in cyber operations and when it is possible to make assertions
    if other states break the rules (Moynihan, 2019, p. 4). States are using cyberspace
    to alter the balance of information and gain advantages in the long-term cyber
    competition. The complexity of having various cybersecurity frameworks developed
    regionally and nationally creates an unbalanced level of rules, participants,
    and responses. The current game plan for states includes cyber espionage, destruction,
    and retaliation within broad coercive campaigns and crisis bargains. Through these
    attacks, the actors signal their capacities or determine their rivals’ abilities
    and resolve to attack (Jensen et al., 2020).


