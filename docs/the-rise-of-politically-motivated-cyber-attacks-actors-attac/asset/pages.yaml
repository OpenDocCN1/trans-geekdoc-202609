  md: 'were previously seen as a nuisance and managed in isolation. But they are now
    becoming a national security problem and can no longer be managed in isolation
    (Gura, 2021). Ransomware attacks have reached a significantly dangerous level
    where ransomware groups paralyse computer networks of essential CIs and services.


    These attacks affect the public beyond the original target. For example, various
    police departments have been targeted by ransomware groups. These attacks have
    caused a substantially high level of interruption of essential services. Emergency
    phone lines and services are taken down; important case files are either not accessible
    or have disappeared (Suderman, 2021). In 2019, a ransomware attack on an unnamed
    US Maritime Transportation Security Act (MTSA)-regulated facility shut down the
    service for 30 hours (The Maritime Executive, 2020; Ransomware Task Force, 2021,
    p. 7). There have also been attacks on public services. Several local councils
    worldwide have been targeted in attacks. Ransomware groups have attacked significant
    metro centres like Hackney (London), Tulsa, Baltimore, Denver, Knoxville, and
    New Orleans. In 2021, The City of Liege in Belgium has been attacked. This attack
    was a warning to the EU after it launched a new Joint Rapid Response Team to manage
    cyber attacks (Cimpanu, 2021a).


    Although ransomware attacks are not actual repeated violent actions, they have
    the required element of danger. Cyber attacks are not considered as being physical
    in the same way as conventional terrorism. However, there are physical elements
    included. Although the attackers are moving around in a nonphysical sphere, cyberspace,
    they might launch an attack on a physical medium such as a healthcare facility
    or a power plant. Some of these attacks might not be dangerous in themselves,
    but they create dangerous situations by stopping access to vital services (Patel,
    2021, p. 32). Harm and injury based on ransomware attacks are at risk, as the
    frequency and the cost of these attacks are growing (Hathaway, 2021). Clearly,
    attacks on energy grids, nuclear plants, or critical assets could have devastating
    consequences, including human casualties (Ransomware Task Force, 2021, p. 7).


    In February 2020, a ransomware attack on a natural gas pipeline operator shut
    down the operations for two days (Ransomware Task Force, 2021, p. 8). In 2020,
    Ragnar Locker was behind a ransomware attack against the Portuguese multinational
    energy company Energias de Portugal (EDP). Stealing or damaging property also
    falls under the scope of danger if it belongs to a public or private entity and
    is linked to essential services (Patel, 2021, pp. 32–33). The EDP attack is significant
    as it affected a company delivering an essential service to 19 countries on four
    continents with a customer base of more than 11 million households. The ransomware
    group threatened to leak more than 10TB of sensitive files if the ransom was not
    paid. These documents include confidential information about billing, contracts,
    transactions, clients, and partners (Gatlan, 2020; Muncaster, 2020).'
