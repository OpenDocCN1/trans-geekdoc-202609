    # Cyberterrorism Definitions


    Like conventional terrorism, there are no comprehensive and universal recognised
    definitions of cyberterrorism (Dogrul et al., 2011, p. 31). The first time the
    term ‘cyberterrorism’ appeared was in the mid-eighties. The concept appeared as
    a vaguely formulated idea at the early stage of developing computer technologies.
    No one could predict how influential computers networks and devices would be in
    everyday life (Luijf, 2014).


    Like cybercriminals, adoption of the online environment to reach a broader audience,
    terrorists, extremists, and activists has embraced the benefit of online operations.
    Traditional terrorist groups have used the Internet to spread ideas, recruiting
    and communicating, but the use of virtual spaces, networks, and computer technologies
    goes beyond these practices. As state actors, non-state actors use the online
    environment to promote their causes by conducting cyber attacks in various forms.
    These actions can cause an incredible impact on society when targeting various
    essential CIs (Halopect, 2014).


    Denning argued (2000) that an attack should result in violence against persons
    or property or at least cause enough harm to generate fear (Denning, 2000; Weimann,
    2004, p. 4). The claim that there should be violence included is problematic.
    However, there can be significant damage online and offline caused by cyber attacks.
    It is an outbuded presumption that they should be an element of violence and threat
    of violence in real life for an attack to be classified as cyberterrorism. Therefore,
    attacks on computing systems and data destruction would not count as violence
    (Conway, 2014, p. 2). However, with the merger of online and offline life and
    the increasing use of computer technologies, systems, devices, and networks on
    multiple levels, that argument'
  merge: -1
  img_proc: true
- pgno: 176
  md: '# Table 6.3 Cyberterrorism definitions


    | Name | Definition |

    | :--- | :--- |

    | **Collins (1997)** | “The intentional abuse of a digital information system,
    network, or component toward an end that supports or facilitates a terrorist campaign
    or action” (Paulose, 2013; Bowman-Grieve, 2015, p. 86; Marsili, 2019) |

    | **Denning (2000)** | “Unlawful attacks and threats of attack against computers,
    networks, and the information stored therein when done to intimidate or coerce
    a government or its people in furtherance of political or social objectives” (Denning,
    2000f) |

    | **Weimann (2004)** | “The use of computer network tools to harm or shut down
    critical national infrastructures (such as energy, transportation, government
    operations)” (Weimann, 2004; OSCE, 2013, p. 16) |

    | **Ogun (2012)** | “Cyberterrorism is generally understood to mean unlawful attacks
    and threats of attack against computers, networks, and the information stored
    therein when done to intimidate or coerce a government or its people in furtherance
    of political or social objectives” (Ogun, 2012; OSCE, 2013, p. 16) |


    Sources: Denning (2000f); Bowman-Grieve (2015); Paulose (2013); Marsili (2019);
    Weimann (2004); OSCE (2013); Ogun (2012).


    is no longer valid. An online attack on computer systems, technologies, and devices
    has an equal detrimental political, social, and economic impact as offline violence.
    A cyber attack might not trigger as many physical casualties as offline attacks.
    Yet, they can still have a potentially catastrophic impact, such as shutting down
    a large portion of power plants, cause economies to crash, or populations deprived
    of essential services (Munk, 2015, p. 176). According to Conway (2014), the definition
    of cyberterrorism links the convergence of cyberspace and terrorism. This is not
    the convergence of cyberspace and something big or something bad. If a cyber attack
    is classified as cyberterrorism, it is likely to be both ‘big’ and ‘bad’ (Conway,
    2014). However, the critical element is that the attack has a political motive,
    but it is less important than the attack being conducted through cyberspace or
    have been linked to the online environment during the process.


    # THE LEGISLATIVE FRAMEWORK


    In the absence of a formal definition, traditional UN terrorism conventions and
    protocols prohibit terrorism against CI sectors, such as transportation, aviation
    and maritime, nuclear, and government sectors, which can be transferred to the
    online environment. The UN recognises an increase in attacks on ICTs by terrorists
    to commit, incite, recruit, find, or plan terrorist attacks. But the organisation
    fails to define “cyberterrorism (United Nations, 2021a). NATO defines cyber terrorism
    as “a cyber attack using or exploiting computer'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'or communication networks to cause sufficient destruction or disruption to
    generate fear or to intimidate a society into an ideological goal” (Marsili, 2019,
    p. 173). Contrary to conventional terrorism, the actors do not need to be physically
    present to carry out online terrorist activities. Cyberterrorism makes actions
    easier for the actors to engage in their actions from a distance (Dogrul et al.,
    2011, p. 30).


    The EU has not developed a cyberterrorism definition but uses the exiting terrorism
    framework combined with the cybercrime framework. Already in 2011, Europol highlighted
    that there is a definitional problem regarding the term cyberterrorism. The lack
    of international consensus creates problems when cyberterrorism is used to describe
    activities, such as attacks on CI, intellectual property theft, and using computer
    technologies for circulating propaganda or communication (Munk, 2015, p. 175;
    Europol, 2012, p. 11). A limited number of states have developed explicit cyberterrorism
    provisions, but most are transferring the terrorism legislation to the online
    environment. An example of a definition is incorporated in the US PATRIOT Act
    18 USC 2332b’s, where cyberterrorism is “acts of terrorism transcending national
    boundaries”, which further references activities and damage defined in the US
    Computer Fraud and Abuse Act (CFAA) 18 USC 1030a-c (Theohary & Rollins, 2015,
    p. 9). On the state level, cyberterrorism is defined by the FBI as


    > [[A]ny] premeditated, politically motivated attack against information, computer
    systems or computer programs, and data which results in violence against non-combatant
    targets by sub-national groups or clandestine agents.


    (Marsili, 2019, p. 173)


    # CONCEPTUALISING CYBERTERRORISM


    After 9/11, the security and terrorism discourses began to include the idea of
    cyberterrorism. Using the online environment could create opportunities for terrorist
    organisations, such as Al Qaeda and the Islamic State of Iraq and Syria (ISIS),
    to cause significant damage from the distance. This added a new political dimension
    to terrorism and generated debates about national security, including cyberspace
    and the online environment (Weimann, 2004). Yet, the significance of the online
    environment should not be underestimated. The use of the Internet and computer
    technologies has been instrumental for terrorists’ activities on the ground. Although
    these terrorist organisations have embraced the online environment, they have
    not engaged in large-scale cyber attacks. Instead, the groups have predominantly
    used cyberspace to spread propaganda, communicate, and recruit new members (Bowman-Grieve,
    2015, p. 87; Denning, 2011).


    Cyberterrorism can be conducted against a state or/and its citizens on multiple
    levels. The attacks do not necessarily require a high level of computer'
  merge: -1
  img_proc: true
- pgno: 178
  md: 'capabilities and capacities. Terrorists may use the digital space to advance
    their agendas by attacking CIs to create offline disruption or damage (Veerasamy,
    2020; Cohen, 2014). Compared with cyberwarfare, these attacks are less sophisticated,
    and there is not the same level of investment made into hardware and software.
    Hackers with less develop computing skills can easily buy hacking exploits and
    tutorials online. Investments in toolkits, exploits or hacking software can be
    weighed against the outcome of online attacks (Cohen, 2014). These attack forms
    might include well-known means and methods, such as DoS and DDoS attacks or web
    defacement. Other means and methods are linked to circulating misinformation to
    a broad audience, hacking to stealing, corrupting, or destroying data. Malware
    or exploitation of system vulnerabilities can make systems unavailable, disrupt
    the use of computer systems or networks to disrupt, damage, or destroy the target
    (Veerasamy, 2020; Cohen, 2014).


    Ransomware attacks are becoming a dominant attack form, and until 2021, it was
    classified as a financial cybercrime (Europol, 2021). However, due to the frequency
    and the impact of some of these attacks, the US has linked ransomware to terrorism.
    Other Western states have fallen short of using the terrorism typology. Instead,
    they have classified ransomware as a national security threat. The attack’s origin
    and the lack of interest from host states to stop the attacks against foreign
    political institutions, interests, and CI severely impact the civil population.
    Cyber attack methods are not static, and terrorism classification should be adjusted
    accordingly to changes in means, methods, and motives. Although the activities
    of the ransomware groups are not terrorism in the classical sense, the new move
    to equal the ransomware groups with terrorism opens up for a new interpretation
    of cyber attacks where the clear political link is missing.


    # Motivation


    Ransomware is malware that encrypts the targets data and holds the information
    at ransom. The victim is unable to access files, databases, or applications while
    the data are encrypted. The earliest examples of ransomware were identified in
    the late 1980s. At that time, payments were sent by ordinary mail. Today, the
    ransom is paid using cryptocurrency or credit card. During the process, encryption
    of data inflicts substantial damage and expenses for the target (McAfee, 2021;
    Malware Bytes, 2021a).


    In 1989, the Harvard-trained biologist Popp created the first documented ransomware.
    This was the AIDS Trojan virus that was distributed to 20,000 infected floppy
    disks labelled ‘AIDS Information – Introductory Diskettes’, which locked the user’s
    computer drive. Popp sent the diskettes to AIDS researchers attending the International
    AIDS conference organised by the World Health Organization. The victims were demanded
    to send 189 dollars to a post office box owned by the PC Cyborg Corporation to
    unlock their'
  merge: -1
  img_proc: true
- pgno: 179
  md: 'files. Apart from this attack, ransomware was rarely used until the mid-2000s,
    when the encryption became more sophisticated. (Lutkevich, 2020; Palmer, 2021b).
    Today, the attack vectors for ransomware have been expanded to include applications
    used on IoT and mobile devices. The encryption is becoming more complex, but the
    attacker does not need sophisticated skills or technological knowledge. Ready-to-use
    ransomware kits and Ransomware-at-a-Service (RaaS) are easily accessible on the
    Dark Web. These RaaS features encryption is emerging from collaboration among
    communities of ransomware developers (Lutkevich, 2020).


    # Defining Ransomware


    In 2020, it was estimated that the cost of ransomware attacks worldwide was approximately
    20 billion dollars. This estimation is nearly 75% higher than in 2019. Check Point
    Research (2021) reported that ransomware attacks increased by 57% in the first
    half of 2021 compared with the number of attacks in 2020. Between April and March
    2021, Check Point Research observed an average of 1,000 organisations every week
    being impacted by ransomware attacks. This signifies an overall increase of 102%
    of organisations affected by ransomware attacks in the first five months of 2021
    (Check Point, 2021).


    # THE ATTACK ROUTE


    Ransomware is created on past computer worms and viruses, and the reconstruction
    of these existing malware makes them challenging to manage. The ransomware is
    malicious software that encrypts files and documents; it can be launched towards
    single PCs to entire networks, including servers (Chapple, 2021; Palmer, 2021b;
    Europol, 2020, p. 25). As highlighted in Table 6.4, ransomware attacks deployed
    against large corporations often have different stages where the threat actors
    change during the process.


    # Table 6.4 Ransomware attack route


    | Step | Action |

    | :--- | :--- |

    | One | Threat actors access the computer systems by using multiple attack vectors
    and malware types |

    | Two | The access to the system is subsequently sold to other threat actors,
    who operate the next phase, i.e. the IT infrastructure mapping, privilege escalation,
    lateral move, data exfiltration, etc. |

    | Three | The threat actor is now able to finalise the attack by deploying the
    ransomware |


    Source: Europol (2020, p. 25).'
  merge: -1
  img_proc: true
- pgno: 180
  md: 'The attackers use a lateral movement technique, which allows them to install
    ransomware on numerous computers simultaneously or search for valuable data on
    networks, such as credit card information stored on servers. The main principle
    of lateral movement is to gain access privileges. When the hacker has accessed
    the computer on the network, their goal is to find connection identifiers (credentials)
    to give them superior rights to conduct the malicious operation (Benazet, 2021).


    The key point is that the attackers use the weak points in Internet-facing servers
    or remote-desktop logins to enter the systems. This access enables the attackers
    to secretly gain control before launching the encryption tools (Palmer, 2021b).
    The significant element in some malware, like Maze, is that the malware can be
    in the victim’s server for several months before the attack is executed. Attackers
    can take their time to reconnaissance online activities and other vulnerabilities.
    For example, the actors can monitor internal communications to identify critical
    moments for the deployment of the ransomware where the attack would cause significant
    issues for the victims, such as merging, selling, and big meetings with customers/sales.
    By deploying the ransomware before key events, they can put extra pressure on
    the victims to pay the ransom demand (Europol, 2020, p. 26).


    # DOUBLE AND TRIPLE-EXTORTIONS


    These online attacks pose a significant threat to businesses, organisations, and
    states, including a growing number of attacks against CI targeting supply chains
    and third-party services. The ransomware groups are constantly upgrading their
    business module by including innovative means and measures to their services.
    The cybercriminals continue their profitable attacks by making them more targeted
    innovative attack types include a new way of pressuring the victims. A new innovative
    way is to steal and make extortionate threats to disclose sensitive information
    by auctioning off victims’ data if the ransom demand is not met (Europol, 2020,
    p. 7; Chappie, 2021). After refusing to pay the ransom forwarded by the Babuk
    group, the Metropolitan Police Department, the Washington DC, was subjected to
    an information leak, where numerous sensitive documents, police officers disciplinary
    files, and intelligence reports were uploaded (Suderman, 2021; Brewster, 2021).


    The groups also create pages where they auction off the extorted data. REvil has
    created a ‘Happy Blog’ to the action of the data to coerce victims to pay the
    ransom and name and shame those who do not. The Happy Blog enlists recent victims
    of the groups’ activities, attaching a sample of the stolen data as evidence.
    REvil also provides the victims with a ‘trial’ decryption to prove that they can
    decrypt the data again if they pay (Cluley, 2021; KrebsOnSecurity, 2020).'
  merge: -1
  img_proc: true
- pgno: 181
  md: 'The victims can either pay the ransom, restore the system using backups, decrypt
    the files using an available key, or start building up their systems from scratch
    (Palmer, 2021b). It is now a mainstream practice for ransomware groups to use
    ''leak sites'' to upload sensitive information from the victims who refuse to
    pay the ransom. This double-extortion tactic puts extra pressure on the targets.
    The list of ransomware groups using this tactic includes names such as Ako, Avaddon,
    CLOP, Darkside, DoppelPaymer, Maze, Mespinoza (Pysa), Nefilim, NetWalker, RagnarLocker,
    REvil (Sodinokibi), and Sekhmet (Cimpanu, 2020a). Some of the groups are small-time
    operators. However, some of the largest ransomware groups, Maze, DoppelPaymer,
    REvil, Conti and NetWalker, use this tactic (Cimpanu, 2020a),


    # *Triple-extortions*


    The creative thinking and complex scenario analysis of double-extortion ransomware
    attacks have further developed a third-extortion technique. This technique includes
    third-party victims, company clients, external colleagues, and service providers
    influenced by the attacks, which are impacted even if they are not directly attacked.
    These actors are vulnerable to being extorted by affiliation with the original
    target (Check Point, 2021; Walsh, 2021). The DarkSide group has introduced triple-extortion
    in its franchise by including a calls service that enables the affiliates to call
    the victims and pressure them to pay the ransom. This service operated directly
    from the online platform.


    Another innovation is using DDoS attacks against targets to add extra pressure
    to the ransom negotiations (KrebsOnSecurity, 2021). In 2021, data from the US
    Financial Services Information Sharing and Analysis Center (FS-ISAC) showed that
    in 2020, malicious actors had targeted more than 100 financial services companies
    using ransom DDoS attacks (Hathaway, 2021). In 2021, the REvil (Sodinokibi) ransomware
    group announced that they had increased their activities. The group has added
    free two-stage service to their double-extortion scheme, i.e. DDoS attacks and
    phone calls to victim''s business partners and mass media (Check Point, 2021).


    # *Actors*


    Most ransomware groups are linked to criminal networks. However, various Russian
    and Chinese groups operate with implicit support from the authorities. In return,
    some criminal groups are also engaged with the state''s intelligence agencies.
    Subsequently, they are only conducting their ransomware activities outside the
    state, where they have taken steps to prevent that local companies are affected
    (Barnes, 2021). The Chinese espionage group ATP27, which has close ties to the
    Chinese state, has in 2020 moved into financial cybercrime using ransomware to
    encrypt the servers of gaming companies. ATP27 and Winitti, known as DRBControl,
    are linked to the Chinese state'
  merge: -1
  img_proc: true
- pgno: 182
  md: 'and operation as state-sponsored and state-support groups depending on the
    nature of their operations (Zurier, 2021; Muncaster, 2021). Although the attack
    conducted by the groups is lacking the same level of sophistication as generally
    observed in state-sponsored operations, there is strong evidence that the means
    and methods are also used by APT27, known as TG-3390, Emissary Panda, BRONZE UNION,
    Iron Tiger, and LuckyMouse (Ilascu, 2021).


    North-Korea''s Lazarus has also successfully crossed over its role as a state
    elite hacking group to engage with state-supported ransomware operations (Mathews,
    2020). The Ukrainian C10p group has also been behind attacks against organisations
    in the US and South Korea. A hacker arrested in Canada is believed to be involved
    in the ransomware group Netwalker. Yet, the epicentre for the ransomware attacks
    is linked to Russia and the former Soviet States (Tidy, 2021b).


    # Russian Groups


    The Russian groups have spread ransomware attacks to the extent that the attacks
    have been sided with terrorism. The fear and uncertainty of these attacks have
    overshadowed financial cybercrime groups. The Russian groups deliberately focus
    on targets aboard. Groups from North Korea and China are probably given the same
    level of protection. However, this is not so obvious as the groups from Russia,
    who do nothing to hide their origins. The Russian groups operate on their own
    initiative, but it is difficult to establish whether other groups enjoy the same
    level of freedom.


    The anonymity provided by cyberspace makes it challenging to make a precise attribution
    to the attackers and where the attack originates. Yet, a definite pattern was
    observed that created a link between the attack and Russia and the block of former
    Soviet states. However, the focus is primarily pointing towards Russia as the
    leading provider of safety for hackers. The evidence is linked to four areas.
    First, most of the prominent ransomware actors advertise their malicious software
    products on Russian-speaking Dark Web forums. Second, the groups operate during
    Moscow business hours, and the activities stop during Russian public holidays.
    Third, in most cases, the ransomware code contains specific instructions that
    automatically abort attacks on computer systems based on Russian keyboard configurations.
    Finally, there are reported a considerably low number of ransomware attacks against
    targets in Russia or former Soviet states than the number of attacks on Western
    entities (Tidy, 2021b). The following table contains a non-exclusive list of Russian
    ransomware groups:'
