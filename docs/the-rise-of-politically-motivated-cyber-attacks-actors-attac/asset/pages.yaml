- pgno: 141
  md: '# The US


    The number of attacks the US is subjected to from foreign actors has prompted
    a new perspective on cyber responses. However, the US is equally involved in attacks
    on other countries'' critical infrastructure utilising the powers of actors like
    the US Cyber Command (USCYBERCOM), the NSA, the US Central Intelligence Agency
    (CIA). The CIA was issued a secret order in 2018, giving the agency a White House
    approval for conducting offensive cyberoperations against states such as Russia,
    China, Iran, and North Korea. Since the order was signed, the CIA has reportedly
    been behind a large number of attacks (Cimpanu, 2020n; Ray, 2020; Dorfman et al.,
    2020).


