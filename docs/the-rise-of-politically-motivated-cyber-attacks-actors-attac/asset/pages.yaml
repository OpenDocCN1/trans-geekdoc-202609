    # THE NATO CYBERSECURITY INITIATIVES


    NATO member states adopted the Alliance’s first defence policy in 2008. This adoption
    led to cyber defences becoming a core part of the collective defence. To keep
    the Alliance at the forefront of the constantly changing cyberthreat landscape
    and uphold a robust cyber defence, NATO adopted in 2014 an enhanced policy and
    action plan, which was further amended in 2017. The 2014 policy incorporated cyber
    defence into the Alliance’s core tasks of collective defence, affirmed that international
    law applies to cyberspace, set out a plan for further NATO and its allies’ cyber
    capabilities, and established closer links to industry (NATO, 2021). Importantly,
    NATO recognised already in 2014 that a cyber attack could trigger the Alliance’s
    collective defense clause (Article 5) of NATO’s founding treaty: The North Atlantic
    Treaty (known as the Washington Treaty) (Brent, 2019; NATO, 1949).


    NATO’s cybersecurity strategy is established by a framework covering Cyber-Development,
    Cyber-Democracy, and Cyber-Defense (Efthymiopoulos, 2019, p. 3). In 2016, the
    organisation reaffirmed the defensive mandate for developing effective defences
    in cyberspace similar to those applicable to air, land, and sea. The adoption
    of the Cyber Defence Pledge (2016) creates responsibilities for the member states
    in accordance with the'
