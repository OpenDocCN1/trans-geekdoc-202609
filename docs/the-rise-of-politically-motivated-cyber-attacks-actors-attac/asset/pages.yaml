  md: 'Monsegur''s claim that he merely provided logging and intelligence to the FBI
    in return for a lenient sentence (Pilkington, 2014a, 2014b). See Table 7.12.


    The US CFAA is problematic legislation, and it is unclear what constitutes an
    illegal hacktivist activity. A hacktivist can be subjected to severe criminal
    and civil penalties for violating the act simply because this is a fraud statute.
    The concerning aspect of the act is that the penalties increase depending on how
    many people are affected by the violation. Therefore, hacktivist indicted under
    this act often pleads guilty to get a lesser prison sentence or fine. There has
    not been a test case under the CFAA as people are unwilling to risk a potential
    severe prison sentence (Wood, 2020).


    # DDOSECRETS


    In 2020, Anonymous was involved in its most significant action by accessing a
    large number of police data dubbed BlueLeaks and action conducted after the police
    killing of George Floyd. The leaked archive contains over 16 million rows of data
    (269 gigabytes). DDoSecrets published the data, including a substantial amount
    of potentially sensitive files from 2007 until mid-June 2020. The data leak came
    from a security breach at a Texas web design and hosting company that maintained
    state law enforcement data-sharing portals (Greenberg, 2020; KrebsOnSecurity,
    2020; Lee, 2020). These files revealed, for example, how law enforcement described
    the anti-fascist movement Antifa. DDOSecrets published the files on its website
    in a searchable format. Supporters of the site created the #blueleaks hashtag
    to collect their findings on social media. DDoSecrets, who leaked the files, argued
    that none of the flies is classified. Although the files might not show illegal
    behaviour, there are revelations about legal but controversial police practices
    (Greenberg, 2020).


    There is more focus on preventing these leaks from being circulated to a broader
    audience. Public and private actors are involved in creating restrictions and
    limit the damage. After the BlueLeaks was published, Twitter permanently banned
    the DDoSecrets online account because of the link to the files – and Reddit followed
    this practice. The company claimed the group violated the rules about distributing
    hacked material, and they used terms and conditions for blocking content and accounts
    is a growing practice that enables the companies behind the privately owned platform
    to control content and support public authorities’ actions (Cimpanu, 2020; Lee,
    2020; Stone, 2020; Winston, 2020). These terms and conditions have never led to
    a ban of WikiLeaks’ Twitter account, although WikiLeaks have included links to
    hacked material (Lee, 2020). At the same time, the German law enforcement seized
    the DDoSecrets server that hosted the BlueLeaks data by request from the FBI,
    resulting in the group’s online repository of the records going offline (DDoSecrets,
    2020; Lee, 2020; Rosenblatt, 2020b; Winston, 2020). DDoSecrets has also been formally
    designated as a criminal hacker group by the DHS’ Office of Intelligence and Analysis
    (Winston, 2020).'
