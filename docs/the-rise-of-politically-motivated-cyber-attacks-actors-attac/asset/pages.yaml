  md: '# # 1 Introduction


    # ## Introduction


    Politically motivated cyber attacks are escalating. For years there has been an
    assumption that these attacks were linked to geopolitics, national states, or
    minor conflicts with no noticeable effect on ordinary online users or populations.
    Therefore, not much attention has been given to these attacks compared with personal
    and financial types of cybercrime. Yet, the number of attacks is rising, and it
    is becoming apparent that the impact of these attacks spills over to the other
    domains. These attacks are not just another form of cybercrime to be managed using
    the current cybercrime legislation. The attacks are much more complicated, involving
    numerous different actors, targets, and attack routes. Attacks are conducted in
    a borderless environment where geopolitics makes it impossible to reach international
    agreements to limit the attacks.


    Public awareness about these attacks is rising. Currently, the attacks make headlines
    in mass media, placing politically motivated attacks high on the agenda. Headlines
    dominate tech reporting in mass media, and there is not a week without doomsday
    headings, such as “Barely able to keep up: America’s cyberwarriors are spread
    thin by attacks” (Collier, 2021); “New Ransomware Attack by Russian Hackers Highlights
    Cybersecurity Challenges” (Segal, 2021); “U.S. to Treat Cyber Attacks With Same
    Urgency as Terrorism” (Paytoncular, 2021).


    This book aims to provide an understanding of the various actors, the targets,
    and the cybersecurity strategies developed to manage these complex areas. Chapter
    1 introduces a complex area intending to create a general fundament by conceptualising
    the actors, cyberspace and attacks, targets, cyber strategies, and security. Finally,
    this chapter also provides an outline of the book’s different chapters.


    # *Politically Motivated Actors*


    Politically motivated attacks are increasing rapidly where the attacks have a
    substantial impact. There is a growing awareness about how dangerous they'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# 2 Introduction


    can become (Kale, 2021). The different types of politically motivated actors fall
    under the scope of war and warfare, terrorism, or activism. However, these online
    actions cannot be compared with those conducted in the offline environment. Currently,
    there is no precise classification of these actors, and they are considered in
    isolation without seeing the pattern and considering the groups’ means and methods.
    Still, there are different levels of sophistication used in the attacks. The least
    intrusive, low impact attacks are easier to detect and prosecute as they are likely
    to be conducted by non-state actors as a part of a political protest. In contrast,
    there is a low probability of prosecuting the national state, state-sponsored/supported
    actors conducting the most sophisticated and intrusive attacks.


    There has been a significant setback in diplomacy and transnational collaborations
    between states to develop comprehensive norms and practices for managing this
    area. Warmongering rhetoric is being used, which sounds like a return to the Cold
    War, albeit online. Actors are increasing their online capabilities and capacities
    and showing off their powers through actions. The United States (US) President
    Biden has warned that significant cyber attacks would lead to a real conventional
    war on the ground (Tung, 2021a). This argument is supported by the North Atlantic
    Treaty Organization (NATO), which has stated that the series of cyber attacks
    directed at Western states should be considered similar to a threat of armed attacks
    (Tung, 2021b). The US agencies, the National Security Agency (NSA), and the Federal
    Bureau of Investigation (FBI) have warned about hacking campaigns tied to the
    Russian military. In particular, the SolarWinds attack in 2020 demonstrated the
    impact of supply-chain attacks. The Russian state-sponsored group, Fancy Bear,
    was subsequently attributed for the attacks on Western states’ public and private
    entities. In particular, it has caused concerns that SolarWind targets included
    the US Justice, State, Energy, and Commerce Departments (Corera, 2021; Gagliordi,
    2021; Whittaker, 2021). Some of the attributions of attacks have increased tension
    and harsh verbal exchanges between the different actors. The US, NATO, the European
    Union (EU), and the United Kingdom (UK) have accused China of being behind the
    Microsoft Exchange hack. In return, China accused the US of being behind several
    attacks against China (Janofsky, 2021; Vincent, 2021).


    Ransomware groups have intensified their attacks on critical infrastructure (CI)
    and essential services with a frequency and severity that has surpassed other
    cybersecurity concerns. Of all the Western states, the US has experienced an unusually
    high number of ransomware attacks, directly impacting the public. The 2021 attacks
    on the Colonial Pipeline and the meat plant JBS prompted the US authorities to
    raise concerns about the attacks originating from Russia. This led to the Western
    security actors classifying ransomware attacks as a national security threat.
    The US took this one step further by directly linking ransomware attacks with
    terrorism (Barnes, 2021; Bing, 2021; Chapple, 2021; Palmer, 2021; Security, 2021).


    Politically motivated cyber attacks are not only associated with state, state-sponsored,
    and state-supported actors. Non-state actors also use the'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'online environment for political protests, affecting public and private entities,
    services, and infrastructures. In 2020–2021, hacktivists and other political activists
    conducted several legal and illegal attacks, which caught worldwide attention.
    Older, established hacktivist groups, like Anonymous, emerged from the shadows
    along with new groups showing that hacktivism still constitutes a threat online
    (Molloy & Tidy, 2020). However, new groups have emerged which are more engaged
    in collecting data troves in the public spare or accessing open-source codes online
    (Reuters, 2021; Stone, 2020). Contrary to the hacktivist groups, another breed
    of political actors launched innovative attacks that did not break the law, i.e.
    Gen Z and K-pop stans (Alexander, 2020; Lorenz et al., 2020).


    # Cyberspace and Attacks


    The term ‘cyberspace’ was coined in 1984 by the sci-fi writer Gibson in his novel
    ‘Neuromancer’. Gibson describes the space as a ‘consensual hallucination’ by referring
    to the ability of the online space to alter the offline reality by those engaging
    in virtual chat rooms or virtual environments (Cavetly, 2013, p. 107; Gibson,
    1984; Puyvelde & Brantly, 2019, p. 2; Shires, 2020, p. 89). Yet, the term cyberspace,
    originates from cybernetics using the Greek word kybernētēs, which means rudder,
    pilot, a device used to steer a boat or support human governance. For example,
    a self-steering mechanism is applied to techniques to keep ships on the course
    during the night watch (Cyber Security Intelligence, 2017; Green, 2001, p. 199;
    Marinescu, 2017). Plato used kybernētēs to describe the governance of people (Marinescu,
    2017). In a more contemporary context, the word ‘cyber’ is associated with the
    digital environment creating an intellectual and emotional interactional space
    within a technological realm (Green, 2001, p. 199).


    Cyberspace is now considered a global domain that creates an information environment
    of independent networks of systems infrastructure, interlinking Internet telecommunication
    networks, computer systems, and various embedded processors and controllers (Clark,
    2010, p. 1; US DoD 2016; NIST, 2020). The online space comprises an ecosystem
    blending network technologies and online users based on organic technological
    evolutions. Different technologies coexist and influence each other within the
    ecosystem, combined with external forces fuelled by social and technological changes.
    Technological innovations, computer technologies, interconnectivity, and interdependency
    create immediate changes to the online ecosystem. These changes are based on a
    fusion of all communication networks, databases, and information sources in a
    universal context (Cavetly, 2013, p. 108; Lapointe, 2011, pp. 2–3).


    The technology used is instrumental in understanding cyberspace. The material
    and physical aspects, the electronics used in hardware, software, and the applications
    linked to the actual operative technologies are defining aspects. Equally important
    are the language, the interpersonal interactions,'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# 4 Introduction


    the use, and the performance (Manning, 2019, p. 291). Global connectivity is linked
    to various communication pathways where software is used on millions of computers
    controlling cyberspace’s storage devices and pathways. These computers continually
    sense the status of interlinked routers, which means that the online traffic does
    not follow a linear and direct route. Instead, the data are being routed through
    various global pathways to arriving at a destination only miles away in the shortest
    time possible (Inglis, 2016, p. 19).


    # Cyber Attacks


    The distinction between illegal activities of states and organised crime groups
    is becoming blurred, and various groups are coving their activities behind a false
    front, making the attribution difficult. Many foreign state-sponsored groups are
    threatening other states’ interests. Attempts from states, state-sponsored and
    state-supported attacks penetrating networks for political, diplomatic, technological,
    commercial, and strategic advances are also a growing concern. These groups are
    principally targeting governments, defence, finance, energy, and telecommunication
    sectors. According to the UK National Cyber Security Strategy 2016–2021, the capacity
    and impact of these state/state-sponsored actors vary. The most technologically
    advanced states continue to update their capabilities and methods using encryption
    and anonymised services to remain covert. Other actors do not have the same abilities.
    However, they can archive similar impacts using basic tools and techniques because
    of the low level of cybersecurity imposed by the targets (HM Government, 2016,
    p. 18).


    The interconnectedness and interdependencies on computer technologies enables
    cyber attacks to be conducted on an unprecedented scale which impact states, groups,
    and individuals. The accessibility of computer devices, networks, and the architecture
    of cyberspace and the Internet means that more online users can communicate and
    share information globally. The online spaces provide the attackers with global
    resources to move data and information around and find safe havens for conducting
    attacks (Clough, 2015, pp. 7–9; Gillespie, 2019, p. 13; Munk, 2018).


    # Cyber Targets: Critical Infrastructure


    Attacking infrastructures and services is becoming common, and everything linked
    to the online environment are at risk. For years, the attackers have targeted
    political and private entities, groups, and individuals. Yet, politically motivated
    attacks are not confined to governmental and military entities; commercial and
    economic interests and industries, such as finance, high-tech technology, biotechnology,
    and telecommunications, have faced a substantial amount of attacks (Anderson,
    2008). Large-scale attacks such as the 2007 attack against Estonia and the 2017
    WannaCry and NotPetya ransomware attacks demonstrated the vulnerabilities of interconnected
    systems and networks.'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Defining Critical Infrastructure (CI), Critical National Infrastructure (CNI),
    Critical Information Infrastructure (CII), and Information and Communication Technologies
    (ICTs)


    The online and interconnected environment is changing, and various CIs constitute
    significant risks. The frequency of politically motivated attacks proves the need
    for managing this area by building up resilience and preparedness to increase
    cybersecurity. CI systems, such as those linked to power generators, water treatments,
    electricity production, and other platforms, are considered vital for modern societies
    (Allianz, 2021). The attacks on these vital assets have a detrimental effect on
    society. There might be direct damages to the actual target, but the services
    provided are equally disrupted.


    These targets become more attractive to attackers, who have various tools available
    to conduct attacks, such as distributed-denial-of-service (DDoS), advanced persistent
    threats (APTs), supply-chain attacks, etc. The variety and complexity of these
    attacks increase the pressure on CI providers and governments to improve security,
    enhance protection, and develop strategies to manage online risks. The different
    forms of CI are classified due to the particular providers and contexts where
    they are developed. CI is classified as an essential service, and states, businesses,
    and organisations must develop a robust framework to anticipate and mitigate disaster
    across the entire CI architecture (Forcepoint, 2020).


    Attacks against CI systems and services have generated changes to strategies,
    processes, and practices. However, cyber attackers outsmart cybersecurity actors
    by constantly upgrading their cyber capabilities and capacities. There have been
    several attacks on CI and services in the past. For example, in the 2003 attack,
    the SQL Slammer worm infected a monitoring and control system at the Davis–Besse
    nuclear power plant in Ohio, US (Poulsen, 2014). The most well-known politically
    motivated attack was the Stuxnet worm discovered in 2010. This worm was launched
    against Iranian power plants to sabotage centrifuges, and the operation demonstrated
    the powers and impact of malware attacks (Liu et al., 2017, p. 14; Zetter, 2015).
    In 2013, Iranian hackers breached the Bowman Avenue Dam in New York and took over
    the control of the floodgates. Although the attack was not sophisticated and could
    not have caused significant damage, it is concerning how easily attackers can
    seek out vulnerabilities and exploit old CIs running of retro-fitted software
    connected to the online environments (Prokupecz et al., 2015).


    Another significant attack on CI was in 2020 launched against Israeli water stations
    where a few pumps malfunctioned by turning on and off without being activated.
    An Iranian-written code travelled through servers in the US and Europe before
    targeting the water pumping stations attempting to modify chlorine levels (Goud,
    2020; Srivastava, 2020). If the attacks were successful, the populations could
    have suffered a mild poisoning by drinking the water (Cimpanu, 2020; Goud, 2020;
    Srivastava, 2020). A similar attack was prevented in Florida in 2021, where hackers
    briefly increased the amount'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# 6 Introduction


    of sodium hydroxide (Lye) in Oldsmar’s water system. After a couple of attempts,
    the hacker managed to access the treatment software and changed the sodium hydroxide
    content from 100 to 11,100 ppm. This attack was detected by an employee who reversed
    the action (BBC News, 2021; Porterfield, 2021; Vallejo, 2021).


    Most of the politically motivated cyber attacks are launched against CI, CNI,
    CII, and ICTs. These CIs and services are primarily embedded in the daily activities
    of the global economy and society, i.e. sharing/developing ICTs, services, networks,
    and infrastructures (EC, 2013, p. 1). In the offline environment, the main threat
    is terrorism, espionage, cyberthreats, and the proliferation of weapons of mass
    destruction. These concerns can be transferred to the online environment, where
    CIs constitute a more complex system reliant on computer technology and networks
    (Allianz, 2021).


    The various aspects of CIs can be distinguished into the following groups. CI
    is an umbrella term covering several essential structures, systems, and services,
    such as CNI, CII, and ICTs. CI covers a wide range of material systems, such as
    delivering communication, energy, water, food, transport, emergency services,
    and healthcare provisions. All these areas create a body of systems, networks,
    and assets essential to the functioning of a state, its economy, public health,
    and service (US DHS, 2020). CIs are controlled and monitored by industrial control
    systems (ICSs), including supervisory control and data acquisition (SCADA) systems.


    The CI systems are predominately based on standard embedded system platforms usually
    based on commercial off-the-shelf software. Although ICS and SCADA systems have
    reduced the costs and made them easier to use, the risk of exposure to cyber attacks
    has increased (ENISA, 2021). An example is the supply-chain attacks where the
    attackers seek out vulnerabilities in the weakest link of the chain, which allows
    the attack access to a substantial number of entities simultaneously, i.e. SolarWind
    supply-chain attack and Kaseya ransomware attack (2021) have both used the companies
    supply-chain to gain access to a more extensive network (Constantin, 2021; Paganini,
    2020; Whitney, 2021).


    CNIs are a part of the CI framework that covers facilities, systems, sites, information,
    and processes essential for the everyday running of a state (Pratt, 2019). These
    can be chemicals, civil nuclear communications, defence, emergency services, energy,
    finance, food, government, health, space, transport, water, etc. CNI covers a
    complicated network beyond the actual structures, systems, and services. Subunits
    of third parties are involved in the development of these structures and services.
    Contractors and third parties still need to be protected because of the potential
    danger to the public if they are attacked (CPNI, 2020). Ransomware attacks have
    reinforced the need for protecting CNIs. Attacks on these vital services can have
    physical consequences on society beyond the actual target. Managing and building
    up resilience against cyber attacks are challenging, as it is impossible to shut
    down these services to maintain and update the systems without cause disruptions
    to society.'
  merge: -1
