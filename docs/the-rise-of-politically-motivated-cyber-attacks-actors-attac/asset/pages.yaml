    2021b; Lerman, 2021).


    Some insurance companies have argued that the payment is lower than the actual
    cost of rebuilding systems and data afterwards. The costs of restoring the compromised
    systems, any resulting downtime, or lost business after the attack are often more
    expensive than paying the ransomware demand. Yet, there is a mounting pressure
    on these companies not to pay the cybercriminals to discourage more attacks with
    higher ransom demands. This has forced insurance brokers to rethink their insurance
    policies (Lerman & Vynck, 2021; Wolff, 2021). Yet, some of the new policies introduced
    had consequences. The French insurance company AXA officially announced in 2021
    that they would no longer cover the ransom. The company decided to take this step
    due to the uncertainty regarding the legality of making these payments as the
    French Senate had raised the possibility of introducing a payment ban. Within
    days after this decision, the company was targeted, too (Perlroth & Satariano,
    2021; Ikeda, 2021; Wolff, 2021).


    The current issue surrounding ransom payment needs to be addressed. Paying the
    ransom is still legal as the hacking groups are seldom members of banned terrorist
    groups (Sabbagh, 2021b; Sabbagh, 2021a). Legislation has been introduced in several
    countries as a response to kidnappings by terrorist groups. For example, British
    extortion laws prohibit ransom payments to terrorists. The UK Terrorism Act 2000
    criminalises instances of terrorist financing. The UK Terrorism Act 2000 has been
    amended by Section 42 of the Counter-terrorism and Security Act 2015, which prohibit
    insurance companies from making payments in response to terrorist demands (GOV.UK,
    2015; GOV.UK, 2000). The G8 member states also committed to rejecting ransom payments
