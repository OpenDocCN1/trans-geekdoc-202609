    Task Force, 2021, p. 17). The UK, US, Canada, Australia, and New Zealand all attributed
    the attack to actors from Russia, and they linked the attack to Russia''s ongoing
    conflict with Ukraine (InfoTransec, 2021). These two attacks were eye-openers
    for governments and businesses equal to the Estonia attack in 2007.


