    and security experts were alerted by the impact of the ransomware attack (InfoTransec,
    2021). Other parties affected showed that the attack impacted ordinary life on
    the lower level. For example, doctors in Virginia and Pennsylvania were unable
    to access patient records and prescription-systems.


    Two years after the attack, railway and shipping systems are not fully restored.
    Packages have been lost, and senior citizens have continued to miss their pension
