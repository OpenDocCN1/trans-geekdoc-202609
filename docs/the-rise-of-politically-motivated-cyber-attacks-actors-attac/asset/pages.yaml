    # THE AFRICAN UNION (AU): CYBERSECURITY INITIATIVES


    Various measures have been developed with AU as the drive for change. The AU Convention
    on Cybersecurity and Personal Data Protection (AUCCPDP) (The Malabo Convention)
    was drafted in 2011 with mixed reviews about the text and the slow progress on
    the ratification implementations. Critics claimed that the Convention was drafted
    too vaguely and flawed. Moreover, it was problematic that the management structure
    depended on broad cooperation among all the states, leaving the AU trailing behind
    its counterparts in other regions (Dalton et al., 2017, p. 117). Nevertheless,
    the Convention marks the beginning of a commitment to developing cybersecurity
    strategies despite not being sufficient to manage the threats (AU, 2016; Dalton
    et al., 2017, p. 114; UNIDIR, 2019).


    In 2016, the African Ministers for Communication and ICTs agreed to develop a
    comprehensive approach to cybersecurity and cybercrime in Africa to address the
    flaws of the AUCCPDP Convention (AU, 2016; UNIDIR, 2019). In 2019, the AU''s Peace
    and Security Council adopted a Communique on Mitigating the Threats of Cyber Security
    to Peace and Security in Africa to ensure that the region develops cyber strategies,
    norms, and practices. Several areas are identified in the Communique to enhance
    resilience and preparedness towards the growing number of threats, such as engaging
    in regular cybersecurity risks assessment, investing in cybersecurity and education,
    developing multilayered approaches, and encouraging various collaborations and
    partnerships. Moreover, it aims to create synergies and enhance national, regional,
    and continental cybersecurity coordination, harmonising laws and providing legal
    assistance in cybercrime cases (AU, 2019; UNIDIR, 2019).'
