    Source: US Gov (2016).


    China possesses substantial cyber attack capabilities and presents a growing threat
    due to China''s cyberpursuits and proliferation of related technologies (DNI,
    2021, p. 8). China''s leaders have recognised that technological development has
    created new challenges to the government''s ability to regulate and control it.
    Therefore, the government has created new institutions, legislations, and policies
    to manage hardware, software, data flows, and information within its borders,
    changing the landscape for foreign and domestic ICT companies and internet users
    (Sacks, 2020). China''s strategies mirror the states complex hierarchies, command
    structures, and various defence units. Similar to Russia, the governance of cyberspace
    can be perceived as a global existential competition between China''s political
    system and the Western world (Raad, 2016).


    The Chinese PM Xi Jinping launched in 2015 the ‘Made in China 2025’ strategic
    plan. The ‘Made in China’ plan aims to gain parity with the US in ten key industries,
    including biomedicine, robotics, space technology, cloud computing, and artificial
    intelligence. China has used illegally obtained information from cyber attacks
    to improve its military capabilities and develop new technologies. Moreover, the
    information has been utilised to enhance the state''s abilities for competing
    on the global market and support commercial companies in becoming global players
    (Hlevek, 2020).


    China has a substantial professional community linked to espionage, demonstrating
    capabilities to infiltrate national commercial entities over the years. The targets
    are chosen to their abilities to benefit the defence industry and high-tech communities
    (USCC, 2019). The Chinese governmental actors employ tactics to influence lawmakers
    and public opinion to develop policies favourable to China''s strategic goals
    (FBI, 2021).


    # CYBER UNITS


    Chinese hackers linked to the Chinese''s People''s Liberation Army are involved
    in a large-scale campaign stealing large amounts of data from Western governments''
    computer systems (Lemos, 2011; Martin, 2011). There is a vast number of groups
    involved in these operations known under different names. Some of the most well-known
    groups are outlined in the Table 5.2.'
