  md: 'criminal activities. In contrast, hacktivists are more likely to be considered
    individuals who hack for social or political reasons, as no personal or financial
    gains are associated with the actions. But the legislation does not separate these
    two groups (Manjikian, 2021, p. 167).


    There should also be a more differentiated approach to the elements included in
    hacktivism. Finding information publicly available from open sources, social media,
    or on the Dark Web and leaking is different from hacking into systems and stealing
    the data. Moreover, DDoS as a virtual sit-in blocking data traffic for a limited
    amount of time is not different from an offline blockade or sit-in preventing
    access to a specific location. Offline protests cause inconvenience, annoyance,
    and distractions. They can stop daily routines and cause unwanted attention. The
    target can be burdened by being singled out, but if the action in the offline
    world is protected, it should also be tolerated in the online environment (Hampson,
    2012, p. 540).


    # PREVIOUS PROSECUTIONS


    The LulzSec group was dismantled because of prosecutions where one of their own
    was passing on information to the FBI. The FBI cooperation with one of LulzSec
    leaders, Monsegur (Saba), resulted in several Anonymous and LulzSec members''
    arrests (Associated Press, 2014; Pilkington, 2014a). Monsegur''s actions enabled
    the FBI to identify eight of his peers, despite


