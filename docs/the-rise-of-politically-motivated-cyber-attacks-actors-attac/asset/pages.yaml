  md: 'Similar practices have been deployed to APT-69420 Arson Cats and their spokesperson,
    Kottmann. Law enforcement uses a harsh tactic to indict and prosecute the people
    behind the attacks when it is possible to identify them. The hacking group APT-69420
    breached the video and Artificial Intelligence (AI) security company Verkada''s
    systems enabling the group to access more than 150,000 of the company''s surveillance
    video cameras in various locations, such as Tesla factories, police stations,
    gyms, schools, prisons, and hospitals. Some of the material is highly personal
    and sensitive, although no footage appears from private homes (Vincent, 2021b;
    Patterson, 2021). One video shows how staff are tackling and holding down a man
    to his bed at Halifax Health, a Florida hospital. Another video shows a man in
    handcuffs questioned by police officers at a police station in Stoughton, Massachusetts
    (Clayton Rice Q.C., 2021; Laskey, 2021; Menn, 2021). The group argued that they
    wanted to inform the public about the dangers of such omnipresent surveillance.
    The group''s overall motive for publishing the data was based on their agenda
    for promoting freedom of information and fighting against intellectual property
    and capitalism (BBC News, 2021; Patterson, 2021; Vincent, 2021a, 2021b).


    # THE INDICTMENT


    Kottmann has been accused of hacking several companies and government agencies
    since 2019. The Swiss authorities executed a search warrant related to Kottmann''s
    activities on the US authorities'' request, and Kottmann has been indicted for
    computer intrusion and data and identity theft (Keane, 2021; Panda Security, 2021;
    The US DoJ, 2021). Additionally, Kottmann is accused of operating a website called
    git.rip, which was seized by the FBI for further investigation. The git.rip was
    used to publish internal documents and source codes of more than 100 entities,
    i.e. the state of Washington, the Washington Department of Transportation, a microchip
    processor or manufacturer, and a maker of tactical equipment (Keane, 2021; Panda
    Security, 2021; Vincent, 2021a). The US authorities stated that stealing credentials
    and data and subsequently publishing the source code, proprietary, and sensitive
    information online is not a protected speech. Instead, these actions fall under
    theft and fraud. These actions will increase the vulnerabilities for everyone
    spanning from large corporations to individual consumers. The US Authorities claims
    that a noble motive does not remove the criminal element from the intrusion (Cimpanu,
    2021).


    The indictment notice also stated that Kottmann could profit from additional activities,
    such as speaking to the mass media and selling hacking inspired merchandise, i.e.
    profit from selling shirts with text such as ‘Venture anticapitalist’, ‘catgirl
    hacker’, ‘no gender, no crime’, and ‘I would never do cybercrime’ (Reuters, 2021;
    Turton, 2021). Although the charges no necessarily'
  merge: -1
  img_proc: true
- pgno: 246
  md: 'reflect the outcome of the case, they are severe. The indictment includes conspiracy
    to commit computer fraud and abuse, giving up to a five-year imprisonment sentence.
    Wire fraud and conspiracy to commit wire fraud can give up to a 20-year imprisonment
    sentence. Finally, aggravated identity theft can give a mandatory minimum 24-month
    imprisonment sentence following any other sentences imposed (The US DoJ, 2021).


    Hacktivists are increasingly threatened with investigations and prosecutions,
    which often includes disproportional long prison sentences. This stance has, to
    some extent, been successful; since the harsh clampdown on Anonymous and LulzSec
    hacktivists in 2013, the actions have decreased in the number of attacks, but
    they have not disappeared, as illustrated above (Fish & Follis, 2015; Karagiannopoulos,
    2021). States have been successful in prosecuting prominent hacktivists, and this
    had a deterrence effect. However, with the pandemic restricting offline protests,
    and new legislation restricting the rights to protest, hacktivism has slowly gained
    momentum. New ways of protesting and new groups are gradually emerging, indicating
    that post-COVID-19 hacktivism could be a popular alternative to traditional offline
    protest (Karagiannopoulos, 2021).


    # Conclusion


    Hacktivism has developed in 2020 and 2021, leading to new means and methods deployed
    in online protests. Some new groups operate within the legal framework, whereas
    others continue the traditionally illegal practices developed by previous groups.
    The new wave of hacktivists’ activities is more intrusive than traditional online
    activism. However, they are far from having the same impact as the state and state-sponsored/supported
    actors’ actions. The large-scale attack conducted by state actors and their affiliates
    is attributed publicly but not likely to prosecute. In contrast, the low key non-sophisticated
    actors are facing prosecution and significant prison sentences.


