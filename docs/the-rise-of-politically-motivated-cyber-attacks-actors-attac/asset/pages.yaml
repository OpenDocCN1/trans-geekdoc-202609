- pgno: 263
  md: 'The asymmetric means used in cyber attacks enable actors with limited financial
    and technical resources to compromise high-value targets (Kshetri, 2014, p. 10;
    Masters, 2011).


    Contrary to nuclear weapons or sophisticated conventional arms, various types
    of cyberweapons are much cheaper to produce, proliferate significantly, and their
    use is not restricted by borders. States like Russia, China, Iran, and North Korea
    cannot match US’ spending on conventional weapons, but they become equal with
    cybertools. These states have exposed the US’ weaknesses. Compared with these
    states, the US is more reliant on financial, commercial, and governmental networks,
    which leaves the system vulnerable to attacks (Kolbe, 2020).


    # STATE-SPONSORED AND STATE-SUPPORTED GROUPS


    One of the issues that the states need to solve is the increasing use of state-sponsored
    and state-supported actors. Pervasive state-sponsored online actions are becoming
    systemised and used as a cover-up for the states’ engagement in the processes.
    These activities make it difficult to identify intrusions and disruptions by organised
    crime groups, sub-national organisations, and hackers. The number of non-state
    actors involved in the cyber attacks interferes with the criminal prosecution
    using the existing computer crime legislation. Therefore, it might be time to
    reconsider how these attacks are managed (Barletta et al., 2011, p. 81).


    In hybrid cyberwarfare, these actors have obtained a prominent position distancing
    the state from the attacks. In the attacks covered in the previous chapters, the
    state-sponsored actors are often linked to three different objectives. They are
    likely probing for and exploiting national infrastructure vulnerabilities. Finally,
    the attacks can also be linked to exploiting money from systems and people. Businesses
    have become a favourite target of these attackers because their cybersecurity
    is often lacking or outdated, making it easy to exploit vulnerabilities undetected
    in systems (Quostar, 2020). The state predominately uses these actors to carry
    out timely or large-scale attacks to access information or retaliate. The distance
    between what is publicly perceived as non-state actors and the state is beneficial
    as the state can deny these attacks, even when they are part of the internal cyber.
    (Westby, 2011). All the states included in Chapter 5 are using distanced cyber
    units and state-sponsored actors.


    Cyberterrorists or state-supported actions are not different from state-sponsored
    groups, hacktivists, and politically motivated cybercriminals using the same means
    and methods to conduct online attacks. These activities align with the state objectives,
    and there is no negative payoff associated with providing a safe haven to these
    actors. Compared with state and state-sponsored actors, there is no difference
    in the ability to disrupt and destroy various ICs, causing political and economic
    damage to the target and society. However, managing the state-supported groups
    can only be obtained with collaboration with the host states.'
