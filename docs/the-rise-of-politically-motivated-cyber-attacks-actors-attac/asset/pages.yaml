- pgno: 55
  md: '# # Conclusion


    Different online groups emerge from the offline typologies; some are slightly
    different; however, the main characteristics are using the online environment
    to conduct the different attacks. Online warfare, terrorism, and activism are
    similar to offline definitions, so it is possible to transfer them to the new
    forms of groups that emerge. In contrast, the new inclusion of ransomware groups,
    hacktivism, and hackers differentiates in names but not their underlying foundation.
    The online environment acts as a vector for the actions, which links to the Surface,
    the Deep, and the Dark Web. These spaces are instrumental for facilitating actions
    in a borderless online environment where actors can operate anonymously and without
    being traced. Without cyberspace and the virtual spaces and communities, these
    actions would not have the impact as it has today. The ground can operate undetected
    to spy, disrupt, and damage their target’s assets, structures, and services.


