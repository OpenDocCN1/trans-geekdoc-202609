    Sources: NATO (2019); European Parliament (2015); UN (2005); Costa (2005).


    # THE LEGISLATIVE FRAMEWORK


    On several occasions, the UN has failed to develop an internationally agreed definition
    of terrorism, making the fight against terrorism more efficient. Yet, more specialised
    definitions are developed in resolutions and conventions (United Nations, 2021b;
    European Parliament, 2015). UN Resolution 1566 from 2004 stated that all acts
    with the purpose of private a state of terror “[u]nder no circumstances justifiable
    by considerations of a political, philosophical, ideological, racial, ethnic,
    religious or other similar nature” (European Parliament, 2015; UN, 2004). However,
    international actors have developed their definitions as outlined in Table 6.1.


    Like the definitions above, states have defined terrorism in a national context.
    Below are selected definitions to enhance the understanding of the concept of
    terrorism:'
