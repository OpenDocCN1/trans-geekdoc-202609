- pgno: 35
  md: 'of the value system of the prevailing social power” (Schafer, 1969). Changes
    to political systems sometimes happen as a natural development. At other times,
    changes are fuelled by shifts in social and political opinions, morals, and systems.
    The rise and fall of political systems, leaders, races, classes, and social systems
    have predominately been the trigger for changes – and most of these changes involve
    political crimes (Schafer, 1971, p. 381).


    Politically motivated attacks can be carried out over a short period or part of
    a more extended campaign for changes. Attacks can be launched against one particular
    target in a discriminatory operation or attacks can be carried out indiscriminately
    against random targets. Yet, it is essential to investigate massive scale attacks
    from the outset of the offline environment to understand the offline attack types.
    See Table 2.2.


    # Politically Motivated State and Non-state Actors: War and Warfare


    # War and Warfare


    According to Von Clausewitz''s definition, “[W]ar is ... an act of force to compel
    our enemies to do our will” (Von Clausewitz, 1997, p. 5; Williams, 2008, p. 152).
    War is distinct from peace, as war is a legal dispute using military means. Yet,
    this is not the same as military engagement. The parties in a conflict can legally
    be in a state of war, although no violence occurs between them; for example, the
    relationship between South Korea and North Korea (Williams, 2008, p. 157). The
    motive of entering a war conflict are the standard for determining the aim for
    using military force and the amount of effort used (Von Clausewitz, 1997, p. 13).
    State-based armed conflicts are those where the recognised government is one of
    the warring parties. In comparison, non-state armed conflicts are based on organised,
    collective armed violence without the involvement of a recognised government.
    Still, war and warfare can be linked to other actors outside the use of military
    force. Grey (2006) differentiates war and warfare by arguing that “War is a relationship
    between belligerents, not necessarily states. Warfare is the conduct of war, primarily,
    though not exclusively, by military means” (Grey, 2006, p. 37; Najżer, 2020).


    Regarding war or other types of armed conflicts, the legality of using force is
    not necessarily the predominant question that the politicians consider. It is
    more likely that the considerations are centred around whether the policy objectives
    would be archived through the use of force, and it would be done at a reasonable
    cost. However, this would also depend on the situation’s perceived aim: use force
    or not use force. If the state is fighting for ultimate survival, any cost would
    be reasonable. If the situation is linked to political empowerment and growth
    or to secure the welfare of non-nationals, it would be less acceptable to consider
    a high level of costs. There are direct costs allocated to offline conflicts that
    are much higher in comparison with online conflicts. In the offline environment,
    for example, modern weapons’ destructive powers are limitless and destructive,
    which can cause significant damage'
  merge: -1
  img_proc: true
- pgno: 36
  md: 'to lives and properties, both military and civilian. There are political costs
    linked to the decision of entering an armed conflict. It is essential to consider
    what the response would be nationally and internationally. Here the considerations
    might be linked to the possible outcome of the actions weighing up the payoffs’
    probabilities. Even a victory might come with too high a price – and therefore,
    there will be a negative political impact on the actions taken. If the action
    is perceived to violate the internationally accepted norms and laws, politically,
    allies might act negatively. They might even interfere or support the opponent
    in the conflict, and there is a risk of direct sanctions being imposed (Morris,
    2019, pp. 114–115).


    # PROXY WARS


    Proxy wars are indirect involvement in a conflict, where states are trying to
    further their own strategic goals by using third parties operating outside the
    state apparatus (Mumford, 2013a, p. 11). Proxy warfare is described by the former
    US President Eisenhower as being a ‘cheap insurance’. He suggested that this form
    of warfare is cheaper than conventional wars where the whole military apparatus
    is invoked. Thereby, there is a distance between the state and the actual combatant
    (Mumford, 2013b). The actors included can be a state using another state as a
    surrogate or activate non-state actors, such as terrorist organisations, militia
    groups or private contractors, or vice versa (Mumford, 2013a, p. 45). An emerging
    between traditional and proxy warfare is hybrid warfare. In this form of war,
    the actors invoke several different weapons and tactics to exploit creativity,
    ambiguity, non-linearity, and cognitive elements of warfare using state and non-state
    actors. The activities are designed to remain below the apparent detections and
    response threshold (Cullen & Reichborn-Kjennerud, 2017).


    # HYBRID WARFARE


    Hybrid warfare includes multiple attacks route using various means, methods, and
    actors. Notably, the activities are conducted under central authority, such as
    the state or state-like actors. Hybrid warfare is aiming to archive political
    goals that would not be archivable using conventional means and methods. Blending
    the different attack routes allows the actors to exploit the opponents’ weaknesses
    (strategic and doctrinal) while upholding a level of strategic surprise and deniability
    of involvement (Najjer, 2020, p. 20). Hoffmann (2009) has defined two definitive
    and conceptually interconnected areas used to define hybrid war and threats. The
    first area highlighted that hybrid war “Incorporates a range of different modes
    of warfare including conventional capabilities, irregular tactics and formations,
    terrorist acts including indiscriminate violence and coercion, and criminal disorder”
    (Friedman, 2018; Hoffmann, 2009, p. 5). The second area is linked to the hybrid
    threats. Hybrid threats are defined as “Any adversary that simultaneously and
    adaptively'
  merge: -1
  img_proc: true
- pgno: 37
  md: 'employs a fused mix of conventional weapons, irregular tactics, terrorism,
    and criminal behaviour in the battlespace to obtain its political objectives”
    (Friedman, 2018, p. 31; Hoffmann, 2009, p. 5; Hoffmann, 2010, p. 443).


    Other groupings and activities are linked to modern warfare. Irregular warfare
    is distinct from warfare describes types of violence conducted by substate actors.
    In contrast to conventional wars, irregular wars are linked to the modus operandi
    employed by one or all of the combatants. The weaker part of the conflict often
    prefers this method. This tactic is helpful to groups that fight to change a political
    system or administration by organising and fighting in small units, which are
    more effective than their state-based opponent (Kiras, 2009, 2019, pp. 184–185).


    # Cyberwar and Warfare


    There is a risk of politically motivated attacks becoming normalised because cyberwar
    is sanitised and moved outside the public sphere. Online warfare and political
    attacks are operational in a grey zone outside the Geneva and Hague conventions
    regulating war and warfare. There is no ethical accountability associated with
    online politically motivated attacks. The public and private victims of these
    attacks are not protected. Contrary to conventional warfare, no attempts are made
    to shield the civilian victims from the long-lasting effects of these attacks.
    Moreover, the nature of cyber attacks is not catching the attention of mass media
    in the same way as territorial disputes, just war, civil unrest, terrorism, and
    other attacks in the offline environment. Instead, these incidents are mostly
    unreported. The reporting is circulated after the incident, which predominantly
    is linked to the after-effect of the attacks and how the political actors have
    yielded the attack (Merrin, 2018, pp. 40–43; Porche III, 2019).


    Table 2.3 Outline of cyberwar and warfare groups and tactics


    | Types | Characteristics | Actors |

    |---|---|---|

    | **Cyberwarfare** | Linked to attackers using computer code to attack an adversary’s
    infrastructure and to support conventional warfare on the ground | State and state
    actors are using cyber attacks against a nation-state |

    | **Hybrid cyberwarfare** | Cyberspace and computer technologies enable states
    to be involved in these activities without more expensive conventional forces
    and weapon | States that lack conventional military can still cause damage and
    chaos using asymmetric cyberwarfare |


    Sources: Hanna et al. (2021); Manjikian (2021, p. 276); Ranger (2018).'
  merge: -1
  img_proc: true
- pgno: 38
  md: 'The complexity of cyberspace and computer software to attack adds a new layer
    to international relations and cybersecurity. Cyberspace and various technological
    advances in cyberspionage and cybercrimes create a new strategic game where actors
    include cyberspace and online platforms to their already vast numbers of weapons.
    Various CI structures and services are using the online architecture beyond the
    nation-states. Interlinked economies play an essential role as states are working
    together to accomplish economic growth. This makes states more vulnerable to attacks
    from other states. However, there is mistrust between state actors due to geopolitics,
    making them potential political targets for increasing cyber attacks. Due to cyberspace''s
    nature and different tools to cover identities, it is difficult to identify the
    attackers, and therefore, several attacks remain undetected. Governmental actors
    are aware of the benefits of cyberspace to operate in secrecy. This means that
    cyberspace is useful to conduct large-scale attacks and operate in secret to spy
    on each other. Yet, the interconnectivity and the interdependence also make the
    states more vulnerable to direct cyberwar and warfare. These types of wars can
    have significant economic and political consequences for everyone involved, where
    counterattacks can be equally damaging to the attackers if CIs are targeted (Parker
    & Kremling, 2017, p. 113).


    Governments and state actors work closely together in transnational formations
    to share information, harmonise rules, processes, and practices to reduce the
    frictions associated with globalisation and borderless cyberspace. These actions
    of these groupings are based on mutual trust. Yet, there are also limitations
    to the collaborations due to the failure of developing global rules, processes,
    and practices to manage the growing threats deriving in and from cyberspace (Bach
    & Newman, 2010; Kshetri, 2014, p. 8; Munk, 2015). Therefore, this dependency can
    act as a deterrence mechanism that needs to be factored into the strategic planning
    where the payoff can quickly change if the conflict escalates (Kshetri, 2014;
    Parker & Kremling, 2017, p. 113). The diversity of the cyber attacks deployed
    is manifold, with public and private targets and many different attack groupings.
    Cyber attacks can be designed to damage CIs. Examples of the diversity span over
    hacking systems of private companies, such as the 2014 attack against Sony Entertainment''s
    planned cinema release of ''the Interview'' that made fun of the North Korean
    leader Kim Jong-un. The revenge from the state-sponsored hackers was a hybrid
    attack on multiple levels (BBC News, 2014; Hautala, 2016; Sang-Hun, 2014). So
    was the hacks against Ukrainian power grinds in 2015 and 2016, where there are
    clear links to the conflict between Ukraine and Russia (BBC News, 2017; Hautala,
    2016; Zetter, 2016). This hybrid warfare included attacks launched simultaneously
    online and offline to meet a political end.


    # Politically Motivated Non-state Actors in War and Warfare


    While the rules and norms about war and warfare are usually based on state actors
    operating within the legal framework of war and warfare. These rules'
  merge: -1
  img_proc: true
- pgno: 39
  md: 'regulated state actors, while several conflicts and politically motivated attacks
    are based on interstate conflicts conducted by rebel groups, insurgents, and violent
    non-state actors. These non-state actors are usually not bound by these rules.
    Therefore, governments cannot hold them responsible for their actions under international
    law. Instead, the activities might be regulated under domestic law (Jakobi, 2020,
    p. 137). Several groupings, such as guerrilla warfare, insurgencies, state-sponsored
    activities/para-military actions, share characteristics with terrorism rather
    than armed forces.


    Although the state acts outside the context of war and warfare in internal matters,
    state-supported violence policies characterise these activities, representation,
    and importation prompted by official government actors. The violence and coercion
    are launched against perceived enemies that threaten the interest or security
    of the state. Although official state actors can be involved in these activities,
    the activities are often conducted by unofficial agents contracted or encouraged
    by the state. The role of state actors is to direct these groups or set out the
    goal for the activities, but leaving the actual operation to the state-sponsored
    groups (Martin & Prager, 2019, p. 137). Non-governmental groups, organisations,
    or individuals acting consistently with state actors’ aims are perceived as a
    part of the organisation of the state. This means that there is no delegation
    of power between the state and the groups unless the state has granted the non-governmental
    organisation or actor the authority of acting on its behalf. Different actors
    outside the state’s realm might have particular technical or political expertise
    that makes them more efficient to undertake the task. It might be that the state
    is unwilling to invest in obtaining these capabilities, they are unable to do
    so themselves or the state-sponsored actors have conventional solid military capabilities,
    and by engaging with the groups outside the established areas of the state, it
    is believed that the state-sponsored group would have the ability and experience
    to deploy unconventional tactics or additional niche skills (Byman & Kreps, 2010,
    p. 3).


    Armed actors emerging during armed conflicts are fighting on behalf of the state
    or against the rebel in support of the states to shield the local population from
    rebel demands or depredations. There is an increase in non-state groups and individuals
    operating in para-military units (Martin & Prager, 2019, p. 159). The groups have
    different size, location of operation, levels of professionalism, tasks, and their
    use of weapons and violence. They also vary in their actual formation, recruitment,
    membership, and relationship with the state and the population (Jentzsch et al.,
    2015). These groups are used in various types of civil wars, including irregular
    civil wars where states are pursuing high-quality local information, ethic or
    separatist insurgencies, insurgencies or military actions against foreign occupiers,
    and conventional and symmetric nonconventional civil wars (Fearon & Laitin, 2003;
    Jentzsch et al., 2015, p. 757; Kalyvas, 2006, 2008; Kalyvas & Balcells, 2010).
    The distinction between state-orchestrated and community-driven militia formation
    and organisation is not stable over time. Just as militias formed by communities
    might need assistance from state agents to continue to mobilise recruitments,'
  merge: -1
  img_proc: true
- pgno: 40
  md: 'state agents might have supported state-orchestrated militants in the formation
    but later progress independently of the state (Jentzsch et al., 2015).


    # STATE-SPONSORED ACTORS AND CYBERWARFARE


    Although states are widely involved in cyberwar, state-sponsored actors are linked
    closely to the state apparatus. These groups are essential for the state to distance
    itself from the online attacks. However, the use of the groups cannot be underestimated
    as they are creating an essential buffer zone, which enables the state to act
    outside the constraints of international law. The groups can be enacted through
    military deployment, contractually hired for the job, or sponsored by the state.
    In all these formations, the actors might be given direct or indirect support,
    but they are not acting directly on behalf of the state or through delegated authority
    (Holt & Bossler, 2016). Groups that claim to be independent have been attributed
    to the actual state and particular departments. The close links to the state raise
    questions about whether they are included in the state apparatus pursuing its
    political agenda or acting independently with its blessing.


    Advanced persistent threat (APT) groups have claimed to be independent hacker
    groups. However, closer investigations show close links to intelligence agencies,
    distinguish between state actors and independent groups. Groups, such as the Russian
    Guccifer 2.0, Fancy Bear, and Cozy Bear, were all involved in the hacks into the
    US Democratic National Committee’s servers during the US presidential election
    in 2016. For example, it was believed that Guccifer 2.0 was a Romanian hacker,
    but investigations in 2018 traced the hacker to the Russian GRU intelligence department
    (Lavorgna, 2020, p. 176). Russian cyber attacks have included major components
    of cyberwarfare activities, including cyberespionage and influence operations.
    The actors involved and their motivations reveal a very complex structure, where
