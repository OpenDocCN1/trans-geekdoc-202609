    # Including Cost-impositions


    Considering the actual issues in the light of game theory, recent cyber attacks
    show that the vision of persistent engagement calls for preventively imposing
    costs on adversaries to sharpen competition (Valeriano, 2020; Jensen et al., 2020).
    Imposing costs are included in a layered cyber deterrence strategy where states
    are trying to influence adversaries decision-making procedures (US Cyberspace
    Solarium Commission, 2020). Unfortunately, at this stage, the cost of these attacks
    does not outweigh the actual benefit from the operations. The payoff of a successful
    attack is too high for attacking states to have any deterrence effect in the absence
    of international rules (Valeriano, 2020; US Cyberspace Solarium Commission, 2020).
    States are also becoming more willing to attribute attacks to other states. The
    number of public attributions has increased significantly. There is also a growing
    tendency for states to work together in the investigation and later the public
    attribution of attacks (Moynihah, 2019, p. 4). Despite the importance of attributions
    in international law to establish facts and circumstances to enable the affected
    states to execute their rights and obligations, it does not include any legal
    consequences of the attacks. So far, there are no developed international standards
    for producing sufficient evidence for wrongdoing. The use of state-sponsored actors
    adds to the complexity, as no rule is developed in relation to their actions online.
    These are likely to fall under national rather than international law (Katagiri,
    2021, p. 3).


    Since the cyber attack on the UK Defence Science and Technology Laboratory, while
    investigating the Salisbury biological terror attacks and the UK. has been more
    active in attribute attacks to Russia (GOV.UK, 2020; Intelligence and Security
    Committee of Parliament, 2020; Scroxton, 2020d). The Intelligence and Security
    Committee (ISC) had recommended that the UK leverages its diplomatic relationship
    and assign blame to Russia to gain support from the international community to
    find ways to retaliate or prevent cyber attacks (Intelligence and Security Committee
    of Parliament, 2020; Scroxton, 2020a). Public naming and shaming can have an indirect
    economic effect where private and public actors might refrain from investing in
    states or reconsider collaborators due to the state’s cyber record. Cyber attacks
    are often the precursor to an actual war, but the state becomes even more vulnerable
    when prioritising offensive defence rather than a multi-layered strategy. Therefore,
    there needs to be a shift in using the offensive-dominant strategies to escalate
    the tit-for-tat game. Yet, it would indicate that states have to refrain from
    using exploits to spy on other states (Schneier, 2020)'
