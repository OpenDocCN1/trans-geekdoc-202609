    # Cyber Defence: Deterrence and Defence


    It is no secret that Russia and other states are using proxies in their attacks
    or providing safe havens to attackers. It can be argued that they provide safe
    spaces similar to what Afghanistan did with Al-Qaeda terrorists (Cerulus, 2021a;
    Barnes, 2021). The US has made it clear after the string of high-profile attacks
    against essential CIs that they would respond harshly in retaliation if actors
    from Russia again violate American sovereignty (Roth & Harding, 2021). The Russian
    authorities are rarely prosecuting the attackers, and they refuse to extradite
    them. In a reaction to the Colonial Pipeline attack, US President Biden argued
    that Russia allowed the cybercriminals to operate within the Russian border. Therefore,
    Russia has some responsibilities for the increase in attacks (Perlroth & Satariano,
    2021). Biden argued that there is mutual self-interest to manage this area. He
    indicated that if further attacks emanated from the Russian territory, the US
    also has substantial cyber capabilities to respond to the attacks (Computer Weekly,
    2021). After the 2021 Geneva Summit between Russia''s President Putin and US President
    Biden, it was clear from the US side that they expect that Russia would act on
    the growing number of attacks (Holland & Shalal, 2021; Roth & Harding, 2021).


    # STRATEGIC REVIEW


    By linking ransomware to terrorism, new powers and investigative practices and
    processes are accessible to be used by state actors and law enforcement. These
    are counter-terrorism measures reserved for national security cases. Enacting
    these powers shows the seriousness of the attacks (Bing, 2021). This new initiative
    has been critiqued. Shield (2021) argued that linking ransomware and terrorism
    in a generic sense is likely incorrect and is not nuanced enough as ransomware
    and terrorism cannot be compared like to like. For example, if an attack is conducted
    towards a small entity, it is unlikely to act terrorism. However, if the attack
    takedown CI such as an oil pipeline or a water system, then it would classify
    as terrorism. This means that the target and the intentions are the determining
    factors. Yet, if connecting'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'the attacks to terrorism is the way to enact a government response, then the
    new measure might be the best option as deterrence and defence against these attacks.
    This initiative cannot stand alone if the current level of ransomware should be
    reduced (Security, 2021). The US administration has prioritised a more coordinated
    approach by engaging public–private partnerships nationally and internationally.
    So far, there is no evidence that the attack rate is slowing down, and the responses
    to the risks have mainly been insufficient and fragmented (Scroxton, 2021c). Collaboration
    seems to be the key to break the deadlock of managing these attacks. One of the
    most important steps is to get the global public and private community involved
    to address the global threat. The US Deputy National Security Advisor Neuberger
    urged private actors to take more responsibility to prevent attacks (Scroxton,
    2021c; Barnes, 2021)


    # National Security Threat


    Managing attacks require state engagement in protecting vital assets. Intelligence
    communities and law enforcement should play a more visible role in sharing information
    and other resources to collect evidence and identify and pursue the attackers
    (Chapple, 2021; Ransomware Task Force, 2021). The US Ransomware Task Force (2021)
    forwarded recommendations for urgent implementation. First, coordinated international
    diplomatic and law enforcement efforts must be engaged to prioritise ransomware
    using a comprehensive and reduced strategy proactively. This strategy should include
    a carrot-stick approach to direct states away from providing safe havens to ransomware
    criminals. Second, governments should enhance resilience towards sustained, aggressive,
    and intelligence-led ransomware campaigns. The solution is to bring together a
    multistakeholder framework with public and private entities. Third, governments
    are urged to establish Cyber Response and Recovery Funds to support the activities
    to counter ransomware. Fourth, the international coordinated response and efforts
    should develop a clear, accessible, and broad framework to support organisations
    to prepare and respond to ransomware. Regulations might be included to drive the
    adoption in under resources and critical sectors. Finally, the cryptocurrency
    sector should take responsibility as the ransomware actors use cryptocurrencies
    as their ransom demand. The sections should be more closely regulated, and governments
    should demand that cryptocurrency exchanges, crypto kiosks, and over-the-counter
    trading desks would comply with existing laws (Ransomware Task Force, 2021, p.
    6).


    The international society needs to stand together in sending a signal to the cybercriminals
    that this type of crime is a diplomatic and cybersecurity priority. The response
    and initiatives should be launched on multiple levels, including the G7, G7 finance
    minister, G20, Interpol, and Europol. The message should be enforced that ransomware
    is now considered a national security concern and threat to CIs (Ransomware Task
    Force, 2021, p. 21). There need to be a joint effort on the international, regional,
    and national'
  merge: -1
  img_proc: true
- pgno: 202
  md: 'levels to deal with the growing number of attacks involving both public and
    private actors.


    # G7 AND NATO''S REACTIONS TO RANSOMWARE ATTACKS


    In both the G7 and NATO''s 2021 Summits, malicious ransomware attacks have been
    discussed. One of the concerns of the G7 group is the substantial amount of ransomware
    attacks launched from Russia against foreign targets. The G7 group restated that
    they want a stable, predictable relationship with Russia. Therefore, they urged
    President Putin''s government to identify, disrupt, and hold the cybercriminals
    to account for the online attacks, abuse of cryptocurrencies, and other related
    cybercrimes (Scroxton, 2021b). The UK echoes the US'' concerns about ransomware
    and the growing number of malicious attacks by state-sponsored and state-supported
    groups. In relation to the G7 meeting, the UK Foreign Secretary promised to take
    a stricter stance on cybercriminals and other threat actors, such as the state-supported
    actors engaged in ransomware attacks. The UK indicated an ambition to take a leadership
    role in establishing international norms and processes to become more resilient
    and fill in the current legislative vacuum exposed by states and state-supported
    actors (Scroxton, 2021a).


    After the NATO Summit, the Alliance outlined a communique about responding to
    national security threats (Tung, 2021a). NATO argued that the Alliance is determined
    to employ its range of cyber capabilities to deter, defend, and counter online
    threats under international law. NATO also opened the possibility that an attack
    on one Member State could trigger Article 5, which means an attack on one of the
    NATO states is an attack on all. However, such a division would be determined
    on a case-by-case basis. The Alliance considers that the impact of these cumulative
    cyber attacks can be compared with an armed attack (Computer Weekly, 2021; NATO,
    2021). NATO''s statement highlighted that those aggressive actions from Russia
    constitute a security threat to the Euro-Atlantic Alliance. The statement indirectly
    supports the US argument that ransomware attacks constitute terrorism by claiming
    that terrorism in all forms and manifestations is a constant threat to the member
    states (NATO, 2021; Tung, 2021a). However, the threat of using Article 5 does
    not align with the ransomware attacks unless a clear attribution to the state
    hosting the attackers can be made.


    # THE EU''S RESPONSE TO RANSOMWARE ATTACKS


    The EU has also grasped the seriousness of ransomware attacks, particularly after
    witnessing the devastating impact of the attack on Irelands Health Services. Nevertheless,
    the EU is falling short of classifying attacks similar to terrorism. Using the
    term national security issues shows the seriousness of these attacks, moving them
    from being considered a cybercrime. However, the attacks have increased within
    the member states, going up from 432 reported'
  merge: -1
  img_proc: true
- pgno: 203
  md: 'incidents in 2019 to 756 in 2021 (Tidy, 2021a). The European Commission focuses
    on creating a cyber office where diplomats, defence officials, and law enforcement
    agencies can coordinate their work across the member states to manage cyber threats
    (WSJ, 2021).


    A proposal has been launched to develop a team of multinational cyber experts
    to be rapidly deployed to the European member states during severe attacks. Previously,
    these attacks have been linear and, to a certain extent, simple. This is no longer
    the case, as demonstrated by the attacks on Ireland’s Health Service and French
    public hospitals, but the current structure cannot deal with these types of attacks.
    The complexity of these attacks requires collaborative actions from all member
    states, Yet, it takes time to develop response teams (Tidy, 2021a; Murphy, 2021).
    The EU recommended that national governments put the European Union Agency for
    Cybersecurity (ENISA) in charge of a similar unit similar to the US-based Ransomware
    Task Force. The European initiative would coordinate existing work between cyber
    agencies and EU member states to mirror the national initiatives to boost cybersecurity
    (Hellard, 2021). In this context, the unit should help develop the member states
    cyber-defence capabilities. The Joint Cyber Unit will first be operational until
    2022 and fully established until 2023 (Tidy, 2021a; Murphy, 2021; Cimpanu, 2021b).


    The EU has also joined the US in criticising states harbouring cybercriminals.
    The ‘fight against ransomware’ mirrors the well-known rhetoric ‘fight against
    terrorism’ used after the US 9/11 attack (Cerulus & Goujard, 2021). The US and
    EU summit in 2021 also included discussions about ransomware attacks. The two
    partners aim to revitalise the relations between them and enhance cooperation.
    The collaboration between the EU and the US have launched initiatives to share
    information and exchange best practices to manage the attacks (Cimpanu, 2021b).
    This means more collaboration between law enforcement, awareness-raising about
    the threat and risk of paying a ransom and putting pressure on states hosting
    these groups to arrest and extradite or effectively prosecute cyber criminals
    on their territory (Cerulus & Goujard, 2021).


    # Conclusion


    The ransomware attacks illustrate apparent issues with managing the area and building
    up a resilience framework based on deterrence and defence. Without any doubt,
    ransomware attacks constitute a significant challenge for the victims and the
    wider society. The attacks are getting more severe, and they happen more frequently.
    Additionally, they have ramifications beyond the original targets. The attacks
    bear substantial similarities to terrorism. However, there is no clear definition
    of cyberterrorism suitable for managing the area. The attacks are caught up in
    a grey zone between conventional terrorism and cybercrime, where none of them
    is sufficient to cover the offences. Therefore, it is essential that states addresses
    the legislative lacuna and the missing cybersecurity framework.'
