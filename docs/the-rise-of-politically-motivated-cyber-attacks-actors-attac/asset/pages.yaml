- pgno: 171
  md: '# 6 Cyberterrorism and Ransomware


    # State-supported Groups


    # Introduction


    In cyberwarfare, the interest is limited to the online space as information warfare,
    and cyberwarfare is linked to specific targets as a part of an ongoing conflict.
    In cyberterrorism, there are not the same constraints. Instead, cyber-terrorism
    causes fear to a broader audience, and the actions can potentially harm anyone
    within the targeted area. This is a constantly developing area and since 2021,
    the conceptualisation of ransomware attacks has changed which beings these online
    attacks under the terrorism-umbrella. Therefore, this chapter will predominately
    focus on ransomware attacks, as the attacks share significant similarities with
    cyber-terrorism. Chapter 6 will also distinguish between the state-sponsored actors
    and state-supported actors.


    The state-supported groups are closely interlinked with the state and cyberwarfare.
    In comparison, the state-supported actors act independently but follow the overall
    state agenda. These are the actors behind the wave of ransomware attacks, and
    they are often seen as cybercriminals. Currently ransomware groups are perceived
    as state-supported groups operating with near impunity as long as they are following
    simple rules; not attacking own citizens, and following they are following the
    overall strategies of the state in the target selection. The sections in this
    chapter focus on motivations, the groups, and the means and methods used in the
    context of cybersecurity strategies.


    # Conceptualising Terrorism


    Cyberterrorism is defined as using computer network tools to shut down CIs, such
    as energy, transportation, government operations; or the activities are used to
    coerce or intimidate governments or citizens (Lewis, 2002). The groups are predominately
    linked to a request for change, spread fear, or support a particular political
    stance. Defining and differentiating cyber-terrorism from politically motivated
    cyber attacks and groups can be complicated as the different actors share the
    same means and methods. If a'
  merge: -1
  img_proc: true
- pgno: 172
  md: 'state sets out the goal, but the groups act independently, the actions are
    likely to be perceived as cyberwar and warfare (state-sponsored actors). Compared
    with this definition, the state-supported groups share a common goal with the
    state. However, they act entirely autonomously in the decision-making process
    and the operations (state-supported actors). Other groups and activities are considered
    in relation to cybercrime. These are politically motivated non-state actors operating
    independently of state actors and state goals, i.e. hacktivism and online.


    # Offline Terrorism Definitions


    There is not developed a universally agreed definition of terrorism and cyberterrorism.
    Although most states have developed national definitions, there are inconsistencies
    in applying them to particular incidents. This means that states are left to unilateral
    defining terrorism as a concept. The definition can change due to the state’s
    interest at a particular time (Marsili, 2019). The definition of terrorism is
    closely related to the actual perspective on political conflict or disagreement.
    The perspective “one man’s terrorist is another man’s freedom fighter” is widely
    recognised as the core element of failing to develop a comprehensive definition
    (Carver, 2016, p. 125; Bassiouni, 2001; Ganor, 2002; Kennedy, 1999). These two
    sides, terrorism versus freedom fighters, depend on the political stance where
    the conceptualisation may reveal ideological or political bias (Matusitz, 2021).


    Terrorism, in a simple form, can be defined as “politically motivated violence
    against non-combatants to coerce through fear” (Matusitz, 2021, p. 18; Marks,
    2004, p. 107). Walter (1969) created a clear definition of the aim of terrorism
    by stating that “[t]he proximate aim is to instil terror; the ultimate end is
    control” (Matusitz, 2021, p. 18; Walter, 1969, p. 13). However, Denning (2000)
    has a broader definition of terrorism by stating that it is “[t]he unlawful use
    or threatened use of force or violence by a person or an organised group against
    people or property with the intention of intimidating or coercing societies or
    governments, often for ideological or political reasons” (Denning, 2000). The
    crucial elements are the unpredictability of attacks, and this makes terrorism
    threatening. Attacks can happen anywhere by striking sensitive targets indiscriminately,
    cause widespread fear, and make people feel helpless and insecure. This feeling
    of uncertainty erodes the feeling of security. It is the main drive for people
    questioning the level of security, the foundation of society, and governments
    and governmental actors’ ability to secure the state and its citizens (Matusitz,
    2021, p. 21). The aim of terrorism is not the victims who suffer from the attacks.
    Instead, the targets are governments, societies, groups of citizens to trigger
    a reaction or overreaction of fear, repulsion, intimidation, or radicalisation
    (Cronin, 2003, p. 32).'
