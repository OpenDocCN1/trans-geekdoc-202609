  md: 'same government attention level compared with other CIs and essential services.
    This area was not considered a CI in the US until 2003 (Rosenbaum, 2021). The
    attack acts as a wake-up call for the US meat industry, highlighting the vulnerabilities
    in the food supply chain and the importance of having a more diverse meat processing
    capacity (Quinn, 2021). The FBI has attributed the JBS attack to the ransomware
