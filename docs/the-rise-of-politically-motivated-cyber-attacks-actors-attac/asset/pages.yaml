- pgno: 25
  md: 'methods used in the attacks. These three areas are linked to the strategic
    position of the actors. The theoretical foundation derives from risk and anticipatory
    governance forms imposed to decrease the attacking actors’ payoff, such as the
    developed deterrence and defence measures. Chapter 1 sets out the framework for
    understanding critical aspects in this book, covered in depth in the following
    chapters. Notably, this chapter defines the distinct elements in CIs essential
    for understanding how these structures and services underpin the online environment
    and societies dependency on the consistent function of these structures and services.
    Therefore, these entities are increasingly vulnerable to attacks, which require
    a high level of protection and security measures. Chapter 2 moves on to defining
    the actors in the online environment and applies the definitions to key online
    groups. The aim is to understand the complex offline groups and their foundation
    applicable to online groups. Likewise, this chapter also outlines how the actors
    are exploring the online environment. Chapter 3 follows this conceptualisation
    of actors by adding the different attack forms to the context. The actors are
    innovative and constantly exploring new ways to exploit the victims. Hence, the
    chapters outline a list of current means and methods. Chapter 4 is the final definitional
    chapter. The core elements generate an understanding of the anticipatory governance
    forms based on risk. This book’s theoretical foundation aligns with the complexity
    theory and game theory introduced to the security strategies, deterrence and defence
    policies.


    # Part 2


    The second part of this book covers three case studies outlined in Chapters 5–7.
    The three main areas included in the chapters are motivation, actors, and means
    and methods. Each of the three chapters includes discussions about influential
    attacks conducted within a short time frame, classifications of actors, key legislations,
    and strategic positions to decrease the risks. The three areas are distinct, and
    the discussion points are not directly comparable. However, key elements apply
    to all three areas, and there are overlaps between the areas. Chapter 5 focuses
    on how state-sponsored actors are used in cyberwar and warfare, where groups operate
    in the grey zone of international law. This exposes a significant absence of regulations,
    cyber norms, and practices. Chapter 6 explores a new area where ransomware attackers
    are considered a national security threat and can be linked to terrorism. The
    actors are not state-sponsored. Instead, they are state-supported, operating with
    more autonomy. Again, this is a borderline concept where the legislation and norms
    are underdeveloped. The actors are usually associated with financial cybercrime,
    but this has changed, and they are categorised as politically motivated actors.
    Chapter 7 covers non-state actors engaged in online activism of various forms.
    The focus is predominately on new groups conducting attacks that have a significant
    impact; however, this chapter converging on two directions, the legal, political
    activist and the hacktivist conducting illegal'
