  img_proc: true
- pgno: 267
  md: '# Private Sector Engagement


    Private entities also need to enhance their cybersecurity level. Competitive interests
    have for a long time influenced the area. On the one hand, the protection of computer
    systems, networks, CIs, and services had been overshadowed by geopolitical tensions
    and state interests that has increased the risks and decreased cooperation on
    the political level (Bravo, 2020). This focus has created a vacuum. Many businesses
    and organisations have been left alone to create a cybersecurity framework by
    establishing a reactive legal structure without support and guidance from the
    state (McAlpine & Oldham, 2018).


    On the other hand, the cybersecurity issues are filtered down through the systems.
    The private sector has significant power to impact resilience and preparedness,
    and actions could have been taken earlier. However, global tech companies have
    advocated for open digital borders to incorporate a global supply chain and enable
    online connectivity worldwide. These actors have also challenged core competencies
    of the states, i.e. standard-setting and monetary policies. Technological supremacy
    and national competitiveness are interlinked. Therefore, the lack of global tech
    governance has enabled the companies to influence standard settings, foreign participation
    in CIs, foreign purchase of national technology, offshoring data, and transfer
    technologies to gain access to the international market (Bravo, 2020). Cybersecurity
    needs to be factored into the private sector’s competitiveness, business structures,
    and policies.


    The book has exposed the public and private sectors’ vulnerabilities and lack
    of preparedness if attacked. Governments and international organisations and institutions
    have been preoccupied with establishing their role and operations in cyberspace
    for a long time. Actors on multiple levels ought to participate actively in enhancing
    anticipatory responses. Governments, organisations, the private sector, and individuals
    should implement and maintain cybersecurity processes and practices based on internationally
    accepted norms and standards, including privacy protection and security technologies.
    Software and hardware developers significantly enhance cybersecurity by including
    resilience and preparedness to gap vulnerabilities in an anticipatory framework
    (Wegener, 2011, p. 96; Munk, 2015; McAlpine & Oldham, 2018).


    # Cybersecurity and Strategies


    What can be done about these issues? The current diplomatic climate for developing
    a framework mirrors the Cold War. The tit-for-tat games between the states are
    becoming more prominent, with harsh rhetoric in public exchanges public, which
    does nothing to manage the current situation. Competitions between the states
    to become the most cyber power are based on mistrust and revenge, escalating the
    ongoing conflict holding several entities and online users hostages.'
  merge: -1
  img_proc: true
- pgno: 268
  md: 'The US and allied have developed a practice of attribute states and actors
    in public; sanctions have been imposed, and individuals have been indicted (EC,
    CoEU, 2020; The White House, 2021; Carrega, 2020; Paganini, 2018). The victims
    cannot identify the attackers at the beginning of an attack where they are indistinguishable
    from other attackers. The attacker can be an insider, a hacker, a rough actor,
    an organised criminal, a lone wolf, a terrorist, or a national state. It is a
    difficult task to track and trace the attackers and criminal activities. Often,
    it is impossible to attribute the attack to a particular individual, group, or
    state. Often the attribution is based on a group’s known means, method, and motivation
    rather than a precise identification (Westby, 2011, p. 90).


    These actions have been taken to impose costs on the attacking states and actors.
    So far, there has not been any notable effect. The prosecution will only be possible
    if the actors are located in states with extradition agreements. Russia has refused
    to investigate and prosecute the ransomware actors, claiming that there is no
    legislation in place. However, there is a lack of willingness as long as the actions
    of the state-supported actors align with the state’s cyber strategies, and there
    is not imposed a negative payoff. The only actors that are likely to be prosecuted
    are hacktivists.


    # DETERRENCE AND DEFENCE


    States have changed their defence strategies; for example, the US has taken a
    more proactive approach in the ‘defend forward’ strategy. Other Western states
    are more cautious as these actions can escalate the attacks. According to the
    UN Charter, states are obliged according to Article 2(4) to refrain “from the
    threat or use of force against any state’s territorial integrity or political
    independence” (UN, 1945; Gopalan, 2018; Waxman, 2011, p. 426). However, Article
    51 highlights that the states still possess a right of individual or collective
    self-defence. The challenging point is when this right to use forces equally-armed
    attacks. It also needs to be considered if the attacks violate the territorial
    integrity of the state. If an attack has a physical consequence, it might fulfil
    the requirements under international law. However, it is not clear when it is
    permissible to launch a cyber attack in self-defence (Gopalan, 2018; Waxman, 2011).


    # The Way Forward – Some Initiatives


    # Private Collaboration


    Initiatives have been launched to increase resilience against attacks. In 2018,
    34 companies, including multinational companies such as Facebook, LinkedIn, Dell,
    and Cisco, signed a Cybersecurity Tech Accord pleading to uphold four vital principles
    to enhance cybersecurity. These principles are as follows: Protect all online
    users and customers everywhere; Oppose cyber attacks on innocent citizens and
    enterprises from anywhere; Empower users, customers, and developers to strengthen
    cybersecurity protection; and partner with each other and with like-minded groups
    to enhance cybersecurity. This'
  merge: -1
  img_proc: true
- pgno: 269
  md: 'initiative is a step in the right direction, but more private sector engagement
    is needed (Meyer, 2020; Smith, 2018). One lesson to be learned from the SolarWinds
    attack is that everyone can become a target, and interconnectivity and interdependencies
    make companies more vulnerable (Schneier, 2020).


    # Growing Concern about Attacks on Healthcare Services


    During the COVID-19 pandemic, many attacks have been launched towards healthcare
    organisations and research facilities. In the 2020 Paris Forum, more than 65 healthcare-related
    organisations joined the Paris Call for Trust and Security in Cyberspace. This
    initiative includes organisations and businesses working on vaccines, hospitals,
    and governmental institutions. The Paris Call is a robust multistakeholder coalition
    addressing online attacks against the health sector. The first principle developed
    is to prevent malicious cyberactivities threatening indiscriminately or systematic
    harm to people and critical infrastructure (Burt, 2020; Paris Call, 2018).


    In May 2020, the Oxford Process, which includes 136 of the world''s most prominent
    international law experts, stated that all medical facilities are protected by
    international law at all times. Later, a second statement was published second
    statement stating that organisations involved in researching, manufacturing, and
    distributing COVID-19 vaccines are also protected (Burt, 2020; Oxford Institute
    for Ethics, Law and Armed Conflicts, 2020a; Oxford Institute for Ethics, Law and
    Armed Conflicts, 2020b). The Oxford statement emphasised that cyberoperations
    do not occur in a normative vacuum or a law-free zone. The UN General Assembly,
    international law, and the Charter of the UN are applicable. The rules outlined
    by these key international institutions and conventions are essential to maintaining
    peace and stability and promoting an open, secure, stable, accessible, and peaceful
    information and communications technology environment (Oxford Institute for Ethics,
    Law and Armed Conflicts, 2020a).


    Similarly to these statements, the CyberPeace Institute, the International Committee
    of the Red Cross, and 40 international leaders also launched a call for governments
    to stop attacking the healthcare sector (Burt, 2020). The same institute joined
    forces with the WHO to highlight that the practices used in cyberspace endanger
    human life (CyberPeace Institute, 2020). Grassroot movements, experts businesses
    are becoming concerned about the current situations, and they are not raising
    their voices to pressure the politicians to find a solution to these issues.


    # The US–Russia Summit in 2021


    Diplomacy still exists, at least on the surface, and talks have emerged between
    the US and Russia at a summit in Geneva in 2021. US President Biden and Russia''s
    President Putin agreed to develop a cybersecurity arrangement between the two
    countries. This agreement aims to protect healthcare, utilities, and other CI
    to'
  merge: -1
  img_proc: true
- pgno: 270
  md: 'ensure that the public is safe from these attacks (Tidy, 2021; Paul, 2021;
    Nichols, 2021; Computer Weekly, 2021). However, these talks are likely to drag
    out as the two sides disagree about the high-profile cyber attacks launched against
    the US. During the Summit, President Biden gave President Putin a list of 16 targets
    of ‘off-limits’ targets that the US would seek to agree with Russia about (Tidy,
    2021; Roth & Harding, 2021). Although the US and Russia, in principle, agreed
    that something should be done about the surge in cyber attacks, and particularly
    about ransomware, it remains uncertain if the Russian authorities will take action
    on these matters (Computer Weekly, 2021; Cerulus, 2021).


    Nevertheless, the idea of an online CI truce is unlikely if it is only binding
    state actors. The use of state-sponsored and state-supported is the core problem
    in the escalation of attacks. The state-supported actors can easily hide within
    this formation and continue to attack and terrorise governments, businesses, and
    populations on foreign soil if state-sponsored groups are tied up to a bilateral
    agreement (Nichols, 2021). Therefore, it is required that both countries in 2021
    work together to identify what is included in the ‘off-limits’ statement and follow
    up on cases originating in order countries (Computer Weekly, 2021). The positive
    element is that CI protection was discussed, and the two states agreed, in principle,
    to take these matters forward. The international society will closely watch what
    is happening in the future. In this sense, the payoff might change slightly.


    Russia might appear willing to engage with the US. But de facto, the status quo
    will continue as the Russian authorities deny the problem. President Biden also
    voiced scepticism about the possible outcome of these talks when he stated: “It’s
    about self-interest and the verification of self-interests. Or, as the old expression
    goes, the proof of the pudding is in the eating” (Roth & Harding, 2021).


