    prosecution compared with more severe costs associated with prison sentences.
    There are different definitions of hackers in national legislation, and there
    are also different perceptions in societies about the seriousness of hacktivism
    and online protest. Political activists and hacktivists consider themselves having
    the right to protest online and offline against what challenges their political
    or social beliefs (McAlpine & Oldham, 2018). Although the prosecution has a deterrence
    effect, they are also likely to conflict with the right to protest. So criminalisation
    and prosecution should be weighed up against political and personal rights.


    # Protection of CIs


    Another important conclusion drawn from the book chapters is the importance of
    enhancing the cybersecurity level to change the payoff for the attackers. One
    way to do this is to enhance the capabilities and capacities for managing these
    attacks on state levels. However, it is equally important to consider a multilayered
    approach where proactive and reactive measures are developed on multiple levels.
    One of the most critical areas is developing cybersecurity for public and private
    entities owning or operating the CIs. This would change the costs as it would
    become more challenging to attack the sites, and if attacked, the CIs would quickly
    be able to restore its operations. This book has also highlighted the issues with
    the protection of CI. There has been a steady increase in attacks against CIs,
    and over the years, there have been significant attacks that should have prompted
    more awareness about resilience and preparedness. The Estonia 2007 attack raised
    concerns about public and private actors, but not enough to create an international
    framework for protecting these vital assets (BBC News, 2007). Other high-profile
    attacks, such as the Stuxnet worm (2010), the Wannacry and NotPetya (2017), should
    also have acted as a facilitator for change (Hern, 2017; Zetter, 2014). It is
    not until 2020–2021, where the high profiled attacks against SolarWinds, COVID-19
    research, healthcare facilities, the Microsoft Exchange hack, that the pressure
    for developing more comprehensive cybersecurity frameworks have emerged (Constantin,
    2021; Osborne, 2021; Burt, 2020; Stilgherrian, 2020). Ransomware attacks on businesses,
    military units and contractors, governmental departments, education, health care,
    and other vulnerable areas have shown the powers of these attacks and the impact
    they have on'
