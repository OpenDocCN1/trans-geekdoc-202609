    # Attack on CI: Colonial Pipeline


    The first attack was the attack launched towards the Colonial Pipeline operator
    on the US East Coast. The company shut down the pipeline as a precaution to prevent
    the attackers from obtaining information that could allow the theme to attack
    sensitive parts of the line (Sanger et al., 2021; Associated Press, 2021; Otto,
    2021). The shutdown lasted several days, led to increased prices, panic buying,
    and local fuel shortage (Bing, 2021). The US President Biden claimed that his
    administration would pursue measures to disrupt this forensic ransomware groups’
    operation ability. It is not ruled out that these measures might include retaliatory
    cyber attacks (Suderman, 2021b). The FBI attributed the attack to the DarkSide
    group, and President Biden subsequently claimed this group would be eliminated
    and prosecuted. However, since the group operates from Russia or one of the former
    Soviet states, it is unlikely that the US would have a successful prosecution
    due to the ‘one rule’ agreement with the Russian authorities (Sanger et al., 2021;
    Associated Press, 2021).


    # Attack on Essential Services: JBS


    Shortly after the Colonial Pipeline attack, the world’s largest meat supplier,
    JBS, was attacked. This attack impacted several of its pork, poultry, beef, and
    prepared-food plants in the US, Australia, and Canada (BBC News, 2021a; Sorvino,
    2021). Although the production was restored quickly, there have been concerns
    raised about the production and distribution line and the company’s market domination.
    The food and agriculture sector has not received the'
