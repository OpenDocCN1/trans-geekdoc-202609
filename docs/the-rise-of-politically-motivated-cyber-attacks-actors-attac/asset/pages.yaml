- pgno: 198
  md: 'and freezing assets, Russia might change its position (Arce & Sandler, 2005,
    p. 184). The first step to unlock more powerful measures requires that states
    classify ransomware attacks as terrorism.


    After the DarkSide attack on Colonial Pipeline, the White House administration
    called the attackers ‘hackers’. They did not use the stronger narrative of terrorists
    or terror about the attack. Nevertheless, the DarkSide attack meets vital elements
    of terrorism legislation. For example, 18 USC 2331 focuses less on the motivation
    of terroristic acts and more on the intent in (i) to intimidate or coerce a civil
    population (US.Gov, 1991). According to the UN, cyber attacks might bear the characteristics
    of terrorism, such as to install fear of continuance of political or social objectives
    (UNODC, 2012, p. 11).


    After the JBS attack, the US DoJ has formed an internal task force to manage ransomware.
    Subsequently, the US DoJ linked ransomware and terrorism by prioritising the investigation
    by using structures traditionally reserved for terrorism (Scroxton, 2021c; Bing,
    2021; Security, 2021). These attack methods are now considered national and economic
    security threats to the nation (Bing, 2021). The US DoJ recommended that senior
    officials pursue cases more aggressively, including the FBI and the US Secret
    Services. The DoJ sent internal guidance to US Attorney’s offices across the country
    that the new task forces in Washington should centrally coordinate the ransomware
    investigations (Ransomware Task Force, 2021, p. 25).


    # INSURANCE PAYMENT


    Various areas related to managing ransomware should be incorporated into cybersecurity
    strategies. For example, it could be a requirement for businesses to report ransomware
    attacks, and they should also be encouraged not to pay the ransom. In the current
    climate, companies are unwilling to report these incidents that might delay a
    solution to the problem, allowing them to return to normal operations. Currently,
    the investigations are too slow and time-consuming, leaving the victims unable
    to resume their operations (Security, 2021). A coordinated governmental response
    is needed to ensure that cyber resilience is enhanced on multiple levels, including
    international diplomatic efforts and prosecution for cybercriminals.


    Asking for ransom is a tactic used by terrorist groups over the years. Groups
    have deployed an umbrella of means and methods to gain international publicity
    from their activities and gain large ransom payments (Wilkinson, 2011, p. 27).
    Over the years, ransomware groups have developed a multibillion-dollar industry
    based on these attacks. The total amount of ransom paid by victims reached nearly
    350 million dollars worth of cryptocurrencies in 2020. Compared with 2019, the
    amount paid in ransom increased by 311%. However, most payments are shared with
    a small number of very organised cybercriminals, such as Evil Corp and Darkside.
    For example, 199 deposit addresses received approximately 80% of all the payments
    in 2020, where a limited group of 25 addresses received nearly half of these payments
    (Lee,'
