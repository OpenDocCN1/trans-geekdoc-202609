- pgno: 76
  md: 'processing company, JBS. The attack was launched towards the US and Australian
    meat plants and resulted in shutting down the factories. Also this attack is attributed
    to a Russian state-sponsored RaaS group REvil (BBC News, 2021a; CSIS, 2020; Lerman,
    2021). The REvil ransomware group also conducted a large-scale zero-day supply-chain
    attack exploiting a vulnerability in Kaseya VSA software against multiple-managed
    service providers and their customers. Hundreds of companies, including a railway,
    pharmacy chain, and the Swedish Coop grocery chain, were directly hit by the attack,
    with more than 36,000 companies indirectly affected (Moyer, 2021; Osborne, 2021).


    # Attack Means and Methods


    Attacks against information systems are growing concerns globally. These are potential
    targets for politically motivated groups and individuals launching attacks against
    parts of the important CI (EC, 2013, p. 1). According to the EU (2013) these large-scale
    cyber attacks can have significant economic impact on the targets. For example,
    cyber attacks can interrupt information systems and communication, can cause loss
    or alteration of commercially important confidential information or other types
    of data. CI, CNI, CII, ICTs are considered particularly vulnerable to such attacks
    due to their increased dependence on the functioning and availability of information
    systems and often limited resources for enhancing their cybersecurity (EU, 2013,
    p. 1). New ways of carrying out attack campaigns have emerged to undermine trust
    and create uncertainties, such as coordinated political trolling, spreading dis-,
    mis-, and malinformation, as well as DDoS attacks, espionage, or ransomware attacks.
    States and state-sponsored groups have significant cyber capabilities to target
    governments, businesses, and individuals. Yet, non-state actors also use their
    cyber powers to launch attacks to show their political stance, i.e. hacktivism
    and online civil disobedience.


    New means and methods have emerged that can be used against several targets or
    allow the attackers to access the systems and stay operational for a long time.
    Some attack forms are sophisticated, such as APTs, brute force, zero-day, and
    supply-chain attacks. However, new ways of using legitimate tools have also emerged,
    such as overloading web pages with images and information without using DDoS tools.
    These attacks are straightforward, and no computing skills are required. However,
    the new attack form requires a level of organisation to enable several actors
    to conduct simple pre-determined tasks simultaneously. These attacks challenge
    the current understanding of cyber attacks and the preferred means and methods.
    Table 3.5 covers several contemporary means used by politically motivated actors.


    These attacks are widely used and provide the concern stops of the contemporary
    cyber attacks used by state and non-state actors.'
