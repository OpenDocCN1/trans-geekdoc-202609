  md: '2020). However, it is never guaranteed that the encryption code is delivered
    or that the data are intact. The attack increase in 2020 and 2021 are linked to
    advanced attacks combining automation with hacking. Due to these complex attacks,
    it becomes difficult to recover and restore the services (Sophos, 2021).


    # Ransomware and Terrorism


    The overarching question is, are these ransomware attacks merely a part of a criminal
    enterprise, which sometimes targets public or political institutions. Or can the
    activities be sidelined with terrorism due to the means and methods used, the
    target selection, the impact on society? Ransomware is not just about extortion
    and money. It is an attack form that goes beyond business, government, academic,
    and geographic boundaries. The attacks have affected the healthcare industry,
    schools, and higher education, police states, cities, governments, and other vital
    services (Ransomware Task Force, 2021, p. 3). The attack identified from the state-supported
    actors involves, for example, espionage where the attackers discover corporate
    secrets, technologies, and political information. Another helpful tactic is attacking
    CI, CII, and ICTs of state institutions, departments, or companies. This can severely
    damage the victims of these practices and diminish their defensive capabilities.
    These attacks can also be a taster session to check cyber capabilities and the
    actual cybersecurity level of the victim (Hernández, 2021).


    To classify as terrorism, some elements need to be satisfied. An attack needs
    to be an act of terrorism; it must be a violent act or an act that is dangerous
    to human life, property, or infrastructure. These elements are included in various
    terrorism definitions (Patel, 2021). However, recent attacks on CI and other assets
    differ from the conventional terrorist groups where the attacks are targeting
    physical assets. These attacks often have a direct impact on ordinary citizens.
    Yet, this is not necessarily the case with cyberterrorism, but these attacks often
    have an indirect physical impact. Already in 2013, US President Obama issues an
    executive order to enhance the protection of CIs, stating that “cyber threat to
    critical infrastructure continues to grow and represents one of the most serious
    national security challenges we must confront” (Patel, 2021, p. 29). With the
    ransomware attacks, the prediction in 2013 has become a reality.


    # FOR POLITICAL, IDEOLOGICAL, OR RELIGIOUS REASONS


    Cyber terrorism is an organic concept, and due to the lack of a clear definition,
    several different groups can be classified as terrorists. Assumptions derive from
    the definition that there should be a strong link between ideology and the involvement
    of terrorism. The actors are seen as acting/driven by a hostile ideology as they
    carry out the acts. However, terrorism can also be considered when the hostile
    ideology on the individual level is minimal or absent but the political. This
    lead to discussions about whether an actor'
