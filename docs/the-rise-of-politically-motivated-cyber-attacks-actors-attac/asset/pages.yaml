- pgno: 220
  md: 'Although the UK has not explicitly mentioned hacking, the UK Crown Prosecution
    Service has outlined hacking in its Cybercrime Guidance and defined the area as
    a form of intrusion that target computers, including module phones and tablet
    devices (The Crown Prosecution Service, 2019). Hacking is generally included in
    the legislation as it creates a foundation for many cyber-dependent crimes. For
    example, the French Criminal Code (FCC), Article 323–1, criminalising hacking
    by relating it to unauthorised access to an automated data processing system (Lecomte,
    2020). Similarly, the German Criminal Code Sections 202a and 202b also criminalise
    hacking (Niethammer et al., 2020).


    The US has also introduced similar legislation in the Computer Fraud and Abuse
    Act 1986 (CFAA), where hacking is referred to as ‘without authorisation’ or ‘exceed
    authorisation’. The phrase without authorisation is typically linked to external
    attackers. Whereas the exceed authorisation would be insiders, such as employees
    (Doyle, 2014, p. 4; Marshall Jarrett & Bailie, 2015, pp. 7–12). The CFAA has been
    amended to cover several new hacking methods that have evolved beyond the original
    intent (National Association of Criminal Defence Lawyers, 2021; Office of Legal
    Education Executive Office for United States Attorneys, 2015). See Table 7.5.


    The legislation broadly defines these areas in relation to financial institutions
    or the US government (Office of Legal Education Executive Office for United States
    Attorneys, 2015). The definition of protected computers was also expanded in 2008.
    The definition now includes computers used in or affecting interstate or foreign
    commerce or communication (Office of Legal Education Executive Office for United
    States Attorneys, 2015, p. 5). Despite various amendments of the CFAA, it has
    not fundamentally changed since 1986. It is still problematic legislation, vaguely
    formulated and unclear about the actual areas covered within the law (Rosenblatt,
    2020b).


    Table 7.5 The US definition of unauthorised access


    | Legislation | Definitions |

    | :--- | :--- |

    | **The CFAA** | 18 U.S.C. 1030, outlaws conduct that victimises computer systems<br>Subsection
    1030(a) includes:<br>Knowingly accessed a computer without authorisation or exceeding
    authorised access, and using such conduct having obtained information requires
    protection against unauthorised disclosure<br>Subsection 1030(b) included attempt
    or conspire to commit any of these offences outlined in subsection (a). |'
  merge: -1
  img_proc: true
- pgno: 221
