  md: 'progress later (The Council of Economic Advisers, 2018). A part of the politically
    motivated actors'' actions is conducted to cause embarrassment and reputational
    damage. The reason behind the attack is usually communicated to the public (Bradford,
    2014).


    # Prosecution


    The CoE Convention on Cybercrime requires that national cybercrime legislation''s
    implementation and applications are compatible with international human rights
    agreements. The Convention refers directly to Article 15 of the CoE''s protection
    of Human Rights and Fundamental Freedoms and the 1966 UN ICCPR (Hampson, 2012,
    p. 524), which clearly states that the rights should be considered with the legislative
    framework. UN Resolutions from 2016 and 2018 are also supporting that the rights
    that people are enjoying offline should be applied to the online environment.
    See Table 7.11.


    Because cybercrime is criminalised, most hacktivists'' means and methods fall
    within the provisions of national cybercrime legislation. The consequence of the
    current legal framework is that hacktivists are likely to be punished for something
    that does not warrant a prosecution offline. The motivation of hacktivists is
    political or social, which traditionally is not severely punished by law (Knapp,
    2015, p. 259). Yet, in some legislation, such as the CFAA, hacktivists have faced
    severe prison sentences if found guilty. With various types of politically motivated
    attacks escalating, hacktivism should be considered in the context of these rather
    than cybercrime. However, it is clear that when hacking is used, the actual ''illegal
    intrusion'' legislation is enacted, and hacking, defacing, and DDoS attacks have
    taken over from the more innocent short-term virtual sit-ins or blockage of certain
    websites for a limited number of times. The lines become blurred between the two
    groups, hackers and hacktivists. Hackers are predominately perceived as engaging
    in


