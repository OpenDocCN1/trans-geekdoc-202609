    | Germany | The German Criminal Code Section 303b links the DoS/DDoS attacks to
    computer sabotage | Covers everyone who interferes with data processing operations
    of substantial importance to another by deleting, suppressing, rendering unusable
    or altering data, or entering or transmitting data to cause damage to another
    |


    Sources: Congressional Research Service (2020); Crown Prosecution Service (2021);
    Lecomte (2020); Niethammer et al. (2020); Office of Legal Education Executive
    Office for United States Attorneys (2015, p. 2); Sauter (2014, p. 14).


    # DDOS


    DDoS attacks are the most prominent and disruptive means in the online hacktivists
    toolbox. There is also a distinction between how the activities are perceived.
    For example, sit-ins are considered a natural tactical tool for activists by blocking
    access to a location. Whereas DDoS attacks that disrupt and block online access
    for a short period is perceived as criminal tactics (Sauter, 2014, p. 7). Both
    DoS and DDoS attacks are launched to render a service inaccessible. Therefore,
    it can be the ultimate tool for hackers, hacktivists, organised crimes groups,
    etc., where the method is used to overload a network or an application layer (NCSC,
    2016). The Convention had not directly implemented DoS and DDoS attacks, but several
    articles in the Convention can be used depending on the attack form, i.e. Article
    2, illegal access; Article 4, data interference; Article 5, system interference;
    or Article 11, attempt, aiding, and abetting (CoE, 2013). States have adopted
    provisions to manage this area. See Table 7.6.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '# Table 7.7 Progression


    | Regional institution | Progress |

    | :--- | :--- |

    | The OAU | Substantive reforms and progress had been made |

    | The Commonwealth countries | Using a model law to create a legal framework for
    criminalisation |

    | The OAS | Recommend the member states implement the principle included in the
    Convention on Cybercrime and acceding to the convention |

    | The EU | Developed a substantive framework to manage this area and harmonise
    cybercrime legislation |

    | The Asian-Pacific Economic Cooperation | Collectively committed states to enact
    a comprehensive set of laws following international legal instruments, including
    UN’s General Assembly Resolution 55/63 (2000) and CoE’s Convention on Cybercrime
    |


    Sources: CoE (2001a, 2020a, 2020b, p. 5); EU (2005); Scholberg & Hubbard (2005,
    pp. 7–8); The Commonwealth (2017, p. 1); UN (2001).


    # LEGISLATIVE DEVELOPMENTS


    A survey conducted by the CoE in 2020 on the current state of cybercrime legislation
    globally has sowed. In total, 177 states worldwide were progressing or had already
    reformed existing legislation. However, 153 of these states have used both the
    Convention on Cybercrime and the UN guidelines for legislative reforms as a foundation.
    Other organisations have proposed similar frameworks to the CoE Convention to
    align regional frameworks with the Convention (CoE, 2020a, p. 5, 2020b).


    There is a common consensus for criminalising illegal intrusion/unauthorised access
    into computer systems and networks that align with the Convention on Cybercrime
    and various UN’s initiatives. There is limited scope for typology hacking, which
    is the most used phrase to explain these areas. See Table 7.7. This outline of
    initiatives and directions illustrates that contrary to cyberwarfare and cyberterrorism,
    a considerable quantity of legislation developed covering hacktivist’s attacks.


    # Motivation


    Many hacktivist and politically motivated hacking activities are perceived as
    an online form of civil disobedience. Often the aim is to use the online environments
    as a technique for resistance and protest to generate social or political change
    by peacefully breaking unjust laws (Lavorgna, 2020, p. 60). New forms of activism/hacktivism
    emerged in 2020 and 2021, setting a direction for future protest forms. Some of
    the means and methods are illegal, such as hacking, exploitation, and DDoS attacks.
    Other new innovative attacks operate with the legal framework, allowing attacks
    to develop similar DDoS attacks. This makes the area of online activism/hacktivism
    very interesting.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Year 2020 will be remembered for its use of online protest to call for social
    change while the world was in lockdown due to the COVID-19 pandemic. The pandemic
    was a game changer of how people interacted and how the online environment was
    used for political actions (Rosenblatt, 2020a).


    The online environment enables political groups and individuals to reach out to
    geographically distant people with common goals to unite and support a shared
    goal (Frankenfield, 2019). The objective of hacktivist groups can be similar to
    traditional protest groups. However, the hacktivists’ justification and activities
    challenge traditional protest forms by extending the scope, ideological foundation,
    and the means and methods used (Sorell, 2015). Hacktivism is being used alone
    or in conjunction with more traditional activism forms, such as the actions related
    to the Occupy Wall Street and the Church of Scientology protests (Frankenfield,
    2019; Sorell, 2015).


    Hacktivist draws an analogy between hacking, civil rights activities, movements,
    and civil disobedience. Some supporters claim that the hacktivism protest forms
    should be recognised in the same way as offline protests. For example, in 2013,
    Anonymous presented a ‘We the People’ petition to the US government to get DDoS
    attacks recognised as a legitimate form of protest similar to the peaceful occupation
    of the land by linking their activities to the Occupy encampment. This petition
    was rejected, but it opened the debate whether hacktivist groups’ activities should
    be purely considered in the realm of offline protests and not as a criminal enterprise
    (Gillespie, 2019, p. 92; Kerr, 2013; Li, 2013, p. 304).


    # Online Protest Movements


    From an early stage in the Internet’s development, politically motivated hackers
    have been drawn to the online environment to launch a protest. Groups and individuals
    have adopted this platform for various types of activities. These activities are
    linked to civil disobedience using the online sphere to protest. Although not
    all online protest groups are organised similarly, some are comparable to the
    offline groups using the same tactic imposed, i.e. traditional political parties
    and protest movements. Other groups are operationally different from these by
    not adhering to the same hierarchical structure but are founded ad hoc and anarchic.
    These online protest groups are more loosely founded. They are activated by postings
    on social media online or message boards, similar to large-scale rave parties
    or impromptu charity events (Sorell, 2015). Advocacy groups embrace the online
    environment to coordinate their activities among the member groups and associated
    groups concerning a particular activity. It also allows participants to link with
    groups online and get information about protests and meetings (Denning, 2010;
    Yar & Steinmetz, 2019, p. 85).


    The way online protests have been linked to the offline environment has changed
    the management of these activities. The ‘Carnival against Capitalism’ protest
    in London in 1999 arranged was particularly violent. It was considered that the
    trigger was the online exposure that had brought in a large crowd of people. The
    1999 N30 London protest followed this event'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'using the virtual space actively in the protest. The ability to anonymously
    participate and post information online has propelled beyond the reach of conventional
    media by breeding transnational protest allowing Internet-enabled protesters to
    gather simultaneously in a global context (BBC News, 1999b). Most protest movements
    are still engaging in traditional battles regarding power, participation, and
    democracy. However, they are empowering by new downloadable weapons and protest
    forms to provide a voice to a global audience (Grammatikopoulou, 2013; Karatzogianni,
    2012). A key example of using the digital environment in relation to a political
    protest is the Arab Spring uprising in 2011. The Arab Spring was the first large-scale
    revolutionary movement in the digital age, where information was used as the principal
    weapon based on who had it, who controlled it, and who knew how to use it (Cyber
    Security, 2021). New actors unaffiliated with formal movements collaborated with
    traditional grassroots movements. Social networks have been instrumental in mobilising
    people and enabling individuals and groups to collaborate innovatively and effectively
    (Bernburg, 2016, p. 20).


    # NEW DIRECTIONS FOR ONLINE PROTESTS: THE GEN Z AND K-POP STANS


    Despite the controversy about the TikTok app, a community formed within the platform
    has emerged from the PG lip-syncs and viral dance videos to becoming increasingly
    political. The most exciting development within political online activism and
    grouping are the Generation Z (Gen Z) and K-pop stans, who began to engage with
    political protests developing a new breed of ‘pop activism’. The Gen Z/K-pop stans
    are rethinking the millennial generation’s social justice warriors by including
    the use of dark memes, hashtags, and K-pop fancams (Koo, 2020). The emergence
    of these TikTok Gen Z/K-pop stans challenges the current understanding of online
    political activism. The app provides a platform for collectivism, agency, and
    action that fits into the goal of the generation by making ‘the personal’ political.
    The generation is hopeful, dynamic, and prepared to exploit various forms of technology
    to their advantage (Bedingfield, 2020; Hoise, 2020). The TikTokers engage in political
    expression and dialogue/conflict filtered through their identities and experiences
    and expressed in their actions (Herrmann, 2020; Ohlheiser, 2020b). This generation
    has often been discounted and underestimated. However, Gen Z/K-pop stans have
    unexpectedly found their voice and engage in discussions and actions about social
    and political issues, such as climate change, gun violence, BLM, LGBTQ+, and the
    COVID-19 pandemic (Hoise, 2020).


    # Hacktivism


    Hacktivism is the combination of hack and activism, and this area covered the
    actor a hacking or illegal intrusion/unauthorised access to computer systems for
    politically or socially motivated purposes (Check Point, 2021; Goode,'
  merge: -1
  img_proc: true
- pgno: 225
  md: '2015, p. 75; Hampson, 2012, p. 515). A number of groups are interlinked with
    political activists, anarchists, or movements that have observed the benefit of
    having an online presence or support. However, hacktivist groups with more fluid
    ideologies engage with a broad number of activities carried out alone or with
    other like-minded hackers (Frankenfield, 2019). Although hacktivists and hackers
    operated in similar ways, the motivation is different. Where the hackers are acting
    in self-interest, the hacktivist is engaged to archive political or social changes.
    Hacktivist activities often cover website defacements, information theft, website
    parodies, DoS attacks, virtual sit-ins, and virtual sabotage (Hampson, 2012, p.
    515; Jordan & Taylor, 2004, p. 69).


    The motivation for being involved in these online activities can include revenge,
    political and social incentives, ideology, protest, embarrass organisations or
    individuals within these organisations – or sometimes the activities mirror vandalism.
    Yet, the hacktivists groups aim to challenge governments, organisations, and companies
    that go against the hacktivist groups’ moral position (Ablon, 2018, p. 3; Check
    Point, 2021; Holt et al., 2018, p. 387). Hacktivism’s core areas are supporting
    democracy, protecting free speech online, and promoting access to information.
    For example, a part of the politically motivated activities is assisting computer
    users in enhancing online privacy and avoiding surveillance, disputing cooperative
    or government powers to protest globalisation and capitalism (Frankenfield, 2019).
    Circumventing governance censorship is another core area of hacktivism. The hacktivists
    are not only engaged in targeting the censoring governments. They also enable
    online users to circumvent national firewalls and security restrictions, impacting
    access to material online and communicating (Frankenfield, 2019).


    Over the years, hacktivism has developed as a valuable form of political protest
    from the early movement of ethical hacking by including the political activist
    dimension in the 1990s and early 2000s movements. The early hacktivists developed
    from various phone pranks and computer programmers’ curious exploration of computer
    systems and networks – even before developing the Internet. This movement and
    the groups’ activities formed a subculture of online users with the skills and
    understanding of the online environment, enabling them to explore the limits of
    the new space and the new expressive and disruptive tools that are replacing physical
    protests (Hampson, 2012, p. 515; Jordan & Taylor, 2004; Karagiannopoulos, 2020,
    p. 64). The activities expanded to include the protection of the online technology-based
    subcultures and object to the restrictions of downloading music, information,
    movies, etc. by exploiting the gaps in anti-hacking protection imposed by businesses
    and public institutions (Jordan & Taylor, 2004, Chapters 1–3; Sorell, 2015). Hacktivist
    groups in every region have their unique motives to justify their online activities.
    Groups have emerged from regional conflicts, state-directed initiatives, general
    governmental disillusionment, or events against a group’s worldview (Inskit Group,
    2019).


    The groups often contradict themselves and their values. Activities are launched
    to prevent access to particular websites or services. Thereby, they'
  merge: -1
  img_proc: true
- pgno: 226
  md: 'cut off online users from certain services or networks. This contradicts the
    idea of free speech and the free circulation of information. Attacking to promote
    own rights and limits others does not comply with freedom of thought and expression.
    The groups are launching DDoS attacks against webpages and applications, defacing
    opponents and doxxing those they disagreement do not foster an open and accessible
    environment (Ablon, 2018, p. 3; Frankenfeld, 2019). The groups are also launching
    attacks for less sympathetic purposes that decrease public support. For example,
    groups have engaged in harassment and extortion – or stealing and disseminating
    sensitive, proprietary, or classified material, which impacts the people named
    in the material (Ablon, 2018, p. 3).


    # THE EMERGENCE OF NEW HACKTIVIST GROUPS


    Some of the former members of Anonymous are also returning the activism, for example,
    in support of the BLM movement in 2020 (Clayton Rice Q.C., 2021; Menn, 2021).
    However, a new type of activism and groupings are emerging. These groups are mainly
    protesting against the operation of cybersecurity actors and the tech companies’
    distribution of propaganda. One prominent group that has caught attention is APT-69420
    Arson Cats (Associated Press, 2021; Panda Security, 2021). The group aims to express
    its displeasure with the way video surveillance is increasing and how online surveillance
    is playing with the lives of ordinary citizens. Moreover, the groups are also
    concerned about a large number of end-point video vulnerabilities. The hackers
    have accessed and published live video feeds from companies, such as Tesla and
    Cloudflare, and videos and footage from other Verkada clients, including offices,
    warehouses, factories, prisons, psychiatric wards, banks, and schools (Clayton
    Rice Q.C., 2021; Laskey, 2021; Menn, 2021). Groups have launched attacks supporting
    anti-racist and anti-fascist politics by targeting Parler’s archive and hacking
    Gap, the social networks used by white nationalists and right-wing extremists.
    New groups of hackers have also focused on Qanon and online hate groups. These
    hacktivists’ preferred actions are to upload material on an online transparency
    site, Distributed Denial of Secrets (DDoSecrets), similar to WikiLeaks (Reuters,
    2021).


    # Actors


    The spectrum of ‘other’ politically motivated cyber attacks and groups covers
    every action conducted by entirely non-state political actors. The new memes are
    interesting as they reinvent hacktivism by merging legal and illegal actions in
    their target selection and execution. The groups’ online presence can be linked
    to the two previous waves of hacktivism, so it is essential to understand it as
    a concept. The two new directions are very distinct. One group operated in the
    realm of traditional online activism, i.e. Gen Z/K-pop stans. The other direction
    is linked to traditional hacktivism with a new twist, i.e. APT-69420 Arson Cats.'
  merge: -1
  img_proc: true
- pgno: 227
  md: '# First Activism Wave


    Globally, Hacktivism is the most well-known form of online protests and activism.
    Various groups have developed from the 1990s, including Cult of the Dead Cow (CDC),
    Hacktivismo, Lulz Security (LulzSec), Anonymous, Legions of the Underground, The
    Electronic Disturbance Theater (EDT), Young Intelligent Hackers Against Terrorism,
    Syrian Electronic Army, and


    # Table 7.8 The first activism wave


    | Name | Activities | Characteristics |

    | :--- | :--- | :--- |

    | The CDC founded in 1983 | Developed tools for testing password security.<br>Developed
    technique for controlling computers from a distance | The CDC is one of the most
    respected and famous American hacking groups<br>Invented the term ‘Hacktivism’
    (Hacktivismo) and dubbed the actors ‘hacktivists’ in 1994. |

    | The Critical Art Ensemble (CAE) founded in 1987 | Engaging in media interventions
    by developing micropolitical means to disrupt, intervene, educate | Tactics lead
    to more groups to develop online blockages and trespass |

    | The Strano Network founded in 1995 | Launched a one-hour strike against websites
    operated by governmental agencies.<br>Considered as being an early example of
    a DDoS attack | Conducted the first electronic civil disobedience by arranging
    a protest against the French government police on nuclear and social issues |

    | The EDT founded in 1997 | Developed the Floodgate tool for an online virtual
    sit-in | Collaborated closely with Mexico’s Zapatista revolutionary movement.<br>The
    tool was instrumental for the group’s online success attacking the Mexican President
    Zedillo, the Frankfurt Stock Exchange, and a site of the US Department of Defense,
    defenselink.mil |

    | The Electrohippies Collective founded in 1999 | Combined online and offline
    protests. Ran an online protest which included a familiar aspect of hacktivism:
    DoS | Known for their virtual sit-in campaign during the 1999 Seattle meeting
    by World Trade Organisation (WTO) and blocking computer network at the event |'
  merge: -1
  img_proc: true
- pgno: 228
  md: 'AnonGhost (Frankenfield, 2019). One of the first groups to get wide recognition
    is CDC. Two years after this group was founded, the US Congress adopted the CFAA
    legislation criminalising intentional access without authorisation (Insikt Group,
    2019). The first groups were primarily involved in creating open-source programmes
    to prevent attempts from public and private entities to control the online experience
    (Kahn & Kellner, 2004, p. 90). Yet, the groups were also involved in developing
    tools for virtual sit-ins. The groups were smaller and more engaged in organising
    public-participation events following the principle of open and no-harmful protests.
    These events supplemented civil disobedience in the offline world (Karagiannopoulos,
    2020, p. 70; Menn, 2019; Murphy, 2019). See Table 7.8.


    The most recognised successors to the first, rather primitive, hacktivist groups
    are Anonymous. This group, together with LulzSec and WikiLeaks, characterised
    the second wave. Each of these groups has a different incitement for being involved
    in the hacktivist movement. Group Anonymous is predominately known for its focus
    on particular areas and its political stance. Whereas LulzSec is more known for
    its humour and cheeky campaigns where some were political. Finally, WikiLeaks
    is known for uploading material online originating from whistle-blowers and online
    hacks. See Table 7.9.


    # Second Activism Wave


    # ANONYMOUS


    Group Anonymous'' activities have developed from engaging in small, clustered
    activities to become a global activists group facilitating disruptions by subgroups
    and affiliates, making the activities less structured and recognisable. The uniqueness
    of these hacktivist groups is that it has no formal membership, controlling body
    or internal structure. Everyone can participate in actions at will. The group
    is one of the first hacktivist groups to have a completely decentralised foundation
    allowing individuals to create regional subgroups as a part of the Anonymous framework
    (Anonymous International; Anonymous Italia, etc.) (Affi-Sabet, 2020; Holt et al.,
    2018, pp. 13–15; Insikt Group, 2019; Karagiannopoulos, 2020, p. 76; Mueller, 2017,
    p. 143; Wood, 2020). Being a pioneering social movement linked together with a
    desire for activism and online activities, they created an alternative form of
    an organisation aiming to be transnational, stable, open, transparent, accountable,
    and inclusive where anyone can claim membership. The determining factor is “if
    you believe in Anonymous, and call yourself Anonymous, then you are Anonymous”
    (Insikt Group, 2019; Mueller, 2017, p. 143).


    Group Anonymous is founded upon the spirit of humorous deviance, including anti-celebrity
    ethics. Before the group moved onto political hacktivism in 2008, it was widely
    known for its ‘trolling campaigns’. Members of the group used online means and
    methods to abuse, harass, or bring'
  merge: -1
  img_proc: true
- pgno: 229
  md: 'into disrepute individuals or institutions. These campaigns were pursued for
    a laugh (‘the lulz’) (Coleman, 2015, pp. 17, 31; Richards & Wood, 2018, p. 189).
    Compared with the first hacktivist groups, group Anonymous successfully rebranded
    hacktivism through their rhetoric and the way they have embraced technological
    development. The years with the Anonymous domination have led to large-scale recruitment
    based on highly mediated and media-friendly events with noticeable actions; easy
    to cover as news events (Karagiannopoulos, 2020, p. 77; Wood, 2020).


    The group is very recognisable, and most people will have heard about the group’s
    activities. The group has been praised for its engagement in cyber-vigilante campaigns
    beyond the hacking communities, including its actions against sex offenders, animal
    abusers, corrupt politicians, and terrorist organisations (Richards & Wood, 2018,
    p. 192). A cascade of increasingly political operations has been attributed to
    the group after its first long-term campaigns, Project Chanology, Operation Payback,
    etc. (Afifi-Sabet, 2020; Lavorgna, 2020, p. 60). For example, the group has been
    involved in actions in support of the Occupy Wall Street movement, the Arab Spring
    protests; campaigns against the CIA and Interpol; against Muslim discrimination
    in Myanmar; support of the democratic activists in Hong Kong; and attacks against
    purported members of the Ku Klux Klan (Brooking, 2015; Karagiannopoulos, 2020,
    p. 74). However, in the fight against ISIS, the members of Anonymous found themselves
    in an internal turmoil linked to sharing information with the establishment they
    were supposed to fight. Additionally, the group has always fought all restrictions
    on Internet use. But in the fight against ISIS, they actively limited access for
    some online users, i.e. ISIS militants. In online and offline debates, it became
    clear that self-identifying Anonymous members struggled to reconcile their past
    goals with the present activities (Brooking, 2015). The Internet conflicts, the
    diversified actions, and the lack of community feeling decreased the group’s support.
    During the same period, businesses, organisations, and governmental institutions
    increased their cybersecurity, making it more difficult for lower-level actors
    to beach the networks (Williams, 2019).


    # LULZSEC


    The group LulzSec was also operational when Anonymous’ activities developed. The
    group name combines lulz (for a laugh) and sec (security), which is the group’s
    primary motivation, and the link to humour is evident in its motto: “Laughing
    at your security since 2011!” providing “high-quality entertainment at your expense”
    (Arthur, 2013; Branch, 2011; Gallagher, 2011). LulzSec’s cheerful public image
    undoubtedly helped the group gaining popularity within a short time. The group
    is similar to other hacking groups that spill over the political environment from
    time to time without having a clear political profile similar to Anonymous (Arthur,
    2011, 2013; Batty, 2011;'
  merge: -1
  img_proc: true
- pgno: 230
  md: 'Martin, 2011). Although most members of LulzSec came from the same core hacker
    group as Anonymous, the two groups have had their conflicts. In particular, the
    groups clashed after LulzSec attacked several video games initiated by a ‘DDoS
    Party’ that brought down several gaming servers and websites, such as EVE Online,
    League of Legends and Minecraft (Lynley, 2011a). The conflict between the two
    groups was further fuelled by LulzSec publicly mocked 4chan users, the image-sharing
    message board where Anonymous derived from (Lynley, 2011a, 2011b).


    Despite this conflict, the two groups collaborated in an operation against government
    agencies in actions dubbed Operation Anti-Security, which encouraged hackers worldwide
    to attack governmental websites and deface them. Despite LulzSec’s claims that
    the hacks on websites like the CIA were for fun (Lynley, 2011b). The two groups
    also collaborated in an attack on Arizona Police Department and other organisations
    in the Arizona state government as a reaction to what the groups called an unjust
    war on drug actions (Gallagher, 2011; Insikt Group, 2019). The LulzSec group allegedly
    disbanded after some of its members were arrested. However, due to the way the
    group was organised and the transient nature of their membership, it is unlikely
    that all of the members were arrested. However, nothing has been attributed to
    the group since (Davis, 2014).


    # WIKILEAKS


    At the border of hacktivism, it is possible to include WikiLeaks. WikiLeaks claims
    to be an independent and non-profit online media organisation that does not obtain
    the documents themselves. However, the website has been instrumental for the hacktivist
    groups to upload information vital to their political campaigns (Bacon, 2018).
    Some of the leaks published come from insiders, who reveal sensitive information
    that might have public interests. This information is secrets or bad practices
    that the organisations want to keep out of the public sphere, such as documents
    showing malpractices/discrepancies in organisations’ official aspirations and
    actual practice. In that sense, the leaks appear to be a service to the public
    by showing the wrong-doing and the consequences of these actual practices(Sorell,
    2015; WikiLeaks, 2011). Other types of material published on WikiLeaks are stolen
    online by hacktivist groups. For example, group Anonymous forwarded in 2012 internal
    emails from an American Security company Stratfor (Sorell, 2015). The leaks disclosed
    how the military-industrial complex conspired to spy on citizens, activists, and
    trouble-causers (Chatterjee, 2012). Some frictions appeared in WikiLeaks and Anonymous’
    relationship in 2012, and some of the hacktivists distanced themselves from the
    site claiming that the site has become a personal tribulation for Assange (Halliday,
    2012).'
  merge: -1
  img_proc: true
