- pgno: 135
  md: '# North Korea


    Where China is pursuing a strategy to enhance the powers of the state, the Democratic
    People’s Republic of Korea’s (North Korea) national cyber objectives are different.
    The state aims to ensure the regime’s survival, displaying powers and its position
    in the international environments and maintaining its domestic control. North
    Korea has been accused of being behind numerous cyber attacks, causing disruption
    and financial damage on an unprecedented level.


    The impact of WannaCry demonstrates that the state is no longer a secondary cyberpower,
    and it is using the cybersdomain to display its capabilities and capacities (BBC
    News, 2017n). For over a decade, the regime has been widely involved in espionage
    campaigns against the South-Korean defence industrial base (Parsons & Bureau,
    2020; Bartlett, 2020). The state-sponsored Lazarus group is instrumental for the
    online activities operating with different subunits. The proxies create a buffer
    between the state and the activities. However, all use of the Internet and cyber
    education of citizens are highly controlled by the state. Therefore, it is likely
    that Lazarus and other APT groups act under the state’s authority (Bartlett, 2020).


    The engagement in cyberwarfare has been pursued despite the state’s diplomatic
    and economic situation. The North Korean leader, Kim Jong-un, believes that cyberwarfare
    is an all-purpose tool that guarantees North Korea striking capabilities and nuclear
    weapons. The all-purpose weapon has been adapted and deployed against North Korea’s
    adversaries by launching ransomware attacks, destroying computer systems, and
    espionage (Ji Young et al., 2019, p. 1; Casear, 2021). The strategies of cyberwarfare
    are not surprising due to the payoff for the state. Developing cyber capabilities
    and capacities can be done to low cost and high effect. North Korea has risen
    significantly in the online war game despite limited powers and a relatively isolated
    position. The state has developed its asymmetric military powers by enlisting
    elite soldiers with considerable computer skills. At the same time, as developing
    an internal structure with a large group of cybersoldiers, the state minimises
    Internet dependencies internally within its territory. North Korea claims to have
    6,000 cyberspecialist engaged in cyber attacks, and 19–20 percentages of the military
    budget are used on these activities (Ji Young et al., 2019, p. 3; Park et al.,
    2016, p. 88).


    North Korea has developed an internal intranet for its citizens, the Ministry
    of People’s Security, the Ministry of State Security (MSS), and the military.
    The unclassified intranet, Kwangmyong, has around 50,000 users connected to 3,700
    organisations using this separate online communication platform. Having such tight
    control over the online environment makes the state less vulnerable to attacks
    from other states (Park et al., 2016, pp. 87–88). North Korea is profoundly controlling
    the access and the use of the Internet. Like China, The North Korean leader believes
    that open access to information would harm the regime (Ji Young et al., 2019,
    p. 3). Therefore, there are only a limited number of citizens who can access the
    Internet beyond the elite hacking units.'
