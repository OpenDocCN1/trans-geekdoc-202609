- pgno: 214
  md: '# # 7 Other Politically Motivated Attacks

    Political Activists and Hacktivists


    # Introduction


    Cyberwarfare and cyberterrorism are not the only politically motivated area that
    is rising. Non-state actors are operating independently outside the state apparatus
    and launching attacks against public and private entities. Hacktivism is the online
    version of protest or civil disobedience. The attack forms take two directions.
    One direction is purely online, where an attack is impacting groups, entities,
    or online users. The second direction can be online and offline, where a large
    group of online users conduct a joint action against a particular target (online
    or offline). In both areas, cyberspace and the Internet actors act as facilitators
    for progressing a political agenda. Additionally, these actors are more likely
    to be prosecuted than their state-sponsored or state-supported counterparts. The
    predominately focus in this chapter is on hacktivism and new forms for online
    political protest emerging in 2020 and 2021.


    # Conceptualising ‘Other’ Politically Motivated Attacks


    ‘Other’ politically motivated actors are operating outside the realm of the state,
    state-sponsored, and state-supported groups. These actors are non-state groups
    and individuals who are using the online environment for political activism and
    protest. The actions do not generate a high level of fear and uncertainties among
    the public. However, the attacks can have disruptive and damaging impacts on targets
    and customers. Some of the politically motivated groups rely on the online environment
    to facilitate or enhance the scope of the protest. Other politically motivated
    groups aggressively use online computer technologies, devices, and networks as
    vectors to exploit, disrupt, or damage the target. These groups’ activities are
    directly criminalised in national cybercrime legislations imposed to manage illegal
    intrusions online. Attacks carried out by non-state actors often have a lower
    level of sophistication than state and state-sponsored/supported as the non-state
    actors have fewer resources at their disposal. However, the attacks are often
    innovative and effective, using humour and surprise to gain attention. Due to
    the nature of the attacks and how they are conducted, the groups are often organised
    in'
  merge: -1
  img_proc: true
- pgno: 215
  md: 'a decentralised way, where actors are working together ad hoc depending on
    the cause and the actors’ particular political interests (Cruz & Plaisance, 2021,
    pp. 1330–1331; Holt et al., 2018, p. 392; Insikt Group, 2019).


    Cyberactivism is interlinked with two different areas. First, online political
    activism refers to political mobilisation, which involves using computer technologies,
    cyberspace, and networks to enhance or create politically motivated movements.
    The Internet and social media enable actors to identify or manage alternative
    channels to distribute information and create awareness about particular cases.
    The online environment creates endless opportunities for engaging and supporting
    political causes and ideologies online and offline. Some of these activists groups
    cultivate loyal and persistent following the group, engaging in the activities,
    and help to promote the cause online (Cruz & Plaisance, 2021, p. 1330; Sorell,
    2015, p. 393).


    Secondly and the most well-known form of online protest is hacktivism. Hacktivism
    is based on political activism, where hacking skills are employed against powerful
    commercial institutions or governments; or any entity the group decide is either
    bad or wrong (Check Point, 2021; Sorell, 2015). Hacktivists are stateless, elusive,
    often lawless, and always anonymous in their actions and organisation. The way
    they are organised and embrace the online environment has proved beneficial as
    the actors can quickly join the network to complete the attack to disband upon
    completion (Cruz & Plaisance, 2021, p. 1330; Sorell, 2015, p. 392). Despite general
    support by the public, they are still considered to fall outside the realm of
    acceptable political protests. However, compared with the offline tactics of politically
    motivated groups, using means and methods such as occupations, blockades, defacements,
    culture jamming, strikes, and sabotage, there is not much difference between some
    online and offline protest forms (Baraniuk, 2014; Sauter, 2014, p. 26).


    # The Legislative Foundation


    # THE RIGHT TO PROTEST


    The right to protest is deeply rooted in the Human Rights Conventions and national
    constitutions. The freedom of protest is one characteristic of a free and democratic
    society where the society is prepared to follow some wishes of the population
    to satisfy the majority. Therefore, democratic governments will tolerate and encourage
    various political activities, where the public can oppose and form a healthy opposition
    (Fenwick, 2006, p. 419). Freedom of opinion and expression are fundamentally civil
    and political rights considered necessary for an individual’s development in any
    given society. It is impossible to enjoy other rights linked to protest without
    free speech, i.e. freedom of assembly and association (Howie, 2018, pp. 12–13;
    HRC, 2011, p. 1).


    The UN’s Universal Declaration from 1948 set out necessary rights for political
    activism. See Table 7.1.'
  merge: -1
  img_proc: true
- pgno: 216
  md: '# Table 7.1 The UN protection of the right to protest


    | The UN''s Universal Declaration from 1948 | Rights |

    | :--- | :--- |

    | Article 18 | The right to freedom of thoughts |

    | Article 19 | The right to freedom of opinion and expression |

    | Article 20 | The right to freedom of peaceful assembly and association |


    Source: UN (1948).


    The International Covenant on Civil and Political Rights (ICCPR), implementing
    the personal and political rights set out in the UN Universal Declaration, states
    that the freedom of thought is protected and “No one shall be subject to coercion
    which would impair his freedom to have or to adopt a religion or belief of his
    choice” (The UN, 1966) The freedom of expression (Art 19) covers


    > [F]reedom to seek, receive and impart information and ideas of all kinds, regardless
    of frontiers, either orally, in writing or in print, in the form of art, or through
    any other media of a person''s choice.

    > (Howie, 2018; The UN, 1966)


    At the same time, the freedom of assembly is recognised in Article 21 and the
    freedom of association in Article 22. It is a fundamental human right for all
    individuals to join a peaceful assembly to express themselves, celebrate, or express
    grievances. Together, these rights constitute the foundation of democratic societies,
    where changes can be made through discussion and persuasion rather than by using
    force (Steiner et al., 2007, p. 489; Swaine, 2018, p. 406; UN, 2020).


    These rights are protected in various domestic legislation, international treaties,
    and regional human rights instruments. Table 7.2 outlines the key regional provisions,
    which forms the basis of national human right''s legislations.


    Although the central rights of freedom of expression, freedom of assembly, and
    participation in the democratic system are not respected in all jurisdictions,
    the rights remain relevant to protests merging online and offline spaces, such
    as street protests together with online communication. In most politically motivated
    activities, new technologies act as a medium for organising offline protests.
    Although the online element is prevalent, offline protests are still happening
    with the broader population''s understanding and support. The online environment
    can indeed be an amplifier for the cause and the activities, but it does not necessarily
    exclude or overtake participation (Article 19, 2016; Sorell, 2015).'
  merge: -1
  img_proc: true
- pgno: 217
  md: '# Table 7.2 International definitions


    | Organisation | Convention | Provisions |

    | :--- | :--- | :--- |

    | The CoE | The European Convention on Human Rights 1953 | Article 10, freedom
    of expression; Article 11, freedom of assembly and association |

    | The OAS | The American Convention on Human Rights 1978 | Article 13, freedom
    of thought and expression; Article 15, right of assembly; Article 16, freedom
    of association |

    | The OAU | The African Charter on Human and People''s Rights 1981 | Article 9,
    the right to receive information and free expression; Article 10, the right to
    freedom of association; Article 11, the freedom of assembly |


    Sources: CoE (1950); Organisation of African Unity [OAU] (1981); Organisation
    of American States [OAS] (1969).


    The UN Human Rights Council (HRC) adopted in 2018 an essential resolution, HRC
    REC 38/11, on human rights and protests stating that human rights must be protected
    online to enable online protest, similar to the protests protected in the UN’s
    Human Rights Article 19 (Article 19, 2018; UN, 2018a). The new element is that
    online users also have the right to assembly solely through online conduct (Article
    19, 2018). Significantly, the addition to the right comes in the light of state
    powers trying to control online protests. There has been an increase in states
    shutting down the Internet, limiting access to online media accounts, and blocking
    websites as anticipatory measures or responses. The anticipatory tactic limits
    online and offline users’ rights to participate, receive, and distribute information
    about protests (APC, 2019, p. 2; Article 19, 2018). In 2018, the HRC had also
    adopted REC 38/7 on the promotion, protection, and enjoyment of human rights on
    the Internet (UN, 2018b).


    Despite the UN resolution, the use of the online environment for public protests
    is contested. The entire Internet is private. Online use is incorporated in everyday
    lives to assemble public life. However, no public areas are designed for online
    protests in virtual spaces, similar to the offline environment where states have
    a negative obligation to protect the right to protest. This means that the rights
    are not directly transferrable to the Internet. Public rights regulate the relationship
    between the state and the citizens. Often the states do not have any interest
    in challenging this private ownership of the Internet, leaving online users to
    be subjected to the private services’ terms and conditions, such as access to
    the platforms and association (Baraniuk, 2014; Cruz & Plaisance, 2021, p. 1330;
    Fenwick, 2006, p. 397). However, the state can regulate some areas within the
    online environment by criminalising certain behaviours and activities.'
  merge: -1
  img_proc: true
- pgno: 218
  md: '# Cybercrime Legislation


    Although the hacktivist groups are engaged in various types of actions, online
    and offline, criminal and non-criminal, they are primarily involved in clandestine
    activities to draw attention to a particular issue, gain attention, and promote
    their own type of ethics. These groups’ modus operandi is linked to illegally
    breaking into corporations and governmental targets to promote a political end
    – or prevent the operations of these entities by disturbing or damaging the online
    structures of services. However, the targets also include religious organisations,
    terrorists, drug dealers, and paedophiles depending on the groups’ cause and what
    they consider is right or wrong (Frankenfield, 2019; Sorell, 2015, p. 392). The
    hacktivist groups are far from being on the same level as state-sponsored/supported
    actors, but they have become proficient in their specialist areas. Although they
    operate on a lower scale, the groups have considerable capabilities and capacities
    for conducting attacks; the lack of sophistication is replaced with relentless
    and innovative actions.


    # CoE''s Convention on Cybercrime 2001


    To define this area of cybercrime, the CoE''s Convention on Cybercrime 2001 is
    instrumental. The Convention defines vital areas and improves the means to prevent
    and suppress computer-related crimes on the national and international levels.
    So far, there are 65 signatory states, whereas 3 states still miss ratifying the
    Convention (CoE 2021). The states having ratified the Convention have also introduced
    cybercrime legislation. The different legislative framework covers the hacktivist''s
    main techniques, such as hacking and DDoS attacks.


    # HACKING


    Significantly, the Convention criminalises hacking without explicitly defining
    it (CoE, 2001a, 2001b, p. 7). The hacking typology encompasses ‘illegal access’
    covering hacking, cracking, computer trespass of various types, and the definitions
    of the criminal offences are outlined in Articles 2–6 of the Convention. These
    are developed to protect the confidentiality, integrity, and availability of computer
    systems or data and separate the illegal activities from the legitimate and common
    use of computer systems and networks, processes, and practices (CoE, 2001b, pp.
    8–9). See Table 7.3.


    The Convention aims to harmonise domestic criminal law provisions developed by
    the signatory States, and it creates a practical cooperative system in an international
    context (CoE, 2001b, p. 3). An example is the UK Computer Misuse Act 1990, amended
    by the UK Serious Crime Act of 2015 to update the offences. See Table 7.4.'
