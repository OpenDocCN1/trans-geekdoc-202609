  md: '# PUBLIC-PRIVATE PARTNERSHIPS


    Cybersecurity calls for a multilayered approach where actors work together to
    enhance cyber resilience, both with deterrence and defence. Public–private partnerships
    are deeply integrated into protective frameworks drawing on a joint effort by
    key players from various sectors and industries. Previously, cooperation between
    public and private actors has been problematic as the actors have been reluctant
    to share information and develop best practices. There are many explanations for
    this reluctance, fear of compromising national security or reveal corporate secrets
    that can jeopardise the actors’ competitiveness (Carr, 2016, p. 46; EC, 2020,
    p. 5). Public and private actors need to interact, exchange knowledge, communicate,
    and pull resources to protect these vital areas. Cybersecurity requires constant
    collaboration and cooperation between key actors and entities to constant review
    and apply new security solutions and plans (Forcepoint, 2020; US DHS, 2020).


    Information sharing enables the victims and security actors to create coordinated
    and effective countermeasures to enhance resilience and prepare for future attacks
    against CIs. The exploitation of known vulnerabilities in software is the most
    likely source of attacks. The cybersecurity actors should ensure that the security
    systems are up to date, and known vulnerabilities are patched as soon as they
    are communicated. Often actors underestimate the importance of constantly updating
    the security level. If this is not done, there will be free entry into the system
    for zero-day exploits (NCSC, 2015, 2016). Another issue is the underinvestments
    in hardware and software and the use of outdated police and preparedness plans.
    Technological development progresses rapidly, which requires constant assessment
    of resilience and preparedness. Investments in cybersecurity are critical for
    all actors to ensure the integrity, confidentiality, and availability of data
    assets (Fedele & Roner, 2021). Outdated software might not resist a sophisticated
    attack as the product would no longer receive updates or security measures are
    not developed (NCSC, 2021).


    The success of CIP is linked to different partnerships developed between public
    and private actors and their abilities to manage and implement security initiatives.
    It is, therefore, essential to take a proactive stance and include risk assessments
    and risk classifications of the different procedures and practices. Often the
    online threats are linked to hacking, but other threats need to be considered,
    such as equipment failures, human errors, and natural causes.


    # The Structure of This Book


    # Part 1


    This book is organised into two parts. The first part of this book covers Chapters
    1–4. These chapters set out definitions and problem areas for understanding how
    the different politically motivated actors are organised. The focus is centred
    around the actors, their motivation, and the means and'
