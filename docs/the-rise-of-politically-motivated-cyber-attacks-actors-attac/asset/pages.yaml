  md: '800 cyber attacks in the past year targeting think tanks, NGOs, and other global
    political organisations, with the majority of attacks originating in Iran, North
    Korea, and Russia (CSIS, 2020).


    # Attack Types and Targets


    Following the SolarWind attack by the end of 2020, hackers affiliated with Russia
    gained access to computer systems belonging to multiple US government departments,
    including the US Treasury and Commerce, in a lengthy supply-chain attack campaign.
    The victims of this attack included customers of 425 of the US Fortune 500 group,
    10 top US accounting companies, the US military, the Pentagon, the State Department,
    and hundreds of universities and colleges globally (Constantin, 2021). Significant
    attacks in the first half of 2021 include powerful attacks against CI and ICTs.
    These attacks demonstrate the diversity in attack targets and attribution. See
    Table 3.4.


    Hackers with close links to the Chinese government are attributed for targeting
    Microsoft’s enterprise email software to steal data from over 30,000 global organisations.
    Among the targets in this attack are governmental agencies, policy think tanks,
    legislative bodies, law companies, defence contractors, defence contractors, and
    infectious disease researchers (BBC News, 2021b; KrebsOnSecurity, 2021). Two state-sponsored
    hacking groups targeted organisations across the US and Europe, and one of the
    groups has close ties to the Chinese governments. The two groups exploited vulnerabilities
    in a VPN service to attack defence contractors (Johnson, 2021). However, not all
    attacks have been attributed to any groups. The European Commission announced
    that they and other European Union (EU) organisations were attacked simultaneously
    (Paganini, 2021). The Belgian parliament suffered a significant DDoS attack, which
    disabled the ISP used by Belgium’s government. This attack impacted more than
    200 organisations and resulted in the cancellation of multiple parliamentary meetings
    (Montalbano, 2021). The Norwegian green energy technology company Volue was targeted
    by a ransomware attack, which resulted in the shutdown of water and water treatment
    facilities in 200 municipalities. This ransomware attack affected approximately
    85% of the Norwegian population (CSIS, 2020; Kovacs, 2021).


    In the year 2021 the Western states were targeted in a wave of ransomware attacks.
    Attacks have been launched against governmental entities and agencies, governmental
    contractors, CI, and services significantly impacted. Ransomware attacks are now
    considered a national security threat. The attack on the US-based Colonial Pipeline
    substantially impacted ordinary citizens on the East Coast (Affi-Sabet, 2021;
    Associated Press, 2021a; CSIS, 2020). This attack is attributed to the Russia
    state-supported RaaS group DarkSide. The Avaddon ransomware also targeted various
    sectors across states, such as Australia, Belgium, Brazil, Canada, China, France,
    Germany, India, the UK, the US, and others. The targeted industries include academia,
    airlines, constriction entities, energy equipment, financial services, transportation,'
