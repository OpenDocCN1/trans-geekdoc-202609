  img_proc: true
- pgno: 53
  md: '| Levels | Characteristics |

    | :--- | :--- |

    | The Surface Web | Part of the WWW that is readily available to the general public<br>Searchable
    with standard web search engines<br>Widely used in regular day-to-day activity
    for standard searches<br>Do not require particular configurations |

    | The Deep Web | Part of the WWW<br>Contents are not indexed on search engines<br>No
    links are visible on the Surface Web<br>Includes all of the Internet pages which
    cannot be searched<br>or opened by other users, i.e. webmail, online banking,
    and<br>services |

    | The Dark Web | Part of the WWW but as a restricted-access network.<br>Less accessible
    subset of the Deep Web<br>Relies on connections made between trusted peers<br>Requires
    specialised software, tools, or equipment to access<br>Only accessed through ‘overlay
    networks’; these run on top of<br>the regular Internet and hide access. |


    Sources: CIS (2021); Grustnyi (2021); Varma (2018).


    Yar & Steinmetz, 2019, p. 10). Multilayered encryption is enabled to ensure that
    all data traffic is relayed and encrypted three times through the process. The
    way the online traffic is routed allows the users to browse freely and accessing
    web pages that otherwise might be blocked on the Surface Web and the Deep Web
    (Andress & Winterfeld, 2014; Perera, 2015; TOR, 2020). The Dark Web offers a high
    level of anonymity, valid for the political actors’ communication, planning, and
    execution of their online attacks. Accessing the Dark Web requires special encryption
    software and browser protocols to authorise access to space. This access is produced
    by the software, part of TOR’s free service (Faizan & Khan, 2019; TOR, 2020; Wallance,
    2016, p. 9). The dangers developing in and deriving from the Dark Web are real.
    Europol (2019) highlighted the problems stating that this space remains a critical
    online enabler for criminal products and services.


    Encrypted communication applications allow the users to pursue illegitimate goals
    which are not possible on the Surface and Deep Web. Encrypted communication helps
    users access various services and create secret groups online. The anonymity and
    the interconnectivity are vital for politically motivated groups (Europol, 2019,
    p. 49, 2020, p. 43). Carding markets and forums on the Dark Web create relevant
    web communication platforms for these actors, i.e. terrorist organisations, politically
    motivated hackers, and hacktivists. The Dark Web enables these actors to manoeuvre
    in and out of these spaces undetected. The actors use the carding forums to enable
    individuals to share information regarding means and methods to engage online,'
  merge: -1
  img_proc: true
- pgno: 54
  md: 'carry out attacks, spread information – spy on victims and collaborate, as
    seen with the emerging ransomware groups. These forums and spaces enable politically
    motivated actors and cybercriminals to develop and share practices, buy and sell
    software, malware, etc. These include forums, file sharing, creative and website
    hosting sites, URL shortening applications and services, video and live streaming/sharing,
    news, and social media sites and platforms developed for legitimate purposes.
    Various political actors and cybercriminals have embraced these spaces for their
    illegal activities. The activities are also extended to the use of VPNs, anonymised
    cryptocurrencies, and DDoS mitigation (Europol, 2019, p. 50).


    There is an increasing market on the Dark Web in the provision of digital and
    cybercrime elements. Personal data, access to compromised systems, attack services
    providing malware, ransomware, and DDoS attacks are essential elements to facilitate
    cyber attacks (Europol, 2020, p. 59). However, there is a shift in the use of
    the Dark Web by some of the groups. There are more options for using anonymous
    forums and market spaces not necessarily placed on the Dark Web. Organised cyber-groups
    have moved communications to private encrypted channels such as Telegram, Jabber,
    and WickR (Sharma, 2021). Some platforms exist on the surface or Deep Web interlinked
    with Dark Web goods and services, which offers additional benefits to the criminal
    enterprises and business models. Surface Web e-commerce platforms are used for
    increased accessibilities. These online shopping windows post links to the online
    digital e-commerce stores offering stolen accounts, databases, carding, crypters,
    malware, ransomware, and botnets (Europol, 2020, p. 59). The shift has been generated
    by increased Law Enforcement presence on the Dark Web, where marketplaces have
    been infiltrated and taken down in joint policing operations. The increased use
    of the Dark Web by ‘wannabe’ cybercriminals has also generated these changes,
    as the more advanced actors want to distance the newbies. Today, malware developers
    and political groups are relying less on the Dark Web for distributing their malware.
    Instead, they use black hat forums operating on the Deep Web and Dark Web to establish
    their brand and develop online communities. The Dark Web facilitates recruitments
    and acts to vet potential affiliates (Sharma, 2021).


    By mid-2020, hundreds of organisations have been targeted by ransomware groups
    using double extortion attacks by exfiltrating the data before injecting the malware
    into the system. The use of Dark Web communities and services has been instrumental
    for these ransomware groups operating as ‘ransomware-as-a-service’ (RaaS), where
    the developers have sold and rented newly developed malware (Leddy, 2021). Various
    web pages have been created for leaking the data if the ransom was not paid. The
    ransom groups are also developing their forums for communication on the Dark Web.
    For example, the REvil RaaS group communicates on its ‘Happy Blog’ placed on the
    Dark Web. The group uses its blog to increase the pressure on victims by posting
    information about the data extorted in the attacks (Mendez & Kazymirskyi, 2021).'
