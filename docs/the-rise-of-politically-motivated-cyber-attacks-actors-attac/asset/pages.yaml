    # THE EU: CYBERSECURITY INITIATIVES


    The different initiatives launched by the EU create a comprehensive framework
    to manage cybercrime attacks and cybersecurity. In 2010, the European Commission
    introduced the EU Internal Security Strategy in Action to provide a shared agenda
    for the member states and the EU institutions, agencies, and other actors. The
    2013 Cybersecurity Strategy of the EU clarified essential principles that should
    guide the member states in establishing their national cybersecurity plans (EC/HREU/FASP,
    2013). The EU Cyber Defence Policy Framework (2014) established priority areas
    for cyber defences and clarified the actors’ roles (CoEU, 2014; UNIDIR, 2020e).
    Over the years, initiatives have been launched to counter cybercrime, strengthen
    a judiciary network, cooperate between different actors, develop best practices,
    and support investigations and cybercrime prosecution (EC, CoEU, 2016, 2017, 2020a).
    One of the most important initiatives is adopting the EU Cybersecurity Act in
    2019, which introduces the EU-wide certification. The act upgrades the European
    Agency for Network and Information Security (ENISA) by expanding the mandate to
    cement its role in the framework (EC, CoEU, 2018a, 2020d). By implementing this
    initiative, the EU expressed a willingness to continue developing and implement
    voluntary, non-binding norms, rules, and principles for responsible state behaviour
    online within the UN framework and other international forums (EC, 2018; EC, CoEU,
    2019a). While this initiative progressed through the institutional framework,
    the Council adopted a conclusion to share and support the EU Digital Strategy
    implementation. The conclusions on malicious cyber activities aim to ensure global,
    open, free, stable, and secure cyberspace. The conclusions also expressed grave
    concerns about the increasing activities of malicious actors (EC, CoEU, 2020a,
    2020d).


    These initiatives were supported by the High Representative of the EU (2020b)
    forwarding a declaration on behalf of the EU. This declaration highlighted the
    states to respect the rules-based order in cyberspace. This declaration also urged
    actors to end malicious cyber activities, including the theft of intellectual
    property. The declaration also included a call for closer international cooperation
    to enhance cybersecurity and stability (EC, CoEU, 2019a, 2019b). Due to the COVID-19
    pandemic, this declaration was expanded to include malicious cyber activities
    exploiting the global'
