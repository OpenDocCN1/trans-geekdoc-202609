    # THE GGE REPORTING


    In 2014, a UN-level GGE group agreed on an essential set of recommendations of
    norms, rules, and principles of acceptable behaviour in cyberspace. The establishment
    of this expert group was a stepping stone to create global cooperation and progress
    a universal legal framework that removes the previous lack of clarity about these
    areas (Achten, 2019; Walker, 2019, p. 10; Wolter, 2014).


    The GGE’s 2021 report is considered essential, replacing the 2016–2017 GGE group,
    which failed in producing an agreed report within the time frame. The group disagreed
    on areas such as the right to self-defence and international humanitarian law
    (Schmitt, 2021; UN GGE, 2021). Given the geopolitical climate, it is not surprising
    that there are tensions internally within the group. Experts from 25 states were
    appointed. Most of them were selected because of their equitable geographical
    location. In contrast, six experts were from the five permanent Security Council
    member states which continuously disagree over cyber issues, i.e. China and Russia
    vs the US, the UK, and France (Schmitt, 2021; UN GGE, 2021). However, 2020 and
    2021 stands out because of the exceptionally high number of politically motivated
    cyber attacks. Frequent and severe hostile cyber operations have targeted GGE’s
    members’ national states, i.e. persistent election interference, espionage, APTs,
    and ransomware attacks on CIs. The new report acknowledged that international
    humanitarian law applies to cyber operations in armed conflicts. However, there
    are disagreements about how international law can govern cyber operations (Schmitt,
    2021).


