    in cybersecurity and online military defence. These three states are already struggling
    reaching agreements within the UN framework on cybersecurity because of their
    internal disagreements. This results in an unequal level of cybersecurity in the
    Asia-Pacific region. Enhancing cybersecurity should be at the forefront of all
    the states as it provides the best payoff. However, the tensions between the prominent
    cybersecurity actors in this collaboration are resulting in fragmented approaches.


    # National Cybersecurity Strategies


    # THE UNITED KINGDOM (THE UK)


    The UK published its first National Cyber Security Strategy in 2011. The strategy
    aimed to increase the UK’s cybersecurity and resilience against cyber attacks
    and protect online interests. The strategy should also create open, vibrant, and
    stable cyberspace supporting open societies (HM Government, 2015, p. 40). Money
    was allocated to the Government Communications Headquarters (GCHQ) to detect and
    analyse cyberthreats and pre-empt attacks and trace the cybercriminals behind
    the attacks. Under the GCHQ, a new National Cyber Crime Centre (NCCC) was established
    as a focal point for companies’ advice (HM Government, 2015, pp. 40–41). The second
    National Cyber Security Strategy 2016–2021 set out the government’s plans to make
    the UK more secure and resilient in cyberspace (GOV.UK, 2016; HM Government, 2016,
    p. 9; UNIDIR, 2020g). The UK government launched'
  merge: -1
  img_proc: true
- pgno: 113
  md: 'a Call for Evidence (2019) to gain insight into managing the cyber risks. This
    result highlighted that there still are a wide range of inabilities within organisations
    that create obstacles for enhancing security. The Evidence Call also identified
    a lack of commercial rationale or business drivers necessary to prioritise and
    invest in cyber risk management. The digital environment within organisations
    was too complicated and insecure. Two other obstacles were directed towards the
    government''s management of cyber risks. There is a lack of incentives to support
    organisations in enhancing online protection, and the imposed regulation was insufficient
    to compel organisations to introduce adequate cyber risks management (GOV.UK,
    2020). The following UK National Cybersecurity strategy would be published by
    the end of 2021. Based on the 2016–2021 cybersecurity review, trends like more
    significant reliance on digital networks and systems, rapid technological changes,
    a more comprehensive range of adversaries, and competing visions for the future
    of the Internet are areas that need to be addressed (Cabinet Office, 2020).


    # THE UNITED STATES OF AMERICA (THE US)


    The US has developed several strategies on the federal level. The US introduced
    its first policy in 2003. This strategy has been replaced several times as the
    strategy runs for five years before being replaced with an updated version addressing
    current cyberthreats. The strategies provide the department with a framework to
    “keep pace with the evolving cyber risk landscape by reducing vulnerabilities
    and building resilience; countering malicious actors in cyber-space; responding
    to incidents; and making the cyber ecosystem more secure and resilient” (US DHS,
    2019).


    The Comprehensive National Cybersecurity Initiative (CNCI) was developed and implemented
    by the White House in 2009 after an evaluation by US President Obama’s Cyberspace
    Policy Review. This initiative was initially launched in 2008 by US President
    Bush (NSPD-54/HSPD-23). The cybersecurity strategy encompasses 12 initiatives
    within three overarching goals. These goals are to establish a front line of defence,
    enable the US to defend against the full spectrum of threats, and, finally, strengthen
    cybersecurity for the future (EOPUS, 2009; UNIDIR, 2020h; US DHS, 2011a). The
    US President Obama determined that the CNCI and its associated activities should
    be developed and integrated into a broader and updated version of the national
    US cybersecurity strategy (The White House, 2009).


    The Department of Homeland Security (DHS) has a prominent role in this framework,
    including cooperating with the owners and operators of CI and essential resources
    (CIKRs), including private, state, or municipality-owned entities. The aim is
    to help these entities bolster their cybersecurity preparedness, risk assessment
    and mitigation, and incident response capabilities (UNIDIR, 2020h; US DHS, 2011b).
    The department got its mandate extended by its cybersecurity strategy from 2018
    to 2023. By 2023, the aim is to improve'
  merge: -1
  img_proc: true
- pgno: 114
  md: 'the national cybersecurity risk management plan that increases security and
    resilience across networks and CI. The aim is to decrease illicit cyber activity
    and improve responses to cyber incidents by developing a more secure and reliable
    cyber ecosystem (US DHS, 2018). The US strategies are built on a multistakeholder
    approach using transparent, bottom-up, consensus-driven processes, enabling governments,
    the private sector, civil society, academia, and the technical community to participate
    as equal partners on state, federal, and international levels (The White House,
    2018, pp. 25–26).


    # The US Cybersecurity Strategy 2018–2023


    The latest national cybersecurity strategy was introduced in 2018 to secure federal
    networks and information (The White House, 2018). The strategy identifies the
    need to protect CI and pursue malicious cyber actors. The core part of the strategy
    covers areas such as ensuring that various actors and agencies are deploying layered
    defence; improving information sharing and sensing; building secure government
    networks; responding to the challenges and opportunities of the cyber era to determine
    future prosperity and security; improving attribution, accountability, and response;
    enhancing cyber tools and expertise; and, finally, improving the integration and
    agility between government bodies (UNIDIR, 2020i). All of these are key areas
    to strengthen in the current climate where online threats are increasing, and
    multistakeholder approaches, resilience, and preparedness are critical factors
    for enhancing cybersecurity.


    The 2018–2023 cybersecurity strategy has been criticised for being overly optimistic
    about US domination worldwide. First, the cybersecurity strategy claims that the
    US will maintain leadership in developing emerging technologies. Of course, emerging
    technologies are vital for the US’ economic and military development. However,
    the world leadership is contested by China and its ambitious ‘Made in China 2025
    plan’ where the state also aims to become a world leader. Coats, the Director
    of National Intelligence, made it clear in 2019 that the US was losing the game
    concerning emerging technology as innovations that drive military and economic
    combativeness are emerging outside the US. The second claim is that the US would
    preserve peace through cyberspace strength and encourage other states to adhere
    to global cyber norms. However, as already outlined above, contrary to the US,
    China and Russia are active in developing cyber norms and propose international
    agreements within international institutions, such as the UN (Zegart, 2019).


    # The US Department of Defence Cyber Strategy 2018


    The US Department of Defence’s (DoD) strategy from 2018 replaces the 2015 strategy.
    The strategy’s overall aim is to ensure strategic competition in cyberspace and
    defend civilian assets that enable US military advantages (US DoD, 2018). The
    defence strategy priorities the challenge of ‘great power competition’, such as
    Russia China. Therefore, the DoD recognises that to counter the threats from US’'
  merge: -1
  img_proc: true
- pgno: 115
  md: 'competitions long-term and coordinated campaigns of malicious attacks, i.e.
    political, economic, and military, it is vital to enable attacks forwards. This
    strategy normalised military cyberspace activity by integrating operations across
    physical domains and reinforces the need to act preventatively to eliminating
    the threats before they damage US’ national interests (Cronk, 2020; US DoD, 2018).


    # THE PEOPLE''S REPUBLIC OF CHINA (CHINA)


    China has promoted its own national ‘China solution’ to global cyber governance
    by launching a strategy paper (2017) emphasising its doctrine of ‘cyber sovereignty’
    (ASPI, 2017, p. 31). The core element of China''s cybersecurity approach is to
    safeguard its sovereignty, security, and development. The focus on state sovereignty
    in cyberspace contrasts with the US model of multistakeholder Internet governance
    (ASPI, 2017, p. 31). China and the US disagree on crucial issues as their values
    and governance models are entirely different, i.e. cyber sovereignty vs multistakeholder
    approach (Rosenbach & Chong, 2019). China aspires to build a community of ‘common
    destiny’ in cyberspace with these overarching purposes. The cybersecurity strategy
    includes protecting CII, shared responsibility for the government, businesses,
    and civil society (Thinyane & Christine, 2020, p. 36).


    China’s main cybersecurity strategies are linked to the International Strategy
    of Cooperation on Cyberspace developed by the Ministry of Foreign Affairs and
    the Cyberspace Administration of China. The strategy identifies four basic principles:
    peace, sovereignty, shared governance, and shared benefits. The strategy aims
    are safeguard sovereignty and security, a system of international rules, fair
    Internet governance, rights and interest of citizens, cooperation, and a platform
    for cyber cultural exchange (Ministry of Foreign Affairs of the People''s Republic
    of China, 2015; UNIDIR, 2020b). Additionally, China has adopted a Cyberspace Security
    Strategy (2016) under the Office of the Central Cyberspace Affairs Commission
    (CAC), setting out state’s position and propositions on cyberspace development
    and security to establish China’s leading role as a cyber power (UNIDIR, 2020b;
    USITO, 2016). Finally, the state has developed a China’s Military Strategy under
    the Ministry of National Defence covering outer space and cyberspace (English.Gov.CN,
    2015; UNIDIR, 2020b). This strategy aims to enhance the state’s cyber capabilities,
    capacities, responses to manage major cyber crises, protect the national network
    and information security, and maintain national security and social stability
    (English.Gov.CN, 2015).


    # THE RUSSIAN FEDERATION (RUSSIA)


    Like the countries above, Russia has developed its national cybersecurity strategic
    framework. However, it does not consist of one overarching strategy but several
    doctrines that constitute the strategy. It is possible to trace back the'
  merge: -1
  img_proc: true
- pgno: 116
  md: 'first initiatives regarding cybersecurity to a joint session of Russia’s Security
    Council and the State Council in 2003. This session reformulated the Russian policy
    on critical infrastructure protection (CIP) after President Putin raised questions
    about formulating a new policy towards objects critical to national security and
    protection from human-made, natural and terrorist threats. The first principle
    of this strategy was documented in the 2006 presidential strategy (Pursiainen,
    2020; Pynnöniemi & Busygina, 2013).


    The Russian Information Security Doctrine from 2008 shares the governmental policy
    on information security. It is setting out the national interest of the Federation
    about information security (ITU, 2008). The 2000 doctrine provided a broad definition
    of the information sphere, which was further codified in the 2016 doctrine (Lilly
    & Cheravitch, 2020). The new doctrine was launched to ensure strategic deterrence
    and prevent military conflicts using information technologies. The doctrine also
    upgraded military information systems that used various troops, formations, and
    bodies (Lilly & Cheravitch, 2020; The Ministry of Foreign Affairs of the Russian
    Federation, 2016; UNIDIR, 2020d). The first significant initiative launched by
    Russia is the State Programme: Information Society, 2011–2020. The framework was
    implemented in 2010, and it has been amended in 2014 and 2019. It is now extended
    until 2024. This programme includes six sub-programmes where cybersecurity is
    interlinked with vital areas covering information and communication technologies,
    infrastructures, etc. (The Russian Government, 2012; UNIDIR, 2020d).


    In 2013, a presidential decree was issued to create a state system for detecting,
    preventing, and eliminating the consequences of computer attacks on vital information
    resources. This decree conferred authority to the Federal Security Service (FSB),
    including interaction with privately owned information resources. Despite the
    short text, the decree was a starting point for a comprehensive CII policy (Pursiainen,
    2020; UNIDIR, 2020d). Threats such as information weapons for military and political
    purposes, terrorism, and interference in internal matters and crimes were also
    identified and included in the strategy (UNIDIR, 2020d).


    The 2017–2030 Strategy for the Development of the Information Society in Russia
    defines goals, aims, and measures within domestic and foreign policy. The strategy
    aims to develop the information society, form the national digital economy, ensure
    national interests, and implement strategic national priorities (UNIDIR, 2020e).
    The strategy acknowledges Russia’s vulnerabilities as the state is behind other
    states in developing its information technologies. Therefore, the strategy calls
    for several new measures to be implemented between 2017 and 2030 (Sukhankin, 2017).
    Russia failed to fulfil the goals outlined in the 2008–2015 Strategy, and questions
    have been raised whether the strategy would meet the aims and objectives of this
    very ambitious strategy within the time frame. However, the approved strategy
    is vague about the expected results, and there is an absence of performance indicators
    included in the previous strategy (Sukhankin, 2017).'
