    The NATO Cooperative Cyber Defence Centre of Excellence

    (CCDCOE) Within the Alliance, the NATO CCDCOE has been launched

    as an international and interdisciplinary cyber defence hub providing research,

    training, and exercises in four essential areas, i.e. technology, strategy,

    operations, and law (CCDCOE, 2020b). The centre supports the member

    states and NATO with cyber defence expertise and foster collaborations

    between like-minded nations, researchers, analysts, and educators from military,

    governmental, academic, and industrial entities (CCDCOE, 2020a). An

    example of collaboration between multiple stakeholders is included in the

    Tallinn Manual on International Law Applicable to Cyberwarfare (2013).

    The first Tallinn manual addressed the most severe cyber operations. Included

    in the manual are those cyber operations violating the prohibition of the use

    of force, entitling states to exercise their right of self-defence, or occurring

    during armed conflict (NATO CCDCOE, 2013). The second Tallinn manual

    was published in 2017. This edition expands the influencing first manual’s

    coverage of international law governing cyber operations to legal regimes in

    peacetime (NATO CCDCOE, 2017). Both manuals have provided a blueprint

    for understanding cyberwarfare and enabling decision-making and strategies.


    # THE COUNCIL OF EUROPE (COE)''S CONVENTION ON CYBERCRIME


    The CoE’s Convention on Cybercrime 2001 is the only binding international

    instrument that serves as a guideline for signatory states in developing a com-

    prehensive framework in a national context against cybercrime. The main

    objective is to pursue a standard criminal policy to protect society against

    cybercrime by developing and adopting appropriate legislation (CoE, 2001a,

    2020a).


    The overarching aims of the Convention are to harmonise the domestic

    criminal substantive law elements of offences and connected provisions in

    cybercrime. The Convention provides a framework for national criminal pro-

    cedural law powers useful for carrying out investigations and prosecutions

    (CoE, 2001b). Although the Convention is broadly formulated and useful'
