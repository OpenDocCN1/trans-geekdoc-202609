  md: 'President Trump confirmed that the US was behind a covert cyber attack 2018
    against the Russian Research Agency. The Russian Research Agency is a troll farm
    believed to orchestrate online attacks against the 2016 US Presidential election
    and the 2018 mid-terms elections (Bohn, 2018; Nakashima, 2019; Kolbe, 2020).


    In 2019, the US claimed that it had conducted offensive operations against Russian
    infrastructure. The attack was launched in response to Russia’s cyber intrusions
    into a US energy grid (Carroll, 2019; Kolbe, 2020). The details about an impending
    attack were surprisingly announced via mass media, telling openly that malware
    had been injected into a Russian power grid. This malware could turn off electricity
    supply to homes, hospitals, and schools with short notice. Despite the public
    announcement, the actual operation was kept on a need-to-know basis, include the
    information provided to President Trump. This announcement is open to interpretation;
    was there malware included, was it a part of a tit-for-tat strategy, or was the
    malware discovered and the US tried to act proactively to manage the situation?
    (Carroll, 2019). The rationale behind these operations is not always a matter
    of strategic deterrence or part of the customary law of countermeasures. The tactic
    is also deployed to sow confusion about capabilities and capacities.


    # NATO''S APPROACH


    Inspired by the US strategy, NATO has also acknowledged that the alliance needs
    an approach combining deterrence and defence to deliver proactive and continuous
    responses to the growing risks emerging from threat actors, such as China and
    Russia. Both states are engaged in online, hybrid warfare attacks where Russian
    activities involve intrusion into CIs, manipulating elections, and blocking NATO
    military capabilities. China is engaged in cyber espionage, intellectual property
    theft related to sensitive technologies, industries, and CIs closely aligned to
    the objectives in the ‘Made in China’ plan. To counter the attack against the
    European and North American states, the alliance should develop and implement
    a resilience cybersecurity architecture for the organisation, member states, and
    significant CIs. It is also recognised that NATO should coordinate with its members
    to develop a more active cyber defence. Finally, it is believed that NATO should
    be central in coordinating a strategy of persistent engagement to reduce Russian
    and Chinese cyberactivities. However, NATO remains a defensive alliance and waits
    to respond to cyber incidents. Yet, the alliance aims to improve the intelligence-gathering
    level about opponents capabilities, provide early warnings of impeding attacks,
    and enable rapid counter-cyber responses and information sharing with targeted
    owners and operations while reducing the adversaries access to national information
    and data (Borghard, 2020b; Kramer & Rodihan, 2020; Davis, 2019). As NATO has been
    targeted over a long period, offensive actions are justified, and inaction is
    more dangerous (Kramer & Rodihan, 2020). However, it is a balancing act as a more
    active NATO in'
