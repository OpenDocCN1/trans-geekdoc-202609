    # Rethinking the Current Legislative Framework


    In managing the rise of politically motivated attacks, it would be useful to rethink
    the current situation to progress a new foundation developing from the outset
    of existing law regulating offline war and warfare. However, these should act
    as a starting point as they are inadequate to comprehend all the different areas
    that have been highlighted. Yet, key areas should be addressed to adjust the framework
    to the different categories of attackers. One fundamental area is to include all
    the actors and not only states. However, this comes with a new set of challenges
    as these attacks cannot be considered like for like. Therefore, there needs to
    be a hierarchical structure due to the attacks’ sophistication and impact. This
    categorisation would include the actors and the impact to be able to respond proportionally
    to the attacks: proactive and'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'reactive. The hierarchy would have the states at the top, followed by state-sponsored
    actors, state-supported actors/terrorists, and finally politically motivated actors
    that should have particular protection due to the right to protest.


    Currently, cyberwar and warfare are considered in the light of international law
    and custom, national counter-terrorism, and cybercrime legislation which creates
    a complex, fragmented, and disproportional approach. The jurisdiction and legislative
    issues regarding cyber terrorists, hackers, and cybercriminals are considered
    under national criminal laws and associated jurisdictional considerations (Barletta
    et al., 2011, p. 79).


    As evidenced by the numerous examples in the book, there are severe issues with
    developing international regulations and norms of behaviours and weapons in cyberspace.
    The gaps in the framework allow actors to manoeuvre around within any significant
    obstacles or consequences to progress. Mistrust among states and their conflicting
    political interests have been exposed due to the constant attacks, and the lack
    of collaboration enhances the risks. States should move beyond their geopolitical
    positions and negotiate a legal framework for acceptable behaviour in cyberspace
    and protection of vulnerable targets (Wegener, 2011, p. 95).


    However, the rise of attacks, the cross-border nature, and the capabilities and
    capacities of the actors raise calls for action to reconsider the offences’ status
    and characteristics. A new way of assessing and categorising these offences would
    help by assessing motivation and attack forms and routes to establish a common
    approach to politically motivated cyber attacks. The classifications derive from
    the widespread harm with political incitement, increased difficulties in identifying,
    capturing, and prosecuting the offenders. The strong presence of political motivation
    aimed at destabilising societies, creating uncertainties, and disrupting and destroying
    should be seen in a context with merger criminal law and international law regulating
    war and armed conflicts (Barletta et al., 2011, p. 79). The attacks are instrumental
    for disabling or belittle governments and organisations following underlying political
    or social agendas. The attacks can disable part of the CI, with wide-spread consequences
    to the target, suppliers, and/or the wider populations, or they aim to obtain
    confidential and sensitive information (McAlpine & Oldham, 2018).


    # Managing the Area


    There have been drafts proposed in the UN to develop cybercrime treaties, but
    geopolitics has stalled the development. The attempts have predominantly been
    a diplomatic front showing willingness. However, it is questionable whether an
    agreement can be reached due to underlying tensions between the actors and how
    they currently benefit from having a lawless space. These areas are incorporated
    as deterrence and defence measures in national cybersecurity strategies, but in
    reality, they boost political, financial, and'
  merge: -1
  img_proc: true
- pgno: 261
  md: 'military advantages. It is, therefore, unlikely that states are willing to
    enter into agreements that limit these powers unless the strategic payoff is changing
    for these actors (Barletta et al., 2011, p. 77; Congressional Research Service,
    2009). States should create a global and cross-sectoral legal framework that sets
    out rules and penalties for cyber conflicts by introducing a set of structured
    internationally negotiated binding agreements. Compared with current international
    rules regulating conflict between states, the frameworks should impose obligations
    on the signatory states to control their own and non-governmental groups and actors
    operating within these limitations (Barletta et al., 2011, p. 79).


    Only by creating an international cybersecurity regime and concerted effort of
    participants, the proliferation of these cyberpowers can be improved. An international
    regime covering a legislative framework regarding behaviours, attack types, and
    targets can reduce the threats of politically motivated attacks, such as cyberwarfare,
    cyberterrorism, and political online activism/cybercrime (Barletta et al., 2011,
    p. 77). Currently, the world is in a perpetual state of cyber conflict that borders
    cyberwarfare. This fight cannot be ended in the same way as conventional conflicts
    where one state will surrender, and the conflict will end. Currently, states are
    continually testing opponents defences by attacking technologies, devices, and
    networks (Kolbe, 2020). There are currently no consequences for the attackers
    to propel change in operations based on a negative payoff. If this area is addressed,
    it will signal the adversaries that specific actions are prohibited and have associated
    costs beyond the benefits. This is currently missing in the international framework
    and national cybersecurity strategies (Valeriano, 2020).


    All existing instruments can all be amended to include various types of politically
    motivated attacks similar to laws covering norms for conventional warfare on land,
    air, and sea, i.e. the UN Charter, NATO Treaty the Genevan, and the Hauge Conventions
    (ICRC, 1899; ICRC, 1907; ICRC, 1977; ICRC, 1949; United Nations, 1980; UN, 1945;
    NATO, 1949). A new framework would address areas such as territorial integrity,
    actors, and protection of the civil population and essential CIs. In this book,
    it has been highlighted that attacks can impact beyond the actual target, transnational,
    and cross-border – as well as online users and populations. Similar to exiting
    international law, there should be a prohibition of the transmission of cyber
    attacks through the neutral states not included in the conflict. However, this
    should not only be related to states. To prevent the widespread effect of cyber
    attacks, initiatives should be launched to protect neutral companies, groups,
    and individuals (Westby, 2011, p. 92). Collaboration and communication is a core
    factor for developing protective measures and a legislative framework, and states
    should make an effort to actively participate in the UN and other organisations
    initiatives to promote cybersecurity. Even though it takes time to develop a framework,
    the state should refrain from using cyberspace in conflicts, for revenge or to
    further their prosperity by using illegal methods (Wegener, 2011, p. 96; McAlpine
    & Oldham, 2018).'
