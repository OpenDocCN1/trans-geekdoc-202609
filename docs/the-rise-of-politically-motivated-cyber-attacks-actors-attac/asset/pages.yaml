    # *The Cyber Diplomatic Toolbox*


    The EU is focusing on the increasing number of large-scale cyber attacks. Large-scale
    cyber attacks are not new to the EU, as legislation has already been introduced
    to criminalise the area. However, attacks such as the WannaCry and NotPetya attacks
    in 2017, have increased the focus on these actions (EC, CoEU, 2018b, 2019c). In
    2019, the Council established a framework for imposing targeted restrictive measures
    to deter and respond to the growing external cyberthreats to the EU and/or its
    member states. The EU has launched initiatives such as the EU''s Cyber Diplomatic
    Toolbox covering cooperation, conflict prevention, and threat mitigation. The
    toolbox also includes means to deter and influence possible aggressors'' behaviour
    (CoEU, 2019, p. 2; EC, CoEU, 2019c).


    The Council''s framework for sanctions marks a new direction for the EU. The Cyber
    Diplomatic Toolbox permits sanctions on persons or entities responsible for attacks,
    attempting or supporting attacks against entities within the EU (EC, CoEU, 2018b,
    2019c). In 2020, the EU imposed the first sanctions against six individuals and
    three entities involved in various cyber attacks. These sanctions include travel
    bans and assets freeze. Moreover, EU persons and entities are prohibited from
    making funds available to the people or entities included in the ban (EC, CoEU,
    2020a, 2020c).


    # THE ORGANISATION OF AMERICAN STATES (OAS): CYBERSECURITY INITIATIVES


    The Comprehensive Inter-American Strategy to Combat Threats to Cybersecurity (2004)
    provides a multidimensional and multidisciplinary approach to creating a culture
    of cybersecurity. The strategy includes the Inter-American Committee against Terrorism
    (CICTE), Inter-American Telecommunication Commission (CITEL), Meeting of Ministers
    of Justice or Other Ministers or Attorneys General of Americans (REMJA) (OAS,
    2004a, 2009b; UNIDIR, 2020c).


    OAS''s cybersecurity programme covers three pillars: policy development, capacity
    development, i.e. training and cyber exercises, and research and outreach (OAS,
    2020). Like other initiatives launched, this cybersecurity programme aims to develop
    tools to prevent, identify, respond, and recover from possible cyber attacks.
    Moreover, the agenda promotes the development of processes and practices to improve
    information sharing, cooperation, and'
