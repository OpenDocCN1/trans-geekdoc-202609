    practices as facilitating an ‘endless pot of money’ (Lerman & Vynck, 2021).


    Although authorities strongly discourage making ransom payments that only encourage
    criminal networks to continue these attacks, Colonial Pipeline decided to pay
    the ransom. The rationale for this payment was the impact the attack had on people
    and companies relying on Colonials Pipeline’s services (Associated Press, 2021).
    The company paid DarkSide 75 bitcoins, which equals nearly 5 million dollars.
    However, the US Authorities later recovered a large portion of the ransom (Sabbagh,
