  md: 'Ransomware attacks developed significantly from the mid-2010s and onwards.
    There are constant news reports about politically motivated attacks and new challenges
    for governments, law enforcement, and cybersecurity actors to enhance resilience
    and preparedness proactively. Issues are related to detection and prosecuting
    the attacker operating in the interconnected online environment. High-profile
    ransomware attacks in 2017 pressured governments, corporations, and businesses,
    which was first perceived as financial cyber-crime, but later the attacks were
    attributed to state-sponsored groups in North Korea and Russia. WannaCry and NotPetya
    attacks in 2017 demonstrated the long social damages that there could be related
    to ransomware attacks.


    *WannaCry* The WannaCry cyber attack in 2017 had a detrimental effect. The attack
    was classified as ‘the worst attack’ targeting numerous public and private entities.
    The WannaCry attack caused panic, systems went down, and data were lost. The ransomware
    propagated through the systems like a worm infecting new computers by automatically
    sending itself across the networks. Therefore, the malware was not tied up to
    infected files or links to spread (DigWatch, 2017; Hern, 2017a; Whittaker, 2019).
    Interestingly, the ransomware was routed through old computer systems using an
    outdated version of Microsoft Windows, the Windows SMB protocol. The attackers
    targeted weaknesses in the systems by using an exploit initially developed by
    the US National Security Agency (NSA). The NSA backdoor DoublePulsar created a
    persistent backdoor for the attackers to deliver the EternalBlue exploit. Two
    months before the attack, Microsoft released a patch to protect the users’ systems.
    However, numerous individuals and organisations did not regularly update their
    operating systems, which exposed them to the ransomware (Kaspersky, 2021; Whittaker,
    2019).


    The ransomware spread through the online environment encrypting more than 230,000
    computers in 150 countries within one day. Public and private entities were attacked
    in Russia, the US, the UK, Germany, Spain, France, South Korea, China, Japan,
    Indonesia, India, Australia, etc. (BBC News, 2017). The attackers charged the
    victims to obtain the decryption code allowing them access to the hijacked data
    (Latto, 2021; Whittaker, 2019). The WannaCry ransomware had a significant impact
    worldwide, and it is estimated that the attack caused 4 billion dollars in losses
    worldwide (Kaspersky, 2021). One of the victims of this attack was the UK National
    Healthcare Service (NHS). The National Audit Office (NAO) said that 19,500 medical
    appointments were cancelled, computers were locked, and 600 GP surgeries. Moreover,
    five hospitals were forced to divert their ambulances elsewhere. The NAO heavily
    criticised the NHS for its lack of cybersecurity. The NAO stated that the WannaCry
    attack was relatively unsophisticated, and it could have been prevented if the
    NHS had followed basic information technology (IT) security practices (Hern, 2017a).
    The WannaCry ransomware continues to'
