  md: 'backed by GRU (Porche III, 2019). As most of the states are operating below
    the threshold of cyberwarfare, such a declaring war online, they engage in irregular
    warfare by using state-sponsored actors.


    # Politically Motivated Non-state Actors and Terrorism


    The term ‘terrorism’ is contested. The word covers conflict situations where one
    side’s actions are considered legitimate while the other is illegitimate. The
    problems with the classification of terrorism occur in determining which audience
    or population recognises this clause as legitimate. Both the demographic and the
    support for the case can change over time. Although terrorism often spreads fear,
    they also seek to get domestic and international support and empathy from the
    population they aim to ‘free’ by the actions (Kiras, 2019, pp. 184–185). The notion
    ‘one man’s terrorist, another man’s freedom fighter’ covers two ends of the spectrum
    that cannot be combined. The question is ‘who is the terrorist?’ and the answer
    would depend on which side of the conflict asked. This also illustrates the difficulties
    of defining terrorism (Townshend, 2002, p. 23). There are different motivations
    and groupings classified as terrorists. For example, vigilante terrorism is politically
    motivated violence conducted by non-governmental groups and individuals. In comparison,
    vigilante violence committed by state-sponsored groups on behalf of the regime
    is often linked to the defence of a demographic group or political or cultural
    establishment, and vigilante state terrorism is used to preserve a preferred order
    (Martin & Prager, 2019, p. 159).


    In an objective definition of terrorism, it can be argued that terrorism can be
    based on the acceptance of international laws and principles related to behaviours
    permitted in armed conflicts between nations (wars). This position could then
    be extended to conflicts between non-governmental organisations and states, differentiating
    between guerrilla warfare and terrorism, targeting military goals. In comparison,
    the terrorists’ primary goal is civilians (Ganor, 2010). It is clear that terrorist
    organisations have a political motive, regardless of their other motives. They
    use political means and methods to reach their political, ideological, or religious
    goal (payoffs). These political objectives distinguish terrorism from other criminal
    activities, i.e. terrorist attacks vs pointless criminal killings. Terrorism can,
    on the one hand, be an element of a large military or guerrilla warfare strategy,
    but it can also be confined to more limited goals. The political motivation goes
    in multiple directions, from systematic terrors to pursuit a political goal, such
    as changing political systems, overthrowing colonial or oppressive rulers, destroying
    unjust economic regimes to more limited goals, such as demand prisoners’ release,
    revenge, publicity, political statements, ethnic autonomy, etc. (Lenard, 2020,
    p. 4; Townshend, 2002, p. 13). See Table 2.3.


    The target can also be broader than the actual target, as the terrorist activities
    produce fear within a large group of people beyond the immediate victims. This
    tactic is widely used as terrorists believe that associated fear can'
  merge: -1
  img_proc: true
- pgno: 42
  md: 'erode and threaten the quality or stability of the existing societal and political
    order (Lenard, 2020, p. 4; Scheffler, 2006, p. 5; Wilkinson, 2011, p. 4). Finally,
    terrorism often aims to target and harm civilians, and they continuously threaten
    the population with the risk of more violence. This is an area where terrorism
    is clearly distinguished from warfare, where the rules of warfare are introduced
    to prevent combatants from targeting civilians (Lenard, 2020, p. 4).


    # Insurgency


    Insurgency is not conventional war or terrorism. However, it shares the foundation
    of using force to archive a political end. Insurgencies are characterised by the
    support and mobilisation of a significant part of the population. However, the
    character of the groups and the means and methods used vary depending on the aim.
    The operations can be linked to social, cultural, and economic aspects by using
    revolutionary, partisan, guerrilla, liberation, or civil war tactics. However,
    these groups have the means to contest, hold, and govern the territory. In this
    context, political control is essential, and the external physical and moral support
    for the goal is the prerequisite for the groups’ success (Kiras, 2019, pp. 184–185).


    # Cyberterrorism


    Cyberterrorism can be used by actors engaging in cyberwarfare, but not all cyberwarfare
    types can be categorised as terrorism. The categorisation is also linked to the
    distinction between cybercrime and cyberterrorism based on the attacker’s intentions,
    targets, and level of harm. It is considered that it is more likely that cyberterrorists
    would focus on attacking CIs using conventional war and warfare means and methods
    compared with the traditional cybercriminals (Parker & Kremling, 2017, p. 131).
    However, in 2020, the distinction has been blurred by the increase in ransomware
    attacks targeting CIs. Ransomware has traditionally been considered a financial
    cybercrime. However, due to groups constant attacks on vital services, the impact
    on society and the fear of the targets, the frequency, and the level of protection
    offered by states, they are now considered national security threats and sidelined
    with terrorism, and levelled with national security threats. The whole process
    related to the ransomware attacks is getting considerable attention, i.e. cryptocurrency
    exchanges, illicit online forums or marketplaces, and botnets linked to these
    attacks (Paytoncul, 2021).


    The motivation behind cyberterrorism is similar to conventional offline terrorism.
    However, the means and methods differ, and the reach and scope of these activities
    have changed as it is possible to conduct attacks from a considerable distance.
    The various cyber-dependent malware and software to conduct attacks are also different
    from offline terrorism. Similar to traditional offline terrorism, online attacks
    would also include several preparatory'
  merge: -1
  img_proc: true
- pgno: 43
  md: 'strategies and methods to ensure that the attack can be launched. These would
    include target choice, reconnaissance; entrance and exit routes; and knowledge
    about processes and practices. The preparations constitute a high level of risk,
    as the attackers might be exposed to cybersecurity actors and internal alarm systems.
    Yet, they are still more secure than preparing for an attack on the ground (Macdonald
    & Mair, 2015, p. 21). Undoubtedly, the online environment and the Internet’s architecture
    are beneficial to terrorism planning and execution of various acts, such as recruiting,
    circulating propaganda, communicating, and conducting cyber attacks. Modern technologies
    amplify the terrorist organisations to communicate effectively online, broaden
    their message by reaching out to a broader audience because of the different anonymising
    software available (Jakobi, 2020, p. 207).


    Groups, such as Aum Shinrikyo (Japan), al-Qaeda, and IS (worldwide), have used
    technology for recruitment, propaganda dissemination, and fundraising. The online
    environment allows these groups and individuals to use unconventional weapons
    in unexpected ways through asymmetrical warfare (Hamilton, 2017; Martin & Prager,
    2019). Clearly, the unlimited access to the Internet, the connectivity, and the
    anonymity provided by various platforms and encryption software make computer
    technologies attractive for terrorists, which have emerged from using basic surveillance
    to more damaging tools while hiding on the Dark Web to avoid detection (Parker
    & Kremling, 2017, p. 133). There are limited data available about the level of
    cyberterrorism beyond the focus on religious terrorism using the online environment.
    Cyber attacks are rising in new settings, such as attacks on CI structures and
    services. Yet, individuals and policymakers tend to pay attention to high-risk
    scenarios on behalf of the probability of low-risk scenarios – even though with
    high probability. Hence, attacks might be unnoticed or classified as cybercrime
    rather than cyberterrorism (Jakobi, 2020, p. 207).


    # Politically Motivated Non-state Actors: Political Movements and Activism


    Although political and social movements are distinct from terrorism and war and
    warfare, this area is rising. The majority of the actors are using peaceful means
    and methods to engage in political debates and activism. Despite being on the
    other side of the spectrum, protests can include violence. However, these are
    criminalised in the national criminal justice system and weighed against the right
    to freedom of assembly, protest, and freedom of speech. Civil unrest develops
    when social, economic, and political stress accumulate slowly until the pressure
    is released spontaneously as a form of social unrest (Braha, 2012).


    Social and political movements enable people to collectively voicing their grievances
    and concerns about rights, welfare, and well-being of themselves and others. Social
    and political movements create an outlet for people to engage in actions that
    are an essential vehicle for articulating and pressing a collective’s interests
    and claims (Snow et al., 2004, p. 3). In the 1970s,'
  merge: -1
  img_proc: true
- pgno: 44
  md: '# Table 2.5 Outline of political activist groups and tactics


    | Type | Characteristics | Actors |

    | :--- | :--- | :--- |

    | Anarchism | A process whereby authority and domination are being replaced by
    non-hierarchical, horizontal structures, with voluntary associations between human
    beings | Political anarchists view the state’s centralised, monopolistic, coercive
    powers and illegitimate |

    | Civil disobedience | Both a political tactic and the foundation for a movement
    for social change A non-violent action where an individual refuses to comply with
    the law for moral or philosophical reasons | A group or individual that wilfully
    and openly refuses to comply with the law to highlight what is considered to be
    unjust |

    | Activism | Intentionally taking actions to be about social or political change
    | A feeling by an individual, group, or nation of a cause of injustice that must
    be changed |


    Sources: Fiala (2017); Sliwinski (2016); Tindall et al. (2008); Wittel (2015).


    political action was characterised as ‘protest’, and actions were defined as the
    willingness to engage in dissent, including unofficial strikes, boycotts, petitions,
    the occupation of buildings, mass demonstrations, and, if needed, acts of political
    violence (Nolas et al., 2017, p. 3; Norris, 2009, p. 11). In the 1960s and 1970s,
    a number of social movements were rooted in collective action, such as feminist,
    environmentalist, disability, antiwar, and gay rights – and more recently, the
    Occupy Wall Street and Black Lives Matter (BLM) demonstrations. These social movements
    have deployed successful strategies and tactics developed during the civil rights
    movement; predominantly non-violent protests, boycotts, sit-ins, freedom rides,
    and mass demonstrations (Clayton, 2018; Sitkoff, 2008). On the other side of the
    spectrum, there has been a rise in political movements linked to the ‘extreme
    right’, ‘far-right’, and ‘populist radical right’. The common denominators for
    these groups are their exclusionist and ethnic-nationalist notion of citizenship.
    This can be seen in the notion of ‘own people first’ (Arzheimer, 2009; Bélanger
    et al., 2019, p. 910; Mudde, 2007). See Table 2.5.


    # Anarchism


    Anarchism is a sceptical theory of political legitimisation linked to the justification
    of authority and power – and in particular political power grounded in moral claims
    about the importance of individuals’ liberties and the idea'
  merge: -1
  img_proc: true
- pgno: 45
  md: 'of human flourishing deriving from an ideal of non-coercive consensus-building
    (Fiala, 2017; Wittel, 2015). A surge in anarchism is promoted by different social
    movements linking First and Third World struggles over the last decade. These
    movements have resulted in the formation of several new global political alliances
    blending the politics of globalisation. Political anarchism has enjoyed a renaissance
    where activists are deeply integrated into political movements, such as Global
    Justice, Occupy (Bowen & Purkis, 2018, p. 3; Scheuerman, 2018, p. 81). For some
    anarchist movements, violence is a part of the game where violence sometimes arises
    as a part of the activities. This is seen as an unfortunate and, to some extent,
    an unavoidable fact of political life (Scheuerman, 2018, p. 88; Wittel, 2015).


    # Civil Disobedience


    Civil disobedience and activism are different from anarchism, although there are
    some similarities. Civil disobedience is a public, non-violent, and conscientious
    breach of the law to change political systems or governmental policies. The politically
    motivated participants are willing to accept that their actions might have legal
    consequences. This notion demonstrates their fidelity to the rule of law – contrary
    to the anarchist who disobeys the political consensus and the legal strains on
    their liberties. It can be argued that civil disobedience, on the one hand, falls
    between legal protest (Brownlee, 2013; Delmas & Brownlee, 2021). Due to conscientious
    refusal of accepting the status quo, civil disobedience also includes revolutionary
    action, militant protest, and organised forcible resistance (Brownlee, 2013).


    # Activism


    There is a rise in alternative forms of activism based on cause-oriented politics,
    which has become mainstream. Political engagement in society is predominantly
    linked to voting rights. Activism in this context is civic engagement within representative
    democracy in national states, including the channels influencing elections, governments,
    and parties where citizens are involved in the actual voting but also in campaign
    work, organised events in communities, lobbying politicians, etc. (Nolas et al.,
    2017, p. 3; Norris, 2009, p. 10). However, value-based political activism is also
    increasing. Value-based activism can be understood as political activism linked
    to assemblages of meanings and practices people feel about the world and the areas
    that matter most. This is linked to the normative challenges people face every
    day and what is important to them, i.e. what is good and wrong, how to act, and
    what to do. Decisions about individual ethics play in everyday value-based activism.
    For example, where to live, how to live, what to eat, and environmental issues
    can be lived experiences and social norms linked to political statements and activism
    (Nolas et al., 2017, p. 4; Sayer, 2011, p. 1).'
  merge: -1
  img_proc: true
- pgno: 46
  md: '# Online Activism: Politically Motivated Hackers or Hacktivist Groups


    The threat to cybersecurity spills over to the more private part of the spectrum.
    The actors are not linked to military units or political causes where violence
    and harm are promoted to spear a political or ideological fear (Parker & Kremling,
    2017, p. 89). The majority of online activism is not related to cyber attacks.
    Instead, this form of online activisms circulate information that fed into a particular
    narrative to enhance a specific political or sociological perspective. For example,
    influencing votes as part of a large-scale attempt to affect public opinion or
    voting plans. The Internet provides a valuable platform for information favouring
    a preferred political candidate playing with the voters'' fear and prejudice.
    Some issues of this practice are state-sponsored attacks, where politically motivated
    campaigns can quickly reach a global audience (Lavorgna, 2020, p. 174).


    # HACKER/HACKTIVIST COLLECTIVES


    Hacktivism can broadly be defined as a combination of offline grassroots movements
    merged with computer hacking (Li, 2013, p. 305). Hacktivism has been defined as
    hackers using legal and/or illegal digital tools to archive a political goal,
    free speech, and promote human rights by moving offline demonstrations, civil
    disobedience, and low-level information warfare into cyberspace. Therefore, the
    activism activities are considered a modern equivalent of political protesters
    using the Internet as a means of communication (Trend Micro, 2015; Yar & Steinmetz,
    2019, pp. 87–88).


    Hacktivism combines a hack with activism where hacktivism turns traditional forms
    of radical protest into cyberspace-generated non-violence actions, such as virtual
    sit-ins or blockades. There are two forms of activism. One is mass action hacktivism.
    The other is digitally correct activism. Mass action hacktivism is close to traditional
    mass protests where activists defy the physical barriers by using the online environment.
    In this context, hacktivists reinvent the traditional political protest or civil
    disobedience and add a new online dimension to the political and social movements,
    whereas digitally correct hacktivism is the political application of hacking against
    online infrastructures. This is predominately used to ensure that online information
    remains free and accessible to everyone echoing the original ethical hackers''
    incitement to engage in online actions (Jordan & Taylor, 2004, pp. 68–69; Lavorgna,
    2020, p. 60; Yar & Steinmetz, 2019, pp. 85–86). The means used are linked to cyber-dependent
    methods and malware that enables the attacks. Email bombs, website defacements,
    viruses, worms, doxxing, and leaking information are all methods used by various
    hacking groups. Using these tools, hackers can circumvent traditional activism
    forms with innovative actions to reach their goal globally (Yar & Steinmetz, 2019,
    pp. 86–88).'
  merge: -1
  img_proc: true
- pgno: 47
  md: '# The Internet and Internet Platforms


    The development has gone fast from the early computers, which could perform limited
    tasks and were expensive, to the current use of computer technologies, networks,
    and devices. Three decades ago, most people did not own a personal mobile phone
    or computer as they were still costly. The people who had access to these computer
    devices faced limited use and functionality compared with the current use of multiple
    devices and Wi-Fi systems in everyday life. The impact of computer technologies,
    networks, and devices cannot be underestimated. One of the significant innovations
    is the development of the Internet. The Internet and various online forums are
    instrumental for politically motivated actors similar to the architecture of cyberspace
    that enables cyber attacks.


    # The Internet


    The online environment is not only computer technologies such as hardware and
    software. Equally important is the Internet, enabling online users to communicate,
    exchange knowledge, and search for information. In the same way as the development
    of computers, the military has influenced one of the most important innovations:
    The Internet. The forerunner to the World Wide Web (WWW) is the Advance Research
    Project Network (ARPANET). The US Department of Defence (DoD) founded in 1969
    research on networking computers with new processing capabilities. However, at
    the time, there was little interest from businesses to use computer systems to
    develop their commercial potential (Norman, 2017, p. 26; Yar & Steinmetz, 2019,
    pp. 7–8). The breakthrough of creating a networking computer system for sharing
    and processing information came in 1989 when Berners-Lee started creating the
    World Wide Web (WWW). WWW is based on an interlinked hypertext document system
    that forms the Internet. This is also defined as the networks of networks for
    multimedia access. (Gohel, 2014, p. 23). The Internet is a computer system that
    can process vast amounts of data traffic across a worldwide network. The global
    network ensures that computers worldwide are connected despite the different devices
    and persons operating them (Ropoliy, 2013, p. 2). Today, it is possible to share
    information commercially and privately worldwide instantaneously (Puyvelde & Brantly,
    2019, p. 3). The creation, obtaining, and transferring information is critical
    in cyberspace and the Internet, where the information flow takes various forms.
    The interconnected computer devices on multiple levels created a structure of
    processed data. Today, data are floating around in cyberspace and are also indexed
    on hard drives or memory sticks and clouds – continuously transmitted between
    various computers and stored externally on business, governmental, or private
    sever spaces. Thus, data structures are more complex and dynamic, in which the
    physical location is less critical (Gálik & Tolnaiová, 2019). However, interconnectivity
    and the way the Internet is used facilitate cyber attacks.'
  merge: -1
  img_proc: true
- pgno: 48
  md: 'The accessibility of computer devices, the Internet and networks, and the architecture
    of cyberspace and the Internet means that people worldwide can communicate and
    share information. At the same time, cyberspace and the Internet provide attackers
    with global resources for moving data and information around and finding safe
    havens for conducting cybercrimes and attacks. Legal obstacles and judiciary challenges
    set up limitations for investigating these offences. Communications are routed
    through multiple jurisdictions, requiring assistance from local and national law
    enforcement and security actors. This makes it challenging to investigate or prosecute
    the different illegal activities. The inconsistent criminalisation of online behaviours
    and disharmonised cyber laws also create obstacles for effective policing of the
    Internet and virtual spaces. It is increasingly easy to cover up an identity,
    take on a fake identity or hide behind virtual private network (VPNs) or the Dark
    Web. Portability and transferability of devices and data make it difficult to
    trace the offenders as data can be stored on various portable devices, cloud storage,
    and the Internet (Clough, 2015, pp. 7–9; Gillespie, 2019, p. 13; Munk, 2018).


    # The Internet, a Vector for Attacks


    Web-based or online threats are vectors for causing undesirable actions using
    the Internet and virtual spaces for attacks. These attacks are possible because
    of the architecture of the Internet, end-user vulnerabilities, web-serviced developers/operators,
    or the actual web services. All these areas can cause significant damage to individuals,
    groups, corporations, and governments (Kaspersky, 2021).


    Various cybersecurity systems are often costly and challenging to integrate and
    manage. The vulnerabilities in the different systems come from insuring operating
    systems and network architecture to flaws in servers and hosts, misconfigured
    wireless action points and firewalls, and insecure network protocols. Yet, hardware
    vulnerabilities and software and applications vulnerabilities where coding errors
    or the software respond to particular requests unintendedly. Zero-day vulnerabilities
    adds to the complexity as attackers exploit gaps in the system unknown to the
    software vendors. As long as these exploits are unpatched, the attackers have
    free access to the systems and networks (ENISA, 2020, p. 2; IT Governance, 2021).
    These means and methods open various parts of the Internet to cyber attackers
    who can continue to use the web for malicious activities (Mimecast, 2021). The
    attackers can quickly move parts of their infrastructure, alter aspects of the
    code, adapt the functionality, gather more victim data, etc. (Europol, 2020, p.
    12). Normal channels for communication have also been infected with malware. Any
    messenger can be manipulated to send dangerous messages, attachments, and links.
    Online users should always be suspicious about links and attachments. WhatsApp
    has been used in the past, and attackers use Telegram’s bot account operating
    by software as an attack vector. These attacks are conducted by'
  merge: -1
  img_proc: true
- pgno: 49
  md: 'advanced threat actors on a sophisticated attack level to control malware

    (Doffman, 2021; Hoffman, 2021).


    Politically motivated attackers do not need to have a high level of com-

    puting skills to conduct attacks. According to Europol (2020), cyberthreats

    range from social engineering and phishing to ransomware and other forms

    of malware. The different threat actors are operating online with different

    levels of skills, capability, and adaptability. The top-tier attackers manage

    their operations professionally, where the less sophisticated threat actors

    rely on off-the-shelf materials to conduct their criminal activities (Europol,

    2020, p. 7). Various vulnerabilities are available online for both attackers and

    cybersecurity professionals. However, attackers can buy the different tools

    and vulnerabilities online, enabling them to exploit them using a malware

    toolkit and online tutorials; both are offered on various forums on the Dark

    Web. More advanced attacks require a high level of sophistication and would

    be more lab intensive, but many of these attacks rely on the available tools (IT

    Governance, 2021).


    The web threats expose the interconnectivity of systems and services where

    the threats travel the systems to amplify the attacks. The attacks are often

    caused by a mixture of human manipulation and technical commands. The

    malicious actors usually place the threats in locations where the users will

    engage with them, such as public web pages, social media, web forums, and

    emails. Thereby, the online users play an active role in enabling the infection

    and spreading the web threats. Often the threats are being spread by inno-

    cent online users who unknowingly spread the threats to other users and

    networks (Europol, 2020, p. 15; Kaspersky, 2021). By targeting online users,

    social engineering and phishing have a high impact on society. Attackers are

    using two ways to conduct their activities online. One method is to conduct

    untargeted attacks, where they are indiscriminately using the online environ-

    ment to attack as many devices, services, and users as possible. These

    techniques enable most attacks, from extortion to acquiring sensitive

    information, to execute more advanced malware attacks (Europol, 2020, p. 15;

    NCSC, 2016; Pratt, 2021). The second method uses targeted attacks, where

    the targets are singled out because the attacker has a particular interest in

    the victims. The groundwork for these attacks can take months, where the

    attackers seek out the best routes for infecting the systems. These attacks

    are more damaging than untargeted attacks, as the exploits are designed to access

    the target’s system (NCSC, 2016; Pratt, 2021). An example of a targeted

    attack is the hacktivist group Anonymous that re-emerged in the aftermath

    of violent protests in Minneapolis after the death of George Floyd in 2020.

    The group threatened to expose crimes committed by the police force (Molloy

    & Tidy, 2020; Pratt, 2021).


    Attackers are employing a holistic approach to their attacks and the initial

    parts of the different schemes. In terms of phishing, the attackers demonstrate

    a high level of competency by combining the different tools, systems, and vul-

    nerabilities. Collaborations are also developing, and the actors are sharing'
  merge: -1
  img_proc: true
- pgno: 50
  md: 'tools and platforms. The groups are also conducting attacks together, which
    increased the challenges for blocking or tracing the groups. Moreover, skilled
    attackers are increasingly targeting preselected victims instead of attacking
    randomly to optimise their gains. Information gathering and victim profiling have
    become integrated into operations (Europol, 2020, p. 15).


    The attackers are conducting repeated stages as a part of their operations. The
    attacks started on the survey stage, where the attackers are using any possible
    means available to find the technical, procedural, or physical vulnerabilities.
    Having obtained these initial types of information, the attackers move to the
    developer stage to identify a path for exploiting the vulnerabilities. The actual
    breach stage depends on the nature of the vulnerability and the explosion method.
    The attack can open up the affect stage allowing the attackers to explore the
    system further. The attacker might exit the system and remove all evidence of
    the intrusion or create backdoors for future exploitation by them or other attackers
    (NCSC, 2016). The large-scale supply-chain attack against SolarWind provides a
    clear example of how more than one actor can use these attack routes. In 2020,
    the SolarWind attack was discovered, which has been attributed to Russian threat
    actors. At the same time, Chinese attackers were using the zero-day vulnerability
    to install the SUPERNOVA web shells on the IT monitoring platforms. This attack
    is unrelated to the SUNBURST attack by the Russian attackers against SolarWinds
    Orion businesses software updates. Yet, due to the complexity of the attack, it
    took time to separate the two attack groups. The Chinese group, the Spiral threat
    group (DEV-0322), targeted software companies and entities within the base sector
    of US Defence (Cimpanu, 2021; Secureworks, 2021).


    # ONLINE PLATFORMS AND INTERACTIONS


    Cyberspace and the Internet are attractive to users for several reasons. First,
    it has developed into an important place for communication that encompasses distinct
    social dynamics. Cyberspace and the Internet open for communication display a
    different pattern compared with traditional offline communication forms. Everyday
    associations are created which trigger assumptions or connotations regarding the
    degree or quality of interaction of online users, their social relationship, or
    the temporal and spatial belongings. However, these are defined in the context
    of the interactions and purposes of the communications (Chmiel et al., 2011).
    The use of computer technologies and online platforms varies. Online communities
    developed because online communications coexist with the physical world. Due to
    changes in the ecosystems and how computer technologies are embedded in everyday
    life, it becomes challenging to separate offline and online experiences as they
    are inherently blended. Online user’s perceptions and experiences of computer-mediated
    use change depending on the different tasks they undertake and how they communicate
    and interact at a given time (Croom, 1999).'
  merge: -1
  img_proc: true
- pgno: 51
  md: 'Political network societies are centred around digitalisation, connectivity,
    nodes, transfer of information, power, space, and culture. These areas create
    a new wealth production, enable debates, manage populations, and sharpen relations
    between groups and individuals. Compared with offline communities, networked societies
    are decentred social systems where connectivity binds people together. The existence
    within these online spaces requires an omnipotent ability to change. Flexibility
    to adjust is vital when involved with these online communities to embrace the
    constant flow of information, ideas, technologies, and shifting connectivity patterns
    (Athique, 2013, pp. 16–17). Networked societies are instrumental for politically
    motivated online users, who groups online with like-minded people across traditional
    offline boundaries. The interconnected and borderless societies create opportunities
    for political actors. Everyone with a political agenda has the potential to become
    a cyberwarrior. Technological evolution has unleashed repressed desires from an
    online user to engage in various politicised activities. Moreover, the evaluation
    has removed barriers to creating and participating by enabling several people
    to access the various platforms and the opportunity for sharing tools, knowledge,
    and skills (Merrin, 2018, p. 189).


    Online users create virtual societies to promote political and/or social issues
    and mobilise like-minded citizens in the online environment. The web creates an
    opportunity for politically motivated online users to be involved in permanent
    campaigns and interactions in both a global, regional, national, or local context,
    depending on the area of concern. The decentralised nature of the online environment
    spills over this area, and these groups of people often act without clear leadership
    (Siapera, 2018, pp. 54–55). The online media enables the actors to be engaged
    with no physical barriers, and they can work beyond the different groupings, shifting
    in and out of the online spaces.


    These movements are more based on individual experiences and narratives rather
    than ideological theories and goals. This change is in line with a broader historical
    shift where social movements are grounded in identity policies that offer flexibility
    to adjust, regroup, and reconfigure themselves with the case and the end goal
    (Siapera, 2018, p. 55). Most online political activism is non-violent civil disobedience
    and protects very similar to offline social movements (Yar & Steinmetz, 2019,
    p. 85). However, the actual means and methods are different – and so is the way
    they are organised. This change of social movements is reflected in hacktivism
    that illustrates the group’s decentralised establishment and how they align with
    and embraces modern technologies. The information flows to reach their goals.
    Hacktivism projects are based on online users who support projects and particular
    viewpoints in line with their own identities, and they show the imagination and
    depth of their political interactions (Siapera, 2018, p. 56).


    # POLITICALLY MOITIVATED GROUP ACTIVITIES FUELLED BY ONLINE PLATFORMS


    There are groups of online users conducting actions to meet a political end. These
    are not linked to the military or terrorist organisations – hacking or'
  merge: -1
  img_proc: true
- pgno: 52
  md: 'hacktivism. Instead, online users and political actors created their collective
    subunit to pursue an overall goal. Promoters of Western activism have welcomed
    the Internet and online platforms to circulate human rights, and democratic values
    and activities are praised. Before developing the Internet, there were several
    ways people could communicate their disdain with political decisions by writing
    letters to media outlets or their parliamentary representatives. People could
    also raise their opinion in public settings. The web has extended this form of
    protest as various online platforms, and communication boards enable online users
    to express their viewpoints on politics and social issues (Holt et al., 2018,
    p. 85).


    Other groupings have also adopted the Internet to promote their political end
    without being classified as cyberterrorism. The radical right movements are often
    associated with white supremacist groups (Holt et al., 2018, p. 405). These activist
    groups, such as the far-right hate groups, are often based on the concept of leaderless
    resistance, where the individual and autonomous activity is encouraged, and all
    can claim involvement with the group. Therefore, they are organisationally and
    conceptually different from terrorist groups, which have some form of a hieratical
    structure. Leaderless resistance enables online users to communicate in a wider
    geographical sphere enabled by cyberspace and its interconnectedness (Bowman-Grieve,
    2015, p. 89).


    # THE INTERNET: THE DARK WEB


    The different layers of the Internet allow different actors to operate in open
    or closed encrypted societies. Both open and closed communications and interactions
    can provide a space for pursuing political interests. Internet users are most
    familiar with the Surface Web. The Surface Web is content indexed by search engines,
    and it is a part of the WWW, which everyone can access (Yar & Steinmetz, 2019,
    p. 10). Compared with the Surface Web, the Deep Web contains a more significant
    amount of hidden data (Chang & Cho, 2006, p. 804). The data on the Deep Web are
    not accessible through static URL links. Instead, data are assembled into web
    pages where the online users can enter by using personal log in details or other
    types of authorisation to access the underlying databases and the Surface Web
    crawlers are prohibited from accessing these databases (Bin He et al., 2007, pp.
    95–96; Yar & Steinmetz, 2019, p. 10).


    Despite the Deep Web providing more security for the political actors when online,
    the Dark Web has predominately been used for secret communications and activities
    due to the protection offered on these spaces. The Dark Web is placed within the
    Deep Web. However, the access and the actual space differ from both the surface
    and the Deep Web. The Dark Web consists of a large number of unindexed information
    that is only accessible through the Onion Router (TOR) and the Invisible Internet
    Project (I2P), which hides the IP addresses of the online users (Lavorna, 2020,
    p. 141;'
