  md: 'robust, effective, and timely coordination among the different cybersecurity
    actors on national, regional, and international levels. Finally, the programme
    aims to increase access to knowledge about the threat and cybersecurity by the
    public, private, and civil society stakeholders and Internet users (OAS, 2020).
    Compared with the European region, this regional framework is developing, and
    more engagement from all actors is needed to lift the level of cybersecurity in
