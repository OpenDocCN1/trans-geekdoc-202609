- pgno: 21
  md: 'Unfortunately, the safety of these services is often prioritised over security
    (Price, 2021).


    Another essential part of the structure is CIIs, which provides the functions
    that enabled CI and CNI operations. CIIs are any form of physical or virtual information
    systems that control, process, transmit, receive, or store information (US DHS,
    2011, p. 10). CII is linked to the information structure, such as telecommunication,
    computer/software, the Internet, satellites, fibre optics, which allows the CIs
    to communicate and function due to their dependency on technologies and networks
    (Yar & Steinmetz, 2019, p. 91). CIIs’ physical infrastructure is entangled in
    a complex structure by its transnational and cross-sectoral relationships (Clemente,
    2013, p. 16). Attacking CII could significantly impact citizens’ health, safety,
    security, or economic well-being and the effective functioning of society (OECD,
    2008).


    Finally, ICTs are infrastructure and components facilitating computing, such as
    telecommunication devices and Internet-enabled and mobile devices. ICTs cover
    all devices, including networking components, applications, and systems that enable
    online users and organisations to interact in the online environment, such as
    the Internet, wireless networks, mobile phones, and other communication forms
    (TechTerms, 2020; UNESCO, 2020). The growing use and dependencies of ICT have
    also created problems and challenges for organisations, online users, and society
    as technological developments open up new attack routes.


    # THE RELATIONSHIP BETWEEN PUBLIC AND PRIVATE CI, CNI, CII, AND ICTS


    The CI sectors depend on each other and exist in an interdependent and interconnected
    environment determined by their functions, products, and services. These areas
    are linked to specific structure parts, such as physical, geographic, cyber, and
    logical interdependencies. These dependent areas could generate a domino effect
    if one CI is disrupted, damaged, or destroyed; the consequences would impact other
    services (Alcaraz & Zeadally, 2015).


    Societies’ reliance on global networks has led to new attack levels. Attackers
    persistently target vulnerabilities in CI structures allowing them to change electronically
    enabled systems and networks – or gain unauthorised access to systems to steal
    money, intellectual property, information, or disrupt CI control systems (Pratt,
    2019). Cyber–physical interactions within these different domains enable the possibilities
    for cross-domain attacks. For example, attackers can conduct an attack causing
    disruptions or damages to the physical domain or target the cyber domain. These
    two types of attacks can amplify the damage in an interlinked cyber–physical attack
    (Liu et al., 2017, p. 14). Vulnerabilities in the CI structures have been exposed
    during the COVID-19 pandemic, where several health facilities have been attacked.
    Of course, these attacks caused significant damage at a time, where societies
    relied on hospital services. Attacks had caused other facilities to close down,
    and they have impacted offline and online services. The ransomware'
  merge: -1
  img_proc: true
- pgno: 22
  md: 'attack against the American Universal Health Service facilities caused substantial
    disruptions. Hospitals were forced to use manual backups, redirect ambulances,
    and cancel or reschedule surgeries (CSIS, 2020; Newman, 2020).


    Critical infrastructure protection (CIP) has become an issue of strategic importance,
    and protection needs to be imposed on multiple levels. A high level of CIP is
    needed to protect CI systems and services early in the process. Every government
    and governmental actors and institutions worldwide are responsible for protecting
    those against natural disasters, terrorist activities, and cyberthreats. It is
    not only a governmental responsibility; public and private actors are engaged
    to ensure processes and practices are developed to ensure the reliability, performance,
    continuous operation, safety, maintenance, and protection of CIs (Alcaraz & Zeadally,
    2015; Forcepoint, 2020). The protection should be considered a cross-sectoral
    activity closely coordinated between multiple actors using a holistic approach.
    The multi-agency and cross-sectoral approach should be used rather than limit
    the protection to specific sectors (Alcaraz & Zeadally, 2015; EC, 2005; Munk,
    2015, p. 69).


    # Cyber Strategies and Security


    International and national governmental institutions have failed to develop a
    comprehensive definition of cybersecurity. According to the International Telecommunication
    Union (ITU), cybersecurity is


    > [T]he collection of tools, policies, security concepts, security safeguards,
    guidelines, risk management methods, actions, training, best practices, assurance
    and technologies that can be used to protect the cyber environment, as well as
    organisations’ and users’ assets.

    > (ITU, 2020; Munk, 2015, p. 47)


    Cybersecurity is the practice of protecting critical systems and sensitive information.
    Disparate technologies add to the complexity of securing vital interests, systems,
    and assets in a public and private context (Carr, 2016, p. 49; IBM, 2021). The
    core function of cybersecurity is to protect hardware, software, and data from
    cyberthreats, including various connected computer devices, infrastructures, applications,
    services, clouds, and telecommunication systems (Shea et al., 2021).


    Cybersecurity has been introduced to effectively control cyberspace and provide
    online users with a reliable, resilient, and trustworthy digital infrastructure.
    However, cyberspace is not secure and resilient in its current form. Several control
    mechanisms are missing, creating an absent, incomplete, or poorly designed structure,
    and it is often compared with the wild west of the digital era. Cyber professionals
    are managing cyberspace in a fragmented and differentiated way linked to isolated
    areas. One of the core problems is the lack of an overarching system to control
    cyberspace, the Internet, and online'
  merge: -1
  img_proc: true
- pgno: 23
  md: 'platforms as a whole (Bayuk et al., 2012, p. 1). Various practices and processes
    are imposed to prevent the misuse of computers or data where attackers target
    the integrity of computers, networks, or data to violate the intended state of
    data or systems, such as espionage or sabotage (Puyvelde & Brantly, 2019, pp.
    57–58). Most of the attacks used by politically motivated actors are based on
    malware designed to (Puyvelde & Brantly, 2019, p. 59).


    Currently, only a limited number of states have developed highly sophisticated
    cyberweapons and capabilities. These states have capacities and resources available
    that enable them to conduct large-scale multilayered attacks over a long period
    (HM Government, 2016, p. 18; Park & Walstrom, 2017). Other states are in the process
    of recognising the powers of cyberweapons by developing low-cost and high-impact
    weapons using the available capacities and capabilities. However, these weapons
    should not be underestimated as they can cause a significant impact on the targets.
    Yet, these states are in the process of producing sophisticated means and methods
    for more damaging large-scale attacks (HM Government, 2016, p. 18). States like
    North Korea and Iran are important cyber powers and have been behind significant
    attacks on foreign entities – just as other states have also targeted them.


    # Risk, Nodal Governance, and Complexity


    Whether a system is a physical facility or a collection of cyberspace components,
    the role of a security professional assigned to that system is to plan for potential
    attacks and prepare for its consequences (Bayuk, 2012, p. 1). Dissimilar to conventional
    territorial conflicts, the ability to develop and deploy various forms of malware
    is not limited to state actors. In online attacks, actors can range from cybercriminals,
    individual hackers, to terrorist organisations or online activists. All online
    users can create, reuse, or purchase cyber capabilities instrumental for conducting
    an attack (Munk, 2019; Puyvelde & Brantly, 2019, p. 60). Traditional political
    conflicts have primarily been linked to war and warfare or conventional terrorism.
    In cyber-conflicts, the groupings and the means and methods used are blurred,
    and there is no clear legal division between groups and actions (Guiora, 2017,
    p. 16)


    The attack forms are hybrid, interlinked with national and geopolitics, local
    conflicts or dissatisfaction with how incidents and problems are managed in the
    offline environment, and conflicts merging offline and online activities. The
    attack forms and motivations change depending on the attackers underlying agenda,
    i.e. personal, political, and economic gain; espionage; disruption; and destruction
    (Munk, 2015, p. 74). Assessing risks is a critical component in cybersecurity
    decision-making; these include risk assessments on the strategic, operational,
    and information system levels. Risk management is constantly ongoing, and the
    risk assessments are conducted through the whole life cycle from pre-system acquisition
    through the system acquisition, the maintenance of the system until it is retired
    (NIST, 2012, p. ix).'
