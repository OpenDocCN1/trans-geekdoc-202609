    # OTHER UN COLLABORATIONS TO DEVELOP CYBERSECURITY


    Developing processes and practices within the UN framework is complicated. There
    are persisting disagreements between the member states on applying existing international
    law rules to the online environment. Some states have been slow in implementing
    the recommended norms of state behaviour. They lack the capabilities and resources
    to adopt the recommended norms and confidence-building, such as establishing national
    structures and mechanisms required to enhance security and respond to the different
    cyber risks. There is also a lack of awareness of the various normative processes
    developed within and outside the UN framework to enhance peace and security. The
    continuing distrust among states and various stakeholders spills over to the cybersecurity
    framework, undermining the development of global cybersecurity strategies (UNIDIR,
    2017, p. 2).


    China, Russia, Tajikistan, and Uzbekistan submitted in September 2011 a ‘Draft
    Convention on International Information Security’ at the 69th session of the UN
