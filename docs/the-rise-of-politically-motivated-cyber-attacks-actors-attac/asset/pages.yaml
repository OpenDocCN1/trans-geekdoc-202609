  img_proc: true
- pgno: 258
  md: 'Second, the number of attacks on CIs has demonstrated that the resilience and
    preparedness of these vital structures and services are not fully developed to
    withstand the attacks. This calls for closer cooperation between public and private
    entities to develop a cybersecurity framework and standards that can minimise
    the payoff for the attackers.


    # The Actors


    The overarching research objective was to investigate whether a clear conceptualisation
    of the area is useful beyond the traditional fragmented definitions and legislative
    framework. The research revealed that there are several politically motivated
    actors and formations. However, these activities and grouping have been considered
    in the realm of offline offences for a long time. There are areas within the current
    classifications that make this area challenging. It would be helpful to rethink
    the whole area and create distinct classifications outside the laws of war, counter-terrorism,
    and cybercrime legislation.


    There is a problem with categorising the attacks and attackers, when the attackers
    are considered in isolation using offline conventions, norms, and legislation
    to identify and prosecute the actors. The different areas outlined in the table
    should be reconsidered to enhance cybersecurity and impose costs on the actors.
    Managing cyber attacks is a constant process; the attacks are getting more complex
    and require more comprehensive responses. Different initiatives should be launched;
    developing a regulatory framework is just one of many initiatives included in
    a multilayered approach (Galen, 2021).


