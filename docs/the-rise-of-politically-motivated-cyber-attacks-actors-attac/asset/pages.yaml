- pgno: 232
  md: '# Third Activism Wave


    # GEN Z AND K-POP STANS


    Gen Z members are a more racially and ethically diverse group than previous generations,
    such as baby boomers, Gen-X, and millennials. They are also digital natives with
    little memory of a time before the smartphone (Parker & Igelnik, 2020). The K-pop
    fanbase, the stans, is operating in the same field as the Gen Z TikTokers. Both
    groups show a growing political awareness across different interest areas. The
    groups operate within the legal framework; their means and methods innovatively
    explore technologies exploration and communication platforms to carry out their
    activities. The K-pop fan culture developed from the mid-1990s export-oriented
    popular South Korean music. The music scene relied heavily on Internet and social
    media exposure and a strategy to cultivate fandom. Since the early days of this
    K-pop culture, fans have been engaged in online discussion groups, forums, and
    chat rooms related to Asian popular music. Members communicated intensively based
    on their musical interests and knowledge of K-pop (Bedingfield, 2020; Park, 2020).
    The early K-pop fanbase was the young Asian diaspora. However, the notion of K-pop
    spread fast to other communities of young people of colour who did not feel represented
    in the American mainstream culture (Ohlheiser, 2020a). K-pop fans and Gen Z are
    used to dominate the online conversation and embrace an online environment contrary
    to older generations. K-pop fans have been instrumental in propelling their favourite
    artist into stardom is based on a group tactic to manipulate the metrics on social
    media in a way that they resemble a bot (Ohlheiser, 2020a).


    The K-pop stan has been written off by online activist groups as screaming, tedious
    young airheads who have created toxic fanbase siloes. However, these kinds of
    negative assumptions have united the groups, for example, in their actions related
    to BLM. The various stan groups are passionate about all types of political activism.
    A part of their motivation and engagement is linked to the ability to express
    themselves and be themselves (Koo, 2020). The political and social engagement
    of the communities are unexpected as some of the fans are attracted to the culture
    being apolitical, fantastical, and removed from home politics and American hegemony.
    However, not all fans are engaged in these causes, and there is also space to
    be fans and have fun (Bedingfield, 2020). Those who protested against the US President
    Trump during the US election might not be involved in future actions; all actions
    are linked to the teens’ personal experience (Ohlheiser, 2020b). The social and
    politically active fractions with the K-pop fanbase see themselves as people affected
    by political decisions, and they are humans before being fans. The fanbase has
    a platform and the numbers to make a difference (Bedingfield, 2020). The groups
    should not be seen as monolithic. The groupings have a long history of creating
    online communities as a safe space for themselves – a space where they set up
    their own rules with a very intimate affinity with people worldwide (Bedingfield,
    2020; Koo, 2020).'
  merge: -1
  img_proc: true
- pgno: 233
  md: 'APT-69420 Arson Cats are a relatively new group that has emerged in the ashes
    of Anonymous. Not much has been published about the group, but it has already
    gained notorious status within a short period. Contrary to the K-pop and Gen Z
    activities, they are also operating illegally, and their actions can be traced
    back to 2019. According to the group''s spokesperson, Kottmann, the group is motivated
    by the spirit of activism used to expose the poor security work of corporations
    before malicious actors do more damage. In this context, they frame themselves
    as grey hat hackers by doing the companies a favour before the real black hat
    hackers can exploit the vulnerabilities. However, the group does not hide their
    dislike for the law and corporate powers. They oppose the concept of intellectual
    property and how it limits online users understanding of the online systems integrated
    into everyday life (Reuters, 2021).


    The group did not hack themselves, but they found source code repositories through
    GitLab, Bitbucket Git servers, and SonarQube source code management apps. However,
    instead of handing over the information to authorities or notified the companies,
    the group connected to the exposed applications and downloaded the intellectual
    property material, which was later uploaded on Git.rip (Cimpanu, 2021; Clayton
    Rice Q.C., 2021). Although the group did not always contact the companies before
    exposing the material, they claim they tried to prevent the exposure from harming
    companies when the information was released (Vincent, 2021a).


    # DDOSECRETS


    DDoSecrets follows in the pathway of WikiLeaks. DDoSecrets is different in how
    they obtain the information. Some data were collected on the Dark Web, published
    by ransomware groups. The argument is that some of the dumped data available deserve
    to be scrutinised as they inform the public about bad practices by some actors
    (DarkReading, 2021; Greenberg, 2021). Yet, the practice opens up some ethical
    questions. Data on the Dark Web have already been released. However, the exposure
    of company information has a devastating effect that the release and the double
    exposure will amplify. The data leaks might encourage the ransomware groups as
    they can use these exposures to threaten the victims. This type of data would
    only be visible on the Dark Web for a short period. However, this group preserves
    these data sets allowing them to stay exposed in the public view. Over time, DDoSecrets
    would become the only publisher of the data (DarkReading, 2021; Greenberg, 2021).
    However, this is not the only way the group get data. Anonymous provided data
    for the BlueLeaks dump in 2020, and DDoSecrets has also obtained data about Gab,
    the extreme far-right and racial social network launched in 2017. The group claimed
    no responsibility for the hack, claiming they only reported and distributed information
    to journalists and researchers (Bradbury, 2021; Cimpanu, 2020).'
  merge: -1
  img_proc: true
- pgno: 234
