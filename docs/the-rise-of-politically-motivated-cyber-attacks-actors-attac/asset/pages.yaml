    # STATES


    The attacks are conducted as a part of a broader political agenda. Contrary to
    personal and financial cybercrime, there is a link to political ideologies incorporated
    in the motivations. Some are stronger than others. There are state and non-state
    actors involved in these actions. Sometimes, the political link is not visible,
    but it is possible to see how the attacks fit the state and non-state actors''
    strategies by analysing them. For state actors, their actions are linked to their
    political, military, and economic plans. Most of them are pursuing particular
    long-term plans, where one is to become a leading cyber power and ensure that
    the state thrives politically and financially. For example, the actions of China
    align with the ''Made in China 2025'' plan (UNIDIR, 2020a). Like the US, there
    is an incitement to be a world power on multiple levels, political, military,
    and fiscal, which aligns with the developed cybersecurity strategies (Chapter
    4) (UNIDIR, 2020c). Similar to China, the US wants to be a leading cyber power.
    Russia is following the same agenda by cementing its geopolitical status and becoming
    less reliant on foreign technology (UNIDIR, 2020b). In comparison, North Korea
    is different as it increased its cyber capabilities and capacities to strengthen
    its military reputation and the state''s survival (Casear, 2021).


    In contrast to offline warfare, online warfare does not require massive investments
    in weapons. Moreover, the attackers do not need expensive investments to conduct
    attacks; good computing skills, software, and understanding of the target victim
    are enough to launch a powerful attack (Barletta et al., 2011, p. 80). In the
    offline environment, economic strength and high military capabilities create an
    unbalanced relationship in the bargain situation between states. These factors
    are less influential with cyberconflicts.'
