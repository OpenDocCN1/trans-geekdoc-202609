    线性回归模型 [26] 在模型参数方面具有线性预测器，易于解释且预测速度快。然而，这些模型受限形式较高，意味着与其他模型相比，它们通常具有较低的预测准确性。Regression
    Learner 应用使用 fitlm 函数来训练线性模型选项。


    回归树 [26] 易于解释，拟合和预测速度快，且内存占用低。Matlab App Regression Learner 提供了选择不同类型回归树的可能性。在本工作中，选择了精细树选项，这意味着高灵活性，带有许多小叶子的高度灵活响应函数（最小叶子大小为
    4）。Regression Learner 应用使用 fitrtree 函数来训练回归树，参数最小叶子大小等于 4，且没有代理节点的分割标准。集成提升树模型将许多弱学习者的结果组合成一个高质量的集成模型。该方法涉及使用回归树学习者的最小二乘提升方法
    [26]。Regression Learner 应用使用 fitrensemble 函数来训练集成模型，并提供设置三个不同参数的可能性：最小叶子大小、学习者数量和学习率，分别为
    8、30 和 0.1。另一种带有回归树学习者的集成模型是袋装树 [26]。Regression Learner 应用使用 fitrensemble 函数来训练集成模型。在这里需要设置两个参数：最小叶子大小和学习者数量，分别为
    8 和 30。支持向量机是监督学习方法，既用于分类也用于回归 [26]。支持向量机方法的优势在于，它在高维空间以及维度数量大于样本数量的情况下效果显著。Regression
    Learner 应用使用 fitrsvm 函数来训练 SVM 回归模型，在此情况下，参数内核函数设置为 Linear。


