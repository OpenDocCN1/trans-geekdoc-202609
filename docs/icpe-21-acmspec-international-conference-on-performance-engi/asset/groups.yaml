    与其他方法相比。为了选出最重要的特征，引入了一个选择准则，如第 3.1 节所述。从图 3 值得注意的是，两个特征主导了其他特征。这两个特征与代码的动态执行相关。为了引入与静态代码分析相关的特征，我们决定移除
    "已执行的汇编指令" 和 "已执行的 C 指令" 特征，并再次将选择准则应用于其余特征。实心红线表示未计算这两个主导特征的平均值。由于图 3 中一些特征接近实心红线，我们纳入了平均分数值在
    99% 置信区间（即虚线）内的特征，排除所有低于低置信区间值的特征。


    测试在数据集的 20% 上进行。图 5 显示了部分处理器的均方根百分比误差（RMSPE）结果。在每个图中，可以区分各种数据聚合类型下每个 ML 预测模型的行为：按功能、按数据类型、总数据集测试（All）。如预测值与实际值图中所述，Fine
    Tree 是表现最佳的 ML 模型，因为其 RMSPE 值在全球范围内低于所有其他 ML 模型。值得注意的是，在 LEON3 和 8051 场景中，预测器的
    RMSPE 始终低于 10%，而相同设备的 FT 和 BAT 通常低于 1%。仅有一个例外，即 8051，其中 int8 场景受 bubblesort 函数严重影响（可能与某些数据集噪声相关）。ATmega328/P
    的结果是最差的场景，因为对于 BAT 和 FT，误差始终在 $\ge 10^0$ 和 $\le 10^1$ 之间，而对于 BOT、LR 和 SVM，误差在
    $\ge 10^1$。关于 RMSE，误差方差范围从 $10^2$ 到 $10^4$。对于 ATmega328/P，误差范围转移到 $10^3$ 到 $10^5$。


    ![](img/3d5eeadc89f753024038ef5128f4a19a_4_0.png)


    图 3：特征分析（X 轴表示 0 到 1 的百分比得分）。


    相对于每个回归算法，随机森林回归器的方差为 0.0210，极端树回归器的方差为 0.0169，梯度提升回归器的方差为 0.0202，AdaBoost 回归器的方差为
    0.0188。最突出的值属于随机森林回归器，而考虑所有回归器时，特征 GLOBAL VARIABLES 的方差大于其他特征。


    总体而言，从以下分析可以得出：SVM 不太适合该问题，且具有最差的总体 RMSPE，可能是因为与特征相关的数据较多。Boosted Trees 和 Bagged
    Trees 可以被认为是可接受的。不过，它们需要对模型的输入参数进行优化，尤其是 BAT，如果我们查看图 4 的话。线性模型适合预测，但在 RMSE 上有波动，这正如预期。最佳
    ML 模型是 Fine Tree，它在预测和 RMSPE 方面表现最佳。此外，后者还可以通过进一步修改模型的输入参数来改进。


    作为最终分析，图 6 报告了考虑 8051 处理器的平均预测时间（图 a）以及五个 ML 模型对每个处理器的平均训练时间（图 b）。每个选定处理器的平均预测时间行为相同。最佳性能属于
    Bagged Trees，而 SVM 仍然表现出更差的执行时序行为。了解每个模型的执行时间对于理解模型在训练和预测阶段的速度至关重要，考虑到 ESL 场景中需要多次执行模型预测。关于训练时间，BAT
    和 BOT 是最快的，低于 5 s，LR 和 FT 约为 10 s，而 SVM 执行时间最慢，超过 2 h。


    ## 4.2 机器学习训练与测试结果


    一旦为每个处理器的数据集消除了不太重要的特征，前一段中列出的 ML 算法就被训练，以定义一个能够预测输出性能变量（即时钟周期）的模型。训练和测试基准中的 15
    个函数生成的数据集，对于每个处理器被分为 80% 用于训练和 20% 用于测试。训练过程后，图 4 报告了部分设备和训练好的 ML 模型的预测值与实际值。FT
    在每个设备上的预测与实际值之间的良好一致性显而易见。此外，LR 和 SVM 表现良好，至少对于 8051 和 LEON3 而言。另一方面，BAT 对每个设备都提供了糟糕的结果。ATmega328/P
    设备对于除 FT 外的每个预测器都表现不佳。


    ## 4.3 验证


    本段介绍了五个 ML 模型的验证。图 7 报告了 8051 和 ATmega328/P 的 RMSPE。尽管如此，仍可以看到决策树（FT）和集成模型（BAT
    和 BOT）表现良好，而线性模型和 SVM 的百分比值却极高。关于 FT、BOT 和 BAT，可以注意到，考虑不同处理器时，FT 是最佳的。对于 8051，这三个最佳模型的
    RMSPE 均低于 10%。FT 低于 3%（数值低于 1%），BOT 低于 7%（误差范围大于 FT 场景），而 BAT 在 1% 到 10% 之间。对于
    LEON3，FT、BOT 和 BAT 相似，在 9% 到 70% 之间变化。最后，唯一始终低于 60% 的模型是 ATmega328/P 的 FT，范围从
    1% 到 60%，平均误差约为 20%。


    平均时间预测分析显示与原始训练数据集相同的行为，将 BAT 置为最佳，而


    ![](img/3d5eeadc89f753024038ef5128f4a19a_5_0.png)


    ![](img/3d5eeadc89f753024038ef5128f4a19a_5_1.png)


    ![](img/3d5eeadc89f753024038ef5128f4a19a_5_2.png)


    SVM 从时序性能角度来看是最差的。验证数据集的预测时间与前面段落中考虑的时间相似，而方差以 ms - μs 为单位，如图 8 所示。


    ## 4.4 讨论


    回答 RQ1：所考虑的"有意义"的时序性能指标是嵌入式软件执行时间（即时钟周期）[11]。可以使用本文提出的方法来预测该指标。其思路是使用 ML 技术代替


    仿真器/模拟器。这一想法是合理的，因为我们观察到时钟周期、C 语句和已执行的汇编指令之间存在相当高的相关性，如图 2 和表 3 所示。尽管表中显示的相关性较高，但
    LEON3 和 ATmega328/P 分别对 float 和 int8 表现出较低的相关值，这可能导致预测错误。对于 8051，float 数据类型的最低相关值取决于微控制器的内部架构（即由于缺少浮点单元）。采用所提
    ML 方法会导致特征选择问题（即找出最重要的特征


    ![](img/3d5eeadc89f753024038ef5128f4a19a_6_0.png)


    ![](img/3d5eeadc89f753024038ef5128f4a19a_6_1.png)


    仅考虑软件代码）。从图 3 可知，对预测模型起主要贡献的最重要特征是 "已执行的汇编指令（Assembly Instructions）" 和 "已执行的 C
    指令（C Instructions）"。仅考虑的环路复杂度参数是 ASSIGNMENT 和 GLOBAL VARIABLES，它们取决于输入数据类型。停止复杂度参数、输入数据类型和
    SLOC 几乎全部包含在内，而功能可达性参数（COVERAGE 和 TOTAL FUNCTIONS）未达到所考虑的阈值。最低得分特征是 POINTER DEREFERENCING，因为所考虑的基准中没有太多取指针引用运算符。


    ![](img/3d5eeadc89f753024038ef5128f4a19a_6_2.png)


    图 7：不同处理器的验证误差。


    ![](img/3d5eeadc89f753024038ef5128f4a19a_6_3.png)


    图 8：不同处理器技术和验证数据集的预测时间。


    回答 RQ2：有必要利用多种 ML 算法并对其进行分析，以使用 ML 减少估计时间并提高准确性。关于图 4，我们可以注意到基于回归树方法的模型表现优于其他模型。同样的行为也出现在图
    5（训练和测试）和图 7（验证）中报告的图表中。8051 在 RMSPE 方面表现出最佳的预测行为。对于训练和测试，FT、BOT 和 BAT 均低于 1%，而对于
    8051 时序性能预测的验证误差范围在 1% 到 10% 之间。这些较低的误差取决于 8051 微控制器架构（即 8 位）、指令集（即 MCS-51 CISC）和有限的寄存器大小（即
    8 位）。对于 ATmega328/P，尽管架构和寄存器大小与 8051 相同，但不同的指令集（即 RISC）导致我们出现较高的误差，原因是编译步骤后处理大量汇编行的微代码指令数量减少。LEON3
    在训练和测试方面表现良好（即所有预测模型的误差均低于 1%），但在验证方面表现较差（即高于 60%），与 ATmega328/P 相比（即 FT 场景下的误差低于
    1%）。这种误差取决于 LEON3 更复杂的处理器架构（即具有 7 级流水线的 32 位）。图 6 和图 8 展示了训练、测试和验证的预测时间，所有结果在时间粒度方面都保持一致。最快的预测模型是
    BOT，其次是 BAT 和 FT，这表明这三个模型在估计和训练时间方面是最好的，并且未来工作可以对其进行改进。这种方法似乎足以回答 RQ2，如 [15] 中所述。关于
    [15] 的结果，表 4 展示了两种不同方法（[15] 使用神经网络，我们的工作使用 FT）之间的比较。FT 的估计误差低于其他测试场景方法，而 LEON3
    和 ATmega328/P 在验证场景中表现较差。另外，如图 6 所示，估计时间也比 [15] 慢。未来工作将继续通过优化 ML 参数和算法来改进此策略。


    ## 5 结论


    本文提出了一种基于 ML 的方法，用于预测嵌入式处理器的时序性能。模块化框架帮助设计师提取静态和动态代码信息，随后由下一个 ML 模块用于推测所选嵌入式处理器的时序性能。结果表明，所提方法

    '
