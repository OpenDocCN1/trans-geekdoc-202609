    ### 表 4：估算误差比较。


    | 处理器 | 最大误差 | 平均误差 | 标准差 |

    |---|---|---|---|

    | ARM946 测试 [15] | 29.75% | 9.05% | 8.90% |

    | 8051 测试 | 0.61% | 0.42% | 0.12% |

    | ATmega328/P 测试 | 6.03% | 2.24% | 1.48% |

    | LEON3 测试 | 0.29% | 0.07% | 0.06% |

    | ARM946 验证 [15] | N.A. | N.A. | N.A. |

    | 8051 验证 | 2.58% | 1.19% | 0.69% |

    | ATmega328/P 验证 | 65.39% | 12.58% | 17.79% |

    | LEON3 验证 | 73.74% | 52.02% | 21.36% |


    足以预测 CISC 微控制器的时序行为。同时，将此方法用于更复杂的处理器会引入可通过更先进的 ML 技术降低的估算误差。未来工作将研究 (1) 通过引入能够不仅表征输入数据类型，还能表征输入特定值的指标和特征来增加特征总数的可能性
    (2) 模型预测参数优化（即，树集群和回归树的最小叶子大小和学习者数量，SVM 的核函数等）；(3) 过拟合问题（例如，LEON3 场景）及使用交叉验证来解决这些问题，(4)
    分析多种不同于本工作所考虑的回归模型的可能性，同时也考虑将神经网络作为一种具体且有用的 ML 算法替代方案，(5) 使用所提方法表征给定处理器上 SW 监控系统的影响
    [31]，(6) 将此方法应用于其他领域（即，网络物理系统、SW Computer 性能等）的可能性 [32]。


