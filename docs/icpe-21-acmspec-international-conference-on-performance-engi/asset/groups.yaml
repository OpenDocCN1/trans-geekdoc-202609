    RISC 软微处理器，模拟系统时钟为 75 MHz。Cobham Gaisler 提供 TSIM 系统模拟器作为 LEON3 处理器的精确 ISS，配合 gcc
    编译器（在本工作中，使用了默认优化标志 -O0）；Intel 8051 微控制器，一种具有 MCS-51 CISC 指令集和哈佛架构的 8 位微控制器；The
    Dalton Instruction Set Simulator (ISS) [27] 已用于模拟为 8051 编写的程序并收集统计数据，配合 SDCC (Small
    Device C Compiler) 编译器；picoPower CMOS 8 位 AVR ATmega328/P，具有基于 8 位 RISC 的处理器内核和哈佛架构。SimulAVR
