    # 3.2 Machine Learning Techniques


    The ML techniques considered, among the most used in literature [22, 23], range
    from regression trees to SVM, and linear regressors, with the aim to identify
    which of these can better predict the timing performance metric. At this stage
    of the work, the Matlab App Regression Learner [24] has been used. In particular,
    we considered five ML methodology, according to those available: Linear Regression
    (LR), Fine Trees (FT), Boosted Trees (BOT), Bagged Trees (BAT) and Support Vector
    Machine (SVM). We excluded Neural Network Algorithm’s usage since we plan to dedicate
    a specific work in future time so as not to burden the discussion in this paper
    [25]. Furthermore, this analysis involves the usage of a different Matlab package.


    Linear regression models [26] have predictors linear in the model parameters and
    are easy to interpret and fast for making predictions. However, the highly constrained
    form of these models means that they often have low predictive accuracy compared
    to the others. Regression Learner App uses the fitlm function to train Linear


    model option. Regression trees [26] are easy to interpret, fast for fitting and
    prediction, and low in memory usage. The Matlab App Regression Learner gives the
    possibility to choose among different kinds of regression trees. In this work,
    the Fine Tree option was selected, which means high flexibility, with many small
    leaves for a highly flexible response function (the minimum leaf size is 4). The
    Regression Learner App uses the fitrtree function to train regression trees, with
    the parameter Minimum leaf size equal to 4 and no splitting criteria for surrogate
    nodes. Ensemble Boosted Tree model combine results from many weak learners into
    one high-quality ensemble model. The approach involves a least-squares boosting
    methodology with regression tree learners [26]. Regression Learner App uses the
    fitrensemble function to train ensemble models and gives the possibility to set
    three different parameters: the Minimum leaf size, the Number of learners and
    the Learning rate, which are respectively 8, 30 and 0.1. Another kind of ensemble
    model with regression tree learners is the Bagged Trees [26]. Regression Learner
    App uses the fitrensemble function to train ensemble models. Here the parameter
    to set are two: the Minimum leaf size and the Number of learners, which are respectively
    8 and 30. Support vector machines are supervised learning methods used both for
    classification'
