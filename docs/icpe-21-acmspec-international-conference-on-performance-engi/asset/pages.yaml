    # 4.2 Machine Learning Training and Test Results


    Once the less significant features were eliminated from the dataset for each processor,
    the ML algorithms listed in the previous paragraph were trained to define a model
    capable of predicting the output performance variable, i.e., the Clock Cycles.
    The dataset generated from the 15 functions inside the training and test benchmark
    is divided into 80% for training and 20% for testing for each processor. After
    the training process, in Fig. 4 are reported the prediction values Vs. the real
    values for a subset of devices and ML models trained. The good agreement between
    prediction and real values for FT in each device is evident. Also, the LR and
    SVM behave well, at least for 8051 and LEON3. The BAT, on the other hand, provides
    bad results for each device. The ATmega328/P device badly behaves for every predictor
    except for the FT.


    # 4.3 Validation


    In this paragraph, the validation of the five ML models is presented. Fig. 7 report
    the RMSPE for 8051 and ATmega328/P. Still, it is possible to see a good behavior
    of the decision tree (FT) and ensemble models (BAT and BOT), unlike the Linear
    and SVM, which have extremely high percentage values. Regarding FT, BOT, and BAT,
    it is possible to notice that FT is the best considering the different processors.
    For the 8051, all the three best models are under the 10% of RMSPE. FT is under
    the 3% (with values below 1%), BOT is under 7% (with an error range greater than
    the FT scenario), while BAT is between 1% and 10%. For the LEON3, FT, BOT, and
    BAT are similar, varying between 9% and 70%. Finally, the unique model that is
    always under 60% is the FT for the ATmega328/P, ranging from 1% to 60%, with an
    average error of about 20%.


