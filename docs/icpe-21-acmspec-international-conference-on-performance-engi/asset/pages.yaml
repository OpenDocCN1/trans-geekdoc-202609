    Answer to RQ2: It is necessary to exploit several ML algorithms and analyze them
    to reduce estimation time and increase accuracy using ML. Regarding the Fig. 4,
    we can notice that the models based on the regression trees approach behaves better
    than the other ones. The same behaviour is also present in the plots reported
