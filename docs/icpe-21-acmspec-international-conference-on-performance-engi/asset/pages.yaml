    test (i.e., all the prediction models have errors lower than 1%), but worst for
    validation (i.e., higher than 60%), compared to ATmega328/P (i.e., errors lower
    than 1% for the FT scenario). This error depends on LEON3''s more complex processor
    architecture (i.e., 32 bit with 7 stage pipeline). Fig. 6 and Fig. 8 present the
    training, test, and validation prediction time, where all the results are aligned
    in terms of time granularity. The fast prediction model is the BOT, followed by
    BAT and FT, and it shows that these three models are the best in estimation and
    training time, and they can be improved in future works. This approach seems to
    be good enough to answer to RQ2 as presented in [15]. Concerning the results in
    [15], Table 4 present a comparison between the two different approaches (Neural
    Network for [15], FT for our work). The FT estimation error is lower than the
    other test scenario approach, while LEON3 and ATmega328/P behave worst in the
    validation scenario. Also the estimation time is slower than [15], as shown in
    Fig. 6. Future works will continue to refine this strategy working on ML parameters
    and algorithms.


    # 5 CONCLUSION


    This work presented an ML-based approach to predict the timing performance of
    embedded processors. The modular framework helps the designer extracting static
    and dynamic code information, used by the next ML module to guess selected embedded
    processors’ timing performance. The results show that the proposed approach'
