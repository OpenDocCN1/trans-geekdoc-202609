- pgno: 1
  md: 'work in [13] presents two approaches to solve the performance estimation problem:
    (1) a source-based approach that uses compilation onto a virtual instruction set,
    and (2) an object-based approach that translates the assembly generated by the
    target compiler for “assembly-level”. Brandolese et Al. [5] introduce a methodology
    for software execution time estimation. The procedure is supported by mathematical
    models of C statements and statistical analysis. Alterbernd et Al. [6] introduce
    an approach to predict the execution time of software through an early, source-level
    timing analysis. The estimation is done directly from the source code, without
    compiling and running it, using a set of virtual instructions, and defining an
    abstract machine able to execute the source code. Finally, [14] introduces an
    approach to source-level timing estimation through elementary operations. Most
    of these works aim to predict timing performance behaviors using time-consuming
    but quite accurate simulators, mathematical prediction models at the system-level,
    or virtual platform emulators.


    In contrast, timing prediction approaches based on ML techniques are the newest
    methods exploiting big training data-set to make predictions without knowledge
    of the considered HW platform. Oyamada et Al. [15] presents a methodology for
    system design and performance analysis. They use an analytic approach based on
    neural networks for high-level software performance estimation. The analytical
    estimation results in errors only up to 29.75%, with an estimated time of about
    17 seconds. The work in [16] extracts performances of a small set of computers.
    It uses this information to develop linear regression and neural network models
    to predict any different considered computer’s performance. They can predict the
    performance of regarded platforms within 3.4% average error rate. Huang et Al.
    [17] propose the SPORE (Sparse Polynomial REgression) methodology to build prediction
    models of program performance using feature data collected from program execution
    on sample inputs, with relative error less than 7%. Finally, the paper in [18]
    proposes a method through performing data mining on historical data. The authors
    suggest performing timing prediction using three ML techniques (i.e., Naive Bayes,
    Logistic Regression, and Random Forests). These works confirms the validity of
    ML and data mining in general and the use of these techniques in particular for
    software estimation. Table 1 compares the different approaches, w.r.t. ML techniques
    and results. Furthermore, to the best of our knowledge, very few research works
    exploit these techniques for embedded system timing performance estimation, mostly
    for the low accuracy of these techniques. Our work tries to solve this open research
    problem.


    # 3 PROPOSED APPROACH


    The approach proposed in this work performs statement-level execution time estimation
    using statistical analysis and approximate predictions, as shown in Fig. 1. The
    idea behind this approach is to train the ML model, using (micro-)benchmarks,
    so that it can predict the performance for any given input C-code function for
    a given target processor. Compiler and program analysis tools are exploited to
    extract data for this goal on different real embedded devices. The ML module uses
    this data to solve the timing performance prediction problem. The whole framework
    is divided into three macro-blocks: (a) Input Generator Block, where the selected


    functions take several inputs randomly generated inside module ①. (b) Parallel
    Independent Block, where three sub-modules can be executed independently from
    each other. Module ② uses Gcov program to extract dynamic information about executed
    C statements; module ③ performs Instruction Set Simulator (ISS) execution, with
    the collection of clock cycles needed to execute the benchmark function set; module
    ④ implements static analysis, where Frama-C [19] is used to enlarge the dataset
    with static function parameters useful for the ML algorithm. (c) Machine Learning
    Block, the core of the estimation method.


    A module that (semi)automatically generates inputs for the benchmark functions
    has been created in ①. In particular, for each function they are randomly generated
    1000 input data sets. Moreover, for each function, different data types have been
    considered (i.e. int8, int16, int32, and float) to analyze the results w.r.t.
    the internal architecture of the considered processor. Each input data set is
    stored in a header file to be included in the function at compile time. After
    the inputs generation phase, a procedure to count the number of executed C statements
    is evaluated in ②. This value is obtained by performing a profiling of the benchmark
    functions employing the gcov profiler for each generated input. To obtain the
    total number of executed C statements for each function, a sum of the single profiling
    numbers is performed. The number of clock cycles needed by the target processor
    technology to execute each function (for each generated input) in the benchmark
    (and the number of executed assembly instructions, useful for energy/power analysis)
    is extracted in ③. Depending on the target processor technology there is the need
    for an Instruction Set Simulator (ISS) or an High Level Synthesis (HLS) Simulator
    for Special Purpose Processors (SPP). The latter is not part of this work. The
    last data are evaluated using Frama-C tool and other useful script in ④, integrated
    inside the whole framework instance. Finally, all the generated data output artifacts
    are sent to ⑤ where the information is organized, selected and exploited for model
    training, test and validation, as described below.


    # 3.1 Dataset Preparation and Feature Extraction


    In this paper, several features have been chosen to provide a statistical analysis
    of collected data (i.e., distribution parameters). Several Python scripts have
    been created to automate all CSV file’s statistical analysis, integrated into
    the last framework module ⑤. To guarantee unbiased data and correct ML training
    activities, feature analysis is applied to the output framework dataset (i.e.,
    33 features) that can be clustered w.r.t. the number of code line (SLOC), input
    data type, Halstead Complexity, Cyclomatic Complexity, functions reachability
    and program profiling, as described in [20]. Once the dataset is created, four
    regressor models are considered in order to perform the feature analysis, taking
    inspiration from [21]. In particular, we considered the Random Forest Regressor,
    Extra Trees Regressor, Gradient Boosting Regressor and Ada Boost Regressor, exploiting
    the python scikit-learn package. The average value of the previous results [21],
    reduced by the confidence interval value of 99%, has been used as the lower bound
    to select the most important features. After the feature analysis process, the
    most significant features will be taken into consideration. ML algorithms will
