  md: '# Statement-Level Timing Estimation for Embedded System Design Using Machine
    Learning Techniques


    Vittoriano Mutillo, Paolo Giammatteo, Vincenzo Stoico

    DEWS Centre of Excellence, University of L''Aquila, L''Aquila, Italy

    {vittoriano.mutillo,paolo.giammatteo}@univaq.it,vincenzo.stoico@graduate.univaq.it


    # ABSTRACT


    During the initial design phases of an embedded system, the ability to support
    designers using metrics, obtained through a preliminary analysis, is of fundamental
    importance. Knowing which initial parameters of the embedded system (HW or SW)
    influence such metrics is even more important. The main characteristic of an embedded
    system that typically designers need to measure is the embedded SW (i.e., functions)
    execution time, used to describe the final system’s performance (i.e., timing
    performance metric). The evaluation of such a metric is often a critical task,
    relying on several different techniques at different abstraction levels. Furthermore,
    in the era of Big Data, the use of Machine Learning methods can be a valid alternative
    to the classic methods used to evaluate or estimate metrics for temporal performance.
    In such a context, this paper describes a framework, based on the use of Machine
    Learning methods, to calculate a statement-level embedded software timing performance
    metric. Results are compared with those obtained with different approaches. They
    show that the proposed method improves the estimation accuracy for specific processor
    classes while also reducing estimation time.


    # CCS CONCEPTS


    +   • Computer systems organization → Embedded systems; Embedded hardware.


    # KEYWORDS


    timing performance prediction, machine learning, embedded system, feature analysis


    # 1 INTRODUCTION


    In the last thirty years there has been an exponential increase in the spread
    and evolution of information technology. In this regard, it is undoubtedly underlined
    the spiraling of Embedded systems [1]. The problem of determining an embedded
    system’s characteristic is a task with an effort that should not be underestimated,
    especially during the early design phases. Indeed, working on a higher abstraction
    level (i.e., Electronic System-Level, ESL) is needed to early estimate HW/SW performance
    [2]. Furthermore, in the era of Big Data, the use of Machine Learning (ML) methods
    [3, 4]


    in this context can be a valid alternative to the classic methods to estimate
    metrics for embedded system performance [5–7]. So, according to this scenario,
    this work tries to answer the following research questions:


    (1) RQ1: How to extrapolate a meaningful timing performance metric for Embedded
    platforms without Instruction Set Simulators (ISSs) or the target device, which
    is time consuming?

    (2) RQ2: How to reduce estimation time and increase accuracy for embedded timing
    software performance predictions using Machine Learning techniques?


    RQ1 relies on the considered timing performance metric extraction [8], and the
    use of ISS instead of the final HW/SW embedded platforms can reduce the time needed
    for estimation step, depending on the simulator accuracy. RQ2 considers to replace
    ISS or selected HW/SW platforms with ML algorithms to reduce design time and increase
    accuracy w.r.t. the traditional approaches.


    Thus, this work presents an approach for timing performance estimation. The aim
    is to extract information about the main practice used in system-level design
    flows in order to reduce the time needed for the initial activities, reducing
    also estimation errors without out an extensive and deep analysis of the final
    hardware/software platforms. A timing performance metric related to high-level
    C programming language statements will be exploited, as presented in [9]. In addition,
    a framework that helps to calculate this metric for a given function will be presented.
    Additionally, this framework can automatically generate large amounts of constrained
    random inputs and evaluate statistics on the metric itself. The framework exploits
    ISSs to evaluate several features from the source code, while static code analysis
    is used to enrich the dataset. The number of clock cycles needed to execute the
    program, the number of executed C statements with profiling on the host architecture,
    the Cyclomatic and Healsted number are a subset of the considered features selected
    for the following ML activity. These big data have been analyzed through several
    statistical methods, and useful results encourage exploiting this statistical
    approach inside an ESL design flow.


    # 2 PRELIMINARIES


    In the context of Embedded System Design [1], some of the main challenges are
    related to accuracy and simulation/estimation time associated with estimation
    methods at different abstraction level [10]. The higher the abstraction level,
    the lower the accuracy and the estimation time, depending on adopted estimation
    models and simulators [11]. Different abstraction levels can be considered to
    perform timing estimation, and several approaches have been proposed in the literature.
    Malik et Al. [12] explored different performance metrics that need to be considered
    in embedded software performance analysis and examined a wide range of techniques
    (e.g., path analysis techniques, system utilization analysis techniques). The'
