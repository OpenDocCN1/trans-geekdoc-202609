    # 4.4 Discussion


    Answer to RQ1: The considered “meaningful” timing performance metric is the embedded
    software execution time (i.e., Clock Cycles) [11]. It is possible to use the approach
    presented in this paper to predict this metric. The idea is to use ML techniques
    instead


    of simulators/emulators. This idea is reasonable because we have noted a quite
    high observed correlation among the Clock Cycles, C Statements, and Assembly Instructions
    Executed, as shown in Fig. 2 and Table 3. Despite the high correlation values
    shown in the table, LEON3 and ATmega328/P present lower correlation values, respectively,
    to float and int8, which can lead to wrong predictions. For 8051, the lowest correlation
    value of float data type depends on internal microcontroller architecture (i.e.,
    due to the absence of the Floating-Point Unit). The use of the proposed ML approach
    leads to feature selection problems (i.e., to find the most essential features'
