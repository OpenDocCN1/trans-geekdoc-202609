    # 4 EXPERIMENTAL RESULTS


    The proposed approach has been evaluated first in the SW domain by considering
    General Purpose Processor (GPP) technology. In this work, three GPPs, and their
    related ISSs, have been analyzed: LEON3, a 32-bit synthesizable RISC soft-microprocessor
    with a Harvard architecture, and a simulated system clock of 75 MHz Cobham Gaisler
    offers TSIM System Emulator as an accurate ISS of LEON3 processors, with gcc compiler
    (in this work, the default optimization flag -O0 has been used); Intel 8051 micro-controller,
    an 8-bit micro-controller with MCS-51 CISC instruction set and Harvard Architecture;
    The Dalton Instruction Set Simulator (ISS) [27] has been used to simulate programs
    written for the 8051 and to collect statistics, with SDCC (Small Device C Compiler)
    compiler; picoPower CMOS 8-bit AVR ATmega328/P, with an 8-bit RISC-based processor
    core and Harvard architecture. The SimulAVR [28] program has been used as a simulator
    for the Atmel AVR family of microcontrollers, with gcc compiler (in this work,
    the default optimization flag -O0 has been used). The benchmark execution has
    been done with a microprocessor software simulation using each processor’s ISS,
    as presented above.


    Fig. 2 shows the scatter plot related to the Pearson correlation for different
    processors. The three figures show a strict correlation between C statements and
    clock cycles. Regarding the other points (the ones under the main linear regression
    line), the deviation depends on function implementations that introduce different
    behaviors compared to the significant distribution. These points introduce errors
    inside the timing estimation activity and are related to the internal processor
