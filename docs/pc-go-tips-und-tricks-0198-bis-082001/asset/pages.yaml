- pgno: 70
  md: "# ## Excel-Tipps\n\n# ## Symbole nach Wunsch platzieren\n\nNicht immer befinden\
    \ sich die Symbole dort, wo Sie sie gerne hätten. Excel bietet Ihnen daher die\
    \ Möglichkeit, die Icons nach Ihren Bedürfnissen zu verschieben.\n\n+   1. Möchten\
    \ Sie die Reihenfolge der Icons in der Symbolleiste ändern, klicken Sie mit der\
    \ rechten Maustaste in die Symbolleiste. Im folgenden Kontextmenü wählen Sie den\
    \ Befehl „Anpassen“.\n+   \n+   2. Das Dialogfenster „Anpassen“ befindet sich\
    \ daraufhin im Vordergrund. Sie können nun im Hintergrund die Symbole nach Ihren\
    \ persönlichen Anforderungen verschieben.\n+   \n+   3. Haben Sie die Symbole\
    \ verschoben, klicken Sie im Dialogfenster „Anpassen“, das sich noch im Vordergrund\
    \ befindet, auf „Schließen“.\n\n# ## Große Symbole einstellen\n\nBetreiben Sie\
    \ Ihren PC mit einer hohen Bildschirmauflösung wie 1280 x 1024 oder höher, werden\
    \ die Symbolleisten ziemlich klein dargestellt. Das erschwert jedoch die Arbeit\
    \ in Excel. Denn Sie müssen mit der Maus jedes Mal sehr genau zielen. Excel bietet\
    \ Ihnen jedoch auch größere Symbolleisten an: Klicken Sie dazu mit der rechten\
    \ Maustaste auf ein beliebiges Symbol in der Symbolleiste. Im Kontextmenü wählen\
    \ Sie „Anpassen“, und im erscheinenden Dialog klicken Sie auf das Register „Optionen“.\
    \ Aktivieren Sie hier das Kontrollkästchen „Große Schaltflächen“.\n\n# ## Excel\
    \ als Lottokönig\n\nSechs Richtige im Lotto – nicht schlecht. Excel bietet Ihnen\
    \ die Möglichkeit, mit einer Zufallszahl zu arbeiten. Die Formel „=Zufallszahl()“\
    \ liefert eine Zahl zwischen „0“ und „1“. Mit der Formel „=Zufallszahl() * (b-a)+a“\
    \ vergrößern Sie diese Spanne. Dabei ist „b“ die größte und „a“ die kleinste vorkommende\
    \ Zahl. Wir erläutern dies am Beispiel von „6 aus 49“.\n\n+   1. Schreiben Sie\
    \ in eine beliebige Zelle die Formel „=Zufallszahl() * (49-1) + 1“. Bestätigen\
    \ Sie die Formel mit der „Enter“-Taste.\n+   \n+   2. Blenden Sie alle Dezimalstellen\
    \ aus. Dazu klicken Sie so lange auf das Symbol „Dezimalstelle löschen“, bis keine\
    \ Nachkommastellen mehr angezeigt werden. Wie oft Sie drücken müssen, hängt von\
    \ der Voreinstellung ab. Das erleichtert den Überblick: Denn beim Lotto werden\
    \ schließlich nur ganze Zahlen akzeptiert.\n+   \n+   3. Mit einem Druck auf die\
    \ Funktionstaste „F9“ verändern sich sämtliche Werte auf einen Schlag. Passen\
    \ Sie allerdings auf, auch doppelte Zahlen können in Ihrem Lottsystem vorkommen.\
    \ Mit der Funktionstaste „F9“ aktualisieren Sie Ihre Werte.\n\n# ## Menüs beim\
    \ Öffnen animieren\n\nExcel kann das Öffnen von Menüs grafisch animiert. Da diese\
    \ Animation bei langsameren Rechnern die Leistung beeinträchtigt, ist die Funktion\
    \ standardmäßig deaktiviert. Um die Animationseffekte zu aktivieren, klicken Sie\
    \ in Excel ein beliebiges Icon an und wählen im Kontextmenü den Befehl „Anpassen“.\
    \ Wechseln Sie im Dialogfenster in das Register „Optionen“. Wählen Sie im Listenfeld\
    \ „Menü“, „Animation“ die gewünschte Option wie „Abwechselnd“, „Entfaltend“ oder\
    \ „Abrollend“ aus.\n\n# ## Eigene Symbole gestalten\n\nWenn Sie die Symbole in\
    \ der Symbolleiste überdrüssig sind, passen Sie sie Ihren Vorstellungen an. Sie\
    \ können die Symbole auch völlig neu gestalten. Diese Funktion ist aber gut versteckt,\
    \ so dass Sie nur über einen Umweg dorthin gelangen.\n\n+   1. Um Symbole zu verändern\
    \ oder neu zu gestalten, klicken Sie mit der rechten Maustaste auf das Icon in\
    \ der Symbolleiste. Im erscheinenden Kontextmenü aktivieren Sie den Befehl „Anpassen“.\n\
    +   \n+   2. Während das „Anpassen“-Dialogfenster im Vordergrund ist, klicken\
    \ Sie das zu ändernde Icon mit der rechten Maustaste an. Im Kontextmenü wählen\
    \ Sie „Schaltflächensymbol bearbeiten“."
