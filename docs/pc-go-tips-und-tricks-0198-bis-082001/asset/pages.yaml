- pgno: 61
  md: '![](img/5f36a0372e5f0f300d0bad16e6a18053_61_0.png)


    # Überschriften auf jeder Druckseite


    Tabellen passen beim Ausdruck nicht immer auf eine Seite. Wenn der Tabelleninhalt
    sich über mehrere Seiten erstreckt, gehen die Überschriften auf den Folgeseiten
    verloren. Sie haben natürlich die Möglichkeit, die Tabelle so aufzubereiten, daß
    Sie bei jedem Seitenwechsel die Überschriften neu eingeben. Aber das ist überflüssiger
    Aufwand. Außerdem können Sie diese Vorgehensweise nicht anwenden, wenn Sie die
    Tabelle sortieren wollen. Die Überschriften der Folgeseiten würden dann ebenfalls
    sortiert: Das führt zu unsinnigen Ergebnissen. Aber die Druckfunktion von Excel
    bietet eine Möglichkeit, Überschriften auf allen Seiten zu drucken, obwohl diese
    nur an einer Stelle in der Tabelle stehen.


    3 Im Bereich „Drucktitel“ legen Sie den Bereich fest, der auf jeder Seite wieder
    gedruckt werden soll. Mit der Bereichseingabe im Feld „Wiederholungszeilen oben:“
    legen Sie die Überschrift für die Zeilen fest, im Feld „Wiederholungsspalten links:“
    definieren Sie die Überschriften für Spalten, falls Sie dies wünschen.


    4 Über die Schaltfläche „Seitenansicht“ können Sie das Ergebnis Ihrer Einstellung
    noch einmal kontrollieren, ob auch wirklich alles so erscheint, wie Sie es wünschen.
    Mit einem Klick auf „Drucken“ werden die gewünschten Seiten, jeweils mit der ausgewählten
    Überschrift versehen, ausgedruckt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_61_1.png)


    # TIP Zeile kopieren und verschieben


    Analog zum Tip „Drag und Drop ohne Reue“ können Sie eine Zeile auch kopieren und
    gleichzeitig verschieben. Dazu markieren Sie diese Zeile zunächst. Drücken Sie
    anschließend die „Strg“-Taste und die „Shift“-Taste gleichzeitig, halten Sie die
    beiden Tasten gedrückt und klicken Sie dann mit der linken Maustaste außerhalb
    der Anfasser auf die untere markierte Linie der Zeile. Halten Sie Sie weiterhin
    die „Strg“-Taste und die „Shift“-Taste sowie die Maustaste gedrückt und ziehen
    Sie die Markierung auf die gewünschte Zeile. Lassen Sie jetzt die Maustasten sowie
    die beiden anderen Tasten los. Der markierte Inhalt wird nun als zusätzliche Zeile
    zwischen die vorhandenen Zeilen kopiert. Bei diesem Vorgang ist besondere Vorsicht
    geboten. Wenn Sie vergessen, die „Shift“-Taste zu drücken, wird der vorhandene
    Inhalt der Zeile ohne Warnung überschrieben!


    1 Wenn Sie Ihre Tabelle, die sich über mehrere Druckseiten erstreckt, fertig bearbeitet
    haben und wenn die Überschriften festgelegt sind, klicken Sie in der Menüleiste
    auf „Datei“ und „Seite einrichten“.


    2 Klicken Sie im Dialogfeld „Seite einrichten“ auf den Registerreiter „Tabelle“.
    Im oberen Bereich können Sie, wenn Sie nicht die ganze Tabelle drucken wollen,
    den gewünschten Druckbereich festlegen.


    # Drag und Drop ohne Reue


    Tabellen sind nach der ersten Bearbeitung meistens noch nicht fertig. Häufig müssen
    neue Zeilen eingefügt werden. Oder Zeilen müssen verschoben werden. Hin und wieder
    müssen auch Zeilen kopiert werden. Hierfür die Excel-Standardfunktionen „Kopieren“,
    Einfügen Zeile“, Einfügen Inhalt“ zu verwenden, funktioniert zwar, aber es geht
    mittels Drag und Drop auch einfacher. Allerdings sind bei dieser Technik einige
    Besonderheiten zu beachten, sonst kommt es sehr schnell zu einem Datenverlust.


    1 Wenn Sie eine Zeile verschieben möchten, so markieren Sie die gewünschte Zeile
    zunächst mit der Maus. Klicken Sie danach mit der linken Maustaste außerhalb der
    Anfasser auf die untere markierte Linie der Zeile, halten Sie die Maustaste gedrückt
    und ziehen die Markierung auf die gewünschte Zeile. Lassen Sie jetzt die Maustaste
    los. Was passiert? Sie bekommen eine Warnmeldung: „Sollen die Inhalte der Zellen
    des Zielbereichs überschrieben werden?“ Seien Sie jetzt vorsichtig, denn wenn
    Sie mit der Schaltfläche „OK“ bestätigen, werden die vorhandenen Zelleninhalte
    te ohne weitere Rückfrage überschrieben. Dieser Weg entspricht also noch nicht
    unseren Vorstellungen. Klicken Sie deswegen auf die Schaltfläche „Abbrechen“.


    te ohne weitere Rückfrage überschrieben. Dieser Weg entspricht also noch nicht
    unseren Vorstellungen. Klicken Sie deswegen auf die Schaltfläche „Abbrechen“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_61_2.png)


    2 Wenn die vorhandenen Zelleninhalte beim Verschieben nicht überschrieben werden
    sollen, markieren Sie noch einmal die zu verschiebende Zeile mit der Maus. Drücken
    Sie danach die „Shift“-Taste, halten diese gedrückt und klicken Sie dann mit der
    linken Maustaste außerhalb der Anfasser auf die untere markierte Linie der Zeile,
    halten Sie die „Shift“-Taste und die Maustaste gedrückt und ziehen die Markierung
    auf die gewünschte Zeile. Lassen Sie jetzt die Maustaste und die „Shift“-Taste
    los. Der markierte Inhalt wird jetzt als zusätzliche Zeile zwischen die vorhandenen
    Zeilen geschoben, ohne daß Sie irgendeinen Zelleninhalt überschreiben


    # TIP Gültigkeitskriterien auswählen


    Was es mit den Gültigkeitskriterien bei der Eingabe auf sich hat, beschreiben
    wir im Tip „Gültigkeitsregeln für die Dateneingabe festlegen“ auf der nächsten
    Seite. Außer den dort beschriebenen Gültigkeitskriterien können Sie auch „Ganze
    Zahl“, „Liste“ (bei dieser Einstellung wird der eingegebene Wert mit dem Wert
    aus einem festgelegten Bereich verglichen), „Datum“, „Zeit“, „Textlänge“ und „Benutzerdefiniert“
    (für diese Einstellung müssen Sie eine Formel hinterlegen) auswählen. Die Eingabemeldung
    und die Fehlermeldung funktionieren genauso wie im Tip beschrieben.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# TIP Spalten und Zeilen fixieren


    Bei großen Tabellen ist es lästig, daß die Überschriften nicht auf jeder Bildschirmanzeige
    mit dargestellt werden. Um auf jeder beliebigen Bildschirmseite Ihres Arbeitsblattes
    die gewünschten Überschriften zu sehen, können Sie Zeilen und Spalten fixieren.
    Um eine exakte Fixierung von Spalten oder Zeilen vorzunehmen, müssen Sie den Bereich
    der Fixierung vorher genau festlegen. Daher müssen Sie zum Fixieren des oberen
    horizontalen Ausschnitts die Zeile unterhalb der Stelle, an der die Teilung erfolgen
    soll, markieren. Um den linken vertikalen Ausschnitt zu fixieren, markieren Sie
    die Spalte rechts neben der Stelle, an der die Teilung erfolgen soll. Klicken
    Sie anschließend im Menü auf „Fenster“ und auf „Fixieren“. Schon können Sie nach
    Belieben durch Ihre Daten navigieren, ohne daß eine Überschrift verloren geht.
    Wenn Sie die Fixierung wieder aufheben wollen, klicken Sie im Menü nochmals auf
    „Fenster“ und auf den Menüpunkt „Fixierung aufheben“.


    # Gültigkeitsregeln für die Dateneingabe festlegen


    Normalerweise können Sie in jede Excel-Zelle beliebige Daten eingeben. Ist die
    Zelle noch ohne Formatierung, versucht Excel aufgrund der Eingabe selbst festzulegen,
    um welches Eingabeformat (Text, Zahl, Datum, Uhrzeit) es sich handelt. Sie können
    aber auch Formatierungen von Feldern durch Überschreiben zerstören. Besonders
    kritisch werden fehlerhafte Eingaben, wenn diese in Formeln verwendet werden.
    Das führt dann unweigerlich zu Fehlberechnungen. Aus diesem Grund sollten Sie
    sensible Felder mit Gültigkeitsregeln versehen.


    bereich durch eine Minimum- und Maximum-Eingabe einschränken.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_62_0.png)


    +   1 Um eine Gültigkeitsprüfung zu erstellen, müssen Sie zunächst den Bereich
    markieren, für den diese Prüfung zutreffen soll. Ist das geschehen, klicken Sie
    im Menü auf „Daten“ und im folgendem Untermenü auf den Eintrag „Gültigkeit“.


    +   2 Im Dialogfenster „Gültigkeit“ klicken Sie auf das Register „Einstellungen“.
    In den Gültigkeitskriterien ist im Feld „Zulassen“ der Eintrag „Jeden Wert“ aktiviert.
    Um dies zu ändern, wählen Sie zum Beispiel „Ganze Zahl“ aus. Die Option „Leere
    Zellen ignorieren“ aktivieren Sie, sonst schränken Sie sich bei der Dateneingabe
    zu stark ein. Sie können zusätzlich den erlaubten Daten-


    +   3 Klicken Sie jetzt auf das Register „Eingabemeldung“. Wenn das Kontrollkästchen
    „Eingabemeldung anzeigen, wenn Zelle ausgewählt wird“ aktiviert ist, können Sie
    einen Titel und eine Eingabemeldung festlegen.


    +   4 Mit einem Klick auf das Register „Fehlermeldung“ legen Sie bei Bedarf eine
    Fehlermeldung fest. Wie auf einen Fehler reagiert wird, legen Sie durch die Auswahl
    „Stil“ fest. Durch Auswahl von „Stop“ müssen Sie einen korrekten Wert eingeben.
    Durch die Wahl von „Warnung“ können Sie bei der Fehleingabe selbst entscheiden,
    ob der eingegebene Wert Gültigkeit haben soll. Bei „Information“ erhalten Sie
    nur einen Hinweis.


    # Kommentar erspart Nachfragen


    Bei komplexen Tabellen kommt es immer wieder vor, daß bei einer späteren Bearbeitung
    der Tabellen komplizierte Sachverhalte nicht mehr im Gedächtnis sind. Die Frage
    lautet dann: „Wie bin ich bloß zu diesem Ergebnis gekommen?“ Noch schwerwiegender
    wird es, wenn Dritte mit den von Ihnen erzeugten Tabellen weiterarbeiten sollen.
    Deshalb gewöhnen Sie sich lieber an, bei schwierigen Vorgängen einen Kommentar
    zu hinterlegen.


    machen des Kommentars brauchen Sie lediglich mit dem Mauszeiger über dieses Feld
    zu fahren. Der Kommentar wird dann eingeblendet.


    +   1 Klicken Sie auf das Feld, das mit einem Kommentar versehen werden soll.
    Klicken Sie danach in der Menüleiste auf „Einfügen“ und „Kommentar“. Es wird ein
    kleines Fenster geöffnet, in das Sie den gewünschten Kommentar eintippen können.
    Wenn Sie mit der Maus einmal außerhalb des Kommentarfensters klicken, wird der
    Kommentar gespeichert. An dem kleinen roten Dreieck in der rechten oberen Ecke
    der Zelle erkennen Sie, daß sich an dieser Stelle ein Kommentar verbirgt. Zum
    Sichtbar-


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_62_1.png)


    +   2 Um den Kommentar dauerhaft sichtbar zu machen, klicken Sie mit der rechten
    Maustaste in das Feld mit dem Kommentar. Daraufhin wird ein Kontextmenü geöffnet.
    Wählen Sie hier den Eintrag „Kommentar anzeigen“ aus. Der Kommentar wird jetzt
    durchgehend angezeigt. Da er sich aber vor die vorhandenen Zellen legt, ist diese
    Einstellung nur in Ausnahmefällen sinnvoll. Um die permanente Anzeige des Kommentars
    zu unterdrücken, klicken Sie wieder mit der rechten Maustaste in das Feld, welches
    den Kommentar enthält und klicken im Kontextmenü auf den Eintrag „Kommentar ausblenden“.


    +   3 Sie können überflüssig gewordene Kommentare auch wieder löschen. Klicken
    Sie dazu mit der rechten Maustaste in das Feld, das den Kommentar enthält, und
    klicken Sie anschließend in dessen Kontextmenü auf den Eintrag „Kommentar löschen“.


    # TIP Kommentar überarbeiten


    Soll ein Kommentar noch einmal überarbeitet werden, so klicken Sie wieder mit
    der rechten Maustaste in das Feld, welches den Kommentar enthält. Klicken Sie
    anschließend im Kontextmenü auf den Eintrag „Kommentar bearbeiten“. Sie können
    nun den vorhandenen Text bearbeiten und ergänzen. Da es sich bei dem Kommentarfeld
    um ein Textfeld handelt, können Sie es mit Hilfe der Anfasser in der Größe verändern.
    Dadurch besteht die Möglichkeit, auch längere Texte als Kommentar zu hinterlegen.
    Die Lage des Kommentarfensters können Sie dadurch verändern, indem Sie mit der
    Maus zwischen die Anfasser klicken und das Kommentarfenster an eine beliebige
    Stelle innerhalb des Bildschirmfensters plazieren.'
  merge: -1
  img_proc: true
- pgno: 63
  md: '# Arbeitsblätter mit Namen versehen


    Eine Tabelle in Excel wird auch als Arbeitsblatt bezeichnet, während eine ganze
    Datei Arbeitsmappe genannt wird. Wenn Sie mit mehreren Arbeitsblättern in einer
    Arbeitsmappe arbeiten, sollten Sie diese umbenennen. Anstatt der Standardbezeichnung
    „Tabelle1“ bis „Tabelle n“ (n= Anzahl Ihres letzten Arbeitsblattes) sollten Sie
    lieber aussagekräftige Namen vergeben. Dadurch behalten Sie einen wesentlich besseren
    Überblick und wissen immer genau, welche Inhalte sich in welcher Tabelle verbergen.


    1 Wechseln Sie mit einem Klick auf das Arbeitsblatt, welches Sie mit einem eigenem
    Namen versehen wollen.


    2 Klicken Sie am unteren Rand der Tabelle mit der rechten Maustaste auf den Namensreiter
    (Beispiel: Tabelle2). Das Kontextmenü wird geöffnet. Wählen Sie im Kontextmenü
    den Eintrag „Umbenennen“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_63_0.png)


    3 Die Registerbezeichnung „Tabelle n“ wird markiert, und Sie können einen neuen
    Namen für dieses Arbeitsblatt eintippen. (Hinweis: Bei Excel 95 wird noch zusätzlich
    ein Dialogfeld zur Eingabe aufgebendet.) Mit der „Enter“-Taste wird die Eingabe
    abgeschlossen.


    4 Sie sind kein Freund der rechten Maustaste? Dann können Sie auch durch einen
    Doppelklick auf die linke Maustaste in den Eingabemodus der Tabellenbeschriftung
    gelangen. Führen Sie also einen Doppelklick auf den zu ändernden Tabellennamen
    aus und überschreiben Sie die alte Bezeichnung.


    # Arbeitsblätter schützen


    Ein gut aufgebautes Arbeitsblatt kann durch unkontrolliertes Arbeiten schnell
    zerstört werden. Das trifft insbesondere zu, wenn andere Personen mit der von
    Ihnen erstellten Arbeitsmappe weiter arbeiten. Daher sollten Sie die Arbeitsmappe
    schützen und nur bestimmte Bereiche zur Dateneingabe freigeben. Dabei ist aber
    darauf zu achten, daß standardmäßig alle Zellen des Arbeitsblattes geschützt sind.
    Die zu bearbeitenden Felder müssen explizit freigegeben werden.


    1 Zum Schützen Ihres Arbeitsblattes klicken Sie zunächst auf den Reiter des zu
    schützenden Blattes. Bei mehreren zu schützenden Arbeitsblättern müssen Sie jedes
    Arbeitsblatt explizit schützen.


    2 Markieren Sie die Felder oder den Bereich, in dem Sie eine Dateneingabe erlauben
    wollen. Klicken Sie nach der Markierung im Menü auf den Eintrag „Format“ und dann
    auf „Zellen“. Das Dialogfenster der Zellen erscheint auf dem Bildschirm. Klicken
    Sie hier auf den Register „Schutz“. Das Options­kästchen „Gesperrt“ ist aktiviert.
    Deaktivieren Sie es, indem Sie mit der Maus auf das Häkchen im Dialogfeld klicken.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_63_1.png)


    Das Häkchen verschwindet und die markierten Zellen sind zur Freigabe vorgesehen.
    Mit einem Klick auf die Schaltfläche „OK“ sind die Zellen wieder freigegeben.


    3 Wählen Sie im Menü „Extras“ den Befehl „Schutz / Blatt“. Der Dialog „Blatt schützen“
    erscheint. Legen Sie hier fest, ob Inhalte, Objekte oder Szenarios geschützt werden
    sollen. Vergeben Sie ein Kennwort. Aber Vorsicht: Merken Sie sich das Kennwort,
    sonst können Sie Ihre Arbeitsmappe auch nicht mehr ändern!


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_63_2.png)


    4 Versuchen Sie nun, Daten in gesperrte Bereiche einzugeben, erscheint eine Fehlermeldung
    „Sie versuchen, Zellen zu ändern, die schreibgeschützt sind“. Klicken Sie aber
    in einen ungeschützten Bereich, können Sie problemlos Daten eingeben.


    5 Zum Aufheben des Arbeitsblattschutzes klicken Sie im Menü auf „Extras / Schutz
    / Blattschutz aufheben“. Wenn Sie ein Kennwort vergeben haben, müssen Sie dieses
    hier erneut eingeben.


    # TIP Mehr Arbeitsblätter wählen


    Standardmäßig wird Excel mit drei Arbeitsblättern geöffnet. Wenn Sie aber üblicherweise
    mit mehr oder weniger Arbeitsblättern arbeiten, können Sie die Anzahl als Vorgabe
    in Excel festlegen. Klicken Sie dazu in der Excel-Menüleiste auf „Extras“ und
    „Optionen“. Wechseln Sie im jetzt geöffneten Dialogfeld „Optionen“ auf den Registereintrag
    „Allgemein“. Hier finden Sie im mittleren Bereich den Eintrag „Blätter in neuer
    Arbeitsmappe:“. Tippen Sie in dieses Feld die Anzahl der Arbeitsblätter ein, mit
    der Sie Excel zukünftig starten wollen. Klicken Sie anschließend auf die Schaltfläche
    „OK“. Beenden Sie danach Excel. Bei jedem neuen Start von Excel und bei jeder
    Anlage einer neuen Arbeitsmappe wird in Zukunft die Anzahl der von Ihnen festgelegten
    Arbeitsblätter geöffnet.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_63_3.png)


    # TIP Kopieren mit der Maus


    Hier noch ein Tip für Mausliebhaber: Drücken Sie die „Strg“-Taste und halten Sie
    diese gedrückt, halten Sie zusätzlich die linke Maustaste gedrückt und ziehen
    das markierte Arbeitsblatt an die Stelle innerhalb des Registers, an die es kopiert
    werden soll. Lassen Sie dann die „Strg“-Taste und anschließend die linke Maustaste
    wieder los. So geht es auch.'
  merge: -1
  img_proc: true
- pgno: 64
  md: '# Excel


    # Eigenschaften von Arbeitsmappen


    Wenig bekannt ist die Möglichkeit, sich die Eigenschaften von Arbeitsmappen anzusehen.
    Dabei stehen in den Eigenschaften nicht nur Informationen zur Arbeitsmappe. Sie
    können dort auch selbst wichtige Informationen zu Ihrer Arbeitsmappe eingeben.


    1 Klicken Sie in Ihrer geöffneten Arbeitsmappe im Menü auf „Datei“ und im anschließenden
    Untermenü auf „Eigenschaften“.


    2 Das Dialogfeld der Eigenschaften erscheint. Im Register „Allgemein“ sehen Sie
    Angaben zum Speicherort, die Dateigröße, das Erstellungsdatum, wann die Datei
    zuletzt geändert wurde und wann sie zuletzt geöffnet wurde. Außerdem bekommen
    Sie Auskunft darüber, ob die Datei schreibgeschützt ist.


    3 Klicken Sie auf die Registerkarte „Datei-Info“. Hier können Sie selbst Hand
    anlegen und einen Titel für die Arbeitsmappe vergeben, das Thema grob beschreiben,
    sich als Autor dieser Datei bekannt geben sowie weitere Angaben eintippen (Manager,
    Firma, Kategorie, Stichwörter, Kommentar). Diese Angaben erhalten spätestens dann
    Bedeutung, wenn Sie die Arbeitsmappe an Dritte weitergeben. So ist auf einen Blick
    ersichtlich, um was es sich in der Arbeitsmappe handelt, wer der Autor ist und
    so weiter.


    4 Sehr wichtig ist auch das Options­kästchen „Vorschaugrafik speichern“ in der
    linken unteren Ecke des Dialogfeldes. Wenn Sie diese Option anklicken, wird im
    „Öffnen“-Dialogfeld eine Vorschau auf die Tabelle gezeigt. Das ist oftmals sinnvoll,
    funktioniert allerdings nur, wenn Sie auf das „Vorschau“-Symbol im „Öffnen“-Dialog
    geklickt haben.


    5 Das Register „Statistik“ gibt Ihnen darüber Auskunft, wann das Arbeitsblatt
    angelegt, wann es zuletzt geöffnet und geändert wurde. Außerdem erfahren Sie hier,
    zu welchem Zeitpunkt es zuletzt gedruckt und vom wem es zuletzt gespeichert wurde.


    6 Mit einem Klick auf „Inhalt“ bekommen Sie übersichtlich angezeigt, welche Tabellen
    und welche Diagramme sich in der Arbeitsmappe befinden.


    7 Klicken Sie auf den Registerreiter „Anpassen“, um Einstellungen für die Dateiablage
    vorzunehmen. Sie können an dieser Stelle auch Angaben wie „Abteilung“, „Bearbeiter“
    und ähnliches hinterlegen, indem Sie eine Kategorie markieren und auf „Hinzufügen“
    klicken.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_64_0.png)


    # TIP Arbeitsblätter kopieren


    Ganze Arbeitsblätter sind samt Formatierungen schnell markiert und kopiert: Klicken
    Sie mit der rechten Maustaste im Kontextmenü auf den Eintrag „Verschieben / Kopieren“.
    Im folgenden Dialog müssen Sie das Options­kästchen „Kopieren“ im unteren Bereich
    des Dialogfeldes aktivieren. Sonst wird Ihre Tabelle lediglich verschoben, aber
    nicht kopiert! Entscheiden Sie sich, an welcher Stelle das kopierte Arbeitsblatt
    eingefügt werden soll. Mit einem Klick auf „OK“ wird das Arbeitsblatt an die gewünschte
    Stelle kopiert.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_64_1.png)


    # Arbeitsblätter verschieben


    Oft bemerken Sie erst nach dem Erstellen mehrerer Arbeitsblätter, daß diese nicht
    an optimaler Stelle stehen. Tabellen können aber sehr einfach untereinander verschoben
    werden.


    1 Aktivieren Sie zunächst auf das Arbeitsblatt, das Sie verschieben wollen.


    2 Klicken Sie mit der rechten Maustaste in das Tabellenblatt. Im jetzt erscheinendem
    Kontextmenü klicken Sie auf „Verschieben / Kopieren“. Das Dialogfeld „Verschieben
    / Kopieren“ wird geöffnet. In das obere Feld können Sie eintragen, ob Sie innerhalb
    Ihrer Arbeitsmappe bleiben wollen oder das markierte Arbeitsblatt in eine andere
    Arbeitsmappe verschieben wollen. Wir bleiben in unserer Arbeitsmappe, ändern den
    Eintrag also nicht.


    3 Im unteren Bereich des Dialogfensters legen Sie fest, vor welchem Arbeitsblatt
    das markierte Arbeitsblatt eingefügt werden soll. Mit einem Klick auf „OK“ wird
    das Arbeitsblatt verschoben.


    4 Wenn Sie lieber alles mit der Maus machen möchten, so ist auch das möglich:
    Halten Sie die linke Maustaste gedrückt, und ziehen Sie das markierte Arbeitsblatt
    an die Stelle innerhalb des Registers, an der es stehen soll und lassen Sie dann
    die linke Maustaste wieder los.


    5 Verfahren Sie auf die gleiche Art und Weise mit den anderen Arbeitsblättern,
    so daß am Ende Ihrer Aktion die optimale Reihenfolge für Ihre verschiedenen Tabellenblätter
    der Arbeitsmappe festgelegt ist.


    # TIP Zeichnungsobjekte einfügen


    Sie brauchen nicht unbedingt aufwendige Diagramme zu erstellen, um Ihre Tabellen
    aufzuwerten. Bereits einfache Grafiken erzeugen eine gute Wirkung. Aktivieren
    Sie die Zeichnen-Symbolleiste über „Ansicht / Symbolleisten / Zeichnen“. Neben
    einfachen Zeichenelementen können Sie hier auch sogenannte Autoformen einfügen.
    Klicken Sie dazu auf „Autoformen“, wählen Sie eine Autoform aus, zum Beispiel
    einen Gewitterblitz. Der Mauszeiger verwandelt sich in ein kleines Kreuz. Ziehen
    Sie innerhalb der Tabelle den Blitz mit gedrückter Maustaste in die gewünschte
    Lage und Größe.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_64_2.png)'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# Schnelles Übertragen mehrerer Formate


    In Excel sind die einzelnen Zellen oft mit mehreren Formatierungsmerkmalen auf
    einmal belegt. Um diese Kombination von Formatierungsmerkmalen auf einmal zu übertragen,
    hält Excel einen besonderen Befehl bereit.


    1 Formatieren Sie in Ihrem Arbeitsblatt eine Zelle mit besonderen Merkmalen, wie
    zum Beispiel Schriftart, Vordergrundfarbe, Hintergrundfarbe und Ausrichtung.


    2 Klicken Sie zunächst in das Feld mit den ausgewählten Formaten und danach in
    der Symbolleiste auf das Symbol „Format übertragen“ (Pinselsymbol).


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_65_0.png)


    Die Formatierungs-Informationen werden jetzt in den Zwischenspeicher Ihres PCs
    geschrieben.


    3 Klicken Sie anschliessend in die Zelle, auf der Sie das Format übertragen möchten.
    Sämtliche Formatierungsmerkmale werden auf die Zelle übertragen, und die Funktion
    „Format übertragen“ wird wieder zurück gesetzt.


    4 Wenn Sie die Formatierungs-Informationen auf mehrere Zellen übertragen wollen,
    ohne jedes Mal wieder auf das Symbol „Format übertragen“ klicken zu müssen, wählen
    Sie die Zelle mit den zu übertragenden Formaten aus und klicken doppelt (!) auf
    das Symbol „Format übertragen“. Jetzt wird auf jede Zelle, die Sie anklicken,
    das Format übertragen. Sind alle gewünschten Zellen mit dem ausgewählten Format
    versehen, drücken Sie auf die „Esc“-Taste. Die Funktion wird anschliessend zurück
    gesetzt, und Sie können im normalen Modus weiterarbeiten.


    # Top Ten mit Hilfe eines Filters


    Zum Auswerten von Arbeitsblättern müssen Sie nicht manuell Eintragungen durchzählen.
    Mit Hilfe von Filtern können Sie die „Top Ten“ Ihrer Tabelle automatisch sichtbar
    machen. Dabei müssen die „Top Ten“ nicht genau zehn Eintragungen enthalten; Sie
    können die Anzahl der Tops frei einstellen.


    1 Laden Sie eine Arbeitsmappe, in der es Zahlen gibt. Denn die „Top Ten“ können
    nur auf Basis von numerischen Werten ermittelt werden, bei Textspalten verweigert
    das Programm diese Funktion.


    2 Wenn Sie die auszuwertende Arbeitsmappe geladen haben, stellen Sie sicher, dass
    die Überschriftenzeile eine andere Formatierung hat als der Rest der Tabelle.
    Erst dadurch ist eine eindeutige Filterzuordnung möglich.


    3 Klicken Sie in der Menüzeile auf den Eintrag „Daten“ und anschliessend auf den
    Eintrag „Filter“. Im jetzt aktivierten Untermenü klicken Sie auf „AutoFilter“.
    Die Überschriftenzeile Ihrer Tabelle wird mit Auswahlbalken versehen.


    4 Wählen Sie die auszuwertende Spalte aus. Sie muss numerische Werte enthalten.


    Klicken Sie nun auf das Auswahlsymbol und wählen den Eintrag „Top 10 ...“ aus.
    Das Dialogfeld „Top 10 - Auto Filter“ erscheint.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_65_1.png)


    5 Wählen Sie nun aus, ob Sie die „Obersten“ oder die „Untersten“ Top Ten selektieren
    möchten. Stellen Sie danach die Anzahl der zu filternden Elemente ein. Mit einem
    Klick auf „OK“ werden die gefilterten Elemente angezeigt.


    6 Eine Besonderheit bietet die Auswahl der Top Ten: Sie können anstatt der Anzahl
    der Elemente auch über Prozente filtern. Legen Sie zum Beispiel fest, dass Sie
    die obersten 10 Prozent Ihrer ausgewählten Spalte filtern möchten.


    7 Die Filterfunktion lässt sich natürlich auch wieder deaktivieren. Dazu klicken
    Sie im Menü auf „Daten“, „Filter“ und klicken anschliessend das Auswahlhäkchen
    vor „AutoFilter“ weg. Schon steht Ihnen die Tabelle wieder ungefilttert zur Verfügung.


    # TPP Filtern nach Inhalten


    Mit der Filterfunktion haben Sie die Möglichkeit, bestimmte Einträge aus einer
    Tabelle zu selektieren. Klicken Sie dazu in der Menüleiste auf „Daten“, „Filter“
    und „AutoFilter“. Die Überschriften Ihrer Tabelle werden mit Auswahlschaltflächen
    versehen. Klicken Sie auf die Spalte, aus der Sie die Einträge filtern möchten:
    Es erscheint eine Auswahl der vorhandenen Einträge. Wählen Sie den gewünschten
    Eintrag, und anschliessend werden Ihnen die passenden Einträge dargestellt. Um
    wieder alle Einträge zu sehen, klicken Sie erneut auf den Auswahlbutton und dort
    auf den Eintrag „Alle“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_65_2.png)


    # TPP Formeln in Werte umwandeln


    Wenn Sie Daten von Excel in andere Programme weiter bearbeiten wollen, ist es
    sinnvoll, Formeln in Werte umzuwandeln. Viele Programme können mit den Excel-Formeln
    nämlich nichts anfangen. Markieren Sie den Bereich, den Sie von Formeln in Werte
    wandeln wollen. Klicken Sie anschliessend im Menü auf „Bearbeiten“ und „Kopieren“.
    Klicken Sie anschliessend in die Zelle, von der an Sie die Werte eintragen wollen.
    Klicken Sie dann im Menü auf „Bearbeiten“ und „Inhalte einfügen“. Das Dialogfeld
    „Inhalte einfügen“ wird dabei geöffnet. Wählen Sie die Option „Werte“ aus. Mit
    einem Klick auf die Schaltfläche „OK“ werden die Werte Ihrer Formeln eingesetzt.'
  merge: -1
  img_proc: true
- pgno: 66
  md: '# TIPP Spart Platz: Umbruch in Zellen


    Um Platz zu sparen, werden die Überschriften in Tabellen oft über mehrere Zellen
    verteilt. Das ist aber nicht nötig, denn Sie können den Text auch innerhalb einer
    Zelle umbrechen. Klicken Sie dazu in die entsprechende Zelle und im Menü auf „Format“
    und „Zellen“. Das Dialogfeld zur Zellenformatierung wird angezeigt. Klicken Sie
    auf den Reiter „Ausrichtung“, und aktivieren Sie das Options­kästchen „Zeilenumbruch“.
    Jetzt wird der Text automatisch umge­brochen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_66_0.png)


    Sie können Ihren Text auch an einer genau definierten Stelle umbrechen: Klicken
    Sie auf das entsprechende Feld und anschliessend im Bearbeitungsfeld an die Stelle,
    an der ein Zeilenumbruch stattfinden soll. Drücken Sie die Tastenkombination „Alt“
    und „Enter“. Jetzt wird der Zeilenumbruch innerhalb der Zelle genau an der von
    Ihnen definierten Stelle ausgeführt.


    # TIPP Überschrift zentrieren


    Beim Gestalten Ihrer Tabelle sollten Sie die Überschrift über der gesamten Tabelle
    zentrieren. Schreiben Sie dazu zunächst Ihre Überschrift in die linke Spalte über
    Ihre Tabelle. Markieren Sie danach den Tabelleninhalt von der ersten bis zur letzten
    Spalte und klicken auf das Symbol „Verbinden und zentrieren“. Die Zellen in der
    Überschrift werden dadurch miteinander verbunden, so dass eine einzige Zelle steht.
    Anschliessend wird die Überschrift in dieser Zelle zentriert.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_66_1.png)


    # Hilfe in der Not: der Funktionsassistent


    Einige Standardfunktionen, wie zum Beispiel die Summenbildung, stellen in Excel
    kein Problem dar. Doch was ist, wenn Sie etwas berechnen wollen und die Funktion
    hierzu nicht kennen? In diesem Fall hilft Ihnen der integrierte Funktionsassistent
    weiter.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_66_2.png)


    1 Sie haben beispielsweise eine Tabelle mit PC-Angeboten vor sich. Sie wollen
    jetzt das günstigste Angebot errechnen lassen, wissen aber nicht, mit welcher
    Funktion. Klicken Sie zunächst in das Feld, in dem das günstigste Angebot errechnet
    werden soll, anschliessend im Menü auf „Einfügen“ und im Untermenü auf „Funktion...“.
    Das Dialogfeld „Einfügen Funktion“ wird eingeblendet.


    2 Auf der linken Seite sehen Sie eine Auswahl von Kategorien. Bei der Auswahl
    des günstigsten Angebotes, also des Minimums eines Bereiches, handelt es sich
    um eine statistische Funktion. Klicken Sie deshalb innerhalb der Kategorienauswahl
    auf den Eintrag „Statistik“.


    3 Auf der rechten Seite werden Ihnen jetzt alle Funktionen zur Kategorie „Statistik“
    angezeigt. Da Sie das Minimum eines Bereiches berechnen wollen, wählen Sie die
    Funktion „MIN“ aus. Im unteren Bereich des Fensters ist die Funktion bereits beschrieben.


    4 Mit einem Klick auf die Schaltfläche „OK“ öffnet sich ein Dialogfenster zum
    Festlegen des Bereiches, mit dem gerechnet werden soll. Klicken Sie jetzt auf
    das Symbol rechts von der Eingabezeile „Zahl1“. Das Dialogfeld wird minimiert:
    Sie können den Bereich markieren, aus dem Sie das Minimum berechnen wollen.


    5 Haben Sie den gewünschten Bereich markiert, klicken Sie auf das Symbol der Eingabezeile
    des reduzierten Dialogfeldes. Das Dialogfeld wird wieder in normaler Größe dargestellt,
    die Angaben des markierten Bereiches stehen in dem Feld „Zahl1“, und das Ergebnis
    wird in der Vorschau schon einmal angezeigt. Mit einem Klick auf die Schaltfläche
    „Ende“ wird die Formel in Ihre Zelle übernommen und das Ergebnis dargestellt.


    # So geht es einfacher: Zellen benennen


    Beim Erstellen von Formeln verliert man leicht den Überblick. Damit Ihnen das
    nicht passiert, benennen Sie Ihre Zellen; denn mit aussagekräftigen Namen werden
    die ansonsten eher kryptischen Formeln übersichtlicher.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_66_3.png)


    1 Sie wollen gerne wissen, wie groß Ihre monatliche Belastung bei einer bestimmten
    Kredithöhe, einer vordefinierten Laufzeit und einem bestimmten Zinssatz ist? Die
    Formel zu dieser Berechnung lautet: „=RMZ(Zins/12;Laufzeiten*12; Kreditbetrag-Kapital;1)“.


    2 Um diese Formel in Excel übersichtlich darzustellen, benennen Sie Ihre Felder
    mit den entsprechenden Namen. Klicken Sie dazu in das erste zu beschreibende Feld
    und geben in das Namensfeld (in der linken oberen Ecke der Tabelle), in dem zur
    Zeit die Zellenbezeichnung (A1 oder etwas anderes) steht, den gewünschten Namen
    ein.


    3 Wiederholen Sie diesen Vorgang für jede zu benennende Zelle. Sie können allerdings
    jede Benennung nur einmal benutzen, damit die Eindeutigkeit der Zellenbezüge nicht
    zerstört wird.


    4 Nachdem Sie alle relevanten Felder benannt haben, erstellen Sie Ihre Formel.
    Wenn Sie jetzt auf den jeweiligen Zellenbezug klicken, wird anstatt der kryptischen
    Positionsangabe die von Ihnen eingetragene Zellenbezeichnung in die Formel gesetzt.
    Sie können die Formel auch manuell eingeben und dabei Namen benutzen.'
  merge: -1
  img_proc: true
- pgno: 67
  md: '# Excel TIPPS


    # TIPP Bruchzahlen umwandeln


    Wenn Sie in Ihrer Tabelle mit Bruchzahlen, wie zum Beispiel 2/4 arbeiten, interpretiert
    Excel dies als Datumsangabe und wandelt diese Zahl in den 2. April um. Um dies
    zu vermeiden, muß die Zelle richtig formatiert werden. Markieren Sie die entsprechende
    Zelle, und klicken Sie im Menü „Format“ auf den Eintrag „Zellen“. Im folgenden
    Dialogfeld klicken Sie im Register „Zahlen“ unter „Kategorie“ auf den Eintrag
    „Bruch“. Ein neues Listenfeld erscheint rechts im Dialogfeld. Wählen Sie hier
    das gewünschte Darstellungsformat aus. Schließen Sie das Dialogfenster per Klick
    auf die Schaltfläche „OK“. Schon wird der Bruch in der gewünschten Form dargestellt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_67_0.png)


    # Inhalte kopieren


    Wenn Sie in Excel Zellen kopieren, werden standardmäßig Formeln mit kopiert. Benötigen
    Sie aber nur die Ergebnisse, also die nackten Zahlen, müssen Sie die erweiterte
    Kopierfunktion nutzen.


    +   1. Klicken Sie auf die Zelle oder den Zellbereich, den Sie kopieren möchten,
    und klicken Sie auf das Kopiersymbol in der Symbolleiste.

    +   2. Markieren Sie den Einfügebereich, und klicken Sie im Menü „Bearbeiten“
    auf den Eintrag „Inhalte einfügen“.

    +   3. Das Dialogfeld „Inhalte einfügen“ wird geöffnet. Standardmäßig ist das
    Options­kästchen „Alles“ aktiviert.


    „Alles“ aktiviert. Um lediglich die Zahlen zu übernehmen, aktivieren Sie per Mausklick
    die Option „Werte“. Schließen Sie das Dialogfeld, indem Sie auf „OK“ klicken.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_67_1.png)


    # Verluste auf einen Blick erkennen


    Lange Listen sind schnell unübersichtlich. Damit Sie wichtige Informationen, wie
    negative Zahlen, sofort erkennen, können Werte farblich hervorgehoben werden.
    Dies erreichen Sie mit der richtigen Zellformatierung.


    +   1. Markieren Sie den Bereich, in dem negative Zahlen hervorgehoben werden
    sollen. Klicken Sie im Menü „Format“ auf den Eintrag „Zellen“.

    +   2. Das Dialogfeld „Zellen“ wird geöffnet. Im Register „Zahlen“ wählen Sie
    im Listenfeld den Eintrag „Zahl“ mit einem Mausklick aus. Rechts daneben erscheint
    die Liste „Negative Zah- len“, in der Sie das passende Format auswählen, also
    „-1234,10“. Klicken Sie auf die Schaltfläche „OK“, um das Dialogfeld zu beenden.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_67_2.png)


    # TIPP Ergebnisse als Formel anzeigen


    Wollen Sie in einer umfangreichen Tabelle die Formeln prüfen, sollten Sie sich
    die Formeln anzeigen lassen. Sie erreichen dies mit einer einfachen Tastenkombination.
    Betätigen Sie die Tastenkombination „Strg + #“. Excel zeigt Ihnen alle Formeln
    an, die sich in der aktiven Tabelle befinden. Durch erneutes Drücken dieser Tastenkombination
    schalten Sie wieder zur gewohnten Anzeige der Werte zurück.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_67_3.png)


    # Gültigkeitsregeln festlegen


    Arbeiten mehrere Personen an einer Tabelle, schleichen sich schnell Fehler ein.
    Eingrenzen lassen sich solche Fehler durch so genannte Gültigkeitsregeln. Damit
    legen Sie über eine DropDown-Liste fest, welche Einträge in einer bestimmten Zelle
    erlaubt sind. Praktisch: Mit diesen Listen beschleunigen Sie zudem die Dateneingabe.
    Die erlaubten Einträge werden nämlich einfach per Mausklick in die Zelle übernommen.


    Fensterbereich eingeblendet. Tippen Sie hier nacheinander durch Semikolons getrennt
    die erlaubten Einträge ein. Befinden sich diese Einträge bereits in Ihrer Tabelle,
    klicken Sie auf das Symbol im Textfeld „Quelle“. Markieren Sie anschließend in
    der Tabelle den Bereich, in dem die gewünschten Einträge zu finden sind. Drücken
    Sie die Enter-Taste, um zu dem Dialogfeld zu wechseln. Schließen Sie dieses mit
    Klick auf „OK“.


    +   1. Markieren Sie die Zelle, in der nur bestimmte Einträge erlaubt sein sollen.
    Im Menü „Daten“ klicken Sie auf den Eintrag „Gültigkeit“.

    +   2. Im folgenden Dialogfeld klicken Sie im Listenfeld unter „Zulassen“ auf
    den Eintrag „Liste“. Das Eingabefeld „Quelle“ wird im unteren Fensterbereich eingeblendet.

    +   3. Nachdem Sie das Dialogfeld mit der Schaltfläche „OK“ beendet haben, erscheint
    neben der markierten Zelle ein Pfeil. Klicken Sie auf diesen Pfeil, klappt ein
    DropDown-Menü heraus, und Sie sehen die Einträge, die in dieser Zelle erlaubt
    sind. Per Mausklick wählen Sie den richtigen Eintrag aus.'
  merge: -1
  img_proc: true
- pgno: 68
  md: '# Den Zellencursor bändigen


    Standardmäßig bewegt Excel nach dem Drücken der Eingabetaste den Zellencursor
    zur nächsten Zelle in der darunter liegenden Zeile. Diese Richtung lässt sich
    aber einstellen.


    1 Um den Zellencursor Ihren Bedürfnissen anzupassen, klicken Sie auf den Menüeintrag
    „Extras“ in der Menüleiste. Im Menü wählen Sie den Eintrag „Optionen“ aus. Das
    Dialogfeld „Optionen“ öffnet sich. Klicken Sie in diesem Dialogfenster auf das
    Register „Bearbeiten“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_68_0.png)


    2 Das Kotrollkästchen „Markierung nach dem Drücken der Eingabetaste verschieben“
    ist standardmäßig aktiviert, also mit einem Häkchen versehen. Entfernen Sie das
    Häkchen mit einem Klick in das Kontrollkästchen, bleibt der Zellencursor zukünftig
    weiter in der aktiven Zelle stehen, wenn Sie die Eingabetaste drücken.


    3 Wollen Sie das nicht, aktivieren Sie das Kontrollkästchen wieder mit einem Mausklick,
    so dass das Häkchen wieder angezeigt wird. Sie können nun mit dem Auswahlfeld
    „Richtung:“ das Verhalten des Cursors beeinflussen.


    4 Ihnen stehen die Richtungen „Unten“, „Oben“, „Rechts“ und „Links“ zur Verfügung.
    Je nach Auswahl wird der Zellencursor in die gewünschte Richtung verschoben, wenn
    Sie die Eingabetaste betätigen. Mit einem Klick auf „OK“ übernehmen Sie Ihre Einstellung.


    # Ordnung in Dezimalzahlen bringen


    Bei der Eingabe von Zahlenkolonnen mit einer festen Anzahl von Dezimalstellen
    können Sie sich eine Menge Arbeit sparen: Lassen Sie Excel das Dezimalkomma automatisch
    setzen.


    1 Klicken Sie auf den Eintrag „Optionen“ im Menü „Extras“. Das Dialogfenster „Optionen“
    öffnet sich. Wählen Sie das Register „Bearbeiten“ aus.


    2 Aktivieren Sie das Kontrollkästchen „Feste Dezimalstellen setzen“ und bestimmen
    Sie die gewünschte Stellenzahl, in unserem Beispiel „2“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_68_1.png)


    3 Klicken Sie auf „OK“, und geben Sie Ihre Zahlenkolonne ein.


    4 Bei der Eingabe Ihrer Zahlen ergreift Excel jetzt die Initiative und fügt automatisch
    Kommas für Sie ein. Diese Art der Eingabe ist zunächst ungewohnt. Aus der Eingabe
    „12999“ macht Excel den Wert „129,99“, wenn Sie die Eingabetaste drücken. Nach
    einer kurzen Eingewöhnungsphase werden Sie diese Option aber als sehr hilfreich
    empfinden.


    5 Vergessen Sie nicht, die Option wieder zu deaktivieren, nachdem Sie die Zahlenkolonnen
    eingegeben haben. Klicken Sie dazu im Menü auf „Extras“ und im folgendem Untermenü
    auf „Optionen“. Aktivieren Sie das Register „Bearbeiten“, und deaktivieren Sie
    das Kontrollkästchen „Feste Dezimalstellen setzen“. Mit einem Mausklick auf „OK“
    können Sie die Werte wieder wie gewohnt eingeben.


    # TIPP Schnell rechnen ohne Formeln


    Wenn Sie es eilig haben, kommen Sie auch ohne Eingabe von Formeln zu den richtigen
    Rechenergebnissen: Markieren Sie mehrere Zahlenfelder in Ihrem Excel-Arbeitsblatt.
    In der Statusleiste zeigt Ihnen Excel automatisch die Summe aller markierten Zellen
    an. Das ist in vielen Fällen schon eine schnelle Hilfe, aber Excel hat noch mehr
    zu bieten. Wenn Sie mit der rechten Maustaste in den Summenwert der Statusleiste
    klicken, erscheint ein Kontextmenü. Mit diesem Menü können Sie zusätzlich den
    Minimalwert, den Maximalwert, die Anzahl und den Mittelwert der markierten Zellen
    errechnen lassen. Auch ein Zählen der markierten Zellen ist möglich. Bedenken
    Sie aber: Excel zählt nur die Zellen mit numerischem Inhalt, keine Textfelder.


    # TIPP Versteckte Sonderformate


    Oft benötigen Sie in Excel Sonderformate wie zum Beispiel eine Postleitzahl. Solche
    Sonderformate verstecken sich bereits im Formatierungsbefehl. Um auf die Sonderformate
    zu kommen, klicken Sie im Menü auf „Format“ und im folgendem Menü auf „Zellen“.
    Das Dialogfenster „Zellen“ erscheint. Wählen Sie dort das Register „Zahlen“. Hier
    finden Sie bei den Kategorien den Eintrag „Sonderformat“. Klicken Sie einmal auf
    diesen Eintrag. Im rechten Fensterteil sehen Sie dann im Auswahlmenü der Formate
    die Sonderformate „Postleitzahl“, „Versicherungsnachweis-Nr“ und „ISBN-Format“.
    Excel zeigt das Ergebnis der Sonderformate direkt in der Vorschau.


    # Druckbereiche optimal festlegen


    Nicht immer soll ein komplettes Arbeitsblatt ausgedruckt werden. Weit häufiger
    sind nur Teile davon für den Ausdruck bestimmt. Um das zu erreichen, legen Sie
    vor dem Drucken den Druckbereich fest.


    1 Klicken Sie in der Menüleiste den Befehl „Datei“ an. Im darauf hin erscheinenden
    Untermenü wählen Sie den Eintrag „Seite einrichten“ aus. Das neue Dialogfenster
    „Seite einrichten“ öffnet sich.'
