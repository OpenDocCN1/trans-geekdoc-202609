    Die Landkarten-Funktion von Excel bietet Ihnen die Möglichkeit, Daten geografisch
    zu veranschaulichen. Dabei ist es wichtig, dass Sie zuerst die Tabelle mit den
    Daten anlegen und dann die Landkarte. Weiterhin ist es bedeutend zu wissen, dass
    Sie als Kartenmerkmale nur Regionen, Länder oder Kontinente bestimmen können.
