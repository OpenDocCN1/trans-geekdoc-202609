- pgno: 77
  md: '# TIPP Zeichnen-Werkzeuge einstellen


    Mit Excel können Sie frei zeichnen. Um die Zeichenfunktionen zu aktivieren, klicken
    Sie in der Symbolleiste auf das Symbol „Zeichnen“. Daraufhin erscheint eine spezielle
    Symbolleiste mit Werkzeugen zum Zeichnen. Jetzt können Sie die unterschiedlichen
    Symbole zum Zeichnen anklicken und die entsprechenden Elemente zeichnen. Einen
    Nachteil hat dieses Vorgehen jedoch: Nach jedem gezeichneten Objekt deaktiviert
    Excel das aktuelle Werkzeug wieder. Möchten Sie beispielsweise mehrere Linien
    zeichnen, so müssen Sie bei jeder zu zeichnenden Linie wieder das Symbol „Linie“
    anklicken. Das lässt sich vermeiden: Um ein Werkzeug zum Zeichnen dauerhaft zu
    aktivieren, klicken Sie doppelt auf das entsprechende Icon. Jetzt können Sie das
    aktivierte Element so lange einsetzen, bis Sie mit der „Esc-Taste“ das Werkzeug
    wieder deaktivieren.


    # TIPP Diagramm auf die Schnelle


    Es ist hin und wieder ganz praktisch, wenn Sie sich Ihre Daten in einem Diagramm
    ansehen können. Müssen Sie jedoch jedes Mal den Diagrammassistenten bemühen, um
    ein Diagramm zu erstellen, vergeht Ihnen bald die Lust dazu, sich die Daten auf
    die Schnelle in Diagrammform anzusehen. Dabei gibt es einen einfachen Trick, wie
    Sie Diagramme ohne großen Aufwand erstellen können: Markieren Sie die Daten, die
    Sie im Diagramm sehen möchten, und drücken Sie die Tastenkombination „Alt“ + „F1“.
    Excel fügt daraufhin ohne Nachfrage ein neues Diagrammblatt in die Arbeitsmappe
    ein. In dieser Diagrammtabelle wird Ihr Diagramm dann ganzseitig dargestellt.


    # Spezialfilter anwenden


    Mit dem benutzerdefinierten Autofilter können Sie bis zu zwei Kriterien gleichzeitig
    filtern. Excel bietet Ihnen aber auch die Möglichkeit, nach beliebig vielen Kriterien
    zu filtern. Dazu ist es allerdings nötig, dass Sie den Kriterienbereich an einer
    Stelle außerhalb der zu filternden Liste erstellen und dann den „Spezialfilter“
    einsetzen.


    1 Sie haben eine Liste von Reiseveranstaltern und deren Angebote erstellt (diese
    finden Sie auf unserer weißen Heft-CD unter „Excel-Vorlagen“). Sie wollen die
    günstigsten Angebote nach Frankreich (Maximalpreis: 1499 Mark), in die Türkei
    (hier sind Sie bereit, maximal 999 Mark zu zahlen) und nach Griechenland (hier
    wollen Sie nicht mehr als 899 Mark bezahlen) filtern.


    2 Erstellen Sie außerhalb des Listenbereichs einen Filterbereich. Geben Sie die
    Überschriften des Filterbereichs ein, zum Beispiel „Urlaubsorte“ und „Günstigste
    Angebote“. Diese Überschriften müssen identisch mit den Überschriften in der auszuwertenden
    Liste sein. Auch die Groß- und Kleinschreibung muss übereinstimmen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_77_0.png)


    3 Tippen Sie unterhalb der „Urlaubsorte“ die gesuchten Orte ein, in unserem Beispiel
    „Frankreich“, „Türkei“ und „Griechenland“. Geben Sie unterhalb der Überschrift
    „Günstigste Angebote“ die Werte „<1500“, „<1000“ und „<900“ ein.


    4 Klicken Sie in den Listenbereich Ihrer Urlaubsdaten und auf die Befehle „Daten“,
    „Filter“ und „Spezialfilter“.


    5 Excel blendet das Dialogfeld „Spezialfilter“ ein. Wählen Sie hier im Bereich
    „Aktion“ die Option „Liste an gleicher Stelle filtern“. Der Listenbereich ist
    durch das vorherige Klicken in die Datenliste bereits richtig markiert. Markieren
    Sie jetzt im „Kriterienbereich“ den Bereich, in den Sie die Filterkriterien geschrieben
    haben. Der Bereich muss sowohl die Überschriften als auch die Filterdaten enthalten.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_77_1.png)


    6 Mit „OK“ wird die Filterfunktion ausgeführt, und es werden nur noch die gefilterten
    Datensätze angezeigt. Um wieder alle Datensätze sichtbar zu machen, betätigen
    Sie im Menü den Befehl „Daten“. Dann gehen Sie im folgenden Untermenü mit dem
    Cursor auf „Filter“ und klicken auf den Eintrag „Alle anzeigen“.


    # Werte im Diagramm ändern


    Die in einem Diagramm dargestellten Werte beziehen sich immer auf konkrete Zahlenwerte
    aus einem Feld der Excel-Tabelle. Im Normalfall werden Werte in einem Diagramm
    geändert, indem Sie die entsprechenden Werte in der Quelldatei, also im Excel-Arbeitsblatt,
    ändern. Es funktioniert auch andersherum.


    1 Klicken Sie im Diagramm den zu verändernden Wert, zum Beispiel einen Balken,
    zweimal nacheinander an, so dass er markiert ist. Achten Sie dabei darauf, dass
    Sie keinen Doppelklick ausführen.


    2 Jetzt greifen Sie den Balken am oberen Markierungspunkt mit dem Cursor an, halten
    die linke Maustaste gedrückt und ziehen den Balken nach oben oder unten. Sobald
    der gewünschte Wert erreicht ist, lassen Sie die Maustaste los.


    3 Damit erzielen Sie nicht nur einen kosmetischen Effekt: Diese Manipulation am
    Diagramm verändert auch den Wert in der verknüpften Zelle zu diesem Diagramm.
    P. Schnoor/pm


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_77_2.png)'
  merge: -1
  img_proc: true
- pgno: 78
  md: "![](img/5f36a0372e5f0f300d0bad16e6a18053_78_0.png)\n\n# TIPP Diagramme aktualisieren\n\
    \nExcel aktualisiert das dazugehörige Diagramm automatisch, wenn Sie einen Datenwert\
    \ verändern. Doch diese Eigenschaft funktioniert auch in die andere Richtung.\
    \ Dazu markieren Sie in dem gewünschten Diagramm beispielsweise ein Element eines\
    \ Balkendiagramms.\n\nZiehen Sie nun mit der Maus am Rand des Balkens die Säule\
    \ in die gewünschte Höhe. Je nach Veränderung passt sich der Zahlenwert in der\
    \ Tabelle ebenfalls an. Allerdings bedarf es bei diesem Vorgehen etwas Fingerspitzengefühl,\
    \ um einen bestimmten Wert zu erreichen.\n\n![](img/5f36a0372e5f0f300d0bad16e6a18053_78_1.png)\n\
    \n# TIPP Datenreihe hinzufügen\n\nExcel bietet die einfache Möglichkeit, ein Diagramm\
    \ mit wenigen Handgriffen um eine Datenreihe zu ergänzen. Sie müssen also nicht\
    \ immer ein komplettes neues Diagramm erstellen.\n\nMarkieren Sie dazu die neue\
    \ Datenreihe mit der Maus, und bewegen Sie den Mauszeiger auf die Markierungsumrandung.\
    \ Halten Sie die linke Maustaste gedrückt, und ziehen Sie die Reihe einfach in\
    \ das bestehende Diagramm. Nach dem Loslassen der Taste fügt Excel die neuen Daten\
    \ in die Darstellung ein, und alles erscheint im gleichen Layout.\n\n# Nummerierung\
    \ abhängig vom Inhalt\n\nSie möchten in einer Spalte eine automatische Nummerierung\
    \ ausführen – abhängig davon, ob in der Zelle neben der Spalte ein Eintrag vorhanden\
    \ ist. Hierzu existieren zwei Möglichkeiten.\n\n+   1. In der ersten Variante\
    \ orientieren Sie sich an der Zellennummerierung von Excel, also mit dem Wert\
    \ 1 in der ersten Zelle A1 beginnend. Dabei wird überprüft, ob sich ein Wert in\
    \ der Spalte B befindet.\n\n+   2. Tragen Sie in der Zelle A1 folgende Formel\
    \ ein:\n+   =WENN(NICHT(ISTLEER(B1));ZEILE();)\n+   Anschließend kopieren Sie\
    \ die Formel in die darunter liegenden Zellen.\n\n![](img/5f36a0372e5f0f300d0bad16e6a18053_78_2.png)\n\
    \n+   3. Soll hingegen in einer beliebigen Zelle der Spalte A die Nummerierung\
    \ mit der Zellennummer starten, beispielsweise in der Zelle A12 der Wert 12 stehen,\
    \ fügen Sie folgende Formel ein:\n+   =WENN(NICHT(ISTLEER(B12));ZEILE(A12);)\n\
    \n+   4. Auch hier kopieren Sie anschließend die Formel nach unten.\n\n# Symbolleisten\
    \ wiederherstellen\n\nBeim Aufspielen einer neuen (aktuellen) Excel-Version auf\
    \ den Rechner, gehen definierte Symbolleisten im ersten Schritt verloren, denn\
    \ sie werden nicht standardmäßig übernommen.\n\nDoch mit einigen Handgriffen richten\
    \ Sie Ihre Symbolleisten wieder so ein, wie Sie es wünschen.\n\n+   1. Wie vor\
    \ jeder Änderung einer Software fertigen Sie im ersten Schritt eine Sicherung\
    \ der aktuellen Konfiguration der Symbolleisten an. Denn der Import lässt sich\
    \ nicht mehr rückgängig machen.\n\n+   2. Beenden Sie dazu Excel, und starten\
    \ Sie den Windows Explorer. Suchen Sie im Hauptverzeichnis von Windows (\\Windows)\
    \ und im Unterverzeichnis (\\Windows\\Anwendungsdaten\\Microsoft\\Excel) nach\
    \ Dateien mit der Endung xlb. Hier legt Excel die individuellen Konfigurationen\
    \ der Symbolleisten ab.\n\n+   3. Arbeiten Sie mit Excel innerhalb eines Netzwerkes,\
    \ finden Sie eine xlb-Datei mit Ihrem Namen und einer nachgestellten 8 (Beispiel:\
    \ Mustermann8.xlb). Arbeiten Sie auf einem einzelnen Gerät, halten Sie Ausschau\
    \ nach der Datei Excel.xlb. Dabei steht die 8 für Excel 97, bei Excel 95 suchen\
    \ Sie nach einer 5. Die neue Version Excel 2000 verzichtet auf eine Zahl.\n\n\
    +   4. Erstellen Sie eine Sicherungskopie der Datei, indem Sie diese unter einem\
    \ anderen Namen, zum Beispiel Sicher.xlb, ablegen.\n\n+   5. Starten Sie Excel,\
    \ und laden Sie über den Menüpunkt Datei und Öffnen die ältere xlb-Datei. Noch\
    \ ändert sich nichts an Ihrer Symbolleiste. Rufen Sie jedoch den Menüpunkt Symbolleisten\
    \ unter Ansicht auf, zeigt Excel wieder die alten Symbole an. Beachten Sie, dass\
    \ die importierten Symbole nun ein fester Bestandteil von Excel sind.\n\n# Werte\
    \ farbig hervorheben\n\nSie können in Excel Zahlen, abhängig von ihrem Wert, problemlos\
    \ farbig darstellen.\n\n+   1. Geben Sie die gewünschten Zahlen in ein Excel-Sheet\
    \ ein. Dabei ist die Anordnung belanglos. Markieren Sie die Werte.\n\n+   2. Gehen\
    \ Sie per Maus zu den Menüpunkten Format und Zellen. Im Register Zahlen wählen\
    \ Sie die Kategorie Benutzerdefiniert. In das Eingabefeld geben Sie folgende Parameter\
    \ ein: [Blau]< =10]#.##0;[Rot]<15]#.##0;[Grün]#.##0\n+   \n+   Bestätigen Sie\
    \ die Eingabe. Zahlen bis zum Wert 10 werden nun in Rot, von 11 bis 14 in Blau\
    \ und ab 15 in Grün dargestellt. Allerdings können Sie nicht mehr als drei Farbzuweisungen\
    \ vornehmen, da sonst Excel Ihre Eingabe ignoriert."
