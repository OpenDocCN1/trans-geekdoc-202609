- pgno: 51
  md: '# Office-Tips: Excel


    Schaltfläche "Suchkriterien". Die leere Maske benutzen Sie, um die Kriterien festzulegen.
    Drücken Sie die Eingabetaste und Excel sucht den nächsten entsprechenden Datensatz.
    Um sich alle entsprechenden Sätze anzusehen, müssen Sie auf "nächsten suchen"
    klicken. Zum Löschen der eingegebenen Kriterien klicken Sie auf "Suchkriterien"
    und dann auf die Schaltfläche "Inhalte löschen".


    # 115 Daten schnell sortiert


    Wollen Sie Daten innerhalb einer Spalte sortieren, dann markieren Sie zunächst
    einmal die entsprechende Spalte. Klicken Sie dann auf der beiden "Sortieren"-Schaltflächen
    in der Symbolleiste: Aufsteigend sortiert in alphabetischer Reihenfolge bzw. Zahlen
    vom niedrigen zum hohen Wert. Absteigend sortiert jeweils genau anders herum.


    # 116 Mehrfache Sortieroptionen


    Für das Sortieren einer Zeile eignet sich die Sortier-Schaltfläche sehr gut. Wollen
    Sie allerdings innerhalb einer Sortierung noch einmal eine weitere vornehmen etc.,
    dann müssen Sie auf die Menüleiste zurückgreifen. Wählen Sie "Daten" und "Sortieren".
    Stellen Sie erst einmal sicher, daß die Schaltfläche "Überschriften" aktiviert
    ist. Diese Option verhindert nämlich, daß die Spaltenüberschrift mit den restlichen
    Daten sortiert wird. Nun können Sie drei Sortieroptionen eingeben und jedesmal
    entscheiden, ob Sie eine aufsteigende oder absteigende Sortierung wünschen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_51_0.png)


    # 117 Benutzerdefinierte Sortierung


    Wollen Sie Monate sortieren, dann hilft Ihnen die alphabetische Sortierung nicht
    sehr viel weiter. Für solche Fälle hat Excel eine benutzerdefinierte Sortierung
    zur Verfügung. Wählen Sie dafür "Extras" und "Optionen". Klicken Sie auf die Registerkarte
    "AutoAusfüllen". Nun klicken


    Sie auf "Tabelleneinträge". Dort tragen Sie die Namen ein, die Sie sortiert haben
    möchten. Betätigen Sie nach jedem Eintrag die Return-Taste. Am Schluß klicken
    Sie auf "Einfügen" und auf "OK". Nun klicken Sie auf eine beliebige Zelle und
    wählen "Daten" und "Sortieren". Im Bereich "Sortieren nach" wählen Sie die entsprechende
    Option aus. Nun klicken Sie auf die Schaltfläche "Optionen". Wählen Sie im Drop-Down-Feld
    die entsprechende, gerade eben erstellte Liste aus. Klicken Sie auf "OK".


    # 118 AutoFilter einrichten


    Mit Hilfe dieser Funktion können Sie sich nur die gerade eben relevanten Daten
    anzeigen lassen, Teilergebnisse ermitteln etc.


    1 Klicken Sie auf eine beliebige Zelle Ihrer Tabelle. Wählen Sie "Daten" und "Filter"
    und hier "AutoFilter". Wählen Sie den AutoFilter Drop-Down-Pfeil neben einer Spaltenüberschrift
    aus.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_51_1.png)


    2 Excel zeigt alle bereits vorhandenen Eingaben an. Sobald Sie einen Eintrag markieren,
    werden nur die Daten, die dazu gehören, herausgefiltert und Ihnen präsentiert.
    Wiederholen Sie diese Schritte für jede einzelne Spalte. Sobald der AutoFilter
    aktiviert ist, werden die gefilterten Daten blau hinterlegt. Am unteren Bildschirmrand
    wird eine Statuszeile sichtbar, die anzeigt, wie viele Daten gefiltert wurden.


    # 119 Benutzerdefinierte Filter


    Wollen Sie nicht nur einen Filter setzen, sondern eine Auswahl aus verschiedenen
    Faktoren zu m Einsatz bringen, dann benötigen Sie die Option für die "Spezialfilter".


    1 Stellen Sie zunächst einmal sicher, daß die AutoFilter-Funktion eingeschaltet
    ist. ("Daten", "Filter", "AutoFilter") Klicken Sie auf den Pfeil des Drop-Down-Listenfeldes
    neben einer der Spaltenüberschriften und dann auf die Option "Benutzerdefiniert"
    im Listenfeld. Nun wird der Name der Felder angezeigt, für die die Spezialfilter-Funktion
    durchgeführt wird.


    2 Klicken Sie nun auf den schwarzen Pfeil und wählen Sie "ist größer oder gleich".
    Drücken Sie die Tabulator-Taste, um ins nächste Feld zu springen. Dort tragen
    Sie den einen Wert, zum Beispiel 10000, ein.


    3 Wählen Sie nun "und" aus und dort "ist kleiner oder gleich". Im Textfeld geben
    Sie 30000 ein. Bestätigen Sie mit "OK". Nun werden alle Daten gefiltert, die einen
    Wert zwischen 10.000 und 30.000 haben.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_51_2.png)


    # 120 Die Teilergebnis-Funktion


    Die Teilergebnis-Funktion erlaubt es, Daten nach einem bestimmten Feld mathematisch
    zusammenzufassen. Dies kann eine Summe, ein Mittelwert, ein Maximum, ein Produkt
    etc. sein. Klicken Sie auf die Spalte, aus der Sie das Teilergebnis ermitteln
    möchten und dann auf die Schaltfläche "Sortieren aufsteigend" oder "Sortieren
    absteigend". Wählen Sie "Daten" und "Sortieren", um verschiedene Sortierkriterien
    zu definieren. Die Spalte, deren Teilergebnis Sie ermitteln möchten, muß unbedingt
    vorher sortiert sein. Wählen Sie nun "Daten" und "Teilergebnisse". Hinter "Gruppieren
    nach" geben Sie ein Kriterium ein. Im Feld "Unter Verwendung von" wählen Sie nun
    mit Hilfe des schwarzen Pfeiles zum Beispiel die Summe-Funktion aus. Unter "Bezogen
    auf" wählen Sie wiederum den entsprechenden Bereich aus. Klicken Sie auf "OK".


    # 121 Pivot-Tabellen nutzen


    Pivot-Tabellen sind sogenannte Kreuztabellen. Diese ermöglichen es, die Daten
    beliebig zu sortieren und umzuschichten, so daß sehr schnell unterschiedliche
    Aussagen aus den Tabellen herausgezogen und Ergebnisse besser analysiert werden
    können.


    1 Erstellen Sie zur Übung erst einmal eine kleine Tabelle. Klicken Sie in die
    Tabelle und wählen Sie "Daten" und hier "Pivot-Tabellenbericht". Die Option "MS
    Excel-Datenbank oder -Liste" sollte aktiviert sein.


    2 Geben Sie nun den Bereich der Daten an, die Sie aufbereiten möchten. Normalerweise
    hat Excel bereits einen Bereich vorgegeben. Klicken Sie nun auf "Weiter".


    3 Ziehen Sie nun die Felder in die entsprechenden Bereiche, um das Layout festzulegen.
    Klicken Sie auf "Weiter". Legen Sie fest, an welcher Stelle der Tabelle die Pivot-Tabelle
    erscheinen soll. Nun klicken Sie auf "Ende" und der Bericht wird erstellt.'
