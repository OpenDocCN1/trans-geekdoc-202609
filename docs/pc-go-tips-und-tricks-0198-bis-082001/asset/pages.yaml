- pgno: 49
  md: '# Office-Tips: Excel


    # 106 Bestimmte Zeilen und Spalten auf allen Seiten


    Wenn lange Arbeitsblätter über mehrere Seiten gedruckt werden, werden die Kopfzeilen,
    die Sie zu Beginn eines Blattes geschrieben haben, auf die erste Seite gedruckt,
    aber nicht auf die nachfolgenden. Ebenso wird es mit den Spalten und Zeilenkennungen
    gehandhabt.


    1 Es gibt eine Option mit dem Namen "Drucktitel", die es Ihnen ermöglicht, Spalten
    und Zeilenüberschriften auf jeder Ausdruckseite zu übernehmen. Wählen Sie "Datei
    und "Seite einrichten". Klicken Sie auf das Register "Tabelle". Klicken Sie auf
    den Abschnitt "Drucktitel Wiederholungszeilen" und schieben Sie das Dialogfenster
    aus dem Sichtbereich. Nun holen Sie sich die Zeilen auf den Bildschirm, die Sie
    auf jeder Druckseite sehen möchten.


    2 Ziehen Sie mit der Maus bei gedrückter linker Maustaste über diese Zellen. Klicken
    Sie nun auf die Spalten, die im linken Textfeld wiederholt werden sollen. Klicken
    Sie auf die Schaltfläche Seitenansicht auf der rechten Seite der Dialogbox. So
    erhalten Sie eine Vorschau vor dem Druck.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_49_0.png)


    # 107 Zellkommentare drucken


    Über "Einfügen" und "Kommentar" können Sie jeder Zelle eigene Kommentare hinzufügen.
    Diese werden sichtbar, wenn die Maus über die Zelle gleitet. Sie können auch den
    Inhalt aller Kommentare in einem Arbeitsblatt drucken.


    1 Wählen Sie "Datei" und "Seite einrichten". Klicken Sie auf das Register "Tabelle"
    und dann auf das Dropdown-Listenfeld "Kommentare".


    2 Wählen Sie nun in der Menüleiste "Ansicht" und "Kommentare". Klicken Sie dann
    auf einen Kommentar und bewegen Sie den Cursor auf den Rand, bis er ein Kreuz
    zeigt. Nun klicken Sie die Ecke des Kommentars an und ziehen diesen an seinen
    neuen Bestimmungsort am Ende der Tabelle.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_49_1.png)


    "Drucken". Klicken Sie nun unter "Drucken" auf das Kontrollkästchen vor "Markierung".
    Sobald Sie einen markierten Bereich gedruckt haben, können Sie erneut auf das
    Drucken-Symbol in der Standard-Symbolleiste klicken. Excel wird denselben Bereich
    nochmals ausdrucken.


    2 Wollen Sie den Bereich entfernen, wählen Sie "Datei", "Druckbereich" und hier
    "Druckbereich aufheben". Wollen Sie mehrere Bereiche ausdrucken, dann markieren
    Sie zuerst den ersten Bereich. Halten Sie dann die Strg-Taste gedrückt und markieren
    Sie weitere Bereiche. Klicken Sie auf "Datei" und "Drucken". Unter "Drucken" aktivieren
    Sie erneut das Kontrollkästchen vor "Markierung". Die Bereiche werden einzeln
    auf separate Seiten gedruckt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_49_2.png)


    3 Sie können mehrere Bereiche nicht auf derselben Seite drucken lassen, aber Sie
    können Spalten und Zeilen verstecken, die zwischen mehreren Druckbereichen liegen.
    Markieren Sie die Spalten-/Zeilenkennungen und betätigen Sie die rechte Maustaste.
    Im Kontextmenü klicken Sie auf "Ausblenden". So können Sie das Arbeitsblatt verkleinern,
    und wichtige Bereiche unter Umständen auf nur eine Druckseite bringen.


    # 105 Druckbereiche benennen


    Sie können auch den verschiedenen Druckbereichen Namen zuweisen. Auf diese Namen
    können Sie sich dann beim Drucken oder Markieren beziehen. Markieren Sie den zu
    benennenden Druckbereich. Wählen Sie "Einfügen" "Namen" und "Festlegen" und geben
    Sie den Namen für den Bereich ein. Klicken Sie nun auf die Hinzufügen-Schaltfläche
    und danach auf "OK". Ihr Name darf kein Leerzeichen enthalten. Verwenden Sie unter
    Umständen einen Unterstrich, um eine Aufteilung im Namen darzustellen. Wiederholen
    Sie die Schritte für jeden Bereich, dem ein Name zugewiesen werden soll.


    Wollen Sie die benannten Bereiche ausdrucken, klicken Sie auf den Pfeil im Namensfeld
    in der Symbolleiste. Markieren Sie den entsprechenden Bereich und wählen Sie "Datei",
    "Drucken". Aktivieren Sie hier wiederum "Markierung".'
