- pgno: 35
  md: '# Tabellen optimieren


    Angenommen, Sie haben aus einer Tabelle ein Balkendiagramm erstellt, das aber
    falsch sortiert ist. Statt einer aufsteigenden Sortierung möchten Sie lieber eine
    absteigende.


    1 Damit Sie das erreichen, klicken Sie die horizontale (x-) Achse doppelt an.


    2 Im Dialogfeld wählen Sie dann die Registerkarte "Skalierung" aus. Setzen Sie
    ein Häkchen vor die Option "Rubriken in umgekehrter Reihenfolge". Das →Diagramm
    wird sofort neu gezeichnet.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_35_0.png)


    3 Wollen Sie Beschriftungen des Diagramms, etwa Titel, Achsenbezeichnungen und
    Legenden verschieben, müssen Sie diese lediglich mit der Maus anklicken und bei
    gedrückter Maustaste an die entsprechende Stelle verschieben. Um den Titel des
    Diagramms zu verändern, müssen Sie diesen doppelt anklicken. Dann erscheint ein
    Dialogfeld. Mit Hilfe der →Registerkarte


    "Schrift" können Sie dann Formatierungen vornehmen.


    4 Sie können auch den Hintergrund des Balkendiagrammes einfärben. Dazu klicken
    Sie eine freie Stelle der Diagrammfläche an. Es öffnet sich eine Symbolleiste
    zur Diagrammfläche. Klicken Sie hier auf das Symbol mit der Hand und das Dialogfeld
    "Diagrammfläche formatieren" erscheint. Hier können Sie auf der Registerkarte
    "Muster" eine passende Füllfarbe und einen Rahmen aussuchen. Der Rahmen ist nur
    optional. Für ein tolles Design stehen eine ganze Menge Gestaltungsmöglichkeiten
    zur Auswahl (über die Schaltfläche "Füllbereiche"). Klicken Sie eine passende
    Struktur an.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_35_1.png)


    5 Anstelle von vorgegebenen Strukturen und Mustern können Sie auch fertige Grafiken
    importieren. Diese können Sie über die Schaltfläche "Weitere Strukturen" oder
    über das Register "Grafik" und "Grafik markieren" importieren.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_35_2.png)


    # → Vorlagen


    Benötigen Sie öfters denselben Brief oder ähnliche Rechnungen, empfiehlt es sich,
    diese als Vorlagen zu speichern. Dazu geben Sie nur die immer gleich bleibenden
    Einheiten ein. Zum Beispiel die Adressblöcke, das Datum, die Anrede. Diese formatieren
    Sie korrekt und müssen dann nur für jede neue Rechnung die Anschrift ersetzen
    und sie als Dokument abspeichern.


    # → AutoEingabe


    Wiederholen sich bestimmte Eingaben, dann tritt die AutoEingabe in Erscheinung.
    Haben Sie etwa bereits irgendwo auf dem Tabellenblatt die Worte "Konto" und "Kunde"
    eingegeben, müssen Sie nur noch die ersten beiden Buchstaben eintippen und Excel
    vervollständigt bei Bedarf den Namen. Tippen Sie also "Ku" ein, macht Excel "Kunde"
    daraus. Wollen Sie das nicht, tippen Sie einfach weiter. Möchten Sie den Vorschlag
    übernehmen, drücken Sie die "Return"-Taste. Stört Sie diese automatische Form
    der Eingabe, wählen Sie in der Menüleiste "Extras/Optionen". Hier löschen Sie
    unter der Registerkarte "Bearbeiten" das Häkchen vor "AutoEingabe für Zellwerte
    aktivieren".


    # → Diagramme


    Das sind Schaubilder, mit denen Tabellen grafisch umgesetzt werden. Es gibt verschieden
    Arten Diagramme: Balkendiagramme, Kreisdiagramme, Liniendiagramme und viele mehr.
    Jede Art eignet sich für eine bestimmte Tabelle. Bei einer Hochrechnung zur Wahl
    wir meist ein Kreisdiagramm verwendet. Wenn es mehrere Variablen gibt, bieten
    sich Balken- oder Liniendiagramme an. Eine große Auswahl bereits vorformatierter
    Diagramme sind in Excel schon integriert. Die Beschriftung ist sehr einfach.


    # Mehrere Befehle rückgängig machen


    Neu in Excel 97 ist das Rückgängigmachen mehrerer Befehle gleichzeitig. Sie müssen
    also nicht der Reihe nach die letzten fünf Befehle zurücknehmen, sondern erledigen
    das in einem.


    1 Dies geht sowohl über das Menü "Bearbeiten" (mit dem Punkt "Rückgängig") als
    auch über die Symbolleiste. In der Bearbeitungsleiste wird immer angezeigt, welcher
    Schritt gerade rückgängig gemacht wird.


    2 In der →Symbolleiste klicken Sie auf das schwarze Dreieck neben dem blauen Pfeilsymbol.
    Eine Auswahlliste öffnet sich. Hier müssen Sie die Aktion(en) markieren, die Sie
    zurücknehmen möchten. Eine Mehrfachauswahl ist möglich.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_35_3.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_35_4.png)


    # Arbeitsmappe im Ausdruck benennen


    Sie haben eine Tabelle angelegt und möchten im Ausdruck nun auch automatisch den
    Namen der Arbeitsmappe – ohne den Verzeichnispfad – einfügen.


    1 Um den Dateinamen einschließlich des Verzeichnispfades einzugeben, können Sie
    einfach auf eine Excel-Funktion zurückgreifen. Dazu geben Sie in die entsprechende
    Zelle folgendes ein:


    ```

    =ZELLE("Dateiname")

    ```


    2 Möchten Sie nur den Dateinamen einfügen, können Sie die folgende Funktion verwenden:


    Allerdings muß die Datei bereits einmal gespeichert sein, um die Funktion auch
    wirksam werden zu lassen. Dazu wählen Sie in der Menüleiste "Datei" und hier "Speichern
    unter". Vergeben Sie einen Namen und speichern Sie die Datei im richtigen Ordner.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_35_5.png)'
  merge: -1
  img_proc: true
- pgno: 36
  md: '# → Symbolleiste


    Hier sind die meist verwendeten Befehle der Menüleiste noch einmal als Schaltfläche
    dargestellt. Symbolleisten können über das "Ansicht"-Menü ausgewählt werden. Hier
    sind bestimmte Funktionen bereits gegliedert. In der "Format"-Symbolleiste sind
    etwa die Befehle zum Fettdruck, zur Schriftgröße, zum Zentrieren etc. enthalten.
    Die Symbolleiste erleichtern das Arbeiten, da sie schnell ausgewählt werden können
    und nicht erst das Menü aufgerufen werden muss.


    # → Registerkarte


    Sie finden die Registerkarten bei fast allen Menüs des Office-Paketes. Auf der
    Registerkarte, die sich an der Oberseite eines Fensters befindet, ist ein Oberbegriff
    zu verschiedenen Einstellungen angegeben. Klicken Sie auf die Registerkarte, kommen
    Sie in ein weiteres Menü mit Änderungsmöglichkeiten. Diese Art der Zusammenfassung
    sorgt für Übersicht am Bildschirm.


    # → Zelle


    Auf dem Bildschirm wird eine Zelle als grau umrandeter Kasten dargestellt. Darin
    können Zahlen, Formeln oder Texte stehen. Jede Zelle ist genau definiert. Sie
    wird durch Buchstaben und Zahlen gekennzeichnet. Für Spalten werden Buchstaben
    verwendet, für Zeilen Zahlen. Die erste Zelle eines Tabellenblattes hat somit
    die Adresse "A1".


    # TIP Zeilen dazufügen & löschen


    Um schnell eine Zeile zu löschen, gehen Sie so vor: Markieren Sie die Zeile und
    drücken Sie den Shortcut "Strg" und "+". Um eine Zeile zu löschen, markieren Sie
    diese und drücken "Strg" und "-".


    # Kopieren in belegte Zellen


    Oft ist es notwendig, daß Daten innerhalb einer Tabelle kopiert oder verschoben
    werden müssen. Problematisch wird es, wenn der Bereich, in den die Daten verschoben
    werden, bereits Daten enthält. Es gibt allerdings die Möglichkeit, vor dem Einfügen
    die schon eingetragenen Inhalte nach rechts oder nach unten zu schieben.


    1 Markieren Sie zunächst alle →Zellen, die Sie verschieben möchten. Klicken Sie
    dazu auf die erste Zelle des Bereiches, halten Sie die Maustaste gedrückt und
    ziehen Sie den Rahmen über den gesamten Bereich.


    2 Ziehen Sie den Bereich an die neue Stelle. Fahren Sie dazu mit der Maustaste
    zur Zellenbegrenzung. Halten Sie dabei sowohl die rechte Maustaste als auch die
    "Umschalt"-Taste gedrückt, wenn Sie den neuen Bereich einfügen möchten. Dann werden
    die ursprünglichen Zellenformatierungen gelöscht. Drücken Sie die "Umschalt"-Taste
    nicht, dann bleiben Formatierungen erhalten, die Sie unter Umständen gar nicht
    wollen. Beim Kopieren halten Sie Tastenkombination "Strg"- und "Umschalt"-Taste
    gedrückt. Lassen Sie die Maustaste los, können Sie entscheiden, was Sie an dieser
    Stelle einfügen wollen.


    # Bedingte Formatierung


    Eine sehr nützliche Funktion sind die sogenannten "Bedingten Formate". Damit werden
    Werte etwa in grün oder rot dargestellt, wenn Sie eine bestimmte Bedingung erfüllen.
    Markieren Sie zunächst den Tabellenbereich, für den Sie zum Beispiel bestimmte
    Höchst- und Tiefstwerte in der Jahresabrechnung markieren möchten. Klicken Sie
    dann in der Menüleiste auf "Format" und hier auf "Bedingte Formatierung".


    1 Ein Dialogfeld öffnet sich, in das Sie bis zu drei Bedingungen eingeben können.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_36_0.png)


    2 Im ersten Textfeld zu "Bedingung 1" übernehmen Sie "Zellwert ist" und wählen
    dann im Auswahlfeld "größer oder gleich". Im dritten Textfeld daneben können Sie
    entweder einen bestimmten Wert vorgeben (etwa "20000") oder eine Zelladresse etwa
    ("C1") angeben.


    3 Klicken Sie dann auf die Schaltfläche "Format" und weisen Sie dieser Bedingung
    die Farbe grün zu. Die ausgewählte Farbe erscheint im Dialogfeld


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_36_1.png)


    4 Klicken Sie jetzt auf "Hinzufügen". Nun können Sie die zweite Bedingung eingeben.
    Wählen Sie wieder "Zellwert ist" und dieses Mal "kleiner oder gleich". Über "Format"
    wählen Sie hier nun eine rote Farbe zur Kennzeichnung aus. Alle Zahlen, die nun
    die erste Bedingung erfüllen, werden grün, alle, die die zweite Bedingung erfüllen,
    rot angezeigt.


    5 Die bedingte Formatierung wird nur angezeigt, wenn die jeweilige Bedingung erfüllt
    ist. Ändern Sie die Werte, dann wird die Bedingung neu überprüft. Natürlich können
    die bedingten Formate auch für Zellen mit Formeln angewandt werden. Wollen Sie
    das bedingte Format wieder löschen, dann öffnen Sie wieder das Dialogfeld zum
    bedingten Format und klicken dort die Schaltfläche "Löschen" an. Wie alle anderen
    Formatierungen können auch bedingte Formate mit dem Format-Pinsel auf andere Zellen
    übertragen werden.


    # Alle Dateien gleichzeitig schließen


    Statt zu einer Zeit nur eine Datei zu schließen, können Sie alle Dateien im Speicher
    zur selben Zeit schließen.


    1 Sie müssen nicht einmal vorher alle Dateien separat speichern. Halten Sie die
    "Umschalt"-Taste gedrückt, bevor Sie die Maus in die Menüleiste bewegen.


    2 Klicken Sie auf "Datei". Sie sehen den Befehl "Alles schließen". Sind einige
    Dateien noch nicht gespeichert, können Sie das nachholen.'
  merge: -1
  img_proc: true
- pgno: 37
  md: '# → verknüpfen


    Mit Hilfe von Verknüpfungen gewährleisten Sie, daß Ihre Daten immer und überall
    auf dem aktuellen Stand sind. Haben Sie zum Beispiel Teile einer Excel-Tabelle
    nach Word exportiert und ändern Sie dann die Werte in der Tabelle, werden mit
    einer aktivierten Verknüpfung auch die Werte in Word aktualisiert.


    # → Argumente


    Ein Argument ist ein Element einer Formel. Die Formel selbst besteht aus mehreren
    Argumenten. So ist etwa bei der Funktion "RmZ" ein Argument der Zinsatz, ein anderes
    die Laufzeit des Zinses usw.


    # TIP Eigene Diagramme entwerfen


    Um einen eigenen Diagrammtyp zu entwerfen, wählen Sie einen Standardtyp aus und
    formatieren diesen ganz nach Ihren Wünschen. Wählen Sie dann "Diagramm" und "Diagrammtyp".
    Klicken Sie hier auf "Spezial". Wählen Sie nun "Benutzerdefiniert" und klicken
    Sie auf "Hinzufügen". Geben Sie einen Namen ein und klicken Sie auf "OK". Nun
    können Sie das nächste Mal auf Ihr eigenes Diagramm unter dem gerade vergebenen
    Namen zugreifen.


    # TIP Seitenumbruch entfernen


    Beim Drucken hat Excel meist bereits eigene Seitenumbrüche definiert. Diese können
    Sie nicht so ohne weiteres entfernen. Einzige Möglichkeit: Sie setzen selbst einen
    Seitenumbruch oberhalb des von Excel definierten. Setzen Sie Ihren unterhalb,
    werden beide ausgeführt.


    # Eine Excel Verknüpfung einrichten


    1 Öffnen Sie zunächst die Excel-Datei, in der sich die Daten befinden, die Sie
    zum Beispiel mit einer Word-Datei →verknüpfen möchten.


    2 Nun öffnen Sie auch das Word-Dokument. Drücken Sie die Tasten "Alt" + "Tab".
    Drücken Sie so oft auf die "Tab"-Taste, bis sich der blaue Rahmen um das Excel-Programmsymbol
    befindet.


    3 Markieren Sie nun den Bereich der Tabelle, den Sie verknüpfen möchten und drücken
    den Shortcut "Strg+ C" zum Kopieren des Bereiches.


    4 Wechseln Sie nun nach Word. Wählen Sie "Bearbeiten" in der Menüleiste und hier
    "Inhalte einfügen".


    5 Aktivieren Sie im Dialogfeld "Inhalte einfügen" die Option "Verknüpfen". Wählen
    Sie dann aus der Liste "Excel Arbeitsblatt". Bestätigen Sie mit "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_37_0.png)


    Excel-Datei vornehmen, wird auch die Word-Datei aktualisiert.


    6 Wollen Sie noch einen Rahmen um das verknüpfte Objekt ziehen, dann klicken Sie
    mit der rechten Maustaste auf das Objekt. Wählen Sie nun "Format" in der Menüleiste
    und hier "Objekt". Klicken Sie auf die Registerkarte "Farbe und Linien". Wählen
    Sie eine beliebige Einstellung. Klicken Sie auf "OK" und der Rahmen wird eingefügt.


    7 Mit einem Doppelklick auf die eingefügte Excel-Datei wird Excel gestartet und
    die ursprüngliche Anwendung wieder geöffnet.


    # Von der Zeile in die Spalte


    Daten, die Sie kopieren, müssen nicht immer in der gleichen Anordnung eingefügt
    werden. So können zum Beispiel Daten aus Zeilen durchaus auch in Spalten angeordnet
    werden.


    1 Dazu markieren Sie den Bereich, dessen Daten Sie kopieren möchten. Drücken Sie
    dann den Shortcut "Strg+C", um die Daten zu kopieren.


    2 Wählen Sie die erste Zelle des Zielbereiches mit einem linken Mausklick an.
    Jetzt klicken Sie einmal mit der rechten Maustaste. Ein Kontextmenü öffnet sich.


    3 Wählen Sie hier "Inhalte einfügen". Nun öffnet sich ein Dialogfenster.


    4 Aktivieren Sie im Auswahlmenü das Kästchen "Transponieren". Klicken Sie auf
    "OK". Die vorher kopierten Daten sind nun in Spalten angeordnet.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_37_1.png)


    # Kopieren einmal anders


    Den normalen Kopiervorgang per Menü oder Tastatur kennt inzwischen wohl jeder.
    Doch wussten Sie, daß Excel auch Formeln kopiert, die gerade erst eingegeben werden?


    1 Sie haben zum Beispiel in der Zelle A1 die monatliche Rate für Ihr Auto eingetragen.
    In der Zelle A2 steht die Anzahl der zu zahlenden Monatsraten. Nun möchten Sie
    wissen, wieviel Sie insgesamt zahlen müssen und geben die Formel dazu in die Zelle
    A3 ein.


    2 Benötigen Sie die Formel in den nebenstehenden Spalten B3, C3 etc. für weitere
    Autos des Fuhrparks, dann bietet sich das Kopieren während der Eingabe ein.


    3 Markieren Sie den Bereich von A3 bis C3. Geben Sie "=" ein und klicken Sie auf
    A1. Geben Sie das Multiplikationszeichen ein und klicken Sie auf A2. Halten Sie
    die "Strg"-Taste gedrückt und drücken Sie die "Return"-Taste. Nun werden alle
    Informationen der ersten Zelle (A3) in alle anderen noch markierten Zellen übertragen.'
  merge: -1
  img_proc: true
- pgno: 38
  md: '# Der richtige Dreh


    Bisher war es äußerst schwierig, Text in einzelnen Zellen pfiffig und individuell
    anzuordnen. Am einfachsten war noch immer die sture horizontale Ausrichtung. Mit
    Excel 97 hat sich das jetzt geändert. Der Text kann beliebig gedreht werden.


    1 Markieren Sie den Zellbereich, den Sie drehen möchten. Wählen Sie dann in der
    Menüleiste "Format" und hier "Zellen". Wählen Sie die Registerkarte "Ausrichtung".
    Rechts klicken Sie auf das vertikale Ausrichtungsfenster, wenn Sie den Text von
    oben nach unten anordnen möchten.


    2 Klicken Sie auf das rechte Feld, wenn Sie den Text selbst in einem bestimmten
    Winkel anordnen möchten.


    3 Klicken Sie dann auf das Wort "Text" im Vorschaufenster. Halten Sie die Maustaste
    gedrückt und ziehen Sie das Wort nach oben oder nach unten. Auf diese Weise können
    Sie selbst den Winkel einstellen.


    4 Das geht natürlich auch numerisch, indem Sie in das Feld "Winkelgrad" die entsprechende
    Zahl eingeben. Bestätigen Sie Ihre Einstellung mit "OK". Der Text erscheint nun
    gedreht. Die Höhe der Zellen paßt sich auch automatisch an die Höhe des längsten
    Wortes an.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_38_0.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_38_1.png)


    # → Rtf


    Das Rich Text Format ist eine Möglichkeit, Text aus verschiedenen Textverarbeitungen
    auf jedem beliebigen Editor zu lesen. Speichern Sie den Text etwa im Word-Format,
    gehen beim Laden in ein anderes Programm meist nicht nur die Formatierungen verloren,
    sondern auch die Buchstaben sind nicht mehr zu entziffern. RTF ist also ein Grundformat,
    das nur den Text, nicht aber die Formatierungen speichert.


    # Werte statt Formeln


    Normalerweise werden immer die Ergebnisse einer Formel und nicht die Formel selbst
    in den Zellen angezeigt. In der Bearbeitungsleiste ist das genau andersherum.
    Beim Kopieren wird allerdings meist die Formel und nicht der Wert kopiert. Das
    können Sie ändern.


    1 Wählen Sie die Zelle mit der zu kopierenden Formel. Klicken Sie auf das Symbol
    "Kopieren" in der Symbolleiste oder wählen Sie den Befehl aus dem Menü "Bearbeiten".


    2 Klicken Sie an die Stelle, an der die Kopie der Formel bzw. des entsprechenden
    Wertes eingefügt werden soll.


    3 Wählen Sie nun in der Menüleiste "Bearbeiten" und hier den Unterpunkt "Inhalte
    einfügen". Klicken Sie auf "Werte". Nun bestätigen Sie mit "OK". In der Zelle
    wird jetzt lediglich der Wert hinterlegt und nicht mehr die Formel.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_38_2.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_38_3.png)


    # TIP Einfügen langer Tabellen


    Ist die Excel-Tabelle, die Sie in Word einfügen möchten, sehr lang und geht über
    eine Seite hinaus, dann fügen Sie sie nicht als Excel-Tabellenobjekt ein. Wählen
    Sie statt dessen →Rtf als Format. Die Daten sehen dann zwar wie eine Word Tabelle
    aus, aber hier kann ein Seitenumbruch vorgenommen werden. Dieser wäre sonst nicht
    möglich. Wählen Sie statt Rtf die Option "Unformatierter Text", erscheinen die
    Excel-Daten als Zahlen, die durch Tabulatoren getrennt sind. Das kann unter Umständen
    ziemlich verwirrend aussehen. Am besten, Sie testen von Fall zu Fall, wie Ihre
    Daten optimal aufbereitet werden.


    # Bereichsnamen vergeben


    Gerade wenn verschiedene Leute an einer Tabelle arbeiten, ist es oft sinnvoll,
    statt der kryptischen Formeln bestimmte Bereichsnamen für Werte zu vergeben. Denn
    statt (B2/12,B3,B1) liest es sich doch für Fremde leichter, wenn dort steht: (Zinsrate/12,Periode,Kredit).
    Dann weiß jeder, was gemeint ist.


    1 Übernehmen Sie die Daten aus dem Tip zur RMZ-Funktion (siehe Seite XX oben).


    2 Markieren Sie nun die Zelle B4. Wählen Sie in der Menüleiste "Einfügen" und
    hier "Name", "Festlegen".


    3 Excel hat bereits einen Namen vergeben. Diesen können Sie behalten oder ändern.
    Klicken Sie auf "Hinzufügen und auf "OK". Gehen Sie so auch für die anderen Zellen
    vor.


    4 Sie haben nun alle Zellnamen definiert und können diese in die Formel einsetzen.
    Dazu klicken Sie auf die Zelle B4, in der die Funktion eingegeben wird. Geben
    Sie nun die Formel mit Worten ein: =RMZ(Zinsrate/12,Periode,Kredit) Excel berechnet
    nun dasselbe wie im nächsten Tip, doch nun versteht jeder die Formel ohne langes
    Überlegen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_38_4.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_38_5.png)


    # TIP Liste aller Arbeitsblätter


    Sie können in Excel beliebig viele Arbeitsblätter benennen und hinzufügen. Befinden
    Sie sich allerdings gerade auf dem letzten, dann müßten Sie sich theoretisch mit
    Hilfe der Pfeile zurückklicken. Das ist umständlich. Einfacher geht es wenn Sie
    auf einen der Registerpfeile links unten mit der rechten Maustaste klicken. Nun
    erscheint ein Menü mit allen tieferliegenden Arbeitsblättern. Hier klicken Sie
    das Gewünschte an und fertig.'
