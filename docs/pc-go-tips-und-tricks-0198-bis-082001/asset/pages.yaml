- pgno: 1
  md: '# Drop-Down-Menü


    Das sind Menüs, die neben einem Eingabefeld einen nach unten zeigenden Pfeil aufweisen.
    Mit einem Klick auf diesen Pfeil klappen weitere Menüpunkte auf (engl. "drop down").
    Drop-Down-Menüs sehen Sie häufig auf Internet-Seiten. Damit werden vorgegebene
    Eingabemöglichkeiten ausgewählt.


    # Filter


    Durch einen Filter ist es möglich, Daten, die bestimmten Kriterien entsprechen,
    anzuzeigen. Alle anderen Daten werden nicht angezeigt. Das ist sehr nützlich,
    wenn Sie sich schnell einen Überblick über die Daten einer Tabelle verschaffen
    wollen. In Excel gibt es die Funktion des AutoFilters. Damit wenden Sie vorgegebene
    Filter auf die Daten einer Zeile oder Spalte an.


    # Zellen


    Auf dem Bildschirm ist eine Excel-Tabelle unterteilt in viele Kästchen. Diese
    Kästchen werden Zellen genannt. Jede Zelle hat einen bestimmten "Namen", der sich
    nach ihrer Position innerhalb der Tabelle richtet. Eine Tabelle ist wiederum aus
    Spalten und Zeilen aufgebaut. Spalten werden mit Buchstaben benannt (A, B, C ...),
    Zeilen mit Zahlen (1,2, 3 ...). Daraus ergeben sich die einzelnen Zellenbezeichnungen,
    z.B. B7 (also zweite Spalte, siebte Zeile).


    # Arbeitsmappe


    Jede Datei in Excel ist eine Arbeitsmappe. Sie kann mehrere Tabellen oder auch
    Diagramme enthalten. Das ist praktisch, wenn Sie mehrere Tabellen oder Diagramme
    zu einem Thema haben. Die Tabellen müssen dann nicht mehr einzeln gespeichert
    werden. Am unteren Rand des Bildschirms, unter der Tabelle selbst, ist angegeben,
    wie viele Tabellen oder Diagramme die Arbeitsmappe enthält.


    # Schriftart in Excel


    Wenn Sie Excel starten und Daten in eine Tabelle eingeben, so werden diese in
    der Schriftart Arial, in der Größe 10 pt ausgegeben. So ändern Sie die Standardschriftart-
    und -größe in Excel.


    +   1. Wählen Sie das Menü "Extras" und darin den Punkt "Optionen".


    +   2. Klicken Sie auf die Registerkarte "Allgemein".


    +   3. In den Feldern "Standardsschriftart" und "Schriftgrad" können Sie eigene
    Angaben einsetzen.


    +   4. Klicken Sie auf die Pfeile neben den aktuellen Angaben. Wählen Sie dann
    die neue Schriftart und -größe aus dem "Drop Down-Menü" aus.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_0.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_1.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_2.png)


    # Filter einsetzen


    Eine sehr nützliche Funktion in Excel ist der Filter. Damit legen Sie fest, daß
    in einer Zeile oder Spalte nur bestimmte Werte angezeigt werden. Mit einem AutoFilter
    zeigen Sie etwa die zehn höchsten Werte an oder diejenigen, die ein bestimmtes
    Kriterium erfüllen.


    +   1. Fertigen Sie eine Tabelle Ihrer Wahl an. In den Zellen können Namen oder
    Zahlen stehen. Lassen Sie die erste Zeile frei. Dort fügen wir später den AutoFilter
    ein.


    +   2. Markieren Sie entweder die ganze Tabelle, indem Sie auf den grauen Kasten
    neben der Spalte "A" und über der Zeile "1" klicken. Oder markieren Sie die Spalte
    oder Zeile, für die Sie einen Filter einsetzen wollen.


    +   3. Wählen Sie aus dem Menü "Daten" den Punkt "Filter". Klicken Sie dann auf
    den Unterpunkt "AutoFilter".


    +   4. Wenn Sie die ganze Tabelle markiert haben, erscheint in jeder Zelle der
    ersten Zeile ein graues Kästchen mit einem Pfeil. Hier bestimmen Sie Ihren AutoFilter.


    +   5. Klicken Sie auf einen der Pfeile. Es öffnet sich dann ein "Drop Down-Menü",
    in dem einige Filter angezeigt werden.


    +   6. Wenn Sie eine der Angaben anklicken, legen Sie fest, daß nur die Zellen
    in dieser Spalte angezeigt werden, die die Bedingungen dieser Kriterien erfüllen.
    Wenn Sie etwa eine Spalte mit Zahlen markiert haben und dann den Filter "Top 10"
    anklicken, werden nur die Zellen mit den zehn höchsten Werten angezeigt. Wenn
    Sie einen Filter mit einer bestimmten Zahl anklicken, werden nur die Zellen angezeigt,
    die diesen Wert enthalten. Das ist auch sinnvoll bei Zellen mit Textinhalten.


    +   7. Wenn Sie den Filter wieder löschen und damit die ursprüngliche Tabelle
    wiederherstellen wollen, wählen Sie wieder das Menü "Daten" an. Klicken Sie dort
    auf den Punkt "Filter" und danach "AutoFilter". Damit werden die Filter wieder
    gelöscht.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_3.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_4.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_5.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_6.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_7.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_8.png)


    # Neue Ordner anlegen


    Haben Sie schon einmal versucht, im Windows Explorer einen neuen Ordner anzulegen.
    Das ist äußerst umständlich. Sie müssen dazu das Menüpunkt "Datei", "Neu", "Ordner"
    nacheinander anklicken oder die Taste "Alt" drücken und dann die Buchstaben "D",
    "N", "O" eingeben. Schneller geht das in den Programmen des Microsoft Office selbst,
    also in Word, Excel etc.


    +   1. Speichern Sie die Tabelle, die in einem neuen Verzeichnis abgelegt werden
    soll, indem Sie im Menü "Datei" auf "Speichern unter" klicken.


    +   2. In diesem Fenster klicken Sie auf das Symbol, das mit dem Pfeil markiert
    ist.


    +   3. Geben Sie den Namen für den neuen Ordner ein.


    +   4. Klicken Sie auf "Öffnen". Erst dann kann die Datei in dem Ordner gespeichert
    werden.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_9.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_10.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_11.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_1_12.png)'
