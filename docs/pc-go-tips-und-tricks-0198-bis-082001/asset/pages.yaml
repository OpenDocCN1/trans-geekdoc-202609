- pgno: 45
  md: '# Office-Tips: Excel


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_45_0.png)


    eingeben, dann genügt es, wenn Sie nur Januar eintippen. Ist dies geschehen, dann
    klicken Sie mit der linken Maustaste das kleine schwarze Kästchen rechts unten
    an der Zelle an. Dies ist das "Ausfüllkästchen". Der Mauszeiger verwandelt sich
    in ein Kreuz. Ziehen Sie nun einen Rahmen auf, der über die nächsten elf Spalten
    reicht. Lassen Sie dann die Maustaste los. Alle Kalendermonate sind nun eingetragen.


    Das Ganze funktioniert natürlich auch mit Zahlen. Dazu geben Sie die ersten beiden
    Zahlen in jeweils eine Zelle ein. Nun markieren Sie beide Zellen. Klicken Sie
    jetzt auf das Ausfüllkästchen und ziehen Sie die Spalte herunter. Haben Sie zuerst
    z.B. 2 und 5 eingegeben, dann sind die nächsten Werte jeweils um drei erhöht.


    | | |

    |---|---|

    |14| |

    |15|5|

    |16|8|

    |17|11|

    |18|14|

    |19|17|


    # 73 Daten umsortieren und transponieren


    Wollen Sie Daten anders sortieren, dann müssen Sie auf die Funktion "Daten transponieren"
    zurückgreifen. Damit können Sie Daten, die ursprünglich in einer Zeile angeordnet
    wurden, in Spalten umsortieren. Markieren Sie dazu zunächst den Bereich, den Sie
    sortieren möchten. Betätigen Sie die Tasten Strg+C zum Kopieren der Zellen. Klicken
    Sie nun die erste Zelle des Zielbereiches an. Rufen Sie mit einem rechten Mausklick
    das Kontextmenü auf. Wählen Sie hier "Inhalte einfügen". Aktivieren Sie das Kontrollkästchen
    "Transponieren" und bestätigen Sie den Vorgang mit "OK"


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_45_1.png)


    # 74 Daten in einem Tabellenblatt suchen


    Zum Auffinden einzelner oder mehrerer Zeichen im Tabellenblatt wählen Sie in der
    Menüleiste "Bearbeiten" und hier "Suchen". Nun können Sie


    den Begriff oder die Zahl eingeben, nach der Sie suchen. Klicken Sie auf "Ersetzen",
    dann können Sie einen Wert durch einen anderen im ganzen Arbeitsblatt ersetzen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_45_2.png)


    # 75 Automatisches Speichern der Arbeitsmappe


    Excel kann Ihre Daten auch automatisch speichern. Diese Funktion empfiehlt sich
    in jedem Fall, um auch bei einem Systemabsturz die meisten Daten zu retten. Zunächst
    einmal wählen Sie in der Menüleiste "Extras" und hier "Add-In Manager". Aktivieren
    Sie nun die Option "Automatische Speichern" und klicken Sie auf "OK". Klicken
    Sie nun erneut auf das "Extras"-Menü, dann sehen Sie die Funktion "Automatisches
    Speichern". Klicken Sie das Kontrollkästchen vor dieser Option an. Nun können
    Sie das Zeitintervall der automatischen Sicherung einstellen. Außerdem legen Sie
    fest, ob nur die aktive oder alle geöffneten Arbeitsmappen gesichert werden sollen.
    Aktivieren Sie auch noch "Speichern bestätigen", dann erhalten Sie jedesmal nach
    dem automatischen Speichern eine Meldung auf Ihrem Bildschirm.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_45_3.png)


    # 76 Mehrere Dateien öffnen und schließen


    Über das Öffnen-Dialogfeld können Sie nicht immer nur eine Arbeitsmappe, sondern
    auf Wunsch auch gleich mehrere öffnen.


    1 Wählen Sie in der Menüleiste "Datei" und "Öffnen". Hier markieren Sie die erste
    zu öffnende Datei. Danach halten Sie die Strg-Taste gedrückt und markieren alle
    weiteren Dateien. Klicken Sie nun auf "Öffnen", dann werden alle markierten Dateien
    geöffnet.


    2 Dasselbe gilt auch für den Schließvorgang. Halten Sie die Umschalt-Taste gedrückt
    und wählen Sie "Datei". Hier klicken Sie nun auf "Alles schließen". Alle noch
    geöffneten Arbeitsmappen werden geschlossen. Muß die eine oder andere Datei noch
    einmal gespeichert werden, dann wird Excel Sie dazu auffordern.


    # 77 Spezielle Dateien und Inhalte suchen


    Sie können auch nach Dateien mit einem bestimmten Inhalt suchen. Wählen Sie dazu
    in der Menüleiste "Datei" und "Öffnen". Auf der rechten Seite des Dialogfeldes
    geben Sie den Text oder den Wert ein, den Sie suchen. Klicken Sie nun auf die
    Suchen-Schaltfläche. Alle Dateien, die gefunden wurden, werden im Listenfeld angezeigt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_45_4.png)


    # 78 Arbeitsbereiche einer Tabelle speichern


    Oft brauchen Sie einfach mehrere Dateien gleichzeitig auf Ihrem Rechner (und oft
    immer die selben). Dann empfiehlt es sich, die entsprechenden Dateien als Arbeitsbereich
    zu speichern. Dann müssen Sie das nächste Mal nicht jede Datei erst manuell öffnen.
    Und Sie müssen sich nur noch an den Arbeitsbereichsnamen erinnern.


    1 Öffnen Sie also zunächst zwei oder drei Dateien. Wählen Sie nun "Datei" und
    "Arbeitsbereich speichern". Vergeben Sie einen passenden Namen und drücken Sie
    die Return-Taste.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_45_5.png)


    2 Halten Sie nun die Umschalt-Taste gedrückt, wählen Sie "Datei" und hier "Alles
    schließen". Um nun die Arbeitsbereich-Datei zu öffnen, wählen Sie "Datei" und
    "Öffnen". Hier sehen Sie nun die Arbeitsmappe in derselben Liste wie alle anderen
    Excel-Dateien. Haben Sie vorher die zwei oder drei Dateien in einem geteilten
    Fenster bearbeitet, dann behält Excel diese Anordnung auch weiterhin bei.


    # 79 Arbeitsmappen teilen


    Sie können Excel Arbeitsmappen teilen, wenn mehrere Benutzer gleichzeitig daran
    arbeiten sollen. Öffnen Sie die Datei und wählen Sie "Extras" und hier "Arbeitsmappe
    freigeben". Im nun folgenden Dialogfenster aktivieren Sie das Kontrollkästchen
    "Änderungen von mehr als einem Benutzer gleichzeitig erlauben". Im Listenfeld
    sehen Sie dann, wer alles im Moment auf die Arbeitsmappe zugreift.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_45_6.png)'
