    # TIPP Eingabe per Datenbankmaske


    Wenn Sie das Arbeiten mit einer Datenbank gewohnt sind, brauchen Sie auch in Excel
    nicht auf den Komfort zu verzichten, Daten mit Hilfe eines Formulars zu bearbeiten.
    Klicken Sie dazu in die zu bearbeitende Liste. Wählen Sie anschließend den Menübefehl
    „Daten“ und im Untermenü den Befehl „Maske“. Schon steht Ihnen eine Datenbankmaske
    zur Eingabe und zur Bearbeitung der Daten zur Verfügung. Um sich in den Datensätzen
    zu bewegen, benutzen Sie entweder den Rollbalken oder die Schaltflächen „Vorherigen
    suchen“ und „Nächsten suchen“. Mit einem Klick auf die Schaltfläche „Neu“ geben
    Sie einen neuen Datensatz ein. Sie brauchen dabei nicht darauf zu achten, wo der
    Cursor sich gerade in Ihrer Tabelle befindet, denn der neue Datensatz wird automatisch
    an das Ende der Liste angefügt. Die Schaltfläche „Löschen“ entfernt den gerade
    in der Anzeige befindlichen Datensatz. Mit Hilfe der Schaltfläche „Suchkriterien“
    können Sie Suchkriterien in die Datenmaske eingeben und dann die passenden Datensätze
    suchen, indem Sie auf die Schaltflächen „Vorherigen suchen“ oder „Nächsten suchen“
    klicken.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_96_1.png)


    # Wie kommen Sie am schnellsten zum Ziel?


    Oftmals stellt sich die Frage, wie Sie einen Eingangswert verändern müssen, um
    einen bestimmten Zielwert zu erreichen. Für diese Problemstellung bietet Excel
    die Funktion „Zielwertsuche“ an. Für die Berechnung ist es wichtig, dass der zu
    verändernde Wert eine Zahl sein muss und keine Formel enthalten darf, während
    der Zielwert unbedingt eine Formel sein muss. Das folgende Beispiel veranschaulicht
    die „Zielwertsuche“.


    in der Zelle „Verfügbar“ eine Ergebnis von Null erreicht wird. Klicken Sie dazu
    auf den Menübefehl „Extras“. In dem sich jetzt öffnenden Untermenü wählen Sie
    den Befehl „Zielwertsuche“ aus. Das Dialogfenster „Zielwertsuche“ öffnet sich.


    1 Öffnen Sie ein leeres Excel-Arbeitsblatt und tippen Sie in die Zelle A1 „Einnahmen“
    ein. In die Zelle A2 schreiben Sie „Ausgaben“, in die Zelle A3 „Belastung“ und
    in die Zelle A4 „Verfügbar“.


    2 Geben Sie in die Zelle „B1“ den Wert „5500“ ein. In die Zelle „B2“ schreiben
    Sie den Wert „3300“ und in die Zelle „B3“ den Wert „2500“ ein. In die Zelle B4
    tragen Sie die Formel „=B1-B2-B3“ ein. Das Ergebnis sollte „-800“ ergeben.


    3 Ziel soll es nun sein, mit Hilfe der „Zielwertsuche“ die Einnahmen so zu berechnen,
    dass


    4 Tippen Sie in das Feld „Zielzelle“ den Wert „B4“ ein. In das Eingabefeld „Zielwert“
    kommt eine „0“. In das Eingabefeld „Veränderbare Zelle“ tippen Sie „B1“ ein. Mit
    einem Klick auf die Schaltfläche „OK“ wird die Zielwertsuche durchgeführt und
    das Ergebnis angezeigt.


    5 Wenn Sie mit dem erzielten Ergebnis zufrieden sind, klicken Sie auf die Schaltfläche
    „OK“. Mit einem Klick auf die Schaltfläche „Abbrechen“ werden die ursprünglichen
    Daten wieder hergestellt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_96_2.png)


    # Datenanalyse mit den Datenbankfunktionen


    Zum Auswerten von Daten gibt es in Excel eine besonders exzellentes Feature: die
    Datenbankfunktion. Am Beispiel einer Gehaltsliste können Sie sich die Möglichkeiten
    der Datenbankfunktionen einmal näher ansehen.


    1 Erstellen Sie zunächst eine Gehaltsliste. Die Überschriften der Spalten sollen
    folgendermaßen lauten: „NAME“, „ABT“, „GEHALT“. Füllen Sie die Tabelle mit beliebigen
    Namen, Abteilungsbezeichnungen und Gehältern.


    2 Damit die Tabelle eindeutig erkannt werden kann, dürfen Sie zwischen den einzelnen
    Zeilen keine Leerzeilen einfügen. Markieren Sie außerdem die Überschriftenzeile,
    und formatieren Sie diese fett, indem Sie auf das Symbol „Fett“, das F-Symbol
    in der Werkzeugleiste, klicken. Dadurch erkennt Excel die Liste als zusammengehörigen
    Datenbankbereich.


    3 Zur Auswertung der Daten braucht die Datenbankanalyseformel einen „Kriterienbereich“,
    aus dem sie die notwendigen Daten entnimmt. Zum Auswerten der Gehälter einer Abteilung
    geben Sie dazu in eine leere Zelle außerhalb der Liste die Überschrift der Abteilung,
    also „ABT“, ein. In die Zelle darunter schreiben Sie den Namen der Abteilung,
    die Sie auswerten wollen, zum Beispiel „EK“.


    4 Klicken Sie jetzt in ein freies Feld außerhalb der Liste, in dem das Ergebnis
    stehen soll. Aktivieren Sie anschließend den Funktionsassistenten, indem Sie auf
    das Symbol „Funktions-Assistent“ klicken. Das Dialogfenster „Funktion einfügen“
    wird eingeblendet.


    5 Klicken Sie im Bereich „Kategorie:“ auf „Datenbank“. Im Bereich „Funktion:“
    klicken Sie auf den Eintrag „DBSUMME“. Mit einem Klick auf die Schaltfläche „OK“
    öffnet sich die Eingabemaske der Funktion.


    6 In das Feld „Datenbank“ geben Sie die Koordinaten der Gehaltsliste ein. Der
    einfachste Weg zur Eingabe des Datenbankbereichs: Klicken Sie auf die kleine Tabelle
    im rechten Eingabefenster, die Funktionseingabe minimiert sich auf die Bereichsangabe.
    Markieren Sie jetzt die komplette Liste inklusive der Überschriften. Ein Klick
    auf das rechte Symbol im Eingabebereich vergrößert anschließend wieder das Funktionsfenster.'
