- pgno: 87
  md: '# TIPP Nur die Tausender darstellen


    Wenn Sie in Tabellen mit großen Zahlen arbeiten, ist die komplette Anzeige aller
    Stellen oft störend. Um Ihre Tabelle übersichtlicher zu gestalten, können Sie
    beispielsweise nur die Anzahl der Tausender anzeigen lassen. Markieren Sie die
    Zellen, denen das neue Zahlenformat zugewiesen werden soll. Wählen Sie in der
    Menüleiste den Befehl „Format“ aus, im Untermenü klicken Sie auf den Eintrag „Zellen“.
    Im Dialogfenster „Zellen“ wählen Sie die Registerkarte „Zahlen“. Bei „Kategorie“
    aktivieren Sie den Eintrag „Benutzerdefiniert“, und in das Feld „Formate“ tippen
    Sie das folgende Zahlenformat ein: „.,###“. Beachten Sie dabei den Punkt nach
    der letzten Raute.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_87_0.png)


    # Formeln in der Tabelle anzeigen


    Excel arbeitet im Formelbereich in zwei Dimensionen: In der Tabelle selbst sehen
    Sie standardmäßig die zweite Dimension, nämlich das Ergebnis Ihrer Formel. Die
    erste Dimension, die Formel selbst, wird nur im Bearbeitungsfenster dargestellt.
    Damit Sie alle Formeln übersichtlich in der Tabelle selbst sehen können, greifen
    Sie zu einem Trick.


    +   1 Aktivieren Sie das Arbeitsblatt, zu dem Sie die Formeln sehen möchten. Klicken
    Sie in der Menüleiste auf den Befehl „Extras“ und im Untermenü auf den Eintrag
    „Optionen“.


    +   2 Im Dialogfenster „Optionen“ klicken Sie auf das Register „Ansicht“. Aktivieren
    Sie im Bereich der „Fensteroptionen“ den Eintrag „Formeln“, und bestätigen Sie
    mit „OK“.


    +   3 Alle Formeln werden jetzt innerhalb der Tabelle angezeigt. Um wieder in
    die normale Tabellendarstellung zu gelangen, klicken Sie auf den Menübefehl „Extras“
    und im Untermenü auf „Optionen“. Nehmen Sie jetzt das Häkchen vor dem Eintrag
    „Formeln“ wieder heraus, und bestätigen Sie mit „OK“. Ihr Excel-Arbeitsblatt wird
    wie gewohnt dargestellt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_87_1.png)


    # Fehlermeldung „#DIV/0!“ abfangen


    Die Anzeige „#DIV/0!“ erhalten Sie jedes Mal, wenn Excel einen Wert durch „0“
    teilen soll. In Tabellen, in denen Sie die Formeln bereits vorbelegen, die Werte
    aber erst später eingeben, ist das störend. Mit Hilfe der „WENN-Funktion“ lässt
    sich das Problem beheben.


    +   1 Markieren Sie den ersten Wert, der die Fehlermeldung „#DIV/0!“ ausgibt.
    Entsteht der Fehler beispielsweise durch die Felder A1 und A2, geben Sie folgende
    Funktion ein:


    ```

    =WENN(ISTFEHLER(A1/B1);"";A1/B1)

    ```


    +   2 Tritt bei der Division, hier von Zelle A1 durch Zelle B1, ein Fehler auf
    (ISTFEHLER=WAHR), so wird der Ergebniszelle „“ (leer) zugewiesen. Tritt kein Fehler
    auf (ISTFEHLER=FALSCH), so wird der Ergebniswert der Division A1 dividiert durch
    B1 zugewiesen. Würde somit der Fehler #DIV/0! auftreten, so bliebe der Inhalt
    der Ergebnszelle leer.


    +   3 Kopieren Sie Ihre „Wenn-Funktion“ in alle in Frage kommenden Felder. Dann
    steht die Funktion überall zur Verfügung.


    # INFO Automatische Hinweise helfen


    Eine Meldefunktion vereinfacht die Benutzerführung in komplexen Tabellen. Jede
    einzelne Zelle eines Excel-97-Arbeitsblatts können Sie mit einer Nachricht verbinden.
    Excel zeigt diese Nachrichten automatisch an, wenn der Anwender den Cursor in
    die entsprechende Zelle bewegt. Um einen automatischen Hinweis zu erzeugen, wählen
    Sie die gewünschte Zelle aus. Klicken Sie im Menü auf den Befehl „Daten“ und im
    Untermenü auf „Gültigkeit“. Aktivieren Sie im Dialogfenster „Gültigkeit“ das Register
    „Eingabemeldung“. Hier muss die Option „Eingabemeldung anzeigen, wenn Zelle ausgewählt
    wird“ aktiviert sein. Geben Sie den gewünschten Titel der Hinweisbox sowie den
    erklärenden Text ein, und klicken Sie auf „OK“


    # Eingaben nur in bestimmten Zellen


    Um die Dateneingabe in Kalkulationsmodellen komfortabler zu gestalten, können
    Sie den „Blattschutz“ aktivieren. Standardmäßig sind in Excel alle Zellen als
    „Gesperrt“ vorbelegt. Vor dem Aktivieren des Blattschutzes müssen Sie all die
    Felder entsperren, die Sie auch weiterhin bearbeiten wollen.


    +   1 Markieren Sie die entsprechenden Felder, und klicken Sie auf den Menübefehl
    „Format“ und im Untermenü auf „Zellen“.


    +   2 Klicken Sie hier auf das Register „Schutz“, und deaktivieren Sie das Häkchen
    in dem Kontrollkästchen „Gesperrt“. Bestätigen Sie anschließend mit einem Klick
    auf „OK“.


    +   3 Aktivieren Sie den Menübefehl „Extras“, und ziehen Sie den Cursor auf den
    Eintrag „Blattschutz“. Klicken Sie dort auf „Blatt“ und auf die Schaltfläche „OK“.
    Danach lassen sich nur noch die Zellen verändern, bei denen Sie im Dialogfeld
    „Format-Zellen“ den Status „Gesperrt“ deaktiviert haben. P. Schnoor/pm


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_87_2.png)'
