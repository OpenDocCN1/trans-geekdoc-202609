- pgno: 95
  md: '# # Excel


    3 Markieren Sie den ausgefüllten Tabellenbereich und danach aktivieren Sie den
    Menübefehl „Einfügen“. Im Untermenü ziehen Sie die Mausanzeige auf den Eintrag
    „Namen“ und im jetzt eingeblendeten Untermenü klicken Sie auf den Befehl „Erstellen“.
    Das Dialogfenster „Namen erstellen“ wird eingeblendet.


    4 Aktivieren Sie die Kontrollkästchen „Oberster Zeile“ und „Linker Spalte“. Klicken
    Sie anschließend auf die Schaltfläche „OK“. Das Dialogfenster wird geschlossen.




    Wenn Sie den Bereich kennen, in den Sie Daten eingeben wollen, können Sie sich
    die Eingabe von Datensätzen mit einem kleinen Trick vereinfachen.


    +   1. Markieren Sie zunächst den Bereich, in den Ihre Daten eingegeben werden
    sollen, zum Beispiel „A1“ bis „C4“.

    +   2. Tippen Sie die Daten ein. Wechseln Sie jeweils mit der „Enter-Taste“ in
    das nächste Eingabefeld.


    3 In der Zelle „A4“ benutzen Sie nicht die Maus, um in die Zelle „B1“ zu gelangen,
    sondern auch die „Enter-Taste“. Die Eingabemarke springt automatisch in die Zelle
    „B1“, ohne dass Sie etwas dazutun müssen.


    4 Das gleiche gilt auch für die Zelle „B4“. Ein Druck auf die „Enter-Taste“ und
    der Cursor befindet sich ohne weiteren Mausklick in der Zelle „C1“.




    Optmal ist es nötig, Daten aus einem Arbeitsblatt in ein anderes Arbeitsblatt
    zu verschieben. Sie brauchen dazu nicht unbedingt die Standardausschneide- und
    Einfügefunkionen von Excel zu benutzen, es geht auch einfacher.


    +   1. Markieren Sie den Bereich, den Sie auf ein anderes Arbeitsblatt verschieben
    möchten.

    +   2. Ziehen Sie die Mausanzeige auf den unteren Rand der Markierung. Drücken
    Sie nun die „Alt-Taste“ und gleichzeitig die linke Maustaste. In der Statusleiste
    erscheint der Hinweis: „Ziehen über Blattregister verschiebt Markierung in ein
    anderes Blatt“.




    Excel ist im Rechnen zu genau. Um das zu verhindern, müssen Sie eine Formel einsetzen,
    die die Excel kaufmännisch runden lässt.

    Geben Sie die Werte „3,1479“ in die Zelle „A2“ ein. Multiplizieren Sie die Werte
    in der Zelle „A3“ miteinander mit der Formel „=A1*A2“. Das Ergebnis ist dann „3,5886“.
    Tippen Sie in die Zelle „A4“ die Formel zum Runden ein: „=RUNDEN(A3;2)“. Das Ergebnis
    ergibt dann „3,5900“. Die Zahl nach dem Semikolon in der Formel gibt die Zahl
    der Nachkommastellen an.




    Geben Sie mehrere Datumswerte ein, ist es umständlich, immer das komplette Datum
    zu schreiben. Geben Sie lieber so vor: Markieren Sie den Bereich, in dem die Datumswerte
    stehen sollen. Wählen Sie dann den Menübefehl „Format“ und im Untermenü „Zellen“.
    Aktivieren Sie das Register „Zahlen“ und im Listenfeld „Kategorie“ den Eintrag
    „Datum“. Wählen Sie das passende Format aus (zum Beispiel „03.04.97“) und betätigen
    Sie anschließend die Schaltfläche „OK“. Bei der Datumseingabe in diese Felder
    können Sie sich die Eingabe wie zum Beispiel „10.10.2001“ vereinfachen: Sie geben
    lediglich „10-10“ ein, Excel ergänzt die Eingabe selbständig um das aktuelle Jahr
    und formatiert die Anzeige Ihren Einstellungen entsprechend um.




    Wenn Sie nur bestimmte Teile einer Tabelle ausdrucken wollen, markieren Sie den
    auszudruckenden Bereich und wählen den Menübefehl „Datei“. Im Untermenü ziehen
    Sie die Mausanzeige auf den Eintrag „Druckbereich festlegen“. Ein Klick auf das
    Symbol „Seitenansicht“ zeigt das Ergebnis: Nur der markierte Bereich steht zum
    Drucken an. Um den Druckbereich wieder aufzuheben, wählen Sie den Befehl „Druckbereich
    aufheben“ aus dem „Datei-Menü“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_95_0.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_95_1.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_95_2.png)


