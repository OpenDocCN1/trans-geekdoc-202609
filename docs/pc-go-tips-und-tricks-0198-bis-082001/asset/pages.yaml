- pgno: 94
  md: '# Mit mehreren Excel-Dateien arbeiten


    Arbeiten Sie häufig mit mehreren Excel-Dateien gleichzeitig, dann ist es umständlich,
    diese Dateien immer nacheinander zu öffnen. Dafür gibt es einen Trick in Excel:
    Speichern Sie alle benötigten Dateien als einen „Arbeitsbereich“. Dann können
    Sie durch das Öffnen dieses „Arbeitsbereiches“ alle gespeicherten Arbeitsmappen
    auf einmal öffnen, ohne jede Datei einzeln zu laden.


    1 Laden Sie in Excel zunächst nacheinander alle Dateien, die in einem Arbeitsbereich
    gespeichert werden sollen. Wählen Sie nun im Menü „Datei“ den Befehl „Arbeitsbereich
    speichern“.


    2 Geben Sie einen passenden Namen für Ihren „Arbeitsbereich“ ein. Achtung! Dieser
    Arbeitsbereich erhält nicht die ursprüngliche Excel-Dateierweiterung „.xls“ (Excel
    Sheet), sondern „.xlw“ (Excel Workspace).


    3 Wollen Sie zu einem späteren Zeitpunkt den gesicherten Arbeitsbereich wieder
    öffnen, wählen Sie den Befehl „Datei/Öffnen“. Öffnen Sie Ihren Arbeitsbereich
    mit einem Doppelklick. Excel öffnet alle in diesem Bereich gespeicherten Dateien
    und erinnert sich auch an eventuell geteilte Fenster oder Seiteneinteilungen.


    4 Ein Klick auf den Menübefehl „Fenster“ zeigt im unteren Bereich alle geöffneten
    Dateien an. Hier wählen Sie die Datei aus, die Sie bearbeiten wollen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_94_0.png)


    # Wenn die Excel-Navigation zu langsam wird


    In großen Tabellen können viele Diagramme und Grafiken vorhanden sein. Dadurch
    wird das Blättern in Excel langsam und mühselig. Sie können Excel auf Wunsch aber
    auch wieder beschleunigen. Sie müssen dabei aber auf die Ansicht der eingebundenen
    Diagramme und Grafiken verzichten.


    1 Klicken Sie auf den Menübefehl „Extras“ und im folgendem Untermenü auf den Befehl
    „Optionen“. Das Dialogfenster „Optionen“ erscheint.


    2 Aktivieren Sie das Register „Ansicht“. Im Bereich „Objekte“ wählen Sie die Option
    „Platzhalter anzeigen“. Dadurch wird der Platz, den die Grafikelemente benötigen,
    weiter freigehalten, aber die Grafik oder das Diagramm selbst sind nicht zu sehen.
    So wird das Blättern in der Tabelle wieder angenehm flüssig.


    3 Alternativ können Sie auch die Option „Alle ausblenden“ wählen. Durch diese
    Option werden alle Diagramme und Grafiken ausgeblendet, und zwar mitsamt dem dafür
    vorgesehenen Platz. Das Blättern in Ihrer Tabelle wird dadurch noch schneller,
    da insgesamt weniger Seiten vorhanden sind.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_94_1.png)


    # Bereiche automatisch benennen


    Je größer Ihre Tabelle ist, desto unübersichtlicher wird sie. Zum effektiven Organisieren
    von Tabellen sollten Sie wichtige Tabellenbereiche mit Namen versehen. Dadurch
    werden Formeln wesentlich verständlicher. Excel bietet die Möglichkeit, einzelne
    Bereiche automatisch zu benennen.


    1 Tippen Sie in die erste Spalte bestimmte Kategorien ein, zum Beispiel „Fachliteratur“,
    „Reiseliteratur“, „Geschichtsliteratur“ und „Krimis“.


    2 Erzeugen Sie für die Kategorien vier Quartale, in denen Sie Ihre Ausgaben für
    die jeweilige Kategorie vermerken.


    # TIPP Formatierungen übertragen


    Wenn Sie eine Zelle oder einen Zellenbereich perfekt formatiert haben und weitere
    Zellen oder Zellenbereiche genauso formatieren möchten, so müssen Sie die ganzen
    Einstellungen nicht noch einmal Schritt für Schritt wiederholen. Benutzen Sie
    dazu besser den „Format übertragen“-Pinsel aus der Symbolleiste. Markieren Sie
    die Zelle, die optimal formatiert ist, und klicken Sie auf das Symbol „Format
    übertragen“. Markieren Sie nun den Bereich, den Sie formatieren wollen. Die Zellen
    erhalten jetzt alle Format-Einstellungen der Ursprungszelle. Wenn Sie die Formatierung
    auf mehrere Bereiche übertragen wollen, führen Sie einen Doppelklick auf das „Format
    übertragen“-Symbol aus. Die „Format übertragen“-Eigenschaft bleibt dann so lange
    aktiv, bis Sie die „Esc-Taste“ betätigen.


    # TIPP Rahmen schnell erzeugen


    Oftmals ist es wichtig, bestimmte Daten optisch zu einer Gruppe zusammenzufassen.
    Für eine solche Zusammenfassung bietet sich ein Rahmen an. Den können Sie blitzschnell
    mit einer Tastenkombination erzeugen. Markieren Sie dazu den Bereich, den Sie
    mit Hilfe eines Rahmens optisch hervorheben wollen. Betätigen Sie dann die Tastenkombination
    „Strg – Umschalttaste – Bindestrich“. Schon wird der markierte Bereich mit einem
    Rahmen versehen.'
