- pgno: 92
  md: "![](img/5f36a0372e5f0f300d0bad16e6a18053_92_0.png)\n\n# TIPP Wie groß ist ein\
    \ Arbeitsblatt?\n\nEine Excel-Arbeitsmappe (= Datei) besteht aus mehreren Arbeitsblättern\
    \ (= Tabellen). Sie können pro Arbeitsmappe 256 Arbeitsblätter erstellen. Dabei\
    \ ist ein Arbeitsblatt schon sehr groß. Es besteht aus 65.536 Zeilen. Wenn Sie\
    \ eine solche Arbeitsmappe komplett füllen und drucken würden, hätten Sie bei\
    \ 70 Zeilen pro Druckseite 937 Seiten Din-A4-Papier zu bedrucken. Und das nur,\
    \ wenn alle Spalten auf eine Seite passen, denn Sie können pro Arbeitsblatt 256\
    \ Spalten mit Daten füllen.\n\n# TIPP Ganzen Bildschirm nutzen\n\nZur Eingabe\
    \ von Werten benötigen Sie die Menüleiste und die Symbolleisten nicht. Diese nehmen\
    \ Ihnen nur unnötig viel Platz vom Arbeitsbildschirm weg. Um nur das Arbeitsblatt\
    \ ohne Symbolleisten zu sehen, klicken Sie auf den Menübefehl „Ansicht“ und im\
    \ sich nun öffnenden Untermenü wählen Sie den Befehl „Ganzer Bildschirm“ aus.\
    \ Jetzt haben Sie das reine Arbeitsblatt zur Eingabe vor sich. Um wieder in die\
    \ „normale“ Ansicht von Excel zu gelangen, drücken Sie auf die „Esc-Taste“ oder\
    \ auf die Schaltfläche „Ganzer Bildschirm schließen“.\n\n![](img/5f36a0372e5f0f300d0bad16e6a18053_92_1.png)\n\
    \n# Symbolleisten links und rechts platzieren\n\nDie Symbolleisten von Excel enthalten\
    \ wichtige Befehle. Je nachdem, welche Funktionen Sie in der aktuellen Arbeitsmappe\
    \ bearbeiten, blendet Excel die entsprechende Symbolleiste ein. Sie nehmen Ihnen\
    \ aber Platz von der Arbeitsoberfläche weg. Es ist sinnvoll, wenn Sie die Symbolleisten\
    \ so platzieren, dass Sie Ihre Daten problemlos bearbeiten können.\n\n+   1. Sie\
    \ können eine Symbolleiste aus der oberen Verankerung lösen und zu einem frei\
    \ platzierbaren Fenster umwandeln, indem Sie doppelt auf die entsprechende Symbolleiste\
    \ klicken. Jetzt liegt die ausgewählte Symbolleiste als frei platzierbares Fenster\
    \ auf Ihrem Arbeitsblatt.\n+   \n+   2. Ziehen Sie die Mausanzeige in den blauen\
    \ Bereich der Symbolleiste, drücken Sie anschließend die linke Maustaste und ziehen\
    \ Sie die Symbolleiste ganz an den linken Bildschirmrand, bis sie dort einrastet.\n\
    +   \n+   3. Gehen Sie für eine weitere Symbolleiste genauso vor und verankern\
    \ Sie diese am rechten Bildschirmrand. Jetzt haben Sie mehr Platz zum Bearbeiten\
    \ Ihrer Daten.\n\n![](img/5f36a0372e5f0f300d0bad16e6a18053_92_2.png)\n\n# Dateien\
    \ gezielt suchen\n\nHäufig passiert es, das Sie ältere Excel- Dateien benötigen.\
    \ Doch wo finden Sie diese? Ein wahlloses Stöbern in älteren Dateien ist sehr\
    \ zeitaufwendig. Suchen Sie Ihre Excel-Dateien lieber gezielt.\n\n+   1. Wählen\
    \ Sie den Menübefehl „Datei“ und im Untermenü „Öffnen“. Das Dialogfenster „Öffnen“\
    \ wird eingeblendet.\n+   \n+   2. Klicken Sie in diesem Dialogfenster auf die\
    \ Schaltfläche „Weitere...“. Das Dialogfenster „Weitere Suche“ wird eingeblendet.\n\
    +   \n+   3. Definieren Sie im Bereich „Weitere Kriterien“ die Suchvorgaben. Im\
    \ Auswahlfeld „Eigenschaft“ wählen Sie zum Beispiel „Erstellt“ aus und im Auswahlfeld\
    \ „Bedingung“ wählen Sie den Eintrag „Letzten Monat“, um die Suche einzugrenzen.\n\
    +   \n+   4. Im Bereich „Suchen in“ stellen Sie den Suchpfad ein. Falls der Suchpfad\
    \ Unterordner enthält, so setzen Sie unbedingt durch einen Mausklick ein Häkchen\
    \ in das Auswahlkästchen „Unterordner durchsuchen“.\n+   \n+   5. Damit Ihre Auswahl\
    \ gespeichert wird, aktivieren Sie die Schaltfläche „Suche speichern“ und vergeben\
    \ Sie einen Namen für diese Suche. Dadurch können Sie die Suche auch später jederzeit\
    \ wiederholen.\n+   \n+   6. Starten Sie Ihre Suche durch einen Klick auf die\
    \ Schaltfläche „Suche starten“. Das Ergebnis wird nicht lange auf sich warten\
    \ lassen.\n\n![](img/5f36a0372e5f0f300d0bad16e6a18053_92_3.png)\n\n# Einen Wochenplan\
    \ aufstellen\n\nDie Vorplanung einer Woche hat viele Vorteile: Sie legen wichtige\
    \ Termine fest und behalten diese im Auge, Verabredungen werden nicht vergessen,\
    \ Zahlungstermine können nicht übersehen werden. Beim Aufstellen eines Wochenplans\
    \ hilft Excel durch seine Autoausfüllaktionen mit.\n\n+   1. In der ersten Tabellenzeile\
    \ sollen die Wochentage Montag bis Sonntag festgelegt werden. Dabei bleibt die\
