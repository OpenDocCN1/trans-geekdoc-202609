- pgno: 2
  md: '# Arbeitsmappe freigeben


    Wenn mehrere Benutzer gleichzeitig auf eine Tabelle zugreifen sollen, müssen Sie
    die →Arbeitsmappe freigeben.


    1. Wählen Sie im Menü "Extras" den Punkt "Arbeitsmappe freigeben".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_2_0.png)


    2. Damit mehrere Benutzer gleichzeitig auf die Tabelle zugreifen können, müssen
    Sie folgendes Kontrollkästchen aktivieren:


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_2_1.png)


    3. Wenn Sie auf die Registerkarte "Einstellungen" klicken, legen Sie fest, ob
    ein Änderungsprotokoll angelegt wird, wie oft die Tabelle gespeichert wird und
    wie bei gleichzeitigen Änderungen verfahren wird.


    # Verknüpfung mit Word-Dokument in einer Excel-Tabelle


    In Excel 97 gibt es →Hyperlinks mit denen Sie durch einen Doppelklick direkt von
    einer Tabelle in ein Word-Dokument springen. In Excel 95 fügen Sie statt dessen
    eine →Verknüpfung in eine Tabellenzelle ein. In der Zeile wird dann ein Symbol
    eingefügt. Wenn Sie dieses Verknüpfungssymbol anklicken, wird der Text geladen
    und Sie bearbeiten ihn direkt in Word.


    1. Öffnen Sie den Word-Text, mit dem Sie die Excel-Tabelle verknüpfen wollen.


    2. Markieren Sie den gesamten Text mit der Tastenkombination "Strg"+"A" oder wählen
    Sie im Menü "Bearbeiten" den Befehl "Alles markieren".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_2_2.png)


    3. Klicken Sie auf den Menüpunkt "Bearbeiten" und dann "Kopieren". Das gesamte
    Dokument wird in die Zwischenablage gelegt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_2_3.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_2_4.png)


    Wenn Sie das nächste Mal eine Tabelle öffnen, die gleichzeitig von einem anderen
    Anwender benutzt wird, kommt nicht mehr die Frage, ob Sie eine Kopie der Datei
    erstellen wollen, sondern Sie arbeiten direkt in der Tabelle.


    4. Wechseln Sie zurück in Excel. Am schnellsten tun Sie das, indem Sie die Taste
    "Alt" und die "Tabulator-Taste" gleichzeitig drücken.


    5. Wählen Sie im Menü "Bearbeiten" den Punkt "Inhalte einfügen".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_2_5.png)


    6. Klicken Sie hier das Kontrollkästchen vor "Verknüpfen" und vor "als Symbol"
    an. Unter "Als:" müsste "Word-Dokument" angeführt sein. Klicken Sie dann auf "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_2_6.png)


    7. Das Word-Symbol wird in die Excel-Tabelle eingefügt. Wenn Sie das Symbol doppelklicken,
    wird die Word-Datei geöffnet.


    Sie können jetzt das Dokument direkt in Word bearbeiten.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_2_7.png)


    # Office


    Der englische Begriff "Office" bedeutet eigentlich Büro. Bei Computerprogrammen
    bezeichnet er aber eine bestimmte Art von Programmen – eben solche, die häufig
    in Büros oder am Arbeitsplatz eingesetzt werden. Dazu gehören Programme zur Textverarbeitung,
    Tabellenkalkulation, für Datenbanken und grafische Präsentationen. Diese vier
    Programme sind meist in einem Office-Paket vereint. Jedes moderne Office-Paket,
    egal ob es von den Firmen Microsoft, Corel, StarDivision oder Lotus ist, beinhaltet
    inzwischen solche Programme.


    # Hyperlink


    Der Hyperlink ist eine der Techniken, durch die das Internet berühmt geworden
    ist. Es ist ein Verweis auf eine andere Datei. Im Internet springen Sie so von
    einem Rechner zum nächsten, ohne daß Sie das merken. Aber auch außerhalb des Internets
    hat sich die Hyperlink-Technologie durchgesetzt. Sie setzen einen Hyperlink in
    einen Text oder eine Tabelle ein und wenn Sie den Hyperlink anklicken, springen
    Sie zu der entsprechenden Datei oder Textmarke. Auch bei Lexikon-CDs haben sich
    Hyperlinks durchgesetzt. So können Sie von einem Thema zum anderen springen.


    # Verknüpfung


    Oft ist es wichtig, eine Verbindung zwischen verschiedenen Programmen und Dateien
    herzustellen. Um das zu realisieren, werden in einer Datei oder einem Dokument
    Verknüpfungen zu anderen Dateien oder Dokumenten einge-fügt. Programme werden
    etwa als Symbol in einen Text oder eine Tabelle eingefügt. Wenn Sie auf dieses
    Symbol klicken, werden Sie direkt zu der anderen Datei weitergeleitet. Das ist
    hilfreich, wenn Sie nicht dauernd zwischen verschiedenen Programmen springen wollen.'
  merge: -1
  img_proc: true
- pgno: 3
  md: '# Excel


    # Weg mit den Leerzeichen


    Oft kommt es vor, daß in einer Tabelle unbeabsichtigte Leerzeichen eingefügt werden.
    Auch beim Import von Tabellen oder Datenbanken kommt das vor. So werden Sie die
    Leerzeichen wieder los.


    1 Wählen Sie im Menü "Einfügen" den Befehl "Funktion".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_3_0.png)


    2 Im Feld "Kategorie" wählen Sie den Punkt "Text" und im Feld "Funktion" den Punkt
    "Glätten".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_3_1.png)


    3 Sie müssen jetzt nur noch festlegen, in welchem Bereich der Tabelle, also in
    welchen Zellen die Leerzeichen gelöscht werden sollen. Die erste Möglichkeit:
    Geben Sie den Zellbereich manuell ein (etwa C1:C18; damit werden alle Zellen von
    C1 bis C18 auf Leerzeichen hin durchsucht). Die zweite Möglichkeit: Markieren
    Sie einfach die Zellen, in denen das passieren soll, mit der Maus. Wenn Sie die
    Maustaste wieder loslassen, wird dann automatisch der Tabellenbereich in das entsprechende
    Feld ("Text") eingetragen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_3_2.png)


    4 Klicken Sie auf "Ende". Excel löscht nun alle Leerzeichen, die am Anfang oder
    am Ende einer Zelle stehen. Leerzeichen zwischen zwei Wörtern werden aber nicht
    gelöscht.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_3_3.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_3_4.png)


    # Software


    Make Sense ist ein Übersetzungsprogramm, von dem Sie vom Deutschen ins Englische
    und andersherum übersetzen können. Die Bedienung des Programms ist sehr einfach,
    es klinkt sich auch in Office-Programme wie Word und Excel ein. Per Rechtsklick
    können Sie dann Übersetzungen eines Wortes einsehen und die Wörter auch direkt
    übersetzen. Einziges Manko: Es werden nur einzelne Wörter, nicht ganze Texte übersetzt.
    Für den günstigen Preis ist Make Sense aber empfehlenswert.


    INFO ICIB GmbH

    Tel. 0 22 05 / 99 17 07

    Preis: 44,95 Mark


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_3_5.png)'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# Excel


    # Rechtschreibprüfung


    Entweder stellen Sie die Rechtschreibprüfung schon an, bevor Sie einen Text schreiben
    oder Sie starten die Rechtschreibprüfung erst am Schluß. Wenn Sie schon von Anfang
    an aktiviert ist, werden nicht erkannte Wörter mit einer roten Wellenlinie unterstrichen.
    Word prüft dabei, ob die Wörter in seinem Wörterbuch enthalten sind. Wenn nicht,
    haben Sie die Möglichkeit, dem Wörterbuch neue Wörter hinzuzufügen. Hinzugefügte
    Wörter werden in der Datei "benutzer.dic" gespeichert.


    # AutoText


    Mit einem AutoText fügen Sie per Tastenkürzel ganze Sätze in einen Text ein. Sie
    müssen den Satz oder die Phrase nur markieren und als AutoText definieren. Wenn
    Sie das nächste Mal das gewählte Kürzel eingeben und danach die Taste "F3" drücken,
    wird automatisch der AutoText eingefügt.


    # Sicherheitskopie


    Damit Sie ganz sicher bei Rechnerabstürzen sind, gibt es in Word Sicherheitskopien
    der Dokumente. Wenn Sie Ihren Text normal speichern und beenden, wird gleichzeitig
    eine Sicherheitskopie im gleichen Verzeichnis angelegt. Die Sicherheitskopie in
    Word erkennen Sie an der Dateiendung ".wbk".


    # Registerkarte


    Sie finden die Registerkarten bei fast allen Menüs des Office-Pakets. Auf der
    Registerkarte, die sich an der Oberseite des Fensters befindet, ist ein Oberbegriff
    zu verschiedenen Einstellungen angegeben, die Sie vornehmen können. Registerkarten
    sparen viel Platz auf dem Bildschirm.


    # Vorschau bei der Suche


    Suchen Sie eine bestimmte Tabelle, wollen aber nicht jede dafür öffnen? Dafür
    gibt es eine Vorschau. Aber Vorsicht: Wenn die Vorschau nicht funktioniert, werfen
    Sie einen Blick auf das Ende dieses Tips!


    1 Wählen Sie aus dem Menü "Datei" den Befehl "Öffnen" oder klicken Sie das entsprechende
    Symbol an.


    2 Klicken Sie auf das Symbol "Vorschau" in der Symbolleiste. Excel zeigt Ihnen
    jetzt einen Ausschnitt aus der Tabelle.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_4_0.png)


    Das funktioniert aber nur, wenn Sie eine spezielle Funktion aktiviert haben. Klicken
    Sie dazu im Menü "Datei" den Punkt "Eigenschaften" an. Hier aktivieren Sie das
    Kästchen vor "Vorschaugrafik speichern".


    # Zur ersten bzw. letzten Zelle


    Genauso, wie Sie in Word mit einer Tastenkombination an den Textanfang oder dessen
    Ende springen, funktioniert das in Excel.


    1 Drücken Sie die Tastenkombination "Strg" und "Pos1", um zur Zelle A1 der Tabelle
    zu springen.


    2 Mit der Tastenkombination "Strg" und "Ende" kommen Sie normalerweise zur Zelle
    der letzten beschriebenen Zeile. Wenn Sie allerdings den Inhalt einer Zelle gelöscht
    haben, die weiter unten in der Tabelle stand, springen Sie mit der Tastenkombination
    dorthin.


    # Namen für Textbausteine


    Wenn Sie häufig denselben Text verwenden, sollten Sie ihm einen Namen geben. Damit
    sparen Sie sich die Eingabe, bzw. das Kopieren.


    1 Geben Sie in eine Zelle den Text ein, den Sie später schnell aufrufen wollen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_4_1.png)


    2 Markieren Sie die Zelle. Wählen Sie dann im Menü "Einfügen" den Punkt "Namen"
    und danach "Festlegen".


    3 Geben Sie dem Text einen kurzen Namen und bestätigen Sie dann mit "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_4_2.png)


    4 Wenn Sie das nächste Mal dieses Kürzel eingeben, wird automatisch der gesamte
    Text als Tip angezeigt. Bestätigen Sie dann mit der "Eingabetaste" und der Text
    wird in die Zelle eingetragen.


    # Inhalt einer Arbeitsmappe kopieren


    Mit einem einzigen Befehl kopieren Sie den Inhalt einer ganzen →Arbeitsmappe (mit
    Tabellen und Diagrammen) in eine neue.


    1 Wählen Sie das Menü "Fenster" an und klicken Sie dann auf "Neues Fenster".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_4_3.png)


    2 Es wird eine Arbeitsmappe geöffnet mit dem selben Inhalt. Diese Arbeitsmappe
    sollten Sie unter einem anderen Namen speichern. Eine andere Möglichkeit, nur
    die aktuelle Tabelle zu kopieren, besteht darin, den gesamten Inhalt einer Tabelle
    zu kopieren. Markieren Sie die Tabelle mit der Tastenkombination "Strg" und "A"
    und wählen aus dem Menü "Bearbeiten" "Kopieren". In der neuen Tabelle wählen Sie
    "Einfügen".'
  merge: -1
  img_proc: true
- pgno: 5
  md: '# Excel


    # Zeilen ausfüllen


    Wenn Sie eine Zahlenreihe (etwa 1,2,3...) oder Datumsangaben in Ihrer Tabelle
    haben, müssen Sie nicht jeden Wert eigenhändig eintippen. Mit dem Befehl "Ausfüllen"
    geht das automatisch.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_5_0.png)


    In einem gelben Kasten wird Ihnen angezeigt, welcher Wert in die letzte Zelle
    eingetragen wird.


    1 Geben Sie einen Wochentag oder eine Zahl ein.


    2 Markieren Sie die →Zelle und klicken Sie mit der rechten Maustaste an.


    5 Lassen Sie die Maustaste los und es erscheint ein Kontextmenü, in dem Sie wählen
    können, womit die markierten Zellen ausgefüllt werden.


    3 Bewegen Sie die Maus an die rechte untere Ecke der Zelle. Der Mauszeiger verwandelt
    sich in ein Plus-Zeichen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_5_1.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_5_2.png)


    4 Klicken Sie mit der rechten Maustaste, lassen sie gedrückt und ziehen die Markierung
    entweder nach rechts oder links.


    6 Je nachdem, ob Sie die erste Zelle kopieren, eine Reihe ausfüllen oder etwas
    anderes eintragen lassen wollen, klicken Sie die entsprechende Option an.


    # Zeilen ausfüllen II


    Wenn Sie schon vorher wissen, ob Sie eine Reihe ausfüllen oder einen Wert kopieren
    wollen, geht das noch schneller.


    3 Der gelbe Kasten zeigt Ihnen an, ob die Reihe weitergeführt oder der Wert nur
    kopiert wird. Mit der "Strg"-Taste (bei gedrückter Maustaste) wechseln Sie zwischen
    den beiden Möglichkeiten.


    1 Wiederholen Sie die Schritte 1 bis 3 von vorhin.


    2 Klicken Sie die markierte Zelle aber mit der linken Maustaste an und ziehen
    die Markierung in die gewünschte Richtung.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_5_3.png)


    # Verknüpfung


    Es ist ganz einfach, in Excel 97 eine Verknüpfung zu einer Word-Datei einzufügen.
    Markieren Sie eine Zelle, wählen aus dem Menü


    "Einfügen" "Hyperlink" und geben den Pfad der gewünschten Datei ein. In der Zelle
    erscheint die Datei dann als →Hyperlink.'
  merge: -1
  img_proc: true
- pgno: 6
  md: '# Arbeitsmappe


    In Excel besteht ein Dokument oder eine Datei aus einer Arbeitsmappe. In dieser
    Arbeitsmappe können mehrere Tabellen oder auch Diagramme enthalten sein. Das ist
    praktisch, wenn Sie mehrere Tabellen oder Diagramme zu einem Thema haben. Die
    Tabellen müssen dann nicht mehr einzeln gespeichert werden, sondern sind Inhalt
    einer Arbeitsmappe. Am unteren Rand des Bildschirms, unter der Tabelle selbst,
    ist angegeben, wie viele Tabellen oder Diagramme die Arbeitsmappe enthält, und
    wie sie heißen


    # Mehrere Zeilen oder Spalten einfügen


    Haben Sie bisher immer Zeile für Zeile in eine Tabelle eingefügt? Mit zwei Mausklicks
    fügen Sie so viele Zeilen und Spalten ein, wie Sie wünschen.


    1 Markieren Sie so viele Zeilen oder Spalten, wie Sie einfügen wollen. Es macht
    nichts, wenn etwas in den Zellen steht.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_6_0.png)


    2 Klicken Sie mit der rechten Maustaste auf die markierten Zellen und wählen Sie
    aus dem Kontextmenü "Einfügen".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_6_1.png)


    3 Vor den beschriebenen Zeilen oder Spalten werden die neuen, leeren eingefügt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_6_2.png)


    # Zelle


    Auf dem Bildschirm ist eine Excel-Tabelle unterteilt in viele, anfangs gleichgroße
    Kästchen. Diese Kästchen werden Zellen genannt. Jede Zelle hat einen bestimmten
    "Namen", der sich nach ihrer Position innerhalb der Tabelle richtet. Denn eine
    Tabelle ist wiederum in Spalten und Zeilen geordnet. Spalten werden mit Buchstaben
    benannt (A, B, C ...), Zeilen mit Zahlen (1,2,3 ...). Daraus ergeben sich die
    einzelnen Zellenbezeichnungen, z.B. B7 (also zweite Spalte, siebte Zeile). Die
    Höhe und Breite der Zellen können Sie dabei beliebig verändern.


    # Spalten in Zeilen und umgekehrt


    Ist Ihnen das auch schon passiert? Sie entwerfen eine Tabelle, stellen aber am
    Schluß fest, daß Zeilen und Spalten besser umgekehrt angeordnet sein sollten.
    So strukturieren Sie Ihre Tabelle um.


    1 Markieren Sie den Bereich der Tabelle, den Sie anders anordnen wollen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_6_3.png)


    2 Wählen Sie im Menü "Bearbeiten" den Punkt "Kopieren" oder klicken das entsprechende
    Symbol an.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_6_4.png)


    3 Suchen Sie sich die Stelle aus, an der die geänderte Tabelle eingefügt werden
    und klicken Sie die Zelle an.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_6_5.png)


    4 Wählen Sie im Menü "Bearbeiten" den Befehl "Inhalte einfügen" an.


    Es öffnet sich ein Menü, in dem Sie auswählen, was genau eingefügt werden soll.
    Hier soll Sie nichts interessieren, außer dem Kästchen "Transponieren". Klicken
    Sie das Kästchen an und bestätigen Sie mit "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_6_6.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_6_7.png)


    Die Tabelle wird jetzt in umgekehrter Form an der markierten Stelle eingefügt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_6_8.png)


    Löschen Sie dann den alten Teil der Tabelle. Leider können Sie den markierten
    Bereich nicht einfach ausschneiden und dann die umstrukturierte Tabelle einfügen.


    # Hyperlink


    Das ist eine Internet-Technik. Der Hyperlink ist ein Verweis auf eine andere Datei.
    Im Internet springen Sie so von einem Rechner zum nächsten, ohne daß Sie das merken.
    Aber auch in Texten und Tabellen hat sich die Hyperlink-Technik durchgesetzt.
    Sie setzen einen Hyperlink in einen Text oder eine Tabelle, wenn Sie den Hyperlink
    anklicken, springen Sie zu der entsprechenden Datei oder Textmarke.'
  merge: -1
  img_proc: true
- pgno: 7
  md: '# Excel


    # Arbeitsmappe


    In Excel besteht ein Dokument oder eine Datei aus einer Arbeitsmappe. In dieser
    Arbeitsmappe können mehrere Tabellen oder auch Diagramme enthalten sein. Die Tabellen
    müssen dann nicht mehr einzeln gespeichert werden, sondern sind Inhalt einer Arbeitsmappe.
    Am unteren Rand des Bildschirms (unter der Tabelle selbst), ist angegeben, wie
    viele Tabellen oder Diagramme die Arbeitsmappe enthält und wie sie heißen.


    # Zelle


    Die kleinste Einheit einer Tabelle ist die Zelle. Hier geben Sie die Daten und
    Formeln ein. Eine Zelle ist grau umrandet.


    # Lese-Ecke


    Das Internet muß kein Buch mit sieben Siegeln sein. Der Einstieg ist leichter,
    als Sie denken. Außerdem brauchen Sie keine Programmiersprachen zu können, um
    eigene Homepages zu erstellen. Das geht auch mit den Programmen des "Microsoft
    Office". Wie Sie richtig mit Office 97, dem "Internet Explorer" und "Outlook Express"
    ins Internet einsteigen, zeigt das Buch Mit Microsoft-Programmen ins Internet.
    Gerade Einsteiger finden hier einige wertvolle Tips; etwa wie Sie eine e-mail
    verschicken, wie und wohin Sie sich im Internet bewegen. Mit kleinen Schritt-für-Schritt-Anleitungen
    lernen Sie auch, wie Ihre Word- oder Excel-Dokumente im weltweiten Netz publizieren.
    Auf der beiliegenden CD finden Sie einige Programme für das Internet. Einziges
    Manko: Das Buch könnte etwas übersichtlicher gestaltet sein.


    INFO ITP Verlag

    ISBN: 3-8266-0388-5

    Preis: 39,80 Mark


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_7_0.png)


    # Daten gleich in mehrere Tabellen eingeben


    Oft stehen in mehreren Tabellen die selben Daten, zum Beispiel Monatsangaben oder
    die Überschriften der Tabellen. Mit einem einfachen Trick fügen Sie Daten in mehrere
    Tabellen einer →Arbeitsmappe ein.


    1 Drücken Sie die "Strg"-Taste und klicken Sie gleichzeitig auf die Registerkarte
    am unteren Ende der Tabelle, in der die Namen der Tabellen eingetragen sind.


    2 Die Namen der Tabellen, die Sie angeklickt haben, sind jetzt weiß hinterlegt.
    Das heißt, sie sind aktiv.


    3 Wenn Sie jetzt Werte in eine Zelle eingeben, werden sie automatisch in den anderen
    Tabellen übernommen. Aber aufgepaßt: Wenn Sie Daten wieder nur in eine Tabelle
    eingeben wollen, müssen Sie noch einmal die Registerkarten mit den Tabellennamen
    anklicken; sonst geben Sie überall die selben Daten ein.


    # Dateneingabe erleichtern


    Müssen Sie viele Daten in eine Tabelle eingeben, sollte es möglichst schnell gehen.
    Wenn Sie die Eingabetaste nach der Eingabe eines Werts drücken, springt die Zellenmarkierung
    automatisch in die darunterliegende →Zelle. In zwei Schritten legen Sie fest,
    daß statt dessen die Zelle rechts, links oder darüber angewählt wird.


    1 Wählen Sie aus dem Menü "Extras" den Punkt "Optionen". Hier klicken Sie auf
    die Registerkarte "Bearbeiten".


    2 Unter den Einstellungen sehen Sie einen Punkt "Markierung nach dem Drücken der


    Eingabetaste verschieben". Als Standard ist hier "Unten" eingetragen. Klicken
    Sie auf den Pfeil neben dem Feld. Wählen Sie die gewünschte Richtung aus, also
    "oben", "rechts" oder "links".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_7_1.png)


    Nach einem Klick auf "OK" wird die Markierung bei der Dateneingabe jetzt so verschoben,
    wie Sie es festgelegt haben.


    # Keine Nullwerte in Tabellen


    Nullwerte in Tabellen lassen sich vermeiden; Sie müssen nur die richtige Option
    wählen und statt einer "0" wird eine leere Zelle angezeigt.


    1 Wählen Sie aus dem Menü "Extras" den Punkt "Optionen". Hier klicken Sie auf
    die Registerkarte "Ansicht".


    2 Im Feld "Fenster optionen" ist das Kästchen vor "Nullwerte" aktiviert. Klicken
    Sie den Haken weg und es erscheinen keine Nullwerte mehr.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_7_2.png)


    # Fix zu den Tabellen


    Wenn Sie in einer Arbeitsmappe viele Tabellen angelegt haben, ist es schwer, den
    Überblick zu behalten. In der unteren Tabellenleiste können außerdem nur wenige
    Tabellennamen untergebracht werden. So wechseln Sie per Mausklick zwischen den
    Tabellen:


    einem Kontextmenü werden alle Tabellen der Arbeitsmappe angezeigt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_7_3.png)


    1 Klicken Sie mit der rechten Maustaste auf die Pfeiltasten vor den Namen der
    Tabellen. In


    2 Wählen Sie die entsprechende Tabelle an. Jetzt wechseln Sie direkt dorthin.'
  merge: -1
  img_proc: true
- pgno: 8
  md: '# Kennwörter für Arbeitsmappen


    Manche Arbeitsmappen in Excel sind vertraulicher als andere. Deshalb können Sie
    Arbeitsmappen mit einem Paßwort schützen. Außerdem legen Sie fest, ob die Arbeitsmappen
    ohne Paßwort nicht gelesen (Leseschutz) oder nicht verändert (Schreibschutz) werden
    dürfen.


    1 Nachdem Sie eine Arbeitsmappe angelegt haben, klicken Sie im Menü "Datei" auf
    den Befehl "Speichern unter".


    2 Klicken Sie anschließend auf die Schaltfläche "Optionen". Es erscheint ein Fenster,
    in dem Sie zwei Dinge angeben können: Sie legen fest, daß mit der Speicherung
    gleichzeitig eine →Sicherheitskopie angelegt wird und Sie vergeben ein Paßwort
    für den Lese-, bzw. Schreibschutz.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_8_0.png)


    3 Geben Sie ein Paßwort für den Schreib- und Leseschutz sowie nur für den Schreibschutz
    ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_8_1.png)


    Bevor ein Benutzer die geschützte Datei öffnen kann oder sie speichern will, fragt
    Excel nach dem Paßwort.


    4 Wenn Sie das Kästchen vor "Schreibschutz empfehlen" anklicken, passiert folgendes:
    Wenn jemand anderes eine Datei öffnet, die Sie gespeichert haben, kann er diese
    nur schreibgeschützt öffnen. Will der Benutzer trotzdem die Datei speichern, muß
    er das unter einem anderen Namen tun.


    Wenn Sie diesen Tip befolgen, sind Ihre Daten und Tabellen vor fremden Zugriffen
    sicher.


    # Standard-Symbolleisten wieder herstellen


    Manchmal tun Sie zu viel des Guten: Symbolleisten lassen sich zwar beliebig anpassen,
    die Übersichtlichkeit steigt dabei aber nicht gerade. Vielleicht ist Ihnen aber
    auch eine →Symbolleiste verloren gegangen, die Sie dringend brauchen? So holen
    Sie die ursprüngliche Symbolleiste zurück:


    1 Suchen Sie aus dem Menü "Ansicht" den Punkt "Symbolleisten" heraus und wählen
    Sie dort "Anpassen".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_8_2.png)


    2 In diesem Fenster klicken Sie auf die Schaltfläche "Zurücksetzen".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_8_3.png)


    Sie werden noch einmal gefragt, ob Sie sich wirklich sicher sind. Bejahen Sie
    das. Jetzt stehen Ihnen die Symbolleisten der ersten Stunde Ihrer Excel-Geschichte
    zur Verfügung.


    3 Wenn Sie doch ein paar Änderungen an Ihren Symbolleisten machen wollen, tun
    Sie das ebenfalls über das Menü "Extras", "Anpassen". Klicken Sie dann auf die
    Registerkarte "Befehle". Dann wählen Sie die einzelnen Menüpunkte an und ziehen
    die Befehle auf Ihre Symbolleiste.


    # Sicherheitskopie


    Die Sicherheitskopie-Funktion im Microsoft Office ist nur wenig sinnvoll. Wenn
    ein Programm oder Ihr Rechner abstürzt, wird das zuletzt geöffnete Dokument wiederhergestellt
    – unabhängig davon, ob Sie eine Sicherheitskopie angelegt haben oder nicht. Sicherheitskopien
    von Dokumenten werden nur gespeichert, wenn Sie Ihr Dokument speichern. Sie erkennen
    die Sicherheitskopie an der Dateiendeung ".wbk". Wenn Sie später aus Versehen
    die Originaldatei löschen sollten, können Sie die Sicherheitskopie anstatt dessen
    laden.


    # Symbolleiste


    In der Symbolleiste sind Symbole für die meistbenutzten Befehle versammelt (etwa
    Datei öffnen). Inzwischen gibt es aber in den Office-Programmen so viele Funktionen,
    daß eine Symbolleiste nicht mehr ausreicht. Sie können die Symbolleisten individuell
    verändern oder neue auf den Bildschirm holen.


    # PCgo! TIP Software-Ecke


    Gehören Sie zur Gattung der Schnäppchenjäger? Dann finden Sie auf der CD Superschnäppchen
    Futter für Ihre Passion. In einer Datenbank können Sie nach einzelnen Stichwörtern,
    nach Postleitzahl, Ort oder Branche suchen. Die Trefferliste enthält neben einer
    kurzen Beschreibung des Angebots auch die Adresse, eine Wegbeschreibung, Sparmöglichkeiten
    und die Öffnungszeiten der Firma. Über das Internet soll das Angebot erweitert
    werden. Die Suchergebnisse lassen sich auch ausdrucken. Die Datenbank selbst hätte
    aber größer ausfallen können.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_8_4.png)


    INFO Koch Media GmbH ISBN: 3-85323-309-X Preis: 19,90 Mark'
  merge: -1
  img_proc: true
- pgno: 9
  md: '# Excel


    # Aus Dezimalzahl wird Ganzzahl


    # Speichern mehrerer Dateien


    # → Zelle


    Die Zelle ist die kleinste Einheit in einer Tabelle. Sie dient zur Aufnahme von
    Daten (Texte, Zahlen oder Formeln). Jede einzelne Zelle wird durch die genaue
    Position in einer Zeile und Spalte festgelegt. Spalten erkennt man an den durchlaufenden
    Buchstaben, die Zellen sind an den fortlaufenden Zahlen, beginnend mit der 1,
    zu erkennen.


    # → Arbeitsmappe


    Eine Arbeitsmappe ist die Datei, in der die Daten bearbeitet und gespeichert werden.
    Jede einzelne Arbeitsmappe kann unterschiedlich viele Blätter enthalten. Außerdem
    können Sie verschiedene Arten zusammengehöriger Daten in einer einzigen Datei
    speichern.


    # → Arbeitsbereichdatei


    Eine Arbeitsbereichdatei ist im Grunde eine Sammeldatei, in der Informationen
    zu allen geöffneten Arbeitsmappen gespeichert werden. Dazu gehören unter anderem
    der Speicherort, die Fenstergröße sowie die Bildschirmposition.


    # → Datensatz


    Ein Datensatz ist ein Teil einer Datenbank. In diesem Datensatz werden alle wichtigen
    Informationen gespeichert wie beispielsweise Name, Ort, Straße etc. Die einzelnen
    Datensätze werden hintereinander gespeichert, ähnlich einer Einsortierung in einem
    Aktenordner. Über verschiedene Abfragemuster kann auf jeden einzelnen Datensatz
    wieder zugegriffen werden.


    Wie bekommt man aus Dezimalzahlen Ganzzahlen? Hier kann man sich mit einem kleinen
    Trick behelfen. Um die Dezimalstellen bei bereits eingegebenen Zahlen zu entfernen,
    multiplizieren Sie einfach die Zahlen mit einer entsprechenden Zehnerpotenz (je
    nach Dezimalstellen mit 10, 100, 1000 etc.). In Einzelschritten sieht das wie
    folgt aus:


    +   1. Sie geben in einer leeren →Zelle die entsprechende Zahl ein.

    +   2. Kopieren Sie die Zelle über den Menüpunkt "Bearbeiten/Kopieren".

    +   3. Markieren Sie nun die Zellen mit den zu verändernden Dezimalzahlen (die
    markierten Zellen müssen jedoch aneinandergrenzen).

    +   4. Wählen Sie nun aus dem Menü "Bearbeiten" den Punkt "Inhalte einfügen" aus.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_9_0.png)


    5 Im sich öffnenden Dialogfeld wählen Sie dann den Punkt "Multiplizieren" an.
    Bestätigen Sie mit "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_9_1.png)


    Um von vornherein auf Dezimalzahlen zu verzichten, gehen Sie so vor:


    +   1. Öffnen Sie im Menü "Extras" den Punkt "Optionen".

    +   2. Wählen Sie im nächsten Fenster die Registerkarte "Bearbeiten" aus.

    +   3. Deaktivieren Sie das Kontrollkästchen "Feste Dezimalstelle".

    +   4. Bestätigen Sie mit "OK". Dann werden keine Dezimalzahlen mehr angezeigt.


    Sie haben unter Excel die Möglichkeit, eine ganze Gruppe von →Arbeitsmappen mit
    einem einzigen Schritt zu öffnen, indem Sie einen benutzerdefinierten Arbeitsbereich
    anlegen und alle gewünschten Daten darin speichern. Diese Methode eignet sich
    besonders für häufig genutzte Dateien, die in engem Zusammenhang mit der aktuellen
    Arbeitsmappe stehen. Dazu gehen Sie wie folgt vor:


    +   1. Öffnen Sie die Arbeitsmappen, die als Gruppe geöffnet werden sollen, über
    das Menü "Öffnen" und wählen dann die entsprechenden Dateien aus.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_9_2.png)


    2 Legen Sie nun die Größe und Position der Arbeitsmappenfenster so fest, wie sie
    beim nächsten Verwenden der Arbeitsmappen angezeigt werden sollen.


    nächsten Verwenden der Arbeitsmappen angezeigt werden sollen.


    +   3. Klicken Sie im Menü "Datei" auf den Punkt "Arbeitsbereich speichern".

    +   4. Geben Sie im Feld "Dateiname" den Namen für die Arbeitsbereichdatei ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_9_3.png)


    Über den Befehl "Öffnen" können Sie Ihre →Arbeitsbereichdatei jederzeit öffnen.
    Die Arbeitsbereichdatei enthält aber nicht die Arbeitsmappen selbst. Sie müssen
    Ihre Änderungen direkt in den Arbeitsmappen vornehmen und auch dort speichern.
    Um schnell auf die Arbeitsbereichsdatei zuzugreifen, speichern Sie diese im Ordner
    "XLstart". Die Arbeitsmappen speichern Sie im gewohnten Verzeichnis. Um alle Arbeitsmappen
    gleichzeitig zu schließen, drücken Sie die Umschalttaste und wählen Sie aus dem
    Menü "Datei" den Befehl "Alles schließen".'
  merge: -1
  img_proc: true
- pgno: 10
  md: '# Excel


    # Doppelte Datensätze finden


    Bei Datenbank-Anwendungen, beispielsweise einer umfangreichen Adreßdatei, taucht
    häufig folgendes Problem auf: →Datensätze werden doppelt eingegeben. Um den Wust
    solcher "Fehleingaben" einzuschränken, sollten Sie sich einmal monatlich etwas
    Zeit nehmen, um die Duplikate zu entfernen. Doch keine Angst: Dazu benötigen Sie
    nicht Stunden; das ist mit einigen wenigen Mausklicks zu realisieren, wenn Sie
    dabei wie folgt vorgehen:


    +   1 Öffnen Sie über das Menü "Datei/Öffnen" die zu überprüfende Datei.


    +   2 Markieren Sie nun eine beliebige Zelle in der Datenbank. Wählen Sie im Menü
    "Daten" den Menüpunkt "Filter" und den Unterpunkt "Spezialfilter" an. So können
    Sie die Datensätze besser überblicken.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_10_0.png)


    +   3 Die Vorgabe im Feld "Kriterienbereich" löschen Sie und aktivieren anschließend
    das Kontrollkästchen "Keine Duplikate".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_10_1.png)


    +   4 Bestätigen Sie das Dialogfeld mit einem Klick auf "OK".


    Direkt im Anschluß an Ihre Bestätigung wird die komplette Datenbank ausgewertet
    und auf doppelte Datensätze hin überprüft. Je nach Größe der Datenbank kann das
    einige Zeit in Anspruch nehmen.


    Wenn der Suchvorgang beendet ist, taucht in der Statuszeile folgende Meldung auf:
    "x Datensätze von y gefunden"


    Die Anzahl der doppelten Datensätze wird dabei als Differenz zwischen den Werten
    x und y angezeigt. Stimmen beide Werte überein, sind auch keine Duplikate vorhanden.


    # Kompatibilität


    Wenn verschiedene Programme problemlos Daten austauschen können, ist deren Kompatibilität
    zueinander gewährleistet. Probleme gibt es aber auch zwischen verschiedenen Programmversionen.
    So "verstehen" ältere Versionen nicht die Dateiformate neuerer Versionen. Um das
    zu umgehen, sollten Sie beim Speichern ein Format wählen, das beide Programme
    unterstützt.


    # Drop-Down-Liste


    Eine Drop-Down-Liste ist eine herunterklappbare Auswahlliste, in der sich verschiedene
    Menüeinträge befinden, die Sie einzeln anwählen können. Sie erkennen sie am kleinen
    schwarzen Pfeil, den Sie mit der Maus anklicken können. Daraufhin klappt ein neues
    Menü mit Einträgen auf.


    # Kompatibilitätsprobleme bei Dateiformaten


    "Excel 97" umfaßt wesentlich mehr Funktionen als die früheren Versionen. Daraus
    ergeben sich auch einige Probleme, denn die 97er-Version hat ihr eigenes Dateiformat
    – und das kann nicht mehr von früheren Versionen gelesen werden. Das führt besonders
    beim Datenaustausch mit anderen, die weiterhin mit älteren Excel-Versionen arbeiten,
    zu sogenannten →Kompatibilitäts-Problemen. Um sicherzustellen, daß Ihre Daten
    in einem kompatiblen Format gespeichert werden, gibt es zwei Möglichkeiten:


    +   1 Sie speichern Ihre Arbeitsblätter im Format "Microsoft Excel 5.0/95". Das
    hat aber einige Nachteile, denn alle Excel-97-spezifischen Inhalte gehen verloren.
    Jedoch läßt sich die Datei in Excel 5.0/95 lesen und schreiben.


    +   2 Sie können beim Speichern aber auch das Format "Microsoft Excel 97 & 5.0/95-Arbeitsmappe"
    wählen. Jetzt speichert Excel Ihre Arbeitsmappe zwar in einer einzigen Datei,
    aber in zwei Formaten: einmal im speziellen Excel-97-Format und einmal in einer
    Version für Excel 5.0/95. Dabei gehen Ihnen keine Inhalte verloren und die Arbeitsmappe
    bleibt trotzdem für frühere Versionen lesbar.


    Ein kleiner Trick hilft Ihnen, beim Speichern die manuelle Auswahl des Formats
    einzusparen. Dazu gehen Sie wie folgt vor:


    +   1 Rufen Sie im Menü "Extras" den Punkt "Optionen" auf.


    +   2 Klicken Sie im nächsten Fenster die Registerkarte "Umsteigen" an.


    +   3 Wählen Sie aus der →Drop-Down-Liste "Standard-Dateityp für Speichern unter"
    das Format "Microsoft Excel 97 & 5.0/95-Arbeitsmappe" aus. Bestätigen Sie den
    Eintrag mit "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_10_2.png)


    Danach sichert Excel Ihre Arbeitsmappen im gewünschten Format.


    # PCgo! TIP Software-Ecke


    Clip-Arts braucht man immer wieder. Egal, ob Sie schnell eine Einladungs- oder
    Visitenkarte entwerfen oder einfach einen Brief aufpeppen wollen. Clip-Art-Sammlungen
    gibt es aber in Hülle und Fülle. Witzige Clip-Arts sind da schon schwerer zu finden.
    "Cartoons Vol. 1 und Vol. 2" von Fuji ist da eine nette Ausnahme. Aus den verschiedensten
    Themengebieten finden Sie 1.000 witzige Cartoons, die Sie schnell in jedes Programm
    einfügen können. Die Bilder sind im Format ".wmf" gespeichert, lassen sich aber
    auch in die gängigsten anderen Formate konvertieren und damit auf die Festplatte
    speichern. Das Einfügen per Drag & Drop funktioniert allerdings nicht. Da bleibt
    nur der Umweg über die Zwischenablage.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_10_3.png)


    INFO Fuji Magnetics Tel. (01 80) 5 25 17 18 Preis: 19,80 Mark'
  merge: -1
  img_proc: true
- pgno: 11
  md: '# Markierungsrahmen


    Der Markierungsrahmen ist ein Hilfsmittel. Durch ihn haben Sie eine visuelle Kontrolle
    über Ihre Auswahl. Der Markierungsrahmen tritt in verschiedenen Arten in Erscheinung.
    Wenn Sie in der Tabelle mehrere Zellen markieren, wird der Rahmen mit durchgezogenen
    Linien dargestellt. Benutzen Sie eine Funktion, die Sie zu einer Auswahl auffordert,
    wird der Rahmen mit blinkenden Linien dargestellt.


    # Tabellentext drehen


    Die Daten einer Tabelle lassen sich mit einem kleinen Trick sehr auffällig gestalten.
    Sie haben die Möglichkeit, den Text zwischen minus 90 und plus 90 Grad zu drehen.


    1 Markieren Sie die Zellen, in denen Sie den Text bearbeiten möchten.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_11_0.png)


    2 Öffnen Sie den Menüpunkt "Format/Zellen". Ein neues Menü mit dem Namen "Zellen"
    wird angezeigt. Klicken Sie hier auf die Registerkarte "Ausrichtung", um weitere
    Einstellungsmöglichkeiten zu sehen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_11_1.png)


    3 Im Feld "Ausrichten" können Sie die Textausrichtung beliebig verändern. Stellen
    Sie hierzu in der Auswahl "Grad" den gewünschten Wert ein. Alternativ dazu können
    Sie auch im darüberliegenden Fenster den Gradanzeiger mit der Maus bewegen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_11_2.png)


    4 Als nächstes verändern Sie die →Textanordnung. Das ist nötig, damit der veränderte
    Text zentriert in der Tabellenzelle angezeigt wird. Wählen Sie für die Horizontal-
    und Vertikaleinstellung den Wert "Zentriert" aus.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_11_3.png)


    5 Danach schließen Sie das Auswahlmenü mit einem Klick auf "OK". In Ihrer Tabelle
    sehen Sie sofort das Ergebnis Ihrer Änderung.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_11_4.png)


    # Zelle(n)


    Der Arbeitsbereich von Excel wird in Spalten und Zeilen eingeteilt. Eine Zelle
    ist der Schnittpunkt zwischen einer Spalte und einer Zeile. In ihr können beliebige
    Daten oder Funktionen eingetragen werden. Sie können den Arbeitsbereich mit einem
    karierten Block vergleichen. Jedes einzelne Quadrat wäre dann mit einer Zelle
    von Excel vergleichbar.


    # Textanordnung


    Die Textanordnung definiert, wie ein Text in einer Zelle positioniert wird. Man
    unterteilt die Anordnung in eine Horizontal- und Vertikalausrichtung. In der Horizontalausrichtung
    können Sie bestimmen, ob der Text linksbündig, rechtsbündig oder mittig ausgerichtet
    wird. Die Vertikalausrichtung legt fest, ob der Text am oberen oder unteren Zellenrand
    oder in der Mitte angeordnet wird.


    # Shortcut


    Als Shortcut bezeichnet man eine Tastenkombination zum Aufruf eines Befehls. Anstatt
    eine Funktion über einem Menüpunkt auszuwählen, genügt eine Tastenkombination.
    Dadurch können Sie schneller arbeiten. In Menüs wird der Shortcut zu einem Menüpunkt
    mit einem unterstrichenen Buchstaben dargestellt.


    # Datum und Uhrzeit schnell einfügen


    In Excel haben Sie die Möglichkeit, das aktuelle Datum und die Uhrzeit sehr schnell
    in Ihre Tabelle einzufügen. Sie können sich dabei den umständlichen Weg über das
    Menü "Einfügen/ Funktion..." sparen. Benutzen Sie statt dessen einen →Shortcut.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_11_5.png)


    1 Um das aktuelle Datum einzufügen, klicken Sie auf die →Zelle, die das Datum
    enthalten soll. Drücken Sie anschließend die Tasten "Strg" und "." gleichzeitig.
    Durch diese Tastenkom- bination wird das heutige Datum im →Format TT.MM.JJ in
    die von Ihnen gewählte Zelle eingefügt.


    2 Auch für die Uhrzeit wählen Sie zuerst eine Zelle mit einem Klick aus. Anschließend
    drücken Sie die Tasten "Strg", "Umschalten" und "." gleichzeitig. Die Uhrzeit
    erscheint im Format HH.MM.


    Das aktuelle Datum und die Uhrzeit werden aus den Angaben der Systemsteuerung
    übernommen. Sollte also einmal das falsche Datum eingefügt werden, so liegt das
    nicht an Excel. Rufen Sie die Systemsteuerung auf. Im Menü "Datum/Uhrzeit" lassen
    sich die Einstellungen verändern.'
  merge: -1
  img_proc: true
- pgno: 12
  md: '# Excel


    # Zahlen schnell summieren


    Brauchen Sie häufig die Summenfunktion in Ihren Tabellen? Dann gibt es einen bequemen
    Weg, die benötigte Formel in eine Zelle einzufügen.


    |   | A | B | C | D |

    |---|---:|---:|---:|---:|

    | 1 | 11 | 3 | 73 |   |

    | 2 | 18 | 10 | 74 |   |

    | 3 | 3 | 11 | 96 |   |

    | 4 | 9 | 4 | 98 |   |

    | 5 |   |   |   |   |

    | 6 |   |   |   |   |

    | 7 |   |   |   |   |

    | 8 |   |   |   |   |


    +   1. Markieren Sie die Zelle, in der die Summe angezeigt werden soll.


    +   2. Drücken Sie die Tasten „Alt“, „Umschalten“ und „O“. Eine Summenfunktion
    wird in die Zelle eingefügt. Gleichzeitig schlägt Excel Ihnen den Bereich vor,
    der summiert werden soll. Die zugehörigen Zellen werden in einem Laufbandrahmen
    dargestellt.


    Möchten Sie lieber einen anderen Bereich summieren oder den ausgewählten Bereich
    vergrößern? Klicken Sie mit der linken Maustaste auf den Anfang des Bereichs,
    den Sie markieren möchten. Halten Sie die Maustaste gedrückt und bewegen Sie den
    Mauszeiger zum Ende des Bereichs. Anhand des **→ Markierungsrahmens** können Sie
    sofort erkennen, welche Zellen in Ihre Auswahl einbezogen werden.


    |   | A | B | C | D |

    |---|---:|---:|---:|---:|

    | 1 | 11 | 3 | 73 |   |

    | 2 | 18 | 10 | 74 |   |

    | 3 | 3 | 11 | 96 |   |

    | 4 | 9 | 4 | 98 |   |

    | 5 |   |   | =SUMME(B1:C2) |   |

    | 6 |   |   |   |   |

    | 7 |   |   |   |   |

    | 8 |   |   |   |   |


    +   4. Wenn Sie mit Ihrer Auswahl zufrieden sind, drücken Sie die Return-Taste.
    In der von Ihnen zuvor gewählten Zelle erscheint jetzt die Summe der markierten
    Zellen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_12_0.png)


    # Format


    In einem Format wird festgelegt, wie der Inhalt verschiedener Zeilen dargestellt
    werden soll. Ein Format kann sowohl Angaben zur Textausrichtung als auch Definitionen
    zur Anzeige von Zahlen haben. Wenn Sie ein Format definieren möchten, markieren
    Sie zuerst die betroffenen Zellen. Wählen Sie aus dem Menü den Befehl „Format/Zellen“
    aus, um weitere Einstellungen vorzunehmen. Sie haben zum Beispiel die Möglichkeit,
    die Schriftart zu ändern oder einen Rahmen anzulegen. Weitere Optionen sehen Sie
    nach einem Klick auf eine der sechs Registerkarten. Probieren Sie ein paar der
    Funktionen aus. Sie können die Einstellungen jederzeit wieder ändern.'
  merge: -1
  img_proc: true
- pgno: 13
  md: '# Assistenten


    Assistenten sind nützliche Helfer, die Sie bei Ihrer Arbeit unterstützen sollen.
    Inzwischen sind sie in jedem Produkt der Microsoft-Office-Serie vorhanden. Mit
    Assistenten lassen sich Routinearbeiten schnell erledigen, selbst wenn Sie mit
    der Bedienung eines Programmes noch nicht vertraut sind. Wenn Sie einen Assistenten
    verwenden, werden Sie Schritt für Schritt an das gewünschte Ergebnis herangeführt.
    Neuere Assistenten bieten nebenbei auch noch eine ausführliche Hilfefunktion zu
    den einzelnen Arbeitsschritten an.


    # Doppelte Datensätze aufspüren


    Beim Verwalten von Daten taucht ein Problem immer wieder auf: Adressen, Daten
    oder andere Informationen werden aus Versehen doppelt eingegeben. So sammeln sich
    im Laufe der Zeit viele unnütze Daten an. Um doppelte Datensätze aufzuspüren,
    läßt sich die Filtertechnik von Excel besonders gut einsetzen. Benutzen Sie diese
    Funktion wie einen →Assistenten; dann beseitigen Sie das Problem mit ein paar
    Mausklicks.


    +   - **1** Markieren Sie eine beliebige Zelle in Ihrer Datenbank. Wählen Sie
    das Menü "Daten/Fil ter/Spezialfilter" aus.

    +   - **2** Falls im Kriterienbereich Vorgaben stehen, löschen Sie diese. Aktivieren
    Sie jetzt das


    Kontrollkästchen "Keine Duplikate".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_13_0.png)


    **3** Bestätigen Sie alle gemachten Änderungen und Eingaben mit einem Klick auf
    "OK".


    Daraufhin überprüft Excel die komplette Datenbank. Das kann, je nach Datenumfang,
    schon einige Zeit in Anspruch nehmen. Nach Ablauf der Überprüfung erscheint in
    der →Statuszeile die Meldung in der folgenden Form: "x Datensätze von y gefunden".
    Die Differenz zwischen den Werten x und y ist die Anzahl der doppelten Datensätze.
    Sind beide Werte gleich, waren keine Duplikate vorhanden.


    # Statuszeile


    Die Statuszeile schließt den Arbeitsbereich nach unten hin ab und dient dabei
    als Ausgabeeile für Meldungen. In ihr werden alle aktuellen Angaben wie Bereitschaftsanzeige,
    eingesetzte Formeln etc. angezeigt.


    # Tauschen von Zeilen und Spalten


    Das Anlegen umfangreicher Tabellen ist meist mit viel Zeit- und Arbeitsaufwand
    verbunden. Viel zu spät stellt man dann fest, daß sich die Spalten wesentlich
    besser als Zeilen und die Zeilen besser als Spalten darstellen lassen. In diesem
    Fall sparen Sie sich ein erneutes Anlegen dieser Tabelle durch einen kleinen Kniff:
    Verwenden Sie einfach die Bearbeitungsfunktionen "Kopieren" und "Einfügen". So
    läßt sich die Tabelle dann in die geeignete Form drehen.


    +   - **1** Als erstes markieren Sie die Tabelle, die Sie ändern möchten.

    +   - **2** Kopieren Sie anschließend die Tabelle über das Menü "Bearbeiten/Kopieren"
    oder über die Tastenkombination "Strg" und "C" in die →Zwischenablage.


    **3** Fahren Sie mit dem Mauszeiger in die Zelle, die den obersten linken Rand
    (das ist die oberste linke Zelle) Ihrer neuen Tabelle bildet. Dann wählen Sie
    aus dem "Bearbeiten"-Menü den Punkt "Inhalte einfügen" aus.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_13_1.png)


    **4** Jetzt öffnet sich ein Dialog. Hier aktivieren Sie das Kontrollkästchen vor
    der Option "Transponieren" per Mausklick. Klicken Sie anschließend auf "OK". Danach
    tauscht Excel sowohl Spalten als auch Zeilen aus.


    # Zwischenablage


    Dies ist ein temporärer Speicherbereich, der für den Austausch von Daten in Anwendungsprogrammen
    reserviert ist, speziell beim Ausschneiden, Kopieren und Einfügen.


    # scrollen


    Als Scrollen bezeichnet man das Bewegen des Bildschirminhaltes in horizontaler
    oder vertikaler Richtung. Dazu steht Ihnen in den meisten Anwendungen eine sogenannte
    Bildlaufleiste zur Verfügung. Sie hat an beiden Enden jeweils einen Pfeil und
    in der Mitte einen Positionszeiger. Sie können den Bildschirminhalt bewegen, indem
    Sie entweder auf einen der beiden Pfeile klicken oder den Positionszeiger verschieben.


    # Excel 7: Addieren von Uhrzeiten


    Bei der Addition von Uhrzeiten taucht meist der gleiche Effekt auf. Wenn Sie zum
    Beispiel die Zeiten 2:30, 12:50 und 17:30 addieren, erhalten Sie den Wert 8:50.
    Excel rechnet hier im 24-Stunden-Takt. Manchmal ist dieser eigentlich logische
    Wert jedoch nicht erwünscht. Vielmehr möchte man die Gesamstundenzahl angezeigt
    bekommen. Dazu müssen Sie wie folgt vorgehen:


    **1** Sie markieren mit der Maus das gewünschte Feld, in dem später die Summe
    der Uhrzeiten ausgegeben werden soll.


    **2** Wählen Sie nun aus dem "Format"-Menü den Punkt "Zelle".


    **3** Wählen Sie die →Registerkarte "Zahlen" aus. Klicken Sie mit der Maus die
    Kategorie "Uhrzeit" an. Als Format wählen Sie Option "26:30:55" aus. Klicken Sie
    anschließend auf "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_13_2.png)'
  merge: -1
  img_proc: true
- pgno: 14
  md: '# Excel


    # Registerkarte


    Bei manchen Menüpunkten erscheint nach der Auswahl ein neues Fenster. Sollten
    hier sehr viel Einstellungen zur Auswahl stehen, sehen Sie am oberen Fensterrand
    kleine Reiter. Dies sind die sogenannten Registerkarten. Sie fassen mehrere, meist
    thematisch zusammengehörige, Optionen zusammen. So haben Sie alle Auswahlmöglichkeiten
    jederzeit übersichtlich im Griff. Mit einem Klick auf einen Reiter wechseln Sie
    zwischen den einzelnen Registerkarten hin und her.


    Damit rechnet Excel über die 24-Stunden-Grenze hinaus und addiert die Uhrzeiten
    zum gewünschten Ergebnis von "32:50:00".


    Wer noch die ältere Version von Excel benutzt, der verwendet das Format "[h]:mm:ss"
    aus dem Auswahlmenü.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_14_0.png)


    # Markierungen mit der Maus


    Die Maus ist eine gute Hilfe, wenn es um schnelle Aktionen geht. So lassen sich
    auch Tabellenbereiche unter Excel mit der Maus wesentlich schneller markieren
    als über die Menü- oder Tastatureingaben. Doch problematisch wird es dann, wenn
    die Tabelle sich über mehr als 35 Zeilen hinausbewegt. Meist beginnt der Bildschirm
    unkontrolliert nach unten zu →scrollen, wenn man die Maustaste gedrückt hält.
    Hier hilft eine etwas andere Maustechnik weiter:


    +   1 Klicken Sie mit der Maus doppelt auf den unteren Rand der obersten Zelle.
    Dann gelangen Sie direkt an den untersten beschriebenen Bereich der Spalte.


    +   2 Wenn Sie beispielsweise die ganze Spalte von A1:A51 markieren wollen, halten
    Sie die Umschalttaste gedrückt und klicken Sie wieder doppelt auf den unteren
    Rand der Zelle.


    +   3 Das funktioniert auch mit Spalten, deren Einträge über den sichtbaren Bereich
    (Buchstabe L) hinausgehen. Auch dafür genügt ein Doppelklick auf den rechten Rand
    der äußersten linken Zelle (A).


    +   4 Sie markieren beispielsweise den Bereich von A1:O1, indem Sie mit gedrückt
    gehaltener →Umschalttaste den rechten Rand der Zelle A1 doppelt anklicken.


    # Umschalttaste


    Als Umschalttaste bezeichnet man die Taste, mit der Sie zwischen Groß- und Kleinschreibung
    umschalten können. Auf einer normalen Tastatur ist diese Taste zwei Mal vorhanden.
    Sie wird mit einem nach oben deutenden Pfeil dargestellt.


    # Einfügen einer Funktion per Shortcut


    Wenn Sie beim Anlegen von Tabellen oft mit Funktionen arbeiten müssen, stört Sie
    sicherlich der lange Weg über das Menü "Einfügen/Funktion". Hier geht es per →Shortcut
    wesentlich schneller:


    Drücken Sie die Tastenkombination "Umschalt" und "F3". Auf diese Weise erscheint
    die Dialog-


    box des Funktionsauswahlfensters "Funktion einfügen" am Bildschirm. Solche Shortcuts
    gibt es natürlich auch für andere Funktionen von Excel.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_14_1.png)


    # Shortcut


    Shortcut wird als Synonym für Schnell taste gebraucht und ist in den meisten Fällen
    ein Tastendruck oder eine Tastenkombination, mit der Befehle ausgeführt werden.


    # Mehrerer Textzeilen in einer Zelle


    Manchmal reicht die Breite einer Zelle für den eingegebenen Text nicht aus. Um
    trotzdem mehrere Textzeilen in einer Zeile anzeigen zu lassen, gehen Sie wie folgt
    vor:


    +   1 Zuerst markieren Sie die zu formatierenden Zellen.


    +   2 Klicken Sie im Menü "Format" auf "Zellen" und wählen hier die Registerkarte
    "Ausrichtung". Oder verwenden Sie das →Kontextmenü.


    +   3 Aktivieren Sie bei den Texteigenschaften das Kontrollkästchen "Zeilenumbruch"
    und bestätigen die Auswahl mit "OK".


    +   4 Um einen Zeilenumbruch an einer bestimmten Stelle zu erreichen, klicken
    Sie mit der Maus in der Bearbeitungsleiste oder in der Zelle auf die Stelle, an
    der ein Zeilenumbruch später eingefügt werden soll. Drücken Sie anschließend die
    Tastenkombination "Alt" und "Eingabe". Der Zeilenumbruch wird durchgeführt und
    Sie sehen sofort das Ergebnis.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_14_2.png)


    # Kontextmenü


    Das Kontextmenü ist ein weiterführendes Auswahlmenü. Sie rufen es immer mit der
    rechten Maustaste auf. Es enthält Befehle zu dem von Ihnen ausgewählten Bereich.
    Mit diesen Befehlen können Sie verschiedene Einstellungen vornehmen oder Befehle
    aufrufen. Die Vorteile des Kontextmenüs sind der schnelle Aufruf und der geringe
    Platzbedarf des Menüs.'
  merge: -1
  img_proc: true
- pgno: 15
  md: '# Excel


    # Immer mit Datum


    Wenn Sie Seitenzahlen oder das aktuelle Datum auf Ihrem Tabellenblatt ausdrucken
    wollen, müssen Sie eine Kopf- oder Fußzeile einfügen. Darin setzen Sie Felder,
    in die automatisch die entsprechende Angabe eingetragen wird.


    Mit dem ersten Symbol bestimmen Sie die Schriftart der Angaben. Die nächsten beiden
    Symbole stehen für die Angabe der Seitenzahl. Ein Klick auf das erste Symbol setzt
    die Seitenzahl ein, das zweite Symbol setzt die Gesamtzahl der Seiten ein. So
    können Sie sich folgende Angabe konstruieren: "Seite 1 von 2". Sowohl "Seite"
    als auch "von" müssen Sie allerdings extra eingeben. Das könnte dann so aussehen:


    1 Wählen Sie im Menü "Datei" den Punkt "Seite einrichten". Hier suchen Sie die
    Registerkarte "Kopfzeile/Fußzeile" aus. Für eine neue →Fußzeile, die genau die
    gewünschten Angaben enthält, klicken Sie auf "Benutzerdefinierte Fußzeile".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_15_0.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_15_1.png)


    # → Fußzeile


    Kopf- und Fußzeilen eignen sich besonders für Angaben, die Sie immer wieder in
    einem Dokument oder einer Tabelle unterbringen müssen. Dazu gehören etwa Seitenzahlen,
    Datum, Uhrzeit oder der Dateiname. Die Position der Kopf- oder Fußzeile wird dabei
    unabhängig von dem eigentlichen Seitenrand eingestellt. Sie sollten natürlich
    darauf achten, daß sie über oder unter dem Textanfang oder -ende stehen, denn
    Kopf- oder Fußzeile und der eigentliche Text können sich überlagern. Eigenschaften
    von Kopf- und Fußzeilen verändern Sie über das Menü "Datei" und den Punkt "Seite
    einrichten".


    2 Sie können Ihre Angaben auf der linken Seite, in der Mitte oder auf der rechten
    Seite einsetzen. Um die Angaben einzufügen, haben Sie folgende Symbole zur Verfügung.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_15_2.png)


    3 Die nächsten beiden Symbole stehen für Datum und Uhrzeit. Das Datum wird in
    der folgenden Form angezeigt: "08.06.98", die Uhrzeit sieht so aus: "14:19". Auch
    hier gilt: Wenn Sie eine spezielle Angabe zwischen Datum und Uhrzeit stehen haben
    wollen, müssen Sie die Zeichen eingeben, egal ob das Buchstaben oder Leerzeichen
    sind.


    4 Mit den letzten beiden Symbolen fügen Sie den Dateinamen und den Namen des Arbeitsblatts
    ein. Auch hier müssen Sie aber noch Trennzeichen oder einen eigenen Text einfügen.
    Auf dem Bildschirm erscheint die Fußzeile nicht, nur in der Seitenumbruch-Vorschau.


    # Tabelle auf eine Seite quetschen


    Sind Sie es leid, ständig die Seitenränder Ihrer Tabelle zu verändern, damit sie
    auf eine einzige Seite paßt? So quetschen Sie Ihre Tabelle mit einem Klick auf
    eine Seite:


    stellen, auf wie vielen Seiten Ihre Tabelle insgesamt ausgedruckt werden soll.
    Sie können wählen, wie viele Seiten breit bzw. hoch die Tabelle werden soll.


    # → Skalieren


    Das ist ein anderes Wort für Vergrößern oder Verkleinern. Wenn Sie einen Text
    oder eine Grafik skalieren, wird er/sie auf eine gewünschte Größe gebracht. In
    Excel können Sie den Inhalt einer Tabelle so skalieren, daß er beim Ausdruck auf
    eine bestimmte Anzahl von Blättern paßt. Eine Skalierung von 100 % bedeutet, daß
    die Ausgangsgröße beibehalten wird.


    1 Wählen Sie aus dem Menü "Datei" den Punkt "Seite einrichten". Hier klicken Sie
    die Registerkarte "Papierformat" an (wenn sie nicht schon aktiv ist).


    2 Im Feld "→Skalierung" klicken Sie den Button vor "Anpassen" an. Hier können
    Sie einstellen, auf wie vielen Seiten Ihre Tabelle insgesamt ausgedruckt werden
    soll. Sie können wählen, wie viele Seiten breit bzw. hoch die Tabelle werden soll.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_15_3.png)


    3 Bestätigen Sie mit "OK". Dann drucken Sie das Dokument; es paßt jetzt auf eine
    Seite. Das Dokument selbst wird dabei nicht verändert (weder in den Seitenrändern
    noch der Schriftart oder -größe). Die Einstellung wird als Standard gespeichert.
    Wenn Sie also das nächste Mal ausdrucken, überlegen Sie sich, ob Sie die Option
    wieder anwenden wollen. Wenn nicht, klicken Sie im Feld "Skalierung" auf "Verkleinern/Vergrößern"
    und wählen "100%". Damit wird die Standardgröße wieder hergestellt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_15_4.png)'
  merge: -1
  img_proc: true
- pgno: 16
  md: '# Makros in Excel


    Was Word kann, kann Excel natürlich auch: →Makros aufzeichnen mit dem Makro-Recorder.
    Umfangreichen Befehlfolgen ordnen Sie so eine Tastenkombination zu.


    1 Starten Sie Excel 95 und wählen aus dem Menü "Extras" "Makro aufzeichnen". In
    Excel 97 wählen Sie "Makro" und dann "Aufzeichnen".


    2 Benennen Sie das Makro im Feld "Makro-name". In Excel 95 klicken Sie auf "Optionen".
    Dann können Sie dem Makro einen eigenen Menübefehl zuordnen. Aktivieren Sie das
    Kästchen vor "Befehl im Menü Extras" und geben Sie einen Namen ein. Der erscheint
    später im Menü "Extras". Klicken Sie auf das Kästchen vor "→Shortcut", klicken
    dann ins Kästchen hinter "Strg+" und geben einen Buchstaben oder eine Tastenkombination
    ein. Im Feld "Speichern in" wählen Sie "Persönliche Makro-Arbeitsmappe" aus. Erst
    dann können Sie das Makro in jeder Arbeitsmappe anwenden.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_16_0.png)


    Nach dem Bestätigen mit "OK" starten Sie die Aufzeichnung des Makros.


    3 Mit dem Aufzeichnungsbeginn wird ein Fenster eingeblendet. Wenn Sie auf die
    Schaltfläche klicken, wird die Aufzeichnung beendet. Beginnen Sie jetzt mit der
    Dateneingabe oder der Formatierung. Dabei ist nur das Ergebnis wichtig, zwischendurch
    können Sie sich also ein paar Fehler bei der Eingabe erlauben.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_16_1.png)


    # Makro


    Ein Makro hilft Ihnen, Abläufe zu beschleunigen. Makros sind im MS Office in der
    Sprache Visual Basic geschrieben. Mit Hilfe des Recorders ist es ganz einfach,
    Makros aufzuzeichnen. Dem Makro wird dann ein bestimmtes Tastenkürzel zugewiesen.
    Drücken Sie das, läuft das aufgezeichnete Programm ab und erledigt die ihm zugewiesenen
    Aufgaben.


    # Shortcut


    Mit einem Shortcut oder Tastenkürzel führen Sie Befehle aus. Das geht oft schneller,
    als erst die Symbole anzuklicken. Auch Makros können per Tastenkombination aufgerufen
    werden.


    4 Geben Sie zum Beispiel eine Monatsliste ein. In Zelle "B1" tippen Sie Januar
    ein. Danach lassen Sie die Zeilen automatisch ausfüllen. Klicken Sie dazu auf
    eine andere Zelle und wieder auf "B1". Bewegen Sie jetzt die Maus zur rechten
    unteren Ecke der Zelle. Der Mauszeiger wird zu einem Kreuz. Drücken Sie die linke
    Maustaste und ziehen Sie eine Markierung in Richtung der Zelle "M1". In einem
    gelben Kästchen werden die Folgemonate angezeigt. Wenn Sie die Maustaste loslassen,
    werden die Monatsnamen eingetragen. Dann markieren Sie die Zeile und wählen eine
    andere Schriftart und -größe. Anschließend klicken Sie auf "Aufzeichnung beenden".


    5 Schließen Sie die Datei und öffnen Sie eine neue. Dann drücken Sie die Tastenkombination,
    die Sie dem Makro zugeordnet haben. Automatisch wird all das eingetragen, was
    Sie vorhin eingegeben und formatiert haben. Makros eignen sich auch für einige
    andere Funktionen, etwa das Formatieren von Diagrammen oder Einfügen von Formeln.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_16_2.png)


    In Excel 97 klicken Sie in das Feld unter "Tastenkombination". Geben Sie einen
    Buchstaben oder eine Tastenkombination ein, durch das das Makro gestartet wird.
    Im Feld "Makro speichern in" wählen Sie wieder "Persönliche Makro-Arbeitsmappe".


    # Kopien eines Ausdrucks


    Brauchen Sie mehrere Kopien eines Ausdrucks und wollen sich den Gang zum Kopierer
    sparen? Dann drucken Sie einfach mehrere Exemplare Ihres Dokuments aus.


    1 Wählen Sie aus dem Menü "Datei" den Punkt "Drucken", klicken Sie aber nicht
    auf das Drucker-Symbol.


    2 Im Feld "Exemplare" stellen Sie ein, wie oft die Tabelle gedruckt werden soll,
    außerdem können Sie die Kopien sortieren. Sie haben aber auch die Möglichkeit,
    alle ersten Seiten usw. hintereinander zu drucken.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_16_3.png)


    # PCgo! TIP Lese-Ecke


    Wenn Sie ein wirklich umfangreiches Computerlexikon auf dem derzeit aktuellen
    Stand brauchen, sollten Sie zu Becks Computerlexikon greifen. Auf über 900 Seiten
    sind hier die wichtigsten Begriffe aus der Welt der Bits und Bytes versammelt.
    Die Artikel zu den einzelnen Stichwörtern sind durchweg umfangreich und meist
    verständlich geschrieben. Trotzdem sollten Sie sich schon etwas mit dem PC auskennen.
    Gerade die neuen Begriffe aus dem Internet wurden stark berücksichtigt. Auch die
    neuesten Techniken, wie DVD oder 3D-Grafikarten, werden eingehend erklärt. Das
    Computerlexikon ist auf jeden Fall ein komplettes und kompetentes Nachschlagewerk
    für all die Begriffe, über die Sie schon immer etwas wissen wollten.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_16_4.png)


    INFO Verlag C.H. Beck ISBN: 3-4223-50302-5 Preis: 49,90 Mark'
