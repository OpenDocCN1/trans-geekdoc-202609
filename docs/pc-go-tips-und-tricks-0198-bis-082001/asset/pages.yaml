- pgno: 52
  md: '# Office-Tips: Excel


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_52_0.png)


    # Makros


    # 122 Wann brauche ich ein Makro?


    Wiederholen Sie oft Bearbeitungsschritte, dann sind Sie mit Sicherheit mit einem
    Makro gut beraten. Sich wiederholende Tastenanschläge oder Mausbewegungen können
    Sie aufzeichnen und dann immer bei Bedarf automatisch ablaufen lassen. Exportieren
    Sie z.B. oft Daten oder formatieren Sie bestimmte Datensätze immer wieder gleich,
    ändern Sie die Druckbereiche oft? All dies können Sie mit einem Makro automatisieren.
    Ein Makro zeichnen Sie mit dem "Makrorekorder" auf. Diesen finden Sie unter "Extras"
    "Makro" und "Aufzeichnen".


    # 123 Ein Makro aufzeichnen


    Haben Sie den Makrorekorder über "Extras", "Makro" und "Aufzeichnen" aktiviert,
    dann dürfen Sie keine Tastatur- oder Mausbewegung mehr machen, die nicht aufgezeichnet
    werden soll.


    1 In unserem ersten Makro wird Ihr Name und Ihre Adresse aufgezeichnet. Klicken
    Sie auf eine Zelle in Ihrem Arbeitsblatt und aktivieren Sie den Makrorekorder
    jetzt wie oben beschrieben.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_52_1.png)


    ben. Vergeben Sie einen passenden Namen für das Makro, z.B. MeineAdresse.


    2 Unter "Beschreibung" können Sie das Makro noch etwas beschreiben, so daß Sie
    auch in zwei Monaten noch wissen, was es ausführt. Wollen Sie das Makro durch
    eine Tastenkombination starten, dann geben Sie diese ein. Bestätigen Sie mit "OK".


    3 Nun erscheint eine neue Symbolleiste auf dem Bildschirm. Geben Sie Ihre Adresse
    in die Tabelle ein. Verwenden Sie für jeden Adreßteil eine neue Zeile. Ziehen
    Sie nun zum Markieren die Maus über die Zeilen, klicken Sie auf die Schaltfläche
    "Fett" und erhöhen die Schriftgröße auf "15". Klicken Sie nun auf die nächste
    leere Zeile unterhalb des Namens- und Adreßteils. Wählen Sie zum Schluß im Makrorekorder
    die Schaltfläche "Aufzeichnung beenden".


    # 124 Makros einfach ausführen


    Nun wollen Sie das aufgenommene Makro starten. Speichern Sie vorher vorsichtshalber
    Ihre gerade geöffnete Datei. Dann positionieren Sie den Cursor in einem leeren
    Bereich auf Ihrem Arbeitsblatt. Wählen Sie "Extras", "Makro" und "Makros". Nun
    wählen Sie einen Namen aus und klicken auf "Start". Excel führt das Makro aus.
    Wollen Sie das Makro nochmals wiederholen, dann drücken Sie die Tasten Strg+Y.


    # 125 Achtung! Relativer Bezug


    Ein kleines Problem kann entstehen, wenn Sie bei der Einstellung Ihres Makros
    die Option "Relativer Bezug" nicht aktiviert haben. Diese Schaltfläche ist im
    Makrorekorder integriert. Drücken Sie "Relativer Bezug" wenn Sie wollen, daß Excel
    Ihre Bewegungen in Bezug auf die aktuelle Position aufnimmt und sich nicht genau
    an diese Zelle klammert, in der der Cursor momentan sitzt. Denn sonst verhält
    sich das Makro und kann nicht starten, wenn der Cursor nicht in genau der richtigen
    Zelle positioniert ist.


    # 126 Makro über die Tastatur aufrufen


    Auch im nachhinein können Sie noch eine Tastenkombination für ein Makro erstellen.
    Öffnen Sie die Arbeitsmappe, die Ihr Makro enthält. Wählen Sie "Extras", "Makro",
    "Makros". Wählen Sie Ihr Makro aus und klicken Sie auf "Optionen". Nun können
    Sie eine Tastaturkombination festlegen. Für Makros wird die Strg-Taste fest vorgegeben.
    Wollen Sie also die Tastenkombination "Strg+Y+C", dann müssen Sie nur noch Y und
    C drücken. Klicken Sie auf "OK" und dann auf "Abbrechen". Im Arbeitsblatt klicken
    Sie auf eine Zelle und betätigen die Tastenkombination. Das Makro startet. Achtung:
    Wenn die Tastenkombination bereits einem Menüpunkt von Excel zugewiesen war, dann
    wird diese Einstellung mit der Verwendung für ein Makro sofort aufgehoben.


    # 127 Makro-Symbolleiste erstellen


    Sie können Makros auch in eine bestehende oder neue Symbolleiste mit einem eigenen
    Symbol aufnehmen. Damit müssen Sie sich keine Tastenkombination merken denn Zeit.
    Wählen Sie "Extras" und "Anpassen". Klicken Sie auf das Register "Befehle". Suchen
    Sie sich den Menüpunkt "Makros" heraus. Markieren Sie diesen und Sie sehen "Schaltfläche
    anpassen" in der Befehlszeile. Ziehen Sie diese Schaltfläche auf eine Symbolleiste.
    Schließen Sie das "Anpassen"-Dialogfeld. Klicken Sie auf die neue Schaltfläche.
    Wählen Sie im "Zuweisen"-Dialogfeld den Namen des Makros und klicken Sie auf "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_52_2.png)'
  merge: -1
  img_proc: true
- pgno: 53
  md: '# Excel-Tips finden Sie auf CD 1 unter Hauptmenü/Workshop/Tips


    # Funktion


    Excel bietet jede Menge vorgefertigter Formeln an, in die Sie nur noch die jeweiligen
    Werte eingeben müssen. Über "Einfügen" und "Funktionen" sehen Sie die Liste aller
    zur Verfügung stehenden Berechnungen. Jeder Schritt kann mit Hilfe des Formel-Assistenten
    genau nachvollzogen werden.


    # TIP Hintergrundgrafik drucken


    Haben Sie in Excel eine Hintergrundgrafik eingestellt, wird diese nicht automatisch
    mit ausgedruckt – so wird beim Drucken ganz schön viel Zeit gespart. Wollen Sie
    die Grafik jedoch unbedingt ausdrucken, klicken Sie auf das Menü "Format" und
    aktivieren unter "Blatt / Hintergrund" die Grafik, die mit der Tabelle ausgegeben
    werden soll.


    # INFO Seitenwechsel anzeigen lassen


    In einer Excel-Tabelle können Sie sich den Seitenwechsel als gepunktete Linie
    anzeigen lassen. Klicken Sie dazu im Menü "Extras" auf "Optionen". Auf der Registerkarte
    "Ansicht" können Sie die entsprechende Funktion aktivieren.


    # INFO Schnell Zellen benennen


    Ein markierter Zellbereich kann ganz schnell benannt werden. Geben Sie einfach
    in der Bearbeitungsleiste im "Namenfeld" eine Bezeichnung ein, und bestätigen
    Sie mit der Enter-Taste.


    # Alles über einen Zellbereich erfahren


    Ab und zu müssen Sie bestimmte Bereiche einer Tabelle genauer untersuchen. Wollen
    Sie zum Beispiel wissen, wieviel Text oder Zahlen in einer umfangreichen Tabelle
    enthalten sind, bietet Excel die passenden →Funktionen.


    belegten Zellen des Bereichs. Schließlich können Sie mit "=ANZAHLLEEREZELLEN-()"
    ermitteln, wie viele leere Zellen im Bereich stehen. Für weitere Auswertungen
    können Sie diese Ausdrücke selbstverständlich kombinieren.


    +   1. Wählen Sie in der Menüleiste "Einfügen" und hier "Funktion". Klicken Sie
    unter dem Eintrag "Kategorie" auf "Alle". In der Liste rechts stehen folgende
    Funktionen zur Verfügung.


    +   2. Mit der Funktion "=ZEILEN()" ermitteln Sie die Anzahl der Zeilen des Bereichs.
    Über "=ANZAHL()" fragen Sie ab, wie viele numerische Werte darin enthalten sind.
    Wenn Sie "=ANZAHL2()" verwenden, erhalten Sie die Anzahl der


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_53_0.png)


    # Excel-Viewer – der praktische Betrachter


    Microsoft liefert auf der Internet-Seite www.microsoft.com/germany unter "Downloads"
    einen Viewer für Excel (CD 9806xlview), den Sie selbst nutzen, aber auch an andere
    Anwender weitergeben können – damit auch diese Ihre Tabellen besser betrachten
    können. Der Viewer bietet folgende Funktionen:


    sortieren. Darüber hinaus stehen Ihnen die Funktionen "Suchen", "Zoom" und "GeheZu"
    zur Verfügung.


    +   1. "Öffnen": Der Viewer zeigt Dateien von Excel für Windows ab Version 2.0
    und von Excel für Macintosh ab Version 2.2a. Sie können Arbeitsmappen und Vorlagen
    ansehen, einschließlich Diagrammen, Notizen und Pivot-Tabellen. Das Ändern der
    Daten ist allerdings nicht möglich.


    +   2. "Sortieren": Mit diesem Befehl können Sie die geöffneten Dateien mit einem
    Auto-Filter sortieren.


    +   3. "Kopieren". Es ist möglich, Daten über die Zwischenablage in eine andere
    Anwendung zu kopieren. Daten aus der Zwischenablage kann man jedoch nicht in die
    Tabellen einfügen.


    +   4. "Drucken". Sie erhalten die Option, ein einzelnes Tabellenblatt oder einen
    ganzen Bereich auszudrucken.


    +   5. "Links". Links zu Zielen auf der Festplatte, im Intranet oder im Internet
    funktionieren im Viewer, wenn der Internet Explorer auf dem System installiert
    ist.


    # Headlines über mehrere Spalten zentrieren


    Excel-Tabellen sehen gleich übersichtlicher aus, wenn die Überschriften mittig
    über den verschiedenen Spalten der Tabelle stehen. Sofort weiß der Betrachter,
    welche Zahlen in der Tabelle aufgeführt sind. Um eine Überschrift über mehrere
    Spalten laufen zu lassen, müssen gleich einige Zellen einer Zeile zusammengefasst
    werden.


    diesem Bereich, und Sie können die Überschrift eintragen. Drücken Sie die [Enter]-Taste,
    wird die Überschrift zentriert.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_53_1.png)


    +   1. Markieren Sie die betreffenden Zellen über der Tabelle, und klicken Sie
    in der Symbolleiste "Format" auf die Schaltfläche "Verbinden und zentrieren".
    Die Gitternetzlinien verschwinden in


    +   2. Die Überschrift kann jetzt nach Belieben formatiert werden. Am einfachsten
    ändern Sie etwa Schriftart und -größe mit der rechten Maustaste über das Kontextmenü.'
  merge: -1
  img_proc: true
- pgno: 54
  md: '# Autotexte in Excel 95/97 verwenden


    In größeren Projekten tauchen bestimmte Bezeichnungen immer wieder auf. Das betrifft
    beispielsweise Firmennamen, die grundsätzlich den Tabellenkopf zieren sollen.
    Sie brauchen diese Zeichenketten jedoch nicht immer wieder neu einzugeben. Es
    gibt eine Methode, dies Excel zu überlassen:


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_54_0.png)


    1 Im Menü "Einfügen" / "Namen" / "Festlegen" tragen Sie unter "Namen in der Arbeitsmappe"
    zunächst ein Kürzel ein, wie Sie es bei Word gewohnt sind. In "Feld bezieht sich
    auf" geben Sie schließlich die gesamte Bezeichnung beziehungsweise den kompletten
    Namen ein.


    2 Achtung! Geben Sie die Zeichen in Anführungsstrichen ein. Es handelt sich nämlich
    um einen Zellbezug. Tippen Sie das Kürzel ein und bestätigen mit Enter, wird der
    Name ergänzt.


    # TIP Zeitwerte in Minuten


    Gerade für Zeitabrechnungen vermißt man bei Excel ein Format, das Minuten darstellen
    kann. So ein Format können Sie leicht selbst definieren: Markieren Sie eine Zelle
    und klicken Sie auf "Format / Zelle". Wählen Sie in dem Dialogfeld die Kategorie
    "Benutzerdefiniert", und geben Sie unter "Formate" die Zeichenkette "[m]" ein.
    Klicken Sie auf "OK", um das Format zuzuweisen. Weisen Sie dieses Format allen
    Zellen zu, in denen die Zeitangabe in Minuten aufgeführt werden soll.


    # Bunte Rahmenlinien über das Kontextmenü


    →Spreadsheets wirken wesentlich klarer und übersichtlicher, wenn Sie zwischen
    verschiedenen Kategorien horizontale und vertikale Linien einfügen. Sollen die
    Linien eine bestimmte Farbe erhalten, erreichen Sie dies am schnellsten über das
    Kontextmenü.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_54_1.png)


    1 Markieren Sie die Zellen, die Sie mit einer Linie abgrenzen wollen. Klicken
    Sie mit der rechten Maustaste in diese Markierung, und wählen Sie im Kontextmenü
    "Zellen formatieren". Klicken Sie ins Register "Rahmen" und suchen Sie sich unter
    "Art" eine Linienstärke aus. Wählen Sie unter dem Eintrag "Farbe" per Mausklick
    ein Farbquadrat aus.


    2 Klicken Sie dann im Vorschaufenster "Rahmen" das entsprechende Symbol für die
    Rahmenlinie an. Bestätigen Sie Ihre Auswahl mit "OK".


    Ihre Tabelle erhält an der gewünschten Stelle eine Rahmenlinie. Problemlos können
    Sie so verschiedene Linienarten und -farben etwa für rechts, links, unten oder
    oben festlegen.


    # Spreadsheet


    Dies ist der englische Begriff für das Tabellenblatt an sich.


    # INFO Eurosymbol in Excel nutzen


    Microsoft liefert unter www.eu.microsoft.com/windows/downloads zwei Patches für
    Windows NT (CD 9806euront) und Windows 95/98 (CD 9806euro95), die das Euro-Symbol
    in den Zeichensatz der Systeme integrieren. Diese Patches richten sich nach einem
    Doppelklick auf die EXE-Datei selbständig an. Öffnen Sie nach dem Neustart die
    Systemsteuerung, und wählen Sie "Ländereinstellungen". Im Register "Währung" fügen
    Sie das Euro-Symbol ein. Unter Excel nutzen Sie das Symbol folgendermaßen: Klicken
    Sie auf "Format / Zellen". Öffnen Sie das Register "Zahlen", und klicken Sie dort
    den Bereich "Währung" an. Das Euro-Zeichen ist dort aufgelistet. Achtung: In der
    Währungsliste erscheint nur ein Kästchen, da die in diesem Dialog verwendete Schrift
    das Symbol nicht unterstützt. Das ändert jedoch nichts an seiner Funktionalität.
    In Excel-Tabellen wird das Euro-Symbol in den Schriftarten Arial, Courier New
    oder Times New Roman korrekt dargestellt.


    # Schaltflächen-Editor: Symbole zeichnen


    In Excel können Sie, wie in anderen Office-Anwendungen, Schaltflächen gestalten:
    Klicken Sie mit der rechten Maustaste auf eine Symbolleiste und im Kontextmenü
    auf "Anpassen".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_54_2.png)


    1 Wählen Sie unter der Registerkarte "Symbolleisten" per Doppelklick die Leiste
    aus, bei der Sie ein Symbol neu gestalten möchten. Klicken Sie dann mit der rechten
    Maustaste auf das entsprechende Symbol. Im Kontextmenü können Sie über "Schaltflächensymbol
    bearbeiten..." ein eigenes Symbol schaffen, oder über "Schaltflächensymbol ändern..."
    ein neues Symbol aussuchen.


    2 Um eine Schaltfläche zu gestalten, klicken Sie im Bild einzelne Quadrate an.
    Sie können dabei ein paar einfache Zeichenwerkzeuge sowie Farben einsetzen.'
  merge: -1
  img_proc: true
- pgno: 55
  md: '# Excel-Tips

    finden Sie auf CD 1 unter

    Hauptmenü/Workshops/Tips


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_55_0.png)


    # TIP Störende Gitter ausblenden


    Für manche Präsentationen reicht es völlig aus, die schlichte Excel-Tabelle über
    einen Beamer oder Overheadprojektor zu zeigen – ohne aufwendige Bearbeitung der
    Einträge mit PowerPoint. Dabei kann aber das Gitternetz von Excel stören. Blenden
    Sie es also einfach aus: Klicken Sie auf "Extras / Optionen" und wählen Sie das
    Register "Ansicht". Dort deaktivieren Sie die Option "Gitternetzlinien". Übrigens
    finden Sie unter dieser Option eine Auswahlliste "Farben". Mit deren Hilfe können
    Sie das Gitternetz auch anders einfärben – was zusammen mit farbigen Linien in
    der Tabelle für weitere Effekte sorgt.


    # INFO Hyperlinks zuweisen


    Sie können auch in Excel über die "Zeichnen"-Symbolleiste Objekte gestalten. Diesen
    kann dann ein Verweis auf eine Internetseite zugeordnet werden. Markieren Sie
    dazu das Objekt. Klicken Sie auf das Hyperlink-Symbol und geben Sie das Verknüpfungsziel
    ein.


    # TIP Kommentare bearbeiten


    Längere Zellkommentare erscheinen häufig abgeschnitten, wenn man die Maus über
    die entsprechende Zelle bewegt. Abhilfe schaffen Sie hier über das Kontextmenü:
    Wählen Sie dort den Befehl "Kommentar bearbeiten" und ändern Sie anschließend
    die Größe des Kommentarkastens. Führen Sie dazu den Mauszeiger auf die Kastenbegrenzung,
    und ziehen Sie den Kasten auf die gewünschte Größe.


    # Ein Excel-Diagramm in Word einfügen


    Zum Verknüpfen eines Diagramms mit Word müssen Sie zunächst das Diagramm-Arbeitsblatt
    in Excel aktivieren. Klicken Sie auf das Diagramm. Ist das Diagramm ausgewählt,
    sehen Sie dessen Haltepunkte.


    1 Wählen Sie im Menü "Bearbeiten" den Eintrag "Kopieren" (Übrigens: Schneller
    geht das Kopieren mit der Tastenkombination "Strg + C"). Wechseln Sie mit "Alt
    + Tab" zu Word, und setzen Sie den Cursor an die Stelle, an der das Diagramm eingesetzt
    werden soll.


    2 Wählen Sie "Bearbeiten / Inhalte einfügen". Aktivieren Sie das Optionsfeld "Verknüpfen".
    Die Quelle ist das "Microsoft Excel Diagramm Objekt". Bestätigen Sie den Vorgang
    mit OK. Ändern Sie nun Daten in der Excel-Tabelle, so werden sie automatisch in
    das verknüpfte Diagramm übernommen; sind also immer auf dem neuesten Stand.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_55_1.png)


    3 Ist das Diagramm nach dem Einfügen zu groß, klicken Sie mit der rechten Maustaste,
    und wählen Sie in dem Kontextmenü den Befehl "Objekt formatieren". Rufen Sie im
    Dialogfeld die Registerkarte "Größe" auf. Ändern Sie im Bereich "Skalieren" die
    Höhe und die Breite beispielsweise auf 40%, und bestätigen Sie mit "OK". Achten
    Sie aber darauf, daß die Beschriftungen dennoch gut lesbar sind. Am besten sieht
    man dies noch immer bei einem Probedruck.


    # Logische oder vergleichende Operatoren


    Außer den Grundrechenarten beherrscht Excel natürlich noch einiges mehr. Ein Beispiel
    dafür sind die sogenannten logischen oder vergleichenden Operatoren. Diese werden
    verwendet, um einen Wert mit einem anderen zu vergleichen. Sie werden logisch
    genannt, da das daraus resultierende Ergebnis entweder wahr oder falsch sein kann.
    Je nach Definition können diese Begriffe umgewandelt werden


    1 Als Operatoren für solche vergleichenden Funktionen dienen folgende Zeichen:
    =, <, >, <=, >=, <>.


    2 Die Formel =Wenn(B8>5000,"Wucher","kaufen") prüft also den Wert in Zelle B8.
    Ist dieser größer als 5000 dann bringt Excel nicht "Falsch" als Meldung, sondern
    in diesem Fall "Wucher". Ist der Wert kleiner, meldet Excel "kaufen".


    # Arbeiten mit Seitenwechseln


    Wenn Sie ein Tabellenblatt drucken möchten, das über eine Seite hinausgeht, unterteilt
    Excel dieses durch Einfügen automatischer Seitenwechsel in mehrere Seiten. Diese
    Seitenwechsel richten sich nach dem angegebenen Papierformat und den Seitenrandeinstellungen.
    Tabellen werden so einfach an einer beliebigen Stelle abgeschnitten. Besser ist
    es, selbst für eine vernünftige Seiteneinteilung zu sorgen.


    1 Um einen Seitenwechsel zu erzwingen, rufen Sie den Befehl "Einfügen / Seitenwechsel"
    auf. Excel fügt dann rechts oder oberhalb der markierten Zelle einen Seitenwechsel
    ein. Erkennbar ist dieser an einer gestrichelten Linie. Einen horizontalen Seitenwechsel
    erhalten Sie, wenn Sie auf die Überschrift der Zelle klicken, oberhalb derer ein
    Seitenwechsel eine neue Seite beginnen soll. Klicken Sie dann im Menü "Einfügen"
    auf "Seitenwechsel".


    2 Einen vertikalen Seitenwechsel erhalten Sie wenn Sie auf die Spaltenüberschrift
    klicken. Links neben dieser Spalte wird ein Seitenwechsel eingefügt, wenn Sie
    im Menü "Einfügen" auf "Seitenwechsel" klicken.


    3 Überprüfen Sie auf jeden Fall über das Menü "Ansicht / Seitenumbruch-Vorschau",
    ob die Seitenwechsel an der richtigen Position sind, bevor Sie Ihre Tabelle drucken.
    Falls nötig, können Sie die Position der Seitenwechsel noch verändern. Ziehen
    Sie dazu einfach die gestrichelte Linie an die entsprechende neue Position.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '# 3D-Diagramme mit farbigen Wänden


    Von Excel erzeugte dreidimensionale Diagramme besitzen zur Eingrenzung graue Wände
    mit Wertelinien.


    Die Farbe der Diagrammwände kann über das Kontextmenü verändert werden.


    +   1. Klicken Sie die Wand mit der rechten Maustaste an und wählen Sie den Befehl
    "Wände formatieren". Im folgenden Dialogfeld klicken Sie auf die Schaltfläche
    "Fülleffekte".

    +   2. Über den Dialog "Fülleffekte" können Sie die Diagrammwände nach Lust und
    Laune gestalten.

    +   So können Sie zum Beispiel über das Registerblatt "Fließend" interessante
    Farbverläufe auf die Diagrammwände bannen. Über die Register "Struktur", "Muster"
    und "Grafik" können Sie noch


    weitere Effekte für die Diagrammwand definieren und so Ihr Diagramm interessanter
    machen. Probieren Sie es doch mal aus!


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_56_0.png)


    # TIP Seitenwechsel entfernen


    Manuell eingefügte Seitenwechsel lassen sich einfach über das Kontextmenü entfernen.
    Wechseln Sie zur Ansicht "Seitenumbruch-Vorschau". Klicken Sie innerhalb des horizontalen
    Seitenwechsels oder rechts neben den vertikalen Seitenwechsel, und wählen Sie
    im Kontextmenü den Eintrag "Seitenwechsel aufheben". Über das Kontextmenü können
    Sie mit dem Befehl "Alle Seitenwechsel zurücksetzen" sämtliche Seitenwechsel auf
    einmal entfernen.


    # Grafiken verschieben


    Wenn Grafiken in Tabellen integriert werden, sind diese Bilder immer an eine bestimmte
    Zelle gebunden. Arbeiten Sie noch an der Tabelle, kann es vorkommen, daß sich
    Zellbezüge ändern. Problem: Die Grafik wird nicht mit verschoben. Dieses Problem
    läßt sich jedoch leicht beheben.


    +   1. Klicken Sie mit der rechten Maustaste auf die Grafik. Wählen Sie im Kontextmenü
    den Befehl "Objekt formatieren".

    +   2. Im Dialog "Grafik formatieren" klicken Sie auf das Register "Eigenschaften".
    Unter dem Eintrag "Objektpositionierung" aktivieren Sie die Option "Nur von Zellposition
    abhängig". Die Grafik wandert dann mit der entsprechenden Zelle mit.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_56_1.png)


    # TIP Mehr Übersicht im Querformat


    Beim Drucken von Tabellen ist es manchmal viel praktischer, das Querformat zu
    wählen. Insbesondere, wenn Sie viele Spalten, aber wenige Zeilen haben. Um das
    Papierformat zu ändern, wählen Sie in der Menüleiste "Datei" -> "Seite einrichten".
    Im Register "Papierformat" klicken Sie das Querformat an. Wollen Sie gleich mehrere
    Seiten im Querformat drucken, klicken Sie mit gedrückter Strg Taste auf die Blattregister.
    Die Arbeitsblätter werden gruppiert. Richten Sie dann, wie oben beschrieben das
    Querformat ein.


    # Arbeitsbereiche speichern


    Arbeiten Sie häufig mit mehreren Excel-Dateien gleichzeitig, ist es umständlich,
    diese Dateien immer nacheinander zu öffnen. Speichern Sie diese Dateien als Arbeitsbereich,
    werden alle gespeicherten Arbeitsmappen geöffnet.


    +   1. Öffnen Sie zunächst alle Dateien, die in einem Arbeitsbereich gespeichert
    werden sollen. Wählen Sie im Menü "Datei" den Befehl "Arbeitsbereich speichern":
    Geben Sie einen passenden Namen für Ihren Bereich ein. Dieser Arbeitsbereich erhält
    die Dateierweiterung ".xlw".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_56_2.png)


    2. Wollen Sie zu einem späteren Zeitpunkt den gesicherten Arbeitsbereich wieder
    öffnen, wählen Sie einfach den Befehl "Datei / Öffnen". Öffnen Sie Ihren Arbeitsbereich
    mit einem Doppelklick. Excel öffnet alle in diesem Bereich gespeicherte Dateien
    und erinnert sich auch an eventuell geteilte Fenster oder Seiteneinteilungen.


    # INFO Schnelle Verwandlung


    Die Umrechnung diverser Maßeinheiten wird über die Funktion "Umwandeln()" zum
    Kinderspiel. So stellen Sie einfach eine Tabelle zusammen, in der die gebräuchlichsten
    Einheiten aufgeführt werden. Die Funktion finden Sie im Menü "Einfügen" unter
    den technischen Funktionen. Wählen Sie sie aus, dann müssen Sie nur noch die Ausgangszahl
    angeben. So können Sie also schnell von Litern in pints oder Gallonen umrechnen.
    Der Funktions-Assistent begleitet Sie dabei. Voraussetzung: Sie installieren die
    technischen Funktionen über den Add-Ins-Manager nach.'
  merge: -1
  img_proc: true
- pgno: 57
  md: '# Excel


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_57_0.png)


    # Excel-Tips

    finden Sie auf CD 1 unter

    Hauptmenü/Workshops/Tips


    # TIP Uhrzeiten addieren


    Für Uhrzeiten verwendet Excel standardmäßig das Format 24:00 Uhr. Das hat zur
    Folge, daß ein Addieren von Zeitangaben nur bis zu einem Wert von 24 korrekt ist.
    Addieren Sie aber mehrere Stunden, etwa bei einer Zeiterfassung, wird immer nur
    der Wert angezeigt, der über die 24 hinausgeht. Abhilfe schafft eine Einstellung
    im Dialog "Formate". Markieren Sie die Zellen, in denen Zeitangaben addiert werden
    sollen. Klicken Sie im Menü "Format" auf den Eintrag "Zellen". Auf der Registerkarte
    "Zahlen" klicken Sie im Bereich "Kategorie" auf den Eintrag "Uhrzeit". Wählen
    Sie in der Liste "Formate" das Uhrzeitformat "26:30:55", und schließen Sie den
    Dialog mit "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_57_1.png)


    Im ausgewählten Zellenbereich werden Uhrzeiten korrekt addiert, selbst wenn deren
    Summe den Wert von 24 übersteigt


    # Farbige Landkarten


    Wer häufiger Landkarten in ein Excel-Arbeitsblatt einfügt, dem ist es sicher aufgefallen,
    daß die Landkarten relativ langweilig aussehen. Bringen Sie doch einfach mit Hilfe
    von PowerPoint etwas Farbe ins Spiel, und gestalten Sie Ihre Landkarten ganz bunt.


    1 Fügen Sie zunächst eine Landkarte in Excel ein. Dies geschieht über das Menü
    "Einfügen". Wählen Sie dort den Befehl "Landkarte" und ziehen Sie mit dem Mauszeiger
    ein Rechteck auf das Tabellenblatt. Die ausgewählte Landkarte wird dort eingefügt.


    2 Klicken Sie an eine beliebige Stelle in der Tabelle, um den Bearbeitungsmodus
    der Landkarte zu deaktivieren. Klicken Sie anschließend einmal auf die Landkarte.
    Der Mauszeiger wandelt sich in ein Kreuz mit Doppel Pfeilen um. Ist die Landkarte
    markiert, betätigen Sie die Tastenkombination "Strg + X". Die Landkarte gelangt
    in die Zwischenablage.


    3 Starten Sie PowerPoint mit einer "Leeren Präsentation". Wählen Sie die "Leere
    Folie" und fügen Sie die Landkarte mittels "Strg + V" ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_57_2.png)


    Klicken Sie mit der rechten Maustaste auf die Karte. Ein Kontextmenü öffnet sich.
    Wählen Sie den Befehl "Gruppierung" und im folgenden Untermenü "Gruppierung aufheben".
    Bestätigen Sie die Sicherheitsabfrage.


    4 Betätigen Sie nochmals "Strg + C", um die aus verschiedenen Einzelteilen bestehende
    Grafik erneut in die Zwischenablage zu kopieren. Wechseln Sie wieder in Excel
    und fügen Sie dort die Grafik wieder mit "Strg + V" ein. Um die Markierung aufzuheben,
    klicken Sie auf einen freien Bereich der Tabelle.


    5 Wollen Sie die einzelnen Teile der Landkarte unterschiedlich einfärben, klicken
    Sie doppelt auf eines der Bundesländer. Im Dialogfeld "AutoForm formatieren" wählen
    Sie im Bereich "Ausfüllen" die gewünschte Farbe aus, indem Sie auf den nach unten
    zeigenden Pfeil klicken. Die Farbpallette wird angezeigt. Per Mausklick stellen
    Sie die entsprechende Farbe ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_57_3.png)


    # Gimmick in Excel


    Wußten Sie, daß in Excel ein Flugsimulator verborgen ist? Wenn Sie mal etwas anderes
    als trübe Zahlenreihen sehen möchten, starten Sie doch einfach dieses kleine Spiel.
    Sie werden den Flugsimulator nicht finden, wenn Sie Excel 97 unter Windows NT
    nutzen. Um zum Flugsimulator zu gelangen, müssen Sie einen Trick anwenden.


    1 Legen Sie eine neue Arbeitsmappe an. Klicken Sie auf F5. Das Dialogfeld "Gehe
    zu" wird geöffnet. Geben Sie im Feld "Bezug" die Zellbezeichnung "X97:L97" ein
    und schließen Sie das Dialogfeld mit "OK".


    2 Der gesamte Zellbereich der Zeile 97 ist markiert. Betätigen Sie die Tabulator-Taste.
    Drücken Sie gleichzeitig die Shift- und die Strg-Taste und klicken Sie in der
    Symbolleiste auf den


    Diagramm-Assistenten. Der Bildschirm wird erst schwarz. Danach erscheint eine
    virtuelle Landschaft, die Sie überfliegen können. Die Steuerung erfolgt mit der
    Maus- und den Pfeiltasten. Mit der linken Maustaste geben Sie Gas, mit der rechten
    bremsen Sie. Die Flughöhe wird mit den Pfeiltasten beeinflußt. Mit etwas Glück
    sehen Sie einen grauen Felsen mit einer dunklen Erhebung. Auf diesem Denkmal haben
    sich die Programmentwickler namentlich verewigt.


    3 Wollen Sie das kleine Spiel verlassen, drücken Sie die Esc-Taste. Sie gelangen
    dann zurück zum Excel-Fenster. Wenn Sie sich nach einer längeren Arbeitsphase
    wieder mal eine Pause mit dem Flugsimulator gönnen möchten, müssen Sie Excel neu
    starten. Der Flugsimulator läuft nämlich nur einmal pro Excel-Start.


    # TIP Blattschutz umgehen


    Sie haben das Kennwort eines Arbeitsblattes vergessen, müssen aber dennoch Änderungen
    in der Tabelle vornehmen. Kopieren Sie einfach das geschützte Blatt in ein neues
    Tabellenblatt. Problematisch wird die ganze Aktion jedoch, wenn die einzelnen
    Formeln geschützt sind, also wenn Sie im Menü "Format / Zellen" über das Register
    "Schutz" die Option "Formel ausblenden" aktiviert hatten. Der Trick kann dann
    nicht angewendet werden.'
