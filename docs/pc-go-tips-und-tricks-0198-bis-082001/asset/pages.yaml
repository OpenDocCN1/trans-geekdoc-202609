- pgno: 46
  md: '# Funktionen einsetzen


    # 80 So geben Sie Formeln ein


    Wollen Sie in Excel etwas berechnen, dann benötigen Sie eine entsprechende Formel.
    Eine Formel beginnt immer mit der Eingabe des "="-Zeichens. Geben Sie also in
    die Zellen A1 bis A4 jeweils eine Zahl ein. Setzen Sie den Cursor nun in Zelle
    A5. Jetzt klicken Sie auf das Summe-Symbol. In die Zelle A5 wird die Summenformel
    eingefügt. Nun drücken Sie noch auf die Return-Taste, um die Formel zu bestätigen.
    Die Werte in den Zellen A1 bis A4 werden addiert.


    # 81 Verschiedene Zahlenformate


    Wollen Sie bereits eingetippte Zahlen formatieren, können Sie auf die Symbolleiste
    zurückgreifen oder das Menü bemühen. Markieren Sie zunächst die Zellen, deren
    Zahlenformat geändert werden soll. Klicken Sie dann auf die entsprechende Schaltfläche
    oder wählen Sie in der Menüleiste "Format" und "Zellen". Dort können Sie unter
    elf vordefinierten Bereichen auswählen.


    # 82 Schrift in einer Tabellenzelle drehen


    Die Möglichkeit, die Schrift zu drehen, ist eine neue Funktion in Excel 97. Markieren
    Sie den Zellbereich, den Sie drehen möchten. Wählen Sie "Format" und hier "Zellen".
    Klicken Sie auf die Registerkarte "Ausrichtung". Nun haben Sie die Wahl: Entweder
    Sie klicken auf das vertikale Anzeige Fenster. Der Text wird dann von oben nach
    unten ausgerichtet. Oder Sie klicken auf das rechte Feld für die Ausrichtung in
    einem Winkel. Klicken Sie in letzterem Fall auf das Wort "Text" und halten Sie
    die Maustaste gedrückt. Nun können Sie das Wort bewegen und so den richtigen Winkel
    einstellen. Eine andere Möglichkeit ist das Textfeld, in das Sie die korrekte
    Gradzahl eingeben können. Bestätigen Sie mit OK und der Text wird gedreht.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_46_0.png)


    # 83 Formatvorlagen richtig verwenden


    Alle Vorgaben zum Formatieren von Zellen werden am besten als Formatvorlagen gespeichert.


    Das empfiehlt sich vor allem bei aufwendigen Formaten.


    1 Um ein eigenes Format zu definieren, markieren Sie zunächst einmal den entsprechenden
    Bereich. Nun wählen Sie "Format" und "Formatvorlage" aus dem Menü.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_46_1.png)


    2 Klicken Sie auf "Ändern". Stellen Sie über die verschiedenen Register die gewünschte
    Formatierung zusammen. Im Feld "Formatvorlage enthält" können Sie die entsprechenden
    Elemente (de-)aktivieren. Geben Sie nun unter "Formatvorlagenname" einen aussagekräftigen
    Namen ein und bestätigen Sie mit "OK".


    3 Haben Sie bereits in einer anderen Arbeitsmappe die Formatvorlage definiert,
    dann klicken Sie auf die Schaltfläche "Zusammenführen". Wählen Sie nun die Arbeitsmappe,
    aus der Sie die Vorlage verwenden möchten. Wählen Sie die Formatvorlage an und
    klicken Sie auch hier auf "Zusammenführen".


    # 84 Formeln mit Hilfe der Maus eingeben


    Formeln können Sie manuell eingeben, indem Sie in die Bearbeitungsleiste die Zelladressen
    und die Operatoren eintippen. Für den Auszahlungsbetrag für Arbeit nach Stundenlohn
    wäre dies z.B. "=B2(Lohn)*B5(Stundenzahl). Statt die Zelladressen einzutippen
    können Sie auch zuerst nur das =-Zeichen eintippen. Danach greifen Sie zur Maus
    und klicken die Zellen an, deren Werte Sie für die Formel benötigen. In unserem
    Fall also die Zellen B2 und B5. Dazwischen setzen Sie dann noch den Multiplikator.


    # 85 Formeln in andere Zellen kopieren


    Haben Sie eine Formel erstellt und benötigen Sie dieselbe Formel an anderer Stelle
    wieder, können Sie diese einfach kopieren. Denn das praktische an Excel ist, daß
    Formelbezüge einfach angepaßt werden.


    1 Haben Sie nun also in den Zellen D2 und D5 die Daten für Herrn Müller stehen,
    so können Sie die oben erstellte Formel einfach kopieren. Markieren Sie dann die
    Zelle D6 und klicken Sie auf die Einfügen-Schaltfläche.


    2 Es geht aber auch noch ein bißchen anders. Dieser Trick bietet sich an, wenn
    Sie von vornherein wissen, wo Sie ein und dieselbe Formel verwenden können. Klicken
    Sie auf die Zelle B6 und markieren Sie alle Zellen bis D6. Nun erstellen Sie die
    Formel für den Stundenlohn in Spalte B. Halten Sie dann die Strg-Taste gedrückt
    während Sie mit Return die Formel abschließen. Die Formel wird nun in alle vorher
    markierten Zellen übernommen.


    # 86 Von Formeln und Werten einer Tabelle


    In den Zellen steht normalerweise immer nur der Wert einer Formel. Die Formel
    selbst finden Sie nur in der Bearbeitungsleiste. Doch beim Kopieren einer Zelle
    möchten Sie vielleicht nicht immer die Formel, sondern wirklich nur den Wert kopieren.
    Wählen Sie die entsprechende Zelle aus. Klicken Sie auf das Kopieren-Symbol. Klicken
    Sie nun an die Stelle, an der die Kopie eingefügt werden soll. Wählen Sie in der
    Menüleiste "Bearbeiten". Und hier "Inhalte einfügen". Klicken Sie hier auf den
    Eintrag "Werte". Bestätigen Sie den Vorgang mit "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_46_2.png)


    # 87 Absolute oder relative Zellbezüge


    Normalerweise haben die Zellbezüge in einer Formel alle einen relativen Wert.
    Sprich beim Kopieren ändern sich auch die Zellbezüge entsprechend. Nun benötigen
    Sie aber vielleicht auch einmal wirklich die ursprünglichen Zellbezüge. Dafür
    müssen dann die Zellreferenzen dauerhaft festgelegt werden. Um das zu erreichen,
    setzen Sie einfach vor den dauerhaften Bezug noch das Dollarzeichen. Beispiel:
    Sie haben die Formel D2*D8. Nun wollen Sie, daß auch beim Verschieben die achte
    Zeile beibehalten wird. Sie schreiben also statt der Formel oben: D2*$D$8.


    # 88 Fehlermeldungen bei Formeln


    #Div/0: Eine Division durch Null wurde versucht

    #N/A: Ein Wert ist für die Formel nicht verfügbar'
  merge: -1
  img_proc: true
- pgno: 47
  md: '#Name?: Es wird ein Name verwendet, den Excel nicht kennt

    #Null: Eine Schnittmenge zweier Bereiche, die sich gar nicht überschneiden.

    #Num: Falsche Zahl in der Formel

    #ref: Falsche Zelle in der Formel

    #value: Falsches Argument oder Operator wird verwendet


    # 89 Was sind Funktionen?


    Funktionen sind bereits vorgefertigte Formeln. Damit kann in relativ kurzer Zeit
    ein oft komplexer Rechenschritt durchgeführt werden. Die einfachste Funktion ist
    die Summe-Funktion. Excel verfügt allerdings über mehr als 250 Funktionen. Wählen
    Sie in der Menüleiste Einfügen und Funktion. Nun suchen Sie sich hier die geeignete
    Funktion aus. Sobald Sie diese doppelklicken, wird sie in die Zelle eingefügt.
    Es erscheint dann auch gleich ein Assistent, der die Formel und die von Ihnen
    einzugebenden Werte erläutert.


    # 90 Namen in einer Tabelle vergeben


    Gerade bei komplizierten Funktionen ist die Vergabe von Namen wertvoll. Denn statt
    lediglich eine Zellreferenz zu lesen, wissen Sie mit einem Namen meist mehr anzufangen.
    Statt C2 heißt die Zelle dann zum Beispiel Monate. Sie können einen Namen vergeben,
    indem Sie die zu benennende Zelle markieren. Wählen Sie dann Einfügen, Namen und
    Festlegen. Klicken Sie auf Hinzufügen und vergeben Sie einen aussagekräftigen
    Namen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_47_0.png)


    Bestätigen Sie das Ganze mit OK. Nun können Sie diese Namen in jeder Formel des
    Tabellenblattes verwenden.


    # 91 Arbeiten mit Formeln: Die Rentenberechnung


    Anhand ausgewählter Funktionen soll die Arbeitsweise mit Excel-Formeln veranschaulicht
    werden. Nehmen Sie an, Sie nehmen einen Kredit auf und wollen jetzt ausrechnen,
    wie hoch der monatliche Beitrag sein wird, den Sie leisten müssen. Sie brauchen
    mit Excel praktisch nicht mehr rechnen.


    1 Sie wählen Einfügen und hier Funktion. Unter Kategorie klicken Sie auf Finanzmathematik
    und im rechten Kasten dann auf die RMZ-Funktion.


    2 Nun öffnet sich eine Eingabemaske. Sobald Sie den Cursor in ein Textfeld setzen,
    wird unten erläutert, was genau Sie hier eingeben müssen. Bei der RMZ-Funktion
    also zunächst einmal der Zinssatz des Darlehens. Danach müssen Sie angeben, wie
    viele Zahlungen Sie leisten müssen. Und schließlich benötigt Excel noch die Darlehenssumme.
    Die beiden letzten Textfelder sind optional. Nur die fett hervorgehobenen Felder
    sind unbedingt auszufüllen.


    # Mit Diagrammen arbeiten


    # 92 Diagramm anlegen auf einfache Weise


    Zur Veranschaulichung der Daten ist ein Diagramm oft eine sinnvolle Ergänzung.
    Wollen Sie ein Diagramm einfügen, dann markieren Sie zunächst den Zellbereich,
    der veranschaulicht werden soll. Nun klicken Sie in der Symbolleiste auf den Diagramm-Assistenten.
    Wählen Sie den Typ des Diagrammes. Im Verlauf des Diagramm-Assistenten können
    Sie dann noch die Formatierung beeinflussen. Auch Titel, Achsbeschriftung oder
    Hilfslinien lassen sich hier festlegen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_47_1.png)


    # 93 Kreisdiagramm mit herausgezogenem Element


    Statt des üblichen runden Kreisdiagramms können Sie auch einmal eine Scheibe vom
    Kuchen herausschneiden. Dazu erstellen Sie zunächst einmal ein Kreisdiagramm mit
    Hilfe des Diagramm-Assistenten. Wählen Sie als Untertyp noch das 3D-Kreisdiagramm.
    Nun klicken Sie auf den Kreis. Ist dieser markiert, dann klicken Sie auf das Tortenstück,
    das Sie hervorheben möchten. Halten Sie die linke Maustaste gedrückt und ziehen
    Sie das Stück soweit heraus, wie es Ihnen gefällt. Das Ganze funktioniert auch
    mit mehreren Stücken.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_47_2.png)


    # 94 ClipArts in Diagramme einfügen


    Erstellen Sie zunächst mit Hilfe des Diagramm-Assistenten eine Standard-Säulengrafik.
    Klicken Sie auf einen Balken im Diagramm. Wählen Sie in der Menüleiste Einfügen
    und Grafik Aus Datei. Suchen Sie sich ein passendes Bild für Ihr Diagramm. Klicken
    Sie auf Einfügen.


    # 95 Landkarten in einer Tabelle verwenden


    Als besondere Diagrammform gibt es die Landkarten, die sich vor allem für statistische
    Auswertungen oder die Visualisierung von Umsatzahlen anbieten.


    1 Geben Sie zunächst die Daten in die Excel-Tabelle ein. In einer Spalte sollten
    die Länderkennungen stehen, in einer anderen z.B die Umsatzzahlen. Markieren Sie
    dann den Datenbereich.


    2 Klicken Sie auf die Schaltfläche Landkarte in der Symbolleiste. Der Mauszeiger
    wird zum Kreuz. Ziehen Sie damit nun ein Rechteck auf, in dem die Landkarte erscheinen
    wird. Wählen Sie nun im Dialogfenster eine Karte aus. Die Karte erscheint mit
    einem Dialogfenster, in dem Sie noch zusätzliche Einstellungen vornehmen können.
    Eventuell müssen Sie diese Funktion noch nachträglich von Ihrer Office-CD installieren.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_47_3.png)


    # 96 In Diagrammen zeichnen


    Haben Sie das Diagramm angelegt, dann können Sie bestimmte Daten noch hervorheben.
    Dazu benötigen Sie die Zeichnen-Symbolleiste. Diese aktivieren Sie über Ansicht
    und Symbolleisten. Vor Zeichnen sollte ein Haken er-'
