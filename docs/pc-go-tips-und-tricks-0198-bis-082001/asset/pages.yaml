- pgno: 58
  md: '# TIP Landkarte mit Hyperlinks


    Daß Landkarten bunt eingefärbt werden können, haben wir im Tip auf der vorigen
    Seite erläutert. Auf Landkarten kann man außerdem Hyperlinks einrichten. So können
    Sie zum Beispiel von der grafischen Darstellung direkt zu den Datenblättern wechseln.
    Fügen Sie eine Landkarte ein. Schneiden Sie diese aus und öffnen Sie PowerPoint.
    Auf einer leeren Folie wird die Landkarte eingefügt. Heben Sie die Gruppierung
    auf (siehe Landkarten-Tip unter Punkt 3), schneiden Sie die Landkarte erneut aus.
    Wechseln Sie zu Ihrem Excel-Arbeitsblatt und fügen Sie die Landkarte wieder ein.
    Über den Befehl "Ansicht / Symbolleisten" lassen Sie sich die Zeichnensymbolleiste
    einblenden. Klicken Sie auf das Symbol zum Einfügen eines Textfeldes. Zeigen Sie
    nacheinander auf die verschiedenen Bundesländer, und fügen Sie für jedes Bundesland
    ein Textfeld mit dem entsprechenden Namen ein. Klicken Sie auf die Textfeldbegrenzung,
    so daß der Cursor für die Texteingabe verschwindet. Um einen Hyperlink einzurichten,
    klicken Sie im Menü "Einfügen" auf den Eintrag "Hyperlink". Im folgenden Dialogfeld
    legen Sie fest, auf welches Tabellenblatt oder auf welche Datei hier verwiesen
    werden soll. Sobald Sie Ihre Angaben mit "OK" bestätigt haben, ist der Hyperlink
    aktiv, und Sie können rasch zu den entsprechenden Datenblättern wechseln.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_58_0.png)


    # Hyperlink


    Ein Hyperlink ist ein Querverweis auf eine andere Datei oder Textstelle. Klickt
    man mit der Maus auf einen dieser Hyperlinks, wird man automatisch zu der damit
    verbundenen Stelle geleitet. Eine besonders große Rolle spielen Hyperlinks im
    Internet. Dort gelangt man über Hyperlinks zu anderen Web-Sites.


    # Zellinhalte löschen


    Führen Sie den Mauszeiger an die rechte untere Ecke einer aktiven Zelle, erscheint
    ein kleines schwarzes Quadrat (das sogenannte Ausfüllkästchen). Damit lassen sich
    Funktionen wie Auffüllen oder Kopieren aktivieren. Eine weitere Aktion kann mit
    diesem Werkzeug eingeleitet werden: das Löschen von Zellinhalten.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_58_1.png)


    1 Markieren Sie den Bereich, den Sie löschen möchten. Das können einzelne oder
    mehrere Zellen sein. Bewegen Sie den Mauszeiger auf die linke untere Ecke des
    markierten Bereichs, bis das schwarze Kreuz erscheint.


    2 Drücken Sie die linke Maustaste und führen Sie den Mauszeiger zurück in die
    linke obere Ecke der Markierung. Der gesamte Bereichscheint nun grau hinterlegt.
    Sobald Sie die Maus-


    taste loslassen, werden die Inhalte in diesem Bereich gelöscht


    3 Dieser Vorgang entspricht der Verwendung des Befehls "Löschen / Inhalte" im
    Menü Bearbeiten. Wichtig: Nur die Inhalte, nicht aber die Formatierung der Zelle
    werden gelöscht. Um auch die Formatierung zu löschen, halten Sie beim Ziehen mit
    der Maus zusätzlich die Strg-Taste gedrückt.


    # Hyperlinks in großen Tabellen


    Bei umfangreichen Tabellen, die vielleicht sogar mehrere Arbeitsmappen umfassen,
    ist es umständlich, von einem Bereich in einen anderen zu wechseln. Sie können
    aber sogenannte →Hyperlinks einfügen. Diese können auf bestimmte Stellen in der
    Tabelle, auf andere Tabellenblätter oder sogar auf andere Dateien verweisen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_58_2.png)


    1 Um Verweise auf bestimmte Tabellenbereiche zu integrieren, müssen alle Bereiche,
    auf die verwiesen werden soll, benannt werden. Markieren Sie dazu einen Zellbereich.
    Klicken Sie in das Namenfeld (links neben dem Eingabefeld), und überschreiben
    Sie die Zellangabe (etwa "A1") mit einem aussagekräftigen Namen (zum Beispiel
    "Ausgaben_Oktober").


    2 Fügen Sie am Anfang der Tabelle einige Zeilen ein. Diese Zeilen werden für die
    Hyperlinks benötigt. In die Zelle A1 geben Sie einen der gerade festgelegten Bereichsnamen
    ein, etwa "Ausgaben_Oktober". Während die Zelle A1 noch markiert ist, wählen Sie
    im Menü "Einfügen" den Befehl "Hyperlink".


    3 Im Dialogfeld "Hyperlink einfügen" klicken Sie im Bereich "Name einer Stelle
    in der Datei (Optional)" auf die Schaltfläche "Durchsuchen". Aktivieren Sie im
    folgenden Dialog die Option "Festgelegter Name". Suchen Sie das gewünschte Ziel
    per Doppelklick aus. Der Bereichsname erscheint im entsprechenden Textfeld. Schließen
    Sie den Dialog mit "OK".


    4 Der Hyperlink in der Zelle A1 ist jetzt aktiv. Sie erkennen dies daran, daß
    er unterstrichen und blau dargestellt wird. Klicken Sie auf diesen Hyperlink,
    gelangen Sie automatisch zu dem definierten Zellbereich. Auf ähnliche Weise können
    Sie auch Hyperlinks zu anderen Dateien anlegen. Sie müssen dann im Dialogfeld
    "Hyperlink einfügen" im oberen Bereich neben dem Feld "Verknüpfung zu Datei oder
    URL" auf die Schaltfläche "Durchsuchen" klicken, um den Dateipfad anzugeben. Wollen
    Sie einen Hyperlink zu einer anderen Tabelle der Arbeitsmappe anlegen, wählen
    Sie "Durchsuchen" im unteren Bereich und klicken im nachfolgenden Dialog auf die
    Option "Blattname".'
  merge: -1
  img_proc: true
- pgno: 59
  md: '# Excel TIPS


    # Automatisches Füllen vordefinierter Zellen


    Oftmals besteht das Problem, voneinander getrennte Zellen mit identischem Inhalt
    zu füllen. Um eine zeitraubende Eingabe in jede einzelne dieser Zellen zu vermeiden,
    bietet sich eine besondere Art des automatischen Ausfüllens von vorher markierten
    Zellen an.


    fen während dieses Vorganges also nicht auf eine andere Zelle klicken! Damit Sie
    nicht versehentlich die Markierung aufheben, geben Sie den gewünschten Wert oder
    Begriff direkt in die Zelle ein, in der sich der Cursor gerade befindet! Nach
    Eingabe des gewünschten Wertes oder Begriffs drücken Sie die "Strg"-Taste und
    die Eingabetaste gleichzeitig. Schon befindet sich Ihr Wunschwert in allen markierten
    Zellen.


    # TIP Bewegen in Markierungen


    Ein besonderes Augenmerk sollten Sie auf das Bewegen in markierten Feldern legen.
    Sobald Sie beispielsweise Felder markiert haben und unbeabsichtigt einen Mausklick
    im Arbeitsblatt durchführen, geht die Markierung unwiderruflich verloren. Damit
    Sie sich dennoch ohne Probleme in den markierten Feldern bewegen können, klicken
    Sie zum Vorwärts wegen jeweils auf die Tabulatortaste. Bei jedem Klick auf die
    Tabulatortaste bewegt sich der Cursor zum nächsten markierten Feld. Sie wollen
    sich innerhalb der Markierungen rückwärts bewegen? Auch das ist kein Problem.
    Rückwärts gelangen Sie durch gleichzeitiges Drücken der "Shift"-Taste und der
    Tabulatortaste.


    1 Markieren Sie zunächst die Zellen, die mit dem gewünschten Wert gefüllt werden
    sollen. Doch wie erreichen Sie die Markierung auseinander liegender Zellen? Markieren
    Sie zunächst die erste Zelle Ihrer Markierungsreihe. Alle weiteren Zellen markieren
    Sie durch gleichzeitiges Drücken der "Strg"-Taste und Klicken auf die gewünschten
    Zellen. Die "Strg"-Taste muß entweder während des gesamten Markiervorganges für
    alle Zellen gedrückt bleiben oder vor jeder Markierung wieder gedrückt werden.
    Seien Sie bei der Markierung vorsichtig, denn ein unbeabsichtigtes Klicken ohne
    gleichzeitig gedrückte "Strg"-Taste macht Ihre bisherige Markierung zunichte!
    Sie müssen dann von vorne mit der Markierung beginnen. Durch erneutes Anklicken
    einer Zelle bei gedrückter "Strg"-Taste können Sie die Markierung selektiv löschen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_59_0.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_59_1.png)


    3 Sie können die markierten Zellen auch in einem Durchgang formatieren, die Formatierung
    wirkt sich auf alle markierten Zellen auf einmal aus. Die Abbildung wurde zum
    Beispiel folgendermaßen formatiert: Schriftart Arial, Schriftgrad 11, Fett, Kursiv,
    Hintergrundfarbe Gelb, Schriftfarbe Rot, Ausrichtung 45 Grad. Sie können analog
    natürlich auch jede andere Ausrichtung und Formatierung wählen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_59_2.png)


    2 Geben Sie jetzt den gewünschten Wert in eine dieser Markierungen ein. Die Gesamtmarkierung
    muß dabei bestehen bleiben; Sie dür


    # Pivot- Tabellen in Excel 2000


    Durch das Umgehen der Layoutfestlegung für Pivot-Tabellen sparen Sie viel Zeit.
    Ab der Excel-Version 2000 können Sie die Pivot-Tabellenstruktur direkt im Tabellenblatt
    festlegen.


    1 Ziehen Sie die Feldnamen aus der Pivot-Tabellen-Symbolleiste in die umrahmten
    Bereiche der Tabellenstruktur. Es müssen auf jeden Fall Felder für die Spalten-
    und Zeilenbezeichnungen sowie für Daten festgelegt werden. Überlegen Sie genau,
    welche Felder Sie an welche Stelle in der Struktur legen, sonst erhalten Sie nicht
    das gewünschte Ergebnis.


    2 Wenn Sie sich beim Ziehen der Felder vertan haben, können Sie jederzeit durch
    Verschieben der Felder Ihren Pivot-Bericht korrigieren.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_59_3.png)


    Sollten Sie sich jedoch soweit vertan haben, daß Sie die Struktur nicht mehr umarbeiten
    können, hilft ein Klick auf das "Rückgängig"-Symbol weiter. Sie können die Felder
    dann erneut an die gewünschten Stellen ziehen.


    # TIP Euro-Zeichen installieren


    Wenn Sie das Euro-Zeichen schon installiert haben, müssen Sie bei der benutzerdefinierten
    Formatierung nicht "EURO" eintippen, so denn können statt dessen direkt das Euro-Zeichen
    eingeben. Sollte es das Euro-Zeichen auf Ihrer Tastatur nicht geben, erreichen
    Sie es durch gleichzeitiges drücken von "Alt-Gr" und dem Buchstaben "E".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_59_4.png)'
