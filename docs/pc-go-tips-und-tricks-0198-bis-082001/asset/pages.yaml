- pgno: 17
  md: '# Kalkulieren mit Szenarios


    Was wäre, wenn ...? Wenn Sie gerade an einer Kalkulation sitzen und verschiedene
    Möglichkeiten durchspielen, hilft Ihnen der Szenario-Manager. Damit können Sie
    eine einfache Was-wäre-wenn-Kalkulation durchführen, indem Sie immer neue Werte
    eingeben und damit verschiedene →Szenarien durchspielen.


    1 Öffnen Sie unsere Beispieldatei "Kalkulation.xls" aus dem Verzeichnis "Excel"
    auf unserer PCgo!-CD oder geben Sie folgende Werte ein. Beachten Sie dabei, daß
    folgende vier Zellen Formeln enthalten. Geben Sie in die Zellen alles nach dem
    Doppelpunkt ein.

    D4:=D2-D3   D6:=D4*D5   E6:=D6*52

    E14=Summe)(E8:E13   E15=E6-E14


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_17_0.png)


    2 Am besten geben Sie jetzt noch allen Zellen einen Namen. Das verbessert später
    die Übersichtlichkeit bei der Eingabe neuer Daten. Die Daten, die später verändert
    werden sollen, stehen in den Zellen D2, D3, D5 sowie E8 bis E13. Klicken Sie einen
    Wert an (etwa den in der Zelle D2). Klicken Sie dann auf das Namensfeld neben
    der Formelleiste, geben Sie einen eingängigen Namen ein und drücken dann die Eingabetaste.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_17_1.png)


    3 Wählen Sie aus dem Menü "Extras" den Punkt "Szenario-Manager". Klicken Sie hier
    auf die Schaltfläche "Hinzufügen".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_17_2.png)


    4 Geben Sie jetzt einen Namen für das Szenario ein. Dann klicken Sie in das Feld
    "Veränderbare Zellen". Bewegen Sie den Mauszeiger auf Ihre Tabelle und markieren
    Sie die Zellen D2, D3, D5 sowie E8 bis E13. Mehrere Zellen markieren Sie, indem
    Sie die "Strg"-Taste beim Markieren drücken. Automatisch werden die Zellen in
    das Fenster eingetragen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_17_3.png)


    5 Klicken Sie auf "OK". Sie sehen eine Eingabemaske für die veränderbaren Zellen
    mit den in der Tabelle eingetragenen Werten.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_17_4.png)


    6 Jetzt geben Sie neue Werte für die Variablen ein. Klicken Sie nach den Änderungen
    auf "OK" und dann auf "Anzeigen". In der Tabelle sehen Sie die geänderten Werte
    und Berechnungen. Klicken Sie auf "Schließen" und die Änderungen werden übernommen.
    Wenn Sie sie rückgängig machen wollen, tun Sie das mit einem Klicke auf das "→Undo"-Symbol.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_17_5.png)


    7 Wenn Sie später noch einmal neue Werte eingeben wollen, starten Sie wie vorhin
    den Szenario-Manager, wählen das Szenario aus, klicken dann aber auf "Bearbeiten".


    8 Um die Änderungen besser zu überblicken, können Sie automatisch einen →Bericht
    anfertigen lassen. Tragen Sie dazu neue Werte ein, wählen dann aber nicht "Anzeigen",
    sondern klicken auf "Bericht". Bestätigen Sie die Frage nach der Ergebniszeile.
    Dann sehen Sie den fertigen Bericht vor sich. Er wird als neues Arbeitsblatt in
    der Arbeitsmappe eingefügt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_17_6.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_17_7.png)


    # Datei auf CD


    Auf unserer PCgo!-CD finden Sie eine Beispieldatei zu unserem Tip "Kalkulieren
    mit Szenarios". Im Verzeichnis "Excel" befindet sich die Datei "Kalkulation.xls".
    Darin sind schon alle Beispieldaten eingetragen. Sie müssen dann nur noch den
    Schritten unseres Tips folgen.


    # → Szenarien


    Mit Szenarien können Sie eine Was-wäre-wenn-Situation nachspielen. Mit Hilfe des
    Szenario-Managers bestimmen Sie einige Werte, die Sie später verändern können.
    Wenn Sie dann diese Werte innerhalb einer Kalkulation verändern, sehen Sie, wie
    neue Ergebnisse entstehen. Das ist sehr viel komfortabler, als die Werte direkt
    in der Tabelle zu ändern. Außerdem können Sie mit dem Szenario-Manager Berichte
    verfassen und die geänderten Werte gegenüberstellen – und somit besser vergleichen.


    # → Undo


    In Word und Excel gibt es eine Undo-Liste, mit der Sie die zuletzt gemachten Befehle
    rückgängig machen oder wiederherstellen können. Das selbe ist über das Menü "Bearbeiten",
    "Rückgängig" möglich.


    # → Bericht


    Berichte basieren auf den Daten einer Tabelle. Durch einen Bericht werden diese
    Daten gegliedert und übersichtlicher dargestellt. Ein Bericht besteht dabei aus
    verschiedenen Ebenen, die Sie sich anzeigen lassen können. Damit sehen Sie nur
    die Daten, die Sie interessieren.'
  merge: -1
  img_proc: true
- pgno: 18
  md: '# Paßwortschutz


    Mit einem Paßwortschutz sichern Sie wichtige, persönliche Daten vor fremdem Zugriff.
    Dies geschieht meist über ein bestimmtes Kennwort. Es gibt zwei Arten von Paßwörtern:
    das statische Paßwort, bei dem der Anwender ein Paßwort einmal vergibt. Dies ist
    so lange gültig, bis es vom Anwender wieder geändert wird. Die andere Form ist
    das dynamische Paßwort. Dabei wird der Anwender in einem festgelegten Intervall
    aufgefordert, sein Paßwort zu ändern.


    # Zelle


    Die Zelle ist die kleinste Einheit in einer Tabelle. Darin werden alle Daten eingetragen,
    wie Texte, Zahlen oder Formeln. Jede einzelne Zelle wird durch die genaue Position
    in Zeile und Spalte festgelegt. Spalten erkennt man an den durchlaufenden Buchstaben,
    die Zellen an den fortlaufenden Zahlen, beginnend mit der 1.


    # PCgo! TIP Lese-Ecke


    Suchen Sie ein Buch, das Sie auf dem Weg vom Excel-Einsteiger bis zum Profi begleitet?
    Dann werfen Sie einen Blick auf Excel 97 – Das Handbuch. Auf fast 1.000 Seiten
    finden Sie hier alles, von den Grundlagen der Tabellenlängstaltung bis zur fortgeschrittenen
    Makro-Programmierung mit VBA. Dabei arbeiten Sie immer mit Praxisbeispielen. Sie
    lernen, wie Sie Formeln eingeben, Daten formatieren, sortieren, filtern und vieles
    mehr. Auf der beiliegenden CD finden Sie die Beispieldateien des Buches sowie
    Tools und Add-Ins für Excel 97.


    INFO Microsoft Press, ISBN-Nr. 3-86063-128-4 Preis: 55 Mark


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_18_0.png)


    # Dokumente mit Paßwortschutz


    Sie benutzen mit mehreren Personen einen Rechner? Dann sollten Sie Dateien, die
    nur Sie selbst betreffen, mit einem →Paßwortschutz versehen. Damit sind sie vor
    anderen Augen geschützt. Und so geht''s:


    Im neuen Dialog "Speichern Optionen" tragen Sie unter "Lese/Schreib-kennwort"
    Ihr Paßwort ein. Klicken Sie auf "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_18_1.png)


    +   1. Speichern Sie Ihr Arbeitsblatt. Wählen Sie dafür im Menü "Datei" den Eintrag
    "Speichern unter".

    +   2. Geben Sie nun in der sich öffnenden Dialogbox – wie gewohnt – den Namen
    und den Pfad ein, unter dem Sie die Datei speichern möchten.

    +   3. Klicken Sie anschließend auf die Schaltfläche "Optionen".

    +   4. Sie werden aufgefordert, das Paßwort durch erneute Eingabe zu bestätigen.
    Danach klicken Sie nochmals auf "OK".

    +   5. Zum Abschluß speichern Sie Ihr Dokument mit einem Mausklick auf "OK". Wollen
    Sie nun die Datei öffnen, werden Sie zunächst aufgefordert, Ihr Paßwort einzugeben.
    Doch Vorsicht! Verlieren oder vergessen Sie dieses Paßwort, können auch Sie diese
    Datei nicht mehr einsehen.


    # Spaltenüberschriften auf jeder Seite


    Die meisten Tabellen erstrecken sich über mehrere Seiten: Um nicht auf jedem Arbeitsblatt
    die Überschriften erneut eintragen zu müssen, können Sie einen Bereich für die
    Spalten- und Zeilenüberschriften festlegen. So erleichtern Sie sich die Arbeit
    erheblich.


    +   1. Sie wählen zunächst im Menü "Datei" den Eintrag "Seite einrichten".

    +   2. In der Registerkarte "Tabelle" setzen Sie den Cursor in das Feld "Wiederholungzeilen".

    +   3. Markieren Sie alle Überschriften. Diese Einstellung gilt nur für den Ausdruck
    und die Seitenansicht. Die Tabellenansicht bleibt bestehen. Das klappt auch bei
    Spaltenüberschriften: Lediglich bei Schritt 2 positionieren Sie die Schreibmarke
    im Feld "Wiederholungsspalten".


    # Zellinhalte tarnen


    In umfangreichen Tabellen gibt es vielleicht Daten, die Sie anderen nicht zugänglich
    oder sichtbar machen möchten, beispielsweise bei der Arbeit mit Gehaltstabellen
    oder ähnlichem (Datenschutz). Wenn Sie die Zellenhöhe oder Spaltenbreite verringern,
    können Sie diese Zellen quasi unsichtbar machen. Diese Methode ist aber nicht
    immer die beste. Hier hilft ein kleiner Trick mit Zahlenformaten weiter. Damit
    lassen sich Zellinhalte einfach und komfortabel verbergen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_18_2.png)


    +   1. Rufen Sie zuerst das Arbeitsblatt auf. Markieren Sie die →Zellen, deren
    Inhalte Sie tarnen möchten.

    +   2. Wählen Sie im Menü "Format" den Eintrag "Zellen". Klicken Sie dort einmal
    auf die Registerkarte "Zahlen".

    +   3. Anschließend markieren Sie im Listenfeld "Kategorien" den Eintrag "Benutzerdefiniert".

    +   4. Wechseln Sie in das Eingabefeld "Formate". Geben Sie dort als Zahlenformat
    die Zeichen "********" ein.

    +   5. Mit Klick auf "OK" weisen Sie das neue Format den benutzerdefinierten Einträgen
    zu. Danach sind die Einträge in den so formatierten Zellen verschwunden. Die Formel
    der betreffenden Zelle bleibt zwar nach wie vor in der Eingabezeile sichtbar;
    in der Tabelle und auch im Ausdruck erscheinen aber lediglich die Zeichen "********".'
  merge: -1
  img_proc: true
- pgno: 19
  md: '# Excel


    # Überschriften nicht aus den Augen verlie-


    Oft sind Tabellen so groß, daß sie aus dem sichtbaren Bereich des Bildschirms
    "hinauswandern". Das passiert beispielsweise dann, wenn die Spaltenbreite größer
    wird, die Zahl der Einträge in den Spalten mehr Richtung hinteres Drittel des
    ABCs tendiert oder die Anzahl der Zeilen in Richtung 100 anwächst. Das hat auch
    den Nachteil, daß dann die Überschriften nicht mehr zu sehen sind.


    Für solche Fälle hält Excel eine praktische →Funktion parat. Damit bleiben die
    Überschriften immer im Blickfeld des Anwenders. So gehen Sie vor:


    +   1 Markieren Sie die gewünschte Zeile oder Spalte mit der Maus.


    +   2 Wählen Sie im Menü "Fenster" den Eintrag "Fixieren". Die untere Kante der
    Fixierung ist nun an der schwarzen Linie zu erkennen. Dieser Bereich bleibt damit
    ständig am Bildschirm sichtbar. Der Rest unterhalb dieses Bereichs läßt sich weiterscrollen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_19_0.png)


    # Funktion


    Eine Funktion ist eine ganz besondere Anweisung in Excel. Damit sagen Sie dem
    Programm quasi, was es tun soll. Eine Funktion beginnt immer mit einem Gleichheitszeichen,
    danach folgt der Name der Funktion und schließlich die Werte, die bei der Funktion
    verwendet werden sollen. Beispiel: =SUMME(C2:C8) berechnet die Summe aller Werte
    aus den Zellen C2 bis C8.


    # Ausgeblendete Fenster wiederfinden


    Die persönliche →Arbeitsmappe "PERSON-.XLS" wird in der Regel bei jedem Start
    von Excel geladen. Sie enthält meist auch die persönlichen Makros. Damit die Datei
    nicht bei der normalen Arbeit mit Excel stört, kann man sie über die Funktion
    "Fenster ausblenden" im Fenster-Menü unsichtbar machen. Bei Bedarf wird sie über
    den Menüeintrag "Fenster/Einblenden" wieder hervorgeholt. Haben Sie die Funktion
    "Fenster ausblenden" gewählt, wird die Datei, die sich gerade im Vordergrund befindet,
    versteckt und taucht auch


    in der Liste der geöffneten Fenster nicht mehr auf. Wenn aus Versehen beispielsweise
    die einzige geöffnete Datei ausgeblendet wird oder alle Dateien ausgeblendet werden,
    ist guter Rat teuer. Denn am Bildschirm sind nur noch die Menüs "Datei" und "Hilfe"
    zu sehen. Der Rest bleibt unsichtbar.


    Hier hält Excel die entsprechende Hilfe bereit. Sie finden den Eintrag "Einblenden"
    im Dateimenü. Wählen Sie dort "Einblenden" und alle ausgeblendeten Dateien tauchen
    wieder auf.


    # Arbeitsmappe


    Eine Arbeitsmappe ist die Datei, in der die Daten bearbeitet und gespeichert werden.
    Jede einzelne Arbeitsmappe kann unterschiedlich viele Blätter enthalten. Außerdem
    können Sie verschiedene Arten zusammengehöriger Daten in einer einzigen Datei
    speichern.


    # Anpassen von Beschriftungen


    Bei den meisten Tabellen gibt es regelmäßig ein Problem: Die Beschriftung ist
    zu lang und ragt über die Spaltenbreite hinaus. Bislang mußten Sie mit der Funktion
    "Spaltenbreite", durch Verändern der Schriftgröße oder mit einem Zeilenumbruch
    in der Zelle experimentieren.


    Unter Excel 97 ist das wesentlich komfortabler gelöst. Nur wenige Mausklicks sind
    dafür notwendig:


    +   5 Bestätigen Sie die Auswahl mit "OK". Daraufhin paßt Excel den Zellinhalt
    entsprechende an.


    So gehen Sie auch bei einer fertigen Tabelle vor; Sie müssen nur den gesamten
    Tabellenbereich markieren. Auf diese Art und Weise werden auf einen Schlag alle
    Zellengrößen an den Inhalten ausgerichtet.


    +   1 Markieren Sie die entsprechende Zelle mit der Maus.


    +   2 Wählen Sie aus dem Menü "Format" den Eintrag "Zellen" oder drücken die Tastenkombination
    "Strg" + "1".


    +   3 Wechseln Sie zur Registerkarte "Ausrichtung".


    +   4 Aktivieren Sie das Kontrollkästchen "An Zellgröße anpassen".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_19_1.png)


    # PCgo! TIP Software-Tip


    Excel 97 auf den Punkt gebracht: Mit dem multimedialen Excel 97 Computer Based
    Training lernen Sie alles, was Sie über Excel 97 wissen müssen. Dabei stöbern
    Sie nicht in einem Buch, sondern lernen direkt am Bildschirm und in der Anwendung.
    Mit Videosequenzen werden die einzelnen Funktionen nachvollziehbar dargestellt.
    Praxisnahe Beispiele erleichtern vor allem Einsteigern das Verständnis der komplexen
    Tabellenkalkulation. Auf ein Buch müssen Sie dabei trotzdem nicht verzichten.
    Auf 300 Seiten wird der Inhalt der CD gut gegliedert beschrieben. Kurz um: Dieser
    Multimedia-Kurs ist uneingeschränkt empfehlenswert und besticht durch ein gutes
    Preis-/Leistungsverhältnis.

    INFO Learn Key GmbH, ISBN-Nr. 3-933084-05-9 Preis: 39,80 Mark


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_19_2.png)'
  merge: -1
  img_proc: true
- pgno: 20
  md: '# Auto-Eingabe


    Wenn Sie Text in eine Spalte eingeben, versucht Excel diesen automatisch zu ergänzen.
    Dabei sucht es nach vorhandenen Wörtern in der selben Spalte. Diese Funktion können
    Sie auch anders nutzen. Bewegen Sie den Mauszeiger in die nächste, leere Zelle
    einer Tabelle. Drücken Sie dann die Tastenkombination "Alt" und "Pfeil nach unten".
    Sie bekommen dann ein Pull-down-Menü angezeigt. Darin finden Sie alle Einträge
    der aktuellen Spalte und können diese bequem einfügen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_20_0.png)


    # Wichtige Shortcuts


    Bei der Tabellenbearbeitung gibt es viele Arbeitsschritte, die Sie immer wieder
    benötigen. Sie können viel Zeit sparen, wenn Sie die zugehörige Tastenkombination
    kennen. Ein paar wichtige haben wir für Sie zusammengefaßt:


    +   - **Text wird fett:** "Strg", "Umschalten", "F"

    +   - **Text wird kursiv:** "Strg", "Umschalten", "K"

    +   - **Text wird unterstrichen** "Strg", "Umschalten", "U"

    +   - **Wert aus darüberliegender Zelle übernehmen:** "Strg", ";"

    +   - **Spalte verstecken** "Strg", "8"

    +   - **Zeile verstecken** "Strg", "9"

    +   - **Summenfunktion** "Alt", "Umschalten", "0"

    +   - **Datum einfügen** "Strg", ";"


    Viele Menübefehle haben auch eine Tastenkombination. Um diese herauszufinden,
    öffnen Sie einen Menüpunkt auf der Hauptmenüleiste. Neben den einzelnen Befehlen
    steht, sofern vorhanden, der zugehörige Shortcut.


    # Kommentare einsetzen


    Gerade bei umfangreichen Tabellen kann es vorkommen, daß man schnell die Übersicht
    verliert. Oder einzelne Tabelleneinträge sollten besser erklärt werden. Doch die
    Zelle ist zu klein. In solchen Fällen helfen Kommentare. So kann man viel Information
    unterbringen, ohne die Tabelle zu verändern.


    1 Markieren Sie die Zelle, zu der Sie einen Kommentar anlegen möchten. Klicken
    Sie dazu mit der linken Maustaste in die Zelle. Anschließend benutzen Sie die
    rechte Maustaste, um das Kontextmenü aufzurufen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_20_1.png)


    2 Wählen Sie den Befehl "Kommentar einfügen" aus. Ein gelb hinterlegtes Fenster
    wird geöffnet. In der ersten Zeile steht der Name desjenigen, der den Kommentar
    geschrieben hat. In der zweiten Zeile sehen Sie ein blinkendes Eingabefeld. Hier
    können Sie Ihre Bemerkungen eintragen. Wenn Sie fertig sind, klicken Sie auf eine
    beliebige Stelle außerhalb des Kommentarfensters.


    3 Die von Ihnen bearbeitete Zelle wird in der rechten, oberen Ecke mit einem roten
    Strich markiert. Somit können Sie sofort erkennen, zu welchen Zellen Kommentare
    vorhanden sind. Wenn Sie den Mauszeiger über die Zelle bewegen, wird der Kommentar
    eingeblendet.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_20_2.png)


    # Arbeitsblatt schützen


    Möchten Sie Teile Ihrer Tabelle vor fremdem Zugriff schützen? Oder möchten Sie
    verhindern, daß andere Benutzer versehentlich Formeln und Daten aus einer Tabelle
    löschen? Dann sollten Sie mit dem Arbeitsblatt-Schutz und der Freigabe von einzelnen
    Zellen arbeiten. So haben Sie eine bessere Kontrolle darüber, was mit Ihrer Tabelle
    passiert.


    1 Als erstes müssen Sie alle Zellen freigeben, die noch Eingaben akzeptieren sollen,
    auch wenn der Schutz aktiviert ist. Dazu markieren Sie die Zellen. Sie können
    dabei die Taste "Strg" gedrückt halten, um mehrere Zellen auszuwählen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_20_3.png)


    2 Wählen Sie aus dem Menü "Format" den Befehl "Zellen..." aus. Dort klicken Sie
    auf die Registerkarte "Schutz". Deaktivieren Sie den Kontrollkasten "Gesperrt".
    Damit sind die Zellen für die Dateneingabe freigegeben. Schließen Sie das Menü
    mit einem Klick auf "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_20_4.png)


    3 Als nächstes schützen Sie das Arbeitsblatt. Den entsprechenden Befehl finden
    Sie unter "Extras / Schutz / Blatt...". Im Menü "Blatt schützen" aktivieren Sie
    alle drei Kontrollkästen. Optional können Sie auch ein Kennwort angeben. Nachdem
    Sie das Menü wieder geschlossen haben, ist der Schutz sofort aktiv. Sollte jemand
    versuchen, eine geschützte Zelle zu überschreiben, erscheint eine entsprechende
    Meldung.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_20_5.png)'
  merge: -1
  img_proc: true
- pgno: 21
  md: '# Excel


    # Formeln erkennen


    Bei größeren Tabellen kommen oft viele Formeln zum Einsatz. Wenn Sie eine Formel
    später abändern möchten oder einen Fehler suchen, ist das nicht immer einfach.
    Oft ist nicht erkennbar, welche Zellen in einer Formel berechnet werden. Excel
    unterstützt Sie hier mit der "Detektiv"-Funktion. Diese können Sie bei Bedarf
    aus dem Menü "Extras" aufrufen. Oder Sie blenden die entsprechende Symbolleiste
    ein.


    1 Rufen Sie den Befehl "Detektiv" aus dem Menü "Extras" auf. Wählen Sie anschließend
    den Punkt "Detektiv-Symbolleiste" aus. Die Symbolleiste können Sie an einer beliebigen
    Stelle des Bildschirms oder auf der Hauptsymbolleiste anordnen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_21_0.png)


    2 Markieren Sie die Zelle, in der die zu bearbeitende Formel steht. Anschließend
    klicken Sie in der "Detektiv-Symbolleiste" auf das erste Symbol von links (Spur
    zum Vorgänger). In Ihrer Tabelle werden alle Zellen, die zu dieser Formel führen,
    mit einem blauen Punkt versehen. Zusätzlich zeigen blaue Pfeile von den Punkten
    zur Zelle mit der Formel.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_21_1.png)


    3 Benötigen Sie die Anzeige nicht mehr, klicken Sie auf das zweite Symbol von
    links (Spur zum Vorgänger entfernen). Die Markierungen werden ausgeblendet. Mit
    dieser Funktion fällt es Ihnen leichter, Formeln nachzuvollziehen


    # Zellen und Spalten tauschen


    Oft merkt man erst zu spät, daß eine Tabelle zum Beispiel nur fünf Zeilen, aber
    dafür 20 Spalten hat. Die Tabelle kann dann nicht mehr eingesehen werden, ohne
    die Bildlaufleiste zu verwenden. Wenn Sie jedoch Spalten und Zellen vertauschen,
    paßt wieder alles auf einen Bildschirmseite. Dies funktioniert mit Hilfe eines
    kleinen Tricks ganz einfach. Selbst umfangreiche Tabellen lassen sich auf diese
    Weise problemlos umstellen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_21_2.png)


    1 Markieren Sie zuerst die komplette Tabelle, die verändert werden soll. Rufen
    Sie dann aus dem Menü "Bearbeiten" den Befehl "Kopieren" auf. Dann klicken Sie
    auf die erste Zelle des Bereichs, an dem die geänderte Tabelle eingefügt werden
    soll. Der neue Bereich darf sich nicht mit der alten Tabelle überschneiden.


    2 Wählen Sie den Befehl "Inhalte einfügen..." aus. Sie finden ihn ebenfalls im
    Menü "Bearbeiten". Ein Menüfenster erscheint. Rechts unten finden Sie die Option
    "Transponieren". Aktivieren Sie diese Option. Anschließend klicken Sie auf "OK".
    Das Menü wird geschlossen und Excel verarbeitet Ihren Befehl.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_21_3.png)


    3 An der vorher festgelegten Stelle wird eine neue Tabelle eingefügt. Sie entspricht
    exakt der kopierten Tabelle. Nur die Zeilen und Spalten wurden ausgetauscht. Hat
    alles zu Ihrer Zufriedenheit funktioniert, können Sie die alte Tabelle löschen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_21_4.png)'
  merge: -1
  img_proc: true
- pgno: 22
  md: '# Lange Texte anzeigen


    Benutzen Sie in Ihrer Tabelle Zellen, die einen langen Text aufnehmen müssen?
    Sollte der Text länger als die Zellenbreite sein, wird er später nicht mehr angezeigt.
    Um dies zu verhindern, können Sie Excel anweisen, einen automatischen Zeilenumbruch
    durchzuführen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_22_0.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_22_1.png)


    Über die Texteigenschaften können Sie den Text beliebig verändern.


    1 Markieren Sie die Zellen, für die der Zeilenumbruch aktiviert werden soll. Dann
    rufen Sie aus dem Menü "Format" den Befehl "Zellen" auf. Klicken Sie anschließend
    auf die Registerkarte "Ausrichten".


    2 Unter "Texteigenschaften" finden Sie die Option "Zeilenumbruch". Aktivieren
    Sie diese und schließen Sie das Menü durch einen Klick auf "OK". Excel führt in
    dem markierten Bereich einen Zeilenumbruch aus. Dabei werden einzelne Zeilen vergrößert,
    um den Text komplett darstellen zu können.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_22_2.png)


    Mit Zeilenumbruch werden auch lange Texte angezeigt.


    # Verständliche Formeln


    Formeln werden verständlicher, wenn Sie für die Zellbereiche Namen vergeben. So
    wird dann aus der Funktion "Summe(A2:A5)" die Funktion "Summe(Ausgaben)". Wenn
    sich die Formel auf einzelne Spalten oder Zeilen bezieht, brauchen Sie nicht extra
    einen Namen zu vergeben. Excel erkennt den Bereich auch, wenn eine entsprechende
    Spalten- bzw. Zeilenüberschrift vorhanden ist. So würde im obigen Beispiel in
    der Zelle "A1" der Eintrag "Ausgaben" stehen.


    # Textlänge


    Manchmal ist es notwendig, die Länge eines Textes zu ermitteln. Damit Sie die
    einzelnen Zeichen nicht von Hand abzählen müssen, verwenden Sie die Funktion "Länge".
    Klicken Sie dazu mit der Maus auf eine leere Zelle Ihres Arbeitsblattes. Rufen
    Sie den Funktionsassistenten mit der Tastenkombination "Umschalttaste" + "F3"
    auf. Wählen Sie unter Kategorie den Eintrag "Alle" aus. Anschließend suchen Sie
    im rechten Fenster die Funktion "Länge". Nach dieser Auswahl erscheint ein Eingabefenster.
    Hier geben Sie die Bezeichnung der Zelle ein, deren Textlänge berechnet werden
    soll (z.B. B52). Als Ergebnis erhalten Sie die Textlänge inklusive aller Leerzeichen.


    # Zelleninhalt kombinieren


    Mit einer einfachen Funktion können Sie den Inhalt von verschiedenen Zellen kombinieren.
    Dabei werden die dargestellten Werte als Text behandelt. Unabhängig davon, ob
    es Zahlen, Währungsbeträge, Texte, usw. sind. Formeln werden ebenfalls ignoriert.
    Wollen Sie zum Beispiel die Zelleninhalte von "A2" und "D3" verknüpfen, verwenden
    Sie die Formel "=A2&D3".


    # Ganze Blätter kopieren


    Möchten Sie an einer vorhandenen Tabelle eine Formel verändern? Dann sollten Sie
    besser mit einer Kopie der Tabelle arbeiten. Falls etwas nicht mehr funktioniert,
    haben Sie immer noch die eigentliche Tabelle als Sicherheitskopie. Damit Sie nicht
    die Tabelle markieren müssen oder etwas vergessen, kopieren Sie gleich das ganze
    Arbeitsblatt. Das ist die schnellste und sicherste Methode. Und Sie brauchen dazu
    nur die Maus zu benutzen.


    1 Am unteren Rand des Excel-Fensters sehen Sie eine Auswahlleiste. Auf ihr werden
    alle Tabellen einer Datei angezeigt (Tabelle1, Tabelle2, usw.). Die aktive Tabelle
    erkennen Sie an dem weißen Reiter. Um das Arbeitsblatt zu kopieren, klicken Sie
    mit der linken Maustaste auf den Reiter und halten die Taste gedrückt. Gleichzeitig
    drücken Sie die Taste "Strg" und halten diese ebenfalls gedrückt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_22_3.png)


    2 Bewegen Sie den Mauszeiger. Unter dem Mauszeiger erscheint ein Papiersymbol
    mit einem kleine Pluszeichen in der Mitte. Bewegen Sie das Symbol an das Ende
    der Tabellenreihe. Lassen Sie anschließend die gedrückten Tasten wieder los. An
    der gewählten Stelle wird eine Kopie Ihres Arbeitsblattes eingefügt. Es bekommt
    den selben Namen wie das Original und eine eingeklammerte "2".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_22_4.png)'
  merge: -1
  img_proc: true
- pgno: 23
  md: '# Spaltenbreiten ändern


    Sie können in Excel auf verschiedene Weise die Höhe von Zeilen oder die Breite
    von Spalten ändern. Methode 1 geht über das Formatmenü. Dazu gehen Sie wie folgt
    vor:


    1 Markieren Sie die entsprechenden Spalten mit der Maus. Wählen Sie aus dem Menü
    "Format" den Eintrag "Spalte/Breite"


    2 Tragen Sie nächsten Eingabefeld die gewünschte Breite ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_23_0.png)


    Leichter und schneller geht es jedoch mit der Maus. Dazu gehen Sie wie folgt vor:


    3 Sie fahren mit der Maus über den Rand der Schaltfläche mit der Spaltenbeschriftung
    und verändern die Größe durch Halten und Ziehen mit der Maus. Sie können auch
    mehrere Spalten gleichzeitig als zusammenhängenden und auch als nicht zusammenhängenden
    Bereich in der Breite verändern.


    4 Dazu klicken Sie mit gedrückter gehaltener Taste "Strg" mit der Maus auf die
    entsprechenden Spaltenschaltflächen und ziehen diese auf die gewünschte Breite.
    Wenn Sie die Taste "Strg" loslassen, sind die zu verändernden Spaltenbereiche
    markiert.


    5 Wenn Sie nun die linke Maustaste loslassen, sind alle markierten Spaltenbereiche
    in der gleichen Breite verändert. Möchten Sie die Zeilenhöhe verändern, gehen
    Sie entsprechend mit den Zeilenschaltflächen vor.


    # Standard-Symboleleisten wiederherstellen


    Haben Sie Excel mit vielen neuen Symboleisten Ihren Wünschen angepaßt und plötzlich
    fehlt doch eine der Symboleisten? Wie Sie wieder Ihre Ursprungs-Symboleisten zurückbekommen,
    zeigen die folgenden Schritte:


    1 Wählen Sie das Menü "Ansicht" und dort den Punkt "Symboleisten" an. Klicken
    Sie dann auf "Anpassen". Das Dialogfenster "Anpassen" wird eingeblendet. Dort
    klicken Sie auf die Schaltfläche "Zurücksetzen". Bestätigen Sie die folgende Abfrage
    mit "Ja" und ab sofort stehen Ihnen die Original-Symboleisten wieder zur Verfügung.


    2 Möchten Sie doch einige Änderungen an den Symboleisten vornehmen, können Sie
    das auch über den Befehl "Extras/Anpassen" im


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_23_1.png)


    Dialogfeld "Anpassen". Dort ziehen Sie einfach die gewünschten Befehle der einzelnen
    Menüs auf die entsprechende Symboleiste.


    # Zeilenumbruch in einer Zelle


    Sie kennen sicher das folgende Problem: Manchmal wird eine Excel-Tabelle recht
    umfangreich. Die einzelnen Spalten fallen dabei oft sehr klein aus, gerade dann,
    wenn Sie nur Zahlen enthalten. Da wird es besonders schwierig, Text in den Spalten
    lesbar unterzubringen. Eine Möglichkeit wäre, die Textausrichtung zu ändern. Oder
    Sie fügen einen Zeilenumbruch in die Zelle ein.


    1 Klicken Sie auf die Zelle, in der Sie den Text eingeben wollen. Fangen Sie an,
    den Text zu schreiben.


    2 Wenn Sie mit Ihrem Text an das Zellenende gelangen, drücken Sie die Tastenkombination
    "Alt" und "Eingabe". Damit erreichen Sie einen Zeilenumbruch in der selben Zelle.


    # Rahmen per Shortcut


    Der einfachste Weg, einen Rahmen um einen Zellbereich zu legen führt über sogenannte
    Shortcuts. Um einem markierten Bereich einen kompletten Rahmen zuzuweisen, drücken
    Sie einfach die Tastenkombination "Strg", "Umschalttasten", "_". Möchten Sie alle
    Rahmen auf einen Schlag wieder entfernen, drücken Sie einfach "Strg", "Umschalttasten",
    ">".


    # Shortcut zum Einfügen


    Sie sparen sich beim Einfügen eines neuen Arbeitsblattes den umständlichen Weg
    über das Menü "Einfügen/Tabelle" indem Sie einfach die Tastenkombination "F1",
    "Umschalttasten" und "Alt" drücken.


    # → Arbeitsmappe


    Eine Arbeitsmappe ist die Datei, in der die Daten bearbeitet und gespeichert werden.
    Jede einzelne Arbeitsmappe kann unterschiedlich viele Blätter enthalten. Außerdem
    können Sie verschiedene Arten zusammengehörige Daten in einer einzigen Datei speichern.


    # Menübefehle blitzschnell auswählen!


    Sie können jeden beliebigen Menübefehl in der Menüleiste oder einer sichtbaren
    Symboleiste mit der Tastatur auswählen. Drücken Sie die Taste "Alt", um die Menüleiste
    auszuwählen. Möchten Sie eine Symboleiste auszuwählen, drücken Sie "Strg", "Tab".
    Wiederholen Sie diesen Schritt solange, bis die gewünschte Symboleiste ausgewählt
    ist. Geben Sie den unterstrichenen Buchstaben in dem Menünamen ein, der den gewünschten
    Befehl enthält.'
  merge: -1
  img_proc: true
- pgno: 24
  md: '# Excel


    # Add-ins löschen


    Im Add-in-Manager von Excel fehlt die Möglichkeit, einmal installierte →Add-ins
    zu löschen. Excel lässt sich dabei aber trotzdem auf zwei Arten überlisten. Entweder
    Sie gehen den Weg über die →Registrierdatenbank und führen dabei die folgenden
    Schritte durch:


    Excel 97: HKEY_CURRENT_USER/Software/Microsoft/Office/7.0/Excel


    1 Gehen Sie in das Menü "Extras", wählen dort den "Add-in-Manager" an und deaktivieren
    alle Add-ins, die Sie löschen möchten. Danach beenden Sie Excel.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_24_0.png)


    2 Gehen Sie über den Windows-Startbutton auf "Ausführen", lassen das Windows-Verzeichnis
    durchsuchen und starten den Registrierungseditor REGEDIT.EXE.


    3 Dort suchen Sie je nach Excel-Version den folgenden Schlüssel:

    Excel 95: HKEY_CURRENT_USER/Software/Microsoft/Excel/7.0


    4 Klicken Sie nun auf den Add-in-Manager in der Baumstruktur. Jetzt werden alle
    installierten und derzeit nicht aktiven Add-ins im rechten Fenster angezeigt.


    5 Markieren Sie dort das Add-in, das Sie entfernen möchten, und wählen den Befehl
    "Löschen" im Menü "Bearbeiten". Beantworten Sie die Sicherheitsabfrage mit "Ja"
    und Sie können weitere Add-ins löschen oder aber den Registrierungseditor verlassen.


    Trauen Sie sich nicht so recht an die Bearbeitung der Registrierungsdatenbank
    heran, können Sie auch den Add-in-Manager austricksen:


    6 Nach der Beendigung von Excel wechseln Sie in den Explorer. Löschen oder verschieben
    Sie nun die Datei der entsprechenden Add-ins. Starten Sie Excel und rufen das
    Menü "Extras/Add-in-Manager" auf.


    7 Klicken Sie dort auf den Eintrag des Add-ins, das Sie gerade im Explorer gelöscht
    oder verschoben haben. Da Excel die Datei nicht mehr findet, bietet das Programm
    an, das Add-in aus der Liste zu löschen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_24_1.png)


    # Deckblatt aus Textverarbeitung


    Möchten Sie Ihre Tabellen mit einem Deckblatt versehen? Kein Problem, denn sowohl
    unter Excel 95 als auch 97 können Sie ein Deckblatt einbauen; ganz gleich, bei
    mit welcher Textverarbeitung Sie es gestaltet haben. Bei der Version 95 gibt es
    jedoch Probleme bei der Größenkalierung des Blattes. Wir zeigen Ihnen am Beispiel
    der Textverarbeitung Word, wie Sie das Deckblatt am besten importieren:


    1 Öffnen Sie Ihre →Arbeitsmappe, in der Sie das Deckblatt einfügen möchten. Wählen
    Sie dort die letzte leere Tabelle an.


    2 Klicken Sie nun im Menü "Einfügen" den Eintrag "Objekt" und dort den Punkt "Von
    Datei erstellen" an.


    3 Belassen Sie das eingefügte Deckblatt wie es ist und legen es mit dem Befehl
    "Bearbeiten/Kopieren" oder mit der Tastenkombination "Strg", "C" in die →Zwischenablage.


    4 Klicken Sie nun auf das Register der Tabelle, in der das Deckblatt eingebaut
    werden soll. Über das Menü "Bearbeiten" und den Eintrag "Inhalte einfügen" holen
    Sie das Deckblatt wieder aus der Zwischenablage. Dabei wählen Sie als Quelle nicht
    "Microsoft Word Dokument Objekt", sondern "Grafik (Enhanced Metadatei)".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_24_2.png)


    5 Gehen Sie nun wieder auf die letzte Tabelle und löschen dort das eingebaute
    Objekt. Wechseln Sie zurück zur Tabelle, in der sich das Deckblatt befindet und
    skalieren Sie das Bildobjekt nach Ihren Wünschen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_24_3.png)'
  merge: -1
  img_proc: true
- pgno: 25
  md: '# Markierungen trotz Bildlauf


    Wenn Sie die Tasten für den Bildlauf (wie zum Beispiel "Bild-Auf" und "Bild-Ab")
    bei ausgeschaltetem Bildlauf-Feststellmodus verwenden, wird die Markierung entfernt.
    Wenn die Markierung während der Durchführung eines Bildlaufs beibehalten werden
    soll, schalten Sie zunächst den Bildlauf-Feststellmodus ein.


    # Zwischenablage


    Oder auch Clipboard genannt, ist ein temporärer Speicher von Windows in einem
    Betriebssystem oder Anwendungsprogramm, der für den Austausch von Daten reserviert
    ist. Dort legt beispielsweise die Funktion "Kopieren" eines Anwendungsprogramms
    den zuvor markierten Text- oder Bildbereich ab, um ihn später per "Einfügen" an
    einer anderen Stelle oder in einem anderen Programm wieder zu nutzen.


    # Add in


    Mit Add in bezeichnet man meist eine Sammlung von zusätzlichen Funktionen oder
    Optionen, die in das Programm integriert werden. Die Programme werden dadurch
    in ihrem Leistungsumfang verstärkt und erhalten zusätzliche meist neue Eigenschaften.


    # Registrierdatenbank


    Oder auch Registry genannt, ist eine interne Datenbank in Windows 95/98, in der
    sämtliche Konfigurationsdaten verzeichnet sind. Sie ersetzt die unter DOS verwendeten
    Konfigurationsdateien "config.sys" und "autoexec.bat" sowie die Initialisierungsdateien
    von Windows.


    # Tabellen farbig gestalten


    Manchmal trägt ein wenig Farbe durchaus zur besseren Lesbarkeit bei, vor allem
    bei Tabellen die sehr groß sind. Wie das einfach und schnell zu bewerkstelligen
    ist, zeigen die folgenden Schritte:


    1 Als erstes markieren Sie den gewünschten Zellenbereich mit der Maus. Klicken
    Sie anschließend auf den Auswahlpfeil an der Schaltfläche "Rahmen".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_25_0.png)


    Das Fenster mit der Rahmenpalette wird geöffnet. Wählen Sie dort den gewünschten
    Rahmen aus. Der markierte Zellenbereich wird nun eingerahmt.


    2 Möchten Sie einen farbigen Hintergrund, markieren Sie zunächst den Zellbereich
    und klicken dann einfach auf die nächste Schaltfläche "Füllfarbe" in dieser Werkzeugleiste.


    3 Wie wäre es mit farbiger Schrift? Dafür markieren Sie den gewünschten Zellbereich
    und klicken auf die Schaltfläche "Schriftfarbe". Dort können Sie dann die entsprechende
    Schriftfarbe auswählen.


    # Daten in mehreren Tabellen eingeben


    Sie haben manchmal Tabellen, in denen dieselben Daten immer wieder vorkommen;
    zum Beispiel Monatsangaben, Überschriften oder die feststehende jährlich Miete
    bei einem selbst angelegten Haushaltsbuch über mehrere Jahre. Mit einem einfachen
    Trick fügen Sie Daten in mehrere Tabellen einer Arbeitsmappe ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_25_1.png)


    1 Laden Sie das entsprechende Arbeitsblatt. Dann drücken Sie die Taste "Strg"
    und klicken gleichzeitig auf die Registerkarte am unteren Ende der Tabelle, in
    der die Namen der Tabellen eingetragen sind. Die Namen der angeklickten Tabellen
    sind weiß unterlegt. Das bedeutet, dass diese Tabellen aktiv sind.


    2 Möchten Sie nun Werte in eine Zelle eingeben, werden sie automatisch in den
    anderen Tabellen übernommen. Sie sollten jedoch beachten, dass die Eingabe der
    Daten für alle aktiven Tabellen gilt. Möchten Sie Daten in nur einer Tabelle angeben,
    müssen Sie nochmals die Namen der Tabelle anklicken.


    # Anpassen von Texten


    Ein Problem taucht häufig bei Tabellen auf: Die Texte in den Zellen sind zu lang.
    Doch vorbei sind die Zeiten der umständlichen Anpassung via Spaltenbreite oder
    Zeilenumbruch. Sie können durch einen simplen Trick Abhilfe schaffen.


    1 Rufen Sie im Menü "Format" den Punkt "Zellen" auf oder drücken Sie die Tastenkombination
    "Strg" und "1"


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_25_2.png)


    2 Wechseln Sie nun auf die Registerkarte "Ausrichtung".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_25_3.png)


    3 Aktivieren Sie dort ganz einfach das Kontrollkästchen "An Zellgröße anpassen"
    und bestätigen die Auswahl mit "OK". Excel passt die Schriftgröße in der Zelle
    daraufhin voll automatisch so an, dass die Zeichenketten in die Zelle passt.'
  merge: -1
  img_proc: true
- pgno: 26
  md: '# ## ➜ Shortcut


    Das ist eine Tastenkombination, mit der ein bestimmter Befehl schnell ausgeführt
    werden kann. Shortcuts sind in Excel oft schon vordefiniert. Darum sind in der
    Menüleiste die Buchstaben unterstrichen, mit denen das entsprechende Menü per
    Tastatur geöffnet werden kann. Drücken Sie zum Beispiel die Tastenkombination
    „Alt“ und „N“, öffnet sich das Menü „Daten“.


    # ## Zellbezeichnung auf jeder Seite


    Gerade bei großen Tabellen ist es unglücklich, wenn auf der zweiten Seite die
    Zeilen- und Spaltenbezeichnungen nicht mehr mit ausgedruckt werden. Mit ein paar
    Handgriffen können Sie das ganz einfach ändern.


    Markieren Sie als erstes die Spalte oder Zeile, die Sie auf jeder Seite ausgedruckt
    haben möchten. Dazu klicken Sie entweder auf A,B,C oder auf 1,2,3 – abhängig davon,
    ob Sie Zeilen oder Spalten markieren möchten. Wenn Sie sowohl die erste Zeile
    als auch erste Spalte ausgedruckt haben möchten, klicken Sie zunächst auf „1“,
    halten dann die „Strg“-Taste gedrückt und klicken auf „A“. Ziehen Sie jetzt die
    Markierung bei gehaltener Maustaste so weit, wie Sie sie haben wollen.


    Klicken Sie anschließend in die Bearbeitungsleiste oben links. In der Eingabezeile
    tippen Sie „Drucktitel“ ein.


    Sobald Sie nun die Excel-Tabelle komplett ausdrucken und diese über mehrere Druckseiten
    geht, wird der markierte Bereich auf jedem Blatt mit ausgedruckt. Das erleichtert
    die Orientierung auf den Folgeseiten.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_26_0.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_26_1.png)


    # ## Namen für Zellen vergeben


    Daten, die Sie häufig benötigen, können Sie sich auch in umfangreichen Tabellen
    schnell auf den Bildschirm holen. Dann müssen Sie sich beispielsweise nicht mehr
    merken, in welcher Zelle der Umsatz des Jahres 1997 steht. Allerdings braucht
    es dafür einige Vorarbeit:


    +   1. Markieren Sie die Zellen, denen Sie einen Namen geben möchten.

    +   2. Klicken Sie auf die Bearbeitungsleiste am linken Bildschirmrand.

    +   3. Geben Sie hier nun den Namen ein, unter dem Sie die markierten Zellen speichern
    möchten. Das könnte etwa „Umsatz 1997“ sein.

    +   4. Künftig klicken Sie nur mit der rechten Maustaste auf das schwarze Dreieck
    neben der Bearbeitungsleiste und im Auswahlfeld „Umsatz 1997“ an. Im Excel-Sheet
    wird sofort die entsprechende Stelle angezeigt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_26_2.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_26_3.png)


    # ## Gedrehte Texte in Excel


    Werden in PowerPoint gedrehte Texte nach Excel exportiert, verlieren sie dabei
    ihren Drehwinkel. Denn PowerPoint ist nur bedingt mit Excel → kompatibel. Um den
    Drehwinkel trotzdem zu behalten, gehen Sie wie folgt vor:


    Im Menüpunkt „Bearbeiten“, „Inhalte einfügen“ in Excel 8.0 ein. Im „Inhalte einfügen“-Dialog
    müssen Sie das Format „Grafik (Enhanced Metafile)“ wählen.


    +   1. Markieren Sie das gedrehte Textelement in PowerPoint. Kopieren Sie es anschließend
    mit dem → Shortcut „Strg“ und „C“ in die Zwischenablage.

    +   2. Fügen Sie es dann über den Menüpunkt „Bearbeiten“, „Inhalte einfügen“ in
    Excel 8.0 ein.

    +   3. Wählen Sie im Dialog „Inhalte einfügen“ das Format „Grafik (Enhanced Metafile)“.

    +   4. Das Zeichnungselement mit dem gedrehten Text wird jetzt als Grafik eingefügt.
    Der gedrehte Text läßt sich aber nicht mehr bearbeiten.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_26_4.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_26_5.png)


    # ## Eigene Symbolleisten anlegen


    So umfangreich die Auswahl an Symbolen in Excel auch ist; viele Funktionen benötigt
    man gar nicht oder nur selten. Daher kann eine individuelle → Symbolleiste viel
    Platz auf dem Bildschirm sparen und die Übersicht bewahren.


    Wählen Sie in der Menüleiste „Ansicht“, „Symbolleiste“ und dann „Anpassen“.


    Wählen Sie nun die → Registerkarte „Symbolleiste“. Hier aktivieren Sie die Symbolleiste,
    die Sie ändern möchten. Ist diese aktiviert, erscheint ein Häkchen im Kasten vor
    dem Namen. Außerdem wird die Symbolleiste angezeigt.


    Um Veränderungen vorzunehmen, klicken Sie nun etwa auf das Symbol, das Sie entfernen
    möchten. Halten Sie die Maustaste gedrückt und ziehen Sie das Symbol aus der Leiste
    heraus. Nun lassen Sie die linke Maustaste wieder los.


    Wollen Sie die Aktion wieder rückgängig machen, klicken Sie auf „Zurücksetzen“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_26_6.png)'
  merge: -1
  img_proc: true
- pgno: 27
  md: '# Gleiche Daten in Zellen und Tabellenblättern


    1 Sie wollen über das ganze Excel-Sheet verteilt dieselben Daten in bestimmte
    Zellen eingeben? Dazu müssen Sie nicht in jede Zelle extra den Text eingeben oder
    mit der Kopier-Funktion übertragen. Es geht auch einfacher:


    2 Markieren Sie alle Zellen, in denen der selbe Text stehen soll. Wollen Sie aneinander
    angrenzende Zellen markieren, halten Sie die "Shift"-Taste gedrückt. Wollen Sie
    auseinanderliegende Zellen markieren, halten Sie während jedes Mausklicks die
    "Strg"-Taste gedrückt.


    3 Fangen Sie nun an, den Text in eine der markierten Zellen zu schreiben. Sie
    können auch über den Zellenrand hinaus Text eingeben.


    4 Drücken Sie jetzt den Shortcut "Strg" und "Return"-Taste. Nun steht der Text
    in allen markierten Zellen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_27_0.png)


    5 Wollen Sie dieselben Daten in mehreren Tabellenblättern eingeben, müssen Sie
    alle Blätter markieren. Dazu klicken Sie unten links auf die Karteikarte "Tabelle1".
    Halten Sie wiederum die "Shift"-Taste für angrenzende oder die "Strg"-Taste für
    auseinanderliegende Blätter gedrückt und markieren Sie diese. Geben Sie nun den
    Text ein. Er erscheint automatisch auf allen markierten Tabellenblättern.


    # Diagramme schnell erzeugen


    1 Wollen Sie bestimmte Daten schnell als Grafik angezeigt bekommen, dann markieren
    Sie den Datenbereich auf dem Arbeitsblatt mit der Maus. Achten Sie aber darauf,
    daß alle Zellen markiert sind.


    2 Drücken Sie nun die "F11"-Taste. Aus den markierten Zellen wird eine Grafik
    angelegt. Gleichzeitig öffnet sich die Diagramm-Symbolleiste; damit können Sie
    die Grafik weiterbearbeiten, falls Sie das möchten.


    # Gitternetzlinien entfernen


    1 Zur Eingabe ist die Gitternetzstruktur in Excel eine große Hilfe. Doch oft macht
    eine Ansicht ohne die störende Unterteilung mehr Sinn. Und auch beim Druck möchte
    man meistens auf die Linien verzichten.


    fehl "Optionen". Hier wählen Sie die Karteikarte "Ansicht" und deaktivieren die
    Option "Gitternetzlinien". Nun darf das Kästchen davor nicht mehr mit einem Haken
    versehen sein.


    2 Wollen Sie nur eine Ansicht ohne Linien, dann wählen Sie im Menüpunkt "Extras"
    den Be-


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_27_1.png)


    3 Dieses Ausschalten der Linien hat aber leider noch nichts mit dem Ausdruck zu
    tun. Die Linien werden dennoch ausgedruckt. Um auch das zu verhindern, wählen
    Sie "Datei" und hier "Seite einrichten". Aktivieren Sie die Karteikarte "Tabelle"
    und deaktivieren Sie hier die Option "Gitternetzlinien".


    # Beschriftungen anpassen


    1 Das Problem gibt es in fast jeder Tabelle: Die Beschriftungen sind zu lang.
    Bisher haben Sie in diesen Fällen mit Spaltenbreiten, Zeilenumbruch in einer Zelle
    oder der Schriftgröße experimentiert, bis endlich das gewünschte Ergebnis erzielt
    war.


    Sie aus der Menüleiste "Format" und "Zellen" auf.


    2 Excel 97 macht es Ihnen einfach: Paßt eine Beschriftung nicht ganz in eine Zelle,
    rufen Sie


    3 Wechseln Sie auf die Registerkarte "Ausrichtung". Hier aktivieren Sie dann das
    Kontrollkästchen "An Zellgröße anpassen". Bestätigen Sie mit "Ok". Excel paßt
    die Schriftgröße daraufhin automatisch so an, daß der Text genau in die Zelle
    paßt.'
  merge: -1
  img_proc: true
- pgno: 28
  md: '# ➜ Kompatibilitäten


    Wenn verschiedene Programme problemlos Daten austauschen können, ist deren Kompatibilität
    zueinander gewährleistet. Probleme gibt es aber zwischen verschiedenen Programmversionen.
    So verstehen ältere Versionen nicht die Formate neuerer Versionen. Beim Datenaustausch
    kann es dann unter Umständen zu Verlusten kommen. Das gilt aber auch beim Austausch
    von Daten unterschiedlicher Anwendungen. Formatierungen, die etwa in PowerPoint
    vorgenommen wurden, können in Excel nicht unbedingt wiedergegeben werden.


    # ➜ Excel-Sheet


    Das ist der Fachbegriff für eine Excel-Tabelle. Dazu gehören sämtliche Arbeitsblätter,
    eingebettete Formeln, Formatierungen und Verknüpfungen mit Datensätzen, unternehmenseigenen
    Anwendungen etc.


    # ➜ Registerkarte


    Bei manchen Menüpunkten erscheint nach der Auswahl ein neues Fenster. Sollten
    hier sehr viele Einstellungen zur Auswahl stehen, sehen Sie am oberen Fensterrand
    kleinere Reiter. Das sind die sogenannten Registerkarten. Sie fassen mehrere,
    meist thematisch zusammengehörige Optionen zusammen. So haben Sie alle Auswahlmöglichkeiten
    jederzeit übersichtlich im Griff.


    # ➜ Symbolleiste


    Viele Programme besitzen neben der Menüleiste zusätzliche Bereiche, in denen Symbole
    angeordnet sind – die Symbolleisten. Durch einen einzigen Mausklick auf die kleinen
    Bilder geben Sie dem Programm in Sekundenschnelle einen Befehl.


    # ▼ Alt und Shift beim Zeichnen


    **1** Ebenso wie bei vielen Grafikprogrammen haben die Tasten "Alt" und "Shift"
    auch beim Zeichnen in Excel eine besondere Funktion. Während Sie ohne gedrückte
    Taste in Excel beliebig große und frei platzierbare Rechtecke in die Tabelle setzen
    können, schränken die beiden Tasten die Flexibilität ein und erleichtern so ein
    exaktes Arbeiten.


    **2** Wenn Sie zum Beispiel die Taste "Shift" drücken, während Sie ein Rechteck
    oder eine Ellipse aufziehen, lassen sich nur Quadrate oder Kreise erzeugen.


    **3** Wendet man die "Shift"-Taste in Verbindung mit Linien und Pfeilen an, zeichnet
    Excel nur horizontale und vertikale Linien.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_28_0.png)


    **4** Drücken Sie die "Alt"-Taste, bevor Sie mit dem Zeichnen beginnen, können
    Sie die Größe von Rechtecken, Pfeilen, Textfeldern, Kreisbögen und Linien nur
    sprungweise von Zellennummer zu Zellennummer verändern.


    **5** Drücken Sie dagegen die "Alt"-Taste erst, wenn der Ausgangspunkt des Objekts
    bereits festgelegt ist, bleibt dieser auf seinem Platz, doch der Endpunkt fällt
    immer mit einer Zellenecke zusammen.


    **6** Eine weitere Möglichkeit, Rechtecke in der Größe einer oder mehrerer Zellen
    zu zeichnen, bietet die Funktion "Schatten hinzufügen". Markierte Bereiche statt
    Sie auf einfache Weise mit einem schattierten Rahmen aus. Markieren Sie dafür
    mit der Maus den Zellbereich, der mit einem schattierten Rahmen hervorgehoben
    werden soll. Nachdem Sie die Schaltfläche "Schatten hinzufügen" angeklickt haben,
    zeichnet Excel ein Rechteck in der Größe des markierten Bereichs. Dieses Objekt
    können Sie wie alle anderen Objekte verschieben und in der Größe anpassen.


    **7** Verändert man nachträglich die Spaltenbreite oder Zeilenhöhe, ändert sich
    die Größe der gezeichneten Objekte entsprechend. Auch das kann der Anwender einschränken.


    **8** Wollen Sie die Größe eines Objekts unabhängig von der Zellengröße halten,
    markieren Sie das Objekt und klicken es mit der rechten Maustaste an. Im Pop-up-Menü
    wählen Sie nun den Eintrag "Objekt formatieren". Wenn Sie im Registerblatt "Eigenschaften"
    ein Häkchen vor den Eintrag "Von Zellposition und -größe abhängig" setzen, bleibt
    das Objekt künftig von den Größenveränderungen der Zellen unbehelligt und behält
    seine Form.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_28_1.png)


    # ▼ Nachkommastellen ausrichten


    **1** Haben Sie zahlreiche Nachkommastellen in unterschiedlicher Länge, sieht
    die Excel-Tabelle oft unübersichtlich aus. Sie können aber mit einem kleinen Trick
    die Zahlen untereinander ausrichten.


    **2** Markieren Sie die Zellen, die Sie ausrichten wollen.


    **3** Wählen Sie über das Menü "Format" die Option "Zellen". Klicken Sie auf die
    Karteikarte "Zahlen".


    **4** Klicken Sie im Auswahlfeld unter "Kategorie" auf "Benutzerdefiniert".


    **5** Markieren Sie anschließend die Zeile "Standard" unter der Option "Formate".
    Geben dann "0,???" ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_28_2.png)


    Achtung! Die Anzahl der Fragezeichen, muß der Zahl mit den meisten Nachkommastellen
    entsprechen. Ein Beispiel: Haben Sie eine 4,58964 markiert, dann müssen Sie fünf
    Fragezeichen eingeben.


    **6** Bestätigen Sie die Eingabe mit "OK". Nun sind Ihre Zahlen in den markierten
    Zellen optimal ausgerichtet.'
  merge: -1
  img_proc: true
- pgno: 29
  md: '# Formatieren


    Unter Formatieren versteht man die optische Gestaltung einer Tabelle oder eines
    Textes. Hier kann mit unterschiedlichen Zeichen- größen, Schriftarten und Farben
    gearbeitet werden. In den Tabellen können die Zellen vergrößert, zusammengefaßt,
    ausgeblendet oder verkleinert werden. All das dient der Übersichtlichkeit gerade
    langer Tabellenblätter.


    # Zellen


    Die Zelle ist die kleinste Einheit in einer Tabelle. Sie dient zur Aufnahme von
    Daten wie Texte, Zahlen oder Formeln. Jede einzelne Zelle wird durch die genaue
    Position in Zeile und Spalte festgelegt. Spalten erkennt man an der Buch- staben-Bezeichnung,
    die Zeilen an den fortlaufenden Zahlen.


    # Registerkarte


    Seit Office 97 arbeitet Microsoft mit den Registerkarten. Klickt man einen übergeordneten
    Befehl an, so öffnet sich ein Menü. Hier bekommt man dann auf Karteikartenreiter
    diverse weitere Auswahlmöglichkeiten. Somit können viele Funktionen gebündelt
    und übersichtlich angeordnet werden. Außerdem spart das Ganze dann auch Platz
    auf dem ohnehin schon vollen Bildschirm.


    # Importieren


    Über die Import/Export-Funktion läuft der Datenaustausch zwischen unterschiedlichen
    Programmen ab. Leider gibt es nicht in jeder Anwendung für alle anderen einen
    geeigneten Filter. Dann muß mit Datenverlusten gerechnet werden. Die gängigsten
    Filter in der Textverarbeitung sind zum Beispiel das .txt- oder das .rtf-Format.
    Damit können Texte aus allen Anwendungen konvertiert werden.


    # Starttabelle ändern


    1 Die →Standardmappe, die jedesmal beim Start von Excel und nach dem Aufruf der
    Funktion "Neu" und "Datei neu" erscheint, können Sie nach Ihren Vorstellungen
    anpassen. Danach werden beim Öffnen einer neuen, leeren Tabelle Ihre Einstellungen
    automatisch verwendet. ce\Office". Ach ten Sie darauf, daß die Endung der neuen
    Datei ".xlt" lautet. Excel hängt beim Speichern ein ".xls" zusätzlich an.


    2 →Formatieren Sie die Mappe nach Ihren Bedürfnissen und speichern Sie die Datei
    anschließend unter "C:\msoffice\excel\xlstart\map pe.xlt". Das Verzeichnis "xlstart"
    befindet sich eventuell auch in "C:\Programme\Microsoft Offi-


    3 Beenden Sie Excel und starten Sie es erneut. Ab jetzt steht Ihnen bei jedem
    Excel-Start diese neue Mappe zur Verfügung.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_29_0.png)


    # Tag-Jahr-Konvertierung


    1 Ist die Vermietungsdauer z.B für eine Maschine in Tagen angegeben, können Sie
    durch folgende Formeleingabe automatisch das Alter in Jahren berechnen.


    ```

    Die Formel lautet:

    =ganzzahl((jetzt()-Zelle)/365,25)

    ```


    2 Genauso können Sie auch umgekehrt statt Jah- resangaben die Tagesangaben berechnen
    lassen. Dann gilt folgende Formel: "=ganzzahl (jetzt()-Zelle)". Heraus kommt die
    Anzahl der Tage.


    3 Für "Zelle" setzen Sie die Bezeichnung ein, in der der Tages- bzw. jahreswert
    steht.


    # Verborgene Zellen


    1 Mit Hilfe eines simplen Tricks können Sie sogenannte "verborgene" Zellen anlegen.
    Die Eingaben in solche →Zellen werden weder ausgedruckt, noch erscheinen sie auf
    dem Bildschirm. Lediglich in der Bearbeitungsleiste ist der Inhalt einer solchen
    Zelle sichtbar.


    2 Wählen Sie in der Menüleiste "Format" und hier "Zellen".


    3 Unter der Option "Kategorie" klicken Sie den letzten Eintrag "Benutzerdefiniert"
    an.


    4 Klicken Sie in der rechten Spalte auf ein beliebiges Format. Löschen Sie die
    Eingabezeile indem Sie einmal die Return-Taste betätigen. Geben Sie statt dessen
    ";;;" (drei Semikolons ohne An-


    führungszeichen) ein. Bestätigen Sie mit OK. 5 Nun geben Sie in die aktuelle Zelle
    einen x-beliebigen Text oder Wert ein. Sie sehen ihn in der Bearbeitungsleiste
    eingeblendet. Sobald Sie eine andere Zelle auswählen, verschwindet auch der Text.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_29_1.png)


    # Hilfreiche Tastaturkürzel


    1 Die aktuelle Zeit können Sie über die Tastaturkombination "Strg + ." einfügen.


    2 Das Datum können Sie mit der Tastenkombination "Strg + ." einfügen.


    3 Sie können Texte oder Werte in mehrere Zellen gleichzeitig eingeben, indem Sie
    alle betroffenen Zellen markieren. Nun tippen Sie den gewünschten Inhalt ein und
    betätigen die Tastenkombination "Strg+Enter".'
  merge: -1
  img_proc: true
- pgno: 30
  md: '# Tabellenbereich berechnen


    1 Wenn Sie in einer umfangreichen Tabelle mit zahlreichen Formeln arbeiten, werden
    Sie in der Regel die manuelle Neuberechnung aktivieren wollen. Diese finden Sie
    in der Menüleiste unter "Extras" und "Optionen". Hier klicken Sie auf die →Registerkarte
    "Berechnen" und in den Kreis vor "Manuell". Auf diese Weise verhindern Sie, daß
    Sie nach jeder Eingabe mehrere Minuten warten müssen, bis Excel alle Formeln neu
    berechnet hat.


    als die Tabelle komplett neu zu berechnen. Eine kleine Arbeitserleichterung gibt
    es aber doch: Wenn Sie lediglich eine einzige Formel neu berechnen wollen, genügt
    es, einmal "F2" und dann "Return" zu drücken.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_30_0.png)


    2 Sie können auch den Zeitpunkt der Neuberechnung selbst bestimmen, indem Sie
    die Taste "F9" betätigen.


    3 In einigen Fällen wäre es allerdings wünschenswert, zumindest einen Teil der
    →Formeln in einer Tabelle zu berechnen, da Sie vielleicht eine Eingabe überprüfen
    wollen. Normalerweise bleibt Ihnen dann nichts anderes übrig,


    4 Mit einem Trick können Sie dennoch einen Bereich in Excel berechnen. In einer
    Tabelle, die auf "manuelle Neuberechnung" (siehe Schritt 1) eingestellt wurde,
    markieren Sie die Zellen, deren Formeln Sie aktualisieren wollen.


    5 Wählen Sie in der Menüleiste "Bearbeiten" und hier "Ersetzen" an.


    6 Geben Sie unter "Suchen nach" und "Ersetzen durch" jeweils ein Gleichheitszeichen
    ("=") ein.


    7 Klicken Sie jetzt auf "Alle Ersetzen", um alle Gleichheitszeichen durch sich
    selbst zu ersetzen. Dadurch ändern Sie zwar nicht die Zellinhalte, aber Sie erreichen,
    daß die Formeln im →markierten Bereich neu berechnet werden. Alle anderen Formeln
    bleiben unberücksichtigt, so daß Sie nicht auf die Berechnung der kompletten Tabelle
    warten müssen.


    # → Formeln


    Eine Formel ist eine ganz besondere Anweisung in Excel. Damit sagen Sie dem Programm,
    was es tun soll. Eine Funktion beginnt immer mit einem Gleichheitszeichen, danach
    folgen der Name der Funktion und schließlich die Werte, die bei der Funktion verwendet
    werden sollen. Beispiel: =SUMME(C2:C8) berechnet die Summe aller Werte aus den
    Zellen C2 bis C8.


    # → Namensbereich


    Sie können markierte Bereiche über das Menü "Einfügen" und dort mit den Funktionen
    "Namen/Festlegen" und "Namen/übernehmen" mit Namen versehen. Diese Namen können
    in Formeln und Funktionen für Berechnungen verwendet werden, sofern die bezeichneten
    Zellen berechenbare Inhalte aufweisen.


    # → Zwischenablage


    Die Zwischenablage oder auch Clipboard genannt, ist ein temporärer Speicher von
    Windows in einem Anwendungsprogramm wie z.B. Excel. Dort legt die Funktion "Kopieren"
    eines Anwendungsprogramms den zuvor markierten Text- oder Bildbereich ab, um ihn
    später per "Einfügen" an einer anderen Stelle oder in einem anderen Programm wieder
    zu nutzen.


    # → Markieren


    Sobald Sie Eingaben in einer Zelle später verändern möchten, müssen Sie zuerst
    diese Zelle markieren. Dazu bewegen Sie den Mauszeiger auf die Zelle und betätigen
    dann die linke Maustaste. Die Zelle erscheint schwarz hinterlegt. Nun können Sie
    Veränderungen vornehmen. Diese beziehen sich dann nur auf den gerade markierten
    Raum


    # Bilder ausblenden und Verbindungen lösen


    1 Mit den Funktionen von Excel können Sie einem Tabellenblatt oder Diagramm Linien,
    Pfeile, Rechtecke, Bögen oder Vielecke hinzufügen. Auch Freihandfiguren sind möglich.
    Dazu benötigen Sie die "Zeichnen"-Symbolleiste. Diese finden Sie in der Menüleiste
    unter "Ansicht", "Symbolleisten" und "Zeichnen". Klicken Sie auf "Zeichnen" und
    die Leiste mit allen Werkzeugen wird dann am unteren Bildschirmrand eingeblendet.
    Nun klicken Sie die Werkzeuge und Formen an, die Sie für Ihre Gestaltung benötigen.


    2 Haben Sie nun bereits einige Formen und Bilder gezeichnet, dann kann der Bildschirm
    schon einmal etwas unübersichtlich werden. Außerdem dauert der Aufbau des Tabellenblattes
    und jeder neuen Zeichnung verhältnismäßig lange. Diese Zeit können Sie sich mit
    einem kleinen Trick sparen.


    3 Wählen Sie in der Menüleiste "Extras" "Optionen" und hier dann die Registerkarte
    "An-


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_30_1.png)


    sicht" an. Aktivieren Sie im neuen Auswahlmenü nun das Kontrollkästchen "Alle
    ausblenden".


    4 Eine Grafik ist normalerweise mit den Zellen verbunden, die unter der Zeichnung
    liegen. Diese automatische Verbindung kann zum Nachteil werden, wenn sich die
    Größe der Basiszellen verändert. Um das zu verhindern, markieren Sie das Grafikobjekt,
    das frei von Zellgrößen angeordnet werden soll.


    5 Wählen Sie das Menü "Format" und dort "AutoForm..." aus. Hier aktivieren Sie
    die "Eigenschaften". Klicken Sie das Kontrollkästchen "Von Zellposition und Größe
    unabhängig" an. Es muß aktiv sein, d.h. ein schwarzer Punkt muß darin erscheinen.'
  merge: -1
  img_proc: true
- pgno: 31
  md: '# Kommentare wiederfinden


    Sie haben irgendwo in Ihrer Excel-Tabelle Kommentare versteckt. Diese finden Sie
    nicht mehr. Die lange Suche nach den verschwundenen Notizen können Sie sich sparen.
    Denn es gibt einen Trick, mit dem Sie sich die Sache erleichtern können. Verwenden
    Sie die Funktion "Gehe zu". Aber Vorsicht! Markieren Sie nur eine Zelle, um die
    gesamte Tabelle zu durchsuchen. Wenn Sie mehrere Zellen markieren, wird nur in
    diesen Zellen, statt in der gesamten Tabelle gesucht. Wählen Sie nun in der Menüleiste
    "Bearbeiten" und "Gehe zu". Hier klicken Sie auf die Schaltfläche "Inhalte". Wählen
    Sie das Optionsfeld "Kommentare", wenn die Zellen markiert werden sollen, denen
    eine Notiz zugeordnet ist. Auf die gleiche Weise können Sie andere Inhalte markieren.
    Wählen Sie dazu die gewünschten Optionen aus.


    # Markieren bestimmter Zellbereiche


    1 Sind Zellbereiche durch Namen oder Zellbezüge erkennbar, können diese sehr schnell
    und effektiv markiert werden. Betätigen Sie die "F5"-Taste auf Ihrer Tastatur.
    Nun erscheint das "Gehe zu"-Menü. Hier sehen Sie eine Liste von Zellbereichen,
    die markiert angezeigt werden können. Klicken Sie die Auswahlmöglichkeit an, die
    Sie benötigen.


    blatt. Diesen können Sie mit einem einfachen Mausklick aktivieren und sich eine
    Option Ihrer Wahl markieren lassen.


    2 Noch schneller können Sie über den →Namensbereich auf die Markierung zugreifen.
    Diesen finden Sie normalerweise oben links über dem Tabellenblatt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_31_0.png)


    3 Wollen Sie zwei oder mehr Bereiche markieren, so funktioniert das wie immer
    mit Hilfe der Strg-Taste. Diese halten Sie einfach während des Markierungsvorganges
    gedrückt. Somit können Sie beliebig viele Zellen auswählen.


    4 Wollen Sie Zellen außerhalb eines benannten Bereiches markieren, dann wählen
    Sie "Bearbeiten" und hier "Gehe zu". Tragen Sie im Textfeld "Bezug" den Zellbezug
    für die zu markierende Zelle oder den gewünschten Zellbereich ein.


    # Symbole aus Grafikanwendungen verwenden


    1 Sie können innerhalb von Excel über die Funktion "Ansicht", "→Symbolleisten"
    und "Anpassen" eigene Leisten zusammenstellen und auch neue Symbole verwenden.
    Doch Excel bietet auch die Möglichkeit, andere Symbole – etwa aus Grafikanwendungen
    wie Corel Draw – in seine Leisten einzubinden.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_31_1.png)


    2 Starten Sie die Grafikanwendung und kopieren Sie das zu übernehmende Symbol
    in die →Zwischenablage. Das Kopieren erfolgt normalerweise mit Hilfe des Shortcuts
    "Strg+C".


    5 Öffnen Sie mit einem Klick auf die rechte Maustaste das Kontextmenü und aktivieren
    Sie dort die Option "Schaltflächensymbol einfügen". Das Symbol wird →importiert.


    3 Öffnen Sie Excel (oder aktivieren Sie es per Klick in die Taskleiste).


    6 Um Verzerrungen oder unscharfe Darstellungen auszuschließen, übernehmen Sie
    bei der Kopie möglichst nur Symbole in derselben Größe wie das bereits integrierte
    Schaltflächensymbol. Für ein kleines Symbol ist das gängige Maß 16x15, für eine
    große Schaltfläche 24x23.


    4 Wählen Sie "Ansicht", "Symbolleisten" und "Anpassen"und dort die Registerkarte
    "Befehle". Markieren Sie hier dann mit dem Mauszeiger das Symbol, das Sie ändern
    möchten.


    # → Symbolleiste


    Die meisten Programme für Windows arbeiten mit diesen optischen Befehlsleisten.
    Meist sind hier alle Befehle der Menüleiste zu finden. Über das Menü "Ansicht"
    und "Symbolleisten" können Sie in Excel alle möglichen Symbole anzeigen lassen.
    Doch auch individuelle Zusammenstellungen lässt das Programm zu. Bleiben Sie mit
    dem Mauszeiger einen Moment auf dem Symbol, wird eine Legende eingeblendet, die
    die Funktion näher erläutert.


    # Ändern der Bezugsart


    1 In Excel-Tabellen ist jede Zelle genau definiert. Und zwar durch die Längskoordinaten
    von A, B,C etc. und durch die vertikalen Koordinaten 1,2,3,... etc. Diese Art
    der Benennung können Sie aber auch ändern. Sie bekommen dann statt der horizontalen
    Buchstabenreihe auch Zahlen geliefert.


    mein" und dann auf "Bezugsart". Aktivieren Sie nun das Optionsfeld für die Z1S1-Bezugsart.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_31_2.png)


    2 Wählen Sie dafür "Extras" und "Optionen". Klicken Sie hier auf die Registerkarte
    "Allgemein"


    3 Das Ganze können Sie rückgängig machen, indem Sie einfach das Kästchen Z1S1
    wieder deaktivieren.


    # → Standardmappe


    Mit diesem "Grundlayout" startet Excel jedesmal. Individuelle Einstellungen müssen
    Sie manuell vornehmen.'
  merge: -1
  img_proc: true
- pgno: 32
  md: '# Hyperlink


    Hyperlinks sind eigentlich eine Technik, die aus dem Internet kommt. Damit werden
    mehrere Dokumente auf einem oder verschiedenen Rechnern verknüpft. Wenn Sie den
    Hyperlink anklicken, springen Sie zu einem anderen Dokument. Dabei können die
    Dokumente an ganz unterschiedlichen Stellen gespeichert sein. Hyperlinks gibt
    es aber inzwischen auch in Textverarbeitungen und Tabellenkalkulationen. Meist
    fallen die Hyperlinks durch einen speziell formatierten Bereich im Text auf. Sie
    sind farbig unterstrichen oder durch grafische Elemente zum Anklicken gekennzeichnet.
    In Texten oder Tabellen können Sie auch als Sprungbrett zu anderen Texten oder
    Tabellen dienen.


    # Clever gelinkt


    Hyperlinks müssen nicht unbedingt ins Internet führen: Mit wenig Aufwand können
    Sie sie auch zum schnellen Navigieren innerhalb einer Arbeitsmappe einsetzen.


    +   1 Wählen Sie in der Menüleiste "Einfügen", "Namen" und "Festlegen", um jedem
    Bereich, den Sie per Hyperlink erreichen wollen, einen Namen zuzuweisen. Geben
    Sie einen Namen ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_32_0.png)


    +   2 Klicken Sie auf die Zelle, in der der Hyperlink erscheinen soll und geben
    Sie den Text ein; zum Beispiel: "Umsatzplanung". Wählen Sie "Einfügen" und "Hyperlink".
    Das erste Eingabefeld in der Dialogbox kann leer bleiben, weil sich der Hyperlink
    auf die aktuelle Datei bezieht.


    Klicken Sie auf den Befehl "Durchsuchen", neben dem unteren Eingabefeld.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_32_1.png)


    +   3 Befindet sich das Ziel des Links auf einem anderen Tabellenblatt in Excel,
    markieren Sie den entsprechenden Eintrag im Feld. Aktivieren Sie die Option "Festgelegter
    Name". Anstelle der Blattnamen der aktuellen Mappe werden nun alle verfügbaren
    Namen angezeigt. Markieren Sie das gewünschte Ziel und bestätigen Sie Ihre Auswahl
    mit "OK".


    +   4 Der Inhalt der aktuellen Zelle wird blau unterstrichen. Sobald Sie die Zelle
    anklicken, springt Excel automatisch zu dem zuvor festgelegten Bereich.


    # Diagramme


    Das sind Schaubilder, mit denen Tabellen grafisch umgesetzt werden. Es gibt verschiedene
    Arten von Diagrammen: Balkendiagramme, Kreisdiagramme, Liniendiagramme und viele
    mehr. Jede Art eignet sich für eine bestimmte Tabelle. Bei einer Hochrechnung
    zur Wahl wird meist ein Kreisdiagramm verwendet. Wenn es mehrere Variablen gibt,
    bieten sich Balken- oder Liniendiagramme an. Eine große Auswahl vorformatierter
    Diagramme sind in Excel bereits integriert.


    # Fehlerwerte anzeigen


    Nicht immer fallen Fehlerwerte in Excel auch wirklich auf. Es ist mühsam, alle
    Zellen zu finden, in denen Fehler aufgetreten sind. Um sich diese Sisyphusarbeit
    zu ersparen, machen Sie folgendes:


    +   1 Aktivieren Sie die Tabelle, die Sie auf Fehler überprüfen wollen, aktivieren
    Sie "Bearbeiten" und dort "Gehe zu". Klicken Sie hier auf "Inhalte".


    +   2 Markieren Sie hier "Formeln". Die verschiedenen Kontrollkästchen legen fest,
    was markiert werden soll. Deaktivieren Sie alle Kästchen, bis auf die "Fehlerwerte"
    und verlassen Sie die Dialogbox mit "OK".


    chen, bis auf die "Fehlerwerte" und verlassen Sie die Dialogbox mit "OK".


    +   3 Alle Fehlerwerte, die in der aktuellen Tabelle vorkommen, werden markiert.


    +   4 Rufen Sie "Format" und "Zellen" auf, um die fehlerhaften Zellen durch eine
    auffällige Formatierung zu kennzeichnen. Jetzt haben Sie den Überblick.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_32_2.png)


    # Symbolleiste


    Hier sind die meist verwendeten Befehle der Menüleiste noch einmal als Schaltfläche
    dargestellt. Symbolleisten können über das "Ansicht"-Menü ausgewählt werden. Hier
    sind bestimmte Funktionen bereits gegliedert. In der Format-Symbolleiste sind
    so zum Beispiel die Befehle zum Fett druck, zur Schriftgröße, zum Zentrieren etc.
    enthalten. Die Symbolleiste erleichtern das Arbeiten, da sie Befehle schnell ausführen.


    # Diagramme schnell erreichen


    Meist werden in Excel keine separaten Diagramme verwendet, sondern die Diagramme
    werden gleich in eine Tabelle eingebettet. Man kann sie positionieren und in der
    Größe verändern. Haben Sie mehrere Diagramme eingefügt, kann es schwierig werden,
    genau die gewünschte Grafik auszuwählen. Man kann zwar jedem Diagramm einen Namen
    geben, aber es fehlt eine Funktion, diese gezielt auszuwählen. Besser wird es
    mit diesem Trick:


    +   1 Wählen Sie in der Menüleiste "Bearbeiten" und "Gehe zu".


    +   2 Klicken Sie hier auf "Inhalte". Aktivieren Sie die Option "Objekte" und
    bestätigen Sie mit "OK". Excel markiert nun sämtliche Objekte der Tabelle.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_32_3.png)


    +   3 Mit "Tab" und "Umschalt +Tab" wählen Sie jeweils das nächste bzw. vorhergehende
    Objekt an, so daß Sie innerhalb von wenigen Sekunden das gesuchte Diagramm ausfindig
    machen können. Danach klicken Sie auf eine beliebige Zelle, um die Markierung
    aufzuheben.'
  merge: -1
  img_proc: true
