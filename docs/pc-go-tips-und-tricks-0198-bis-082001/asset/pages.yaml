- pgno: 39
  md: '# Excel


    # Die RMZ-Funktion


    Die RMZ (regelmäßige Zahlung)-Funktion zeigt, daß nicht einfach immer nur Werte
    eingegeben werden können, sondern daß es auf eine Vielzahl diverser →Argumente
    ankommt. Dabei fällt es dem Laien aber oft schwer, sich immer an die Art der Argumente
    zu erinnern. Hier kann die Option "Funktion einfügen" helfen.


    1 Geben Sie eine Datenliste ein, wie sie unsere Abbildung zeigt.


    |  | A | B |

    |---|---|---|

    |1|Kredit|35000|

    |2|Zinsrate|6%|

    |3|Periode|36|


    2 Wählen Sie in der Menüleiste "Einfügen" und hier "Funktion".


    3 Wählen Sie links die Option "Finanzmathematik" und klicken Sie auf der rechten
    Seite auf die Funktion "RMZ".


    4 Bestätigen Sie mit "OK". Sie benötigen jetzt noch die Argumente für den Zinssatz,
    die Anzahl der Raten und den Kreditbetrag. Im Textfeld "Zins" klicken Sie auf
    die Zinsrate in Zelle B2. Teilen Sie diese durch 12, also: "B2/12".


    5 Klicken Sie auf "ZZR". Hier wählen Sie die Zelle B3 aus.


    6 Klicken Sie nun auf "Bw". Klicken Sie dann auf B1, um den Kreditbetrag einzugeben
    und bestätigen Sie mit "Ende".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_39_0.png)


    7 Die monatliche Rate wird in Rot angezeigt, da Sie ja bezahlen müssen. Wollen
    Sie das nicht, dann doppelklicken Sie auf die Zahlung in Zelle D9 und setzen Sie
    vor die Funktion ein Minuszeichen.


    8 Drücken Sie auf die Funktionstaste "F2" auf Ihrer Tastatur, können Sie die Formel
    immer wieder in der Bearbeitungsleiste überarbeiten.


    # Clip-Arts in Diagrammen verwenden


    Sie können Grafiken beliebig in ein Diagramm kopieren und diese dann als Balkeneinheiten
    verwenden.


    1 Öffnen Sie Excel und klicken Sie auf ein bereits von Ihnen erstelltes Diagramm.


    2 Ändern Sie den Diagrammtyp in eine Säulengrafik. Dazu klicken Sie einmal mit
    der rechten Maustaste und wählen aus dem Kontextmenü "Diagrammtyp".


    3 Nun klicken Sie mit der Maus auf einen der Balken und markieren diesen.


    4 Wählen Sie nun in der Menüleiste "Grafik" und hier "Aus Datei". Suchen Sie sich
    die Datei her, in der die Grafik gespeichert wurde.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_39_1.png)


    5 Suchen Sie sich eine Ihrer Grafiken aus und klicken Sie auf "Einfügen". Diese
    Grafik wird nun in die Balken des Diagramms eingefügt. Natürlich können Sie die
    Grafik auch in das Diagramm einfügen. Dazu markieren Sie die gesamte Diagrammfläche
    und verfahren dann wie gerade beschrieben.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_39_2.png)


    6 Wollen Sie die Formatierung ändern, klicken Sie mit der rechten Maustaste auf
    einen der Balken und wählen Sie "Datenreihen formatieren".


    7 Wählen Sie im Dialogfeld unter "Muster" die Option "Ausfüllen". Aktivieren Sie
    das Kästchen "Stapel" im Dialogfenster zu den Fülleffekten. Bestätigen Sie zweimal
    mit "OK".


    # TIP Seitenanzahl selbst definieren


    Sie können eine Tabelle beim Drucken auf beliebig viele Seiten verteilen. Wählen
    Sie dazu das Dialogfenster "Seite einrichten" im Menü "Datei". Hier geben Sie
    dann die gewünschte Seitenzahl an. Nun können Sie die Schrift beliebig vergrößern
    oder verkleinern.


    # TIP Nur ein paar Gitternetzlinien


    Wollen Sie nur ein paar Zellen die Linien ausgedruckt, dann dürfen Sie die Option
    "Gitternetzlinien" nicht verwenden. Statt dessen müssen Sie zunächst den Zellbereich
    markieren, der von Linien umrandet werden soll. Wählen Sie dann "Format" und "Zellen".
    Klicken Sie auf die Registerkarte "Rahmen". Wählen Sie aus, wo Sie die Linien
    haben möchten und wählen Sie einen Stil aus. Klicken Sie auf "OK". Nun werden
    nur für diesen Bereich die Gitternetzlinien ausgedruckt.


    # 100 Euro Fonts


    Der PC hat mit dem Euro seine liebe Not. Viele Schriftarten unterstützen das Euro-Zeichen
    nicht, viele Drucker bzw. deren Treiber sind ebenfalls echte Euro-Gegner. Von
    der Firma Greenstreet gibt es jetzt eine Komplettlösung für Euro-Schriftarten
    – und das für nur fünf Mark. Integriert ist ein FontManager, mit dem Sie die neuen
    Schriftarten ansehen, hinzufügen und löschen können. Bei allen Schriftarten ist
    das Euro-Zeichen integriert. Darüber sind einige sehr schöne Schriften in guter
    Qualität. Zusätzlich gibt es ein Tool zum Suchen und Einsetzen tastaturfremder
    Sonderzeichen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_39_3.png)


    INFO KochMedia Tel. (0 89) 8 57 95 - 120 Preis: 5 Mark


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_39_4.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_39_5.png)'
