    # TIPP Mappen automatisch öffnen


    Standardmäßig wird Excel mit einer leeren Arbeitsmappe geöffnet. Wenn Sie wollen,
    dass Excel automatisch mit einer oder mehreren Arbeitsmappen startet, so müssen
    Sie diese in einem speziellen Ordner ablegen. Dieser Ordner wird bei der Programminstallation
    automatisch angelegt und besitzt die Bezeichnung „XLSSTART“. Der Ordner wird auch
    als „Startordner“ bezeichnet und bei der Standardinstallation von Office in dem
    Pfad „Programme/Microsoft Office/Office/“ gelegt. Alle Arbeitsmappen, die Sie
    in diesem Ordner speichern, stehen Ihnen beim Start von Excel automatisch zur
    Verfügung. Um die aktuelle Arbeitsmappe in dem Startorder zu speichern, wählen
    Sie den Menübefehl „Datei“ und im Untermenü den Befehl „Speichern unter“. Im jetzt
    eingeblendeten Dialogfenster „Speichern unter“ wählen Sie den Startordner „XLSSTART“
    aus und speichern Ihre Arbeitsmappe dort. Wenn Ihre in diesem Ordner hinterlegten
    Arbeitsmappen nicht mehr automatisch geöffnet werden sollen, so verschieben Sie
    diese in Ihren Standardordner, zum Beispiel „Eigene Dateien“ zurück.


