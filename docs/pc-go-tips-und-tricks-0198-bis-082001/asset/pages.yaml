- pgno: 83
  md: '# Excel


    # TIPP Mehr Zeilen in einer Zelle


    Viele schreiben Texte in Excel-Tabellen einzeilig. Das kann aber zu einer großen
    Spaltenbreite führen. Das muss aber nicht sein, denn eine Excel-Zelle kann bis
    zu 65.535 Zeichen enthalten, die sich über mehrere Zeilen erstrecken.

    Um einen Zeilenwechsel innerhalb einer Zelle zu erhalten, betätigen Sie an der
    Stelle, an der Sie einen Zeilenumbruch wünschen, die Tastenkombination „Alt +
    Enter“. Daraufhin fügt Excel an der Position der Eingemarke einen Zeilenumbruch
    in den Text ein. Anschließend passt Excel die Zeilenhöhe automatisch so an, dass
    alle Zeilen sichtbar sind.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_83_0.png)


    # INFO Kommentare übertragen


    Sie können für Zellen Kommentare erstellen, indem Sie die entsprechende Zelle
    anklicken und aus dem Menü „Einfügen“ den Befehl „Kommentar“ wählen. Excel blendet
    daraufhin ein Kommentarfenster ein. Haben Sie einmal einen Kommentar für eine
    Zelle eingegeben, so können Sie diesen auch auf andere, gleichartige Zellen übertragen.

    Dazu markieren Sie die kommentierte Zelle und klicken auf das Symbol „Kopieren“.
    Markieren Sie die gewünschten Zellen, und wählen Sie „Bearbeiten“ und „Inhalte
    einfügen“. Aktivieren Sie die Option „Kommentare“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_83_1.png)


    1 Ein Beispiel: Sie möchten Ihre Einnahmen mit den Ausgaben vergleichen. Erstellen
    Sie dazu eine Spalte mit den Einnahmen und eine weitere Spalte mit den Ausgaben.


    2 Markieren Sie die Spalte mit den Einnahmen. Rufen Sie aus dem Menü „Einfügen“
    den Befehl „Namen“ und im folgenden Untermenü den Befehl „Festlegen“ auf.


    3 Wenn Sie in der ersten Zelle einen Namen eingetippt haben, wird dieser als Vorschlag
    übernommen. Sie können den Namen akzeptieren oder überschreiben.


    Enthält die erste Zelle keinen Namen, tippen Sie hier den gewünschten Namen, praktischweise
    „Einnahmen“, ein. Wählen Sie anschließend „Hinzufügen“. Mit einem Klick auf „OK“
    übernehmen Sie den markierten Bereich als „Name“.


    4 Markieren Sie die Spalte der Ausgaben, und weisen Sie ihr entsprechend den Bereichsnamen
    „Ausgaben“ zu. Jetzt können Sie in der Spalte „Ergebnisse“ direkt die Formel „=Einnahmen
    - Ausgaben“ eingeben, ohne Kenntnisse von den Zellbezügen zu benötigen.


    # Diagrammtitel mit Zellen verbinden


    In Excel können Sie Textfelder innerhalb von Diagrammen verändern. Weniger bekannt,
    aber gleichwohl effektiv ist die Möglichkeit, diese Textfelder mit Excel-Zellen
    zu verbinden. Dann erscheint der Inhalt dieser Zellen in den Textfeldern. Der
    Clou dabei: Verändern Sie etwas in einer verbundenen Zelle, macht der Inhalt des
    Textfelds dies mit. So müssen Sie Eingaben nicht mehrmals vornehmen.


    1 Erstellen Sie in Excel ein beliebiges Diagramm, und geben Sie einen Titel ein.
    Stellen Sie das Diagramm fertig.


    2 Jetzt wollen Sie erreichen, dass der Diagrammtitel abhängig vom Inhalt einer
    Zelle erscheint.


    Tippen Sie zum Beispiel in die Zelle „H1“ den Text „Ich bin verbunden!“ ein.


    3 Klicken Sie jetzt innerhalb des Diagramms auf das Textfeld des Titels. Wenn
    das Textfeld aktiviert ist, geben Sie ein Gleichheitszeichen (=) ein, danach klicken
    Sie auf die Zelle, deren Inhalt als Text in das Textfeld des Diagramms übernommen
    werden soll, also auf „H1“. Die komplette Eingabe lautet im Beispiel „=H1“.


    4 Drücken Sie auf die „Enter“-Taste. Als Ergebnis zeigt Excel im Textfeld jetzt
    den Inhalt der Zelle „H1“ an. Verändern Sie nun den Wert in der Zelle „H1“, so
    passt sich der Diagrammtitel automatisch an.


    # Trends schnell anzeigen


    Trendfunktionen berechnen auf der Grundlage von Vergangenheitswerten Zahlen, die
    mutmaßlich in der Zukunft gelten. Dabei werden die bekannten Werte analysiert
    und durch eine Formel fortgeschrieben. Oftmals lassen sich bei Zeitreihen drei
    Komponenten erkennen, die sich allerdings auch überlagern können:


    +   * Trendanalyse

    +   * Konjunktur und Saisonalanalyse

    +   * Zufallsanalyse


    Ein linear ansteigender Trend geht von einem stetig wachsenden Markt aus. Dieser
    Trend wird in der Praxis am häufigsten verwendet, da er einfach zu erstellen ist.
    Zudem lässt sich der geplante Wert leicht durch eine Verlängerung der Trendgeraden
    bestimmen. In Excel gibt es einen schnellen Weg, um eine Trendanalyse durchzuführen.


    1 Markieren Sie den Bereich, der die Grundlage für Ihre Trendanalyse bilden soll.
    Dann gehen Sie mit dem Cursor an den rechten unteren Anfaser der Markierung, als
    wenn Sie kopieren wollten.


    2 Klicken Sie auf die rechte Maustaste. Halten Sie diese gedrückt, und ziehen
    Sie sie so weit, wie Sie Trenddaten benötigen.


    3 Lassen Sie die rechte Maustaste los, blendet Excel ein Kontextmenü ein, aus
    dem Sie die Werte für „Arithmetischer Trend“ oder „Wachstumstrend“ auswählen können.
    In dem markierten Bereich werden die Trendwerte errechnet.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_83_2.png)'
  merge: -1
  img_proc: true
- pgno: 84
  md: '![](img/5f36a0372e5f0f300d0bad16e6a18053_84_0.png)


    # Excel-Daten für das Internet


    Sie können einzelne Arbeitsblätter Ihrer Excel-Dateien für das Internet aufbereiten.
    Dabei wandelt Excel Ihr Arbeitsblatt in die Internet-Sprache HTML um. HTML steht
    für „Hypertext Markup Language“: Das ist die Sprache für Webseiten. Sie brauchen
    von dieser Sprache nichts zu verstehen, ein Assistent hilft Ihnen bei der Seitengestaltung
    und „übersetzt“ Ihre Wünsche in die richtige Sprache.


    „Datei“. Der Internet-Assistent öffnet sich und schlägt die zu konvertierenden
    Bereiche und Diagramme vor. Über die Schaltfläche „Hinzufügen“ legen Sie weitere
    Bereiche für Ihre Webseite fest, mit „Löschen“ nehmen Sie überflüssige Bereiche
    aus der Konvertierung heraus.


    1 Aktivieren Sie das Arbeitsblatt, das Sie im Internet veröffentlichen möchten.
    Wählen Sie den Menübefehl „Als HTML speichern“ im Menü


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_84_1.png)


    2 Mit einem Klick auf „Weiter“ erscheint der zweite Schritt des Internet-Assistenten.
    Wenn Sie sich mit der Erstellung von Webseiten noch nicht auskennen, wählen Sie
    in diesem Dialogfenster die Option „Erstelle ein unabhängiges, sofort anschau­bares
    HTML-Dokument mit formatierbarem Text...“. Sind Sie bereits ein ausgereifter HTML-Profi,
    können Sie auch die zweite Option „Konvertierte Daten in bestehendes HTML-Dokument
    übernehmen...“ auswählen.


    3 Nach einem Klick auf „Weiter“ vergeben Sie einen Titel für Ihre Webseite. Dann
    legen Sie eine Kopfzeile, Trennlinien, das letzte Aktualisierungsdatum, den Autoren
    und eine E-Mail-Adresse fest.


    4 Als letzten Schritt legen Sie einen Dateinamen fest. Achten Sie darauf, dass
    Sie als Dateendung „htm“ verwenden. Sie können sich Ihr Excel-Internet-Dokument
    jetzt im Browser ansehen. Dazu laden Sie die Seite mit der Endung „htm“.


    # Firmenlogo auf allen Seiten platzieren


    Beim Ausdruck von Arbeitsblättern ist es vorteilhaft, wenn Ihr Firmenlogo auf
    jeder Seite erscheint. Besteht Ihr Firmenlogo ausschließlich aus Text, können
    Sie das Logo einfach in die Kopfzeile einfügen. Das funktioniert aber nicht bei
    grafischen Logos, hier müssen Sie einen Trick anwenden.


    1 Fügen Sie das Firmenlogo in die Zelle „A1“ ein. Dazu klicken Sie auf den Menübefehl
    „Einfügen“ und bewegen im Untermenü den Maus­cursor auf den Befehl „Grafik“. Benutzen
    Sie den Befehl „Aus Datei“, und wählen Sie die Datei mit Ihrem Firmenlogo aus.
    Mit einem Klick auf „OK“ übernehmen Sie es in die Zelle „A1“ Ihres Arbeitsblatts.


    2 Wählen Sie den Befehl „Seite einrichten“ im Menü „Datei“. Das Dialogfenster
    „Seite einrichten“ erscheint. Aktivieren Sie hier das Register „Tabelle“.


    3 Im Bereich „Drucktitel“ finden Sie das Eingabefeld „Wiederholungszeilen“. Tippen
    Sie hier die Zeichenfolge „$1:$1“ ein. Excel deklariert dadurch diese Zeile als
    Wiederholungszeile. Diese Zeile wird also mitsamt ihres Inhalts auf allen Seiten
    ausgedruckt. Mit einem Klick auf die Schaltfläche „OK“ übernimmt Excel die Einstellungen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_84_2.png)


    # TIPP Datei als Mail versenden


    Excel-Dateien lassen sich einfach als Datei­anhang in E-Mails versenden. Dabei
    brauchen Sie nicht erst Ihr Mail-Programm zu öffnen und dann manuell Ihre Excel-Datei
    an eine Mail zu hängen. Viel eleganter geht der Mail-Versand direkt aus Excel
    heraus. Klicken Sie dazu auf den Menübefehl „Datei“, und ziehen Sie im Untermenü
    den Maus­cursor auf den Eintrag „Senden an“. Daraufhin öffnet sich ein weiteres
    Untermenü, in dem Sie den Befehl „E-Mail Empfänger“ wählen. Das E-Mail-Programm
    startet und öffnet eine neue E-Mail, die Ihre Excel-Datei automatisch als Anhang
    enthält. Sie wählen lediglich noch den Empfänger aus, und ab geht die Excel-Post.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_84_3.png)


    # TIPP Excel-Dateien direkt drucken


    Wenn es besonders schnell gehen soll, brauchen Sie nicht „Excel“ zu starten, um
    eine Excel-Datei auszudrucken zu können. Auf die Schnelle geht es auch so: Markieren
    Sie im Explorer die gewünschte Excel-Datei, und klicken Sie mit der rechten Maustaste
    darauf. Im Kontextmenü wählen Sie „Drucken“ – fertig.'
  merge: -1
  img_proc: true
- pgno: 85
  md: '# TIPP Eingaben rückgängig machen


    Bei der Arbeit mit Excel können Sie sich leicht vertippen. Das ist aber kein Problem,
    wenn Sie es rechtzeitig merken. Denn Sie können Ihre Eingabe bei Bedarf wieder
    rückgängig machen – und das sogar über mehrere Stufen hinweg. Wenn Sie während
    der Eingabe bereits einen Fehler bemerken, betätigen Sie die „Esc“-Taste. Excel
    nimmt dann Ihre Eingabe zurück, und Sie können noch einmal mit der Eingabe beginnen.
    Ist die Eingabe bereits abgeschlossen, klicken Sie auf das Symbol „Rückgängig“
    in der Symbolleiste. Schon ist die fehlerhafte Eingabe beseitigt. Haben Sie mehrere
    Fehler hintereinander gemacht, klicken Sie so oft auf das „Rückgängig“-Symbol,
    bis alle Fehler beseitigt sind. Falls Sie einmal zu oft vom „Rückgängig“-Befehl
    Gebrauch gemacht haben, ist das nicht tragisch: Mit Hilfe des Symbols „Wiederholen“
    erwecken Sie die letzten korrekten Eingaben wieder zum Leben.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_85_0.png)


    # INFO Mehrere Befehle rückgängig


    Um festzustellen, welche Befehle Sie rückgängig machen oder wiederherstellen können,
    klicken Sie auf den kleinen Auswahlpfeil neben den Symbolen „Rückgängig“ oder
    „Wiederholen“. Die Auswahlliste listet daraufhin alle „gemerkten“ Befehle auf.
    Sie können in dieser Auswahlliste auch mehrere Befehle auf einmal auswählen. Diese
    werden dann alle auf einmal rückgängig gemacht oder wiederhergestellt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_85_1.png)


    # Arbeitserleichterung mit der Auswahlliste


    Die Eingabe von langen Listen in Excel ist lästig. Vor allen Dingen, wenn sich
    Eintragungen oft wiederholen. Mit einem kleinen Trick können Sie sich die Arbeit
    aber erleichtern und zudem bei komplizierten Wörtern Schreibfehler vermeiden.
    Excel hält dazu eine besondere Funktion für Sie bereit: die Auswahlliste.


    sich ein Kontextmenü. Hier wählen Sie den Befehl „Auswahlliste“ aus.


    1 Öffnen Sie ein Arbeitsblatt mit einer Liste, oder tippen Sie eine neue Liste
    in Excel ein. Möchten Sie bei der Bearbeitung der Liste einen Eintrag wiederholen,
    klicken Sie mit der rechten Maustaste auf die Zelle, die Sie füllen wollen. Es
    öffnet


    2 Daraufhin zeigt Excel unterhalb der Zelle eine Auswahlliste, die alphabetisch
    geordnet alle in dieser Spalte gemachten Eintragungen enthält. Wählen Sie aus
    dieser Auswahlliste per Mausklick den gewünschten Eintrag. Diesen Eintrag fügt
    Excel dann in die aktivierte Zelle ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_85_2.png)


    # Textteile aus Zellen extrahieren


    Wenn Sie Textteile trennen möchten, benutzen Sie die Excel-Funktion „Links“ oder
    „Rechts“. Diese Funktion ist in vielen Fällen sehr hilfreich.


    links aus gerechnet aus dem Feld extrahiert werden soll.


    1 Wählen Sie eine freie Zelle aus. Um den linken Teil eines Textes auszuschneiden,
    geben Sie in die Zelle „=LINKS“ ein, und öffnen eine Klammer „(“.


    2 Klicken Sie auf das Feld, aus dem Sie einen Textteil extrahieren wollen. Excel
    trägt daraufhin die Koordinate automatisch hinter der Klammer ein. Tippen Sie
    nun ein Semikolon ein und dahinter die Anzahl von Zeichen, die von


    3 Schließen Sie die Klammer „)“, und klicken Sie auf die „Enter“-Taste. Das Ergebnis
    wird in der Zelle dargestellt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_85_3.png)


    4 Sie können auch Textteile von rechts aus gezählt aus einem Eintrag herausfiltern.
    Die Funktion dazu lautet „=RECHTS(Bezug;Anzahl Zeichen)“.


    # Diagramme nachträglich umwandeln


    Standardmäßig bettet Excel seine Diagramme in die jeweiligen Tabellenblätter ein.
    Um Diagramme zu bearbeiten und darzustellen, ist es oft vorteilhaft, die Diagramme
    auf einem separaten Blatt darzustellen. Hierzu bietet Excel eine einfache Möglichkeit,
    um das Diagramm umzuwandeln.


    1 Markieren Sie das im Tabellenblatt eingebettete Diagramm, und klicken Sie mit
    der rechten Maustaste darauf. Im Kontextmenü wählen Sie den Befehl „Plazieren“
    aus. Das Dialogfenster „Plazieren“ erscheint.


    2 Aktivieren Sie das Options­kästchen „Neues Blatt“, und vergeben Sie einen Namen
    für das neue Diagrammblatt. Mit einem Klick auf „OK“ wird das Diagramm aus dem
    Tabellenblatt herausgelöst und im eigenen Diagrammblatt dargestellt.


    3 Wollen Sie das Diagramm nach dem Bearbeiten wieder in das ursprüngliche Tabellenblatt
    einbetten, klicken Sie mit der rechten Maustaste in das Diagramm im Diagrammblatt.
    Wählen Sie dann aus dem Kontextmenü den Eintrag „Plazieren“. Nun klicken Sie auf
    die Option „als Objekt in“ und wählen den gewünschten Tabellennamen. Schon stellt
    Excel das Diagramm im ausgewählten Arbeitsblatt dar.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_85_4.png)


    Peter Schnoor/pm'
  merge: -1
  img_proc: true
- pgno: 86
  md: '![](img/5f36a0372e5f0f300d0bad16e6a18053_86_0.png)


    # TIPP Standardschrift neu festlegen


    Sie wollen die Standardschriftart in Excel auf Ihre persönliche Schriftart ändern,
    zum Beispiel von „Times New Roman“ in „Arial“? Für jede Tabelle die Schriftart
    neu einzustellen, ist zu aufwändig. Legen Sie die Schriftart daher für alle neuen
    Tabellen dauerhaft fest. Wählen Sie dazu den Befehl „Optionen“ im Untermenü von
    „Extras“. Klicken Sie im Dialogfenster „Optionen“ auf das Register „Allgemein“.
    Im unteren Bereich befindet sich das Auswahlfeld für die „Standard-schriftart“.
    Klicken Sie auf den Auswahlpfeil dieses Feldes, und suchen Sie die Schriftart
    Ihrer Wahl aus. Schließen Sie das Fenster mit „OK“. Damit die neue Schriftart
    in allen neuen Tabellen zum Einsatz kommt, schließen Sie Excel. Dazu bestätigen
    Sie den Befehl mit „OK“ und starten Excel neu. Ab sofort ist für alle neuen Tabellen
    die von Ihnen ausgewählte Schriftart aktiv.


    # TIPP Zeilen genau fixieren


    In längeren Tabellen ist es mühsam, Daten einzugeben, weil die Spaltenbeschriftungen
    bei Überschreiten der Bildschirmbreite nicht mehr sichtbar sind. Das vermeiden
    Sie mit der „Excel-Fixierung“. Markieren Sie dazu die Zeile unterhalb der Zeile
    mit den Spaltenbeschriftungen. Wählen Sie im Menü den Befehl „Fenster“ und im
    folgenden Untermenü den Eintrag „Fixieren“. Um die Fixierung wieder aufzuheben,
    klicken Sie auf den Menübefehl „Fenster“. Im Untermenü erscheint der Eintrag „Fixierung
    aufheben“. Durch einen Klick ist die Zeilenfixierung aufgehoben.


    # Nullen in der Anzeige unterdrücken


    In Kalkulationen wird oft gewünscht, Nullwerte nicht anzuzeigen. Dadurch werden
    Kalkulationsblätter übersichtlicher. Standardmäßig zeigt Excel Nullwerte aber
    stets an. Mit einem Trick überreden Sie Excel, Nullwerte zu unterdrücken.


    1 Markieren Sie den Zellbereich, der keine Nullwerte anzeigen soll, und klicken
    Sie im Menü auf den Befehl „Format“ und im Untermenü auf „Zellen“. Das Dialogfenster
    „Zellen“ wird geöffnet.


    2 Aktivieren Sie das Register „Zahlen“, und nehmen Sie aus dem Listenfeld „Kategorie“
    den Eintrag „Benutzerdefiniert“. Wählen Sie im Bereich der „Formate“ den Eintrag:
    #.##0,00 DM;-#.##0,00 DM


    3 Klicken Sie in das obere Fenster „Formate“ hinter den letzten Eintrag, und geben
    Sie dort ein weiteres Semikolon sowie zwei Anführungszeichen ein. Der Eintrag
    in dem Feld sollte jetzt folgendermaßen aussehen: #.##0,00 DM;-#.##0,00 DM;""


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_86_1.png)


    4 Der dritte Bereich in den Formatierungen, also der Bereich nach dem zweiten
    Semikolon, definiert die Anzeige von Nullwerten. Da hinter dem letzten Semikolon
    kein weiterer Eintrag folgt, werden Nullen künftig nicht mehr angezeigt.


    5 Mit einem Klick auf die Schaltfläche „OK“ werden Ihre Formatierungen übernommen,
    und Sie sind künftig von lästigen Nullen in der Anzeige befreit.


    # Sekundärachse im Diagramm einfügen


    Bei der Darstellung stark abweichender Werte in Diagrammen gibt es ein Problem:
    Die kleinen Werte sind oftmals kaum sichtbar. Mit Hilfe einer Sekundärachse können
    Sie auch kleine Werte gut sichtbar in einem Diagramm darstellen.


    1 Markieren Sie die Datenreihen, die in Ihrem Diagramm dargestellt werden sollen.
    Klicken Sie auf das Symbol „Diagramm-Assistent“. Der Diagramm-Assistent startet.
    Wählen Sie den Diagrammtyp „Linie“ und den Untertyp „Linie mit Datenpunkten“ aus.
    Klicken Sie auf die Schaltfläche „Weiter“. Im „Diagramm-Assistent Schritt 2 von
    4“ wählen Sie die Option „Reihe in: Spalten“ und betätigen die Schaltfläche „Weiter“.


    2 Beim nächsten Assistentenfenster geben Sie nach Ihren Wünschen „Titel“, „Achsen“,
    „Gitternetzlinien“, „Legende“, „Datenbeschriftungen“ und „Datentabelle“ ein. Mit
    einem Klick auf „Weiter“ gelangen Sie in das letzte Dialogfenster des „Diagramm-Assistenten“.


    3 Legen Sie fest, ob Ihr Diagramm als Objekt in die Tabelle gestellt wird, oder
    ob Sie lieber ein neues Diagrammblatt erzeugen wollen. Mit einem Klick auf die
    Schaltfläche „Ende“ erstellen Sie das Diagramm.


    4 Klicken Sie mit der rechten Maustaste auf die Linie, welche die kleinen Werte
    darstellt. Das Kontextmenü zu dieser Datenreihe öffnet sich. Wählen Sie hier den
    Befehl „Datenreihen formatieren“.


    5 Das Dialogfenster „Datenreihen formatieren“ wird eingeblendet. Benutzen Sie
    hier das Register „Achsen“. Aktivieren Sie die Option „Sekundärachse“. Mit einem
    Klick auf die Schaltfläche „OK“ wird für die niedrigen Werte eine zweite Werteachse,
    die Sekundärachse, eingefügt. Jetzt haben Sie Ihre Daten voll im Blick, egal wo
    sich der Cursor in der Tabelle befindet.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_86_2.png)'
