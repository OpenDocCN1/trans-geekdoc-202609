  img_proc: true
- pgno: 89
  md: '# Geheime Zellen in Excel


    Nicht jede Eintragung in Excel ist für alle Augen gedacht. Soll der Inhalt einer
    Zelle auf dem Bildschirm und auf dem Ausdruck nicht zu sehen sein, in der Tabelle
    aber trotzdem mit dem Wert gerechnet werden, so müssen Sie einen Trick anwenden.


    +   1. Markieren Sie die Zelle, die verborgen werden soll. Wählen Sie anschließend
    den Menübefehl „Format“ und im Untermenü den Befehl „Zellen“. Das Dialogfenster
    „Zellen“ wird eingeblendet.

    +   2. Wechseln Sie zum Registerblatt „Zahlen“, und wählen Sie aus dem Listenfeld
    „Kategorie“ den Eintrag „Benutzerdefiniert“ aus.

    +   3. Im Feld „Formate“ löschen Sie den bestehenden Eintrag und geben statt dessen
    drei Semikola (;;;) ein.

    +   4. Schließen Sie den Dialog mit einen Klick auf die Schaltfläche „OK“.


    5 Jetzt ist der Inhalt der Zelle nur noch in der oberen Bearbeitungszeile zu sehen.
    Der Wert ist aber weiterhin vorhanden und deshalb rechnet die Tabelle auch weiterhin
    mit dem verborgenem Wert. Möchten Sie den Wert nicht nur in der Bearbeitungszeile,
    sondern auch in der betreffenden Zelle selbst sichtbar machen, so klicken Sie
    diese doppelt an.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_89_0.png)


    # TIPP Wiederholen, bitte


    Manchmal besteht die Notwendigkeit, einen Text mehrfach zu wiederholen. Das ist
    zum Beispiel bei Trennlinien, bestehend aus Sternchen „*“ oder anderen Symbolen
    sinnvoll. Anstatt dieses Zeichen nun so häufig einzugeben, dass es eine Zelle
    ausfüllt, bedienen Sie sich lieber der Funktion „Wiederholen“. Diese Funktion
    fragt Sie nach dem oder den Zeichen, die wiederholt werden sollen. Sie aktivieren
    diese Funktion, indem Sie auf das Symbol „Funktions-Assistent“ in der Symbolleiste
    klicken, die „Kategorie“ „Text“ wählen und dort die Funktion „Wiederholen“ auswählen.
    Ein Klick auf die Schaltfläche „OK“ öffnet das Dialogfenster zu dieser Funktion.
    Sie geben das oder die Zeichen im Feld „Text“ ein und im Feld „Multiplikator“
    geben Sie Anzahl der gewünschten Wiederholungen ein. Ein Klick auf die Schaltfläche
    „Ende“ führt die Funktion aus.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_89_1.png)


    # Excel mit Datenbankfunktionalität


    Excel kann noch mehr als normale Tabellenfunktionen. Mit Excel können Sie auch
    einfache Datenbanken, wie zum Beispiel eine Adressdatenbank, aufbauen. Auf den
    ersten Blick bietet Excel aber keine Auswertungsfunktionen. Es gibt aber eine
    versteckte Funktion, mit der Sie Ihre Tabelle durchsuchen und filtern können.
    Mit Hilfe dieser Funktion können Sie auch Daten in Ihre „Excel-Datenbank“ eingeben.


    +   1. Entwerfen Sie für Ihre Datenbankfelder in der ersten Zeile eines Arbeitsblattes,
    beginnend mit „A1“, die Überschriften. Diese Überschriften werden später Ihre
    Feldnamen.

    +   2. Markieren Sie Ihre Überschriftenzeile und weisen Sie ihr das Format „Fett“
    zu. Geben Sie unterhalb der Überschrift Ihre erste Datenreihe ein.

    +   3. Markieren Sie die Zelle A1 und wählen den Menübefehl „Daten“. Im sich öffnenden
    Untermenü klicken Sie auf den Eintrag „Maske“. Die Datenmaske von Excel wird geöffnet.

    +   4. Jede Zeile der Tabelle wird als Datensatz behandelt. Mit einem Klick auf
    „Neu“ geben Sie einen neuen Datensatz ein. Er wird unmittelbar in der nächsten
    Tabellenzeile eingefügt.


    5 Falls Sie nach bestimmten Datensätzen in Ihrer Tabelle suchen, klicken Sie auf
    die Schaltfläche „Suchkriterien“. Die Datenmaske dient jetzt zur Eingabe von Suchkriterien.
    Sie können in einem oder in mehreren Feldern Begriffe eingeben, nach denen Sie
    suchen möchten. Über die Schaltflächen „Nächsten suchen“ oder „Vorherigen suchen“
    beginnen Sie die Suche.


    6 Mit der Schaltfläche „Löschen“ können Sie den gerade selektierten Datensatz
    komplett löschen. Ein Klick auf die Schaltfläche „Schließen“ beendet die Datenmaske
    und Sie können wie gewohnt in Excel weiterarbeiten. P. Schnoor/ms


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_89_2.png)


    # INFO Inhalte nach Bedarf einfügen


    Beim „normalen“ Einfügen werden gleichzeitig Formeln, Formate und Inhalte in eine
    ausgewählte Zelle eingefügt. Das ist aber nicht immer gewünscht. Wenn Sie zum
    Beispiel Werte aus komplexen Formeln als feste Konstanten in ein Arbeitsblatt
    übernehmen wollen, wählen Sie einen anderen Weg des Einfügens. Markieren und kopieren
    Sie wie gewohnt die gewünschten Zellen. Wählen Sie anschließend die Befehle „Bearbeiten“
    und „Inhalte einfügen“. Das Dialogfenster „Inhalte einfügen“ öffnet sich. Wählen
    Sie hier die Option „Werte“ und klicken Sie anschließend auf die Schaltfläche
    „OK“. Jetzt wird nur das Formelergebnis, nicht aber die Formel eingefügt.'
  merge: -1
  img_proc: true
- pgno: 90
  md: '![](img/5f36a0372e5f0f300d0bad16e6a18053_90_0.png)


    # Die Grundeinstellungen von Excel


    Um optimal mit Excel zu arbeiten, müssen Sie einige Grundeinstellungen vornehmen.
    Manche dieser Einstellungen werden sofort wirksam, andere erst beim Anlegen neuer
    Arbeitsmappen. Daher sollten Sie die Grundeinstellungen möglichst frühzeitig vornehmen,
    damit Sie schnell davon profitieren können.


    +   1. Aktivieren Sie den Menübefehl „Extras“ und im folgendem Untermenü wählen
    Sie den Eintrag „Optionen“ aus.

    +   2. Im Register „Ansicht“ aktivieren Sie im Bereich „Anzeigen“ die Auswahlfelder
    „Bearbeitungsleiste“ und „Statusleiste“. Im Bereich „Objekte“ klicken Sie auf
    das Options­kästchen „Alle anzeigen“. Im Bereich der „Fenster­optionen“ aktivieren
    Sie unbedingt die Auswahlfelder „Zeilen- und Spaltenköpfe“, „Gitternetzlinien“,
    „Horizontale Bildlaufleiste“, „Vertikale Bildlaufleiste“ und „Arbeits­map­pen­register“.

    +   3. Wechseln Sie in das Register „Bearbeiten“. Aktivieren Sie das Auswahlfeld
    „Markierung nach dem Drücken der Eingabetaste verschieben“ und stellen Sie die
    „Richtung“ mit Hilfe des Auswahlmenüs auf „Unten“.


    +   4. Gehen Sie zum Registerblatt „Allgemein“. Richten Sie dort im unteren Bereich
    den Eintrag „Blätter in neuer Arbeitsmappe“ auf die Anzahl der Arbeitsblätter
    ein, die Sie oft in einer Arbeitsmappe benötigen.

    +   Im Auswahlfeld „Schriftart“ legen Sie fest, welchen Schrifttyp Sie als Standardschrift
    in Ihren Arbeitsmappen verwenden wollen.

    +   5. Übernehmen Sie Ihre Einstellungen mit einem Klick auf die Schaltfläche
    „OK“. Um die geänderten Einstellungen zu überprüfen, öffnen Sie eine neue Arbeitsmappe.
    Alle Einstellungen werden in diese und künftige Arbeitsmappen übernommen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_90_1.png)


    # TIPP So sparen Sie Papier


    Vor einem Ausdruck Ihrer Excel-Datei sollten Sie diese grundsätzlich in der Seitenansicht
    kontrollieren. In der Seitenansicht können Sie vor dem eigentlichen Ausdruck das
    Seitenlayout noch einmal gründlich überprüfen. Hier werden auch Kopf- und Fußzeilen
    so angezeigt, wie sie gedruckt werden. Wählen Sie den Menübefehl „Datei“ und im
    Untermenü „Seitenansicht“. Excel zeigt die aktuelle Seite des Arbeitsblatts in
    der Seitenansicht an. Wenn mehrere Seiten erzeugt werden, blättern Sie gegebenenfalls
    mit den Schaltflächen „Weiter“ und „Vorher“ in der Seitenansicht. Wenn die Seitenvorschau
    Ihren Vorstellungen entspricht, klicken Sie auf die Schaltfläche „Drucken“


    # Standardbreiten von Spalten verändern


    Excel arbeitet mit vorgegebenen Standardbreiten für Spalten. Wenn Sie eine besondere
    Schriftart und einen besonderen Schriftgrad in Excel-Tabellen benutzen, können
    diese Standardwerte ungünstig sein. Dann müssen Sie die Standardbreiten der Spalten
    ändern.


    +   1. Wählen Sie „Standardbreite“ aus dem Untermenü von „Format“ und „Spalte“.
    Im Dialogfenster „Standardbreite“ wird die von Excel vorgegebene Standardspaltenbreite
    angezeigt.


    +   2. Geben Sie den gewünschten Wert für die neue Standardspaltenbreite ein.
    Sie können einen Wert zwischen 0 und 255 wählen.

    +   3. Probieren Sie die Werte so lange aus, bis Ihre Schriftart optimal in die
    Standardbreite passt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_90_2.png)


    # TIPP Arbeitsmappen schließen


    In Excel ist es keine Seltenheit, dass mit mehreren Dateien gearbeitet wird. Dadurch
    sind mehrere Arbeitsmappen aktiv. Beim Beenden der Arbeit ist es jedoch zeitaufwendig,
    jede Arbeitsmappe einzeln zu schließen. Mit einem kleinen Trick können Sie aber
    alle geöffneten Arbeitsmappen mit nur einem Mausklick schließen: Drücken Sie die
    Umschalttaste, halten Sie diese gedrückt und klicken Sie auf den Menübefehl „Datei“.
    Das Untermenü von „Datei“ hat sich geändert, es befindet sich zusätzlich der Befehl
    „Alles schließen“ in der Auswahl. Wenn Sie auf diesen Befehl klicken, werden alle
    geöffneten Arbeitsmappen mit einem Schlag geschlossen.


    # ClipArt-Objekte in Excel einfügen


    Zum Verschönern Ihrer Excel-Tabellen haben Sie die Möglichkeit, ClipArt-Objekte
    von der Office-CD in Ihre Arbeitsblätter einzufügen.


    +   1. Wählen Sie den Menübefehl „Einfügen“ und im folgendem Untermenü ziehen
    Sie den Cursor auf den Eintrag „Grafik“. Klicken Sie im jetzt erscheinendem Untermenü
    auf den Befehl „ClipArt“.


    +   2. Wählen Sie das gewünschte Register aus. Im linken Feld können Sie die Kategorie
    bestimmen. Wenn Sie sich für keine bestimmte Kategorie entscheiden können, aktivieren
    Sie den Eintrag „Alle Kategorien“ aus. Wählen Sie im rechten Feld das gewünschte
    Objekt aus. Klicken Sie nun auf die Schaltfläche „Einfügen“. Das ausgewählte ClipArt-Objekt
    wird in das Arbeitsblatt eingefügt.'
  merge: -1
  img_proc: true
- pgno: 91
  md: '# TIPP Kleines Symbol, große Wirkung


    Sie können sich mit einem kleinen Trick die Arbeit in Excel vereinfachen. Formeleingaben
    beginnen in Excel immer mit einem Gleichheitszeichen. Klicken Sie vor Eingabe
    einer Formel in der Bearbeitungszeile auf das Gleichheitszeichen, so wird es direkt
    in die Bearbeitungszeile übernommen und der Formeleditor eingeschaltet. Wenn Sie
    jetzt Ihre Formel eingeben, dabei kann es sich auch um eine einfache Addition
    oder Subtraktion handeln, wird das Zwischenergebnis laufend im Formeleditor angezeigt.
    Sollten Sie sich einmal vertippen, sehen Sie das sofort, weil der Formeleditor
    einen falschen Wert oder keinen Wert ausgibt. Ist Ihre Eingabe abgeschlossen,
    klicken Sie auf die Schaltfläche „Ende“. Jetzt wird Ihre Formel übernommen und
    das Ergebnis in der Arbeitszelle dargestellt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_91_0.png)


    # TIPP Zu wenig Arbeitsblätter?


    Sollten Sie während Ihrer Arbeit mit Excel merken, dass die vorhandenen Arbeitsblätter
    nicht ausreichen und Sie ein neues Arbeitsblatt benötigen, so können Sie dieses
    mit dem Menübefehl „Einfügen“ und dem Untermenü „Tabelle“ erzeugen. Es geht aber
    auch einfacher: Markieren Sie das Arbeitsblatt, vor dem das neue Arbeitsblatt
    eingefügt werden soll, und betätigen Sie die Tastenkombination „Umschalttaste
    + F11“, schon wird wie von Zauberhand ein neues Tabellenblatt eingefügt.


    # Änderungen in einem Arbeitsblatt verfolgen


    Wenn Sie kontrollieren wollen, welche Änderungen Sie oder andere Bearbeiter in
    Ihrer Arbeitsmappe vorgenommen haben, müssen Sie die Änderungen von Excel verfolgen
    lassen.


    1 Wählen Sie den Menübefehl „Extras“ und bewegen Sie im Untermenü den Cursor auf
    den Eintrag „Änderungen verfolgen“. Klicken Sie im jetzt eingeblendeten Menü auf
    den Befehl „Änderungen hervorheben“. Das Dialogfenster „Änderungen aufzeichnen“
    wird eingeblendet.


    2 Die Option „Änderungen während der Eingabe protokollieren“ ist standardmäßig
    aktiviert. Bestimmen Sie in dem Feld „Wann“, welche Änderungen verfolgt werden
    sollen. Zusätzlich können Sie die Felder „Wer“ und „Wo“ aktivieren. Im Feld „Wer“
    wählen Sie aus der Auswahlliste, wessen Änderungen aufgezeichnet werden sollen.
    In den meisten Fällen ist es sinnvoll, den Eintrag „jeder“ auszuwählen. Das Feld
    „Wo“ grenzt den Zellbereich ein, für den die Änderungen verfolgt werden sollen.


    3 Im unteren Bereich des Dialogfensters legen Sie fest, ob die Änderungen am Bildschirm
    markiert und/oder auf einem neuen Blatt protokolliert werden sollen.


    4 Mit einem Klick auf die Schaltfläche „OK“ werden Ihre Eingaben übernommen und
    das Dialogfenster wird geschlossen.


    5 Ihre Änderungen an Zellinhalten werden jetzt im Tabellenblatt durch einen farbigen
    Rahmen gekennzeichnet, der zusätzlich mit einem kleinen Dreieck versehen ist.
    Für jeden Benutzer verwendet Excel eine andere Farbe. Wenn Sie den Cursor auf
    eine solche Zelle bewegen, erscheint der Benutzer, der diese Zelle geändert hat,
    gefolgt vom Datum und Uhrzeit und von der Art der Änderung.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_91_1.png)


    # Mehrere Arbeitsblätter markieren


    Wenn Sie mehrere Arbeitsblätter auf einmal markieren wollen, zum Beispiel um diese
    zu kopieren oder zu verschieben, müssen Sie einige Besonderheiten beachten.


    1 Um ein einzelnes Arbeitsblatt zu markieren, klicken Sie einfach auf das entsprechende
    Registerblatt.


    2 Einen zusammenhängenden Bereich von Arbeitsblättern markieren Sie dadurch, dass
    Sie auf das Register des ersten zu markierenden Blattes klicken, die Umschalttaste
    festhalten und dann das Register des letzten zu markierenden Blattes anklicken.


    3 Sie können auch beliebige Arbeitsblätter markieren, die nicht unmittelbar nebeneinander
    stehen. Um nicht zusammenhängende Arbeitsblätter zu markieren, klicken Sie das
    Register des ersten Blattes an, halten die „Strg-Taste“ fest und markieren beliebig
    viele andere Blätter durch Anklicken des Registers. Alle angeklickten Arbeitsblätter
    werden zusätzlich markiert.


    4 Wenn Sie alle Arbeitsblätter einer Arbeitsmappe auf einmal markieren wollen,
    klicken Sie mit der rechten Maustaste auf das Register eines beliebigen Arbeitsblattes.
    Wählen Sie anschließend den Befehl „Alle Blätter markieren“ aus dem Kontextmenü.


    5 Wie werden Sie die Markierung mehrerer Arbeitsblätter wieder los? Klicken Sie
    dazu auf das Register eines nicht markierten Arbeitsblattes. Dieses wird zum aktiven
    Arbeitsblatt, die Auswahl der anderen Arbeitsblätter ist aufgehoben.


    6 Falls Sie alle Arbeitsblätter markiert haben, klicken Sie mit der rechten Maustaste
    auf ein beliebiges Arbeitsblatt-Register. Aus dem Kontextmenü des Registers wählen
    Sie den Befehl „Gruppierung aufheben“.


    7 Eine Gruppenauswahl von Arbeitsblättern wird in der Titelleiste durch den Zusatz
    „Gruppe“ angezeigt. Peter Schnoor/jh


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_91_2.png)'
