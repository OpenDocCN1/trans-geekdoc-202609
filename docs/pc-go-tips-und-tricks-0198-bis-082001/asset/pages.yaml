  md: '# Excel


    # TIPP Arbeiten mit der Auswahlliste


    Bei Listen, in denen sich Eintragungen wiederholen, können Sie mit einem kleinen
    Trick die Schreibarbeit abkürzen. Klicken Sie in die nächste freie Zelle unterhalb
    Ihrer Liste und dort auf die rechte Maustaste. Im jetzt eingeblendeten Kontextmenü
    wählen Sie den Befehl „Auswahlliste“. Alle bereits vorgenommenen Eintragungen
    werden angezeigt und können durch einen Mausklick auf den entsprechenden Eintrag
    komfortabel übernommen werden.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_97_0.png)


    7 In das Feld „Datenbankfeld“ geben Sie die Koordinate der Überschrift „GEHALT“,
    zum Beispiel „C1“, ein. Das Feld „Suchkriterien“ erwartet die Eingabe der Koordinaten
    zur Auswahl, in unserem Beispiel also den Bereich, in dem Sie „ABT“ und „EK“ geschrieben
    haben. Ein Klick auf die Schaltfläche „Ende“ berechnet die Summe der Gehälter
    für die Abteilung Einkauf.


    8 Wenn Sie den Abteilungsnamen im Kriterienbereich ändern, wird die neue Summe
    der Gehälter sofort ausgerechnet und dargestellt.


    9 Die Datenbankfunktionen arbeiten alle nach dem gleichen Schema: Als erstes muss
    der


    Datenbereich der auszuwertenden Liste eingegeben werden, dann die Überschrift
    der auszuwertenden Spalte und zum Schluss das Suchkriterium. Es gibt insgesamt
    zwölf Datenbankfunktionen in Excel, von der Berechnung der Anzahl bis zur Varianzberechnung.
    Peter Schnoor/jh


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_97_1.png)


    # Mit Hilfe des Solvers zum Ziel gelangen


    Lösen Sie Ihre komplexen Rechenprobleme mit Hilfe der Solverfunktion in Excel.
    Bei der „Zielwertsuche“ wird ein einzelner Wert so lange verändert, bis er das
    gewünschte Ergebnis liefert. Wenn das angestrebte Ergebnis aber von mehreren Werten
    abhängt, so kann es mit Hilfe der „Solverfunktion“ sehr einfach herausgefunden
    werden.


    Der Optimalwert einer Berechnung mit dem „Solver“ wird durch folgende Elemente
    bestimmt: die „Zielzelle, die „veränderbaren Zellen“ und die „Nebenbedingungen“.
    Am Beispiel der Zielwertsuche können Sie auch die „Solverfunktionen“ ausprobieren.


    1 Klicken Sie auf den Menübefehl „Extras“. Im folgenden Untermenü wählen Sie den
    Befehl „Solver“ aus. Das Dialogfenster „Solver-Parameter“ öffnet sich.


    2 In das Eingabefeld „Zielzelle“ im Dialogfeld geben Sie den Wert „$B$4“ ein.
    In der Zeile „Zielwert“ aktivieren Sie die Option „Wert“ und in das Feld „Wert“
    tippen Sie anschließend eine „0“ ein.


    3 Im Bereich der „veränderbaren Zellen“ klicken Sie auf die Schaltfläche „Schätzen“.
    Excel erkennt aufgrund der vorgegebenen Zielzelle automatisch den Bereich „$B$1:$B$3“.


    4 Im Bereich der „Nebenbedingungen“ klicken Sie auf die Schaltfläche „Hinzufügen“.
    Das Dialogfenster „Nebenbedingungen hinzufügen“ wird eingeblendet.


    5 Die Einnahmen sollten 5000 DM nicht unterschreiten, klicken Sie deswegen auf
    die Zelle B1, wählen Sie anschließend mit Hilfe des


    # TIPP Möglichkeiten zum Löschen


    Excel bietet zum Löschen von Daten mehrere Optionen an, die nicht immer klar verständlich
    sind. Um zum Beispiel bestimmte Zelleninhalte zu löschen, markieren Sie die zu
    löschenden Zellen. Öffnen Sie anschließend das Menü „Bearbeiten“ und im Untermenü
    ziehen Sie den Cursor auf den Eintrag „Löschen“. Folgende Optionen stehen Ihnen
    dann zum Löschen zur Verfügung: „Alles“: Löscht alles, was in dieser Zelle vorhanden
    ist (Inhalt, Formatierungen und Kommentare). „Format“: Entfernt ausschließlich
    alle Formatierungen, die Inhalte und Kommentare bleiben erhalten. „Inhalte“: Löscht
    die Daten aus der Zelle, alle Formatierungen und Kommentare bleiben bestehen.
    „Kommentare“: Vorhandene Kommentare werden entfernt, Inhalte und Formatierungen
    der markierten Zellen bleiben erhalten.


    „Auswahlpfeils“ die Bedingung „>=“ und geben Sie dann in das Feld „Nebenbedingung“
    den Wert „5000“ ein.


    Ein Klick auf die Schaltfläche „Hinzufügen“ fügt die Bedingung hinzu, und Sie
    können die nächste Bedingung festlegen.


    6 Die Ausgaben werden mindestens die Hälfte der Einnahmen in Anspruch nehmen.
    Deshalb lautet die Eingabe für die Zelle „B2“: „>=$B$1/2“. Ein Klick auf die Schaltfläche
    „Hinzufügen“ fügt auch diese Bedingung in die Tabelle ein.


    7 Die Belastung wird keinesfalls geringer als 2000 DM werden. Also lautet die
    letzte Bedingung: „$B$3>=2000“. Ein Klick auf die Schaltfläche „OK“ fügt die letzte
    Bedingung hinzu und schließt das Dialogfenster „Nebenbedingungen hinzufügen“.


    8 Mit einem Klick auf die Schaltfläche „Lösen“ erscheint die Nachricht, dass der
    Solver unter Einhaltung der Nebenbedingungen eine Lösung gefunden hat. Ein Klick
    auf die Schaltfläche „OK“ übernimmt die Werte, ein Klick auf die Schaltfläche
    „Abbrechen“ stellt die Anfangswerte wieder her.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_97_2.png)'
