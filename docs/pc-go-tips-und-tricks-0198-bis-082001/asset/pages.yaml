  md: '# Unterschiedliche Szenarien durchrechnen


    Mit Hilfe von unterschiedlichen Szenarien können Sie Excel künftige Entwicklungen
    durchrechnen lassen. Dabei ersetzen Sie innerhalb einer Tabelle eine Reihe von
    Werten durch andere Werte. Dadurch können Sie die unterschiedlichen Resultate
    miteinander vergleichen und beurteilen. Die unterschiedlichen Szenarien werden
    in der aktuellen Tabelle gespeichert. Das Beispiel einer Buchungsliste mit optimistischer
    und pessimistischer Zukunftsbeurteilung macht die Möglichkeiten des „Szenario-Managers“
    deutlich.


    1 Legen Sie eine Excel-Tabelle mit folgendem Inhalt an:


    | Kategorie | Preis | Posten | Umsatz |

    |---|---|---|---|

    | Einfach | 99,00 DM | 199 | 19.701,00 DM |

    | Mittel | 157,00 DM | 159 | 24.963,00 DM |

    | Hoch | 219,00 DM | 19 | 4.161,00 DM |

    | Exklusiv | 399,00 DM | 11 | 4.389,00 DM |


    2 Die Umsätze berechnen Sie mit der Multiplikationsformel „=B2*C2“ und kopieren
    diese Formel für alle mit Kategorien belegten Zeilen. Die Summe der Umsätze berechnen
    Sie mit der Summenfunktion „=Summe(D2:D5)“. Speichern Sie anschließend die Arbeitsmappe.


    3 Markieren Sie die gesamte Tabelle. Den Szenario-Manager aktivieren Sie, indem
    Sie auf den Menübefehl „Extras“ klicken und im Untermenü die Option „Szenario-Manager“
    wählen. Das Dialogfenster „Szenario-Manager“ öffnet sich.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_98_0.png)


    4 Klicken Sie im „Szenario-Manager“ auf die Schaltfläche „Hinzufügen“. Das Dialogfenster
    „Szenario hinzufügen“ wird eingeblendet.


    Tippen Sie in das Feld „Szenarioname“ den Begriff „Optimist“ ein. Das Feld „Veränderbare
    Zellen“ belegen Sie mit dem Bereich der Buchungsangaben „C2:C5“. Klicken Sie anschließend
    auf die Schaltfläche „OK“. Das Dialogfenster „Szenariowerte“ wird eingeblendet.


    5 Setzen Sie die optimistischen Schätzungen für jede Zelle ein. Ein Klick auf
    die Schaltfläche „OK“ führt Sie in das Dialogfenster „Szenario-Manager“ zurück.
    Sie können an dieser Stelle gleich ein weiteres Szenario einrichten, indem Sie
    auf die Schaltfläche „Hinzufügen“ klicken. Vergeben Sie jetzt den Namen „Pessimist“
    und klicken auf die Schaltfläche „OK“.


    6 In das jetzt eingeblendete Dialogfenster „Szenariowerte“ tippen Sie Ihre pessimistischen
    Schätzungen für jeden Buchungswert ein. Ein Klick auf die Schaltfläche „OK“ führt
    Sie wieder in den „Szenario-Manager“ zurück.


    7 Markieren Sie eine der Szenarien und klicken Sie dann auf die Schaltfläche „Anzeigen“.
    Excel zeigt das jeweils aktivierte Szenarioergebnis in der Tabelle an. Ein Klick
    auf die Schaltfläche „Bericht“ erstellt einen aussagekräftigen Bericht über Ihre
    Szenarien, so dass Sie in Ruhe die Ausgangswerte mit den Schätzwerten und den
    daraus resultierenden Ergebnissen vergleichen können.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_98_1.png)


