- pgno: 79
  md: '# Nur sichtbare Zellen auswählen


    Möchten Sie Ihre Listen unter Excel schnell und effizient sortieren, so greifen
    Sie idealerweise zur Funktion „AutoFilter“. Doch diese liefert nicht in jedem
    Fall die gewünschten Ergebnisse. Besonders wenn sich innerhalb Ihrer Tabelle ausgeblendete
    Zeilen oder Spalten befinden, kann es dazu kommen, dass Excel auch die Werte aus
    den ausgeblendeten Zellen berücksichtigt. Das können Sie jedoch vermeiden.


    1 Markieren Sie den gewünschten Bereich in Ihrer Tabelle. Dabei können auch ausgeblendete
    Zellen enthalten sein.


    2 Wählen Sie die Menüpunkte „Bearbeiten“ und „Gehe zu“. Klicken Sie im Dialogfenster
    auf den Schalter „Inhalte“.


    3 Excel blendet nun eine ganze Reihe von Optionen ein. Entscheiden Sie sich für
    den Parameter „Nur sichtbare Zellen“, und bestätigen Sie mit „OK“.


    4 Benötigen Sie diese Funktion häufiger, so existiert unter Excel sogar ein Symbol
    dafür. Das ist allerdings kaum bekannt. Unter „Extras“ und „Anpassen“ klicken
    Sie per Maus das Register „Befehle“ an. Hier wählen Sie den Punkt „Bearbeiten“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_79_0.png)


    5 Ziehen Sie abschließend das Symbol „Sichtbare Zellen markieren“ mit der Maus
    auf die Symbolleiste.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_79_1.png)


    Durch einen Mausklick auf das neue Symbol erfasst Excel nur die Zellen, die innerhalb
    des markierten Bereichs sichtbar sind. Ausgeblendete Zellen werden nicht einbezogen.
    Änderungen an der Auswahl wirken sich nicht auf ausgeblendete Zellen aus.


    # TIPP Excel mit individuellem Menü


    Um die vielen Menüpunkte unter Excel 2000 in den Griff zu bekommen, entschieden
    sich die Entwickler bei der Benutzerführung für ein neues Konzept. So werden auf
    den ersten Mausklick nicht alle Menüpunkte angezeigt, sondern nur die wesentlichen
    Punkte. Erweiterte Funktionen bleiben dem Anwender im ersten Schritt verborgen.
    Erst wenn Sie auf einem markierten Menüpunkt verweilen, öffnen sich die darunter
    liegenden Einträge. Dabei ermittelt Excel, welche Menüpunkte vom Anwender bisher
    bevorzugt benutzt werden. Die Funktionen, die eher selten angeklickt werden, hält
    Excel weiterhin zurück. Dies kommt besonders anderen dem ungeübten Anwender zu
    Gute, der so leichter die wesentlichen Menüpunkte erreicht.


    # Inhalte verdecken


    Bei größeren Excel-Tabellen sollen häufig nicht alle Informationen angezeigt werden.
    Dies kann der Übersichtlichkeit dienen oder aber sicherheitsrelevante Daten verbergen.
    Die einfachste Methode ist, die Daten stark zu verkleinern oder die Zeichen in
    der Hintergrundfarbe einfärben. Beide Methoden haben allerdings Nachteile. Sie
    können jedoch Ihre Werte wesentlich komfortabler verschwinden lassen.


    1 Markieren Sie die Zellen, deren Inhalte verdeckt werden sollen. Handelt es sich
    nur um eine Zelle, klicken Sie diese einfach an.


    2 Benutzen Sie den Menüpunkt „Format“ und den Eintrag „Zellen“. Im Register „Zahlen“
    wählen Sie die Kategorie „Benutzerdefiniert“ aus.


    3 Im Eingabefeld „Formate“ geben Sie folgende Zeichen als Zahlenformat ein: „;;;“.
    Mit „OK“ bestätigen Sie die Eingabe.


    4 Sie können die Zahlen zwar noch in der Eingabezeile lesen, allerdings sind die
    Zahlen in der Tabelle selbst nicht mehr erkennbar. Auch ein Ausdruck ist nicht
    möglich. Beachten Sie dabei: Die betreffende Zelle darf nicht mehr als 1024 Zeichen
    enthalten.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_79_2.png)


    5 Die Daten sind damit nicht völlig verschwunden. Wenn Sie sie wieder offenlegen
    möchten, so stellen Sie analog das Zellenformat wieder auf die alten Werte ein.
    Damit kommen Sie zur gewohnten Einstellung zurück. W. Lindo/pm


    # TIPP Schneller Zugriff auf Blätter


    Eine besonders leistungsstarke Funktion unter Excel ist das Verwalten von Tabellenblättern
    innerhalb einer Arbeitsmappe. Bis zu 256 Tabellen lassen sich auf diese Weise
    verarbeiten. Allerdings bleibt bereits bei einer deutlich kleineren Zahl von Tabellenblättern
    die Übersicht auf der Strecke. Es wird zum Geduldsspiel, zwischen den einzelnen
    Tabellen zu navigieren. Doch Excel bietet im Verborgenen eine sinnvolle Navigationshilfe.
    Klicken Sie einfach mit der rechten Maustaste auf eine der Pfeilschaltflächen
    links neben dem Blattregister. Daraufhin erscheint eine Liste mit den verfügbaren
    Tabellen. Mit jeweils einem Mausklick springen Sie direkt zu der gewünschten Tabelle.
    Bei mehr als vierzehn Tabellenblättern erscheint der Eintrag „Weitere Blätter“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_79_3.png)'
  merge: -1
  img_proc: true
- pgno: 80
  md: '# # Excel-TIPPS


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_80_0.png)


    # ## TIPP Neue Tabellen einfügen


    Wenn die Tabellen in Ihrer Arbeitsmappe nicht ausreichen, können Sie nachträglich
    neue Tabellen einfügen. Klicken Sie dazu auf das Tabellenblatt, vor dem Sie Ihre
    neue Tabelle einfügen wollen. Aktivieren Sie anschließend aus dem Menü von Excel
    den Befehl „Einfügen“ und im Untermenü den Befehl „Tabelle“. Diesen Vorgang können
    Sie ausführen, bis Ihre Arbeitsmappe maximal 255 Tabellen enthält.


    # ## TIPP Optionen zur Sortierung


    Wenn Ihnen die normalen Sortierfunktionen von Excel nicht ausreichen, können Sie
    die „Sortieroptionen“ einschalten. Klicken Sie dazu im Menü auf „Daten“. Im folgenden
    Untermenü wählen Sie den Befehl „Sortieren“ aus. Das Dialogfeld „Sortieroptionen“
    wird geöffnet. Hier klicken Sie auf die Schaltfläche „Optionen“. Hier können Sie
    genau festlegen, ob nach Zeilen oder Spalten sortiert werden soll. Außerdem haben
    Sie die Möglichkeit, bei der Sortierung nach Groß- und Kleinschreibung zu unterscheiden.
    Im Kombinationsfeld „Benutzerdefinierte Sortierreihenfolge“ wählen Sie eine spezielle
    Sortierreihenfolge aus. Die entsprechenden Einträge stammen übrigens aus dem Register
    „Autoausfüllen“ und „Autoausfüllen“.


    # ## Eingaben korrigieren


    Texte und Werte in eine Excel-Tabelle einzugeben, ist nicht schwer. Aber wie können
    Sie Einträge anschließend korrigieren? Wenn Sie in die entsprechende Zelle klicken,
    wird bei einer Eingabe der Inhalt gelöscht. Um Einträge zu korrigieren, gehen
    Sie folgendermaßen vor:


    +   1. Klicken Sie in die Zelle von Excel, die Sie korrigieren wollen.


    +   2. Betätigen Sie die „F2-Taste“. Der Cursor stellt sich an das Ende der betreffenden
    Zelle, und Sie können mit dem Cursor jetzt an die Stelle vornehmen, an der Sie
    Änderungen vornehmen wollen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_80_1.png)


    # ## Gitternetzlinien abschalten


    Die Standardansicht von Excel zeigt Ihnen als Eingabehilfe immer die Gitternetzlinien
    an. Das ist oft sinnvoll, wenn Sie Ihre Tabelle aber beispielsweise als Formular
    gestalten wollen, stören diese Strukturen. Daher schalten Sie die Gitternetzlinien
    und die Zeilen- und Spaltentköpfe ein.


    +   3. Mit einem Klick auf die Schaltfläche „OK“ übernehmen Sie die eingestellten
    Optionen, und der Bildschirm unterdrückt die Anzeige der Gitternetzlinien sowie
    der Zeilen- und Spaltentköpfe. Analog können Sie die Linien umgekehrt wieder einblenden.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_80_2.png)


    # ## Fenster am Bildschirm teilen


    Bei großen Excel-Tabellen fällt es schwer, den Überblick zu behalten. Besonders,
    wenn Sie unterschiedliche Tabellenteile gleichzeitig im Blick behalten müssen.
    Das ewige Springen von einem Tabellenteil in einen anderen und wieder zurück wird
    schnell lästig und ist fehleranfällig. Mit einem Trick vermeiden Sie diese Unübersichtlichkeiten.


    +   1. Klicken Sie in den Tabellenteil, den Sie gerade in der Bearbeitung haben,
    so dass er gut auf dem Bildschirm sichtbar ist.


    +   2. Überlegen Sie jetzt, ob Sie den Bildschirm vertikal oder horizontal teilen
    wollen. Trennen Sie das Fenster beispielsweise in zwei vertikale Ausschnitte.
    Dazu klicken Sie mit der Maus auf den vertikalen Separator rechts oben am Rand
    der Bildlaufleiste und halten die Maustaste gedrückt. Ziehen Sie den Cursor anschließend
    an die Stelle, an der das Fenster geteilt werden soll. Wenn Sie die Maustaste
    loslassen, wird das Fenster in zwei vertikale, von einander unabhängige Ausschnitte
    geteilt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_80_3.png)'
  merge: -1
  img_proc: true
- pgno: 81
  md: '# Excel


    # TIPP Informationen in der Statusleiste


    Den Abschluss des Excel-Bildschirms bildet die Statusleiste. Und diese sollten
    Sie nicht aus dem Blick verlieren, denn die Statusleiste enthält wichtige Informationen
    für Sie. Den linken Bereich der Statusleiste nutzt das Tabellenkalkulationsprogramm,
    um den aktuellen Status anzuzeigen. Im Folgenden lesen Sie die Bedeutung der wichtigsten
    Meldungen: Bereit: Excel wartet auf Ihre Eingabe. Eingeben: Sie sind gerade dabei,
    in eine bisher leere Zelle Inhalt einzugeben. Bearbeiten: Sie verändern den Inhalt
    einer bereits beschriebenen Zelle. Zeigen: Excel erwartet die Auswahl einer Zelle
    oder eines Bereichs.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_81_0.png)


    Der rechte Teil der Statusleiste gibt wichtige Informationen über den Status bestimmter
    Funktionstasten wieder: NF: Der Nummernblock wurde eingeschaltet. Sie können jetzt
    auf der abgesenkten Zehnertastatur Ziffern und Rechnensymbole eingeben. GROSS:
    Die Umschaltung auf Grossbuchstaben ist damit aktiviert. SCRL: Die Taste „Rollen“
    ist aktiviert. Dadurch wird mit den Pfeiltasten nicht die aktuelle Zelle verschoben,
    sondern der sichtbare Ausschnitt des Arbeitsblatts. ERW: Sie haben auf die Funktionstaste
    „F8“ gedrückt und dadurch den Erweiterungsmodus eingeschaltet. ADD: Sie haben
    durch die Tastenkombination „Umschalttaste“ und „F8-Taste“ den Modus zum Markieren
    weiterer Bereiche aktiviert. FIX: Sie haben die Eingabe fester Dezimalstellen
    festgelegt.


    3 Sie können jetzt im zweiten Fenster unabhängig vom ersten Fenster an die Stelle
    scrollen, die Sie sehen oder bearbeiten wollen. Durch diese Fensterteilung behalten
    Sie immer alles im Blick.


    4 Eine horizontale Fensterteilung erhalten Sie, indem Sie den horizontalen Separator
    am oberen Ende der horizontalen Bildlaufleiste anklicken und an die gewünschte
    Stelle ziehen. Sie können Ihr Fenster also auch vierteilen.


    5 Sie können die Bildschirmteilungen wieder aufheben, indem Sie die Separatoren
    an Ihre Ausgangsstelle zurückführen. Wollen Sie die Teilung komplett aufheben,
    wählen Sie den Menübefehl „Fenster“ und betätigen im Untermenü den Befehl „Teilung
    aufheben“.


    # Bestimmte Inhalte markieren


    Es ist nicht immer ganz einfach, einzelne Bereiche Ihrer Tabelle zu markieren.
    Um Zellen und Zellbereiche mit bestimmten Gruppen zu erfassen, gibt es eine leistungsfähige
    Funktion in Excel, die kaum bekannt ist. Damit können Sie beispielsweise alle
    Zellen Ihres Arbeitsblatts markieren, die Kommentare beinhalten.


    | Funktion | Wirkung |

    |---|---|

    | Kommentare | markiert alle Zellen mit Kommentaren |

    | Konstanten | markiert alle Zellen, die nicht mit Gleichheitszeichen beginnen
    |

    | Formeln | wählt alle Zellen aus, die mit Gleichheitszeichen beginnen |

    | Leerzeilen | markiert alle Leerzeilen bis zum letzten Tabelleneintrag |

    | Aktueller Bereich | selektiert den belegten Zellbereich |

    | Aktuelles Array | markiert die zu einer Zelle gehörende Matrix |

    | Objekte | markiert alle Objekte wie z.B. Diagramme und Schaltflächen |

    | Zeilenunterschiede | markiert abweichende Zeilen; eine Zeile muss markiert sein
    |

    | Spaltenunterschiede | markiert abweichende Spalten; zuvor muss eine Spalte markiert
    werden |

    | Vorgängerezellen | Es werden alle Zellen markiert, die sich auf die Formel in
    der markierten Zelle beziehen |

    | Nachfolgezellen | markiert alle der Formel nachfolgenden Zellen |

    | Letzte Zelle | markiert die letzte belegte Zelle des Arbeitsblattes |

    | Nur sichtbare Zellen | ausgeblendete Zeilen und Spalten werden nicht mit markiert
    |

    | Bedingte Formate | markiert alle Zellen, die bedingte Formatierungen enthalten
    |

    | Gültigkeitsprüfung | mit einer Gültigkeitsprüfung hinterlegte Zellen werden
    markiert |


    1 Aktivieren Sie den Menübefehl „Bearbeiten“. Im Untermenü wählen Sie „Gehe zu“
    aus. Das entsprechende Dialogfenster wird geöffnet. Klicken Sie in diesem Menü
    auf die Schaltfläche „Inhalte“.


    2 Das Dialogfenster „Inhalte auswählen“ erscheint. Wählen Sie hier die Option
    „Kommentare“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_81_1.png)


    3 Mit einem Klick auf die Schaltfläche „OK“ markiert Excel alle Kommentare in
    Ihrem Arbeitsblatt. Im Folgenden erhalten Sie einen Überblick aller Funktionen,
    die für Sie in Frage kommen können:


    # Zeilen löschen ohne Lücken


    Beim Löschen von Zeileninhalten bleiben in der Tabelle hässliche Lücken zurück.
    Ihre Tabelle wirkt dadurch zerrissen. Durch einen einfachen Trick bekommen Sie
    Ihre Tabelle wieder ohne Leerzeilen zusammenhängend dargestellt. Markieren Sie
    dazu Ihr komplettes Arbeitsblatt oder den betroffenen Bereich. Klicken Sie dann
    auf eines der Schnell-Sortiersymbole „A-Z“ oder „Z-A“. Nach dieser Sortierung
    befinden sich alle Ihre Leerzeilen automatisch am Ende des markierten Bereichs,
    die Tabelle selbst ist wieder kompakt. Alternativ können Sie auch die zu löschende
    Zeile markieren und in der Menüleiste auf „Bearbeiten“ und „Zellen löschen“ klicken.
    P. Schnoor/pm'
  merge: -1
  img_proc: true
- pgno: 82
  md: '# Nie wieder einen Excel-Termin vergessen


    Es ist aufwändig, komplizierte Excel-Tabellen zu bearbeiten; das kann sich über
    einen längeren Zeitraum hinziehen. In der Zwischenzeit gerät die weitere Bearbeitung
    der Tabelle möglicherweise in Vergessenheit. Damit Ihnen das nicht passiert, gibt
    es eine komfortable Möglichkeit, sich über Outlook an diesen Termin erinnern zu
    lassen. Das funktioniert sogar direkt aus Excel heraus.


    Outlook Aufgabe erstellen“. Markieren Sie diesen Befehl mit der linken Maustaste,
    und halten Sie die Maustaste gedrückt. Dann ziehen Sie den Befehl nach oben in
    die gewünschte Symbolleiste.


    1 Um eine automatische Aufgabenerinnerung aus Excel heraus starten zu können,
    legen Sie zunächst einen versteckten Befehl in die Excel-Symbolleiste. Wählen
    Sie dazu aus dem Menü „Extras“ den Befehl „Anpassen“. Das Dialogfeld „Anpassen“
    wird aktiviert.


    2 Wechseln Sie in das Register „Befehle“. In der Feldliste der „Kategorien“ wählen
    Sie den Eintrag „Extras“ aus.


    3 Im rechten Fenster bei „Befehle“ finden Sie, ziemlich weit unten, den Befehl
    „Microsoft Outlook Aufgabe erstellen“.


    4 Schließen Sie das Dialogfenster, und speichern Sie die aktuelle Arbeitsmappe.
    Wenn Sie nun auf die neue Schaltfläche klicken, startet Excel automatisch das
    Outlook-Dialogfenster, in dem Sie weitere Details wie „Fälligkeit“ und „Erinnerung“
    eingegeben können.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_82_0.png)


    # TIPP Filterfunktionen verhindern


    Sie können in Excel über das Menü „Daten“, „Filter“ und „Autofilter“ einen Autofilter
    zu Tabellenlisten hinzufügen. In diesem Fall blendet Excel Drop-Down-Pfeile direkt
    neben den Spaltenbeschriftungen in Ihrer Liste ein. Wenn Sie auf einen dieser
    Pfeile klicken, können Sie Ihre Daten filtern. Möchten Sie allerdings verhindern,
    dass fremde Anwender Ihre Daten filtern, sperren Sie diese Filterfunktion.


    Die Drop-Down-Pfeile sind „Objekte“, die auf der Tabellenoberfläche liegen. Sie
    können jedoch in Excel alle „Objekte“ ausblenden. Dieses geschieht über das Menü
    „Extras“ und „Optionen“. Aktivieren Sie dort das Register „Ansicht“ und im Bereich
    „Objekte“ die Option „Alle ausblenden“. Haben Sie diese Option eingeschaltet,
    lässt sich der Autofilter nicht mehr anwählen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_82_1.png)


    # TIPP Formatierung übertragen


    Sie haben einige Zellen oder Zellenbereiche perfekt formatiert und möchten diese
    Formatierung auf andere Zellen übertragen? Dann markieren Sie die formatierten
    Zellen und klicken auf das Symbol „Format übertragen“ (Pinsel). Legen Sie den
    Bereich fest, auf den Sie diese Formatierung anwenden wollen. Die Zellen im markierten
    Bereich erhalten automatisch alle eingestellten Formate.


    # Nur bestimmte Daten zulassen


    Sie haben in Excel jede Menge Freiheiten, Daten in beliebiger Form einzugeben.
    In manchen Fällen – unter anderem wenn mehrere Personen an einem Sheet arbeiten
    – macht es aber Sinn, die Möglichkeit der Dateneingabe zu beschränken.


    1 Sie möchten beispielsweise nur Datumswerte zwischen dem 1.11.2000 und dem 31.12.2000
    zulassen. Um falsche Eingaben zu unterbinden, richten Sie einen Gültigkeitsbereich
    für die Daten ein. Markieren Sie dazu die Zelle, für die Sie Einschränkungen festlegen
    möchten.


    2 Wählen Sie aus dem Menü „Daten“ den Befehl „Gültigkeit“, und aktivieren Sie,
    falls notwendig, die Registerkarte „Einstellungen“.


    3 Klicken Sie im Feld „Zulassen“ auf den Eintrag „Datum“. Hier geben Sie in das
    Feld „Anfangsdatum“ den Wert „1.11.2000“ ein, in das Feld „Enddatum“ tragen Sie
    den „31.12.2000“ ein. Übernehmen Sie die Werte mit „OK“.


    fangsd datum" den Wert „1.11.2000“ ein, in das Feld „Enddatum“ tragen Sie den
    „31.12.2000“ ein. Übernehmen Sie die Werte mit „OK“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_82_2.png)


    4 Möchte jetzt jemand in diese Zelle Daten außerhalb des Gültigkeitsbereichs eingeben,
    erscheint eine Fehlermeldung.


    # Rechnen mit richtigen Begriffen


    Sie erstellen Formeln in Excel leichter, wenn Sie mit so genannten „Namensbereichen“
    rechnen. Bei dieser Art der Berechnung fassen Sie Zellenblöcke zu Bereichen zusammen
    und weisen


    diesen Blöcken einen möglichst eindeutigen Namen zu. Dieser ist dadurch global
    in der gesamten Arbeitsmappe verfügbar. Dann geben Sie bei der Formelerstellung
    lediglich die Namen ein.'
