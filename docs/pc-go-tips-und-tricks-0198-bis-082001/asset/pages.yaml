- pgno: 88
  md: '![](img/5f36a0372e5f0f300d0bad16e6a18053_88_0.png)


    # TIPP Bereiche festlegen


    Excel arbeitet grundsätzlich mit Zellbezügen. Das macht sich besonders bei Funktionen,
    wie zum Beispiel „Summe()“, bemerkbar. Excel erwartet im Klammerbereich eine beliebige
    Anzahl von Zellenbereichen. Mehrere Zellenbereiche werden durch ein Semikolon
    getrennt. Die folgende Aufstellung zeigt die Syntax zur Benennung von Zellenbereichen:


    | A1 | Die Zelle in Spalte A und Zeile 1 |

    | A1:C20 | Die Zellen von A1 bis A20 , die Zellen von B1 bis B20 sowie die Zellen
    von C1 bis C20 |

    | 2:2 | Alle Zellen in der Zeile 2 |

    | 2:10 | Alle Zellen in den Zeilen 2 bis 10 |

    | B:B | Alle Zellen in der Spalte B |

    | A:C | Alle Zellen in den Spalten A, B und C |


    # TIPP Suche ohne den Suchen-Dialog


    Wenn Sie unter Excel einen bestimmten Begriff suchen und eventuell ersetzen wollen,
    rufen Sie über die Befehle „Bearbeiten/Suchen…“ oder „Bearbeiten/Ersetzen…“ das
    Suchen-Dialogfenster auf. Ärgerlicherweise überdeckt das Dialogfenster oftmal
    den Großteil des Textes, den Sie suchen, so dass Sie die Fundstelle des gesuchten
    Wortes nicht sehen können. Deshalb sollten Sie nach dem ersten Suchergebnis auf
    die Schaltfläche „Schließen“ klicken und den Rest der Suche mit der Tastenkombination
    „Umschalten + F4“ erledigen.


    # Erstellen von Mustervorlagen


    Ähnlich wie in Word die Dokumentenvorlagen, gibt es für Excel die Mustervorlagen.
    Dabei handelt es sich um Arbeitsmappen, deren Arbeitsblätter bereits alles enthalten,
    was Sie für die Umsetzung einer bestimmten Aufgabe brauchen: Beschriftungen, Formatierungen,
    Formeln, Kopf- und Fußzeile, Druckbereiche, Kommentare und anderes mehr.


    1 Erstellen Sie eine neue Excel-Arbeitsmappe und legen Sie die Anzahl der Arbeitsblätter
    fest. Sie können die Arbeitsblätter auch mit eigenen Namen vorbelegen, indem Sie
    doppelt auf das Register des betreffenden Arbeitsblattes klicken und einen Namen
    für das Arbeitsblatt vergeben.


    2 Formatieren Sie die Arbeitsblätter nach Ihren Vorstellungen. Dabei können Sie
    auch Formeln hinterlegen.


    3 Wenn Ihre Arbeitsblätter nach Ihren Vorstellungen fertig sind, klicken Sie auf
    den Menübefehl „Datei“ und im folgendem Untermenü auf „Speichern unter“. Das Dialogfenster
    „Speichern unter“ wird eingeblendet.


    4 Klicken Sie auf den kleinen Pfeil rechts vom Auswahlfeld „Dateityp“ und wählen
    Sie den Eintrag „Mustervorlage“ aus. Der Speicherort wechselt automatisch in das
    Vorlagverzeichnis von Office.


    5 Excel legt die Mustervorlagen deshalb an zentraler Stelle ab, damit sie beim
    Aufruf von „Datei/Neu“ angezeigt werden können.


    6 Vergeben Sie einen Namen für die Mustervorlage und betätigen Sie anschließend
    die Schaltfläche „Speichern“.


    7 Aktivieren Sie jetzt den Menübefehl „Datei“ und im Untermenü „Neu“. Ihre neue
    Mustervorlage wird angezeigt und Sie können diese auswählen. Anders als die „Neu“-
    Schaltfläche aus der Standard-Symbolleiste erzeugt dieser Befehl keine neue, leere
    Arbeitsmappe. Statt dessen wird eine der gespeicherten Mustervorlagen herangezogen
    und eine Kopie davon als völlig eigenständige Arbeitsmappe erzeugt


    8 Veränderungen an dieser Tabelle wirken sich in keiner Weise auf die Mustervorlagen
    aus. Diese bleibt unverändert erhalten und Sie können diese jederzeit wieder als
    Vorlage benutzen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_88_1.png)


    # Zahlen in Klammern


    Excel hat eine widerspenstige Eigenart: In Klammern gesetzte Zahlen wandelt Excel
    in negative Zahlen um. Ohne eine Zwischenabfrage entfernt Excel die Klammern und
    setzt vor die Zahl ein Minuszeichen. Wie können Sie trotzdem Zahlen in Klammern
    schreiben?


    1 Markieren Sie alle Zellen, die ihre Klammer behalten sollen, mit gedrückter
    „Strg-Taste“. Durch das Drücken der „Strg-Taste“ während der Markierung können
    Sie problemlos voneinander unabhängige Zellen markieren.


    2 Wenn alle gewünschten Zellen markiert sind, wählen Sie im Hauptmenü die Option
    „Format“ und rufen den Befehl „Zellen“ auf.


    3 Das Dialogfenster „Zellen“ wird eingeblendet. Achten Sie darauf, dass das Registerblatt
    „Zahlen“ aktiviert ist. Wenn nicht, klicken Sie dieses an.


    4 Wählen Sie im Listenfeld „Kategorie“ den Listeneintrag „Benutzerdefiniert“ und
    geben das Benutzerdefinierte Format „_(#)“ oder in Worten „Semikolon, Klammer
    auf, Raute, Klammer zu“ ein.


    5 Ein Klick auf die Schaltfläche „OK“, und alle vorher markierten Werte werden
    eingeklammert dargestellt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_88_2.png)'
