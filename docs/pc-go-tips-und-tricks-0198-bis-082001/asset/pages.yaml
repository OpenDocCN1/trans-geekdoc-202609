- pgno: 93
  md: '# Autokorrektur denkt mit


    Cursor verwandelt sich in ein Kreuz. Drücken Sie jetzt die linke Maustaste und
    ziehen Sie diese langsam über die nächsten Zellen. Achten Sie dabei auf die Bildschirmanzeige:
    Über jede Zelle, mit der Sie mit der Mausanzeige fahren, wird in einem gelben
    Informationsfenster der jeweils folgende Wochentag angezeigt.


    2 Ziehen Sie den Cursor so lange, bis in der Anzeige „Sonntag“ erscheint und lassen
    Sie dann die linke Maustaste los. Die Wochentage werden automatisch in die Zellen
    eingetragen.


    3 Jetzt fehlt noch die Zeit. Diese soll in der Spalte „A“ eingetragen werden.
    Geben Sie daher in die Zelle „A2“ den Wert „8:00“ ein.


    4 Markieren Sie nun wieder das Quadrat in der rechten unteren Ecke der Zelle „A2“,
    der Cursor verwandelt sich in ein Kreuz. Ziehen Sie


    den Cursor bei gedrückter linker Maustaste in der Spalte „A“ nach unten und achten
    Sie dabei auf den Bildschirm: Bei jeder neuen Zelle wird die Uhrzeit, jeweils
    um eine Stunde hochgezählt, angezeigt.


    5 Lassen Sie die linke Maustaste los, sobald die Uhrzeit erreicht ist, an der
    Sie nichts mehr in Ihren Wochenplan eintragen wollen. Schon steht der Rahmen der
    Woche, Sie müssen nur noch Ihre Termine eingeben.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_93_0.png)


    # TIPP Rauten anstatt Werte?


    Bekommen Sie keinen Schrecken, wenn in Ihrer Excel-Tabelle plötzlich Rauten anstatt
    einem Wert auftauchen. Sie haben keinen Reifenfehler gemacht und sich auch keinen
    Virus eingefangen: Die Spaltenbreite ist lediglich zu schmal, um den Wert anzuzeigen.
    Ein Optimieren der Spaltenbreite durch einen Doppelklick auf den Trennstrich zur
    nächsten Spalte im Spaltenkopf verbreitert die Spalte, und die eingegebenen Werte
    werden angezeigt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_93_1.png)


    Tippfehler sind schnell gemacht. Eine häufige Ursache von Tippfehlern ist das
    Vertauschen von Buchstaben, so wird aus dem Begriff „sind“ „snid“ oder ähnliches
    Unsinniges. Viele der häufigsten Tippfehler kann Excel aber automatisch für Sie
    korrigieren, wenn Sie die Autokorrektur aktivieren.


    1 Aktivieren Sie den Menübefehl „Extras“. Im sich öffnenden Untermenü klicken
    Sie auf den Eintrag „Autokorrektur“. Das gleichnamige Dialogfenster öffnet sich.


    2 Setzen Sie ein Häkchen in das Auswahlkästchen „Zwei Großbuchstaben am Wortanfang
    ändern“, so sind Sie vor dieser Fehleingabe geschützt, denn die Autokorrektur
    wandelt den zweiten Buchstaben automatisch in einen kleinen Buchstaben um.


    3 Die Auswahl „Jeden Satz mit einem Großbuchstaben beginnen“ sorgt dafür, dass
    nach einem Satzzeichen, wie zum Beispiel einem Punkt, grundsätzlich groß weitergeschrieben
    wird.


    4 Mit einem Häkchen in das Auswahlfeld „Wochentage immer groß schreiben“ haben
    Sie keine Möglichkeit, Wochentage versehentlich klein zu schreiben.


    5 Ein häufiger Fehler: Versehentlich wird die Feststelltaste gedrückt, und alles
    wird groß geschrieben. Die Auswahl „Unbeabsichtigtes Verwenden der Feststelltaste
    korrigieren“ schützt Sie vor diesem Fehler.


    6 Besonders wichtig ist das Häkchen in dem Auswahlfeld „Während der Eingabe ersetzen“.
    Dadurch werden alle Einträge, die Sie in der unteren Liste sehen, bei einer fehlerhaften
    Eingabe ersetzt. Sie können diese Liste mit Ihren eigenen Einträgen ergänzen.
    Wenn Sie also wissen, dass Sie ein Wort häufig falsch schreiben, so tragen Sie
    es in der verkehrten Schreibweise in das Feld „Ersetzen“ ein. Das korrekte Wort
    schreiben Sie in das Feld „Durch“. Ein Klick auf die Schaltfläche „Hinzufügen“
    fügt Ihren neuen Eintrag der Liste hinzu.


    7 Ein Klick auf die Schaltfläche „OK“ übernimmt Ihre Einstellungen und schützt
    Sie künftig vor einem großen Teil von fehlerhaften Eingaben. Peter Schnoor/jh


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_93_2.png)


    # TIPP Breite Tabellen ausdrucken


    Tabellen wachsen schnell an. Wenn Ihre Tabelle nicht mehr auf eine Seite passt,
    haben Sie die Möglichkeit, diese Seite quer zu drucken. Mit der Befehlsfolge „Datei“
    und „Seite einrichten“ gelangen Sie zu dem Dialogfenster „Seite einrichten“. Klicken
    Sie hier auf die Option „Querformat“ und schließen Sie Ihre Einstellung mit einem
    Klick auf die Schaltfläche „OK“. Doch was, wenn Ihre Seite selbst dann nicht passt?
    Hier bietet Excel eine geniale Lösung: Wählen Sie aus dem Befehl „Seitenansicht“
    aus dem Menübefehl „Datei“. In der Seitenansicht wählen Sie den Befehl „Layout“.
    Das Dialogfenster „Seite einrichten“ wird eingeblendet. Klicken Sie nun im Bereich
    der „Skalierung“ auf die Option „Anpassen 1 Seite breit und 1 Seite hoch“. Schon
    skaliert Excel Ihre Datei so, dass sie auf eine Seite passt. Tabellen, die normalerweise
    etwa 1,5 Seiten beanspruchen, sind mit dieser Skalierung immer noch lesbar. Ein
    Klick auf die Schaltfläche „OK“ bringt Ihre Seite passend auf ein Blatt Papier.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_93_3.png)'
