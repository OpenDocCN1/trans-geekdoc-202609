- pgno: 40
  md: '# → Viewer


    In Computern herrscht ein undurchsichtiges Gewirr an verschiedenen Dateiformaten.
    Oft lassen sich bestimmte Dateien nur mit einem einzigen Programm öffnen. Das
    umgehen Viewer. Mit diesen kleinen, meist kostenlosen, Programmen können Sie Dateien
    aus anderen Anwendungen ansehen, aber nicht bearbeiten. Beim Excel-Viewer ist
    aber immerhin das Kopieren der Daten möglich.


    # TIP Excel-Viewer auf CD


    Auf unserer CD1, im Microsoft-Forum, finden Sie einen Viewer für Excel, den Sie
    selbst nutzen, aber auch an andere Anwender weitergeben können – damit diese wiederum
    Ihre Tabellen besser betrachten können. Diese Funktion bietet der →Viewer:


    Öffnen: Der Viewer zeigt Dateien von Excel für Windows ab Version 2.0 und von
    Excel für Macintosh ab Version 2.2a. Sie können Arbeitsmappen und Vorlagen ansehen,
    einschließlich Diagrammen, Notizen und Pivot-Tabellen. Das Ändern der Daten ist
    allerdings nicht möglich.


    Sortieren: Sie können die geöffneten Dateien mit einem Auto-Filter sortieren.
    Es stehen die Funktionen "Suchen", "Zoom" und "GeheZu" zur Verfügung.


    Kopieren: Es ist möglich, Daten über die Zwischenablage in eine andere Anwendung
    zu kopieren. Daten aus der Zwischenablage kann man jedoch nicht in die Tabellen
    einfügen.


    Drucken: Jedes einzelne Tabellenblatt oder einen ganzen Bereich können Sie ausdrucken.


    Links: Sollte in einer Excel-Datei ein Link zu Zielen auf der Festplatte, im Intranet
    oder im Internet bestehen, und ist der Internet Explorer auf dem System installiert,
    funktioniert auch das.


    # Arbeitsblatt in eine Datei sichern


    Manchmal ist es sinnvoll, ein Tabellenblatt aus einer umfangreichen Excel-Arbeitsmappe
    herauszulösen. Das vereinfacht beispielsweise das Teilen eines Berichtes, der
    von verschiedenen Personen oder Kunden ausgefüllt werden soll.


    1 Zuerst verkleinern Sie ein Dokument im Vollbild auf die Fensterdarstellung.
    Dazu klicken Sie auf das mittlere Symbol in der rechten oberen Bildschirmecke.


    2 Ziehen Sie das gewünschte Blattregister (am unteren Ende der Tabelle) mit der
    Maus in den Hintergrund der Arbeitsfläche von Excel; auf diese Weise erscheint
    das Blatt in einer eigenen Arbeitsmappe.


    3 Wollen Sie das Blatt nicht verschieben, sondern in eine eigene Datei kopieren,
    drücken Sie zusätzlich die [Strg]-Taste.


    4 Danach können Sie über den Menüpunkt "Datei" und hier "Speichern unter" dieses
    eine Arbeitsblatt einzeln speichern. Standardgemäß wird der Name "Mappe 1.xls"
    vergeben. Diesen können Sie natürlich nach Belieben verändern. Dies gilt auch
    für den Ordner, in dem die Datei abgelegt werden soll.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_40_0.png)


    # Autokorrektur der Jahreszahlen


    Excel versucht, zweistellige Jahreszahlen automatisch mit einer Angabe des Jahrhunderts
    zu komplettieren. Dabei richtet es sich nach folgender Regel: Geben Sie Jahre
    von 00 bis 29 ein, wandelt Excel die Angabe in ein Jahr des 21. Jahrhunderts um.
    Bei Zahlen zwischen 30 und 99 bleibt Excel beim 20. Jahrhundert.


    1 Die Eingabe "12.11.02" erscheint nach einem Druck auf [Enter] als "12.11.2002".
    Mit der


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_40_1.png)


    Eingabe des "23.04.98" erhalten Sie das Datum "23.04.1998".


    2 Ist diese Umwandlung nicht erwünscht, geben Sie die Jahreszahl mit dem Jahrhundert
    ein oder formatieren Sie die Zelle als Textfeld. Dazu wählen Sie in der Menüleiste
    "Format" und hier "Zellen". Im folgenden Auswahlmenü markieren Sie die Option
    "Text" und bestätigen das Ganze mit "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_40_2.png)


    # Deckblatt aus Word einfügen (Excel 95)


    Excel 95 und Excel 97 erlauben es, ein mit der Textverarbeitung angelegtes Deckblatt
    in die Tabelle 1 einzubauen. Im Gegensatz zu Excel 97 kann Version 95 das Blatt
    jedoch nicht richtig an die Größenverhältnisse der Tabelle anpassen: Die Zeilenumbrüche
    verschieben sich bei dem Versuch, die Größe zu skalieren. Aus diesem Grunde sollten
    Sie in Excel 95 den Import aus Word anders gestalten. In Excel 97 taucht dieses
    Problem nicht auf, Sie können das Objekt einfach über den "Einfügen", "Objekt"-Befehl
    in der Tabelle platzieren.


    1 Im ersten Schritt fügen Sie in die aktuelle Arbeitsmappe und deren letzte leere
    Tabelle das gewünschte Word-Dokument ein. Dazu verwenden Sie das Kommando "Einfügen",
    "Objekt", "Von Datei erstellen".


    2 Passen Sie die Größe der Abbildung nun nicht weiter an, sondern legen Sie das
    neue Objekt über "Bearbeiten", "Kopieren" oder [Strg + C] in die Zwischenablage.


    3 Klicken Sie auf das Register der Tabelle, in die Sie das Deckblatt einbauen
    wollen. Sie holen das Blatt nun aus der Zwischenablage, indem Sie "Bearbeiten",
    "Inhalte einfügen" wählen und als Quelle nicht "Word-Dokument" angeben, sondern
    "Picture (Bild)".


    4 In der letzten Tabelle löschen Sie das anfangs eingebaute Objekt. Zurück in
    der eben genutzten Tabelle können Sie das Bildobjekt nach Belieben skalieren,
    d.h. dessen Höhe und Breite verändern.'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# Benutzerdefinierte Kopf- und Fußzeilen


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_41_0.png)


    Kopf- und Fußzeilen können mehr darstellen als es zuerst den Anschein hat. Unter
    dem Menüpunkt "Datei", "Seite einrichten", "Kopfzeile/Fuß-


    zeile / Benutzerdefiniert" bietet Ihnen Excel 97 einen kompletten Editor, mit
    dem Sie eigene Vorstellungen umsetzen können.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_41_1.png)


    1 Es stehen dabei unter anderem die Uhrzeit, das Datum, der Registername und anderes
    mehr zur Verfügung. Sie können natürlich auch Text eingeben.


    2 Übrigens: Sollten Sie in einem Namenszug das Et-Zeichen (&) verwenden, tippen
    Sie es an dieser Stelle doppelt ein. Ein einzelnes Et versteht Excel als Steuerzeichen,
    das es nicht auf dem Bildschirm und am Drucker ausgibt.


    # Datumsfunktion: Letzter Tag des Monats


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_41_2.png)


    Für viele Aufgaben – beispielsweise bei Abrechnungen – muß genau der letzte Tag
    eines Monats in einer Zelle stehen. Problematisch wird es nur dann, wenn das Jahr
    und der Monat in jeweils einer anderen Zelle stehen.


    nat+1), bei dem Sie den letzten Tag über den ersten Tag des folgenden Monats ermitteln.


    1 Mit der Formel =DATUM(Zelle_Jahr;Zelle_Monat+1;1)-1 setzen Sie die Funktion
    DATUM() richtig um. Sie erhält drei Parameter, die sich auf das Jahr, den Monat
    und den Tag beziehen. Das heißt, die Funktion schaut zum Jahr (Zelle_Jahr) und
    zum nächsten Monat (Zelle_Mo-


    2 Excel bearbeitet die Datumswerte als serielle Zahlen, das heißt, man kann von
    diesem errechneten ersten Tag einfach eine 1 subtrahieren, um den Tag davor zu
    erhalten – also den letzten Tag des Vormonats.


    3 Und so lautet dann die komplette Formel: =DATUM(JAHR(HEUTE());MONAT(HEUTE())+1;1)-1


    # Intellimouse: Zoomfaktor einstellen


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_41_3.png)


    Vielleicht möchten Sie sich nicht erst umständlich durch eine größere Tabelle
    scrollen, sondern Details schnell über eine verkleinerte Darstellung suchen. Das
    ist sehr einfach möglich, wenn Sie eine Intellimouse besitzen. Leider wird diese
    Funktion nur bei der Microsoft IntelliMouse unterstützt. Klicken Sie auf "Extras",
    "Optionen" und wechseln


    Sie dort in das Register "Allgemein". Aktivieren Sie darin die Option "Bildlauf
    mit IntelliMouse". Zwar bewirkt diese Option kein Scrollern, wenn Sie das Rädchen
    der Maus drehen, aber sie zoomt die Tabelle über feine Stufen in die maximale
    Vergrößerung. Dazu drehen Sie das Rädchen auf sich zu bzw. von sich weg, um es
    zu verkleinern.


    # Inhalte aus dem Internet nutzen (Excel 97)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_41_4.png)


    Durch die immer engere Anbindung an Internet und Intranet kommt auch Excel in
    Kontakt mit Grafiken aus diesen Quellen. Darauf reagiert ein neuer Filter, den
    Sie im Menü "Einfügen" unter Grafik finden. Damit können Sie die wichtigsten Grafikformate
    (GIF und JPG) in die Tabellen einfügen. Weiter verfügt Excel wie die anderen Programme
    aus Office 97 über einen Assistenten, mit


    dessen Hilfe Sie eigene Diagramme im Internet publizieren können. Sie finden ihn
    unter "Extras", "Assistent", "Web-Formular". In sechs Schritten bauen Sie damit
    ein Formular zusammen, das – als Web-Seite eingerichtet – die eingegebenen Daten
    regelmäßig an einen Server zur Auswertung zurückliefern kann. Halten Sie sich
    einfach an den Assistenten.'
  merge: -1
  img_proc: true
- pgno: 42
  md: '# Excel-Tips

    finden Sie auf der CD1/

    Hauptmenü/Workshop/Tips


    # TIP Textfelder statt Kommentare


    Statt mit Kommentaren können Sie eine Excel-Tabelle auch mit Textfeldern erläutern.
    Das hat den Vorteil, dass sie im Gegensatz zu Kommentaren stets eingeblendet sind.
    So wird''s gemacht: Klicken Sie zunächst auf das "Zeichnen"-Symbol

    Nun erscheint am unteren Bildschirmrand die Zeichnen-Symbolleiste. Klicken Sie
    hier auf das "Textfeld"-Icon.

    Bewegen Sie den Cursor nun auf eine freie Stelle in der Excel-Tabelle, klicken
    Sie mit der Maustaste dorthin und halten Sie die Taste gedrückt. Ziehen Sie den
    Cursor soweit, wie Sie die Größe des Textfeldes einstellen


    # TIP Im Bereich bewegen


    Manchmal ist es sinnvoll, Daten in einen markierten Bereich einzubeben. Mit folgenden
    Tasten bewegen Sie sich innerhalb des Bereichs:

    "Enter": Eine Zelle nach unten

    "Umschalter"+"Enter": Eine Zelle nach oben

    "Tab": Eine Zelle nach rechts

    "Umschalter"+"Tab": Eine Zelle nach links


    # TIP Wo bleiben die Kommentare?


    Sind die Kommentare in Excel 97, obwohl sie sicher in der Tabelle integriert sind,
    nicht auf dem Bildschirm zu sehen, muß die Ansicht aktiviert werden. Öffnen Sie
    über "Extras", "Optionen" die Registerkarte "Ansicht" und setzen Sie bei "Kommentare"
    vor "Nur Indikatoren" einen Punkt mit der Mausklick und schließen Sie mit "OK".


    # Textdateien importieren


    Wenn Sie Daten aus anderen Dateiformaten in Excel importieren möchten, so bietet
    die 97er-Version bereits eine Reihe Dateitypen, die unmittelbar übernommen werden
    können. Aber auch Textdokumente lassen sich einbinden: Damit später alles stimmt,
    hilft Ihnen hierbei der Text-Assistent.


    +   1 Nach Mausklicks auf den Menüeintrag "Datei" und "Öffnen" wählen Sie zunächst
    im Feld "Dateityp" den Eintrag "Textdateien". Wechseln Sie dann in das Verzeichnis,
    in dem sich die zu importierende Textdatei befindet, und klicken Sie doppelt auf
    die Datei.


    +   2 Im ersten Schritt des Text-Assistenten entscheiden Sie, ob die Unterteilung
    in Excel-Spalten nach Trennung durch Sonderzeichen wie Kommas oder aufgrund einer
    festen Breite erfolgen soll: In aller Regel sollten Sie die erste Option wählen.
    Im unteren Teil des Fensters sehen Sie bereits die Daten in der Vorschau.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_42_0.png)


    +   3 Sehen Sie bereits in der Vorschau, daß die einzelnen Daten nicht wie gewünscht
    getrennt wurden, klicken Sie auf "Abbrechen" und bearbeiten die Daten mit einem
    Textverarbeitungsprogramm nach. Dort haben Sie weit mehr Möglichkeiten, die Daten
    durch systematisches Ersetzen bestimmter Zeichen "in Form" zu bringen. Diese zusätzliche
    Arbeit lohnt sich auf jeden Fall!


    +   4 Mit "Weiter" öffnet sich der nächste Schritt des Assistenten: Hier legen
    Sie fest, welche Sonderzeichen die Daten nach Spalten trennen soll. Unter "Anderes:"
    können Sie ein Zeichen nach Wahl eingeben.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_42_1.png)


    +   5 Zum letzten Schritt gelangen Sie wieder mit einem Klick auf "Weiter". Hier
    legen Sie das Datenformat der einzelnen Spalten fest. Markieren Sie zunächst die
    erste Spalte und wählen Sie dann das Format aus.


    +   6 Fahren Sie mit den weiteren Spalten analog fort und klicken Sie schließlich
    auf "Ende". Mit den übernommenen Daten können Sie nun wie gewohnt weiterarbeiten.


    # Nur Excel 97: Kommentare im Wirrwarr


    Schnell ist eine Excel-Tabelle angefüllt mit Zahlen. Doch wissen Sie oder andere
    auch noch in Monaten, was sich dahinter verbirgt? Hier helfen Kommentare weiter.
    Mit diesen kurzen Passagen können Sie jeder einzelnen Zelle eine Erläuterung zufügen.


    +   1 Markieren Sie die Zelle, der Sie einen Kommentar zuordnen möchten. Klicken
    Sie in der Menüleiste auf "Einfügen" und "Kommentar". Ein kleines Fenster mit
    dem Namen des aktuellen Bearbeiters, in das Sie unmittelbar schreiben können,
    blendet sich ein.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_42_2.png)


    +   2 Sind Sie mit dem Beschreiben fertig, so klicken Sie einfach irgendwo auf
    die Tabelle


    Ie: Das Kommentarfenster verschwindet, und die Zelle ist mit einem kleinen roten
    Dreieck rechts oben markiert.


    +   3 Sobald Sie den Cursor auf diese Zelle bewegen, wird der Kommentar eingeblendet.


    +   4 Möchten Sie den Kommentar noch einmal überarbeiten, so markieren Sie die
    entsprechende Zelle und öffnen über "Einfügen", "Kommentar bearbeiten" das Schreibfeld.
    Ist Ihnen das Kommentarfeld zu klein, so ziehen Sie es mit der Maus einfach größer,
    indem Sie auf die Seitenmarkierungen klicken.


    +   5 Zum Verbergen der Kommentare rufen Sie über den Eintrag "Extras" in der
    Menüleiste, "Optionen" die Registerkarte "Ansicht" auf. Dort klicken Sie bei "Kommentare"
    den Kreis vor "Keine" an und schließen mit "OK".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_42_3.png)'
  merge: -1
  img_proc: true
- pgno: 43
  md: '# Datenabfragen richtig gestellt


    In umfangreichen Tabellen von Hand nach bestimmten Datensätzen zu suchen, macht
    keinen Sinn: Excel stellt Ihnen automatisch die Daten zusammen, die Ihren Kriterien
    entsprechen. Als Beispiel soll die dargestellte Shareware- und Freeware-Sammlung
    dienen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_43_0.png)


    1 Aktivieren Sie über den Menüeintrag "Daten", "Filter" die Funktion "Autofilter".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_43_1.png)


    2 Oben rechts erscheint in jeder Spalte nun ein schwarzer Pfeil. Sollen in diesem
    Beispiel sämtliche deutschen Programme ausgewählt werden, so hilft ein Klick in
    der Spalte "Sprache" auf den schwarzen Pfeil. Nach dem Markieren von "d" (für
    Deutsch) in der Liste, wird nur noch die deutsche Software eingeblendet. Als Zeichen,
    daß Sie eine Auswahl getroffen haben, wechselt der Pfeil seine Farbe nach blau.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_43_2.png)


    3 Haben Sie die Filterfunktion in einer Spalte genutzt, so steht sie in den übrigen
    nach wie vor offen. Die doppelte oder mehrfache Filterung würde es bei diesem
    Beispiel auch möglich machen, nur deutsche Programme bis zu einer bestimmten Dateigröße
    zu suchen.


    4 Darüber hinaus sind auch komplexere Anfragen möglich. Klicken Sie in einer Spalte
    auf den Pfeil und wählen Sie den Eintrag "Benutzerdefiniert". Im neu erscheinenden
    Dialogfeld können Sie auch innerhalb einer Spalte mit "und" sowie "oder" verknüpfen.
    Wenn Sie das Feld "Name" öffnen, so steht eine ganze Reihe von Kriterien zur Verfügung.
    Die Palette reicht von "beginnt mit" über "ist kleiner als" bis zu "enthält nicht".


    5 Über "Daten", "Filter" und "Alle anzeigen" wird der Filter wieder gelöscht.


    # Daten beim Excel-Start automatisch laden


    Wenn Sie stets mit denselben Arbeitsmappen arbeiten und diese nicht täglich neu
    laden möchten, können Sie diese beim Programmstart von Excel auch automatisch
    öffnen lassen. Dazu müssen die Dateien im "Startordner" von Excel abgelegt sein.


    1 Öffnen Sie dazu die Excel-Dateien, die automatisch geladen werden sollen. Nun
    müssen Sie sie nur noch in das richtige Verzeichnis speichern. Mit "Datei" und
    "Speichern unter" (schneller mit der Taste "F12") klicken Sie sich bis zum Ordner
    "Xlstart", einem Unterverzeichnis im "Office"-Ordner, vor und "Speichern" dort.
    Analog geht es weiter mit der nächsten Datei.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_43_3.png)


    2 Möchten Sie Ihre Daten lieber an der gewohnten Stelle auf der Festplatte belassen,
    so können Sie ein weiteres Verzeichnis als zusätzlichen Startordner definieren,
    aus dem das Datenmaterial beim Programmaufruf automatisch geladen wird.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_43_4.png)


    3 Über "Extras" in der Menüleiste sowie "Optionen" rufen Sie die Registerkarte
    "Allgemein" auf. Im unteren Teil tragen Sie im Feld "Zusätzlicher Startordner"
    das entsprechende Verzeichnis samt kompletter Pfadeingabe ein und schließen mit
    "OK" ab.


    4 Stellen Sie sicher, daß sich in den festgelegten Startordnern tatsächlich nur
    solche Dateien befinden, die Excel auch verarbeiten kann. Denn das Programm versucht
    sämtliche dort abgelegte Dateien zu öffnen – also auch solche mit völlig anderen
    Dateiformaten.


    # TIP Kommentare ausdrucken


    Möchten Sie die Kommentare in Excel 97 nicht nur auf dem Bildschirm sehen, so
    lassen sie sich auch ausdrucken: Über "Datei", "Seite einrichten" wählen Sie die
    Registerkarte "Tabelle". In der Mitte des Fensters stellen Sie im Feld "Kommentare:"
    entweder "Am Ende des Blattes" oder "Wie auf dem Blatt angezeigt" ein. Mit "OK"
    schließen Sie die Prozedur ab. Beim Ausdruck erscheinen nun auch die Kommentare.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_43_5.png)


    # TIP Die Übersicht behalten


    Um in großen Datenblättern die Übersicht zu behalten, ist die Teilung des Bildschirms
    in zwei oder mehr Fenster sinnvoll. So können Sie beispielsweise neue Werte eingeben
    und dennoch das neu berechnete Ergebnis sehen, selbst wenn es sich in einer weit
    entfernten Zelle befindet. Möchten Sie das Fenster vertikal teilen, so markieren
    Sie die Spalte, wo die Teilung erfolgen soll, und klicken Sie über die Menüleiste
    "Fenster" auf "Teilen". Analog teilt sich das Fenster horizontal, wenn Sie eine
    Zeile markieren. Nun können Sie sich in beiden Fensterteilen mit den Bildlaufleisten
    unabhängig voneinander bewegen. Mit "Fenster" und "Teilung aufheben" machen Sie
    die Einstellung rückgängig.


    # TIP Nur mit Kennwort öffnen


    Möchten Sie das Einsehen Ihrer Excel-Daten einschränken, so klicken Sie beim "Speichern
    unter" auf "Optionen" und tragen dort ein "Lese-/Schreibkennwort" ein.'
