- pgno: 72
  md: '# Eigene Listen zum automatischen Ausfüllen


    Mit der Funktion „AutoAusfüllen“ organisieren Sie Verwaltungsarbeit schnell und
    effektiv. Damit legen Sie beispielsweise eine Liste Ihrer Bekannten oder Ihrer
    Mitarbeiter an, die Sie jederzeit automatisch, komplett oder in Teilbereichen
    in Ihre Excel-Tabelle einfügen können.


    1 Klicken Sie in der Menüleiste auf den Befehl „Extras“ und im Untermenü auf „Optionen“.
    Aktivieren Sie das Register „AutoAusfüllen“.


    2 Um die Liste zu erstellen, wählen Sie im Fenster „Benutzerliste“ den Eintrag
    „Neue Liste“. Klicken Sie in das Fenster „Listeneinträge“, das sich rechts daneben
    befindet.


    3 Geben Sie hier die Einträge für die neue Liste ein. Achten Sie darauf, dass
    die Eingaben kein Komma oder Semikolon enthalten. Nach Eingabe eines jeden Begriffs
    führen Sie mit der „Enter-Taste“ einen Zeilenumbruch durch.


    4 Wenn die Liste komplett ist, übernehmen Sie sie mit „Einfügen“. Die neue Liste
    fügt Excel nun in das linke Fenster, die „Benutzerliste“, ein. Mit „OK“ schließen
    Sie ab.


    5 Sind die Daten schon in einer Tabelle enthalten, brauchen Sie diese nicht neu
    zu erfassen. Sie können eine „AutoAusfüllen-Liste“


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_72_0.png)


    auch aus einer bestehenden Tabelle übernehmen. Rufen Sie dazu das Register „AutoAusfüllen“
    wie beschrieben auf, und geben Sie in das Dialogfeld „Liste aus Zelle importieren“
    den zu übernehmenden Bereich ein. Klicken Sie auf „Importieren“. Excel fügt jetzt
    die markierten Begriffe als Liste ein und übernimmt diese Liste als neuen Eintrag
    in das Fenster „Befehlsliste“ des Dialogs.


    6 Um die Liste in einem Arbeitsblatt zu aktivieren, geben Sie einen der Begriffe
    aus der „AutoAusfüllen-Liste“ ein und klicken die Zelle an. Zeigen Sie auf den
    Anfasser rechts unten auf dem Markierungsrahmen. Wenn der Cursor die Form eines
    Pluszeichens annimmt, markieren Sie den gewünschten Ausfüllbereich und lassen
    die Maustaste los. Excel trägt alle Begriffe Ihrer selbstdefinierten Liste in
    den markierten Bereich ein.


    # TIPP Tabellenhintergrund in Farbe


    Manche Arbeitsblätter erscheinen mit dem sterilen Weiß als Hintergrund zu blass.
    Wählen Sie statt dessen einen farbigen Hintergrund. Dazu markieren Sie die gesamte
    Tabelle mit einem Klick auf die Schaltfläche links neben der Spaltenüberschrift
    „A“ und über der ersten Zeile. Benutzen Sie in der Menüleiste den Befehl „Format“
    und im folgendem Untermenü „Zellen“. Klicken Sie das Register „Muster“ an. In
    der Farbpalette wählen Sie die gewünschte Hintergrundfarbe aus und schließen mit
    „OK“. Schon ist Ihr Arbeitsblatt farbig hinterlegt.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_72_1.png)


    # TIPP Zeilenumbruch in der Zelle


    Um einen Zeilenumbruch innerhalb einer Zelle zu erzwingen, wenden Sie einen Trick
    an. Denn mit der „Enter“-Taste allein wechselt Excel in eine neue Zelle. Erst
    wenn Sie die „Alt“- und die „Enter“-Taste gleichzeitig drücken, erhalten Sie einen
    Zeilenumbruch innerhalb einer Zelle.


    # Zeit bis zu einem Ereignis ausrechnen


    Mit Excel können Sie sich die Anzahl der Tage bis zu einem Ereignis, beispielsweise
    einem Geburtstag oder bis zum Urlaub, ausrechnen lassen.


    1 Geben Sie zum Beispiel in die Zelle „A1“ Ihren nächsten Urlaub ein, in unserem
    Rechenbeispiel den 1.8.2000.


    2 In die darunter liegende Zelle „A2“ geben Sie die Formel „=heute()“ ein. Dadurch
    wird das aktuelle Systemdatum Ihres PC in diese Zelle geschrieben.


    3 Im Feld „A3“ tragen Sie die Berechnungsformel „=A1-A2“ ein.


    4 Excel gibt die Anzahl der Tage als Datum aus. Hier hilft ein Trick weiter: Klicken
    Sie im Menü auf „Format“ und im folgenden Untermenü auf „Zellen“. Aktivieren Sie
    im eingeblendeten Dialogfenster „Format“ das Register „Zahlen“. Stellen Sie das
    Zellenformat im Bereich „Kategorie“ auf „Standard“. Excel gibt Ihnen so die Anzahl
    der verbleibenden Tage bis zum Ereignis an.


    len Sie das Zellenformat im Bereich „Kategorie“ auf „Standard“. Excel gibt Ihnen
    so die Anzahl der verbleibenden Tage bis zum Ereignis an.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_72_2.png)


    5 Ist das eingegebene Datum schon vorbei, wird dies mit einer negativen Zahl ausgedrückt.
    Durch die Funktion „=heute()“ berechnet Excel die Anzahl der Tage bei jedem Start
    der Arbeitsmappe neu. Dabei wird der Wert von „Heute“ immer aktualisiert.'
  merge: -1
  img_proc: true
- pgno: 73
  md: '# Systemdaten mit Excel abfragen


    Mit einer Sonderfunktion fragen Sie in Excel systemspezifische Daten ab. Die Ergebnisse
    lassen Sie dann in Zellen anzeigen. Dazu kombinieren Sie die Sonderfunktion „Info“
    mit einem der erlaubten Parameter.


    ```

    =INFO(„version“)

    =INFO(„rechenmodus“)

    =INFO(„dateienzahl“)

    =INFO(„gesamtspeich“)

    =INFO(„benutztspeich“)

    =INFO(„verfspeich“)

    ```


    1 Tippen Sie die Information ein, die als Systeminformation ausgegeben werden
    sollen. Geben Sie in die nächste Zelle rechts daneben die Funktion „=INFO(„system“)“
    ein. Als Ergebnis wird die Angabe zu Ihrem aktuellen System ausgegeben.


    2 Geben Sie in die folgenden Zellen die möglichen Parameter zur Funktion „Info“
    ein:

    =INFO(„system“)

    =INFO(„sysversion“)

    =INFO(„Verzeichnis“)


    3 Als Ergebnis erhalten Sie die jeweiligen Systeminformationen.


    A | B | C | D

    1 | System | | PCDOS

    2 | SysVersion | | Windows (32-bit) 4.10

    3 | Verzeichnis | | C:\Eigene Dateien\

    4 | Version | | 8.0

    5 | RechenModus | | Automatisch

    6 | DateienZahl | | 9

    7 | GesamtSpeich | | 1370400

    8 | BenutzSpeich | | 3218224

    9 | VerfSpeich | | 1048576


    # TIPP Schnell zu absoluten Adressen


    Excel unterscheidet zwischen absoluten und relativen Zelladressen. Das ist wichtig,
    wenn Sie zum Beispiel eine Formel mit relativen Adressen wie „Summe(A3:B5)“ von
    einer Tabellenzelle in eine andere kopieren. Dabei passt Excel die in der Formel
    enthaltenen Adressen automatisch dem jeweiligen Zielblatt an. Das ist nicht immer
    erwünscht. Kopieren Sie Formeln mit absoluten Adressen wie etwa „Summe($A$3:$B$5)“,
    ist dies nicht der Fall. Das Dollarzeichen weist Excel an, „absolut“ zu kopieren.
    Der Zellenbezug bleibt in diesem Fall erhalten. Wie wandeln Sie jedoch relative
    Zelladressen in absolute Adressen um – und umgekehrt? Doppelklicken Sie dazu in
    das Feld mit der gewünschten Formel, und markieren Sie die Formel. Drücken Sie
    die „F4“-Taste. Die Formel wird in eine absolute Adresse gewandelt. Betätigen
    Sie anschließend die „Enter“-Taste – damit ist die relative Adresse zu einer absoluten
    geworden. Das Ganze funktioniert auch umgekehrt. Sie müssen dazu allerdings mehrmals
    auf die „F4“-Taste drücken, da jedes Dollarzeichen einzeln entfernt wird.


    # Teile von Formeln überprüfen


    Excel bietet eine nützliche Hilfe, um Fehler in komplexen Formeln zu finden. Sie
    können Bereiche einer Formel berechnen und auf diese Weise herausfinden, welcher
    Teil der Formel ein Problem verursacht. Durch diese separate Formelprüfung lassen
    sich Fehler schnell lokalisieren.


    1 Klicken Sie doppelt auf die Zelle mit der Formel, die Sie prüfen wollen. Markieren
    Sie den Teilbereich der Formel, den Sie testen möchten. Drücken Sie die „F9“-Taste.
    Excel ersetzt daraufhin den markierten Formelbereich durch das Ergebnis der Berechnung.


    2 Erscheint statt des Ergebnisses eine Fehlermeldung des Assistenten, ist wahrscheinlich
    dieser Teil der Formel für das Problem verantwortlich.


    3 Korrigieren Sie den fehlerhaften Formelteil. Prüfen Sie den Teil der Formel
    erneut, bis keine Fehlermeldung mehr auftaucht. Klicken Sie zum Abschluss auf
    die „Esc“-Taste, damit Excel den Prüfmodus wieder verlässt.


    Nov | 112.000,00 DM | 29% | 32.480,00 DM | 35.780,00 DM | F9

    Dez | 199.000,00 DM | =SVERWEIS(B13;0,0;10000;0,06;15000;0,09;20000;0,12;50000;0,24;100000;0,29;9)

    913.000,00 DM | #BEZUG! | #BEZUG! | #BEZUG! | #BEZUG!


    # TIPP Informationen hinterlegen


    Viele vergessen, das Eigenschaftenfenster auszufüllen, wenn Sie eine Arbeitsmappe
    das erste Mal speichern. Dabei können Sie hier wichtige Informationen hinterlegen.
    Hier hilft es, wenn Sie den Dialog „Eigenschaften“ beim ersten Speichern einer
    Datei automatisch einblenden lassen. Um diese Funktion einzuschalten, klicken
    Sie im Menü auf den Befehl „Extras“ und im folgenden Untermenü auf „Optionen“.
    Aktivieren Sie die Registerkarte „Allgemein“ und das Kontrollkästchen „Automatische
    Anfrage für Dateieigenschaften“. Mit einem Klick auf „OK“ schließt das Dialogfenster.
    Ab jetzt erscheint das Dialogfeld automatisch, wenn Sie eine Datei erstmals speichern.


    # Speicherort individuell einrichten


    Standardmäßig speichert Excel seine Dateien in dem Ordner „C:\Eigene Dateien“.
    Bevorzugen Sie allerdings einen anderen Ordner und wollen Sie nicht bei jedem
    Speichervorgang manuell diesen Ordner auswählen, so stellen Sie das Standardverzeichnis
    neu ein.


    übernehmen Sie Ihre Einstellungen. Die Dateien werden damit an Ihrem bevorzugten
    Speicherort abgelegt. Peter Schnoor/pm


    1 Klicken Sie in der Menüleiste auf „Extras“ und im Untermenü auf „Optionen“.
    Im Dialogfeld „Optionen“ aktivieren Sie die Registerkarte „Allgemein“.


    2 In das Dialogfeld „Standardarbeitsordner“ geben Sie Ihren bevorzugten Speicherpfad
    ein. Mit einem Klick auf die Schaltfläche „OK“


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_73_0.png)'
