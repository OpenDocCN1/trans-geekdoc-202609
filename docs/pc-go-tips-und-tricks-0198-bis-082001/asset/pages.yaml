  md: "+   3. Jetzt erscheint der „Schaltflächen-Editor“, mit dem Sie das Symbol bearbeiten.\
    \ Sie können die Icons beliebig verändern oder neu zeichnen.\n\n![](img/5f36a0372e5f0f300d0bad16e6a18053_71_0.png)\n\
    \n+   4. Um Einträge zu löschen, klicken Sie im Farbbereich auf das Feld „Entfernen“\
    \ und markieren in der Grafik die Pixel, die Sie entfernen wollen.\n+   \n+  \
    \ 5. Um die Grafik neu zu zeichnen, klicken Sie auf die gewünschte Farbe und setzen\
    \ die Pixel nach Ihren Vorstellungen in den Grafikbereich. Im unteren Bereich\
    \ sehen Sie unter „Ansicht“ eine Vorschau auf Ihr neues oder geändertes Symbol.\
    \ Mit einem Klick auf „OK“ speichern Sie Ihr Symbol.\n+   \n+   6. Wenn Sie jetzt\
    \ im „Anpassen“-Dialog auf die Schaltfläche „Schließen“ klicken, erscheint Ihr\
    \ neues Symbol in der Symbolleiste.\n\n# Veränderbare Werte berechnen\n\n# TIPP:\
    \ In mehreren Tabellen eingeben\n\nWollen Sie Daten in mehreren Arbeitsblättern\
    \ an der jeweils gleichen Zellenposition eingeben, so können Sie dies für alle\
    \ gewünschten Arbeitsblätter auf einmal erledigen. Markieren Sie dazu einmal eine\
    \ Frage kommend Tabelleblätter, indem Sie die Register am unteren Bildschirmrand\
    \ bei gedrückter „Strg-Taste“ nacheinander anklicken. Dadurch sind alle ausgewählten\
    \ Arbeitsblätter aktiv. Tragen Sie in Ihr Arbeitsblatt an beliebiger Stelle ein\
    \ Wort oder auch eine Formel ein. Damit erscheint dieser Wert oder diese Formel\
    \ ebenfalls in allen markierten Tabellenblättern.\n\n![](img/5f36a0372e5f0f300d0bad16e6a18053_71_1.png)\n\
    \nWie werden Sie die Markierung wieder los? Klicken Sie dazu auf ein beliebiges\
    \ Arbeitsblatt neben dem gerade markierten Arbeitsblatt. Jetzt ist die simultane\
    \ Markierung aufgehoben, und Sie können normal weitere Daten eingeben.\n\nWenn\
    \ Sie Ihre Lohnsteuer berechnen wollen, stehen Sie vor einer Schwierigkeit: Die\
    \ Steuersätze sind in Abhängigkeit des Einkommens gestaffelt. Je mehr Sie verdienen,\
    \ desto mehr Lohnsteuer bezahlen Sie. In solchen Fällen hilft die Funktion „SVERWEIS“\
    \ weiter. Diese Funktion arbeitet auf Grundlage einer Matrix.\n\n![](img/5f36a0372e5f0f300d0bad16e6a18053_71_2.png)\n\
    \n+   1. Im folgenden Beispiel berechnen Sie die Provision in Abhängigkeit des\
    \ Umsatzes. Geben Sie in ein leeres Arbeitsblatt unterschiedliche Umsätze ein.\
    \ Bauen Sie unterhalb der Umsatzliste eine Provisionsliste ein. Hierbei handelt\
    \ es sich um die in der Funktion „SVERWEIS“ benötigte Matrix.\n+   \n+   2. Beachten\
    \ Sie in der Matrix, dass Sie die Werte sortiert eingeben. Die Spalte mit den\
    \ Provisionen muss vor der Eingabe der Provisionswerte die Formatierung „Prozentformat“\
    \ erhalten. Markieren Sie dazu den Bereich, und wählen Sie in der Symbolleiste\
    \ „Prozentformat“.\n+   \n+   3. Klicken Sie in die Zelle mit dem Wert, dessen\
    \ Provision Sie errechnen wollen, im Beispiel ist es B2. Rufen Sie den Funktionsassistenten\
    \ auf, indem Sie auf das entsprechende Symbol in der Symbolleiste klicken. Im\
    \ Dialogfeld „Funktion einfügen“ wählen Sie die Kategorie „Matrix“ und die Funktion\
    \ „SVERWEIS“.\n+   \n+   4. Schieben Sie das schwebende Dialogfenster so weit\
    \ nach rechts, dass Sie sowohl die Tabelle als auch die Matrix sehen können. Klicken\
    \ Sie im Dialogfeld „Funktion einfügen“ auf „OK“.\n\n+   5. Das Dialogfeld „SVERWEIS“\
    \ erscheint. Als Erstes benötigen Sie das Suchkriterium. Es befindet sich im Beispiel\
    \ in Zelle B2. Klicken Sie im Dialogfeld „SVERWEIS“ in das Feld „Matrix“. Geben\
    \ Sie den Matrixbereich ein, im Beispiel B16 bis C24 (B16:C24). Der Bereich muss\
    \ absolute Zellbezüge enthalten. Das Ganze sieht im Beispiel so aus: „$B$16:$C$24“.\n\
    +   \n+   6. Bestimmen Sie den Spaltenindex, also in welcher Spalte der auszugebende\
    \ Wert stehen soll. Es handelt sich um den Provisionssatz in Spalte zwei der Matrix.\
    \ Tippen Sie im Beispiel also eine „2“ in das Feld „Spaltenindex“.\n+   \n+  \
    \ 7. Das Feld „Bereich_Verweis“ bleibt frei. Klicken Sie auf die Schaltfläche\
    \ „Ende“, schon wird die Formel übernommen. Die komplette Formel lautet also:\
    \ „=SVERWEIS(B2,$B$16:$C$24,2)“.\n+   \n+   8. Kopieren Sie die Formel in alle\
    \ relevanten Felder: Ihre Provisionstabelle ist fertig.\n\n# TIPP: So ersparen\
    \ Sie sich Tipparbeit\n\nDie Funktion „AutoEingabe“ ist raffiniert -doch oft wird\
    \ sie übersehen. Dabei erspart es viel Tipparbeit, wenn Sie Zellwerte automatisch\
    \ vervollständigen lassen. Geben Sie in eine Zelle zum Beispiel einmal „Hamburg“\
    \ ein. Tippen Sie in die darunterliegende Zelle „Berlin“ ein. Gehen Sie wieder\
    \ eine Zelle tiefer, und geben Sie ein „M“ ein. Aus Ihrem „M“ wird „Hamburg“.\
    \ Hier hat die „AutoEingabe“ zugeschlagen. Mit der Eingabetaste übernehmen Sie\
    \ den Eintrag. Diese Funktion gilt nur für die Spalte, in der Sie gerade arbeiten.\
    \ Sie schalten die „AutoEingabe“ aus oder ein, indem Sie in der Menüleiste auf\
    \ „Extras“ klicken und „Optionen“ auswählen. Aktivieren Sie das Register „Bearbeiten“\
    \ und schalten Sie das Kästchen „AutoEingabe für Zellwerte aktivieren“ ein oder\
    \ aus."
