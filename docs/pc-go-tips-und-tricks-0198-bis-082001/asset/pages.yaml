- pgno: 44
  md: '# Office-Tips: Excel


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_44_0.png)


    # Grundlagen


    # 63 Mehrere Arbeitsmappen in mehreren Fenstern


    Wollen Sie alle Arbeitsmappen, mit denen Sie arbeiten, auf einmal sehen, gibt
    es eine Möglichkeit:


    1 Öffnen Sie zunächst einmal alle Arbeitsmappen, die Sie benötigen. Wählen Sie
    in der Menüleiste "Fenster" und hier "Anordnen". Wählen Sie eine der Optionen
    und klicken Sie auf "OK". Um mehrere Tabellenblätter innerhalb der gleichen Arbeitsmappe
    anzusehen, wählen Sie aus dem Fenster-Menü die Option "Neues Fenster".


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_44_1.png)


    2 Wählen Sie nun "Fenster" aus der Menüzeile, um zum neuen Fenster zu wechseln.
    Wiederholen Sie diese Schritte für jedes Tabellenblatt, das Sie ansehen möchten.
    Wählen Sie dann aus dem Fenster-Menü "Anordnen". Aktivieren Sie das Kontrollkästchen
    "Fenster der aktiven Arbeitsmappe" am unteren Rand des Dialoges. Damit haben Sie
    die Tabellenblätter Ihrer Arbeitsmappe gleichzeitig auf dem Bildschirm.


    # 64 Spalten oder Zeilen ausblenden


    Wollen Sie eine Spalte kurzzeitig unsichtbar machen, dann klicken Sie zunächst
    einmal die Spaltenkennung (Spalten werden durch Buchstaben gekennzeichnet) an.
    Wählen Sie in der Menüleiste "Format" und hier "Spalte". Im Untermenü selektieren
    Sie "Ausblenden". Die Spalte ist verschwunden. Um sie wieder einzublenden,


    wählen Sie "Format", "Spalte" und dann "Einblenden". Dasselbe Verfahren funktioniert
    auch für das Ein-/Ausblenden von Zeilen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_44_2.png)


    # 65 Spalten und Zeilen einfügen


    Wollen Sie eine Spalte oder Zeile einfügen, dann klicken Sie auf den Spalten-
    oder Zeilenkopf neben dem einzufügenden Bereich. Neue Spalten werden immer rechts
    neben der Markierung, neue Zeilen immer darunter eingefügt. Klicken Sie dann mit
    der rechten Maustaste in den markierten Bereich und wählen Sie "Zellen einfügen".


    # 66 Neues Tabellenblatt einfügen


    Wollen Sie ein Tabellenblatt vor das gerade aktive einfügen, dann wählen Sie aus
    der Menüleiste "Einfügen" und hier "Tabelle". Zum Löschen rufen Sie die zu löschende
    Tabelle auf, wählen "Bearbeiten" und hier "Blatt löschen".


    # 67 Daten eingeben und bearbeiten


    Haben Sie in eine Zelle Daten eingegeben, dann müssen Sie immer erst die Return-Taste
    betätigen, wenn Sie die Daten weiterbearbeiten möchten. Statt dessen können Sie
    aber auch auf das grüne Häkchen in der Formel-Leiste klicken. Das hat denselben
    Effekt. Wollen Sie während der Eingabe Zeichen korrigieren, dann verwenden Sie
    die Rücktaste. Damit wird das zuletzt eingegebene Zeichen gelöscht. Halten Sie
    die Entf-Taste gedrückt, dann verschwindet der gesamte Zellinhalt. Um mehrere
    Zellinhalte zu löschen, klicken Sie in die oberste linke Zelle des Bereiches und
    ziehen Sie die Markierung bei gehaltener Maustaste über den gesamten zu löschenden
    Bereich. Nun drücken Sie die Entf-Taste.


    # 68 Formatierungen einer Zelle kopieren


    Haben Sie erst einmal eine Zelle fertig formatiert, können Sie ganz schnell alle
    anderen Zellen fertigstellen, die genauso aussehen sollen. Markieren Sie dazu
    nur die gerade fertiggestellte Zelle. Wählen Sie nun in der Symbolleiste das Symbol
    "Format übertragen". Nun markieren Sie die Zelle, der das gleiche Format zugewiesen
    werden soll. Wollen Sie das Format auf mehrere


    Zellen übertragen, dann doppelklicken Sie auf das "Format übertragen" Symbol.
    Erst dann können Sie das Format mehrmals übertragen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_44_3.png)


    # 69 Die ganze Tabelle formatieren


    Zur Gestaltung der gesamten Tabelle eignen sich die AutoFormate sehr gut. Markieren
    Sie zuerst den Bereich, den Sie gestalten möchten. Nun wählen Sie in der Menüleiste
    "Format" und hier "AutoFormat". Nun öffnet sich ein Dialogfeld. Klicken Sie im
    Auswahlfeld zu "Formate" die einzelnen Optionen an. Im rechten Fenster sehen Sie
    eine Vorschau. Haben Sie das Richtige gefunden, bestätigen Sie mit "OK". Wollen
    Sie nur Teile aus der AutoTabelle übernehmen, dann klicken Sie auf "Optionen".
    Nun können Sie selektieren, welche Formate Sie übernehmen möchten und welche nicht.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_44_4.png)


    # 70 Richtig in einer Tabelle navigieren


    Pfeiltasten: Sie bewegen sich immer eine Zelle in Pfeilrichtung weiter Bild nach
    oben/unten: Mit diesen Tasten kommen Sie immer eine Bildschirmseite nach oben
    oder unten. Strg+Pos1: Damit kommen Sie an den Anfang des Blattes Strg+Ende: Damit
    kommen Sie ans Ende des Datenbereiches. Sie können sich auch mit Hilfe der beiden
    Bildlaufleisten fortbewegen. Halten Sie dabei noch die Umschalt-Taste gedrückt,
    geht das Scrollen wesentlich schneller.


    # 71 Text oder Zahl in einer Zelle


    Excel unterscheidet bei Daten in Zellen grundsätzlich zwischen Zahlen und Texten.
    Sind Sie unsicher, ob Excel Ihre Eingabe richtig erkannt hat, gibt es eine Hilfe.
    Zahlen und Kalenderdaten werden grundsätzlich rechtsbündig dargestellt. Text wird
    linksbündig ausgerichtet. Die Ausrichtung können Sie danach aber immer noch selbst
    ändern.


