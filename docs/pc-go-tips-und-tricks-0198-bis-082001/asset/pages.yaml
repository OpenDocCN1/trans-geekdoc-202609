- pgno: 48
  md: 'scheinen. Wählen Sie zunächst das Pfeilsymbol. Setzen Sie den Pfeil an eine
    Diagrammsäule, danach klicken Sie auf das Textfeld. Ziehen Sie dieses an der Pfeilspitze
    auf. Hier können Sie erläuternden Text einfügen. Damit das Ganze noch etwas Farbe
    bekommt, wählen Sie die entsprechenden Füll- und Linienfarben.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_48_0.png)


    # Perfekt drucken


    # 97 Druckvielfalt und Seiteneinrichtung


    Excel erlaubt es Ihnen, eine Arbeitsmappe zu drucken, nur ein Blatt auszuwählen,
    Bereiche zusammenzufassen und noch vieles mehr. Klicken Sie auf die "Drucken"
    Schaltfläche in der Standard-Symbolleiste, dann wird nur das aktuelle Arbeitsblatt
    ausgedruckt. Wählen Sie dagegen "Datei" und dann "Drucken", dann können Sie eine
    ganze Menge weiterer Einstellungen vornehmen. Standardmäßig hat Excel die folgenden
    Einstellungen:


    |  |  |

    |---|---|

    | Seitenorientierung | Hochformat |

    | Vergrößerung | 100% |

    | Papiergröße | DIN A4 |

    | Oberer Rand | 2 cm |

    | Unterer Rand | 2 cm |

    | Linker Rand | 2 cm |

    | Rechter Rand | 2 cm |

    | Kopfzeile/Fußzeile | keine |

    | Blatt | keine Gitternetzlinien |


    # 98 Arbeitsmappen drucken


    Haben Sie eine Arbeitsmappe gespeichert, dann können Sie deren Inhalt auch komplett
    ausdrucken. Dazu wählen Sie "Datei" und "Drucken". Klicken Sie auf den Optionsschalter
    "Gesamte Arbeitsmappe" Alle Seiten auf allen Blättern werden gedruckt. Die Seitennumerierung
    wird über alle Blätter der Arbeitsmappe aufeinanderfolgend vorgenommen. Benötigen
    Sie mehrere Kopien, dann klicken Sie auf die Pfeilschaltflächen in der Gruppe
    "Kopien", um die Anzahl der Druckmuster zu bestimmen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_48_1.png)


    # 99 Mehrere Blätter drucken


    Sie können natürlich jedes einzelne Blatt einer Arbeitsmappe drucken. Doch einfacher
    ist es, wenn Sie alle zu druckenden Seiten erst einmal gruppieren und mit einem
    Mal ausdrucken. Dazu halten Sie die Strg-Taste gedrückt und klicken auf die Registerkarte
    jedes einzelnen Tabellenblattes. Wählen Sie nun in der Menüleiste "Datei" und
    "Drucken". Die Option "Ausgewählte Blätter" ist markiert. Klicken Sie nun auf
    "Vorschau", um zu sehen, was alles aus dem Drucker kommen wird. Sehen Sie hier
    nur einen Teil dessen, was Sie markiert haben, haben Sie eventuell vorher einen
    Druckbereich festgelegt. Machen Sie dann die Gruppierung rückgängig, indem Sie
    die Umschalt-Taste gedrückt halten und auf ein Blattregister klicken. Wählen Sie
    "Datei" und "Druckbereich" und hier "Druckbereich aufheben". Führen Sie dies für
    jedes Blatt durch. Dann beginnen Sie wieder mit der Gruppierung.


    # 100 Manuelle Seitenumbrüche


    Wollen Sie nicht, daß Excel die Seiten automatisch umbricht, legen Sie eigene
    Umbrüche fest.


    +   1. Positionieren Sie den Cursor auf der Zeilenlinie, an der die neue Seite
    starten soll. Wählen Sie "Einfügen" und "Seitenwechsel" in der Menüleiste. Klicken
    Sie auf die Schaltfläche "Seitenumbruch-Vorschau" im Menü "Ansicht". Hier können
    Sie auch den Beginn des Seitenwechsels verändern, indem Sie die Maus darauf bewegen
    und mit gedrückter Maustaste bewegen.


    +   2. Zum Entfernen eines Umbruchs positionieren Sie den Zeiger auf der Linie,
    an der Sie die Zeile umbrochen haben. Wählen Sie nun "Einfügen" und "Seitenwechsel
    aufheben". Einen automatischen Umbruch können Sie nicht entfernen. Einzige Möglichkeit:
    Sie setzen Ihren eigenen Umbruch oberhalb des automatischen. Setzen Sie ihn darunter,
    dann wird Excel beide Umbrüche übernehmen. Benötigen Sie mehrere Blätter mit einem
    Seitenumbruch an derselben Stelle, dann gruppieren Sie diese zunächst. Halten
    Sie die Umschalt-Taste gedrückt und klicken Sie auf das letzte Blatt der Gruppe.
    Nun setzen Sie den Seitenumbruch einmal, und er wird in alle markierten Blätter
    übernommen.


    # 101 Alles auf einer Seite ausdrucken


    Um Papier zu sparen und Ausdrucke übersichtlicher zu gestalten, können Sie auch
    einen Ausdruck auf einer Seite erzwingen. Dazu wird automatisch die Schriftgröße
    verringert. Achten Sie aber darauf, daß die Schrift nicht zu klein wird.


    +   1. Wollen Sie Ihr Arbeitsblatt auf eine Seite minimieren, dann öffnen Sie
    zunächst das entsprechende Blatt. Klicken Sie auf "Seitenansicht" im "Datei"-Menü.
    Sie sehen, wie viele Seiten Ihre Datei umfaßt.


    +   2. Schließen Sie nun die Seitenansicht und wählen Sie "Datei" und "Seite einrichten".
    Unter der Registerkarte "Papierformat" aktivieren Sie den Punkt vor "Anpassen"
    und stellen die Seitenzahl ein. Alternativ können Sie über den Punkt "Vergrößern/Verkleinern"
    einstellen, wieviel auf die Seite paßt. Dazu vergeben Sie entsprechend höhere
    oder niedrigere Prozentwerte. Ein Klick auf "Vorschau" zeigt Ihnen dann das Ergebnis.


    # 102 Quer und hoch ausdrucken


    Eine andere Methode, übersichtliche Ausdrucke zu bekommen, ist das Querformat.
    Öffnen Sie die entsprechende Seite der Tabelle und klicken Sie wiederum auf "Datei"
    und "Seite einrichten". Hier wählen Sie die Registerkarte "Papierformat". Klicken
    Sie Sie nun "Querformat" an. Wollen Sie alle Seiten des Arbeitsblattes im Querformat
    ausdrucken, dann gruppieren Sie die einzelnen Tabellenseiten, indem Sie sie bei
    gedrückter Strg-Taste alle markieren.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_48_2.png)


    # 103 Den Ausdruck auf dem Blatt zentrieren


    Excel druckt grundsätzlich zunächst in die linke obere Ecke eines Blattes. Haben
    Sie nun nur wenige Zeilen zu drucken, sieht das meist recht seltsam aus. Sie können
    den Ausdruck aber auch auf der Druckseite zentrieren. Wählen Sie "Datei" und "Seite
    einrichten". Klicken Sie auf das Register "Seitenränder" Markieren Sie die beiden
    horizontalen und vertikalen Kontrollkästchen am unteren Rand des Dialogfeldes.
    Klicken Sie auf OK. Wollen Sie den Effekt sehen, wechseln Sie zur Seitenansicht.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_48_3.png)


    # 104 Bereiche einer Tabelle drucken


    Sie können Excel dazu bringen, nur bestimmte Bereiche von Daten zu drucken.


    +   1. Markieren Sie dazu den Bereich, den Sie drucken möchten. Wählen Sie "Datei"
    und'
