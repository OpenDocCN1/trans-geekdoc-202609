  img_proc: true
- pgno: 60
  md: '# Formatierung in Abhängigkeit der Zellenwerte


    Bei Ergebnissen von Berechnungen in Zahlenkolonnen fallen "besorgniserregende"
    Werte nicht sofort auf. Das birgt das Risiko des Überlesens von kritischen Werten.
    In diesem Fall hilft die automatische Formatierung in Abhängigkeit der Zellenwerte.


    Wert ein und klicken Sie im unteren Dialogbereich auf die Schaltfläche "Format".
    Wählen Sie jetzt ein Format, zum Beispiel Schriftart "Fett" und Farbe "Rot" aus.
    Nach dem Festlegen der Formatierung wird Ihnen eine Vorschau auf das bedingte
    Format dargestellt.


    1 Erzeugen Sie eine Tabelle mit den Spalten "Produkt", "Einkaufspreis", "Verkaufspreis"
    und "Gewinn".


    2 Geben Sie Bezeichnungen für die Produkte und Preise für "Einkaufspreis" und
    "Verkaufspreis" ein.


    3 Berechnen Sie den jeweiligen Verkaufspreis aus der Differenz zwischen "Verkaufspreis
    – Einkaufspreis".


    4 Markieren Sie jetzt die Werte in der Verkaufsspalte.


    5 Klicken Sie im Menü auf "Format" und im folgenden Untermenü auf den Menüein
    trag "Bedingte Formatierung".


    6 Wählen Sie bei der "Bedingung 1" den Eintrag "Zellwert ist" und im nächsten
    Fenster aus dem Auswahlmenü zum Beispiel "Kleiner als". Geben Sie in das rechte
    Feld den gewünschten


    7 Wollen Sie weitere Bedingungen festlegen, so klicken Sie auf die Schaltfläche
    "Hinzufügen" im unteren Bereich des Dialogfensters. Verfahren Sie bei der Festlegung
    der bedingten Formatierung wie unter Punkt 6 beschrieben; legen Sie aber andere
    Auswahlkriterien und Formatierungen fest.


    8 Auf diese Art und Weise können Sie zum Beispiel Gewinne unterhalb eines von
    Ihnen festgelegten Wertes rot hervorheben lassen, oberhalb des Wertes beispielsweise
    grün.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_60_0.png)


    Excel-Tips finden Sie auf CD 1 unter Hauptmenü/Workshops/Tips


    # Das ist eine Pivot-Tabelle


    Pivot-Tabellen dienen zur verdichteten Darstellung von größeren Datenmengen. Die
    Daten können Sie zwar auch mit anderen Excel-Analyse-Werkzeugen auswerten, Pivot-Tabellen
    besitzen aber einen entscheidenden Vorteil: Während Sie bei normalen Excel-Analysen
    alle in Betracht kommenden Einträge, das heißt die Skala der Antwortmöglichkeiten,
    bereits kennen müssen, entdeckt eine Pivot-Tabelle bei der Auswertung die Antwortmöglichkeit
    en automatisch. Zusätzlich können Sie die Sortierung sowie die Teilsummen- und
    Gesamtsummenbildung einfach der Pivot-Tabelle überlassen, diese erledigt die Aufgabe
    optimal für Sie.


    # Festlegen des Euro-Formates


    Ab der Version Excel 2000 steht Ihnen standardmäßig das Euro-Zeichen zur Verfügung.
    Doch was unternehmen Sie, wenn Sie noch mit Excel 95 bzw. 97 arbeiten? Erstellen
    Sie sich das Euro-Format doch einfach selbst.


    Eingabe der Rauten mit dem Punkt erreichen Sie eine Tausender-Punkt-Trennung,
    durch die Eingabe von "0,00" eine dezimale Darstellung. Den Wert "EURO" geben
    Sie unbedingt in Anführungszeichen ein, damit die Darstellung korrekt erfolgen
    kann. Sollten Sie vergessen, die Angabe "EURO" in Anführungszeichen zu setzen,
    erzeugt Excel eine Fehlermeldung und Sie können die Formatierung nicht abschließen.
    pm


    1 Erstellen Sie zunächst ein Tabellenblatt mit einigen Werten. Markieren Sie anschließend
    diese Werte. Klicken Sie danach im Menü auf "Format" und im folgendem Untermenü
    auf den Menüein trag "Zellen". Klicken Sie im jetzt angezeigten Dialogfeld "Zellen"
    auf den Register "Zahlen". Auf der linken Seite des Dialogfeldes wird eine Spalte
    mit den vorhandenen Kategorien angezeigt. Auf der rechten Seite des Dialogfeldes
    sehen Sie die Vorschau der gerade markierten Kategorie. Klicken Sie nun auf die
    Kategorie "Benutzerdefiniert".


    2 Tippen Sie in das Feld "Formate" auf der rechten Dialogfeldseite folgende Zeichenfolge
    ein: #.##0,00 "EURO";-#.##0,00 "EURO". Durch


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_60_1.png)


    # Excel 2000


    "Das visuelle Handbuch" heißt der Untertitel dieses Buches zur Tabellenkalkulation
    von Microsoft. Der Autor versucht, die an sich etwas trockene Materie von Formeln,
    Zahlen und Tabellen einmal anders zu präsentieren, nämlich visuell. Texte müssen
    Sie kaum lesen, alles wird anhand von Symbolen, Pfeilen und Screenshots aus Excel
    vorgeführt. Konventionell präsentiert sich dagegen der Aufbau des Buches. Am Anfang
    wird die Bedienoberfläche erklärt, dann folgen die Grundlagen, und auch "Experten"-Wissen
    wie Pivot-Tabellen kommt nicht zu kurz. Dennoch: Das Buch richtet sich schließlich
    nicht nur an Einsteiger, sondern auch an diejenigen, die ein "normales" Buch über
    Excel nicht durcharbeiten wollen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_60_2.png)


