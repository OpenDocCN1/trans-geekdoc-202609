- pgno: 69
  md: '# Excel


    2 Klicken Sie auf das Register „Tabelle“ und wählen Sie innerhalb der Registerkarte
    „Tabelle“ das Eingabefeld für den Druckbereich aus.


    4 Wählen Sie mit der Maus den gewünschten Druckbereich aus. Excel überträgt die
    Koordinaten in das Dialogfeld.


    3 Geben Sie jetzt den Druckbereich ein. Komfortabler geht es mit der Schaltfläche
    „Dialog reduzieren“. Das Dialogfenster wird dann auf das Eingabefeld für den Druckbereich
    minimiert.


    5 Klicken Sie auf „Dialog reduzieren“. Das Fenster „Seite einrichten“ erscheint
    wieder in gewohnter Größe. Mit einem Klick auf „OK“ ist der Druckbereich festgelegt.


    # TIPP Fehlermeldungen im Klartext


    Excel meldet sich bei fehlerhaften Formeln und Verweisen mit Fehlermeldungen,
    die oftmals nicht die genaue Ursache des Fehlers erkennen lassen. Wir zeigen Ihnen
    deshalb die häufigsten Fehlermeldungen in der Übersicht.


    #Bezug! Dieser Fehlerwert deutet auf einen ungültigen Feldbezug hin. Sie haben
    ein Feld, das in der Formel vorkommt, gelöscht oder überschrieben.

    #DIV/0! Es wird versucht, durch Null zu teilen.

    #NAME? Der in der Formel benutzte Bereichsname wird nicht gefunden. Wurde er in
    Hochkommata gesetzt?

    #NULL! Sie haben in Ihrer Formel vermutlich ein Leerzeichen statt eines Kommas
    eingegeben.

    #WERT! Sie beziehen sich in Ihrer Formel auf einen falschen Feldtyp.

    #ZAHL! Es wurde ein falsches Argument gewählt.

    ######## Die Formel ist in Ordnung, aber das Ergebnis zu lang, es kann nicht dargestellt
    werden. Verbreitern Sie die Spalte.


    # Arbeitsblatt mit Hintergrund versehen


    Excel-Arbeitsblätter erhalten mit einem Hintergrundbild ein professionelleres
    Aussehen. Binden Sie also statt des üblichen weißen Hintergrunds eines Excel-Arbeitsblatts
    lieber ein Bild oder eine Grafik ein. Das erreichen Sie mit wenigen Mausklicks.


    den, doppelklicken Sie auf den Dateinamen. Schon wird der Hintergrund Ihres Arbeitsblatts
    mit dem entsprechenden Bild versehen. Bei kleinen Bildern erscheint der Hintergrund
    „tape­ziert“, das Bild wiederholt sich also immer, bis der Bildschirm damit gefüllt
    ist.


    1 Öffnen Sie das Arbeitsblatt, welches Sie mit einem Hintergrundbild versehen
    wollen.


    2 Klicken Sie im Menü auf den Eintrag „Format“. Im folgendem Untermenü bewegen
    Sie den Cursor auf den Eintrag „Blatt“. Im jetzt angezeigten Untermenü klicken
    Sie auf „Hintergrund“.


    3 Das Dialogfenster „Hintergrund“ öffnet sich, und Sie können nach der gewünschten
    Bild- oder Grafikdatei suchen. Haben Sie diese gefunden


    4 Um die zuvor vorgenommene Hintergrundeinstellung wieder rückgängig zu machen,
    aktivieren Sie die Befehlsfolge: „Format“, „Blatt“ und „Hintergrund löschen“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_69_0.png)


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_69_1.png)


    # Regelmäßig automatisch speichern


    Viele Excel-Nutzer vermissen die von Word bekannte Funktion, um Arbeitsmappen
    automatisch zu speichern. Es gibt jedoch einen Trick, um auch Excel-Arbeitsmappen
    automatisch zu speichern. Allerdings müssen Sie diese Funktionalität erst installieren.


    1 Legen Sie Ihre Excel- bzw. Office-CD in Ihr CD-ROM-Laufwerk ein.


    2 Klicken Sie im Menü auf den Eintrag „Extras“. Im sich nun öffnendem Untermenü
    klicken Sie auf den „Add-In-Manager“.


    3 Das Dialogfenster des „Add-In-Manager“ öffnet sich. Alle verfügbaren Add-Ins
    werden in einer Liste dargestellt, die mit einem Häkchen versehenen Add-Ins sind
    aktiviert.


    4 Aktivieren Sie die Option „Automatisches Speichern“, indem Sie auf das entsprechende
    Kontrollkästchen klicken. Bestätigen Sie mit „OK“ und folgen Sie den Anweisungen.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_69_2.png)


    5 Excel speichert jetzt Ihre Arbeitsmappe laut der voreingestellten Voreinstellung
    alle zehn Minuten. Um diese Zeiteinstellung zu verändern, klicken Sie im Menü
    auf „Extras“ und im folgendem Untermenü auf „Automatisches speichern“.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_69_3.png)


    6 Das Dialogfenster „Automatisches Speichern“ erscheint. Sie stellen hier die
    Minutenanzahl ein, nach der Excel Ihre Arbeitsmappe automatisch speichern soll.
    Mit einen Klick auf „OK“ übernehmen Sie Ihre neue Speicherzeit. Peter Schnnor/pm


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_69_4.png)


    # TIPP Teilbereiche ausdrucken


    Wenn Sie nur einen Teilbereich Ihrer Tabelle drucken möchten, gibt es einen unkomplizierten
    Weg zu diesem Teildruck: Markieren Sie den zu druckenden Tabellenbereich. Klicken
    Sie im Menü auf den Befehl „Datei“ und im Untermenü auf „Drucken“. Das Dialogfeld
    „Drucken“ öffnet sich. Aktivieren Sie die Option „Markierung“ im Feld „Drucken“.
    Mit einem Klick auf „OK“ drucken Sie den markierten Bereich.


    ![](img/5f36a0372e5f0f300d0bad16e6a18053_69_5.png)'
