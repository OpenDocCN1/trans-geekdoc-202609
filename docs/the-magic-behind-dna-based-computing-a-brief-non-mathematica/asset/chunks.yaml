    computing applications.


    University of Minnesota. (2023). New biocomputing method uses enzymes as catalysts
    for DNA-based molecular computing


    Jaekel, A., Stegemann, P., & Saccà, B. (2019). Manipulating enzymes properties
    with DNA nanostructures.


    Q. Liu, K. Yang, J. Xie and Y. Sun, "DNA-Based Molecular Computing, Storage, and
    Communications


    Wang, F., Li, Q., & Fan, C. (2023). The Evolution of DNA-Based Molecular Computing.


    Reif, J.H., Hauser, M., Pirrung, M., LaBean, T. (2006). Application of Biomolecular
    Computing to Medical Science: A Biomolecular Database System for Storage, Processing,
    and Retrieval of Genetic Information and Material


