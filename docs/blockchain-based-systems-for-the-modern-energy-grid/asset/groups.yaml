    ## Blockchain-enabled electric vehicle charging


    M. Jajini¹, N. Kamaraj², M. Santhiya³ and S. Chellam¹


    ¹Velammal College of Engineering and Technology, Madurai, Tamil Nadu, India, ²Thiagarajar
    College of Engineering, Madurai, Tamil Nadu, India, ³Department of Electrical
    and Instrumentation Engineering, Kongu Engineering College, Erode, Tamil Nadu,
    India


    ### 12.1 Introduction


    **Blockchain** is the emerging technology in the fields of secured sharing of
    medical data, cross-border payments, logistics and food selling, etc. Simply put,
    it is a decentralized, shared network computing that demonstrates the overall
    origin of the digital item. Blockchain is trying to extend its features in numerous
    new industries, given its high potential. With its expertise proven in the supply
    chain, banking, digital authentication, investment management, and the arts and
    music sector, it is now expanding into the fast-growing market of EV. The foremost
    barrier to EV adoption is range anxiety. The majority concern is about power capacity
    running out on long road journeys. This is due to the fact that electric chargers
    are not readily available everywhere and, as a result, of the absence of charging
    infrastructure, potential consumers remain hesitant to switch to EVs. As already
    said before, blockchain is a peer-to-peer (P2P) technology that enables users
    to share their chargers when not in use. Moreover, in turn, charger owners will
    be benefited by getting paid for using the chargers. It also allows people and
    organizations to exchange, purchase, and transfer extra energy between themselves
    without the intrusion of a central authority or general public having control
    over how and when transactions can happen.


    Experts think that by allowing P2P charging, this new blockchain enterprise will
    minimize drivers’ range anxiety and boost the desirability of EVs in the future.
    This chapter shows the relationship between the broad field of machine learning
    (ML) and blockchain. Since ML is a venture of artificial intelligence (AI) where
    systems can analyze information processed from data, identify patterns, and make
    decisions with little or no human intervention, ML with Blockchain in Fig. 12.1
    can create a deadly combination if utilized properly. Both are more or less like
    the two sides of a coin if used together. While blockchain helps to store correct
    data that is unaltered and permanent, ML can utilize this data to analyze data
    patterns and give accurate predictions.


    In blockchain’s P2P network, mobile apps are used by users to access participating
    homeowners’ locations to charge their EV. It always keeps track of the time taken
    by each vehicle to fully charge and the amount of energy consumed for the same.
    Further, a ledger account helps in the implementation of payment in digital mode
    from the driver to the charger owner linked in the network. With the data collected
    from the blockchain, the data can be used by the ML algorithm to predict the availability
    of fast charging ports nearby. This will reduce the waiting time and charging
    time of the vehicle and will also lead to hassle-free transportation even as drivers
    can get rid of anxiety rising from driving range issues.


    ![](img/3e2bd364e414892c24513d4362da1dd8_1_0.png)


    Figure 12.1 Characteristics of blockchain.


    ### Features of Blockchain:


    ## 12.2 Types of blockchain technologies


    ### 12.2.1 Public blockchain network


    Anyone can join public blockchains, and all the information is accessible by them.
    This makes blockchains suitable for firms that value transparency and trust concerns
    in data storage. As a result, NGOs and social support organizations can benefit
    from the public blockchain. The public blockchain is depicted in Fig. 12.2.


    Because of its public nature, the data stored by a public blockchain cannot be
    used for private-sector operations since the information is not secured for the
    use of just one entity or organization but can be accessed by anyone. Furthermore,
    public blockchains can be costly to maintain since they require nodes to function
    as miners and run either proof-of-work or proof-of-stake (PoS) algorithms (PoS).


    ### 12.2.2 Private blockchain network


    Because it provides a private network, the private blockchain is the right opposite
    of the public blockchain. It’s ideal for companies who desire a private network
    while still reaping the advantages of blockchain. They’re also centralized, which
    means a firm may govern the network without having to keep it accessible to the
    public.


    They provide all of the key benefits of a blockchain, as well as a method for
    corporate members to develop trust through immutability and security.


    The company can develop its own set of rules and operate the network according
    to its own needs, secure in private networks.


    ![](img/3e2bd364e414892c24513d4362da1dd8_2_0.png)


    Figure 12.2 Types of blockchain.


    ### 12.2.3 Consortium blockchain network


    Next, rather than a centralized node (private) or a decentralized (public) network,
    a consortium blockchain network is functioned by a group of organizations or nodes.


    A consortium blockchain is advantageous since it includes nodes that have been
    pre-selected.


    It’s great for a solution that necessitates cross-departmental cooperation. Supply
    chain, food, and medicine, for example, would all necessitate cross-brand collaboration.


    ### 12.2.4 Hybrid blockchain network


    Finally, we have the hybrid blockchain, which is the most recent blockchain technology
    type. This blockchain combines all of the advantages of both private and public
    blockchains with the least number of drawbacks.


    In actuality, the hybrid blockchain, like other blockchain technology types, has
    drawbacks though fairly minor ones.


    Hybrid blockchains appear to be ideal for a variety of prospective business models.


    ## 12.3 Blockchain applications


    ### 12.3.1 Peer-to-peer based energy exchange between renewable microgrids


    Grid-connected microgrids, as demonstrated by TERI, will be used for access to
    energy, P2P energy markets, and utility network management. The blockchain verifies
    the transactions and ensures security, safety, and while maintaining efficiency
    in each step of transaction processing with the help of digital ledger basics.
    The blockchain is a chain of several digital units that collects and shares replicas
    of a transaction such that each node recognizes what transaction actually happened
    at a specific point in time.


    A “transaction” is a method of exchanging data between two physically located
    nodes, the digital version of which is saved as a record on the blockchain, as
    shown in Fig. 12.3. The notion of cryptography, which falls under the domain of
    information security, is one of the bases on which blockchain technology is developed.
    Each physical node’s information is encrypted before being disseminated on a blockchain
    network using a private and public address key (Ping et al., 2020).


    ### 12.3.2 Peer-to-peer based vehicle charging


    With this strategy, the blockchain has been proposed as a supporting tool for
    accelerating the adoption of EV in India. Several vehicles commuting through their
    itineraries might be charged at privately created EV charging stations, and also
    the transaction of charging site owners’ bids, energy flow, accounting, and legitimate
    transaction closure might all be handled by the blockchain.


    The blockchain-enabled application could be used to increase the utilization of
    privately owned EV chargers through the proper linkages between EV customers and
    EV private owners in an attempt to compensate for a shortage of charging stations
    and to make greater use of existing facilities. EV owners can use the P2P mode
    of communication for accessing nearby charging stations to charge their vehicles’
    batteries.


    Owners of electric car charging (EC) stations can enroll themselves on blockchain-based
    mobile apps and can have the charging stations connected to the


    ![](img/3e2bd364e414892c24513d4362da1dd8_3_0.png)


    Figure 12.3 Energy exchange topology.

