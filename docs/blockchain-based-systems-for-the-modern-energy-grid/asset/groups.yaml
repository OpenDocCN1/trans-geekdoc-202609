    ## 区块链驱动的电动汽车充电


    M. Jajini¹, N. Kamaraj², M. Santhiya³ and S. Chellam¹


    ¹印度泰米尔纳德邦马杜赖 Velammal 工程技术学院，²印度泰米尔纳德邦马杜赖 Thiagarajar 工程学院，³印度泰米尔纳德邦埃罗德 Kongu
    工程学院电气与仪器工程系


    ### 12.1 引言


    **区块链**是医疗数据安全共享、跨境支付、物流和食品销售等领域的新兴技术。简而言之，它是一种去中心化、共享的网络计算，能够展示数字物品的完整来源。鉴于其巨大潜力，区块链正试图将功能扩展到众多新行业。凭借在供应链、银行业、数字认证、投资管理以及艺术和音乐领域得到验证的专业能力，它现在正在扩展到快速增长的电动汽车市场。电动汽车普及的最大障碍是里程焦虑。大多数人担心在长途旅行中电量耗尽。这是因为电动汽车充电器并不是随处可用，而且由于缺乏充电基础设施，潜在消费者仍然对改用电动汽车犹豫不决。如前所述，区块链是一种点对点（P2P）技术，使用户能够在充电器闲置时共享充电器。此外，充电器所有者也将因充电器被使用而获得报酬。它还允许个人和组织在彼此之间交换、购买和转移多余能源，而无需中央权威机构或公众控制交易发生的方式和时间。


    专家认为，通过允许 P2P 充电，这一新的区块链企业将减少驾驶员的里程焦虑，并提高未来电动汽车的吸引力。本章展示了机器学习（ML）这一广阔领域与区块链之间的关系。由于
    ML 是人工智能（AI）的一个分支，系统可以分析从数据中处理的信息、识别模式并在极少或无需人工干预的情况下做出决策，因此如果利用得当，ML 与区块链（见图
    12.1）可以形成一股强大的力量。两者如果一起使用，或多或少就像一枚硬币的两面。区块链有助于存储未更改且永久的正确数据，而 ML 可以利用这些数据分析数据模式并提供准确的预测。


    在区块链的 P2P 网络中，用户通过移动应用访问参与的家庭充电点位置来为电动汽车充电。它会一直记录每辆车完全充电所需的时间以及为此消耗的能量。此外，分类账账户有助于通过网络连接，以数字方式实现从驾驶员到充电器所有者的支付。利用从区块链收集的数据，ML
    算法可以使用这些数据来预测附近快速充电端口的可用性。这将减少车辆的等待时间和充电时间，同时也将带来无忧的交通体验，因为驾驶员可以摆脱由续航里程问题引起的焦虑。


    ![](img/3e2bd364e414892c24513d4362da1dd8_1_0.png)


    图 12.1 区块链的特性。


    ### 区块链的特性：


    ## 12.2 区块链技术的类型


    ### 12.2.1 公有区块链网络


    任何人都可以加入公有区块链，并且所有信息都对他们可访问。这使得区块链适合那些重视数据存储透明度和信任问题的公司。因此，非政府组织和社会支持组织可以受益于公有区块链。公有区块链如图
    12.2 所示。


    由于其公共性质，公有区块链存储的数据不能用于私营部门运营，因为信息不仅限于某个实体或组织使用，任何人都可以访问。此外，公有区块链的维护成本可能很高，因为它们需要节点充当矿工，并运行工作量证明或权益证明（PoS）算法（PoS）。


    ### 12.2.2 私有区块链网络


    由于提供专用网络，私有区块链与公有区块链正好相反。它非常适合那些希望拥有专用网络同时仍享受区块链优势的公司。它们也是中心化的，这意味着公司可以管理网络而不必将其对公众开放。


    它们提供了区块链的所有关键优势，以及一种让企业成员通过不可篡改性和安全性建立信任的方法。


    公司可以制定自己的规则，并根据自身需求操作网络，在私有网络中保持安全。


    ![](img/3e2bd364e414892c24513d4362da1dd8_2_0.png)


    图 12.2 区块链的类型。


    ### 12.2.3 联盟区块链网络


    接下来，联盟区块链网络不是由中心化节点（私有）或去中心化（公有）网络运行，而是由一组组织或节点运行。


    联盟区块链很有优势，因为它包含预先选定的节点。


    它非常适合需要跨部门协作的解决方案。例如，供应链、食品和医药都需要跨品牌协作。


    ### 12.2.4 混合区块链网络


    最后是混合区块链，它是最新的区块链技术类型。这种区块链结合了私有和公有区块链的所有优势，并且缺陷最少。


    实际上，混合区块链与其他区块链技术类型一样也有缺点，尽管相当轻微。


    混合区块链似乎非常适合各种潜在的商业模式。


    ## 12.3 区块链应用


    ### 12.3.1 可再生能源微电网之间的点对点能源交换


    正如 TERI 所证明的，并网微电网将用于能源获取、P2P 能源市场和公用事业网络管理。区块链借助数字分类账基础，验证交易并确保每一步交易处理的安全性和保障性，同时保持效率。区块链是由多个数字单元组成的链，它收集并共享交易的副本，使每个节点都能识别在特定时间点实际发生了什么交易。


    “交易”是两个物理位置节点之间交换数据的一种方法，其数字版本作为记录保存在区块链上，如图 12.3 所示。密码学概念属于信息安全领域，是区块链技术发展的基础之一。每个物理节点的信息在通过区块链网络传播之前，都会使用私人和公共地址密钥进行加密（Ping
    等人，2020 年）。


    ### 12.3.2 基于点对点的车辆充电


    通过这一策略，区块链被提议作为加速印度电动汽车普及的辅助工具。多辆按行程行驶的车辆可以在私人设立的电动汽车充电站充电，而充电站所有者的投标、能量流、结算和合法交易终结等交易也可以由区块链处理。


    区块链驱动的应用程序可以通过电动汽车客户和电动汽车私人所有者之间的适当连接，提高私人拥有的电动汽车充电器的利用率，从而弥补充电站短缺并更好地利用现有设施。电动汽车车主可以使用
    P2P 通信模式访问附近的充电站为车辆电池充电。


    电动汽车充电（EC）站的所有者可以在基于区块链的移动应用上注册，并将充电站连接到


    ![](img/3e2bd364e414892c24513d4362da1dd8_3_0.png)


    图 12.3 能源交换拓扑。


