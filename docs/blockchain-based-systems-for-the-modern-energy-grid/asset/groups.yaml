    ## 12.4.4 在发展此类框架时我们需要面对的困难


    为电动汽车充电是一个令人愉快又令人困惑的过程。使用了不同的机械原理，以及众多类型的车辆。充电时车辆与充电站进行通信，每个制造商都必须遵循此惯例。生态要求极其严格。充电站应在
    −20°C 至 +60°C（−4 至 140 华氏度）的温度范围内使用。电动汽车充电站的每个部件都必须满足这些要求，并在这些严苛条件下正常工作。我们最终找到了遇到的每个问题的解决方案。由于我们的电动汽车充电站的独立性，我们能够将各种改进项目分配给独立的工程师。我们的充电站概念不会获得配置资金，但我们预计能够与建筑师一起研究充电站服务当前场景的适用性。然而，作为概念验证，充电站应尽可能好地工作。


    ## 12.4.5 系统模型


    我们建议的基于区块链的电动汽车充电框架有三个要素：管理员、能源聚合商（EAG）和客户/电动汽车，并整合了四个阶段：介绍、注册、确认和充电，如图 12.8 所示。


    - 1. 为了获得充电管理访问权限，电动汽车将其身份登记在管理员处。

    - 2. 电动汽车与 EAG 相互核对。

    - 3. 能源聚合商促进交易。

    - 4. EAG 验证交易的合法性并将其记录在区块链网络环上。

    - 5. 方法论。


    区块链是一种复杂的萌芽技术，仍在开发中，未被充分理解，并且在大多数情况下尚未准备好用于关键应用。因此，我们提供了一种可靠的方法来识别应用程序用例是否适合区块链执行。此外，许多可能受益于区块链后端的请求依赖于遗留编程，使得必要的工程修改变得不可能。我们建议以下用于将区块链创新嵌入应用程序的系统，并使用图
    12.9 在以下案例研究中解释其实现：


    ### Stage 1

    找到复杂的团体以及它们之间存在的信任关系。如果连接中的信任程度不足以实现应用程序的目标，或如果它阻止了实现该目标所必需的活动，则将其命名为信任问题。


    ![](img/3e2bd364e414892c24513d4362da1dd8_10_0.png)


    图 12.8 整合所提电动汽车充电框架的区块链要素。


    ![](img/3e2bd364e414892c24513d4362da1dd8_10_1.png)


    图 12.9 嵌入应用中的区块链执行阶段。


    ### Stage 2

    开发一个最小的区块链框架，包含智能合约，以解决第一阶段确定的信任问题。如果需要替换遗留拓扑的一部分，则新拓扑应与现有接口密切相似，以便条件可以继续以减少的调整运行。


    ### Stage 3

    一旦信任缓解的区块链就位，其余结构可以分阶段随时间推移转移。这使得该技术能够从传统/区块链混合体演变为长期真正去中心化的系统。此技术将在本工作的其余部分用于我们的情境调查。


    ## 12.5 结论与未来愿景


    我们提供了一种评估去中心化能源系统中区块链可用性的方法。我们的策略基于这样一种假设，即解决信任问题是区块链的独特特征，而与各种分布式信息拓扑不同。我们接下来提供一项研究，确定信任困难，如何可以用区块链解决，以及使用
    Hyperledger Fabric 进行的概念验证开发 (Musavi & Wilson Young, 2014)。换句话说，所提出的执行与当前的继承后端一致。


    拥抱 DLT 是将大量精力投入到大量不同事业面前。在金融部门之外，能源部门是 DLT 可能产生最不寻常和有益的颠覆性影响的行业之一。基于 DLT 的计量到现金自动化可能会完全消除对折扣到零售中间商的需求，降低交易和运营成本。DLT
    有潜力加速 P2P 能源部门的发展，在该部门中，能源生产消费者在本地规模上进行交易。DLT 可能能够通过组织智能合约来协助矩阵执行者。DLT 使现实世界交易能够根据单独定义的规范自然运行。DLT
    可以通过与充电站能源分期付款协作并使驾驶员能够实现连续估计来改善电动汽车充电协调。DLT 可以协助从晶格边缘到云的安全和透明的信息协调，使数据能够在协作目的下稍后被捕获、存储和分析。


    展望未来，我们可以通过包含更多区块链功能来改进建议的架构。在这一“简化”商业模式图中，PO 和客户直接联系，一方提供电动汽车充电，对方为其付费。在这种真正的共享组织中，CSP（充电服务提供商）无需充当焦点。区块链上的链码可以处理客户与
    PO（物业所有者）之间的一切合作。 rather than relying on ad hoc analysis of their mass meter data,
    this information would be entered into the blockchain, allowing brilliant agreements
    to examine the billing system. 此外，而不是在靠近 CSP 节点的区块链网络上维护自己的节点，所有节点都将由 PO 承担监督责任，CSP
    的服务器拓扑结构促进了这一点。


