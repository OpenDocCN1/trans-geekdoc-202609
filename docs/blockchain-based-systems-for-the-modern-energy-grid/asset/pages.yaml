    is a catalog of data. The system eliminates the need for a central authority to
    validate transactions among different parties to avoid double-spending. Before
    being added to the ledger, each piece of data is mathematically encrypted and
    attached as a new "block" to the historical records chain, which is then validated
    by different consensus methods. Smart contracts are a club of conditions stored
    on the blockchain that activate transactions when the requirements are met and
    can also be encoded into the blockchain (Xiang et al., 2018).


