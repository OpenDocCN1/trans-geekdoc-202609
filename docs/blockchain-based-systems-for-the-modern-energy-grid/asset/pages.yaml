    understood, and, in most cases, not ready for critical applications. As a result,
    we provide a robust method for identifying if an application use case is fit for
    a blockchain execution. Furthermore, many requests that could benefit from a blockchain
    backend rely on legacy programming, making essential engineering modifications
    impossible. We propose the following system for embedding blockchain innovation
    into applications, and we explain its implementation in the following case study
