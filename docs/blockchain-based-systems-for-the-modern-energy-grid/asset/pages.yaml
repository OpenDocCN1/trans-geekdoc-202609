    # 12.4.3   Payment can be made in two ways


    To begin with, the EV owner can use a wallet program such as Jaxx, Coinbase, or
    Free wallet. Clients scan a QR code shown on the charging station’s touchscreen
    and enter their required amount. When the transaction is confirmed, the touchscreen
    instructs the car owner to attach the charging cable to his or her vehicle. The
    charging process begins automatically.


    The EV owner can also use an NFC card to pay. This card is known as the Ethan
