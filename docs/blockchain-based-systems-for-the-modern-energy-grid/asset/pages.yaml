    # 12.4.4   **Difficulties we need to confront while growing such a framework**


    Charging an EV is a delightfully perplexing procedure. Different mechanical principles
    are used, as well as numerous types of vehicles. The vehicle communicates with
    the charging station while charging, and each manufacturer must follow this convention.
    The ecological requirements are extremely stringent. The charging station should
    be used in the temperature range from −20°C to +60°C (−4 up to 140 Fahrenheit).
    Every component of an EV charging station must meet these requirements and work
    properly in these punishing conditions. We eventually found a solution to each
    problem we encountered. We were able to allocate various improvement projects
    to isolated engineers due to the seclusion of our EV charging station. Our charging
    station concepts will not receive configuration funds, but we expect to be able
    to work out the station’s suitability to serve current scenarios with architects.
    However, as a proof-of-concept, the charging station should work as best as can
    be wanted.


    # 12.4.5   **System model**


    Our suggested charging framework for EVs based on blockchain has three elements:
    an administrator, an energy aggregator (EAG), and a client/EV, and it consolidates
    four stages: introduction, enlistment, confirmation, and charging as shown in
    Fig. 12.8.


    +   1. To obtain charging administration access, EV enlists their personality
    with the administrator.

    +   2. Electric Vehicle and EAG cross-check each other.

    +   3. Energy Aggregator facilitates trade.

    +   4. EAG verifies the legitimacy of the transaction and logs it on blockchain
    network circles.

    +   5. Methodology.


