- raw: '# BLOCKCHAIN-BASED NON-FUNGIBLE TOKENS


    Even though fungibility has been explained before, we''re going to dig deeper
    in this following chapter. Fungibility is defined as "able to substitute or be
    swapped by another duplicate item." To better understand what can comprise a non-fungible
    asset, simply think about the things you own. The chair you are sitting on, your
    laptop, your phone, anything that can be sold on Amazon or eBay. All of these
    items fall under the classification of non-fungible possessions.


    Fungible assets are considered the odd ones out. A currency is a common illustration
    of a fungible asset. Ten dollars is always ten dollars, irrespective of the serial
    number on the precise ten-dollar bill or whether it''s ten dollars saved in your
    bank account. The capability of replacing a ten-dollar bill with another ten-dollar
    note (or ten ones, for that matter) is what makes currency fungible.


    In short, fungibility is relative. It can only be applied when contrasting numerous
    things. For example, let''s consider first-class, business-class, and economy-class
    flight tickets. Each ticket is approximately fungible inside its class; however,
    you cannot impartially trade a first-class ticket for a business class ticket.
    The same circumstances can be applied to the chair example except if you have
    developed a distinct affection for your specific chair.


    Fascinatingly, fungibility can also be biased. If we go back to the flight ticket
    case, you will see that an individual who prefers a window seat might not contemplate
    two economy class tickets in exchange. Likewise, a rare penny may be worth 1 cent
    to a person but might have way more value for a collector. These distinctions
    are becoming more important when displayed on blockchains.


    **Blockchain-Based Non-Fungible Tokens**


    Similar to the existence of digital currencies before the emergence of cryptocurrencies,
    we have had non-fungible digital assets ever since the beginning of the Internet.
    Event tickets, domain names, in-game items, even handles on social networks like
    Facebook or Twitter are all non-fungible digital assets. They simply differ in
    their liquidity, traceability, and interoperability. Most of these are exceedingly
    valuable: Epic Games generated $2.4 billion in proceeds selling costumes in Fortnite
    (their free-to-play game) in 2018. The market for event tickets is estimated to
    spread $68 billion in 2025, and the market for domain names endures to realize
    solid growth.


    There are loads of digital items accessible. However, to what extent does a person
    own these items? If digital ownership just implies that you and not somebody else
    own an item, then you possess it in some way. Whereas digital ownership is more
    like proprietorship in the physical realm (the liberty to hold and transfer minutely),
    this doesn''t seem to be the circumstance with digital assets. Instead, you possess
    these assets in particular contexts that may or may not make trading them easy.


    This is where blockchains emerge and facilitate. Blockchains offer a coordination
    layer for digital assets, providing users the ownership and organization permission.
    Blockchains add numerous unique characteristics to non-fungible assets that modify
    the user and creator interactions with these assets.


    When blockchain tech and NFTs come together, they create something potent, distinctive,
    and fascinating for developers and users that use them. Even though we have previously
    discoursed that non-fungible assets are all around us, the actual issue is the
    part where ownership comes up. Here are some noticeable features of blockchain-based
    NFTs:


    **Standardization**


    Standardization is a radical characteristic of NFTs because digital assets, from
    airplane tickets to domain names, have no unified sign in the digital realm. On
    the other hand, when NFTs are symbolized on public blockchains, they permit designers
    to construct common, transferrable, and reusable standards applicable to all non-fungible
    tokens.


    This standardization functions as building blocks for digital assets from rudimentary
    ownership, transference, and regulation of advanced features like additional standards
    for exhibiting the NFTs. These standards can be coated on top for rich demonstration
    inside of applications.


    These are equivalent to other foundations of the digital world, such as the PNG
    or JPEG file design for pictures, HTTP for demands amid computers, and HTML /
    CSS for presenting content on the websites. Blockchains add a coating on top that
    provides creators with a new set of tasteful basics to construct applications.


    **Traceability**


    The interoperability of non-fungible tokens overlays the way for one of the most
    convincing aspects of NFTs, called traceability. It empowers free trade in open
    markets. This implies that users can trade items out of their original surroundings
    and transmit them to a place where they can influence refined trading technologies
    and systems. These consist of bundling, bidding, eBay-style auctions, retailing
    and selling any currency, and much more.


    This traceability signifies a move from a closed economy to a free and open-market
    economy, particularly for game developers. These developers no longer have to
    handle each piece of their economy: from the supply of raw materials to pricing
    to capital regulations. Rather, they can let free markets do the heavy lifting!


    **Interoperability**


    NFT standards permit non-fungible tokens to shift effortlessly across numerous
    ecosystems. When a creator releases a new NFT venture, these non-fungible tokens
    are instantaneously on display inside heaps of different wallet providers, tradeable
    on diverse markets, and, lately, displayable in virtual worlds. This is conceivable
    given that the open standards offer a clear, dependable, consistent, and permission
    API for reading and writing data.


    **Liquidity**


    Instant traceability of NFTs will result in higher liquidity. Non-Fungible Token
    marketplaces can provide to a diversity of audiences—from new players to hardcore
    traders—permitting higher levels of exposure to the assets for a broader pool
    of purchasers. Similarly, the ICO boom of 2017 conceived a new asset class driven
    by instantaneously liquid tokens; NFTs inflate the market for distinctive digital
    assets.


    **Immutability and provable scarcity**


    Smart contracts let developers place hard caps on the stock of non-fungible tokens
    and impose consistent properties that cannot be altered after the non-fungible
    tokens are dispensed.


    For instance, a developer can implement programmatically that only a particular
    number of a certain rare thing can be generated while keeping the supply of widespread
    items unlimited. Creators can also implement that particular properties do not
    modify over time by encoding them on-chain. This is predominantly stimulating
    for art, which depends profoundly on the verifiable scarcity of a novel piece.


    **Programmability**


    Lastly, another thought-provoking characteristic of blockchain-based NFT is the
    reality that they are extremely programmable. A protruding example is that of
    CyptoKitties, who sweltered in a breeding mechanic into an authentic contract
    directly, which characterized digital cats. Furthermore, numerous non-fungible
    tokens nowadays have more complex and intricate mechanics that incorporate restorative,
    random generation, forging, crafting, and a lot more, verifying that this space
    is filled with immeasurable great possibilities.


    6 ![](Images/svgimg0003.svg)


    # THE NON-FUNGIBLE TOKEN MARKET


    Like any other market, NFT also has experienced stages. The following information
    talks about the current size of the market, its sales technique, and the growth
    it is looking at.


    **Current Market Size**'
