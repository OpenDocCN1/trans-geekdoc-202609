    如今，一个典型的 CryptoPunk 角色至少需要花费 200,000 美元。相比之下，获得稀有版本将花费数百万美元。这意味着 NFT 市场已经飙升到了前所未有的高度。因此，NFT
    领域存在许多机会，你可能通过买卖 NFT 快速赚取大量资金。问题在于，你必须投资正确的 NFT；你不能简单地购买任何随机 NFT 并指望能赚大钱。这被称为“NFT
    后市运作”或“垃圾艺术运动”。这也是为什么大多数人在 NFT 上亏损了钱的原因，因为他们没有投资在正确的 NFT 上。


    在 NFT 领域中赚钱的关键在于投资艺术的意义和故事，而不是艺术本身。让我来解释一下。由于 NFT 市场的流动性没有加密货币市场那么高，大多数人因为投资了自己一无所知的
    NFT 而最终导致亏损。这意味着他们在出售自己的 NFT 时会面临困难。


    因为你可以迅速出售加密货币，但 NFT（非同质化代币）并非如此。因此，要从 NFT 投资中真正获利，你必须确保你的投资足够的流动性，这意味着如果你将来需要，你可以轻松地卖出你的
    NFT。


    其次，你必须投资创建这些 NFT 的品牌和公司/创作者。这是因为投资随机 NFT 并不能为你提供未来。另一方面，投资品牌或公司可以为你提供一个更具基础的产品或
    NFT。因为这些品牌和创作者不仅值得信赖，他们的 NFT 和收藏品在未来还具有增值的潜力。


    但在我们进入如何发现合适的 NFT 项目之前，让我告诉你们关于加密钱包的安全问题。黑客目前正针对加密货币用户并夺取他们的现金。这已经变得流行，而且实施起来简单。黑客只需要找到方法获取你在创建加密钱包时获得的
    12 单词秘密恢复助记词（Secret Recovery Seed Phrase），就足以盗取用户的资金。


    因此，建议使用 12 单词秘密恢复。助记词应仅用于导入你的钱包，或者在你失去钱包访问权限时恢复钱包。助记词仅在这两种情况下使用。


    幸运的是，有方法可以保护你自己，最好的方法将其保存在你的物理钱包中。以下是制作秘密恢复助记词离线备份。你可以使用 Billfodl 物理安全设备将你的 12
    单词恢复助记词物理嵌入钢单元中。然后将其放入钱包中。对于任何拥有数百万美元加密货币的人来说，这个产品都是救命的；因此如果你是其中之一，应该检查一下。


    现在让我们来看看如何寻找合适的 NFT 项目或 NFT 的属性/特性。寻找良好的 NFT 项目其实很简单。因为稀有因子决定了 NFT 的价格，NFT 越稀有，价格就越高。因此，它的价值将会上升。所以，在寻找
    NFT 或 NFT 项目时，你需要理解并弄清楚 NFT 开发者是如何让他的 NFT 与众不同的。


    以 Raging Rhinos 为例。Raging Rhinos 是由 5000 个随机生成的 NFT 组成的集合，每个 NFT 都有独特的外、风格和个性。


    如果你在 `OpenSea` 网站搜索 Raging Rhinos，你会发现 Raging Rhinos 的“底价”（Pricing Floor）大约为 14.2
    ETH。这些犀牛中任何一个的平均或最低可行价格均为 14.2 ETH。


    如果你打开并点击任何一只犀牛，你会发现它们具有不同的特征，例如背景颜色、身体颜色、服装、眼镜、头部等。这些都是 Raging Rhino NFT 的属性或特质。


    某些特征是不常见的，而这些特征决定了 Raging Rhinos NFT 的稀有度评分。


    同样，大多数 NFT 项目（如 `CryptoPunks` 和 `CryptoKitties`）都有某些特质或属性。你现在可以使用 `Rarity Tools`
    等工具来确定任何 NFT 收藏品的稀有度。


    ## 使用 RARITY TOOLS 确定 NFT 的稀有度等级


    例如，稀有工具允许我们检查任何 NFT 的稀有度评分或等级。这种稀有度评分由多种元素决定，包括质量、类型、版本等。你还可以利用 `Rarity tools`
    寻找即将发布的未来 NFT 项目。


    你可以在以下区域几个 NFT 项目；但问题是，你如何知道一个 NFT 项目是否是良好的投资？


    我通过识别 NFT 项目是否拥有社区，发现了检测一个 NFT 项目好坏的方法。


    示例包括：

    * 他们有社区感吗？

    * 总共有多少作品？

    * 它们的售价是多少？


    因为正如之前所说，NFT 是极高风险的投资，它们之所以具有风险是因为它们不是流动性资产，不像 `Bitcoin` 这样的加密货币可以快速交易。


