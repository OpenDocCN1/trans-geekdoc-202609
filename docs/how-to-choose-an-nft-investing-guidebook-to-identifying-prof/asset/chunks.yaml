  trans: '


    她提供的另一项建议是选择推出一款具有品牌标志性设计特征的限量顶级产品，以享受稀缺性并驱动需求。


    此外，如果能与具有易于使用的 `UX` 和 `UI` 的市场和区块链提供商合作，将会有很大帮助。如果你目标是改变普通时尚消费者，这一点尤为如此，因为对于绝大多数人来说，这将是他们的首次时尚
    NFT 冒险。


    “很少有时尚人士拥有加密货币钱包，”她继续说道。为了让普通大众更容易接触到 NFT，并将这一运动从小众推向大众市场，像 THE DEMATERIALISED
    这样的机构同时处理法币和加密货币支付。


    最后，她建议品牌必须考虑时尚 NFT 在购买后的实用性。她主张必须询问诸此类问题：你希望客户在什么地方穿这款时尚资产？你希望他们在 `AR` 滤镜体验中使用它、在游戏中使用，还是在网上展示？回答这些问题可以帮助为时尚
    NFT 的发售增加多样性。


    `RTKFT Studios` 的联合创始人 Benoit Pagotto 表示，虚拟时尚是 NFT 旅程中令人兴奋的一部分。该公司最新发布的 `META
    Jacket` 是其首款非鞋类产品，取得了巨大成功。这件夹克的设计在现实生活中看起来非常惊艳，同时也设计用于供游戏角色穿戴。它是为了即将到来的时尚和游戏观众制作的。


    ### 明星正在将 NFT 变现


    超级巨星正在快速将 NFT 变现。Linkin Park 的的 Mike Shinoda 等表演者表示：“扣除 `DSPs`、唱片公司、营销等费用后，我得到的收益甚至无法触及
    1 万美元。”2 月，Shinoda 在 `Rarible` 上发布了来自一首即将歌曲的音乐视频。其他艺术家和艺人也加入了 NFT 领域，例如 YouTube
    主 Logan Paul、Lindsay Lohan 和歌手 Post Malone。明星们正利用 NFT 以新颖的方式与粉丝互动。Post Malone
    与 NFT 艺术家 `Fvckrender` 以及社交货币平台 `Fyooz` 合作，为拥有足够 `FYZ` NFT 的用户提供新代币，让他们在 Malone
    的名人世界啤酒桶联盟中畅玩啤酒桶游戏。


    ### 区块链组织正在寻找可持续策略


    能量消耗是一个争论的焦点，区块链组织已经在寻找各种技术来减少或抵消能源利用，并变得更加可持续。例如，`Mercado Bitcoin` 已与 `MOSS`
    合作，成为全球第一个平衡其整个碳足迹的加密交易所。


    此外，`Ethereum` 区块链正在向权益证明机制（`Layer 2`）过渡，与工作量证明机制（`Layer 1`）相比消耗更少。`SuperRare`
    等组织正在资助 `ETH 2.0` 的探索，以加速更高效能源系统的扩张。


    投资者也对发现更具维护性的方法感兴趣，例如《鲨鱼坦克》中的 Kevin O''Leary，他在最近的一个 Facebook 帖子中分享道，他正在考虑投资可以在零碳指令下产生硬币的业务和矿工。从碳平衡到
    `Layer 2` 协议的执行，加密货币行业中的许多个人和机构都在寻找产生积极影响的方法。


    14 !![](img/svgimg0003.svg)


    # 现在最值得收藏的热门 NFT 艺术家


    女士们、先生们，请坐好，NFT 是城里最热门的艺术商品。


    非同质化代币是基于区块链的艺术品，具有独特的加密代码，允许进行所有权和真实性验证。NFT 的范围可能从单件数字艺术品到整首歌曲或专辑不等。时尚设计师也注意到了
    NFT 趋势。


    从 18 岁的 `Fewocious` 到 87 岁的 `José Delbo`，世界各地的广泛艺术家正在拥抱加密艺术。2021 年 3 月拍卖了价值超过
    8500 美元的 NFT 艺术品。这是一次重大事件。


    你想购买一些 NFT 艺术品但不确定从何处开始？`Cryptoart.io` 发布了一份根据总总额排名的艺术家列表。数据来自各种数字画廊，包括 `SuperRare`、`Foundation`、`Nifty
    Gateway`、`MakersPlace`、`Async Art` 和 `KnownOrigin`。虽然数据不断变化，以下是目前的顶级 NFT 列表。


    ## BEEPLE


    **作品总价值：$113,100,017.88**


    在与佳士拍卖行（`Christie''s`）进行了历史性的拍卖后，艺名为 `Beeple` 的 Mike Winkelmann 成为最畅销 NFT 艺术家。作品《Everydays:
    The First 5000 Days》以 $69,346,250.00 售出，被认为让 NFT 销售受到了大众的关注。一家老牌拍卖行首次接受比特币来购买加密艺术。


    `Beeple` 的每件作品平均售价为 133,849.86 美元。


    `Beeple` 的每件作品都在 `Instagram` 上发布了 `Everydays` 系列。他的作品涵盖了从写实形状到怪诞插画的各种内容，且均是真实的。


    ### TREVOR JONES


    **作品总价值：$18,083,354.42**


    在 `作品总价值` 之外，Trevor Jones 绝对着迷于艺术与技术的联系。Trevor Jones 是一位出生在加拿大的艺术家，对艺术与技术的联系非常着迷。这位视觉艺术家曾在画布上进行创作，后来转向了
    QR 代码和增强现实。Jones 与 NFT 领域一些知名人物合作，总共卖出 5284 件作品，平均价格为 4009.65 美元。


    他的畅销作品《Genesis》是与阿根廷漫画艺术家 `José Delbo` 合作的，其中包含了大理石雕塑。他的另一件畅销单人作品《Bitcoin Angel》是金色的背景，以
    188,888.00 美元售出。


    Jones 现在正致力于一个为期六个月的项目，将于 8 月和 9 月发布。他目前还没有停止创作。他早期的作品《Bitcoin》可以在二级市场购买。


    ## FEWOCIOUS


    **作品总价值：$18,037,594.08**


    一位名叫 Fewocious 的青少年艺术家正在引领一场 NFT 复兴。这位 18 岁的潮流超现实主义数字艺术家深受 NFT 和加密货币的影响。这位艺术家总共卖出了
    3103 件 NFT 作品，平均每件 5812.16 美元，这得益于她的 5 万 `Instagram` 和 `Twitter` 粉丝。


    一件名为《The Everlasting Beautiful》的作品描绘了一个手托脸的女性，是她的最高记录。。作品处处都是独特的，兼具单色部分和色彩点缀。背景充满了美和爱情相关的陈述，复制了一段
    20 秒的视频，视频在某处对观众说：“只要告诉我我很漂亮就好。”随着女性嘴部的移动，她的眼睛闪烁着。这件作品附带了 30x30 的画布、光光漆和油画。Fewocious
    目前正在筹备服装发布以及其他项目。


    ## PAK


    **作品总价值：$16,023,212.5**


    匿名艺术家 Pak 是 NFT 宇宙中最神秘的人物之一。Pak 无论是以个人还是集体形式都创作了二十年的数字作品。Pak 卖出了 1691 件作品，平均每件
    9354.99 美元，这位艺术家被世界上一些顶级科技人物所熟知，包括 `Elon Musk`。


