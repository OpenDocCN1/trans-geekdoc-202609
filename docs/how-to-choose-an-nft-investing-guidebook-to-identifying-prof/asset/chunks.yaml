  trans: '


    `CryptoKitties` 是 NFT 收藏品的极佳示例。`Crypto-Kitties` 是 `Ethereum` 区块链上的数字猫。该 NFT 背后的理念是允许买家像在现实生活中一样养这些猫并让它们繁殖。在
    2017 年发布后的几周内，约有 2000 万美元投入了其中。但收藏品市场在任何方面都没有限制，因为它正向不同的方向延伸。NFT 用的另一个优秀例子涉及艺术收藏。专家在为每件艺术品创建非同质化代币之前，可以对绘画和雕塑进行验证和鉴定。


    这个不可信的项目显然出现在从 `Coin-Desk` 到 `CNN` 的每一个新闻频道。也许这是因为该游戏阻塞并减慢了 `Ethereum` 区块链，或者是人们在交易中赚了巨大的利润。一些虚拟猫的售价甚至超过了
    100,000 美元。


    ## 2018–2019 – NFT 的寒武纪爆发


    2018 年和 2019 年 NFT 生态系统经历了巨大的增长。现在该领域已有超过 100 个项目，并且更多项目在进行中。在 `OpenSea` 和 `SuperRare`
    领导的 NFT 市场正在增长。与其他加密市场相比，交易量较小，但它们正在快速增长并已经走了很远。随着 `Metamask` 等 `Web3` 钱包的不断进化，参与
    NFT 生态变得变得更容易。`Dapper Labs` 最近推出了不需要支付 gas 费的 `Dapper` 钱包。此外，现在还有诸如 `nonfungible.com`
    和 `nftcryptonews.com`（厚颜推广）等网站进入 NFT 市场标准、游戏指南，并提供有关该领域的通用信息。


    `CryptoKitties` 追踪了 NFT，但如果没有之前通过创建独特数字资产奠定基础的项目，它们无法做到这一点。这张由 `Nonfungible.com`
    world 的趣味图表显示了 `CryptoKitties` 对现有 NFT 生态系统有多重要。


    此表显示，拥有 `CryptoKitties` 的人倾向于玩其他 NFT 游戏，而玩其他 NFT 游戏的人往往不会扩展到玩其他。`CryptoKitties`
    是通往 NFT 世界的完美门户。


    `CryptoKitties` 可能也经历了巨大的增长，这归功于繁殖不同猫的功能，这些猫组成了完全全新的猫或 `ERC721` 代币。现在 NFT 有无尽的功能，包括角色名称（类似于域名）、虚拟土地规划、虚拟服装、活动入场券、小行星采矿资源等。


    ## 2020 年 12 月——虚拟 F1 赛道获得记录性的 223,000 美元支付


    NFT 热潮达到了一个新高度。仅虚拟赛道的一个部分就支付了 223,000 美元。只有基于区块链的游戏赛道的一部分以 900 万 `REVV` 代币进行了拍卖。由
    `Animoca Brands` 开发的 `F1 Delta Time` 游戏中的赛道是一个摩纳哥赛道，对一级方程式赛粉丝来说特别有名。该公司确认赛道的一部分已以
    NFT 形式出售。


    拍卖获胜者使用 `REVV`（`Animoca` 公司的代）支付了摩纳哥赛道的一部分。`9,081,752` `REVV` 代币相当于约 375.56 个
    `Ethereum`。大约是 223,000 美元。


    与许多加密货币不同，NFT 的凭证存储在智能合约中。这些信息证明了每个 NFT 都是不同且独特的。这使得它们成为“独特的令牌-NFT”。NFT 可以代表任何可以数字化的东西。从艺术品到游戏内产品，可以创建许多
    NFT。因此，由于这些产品独特、不可更改且不可复制的特性，价格可以达到高额。


    ![3](img/svgimg0003.svg)


    # NFT 如何工作


    要理解创意作品是如何与 NFT 绑定的，人们必须识别 NFT 是如何工作的。非同质化代币是使用 `Blockchain` 处理的独特加密代币。该区块链充当去中心化的账本，跟踪每个
    NFT 的交易历史和所有权。


    这些代币被编码为具有 `ID` 以及其他代币不会拥有或复制的元数据。这种程序为 NFT 提供了稀缺性和原创性特征，使得它们与数字媒体结合时是如此引人注目。NFT
    使用软件代码（被称为 `smart contracts`）编码，用于管理验证所有权和监督 NFT 的可转性等功能。像任何软件应用程序一样，非同质化代币可以进行进一步编程。


    ## Ethereum 上的 NFT


    开发 NFT 的第一个最常用的接口是 `ERC721` 标准，它允许在 `Ethereum` 区块链上进行代币的交易和发行。`Ethereum` 是一种加密货币，类似于
    `Bitcoin` 或 `Dogecoin`；然而，它的区块链也支持这些 NFT。其他区块链也可以执行自己的 NFT Forma。


    `Ethereum` 让设计师为他们的非同质化代币编写 `smart contracts`，这些代币可以包含有关他们设计的新资产的细节。当用户交换 NFT
    时，他们与该合约联网，合约在 `Ethereum` 上跟踪它。


    ## 其他区块链上的 NFT


    `Ethereum` 不是开发者开发和发布 NFT 的唯一选择。其竞争对手的首可能是 `Flow`，这是一个专门为 NFT 创建的不同且新的区块链，其目标是促进这些代币的应用。同样，其他几个区块链也允许
    NFT 的形成，包括 `Tezos`、`Cosmos` 和 `Polkadot`。


    ## NFT 仅仅是一种时尚吗？


