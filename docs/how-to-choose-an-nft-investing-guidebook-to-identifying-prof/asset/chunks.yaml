  trans: '


    由于资产缺乏现货价值，与加密货币市场相比，NFT 市场仍然相当难以衡量。让我们关注二级市场交易量（即 NFT 的点对点销售）作为市场规模的指标。通过这一指标，我们可以评估出
    2021 年 2 月的二级市场目前大约具有每月 9,000 万美元的容量。


    ## 市场增长


    在 2018 年 `CryptoKitties` 泡沫之后，与 NFT 关联的独特账户数量缓慢但稳定增长，从 2018 年 2 月的约 8,500 个账户增长到
    2019 年 12 月的 20,000 个账户。该市场似乎受到一组核心高耗能消费者的驱动。


    在 `OpenSea` 上，中位卖家卖出了价值为 71.96 美元的物品，而平均卖家卖出了价值 1,178 美元的货物，这表明存在大量的实力卖家。至关重要的是，官方游戏账户等大账户拉高了平均水平。`OpenSea`
    的平均买家购买了价值为 943.81 美元的物品，而中位消费者购买了价值 42.72 美元的物品。


    ## 销售机制


    目前 NFT 在去中心化交易所主要以 `ETH` 销售。令人惊讶的是，`USDC` 或 `DAI` 等稳定币的交易极少，可能是由于获取稳定币的摩擦成本。荷兰拍卖和固定价格销售通常用于零售低单价物品，而英式拍卖（eBay
    风格）是高单价物品的常见选择，例如传奇游戏物品或极价值的 `Gods Unchained` 卡片。捆绑也是一种流行的销售机制，捆绑销售的比例在 2020 年
    12 月增加到 20%。


    ## NFT 交易市场


    时尚行业的代币化资产主要通过直接零售商提供。相反，其他行业的 NFT 有几个在线市场。任何意向的消费者都可以浏览和搜索以找到他们正在寻找的数字物品。NFT
    市场正在快速崛起。在加密货币领域，NFT 正在成为值得关注的新资产类别。简单来说，这些市场提供了一个购买、出售和交易 NFT 的场所。


    随着非同质化代币的日益流行，NFT 市场的出现激增。此外，你可以在各种市场上访问数千个非同质化代币 (NFT)。由于各种代币标准，所有这些市场并不支持相同的
    NFT。然而，在尝试某个平台之前，你必须进行详细的研究。进入 NFT 市场最安全的方法是通过 `CoinMarketCap` 或 `CoinGecko` 的认证网站，以避免被骗。


    ### OpenSea


    `OpenSea` 是最大的领先 NFT 市场之一。它们在 NFT 世界中等同于 eBay，允许你购买和获取几乎任何包括 `Cryptokitties`、`ENS
    Names`、`Axis` 等在内的物品。它是加密货品的首个点对点 NFT 市场。可以访问的物品包括区块链保护的游戏物品、收藏品和其他虚拟商品。在 `OpenSea`
    上，你可以与世界上任何人购买、出售和交易任何这些物品。`OpenSea` 目前是最大的用户所有数字物品通用市场，拥有全面的分类 set，目前拥有超过 400
    万件物品。


    ### Rarible


    `Rarible` 是另一个流行的 NFT 市场。它在 `OpenSea` 之后出现，提供了多种形式的 NFT。该平台由其内置代币 `$RARI` 驱动并且是完全去中心化的。它允许持有者提议并投票以对平台进行修改和扩展。`Rarible`
    系统上的用户在购买 NFT 或进行任何销售时有资格接受 `$RARI` 代币。


    你也可以在这个平台上创建 NFT。用户可以带着他们拥有的内容（如数字图片或动态图形）前往 `Rarible` 生成 NFT。卖家可以为单件作品生成多个 NFT
    并多次出售。或者说，只分发单个物品，这样它被认为更稀有。此外，艺术家可以设定一个百分比以获得终身转售收益。购买者可以购买 NFT 并构建投资组合。有些人构建个人喜物品的个人收藏，而另一些人则构建他们认为具有未来价值的艺术组合。


    ### Nifty Gateway


    `Nifty Gateway` 由 Duncan 和 Griffin Cockfoster 于 2018 年建立。在其启动一年后，宣布 `Gemini` 从母公司
    `Gemini Trust Company, LLC` 手中购买了 `Nifty Gateway`。在这个平台上，数字收藏品经济由名为 `Nifties`
    的 NFT 驱动。`Gemini` 的收购证明了 NFT 代币无疑将成为加密货币领域最热门的趋势之一。


    ### Somnium Space


    `Somnium Space` 正在利用 `Ethereum` 区块链打造虚拟社交世界。平台上的用户可以买卖土地、创建虚拟资产并在开放市场上将资产变现——使用他们选择的加密货币。`Somnium
    Space` 可以免费访问。


    '
