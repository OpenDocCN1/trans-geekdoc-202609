    NFT 社区在 Twitter 上异常活跃，但惊讶的是，他们在 Instagram 上并没有那么活跃。这表明在 NFT 社区中，细节非常重要，而 Twitter
    允许用户以比其他社交媒体网站更好的的方式展示其艺术细节。


    ### 在 YouTube 上寻找 NFT 项目


    YouTube 也是寻找具有赚大钱潜力的优质 NFT 项目的绝佳场所。你应该订阅像 Gary Vee 这样的 YouTuber，他经常发布关于 NFT 和
