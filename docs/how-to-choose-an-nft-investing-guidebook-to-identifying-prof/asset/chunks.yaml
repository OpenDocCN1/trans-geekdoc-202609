- raw: 'CryptoKitties are great examples of NFT collectibles. CryptoKitties are digital
    cats on the Ethereum blockchain. The idea behind this NFT is to enable buyers
    to nurture these kitties and reproduce, just as they would in real life. Within
    a few weeks of launching in 2017, about $20 million was spent on them. But the
    collectibles market is not limited in any way, as it extends in different directions.
    Another excellent example of the usefulness of NFTs involves art collecting. Experts
    can verify and authenticate paintings and sculptures before creating a non-fungible
    token for each piece of art.


    This incredible project was apparently featured on every news station, from Coin-Desk
    to CNN. Perhaps this was because the game blocked and slowed down the Ethereum
    blockchain, or people made crazy profits in trading. Some virtual cats even sold
    for over $100,000.


    **2018–2019 – NFT Cambrian Explosion**


    2018 and 2019 saw tremendous growth in the NFT ecosystem. There are now more than
    100 projects within the venue and more in the works. The NFT markets, led by OpenSea
    and SuperRare, are growing. Trading volumes are small compared to other crypto
    markets, but they are growing rapidly and have come a long way. As Web3 wallets
    like Metamask continue to evolve, getting involved in the NFT ecosystem becomes
    easier. Dapper Labs recently launched a Dapper wallet that doesn''t require gas
    payments. In addition, there are now websites such as nonfungible.com and nftcryptonews.com
    (shameless plugin) that enter NFT market criteria, game guides and provide general
    information about the area.


    CryptoKitties tracked the NFT, but they could not have done so without previous
    projects that laid the groundwork by creating unique digital assets. This interesting
    graphic published by Nonfungible.com shows how important CryptoKitties are to
    the existing NFT ecosystem.


    This table shows that people who have CryptoKitties tend to play other NFT games,
    while people who play other NFT games often do not expand to play others. CryptoKitties
    serve as the perfect gateway to the NFT world.


    CryptoKitties may also have experienced great growth due to the functionality
    of breeding different cats that make up an entirely new cat or ERC721 token. There
    are now endless functions for NFT''s, including character names (similar to domain
    names), virtual land plans, virtual clothing, event entry tickets, asteroid mining
    resources, and more.


    **December – 2020: Record $223,000 pay out to virtual F1 track**


    The NFT craze has reached a new point. Only one section of a virtual racetrack
    was paid $223,000. Only part of a blockchain-based game''s racetrack has been
    auctioned off for 9 million REVV tokens. The track in the F1 Delta Time game developed
    by Animoca Brands is a Monaco circuit that is especially well known to Formula
    One fans. The company confirmed that part of the track was sold in NFT form.


    The winner of the auction paid for part of the Monaco track with REVV, the token
    of the Company Animoca. 9,081,752 REVV tokens equates to approximately 375.56
    Ethereum. That''s about $223,000.


    Unlike many cryptocurrencies, NFT''s have credentials stored in smart contracts.
    This information proves that each NFT is different and unique. That makes them
