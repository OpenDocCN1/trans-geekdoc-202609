  trans: '


    Pak 的作品以单色为主，并带有几何形状。以 900,072.96 美元的定价，Pak 的作品《Metarift》描绘了一个被似乎是四条纹带环绕的六球体结构。在
    12 秒的视频中，这两个结构相互旋转，金属质色调凸显了材料不同的底色。Pak 将于 4 月与顶级拍卖行苏富比合作，进行全球 NFT 拍卖活动。


    ## MAD DOG JONES


    **作品总价值：$14,344,607.33**


    Mad Dog Jones 是一位加拿大艺术家，充满活力、适应力强且风格独特。Mad Dog Jones 既是音乐家也是画家，他已售出 1,567 件 NFT
    作品，平均价格为 9,063.52 美元。


    Jones 最畅销的作品《Boardwalk》（步行道）是一段 43 秒的视频，描绘了一幅手绘城市景观。当一辆出租车停在巷子里，上方有一座大楼时，小雨滴落在场景中。雨滴随着伴奏的节奏落下。该作品于
    2021 年 2 月 21 日以 388,888.00 美元售出。


    ## SLIMESUNDAY


    **作品总价值：$11,624,226.24**


    Mike Parisella，被称为 SlimeSunday，是一位位于波士顿的数字拼贴艺术家。SlimeSunday 对主流媒体允许边界的不断突破，以及他对色情和奇异话题的调查赢得了超过
    500,000 名 Instagram 粉丝。截至目前，他已售出 6,508 件 NFT 作品，每件总额为 1,784.64 美元。“SlimeSunday
    还与电子音乐制作人和 NFT 艺术家 3lau 共同享有盛名，组成了 ssx3lau 双人组。他最畅销的作品《Gunky''s Uprising》（根基的起义）是他与
    3lau 合作的双人曲，他提供了视觉效果。SlimeSunday 的动画技巧在 ssx3lau 的合作中大放异彩，尽管世界主要看到的是他的二维数字设计。《The
    Process》（过程）是 SlimeSunday 最畅销的单品，在 3lau 音乐的陪伴下展示了他的数字拼贴制作过程。


    ## HACKATAO


    **作品总价值：$11,113,676.85**


    OG 加密艺术家 Hackatao 共售出 1,504 件作品，平均每件 7,310.61 美元，位登畅销榜。名字被命名为“hack”源于深入皮肤并发现内部事物的快感，而“Tao”则代表阴阳，Hackatao
    探索了人性、社会和加密相关的问题。这对意大利组合最畅销的作品《Kim Jong - ''Dead and Alive''》（金正日——“生死”）是一部描绘朝鲜著名领袖在肉体与骨骼之间滑动的动画。该作品在拍卖会上拍得
    276,136.88 美元。它被描述为“薛定谔的猫，在我们打开盒子之前，他既是死的也是活的”，艺术家在 Hackatao 的风格中玩转存在状态和色彩。


    ## XCOPY


    **作品总价值：$10,133,787.62**


    Xcopy 是一位位于伦敦的数字艺术家和加密货币爱好者，他已售出 1,907 件 NFT 作品。XCopy 的作品经常包含扭曲的循环和闪烁的图像，因为他的工作总是涉及某种形式的光闪烁。根据
    XCopy 说，《Death》（死亡）以 1,812,660.00 美元成交，平均每件 5,240.90 美元。该作品由一个快速变化的白色骷髅黑色屏幕组成。周围的蓝色和绿色方形快速移动，给人一种全身在屏幕上移动的印象。


    ## 3LAU


    **作品总价值：$9,161,894.41**


    作为 3LAU，Justin Blau 是一位电子音乐制作人和加密货币爱好者，自 2011 年以来就开始发布音乐，并在 EDC、Lollapalooza 等节演出。作为
    3LAU，他是首批进入加密领域的 NFT 艺术家之一。他与 ssx3lau 合作创作了许多视觉作品。他最畅销的作品《Gunky''s Uprising》是他与
    3lau 合作的双人曲，他提供了视觉效果。SlimeSunday 的动画技巧在 ssx3lau 的合作中大放异彩，尽管世界主要看到的是他的二维数字设计。《The
    Process》（过程）是 SlimeSunday 最畅销的单品，在 3lau 音乐的陪伴下展示了他的数字拼贴制作过程。


    ## GRIMES


    **作品总价值：$8,923,250.78**


    Grimes 是一位备受赞誉的另类流行歌手。在进入 NFT 领域之前，她已经售出了 1,122 件作品，平均价格为 7,983.33 美元。她最畅销的作品《Anhedonia》（快感缺失）以
    388,938.00 美元成交。她的作品《Death of the Old》（旧日的死亡）是一个三分钟的视频，展示了骨骼。


    ## WHISBE


    **作品总价值：$8,433,625.45**


    WhisBe 是一位匿名的街头和艺术艺术家，以其流行的糖果系列（Gummy Series）闻名。WhisBe 的装置艺术包含了红色的糖果。他已售出 1,650
    件 NFT，平均每件 4,507.38 美元。他最畅销的作品《What is Beauty》（美何在）以 250,000.00 美元售出。该作品是一个三十秒的视频，背景是看起来像自然历史博物馆。


    ## SSX3U


    **作品总价值：$8,191,686.80**


    SSX3U 是由 DJ 和艺术总监组成的组合。3lau 与 SlimeSunday 的长期合作已产生了 5,740 件作品，平均每件 1,428.48 美元。他们最畅销的作品《Gunky''s
    Uprising》（根基的起义）是新作品《Iridescent》的一部分，以 1,333,333.33 美元售出。这部三分钟的电影以山地景观的黑白图像开始。随着节奏的淡出，屏幕上出现了彩虹色的霓虹色彩，与黑色背景形成对比。镜像景观变成了几何形状，将山脉变成三角形、正方形和圆形，最后一只霓虹手接管了页面。


    ## JOSE DELBO


    **作品总价值：$8,042,605.61**


    阿根艺术家 José Delbo 以其在《神奇女侠》、《小露》和《地球王子》中的工作闻名。2020 年 7 月，他发布了他的第一件 NFT。一部名为《Death》的
    43 页原创漫画书以 642.14 美元成交。在此期间，他已售出 2,781 件作品，平均价格为 2,884.53 美元。他最畅销的 NFT《Genesis》（创世纪）以
    553,169.65 美元成交，由 TrevorJones 共同创作。Delbo 设计了蝙蝠，Jones 负责动画制作。随着艺术品从铅笔素描变为油画，蝙蝠显出身，并直视观众。


