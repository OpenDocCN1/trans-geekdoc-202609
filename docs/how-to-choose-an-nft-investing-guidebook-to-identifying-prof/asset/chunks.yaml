    令牌来参与治理投票。


    ## 去中心化艺术与收藏品


    鉴于艺术的价值取决于有效性、年龄和所有者数量等各种因素，因此在区块链上作为 NFT 收集它是完全合逻辑的。艺术家在验证其作品的真实性方面通常面临问题，特别是在数字艺术领域。尽管如此，区块链和
    `NFT` 的利用有助于解决这一疑虑。目前，艺术家可能会将艺术作品发布在社交媒体、个人网站或博客网站上，但这并不能证明所有权。此类平台甚至不提供可靠的时间戳。


    相反，通过区块链和 `NFT` 的利用，艺术家可以将他们的艺术品发布在一个将这些细节添加到区块链的网站上。这意味着作者的信息和艺术品的有效性可以记录在安全且防篡改的区块链上。由于所有内容都记录在公共账本上，寻找艺术所有者并追溯首次发布日期变得可行了。


    ### KnownOrigin


    `KnownOrigin` 是一个允许艺术家展示和销售其独特数字艺术品及收藏品的平台。以前，普通人购买艺术品的入门门槛非常高，因为在没有艺术专家的情况下验证真实性极其困难困难。尽管如此，通过使用
    `KnownOrigin`，个人可以轻松识别真实所有者并对购买充满信心。


    该平台利用以太坊系统，允许艺术家将其作品代币化，然后作为独特的 `NFT` 发布在 `KnownOrigin` 网站上。当使用 `ETH` 购买艺术品时，将获取购买者的地址。这允许他们识别出将记录在区块链上的新作者。


    该艺术平台邀请并举办了超过 1000 多名艺术家，自 2018 年成立以来，交易的艺术品已超过 17,000 件。该网站由 `BlockRocket` 团队设计。


    ### Bitcoin Origins


    `Bitcoin Origins` 是一系列极其稀有的数字收藏卡牌，纪念了比特币历史上最注目的时刻。这些卡片均由才华的艺术家设计，并在 `Bitcoin Origins`
    网站发布。这些物品通常在 `WAX` 区块链上几秒钟内售罄。Sequence 配合 `Bitcoin Origins` 提供了一个互动社区网站，帮助该项目成为区块链领域最大的
    NFT 项目之一。


    ### Cryptograph


    区块链世界的大多数人都听说过帕丽·希尔顿以 40 个 `ETH` 卖掉了她的猫数字绘画，这在出售时相当于巨大的 17,000 美元。这是通过慈善数字艺术网站
    `Cryptograph` 实现的。`Cryptograph` 允许用户交易收藏品；通常以著名图表、绘画或绘画的形式存在。这些收藏品通常由帕丽·希尔顿、艾什·格林和
    Seth·格林等知名人士设计。这些明星都在网站上发布了他们的作品并使用 `ETH` 进行拍卖。


    该平台的创建正是为了慈善目的募集资金，从那时起筹了数千美元。


    ## 热门市场


    ### Binance Collectibles


    `Binance` Collectibles 是由 `Binance` 铸造的非同质化标记。如果你想加入，请遵循以下简单步骤：


    - 下载像 `Trust Wallet` 这样的钱包

    - 如果你想创建一个 NFT，请查看 `Binance`

    - 如果你想出售你的数字艺术，请查看 `OpenSea`


    ### Crypto Stamps


    `Crypto Stamps` 是由 `Postal Service` 分发的数字图像。如果你是一个想要创作作品的数字艺术家，你可能需要在 `Ethereum`
    上查看它。


    ### 域名命名服务


    目前域名领域存在大量的中心化现象。像 `TikTok` 这样的大型网站通常受到中心化的影响。当这些数据在区块链上积累时，网络会变得更加健壮安全。


    ### Handshake Domains


    `Handshake` 是一个去中心化的证书和命名机构。它提供域名的所有权证明。在 `NameBase.io` 上购买的域名随后存储在 `Hand-Shake`
    区块链上。


    # NFT 成功指南


    数字艺术并不是一个新概念；它自 20 世纪 80 年代计算机开发者创建出了一款供数字艺术家 `Harold Cohen` 使用的艺术程序以来就一直存在。现在，制作数字艺术就像打开你的绘画程序或用手机拍照、添加滤镜，然后将其上传给所有人一样简单。


    你可能已经是一个数字艺术家，但还没有意识到。如果你在手机上拍摄照片或在纸上作画，你只需要完善你的技能。


    ## 1. 选择你要创作的艺术类型


    在开启成为 NFT 艺术家的漫而刺激的道路之前，你需要决定你将制作哪种艺术品。在创作数字艺术时保持持续的专注有助于你提高技能，并让你的观众了解你生成的艺术作品。


    '
