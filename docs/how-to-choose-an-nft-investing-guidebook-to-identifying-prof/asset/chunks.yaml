- raw: 'Bosslogic, also known as Kode Adobo, is an Australian graphic designer and
    digital concept artist. His unique fan art mashup and mix fusion has sold 1,148
    NFTs for an average price of $4,087.08 per piece of art. The artist''s most popular
    piece, "The Arrival," unlocks an ultra-rare Mesut zil Next Chapter Golden Kit
    bodysuit, as well as a Genies Wearable for the buyer''s own Genie. Users can purchase
    pieces for their Genies to wear in the metaverse.


    His most recent release features a collaboration with Francis Ngannou, a Cameroonian-French
    mixed martial artist published on the same day as the UFC 260 match. The piece
    seeks to close the gap between martial arts and NFTs.


    ## ANTONI TUDISCO


    **Total Artwork Value: $4,643,181.90**


    Antoni Tudisco is an art director and 3D illustrator based in Hamburg, Germany.
    The artist has previously collaborated with Nike, Versace, Apple, Puma, and other
    brands and has now entered the NFT space. Tudisco''s pieces frequently incorporate
    fashion design elements, with 1,229 sales averaging $3,783.70.


    Tudisco''s best-selling NFT is "hairy," a collaboration with Steve Aoki. Tudisco
    has worked with Steve Aoki on several occasions. The $888,888.88 NFT, which created
    the graphics to complement Aoki''s audio, was purchased by former T-Mobile CEO
    John Legere. Tudisco just started his fashion label, Tudisco Studio, with distinctive
    headgear as its first product.


    ## STEVE AOKI


    **Total Artwork Value: $4,481,822.19**


    As a DJ and producer, Steve Aoki is best known for the song "Dream Catcher," a
    collaboration with Antoni Tudisco. Having sold 1,216 NFTs averaging $3,695.52
    each, Aoki''s collaborations are full of bright colors and electro beats.


    Aoki''s best-selling NFT "hairy" is a thirty-six-second video of a purple, pink,
    and blue hairy face swaying to electronic sounds. Former T-Mobile CEO John Legere
    paid $888,888.88 for the sculpture, which included an acrylic screen for physical
    display.


    ## DEADMAU5


    **Total Artwork Value: $4,314,653.48**


    Deadmau5 is a well-known DJ and producer from Canada who has sold 752 items for
    an average of $5,605.18. His signature mau5head is at the heart of each NFT, which
    is accompanied by his tracks. "In Titan''s Light," an audiovisual collaboration
    between Sutu and deadmau5, was his highest reported sale, at $138,647.34. The
    piece takes place at a space station on Titan''s moon and is inspired by Deadmau5''s
    track "SATRN."


    ## GREG MIKE


