    未经作者书面许可，不得以任何形式或任何电子或机械手段（包括信息存储和检索系统）复制本书的任何部分，但书评中的简短引用除外。


    # 引言


    > 我对使用加密货币的前景非常兴奋，不仅将其作为货币等价物，还将其作为通过某种工作来获得回报的方式。

    > WILLIAM MOUGAYAR


    去信任化、数字稀缺性的概念是在 `Bitcoin` 创建过程中发展出来的。在技术诞生之前，数字副本的成本过高，这阻碍了广泛使用。由于区块链技术的出现，现在可以创建可编程的数字稀缺性。这项技术正被用于连接数字世界和物理世界。第一种可玩的数字资产是非同化代币（`NFTs`）。这可以作为增加数字产品稀缺性的催化剂。


    由于 `ERC-721` 令牌不易互换，它们只能代表独特的资产和提案。换句话说，这种技术可以准确地描述房地产、艺术品和古董等实际物品。收藏品市场目前的价值为
    4500 亿美元，且自互联网诞生以来基本保持不变。目前的身份验证问题、欺诈和货币限制在这一业务中都太典型了。市场现在正处于转型的成熟期，因为区块链技术可以将去信任交易推到一个全新的水平。现实资产可以使用
    `NFTs` 进行代币化，这提供了一种安全且去信任的方法。


    大多数 `NFT` 市场基于 `Ethereum`。随着活动的增加，人们对 `EOS` 变得越来越感兴趣。在投资推动发展的背景下，`NFTs`（非同质化代币）出现在新的区块链上这并不意外。非同质化代币（`NFTs`）具有独特属性的数字资产。特定资产可能包含任意数量的独立
    `NFTs`（例如一件艺术品或一套房地产）。


    可以使用这些区分特征生成对象的数字表示。`NFTs` 可以代表现实世界的资产。在去信任的环境中，分布式的、社区所有的账本可以存储和交换表示，而无需中心化机构。


    `NFTs` 是正在发展的数字资产类别的主要支柱之一——即已数字化并与其加密货币令牌连接的资产。本书的重点将是如何选择 `NFT`。它还涵盖了 `NFT`
    的基础知识、同质化代币与非同质化代币之间的区别、如何买卖 `NFT`、销售你的 `NFT` 的各种市场等。你还将找到一份关于投资 `NFTs` 的相关指南，以及如何选择钱包来开始
    NFT 投资。


    ![](img/svgimg0003.svg)


    # 非同质化代币 (NFTS) 基础


    `NFT` 是非同质化代币（non-fungible tokens）的缩写，在德语中也称为不可替代代币。`NFTs` 是独一无二数字制品的证书。你证明你是特定文件的所有者。“同质化”（fungible）一词是指物品被等价物替换的能力。你钱包里有
    20 美元是一张大钞、四张 5 美元钞票还是二十张 1 美元钞票，没有任何区别。


    另一方面，通过特定特征区分的对象不是同质化的。这类物品同时存在于物理和数字形式中。这就是 `NFT` 的起源。代币的独特性决定了这一点。确定代币的真实性非常困难。毕竟，无论版权和使用权如何，任何图像、歌曲或电影都可以复制。这就是
    `NFT` 的起源。另一方面，通过特定特征区分的对象通常是唯一的。


    ## 区块链与 NFTS


    区块链本质上是一个数据库，数字商品（如加密货币）保存在多台计算机中。它的架构防止了 `NFTs` 被篡改。区块链上的 `NFT` 代表一种独特的资产。区块链上
    `NFT` 的潜在表示目前对交易最重要。`Ethereum` 是仅次于 `Bitcoin` 的常见加密货币。


    ## 同质代币与非同质化代币的区别


    以下内容将澄清同质化代币与非同质化代币之间的区别。加密货币一直与区块链相关。如果你是区块链世界的新手，你可能认为它只是非常适合开发加密资产。政府、企业和个人现在可以将房地产数据、身份标识件和证书放置在区块链上。这就是
    `NFT` 的起源。非同质化代币被誉为区块链经济的未来。然而，同质化代币或当前的加密货币经常与它们并列。


    ### 什么是代币？


    在确定同质化代币与非同质化代币的区别时，代币的定义是你应该考虑的首要问题。代币是现实世界中事实、情感或质量的有形或可见的表示。人们在现实生活中遇到各种代币。


    例如，酒店房卡是向酒店支付房费的证明。办公室 ID 卡作为你在公司工作的证明。另一方面，驾驶执照证明了某人已经接受了在其国家内驾驶的必要培训。因此，代币也代表加密世界中的某个特定实体。


    代币可以持有价值、筹码、投票权或任何东西。惊讶的是，代币并不限于单一角色，可以用于处理其原生生态系统中的各种角色。


    ### 代币的重要性


    代币有特定的用途吗？这个问题的回答对于充分理解“同质化 vs. 非同质化代币”的辩论至关重要。代币并不限于特定角色，可以用于其原生生态系统中的各种用途物。以下是可能功能的示例：


    1. 代币可以作为进入区块链应用程序的入口，用户必须拥有代币才能使用去中心化应用。

    2. 代币还可能代表个人保留特殊投票权的资格。


    '
