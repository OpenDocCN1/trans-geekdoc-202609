    # HOW TO FIND VALUABLE NFT


    Some NFTs were selling for hundreds of thousands of dollars, and you might be
    wondering how I can get my hands on one of these valuable NFTs. This can be tricky,
    and the following are three methods on how you can find valuable NFTs.


    **1\. Studying the Popular Platforms**


    If we look at some of the most expensive NFTs sold, we can see they happen to
    sell within the same platforms. When you check the most expensive game NFTs as
    shown below, you can notice that Axie Infinity, F1 Delta Time, and Sorare repeatedly
    appear on the rank list.


    However, you can''t just create any NFTs within these platforms and expect to
    sell them for a high price. But you can follow the method of gaining traction.
    Let’s look at the example of NBA Top Shot. A lot of NFTs on this platform are
    costly at the moment. You may see the Lebron James’ NFTs are selling for more
    than $250,000. Of course, we''re too late. However, we can use this method for
    newer NFTs that are not at a high price yet. If we go back into the history of
    the NFT, let''s say we were early in the space. We can see the first sale price
    was $1,200, and then shortly after it was sold for $1,600, it was sold for $2,000
    later.


    So we can see that it would be around this time that this thing is gaining traction.
    We weren’t the first person to buy, but after a few of these sales, we can see
    that people are actually buying it, and it is gaining traction. That’s where we
    want to enter. Of course, some of these prices might be too high for some people,
    but this is the truth about NFTs. It''s a game where you pay to play. There''s
    a misconception that NFT is just you jump in and create, and boom, you become
    rich.


    However, that''s not how it works. The only time that works is if you are the
    person of influence and have a platform to market. Unfortunately, if you are not
    that person, you will have to pay to play if you want to get your hands on one
    of these valuable NFTs.


    If we check other NBA NFTs, we can also find some NFTs currently at lower prices,
    like $2 or even $1. If you see they’re getting higher bids, like $4 or $6, we
    know they’re getting tractions, and people are willing to buy it, which is the
    time we want to go into one of these NFTs.


    This also can be applied on any platform like OpenSea and Rarible. Every time
    you''re looking at an NFT, it will show the history, what people were bidding,
    and what people were paying for. If you''re getting in early enough and paying
    attention, and you see that one NFT was sold for $50 and $100, then $200, which
    means it’s gaining attention and traction, and that would be your entry point.


    **2\. Either creating NFTs being an influencer or buying NFTs from a person of
    influence**


    Let’s take an NFT created by Trevor Jones and Alotta Money (Trevor Jones, Alotta
    Money/Async Art) as an example. The NFT was sold for 260 ETH, approximately $141,704
    at that time. Because of the high price, you may be asking why someone would buy
    this digital artwork. The artist Trevor Jones has built up a reputation in the
    NFT artworks, so people are pretty much buying the reputation when he creates
    a painting. Also, when you have influence, your platform is excellent for instant
    marketing.


    Another example is Justin Roiland, his Rick and Morty has been sold for over $1
    Million in Ether. As soon as he creates a piece of art, people know about it and
    trust his reputation. This is something that we see in the regular art world.


    People aren''t necessarily paying for what''s on the paper, and people are paying
    for the artist. The same thing is happening here in the NFT art world, but not
    all of you listening are a person of influence or have a platform.


    As introduced before, Nifty Gateway is best for exclusive drops. On Nifty, you
    can find Justin Roiland’s collection and his coming releasing plans. When you
    check, you may find that most of the old ones have been sold out, which brings
    an important concept of NFTs. They are non-fungible tokens, and they are rare.


    Sometimes there''s only one piece available, and sometimes there are only five
    or ten available prints. You need to understand that investing in NFTs is much
    different than investing in regular cryptocurrency. If someone does all the research
    for a cryptocurrency project, and they say go ahead and buy it. You can go ahead
    and copy their trades but remember these NFTs are limited. If there''s only one
    of one, or ten of ten, someone can''t do all the research, and then say all right,
    go ahead copy my trade and buy it because they just have to buy it from you. So
    for you, instead of learning what to buy, it’s much more important to know how
    to buy with these methods.


    If you are the person of influence or don''t have a platform, the method for you
    will gain traction from a person of influence. For example, if Logan Paul was
    going to release a limited edition of his NFT artwork, and you are aware of him
    and follow his social media, you will know earlier than others that he will release
    an NFT. One of the biggest risks of buying an NFT is that you may purchase an
    NFT that no one else wants. You might get it for a low price, but you may not
    be able to resell it after. Now, gaining traction from influencers can help you
    reduce your risks.'
