    # THE TOP-SELLING NFT ARTISTS TO COLLECT RIGHT NOW


    Hold on to your hats, ladies and gents, for NFTs are the hottest art commodity
    in town.


    Non-fungible tokens are blockchain-based artworks with unique encryption codes
    that allow for ownership and authenticity verification. An NFT might range from
    a single piece of digital art to an entire song or album. Fashion designers have
    also taken notice of the NFT trend.


    From Fewocious, 18, to José Delbo, 87, a wide range of artists from all over the
    world are embracing crypto art. More than $85 million worth of NFT artworks were
    auctioned in March 2021. It''s a significant event.


    Do you wish to purchase some NFT art but are unsure where to start? Cryptoart.io
    publishes a running list of artists rated by the total amount of money they''ve
    made. The data is pulled from various digital galleries, including SuperRare,
    Foundation, Nifty Gateway, MakersPlace, Async Art, and KnownOrigin. While the
    data is constantly changing, here is a list of the current top NFT.


    ## BEEPLE


    **Total Artwork Value: $113,100,017.88**


    After a historic auction with Christie''s auction house, Mike Winkelmann, who
    goes by the artist name Beeple, is the best-selling NFT artist. The sculpture
    "Everydays: The First 5000 Days," which sold for $69,346,250.00, was credited
    for bringing NFT sales to the general public''s attention. An established auction
    house accepted bitcoin for the first time to purchase crypto art.


    Each of Beeple''s artwork has sold for an average of $133,849.86. He also continues
    his "Everydays" series on Instagram, where he posts everyday digital masterpieces.
    His pieces are highly realistic, depicting from digital shapes and scenery to
    grotesque political illustrations.


    ## TREVOR JONES


    **Total Artwork Value: $18,083,354.42**


    Trevor Jones, a Canadian-born Scottish artist, is "absolutely fascinated" by the
    art-tech connection. The visual artist worked on canvas before moving on to QR
    codes and augmented reality. After purchasing his first Bitcoin, Jones was captivated
    by the power of crypto technology and its intersection with art. Jones has collaborated
    with some of NFT''s most well-known figures, selling a total of 5,284 artworks
    at an average price of $3,409.65 each.


    His best-selling work, "Genesis," was a collaboration with Argentine comic book
    artist José Delbo, in which he painted and animated Delbo''s Batman image. His
    best-selling solo composition is "The Bitcoin Angel." The oil on canvas painting
    features two marble sculptures in front of gold Bitcoin. This sold for $188,888.00.


    Jones is now working on a six-month project that will culminate in the publication
    of large-scale paintings and NFTs in August and September. Thus he is not currently
    producing anything. His earlier collection, "Bitcoin Angel," is available on the
    secondary market.


    ## FEWOCIOUS


    **Total Artwork Value: $18,037,594.08**


    A teen artist named Fewocious is leading an NFT Renaissance. NFT and crypto have
    been taken over by the 18-year-old pop surrealist digital artist. The juvenile
    artist has sold a total of 3,103 NFT artworks worth an average of $5,812.16 apiece,
    thanks to her over 50,000 Instagram and Twitter followers.


    A piece titled "The Everlasting Beautiful," which features a woman''s face with
    a hand on her cheek, is his highest-recorded sale. Each feature is unique, with
    both monochromatic segments and pops of colors. The background, which is loaded
    with beauty and love-related statements, replicates a 20-second video which, at
    one point, says to the viewer, "just tell me I''m pretty." As the woman''s mouth
    moves, her eyes scintillate. The piece comes along with a 30x30 canvas, gloss
    varnish, and oil paint. Fewocious is currently working on a clothing drop as well
    as a few other things.


    ## PAK


    **Total Artwork Value: $16,023,212.5**


    The anonymous Pak is one of the most enigmatic characters in the NFT universe.
    Pak has been creating digital work for two decades, whether as an individual or
    collective. With 1,691 artworks sold, averaging $9,354.99 each, the artist is
    known by some of the biggest tech personalities in the world, including Elon Musk.'
