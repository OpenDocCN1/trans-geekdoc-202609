- raw: 'The market for NFTs is still rather hard to measure compared with the cryptocurrency
    market owing to the lack of spot value for assets. Let''s focus on secondary trading
    volume (i.e., peer-to-peer sales of NFTs) as a pointer of market size. By means
    of this metric, we can evaluate the current secondary market to be approximately
    $90 million in capacity per month in February 2021.


    **Market Growth**


    After the CryptoKitties bubble in 2018, the amount of distinctive accounts intermingling
    with NFTs has developed slowly, however steadily, from ~8,500 accounts in February
    of 2018 to over 20,000 accounts in December of 2019. The market appears to be
    motivated by a central group of power consumers.


    On OpenSea, the median vendor has sold $71.96 value of items, while the average
    seller has sold $1,178 worth of stuff, demonstrating a large number of power sellers.
    It is essential to understand that large accounts such as official game accounts
    do escalate the average. The average OpenSea purchaser has bought a $943.81 value
    of items, and the median consumer has purchased $42.72 worth.


    **Sale Mechanisms**


    NFTs are presently sold largely for ETH on decentralized exchanges. Astonishingly
    little trading occurs in stable coins such as USDC or DAI, possibly owing to the
    friction of obtaining stable coins. Dutch auctions and fixed-price sales are normally
    utilized for retailing lower-ticket items, whereas English (eBay-style) auctions
    are a recurrent selection for larger-ticket things, such as legendary game items
    or ultra-valuable Gods Unchained cards. Bundles are also a prevalent sale mechanism,
    with the proportion of bundle sales increasingly mounting to 20% in December 2020.


    ## NFT TRADING MARKETPLACES


    The tokenized assets in the fashion industry are primarily available through direct
    retailers. On the contrary, NFTs for other industries have several online marketplaces.
    Any willing consumer can browse and search to find digital items they are looking
    for. NFT marketplaces are rising quickly. When it comes to the crypto space, NFTs
    are becoming the new asset class to care about. Simply put, these markets offer
    a place for purchasing, selling, and trading NFTs.


    With the increasing popularity of non-fungible tokens, there is a surge in the
    emergence of NFT marketplaces. Moreover, you can find thousands of non-fungible
    tokens (NFTs) accessible via a variety of marketplaces. All of these marketplaces
    do not enable the same NFTs owing to the various token standards. However, you
    must conduct detailed research before trying a platform. The safest method of
    entering an NFT marketplace is through the certified site of CoinMarketCap or
    CoinGecko to evade getting tricked.


    **OpenSea**


    OpenSea is one of the biggest and leading NFT marketplaces. They are equivalent
    to eBay when it comes to the NFT world and permit you to purchase and acquire
    just about any item comprising Cryptokitties, ENS Names, Axis, and much more.
    It is the first peer-to-peer NFT market for crypto goods. Items accessible incorporate
    game items, collectibles, and other virtual goods safeguarded by a blockchain.
    On OpenSea, you can purchase, sell, and trade any of these goods with anybody
    in the world. OpenSea is presently the biggest general marketplace for user-owned
    digital items, with a comprehensive set of classifications, and at present has
    more than 4 million items.


    **Rarible**


    Rarible is a similar NFT marketplace that is prevalent. It emerged after the launch
    of OpenSea, providing diverse forms of NFTs. The platform is driven by its built-in
    token $RARI and is totally decentralized. It permits holders to propose and take
    polls to make modifications and expansions on the platform. Users on the Rarible
    system are qualified to accept $RARI tokens when buying NFTs or making any sale.


    You can also create NFTs on this platform. Users can go to Rarible with content
    they own, like a digital picture or motion graphic, and generate an NFT. Sellers
    can generate numerous NFTs for one single work and sell it multiple times. Or,
    rather, dispense just a single item which is then considered rarer. Moreover,
    artists can fix a percentage to obtain lifetime re-sales. Purchasers can buy NFTs
    and construct a portfolio. Some construct personal collections of what they individually
    like, whereas others build a portfolio of art they see forthcoming value in.


    **The Nifty Gateway**


    The Nifty Gateway was established in 2018 by Duncan and Griffin Cockfoster. One
    year after its commencement, it was proclaimed that Gemini purchased Nifty Gateway
    from parent company Gemini Trust Company, LLC. On this platform, the digital collectibles
    economy is driven by NFTs called Nifties. The acquirement by Gemini endorses that
    NFT tokens will certainly prove to be one of the fieriest trends in cryptocurrency.


    **Somnium Space**


    Somnium Space is crafting a virtual social world utilizing Ethereum Blockchain.
    Users on the platform can buy and sell land, create virtual assets, and monetize
    the assets on the open market — in the cryptocurrency of their choice. Somnium
    Space is accessible for free on Steam and is attuned with the majority of VR headsets.


    **JuicyNFTs.com**


    On JuicyNFTs.com, you can easily view a list of all the NFTs business deal volumes
    for the past seven days.


    **SuperRare**


    SuperRare is a social platform that inspires the development and collection of
    crypto art. Established by Chief Executive of Pixura, John Crain, and Jonathan
    Perkins, Chief Product Officer of Pixura, this marketplace has worked with artists
    from the time of its conception. It makes a point of listening to the collectors
    and artist requirements. This platform is considered a high-end comparable to
    Rarible. Entry hurdles are complex, and artists need to submit their works for
    authorization before being are listed. However, on exchanges such as OpenSea and
    Rarible, anybody can get involved.


    **Atomic Assets**


    Atomic Asset is a sub-segment of the Atomic Hub, a marketplace, particularly for
    listings of the NFTs, hosted on WAX. Non-fungible tokens like Cogs, Street Fighter,
    and Blockchain Heroes. The marketplace has a familiar design, and users have to
    sign up for a WAX cloud wallet or otherwise sign in with Scatter or Anchor. The
    WAX blockchain set a major claim in the NFT space, having already completed multiple
    sold-out campaigns in cooperation with brands like Street Fighter, Topps, and
    Blockchain Heroes, in 2020.


    **KnownOrigin**


    KnownOrigin enables designers and artists to develop and own unique digital artwork,
    all protected by the Ethereum blockchain. Artists such as musicians can give in
    digital artwork as a jpg or gif to the KnownOrigin gallery. All records are detained
    decentrally on IPFS. All assets are provided with inimitable identifiers that
    can be traced.


    KnownOrigin concentrates on digital art, so there is no point going here to search
    for Avatars or CryptoPunks, for instance. Think of the things on sale here as
    you would look at those in an art gallery.


    **Axie Marketplace**


    The Pokemon digital pet universe inspired axie Infinity. It is where players utilize
    their cute characters known as Axis in a variety of games. The Axie Infinity Universe
    emphasizes the aids of blockchain tech via a "Play to Earn" gameplay model and
    a player-owned economy. In this platform, the players can bring along their Axis
    and trade them in an auction.


    Meanwhile, the price can go down or up compared to the beginning price to the
    end price, contingent upon the seller''s objective. Other players have to be well-intended
    to take the gamble of purchasing the anticipated Axis from retailers.


    **Decentraland Marketplace**


    Driven by the Ethereum blockchain, Decentraland is a decentralized virtual reality
    platform. Within the Decentraland realm, users can develop, experience, and get
    money for what they design and construct. Moreover, they can also monetize the
    items they own.'
