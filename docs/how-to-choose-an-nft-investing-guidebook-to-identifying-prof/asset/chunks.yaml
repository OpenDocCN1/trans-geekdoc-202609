  trans: '


    在虚拟公共领域中，用户可以购买名为“地块”（parcels）的土地，这些地块被记录在基于区块链的账本上。土地本身以及在其上方建造的虚拟物品被被称为 `LAND`，这是一种实用型型代币或非同质化数字资产。它被存储在
    `Ethereum` 智能合约中。


    `LAND` 所有者可以监管其在其土地上发布的内容，这些内容被编码进智能合约中。这些内容可以涵盖从图像、场景到应用程序和游戏的各种形式。用户可以以与现实世界相似的方式，在各个场所进行发现、旅行和停留。该市场也是一个供用户进行互动的点对点系统。


    ## VIV3


    VIV3 是建立在 `Flow` 区块链上的一个大型初级市场，其核心理念是：世界正处于从物理所有权向数字所有权转移的起点。VIV3 有一个视觉化方案，旨在授权十亿个人通过在
    `Flow` 上进行构建，来生成、交易和拥有世界上最受推崇的作品。这是一个极具扩展性且可组合的智能合约市场，为典型应用提供了必要的性能。


    品牌、艺术家和游戏工作室利用 VIV3 铸造独有的代币，每个代币代表它们在 `Flow` 区块链上的数字形态，即非同质化代币（NFT）。这些 NFT 被收藏家、粉丝、玩家和数字资产交易者购买。


    ## TreasureLand


    TreasureLand 是 `Binance Smart Chain`（币安智能链）第一个也是最大的 NFT 市场，允许用户购买和交易 `BSC` NFT
    代币。它是 `DEGO` 开发者后的一个分支项目，`DEGO` 是一个与 `Defi` 世界和非同质化代币合作的混合平台。它拥有一个全面的 NFT 系统，包括
    `NFT Casting`（铸造）、`Mining`（挖掘）、`Auction`（拍卖）、`Crafting`（制作）、`Trading`（交易）等。


    在 Treasureland 平台上获取 NFT 非常简单。它允许使用多种加密货币拍卖和挂单。你也可以切换到 `DEGO` 参与非同质化代币的挖掘，这在收藏品领域是相当稀见的。


    ## NFT Showroom


    NFT Showroom 构建在 `Hive` 之上，是一个数字艺术市场。这是一个免费且快速的区块链。艺术家可以列出他们的数字作品，并发行特殊的代币——“艺术证明”，并在市场上进行销售。NFT
    Showroom 在 `Hive` 社区内的影响力日益增强。


    '
