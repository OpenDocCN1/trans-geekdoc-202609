  trans: '


    # 存储代币的区块链


    在 NFT 加密货币领域，以太坊占据着统治地位。虽然比特币因其处理能力是最值得信赖的区块链，但以太坊是执行智能合约最受欢迎的区块链。


    如果一个邪恶的角色控制了区块链上超过 `51%` 的算力，它就可以创建代币并更改交易。然而，与你可以铸造 NFT 的其他区块链相比，以太坊上发生这种情况的可能性要小得多。


    尽管 NFT 领域去中心化、安全性等未来仍不确定，但以太坊如今占据着统治地位。这解释了为什么由 `ETH` 铸造的代币交易价值远高于其他区块链代币。


    # NFT 艺术家的其他 NFT 艺术收藏家


    你不喜欢在购物前看到还有谁买过同样的物品吗？同样，潜在的 NFT 艺术收藏家也会查看感兴趣代币之前的 NFT 艺术收藏家的历史，以了解其价值。


    一些 NFT 加密货币收藏者会费力寻找曾被他们仰佩的人拥有过的代币。


    NFT 艺术收藏家对代币供应的控制权与艺术家处于同一水平。我们想表达的是，如果一个 NFT 艺术收藏家卖掉所有的代币，艺术家的代币价值将会崩溃。尽管这是一个极端情况，但大多数艺术家最终都会卖掉代币，因为每售出一作品都会减少艺术家剩余代币的稀缺性。


    # 代币的内容


    最后，我们谈论代币的外、声音和感觉。有些代币非常动人，让粉丝和 NFT 艺术收藏家对其产生了强烈的情感反应。仅仅看一眼少量代币就能让你流泪。代币内容对于吸引
    NFT 艺术收藏家至关重要，因为他们根据自己的品味不断收集。


    NFT 艺术收藏家非常清楚，技术的改进使得配方过程比以前任何时候都更容易控制且更具效益。尽管 NFT 艺术家可以花费几个月的时间创建和装饰单个代币，但今天构建惊人的事物比几十年前或几千年前更具自发性。这是推广
    NFT 最直接的方式。


    一个惊人的代币会鼓励 NFT 艺术收藏家跨越终点并出价。这是 NFT 加密货币收藏者在决定代币价值并出手时考虑的众多标准中的之一。如果你想推广你的 NFT，请记住这些点。


    12![](img/svgimg0003.svg)


    # 如何找到有价值的 NFT


    某些 NFT 曾以数十万的价格出售，你可能好奇我如何获得其中一个有价值的 NFT。这可能很棘手，以下是你可以找到有价值 NFT 的三种方法。


    ## 1. 研究热门平台


    如果我们看看一些售出的最贵的 NFT，我们可以发现它们恰好在相同的平台上售出。当你检查如下所示的最昂贵的游戏 NFT 时，你会注意到 `Axie Infinity`、`F1
    Delta Time` 和 `Sorare` 反复出现在排行榜上。


    然而，你不能在这些平台内创建任何 NFT 并期望以高价售出。但你可以遵循获得热度的方法。让我们看看 `NBA Top Shot` 的例子。该平台上有很多 NFT
    现在都很很昂贵。你可能会看到 `Lebron James` 的 NFT 售价超过 `$250,000`。当然，我们已经太晚了。但是，我们可以将这种方法用于目前价格还不高的新
    NFT。如果我们回到 NFT 的历史中，假设我们处于该领域的早期。我们可以看到第一笔交易价格为 `$1,200`，不久后它以 `$1,600` 出售，之后又以
    `$2,000` 出售。


    所以我们可以看到，这东西在这个时间左右正在获得热度。我们不是第一个购买的人，但在几次销售后，我们可以看到人们确实在购买它，它正在获得热度。那正是我们想要进入的地方。当然，对某些人来说，这些价格可能太高了，但这就是
    NFT 的事实。这是一个付钱玩的游戏。有一种误解，认为 NFT 只是你跳进去创建，然后砰地你就富了。


    然而，事实并非如此。这种唯一有效的方法是你是有影响力的人并拥有一个营销平台。不幸的是，如果你不是那个人，如果你想获得你的，就必须付钱才能玩。


