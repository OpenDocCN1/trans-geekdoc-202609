- raw: 'Pak''s work is predominantly monochromatic with geometric shapes. With a price
    tag of $900,072.96, Pak''s "Metarift" portrays a six-sphere structure surrounded
    by what appears to be a four-ridged band. The two structures turn opposite to
    one other throughout the 12-second video, with a metallic tinge highlighting the
    materials'' different undertones. Pak will collaborate with leading auction house
    Sotheby''s for a global NFT sale in April.


    ## MAD DOG JONES


    **Total Artwork Value: $14,344,607.33**


    Mad Dog Jones is a Canadian artist who is dynamic, adaptable, and strange. Mad
    Dog Jones, a musician who also paints, has sold 1,567 NFT artworks for an average
    of $9,063.52.


    Jones'' best-selling artwork, "Boardwalk," is a 43-second video of a drawn city
    landscape. Small raindrops fall onto the scene as a cab is parked in an alley
    with a building looming overhead. Raindrops fall in rhythm with an accompanying
    beat. The art was sold for $388,888.00 on n February 21, 2021.


    ## SLIMESUNDAY


    **Total Artwork Value: $11,624,226.24**


    Mike Parisella, better known as SlimeSunday, is a Boston-based digital collage
    artist. SlimeSunday''s relentless pushing of the boundaries of what is allowed
    in mainstream media has earned him over 500,000 Instagram followers for his investigation
    of erotic and weird topics. To date, he has sold 6,508 NFT artworks for a total
    of $1,784.64 for each piece. "SlimeSunday has also built a name for himself alongside
    electronic music producer and NFT artist 3lau, creating the ssx3lau duo.


    His highest-selling artwork is Gunky''s Uprising," a duet with 3lau for which
    he provided visuals. SlimeSunday''s animation skills shine through the ssx3lau
    collaborations, even though the world mostly sees his two-dimensional digital
    designs. "The Process," SlimeSunday''s best-selling solo item, showcases his digital
    collage-making process while being accompanied by music from 3lau.


    ## HACKATAO


    **Total Artwork Value: $11,113,676.85**


    With a total of 1,504 pieces sold at an average of $7,310.61 per piece, OG cryptoartists
    Hackatao makes the top-selling chart. Named "hack" after the delight of going
    under the skin and discovering what''s inside, and "Tao," for Ying and Yang,


    Hackatao explores issues of humanity, environment, society, and crypto. The Italian
    duo''s best-selling piece, "Kim Jong Un - ''Dead and Alive'' Edition," is an animation
    depicting North Korea''s infamous leader sliding between flesh and skeleton. The
    work fetched $276,136.88 at auction. Described as "Like Schrödinger''s cat, until
    we open the dictatorship box he is both dead and alive," the artists play with
    state of being and color in signature Hackatao fashion.


    ## XCOPY


    **Total Artwork Value: $10,133,787.62**


    Xcopy, a London-based digital artist and cryptocurrency enthusiast, has sold 1,907
    NFT artworks. XCopy''s artworks often incorporate warped visual loops and flashing
    imagery warnings since his work almost always involves some form of flashing light
    pattern.


    "Death Dip" sold for $1,812,660.00, average $5,240.90 per piece, according to
    XCopy. A black screen with a white skull that changes angles fast makes up the
    piece. Surrounding blue and green squares shift position quickly, giving the impression
    of a full-body skeleton moving in circles around the screen.


    ## 3LAU


    **Total Artwork Value: $9,161,894.41**


    As 3LAU, DJ and fintech enthusiast Justin Blau has been releasing electronic music
    since 2011 and has performed at festivals including EDC Vegas, Lollapalooza, and
    Electric Zoo, among many others. 3lAU was one of the first to embrace cryptocurrency
    and blockchain and is now one of the most important personalities in the NFT movement.
    After selling 6,090 artworks for an average of $1,505.54 per, 3LAU has almost
    exclusively distributed his music as NFTs.


    His most expensive sculpture, "Gunky''s Uprising," a collaboration with artistic
    director SlimeSunday, sold for $1,333,333.33. SlimeSunday''s graphics accompanied
    a three-minute song released under the moniker SSX3LAU. 3LAU also staged the world''s
    first blockchain-powered music event in 2018.


    ## GRIMES


    **Total Artwork Value: $8,923,250.78**


    Long before joining the NFT realm, Canadian singer Grimes was a critically-acclaimed
    alt-pop artist. With 1,122 artworks sold for an average of $7,983.33 each, Grimes''
    fans immediately migrated to the NFT space.


    Her highest-grossing NFT, "Death of the Old," was sold for $388,938.00. Above
    what appears to be a wrecked castle, pink and white cupids soar. In the background,
    a sword stuck in the mountains holds the center of the screen as we rotate through
    the picture. The synth-pop demo "Anhedonia" plays throughout the video as Grimes''
    cupids fly closer to the viewer.


    ## WHISBE


    **Total Artwork Value: $8,433,625.45**


    WhIsBe, an anonymous street and fine artist, created NFTs based on his popular
    Vandal Gummy Bear series. The beloved sugary treats are juxtaposed with a prison
    mugshot background. WhIsBe''s installations include a red gummy bear and his NFTs
    experiment with the texture and color of the bear and the mugshot background.
    WhIsBe has sold 1,650 NFTs for an average of $4,507.38 per unit.


    The artist''s moniker, "What is Beauty," encourages viewers to think about their
    critiques on problematic institutions. "Exhibit," his highest-grossing piece,
    sold for $250,000.00. The thirty-second video features the skeleton of a gummy
    bear, still holding the prison picture plaque while roped off in what looks strangely
    like a natural history museum exhibit.


    ## SSX3LAU


    **Total Artwork Value: $8,191,686.80**


    SSX3LAU, a DJ and art director duo, debuts on the top-selling NFT charts as an
    independent creator. The long-running collaboration between 3LAU and Slime-Sunday
    has resulted in 5,740 artworks worth an average of $1,428.48 each.


    "Gunky''s Uprising," the duo''s highest-grossing piece, is part of their new "Iridescent"
    release. It was sold for $1,333,333.33. The three-minute movie begins with black-and-white
    images of what appears to be a mountainous landscape. As the beat fades, pops
    of neon color appear on the screen in every color of the rainbow, contrasting
    against the black background. The mirrored landscape morphs into geometric shapes,
    transforming the mountains into triangles, squares, and circles before a neon
    hand takes over the page,


    ## JOSE DELBO


    **Total Artwork Value: $8,042,605.61**


    In July 2020, Argentinian artist José Delbo, who is most known for his work on
    Wonder Woman, Little Lulu, and Captain Planet, released his first NFT. A 43-page
    original comic book titled "Death" sold for $642.14. During this time, he has
    sold 2,781 artworks for an average price of $2,884.53.


    "Genesis," Delbo''s highest-grossing NFT at $553,169.65, was co-written with TrevorJones.
    Delbo designed Batman, and Jones animated the picture. Batman emerges, looking
    directly at the viewer as the art progresses from pencil sketch to oil on canvas.


    ## RTFKT STUDIOS


    **Total Artwork Value: $5,689,100.45**


    RTFKT Studios began as an undefined collective and has now grown into a leading
    manufacturer of sneakers and digital artifacts. Sneakers are digital Skins that
    digital characters in the metaverse may wear, and they are the studio''s major
    focus.


    "Fewo Charm," the studio''s best-selling NFT and collaboration with Fewocious,
    grants the wearer "otherworldly luck and deep creative powers." It went for $88,888.88
    at the auction. With 916 NFTs sold for an average of $6,215.79 apiece, RTFKT''s
    products range from metajackets and cybersneakers to denim and even a "Super Toilet."


    ## BOSSLOGIC


    **Total Artwork Value: $5,022,817.04**'
