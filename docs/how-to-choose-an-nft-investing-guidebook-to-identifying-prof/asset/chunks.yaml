    # 如何购买 NFT


    一旦你完成了此过程，就准备好购买 NFT 了。在为钱包和账户注资后，购买过程非常简单。大多数 NFT 市场都有拍卖模式，在这种模式下，你可以出价并等待一段时间，看看你是否获得了该作品。拍卖可能会持续几天，如果你想买下某个作品，就必须比最高出价者更高的价格。


    另一方面，从初级市场购买 NFT 是一个好主意，因为你在另一个网站上出售它时，转售价值非常高。然而，这也有一些缺点。无论如何，预测 NFT 将如何被评估是困难的，因为需求可能会随时波动。


    ## 费用是多少？


    某些平台通常会收取你创建 NFT 的一小笔费用。但在 `Opensea` 中，创建 NFT 不需要费用。创建第一个 NFT 时只需支付一次性的 gas 费（燃料费），其他一切都是免费的。如果市场使用以太坊
    NFT，你需要“gas”来创建代币。以太坊 gas 费用取决于网络而异。随着汽油价格上涨，使用网络的人数也会随之增加。周末网络上的人较少，因此我们建议你尝试一下。


    ## 售卖 NFT 的流程


    要变现你的 NFT，你需要知道如何操作。注册一个 NFT 账户，并在你的收藏中搜索你想出售的物品。一旦找到它们，只需点击“出售”（sell）按钮激活它。要配置拍卖的定价和条款，在找到该选项后点击即可。


    所有市场的流程都略有不同。`Ether`（也称为 `ERC-20`）是你可能用来交换 NFT 获得的最流行的代币之一。像 `Opensea` 这样的平台在每次原作品出售时都会收取版税费（royalty
    fee）。现在你已经知道如何制作和售卖 NFT，可以随时随心意地开始你的业务了。


    ```

    10![](img/svgimg0003.svg)

    ```


    # 如何选择 NFT


    NFT 市场正在以惊人的速度扩张，早期 NFT 收藏拍出了高昂的价格。对于不理解什么赋予了 NFT 价值的新手来说，选择 NFT 可能是困难的。在本章中，我们将尝试介绍基础知识。


    ## 选择 NFT


    一旦你决定购买 NFT，关键问题是如何从市场上琳琅满目的 NFT 中进行选择。由于可选的类别和风格多到令人眼花缭乱，这里是一些建议。


    ### 稀缺性


    考虑稀缺性——稀缺性是价值的重要因素，但它本身不会让 NFT 变得有利。


    ### 独特性


    你会发现，许多提供的 NFT 都是现有有价值收藏的副本，这失去了意义。寻找那些正在做独特、创意或仅仅是趣味性 NFT。你会遇到许多本质上是剪贴画（Clip
    Art Images）区块链版本的 NFT，甚至更糟。从它们的销售历史来看，这些是跟风行为的低价值尝试。


    ### 美学


    在经典艺术中，画家和趋势来往往去，导致价格起伏。即使 NFT 艺术仍处于婴儿阶段，同样的趋势也适用；因此，他们努力预测未来的趋势，而不仅仅是追逐猿潮（Ape
    bandwagon）。


    ### 特性


    NFT 经常被构建为基于特定质量表示的主题集合的一部分。每个 NFT 都具有这些特征的独特组合。这就是宝可梦角色、MGTM、棒球牌和 Top Trumps
    的运作方式。


    ### 购买你喜欢的


    最好的建议是听从直觉，购买让你感到快乐的东西。作为初学者，你购买到可能有价值的 NFT 的概率与你买到中奖票的概率一样，所以请选择一些至少能为你提供娱乐并让你掌握流程的东西。


    ### 制定预算


    提前建立明确的预算至关重要；否则，你可能会发现自己逐渐向更贵的 NFT 范围移动，仅仅是因为你没有给自己设定任何限制。


    ### 理解投机


    NFT 拥有销售历史表明其他人认为它是有价值的，但这并不意味着你可以以稍高的价格买入然后转手获利。那是“大傻瓜”理论的定义，它导致了 1637 年的郁金花泡沫。尝试为了乐趣而不是投机而购买，因为
    NFT 的价值可能会下降。


    ## 如何选择加入哪些 NFT 项目


    有很多允许用户购买 NFT 的项目，但并非所有都值得。事实上，我认为其中大多数都是坏项目。


    ### 交易量


    一个很好的起点是查看 `Opensea` 或 `Cryptoslam` 等平台上的哪些项目交易量最大。这让你对目前哪些项目是热门且值得关注的有了很好的概念，但请注意：当热情消失时，交易量可能会迅速下降。


    ### 活动趋势


    当你有一个项目要审查时，活动随时间变化情况是观察点之一。用户数量和交易量是在增加还是减少？如果你在寻找短期交易，你应该只看那些处于上升趋势的项目。


    ### 社区


    确定社区人员对项目的参与程度和投入程度至关重要。加入 `Discord` 和 Telegram 频道，在 `Twitter` 上关注该项目，并参与一些讨论。是否有大量人正在讨论该项目？他们是在参与（并享受）游戏，还是仅仅在岸上观察？


    ### 项目阶段


    这是一个全新的项目，还是它已经筹备了一段时间了？是否有已完成的游戏或某种进度指示器？如果一个项目还年轻，且没有游戏或其他机制为 NFT 提供效用，那么建立社区将要困难得多。通常情况下，在预售或早期购买
    NFT 的风险要比投资一个已经产出某种东西并聚集了忠实追随者的项目大得多。


    ## 寻找优质的 NFT 项目


    关于 NFT（非同质化代币）引发了全球轰动。人们愿意在这些图形艺术品、迷因和收藏品上花费大量金钱。看看历史上售出的最昂贵的的 NFT，Beeple 的《Everydays
    The First 5000 Days》。这件特定的艺术品以惊人的 6900 万美元售出，打破了所有之前的记录，并为 NFT 设定了新基准。


    同样，几家新的技术和加密初创公司，如 `Larva Labs` 和 `Dapper Labs` 出现了。他们产生了如 `Crypto Punks` 和 `CryptoKitties`
    等项目，这些项目目前是最流行的 NFT 创业项目。

    '
