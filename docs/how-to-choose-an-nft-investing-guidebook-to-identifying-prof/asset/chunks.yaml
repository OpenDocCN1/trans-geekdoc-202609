  trans: '


    这些元素是 `ERC-20` 代币的强制性函数和规则。另一方面，代币可能具有上述三个可选特性。代币名称、符号以及最多 18 位的精度都是其特征。这些特征使得
    `ERC-20` 成为同质化标准。由于这些标准，同质代币必须具备以下属性，这些属性决定了它们在同质化与非同质代币争论中的地位。


    1. 同类型的同质化代币可以相互替代。

    2. 相似的底层规则治理同质化代币。

    3. 同质代币易于分割，人们可以使用较小的部分来支付较大的金额。


    ## 非同质代币使用 ERC-721


    然而，`ERC-20` 的局限性导致了显著的不一致性，促成了 `ERC-721` 代币标准的创建。`ERC-721` 代币标准在创建非同质代币时可能有用。惊讶的是，从功能上来说，`ERC-721`
    代币标准与 `ERC-20` 代币标准非常相似。`ERC-20` 和 `ERC-721` 之间的相似性主要归于以下因素：


    1. 开发者可以快速过渡，无需学习新的技能 set。

    2. 用户在通用钱包中存储代币并在交易所进行交易时可能会有更好的体验。


    `ERC-721` 接口有两个不同的方法，例如 `ownerOf` 和 `transferFrom`，它们具有不同的功能。`ownerOf` 特性用于查找谁拥有代币。`transferFrom`
    函数可传输代币的所有权。


    ## NFT 属性


    有几个属性区分了 NFT。其中包括：


    ### NFT 不具有互操作性


    这意味着一个 NFT 不能被另一个替代。因此，每个 NFT 都是独特的，拥有自己的一套特征和需要收集的数据。游戏 `CryptoKitties` 就是一个例子。用户无法在另一个游戏中使用游戏资产。


    ### 可验证性


    区块链存储了所有 NFT 的数据，使其能够轻松追溯到原始所有者。这简化了 NFT 的认证。非同质代币可以用独特的方式在数字空间中限制并呈现事物。许多其他加密货币和代币（如
    `Bitcoin` 和 `Ether`）是同质的。如果你给某人发送 ether 并收到 Ether 作为回报，你不会发现任何区别。代币也是如此，目前大多数代币基于以太坊的
    `ERC-20` 标准。简单起见，将这些代币中的每一个视为一张十美元钞。如果你将这张代币交给某人，并在一周后收到另一张，它们是相同的。对于非同质代币，这一切都改变了。目前以太坊区块链上的大多数
    NFT 都遵循 `ERC-721` 标准。该标准的代币可以比宝梦或游戏王收藏卡。每个代币都是独特的，并且具有不同级别的稀有性。


    ### 不破坏性


    由于对区块链技术和智能合约的使用，NFT 几乎不可渗透。区块链内在的开放性和不可变性意味着 NFT 不能被删除或复制。


    ### 不可分割性


    同质代币是可以分割的，这意味着 `Bitcoin` 或另一个 `ERC-20` 代币的部分可以被发送或拥有。类似于现金，你可以用十美元钞支付并获得找零。非同质代币不能共享，必须完整地购买或出售。就像收集卡一样，没有人会考虑购买半张卡。


    ## NFT 的出现


    最初只是加密货币和游戏爱好者中的小众话题，从那以后引起了行业之外的广泛关注。NFT 在艺术领域特别受欢迎。加拿大艺术家兼音乐家 Grimes 在 `Nifty
    Gateway` 平台上拍卖数字艺术，在 20 分钟内筹集了约 600 万美元。


    著名的英国拍卖行佳士比最近加入了 NFT 浪潮。佳士比正与加密艺术销售平台 `Marketspace` 合作，拍卖艺术家 Mike Winkelmann（绰号
    Beeple）的第一个全数字 NFT 作品，活动将持续到 3 月 11 日。在拍卖结束前一天，“Everydays: The First 5,000 Days”的最高出价为
    975 万美元。


    越来越多的音乐家和社交影响人物也正在利用 NFT 的可能性。来自美国的乐队 Kings of Leon 表示，他们的新专辑将以限量 NFT 版本的形式发行。德国艺术家
    Fynn Kliemann 在区块链上拍卖了 100 首 NFT 制作的短曲，筹集了约 25 万美元。


    收藏家和游戏玩家同样喜欢 NFT。像 `Open Sea` 这样的 NFT 网站除了加密艺术外，还交易表情包和卡片等收藏品，这些通常被称为电脑游戏材料。例如，一个无名用户最近花费了
    300 以太坊（购买时约值 60 万美元）购买了一个“Nyan Cat”动画 gif 的更新版本，该动图已经在互联网上流传了十多年，是广负盛名的 gif 之一。


    另一个例子是 `Sorare`，这一个幻想足球网站，功能类似于数字 Panini 贴画。足球粉丝可以购买他们喜欢的球员的限量版收藏卡。到为止，卖出的最贵卡片价格为
    57,000 美元。在 NFT 市场上，玩家可以购买虚拟角色、资源或商品。目前的记录保持者是基于区块链的收藏类怪兽游戏 `Axie` 中的一块虚拟土地，有人为此支付了约
    150 万美元。


    ### 说 NFT 是下一个大趋势是安全的吗？


    有些人仍不确定 NFT 的兴起意味着什么。在艺术领域，物质价值通常优先于物体的“理想”价值。数字证书在确保真实性的同时限制了复制，将虚拟物品提升到了身份符号的高度。


    另一方面，NFT 是投资和投机对象，受供需影响。这是因为加密物品可以被购买，并可能作为经典艺术转售以获利。然而，与对加密资产的任何投资一样，NFT 价格和加密货币价格存在剧烈变化的巨大风险。


    ## NFT 批评


    但也存在阻力——不仅是因为加密货币价格的大幅波动。批评之一涉及可能的版权侵权问题。例如，如果不验证区块链上的卖家是否真的拥有这些权利，就会出现问题。此外，所有者仅在购买时所在的区块链上拥有该加密对象。大多数情况下使用
    `Ethereum` 区块链。从理论上讲，支持 NFT 的其他区块链上的任何对象都可以重新报价。


    NFT 也是消耗能量的。由于以太坊的单次交易需要许多计算机的计算能力，其能耗非常高。NFT 的各种交易取决于拍卖的竞价次数。因此，能源需求增加。


    ## 与 NFT 相关的风险


    尽管 NFT 越来越受欢迎且价格飙升，这些收藏品确实存在风险。首先，这些不是稳妥的投资。相反，它们看起来更像是一种投机资产。


    与运动卡的对比是恰当的，也可以将其视为手提包、运动鞋或艺术或其他投机资产。它们不产生现金流，像沃伦·巴菲特这样的传统投资者不会接触它们（目前）。


    收藏家愿意支付巨额资金获得艺术品或视频片段的“官方”版本，尽管你可以在网上免费查看或下载它。但这个行业存在很大的误解空间。NFT 不为你提供任何版税，也没有保证世界上有多少个独一无二的作品。


