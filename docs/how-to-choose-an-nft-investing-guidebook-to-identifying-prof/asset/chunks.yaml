  trans: '

    鉴于 NFT 无法产生现金流，唯一的盈利方法就是有人愿意支付更高的价格。这被称为投资中的“大傻理论”法。目前，市场中存在大量针对这种“大傻理论”的投机行为。


    NFT 面临的另一个风险是流动性问题：如果没有人购买你的 NFT，你就无法快速或永远无法对其进行转交易。这是与提供即时流动性的股票市场相比的主要区别。第三，存在交易对手风险，即
    NFT 的原始创作者可能并不拥有该艺术品或体育片段的特权。尽管如此，大多数交易者仍将 NFT 作为一种快速获得巨额利润的手段。这种市场对于那些误判入场退出时机的人来说，通常会陷入混乱的局面。


    与其他投机性投资一样，人们对这种也应该保持谨慎。你只能投入你能得起损失的金额。因为这些资产也会经历高低波动。


    如果你是因为喜欢它或只是真心想拥有它而购买 NFT，那么涉及的风险并不多，因为你可以永远拥有它。相反，如果你仅仅是为了投机炒卖而购买 NFT，那么就是另一回事了。尽管如此，NFT
    相比来说是安全的，即使它们不是一种优秀的资产。NFT 相比物理艺术品确实具有优势。画作可能在抢劫中从画廊被盗，但盗取 NFT 通常需要破解个人的私钥。这不是一项易事，特别是当所有者像大多数人那样或应该那样将其离线安全时。此外，
    NFT 是瞬时且可验证传输的，你的所有权不受边界限制。


    # NFT 的重要性


    非同质化代币是相对简单的加密货币概念的进步。现代金融系统包含了各种资产类别的精细交易和贷款方案，范围从房地产、贷款协议到艺术品。通过允许物理资产的数字化呈现，非同质化代币在重建这一基础设施方面迈出了大胆的一步。


    具体而言，物理资产数字插画的想法并不新鲜，唯一标识的使用同样如此。然而，当这些模型与智能合约防篡区块链的优势相结合时，它们就变成了一种强大的转型力量。


    可能 NFT 最显著的优势是市场效率。将物理资产转化为数字资产重构了流程并消除了中间环节。代表区块链上数字或物理创作的 NFT 消灭了对代理人的需求，允许艺术家直接与他们的受众建立联系。他们还可以开发业务流程。例如，一瓶葡萄酒的
    NFT 将使供应链中的不同人员更容易与其互动，并帮助在整个过程中追踪其源头、生产和销售情况。


    NFT 在身份管理方面也表现出色。考虑一下在每个出入境点都需要生成物理护照的情况。通过将个人护照转换为 NFT，所有这些护照都有了它们独特的分类特征；可以想象重新组织司法管辖区的出入境程序。扩展这一用例，NFT
    也可以用于数字世界中的身份管理。


    NFT 还可以通过分割房地产等物理资产来实现融资民主化。与物理资产相比，将数字房地产资产分配给多个所有者要容易得多。这种代币化代码不必局限于房地产；它可以扩展到其他资产，如艺术品。NFT
    最令人兴奋的可能性在于新方法的构想。


    # 非同质化代币与 DeFi 的历史


    正如 `Fi`（去中心化金融）协议模仿银行的金融产品一样，NFT 模仿艺术画廊、商店和博物馆的世界，但没有昂贵且高风险的中间环节。这是通过最初诞生于以太坊的智能合约
    `dApps` 实现的。这种可编程区块链可以为各种去中心化应用程序提供服务。换句话之，NFT 市场是通过将 NFT 创建者直接连接到买家来实现整个 NFT
    经济的 `dApps`。这极大方便了双方的进入，从而消除了通常的障碍。


    NFT 本身是一种 `ERC-721` 代币，它是不可分的或非同质化的，因此得名。它的价值基于区块链技术的保证，即没有 NFT 可以被伪造。此外，作为完全数字化的资产，整个交易历史都是可追踪和可验证的。


    我们可以看到，自二月以来，全球对 NFT 的兴趣大大增加。随着越来越多的人看重数字资产而非物理资产，这种 NFT 趋势几乎是可以预见的。我们正通过以下 11
    个最昂贵的 NFT 沉浸在这个新世界中。现在我们解释了什么是 NFT，可以深入这些资产的丰富历史了。


    ## 2012–2013：彩色币 (Coloured Coins)


    可以认为彩色币是存在的首批 NFT。彩色币由 `BTC` 的小额价值组成，通常小至 `1 Satoshi`。彩色币可以代表大量资产，并具有多种用例，包括：


    *   遗产

    *   优惠券

    *   提取你自己的加密货币的能力

    *   发行公司股份

    *   订阅

    *   访问令牌

    *   数字收藏


    彩色币是比特币能力一次大飞跃的例子。其缺点是，只有当所有人对自己的价值达成一致时，它才能代表某些价值。比特币的编码语言从未设计用于在性网络中启用这种行为，因此彩色币的强度取决于其最弱的参与者。例如，三个人同意用
    100 个彩色币代表 100 股公司。如果某个用户决定停止同步代表公司股份的彩色币，整个系统将会崩溃。


    '
