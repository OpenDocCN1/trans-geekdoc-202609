    而且你尽早进入这一事实意味着你将来有很大机会获利。然而，你还必须确定在该项目中为什么以及哪些类型的 NFT 是稀缺且重要的。寻找稀有的品质和属性，并看看你是否能以低成本获得它们。


    这就是你如何以无风险的方式投资 NFT。因为大多数人追求艺术和创造力，这并不是坏事。然而，问题在于人们购买的是随机的艺术品，坦率地说，市场上 90% 的 NFT
    在艺术和创新性方面看起来都很很妙。


    很难预测哪个 NFT 会售出，以及哪种艺术在未来会升值。总之，NFT 领域是收藏品和艺术产业的混合体。因此，当你购买任何 NFT 时，你买的要么是一个视觉精美的艺术品，要么是一个
    NFT 收藏品。


    ## 寻找优质 NFT 项目的额外技巧


    我发现的另一种极大地帮助我发现优质 NFT 项目的方法，是始终关注以下主流媒体网站，例如：


    * Mashable

    * The Verge

    * Coin Telegraph

    * Tech Crunch


    记住，拥有大型社区的 NFT 网站是良好的 NFT 投资项目。而且，大多数时候，在这些大型媒体网站上被重点介绍的 NFT 项目立即在规模和价值上增长。Crypto
    Punks 是我能给你的最好例子。


    谁会想要为一个仅由 2424 个像素 Punk 角色组成的画品赌博呢？它们看起来像是一个 5 岁小孩的作品，这个孩子可以创作、描绘 Punk 角色并将其作为
    NFT 进行营销。然而，当 CryptoPunks 首次推出时，只有 20 到 30 个用户声称拥有了一些 Punk 个性。但当 Mashable 将 Cryptopunks
    作为一个迷人的新 NFT 项目的故事时，整个 10,000 个 Punk 字符在几小时内售罄。


    当然，这并不意味着 Crypto Punks 仅仅依靠专题报道就走红，坦率地说，Crypto Punk 有独特的故事和概念。然而，媒体报道对 Cryptopunks
    非常有利。


    这表明这些媒体网站确实强大，在这些网站上搜索 NFT 项目可以引导你发现极其成功的 NFT 项目。


    我通常去他们网站的搜索框搜索关键词“NFT”。通常你会看到大量关于 NFT 的新闻报道，但我相信你会遇到一些有趣的启动项目。


    ### 在 Twitter 上寻找 NFT 项目


