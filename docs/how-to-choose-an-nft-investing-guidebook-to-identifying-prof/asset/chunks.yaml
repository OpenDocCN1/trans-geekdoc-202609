  trans: '

    假设 Logan Paul 发布了一个 NFT。有人以 100 美元买了它，紧接着有人以 150 美元买入，然后又是 200 美元。你可以看到它正在获得关注，这可能是一个入场买入的良好切入点。你可以看出，人们产生了一种愿意为它支付更高价格的趋势。但如果你入场太早，你可能只是买了一个没人想要的东西。


    所以，如果我们自己不是有影响力的人，我们可以跟随那些影响力人物并获得关注。有时，你甚至可能成为加密艺术世界中的影响力人物。佳士得拍卖行出售过著名数字艺术家
    Beeple 的 NFT 艺术，他是一个来自威斯康星州、名叫 Mike Winkelmann 的人。他是一个普通人，但在这个数字世界里创造了属于自己的影响力和声誉。因此，你可能可以在
    Rarible 上创作随机艺术，也许某天你就会成为这样的人，你的作品也会售出。但这种可能性非常低。如果你从已经建立起这种声誉的人那里购买，卖出有价值的 NFT
    品的概率更高。


    ### 3. 尝试购买第一个


    这意味着来自特定创作者的第一个 NFT 或行业内的首个品种具有最高价值。这就是为什么 CryptoKitties 现在如此昂贵，因为它们是历史上被创建的第一个。由于人们喜爱这一点，它们将永远具有某种重大价值。创作者的第一个
    NFT 具有历史意义。首创总是能创造话题、兴奋和炒作。所以，如果你能买到某个“首创”的东西，它可能会被该艺术家、品牌或流派的粉丝所认可。


    ### 4. 实体性的具有更高价值


    这意味着 NFT 应该具有一些实性的元素，例如其背后的物理资产或体验。例如，对于 Logan Paul 的 NFT，如果你拥有他的 NFT，你就有机会见到他。


    ### 5. 域名


    如果我们进入 OpenSea，会发现其中一些域名已经以高价售出。这里需要注意的一点是，它们都是非常短的名字，比如 `wallet.eth`、`google.eth`
    和 `amazon.eth` 等。我们从之前的域名泡沫中了解到，人们愿意为有价值的域名支付大量资金。短的 `.com` 域名已以数百万美元出售：`business.com`
    价值 3.45 亿美元，`carinsurance.com` 价值 4900 万美元。


    对于域名 NFT，最好购买单单词的，有时两个单词的也可以接受，但三个单词的域名未来可能没有价值。你还需要注意域名的后缀，包括 `.eth`、`.crypto`
    等。在传统的域名世界中，以 `.com` 结尾的比 `.net` 结尾的更有价值。


    所以你在这里进行的赌博是猜测这些域名中哪一个将在 20 年后胜，无论冠军是 `.eth`、`.crypto` 还是其他。假设你需要一个非常有价值的单单词域名，比如
    `wallet.eth`，遗憾的是，你必须去开放市场支付溢价。或者你可以从零开始。你可以去 Ens domains 购买 `.eth`，或者去 unstoppable
    domains 购买 `.crypto` 等。


    ### 6. 稀缺性是关键


    这意味着 NFT 应该具有一些实体元素，例如其背后的物理资产或体验。例如，对于 Logan Paul 的 NFT，如果你拥有他的 NFT，你就有机会见到他。


    ### 7. 虚拟房地产正蓬勃发展


    “让我们去 Decentraland 吧”可能是你在不不久的未来会听到的一句话。


