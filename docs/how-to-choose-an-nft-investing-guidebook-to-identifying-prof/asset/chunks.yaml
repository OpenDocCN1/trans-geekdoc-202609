- raw: 'The first mention of Coloured Coins appears to come from a blog post by Yoni
    Assia in early 2012 titled "bitcoin 2.X (aka Colour Bitcoin) – first features".
    In his post, he discusses Coloured Coins but does not refer to the various assets
    or their use cases. Instead, he claims that Coloured coins are unique and identifiable
    from normal bitcoin transactions since they are bitcoins that are part of the
    "Genesis process." The potential of these new assets was apparently not explored
    until December 4, 2012, when Meni Rosenfeld published an article titled "Overview
    of Coloured Coins." A few months later, in 2013, another article titled "Coloured
    Coins – BitcoinX" was published.


    The flaws of Coloured Coins were obvious; the system worked best in a permissible
    environment, which means that in some cases, it is better to simply use a database.
    However, Colour coins opened the door for more experiments and laid most of the
    foundations for NFT''s. The enormous potential of putting real-world assets in
    distributed ledgers was clear, but implementation required a more flexible blockchain.


    **2014 – Opposite Side**


    The creation of Coloured Coins has led many people to realize the enormous potential
    to export their assets to blockchains. However, people also understood that Bitcoin
    itself does not mean enabling these additional features in its current iteration.
    The other side had a decentralized exchange where asset creation was allowed and
    even crypto tokens with XCP. Trading card games and breast trading were only two
    of the many projects and assets it possessed at the time of its demise.


    **April 2015 – Creation Magic on the Other Side**


    Spells of Genesis game creators were pioneers and among the first to launch an
    ICO to release in-game assets to a blockchain through Counterparty. So early,
    in fact, ICOs were later called crowdfunding. Spells of Genesis financed the development
    by launching a token called BitCrystals, which is used as an in-game currency.


    **August 2016 – More Trading Cards on the Other Side**


    In August 2016, Counterparty teamed up with Will''s popular trading card game
    to launch its cards on the Counterparty platform. Force of Will was the 4th card
    game by sales in North America, only behind Pokemon, Yu-Gi-Oh, and Magic. Their
    entry into the ecosystem pointed to the value of putting such assets in a blockchain.


    **October 2016 – Rare Pepe on the Other Side**


    In October 2016, people began to extract "rare peppers" as a presence on the Counterparty
    platform. Rare Pepe is a type of udder that contains this frog character. These
    have a huge fan base. There''s even a kind of breast replacement called the Rare
    Pepe Breast Index.


    As if being on a Bitcoin blockchain wasn''t enough, the Rare Pepe Breast Index
    has "experts" who confirm that Pepe memes are rare. Oddity aside, this example
    shows the point at which people want unique digital elements. Today, Counterparty
    has many projects built on its platform, many of which include NFT-like assets.


    **March 2017 – Rare Pepes on Ethereum**


    With Ethereum coming to the fore in early 2017, memes began trading there. In
    March 2017, it was announced that a project called Peperium was "a decentralized
    meme market and trading card game (TCG)" that allows everyone to create memes
    that live forever in IPFS and Ethereum. Like Counterparty, Peperium also had a
    token associated with rare''s ticker symbol, which is used to pay breast creation
    and listing fees.


    **June 2017 – Cryptopunks**


    It wasn''t until the Ethereum Blockchain that NFTs picked up speed. The first
    Ethereum NFTs appeared as Crypto Punks in summer 2017. Crypto Punks are 10,000
    unique digital characters created by Larvalabs. Your digital property records
    are stored in the form of unique tokens on the Ethereum blockchain. Each Crypto
    Punk has individual optical properties so that no one is the same. Crypto punks
    inspired the digital art market and were the forerunners for later standards.
    Due to the limited offer and the cult status of early users, they are already
    considered digital antiques. They are still tradable and interoperable with most
    NFT applications on Ethereum.


    As the trade of rare peps in Ethereum increased rapidly, two "creative technologists"
    decided to create their NFT projects with a slight twist. John Watkin-son and
    Matt Hall realized that they could create unique characters created on the Ethereum
    blockchain. Characters will be limited to 10,000, and the two characters will
    not be the same. In reference to the Cypherpunks who experimented with bitcoin''s
    pioneers in the 1990s, they named their project Cryptopunks.


    Surprisingly, Watkinson and Hall chose to allow anyone with an Ethereum wallet
    to request Cryptopunk for free. All 10,000 Cryptopunks were quickly requested,
    launching a thriving secondary market where people bought and sold them. Interestingly
    enough, Cryptopunks does not follow the ERC721 standard as it has not yet been
    invented, but due to its limitations, they were not entirely ERC20. Therefore,
    Cryptopunks can best be described as ERC721 and ERC20 hybrid.


    **October 2017 – Birth of CryptoKitties**


    With CryptoKitties, NFT''s have reached the mainstream. Virtual kittens can be
    adopted, grown, and traded in CryptoKitties, a blockchain-based game. Cryptographic
    cats!


    Although Crypto Punks were officially the first NFTs on the Ethereum blockchain,
    most of the CryptoKitties are still in the memory. At the end of 2017, they became
    the first mainstream application of NFTs.


    2017 was already a year of hype around cryptocurrencies, driven by the ICO bubble
    on the Ethereum platform. In a short time, countless new ICO projects started,
    and each of them had new and supposedly scarce tokens on offer. This triggered
    a veritable gold-digger mood. More and more new cryptocurrencies on the Ethereum
    blockchain saw the light of the digital world. It wasn''t long before the network
    became increasingly congested, with significantly increased transaction fees as
    a result. However, one of the reasons for the high utilization was, among other
    things, the creation and trading with CryptoKitties.


    CryptoKitties are digital images of comic cats created by Dapper Labs for a blockchain
    computer game. Each cat is unique and therefore only present once on the blockchain.
    The special thing about them is that new unique CryptoKitties can be bred by clubs
    of different cats in the on-chain computer game. These new cats could then be
    auctioned or sold on the open market.


    **The CryptoKitties Bubble**


    Breeding has attracted many speculators. The idea was simple: you buy some rare
    CryptoKitties, breed some new, even rarer cats with them, sell them at high prices,
    and then the whole thing again from the front. At peak times in 2017, the trading
    volume was approximately 5000 ETH, and sales of CryptoKitties achieved prices
    of more than 100,000 US dollars.


    It was almost absurd to pay such high prices for digital cats. But the incredible
    story behind it, combined with the great hype around cryptocurrencies, brought
    many new buyers into the market in a short time. Ethereum''s network capacity
    at the time was not up to the rush, resulting in horrendous fees and hours of
    waiting for the trading and breeding of CryptoKitties.


    This mixture of hype, speculation, and viral story eventually ended up in a bubble
    that also attracted attention in the press. But, as might be expected, the bubble
    burst soon after. In mid-December 2017, demand for CryptoKitties fell at once,
    and prices plummeted. The entire crypto bubble began to burst shortly after, and
    a multi-year bear market was launched.'
