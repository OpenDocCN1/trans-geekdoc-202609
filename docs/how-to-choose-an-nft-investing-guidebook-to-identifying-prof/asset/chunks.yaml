  trans: '

    这是完全可能的。所以简短的答案是可能。然而，非同质化代币（NFT）所帮助的市场是真实的，并且在某种程度上受到了良好意图的影响。是的，有投机者在推动奢侈艺术市场；尽管如此，`Linkin
    Park` 的 `Mike Shinoda` 专门为粉丝创作了一首新单曲并将利润捐给了慈善机构。据观察，普通普通个人确实在收藏这些物品，而不仅仅是少数万富翁在参与。募捐活动可以提供独家内容。


    其他艺术家希望以类似于提供 `Cameo` 互动、`OnlyFans` 内容甚至特殊的 `Patreon` 奖品的方式提供 NFT。这是一种通过一定金额来交易一种“访问感”的方法，而粉丝们觉得这笔钱是在支持他们喜爱的艺术家。Grimes
    可能会让市场爆红；然而，非名艺术家可能会成为支持非同质化代币的虚拟手段。


    合适的 NFT 的另一个关键优势是，艺术家可以轻松、有力地查看他们的艺术品在何处以及什么价格出售。这意味着他们可以永久地获得每笔销售的百分比，因此，如果他们的艺术正如投机者所信的那样积累大量价值，艺术家将继续从这些财富中受益。


    4![](img/svgimg0003.svg)


    # NFT 的各种用途


    NFT 履行了扩大可访问加密资产范围的承诺。无论你是一个试图将自己现有资产（如邮票或卡片）代币化的收藏家，还是一个渴望在不同游戏之间传输物品（`皮肤、武器等`）机会的玩家，你都可能对这个不断发展的市场产生兴趣。


    数字艺术家可能会发现这种媒介具有启发性，因为 NFT 提供了一种种在互联网上保护数字所有权的方法。在 `blockchain` 上记录艺术品创作可能帮助艺术家在虚拟世界中展示他们的作品，并诱使买家购买无须担心欺诈行为的原创作品。


    同样，更具决定性的用例可能是 NFT 的未来。这一理念的一些追随者推测，NFT 甚至可以取代指定从房地产到官方记录的所有物品所有权的重要文件。以下是 NFT
    建立其存在和意义的一些方法：


    ## 艺术


    最常见的可用 NFT 艺术是数字艺术，它是技术与想象力的结合。许多独家版的动态艺术作品可以被编程在满足不同条件时发生改变。遗产艺术领域也通过将现实世界的资产和创作代币化引入了对
    `blockchain` 技术的接受。这是 `blockchain` 和 `IoT` 的结合，使人们能够扫描位于艺术品背面贴纸上的代码，并将其在 `blockchain`
    上记录为该作品的所有者。消费者随后可以查看艺术品的完整历史，包括之前所有的所有权和交易价格。


    NFT 为数字收藏家和艺术家提供了许多优势。在 NFT 出现之前，由于无法验证数字艺术的真实性，使其变现变得非常困难。今天，以 NFT 形式呈现的独特数字艺术可以通过
    `blockchain` 技术进行追溯。历史首次第一次，数字艺术的起源和价值可以被确认，且这种确认伴随着对真实性和稀缺性的信心。


    一些最著名的 NFT 艺术市场有 `SuperRare`、`Known Origin`、`OpenSea`、`Nifty Gateway` 和 `MakersPlace`。主流艺术界也注意到了这一点。尊敬的艺术拍卖行
    `Christie''s New York` 最近为 `Mike Winkelmann`（即数字艺术家 `Beeple`）及其数字艺术史上的独特作品 `Everydays:
    The First 5000 Days` 举行了拍卖。这是 `Christie’s` 首次提供的纯数字艺术品 (NFT)，并在在线上以近 7000 万美元成交。


    ## 收藏品


    个人学习如何使用 NFT 最简单且主要的途径通常是通过在线收藏品，例如深受喜爱的 `CryptoKitties`，它的崇拜者在 2017 年巅峰时期挤塞了
    `Ethereum` 系统。`CryptoKitties` 是卓越的数字猫，可以饲养出更多不可比拟的猫，某些特定特征被认为比其他更有前景（例如眼睛颜色或毛发图案）。


    ## 时尚


    `blockchain` 已无缝并入时尚领域，并为供应链中的所有贡献者带来了利益。客户现在可以以数字方式验证他们所有物品和配件的所有权，从而消除了伪造的可能性。这可以像扫描专门用于销售标签或内部标签的
    NFT `QR code` 一样轻松完成。客户还可以了解细节，例如资产的产生地、在到达消费者手中之前谁曾声称拥有过它等。


    作为一名名为 `FEWOCiOUS` 的 18 岁加密艺术家，虚拟运动鞋品牌 `RTFKT Studios` 与该加密艺术家合作了一系列以“Drip”和“Charm”形式呈现的虚拟运动鞋和数字商品。


    推出了三种风格的运动鞋，并售出了 600 多双，总额超过 310 万美元。这是时尚行业拥抱 NFT 的最新示例。


    ## 音乐


    音乐文件也可以与 NFT 关联。这样，只有声称拥有文件所有权的个人才能访问它。`Nifty gateway` 目前是艺术家将其歌曲铸造为 NFT 最流行的平台。


    从音乐听者的角度来看，这意味着只有有限的记录是可以访问的——它们不能被分发和复制。它给听者带来了一种独特性，为音乐提供了与黑胶片相当的收藏级，但同时有现代技术支持这种卓越。


    唱片收藏是前数字时代主流文化中最常见的收藏品；然而，音乐和互联网流媒体网站的引入改变了这一点。音乐抄袭在行业内屡比皆是，给艺术家带来了数百万损失。这种方法从根本上有利于艺术家，因为他们有机会消除中间环节并坚定地接触他们的粉丝。


    ## 其他应用


    拥有理想的域名可以增加你网站的流量，从而增加利润。域名是稀缺的，购买正确的域名通常昂贵且耗时。将域名连接到 NFT 可以生成其不可争议的轨迹历史，以解决追踪问题。此外，NFT
    域名可以轻松接入其他 NFT 网络。`Ethereum Name Service (ENS)` 和 `Unstoppable Domains` 是两个与 NFT
    相关的域名提供商。


    伪造是消费品创造者通常面临的问题。预计到 2022 年，假品的全球影响将达到 4.2 万亿美元。消费者希望他们购买的高级包、帽衫或稀钻是可靠的。与 NFT
    相关的现实物品提供了一种追踪商品生命周期和轨迹并验证其真实性的方法。`Louis Vuitton` 正在测试 NFT 以解决这个问题，`LVMH` 集团的其他品牌以及钻石专家
    `De Beers`。


    随着 NFT 业务的发展，开发者正在寻找对 `ERC-721` 代币标准进行开发，为企业家提供更多的操作性。例如，`ERC-1155` 是一种允许单一智能合约处理多个代币类别的标准——包括同质化代币、非同质化代币以及介于两者之间的标记。


    NFT 将区块链在商业细分领域的用例扩展到了远超金融的范围，同时吸引了艺术家、游戏玩家、奢侈品消费者和数字猫迷等多元化的观众。

    '
