- raw: 'Let''s say Logan Paul released an NFT. Someone buys it for $100, and then
    right after someone buys it for $150, and then right after $200. You can see that
    it''s gaining traction, and this may be a good entry point to get in and buy it.
    You can tell that there is a trend that people are willing to pay more for it.
    But if you go in too early, you might just buy something that no one else wants.


    So If we aren''t the people of influence ourselves, we can follow those people
    of influence and gain traction. Sometimes you could become the person of influence
    in the crypto art world. Christie''s auction house sells NFT artworks from famous
    digital artist Beeple, a man named Mike Winkelmann from Wisconsin. He is a regular
    person who has created his own influence and reputation within this digital world.
    So it is possible you can create random arts on Rarible, and maybe one day you
    will become this person, and your works will sell. But the likelihood is very
    low. It is a higher probability that you will be able to sell NFT artwork of value
    if you purchase it from someone who already has built that reputation.


    **3\. Try to buy the first**


    This means that the first NFT from the specific creator or its first kind in the
    industry has the best value. That’s why the CryptoKitties are so valuable now
    since they were the first ones ever created. They will always have some significant
    values because people love that. The first NFT from the creator is historical.
    The first ones always create buzz, excitement, and hype. So if you can buy into
    something that is first, chances are it will be valued by fans of that artist,
    brand, or genre.


    **4\. Tangible ones can have more values**


    This means that NFT should have some tangible elements, like physical assets behind
    it or experience. For example, for Logan Paul’s NFT, you will have a chance to
    meet him if you have his NFTs.


    **5\. Domain names**


    If we go on to OpenSea, we can see that some of these domain names have already
    sold for a high price. Something to notice here is that they''re all very short
    names, like “wallet.eth”, “google.eth”, and “amazon.eth”, etc. We learned from
    the previous domain bubble that people are willing to pay a lot of money for a
    valuable domain. The short “.com” ones have been sold for millions of dollars:
    business.com is worth 345 million dollars,carinsurance.com is worth 49 million
    dollars.


    For the domain name NFTs, it’s best to buy something with one word, sometimes
    you can get by with two words, but three-word domain names likely won''t be valuable
    in the future. You also need to pay attention to the ending of the domain names,
    including “.eth,” “.crypto,” etc. In the traditional domain name world, the ones
    ending with “.com” are more valuable than others, ending with“.net.”


    So the gamble that you''re making here is guessing which one of these domain names
    will be the winner in 20 years, whether the winner will be “.eth,” “.crypto,”
    or something else. Suppose you want a very valuable domain that is one word, something
    like “wallet.eth”, unfortunately, you will have to go to the open marketplace
    and pay a premium for it. Or you can start from scratch. You can go to Ens domains
    to buy “.eth,” or you can go to unstoppable domains to buy “.crypto” or others.
    The downside here is that you''re going to have a tough time getting your hands
    on very simple domain names that are the more premium ones and have already been
    bought, and you will have to get them on an open marketplace.


    **6\. Scarcity is key**


    This one is easy to understand. If something is scarce, it will be more valued.


    13 ![](Images/svgimg0003.svg)


    # WHAT BRANDS NEED TO KNOW ABOUT NFT


    Entering the world of NFT is new and poses a lot of challenges. Different brands
    are opting to hop on this trend. For this reason, brands must be aware of the
    several things that are mentioned below.


    **Brands Are Already Going in the Space & Nostalgia Controls Supreme**


    NBA Top Shot hits the right cords by creating a nostalgic feeling for sports card
    collectors. Apart from these, digital cards are live instants taken from games.
    Owner of the NBA Dallas Mavericks, Mark Cuban, realizes a future for digital goods
    in the NBA. Cuban emphasizes that everything digital can be an NFT. Though, the
    experiment is to create a market. NBA Top Shot demonstrated that there is a market
    full of individuals who wish to own "the best moments from NBA history."


    Cuban stated in an interview with Coindesk, "We can sell virtual Mavs stuff, footwear,
    art, images, videos, experiences, and everything else our minds can think up."
    We''re thinking of putting our virtual jewelry, accessories, and clothes into
    real-life photos on social media. So you can dress up your posts with stylish
    Mavs virtual sneakers that look just like the ones on your feet."


    Famous actor William Shatner developed NFTs of pictures of his film career and
    personal life, which were released on the WAX blockchain. These digital collectibles
    can be merchandized, see complete ownership of the collectible, and display their
    inventory on social media. Therefore, another technique NFTs develop using nostalgia.


    **Virtual Real Estate Is Thriving**


    "Let''s go to Decentraland" is a phrase you may hear in the not-so-distant future.
    Virtual real estate signifies a real perspective for investors. Similar to URL
    domain grabs in the early Dot Com age, digital land grabs are also selling for
    millions. Since its introduction to broader audiences in February 2020, Decentraland
    has traded $1 million in virtual land. In Axie Infinity, a crypto-Tamagotchi virtual
    ecology, a public member bought nine digital land plots as one piece for 888.25
    Ether. At the time, 888.25 Ether was valued at $1.5 million.


    Establishments such as The Sandbox are sighting their virtual land sales to sell
    out under hours of release and are recording hyper-growth. Arthur Madrid, the
    CEO of the company, just spoke at the GamesBea. He talked about the significance
    of the blockchain when it comes to the creation of metaverse.


    Gary Vaynerchuk stated on CNBC''s Fast Money, "You can see how advanced the Internet
    is. People are really naive about how early we are in all of this, in my opinion."
    It is seen that the latest Internet is being designed while we type. In Axie Infinity,
    Lunancia areas 90,601 plots of land in whole, of which 19% are now player-owned.


    Additional virtual worlds such as Upland.me are upgrading the world by tokenizing
    it on the blockchain. Updates are being worked upon, which will permit users to
    import NFTs from different blockchains. Moreover, drivable cars, housing, commercial
    property development, and the launch of businesses are also part of the growth.


    **Fashion, Art & Entertainment Are NFTs Holy Grail**


    Individuals are purchasing trading cards, celebrity art, and digital lands from
    an investment perspective for the future. However, entertainment and fashion will
    be the main focus of the blockchain. Presently, you can trade or resell your digital
    products, but soon you will be capable of outfitting your avatar and digital house
    on the blockchain.


    For instance, Argentinian style icon Andrés Reisinger traded ten pieces of virtual
    furniture on Nifty Gateway. The most costly non-existent furniture piece was sold
    for roughly $70,000. The furniture can be positioned in any 3D space or open worlds
    such as Somnium Space, Decentraland, or Minecraft.


    Co-founder of THE DEMATERIALISED, Karinna Nobbs, suggested that brands should
    be aware of numerous things when trading fashion through NFTs. Nobbs stated that
    "As there are so few fashion brand NFTs in the industry right now, there is a
    first-mover advantage, so the first advise is to experiment, jump in early to
    this embryonic market, and it will gain you higher media/social exposure and bring
    you new followers."'
