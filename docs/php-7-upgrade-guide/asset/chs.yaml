  \n## 第 24 章：整数语义\n\n为了跨平台一致性，某些整数行为进行了修订，使其对开发者来说更加直观。\n\n### NaN 和无穷大的转换\n\n将 NaN\
  \ (`NAN`) 和无穷大 (`INF`) 转换为整数将始终导致 `0` 值。以前，结果值是未定义的且在不同平台之间有所异。\n\n#### 负数位移\n\n\
  你不再允许按负数位进行位移操作。尝试这样做将导致抛出 `ArithmeticError`。\n\n### 位移距离过远\n\n尽管某些 CPU 支持正确的回绕行为，但并非所有\
  \ CPU 都支持，这可能会导致某些边界情况。因此，PHP 7 标准了这种行为以实现跨平台一致。\n\n超出整数位宽的左位移将始终导致 `0`，即使平台支持回绕。\n\
  \n超出整数位宽的右位移将始终导致 `0` 或 `-1`（取决于符号），即使平台支持回绕。\n\n### 向后兼容\n\n在这些特定情况下，依赖旧的 PHP 5.x\
  \ 行为将不再有效。\n\n### 继续阅读\n\n* [RFC：整数语义](https://wiki.php.net/rfc/integer_semantics)\n\
  * [PHP 手册：位运算符](https://secure.php.net/manual/en/language.operators.bitwise.php)\n\
  \n## 第 25 章：除零语义\n\n在 PHP 7 之前，除以 `0` 会产生 `E_WARNING` 并返回 `false`。为算术运算返回布尔值没有太大意义，因此\
  \ PHP 7 现在会在产生 `E_WARNING` 的同时，还会返回以下浮点值之一：\n\n* `+INF`\n* `-INF`\n* `NAN`\n\n例如：\n\
  \n```php\nvar_dump(42/0);  // float(INF)  + E_WARNING\nvar_dump(-42/0); // float(-INF)\
  \ + E_WARNING\nvar_dump(0/0);   // float(NAN)  + E_WARNING\n```\n\n当使用取模运算符 (`%`)\
  \ 时，PHP 7 将抛出 `DivisionByZeroError`：\n\n```php\nvar_dump(0%0); // DivisionByZeroError\n\
  ```\n\n每当你提供的有效整数参数会导致由于整数溢出而导致错误结果时，`intdiv()` 函数将抛出 `ArithmeticError`：\n\n```php\n\
  var_dump(intdiv(PHP_INT_MIN, -1)); // ArithmeticError\n```\n\n### 向后兼容\n\n* 除法运算符在除以零时不再返回\
  \ `false`。\n* 取模运算符在除以零时将抛出错误（而不是返回 `false`）。\n\n### 继续阅读\n\n* [PHP 手册：DivisionByZeroError](https://secure.php.net/manual/en/class.divisionbyzeroerror.php)\n\
  * [PHP 手册：ArithmeticError](https://secure.php.net/manual/en/class.arithmeticerror.php)\n\
  \n## 第 26 章：JSON 库\n\nPHP 5 使用的 json 扩展没有免费许可证，这对于某些 Linux 发行版是一个问题。Debian 以前通过在主\
  \ PHP 代码库之外提供单独的 `php5-json` 扩展来处理这个问题。除了许可考虑，旧库还有其他几个问题：\n\n* 代码已过时\n* 没有活跃的维护者\n\
  \n（注：提供的第 26 章文本内容高度重复。我已根据初始章节处理了核心内容。）\n\n## 第 27 章：`foreach` 的行为变化\n\nPHP 的 `foreach`\
  \ 具有一些奇怪的行为。这些情况中的大多数涉及指针的操作。为了提供一致的行为，修正了几个边界情况。\n\n例如，查看 RFC 中的以下两个相似示例：\n\n示例\
  \ 1\n\n```php\n$a = [1,2,3];\n$b = $a;\nforeach($a as $v) {\n    echo $v . \" -\
  \ \" . current($a) . \"\\n\";\n}\n```\n\n示例 1 输出：\n\n```\n1 - 2\n2 - 2\n3 - 2\n\
  ```\n\n然而，如果你在循环之前进行一个小修改，就会得到不同的结果：\n\n示例 2\n\n```php\n$a = [1,2,3];\nforeach($a\
  \ as $v) {\n    echo $v . \" - \" . current($a) . \"\\n\";\n}\n```\n\n示例 2 输出：\n\
  \n```\n1 - 1\n2 - 1\n3 - 1\n```\n\n### 变化\n\n以下是演示 PHP 7 新语义的示例：\n\n#### 按值迭代\n\n\
  忽略对原始数组的修改\n\n```php\n$a = [1,2,3];\n$b = &$a;\n\nforeach($a as $v) {\n    unset($a[1]);\n\
  \    echo $v . \" - \" . current($a) . \"\\n\";\n}\n```\n\nPHP 5.x 输出：\n\n```\n\
  1 - 3\n3 - 2\n```\n\nPHP 7 输出：\n\n```\n1 - 1\n2 - 1\n3 - 1\n```\n\n#### 按引用迭代数组\n\
  \n`current()` 函数不再受数组迭代的影响：\n\n```php\n$a = [1,2,3];\n\nforeach($a as &$v) {\n \
  \   echo $v . \" - \" . current($a) . \"\\n\";\n}\n```\n\nPHP 5.x 输出：\n\n```\n1\
  \ - 2\n2 - 3\n3 -\n```\n\nPHP 7 输出：\n\n```\n1 - 1\n2 - 1\n3 - 1\n```\n\n#### 按值迭代对象\n\
  \n按值迭代对象与按引用迭代数组类似，但它使用的是对象的值而不是它的引用。因此，你可以在 `foreach` 循环中修改对象但不能替换它。\n\n#### 按引用迭代对象\n\
  \n这与按引用迭代数组完全相同。\n\n#### 其他函数\n\n\n\n\n由于 `foreach` 循环的状态现在不再独立于数组/对象指针的内部状态，因此使用该内部指针的内置函数（`reset`/`key`/`current`/`next`/`prev`）将不再代表循环的状态。\n\
  \n### 向后兼容性\n\n任何依赖于旧的、未文档的行为的代码在 PHP 7 中将不再工作。\n\n### 扩展阅读\n\n*   [RFC: 修复“foreach”\
  \ 行为](https://wiki.php.net/rfc/php7_foreach)\n\n## 第 28 章：`list` 的行为变更\n\n### 字符串处理\n\
  \nPHP 文档一直指出 `list()` 构造体不会解包字符串。然而，在某些情况下，它实际上是可以作用的：\n\n示例 1\n\n```\nlist($a,\
  \ $b) = 'ab';\nvar_dump($a, $b);\n```\n\n示例 1：输出\n\n```\nNULL\nNULL\n```\n\n示例 2\n\
  \n```\n$a[0] = 'ab';\nlist($a, $b) = $a[0];\nvar_dump($a, $b);\n```\n\n示例 2：输出\n\
  \n```\nstring(1) \"a\"\nstring(1) \"b\"\n```\n\n这种未文档的行为是由实现上的“特性”引起的，并非刻意。\n\n\
  这种字符串处理的边缘情况在 PHP 7 中不再适用。\n\n#### 空列表赋值\n\n现在不带任何变量使用 `list()` 将导致致命错误（fatal error）：\n\
  \n```\n$a = [1, 2, 3];\n\nlist() = $a;   // Fatal error: Cannot use empty list\n\
  list(,,) = $a; // Fatal error: Cannot use empty list\n```\n\n### 变量赋值顺序\n\n由于采用了新的抽象语法树，值是从左到右赋值，而\
  \ PHP 5.x 是从右到左赋值。\n\n### 向后兼容性\n\n*   在某些情况下，`list()` 不再支持字符串值；在这些情况下，变量始终被设置为\
  \ `NULL`\n\n*   调用不带任何变量的 `list()` 将触发致命错误\n\n*   依赖旧的从右到左赋值顺序将不再工作\n\n### 扩展阅读\n\
  \n*   [RFC: 修复 list() 行为不一致性](https://wiki.php.net/rfc/fix_list_behavior_inconsistency)\n\
  \n*   [RFC: 抽象语法树](https://wiki.php.net/rfc/abstract_syntax_tree#changes_to_list)\n\
  \n## 第 29 章：参数处理变更\n\n#### 重复参数名\n\n之前的 PHP 版本允许多个函数参数使用相同的名称。此功能在 PHP 7 中不再被支持。尝试使用重复的参数现在现在会导致致命错误。\n\
  \n```\nfunction foo($a, $a) {\n    return $a;\n}\n\necho foo(1, 2);\n```\n\nPHP\
  \ 5 输出\n\n```\n2\n```\n\nPHP 7 输出\n\n```\nFatal error: Redefinition of parameter\
  \ $a\n```\n\n### `func_get_arg()` 和 `func_get_args()`\n\n`func_get_arg()` 和 `func_get_args()`\
  \ 函数过去返回原始参数值，即使这些变量在函数执行期间发生了变化。这种行为在 PHP 7 中不再发生——这两个函数现在将提供当前值。例如，给定以下代码：\n\n\
  ```\nfunction foo($a) {\n    $a++;\n    var_dump($a);\n}\nfoo(1);\n```\n\nPHP 5.x\
  \ 会显示原始值 `1`，而 PHP 7 将显示 `2`。\n\n这种行为变化也适用于回溯（backtraces）中函数参数的显示。\n\n### 向后兼容性\n\
  \n使用重复参数名的代码现在会导致致命错误。只需删除之前的实例，即可保持与 PHP 5.x 和 7.x 的完全兼容。\n\n依赖 `func_get_arg()`\
  \ 和 `func_get_args()` 返回原始（而非当前）值的代码可能无法符合预期行为。\n\n### 扩展阅读\n\n*   [RFC: phng](https://wiki.php.net/phpng)\n\
  \n## 第 30 章：自定义 Session 处理器的返回值\n\nPHP 允许你通过 `session_set_save_handler()` 函数实现自己的会话存储和检索机制。你只需要定义一些函数（或实现\
  \ `SessionHandlerInterface`）来处理加载和保存会话数据等操作。\n\n根据文档，这些函数几个（如 `open()` 和 `close()`）应该在成功时返回\
  \ `true`，在失败时返回 `false`。然而，在 PHP 7 之前，由于 PHP 内部处理你返回值的方式存在严重错误，这些返回值从未正常工作。从本质上讲，`false`\
  \ 返回值从未被解释为失败。开发者最终发现可以通过返回 `-1` 来指示失败，但这与文档相矛盾。\n\nPHP 7 修复了此错误，使得 `true` 和 `false`\
  \ 返回值都能被正确解释。如果你返回任何其他值（包括 PHP 5.x 中的 `return -1` 变通方案），将导致失败并抛出 `E_WARNING`。\n\n\
  ### 向后兼容性\n\n*   `return false` 现在实际上可以按预期工作。\n\n*   使用 `return -1` 的变通方案会导致警告。\n\
  \n### 扩展阅读\n\n*   [RFC: 修复自定义会话处理器返回值的处理](https://wiki.php.net/rfc/session.user.return-valuey)\n\
  \n*   [PHP 手册：session\\_set\\_save\\_handler](http://us2.php.net/session_set_save_handler)\n\
  \n## 第 31 章：无效八进制的错误\n\n尝试使用无效八进制字量现在会产生解析错误：\n\nPHP 7\n\n```\necho 08\n```\n\n\
  之前的 PHP 版本会静默截断字量，导致意外值：\n\nPHP 5.x\n\n```\necho 08\n```\n\n### 向后兼容性\n\n*   使用无效八进制将导致解析错误\n\
  \n### 扩展阅读\n\n*   n/a\n\n# 第 3 部分：弃用与移除\n\nPHP 7 弃用了一些功能并移除了其他功能\n\n## 第 32 章：PHP\
  \ 4 构造函数的弃用\n\nPHP 4 的构造方法是通过声明与类同名的方法来实现的：\n\nPHP 4 样式示例\n\n```\nclass Post {\n\
  \    // 在 PHP 4 中识别为构造函数\n    function post() {}\n}\n```\n\nPHP 5 增加了熟悉的 `__construct()`\
  \ 方法，但也保留了旧样式。这导致了一些奇怪的行为。例如，PHP 4 构造函数在全局类中正常，但在命名空间类中无效：\n\n命名空间 PHP 5 类\n\n```\n\
  namespace Blog;\nclass Post {\n    // 因为命名空间未被识别为构造函数\n    function post() {}\n\
  }\n```\n\n如果你同时声明了 PHP 4 和 PHP 5 风格的构造函数，结果将取决于声明的顺序：\n\nPHP 5 样式优先\n\n```\nclass\
  \ Post {\n    // 构造函数\n    function __construct() {}\n\n    // 普通方法，不是构造函数\n   \
  \ function post() {}\n}\n```\n\nPHP 4 样式优先\n\n```\nclass Post {\n    // 普通方法，不是构造函数\n\
  \    function post() {}\n\n    // 触发 E_STRICT\n    function __construct() {}\n}\n\
  ```\n\nPHP 7 不再保留这种奇怪的行为，而是做了两个重要的变更：\n\n1. 每当使用 PHP 4 样式构造函数时都会触发 `E_DEPRECATED`。\n\
  \n2. 当两种类型的构造函数时，不再触发 `E_STRICT`。\n\n此外，PHP 8 将不再识别 PHP 4 样式构造函数，从而将其解释为标准类方法。\n\
  \n由于这种旧样式已被弃用，强烈建议在迁移到 PHP 7 的代码中移除它们。\n\n### 向后兼容性\n\n*   自定义错误处理器可能会受到新产生的 `E_DEPRECATED`\
  \ 错误的影响。\n\n### 扩展阅读\n\n*   [RFC: 移除 PHP 4 构造函数](https://wiki.php.net/rfc/remove_php4_constructors)\n\
  \n*   [PHP 手册：构造函数与析构函数](http://us2.php.net/manual/en/language.oop5.decon.php)\n\
  \n\n\n\nPHP 7 因此废弃了此 `salt` 选项。强烈建议您省略此选项，直接使用 PHP 为您生成的任何加密学安全的盐（salt）。\n\n###\
  \ 延伸阅读\n\n*   [PHP 手册：`password_hash`](http://us2.php.net/manual/en/function.password-hash.php)\n\
  \n## 第 34 章：移除之前已废弃的功能\n\nPHP 7 移除了之前版本中已废弃的所有 `ALL` 特性。\n\n### 已移除的扩展\n\n| 扩展名称\
  \ | 自从版本废弃 | 替代方案 |\n| --- | --- | --- |\n| `ext/mysql` | PHP 5.3 | `ext/mysqli`\
  \ 或 `ext/pdo_mysql` |\n| `ext/ereg` | PHP 5.3 | `ext/pcre` |\n\n### 已移除的语言特性\n\n\
  | 特性描述 | 自从版本废弃 | 替代方案 |\n| --- | --- | --- |\n| 引用赋值 `new` | PHP 5.3 | 使用普通赋值 |\n\
  | 在不兼容的 `$this` 上下文中对非静态方法进行作用域调用 | PHP 5.6 | |\n\n### 已移除的函数\n\n| 函数名称 | 自从版本废弃\
  \ | 替代方案 |\n| --- | --- | --- |\n| fpm-fcgi 上的 `dl` | PHP 5.3 | |\n| `set_magic_quotes_runtime`\
  \ | PHP 5.4 | |\n| `magic_quotes_runtime` | PHP 5.4 | |\n| `set_socket_blocking`\
  \ | PHP 5.4 | `stream_set_blocking` |\n| `mcrypt_generic_end` | PHP 5.4 | `mcrypt_generic_deinit`\
  \ |\n| `mcrypt_ecb`, `mcrypt_cbc`, `mcrypt_cfb` 和 `mcrypt_ofb` | PHP 5.5 | `mcrypt_encrypt`\
  \ 和 `mcrypt_decrypt` |\n| `datefmt_set_timezone_id` | PHP 5.5 | `datefmt_set_timezone`\
  \ |\n| `IntlDateFormatter::setTimeZoneID` | PHP 5.5 | `IntlDateFormatter::setTimeZone`\
  \ |\n\n### 已移除的 INI 选项\n\n| INI 选项 | 自从版本废弃 | 替代方案 |\n| --- | --- | --- |\n| `xsl.security_prefs`\
  \ | PHP 5.4 | `XsltProcessor::setSecurityPrefs` |\n| `iconv.input_encoding` 和 `mbstring.http_input`\
  \ | PHP 5.6 | `php.input_encoding` |\n| `iconv.internal_encoding` 和 `mbstring.internal_encoding`\
  \ | PHP 5.6 | `php.internal_encoding` |\n| `iconv.output_encoding` 和 `mbstring.http_output`\
  \ | PHP 5.6 | `php.output_encoding` |\n\n### 其他已移除的功能\n\n| 功能 | 自从版本废弃 | 替代方案 |\n\
  | --- | --- | --- |\n| `mktime()` 和 `gmmktime()` 的 `$is_dst` 参数 | PHP 5.1 | |\n\
  | `ini` 文件中的 `#` 风格注释 | PHP 5.3 | `;` 风格注释 |\n| `setlocale()` 中的字符串类别名称 | PHP 5.3\
  \ | `LC_*` 常量 |\n| 不安全的 curl 文件上传 | PHP 5.5 | `CurlFile` |\n| `preg_replace()` eval\
  \ 修饰符 | PHP 5.5 | `preg_replace_callback()` |\n| `PDO::PGSQL_ATTR_DISABLE_NATIVE_PREPARED_STATEMENT`\
  \ 驱动选项 | PHP 5.6 | `PDO::ATTR_EMULATE_PREPARES` |\n| `CN_match` 和 `SNI_server_name`\
  \ 流上下文选项 | PHP 5.6 | `peer_name` 选项 |\n\n### 向后兼容\n\n任何依赖之前已废弃功能的代码在 PHP 7 中将损坏。\n\
  \n\n\n\n\n```\nvar_dump(is_numeric(\"0x123\"));\n// bool(true)\n\nvar_dump((int)\
  \ \"0x123\");\n// int(0)\n\nvar_dump((float) \"0x123\");\n// float(0)\n\nvar_dump(\"\
  0x123\" * 2);\n// int(582)\n\nvar_dump(\"0x123\" == '291');\n// bool(true)\n\nvar_dump((int)\
  \ \"0x123\" == (int) \"291\");\n// bool (false)\n```\n\nPHP 7 通过简单移除对此类字符串的旧有部分支持，解决了这种差异。\n\
  \n### 向后兼容性\n\n在以下上下文中，不再支持在字符串中使用十六进制数字：\n\n* ` `is_numeric()` 函数\n* 数学运算\n* 接受数字字符串的内部\
  \ PHP 函数\n\n### 延伸阅读\n\n* [RFC: 移除数字字符串中的十六进制支持](https://wiki.php.net/rfc/remove_hex_support_in_numeric_strings)\n\
  \n## 第 39 章：移除废弃的 SAPIs 和扩展\n\n### 废弃 SAPIs\n\nPHP 包含了多个服务器的 SAPIs。其中某些已经不再可用，或者已经长时间没有被支持。因此，它们已在\
  \ PHP 7 中被移除。列表包括：\n\n* `sapi/aolserver`\n* `sapi/apache`\n* `sapi/apache_hooks`\n\
  * `sapi/caudium`\n* `sapi/continuity`\n* `sapi/isapi`\n* `sapi/milter`\n* `sapi/phttpd`\n\
  * `sapi/pi3web`\n* `sapi/roxen`\n* `sapi/thttpd`\n* `sapi/tux`\n* `sapi/webjames`\n\
  \n### 废弃扩展\n\n以下扩展不再进行维护并已移除：\n\n* `ext/mssql`\n* `ext/sybase_ct`\n\n### 向后兼容性\n\
  \n依赖这些 SAPIs 和扩展的系统将无法在 PHP 7 上运行。请考虑寻找替代的 SAPI 或扩展来替换任何被移除的项。\n\n### 延伸阅读\n\n*\
  \ [RFC: 移除废弃或尚未迁移到 PHP7 的 SAPIs 和扩展](https://wiki.php.net/rfc/removal_of_dead_sapis_and_exts)\n\
  \n## 第 40 章：移除 `date.timezone` 警告\n\n在 PHP 之前的版本中，未定义 `date.timezone` INI 设置将导致以下行为：\n\
  \n* 默认使用 UTC\n* 发出警告消息\n\nPHP 7 将不再在这些情况下发出警告。如果配置中未指定，UTC 将继续作为默认时区。\n\n### 延伸阅读\n\
  \n* [RFC: 移除 date.timezone 警告](https://wiki.php.net/rfc/date.timezone_warning_removal)\n\
  \n# 附录 - 向后兼容破坏性变更\n\n如果你是从现代版本的 PHP（如 5.5 或 5.6）迁移过来的，你的大部分代码可能仍然原样良好运行。尽管如此，我们将在本节中涵盖大部分重要的破坏性变更，以便你准备修复项目中的任何问题。这些破坏性大部分在之前的章节中讨论过。我们会根据需要链接回那些章节。此列表直接来自\
  \ 2015 年 11 月的 `php-src` 文档。可能并不详尽。\n\n## 语言变更\n\n### 变量处理\n\n#### 从左到右解析\n\n间接变量、属性和方法引用现在按照从左到右的语义进行解释。示例：\n\
  \n```\n  $foo['bar'] // 解释为 ($foo)['bar']\n  $foo->$bar // 解释为 ($foo)->$bar\n  $foo->['bar']\
  \ // 解释为 ($foo->['bar']\n  $Foo::$bar // 解释为 ($Foo):::$bar\n```\n\n要恢复之前的行为，请添加显示的大括号：\n\
  \n```\n  ${foo['bar']}\n  ${foo->$bar}\n  ${foo->['bar']}\n  ${Foo::$bar}\n```\n\
  \n#### global 关键字\n\n`global` 关键字现在只接受变量。不再使用 `global $foo->bar`，现在要求写如下：\n\n####\
  \ 括号影响行为\n\n变量或函数调用周围的括号不再对行为产生任何影响。例如下面的代码，函数调用的结果通过引用传递：\n\n```\n  function getArray()\
  \ { return [1, 2, 3]; }\n\n  $last = array_pop(getArray()); // 严格标准：只有变量应通过引用传递\n\
  \  $last = array_pop((getArray())); // 严格标准：只有变量应通过引用传递\n```\n\n现在无论是否使用括号，都将抛出严格错误（strict\
  \ error）。之前在第二情况下不会生成通知（notice）。\n\n#### 引用赋值顺序\n\n引用赋值期间自动创建的数组元素或对象属性现在将导致不同的顺序。例如\n\
  \n```\n  $array = [];\n  $array[\"a\"] = &$array[\"b\"];\n  $array[\"b\"] = 1;\n\
  \  var_dump($array);\n```\n\n现在结果为 `[\"a\" => 1, \"b\" => 1]`，而之前的的结果是 `[\"b\" =>\
  \ 1, \"a\" => 1]`。\n\n### `list()` \n\n#### 变量赋值\n\n`list()` 将不再以反序赋值变量。例如\n\n```\n\
  \  list($array[], $array[], $array[]) = [1, 2, 3];\n  var_dump($array);\n```\n\n\
  现在结果为 `$array == [1, 2, 3]` 而不是 `[3, 2, 1]`。注意，只有赋值顺序发生了变化，但赋值的值保持不变。例如，正常的用法如\n\
  \n```\n  list($a, $b, $c) = [1, 2, 3];\n  // $a = 1; $b = 2; $c = 3;\n```\n\n将保留其当前行为。\n\
  \n#### 空列表赋值\n\n不再允许空的 `list()` 赋值。因此，以下所有都是无效的：\n\n```\n  list() = $a;\n  list(,)\
  \ = $a;\n  list($x, , $y) = $a;\n```\n\n`list()` 不再支持解字符串（虽然之前在某些情况下是支持的）。代码\n\n\
  ```\n  $string = \"xy\";\n  list($x, $y) = $string;\n```\n\n现在结果将为 `$x == null`\
  \ 和 `$y == null`（无通知），而不是 `$x == \"x\"` 和 `$y == \"y\"`。此外，`list()` 现在始终保证适用于实现\
  \ `ArrayAccess` 的对象，例如\n\n```\n  list($a, $b) = (object) new ArrayObject([0, 1]);\n\
  ```\n\n现在结果为 `$a == 0` 和 `$b == 1`。之前 `$a` 和 `$b` 均为 null。\n\n### `foreach` 行为\n\
  \n#### 与内部指针的交互\n\n`foreach()` 迭代不再影响内部数组指针，可以通过 `current()`/`next()` 等函数访问。例如\n\
  \n```\n  $array = [0, 1, 2];\n  foreach ($array as &$val) {\n      var_dump(current($array));\n\
  \  }\n```\n\n现在将打印三次 `int(0)`。之前的输出是 `int(1)`、`int(2)` 和 `bool(false)`。\n\n####\
  \ 按值迭代数组\n\n按值迭代数组时，`foreach` 现在始终在数组的副本上操作，因此迭代期间对数组的更改不会影响迭代行为。例如在按值迭代期间\n\n```\n\
  \  $array = [0, 1, 2];\n  $ref = &$array; // 触发旧行为必要的\n  foreach ($array as $val)\
  \ {\n      var_dump($val);\n      unset($array[1]);\n  }\n```\n\n现在将打印所有元素（0, 1,\
  \ 2），而之前第二个元素 1 被跳过了。\n\n#### 按引用迭代数组\n\n按引用迭代数组时，对数组的修改将继续影响迭代。然而，PHP 现在许多情况下能够更好地维护正确的位置。例如在按引用迭代期间向数组追加\n\
  \n```\n  $array = [0];\n  foreach ($array as &$val) {\n      var_dump($val);\n \
  \     $array[1] = 1;\n  }\n```\n\n现在将遍历新添加的元素。因此此示例的输出现在是 `int(0) int(1)`，而之前只有\
  \ `int(0)`。\n\n#### 对象迭代\n\n普通（非 Traversable）对象的按值或按引用迭代行为将类似于数组的按引用迭代。除了前述一点中提到的更准确的位置管理外，这与之前的行为一致。\n\
  \nTraversable 对象的迭代保持不变。\n\n### 参数处理\n\n#### 重复参数名\n\n现在不再允许定义两个名称相同的函数参数。例如，以下方法将触发编译时错误：\n\
  \n```\n  public function foo($a, $b, $unused, $unused) {\n      // ...\n  }\n\n\
  ```\n\n\n\n\n\n类似这样的代码应更改为不同的参数名，例如：\n\n```php\n  public function foo($a, $b, $unused1,\
  \ $unused2) {\n      // ...\n  }\n```\n\n### 获取参数值\n\n`func_get_arg()` 和 `func_get_args()`\
  \ 函数将不再返回传递给参数的原始值，而是提供当前值（该值可能已经被修改）。例如：\n\n```php\n  function foo($x) {\n    \
  \  $x++;\n      var_dump(func_get_arg(0));\n  }\n  foo(1);\n```\n\n现在它将打印“2”而不是“1”。这段代码应该更改为仅在调用\
  \ `func_get_arg(s)` 之后进行修改：\n\n```php\n  function foo($x) {\n      var_dump(func_get_arg(0));\n\
  \      $x++;\n  }\n```\n\n或者完全避免修改参数：\n\n```php\n  function foo($x) {\n      $newX\
  \ = $x + 1;\n      var_dump(func_get_arg(0));\n  }\n```\n\n### 对回溯（backtraces）的影响\n\
  \n同样，异常回溯将不再显示传递给函数的原始值，而是显示修改后的值。例如：\n\n```php\n  function foo($x) {\n      $x\
  \ = 42;\n      throw new Exception;\n  }\n  foo(\"string\");\n```\n\n现在将导致堆栈回溯：\n\
  \n```\n  Stack trace:\n  #0 file.php(4): foo(42)\n  #1 {main}\n```\n\n而之前是：\n\n\
  ```\n  Stack trace:\n  #0 file.php(4): foo('string')\n  #1 {main}\n```\n\n虽然这不应该影响你代码的运行时行为，但为了调试之目的，意识到这种差异是值得的。\n\
  \n同样的限制也适用于 `debug_backtrace()` 和其他检查函数参数的函数。\n\n### 整数处理\n\n#### 无效的八进制字面量\n\n\
  无效的八进制字面量（包含大于 7 的数字）现在会产生编译错误。例如，以下内容不再有效：\n\n```php\n  $i = 0781; // 8 不是有效的八进制数字！\n\
  ```\n\n以前，无效的数字（以及任何随后的有效数字）会被简单忽略。因此，`$i` 之前的值是 7，因为最后两个数字被静地丢弃了。\n\n#### 负数位移\n\
  \n对负数进行位移现在将抛出 `ArithmeticError`：\n\n```php\n  var_dump(1 >> -1);\n  // ArithmeticError:\
  \ Bit shift by negative number\n```\n\n#### 左位移\n\n超出整数位宽的左位移将始终导致结果为 0：\n\n```php\n\
  \  var_dump(1 << 64); // int(0)\n```\n\n以前，这段代码的行为取决于所使用的 CPU 架构。例如，在 x86（包括 x86-64）上，结果是\
  \ `int(1)`，因为位移操作数被回绕（wrapped）。\n\n#### 右位移\n\n同样，超出整数位宽的右位移将始终导致结果为 0 或 -1（取决于符号）：\n\
  \n```php\n  var_dump(1 >> 64);  // int(0)\n  var_dump(-1 >> 64); // int(-1)\n```\n\
  \n### 字符串处理\n\n#### 十六数值字符串\n\n包含十六进制数字的字符串不再被视为数值，且不会受到特殊处理。示例：\n\n```php\n  is_numeric(\"\
  0x123\"); // bool(false)\n  is_numeric(\"0xe\"); // bool(false)\n  is_numeric(\"\
  0x1\"); // int(0)\n```\n\n可以使用 `filter_var()` 来检查字符串是否包含十六进制数字或转换此类字符串：\n\n```php\n\
  \  filter_var(\"0x123\", FILTER_VALIDATE_INT); // int(291)\n  filter_var(\"0xe\"\
  , FILTER_VALIDATE_INT); // false\n  filter_var(\"0x1\", FILTER_VALIDATE_INT); //\
  \ int(1)\n```\n\n\n\n\n*   `call_user_method()` 和 `call_user_method_array()` 不再存在。\n\
  *   `ob_start()` 如果在输出缓冲区处理程序中创建输出缓冲区，不再抛出 `E_ERROR`，而是抛出 `E_RECOVERABLE_ERROR`。\n\
  *   改进了内部排序算法，这可能会导致比较相等的元素的排序顺序发生变化。\n*   在 `fpm-fcgi` 中移除了 `dl()` 函数。\n*   使用空\
  \ cookie 名称的 `setcookie()` 现在会抛出 `E_WARNING`，且不再发送空的 set-cookie 头部行。\n\n## 其他更改\n\
  \n### Curl\n*   移除了对禁用 `CURLOPT_SAFE_UPLOAD` 选项的支持。所有的 curl 文件上传必须使用 `curl_file`\
  \ / `CURLFile` API。\n\n### Date\n*   从 `mktime()` 和 `gmmktime()` 中移除了 `$is_dst`\
  \ 参数。\n\n### DBA\n*   现在对于 `inifile` 处理器，如果未找到键，`dba_delete()` 也会返回 `false`。\n\n\
  ### GMP\n*   现在需要 `libgmp` 版本 4.2 或更高。\n*   `gmp_setbit()` 和 `gmp_clrbit()` 现在对负索引返回\
  \ `FALSE`，使其与其他 GMP 函数保持一致。\n\n### Intl\n*   移除了废弃的别名 `datefmt_set_timezone_id()`\
  \ 和 `IntlDateFormatter::setTimeZoneID()`。请使用 `datefmt_set_timezone()` 和 `IntlDateFormatter::setTimeZone()`。\n\
  \n### libxml\n*   增加了 `LIBXML_BIGLINES` 解析器选项。该选项从 `libxml` 2.9.0 开始可用，并在错误报告中支持大于\
  \ 16 位的行号。\n\n### Mcrypt\n*   移除了废弃的 `mcrypt_generic_end()` 别名，改用 `mcrypt_generic_deinit()`。\n\
  *   移除了废弃的 `mcrypt_ecb()`、`mcrypt_cbc()`、`mcrypt_cfb()` 和 `mcrypt_ofb()` 函数，改用带有\
  \ `MCRYPT_MODE_*` 标志的 `mcrypt_encrypt()` 和 `mcrypt_decrypt()`。\n\n### Session\n\
  *   `session_start()` 接受数组形式的所有 INI 设置。例如 `['cache_limiter'=>'private']` 会设置 `session.cache_limiter=private`。它还支持\
  \ `read_and_close`，在读取数据后立即关闭会话数据。\n*   保存处理器接受 `validate_sid()` 和 `update_timestamp()`，后者用于验证会话\
  \ ID 是否以及更新会话数据的时间戳。保留了旧用户自定义保存处理器的兼容性。\n*   增加了 `SessionUpdateTimestampHandlerInterface`。接口中定义了\
  \ `validateSid()` 和 `updateTimestamp()`。\n*   `session.lazy_write(default=On)` INI\
  \ 设置仅在会话数据被更新时才写入会话数据。\n\n### Opcache\n*   移除了 `opcache.load_comments` 配置指令。现在加载文档注释不再消耗开销，且始终启用。\n\
  \n### OpenSSL\n*   移除了“rsa_key_size” SSL 上文选项，改用根据协商的加密算法自动设置合适的尺寸。\n*   移除了 “CN_match”\
  \ 和 “SNI_server_name” SSL 上文选项。请改用自动检测或 “peer_name” 。\n\n### PCRE:\n*   移除了对 `/e`\
  \ (PREG_REPLACE_EVAL) 修饰符的支持。请使用 `preg_replace_callback()`。\n\n### PDO_pgsql:\n\
  *   移除了 `PGSQL_ATTR_DISABLE_NATIVE_PREPARED_STATEMENT` 属性，改用 `ATTR_EMULATE_PREPARES`。\n\
  \n### Standard:\n*   在 `setlocale()` 中移除了字符串分类支持。请使用 `LC_*` 常量。\n*   移除了 `set_magic_quotes_runtime()`\
  \ 及其别名 `magic_quotes_runtime()`。\n\n### JSON:\n*   拒绝 `json_decode` 字符串中与 RFC 7159\
  \ 不兼容的数字格式——顶层 (07, 0xff, .1, -.1) 以及所有层 ([1.], [1.e1])。\n*   调用 `json_decode` 时第一个参数为空字符串或转换为字符串后为空字符串的值（NULL,\
  \ FALSE）将导致 JSON 语法错误。\n\n### Stream:\n*   移除了 `set_socket_blocking()`，改用其别名 `stream_set_blocking()`。\n\
  \n### XSL:\n*   移除了 `xsl.security_prefs`  ini 选项。请使用 `XsltProcessor::setSecurityPrefs()`。\n\
  \n"
