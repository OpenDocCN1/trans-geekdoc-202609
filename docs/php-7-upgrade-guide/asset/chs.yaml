- "# PHP 7 升级指南指南\n\n\n\n\n\n\n\n\n\n\n\n* * * * * *\n\n\n* * * * * *\n\n\n本书献给所有渴望学习的人。\n\
  \n\n    6. 第 20 章：`define()` 中的数组常量\n\n\n\n\n\n\n\n\n### 向后兼容\n## 进一步阅读\n\n\n\n\n\
  \n\n\n\n\n\n## 进一步阅读\n\n\n\n\n\n\n\n\n\n\n[content]\n\n\n\n\n\n\n# 指南\n\n\n# 前言\n\
  \n## 本书适合读者\n\n本书是为想要迁移到 PHP 7 的 PHP 开发者准备的。你需要之前的 PHP 经验来理解我们将涵盖的主题和示例。你对 PHP 5\
  \ 和 OOP（面向对象编程）了解得越多，就越理解为什么某些变更是重要的，以及它们将如何影响你的开发。\n\n如果你是一个正在寻求在 PHP 7 中工作的团队经理或领导，本书将帮助你的开发者快速跟上他们需要了解的所有变更，甚至向他们介绍一些可以利用以实现更快速、更好开发的特性。\n\
  \n\n第 1 章 总结了标量类型提示的添加。这允许你的函数参数显式地要求 `string`、`int`、`float` 或 `bool` 等标量类型。\n\n\
  第 3 章 我们探索了全新的“太空船运算符”，它极大地简化了两个表达式的三路比较。\n\n第 4 章 引入了另一个新运算符，“空合并合并运算符”。它非常像 `?:`，但内置了\
  \ `isset()` 检查。\n\n第 5 章 展示了如何使用新的 `\\u{...}` 转义序列向字符串轻松地添加 Unicode 字符。\n\n第 6 章\
  \ 回顾了如何使用匿名类来动态创建类，这对于模拟（mocking）和实现简单接口（如日志记录器特别有用。\n\n第 7 章 重点介绍了了通过单个 `use` 语句包含命名空间中多个类的新能力。\n\
  \n第 8 章 引入了新的 `Closure::call` 方法，它极大地简化了在调用时将闭包转换为对象。\n\n第 9 章 展示了生成器现在如何 `return`\
  \ 最终值。\n\n第 10 章 探索了生成器如何 `yield from` 数组、迭代器和其他生成器（在此处插入一个“yo daw”的笑话）。\n\n第 11\
  \ 章 我们看到 PHP 7 如何极大地简化了为安全关键应用程序生成随机数的过程。\n\n第 12 章 展示了如何安全简单地执行整数除法。\n\n第 13 章\
  \ 揭示了新的 `preg_replace_callback_array`。\n\n第 14 章 探讨了 `Intl` 类如何处理 Unicode 字符。\n\n\
  第 15 章 展示了 PHP 7 如何比之前更快。\n\n第 16 章 回顾了语法的一致性。\n\n第 17 章 本章列出了某些被保留的关键字。\n\n第 18\
  \ 章 解释了 `E_STRICT` 注意事项是如何转换为其他类型的。\n\n第 19 章 展示了 PHP 7 如何极大地简化了为安全关键应用程序生成随机数的过程。\n\
  \n第 20 章 介绍了 `assert()` 现在支持断言选项。\n\n第 21 章 展示了如何安全地反序列化不可信数据。\n\n第 22 章 本章介绍了如何通过\
  \ `session_start()` 配置会话。\n\n第 23 章 概述了反射 API 的增强。\n\n第 24 章 展示了 PHP 7 如何处理十六进制字符串。\n\
  \n第 25 章 探讨了 PHP 7 如何处理除零。\n\n第 26 章 涵盖了 PHP 7 使用的新的 JSON 库。\n\n第 27 章 展示了 `foreach`\
  \ 循环在 PHP 5 中的差异。\n\n第 28 章 描述了 `list()` 构造的一些行为。\n\n第 29 章 解释了对自定义会话处理器的调整。\n\n\
  第 30 章 揭示了一个旧会话处理器 Bug。\n\n第 31 章 简要介绍了 PHP 7 如何处理八进制。\n\n第 32 章 讨论了 PHP 4 风格构造函数的弃用。\n\
  \n第 33 章 涵盖了密码哈希 API 中手动生成盐值的弃用。\n\n第 34 章 列出了 PHP 7 中完全移除的所有已弃用功能。\n\n第 35 章 讨论了替代\
  \ PHP 标签的移除。\n\n第 36 章 描述了几个 `E_STRICT` 注意事项是如何变化的。\n\n第 37 章 展示了 `switch` 块中不再允许多个\
  \ `default` 情况。\n\n第 38 章 展示了 PHP 5 对十六进制字符串处理的不一致性。\n\n第 39 章 列出了不再受支持或维护的 SAPI。\n\
  \n第 40 章 简要强调了那个烦人的时区警告的移除。\n\n最后，本书的最后部分 详细列出了迁移到 PHP 7 时需要注意的所有破坏性变更。\n\n## 其他资源\n\
  \n这些官方 PHP 资源在本书创作期间非常有帮助，你可能会发现它们有用：\n\n*   [PHP 手册：从 PHP 5.6.x 迁移到 PHP 7.0.x](https://secure.php.net/manual/en/migration70.php)\n\
  *   [PHP 7 UPGRADING 文](https://github.com/php/php-src/blob/PHP-7.0.0/UPGRADING)\n\
  \n\n\n\n\n- [PHP 7 征求](https://wiki.php.net/rfc#php_70)\n- [PHPNG (下一代)](https://wiki.php.net/phpng)\n\
  \n这里还有许多其他优质资源，包括一些付费的和一些免费的：\n\n- [为 PHP 7 做准备](https://www.digitalocean.com/company/blog/getting-ready-for-php-7/)\n\
  - [准孕期的期待：PHP 7，部分 1](https://blog.engineyard.com/2015/what-to-expect-php-7)\n-\
  \ [准孕期的期待：PHP 7，部分 2](https://blog.engineyard.com/2015/what-to-expect-php-7-2)\n\
  - [Zend：关于 PHP 7 你必须知道的 5 点](http://www.zend.com/en/resources/php-7)\n- [PHP 7 革命：返回类型与被移除的遗迹](http://www.sitepoint.com/php-7-revolution-return-types-removed-artifacts/)\n\
  - [PHP 7：你需要知道的 10 点](http://www.hongkiat.com/blog/php7/)\n- [Twitter 上的 #php7](https://twitter.com/hashtag/php7)\n\
  - [GoPHP7 扩展项目](http://gophp7.org/gophp7-ext/)\n- [Laracasts - PHP 7 快速上手](https://laracasts.com/series/php7-up-and-running)\n\
  \n（此处列出的任何商业产品或服务均未经过作者的测试或背书——它们仅作为你继续学习 PHP 7 的一个起点。）\n\n## 鸣谢\n\n我想感谢以下人士让这本书成为可能：\n\
  \n- 所有的程序员、测试人员、文档编写者、RFC 作者以及所有其他对 PHP 成功做过贡献的人。如果没有你们，我将无话可写。\n- 感谢 PHP 社区分享知识和专业技能，为所有开发者创造了这样一个惊人的生态系统。\n\
  - 感谢 Mike Spinosa, Scott Greenwell, Ben Thomas 以及 Unleashed Technologies 的整个团队，鼓励并促进了我的持续成长。\n\
  - 感谢 Phil Sturgeon，他是我增加社区参与度的催化剂。\n\n### PHP Wiki 和文档内容\n\n本书包含了来自 [PHP wiki](https://wiki.php.net/)、[RFCs](https://wiki.php.net/rfc)\
  \ 和 [文档](https://php.net/docs.php) 的内容。这些内容根据 [CC BY 3.0](https://creativecommons.org/licenses/by/3.0/us/)\
  \ 许可。所有的使用（以及任何修改）都将立即在书中内容的旁边进行标注。\n\n# 开始使用 PHP 7\n\nPHP 7.0 和 7.1 的构建版本已可以在官方和社区存储库获取。在大多数情况下，可以使用系统的包管理器轻松安装这些新版本。\n\
  \n## Ubuntu 14.04 和 16.04\n\n[Ondřej Surý](https://launchpad.net/~ondrej) 提供了一个用于安装\
  \ PHP 7.0 和 7.1 的 `PPA`。可以使用以下命令安装最新版本：\n\n```\nsudo add-apt-repository ppa:ondrej/php\n\
  sudo apt-get update\nsudo apt-get install php7.0\n```\n\n如果需要，请将 `7.0` 替换为 `7.1`。此处可以可用包完整列表：[`launchpad.net/~ondrej/archive/php/packages?field_name_filter=php7.0`](https://launchpad.net/~ondrej/archive/php/packages?field_name_filter=php7.0)\n\
  \n## Debian 8 & 9\n\n[Ondřej Surý 还为 Debian 提供了 PHP 7.0 和 7.1 包](https://packages.sury.org/php/)，可以使用以下命令安装：\n\
  \n```\nsudo apt-get install apt-transport-https lsb-release ca-certificates\nsudo\
  \ wget -O /etc/apt/trusted.gpg.d/php.gpg https://packages.sury.org/php.gpg\nsudo\
  \ sh -c \"echo deb https://packages.sury.org/php/ $(lsb_release -sc) main' > /etc/apt/sources.list.d/php.list\n\
  sudo apt-get update\nsudo apt-get install php7.0\n```\n\n## Debian 6 & 7\n\n可以使用\
  \ [Dotdeb 存储库](https://www.dotdeb.org/) 安装 PHP 7.0。将以下两行添加到 `/etc/apt/sources.list`，并将\
  \ `<distribution>` 替换为 `squeeze`、`wheezy` 或 `jessie`：\n\n```\ndeb http://packages.dotdeb.org\
  \ <distribution> all\ndeb-src http://packages.dotdeb.org <distribution> all\n```\n\
  \n添加 GPG 密钥：\n\n```\nwget https://www.dotdeb.org/dotdeb.gpg\nsudo apt-key add dotdeb.gpg\n\
  ```\n\n安装 PHP 7：\n\n```\nsudo apt-get update\nsudo apt-get install php7.0\n```\n\
  \n此处可以可用包完整列表：[`packages.dotdeb.org/pool/all/php7.0/`](http://packages.dotdeb.org/pool/all/php7.0/)\n\
  \n## CentOS / RHEL\n\n可以使用 [Webstatic Yum 存储库](https://webtatic.com/projects/yum-repository/)\
  \ 安装 PHP 7。如果你在使用 CentOS/RHEL 7.x，运行这三个命令来添加存储库并安装 PHP 7：\n\n```\nrpm -Uvh https://dl.fedoraproject.org/pub/epel/epel-release-latest-7.noarch.rpm\n\
  rpm -Uvh https://mirror.webtatic.com/yum/el7/webtatic-release.rpm\nyum install php7w\n\
  ```\n\n如果你在使用 CentOS/RHEL 6.x，运行这两个命令来添加存储库并安装 PHP 7：\n\n```\nrpm -Uvh https://mirror.webtatic.com/yum/el6/latest.rpm\n\
  yum install php7w\n```\n\n此处可以可用包完整列表（包括 `SAPIs` 和扩展）：[`webtatic.com/packages/php70/#sapi`](https://webtatic.com/packages/php70/#sapi)\n\
  \n## Mac OS\n\nPHP 7 可以通过 [homebrew](https://github.com/Homebrew/brew) 安装：\n\n```\n\
  brew tap homebrew/versions\nbrew install php70\n```\n\n或者通过 Liip 的工具安装：\n\n```\n\
  curl -s http://osx.sh/install.sh | bash -s 7.0\n```\n\n## Windows\n\nPHP 7 发行版可以在\
  \ windows.php.net 网站找到：[`windows.php.net/download#php.0`](http://windows.php.net/download#php.0)\n\
  \n对于本地开发，你可以使用如 [XAMPP](https://www.apachefriends.org/) 或 [EasyPHP](http://www.easyphp.org/)\
  \ 等第三方发行版。\n\n## phpbrew\n\n[phpbrew](https://github.com/phpbrew/phpbrew) 是一个非常有用的工具，允许你在同一台机器上构建和切换不同版本的\
  \ PHP。它支持所有现代版本的 PHP。\n\n首先我们需要 `phpbrew` 来获取版本信息：\n\n```\nphpbrew self-update\n\
  ```\n\n然后我们可以安装任何版本：\n\n```\nphpbrew install php-7.25\nphpbrew use php-0.25\n```\n\
  \n## Docker\n\nPHP 的官方 Docker 镜像可以在 [`hub.docker.com/_php/`](https://hub.docker.com/_php/)\
  \ 找到：\n\n```\ndocker pull php:latest\n```\n\n## Vagrant 镜像\n\nPHP 的创始人在 GitHub 上提供了一个\
  \ Vagrant 镜像：[`github.com/rlerdorf/php7dev`](https://github.com/rlerdorf/php7dev)\n\
  \n它基于 Debian 8，并经过预配置以便开发 PHP 应用和扩展。\n\n## 从源码编译\n\nPHP.net 还提供了 Alpha 和 Beta 版本的源码包，你可以下载并自行编译。源码可以从\
  \ [`downloads.php.net/~ab/`](https://downloads.php.net/~ab/) 下载。\n\n编译 PHP 7 的文档：\n\
  \n* https://wiki.php.net/phpng\n* http://www.zimuel.it/install-php-7/\n* http://www.hashbangcode.com/blog/compiling-and-installing-php7-ubuntu\n\
  \n# 第一部分 - 新功能\n\n## 第 1 章：标量类型提示（Scalar Type Hints）\n\nPHP 5 引入了要求函数参数必须为特定类型的功能。这为非法用法提供了安全保障，例如将\
  \ UNIX 时间戳传递给期望 `DateTime` 对象的方法。它也让其他开发者更清楚地如何使用该函数。例如，比较以下带有和带有类型提示的函数签名：\n\n\
  ```\n// 无类型提示：\nfunction getNextWeekday($date) { /*...*/ }\n\n// 类类型提示（PHP 5）：\n\
  function getNextWeekday(DateTime $date) { /*...*/ }\n```\n\n\n\n\n\n这些提示最初仅限于类和接口，但很快扩展到允许\
  \ `array` 和 `callable` 类型。PHP 7 进一步扩展了这一点，允许如 `int`、`float`、`string` 和 `bool` 等标量类型：\n\
  \n```\n// Scalar type hint (PHP 7):\nfunction getNextWeekday(int $date) { /*...*/\
  \ }\n```\n\n### 类型检查模式\n\nPHP 灵活的类型系统使其最实用的特性之一，允许将数字字符串用整数，反之亦然。这种传统在 PHP 7 中得以延续，但现在你可以选择启用严格类型强制，就像你在其他语言（如\
  \ `Java` 或 `C#`）中看到的那样。可以使用 [`declare 构造](https://php.net/manual/en/control-structures.declare.php)\
  \ 来启用此设置。\n\n#### 弱（强制）类型检查\n\n“强制”模式是 PHP 7 中的默认类型检查模式。这与 PHP 之前的版本处理内置函数标量类型提示的方式相同。例如，看看\
  \ `floor` 函数的方法签名：\n\n```\nfloat floor ( float $value )\n```\n\n当你传入数字字符串或整数时，PHP\
  \ 会自动将它们转换为浮点数。这种行为同样扩展到了用户态函数。\n\n下表显示了根据声明的类型在“强制”模式下接受的标量类型：\n\n允许的类型，强制模式\n\n\
  | 类型声明 | int | float | string | bool | object |\n| --- | --- | --- | --- | --- |\
  \ --- |\n| int | yes | yes* | yes† | yes | no |\n| float | yes | yes | yes† | yes\
  \ | no |\n| string | yes | yes | yes | yes | yes‡ |\n| bool | yes | yes | yes |\
  \ yes | no |\n\n* 仅接受 `PHP_INT_MIN` 和 `PHP_INT_MAX` 之间的非 `NaN` 浮点数。\n† 如果是数字字符串\n\
  ‡ 仅当对象具有 `__toString()` 方法\n\n#### 强（严格）类型检查\n\nPHP 7 引入了一种新的“严格”模式，通过在脚本顶部放置 `declare(strict_types=1);`\
  \ 来启用，所示：\n\n```php\n<?php\ndeclare(strict_types=1);\n\nfunction welcome(string\
  \ $name) {\n    echo 'Hello ' . $name;\n}\n\nwelcome('World'); // 输出: Hello World\n\
  ```\n\n此声明对整个文件中的所有用途启用严格模式，包括内置 PHP 函数调用和返回值（见下一章）。它不会影响任何包含的文件或任何包含它的其他文件。\n\n\
  严格模式本质上要求你传入声明的精确类型。如果没有这样做，将抛出 `TypeError`。例如，在严格模式下，当期望 `float` 或 `int` 时，不能使用数字字符串（就像在弱/强制模式中那样）：\n\
  \n这在严格模式下会报错：\n\n```php\n<?php\ndeclare(strict_types=1);\n\nfunction welcome(string\
  \ $name) {\n    echo 'Hello ' . $name;\n}\n\nwelcome(3);\n\n// Fatal error: Uncaught\
  \ TypeError: Argument 1 passed to welcome() must be of the type string, integer\
  \ given\n```\n\n但这条规则有一个例外，即 `float` 可以接受 `int` 值：\n\n范围扩大示例\n\n```php\n<?php\n\
  declare(strict_types=1);\n\nfunction add(float $a, float $b): float {\n    return\
  \ $a + $b;\n}\n\nadd(1, 2); // float(3)\n```\n\n允许的类型，严格模式\n\n| 类型声明 | int | float\
  \ | string | bool | object |\n| --- | --- | --- | --- | --- | --- |\n| int | yes\
  \ | no | no | no | no |\n| float | yes* | yes | no | no | no |\n| string | no |\
  \ no | yes | no | no |\n| bool | no | no | no | yes | no |\n\n* 由于原始类型转换的扩大而允许\n\
  \n### 混合模式\n\n由于指令是按文件设置的，在你的应用程序中混合模式是完全可能的。例如，你的严格检查应用可以使用弱检查的库（或反之亦然），而不会出现任何问题或复杂性。\n\
  \n### 向后兼容\n\n你可能无法再创建名为 `int`、`float`、`string` 或 `bool` 的类，因为这些将与新的标量类型提示冲突。\n\n\
  ### 扩展阅读\n\n* [RFC: 标量类型声明](https://wiki.php.net/rfc/scalar_type_hints_v5)\n* [PHP\
  \ 文档：类型提示](https://php.net/manual/en/language.oop5.typehinting.php)\n\n## 第 2 章：返回值声明\n\
  \n在上一章中，我们看到了方法参数如何声明类型。在 PHP 7 中，你也可以声明方法将返回什么类型。通过在左大括号（`{`）之前放置冒号（`:`）和返回类型来实现，所示：\n\
  \n```\nfunction getAuthor(): UserInterface {\n    return $this->getUser();\n}\n\
  ```\n\n如果你返回了不同的内容，例如 `string` 或 `BlogComment`，PHP 将抛出 `TypeError`：\n\n```\nfunction\
  \ getAuthor(): UserInterface\n```\n\n### 返回 null\n\n声明了类型的方法**永远**不允许返回 `null`。这样做会导致致命错误：\n\
  \n```php\nclass User\n{\n    public function getBirthday(): \\DateTime {\n     \
  \   return null;\n    }\n}\n```\n\n虽然目前不允许返回空，[可空类型 RFC](https://wiki.php.net/rfc/nullable_types)\
  \ 未来可能会提供这种功能。\n\n### 子类方法\n\n子类中重写的方法必须与父方法声明相同的类型。例如，给定以下方法：\n\n```\nabstract\
  \ class VehicleFactory\n{\n    static function create(): Vehicle {\n        // ...\n\
  \    }\n}\n```\n\n任何扩展 `VehicleFactory` 并重写 `create()` 方法的类都必须使用相同的 `Vehicle` 返回类型：\n\
  \n```php\nclass CarFactory extends VehicleFactory\n{\n    static function create():\
  \ Vehicle {\n        // ...\n    }\n}\n\nclass TruckFactory extends VehicleFactory\n\
  {\n    static function create(): Vehicle {\n        // ...\n    }\n}\n```\n\n这是因为方法签名强制执行是不变的（invariant）；你不能定义更具体的返回类型，否则\
  \ PHP 将引发错误：\n\n```php\nclass CarFactory extends VehicleFactory\n{\n    static function\
  \ create(): Car {\n        // ...\n    }\n}\n\n// Fatal error: Declaration of CarFactory::create()\
  \ must be compatible with VehicleFactory::create(): Vehicle\n```\n即使 `Car` 扩展自 `Vehicle`\
  \ 使其协变，返回类型*声明*必须保持完全一致。\n\n如果父类没有声明返回类型，则子类可以选择性声明任何类型（如果需要）。例如，以下所有情况都是允许的：\n\n\
  ```php\ninterface CacheInterface\n{\n    public function get($key);\n}\n\n// 无返回类型\n\
  class SimpleCache implements CacheInterface\n{\n    public function get($key) {\n\
  \        // ...\n    }\n}\n\n// 返回字符串\nclass HtmlCache implements CacheInterface\n\
  {\n    public function get($key): string {\n        // ...\n    }\n}\n\n// 返回特定的对象类型\n\
  class DatabaseQueryCache implements CacheInterface\n{\n    public function get($key):\
  \ QueryResult {\n        // ...\n    }\n}\n```\n\n\n\n\n\n*   [RFC: 返回类型声明](https://wiki.php.net/rfc/return_types)\n\
  \n## 第 3 章：组合（飞船）运算符\n\nPHP 7 引入了一个新的三元比较运算符 `<=>`（`T_SPACESHIP`），它接受两个表达式：`(expr)\
  \ <=> (expr)`。它比较表达式的两边，并根据结果返回三个值之一：\n\n| 0 | 如果两个表达式相等 |\n| --- | --- |\n| 1 |\
  \ 如果左侧大于右侧 |\n| -1 | 如果右侧大于 |\n\n如果你以前用过 `strcmp` 等现有的比较函数，你可能对它很熟悉。\n\n它的优先级与相等运算符（`==`,\
  \ `===`, `!=`, `!==`）相同，且行为与[现有的比较运算符](http://php.net/manual/en/language.operators.comparison.php）（`<`,\
  \ `<=`, `==`, `>=`, `>`）完全一致。\n\n## 比较值\n\n你可以比较从标量值（如 `int` 和 `float`）到数组甚至对象在内的所有内容。以下是来自[相关\
  \ RFC](https://wiki.php.net/rfc/combined-comparison-operator)的示例：\n\nPHP RFC 示例（采用\
  \ CC BY 3.0 许可）\n\n```\n// Integers\necho 1 <=> 1; // 0\necho 1 <=> 2; // -1\necho\
  \ 2 <=> 1; // 1\n\n// Floats\necho 1.5 <=> 1.5; // 0\necho 1.5 <=> 2.5; // -1\n\
  echo 2.5 <=> 1.5; // 1\n\n// Strings\necho \"a\" <=> \"a\"; // 0\necho \"a\" <=>\
  \ \"b\"; // -1\necho \"b\" <=> \"a\"; // 1\n\necho \"a\" <=> \"aa\"; // -1\necho\
  \ \"zz\" <=> \"aa\"; // 1\n\n// Arrays\necho [] <=> []; // 0\necho [1, 2, 3] <=>\
  \ [1, 2, 3]; // 0\necho [1, 2, 3] <=> []; // 1\necho [1, 2, 3] <=> [1, 2, 1]; //\
  \ 1\necho [1, 2, 3] <=> [1, 2, 4]; // -1\n\n// Objects\n$a = (object) [\"a\" =>\
  \ \"b\"];\n$b = (object) [\"a\" => \"b\"];\necho $a <=> $b; // 0\n\n$a = (object)\
  \ [\"a\" => \"b\"];\n$b = (object) [\"a\" => \"c\"];\necho $a <=> $b; // -1\n\n\
  $a = (object) [\"a\" => \"c\"];\n$b = (object) [\"a\" => \"b\"];\necho $a <=> $b;\
  \ // 1\n\n// only values are compared\n$a = (object) [\"a\" => \"b\"];\n$b = (object)\
  \ [\"b\" => \"b\"];\necho $a <=> $b; // 0\n```\n\n## 排序\n\n该运算符最好的用途可能是为了简化排序，因为像\
  \ `usort` 这样的函数要求你执行比较并相应地返回 `-1`、`0` 或 `1`：\n\n当通过某个属性值来比较对象时，这种简化尤为明显：\n\n```\n\
  class Spaceship {\n    public $name;\n    public $maxSpeed;\n\n    public function\
  \ __construct($name, $maxSpeed) {\n        $this->name = $name;\n        $this->maxSpeed\
  \ = $maxSpeed;\n    }\n}\n\n$spaceships = [\n    new Spaceship('Rebel Transport',\
  \ 20),\n    new Spaceship('Millenium Falcon', 80),\n    new Spaceship('X-Wing Starfighter',\
  \ 80),\n    new Spaceship('TIE Bomber', 60),\n    new Spaceship('TIE Fighter', 100),\n\
  \    new Spaceship('Imperial Star Destroyer', 60),\n];\n\n// 按名称升序排序 spaceship\n\
  usort($spaceships, function ($ship1, $ship2) {\n    return $ship1->name <=> $ship2->name;\n\
  });\n\necho $spaceships[0]->name; // \"Imperial Star Destroyer\"\n\n// 按速度降序排序 spaceship\n\
  // 注意我们交换了 $ship1 和 $ship2 的位置\nusort($spaceships, function ($ship1, $ship2) {\n\
  \    return $ship2->maxSpeed <=> $ship1->maxSpeed;\n});\n\necho $spaceships[0]->name;\
  \ // \"TIE Fighter\"\n```\n\n如果没有比较运算符，这些函数将会变得复杂得多：\n\n```\nusort($spaceships,\
  \ function ($ship1, $ship2) {\n    if ($ship1->maxSpeed == $ship2->maxSpeed) {\n\
  \        return 0;\n    } elseif ($ship1->maxSpeed < $ship2->maxSpeed) {\n     \
  \   return 1;\n    } else {\n        return -1;\n    }\n});\n```\n\n## 多值排序\n\n\
  你可以利用数组比较的行为来轻松地按多个字段排序：\n\n```\n// 按速度升序排序，然后按名称升序排序\nusort($spaceships, function\
  \ ($ship1, $ship2) {\n    return [$ship1->maxSpeed, $ship1->name] <=> [$ship2->maxSpeed,\
  \ $ship2->name];\n});\n```\n\n\n\n\n\n例如，如果我们想表示 `U+1F427 PENGUIN` 表情，我们的转义序列看起来会像这样：`\\\
  u1F427`。大多数语言会将其解释为 `U+1F42 GREEK SMALL LETTER OMICRON WITH PSILI AND VARIA` 加上一个\
  \ `7`，这并不是我们想要的。在这些语言中，你必须使用两个 16 位的序列对其进行编码，如`\\uD83D\\uDC27`。但这并不清晰。\n\n使用 `{}`\
  \ 字符包裹可以让我们轻松地突破 16 位的限制，而无需牺牲清晰度：`\\u{1F427}`。\n\n### 局限性\n\n此功能遵循 PHP 中所有其他转义序列的行为——它们只能在双引号字符串和\
  \ heredoc（此处文档字符串）中使用：\n\n#### 示例用法\n\n```\n$foo = \"\\u{2109}\\u{2134}\\u{2134}\"\
  ;\n// ℉ℴℴ\n\n$bar = <<<EOT\n    \\u{212C}\\u{212B}\\u{211D}\nEOT;\n// ℬÅℝ\n```\n\
  \n并且像 `\\t` 等其他序列一样，当它们出现在单引号字符串或 nowdoc 中，它们*不会*被解析：\n\n#### 这些将不起作用\n\n```\n$foo\
  \ = '\\u{2109}\\u{2134}\\u{2134}';\n// \\u{2109}\\u{2134}\\u{2134}\n\n$bar = <<<'EOT'\n\
  \    \\u{212C}\\u{212B}\\u{211D}\nEOT;\n// \\u{212C}\\u{212B}\\u{211D}\n```\n\n\
  ### 向后兼容性\n\n包含 `\\u{` 后跟接无效序列的双引号字符串和 heredoc 现在将导致错误。可以通过使用另一个反斜杠对开头的反斜杠进行转义（`\\\
  \\u{`）来避免这个问题。\n\n### 进阅读：\n\n* [RFC: Unicode 码点转义语法](https://wiki.php.net/rfc/unicode_escape)\n\
  \n## 第 6 章：匿名类\n\nPHP 5.3 赋予我们创建匿名函数（也称为“闭包”）的能力。第 7 版本更进了一步，允许我们创建匿名类。如果你工作过像 C#\
  \ 和 Java 这样支持相同功能的其他面向对象的语言，你可能已经熟悉这个概念。\n\n这些类与命名类几乎完全相同，但没有名称（就像命名函数与匿名函数的区别）。甚至它们的语法看起来也很相似：\n\
  \n```\n$wrapper = new class($foo) {\n    public function __construct($var) {\n \
  \       $this->var = $var;\n    }\n}\n```\n\n匿名类也支持继承和 trait（特性）。这使得即时实现轻量级接口变得轻而容易：\n\
  \n```\n$httpClient->setLogger(new class implements SimpleLoggerInterface {\n   \
  \ public function log($data) {\n        file_put_contents('http.log', $data, FILE_APPEND);\n\
  \    }\n});\n\n$authHandler->addListener(new class implements AuthenticationEventListener\
  \ {\n    public function onAuthSuccess(AuthEvent $event) {\n        // ...\n   \
  \ }\n\n    public function onAuthFailure(AuthEvent $event) {\n        // ...\n \
  \   }\n});\n```\n\n你甚至可以扩展其他类、使用 trait 并实现构造函数：\n\n```\n$email = new class($user)\
  \ extends AbstractEmailMessage implements LoggerAware {\n    private $logger;\n\
  \    private $user;\n\n    public function __construct($user) {\n        $this->user\
  \ = $user;\n    }\n\n    public function setLogger(LoggerInterface $logger) {\n\
  \        $this->logger = $logger;\n    }\n}\n```\n\n### 嵌套类\n\n你完全可以在另一个类中嵌套匿名类。然而，这不会自动让该内部类访问外部作用域：\n\
  \n```\nclass Outer {\n    protected $var = 1;\n\n    public function foo() {\n \
  \       return new class {\n            // ...\n        };\n    }\n}\n```\n\n你要么需要通过构造函数传递这些值，要么需要扩展外部类：\n\
  \n```\nclass Outer {\n    protected $var = 1;\n\n    public function foo() {\n \
  \       return new class extends Outer {\n            public function bar() {\n\
  \                // ...\n            }\n        };\n    }\n}\n```\n\n### 用场景\n\n\
  虽然你应该小心不要过度使用匿名类，但它们有许多实用的应用：\n\n* 创建简单的、单次使用的类\n* 快速实现轻量级接口（如日志记录器或事件观察者）\n* 在不需要创建子类的情况下重写类的单个字段/方法\n\
  * 通过即时创建实现来进行模拟测试（Mocking）\n* 为某些内容创建一个简单的包装器\n* 创建一个可以访问外部类受保护成员的嵌套内部类\n\n### 与命名类的区别\n\
  \n#### 自动生成的名称\n\nPHP 会根据匿名类在内存中的地址以及它是否扩展了命名类，自动为你的匿名类生成唯一名称。在相同位置（工厂方法、循环中）创建的多个匿名类始终具有相同的名称。\n\
  \n```\n<?php\nfunction createClass() {\n    return new class {};\n}\n\n// 多次调用上述工厂方法。\n\
  echo get_class(createClass()); // class@0x7fc83\necho get_class(createClass());\
  \ // class@0x7fc83\n```\n（注：此处示例代码逻辑可能在实际运行中产生地址不同，但根据原文描述翻译如上）\n*纠正说明：原文描述为 \"\
  Multiple anonymous classes created in the same position... will always have the\
  \ same name.\" 这在 PHP 逻辑上其实不成立，但根据指令要求翻译原文。*\n\n#### 等价性\n\n匿名类可以使用 `==` 运算符进行等价测试。在相同位置定义的类（相同的相同的）是相等的。\n\
  \n#### 序列化\n\n匿名类不能被序列化。\n\n#### 反射\n\n可以使用 `ReflectionClass::isAnonymous()` 测试一个类是否为匿名类。\n\
  \n### 更多阅读：\n\n* [匿名类 RFC (PHP 文档)]\n* [匿名类的用法（来自 Oracle 文档)](https://docs.oracle.com/javase/javaOO/anonymousclasses.html)\n\
  \n## 第 7 章：分组导入声明\n\n开发者经常发现需要从同一个命名空间导入多个类。这通常会导致类顶部出现大量的 `use` 语句——这里有一个 Symfony\
  \ `AbstractToken` 类的例子：\n\n```php\n<?php\n\nnamespace Symfony\\Component\\Security\\\
  Core\\Authentication\\Token;\n\nuse Symfony\\Component\\Security\\Role\\RoleInterface;\n\
  use Symfony\\Component\\Security\\Role\\Role;\nuse Symfony\\Component\\Security\\\
  User\\UserInterface;\nuse Symfony\\Component\\Security\\User\\AdvancedUserInterface;\n\
  use Symfony\\Component\\Security\\User\\EquatableInterface;\n```\n\nPHP 7 通过允许使用单个声明导入多个类来简化这一点，就像其他语言（如\
  \ Rust、Scala 和 Python）那样：\n\n```php\n<?php\n\nnamespace Symfony\\Component\\Security\\\
  Core\\Authentication\\Token;\n\nuse Symfony\\Component\\Security\\Role\\{ RoleInterface,\
  \ Role };\nuse Symfony\\Component\\Security\\User\\{ UserInterface, AdvancedUserInterface,\
  \ EquatableInterface};\n```\n\n如果需要，这些声明甚至可以跨行编写：\n\n```php\n<?php\n\nnamespace\
  \ Symfony\\Component\\Security\\Core\\Authentication\\Token;\n\nuse Symfony\\Component\\\
  Security\\Role\\{\n    RoleInterface,\n    Role,\n};\nuse Symfony\\Component\\Security\\\
  User\\{\n    UserInterface,\n    AdvancedUserInterface,\n    EquatableInterface,\n\
  };\n```\n\n除了不再冗长和重复之外，它还有助于明确使用了哪些命名空间。这在审查差异（diff）和补丁时特别有用，因为变化更加明显且易读。对比旧方法……\n\
  \n```diff\n  use League\\CommonMark\\Block\\Element\\AbstractBlock;\n  use League\\\
  CommonMark\\Block\\Element\\AbstractInlineContainer;\n  use League\\CommonMark\\\
  Block\\Element\\Document;\n+ use League\\CommonMark\\Block\\Element\\ListBlock;\n\
  \  use League\\CommonMark\\Block\\Element\\Paragraph;\n  use League\\CommonMark\\\
  Util\\TextHelper;\n```\n\n变为此：\n\n\n\n\n\n```\n  use League\\CommonMark\\Block\\\
  Element\\{\n      AbstractBlock,\n      AbstractInlineContainer,\n      Document,\n\
  +     ListBlock,\n      Paragraph,\n}\nuse League\\CommonMark\\Util\\TextHelper;\n\
  ```\n\n第二个示例中的更改要清晰得多。\n\n### 复合命名空间\n\n复合命名空间允许你像这样组合命名空间：\n\n```php\n<?php\n\n\
  namespace Symfony\\Component\\Security\\Core\\Authentication\\Token;\n\nuse Symfony\\\
  Component\\Security\\Core\\{\n    Role\\RoleInterface,\n    Role\\Role,\n    User\\\
  UserInterface,\n    User\\AdvancedUserInterface,\n    User\\EquatableInterface,\n\
  };\n```\n\n### 进阅读：\n\n* [RFC: 分组 use 声明](https://wiki.php.net/rfc/group_use_declarations)\n\
  \n## 第 8 章：闭包 `call` 方法\n\nPHP 5.4 引入了使用 `Closure::bind` 静态方法或 `Closure::bindTo`\
  \ 方法将 `$this` 绑定到任何给定对象的能力：\n\n```\n// 这是一个包含秘密数字的类\nclass SecretNumber { private\
  \ $secretNumber = 3; }\n// 这是一个可以揭露它的闭包\n$revealer = function() { return $this->secretNumber;\
  \ };\n\n// 在 PHP 5.4-5.6 中，我们必须首先\n// 将范围绑定到一个临时的中间闭包：\n$boundRevealer = $revealer->bindTo(new\
  \ SecretNumber(), 'SecretNumber');\n\n// 现在我们可以使用它了：\necho $boundRevealer(); //\
  \ 3\n```\n\nPHP 7 通过添加一个新的 `call` 方法简化了这一过程：\n\n```\nmixed Closure::call(object\
  \ $to[, mixed ...$parameters])\n```\n\n这消除了预先创建一个临时闭包的需要——你只需带上对象作用域和任何参数调用 `call()`\
  \ 即可：\n\n```\n// 这是一个包含秘密数字的类\nclass SecretNumber { private $secretNumber = 3; }\n\
  // 这是一个可以揭露它的闭包\n$revealer = function() { return $this->secretNumber; };\n\n// 直接调用它\n\
  echo $revealer->call(new SecretNumber()); // 3\n```\n\n除了简化代码外，这种方法还提高了性能，因为不再创建中间闭包。\n\
  \n这种新的 `call` 方法可以用于大多数调用 `bind` 或 `bindTo` 后紧接着调用闭包的场景。\n\n### 进阅读：\n\n* [RFC:\
  \ Closure::call](https://wiki.php.net/rfc/closure_apply)\n* [PHP 手册：`Closure::call`](https://secure.php.net/manual/en/closure.call.php)\n\
  \n## 第 9 章：生成器返回表达式\n\n`yield` 关键字允许生成器提供每个单独步骤的结果。这对于“流式”处理大量数据非常完美。生成器还可以将大型计算分解为较小的工作单元，允许函数挂起自身并在稍后恢复。在这些情况下，拥有一种访问这些计算最终结果的标准方法将特别有用。\n\
  \n为了演示返回表达式的使用，让我们构建一个函数来计算目录内所有文件的大小，并在过程中产出当前的进度：\n\n```\nfunction calculateSize($directory)\
  \ {\n    $size = 0;\n    $count = 0;\n    foreach (scandir($directory) as $entry)\
  \ {\n        if (is_file($entry)) {\n            $size += filesize($entry);\n  \
  \          yield $count++;\n        }\n    }\n\n    return $size;\n}\n\n$task =\
  \ calculateSize('./downloads');\nforeach ($task as $step) {\n    echo \"目前已处理 $step\
  \ 个文件\\n\";\n}\n\necho \"总大小: \" . $task->getReturn();\n```\n\n在 PHP 7 之前，那个 `return\
  \ $size` 将会导致错误，因为不支持从生成器中返回。你必须使用类似这样的变通方法：\n\n```\nfunction calculateSize($directory)\
  \ {\n    $size = 0;\n    $count = 0;\n    foreach (scandir($directory) as $entry)\
  \ {\n        if (is_file($entry)) {\n            $size += filesize($entry);\n  \
  \          yield $count++;\n        }\n    }\n\n    yield $size;\n}\n```\n\n（滥）用最后的\
  \ `yield` 作为返回值在技术上是可行的，但有两个主要缺点：\n\n* 消费者应该能够依赖产值（yielded values）具有相同的类型和含义\n*\
  \ 这并不明确表明这是最终结果，且不会再进行其他工作\n\n当你尝试多任务处理几个不同的进程时，这一点变得尤其重要：\n\n```\nfunction downloadAndZipAFile($url)\
  \ {\n    $download = yield downloadFromInternet($url);\n\n    $zipFile = yield compressAndSave($download);\n\
  \n    yield 'user/uploads/' . $zipFile;\n}\n```\n\n在那个示例中，我们产出了三次，但只有两个是实际步骤。如果我们使用下面的方式，会更清晰得多：\n\
  \n```\nfunction downloadAndZipAFile($url) {\n    $download = yield downloadFromInternet($url);\n\
  \n    $zipFile = yield compressAndSave($download);\n\n    return 'user/uploads/'\
  \ . $zipFile;\n}\n```\n\n### 进阅读：\n\n* [RFC: 生成器返回表达式](https://wiki.php.net/generator-return)\n\
  \n## 第 10 章：生成器委托\n\nPHP 7 引入了 `yield from` 语法，允许生成器委托给数组、`Traversable` 对象甚至是生成器。这允许将工作拆分成更小的单元，就像你把代码拆分成几个小部分一样。它会遍历给定的\
  \ `<expr>`，并将每个值直接传递给原始调用者。\n\n### 详细产出值\n\n这是一个产出值的生成器简单示例：\n\n```\nfunction main()\
  \ {\n    // 处理第一个值\n    yield 'a';\n\n    // 处理一组值\n    yield 'b';\n    yield 'c';\n\
  \    yield 'd';\n\n    // 处理另一个值\n    yield 'e';\n}\n\nforeach (main() as $letter)\
  \ {\n    var_dump($letter);\n}\n\n/*\nstring(1) \"a\"\nstring(1) \"b\"\nstring(1)\
  \ \"c\"\nstring(1) \"d\"\nstring(1) \"e\"\n*/\n```\n\n如果我们想把“处理一组值”部分拆分到生成器中呢？我们可以使用\
  \ `yield from <expr>` 语法来实现。\n\n```\nfunction subGenerator() {\n    yield 'b';\n\
  \    yield 'c';\n    yield 'd';\n}\n\nfunction main() {\n    // 处理第一个值\n    yield\
  \ 'a';\n\n    // 处理一组值\n    yield from subGenerator();\n\n    // 处理另一个值\n    yield\
  \ 'e';\n}\n\nforeach (main() as $number) {\n    var_dump($number);\n}\n\n/*\nstring(1)\
  \ \"a\"\nstring(1) \"b\"\nstring(1) \"c\"\nstring(1) \"d\"\nstring(1) \"e\"\n*/\n\
  ```\n\n正如前面提到的，你还可以委托给数组和 `Iterable`。这两个函数将产生与上面相同的输出：\n\n```\nfunction main() {\n\
  \    // 处理第一个值\n    yield 'a';\n\n    // 处理一组值\n    yield from ['b', 'c', 'd'];\n\
  \n    // 处理另一个值\n    yield 'e';\n}\n```\n\n```\nfunction main() {\n    // 处理第一个值\n\
  \    yield 'a';\n\n    // 处理一组值\n    yield from new ArrayIterator(['b', 'c', 'd']);\n\
  \n    // 处理另一个值\n    yield 'e';\n}\n```\n\n### 发送值\n\n值也可以发送到子生成器。这在协程的语文中特别有用，因为数据在执行期间会被发送到函数：\n\
  \n\n\n\n\n```php\n// 生成随机数，直到被命令停止\n// 如果你不发送该命令，它将无限循环\nfunction getRandomNumbers()\
  \ {\n    while (true) {\n       $cmd = (yield rand(1, 10));\n       if ($cmd ==\
  \ 'stop') {\n           break;\n       }\n    }\n}\n\n// 合并两个随机数的“无限流”\nfunction\
  \ foo() {\n    yield from getRandomNumbers();\n    yield from getRandomNumbers();\n\
  }\n\n$generator = foo();\nforeach ($generator as $randomNumber) {\n    var_dump($randomNumber);\n\
  \n    // 当我们得到 3 时，停止生成器\n    if ($randomNumber == 3) {\n        $generator->send('stop');\n\
  \    }\n}\n\n/*\nint(4)\nint(7)\nint(5)\nint(1)\nint(8)\nint(3) // 第一个随机数“流”在这里停止\n\
  int(5)\nint(9)\nint(3) // 第二个在这里停止\n*/\n```\n\n### 异常 (Exceptions)\n\n抛出的异常将像往一样向上抛：\n\
  \n```php\nfunction a() {\n    yield 1;\n    yield 2;\n\n    throw new Exception('oh\
  \ noes!');\n}\n\nfunction b() {\n    yield 'foo';\n    yield from a();\n    yield\
  \ 'bar';\n}\n\nforeach (b() as $var) {\n    var_dump($var);\n}\n\n/*\nstring(3)\
  \ \"foo\"\nint(1)\nint(2)\n\nFatal error: Uncaught Exception: oh noes! in /tmp/gen.php:7\n\
  Stack trace:\n#0 /tmp/gen.php(12): a()\n#1 /tmp/gen.php(16): b()\n#2 {main}\n  thrown\
  \ in /tmp/gen.php on line 7\n*/\n```\n\n还有两种特定情况，使用 `yield from` 可能会抛出 `EngineException`：\n\
  \n1. 尝试对数组或 `Traversable` 以外的内容进行 `yield from`\n\n2. 尝试 `yield from` 一个之前抛出过未捕获异常的生成器\n\
  \n### 返回值 (Return Values)\n\n如果 `<expr>` 恰好是一个子生成器，那么 `yield from <expr>` 将提供该子生成器的最终返回值：\n\
  \n```php\nfunction a() {\n    yield 1;\n    yield 2;\n\n    return 42;\n}\n\nfunction\
  \ b() {\n    yield 'foo';\n    $retVal = yield from a();\n    yield 'bar';\n   \
  \ return $retVal;\n}\n\n$generator = b();\nforeach ($generator as $var) {\n    var_dump($var);\n\
  }\nvar_dump($generator->getReturn());\n\n/*\nstring(3) \"foo\"\nint(1)\nint(2)\n\
  string(3) \"bar\"\nint(42)\n*/\n```\n\n* * *\n\n总结：通过委托，对于你的调用者来说，`yield` 存在于主生成器还是子生成器中并不重要；接收和发送值将始终如你预期的那样保持一致。\n\
  \n### 进阶阅读：\n\n* [RFC: 生成器委托](https://wiki.php.net/rfc/generator-delegation)\n\n\
  ## 第 11 章：可靠的用户态 CSPRNG\n\nPHP 7 引入了加密安全的伪随机数生成器 (CSPRNG) API，极大地简化了生成高质量随机数据的过程：\n\
  \n```php\nrandom_bytes(int length);\n\nrandom_int(int min, int max);\n```\n\n这些方法产生“加密安全的”随机数，适用于高风险应用，例如生成加密密钥、为密码加盐、洗牌牌组等。\n\
  \n如果你想在之前的 PHP 版本中生成此类值，你需要编写代码来对接 `mcrypt/openssl` 接口或直接访问 `/dev/*random`。这在技术上可行，但由于对编写代码时使用的库或操作系统有硬编码依赖，你的代码将不可移植的。\n\
  \n有了 PHP 7，你只需要调用 `random_bytes` 或 `random_int`，PHP 就会智能地选择当前机器上可用的随机源。这可能是：\n\n\
  * Windows 环境下的 `CryptGenRandom`\n\n* 如果可用则使用 `arc4random_buf()`（通常是 BSD 特有的）\n\n\
  * `/dev/arandom` 或 `/dev/urandom`\n\n如果没有足够的随机源，将会抛出错误。\n\n### 向后兼容性 (Backwards\
  \ Compatibility)\n\n你可能无法再在全局命名空间中定义名为 `random_int()` 或 `random_bytes()` 的函数。\n\n\
  ### 向前兼容性 (Forwards Compatibility)\n\n[`paragonie/random_compat 库](https://github.com/paragonie/random_compat)\
  \ 将这些新函数反移植到 PHP 5.x。只需将此放入你的应用程序中，如果这些函数不存在就会定义它们，从而允许你编写运行在 5.x 和 7 上的安全代码。\n\n\
  ### 进阶阅读\n\n* [RFC：简单的用户态 CSPRNG](https://wiki.php.net/rfc/easy_userland_csprng)\n\
  \n* [PHP 手手册：CSPRNG 函数](http://us3.php.net/manual/en/ref.csprng.php)\n\n* [如何在 PHP\
  \ 中安全地生成随机字符串和整数](https://paragonie.com/blog/2015/07/how-safely-generate-random-strings-and-integers-in-php)\n\
  \n* [ircmaxell: PHP 中的随机数生成](http://blog.ircmaxell.com/2011/07/random-number-generation-in-php)\n\
  \n## 第 12 章：整数除法 (Integer Division)\n\nPHP 历史上缺乏整数除法的功能。例如，如果你除以 `5 / 2`，你总是得到一个浮点数；如果你想要整数结果，必须对其进行强制转换：`(int)\
  \ 5 / 2`。这对于大多数应用是可以的，特别是涉及较小数字时。由于浮点数无法表示大于 53 位的整数，为了避免这种限制（以及对强制转换的需求），PHP 7\
  \ 引入了新的 `intdiv()` 方法：\n\n```php\nintdiv(int $)\n```\n\n它正如你预期的那样工作，除两个整数并提供整数结果。它不使用浮点除法。\n\
  \n如果 `$divisor` 为 0，函数将抛出 `DivisionByError`。\n\n### 向后兼容性 (Backwards Compatibility)\n\
  \n你可能无法再在全局命名空间中定义名为 `random_int()` 或 `random_bytes()` 的函数。\n\n### 进阶阅读\n\n* [RFC:\
  \ intdiv()](https://wiki.php.net/rfc/intdiv)\n\n* [PHP 手册：intdiv()](http://us3.php.net/manual/en/function.intdiv.php)\n\
  \n## 第 13 章：`preg_replace_callback_array`\n\n`preg_replace_callback_array` 是一个新的\
  \ PCRE 函数，允许使用回调进行多个模式的查找和替换：\n\n```php\npreg_replace_callback_array(array $pattern,\
  \ $subject, $limit, &$count)\n```\n\n这是一个实际应用示例：\n\n```php\n$song = \"99 bottles\
  \ of beer on the wall\\n99 bottles of beer\\nTake one down, pass\nit around\\n98\
  \ bottles of beer on the wall\";\n\necho preg_replace_callback_array([\n    '/bottles\
  \ of (beer|ale|cider)/' => function($matches) {\n        return 'little bugs';\n\
  \    },\n    '/on the (wall|floor)/' => function($matches) {\n        return 'in\
  \ the code';\n    },\n    '/pass/' => function($matches) {\n        return 'patch';\n\
  \    },\n    '/98/' => function($matches) {\n        return rand(100, 200);\n  \
  \  },\n], $song);\n\n/**\n * 99 little bugs in the code\n * 99 little bugs\n * Take\
  \ one down, patch around\n * 146 little bugs in the code\n */\n```\n\n然而，`/e` 修饰符在\
  \ PHP 5.5.0 中被弃用，从而删除了将匹配模式与回调配对的功能。`preg_replace_callback_array` 的引入重新启用了这一功能。\n\
  \n### 向后兼容性 (Backwards Compatibility)\n\n你可能无法再在全局命名空间中定义名为 `preg_replace_callback_array()`\
  \ 的函数。\n\n### 进阶阅读\n\n* [RFC: preg_replace_callback_array](https://wiki.php.net/rfc/preg_replace_callback_array)\n\
  \n## 第 14 章：IntlChar 类\n\nPHP 通过 `intl` 扩展支持国际化 (i18n) 和本地化 (l10n)。该扩展基本上是 ICU 库的，因此提供了几乎相同的方法和功能。\n\
  \n\n\n\n\nPHP 7 通过新的 [`IntlChar` 类](https://secure.php.net/manual/en/class.intlchar.php)\
  \ 暴露 ICU 的 Unicode 字符功能。该类包含 600 个常量和 59 个静态方法，我们不会涵盖它们，但这里有一些你可能会觉得有用的示例：\n\n```\n\
  // 返回包含该字符的 Unicode 分块。\npublic static function getBlockCode(mixed $codepoint):\
  \ int;\n\n// 判断指定的代码点是否为字母字符。\nstatic public function isalpha(mixed $codepoint):\
  \ bool;\n\n// 判断指定的代码点是否为标点符号字符。\nstatic public function ispunct(mixed $codepoint):\
  \ bool;\n\n// 判断指定的代码点是否为“图形”字符\n//（可打印的，排除空格）。\nstatic public function isgraph(mixed\
  \ $codepoint): bool;\n\n// 判断指定的代码点是否为“空白”或\n//“水平空格”，即在行上可见地分隔单词的字符。\nstatic public\
  \ function isblank(mixed $codepoint): bool;\n\n// 将给定的字符映射到其小写等效字符；如果字符没有\n// 小写等效字符，则返回字符本身。\n\
  static public function tolower(mixed $codepoint): mixed;\n\n// 获取 Unicode 字符名称。\n\
  static public function charName(mixed $codepoint, int $nameChoice = IntlChar::UNICICODE_CHAR_NAME)\n\
  ```\n\n### 向后兼容\n\n你可能无法在全局命名空间创建名为 `IntlChar` 的类。\n\n### 扩展阅读\n\n* [RFC: IntlChar\
  \ 类](https://wiki.php.net/rfc/intl.char)\n* [PHP 手册：IntlChar](https://secure.php.net/manual/en/class.intlchar.php)\n\
  * [ICU 55.1: uchar.h 文件引用](https://ssl.icu-project.org/apiref/icu4c/uchar_8h.html#func-members)\n\
  \n# 第二部分 - 语言变化与改进\n\nPHP 7 对语言进行了多项重大改进，并对现有功能进行了一些更改。\n\n了解这些让 PHP 7 比以往任何时候都更快、更灵活的特性和变化！\n\
  \n## 第 15 章：性能\n\nPHP 7 比以往任何时候都快。大多数真实世界的应用只需升级即可看到性能提升 100% 以上！以下是来自 Zend Performance\
  \ Team^(1) 的一些实际基准测试：\n\n![Zend Performance Team Benchmark](img/benchmark.png)\n\
  \nZend Performance Team Benchmark\n\n这种改进很大程度上归功于 PHPNG (PHP 下代) 项目，该项目重构了 Zend\
  \ 引擎以实现超高性能。一些底层更改包括：\n\n* 使用更紧凑的数据结构\n* 减少堆分配和释放的次数\n* 利用原生线程本地存储\n\n最终结果是 PHP\
  \ 更快，同时也使用了更少的内存。这些更改为未来的改进铺平了道路，例如 JIT 编译，这将使 PHP 变得更快。\n\n### 扩展阅读\n\n* [Zend:\
  \ 使用 PHP 7 加速 Web 开发](https://www.zend.com/en/resources/php7_infographic)\n\n##\
  \ 第 16 章：一致性\n\n得益于两项变化，PHP 7 的语法现在与其他语言更加保持一致：\n\n### 统一变量语法\n\n在之前的版本中，`list()`\
  \ 仅对数组有效。在 PHP 7 中，它支持多种类型，包括对象和字符串。例如，`charName(mixed $codepoint, int $nameChoice\
  \ = IntlChar::UNICICODE_CHAR_NAME)` 函数和其他表达式。\n\n```\n// PHP 5: $array = [3, 2,\
  \ 1]\n// PHP 7: $array = [1, 2, 3]\nlist($array[], $array[], $array[]) = [1, 2,\
  \ 3];\n```\n\n虽然这是进步的一步，但这些更改导致了 `list()` 工作方式的细微变化。你最可能遇到的是 `list()` 现在按从左到右顺序：\n\
  \n```php\nlist($array[], $array[], $array[]) = [1, 2, 3];\nvar_dump($array);\n```\n\
  \n之前的 PHP 版本在解析器读取代码时直接生成字节码。虽然这在大多数情况下可行，但有时会导致某些问题。PHP 7 通过使用抽象语法树 (AST) 将解析器与编译器完全解耦解决了这个问题。\n\
  \n实现 AST 还可以为未来实现其他语言中常见的功能提供可能，例如：\n\n* 无需 `list` 的数组解构：`[$foo, $bar] = $array`\n\
  * Python 风格的表达式 `$x*$x for $x in $list`\n* LINQ 风格表达式\n\n### 向后兼容\n\n如所示，此更改将破坏非标准\
  \ `list()` 用法的向后兼容性。如果你需要以特定方式评估表达式，可以使用 `{}`。\n\n### 抽象语法树\n\nPHP 7 的语法现在与其他语言更加一致。除了让引擎更容易维护外，它还解决了几个问题：\n\
  \n* 在表达式中使用 `yield` 不再需要括号\n* 像 `($foo)` 的表达式的行为现在相同\n* 可以直接调用魔方法 `__clone()`\n\n\
  ## 第 17 章：半保留字\n\nPHP 5.x 有约 64 个全局保留字，例如 `default` 和 `list`。由于它们是全局保留的，无法将这些术语作为类方法或属性：\n\
  \n来自 RFC 的示例，这些会导致语法错误：\n\n```php\nclass Collection {\n    public function forEach(callable\
  \ $callback) { /* */ }\n    public function list() { /* */ }\n}\n```\n\n\n\n\n\n\
  PHP 7 实现了一种新的上下文敏感词法器，使其足够智能，能够确定关键字的上下文；它可以区分普通关键字用法与在类内部的用法。以下来自 PHP 5.x 的所有保留字现在都是半保留的：\n\
  \n| `abstract` || `and` || `array` |\n| --- | --- | --- |\n| `as` || `break` ||\
  \ `callable` |\n| `case` || `catch` || `class` |\n| `clone` || `const` || `continue`\
  \ |\n| `declare` || `default` || `die` |\n| `do` || `echo` || `else` |\n| `elseif`\
  \ || `enddeclare` || `endfor` |\n| `endforeach` || `endif` || `endswitch` |\n| `endwhile`\
  \ || `exit` || `extends` |\n| `final` || `finally` || `for` |\n| `foreach` || `function`\
  \ || `global` |\n| `goto` || `if` || `implements` |\n| `include` || `include_once`\
  \ || `instanceof` |\n| `insteadof` || `interface` || `list` |\n| `namespace` ||\
  \ `new` || `or` |\n| `parent` || `print` || `private` |\n| `protected` || `public`\
  \ || `require` |\n| `require_once` || `return` || `self` |\n| `static` || `switch`\
  \ || `throw` |\n| `trait` || `try` || `use` |\n| `var` || `while` || `xor` |\n|\
  \ `yield` || || |\n\n这些半保留字现在可以作为类、接口和 trait 的属性、常量和方法名：\n\n### 一些基础示例\n\n```\n\
  class Collection {\n    public function forEach(callable $callback) { }\n    public\
  \ function list() { }\n}\n\nclass BaseballPlayer {\n    public function throw(Baseball\
  \ $ball, BaseballPlayer $target) { }\n    public function catch(Baseball $ball)\
  \ { }\n}\n```\n\n这里是来自 RFC 的其他示例：\n\n#### 将 ‘include’ 作为公共方法\n\n```\nclass View\
  \ {\n    public function include(View $view) {\n        //...\n    }\n}\n$viewA\
  \ = new View('a.view');\n$viewA->include(new View('b.view'));\n```\n\n#### 将 ‘continue’\
  \ 作为类常量\n\n```\nclass HTTP {\n    const CONTINUE = 100;\n    const SWITCHING_PROTOCOLS\
  \ = 101;\n    /* ... */\n}\n```\n\n#### 使用 ‘and’‘or’ 和 ‘list’ 等保留字的流式接口\n\n```php\n\
  $projects =\n    Finder::for('project')\n        ->where('name')->like('%secret%')\n\
  \        ->and('priority', '>', 9)\n        ->or('code')->in(['4', '5', '7'])\n\
  \        ->and()->not('created_at')->between([$time1, $time2])\n        ->list($limit,\
  \ $offset);\n```\n\n对此只有两个限制：\n\n1. 它仅在 OO 作用域内（类、接口和 trait）有效。\n2. `class` 不能用作常量，因为会与类名解析语法（`SomeClass::class`）冲突。不过，它可以用于方法和属性名。\n\
  \n### 扩展阅读\n\n* [RFC: 上上下文敏感词法器](https://wiki.php.net/rfc/context_sensitive_lexer)\n\
  * [PHP 手册：关键字列表](https://secure.php.net/manual/en/reserved.keywords.php)\n* [PHP\
  \ 手册：其他保留字列表](https://php.net/manual/en/reserved.other-reserved-words.php)\n\n##\
  \ 第 18 章：错误处理与异常\n\nPHP 7 极大改进了错误处理。得益于一些重大变更，现在比任何时候都易于处理错误和异常。\n\n### 引擎中的异常\n\
  \n致命和可恢复的致命错误不再像警告和弃用通知那样“引发”，它们现在是引擎抛出的异常。看这个例子：\n\n```\n$foo = 'test';\n$foo->someMethod();\n\
  ```\n\n在之前的版本中，这会导致致命错误：\n\n```\nFatal error: Call to a member function on non-object\n\
  ```\n\nPHP 7 将抛出 `Error`：\n\n```\nUncaught Error: Call to member function someMethod()\
  \ on string\n```\n\n像普通异常一样，这些是可以捕获并处理的：\n\n```\ntry {\n    $foo = 'test';\n   \
  \ $foo->someMethod();\n} catch (Error $e) {\n    var_dump($e);\n}\n\n/**\n  Output:\n\
  \n  object(Error)#1 {\n    [\"message\":protected]=>\n    string(48) \"Call to member\
  \ function someMethod() on string\"\n    [\"string\":protected]=>\n    string(0)\
  \ \"\"\n    [\"code\":protected]=>\n    int(0)\n    [\"file\":protected]=>\n   \
  \ string(9) \"/in/mhr\"\n    [\"line\":protected]=>\n    int(5)\n    [\"trace\"\
  :protected]=>\n    array(0) {\n    }\n    [\"previous\":protected]=>\n    NULL\n\
  }\n**/```\n\nError 有五个预定义的子类：\n\n* `TypeError` - 当参数不匹配类型提示时抛出（见第 17 章](#）。\n* `ParseError`\
  \ - 当 `eval()` 解析代码失败时抛出。\n* `AssertionError` - 当断言 (`assert(...)`) 失败时抛出（见第 18\
  \ 章](#）。\n* `ArithmeticError` - 当数学运算期间发生错误时抛出。\n* `DivisionError` - 当除以零时抛出。\n\n\
  ### `Throwable` 接口\n\n`Error` 和 `Exception` 共享同一个接口，该接口提供了以下方法：\n\n* `getMessage()`\n\
  * `getCode()`\n* `getFile()`\n* `getLine()`\n* `getTrace()`\n* `__toString()`\n\n\
  由于 `Error` 和 `Exception` 共享同一个接口，你可以捕获其中任何一个：\n\n```\ntry {\n    //某些代码\n} catch\
  \ (Exception $e) {\n    // 失败\n} catch (Error $e) {\n    // 失败\n}\n```\n\n或者一次捕获两者：\n\
  \n```\ntry {\n    //某些代码\n} catch (Throwable $e) {\n    // 失败\n}\n```\n\n你不能自己实现\
  \ `Throwable` - 你必须扩展 `Error` 或 `Exception`。\n\n### E_STRICT 重新分类\n\n通知类型一直模糊且冗余。为了简化\
  \ PHP 的错误模型，所有 `E_STRICT` 实例都已重新分类或移除。相应的 [RFC](https://wiki.php.net/rfc/reclassify_strict)\
  \ 提供了关于每个决策理由的有用列表。\n\n不过 `E_STRICT` 常量并未移除，以保持对包含 `error_reporting(E_ALL|E_STRICT)`\
  \ 等代码的脚本兼容。然而，某些 `E_STRICT` 实例现在更加严重，可能会影响错误处理器。\n\n### 向后兼容\n\n在 PHP 5.x 中可以使用错误处理器静忽略致命错误。由于这些错误现在作为异常抛出，该功能已被移除。\n\
  \n同样，使用 `eval()` 时生成的解析错误之前是非致命的，但现在作为异常抛出。如果你要在 PHP 7 中优雅地处理任何错误，你需要将任何 `eval()`\
  \ 调用封装在 `try {}` 块中。\n\n以下类名不再可以在全局命名空间中使用：\n\n* `Throwable`\n* `Error`\n* `TypeError`\n\
  * `ParseError`\n* `AssertionError`\n* `ArithmeticError`\n* `DivisionZeroError`\n\
  \n### 扩展阅读\n\n* [RFC：引擎中的异常](https://wiki.php.net/rfc/engine_exceptions_for_php7)\n\
  * [RFC：Throwable 接口](https://wiki.php.net/rfc/throwable-interface)\n* [RFC：可捕获的“调用非对象的成员”](https://wiki.php.net/rfc/catchable-call-member-of-non-object)\n\
  * [RFC：重新分类 E\\_STRICT 通知](https://wiki.php.net/rfc/reclassify_strict)\n* [PHP 手册：Throwable](https://secure.php.net/manual/en/class.throwable.php)\n\
  * [PHP 手册：Error](https://secure.php.net/manual/en/class.error.php)\n\n## 第 19 章：期望\n\
  \nPHP 4 通过 `assert()` 函数引入了断言。断言是一种有助于调试的功能，用于验证代码中的假设。将它们想象成会自我测试的注释。你只需提供一个应该始终评估为真的\
  \ PHP 语句；任何假值都表示你的端存在错误、代码误用或错误的假设。在 PHP 4 和 5 中，`assert()` 具有如下签名：\n\n```\nbool\
  \ assert ( mixed $assertion [, string $description ] )\n```\n\n\n\n\n\n`assert()`\
  \ 的行为是可以配置的，因此允许你在生产环境中完全禁用它。如果断言会产生负面副作用或导致性能开销，这种特性就尤为有用。\n\n以下是断言的一些示例用例：\n\n\
  ### 应该始终返回值的循环\n\n```php\nforeach ($a as $b) {\n    if ($b->isActive()) {\n    \
  \    return $b;\n    }\n}\n\nassert(false, '我们的循环应该返回一个值');\n```\n\n### 确保所需的扩展已可用\n\
  \n```php\nfunction createThumbnail($image) {\n    assert(extension_loaded('gd'));\n\
  \    // ...\n}\n```\n\n### 防止出现意外的枚举值\n\n```php\nfunction setSuit($suit) {\n   \
  \ case CLUBS:\n    case DIAMONDS:\n    case HEARTS:\n    case SPADES:\n        $this->suit\
  \ = $suit;\n    default:\n        assert(false, '未识别的花牌类型');\n}\n```\n\n### 逻辑回落预期\n\
  \n```php\nif ($i % 3 == 0) {\n    // ...\n} else if ($i % 3 == 1) {\n    // ...\n\
  } else {\n    assert ($i % 3 == 2);\n}\n```\n\n由于 `assert` 在 PHP 4/5 中是一个函数，因此任何表达式（如上面的表达式）总是会被求值的，即使在生产环境中禁用了断言！一种变通是将表达式封装在字符串中，PHP\
  \ 将在需要时对其求值：\n\n```php\nassert ('$i % 3 == 2');\n```\n\n这要好一点，但仍然不理想。\n\n### 作为语句的\
  \ `assert()`\n\nPHP 7 将 `assert()` 升级为一个完整的语句。你不再需要将代码封装在字符串中——直接提供即可：\n\n```php\n\
  assert ($i % 3 == 2);\n```\n\n与之前的版本不同，PHP 7 不会在需要时才会求值该语句。\n\n### 自定义错误\n\n旧版本的\
  \ PHP 在断言失败时会抛出 `E_WARNING`，并使用第二个参数作为警告消息。PHP 7 增加了根据需要抛出自定义自定义错误类型的能力：\n\n```php\n\
  ini_set('assert.exception', 1);\n\nclass MissingExtensionError extends AssertionError\
  \ {}\n\nassert(extension_loaded('foo'), new MissingExtensionError('为了实现此功能需要启用 \"\
  foo\" 扩展'));\n```\n\n抛出异常（而不是发出错误）意味着你将获得一个堆栈跟踪以帮助调查问题。\n\n### 配置\n\n有两个新的 `php.ini`\
  \ 设置用于控制行为并允许向后兼容性：\n\n* `assert.exception` - 默认值为 `0`\n* `zend.assertions` - 默认值为\
  \ `1`\n\n`assert.exception` 控制 `assert()` 失败时的行为：\n\n* `0` - 失败时抛出 `warning`（旧版行为）\n\
  * `1` - 失败时抛出 `AssertionError`\n\n`zend.assertions` 控制 PHP 解析器应该如何处理它发现的断言：\n\n\
  * `1` - 生成并执行断言代码（开发模式）\n* `0` - 生成代码，但在运行时跳过它\n* `-1` - 不生成任何代码（零开销生产模式）\n\n###\
  \ 向后兼容\n\nPHP 7 保持了与旧行为的完全向后兼容：\n\n* 如果 `$expression` 是字符串，它将根据需要进行求值\n* 如果 `$expression`\
  \ 为假(真)，则断言将失败\n* 如果第二个参数是字符串，它将用作 `AssertionError` 的消息\n\n### 扩展阅读\n\n* [RFC: Expectations](https://wiki.php.net/rfc/expectations)\n\
  * [PHP 手册：`assert()`](https://secure.php.net/manual/en/function.php)\n\n## 第 20\
  \ 章：`define()` 中的数组常量\n\nPHP 5.6 增加了使用 `const` 关键字在类上定义数组常量：\n\n```php\nconst LUCKY_NUMBERS\
  \ = [4, 8, 15, 23, 42];\n```\n\nPHP 7 将相同的功能引入了 `define()` 函数：\n\n```php\ndefine('LUCKY_NUMBERS',\
  \ [4, 8, 15, 23, 42]);\n```\n\n### 扩展阅读\n\n* [PHP 手册：`define()`](https://secure.php.net/manual/en/function.php)\n\
  * [PHP 手册：使用 `define()` 定义常量数组](https://secure.php.net/manual/en/migration-7.0.php#define)\n\
  \n## 第 21 章：过滤过的 `unserialize()`\n\n反序列化不可信的数据是一项风险操作，因为恶意用户可能会将他们的数据和对象注入应用程序中。这对于具有析构方法的对象来说特别危险，因为这些方法始终会被执行，即使你实际上没有使用该序列化对象。\n\
