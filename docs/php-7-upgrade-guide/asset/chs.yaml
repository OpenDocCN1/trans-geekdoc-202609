  \ 方法将返回上述描述的新 `ReflectionType` 对象类型。\n\n### ReflectionFunctionAbstract\n\n该类还有两个命名相似的方法，用于确定函数定义的返回类型：\n\
  \n```php\nclass ReflectionFunctionAbstract\n{\n    // ...\n    public bool hasReturnType()\n\
  \    public ReflectionType getReturnType()\n}\n```\n\n### 向后兼容\n\n你不再可以在全局命名空间中定义名为\
