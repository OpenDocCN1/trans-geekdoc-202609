    \ such methods with `static` anyway.)\n\n### Backwards Compatibility\n\n*   Code\
    \ relying on `E_STRICT` may no longer function properly.\n\n*   Things that used\
    \ to emit `E_STRICT` may now emit a higher error category like `E_WARNING`, which\
