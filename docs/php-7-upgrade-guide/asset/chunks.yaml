  trans: "\n\n`assert()` 的行为是可以配置的，因此允许你在生产环境中完全禁用它。如果断言会产生负面副作用或导致性能开销，这种特性就尤为有用。\n\
    \n以下是断言的一些示例用例：\n\n### 应该始终返回值的循环\n\n```php\nforeach ($a as $b) {\n    if ($b->isActive())\
