    \ is unaffected. As such the following code:\n\n```php\n$str = \"\\u202e\"; //\
    \ Works fine\n```\n\n### Error handling\n\n#### Errors as throwables\n\nThere\
    \ are now two classes: `Exception` and `Error`. Both classes implement `Throwable`.\
    \ Type hints in exception handling may need to be changed to account for this.\n\
    \n#### Fatal errors\n\nSome fatal errors and recoverable fatal errors now throw\
    \ an `Error` instead. As `Error` is a separate class from `Exception`, these exceptions\
    \ will not be caught by existing `try/catch` blocks. For the recoverable fatal\
