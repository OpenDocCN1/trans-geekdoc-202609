    \ the value 7, because the last two digits were silently discarded.\n\n#### Negative\
    \ bitwise shifting\n\nBitwise shifts by negative numbers will now throw an ArithmeticError:\n\
    \n```\n  var_dump(1 >> -1);\n  // ArithmeticError: Bit shift by negative number\n\
    ```\n\n#### Left bitwise shifts\n\nLeft bitwise shifts by a number of bits beyond\
    \ the bit width of an integer will always result in 0:\n\n```\n  var_dump(1 <<\
