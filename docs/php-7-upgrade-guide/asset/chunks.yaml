    \ on failure. Previously some constructors returned `NULL` or an unusable object.\n\
    \n#### Reclassification of E_STRICT\n\nThe error level of some `E_STRICT` notices\
    \ has been changed.\n\n### Other language changes\n\n#### Static calls to non-static\
    \ methods\n\nRemoved support for static calls to non-static methods from an incompatible\
    \ `$this` context. In this case `$this` will not be defined, but the call will\
    \ be allowed with a deprecation notice. An example:\n\n```php\n  class A {\n \
