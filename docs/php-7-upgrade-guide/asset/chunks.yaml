    \    }\n}\n\n/*\nint(4)\nint(7)\nint(5)\nint(1)\nint(8)\nint(3) // 第一个随机数“流”在这里停止\n\
    int(5)\nint(9)\nint(3) // 第二个在这里停止\n*/\n```\n\n### 异常 (Exceptions)\n\n抛出的异常将像往一样向上抛：\n\
    \n```php\nfunction a() {\n    yield 1;\n    yield 2;\n\n    throw new Exception('oh\
