    \n## Chapter 3: Combined Comparison (Spaceship) Operator\n\nPHP 7 introduces a\
    \ new three-way comparison operator `<=>` (`T_SPACESHIP`) which takes two expressions:\
    \ `(expr) <=> (expr)`. It compares both sides of the expression and, depending\
    \ on the result, returns one of three values:\n\n| 0 || If both expressions are\
    \ equal |\n\n| --- | --- |\n\n| 1 || If the left is greater |\n\n| \\-1 || If\
    \ the right is greater |\n\nYou may be familiar with this if you’ve worked with\
    \ existing comparison functions like `strcmp` before.\n\nIt has the same precedence\
    \ as the equality operator (`==`, `===`, `!=`, `!==`) and behaves identically\
    \ to the [existing comparison operators](http://php.net/manual/en/language.operators.comparison.php)\
    \ (`<`, `<=`, `==`, `>=`, `>`).\n\n### Comparing Values\n\nYou can compare everything\
    \ from scalar values (like `int`s and `float`s) to arrays and even objects too.\
    \ Here are some examples from the [relevant RFC](https://wiki.php.net/rfc/combined-comparison-operator):\n\
    \nPHP RFC examples (licensed under CC BY 3.0) \n\n```\n// Integers\necho 1 <=>\
    \ 1; // 0\necho 1 <=> 2; // -1\necho 2 <=> 1; // 1\n\n// Floats\necho 1.5 <=>\
    \ 1.5; // 0\necho 1.5 <=> 2.5; // -1\necho 2.5 <=> 1.5; // 1\n\n// Strings\necho\
    \ \"a\" <=> \"a\"; // 0\necho \"a\" <=> \"b\"; // -1\necho \"b\" <=> \"a\"; //\
    \ 1\n\necho \"a\" <=> \"aa\"; // -1\necho \"zz\" <=> \"aa\"; // 1\n\n// Arrays\n\
    echo [] <=> []; // 0\necho [1, 2, 3] <=> [1, 2, 3]; // 0\necho [1, 2, 3] <=> [];\
    \ // 1\necho [1, 2, 3] <=> [1, 2, 1]; // 1\necho [1, 2, 3] <=> [1, 2, 4]; // -1\n\
    \n// Objects\n$a = (object) [\"a\" => \"b\"];\n$b = (object) [\"a\" => \"b\"];\n\
    echo $a <=> $b; // 0\n\n$a = (object) [\"a\" => \"b\"];\n$b = (object) [\"a\"\
    \ => \"c\"];\necho $a <=> $b; // -1\n\n$a = (object) [\"a\" => \"c\"];\n$b = (object)\
    \ [\"a\" => \"b\"];\necho $a <=> $b; // 1\n\n// only values are compared\n$a =\
    \ (object) [\"a\" => \"b\"];\n$b = (object) [\"b\" => \"b\"];\necho $a <=> $b;\
    \ // 0\n```\n\n### Sorting\n\nPerhaps the best application of this operator is\
    \ to simplify sorting, as functions like `usort` expect you to perform a comparison\
    \ and return `-1`, `0`, or `1` accordingly:\n\nThis simplification is especially\
    \ apparent when comparing objects by some property value:\n\n```\nclass Spaceship\
    \ {\n    public $name;\n    public $maxSpeed;\n\n    public function __construct($name,\
    \ $maxSpeed) {\n        $this->name = $name;\n        $this->maxSpeed = $maxSpeed;\n\
    \    }\n}\n\n$spaceships = [\n    new Spaceship('Rebel Transport', 20),\n    new\
    \ Spaceship('Millenium Falcon', 80),\n    new Spaceship('X-Wing Starfighter',\
    \ 80),\n    new Spaceship('TIE Bomber', 60),\n    new Spaceship('TIE Fighter',\
    \ 100),\n    new Spaceship('Imperial Star Destroyer', 60),\n];\n\n// Sort the\
    \ spaceships by name (in ascending order)\nusort($spaceships, function ($ship1,\
    \ $ship2) {\n    return $ship1->name <=> $ship2->name;\n});\n\necho $spaceships[0]->name;\
    \ // \"Imperial Star Destroyer\"\n\n// Sort the spaceships by speed (in descending\
    \ order)\n// Notice how we switch the position of $ship1 and $ship2\nusort($spaceships,\
    \ function ($ship1, $ship2) {\n    return $ship2->maxSpeed <=> $ship1->maxSpeed;\n\
    });\n\necho $spaceships[0]->name; // \"TIE Fighter\"\n```\n\nWithout the comparison\
    \ operator, these functions would be much more complex:\n\n```\nusort($spaceships,\
    \ function ($ship1, $ship2) {\n    if ($ship1->maxSpeed == $ship2->maxSpeed) {\n\
    \        return 0;\n    } elseif ($ship1->maxSpeed < $ship2->maxSpeed) {\n   \
    \     return 1;\n    } else {\n        return -1;\n    }\n});\n```\n\n### Sorting\
    \ by multiple values\n\nYou can take advantage of the array comparison behavior\
    \ to easily sort by multiple fields:\n\n```\n// Sort by speed (asc), then by name\
    \ (asc)\nusort($spaceships, function ($ship1, $ship2) {\n    return [$ship1->maxSpeed,\
    \ $ship1->name] <=> [$ship2->maxSpeed, $ship2->name];\n});\n\nforeach ($spaceships\
    \ as $ship) {\n    printf(\"%3d is the max speed of a(n) %s\\n\", $ship->maxSpeed,\
    \ $ship->name);\n}\n\n// Outputs:\n//  20 is the max speed of a(n) Rebel Transport\n\
    //  60 is the max speed of a(n) Imperial Star Destroyer\n//  60 is the max speed\
    \ of a(n) TIE Bomber\n//  80 is the max speed of a(n) Millenium Falcon\n//  80\
    \ is the max speed of a(n) X-Wing Starfighter\n// 100 is the max speed of a(n)\
    \ TIE Fighter\n```\n\n### Further Reading\n\n*   [RFC: Combined Comparison (Spaceship)\
    \ Operator](https://wiki.php.net/rfc/combined-comparison-operator)\n\n*   [PHP\
    \ Manual: Comparison Operators](https://secure.php.net/manual/en/language.operators.comparison.php)\n\
    \n## Chapter 4: Null Coalesce Operator\n\nDealing with `null` objects can be annoying\
    \ (just ask any Java developer). The new “null coalesce operator” (`??`) makes\
    \ life easier by combining ternary operator functionality (`?:`) with `isset`\
    \ checks:\n\n```\n$sortBy = $_GET['sort'] ?? 'date';\n```\n\nIt takes two expressions,\
    \ returning the left one if it’s not `null`, or the right one otherwise. This\
    \ makes it easy to provide an alternative value instead of a `null`.\n\nThis is\
    \ particularly useful when dealing with array keys which may not exist. If you\
    \ tried using `?:` for this purpose, you’d get an `E_NOTICE` if the `sort` key\
    \ wasn’t present:\n\n```\n$sortBy = $_GET['sort'] ?: 'date'; // E_NOTICE\n```\n\
    \nWe’d need to add an extra check to avoid this problem, but the code becomes\
    \ too verbose:\n\n```\n// This is too verbose\nif (isset($_GET['sort'])) {\n \
    \   $sortBy = $_GET['sort'];\n} else {\n    $sortBy = 'desc';\n}\n\n// This isn't\
    \ much better\n$sortBy = isset($_GET['sort']) ? $_GET['sort'] : 'date';\n```\n\
    \nOr, with the null coalesce operator, we simply do this:\n\n```\n// Super easy!\n\
    $sortBy = $_GET['sort'] ?? 'date';\n```\n\n### Differences From `?:`\n\nYou may\
    \ be thinking that this is awfully similar to the short ternary operator (‘?:’)\
    \ and you’d be right, but two important distinctions:\n\n*   `??` checks if the\
    \ left-side expression exists (as seen above).\n\n*   `??` will return the left\
    \ side for `false` values, whereas `?:` would return the right side. For example:\n\
    \n```\nvar_dump(false ?: 'foo');\n// Displays: string(3) \"foo\"\n\nvar_dump(false\
    \ ?? 'foo');\n// Displays: bool(false)\n```\n\n### Chaining\n\nYou can even chain\
    \ several operators together if you want to. This is useful in situations where\
    \ you’d like to return the first available value of several array keys:\n\n```\n\
    $user = json_decode('{\"username\": \"jsmith\", \"firstName\": \"John\", \"lastName\"\
    : \"Sm\\\nith\" }', true);\n\n// Display the user's nickname, falling-back to\
    \ their firstName or username if n\\\none exists.\nprintf('Welcome back %s!',\
    \ $user['nickname'] ?? $user['firstName'] ?? $user['use\\\nrname']);\n\n// Displays\
    \ \"Welcome back John!\"\n```\n\n### Further Reading\n\n*   [RFC: Null Coalesce\
    \ Operator](https://wiki.php.net/rfc/isset_ternary)\n\n## Chapter 5: Unicode Codepoint\
    \ Escape Syntax\n\nPHP’s lack of native Unicode support can make things difficult\
    \ when coding for the web. While libraries like `iconv` and `mbstring` have simplified\
    \ working with strings, there were no simple mechanisms available to create Unicode\
    \ characters or strings without converting them from an HTML or JSON representation:\n\
    \nWorkaround examples \n\n```\n$char = html_entity_decode('&#x2603', 0, 'UTF-8');\n\
    $char = mb_convert_encoding('&#x2603', 'UTF-8', 'HTML-ENTITIES');\n$char = json_decode('\"\
    \\\\u2603\"');\n```\n\nPHP 7 finally introduces native support for Unicode character\
    \ escape sequences within strings, just like you’d see in Ruby or ECMAScript 6:\n\
    \n```\n$char = \"\\u{2603}\";\n```\n\nThis makes it much easier (and quicker)\
    \ to embed Unicode characters, especially ones that aren’t easily typed. These\
    \ can be used in strings alongside other characters too. For example, here’s the\
    \ `U+202E RIGHT-TO-LEFT OVERRIDE` character being used to display the string in\
    \ reverse:\n\n```\necho \"\\u{202E}This is backwards\"; // displays: sdrawkcab\
    \ si sihT\n```\n\nYou can omit leading `0`s if you’d like:\n\n```\necho \"\\u{58}\"\
    ; // \"X\"\necho \"\\u{0058}\"; // \"X\"\n```\n\n### Why the `{}`s?\n\nSome other\
    \ languages (C/C++/Java) use a format without the `{}` characters: `\\uXXXX`.\
    \ Unfortunately this limits their use to the Basic Multilingual Plane (`U+0000`\
    \ to `U+FFFF`). However, Unicode supports other characters beyond 16 bits."
  fmt: "\n*   [RFC: Return Type Declarations](https://wiki.php.net/rfc/return_types)\n\
    \n# Chapter 3: Combined Comparison (Spaceship) Operator\n\nPHP 7 introduces a\
    \ new three-way comparison operator `<=>` (`T_SPACESHIP`) which takes two expressions:\
    \ `(expr) <=> (expr)`. It compares both sides of the expression and, depending\
    \ on the result, returns one of three values:\n\n| 0 || If both expressions are\
    \ equal |\n| --- | --- |\n| 1 || If the left is greater |\n| -1 | If the right\
    \ is greater |\n\nYou may be familiar with this if you’ve worked with existing\
    \ comparison functions like `strcmp` before.\n\nIt has the same precedence as\
    \ the equality operator (`==`, `===`, `!=`, `!==`) and behaves identically to\
    \ the [existing comparison operators](http://php.net/manual/en/language.operators.comparison.php)\
    \ (`<`, `<=`, `==`, `>=`, `>`).\n\n## Comparing Values\n\nYou can compare everything\
    \ from scalar values (like `int`s and `float`s) to arrays and even objects too.\
    \ Here are some examples from the [relevant RFC](https://wiki.php.net/rfc/combined-comparison-operator):\n\
    \nPHP RFC examples (licensed under CC BY 3.0)\n\n```\n// Integers\necho 1 <=>\
    \ 1; // 0\necho 1 <=> 2; // -1\necho 2 <=> 1; // 1\n\n// Floats\necho 1.5 <=>\
    \ 1.5; // 0\necho 1.5 <=> 2.5; // -1\necho 2.5 <=> 1.5; // 1\n\n// Strings\necho\
    \ \"a\" <=> \"a\"; // 0\necho \"a\" <=> \"b\"; // -1\necho \"b\" <=> \"a\"; //\
    \ 1\n\necho \"a\" <=> \"aa\"; // -1\necho \"zz\" <=> \"aa\"; // 1\n\n// Arrays\n\
    echo [] <=> []; // 0\necho [1, 2, 3] <=> [1, 2, 3]; // 0\necho [1, 2, 3] <=> [];\
    \ // 1\necho [1, 2, 3] <=> [1, 2, 1]; // 1\necho [1, 2, 3] <=> [1, 2, 4]; // -1\n\
    \n// Objects\n$a = (object) [\"a\" => \"b\"];\n$b = (object) [\"a\" => \"b\"];\n\
    echo $a <=> $b; // 0\n\n$a = (object) [\"a\" => \"b\"];\n$b = (object) [\"a\"\
    \ => \"c\"];\necho $a <=> $b; // -1\n\n$a = (object) [\"a\" => \"c\"];\n$b = (object)\
    \ [\"a\" => \"b\"];\necho $a <=> $b; // 1\n\n// only values are compared\n$a =\
    \ (object) [\"a\" => \"b\"];\n$b = (object) [\"b\" => \"b\"];\necho $a <=> $b;\
    \ // 0\n```\n\n## Sorting\n\nPerhaps the best application of this operator is\
    \ to simplify sorting, as functions like `usort` expect you to perform a comparison\
    \ and return `-1`, `0`, or `1` accordingly:\n\nThis simplification is especially\
    \ apparent when comparing objects by some property value:\n\n```\nclass Spaceship\
    \ {\n    public $name;\n    public $maxSpeed;\n\n    public function __construct($name,\
    \ $maxSpeed) {\n        $this->name = $name;\n        $this->maxSpeed = $maxSpeed;\n\
    \    }\n}\n\n$spaceships = [\n    new Spaceship('Rebel Transport', 20),\n    new\
    \ Spaceship('Millenium Falcon', 80),\n    new Spaceship('X-Wing Starfighter',\
    \ 80),\n    new Spaceship('TIE Bomber', 60),\n    new Spaceship('TIE Fighter',\
    \ 100),\n    new Spaceship('Imperial Star Destroyer', 60),\n];\n\n// Sort the\
    \ spaceships by name (in ascending order)\nusort($spaceships, function ($ship1,\
    \ $ship2) {\n    return $ship1->name <=> $ship2->name;\n});\n\necho $spaceships[0]->name;\
    \ // \"Imperial Star Destroyer\"\n\n// Sort the spaceships by speed (in descending\
    \ order)\n// Notice how we switch the position of $ship1 and $ship2\nusort($spaceships,\
    \ function ($ship1, $ship2) {\n    return $ship2->maxSpeed <=> $ship1->maxSpeed;\n\
    });\n\necho $spaceships[0]->name; // \"TIE Fighter\"\n```\n\nWithout the comparison\
    \ operator, these functions would be much more complex:\n\n```\nusort($spaceships,\
    \ function ($ship1, $ship2) {\n    if ($ship1->maxSpeed == $ship2->maxSpeed) {\n\
    \        return 0;\n    } elseif ($ship1->maxSpeed < $ship2->maxSpeed) {\n   \
    \     return 1;\n    } else {\n        return -1;\n    }\n});\n```\n\n## Sorting\
    \ by multiple values\n\nYou can take advantage of the array comparison behavior\
    \ to easily sort by multiple fields:\n\n```\n// Sort by speed (asc), then by name\
    \ (asc)\nusort($spaceships, function ($ship1, $ship2) {\n    return [$ship1->maxSpeed,\
    \ $ship1->name] <=> [$ship2->maxSpeed, $ship2->name];\n});\n```\n\n*(Note: The\
    \ provided text seemed to contain repetitive/garbled sections at the end which\
    \ appear to be artifacts of a copy-paste error. I have processed the core technical\
    \ content provided in the initial sections.)*\n"
  trans: "\n\n*   [RFC: 返回类型声明](https://wiki.php.net/rfc/return_types)\n\n# 第 3 章：组合（飞船）运算符\n\
    \nPHP 7 引入了一个新的三元比较运算符 `<=>`（`T_SPACESHIP`），它接受两个表达式：`(expr) <=> (expr)`。它比较表达式的两边，并根据结果返回三个值之一：\n\
    \n| 0 | 如果两个表达式相等 |\n| --- | --- |\n| 1 | 如果左侧大于右侧 |\n| -1 | 如果右侧大于 |\n\n如果你以前用过\
    \ `strcmp` 等现有的比较函数，你可能对它很熟悉。\n\n它的优先级与相等运算符（`==`, `===`, `!=`, `!==`）相同，且行为与[现有的比较运算符](http://php.net/manual/en/language.operators.comparison.php）（`<`,\
    \ `<=`, `==`, `>=`, `>`）完全一致。\n\n## 比较值\n\n你可以比较从标量值（如 `int` 和 `float`）到数组甚至对象在内的所有内容。以下是来自[相关\
    \ RFC](https://wiki.php.net/rfc/combined-comparison-operator)的示例：\n\nPHP RFC 示例（采用\
    \ CC BY 3.0 许可）\n\n```\n// Integers\necho 1 <=> 1; // 0\necho 1 <=> 2; // -1\n\
    echo 2 <=> 1; // 1\n\n// Floats\necho 1.5 <=> 1.5; // 0\necho 1.5 <=> 2.5; //\
    \ -1\necho 2.5 <=> 1.5; // 1\n\n// Strings\necho \"a\" <=> \"a\"; // 0\necho \"\
    a\" <=> \"b\"; // -1\necho \"b\" <=> \"a\"; // 1\n\necho \"a\" <=> \"aa\"; //\
    \ -1\necho \"zz\" <=> \"aa\"; // 1\n\n// Arrays\necho [] <=> []; // 0\necho [1,\
    \ 2, 3] <=> [1, 2, 3]; // 0\necho [1, 2, 3] <=> []; // 1\necho [1, 2, 3] <=> [1,\
    \ 2, 1]; // 1\necho [1, 2, 3] <=> [1, 2, 4]; // -1\n\n// Objects\n$a = (object)\
    \ [\"a\" => \"b\"];\n$b = (object) [\"a\" => \"b\"];\necho $a <=> $b; // 0\n\n\
    $a = (object) [\"a\" => \"b\"];\n$b = (object) [\"a\" => \"c\"];\necho $a <=>\
    \ $b; // -1\n\n$a = (object) [\"a\" => \"c\"];\n$b = (object) [\"a\" => \"b\"\
    ];\necho $a <=> $b; // 1\n\n// only values are compared\n$a = (object) [\"a\"\
    \ => \"b\"];\n$b = (object) [\"b\" => \"b\"];\necho $a <=> $b; // 0\n```\n\n##\
    \ 排序\n\n该运算符最好的用途可能是为了简化排序，因为像 `usort` 这样的函数要求你执行比较并相应地返回 `-1`、`0` 或 `1`：\n\n\
    当通过某个属性值来比较对象时，这种简化尤为明显：\n\n```\nclass Spaceship {\n    public $name;\n    public\
    \ $maxSpeed;\n\n    public function __construct($name, $maxSpeed) {\n        $this->name\
    \ = $name;\n        $this->maxSpeed = $maxSpeed;\n    }\n}\n\n$spaceships = [\n\
    \    new Spaceship('Rebel Transport', 20),\n    new Spaceship('Millenium Falcon',\
    \ 80),\n    new Spaceship('X-Wing Starfighter', 80),\n    new Spaceship('TIE Bomber',\
    \ 60),\n    new Spaceship('TIE Fighter', 100),\n    new Spaceship('Imperial Star\
    \ Destroyer', 60),\n];\n\n// 按名称升序排序 spaceship\nusort($spaceships, function ($ship1,\
    \ $ship2) {\n    return $ship1->name <=> $ship2->name;\n});\n\necho $spaceships[0]->name;\
    \ // \"Imperial Star Destroyer\"\n\n// 按速度降序排序 spaceship\n// 注意我们交换了 $ship1 和\
    \ $ship2 的位置\nusort($spaceships, function ($ship1, $ship2) {\n    return $ship2->maxSpeed\
    \ <=> $ship1->maxSpeed;\n});\n\necho $spaceships[0]->name; // \"TIE Fighter\"\n\
    ```\n\n如果没有比较运算符，这些函数将会变得复杂得多：\n\n```\nusort($spaceships, function ($ship1, $ship2)\
    \ {\n    if ($ship1->maxSpeed == $ship2->maxSpeed) {\n        return 0;\n    }\
    \ elseif ($ship1->maxSpeed < $ship2->maxSpeed) {\n        return 1;\n    } else\
    \ {\n        return -1;\n    }\n});\n```\n\n## 多值排序\n\n你可以利用数组比较的行为来轻松地按多个字段排序：\n\
    \n```\n// 按速度升序排序，然后按名称升序排序\nusort($spaceships, function ($ship1, $ship2) {\n\
    \    return [$ship1->maxSpeed, $ship1->name] <=> [$ship2->maxSpeed, $ship2->name];\n\
    });\n```\n\n"
