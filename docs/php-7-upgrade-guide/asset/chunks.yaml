    \n## Chapter 24: Integer Semantics\n\nCertain integer behavior has been revised\
    \ for cross-platform consistency, making it more intuitive for developers.\n\n\
    ### Casting NaN and Infinity\n\nCasting NaN (`NAN`) and Infinity (`INF`) to an\
    \ integer will always result in a `0` value. Previously, the resulting values\
    \ would be undefined and vary between different platforms.\n\n### Negative bitwise\
    \ shifting\n\nYou’re no longer allowed to bitwise shift by a negative number of\
    \ bits. Attempting to do so will result in an `ArithmeticError` being thrown.\n\
    \n### Bitwise shifting too far\n\nEven though some CPUs support proper wrapping\
    \ behavior, not all of them do, which can result in certain edge cases. PHP 7\
    \ therefore standardizes this behavior for cross-platform consistency.\n\nLeft\
    \ bitwise shifts beyond the bit-width of an integer will always result in `0`,\
    \ even if the platform supports wrapping around.\n\nRight bitwise shifts beyond\
    \ the bit-width of an integer will always result in `0` or `-1` (depending on\
    \ the sign), even if the platform supports wrapping around.\n\n### Backwards Compatibility\n\
    \nRelying on the old PHP 5.x behavior in these specific cases will no longer work.\n\
    \n### Further Reading\n\n*   [RFC: Integer Semantics](https://wiki.php.net/rfc/integer_semantics)\n\
    \n*   [PHP manual: Bitwise Operators](https://secure.php.net/manual/en/language.operators.bitwise.php)\n\
    \n## Chapter 25: Division By Zero Semantics\n\nPrior to PHP 7, dividing by `0`\
    \ would emit an `E_WARNING` and return `false`. Returning a boolean value for\
    \ an arithmetic operation doesn’t make much sense, so PHP 7 will now return one\
    \ of the following float values in addition to emitting the `E_WARNING`:\n\n*\
    \   `+INF`\n\n*   `-INF`\n\n*   `NAN`\n\nFor example:\n\n```\nvar_dump(42/0);\
    \  // float(INF)  + E_WARNING\nvar_dump(-42/0); // float(-INF) + E_WARNING\nvar_dump(0/0);\
    \   // float(NAN)  + E_WARNING\n```\n\nWhen using the modulus operator (`%`),\
    \ PHP 7 will instead throw a `DivisionByZeroError`:\n\n```\nvar_dump(0%0); //\
    \ DivisionByZeroError\n```\n\nThe `intdiv()` function will throw an `ArithmeticError`\
    \ whenever you provide a valid integer argument which would result in an incorrect\
    \ result due to integer overflow:\n\n```\nvar_dump(intdiv(PHP_INT_MIN, -1)); //\
    \ ArithmeticError\n```\n\n### Backwards Compatibility\n\n*   The division operator\
    \ will no longer return `false` when dividing by zero.\n\n*   The modulus operator\
    \ will throw an error (instead of returning `false`) when dividing by zero.\n\n\
    ### Further Reading\n\n*   [PHP manual: DivisionByZeroError](https://secure.php.net/manual/en/class.divisionbyzeroerror.php)\n\
    \n*   [PHP manual: ArithmeticError](https://secure.php.net/manual/en/class.arithmeticerror.php)\n\
    \n## Chapter 26: JSON Library\n\nThe current json extension used by PHP 5 does\
    \ not have a free license, which is a problem for some Linux distributions. Debian\
    \ previously handled this by providing a separate `php5-json` extension outside\
    \ of the main PHP codebase. In addition to licensing concerns, the old library\
    \ had several other issues:\n\n*   Code was outdated\n\n*   There was no active\
    \ maintainer\n\n*   The implementation suffered from several performance issues\n\
    \nPHP 7 solved these issues by replacing the current json extension with new code\
    \ based on the PECL jsond extension. The userland API is identical, but the licensing\
    \ is better and it also offers better performance in some cases.\n\n### Fractional\
    \ float values\n\nThe new JSOND library introduces a new option to `json_encode`\
    \ to preserve the fractional part of float values:\n\n```\necho json_encode(10.0);\
    \ // Output: 10\necho json_encode(10.1); // Output: 10.1\n\necho json_encode(10.0,\
    \ JSON_PRESERVE_ZERO_FRACTION); // Output: 10.0\necho json_encode(10.1, JSON_PRESERVE_ZERO_FRACTION);\
    \ // Output: 10.1\n```\n\nBeing able to toggle this behavior is useful when working\
    \ with other languages. For example, both Go and JavaScript will encode `10.0`\
    \ as `10`, whereas Python, C, and Ruby would encode it to `10.0`.\n\n### Backwards\
    \ Compatibility\n\nThe old extension handled certain number formats which weren’t\
    \ exactly valid according to the JSON spec (RFC 7159). The new JSOND extension\
    \ therefore rejects certain number formats which previously worked in PHP 5.x:\n\
    \n*   Numbers cannot end with a decimal point.\n\n*   The `e` exponent cannot\
    \ immediately proceed a decimal point.\n\nThese JSON strings are therefore no\
    \ longer valid:\n\n```\n'42.'\n'42.e1'\n```\n\nYou should remove the decimal points\
    \ or add a `0` immediately afterwards to allow successful JSON parsing:\n\n```\n\
    '42' or '42.0'\n'42e1' or '42.0e1'\n```\n\n### Further Reading\n\n*   [RFC: Replacing\
    \ current json extension with jsond](https://wiki.php.net/rfc/jsond)\n\n*   [RFC:\
    \ Preserve Fractional Part in JSON encode](https://wiki.php.net/rfc/json_preserve_fractional_part)\n\
    \n*   [PHP manual: json\\_decode](https://secure.php.net/manual/en/function.json-decode.php)\n\
    \n*   [PHP bug #63520](https://bugs.php.net/bug.php?id=63520)\n\n*   [IETF RFC\
    \ 7159: JSON Data Interchange Format](https://tools.ietf.org/html/rfc7159)\n\n\
    ## Chapter 27: Behavior Changes to `foreach`\n\nPHP’s `foreach` statement had\
    \ some quirky, undefined behavior. These edge cases were caused by low-level implementation\
    \ details and were never truly supported. In an effort to provide consistent,\
    \ documented behavior, several of these edge cases were corrected.\n\nThe majority\
    \ of these edge cases deal with manipulating the internal pointer or modifying\
    \ elements of an array. The conceptual behavior of `foreach` itself remains unchanged.\n\
    \nFor example, look at these two very similar examples from the RFC:\n\nExample\
    \ 1 \n\n```\n$a = [1,2,3];\nforeach($a as $v) {\n    echo $v . \" - \" . current($a)\
    \ . \"\\n\";\n}\n```\n\nExample 1: Output \n\n```\n1 - 2\n2 - 2\n3 - 2\n```\n\n\
    However, if you make one small modification before the loop, you get a different\
    \ result:\n\nExample 2 \n\n```\n$a = [1,2,3];\n$b = $a;\nforeach($a as $v) {\n\
    \    echo $v . \" - \" . current($a) . \"\\n\";\n}\n```\n\nExample 2: Output \n\
    \n```\n1 - 1\n2 - 1\n3 - 1\n```\n\n### Changes\n\nHere are some examples demonstrating\
    \ the new semantics in PHP 7\n\n#### Iterating arrays by value\n\nIgnoring modifications\
    \ to the original array \n\n```\n$a = [1,2,3];\n$b = &$a;\n\nforeach($a as $v)\
    \ {\n    unset($a[1]);\n    echo $v . \" - \" . current($a) . \"\\n\";\n}\n```\n\
    \nPHP 5.x Output \n\n```\n1 - 3\n3 - 2\n```\n\nPHP 7 Output \n\n```\n1 - 1\n2\
    \ - 1\n3 - 1\n```\n\n#### Iterating arrays by reference\n\nThe `current()` function\
    \ is no longer affected by the iteration of the array:\n\n```\n$a = [1,2,3];\n\
    \nforeach($a as &$v) {\n    echo $v . \" - \" . current($a) . \"\\n\";\n}\n```\n\
    \nPHP 5.x Output \n\n```\n1 - 2\n2 - 3\n3 -\n```\n\nPHP 7 Output \n\n```\n1 -\
    \ 1\n2 - 1\n3 - 1\n```\n\n#### Iterating objects by value\n\nIterating objects\
    \ by value behaves similarly to iterating arrays by reference, except that it\
    \ uses the object’s value instead of its reference. You can therefore modify the\
    \ object but not replace it within a `foreach` loop.\n\n#### Iterating objects\
    \ by reference\n\nThis behaves identically to iterating an array by reference.\n\
    \n#### Other functions"
