    \ this book.\n\n begin mainmatter  \n\n# Getting Started with PHP 7\n\nBuilds\
    \ for PHP 7.0 and 7.1 are now available from both official and community repositories.\
    \ In most cases, these new versions can be easily installed using your system’s\
    \ package manager.\n\n## Ubuntu 14.04 and 16.04+\n\n[Ondřej Surý](https://launchpad.net/~ondrej)\
    \ provides a [PPA for installing PHP 7.0 and 7.1](https://launchpad.net/~ondrej/+archive/ubuntu/php).\
    \ The latest release can be installed using these commands:\n\n```\nsudo add-apt-repository\
    \ ppa:ondrej/php\nsudo apt-get update\nsudo apt-get install php7.0\n```\n\n(Replace\
    \ `7.0` with `7.1` if desired)\n\nThe full list of available packages can be found\
    \ here: [https://launchpad.net/~ondrej/+archive/ubuntu/php/+packages?field.name\\\
    _filter=php7.0](https://launchpad.net/~ondrej/+archive/ubuntu/php/+packages?field.name_filter=php7.0)\n\
    \n## Debian 8 & 9\n\n[Ondřej Surý also provides PHP 7.0 and 7.1 packages for Debian](https://packages.sury.org/php/)\
    \ which can be installed using these commands:\n\n```\nsudo apt-get install apt-transport-https\
    \ lsb-release ca-certificates\nsudo wget -O /etc/apt/trusted.gpg.d/php.gpg https://packages.sury.org/php/apt.gpg\n\
    sudo sh -c \"echo 'deb https://packages.sury.org/php/ $(lsb_release -sc) main'\"\
    \ >\\\n /etc/apt/sources.list.d/php.list\nsudo apt-get update\nsudo apt-get install\
    \ php7.0\n```\n\n## Debian 6 & 7\n\nPHP 7.0 can be installed using the [Dotdeb\
    \ repository](https://www.dotdeb.org/):\n\nAdd these two lines to your `/etc/apt/sources.list`\
    \ file, replacing `<distribution>` with either `squeeze`, `wheezy`, or `jessie`:\n\
    \n```\ndeb http://packages.dotdeb.org <distribution> all\ndeb-src http://packages.dotdeb.org\
