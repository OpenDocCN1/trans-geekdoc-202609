    session ID existence, updates timestamp of session data. Compatibility of old
    user defined save handler is retained.

    *   `SessionUpdateTimestampHandlerInterface` is added. `validateSid()`, `updateTimestamp()`
    is defined in the interface.

    *   `session.lazy_write(default=On)` INI setting enables only write session data
    when session data is updated.


    ### Opcache

    *   Removed `opcache.load_comments` configuration directive. Now doc comments
    loading costs nothing and always enabled.


    ### OpenSSL

    *   Removed the “rsa_key_size” SSL context option in favor of automatically setting
    the appropriate size given the negotiated crypto algorithm.

    *   Removed “CN_match” and “SNI_server_name” SSL context options. Use automatic
    detection or the “peer_name” option instead.


    ### PCRE:

    *   Removed support for `/e` (PREG_REPLACE_EVAL) modifier. Use `preg_replace_callback()`
    instead.


    ### PDO_pgsql:

    *   Removed `PGSQL_ATTR_DISABLE_NATIVE_PREPARED_STATEMENT` attribute in favor
    of `ATTR_EMULATE_PREPARES`.


    ### Standard:

    *   Removed string category support in `setlocale()`. Use the `LC_*` constants
    instead.

    *   Removed `set_magic_quotes_runtime()` and its alias `magic_quotes_runtime()`.


    ### JSON:

    *   Rejected RFC 7159 incompatible number formats in `json_decode` string - top
    level (07, 0xff, .1, -.1) and all levels ([1.], [1.e1])

    *   Calling `json_decode` with 1st argument equal to empty PHP string or value
    that after casting to string is empty string (NULL, FALSE) results in JSON syntax
    error.


    ### Stream:

    *   Removed `set_socket_blocking()` in favor of its alias `stream_set_blocking()`.


    ### XSL:

    *   Removed `xsl.security_prefs` ini option. Use `XsltProcessor::setSecurityPrefs()`
    instead.

    '
  trans: '


    *   `call_user_method()` 和 `call_user_method_array()` 不再存在。

    *   `ob_start()` 如果在输出缓冲区处理程序中创建输出缓冲区，不再抛出 `E_ERROR`，而是抛出 `E_RECOVERABLE_ERROR`。

    *   改进了内部排序算法，这可能会导致比较相等的元素的排序顺序发生变化。

    *   在 `fpm-fcgi` 中移除了 `dl()` 函数。

    *   使用空 cookie 名称的 `setcookie()` 现在会抛出 `E_WARNING`，且不再发送空的 set-cookie 头部行。


    ## 其他更改


    ### Curl

    *   移除了对禁用 `CURLOPT_SAFE_UPLOAD` 选项的支持。所有的 curl 文件上传必须使用 `curl_file` / `CURLFile`
    API。


    ### Date

    *   从 `mktime()` 和 `gmmktime()` 中移除了 `$is_dst` 参数。


    ### DBA

    *   现在对于 `inifile` 处理器，如果未找到键，`dba_delete()` 也会返回 `false`。


    ### GMP

    *   现在需要 `libgmp` 版本 4.2 或更高。

    *   `gmp_setbit()` 和 `gmp_clrbit()` 现在对负索引返回 `FALSE`，使其与其他 GMP 函数保持一致。


    ### Intl

    *   移除了废弃的别名 `datefmt_set_timezone_id()` 和 `IntlDateFormatter::setTimeZoneID()`。请使用
    `datefmt_set_timezone()` 和 `IntlDateFormatter::setTimeZone()`。


    ### libxml

    *   增加了 `LIBXML_BIGLINES` 解析器选项。该选项从 `libxml` 2.9.0 开始可用，并在错误报告中支持大于 16 位的行号。


    ### Mcrypt

    *   移除了废弃的 `mcrypt_generic_end()` 别名，改用 `mcrypt_generic_deinit()`。

    *   移除了废弃的 `mcrypt_ecb()`、`mcrypt_cbc()`、`mcrypt_cfb()` 和 `mcrypt_ofb()` 函数，改用带有
    `MCRYPT_MODE_*` 标志的 `mcrypt_encrypt()` 和 `mcrypt_decrypt()`。


    ### Session

    *   `session_start()` 接受数组形式的所有 INI 设置。例如 `[''cache_limiter''=>''private'']` 会设置
    `session.cache_limiter=private`。它还支持 `read_and_close`，在读取数据后立即关闭会话数据。

    *   保存处理器接受 `validate_sid()` 和 `update_timestamp()`，后者用于验证会话 ID 是否以及更新会话数据的时间戳。保留了旧用户自定义保存处理器的兼容性。

    *   增加了 `SessionUpdateTimestampHandlerInterface`。接口中定义了 `validateSid()` 和 `updateTimestamp()`。

    *   `session.lazy_write(default=On)` INI 设置仅在会话数据被更新时才写入会话数据。


    ### Opcache

    *   移除了 `opcache.load_comments` 配置指令。现在加载文档注释不再消耗开销，且始终启用。


    ### OpenSSL

    *   移除了“rsa_key_size” SSL 上文选项，改用根据协商的加密算法自动设置合适的尺寸。

    *   移除了 “CN_match” 和 “SNI_server_name” SSL 上文选项。请改用自动检测或 “peer_name” 。


    ### PCRE:

    *   移除了对 `/e` (PREG_REPLACE_EVAL) 修饰符的支持。请使用 `preg_replace_callback()`。


    ### PDO_pgsql:

    *   移除了 `PGSQL_ATTR_DISABLE_NATIVE_PREPARED_STATEMENT` 属性，改用 `ATTR_EMULATE_PREPARES`。


    ### Standard:

    *   在 `setlocale()` 中移除了字符串分类支持。请使用 `LC_*` 常量。

    *   移除了 `set_magic_quotes_runtime()` 及其别名 `magic_quotes_runtime()`。


    ### JSON:

    *   拒绝 `json_decode` 字符串中与 RFC 7159 不兼容的数字格式——顶层 (07, 0xff, .1, -.1) 以及所有层 ([1.],
    [1.e1])。

    *   调用 `json_decode` 时第一个参数为空字符串或转换为字符串后为空字符串的值（NULL, FALSE）将导致 JSON 语法错误。


    ### Stream:

    *   移除了 `set_socket_blocking()`，改用其别名 `stream_set_blocking()`。


    ### XSL:

    *   移除了 `xsl.security_prefs`  ini 选项。请使用 `XsltProcessor::setSecurityPrefs()`。


