- raw: "PHP 7 therefore deprecates this `salt` option. It’s strongly recommended that\
    \ you omit this and simply use the salt whatever cryptographically-secure salt\
    \ PHP generates for you.\n\n### Further Reading\n\n*   [PHP Manual: `password_hash`](http://us2.php.net/manual/en/function.password-hash.php)\n\
    \n## Chapter 34: Removal of Previously-Deprecated Features\n\nPHP 7 removes **ALL**\
    \ features that were deprecated in prior versions.\n\n### Removed Extensions\n\
    \n| Extension Name || Deprecated Since || Alternative |\n\n| --- | --- | --- |\n\
    \n| `ext/mysql` || PHP 5.3 || `ext/mysqli` or `ext/pdo_mysql` |\n\n| --- | ---\
    \ | --- |\n\n| `ext/ereg` || PHP 5.3 || `ext/pcre` |\n\n### Removed Language Features\n\
    \n| Feature Description || Deprecated Since || Alternative |\n\n| --- | --- |\
    \ --- |\n\n| Assignment of `new` by reference || PHP 5.3 || Use normal assignment\
    \ instead |\n\n| --- | --- | --- |\n\n| Scoped calls of non-static methods from\
    \ incompatible `$this` context || PHP 5.6 ||   |\n\n### Removed Functions\n\n\
    | Function Name || Deprecated Since || Alternative(s) |\n\n| --- | --- | --- |\n\
    \n| `dl` on fpm-fcgi || PHP 5.3 ||   |\n\n| --- | --- | --- |\n\n| `set_magic_quotes_runtime`\
    \ || PHP 5.4 ||   |\n\n| `magic_quotes_runtime` || PHP 5.4 ||   |\n\n| `set_socket_blocking`\
    \ || PHP 5.4 || `stream_set_blocking` |\n\n| `mcrypt_generic_end` || PHP 5.4 ||\
    \ `mcrypt_generic_deinit` |\n\n| `mcrypt_ecb`, `mcrypt_cbc`, `mcrypt_cfb` and\
    \ `mcrypt_ofb` || PHP 5.5 || `mcrypt_encrypt` and `mcrypt_decrypt` |\n\n| `datefmt_set_timezone_id`\
    \ || PHP 5.5 || `datefmt_set_timezone` |\n\n| `IntlDateFormatter::setTimeZoneID`\
    \ || PHP 5.5 || `IntlDateFormatter::setTimeZone` |\n\n### Removed INI Options\n\
    \n| INI Options || Deprecated Since || Alternative |\n\n| --- | --- | --- |\n\n\
    | `xsl.security_prefs` || PHP 5.4 || `XsltProcessor::setSecurityPrefs` |\n\n|\
    \ --- | --- | --- |\n\n| `iconv.input_encoding` and `mbstring.http_input` || PHP\
    \ 5.6 || `php.input_encoding` |\n\n| `iconv.internal_encoding` and `mbstring.internal_encoding`\
    \ || PHP 5.6 || `php.internal_encoding` |\n\n| `iconv.output_encoding` and `mbstring.http_output`\
    \ || PHP 5.6 || `php.output_encoding` |\n\n### Miscellaneous Removed Functionality\n\
    \n| Functionality || Deprecated Since || Alternative |\n\n| --- | --- | --- |\n\
    \n| The ``$is_dst` parameter of `mktime()`` and `gmmktime()` || PHP 5.1 ||   |\n\
    \n| --- | --- | --- |\n\n| `#`-style comments in `ini` files || PHP 5.3 || `;`-style\
    \ comments |\n\n| String category names in `setlocale()` || PHP 5.3 || `LC_*``\
    \ constants |\n\n| Unsafe curl file uploads || PHP 5.5 || `CurlFile` |\n\n| `preg_replace()`\
