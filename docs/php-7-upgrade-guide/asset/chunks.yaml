- raw: "Because the state of a `foreach` loop is now independent from the internal\
    \ state of an array/object pointer, built-in functions which use that internal\
    \ pointer (`reset`/`key`/`current`/`next`/`prev`) will no longer represent the\
    \ state of the loop.\n\n### Backwards Compatibility\n\nAny code relying on the\
    \ old, undocumented behavior will no longer work in PHP 7.\n\n### Further Reading\n\
    \n*   [RFC: Fix “foreach” behavior](https://wiki.php.net/rfc/php7_foreach)\n\n\
    ## Chapter 28: Behavior Changes to `list`\n\n### String Handling\n\nThe PHP documentation\
    \ has always stated that the `list()` construct wouldn’t unpack strings. However,\
    \ in some cases, it actually would work:\n\nExample 1 \n\n```\nlist($a, $b) =\
    \ 'ab';\nvar_dump($a, $b);\n```\n\nExample 1: Output \n\n```\nNULL\nNULL\n```\n\
    \nExample 2 \n\n```\n$a[0] = 'ab';\nlist($a, $b) = $a[0];\nvar_dump($a, $b);\n\
    ```\n\nExample 2: Output \n\n```\nstring(1) \"a\"\nstring(1) \"b\"\n```\n\nThis\
    \ undocumented behavior was caused by an implementation “feature” and was not\
    \ intentional.\n\nThis string handling edge-case no longer works with PHP 7.\n\
    \n### Empty List Assignment\n\nUsing `list()` without any variables will now result\
    \ in a fatal error:\n\n```\n$a = [1, 2, 3];\n\nlist() = $a;   // Fatal error:\
    \ Cannot use empty list\nlist(,,) = $a; // Fatal error: Cannot use empty list\n\
    ```\n\n### Variable Assignment Order\n\nBecause of the new [Abstract Syntax Tree](#chap33.xhtml#chapter-16-ast),\
    \ values are assigned left-to-right, whereas PHP 5.x assigned them right-to-left.\n\
    \n### Backwards Compatibility\n\n*   `list()` no longer works with string values\
    \ in some cases; variables will always be set to `NULL` in these cases\n\n*  \
    \ Calling `list()` without any variables will trigger a fatal error\n\n*   Depending\
    \ on the old right-to-left assignment ordering will no longer work\n\n### Further\
    \ Reading\n\n*   [RFC: Fix list() behavior inconsistency](https://wiki.php.net/rfc/fix_list_behavior_inconsistency)\n\
    \n*   [RFC: Abstract Syntax Tree](https://wiki.php.net/rfc/abstract_syntax_tree#changes_to_list)\n\
    \n## Chapter 29: Parameter Handling Changes\n\n### Duplicate Parameter Names\n\
    \nPrevious versions of PHP allowed multiple function parameters to use the same\
    \ name. This functionality is no longer supported in PHP 7. Attempting to use\
    \ duplicate parameter names will now cause a fatal error.\n\n```\nfunction foo($a,\
    \ $a) {\n    return $a;\n}\n\necho foo(1, 2);\n```\n\nPHP 5 Output \n\n```\n2\n\
    ```\n\nPHP 7 Output \n\n```\nFatal error: Redefinition of parameter $a\n```\n\n\
    ### `func_get_arg()` and `func_get_args()`\n\nThe `func_get_arg()` and `func_get_args()`\
    \ functions used to return the original parameter values, even if those variables\
    \ changed during function execution. This behavior no longer occurs in PHP 7 -\
    \ both functions will instead provide the current value(s). For example, given\
    \ the following code:\n\n```\nfunction foo($a) {\n    $a++;\n    var_dump($a);\n\
    }\nfoo(1);\n```\n\nPHP 5.x would display the original value of `1`, whereas PHP\
    \ 7 will display `2`.\n\nThis behavioral change also applies to the display of\
    \ function arguments in backtraces.\n\n### Backwards Compatibility\n\nCode using\
    \ duplicate parameter names will now result in a fatal error. Simply removing\
    \ the previous instances will maintain full compatibility with PHP 5.x and 7.x.\n\
    \nCode relying on `func_get_arg()` and `func_get_args()` to return the original\
    \ (not current) value may not behave as expected.\n\n### Further Reading\n\n*\
    \   [RFC: phpng](https://wiki.php.net/phpng)\n\n## Chapter 30: Custom Session\
    \ Handler Return Values\n\nPHP allows you to implement your own session storage\
    \ and retrieval mechanisms via the `session_set_save_handler()` function. You\
    \ simply define some functions (or implement the `SessionHandlerInterface`) to\
    \ handle operations like loading and saving the session data.\n\nAccording to\
    \ the documentation, several of these functions (like `open()` and `close()`)\
    \ should return `true` on success or `false` on failure. However, these return\
    \ values never worked properly prior to PHP 7 due to a major bug with how PHP’s\
    \ internals handled your return value. Essentially, return values of `false` were\
    \ never interpreted as failures. Developers eventually figured out they could\
    \ return `-1` to indicate failure, but this contradicted the documentation.\n\n\
    PHP 7 resolves this bug so that both `true` and `false` return values are interpreted\
    \ properly. If you return any other value (including the `return -1` workaround\
    \ from PHP 5.x), this will cause a failure and emit an `E_WARNING`.\n\n### Backwards\
    \ Compatibility\n\n*   `return false` will actually work as expected now.\n\n\
    *   Using the `return -1` workaround will cause a warning.\n\n### Further Reading\n\
    \n*   [RFC: Fix handling of custom session handler return values](https://wiki.php.net/rfc/session.user.return-valuey)\n\
    \n*   [PHP manual: session\\_set\\_save\\_handler](http://us2.php.net/session_set_save_handler)\n\
    \n## Chapter 31: Errors on Invalid Octal Literals\n\nAttempting to use an invalid\
    \ octal literal (containing digits larger than 7) will now produce a parse error:\n\
    \nInvalid Octal in PHP 7 \n\n```\necho 0781; // Parse error: Invalid numeric literal\n\
    ```\n\nPrior versions of PHP would silently truncate the literal, resulting in\
    \ unexpected values:\n\nInvalid Octal in PHP 5.x \n\n```\necho 0781; // 7\n```\n\
    \n### Backwards Compatibility\n\n*   Using invalid octal literals will result\
    \ in a parse error\n\n### Further Reading\n\n*   *n/a*\n\n# Part 3 - Deprecations\
    \ & Removals\n\nPHP 7 deprecates a couple features and removes several others\
    \ which worked in previous versions of PHP. You’ll want to adjust your code accordingly\
    \ before upgrading to PHP 7.\n\n## Chapter 32: Deprecation of PHP 4 Constructors\n\
    \nCreating constructor methods for PHP 4 classes involved declaring a method with\
    \ the same name as the class:\n\nPHP 4-Style Constructor Example \n\n```\nclass\
    \ Post {\n    // Recognized as a constructor in PHP 4 and 5\n    function post()\
    \ {}\n}\n```\n\nPHP 5 added the new `__construct()` method we’re all familiar\
    \ with, but it also preserved the older style constructors too. This led to some\
    \ strange behavior in different cases.\n\nFor example, PHP 4-style constructors\
    \ worked fine in global classes but not namespaced classes:\n\nNamespaced PHP\
    \ 5 Class \n\n```\nnamespace Blog;\nclass Post {\n    // Not recognized as a constructor\
    \ because of the namespace\n    function post() {}\n}\n```\n\nAnd if you declared\
    \ both a PHP 4 and PHP 5-style constructor, you’d get different behavior based\
    \ on which was listed first in the code:\n\nPHP 5-Style Constructor First \n\n\
    ```\nclass Post {\n    // Constructor\n    function __construct() {}\n\n    //\
    \ Normal method; not a constructor\n    function post() {}\n}\n```\n\nPHP 4-Style\
    \ Constructor First \n\n```\nclass Post {\n    // Normal method; not a constructor\n\
    \    function post() {}\n\n    // Emits an E_STRICT\n    function __construct()\
    \ {}\n}\n```\n\nInstead of preserving this odd behavior, PHP 7 makes two important\
    \ changes:\n\n1.  `E_DEPRECATED` is emitted whenever any PHP 4-style constructor\
    \ is used.\n\n2.  `E_STRICT` is no longer emitted when both types of constructors\
    \ are present.\n\nFurthermore, PHP 8 will not recognize the PHP 4-style constructors,\
    \ therefore always interpreting them as standard class methods.\n\nBecause this\
    \ old style is deprecated, you should strongly consider removing them altogether\
    \ from code you migrate to PHP 7.\n\n### Backwards Compatibility\n\n*   Custom\
    \ error handlers may be affected by the new `E_DEPRECATED` errors being emitted.\n\
    \n### Further Reading\n\n*   [RFC: Remove PHP 4 Constructors](https://wiki.php.net/rfc/remove_php4_constructors)\n\
    \n*   [PHP Manual: Constructors and Destructors](http://us2.php.net/manual/en/language.oop5.decon.php)\n\
    \n## Chapter 33: Deprecation of Salt Option for `password_hash()`\n\nPHP 5.5 introduced\
    \ a new password hashing API to make secure hashing easy (and abstract away some\
    \ of bcrypt’s complexity). Part of this API included a new `password_hash()` method\
    \ which allowed users to provide a custom salt. However, these salts were often\
    \ generated using cryptographically insecure sources (like `mt_rand()`), thus\
    \ compromising the effectiveness of the salts."
  fmt: "\nBecause the state of a `foreach` loop is now independent from the internal\
    \ state of an array/object pointer, built-in functions which use that internal\
    \ pointer (`reset`/`key`/`current`/`next`/`prev`) will no longer represent the\
    \ state of the loop.\n\n### Backwards Compatibility\n\nAny code relying on the\
    \ old, undocumented behavior will no longer work in PHP 7.\n\n### Further Reading\n\
    \n*   [RFC: Fix “foreach” behavior](https://wiki.php.net/rfc/php7_foreach)\n\n\
    ## Chapter 28: Behavior Changes to `list`\n\n### String Handling\n\nThe PHP documentation\
    \ has always stated that the `list()` construct wouldn’t unpack strings. However,\
    \ in some cases, it actually would work:\n\nExample 1\n\n```\nlist($a, $b) = 'ab';\n\
    var_dump($a, $b);\n```\n\nExample 1: Output\n\n```\nNULL\nNULL\n```\n\nExample\
    \ 2\n\n```\n$a[0] = 'ab';\nlist($a, $b) = $a[0];\nvar_dump($a, $b);\n```\n\nExample\
    \ 2: Output\n\n```\nstring(1) \"a\"\nstring(1) \"b\"\n```\n\nThis undocumented\
    \ behavior was caused by an implementation “feature” and was not intentional.\n\
    \nThis string handling edge-case no longer works with PHP 7.\n\n### Empty List\
    \ Assignment\n\nUsing `list()` without any variables will now result in a fatal\
    \ error:\n\n```\n$a = [1, 2, 3];\n\nlist() = $a;   // Fatal error: Cannot use\
    \ empty list\nlist(,,) = $a; // Fatal error: Cannot use empty list\n```\n\n###\
    \ Variable Assignment Order\n\nBecause of the new [Abstract Syntax Tree](#chap33.xhtml#chapter-16-ast),\
    \ values are assigned left-to-right, whereas PHP 5.x assigned them right-to-left.\n\
    \n### Backwards Compatibility\n\n*   `list()` no longer works with string values\
    \ in some cases; variables will always be set to `NULL` in these cases\n\n*  \
    \ Calling `list()` without any variables will trigger a fatal error\n\n*   Depending\
    \ on the old right-to-left assignment ordering will no longer work\n\n### Further\
    \ Reading\n\n*   [RFC: Fix list() behavior inconsistency](https://wiki.php.net/rfc/fix_list_behavior_inconsistency)\n\
    \n*   [RFC: Abstract Syntax Tree](https://wiki.php.net/rfc/abstract_syntax_tree#changes_to_list)\n\
    \n## Chapter 29: Parameter Handling Changes\n\n### Duplicate Parameter Names\n\
    \nPrevious versions of PHP allowed multiple function parameters to use the same\
    \ name. This functionality is no longer supported in PHP 7. Attempting to use\
    \ duplicate parameter names will now cause a fatal error.\n\n```\nfunction foo($a,\
    \ $a) {\n    return $a;\n}\n\necho foo(1, 2);\n```\n\nPHP 5 Output\n\n```\n2\n\
    ```\n\nPHP 7 Output\n\n```\nFatal error: Redefinition of parameter $a\n```\n\n\
    ### `func_get_arg()` and `func_get_args()`\n\nThe `func_get_arg()` and `func_get_args()`\
    \ functions used to return the original parameter values, even if those variables\
    \ changed during function execution. This behavior no longer occurs in PHP 7 -\
    \ both functions will instead provide the current value(s). For example, given\
    \ the following code:\n\n```\nfunction foo($a) {\n    $a++;\n    var_dump($a);\n\
    }\nfoo(1);\n```\n\nPHP 5.x would display the original value of `1`, whereas PHP\
    \ 7 will display `2`.\n\nThis behavioral change also applies to the display of\
    \ function arguments in backtraces.\n\n### Backwards Compatibility\n\nCode using\
    \ duplicate parameter names will now result in a fatal error. Simply removing\
    \ the previous instances will maintain full compatibility with PHP 5.x and 7.x.\n\
    \nCode relying on `func_get_arg()` and `func_get_args()` to return the original\
    \ (not current) value may not behave as expected.\n\n### Further Reading\n\n*\
    \   [RFC: phng](https://wiki.php.net/phpng)\n\n## Chapter 30: Custom Session Handler\
    \ Return Values\n\nPHP allows you to implement your own session storage and retrieval\
    \ mechanisms via the `session_set_save_handler()` function. You simply define\
    \ some functions (or implement the `SessionHandlerInterface`) to handle operations\
    \ like loading and saving the session data.\n\nAccording to the documentation,\
    \ several of these functions (like `open()` and `close()`) should return `true`\
    \ on success or `false` on failure. However, these return values never worked\
    \ properly prior to PHP 7 due to a major bug with how PHP’s internals handled\
    \ your return value. Essentially, return values of `false` were never interpreted\
    \ as failures. Developers eventually figured out they could return `-1` to indicate\
    \ failure, but this contradicted the documentation.\n\nPHP 7 resolves this bug\
    \ so that both `true` and `false` return values are interpreted properly. If you\
    \ return any other value (including the `return -1` workaround from PHP 5.x),\
    \ this will cause a failure and emit an `E_WARNING`.\n\n### Backwards Compatibility\n\
    \n*   `return false` will actually work as expected now.\n\n*   Using the `return\
    \ -1` workaround will cause a warning.\n\n### Further Reading\n\n*   [RFC: Fix\
    \ handling of custom session handler return values](https://wiki.php.net/rfc/session.user.return-valuey)\n\
    \n*   [PHP manual: session\\_set\\_save_handler](http://us2.php.net/session_set_save_handler)\n\
    \n## Chapter 31: Errors on Invalid Octal\n\nAttempting to use invalid octal literal\
    \ will now produce a parse error:\n\nPHP 7\n\n```\necho 081\n```\n\nPrior versions\
    \ of PHP would silently truncate the literal, resulting in unexpected values:\n\
    \nPHP 5.x\n\n```\necho 081\n```\n\n### Backwards Compatibility\n\n*   Using invalid\
    \ octal will result in a parse error\n\n### Further Reading\n\n*   n/a\n\n# Part\
    \ 3 - Deprecations & Removals\n\nPHP 7 deprecates a couple features and removes\
    \ several others\n\n## Chapter 32: Deprecation of PHP 4 Constructors\n\nCreating\
    \ constructor methods for PHP 4 involved declaring a method with the same name\
    \ as the class:\n\nPHP 4-Style Example\n\n```\nclass Post {\n    // Recognized\
    \ as a constructor in PHP 4\n    function post() {}\n}\n```\n\nPHP 5 added the\
    \ new `__construct()` method we’re all familiar with, but it also preserved the\
    \ older style too. This led to some strange behavior in cases. For example, PHP\
    \ 4-style constructors worked fine in global classes but not namespaced classes:\n\
    \nNamespaced PHP 5 Class\n\n```\nnamespace Blog;\nclass Post {\n    // Not recognized\
    \ as a constructor because of the namespace\n    function post() {}\n}\n```\n\n\
    And if you declared both a PHP 4 and PHP 5-style constructor, you’d get different\
    \ behavior based on which was listed first:\n\nPHP 5-Style Constructor First\n\
    \n```\nclass Post {\n    // Constructor\n    function __construct() {}\n\n   \
    \ // Normal method; not a constructor\n    function post() {}\n}\n```\n\nPHP 4-Style\
    \ Constructor First\n\n```\nclass Post {\n    // Normal method; not a constructor\n\
    \    function post() {}\n\n    // Emits an E_STRICT\n    function __construct()\
    \ {}\n}\n```\n\nInstead of preserving this odd behavior, PHP 7 makes two important\
    \ changes:\n\n1.  `E_DEPRECATED` is emitted whenever any PHP 4-style constructor\
    \ is used.\n\n2.  `E_STRICT` is no longer emitted when both types of constructors\
    \ are present.\n\nFurthermore, PHP 8 will not recognize the PHP 4-style constructors,\
    \ therefore interpreting them as standard class methods.\n\nBecause this old style\
    \ is deprecated, you should strongly consider removing them from code you migrate\
    \ to PHP 7.\n\n### Backwards Compatibility\n\n*   Custom error handlers may be\
    \ affected by the new `E_DEPRECATED` errors being emitted.\n\n### Further Reading\n\
    \n*   [RFC: Remove PHP 4 Constructors](https://wiki.php.net/rfc/remove_php4_constructors)\n\
    \n*   [PHP Manual: Constructors and Destructors](http://us2.php.net/manual/en/language.oop5.decon.php)\n\
    \n## Chapter 33: Deprecation of Salt Option for `password_hash()`\n\nPHP 5.5 introduced\
    \ a new password hashing API to make secure hashing easy (and abstract away some\
    \ of bcrypt’s complexity). Part of this API included a new `password_hash()` method\
    \ which allowed users to provide a custom salt. However, these salts were often\
    \ generated using cryptographically insecure sources (like `mt_rand()`), thus\
    \ compromising the effectiveness of the salts.\n"
  trans: "\n\n由于 `foreach` 循环的状态现在不再独立于数组/对象指针的内部状态，因此使用该内部指针的内置函数（`reset`/`key`/`current`/`next`/`prev`）将不再代表循环的状态。\n\
    \n### 向后兼容性\n\n任何依赖于旧的、未文档的行为的代码在 PHP 7 中将不再工作。\n\n### 扩展阅读\n\n*   [RFC: 修复“foreach”\
    \ 行为](https://wiki.php.net/rfc/php7_foreach)\n\n## 第 28 章：`list` 的行为变更\n\n###\
    \ 字符串处理\n\nPHP 文档一直指出 `list()` 构造体不会解包字符串。然而，在某些情况下，它实际上是可以作用的：\n\n示例 1\n\n```\n\
    list($a, $b) = 'ab';\nvar_dump($a, $b);\n```\n\n示例 1：输出\n\n```\nNULL\nNULL\n```\n\
    \n示例 2\n\n```\n$a[0] = 'ab';\nlist($a, $b) = $a[0];\nvar_dump($a, $b);\n```\n\n\
    示例 2：输出\n\n```\nstring(1) \"a\"\nstring(1) \"b\"\n```\n\n这种未文档的行为是由实现上的“特性”引起的，并非刻意。\n\
    \n这种字符串处理的边缘情况在 PHP 7 中不再适用。\n\n### 空列表赋值\n\n现在不带任何变量使用 `list()` 将导致致命错误（fatal\
    \ error）：\n\n```\n$a = [1, 2, 3];\n\nlist() = $a;   // Fatal error: Cannot use\
    \ empty list\nlist(,,) = $a; // Fatal error: Cannot use empty list\n```\n\n###\
    \ 变量赋值顺序\n\n由于采用了新的抽象语法树，值是从左到右赋值，而 PHP 5.x 是从右到左赋值。\n\n### 向后兼容性\n\n*   在某些情况下，`list()`\
    \ 不再支持字符串值；在这些情况下，变量始终被设置为 `NULL`\n\n*   调用不带任何变量的 `list()` 将触发致命错误\n\n*   依赖旧的从右到左赋值顺序将不再工作\n\
    \n### 扩展阅读\n\n*   [RFC: 修复 list() 行为不一致性](https://wiki.php.net/rfc/fix_list_behavior_inconsistency)\n\
    \n*   [RFC: 抽象语法树](https://wiki.php.net/rfc/abstract_syntax_tree#changes_to_list)\n\
    \n## 第 29 章：参数处理变更\n\n### 重复参数名\n\n之前的 PHP 版本允许多个函数参数使用相同的名称。此功能在 PHP 7 中不再被支持。尝试使用重复的参数现在现在会导致致命错误。\n\
    \n```\nfunction foo($a, $a) {\n    return $a;\n}\n\necho foo(1, 2);\n```\n\nPHP\
    \ 5 输出\n\n```\n2\n```\n\nPHP 7 输出\n\n```\nFatal error: Redefinition of parameter\
    \ $a\n```\n\n### `func_get_arg()` 和 `func_get_args()`\n\n`func_get_arg()` 和 `func_get_args()`\
    \ 函数过去返回原始参数值，即使这些变量在函数执行期间发生了变化。这种行为在 PHP 7 中不再发生——这两个函数现在将提供当前值。例如，给定以下代码：\n\
    \n```\nfunction foo($a) {\n    $a++;\n    var_dump($a);\n}\nfoo(1);\n```\n\nPHP\
    \ 5.x 会显示原始值 `1`，而 PHP 7 将显示 `2`。\n\n这种行为变化也适用于回溯（backtraces）中函数参数的显示。\n\n###\
    \ 向后兼容性\n\n使用重复参数名的代码现在会导致致命错误。只需删除之前的实例，即可保持与 PHP 5.x 和 7.x 的完全兼容。\n\n依赖 `func_get_arg()`\
    \ 和 `func_get_args()` 返回原始（而非当前）值的代码可能无法符合预期行为。\n\n### 扩展阅读\n\n*   [RFC: phng](https://wiki.php.net/phpng)\n\
    \n## 第 30 章：自定义 Session 处理器的返回值\n\nPHP 允许你通过 `session_set_save_handler()` 函数实现自己的会话存储和检索机制。你只需要定义一些函数（或实现\
    \ `SessionHandlerInterface`）来处理加载和保存会话数据等操作。\n\n根据文档，这些函数几个（如 `open()` 和 `close()`）应该在成功时返回\
    \ `true`，在失败时返回 `false`。然而，在 PHP 7 之前，由于 PHP 内部处理你返回值的方式存在严重错误，这些返回值从未正常工作。从本质上讲，`false`\
    \ 返回值从未被解释为失败。开发者最终发现可以通过返回 `-1` 来指示失败，但这与文档相矛盾。\n\nPHP 7 修复了此错误，使得 `true` 和 `false`\
    \ 返回值都能被正确解释。如果你返回任何其他值（包括 PHP 5.x 中的 `return -1` 变通方案），将导致失败并抛出 `E_WARNING`。\n\
    \n### 向后兼容性\n\n*   `return false` 现在实际上可以按预期工作。\n\n*   使用 `return -1` 的变通方案会导致警告。\n\
    \n### 扩展阅读\n\n*   [RFC: 修复自定义会话处理器返回值的处理](https://wiki.php.net/rfc/session.user.return-valuey)\n\
    \n*   [PHP 手册：session\\_set\\_save\\_handler](http://us2.php.net/session_set_save_handler)\n\
    \n## 第 31 章：无效八进制的错误\n\n尝试使用无效八进制字量现在会产生解析错误：\n\nPHP 7\n\n```\necho 08\n```\n\n\
    之前的 PHP 版本会静默截断字量，导致意外值：\n\nPHP 5.x\n\n```\necho 08\n```\n\n### 向后兼容性\n\n*   使用无效八进制将导致解析错误\n\
    \n### 扩展阅读\n\n*   n/a\n\n# 第 3 部分：弃用与移除\n\nPHP 7 弃用了一些功能并移除了其他功能\n\n## 第 32 章：PHP\
    \ 4 构造函数的弃用\n\nPHP 4 的构造方法是通过声明与类同名的方法来实现的：\n\nPHP 4 样式示例\n\n```\nclass Post {\n\
    \    // 在 PHP 4 中识别为构造函数\n    function post() {}\n}\n```\n\nPHP 5 增加了熟悉的 `__construct()`\
    \ 方法，但也保留了旧样式。这导致了一些奇怪的行为。例如，PHP 4 构造函数在全局类中正常，但在命名空间类中无效：\n\n命名空间 PHP 5 类\n\n\
    ```\nnamespace Blog;\nclass Post {\n    // 因为命名空间未被识别为构造函数\n    function post()\
    \ {}\n}\n```\n\n如果你同时声明了 PHP 4 和 PHP 5 风格的构造函数，结果将取决于声明的顺序：\n\nPHP 5 样式优先\n\n\
    ```\nclass Post {\n    // 构造函数\n    function __construct() {}\n\n    // 普通方法，不是构造函数\n\
    \    function post() {}\n}\n```\n\nPHP 4 样式优先\n\n```\nclass Post {\n    // 普通方法，不是构造函数\n\
    \    function post() {}\n\n    // 触发 E_STRICT\n    function __construct() {}\n\
    }\n```\n\nPHP 7 不再保留这种奇怪的行为，而是做了两个重要的变更：\n\n1. 每当使用 PHP 4 样式构造函数时都会触发 `E_DEPRECATED`。\n\
    \n2. 当两种类型的构造函数时，不再触发 `E_STRICT`。\n\n此外，PHP 8 将不再识别 PHP 4 样式构造函数，从而将其解释为标准类方法。\n\
    \n由于这种旧样式已被弃用，强烈建议在迁移到 PHP 7 的代码中移除它们。\n\n### 向后兼容性\n\n*   自定义错误处理器可能会受到新产生的 `E_DEPRECATED`\
    \ 错误的影响。\n\n### 扩展阅读\n\n*   [RFC: 移除 PHP 4 构造函数](https://wiki.php.net/rfc/remove_php4_constructors)\n\
    \n*   [PHP 手册：构造函数与析构函数](http://us2.php.net/manual/en/language.oop5.decon.php)\n"
