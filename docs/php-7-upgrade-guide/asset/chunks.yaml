    \n## Chapter 11: Reliable User-land CSPRNG\n\nPHP 7 introduces a cryptographically-secure\
    \ psueod-random number generator (CSPRNG) API which vastly simplifies the process\
    \ of generating high-quality random data:\n\n```\nrandom_bytes(int length);\n\n\
    random_int(int min, int max);\n```\n\nThese methods produce “cryptographicaly-secure”\
    \ random numbers which are suitable for high-stakes applications like generating\
    \ encryption keys, salting passwords, shuffling card decks, etc.\n\nIf you wanted\
    \ to generate such values in previous versions of PHP, you’d need to write code\
    \ to interface with mcrypt/openssl or directly access `/dev/*random`. This technically\
    \ worked but your code wouldn’t be portable because of the hard-coded dependencies\
    \ on the library or OS you coded against.\n\nWith PHP 7, you simply call `random_bytes`\
    \ or `random_int` and PHP will intelligently select the best available source\
    \ of randomness on the current machine. This could be:\n\n*   `CryptGenRandom`\
    \ for Windows environments\n\n*   `arc4random_buf()` if available (generally BSD\
    \ specific)\n\n*   `/dev/arandom` or `/dev/urandom`\n\nIf no sufficient source\
    \ of randomness is available, an error will be thrown.\n\n### Backwards Compatibility\n\
    \nYou may no longer define functions named `random_int()` or `random_bytes()`\
    \ in the global namespace.\n\n### Forwards Compatibility\n\nThe [`paragonie/random_compat`\
    \ library](https://github.com/paragonie/random_compat) back-ports these new functions\
    \ to PHP 5.x. Simply drop this into your application and it’ll define those functions\
    \ if they don’t exist, thus allowing you to write secure code which runs on both\
    \ 5.x and 7.\n\n### Further Reading\n\n*   [RFC: Easy User-land CSPRNG](https://wiki.php.net/rfc/easy_userland_csprng)\n\
    \n*   [PHP Manual: CSPRNG Functions](http://us3.php.net/manual/en/ref.csprng.php)\n\
    \n*   [How to Safely Generate Random Strings and Integers in PHP](https://paragonie.com/blog/2015/07/how-safely-generate-random-strings-and-integers-in-php)\n\
    \n*   [ircmaxell: Random Number Generation in PHP](http://blog.ircmaxell.com/2011/07/random-number-generation-in-php.html)\n\
    \n## Chapter 12: Integer Division\n\nPHP has historically lacked the ability to\
    \ perform integer division. For example, if you were to divide `5 / 2`, you’d\
    \ always get a float value of `2.5`; should you want an integer result instead,\
    \ you’d have to cast it like so: `(int) 5 / 2`. This works okay for most applications,\
    \ especially where smaller numbers are involved. However, because the result is\
    \ a float, you’re subjected to a significant limitation: **floats cannot accurately\
    \ represent integers greater than 53 bits**.\n\nIn order to avoid this limitation\
    \ (and the need for a cast-based workaround), PHP 7 has introduced a new `intdiv()`\
    \ method:\n\n```\nintdiv(int $numerator, int $divisor)\n```\n\nIt works exactly\
    \ as you’d expect, dividing two integers and providing an integer result. It doesn’t\
    \ use utilize floating-point division, thus avoiding that 53-bit limitation.\n\
    \nIf `$divisor` is 0, the function will throw a `DivisionByZeroError`.\n\n###\
    \ Backwards Compatibility\n\nYou may no longer create functions named `intdiv()`\
    \ in the global namespace.\n\n### Further Reading\n\n*   [RFC: intdiv()](https://wiki.php.net/rfc/intdiv)\n\
    \n*   [PHP Manual: intdiv()](https://secure.php.net/manual/en/function.intdiv.php)\n\
    \n## Chapter 13: preg\\_replace\\_callback\\_array\n\n`preg_replace_callback_array`\
    \ is a new PCRE function which enables you find and replace multiple patterns\
    \ using callbacks:\n\n```\npreg_replace_callback_array(array $pattern, $subject,\
    \ $limit, &$count)\n```\n\nHere’s an example of this in action:\n\n```\n$song\
    \ = \"99 bottles of beer on the wall\\n99 bottles of beer\\nTake one down, pass\\\
    \n it around\\n98 bottles of beer on the wall\";\n\necho preg_replace_callback_array([\n\
    \    '/bottles of (beer|ale|cider)/' => function($matches) {\n        return 'little\
    \ bugs';\n    },\n    '/on the (wall|table|floor)/' => function($matches) {\n\
    \        return 'in the code';\n    },\n    '/pass/' => function($matches) {\n\
    \        return 'patch';\n    },\n    '/98/' => function($matches) {\n       \
    \ return rand(100, 200);\n    },\n], $song);\n\n/**\n * 99 little bugs in the\
    \ code\n * 99 little bugs\n * Take one down, patch it around\n * 146 little bugs\
    \ in the code\n */\n```\n\nThis type of functionality used to be possible prior\
    \ to PHP 5.5.0, using the `/e` modifier:\n\n```\n$song = \"99 bottles of beer\
    \ on the wall\\n99 bottles of beer\\nTake one down, pass\\\n it around\\n98 bottles\
    \ of beer on the wall\";\n\necho preg_replace(\n    [\n        '/bottles of (beer|ale|cider)/',\n\
    \        '/on the (wall|table|floor)/',\n        '/pass/',\n        '/98/e',\n\
    \    ],\n    [\n        'little bugs',\n        'in the code',\n        'patch',\n\
    \        'rand(100, 200)',\n    ],\n    $song\n);\n\n/**\n * 99 little bugs in\
    \ the code\n * 99 little bugs\n * Take one down, patch it around\n * 179 little\
    \ bugs in the code\n */\n```\n\nHowever, the `/e` modifier was deprecated in PHP\
    \ 5.5.0, thus removing the ability to pair a matched pattern with a callback.\
    \ The introduction of `preg_replace_callback_array` re-enables this functionality.\n\
    \n### Backwards Compatibility\n\nYou may no longer define functions named `preg_replace_callback_array()`\
    \ in the global namespace.\n\n### Further Reading\n\n*   [RFC: preg\\_replace\\\
    _callback\\_array](https://wiki.php.net/rfc/preg_replace_callback_array)\n\n##\
    \ Chapter 14: `IntlChar` Class\n\nPHP supports internationalization (i18n) and\
    \ localization (l10n) via the `intl` extension. This extension is basically just\
    \ a wrapper around the ICU library and therefore provides near-identical methods\
    \ and features."
  fmt: "\n```php\n// Generates random numbers until told to stop\n// If you don't\
    \ send that command it'll loop forever\nfunction getRandomNumbers() {\n    while\
    \ (true) {\n       $cmd = (yield rand(1, 10));\n       if ($cmd == 'stop') {\n\
    \           break;\n       }\n    }\n}\n\n// Combines two \"infinite streams\"\
    \ of random numbers\nfunction foo() {\n    yield from getRandomNumbers();\n  \
    \  yield from getRandomNumbers();\n}\n\n$generator = foo();\nforeach ($generator\
    \ as $randomNumber) {\n    var_dump($randomNumber);\n\n    // Stop the generator\
    \ once we get a 3\n    if ($randomNumber == 3) {\n        $generator->send('stop');\n\
    \    }\n}\n\n/*\nint(4)\nint(7)\nint(5)\nint(1)\nint(8)\nint(3) // The first \"\
    stream\" of random numbers stops here\nint(5)\nint(9)\nint(3) // The second one\
    \ stops here\n*/\n```\n\n### Exceptions\n\nThrown exceptions will bubble up as\
    \ usual:\n\n```php\nfunction a() {\n    yield 1;\n    yield 2;\n\n    throw new\
    \ Exception('oh noes!');\n}\n\nfunction b() {\n    yield 'foo';\n    yield from\
    \ a();\n    yield 'bar';\n}\n\nforeach (b() as $var) {\n    var_dump($var);\n\
    }\n\n/*\nstring(3) \"foo\"\nint(1)\nint(2)\n\nFatal error: Uncaught Exception:\
    \ oh noes! in /tmp/gen.php:7\nStack trace:\n#0 /tmp/gen.php(12): a()\n#1 /tmp/gen.php(16):\
    \ b()\n#2 {main}\n  thrown in /tmp/gen.php on line 7\n*/\n```\n\nThere are also\
    \ two specific cases where using `yield from` may throw an `EngineException`:\n\
    \n1. Attempting to `yield from` something other than an array or `Traversable`\n\
    \n2. Attempting to `yield from` a generator which previously threw an uncaught\
    \ exception\n\n### Return Values\n\nIf `<expr>` happens to be a sub-generator\
    \ then `yield from <expr>` will provide the eventual return value of that sub-generator:\n\
    \n```php\nfunction a() {\n    yield 1;\n    yield 2;\n\n    return 42;\n}\n\n\
    function b() {\n    yield 'foo';\n    $retVal = yield from a();\n    yield 'bar';\n\
    \    return $retVal;\n}\n\n$generator = b();\nforeach ($generator as $var) {\n\
    \    var_dump($var);\n}\nvar_dump($generator->getReturn());\n\n/*\nstring(3) \"\
    foo\"\nint(1)\nint(2)\nstring(3) \"bar\"\nint(42)\n*/\n```\n\n* * *\n\nTo summarize:\
    \ with delegation, it doesn’t matter to your callers whether the `yield`s exist\
    \ in the main generator or a sub-generator; receiving and sending values will\
    \ always behave consistently as you’d expect them.\n\n### Further Reading:\n\n\
    * [RFC: Generator Delegation](https://wiki.php.net/rfc/generator-delegation)\n\
    \n## Chapter 11: Reliable User-land CSPRNG\n\nPHP 7 introduces a cryptographically-secure\
    \ psueod-random number generator (CSPRNG) API which vastly simplifies the process\
    \ of generating high-quality random data:\n\n```php\nrandom_bytes(int length);\n\
    \nrandom_int(int min, int max);\n```\n\nThese methods produce “cryptographicaly-secure”\
    \ random numbers which are suitable for high-stakes applications like generating\
    \ encryption keys, salting passwords, shuffling card decks, etc.\n\nIf you wanted\
    \ to generate such values in previous versions of PHP, you’d need to write code\
    \ to interface with `mcrypt/openssl` or directly access `/dev/*random`. This technically\
    \ worked but your code wouldn’t be portable because of the hard-coded dependencies\
    \ on the library or OS you coded against.\n\nWith PHP 7, you simply call `random_bytes`\
    \ or `random_int` and PHP will intelligently select the best available source\
    \ of randomness on the current machine. This could be:\n\n* `CryptGenRandom` for\
    \ Windows environments\n\n* `arc4random_buf()` if available (generally BSD specific)\n\
    \n* `/dev/arandom` or `/dev/urandom`\n\nIf no sufficient source of randomness\
    \ is available, an error will be thrown.\n\n### Backwards Compatibility\n\nYou\
    \ may no longer define functions named `random_int()` or `random_bytes()` in the\
    \ global namespace.\n\n### Forwards Compatibility\n\nThe [`paragonie/random_compat`\
    \ library](https://github.com/paragonie/random_compat) back-ports these new functions\
    \ to PHP 5.x. Simply drop this into your application and it’ll define those functions\
    \ if they don’t exist, thus allowing you to write secure code which runs on both\
    \ 5.x and 7.\n\n### Further Reading\n\n* [RFC: Easy User-land CSPRNG](https://wiki.php.net/rfc/easy_userland_csprng)\n\
    \n* [PHP Manual: CSPRNG Functions](http://us3.php.net/manual/en/ref.csprng.php)\n\
    \n* [How to Safely Generate Random Strings and Integers in PHP](https://paragonie.com/blog/2015/07/how-safely-generate-random-strings-and-integers-in-php)\n\
    \n* [ircmaxell: Random Number Generation in PHP](http://blog.ircmaxell.com/2011/07/random-number-generation-in-php.html)\n\
    \n## Chapter 12: Integer Division\n\nPHP has historically lacked the ability to\
    \ perform integer division. For example, if you were to divide `5 / 2`, you’d\
    \ always get a float value of `2.5`; should you want an integer result instead,\
    \ you’d have to cast it like so: `(int) 5 / 2`. This works okay for most applications,\
    \ especially where smaller numbers are involved. However, because the result is\
    \ a float, you’re subjected to a significant limitation: `floats cannot accurately\
    \ represent integers greater than 53 bits`.\n\nIn order to avoid this limitation\
    \ (and the need for a cast-based workaround), PHP 7 has introduced a new `intdiv()`\
    \ method:\n\n```php\nintdiv(int $numerator, int $divisor)\n```\n\nIt works exactly\
    \ as you’d expect, dividing two integers and providing an integer result. It doesn’t\
    \ utilize floating-point division, thus avoiding that 53-bit limitation.\n\nIf\
    \ `$divisor` is 0, the function will throw a `DivisionByError`.\n\n### Backwards\
    \ Compatibility\n\nYou may no longer define functions named `random_int()` or\
    \ `random_bytes()` in the global namespace.\n\n### Further Reading\n\n* [RFC:\
    \ intdiv()](https://wiki.php.net/rfc/intdiv)\n\n* [PHP Manual: intdiv()](http://us3.php.net/manual/en/function.intdiv.php)\n\
    \n## Chapter 13: `preg_replace_callback_array`\n\n`preg_replace_callback_array`\
    \ is a new PCRE function which enables find and replace multiple patterns using\
    \ callbacks:\n\n```php\npreg_replace_callback_array(array $pattern, $subject,\
    \ $limit, &$count)\n```\n\nHere’s an example of this in action:\n\n```php\n$song\
    \ = \"99 bottles of beer on the wall\\n99 bottles of beer\\nTake one down, pass\n\
    \ it around\\n98 bottles of beer on the wall\";\n\necho preg_replace_callback_array([\n\
    \    '/bottles of (beer|ale|cider)/' => function($matches) {\n        return 'little\
    \ bugs';\n    },\n    '/on the (wall|floor)/' => function($matches) {\n      \
    \  return 'in the code';\n    },\n    '/pass/' => function($matches) {\n     \
    \   return 'patch';\n    },\n    '/98/' => function($matches) {\n        return\
    \ rand(100, 200);\n    },\n], $song);\n\n/**\n * 99 little bugs in the code\n\
    \ * 99 little bugs\n * Take one down, patch around\n * 146 little bugs in the\
    \ code\n */\n```\n\nHowever, the `/e` modifier was deprecated in PHP 5.5.0, thus\
    \ removing the ability to pair a matched pattern with a callback. The introduction\
    \ of `preg_replace_callback_array` re-enables this functionality.\n\n### Backwards\
    \ Compatibility\n\nYou may no longer define functions named `preg_replace_callback_array()`\
    \ in the global namespace.\n\n### Further Reading\n\n* [RFC: preg_replace_callback_array](https://wiki.php.net/rfc/preg_replace_callback_array)\n\
    \n## Chapter 14: `IntlChar` Class\n\nPHP supports internationalization (i18n)\
    \ and localization (l10n) via the `intl` extension. This extension is basically\
    \ just a wrapper around the ICU library and therefore provides near-identical\
    \ methods and features.\n"
  trans: "\n\n```php\n// 生成随机数，直到被命令停止\n// 如果你不发送该命令，它将无限循环\nfunction getRandomNumbers()\
    \ {\n    while (true) {\n       $cmd = (yield rand(1, 10));\n       if ($cmd ==\
    \ 'stop') {\n           break;\n       }\n    }\n}\n\n// 合并两个随机数的“无限流”\nfunction\
    \ foo() {\n    yield from getRandomNumbers();\n    yield from getRandomNumbers();\n\
    }\n\n$generator = foo();\nforeach ($generator as $randomNumber) {\n    var_dump($randomNumber);\n\
