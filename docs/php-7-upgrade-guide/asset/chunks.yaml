    ### Further Reading:\n\n*   [RFC: Group Use Declarations](https://wiki.php.net/rfc/group_use_declarations)\n\
    \n## Chapter 8: Closure `call` Method\n\nPHP 5.4 introduced the ability to bind\
    \ `$this` to any given object using either the `Closure::bind` static method or\
    \ the `Closure::bindTo` method:\n\n```\n// Here's a class which hold a secret\
    \ number\nclass SecretNumber { private $secretNumber = 3; }\n// Here's a closure\
    \ which can reveal it\n$revealer = function() { return $this->secretNumber; };\n\
    \n// In order to use it in PHP 5.4-5.6, we must first\n// bind the scope to a\
    \ temporary intermediate closure:\n$boundRevealer = $revealer->bindTo(new SecretNumber(),\
    \ 'SecretNumber');\n\n// And now we can use it:\necho $boundRevealer(); // 3\n\
    ```\n\nPHP 7 simplifies this process by adding a new `call` method:\n\n```\nmixed\
    \ Closure::call(object $to[, mixed ...$parameters])\n```\n\nThis eliminates the\
    \ need to create a temporary closure first - you simply just call `call()` with\
    \ your object scope and any parameters:\n\n```\n// Here's a class which hold a\
    \ secret number\nclass SecretNumber { private $secretNumber = 3; }\n// Here's\
    \ a closure which can reveal it\n$revealer = function() { return $this->secretNumber;\
    \ };\n\n// Just call it directly\necho $revealer->call(new SecretNumber()); //\
    \ 3\n```\n\nIn addition to simplifying your code, this approach also improves\
    \ performance since that intermediate closure is no longer created.\n\nThis new\
    \ `call` method can be used in most cases where you’re calling `bind` or `bindTo`\
    \ followed by a closure invocation.\n\n### Further Reading:\n\n*   [RFC: Closure::call](https://wiki.php.net/rfc/closure_apply)\n\
    \n*   [PHP Manual: `Closure::call`](https://secure.php.net/manual/en/closure.call.php)\n\
    \n## Chapter 9: Generator Return Expressions\n\nThe `yield` keyword allows generators\
    \ to provide the result of each individual step. This works perfectly for “streaming”\
    \ large amounts of data. Generators can also break large computations into smaller\
    \ units of work, allowing the function to suspend itself and resume later. In\
    \ these cases, it’s especially useful to have a standard way of accessing the\
    \ final results of those computations.\n\nTo demonstrate the use of return expressions,\
    \ let’s build a function which computes the size of all files within a directory,\
    \ yielding its current progress along the way:\n\n```\nfunction calculateSize($directory)\
    \ {\n    $size = 0;\n    $count = 0;\n    foreach (scandir($directory) as $entry)\
    \ {\n        if (is_file($entry)) {\n            $size += filesize($entry);\n\
    \            yield $count++;\n        }\n    }\n\n    return $size;\n}\n\n$task\
    \ = calculateSize('./downloads');\nforeach ($task as $step) {\n    echo \"Processed\
    \ $step files so far\\n\";\n}\n\necho \"Total size: \" . $task->getReturn();\n\
    ```\n\nPrior to PHP 7, that `return $size` would have thrown an error since returning\
    \ from generators wasn’t supported. You’d have to use a workaround like this instead:\n\
    \n```\nfunction calculateSize($directory) {\n    $size = 0;\n    $count = 0;\n\
    \    foreach (scandir($directory) as $entry) {\n        if (is_file($entry)) {\n\
    \            $size += filesize($entry);\n            yield $count++;\n       \
    \ }\n    }\n\n    yield $size;\n}\n```\n\n(Ab)using the final `yield` as a return\
    \ value technically works but has two major shortcomings:\n\n*   Consumers should\
    \ be able to rely on yielded values having the same types and meanings\n\n*  \
    \ It isn’t unambiguously clear that this is a final result and no other work will\
    \ be done\n\nThis becomes especially important when you’re trying to multitask\
    \ several different processes:\n\n```\nfunction downloadAndZipAFile($url) {\n\
    \    $download = yield downloadFromInternet($url);\n\n    $zipFile = yield compressAndSave($download);\n\
    \n    yield 'user/uploads/' . $zipFile;\n}\n```\n\nIn that example, we’re yielding\
    \ three times, but only two of them are actual steps. It would be much cleaner\
    \ and easier to understand if we used a simple return instead:\n\n```\nfunction\
    \ downloadAndZipAFile($url) {\n    $download = yield downloadFromInternet($url);\n\
    \n    $zipFile = yield compressAndSave($download);\n\n    return 'user/uploads/'\
    \ . $zipFile;\n}\n```\n\n### Further Reading:\n\n*   [RFC: Generator Return Expressions](https://wiki.php.net/rfc/generator-return-expressions)\n\
    \n## Chapter 10: Generator Delegation\n\nPHP 7 introduces new `yield from` syntax\
    \ which allows generators to delegate operations to arrays, `Traversable` objects,\
    \ or even other generators. This allows work to be broken up into smaller units\
    \ of code, much like you’d break classes or functions up into several smaller\
    \ bits.\n\nThis feature allows full bi-directional communication between the delegating\
    \ generator and the sub-generator:\n\n*   Values are yielded directly through\
    \ the delegating generator to its caller\n\n*   Values sent into the delegating\
    \ generator’s `send()` method are also passed directly to the sub-generator’s\
    \ `send()` method\n\n*   Any thrown exceptions are also propogated to the delegating\
    \ generator\n\n*   Return values an be captured and passed through\n\nLet’s walk\
    \ through each of these in detail.\n\n### Yielding Values\n\nHere’s a simple example\
    \ of a generator:\n\n```\nfunction main() {\n    // Process the first value\n\
    \    yield 'a';\n\n    // Process a bunch of values\n    yield 'b';\n    yield\
    \ 'c';\n    yield 'd';\n\n    // Process one more value\n    yield 'e';\n}\n\n\
    foreach (main() as $letter) {\n    var_dump($letter);\n}\n\n/*\nstring(1) \"a\"\
    \nstring(1) \"b\"\nstring(1) \"c\"\nstring(1) \"d\"\nstring(1) \"e\"\n*/\n```\n\
    \nWhat if we wanted to break the `Processing a bunch of values` bit into a separate\
    \ generator? We can use the `yield from <expr>` syntax to do just that. This will\
    \ advance through the given traversable `<expr>`, yielding each value directly\
