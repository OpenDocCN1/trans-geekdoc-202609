    # Guide


    ## 1. [Begin Reading](#chap00.xhtml)


    # Preface


    ## Who is this book for


    This is book is for PHP developers looking to jump into PHP 7. You’ll need previous
    experience with PHP in order to understand the topics and examples we’ll cover.
    The more you know about PHP 5 and OOP, the more you’ll understand why some of
    the changes are important and how they’ll impact your development.


    If you’re a manager or leader of a team looking to work in PHP 7, this book will
    help your developers quickly catch up on all the changes they need to know, and
    even expose some features they can take advantage of for faster, better development.


    ## Contents


    [Chapter 1](#chap17.xhtml#chapter-1) summarizes the addition of scalar type hints.
    This allows your function parameters to explicitly require scalar types like `string`,
    `int`, `float`, or `bool`.


    [Chapter 2](#chap18.xhtml#chapter-2) covers the declaration of function return
    types, including the scalar types mentioned in [Chapter 1](#chap17.xhtml).


    [Chapter 3](#chap19.xhtml#chapter-3) we explore the brand new “Spaceship Operator”
    which drastically simplifies 3-way comparison of two expressions.


    [Chapter 4](#chap20.xhtml#chapter-4) introduces another new operator, the “Null
    Coalesce Operators”. It’s a lot like `?:` with a built-in `isset()` check.


    [Chapter 5](#chap21.xhtml#chapter-5) demonstrates how to easily add Unicode characters
    to strings using a new `\u{...}` escape sequence.


    [Chapter 6](#chap22.xhtml#chapter-6) reviews how anonymous classes can be used
    to create classes-the-fly, which is particularly useful for mocking and implementing
    simple interfaces (like loggers).


    [Chapter 7](#chap23.xhtml#chapter-7) highlights the new ability to include multiple
    classes from a namespace with a single `use` statement.


    [Chapter 8](#chap24.xhtml#chapter-8) introduces the new `Closure::call` method
    which drastically simplifies your closures to objects at call-time.


    [Chapter 9](#chap25.xhtml#chapter-9) shows how generator can now `return` final
    values.


    [Chapter 10](#chap26.xhtml#chapter-10) explores how generators can `yield from`
    arrays, iterators, and other generators (insert Xzit “yo daw” joke here).


    [Chapter 11](#chap27.xhtml#chapter-11) we see how PHP 7 drastically simplifies
    the process of generating random numbers for security-critical applications.


    [Chapter 12](#chap28.xhtml#chapter-12) demonstrates how to safely and easily perform
    integer division.


    [Chapter 13](#chap29.xhtml#chapter-13) unveils the new `preg_replace_callback_array`
    function for executing different callbacks per regular expression.


    [Chapter 14](#chap30.xhtml#chapter-14) covers the new `IntlChar` class, which
    helps you work with Unicode characters.


    [Chapter 15](#chap32.xhtml#chapter-15) shows how PHP 7 is dramatically faster
    than previous versions.


    [Chapter 16](#chap33.xhtml#chapter-16) describes how syntax is more consistent
    and flexible.


    [Chapter 17](#chap34.xhtml#chapter-17) explains how previously-reserved keywords
    can be used for property, constant, and method names. It contains a full list
    of such words.


    [Chapter 18](#chap35.xhtml#chapter-18) walks through the new changes to engine
    errors and exceptions.


    [Chapter 19](#chap36.xhtml#chapter-19) highlights the backwards-compatible improvements
    to the existing `assert()` feature.


    [Chapter 20](#chap37.xhtml#chapter-20) touches on how `define()` now supports
    array constants.


    [Chapter 21](#chap38.xhtml#chapter-21) demonstrates how to safely unserialize
    untrusted data by whitelisting which classes can be unserialized.


    [Chapter 22](#chap39.xhtml#chapter-22) talks about configuring session options
    by passing them into `session_start()`.


    [Chapter 23](#chap40.xhtml#chapter-23) outlines the enhancements made to the Reflection
    API.


    [Chapter 24](#chap41.xhtml#chapter-24) shows how some integer behavior has changed
    in PHP 7.


    [Chapter 25](#chap42.xhtml#chapter-25) touches on division by zero, and how it
    works in the latest version of PHP.


    [Chapter 26](#chap43.xhtml#chapter-26) covers the new JSON library used by PHP,
    including a couple minor changes it introduces.


    [Chapter 27](#chap44.xhtml#chapter-27) demonstrates the inconsistencies in PHP
    5’s `foreach` loops and how its behavior differs from PHP 7.


    [Chapter 28](#chap45.xhtml#chapter-28) describes some adjustments to the behavior
    of the `list()` construct.


    [Chapter 29](#chap46.xhtml#chapter-29) explains some of the changes made to function
    parameter behavior.


    [Chapter 30](#chap47.xhtml#chapter-30) unveils an old bug with custom session
    handlers and how PHP 7 resolves it.


    [Chapter 31](#chap48.xhtml#chapter-31) briefly touches on octals and how PHP 7
    handles invalid ones.


    [Chapter 32](#chap50.xhtml#chapter-32) discusses the deprecation of PHP 4-style
    constructors.


    [Chapter 33](#chap51.xhtml#chapter-33) covers why manual salt generation is now
    deprecated in the password hashing API.


    [Chapter 34](#chap52.xhtml#chapter-34) lists all of the previously-deprecated
    functionality which has been fully removed from PHP 7.


    [Chapter 35](#chap53.xhtml#chapter-35) talks about the removal of alternative
    PHP tags.


    [Chapter 36](#chap54.xhtml#chapter-36) describes how several `E_STRICT` notices
    have been changed to other types.


    [Chapter 37](#chap55.xhtml#chapter-37) shows how multiple `default` cases are
    no longer permitted within a `switch` block.


    [Chapter 38](#chap56.xhtml#chapter-38) demonstrates PHP 5’s inconsistent handling
    of hexadecimal strings and why that incomplete functionality was removed.


    [Chapter 39](#chap57.xhtml#chapter-39) lists the SAPIs which are no longer supported
    or maintained.


    [Chapter 40](#chap58.xhtml#chapter-40) briefly highlights the removal of that
    annoying timezone warning.


    And finally, [the last section of the book](#chap59.xhtml#bc-breaks) includes
    a detailed list of all the [breaking changes](#chap59.xhtml#bc-breaks) you’ll
    need to watch out for when migrating to PHP 7.


    ## Other resources


    These official PHP resources were a huge help during the creation of this book,
    and you may find them useful:


    *   [PHP Manual: Migrating from PHP 5.6.x to PHP 7.0.x](https://secure.php.net/manual/en/migration70.php)

    *   [PHP 7 UPGRADING doc](https://github.com/php/php-src/blob/PHP-7.0.0/UPGRADING)

