- raw: '*   `call_user_method()` and `call_user_method_array()` no longer exists.


    *   `ob_start()` no longer issues an `E_ERROR`, but instead an `E_RECOVERABLE_ERROR`
    in case an output buffer is created in an output buffer handler.


    *   The internal sorting algorithm has been improved, what may result in different
    sort order of elements that compare as equal.


    *   Removed `dl()` function on fpm-fcgi.


    *   `setcookie()` with an empty cookie name now issues an `E_WARNING` and doesn’t
    send an empty set-cookie header line anymore.


    ## Other Changes


    ### Curl


    *   Removed support for disabling the CURLOPT\_SAFE\_UPLOAD option. All curl file
    uploads must use the curl\_file / CURLFile APIs.


    ### Date


    *   Removed $is\_dst parameter from mktime() and gmmktime().


    ### DBA


    *   dba\_delete() now returns false if the key was not found for the inifile handler,
    too.


    ### GMP


    *   Requires libgmp version 4.2 or newer now.


    *   gmp\_setbit() and gmp\_clrbit() now return FALSE for negative indices, making
    them consistent with other GMP functions.


    ### Intl


    *   Removed deprecated aliases datefmt\_set\_timezone\_id() and IntlDateFormatter::setTimeZoneID().
    Use datefmt\_set\_timezone() and IntlDateFormatter::setTimeZone() instead.


    ### libxml


    *   Added LIBXML\_BIGLINES parser option. It’s available starting with libxml
    2.9.0 and adds suppport for line numbers >16-bit in the error reporting.


    ### Mcrypt


    *   Removed deprecated mcrypt\_generic\_end() alias in favor of mcrypt\_generic\_deinit().


    *   Removed deprecated mcrypt\_ecb(), mcrypt\_cbc(), mcrypt\_cfb() and mcrypt\_ofb()
    functions in favor of mcrypt\_encrypt() and mcrypt\_decrypt() with an MCRYPT\_MODE\_\*
    flag.


    ### Session


    *   session\_start() accepts all INI settings as array. e.g. \[‘cache\_limiter’⇒‘private’\]
    sets session.cache\_limiter=private. It also supports ‘read\_and\_close’ which
    closes session data immediately after read data.


    *   Save handler accepts validate\_sid(), update\_timestamp() which validates
    session ID existence, updates timestamp of session data. Compatibility of old
    user defined save handler is retained.


    *   SessionUpdateTimestampHandlerInterface is added. validateSid(), updateTimestamp()
    is defined in the interface.


    *   session.lazy\_write(default=On) INI setting enables only write session data
    when session data is updated.


    ### Opcache


    *   Removed opcache.load\_comments configuration directive. Now doc comments loading
    costs nothing and always enabled.


    ### OpenSSL


    *   Removed the “rsa\_key\_size” SSL context option in favor of automatically
    setting the appropriate size given the negotiated crypto algorithm.


    *   Removed “CN\_match” and “SNI\_server\_name” SSL context options. Use automatic
    detection or the “peer\_name” option instead.


    ### PCRE:


    *   Removed support for /e (PREG\_REPLACE\_EVAL) modifier. Use preg\_replace\_callback()
    instead.


    ### PDO\_pgsql:


    *   Removed PGSQL\_ATTR\_DISABLE\_NATIVE\_PREPARED\_STATEMENT attribute in favor
    of ATTR\_EMULATE\_PREPARES.


    ### Standard:


    *   Removed string category support in setlocale(). Use the LC\_\* constants instead.


    *   Removed set\_magic\_quotes\_runtime() and its alias magic\_quotes\_runtime().


    ### JSON:


    *   Rejected RFC 7159 incompatible number formats in json\_decode string - top
    level (07, 0xff, .1, -.1) and all levels (\[1.\], \[1.e1\])


    *   Calling json\_decode with 1st argument equal to empty PHP string or value
    that after casting to string is empty string (NULL, FALSE) results in JSON syntax
    error.


    ### Stream:


    *   Removed set\_socket\_blocking() in favor of its alias stream\_set\_blocking().


    ### XSL:


    *   Removed xsl.security\_prefs ini option. Use XsltProcessor::setSecurityPrefs()
    instead.


    # Notes


    # Part 2 - Language Changes & Improvements


