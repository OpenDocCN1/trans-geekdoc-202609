    \ of these breaks were covered in previous chapters. We’ll link back to those\
    \ as needed. This list comes directly from the `php-src` document as of November\
    \ 2015. It may not be exhaustive.\n\n## Language Changes\n\n### Variable handling\n\
    \n#### Left-to-right parsing\n\nIndirect variable, property and method references\
    \ are now interpreted with left-to-right semantics. Some examples:\n\n```\n  $foo['bar']\
    \ // interpreted as ($foo)['bar']\n  $foo->$bar // interpreted as ($foo)->$bar\n\
    \  $foo->['bar'] // interpreted as ($foo->['bar']\n  $Foo::$bar // interpreted\
    \ as ($Foo):::$bar\n```\n\nTo restore the previous behavior add explicit curly\
    \ braces:\n\n```\n  ${foo['bar']}\n  ${foo->$bar}\n  ${foo->['bar']}\n  ${Foo::$bar}\n\
    ```\n\n#### Global Keywords\n\nThe `global` keyword now only accepts variables.\
    \ Instead of `global $foo->bar`, it is now required to write the following:\n\n\
    #### Parenthesis influencing behavior\n\nParentheses around variables or function\
    \ calls no longer have any influence on behavior. For example the following code,\
    \ where the result of a function call is passed by-reference:\n\n```\n  function\
    \ getArray() { return [1, 2, 3]; }\n\n  $last = array_pop(getArray()); // Strict\
    \ Standards: Only variables should be passed by reference\n  $last = array_pop((getArray()));\
    \ // Strict Standards: Only variables should be passed by reference\n```\n\nwill\
    \ now throw a strict error regardless of whether parentheses are used. Previously\
    \ no notice was generated in the second case.\n\n#### By-reference assignment\
    \ ordering\n\nArray elements or object properties that are automatically created\
    \ during by-reference assignments will now result in a different order. For example\n\
    \n```\n  $array = [];\n  $array[\"a\"] = &$array[\"b\"];\n  $array[\"b\"] = 1;\n\
    \  var_dump($array);\n```\n\nnow results in `[\"a\" => 1, \"b\" => 1]`, while\
    \ previously the result was `[\"b\" => 1, \"a\" => 1]`.\n\n### `list()` behavior\n\
    \n#### Variable assignment\n\n`list()` will no longer assign variables in reverse\
    \ order. For example\n\n```\n  list($array[], $array[], $array[]) = [1, 2, 3];\n\
    \  var_dump($array);\n```\n\nwill now result in `$array == [1, 2, 3]` rather than\
    \ `[3, 2, 1]`. Note that only the order of assignments changed, but the assigned\
    \ values stay the same. E.g. a normal usage like\n\n```\n  list($a, $b, $c) =\
    \ [1, 2, 3];\n  // $a = 1; $b = 2; $c = 3;\n```\n\nwill retain its current behavior.\n\
    \n#### Empty list assignments\n\nEmpty `list()` assignments are no longer allowed.\
    \ As such all of the following are invalid:\n\n```\n  list() = $a;\n  list(,)\
    \ = $a;\n  list($x, , $y) = $a;\n```\n\n`list()` no longer supports unpacking\
    \ strings (while previously this was supported in some cases). The code\n\n```\n\
    \  $string = \"xy\";\n  list($x, $y) = $string;\n```\n\nwill now result in `$x\
    \ == null` and `$y == null` (without notices) instead of `$x == \"x\"` and `$y\
    \ == \"y\"`. Furthermore `list()` is now always guaranteed to work with objects\
    \ implementing `ArrayAccess`, e.g.\n\n```\n  list($a, $b) = (object) new ArrayObject([0,\
    \ 1]);\n```\n\nwill now result in `$a == 0` and `$b == 1`. Previously both `$a`\
    \ and `$b` were null.\n\n### `foreach` behavior\n\n#### Interaction with internal\
    \ array pointers\n\nIteration with `foreach()` no longer has any effect on the\
    \ internal array pointer, which can be accessed through the `current()`, `next()`/etc\
    \ family of functions. For example\n\n```\n  $array = [0, 1, 2];\n  foreach ($array\
