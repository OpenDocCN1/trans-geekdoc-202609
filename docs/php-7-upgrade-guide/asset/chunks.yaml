    * [ICU 55.1: uchar.h File Reference](https://ssl.icu-project.org/apiref/icu4c/uchar_8h.html#func-members)\n\
    \n# Part 2 - Language Changes & Improvements\n\nPHP 7 includes several major improvements\
    \ to the language, as well as some changes to existing features.\n\nLearn about\
    \ the features and changes which make PHP 7 faster and more flexible than ever!\n\
    \n## Chapter 15: Performance\n\nPHP 7 is faster than ever. Most real-world applications\
    \ will see a 100%+ boost in performance simply by upgrading! Here are some actual\
    \ benchmarks from the Zend Performance Team^([1](#chap63.xhtml#fn-zendbenchmarks)):\n\
    \n![Zend Performance Team Benchmarks](images/benchmark.png)\n\nZend Performance\
    \ Team Benchmarks\n\nThis improvement is largely due to the PHPNG (PHP Next-Gen)\
    \ project which refactored the Zend Engine to be super-performant. Some of the\
    \ under-the-hood changes include things like:\n\n* Using more-compact data structures\n\
    * Reducing the number of heap allocations and deallocations\n* Utilizing native\
    \ thread local storage\n\nThe net result is a faster PHP which also uses less\
    \ memory. These changes also pave the way for future improvements, like JIT compilation,\
    \ which will make PHP even faster.\n\n### Further Reading\n\n* [Zend: Turbocharging\
    \ the Web with PHP 7](https://www.zend.com/en/resources/php7_infographic)\n\n\
    ## Chapter 16: Consistency\n\nPHP 7’s syntax is now more consistent with other\
    \ languages, thanks to two changes:\n\n### Uniform Variable Syntax\n\nIn previous\
    \ versions, `list()` only worked with arrays. In PHP 7, it supports several types,\
    \ including objects and strings. For example, the `charName(mixed $codepoint,\
    \ int $nameChoice = IntlChar::UNICICODE_CHAR_NAME)` function and other expressions.\n\
    \n```\n// PHP 5: $array = [3, 2, 1]\n// PHP 7: $array = [1, 2, 3]\nlist($array[],\
    \ $array[], $array[]) = [1, 2, 3];\n```\n\nWhile this is a step in the right direction,\
    \ these changes do result in subtle changes to how `list()` works. Perhaps the\
    \ one you’re most likely to encounter is that `list()` now works left-to-right:\n\
    \n```php\nlist($array[], $array[], $array[]) = [1, 2, 3];\nvar_dump($array);\n\
    ```\n\nPrevious versions of PHP emit opcodes directly from the parser as it read\
    \ through code. While this worked in most cases, it sometimes led to some issues.\
    \ PHP 7 fixes this by fully decoupling the parser from the compiler by using an\
    \ Abstract Tree (AST).\n\nImplementing an AST could also enable the future implementation\
    \ of features common in other languages, such as:\n\n* Array deconstruction without\
    \ using `list`: `[$foo, $bar] = $array`\n* Python-like expressions such as `$x*$x\
    \ for $x in $list`\n* LINQ-style expressions\n\n#### Backwards Compatibility\n\
    \nAs shown above, this change will break backwards compatibility for non-standard\
    \ `list()` usage. If you need an expression to be evaluated in a certain way,\
    \ you can always use `{}`.\n\n### Abstract Tree\n\nPHP 7’s syntax is now more\
    \ consistent with other languages. In addition to making the engine easier to\
    \ maintain, it also allows several issues to be resolved:\n\n* Using `yield` in\
    \ expressions no longer requires parentheses\n* Expressions like `($foo)` now\
    \ behave identically\n* The `__clone()` magic method can be called directly\n\n\
    ## Chapter 17: Semi-Reserved Words\n\nPHP 5.x has ~64 globally-reserved words,\
    \ such as `default` and `list`. Because they’re reserved globally, it was impossible\
    \ to use these terms as class methods or properties:\n\nExample from the RFC;\
    \ these would cause syntax errors:\n\n```php\nclass Collection {\n    public function\
    \ forEach(callable $callback) { /* */ }\n    public function list() { /* */ }\n\
    }\n```\n"
  trans: "\n\nPHP 7 通过新的 [`IntlChar` 类](https://secure.php.net/manual/en/class.intlchar.php)\
    \ 暴露 ICU 的 Unicode 字符功能。该类包含 600 个常量和 59 个静态方法，我们不会涵盖它们，但这里有一些你可能会觉得有用的示例：\n\n\
    ```\n// 返回包含该字符的 Unicode 分块。\npublic static function getBlockCode(mixed $codepoint):\
    \ int;\n\n// 判断指定的代码点是否为字母字符。\nstatic public function isalpha(mixed $codepoint):\
    \ bool;\n\n// 判断指定的代码点是否为标点符号字符。\nstatic public function ispunct(mixed $codepoint):\
    \ bool;\n\n// 判断指定的代码点是否为“图形”字符\n//（可打印的，排除空格）。\nstatic public function isgraph(mixed\
    \ $codepoint): bool;\n\n// 判断指定的代码点是否为“空白”或\n//“水平空格”，即在行上可见地分隔单词的字符。\nstatic\
    \ public function isblank(mixed $codepoint): bool;\n\n// 将给定的字符映射到其小写等效字符；如果字符没有\n\
    // 小写等效字符，则返回字符本身。\nstatic public function tolower(mixed $codepoint): mixed;\n\
    \n// 获取 Unicode 字符名称。\nstatic public function charName(mixed $codepoint, int $nameChoice\
    \ = IntlChar::UNICICODE_CHAR_NAME)\n```\n\n### 向后兼容\n\n你可能无法在全局命名空间创建名为 `IntlChar`\
    \ 的类。\n\n### 扩展阅读\n\n* [RFC: IntlChar 类](https://wiki.php.net/rfc/intl.char)\n\
    * [PHP 手册：IntlChar](https://secure.php.net/manual/en/class.intlchar.php)\n* [ICU\
    \ 55.1: uchar.h 文件引用](https://ssl.icu-project.org/apiref/icu4c/uchar_8h.html#func-members)\n\
    \n# 第二部分 - 语言变化与改进\n\nPHP 7 对语言进行了多项重大改进，并对现有功能进行了一些更改。\n\n了解这些让 PHP 7 比以往任何时候都更快、更灵活的特性和变化！\n\
    \n## 第 15 章：性能\n\nPHP 7 比以往任何时候都快。大多数真实世界的应用只需升级即可看到性能提升 100% 以上！以下是来自 Zend Performance\
    \ Team^(1) 的一些实际基准测试：\n\n![Zend Performance Team Benchmark](img/benchmark.png)\n\
    \nZend Performance Team Benchmark\n\n这种改进很大程度上归功于 PHPNG (PHP 下代) 项目，该项目重构了 Zend\
    \ 引擎以实现超高性能。一些底层更改包括：\n\n* 使用更紧凑的数据结构\n* 减少堆分配和释放的次数\n* 利用原生线程本地存储\n\n最终结果是 PHP\
    \ 更快，同时也使用了更少的内存。这些更改为未来的改进铺平了道路，例如 JIT 编译，这将使 PHP 变得更快。\n\n### 扩展阅读\n\n* [Zend:\
    \ 使用 PHP 7 加速 Web 开发](https://www.zend.com/en/resources/php7_infographic)\n\n\
    ## 第 16 章：一致性\n\n得益于两项变化，PHP 7 的语法现在与其他语言更加保持一致：\n\n### 统一变量语法\n\n在之前的版本中，`list()`\
    \ 仅对数组有效。在 PHP 7 中，它支持多种类型，包括对象和字符串。例如，`charName(mixed $codepoint, int $nameChoice\
    \ = IntlChar::UNICICODE_CHAR_NAME)` 函数和其他表达式。\n\n```\n// PHP 5: $array = [3, 2,\
    \ 1]\n// PHP 7: $array = [1, 2, 3]\nlist($array[], $array[], $array[]) = [1, 2,\
    \ 3];\n```\n\n虽然这是进步的一步，但这些更改导致了 `list()` 工作方式的细微变化。你最可能遇到的是 `list()` 现在按从左到右顺序：\n\
    \n```php\nlist($array[], $array[], $array[]) = [1, 2, 3];\nvar_dump($array);\n\
    ```\n\n之前的 PHP 版本在解析器读取代码时直接生成字节码。虽然这在大多数情况下可行，但有时会导致某些问题。PHP 7 通过使用抽象语法树 (AST)\
    \ 将解析器与编译器完全解耦解决了这个问题。\n\n实现 AST 还可以为未来实现其他语言中常见的功能提供可能，例如：\n\n* 无需 `list` 的数组解构：`[$foo,\
    \ $bar] = $array`\n* Python 风格的表达式 `$x*$x for $x in $list`\n* LINQ 风格表达式\n\n####\
    \ 向后兼容\n\n如所示，此更改将破坏非标准 `list()` 用法的向后兼容性。如果你需要以特定方式评估表达式，可以使用 `{}`。\n\n### 抽象语法树\n\
    \nPHP 7 的语法现在与其他语言更加一致。除了让引擎更容易维护外，它还解决了几个问题：\n\n* 在表达式中使用 `yield` 不再需要括号\n* 像\
    \ `($foo)` 的表达式的行为现在相同\n* 可以直接调用魔方法 `__clone()`\n\n## 第 17 章：半保留字\n\nPHP 5.x 有约\
    \ 64 个全局保留字，例如 `default` 和 `list`。由于它们是全局保留的，无法将这些术语作为类方法或属性：\n\n来自 RFC 的示例，这些会导致语法错误：\n\
    \n```php\nclass Collection {\n    public function forEach(callable $callback)\
    \ { /* */ }\n    public function list() { /* */ }\n}\n```\n\n"
