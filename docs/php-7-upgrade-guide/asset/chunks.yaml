    \ changed to either perform modifications only after calling `func_get_arg(s)`\n\
    \n```php\n  function foo($x) {\n      var_dump(func_get_arg(0));\n      $x++;\n\
    \  }\n```\n\nor avoid modifying the parameters altogether:\n\n```php\n  function\
    \ foo($x) {\n      $newX = $x + 1;\n      var_dump(func_get_arg(0));\n  }\n```\n\
