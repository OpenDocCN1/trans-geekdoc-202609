    \n# 第 24 章：整数语义\n\n为了跨平台一致性，某些整数行为进行了修订，使其对开发者来说更加直观。\n\n### NaN 和无穷大的转换\n\n将\
    \ NaN (`NAN`) 和无穷大 (`INF`) 转换为整数将始终导致 `0` 值。以前，结果值是未定义的且在不同平台之间有所异。\n\n### 负数位移\n\
    \n你不再允许按负数位进行位移操作。尝试这样做将导致抛出 `ArithmeticError`。\n\n### 位移距离过远\n\n尽管某些 CPU 支持正确的回绕行为，但并非所有\
    \ CPU 都支持，这可能会导致某些边界情况。因此，PHP 7 标准了这种行为以实现跨平台一致。\n\n超出整数位宽的左位移将始终导致 `0`，即使平台支持回绕。\n\
    \n超出整数位宽的右位移将始终导致 `0` 或 `-1`（取决于符号），即使平台支持回绕。\n\n### 向后兼容\n\n在这些特定情况下，依赖旧的 PHP\
    \ 5.x 行为将不再有效。\n\n### 继续阅读\n\n* [RFC：整数语义](https://wiki.php.net/rfc/integer_semantics)\n\
    * [PHP 手册：位运算符](https://secure.php.net/manual/en/language.operators.bitwise.php)\n\
    \n# 第 25 章：除零语义\n\n在 PHP 7 之前，除以 `0` 会产生 `E_WARNING` 并返回 `false`。为算术运算返回布尔值没有太大意义，因此\
    \ PHP 7 现在会在产生 `E_WARNING` 的同时，还会返回以下浮点值之一：\n\n* `+INF`\n* `-INF`\n* `NAN`\n\n\
    例如：\n\n```php\nvar_dump(42/0);  // float(INF)  + E_WARNING\nvar_dump(-42/0); //\
    \ float(-INF) + E_WARNING\nvar_dump(0/0);   // float(NAN)  + E_WARNING\n```\n\n\
    当使用取模运算符 (`%`) 时，PHP 7 将抛出 `DivisionByZeroError`：\n\n```php\nvar_dump(0%0); //\
    \ DivisionByZeroError\n```\n\n每当你提供的有效整数参数会导致由于整数溢出而导致错误结果时，`intdiv()` 函数将抛出 `ArithmeticError`：\n\
    \n```php\nvar_dump(intdiv(PHP_INT_MIN, -1)); // ArithmeticError\n```\n\n### 向后兼容\n\
    \n* 除法运算符在除以零时不再返回 `false`。\n* 取模运算符在除以零时将抛出错误（而不是返回 `false`）。\n\n### 继续阅读\n\n\
    * [PHP 手册：DivisionByZeroError](https://secure.php.net/manual/en/class.divisionbyzeroerror.php)\n\
    * [PHP 手册：ArithmeticError](https://secure.php.net/manual/en/class.arithmeticerror.php)\n\
    \n# 第 26 章：JSON 库\n\nPHP 5 使用的 json 扩展没有免费许可证，这对于某些 Linux 发行版是一个问题。Debian 以前通过在主\
    \ PHP 代码库之外提供单独的 `php5-json` 扩展来处理这个问题。除了许可考虑，旧库还有其他几个问题：\n\n* 代码已过时\n* 没有活跃的维护者\n\
    \n（注：提供的第 26 章文本内容高度重复。我已根据初始章节处理了核心内容。）\n\n# 第 27 章：`foreach` 的行为变化\n\nPHP 的\
    \ `foreach` 具有一些奇怪的行为。这些情况中的大多数涉及指针的操作。为了提供一致的行为，修正了几个边界情况。\n\n例如，查看 RFC 中的以下两个相似示例：\n\
    \n示例 1\n\n```php\n$a = [1,2,3];\n$b = $a;\nforeach($a as $v) {\n    echo $v .\
    \ \" - \" . current($a) . \"\\n\";\n}\n```\n\n示例 1 输出：\n\n```\n1 - 2\n2 - 2\n\
    3 - 2\n```\n\n然而，如果你在循环之前进行一个小修改，就会得到不同的结果：\n\n示例 2\n\n```php\n$a = [1,2,3];\n\
    foreach($a as $v) {\n    echo $v . \" - \" . current($a) . \"\\n\";\n}\n```\n\n\
    示例 2 输出：\n\n```\n1 - 1\n2 - 1\n3 - 1\n```\n\n### 变化\n\n以下是演示 PHP 7 新语义的示例：\n\n\
    #### 按值迭代\n\n忽略对原始数组的修改\n\n```php\n$a = [1,2,3];\n$b = &$a;\n\nforeach($a as $v)\
    \ {\n    unset($a[1]);\n    echo $v . \" - \" . current($a) . \"\\n\";\n}\n```\n\
    \nPHP 5.x 输出：\n\n```\n1 - 3\n3 - 2\n```\n\nPHP 7 输出：\n\n```\n1 - 1\n2 - 1\n3 -\
    \ 1\n```\n\n#### 按引用迭代数组\n\n`current()` 函数不再受数组迭代的影响：\n\n```php\n$a = [1,2,3];\n\
    \nforeach($a as &$v) {\n    echo $v . \" - \" . current($a) . \"\\n\";\n}\n```\n\
    \nPHP 5.x 输出：\n\n```\n1 - 2\n2 - 3\n3 -\n```\n\nPHP 7 输出：\n\n```\n1 - 1\n2 - 1\n\
    3 - 1\n```\n\n#### 按值迭代对象\n\n按值迭代对象与按引用迭代数组类似，但它使用的是对象的值而不是它的引用。因此，你可以在 `foreach`\
    \ 循环中修改对象但不能替换它。\n\n#### 按引用迭代对象\n\n这与按引用迭代数组完全相同。\n\n#### 其他函数\n"
