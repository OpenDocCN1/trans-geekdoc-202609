    \n```\nforeach ($a as $b) {\n    if ($b->isActive()) {\n        return $b;\n \
    \   }\n}\n\nassert(false, 'Our loop should always return a value');\n```\n\n###\
    \ Ensuring a required extension is available\n\n```php\nfunction createThumbnail($image)\
    \ {\n    assert(extension_loaded('gd'));\n    // ...\n}\n```\n\n### Guarding against\
    \ unexpected enum values\n\n```php\nfunction setSuit($suit) {\n    case CLUBS:\n\
    \    case DIAMONDS:\n    case HEARTS:\n    case SPADES:\n        $this->suit =\
    \ $suit;\n    default:\n        assert(false, 'Unrecognized suit');\n}\n```\n\n\
    ### Fall-through expectations\n\n```php\nif ($i % 3 == 0) {\n    // ...\n} else\
    \ if ($i % 3 == 1) {\n    // ...\n} else {\n    assert ($i % 3 == 2);\n}\n```\n\
    \nBecause `assert` is a function in PHP 4/5, any expressions (like the one above)\
    \ are always evaluated, even if assertions are disabled for production! A workaround\
    \ is to wrap the expression in a string, which PHP will then evaluate if necessary:\n\
    \n```php\nassert ('$i % 3 == 2');\n```\n\nThis is somewhat better but still not\
    \ ideal.\n\n### `assert()` as a statement\n\nPHP 7 upgrades `assert()` to become\
    \ a full-fledged statement instead. You no longer need to wrap your code in a\
    \ string - just provide it as-is:\n\n```php\nassert ($i % 3 == 2);\n```\n\nUnlike\
    \ previous versions, PHP 7 will not evaluate that statement unless required.\n\
    \n### Custom errors\n\nOlder versions of PHP will raise an `E_WARNING` when an\
    \ assertion fails, using the second parameter as the warning message. PHP 7 adds\
    \ the ability to raise your own custom error types, if desired:\n\n```php\nini_set('assert.exception',\
