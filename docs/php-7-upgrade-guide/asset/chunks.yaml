    \ it is worthwhile to be aware of this difference for debugging purposes.\n\n\
    The same limitation also applies to debug\\_backtrace() and other functions inspecting\
    \ function arguments.\n\n### Integer handling\n\n#### Invalid octal literals\n\
    \nInvalid octal literals (containing digits larger than 7) now produce compile\
