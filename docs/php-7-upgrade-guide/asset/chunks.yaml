    # 第一部分 - 新功能


    ## 第 1 章：标量类型提示（Scalar Type Hints）


    PHP 5 引入了要求函数参数必须为特定类型的功能。这为非法用法提供了安全保障，例如将 UNIX 时间戳传递给期望 `DateTime` 对象的方法。它也让其他开发者更清楚地如何使用该函数。例如，比较以下带有和带有类型提示的函数签名：


    ```

