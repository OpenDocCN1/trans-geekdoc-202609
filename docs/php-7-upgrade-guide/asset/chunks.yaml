    \ delegating generator to its caller\n* Values sent into the delegating generator’s\
    \ `send()` method are also passed directly to the sub-generator’s `send()` method\n\
    * Any thrown exceptions are also propogated to the delegating generator\n* Return\
    \ values an be captured and passed through\n\nLet’s walk through each of these\
    \ in detail.\n\n### Yielding Values\n\nHere’s a simple example of a generator:\n\
    \n```\nfunction main() {\n    // Process the first value\n    yield 'a';\n\n \
