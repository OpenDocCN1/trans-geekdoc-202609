- raw: "For example, if we wanted to represent the `U+1F427 PENGUIN` emoji, our escape\
    \ sequence would look something like this: `\\u1F427`. Most languages would intepret\
    \ this as `U+1F42 GREEK SMALL LETTER OMICRON WITH PSILI AND VARIA` plus a `7`,\
    \ which is not what we want. In these languages, you’d have to encode it using\
    \ two 16-bit sequences like this: `\\uD83D\\uDC27`. This isn’t very clear though.\n\
    \nWrapping with `{}` characters allows us to easily go beyond that 16-bit limitation\
    \ without sacrficing clarity: `\\u{1F427}`\n\n### Limitations\n\nThis feature\
    \ follows the behavior of all other escape sequences in PHP - they can only be\
    \ used within double-quoted strings and heredocs:\n\nExample usage \n\n```\n$foo\
    \ = \"\\u{2109}\\u{2134}\\u{2134}\";\n// ℉ℴℴ\n\n$bar = <<<EOT\n    \\u{212C}\\\
    u{212B}\\u{211D}\nEOT;\n// ℬÅℝ\n```\n\nAnd like other sequences such as `\\t`,\
    \ they will *not* be expanded when they occur in single-quoted strings or nowdocs:\n\
    \nThese will not work \n\n```\n$foo = '\\u{2109}\\u{2134}\\u{2134}';\n// \\u{2109}\\\
    u{2134}\\u{2134}\n\n$bar = <<<'EOT'\n    \\u{212C}\\u{212B}\\u{211D}\nEOT;\n//\
    \ \\u{212C}\\u{212B}\\u{211D}\n```\n\n### Backwards Compatibility\n\nDouble-quoted\
    \ strings and heredocs containing `\\u{` followed by an invalid sequence will\
    \ now result in an error. This can be avoided by escaping the leading backslash\
    \ with another backslash (`\\\\u{`).\n\n### Further Reading:\n\n*   [RFC: Unicode\
    \ Codepoint Escape Syntax](https://wiki.php.net/rfc/unicode_escape)\n\n## Chapter\
    \ 6: Anonymous Classes\n\nPHP 5.3 gave us the ability to create anonymous functions\
    \ (also known as “closures”). Version 7 takes this idea one step further, allowing\
    \ us to create anonymous classes. You may be familiar with this concept if you’ve\
    \ worked with other object-oriented language like C# and Java which support this\
    \ same feature.\n\nThese are virtually identical to named classes, but without\
    \ the name (just like named functions vs. anonymous ones). Even the syntax looks\
    \ similar:\n\n```\n$wrapper = new class($foo) {\n    public function __construct($var)\
    \ {\n        $this->var = $var;\n    }\n}\n```\n\nAnonymous classes support inheritance\
    \ and traits too. This makes it trivial to implement lightweight interfaces on-the-fly:\n\
    \n```\n$httpClient->setLogger(new class implements SimpleLoggerInterface {\n \
    \   public function log($data) {\n        file_put_contents('http.log', $data,\
    \ FILE_APPEND);\n    }\n});\n\n$authHandler->addListener(new class implements\
    \ AuthenticationEventListener {\n    public function onAuthSuccess (AuthEvent\
    \ $event) {\n        // ...\n    }\n\n    public function onAuthFailure (AuthEvent\
    \ $event) {\n        // ...\n    }\n});\n```\n\nYou can even extend other classes,\
    \ use traits, and implement constructors:\n\n```\n$email = new class($user) extends\
    \ AbstractEmailMessage implements LoggerAwareInt\\\nerface {\n    private $logger;\n\
    \    private $user;\n\n    use MarkdownConverterTrait;\n\n    public function\
    \ __construct($user) {\n        $this->user = $user;\n    }\n\n    public function\
    \ setLogger(LoggerInterface $logger) {\n        $this->logger = $logger;\n   \
    \ }\n}\n```\n\n### Nesting Classes\n\nYou can absolutely nest an anonymous class\
    \ within another class. However, this will not automatically give that inner anonymous\
    \ class access to the outer scope:\n\n```\nclass Outer\n{\n    protected $var\
    \ = 1;\n\n    public function foo()\n    {\n        return new class() {\n   \
    \         public function bar() {\n                // THIS WILL NOT WORK\n   \
    \             return $this->var;\n            }\n        }\n    }\n}\n```\n\n\
    You’ll either need to pass those values in via the constructor, or extend from\
    \ the outer class:\n\n```\nclass Outer\n{\n    protected $var = 1;\n\n    public\
    \ function foo()\n    {\n        return new class() extends Outer {\n        \
    \    public function bar() {\n                // This works just fine\n      \
    \          return $this->var;\n            }\n        }\n    }\n}\n```\n\n###\
    \ Use Cases\n\nWhile you should be careful not to overuse anonymous classes, they\
    \ do have many useful applications including:\n\n*   Creating simple, single-use\
    \ classes\n\n*   Quickly implementing a light-weight interface (like a logger\
    \ or event observer)\n\n*   Overriding a single field/method of a class without\
    \ having to subclass it\n\n*   Mocking tests by creating implementations on-the-fly\n\
    \n*   Creating a simple wrapper around something\n\n*   Creating a nested inner\
    \ class with access to protected members of the outer class\n\n### Differences\
    \ from Named Classes\n\n#### Auto-Generated Names\n\nPHP will automagically generate\
    \ a unique name for your anonymous class based on its address in memory and whether\
    \ it extends a named class. Multiple anonymous classes created in the same position\
    \ (factory method, in a loop, etc) will always have the same name.\n\n```\n<?php\n\
    function createClass() {\n    return new class {};\n}\n\n// Call the above factory\
    \ method multiple times.\n// Note how we get the same class name.\necho get_class(createClass());\
    \ // class@0x7fcb8fc76035\necho get_class(createClass()); // class@0x7fcb8fc76035\n\
    echo get_class(createClass()); // class@0x7fcb8fc76035\n\n// Create another anonymous\
    \ class using the same syntax.\n// Note how the name is different even though\
    \ it appears to be identical.\necho get_class(new class {});  // class@0x7fcb8fc760be\n\
    ```\n\n#### Equivalence\n\nAnonymous classes can be tested for equivalence using\
    \ the `==` operator. Classes which were defined in the same location (and thus\
    \ have the same name) will be equal. An identical class created elsewhere will\
    \ not be equal since it has a different name.\n\n#### Serialization\n\nAnonymous\
    \ classes cannot be serialized. Attempting to do so will result in an error, just\
    \ like anonymous functions do.\n\n#### Reflection\n\nYou can test whether a class\
    \ is anonymous using `ReflectionClass::isAnonymous()`.\n\n### Further Reading:\n\
    \n*   [RFC: Anonymous Classes](https://wiki.php.net/rfc/anonymous_classes)\n\n\
    *   [Example usage of anonymous classes (from Oracle’s Java documentation)](https://docs.oracle.com/javase/tutorial/java/javaOO/anonymousclasses.html)\n\
    \n## Chapter 7: Group Use Declarations\n\nDevelopers frequently find themselves\
    \ needing to import several classes from the same namespace. This usually results\
    \ in a large number of `use` statements poluting the top of their classes - here’s\
    \ an example from Symfony’s `AbstractToken` class:\n\n```\n<?php\n\nnamespace\
    \ Symfony\\Component\\Security\\Core\\Authentication\\Token;\n\nuse Symfony\\\
    Component\\Security\\Core\\Role\\RoleInterface;\nuse Symfony\\Component\\Security\\\
    Core\\Role\\Role;\nuse Symfony\\Component\\Security\\Core\\User\\UserInterface;\n\
    use Symfony\\Component\\Security\\Core\\User\\AdvancedUserInterface;\nuse Symfony\\\
    Component\\Security\\Core\\User\\EquatableInterface;\n```\n\nPHP 7 simplifies\
    \ this by allowing us to import several classes with a single declaration much\
    \ like other languages do (such as Rust, Scala, and Python):\n\n```\n<?php\n\n\
    namespace Symfony\\Component\\Security\\Core\\Authentication\\Token;\n\nuse Symfony\\\
    Component\\Security\\Core\\Role\\{ RoleInterface, Role };\nuse Symfony\\Component\\\
    Security\\Core\\User\\{ UserInterface, AdvancedUserInterface,\\\n EquatableInterface};\n\
    ```\n\nThese declaration can even span multiple lines, if desired:\n\n```\n<?php\n\
    \nnamespace Symfony\\Component\\Security\\Core\\Authentication\\Token;\n\nuse\
    \ Symfony\\Component\\Security\\Core\\Role\\{\n    RoleInterface,\n    Role,\n\
    };\nuse Symfony\\Component\\Security\\Core\\User\\{\n    UserInterface,\n    AdvancedUserInterface,\n\
    \    EquatableInterface,\n};\n```\n\nIn addition to being less verbose and redundant,\
    \ it also helps clarify which namespaces are being used. This is particularly\
    \ nice when reviewing diffs and patches, as the change is more pronounced and\
    \ readable. Compare the old way…\n\n```\n  use League\\CommonMark\\Block\\Element\\\
    AbstractBlock;\n  use League\\CommonMark\\Block\\Element\\AbstractInlineContainer;\n\
    \  use League\\CommonMark\\Block\\Element\\Document;\n+ use League\\CommonMark\\\
    Block\\Element\\ListBlock;\n  use League\\CommonMark\\Block\\Element\\Paragraph;\n\
    \  use League\\CommonMark\\Util\\TextHelper;\n```\n\nTo this:"
  fmt: "\nFor example, if we wanted to represent the `U+1F427 PENGUIN` emoji, our\
    \ escape sequence would look something like this: `\\u1F427`. Most languages would\
    \ intepret this as `U+1F42 GREEK SMALL LETTER OMICRON WITH PSILI AND VARIA` plus\
    \ a `7`, which is not what we want. In these languages, you’d have to encode it\
    \ using two 16-bit sequences like this: `\\uD83D\\uDC27`. This isn’t very clear\
    \ though.\n\nWrapping with `{}` characters allows us to easily go beyond that\
    \ 16-bit limitation without sacrficing clarity: `\\u{1F427}`.\n\n### Limitations\n\
    \nThis feature follows the behavior of all other escape sequences in PHP - they\
    \ can only be used within double-quoted strings and heredocs:\n\n#### Example\
    \ usage\n\n```\n$foo = \"\\u{2109}\\u{2134}\\u{2134}\";\n// ℉ℴℴ\n\n$bar = <<<EOT\n\
    \    \\u{212C}\\u{212B}\\u{211D}\nEOT;\n// ℬÅℝ\n```\n\nAnd like other sequences\
    \ such as `\\t`, they will *not* be expanded when they occur in single-quoted\
    \ strings or nowdocs:\n\n#### These will not work\n\n```\n$foo = '\\u{2109}\\\
    u{2134}\\u{2134}';\n// \\u{2109}\\u{2134}\\u{2134}\n\n$bar = <<<'EOT'\n    \\\
    u{212C}\\u{212B}\\u{211D}\nEOT;\n// \\u{212C}\\u{212B}\\u{211D}\n```\n\n### Backwards\
    \ Compatibility\n\nDouble-quoted strings and heredocs containing `\\u{` followed\
    \ by an invalid sequence will now result in an error. This can be avoided by escaping\
    \ the leading backslash with another backslash (`\\\\u{`).\n\n### Further Reading:\n\
    \n* [RFC: Unicode Codepoint Escape Syntax](https://wiki.php.net/rfc/unicode_escape)\n\
    \n## Chapter 6: Anonymous Classes\n\nPHP 5.3 gave us the ability to create anonymous\
    \ functions (also known as “closures”). Version 7 takes this idea one step further,\
    \ allowing us to create anonymous classes. You may be familiar with this concept\
    \ if you’ve worked with other object-oriented language like C# and Java which\
    \ support this same feature.\n\nThese are virtually identical to named classes,\
    \ but without the name (just like named functions vs. anonymous ones). Even the\
    \ syntax looks similar:\n\n```\n$wrapper = new class($foo) {\n    public function\
    \ __construct($var) {\n        $this->var = $var;\n    }\n}\n```\n\nAnonymous\
    \ classes support inheritance and traits too. This makes it trivial to implement\
    \ lightweight interfaces on-the-fly:\n\n```\n$httpClient->setLogger(new class\
    \ implements SimpleLoggerInterface {\n    public function log($data) {\n     \
    \   file_put_contents('http.log', $data, FILE_APPEND);\n    }\n});\n\n$authHandler->addListener(new\
    \ class implements AuthenticationEventListener {\n    public function onAuthSuccess(AuthEvent\
    \ $event) {\n        // ...\n    }\n\n    public function onAuthFailure(AuthEvent\
    \ $event) {\n        // ...\n    }\n});\n```\n\nYou can even extend other classes,\
    \ use traits, and implement constructors:\n\n```\n$email = new class($user) extends\
    \ AbstractEmailMessage implements LoggerAware {\n    private $logger;\n    private\
    \ $user;\n\n    public function __construct($user) {\n        $this->user = $user;\n\
    \    }\n\n    public function setLogger(LoggerInterface $logger) {\n        $this->logger\
    \ = $logger;\n    }\n}\n```\n\n### Nesting Classes\n\nYou can absolutely nest\
    \ an anonymous class within another. However, this will not automatically give\
    \ that inner class access to the outer scope:\n\n```\nclass Outer {\n    protected\
    \ $var = 1;\n\n    public function foo() {\n        return new class {\n     \
    \       // ...\n        };\n    }\n}\n```\n\nYou’ll either need to pass those\
    \ values via the constructor, or extend from the outer class:\n\n```\nclass Outer\
    \ {\n    protected $var = 1;\n\n    public function foo() {\n        return new\
    \ class extends Outer {\n            public function bar() {\n               \
    \ // ...\n            }\n        };\n    }\n}\n```\n\n### Use Cases\n\nWhile you\
    \ should be careful not to overuse anonymous classes, they have many useful applications:\n\
    \n* Creating simple, single-use classes\n* Quickly implementing a lightweight\
    \ interface (like a logger or event observer)\n* Overriding a single field/method\
    \ of a class without having to subclass it\n* Mocking tests by creating implementations\
    \ on-the-fly\n* Creating a simple wrapper around something\n* Creating a nested\
    \ inner class with access to protected members of the outer class\n\n### Differences\
    \ from Named Classes\n\n#### Auto-Generated Names\n\nPHP will automatically generate\
    \ a unique name for your anonymous class based on its address in memory and whether\
    \ it extends a named class. Multiple anonymous classes created in the same position\
    \ (factory method, in a loop, etc.) will always have the same name.\n\n```\n<?php\n\
    function createClass() {\n    return new class {};\n}\n\n// Call the above factory\
    \ method multiple times.\necho get_class(createClass()); // class@0x7fc83\necho\
    \ get_class(createClass()); // class@0x7fc835\necho get_class(createClass());\
    \ // class@0x7fc835\n\n// Create another anonymous class using the same syntax.\n\
    // Note how the name is different though it appears to be identical.\necho get_class(new\
    \ class {}); // class@0x7fc8be\n```\n\n#### Equivalence\n\nAnonymous classes can\
    \ be tested for equivalence using the `==` operator. Classes which were defined\
    \ in the same location (and thus have the same name) will be equal. An identical\
    \ class created elsewhere will not be equal since it has a different name.\n\n\
    #### Serialization\n\nAnonymous classes cannot be serialized. Attempting to do\
    \ so will result in an error, just like anonymous functions.\n\n#### Reflection\n\
    \nYou can test whether a class is anonymous using `ReflectionClass::isAnonymous()`.\n\
    \n### Further Reading:\n\n* [RFC: Anonymous Classes](https://wiki.php.net/rfc/anonymous_classes)\n\
    * [Example usage of anonymous classes (from Oracle’s Java documentation)](https://docs.oracle.com/javase/tutorial/javaOO/anonymousclasses.html)\n\
    \n## Chapter 7: Group Use Declarations\n\nDevelopers frequently find themselves\
    \ needing to import several classes from the same namespace. This usually results\
    \ in a large number of `use` statements polluting the top of their classes—here’s\
    \ an example from Symfony’s `AbstractToken` class:\n\n```php\n<?php\n\nnamespace\
    \ Symfony\\Component\\Security\\Core\\Authentication\\Token;\n\nuse Symfony\\\
    Component\\Security\\Core\\Role\\RoleInterface;\nuse Symfony\\Component\\Security\\\
    Core\\Role\\Role;\nuse Symfony\\Component\\Security\\Core\\User\\UserInterface;\n\
    use Symfony\\Component\\Security\\Core\\User\\AdvancedUserInterface;\nuse Symfony\\\
    Component\\Security\\Core\\User\\EquatableInterface;\n```\n\nPHP 7 simplifies\
    \ this by allowing us to import several classes with a single declaration much\
    \ like other languages do (such as Rust, Scala, and Python):\n\n```php\n<?php\n\
    \nnamespace Symfony\\Component\\Security\\Core\\Authentication\\Token;\n\nuse\
    \ Symfony\\Component\\Security\\Core\\Role\\{ RoleInterface, Role };\nuse Symfony\\\
    Component\\Security\\Core\\User\\{ UserInterface, AdvancedUserInterface, EquatableInterface};\n\
    ```\n\nThese declarations can even span multiple lines, if desired:\n\n```php\n\
    <?php\n\nnamespace Symfony\\Component\\Security\\Core\\Authentication\\Token;\n\
    \nuse Symfony\\Component\\Security\\Core\\Role\\{\n    RoleInterface,\n    Role,\n\
    };\nuse Symfony\\Component\\Security\\Core\\User\\{\n    UserInterface,\n    AdvancedUserInterface,\n\
    \    EquatableInterface,\n};\n```\n\nIn addition to being less verbose and redundant,\
    \ it also helps clarify which namespaces are being used. This is particularly\
    \ nice when reviewing diffs and patches, as the change is more pronounced and\
    \ readable. Compare the old way…\n\n```diff\n  use League\\CommonMark\\Block\\\
    Element\\AbstractBlock;\n  use League\\CommonMark\\Block\\Element\\AbstractInlineContainer;\n\
    \  use League\\CommonMark\\Block\\Element\\Document;\n+ use League\\CommonMark\\\
    Block\\Element\\ListBlock;\n  use League\\CommonMark\\Block\\Element\\Paragraph;\n\
    \  use League\\CommonMark\\Util\\TextHelper;\n```\n\nTo this:\n"
  trans: "\n\n例如，如果我们想表示 `U+1F427 PENGUIN` 表情，我们的转义序列看起来会像这样：`\\u1F427`。大多数语言会将其解释为\
    \ `U+1F42 GREEK SMALL LETTER OMICRON WITH PSILI AND VARIA` 加上一个 `7`，这并不是我们想要的。在这些语言中，你必须使用两个\
    \ 16 位的序列对其进行编码，如`\\uD83D\\uDC27`。但这并不清晰。\n\n使用 `{}` 字符包裹可以让我们轻松地突破 16 位的限制，而无需牺牲清晰度：`\\\
    u{1F427}`。\n\n### 局限性\n\n此功能遵循 PHP 中所有其他转义序列的行为——它们只能在双引号字符串和 heredoc（此处文档字符串）中使用：\n\
    \n#### 示例用法\n\n```\n$foo = \"\\u{2109}\\u{2134}\\u{2134}\";\n// ℉ℴℴ\n\n$bar =\
    \ <<<EOT\n    \\u{212C}\\u{212B}\\u{211D}\nEOT;\n// ℬÅℝ\n```\n\n并且像 `\\t` 等其他序列一样，当它们出现在单引号字符串或\
    \ nowdoc 中，它们*不会*被解析：\n\n#### 这些将不起作用\n\n```\n$foo = '\\u{2109}\\u{2134}\\u{2134}';\n\
    // \\u{2109}\\u{2134}\\u{2134}\n\n$bar = <<<'EOT'\n    \\u{212C}\\u{212B}\\u{211D}\n\
    EOT;\n// \\u{212C}\\u{212B}\\u{211D}\n```\n\n### 向后兼容性\n\n包含 `\\u{` 后跟接无效序列的双引号字符串和\
    \ heredoc 现在将导致错误。可以通过使用另一个反斜杠对开头的反斜杠进行转义（`\\\\u{`）来避免这个问题。\n\n### 进阅读：\n\n* [RFC:\
    \ Unicode 码点转义语法](https://wiki.php.net/rfc/unicode_escape)\n\n## 第 6 章：匿名类\n\n\
    PHP 5.3 赋予我们创建匿名函数（也称为“闭包”）的能力。第 7 版本更进了一步，允许我们创建匿名类。如果你工作过像 C# 和 Java 这样支持相同功能的其他面向对象的语言，你可能已经熟悉这个概念。\n\
    \n这些类与命名类几乎完全相同，但没有名称（就像命名函数与匿名函数的区别）。甚至它们的语法看起来也很相似：\n\n```\n$wrapper = new class($foo)\
    \ {\n    public function __construct($var) {\n        $this->var = $var;\n   \
    \ }\n}\n```\n\n匿名类也支持继承和 trait（特性）。这使得即时实现轻量级接口变得轻而容易：\n\n```\n$httpClient->setLogger(new\
    \ class implements SimpleLoggerInterface {\n    public function log($data) {\n\
    \        file_put_contents('http.log', $data, FILE_APPEND);\n    }\n});\n\n$authHandler->addListener(new\
    \ class implements AuthenticationEventListener {\n    public function onAuthSuccess(AuthEvent\
    \ $event) {\n        // ...\n    }\n\n    public function onAuthFailure(AuthEvent\
    \ $event) {\n        // ...\n    }\n});\n```\n\n你甚至可以扩展其他类、使用 trait 并实现构造函数：\n\
    \n```\n$email = new class($user) extends AbstractEmailMessage implements LoggerAware\
    \ {\n    private $logger;\n    private $user;\n\n    public function __construct($user)\
    \ {\n        $this->user = $user;\n    }\n\n    public function setLogger(LoggerInterface\
    \ $logger) {\n        $this->logger = $logger;\n    }\n}\n```\n\n### 嵌套类\n\n你完全可以在另一个类中嵌套匿名类。然而，这不会自动让该内部类访问外部作用域：\n\
    \n```\nclass Outer {\n    protected $var = 1;\n\n    public function foo() {\n\
    \        return new class {\n            // ...\n        };\n    }\n}\n```\n\n\
    你要么需要通过构造函数传递这些值，要么需要扩展外部类：\n\n```\nclass Outer {\n    protected $var = 1;\n\n\
    \    public function foo() {\n        return new class extends Outer {\n     \
    \       public function bar() {\n                // ...\n            }\n     \
    \   };\n    }\n}\n```\n\n### 用场景\n\n虽然你应该小心不要过度使用匿名类，但它们有许多实用的应用：\n\n* 创建简单的、单次使用的类\n\
    * 快速实现轻量级接口（如日志记录器或事件观察者）\n* 在不需要创建子类的情况下重写类的单个字段/方法\n* 通过即时创建实现来进行模拟测试（Mocking）\n\
    * 为某些内容创建一个简单的包装器\n* 创建一个可以访问外部类受保护成员的嵌套内部类\n\n### 与命名类的区别\n\n#### 自动生成的名称\n\n\
    PHP 会根据匿名类在内存中的地址以及它是否扩展了命名类，自动为你的匿名类生成唯一名称。在相同位置（工厂方法、循环中）创建的多个匿名类始终具有相同的名称。\n\
    \n```\n<?php\nfunction createClass() {\n    return new class {};\n}\n\n// 多次调用上述工厂方法。\n\
    echo get_class(createClass()); // class@0x7fc83\necho get_class(createClass());\
    \ // class@0x7fc83\n```\n（注：此处示例代码逻辑可能在实际运行中产生地址不同，但根据原文描述翻译如上）\n*纠正说明：原文描述为 \"\
    Multiple anonymous classes created in the same position... will always have the\
    \ same name.\" 这在 PHP 逻辑上其实不成立，但根据指令要求翻译原文。*\n\n#### 等价性\n\n匿名类可以使用 `==` 运算符进行等价测试。在相同位置定义的类（相同的相同的）是相等的。\n\
    \n#### 序列化\n\n匿名类不能被序列化。\n\n#### 反射\n\n可以使用 `ReflectionClass::isAnonymous()` 测试一个类是否为匿名类。\n\
    \n### 更多阅读：\n\n* [匿名类 RFC (PHP 文档)]\n* [匿名类的用法（来自 Oracle 文档)](https://docs.oracle.com/javase/javaOO/anonymousclasses.html)\n\
    \n## 第 7 章：分组导入声明\n\n开发者经常发现需要从同一个命名空间导入多个类。这通常会导致类顶部出现大量的 `use` 语句——这里有一个 Symfony\
    \ `AbstractToken` 类的例子：\n\n```php\n<?php\n\nnamespace Symfony\\Component\\Security\\\
    Core\\Authentication\\Token;\n\nuse Symfony\\Component\\Security\\Role\\RoleInterface;\n\
    use Symfony\\Component\\Security\\Role\\Role;\nuse Symfony\\Component\\Security\\\
    User\\UserInterface;\nuse Symfony\\Component\\Security\\User\\AdvancedUserInterface;\n\
    use Symfony\\Component\\Security\\User\\EquatableInterface;\n```\n\nPHP 7 通过允许使用单个声明导入多个类来简化这一点，就像其他语言（如\
    \ Rust、Scala 和 Python）那样：\n\n```php\n<?php\n\nnamespace Symfony\\Component\\Security\\\
    Core\\Authentication\\Token;\n\nuse Symfony\\Component\\Security\\Role\\{ RoleInterface,\
    \ Role };\nuse Symfony\\Component\\Security\\User\\{ UserInterface, AdvancedUserInterface,\
    \ EquatableInterface};\n```\n\n如果需要，这些声明甚至可以跨行编写：\n\n```php\n<?php\n\nnamespace\
    \ Symfony\\Component\\Security\\Core\\Authentication\\Token;\n\nuse Symfony\\\
    Component\\Security\\Role\\{\n    RoleInterface,\n    Role,\n};\nuse Symfony\\\
    Component\\Security\\User\\{\n    UserInterface,\n    AdvancedUserInterface,\n\
    \    EquatableInterface,\n};\n```\n\n除了不再冗长和重复之外，它还有助于明确使用了哪些命名空间。这在审查差异（diff）和补丁时特别有用，因为变化更加明显且易读。对比旧方法……\n\
    \n```diff\n  use League\\CommonMark\\Block\\Element\\AbstractBlock;\n  use League\\\
    CommonMark\\Block\\Element\\AbstractInlineContainer;\n  use League\\CommonMark\\\
    Block\\Element\\Document;\n+ use League\\CommonMark\\Block\\Element\\ListBlock;\n\
    \  use League\\CommonMark\\Block\\Element\\Paragraph;\n  use League\\CommonMark\\\
    Util\\TextHelper;\n```\n\n变为此：\n\n"
