    \n#### Hexadecimal numeric strings\n\nStrings that contain hexadecimal numbers\
    \ are no longer considered to be numeric and don’t receive special treatment.\
    \ Some examples:\n\n```php\n  is_numeric(\"0x123\"); // bool(false)\n  is_numeric(\"\
