    \ `default`s will now result in a fatal error. Simply removing the earlier instances\
    \ will maintain full compatibility with PHP 5.x and 7.x.\n\n### Further Reading\n\
    \n*   [RFC: Make defining multiple default cases in a switch a syntax error](https://wiki.php.net/rfc/switch.default.multiple)\n\
    \n## Chapter 38: Removal of Numeric Hexadecimal String Support\n\nEarlier versions\
    \ of PHP do not consistently handle numeric hexadecimal strings like `\"0x123\"\
    `:\n\nPHP 5.x behavior "
