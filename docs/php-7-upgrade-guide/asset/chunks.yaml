- raw: "These hints were initially limited to just classes and interfaces, but was\
    \ soon expanded to allow `array` and `callable` types too. PHP 7 extends this\
    \ further by allowing scalar types like `int`, `float`, `string` and `bool`:\n\
    \n```\n// Scalar type hint (PHP 7):\nfunction getNextWeekday(int $date) { /*...*/\
    \ }\n```\n\n### Type Checking Modes\n\nPHP’s flexible type system is one of its\
    \ most-useful features, allowing numeric strings to be used as integers and vice-versa.\
    \ This tradition is continued in PHP 7 but now you have the option of enabling\
    \ strict type enforcement like you’d see in other languages (such as Java or C#).\
    \ This setting can be enabled using the [`declare` construct](https://php.net/manual/en/control-structures.declare.php).\n\
    \n#### Weak (“Coercive”) Type Checking\n\n“Coercive” mode is the default type\
    \ checking mode in PHP 7. This is identical to how previous versions of PHP handled\
    \ scalar type hints for built-in functions. For example, take a look at the method\
    \ signature for the `floor` function:\n\n```\nfloat floor ( float $value )\n```\n\
    \nWhen you pass in numeric strings or integers PHP auto-converts them to a float\
    \ automatically. This behavior has simply been extended to userland functions\
    \ as well.\n\nHere’s a table showing which scalar types are accepted in “Coercive”\
    \ mode based on the declared type:\n\nAllowed types, coercive mode\n\n| Type declaration\
    \ || int || float || string || bool || object |\n\n| --- | --- | --- | --- | ---\
    \ | --- |\n\n| int || yes || yes\\* || yes† || yes || no |\n\n| --- | --- | ---\
    \ | --- | --- | --- |\n\n| float || yes || yes || yes† || yes || no |\n\n| string\
    \ || yes || yes || yes || yes || yes‡ |\n\n| bool || yes || yes || yes || yes\
    \ || no |\n\n    \\* Only non-`NaN` floats between `PHP_INT_MIN` and `PHP_INT_MAX`\
    \ accepted.\n\n    † If it’s a numeric string\n\n    ‡ Only if object has a `__toString()`\
    \ method\n\n#### Strong (“Strict”) Type Checking\n\nPHP 7 introduces a new “strict”\
    \ mode which is enabled by placing `declare(strict_types=1);` at the top of your\
    \ script like so:\n\n```\n<?php\ndeclare(strict_types=1);\n\nfunction welcome(string\
    \ $name) {\n    echo 'Hello ' . $name;\n}\n\nwelcome('World'); // Prints: Hello\
    \ World\n```\n\nThis declaration enables strict mode for all uses in the entire\
    \ file, including built-in PHP function calls and return values (see next chapter).\
    \ It does not affect any included files nor any other files which include it.\n\
    \nStrict mode essentially requires you to pass in exact types declared. If you\
    \ don’t, a `TypeError` will be thrown. For example, in strict mode, you cannot\
    \ use numeric strings when a `float` or `int` is expected (like you can in weak/coercive\
    \ mode):\n\nThis throws an error in strict mode \n\n```\n<?php\ndeclare(strict_types=1);\n\
    \nfunction welcome(string $name) {\n    echo 'Hello ' . $name;\n}\n\nwelcome(3);\n\
    \n// Fatal error: Uncaught TypeError: Argument 1 passed to welcome() must be of\
    \ th\\\ne type string, integer given\n```\n\nThere’s one exception to this rule\
    \ though, which is that `float` declarations can accept `int` values:\n\nScope\
    \ widening example \n\n```\n<?php\ndeclare(strict_types=1);\n\nfunction add(float\
    \ $a, float $b): float {\n    return $a + $b;\n}\n\nadd(1, 2); // float(3)\n```\n\
    \nAllowed types, strict mode\n\n| Type declaration || int || float || string ||\
    \ bool || object |\n\n| --- | --- | --- | --- | --- | --- |\n\n| int || yes ||\
    \ no || no || no || no |\n\n| --- | --- | --- | --- | --- | --- |\n\n| float ||\
    \ yes\\* || yes || no || no || no |\n\n| string || no || no || yes || no || no\
    \ |\n\n| bool || no || no || no || yes || no |\n\n    \\* Allowed due to widening\
    \ primitive conversion\n\n### Mixing Modes\n\nBecause the directive is set per-file,\
    \ it’s entirely possible to mix modes in your application. For example, your strictly-checked\
    \ app could use a weakly-checked library (or vice versa) without any issues or\
    \ complications.\n\n### Backwards Compatibility\n\nYou may no longer create classes\
    \ named `int`, `float`, `string` or `bool` as these would conflict with the new\
    \ scalar type hints.\n\n### Further Reading\n\n*   [RFC: Scalar Type Declarations](https://wiki.php.net/rfc/scalar_type_hints_v5)\n\
    \n*   [PHP Documentation: Type Hinting](https://php.net/manual/en/language.oop5.typehinting.php)\n\
    \n## Chapter 2: Return Type Declarations\n\nIn the previous chapter we saw how\
    \ method parameters can have declared types. With PHP 7 you can also declare what\
    \ type your method will return. This is done by placing a colon (`:`) and the\
    \ return type just before the opening curly brace (`{`) like so:\n\n```\nfunction\
    \ getAuthor(): UserInterface {\n    return $this->comment->getUser();\n}\n```\n\
    \nIf you accidentally return something different, like a `string` or a `BlogComment`,\
    \ PHP will throw a TypeError:\n\n```\nfunction getAuthor(): UserInterface {\n\
    \    // Let's pretend we forgot the \"->getUser()\" part:\n    return $this->comment;\n\
    }\n\ngetAuthor();\n\n// Uncaught TypeError: Return value of getAuthor() must be\
    \ an instance of UserIn\\\nterface, instance of BlogComment returned\n```\n\n\
    This guarantees that your code will always be working with the expected types.\n\
    \nThis feature is completely optional though - your PHP 5 style functions will\
    \ continue to work as usual.\n\n### Returning `null`\n\nMethods with declared\
    \ return types are **never** allowed to return `null`. Doing so will cause a `Catchable\
    \ fatal error` to be thrown:\n\n```\nclass User\n{\n    public function getBirthday():\
    \ \\DateTime {\n        return null;\n    }\n}\n\n$user = new User();\n$d = $user->getBirthday();\n\
    \n// Uncaught TypeError: Return value of User::getBirthday() must be an instance\
    \ o\\\nf DateTime, null returned\n```\n\nThis matches the behavior of method argument\
    \ types where `null` cannot be used (unless it’s a default value).\n\n```\nclass\
    \ Event\n{\n    public function setDate(\\DateTime $date) {\n        // ...\n\
    \    }\n}\n\n$birthdayParty = new Event();\n$birthdayParty->setDate(null);\n\n\
    // Uncaught TypeError: Argument 1 passed to Event::setDate() must be an instance\\\
    \n of DateTime, null given\n```\n\nIt also eliminates the need to litter your\
    \ code with `null` checks (a problem frequently encountered in languages like\
    \ Java).\n\nEven though `null` return values aren’t currently allowed, there is\
    \ a [Nullable Types RFC](https://wiki.php.net/rfc/nullable_types) which may provide\
    \ this ability in the future.\n\n### Sub-Class Methods\n\nOverridden methods in\
    \ sub-classes must declare the same exact type as the parent method. For example,\
    \ given the following method:\n\n```\nabstract class VehicleFactory\n{\n    static\
    \ function create(): Vehicle {\n        // ...\n    }\n}\n```\n\nAny classes which\
    \ extend `VehicleFactory` and override the `create()` method **must** use the\
    \ same `Vehicle` return type:\n\n```\nclass CarFactory extends VehicleFactory\n\
    {\n    static function create(): Vehicle {\n        // ...\n    }\n}\n\nclass\
    \ TruckFactory extends VehicleFactory\n{\n    static function create(): Vehicle\
    \ {\n        // ...\n    }\n}\n```\n\nThis is required because the method signature\
    \ enforcement is invariant; you’re not able to define a more-specific return type\
    \ or PHP will raise an error:\n\n```\nclass CarFactory extends VehicleFactory\n\
    {\n    static function create(): Car {\n        // ...\n    }\n}\n\n// Fatal error:\
    \ Declaration of CarFactory::create() must be compatible with Vehi\\\ncleFactory::create():\
    \ Vehicle\n```\n\nEven though `Car` extends from `Vehicle`, making it covariant,\
    \ the return type *declaration* must remain exactly the same.\n\nIf the parent\
    \ didn’t declare a return type then the child may optionally declare any type\
    \ (if desired). For example, all of the following are allowed:\n\n```\ninterface\
    \ CacheInterface\n{\n    public function get($key);\n}\n\n// No return type\n\
    class SimpleCache implements CacheInterface\n{\n    public function get($key)\
    \ {\n        // ...\n    }\n}\n\n// Returns a string\nclass HtmlCache implements\
    \ CacheInterface\n{\n    public function get($key): string {\n        // ...\n\
    \    }\n}\n\n// Returns a certain object type\nclass DatabaseQueryCache implements\
    \ CacheInterface\n{\n    public function get($key): QueryResult {\n        //\
    \ ...\n    }\n}\n```\n\n### Further Reading"
  fmt: "\nThese hints were initially limited to just classes and interfaces, but was\
    \ soon expanded to allow `array` and `callable` types too. PHP 7 extends this\
    \ further by allowing scalar types like `int`, `float`, `string` and `bool`:\n\
    \n```\n// Scalar type hint (PHP 7):\nfunction getNextWeekday(int $date) { /*...*/\
    \ }\n```\n\n### Type Checking Modes\n\nPHP’s flexible type system is one of its\
    \ most-useful features, allowing numeric strings to be used as integers and vice-versa.\
    \ This tradition is continued in PHP 7 but now you have the option of enabling\
    \ strict type enforcement like you’d see in other languages (such as `Java` or\
    \ `C#`). This setting can be enabled using the [`declare` construct](https://php.net/manual/en/control-structures.declare.php).\n\
    \n#### Weak (“Coercive”) Type Checking\n\n“Coercive” mode is the default type\
    \ checking mode in PHP 7. This is identical to how previous versions of PHP handled\
    \ scalar type hints for built-in functions. For example, take a look at the method\
    \ signature for the `floor` function:\n\n```\nfloat floor ( float $value )\n```\n\
    \nWhen you pass in numeric strings or integers PHP auto-converts them to a float\
    \ automatically. This behavior has simply been extended to userland functions\
    \ as well.\n\nHere’s a table showing which scalar types are accepted in “Coercive”\
    \ mode based on the declared type:\n\nAllowed types, coercive mode\n\n| Type declaration\
    \ | int | float | string | bool | object |\n| --- | --- | --- | --- | --- | ---\
    \ |\n| int | yes | yes* | yes† | yes | no |\n| float | yes | yes | yes† | yes\
    \ | no |\n| string | yes | yes | yes | yes | yes‡ |\n| bool | yes | yes | yes\
    \ | yes | no |\n\n* Only non-`NaN` floats between `PHP_INT_MIN` and `PHP_INT_MAX`\
    \ accepted.\n† If it’s a numeric string\n‡ Only if object has a `__toString()`\
    \ method\n\n#### Strong (“Strict”) Type Checking\n\nPHP 7 introduces a new “strict”\
    \ mode which is enabled by placing `declare(strict_types=1);` at the top of your\
    \ script like so:\n\n```php\n<?php\ndeclare(strict_types=1);\n\nfunction welcome(string\
    \ $name) {\n    echo 'Hello ' . $name;\n}\n\nwelcome('World'); // Prints: Hello\
    \ World\n```\n\nThis declaration enables strict mode for all uses in the entire\
    \ file, including built-in PHP function calls and return values (see next chapter).\
    \ It does not affect any included files nor any other files which include it.\n\
    \nStrict mode essentially requires you to pass in exact types declared. If you\
    \ don’t, a `TypeError` will be thrown. For example, in strict mode, you cannot\
    \ use numeric strings when a `float` or `int` is expected (like you can in weak/coercive\
    \ mode):\n\nThis throws an error in strict mode \n\n```php\n<?php\ndeclare(strict_types=1);\n\
    \nfunction welcome(string $name) {\n    echo 'Hello ' . $name;\n}\n\nwelcome(3);\n\
    \n// Fatal error: Uncaught TypeError: Argument 1 passed to welcome() must be of\
    \ the type string, integer given\n```\n\nThere’s one exception to this rule though,\
    \ which is that `float` declarations can accept `int` values:\n\nScope widening\
    \ example \n\n```php\n<?php\ndeclare(strict_types=1);\n\nfunction add(float $a,\
    \ float $b): float {\n    return $a + $b;\n}\n\nadd(1, 2); // float(3)\n```\n\n\
    Allowed types, strict mode\n\n| Type declaration | int | float | string | bool\
    \ | object |\n| --- | --- | --- | --- | --- | --- |\n| int | yes | no | no | no\
    \ | no |\n| float | yes* | yes | no | no | no |\n| string | no | no | yes | no\
    \ | no |\n| bool | no | no | no | yes | no |\n\n* Allowed due to widening primitive\
    \ conversion\n\n### Mixing Modes\n\nBecause the directive is set per-file, it’s\
    \ entirely possible to mix modes in your application. For example, your strictly-checked\
    \ app could use a weakly-checked library (or vice versa) without any issues or\
    \ complications.\n\n### Backwards Compatibility\n\nYou may no longer create classes\
    \ named `int`, `float`, `string` or `bool` as these would conflict with the new\
    \ scalar type hints.\n\n### Further Reading\n\n* [RFC: Scalar Type Declarations](https://wiki.php.net/rfc/scalar_type_hints_v5)\n\
    * [PHP Documentation: Type Hinting](https://php.net/manual/en/language.oop5.typehinting.php)\n\
    \n## Chapter 2: Return Type Declarations\n\nIn the previous chapter we saw how\
    \ method parameters can have declared types. With PHP 7 you can also declare what\
    \ type your method will return. This is done by placing a colon (`:`) and the\
    \ return type just before the opening curly brace (`{`) like so:\n\n```\nfunction\
    \ getAuthor(): UserInterface {\n    return $this->comment->getUser();\n}\n```\n\
    \nIf you accidentally return something different, like a `string` or a `BlogComment`,\
    \ PHP will throw a `TypeError`:\n\n```php\nfunction getAuthor(): UserInterface\n\
    ```\n\n### Returning `null`\n\nMethods with declared types are **never** allowed\
    \ to return `null`. Doing so will cause a fatal error:\n\n```php\nclass User\n\
    {\n    public function getBirthday(): \\DateTime {\n        return null;\n   \
    \ }\n}\n```\n\nEven though `null` return values are not currently allowed, there\
    \ is a [Nullable Types RFC](https://wiki.php.net/rfc/nullable_types) which may\
    \ provide this ability in the future.\n\n### Sub-Class Methods\n\nOverridden methods\
    \ in sub-classes must declare the same type as the parent method. For example,\
    \ given the following method:\n\n```\nabstract class VehicleFactory\n{\n    static\
    \ function create(): Vehicle {\n        // ...\n    }\n}\n```\n\nAny classes which\
    \ extend `VehicleFactory` and override the `create()` method **must** use the\
    \ same `Vehicle` return type:\n\n```php\nclass CarFactory extends VehicleFactory\n\
    {\n    static function create(): Vehicle {\n        // ...\n    }\n}\n\nclass\
    \ TruckFactory extends VehicleFactory\n{\n    static function create(): Vehicle\
    \ {\n        // ...\n    }\n}\n```\n\nThis is required because the method signature\
    \ enforcement is invariant; you’re not able to define a more-specific return type\
    \ or PHP will raise an error:\n\n```php\nclass CarFactory extends VehicleFactory\n\
    {\n    static function create(): Car {\n        // ...\n    }\n}\n\n// Fatal error:\
    \ Declaration of CarFactory::create() must be compatible with VehicleFactory::create():\
    \ Vehicle\n```\nEven though `Car` extends from `Vehicle`, making it covariant,\
    \ the return type *declaration* must remain exactly the same.\n\nIf the parent\
    \ didn’t declare a return type then the child may optionally declare any type\
    \ (if desired). For example, all of the following are allowed:\n\n```php\ninterface\
    \ CacheInterface\n{\n    public function get($key);\n}\n\n// No return type\n\
    class SimpleCache implements CacheInterface\n{\n    public function get($key)\
    \ {\n        // ...\n    }\n}\n\n// Returns a string\nclass HtmlCache implements\
    \ CacheInterface\n{\n    public function get($key): string {\n        // ...\n\
    \    }\n}\n\n// Returns a certain object type\nclass DatabaseQueryCache implements\
    \ CacheInterface\n{\n    public function get($key): QueryResult {\n        //\
    \ ...\n    }\n}\n```\n"
  trans: "\n\n这些提示最初仅限于类和接口，但很快扩展到允许 `array` 和 `callable` 类型。PHP 7 进一步扩展了这一点，允许如 `int`、`float`、`string`\
    \ 和 `bool` 等标量类型：\n\n```\n// Scalar type hint (PHP 7):\nfunction getNextWeekday(int\
    \ $date) { /*...*/ }\n```\n\n### 类型检查模式\n\nPHP 灵活的类型系统使其最实用的特性之一，允许将数字字符串用整数，反之亦然。这种传统在\
    \ PHP 7 中得以延续，但现在你可以选择启用严格类型强制，就像你在其他语言（如 `Java` 或 `C#`）中看到的那样。可以使用 [`declare\
    \ 构造](https://php.net/manual/en/control-structures.declare.php) 来启用此设置。\n\n####\
    \ 弱（强制）类型检查\n\n“强制”模式是 PHP 7 中的默认类型检查模式。这与 PHP 之前的版本处理内置函数标量类型提示的方式相同。例如，看看 `floor`\
    \ 函数的方法签名：\n\n```\nfloat floor ( float $value )\n```\n\n当你传入数字字符串或整数时，PHP 会自动将它们转换为浮点数。这种行为同样扩展到了用户态函数。\n\
    \n下表显示了根据声明的类型在“强制”模式下接受的标量类型：\n\n允许的类型，强制模式\n\n| 类型声明 | int | float | string\
    \ | bool | object |\n| --- | --- | --- | --- | --- | --- |\n| int | yes | yes*\
    \ | yes† | yes | no |\n| float | yes | yes | yes† | yes | no |\n| string | yes\
    \ | yes | yes | yes | yes‡ |\n| bool | yes | yes | yes | yes | no |\n\n* 仅接受 `PHP_INT_MIN`\
    \ 和 `PHP_INT_MAX` 之间的非 `NaN` 浮点数。\n† 如果是数字字符串\n‡ 仅当对象具有 `__toString()` 方法\n\n\
    #### 强（严格）类型检查\n\nPHP 7 引入了一种新的“严格”模式，通过在脚本顶部放置 `declare(strict_types=1);` 来启用，所示：\n\
    \n```php\n<?php\ndeclare(strict_types=1);\n\nfunction welcome(string $name) {\n\
    \    echo 'Hello ' . $name;\n}\n\nwelcome('World'); // 输出: Hello World\n```\n\n\
    此声明对整个文件中的所有用途启用严格模式，包括内置 PHP 函数调用和返回值（见下一章）。它不会影响任何包含的文件或任何包含它的其他文件。\n\n严格模式本质上要求你传入声明的精确类型。如果没有这样做，将抛出\
    \ `TypeError`。例如，在严格模式下，当期望 `float` 或 `int` 时，不能使用数字字符串（就像在弱/强制模式中那样）：\n\n这在严格模式下会报错：\n\
    \n```php\n<?php\ndeclare(strict_types=1);\n\nfunction welcome(string $name) {\n\
    \    echo 'Hello ' . $name;\n}\n\nwelcome(3);\n\n// Fatal error: Uncaught TypeError:\
    \ Argument 1 passed to welcome() must be of the type string, integer given\n```\n\
    \n但这条规则有一个例外，即 `float` 可以接受 `int` 值：\n\n范围扩大示例\n\n```php\n<?php\ndeclare(strict_types=1);\n\
    \nfunction add(float $a, float $b): float {\n    return $a + $b;\n}\n\nadd(1,\
    \ 2); // float(3)\n```\n\n允许的类型，严格模式\n\n| 类型声明 | int | float | string | bool |\
    \ object |\n| --- | --- | --- | --- | --- | --- |\n| int | yes | no | no | no\
    \ | no |\n| float | yes* | yes | no | no | no |\n| string | no | no | yes | no\
    \ | no |\n| bool | no | no | no | yes | no |\n\n* 由于原始类型转换的扩大而允许\n\n### 混合模式\n\
    \n由于指令是按文件设置的，在你的应用程序中混合模式是完全可能的。例如，你的严格检查应用可以使用弱检查的库（或反之亦然），而不会出现任何问题或复杂性。\n\n\
    ### 向后兼容\n\n你可能无法再创建名为 `int`、`float`、`string` 或 `bool` 的类，因为这些将与新的标量类型提示冲突。\n\n\
    ### 扩展阅读\n\n* [RFC: 标量类型声明](https://wiki.php.net/rfc/scalar_type_hints_v5)\n*\
    \ [PHP 文档：类型提示](https://php.net/manual/en/language.oop5.typehinting.php)\n\n##\
    \ 第 2 章：返回值声明\n\n在上一章中，我们看到了方法参数如何声明类型。在 PHP 7 中，你也可以声明方法将返回什么类型。通过在左大括号（`{`）之前放置冒号（`:`）和返回类型来实现，所示：\n\
    \n```\nfunction getAuthor(): UserInterface {\n    return $this->getUser();\n}\n\
    ```\n\n如果你返回了不同的内容，例如 `string` 或 `BlogComment`，PHP 将抛出 `TypeError`：\n\n```\nfunction\
    \ getAuthor(): UserInterface\n```\n\n### 返回 null\n\n声明了类型的方法**永远**不允许返回 `null`。这样做会导致致命错误：\n\
    \n```php\nclass User\n{\n    public function getBirthday(): \\DateTime {\n   \
    \     return null;\n    }\n}\n```\n\n虽然目前不允许返回空，[可空类型 RFC](https://wiki.php.net/rfc/nullable_types)\
    \ 未来可能会提供这种功能。\n\n### 子类方法\n\n子类中重写的方法必须与父方法声明相同的类型。例如，给定以下方法：\n\n```\nabstract\
    \ class VehicleFactory\n{\n    static function create(): Vehicle {\n        //\
    \ ...\n    }\n}\n```\n\n任何扩展 `VehicleFactory` 并重写 `create()` 方法的类都必须使用相同的 `Vehicle`\
    \ 返回类型：\n\n```php\nclass CarFactory extends VehicleFactory\n{\n    static function\
    \ create(): Vehicle {\n        // ...\n    }\n}\n\nclass TruckFactory extends\
    \ VehicleFactory\n{\n    static function create(): Vehicle {\n        // ...\n\
    \    }\n}\n```\n\n这是因为方法签名强制执行是不变的（invariant）；你不能定义更具体的返回类型，否则 PHP 将引发错误：\n\n\
    ```php\nclass CarFactory extends VehicleFactory\n{\n    static function create():\
    \ Car {\n        // ...\n    }\n}\n\n// Fatal error: Declaration of CarFactory::create()\
    \ must be compatible with VehicleFactory::create(): Vehicle\n```\n即使 `Car` 扩展自\
    \ `Vehicle` 使其协变，返回类型*声明*必须保持完全一致。\n\n如果父类没有声明返回类型，则子类可以选择性声明任何类型（如果需要）。例如，以下所有情况都是允许的：\n\
    \n```php\ninterface CacheInterface\n{\n    public function get($key);\n}\n\n//\
    \ 无返回类型\nclass SimpleCache implements CacheInterface\n{\n    public function get($key)\
    \ {\n        // ...\n    }\n}\n\n// 返回字符串\nclass HtmlCache implements CacheInterface\n\
    {\n    public function get($key): string {\n        // ...\n    }\n}\n\n// 返回特定的对象类型\n\
    class DatabaseQueryCache implements CacheInterface\n{\n    public function get($key):\
    \ QueryResult {\n        // ...\n    }\n}\n```\n\n"
