    \ b();\nforeach ($generator as $var) {\n    var_dump($var);\n}\nvar_dump($generator->getReturn());\n\
    \n/*\nstring(3) \"foo\"\nint(1)\nint(2)\nstring(3) \"bar\"\nint(42)\n*/\n```\n\
    \n* * *\n\n总结：通过委托，对于你的调用者来说，`yield` 存在于主生成器还是子生成器中并不重要；接收和发送值将始终如你预期的那样保持一致。\n\
    \n### 进阶阅读：\n\n* [RFC: 生成器委托](https://wiki.php.net/rfc/generator-delegation)\n\
    \n## 第 11 章：可靠的用户态 CSPRNG\n\nPHP 7 引入了加密安全的伪随机数生成器 (CSPRNG) API，极大地简化了生成高质量随机数据的过程：\n\
    \n```php\nrandom_bytes(int length);\n\nrandom_int(int min, int max);\n```\n\n\
    这些方法产生“加密安全的”随机数，适用于高风险应用，例如生成加密密钥、为密码加盐、洗牌牌组等。\n\n如果你想在之前的 PHP 版本中生成此类值，你需要编写代码来对接\
    \ `mcrypt/openssl` 接口或直接访问 `/dev/*random`。这在技术上可行，但由于对编写代码时使用的库或操作系统有硬编码依赖，你的代码将不可移植的。\n\
    \n有了 PHP 7，你只需要调用 `random_bytes` 或 `random_int`，PHP 就会智能地选择当前机器上可用的随机源。这可能是：\n\
    \n* Windows 环境下的 `CryptGenRandom`\n\n* 如果可用则使用 `arc4random_buf()`（通常是 BSD 特有的）\n\
    \n* `/dev/arandom` 或 `/dev/urandom`\n\n如果没有足够的随机源，将会抛出错误。\n\n### 向后兼容性 (Backwards\
    \ Compatibility)\n\n你可能无法再在全局命名空间中定义名为 `random_int()` 或 `random_bytes()` 的函数。\n\
    \n### 向前兼容性 (Forwards Compatibility)\n\n[`paragonie/random_compat 库](https://github.com/paragonie/random_compat)\
    \ 将这些新函数反移植到 PHP 5.x。只需将此放入你的应用程序中，如果这些函数不存在就会定义它们，从而允许你编写运行在 5.x 和 7 上的安全代码。\n\
    \n### 进阶阅读\n\n* [RFC：简单的用户态 CSPRNG](https://wiki.php.net/rfc/easy_userland_csprng)\n\
    \n* [PHP 手手册：CSPRNG 函数](http://us3.php.net/manual/en/ref.csprng.php)\n\n* [如何在\
    \ PHP 中安全地生成随机字符串和整数](https://paragonie.com/blog/2015/07/how-safely-generate-random-strings-and-integers-in-php)\n\
    \n* [ircmaxell: PHP 中的随机数生成](http://blog.ircmaxell.com/2011/07/random-number-generation-in-php)\n\
    \n## 第 12 章：整数除法 (Integer Division)\n\nPHP 历史上缺乏整数除法的功能。例如，如果你除以 `5 / 2`，你总是得到一个浮点数；如果你想要整数结果，必须对其进行强制转换：`(int)\
    \ 5 / 2`。这对于大多数应用是可以的，特别是涉及较小数字时。由于浮点数无法表示大于 53 位的整数，为了避免这种限制（以及对强制转换的需求），PHP\
    \ 7 引入了新的 `intdiv()` 方法：\n\n```php\nintdiv(int $)\n```\n\n它正如你预期的那样工作，除两个整数并提供整数结果。它不使用浮点除法。\n\
    \n如果 `$divisor` 为 0，函数将抛出 `DivisionByError`。\n\n### 向后兼容性 (Backwards Compatibility)\n\
    \n你可能无法再在全局命名空间中定义名为 `random_int()` 或 `random_bytes()` 的函数。\n\n### 进阶阅读\n\n* [RFC:\
    \ intdiv()](https://wiki.php.net/rfc/intdiv)\n\n* [PHP 手册：intdiv()](http://us3.php.net/manual/en/function.intdiv.php)\n\
    \n## 第 13 章：`preg_replace_callback_array`\n\n`preg_replace_callback_array` 是一个新的\
    \ PCRE 函数，允许使用回调进行多个模式的查找和替换：\n\n```php\npreg_replace_callback_array(array $pattern,\
    \ $subject, $limit, &$count)\n```\n\n这是一个实际应用示例：\n\n```php\n$song = \"99 bottles\
    \ of beer on the wall\\n99 bottles of beer\\nTake one down, pass\nit around\\\
    n98 bottles of beer on the wall\";\n\necho preg_replace_callback_array([\n   \
    \ '/bottles of (beer|ale|cider)/' => function($matches) {\n        return 'little\
    \ bugs';\n    },\n    '/on the (wall|floor)/' => function($matches) {\n      \
    \  return 'in the code';\n    },\n    '/pass/' => function($matches) {\n     \
    \   return 'patch';\n    },\n    '/98/' => function($matches) {\n        return\
    \ rand(100, 200);\n    },\n], $song);\n\n/**\n * 99 little bugs in the code\n\
    \ * 99 little bugs\n * Take one down, patch around\n * 146 little bugs in the\
    \ code\n */\n```\n\n然而，`/e` 修饰符在 PHP 5.5.0 中被弃用，从而删除了将匹配模式与回调配对的功能。`preg_replace_callback_array`\
    \ 的引入重新启用了这一功能。\n\n### 向后兼容性 (Backwards Compatibility)\n\n你可能无法再在全局命名空间中定义名为 `preg_replace_callback_array()`\
    \ 的函数。\n\n### 进阶阅读\n\n* [RFC: preg_replace_callback_array](https://wiki.php.net/rfc/preg_replace_callback_array)\n\
    \n## 第 14 章：IntlChar 类\n\nPHP 通过 `intl` 扩展支持国际化 (i18n) 和本地化 (l10n)。该扩展基本上是 ICU\
    \ 库的，因此提供了几乎相同的方法和功能。\n\n"
