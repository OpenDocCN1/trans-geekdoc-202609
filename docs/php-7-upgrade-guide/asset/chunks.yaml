- raw: "The behavior of `assert()` is configurable, thus allowing you to completely\
    \ disable it in production. This is particularly useful if the assertions would\
    \ have negative side effects or incur performance penalties.\n\nHere are some\
    \ example use-cases of assertions:\n\nLoops which should always return a value\
    \ \n\n```\nforeach ($a as $b) {\n    if ($b->isActive()) {\n        return $b;\n\
    \    }\n}\n\nassert(false, 'Our loop should always return a value');\n```\n\n\
    Ensuring a required extension is available \n\n```\nfunction createThumbnail($image)\
    \ {\n    assert(extension_loaded('gd'));\n    // ...\n}\n```\n\nGuarding against\
    \ unexpected enum values \n\n```\nfunction setSuit($suit) {\n    case CLUBS:\n\
    \    case DIAMONDS:\n    case HEARTS:\n    case SPADES:\n        $this->suit =\
    \ $suit;\n    default:\n        assert(false, 'Unrecognized suit');\n}\n```\n\n\
    Fall-through expectations \n\n```\nif ($i % 3 == 0) {\n    // ...\n} else if ($i\
    \ % 3 == 1) {\n    // ...\n} else {\n    assert ($i % 3 == 2);\n}\n```\n\nBecause\
    \ `assert` is a function in PHP 4/5, any expressions (like the one above) are\
    \ always evaluated, even if assertions are disabled for production! A workaround\
    \ is to wrap the expression in a string, which PHP will then evaluate if necessary:\n\
    \n```\nassert ('$i % 3 == 2');\n```\n\nThis is somewhat better but still not ideal.\n\
    \n### `assert()` as a statement\n\nPHP 7 upgrades `assert()` to become a full-fledged\
    \ statement instead. You no longer need to wrap your code in a string - just provide\
    \ it as-is:\n\n```\nassert ($i % 3 == 2);\n```\n\nUnlike previous versions, PHP\
    \ 7 will not evaluate that statement unless required.\n\n### Custom errors\n\n\
    Older versions of PHP will raise an `E_WARNING` when an assertion fails, using\
    \ the second parameter as the warning message. PHP 7 adds the ability to raise\
    \ your own custom error types, if desired:\n\n```\nini_set('assert.exception',\
    \ 1);\n\nclass MissingExtensionError extends AssertionError {}\n\nassert(extension_loaded('foo'),\
    \ new MissingExtensionError('The \"foo\" extension s\\\nhould be enabled for this\
    \ to work'));\n```\n\nThrowing an exception (rather than emitting an error) means\
    \ you’ll get a stack trace to help investigate the issue.\n\n### Configuration\n\
    \nThere are two new `php.ini` settings used to control the behavior and allow\
    \ backwards-compatiblity:\n\n*   assert.exception - defaults to `0`\n\n*   zend.assertions\
    \ - defaults to `1`\n\n**assert.exception** controls the failure behavior of `assert()`:\n\
    \n*   **0** - raise a `warning` on failure (old behavior)\n\n*   **1** - throw\
    \ an `AssertionError` on failure\n\n**zend.assertions** controls how the PHP parser\
    \ should handle assertions it finds:\n\n*   **1** - generate and execute the assertion\
    \ code (development mode)\n\n*   **0** - generate the code, but skip it at runtime\n\
    \n*   **\\-1** - don’t generate any code (zero-cost production mode)\n\n### Backwards\
    \ Compatibility\n\nPHP 7 maintains full backwards-compatibility with the old behavior:\n\
    \n*   If `$expression` is a string, it will be evaluated as needed\n\n*   If `$expression`\
    \ is false(y), the assertion will fail\n\n*   If the second parameter is a string,\
    \ it will be used as the message for the `AssertionError`\n\n### Further Reading\n\
    \n*   [RFC: Expectations](https://wiki.php.net/rfc/expectations)\n\n*   [PHP Manual:\
    \ `assert()`](https://secure.php.net/manual/en/function.assert.php)\n\n## Chapter\
    \ 20: Array Constants in `define()`\n\nPHP 5.6 added the ability to define array\
    \ constants on classes by using the `const` keyword:\n\n```\nconst LUCKY_NUMBERS\
    \ = [4, 8, 15, 16, 23, 42];\n```\n\nPHP 7 brings this same functionality to the\
    \ `define()` function:\n\n```\ndefine('LUCKY_NUMBERS', [4, 8, 15, 16, 23, 42]);\n\
    ```\n\n### Further Reading\n\n*   [PHP Manual: `define()`](https://secure.php.net/manual/en/function.define.php)\n\
    \n*   [PHP Manual: Constant arrays using `define()`](https://secure.php.net/manual/en/migration70.new-features.php#migration70.new-features.define-array)\n\
    \n## Chapter 21: Filtered `unserialize()`\n\nUnserializing untrusted data is a\
    \ risky practice as malicious users could potentially inject their own data and\
    \ objects into applications. This is particularly dangerous for objects with destructors,\
    \ as those methods will always be executed, even if you don’t actually use the\
    \ unserialized object.\n\nHere’s an actual example from Drupal 7’s `Archive_Tar`\
    \ class:\n\n```\nfunction __destruct() {\n  $this->_close();\n  //...\n}\n\nfunction\
    \ _close() {\n  //...\n  if ($this->_temp_tarname != '') {\n    @drupal_unlink($this->_temp_tarname);\n\
    \    //...\n  }\n  //...\n}\n```\n\nAn attacker could use this to delete arbitrary\
    \ files from the server simply by providing a specially-crated string to **anywhere\
    \ that `unserialize` is used**:\n\n```\nO:11:\"Archive_Tar\":6:{s:8:\"_tarname\"\
    ;s:0:\"\";s:9:\"_compress\";b:0;s:14:\"_compress_\\\ntype\";s:4:\"none\";s:10:\"\
    _separator\";s:1:\" \";s:5:\"_file\";i:0;s:13:\"_temp_tarname\";\\\ns:11:\"/etc/passwd\"\
    ;}\n```\n\nOther functions like `__toString()`, `__call()`, etc. can also be vulnerable.\n\
    \n### Secure filtering\n\nPHP 7 adds an `array $options` parameter to the `unserialize()`\
    \ function to control the unserialization process. It currently supports a single\
    \ `allowed_classes` option to control the unserialization of objects. This can\
    \ take the following values:\n\n*   **true** - allows all objects to be restored\n\
    \n*   **false** - prevents all objects from being restored\n\n*   **string\\[\\\
