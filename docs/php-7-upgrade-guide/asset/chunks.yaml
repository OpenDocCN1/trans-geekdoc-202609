- raw: "PHP 7 implements a new context-sensitive lexer, making it smart enough to\
    \ determine the context of keywords; it can differentiate between normal keyword\
    \ usage and usage within classes. All of the following reserved words from PHP\
    \ 5.x are now **semi-reserved**:\n\n| abstract || and || array |\n\n| --- | ---\
    \ | --- |\n\n| as || break || callable |\n\n| case || catch || class |\n\n| clone\
    \ || const || continue |\n\n| declare || default || die |\n\n| do || echo || else\
    \ |\n\n| elseif || enddeclare || endfor |\n\n| endforeach || endif || endswitch\
    \ |\n\n| endwhile || exit || extends |\n\n| final || finally || for |\n\n| foreach\
    \ || function || global |\n\n| goto || if || implements |\n\n| include || include\\\
    _once || instanceof |\n\n| insteadof || interface || list |\n\n| namespace ||\
    \ new || or |\n\n| parent || print || private |\n\n| protected || public || require\
    \ |\n\n| require\\_once || return || self |\n\n| static || switch || throw |\n\
    \n| trait || try || use |\n\n| var || while || xor |\n\n| yield ||   ||   |\n\n\
    These semi-reserved words can now be used as property, constant, and method names\
    \ for classes, interfaces, and traits:\n\nSome basic examples \n\n```\nclass Collection\
    \ {\n    public function forEach(callable $callback) { }\n    public function\
    \ list() { }\n}\n\nclass BaseballPlayer {\n    public function throw(Baseball\
    \ $ball, BaseballPlayer $target) { }\n    public function catch(Baseball $ball)\
    \ { }\n}\n```\n\nHere are some other examples from the RFC:\n\nUsing ‘include’\
    \ as a public method \n\n```\nclass View {\n    public function include(View $view)\
    \ {\n        //...\n    }\n}\n$viewA = new View('a.view');\n$viewA->include(new\
    \ View('b.view'));\n```\n\nUsing ‘continue’ as a class constant \n\n```\nclass\
    \ HTTP {\n    const CONTINUE = 100;\n    const SWITCHING_PROTOCOLS = 101;\n  \
    \  /* ... */\n}\n```\n\nFluent interface using reserved words like ‘and’, ‘or’,\
    \ & ‘list’ \n\n```\n$projects =\n    Finder::for('project')\n        ->where('name')->like('%secret%')\n\
    \        ->and('priority', '>', 9)\n        ->or('code')->in(['4', '5', '7'])\n\
    \        ->and()->not('created_at')->between([$time1, $time2])\n        ->list($limit,\
    \ $offset);\n```\n\nThere are only two restrictions to this:\n\n1.  It only works\
    \ within OO-scope (classes, interfaces, and traits).\n\n2.  `class` cannot be\
    \ used as a constant, since it would conflict with the class name resolution syntax\
    \ (`SomeClass::class`). It **can** be used for method and property names though.\n\
    \n### Further Reading\n\n*   [RFC: Context Sensitive Lexer](https://wiki.php.net/rfc/context_sensitive_lexer)\n\
    \n*   [PHP manual: List of Keywords](https://secure.php.net/manual/en/reserved.keywords.php)\n\
    \n*   [PHP manual: List of other reserved words](https://php.net/manual/en/reserved.other-reserved-words.php)\n\
    \n## Chapter 18: Error Handling and Exceptions\n\nPHP 7 has drastically improved\
    \ error handling. It’s now easier than ever to handle errors and exceptions in\
    \ your code, thanks to some major changes and simplifications.\n\n### Exceptions\
    \ in the Engine\n\nFatal and recoverable fatal errors are no longer “raised”,\
    \ like warnings and deprecations - they are now exceptions thrown by the engine.\
    \ Let’s take a look at this short example:\n\n```\n$foo = 'test';\n$foo->someMethod();\n\
    ```\n\nIn previous versions of PHP, this would result in a fatal error:\n\n```\n\
    Fatal error: Call to a member function someMethod() on a non-object\n```\n\nPHP\
    \ 7 will instead throw an `Error`:\n\n```\nUncaught Error: Call to a member function\
    \ someMethod() on string\n```\n\nJust like normal exceptions, these are catchable\
    \ and can be acted upon:\n\n```\ntry {\n    $foo = 'test';\n    $foo->someMethod();\n\
    } catch (Error $e) {\n    var_dump($e);\n}\n\n/**\n  Output:\n\n  object(Error)#1\
    \ (7) {\n    [\"message\":protected]=>\n    string(48) \"Call to a member function\
    \ someMethod() on string\"\n    [\"string\":\"Error\":private]=>\n    string(0)\
    \ \"\"\n    [\"code\":protected]=>\n    int(0)\n    [\"file\":protected]=>\n \
    \   string(9) \"/in/mhr0k\"\n    [\"line\":protected]=>\n    int(5)\n    [\"trace\"\
    :\"Error\":private]=>\n    array(0) {\n    }\n    [\"previous\":\"Error\":private]=>\n\
    \    NULL\n}\n**/\n```\n\nThere are five pre-defined sub-classes of `Error`:\n\
    \n*   `TypeError` - throw when an argument doesn’t match the required type hint\
    \ (see [Chapter 1](#chap17.xhtml#chapter-1))\n\n*   `ParseError` - thrown when\
    \ `eval()` fails to parse the given code\n\n*   `AssertionError` - thrown when\
    \ an assertion (`assert(...)`) fails (see [Chapter 18](#chap35.xhtml#chapter-18))\n\
    \n*   `ArithmeticError` - thrown when an error occurs during a mathematical operation\n\
    \n*   `DivisionByZeroError` - a sub-class of `ArithmeticError` thrown when dividing\
    \ something by `0`\n\n\\## `Throwable` interface\n\nPHP 7 introduces a new `Throwable`\
    \ interface which both `Exception`s and `Error`s extend from:\n\n*   `interface\
    \ Throwable` \n\n    *   `Exception implements Throwable`\n\n    *   `Error implements\
    \ Throwable`\n\nThis interface provides the following methods:\n\n*   `getMessage()`\n\
    \n*   `getCode()`\n\n*   `getFile()`\n\n*   `getLine()`\n\n*   `getTrace()`\n\n\
    *   `getTraceAsString()`\n\n*   `__toString()`\n\nBecause `Error` and `Exception`\
    \ share a common interface, you can `catch` either type:\n\n```\ntry {\n    //\
    \ Some code\n} catch (Exception $e) {\n    // Oops, our code failed for some reason,\
    \ so we should handle this.\n} catch (Error $e) {\n    // Something was wrong\
    \ with our code; we should log the issue and fix it!\n}\n```\n\nOr even catch\
    \ both at once:\n\n```\ntry {\n    // Some code\n} catch (Throwable $e) {\n  \
    \  // Fail\n}\n```\n\nYou cannot implement the `Throwable` interface yourself\
    \ - you must extend from either `Error` or `Exception` instead.\n\n### Reclassification\
    \ of `E_STRICT` Notices\n\nThe `E_STRICT` notice type has always been somewhat\
    \ unclear and redundant. In an effort to simplify PHP’s error model, all such\
    \ instances of `E_STRICT` have been reclassifed or removed. The [corresponding\
    \ RFC](https://wiki.php.net/rfc/reclassify_e_strict) has a helpful list describing\
    \ all such changes along with the rationale for each decision.\n\nThe `E_STRICT`\
    \ constant is not being removed though, thereby maintaining backwards compatibility\
    \ with scripts which may contain code like `error_reporting(E_ALL|E_STRICT)`.\
    \ However, there may be some BC breakage since some `E_STRICT` instances are now\
    \ more-severe, which could affect some error handlers.\n\n### Backwards Compatibility\n\
    \nIn PHP 5.x it’s possible to silently ignore recoverable fatal errors with a\
    \ custom error handler. Because these errors are now thrown as exceptions, this\
    \ capability is removed.\n\nSimilarly, any parse errors generated while using\
    \ `eval()` were previously non-fatal but are now thrown as exceptions. You’ll\
    \ want to wrap any calls to `eval()` in a `try {} catch{}` block if you wish to\
    \ gracefully handle any such errors in PHP 7.\n\nThe following class names can\
    \ no longer be used in the global namespace:\n\n*   `Throwable`\n\n*   `Error`\n\
    \n*   `TypeError`\n\n*   `ParseError`\n\n*   `AssertionError`\n\n*   `ArithmeticError`\n\
    \n*   `DivisionByZeroError`\n\n### Further Reading\n\n*   [RFC: Exceptions in\
    \ the Engine](https://wiki.php.net/rfc/engine_exceptions_for_php7)\n\n*   [RFC:\
    \ Throwable Interface](https://wiki.php.net/rfc/throwable-interface)\n\n*   [RFC:\
    \ Catchable “call to a member function of a non-object”](https://wiki.php.net/rfc/catchable-call-to-member-of-non-object)\n\
    \n*   [RFC: Reclassify E\\_STRICT notices](https://wiki.php.net/rfc/reclassify_e_strict)\n\
    \n*   [PHP manual: Throwable](https://secure.php.net/manual/en/class.throwable.php)\n\
    \n*   [PHP manual: Error](https://secure.php.net/manual/en/class.error.php)\n\n\
    ## Chapter 19: Expectations\n\nPHP 4 introduced assertions via the `assert()`\
    \ function. An assertion is a helpful debugging feature which verifies assumptions\
    \ in your code. Think of them like comments which actually test themselves. You\
    \ simply provide a PHP statement which should always evaluate to true; any false\
    \ values would indicate a bug, code misuse, or faulty assumption on your end.\
    \ In PHP 4 and 5 `assert()` has the following signature:\n\n```\nbool assert (\
    \ mixed $assertion [, string $description ] )\n```"
  fmt: "\nPHP 7 implements a new context-sensitive lexer, making it smart enough to\
    \ determine the context of keywords; it can differentiate between normal keyword\
    \ usage and usage within classes. All of the following reserved words from PHP\
    \ 5.x are now semi-reserved:\n\n| `abstract` || `and` || `array` |\n| --- | ---\
    \ | --- |\n| `as` || `break` || `callable` |\n| `case` || `catch` || `class` |\n\
    | `clone` || `const` || `continue` |\n| `declare` || `default` || `die` |\n| `do`\
    \ || `echo` || `else` |\n| `elseif` || `enddeclare` || `endfor` |\n| `endforeach`\
    \ || `endif` || `endswitch` |\n| `endwhile` || `exit` || `extends` |\n| `final`\
    \ || `finally` || `for` |\n| `foreach` || `function` || `global` |\n| `goto` ||\
    \ `if` || `implements` |\n| `include` || `include_once` || `instanceof` |\n| `insteadof`\
    \ || `interface` || `list` |\n| `namespace` || `new` || `or` |\n| `parent` ||\
    \ `print` || `private` |\n| `protected` || `public` || `require` |\n| `require_once`\
    \ || `return` || `self` |\n| `static` || `switch` || `throw` |\n| `trait` || `try`\
    \ || `use` |\n| `var` || `while` || `xor` |\n| `yield` || || |\n\nThese semi-reserved\
    \ words can now be used as property, constant, and method names for classes, interfaces,\
    \ and traits:\n\n### Some basic examples \n\n```\nclass Collection {\n    public\
    \ function forEach(callable $callback) { }\n    public function list() { }\n}\n\
    \nclass BaseballPlayer {\n    public function throw(Baseball $ball, BaseballPlayer\
    \ $target) { }\n    public function catch(Baseball $ball) { }\n}\n```\n\nHere\
    \ are some other examples from the RFC:\n\n#### Using ‘include’ as a public method\
    \ \n\n```\nclass View {\n    public function include(View $view) {\n        //...\n\
    \    }\n}\n$viewA = new View('a.view');\n$viewA->include(new View('b.view'));\n\
    ```\n\n#### Using ‘continue’ as a class constant \n\n```\nclass HTTP {\n    const\
    \ CONTINUE = 100;\n    const SWITCHING_PROTOCOLS = 101;\n    /* ... */\n}\n```\n\
    \n#### Fluent interface using reserved words like ‘and’, ‘or’, & ‘list’ \n\n```\n\
    $projects =\n    Finder::for('project')\n        ->where('name')->like('%secret%')\n\
    \        ->and('priority', '>', 9)\n        ->or('code')->in(['4', '5', '7'])\n\
    \        ->and()->not('created_at')->between([$time1, $time2])\n        ->list($limit,\
    \ $offset);\n```\n\nThere are only two restrictions to this:\n\n1. It only works\
    \ within OO-scope (classes, interfaces, and traits).\n2. `class` cannot be used\
    \ as a constant, since it would conflict with the class name resolution syntax\
    \ (`SomeClass::class`). It can be used for method and property names though.\n\
    \n### Further Reading\n\n* [RFC: Context Sensitive Lexer](https://wiki.php.net/rfc/context_sensitive_lexer)\n\
    * [PHP manual: List of Keywords](https://secure.php.net/manual/en/reserved.keywords.php)\n\
    * [PHP manual: List of other reserved words](https://php.net/manual/en/reserved.other-reserved-words.php)\n\
    \n## Chapter 18: Error Handling and Exceptions\n\nPHP 7 has drastically improved\
    \ error handling. It’s now easier than ever to handle errors and exceptions in\
    \ your code, thanks to some major changes and simplifications.\n\n### Exceptions\
    \ in the Engine\n\nFatal and recoverable fatal errors are no longer “raised”,\
    \ like warnings and deprecations - they are now exceptions thrown by the engine.\
    \ Let’s take a look at this short example:\n\n```\n$foo = 'test';\n$foo->someMethod();\n\
    ```\n\nIn previous versions of PHP, this would result in a fatal error:\n\n```\n\
    Fatal error: Call to a member function someMethod() on a non-object\n```\n\nPHP\
    \ 7 will instead throw an `Error`:\n\n```\nUncaught Error: Call to a member function\
    \ someMethod() on string\n```\n\nJust like normal exceptions, these are catchable\
    \ and can be acted upon:\n\n```\ntry {\n    $foo = 'test';\n    $foo->someMethod();\n\
    } catch (Error $e) {\n    var_dump($e);\n}\n\n/**\n  Output:\n\n  object(Error)#1\
    \ (7) {\n    [\"message\":protected]=>\n    string(48) \"Call to a member function\
    \ someMethod() on string\"\n    [\"string\":\"Error\":private]=>\n    string(0)\
    \ \"\"\n    [\"code\":protected]=>\n    int(0)\n    [\"file\":protected]=>\n \
    \   string(9) \"/in/mhr0k\"\n    [\"line\":protected]=>\n    int(5)\n    [\"trace\"\
    :\"Error\":private]=>\n    array(0) {\n    }\n    [\"previous\":\"Error\":private]=>\n\
    \    NULL\n}\n**/\n```\n\nThere are five pre-defined sub-classes of `Error`:\n\
    \n* `TypeError` - throw when an argument doesn’t match the required type hint\
    \ (see [Chapter 1](#chap17.xhtml#chapter-1))\n* `ParseError` - thrown when `eval()`\
    \ fails to parse the given code\n* `AssertionError` - thrown when an assertion\
    \ (`assert(...)`) fails (see [Chapter 18](#chap35.xhtml#chapter-18))\n* `ArithmeticError`\
    \ - thrown when an error occurs during a mathematical operation\n* `DivisionError`\
    \ - thrown when dividing by zero\n\n### `Throwable` interface\n\n`Error` and `Exception`\
    \ share a common interface, This interface provides the following methods:\n\n\
    * `getMessage()`\n* `getCode()`\n* `getFile()`\n* `getLine()`\n* `getTrace()`\n\
    * `getAsString()`\n* `__toString()`\n\nBecause `Error` and `Exception` share a\
    \ common interface, you can catch either:\n\n```\ntry {\n    // Some code\n} catch\
    \ (Exception $e) {\n    // Fail\n} catch (Error $e) {\n    // Fail\n}\n```\n\n\
    Or even catch both at once:\n\n```\ntry {\n    // Some code\n} catch (Throwable\
    \ $e) {\n    // Fail\n}\n```\n\nYou cannot implement the `Throwable` yourself\
    \ - you must extend either `Error` or `Exception` instead.\n\n### Reclassification\
    \ of `E_STRICT` notices\n\nThe `E_STRICT` notice type has always been unclear\
    \ and redundant. In an effort to simplify PHP’s error model, all such instances\
    \ of `E_STRICT` have been reclassified or removed. The [corresponding RFC](https://wiki.php.net/rfc/reclassify_strict)\
    \ has a helpful list describing all changes with the rationale for each decision.\n\
    \nThe `E_STRICT` constant is not being removed though, maintaining backwards compatibility\
    \ with scripts which may contain code like `error_reporting(E_ALL|E_STRICT)`.\
    \ However, some `E_STRICT` instances are now more severe, which could affect some\
    \ error handlers.\n\n### Backwards Compatibility\n\nIn PHP 5.x it’s possible to\
    \ silently ignore recoverable fatal errors with a error handler. Because these\
    \ errors are now thrown as exceptions, this capability is removed.\n\nSimilarly,\
    \ any parse errors generated while using `eval()` were previously nonfatal but\
    \ are now thrown as exceptions. You’ll want to wrap any calls to `eval()` in a\
    \ `try {}}` block if you wish to gracefully handle any errors in PHP 7.\n\nThe\
    \ following class names can no longer be used in the global namespace:\n\n* `Throwable`\n\
    * `Error`\n* `TypeError`\n* `ParseError`\n* `AssertionError`\n* `ArithmeticError`\n\
    * `DivisionZeroError`\n\n### Further Reading\n\n* [RFC: Exceptions in the Engine](https://wiki.php.net/rfc/engine_exceptions_for_php7)\n\
    * [RFC: Throwable Interface](https://wiki.php.net/rfc/throwable-interface)\n*\
    \ [RFC: Catchable “call to a member function of a non-object”](https://wiki.php.net/rfc/catchable-call-member-of-non-object)\n\
    * [RFC: Reclassify E\\_STRICT notices](https://wiki.php.net/rfc/reclassify_strict)\n\
    * [PHP manual: Throwable](https://secure.php.net/manual/en/class.throwable.php)\n\
    * [PHP manual: Error](https://secure.php.net/manual/en/class.error.php)\n\n##\
    \ Chapter 19: Expectations\n\nPHP 4 introduced assertions via the `assert()` function.\
    \ An assertion is a helpful debugging feature which verifies assumptions in your\
    \ code. Think of them like comments which actually test themselves. You simply\
    \ provide a PHP statement which should always evaluate to true; any false values\
    \ would indicate a bug, code misuse, or faulty assumption on your end. In PHP\
    \ 4 and 5 `assert()` has the following signature:\n\n```\nbool assert ( mixed\
    \ $assertion [, string $description ] )\n```\n"
  trans: "\n\nPHP 7 实现了一种新的上下文敏感词法器，使其足够智能，能够确定关键字的上下文；它可以区分普通关键字用法与在类内部的用法。以下来自 PHP\
    \ 5.x 的所有保留字现在都是半保留的：\n\n| `abstract` || `and` || `array` |\n| --- | --- | ---\
    \ |\n| `as` || `break` || `callable` |\n| `case` || `catch` || `class` |\n| `clone`\
    \ || `const` || `continue` |\n| `declare` || `default` || `die` |\n| `do` || `echo`\
    \ || `else` |\n| `elseif` || `enddeclare` || `endfor` |\n| `endforeach` || `endif`\
    \ || `endswitch` |\n| `endwhile` || `exit` || `extends` |\n| `final` || `finally`\
    \ || `for` |\n| `foreach` || `function` || `global` |\n| `goto` || `if` || `implements`\
    \ |\n| `include` || `include_once` || `instanceof` |\n| `insteadof` || `interface`\
    \ || `list` |\n| `namespace` || `new` || `or` |\n| `parent` || `print` || `private`\
    \ |\n| `protected` || `public` || `require` |\n| `require_once` || `return` ||\
    \ `self` |\n| `static` || `switch` || `throw` |\n| `trait` || `try` || `use` |\n\
    | `var` || `while` || `xor` |\n| `yield` || || |\n\n这些半保留字现在可以作为类、接口和 trait 的属性、常量和方法名：\n\
    \n### 一些基础示例\n\n```\nclass Collection {\n    public function forEach(callable\
    \ $callback) { }\n    public function list() { }\n}\n\nclass BaseballPlayer {\n\
    \    public function throw(Baseball $ball, BaseballPlayer $target) { }\n    public\
    \ function catch(Baseball $ball) { }\n}\n```\n\n这里是来自 RFC 的其他示例：\n\n#### 将 ‘include’\
    \ 作为公共方法\n\n```\nclass View {\n    public function include(View $view) {\n   \
    \     //...\n    }\n}\n$viewA = new View('a.view');\n$viewA->include(new View('b.view'));\n\
    ```\n\n#### 将 ‘continue’ 作为类常量\n\n```\nclass HTTP {\n    const CONTINUE = 100;\n\
    \    const SWITCHING_PROTOCOLS = 101;\n    /* ... */\n}\n```\n\n#### 使用 ‘and’‘or’\
    \ 和 ‘list’ 等保留字的流式接口\n\n```php\n$projects =\n    Finder::for('project')\n    \
    \    ->where('name')->like('%secret%')\n        ->and('priority', '>', 9)\n  \
    \      ->or('code')->in(['4', '5', '7'])\n        ->and()->not('created_at')->between([$time1,\
    \ $time2])\n        ->list($limit, $offset);\n```\n\n对此只有两个限制：\n\n1. 它仅在 OO 作用域内（类、接口和\
    \ trait）有效。\n2. `class` 不能用作常量，因为会与类名解析语法（`SomeClass::class`）冲突。不过，它可以用于方法和属性名。\n\
    \n### 扩展阅读\n\n* [RFC: 上上下文敏感词法器](https://wiki.php.net/rfc/context_sensitive_lexer)\n\
    * [PHP 手册：关键字列表](https://secure.php.net/manual/en/reserved.keywords.php)\n* [PHP\
    \ 手册：其他保留字列表](https://php.net/manual/en/reserved.other-reserved-words.php)\n\n\
    ## 第 18 章：错误处理与异常\n\nPHP 7 极大改进了错误处理。得益于一些重大变更，现在比任何时候都易于处理错误和异常。\n\n### 引擎中的异常\n\
    \n致命和可恢复的致命错误不再像警告和弃用通知那样“引发”，它们现在是引擎抛出的异常。看这个例子：\n\n```\n$foo = 'test';\n$foo->someMethod();\n\
    ```\n\n在之前的版本中，这会导致致命错误：\n\n```\nFatal error: Call to a member function on non-object\n\
    ```\n\nPHP 7 将抛出 `Error`：\n\n```\nUncaught Error: Call to member function someMethod()\
    \ on string\n```\n\n像普通异常一样，这些是可以捕获并处理的：\n\n```\ntry {\n    $foo = 'test';\n \
    \   $foo->someMethod();\n} catch (Error $e) {\n    var_dump($e);\n}\n\n/**\n \
    \ Output:\n\n  object(Error)#1 {\n    [\"message\":protected]=>\n    string(48)\
    \ \"Call to member function someMethod() on string\"\n    [\"string\":protected]=>\n\
    \    string(0) \"\"\n    [\"code\":protected]=>\n    int(0)\n    [\"file\":protected]=>\n\
    \    string(9) \"/in/mhr\"\n    [\"line\":protected]=>\n    int(5)\n    [\"trace\"\
    :protected]=>\n    array(0) {\n    }\n    [\"previous\":protected]=>\n    NULL\n\
    }\n**/```\n\nError 有五个预定义的子类：\n\n* `TypeError` - 当参数不匹配类型提示时抛出（见第 17 章](#）。\n\
    * `ParseError` - 当 `eval()` 解析代码失败时抛出。\n* `AssertionError` - 当断言 (`assert(...)`)\
    \ 失败时抛出（见第 18 章](#）。\n* `ArithmeticError` - 当数学运算期间发生错误时抛出。\n* `DivisionError`\
    \ - 当除以零时抛出。\n\n### `Throwable` 接口\n\n`Error` 和 `Exception` 共享同一个接口，该接口提供了以下方法：\n\
    \n* `getMessage()`\n* `getCode()`\n* `getFile()`\n* `getLine()`\n* `getTrace()`\n\
    * `__toString()`\n\n由于 `Error` 和 `Exception` 共享同一个接口，你可以捕获其中任何一个：\n\n```\ntry\
    \ {\n    //某些代码\n} catch (Exception $e) {\n    // 失败\n} catch (Error $e) {\n \
    \   // 失败\n}\n```\n\n或者一次捕获两者：\n\n```\ntry {\n    //某些代码\n} catch (Throwable $e)\
    \ {\n    // 失败\n}\n```\n\n你不能自己实现 `Throwable` - 你必须扩展 `Error` 或 `Exception`。\n\
    \n### E_STRICT 重新分类\n\n通知类型一直模糊且冗余。为了简化 PHP 的错误模型，所有 `E_STRICT` 实例都已重新分类或移除。相应的\
    \ [RFC](https://wiki.php.net/rfc/reclassify_strict) 提供了关于每个决策理由的有用列表。\n\n不过 `E_STRICT`\
    \ 常量并未移除，以保持对包含 `error_reporting(E_ALL|E_STRICT)` 等代码的脚本兼容。然而，某些 `E_STRICT` 实例现在更加严重，可能会影响错误处理器。\n\
    \n### 向后兼容\n\n在 PHP 5.x 中可以使用错误处理器静忽略致命错误。由于这些错误现在作为异常抛出，该功能已被移除。\n\n同样，使用 `eval()`\
    \ 时生成的解析错误之前是非致命的，但现在作为异常抛出。如果你要在 PHP 7 中优雅地处理任何错误，你需要将任何 `eval()` 调用封装在 `try\
    \ {}` 块中。\n\n以下类名不再可以在全局命名空间中使用：\n\n* `Throwable`\n* `Error`\n* `TypeError`\n\
    * `ParseError`\n* `AssertionError`\n* `ArithmeticError`\n* `DivisionZeroError`\n\
    \n### 扩展阅读\n\n* [RFC：引擎中的异常](https://wiki.php.net/rfc/engine_exceptions_for_php7)\n\
    * [RFC：Throwable 接口](https://wiki.php.net/rfc/throwable-interface)\n* [RFC：可捕获的“调用非对象的成员”](https://wiki.php.net/rfc/catchable-call-member-of-non-object)\n\
    * [RFC：重新分类 E\\_STRICT 通知](https://wiki.php.net/rfc/reclassify_strict)\n* [PHP\
    \ 手册：Throwable](https://secure.php.net/manual/en/class.throwable.php)\n* [PHP\
    \ 手册：Error](https://secure.php.net/manual/en/class.error.php)\n\n## 第 19 章：期望\n\
    \nPHP 4 通过 `assert()` 函数引入了断言。断言是一种有助于调试的功能，用于验证代码中的假设。将它们想象成会自我测试的注释。你只需提供一个应该始终评估为真的\
    \ PHP 语句；任何假值都表示你的端存在错误、代码误用或错误的假设。在 PHP 4 和 5 中，`assert()` 具有如下签名：\n\n```\nbool\
    \ assert ( mixed $assertion [, string $description ] )\n```\n\n"
