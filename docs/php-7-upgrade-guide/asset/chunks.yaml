    \ the used CPU architecture. For example on x86 (including x86-64) the result\
    \ was int(1), because the shift operand was wrapped.\n\n#### Right bitwise shifts\n\
    \nSimilarly right bitwise shifts by a number of bits beyond the bit width of an\
    \ integer will always result in 0 or -1 (depending on sign):\n\n```\n  var_dump(1\
    \ >> 64);  // int(0)\n  var_dump(-1 >> 64); // int(-1)\n```\n\n### String handling\n\
    \n#### Hexadecimal numeric strings\n\nStrings that contain hexadecimal numbers\
    \ are no longer considered to be numeric and don’t receive special treatment anymore.\
    \ Some examples of the new behavior:\n\n```\n  var_dump(\"0x123\" == \"291\");\
    \     // bool(false)     (previously true)\n  var_dump(is_numeric(\"0x123\"));\
    \  // bool(false)     (previously true)\n  var_dump(\"0xe\" + \"0x1\");      \
    \  // int(0)          (previously 16)\n\n  var_dump(substr(\"foo\", \"0x1\"));\
    \ // string(3) \"foo\" (previously \"oo\")\n  // Notice: A non well formed numeric\
    \ value encountered\n```\n\nfilter\\_var() can be used to check if a string contains\
    \ a hexadecimal number or convert such a string into an integer:\n\n```\n$str\
    \ = \"0xffff\";\n$int = filter_var($str, FILTER_VALIDATE_INT, FILTER_FLAG_ALLOW_HEX);\n\
    if (false === $int) {\n    throw new Exception(\"Invalid integer!\");\n}\nvar_dump($int);\
    \ // int(65535)\n```\n\n#### Unicode escape sequence\n\nDue to the addition of\
    \ the Unicode Codepoint Escape Syntax for double-quoted strings and heredocs,\
    \ “\\\\u{“ followed by an invalid sequence will now result in an error:\n\n```\n\
    \  $str = \"\\u{xyz}\"; // Fatal error: Invalid UTF-8 codepoint escape sequence\n\
    ```\n\nTo avoid this the leading backslash should be escaped:\n\n```\n  $str =\
    \ \"\\\\u{xyz}\"; // Works fine\n```\n\nHowever, “\\\\u” without a following {\
    \ is unaffected. As such the following code won’t error and will work the same\
    \ as before:\n\n```\n  $str = \"\\u202e\"; // Works fine\n```\n\n### Error handling\n\
    \n#### Errors as throwables\n\nThere are now two exception classes: Exception\
    \ and Error. Both classes implement a new interface Throwable. Type hints in exception\
    \ handling code may need to be changed to account for this.\n\n#### Fatal errors\n\
    \nSome fatal errors and recoverable fatal errors now throw an Error instead. As\
    \ Error is a separate class from Exception, these exceptions will not be caught\
    \ by existing try/catch blocks.\n\nFor the recoverable fatal errors which have\
    \ been converted into an exception, it is no longer possible to silently ignore\
    \ the error from an error handler. In particular, it is no longer possible to\
    \ ignore type hint failures.\n\n#### Parser errors\n\nParser errors now generate\
    \ a ParseError that extends Error. Error handling for eval()s on potentially invalid\
    \ code should be changed to catch ParseError in addition to the previous return\
    \ value / error\\_get\\_last() based handling.\n\n#### Internal class constructor\
    \ failures\n\nConstructors of internal classes will now always throw an exception\
    \ on failure. Previously some constructors returned NULL or an unusable object.\n\
    \n#### Reclassification of E\\_STRICT\n\nThe error level of some E\\_STRICT notices\
    \ has been changed.\n\n### Other language changes\n\n#### Static calls to non-static\
    \ methods\n\nRemoved support for static calls to non-static methods from an incompatible\
    \ `$this` context. In this case $this will not be defined, but the call will be\
    \ allowed with a deprecation notice. An example:\n\n```\n  class A {\n      public\
    \ function test() { var_dump($this); }\n  }\n\n  // Note: Does NOT extend A\n\
    \  class B {\n      public function callNonStaticMethodOfA() { A::test(); }\n\
    \  }\n\n  (new B)->callNonStaticMethodOfA();\n\n  // Deprecated: Non-static method\
    \ A::test() should not be called statically\n  // Notice: Undefined variable $this\n\
    \  NULL\n```\n\nNote that this only applies to calls from an incompatible context.\
    \ If class B extended from A the call would be allowed without any notices.\n\n\
    #### Reserved words\n\nIt is no longer possible to use the following class, interface\
    \ and trait names (case-insensitive):\n\n```\n  bool\n  int\n  float\n  string\n\
    \  null\n  false\n  true\n```\n\nThis applies to class/interface/trait declarations,\
    \ class\\_alias() and use statements.\n\nFurthermore the following class, interface\
    \ and trait names are now reserved for future use, but do not yet throw an error\
    \ when used:\n\n```\n  resource\n  object\n  mixed\n  numeric\n```\n\n#### Parenthesis\
    \ requirement for `yield`\n\nThe yield language construct no longer requires parentheses\
    \ when used in an expression context. It is now a right-associative operator with\
    \ precedence between the “print” and “⇒” operators. This can result in different\
    \ behavior in some cases, for example:\n\n```\n  echo yield -1;\n  // Was previously\
    \ interpreted as\n  echo (yield) - 1;\n  // And is now interpreted as\n  echo\
    \ yield (-1);\n\n  yield $foo or die;\n  // Was previously interpreted as\n  yield\
    \ ($foo or die);\n  // And is now interpreted as\n  (yield $foo) or die;\n```\n\
    \nSuch cases can always be resolved by adding additional parentheses.\n\n####\
    \ Other removals\n\n*   Removed ASP (`<%`) and script (`<script language=php>`)\
    \ tags. (RFC: https://wiki.php.net/rfc/remove_alternative_php_tags)\n\n*   Removed\
    \ support for assigning the result of new by reference.\n\n*   Removed support\
    \ for scoped calls to non-static methods from an incompatible `$this` context.\
    \ See details in [https://wiki.php.net/rfc/incompat\\_ctx](https://wiki.php.net/rfc/incompat_ctx).\n\
    \n*   Removed support for `#`-style comments in ini files. Use `;`-style comments\
    \ instead.\n\n*   `$HTTP_RAW_POST_DATA` is no longer available. Use the `php://input`\
    \ stream instead.\n\n## Standard Library Changes\n\n*   `substr()` now returns\
    \ an empty string instead of `FALSE` when the truncation happens on boundaries."
