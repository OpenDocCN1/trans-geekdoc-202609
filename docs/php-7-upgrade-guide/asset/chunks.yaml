    \ (-1);\n\n  yield $foo or die;\n// Was previously interpreted as\n  yield ($foo\
    \ or die);\n// And is now interpreted as\n  (yield $foo) or die;\n```\n\nSuch\
    \ cases can always be resolved by adding additional parentheses.\n\n#### Other\
