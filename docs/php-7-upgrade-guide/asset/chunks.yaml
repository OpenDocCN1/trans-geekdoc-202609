- raw: "PHP 7 exposes ICU’s Unicode character features via the new [`IntlChar` class](https://secure.php.net/manual/en/class.intlchar.php).\
    \ This class contains 600 constants and 59 static methods, so we won’t cover them\
    \ all, but here are some examples you may find useful:\n\n```\n// Returns the\
    \ Unicode allocation block that contains the character.\npublic static function\
    \ getBlockCode(mixed $codepoint): int;\n\n// Determines whether the specified\
    \ code point is a letter character.\nstatic public function isalpha(mixed $codepoint):\
    \ bool;\n\n// Determines whether the specified code point is a punctuation character.\n\
    static public function ispunct(mixed $codepoint): bool;\n\n// Determines whether\
    \ the specified code point is a \"graphic\" character\n// (printable, excluding\
    \ spaces).\nstatic public function isgraph(mixed $codepoint): bool;\n\n// Determines\
    \ whether the specified code point is a \"blank\" or\n// \"horizontal space\"\
    , a character that visibly separates words on a line.\nstatic public function\
    \ isblank(mixed $codepoint): bool;\n\n// The given character is mapped to its\
    \ lowercase equivalent; if the character\n// has no lowercase equivalent, the\
    \ character itself is returned.\nstatic public function tolower(mixed $codepoint):\
    \ mixed;\n\n// Retrieve the name of a Unicode character.\nstatic public function\
    \ charName(mixed $codepoint, int $nameChoice = IntlChar::UN\\\nICODE_CHAR_NAME)\n\
    ```\n\n### Backwards Compatibility\n\nYou may no longer create classes named `IntlChar`\
    \ in the global namespace.\n\n### Further Reading\n\n*   [RFC: IntlChar class](https://wiki.php.net/rfc/intl.char)\n\
    \n*   [PHP Manual: IntlChar](https://secure.php.net/manual/en/class.intlchar.php)\n\
    \n*   [ICU 55.1: uchar.h File Reference](https://ssl.icu-project.org/apiref/icu4c/uchar_8h.html#func-members)\n\
    \n# Part 2 - Language Changes & Improvements\n\nPHP 7 includes several major improvements\
    \ to the language, as well as some changes to existing features.\n\nLearn about\
    \ the features and changes which make PHP 7 faster and more flexible than ever!\n\
    \n## Chapter 15: Performance\n\nPHP 7 is faster than ever. Most real-world applications\
    \ will see a 100%+ boost in performance simply by upgrading! Here are some actual\
    \ benchmarks from the Zend Performance Team^([1](#chap63.xhtml#fn-zendbenchmarks)):\n\
    \n![Zend Performance Team Benchmarks](images/benchmark.png)\n\nZend Performance\
    \ Team Benchmarks\n\nThis improvement is largely due to the PHPNG (PHP Next-Gen)\
    \ project which refactored the Zend Engine to be super-performant. Some of the\
    \ under-the-hood changes include things like:\n\n*   Using more-compact data structures\n\
    \n*   Reducing the number of heap allocations and deallocations\n\n*   Utilizing\
    \ native thread local storage\n\nThe net result is a faster PHP which also uses\
    \ less memory. These changes also pave the way for future improvements, like JIT\
    \ compilation, which will make PHP even faster.\n\n### Further Reading\n\n*  \
    \ [Zend: Turbocharging the Web with PHP 7](https://www.zend.com/en/resources/php7_infographic)\n\
    \n*   [Rasmus Lerdorf - PHP Australia Keynote](http://talks.php.net/oz15#/)\n\n\
    ## Chapter 16: Language Consistency\n\nPHP 7’s syntax is now more consistent and\
    \ flexible than before, thanks to two major changes: Uniform Variable Syntax and\
    \ the addition of an Abstract Syntax Tree.\n\n### Uniform Variable Syntax\n\n\
    PHP 7 supports several new types of expressions which weren’t possible in previous\
    \ versions:\n\nSource: RFC: Uniform Variable Syntax RFC \n\n```\n// support missing\
    \ combinations of operations\n$foo()['bar']()\n[$obj1, $obj2][0]->prop\ngetStr(){0}\n\
    \n// support nested ::\n$foo['bar']::$baz\n$foo::$bar::$baz\n$foo->bar()::baz()\n\
    \n// support nested ()\nfoo()()\n$foo->bar()()\nFoo::bar()()\n$foo()()\n\n// support\
    \ operations on arbitrary (...) expressions\n(...)['foo']\n(...)->foo\n(...)->foo()\n\
    (...)::$foo\n(...)::foo()\n(...)()\n\n// two more practical examples for the last\
    \ point\n(function() { ... })()\n($obj->closure)()\n\n// support all operations\
    \ on dereferencable scalars (not very useful)\n\"string\"->toLower()\n[$obj, 'method']()\n\
    'Foo'::$bar\n```\n\nYou’ve probably tried using these types of expressions in\
    \ the past and were surprised when they didn’t work - I know I certainly was.\
    \ Getting these expressions to work as expected required re-thinking the fundamental\
    \ problem of handling the variable-variable syntax: `$$foo['bar']`. In PHP 5,\
    \ this expression was interpreted from right-to-left: evaluate `$foo['bar']` and\
    \ then lookup the variable with that name. This methodology ultimately prevented\
    \ left-to-right interpretation, which would be required for all the examples listed\
    \ above.\n\nPHP 7 eliminates that special case and interprets all expressions\
    \ from left-to-right. `$$foo['bar']` is now interpreted as “take the value of\
    \ `$$foo` and lookup the value at key `bar`”. Here are several other example from\
    \ the RFC demonstrating the change:\n\n```\n                        // old meaning\
    \            // new meaning\n$$foo['bar']['baz']     ${$foo['bar']['baz']}   \
    \  ($$foo)['bar']['baz']\n$foo->$bar['baz']       $foo->{$bar['baz']}       ($foo->$bar)['baz']\n\
    $foo->$bar['baz']()     $foo->{$bar['baz']}()     ($foo->$bar)['baz']()\nFoo::$bar['baz']()\
    \      Foo::{$bar['baz']}()      (Foo::$bar)['baz']()\n```\n\nAdditionally, global\
    \ keywords now only accept simple variables:\n\n```\n// Invalid in PHP 7:\nglobal\
    \ $$foo->bar;\n\n// Use this instead:\nglobal ${$foo->bar};\n```\n\n#### Backwards\
    \ Compatibility\n\nAs shown above, this change will break backwards compatibility\
    \ in these types of variable-variable dereference expressions. Thankfully this\
    \ isn’t very common, so realistically the impact is fairly low.\n\nIf you need\
    \ an expression to be evaluated in a certain way, you can always use the `{}`\
    \ characters to enforce the desired behavior. This will make the code compatible\
    \ with both 5.x and 7.x.\n\n### Abstract Syntax Tree\n\nPrevious versions of PHP\
    \ would emit opcodes directly from the parser as it read through your code. While\
    \ this worked fine in most cases, it sometimes led to some strange behavior requiring\
    \ hacks, workarounds, or artificial limitations.\n\nPHP 7 fixes this by fully\
    \ decoupling the parser from the compiler by using an Abstract Syntax Tree (AST)\
    \ - a common technique in other languages. In addition to making the engine easier\
    \ to maintain, it also allows several syntax issues to be resolved:\n\n*   Using\
    \ `yield` in expressions no longer requires parentheses\n\n*   Expressions like\
    \ `($foo['bar'])` and `$foo['bar']` now behave identically\n\n*   The `__clone()`\
    \ magic method can be called directly\n\nImplementing an AST could also enable\
    \ the future implementation of features common in other languages, such as:\n\n\
    *   Array deconstruction without using `list`: `[$foo, $bar] = $array`\n\n*  \
    \ Python-like expressions such as `$x*$x for $x in $list`\n\n*   LINQ-style expressions\n\
    \n#### Backwards Compatibility\n\nWhile this is certainly a step in the right\
    \ direction, these changes do result in subtle changes to how `list()` works.\
    \ Perhaps the one you’re most likely to encounter is that `list()` now works left-to-right:\n\
    \n```\nlist($array[], $array[], $array[]) = [1, 2, 3];\nvar_dump($array);\n\n\
    // PHP 5: $array = [3, 2, 1]\n// PHP 7: $array = [1, 2, 3]\n```\n\nThere are some\
    \ other minor changes surrounding non-standard `list()` usage, which the RFC covers\
    \ in great detail should you be interested in learning more.\n\n### Further Reading\n\
    \n*   [RFC: Uniform Variable Syntax](https://wiki.php.net/rfc/uniform_variable_syntax)\n\
    \n*   [RFC: Abstract Syntax Tree](https://wiki.php.net/rfc/abstract_syntax_tree)\n\
    \n## Chapter 17: Semi-Reserved Words\n\nPHP 5.x has ~64 globally-reserved words,\
    \ such as `default` and `list`. Because they’re reserved globally, it was impossible\
    \ to use these terms as class methods or properties:\n\nExample from the RFC;\
    \ these would cause syntax errors \n\n```\nclass Collection {\n    public function\
    \ forEach(callable $callback) { /* */ }\n    public function list() { /* */ }\n\
    }\n```"
  fmt: "\nPHP 7 exposes ICU’s Unicode character features via the new [`IntlChar` class](https://secure.php.net/manual/en/class.intlchar.php).\
    \ This class contains 600 constants and 59 static methods, so we won’t cover them\
    \ all, but here are some examples you may find useful:\n\n```\n// Returns the\
    \ Unicode allocation block that contains the character.\npublic static function\
    \ getBlockCode(mixed $codepoint): int;\n\n// Determines whether the specified\
