    \ 'SecretNumber');\n\n// And now we can use it:\necho $boundRevealer(); // 3\n\
    ```\n\nPHP 7 simplifies this process by adding a new `call` method:\n\n```\nmixed\
    \ Closure::call(object $to[, mixed ...$parameters])\n```\n\nThis eliminates the\
