    \n# 附录 - 向后兼容破坏性变更\n\n如果你是从现代版本的 PHP（如 5.5 或 5.6）迁移过来的，你的大部分代码可能仍然原样良好运行。尽管如此，我们将在本节中涵盖大部分重要的破坏性变更，以便你准备修复项目中的任何问题。这些破坏性大部分在之前的章节中讨论过。我们会根据需要链接回那些章节。此列表直接来自\
    \ 2015 年 11 月的 `php-src` 文档。可能并不详尽。\n\n## 语言变更\n\n### 变量处理\n\n#### 从左到右解析\n\n\
    间接变量、属性和方法引用现在按照从左到右的语义进行解释。示例：\n\n```\n  $foo['bar'] // 解释为 ($foo)['bar']\n \
    \ $foo->$bar // 解释为 ($foo)->$bar\n  $foo->['bar'] // 解释为 ($foo->['bar']\n  $Foo::$bar\
    \ // 解释为 ($Foo):::$bar\n```\n\n要恢复之前的行为，请添加显示的大括号：\n\n```\n  ${foo['bar']}\n \
    \ ${foo->$bar}\n  ${foo->['bar']}\n  ${Foo::$bar}\n```\n\n#### global 关键字\n\n\
    `global` 关键字现在只接受变量。不再使用 `global $foo->bar`，现在要求写如下：\n\n#### 括号影响行为\n\n变量或函数调用周围的括号不再对行为产生任何影响。例如下面的代码，函数调用的结果通过引用传递：\n\
    \n```\n  function getArray() { return [1, 2, 3]; }\n\n  $last = array_pop(getArray());\
    \ // 严格标准：只有变量应通过引用传递\n  $last = array_pop((getArray())); // 严格标准：只有变量应通过引用传递\n\
    ```\n\n现在无论是否使用括号，都将抛出严格错误（strict error）。之前在第二情况下不会生成通知（notice）。\n\n#### 引用赋值顺序\n\
    \n引用赋值期间自动创建的数组元素或对象属性现在将导致不同的顺序。例如\n\n```\n  $array = [];\n  $array[\"a\"] =\
    \ &$array[\"b\"];\n  $array[\"b\"] = 1;\n  var_dump($array);\n```\n\n现在结果为 `[\"\
    a\" => 1, \"b\" => 1]`，而之前的的结果是 `[\"b\" => 1, \"a\" => 1]`。\n\n### `list()` \n\
    \n#### 变量赋值\n\n`list()` 将不再以反序赋值变量。例如\n\n```\n  list($array[], $array[], $array[])\
    \ = [1, 2, 3];\n  var_dump($array);\n```\n\n现在结果为 `$array == [1, 2, 3]` 而不是 `[3,\
    \ 2, 1]`。注意，只有赋值顺序发生了变化，但赋值的值保持不变。例如，正常的用法如\n\n```\n  list($a, $b, $c) = [1, 2,\
    \ 3];\n  // $a = 1; $b = 2; $c = 3;\n```\n\n将保留其当前行为。\n\n#### 空列表赋值\n\n不再允许空的\
    \ `list()` 赋值。因此，以下所有都是无效的：\n\n```\n  list() = $a;\n  list(,) = $a;\n  list($x,\
    \ , $y) = $a;\n```\n\n`list()` 不再支持解字符串（虽然之前在某些情况下是支持的）。代码\n\n```\n  $string =\
    \ \"xy\";\n  list($x, $y) = $string;\n```\n\n现在结果将为 `$x == null` 和 `$y == null`（无通知），而不是\
    \ `$x == \"x\"` 和 `$y == \"y\"`。此外，`list()` 现在始终保证适用于实现 `ArrayAccess` 的对象，例如\n\
    \n```\n  list($a, $b) = (object) new ArrayObject([0, 1]);\n```\n\n现在结果为 `$a ==\
    \ 0` 和 `$b == 1`。之前 `$a` 和 `$b` 均为 null。\n\n### `foreach` 行为\n\n#### 与内部指针的交互\n\
    \n`foreach()` 迭代不再影响内部数组指针，可以通过 `current()`/`next()` 等函数访问。例如\n\n```\n  $array\
    \ = [0, 1, 2];\n  foreach ($array as &$val) {\n      var_dump(current($array));\n\
    \  }\n```\n\n现在将打印三次 `int(0)`。之前的输出是 `int(1)`、`int(2)` 和 `bool(false)`。\n\n####\
    \ 按值迭代数组\n\n按值迭代数组时，`foreach` 现在始终在数组的副本上操作，因此迭代期间对数组的更改不会影响迭代行为。例如在按值迭代期间\n\n\
    ```\n  $array = [0, 1, 2];\n  $ref = &$array; // 触发旧行为必要的\n  foreach ($array as\
    \ $val) {\n      var_dump($val);\n      unset($array[1]);\n  }\n```\n\n现在将打印所有元素（0,\
    \ 1, 2），而之前第二个元素 1 被跳过了。\n\n#### 按引用迭代数组\n\n按引用迭代数组时，对数组的修改将继续影响迭代。然而，PHP 现在许多情况下能够更好地维护正确的位置。例如在按引用迭代期间向数组追加\n\
    \n```\n  $array = [0];\n  foreach ($array as &$val) {\n      var_dump($val);\n\
    \      $array[1] = 1;\n  }\n```\n\n现在将遍历新添加的元素。因此此示例的输出现在是 `int(0) int(1)`，而之前只有\
    \ `int(0)`。\n\n#### 对象迭代\n\n普通（非 Traversable）对象的按值或按引用迭代行为将类似于数组的按引用迭代。除了前述一点中提到的更准确的位置管理外，这与之前的行为一致。\n\
    \nTraversable 对象的迭代保持不变。\n\n### 参数处理\n\n#### 重复参数名\n\n现在不再允许定义两个名称相同的函数参数。例如，以下方法将触发编译时错误：\n\
    \n```\n  public function foo($a, $b, $unused, $unused) {\n      // ...\n  }\n\n\
    ```\n\n"
