    \n## Guide\n\n1.  [Begin Reading](#chap00.xhtml)\n\n# Preface\n\n## Who is this\
    \ book for\n\nThis is book is for PHP developers looking to jump into PHP 7. You’ll\
    \ need previous experience with PHP in order to understand the topics and examples\
    \ we’ll cover. The more you know about PHP 5 and OOP, the more you’ll understand\
    \ why some of the changes are important and how they’ll impact your development.\n\
    \nIf you’re a manager or leader of a team looking to work in PHP 7, this book\
    \ will help your developers quickly catch up on all the changes they need to know\
    \ about, and even expose some new features they can take advantage of for faster,\
