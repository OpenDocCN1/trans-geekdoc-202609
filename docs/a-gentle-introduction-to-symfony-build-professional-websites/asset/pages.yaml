    Using the test() method to test the request elements ends up in long lines. Fortunately,
    sfTestFunctional contains a bunch of proxy methods that help you keep your functional
    tests readable and short—in addition to returning an sfTestFunctional object themselves.


    For instance, you can rewrite Listing 15-15 in a faster way, as shown in Listing
    15-18.


    # Listing 15-18 - Testing Directly with sfTestFunctional


    ```

    $b = new sfTestFunctional(new sfBrowser());

    $b->get(''/foobar/edit/id/1'')->

    with(''request'')->isParameter(''id'', 1)->

    with(''response'')->begin()->

    isStatusCode()->

    isHeader(''content-type'', ''text/html; charset=utf-8'')->

    matches(''/edit/'')->

    end();

    ;

    ```


    Each proxy method is part of a tester group. Using a tester group is done by wrapping
    the method calls with the with() and end() methods. The with() methods takes the
    tester group name (like request and response).


    The status 200 is the default value of the parameter expected by isStatusCode(),
    so you can call it without any argument to test a successful response.


    One more advantage of proxy methods is that you don''t need to specify an output
    text as you would with a lime_test method. The messages are generated automatically
    by the proxy methods, and the test output is clear and readable.


    ```

    # get /foobar/edit/id/1

    ok 1 - request parameter "id" is "1"

    ok 2 - status code is "200"

    ok 3 - response header "content-type" is "text/html"

    ok 4 - response matches "/edit/"

    1..4

    ```


    In practice, the proxy methods of Listing 15-17 cover most of the usual tests,
    so you will seldom use the test() method on an sfTestFunctional object.


