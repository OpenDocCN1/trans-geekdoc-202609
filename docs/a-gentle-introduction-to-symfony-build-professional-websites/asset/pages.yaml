  md: "# Listing 8-24 - Attributes for Model Settings\n\n```\nListing 8-33\nArticle:\n\
    \  attributes:\n    export: tables\n    validate: none\n```\n\nThe export attribute\
    \ controls what SQL is exported to the database when creating tables for that\
    \ model. Using the tables value would only export the table structure and no foreign\
    \ keys, indexes, etc.\n\nTables that contain localized content (that is, several\
    \ versions of the content, in a related table, for internationalization) should\
    \ use the I18n behavior (see Chapter 13 for details), as shown in Listing 8-25.\n\
    \n# Listing 8-25 - I18n Behavior\n\n```\nListing 8-34\nArticle:\n  actAs:\n  \
    \  I18n:\n      fields: [title, content]\n```"
