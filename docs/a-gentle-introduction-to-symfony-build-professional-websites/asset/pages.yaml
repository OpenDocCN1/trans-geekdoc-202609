- pgno: 349
  md: "# Activated Modules\n\nActivated_modules from plug-ins or from the symfony\
    \ core are declared in the enabled_modules parameter. Even if a plug-in bundles\
    \ a module, users can't request this module unless it is declared in enabled_modules.\
    \ The default module, which provides the default symfony pages (congratulations,\
    \ page not found, and so on), is the only enabled module by default.\n\n# Character\
    \ Set\n\nThe character set of the responses is a general setting of the application,\
    \ because it is used by many components of the framework (templates, output escaper,\
    \ helpers, and so on). Defined in the charset setting, its default (and advised)\
    \ value is utf-8.\n\n# Adding Your application settings\n\nThe settings.yml file\
    \ defines symfony settings for an application. As discussed in Chapter 5, when\
    \ you want to add new parameters, the best place to do so is in the frontend/config/app.yml\
    \ file. This file is also environment-dependent, and the settings it defines are\
    \ available through the sfConfig class with the app_ prefix.\n\n```\nListing 19-3\n\
    all:\n  creditcards:\n    false        # app_creditcards_fake\n    true      \
    \   # app_creditcards_visa\n    true         # app_creditcards_americanexpress\n\
    ```\n\nYou can also write an app.yml file in the project configuration directory,\
    \ and this provides a way to define custom project settings. The configuration\
    \ cascade also applies to this file, so the settings defined in the application\
    \ app.yml file override the ones defined at the project level.\n\n# Extending\
    \ the Autoloading Feature\n\nThe autoloading feature, briefly explained in Chapter\
    \ 2, exempts you from requiring classes in your code if they are located in specific\
    \ directories. This means that you can just let the framework do the job for you,\
    \ allowing it to load only the necessary classes at the appropriate time, and\
    \ only when needed.\n\nThe autoload.yml file lists the paths in which autoloaded\
    \ classes are stored. The first time this configuration file is processed, symfony\
    \ parses all the directories referenced in the file. Each time a file ending with\
    \ .php is found in one of these directories, the file path and the class names\
    \ found in this file are added to an internal list of autoloading classes. This\
    \ list is saved in the cache, in a file called config/config_autoload.yml.php.\
    \ Then, at runtime, when a class is used, symfony looks in this list for the class\
    \ path and includes the .php file automatically.\n\nAutoloading works for all\
    \ .php files containing classes and/or interfaces.\n\nBy default, classes stored\
    \ in the following directories in your projects benefit from the autoloading automatically:\n\
    \n+   • myproject/lib/\n+   • myproject/lib/model\n+   • myproject/apps/frontend/lib/\n\
    +   • myproject/apps/frontend/modules/mymodule/lib"
  merge: -1
  img_proc: true
- pgno: 350
  md: "There is no autoload.yml file in the default application configuration directory.\
    \ If you want to modify the framework settings—for instance, to autoload classes\
    \ stored somewhere else in your file structure—create an empty autoload.yml file\
    \ and override the settings of sfConfig::get('sf_symfony_lib_dir')/config/config/autoload.yml\
    \ or add your own.\n\nThe autoload.yml file must start with an autoload: key and\
    \ list the locations where symfony should look for classes. Each location requires\
    \ a label; this gives you the ability to override symfony's entries. For each\
    \ location, provide a name (it will appear as a comment in config_autoload.yml.php)\
    \ and an absolute path. Then define if the search must be recursive, which directs\
    \ symfony to look in all the subdirectories for .php files, and exclude the subdirectories\
    \ you want. Listing 19-3 shows the locations used by default and the file syntax.\n\
    \n# Listing 19-3 - Default Autoloading Configuration, in sfConfig::get('sf_symfony_lib_dir')/config/config/autoload.yml\n\
    \n```\nautoload:\n  # plugins\n  plugins_lib:\n    name: plugins lib\n    path:\
    \ %SF_PLUGINS_DIR%/*/lib\n    recursive: true\n\n  plugins_module_lib:\n    name:\
    \ plugins module lib\n    path: %SF_PLUGINS_DIR%/*/modules/*/lib\n    prefix:\
    \ 2\n    recursive: true\n\n  # project\n  project:\n    name: project\n    path:\
    \ %SF_LIB_DIR%\n    recursive: true\n    exclude: [model, symfony]\n\n  project_model:\n\
    \    name: project model\n    path: %SF_LIB_DIR%/model\n    recursive: true\n\n\
    \  # application\n  application:\n    name: application\n    path: %SF_APP_LIB_DIR%\n\
    \    recursive: true\n\n  modules:\n    name: module\n    path: %SF_APP_DIR%/modules/*/lib\n\
    \    prefix: 1\n    recursive: true\n```\n\nA rule path can contain wildcards\
    \ and use the file path parameters defined in the configuration classes (see the\
    \ next section). If you use these parameters in the configuration file, they must\
    \ appear in uppercase and begin and end with %."
  merge: -1
