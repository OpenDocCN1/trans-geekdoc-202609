    sfForm::setWidgets() expects an associative array of widget name / widget object.

    sfWidgetFormInputText, sfWidgetFormChoice, and sfWidgetFormTextarea are some

    of the numerous widget classes offered by symfony; you will find a complete list
    further in

    this chapter.


    The previous example shows two widget options you can use: default sets the widget
    value,

    and is available for all widgets. choices is an option specific to the choice
    widget (which

    renders as a drop-down list): it defines the available options the user can select.


    So the foo/contact action defines a form object, and then handles it to the

    contactSuccess template in a $form variable. The template can use this object
