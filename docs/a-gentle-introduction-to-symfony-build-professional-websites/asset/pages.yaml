- pgno: 168
  md: 'Similar widgets exist for time (sfWidgetFormI18nTime), and datetime (sfWidgetFormI18nDateTime).


    There are two drop-down lists that occur in many forms and that also rely on the
    user culture: country and language selectors. Symfony provides two widgets especially
    for this purpose. You don''t need to define the choices in these widgets, as symfony
    will populate them with the list of countries and languages in the language of
    the user (provided the user speaks any of the 250 referenced languages in symfony).


    ```

    // Country list

    $form->setWidget(''country'', new sfWidgetFormI18nCountryChoice(array(''default''
    => ''UK'')));

    // For an English-speaking user, symfony renders the widget in HTML as

    <label for="country">Country</label>

    <select id="country" name="country">

    <option value=""/>

    <option value="AD">Andorra</option>

    <option value="AE">United Arab Emirates</option>

    ...

    <option value="ZWD">Zimbabwe</option>

    </select>


    // Language list

    $form->setWidget(''language'', new sfWidgetFormI18nLanguageChoice(array(

    ''languages'' => array(''en'', ''fr'', ''de''), // optional restricted list of
    languages

    ''default'' => ''en''

    )));

    // For an English-speaking user, symfony renders the widget in HTML as

    <label for="language">Language</label>

    <select id="language" name="language">

    <option value=""/>

    <option value="de">German</option>

    <option value="en" selected="selected">English</option>

    <option value="fr">French</option>

    </select>

    ```


    # File Widgets


    Dealing with file input tags is not more complicated than dealing with other widgets:


    ```

    // Input file

    $form->setWidget(''picture'', new sfWidgetFormInputFile());

    // symfony renders the widget in HTML as

    <label for="picture">Picture</label>

    <input id="picture" type="file" name="picture"/>

    // Whenever a form has a file widget, renderFormTag() outputs a <form> tag

    with the multipart option

    ```


    ```

    // Editable input file

    $form->setWidget(''picture'', new sfWidgetFormInputFileEditable(array(''default''
    => ''/images/foo.png'')));

    // symfony renders the widget in HTML as a file input tag, together with a preview
    of the current file

    ```'
