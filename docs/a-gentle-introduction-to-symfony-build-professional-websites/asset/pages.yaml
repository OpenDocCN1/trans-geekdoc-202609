- pgno: 112
  md: '# Meta Tag Configuration


    The information written in the <meta> tags in the response is not displayed in
    a browser but is useful for robots and search engines. It also controls the cache
    settings of every page. Define these tags under the http_metas: and metas: keys
    in view.yml, as in Listing 7-21, or with the addHttpMeta() and addMeta() response
    methods in the action, as in Listing 7-22.


    # Listing 7-21 - Meta Definition As Key: Value Pairs in view.yml


    ```

    http_metas:

    cache-control: public


    metas:

    description: Finance in France

    keywords: finance, France

    ```


    # Listing 7-22 - Meta Definition As Response Settings in the Action


    ```

    $this->getResponse()->addHttpMeta(''cache-control'', ''public'');

    $this->getResponse()->addMeta(''description'', ''Finance in France'');

    $this->getResponse()->addMeta(''keywords'', ''finance, France'');

    ```


    Adding an existing key will replace its current content by default. For HTTP meta
    tags, you can add a third parameter and set it to false to have the addHttpMeta()
    method (as well as the setHttpHeader()) append the value to the existing one,
    rather than replacing it.


    ```

    $this->getResponse()->addHttpMeta(''accept-language'', ''en'');

    $this->getResponse()->addHttpMeta(''accept-language'', ''fr'', false);

    echo $this->getResponse()->getHttpHeader(''accept-language'');

    => ''en, fr''

    ```


    In order to have these meta tags appear in the final document, the include_http_metas()
    and include_metas() helpers must be called in the <head> section (this is the
    case in the default layout; see Listing 7-5). Symfony automatically aggregates
    the settings from all the view.yml files (including the default one shown in Listing
    7-18) and the response attribute to output proper <meta> tags. The example in
    Listing 7-21 ends up as shown in Listing 7-23.


    # Listing 7-23 - Meta Tags Output in the Final Page


    ```

    <meta http-equiv="content-type" content="text/html; charset=utf-8" />

    <meta http-equiv="cache-control" content="public" />

    <meta name="robots" content="index, follow" />

    <meta name="description" content="Finance in France" />

    <meta name="keywords" content="finance, France" />

    ```


    As a bonus, the HTTP header of the response is also impacted by the http-metas:
    definition, even if you don''t have any include_http_metas() helpers in the layout,
    or if you have no layout at all. For instance, if you need to send a page as plain
    text, define the following view.yml:


    ```

    http_metas:

    content-type: text/plain


    has_layout: false

    ```'
  merge: -1
  img_proc: true
- pgno: 113
  md: "# Title Configuration\n\nThe page title is a key part to search engine indexing.\
    \ It is also very useful with modern browsers that provide tabbed browsing. In\
    \ HTML, the title is both a tag and meta information of the page, so the view.yml\
    \ file sees the title: key as a child of the metas: key. Listing 7-24 shows the\
    \ title definition in view.yml, and Listing 7-25 shows the definition in the action.\n\
    \nListing 7-24 - Title Definition in view.yml\n\n```\nindexSuccess:\n  metas:\n\
    \    title: Three little piggies\n```\n\nListing 7-25 - Title Definition in the\
    \ Action—Allows for Dynamic Titles\n\n```\n$this->getResponse()->setTitle(sprintf('%d\
    \ little piggies', $number));\n```\n\nIn the <head> section of the final document,\
    \ the title definition sets the <meta name=\"title\"> tag if the include_metas()\
    \ helper is present, and the <title> tag if the include_title() helper is present.\
    \ If both are included (as in the default layout of Listing 7-5), the title appears\
    \ twice in the document source (see Listing 7-6), which is harmless.\n\n> Another\
    \ way to handle the title definition is to use slots, as discussed above. This\
    \ method allow to keep a better separation of concern between controllers and\
    \ templates : the title belongs to the view, not the controller.\n\n# File Inclusion\
    \ Configuration\n\nAdding a specific style sheet or JavaScript file to a view\
    \ is easy, as Listing 7-26 demonstrates.\n\nListing 7-26 - Asset File Inclusion\n\
    \n```\n// In the view.yml\nindexSuccess:\n  stylesheets: [mystyle1, mystyle2]\n\
    \  javascripts: [myscript]\n\n// In the action\n$this->getResponse()->addStylesheet('mystyle1');\n\
    $this->getResponse()->addStylesheet('mystyle2');\n$this->getResponse()->addJavascript('myscript');\n\
    \n// In the Template\n<?php use_stylesheet('mystyle1') ?>\n<?php use_stylesheet('mystyle2')\
    \ ?>\n<?php use_javascript('myscript') ?>\n```\n\nIn each case, the argument is\
    \ a file name. If the file has a logical extension (.css for a style sheet and\
    \ .js for a JavaScript file), you can omit it. If the file has a logical location\
    \ (/css/ for a style sheet and /js/ for a JavaScript file), you can omit it as\
    \ well. Symfony is smart enough to figure out the correct extension or location.\n\
    \nLike the meta and title definitions, the file inclusion definitions require\
    \ the usage of the include_javascripts() and include_stylesheets() helpers in\
    \ the template or layout to be included. This means that the previous settings\
    \ will output the HTML code of Listing 7-27.\n\nListing 7-27 - File Inclusion\
    \ Result"
  merge: -1
  img_proc: true
- pgno: 114
  md: "```\n<head>\n...\n<link rel=\"stylesheet\" type=\"text/css\" media=\"screen\"\
    \ href=\"/css/\nmystyle1.css\" />\n<link rel=\"stylesheet\" type=\"text/css\"\
    \ media=\"screen\" href=\"/css/\nmystyle2.css\" />\n<script language=\"javascript\"\
    \ type=\"text/javascript\"\nsrc=\"http://www.symfony-project.org/js/myscript.js\"\
    >\n</script>\n</head>\n```\n\nRemember that the configuration cascade principle\
    \ applies, so any file inclusion defined in the application view.yml makes it\
    \ appear in every page of the application. Listings 7-28, 7-29, and 7-30 demonstrate\
    \ this principle.\n\n# Listing 7-28 - Sample Application view.yml\n\n```\ndefault:\n\
    \  stylesheets: [main]\n```\n\n# Listing 7-29 - Sample Module view.yml\n\n```\n\
    indexSuccess:\n  stylesheets: [special]\n\nall:\n  stylesheets: [additional]\n\
    ```\n\n# Listing 7-30 - Resulting indexSuccess View\n\n```\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" media=\"screen\" href=\"/css/main.css\" />\n</link rel=\"\
    stylesheet\" type=\"text/css\" media=\"screen\" href=\"/css/\nadditional.css\"\
    \ />\n<link rel=\"stylesheet\" type=\"text/css\" media=\"screen\" href=\"/css/\n\
    special.css\" />\n```\n\nIf you need to remove a file defined at a higher level,\
    \ just add a minus sign (-) in front of the file name in the lower-level definition,\
    \ as shown in Listing 7-31.\n\n# Listing 7-31 - Sample Module view.yml That Removes\
    \ a File Defined at the Application Level\n\n```\nindexSuccess:\n  stylesheets:\
    \ [-main, special]\n\nall:\n  stylesheets: [additional]\n```\n\nTo remove all\
    \ style sheets or JavaScript files, use -* as a file name, as shown in Listing\
    \ 7-32.\n\n# Listing 7-32 - Sample Module view.yml That Removes all Files Defined\
    \ at the Application Level\n\n```\nindexSuccess:\n  stylesheets: [-*]\n  javascripts:\
    \ [-*]\n```"
  merge: -1
  img_proc: true
- pgno: 115
  md: "You can be more accurate and define an additional parameter to force the position\
    \ where to include the file (first or last position), as shown in Listing 7-33.\
    \ This works for both style sheets and JavaScript files.\n\n# Listing 7-33 - Defining\
    \ the Position of the Included Asset\n\n```\n// In the view.yml\nindexSuccess:\n\
    \  stylesheets: [special: { position: first }]\n\n// In the action\n$this->getResponse()->addStylesheet('special',\
    \ 'first');\n\n// In the template\n```\n\nYou can also decide to bypass the transformation\
    \ of the asset file name, so that the resulting <link> or <script> tags refer\
    \ to the exact location specified, as show in Listing 7-34.\n\n# Listing 7-34\
    \ - Style Sheet Inclusion with Raw Name\n\n```\n// In the view.yml\nindexSuccess:\n\
    \  stylesheets: [main, paper: { raw_name: true }]\n\n// In the Action\n$this->getResponse()->addStylesheet('main',\
    \ '', array('raw_name' => true));\n\n// In the template\ntrue)) ?>\n\n// Resulting\
    \ View\n<link rel=\"stylesheet\" type=\"text/css\" href=\"main\" />\n```\n\nTo\
    \ specify media for a style sheet inclusion, you can change the default style\
    \ sheet tag options, as shown in Listing 7-35.\n\n# Listing 7-35 - Style Sheet\
    \ Inclusion with Media\n\n```\n// In the view.yml\nindexSuccess:\n  stylesheets:\
    \ [main, paper: { media: print }]\n\n// In the Action\n$this->getResponse()->addStylesheet('paper',\
    \ '', array('media' =>\n  'print'));\n\n// In the template\n'print')) ?>\n\n//\
    \ Resulting View\n<link rel=\"stylesheet\" type=\"text/css\" media=\"print\" href=\"\
    /css/paper.css\" />\n```"
  merge: -1
  img_proc: true
- pgno: 116
  md: "> **Note about assets inclusions using the view.yml file**\n> \n> The best\
    \ practice is to define the defaults stylesheets and javascripts file in the project\
    \ view.yml file, and include specifics stylesheets or javascripts files in your\
    \ templates using the dedicated helper. This way, you do not have to remove or\
    \ replace already included assets, which can be a painfull in some cases.\n\n\
    # Layout Configuration\n\nAccording to the graphical charter of your website,\
    \ you may have several layouts. Classic websites have at least two: the default\
    \ layout and the pop-up layout.\n\nYou have already seen that the default layout\
    \ is myproject/apps/frontend/templates/layout.php. Additional layouts must be\
    \ added in the same global templates/ directory. If you want a view to use a frontend/templates/my_layout.php\
    \ file, use the syntax shown in Listing 7-36.\n\n```\nListing 7-36 - Layout Definition\n\
    \n// In view.yml\nindexSuccess:\n  layout: my_layout\n\n// In the action\n$this->setLayout('my_layout');\n\
    \n// In the template\n<?php decorate_with('my_layout') ?>\n```\n\nSome views don't\
    \ need any layout at all (for instance, plain text pages or RSS feeds). In that\
    \ case, set has_layout to false, as shown in Listing 7-37.\n\n```\nListing 7-37\
    \ - Layout Removal\n\n// In `view.yml`\nindexSuccess:\n  has_layout: false\n\n\
    // In the Action\n$this->setLayout(false);\n\n// In the template\n<?php decorate_with(false)\
    \ ?>\n```\n\n> Ajax actions views have no layout by default.\n\n# Output Escaping\n\
    \nWhen you insert dynamic data in a template, you must be sure about the data\
    \ integrity. For instance, if data comes from forms filled in by anonymous users,\
    \ there is a risk that it may include malicious scripts intended to launch cross-site\
    \ scripting (XSS) attacks. You must be able to escape the output data, so that\
    \ any HTML tag it contains becomes harmless.\n\nAs an example, suppose that a\
    \ user fills an input field with the following value:"
