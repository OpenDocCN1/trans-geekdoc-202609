- pgno: 55
  md: '# Chapter 5 Configuring Symfony


    To be simple and easy to use, symfony defines a few conventions, which should
    satisfy the most common requirements of standard applications without need for
    modification. However, using a set of simple and powerful configuration files,
    it is possible to customize almost everything about the way the framework and
    your application interact with each other. With these files, you will also be
    able to add specific parameters for your applications.


    This chapter explains how the configuration system works:


    +   - The symfony configuration is kept in files written in YAML, although you
    can always choose another format.

    +   - Configuration files are at the project, application, and module levels in
    a project''s directory structure.

    +   - You can define several sets of configuration settings; in symfony, a set
    of configuration is called an environment.

    +   - The values defined in the configuration files are available from the PHP
    code of your application.

    +   - Additionally, symfony authorizes PHP code in YAML files and other tricks
    to make the configuration system even more flexible.


    # The Configuration System


    Regardless of purpose, most web applications share a common set of characteristics.
    For instance, some sections can be restricted to a subset of users, or the pages
    can be decorated by a layout, or a form can be filled with the user input after
    a failed validation. A framework defines a structure for emulating these characteristics,
    and the developer can further tweak them by changing a configuration setting.
    This strategy saves a lot of development time, since many changes don''t require
    a single line of code, even if there is a lot of code behind. It is also much
    more efficient, because it ensures such information can be maintained in a single
    and easily identifiable location.


    However, this approach has two serious drawbacks:


    +   - Developers end up writing endlessly complex XML files.

    +   - In a PHP architecture, every request takes much longer to process.


    Taking these disadvantages into account, symfony uses configuration files only
    for what they are best at doing. As a matter of fact, the ambition of the configuration
    system in symfony is to be:


    +   - Powerful: Almost every aspect that can be managed using configuration files
    is managed using configuration files.'
  merge: -1
  img_proc: true
- pgno: 56
  md: '+   - Simple: Many aspects of configuration are not shown in a normal application,
    since they seldom need to be changed.

    +   - Easy: Configuration files are easy to read, to modify, and to create by
    the developer.

    +   - Customizable: The default configuration language is YAML, but it can be
    INI, XML, or whatever format the developer prefers.

    +   - Fast: The configuration files are never processed by the application but
    by the configuration system, which compiles them into a fast-processing chunk
    of code for the PHP server.


    # YAML Syntax and Symfony Conventions


    For its configuration, symfony uses the YAML format by default, instead of more
    traditional INI or XML formats. YAML shows structure through indentation and is
    fast to write. Its advantages and basic rules were already described in Chapter
    1. However, you need to keep a few conventions in mind when writing YAML files.
    This section introduces several of the most prominent conventions. For a complete
    dissertation on the topic, read the dedicated chapter on the reference guide book31.


    First of all, never use tabs in YAML files; use spaces instead. YAML parsers can''t
    understand files with tabs, so indent your lines with spaces (a double blank is
    the symfony convention for indentation), as shown in Listing 5-1.


    Listing 5-1 - YAML Files Forbid Tabs


    ```

    # Never use tabs

    all:

    -> mail:

    -> -> webmaster:  webmaster@example.com


    # Use blanks instead

    all:

    mail:

    webmaster:  webmaster@example.com

    ```


    If your parameters are strings starting or ending with spaces, contain special
    characters (such as the “octothorpe” (#) or comma), or key words such as “true,
    false” (where a string is intended) you must enclose the value in single quotes,
    as shown in Listing 5-2.


    Listing 5-2 - Nonstandard Strings Should Be Enclosed in Single Quotes


    ```

    error1:  This field is compulsory

    error2:  '' This field is compulsory ''

    error3:  ''Don''''t leave this field blank''  # Single quotes must be doubled

    error4:  ''Enter a # symbol to define an extension number''

    i18n:    ''false'' # if we left off the quotes here, a boolean false would be
    returned

    ```


    You can define long strings in multiple lines, and also multiple-line strings,
    with the special string headers ( > and | ) plus an additional indentation. Listing
    5-3 demonstrates this convention.


    Listing 5-3 - Defining Long and Multiline Strings


    ```

    # Folded style, introduced by >

    # Each line break is folded to a space

    # Makes YAML more readable

    accomplishment: >

    ```


    31. http://www.symfony-project.org/reference/1_4/en/02-YAML'
