  md: "# Alternative Caching storage\n\nBy default, the symfony cache system stores\
    \ data in files on the web server hard disk. You may want to store cache in memory\
    \ (for instance, via memcached⁴⁹) or in a database (notably if you want to share\
    \ your cache among several servers or speed up cache removal). You can easily\
    \ alter symfony’s default cache storage system because the cache class used by\
    \ the symfony view cache manager is defined in factories.yml.\nThe default view\
    \ cache storage factory is the sfFileCache class:\n\n```\nview_cache:\n class:\
    \ sfFileCache\n param:\n automaticCleaningFactor: 0\n cacheDir: %SF_TEMPLATE_CACHE_DIR%\n\
    ```\n\nYou can replace the class with your own cache storage class or with one\
    \ of the symfony alternative classes (including sfAPCCache, sfEAcceleratorCache,\
    \ sfMemcacheCache, sfSQLiteCache, and sfXCacheCache). The parameters defined under\
    \ the param key are passed to the constructor of the cache class as an associative\
    \ array. Any view cache storage class must implement all methods found in the\
    \ abstract sfCache class. Refer to the Chapter 19 for more information on this\
    \ subject.\n\nConfiguration for a memcache backend using two memcache servers:\
    \ view_cache: class: sfMemcacheCache param: servers: server_1: host: 192.168.1.10\
    \ server_2: host: 192.168.1.11\n\n# Using the Super Fast Cache\n\nEven a cached\
    \ page involves some PHP code execution. For such a page, symfony still loads\
    \ the configuration, builds the response, and so on. If you are really sure that\
    \ a page is not going to change for a while, you can bypass symfony completely\
    \ by putting the resulting HTML code directly into the web/ folder. This works\
    \ thanks to the Apache mod_rewrite settings, provided that your routing rule specifies\
    \ a pattern ending without a suffix or with .html.\n\nYou can do this by hand,\
    \ page by page, with a simple command-line call:\n\n```\n$ curl http://myapp.example.com/user/list.html\
    \ > web/user/list.html\n```\n\nAfter that, every time that the user/list action\
    \ is requested, Apache finds the corresponding list.html page and bypasses symfony\
    \ completely. The trade-off is that you can’t control the page cache with symfony\
    \ anymore (lifetime, automatic deletion, and so on), but the speed gain is very\
    \ impressive.\n\nAlternatively, you can use the sfSuperCache symfony plug-in,\
    \ which automates the process and supports lifetime and cache clearing. Refer\
    \ to Chapter 17 for more information about plug-ins."
  merge: -1
  img_proc: true
- pgno: 208
  md: '# Other Speedup tactics


    In addition to the HTML cache, symfony has two other cache mechanisms, which are
    completely automated and transparent to the developer. In the production environment,
    the configuration and the template translations are cached in files stored in
    the myproject/cache/config/ and myproject/cache/i18n/ directories without any
    intervention.


    PHP accelerators (eAccelerator, APC, XCache, and so on), also called opcode caching
    modules, increase performance of PHP scripts by caching them in a compiled state,
    so that the overhead of code parsing and compiling is almost completely eliminated.
    This is particularly effective for the ORMs classes, which contain a great amount
    of code. These accelerators are compatible with symfony and can easily triple
    the speed of an application. They are recommended in production environments for
    any symfony application with a large audience.


    With a PHP accelerator, you can manually store persistent data in memory, to avoid
    doing the same processing for each request, with the sfAPCCache class if use APC
    for instance. And if you want to cache the result of a CPU-intensive function,
    you will probably use the sfFunctionCache object. Refer to Chapter 18 for more
    information about these mechanisms.


    # Removing Items from the Cache


    If the scripts or the data of your application change, the cache will contain
    outdated information. To avoid incoherence and bugs, you can remove parts of the
    cache in many different ways, according to your needs.


    # Clearing the Entire Cache


    The cache:clear task of the symfony command line erases the cache (HTML, configuration,
    routing, and i18n cache). You can pass it arguments to erase only a subset of
    the cache, as shown in Listing 12-8. Remember to call it only from the root of
    a symfony project.


    Listing 12-8 - Clearing the Cache


    ```

    // Erase the whole cache

    $ php symfony cache:clear


    // Short syntax

    $ php symfony cc


    // Erase only the cache of the frontend application

    $ php symfony cache:clear --app=frontend


    // Erase only the HTML cache of the frontend application

    $ php symfony cache:clear --app=frontend --type=template


    // Erase only the configuration cache of the frontend application

    // The built-types are config, i18n, routing, and template.

    $ php symfony cache:clear --app=frontend --type=config


    // Erase only the configuration cache of the frontend application and the prod
    environment

    $ php symfony cache:clear --app=frontend --type=config --env=prod

    ```'
  merge: -1
  img_proc: true
