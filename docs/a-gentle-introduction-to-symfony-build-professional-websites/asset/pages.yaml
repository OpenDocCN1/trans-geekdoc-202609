    After defining the name of the application (frontend), the environment (prod),
    and the debug mode (false), the application configuration is called before creating
    a context and dispatching. So a few useful methods are available in the application
    configuration class:


    +   - $configuration->getRootDir(): Project root directory (normally, should remain
    at its default value, unless you change the file structure).

    +   - $configuration->getApplication(): Application name in the project. Necessary
    to compute file paths.

    +   - $configuration->getEnvironment(): Environment name (prod, dev, test, or
    any other project-specific environment that you define). Will determine which
    configuration settings are to be used. Environments are explained later in this
    chapter.

    +   - $configuration->isDebug(): Activation of the debug mode (see Chapter 16
    for details).


    If you want to change one of these values, you probably need an additional front
    controller. The next chapter will tell you more about front controllers and how
    to create a new one.


    # ## Main Application Configuration


    The main application configuration is stored in files located in the myproject/apps/frontend/config/
    directory:


    +   - app.yml: This file should contain the application-specific configuration;
    that is, global variables defining business or applicative logic specific to an
    application, which don''t need to be stored in a database. Tax rates, shipping
    fares, and e-mail addresses are often stored in this file. It is empty by default.

    +   - frontendConfiguration.class.php: This class bootstraps the application,
    which means that it does all the very basic initializations to allow the application
    to start. This is where you can customize your directory structure or add application-specific
    constants (Chapter 19 provides more details). It inherits from the sfApplicationConfiguration
    class.

    +   - factories.yml: Symfony defines its own class to handle the view, the request,
    the response, the session, and so on. If you want to use your own classes instead,
    this is where you can specify them. Chapter 17 provides more information.

    +   - filters.yml: Filters are portions of code executed for every request. This
    file is where you define which filters are to be processed, and it can be overridden
    for each module. Chapter 6 discusses filters in more detail.

    +   - routing.yml: The routing rules, which allow transforming unreadable and
    unbookmarkable URLs into "smart" and explicit ones, are stored in this file. For
    new applications, a few default rules exist. Chapter 9 is all about links and
    routing.

    +   - settings.yml: The main settings of a symfony application are defined in
    this file. This is where you specify if your application has internationalization,
    its default language, the request timeout and whether caching is turned on. With
    a one-line change in this file, you can shut down the application so you can perform
    maintenance or upgrade one of its components. The common settings and their use
    are described in Chapter 19.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '+   view.yml: The structure of the default view (name of the layout, default
    style sheets and JavaScript files to be included, default content-type, and so
    on) is set in this file. Chapter 7 will tell you more about this file. These settings
    can be overridden for each module.


    > All the symfony configuration files are described in great details in the symfony
    reference book32.


    # Internationalization Configuration


    Internationalized applications can display pages in several languages. This requires
    specific configuration. There are two configuration places for internationalization:


    +   The factories.yml of the application config/ directory: This file defines
    the i18n factory and general translation options, such as the default culture
    for the translation, whether the translations come from files or a database, and
    their format.


    +   Translation files in the application i18n/ directory: These are basically
    dictionaries, giving a translation for each of the phrases used in the application
    templates so that the pages show translated text when the user switches language.


    Note that the activation of the i18n features is set in the settings.yml file.
    You will find more information about these features in Chapter 13.


    # Additional Application Configuration


    A second set of configuration files is in the symfony installation directory (in
    sfConfig::get(''sf_symfony_lib_dir'')/config/config/) and doesn''t appear in the
    configuration directory of your applications. The settings defined there are defaults
    that seldom need to be modified, or that are global to all projects. However,
    if you need to modify them, just create an empty file with the same name in your
    myproject/apps/frontend/config/ directory, and override the settings you want
    to change. The settings defined in an application always have precedence over
    the ones defined in the framework. The following are the configuration files in
    the symfony installation config/ directory:


    +   autoload.yml: This file contains the settings of the autoloading feature.
    This feature exempts you from requiring custom classes in your code if they are
    located in specific directories. It is described in detail in Chapter 19.


    +   core_compile.yml: These are lists of classes to be included to start an application.
    These classes are actually concatenated into an optimized PHP file without comments,
    which will accelerate the execution by minimizing the file access operations (one
    file is loaded instead of more than forty for each request). This is especially
    useful if you don''t use a PHP accelerator. Optimization techniques are described
    in Chapter 18.


    +   config_handlers.yml: This is where you can add or modify the handlers used
    to process each configuration file. Chapter 19 provides more details.


    # Module Configuration


    By default, a module has no specific configuration. But, if required, you can
    override some application-level settings for a given module. For instance, you
    might do this to include a specific JavaScript file for all actions of a module.
    You can also choose to add new parameters restricted to a specific module to preserve
    encapsulation.'
  merge: -1
  img_proc: true
- pgno: 63
  md: 'As you may have guessed, module configuration files must be located in a myproject/apps/frontend/modules/mymodule/config/
    directory. These files are as follows:


    +   - generator.yml: For modules generated according to a database table (scaffoldings
    and administrations), this file defines how the interface displays rows and fields,
    and which interactions are proposed to the user (filters, sorting, buttons, and
    so on). Chapter 14 will tell you more about it.

    +   - module.yml: This file contains custom parameters specific to a module and
    action configuration. Chapter 6 provides more details.

    +   - security.yml: This file sets access restrictions for actions. This is where
    you specify that a page can be viewed only by registered users or by a subset
    of registered users with special permissions. Chapter 6 will tell you more about
    it.

    +   - view.yml: This file contains configuration for the views of one or all of
    the actions of a module. It overrides the application view.yml and is described
    in Chapter 7.


    Most module configuration files offer the ability to define parameters for all
    the views or all the actions of a module, or for a subset of them.


    # Too many files?


    You might be overwhelmed by the number of configuration files present in the application.
    But please keep the following in mind:


    Most of the time, you don''t need to change the configuration, since the default
    conventions match the most common requirements. Each configuration file is related
    to a particular feature, and the next chapters will detail their use one by one.
    When you focus on a single file, you can see clearly what it does and how it is
    organized. For professional web development, the default configuration is often
    not completely adapted. The configuration files allow for an easy modification
    of the symfony mechanisms without code. Imagine the amount of PHP code necessary
    to achieve the same amount of control. If all the configuration were located in
    one file, not only would the file be completely unreadable, but you could not
    redefine configuration at several levels (see the “Configuration Cascade” section
    later in this chapter).


    The configuration system is one of the great strengths of symfony, because it
    makes symfony usable for almost every kind of web application, and not only for
    the ones for which the framework was originally designed.


    # Environments


    During the course of application development, you will probably need to keep several
    sets of configuration in parallel. For instance, you will need to have the connection
    settings for your tests database available during development, and the ones for
    your real data available for production. To answer the need of concurrent configurations,
    symfony offers different environments.


    # What Is an Environment?


    An application can run in various environments. The different environments share
    the same PHP code (apart from the front controller), but can have completely different
    configurations. For each application, symfony provides three default environments:
    production (prod), test (test), and development (dev). You''re also free to add
    as many custom environments as you wish.


    So basically, environments and configuration are synonyms. For instance, a test
    environment will log alerts and errors, while a prod environment will only log
    errors. Cache acceleration'
  merge: -1
  img_proc: true
- pgno: 64
  md: 'is often deactivated in the dev environment, but activated in the test and
    prod environments. The dev and test environments may need test data, stored in
    a database distinct from the one used in the production environment. So the database
    configuration will be different between the two environments. All environments
    can live together on the same machine, although a production server generally
    contains only the prod environment.


    In the dev environment, the logging and debugging settings are all enabled, since
    maintenance is more important than performance. On the contrary, the prod environment
    has settings optimized for performance by default, so the production configuration
    turns off many features. A good rule of thumb is to navigate in the development
    environment until you are satisfied with the feature you are working on, and then
    switch to the production environment to check its speed.


    The test environment differs from the dev and prod environment in other ways.
    You interact with this environment solely through the command line for the purpose
    of functional testing and batch scripting. Consequently, the test environment
    is close to the production one, but it is not accessed through a web browser.
    It simulates the use of cookies and other HTTP specific components.


    To change the environment in which you''re browsing your application, just change
    the front controller. Until now, you have seen only the development environment,
    since the URLs used in the example called the development front controller:


    ```

    http://localhost/frontend_dev.php/mymodule/index

    ```


    However, if you want to see how the application reacts in production, call the
    production front controller instead:


    ```

    http://localhost/index.php/mymodule/index

    ```


    If your web server has mod_rewrite enabled, you can even use the custom symfony
    rewriting rules, written in web/.htaccess. They define the production front controller
    as the default execution script and allow for URLs like this:


    ```

    http://localhost/mymodule/index

    ```'
  merge: -1
  img_proc: true
- pgno: 65
  md: '# # Environments and Servers


    Don''t mix up the notions of environment and server. In symfony, different environments
    are different configurations, and correspond to a front controller (the script
    that executes the request). Different servers correspond to different domain names
    in the URL.


    ```

    Listing 5-21 http://localhost/frontend_dev.php/mymodule/index

    server environment

    ```


    Usually, developers work on applications in a development server, disconnected
    from the Internet and where all the server and PHP configuration can be changed
    at will. When the time comes for releasing the application to production, the
    application files are transferred to the production server and made accessible
    to the end users.


    This means that many environments are available on each server. For instance,
    you can run in the production environment even on your development server. However,
    most of the time, only the production environment should be accessible in the
    production server, to avoid public visibility of server configuration and security
    risks. To prevent accidental exposure of the non-production controllers on the
    production system, symfony adds a basic IP check to these front controllers, which
    will allow access only from localhost. If you want to have them accessible to
    you can remove that, but think about the risk of having this accessible by anyone,
    as malicious users could guess the default frontend_dev.php and get access to
    a lot of sensitive information.


    To add a new environment, you don''t need to create a directory or to use the
    symfony CLI. Simply create a new front controller and change the environment name
    definition in it. This environment inherits all the default configuration plus
    the settings that are common to all environments. The next chapter will show you
    how to do this.


    # # Configuration Cascade


    The same setting can be defined more than once, in different places. For instance,
    you may want to set the mime-type of your pages to text/html for all of the application,
    except for the pages of an rss module, which will need a text/xml mime-type. Symfony
    gives you the ability to write the first setting in frontend/config/view.yml and
    the second in frontend/modules/rss/config/view.yml. The configuration system knows
    that a setting defined at the module level must override a setting defined at
    the application level.


    In fact, there are several configuration levels in symfony:


    +   - Granularity levels:

    +     - The default configuration located in the framework

    +     - The global configuration for the whole project (in myproject/config/)

    +     - The local configuration for an application of the project (in myproject/apps/frontend/config/)

    +     - The local configuration restricted to a module (in myproject/apps/frontend/modules/mymodule/config/)

    +   - Environment levels:

    +     - Specific to one environment

    +     - For all environments


    Of all the properties that can be customized, many are environment-dependent.
    Consequently, many YAML configuration files are divided by environment, plus a
    tail section for all environments. The result is that typical symfony configuration
    looks like Listing 5-12.'
  merge: -1
  img_proc: true
- pgno: 66
  md: "# Listing 5-12 - The Structure of Symfony Configuration Files\n\n```\n# Production\
    \ environment settings\nprod:\n...\n\n# Development environment settings\ndev:\n\
    ...\n\n# Test environment settings\ntest:\n...\n\n# Custom environment settings\n\
    myenv:\n...\n\n# Settings for all environments\nall:\n...\n```\n\nIn addition,\
    \ the framework itself defines default values in files that are not located in\
    \ the project tree structure, but in the sfConfig::get('sf_symfony_lib_dir')/config/config/\
    \ directory of your symfony installation. The default configuration is set in\
    \ these files as shown in Listing 5-13. These settings are inherited by all applications.\n\
    \n# Listing 5-13 - The Default Configuration, in sfConfig::get('sf_symfony_lib_dir')/config/config/settings.yml\n\
    \n```\n# Default settings:\ndefault:\n  .actions:\n    default_module:      default\n\
    \    default_action:      index\n    ...\n```\n\nThese default definitions are\
    \ repeated in the project, application, and module configuration files as comments,\
    \ as shown in Listing 5-14, so that you know that some parameters are defined\
    \ by default and that they can be modified.\n\n# Listing 5-14 - The Default Configuration,\
    \ Repeated for Information, in frontend/config/settings.yml\n\n```\n#all:\n  #\
    \ .actions:\n    #   default_module:      default\n    #   default_action:   \
    \   index\n    #   ...\n```\n\nThis means that a property can be defined several\
    \ times, and the actual value results from a definition cascade. A parameter definition\
    \ in a named environment has precedence over the same parameter definition for\
    \ all environments, which has precedence over a definition in the default configuration.\
    \ A parameter definition at the module level has precedence over the same parameter\
    \ definition at the application level, which has precedence over a definition\
    \ at the project level. This can be wrapped up in the following priority list:\n\
    \n+   1. Module\n+   2. Application"
  merge: -1
  img_proc: true
- pgno: 67
  md: "+   3. Project\n+   4. Specific environment\n+   5. All environments\n+   6.\
    \ Default\n\n# # The Configuration Cache\n\nParsing YAML and dealing with the\
    \ configuration cascade at runtime represent a significant overhead for each request.\
    \ Symfony has a built-in configuration cache mechanism designed to speed up requests.\n\
    \nThe configuration files, whatever their format, are processed by some special\
    \ classes, called handlers, that transform them into fast-processing PHP code.\
    \ In the development environment, the handlers check the configuration for changes\
    \ at each request, to promote interactivity. They parse the recently modified\
    \ files so that you can see a change in a YAML file immediately. But in the production\
    \ environment, the processing occurs once during the first request, and then the\
    \ processed PHP code is stored in the cache for subsequent requests. The performance\
    \ is guaranteed, since every request in production will just execute some well-optimized\
    \ PHP code.\n\nFor instance, if the app.yml file contains this:\n\n```\nall:\n\
    \    # Setting for all environments\nmail:\n  webmaster:  webmaster@example.com\n\
    ```\n\nthen the file config_app.yml.php, located in the cache/ folder of your\
    \ project, will contain this:\n\n```\n<?php\nsfConfig::add(array(\n  'app_mail_webmaster'\
    \ => 'webmaster@example.com',\n));\n\n```\n\nAs a consequence, most of the time,\
    \ the YAML files aren't even parsed by the framework, which relies on the configuration\
    \ cache instead. However, in the development environment, symfony will systematically\
    \ compare the dates of modification of the YAML files and the cached files, and\
    \ reprocess only the ones that have changed since the previous request.\n\nThis\
    \ presents a major advantage over many PHP frameworks, where configuration files\
    \ are compiled at every request, even in production. Unlike Java, PHP doesn't\
    \ share an execution context between requests. For other PHP frameworks, keeping\
    \ the flexibility of XML configuration files requires a major performance hit\
    \ to process all the configuration at every request. This is not the case in symfony.\
    \ Thanks to the cache system, the overhead caused by configuration is very low.\n\
    \nThere is an important consequence of this mechanism. If you change the configuration\
    \ in the production environment, you need to force the reparsing of all the configuration\
    \ files for your modification to be taken into account. For that, you just need\
    \ to clear the cache, either by deleting the content of the cache/ directory or,\
    \ more easily, by calling the cache:clear task:\n\n```\n$ php symfony cache:clear\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 68
  md: "# # Accessing the Configuration from Code\n\nAll the configuration files are\
    \ eventually transformed into PHP, and many of the settings they contain are automatically\
    \ used by the framework, without further intervention. However, you sometimes\
    \ need to access some of the settings defined in the configuration files from\
    \ your code (in actions, templates, custom classes, and so on). The settings defined\
    \ in settings.yml, app.yml, and module.yml are available through a special class\
    \ called sfConfig.\n\n# ## The sfConfig Class\n\nYou can access settings from\
    \ within the application code through the sfConfig class. It is a registry for\
    \ configuration parameters, with a simple getter class method, accessible from\
    \ every part of the code:\n\n```\n```php\n// Retrieve a setting\n$parameter =\
    \ sfConfig::get('param_name', $default_value);\n```\n```\n\nNote that you can\
    \ also define, or override, a setting from within PHP code:\n\n```\n```php\n//\
    \ Define a setting\nsfConfig::set('param_name', $value);\n```\n```\n\nThe parameter\
    \ name is the concatenation of several elements, separated by underscores, in\
    \ this order:\n\n+   - A prefix related to the configuration file name (sf_ for\
    \ settings.yml, app_ for app.yml, mod_ for module.yml)\n+   - The parent keys\
    \ (if defined), in lowercase\n+   - The name of the key, in lowercase\n\nThe environment\
    \ is not included, since your PHP code will have access only to the values defined\
    \ for the environment in which it's executed.\n\nFor instance, if you need to\
    \ access the values defined in the app.yml file shown in Listing 5-15, you will\
    \ need the code shown in Listing 5-16.\n\n# ### Listing 5-15 - Sample app.yml\
    \ Configuration\n\n```\n```yaml\nall:\n  .general:\n    tax:             19.6\n\
    \    default_user:\n      name:          John Doe\n    mail:\n      webmaster:\
    \     webmaster@example.com\n      contact:       contact@example.com\ndev:\n\
    \  mail:\n    webmaster:     dummy@example.com\n    contact:       dummy@example.com\n\
    ```\n```\n\n# ### Listing 5-16 - Accessing Configuration Settings in PHP in the\
    \ dev Environment\n\n```\n```php\necho sfConfig::get('app_tax');  // Remember\
    \ that category headers are\n                                    ignored\n   \
    \                                 => '19.6'\necho sfConfig::get('app_default_user_name');\n\
    ```\n```"
  merge: -1
  img_proc: true
- pgno: 69
  md: "```\n=> 'John Doe'\necho sfConfig::get('app_mail_webmaster');\n=> 'dummy@example.com'\n\
    echo sfConfig::get('app_mail_contact');\n=> 'dummy@example.com'\n```\n\nSo symfony\
    \ configuration settings have all the advantages of PHP constants, but without\
    \ the disadvantages, since the value can be changed.\n\nOn that account, the settings.yml\
    \ file, where you can set the framework settings for an application, is the equivalent\
    \ to a list of sfConfig::set() calls. Listing 5-17 is interpreted as shown in\
    \ Listing 5-18.\n\n# Listing 5-17 - Extract of settings.yml\n\n```\nListing 5-32\n\
    all:\n  .settings:\n    csrf_secret:  FooBar\n    escaping_strategy: true\n  \
    \  escaping_method:  ESC_SPECIALCHARS\n```\n\n# Listing 5-18 - What Symfony Does\
    \ When Parsing settings.yml\n\n```\nListing 5-33\nsfConfig::add(array(\n  'sf_csrf_secret'\
    \ => 'FooBar',\n  'sf_escaping_strategy' => true,\n  'sf_escaping_method' => 'ESC_SPECIALCHARS',\n\
    ));\n```\n\nRefer to Chapter 19 for the meanings of the settings found in the\
    \ settings.yml file.\n\n# Custom Application Settings and app.yml\n\nMost of the\
    \ settings related to the features of an application should be stored in the app.yml\
    \ file, located in the myproject/apps/frontend/config/ directory. This file is\
    \ environment-dependent and empty by default. Put in every setting that you want\
    \ to be easily changed, and use the sfConfig class to access these settings from\
    \ your code. Listing 5-19 shows an example.\n\n# Listing 5-19 - Sample app.yml\
    \ to Define Credit Card Operators Accepted for a Given Site\n\n```\nListing 5-34\n\
    all:\n  creditcards:\n    fake:    false\n    visa:    true\n    americanexpress:\
    \ true\ndev:\n  creditcards:\n    fake:    true\n```\n\nTo know if the fake credit\
    \ cards are accepted in the current environment, get the value of:\n\n```\nListing\
    \ 5-35\nsfConfig::get('app_creditcards_fake');\n```\n\n> When you should require\
    \ an PHP array directly beneath the all key you need to use a category header,\
    \ otherwise symfony will make the values separately available as shown above."
  merge: -1
