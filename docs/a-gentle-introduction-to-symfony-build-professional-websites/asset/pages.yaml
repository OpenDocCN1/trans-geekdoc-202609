    # Common Instruments


    A few techniques are used repeatedly in symfony, and you will meet them quite
    often in this book and in your own projects. These include parameter holders,
    constants, and class autoloading.


    # Parameter Holders


    Many of the symfony classes contain a parameter holder. It is a convenient way
    to encapsulate attributes with clean getter and setter methods. For instance,
    the sfRequest class holds a parameter holder that you can retrieve by calling
    the getParameterHolder() method. Each parameter holder stores data the same way,
    as illustrated in Listing 2-14.


    # Listing 2-14 - Using the sfRequest Parameter Holder


    ```

    ```php

    $request->getParameterHolder()->set(''foo'', ''bar'');

    echo $request->getParameterHolder()->get(''foo'');

    => ''bar''

    ```

    ```


    Most of the classes using a parameter holder provide proxy methods to shorten
    the code needed for get/set operations. This is the case for the sfRequest object,
    so you can do the same as in Listing 2-14 with the code of Listing 2-15.


    # Listing 2-15 - Using the sfRequest Parameter Holder Proxy Methods


    ```

    ```php

    $request->setParameter(''foo'', ''bar'');

    echo $request->getParameter(''foo'');

    => ''bar''

    ```

    ```


    The parameter holder getter accepts a default value as a second argument. This
    provides a useful fallback mechanism that is much more concise than possible with
    a conditional statement. See Listing 2-16 for an example.


    # Listing 2-16 - Using the Attribute Holder Getter''s Default Value'
