- pgno: 363
  md: 'Their methods usually return an object or a collection of objects of the related
    object class, as shown in Listing 8-6.


    ```

    Listing 8-6 - Static Methods to Retrieve Records Are Available in the Peer Class

    // $articles is an array of objects of class Article

    $articles = ArticlePeer::retrieveByPks(array(123, 124, 125));

    ```


    > From a data model point of view, there cannot be any peer object. That''s why
    the methods

    > of the peer classes are called with a :: (for static method call), instead of
    the usual -> (for

    > instance method call).


    So combining object and peer classes in a base and a custom version results in
    four classes

    generated per table described in the schema. In fact, there is a fifth class created
    in the lib/

    model/map/ directory, which contains metadata information about the table that
    is needed

    for the runtime environment. But as you will probably never change this class,
    you can forget

    about it.


    # Accessing Data


    In symfony, your data is accessed through objects. If you are used to the relational
    model and

    using SQL to retrieve and alter your data, the object model methods will likely
    look

    complicated. But once you''ve tasted the power of object orientation for data
    access, you will

    probably like it a lot.


    But first, let''s make sure we share the same vocabulary. Relational and object
    data model use

    similar concepts, but they each have their own nomenclature:


    | Relational | Object-Oriented |

    | --- | --- |

    | Table | Class |

    | Row, record | Object |

    | Field, column | Property |


    # Retrieving the Column Value


    When symfony builds the model, it creates one base object class for each of the
    tables defined

    in the schema.yml. Each of these classes comes with default constructors, accessors,
    and

    mutators based on the column definitions: The new, getXXX(), and setXXX() methods
    help

    to create objects and give access to the object properties, as shown in Listing
    8-7.


    ```

    Listing 8-7 - Generated Object Class Methods

    $article = new Article();

    $article->setTitle(''My first article'');

    $article->setContent("This is my very first article.\n Hope you enjoy

    it!");


    $title = $article->getTitle();

    $content = $article->getContent();

    ```


    > The generated object class is called Article, which is the phpName given to
    the

    > blog_article table. If the phpName were not defined in the schema, the class
    would have'
