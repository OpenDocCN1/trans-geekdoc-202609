- pgno: 227
  md: 'Another way to organize translation dictionaries is to split them by module.
    Instead of writing a single messages.XX.xml file for the whole application, you
    can write one in each modules/[module_name]/i18n/ directory. It makes modules
    more independent from the application, which is necessary if you want to reuse
    them, such as in plug-ins (see Chapter 17).


    As updating the i18n dictionaries by hand is quite error prone, symfony provides
    a task to automate the process. The i18n:extract task parses a symfony application
    to extract all the strings that need to be translated. It takes an application
    and a culture as its arguments:


    ```

    $ php symfony i18n:extract frontend en

    ```


    By default, the task does not modify your dictionaries, it just outputs the number
    of new and old i18n strings. To append the new strings to your dictionary, you
    can pass the --auto-save option:


    ```

    $ php symfony i18n:extract --auto-save frontend en

    ```


    You can also delete old strings automatically by passing the --auto-delete option:


    ```

    $ php symfony i18n:extract --auto-save --auto-delete frontend en

    ```


    > The current task has some known limitations. It can only works with the default
    messages dictionary, and for file based backends (XLIFF or gettext), it only saves
    and deletes strings in the main apps/frontend/i18n/messages.XX.xml file.


    # Handling Other Elements Requiring Translation


    The following are other elements that may require translation:


    +   Images, text documents, or any other type of assets can also vary according
    to the user culture. The best example is a piece of text with a special typography
    that is actually an image. For these, you can create subdirectories named after
    the user culture:


    ```

    <?php echo image_tag($sf_user->getCulture().''/myText.gif'') ?>

    ```


    +   Error messages from validation files are automatically output by a __(), so
    you just need to add their translation to a dictionary to have them translated.


    +   The default symfony pages (page not found, internal server error, restricted
    access, and so on) are in English and must be rewritten in an i18n application.
    You should probably create your own default module in your application and use
    __() in its templates. Refer to Chapter 19 to see how to customize these pages.


    # Handling Complex Translation Needs


    Translation only makes sense if the __() argument is a full sentence. However,
    as you sometimes have formatting or variables mixed with words, you could be tempted
    to cut sentences into several chunks, thus calling the helper on senseless phrases.
    Fortunately, the __() helper offers a replacement feature based on tokens, which
    will help you to have a meaningful dictionary that is easier to handle by translators.
    As with HTML formatting, you can leave it in the helper call as well. Listing
    13-16 shows an example.


    # Listing 13-16 - Translating Sentences That Contain Code'
