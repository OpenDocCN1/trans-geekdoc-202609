  md: '# Chapter 11

    Emails


    Sending emails with symfony is simple and powerful, thanks to the usage of the
    Swift Mailer43 library. Although Swift Mailer makes sending emails easy, symfony
    provides a thin wrapper on top of it to make sending emails even more flexible
    and powerful. This chapter will teach you how to put all the power at your disposal.


    symfony 1.3 embeds Swift Mailer version 4.1.


    # Introduction


    Email management in symfony is centered around a mailer object. And like many
    other core symfony objects, the mailer is a factory. It is configured in the factories.yml
    configuration file, and always available via the context instance:


    ```

    $mailer = sfContext::getInstance()->getMailer();

    ```


    Unlike other factories, the mailer is loaded and initialized on demand. If you
    don''t use it, there is no performance impact whatsoever.


    This tutorial explains the Swift Mailer integration in symfony. If you want to
    learn the nitty-gritty details of the Swift Mailer library itself, refer to its
    dedicated documentation44.


    # Sending Emails from an Action


    From an action, retrieving the mailer instance is made simple with the getMailer()
    shortcut method:


    ```

    $mailer = $this->getMailer();

    ```


    # The Fastest Way


    Sending an email is then as simple as using the sfAction::composeAndSend() method:


    43. http://www.swiftmailer.org/

    44. http://www.swiftmailer.org/docs'
