  md: '# Code Organization


    Now that you know the different components of a symfony application, you’re probably
    wondering how they are organized. Symfony organizes code in a project structure
    and puts the project files into a standard tree structure.


    # Project Structure: Applications, Modules, and Actions


    In symfony, a project is a set of services and operations available under a given
    domain name, sharing the same object model.


    Inside a project, the operations are grouped logically into applications. An application
    can normally run independently of the other applications of the same project.
    In most cases, a project will contain two applications: one for the front-office
    and one for the back-office, sharing the same database. But you can also have
    one project containing many mini-sites, with each site as a different application.
    Note that hyperlinks between applications must be in the absolute form.


    Each application is a set of one or more modules. A module usually represents
    a page or a group of pages with a similar purpose. For example, you might have
    the modules home, articles, help, shoppingCart, account, and so on.


    Modules hold actions, which represent the various actions that can be done in
    a module. For example, a shoppingCart module can have the add, show, and update
    actions. Generally, actions can be described by a verb. Dealing with actions is
    almost like dealing with pages in a classic web application, although two actions
    can result in the same page (for instance, adding a comment to a post in a weblog
    will redisplay the post with the new comment).


    > If this represents too many levels for a beginning project, it is very easy
    to group all actions into one single module, so that the file structure can be
    kept simple. When the application gets more complex, it will be time to organize
    actions into separate modules. As mentioned in Chapter 1, rewriting code to improve
    its structure or readability (but preserving its behavior) is called refactoring,
    and you will do this a lot when applying RAD principles.


    Figure 2-3 shows a sample code organization for a weblog project, in a project/application/module/action
    structure. But be aware that the actual file tree structure of the project will
    differ from the setup shown in the figure.


    # Figure 2-3 - Example of code organization


    ![](img/0f886a7f4cbcc3939be96e985ca35ff4_28_0.png)


    # File Tree Structure


    All web projects generally share the same types of contents, such as the following:


    +   - A database, such as MySQL or PostgreSQL'
