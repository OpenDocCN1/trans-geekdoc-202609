    # Customizing the Theme


    There are other partials inherited from the framework that can be overridden in
    the module templates/ folder to match your custom requirements.


    The generator templates are cut into small parts that can be overridden independently,
    and the actions can also be changed one by one.


    However, if you want to override those for several modules in the same way, you
    should probably create a reusable theme. A theme is a sub-set of templates and
    actions that can be used by an administration module if specified in the theme
    value at the beginning of generator.yml. With the default theme, symfony uses
    the files defined in sfConfig::get(''sf_symfony_lib_dir'')/plugins/sfPropelPlugin/data/generator/sfPropelModule/admin/.


    The theme files must be located in a project tree structure, in a data/generator/sfPropelModule/[theme_name]/
    directory, and you can bootstrap a new theme by copying the files you want to
    override from the default theme (located in sfConfig::get(''sf_symfony_lib_dir'')/plugins/sfPropelPlugin/data/generator/sfPropelModule/admin/
    directory):


    ```

    Listing 14-46

    // Partials, in [theme_name]/template/templates/

    _assets.php

    _filters.php

    _filters_field.php

    _flashes.php

    _form.php

    _form_actions.php

    _form_field.php

    _form_fieldset.php

    _form_footer.php

    _form_header.php

    _list.php

    _list_actions.php

    _list_batch_actions.php

    _list_field_boolean.php

    _list_footer.php

    _list_header.php

    _list_td_actions.php

    ```'
