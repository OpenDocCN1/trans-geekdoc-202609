    />

    ```


    There are many other helpers in symfony, and it would take a full book to describe
    all of them. The best reference for helpers is the online [API documentation](http://
    www.symfony-project.org/api/1_4/), where all the helpers are well documented,
    with their syntax, options, and examples.


    # Adding Your Own Helpers


    Symfony ships with a lot of helpers for various purposes, but if you don''t find
    what you need in the API documentation, you will probably want to create a new
    helper. This is very easy to do.


    Helper functions (regular PHP functions returning HTML code) should be saved in
    a file called FooBarHelper.php, where FooBar is the name of the helper group.
    Store the file in the apps/frontend/lib/helper/ directory (or in any helper/ directory
    created under one of the lib/ folders of your project) so it can be found automatically
    by the use_helper(''FooBar'') helper for inclusion.


    > This system even allows you to override the existing symfony helpers. For instance,
    to redefine all the helpers of the Text helper group, just create a TextHelper.php
    file in your apps/frontend/lib/helper/ directory. Whenever you call use_helper(''Text''),
    symfony will use your helper group rather than its own. But be careful: as the
    original file is not even loaded, you must redefine all the functions of a helper
    group to override it; otherwise, some of the original helpers will not be available
    at all.


    # Page Layout


    The template shown in Listing 7-1 is not a valid XHTML document. The DOCTYPE definition
    and the <html> and <body> tags are missing. That''s because they are stored somewhere
    else in the application, in a file called layout.php, which contains the page
    layout. This file, also called the global template, stores the HTML code that
    is common to all pages of the application to avoid repeating it in every template.
    The content of the template is integrated into the layout, or, if you change the
    point of view, the layout "decorates" the template. This is an application of
    the decorator design pattern, illustrated in Figure 7-1.


    > For more information about the decorator and other design patterns, see Patterns
    of Enterprise Application Architecture by Martin Fowler (Addison-Wesley, ISBN:
    0-32112-742-0).


    # Figure 7-1 - Decorating a template with a layout


    ![](img/0f886a7f4cbcc3939be96e985ca35ff4_100_0.png)


    Listing 7-5 shows the default page layout, located in the application templates/
    directory.


    Listing 7-5 - Default Layout, in myproject/apps/frontend/templates/layout.php'
