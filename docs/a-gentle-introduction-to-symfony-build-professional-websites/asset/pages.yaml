  md: '# Chapter 10 Forms


    Dealing with the display of form inputs, the validation of a form submission,
    and all the particular cases of forms is one of the most complex tasks in web
    development. Luckily, symfony provides a simple interface to a very powerful form
    sub-framework, and helps you to design and handle forms of any level of complexity
    in just a few lines of code.


    # Displaying a Form


    A simple contact form featuring a name, an email, a subject and a message fields
    typically renders as follows:


    | Name | |

    |---|---|

    | Email | |

    | Subject | Subject A ▼ |

    | | Subject A |

    | | Subject B |

    | | Subject C |

    | Message | |

    | | Submit Query |


    In symfony, a form is an object defined in the action and passed to the template.
    In order to display a form, you must first define the fields it contains - symfony
    uses the term “widget”. The simplest way to do it is to create a new sfForm object
    in the action method.


    ```

    // in modules/foo/actions/actions.class.php

    public function executeContact($request)

    {

    $this->form = new sfForm();

    $this->form->setWidgets(array(

    ''name'' => new sfWidgetFormInputText(),

    ```'
