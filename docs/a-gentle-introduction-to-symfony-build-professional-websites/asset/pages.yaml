  md: "Symfony packages these extensions into behaviors. Behaviors are external classes\
    \ that provide additional methods to model classes. The model classes already\
    \ contain hooks, and symfony knows how to extend them.\n\nTo enable behaviors\
    \ in your model classes, you must modify one setting in the config/propel.ini\
    \ file:\n\n```\npropel.builder.AddBehaviors = true    // Default value is false\n\
    ```\n\nThere is no behavior bundled by default in symfony, but they can be installed\
    \ via plug-ins. Once a behavior plug-in is installed, you can assign the behavior\
    \ to a class with a single line. For instance, if you install the sfPropelParanoidBehaviorPlugin\
    \ in your application, you can extend an Article class with this behavior by adding\
    \ the following at the end of the Article.class.php:\n\n```\nsfPropelBehavior::add('Article',\
    \ array(\n  'paranoid' => array('column' => 'deleted_at')\n));\n```\n\nAfter rebuilding\
    \ the model, deleted Article objects will remain in the database, invisible to\
    \ the queries using the ORM, unless you temporarily disable the behavior with\
    \ sfPropelParanoidBehavior::disable().\n\nAlternatively, you can also declare\
    \ behaviors directly in the schema.yml, by listing them under the _behaviors key\
    \ (see Listing 8-34 below).\n\nCheck the list of symfony plug-ins on the official\
    \ repository69 to find behaviors. Each has its own documentation and installation\
    \ guide.\n\n# Extended Schema Syntax\n\nA schema.yml file can be simple, as shown\
    \ in Listing 8-3. But relational models are often complex. That's why the schema\
    \ has an extensive syntax able to handle almost every case.\n\n# Attributes\n\n\
    Connections and tables can have specific attributes, as shown in Listing 8-24.\
    \ They are set under an _attributes key.\n\nListing 8-24 - Attributes for Connections\
    \ and Tables\n\n```\npropel:\n  _attributes: { noXsd: false, defaultIdMethod:\
    \ none, package: lib.model }\n  blog_article:\n    _attributes: { phpName: Article\
    \ }\n```\n\nYou may want your schema to be validated before code generation takes\
    \ place. To do that, deactivate the noXSD attribute for the connection. The connection\
    \ also supports the defaultIdMethod attribute. If none is provided, then the database's\
    \ native method of generating IDs will be used—for example, autoincrement for\
    \ MySQL, or sequences for PostgreSQL. The other possible value is none.\n\nThe\
    \ package attribute is like a namespace; it determines the path where the generated\
    \ classes are stored. It defaults to lib/model/, but you can change it to organize\
    \ your model in subpackages. For instance, if you don't want to mix the core business\
    \ classes and the"
