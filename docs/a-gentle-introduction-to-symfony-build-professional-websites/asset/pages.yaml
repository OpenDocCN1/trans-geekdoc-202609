  md: "```\n}\n}\n```\n\nAn event listener registered on the `rest_request.method_not_found`\
    \ event can test the requested $method and decide to handle it, or pass to the\
    \ next event listener callable. In Listing 17-4, you can see how a third party\
    \ class can add put() and delete() methods to the sfRestRequest class at runtime\
    \ with this trick.\n\n# Listing 17-4 - Handling a “Notify Until” Event type\n\n\
    ```\n```php\nclass frontendConfiguration extends sfApplicationConfiguration\n\
    {\n    public function configure()\n    {\n        // ...\n\n        // Register\
    \ our listener\n        $this->dispatcher->connect('rest_request.method_not_found',\n\
    \            array('sfRestRequestExtension', 'listenToMethodNotFound'));\n   \
    \ }\n}\n\nclass sfRestRequestExtension\n{\n    static public function listenToMethodNotFound(sfEvent\
    \ $event)\n    {\n        switch ($event['method'])\n        {\n            case\
    \ 'put':\n                self::put($event->getSubject(), $event['arguments']);\n\
    \n                return true;\n            case 'delete':\n                self::delete($event->getSubject(),\
    \ $event['arguments']);\n\n                return true;\n            default:\n\
    \                return false;\n        }\n    }\n}\n\nstatic protected function\
    \ put($restRequest, $arguments)\n{\n    // Make a put request and store the result\
    \ in a $result variable\n    // ...\n\n    $event->setReturnValue($result);\n\
    }\n\nstatic protected function delete($restRequest, $arguments)\n{\n    // Make\
    \ a delete request and store the result in a $result variable\n    // ...\n\n\
    \    $event->setReturnValue($result);\n}\n```\n```"
