  md: "```\nid: ~\ntitle: varchar(50)\nuser_id: { type: integer }\n_foreignKeys:\n\
    \    -\n        foreignTable: blog_user\n        onDelete: cascade\n        references:\n\
    \            - { local: user_id, foreign: id }\n```\n\nThe alternative syntax\
    \ is useful for multiple-reference foreign keys and to give foreign keys a name,\
    \ as shown in Listing 8-29.\n\n# Listing 8-29 - Foreign Key Alternative Syntax\
    \ Applied to Multiple Reference Foreign Key\n\n```\n_foreignKeys:\n    my_foreign_key:\n\
    \        foreignTable: db_user\n        onDelete: cascade\n        references:\n\
    \            - { local: user_id, foreign: id }\n            - { local: post_id,\
    \ foreign: id }\n```\n\n# Indexes\n\nAs an alternative to the index column attribute,\
    \ you can add indexes under the `_indexes:` key in a table. If you want to define\
    \ unique indexes, you must use the `_uniques:` header instead. For columns that\
    \ require a size, because they are text columns, the size of the index is specified\
    \ the same way as the length of the column using parentheses. Listing 8-30 shows\
    \ the alternative syntax for indexes.\n\n# Listing 8-30 - Indexes and Unique Indexes\
    \ Alternative Syntax\n\n```\npropel:\n    blog_article:\n        id:        ~\n\
    \        title:     varchar(50)\n        created_at:\n        _indexes:\n    \
    \        my_index:       [title(10), user_id]\n            _uniques:\n       \
    \         my_other_index: [created_at]\n```\n\nThe alternative syntax is useful\
    \ only for indexes built on more than one column.\n\n# Empty Columns\n\nWhen meeting\
    \ a column with no value, symfony will do some magic and add a value of its own.\
    \ See Listing 8-31 for the details added to empty columns.\n\n# Listing 8-31 -\
    \ Column Details Deduced from the Column Name\n\n```\n// Empty columns named id\
    \ are considered primary keys\nid: { type: integer, required: true, primaryKey:\
    \ true,\n      autoIncrement: true }\n\n// Empty columns named XXX_id are considered\
    \ foreign keys\nfoobar_id: { type: integer, foreignTable: db_foobar, foreignReference:\
    \ id\n}\n```"
