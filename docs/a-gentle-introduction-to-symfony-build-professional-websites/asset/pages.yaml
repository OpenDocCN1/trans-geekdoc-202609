  md: '# Skipping to Another Action


    In some cases, the action execution ends by requesting a new action execution.
    For instance, an action handling a form submission in a POST request usually redirects
    to another action after updating the database.


    The action class provides two methods to execute another action:


    +   If the action forwards the call to another action:


    ```

    $this->forward(''otherModule'', ''index'');

    ```


    +   If the action results in a web redirection:


    ```

    $this->redirect(''otherModule/index'');

    $this->redirect(''http://www.google.com/'');

    ```


    The code located after a forward or a redirect in an action is never executed.
    You can consider that these calls are equivalent to a return statement. They throw
    an sfStopException to stop the execution of the action; this exception is later
    caught by symfony and simply ignored.


    The choice between a redirect or a forward is sometimes tricky. To choose the
    best solution, keep in mind that a forward is internal to the application and
    transparent to the user. As far as the user is concerned, the displayed URL is
    the same as the one requested. In contrast, a redirect is a message to the user''s
    browser, involving a new request from it and a change in the final resulting URL.


    If the action is called from a submitted form with method="post", you should **always**
    do a redirect. The main advantage is that if the user refreshes the resulting
    page, the form will not be submitted again; in addition, the back button works
    as expected by displaying the form and not an alert asking the user if he wants
    to resubmit a POST request.


    There is a special kind of forward that is used very commonly. The forward404()
    method forwards to a "page not found" action. This method is often called when
    a parameter necessary to the action execution is not present in the request (thus
    detecting a wrongly typed URL). Listing 6-11 shows an example of a show action
    expecting an id parameter.


    Listing 6-11 - Use of the forward404() Method


    ```

