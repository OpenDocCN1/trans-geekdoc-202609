    \       \"Workflow\":  [blog_author_id, is_published, created_at]\n      fields:\n\
    \        published_at: { help: \"Date of publication\" }\n        title:     \
    \   { attributes: { style: \"width: 350px\" } }\n\n    new:\n      title: New\
    \ article\n\n    edit:\n      title: Editing article \"%%title%%\"\n```"
