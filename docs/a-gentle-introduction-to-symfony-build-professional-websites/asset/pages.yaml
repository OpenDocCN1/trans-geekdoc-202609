  md: "# Manual Plug-In Setup\n\nThere are some elements that the plugin:install task\
    \ cannot handle on its own, and which require manual setup during installation:\n\
    \n+   * Custom routing should be added either by the plugin code on the routing.load_configuration\
    \ event or manually to the application routing.yml.\n+   * Custom filters have\
    \ to be added manually to the application filters.yml.\n+   * Custom factories\
    \ have to be added manually to the application factories.yml.\n\nPlug-ins with\
    \ such manual setup should embed a README file describing installation in detail.\n\
    \n# Customizing a Plug-In for an Application\n\nWhenever you want to customize\
    \ a plug-in, never alter the code found in the plugins/ directory. If you do so,\
    \ you will lose all your modifications when you upgrade the plug-in. For customization\
    \ needs, plug-ins provide custom settings, and they support overriding.\n\nWell-designed\
    \ plug-ins use settings that can be changed in the application app.yml, as Listing\
    \ 17-20 demonstrates.\n\nListing 17-20 - Customizing a Plug-In That Uses the Application\
    \ Configuration\n\n```\n// example plug-in code\n$foo = sfConfig::get('app_my_plugin_foo',\
    \ 'bar');\n\n// Change the 'foo' default value ('bar') in the application app.yml\n\
    all:\n  my_plugin:\n    foo:   barbar\n```\n\nThe module settings and their default\
    \ values are often described in the plug-in's README file.\n\nYou can replace\
    \ the default contents of a plug-in module by creating a module of the same name\
    \ in your own application. It is not really overriding, since the elements in\
    \ your application are used instead of the ones of the plug-in. It works fine\
    \ if you create templates and configuration files of the same name as the ones\
    \ of the plug-ins.\n\nOn the other hand, if a plug-in wants to offer a module\
    \ with the ability to override its actions, the actions.class.php in the plug-in\
    \ module must be empty and inherit from an autoloading class, so that the method\
    \ of this class can be inherited as well by the actions.class.php of the application\
    \ module. See Listing 17-21 for an example.\n\nListing 17-21 - Customizing a Plug-In\
    \ Action\n\n```\n// In myPlugin/modules/mymodule/lib/myPlugininmyModuleActions.class.php\n\
    class myPlugininmyModuleActions extends sfActions\n{\n  public function executeIndex()\n\
    \  {\n    // Some code there\n  }\n}\n\n// In myPlugin/modules/mymodule/actions/actions.class.php\n\
    \nrequire_once dirname(__FILE__).'/../lib/myPlugininmyModuleActions.class.php';\n\
    \nclass mymoduleActions extends myPlugininmyModuleActions\n{\n```"
