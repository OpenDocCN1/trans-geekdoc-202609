  md: "Chapter 6 explained another way to skip the template by returning content text\
    \ directly from the action. This breaks the MVC separation, but it can increase\
    \ the responsiveness of an action greatly. Check Listing 18-13 for an example.\n\
    \n```\nListing 18-13 - Example Action Returning Content Text Directly\npublic\
    \ function executeFastAction()\n{\n    return $this->renderText(\"<html><body>Hello,\
    \ World!</body></html>\");\n}\n```\n\n# Tweaking the Cache\n\nChapter 12 already\
    \ described how to cache parts of a response or all of it. The response cache\
    \ results in a major performance improvement, and it should be one of your first\
    \ optimization considerations. If you want to make the most out of the cache system,\
    \ read further, for this section unveils a few tricks you might not have thought\
    \ of.\n\n# Clearing Selective Parts of the Cache\n\nDuring application development,\
    \ you have to clear the cache in various situations:\n\n+   - When you create\
    \ a new class: Adding a class to an autoloading directory (one of the project's\
    \ lib/ folders) is not enough to have symfony find it automatically in non-development\
    \ environments. You must clear the autoloading configuration cache so that symfony\
    \ browses again all the directories of the autoload.yml file and references the\
    \ location of autoloadable classes—including the new ones.\n+   - When you change\
    \ the configuration in production: The configuration is parsed only during the\
    \ first request in production. Further requests use the cached version instead.\
    \ So a change in the configuration in the production environment (or any environment\
    \ where debug is turned off) doesn't take effect until you clear the cached version\
    \ of the file.\n+   - When you modify a template in an environment where the template\
    \ cache is enabled: The valid cached templates are always used instead of existing\
    \ templates in production, so a template change is ignored until the template\
    \ cache is cleared or outdate.\n+   - When you update an application with the\
    \ project:deploy command: This case usually covers the three previous modifications.\n\
    \nThe problem with clearing the whole cache is that the next request will take\
    \ quite long to process, because the configuration cache needs to be regenerated.\
    \ Besides, the templates that were not modified will be cleared from the cache\
    \ as well, losing the benefit of previous requests.\n\nThat means it's a good\
    \ idea to clear only the cache files that really need to be regenerated. Use the\
    \ options of the cache:clear task to define a subset of cache files to clear,\
    \ as demonstrated in Listing 18-14.\n\n```\nListing 18-14 - Clearing Only Selective\
    \ Parts of the Cache\n// Clear only the cache of the frontend application\n$ php\
    \ symfony cache:clear frontend\n\n// Clear only the HTML cache of the frontend\
    \ application\n$ php symfony cache:clear frontend template\n```"
  merge: -1
