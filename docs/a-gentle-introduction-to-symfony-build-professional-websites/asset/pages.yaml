  md: "```\n// Example internal URI, which never appears to the end user\narticle/permalink?year=2010&subject=finance&title=activity-breakdown\n\
    ```\n\n```\n// Example external URL, which appears to the end user\nhttp://www.example.com/articles/finance/2010/activity-breakdown.html\n\
    ```\n\nThe routing system uses a special configuration file, called routing.yml,\
    \ in which you can\ndefine routing rules. Consider the rule shown in Listing 9-2.\
    \ It defines a pattern that looks\nlike articles/*/*/* and names the pieces of\
    \ content matching the wildcards.\n\n# Listing 9-2 - A Sample Routing Rule\n\n\
    ```\narticle_by_title:\n url:   articles/:subject/:year/:title.html\n param: {\
    \ module: article, action: permalink }\n```\n\nEvery request sent to a symfony\
    \ application is first analyzed by the routing system (which is\nsimple because\
    \ every request is handled by a single front controller). The routing rules\n\
    looks for a match between the request URL and the patterns defined in the routing\
    \ rules. If a\nmatch is found, the named wildcards become request parameters and\
    \ are merged with the\nones defined in the param: key. See how it works in Listing\
    \ 9-3.\n\n# Listing 9-3 - The Routing System Interprets Incoming Request URLs\n\
    \n```\n// The user types (or clicks on) this external URL\nhttp://www.example.com/articles/finance/2010/activity-breakdown.html\n\
    \n// The front controller sees that it matches the article_by_title rule\n// The\
    \ routing system creates the following request parameters\n'module' => 'article'\n\
    'action' => 'permalink'\n'subject' => 'finance'\n'year' => '2010'\n'title' =>\
    \ 'activity-breakdown'\n```\n\nThe request is then passed to the permalink action\
    \ of the article module, which has all\nthe required information in the request\
    \ parameters to determine which article is to be shown.\n\nBut the mechanism also\
    \ must work the other way around. For the application to show\nexternal URLs in\
    \ its links, you must provide the routing system with enough data to\ndetermine\
    \ which rule to apply to it. You also must not write hyperlinks directly with\
    \ <a>\ntags—this would bypass routing completely—but with a special helper, as\
    \ shown in Listing\n9-4.\n\n# Listing 9-4 - The Routing System Formats Outgoing\
    \ URLs in Templates\n\n```\n// The url_for() helper transforms an internal URI\
    \ into an external URL\n<a href=\"<?php echo url_for('article/\npermalink?subject=finance&year=2010&title=activity-breakdown')\
    \ ?>\">click here</a>\n```\n\n```\n// The helper sees that the URI matches the\
    \ article_by_title rule\n// The routing system creates an external URL out of\
    \ it\n=> <a href=\"http://www.example.com/articles/finance/2010/\nactivity-breakdown.html\"\
    >click here</a>\n```\n\n```\n// The link_to() helper directly outputs a hyperlink\n\
    // and avoids mixing PHP with HTML\n<?php echo link_to(\n 'click here',\n```"
