- pgno: 136
  md: "# Dealing with multiple Schemas\n\nYou can have more than one schema per application.\
    \ Symfony will take into account every file ending with `.yml` in the `config/doctrine`\
    \ folder. If your application has many models, or if some models don't share the\
    \ same connection, you will find this approach very useful.\n\nConsider these\
    \ two schemas:\n\n```\n```yaml\n// In config/doctrine/business-schema.yml\nArticle:\n\
    \  id:\n    type: integer\n    primary: true\n    autoincrement: true\n  title:\
    \ string(50)\n\n// In config/doctrine/stats-schema.yml\nHit:\n  actAs: [Timestampable]\n\
    \  columns:\n    id:\n      type: integer\n      primary: true\n      autoincrement:\
    \ true\n    resource: string(100)\n```\n```\n\nBoth schemas share the same connection\
    \ (doctrine), and the Article and Hit classes will be generated under the same\
    \ lib/model/doctrine directory. Everything happens as if you had written only\
    \ one schema.\n\nYou can also have different schemas use different connections\
    \ (for instance, doctrine and doctrine_bis, to be defined in databases.yml) and\
    \ associate it with that connection:\n\n```\n```yaml\n// In config/doctrine/business-schema.yml\n\
    Article:\n  connection: doctrine\n  id:\n    type: integer\n    primary: true\n\
    \    autoincrement: true\n  title: string(50)\n\n// In config/doctrine/stats-schema.yml\n\
    Hit:\n  connection: doctrine_bis\n  actAs: [Timestampable]\n  columns:\n    id:\n\
    \      type: integer\n      primary: true\n      autoincrement: true\n    resource:\
    \ string(100)\n```\n```\n\nMany applications use more than one schema. In particular,\
    \ some plug-ins have their own schema to avoid messing with your own classes (see\
    \ Chapter 17 for details)."
