  md: "application logic. Keeping the logic inside the action also makes it easier\
    \ to have several templates for a single action, without any code duplication.\n\
    \n# ## Helpers\n\nHelpers are PHP functions that return HTML code and can be used\
    \ in templates. In Listing 7-1, the link_to() function is a helper. Sometimes,\
    \ helpers are just time-savers, packaging code snippets frequently used in templates.\
    \ For instance, you can easily imagine the function definition for this helper:\n\
    \n```\n<?php echo image_tag('photo.jpg') ?>\n=> <img src=\"http://www.symfony-project.org/images/photo.jpg\"\
    \ />\n```\n\nIt should look like Listing 7-2.\n\n# ### Listing 7-2 - Sample Helper\
    \ Definition\n\n```\nfunction image_tag($source)\n{\n  return '<img src=\"http://www.symfony-project.org/images/'.$source.\"\
    \" />';\n}\n```\n\nAs a matter of fact, the image_tag() function built into symfony\
    \ is a little more complicated than that, as it accepts a second parameter to\
    \ add other attributes to the <img> tag. You can check its complete syntax and\
    \ options in the online API documentation<sup>36</sup>.\n\nMost of the time, helpers\
    \ carry intelligence and save you long and complex coding:\n\n```\n<?php echo\
    \ auto_link_text('Please visit our website www.example.com') ?>\n=> Please visit\
    \ our website <a\nhref=\"http://www.example.com\">www.example.com</a>\n```\n\n\
    Helpers facilitate the process of writing templates and produce the best possible\
    \ HTML code in terms of performance and accessibility. You can always use plain\
    \ HTML, but helpers are usually faster to write.\n\n> You may wonder why the helpers\
    \ are named according to the underscore syntax rather than the camelCase convention,\
    \ used everywhere else in symfony. This is because helpers are functions, and\
    \ all the core PHP functions use the underscore syntax convention.\n\n# ## Declaring\
    \ Helpers\n\nThe symfony files containing helper definitions are not autoloaded\
    \ (since they contain functions, not classes). Helpers are grouped by purpose.\
    \ For instance, all the helper functions dealing with text are defined in a file\
    \ called TextHelper.php, called the Text helper group. So if you need to use a\
    \ helper in a template, you must load the related helper group earlier in the\
    \ template by declaring it with the use_helper() function. Listing 7-3 shows a\
    \ template using the auto_link_text() helper, which is part of the Text helper\
    \ group.\n\n# ### Listing 7-3 - Declaring the Use of a Helper\n\n```\n// Use a\
    \ specific helper group in this template\n<?php use_helper('Text') ?>\n...\n<h1>Description</h1>\n\
