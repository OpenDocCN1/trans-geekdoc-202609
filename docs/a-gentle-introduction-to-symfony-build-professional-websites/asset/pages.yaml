  md: 'The form submission handling is greatly simplified by the fact that the form
    object has an embedded Model object. Calling $this->form->save() on a valid form
    updates the embedded Article object with the cleaned values and triggers the save()
    method on the Article object, as well as on the related objects if they exist.


    > The action code required to deal with a form is pretty much always the same,
    but that''s not a reason to copy it from one module to the other. Symfony provides
    a module generator that creates the whole action and template code to manipulate
    a Model object through symfony forms.


    # Conclusion


    The symfony form component is an entire framework on its own. It facilitates the
    display of forms in the view through widgets, it facilitates validation and handling
    of forms in the controller through validators, and it facilitates the edition
    of Model objects through Model forms. Although designed with a clear MVC separation,
    the form sub-framework is always easy to use. Most of the time, code generation
    will reduce your custom form code to a few lines.


    There is much more in symfony form classes than what this chapter exposes. In
    fact, there is an entire book⁴² describing all its features through usage examples.
    And if the form framework itself doesn''t provide the widget or the validator
    you need, it is designed in such an extensible way that you will only need to
    write a single class to get exactly what you need.'
