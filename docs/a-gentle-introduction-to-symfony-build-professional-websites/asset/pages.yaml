- pgno: 59
  md: "# # And if you don't like YAML\n\nYAML is just an interface to define settings\
    \ to be used by PHP code, so the configuration defined in YAML files ends up being\
    \ transformed into PHP. After browsing an application, check its cached configuration\
    \ (in cache/frontend/dev/config/, for instance). You will see the PHP files corresponding\
    \ to your YAML configuration. You will learn more about the configuration cache\
    \ later in this chapter.\n\nThe good news is that if you don't want to use YAML\
    \ files, you can still do what the configuration files do by hand, in PHP or via\
    \ another format (XML, INI, and so on). Throughout this book, you will meet alternative\
    \ ways to define configuration without YAML, and you will even learn to replace\
    \ the symfony configuration handlers (in Chapter 19). If you use them wisely,\
    \ these tricks will enable you to bypass configuration files or define your own\
    \ configuration format.\n\n# # Help, a YAML File Killed My App!\n\nThe YAML files\
    \ are parsed into PHP hashes and arrays, and then the values are used in various\
    \ parts of the application to modify the behavior of the view, the controller,\
    \ or the model. Many times, when there is a problem in a YAML file, it is not\
    \ detected until the value actually needs to be used. Moreover, the error or exception\
    \ that is thrown then is usually not clearly related to the YAML configuration\
    \ file.\n\nIf your application suddenly stops working after a configuration change,\
    \ you should check that you didn't make any of the common mistakes of the inattentive\
    \ YAML coder:\n\n+   - You miss a space between a key and its value:\n\n```\n\
    Listing 5-11\nkey1:value1   # A space is missing after the :\n```\n\n+   - Keys\
    \ in a sequence are not indented the same way:\n\n```\nListing 5-12\nall:\n  key1:\
    \ value1\n  key2: value2   # Indentation is not the same as the other\nsequence\
    \ members\n  key3: value3\n```\n\n+   - There is a reserved YAML character in\
    \ a key or a value, without string delimiters:\n\n```\nListing 5-13\nmessage:\
    \ tell him: go way   # : , [ , ], { and } are reserved in YAML\nmessage: 'tell\
    \ him: go way'   # Correct syntax\n```\n\n+   - You are modifying a commented\
    \ line:\n\n```\nListing 5-14\n# key: value   # Will never be taken into account\
    \ due to the\nleading #\n```\n\n+   - You set values with the same key name twice\
    \ at the same level:\n\n```\nListing 5-15\nkey1: value1\nkey2: value2\nkey1: value3\
    \   # key1 is defined twice, the value is the last\none defined\n```"
