  md: '# ## Constants


    You will not find any constants in symfony because by their very nature you can''t
    change their value once they are defined. Symfony uses its own configuration object,
    called sfConfig, which replaces constants. It provides static methods to access
    parameters from everywhere. Listing 2-19 demonstrates the use of sfConfig class
    methods.


    # Listing 2-19 - Using the sfConfig Class Methods Instead of Constants


    ```

    ```

    // Instead of PHP constants,

    define(''FOO'', ''bar'');

    echo FOO;


    // symfony uses the sfConfig object

    sfConfig::set(''foo'', ''bar'');

    echo sfConfig::get(''foo'');

    ```

    ```


    The sfConfig methods support default values, and you can call the sfConfig::set()
    method more than once on the same parameter to change its value. Chapter 5 discusses
    sfConfig methods in more detail.


    # ## Class Autoloading


    Usually, when you use a class method or create an object in PHP, you need to include
    the class definition first:


    ```

    ```

    include_once ''classes/MyClass.php'';

    $myObject = new MyClass();

    ```

    ```


    On large projects with many classes and a deep directory structure, keeping track
    of all the class files to include and their paths can be time consuming. By providing
    an spl_autoload_register() function, symfony makes include_once statements unnecessary,
    and you can write directly:


    ```

    ```

    $myObject = new MyClass();

    ```

    ```


    Symfony will then look for a MyClass definition in all files ending with class.php
    in one of the project''s lib/ directories. If the class definition is found, it
    will be included automatically.


    So if you store all your classes in lib/ directories, you don''t need to include
    classes anymore. That''s why symfony projects usually do not contain any include_once
    or require_once statements.


    For better performance, the symfony autoloader scans a list of directories (defined
    in an internal configuration file) during the first request. It then registers
    all the classes these directories contain and stores the class/file correspondence
    in a PHP file as an associative array. That way, future requests don''t need to
    do the directory scan anymore. This is why you need to clear the cache every time
    you add or move a class file in your project by calling the symfony cache:clear
    command (except in the development environment, where symfony clears the cache
    when it cannot find a class). You will learn more about the cache in Chapter 12,
    and about the autoloading configuration in Chapter 19.'
  merge: -1
  img_proc: true
- pgno: 35
  md: '# Summary


    Using an MVC framework forces you to divide and organize your code according to
    the framework''s conventions. Presentation code goes to the view, data manipulation
    code goes to the model, and the request manipulation logic goes to the controller.
    This makes applying the MVC pattern both very helpful and at the same time quite
    restrictive.


    Symfony is an MVC framework written in PHP. Its structure is designed to get the
    best out of the MVC pattern, whilst maintaining great ease of use. Thanks to its
    versatility and configurability, symfony is suitable for all web application projects.


    Now that you understand the underlying theory behind symfony, you are almost ready
    to develop your first application. But before that, you need a symfony installation
    up and running on your development server.'
  merge: -1
  img_proc: true
