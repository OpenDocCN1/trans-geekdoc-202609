- pgno: 304
  md: "```\n// do something with the user culture\n}\n```\n\nAll events and listener\
    \ registrations are managed by a special object called the *event dispatcher*.\
    \ This object is available from everywhere in symfony by way of the `ProjectConfiguration`\
    \ instance, and most symfony objects offer a `getEventDispatcher()` method to\
    \ get direct access to it. Using the dispatcher's `connect()` method, you can\
    \ register any PHP callable (either a class method or a function) to be called\
    \ when an event occurs. The first argument of `connect()` is the event identifier,\
    \ which is a string composed of a namespace and a name. The second argument is\
    \ a PHP callable.\n\n```\nRetrieving the event dispatcher from anywhere in the\
    \ application:\n\n`$dispatcher = ProjectConfiguration::getActive()->getEventDispatcher();`\n\
    ```\n\nOnce the function is registered with the event dispatcher, it waits until\
    \ the event is fired. The event dispatcher keeps a record of all event listeners,\
    \ and knows which ones to call when an event occurs. When calling these methods\
    \ or functions, the dispatcher passes them an `sfEvent` object as a parameter.\n\
    \nThe event object stores information about the notified event. The event notifier\
    \ can be retrieved thanks to the `getSubject()` method, and the event parameters\
    \ are accessible by using the event object as an array (for example, `$event['culture']`\
    \ can be used to retrieve the *culture* parameter passed by `sfUser` when notifying\
    \ `user.change_culture`).\n\nTo wrap up, the event system allows you to add abilities\
    \ to an existing class or modify its methods at runtime, without using inheritance.\n\
    \n# Notifying an Event listener\n\nJust like symfony classes notify that events\
    \ have occurred, your own classes can offer runtime extensibility and notify of\
    \ events at certain occasions. For instance, let's say that your application requests\
    \ several third-party web services, and that you have written an `sfRestRequest`\
    \ class to wrap the REST logic of these requests. A good idea would be to trigger\
    \ an event each time this class makes a new request. This would make the addition\
    \ of logging or caching capabilities easier in the future. Listing 17-2 shows\
    \ the code you need to add to an existing `fetch()` method to make it notify an\
    \ event listener.\n\n# Listing 17-2 - Notifying an Event listener\n\n```\nclass\
    \ sfRestRequest\n{\n    protected $dispatcher = null;\n\n    public function __construct(sfEventDispatcher\
    \ $dispatcher)\n    {\n        $this->dispatcher = $dispatcher;\n    }\n\n   \
    \ /**\n     * Makes a query to an external web service\n     */\n    public function\
    \ fetch($uri, $parameters = array())\n    {\n        // Notify the dispatcher\
    \ of the beginning of the fetch process\n        $this->dispatcher->notify(new\
    \ sfEvent($this,\n```"
