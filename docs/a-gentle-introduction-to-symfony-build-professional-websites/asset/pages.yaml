- pgno: 240
  md: "+   - For the list view: Put the fields in a simple array to select the columns\
    \ to display and the order in which they appear.\n+   - For the form, new, and\
    \ edit views: Use an associative array to group fields with the group name as\
    \ a key, or `NONE` for a group with no name. The value is still an array of ordered\
    \ column names. Be careful to list all the required fields referenced in your\
    \ form class or you may have some unexpected validation errors (see Chapter 10).\n\
    \n# Custom Fields\n\nAs a matter of fact, the fields configured in generator.yml\
    \ don't even need to correspond to actual columns defined in the schema. If the\
    \ related class offers a custom getter, it can be used as a field for the list\
    \ view; if there is a getter and/or a setter, it can also be used in the edit\
    \ view. For instance, you can extend the BlogArticle model with a getNbComments()\
    \ method similar to the one in Listing 14-8.\n\n_Listing 14-8 - Adding a Custom\
    \ Getter in the Model, in lib/model/BlogArticle.php_\n\n```\npublic function getNbComments()\n\
    {\n    return $this->countBlogComments();\n}\n```\n\nThen nb_comments is available\
    \ as a field in the generated module (notice that the getter uses a camelCase\
    \ version of the field name), as in Listing 14-9.\n\n_Listing 14-9 - Custom Getters\
    \ Provide Additional Columns for Administration Modules, in backend/modules/article/config/generator.yml_\n\
    \n```\nconfig:\n  list:\n    display: [title, blog_author, blog_category, nb_comments]\n\
    ```\n\nThe resulting list view of the article module is shown in Figure 14-07.\n\
    \n_Figure 14-07 - Custom field in the list view of the article module_\n\n![](img/0f886a7f4cbcc3939be96e985ca35ff4_240_0.png)\n\
    \n# Partial Fields\n\nThe code located in the model must be independent from the\
    \ presentation. The example of the getArticleLink() method earlier doesn't respect\
    \ this principle of layer separation, because some view code appears in the model\
    \ layer. As a matter of fact, if you try to use this configuration, you will end\
    \ up with the link being display as an <a> tag as it is escaped by default. To\
    \ achieve the same goal in a correct way, you'd better put the code that outputs\
    \ HTML for a custom field in a partial. Fortunately, the administration generator\
    \ allows it if you declare a field name prefixed by an underscore. In that case,\
    \ the generator.yml file of Listing 14-11 is to be modified as in Listing 14-12.\n\
    \n_Listing 14-12 - Partials Can Be Used As Additional Columns—Use the _ Prefix_"
  merge: -1
  img_proc: true
- pgno: 241
  md: "```\nconfig:\n  list:\n    display: [id, _article_link, created_at]\n```\n\n\
    For this to work, an _article_link.php partial must be created in the modules/comment/templates/\
    \ directory, as in Listing 14-13.\n\n# Listing 14-13 - Example Partial for the\
    \ list View, in modules/comment/templates/_article_link.php\n\n```\n<?php echo\
    \ link_to($BlogComment->getBlogArticle()->getTitle(),\n  'blog_article_edit',\
    \ $BlogComment->getBlogArticle()) ?>\n```\n\nNotice that the partial template\
    \ of a partial field has access to the current object through a variable named\
    \ by the class ($BlogComment in this example).\n\n# Figure 14-08 - Partial field\
    \ in the list view of the article module\n\n| | Id | Article link | Body | Actions\
    \ |\n|---|---|---|---|---|\n| | 1 | Welcome to the symfony weblog! | First ! |\
    \ Edit Delete |\n| | 2 | Welcome to the symfony weblog! | Oh too bad i wanted\
    \ to be first ! | Edit Delete |\n| | 3 | Welcome to the symfony weblog! | This\
    \ is a really nice blog. | Edit Delete |\n| | 4 | Life is beautiful | Great story\
    \ ! | Edit Delete |\n| | 5 | Life is beautiful | Hello Fabien | Edit Delete |\n\
    \n5 results\n\nChoose an action go New\n\nThe layer separation is respected. If\
    \ you get used to respecting the layer separation, you will end up with more maintainable\
    \ applications.\n\nIf you need to customize the parameters of a partial field,\
    \ do the same as for a normal field, under the field key. Just don't include the\
    \ leading underscore (_) in the key—see an example in Listing 14-14.\n\n# Listing\
    \ 14-14 - Partial Field Properties Can Be Customized Under the fields Key\n\n\
    ```\nconfig:\n  fields:\n    article_link: { label: Article }\n```\n\nIf your\
    \ partial becomes crowded with logic, you’ll probably want to replace it with\
    \ a component. Change the _ prefix to ~ and you can define a component field,\
    \ as you can see in Listing 14-15.\n\n# Listing 14-15 - Components Can Be Used\
    \ As Additional Columns—Use the ~ Prefix\n\n```\nconfig:\n  list:\n    display:\
    \ [id, ~article_link, created_at]\n```\n\nIn the generated template, this will\
    \ result by a call to the articleLink component of the current module."
