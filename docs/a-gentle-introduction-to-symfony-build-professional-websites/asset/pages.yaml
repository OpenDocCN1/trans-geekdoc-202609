  md: "+   * Swift_DoctrineSpool:\n+     * The Doctrine model to use to store the\
    \ messages (MailMessage by default)\n+     * The column name to use for message\
    \ storage (message by default)\n+     * The method to call to retrieve the messages\
    \ to send (optional). It receives the queue options as a argument.\n\n+   * Swift_PropelSpool:\n\
    +     * The Propel model to use to store the messages (MailMessage by default)\n\
    +     * The column name to use for message storage (message by default)\n+   \
    \  * The method to call to retrieve the messages to send (optional). It receives\
    \ the queue options as a argument.\n\nHere is a classic configuration for a Doctrine\
    \ spool:\n\n```\n# Schema configuration in schema.yml\nMailMessage:\n  actAs:\
    \ { Timestampable: ~ }\n  columns:\n    message: { type: clob, notnull: true }\n\
    ```\n\n```\n# configuration in factories.yml\nmailer:\n  class: sfMailer\n  param:\n\
    \    delivery_strategy: spool\n    spool_class:      Swift_DoctrineSpool\n   \
    \ spool_arguments: [ MailMessage, message, getSpooledMessages ]\n```\n\nAnd the\
    \ same configuration for a Propel spool:\n\n```\n# Schema configuration in schema.yml\n\
    mail_message:\n  message: { type: clob, required: true }\n  created_at: ~\n```\n\
    \n```\n# configuration in factories.yml\ndev:\n  mailer:\n    param:\n      delivery_strategy:\
    \ spool\n      spool_class:      Swift_PropelSpool\n      spool_arguments: [ MailMessage,\
    \ message, getSpooledMessages ]\n```\n\nTo send the message stored in a queue,\
    \ you can use the project:send-emails task (note that this task is totally independent\
    \ of the queue implementation, and the options it takes):\n\n```\n$ php symfony\
    \ project:send-emails\n```\n\n> The project:send-emails task takes an application\
    \ and env options.\n\nWhen calling the project:send-emails task, email messages\
    \ are sent via the same transport as the one used for the realtime strategy."
