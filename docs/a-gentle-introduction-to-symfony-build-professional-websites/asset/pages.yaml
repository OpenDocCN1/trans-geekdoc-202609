- pgno: 251
  md: "![](img/0f886a7f4cbcc3939be96e985ca35ff4_251_0.png)\n\n# Adding Interactions\n\
    \nAdministration modules allow users to perform the usual CRUD operations, but\
    \ you can also add your own interactions or restrict the possible interactions\
    \ for a view. For instance, the interaction definition shown in Listing 14-27\
    \ gives access to all the default CRUD actions on the article module.\n\nListing\
    \ 14-27 - Defining Interactions for Each View, in backend/modules/article/config/generator.yml\n\
    \n```\nListing 14-38\nconfig:\n  list:\n    title: List of Articles\n    object_actions:\n\
    \      _edit: ~\n      _delete: ~\n    batch_actions:\n      _delete: ~\n    actions:\n\
    \      _new: ~\n\n  edit:\n    title: Body of article %%title%%\n    actions:\n\
    \      _delete: ~\n      _list: ~\n      _save: ~\n      _save_and_add: ~\n```\n\
    \nIn a list view, there are three action settings: the actions available for every\
    \ object (object_actions), the actions available for a selection of objects (batch_actions),\
    \ and actions available for the whole page (actions). The list interactions defined\
    \ in Listing 14-27 render like in Figure 14-18. Each line shows one button to\
    \ edit the record and one to delete it, plus one checkbox on each line to delete\
    \ a selection of records. At the bottom of the list, a button allows the creation\
    \ of a new record.\n\nFigure 14-18 - Interactions in the list view"
  merge: -1
  img_proc: true
