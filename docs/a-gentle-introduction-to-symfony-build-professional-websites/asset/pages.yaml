  md: "# The context singleton\n\nYou already saw, in the front controller, a call\
    \ to sfContext::createInstance(). In an action, the getContext() method returns\
    \ the same singleton. It is a very useful object that stores a reference to all\
    \ the symfony core objects related to a given request, and offers an accessor\
    \ for each of them:\n\n+   - sfController: The controller object (->getController())\n\
    +   - sfRequest: The request object (->getRequest())\n+   - sfResponse: The response\
    \ object (->getResponse())\n+   - sfUser: The user session object (->getUser())\n\
    +   - sfRouting: The routing object (->getRouting())\n+   - sfMailer: The mailer\
    \ object (->getMailer())\n+   - sfI18N: The internationalization object (->getI18N())\n\
    +   - sfLogger: The logger object (->getLogger())\n+   - sfDatabaseConnection:\
    \ The database connection (->getDatabaseConnection())\n\nAll these core objects\
    \ are available through the sfContext::getInstance() singleton from any part of\
    \ the code. However, it's a really bad practice because this will create some\
    \ hard dependencies making your code really hard to test, reuse and maintain.\
    \ You will learn in this book how to avoid the usage of sfContext::getInstance().\n\
    \n# Action Termination\n\nVarious behaviors are possible at the conclusion of\
    \ an action's execution. The value returned by the action method determines how\
    \ the view will be rendered. Constants of the sfView class are used to specify\
    \ which template is to be used to display the result of the action.\n\nIf there\
    \ is a default view to call (this is the most common case), the action should\
    \ end as follows:\n\n```\nreturn sfView::SUCCESS;\n```\n\nSymfony will then look\
    \ for a template called actionNameSuccess.php. This is defined as the default\
    \ action behavior, so if you omit the return statement in an action method, symfony\
    \ will also look for an actionNameSuccess.php template. Empty actions will also\
    \ trigger that behavior. See Listing 6-8 for examples of successful action termination.\n\
    \nListing 6-8 - Actions That Will Call the indexSuccess.php and listSuccess.php\
    \ Templates\n\n```\npublic function executeIndex()\n{\n    return sfView::SUCCESS;\n\
    }\n\npublic function executeList()\n{\n}\n```\n\nIf there is an error view to\
    \ call, the action should end like this:\n\n```\nreturn sfView::ERROR;\n```\n\n\
    Symfony will then look for a template called actionNameError.php."
