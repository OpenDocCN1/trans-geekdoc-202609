    # Project Setup


    In symfony, **applications** sharing the same data model are regrouped into **projects**.
    For most projects, you will have two different applications: a frontend and a
    backend.


    # Project Creation


    From the sfproject/ directory, run the symfony generate:project task to actually
    create the symfony project:


    ```

    $ php lib/vendor/symfony/data/bin/symfony generate:project PROJECT_NAME

    ```


    On Windows:


    ```

    c:\> php lib\vendor\symfony\data\bin\symfony generate:project PROJECT_NAME

    ```


    The generate:project task generates the default structure of directories and files
    needed for a symfony project.


    > Why does symfony generate so many files? One of the main benefits of using a
    full-stack framework is to standardize your development. Thanks to symfony''s
    default structure of files and directories, any developer with some symfony knowledge
    can take over the maintenance of any symfony project. In a matter of minutes,
    he will be able to dive into the code, fix bugs, and add new features.


    The generate:project task has also created a symfony shortcut in the project root
    directory to shorten the number of characters you have to write when running a
    task.


    So, from now on, instead of using the fully qualified path to the symfony program,
    you can use the symfony shortcut.


