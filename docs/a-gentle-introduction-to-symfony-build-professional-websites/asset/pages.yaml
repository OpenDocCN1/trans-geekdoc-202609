- pgno: 213
  md: "# # Building a Staging Environment\n\nThe caching system is prone to new errors\
    \ in the production environment that can’t be detected in the development environment,\
    \ since the HTML cache is disabled by default in development. If you enable the\
    \ HTML cache for some actions, you should add a new environment, called staging\
    \ in this section, with the same settings as the prod environment (thus, with\
    \ cache enabled) but with web_debug set to true.\n\nTo set it up, edit the settings.yml\
    \ file of your application and add the lines shown in Listing 12-12 at the top.\n\
    \nListing 12-12 - Settings for a staging Environment, in frontend/config/settings.yml\n\
    \n```\nstaging:\n  .settings:\n    web_debug:    true\n    cache:          true\n\
    ```\n\nIn addition, create a new front controller by copying the production one\
    \ (probably myproject/web/index.php) to a new frontend_staging.php. Edit it to\
    \ change the arguments passed to the getApplicationConfiguration() method, as\
    \ follows:\n\n```\n$configuration =\nProjectConfiguration::getApplicationConfiguration('frontend',\
    \ 'staging',\ntrue);\n```\n\nThat’s it—you have a new environment. Use it by adding\
    \ the front controller name after the domain name:\n\n```\nhttp://myapp.example.com/frontend_staging.php/user/list\n\
    ```\n\n# # Monitoring Performance\n\nChapter 16 will explore the web debug toolbar\
    \ and its contents. However, as this toolbar offers valuable information about\
    \ cached elements, here is a brief description of its cache features.\n\nWhen\
    \ you browse to a page that contains cacheable elements (action, partials, fragments,\
    \ and so on), the web debug toolbar (in the top-right corner of the window) shows\
    \ an ignore cache button (a green, rounded arrow), as shown in Figure 12-4. This\
    \ button reloads the page and forces the processing of cached elements. Be aware\
    \ that it does not clear the cache.\n\nThe last number on the right side of the\
    \ debug toolbar is the duration of the request execution. If you enable cache\
    \ on a page, this number should decrease the second time you load the page, since\
    \ symfony uses the data from the cache instead of reprocessing the scripts. You\
    \ can easily monitor the cache improvements with this indicator.\n\nFigure 12-4\
    \ - Web debug toolbar for pages using caching\n\n![](img/0f886a7f4cbcc3939be96e985ca35ff4_213_0.png)\n\
    \nThe debug toolbar also shows the number of database queries executed during\
    \ the processing of the request, and the detail of the durations per category\
    \ (click the total duration to display the detail). Monitoring this data, in conjunction\
    \ with the total duration, will help you do fine measures of the performance improvements\
    \ brought by the cache."
  merge: -1
  img_proc: true
- pgno: 214
  md: '# # Benchmarking


    The debug mode greatly decreases the speed of your application, since a lot of
    information is logged and made available to the web debug toolbar. So the processed
    time displayed when you browse in the `staging` environment is not representative
    of what it will be in production, where the debug mode is turned off.


    To get a better view of the process time of each request, you should use benchmarking
    tools, like Apache Bench or JMeter. These tools allow load testing and provide
    two important pieces of information: the average loading time of a specific page
    and the maximum capacity of your server. The average loading time data is very
    useful for monitoring performance improvements due to cache activation.


    # # Identifying Cache Parts


    When the web debug toolbar is enabled, the cached elements are identified in a
    page with a red frame, each having a cache information box on the top left, as
    shown in Figure 12-5. The box has a blue background if the element has been executed,
    or a yellow background if it comes from the cache. Clicking the cache information
    link displays the identifier of the cache element, its lifetime, and the elapsed
    time since its last modification. This will help you identify problems when dealing
    with out-of-context elements, to see when the element was created and which parts
    of a template you can actually cache.


    *Figure 12-5 - Identification for cached elements in a page*


    ![](img/0f886a7f4cbcc3939be96e985ca35ff4_214_0.png)


    # # HTTP 1.1 and Client-Side Caching


    The HTTP 1.1 protocol defines a bunch of headers that can be of great use to further
    speed up an application by controlling the browser''s cache system.


    The HTTP 1.1 specifications of the World Wide Web Consortium (W3C, http://www.w3.org/Protocols/rfc2616/rfc2616-sec14.html<sup>50</sup>)
    describe these headers in detail. If an action has caching enabled, and it uses
    the `with_layout` option, it can use one or more of the mechanisms described in
    the following sections.


    Even if some of the browsers of your website''s users may not support HTTP 1.1,
    there is no risk in using the HTTP 1.1 cache features. A browser receiving headers
    that it doesn''t understand simply ignores them, so you are advised to set up
    the HTTP 1.1 cache mechanisms.


    In addition, HTTP 1.1 headers are also understood by proxies and caching servers.
    Even if a user''s browser doesn''t understand HTTP 1.1, there can be a proxy in
    the route of the request to take advantage of it.


    # # Adding an ETag Header to Avoid Sending Unchanged Content


    When the ETag feature is enabled, the web server adds to the response a special
    header containing a signature of the response itself.'
  merge: -1
  img_proc: true
