  md: "```\n// Many to one relationship\necho $comment->getArticle()->getTitle();\n\
    => My first article\necho $comment->getArticle()->getContent();\n=> This is my\
    \ very first article.\nHope you enjoy it!\n\n// One to many relationship\n$comments\
    \ = $article->getComments();\n```\n\nThe getArticle() method returns an object\
    \ of class Article, which benefits from the getTitle() accessor. This is much\
    \ better than doing the join yourself, which may take a few lines of code (starting\
    \ from the $comment->getArticleId() call).\n\nThe $comments variable in Listing\
    \ 8-10 contains an array of objects of class Comment. You can display the first\
    \ one with $comments[0] or iterate through the collection with foreach ($comments\
    \ as $comment).\n\n> Objects from the model are defined with a singular name by\
    \ convention, and you can now understand why. The foreign key defined in the blog_comment\
    \ table causes the creation of a getComments() method, named by adding an s to\
    \ the Comment object name. If you gave the model object a plural name, the generation\
    \ would lead to a method named getCommentss(), which doesn't make sense.\n\n#\
    \ Saving and Deleting Data\n\nBy calling the new constructor, you created a new\
    \ object, but not an actual record in the blog_article table. Modifying the object\
    \ has no effect on the database either. In order to save the data into the database,\
    \ you need to call the save() method of the object.\n\n```\n$article->save();\n\
    ```\n\nThe ORM is smart enough to detect relationships between objects, so saving\
    \ the $article object also saves the related $comment object. It also knows if\
    \ the saved object has an existing counterpart in the database, so the call to\
    \ save() is sometimes translated in SQL by an INSERT, and sometimes by an UPDATE.\
    \ The primary key is automatically set by the save() method, so after saving,\
    \ you can retrieve the new primary key with $article->getId().\n\n> You can check\
    \ if an object is new by calling isNew(). And if you wonder if an object has been\
    \ modified and deserves saving, call its isModified() method.\n\nIf you read comments\
    \ to your articles, you might change your mind about the interest of publishing\
    \ on the Internet. And if you don't appreciate the irony of article reviewers,\
    \ you can easily delete the comments with the delete() method, as shown in Listing\
    \ 8-11.\n\n# Listing 8-11 - Delete Records from the Database with the delete()\
    \ Method on the Related Object\n\n```\nforeach ($article->getComments() as $comment)\n\
    {\n  $comment->delete();\n}\n```"
