- pgno: 108
  md: "```\n<!-- custom sidebar code for the current template-->\n<h1>User details</h1>\n\
    <p>name: <?php echo $user->getName() ?></p>\n<p>email: <?php echo $user->getEmail()\
    \ ?></p>\n<?php end_slot() ?>\n```\n\nThe code between the slot helpers is executed\
    \ in the context of the template, so it has access to all the variables that were\
    \ defined in the action. Symfony will automatically put the result of this code\
    \ in the response object. It will not be displayed in the template, but made available\
    \ for future include_slot() calls, like the one in Listing 7-14.\n\nSlots are\
    \ very useful to define zones meant to display contextual content. They can also\
    \ be used to add HTML code to the layout for certain actions only. For instance,\
    \ a template displaying the list of the latest news might want to add a link to\
    \ an RSS feed in the <head> part of the layout. This is achieved simply by adding\
    \ a 'feed' slot in the layout and overriding it in the template of the list.\n\
    \nIf the content of the slot is very short, as this is the case when defining\
    \ a title slot for example, you can simply pass the content as a second argument\
    \ of the slot() method as shown in Listing 7-17.\n\n# Listing 7-17 - Using slot()\
    \ to define a short Value\n\n```\n<?php slot('title', 'The title value') ?>\n\
    ```\n\n# # Where to find template fragments\n\nPeople working on templates are\
    \ usually web designers, who may not know symfony very well and may have difficulties\
    \ finding template fragments, since they can be scattered all over the application.\
    \ These few guidelines will make them more comfortable with the symfony templating\
    \ system.\n\nFirst of all, although a symfony project contains many directories,\
    \ all the layouts, templates, and template fragments files reside in directories\
    \ named templates/. So as far as a web designer is concerned, a project structure\
    \ can be reduced to something like this:\n\n```\nmyproject/\napps/\napplication1/\n\
    templates/\t# Layouts for application 1\nmodules/\nmodule1/\ntemplates/\t# Templates\
    \ and partials for module 1\nmodule2/\ntemplates/\t# Templates and partials for\
    \ module 2\nmodule3/\ntemplates/\t# Templates and partials for module 3\n```\n\
    \nAll other directories can be ignored.\n\nWhen meeting an include_partial(),\
    \ web designers just need to understand that only the first argument is important.\
    \ This argument's pattern is module_name/partial_name, and that means that the\
    \ presentation code is to be found in modules/module_name/templates/_partial_name.php.\n\
    \nFor the include_component() helper, module name and partial name are the first\
    \ two arguments. As for the rest, a general idea about what helpers are and which\
    \ helpers are the most common in templates should be enough to start designing\
    \ templates for symfony applications."
  merge: -1
  img_proc: true
- pgno: 109
  md: "# View Configuration\n\nIn symfony, a view consists of two distinct parts:\n\
    \n+   * The HTML presentation of the action result (stored in the template, in\
    \ the layout, and in the template fragments)\n+   * All the rest, including the\
    \ following:\n+       * Meta declarations: Keywords, description, or cache duration.\n\
    +       * Page title: Not only does it help users with several browser windows\
    \ open to find yours, but it is also very important for search sites’ indexing.\n\
    +       * File inclusions: JavaScript and style sheet files.\n+       * Layout:\
    \ Some actions require a custom layout (pop-ups, ads, and so on) or no layout\
    \ at all (such as Ajax actions).\n\nIn the view, all that is not HTML is called\
    \ view configuration, and symfony provides two ways to manipulate it. The usual\
    \ way is through the view.yml configuration file. It can be used whenever the\
    \ values don’t depend on the context or on database queries. When you need to\
    \ set dynamic values, the alternative method is to set the view configuration\
    \ via the sfResponse object attributes directly in the action.\n\n> If you ever\
    \ set a view configuration parameter both via the sfResponse object and via the\
    \ view.yml file, the sfResponse definition takes precedence.\n\n# The view.yml\
    \ File\n\nEach module can have one view.yml file defining the settings of its\
    \ views. This allows you to define view settings for a whole module and per view\
    \ in a single file. The first-level keys of the view.yml file are the module view\
    \ names. Listing 7-18 shows an example of view configuration.\n\n```\nListing\
    \ 7-18 - Sample Module-Level view.yml\neditSuccess:\n  metas:\n    title: Edit\
    \ your profile\n\neditError:\n  metas:\n    title: Error in the profile edition\n\
    \nall:\n  stylesheets: [my_style]\n  metas:\n    title: My website\n```\n\n> Be\
    \ aware that the main keys in the view.yml file are view names, not action names.\
    \ As a reminder, a view name is composed of an action name and an action termination.\
    \ For instance, if the edit action returns sfView::SUCCESS (or returns nothing\
    \ at all, since it is the default action termination), then the view name is editSuccess.\n\
    \nThe default settings for the module are defined under the all: key in the module\
    \ view.yml. The default settings for all the application views are defined in\
    \ the application view.yml. Once again, you recognize the configuration cascade\
    \ principle:"
  merge: -1
  img_proc: true
- pgno: 110
  md: "+   * In apps/frontend/modules/mymodule/config/view.yml, the per-view definitions\
    \ apply only to one view and override the module-level definitions.\n\n+   * In\
    \ apps/frontend/modules/mymodule/config/view.yml, the all: definitions apply to\
    \ all the actions of the module and override the application-level definitions.\n\
    \n+   * In apps/frontend/config/view.yml, the default: definitions apply to all\
    \ modules and all actions of the application.\n\n> > Module-level view.yml files\
    \ don't exist by default. The first time you need to adjust a view configuration\
    \ parameter for a module, you will have to create an empty view.yml in its config/\
    \ directory.\n\nAfter seeing the default template in Listing 7-5 and an example\
    \ of a final response in Listing 7-6, you may wonder where the header values come\
    \ from. As a matter of fact, they are the default view settings, defined in the\
    \ application view.yml and shown in Listing 7-19.\n\nListing 7-19 - Default Application-Level\
    \ View Configuration, in apps/frontend/config/view.yml\n\n```\ndefault:\n  http_metas:\n\
    \    content-type: text/html\n\n  metas:\n    #title:         symfony project\n\
    \    #description:   symfony project\n    #keywords:      symfony, project\n \
    \   #language:      en\n    #robots:        index, follow\n\n  stylesheets:  \
    \  [main]\n\n  javascripts:    []\n\n  has_layout:     true\n  layout:       \
    \  layout\n```\n\nEach of these settings will be described in detail in the “View\
    \ Configuration Settings” section.\n\n# The Response Object\n\nAlthough part of\
    \ the view layer, the response object is often modified by the action. Actions\
    \ can access the symfony response object, called sfResponse, via the getResponse()\
    \ method. Listing 7-20 lists some of the sfResponse methods often used from within\
    \ an action.\n\nListing 7-20 - Actions Have Access to the sfResponse Object Methods\n\
    \n```\nclass mymoduleActions extends sfActions\n{\n  public function executeIndex()\n\
    \  {\n    $response = $this->getResponse();\n\n    // HTTP headers\n    $response->setContentType('text/xml');\n\
    \    $response->setHttpHeader('Content-Language', 'en');\n    $response->setStatusCode(403);\n\
    \    $response->addVaryHttpHeader('Accept-Language');\n  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 111
  md: '```

    $response->addCacheControlHttpHeader(''no-cache'');


    // Cookies

    $response->setCookie($name, $content, $expire, $path, $domain);


    // Metas and page headers

    $response->addMeta(''robots'', ''NONE'');

    $response->addMeta(''keywords'', ''foo bar'');

    $response->setTitle(''My FooBar Page'');

    $response->addStyleSheet(''custom_style'');

    $response->addJavaScript(''custom_behavior'');

    }

    }

    ```


    In addition to the setter methods shown here, the sfResponse class has getters
    that return the current value of the response attributes.


    The header setters are very powerful in symfony. Headers are sent as late as possible
    (in the sfRenderingFilter), so you can alter them as much as you want and as late
    as you want. They also provide very useful shortcuts. For instance, if you don''t
    specify a charset when you call setContentType(), symfony automatically adds the
    default charset defined in the settings.yml file.


    ```

    Listing 7-29

    $response->setContentType(''text/xml'');

    echo $response->getContentType();

    => ''text/xml; charset=utf-8''

    ```


    The status code of responses in symfony is compliant with the HTTP specification.
    Exceptions return a status 500, pages not found return a status 404, normal pages
    return a status 200, pages not modified can be reduced to a simple header with
    status code 304 (see Chapter 12 for details), and so on. But you can override
    these defaults by setting your own status code in the action with the setStatusCode()
    response method. You can specify a custom code and a custom message, or simply
    a custom code—in which case, symfony will add the most common message for this
    code.


    ```

    Listing 7-30

    $response->setStatusCode(404, ''This page does not exist'');

    ```


    > Before sending the headers, symfony normalizes their names. So you don''t need
    to bother about writing content-language instead of Content-Language in a call
    to setHttpHeader(), as symfony will understand the former and automatically transform
    it to the latter.


    # View Configuration Settings


    You may have noticed that there are two kinds of view configuration settings:


    +   • The ones that have a unique value (the value is a string in the view.yml
    file and the response uses a set method for those)

    +   • The ones with multiple values (for which view.yml uses arrays and the response
    uses an add method)


    Keep in mind that the configuration cascade erases the unique value settings but
    piles up the multiple values settings. This will become more apparent as you progress
    through this chapter.'
