- pgno: 230
  md: "# Chapter 14\n\n# Admin Generator\n\nMany applications are based on data stored\
    \ in a database and offer an interface to access it. Symfony automates the repetitive\
    \ task of creating a module providing data manipulation capabilities based on\
    \ a Propel or Doctrine object. If your object model is properly defined, symfony\
    \ can even generate an entire site administration automatically. This chapter\
    \ describes the use of the administration generator, which is bundled with the\
    \ Propel and Doctrine plugin. It relies on a special configuration file with a\
    \ complete syntax, so most of this chapter describes the various possibilities\
    \ of the administration generator.\n\n# Code Generation Based on the Model\n\n\
    In a web application, data access operations can be categorized as one of the\
    \ following:\n\n+   • Creation of a record\n+   • Retrieval of records\n+   •\
    \ Update of a record (and modification of its columns)\n+   • Deletion of a record\n\
    \nThese operations are so common that they have a dedicated acronym: CRUD. Many\
    \ pages can be reduced to one of them. For instance, in a forum application, the\
    \ list of latest posts is a retrieve operation, and the reply to a post corresponds\
    \ to a create operation.\n\nThe basic actions and templates that implement the\
    \ CRUD operations for a given table are repeatedly created in web applications.\
    \ In symfony, the model layer contains enough information to allow generating\
    \ the CRUD operations code, so as to speed up the early part of the back-end interfaces.\n\
    \n# Example Data Model\n\nThroughout this chapter, the listings will demonstrate\
    \ the capabilities of the symfony admin generator based on a simple example, which\
    \ will remind you of Chapter 8. This is the well-known example of the weblog application,\
    \ containing two BlogArticle and BlogComment classes. Listing 14-1 shows its schema,\
    \ illustrated in Figure 14-1.\n\n# Listing 14-1 - Propel schema of the Example\
    \ Weblog Application\n\n```\npropel:\n  blog_category:\n    id:     ~\n    name:\
    \   varchar(255)\n  blog_author:\n    id:     ~\n    name:   varchar(255)\n```"
