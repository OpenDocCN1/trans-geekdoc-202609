    +   - URLs written in paper documents are easier to type and remember. If your
    company website appears as http://www.example.com/controller/web/index.jsp?id=ERD4
    on your business card, it will probably not receive many visits.

    +   - The URL can become a command-line tool of its own, to perform actions or
    retrieve information in an intuitive way. Applications offering such a possibility
    are faster to use for power users.


    ```

    Listing 9-3

