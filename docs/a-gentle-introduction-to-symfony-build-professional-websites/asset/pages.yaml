- pgno: 151
  md: "# The Mail helper\n\nNowadays, e-mail-harvesting robots prowl about the Web,\
    \ and you can’t display an e-mail address on a website without becoming a spam\
    \ victim within days. This is why symfony provides a mail_to() helper.\n\nThe\
    \ mail_to() helper takes two parameters: the actual e-mail address and the string\
    \ that should be displayed. Additional options accept an encode parameter to output\
    \ something pretty unreadable in HTML, which is understood by browsers but not\
    \ by robots.\n\n```\nListing 9-25\n<?php echo mail_to('myaddress@mydomain.com',\
    \ 'contact') ?>\n=> <a href=\"mailto:myaddress@mydomain.com\">contact</a>\n<?php\
    \ echo mail_to('myaddress@mydomain.com', 'contact', 'encode=true') ?>\n=> <a href=\"\
    &#109;&#x61;... &#111;...\">&#x65;...</a>\n```\n\nEncoded e-mail messages are\
    \ composed of characters transformed by a random decimal and hexadecimal entity\
    \ encoder. This trick stops most of the address-harvesting spambots for now, but\
    \ be aware that the harvesting techniques evolve rapidly.\n\n# Routing Configuration\n\
    \nThe routing system does two things:\n\n+   * It interprets the external URL\
    \ of incoming requests and transforms it into an internal URI, to determine the\
    \ module/action and the request parameters.\n+   * It formats the internal URIs\
    \ used in links into external URLs (provided that you use the link helpers).\n\
    \nThe conversion is based on a set of routing rules. These rules are stored in\
    \ a routing.yml configuration file located in the application config/ directory.\
    \ Listing 9-15 shows the default routing rules, bundled with every symfony project.\n\
    \n# Listing 9-15 - The Default Routing Rules, in frontend/config/routing.yml\n\
    \n```\nListing 9-26\n# default rules\nhomepage:\n  url:   /\n  param: { module:\
    \ default, action: index }\n\n# generic rules\n# please, remove them by adding\
    \ more specific rules\ndefault_index:\n  url:   /:module\n  param: { action: index\
    \ }\n\ndefault:\n  url:   /:module/:action/*\n```\n\n# Rules and Patterns\n\n\
    Routing rules are bijective associations between an external URL and an internal\
    \ URI. A typical rule is made up of the following:\n\n+   * A unique label, which\
    \ is there for legibility and speed, and can be used by the link helpers"
  merge: -1
  img_proc: true
- pgno: 152
  md: "+   - A pattern to be matched (url key)\n+   - An array of request parameter\
    \ values (param key)\n\nPatterns can contain wildcards (represented by an asterisk,\
    \ *) and named wildcards (starting with a colon, :). A match to a named wildcard\
    \ becomes a request parameter value. For instance, the default rule defined in\
    \ Listing 9-15 will match any URL like /foo/bar, and set the module parameter\
    \ to foo and the action parameter to bar.\n\nNamed wildcards can be separated\
    \ by a slash or a dot, so you can write a pattern like:\n\n```\nmy_rule:\n  url:\
    \   /foo/:bar.:format\n  param: { module: mymodule, action: myaction }\n```\n\n\
    That way, an external URL like 'foo/12.xml' will match my_rule and execute mymodule/myaction\
    \ with two parameters: $bar=12 and $format=xml. You can add more separators by\
    \ changing the segment_separators parameters value in the sfPatternRouting factory\
    \ configuration (see chapter 19).\n\nThe routing system parses the routing.yml\
    \ file from the top to the bottom and stops at the first match. This is why you\
    \ must add your own rules on top of the default ones. For instance, the URL /foo/123\
    \ matches both of the rules defined in Listing 9-16, but symfony first tests my_rule:,\
    \ and as that rule matches, it doesn't even test the default: one. The request\
    \ is handled by the mymodule/myaction action with bar set to 123 (and not by the\
    \ foo/123 action).\n\n# Listing 9-16 - Rules Are Parsed Top to Bottom\n\n```\n\
    my_rule:\n  url: /foo/:bar\n  param: { module: mymodule, action: myaction }\n\n\
    # default rules\ndefault:\n  url:  /:module/:action/*\n```\n\nWhen a new action\
    \ is created, it does not imply that you must create a routing rule for it. If\
    \ the default module/action pattern suits you, then forget about the routing.yml\
    \ file. If, however, you want to customize the action's external URL, add a new\
    \ rule above the default one.\n\nListing 9-17 shows the process of changing the\
    \ external URL format for an article/read action.\n\n# Listing 9-17 - Changing\
    \ the External URL Format for an article/read Action\n\n```\n<?php echo url_for('article/read?id=123')\
    \ ?>\n=> /article/read/id/123   // Default formatting\n\n// To change it to /article/123,\
    \ add a new rule at the beginning\n// of your routing.yml\narticle_by_id:\n  url:\
    \   /article/:id\n  param: { module: article, action: read }\n```\n\nThe problem\
    \ is that the article_by_id rule in Listing 9-17 breaks the default routing for\
    \ all the other actions of the article module. In fact, a URL like article/delete\
    \ will match"
  merge: -1
  img_proc: true
- pgno: 153
  md: "this rule instead of the default one, and call the read action with id set\
    \ to delete instead of the delete action. To get around this difficulty, you must\
    \ add a pattern constraint so that the article_by_id rule matches only URLs where\
    \ the id wildcard is an integer.\n\n# Pattern Constraints\n\nWhen a URL can match\
    \ more than one rule, you must refine the rules by adding constraints, or requirements,\
    \ to the pattern. A requirement is a set of regular expressions that must be matched\
    \ by the wildcards for the rule to match.\n\nFor instance, to modify the article_by_id\
    \ rule so that it matches only URLs where the id parameter is an integer, add\
    \ a line to the rule, as shown in Listing 9-18.\n\n# Listing 9-18 - Adding a Requirement\
    \ to a Routing Rule\n\n```\narticle_by_id:\n    url: /article/:id\n    param:\
    \ { module: article, action: read }\n    requirements: { id: \\\\d+ }\n```\n\n\
    Now an article/delete URL can't match the article_by_id rule anymore, because\
    \ the 'delete' string doesn't satisfy the requirements. Therefore, the routing\
    \ system will keep on looking for a match in the following rules and finally find\
    \ the default rule."
  merge: -1
  img_proc: true
- pgno: 154
  md: "# # Permalinks\n\nA good security guideline for routing is to hide primary\
    \ keys and replace them with significant strings as much as possible. What if\
    \ you wanted to give access to articles from their title rather than from their\
    \ ID? It would make external URLs look like this:\n\n```\nhttp://www.example.com/article/Finance_in_France\n\
    ```\n\nTo that extent, you need to create a new permalink action, which will use\
    \ a slug parameter instead of an id one, and add a new rule for it:\n\n```\narticle_by_id:\n\
    url: /article/:id\nparam: { module: article, action: read }\nrequirements: { id:\
    \ \\d+ }\n```\n\n```\narticle_by_slug:\nurl: /article/:slug\nparam: { module:\
    \ article, action: permalink }\n```\n\nThe permalink action needs to determine\
    \ the requested article from its title, so your model must provide an appropriate\
    \ method.\n\n```\npublic function executePermalink($request)\n{\n $article = ArticlePeer::retrieveBySlug($request->getParameter('slug'));\n\
    \ $this->forward404Unless($article); // Display 404 if no article\n matches slug\n\
    \ $this->article = $article; // Pass the object to the template\n}\n```\n\nYou\
    \ also need to replace the links to the read action in your templates with links\
    \ to the permalink one, to enable correct formatting of internal URLs.\n\n```\n\
    // Replace\n<?php echo link_to('my article', 'article/read?id='.$article->getId())\
    \ ?>\n```\n\n```\n// With\n<?php echo link_to('my article', 'article/permalink?slug='.$article->getSlug())\
    \ ?>\n```\n\nThanks to the requirements line, an external URL like /article/Finance_in_France\
    \ matches the article_by_slug rule, even though the article_by_id rule appears\
    \ first.\n\nNote that as articles will be retrieved by slug, you should add an\
    \ index to the slug column in the Article model description to optimize database\
    \ performance.\n\n# # Setting Default Values\n\nYou can give named wildcards a\
    \ default value to make a rule work, even if the parameter is not defined. Set\
    \ default values in the param: array.\n\nFor instance, the article_by_id rule\
    \ doesn't match if the id parameter is not set. You can force it, as shown in\
    \ Listing 9-19.\n\nListing 9-19 - Setting a Default Value for a Wildcard"
  merge: -1
  img_proc: true
- pgno: 155
  md: "```\narticle_by_id:\n  url: /article/:id\n  param: { module: article, action:\
    \ read, id: 1 }\n```\n\nThe default parameters don't need to be wildcards found\
    \ in the pattern. In Listing 9-20, the display parameter takes the value true,\
    \ even if it is not present in the URL.\n\n# Listing 9-20 - Setting a Default\
    \ Value for a Request Parameter\n\n```\narticle_by_id:\n  url: /article/:id\n\
    \  param: { module: article, action: read, id: 1, display: true }\n```\n\nIf you\
    \ look carefully, you can see that article and read are also default values for\
    \ module and action variables not found in the pattern.\n\n> You can define a\
    \ default parameter for all the routing rules by calling the sfRouting::setDefaultParameter()\
    \ method. For instance, if you want all the rules to have a theme parameter set\
    \ to default by default, add $this->context->getRouting()->setDefaultParameter('theme',\
    \ 'default'); to one of your global filters.\n\n# Speeding Up Routing by Using\
    \ the Rule Name\n\nThe link helpers accept a rule label instead of a module/action\
    \ pair if the rule label is preceded by an 'at' sign (@), as shown in Listing\
    \ 9-21.\n\n# Listing 9-21 - Using the Rule Label Instead of the Module/Action\n\
    \n```\n<?php echo link_to('my article', 'article/read?id='.$article->getId())\
    \ ?>\n// can also be written as\n<?php echo link_to('my article', '@article_by_id?id='.$article->getId())\
    \ ?>\n// or the fastest one (does not need extra parsing):\n<?php echo link_to('my\
    \ article', 'article_by_id', array('id' => $article->getId())) ?>\n```\n\nThere\
    \ are pros and cons to this trick. The advantages are as follows:\n\n+   • The\
    \ formatting of internal URIs is done faster, since symfony doesn't have to browse\
    \ all the rules to find the one that matches the link. In a page with a great\
    \ number of routed hyperlinks, the boost will be noticeable if you use rule labels\
    \ instead of module/action pairs.\n+   \n+   • Using the rule label helps to abstract\
    \ the logic behind an action. If you decide to change an action name but keep\
    \ the URL, a simple change in the routing.yml file will suffice. All of the link_to()\
    \ calls will still work without further change.\n+   \n+   • The logic of the\
    \ call is more apparent with a rule name. Even if your modules and actions have\
    \ explicit names, it is often better to call @display_article_by_slug than article/display.\n\
    +   \n+   • You know exactly which actions are enabled by reading the routing.yml\
    \ file\n\nOn the other hand, a disadvantage is that adding new hyperlinks becomes\
    \ less self-evident, since you always need to refer to the routing.yml file to\
    \ find out which label is to be used for an action. And in a big project, you\
    \ will certainly end with a lot a routings rules, making a bit hard to maintain\
    \ them. In this case, you should package your application in several plugins,\
    \ each one defining a limited set of features.\n\nHowever, the experience states\
    \ that using routing rules is the best choice in the long run."
  merge: -1
  img_proc: true
- pgno: 156
  md: "> During your tests (in the dev environment), if you want to check which rule\
    \ was matched for a given request in your browser, develop the “logs” section\
    \ of the web debug toolbar and look for a line specifying “matched route XXX”.\
    \ You will find more information about the web debug mode in Chapter 16.\n\n#\
    \ Creating Rules Without routing.yml\n\nAs is true of most of the configuration\
    \ files, the routing.yml is a solution to define routing rules, but not the only\
    \ one. You can define rules in PHP, but before the call to dispatch(), because\
    \ this method determines the action to execute according to the present routing\
    \ rules. Defining rules in PHP authorizes you to create dynamic rules, depending\
    \ on configuration or other parameters.\n\nThe object that handles the routing\
    \ rules is the sfPatternRouting factory. It is available from every part of the\
    \ code by requiring sfContext::getInstance()->getRouting(). Its prependRoute()\
    \ method adds a new rule on top of the existing ones defined in routing.yml. It\
    \ expects two parameters: a route name and a sfRoute object. For instance, the\
    \ routing.yml rule definition shown in Listing 9-18 is equivalent to the PHP code\
    \ shown in Listing 9-22.\n\n# Listing 9-22 - Defining a Rule in PHP\n\n```\nsfContext::getInstance()->getRouting()->prependRoute(\n\
    \ 'article_by_id',          // Route name\n new sfRoute('/article/:id', array('module'\
    \ => 'article', 'action' =>\n 'read'), array('id' => '\\d+')),   // Route object\n\
    );\n```\n\nThe sfRoute class constructor takes three arguments: a pattern, an\
    \ associative array of default values, and another associative array for requirements.\n\
    \nThe sfPatternRouting class has other useful methods for handling routes by hand:\
    \ clearRoutes(), hasRoutes() and so on. Refer to the API documentation39 to learn\
    \ more.\n\n> Once you start to fully understand the concepts presented in this\
    \ book, you can increase your understanding of the framework by browsing the online\
    \ API documentation or, even better, the symfony source. Not all the tweaks and\
    \ parameters of symfony can be described in this book. The online documentation,\
    \ however, is limitless.\n\n> The routing class is configurable in the factories.yml\
    \ configuration file (to change the default routing class, see chapter 17). This\
    \ chapter talks about the sfPatternRouting class, which is the routing class configured\
    \ by default.\n\n# Dealing with Routes in Actions\n\nIf you need to retrieve information\
    \ about the current route—for instance, to prepare a future “back to page xxx”\
    \ link—you should use the methods of the sfPatternRouting object. The URIs returned\
    \ by the getCurrentInternalUri() method can be used in a call to a link_to() helper,\
    \ as shown in Listing 9-23.\n\n# Listing 9-23 - Using sfRouting to Get Information\
    \ About the Current Route"
  merge: -1
  img_proc: true
