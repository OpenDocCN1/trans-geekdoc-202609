  md: "# Selective Cache Clearing Can damage your Brain\n\nThe trickiest part of the\
    \ cache-clearing job is to determine which actions are influenced by a data update.\n\
    \nFor instance, imagine that the current application has a publication module\
    \ where publications are listed (list action) and described (show action), along\
    \ with the details of their author (an instance of the User class). Modifying\
    \ one User record will affect all the descriptions of the user's publications\
    \ and the list of publications. This means that you need to add to the update\
    \ action of the user module, something like this:\n\n```\n$c = new Criteria();\n\
    $c->add(PublicationPeer::AUTHOR_ID, $request->getParameter('id'));\n$publications\
    \ = PublicationPeer::doSelect($c);\n\n$cacheManager = sfContext::getInstance()->getViewCacheManager();\n\
    foreach ($publications as $publication)\n{\n  $cacheManager->remove('publication/show?id='.$publication->getId());\n\
    }\n$cacheManager->remove('publication/list');\n```\n\nWhen you start using the\
    \ HTML cache, you need to keep a clear view of the dependencies between the model\
    \ and the actions, so that new errors don't appear because of a misunderstood\
    \ relationship. Keep in mind that all the actions that modify the model should\
    \ probably contain a bunch of calls to the remove() method if the HTML cache is\
    \ used somewhere in the application.\n\nAnd, if you don't want to damage your\
    \ brain with too difficult an analysis, you can always clear the whole cache each\
    \ time you update the database...\n\n# Clearing several cache parts at once\n\n\
    The remove() method accepts keys with wildcards. It allows you to remove several\
    \ cache parts with a single call. You can do for instance:\n\n```\n$cacheManager->remove('user/show?id=*');\
    \ // Remove for all user records\n```\n\nAnother good example is with applications\
    \ handling several languages, where the language code appears in all URLs. The\
    \ URL to a user profile page should look like this:\n\n```\nhttp://www.myapp.com/en/user/show/id/12\n\
    ```\n\nTo remove the cached profile of the user having an id of 12 in all languages,\
    \ you can simply call:\n\n```\n$cache->remove('user/show?sf_culture=*&id=12');\n\
    ```\n\nThis also works for partials:\n\n```\n$cacheManager->remove('@sf_cache_partial?module=user&action=_my_partial\n\
    &sf_cache_key=*'); // Remove for all keys\n```\n\nThe remove() method accepts\
    \ two additional parameters, allowing you to define which hosts and vary headers\
    \ you want to clear the cache for. This is because symfony keeps one cache version\
    \ for each host and vary headers, so that two applications sharing the same code\
    \ base but not the same hostname use different caches. This can be of great use,\
    \ for instance, when"
