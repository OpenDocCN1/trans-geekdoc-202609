  md: "```\n// Date and time\n$form->setWidget('end', new sfWidgetFormDateTime(array('default'\
    \ => '01/01/2008 12:00')));\n// symfony renders the widget in HTML as 5 dropdown\
    \ lists for month, day,\nyear, hour, minute\n```\n\nOf course, you can customize\
    \ the date format, to display it in European style instead of International style\
    \ (%day%/%month%/%year% instead of %month%/%day%/%year%), you can switch to 2x12\
    \ hours per day instead of 24 hours, you can define custom values for the first\
    \ option of each dropdown box, and you can define limits to the possible values.\
    \ Once again, check the API documentation for more details about the options of\
    \ the date and time widgets.\n\nDate widgets are a good example of the power of\
    \ widgets in symfony. A widget is not a simple form input. It can be a combination\
    \ of several inputs, that symfony can render and read from in a transparent way.\n\
    \n# I18n Widgets\n\nIn multilingual applications, dates must be displayed in a\
    \ format according to the user culture (see Chapter 13 for details about culture\
    \ and localization). To facilitate this localization in forms, symfony provides\
    \ an sfWidgetFormI18nDate widget, which expects a user culture to decide of the\
    \ date formatting parameters. You can also specify a month_format to have the\
    \ month drop-down display month names (in the user language) instead of numbers.\n\
    \n```\n// Date\n$years = range(1950, 1990);\n$form->setWidget('dob', new sfWidgetFormI18nDate(array(\n\
    \  'culture'     => $this->getUser()->getCulture(),\n  'month_format' => 'name',\
