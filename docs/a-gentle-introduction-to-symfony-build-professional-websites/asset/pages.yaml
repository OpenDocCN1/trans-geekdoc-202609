    # Sending an Email from a Task


    Sending an email from a task is quite similar to sending an email from an action,
    as the task system also provides a getMailer() method.


    When creating the mailer, the task system relies on the current configuration.
    So, if you want to use a configuration from a specific application, you must accept
    the --application option (see the chapter on tasks for more information on this
    topic).


    Notice that the task uses the same configuration as the controllers. So, if you
    want to force the delivery when the spool strategy is used, use sendNextImmediately():


    ```

    $this->getMailer()->sendNextImmediately()->send($message);

    ```


