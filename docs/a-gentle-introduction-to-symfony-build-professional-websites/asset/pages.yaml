- pgno: 342
  md: '# Optimizing Your Code


    It''s also possible to speed up your application by optimizing the code itself.
    This section offers some insight regarding how to do that.


    # Core Compilation


    Loading ten files requires more I/O operations than loading one long file, especially
    on slow disks. Loading a very long file requires more resources than loading a
    smaller file—especially if a large share of the file content is of no use for
    the PHP parser, which is the case for comments.


    So merging a large number of files and stripping out the comments they contain
    is an operation that improves performance. Symfony already does that optimization;
    it''s called the core compilation. At the beginning of the first request (or after
    the cache is cleared), a symfony application concatenates all the core framework
    classes (sfActions, sfRequest, sfView, and so on) into one file, optimizes the
    file size by removing comments and double blanks, and saves it in the cache, in
    a file called config_core_compile.yml.php. Each subsequent request only loads
    this single optimized file instead of the 30 files that compose it.


    If your application has classes that must always be loaded, and especially if
    they are big classes with lots of comments, it may be beneficial to add them to
    the core compile file. To do so, just add a core_compile.yml file in your application
    config/ directory, and list in it the classes that you want to add, as in Listing
    18-21.


    ```

    Listing 18-21 - Adding Your Classes to the Core Compile File, in frontend/config/core_compile.yml


    - %SF_ROOT_DIR%/lib/myClass.class.php

    - %SF_ROOT_DIR%/apps/frontend/lib/myToolkit.class.php

    - %SF_ROOT_DIR%/plugins/myPlugin/lib/myPluginCore.class.php

    ...

    ```


    # The project:optimize Task


    Symfony also offers another optimization tool, the project:optimize task. It applies
    various optimization strategies to the symfony and application code, which may
    further speed up the execution.


    ```

    $ php symfony project:optimize frontend prod

    ```


    If you want to see the optimization strategies implemented in the task, have a
    look at task source code.


    # Summary


    Symfony is already a very optimized framework and is able to handle high-traffic
    websites without a problem. But if you really need to optimize your application''s
    performance, tweaking the configuration (whether the server configuration, the
    PHP configuration, or the application settings) will gain you a small boost. You
    should also follow good practices to write efficient model methods; and since
    the database is often a bottleneck in web applications, this point should require
    all your attention. Templates can also benefit from a few tricks, but the best
    boost will always come from caching. Finally, don''t hesitate to look at existing
    plug-ins, since some of them provide innovative techniques to further speed up
    the delivery of web pages (sfSuperCache, project:optimize).'
  merge: -1
  img_proc: true
- pgno: 343
  md: '# # Chapter 19

    Mastering Symfony''s Configuration Files


    Now that you know symfony very well, you are already able to dig into its code
    to understand its core design and discover new hidden abilities. But before extending
    the symfony classes to match your own requirements, you should take a closer look
    at some of the configuration files. Many features are already built into symfony
    and can be activated by just changing configuration settings. This means that
    you can tweak the symfony core behavior without overriding its classes. This chapter
    takes you deep into the configuration files and their powerful capabilities.


    # ## Symfony Settings


    The frontend/config/settings.yml file contains the main symfony configuration
    for the frontend application. You have already seen the function of many settings
    from this file in the previous chapters, but let''s revisit them.


    As explained in Chapter 5, this file is environment-dependent, which means that
    each setting can take a different value for each environment. Remember that each
    parameter defined in this file is accessible from inside the PHP code via the
    sfConfig class. The parameter name is the setting name prefixed with sf_. For
    instance, if you want to get the value of the cache parameter, you just need to
    call sfConfig::get(''sf_cache'').


    # ## Default Modules and Actions


    Symfony provides default pages for special situations. In the case of a routing
    error, symfony executes an action of the default module, which is stored in the
    sfConfig::get(''sf_symfony_lib_dir'')/controller/default/ directory. The settings.yml
    file defines which action is executed depending on the error:


    +   - error_404_module and error_404_action: Action called when the URL entered
    by the user doesn''t match any route or when an sfError404Exception occurs. The
    default value is default/error404.

    +   - login_module and login_action: Action called when a nonauthenticated user
    tries to access a page defined as secure in security.yml (see Chapter 6 for details).
    The default value is default/login.

    +   - secure_module and secure_action: Action called when a user doesn''t have
    the credentials required for an action. The default value is default/secure.

    +   - module_disabled_module and module_disabled_action: Action called when a
    user requests a module declared as disabled in module.yml. The default value is
    default/disabled.'
  merge: -1
  img_proc: true
- pgno: 344
  md: 'Before deploying an application to production, you should customize these actions,
    because the default module templates include the symfony logo on the page. See
    Figure 19-1 for a screenshot of one of these pages, the error 404 page.


    # Figure 19-1 - Default 404 error page


    ![](img/0f886a7f4cbcc3939be96e985ca35ff4_344_0.png)


    You can override the default pages in two ways:


    +   - You can create your own default module in the application’s modules/ directory,
    override all the actions defined in the settings.yml file (index, error404, login,
    secure, disabled) and all the related templates (indexSuccess.php, error404Success.php,
    loginSuccess.php, secureSuccess.php, disabledSuccess.php).


    +   - You can change the default module and action settings of the settings.yml
    file to use pages of your application.


    Two other pages bear a symfony look and feel, and they also need to be customized
    before deployment to production. These pages are not in the default module, because
    they are called when symfony cannot run properly. Instead, you will find these
    default pages in the sfConfig::get( ''sf_symfony_lib_dir'' )/exception/data/ directory:


    +   - error.html.php: Page called when an internal server error occurs in the
    production environment. In other environments (where debug is set to true), when
    an error occurs, symfony displays the full execution stack and an explicit error
    message (see Chapter 16 for details).


    +   - unavailable.php: Page called when a user requests a page while the application
    is disabled (with the project:disable task). It is also called while the cache
    is being cleared (that is, between a call to the cache:clear task and the end
    of this task execution). On systems with a very large cache, the cache-clearing
    process can take several seconds. Symfony cannot execute a request with a partially
    cleared cache, so requests received before the end of the process are redirected
    to this page.'
  merge: -1
  img_proc: true
- pgno: 345
  md: 'To customize these pages, simply create error/error.html.php and unavailable.php
    in your project or application''s config/ directory. Symfony will use these templates
    instead of its own.


    To have requests redirected to the unavailable.php page when needed, you need
    to set the check_lock setting to true in the application settings.yml. The check
    is deactivated by default, because it adds a very slight overhead for every request.


    # Optional Feature Activation


    Some parameters of the settings.yml file control optional framework features that
    can be enabled or disabled. Deactivating unused features boosts performances a
    bit, so make sure to review the settings listed in Table 19-1 before deploying
    your application.


    # Table 19-1 - Optional Features Set Through settings.yml


    | Parameter | Description | Default Value |

    | :--- | :--- | :--- |

    | use_database | Enables the database manager. Set it to false if you don''t use
    a database. | true |

    | i18n | Enables interface translation (see Chapter 13). Set it to true for multilingual
    applications. | false |

    | logging_enabled | Enables logging of symfony events. Set it to false when you
    want to turn symfony logging off completely. | true |

    | escaping_strategy | Enables the output escaping feature (see Chapter 7). Set
    it to true if you want data passed to your templates to be escaped. | true |

    | cache | Enables template caching (see Chapter 12). Set it to true if one of
    your modules includes cache.yml file. The cache filter (sfCacheFilter) is enabled
    only if it is on. | false in development, true in production |

    | web_debug | Enables the web debug toolbar for easy debugging (see Chapter 16).
    Set it to true to display the toolbar on every page. | true in development, false
    in production |

    | check_symfony_version | Enables the check of the symfony version for every request.
    Set it to true for automatic cache clearing after a framework upgrade. Leave it
    set to false if you always clear the cache after an upgrade. | false |

    | check_lock | Enables the application lock system, triggered by the cache:clear
    and project:disable tasks (see the previous section). Set it to true to have all
    requests to disabled applications redirected to the sfConfig::get(''sf_symfony_lib_dir'')/exception/data/unavailable.php
    page. | false |

    | compressed | Enables PHP response compression. Set it to true to compress the
    outgoing HTML via the PHP compression handler. | false |'
