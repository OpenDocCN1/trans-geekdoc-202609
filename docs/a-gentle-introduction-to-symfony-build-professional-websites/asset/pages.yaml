    \       => 'Date of birth',\n  'default'     => '01/01/1950',\n  'years'     \
    \  => array_combine($years, $years)\n)));\n// For an English-speaking user, symfony\
    \ renders the widget in HTML as\n<label for=\"dob\">Date of birth</label>\n<select\
    \ id=\"dob_month\" name=\"dob[month]\">\n<option value=\"\"/>\n<option selected=\"\
