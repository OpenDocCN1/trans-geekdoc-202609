  md: "```\nok 10 - objects of class myObject do have a myMethod method\nok 11 - the\
    \ first and the second array are the same\nnot ok 12 - the fooBar.php file was\
    \ properly included\n#       Failed test (./test/unit/testTest.php at line 27)\n\
    #       Tried to include './fooBar.php'\nok 13 - exception caught successfully\n\
    ok 14 # SKIP skipping one test to keep the test count exact in the\ncondition\n\
    ok 15 # TODO one test left to do\n# Looks like you planned 16 tests but only ran\
    \ 15.\n# Looks like you failed 1 tests of 16.\n```\n\nThe diag() method doesn't\
    \ count as a test. Use it to show comments, so that your test output stays organized\
    \ and legible. On the other hand, the todo() and skip() methods count as actual\
    \ tests. A pass()/fail() combination inside a try/catch block counts as a single\
    \ test.\n\nA well-planned test strategy must contain an expected number of tests.\
    \ You will find it very useful to validate your own test files—especially in complex\
    \ cases where tests are run inside conditions or exceptions. And if the test fails\
    \ at some point, you will see it quickly because the final number of run tests\
    \ won't match the number given during initialization.\n\n# The test:unit Task\n\
    \nThe test:unit task, which launches unit tests from the command line, expects\
    \ either a list of test names or a file pattern. See Listing 15-5 for details.\n\
    \nListing 15-5 - Launching Unit Tests\n\n```\n// Test directory structure\ntest/\n\
    \  unit/\n    myFunctionTest.php\n    mySecondFunctionTest.php\n    foo/\n   \
    \   barTest.php\n\n$ php symfony test:unit myFunction    # Run\nmyFunctionTest.php\n\
    $ php symfony test:unit myFunction mySecondFunction   # Run both tests\n$ php\
    \ symfony test:unit foo/*        # Run barTest.php\n$ php symfony test:unit *\
    \          # Run all tests\n     (recursive)\n```\n\n# Stubs, Fixtures, and Autoloading\n\
    \nIn a unit test, the autoloading feature is not active by default. Each class\
    \ that you use in a test must be either defined in the test file or required as\
    \ an external dependency. That's why many test files start with a group of include\
    \ lines, as Listing 15-6 demonstrates.\n\nListing 15-6 - Including Classes in\
    \ Unit Tests\n\n```\n<?php\n\ninclude dirname(__FILE__).'/../bootstrap/unit.php';\n\
    require_once sfConfig::get('sf_symfony_lib_dir').'/util/\nsfToolkit.class.php';\n\
    \n$t = new lime_test(7);\n```"
