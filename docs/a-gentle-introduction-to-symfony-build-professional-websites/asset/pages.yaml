  md: "# Magic Methods\n\nOne of the strengths of PHP's object capabilities is the\
    \ use of magic methods. These are methods that can be used to override the default\
    \ behavior of classes without modifying the outside code. They make the PHP syntax\
    \ less verbose and more extensible. They are easy to recognize, because the names\
    \ of the magic methods start with two underscores (__).\n\nFor instance, when\
    \ displaying an object, PHP implicitly looks for a __toString() method for this\
    \ object to see if a custom display format was defined by the developer:\n\n```\n\
    $myObject = new myClass();\necho $myObject;\n\n// Will look for a magic method\n\
    echo $myObject->__toString();\n```\n\nSymfony uses magic methods, so you should\
    \ have a thorough understanding of them. They are described in the PHP documentation\
    \ (http://www.php.net/manual/en/language.oop5.magic.php12).\n\n# Object-Relational\
    \ Mapping (ORM)\n\nDatabases are relational. PHP and symfony are object-oriented.\
    \ In order to access the database in an object-oriented way, an interface translating\
    \ the object logic to the relational logic is required. This interface is called\
    \ an object-relational mapping, or ORM.\n\nAn ORM is made up of objects that give\
    \ access to data and keep business rules within themselves.\n\nOne benefit of\
    \ an object/relational abstraction layer is that it prevents you from using a\
    \ syntax that is specific to a given database. It automatically translates calls\
    \ to the model objects to SQL queries optimized for the current database.\n\n\
    This means that switching to another database system in the middle of a project\
    \ is easy. Imagine that you have to write a quick prototype for an application,\
    \ but the client has not decided yet which database system would best suit his\
    \ needs. You can start building your application with SQLite, for instance, and\
    \ switch to MySQL, PostgreSQL, or Oracle when the client is ready to decide. Just\
    \ change one line in a configuration file, and it works.\n\nAn abstraction layer\
    \ encapsulates the data logic. The rest of the application does not need to know\
    \ about the SQL queries, and the SQL that accesses the database is easy to find.\
    \ Developers who specialize in database programming also know clearly where to\
    \ go.\n\nUsing objects instead of records, and classes instead of tables, has\
    \ another benefit: you can add new accessors to your tables. For instance, if\
    \ you have a table called Client with two fields, FirstName and LastName, you\
    \ might like to be able to require just a Name. In an object-oriented world, this\
    \ is as easy as adding a new accessor method to the Client class, like this:\n\
    \n```\npublic function getName()\n{\n return $this->getFirstName().' '.$this->getLastName();\n\
    }\n```\n\nAll the repeated data-access functions and the business logic of the\
    \ data can be maintained within such objects. For instance, consider a class ShoppingCart\
    \ in which you keep items"
  merge: -1
  img_proc: true
