- pgno: 367
  md: "# Listing 8-13 - Retrieving Records by Criteria with doSelect()—Criteria with\
    \ Conditions\n\n```\n```php\n$c = new Criteria();\n$c->add(CommentPeer::AUTHOR,\
    \ 'Steve');\n$c->addAscendingOrderByColumn(CommentPeer::CREATED_AT);\n$comments\
    \ = CommentPeer::doSelect($c);\n\n// Will result in the following SQL query\n\
    SELECT blog_comment.ARTICLE_ID, blog_comment.AUTHOR, blog_comment.CONTENT,\n \
    \   blog_comment.CREATED_AT\nFROM   blog_comment\nWHERE  blog_comment.author =\
    \ 'Steve'\nORDER BY blog_comment.CREATED_AT ASC;\n```\n```\n\nThe class constants\
    \ passed as parameters to the add() methods refer to the property names. They\
    \ are named after the capitalized version of the column names. For instance, to\
    \ address the content column of the blog_article table, use the ArticlePeer::CONTENT\
    \ class constant.\n\n> > Why use CommentPeer::AUTHOR instead of blog_comment.AUTHOR,\
    \ which is the way it will be output in the SQL query anyway? Suppose that you\
    \ need to change the name of the author field to contributor in the database.\
    \ If you used blog_comment.AUTHOR, you would have to change it in every call to\
    \ the model. On the other hand, by using CommentPeer::AUTHOR, you simply need\
    \ to change the column name in the schema.yml file, keep phpName as AUTHOR, and\
    \ rebuild the model.\n\nTable 8-1 compares the SQL syntax with the Criteria object\
    \ syntax.\n\n# Table 8-1 - SQL and Criteria Object Syntax\n\n| SQL | Criteria\
    \ |\n| --- | --- |\n| WHERE column = value | ->add(column, value); |\n| WHERE\
    \ column <> value | ->add(column, value, Criteria::NOT_EQUAL); |\n| **Other Comparison\
    \ Operators** | |\n| > , < | Criteria::GREATER_THAN, Criteria::LESS_THAN |\n|\
    \ >=, <= | Criteria::GREATER_EQUAL, Criteria::LESS_EQUAL |\n| IS NULL, IS NOT\
    \ NULL | Criteria::ISNULL, Criteria::ISNOTNULL |\n| LIKE, ILIKE | Criteria::LIKE,\
    \ Criteria::ILIKE |\n| IN, NOT IN | Criteria::IN, Criteria::NOT_IN |\n| **Other\
    \ SQL Keywords** | |\n| ORDER BY column ASC | ->addAscendingOrderByColumn(column);\
    \ |\n| ORDER BY column DESC | - |\n| | ->addDescendingOrderByColumn(column); |\n\
    | LIMIT limit | ->setLimit(limit) |\n| OFFSET offset | ->setOffset(offset) |\n\
    | FROM table1, table2 WHERE table1.coll = table2.col2 | ->addJoin(coll, col2)\
    \ |"
  merge: -1
