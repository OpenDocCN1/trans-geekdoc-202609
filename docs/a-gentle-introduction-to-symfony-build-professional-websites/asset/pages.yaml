    Like many getters in symfony, the getAttribute() method accepts a second argument,\
    \ specifying the default value to be used when the attribute is not defined. To\
    \ check whether an attribute has been defined for a user, use the hasAttribute()\
    \ method. The attributes are stored in a parameter holder that can be accessed\
    \ by the getAttributeHolder() method. It allows for easy cleanup of the user attributes\
    \ with the usual parameter holder methods, as shown in Listing 6-15.\n\n# Listing\
    \ 6-15 - Removing Data from the User Session\n\n```\nclass mymoduleActions extends\
    \ sfActions\n{\n  public function executeRemoveNickname()\n  {\n    $this->getUser()->getAttributeHolder()->remove('nickname');\n\
    \  }\n\n  public function executeCleanup()\n  {\n    $this->getUser()->getAttributeHolder()->clear();\n\
    \  }\n}\n```\n\nThe user session attributes are also available in the templates\
    \ by default via the $sf_user variable, which stores the current sfUser object,\
    \ as shown in Listing 6-16.\n\n# Listing 6-16 - Templates Also Have Access to\
    \ the User Session Attributes"
