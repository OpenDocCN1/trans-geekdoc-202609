  md: '# Listing 8-15 - Custom SQL Query with PDO


    ```

    $connection = Doctrine_Manager::connection();

    $query = ''SELECT MAX(created_at) AS max FROM blog_article'';

    $statement = $connection->execute($query);

    $statement->execute();

    $resultset = $statement->fetch(PDO::FETCH_OBJ);

    $max = $resultset->max;

    ```


    Just like Doctrine selections, PDO queries are tricky when you first start using
    them. Once again, examples from existing applications and tutorials will show
    you the right way.


    > If you are tempted to bypass this process and access the database directly,
    you risk losing the security and abstraction provided by Doctrine. Doing it the
    Doctrine way is longer, but it forces you to use good practices that guarantee
    the performance, portability, and security of your application. This is especially
    true for queries that contain parameters coming from a untrusted source (such
    as an Internet user). Doctrine does all the necessary escaping and secures your
    database. Accessing the database directly puts you at risk of SQL-injection attacks.


    # Using Special Date Columns


    Usually, when a table has a column called created_at, it is used to store a timestamp
    of the date when the record was created. The same applies to updated_at columns,
    which are to be updated each time the record itself is updated, to the value of
    the current time.


    The good news is that Doctrine has a Timestampable behavior that will handle their
    updates for you. You don''t need to manually set the created_at and updated_at
    columns; they will automatically be updated, as shown in Listing 8-16.


    # Listing 8-16 - created_at and updated_at Columns Are Dealt with Automatically


    ```

    $comment = new Comment();

    $comment->setAuthor(''Steve'');

    $comment->save();


    // Show the creation date

    echo $comment->getCreatedAt();

    => [date of the database INSERT operation]

    ```'
