  md: '# Adding your own timer


    Symfony uses the sfTimer class to calculate the time spent on the configuration,
    the model, the action, and the view. Using the same object, you can time a custom
    process and display the result with the other timers in the web debug toolbar.
    This can be very useful when you work on performance optimizations.


    To initialize timing on a specific fragment of code, call the getTimer() method.
    It will return an sfTimer object and start the timing. Call the addTime() method
    on this object to stop the timing. The elapsed time is available through the getElapsedTime()
    method, and displayed in the web debug toolbar with the others.


    ```

    // Initialize the timer and start timing

    $timer = sfTimerManager::getTimer(''myTimer'');


    // Do things

    ...


    // Stop the timer and add the elapsed time

    $timer->addTime();


    // Get the result (and stop the timer if not already stopped)

    $elapsedTime = $timer->getElapsedTime();

    ```


    The benefit of giving a name to each timer is that you can call it several times
    to accumulate timings. For instance, if the myTimer timer is used in a utility
    method that is called twice per request, the second call to the getTimer(''myTimer'')
    method will restart the timing from the point calculated when addTime() was last
    called, so the timing will add up to the previous one. Calling getCalls() on the
    timer object will give you the number of times the timer was launched, and this
    data is also displayed in the web debug toolbar.


    ```

    // Get the number of calls to the timer

    $nbCalls = $timer->getCalls();

    ```


    In Xdebug mode, the log messages are much richer. All the PHP script files and
    the functions that are called are logged, and symfony knows how to link this information
    with its internal log. Each line of the log messages table has a double-arrow
    button, which you can click to see further details about the related request.
    If something goes wrong, the Xdebug mode gives you the maximum amount of detail
    to find out why.


    > The web debug toolbar is not included by default in Ajax responses and documents
    that have a non-HTML content-type. For the other pages, you can disable the web
    debug toolbar manually from within an action by simply calling sfConfig::set(''sf_web_debug'',
    false).


    # Manual Debugging


    Getting access to the framework debug messages is nice, but being able to log
    your own messages is better. Symfony provides shortcuts, accessible from both
    actions and templates, to help you trace events and/or values during request execution.


    Your custom log messages appear in the symfony log file as well as in the web
    debug toolbar, just like regular events. (Listing 16-5 gave an example of the
    custom log message syntax.) A custom message is a good way to check the value
    of a variable from a template, for instance. Listing 16-11 shows how to use the
    web debug toolbar for developer''s feedback from a template (you can also use
    $this->logMessage() from an action).'
