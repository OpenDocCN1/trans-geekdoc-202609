- pgno: 282
  md: "# # Chapter 16\nApplication Management Tools\n\nDuring both the development\
    \ and deployment phases, developers require a consistent stream of diagnostic\
    \ information in order to determine whether the application is working as intended.\
    \ This information is generally aggregated through logging and debugging utilities.\
    \ Because of the central role frameworks, such as symfony, play in driving applications,\
    \ it’s crucial that such capabilities are tightly integrated to ensure efficient\
    \ developmental and operational activities.\n\nDuring the life of an application\
    \ on the production server, the application administrator repeats a large number\
    \ of tasks, from log rotation to upgrades. A framework must also provide tools\
    \ to automate these tasks as much as possible.\n\nThis chapter explains how symfony\
    \ application management tools can answer all these needs.\n\n# ## Logging\n\n\
    The only way to understand what went wrong during the execution of a request is\
    \ to review a trace of the execution process. Fortunately, as you’ll learn in\
    \ this section, both PHP and symfony tend to log large amounts of this sort of\
    \ data.\n\n# ### PHP Logs\n\nPHP has an error_reporting parameter, defined in\
    \ php.ini, that specifies which PHP events are logged. Symfony allows you to override\
    \ this value, per application and environment, in the settings.yml file, as shown\
    \ in Listing 16-1.\n\nListing 16-1 - Setting the Error Reporting Level, in frontend/config/settings.yml\n\
    \n```\nprod:\n  .settings:\n    error_reporting: <?php echo (E_PARSE | E_COMPILE_ERROR\
    \ | E_ERROR |\n      E_CORE_ERROR | E_USER_ERROR).\"\\n\" ?>\n\ndev:\n  .settings:\n\
    \    error_reporting: <?php echo (E_ALL | E_STRICT).\"\\n\" ?>\n```\n\nIn order\
    \ to avoid performance issues in the production environment, the server logs only\
    \ the critical PHP errors. However, in the development environment, all types\
    \ of events are logged, so that the developer can have all the information necessary\
    \ to trace errors.\n\nThe location of the PHP log files depends on your php.ini\
    \ configuration. If you never bothered about defining this location, PHP probably\
    \ uses the logging facilities provided by"
  merge: -1
  img_proc: true
- pgno: 283
  md: "your web server (such as the Apache error logs). In this case, you will find\
    \ the PHP logs under\nthe web server log directory.\n\n# Symfony Logs\n\nIn addition\
    \ to the standard PHP logs, symfony can log a lot of custom events. You can find\
    \ all\nthe symfony logs under the myproject/log/ directory. There is one file\
    \ per application and\nper environment. For instance, the development environment\
    \ log file of the frontend\napplication is named frontend_dev.log, the production\
    \ one is named\nfrontend_prod.log, and so on.\n\nIf you have a symfony application\
    \ running, take a look at its log files. The syntax is very\nsimple. For every\
    \ event, one line is added to the log file of the application. Each line includes\n\
    the exact time of the event, the nature of the event, the object being processed,\
    \ and any\nadditional relevant details. Listing 16-2 shows an example of symfony\
    \ log file content.\n\n# Listing 16-2 - Sample Symfony Log File Content, in log/frontend_dev.log\n\
    \n```\nNov 15 16:30:25 symfony [info] {sfAction} call\n\"barActions->executemessages()\"\
    \nNov 15 16:30:25 symfony [info] {sfPropelLogger} executeQuery: SELECT\nbd_message.ID...\n\
    Nov 15 16:30:25 symfony [info] {sfView} set slot \"leftbar\" (bar/index)\nNov\
    \ 15 16:30:25 symfony [info] {sfView} set slot \"messageblock\" (bar/\nmes...\n\
    Nov 15 16:30:25 symfony [info] {sfView} execute view for template\n\"messa...\n\
    Nov 15 16:30:25 symfony [info] {sfView} render \"/home/production/\nmyproject/...\n\
    Nov 15 16:30:25 symfony [info] {sfView} render to client\n```\n\nYou can find\
    \ many details in these files, including the actual SQL queries sent to the\n\
    database, the templates called, the chain of calls between objects, and so on.\n\
    \n> The format of the file logs is configurable by overriding the format and/or\
    \ the\n> time_format settings in factories.yml as shown in Listing 16-3.\n\n#\
    \ Listing 16-3 - Changing the Log Format\n\n```\nall:\n  logger:\n    param:\n\
    \      sf_file_debug:\n        param:\n          format:      %time% %type% [%priority%]\
    \ %message%%EOL%\n          time_format: %b %d %H:%M:%S\n```\n\n# Symfony Log\
    \ Level Configuration\n\nThere are eight levels of symfony log messages: emerg,\
    \ alert, crit, err, warning,\nnotice, info, and debug, which are the same as the\
    \ PEAR::Log^55 package levels. You can\nconfigure the maximum level to be logged\
    \ in each environment in the factories.yml\nconfiguration file of each application,\
    \ as demonstrated in Listing 16-4.\n\n# Listing 16-4 - Default Logging Configuration,\
    \ in frontend/config/factories.yml"
