  md: "```\n// isPathAbsolute()\n$t->diag('isPathAbsolute()');\n$t->is(sfToolkit::isPathAbsolute('/test'),\
    \ true,\n    'isPathAbsolute() returns true if path is absolute');\n$t->is(sfToolkit::isPathAbsolute('\\\
    \\test'), true,\n    'isPathAbsolute() returns true if path is absolute');\n$t->is(sfToolkit::isPathAbsolute('C:\\\
    \\test'), true,\n    'isPathAbsolute() returns true if path is absolute');\n$t->is(sfToolkit::isPathAbsolute('d:/test'),\
    \ true,\n    'isPathAbsolute() returns true if path is absolute');\n$t->is(sfToolkit::isPathAbsolute('test'),\
    \ false,\n    'isPathAbsolute() returns false if path is relative');\n$t->is(sfToolkit::isPathAbsolute('../test'),\
    \ false,\n    'isPathAbsolute() returns false if path is relative');\n$t->is(sfToolkit::isPathAbsolute('..\\\
    \\test'), false,\n    'isPathAbsolute() returns false if path is relative');\n\
    ```\n\nIn unit tests, you need to instantiate not only the object you’re testing,\
    \ but also the object it depends upon. Since unit tests must remain unitary, depending\
    \ on other classes may make more than one test fail if one class is broken. In\
    \ addition, setting up real objects can be expensive, both in terms of lines of\
    \ code and execution time. Keep in mind that speed is crucial in unit testing\
    \ because developers quickly tire of a slow process.\n\nWhenever you start including\
    \ many scripts for a unit test, you may need a simple autoloading system. For\
    \ this purpose, the sfSimpleAutoload class (which must be manually included) provides\
    \ an addDirectory() method which expects an absolute path as parameter and that\
    \ can be called several times in case you need to include several directories\
    \ on the search path. All the classes located under this path will be autoloaded.\
    \ For instance, if you want to have all the classes located under sfConfig::get('sf_symfony_lib_dir')/util/\
    \ autoloaded, start your unit test script as follows:\n\n```\nrequire_once sfConfig::get('sf_symfony_lib_dir').'/autoload/sfSimpleAutoload.class.php';\n\
    $autoload = sfSimpleAutoload::getInstance();\n$autoload->addDirectory(sfConfig::get('sf_symfony_lib_dir').'/util');\n\
    $autoload->register();\n```\n\nAnother good workaround for the autoloading issues\
    \ is the use of stubs. A stub is an alternative implementation of a class where\
    \ the real methods are replaced with simple canned data. It mimics the behavior\
    \ of the real class, but without its cost. A good example of stubs is a database\
    \ connection or a web service interface. In Listing 15-7, the unit tests for a\
    \ mapping API rely on a WebService class. Instead of calling the real fetch()\
    \ method of the actual web service class, the test uses a stub that returns test\
    \ data.\n\n# Listing 15-7 - Using Stubs in Unit Tests\n\n```\nrequire_once dirname(__FILE__).'/../../../lib/WebService.class.php';\n\
    require_once dirname(__FILE__).'/../../../lib/MapAPI.class.php';\n\nclass testWebService\
    \ extends WebService\n{\n  public static function fetch()\n  {\n    return file_get_contents(dirname(__FILE__).'/fixtures/data/fake_web_service.xml');\n\
    \  }\n}\n```"
