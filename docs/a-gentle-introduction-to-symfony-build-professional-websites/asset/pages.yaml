- pgno: 133
  md: "# Adding New Methods\n\nYou can add new methods to the empty model classes\
    \ generated in the lib/model/ doctrine directory. Use $this to call methods of\
    \ the current object, and use self:: to call static methods of the current class.\
    \ Remember that the custom classes inherit methods from the Base classes located\
    \ in the lib/model/doctrine/base directory.\n\nFor instance, for the Article object\
    \ generated based on Listing 8-3, you can add a magic __toString() method so that\
    \ echoing an object of class Article displays its title, as shown in Listing 8-20.\n\
    \nListing 8-20 - Customizing the Model, in lib/model/doctrine/Article.php\n\n\
    ```\nclass Article extends BaseArticle\n{\n    public function __toString()\n\
    \    {\n        return $this->getTitle(); // getTitle() is inherited from BaseArticle\n\
    \    }\n}\n```\n\nYou can also extend the table classes—for instance, to add a\
    \ method to retrieve all articles ordered by creation date, as shown in Listing\
    \ 8-21.\n\nListing 8-21 - Customizing the Model, in lib/model/doctrine/ArticleTable.php\n\
    \n```\nclass ArticleTable extends BaseArticleTable\n{\n    public function getAllOrderedByDate()\n\
    \    {\n        $q = $this->createQuery('a')\n        ->orderBy('a.created_at\
    \ ASC');\n\n        return $q->execute();\n    }\n}\n```\n\nThe new methods are\
    \ available in the same way as the generated ones, as shown in Listing 8-22.\n\
    \nListing 8-22 - Using Custom Model Methods Is Like Using the Generated Methods\n\
    \n```\n$articles = Doctrine_Core::getTable('Article')->getAllOrderedByDate();\n\
    foreach ($articles as $article)\n{\n    echo $article; // Will call the magic\
    \ __toString() method\n}\n```\n\n# Overriding Existing Methods\n\nIf some of the\
    \ generated methods in the Base classes don't fit your requirements, you can still\
    \ override them in the custom classes. Just make sure that you use the same method\
    \ signature (that is, the same number of arguments).\n\nFor instance, the $article->getComments()\
    \ method returns a collection of Comment objects, in no particular order. If you\
    \ want to have the results ordered by creation date, with the latest comment coming\
    \ first, then create the getComments() method, as shown in Listing 8-23.\n\nListing\
    \ 8-23 - Overriding Existing Model Methods, in lib/model/doctrine/Article.php"
