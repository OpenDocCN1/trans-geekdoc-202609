    Every path to a key directory is determined by a parameter ending with `_dir`.
    Always use the path variables instead of real (relative or absolute) file paths,
    so that you will be able to change them later, if necessary. For instance, when
    you want to move a file to the `uploads/` directory in an application, you should
    use `sfConfig::get(''sf_upload_dir'')` for the path instead of `sfConfig::get(''sf_root_dir'').''/web/uploads''`.


    # Customizing the File Structure


    You will probably need to modify the default project file structure if you develop
    an application for a client who already has a defined directory structure and
    who is not willing to change it to comply with the symfony logic. By overriding
    the `sf_XXX_dir` variables with `sfConfig`, you can make symfony work for a totally
    different directory structure than the default structure. The best place to do
    this is in the application `ProjectConfiguration` class for project directories,
    or `XXXConfiguration` class for applications directories.


    For instance, if you want all applications to share a common directory for the
    template layouts, add this line to the `setup()` method of the `ProjectConfiguration`
    class to override the `sf_app_template_dir` settings:


    ```

    sfConfig::set(''sf_app_template_dir'',

    sfConfig::get(''sf_root_dir'').DIRECTORY_SEPARATOR.''templates'');

    ```


    > Even if you can change your project directory structure by calling `sfConfig::set()`,
    it''s better to use the dedicated methods defined by the project and application
    configuration classes if possible as they take care of changing all the related
    paths. For example, the `setCacheDir()` method changes the following constants:
    `sf_cache_dir`, `sf_app_base_cache_dir`, `sf_app_cache_dir`, `sf_template_cache_dir`,
    `sf_i18n_cache_dir`, `sf_config_cache_dir`, `sf_test_cache_dir`, and `sf_module_cache_dir`.


    # Modifying the Project Web Root


    All the paths built in the configuration classes rely on the project root directory,
    which is determined by the `ProjectConfiguration` file included in the front controller.
    Usually, the root directory is one level above the `web/` directory, but you can
    use a different structure. Suppose that your main directory structure is made
    of two directories, one public and one private, as shown in Listing 19-5. This
    typically happens when hosting a project on a shared host.


    # Listing 19-5 - Example of Custom Directory Structure for a Shared Host


    ```

    symfony/  # Private area

    apps/

    ```'
