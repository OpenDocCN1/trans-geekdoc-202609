- pgno: 317
  md: "+   - If you use Propel, model classes in myplugin/lib/model/ specialize the\
    \ model classes generated by the Propel builder (in myplugin/lib/model/om/ and\
    \ myplugin/lib/model/map/). They are, of course, autoloaded. Be aware that you\
    \ cannot override the generated model classes of a plug-in in your own project\
    \ directories.\n+   - If you use Doctrine, the ORM generates the plugins base\
    \ classes in myplugin/lib/model/Plugin*.class.php, and concrete classes in lib/model/myplugin/.\
    \ This means that you can easily override the model classes in your application.\n\
    +   - Tasks are immediately available to the symfony command line as soon as the\
    \ plug-in is installed. A plugin can either add new tasks, or override an existing\
    \ one. It is a best practice to use the plug-in name as a namespace for the task.\
    \ Type php symfony to see the list of available tasks, including the ones added\
    \ by plug-ins.\n+   - Modules provide new actions accessible from the outside,\
    \ provided that you declare them in the enabled_modules setting in your application.\n\
    +   - Web assets (images, scripts, style sheets, etc.) are made available to the\
    \ server. When you install a plug-in via the command line, symfony creates a symlink\
    \ to the project web/ directory if the system allows it, or copies the content\
    \ of the module web/ directory into the project one. If the plug-in is installed\
    \ from an archive or a version control repository, you have to copy the plug-in\
    \ web/ directory by hand (as the README bundled with the plug-in should mention).\n\
    \n**Registering routing rules in a Plugin** A plug-in can add new rules to the\
    \ routing system, but it is not recomendable to do it by using a custom routing.yml\
    \ configuration file. This is because the order in which rules are defined is\
    \ very important, and the simple cascade configuration system of YAML files in\
    \ symfony would mess this order up. Instead, plug-ins need to register an event\
    \ listener on the routing.load_configuration event and manually prepend rules\
    \ in the listener:\n\n```\n// in plugins/myPlugin/config/config.php\n$this->dispatcher->connect('routing.load_configuration',\n\
    array('myPluginRouting', 'listenToRoutingLoadConfigurationEvent'));\n\n// in plugins/myPlugin/lib/myPluginRouting.php\n\
    class myPluginRouting\n{\n    static public function listenToRoutingLoadConfigurationEvent(sfEvent\
    \ $event)\n    {\n        $routing = $event->getSubject();\n        // add plug-in\
    \ routing rules on top of the existing ones\n        $routing->prependRoute('my_route',\
    \ new sfRoute('/my_plugin/:action',\n        array('module' => 'myPluginAdministrationInterface')));\n\
    \    }\n}\n```\n\n**TIP:** Defining the default settings in config/app.yml The\
    \ Plugin own default settings can be defined in its config/app.yml file. However\
    \ overriding settings defined in an other plugin is not safe as the final value\
    \ would depends on the app.yml files loading order. Custom application configuration\
    \ can be used in the plug-in code (for instance, by using sfConfig::get('app_myplugin_foo')\
    \ and the settings can be overridden at the application level (see Listing 17-20\
    \ for an example) Handling of the default values can be done by using the second\
    \ argument of the sfConfig::get() method or by defining it in the plugin app.yml\
    \ file."
  merge: -1
