    \ cache.yml, you can regroup the settings for all the actions of a module under\
    \ the all: key, also shown in Listing 12-3.\n\n# Listing 12-3 - A Full cache.yml\
    \ Example, in frontend/modules/user/config/cache.yml\n\n```\nlist:\n  enabled:\
    \  true\nshow:\n  enabled:  true\n\nall:\n  with_layout:  false  # Default value\n\
    \  lifetime:   86400    # Default value\n```\n\nNow, every call to the user/show\
    \ action with a different id argument creates a new record in the cache. So the\
    \ cache for this:\n\n```\nhttp://myapp.example.com/user/show/id/12\n```\n\nwill\
    \ be different than the cache for this:\n\n```\nhttp://myapp.example.com/user/show/id/25\n\
    ```\n\n> Actions called with a POST method or with GET parameters are not cached.\n\
    \nThe with_layout setting deserves a few more words. It actually determines what\
    \ kind of data is stored in the cache. For the cache without layout, only the\
    \ result of the template execution and the action variables are stored in the\
    \ cache. For the cache with layout, the whole response object is stored. This\
    \ means that the cache with layout is much faster than the cache without it.\n\
    \nIf you can functionally afford it (that is, if the layout doesn't rely on session-dependent\
    \ data), you should opt for the cache with layout. Unfortunately, the layout often\
    \ contains some dynamic elements (for instance, the name of the user who is connected),\
    \ so action cache without layout is the most common configuration. However, RSS\
    \ feeds, pop-ups, and pages that don't depend on cookies can be cached with their\
    \ layout.\n\n# Caching a Partial or Component\n\nChapter 7 explained how to reuse\
    \ code fragments across several templates, using the include_partial() helper.\
    \ A partial is as easy to cache as an action, and its cache activation follows\
