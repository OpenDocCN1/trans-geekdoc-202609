- pgno: 122
  md: "Symfony's syntax for schemas uses the YAML format. The schema.yml files must\
    \ be located in the myproject/config/doctrine directory.\n\n# # Schema Example\n\
    \nHow do you translate a database structure into a schema? An example is the best\
    \ way to understand it. Imagine that you have a blog database with two tables:\
    \ blog_article and blog_comment, with the structure shown in Figure 8-1.\n\n![](img/0f886a7f4cbcc3939be96e985ca35ff4_122_0.png)\n\
    \nThe related schema.yml file should look like Listing 8-3.\n\n# Listing 8-3 -\
    \ Sample schema.yml\n\n```\nArticle:\n  actAs: [Timestampable]\n  tableName: blog_article\n\
    \  columns:\n    id:\n      type: integer\n      primary: true\n      autoincrement:\
    \ true\n    title: string(255)\n    content: clob\n\nComment:\n  actAs: [Timestampable]\n\
    \  tableName: blog_comment\n  columns:\n    id:\n      type: integer\n      primary:\
    \ true\n      autoincrement: true\n    article_id: integer\n    author: string(255)\n\
    \    content: clob\n  relations:\n    Article:\n      onDelete: CASCADE\n    \
    \  foreignAlias: Comments\n```\n\nNotice that the name of the database itself\
    \ (blog) doesn't appear in the schema.yml file. Instead, the database is described\
    \ under a connection name (doctrine in this example). This is because the actual\
    \ connection settings can depend on the environment in which your application\
    \ runs. For instance, when you run your application in the development environment,\
    \ you will access a development database (maybe blog_dev), but with the same schema\
    \ as the production database. The connection settings will be specified in the\
    \ databases.yml file, described in the “Database Connections” section later in\
    \ this chapter."
