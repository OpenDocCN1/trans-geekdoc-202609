    # # Limiting the Number of Objects to Hydrate


    When you use a method of a peer class to retrieve objects, your query goes through
    the hydrating process (creating and populating objects based on the rows of the
    result of the query). For instance, to retrieve all the rows of the article table
    with Propel, you usually do the following:


    ```

    $articles = ArticlePeer::doSelect(new Criteria());

    ```


    The resulting $articles variable is an array of objects of class Article. Each
    object has to be created and initialized, which takes time. This has one major
    consequence: Contrary to direct database queries, the speed of a Propel query
    is directly proportional to the number of results it returns. This means your
    model methods should be optimized to return only a given number of results. When
    you don''t need all the results returned by a Criteria, you should limit it with
    the setLimit() and setOffset() methods. For instance, if you need only the rows
    10 to 20 of a particular query, refine the Criteria as in Listing 18-1.


    *Listing 18-1 - Limiting the Number of Results Returned by a Criteria*


    ```

    $c = new Criteria();

    $c->setOffset(10); // Offset of the first record returned

    $c->setLimit(10); // Number of records returned

    $articles = ArticlePeer::doSelect($c);

    ```


    This can be automated by the use of a pager. The sfPropelPager object automatically
    handles the offset and the limit of a Propel query to hydrate only the objects
    required for a given page.


    # # Minimizing the Number of Queries with Joins


    During application development, you should keep an eye on the number of database
    queries issued by each request. The web debug toolbar shows the number of queries
    for each page, and clicking the little database icon reveals the SQL code of these
    queries. If you see the number of queries rising abnormally, it is time to consider
    using a Join.


    Before explaining the Join methods, let''s review what happens when you loop over
    an array of objects and use a Propel getter to retrieve details about a related
    class, as in Listing 18-2. This example supposes that your schema describes an
    article table with a foreign key to an author table.


    *Listing 18-2 - Retrieving Details About a Related Class in a Loop*


    ```

    // In the action, with Propel

    $this->articles = ArticlePeer::doSelect(new Criteria());

    // Or with Doctrine

    $this->articles = Doctrine::getTable(''Article'')->findAll();


    // Database query issued by doSelect()

    SELECT article.id, article.title, article.author_id, ...

    FROM article


    // In the template

    <ul>

    <?php foreach ($articles as $article): ?>

    <li><?php echo $article->getTitle() ?>,

    ```'
