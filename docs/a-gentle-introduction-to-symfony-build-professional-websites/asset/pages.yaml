  md: "```\nlib/\n  *.php        // Classes\n  helper/\n  *.php        // Helpers\n\
    \  model/\n  *.php        // Model classes\n  task/\n  *Task.class.php   // CLI\
    \ tasks\n  modules/\n  */           // Modules\n    actions/\n    actions.class.php\n\
    \    config/\n    module.yml\n    view.yml\n    security.yml\n    templates/\n\
    \    *.php\n  web/\n  *           // Assets\n```\n\n# Plug-In Abilities\n\nPlug-ins\
    \ can contain a lot of things. Their content is automatically taken into account\
    \ by your application at runtime and when calling tasks with the command line.\
    \ But for plug-ins to work properly, you must respect a few conventions:\n\n+\
    \   Database schemas are detected by the propel- tasks. When you call propel:build\
    \ --classes or doctrine:build --classes in your project, you rebuild the project\
    \ model and all the plug-in models with it. Note that a Propel plug-in schema\
    \ must always have a package attribute under the shape plugins.pluginName.lib.model,\
    \ as shown in Listing 17-19. If you use Doctrine, the task will automatically\
    \ generate the classes in the plugin directory.\n\nListing 17-19 - Example of\
    \ Propel Schema Declaration in a Plug-In, in myPlugin/config/schema.yml\n\n```\n\
    propel:\n  _attributes:  { package: plugins.myPlugin.lib.model }\n  my_plugin_foobar:\n\
    \    _attributes:    { phpName: myPluginFoobar }\n    id:\n    name:         {\
    \ type: varchar, size: 255, index: unique }\n    ...\n```\n\n+   The plug-in configuration\
    \ is to be included in the plug-in configuration class (PluginNameConfiguration.class.php).\
    \ This file is executed after the application and project configuration, so symfony\
    \ is already bootstrapped at that time. You can use this file, for instance, to\
    \ extend existing classes with event listeners and behaviors.\n\n+   Fixtures\
    \ files located in the plug-in data/fixtures/ directory are processed by the propel:data-load\
    \ or doctrine:data-load task.\n\n+   Custom classes are autoloaded just like the\
    \ ones you put in your project lib/ folders.\n\n+   Helpers are automatically\
    \ found when you call use_helper() in templates. They must be in ahelper/ subdirectory\
    \ of one of the plug-in's lib/ directory."
  merge: -1
