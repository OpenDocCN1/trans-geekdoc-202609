    $cache = new sfFileCache(array(''cache_dir'' =>

    sfConfig::get(''sf_cache_dir'').''/function''));

    $fc = new sfFunctionCache($cache);

    $result1 = $fc->call(''cos'', array(M_PI));

    $result2 = $fc->call(''preg_replace'', array(''/\s\s+/'', '' '', $input));

    ```

    ```


    The sfFunctionCache constructor expects a cache object. The first argument of
    the call() method must be a callable, so it can be a function name, an array of
    a class name and static method name, or an array of an object name and public
    method name. As for the other argument of the call() method, it’s an array of
    arguments that will be passed to the callable.


    > If you use a file based cache object as in the example, it’s better to give
    a cache directory under the cache/ directory, as it will be cleanup automatically
    by the cache:clear task. If you store the function cache somewhere else, it will
    not be cleared automatically when you clear the cache through the command line.


    # Caching Data in the Server


    PHP accelerators provide special functions to store data in memory so that you
    can reuse it across requests. The problem is that they all have a different syntax,
    and each has its own specific way of performing this task. The symfony cache classes
    abstract all these differences and works with whatever accelerator you are using.
    See its syntax in Listing 18-17.


    ```

    *Listing 18-17 - Using a PHP accelerator to cache data*


    ```php

    $cache = new sfAPCCache();


    // Storing data in the cache

    $cache->set($name, $value, $lifetime);


    // Retrieving data

    $value = $cache->get($name);


    // Checking if a piece of data exists in the cache

    $value_exists = $cache->has($name);


    // Clear the cache

    $cache->clear();

    ```

    ```


    The set() method returns false if the caching didn’t work. The cached value can
    be anything (a string, an array, an object); the sfAPCCache class will deal with
    the serialization. The get() method returns null if the required variable doesn’t
    exist in the cache.


    > If you want to go further into memory caching, make sure you take a look at
    the sfMemcacheCache class. It provides the same interface as the other cache classes
    and it can help decrease the database load on load-balanced applications.


    # Deactivating the Unused Features


    The default symfony configuration activates the most common features of a web
    application. However, if you happen to not need all of them, you should deactivate
    them to save the time their initialization takes on each request.'
