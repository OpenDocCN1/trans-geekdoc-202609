    \ file—for instance, to use INI or XML files instead of YAML files.\n\n> The configuration\
    \ handler for the `config_handlers.yml` file is `sfRootConfigHandler` and, obviously,\
    \ it cannot be changed.\n\nIf you ever need to modify the way the configuration\
    \ is parsed, create an empty `config_handlers.yml` file in your application’s\
    \ `config/` folder and override the `class` lines with the classes you wrote.\n\
    \n# Adding Your Own Handler\n\nUsing a handler to deal with a configuration file\
    \ provides two important benefits:\n\n+   - The configuration file is transformed\
    \ into executable PHP code, and this code is stored in the cache. This means that\
    \ the configuration is parsed only once in production, and the performance is\
    \ optimal.\n+   - The configuration file can be defined at different levels (project\
    \ and application) and the final parameter values will result from a cascade.\
