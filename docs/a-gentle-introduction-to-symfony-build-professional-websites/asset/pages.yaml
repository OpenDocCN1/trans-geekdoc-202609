- pgno: 117
  md: "```\n<script>alert(document.cookie)</script>\n```\n\nIf you echo this value\
    \ without caution, the JavaScript will execute on every browser and allow for\
    \ much more dangerous attacks than just displaying an alert. This is why you must\
    \ escape the value before displaying it, so that it becomes something like this:\n\
    \n```\n&lt;script&gt;alert(document.cookie)&lt;/script&gt;\n```\n\nYou could escape\
    \ your output manually by enclosing every unsure value in a call to htmlspecialchars(),\
    \ but that approach would be very repetitive and error-prone. Instead, symfony\
    \ provides a special system, called output escaping, which automatically escapes\
    \ every variable output in a template. It is activated by default in the application\
    \ settings.yml.\n\n# Activating Output Escaping\n\nOutput escaping is configured\
    \ globally for an application in the settings.yml file. Two parameters control\
    \ the way that output escaping works: the strategy determines how the variables\
    \ are made available to the view, and the method is the default escaping function\
    \ applied to the data.\n\nBasically, all you need to do to activate output escaping\
    \ is to set the escaping_strategy parameter to true (which is the default), as\
    \ shown in Listing 7-38.\n\nListing 7-38 - Activating Output Escaping, in frontend/config/settings.yml\n\
    \n```\nall:\n  .settings:\n    escaping_strategy: true\n    escaping_method: \
    \ ESC_SPECIALCHARS\n```\n\nThis will add htmlspecialchars() to all variable output\
    \ by default. For instance, suppose that you define a test variable in an action\
    \ as follows:\n\n```\n$this->test = '<script>alert(document.cookie)</script>';\n\
    ```\n\nWith output escaping turned on, echoing this variable in the template will\
    \ output the escaped data:\n\n```\necho $test;\n=> &lt;script&gt;alert(document.cookie)&lt;/script&gt;\n\
    ```\n\nIn addition, every template has access to an $sf_data variable, which is\
    \ a container object referencing all the escaped variables. So you can also output\
    \ the test variable with the following:\n\n```\necho $sf_data->get('test');\n\
    => &lt;script&gt;alert(document.cookie)&lt;/script&gt;\n```\n\n> The $sf_data\
    \ object implements the Array interface, so instead of using the $sf_data->get('myvariable'),\
    \ you can retrieve escaped values by calling $sf_data['myvariable']. But it is\
    \ not a real array, so functions like print_r() will not work as expected.\n\n\
    $sf_data also gives you access to the unescaped, or raw, data. This is useful\
    \ when a variable stores HTML code meant to be interpreted by the browser, provided\
    \ that you trust this variable. Call the getRaw() method when you need to output\
    \ the raw data."
