- pgno: 182
  md: "# Use options to pass parameters to the form class\n\nA common issue with forms\
    \ is to be able to use application parameters, such as the user's culture. The\
    \ fastest but ugly way is to retrieve the user instance through the sfContext\
    \ instance, using the sfContext::getInstance()->getUser() method. However, this\
    \ solution create a big coupling between the form and the context, making the\
    \ testing and reusability more difficult. To avoid this problem, you can simply\
    \ use option to pass the culture value to the form :\n\n```\n// from an action\n\
    public function executeContact(sfWebRequest $request)\n{\n  $this->form = new\
    \ ContactForm(array(), array('culture' =>\n  $this->getUser()->getCulture()));\n\
    }\n\n// from a unit test\n$form = new ContactForm(array(), array('culture' =>\
    \ 'en'));\n\nclass ContactForm extends sfForm\n{\n  public function configure()\n\
    \  {\n    /* ... */\n    $this->setWidget('country', new\n    sfWidgetFormI18nCountry(array('culture'\
    \ => $this->getOption('culture'))));\n    /* ... */\n  }\n}\n\n```\n\n# Forms\
    \ Based on a Model\n\nForms are the primary way to edit database records in web\
    \ applications. And most forms in symfony applications allow the editing of a\
    \ Model object. But the information necessary to build a form to edit a model\
    \ already exists: it is in the schema. So symfony provides a form generator for\
    \ model objects, that makes the creation of model-editing forms a snap.\n\n> Similar\
    \ features to the ones described below exist for Doctrine.\n\n# Generating Model\
    \ Forms\n\nSymfony can deduce the widget types and the validators to use for a\
    \ model editing form, based on the schema. Take the following schema, for instance\
    \ with the Propel ORM:\n\n```\n// config/schema.yml\npropel:\n  article:\n   \
    \ id:        ~\n    title:     { type: varchar(255), required: true }\n    slug:\
    \      { type: varchar(255), required: true, index: unique }\n    content:   longvarchar\n\
    \    is_published: { type: boolean, required: true }\n\n```"
  merge: -1
  img_proc: true
- pgno: 183
  md: "```\nauthor_id: { type: integer, required: true, foreignTable: author,\nforeignReference:\
    \ id, OnDelete: cascade }\ncreated_at: ~\n\nauthor:\n  id: ~\n  first_name: varchar(20)\n\
    \  last_name: varchar(20)\n  email: { type: varchar(255), required: true, index:\
    \ unique }\n  active: boolean\n```\n\nA form to edit an Article object should\
    \ use a hidden widget for the id, a text widget for the title, a string validator\
    \ for the title, etc. Symfony generates the form for you, provided that you call\
    \ the propel:build-forms task:\n\n```\n// propel\n$ php symfony propel:build-forms\n\
    \n// doctrine\n$ php symfony doctrine:build-forms\n```\n\nFor each table in the\
    \ model, this command creates two files under the lib/form/ directory: a BaseXXXForm\
    \ class, overridden each time you call the propel:build-forms task, and an empty\
    \ XXXForm class, extending the previous one. It is the same system as the Propel\
    \ model classes generation.\n\nThe generated lib/form/base/BaseArticleForm.class.php\
    \ contains the translation into widgets and validators of the columns defined\
    \ for the article table in the schema.yml:\n\n```\nclass BaseArticleForm extends\
    \ BaseFormPropel\n{\n    public function setup()\n    {\n        $this->setWidgets(array(\n\
    \            'id' => new sfWidgetFormInputHidden(),\n            'title' => new\
    \ sfWidgetFormInputText(),\n            'slug' => new sfWidgetFormInputText(),\n\
    \            'content' => new sfWidgetFormTextarea(),\n            'is_published'\
    \ => new sfWidgetFormInputCheckbox(),\n            'author_id' => new sfWidgetFormPropelChoice(array('model'\
    \ =>\n            'Author', 'add_empty' => false)),\n            'created_at'\
    \ => new sfWidgetFormDatetime(),\n        ));\n        $this->setValidators(array(\n\
