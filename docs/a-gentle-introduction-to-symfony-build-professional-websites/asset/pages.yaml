    http://www.askeet.com/user/francois

    ```


    +   - You can change the URL formatting and the action name/parameters independently,
    with a single modification. It means that you can develop first, and format the
    URLs afterwards, without totally messing up your application.

    +   - Even when you reorganize the internals of an application, the URLs can remain
    the same for the outside world. It makes URLs persistent, which is a must because
    it allows bookmarking on dynamic pages.

    +   - Search engines tend to skip dynamic pages (ending with .php, .asp, and so
    on) when they index websites. So you can format URLs to have search engines think
    they are browsing static content, even when they meet a dynamic page, thus resulting
    in better indexing of your application pages.

    +   - It is safer. Any unrecognized URL will be redirected to a page specified
    by the developer, and users cannot browse the web root file structure by testing
    URLs. The actual script name called by the request, as well as its parameters,
    is hidden.


    The correspondence between the URLs presented to the user and the actual script
    name and request parameters is achieved by a routing system, based on patterns
    that can be modified through configuration.


    > How about assets? Fortunately, the URLs of assets (images, style sheets, and
    JavaScript) don''t appear much during browsing, so there is no real need for routing
    for those. In symfony, all assets are located under the web/ directory, and their
    URL matches their location in the file system. However, you can manage dynamic
    assets (handled by actions) by using a generated URL inside the asset helper.
    For instance, to display a dynamically generated image, use image_tag(url_for(''captcha/image?key=''.$key)).


    # How It Works


    Symfony disconnects the external URL and its internal URI. The correspondence
    between the two is made by the routing system. To make things easy, symfony uses
    a syntax for internal URLs very similar to the one of regular URLs. Listing 9-1
    shows an example.


    # Listing 9-1 - External URL and Internal URI


    ```

    Listing 9-4

    // Internal URI syntax

    <module>/<action>[?param1=value1][&param2=value2][&param3=value3]...

    ```'
