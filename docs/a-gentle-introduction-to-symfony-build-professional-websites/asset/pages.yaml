  md: "```\nListing 12-36\nETag: \"1A2Z3E4R5T6Y7U\"\n```\n\nThe user's browser will\
    \ store this signature, and send it again together with the request the next time\
    \ it needs the same page. If the new signature shows that the page didn't change\
    \ since the first request, the server doesn't send the response back. Instead,\
    \ it just sends a 304: Not modified header. It saves CPU time (if gzipping is\
    \ enabled for example) and bandwidth (page transfer) for the server, and time\
    \ (page transfer) for the client. Overall, pages in a cache with an ETag are even\
    \ faster to load than pages in a cache without an ETag.\n\nIn symfony, you enable\
    \ the ETag feature for the whole application in settings.yml. Here is the default\
    \ ETag setting:\n\n```\nListing 12-37\nall:\n  .settings:\n    etag: true\n```\n\
    \nFor actions in a cache with layout, the response is taken directly from the\
    \ cache/ directory, so the process is even faster.\n\n# Adding a Last-Modified\
    \ Header to Avoid Sending Still Valid Content\n\nWhen the server sends the response\
    \ to the browser, it can add a special header to specify when the data contained\
    \ in the page was last changed:\n\n```\nListing 12-38\nLast-Modified: Sat, 23\
    \ Nov 2010 13:27:31 GMT\n```\n\nBrowsers can understand this header and, when\
    \ requesting the page again, add an If-Modified header accordingly:\n\n```\nListing\
    \ 12-39\nIf-Modified-Since: Sat, 23 Nov 2010      13:27:31 GMT\n```\n\nThe server\
    \ can then compare the value kept by the client and the one returned by its application.\
    \ If they match, the server returns a 304: Not modified header, saving bandwidth\
    \ and CPU time, just as with ETags.\n\nIn symfony, you can set the Last-Modified\
    \ response header just as you would for another header. For instance, you can\
    \ use it like this in an action:\n\n```\nListing 12-40\n$this->getResponse()->setHttpHeader('Last-Modified',\n\
    $this->getResponse()->getDate($timestamp));\n```\n\nThis date can be the actual\
    \ date of the last update of the data used in the page, given from your database\
    \ or your file system. The getDate() method of the sfResponse object converts\
    \ a timestamp to a formatted date in the format needed for the Last-Modified header\
    \ (RFC1123).\n\n# Adding Vary Headers to Allow Several Cached Versions of a Page\n\
    \nAnother HTTP 1.1 header is Vary. It defines which parameters a page depends\
    \ on, and is used by browsers and proxies to build cache keys. For example, if\
    \ the content of a page depends on cookies, you can set its Vary header as follows:\n\
    \n```\nListing 12-41\nVary: Cookie\n```\n\nMost often, it is difficult to enable\
    \ caching on actions because the page may vary according to the cookie, the user\
    \ language, or something else. If you don't mind expanding the size of your cache,\
    \ set the Vary header of the response properly. This can be done for the whole"
  merge: -1
  img_proc: true
- pgno: 216
  md: 'application or on a per-action basis, using the cache.yml configuration file
    or the sfResponse related method as follows:


    ```

    $this->getResponse()->addVaryHttpHeader(''Cookie'');

    $this->getResponse()->addVaryHttpHeader(''User-Agent'');

    $this->getResponse()->addVaryHttpHeader(''Accept-Language'');

    ```


    Symfony will store a different version of the page in the cache for each value
    of these parameters. This will increase the size of the cache, but whenever the
    server receives a request matching these headers, the response is taken from the
    cache instead of being processed. This is a great performance tool for pages that
    vary only according to request headers.


    # Adding a Cache-Control Header to Allow Client-Side Caching


    Up to now, even by adding headers, the browser keeps sending requests to the server
    even if it holds a cached version of the page. You can avoid that by adding Cache-Control
    and Expires headers to the response. These headers are disabled by default in
    PHP, but symfony can override this behavior to avoid unnecessary requests to your
    server.


    As usual, you trigger this behavior by calling a method of the sfResponse object.
    In an action, define the maximum time a page should be cached (in seconds):


    ```

    $this->getResponse()->addCacheControlHttpHeader(''max_age=60'');

    ```


    You can also specify under which conditions a page may be cached, so that the
    provider''s cache does not keep a copy of private data (like bank account numbers):


    ```

    $this->getResponse()->addCacheControlHttpHeader(''private=True'');

    ```


    Using Cache-Control HTTP directives, you get the ability to fine-tune the various
    cache mechanisms between your server and the client''s browser. For a detailed
    review of these directives, see the W3C Cache-Control specifications.


    One last header can be set through symfony: the Expires header:


    ```

    $this->getResponse()->setHttpHeader(''Expires'',

    $this->getResponse()->getDate($timestamp));

    ```


    > > The major consequence of turning on the Cache-Control mechanism is that your
    server logs won''t show all the requests issued by the users, but only the ones
    actually received. If the performance gets better, the apparent popularity of
    the site may decrease in the statistics.


    # Summary


    The cache system provides variable performance boosts according to the cache type
    selected. From the best gain to the least, the cache types are as follows:


    +   - Super cache

    +   - Action cache with layout

    +   - Action cache without layout

    +   - Fragment cache in the template


    In addition, partials and components can be cached as well.'
  merge: -1
  img_proc: true
- pgno: 217
  md: 'If changing data in the model or in the session forces you to erase the cache
    for the sake of coherence, you can do it with a fine granularity for optimum performance—erase
    only the elements that have changed, and keep the others.


    Remember to test all the pages where caching is enabled with extra care, as new
    bugs may appear if you cache the wrong elements or if you forget to clear the
    cache when you update the underlying data. A staging environment, dedicated to
    cache testing, is of great use for that purpose.


    Finally, make the best of the HTTP 1.1 protocol with symfony’s advanced cache-tweaking
    features, which will involve the client in the caching task and provide even more
    performance gains.'
