  md: "been called BlogArticle. The accessors and mutators use a camelCase variant\
    \ of the column names, so the getTitle() method retrieves the value of the title\
    \ column.\n\nTo set several fields at one time, you can use the fromArray() method,\
    \ also generated for each object class, as shown in Listing 8-8.\n\n# Listing\
    \ 8-8 - The fromArray() Method Is a Multiple Setter\n\n```\n$article->fromArray(array(\n\
    \    'Title' => 'My first article',\n    'Content' => 'This is my very first article.\\\
    n Hope you enjoy it!',\n));\n```\n\nThe fromArray() method has a second argument\
    \ keyType. You can specify the key type of the array by additionally passing one\
    \ of the class type constants BasePeer::TYPE_PHPNAME, BasePeer::TYPE_STUDLYPHPNAME,\
    \ BasePeer::TYPE_COLNAME, BasePeer::TYPE_FIELDNAME, BasePeer::TYPE_NUM. The default\
    \ key type is the column's PhpName (e.g. 'AuthorId').\n\n# Retrieving Related\
    \ Records\n\nThe blog_article_id column in the blog_comment table implicitly defines\
    \ a foreign key to the blog_article table. Each comment is related to one article,\
    \ and one article can have many comments. The generated classes contain five methods\
    \ translating this relationship in an object-oriented way, as follows:\n\n+  \
    \ - $comment->getArticle(): To get the related Article object\n+   - $comment->getArticleId():\
    \ To get the ID of the related Article object\n+   - $comment->setArticle($article):\
    \ To define the related Article object\n+   - $comment->setArticleId($id): To\
    \ define the related Article object from an ID\n+   - $article->getComments():\
    \ To get the related Comment objects\n\nThe getArticleId() and setArticleId()\
    \ methods show that you can consider the blog_article_id column as a regular column\
    \ and set the relationships by hand, but they are not very interesting. The benefit\
    \ of the object-oriented approach is much more apparent in the three other methods.\
    \ Listing 8-9 shows how to use the generated setters.\n\n# Listing 8-9 - Foreign\
    \ Keys Are Translated into a Special Setter\n\n```\n$comment = new Comment();\n\
    $comment->setAuthor('Steve');\n$comment->setContent('Gee, dude, you rock: best\
    \ article ever!');\n\n// Attach this comment to the previous $article object\n\
    $comment->setArticle($article);\n\n// Alternative syntax\n// Only makes sense\
    \ if the object is already saved in the database\n$comment->setArticleId($article->getId());\n\
    ```\n\nListing 8-10 shows how to use the generated getters. It also demonstrates\
    \ how to chain method calls on model objects.\n\n# Listing 8-10 - Foreign Keys\
    \ Are Translated into Special Getters"
