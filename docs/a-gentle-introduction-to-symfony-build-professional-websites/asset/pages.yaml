- pgno: 257
  md: '# # Building Your Own Generator


    The administration generator use a set of symfony internal components that automate
    the creation of generated actions and templates in the cache, the use of themes,
    and the parsing of templates of templates.


    This means that symfony provides all the tools to build your own generator, which
    can look like the existing ones or be completely different. The generation of
    a module is managed by the generate() method of the sfGeneratorManager class.
    For instance, to generate an administration, symfony calls the following internally:


    ```

    ```php

    $manager = new sfGeneratorManager();

    $data = $manager->generate(''sfPropelGenerator'', $parameters);

    ```

    ```


    If you want to build your own generator, you should look at the API documentation
    of the sfGeneratorManager and the sfGenerator classes, and take as examples the
    sfModelGenerator and sfPropelGenerator classes.


    # # Summary


    To automatically generate your back-end applications, the basis is a well-defined
    schema and object model. The customization of the administration-generated modules
    are to be done mostly through configuration.


    The generator.yml file is the heart of the programming of generated back-ends.
    It allows for the complete customization of content, features, and the look and
    feel of the list, new, and edit views. You can manage field labels, tooltips,
    filters, sort order, page size, input type, foreign relationships, custom interactions,
    and credentials directly in YAML, without a single line of PHP code.


    If the administration generator doesn''t natively support the feature you need,
    the partial fields and the ability to override actions provide complete extensibility.
    Plus, you can reuse your adaptations to the administration generator mechanisms
    thanks to the theme mechanisms.'
  merge: -1
  img_proc: true
- pgno: 258
  md: '# Chapter 15

    Unit And Functional Testing


    Automated tests are one of the greatest advances in programming since object orientation.
    Particularly conducive to developing web applications, they can guarantee the
    quality of an application even if releases are numerous. Symfony provides a variety
    of tools for facilitating automated testing, and these are introduced in this
    chapter.


    # Automated Tests


    Any developer with experience developing web applications is well aware of the
    time it takes to do testing well. Writing test cases, running them, and analyzing
    the results is a tedious job. In addition, the requirements of web applications
    tend to change constantly, which leads to an ongoing stream of releases and a
    continuing need for code refactoring. In this context, new errors are likely to
    regularly crop up.


    That''s why automated tests are a suggested, if not required, part of a successful
    development environment. A set of test cases can guarantee that an application
    actually does what it is supposed to do. Even if the internals are often reworked,
    the automated tests prevent accidental regressions. Additionally, they compel
    developers to write tests in a standardized, rigid format capable of being understood
    by a testing framework.


    Automated tests can sometimes replace developer documentation since they can clearly
    illustrate what an application is supposed to do. A good test suite shows what
    output should be expected for a set of test inputs, and that is a good way to
    explain the purpose of a method.


    The symfony framework applies this principle to itself. The internals of the framework
    are validated by automated tests. These unit and functional tests are not bundled
    with the PEAR package, but you can check them out from the SVN repository or browse
    them online51.


    # Unit and Functional Tests


    Unit tests confirm that a unitary code component provides the correct output for
    a given input. They validate how functions and methods work in every particular
    case. Unit tests deal with one case at a time, so for instance a single method
    may need several unit tests if it works differently in certain situations.


    Functional tests validate not a simple input-to-output conversion, but a complete
    feature. For instance, a cache system can only be validated by a functional test,
    because it involves more than one step: The first time a page is requested, it
    is rendered; the second time, it is taken from the cache. So functional tests
    validate a process and require a scenario. In symfony, you should write functional
    tests for all your actions.'
  merge: -1
  img_proc: true
- pgno: 259
  md: 'For the most complex interactions, these two types may fall short. Ajax interactions,
    for instance, require a web browser to execute JavaScript, so automatically testing
    them requires a special third-party tool. Furthermore, visual effects can only
    be validated by a human.


    If you have an extensive approach to automated testing, you will probably need
    to use a combination of all these methods. As a guideline, remember to keep tests
    simple and readable.


    > Automated tests work by comparing a result with an expected output. In other
    words, they evaluate assertions (expressions like $a == 2). The value of an assertion
    is either true or false, and it determines whether a test passes or fails. The
    word “assertion” is commonly used when dealing with automated testing techniques.


    # Test-Driven Development


    In the test-driven development (TDD) methodology, the tests are written before
    the code. Writing tests first helps you to focus on the tasks a function should
    accomplish before actually developing it. It’s a good practice that other methodologies,
    like Extreme Programming (XP), recommend as well. Plus it takes into account the
    undeniable fact that if you don’t write unit tests first, you never write them.


    For instance, imagine that you must develop a text-stripping function. The function
    removes white spaces at the beginning and at the end of the string, replaces non-alphabetical
    characters by underscores, and transforms all uppercase characters to lowercase
    ones. In test-driven development, you would first think about all the possible
    cases and provide an example input and expected output for each, as shown in Table
    15-1.


    # Table 15-1 - A List of Test Cases for a Text-Stripping Function


    | Input | Expected Output |

    |---|---|

    | " foo " | "foo" |

    | "foo bar" | "foo_bar" |

    | " - )foo: .=bar?" | "_ foo__ bar_" |

    | "FooBar" | "foobar" |

    | "Don''t foo-bar me!" | "don_t_foo_bar_me_" |


    You would write the unit tests, run them, and see that they fail. You would then
    add the necessary code to handle the first test case, run the tests again, see
    that the first one passes, and go on like that. Eventually, when all the test
    cases pass, the function is correct.


    An application built with a test-driven methodology ends up with roughly as much
    test code as actual code. As you don’t want to spend time debugging your tests
    cases, keep them simple.


    > Refactoring a method can create new bugs that didn’t use to appear before. That’s
    why it is also a good practice to run all automated tests before deploying a new
    release of an application in production—this is called regression testing.


    # The Lime Testing Framework


    There are many unit test frameworks in the PHP world, with the most well known
    being PHPUnit. Symfony has its own, called lime. It is based on the Test::More
    Perl library, and is TAP compliant, which means that the result of tests is displayed
    as specified in the Test Anything Protocol, designed for better readability of
    test output.'
  merge: -1
  img_proc: true
- pgno: 260
  md: "Lime provides support for unit testing. It is more lightweight than other PHP\
    \ testing frameworks and has several advantages:\n\n+   - It launches test files\
    \ in a sandbox to avoid strange side effects between each test run. Not all testing\
    \ frameworks guarantee a clean environment for each test.\n+   - Lime tests are\
    \ very readable, and so is the test output. On compatible systems, lime uses color\
    \ output in a smart way to distinguish important information.\n+   - Symfony itself\
    \ uses lime tests for regression testing, so many examples of unit and functional\
    \ tests can be found in the symfony source code.\n+   - The lime core is validated\
    \ by unit tests.\n+   - It is written in PHP, and it is fast, well coded, and\
    \ has no dependence.\n\nThe various tests described next use the lime syntax.\
    \ They work out of the box with any symfony installation.\n\n![](img/0f886a7f4cbcc3939be96e985ca35ff4_260_0.png)\n\
    \n> Unit and functional tests are not supposed to be launched in production. They\
    \ are developer tools, and as such, they should be run in the developer's computer,\
    \ not in the host server.\n\n# Unit Tests\n\nSymfony unit tests are simple PHP\
    \ files ending in `Test.php` and located in the `test/unit/` directory of your\
    \ application. They follow a simple and readable syntax.\n\n# What Do Unit Tests\
    \ Look Like?\n\nListing 15-1 shows a typical set of unit tests for the `strtolower()`\
    \ function. It starts by an instantiation of the `lime_test` object (you don't\
    \ need to worry about the parameters for now). Each unit test is a call to a method\
    \ of the `lime_test` instance. The last parameter of these methods is always an\
    \ optional string that serves as the output.\n\nListing 15-1 - Example Unit Test\
    \ File, in `test/unit/strtolowerTest.php`\n\n```\n<?php\n\ninclude dirname(__FILE__).'/../bootstrap/unit.php';\n\
    \n$t = new lime_test(7);\n\n// strtolower()\n$t->diag('strtolower()');\n$t->isa_ok(strtolower('Foo'),\
