    \ as shown in Listing 8-2.\n\n# Listing 8-2 - Accessors Mask the Data Logic\n\n\
    ```\npublic function getTotal()\n{\n    $total = 0;\n    foreach ($this->getItems()\
    \ as $item)\n    {\n        $total += $item->getPrice() * $item->getQuantity();\n\
    \    }\n\n    return $total;\n}\n```\n\nThere is another important point to consider\
    \ when building data-access procedures: Database vendors use different SQL syntax\
    \ variants. Switching to another database management system (DBMS) forces you\
    \ to rewrite part of the SQL queries that were designed for the previous one.\
    \ If you build your queries using a database-independent syntax, and leave the\
    \ actual SQL translation to a third-party component, you can switch database systems\
    \ without pain. This is the goal of the database abstraction layer. It forces\
    \ you to use a specific syntax for queries, and does the dirty job of conforming\
    \ to the DBMS particulars and optimizing the SQL code.\n\nThe main benefit of\
    \ an abstraction layer is portability, because it makes switching to another database\
    \ possible, even in the middle of a project. Suppose that you need to write a\
    \ quick prototype for an application, but the client hasn't decided yet which\
    \ database system would best suit his needs. You can start building your application\
    \ with SQLite, for instance, and switch to MySQL, PostgreSQL, or Oracle when the\
    \ client is ready to decide. Just change one line in a configuration file, and\
    \ it works.\n\nSymfony uses Propel or Doctrine as the ORM, and they use PHP Data\
    \ Objects for database abstraction. These two third-party components, both developed\
    \ by the Propel and Doctrine teams, are seamlessly integrated into symfony, and\
    \ you can consider them as part of the framework. Their syntax and conventions,\
    \ described in this chapter, were adapted so that they differ from the symfony\
    \ ones as little as possible.\n\n> In a symfony project, all the applications\
    \ share the same model. That's the whole point of the project level: regrouping\
    \ applications that rely on common business rules. This is the reason that the\
    \ model is independent from the applications and the model files are stored in\
    \ a lib/model/ directory at the root of the project.\n\n# Symfony's Database Schema\n\
    \nIn order to create the data object model that symfony will use, you need to\
    \ translate whatever relational model your database has to an object data model.\
    \ The ORM needs a description of the relational model to do the mapping, and this\
    \ is called a schema. In a schema, you define the tables, their relations, and\
    \ the characteristics of their columns."
  merge: -1
  img_proc: true
- pgno: 360
  md: "Symfony’s syntax for schemas uses the YAML format. The schema.yml files must\
    \ be located in the myproject/config/ directory.\n\n> Symfony also understands\
    \ the Propel native XML schema format, as described in the “Beyond the schema.yml:\
    \ The schema.xml” section later in this chapter.\n\n# Schema Example\n\nHow do\
    \ you translate a database structure into a schema? An example is the best way\
    \ to understand it. Imagine that you have a blog database with two tables: blog_article\
    \ and blog_comment, with the structure shown in Figure 8-1.\n\n# Figure 8-1 -\
    \ A blog database table structure\n\n![](img/0f886a7f4cbcc3939be96e985ca35ff4_360_0.png)\n\
    \nThe related schema.yml file should look like Listing 8-3.\n\n# Listing 8-3 -\
    \ Sample schema.yml\n\n```\npropel:\n  blog_article:\n    _attributes: { phpName:\
    \ Article }\n    id:\n    title: varchar(255)\n    content: longvarchar\n    created_at:\
    \ ~\n  blog_comment:\n    _attributes: { phpName: Comment }\n    id: ~\n    blog_article_id:\
    \ ~\n    author: varchar(255)\n    content: longvarchar\n    created_at: ~\n```\n\
    \nNotice that the name of the database itself (blog) doesn’t appear in the schema.yml\
    \ file. Instead, the database is described under a connection name (propel in\
    \ this example). This is because the actual connection settings can depend on\
    \ the environment in which your application runs. For instance, when you run your\
    \ application in the development environment, you will access a development database\
    \ (maybe blog_dev), but with the same schema as the production database. The connection\
    \ settings will be specified in the databases.yml file, described in the “Database\
    \ Connections” section later in this chapter. The schema doesn’t contain any detailed\
    \ connection to settings, only a connection name, to maintain database abstraction.\n\
    \n# Basic Schema Syntax\n\nIn a schema.yml file, the first key represents a connection\
    \ name. It can contain several tables, each having a set of columns. According\
    \ to the YAML syntax, the keys end with a colon, and the structure is shown through\
    \ indentation (one or more spaces, but no tabulations)."
  merge: -1
  img_proc: true
- pgno: 361
  md: 'A table can have special attributes, including the phpName (the name of the
    class that will be generated). If you don''t mention a phpName for a table, symfony
    creates it based on the camelCase version of the table name.


    > The camelCase convention removes underscores from words, and capitalizes the
    first letter of inner words. The default camelCase versions of blog_article and
    blog_comment are BlogArticle and BlogComment. The name of this convention comes
    from the appearance of capitals inside a long word, suggestive of the humps of
    a camel.


    A table contains columns. The column value can be defined in three different ways:


    +   If you define nothing (~ in YAML is equivalent to null in PHP), symfony will
    guess the best attributes according to the column name and a few conventions that
    will be described in the “Empty Columns” section later in this chapter. For instance,
    the id column in Listing 8-3 doesn''t need to be defined. Symfony will make it
    an auto-incremented integer, primary key of the table. The blog_article_id in
    the blog_comment table will be understood as a foreign key to the blog_article
    table (columns ending with _id are considered to be foreign keys, and the related
    table is automatically determined according to the first part of the column name).
    Columns called created_at are automatically set to the timestamp type. For all
    these columns, you don''t need to specify any type. This is one of the reasons
    why schema.yml is so easy to write.


    +   If you define only one attribute, it is the column type. Symfony understands
    the usual column types: boolean, integer, float, date, varchar(size), longvarchar
    (converted, for instance, to text in MySQL), and so on. For text content over
    256 characters, you need to use the longvarchar type, which has no size (but cannot
    exceed 65KB in MySQL).


    +   If you need to define other column attributes (like default value, required,
    and so on), you should write the column attributes as a set of key: value. This
    extended schema syntax is described later in the chapter.


    Columns can also have a phpName attribute, which is the capitalized version of
    the name (Id, Title, Content, and so on) and doesn''t need overriding in most
    cases.


    Tables can also contain explicit foreign keys and indexes, as well as a few database-specific
    structure definitions. Refer to the “Extended Schema Syntax” section later in
    this chapter to learn more.


    # Model Classes


    The schema is used to build the model classes of the ORM layer. To save execution
    time, these classes are generated with a command-line task called propel:build-model.


    ```

    Listing A-4

    $ php symfony propel:build-model

    ```


    > After building your model, you must remember to clear symfony''s internal cache
    with php symfony cc so symfony can find your newly created models.


    Typing this command will launch the analysis of the schema and the generation
    of base data model classes in the lib/model/om/ directory of your project:


    +   • BaseArticle.php

    +   • BaseArticlePeer.php

    +   • BaseComment.php'
  merge: -1
  img_proc: true
- pgno: 362
  md: '+   - BaseCommentPeer.php


    In addition, the actual data model classes will be created in lib/model/:


    +   - Article.php

    +   - ArticlePeer.php

    +   - Comment.php

    +   - CommentPeer.php


    You defined only two tables, and you end up with eight files. There is nothing
    wrong, but it deserves some explanation.


    # Base and Custom Classes


    Why keep two versions of the data object model in two different directories?


    You will probably need to add custom methods and properties to the model objects
    (think about the getName() method in Listing 8-1). But as your project develops,
    you will also add tables or columns. Whenever you change the schema.yml file,
    you need to regenerate the object model classes by making a new call to propel:build-model.
    If your custom methods were written in the classes actually generated, they would
    be erased after each generation.


    The Base classes kept in the lib/model/om/ directory are the ones directly generated
    from the schema. You should never modify them, since every new build of the model
    will completely erase these files.


    On the other hand, the custom object classes, kept in the lib/model/ directory,
    actually inherit from the Base ones. When the propel:build-model task is called
    on an existing model, these classes are not modified. So this is where you can
    add custom methods.


    Listing 8-4 presents an example of a custom model class as created by the first
    call to the propel:build-model task.


    ```

    Listing 8-4 - Sample Model Class File, in lib/model/Article.php


    class Article extends BaseArticle

    {

    }

    ```


    It inherits all the methods of the BaseArticle class, but a modification in the
    schema will not affect it.


    The mechanism of custom classes extending base classes allows you to start coding,
    even without knowing the final relational model of your database. The related
    file structure makes the model both customizable and evolutionary.


    # Object and Peer Classes


    Article and Comment are object classes that represent a record in the database.
    They give access to the columns of a record and to related records. This means
    that you will be able to know the title of an article by calling a method of an
    Article object, as in the example shown in Listing 8-5.


    ```

    Listing 8-5 - Getters for Record Columns Are Available in the Object Class


    $article = new Article();

    // ...

    $title = $article->getTitle();

    ```


    ArticlePeer and CommentPeer are peer classes; that is, classes that contain static
    methods to operate on the tables. They provide a way to retrieve records from
    the tables.'
