    # Optimize your queries with Doctrine


    Doctrine comes with its own query language called DQL, for Doctrine Query Language.
    The syntax is very similar to the SQL one, but allows to retrieve objects instead
    of result set rows. In SQL, you will want to return the columns of the table article
    and author in the same query. With the DQL, the solution is quite easy as the
    only things to do is to add a join statement to the original query, and Doctrine
    will hydrate your objects instances accordingly. The following code shows how
    to make a join between the two tables:


    ```

