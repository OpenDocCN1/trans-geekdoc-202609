    # Special Testing Needs


    The unit and functional test tools provided by symfony should suffice in most
    cases. A few additional techniques are listed here to resolve common problems
    in automated testing: launching tests in an isolated environment, accessing a
    database within tests, testing the cache, and testing interactions on the client
    side.


    # Executing Tests in a Test Harness


    The test:unit and test:functional tasks can launch a single test or a set of tests.
    But if you call these tasks without any parameter, they launch all the unit and
    functional tests written in the test/ directory. A particular mechanism is involved
    to isolate each test file in an independent sandbox, to avoid contamination risks
    between tests. Furthermore, as it wouldn''t make sense to keep the same output
    as with single test files in that case (the output would be thousands of lines
    long), the tests results are compacted into a synthetic view. That''s why the
    execution of a large number of test files uses a test harness, that is, an automated
    test framework with special abilities. A test harness relies on a component of
    the lime framework called lime_harness. It shows a test status file by file, and
    an overview at the end of the number of tests passed over the total, as you see
    in Listing 15-33.


    # Listing 15-33 - Launching All Tests in a Test Harness


    ```

    $ php symfony test:all

    unit/myFunctionTest.php............ok

    unit/mySecondFunctionTest.php......ok

    unit/foo/barTest.php.............not ok


    Failed Test                                                Stat Total   Fail  List
    of Failed

    ------------------------------------------------------------------

    unit/foo/barTest.php                                          0     2     2  62
    63

    Failed 1/3 test scripts, 66.66% okay. 2/53 subtests failed, 96.22% okay.

    ```'
