- pgno: 312
  md: 'the administration generator or a combination of JavaScript files and helpers
    to automate your favorite visual effect, just copying the files is not the best
    solution.


    Plug-ins offer a way to package code disseminated in several files and to reuse
    this code across several projects. Into a plug-in, you can package classes, filters,
    event listeners, helpers, configuration, tasks, modules, schemas and model extensions,
    fixtures, web assets, etc. Plug-ins are easy to install, upgrade, and uninstall.
    They can be distributed as a .tgz archive, a PEAR package, or a simple checkout
    of a code repository. The PEAR packaged plug-ins have the advantage of managing
    dependencies, being easier to upgrade and automatically discovered. The symfony
    loading mechanisms take plug-ins into account, and the features offered by a plug-in
    are available in the project as if the plug-in code was part of the framework.


    So, basically, a plug-in is a packaged extension for a symfony project. With plug-ins,
    not only can you reuse your own code across applications, but you can also reuse
    developments made by other contributors and add third-party extensions to the
    symfony core.


    # # Finding Symfony Plug-Ins


    The symfony project website contains a section dedicated to symfony plug-ins and
    accessible with the following URL:


    http://www.symfony-project.org/plugins/


    Each plug-in listed there has its own page, with detailed installation instructions
    and documentation.


    Some of these plug-ins are contributions from the community, and some come from
    the core symfony developers. Among the latter, you will find the following:


    +   - sfFeed2Plugin: Automates the manipulation of RSS and Atom feeds

    +   - sfThumbnailPlugin: Creates thumbnails—for instance, for uploaded images

    +   - sfMediaLibraryPlugin: Allows media upload and management, including an extension
    for rich text editors to allow authoring of images inside rich text

    +   - sfGuardPlugin: Provides authentication, authorization, and other user management
    features above the standard security feature of symfony

    +   - sfSuperCachePlugin: Writes pages in cache directory under the web root to
    allow the web server to serve them as fast as possible

    +   - sfErrorLoggerPlugin: Logs every 404 and 500 error in a database and provides
    an administration module to browse these errors

    +   - sfSslRequirementPlugin: Provides SSL encryption support for actions


    You should regularly check out the symfony plugin section, because new plug-ins
    are added all the time, and they bring very useful shortcuts to many aspects of
    web application programming.


    Apart from the symfony plugin section, the other ways to distribute plug-ins are
    to propose a plug-ins archive for download, to host them in a PEAR channel, or
    to store them in a public version control repository.


    # # Installing a Plug-In


    The plug-in installation process differs according to the way it''s packaged.
    Always refer to the included README file and/or installation instructions on the
    plug-in download page.


    Plug-ins are installed applications on a per-project basis. All the methods described
    in the following sections result in putting all the files of a plug-in into a
    myproject/plugins/ pluginName/ directory.'
