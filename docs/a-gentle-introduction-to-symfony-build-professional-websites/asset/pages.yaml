  img_proc: true
- pgno: 226
  md: "```\n<?xml version=\"1.0\" encoding=\"UTF-8\" ?>\n<!DOCTYPE xliff PUBLIC \"\
    -//XLIFF//DTD XLIFF//EN\"\n\"http://www.oasis-open.org/committees/xliff/documents/xliff.dtd\"\
    \ >\n<xliff version=\"1.0\">\n<file original=\"global\" source-language=\"en_US\"\
    \ datatype=\"plaintext\">\n    <body>\n        <trans-unit id=\"1\">\n       \
    \     <source>Welcome to our website.</source>\n            <target>Bienvenue\
    \ sur notre site web.</target>\n        </trans-unit>\n        <trans-unit id=\"\
    2\">\n            <source>Today's date is </source>\n            <target>La date\
    \ d'aujourd'hui est </target>\n        </trans-unit>\n    </body>\n</file>\n</xliff>\n\
    ```\n\nThe source-language attribute must always contain the full ISO code of\
    \ your default culture. Each translation is written in a trans-unit tag with a\
    \ unique id attribute.\n\nWith the default user culture (set to en_US), the phrases\
    \ are not translated and the raw arguments of the __() calls are displayed. The\
    \ result of Listing 13-12 is then similar to Listing 13-11. However, if the culture\
    \ is changed to fr_FR or fr_BE, the translations from the messages.fr.xml file\
    \ are displayed instead, and the result looks like Listing 13-15.\n\n# Listing\
    \ 13-15 - A Translated Template\n\n```\nBienvenue sur notre site web. La date\
    \ d'aujourd'hui est\n<?php echo format_date(date()) ?>\n```\n\nIf additional translations\
    \ need to be done, simply add a new messages.XX.xml translation file in the same\
    \ directory.\n\n> As looking for dictionary files, parsing them, and finding the\
    \ correct translation for a given string takes some time, symfony uses an internal\
    \ cache to speedup the process. By default, this cache uses the filesystem. You\
    \ can configure how the i18N cache works (for instance, to share the cache between\
    \ several servers) in the factories.yml (see Chapter 19).\n\n# Managing Dictionaries\n\
    \nIf your messages.XX.xml file becomes too long to be readable, you can always\
    \ split the translations into several dictionary files, named by theme. For instance,\
    \ you can split the messages.fr.xml file into these three files in the application\
    \ i18n/ directory:\n\n+   - navigation.fr.xml\n+   - terms_of_service.fr.xml\n\
    +   - search.fr.xml\n\nNote that as soon as a translation is not to be found in\
    \ the default messages.XX.xml file, you must declare which dictionary is to be\
    \ used each time you call the __() helper, using its third argument. For instance,\
    \ to output a string that is translated in the navigation.fr.xml dictionary, write\
    \ this:\n\n```\n<?php echo __('Welcome to our website', null, 'navigation') ?>\n\
    ```"
