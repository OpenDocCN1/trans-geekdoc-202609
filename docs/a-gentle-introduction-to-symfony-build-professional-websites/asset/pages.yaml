    In YAML, structure is shown through indentation, sequence items are denoted by
    a dash, and key/value pairs within a map are separated by a colon. YAML also has
    a shorthand syntax to describe the same structure with fewer lines, where arrays
    are explicitly shown with [] and hashes with {}. Therefore, the previous YAML
    data can be written in a shorter way, as follows:


    ```

    Listing 1-6

    house:

    family: { name: Doe, parents: [John, Jane], children: [Paul, Mark,

    Simone] }

    address: { number: 34, street: Main Street, city: Nowheretown, zipcode:

    "12345" }

    ```


    YAML is an acronym for “YAML Ain’t Markup Language” and pronounced “yaml”. The
    format has been around since 2001, and YAML parsers exist for a large variety
    of languages.


    > The specifications of the YAML format are available at http://www.yaml.org/16.


    As you can see, YAML is much faster to write than XML (no more closing tags or
    explicit quotes), and it is more powerful than .ini files (which don''t support
    hierarchy). That is why symfony uses YAML as the preferred language to store configuration.
    You will see a lot of YAML files in this book, but it is so straightforward that
    you probably don''t need to learn more about it.


    # Summary


    Symfony is a PHP web application framework. It adds a new layer on top of the
    PHP language, providing tools that speed up the development of complex web applications.
    This book will tell you all about it, and you just need to be familiar with the
    basic concepts of modern programming to understand it—namely object-oriented programming
    (OOP), object-relational mapping (ORM), and rapid application development (RAD).
    The only required technical background is knowledge of PHP.'
