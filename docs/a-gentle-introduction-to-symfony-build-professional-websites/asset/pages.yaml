- pgno: 247
  md: "![](img/0f886a7f4cbcc3939be96e985ca35ff4_247_0.png)\n\nThe filters displayed\
    \ by symfony depend on the column type defined in the schema, and can be customized\
    \ in the filter form class:\n\n+   - For text columns (like the author field in\
    \ the comment module), the filter is a text input allowing text-based search (wildcards\
    \ are automatically added).\n+   - For foreign keys (like the blog_article_id\
    \ field in the comment module), the filter is a drop-down list of the records\
    \ of the related table. By default, the options of the drop-down list are the\
    \ ones returned by the __toString() method of the related class.\n+   - For date\
    \ columns (like the created_at field in the comment module), the filter is a pair\
    \ of rich date tags, allowing the selection of a time interval.\n+   - For Boolean\
    \ columns, the filter is a drop-down list having true, false, and true or false\
    \ options—the last value reinitializes the filter.\n\nJust like the new and edit\
    \ views are tied to a form class, the filters use the default filter form class\
    \ associated with the model (BlogArticleFormFilter for the BlogArticle model for\
    \ example). By defining a custom class for the filter form, you can customize\
    \ the filter fields by leveraging the power of the form framework and by using\
    \ all the available filter widgets. It is as easy as defining a class under the\
    \ filter entry as shown in Listing 14-22.\n\n# Listing 14-22 - Customizing the\
    \ Form Class used for Filtering\n\n```\nconfig:\n  filter:\n    class: BackendArticleFormFilter\n\
    ```\n\n> To disable filters altogether, you can just specify false as the class\
    \ to use for the filters.\n\nYou can also use partial filters to implement custom\
    \ filter logic. Each partial receives the form and the HTML attributes to use\
    \ when rendering the form element. Listing 14-23 shows an example implementation\
    \ that mimics the default behavior but with a partial.\n\n# Listing 14-23 - Using\
    \ a Partial Filter\n\n```\n// Define the partial, in templates/_state.php\n<?php\
    \ echo $form['name']->render($attributes->getRawValue()) ?>\n\n// Add the partial\
    \ filter in the filter list, in config/generator.yml\nconfig:\n  filter: [created_at,\
    \ _state]\n```"
