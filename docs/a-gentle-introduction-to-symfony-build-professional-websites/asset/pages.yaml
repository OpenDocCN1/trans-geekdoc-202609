  md: 'If executeUpdate() were empty, Listing 4-12 shows how the updateSuccess.php
    template would retrieve the same name parameter.


    # Listing 4-12 - Getting Data from the Request Parameter Directly in the Template


    ```

    <p>Hello, <?php echo $sf_params->get(''name'') ?>!</p>

    ```


    > Why not use the $ POST, $ GET, or $ REQUEST variables instead? Because then
    your URLs will be formatted differently (as in http://localhost/articles/europe/france/finance.html,
    without ? nor =), the usual PHP variables won''t work anymore, and only the routing
    system will be able to retrieve the request parameters. And you may want to add
    input filtering to prevent malicious code injection, which is only possible if
    you keep all request parameters in one clean parameter holder.


    The $sf_params object is more powerful than just giving a getter equivalent to
    an array. For instance, if you only want to test the existence of a request parameter,
    you can simply use the $sf_params->has() method instead of testing the actual
    value with get(), as in Listing 4-13.


    # Listing 4-13 - Testing the Existence of a Request Parameter in the Template


    ```

    <?php if ($sf_params->has(''name'')): ?>

    <p>Hello, <?php echo $sf_params->get(''name'') ?>!</p>

    <?php else: ?>

    <p>Hello, John Doe!</p>

    <?php endif; ?>

    ```


    You may have already guessed that this can be written in a single line. As with
    most getter methods in symfony, both the $request->getParameter() method in the
    action and the $sf_params->get() method in the template (which, as a matter of
    fact, calls the same method on the same object) accept a second argument: the
    default value to be used if the request parameter is not present.


    ```

    <p>Hello, <?php echo $sf_params->get(''name'', ''John Doe'') ?>!</p>

    ```


    # Summary


    In symfony, pages are composed of an action (a method in the actions/actions.class.php
    file prefixed with execute) and a template (a file in the templates/ directory,
    usually ending with Success.php). They are grouped in modules, according to their
    function in the application. Writing templates is facilitated by helpers, which
    are functions provided by symfony that return HTML code. And you need to think
    of the URL as a part of the response, which can be formatted as needed, so you
    should refrain from using any direct reference to the URL in action naming or
    request parameter retrieval.


    Once you know these basic principles, you can already write a whole web application
    with symfony. But it would take you way too long, since almost every task you
    will have to achieve during the course of the application development is facilitated
    one way or another by some symfony feature... which is why the book doesn''t stop
    now.'
