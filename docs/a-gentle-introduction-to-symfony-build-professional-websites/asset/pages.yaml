    # Caching an Action


    Actions displaying static information (not depending on database or session-dependent
    data) or actions reading information from a database but without modifying it
    (typically, GET requests) are often ideal for caching. Figure 12-1 shows which
    elements of the page are cached in this case: either the action result (its template)
    or the action result together with the layout.


    # Figure 12-1 - Caching an action


    ![](img/0f886a7f4cbcc3939be96e985ca35ff4_201_0.png)


    For instance, consider a user/list action that returns the list of all users of
    a website. Unless a user is modified, added, or removed (and this matter will
    be discussed later in the “Removing Items from the Cache” section), this list
    always displays the same information, so it is a good candidate for caching.


    Cache activation and settings, action by action, are defined in a cache.yml file
    located in the module config/ directory. See Listing 12-2 for an example.


    # Listing 12-2 - Activating the Cache for an Action, in frontend/modules/user/config/cache.yml


    ```

    list:

    enabled: true

    with_layout: false # Default value

    lifetime: 86400 # Default value

    ```


    This configuration stipulates that the cache is on for the list action, and that
    the layout will not be cached with the action (which is the default behavior).
    It means that even if a cached version of the action exists, the layout (together
    with its partials and components) is still executed. If the with_layout setting
    is set to true, the layout is cached with the action and not executed again.


    To test the cache settings, call the action in the development environment from
    your browser.


    # Listing 12-3


    ```

    http://myapp.example.com/frontend_dev.php/user/list

    ```


    You will notice a border around the action area in the page. The first time, the
    area has a blue header, showing that it did not come from the cache. Refresh the
    page, and the action area will have a yellow header, showing that it did come
    from the cache (with a notable boost in response time). You will learn more about
    the ways to test and monitor caching later in this chapter.'
