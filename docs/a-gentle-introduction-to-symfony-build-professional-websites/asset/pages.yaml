  md: "```\npublic function getComments()\n{\n    $q = Doctrine_Core::getTable('Comment')\n\
    \        ->createQuery('c')\n        ->where('c.article_id = ?', $this->getId())\n\
    \        ->orderBy('c.created_at ASC');\n\n    return $q->execute();\n}\n```\n\
    \n# Using Model Behaviors\n\nSome model modifications are generic and can be reused.\
    \ For instance, methods to make a model object sortable and an optimistic lock\
    \ to prevent conflicts between concurrent object saving are generic extensions\
    \ that can be added to many classes.\n\nSymfony packages these extensions into\
    \ behaviors. Behaviors are external classes that provide additional methods to\
    \ model classes. The model classes already contain hooks, and symfony knows how\
    \ to extend them.\n\nTo enable behaviors in your model classes, you must modify\
    \ your schema and use the actAs option:\n\n```\nArticle:\n  actAs: [Timestampable,\
    \ Sluggable]\n  tableName: blog_article\n  columns:\n    id:\n      type: integer\n\
    \      primary: true\n      autoincrement: true\n    title: string(255)\n    content:\
    \ clob\n```\n\nAfter rebuilding the model, the Article model have a slug column\
    \ that is automatically set to a url friendly string based on the title.\n\nSome\
    \ behaviors that come with Doctrine are:\n\n+   - Timestampable\n+   - Sluggable\n\
    +   - SoftDelete\n+   - Searchable\n+   - I18n\n+   - Versionable\n+   - NestedSet\n\
    \n# Extended Schema Syntax\n\nA schema.yml file can be simple, as shown in Listing\
    \ 8-3. But relational models are often complex. That's why the schema has an extensive\
    \ syntax able to handle almost every case.\n\n# Attributes\n\nConnections and\
    \ tables can have specific attributes, as shown in Listing 8-24. They are set\
    \ under an _attributes key."
