- pgno: 212
  md: 'an application interprets the subdomain as a request parameter (like http://php.askeet.com
    and http://life.askeet.com). If you don''t set the last two parameters, symfony
    will remove the cache for the current host and for the all vary header. Alternatively,
    if you want to remove the cache for another host, call remove() as follows:


    ```

    $cacheManager->remove(''user/show?id=''*'');

    // Remove records for the current host and all users

    $cacheManager->remove(''user/show?id=''*'', ''life.askeet.com''); // Remove

    records for the host life.askeet.com and all users

    $cacheManager->remove(''user/show?id=''*'', ''*''); // Remove

    records for every host and all users

    ```


    The remove() method works in all the caching strategies that you can define in
    the factories.yml (not only sfFileCache, but also sfAPCCache, sfEAcceleratorCache,
    sfMemcacheCache, sfSQLiteCache, and sfXCacheCache).


    # Clearing cache across applications


    Clearing the cache across applications can be a problem. For instance, if an administrator
    modifies a record in the user table in a backend application, all the actions
    depending on this user in the frontend application need to be cleared from the
    cache. But the view cache manager available in the backend application doesn''t
    know the frontend application routing rules (applications are isolated from each
    other). So you can''t write this code in the backend:


    ```

    $cacheManager = sfContext::getInstance()->getViewCacheManager(); //

    Retrieves the view cache manager of the backend

    $cacheManager->remove(''user/show?id=12''); // The

    pattern is not found, since the template is cached in the frontend

    ```


    The solution is to initialize a sfCache object by hand, with the same settings
    as the frontend cache manager. Fortunately, all cache classes in symfony provide
    a removePattern method providing the same service as the view cache manager''s
    remove.


    For instance, if the backend application needs to clear the cache of the user/show
    action in the frontend application for the user of id 12, it can use the following:


    ```

    $frontend_cache_dir =

    sfConfig::get(''sf_cache_dir'').DIRECTORY_SEPARATOR.''frontend''.

    DIRECTORY_SEPARATOR.sfConfig::get(''sf_environment'').DIRECTORY_SEPARATOR.''template'';

    $cache = new sfFileCache(array(''cache_dir'' => $frontend_cache_dir)); //

    Use the same settings as the ones defined in the frontend factories.yml

    $cache->removePattern(''user/show?id=12'');

    ```


    For different caching strategies, you just need to change the cache object initialization,
    but the cache removal process remains the same:


    ```

    $cache = new sfMemcacheCache(array(''prefix'' => ''frontend''));

    $cache->removePattern(''user/show?id=12'');

    ```


    # Testing and Monitoring Caching


    HTML caching, if not properly handled, can create incoherence in displayed data.
    Each time you disable the cache for an element, you should test it thoroughly
    and monitor the execution boost to tweak it.'
