    \nThe configuration files can heavily modify the way the framework works. Because\
    \ symfony relies on configuration even for its core features and file loading,\
    \ it can adapt to many more environments than just the standard dedicated host.\
    \ This great configurability is one of the main strengths of symfony. Even if\
