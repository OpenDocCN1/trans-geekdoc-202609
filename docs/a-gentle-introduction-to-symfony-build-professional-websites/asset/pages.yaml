- pgno: 281
  md: 'add assert-type tests by right-clicking in the browser window and selecting
    the appropriate check under Append Selenium Command in the pop-up menu.


    You can save the test to an HTML file to build a test suite for your application.
    The Firefox extension even allows you to run the Selenium tests that you have
    recorded with it.


    > Don''t forget to reinitialize the test data before launching the Selenium test.


    # Summary


    Automated tests include unit tests to validate methods or functions and functional
    tests to validate features. Symfony relies on the lime testing framework for unit
    tests and provides the sfBrowser and sfTestFunctional classes especially for functional
    tests. They provide many assertion methods, from basic to the most advanced, like
    CSS selectors. Use the symfony command line to launch tests, either one by one
    (with the test:unit and test:functional tasks) or in a test harness (with the
    test:all task). When dealing with data, automated tests use fixtures and stubs,
    and this is easily achieved within symfony unit tests.


    If you make sure to write enough unit tests to cover a large part of your applications
    (maybe using the TDD methodology), you will feel safer when refactoring internals
    or adding new features, and you may even gain some time on the documentation task.'
