    And that is really all you need. This is the exact code required to display the
    very same page as the flat script shown earlier in Listing 2-1. The rest (making
    all the components work together) is handled by symfony. If you count the lines,
    you will see that creating the list of posts in an MVC architecture with symfony
    doesn''t require more time or coding than writing a flat file. Nevertheless, it
    gives you huge advantages, notably clear code organization, reusability, flexibility,
    and much more fun. And as a bonus, you have XHTML conformance, debug capabilities,
    easy configuration, database abstraction, smart URL routing, multiple environments,
    and many more development tools.


    # Symfony Core Classes


    The MVC implementation in symfony uses several classes that you will meet quite
    often in this book:


    +   * sfController is the controller class. It decodes the request and hands it
    to the action.

    +   * sfRequest stores all the request elements (parameters, cookies, headers,
    and so on).

    +   * sfResponse contains the response headers and contents. This is the object
    that will eventually be converted to an HTML response and be sent to the user.

    +   * The context (retrieved by sfContext::getInstance()) stores a reference to
    all the core objects and the current configuration; it is accessible from everywhere.


    You will learn more about these objects in Chapter 6.


    As you can see, all the symfony classes use the sf prefix, as do the symfony core
    variables in the templates. This should avoid name collisions with your own classes
    and variables, and make the core framework classes sociable and easy to recognize.


    > Among the coding standards used in symfony, UpperCamelCase is the standard for
    class and variable naming. Two exceptions exist: core symfony classes start with
    sf, which is lowercase, and variables found in templates use the underscore-separated
    syntax.'
