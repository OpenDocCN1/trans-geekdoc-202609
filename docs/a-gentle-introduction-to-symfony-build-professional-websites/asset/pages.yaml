- pgno: 314
  md: "# Installing Plug-Ins from a Version Control Repository\n\nPlug-ins sometimes\
    \ have their own source code repository for version control. You can install them\
    \ by doing a simple checkout in the plugins/ directory, but this can be problematic\
    \ if your project itself is under version control.\n\nAlternatively, you can declare\
    \ the plug-in as an external dependency so that every update of your project source\
    \ code also updates the plug-in source code. For instance, Subversion stores external\
    \ dependencies in the svn:externals property. So you can add a plug-in by editing\
    \ this property and updating your source code afterwards, as Listing 17-14 demonstrates.\n\
    \n# Listing 17-14 - Installing a Plug-In from a Source Version Repository\n\n\
    ```\n$ cd myproject\n$ svn propedit svn:externals plugins\npluginName  http://svn.example.com/pluginName/trunk\n\
    $ svn up\n$ php symfony plugin:publish-assets\n$ php symfony cc\n```\n\n> If the\
    \ plug-in contains a web/ directory, the symfony plugin:publish-assets command\
    \ has to be run to generate the corresponding symlink under the main web/ folder\
    \ of the project.\n\n# Activating a Plug-In Module\n\nSome plug-ins contain whole\
    \ modules. The only difference between module plug-ins and classical modules is\
    \ that module plug-ins don't appear in the myproject/apps/frontend/modules/ directory\
    \ (to keep them easily upgradeable). They also need to be activated in the settings.yml\
    \ file, as shown in Listing 17-15.\n\n# Listing 17-15 - Activating a Plug-In Module,\
    \ in frontend/config/settings.yml\n\n```\nall:\n  .settings:\n    enabled_modules:\
    \ [default, sfMyPluginModule]\n```\n\nThis is to avoid a situation where the plug-in\
    \ module is mistakenly made available for an application that doesn't require\
