  img_proc: true
- pgno: 170
  md: '# Form Handling With Data Validation


    In practice, there is much more to form submission handling than just getting
    the values entered by the user. For most form submissions, the application controller
    needs to:


    +   1. Check that the data is conform to a set of predefined rules (required fields,
    format of the email, etc.)

    +   2. Optionally transform some of the input data to make it understandable (trim
    whitespaces, convert dates to PHP format, etc)

    +   3. If the data is not valid, display the form again, with error messages where
    applicable

    +   4. If the data is correct, do some stuff and then redirect to another action


    Symfony provides an automatic way to validate the submitted data against a set
    of predefined rules. First, define a set of validators for each field. Second,
    when the form is submitted, “bind” the form object with the user submitted values
    (i.e., retrieve the values submitted by the user and put them in the form). Lastly,
    ask the form to check that the data is valid. The following example shows how
    to check that the value retrieved from the email widget is, indeed, an email address,
    and to check that the message has a minimum size of 4 characters:


    ```

    // in modules/foo/actions/actions.class.php

    public function executeContact($request)

    {

    // Define the form

    $this->form = new sfForm();

    $this->form->setWidgets(array(

    ''name'' => new sfWidgetFormInputText(),

    ''email'' => new sfWidgetFormInput(array(''default'' =>

    ''me@example.com'')),

    ''subject'' => new sfWidgetFormChoice(array(''choices'' => array(''Subject

    A'', ''Subject B'', ''Subject C''))),

    ''message'' => new sfWidgetFormTextarea(),

    ));

    $this->form->setValidators(array(

    ''name'' => new sfValidatorString(),

    ''email'' => new sfValidatorEmail(),

    ''subject'' => new sfValidatorString(),

    ''message'' => new sfValidatorString(array(''min_length'' => 4)))

    ));

    // Deal with the request

    if ($request->isMethod(''post''))

    {

    $this->form->bind(/* user submitted data */);

    if ($this->form->isValid())

    {

    // Handle the form submission

    // ...

    $this->redirect(''foo/bar'');

    }

    }

    }

    ```


    setValidators() uses a similar syntax to the setWidgets() method. sfValidatorEmail
    and sfValidatorString are two of the numerous symfony validator classes, listed
    further in this chapter. Naturally, sfForm also provide a setValidator() method
    to add validators one by one.'
  merge: -1
  img_proc: true
- pgno: 171
  md: 'To put the request data into the form and bind them together, use the sfForm::bind()
    method. A form must be bound with some data to check its validity.


    isValid() checks that all the registered validators pass. If this is the case,
    isValid() returns true, and the action can proceed with the form submission. If
    the form is not valid, then the action terminates with the default sfView::SUCCESS
    and displays the form again. But the form isn''t just displayed with the default
    values, as the first time it was displayed. The form inputs show up filled with
    the data previously entered by the user, and error messages appear wherever the
    validators didn''t pass.


    ![](img/0f886a7f4cbcc3939be96e985ca35ff4_171_0.png)


    > > The validation process doesn''t stop when the form meets an invalid field.
    isValid() processes the whole form data and checks all the fields for errors,
    to avoid displaying new error messages as the user corrects its mistakes and submits
    the form again.


    # # Using Clean Form Data


    In the previous listing, we haven''t defined the request data received by the
    form during the binding process. The problem is that the request contains more
    than just the form data. It also contains headers, cookies, parameters passed
    as GET arguments, and all this might pollute the binding process. A good practice
    is to pass only the form data to the bind() method.


    Fortunately, symfony offers a way to name all form inputs using an array syntax.
    Define the name attribute format width the setNameFormat() method in the action
    when you define the form, as follows:


    ```

    ```php

    // in modules/foo/actions/actions.class.php

    // Define the form

    $this->form->getWidgetSchema()->setNameFormat(''contact[%s]'');

    ```

    ```


    That way, all the generated form inputs render with a name like form[WIDGET_NAME]
    instead of just WIDGET_NAME:'
  merge: -1
  img_proc: true
- pgno: 172
  md: '```

    <label for="contact_name">Name</label>

    <input type="text" name="contact[name]" id="contact_name" />

    ...

    <label for="contact_email">Email</label>

    <input type="text" name="contact[email]" id="contact_email"

    value="me@example.com" />

    ...

    <label for="contact_subject">Subject</label>

    <select name="contact[subject]" id="contact_subject">

    <option value="0">Subject A</option>

    <option value="1">Subject B</option>

    <option value="2">Subject C</option>

    </select>

    ...

    <label for="contact_message">Message</label>

    <textarea rows="4" cols="30" name="contact[message]"

    id="contact_message"></textarea>

    ```


    The action can now retrieve the contact request parameter into a single variable.
    This

    variable contains an array of all the data entered by the user in the form:


    ```

    // in modules/foo/actions/actions.class.php

    // Deal with the request

    if ($request->isMethod(''post''))

    {

    $this->form->bind($request->getParameter(''contact''));

    if ($this->form->isValid())

    {

    // Handle the form submission

    $contact = $this->form->getValues();

    $name = $contact[''name''];

    // Or to get a specific value

    $name = $this->form->getValue(''name'');

    // Do stuff

    // ...

    $this->redirect(''foo/bar'');

    }

    }

    ```


    When the bind() method receives an array of parameters, symfony automatically
    avoid

    injection of additional fields on the client side. This security feature will
    make the form

    validation fail if the array of contact parameters contains a field that is not
    in the original

    form definition.


    You will notice one more difference in the action code above with the one written
    previously.

    The action uses the array of values passed by the form object ($form->getValues())
    rather

    than the one from the request. This is because the validators have the ability
    to filter the

    input and clean it, so it''s always better to rely on the data retrieved from
    the form object (by

    way of getValues() or getValue()) than the data from the request. And for composite

    fields (like date widgets), the data returned by getValues() is already recomposed
    into the

