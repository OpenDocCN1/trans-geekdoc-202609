  md: '# Template Shortcuts


    In templates, a few symfony variables are always available. These shortcuts give
    access to the most commonly needed information in templates, through the core
    symfony objects:


    +   - $sf_context: The whole context object (instance of sfContext)

    +   - $sf_request: The request object (instance of sfRequest)

    +   - $sf_params : The parameters of the request object

    +   - $sf_user : The current user session object (instance of sfUser)


    The previous chapter detailed useful methods of the sfRequest and sfUser objects.
    You can actually call these methods in templates through the $sf_request and $sf_user
    variables. For instance, if the request includes a total parameter, its value
    is available in the template with the following:


    ```

    // Long version

    <?php echo $sf_request->getParameter(''total'') ?>


    // Shorter version

    <?php echo $sf_params->get(''total'') ?>


    // Equivalent to the following action code

    echo $request->getParameter(''total'')

    ```


    # Code Fragments


    You may often need to include some HTML or PHP code in several pages. To avoid
    repeating that code, the PHP include() statement will suffice most of the time.


    For instance, if many of the templates of your application need to use the same
    fragment of code, save it in a file called myFragment.php in the global template
    directory (myproject/apps/frontend/templates/) and include it in your templates
    as follows:


    ```

    <?php include(sfConfig::get(''sf_app_template_dir'').''/myFragment.php'') ?>

    ```


    But this is not a very clean way to package a fragment, mostly because you can
    have different variable names between the fragment and the various templates including
    it. In addition, the symfony cache system (described in Chapter 12) has no way
    to detect an include, so the fragment cannot be cached independently from the
    template. Symfony provides three alternative types of intelligent code fragments
    to replace includes:


    +   - If the logic is lightweight, you will just want to include a template file
    having access to some data you pass to it. For that, you will use a partial.

    +   - If the logic is heavier (for instance, if you need to access the data model
    and/or modify the content according to the session), you will prefer to separate
    the presentation from the logic. For that, you will use a component.

    +   - If the fragment is meant to replace a specific part of the layout, for which
    default content may already exist, you will use a slot.


    The inclusion of these fragments is achieved by helpers of the Partial group.
    These helpers are available from any symfony template, without initial declaration.


    # Partials


    A partial is a reusable chunk of template code. For instance, in a publication
    application, the template code displaying an article is used in the article detail
    page, and also in the list of the'
  merge: -1
  img_proc: true
