  md: "# Avoid Using Temporary Arrays\n\nWhen using Propel, objects are already hydrated,\
    \ so there is no need to prepare a temporary array for the template. Developers\
    \ not used to ORMs usually fall into this trap. They want to prepare an array\
    \ of strings or integers, whereas the template can rely directly on an existing\
    \ array of objects. For instance, imagine that a template displays the list of\
    \ all the titles of the articles present in the database. A developer who doesn't\
    \ use OOP would probably write code similar to what is shown in Listing 18-6.\n\
    \n# Listing 18-6 - Preparing an Array in the Action Is Useless If You Already\
    \ Have One\n\n```\n// In the action\n$articles = ArticlePeer::doSelect(new Criteria());\n\
    $titles = array();\nforeach ($articles as $article)\n{\n    $titles[] = $article->getTitle();\n\
    }\n$this->titles = $titles;\n\n// In the template\n<ul>\n<?php foreach ($titles\
    \ as $title): ?>\n<li><?php echo $title ?></li>\n<?php endforeach; ?>\n</ul>\n\
    ```\n\nThe problem with this code is that the hydrating is already done by the\
    \ doSelect() call (which takes time), making the $titles array superfluous, since\
    \ you can write the same code as in Listing 18-7. So the time spent to build the\
    \ $titles array could be gained to improve the application performance.\n\n# Listing\
    \ 18-7 - Using an Array of Objects Exempts You from Creating a Temporary Array\n\
    \n```\n// In the action\n$this->articles = ArticlePeer::doSelect(new Criteria());\n\
    // With Doctrine\n$this->articles = Doctrine::getTable('Article')->findAll();\n\
    \n// In the template\n<ul>\n<?php foreach ($articles as $article): ?>\n<li><?php\
    \ echo $article->getTitle() ?></li>\n<?php endforeach; ?>\n</ul>\n```\n\nIf you\
    \ feel that you really need to prepare a temporary array because some processing\
    \ is necessary on objects, the right way to do so is to create a new method in\
    \ your model class that directly returns this array. For instance, if you need\
    \ an array of article titles and the number of comments for each article, the\
    \ action and the template should look like Listing 18-8.\n\n# Listing 18-8 - Using\
    \ a Custom Method to Prepare a Temporary Array\n\n```\n// In the action\n$this->articles\
    \ = ArticlePeer::getArticleTitlesWithNbComments();\n```"
