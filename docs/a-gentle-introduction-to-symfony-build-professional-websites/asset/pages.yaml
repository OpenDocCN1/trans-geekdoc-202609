- pgno: 244
  md: "![](img/0f886a7f4cbcc3939be96e985ca35ff4_244_0.png)\n\nIn the list view, tooltips\
    \ are displayed in the column header; in the new, edit, and filter views, they\
    \ appear under the field tag.\n\n# ## Modifying the Date Format\n\nDates can be\
    \ displayed using a custom format as soon as you use the date_format option, as\
    \ demonstrated in Listing 14-18.\n\n# ### Listing 14-18 - Formatting a Date in\
    \ the list View\n\n```\n```yaml\nconfig:\n  list:\n    fields:\n      created_at:\
    \ { label: Published, date_format: dd/MM }\n```\n```\n\nIt takes the same format\
    \ parameter as the format_date() helper described in the previous chapter.\n\n\
    # ## Administration templates are i1N ready\n\nThe admin generated modules are\
    \ made of interface strings (default action names, pagination help messages, ...)\
    \ and custom strings (titles, column labels, help messages, error messages, ...).\n\
    \nTranslations of the interface strings are bundled with symfony for a lot of\
    \ languages. But you can also add your own or override existing ones by creating\
    \ a custom XLIFF file in your i1nN directory for the sf_admin catalogue (apps/frontend/i18n/sf_admin.XX.xml\
    \ where XX is the ISO code of the language).\n\nAll the custom strings found in\
    \ the generated templates are also automatically internationalized (i.e., enclosed\
    \ in a call to the __() helper). This means that you can easily translate a generated\
    \ administration by adding the translations of the phrases in an XLIF file, in\
    \ your apps/frontend/i18n/ directory, as explained in the previous chapter.\n\n\
    You can change the default catalogue used for the custom strings by specifying\
    \ an i18n_catalogue parameter:\n\n```\n```yaml\ngenerator:\n  class: sfPropelGenerator\n\
    \  param:\n    i18n_catalogue: admin\n```\n```\n\n# ## List View-Specific Customization\n\
    \nThe list view can display the details of a record in a tabular way, or with\
    \ all the details stacked in one line. It also contains filters, pagination, and\
    \ sorting features. These features can be altered by configuration, as described\
    \ in the next sections."
