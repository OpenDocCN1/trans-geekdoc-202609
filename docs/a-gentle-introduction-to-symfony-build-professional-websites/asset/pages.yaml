  md: "```\n// Base example\nWelcome to all the <b>new</b> users.<br />\nThere are\
    \ <?php echo count_logged() ?> persons logged.\n```\n\n```\n// Bad way to enable\
    \ text translation\n<?php echo __('Welcome to all the') ?>\n<b><?php echo __('new')\
    \ ?></b><?php echo __('users') ?>.<br />\n<?php echo __('There are') ?>\n<?php\
    \ echo count_logged() ?>\n<?php echo __('persons logged') ?>\n```\n\n```\n// Good\
    \ way to enable text translation\n<?php echo __('<b>Welcome to all the <b>new</b>\
    \ users</b>') ?> <br />\n<?php echo __('There are %1% persons logged', array('%1%'\
    \ =>\ncount_logged())) ?>\n```\n\nIn this example, the token is %1%, but it can\
    \ be anything, since the replacement function used\nby the translation helper\
    \ is strtr().\n\nOne of the common problems with translation is the use of the\
    \ plural form. According to the\nnumber of results, the text changes but not in\
    \ the same way according to the language. For\ninstance, the last sentence in\
    \ Listing 13-16 is not correct if count_logged() returns 0 or 1.\nYou could do\
    \ a test on the return value of this function and choose which sentence to use\n\
    accordingly, but that would represent a lot of code. Additionally, different languages\
    \ have\ndifferent grammar rules, and the declension rules of plural can be quite\
    \ complex. As this\nproblem is very common, symfony provides a helper to deal\
    \ with it, called\nformat_number_choice(). Listing 13-17 demonstrates how to use\
    \ this helper.\n\n# Listing 13-17 - Translating Sentences Depending on the Value\
    \ of Parameters\n\n```\n<?php echo format_number_choice(\n '[0]Nobody is logged|[1]There\
    \ is 1 person logged|[1,+Inf]There are %1%\npersons logged', array('%1%' => count_logged()),\
    \ count_logged()) ?>\n```\n\nThe first argument is the multiple possibilities\
    \ of text. The second argument is the\nreplacement pattern (as with the __() helper)\
    \ and is optional. The third argument is the\nnumber on which the test is made\
    \ to determine which text is taken.\n\nThe message/string choices are separated\
    \ by the pipe (|) character followed by an array of\nacceptable values, using\
    \ the following syntax:\n\n+   * [1,2]: Accepts values between 1 and 2, inclusive\n\
    +   * (1,2): Accepts values between 1 and 2, excluding 1 and 2\n+   * {1,2,3,4}:\
    \ Only values defined in the set are accepted\n+   * [-Inf,0): Accepts values\
    \ greater or equal to negative infinity and strictly less than\n+     0\n+   *\
    \ {n: n % 10 > 1 && n % 10 < 5} pliki: Matches numbers like 2, 3, 4, 22, 23,\n\
    +     24 (useful for languages like Polish or Russian)\n\nAny nonempty combinations\
    \ of the delimiters of square brackets and parentheses are\nacceptable.\n\nThe\
    \ message will need to appear explicitly in the XLIFF file for the translation\
    \ to work\nproperly. Listing 13-18 shows an example.\n\n# Listing 13-18 - XLIFF\
    \ Dictionary for a format_number_choice() Argument\n\n```\n...\n<trans-unit id=\"\
    3\">\n```"
