    \ - Turning Database Features Off, in frontend/config/settings.yml\n\n```\n```yaml\n\
    all:\n  .settings:\n    use_database: false # Database and model features\n```\n\
    ```\n\nAs for the security features (see Chapter 6), you can deactivate them in\
    \ the filters.yml file, as shown in Listing 18-20.\n\n# Listing 18-20 - Turning\
    \ Features Off, in frontend/config/filters.yml\n\n```\n```yaml\nrendering: ~\n\
    security:\n  enabled: false\n\n# generally, you will want to insert your own filters\
    \ here\n\ncache: ~\nexecution: ~\n```\n```\n\nSome features are useful only in\
    \ development, so you should not activate them in production. This is already\
    \ the case by default, since the production environment in symfony is really optimized\
    \ for performance. Among the performance-impacting development features, the debug\
    \ mode is the most severe. As for the symfony logs, the feature is also turned\
    \ off in production by default.\n\nYou may wonder how to get information about\
    \ failed requests in production if logging is disabled, and argue that problems\
    \ arise not only in development. Fortunately, symfony can use the sfErrorLoggerPlugin\
    \ plug-in, which runs in the background in production and logs the details of\
    \ 404 and 500 errors in a database. It is much faster than the file logging feature,\
    \ because the plug-in methods are called only when a request fails, while the\
    \ logging mechanism, once turned on, adds a non-negligible overhead whatever the\
    \ level. Check the installation instructions and manual66.\n\n> Make sure you\
    \ regularly check the server error logs—they also contain very valuable information\
    \ about 404 and 500 errors."
