    **Microsoft Office Clip Art and Media Home Page**

    Microsoft Office Clip Art and Media - Over 140000 clip art graphics, animations,
    photos, and sounds for use in Microsoft Office products.

    office.microsoft.com/clipart/default.aspx?lcl=en-us - 56k - 30 Aug 2006 -

    Cached - Similar pages


    +   - If one URL has to be changed (for instance, if a script name or one of its
    parameters is modified), every link to this URL must be changed as well. It means
    that modifications in the controller structure are heavyweight and expensive,
    which is not ideal in agile development.


    And it could be much worse if symfony didn''t use the front controller paradigm;
    that is, if the application contained many scripts accessible from the Internet,
    in many directories, such as these:


    ```

    http://www.example.com/web/gallery/album.php?name=my%20holidays

    http://www.example.com/web/weblog/public/post/list.php

    http://www.example.com/web/general/content/page.php?name=about%20us

    ```


    In this case, developers would need to match the URL structure with the file structure,
    resulting in a maintenance nightmare when either structure changed.


    # # URLs As Part of the Interface


    The idea behind routing is to consider the URL as part of the interface. The application
    can format a URL to bring information to the user, and the user can use the URL
    to access resources of the application.


    This is possible in symfony applications, because the URL presented to the end
    user is unrelated to the server instruction needed to perform the request. Instead,
    it is related to the resource requested, and it can be formatted freely. For instance,
    symfony can understand the following URL and have it display the same page as
    the first URL shown in this chapter:


    ```

    http://www.example.com/articles/finance/2010/activity-breakdown.html

    ```


    The benefits are immense:


    +   - URLs actually mean something, and they can help the users decide if the
    page behind a link contains what they expect. A link can contain additional details
    about the resource it returns. This is particularly useful for search engine results.
    Additionally, URLs sometimes appear without any mention of the page title (think
    about when you copy a URL in an e-mail message), and in this case, they must mean
    something on their own. See Figure 9-2 for an example of a user-friendly URL.


    +   - The technical implementation is hidden to the users : they do not know which
    script is used, they cannot guess an id or similar parameter: your application
    is less vulnerable to a potential security breach. More, you can totally change
    what happen behind the scene without affecting their experience (they won''t have
    a 404 error or a permanent redirect).


    # *Figure 9-2 - URLs can convey additional information about a page, like the
    publication date*'
