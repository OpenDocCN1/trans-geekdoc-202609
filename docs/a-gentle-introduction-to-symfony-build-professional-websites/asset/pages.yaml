    # Upgrading and Uninstalling Plug-Ins


    To uninstall a PEAR plug-in, call the plugin:uninstall task from the root project
    directory, as shown in Listing 17-17. You must prefix the plug-in name with its
    installation channel if it''s different from the default symfony channel (use
    the plugin:list task to determine this channel).


    # Listing 17-17 - Uninstalling a Plug-In


    ```

    Listing 17-20

    $ cd myproject

    $ php symfony plugin:uninstall sfSuperCachePlugin

    $ php symfony cc

    ```


    To uninstall an archive plug-in or an SVN plug-in, remove manually the plug-in
    files from the project plugins/ and web/ directories, and clear the cache.


    To upgrade a plug-in, either use the plugin:upgrade task (for a PEAR plug-in)
    or do an svn update (if you grabbed the plug-in from a version control repository).
    Archive plug-ins can''t be upgraded easily.


    # Anatomy of a Plug-In


    Plug-ins are written using the PHP language. If you can understand how an application
    is organized, you can understand the structure of the plug-ins.


    # Plug-In File Structure


    A plug-in directory is organized more or less like a project directory. The plug-in
    files have to be in the right directories in order to be loaded automatically
    by symfony when needed. Have a look at the plug-in file structure description
    in Listing 17-18.


    # Listing 17-18 - File Structure of a Plug-In


    ```

    Listing 17-21

    pluginName/

    config/

    routing.yml // Routing config file

    app.yml // Plugin default settings

    *schema.yml // Data schema

    *schema.xml

    config.php // Specific plug-in configuration

    data/

    generator/

    sfPropelAdmin

    */ // Administration generator themes

    template/

    skeleton/

    fixtures/

    *.yml // Fixtures files

    ```'
