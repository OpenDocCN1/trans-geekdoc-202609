- pgno: 246
  md: "![](img/0f886a7f4cbcc3939be96e985ca35ff4_246_0.png)\n\nNotice that a tabular\
    \ layout expects an array of fields under the display key, but a stacked layout\
    \ uses the params key for the HTML code generated for each record. However, the\
    \ display array is still used in a stacked layout to determine which column headers\
    \ are available for the interactive sorting.\n\n# Filtering the Results\n\nIn\
    \ a list view, you can add a set of filter interactions. With these filters, users\
    \ can both display fewer results and get to the ones they want faster. Configure\
    \ the filters under the filter key, with an array of field names. For instance,\
    \ add a filter on the blog_article_id, author, and created_at fields to the comment\
    \ list view, as in Listing 14-21, to display a filter box similar to the one in\
    \ Figure 14-13.\n\nListing 14-21 - Setting the Filters in the list View, in modules/comment/config/generator.yml\n\
    \n```\nconfig:\n  list:\n    layout: stacked\n    params: |\n      %%=content%%\
    \ <br />\n      (sent by %%author%% on %%created_at%% about %%_article_link%%)\n\
    \    display: [created_at, author, content]\n\n  filter:\n    display: [blog_article_id,\
    \ author, created_at]\n```\n\nFigure 14-13 - Filters in the list view of the comment\
    \ module"
  merge: -1
