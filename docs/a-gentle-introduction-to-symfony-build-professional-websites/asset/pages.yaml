  md: "The use of a PHP accelerator (such as APC, XCache, or eAccelerator) is almost\
    \ compulsory for a production server, because it can make PHP run an average 50%\
    \ faster, with no tradeoff. Make sure you install one of the accelerator extensions\
    \ to feel the real speed of PHP.\n\nOn the other hand, make sure you deactivate\
    \ any debug utility, such as the Xdebug or APD extension, in your production server.\n\
    \nYou might be wondering about the overhead caused by the mod_rewrite extension:\
    \ it is negligible. Of course, loading an image with rewriting rules is slower\
    \ than loading an image without, but the slowdown is orders of magnitude below\
    \ the execution of any PHP statement.\n\nWhen one server is not enough, you can\
    \ still add another and use load balancing. As long as the uploads/ directory\
    \ is shared and you use database storage for sessions, a symfony project will\
    \ react seamlessly in a load-balanced architecture.\n\n# # Tweaking the Model\n\
    \nIn symfony, the model layer has the reputation of being the slowest part. If\
    \ benchmarks show that you have to optimize this layer, here are a few possible\
    \ improvements.\n\n# # Optimizing Propel or Doctrine Integration\n\nInitializing\
    \ the model layer (the core ORM classes) takes some time, because of the need\
    \ to load a few classes and construct various objects. However, because of the\
    \ way symfony integrates the both ORMs, these initialization tasks occur only\
    \ when an action actually needs the model—and as late as possible. The ORMs classes\
    \ will be initialized only when an object of your generated model is autoloaded.\
    \ This means pages that don't use the model are not penalized by the model layer.\n\
    \nIf your entire application doesn't require the use of the model layer, you can\
    \ also save the initialization of the sfDatabaseManager by switching the whole\
    \ layer off in your settings.yml:\n\n```\nall:\n  .settings:\n    use_database:\
    \ false\n```\n\n# # Propel enhancements\n\nThe generated model classes (in lib/model/om/)\
    \ are already optimized—they don't contain comments, and they benefit from the\
    \ autoloading system. Relying on autoloading instead of manually including files\
    \ means that classes are loaded only if it is really necessary. So in case one\
    \ model class is not needed, having classes autoloaded will save execution time,\
    \ while the alternative method of using include statements won't. As for the comments,\
    \ they document the use of the generated methods but lengthen the model files—resulting\
    \ in a minor overhead on slow disks. As the generated method names are pretty\
    \ explicit, the comments are turned off by default.\n\nThese two enhancements\
    \ are symfony-specific, but you can revert to the Propel defaults by changing\
    \ two settings in your propel.ini file, as follows:\n\n```\npropel.builder.addIncludes\
    \ = true     # Add include statements in generated classes\n                 \
    \                     # Instead of relying on the\n```"
