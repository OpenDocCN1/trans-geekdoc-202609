  md: "```\nprod:\nlogger:\n  param:\n    level: err\n```\n\nBy default, in all environments\
    \ except the production environment, all the messages are logged (up to the least\
    \ important level, the debug level). In the production environment, logging is\
    \ disabled by default; if you change logging_enabled to true in settings.yml,\
    \ only the most important messages (from crit to emerg) appear in the logs.\n\n\
    You can change the logging level in the factories.yml file for each environment\
    \ to limit the type of logged messages.\n\n> To see if logging is enabled, call\
    \ sfConfig::get('sf_logging_enabled').\n\n# Adding a Log Message\n\nYou can manually\
    \ add a message in the symfony log file from your code by using one of the techniques\
    \ described in Listing 16-5.\n\n# Listing 16-5 - Adding a Custom Log Message\n\
    \n```\n// From an action\n$this->logMessage($message, $level);\n\n// From a template\n\
    <?php use_helper('Debug') ?>\n\n<?php log_message($message, $level) ?>\n```\n\n\
    $level can have the same values as in the log messages.\n\nAlternatively, to write\
    \ a message in the log from anywhere in your application, use the sfLogger methods\
    \ directly, as shown in Listing 16-6. The available methods bear the same names\
    \ as the log levels.\n\n# Listing 16-6 - Adding a Custom Log Message from Anywhere\n\
    \n```\nif (sfConfig::get('sf_logging_enabled'))\n{\n  sfContext::getInstance()->getLogger()->info($message);\n\
    }\n```"
