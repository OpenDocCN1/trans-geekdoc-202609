    \ if (!cache('users')): ?>\n<?php foreach ($users as $user): ?>\n<?php echo $user->getName()\
    \ ?>\n<?php endforeach; ?>\n<?php cache_save() ?>\n<?php endif; ?>\n```\n\nHere's\
    \ how it works:\n\n+   - If a cached version of the fragment named ‘users’ is\
