    public function executeAddComment($request)\n{\n$comment = new BlogComment();\n\
    $comment->setArticleId($request->getParameter('id'));\n$comment->save();\n\n$this->redirect('blog_comment_edit',\
    \ $comment);\n}\n```\n```\n\nBatch actions receive an array of the primary keys\
    \ of the selected records in the ids request parameter.\n\nOne last word about\
    \ actions: If you want to suppress completely the actions for one category, use\
    \ an empty list, as in Listing 14-30.\n\n# Listing 14-30 - Removing All Actions\
    \ in the list View\n\n```\n```yaml\nconfig:\n  list:\n    title: List of Articles\n\
    \    actions: {}\n```\n```\n\n# Form Validation\n\nThe validation is taken care\
    \ of by the form used by the new and edit views automatically. You can customize\
    \ it by editing the corresponding form classes.\n\n# Restricting User Actions\
    \ Using Credentials\n\nFor a given administration module, the available fields\
