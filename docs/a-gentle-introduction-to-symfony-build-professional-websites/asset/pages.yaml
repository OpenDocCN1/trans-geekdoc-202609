- pgno: 248
  md: "# # Sorting the List\n\nIn a list view, the table headers are hyperlinks that\
    \ can be used to reorder the list, as shown in Figure 14-18. These headers are\
    \ displayed both in the tabular and stacked layouts. Clicking these links reloads\
    \ the page with a sort parameter that rearranges the list order accordingly.\n\
    \n# Figure 14-14 - Table headers of the list view are sort controls\n\n![](img/0f886a7f4cbcc3939be96e985ca35ff4_248_0.png)\n\
    \nYou can reuse the syntax to point to a list directly sorted according to a column:\n\
    \n```\n<?php echo link_to('Comment list by date',\n'@blog_comment?sort=created_at&sort_type=desc'\
    \ ) ?>\n```\n\nYou can also define a default sort order for the list view directly\
    \ in the generator.yml\nfile. The syntax follows the example given in Listing\
    \ 14-24.\n\n# Listing 14-24 - Setting a Default Sort Field in the list View\n\n\
    ```\nconfig:\n  list:\n    sort: created_at\n    # Alternative syntax, to specify\
    \ a sort order\n    sort: [created_at, desc]\n```\n\n> Only the fields that correspond\
    \ to an actual column are transformed into sort controls—not\n> the custom or\
    \ partial fields.\n\n# # Customizing the Pagination\n\nThe generated administration\
    \ effectively deals with even large tables, because the list view\nuses pagination\
    \ by default. When the actual number of rows in a table exceeds the number of\n\
    maximum rows per page, pagination controls appear at the bottom of the list. For\
    \ instance,\nFigure 14-19 shows the list of comments with six test comments in\
    \ the table but a limit of five\ncomments displayed per page. Pagination ensures\
    \ a good performance, because only the\ndisplayed rows are effectively retrieved\
    \ from the database, and a good usability, because\neven tables with millions\
    \ of rows can be managed by an administration module.\n\n# Figure 14-15 - Pagination\
    \ controls appear on long lists"
  merge: -1
  img_proc: true
- pgno: 249
  md: "![](img/0f886a7f4cbcc3939be96e985ca35ff4_249_0.png)\n\nYou can customize the\
    \ number of records to be displayed in each page with the max_per_page parameter:\n\
    \n```\nListing 14-34\nconfig:\nlist:\n  max_per_page: 5\n```\n\n# Using a Join\
    \ to Speed Up Page Delivery\n\nBy default, the administration generator uses a\
    \ simple doSelect() to retrieve a list of records. But, if you use related objects\
    \ in the list, the number of database queries required to display the list may\
    \ rapidly increase. For instance, if you want to display the name of the article\
    \ in a list of comments, an additional query is required for each post in the\
    \ list to retrieve the related BlogArticle object. So you may want to force the\
    \ pager to use a doSelectJoinXXX() method to optimize the number of queries. This\
    \ can be specified with the peer_method parameter.\n\n```\nListing 14-35\nconfig:\n\
    list:\n  peer_method: doSelectJoinBlogArticle\n```\n\nChapter 18 explains the\
    \ concept of Join more extensively.\n\n# New and Edit View-Specific Customization\n\
    \nIn a new or edit view, the user can modify the value of each column for a new\
    \ record or a given record. By default, the form used by the admin generator is\
    \ the form associated with the model: BlogArticleForm for the BlogArticle model.\
    \ You can customize the class to use by defining the class under the form entry\
    \ as shown in Listing 14-25.\n\nListing 14-25 - Customizing the Form Class used\
    \ for the new and edit views\n\n```\nListing 14-36\nconfig:\nform:\n  class: BackendBlogArticleForm\n\
    ```"
  merge: -1
  img_proc: true
- pgno: 250
  md: "Using a custom form class allows the customization of all the widgets and validators\
    \ used for\nthe admin generator. The default form class can then be used and customized\
    \ specifically for\nthe frontend application.\n\nYou can also customize the labels,\
    \ help messages, and the layout of the form directly in the\ngenerator.yml configuration\
    \ file as show in Listing 14-26.\n\n# Listing 14-26 - Customizing the Form Display\n\
    \n```\nconfig:\n  form:\n    display:\n      NONE: [article_id]\n      Editable:\
    \ [author, content, created_at]\n    fields:\n      content: { label: body, help:\
    \ \"The content can be in the Markdown\nformat\" }\n```\n\n# Handling Partial\
    \ Fields\n\nPartial fields can be used in the new and edit views just like in\
    \ list views.\n\n# Dealing with Foreign Keys\n\nIf your schema defines table relationships,\
    \ the generated administration modules take\nadvantage of it and offer even more\
    \ automated controls, thus greatly simplifying the\nrelationship management.\n\
    \n# One-to-Many Relationships\n\nThe 1-n table relationships are taken care of\
    \ by the administration generator. As is depicted\nby Figure 14-1 earlier, the\
    \ blog_comment table is related to the blog_article table\nthrough the blog_article_id\
    \ field. If you initiate the module of the BlogComment class\nwith the administration\
    \ generator, the edit view will automatically display the\nblog_article_id as\
    \ a drop-down list showing the IDs of the available records of the\nblog_article\
    \ table (check again Figure 14-9 for an illustration).\n\nThe same goes if you\
    \ need to display the list of comments related to an article in the article\n\
    module (n-1 relationship).\n\n# Many-to-Many Relationships\n\nSymfony also takes\
    \ care of n-n table relationships out of the box, as shown in Figure 14-16.\n\n\
    # Figure 14-16 - Many-to-many relationships\n\n![](img/0f886a7f4cbcc3939be96e985ca35ff4_250_0.png)\n\
    \nBy customizing the widget used to render the relationship, you can tweak the\
    \ rendering of\nthe field (illustrated in Figure 14-17):\n\n# Figure 14-17 - Available\
    \ controls for many-to-many relationships"
  merge: -1
