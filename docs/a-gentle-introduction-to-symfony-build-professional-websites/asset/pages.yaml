    \n# I18n Tables\n\nSymfony supports content internationalization in related tables.\
    \ This means that when you have content subject to internationalization, it is\
    \ stored in two separate tables: one with the invariable columns and another with\
    \ the internationalized columns.\n\nIn a schema.yml file, all that is implied\
    \ when you name a table foobar_i18n. For instance, the schema shown in Listing\
    \ 8-32 will be automatically completed with columns and table attributes to make\
    \ the internationalized content mechanism work. Internally, symfony will understand\
    \ it as if it were written like Listing 8-33. Chapter 13 will tell you more about\
    \ i18n.\n\nListing 8-32 - Implied i18n Mechanism\n\n```\npropel:\n  db_group:\n\
    \    id:         ~\n    created_at: ~\n\n  db_group_i18n:\n    name:       varchar(50)\n\
    ```\n\nListing 8-33 - Explicit i18n Mechanism\n\n```\npropel:\n  db_group:\n \
    \   _attributes: { isI18N: true, i18nTable: db_group_i18n }\n    id:         \
    \ ~\n    created_at:  ~\n\ndb_group_i18n:\n  id:          { type: integer, required:\
    \ true, primaryKey:\n               true,foreignTable: db_group, foreignReference:\
    \ id, onDelete: cascade }\n  culture:     { isCulture: true, type: varchar(7),\
    \ required:\n               true,primaryKey: true }\n  name:        varchar(50)\n\
    ```\n\n# Behaviors\n\nBehaviors are model modifiers provided by plug-ins that\
    \ add new capabilities to your Propel classes. Chapter 17 explains more about\
    \ behaviors. You can define behaviors right in the schema, by listing them for\
    \ each table, together with their parameters, under the _behaviors key. Listing\
    \ 8-34 gives an example by extending the BlogArticle class with the paranoid behavior.\n\
    \nListing 8-34 - Behaviors Declaration\n\n```\npropel:\n  blog_article:\n    title:\
    \       varchar(50)\n```"
