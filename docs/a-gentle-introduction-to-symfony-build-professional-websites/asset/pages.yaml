    \ a Template Fragment\n\nAction caching applies to only a subset of actions. For\
    \ the other actions—those that update data or display session-dependent information\
    \ in the template—there is still room for cache improvement but in a different\
    \ way. Symfony provides a third cache type, which is dedicated to template fragments\
    \ and enabled directly inside the template. In this mode, the action is always\
    \ executed, and the template is split into executed fragments and fragments in\
    \ the cache, as illustrated in Figure 12-3.\n\nFigure 12-3 - Caching a template\
    \ fragment\n\n![](img/0f886a7f4cbcc3939be96e985ca35ff4_204_0.png)\n\n# Fragment\
    \ Cache\n\nFor instance, you may have a list of users that shows a link of the\
    \ last-accessed user, and this information is dynamic. The cache() helper defines\
    \ the parts of a template that are to be put in the cache. See Listing 12-5 for\
    \ details on the syntax.\n\nListing 12-5 - Using the cache() Helper, in frontend/modules/user/templates/listSuccess.php\n\
    \n```\n<!- - Code executed each time - ->\n<?php echo link_to('last accessed user',\
