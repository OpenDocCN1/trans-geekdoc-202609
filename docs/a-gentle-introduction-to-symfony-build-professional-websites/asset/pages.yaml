- pgno: 285
  md: "# Customizing the Logging\n\nSymfony's logging system is very simple, yet it\
    \ is also easy to customize. The only prerequisite is that logger classes must\
    \ extend the sfLogger class, which defines a doLog() method. Symfony calls the\
    \ doLog() method with two parameters: $message (the message to be logged), and\
    \ $priority (the log level).\nThe myLogger class defines a simple logger using\
    \ the PHP error_log function:\n\n```\nclass myLogger extends sfLogger\n{\n protected\
    \ function doLog($message, $priority)\n {\n error_log(sprintf('%s (%s)', $message,\n\
    \ sfLogger::getPriorityName($priority)));\n }\n}\n```\n\nTo create a logger from\
    \ an existing class, you can just implement the sfLoggerInterface interface, which\
    \ defines a log() method. The method takes the same two parameters as the doLog()\
    \ method:\n\n```\nrequire_once('Log.php');\nrequire_once('Log/error_log.php');\n\
    // Define a thin wrapper to implement the interface\n// for the logger we want\
    \ to use with symfony\nclass Log_my_error_log extends Log_error_log implements\
    \ sfLoggerInterface\n{\n}\n```\n\n# Purging and Rotating Log Files\n\nDon't forget\
    \ to periodically purge the log/ directory of your applications, because these\
    \ files have the strange habit of growing by several megabytes in a few days,\
    \ depending, of course, on your traffic. Symfony provides a special log:clear\
    \ task for this purpose, which you can launch regularly by hand or put in a cron\
    \ table. For example, the following command erases the symfony log files:\n\n\
    ```\n$ php symfony log:clear\n```\n\nFor both better performance and security,\
    \ you probably want to store symfony logs in several small files instead of one\
    \ single large file. The ideal storage strategy for log files is to back up and\
    \ empty the main log file regularly, but to keep only a limited number of backups.\
    \ You can enable such a log rotation with a period of 7 days and a history (number\
    \ of backups) of 10, as shown in Listing 16-7. You would work with one active\
    \ log file plus ten backup files containing seven days' worth of history each.\
    \ Whenever the next period of seven days ends, the current active log file goes\
    \ into backup, and the oldest backup is erased.\n\n# *Listing 16-7 - Launching\
    \ Log Rotation*\n\n```\n$ php symfony log:rotate frontend prod --period=7 --history=10\n\
    ```\n\nThe backup log files are stored in the logs/history/ directory and suffixed\
    \ with the date they were saved."
  merge: -1
  img_proc: true
- pgno: 286
  md: '# # Debugging


    No matter how proficient a coder you are, you will eventually make mistakes, even
    if you use symfony. Detecting and understanding errors is one of the keys of fast
    application development. Fortunately, symfony provides several debug tools for
    the developer.


    # ## Symfony Debug Mode


    Symfony has a debug mode that facilitates application development and debugging.
    When it is on, the following happens:


    +   - The configuration is checked at each request, so a change in any of the
    configuration files has an immediate effect, without any need to clear the configuration
    cache.

    +   - The error messages display the full stack trace in a clear and useful way,
    so that you can more efficiently find the faulty element.

    +   - More debug tools are available (such as the detail of database queries).

    +   - The Propel/Doctrine debug mode is also activated, so any error in a call
    to a Propel/Doctrine object will display a detailed chain of calls through the
    Propel/Doctrine architecture.


    On the other hand, when the debug mode is off, processing is handled as follows:


    +   - The YAML configuration files are parsed only once, then transformed into
    PHP files stored in the `cache/config/` folder. Every request after the first
    one ignores the YAML files and uses the cached configuration instead. As a consequence,
    the processing of requests is much faster.

    +   - To allow a reprocessing of the configuration, you must manually clear the
    configuration cache.

    +   - An error during the processing of the request returns a response with code
    500 (Internal Server Error), without any explanation of the internal cause of
    the problem.


    The debug mode is activated per application in the front controller. It is controlled
    by the value of the third argument passed to the `getApplicationConfiguration()`
    method call, as shown in Listing 16-8.


    *Listing 16-8 - Sample Front Controller with Debug Mode On, in web/frontend_dev.php*


    ```

    <?php


    require_once(dirname(__FILE__).''/../config/ProjectConfiguration.class.php'');


    $configuration = ProjectConfiguration::getApplicationConfiguration(''frontend'',
    ''dev'', true);

    sfContext::createInstance($configuration)->dispatch();

    ```


    > > In your production server, you should not activate the debug mode nor leave
    any front controller with debug mode on available. Not only will the debug mode
    slow down the page delivery, but it may also reveal the internals of your application.
    Even though the debug tools never reveal database connection information, the
    stack trace of exceptions is full of dangerous information for any ill-intentioned
    visitor.'
  merge: -1
  img_proc: true
- pgno: 287
  md: '# Symfony Exceptions


    When an exception occurs in the debug mode, symfony displays a useful exception
    notice that contains everything you need to find the cause of the problem.


    The exception messages are clearly written and refer to the most probable cause
    of the problem. They often provide possible solutions to fix the problem, and
    for most common problems, the exception pages even contain a link to a symfony
    website page with more details about the exception. The exception page shows where
    the error occurred in the PHP code (with syntax highlighting), together with the
    full stack of method calls, as shown in Figure 16-1. You can follow the trace
    to the first call that caused the problem. The arguments that were passed to the
    methods are also shown.


    Symfony really relies on PHP exceptions for error reporting. For instance, the
    404 error can be triggered by an sfError404Exception.


    Figure 16-1 - Sample exception message for a symfony application


    ![](img/0f886a7f4cbcc3939be96e985ca35ff4_287_0.png)


    During the development phase, the symfony exceptions will be of great use as you
    debug your application.


    # Xdebug Extension


    The Xdebug PHP extension allows you to extend the amount of information that is
    logged by the web server. Symfony integrates the Xdebug messages in its own debug
    feedback, so it is a good idea to activate this extension when you debug the application.
    The extension installation depends very much on your platform; refer to the Xdebug
    website for detailed


    56. http://xdebug.org/'
  merge: -1
  img_proc: true
- pgno: 288
  md: 'installation guidelines. Once Xdebug is installed, you need to activate it
    manually in your php.ini file after installation. For *nix platforms, this is
    done by adding the following line:


    ```

    zend_extension="/usr/local/lib/php/extensions/no-debug-non-zts-20041030/xdebug.so"

    ```


    For Windows platforms, the Xdebug activation is triggered by this line:


    ```

    extension=php_xdebug.dll

    ```


    Listing 16-9 gives an example of Xdebug configuration, which must also be added
    to the php.ini file.


    # Listing 16-9 - Sample Xdebug Configuration


    ```

    ;xdebug.profiler_enable=1

    ;xdebug.profiler_output_dir="/tmp/xdebug"

    xdebug.auto_trace=1          ; enable tracing

    xdebug.trace_format=0

    ;xdebug.show_mem_delta=0     ; memory difference

    ;xdebug.show_local_vars=1

    ;xdebug.max_nesting_level=100

    ```


    You must restart your web server for the Xdebug mode to be activated.


    > Don''t forget to deactivate Xdebug mode in your production platform. Not doing
    so will slow down the execution of every page a lot.


    # Web Debug Toolbar


    The log files contain interesting information, but they are not very easy to read.
    The most basic task, which is to find the lines logged for a particular request,
    can be quite tricky if you have several users simultaneously using an application
    and a long history of events. That''s when you start to need a web debug toolbar.


    This toolbar appears as a semitransparent box superimposed over the normal content
    in the browser, in the top-right corner of the window, as shown in Figure 16-2.
    It gives access to the symfony log events, the current configuration, the properties
    of the request and response objects, the details of the database queries issued
    by the request, and a chart of processing times related to the request.


    # Figure 16-2 - The web debug toolbar appears in the top-right corner of the window


    ![](img/0f886a7f4cbcc3939be96e985ca35ff4_288_0.png)


    The color of the debug toolbar background depends on the highest level of log
    message issued during the request. If no message passes the debug level, the toolbar
    has a gray background. If a single message reaches the err level, the toolbar
    has a red background.'
