  md: "# Customizing the plug-in schema\n\n# Doctrine\n\nWhen building the model,\
    \ Doctrine will look for all the *schema.yml in application's and plugins' config/\
    \ directories, so a project schema can override a plugin schema. The merging process\
    \ allows for addition or modification of table or columns. For instance, the following\
    \ example shows how to add columns to a table defined in a plugin schema.\n\n\
    ```\n#Original schema, in plugins/myPlugin/config/schema.yml\nArticle:\n  columns:\n\
    \    name: string(50)\n\n#Project schema, in config/schema.yml\nArticle:\n  columns:\n\
    \    stripped_title: string(50)\n\n# Resulting schema, merged internally and used\
    \ for model and sql generation\nArticle:\n  columns:\n    name: string(50)\n \
    \   stripped_title: string(50)\n```\n\n# Propel\n\nWhen building the model, symfony\
    \ will look for custom YAML files for each existing schema, including plug-in\
    \ ones, following this rule:\n\n| Original schema name | Custom schema name |\n\
    | --- | --- |\n| config/schema.yml | schema.custom.yml |\n| config/foobar_schema.yml\
    \ | foobar_schema.custom.yml |\n| plugins/myPlugin/config/schema.yml | myPlugin-schema.custom.yml\
    \ |\n| plugins/myPlugin/config/foo_schema.yml | myPlugin_foo-schema.custom.yml\
    \ |\n\nCustom schemas will be looked for in the application's and plugins' config/\
    \ directories, so a plugin can override another plugin's schema, and there can\
    \ be more than one customization per schema.\n\nSymfony will then merge the two\
    \ schemas based on each table's phpName. The merging process allows for addition\
    \ or modification of tables, columns, and column attibutes. For instance, the\
    \ next listing shows how a custom schema can add columns to a table defined in\
    \ a plug-in schema.\n\n```\n# Original schema, in plugins/myPlugin/config/schema.yml\n\
    propel:\n  article:\n    _attributes:    { phpName: Article }\n    title:    \
    \      varchar(50)\n    user_id:        { type: integer }\n    created_at:\n```"
  merge: -1
