- pgno: 173
  md: "```\n<select id=\"contact_dob_year\" name=\"contact[dob][year]\">...</select>\n\
    // ...result in three request parameters in the action\n$contact = $request->getParameter('contact');\n\
    $month = $contact['dob']['month'];\n$day = $contact['dob']['day'];\n$year = $contact['dob']['year'];\n\
    $dateOfBirth = mktime(0, 0, 0, $month, $day, $year);\n// But if you use getValues(),\
    \ you can retrieve directly a correct date\n$contact = $this->form->getValues();\n\
    $dateOfBirth = $contact['dob'];\n```\n\nSo take the habit to always use an array\
    \ syntax for your form fields (using setNameFormat()) and to always use the clean\
    \ form output (using getValues()).\n\n# Customizing Error Messages Display\n\n\
    Where do the error messages shown in the screenshot above come from? You know\
    \ that a widget is made of four components, and the error message is one of them.\
    \ In fact, the default (table) formatter renders a field row as follows:\n\n```\n\
    Listing 10-27\n<?php if ($field->hasError()): ?>\n<tr>\n<td colspan=\"2\">\n<?php\
    \ echo $field->renderError() ?>        // List of errors\n</td>\n</tr>\n<?php\
    \ endif; ?>\n<tr>\n<th><?php echo $field->renderLabel() ?></th>        // Label\n\
    <td>\n<?php echo $field->render() ?>        // Widget\n<?php if ($field->hasHelp()):\
    \ ?>\n<br /><?php echo $field->renderHelp() ?>        // Help\n<?php endif; ?>\n\
    </td>\n</tr>\n```\n\nUsing any of the methods above, you can customize where and\
    \ how the error messages appear for each field. In addition, you can display a\
    \ global error message on top of the form is if is not valid:\n\n```\nListing\
    \ 10-28\n<?php if ($form->hasErrors()): ?>\nThe form has some errors you need\
    \ to fix.\n<?php endif; ?>\n```\n\n# Customizing Validators\n\nIn a form, all\
    \ fields must have a validator and by default, all the fields are required. If\
    \ you need to set a field optional, pass the required option to the validator\
    \ and set it to false. For instance, the following listing shows how to make the\
    \ name field required and the email field optional:\n\n```\nListing 10-29\n$this->form->setValidators(array(\n\
    \    'name'    => new sfValidatorString(),\n    'email'   => new sfValidatorEmail(array('required'\
    \ => false)),\n    'subject' => new sfValidatorString(),\n```"
  merge: -1
  img_proc: true
- pgno: 174
  md: "```\n'message' => new sfValidatorString(array('min_length' => 4))));\n```\n\
    \nYou can apply more than one validator on a field. For instance, you may want\
    \ to check that the email field satisfies both the sfValidatorEmail and the sfValidatorString\
    \ validators with a minimum size of 4 characters. In such a case, use the sfValidatorAnd\
    \ validator to combine two validators, and pass the two sfValidatorEmail and sfValidatorString\
    \ validators as an argument:\n\n```\n$this->form->setValidators(array(\n  'name'\
    \ => new sfValidatorString(),\n  'email' => new sfValidatorAnd(array(\n    new\
    \ sfValidatorEmail(),\n    new sfValidatorString(array('min_length' => 4)),\n\
    \  ), array('required' => false)),\n  'subject' => new sfValidatorString(),\n\
    \  'message' => new sfValidatorString(array('min_length' => 4))\n));\n\n```\n\n\
    If both validators are valid, then the email field is declared valid. Similarly,\
    \ you can use the sfValidatorOr validator to combine several validators. If one\
    \ of the validators is valid, then the field is declared valid.\n\nEach invalid\
    \ validator results into an error message in the field. These error messages are\
    \ in English but use the symfony internationalization helpers; if your project\
    \ uses other languages, you can easily translate the error messages with an i18n\
    \ dictionary. Alternatively, every validator provides a third argument to customize\
    \ its error messages. Each validator has at least two error messages: the required\
    \ message and the invalid message. Some validators can display error messages\
    \ for a different purpose, and will always support the overriding of the error\
    \ messages through their third argument:\n\n```\n// in modules/foo/actions/actions.class.php\n\
    $this->form->setValidators(array(\n  'name' => new sfValidatorString(),\n  'email'\
    \ => new sfValidatorEmail(array(), array(\n    'required' => 'Please provide an\
    \ email',\n    'invalid' => 'Please provide a valid email address (me@example.com)'\n\
    \  )),\n  'subject' => new sfValidatorString(),\n  'message' => new sfValidatorString(array('min_length'\
    \ => 4), array(\n    'required' => 'Please provide a message',\n    'min_length'\
    \ => 'Please provide a longer message (at least 4 characters)'\n  ))\n));\n\n\
    ```\n\nNaturally, these custom messages will render in the templates through i18n\
    \ helpers, so any multilingual application can also translate custom error messages\
    \ in a dictionary (see Chapter 13 for details).\n\n# # Applying a Validator To\
    \ Several Fields\n\nThe syntax used above to define validators on a form does\
    \ not allow to validate that two fields are valid together. For instance, in a\
    \ registration form, there are often two password fields that must match, otherwise\
    \ the registration is refused. Each password field is not valid on its own, it\
    \ is only valid when associated with the other field."
  merge: -1
  img_proc: true
- pgno: 175
  md: "That's why you can set a ‘multiple’ validator via setPostValidator() to set\
    \ the validators that work on several values. The post validator is executed after\
    \ all other validators and receives an array of cleaned up values. If you need\
    \ to validate raw input form data, use the setPreValidator() method instead.\n\
    \nA typical registration form definition would look like this:\n\n```\n// in modules/foo/actions/actions.class.php\n\
    // Define the form\n$this->form = new sfForm();\n$this->form->setWidgets(array(\n\
    \t'login' => new sfWidgetFormInputText(),\n\t'password1' => new sfWidgetFormInputText(),\n\
    \t'password2' => new sfWidgetFormInputText()\n\t));\n$this->form->setValidators(array(\n\
    \t'login' => new sfValidatorString(), // login is required\n\t'password1' => new\
    \ sfValidatorString(), // password1 is required\n\t'password2' => new sfValidatorString(),\
    \ // password2 is required\n\t));\n$this->form->setPostValidators(new sfValidatorSchemaCompare('password1',\n\
    \t'==', 'password2'));\n\n```\n\nThe sfValidatorSchemaCompare validator is a special\
    \ multiple validator that receives all the cleaned up values and can pick up two\
    \ of them for comparison. Naturally, you can define more than one post validator\
    \ by using the sfValidatorAnd and the sfValidatorOr validators.\n\n# Validators\n\
    \nSymfony offers quite a lot of validators. Remember that each validator accepts\
    \ an array of option and an array of errors as arguments where you can at least\
    \ customize the required and invalid error messages.\n\n```\n// String validator\n\
    $form->setValidator('message', new sfValidatorString(array(\n\t'min_length' =>\
    \ 4,\n\t'max_length' => 50,\n\t),\n\tarray(\n\t'min_length' => 'Please post a\
    \ longer message',\n\t'max_length' => 'Please be less verbose',\n\t)));\n\n//\
    \ Number validator\n$form->setValidator('age', new sfValidatorNumber(array( //\
    \ use\n\t'sfValidatorInteger' instead if you want to force integer values\n\t\
    'min' => 18,\n\t'max' => 99.99,\n\t),\n\tarray(\n\t'min' => 'You must be 18 or\
    \ more to use this service',\n\t'max' => 'Are you kidding me? People over 30 can\\\
    't even use the\n\tInternet',\n\t)));\n\n```"
  merge: -1
  img_proc: true
- pgno: 176
  md: "```\n// Email validator\n$form->setValidator('email', new sfValidatorEmail());\n\
    // URL validator\n$form->setValidator('website', new sfValidatorUrl());\n// Regular\
    \ expression validator\n$form->setValidator('IP', new sfValidatorRegex(array(\n\
    \    'pattern' => '^[0-9]{3}\\\\.[0-9]{3}\\\\.[0-9]{2}\\\\.[0-9]{3}$'\n)));\n\
    ```\n\nEven though some form controls (like drop-down lists, checkboxes, radio\
    \ button groups)\nrestrict the possible choices, a malicious user can always try\
    \ to hack your forms by\nmanipulating the page with Firebug or submitting a query\
    \ with a scripting language.\nConsequently, you should also validate fields that\
    \ only accept a limited array of values:\n\n```\n// Boolean validator\n$form->setValidator('has_signed_terms_of_service',\
    \ new\nsfValidatorBoolean());\n// Choice validator (to restrict values in a list)\n\
    $form->setValidator('subject', new sfValidatorChoice(array(\n    'choices' =>\
    \ array('Subject A', 'Subject B', 'Subject C')\n)));\n// Multiple choice validator\n\
    $form->setValidator('languages', new sfValidatorChoice(array(\n    'multiple'\
    \ => true,\n    'choices' => array('en' => 'English', 'fr' => 'French', 'other')\n\
    )));\n```\n\nI18n choice validators exist for country lists (sfValidatorI18nChoiceCountry)\
    \ and\nlanguage lists (sfValidatorI18nChoiceLanguage). These validators accept\
    \ a restricted\nlist of countries and languages if you want to limit the possible\
    \ options.\n\nThe sfValidatorChoice validator is often used to validate a sfWidgetFormChoice\n\
    widget. And since you can use the sfWidgetFormChoice widget for foreign key columns,\
    \ so\nsymfony also provides a validator to check that the foreign key value exists\
    \ in the foreign\ntable:\n\n```\n// Propel choice validator\n$form->setValidator('section_id',\
    \ new sfValidatorPropelChoice(array(\n    'model' => 'Section',\n    'column'\
    \ => 'name'\n)));\n```\n\n```\n// Doctrine choice validator\n$form->setValidator('section_id',\
    \ new sfValidatorDoctrineChoice(array(\n    'model' => 'Section',\n    'column'\
    \ => 'name'\n)));\n```\n\nAnother useful Model-related validator is the sfValidatorPropelUnique\
    \ validator, which\nchecks that a new value entered via a form doesn't conflict\
    \ with an existing value in a\ndatabase column with a unique index. For instance,\
    \ two users cannot have the same login,\nso when editing a User object with a\
    \ form, you must add a sfValidatorPropelUnique\nvalidator on this column:"
  merge: -1
  img_proc: true
- pgno: 177
  md: "```\nListing 10-36\n// Propel unique validator\n$form->setValidator('nickname',\
    \ new sfValidatorPropelUnique(array(\n  'model' => 'User',\n  'column' => 'login'\n\
    )));\n```\n\n```\n$form->setValidator('nickname', new sfValidatorDoctrineUnique(array(\n\
    \  'model' => 'User',\n  'column' => 'login'\n)));\n```\n\nTo make your forms\
    \ even more secure and avoid Cross-Site Request Forgery attacks, you can enable\
    \ the CSRF protection:\n\n```\nListing 10-37\n// CSRF protection - set the secret\
    \ to a random string that nobody knows\n$form->addCSRFProtection('flkd445rvvrGV34G');\n\
    ```\n\n> You can set the CSRF secret once for the whole site in the settings.yml\
    \ file:\n\n```\nListing 10-38\n# in apps/myapp/config/settings.yml\nall:\n .settings:\n\
    \  # Form security secret (CSRF protection)\n  csrf_secret: ##CSRF_SECRET## #\
    \ Unique secret to enable CSRF\n  protection or false to disable\n```\n\nThe multiple\
    \ validators work with the whole form, rather than a single input. Here is a list\
    \ of available multiple validators:\n\n```\nListing 10-39\n// compare validator\
    \ - compare two fields\n$form->setPostValidator(new sfValidatorSchemaCompare('password1',\
    \ '==',\n 'password2'));\n```\n\n```\n// Extra field validator: looks for fields\
    \ in the request not present in\nthe form\n$form->setOption('allow_extra_fields',\
    \ false);\n$form->setOption('filter_extra_fields', true);\n```\n\n# Alternative\
    \ Ways to Use a Form\n\n# Form Classes\n\nWith all the widget options, validators\
    \ and form parameters, the contact form definition\nwritten in the actions class\
    \ looks quite messy:\n\n```\nListing 10-40\n// in modules/foo/actions/actions.class.php\n\
    // Define the form\n$this->form = new sfForm();\n$this->form->getWidgetSchema()->setNameFormat('contact[%s]');\n\
    $this->form->getWidgetSchema()->setIdFormat('my_form_%s');\n```"
