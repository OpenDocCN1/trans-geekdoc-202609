- pgno: 191
  md: "Note that the project:send-emails task can be run on any machine, not necessarily\
    \ on the machine that created the message. It works because everything is stored\
    \ in the message object, even the file attachments.\n\nThe built-in implementation\
    \ of the queues are very simple. They send emails without any error management,\
    \ like they would have been sent if you have used the realtime strategy. Of course,\
    \ the default queue classes can be extended to implement your own logic and error\
    \ management.\n\nThe project:send-emails task takes two optional options:\n\n\
    +   - message-limit: Limits the number of messages to sent.\n+   - time-limit:\
    \ Limits the time spent to send messages (in seconds).\n\nBoth options can be\
    \ combined:\n\n```\n$ php symfony project:send-emails --message-limit=10 --time-limit=20\n\
    ```\n\nThe above command will stop sending messages when 10 messages are sent\
    \ or after 20 seconds.\n\nEven when using the spool strategy, you might need to\
    \ send a message immediately without storing it in the queue. This is possible\
    \ by using the special sendNextImmediately() method of the mailer:\n\n```\n$this->getMailer()->sendNextImmediately()->send($message);\n\
    ```\n\nIn the previous example, the $message won't be stored in the queue and\
    \ will be sent immediately. As its name implies, the sendNextImmediately() method\
    \ only affects the very next message to be sent.\n\nThe sendNextImmediately()\
    \ method has no special effect when the delivery strategy is not spool.\n\n# The\
    \ none Strategy\n\nThis strategy is useful in the development environment to avoid\
    \ emails to be sent to real users. Messages are still available in the web debug\
    \ toolbar (more information in the section below about the mailer panel of the\
    \ web debug toolbar).\n\nIt is also the best strategy for the test environment,\
    \ where the sfTesterMailer object allows you to introspect the messages without\
    \ the need to actually send them (more information in the section below about\
    \ testing).\n\n# The Mail Transport\n\nMail messages are actually sent by a transport.\
    \ The transport is configured in the factories.yml configuration file, and the\
    \ default configuration uses the SMTP server of the local machine:\n\n```\ntransport:\n\
    \  class: Swift_SmtpTransport\n  param:\n    host:   localhost\n    port:   25\n\
    ```"
