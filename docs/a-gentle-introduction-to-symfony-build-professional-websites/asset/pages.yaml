  md: "# Column Details\n\nThe basic syntax lets you define the type with one of the\
    \ type keywords. Listing 8-26 demonstrates these choices.\n\n# Listing 8-26 -\
    \ Basic Column Attributes\n\n```\nArticle:\ncolumns:\n  title: string(50) # Specify\
    \ the type and length\n```\n\nBut you can define much more for a column. If you\
    \ do, you will need to define column settings as an associative array, as shown\
    \ in Listing 8-27.\n\n# Listing 8-27 - Complex Column Attributes\n\n```\nArticle:\n\
    columns:\n  id:     { type: integer, notnull: true, primary: true,\n         \
    \   autoincrement: true }\n  name:   { type: string(50), default: foobar }\n \
    \ group_id: { type: integer }\n```\n\nThe column parameters are as follows:\n\n\
    +   * type: Column type. The choices are boolean, integer, double, float, decimal,\
    \ string(size), date, time, timestamp, blob, and clob.\n+   * notnull: Boolean.\
    \ Set it to true if you want the column to be required.\n+   * length: The size\
    \ or length of the field for types that support it\n+   * scale: Number of decimal\
    \ places for use with decimal data type (size must also be specified)\n+   * default:\
    \ Default value.\n+   * primary: Boolean. Set it to true for primary keys.\n+\
    \   * autoincrement: Boolean. Set it to true for columns of type integer that\
    \ need to take an auto-incremented value.\n+   * sequence: Sequence name for databases\
    \ using sequences for autoIncrement columns (for example, PostgreSQL and Oracle).\n\
    +   * unique: Boolean. Set it to true if you want the column to be unique.\n\n\
    # Relationships\n\nYou can specify foreign key relationships under the relations\
    \ key in a model. The schema in Listing 8-28 will create a foreign key on the\
    \ user_id column, matching the id column in the blog_user table.\n\n# Listing\
    \ 8-28 - Foreign Key Alternative Syntax\n\n```\nArticle:\n  actAs: [Timestampable]\n\
    \  tableName: blog_article\n  columns:\n    id:\n      type: integer\n      primary:\
    \ true\n      autoincrement: true\n    title:   string(255)\n    content: clob\n\
    \    user_id: integer\n  relations:\n```"
