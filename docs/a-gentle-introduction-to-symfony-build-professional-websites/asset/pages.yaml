    The generated functional tests for a new module don’t pass by default. This is
    because in a newly created module, the index action forwards to a congratulations
    page (included in the symfony default module), which contains the sentence “This
    is a temporary page”. As long as you don’t modify the index action, the tests
    for this module will fail, and this guarantees that you cannot pass all tests
    with an unfinished module.


    > In functional tests, the autoloading is activated, so you don’t have to include
    the files by hand.


    # Browsing with the sfBrowser Object


    The browser is capable of making GET and POST requests. In both cases, use a real
    URI as parameter. Listing 15-13 shows how to write calls to the sfBrowser object
    to simulate requests.


    # Listing 15-13 - Simulating Requests with the sfBrowser Object


    ```

    Listing 15-14

    include dirname(__FILE__).''/../../bootstrap/functional.php'';


    // Create a new browser

    $b = new sfBrowser();


    $b->get(''/foobar/show/id/1'');       // GET request

    $b->post(''/foobar/show'', array(''id'' => 1));  // POST request


    // The get() and post() methods are shortcuts to the call() method

    $b->call(''/foobar/show/id/1'', ''get'');

    $b->call(''/foobar/show'', ''post'', array(''id'' => 1));


    // The call() method can simulate requests with any method

    $b->call(''/foobar/show/id/1'', ''head'');

    $b->call(''/foobar/add/id/1'', ''put'');

    $b->call(''/foobar/delete/id/1'', ''delete'');

    ```


    A typical browsing session contains not only requests to specific actions, but
    also clicks on links and on browser buttons. As shown in Listing 15-14, the sfBrowser
    object is also capable of simulating those.


    # Listing 15-14 - Simulating Navigation with the sfBrowser Object'
