- pgno: 351
  md: "Editing your own autoload.yml will add new locations to symfony's autoloading,\
    \ but you may want to extend this mechanism and add your own autoloading handler\
    \ to symfony's handler. As symfony uses the standard spl_autoload_register() function\
    \ to manage class autoloading, you can register more callbacks in the application\
    \ configuration class:\n\n```\nclass frontendConfiguration extends sfApplicationConfiguration\n\
    {\n  public function initialize()\n  {\n    parent::initialize(); // load symfony\
    \ autoloading first\n\n    // insert your own autoloading callables here\n   \
    \ spl_autoload_register(array('myToolkit', 'autoload'));\n  }\n}\n```\n\nWhen\
    \ the PHP autoloading system encounters a new class, it will first try the symfony\
    \ autoloading method (and use the locations defined in autoload.yml). If it doesn't\
    \ find a class definition, all the other callables registered with spl_autoload_register()\
    \ will be called, until the class is found. So you can add as many autoloading\
    \ mechanisms as you want—for instance, to provide a bridge to other framework\
    \ components (see Chapter 17).\n\n# Custom File Structure\n\nEach time the framework\
    \ uses a path to look for something (from core classes to templates, plug-ins,\
    \ configurations, and so on), it uses a path variable instead of an actual path.\
    \ By changing these variables, you can completely alter the directory structure\
    \ of a symfony project, and adapt to the file organization requirements of any\
    \ client.\n\n> Customizing the directory structure of a symfony project is possible\
    \ but not necessarily a good idea. One of the strengths of a framework like symfony\
    \ is that any web developer can look at a project built with it and feel at home,\
    \ because of the respect for conventions. Make sure you consider this issue before\
    \ deciding to use your own directory structure.\n\n# The Basic File Structure\n\
    \nThe path variables are defined in the sfProjectConfiguration and sfApplicationConfiguration\
    \ classes and stored in the sfConfig object. Listing 19-4 shows a listing of the\
    \ path variables and the directory they reference.\n\n# Listing 19-4 - Default\
    \ File Structure Variables, defined in sfProjectConfiguration and sfApplicationConfiguration\n\
    \n```\nsf_root_dir              # myproject/\nsf_apps_dir              # apps/\n\
    sf_app_dir               # frontend/\nsf_app_config_dir        # config/\nsf_app_i18n_dir\
    \          # i18n/\nsf_app_lib_dir           # lib/\nsf_app_module_dir       \
    \ # modules/\nsf_app_template_dir      # templates/\nsf_cache_dir            \
    \ # cache/\nsf_app_base_cache_dir    # frontend/\nsf_app_cache_dir         # prod/\n\
    sf_template_cache_dir    # templates/\n```"
