    income: 12,345  # Until you convert it, this is still a string

    ```


    # Overview of the Configuration Files


    Configuration is distributed into files, by subject. The files contain parameter
    definitions, or settings. Some of these parameters can be overridden at several
    levels (project, application, and module); some are specific to a certain level.
    The next chapters will deal with the configuration files related to their main
    topic, and Chapter 19 will deal with advanced configuration.


    # Project Configuration


    There are a few project configuration files by default. Here are the files that
    can be found in the myproject/config/ directory:


    +   * ProjectConfiguration.class.php: This is the very first file included by
    any request or command. It contains the path to the framework files, and you can
    change it to use a different installation. See Chapter 19 for advanced usage of
    this file.

    +   * databases.yml: This is where you define the access and connection settings
    to the database (host, login, password, database name, and so on). Chapter 8 will
    tell you more about it. It can also be overridden at the application level.

    +   * properties.ini: This file holds a few parameters used by the command line
    tool, including the project name and the connection settings for distant servers.
    See Chapter 16 for an overview of the features using this file.

    +   * rsync_exclude.txt, rsync_include.txt: This file specifies which directories
    and files must be excluded and/or included from the synchronization between servers.
    It is discussed in Chapter 16.

    +   * schema.yml: This is the data access configuration file used by Propel and
    Doctrine (symfony''s ORM layers). It is used to make the ORM libraries work with
    the symfony classes and the data of your project. schema.yml contains a representation
    of the project''s relational data model. For Doctrine, this file is created in
    config/doctrine/.


    These files are mostly used by external components or by the command line, or
    they need to be processed even before any YAML parsing program can be loaded by
    the framework. That''s why some of them don''t use the YAML format.


    # Application Configuration


    The main part of the configuration is the application configuration. It is defined
    in the front controller (in the web/ directory) for the main configuration, in
    YAML files located in the application config/ directory, in i18n/ directories
    for the internationalization files, and in the framework files for invisible—although
    useful—additional application configuration.


    # Front Controller Configuration


    The very first application configuration is actually found in the front controller;
    that is the very first script executed by a request. Take a look at the default
    web/index.php in Listing 5-11.


    _Listing 5-11 - The Default Production Front Controller_'
