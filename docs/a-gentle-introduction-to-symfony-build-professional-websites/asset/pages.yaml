- pgno: 131
  md: "# Refactoring to the Data layer\n\nWhen developing a symfony project, you often\
    \ start by writing the domain logic code in the actions. But the database queries\
    \ and model manipulation should not be stored in the controller layer. So all\
    \ the logic related to the data should be moved to the model layer. Whenever you\
    \ need to do the same request in more than one place in your actions, think about\
    \ transferring the related code to the model. It helps to keep the actions short\
    \ and readable.\n\nFor example, imagine the code needed in a blog to retrieve\
    \ the ten most popular articles for a given tag (passed as request parameter).\
    \ This code should not be in an action, but in the model. In fact, if you need\
    \ to display this list in a template, the action should simply look like this:\n\
    \n```\npublic function executeShowPopularArticlesForTag($request)\n{\n    $tag\
    \ =\n    Doctrine_Core::getTable('Tag')->findOneByName($request->getParameter('tag'));\n\
    \    $this->forward404Unless($tag);\n    $this->articles = $tag->getPopularArticles(10);\n\
    }\n```\n\nThe action creates an object of class Tag from the request parameter.\
    \ Then all the code needed to query the database is located in a getPopularArticles()\
    \ method of this class. It makes the action more readable, and the model code\
    \ can easily be reused in another action.\n\nMoving code to a more appropriate\
    \ location is one of the techniques of refactoring. If you do it often, your code\
    \ will be easy to maintain and to understand by other developers. A good rule\
    \ of thumb about when to do refactoring to the data layer is that the code of\
    \ an action should rarely contain more than ten lines of PHP code.\n\n# Database\
    \ Connections\n\nThe data model is independent from the database used, but you\
    \ will definitely use a database. The minimum information required by symfony\
    \ to send requests to the project database is the name, the credentials, and the\
    \ type of database. These connection settings can be configured by passing a data\
    \ source name (DSN) to the configure:database task:\n\n```\n$ php symfony configure:database\
    \ \"mysql:host=localhost;dbname=blog\" root\nmYsEcret\n```\n\nThe connection settings\
    \ are environment-dependent. You can define distinct settings for the prod, dev,\
    \ and test environments, or any other environment in your application by using\
    \ the env option:\n\n```\n$ php symfony configure:database --env=dev\n\"mysql:host=localhost;dbname=blog_dev\"\
    \ root mYsEcret\n```\n\nThis configuration can also be overridden per application.\
    \ For instance, you can use this approach to have different security policies\
    \ for a front-end and a back-end application, and define several database users\
    \ with different privileges in your database to handle this:\n\n```\n$ php symfony\
    \ configure:database --app=frontend\n\"mysql:host=localhost;dbname=blog\" root\
    \ mYsEcret\n```"
  merge: -1
  img_proc: true
- pgno: 132
  md: "For each environment, you can define many connections. The default connection\
    \ name used is doctrine. The name option allows you to create another connection:\n\
    \n```\n$ php symfony configure:database --name=main\n\"mysql:host=localhost;dbname=example\"\
    \ root myS3cret\n```\n\nYou can also enter these connection settings manually\
    \ in the databases.yml file located in the config/ directory. Listing 8-17 shows\
    \ an example of such a file and Listing 8-18 shows the same example with the extended\
    \ notation.\n\n# Listing 8-17 - Shorthand Database Connection Settings\n\n```\n\
    all:\n  doctrine:\n    class: sfDoctrineDatabase\n    param:\n      dsn: mysql://login:passwd@localhost/blog\n\
    ```\n\n# Listing 8-18 - Sample Database Connection Settings, in myproject/config/databases.yml\n\
    \n```\nprod:\n  doctrine:\n    param:\n      dsn: mysql:dbname=blog;host=localhost\n\
    \      username: login\n      password: passwd\n    attributes:\n      quote_identifier:\
    \ false\n      use_native_enum: false\n      validate: all\n      idname_format:\
    \ %s_id\n      seqname_format: %s_seq\n      tblname_format: %s\n```\n\nTo override\
    \ the configuration per application, you need to edit an application-specific\
    \ file, such as apps/frontend/config/databases.yml.\n\nIf you want to use a SQLite\
    \ database, the dsn parameter must be set to the path of the database file. For\
    \ instance, if you keep your blog database in data/blog.db, the databases.yml\
    \ file will look like Listing 8-19.\n\n# Listing 8-19 - Database Connection Settings\
    \ for SQLite Use a File Path As Host\n\n```\nall:\n  doctrine:\n    class: sfDoctrineDatabase\n\
    \    param:\n      dsn: sqlite:///%SF_DATA_DIR%/blog.db\n```\n\n# Extending the\
    \ Model\n\nThe generated model methods are great but often not sufficient. As\
    \ soon as you implement your own business logic, you need to extend it, either\
    \ by adding new methods or by overriding existing ones."
