  md: '# # Hydrating


    The call to ->execute() is actually much more powerful than a simple SQL query.
    First, the SQL is optimized for the DBMS you choose. Second, any value passed
    to the Doctrine_Query is escaped before being integrated into the SQL code, which
    prevents SQL injection risks. Third, the method returns an array of objects, rather
    than a result set. The ORM automatically creates and populates objects based on
    the database result set. This process is called hydrating.


    For a more complex object selection, you need an equivalent of the WHERE, ORDER
    BY, GROUP BY, and other SQL statements. The Doctrine_Query object has methods
    and parameters for all these conditions. For example, to get all comments written
    by Steve, ordered by date, build a Doctrine_Query as shown in Listing 8-13.


    Listing 8-13 - Retrieving Records by a Doctrine_Query with createQuery()—Doctrine_Query
    with Conditions


    ```

    $q = Doctrine_Core::getTable(''Comment'')

    ->createQuery(''c'')

    ->where(''c.author = ?'', ''Steve'')

    ->orderBy(''c.created_at ASC'');

    $comments = $q->execute();


    // Will result in the following SQL query

    SELECT b.id AS b_id, b.article_id AS b__article_id, b.author AS b__author, b.content
    AS b__content, b.created_at AS b__created_at,

    b.updated_at AS b__updated_at FROM blog_comment b WHERE (b.author = ?)

    ORDER BY b.created_at ASC

