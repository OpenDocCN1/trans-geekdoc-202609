- pgno: 179
  md: "# Altering a Form Object\n\nWhen you use a form class definition, the form\
    \ is defined outside the action. That makes dynamic default value assignment quite\
    \ difficult. That's why the form object takes an array of default values as its\
    \ first argument:\n\n```\n// in modules/foo/actions/actions.class.php\n// Define\
    \ the form\n$this->form = new ContactForm(array('email' => 'me@example.com'));\n\
    ```\n\nYou can also override existing widget or validator settings by calling\
    \ setWidget() or setValidator() on an existing field name.\n\nHowever, widgets\
    \ and validators are objects in symfony, and offer a clean API to modify their\
    \ properties:\n\n```\n// in modules/foo/actions/actions.class.php\n// Define the\
    \ form\n$this->form = new ContactForm();\n\n// Allow multiple language selections\n\
    $form->getWidget('language')->setOption('multiple', true);\n\n// Add a 'gender'\
    \ list of options widget\n$form->setWidget('gender', new sfWidgetFormChoice(array('expanded'\
    \ =>\ntrue, 'choices' => array('m' => 'Male', 'f' => 'Female')), array('class'\n\
    => 'gender_list')));\n\n// Change the HTML attributes of the 'subject' widget\n\
    $form->getWidget('subject')->setAttribute('disabled', 'disabled');\n\n// Remove\
    \ the 'subject' field\nunset($form['subject'])\n\n// Note: You cannot remove just\
    \ the widget. Removing a widget will also\nremove the related validators\n\n//\
    \ Change the 'min_length' error in the 'message' validator\n$form->getValidator('message')->setMessage('min_length',\
    \ 'Message too\nshort');\n\n// Make the 'name' field optional\n$form->getValidator('name')->setOption('required',\
    \ false);\n```\n\n# Custom Widget and Validator classes\n\nA custom widget is\
    \ simply a class extending sfWidgetForm, and providing a configure() and a render()\
    \ methods. Check the code of existing widget classes for a deeper understanding\
    \ of the widgets system. The next listing exposes the code of the sfWidgetFormInput\
    \ widget to illustrate the widget structure:\n\n```\nclass sfWidgetFormInputText\
    \ extends sfWidgetForm\n{\n/**\n * Configures the current widget.\n *\n * This\
    \ method allows each widget to add options or HTML attributes\n * during widget\
    \ creation.\n *\n * Available options:\n *  * type: The widget type (text by default)\n\
    \ *\n * @param array $options     An array of options\n * @param array $attributes\
    \  An array of default HTML attributes\n```"
  merge: -1
  img_proc: true
- pgno: 180
  md: "```\n* @see sfWidgetForm\n*/\nprotected function configure($options = array(),\
    \ $attributes = array())\n{\n    $this->addOption('type', 'text');\n    $this->setOption('is_hidden',\
    \ false);\n}\n\n/**\n * Renders the widget as HTML\n *\n * @param string $name\
    \         The element name\n * @param string $value        The value displayed\
    \ in this widget\n * @param array  $attributes   An array of HTML attributes to\
    \ be merged\nwith the default HTML attributes\n * @param array  $errors      \
    \ An array of errors for the field\n * @return string An HTML tag string\n * @see\
    \ sfWidgetForm\n */\npublic function render($name, $value = null, $attributes\
    \ = array(),\n$errors = array())\n{\n    return $this->renderTag('input', array_merge(\n\
    \        array('type' => $this->getOption('type'), 'name' => $name, 'value' =>\
    \ $value),\n        $attributes\n    ));\n}\n}\n```\n\nA validator class must\
    \ extend sfValidatorBase and provide a configure() and a doClean() methods. Why\
    \ doClean() and not validate()? Because validators do two things: they check that\
    \ the input fulfills a set of rules, and they optionally clean the input (for\
    \ instance by forcing the type, trimming, converting date strings to timestamp,\
    \ etc.). So the doClean() method must return the cleaned input, or throw a sfValidatorError\
    \ exception if the input doesn't satisfy any of the validator rules. Here is an\
    \ illustration of this concept, with the code of the sfValidatorInteger validator.\n\
    \n```\nclass sfValidatorInteger extends sfValidatorBase\n{\n    /**\n     * Configures\
    \ the current validator.\n     *\n     * This method allows each validator to\
    \ add options and error messages\n during validator creation.\n     *\n     *\
    \ Available options:\n     *  * max: The maximum value allowed\n     *  * min:\
    \ The minimum value allowed\n     *  Available error codes:\n     *  * max\n \
    \    *  * min\n     *\n     * @param array $options   An array of options\n  \
    \   * @param array $messages  An array of error messages\n     * @see sfValidatorBase\n\
    \     */\n    protected function configure($options = array(), $messages = array())\n\
    \    {\n        $this->addOption('min');\n```"
  merge: -1
  img_proc: true
- pgno: 181
  md: "```\n$this->addOption('max');\n$this->addMessage('max', '\"%value%\" must be\
    \ less than %max%.');\n$this->addMessage('min', '\"%value%\" must be greater than\
    \ %min%.');\n$this->setMessage('invalid', '\"%value%\" is not an integer.');\n\
    }\n```\n\n```\n/**\n * Cleans the input value.\n *\n * @param mixed $value The\
    \ input value\n * @return mixed The cleaned value\n * @throws sfValidatorError\n\
    \ */\nprotected function doClean($value)\n{\n    $clean = intval($value);\n  \
    \  if (strval($clean) != $value)\n    {\n        throw new sfValidatorError($this,\
    \ 'invalid', array('value' =>\n$value));\n    }\n    if ($this->hasOption('max')\
    \ && $clean > $this->getOption('max'))\n    {\n        throw new sfValidatorError($this,\
    \ 'max', array('value' => $value,\n            'max' => $this->getOption('max')));\n\
    \    }\n    if ($this->hasOption('min') && $clean < $this->getOption('min'))\n\
    \    {\n        throw new sfValidatorError($this, 'min', array('value' => $value,\n\
    \            'min' => $this->getOption('min')));\n    }\n    return $clean;\n\
    }\n```\n\nCheck the symfony API documentation for widget and validator classes\
    \ names and syntax."
