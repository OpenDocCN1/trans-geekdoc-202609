- pgno: 369
  md: 'When a doSelect() query returns a large number of results, you might want to
    display only a subset of it in your response. Symfony provides a pager class called
    sfPropelPager, which automates the pagination of results.


    # # Using Raw SQL Queries


    Sometimes, you don''t want to retrieve objects, but want to get only synthetic
    results calculated by the database. For instance, to get the latest creation date
    of all articles, it doesn''t make sense to retrieve all the articles and to loop
    on the array. You will prefer to ask the database to return only the result, because
    it will skip the object hydrating process.


    On the other hand, you don''t want to call the PHP commands for database management
    directly, because then you would lose the benefit of database abstraction. This
    means that you need to bypass the ORM (Propel) but not the database abstraction
    (PDO).


    Querying the database with PHP Data Objects requires that you do the following:


    +   1. Get a database connection.

    +   2. Build a query string.

    +   3. Create a statement out of it.

    +   4. Iterate on the result set that results from the statement execution.


    If this looks like gibberish to you, the code in Listing 8-15 will probably be
    more explicit.


    # Listing 8-15 - Custom SQL Query with PDO


    ```

    ```php

    $connection = Propel::getConnection();

    $query = ''SELECT MAX(?) AS max FROM ?'';

    $statement = $connection->prepare($query);

    $statement->bindValue(1, ArticlePeer::CREATED_AT);

    $statement->bindValue(2, ArticlePeer::TABLE_NAME);

    $statement->execute();

    $resultset = $statement->fetch(PDO::FETCH_OBJ);

    $max = $resultset->max;

    ```

    ```


    Just like Propel selections, PDO queries are tricky when you first start using
    them. Once again, examples from existing applications and tutorials will show
    you the right way.


    If you are tempted to bypass this process and access the database directly, you
    risk losing the security and abstraction provided by Propel. Doing it the Propel
    way is longer, but it forces you to use good practices that guarantee the performance,
    portability, and security of your application. This is especially true for queries
    that contain parameters coming from a untrusted source (such as an Internet user).
    Propel does all the necessary escaping and secures your database. Accessing the
    database directly puts you at risk of SQL-injection attacks.


    # # Using Special Date Columns


    Usually, when a table has a column called created_at, it is used to store a timestamp
    of the date when the record was created. The same applies to updated_at columns,
    which are to be updated each time the record itself is updated, to the value of
    the current time.


    The good news is that symfony will recognize the names of these columns and handle
    their updates for you. You don''t need to manually set the created_at and updated_at
    columns; they will automatically be updated, as shown in Listing 8-16. The same
    applies for columns named created_on and updated_on.


    # Listing 8-16 - created_at and updated_at Columns Are Dealt with Automatically'
