  md: '```

    <li>

    <input type="submit" />

    </li>

    </ul>

    </form>

    ```


    A field row is the representation of all the elements of a form field (label,
    error message, help text, form input) by a formatter. By default, symfony uses
    a table formatter, and that''s why renderRow() returns a set of <tr>, <th> and
    <td> tags. Alternatively, you can obtain the same HTML code as above by simply
    specifying an alternative list formatter for the form, as follows:


    ```

    // in modules/foo/templates/contactSuccess.php

    <?php echo $form->renderFormTag(''foo/contact'') ?>

    <ul>

    <?php echo $form->renderUsing(''list'') ?>

    <li>

    <input type="submit" />

    </li>

    </ul>

    </form>

    ```


    Check the API documentation of the sfWidgetFormSchemaFormatter class to learn
    how to create your own formatter.


    # # Form Widgets


    There are many available form widgets at your disposal to compose your forms.
    All widgets accept at least the default option.


    You can also define the label of a widget, and even its HTML attributes, when
    you create the form:


    ```

    $this->form = new sfForm();

    $this->form->setWidgets(array(

    ''name'' => new sfWidgetFormInput(array(''label'' => ''Your Name''),

    array(''size'' => 25, ''class'' => ''foo'')),

    ''email'' => new sfWidgetFormInput(array(''default'' => ''me@example.com'',

    ''label'' => ''Your Email''), array(''onclick'' => ''this.value = "";'')),

    ''subject'' => new sfWidgetFormChoice(array(''choices'' => array(''Subject

    A'', ''Subject B'', ''Subject C''))),

    ''message'' => new sfWidgetFormTextarea(array(), array(''rows'' => ''20'',

    ''cols'' => 5)),

    ));

    ```


    Symfony uses these parameters to display the widget, and you can still override
    them by passing custom parameters to renderRow() in the template.


    As an alternative to calling setWidgets() with an associative array, you can call
    the setWidget($name, $widget) method several times.'
