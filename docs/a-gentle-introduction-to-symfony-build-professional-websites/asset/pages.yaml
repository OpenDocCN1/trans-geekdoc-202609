- pgno: 218
  md: '# Chapter 13

    I18n And L10n


    If you ever developed an international application, you know that dealing with
    every aspect of text translation, local standards, and localized content can be
    a nightmare. Fortunately, symfony natively automates all the aspects of internationalization.


    As it is a long word, developers often refer to internationalization as i18n (count
    the letters in the word to know why). Localization is referred to as l10n. They
    cover two different aspects of multilingual web applications.


    An internationalized application contains several versions of the same content
    in various languages or formats. For instance, a webmail interface can offer the
    same service in several languages; only the interface changes.


    A localized application contains distinct information according to the country
    from which it is browsed. Think about the contents of a news portal: When browsed
    from the United States, it displays the latest headlines about the United States,
    but when browsed from France, the headlines concern the French news. So an l10n
    application not only provides content translation, but the content can be different
    from one localized version to another.


    All in all, dealing with i18n and l10n means that the application can take care
    of the following:


    +   - Text translation (interface, assets, and content)

    +   - Standards and formats (dates, amounts, numbers, and so on)

    +   - Localized content (many versions of a given object according to a country)


    This chapter covers the way symfony deals with those elements and how you can
    use it to develop internationalized and localized applications.


    # User Culture


    All the built-in i18n features in symfony are based on a parameter of the user
    session called the culture. The culture is the combination of the country and
    the language of the user, and it determines how the text and culture-dependent
    information are displayed. Since it is serialized in the user session, the culture
    is persistent between pages.


    # Setting the Default Culture


    By default, the culture of new users is the default_culture. You can change this
    setting in the settings.yml configuration file, as shown in Listing 13-1.


    Listing 13-1 - Setting the Default Culture, in frontend/config/settings.yml'
  merge: -1
  img_proc: true
- pgno: 219
  md: "```\nall:\n .settings:\n default_culture: fr_FR\n```\n\n> During development,\
    \ you might be surprised that a culture change in the settings.yml file doesn't\
    \ change the current culture in the browser. That's because the session already\
    \ has a culture from previous pages. If you want to see the application with the\
    \ new default culture, you need to clear the domain cookies or restart your browser.\n\
    \nKeeping both the language and the country in the culture is necessary because\
    \ you may have a different French translation for users from France, Belgium,\
    \ or Canada, and a different Spanish content for users from Spain or Mexico. The\
    \ language is coded in two lowercase characters, according to the ISO 639-1 standard\
    \ (for instance, en for English). The country is coded in two uppercase characters,\
    \ according to the ISO 3166-1 standard (for instance, GB for Great Britain).\n\
    \n# Changing the Culture for a User\n\nThe user culture can be changed during\
    \ the browsing session—for instance, when a user decides to switch from the English\
    \ version to the French version of the application, or when a user logs in to\
    \ the application and uses the language stored in his preferences. That's why\
    \ the sfUser class offers getter and setter methods for the user culture. Listing\
    \ 13-2 shows how to use these methods in an action.\n\n# Listing 13-2 - Setting\
    \ and Retrieving the Culture in an Action\n\n```\n// Culture setter\n$this->getUser()->setCulture('en_US');\n\
    \n// Culture getter\n$culture = $this->getUser()->getCulture();\n=> en_US\n```"
