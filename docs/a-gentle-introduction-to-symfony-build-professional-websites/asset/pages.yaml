- pgno: 70
  md: "```\nall:\n  .array:\n    creditcards:\n      fake: false\n      visa: true\n\
    \      americanexpress: true\n\n[php]\nprint_r(sfConfig::get('app_creditcards'));\n\
    \nArray(\n  [fake] => false\n  [visa] => true\n  [americanexpress] => true\n)\n\
    ```\n\n**TIP** Each time you are tempted to define a constant or a setting in\
    \ one of your scripts, think about if it would be better located in the app.yml\
    \ file. This is a very convenient place to store all application settings.\n\n\
    When your need for custom parameters becomes hard to handle with the app.yml syntax,\
    \ you may need to define a syntax of your own. In that case, you can store the\
    \ configuration in a new file, interpreted by a new configuration handler. Refer\
    \ to Chapter 19 for more information about configuration handlers.\n\n# Tips for\
    \ Getting More from Configuration Files\n\nThere are a few last tricks to learn\
    \ before writing your own YAML files. They will allow you to avoid configuration\
    \ duplication and to deal with your own YAML formats.\n\n# Using Constants in\
    \ YAML Configuration Files\n\nSome configuration settings rely on the value of\
    \ other settings. To avoid setting the same value twice, symfony supports constants\
    \ in YAML files. On encountering a setting name (one that can be accessed by sfConfig::get())\
    \ in capital letters enclosed in % signs, the configuration handlers replace them\
    \ with their current value. See Listing 5-20 for an example.\n\n*Listing 5-20\
    \ - Using Constants in YAML Files, Example from autoload.yml*\n\n```\nautoload:\n\
    \  symfony:\n    name: symfony\n    path: %SF_SYMFONY_LIB_DIR%\n    recursive:\
    \ true\n    exclude: [vendor]\n```\n\nThe path parameter will take the value returned\
    \ by sfConfig::get('sf_symfony_lib_dir'). If you want one configuration file to\
    \ rely on another, you need to make sure that the file you rely on is already\
    \ parsed (look in the symfony source to find out the order in which the configuration\
    \ files are parsed). app.yml is one of the last files parsed, so you may rely\
    \ on others in it.\n\nAll the available constants are described in the symfony\
    \ reference book33."
  merge: -1
  img_proc: true
- pgno: 71
  md: "# # Using Scriptable Configuration\n\nIt may happen that your configuration\
    \ relies on external parameters (such as a database or another configuration file).\
    \ To deal with these particular cases, the symfony configuration files are parsed\
    \ as PHP files before being passed to the YAML parser. It means that you can put\
    \ PHP code in YAML files, as in Listing 5-21.\n\n```\nListing 5-21 - YAML Files\
    \ Can Contain PHP\n\n```yaml\nall:\n  translation:\n    format: <?php echo (sfConfig::get('sf_i18n')\
    \ == true ? 'xliff' : null).\"\\n\" ?>\n```\n```\n\nBut be aware that the configuration\
    \ is parsed very early in the life of a request, so you will not have any symfony\
    \ built-in methods or functions to help you.\n\nAlso, as the echo language construct\
    \ does not add a carriage return by default, you need to add a \"\\n\" or use\
    \ the echoln helper to keep the YAML format valid.\n\n```\nListing 5-39\n\n```yaml\n\
    all:\n  translation:\n    format: <?php echoln(sfConfig::get('sf_i18n') == true\
    \ ? 'xliff' : 'none') ?>\n```\n```\n\n> > In the production environment, the configuration\
    \ is cached, so the configuration files are parsed (and executed) only once after\
    \ the cache is cleared.\n\n# # Browsing Your Own YAML File\n\nWhenever you want\
    \ to read a YAML file directly, you can use the sfYaml class. It is a YAML parser\
    \ that can turn a YAML file into a PHP associative array. Listing 5-22 presents\
    \ a sample YAML file, and Listing 5-23 shows you how to parse it.\n\n```\nListing\
    \ 5-22 - Sample test.yml File\n\n```yaml\nhouse:\n  family:\n    name: Doe\n \
    \   parents: [John, Jane]\n    children: [Paul, Mark, Simone]\n  address:\n  \
    \  number: 34\n    street: Main Street\n    city: Nowheretown\n    zipcode: 12345\n\
    ```\n```\n\n```\nListing 5-23 - Using the sfYaml Class to Turn a YAML File into\
    \ an Associative Array\n\n```php\n$test = sfYaml::load('/path/to/test.yml');\n\
    print_r($test);\n\nArray(\n  [house] => Array(\n    [family] => Array(\n     \
    \ [name] => Doe\n      [parents] => Array(\n```\n```"
