  md: 'If you need to declare more than one helper group, add more arguments to the
    use_helper() call. For instance, to load both the Text and the Javascript helper
    groups in a template, call <?php use_helper(''Text'', ''Javascript'') ?>.


    A few helpers are available by default in every template, without need for declaration.
    These are helpers of the following helper groups:


    +   - Helper: Required for helper inclusion (the use_helper() function is, in
    fact, a helper itself)

    +   - Tag: Basic tag helper, used by almost every helper

    +   - Url: Links and URL management helpers

    +   - Asset: Helpers populating the HTML <head> section, and providing easy links
    to external assets (images, JavaScript, and style sheet files)

    +   - Partial: Helpers allowing for inclusion of template fragments

    +   - Cache: Manipulation of cached code fragments


    The list of the standard helpers, loaded by default for every template, is configurable
    in the settings.yml file. So if you know that you will not use the helpers of
    the Cache group, or that you will always use the ones of the Text group, modify
    the standard_helpers setting accordingly. This will speed up your application
    a bit. You cannot remove the first four helper groups in the preceding list (Helper,
    Tag, Url, and Asset), because they are compulsory for the templating engine to
    work properly. Consequently, they don''t even appear in the list of standard helpers.


    If you ever need to use a helper outside a template, you can still load a helper
    group from anywhere by calling sfProjectConfiguration::getActive()->loadHelpers($helpers),
    where $helpers is a helper group name or an array of helper group names. For instance,
    if you want to use auto_link_text() in an action, you need to call sfProjectConfiguration::getActive()->loadHelpers(''Text'')
    first.


    # Frequently Used Helpers


    You will learn about some helpers in detail in later chapters, in relation with
    the feature they are helping. Listing 7-4 gives a brief list of the default helpers
    that are used a lot, together with the HTML code they return.


    # Listing 7-4 - Common Default Helpers


    ```

    // Helper group

    <?php use_helper(''HelperName'') ?>

    <?php use_helper(''HelperName1'', ''HelperName2'', ''HelperName3'') ?>


    // Url group

    <?php echo link_to(''click me'', ''mymodule/myaction'') ?>

    => <a href="/route/to/myaction">click me</a> // Depends on the routing settings


    // Asset group

    <?php echo image_tag(''myimage'', ''alt=foo size=200x100'') ?>

    => <img src="http://www.symfony-project.org/images/myimage.png" alt="foo" width="200"
    height="100" />

    <?php echo javascript_include_tag(''myscript'') ?>

    => <script language="JavaScript" type="text/javascript" src="http://www.symfony-project.org/js/myscript.js"></script>

    <?php echo stylesheet_tag(''style'') ?>

    ```'
