  md: "```\nListing 16-22\n$ php symfony test:hello\n```\n\nThe task name comes from\
    \ the protected namespace and name properties (not from the class name, nor from\
    \ the file name). And since your task is integrated into the symfony command line,\
    \ it appears in the task list when you just type:\n\n```\nListing 16-23\n$ php\
    \ symfony\n```\n\nRather than writing a task skeleton by yourself, you can use\
    \ the symfony generate:task task. It creates an empty task, and has plenty of\
    \ customization options. Make sure you check them by calling:\n\n```\nListing\
    \ 16-24\n$ php symfony help generate:task\n```\n\nTasks can accept arguments (compulsory\
    \ parameters, in a predefined order) and options (optional and unordered parameters).\
    \ Listing 16-14 shows a more complete task, taking advantage of all these features.\n\
    \n# Listing 16-14 - More Complete Sample Task, in lib/task/mySecondTask.class.php\n\
    \n```\nListing 16-25\nclass mySecondTask extends sfBaseTask\n{\n\tprotected function\
    \ configure()\n\t{\n\t\t$this->namespace\t\t= 'foo';\n\t\t$this->name        \
    \     = 'mySecondTask';\n\t\t$this->briefDescription = 'Does some neat things,\
    \ with style';\n\t\t$this->detailedDescription = <<<EOF\n\t\tThe [foo:mySecondTask|INFO]\
    \ task manages the process of achieving things\n\t\tfor you.\n\t\tCall it with:\n\
    \t\t[php symfony foo:mySecondTask frontend|INFO]\n\t\tYou can enable verbose output\
    \ by using the [verbose|COMMENT] option:\n\t\t[php symfony foo:mySecondTask frontend\
    \ --verbose=on|INFO]\nEOF;\n\t\t$this->addArgument('application', sfCommandArgument::REQUIRED,\
    \ 'The\n\t\tapplication name');\n\t\t$this->addOption('verbose', null, sfCommandOption::PARAMETER_REQUIRED,\n\
    \t\t'Enables verbose output', false);\n\t}\n\n\tprotected function execute($arguments\
    \ = array(), $options = array())\n\t{\n\t\t// add code here\n\t}\n}\n```\n\nIf\
    \ your task needs access to the database layer through the , it should extend\
    \ sfPropelBaseTask instead of sfBaseTask. The task initialization will then take\
    \ care of loading the additional Propel classes. You can start a database connection\
    \ in the execute() method by calling:\n$databaseManager = new sfDatabaseManager($this->configuration);"
