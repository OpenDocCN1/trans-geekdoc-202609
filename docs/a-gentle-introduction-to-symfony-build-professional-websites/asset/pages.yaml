- pgno: 307
  md: "In practice, notifyUntil() offers multiple inheritance capabilities, or rather\
    \ mixins (the addition of methods from third-party classes to an existing class),\
    \ to PHP. You can now “inject” new methods to objects that you can’t extend by\
    \ way of inheritance. And this happens at runtime. You are not limited by the\
    \ Object Oriented capabilities of PHP anymore when you use symfony.\n\n> As the\
    \ first listener to catch a notifyUntil() event prevents further notifications,\
    \ you may worry about the order in which listeners are executed. This order corresponds\
    \ to the order in which listeners were registered - first registered, first executed.\
    \ In practice, cases where this could be an issue seldom happen. If you realize\
    \ that two listeners conflict on a particular event, perhaps your class should\
    \ notify several events, for instance one at the beginning and one at the end\
    \ of the method execution. And if you use events to add new methods to an existing\
    \ class, name your methods wisely so that other attempts at adding methods don’t\
    \ conflict. Prefixing method names with the name of the listener class is a good\
    \ practice.\n\n# Changing the Return Value of a Method\n\nYou can probably imagine\
    \ how a listener can not only use the information given by an event, but also\
    \ modify it, to alter the original logic of the notifier. If you want to allow\
    \ this, you should use the filter() method of the event dispatcher rather than\
    \ notify(). All event listeners are then called with two parameters: the event\
    \ object, and the value to filter. Event listeners must return the value, whether\
    \ they altered it or not. Listing 17-5 shows how filter() can be used to filter\
    \ a response from a web service and escape special characters in that response.\n\
    \n```\nListing 17-5- Notifying of and Handling a Filter Event\n\nclass sfRestRequest\n\
    {\n    // ...\n\n    /**\n     * Make a query to an external web service\n   \
    \  */\n    public function fetch($uri, $parameters = array())\n    {\n       \
    \ // Make the request and store the result in a $result variable\n        // ...\n\
    \n        // Notify of the end of the fetch process\n        return $this->dispatcher->filter(new\
    \ sfEvent(this,\n            'rest_request.filter_result', array(\n          \
    \      'uri'    => $uri,\n                'parameters' => $parameters,\n     \
    \       )), $result)->getReturnValue();\n    }\n}\n\n// Add escaping to the web\
    \ service response\n$dispatcher->connect('rest_request.filter_result',\n    'rest_htmlspecialchars');\n\
    \nfunction rest_htmlspecialchars(sfEvent $event, $result)\n{\n    return htmlspecialchars($result,\
    \ ENT_QUOTES, 'UTF-8');\n}\n```"
  merge: -1
  img_proc: true
