    \ lose database-independence.\n\n# Speeding Up the Database\n\nThere are many\
    \ database-specific optimization techniques that can be applied regardless of\
    \ whether you're using symfony. This section briefly outlines the most common\
    \ database optimization strategies, but a good knowledge of database engines and\
    \ administration is required to get the most out of your model layer.\n\n> Remember\
    \ that the web debug toolbar displays the time taken by each query in a page,\
    \ and that every tweak should be monitored to determine whether it really improves\
    \ performance.\n\nTable queries are often based on non-primary key columns. To\
    \ improve the speed of such queries, you should define indexes in your database\
    \ schema. To add a single column index, add the index: true property to the column\
    \ definition, as in Listing 18-10.\n\nListing 18-10 - Adding a Single Column Index,\
    \ in config/schema.yml\n\n```\n# Propel schema\npropel:\n  article:\n    id:\n\
    \    author_id:\n    title: { type: varchar(100), index: true }\n\n# Doctrine\
    \ schema\nArticle:\n  columns:\n    author_id: integer\n    title: string(100)\n\
    \  indexes:\n    title:\n      fields: [title]\n```\n\nYou can use the alternative\
    \ index: unique syntax to define a unique index instead of a classic one. You\
    \ can also define multiple column indices in schema.yml (refer to Chapter 8 for\
    \ more details about the indexing syntax). You should strongly consider doing\
    \ this, because it is often a good way to speed up a complex query.\n\nAfter adding\
    \ an index to a schema, you should do the same in the database itself, either\
    \ by issuing an ADD INDEX query directly in the database or by calling the propel-build-all\
    \ command (which will not only rebuild the table structure, but also erase all\
    \ the existing data).\n\n> Indexing tends to make SELECT queries faster, but INSERT,\
    \ UPDATE, and DELETE queries are slower. Also, database engines use only one index\
    \ per query, and they infer the index to"
