    \n# URL Rewriting\n\nBefore getting deeper into the routing system, one matter\
    \ needs to be clarified. In the examples given in the previous section, there\
    \ is no mention of the front controller (index.php or frontend_dev.php) in the\
    \ internal URIs. The front controller, not the elements of the application, decides\
    \ the environment. So all the links must be environment-independent, and the front\
    \ controller name can never appear in internal URIs.\n\nThere is no script name\
    \ in the examples of generated URLs either. This is because generated URLs don't\
    \ contain any script name in the production environment by default. The no_script_name\
    \ parameter of the settings.yml file precisely controls the appearance of the\
    \ front controller name in generated URLs. Set it to false, as shown in Listing\
    \ 9-5, and the URLs output by the link helpers will mention the front controller\
    \ script name in every link.\n\nListing 9-5 - Showing the Front Controller Name\
    \ in URLs, in apps/frontend/config/settings.yml\n\n```\nprod:\n .settings\n no_script_name:\
    \ false\n```\n\nNow, the generated URLs will look like this:\n\n```\nhttp://www.example.com/index.php/articles/finance/2010/\n\
    activity-breakdown.html\n```\n\nIn all environments except the production one,\
    \ the no_script_name parameter is set to false by default. So when you browse\
    \ your application in the development environment, for instance, the front controller\
    \ name always appears in the URLs.\n\n```\nhttp://www.example.com/frontend_dev.php/articles/finance/2010/\n\
    activity-breakdown.html\n```\n\nIn production, the no_script_name is set to true,\
    \ so the URLs show only the routing information and are more user-friendly. No\
    \ technical information appears.\n\n```\nhttp://www.example.com/articles/finance/2010/activity-breakdown.html\n\
    ```\n\nBut how does the application know which front controller script to call?\
    \ This is where URL rewriting comes in. The web server can be configured to call\
    \ a given script when there is none in the URL.\n\nIn Apache, this is possible\
    \ once you have the mod_rewrite extension activated. Every symfony project comes\
    \ with an .htaccess file, which adds mod_rewrite settings to your server configuration\
    \ for the web/ directory. The default content of this file is shown in Listing\
    \ 9-6."
