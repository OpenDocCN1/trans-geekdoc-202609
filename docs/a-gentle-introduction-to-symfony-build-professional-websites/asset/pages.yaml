    Be aware that the template files are actually templates of templates, that is,
    PHP files that will be parsed by a special utility to generate templates based
    on generator settings (this is called the compilation phase). The generated templates
    must still contain PHP code to be executed during actual browsing, so the templates
    of templates use an alternative syntax to keep PHP code unexecuted for the first
    pass. Listing 14-34 shows an extract of a default template of template.


    # *Listing 14-34 - Syntax of Templates of Templates*


    ```

    <h1>[?php echo <?php echo $this->getI18NString(''edit.title'') ? ? ></h1>

    ```


    ```

    [?php include_partial(''<?php echo $this->getModuleName() ?>/flashes'') ?]

    ```


    In this listing, the PHP code introduced by <? is executed immediately (at compilation),
    the one introduced by [? is only executed at execution, but the templating engine
    finally transforms the [? tags into <? tags so that the resulting template looks
    like this:


    ```

    <h1><?php echo __(''List of all Articles'') ?></h1>

    ```


    ```

    <?php include_partial(''article/flashes'') ?>

    ```


    Dealing with templates of templates is tricky, so the best advice if you want
    to create your own theme is to start from the admin theme, modify it step by step,
