- pgno: 339
  md: '# # Using a Database Storage System for Caching


    The default storage system for the template cache in symfony is the file system:
    Fragments of HTML or serialized response objects are stored under the cache/ directory
    of a project. Symfony proposes an alternative way to store cache: a SQLite database.
    Such a database is a simple file that PHP natively knows how to query very efficiently.


    To tell symfony to use SQLite storage instead of file system storage for the template
    cache, open the factories.yml file and edit the view_cache entry as follows:


    ```

    view_cache:

    class: sfSQLiteCache

    param:

    database: %SF_TEMPLATE_CACHE_DIR%/cache.db

    ```


    The benefits of using SQLite storage for the template cache are faster read and
    write operations when the number of cache elements is important. If your application
    makes heavy use of caching, the template cache files end up scattered in a deep
    file structure; in this case, switching to SQLite storage will increase performance.
    In addition, clearing the cache on file system storage may require a lot of files
    to be removed from the disk; this operation may last a few seconds, during which
    your application is unavailable. With a SQLite storage system, the cache clearing
    process results in a single file operation: the deletion of the SQLite database
    file. Whatever the number of cache elements currently stored, the operation is
    instantaneous.


    # ## Bypassing Symfony


    Perhaps the best way to speed symfony up is to bypass it completely... this is
    said only partly in jest. Some pages don''t change and don''t need to be reprocessed
    by the framework at each request. The template cache is already here to speed
    up the delivery of such pages, but it still relies on symfony.


    A couple of tricks described in Chapter 12 allow you to bypass symfony completely
    for some pages. The first one involves the use of HTTP 1.1 headers for asking
    the proxies and client browsers to cache the page themselves, so that they don''t
    request it again the next time the page is needed. The second one is the super
    fast cache (automated by the sfSuperCachePlugin plug-in), which consists of storing
    a copy of the response in the web/ directory and modifying the rewriting rules
    so that Apache first looks for a cached version before handing a request to symfony.


    Both these methods are very effective, and even if they only apply to static pages,
    they will take the burden of handling these pages off from symfony, and the server
    will then be fully available to deal with complex requests.


    # ## Caching the Result of a Function Call


    If a function doesn''t rely on context-sensitive values nor on randomness, calling
    it twice with the same parameters should return the same result. That means the
    second call could very well be avoided if the result had been stored the first
    time. That''s exactly what the sfFunctionCache class does. This class has a call()
    method, which expects a callable and an array of parameters as its arguments.
    When called, this method creates an md5 hash with all its arguments and looks
    in the cache for a key named by this hash. If such a key is found, the function
    returns the result stored in the cache. If not, the sfFunctionCache executes the
    function, stores the result in the cache, and returns it. So the second execution
    of Listing 18-16 will be faster than the first one.


    Listing 18-16 - Caching the Result of a Function'
