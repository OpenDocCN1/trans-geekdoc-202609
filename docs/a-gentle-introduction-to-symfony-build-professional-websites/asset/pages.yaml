- pgno: 338
  md: "```\n// Clear only the configuration cache of the frontend application\n$ php\
    \ symfony cache:clear frontend config\n```\n\nYou can also remove files by hand\
    \ in the `cache/` directory, or clear template cache files selectively from the\
    \ action with the `$cacheManager->remove()` method, as described in Chapter 12.\n\
    \nAll these techniques will minimize the negative performance impact of any of\
    \ the changes listed previously.\n\n> When you upgrade symfony, the cache is automatically\
    \ cleared, without manual intervention (if you set the `check_symfony_version`\
    \ parameter to true in `settings.yml`).\n\n# Generating Cached Pages\n\nWhen you\
    \ deploy a new application to production, the template cache is empty. You must\
    \ wait for users to visit a page once for this page to be put in the cache. In\
    \ critical deployments, the overhead of page processing is not acceptable, and\
    \ the benefits of caching must be available as soon as the first request is issued.\n\
    \nThe solution is to automatically browse the pages of your application in the\
    \ staging environment (where the configuration is similar to the one in production)\
    \ to have the template cache generated, then to transfer the application with\
    \ the cache to production.\n\nTo browse the pages automatically, one option is\
    \ to create a shell script that looks through a list of external URLs with a browser\
    \ (curl for instance). But there is a better and faster solution: a PHP script\
    \ using the `sfBrowser` object, already discussed in Chapter 15. That's an internal\
    \ browser written in PHP (and used by sfTestFunctional for functional tests).\
    \ It takes an external URL and returns a response, but the interesting thing is\
    \ that it triggers the template cache just like a regular browser. As it only\
    \ initializes symfony once and doesn't pass by the HTTP transport layer, this\
    \ method is a lot faster.\n\nListing 18-15 shows an example script used to generate\
    \ template cache files in a staging environment. Launch it by calling `php generate_cache.php`.\n\
    \n# Listing 18-15 - Generating the Template Cache, in generate_cache.php\n\n```\n\
    require_once(dirname(__FILE__).'/../config/\nProjectConfiguration.class.php');\n\
    $configuration =\nProjectConfiguration::getApplicationConfiguration('frontend',\
    \ 'staging',\nfalse);\nsfContext::createInstance($configuration);\n\n// Array\
    \ of URLs to browse\n$uris = array(\n  '/foo/index',\n  '/foo/bar/id/1',\n  '/foo/bar/id/2',\n\
    \  ...\n);\n\n$b = new sfBrowser();\nforeach ($uris as $uri)\n{\n  $b->get($uri);\n\
    }\n```"
  merge: -1
