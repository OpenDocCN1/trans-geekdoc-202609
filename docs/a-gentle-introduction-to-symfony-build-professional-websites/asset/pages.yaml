    ```\n\nYou will have to access raw data each time you need variables containing\
    \ HTML to be really interpreted as HTML.\n\nWhen escaping_strategy is false, $sf_data\
    \ is still available, but it always returns raw data.\n\n# Escaping Helpers\n\n\
    Escaping helpers are functions returning an escaped version of their input. They\
    \ can be provided as a default escaping_method in the settings.yml file or to\
    \ specify an escaping method for a specific value in the view. The following escaping\
    \ helpers are available:\n\n+   - ESC_RAW: Doesn't escape the value.\n+   - ESC_SPECIALCHARS:\
    \ Applies the PHP function htmlspecialchars() to the input.\n+   - ESC_ENTITIES:\
    \ Applies the PHP function htmlentities() to the input with ENT_QUOTES as the\
    \ quote style.\n+   - ESC_JS: Escapes a value to be put into a JavaScript string\
    \ that is going to be used as HTML. This is useful for escaping things where HTML\
    \ is going to be dynamically changed using JavaScript.\n+   - ESC_JS_NO_ENTITIES:\
    \ Escapes a value to be put into a JavaScript string but does not add entities.\
    \ This is useful if the value is going to be displayed using a dialog box (for\
    \ example, for a myString variable used in javascript:alert(myString);).\n\n#\
    \ Escaping Arrays and Objects\n\nOutput escaping not only works for strings, but\
    \ also for arrays and objects. Any values that are objects or arrays will pass\
    \ on their escaped state to their children. Assuming your strategy is set to true,\
    \ Listing 7-39 demonstrates the escaping cascade.\n\nListing 7-39 - Escaping Also\
    \ Works for Arrays and Objects\n\n```\n// Class definition\nclass myClass\n{\n\
    \  public function testSpecialChars($value = '')\n  {\n    return '<'.$value.'>';\n\
    \  }\n}\n\n// In the action\n$this->test_array = array('&', '<', '>');\n$this->test_array_of_arrays\
    \ = array(array('&'));\n$this->test_object = new myClass();\n\n// In the template\n\
    <?php foreach($test_array as $value): ?>\n<?php echo $value ?>\n<?php endforeach;\
    \ ?>\n=> &amp; &lt; &gt;\n<?php echo $test_array_of_arrays[0][0] ?>\n=> &amp;\n\
    <?php echo $test_object->testSpecialChars('&') ?>\n=> &lt;&amp;&gt;\n```"
