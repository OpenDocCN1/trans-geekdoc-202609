    Among the interactions that most need to be tested, those associated with forms
    probably rank first. To simulate form input and submission, you have three choices.
    You can either make a POST request with the parameters you wish to send, call
    click() with the form parameters as an array, or fill in the fields one by one
    and click the submit button. They all result in the same POST request anyhow.
    Listing 15-15 shows an example.


