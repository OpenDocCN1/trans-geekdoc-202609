- pgno: 348
  md: 'The class can be any of *sfFileCache*, *sfAPCCache*, *sfEAcceleratorCache*,
    *sfXCacheCache*, *sfMemcacheCache*, and *sfSQLiteCache*. It can also be your own
    custom class, provided it extends *sfCache* and provides the same generic methods
    for setting, retrieving and deleting a key in the cache. The factory parameters
    depend on the class you choose, but there are constants:


    +   - lifetime defines the number of seconds after which a cache part is removed


    +   - prefix is a prefix added to every cache key (use the environment in the
    prefix to use different cache depending on the environment). Use the same prefix
    for two applications if you want their cache to be shared.


    Then, for each particular factory, you have to define the location of the cache
    storage.


    +   - for *sfFileCache*, the *cache_dir* parameter locates the absolute path to
    the cache directory


    +   - *sfAPCCache*, *sfEAcceleratorCache*, and *sfXCacheCache* don''t take any
    location parameter, since they use PHP native functions for communicating with
    APC, EAccelerator or the XCache cache systems


    +   - for *sfMemcacheCache*, enter the hostname of the Memcached server in the
    host parameter, or an array of hosts in the *servers* parameter


    +   - for *sfSQLiteCache*, the absolute path to the SQLite database file should
    be entered in the *database* parameter


    For additional parameters, check the API documentation of each cache class.


    The view is not the only component to be able to use a cache. Both the routing
    and the I18N factories offer a *cache* parameter in which you can set any cache
    factory, just like the view cache. For instance, Listing 19-1 shows of the routing
    uses the file cache for its speedup tactics by default, but you can change it
    to whatever you want.


    # Logging Settings


    Two logging settings (see Chapter 16) are stored in *settings.yml*:


    +   - *error_reporting* specifies which events are logged in the PHP logs. By
    default, it is set to *E_PARSE | E_COMPILE_ERROR | E_ERROR | E_CORE_ERROR | E_USER_ERROR*
    for the production environment (so the logged events are *E_PARSE*, *E_COMPILE_ERROR*,
    *E_ERROR*, *E_CORE_ERROR*, and *E_USER_ERROR*) and to *E_ALL | E_STRICT* for the
    development environment.


    +   - The *web_debug* setting activates the web debug toolbar. Set it to *true*
    only in the development and test environments.


    # Paths to Assets


    The *settings.yml* file also stores paths to assets. If you want to use another
    version of the asset than the one bundled with symfony, you can change these path
    settings:


    +   - Files needed by the administration generator stored in *admin_web_dir*


    +   - Files needed by the web debug toolbar stored in *web_debug_web_dir*


    # Default Helpers


    Default helpers, loaded for every template, are declared in the *standard_helpers*
    setting (see Chapter 7). By default, these are the Partial and Cache helper groups.
    If you use a helper group in all templates of an application, adding its name
    to the *standard_helpers* setting saves you the hassle of declaring it with *use_helper()*
    on each template.'
  merge: -1
