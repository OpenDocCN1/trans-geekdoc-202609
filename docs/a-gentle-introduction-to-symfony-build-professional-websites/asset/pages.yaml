    \ save and the save_and_add actions save the current edits in the records, the\
    \ difference being that the save action displays the edit view on the current\
    \ record after saving, while the save_and_add action displays a new view to add\
    \ another record. The save_and_add action is a shortcut that you will find very\
    \ useful when adding many records in rapid succession. As for the position of\
    \ the delete action, it is separated from the other buttons so that users don’t\
    \ click it by mistake.\n\nThe interaction names starting with an underscore (_)\
    \ tell symfony to use the default icon and action corresponding to these interactions.\
    \ The administration generator understands _edit, _delete, _new, _list, _save,\
