- pgno: 381
  md: 'Propel in symfony


    All the details given in this chapter are not specific to symfony, but rather
    to Propel. Propel is the preferred object/relational abstraction layer for symfony,
    but you can choose an alternative one. However, symfony works more seamlessly
    with Propel, for the following reasons:


    All the object data model classes and the Criteria class are autoloading classes.
    As soon as you use them, symfony will include the right files, and you don''t
    need to manually add the file inclusion statements. In symfony, Propel doesn''t
    need to be launched nor initialized. When an object uses Propel, the library initiates
    by itself. Some symfony helpers use Propel objects as parameters to achieve high-level
    tasks (such as pagination or filtering). Propel objects allow rapid prototyping
    and generation of a backend for your application (Chapter 14 provides more details).
    The schema is faster to write through the schema.yml file.


    And, as Propel is independent of the database used, so is symfony.


    # # Don''t Create the Model Twice


    The trade-off of using an ORM is that you must define the data structure twice:
    once for the database, and once for the object model. Fortunately, symfony offers
    command-line tools to generate one based on the other, so you can avoid duplicate
    work.


    # ## Building a SQL Database Structure Based on an Existing Schema


    If you start your application by writing the `schema.yml` file, symfony can generate
    a SQL query that creates the tables directly from the YAML data model. To use
    the query, go to your root project directory and type this:


    ```

    Listing A-49

    $ php symfony propel:build-sql

    ```


    A `lib.model.schema.sql` file will be created in `myproject/data/sql/`. Note that
    the generated SQL code will be optimized for the database system defined in the
    `phptype` parameter of the `propel.ini` file.


    You can use the `schema.sql` file directly to build the tables. For instance,
    in MySQL, type this:


    ```

    Listing A-50

    $ mysqladmin -u root -p create blog

    $ mysql -u root -p blog < data/sql/lib.model.schema.sql

    ```


    The generated SQL is also helpful to rebuild the database in another environment,
    or to change to another DBMS. If the connection settings are properly defined
    in your `propel.ini`, you can even use the `php symfony propel:insert-sql` command
    to do this automatically.


    > The command line also offers a task to populate your database with data based
    on a text file. See Chapter 16 for more information about the `propel:data-load`
    task and the YAML fixture files.


    # ## Generating a YAML Data Model from an Existing Database


    Symfony can use Propel to generate a `schema.yml` file from an existing database,
    thanks to introspection (the capability of databases to determine the structure
    of the tables on which'
  merge: -1
