    <?php echo input_date_tag(''birth_date'', mktime(0, 0, 0, 9, 14, 2010)) ?>

    => input type="text" name="birth_date" id="birth_date" value="9/14/10"

    size="11" />


    <?php echo select_country_tag(''country'', ''US'') ?>

    => <select name="country" id="country"><option

    value="AF">Afghanistan</option>

    ...

    <option value="GB">United Kingdom</option>

    <option value="US" selected="selected">United States</option>

    <option value="UM">United States Minor Outlying Islands</option>

    <option value="UY">Uruguay</option>

    ...

    </select>

    ```


    The date helpers can accept an additional format parameter to force a culture-independent
    display, but you shouldn’t use it if your application is internationalized.


    # Getting Data from a Localized Input


    If it is necessary to show data in the user’s culture, as for retrieving data,
    you should, as

    much as possible, push users of your application to input already internationalized
    data. This

    approach will save you from trying to figure out how to convert data with varying
    formats and

    uncertain locality. For instance, who might enter a monetary value with comma
    separators in

    an input box?


    You can frame the user input format either by hiding the actual data (as in a

    `select_country_tag()`) or by separating the different components of complex data
    into

    several simple inputs.


    For dates, however, this is often not possible. Users are used to entering dates
    in their

    cultural format, and you need to be able to convert such data to an internal (and

    international) format. This is where the sfI18N class applies. Listing 13-5 demonstrates
    how

    this class is used.


    # Listing 13-5 - Getting a Date from a Localized Format in an Action


    ```

    $date= $request->getParameter(''birth_date'');

    $user_culture = $this->getUser()->getCulture();


    // Getting a timestamp

    $timestamp = $this->getContext()->getI18N()->getTimestampForCulture($date,

    $user_culture);


    // Getting a structured date

    list($d, $m, $y) =

    $this->getContext()->getI18N()->getDateForCulture($date, $user_culture);

    ```


    # Text Information in the Database


    A localized application offers different content according to the user’s culture.
    For instance,

    an online shop can offer products worldwide at the same price, but with a custom
    description

    for every country. This means that the database must be able to store different
    versions of a

    given piece of data, and for that, you need to design your schema in a particular
    way and use

    culture each time you manipulate localized model objects.'
