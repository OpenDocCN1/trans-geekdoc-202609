    ```\n```\n\nThe controller becomes easier to read. Its sole task is to get the\
    \ data from the model and pass it to the view. In more complex applications, the\
    \ controller also deals with the request, the user session, the authentication,\
    \ and so on. The use of explicit names for the functions of the model even makes\
    \ code comments unnecessary in the controller.\n\nThe model script is dedicated\
    \ to data access and can be organized accordingly. All parameters that don’t depend\
    \ on the data layer (like request parameters) must be given by the controller\
    \ and not accessed directly by the model. The model functions can be easily reused\
    \ in another controller.\n\n# Layer Separation Beyond MVC\n\nSo the principle\
    \ of the MVC architecture is to separate the code into three layers, according\
    \ to its nature. Data logic code is placed within the model, presentation code\
    \ within the view, and application logic within the controller.\n\nOther additional\
    \ design patterns can make the coding experience even easier. The model, view,\
    \ and controller layers can be further subdivided.\n\n# Database Abstraction\n\
    \nThe model layer can be split into a data access layer and a database abstraction\
    \ layer. That way, data access functions will not use database-dependent query\
