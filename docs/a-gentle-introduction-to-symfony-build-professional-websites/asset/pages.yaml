    {

    // Doctrine

    //article =

    Doctrine::getTable(''Article'')->find($request->getParameter(''id''));


    // Propel

    $article = ArticlePeer::retrieveByPK($request->getParameter(''id''));


    if (!$article)

    {

    $this->forward404();

    }

    }

    ```


    If you are looking for the error 404 action and template, you will find them in
    the $sf_symfony_ lib_dir/controller/default/ directory. You can customize this
    page by adding a new default module to your application, overriding the one located
    in'
