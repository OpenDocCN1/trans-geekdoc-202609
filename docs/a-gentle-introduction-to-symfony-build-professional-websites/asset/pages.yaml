    # A few words about charsets


    Dealing with internationalized content in templates often leads to problems with
    charsets. If you use a localized charset, you will need to change it each time
    the user changes culture. In addition, the templates written in a given charset
    will not display the characters of another charset properly.


    This is why, as soon as you deal with more than one culture, all your templates
    must be saved in UTF-8, and the layout must declare the content with this charset.
    You won''t have any unpleasant surprises if you always work with UTF-8, and you
    will save yourself from a big headache.


    Symfony applications rely on one central setting for the charset, in the settings.yml
    file. Changing this parameter will change the content-type header of all responses.


    ```

    all:

    .settings:

    charset: utf-8

    ```


    # Calling the Translation Helper Outside a Template


    Not all the text that is displayed in a page comes from templates. That’s why
    you often need to call the __() helper in other parts of your application: actions,
    filters, model classes, and so on. Listing 13-19 shows how to call the helper
    in an action by retrieving the current instance of the I18N object through the
    context singleton.


    # Listing 13-19 - Calling __() in an Action


    ```

    $this->getContext()->getI18N()->__($text, $args, ''messages'');

    ```


    # Summary


    Handling internationalization and localization in web applications is painless
    if you know how to deal with the user culture. The helpers automatically take
    it into account to output correctly formatted data, and the localized content
    from the database is seen as if it were part of a simple table. As for the interface
    translation, the __() helper and XLIFF dictionary ensure that you will have maximum
    versatility with minimum work.'
