- pgno: 220
  md: "# Culture in the URL\n\nWhen using symfony's localization and internationalization\
    \ features, pages tend to have different versions for a single URL—it all depends\
    \ on the user session. This prevents you from caching or indexing your pages in\
    \ a search engine.\n\nOne solution is to make the culture appear in every URL,\
    \ so that translated pages can be seen as different URLs to the outside world.\
    \ In order to do that, add the :sf_culture token in every rule of your application\
    \ routing.yml:\n\n```\npage:\n  url: /:sf_culture/:page\n  param: ...\n  requirements:\
    \ { sf_culture: (?:fr|en|de) }\n\narticle:\n  url: /:sf_culture/:year/:month/:day/:slug\n\
    \  param: ...\n  requirements: { sf_culture: (?:fr|en|de) }\n```\n\nTo avoid manually\
    \ setting the sf_culture request parameter in every link_to(), symfony automatically\
    \ adds the user culture to the default routing parameters. It also works inbound\
    \ because symfony will automatically change the user culture if the sf_culture\
    \ parameter is found in the URL.\n\n# Determining the Culture Automatically\n\n\
    In many applications, the user culture is defined during the first request, based\
    \ on the browser preferences. Users can define a list of accepted languages in\
    \ their browser, and this data is sent to the server with each request, in the\
    \ Accept-Language HTTP header. You can retrieve it in symfony through the sfWebRequest\
    \ object. For instance, to get the list of preferred languages of a user in an\
    \ action, type this:\n\n```\n$languages = $request->getLanguages();\n```\n\nThe\
    \ HTTP header is a string, but symfony automatically parses it and converts it\
    \ into an array. So the preferred language of the user is accessible with $languages[0]\
    \ in the preceding example.\n\nIt can be useful to automatically set the user\
    \ culture to its preferred browser language in a site home page or in a filter\
    \ for all pages. But as your website will probably only support a limited set\
    \ of languages, it's better to use the getPreferredCulture() method. It returns\
    \ the best language by comparing the user preferred languages and the supported\
    \ languages:\n\n```\n$language = $request->getPreferredCulture(array('en', 'fr'));\
    \ // the website is available in English and French\n```\n\nIf there is no match,\
    \ the method returns the first supported language (en in the preceding example).\n\
    \n> The Accept-Language HTTP header is not very reliable information, since users\
    \ rarely know how to modify it in their browser. Most of the time, the preferred\
    \ browser language is the language of the interface, and browsers are not available\
    \ in all languages. If you decide to set the culture automatically according to\
    \ the browser preferred language, make sure you provide a way for the user to\
    \ choose an alternate language."
  merge: -1
  img_proc: true
- pgno: 221
  md: '# Standards and Formats


    The internals of a web application don''t care about cultural particularities.
    Databases, for instance, use international standards to store dates, amounts,
    and so on. But when data is sent to or retrieved from users, a conversion needs
    to be made. Users won''t understand timestamps, and they will prefer to declare
    their mother language as Français instead of French. So you will need assistance
    to do the conversion automatically, based on the user culture.


    # Outputting Data in the User''s Culture


    Once the culture is defined, the helpers depending on it will automatically have
    proper output. For instance, the format_number() helper automatically displays
    a number in a format familiar to the user, according to its culture, as shown
    in Listing 13-3.


    # *Listing 13-3 - Displaying a Number for the User''s Culture*


    ```

    <?php use_helper(''Number'') ?>

    <?php $sf_user->setCulture(''en_US'') ?>

    <?php echo format_number(12000.10) ?>

    => ''12,000.10''


    <?php $sf_user->setCulture(''fr_FR'') ?>

    <?php echo format_number(12000.10) ?>

    => ''12 000,10''

    ```


    You don''t need to explicitly pass the culture to the helpers. They will look
    for it themselves in the current session object. Listing 13-4 lists helpers that
    take into account the user culture for their output.


    # *Listing 13-4 - Culture-Dependent Helpers*


    ```

    <?php use_helper(''Date'') ?>

    <?php echo format_date(time()) ?>

    => ''9/14/10''


    <?php echo format_datetime(time()) ?>

    => ''September 14, 2010 6:11:07 PM CEST''


    <?php use_helper(''Number'') ?>

    <?php echo format_number(12000.10) ?>

    => ''12,000.10''


    <?php echo format_currency(1350, ''USD'') ?>

    => ''$1,350.00''


    <?php use_helper(''I18N'') ?>

    <?php echo format_country(''US'') ?>

    => ''United States''


    <?php format_language(''en'') ?>

    => ''English''


    <?php use_helper(''Form'') ?>

    ```'
  merge: -1
