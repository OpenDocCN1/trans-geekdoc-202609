- pgno: 368
  md: "| SQL | Criteria |\n| --- | --- |\n| FROM table1 LEFT JOIN table2 ON table1.coll\
    \ = table2.col2 | ->addJoin(coll, col2, Criteria::LEFT_JOIN) |\n| FROM table1\
    \ RIGHT JOIN table2 ON table1.coll = table2.col2 | ->addJoin(coll, col2, Criteria::RIGHT_JOIN)\
    \ |\n\n> The best way to discover and understand which methods are available in\
    \ generated classes is to look at the Base files in the lib/model/om/ folder after\
    \ generation. The method names are pretty explicit, but if you need more comments\
    \ on them, set the propel.builder.addComments parameter to true in the config/propel.ini\
    \ file and rebuild the model.\n\nListing 8-14 shows another example of Criteria\
    \ with multiple conditions. It retrieves all the comments by Steve on articles\
    \ containing the word “enjoy,” ordered by date.\n\n# Listing 8-14 - Another Example\
    \ of Retrieving Records by Criteria with doSelect()—Criteria with Conditions\n\
    \n```\n$c = new Criteria();\n$c->add(CommentPeer::AUTHOR, 'Steve');\n$c->addJoin(CommentPeer::ARTICLE_ID,\
    \ ArticlePeer::ID);\n$c->add(ArticlePeer::CONTENT, '%enjoy%', Criteria::LIKE);\n\
    $c->addAscendingOrderByColumn(CommentPeer::CREATED_AT);\n$comments = CommentPeer::doSelect($c);\n\
    ```\n\n```\n// Will result in the following SQL query\nSELECT blog_comment.ID,\
    \ blog_comment.ARTICLE_ID, blog_comment.AUTHOR,\n       blog_comment.CONTENT,\
    \ blog_comment.CREATED_AT\nFROM   blog_comment, blog_article\nWHERE  blog_comment.AUTHOR\
    \ = 'Steve'\n       AND blog_article.CONTENT LIKE '%enjoy%'\n       AND blog_comment.ARTICLE_ID\
    \ = blog_article.ID\nORDER BY blog_comment.CREATED_AT ASC\n```\n\nJust as SQL\
    \ is a simple language that allows you to build very complex queries, the Criteria\
    \ object can handle conditions with any level of complexity. But since many developers\
    \ think first in SQL before translating a condition into object-oriented logic,\
    \ the Criteria object may be difficult to comprehend at first. The best way to\
    \ understand it is to learn from examples and sample applications. The symfony\
    \ project website, for instance, is full of Criteria building examples that will\
    \ enlighten you in many ways.\n\nIn addition to the doSelect() method, every peer\
    \ class has a doCount() method, which simply counts the number of records satisfying\
    \ the criteria passed as a parameter and returns the count as an integer. As there\
    \ is no object to return, the hydrating process doesn’t occur in this case, and\
    \ the doCount() method is faster than doSelect().\n\nThe peer classes also provide\
    \ doDelete(), doInsert(), and doUpdate() methods, which all expect a Criteria\
    \ as a parameter. These methods allow you to issue DELETE, INSERT, and UPDATE\
    \ queries to your database. Check the generated peer classes in your model for\
    \ more details on these Propel methods.\n\nFinally, if you just want the first\
    \ object returned, replace doSelect() with a doSelectOne() call. This may be the\
    \ case when you know that a Criteria will return only one result, and the advantage\
    \ is that this method returns an object rather than an array of objects."
  merge: -1
