    The behavior of the checkElement() method depends on the type of the second argument

    that it receives:


    +   • If it is a Boolean, it checks that an element matching the CSS selector
    exists.

    +   • If it is an integer, it checks that the CSS selector returns this number
    of results.

    +   • If it is a regular expression, it checks that the first element found by
    the CSS

    +   selector matches it.

    +   • If it is a regular expression preceded by !, it checks that the first element
    doesn''t

    +   match the pattern.

    +   • For other cases, it compares the first element found by the CSS selector
    with the

    +   second argument as a string.


    The method accepts a third optional parameter, in the shape of an associative
    array. It allows

    you to have the test performed not on the first element returned by the selector
    (if it returns

    several), but on another element at a certain position, as shown in Listing 15-23.


    # Listing 15-23 - Using the Position Option to Match an Element at a Certain Position


    ```

    $b = new sfTestFunctional(new sfBrowser());

    $b->get(''/foobar/edit?id=1'')->

    with(''response'')->begin()->

    checkElement(''form textarea'', ''foo'')->

    checkElement(''form textarea'', ''bar'', array(''position'' => 1))->

    end();

    ;

    ```


    The options array can also be used to perform two tests at the same time. You
    can test that

    there is an element matching a selector and how many there are, as demonstrated
    in Listing 15-24.


    # Listing 15-24 - Using the Count Option to Count the Number of Matches


    ```

    $b = new sfTestFunctional(new sfBrowser());

    $b->get(''/foobar/edit?id=1'')->

    with(''response'')->checkElement(''form input'', true, array(''count'' => 3));

    ```


    The selector tool is very powerful. It accepts most of the CSS 3 selectors, and
    you can use it

    for complex queries such as those of Listing 15-25.


    # Listing 15-25 - Example of Complex CSS Selectors Accepted by checkElement()


    ```

    ->checkElement(''ul#list li a[href]'', ''click me'');

    ->checkElement(''ul > li'', ''click me'');

    ->checkElement(''ul + li'', ''click me'');

    ->checkElement(''h1, h2'', ''click me'');

    ->checkElement(''a[class$="foo"][href*="bar.html"]'', ''my link'');

    ->checkElement(''p:last ul:nth-child(2) li:contains("Some text")'');

    ```


