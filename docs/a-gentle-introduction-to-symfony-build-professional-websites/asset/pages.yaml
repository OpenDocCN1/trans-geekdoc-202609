  md: "caching (see Chapter 12), and if caching is not an option, then switch to simple\
    \ include statements.\n\nAs for slots, the difference in performance is perceptible.\
    \ The process time necessary to set and include a slot is negligible—it is equivalent\
    \ to a variable instantiation. Slots are always cached within the template that\
    \ includes them.\n\n# Speeding Up the Routing Process\n\nAs explained in Chapter\
    \ 9, every call to a link helper in a template asks the routing system to process\
    \ an internal URI into an external URL. This is done by finding a match between\
    \ the URI and the patterns of the routing.yml file. Symfony does it quite simply:\
    \ It tries to match the first rule with the given URI, and if it doesn't work,\
    \ it tries with the following, and so on. As every test involves regular expressions,\
    \ this is quite time consuming.\n\nThere is a simple workaround: Use the rule\
    \ name instead of the module/action couple. This will tell symfony which rule\
    \ to use, and the routing system won't lose time trying to match all previous\
    \ rules.\n\nIn concrete terms, consider the following routing rule, defined in\
    \ your routing.yml file:\n\n```\narticle_by_id:\n  url:   /article/:id\n  param:\
    \ { module: article, action: read }\n```\n\nThen instead of outputting a hyperlink\
    \ this way:\n\n```\n<php echo link_to('my article', 'article/read?id='.$article->getId())\
    \ ?>\n```\n\nyou should use the fastest version:\n\n```\n<php echo link_to('my\
    \ article', 'article_by_id', array('id' =>\n$article->getId())) ?>\n```\n\nThe\
    \ difference starts being noticeable when a page includes a few dozen routed hyperlinks.\n\
    \n# Skipping the Template\n\nUsually, a response is composed of a set of headers\
    \ and content. But some responses don't need content. For instance, some Ajax\
    \ interactions need only a few pieces of data from the server in order to feed\
    \ a JavaScript program that will update different parts of the page. For this\
    \ kind of short response, a set of headers alone is faster to transmit. As discussed\
    \ in Chapter 11, an action can return only a JSON header. Listing 18-12 reproduces\
    \ an example from Chapter 11.\n\nListing 18-12 - Example Action Returning a JSON\
    \ Header\n\n```\npublic function executeRefresh()\n{\n  $output = '{\"title\"\
    :\"My basic letter\",\"name\":\"Mr Brown\"}';\n  $this->getResponse()->setHttpHeader(\"\
    X-JSON\", '('.$output.')');\n\n  return sfView::HEADER_ONLY;\n}\n```\n\nThis skips\
    \ the template and the layout, and the response can be sent at once. As it contains\
    \ only headers, it is more lightweight and will take less time to transmit to\
    \ the user."
