  md: "# # Functional Tests\n\nFunctional tests validate parts of your applications.\
    \ They simulate a browsing session, make requests, and check elements in the response,\
    \ just like you would do manually to validate that an action does what it’s supposed\
    \ to do. In functional tests, you run a scenario corresponding to a use case.\n\
    \n# ## What Do Functional Tests Look Like?\n\nYou could run your functional tests\
    \ with a text browser and a lot of regular expression assertions, but that would\
    \ be a great waste of time. Symfony provides a special object, called sfBrowser,\
    \ which acts like a browser connected to a symfony application without actually\
    \ needing a server—and without the slowdown of the HTTP transport. It gives access\
    \ to the core objects of each request (the request, session, context, and response\
    \ objects). Symfony also provides a sfTestFunctional, designed especially for\
    \ functional tests, which takes a sfBrowser object and adds some smart assert\
    \ methods.\n\nA functional test traditionally starts with an initialization of\
    \ a test browser object. This object makes a request to an action and verifies\
    \ that some elements are present in the response.\n\nFor example, every time you\
    \ generate a module skeleton with the generate:module or the propel:generate-module\
    \ tasks, symfony creates a simple functional test for this module. The test makes\
    \ a request to the default action of the module and checks the response status\
    \ code, the module and action calculated by the routing system, and the presence\
    \ of a certain sentence in the response content. For a foobar module, the generated\
    \ foobarActionsTest.php file looks like Listing 15-11.\n\nListing 15-11 - Default\
    \ Functional Test for a New Module, in tests/functional/frontend/foobarActionsTest.php\n\
    \n```\n<?php\n\ninclude dirname(__FILE__).'/../../../bootstrap/functional.php';\n\
    \n$browser = new sfTestFunctional(new sfBrowser());\n\n$browser->\n  get('/foobar/index')->\n\
    \  with('request')->begin()-\n    isParameter('module', 'foobar')->\n    isParameter('action',\
    \ 'index')->\n  end()->\n  with('response')->begin()->\n    isStatusCode(200)->\n\
    \    checkElement('body', '!/This is a temporary page/')->\n  end()\n;\n\n```\n\
    \n> > The browser methods return an sfTestFunctional object, so you can chain\
    \ the method calls for more readability of your test files. This is called a fluid\
    \ interface to the object, because nothing stops the flow of method calls.\n\n\
    A functional test can contain several requests and more complex assertions; you\
    \ will soon discover all the possibilities in the upcoming sections."
  merge: -1
  img_proc: true
