    ```\n```\n\n# # Refactoring to the Data layer\n\nWhen developing a symfony project,\
    \ you often start by writing the domain logic code in the actions. But the database\
    \ queries and model manipulation should not be stored in the controller layer.\
    \ So all the logic related to the data should be moved to the model layer. Whenever\
    \ you need to do the same request in more than one place in your actions, think\
    \ about transferring the related code to the model. It helps to keep the actions\
    \ short and readable.\n\nFor example, imagine the code needed in a blog to retrieve\
    \ the ten most popular articles for a given tag (passed as request parameter).\
    \ This code should not be in an action, but in the model. In fact, if you need\
    \ to display this list in a template, the action should simply look like this:\n\
    \n```\n```php\npublic function executeShowPopularArticlesForTag($request)\n{\n\
    \  $tag = TagPeer::retrieveByName($request->getParameter('tag'));\n  $this->forward404Unless($tag);\n\
    \  $this->articles = $tag->getPopularArticles(10);\n}\n```\n```\n\nThe action\
    \ creates an object of class Tag from the request parameter. Then all the code\
    \ needed to query the database is located in a getPopularArticles() method of\
    \ this class. It makes the action more readable, and the model code can easily\
    \ be reused in another action.\n\nMoving code to a more appropriate location is\
    \ one of the techniques of refactoring. If you do it often, your code will be\
    \ easy to maintain and to understand by other developers. A good rule of thumb\
    \ about when to do refactoring to the data layer is that the code of an action\
    \ should rarely contain more than ten lines of PHP code.\n\n# # Database Connections\n\
    \nThe data model is independent from the database used, but you will definitely\
    \ use a database. The minimum information required by symfony to send requests\
    \ to the project database is the name, the credentials, and the type of database.These\
    \ connection settings can be configured by passing a data source name (DSN) to\
    \ the configure:database task:\n\n```\n```bash\n$ php symfony configure:database\
    \ \"mysql:host=localhost;dbname=blog\" root\nmYsEcret\n```\n```\n\nThe connection\
    \ settings are environment-dependent. You can define distinct settings for the\
    \ prod, dev, and test environments, or any other environment in your application\
    \ by using the env option:"
