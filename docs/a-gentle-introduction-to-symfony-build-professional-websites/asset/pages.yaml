    # Working in the Test Environment


    The sfTestFunctional object uses a special front controller, set to the test environment.
    The default configuration for this environment appears in Listing 15-27.


    # Listing 15-27 - Default Test Environment Configuration, in frontend/config/settings.yml


    ```

    test:

    .settings:

    error_reporting: <?php echo ((E_ALL | E_STRICT) ^

    E_NOTICE)."\n" ?>

    cache: false

    web_debug: false

    no_script_name: false

    etag: false

    ```


    The cache and the web debug toolbar are set to false in this environment. However,
    the code execution still leaves traces in a log file, distinct from the dev and
    prod log files, so that you can check it independently (myproject/log/frontend_test.log).
    In this environment, the exceptions don''t stop the execution of the scripts—so
    that you can run an entire set of tests even if one fails. You can have specific
    database connection settings, for instance, to use another database with test
    data in it.


