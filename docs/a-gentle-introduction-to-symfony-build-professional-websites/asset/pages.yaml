- pgno: 139
  md: "schema, by listing them for each table, together with their parameters, under\
    \ the actAs key. Listing 8-34 gives an example by extending the Article class\
    \ with the Sluggable behavior.\n\n# Listing 8-34 - Behaviors Declaration\n\n```\n\
    Article:\n  actAs: [Sluggable]\n  # ...\n```\n\n# Don't Create the Model Twice\n\
    \nThe trade-off of using an ORM is that you must define the data structure twice:\
    \ once for the database, and once for the object model. Fortunately, symfony offers\
    \ command-line tools to generate one based on the other, so you can avoid duplicate\
    \ work.\n\n# Building a SQL Database Structure Based on an Existing Schema\n\n\
    If you start your application by writing the schema.yml file, symfony can generate\
    \ a SQL query that creates the tables directly from the YAML data model. To use\
    \ the query, go to your root project directory and type this:\n\n```\n$ php symfony\
    \ doctrine:build-sql\n```\n\nA schema.sql file will be created in myproject/data/sql/.\
    \ Note that the generated SQL code will be optimized for the database system defined\
    \ in the databases.yml.\n\nYou can use the schema.sql file directly to build the\
    \ tables. For instance, in MySQL, type this:\n\n```\n$ mysqladmin -u root -p create\
    \ blog\n$ mysql -u root -p blog < data/sql/schema.sql\n```\n\nThe generated SQL\
    \ is also helpful to rebuild the database in another environment, or to change\
    \ to another DBMS.\n\n> > The command line also offers a task to populate your\
    \ database with data based on a text file. See Chapter 16 for more information\
    \ about the doctrine:data-load task and the YAML fixture files.\n\n# Generating\
    \ a YAML Data Model from an Existing Database\n\nSymfony can use Doctrine to generate\
    \ a schema.yml file from an existing database, thanks to introspection (the capability\
    \ of databases to determine the structure of the tables on which they are operating).\
    \ This can be particularly useful when you do reverse-engineering, or if you prefer\
    \ working on the database before working on the object model.\n\nIn order to do\
    \ this, you need to make sure that the project databases.yml file points to the\
    \ correct database and contains all connection settings, and then call the doctrine:build-schema\
    \ command:\n\n```\n$ php symfony doctrine:build-schema\n```\n\nA brand-new schema.yml\
    \ file built from your database structure is generated in the config/doctrine/\
    \ directory. You can build your model based on this schema."
