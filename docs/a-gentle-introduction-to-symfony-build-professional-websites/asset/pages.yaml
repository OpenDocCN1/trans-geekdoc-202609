    # Using symfony outside of a web context


    You may want to execute a script from the command line (or via a cron table) with
    access to all the symfony classes and features, for instance to launch batch e-mail
    jobs or to periodically update your model through a process-intensive calculation.
    The simple way of doing this is to create a PHP script that reproduces the first
    steps of a front controller, so that symfony is properly initialized. You can
    also use the symfony command line system, to take advantage of arguments parsing
    and automated database initialization.


    # Batch Files


    Initializing symfony just takes a couple lines of PHP code. You can take advantage
    of all symfony features by creating a PHP file, for instance under the lib/ directory
    of your project, starting with the lines shown in Listing 16-12.


    # Listing 16-12 - Sample Batch Script, in lib/myScript.php'
