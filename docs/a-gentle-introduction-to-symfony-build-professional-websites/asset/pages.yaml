- pgno: 302
  md: '# Displaying an unavailable page when clearing the cache


    If you set the check_lock parameter to true in the settings.yml file, symfony
    will lock the application when the cache is being cleared, and all the requests
    arriving before the cache is finally cleared are then redirected to a page saying
    that the application is temporarily unavailable. If the cache is large, the delay
    to clear it may be longer than a few milliseconds, and if your site’s traffic
    is high, this is a recommended setting. This unavailable page is the same as the
    one displayed when you call the symfony disable task. The check_lock parameter
    is deactivated by default because it has a very slight negative impact on performance.


    The project:clear-controllers task clears the web/ directory of all controllers
    other than the ones running in a production environment. If you do not include
    the development front controllers in the rsync_exclude.txt file, this command
    guarantees that a backdoor will not reveal the internals of your application.


    ```

    $ php symfony project:clear-controllers

    ```


    The permissions of the project files and directories can be broken if you use
    a checkout from an SVN repository. The project:permissions task fixes directory
    permissions, to change the log/ and cache/ permissions to 0777, for example (these
    directories need to be writable for the framework to work correctly).


    ```

    $ php symfony project:permissions

    ```


    # Summary


    By combining PHP logs and symfony logs, you can monitor and debug your application
    easily. During development, the debug mode, the exceptions, and the web debug
    toolbar help you locate problems. You can even insert custom messages in the log
    files or in the toolbar for easier debugging.


    The command-line interface provides a large number of tools that facilitate the
    management of your applications, during development and production phases. Among
    others, the data population, and synchronization tasks are great time-savers.'
  merge: -1
  img_proc: true
- pgno: 303
  md: "# # Chapter 17\n# Extending Symfony\n\nEventually, you will need to alter symfony’s\
    \ behavior. Whether you need to modify the way a certain class behaves or add\
    \ your own custom features, themoment will inevitably happen because all clients\
    \ have specific requirements that no framework can forecast. Actually, this situation\
    \ is so common that symfony provides a mechanism to extend existing classes at\
    \ runtime, beyond simple class inheritance. You can even replace the core symfony\
    \ classes by modifying the factories settings. Once you have built an extension,\
    \ you can easily package it as a plug-in, so that it can be reused in other applications,\
    \ or by other symfony users.\n\n# ## Events\n\nPHP does not support multiple inheritance,\
    \ which means it is not possible to have a class extend more than one other class.\
    \ Also it is not possible to add new methods to an existing class or override\
    \ existing methods. To ease these two limitations and to make the framework truly\
    \ extendable, symfony introduces an event system, inspired by the Cocoa notification\
    \ center, and based on the Observer design pattern⁵⁸.\n\n# ## Understanding Events\n\
    \nSome of the symfony classes “notify the dispatcher of an event” at various moments\
    \ of their life. For instance, when the user changes their culture, the user object\
    \ notifies that a change_culture event has occurred. This is like a shout in the\
    \ project’s space, saying: “I’m doing that. Do whatever you want about it”.\n\n\
    You can decide to do something special when an event is fired. For instance, you\
    \ could save the user culture to a database table each time the change_culture\
    \ event occurs. In order to do so, you need to register an event listener, in\
    \ other words you must declare a function that will be called when the event occurs.\
    \ Listing 17-1 shows how to register a listener on the user’s change_culture event.\n\
    \n```\nListing 17-1 - Registering an Event Listener\n\n$dispatcher->connect('user.change_culture',\
    \ 'changeUserCulture');\n\nfunction changeUserCulture(sfEvent $event)\n{\n   \
    \ $user = $event->getSubject();\n    $culture = $event['culture'];\n}\n```"
