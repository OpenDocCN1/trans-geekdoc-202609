- pgno: 146
  md: '# Listing 9-6 - Default Rewriting Rules for Apache, in myproject/web/.htaccess


    ```

    <IfModule mod_rewrite.c>

    RewriteEngine On


    # uncomment the following line, if you are having trouble

    # getting no_script_name to work

    #RewriteBase /


    # we skip all files with .something

    #RewriteCond %{REQUEST_URI} \..+$

    #RewriteCond %{REQUEST_URI} !\.html$

    #RewriteRule .* - [L]


    # we check if the .html version is here (caching)

    RewriteRule ^$ index.html [QSA]

    RewriteRule ^([^.]+)$ $1.html [QSA]

    RewriteCond %{REQUEST_FILENAME} !-f


    # no, so we redirect to our front web controller

    RewriteRule ^(.*)$ index.php [QSA,L]

    </IfModule>

    ```


    The web server inspects the shape of the URLs it receives. If the URL does not
    contain a suffix (commented out by default) and if there is no cached version
    of the page available (Chapter 12 covers caching), then the request is handed
    to index.php.


    However, the web/ directory of a symfony project is shared among all the applications
    and environments of the project. It means that there is usually more than one
    front controller in the web directory. For instance, a project having a frontend
    and a backend application, and a dev and prod environment, contains four front
    controller scripts in the web/ directory:


    +   index.php           // frontend in prod

    +   frontend_dev.php    // frontend in dev

    +   backend.php         // backend in prod

    +   backend_dev.php     // backend in dev


    The mod_rewrite settings can specify only one default script name. If you set
    no_script_name to true for all the applications and environments, all URLs will
    be interpreted as requests to the frontend application in the prod environment.
    This is why you can have only one application with one environment taking advantage
    of the URL rewriting for a given project.


    > There is a way to have more than one application with no script name. Just create
    subdirectories in the web root, and move the front controllers inside them. Change
    the path to the ProjectConfiguration file accordingly, and create the .htaccess
    URL rewriting configuration that you need for each application.


    # Link Helpers


    Because of the routing system, you should use link helpers instead of regular
    <a> tags in your templates. Don''t look at it as a hassle, but rather as an opportunity
    to keep your application clean and easy to maintain. Besides, link helpers offer
    a few very useful shortcuts that you don''t want to miss.'
  merge: -1
  img_proc: true
- pgno: 147
  md: '# Hyperlinks, Buttons, and Forms


    You already know about the link_to() helper. It outputs an XHTML-compliant hyperlink,
    and it expects two parameters: the element that can be clicked and the internal
    URI of the resource to which it points. If, instead of a hyperlink, you want a
    button, use the button_to() helper. Forms also have a helper to manage the value
    of the action attribute. You will learn more about forms in the next chapter.
    Listing 9-7 shows some examples of link helpers.


    Listing 9-7 - Link Helpers for <a>, <input>, and <form> Tags


    ```

    // Hyperlink on a string

    <?php echo link_to(''my article'', ''article/read?title=Finance_in_France'') ?>

    => <a href="/routed/url/to/Finance_in_France">my article</a>


    // Hyperlink on an image

    <?php echo link_to(image_tag(''read.gif''), ''article/

    read?title=Finance_in_France'') ?>

    => <a href="/routed/url/to/Finance_in_France"><img

    src="http://www.symfony-project.org/images/read.gif" /></a>


    // Button tag

    <?php echo button_to(''my article'', ''article/read?title=Finance_in_France'')

    ?>

    => <input value="my article"

    type="button"onclick="document.location.href=''/routed/url/to/

    Finance_in_France'';" />


    // Form tag

    <?php echo form_tag(''article/read?title=Finance_in_France'') ?>

    => <form method="post" action="/routed/url/to/Finance_in_France" />

    ```


    Link helpers can accept internal URIs as well as absolute URLs (starting with
    http://, and skipped by the routing system) and anchors. Note that in real-world
    applications, internal URIs are built with dynamic parameters. Listing 9-8 shows
    examples of all these cases.


    Listing 9-8 - URLs Accepted by Link Helpers


    ```

    // Internal URI

    <?php echo link_to(''my article'', ''article/read?title=Finance_in_France'') ?>

    => <a href="/routed/url/to/Finance_in_France">my article</a>


    // Internal URI with dynamic parameters

    <?php echo link_to(''my article'', ''article/

    read?title=''.$article->getTitle()) ?>


    // Internal URI with anchors

    <?php echo link_to(''my article'', ''article/

    read?title=Finance_in_France#foo'') ?>

    => <a href="/routed/url/to/Finance_in_France#foo">my article</a>


    // Absolute URL

    <?php echo link_to(''my article'', ''http://www.example.com/foobar.html'') ?>

    => <a href="http://www.example.com/foobar.html">my article</a>

    ```'
  merge: -1
  img_proc: true
- pgno: 148
  md: "# Link Helper Options\n\nAs explained in Chapter 7, helpers accept an additional\
    \ options argument, which can be an associative array or a string. This is true\
    \ for link helpers, too, as shown in Listing 9-9.\n\n# Listing 9-9 - Link Helpers\
    \ Accept Additional Options\n\n```\n// Additional options as an associative array\n\
    <?php echo link_to('my article', 'article/read?title=Finance_in_France',\narray(\n\
    \  'class' => 'foobar',\n  'target' => '_blank'\n)) ?>\n```\n\n```\n// Additional\
    \ options as a string (same result)\n<?php echo link_to('my article', 'article/\n\
    read?title=Finance_in_France','class=foobar target=_blank') ?>\n=> <a href=\"\
    /routed/url/to/Finance_in_France\" class=\"foobar\"\ntarget=\"_blank\">my article</a>\n\
    ```\n\nYou can also add one of the symfony-specific options for link helpers:\
    \ confirm and popup. The first one displays a JavaScript confirmation dialog box\
    \ when the link is clicked, and the second opens the link in a new window, as\
    \ shown in Listing 9-10.\n\n# Listing 9-10 - 'confirm' and 'popup' Options for\
    \ Link Helpers\n\n```\n<?php echo link_to('delete item', 'item/delete?id=123',\
    \ 'confirm=Are you\nsure?') ?>\n=> <a onclick=\"return confirm('Are you sure?');\"\
    \nhref=\"/routed/url/to/delete/123.html\">delete item</a>\n```\n\n```\n<?php echo\
    \ link_to('add to cart', 'shoppingCart/add?id=100', 'popup=true') ?>\n=> <a onclick=\"\
    window.open(this.href);return false;\"\nhref=\"/fo_dev.php/shoppingCart/add/id/100.html\"\
    >add to cart</a>\n```\n\n```\n<?php echo link_to('add to cart', 'shoppingCart/add?id=100',\
    \ array(\n  'popup' => array('popupWindow', 'width=310,height=400,left=320,top=0')\n\
    )) ?>\n=> <a onclick=\"window.open(this.href,'popupWindow',\n'width=310,height=400,left=320,top=0');return\
    \ false;\"\nhref=\"/fo_dev.php/shoppingCart/add/id/100.html\">add to cart</a>\n\
    ```\n\nThese options can be combined.\n\n# Fake GET and POST Options\n\nSometimes\
    \ web developers use GET requests to actually do a POST. For instance, consider\
    \ the following URL:\n\n```\nhttp://www.example.com/index.php/shopping_cart/add/id/100\n\
    ```\n\nThis request will change the data contained in the application, by adding\
    \ an item to a shopping cart object, stored in the session or in a database. This\
    \ URL can be bookmarked, cached, and indexed by search engines. Imagine all the\
    \ nasty things that might happen to the database or to the metrics of a website\
    \ using this technique. As a matter of fact, this request should be considered\
    \ as a POST, because search engine robots do not do POST requests on indexing."
  merge: -1
  img_proc: true
- pgno: 149
  md: "Symfony provides a way to transform a call to a link_to() or button_to() helper\
    \ into an actual POST. Just add a post=true option, as shown in Listing 9-11.\n\
    \n# Listing 9-11 - Making a Link Call a POST Request\n\n```\n<?php echo link_to('go\
    \ to shopping cart', 'shoppingCart/add?id=100',\narray('post' => true)) ?>\n==>\
    \ <a onclick=\"f = document.createElement('form');\ndocument.body.appendChild(f);\n\
    f.method = 'POST'; f.action = this.href; f.submit();return false;\"\nhref=\"/shoppingCart/add/id/100.html\"\
    >go to shopping cart</a>\n```\n\nThis <a> tag has an href attribute, and browsers\
    \ without JavaScript support, such as search engine robots, will follow the link\
    \ doing the default GET. So you must also restrict your action to respond only\
    \ to the POST method, by adding something like the following at the beginning\
    \ of the action:\n\n```\n$this->forward404Unless($this->getRequest()->isMethod('post'));\n\
    ```\n\nJust make sure you don't use this option on links located in forms, since\
    \ it generates its own <form> tag.\n\nIt is a good habit to tag as POST the links\
    \ that actually post data.\n\n# Forcing Request Parameters As GET Variables\n\n\
    According to your routing rules, variables passed as parameters to a link_to()\
    \ are transformed into patterns. If no rule matches the internal URI in the routing.yml\
    \ file, the default rule transforms module/action?key=value into /module/action/key/value,\
    \ as shown in Listing 9-12.\n\n# Listing 9-12 - Default Routing Rule\n\n```\n\
    <?php echo link_to('my article', 'article/read?title=Finance_in_France') ?>\n\
    ==> <a href=\"/article/read/title/Finance_in_France\">my article</a>\n```\n\n\
    If you actually need to keep the GET syntax—to have request parameters passed\
    \ under the ?key=value form—you should put the variables that need to be forced\
    \ outside the URL parameter, in the query_string option. As this would conflict\
    \ also with an anchor in the URL, you have to put it into the anchor option instead\
    \ of prepending it to the internal URI. All the link helpers accept these options,\
    \ as demonstrated in Listing 9-13.\n\n# Listing 9-13 - Forcing GET Variables with\
    \ the query_string Option\n\n```\n<?php echo link_to('my article', 'article/read',\
    \ array(\n  'query_string' => 'title=Finance_in_France',\n  'anchor' => 'foo'\n\
    )) ?>\n==> <a href=\"/article/read?title=Finance_in_France#foo\">my article</a>\n\
    ```\n\nA URL with request parameters appearing as GET variables can be interpreted\
    \ by a script on the client side, and by the $_GET and $_REQUEST variables on\
    \ the server side."
  merge: -1
  img_proc: true
- pgno: 150
  md: '# Asset helpers


    Chapter 7 introduced the asset helpers image_tag(), stylesheet_tag(), and javascript_include_tag(),
    which allow you to include an image, a style sheet, or a JavaScript file in the
    response. The paths to such assets are not processed by the routing system, because
    they link to resources that are actually located under the public web directory.


    You don''t need to mention a file extension for an asset. Symfony automatically
    adds .png, .js, or .css to an image, JavaScript, or style sheet helper call. Also,
    symfony will automatically look for those assets in the web/images/, web/js/,
    and web/css/ directories. Of course, if you want to include a specific file format
    or a file from a specific location, just use the full file name or the full file
    path as an argument.


    To fix the size of an image, use the size attribute. It expects a width and a
    height in pixels, separated by an x.


    ```

    <?php echo image_tag(''test'', ''size=100x20'') ?>

    => <img href="/images/test.png" width="100" height="20"/>

    ```


    If you want the asset inclusion to be done in the <head> section (for JavaScript
    files and style sheets), you should use the use_stylesheet() and use_javascript()
    helpers in your templates, instead of the _tag() versions in the layout. They
    add the asset to the response, and these assets are included before the </head>
    tag is sent to the browser.


    # Using Absolute Paths


    The link and asset helpers generate relative paths by default. To force the output
    to absolute paths, set the absolute option to true, as shown in Listing 9-14.
    This technique is useful for inclusions of links in an e-mail message, RSS feed,
    or API response.


    # Listing 9-14 - Getting Absolute URLs Instead of Relative URLs


    ```

    <?php echo url_for(''article/read?title=Finance_in_France'') ?>

    => ''/routed/url/to/Finance_in_France''

    <?php echo url_for(''article/read?title=Finance_in_France'', true) ?>

    => ''http://www.example.com/routed/url/to/Finance_in_France''


    <?php echo link_to(''finance'', ''article/read?title=Finance_in_France'') ?>

    => <a href="/routed/url/to/Finance_in_France">finance</a>

    <?php echo link_to(''finance'', ''article/

    read?title=Finance_in_France'',''absolute=true'') ?>

    => <a href=" http://www.example.com/routed/url/to/

    Finance_in_France">finance</a>


    // The same goes for the asset helpers

    <?php echo image_tag(''test'', ''absolute=true'') ?>

    <?php echo javascript_include_tag(''myscript'', ''absolute=true'') ?>

    ```'
