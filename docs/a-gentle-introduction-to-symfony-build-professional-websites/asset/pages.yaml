    the various parts of the form in HTML. The simplest way to do it is to call echo
    $form, and

    this will render all the fields as form controls with labels. You can also use
    the form object to

    generate the form tag:


    ```

    Listing 10-2

    // in modules/foo/templates/contactSuccess.php

    <?php echo $form->renderFormTag(''foo/contact'') ?>

