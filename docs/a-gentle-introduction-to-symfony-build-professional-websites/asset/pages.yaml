    Just like the partials, components accept additional parameters in the shape of
    an associative array. The parameters are available to the partial under their
    name, and in the component via the $this object. See Listing 7-13 for an example.


    # Listing 7-13 - Passing Parameters to a Component and Its Template


    ```

    // Call to the component

    <?php include_component(''news'', ''headlines'', array(''foo'' => ''bar'')) ?>


    // In the component itself

    echo $this->foo;

    => ''bar''


    // In the _headlines.php partial

    echo $foo;

    => ''bar''

    ```


    You can include components in components, or in the global layout, as in any regular
    template. Like actions, components'' execute methods can pass variables to the
    related partial and have access to the same shortcuts. But the similarities stop
    there. A component doesn''t handle security or validation, cannot be called from
    the Internet (only from the application itself), and doesn''t have various return
    possibilities. That''s why a component is faster to execute than an action.


    # Slots


    Partials and components are great for reusability. But in many cases, code fragments
    are required to fill a layout with more than one dynamic zone. For instance, suppose
    that you want to add some custom tags in the <head> section of the layout, depending
    on the content of the action. Or, suppose that the layout has one major dynamic
    zone, which is filled by the result of the action, plus a lot of other smaller
    ones, which have a default content defined in the layout but can be overridden
    at the template level.


    For these situations, the solution is a slot. Basically, a slot is a placeholder
    that you can put in any of the view elements (in the layout, a template, or a
    partial). Filling this placeholder is just like setting a variable. The filling
    code is stored globally in the response, so you can define it anywhere (in the
    layout, a template, or a partial). Just make sure to define a slot before including
    it, and remember that the layout is executed after the template (this is the'
