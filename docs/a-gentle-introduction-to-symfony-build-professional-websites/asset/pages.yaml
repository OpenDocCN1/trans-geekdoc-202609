  md: "# Dealing with multiple Schemas\n\nYou can have more than one schema per application.\
    \ Symfony will take into account every file ending with `schema.yml` or `schema.xml`\
    \ in the `config/` folder. If your application has many tables, or if some tables\
    \ don't share the same connection, you will find this approach very useful.\n\n\
    Consider these two schemas:\n\n```\n// In config/business-schema.yml\npropel:\n\
    \  blog_article:\n    _attributes: { phpName: Article }\n    id:\n    title: varchar(50)\n\
    \n// In config/stats-schema.yml\npropel:\n  stats_hit:\n    _attributes: { phpName:\
    \ Hit }\n    id:\n    resource: varchar(100)\n    created_at:\n```\n\nBoth schemas\
    \ share the same connection (propel), and the `Article` and `Hit` classes will\
    \ be generated under the same `lib/model/` directory. Everything happens as if\
    \ you had written only one schema.\n\nYou can also have different schemas use\
    \ different connections (for instance, propel and propel_bis, to be defined in\
    \ `databases.yml`) and organize the generated classes in subdirectories:\n\n```\n\
    // In config/business-schema.yml\npropel:\n  blog_article:\n    _attributes: {\
    \ phpName: Article, package: lib.model.business }\n    id:\n    title: varchar(50)\n\
    \n// In config/stats-schema.yml\npropel_bis:\n  stats_hit:\n    _attributes: {\
    \ phpName: Hit, package: lib.model.stat }\n    id:\n    resource: varchar(100)\n\
    \    created_at:\n```\n\nMany applications use more than one schema. In particular,\
    \ some plug-ins have their own schema and package to avoid messing with your own\
    \ classes (see Chapter 17 for details).\n\n# Column Details\n\nThe basic syntax\
    \ gives you two choices: let symfony deduce the column characteristics from its\
    \ name (by giving an empty value) or define the type with one of the type keywords.\
    \ Listing 8-26 demonstrates these choices.\n\n_Listing 8-26 - Basic Column Attributes_"
  merge: -1
  img_proc: true
- pgno: 377
  md: "```\npropel:\n  blog_article:\n    id: ~ # Let symfony do the work\n    title:\
    \ varchar(50) # Specify the type yourself\n```\n\nBut you can define much more\
    \ for a column. If you do, you will need to define column settings as an associative\
    \ array, as shown in Listing 8-27.\n\n# Listing 8-27 - Complex Column Attributes\n\
    \n```\npropel:\n  blog_article:\n    id: { type: integer, required: true, primaryKey:\
    \ true,\n      autoIncrement: true }\n    name: { type: varchar(50), default:\
    \ foobar, index: true }\n    group_id: { type: integer, foreignTable: db_group,\
    \ foreignReference:\n      id, onDelete: cascade }\n```\n\nThe column parameters\
    \ are as follows:\n\n+   * type: Column type. The choices are boolean, tinyint,\
    \ smallint, integer, bigint, double, float, real, decimal, char, varchar(size),\
    \ longvarchar, date, time, timestamp, bu_date, bu_timestamp, blob, and clob.\n\
    +   * required: Boolean. Set it to true if you want the column to be required.\n\
    +   * size: The size or length of the field for types that support it\n+   * scale:\
    \ Number of decimal places for use with decimal data type (size must also be specified)\n\
    +   * default: Default value.\n+   * primaryKey: Boolean. Set it to true for primary\
    \ keys.\n+   * autoIncrement: Boolean. Set it to true for columns of type integer\
    \ that need to take an auto-incremented value.\n+   * sequence: Sequence name\
    \ for databases using sequences for autoIncrement columns (for example, PostgreSQL\
    \ and Oracle).\n+   * index: Boolean. Set it to true if you want a simple index\
    \ or to unique if you want a unique index to be created on the column.\n+   *\
    \ foreignTable: A table name, used to create a foreign key to another table.\n\
    +   * foreignReference: The name of the related column if a foreign key is defined\
    \ via foreignTable.\n+   * onDelete: Determines the action to trigger when a record\
    \ in a related table is deleted. When set to setnull, the foreign key column is\
    \ set to null. When set to cascade, the record is deleted. If the database engine\
    \ doesn't support the set behavior, the ORM emulates it. This is relevant only\
    \ for columns bearing a foreignTable and a foreignReference.\n+   * isCulture:\
    \ Boolean. Set it to true for culture columns in localized content tables (see\
    \ Chapter 13).\n\n# Foreign Keys\n\nAs an alternative to the foreignTable and\
    \ foreignReference column attributes, you can add foreign keys under the _foreignKeys:\
    \ key in a table. The schema in Listing 8-28 will create a foreign key on the\
    \ user_id column, matching the id column in the blog_user table.\n\n# Listing\
    \ 8-28 - Foreign Key Alternative Syntax\n\n```\npropel:\n  blog_article:\n```"
