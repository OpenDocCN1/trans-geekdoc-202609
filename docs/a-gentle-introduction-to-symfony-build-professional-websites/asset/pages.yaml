    SQLite, Oracle, MSSQL, ...) out of the box. On top of PDO, symfony comes bundled
    with two ORM tools: Propel and Doctrine.


    When creating a new project, Doctrine is enabled by default. Configuring the database
    used by Doctrine is as simple as using the configure:database task:


