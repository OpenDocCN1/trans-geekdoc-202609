  md: "```\n<?php\n\nrequire_once(dirname(__FILE__).'/../config/ProjectConfiguration.class.php');\n\
    $configuration = ProjectConfiguration::getApplicationConfiguration('frontend',\
    \ 'dev', true);\n\n// Remove the following lines if you don't use the database\
    \ layer\n$databaseManager = new sfDatabaseManager($configuration);\n\n// add code\
    \ here\n```\n\nThis strongly looks like the first lines of a front controller\
    \ (see Chapter 6), because these lines do the same: initialize symfony, parse\
    \ a project and an application configuration. Note that the ProjectConfiguration::getApplicationConfiguration\
    \ method expects three parameters:\n\n+   * an application name\n+   * an environment\
    \ name\n+   * a Boolean, defining if the debug features should be enabled or not\n\
    \nTo execute your code, just call the script from the command line:\n\n```\n$\
    \ php lib/myScript.php\n```\n\n# Custom Tasks\n\nAn alternative way of creating\
    \ custom command line scripts using symfony is to write a **symfony task**. Just\
    \ like the `cache:clear` and the `propel:build-model` tasks, you can launch your\
    \ own custom tasks from the command line with `php symfony`. Custom tasks benefit\
    \ from the ability to parse command line arguments and options, can embed their\
    \ own help text, and can extend existing tasks.\n\nA custom task is just a class\
    \ extending `sfBaseTask` and located under a `lib/task/` directory, either under\
    \ the project root, or in a plugin directory. Its file name must end with `'Task.class.php'`.\
    \ Listing 16-13 shows a sample custom task.\n\nListing 16-13 - Sample Task, in\
    \ lib/task/testHelloTask.class.php\n\n```\n<?php\n\nclass testHelloTask extends\
    \ sfBaseTask\n{\n  protected function configure()\n  {\n    $this->namespace =\
    \ 'test';\n    $this->name = 'hello';\n    $this->briefDescription = 'Says hello';\n\
    \  }\n\n  protected function execute($arguments = array(), $options = array())\n\
    \  {\n    // your code here\n    $this->log('Hello, world!');\n  }\n}\n```\n\n\
    The code written in the execute method has access to all the symfony libraries,\
    \ just like in the previous batch script. The difference is how you call the custom\
    \ task:"
