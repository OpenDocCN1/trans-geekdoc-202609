  md: "# # Clearing Selective Parts of the Cache\n\nWhen the database is updated,\
    \ the cache of the actions related to the modified data must be cleared. You could\
    \ clear the whole cache, but that would be a waste for all the existing cached\
    \ actions that are unrelated to the model change. This is where the remove() method\
    \ of the sfViewCacheManager object applies. It expects an internal URI as argument\
    \ (the same kind of argument you would provide to a link_to()), and removes the\
    \ related action cache.\n\nFor instance, imagine that the update action of the\
    \ user module modifies the columns of a User object. The cached versions of the\
    \ list and show actions need to be cleared, or else the old versions, which contain\
    \ erroneous data, are displayed. To handle this, use the remove() method, as shown\
    \ in Listing 12-9.\n\n_Listing 12-9 - Clearing the Cache for a Given Action, in\
    \ modules/user/actions/actions.class.php_\n\n```\npublic function executeUpdate($request)\n\
