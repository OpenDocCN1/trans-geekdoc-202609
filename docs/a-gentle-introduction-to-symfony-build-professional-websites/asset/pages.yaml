  md: "```\n_behaviors:\n paranoid: { column: deleted_at }\n```\n\n# Beyond the schema.yml:\
    \ The schema.xml\n\nAs a matter of fact, the schema.yml format is internal to\
    \ symfony. When you call a propel-command, symfony actually translates this file\
    \ into a generated-schema.xml file, which is the type of file expected by Propel\
    \ to actually perform tasks on the model.\n\nThe schema.xml file contains the\
    \ same information as its YAML equivalent. For example, Listing 8-3 is converted\
    \ to the XML file shown in Listing 8-35.\n\nListing 8-35 - Sample schema.xml,\
    \ Corresponding to Listing 8-3\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<database name=\"propel\" defaultIdMethod=\"native\" noXsd=\"true\"\n package=\"\
    lib.model\">\n <table name=\"blog_article\" phpName=\"Article\">\n  <column name=\"\
    id\" type=\"integer\" required=\"true\"\n   primaryKey=\"true\"autoIncrement=\"\
    true\" />\n  <column name=\"title\" type=\"varchar\" size=\"255\" />\n  <column\
    \ name=\"content\" type=\"longvarchar\" />\n  <column name=\"created_at\" type=\"\
    timestamp\" />\n </table>\n <table name=\"blog_comment\" phpName=\"Comment\">\n\
    \  <column name=\"id\" type=\"integer\" required=\"true\"\n   primaryKey=\"true\"\
    autoIncrement=\"true\" />\n  <column name=\"article_id\" type=\"integer\" />\n\
    \  <foreign-key foreignTable=\"blog_article\">\n   <reference local=\"article_id\"\
    \ foreign=\"id\"/>\n  </foreign-key>\n  <column name=\"author\" type=\"varchar\"\
    \ size=\"255\" />\n  <column name=\"content\" type=\"longvarchar\" />\n  <column\
    \ name=\"created_at\" type=\"timestamp\" />\n </table>\n</database>\n```\n\nThe\
    \ description of the schema.xml format can be found in the documentation and the\
    \ “Getting Started” sections of the Propel project website70.\n\nThe YAML format\
    \ was designed to keep the schemas simple to read and write, but the trade-off\
    \ is that the most complex schemas can’t be described with a schema.yml file.\
    \ On the other hand, the XML format allows for full schema description, whatever\
