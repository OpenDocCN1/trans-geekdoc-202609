  md: "# Accessing Data\n\nIn symfony, your data is accessed through objects. If you\
    \ are used to the relational model and using SQL to retrieve and alter your data,\
    \ the object model methods will likely look complicated. But once you’ve tasted\
    \ the power of object orientation for data access, you will probably like it a\
    \ lot.\n\nBut first, let’s make sure we share the same vocabulary. Relational\
    \ and object data model use similar concepts, but they each have their own nomenclature:\n\
    \n| Relational | Object-Oriented |\n| --- | --- |\n| Table | Class |\n| Row, record\
    \ | Object |\n| Field, column | Property |\n\n# Retrieving the Column Value\n\n\
    When symfony builds the model, it creates one base object class for each of the\
    \ models defined in the schema.yml. Each of these classes comes with default accessors\
    \ and mutators based on the column definitions: The new, getXXX(), and setXXX()\
    \ methods help to create objects and give access to the object properties, as\
    \ shown in Listing 8-7.\n\n_Listing 8-7 - Generated Object Class Methods_\n\n\
    ```\n$article = new Article();\n$article->setTitle('My first article');\n$article->setContent(\"\
    This is my very first article.\\n Hope you enjoy it!\");\n\n$title = $article->getTitle();\n\
    $content = $article->getContent();\n```\n\n> > The generated object class is called\
    \ Article but is stored in a table named blog_article in the database. If the\
    \ tableName were not defined in the schema, the class would have been called article.\
    \ The accessors and mutators use a camelCase variant of the column names, so the\
    \ getTitle() method retrieves the value of the title column.\n\nTo set several\
    \ fields at one time, you can use the fromArray() method, also available for each\
    \ object class, as shown in Listing 8-8.\n\n_Listing 8-8 - The fromArray() Method\
    \ Is a Multiple Setter_\n\n```\n$article->fromArray(array(\n  'Title' => 'My first\
    \ article',\n  'Content' => 'This is my very first article.\\n Hope you enjoy\
    \ it!',\n));\n```\n\n# Retrieving Related Records\n\nThe article id column in\
    \ the blog_comment table implicitly defines a foreign key to the blog_article\
    \ table. Each comment is related to one article, and one article can have many\
    \ comments. The generated classes contain five methods translating this relationship\
    \ in an object-oriented way, as follows:"
