  md: "```\nedit: ~\nnew: ~\n```\n\nThis configuration is enough to generate the basic\
    \ administration. Any customization is added under the config key. Listing 14-4\
    \ shows a typical customized generator.yml.\n\n# Listing 14-4 - Typical Complete\
    \ Generator Configuration\n\n```\ngenerator:\n  class: sfPropelGenerator\n  param:\n\
    \    model_class:          BlogArticle\n    theme:                admin\n    non_verbose_templates:\
    \ true\n    with_show:            false\n    singular:             BlogArticle\n\
    \    plural:               BlogArticles\n    route_prefix:         blog_article\n\
    \    with_propel_route:    1\n    actions_base_class:   sfActions\n\n  config:\n\
    \    actions:\n      _new: { label: \"Create a new article\" }\n\n    fields:\n\
    \      author_id:   { label: Article author }\n      published_on: { credentials:\
    \ editor }\n\n    list:\n      title:         Articles\n      display:       [title,\
    \ blog_author, blog_category]\n      fields:\n        published_on: { date_format:\
    \ dd/MM/yy }\n      layout:        stacked\n      params:        |\n        %%is_published%%<strong>%%=title%%</strong><br\
    \ />by\n        %%blog_author%%\n        in %%blog_category%% (%%created_at%%)<p>%%content%%</p>\n\
    \      max_per_page:  2\n      sort:          [title, asc]\n\n    filter:\n  \
    \    display: [title, blog_category_id, blog_author_id, is_published]\n\n    form:\n\
