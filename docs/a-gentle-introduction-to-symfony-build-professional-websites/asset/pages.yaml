  md: 'Having all the symfony files under the web root directory is fine for testing
    symfony on your local computer, but is a really bad idea for a production server
    as it potentially makes all the internals of your application visible to end users.


    You can now finish your installation by reading the Web Server Configuration section.


    As a sandbox is just a normal symfony project where some tasks have been executed
    for you and some configuration changed, it is quite easy to use it as a starting
    point for a new project. However, keep in mind that you will probably need to
    adapt the configuration; for instance changing the security related settings (see
    the configuration of XSS and CSRF in this chapter).


    # Summary


    To test and play with symfony on your local server, your best option for installation
    is definitely the sandbox, which contains a preconfigured symfony environment.


    For a real development or on a production server, opt for the archive installation
    or the SVN checkout. This will install the symfony libraries, and you still need
    to initialize a project and an application. The last step of the application setup
    is the server configuration, which can be done in many ways. Symfony works perfectly
    fine with a virtual host, and it is the recommended solution.


    If you have any problems during installation, you will find many tutorials and
    answers to frequently asked questions on the symfony website. If necessary, you
    can submit your problem to the symfony community, and you will get a quick and
    effective answer.


    Once your project is initialized, it is a good habit to start a version-control
    process.


    Now that you are ready to use symfony, it is time to see how to build a basic
    web application.'
