- pgno: 242
  md: "> Custom and partial fields can be used in the `list`, `new`, `edit` and `filter`\
    \ views. If you use the same partial for several views, the context (list, new,\
    \ edit, or filter) is stored in the `$type` variable.\n\n# # View Customization\n\
    \nTo change the `new`, `edit` and `list` views’ appearance, you could be tempted\
    \ to alter the templates. But because they are automatically generated, doing\
    \ so isn’t a very good idea. Instead, you should use the `generator.yml` configuration\
    \ file, because it can do almost everything that you need without sacrificing\
    \ modularity.\n\n# ## Changing the View Title\n\nIn addition to a custom set of\
    \ fields, the `list`, `new`, and `edit` pages can have a custom page title. For\
    \ instance, if you want to customize the title of the `article` views, do as in\
    \ Listing 14-16. The resulting `edit` view is illustrated in Figure 14-09.\n\n\
    *Listing 14-16 - Setting a Custom Title for Each View, in backend/modules/article/config/generator.yml*\n\
    \n```\nconfig:\n  list:\n    title: List of Articles\n\n  new:\n    title: New\
    \ Article\n\n  edit:\n    title: Edit Article %%title%% (%%id%%)\n```\n\n*Figure\
    \ 14-09 - Custom title in the edit view of the article module*"
  merge: -1
  img_proc: true
