- pgno: 12
  md: 'mature enough stage to be integrated into a full-featured framework. He subsequently
    spent a year developing the symfony core, basing his work on the Mojavi Model-View-Controller
    (MVC) framework, the Propel object-relational mapping (ORM), and the Ruby on Rails
    templating helpers.


    Fabien originally built symfony for Sensio''s projects, because having an effective
    framework at your disposal presents an ideal way to develop applications faster
    and more efficiently. It also makes web development more intuitive, and the resulting
    applications are more robust and easier to maintain. The framework entered the
    proving grounds when it was employed to build an e-commerce website for a lingerie
    retailer, and subsequently was applied to other projects.


    After successfully using symfony for a few projects, Fabien decided to release
    it under an open source license. He did so to donate this work to the community,
    to benefit from user feedback, to showcase Sensio''s experience, and because it''s
    fun.


    Why “symfony” and not “FooBarFramework”? Because Fabien wanted a short name containing
    an s, as in Sensio, and an f, as in framework—easy to remember and not associated
    with another development tool. Also, he doesn’t like capital letters. symfony
    was close enough, even if not completely English, and it was also available as
    a project name. The other alternative was “baguette”."


    For symfony to be a successful open source project, it needed to have extensive
    documentation, in English, to increase the adoption rate. Fabien asked fellow
    Sensio employee François Zaninotto, the other author of this book, to dig into
    the code and write an online book about it. It took quite a while, but when the
    project was made public, it was documented well enough to appeal to numerous developers.
    The rest is history.


    # The Symfony Community


    As soon as the symfony website (http://www.symfony-project.org⁵) was launched,
    numerous developers from around the world downloaded and installed the framework,
    read the online documentation, and built their first application with symfony,
    and the buzz began to mount.


    Web application frameworks were getting popular at that time, and the need for
    a full-featured framework in PHP was high. Symfony offered a compelling solution
    due to its impressive code quality and significant amount of documentation—two
    major advantages over the other players in the framework category. Contributors
    soon began to surface, proposing patches and enhancements, proofreading the documentation,
    and performing other much-needed roles.


    The public source repository and ticketing system offer a variety of ways to contribute,
    and all volunteers are welcome. Fabien is still the main committer in the trunk
    of the source code repository, and guarantees the quality of the code.


    Today, the symfony forum⁶, mailing⁷ lists⁸, and Internet Relay Chat (IRC) channel⁹
    offer ideal support outlets, with seemingly each question getting an average of
    four answers. Newcomers install symfony every day, and the wiki and code snippets
    sections host a lot of user-contributed documentation. Nowadays, symfony is one
    of the most popular PHP frameworks.


    The symfony community is the third strength of the framework, and we hope that
    you will join it after reading this book.


