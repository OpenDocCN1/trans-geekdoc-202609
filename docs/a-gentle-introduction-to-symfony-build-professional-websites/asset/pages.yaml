- pgno: 296
  md: "If the task configuration defines an application and an env argument, they\
    \ are automatically considered when building the task configuration, so that a\
    \ task can use any of the database connections defined in your databases.yml.\
    \ By default, skeletons generated by a call to generate:task include this initialization.\n\
    \nFor more examples on the abilities of the task system, check the source of existing\
    \ symfony tasks.\n\n# Populating a Database\n\nIn the process of application development,\
    \ developers are often faced with the problem of database population. A few specific\
    \ solutions exist for some database systems, but none can be used on top of the\
    \ object-relational mapping. Thanks to YAML and the sfPropelData object, symfony\
    \ can automatically transfer data from a text source to a database. Although writing\
    \ a text file source for data may seem like more work than entering the records\
    \ by hand using a CRUD interface, it will save you time in the long run. You will\
    \ find this feature very useful for automatically storing and populating the test\
    \ data for your application.\n\n# Fixture File Syntax\n\nSymfony can read data\
    \ files that follow a very simple YAML syntax, provided that they are located\
    \ under the data/fixtures/ directory. Fixture files are organized by class, each\
    \ class section being introduced by the class name as a header. For each class,\
    \ records labeled with a unique string are defined by a set of fieldname: value\
    \ pairs. Listing 16-15 shows an example of a data file for database population.\n\
    \n*Listing 16-15 - Sample Fixture File, in data/fixtures/import_data.yml*\n\n\
    ```\nArticle:\n    ## Insert records in the blog_article\ntable\nfirst_post:\n\
    \    ## First record label\n    title:    My first memories\n    content: |\n\
    \        For a long time I used to go to bed early. Sometimes, when I had put\n\
    \        out my candle, my eyes would close so quickly that I had not even\ntime\n\
    \        to say \"I'm going to sleep\".\n\nsecond_post:\n    ## Second record\
    \ label\n    title:    Things got worse\n    content: |\n        Sometimes he\
    \ hoped that she would die, painlessly, in some accident,\n        she who was\
    \ out of doors in the streets, crossing busy thoroughfares,\n        from morning\
    \ to night.\n```\n\nSymfony translates the column keys into setter methods by\
    \ using a camelCase converter (setTitle(), setContent()). This means that you\
    \ can define a password key even if the actual table doesn't have a password field—just\
    \ define a setPassword() method in the User object, and you can populate other\
    \ columns based on the password (for instance, a hashed version of the password).\n\
    \nThe primary key column doesn't need to be defined. Since it is an auto-increment\
    \ field, the database layer knows how to determine it.\n\nThe created_at columns\
    \ don't need to be set either, because symfony knows that fields named that way\
    \ must be set to the current system time when created."
  merge: -1
  img_proc: true
- pgno: 297
  md: "# # Launching the Import\n\nThe propel:data-load task imports data from YAML\
    \ files to a database. The connection settings come from the databases.yml file,\
    \ and therefore need an application name to run. Optionally, you can specify an\
    \ environment name by adding a --env option (dev by default).\n\n```\n```bash\n\
    $ php symfony propel:data-load --env=prod --application=frontend\n```\n```\n\n\
    This command reads all the YAML fixture files from the data/fixtures/ directory\
    \ and inserts the records into the database. By default, it replaces the existing\
    \ database content, but if you add an --append option, the command will not erase\
    \ the current data.\n\n```\n```bash\n$ php symfony propel:data-load --append --application=frontend\n\
    ```\n```\n\nYou can specify another fixture directory in the call. In this case,\
    \ add a path relative to the project directory.\n\n```\n```bash\n$ php symfony\
    \ propel:data-load --application=frontend data/myfixtures\n```\n```\n\n# # Using\
    \ Linked Tables\n\nYou now know how to add records to a single table, but how\
    \ do you add records with foreign keys to another table? Since the primary key\
    \ is not included in the fixtures data, you need an alternative way to relate\
    \ records to one another.\n\nLet's return to the example in Chapter 8, where a\
    \ blog_article table is linked to a blog_comment table, as shown in Figure 16-8.\n\
    \n# Figure 16-8 - A sample database relational model\n\n![](img/0f886a7f4cbcc3939be96e985ca35ff4_297_0.png)\n\
    \nThis is where the labels given to the records become really useful. To add a\
    \ Comment field to the first_post article, you simply need to append the lines\
    \ shown in Listing 16-16 to the import_data.yml data file.\n\n# Listing 16-16\
    \ - Adding a Record to a Related Table, in data/fixtures/import_data.yml\n\n```\n\
    ```yaml\nComment:\n first_comment:\n   article_id:  first_post\n   author:   \
    \   Anonymous\n   content:     Your prose is too verbose. Write shorter sentences.\n\
    ```\n```\n\nThe propel:data-load task will recognize the label that you gave to\
    \ an article previously in import_data.yml, and grab the primary key of the corresponding\
    \ Article record to set the article_id field. You don't even see the IDs of the\
    \ records; you just link them by their labels—it couldn't be simpler.\n\nThe only\
    \ constraint for linked records is that the objects called in a foreign key must\
    \ be defined earlier in the file; that is, as you would do if you defined them\
    \ one by one. The data files are parsed from the top to the bottom, and the order\
    \ in which the records are written is important."
  merge: -1
  img_proc: true
- pgno: 298
  md: "This also works for many-to-many relationships, where two classes are related\
    \ through a third class. For instance, an `Article` can have many `Authors`, and\
    \ an `Author` can have many `Articles`. You usually use an `ArticleAuthor` class\
    \ for that, corresponding to an `article_author` table with an `article_id` and\
    \ an `author_id` columns. Listing 16-17 shows how to write a fixture file to define\
    \ many-to-many relationships with this model. Notice the plural table name used\
    \ here--this is what triggers the search for a middle class.\n\n```\nListing 16-17\
    \ - Adding a Record to a Table Related by a Many-to-Many relationship, in data/\
    \ fixtures/import_data.yml\n\nAuthor:\n  first_author:\n    name: John Doe\n \
    \   article_authors: [first_post, second_post]\n```\n\nOne data file can contain\
    \ declarations of several classes. But if you need to insert a lot of data for\
    \ many different tables, your fixture file might get too long to be easily manipulated.\n\
    \nThe `propel:data-load` task parses all the files it finds in the `fixtures/`\
    \ directory, so nothing prevents you from splitting a YAML fixture file into smaller\
    \ pieces. The important thing to keep in mind is that foreign keys impose a processing\
    \ order for the tables. To make sure that they are parsed in the correct order,\
    \ prefix the files with an ordinal number.\n\n+   100_article_import_data.yml\n\
    +   200_comment_import_data.yml\n+   300_rating_import_data.yml\n\n> Doctrine\
    \ does not need specific file names as it automatically takes care of executing\
    \ the SQL statements in the right order.\n\n# # Deploying Applications\n\nSymfony\
    \ offers shorthand commands to synchronize two versions of a website. These commands\
    \ are mostly used to deploy a website from a development server to a final host,\
    \ connected to the Internet.\n\n# ## Using rsync for Incremental File Transfer\n\
    \nSending the root project directory by FTP is fine for the first transfer, but\
    \ when you need to upload an update of your application, where only a few files\
    \ have changed, FTP is not ideal. You need to either transfer the whole project\
    \ again, which is a waste of time and bandwidth, or browse to the directories\
    \ where you know that some files changed, and transfer only the ones with different\
    \ modification dates. That's a time-consuming job, and it is prone to error. In\
    \ addition, the website can be unavailable or buggy during the time of the transfer.\n\
    \nThe solution that is supported by symfony is rsync synchronization through an\
    \ SSH layer. Rsync<sup>57</sup> is a command-line utility that provides fast incremental\
    \ file transfer, and it's open source. With incremental transfer, only the modified\
    \ data will be sent. If a file didn't change, it won't be sent to the host. If\
    \ a file changed only partially, just the differential will be sent. The major\
    \ advantage is that rsync synchronizations transfer only a small amount of data\
    \ and are very fast."
  merge: -1
  img_proc: true
- pgno: 299
  md: 'Symfony adds SSH on top of rsync to secure the data transfer. More and more
    commercial hosts support an SSH tunnel to secure file uploads on their servers,
    and that''s a good practice to avoid security breaches.


    The SSH client called by symfony uses connection settings from the config/properties.ini
    file. Listing 16-18 gives an example of connection settings for a production server.
    Write the settings of your own production server in this file before any synchronization.
    You can also define a single parameters setting to provide your own rsync command
    line parameters.


    # Listing 16-18 - Sample Connection Settings for a Server Synchronization, in
    myproject/config/properties.ini


    ```

    name=myproject


    [production]

    host=myapp.example.com

    port=22

    user=myuser

    dir=/home/myaccount/myproject/

    ```


    > Don''t confuse the production server (the host server, as defined in the properties.ini
    file of the project) with the production environment (the front controller and
    configuration used in production, as referred to in the configuration files of
    an application).


    Doing an rsync over SSH requires several commands, and synchronization can occur
    a lot of times in the life of an application. Fortunately, symfony automates this
    process with just one command:


    ```

    $ php symfony project:deploy production

    ```


    This command launches the rsync command in dry mode; that is, it shows which files
    must be synchronized but doesn''t actually synchronize them. If you want the synchronization
    to be done, you need to request it explicitly by adding the --go option.


    ```

    $ php symfony project:deploy production --go

    ```


    Don''t forget to clear the cache in the production server after synchronization.


    > Before deploying your application to the production servers, it is better to
    first check your configuration with the check_configuration.php. This utility
    can be found in the data/bin folder of symfony. It checks your environment against
    symfony requirements. You can launch it from anywhere:


    ```

    $ php /path/to/symfony/data/bin/check_configuration.php

    ```


    Even if you can use this utility from the command line, it''s strongly recommended
    to launch it from the web by copying it under your web root directory as PHP can
    use different php.ini configuration files for the command line interface and the
    web.'
  merge: -1
  img_proc: true
- pgno: 300
  md: '# Is your application finished?


    Before sending your application to production, you should make sure that it is
    ready for a public use. Check that the following items are done before actually
    deciding to deploy the application:


    The error pages should be customized to the look and feel of your application.
    Refer to Chapter 19 to see how to customize the error 500, error 404, and security
    pages, and to the “Managing a Production Application” section in this chapter
    to see how to customize the pages displayed when your site is not available.


    The default module should be removed from the enabled_modules array in the settings.yml,
    so that no symfony page appear by mistake.


    The session-handling mechanism uses a cookie on the client side, and this cookie
    is called symfony by default. Before deploying your application, you should probably
    rename it to avoid disclosing the fact that your application uses symfony. Refer
    to Chapter 6 to see how to customize the cookie name in the factories.yml file.


    The robots.txt file, located in the project’s web/ directory, is empty by default.
    You should customize it to inform web spiders and other web robots about which
    parts of a website they can browse and which they should avoid. Most of the time,
    this file is used to exclude certain URL spaces from being indexed—for instance,
    resource-intensive pages, pages that don’t need indexing (such as bug archives),
    or infinite URL spaces in which robots could get trapped.


    Modern browsers request a favicon.ico file when a user first browses to your application,
    to represent the application with an icon in the address bar and bookmarks folder.
    Providing such a file will not only make your application’s look and feel complete,
    but it will also prevent a lot of 404 errors from appearing in your server logs.


    # Ignoring Irrelevant Files


    If you synchronize your symfony project with a production host, a few files and
    directories should not be transferred:


    +   • All the version control directories (.svn/, CVS/, and so on) and their content
    are necessary only for development and integration.


    +   • The front controller for the development environment must not be available
    to the final users. The debugging and logging tools available when using the application
    through this front controller slow down the application and give information about
    the core variables of your actions. It is something to keep away from the public.


    +   • The cache/ and log/ directories of a project must not be erased in the host
    server each time you do a synchronization. These directories must be ignored as
    well. If you have a stats/ directory, it should probably be treated the same way.


    +   • The files uploaded by users should not be transferred. One of the good practices
    of symfony projects is to store the uploaded files in the web/uploads/ directory.
    This allows you to exclude all these files from the synchronization by pointing
    to only one directory.


    To exclude files from rsync synchronizations, open and edit the rsync_exclude.txt
    file under the myproject/config/ directory. Each line can contain a file, a directory,
    or a pattern. The symfony file structure is organized logically, and designed
    to minimize the number of files or directories to exclude manually from the synchronization.
    See Listing 16-19 for an example.


    Listing 16-19 - Sample rsync Exclusion Settings, in myproject/config/ rsync_exclude.txt'
  merge: -1
  img_proc: true
