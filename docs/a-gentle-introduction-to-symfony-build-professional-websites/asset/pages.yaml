- pgno: 245
  md: "# Changing the Layout\n\nBy default, the hyperlink between the list view and\
    \ the edit view is borne by the primary key column. If you refer back to Figure\
    \ 14-08, you will see that the id column in the comment list not only shows the\
    \ primary key of each comment, but also provides a hyperlink allowing users to\
    \ access the edit view.\n\nIf you prefer the hyperlink to the detail of the record\
    \ to appear on another column, prefix the column name by an equal sign (=) in\
    \ the display key. Listing 14-19 shows how to remove the id from the displayed\
    \ fields of the comment list and to put the hyperlink on the content field instead.\
    \ Check Figure 14-11 for a screenshot.\n\n_Listing 14-19 - Moving the Hyperlink\
    \ for the edit View in the list View, in modules/comment/config/generator.yml_\n\
    \n```\nconfig:\n  list:\n    display: [ _article_link, =content]\n```\n\n_Figure\
    \ 14-11 - Moving the link to the edit view on another column, in the list view\
    \ of the comment module_\n\n| Article link | Body | Actions |\n|---|---|---|\n\
    | Welcome to the symfony weblog! | First ! | Edit Delete |\n| Welcome to the symfony\
    \ weblog! | Oh too bad i wanted to be first ! | Edit Delete |\n| Welcome to the\
    \ symfony weblog! | This is a really nice blog. | Edit Delete |\n| Life is beautiful\
    \ | Great story ! | Edit Delete |\n| Life is beautiful | Hello Fabien | Edit Delete\
    \ |\n\n**5 results**\n\nChoose an action go New\n\nBy default, the list view uses\
    \ the tabular layout, where the fields appear as columns, as shown previously.\
    \ But you can also use the stacked layout and concatenate the fields into a single\
    \ string that expands on the full length of the table. If you choose the stacked\
    \ layout, you must set in the params key the pattern defining the value of each\
    \ line of the list. For instance, Listing 14-20 defines a stacked layout for the\
    \ list view of the comment module. The result appears in Figure 14-12.\n\n_Listing\
    \ 14-20 - Using a stacked Layout in the list View, in modules/comment/config/generator.yml_\n\
    \n```\nconfig:\n  list:\n    layout: stacked\n    params: |\n      %%content%%<br\
    \ />\n      (sent by %%author%% on %%created_at%% about %%_article_link%%)\n \
    \   display: [ created_at, author, content]\n```\n\n_Figure 14-12 - Stacked layout\
    \ in the list view of the comment module_"
