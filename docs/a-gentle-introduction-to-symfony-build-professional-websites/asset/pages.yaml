    \ 'Subject', 'Body')\n        ;\n\n    $message->getHeaders()->addTextHeader('X-Queue-Criteria',\
    \ 'foo');\n\n    $this->getMailer()->send($message);\n}\n```\n```\n\nThen, retrieve\
    \ the value from this header when storing the message in the queue, and remove\
    \ it immediately:\n\n```\n```php\nListing 11-37\npublic function setMessage($message)\n\
    {\n    $msg = unserialize($message);\n\n    $headers = $msg->getHeaders();\n \
    \   $criteria = $headers->get('X-Queue-Criteria')->getFieldBody();\n    $this->setCriteria($criteria);\n\
    \    $headers->remove('X-Queue-Criteria');\n\n    parent::setMessage($message);\n\
    }\n```\n```"
