  md: "to store any user attribute in it. This data will be available to other requests\
    \ until the end of the user session, as shown in Listing 6-14. User attributes\
    \ can store any type of data (strings, arrays, and associative arrays). They can\
    \ be set for every individual user, even if that user is not identified.\n\n#\
    \ Listing 6-14 - The sfUser Object Can Hold Custom User Attributes Existing Across\
