- pgno: 123
  md: 'The schema doesn''t contain any detailed connection to settings, only a connection
    name, to maintain database abstraction.


    # Basic Schema Syntax


    In a schema.yml file, the first key represents a model name. You can specify multiple
    models, each having a set of columns. According to the YAML syntax, the keys end
    with a colon, and the structure is shown through indentation (one or more spaces,
    but no tabulations).


    A model can have special attributes, including the tableName (the name of the
    models database table). If you don''t mention a tableName for a model, Doctrine
    creates it based on the underscored version of the model name.


    > > The underscore convention adds underscores between words, and lowercases everything.
    The default underscored versions of Article and Comment are article and comment.


    A model contains columns. The column value can be defined in two different ways:


    +   - If you define only one attribute, it is the column type. Symfony understands
    the usual column types: boolean, integer, float, date, string(size), clob (converted,
    for instance, to text in MySQL), and so on.

    +   - If you need to define other column attributes (like default value, required,
    and so on), you should write the column attributes as a set of key: value. This
    extended schema syntax is described later in the chapter.


    Models can also contain explicit foreign keys and indexes. Refer to the “Extended
    Schema Syntax” section later in this chapter to learn more.


    # Model Classes


    The schema is used to build the model classes of the ORM layer. To save execution
    time, these classes are generated with a command-line task called doctrine:build-model.


    ```

    ```

    $ php symfony doctrine:build-model

    ```

    ```


    > > After building your model, you must remember to clear symfony’s internal cache
    with php symfony cc so symfony can find your newly created models.


    Typing this command will launch the analysis of the schema and the generation
    of base data model classes in the lib/model/doctrine/base directory of your project:


    +   - BaseArticle.php

    +   - BaseComment.php


    In addition, the actual data model classes will be created in lib/model/doctrine:


    +   - Article.php

    +   - ArticleTable.php

    +   - Comment.php

    +   - CommentTable.php


    You defined only two models, and you end up with six files. There is nothing wrong,
    but it deserves some explanation.'
