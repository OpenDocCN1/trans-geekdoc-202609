- pgno: 358
  md: '# Appendix A

    Inside The Model Layer (Propel)


    Much of the discussion so far has been devoted to building pages, and processing
    requests and responses. But the business logic of a web application relies mostly
    on its data model. Symfony’s default model component is based on an object/relational
    mapping layer. Symfony comes bundles with the two most popular PHP ORMs: Propel⁶⁷
    and Doctrine⁶⁸. In a symfony application, you access data stored in a database
    and modify it through objects; you never address the database explicitly. This
    maintains a high level of abstraction and portability.


    This chapter explains how to create an object data model, and the way to access
    and modify the data in Propel. It also demonstrates the integration of Propel
    in Symfony.


    # Why Use an ORM and an Abstraction Layer?


    Databases are relational. PHP 5 and symfony are object-oriented. In order to most
    effectively access the database in an object-oriented context, an interface translating
    the object logic to the relational logic is required. As explained in Chapter
    1, this interface is called an object-relational mapping (ORM), and it is made
    up of objects that give access to data and keep business rules within themselves.


    The main benefit of an ORM is reusability, allowing the methods of a data object
    to be called from various parts of the application, even from different applications.
    The ORM layer also encapsulates the data logic—for instance, the calculation of
    a forum user rating based on how many contributions were made and how popular
    these contributions are. When a page needs to display such a user rating, it simply
    calls a method of the data model, without worrying about the details of the calculation.
    If the calculation changes afterwards, you will just need to modify the rating
    method in the model, leaving the rest of the application unchanged.


    Using objects instead of records, and classes instead of tables, has another benefit:
    They allow you to add new accessors to your objects that don’t necessarily match
    a column in a table. For instance, if you have a table called client with two
    fields named first_name and last_name, you might like to be able to require just
    a Name. In an object-oriented world, it is as easy as adding a new accessor method
    to the Client class, as in Listing 8-1. From the application point of view, there
    is no difference between the FirstName, LastName, and Name attributes of the Client
    class. Only the class itself can determine which attributes correspond to a database
    column.


    ```

