    \ => $parameters\n)));\n\n// Make the request and store the result in a $result\
    \ variable\n// ...\n\n// Notify the dispatcher of the end of the fetch process\n\
    $this->dispatcher->notify(new sfEvent($this,\n'rest_request.fetch_success', array(\n\
    \    'uri' => $uri,\n    'parameters' => $parameters,\n    'result' => $result\n\
    )));\n\nreturn $result;\n}\n}\n```\n\nThe notify() method of the event dispatcher\
    \ expects an sfEvent object as an argument;\nthis is the very same object that\
    \ is passed to the event listeners. This object always carries a\nreference to\
    \ the notifier (that's why the event instance is initialized with this) and an\
    \ event\nidentifier. Optionally, it accepts an associative array of parameters,\
    \ giving listeners a way to\ninteract with the notifier's logic.\n\n# Notifying\
    \ the dispatcher of an Event Until a Listener handles it\n\nBy using the notify()\
    \ method, you make sure that all the listeners registered on the\nnotifying event\
    \ are executed. However, in some cases you need to allow a listener to stop the\n\
    event and prevent further listeners from being notified about it. In this case,\
    \ you should use\nnotifyUntil() instead of notify(). The dispatcher will then\
    \ execute all listeners until one\nreturns true, and then stop the event notification.\
    \ In other words, notifyUntil() is like a\nshout in the project space saying:\
    \ “I’m doing that. If somebody cares, then I won’t tell\nanybody else”. Listing\
    \ 17-3 shows how to use this technique in combination with a magic\n__call() method\
    \ to add methods to an existing class at runtime.\n\n# Listing 17-3 Notifying\
    \ of an Event Until a Listener Returns True\n\n```\nclass sfRestRequest\n{\n//\
    \ ...\n\npublic function __call($method, $arguments)\n{\n$event = $this->dispatcher->notifyUntil(new\
    \ sfEvent($this,\n'rest_request.method_not_found', array(\n'method' => $method,\n\
    'arguments' => $arguments\n)));\nif (!$event->isProcessed())\n{\nthrow new sfException(sprintf('Call\
    \ to undefined method %s::%s.',\nget_class($this), $method));\n}\n\nreturn $event->getReturnValue();\n\
    }\n```"
