- pgno: 169
  md: "> Third-party plugins provide many additional widgets. You can easily find\
    \ a rich text editor widget, a calendar widget, or other “rich UI” widgets for\
    \ various JavaScript libraries. Check the Plugins repository40 for more details.\n\
    \n# Handling a Form Submission\n\nWhen users fill a form and submit it, the web\
    \ application server needs to retrieve the data from the request and do some stuff\
    \ with it. The sfForm class provides all the necessary methods to do that in a\
    \ couple lines of code.\n\n# Simple Form Handling\n\nSince widgets output as regular\
    \ HTML form fields, getting their value in the action that handles the form submission\
    \ is as easy as checking the related request parameters. For the example contact\
    \ form, the action could look like this:\n\n```\nListing 10-20 // in modules/foo/actions/actions.class.php\n\
    public function executeContact($request)\n{\n    // Define the form\n    $this->form\
    \ = new sfForm();\n    $this->form->setWidgets(array(\n        'name' => new sfWidgetFormInputText(),\n\
    \        'email' => new sfWidgetFormInput(array('default' =>\n            'me@example.com')),\n\
    \        'subject' => new sfWidgetFormChoice(array('choices' => array('Subject\n\
    \        A', 'Subject B', 'Subject C')),\n        'message' => new sfWidgetFormTextarea(),\n\
    \    ));\n    // Deal with the request\n    if ($request->isMethod('post'))\n\
    \    {\n        // Handle the form submission\n        $name = $request->getParameter('name');\n\
    \        // Do stuff\n        // ...\n        $this->redirect('foo/bar');\n  \
    \  }\n}\n```\n\nIf the request method is 'GET', this action will terminate over\
    \ a sfView::SUCCESS and therefore render the contactSuccess template to display\
    \ the form. If the request method is 'POST', then the action handles the form\
    \ submission and redirects to another action. For this to work, the <form> target\
    \ action must be the same as the one displaying it. That explains why the previous\
    \ examples used foo/contact as a form target:\n\n```\nListing 10-21 // in modules/foo/templates/contactSuccess.php\n\
    <?php echo $form->renderFormTag('foo/contact') ?>\n...\n```"
