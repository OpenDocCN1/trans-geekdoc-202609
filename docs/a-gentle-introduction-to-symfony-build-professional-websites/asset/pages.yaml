  md: '# Testing the Cache


    When you enable caching for an application, the functional tests should verify
    that the cached actions do work as expected.


    The first thing to do is enable cache for the test environment (in the settings.yml
    file). Then, if you want to test whether a page comes from the cache or whether
    it is generated, you should use the isCached() test method provided by the view_cache
    tester group. Listing 15-37 demonstrates this method.


    Listing 15-37 - Testing the Cache with the isCached() Method


    ```

    <?php

    include dirname(__FILE__).''/../../bootstrap/functional.php'';

    // Create a new test browser

    $b = new sfTestFunctional(new sfBrowser());

    $b->get(''/mymodule'');

    $b->with(''view_cache'')->isCached(true); // Checks that the response comes from
    the cache

    $b->with(''view_cache'')->isCached(true, true); // Checks that the cached response
    comes with layout

    $b->with(''view_cache'')->isCached(false); // Checks that the response doesn''t
    come from the cache

    ```


    > You don''t need to clear the cache at the beginning of a functional test; the
    bootstrap script does it for you.


    # Testing Interactions on the Client


    The main drawback of the techniques described previously is that they cannot simulate
    JavaScript. For very complex interactions, like with Ajax interactions for instance,
    you need to be able to reproduce exactly the mouse and keyboard input that a user
    would do and execute scripts on the client side. Usually, these tests are reproduced
    by hand, but they are very time consuming and prone to error.


    The solution is called Selenium52, which is a test framework written entirely
    in JavaScript. It executes a set of actions on a page just like a regular user
    would, using the current browser window. The advantage over the sfBrowser object
    is that Selenium is capable of executing JavaScript in a page, so you can test
    even Ajax interactions with it.


    Selenium is not bundled with symfony by default. To install it, you need to create
    a new selenium/ directory in your web/ directory, and in it unpack the content
    of the Selenium archive53. This is because Selenium relies on JavaScript, and
    the security settings standard in most browsers wouldn''t allow it to run unless
    it is available on the same host and port as your application.


    > Be careful not to transfer the selenium/ directory to your production server,
    since it would be accessible by anyone having access to your web document root
    via the browser.


    Selenium tests are written in HTML and stored in the web/selenium/tests/ directory.
    For instance, Listing 15-38 shows a functional test where the home page is loaded,
    the link click'
