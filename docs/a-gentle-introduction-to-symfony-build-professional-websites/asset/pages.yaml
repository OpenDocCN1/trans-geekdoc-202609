    Table 2-2 describes the application subdirectories.


    # Table 2-2 - Application Subdirectories


    | Directory | Description |

    |---|---|

    | config/ | Holds a hefty set of YAML configuration files. This is where most
    of the application configuration is, apart from the default parameters that can
    be found in the framework itself. Note that the default parameters can still be
    overridden here if needed. You''ll learn more about application configuration
    in the Chapter 5. |

    | i18n/ | Contains files used for the internationalization of the application—mostly
    interface translation files (Chapter 13 deals with internationalization). You
    can bypass this directory if you choose to use a database for internationalization.
    |

    | lib/ | Contains classes and libraries that are specific to the application.
    |

    | modules/ | Stores all the modules that contain the features of the application.
    |

    | templates/ | Lists the global templates of the application—the ones that are
    shared by all modules. By default, it contains a layout.php file, which is the
    main layout in which the module templates are inserted. |'
