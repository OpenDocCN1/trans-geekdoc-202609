- pgno: 346
  md: "# # Feature Configuration\n\nSymfony uses some parameters of `settings.yml`\
    \ to alter the behavior of built-in features such as form validation, cache, and\
    \ third-party modules.\n\n# ## Output Escaping Settings\n\nOutput escaping settings\
    \ control the way the variables are accessible in the template (see Chapter 7).\
    \ The `settings.yml` file includes two settings for this feature:\n\n+   * The\
    \ `escaping_strategy` setting can take the value `true`, or `false`.\n+   * The\
    \ `escaping_method` setting can be set to `ESC_RAW`, `ESC_SPECIALCHARS`, `ESC_ENTITIES`,\
    \ `ESC_JS`, or `ESC_JS_NO_ENTITIES`.\n\n# ## Routing Settings\n\nThe routing settings\
    \ (see Chapter 9) are defined in `factories.yml`, under the `routing` key. Listing\
    \ 19-1 show the default routing configuration.\n\n# #### Listing 19-1 - Routing\
    \ Configuration Settings, in frontend/config/factories.yml\n\n```\nrouting:\n\
    \  class: sfPatternRouting\n  param:\n    load_configuration: true\n    suffix:\
    \               .\n    default_module:       default\n    default_action:    \
    \   index\n    variable_prefixes:    [':']\n    segment_separators:   ['/', '.']\n\
    \    variable_regex:       '[\\w\\d_+]'\n    debug:                %SF_DEBUG%\n\
    \    logging:              %SF_LOGGING_ENABLED%\n    cache:\n      class: sfFileCache\n\
    \      param:\n        automatic_cleaning_factor: 0\n        cache_dir:      \
    \           %SF_CONFIG_CACHE_DIR%/routing\n        lifetime:                 \
    \ 31556926\n        prefix:                    %SF_APP_DIR%\n```\n\n+   * The\
    \ `suffix` parameter sets the default suffix for generated URLs. The default value\
    \ is a period (`.`), and it corresponds to no suffix. Set it to `.html`, for instance,\
    \ to have all generated URLs look like static pages.\n+   * When a routing rule\
    \ doesn't define the `module` or the `action` parameter, values from the `factories.yml`\
    \ are used instead:\n+     * `default_module`: Default module request parameter.\
    \ Defaults to the `default` module.\n+     * `default_action`: Default action\
    \ request parameter. Defaults to the `index` action.\n+   * By default, route\
    \ patterns identify named wildcards by a colon (`:`) prefix. But if you want to\
    \ write your rules in a more PHP-friendly syntax, you can add the dollar (`$`)\
    \ sign in the `variable_prefixes` array. That way, you can write a pattern like\
    \ `'/article/$year/$month/$day/$title'` instead of `'/article/:year/:month/:day/:title'`.\n\
    +   * The pattern routing will identify named wildcards between separators. The\
    \ default separators are the slash and the dot, but you can add more if you want\
    \ in the"
