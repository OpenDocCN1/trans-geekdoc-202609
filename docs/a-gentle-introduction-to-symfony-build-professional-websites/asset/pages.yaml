    The interesting parts here are the `<contents>` and the `<dependencies>` tags,
    described next. For the rest of the tags, there is nothing specific to symfony,
    so you can refer to the PEAR online manual59 for more details about the package.xml
    format.


    # Contents


    The `<contents>` tag is the place where you must describe the plug-in file structure.
    This will tell PEAR which files to copy and where. Describe the file structure
    with `<dir>` and `<file>` tags. All `<file>` tags must have a role="data" attribute.
    The `<contents>` part of Listing 17-23 describes the exact directory structure
    of Listing 17-22.


    > The use of `<dir>` tags is not compulsory, since you can use relative paths
    as name values in the `<file>` tags. However, it is recommended so that the package.xml
    file remains readable.


    # Plug-In Dependencies


    Plug-ins are designed to work with a given set of versions of PHP, PEAR, symfony,
    PEAR packages, or other plug-ins. Declaring these dependencies in the `<dependencies>`
    tag tells PEAR to check that the required packages are already installed, and
    to raise an exception if not.


    You should always declare dependencies on PHP, PEAR, and symfony, at least the
    ones corresponding to your own installation, as a minimum requirement. If you
    don''t know what to put, add a requirement for PHP 5.2.4, PEAR 1.4, and symfony
    1.3.


    It is also recommended to add a maximum version number of symfony for each plug-in.
    This will cause an error message when trying to use a plug-in with a more advanced
    version of the framework, and this will oblige the plug-in author to make sure
    that the plug-in works correctly with this version before releasing it again.
    It is better to have an alert and to download an upgrade rather than have a plug-in
    fail silently.


    If you specify plugins as dependencies, users will be able to install your plugin
    and all its dependencies with a single command:


    ```

    $ php symfony plugin:install --install-deps sfSamplePlugin

    ```


    # Building the Plug-In


    The PEAR component has a command (pear package) that creates the .tgz archive
    of the package, provided you call the command shown in Listing 17-24 from a directory
    containing a package.xml.'
