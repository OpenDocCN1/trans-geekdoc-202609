  md: "```\n$q = Doctrine_Core::getTable('Comment')\n ->createQuery('c')\n ->where('c.author\
    \ = ?', 'Steve')\n ->leftJoin('c.Article a')\n ->andWhere('a.content LIKE ?',\
    \ '%enjoy%')\n ->orderBy('c.created_at ASC');\n$comments = $q->execute();\n```\n\
    \n```\n// Will result in the following SQL query\nSELECT b.id AS b__id, b.article_id\
    \ AS b__article_id, b.author AS\nb__author, b.content AS b__content, b.created_at\
    \ AS b__created_at,\nb.updated_at AS b__updated_at, b2.id AS b2__id, b2.title\
    \ AS b2__title,\nb2.content AS b2__content, b2.created_at AS b2__created_at, b2.updated_at\n\
    AS b2__updated_at FROM blog_comment b LEFT JOIN blog_article b2 ON\nb.article_id\
    \ = b2.id WHERE (b.author = ? AND b2.content LIKE ?) ORDER BY\nb.created_at ASC\n\
    ```\n\nJust as SQL is a simple language that allows you to build very complex\
    \ queries, the Doctrine_Query object can handle conditions with any level of complexity.\
    \ But since many developers think first in SQL before translating a condition\
    \ into object-oriented logic, the Doctrine_Query object may be difficult to comprehend\
    \ at first. The best way to understand it is to learn from examples and sample\
    \ applications. The symfony project website, for instance, is full of Doctrine_Query\
    \ building examples that will enlighten you in many ways.\n\nEvery Doctrine_Query\
    \ instance has a count() method, which simply counts the number of records for\
    \ the query and returns an integer. As there is no object to return, the hydrating\
    \ process doesn't occur in this case, and the count() method is faster than execute().\n\
    \nThe table classes also provide findAll(), findBy*(), and findOneBy*() methods,\
    \ which are shortcuts for constructing Doctrine_Query instances, executing them\
    \ and returning the results.\n\nFinally, if you just want the first object returned,\
    \ replace execute() with a fetchOne() call. This may be the case when you know\
    \ that a Doctrine_Query will return only one result, and the advantage is that\
    \ this method returns an object rather than an array of objects.\n\n> When a execute()\
    \ query returns a large number of results, you might want to display only a subset\
    \ of it in your response. Symfony provides a pager class called sfDoctrinePager,\
    \ which automates the pagination of results.\n\n# Using Raw SQL Queries\n\nSometimes,\
    \ you don't want to retrieve objects, but want to get only synthetic results calculated\
    \ by the database. For instance, to get the latest creation date of all articles,\
    \ it doesn't make sense to retrieve all the articles and to loop on the array.\
    \ You will prefer to ask the database to return only the result, because it will\
    \ skip the object hydrating process.\n\nOn the other hand, you don't want to call\
    \ the PHP commands for database management directly, because then you would lose\
    \ the benefit of database abstraction. This means that you need to bypass the\
    \ ORM (Doctrine) but not the database abstraction (PDO).\n\nQuerying the database\
    \ with PHP Data Objects requires that you do the following:\n\n+   1. Get a database\
    \ connection.\n+   2. Build a query string.\n+   3. Create a statement out of\
    \ it.\n+   4. Iterate on the result set that results from the statement execution.\n\
    \nIf this looks like gibberish to you, the code in Listing 8-15 will probably\
    \ be more explicit."
