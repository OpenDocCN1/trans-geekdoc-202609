- pgno: 25
  md: '# Object Orientation


    All the previous examples use procedural programming. The OOP capabilities of
    modern languages make the programming even easier, since objects can encapsulate
    logic, inherit from one another, and provide clean naming conventions.


    Implementing an MVC architecture in a language that is not object-oriented raises
    namespace and code-duplication issues, and the overall code is difficult to read.


    Object orientation allows developers to deal with such things as the view object,
    the controller object, and the model classes, and to transform all the functions
    in the previous examples into methods. It is a must for MVC architectures.


    > If you want to learn more about design patterns for web applications in an object-oriented
    context, read Patterns of Enterprise Application Architecture by Martin Fowler
    (Addison-Wesley, ISBN: 0-32112-742-0). Code examples in Fowler''s book are in
    Java or C#, but are still quite readable for a PHP developer.


    # Symfony''s MVC Implementation


    Hold on a minute. For a single page listing the posts in a weblog, how many components
    are required? As illustrated in Figure 2-2, we have the following parts:


    +   - Model layer

    +     - Database abstraction

    +     - Data access

    +   - View layer

    +     - View

    +     - Template

    +     - Layout

    +   - Controller layer

    +     - Front controller

    +     - Action


    Seven scripts—a whole lot of files to open and to modify each time you create
    a new page! However, symfony makes things easy. While taking the best of the MVC
    architecture, symfony implements it in a way that makes application development
    fast and painless.


    First of all, the front controller and the layout are common to all actions in
    an application. You can have multiple controllers and layouts, but you need only
    one of each. The front controller is pure MVC logic component, and you will never
    need to write a single one, because symfony will generate it for you.


    The other good news is that the classes of the model layer are also generated
    automatically, based on your data structure. This is the job of the ORM library,
    which provides class skeletons and code generation. If the ORM finds foreign key
    constraints or date fields, it will provide special accessor and mutator methods
    that will make data manipulation a piece of cake. And the database abstraction
    is totally invisible to you, because it is handled natively by PHP Data Objects.
    So if you decide to change your database engine at anytime, you have zero code
    to refactor. You just need to change one configuration parameter.


    And the last thing is that the view logic can be easily translated as a simple
    configuration file, with no programming needed.


    Figure 2-2 - Symfony workflow'
  merge: -1
  img_proc: true
