- pgno: 87
  md: "# # Action Security\n\nThe ability to execute an action can be restricted to\
    \ users with certain privileges. The tools provided by symfony for this purpose\
    \ allow the creation of secure applications, where users need to be authenticated\
    \ before accessing some features or parts of the application. Securing an application\
    \ requires two steps: declaring the security requirements for each action and\
    \ logging in users with privileges so that they can access these secure actions.\n\
    \n# ## Access Restriction\n\nBefore being executed, every action passes by a special\
    \ filter that checks if the current user has the privileges to access the requested\
    \ action. In symfony, privileges are composed of two parts:\n\n+   - Secure actions\
    \ require users to be authenticated.\n+   - Credentials are named security privileges\
    \ that allow organizing security by group.\n\nRestricting access to an action\
    \ is simply made by creating and editing a YAML configuration file called security.yml\
    \ in the module config/ directory. In this file, you can specify the security\
    \ requirements that users must fulfill for each action or for all actions. Listing\
    \ 6-20 shows a sample security.yml.\n\n# Listing 6-20 - Setting Access Restrictions,\
    \ in apps/frontend/modules/mymodule/config/security.yml\n\n```\nread:\n    is_secure:\
    \ false    # All users can request the read action\n\nupdate:\n    is_secure:\
    \ true    # The update action is only for authenticated\n    users\n\ndelete:\n\
    \    is_secure: true    # Only for authenticated users\n    credentials: admin\
    \    # With the admin credential\n\nall:\n    is_secure: false    # false is the\
    \ default value anyway\n```\n\nActions are not secure by default, so when there\
    \ is no security.yml or no mention of an action in it, actions are accessible\
    \ by everyone. If there is a security.yml, symfony looks for the name of the requested\
    \ action and, if it exists, checks the fulfillment of the security requirements.\
    \ What happens when a user tries to access a restricted action depends on his\
    \ credentials:\n\n+   - If the user is authenticated and has the proper credentials,\
    \ the action is executed.\n+   - If the user is not identified, he will be redirected\
    \ to the default login action.\n+   - If the user is identified but doesn't have\
    \ the proper credentials, he will be redirected to the default secure action,\
    \ shown in Figure 6-1.\n\nThe default login and secure pages are pretty simple,\
    \ and you will probably want to customize them. You can configure which actions\
    \ are to be called in case of insufficient privileges in the application settings.yml\
    \ by changing the value of the properties shown in Listing 6-21.\n\n# Figure 6-1\
    \ - The default secure action page"
  merge: -1
  img_proc: true
- pgno: 88
  md: "![](img/0f886a7f4cbcc3939be96e985ca35ff4_88_0.png)\n\n# Listing 6-21 - Default\
    \ Security Actions Are Defined in apps/frontend/config/settings.yml\n\n```\nall:\n\
    \  .actions:\n    login_module:  default\n    login_action:  login\n\n    secure_module:\
    \ default\n    secure_action: secure\n```\n\n# Granting Access\n\nTo get access\
    \ to restricted actions, users need to be authenticated and/or to have certain\
    \ credentials. You can extend a user's privileges by calling methods of the sfUser\
    \ object. The authenticated status of the user is set by the setAuthenticated()\
    \ method and can be checked with isAuthenticated(). Listing 6-22 shows a simple\
    \ example of user authentication.\n\n# Listing 6-22 - Setting the Authenticated\
    \ Status of a User\n\n```\nclass myAccountActions extends sfActions\n{\n  public\
    \ function executeLogin($request)\n  {\n    if ($request->getParameter('login')\
    \ == 'foobar')\n    {\n      $this->getUser()->setAuthenticated(true);\n    }\n\
    \  }\n\n  public function executeLogout()\n  {\n    $this->getUser()->setAuthenticated(false);\n\
    \  }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 89
  md: "Credentials are a bit more complex to deal with, since you can check, add,\
    \ remove, and clear credentials. Listing 6-23 describes the credential methods\
    \ of the sfUser class.\n\n# Listing 6-23 - Dealing with User Credentials in an\
    \ Action\n\n```\nclass myAccountActions extends sfActions\n{\n    public function\
    \ executeDoThingsWithCredentials()\n    {\n        $user = $this->getUser();\n\
    \n        // Add one or more credentials\n        $user->addCredential('foo');\n\
    \        $user->addCredentials(array('foo', 'bar'));\n\n        // Check if the\
    \ user has a credential\n        echo $user->hasCredential('foo');           \
    \    =>  true\n\n        // Check if the user has both credentials\n        echo\
    \ $user->hasCredential(array('foo', 'bar'));   =>  true\n\n        // Check if\
    \ the user has one of the credentials\n        echo $user->hasCredential(array('foo',\
    \ 'bar'), false); =>  true\n\n        // Remove a credential\n        $user->removeCredential('foo');\n\
    \        echo $user->hasCredential('foo');               =>  false\n\n       \
    \ // Remove all credentials (useful in the logout process)\n        $user->clearCredentials();\n\
    \        echo $user->hasCredential('bar');               =>  false\n    }\n}\n\
    ```\n\nIf a user has the foo credential, that user will be able to access the\
    \ actions for which the security.yml requires that credential. Credentials can\
    \ also be used to display only authorized content in a template, as shown in Listing\
    \ 6-24.\n\n# Listing 6-24 - Dealing with User Credentials in a Template\n\n```\n\
    <ul>\n  <li><?php echo link_to('section1', 'content/section1') ?></li>\n  <li><?php\
    \ echo link_to('section2', 'content/section2') ?></li>\n  <?php if ($sf_user->hasCredential('section3')):\
    \ ?>\n    <li><?php echo link_to('section3', 'content/section3') ?></li>\n  <?php\
    \ endif; ?>\n</ul>\n```\n\nAs for the authenticated status, credentials are often\
    \ given to users during the login process. This is why the sfUser object is often\
    \ extended to add login and logout methods, in order to set the security status\
    \ of users in a central place.\n\n> Among the symfony plug-ins, the sfGuardPlugin<sup>34</sup>\
    \ and sfDoctrineGuardPlugin<sup>35</sup> extend the session class to make login\
    \ and logout easy. Refer to Chapter 17 for more information.\n\n34. http://www.symfony-project.org/plugins/sfGuardPlugin\n\
    35. http://www.symfony-project.org/plugins/sfDoctrineGuardPlugin"
  merge: -1
  img_proc: true
- pgno: 90
  md: "# Complex Credentials\n\nThe YAML syntax used in the security.yml file allows\
    \ you to restrict access to users having\na combination of credentials, using\
    \ either AND-type or OR-type associations. With such a\ncombination, you can build\
    \ a complex workflow and user privilege management system—for\ninstance, a content\
    \ management system (CMS) back-office accessible only to users with the\nadmin\
    \ credential, where articles can be edited only by users with the editor credential\
    \ and\npublished only by the ones with the publisher credential. Listing 6-25\
    \ shows this example.\n\n```\nListing 6-25 - Credentials Combination Syntax\n\n\
    editArticle:\n  credentials: [ admin, editor ]     # admin AND editor\n\npublishArticle:\n\
    \  credentials: [ admin, publisher ]  # admin AND publisher\n\nuserManagement:\n\
    \  credentials: [ [ admin, superuser ]]  # admin OR superuser\n```\n\nEach time\
    \ you add a new level of square brackets, the logic swaps between AND and OR.\
    \ So\nyou can create very complex credential combinations, such as this:\n\n```\n\
    credentials: [[root, [supplier, [owner, quasiowner]]], accounts]]\n  # root OR\
    \ (supplier AND (owner OR quasiowner)) OR accounts\n```\n\n# Filters\n\nThe security\
    \ process can be understood as a filter by which all requests must pass before\n\
    executing the action. According to some tests executed in the filter, the processing\
    \ of the\nrequest is modified—for instance, by changing the action executed (default/secure\
    \ instead\nof the requested action in the case of the security filter). Symfony\
    \ extends this idea to filter\nclasses. You can specify any number of filter classes\
    \ to be executed before the action\nexecution or before the response rendering,\
    \ and do this for every request. You can see filters\nas a way to package some\
    \ code, similar to preExecute() and postExecute(), but at a\nhigher level (for\
    \ a whole application instead of for a whole module).\n\n# The Filter Chain\n\n\
    Symfony actually sees the processing of a request as a chain of filters. When\
    \ a request is\nreceived by the framework, the first filter (which is always the\
    \ sfRenderingFilter) is\nexecuted. At some point, it calls the next filter in\
    \ the chain, then the next, and so on. When\nthe last filter (which is always\
    \ sfExecutionFilter) is executed, the previous filter can\nfinish, and so on back\
    \ to the rendering filter. Figure 6-3 illustrates this idea with a sequence\n\
    diagram, using an artificially small filter chain (the real one contains more\
    \ filters).\n\nFigure 6-3 - Sample filter chain"
  merge: -1
  img_proc: true
- pgno: 91
  md: "![](img/0f886a7f4cbcc3939be96e985ca35ff4_91_0.png)\n\nThis process justifies\
    \ the structure of the filter classes. They all extend the sfFilter class, and\
    \ contain one execute() method, expecting a $filterChain object as parameter.\
    \ Somewhere in this method, the filter passes to the next filter in the chain\
    \ by calling $filterChain->execute(). See Listing 6-26 for an example. So basically,\
    \ filters are divided into two parts:\n\n+   - The code before the call to $filterChain->execute()\
    \ executes before the action execution.\n+   - The code after the call to $filterChain->execute()\
    \ executes after the action execution and before the rendering.\n\n# Listing 6-26\
    \ - Filter Class Struture\n\n```\n```php\nclass myFilter extends sfFilter\n{\n\
    \  public function execute ($filterChain)\n  {\n    // Code to execute before\
    \ the action execution\n    ...\n\n    // Execute next filter in the chain\n \
    \   $filterChain->execute();\n\n    // Code to execute after the action execution,\
    \ before the rendering\n    ...\n  }\n}\n```\n```\n\nThe default filter chain\
    \ is defined in an application configuration file called filters.yml, and is shown\
    \ in Listing 6-27. This file lists the filters that are to be executed for every\
    \ request.\n\n# Listing 6-27 - Default Filter Chain, in frontend/config/filters.yml\n\
    \n```\n```yaml\nrendering: ~\nsecurity: ~\n```\n```"
  merge: -1
  img_proc: true
- pgno: 92
  md: "```\n# Generally, you will want to insert your own filters here\n```\n\n```\n\
    cache: ~\nexecution: ~\n```\n\nThese declarations have no parameter (the tilde\
    \ character, ~, means “null” in YAML), because they inherit the parameters defined\
    \ in the symfony core. In the core, symfony defines class and param settings for\
    \ each of these filters. For instance, Listing 6-28 shows the default parameters\
    \ for the rendering filter.\n\n# Listing 6-28 - Default Parameters of the rendering\
    \ Filter, in sfConfig::get('sf_symfony_lib_dir')/config/config/filters.yml\n\n\
    ```\nrendering:\n  class: sfRenderingFilter   # Filter class\n  param:       \
    \              # Filter parameters\n    type: rendering\n```\n\nBy leaving the\
    \ empty value (~) in the application filters.yml, you tell symfony to apply the\
    \ filter with the default settings defined in the core.\n\nYou can customize the\
    \ filter chain in various ways:\n\n+   Disable some filters from the chain by\
    \ adding an enabled: false parameter. For instance, to disable the security filter,\
    \ write:\n\n```\nsecurity:\n  enabled: false\n```\n\n+   Do not remove an entry\
    \ from the filters.yml to disable a filter; symfony would throw an exception in\
    \ this case.\n\n+   Add your own declarations somewhere in the chain (usually\
    \ after the security filter) to add a custom filter (as discussed in the next\
    \ section). Be aware that the rendering filter must be the first entry, and the\
    \ execution filter must be the last entry of the filter chain.\n\n+   Override\
    \ the default class and parameters of the default filters (notably to modify the\
    \ security system and use your own security filter).\n\n# Building Your Own Filter\n\
    \nIt is pretty simple to build a filter. Create a class definition similar to\
    \ the one shown in Listing 6-26, and place it in one of the project's lib/ folders\
    \ to take advantage of the autoloading feature.\n\nAs an action can forward or\
    \ redirect to another action and consequently relaunch the full chain of filters,\
    \ you might want to restrict the execution of your own filters to the first action\
    \ call of the request. The isFirstCall() method of the sfFilter class returns\
    \ a Boolean for this purpose. This call only makes sense before the action execution.\n\
    \nThese concepts are clearer with an example. Listing 6-29 shows a filter used\
    \ to auto-log users with a specific MyWebSite cookie, which is supposedly created\
    \ by the login action. It is a rudimentary but working way to implement the “remember\
    \ me” feature offered in login forms.\n\n# Listing 6-29 - Sample Filter Class\
    \ File, Saved in apps/frontend/lib/rememberFilter.class.php\n\n```\nclass rememberFilter\
    \ extends sfFilter\n{\n```"
  merge: -1
  img_proc: true
- pgno: 93
  md: "```\npublic function execute($filterChain)\n{\n    // Execute this filter only\
    \ once\n    if ($this->isFirstCall())\n    {\n        // Filters don't have direct\
    \ access to the request and user objects.\n        // You will need to use the\
    \ context object to get them\n        $request = $this->getContext()->getRequest();\n\
    \        $user = $this->getContext()->getUser();\n\n        if ($request->getCookie('MyWebSite'))\n\
    \        {\n            // sign in\n            $user->setAuthenticated(true);\n\
    \        }\n    }\n\n    // Execute next filter\n    $filterChain->execute();\n\
    }\n}\n```\n\nIn some cases, instead of continuing the filter chain execution,\
    \ you will need to forward to a specific action at the end of a filter. sfFilter\
    \ doesn't have a forward() method, but sfController does, so you can simply do\
    \ that by calling the following:\n\n```\nreturn $this->getContext()->getController()->forward('mymodule',\n\
    'myAction');\n```\n\n> The sfFilter class has an initialize() method, executed\
    \ when the filter object is created. You can override it in your custom filter\
    \ if you need to deal with filter parameters (defined in filters.yml, as described\
    \ next) in your own way.\n\n# Filter Activation and Parameters\n\nCreating a filter\
    \ file is not enough to activate it. You need to add your filter to the filter\
    \ chain, and for that, you must declare the filter class in the filters.yml, located\
    \ in the application or in the module config/ directory, as shown in Listing 6-30.\n\
    \nListing 6-30 - Sample Filter Activation File, Saved in apps/frontend/config/filters.yml\n\
    \n```\nrendering: ~\nsecurity: ~\n\nremember:\n    # Filters need a unique name\n\
    \    class: rememberFilter\n    param:\n        cookie_name: MyWebSite\n     \
    \   condition: %APP_ENABLE_REMEMBER_ME%\n\ncache: ~\nexecution: ~\n```\n\nWhen\
    \ activated, the filter is executed for each request. The filter configuration\
    \ file can contain one or more parameter definitions under the param key. The\
    \ filter class has the"
  merge: -1
  img_proc: true
- pgno: 94
  md: "ability to get the value of these parameters with the getParameter() method.\
    \ Listing 6-31 demonstrates how to get a filter parameter value.\n\n```\nListing\
    \ 6-31 - Getting the Parameter Value, in apps/frontend/lib/rememberFilter.class.php\n\
    \nclass rememberFilter extends sfFilter\n{\n    public function execute($filterChain)\n\
    \    {\n        // ...\n\n        if ($request->getCookie($this->getParameter('cookie_name')))\n\
    \        {\n            // ...\n        }\n\n        // ...\n    }\n}\n```\n\n\
    The condition parameter is tested by the filter chain to see if the filter must\
    \ be executed. So your filter declarations can rely on an application configuration,\
    \ just like the one in Listing 6-30. The remember filter will be executed only\
    \ if your application app.yml shows this:\n\n```\nall:\n  enable_remember_me:\
    \ true\n```\n\n# Sample Filters\n\nThe filter feature is useful to repeat code\
    \ for every action. For instance, if you use a distant analytics system, you probably\
    \ need to put a code snippet calling a distant tracker script in every page. You\
    \ could put this code in the global layout, but then it would be active for all\
    \ of the application. Alternatively, you could place it in a filter, such as the\
    \ one shown in Listing 6-32, and activate it on a per-module basis.\n\n```\nListing\
    \ 6-32 - Google Analytics Filter\n\nclass sfGoogleAnalyticsFilter extends sfFilter\n\
    {\n    public function execute($filterChain)\n    {\n        // Nothing to do\
    \ before the action\n        $filterChain->execute();\n\n        // Decorate the\
    \ response with the tracker code\n        $googleCode = '\n<script src=\"http://www.google-analytics.com/urchin.js\"\
    \ type=\"text/\njavascript\">\n</script>\n<script type=\"text/javascript\">\n\
    _uacct=\"UA-'.$this->getParameter('google_id').'\";urchinTracker();\n</script>';\n\
    \        $response = $this->getContext()->getResponse();\n        $response->setContent(str_ireplace('</body>',\n\
    \        $googleCode.'</body>',$response->getContent()));\n    }\n}\n```"
  merge: -1
  img_proc: true
- pgno: 95
  md: "Be aware that this filter is not perfect, as it should not add the tracker\
    \ on responses that are not HTML.\n\nAnother example would be a filter that switches\
    \ the request to SSL if it is not already, to secure the communication, as shown\
    \ in Listing 6-33.\n\n# Listing 6-33 - Secure Communication Filter\n\n```\nclass\
    \ sfSecureFilter extends sfFilter\n{\n    public function execute($filterChain)\n\
    \    {\n        $context = $this->getContext();\n        $request = $context->getRequest();\n\
    \n        if (!$request->isSecure())\n        {\n            $secure_url = str_replace('http',\
    \ 'https', $request->getUri());\n\n            return $context->getController()->redirect($secure_url);\n\
    \            // We don't continue the filter chain\n        }\n        else\n\
    \        {\n            // The request is already secure, so we can continue\n\
    \            $filterChain->execute();\n        }\n    }\n}\n```\n\nFilters are\
    \ used extensively in plug-ins, as they allow you to extend the features of an\
    \ application globally. Refer to Chapter 17 to learn more about plug-ins.\n\n\
    # Module Configuration\n\nA few module behaviors rely on configuration. To modify\
    \ them, you must create a module.yml file in the module's config/ directory and\
    \ define settings on a per-environment basis (or under the all: header for all\
    \ environments). Listing 6-34 shows an example of a module.yml file for the mymodule\
    \ module.\n\n# Listing 6-34 - Module Configuration, in apps/frontend/modules/mymodule/config/module.yml\n\
    \n```\nall:   # For all environments\n  enabled:        true\n  is_internal: \
    \   false\n  view_class:     sfPHP\n  partial_view_class: sf\n```\n\nThe enabled\
    \ parameter allows you to disable all actions of a module. All actions are redirected\
    \ to the module_disabled_module/module_disabled_action action (as defined in settings.yml).\n\
    \nThe is_internal parameter allows you to restrict the execution of all actions\
    \ of a module to internal calls. For example, this is useful for mail actions\
    \ that you must be able to call from another action, to send an e-mail message,\
    \ but not from the outside."
  merge: -1
  img_proc: true
- pgno: 96
  md: 'The view_class parameter defines the view class. It must inherit from sfView.
    Overriding this value allows you to use other view systems, with other templating
    engines, such as Smarty.


    The partial_view_class parameter defines the view class used for partials of this
    module. It must inherit from sfPartialView.


    # Summary


    In symfony, the controller layer is split into two parts: the front controller,
    which is the unique entry point to the application for a given environment, and
    the actions, which contain the page logic. An action has the ability to determine
    how its view will be executed, by returning one of the sfView constants. Inside
    an action, you can manipulate the different elements of the context, including
    the request object (sfRequest) and the current user session object (sfUser).


    Combining the power of the session object, the action object, and the security
    configuration, symfony provides a complete security system, with access restriction
    and credentials. And if the preExecute() and postExecute() methods are made for
    reusability of code inside a module, the filters authorize the same reusability
    for all the applications by making controller code executed for every request.'
