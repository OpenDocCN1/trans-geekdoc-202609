    But maybe you need to output the label and the input of each field in <li> tags
    rather than in a <tr> tags. A field “row” is made of a label, an optional error
    message (added by the validation system, explained later in this chapter), a help
    text, and a widget (note that the widget can consist of more than one form control).
    Just as you can output the various fields of a form one by one, you can also render
    the various parts of a form independently. Instead of using renderRow(), use any
    of render() (for the widget), renderError(), renderLabel(), and renderHelp().
    For instance, if you want to render the whole form with <li> tags, write the template
    as follows:


    ```

    // in modules/foo/templates/contactSuccess.php

    <?php echo $form->renderFormTag(''foo/contact'') ?>

