- pgno: 237
  md: 'In this configuration, there are six sections. Four of them represent views
    (list, filter, new, and edit) and two of them are “virtuals” (fields and form)
    and only exists for configuration purpose.

    The following sections explain in detail all the parameters that can be used in
    this configuration file.


    # Generator Configuration


    The generator configuration file is very powerful, allowing you to alter the generated
    administration in many ways. But such capabilities come with a price: The overall
    syntax description is long to read and learn, making this chapter one of the longest
    in this book.

    The examples of this section will tweak the article administration module, as
    well as the comment administration module, based on the BlogComment class definition.
    Create the latter by launching the propel:generate-admin task:


    ```

    Listing 14-13

    $ php symfony propel:generate-admin backend BlogComment --module=comment

    ```


    # Figure 14-4 - The administration generator cheat sheet


    ![](img/0f886a7f4cbcc3939be96e985ca35ff4_237_0.png)


    # Fields


    By default, the columns of the list view are the columns defined in schema.yml.
    The fields of the new and edit views are the one defined in the form associated
    with the model (BlogArticleForm). With generator.yml, you can choose which fields
    are displayed, which ones are hidden, and add fields of your own—even if they
    don’t have a direct correspondence in the object model.


    # Field Settings


    The administration generator creates a field for each column in the schema.yml
    file. Under the fields key, you can modify the way each field is displayed, formatted,
    etc. For'
  merge: -1
  img_proc: true
- pgno: 238
  md: "instance, the field settings shown in Listing 14-5 define a custom label class\
    \ and input type for the title field, and a label and a tooltip for the content\
    \ field. The following sections will describe in detail how each parameter works.\n\
    \n# Listing 14-5 - Setting a Custom Label for a Column\n\n```\nconfig:\n  fields:\n\
    \    title:\n      label: Article Title\n      attributes: { class: foo }\n  \
    \  content: { label: Body, help: Fill in the article body }\n```\n\nIn addition\
    \ to this default definition for all the views, you can override the field settings\
    \ for a given view (list, filter, form, new, and edit), as demonstrated in Listing\
    \ 14-6.\n\n# Listing 14-6 - Overriding Global Settings View per View\n\n```\n\
    config:\n  fields:\n    title: { label: Article Title }\n    content: { label:\
    \ Body }\n\n  list:\n    fields:\n      title: { label: Title }\n\n  form:\n \
    \   fields:\n      content: { label: Body of the article }\n```\n\nThis is a general\
    \ principle: Any settings that are set for the whole module under the fields key\
    \ can be overridden by view-specific areas. The overriding rules are the following:\n\
    \n+   - new and edit inherits from form which inherits from fields\n+   - list\
    \ inherits from fields\n+   - filter inherits from fields\n\n# Adding Fields to\
    \ the Display\n\nThe fields that you define in the fields section can be displayed,\
    \ hidden, ordered, and grouped in various ways for each view. The display key\
    \ is used for that purpose. For instance, to arrange the fields of the comment\
    \ module, use the code of Listing 14-7.\n\n# Listing 14-7 - Choosing the Fields\
    \ to Display, in modules/comment/config/generator.yml\n\n```\nconfig:\n  fields:\n\
    \    article_id: { label: Article }\n    created_at: { label: Published on }\n\
    \    content: { label: Body }\n\n  list:\n    display: [id, blog_article_id, content]\n\
    \n  form:\n    display:\n```"
  merge: -1
  img_proc: true
