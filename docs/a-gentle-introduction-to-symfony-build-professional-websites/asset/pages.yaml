- pgno: 313
  md: '# PEAR Plug-Ins


    Plug-ins listed on the symfony plugin section can be bundled as PEAR packages
    and made available via the official symfony plugins PEAR channel: plugins.symfony-project.org.
    To install such a plug-in, use the plugin:install task with a plugin name, as
    shown in Listing 17-9.


    Listing 17-9 - Installing a Plug-In from the Official symfony plugins PEAR Channel


    ```

    $ cd myproject

    $ php symfony plugin:install pluginName

    ```


    Alternatively, you can download the plug-in and install it from the disk. In this
    case, use the path to the package archive, as shown in Listing 17-10.


    Listing 17-10 - Installing a Plug-In from a Downloaded PEAR Package


    ```

    $ cd myproject

    $ php symfony plugin:install /home/path/to/downloads/pluginName.tgz

    ```


    Some plug-ins are hosted on external PEAR channels. Install them with the plugin:install
    task, and don''t forget to register the channel and mention the channel name,
    as shown in Listing 17-11.


    Listing 17-11 - Installing a Plug-In from a PEAR Channel


    ```

    $ cd myproject

    $ php symfony plugin:add-channel channel.symfony.pear.example.com

    $ php symfony plugin:install --channel=channel.symfony.pear.example.com

    pluginName

    ```


    These three types of installation all use a PEAR package, so the term “PEAR plug-in”
    will be used indiscriminately to talk about plug-ins installed from the symfony
    plugins PEAR channel, an external PEAR channel, or a downloaded PEAR package.


    The plugin:install task also takes a number of options, as shown on Listing 17-12.


    Listing 17-12 - Installing a Plug-In with some Options


    ```

    $ php symfony plugin:install --stability=beta pluginName

    $ php symfony plugin:install --release=1.0.3 pluginName

    $ php symfony plugin:install --install-deps pluginName

    ```


    > As for every symfony task, you can have a full explanation of the plugin:install
    options and arguments by launching php symfony help plugin:install.


    # Archive Plug-Ins


    Some plug-ins come as a simple archive of files. To install those, just unpack
    the archive into your project’s plugins/ directory. If the plug-in contains a
    web/ subdirectory, don''t forget to run the plugin:publish-assets command to create
    the corresponding symlink under the main web/ folder as shown in listing 17-13.
    Finally, don''t forget to clear the cache.


    Listing 17-13 - Installing a Plug-In from an Archive


    ```

    $ cd plugins

    $ tar -zxpf myPlugin.tgz

    $ cd ..

    $ php symfony plugin:publish-assets

    $ php symfony cc

    ```'
