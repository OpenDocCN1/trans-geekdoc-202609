- pgno: 140
  md: '# Summary


    Symfony uses Doctrine as the ORM and PHP Data Objects as the database abstraction
    layer. It means that you must first describe the relational schema of your database
    in YAML before generating the object model classes. Then, at runtime, use the
    methods of the object and table classes to retrieve information about a record
    or a set of records. You can override them and extend the model easily by adding
    methods to the custom classes. The connection settings are defined in a databases.yml
    file, which can support more than one connection. And the command line contains
    special tasks to avoid duplicate structure definition.


    The model layer is the most complex of the symfony framework. One reason for this
    complexity is that data manipulation is an intricate matter. The related security
    issues are crucial for a website and should not be ignored. Another reason is
    that symfony is more suited for middle- to large-scale applications in an enterprise
    context. In such applications, the automations provided by the symfony model really
    represent a gain of time, worth the investment in learning its internals.


    So don''t hesitate to spend some time testing the model objects and methods to
    fully understand them. The solidity and scalability of your applications will
    be a great reward.'
  merge: -1
  img_proc: true
- pgno: 141
  md: '# # Chapter 9

    # Links And The Routing System


    Links and URLs deserve particular treatment in a web application framework. This
    is because

    the unique entry point of the application (the front controller) and the use of
    helpers in

    templates allow for a complete separation between the way URLs work and their
    appearance.

    This is called routing. More than a gadget, routing is a useful tool to make web
    applications

    even more user-friendly and secure. This chapter will tell you everything you
    need to know to

    handle URLs in your symfony applications:


    +   - What the routing system is and how it works

    +   - How to use link helpers in templates to enable routing of outgoing URLs

    +   - How to configure the routing rules to change the appearance of URLs


    You will also find a few tricks for mastering routing performance and adding finishing

    touches.


    # # What Is Routing?


    Routing is a mechanism that rewrites URLs to make them more user-friendly. But
    to

    understand why this is important, you must first take a few minutes to think about
    URLs.


    # # URLs As Server Instructions


    URLs carry information from the browser to the server required to enact an action
    as desired

    by the user. For instance, a traditional URL contains the file path to a script
    and some

    parameters necessary to complete the request, as in this example: http://www.example.com/

    web/controller/article.php?id=123456&format_code=6532


    This URL conveys information about the application''s architecture and database.
    Developers

    usually hide the application''s infrastructure in the interface (for instance,
    they choose page

    titles like "Personal profile page" rather than "QZ7.65"). Revealing vital clues
    to the internals

    of the application in the URL contradicts this effort and has serious drawbacks:


    +   - The technical data appearing in the URL creates potential security breaches.
    In the

    +   preceding example, what happens if an ill-disposed user changes the value
    of the id

    +   parameter? Does this mean the application offers a direct interface to the
    database?

    +   Or what if the user tries other script names, like admin.php, just for fun?
    All in all,

    +   raw URLs offer an easy way to hack an application, and managing security is
    almost

    +   impossible with them.

    +   - The unintelligibility of URLs makes them disturbing wherever they appear,
    and they

    +   dilute the impact of the surrounding content. And nowadays, URLs don''t appear

    +   only in the address bar. They appear when a user hovers the mouse over a link,
    as

    +   well as in search results. When users look for information, you want to give
    them'
