    # # User Session


    Symfony automatically manages user sessions and is able to keep persistent data
    between requests for users. It uses the built-in PHP session-handling mechanisms
    and enhances them to make them more configurable and easier to use.


    # ## Accessing the User Session


    The session object for the current user is accessed in the action with the getUser()
    method and is an instance of the sfUser class. This class contains a parameter
    holder that allows you'
