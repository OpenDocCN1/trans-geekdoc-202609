- pgno: 165
  md: "```\nvalue=\"0\"><label for=\"interests_0\">Programming</label></li>\n<li><input\
    \ type=\"checkbox\" name=\"interests[]\" id=\"interests_1\"\nvalue=\"1\"><label\
    \ for=\"interests_1\">Other</label></li>\n</ul>\n```\n\n> You probably noticed\
    \ that symfony automatically defines an id attribute for each form input, based\
    \ on a combination of the name and value of the widget. You can override the id\
    \ attribute widget by widget, or alternatively set a global rule for the whole\
    \ form with the setIdFormat() method of the sfWidgetForm class:\n\n```\nListing\
    \ 10-13\n// in modules/foo/actions/actions.class.php\n$this->form = new sfForm();\n\
    $this->form->getWidgetSchema()->setIdFormat('my_form_%s');\n```\n\n# # Foreign\
    \ Key Widgets\n\nWhen editing Model objects through a form, a particular list\
    \ of choices always comes up: the list of objects that can be related to the current\
    \ one. This happens when models are related by a many-to-one relationship, or\
    \ a many-to-many. Fortunately, the sfPropelPlugin bundled with symfony provides\
    \ a sfWidgetFormPropelChoice widget specifically for these cases (and sfDoctrinePlugin\
    \ offers a similar sfWidgetFormDoctrineChoice widget).\n\nFor instance, if a Section\
    \ has many Articles, you should be able to choose a section among the list of\
    \ existing ones when editing an article. To do so, an ArticleForm should use the\
    \ sfWidgetFormPropelChoice widget:\n\n```\nListing 10-14\n// in modules/foo/actions/actions.class.php\n\
    $articleForm = new sfForm();\n$articleForm->setWidgets(array(\n  'id' => sfWidgetFormInputHidden(),\n\
    \  'title' => sfWidgetFormInputText(),\n  'section_id' => sfWidgetFormPropelChoice(array(\n\
    \    'model' => 'Section',\n    'column' => 'name'\n  )\n)));\n));\n```\n\nThis\
    \ will display a list of existing sections... provided you defined a __toString()\
    \ method in the Section model class. That's because symfony first retrieves the\
    \ available Section objects, and populates a choice widget with them by trying\
    \ to echo each object. So the Section model should at least feature the following\
    \ method:\n\n```\nListing 10-15\n// in lib/model/Section.php\npublic function\
    \ __toString()\n{\n  return $this->getName();\n}\n```\n\nThe sfWidgetFormPropelChoice\
    \ widget is an extension of the sfWidgetFormChoice widget, so you can use the\
    \ multiple option to deal with many-to-many relationships, and the expanded option\
    \ to change the way the widget is rendered.\n\nIf you want to order the list of\
    \ choices in a special way, or filter it so that is displays only a portion of\
    \ the available choices, use the criteria option to pass a Criteria object to\
    \ the widget. Doctrine supports the same kind of customization: you can pass a\
    \ Doctrine_Query object to the widget with the query option."
