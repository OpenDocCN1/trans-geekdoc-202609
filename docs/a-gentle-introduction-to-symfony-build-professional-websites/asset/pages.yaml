  md: "```\n{\n return $this->getTitle();\n}\n}\n```\n\n# # Administration\n\nSymfony\
    \ can generate modules, based on model class definitions from the schema.yml file,\
    \ for the back-end of your applications. You can create an entire site administration\
    \ with only generated administration modules. The examples of this section will\
    \ describe administration modules added to a backend application. If your project\
    \ doesn't have a backend application, create its skeleton now by calling the generate:app\
    \ task:\n\n```\n$ php symfony generate:app backend\n```\n\nAdministration modules\
    \ interpret the model by way of a special configuration file called generator.yml,\
    \ which can be altered to extend all the generated components and the module look\
    \ and feel. Such modules benefit from the usual module mechanisms described in\
    \ previous chapters (layout, routing, custom configuration, autoloading, and so\
    \ on). You can also override the generated action or templates, in order to integrate\
    \ your own features into the generated administration, but generator.yml should\
    \ take care of the most common requirements and restrict the use of PHP code only\
    \ to the very specific.\n\n> Even if most common requirements are covered by the\
    \ generator.yml configuration file, you can also configure an administration module\
    \ via a configuration class as we will see later in this chapter.\n\n# # Initiating\
    \ an Administration Module\n\nWith symfony, you build an administration on a per-model\
    \ basis. A module is generated based on a Propel or a Doctrine object using the\
    \ propel:generate-admin task:\n\n```\n// Propel\n$ php symfony propel:generate-admin\
    \ backend BlogArticle --module=article\n```\n\n```\n// Doctrine\n$ php symfony\
    \ doctrine:generate-admin backend BlogArticle --module=article\n```\n\n> The administration\
    \ modules are based on a REST architecture. The propel:generate-admin task automatically\
    \ adds such a route to the routing.yml configuration file:\n\n```\n# apps/backend/config/routing.yml\n\
    article:\n class: sfPropelRouteCollection\n options:\n model: BlogArticle\n module:\
    \ article\n with_wildcard_routes: true\n```\n\nYou can also create your own route\
    \ and pass the name as an argument to the task instead of the model class name:"
