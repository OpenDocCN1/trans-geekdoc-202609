  md: "generator can also hide interactions according to credentials. Listing 14-31\
    \ demonstrates these features.\n\n# Listing 14-31 - Using Credentials in generator.yml\n\
    \n```\nconfig:\n  # The id column is displayed only for users with the admin credential\n\
    \  list:\n    title:       List of Articles\n    display:     [id, =title, content,\
    \ nb_comments]\n    fields:\n      id:        { credentials: [admin] }\n\n  #\
    \ The addcomment interaction is restricted to the users with the admin credential\n\
    \  actions:\n    addcomment: { credentials: [admin] }\n```\n\n# Modifying the\
    \ Presentation of Generated Modules\n\nYou can modify the presentation of the\
    \ generated modules so that it matches any existing graphical charter, not only\
    \ by applying your own style sheet, but also by overriding the default templates.\n\
    \n# Using a Custom Style Sheet\n\nSince the generated HTML is structured content,\
    \ you can do pretty much anything you like with the presentation.\n\nYou can define\
    \ an alternative CSS to be used for an administration module instead of a default\
    \ one by adding a css parameter to the generator configuration, as in Listing\
    \ 14-32.\n\n# Listing 14-32 - Using a Custom Style Sheet Instead of the Default\
    \ One\n\n```\ngenerator:\n  class: sfPropelGenerator\n  param:\n    model_class:\
    \       BlogArticle\n    theme:             admin\n    non_verbose_templates:\
    \ true\n    with_show:         false\n    singular:          BlogArticle\n   \
    \ plural:            BlogArticles\n    route_prefix:      blog_article\n    with_propel_route:\
    \ 1\n    actions_base_class: sfActions\n    css:               mystylesheet\n\
    ```\n\nAlternatively, you can also use the mechanisms provided by the module view.yml\
    \ to override the styles on a per-view basis.\n\n# Creating a Custom Header and\
    \ Footer\n\nThe list, new, and edit views systematically include a header and\
    \ footer partial. There is no such partial by default in the templates/ directory\
    \ of an administration module, but you just need to add one with one of the following\
    \ names to have it included automatically:"
