    \ a new one', 'article/write') ?></li>\n</ul>\n```\n\nAs explained in Chapter\
    \ 4, the alternative PHP syntax is preferable for templates to make them readable\
    \ for non-PHP developers. You should keep PHP code to a minimum in templates,\
    \ since these files are the ones used to design the GUI of the application, and\
    \ are sometimes created and maintained by another team, specialized in presentation\
    \ but not in"
