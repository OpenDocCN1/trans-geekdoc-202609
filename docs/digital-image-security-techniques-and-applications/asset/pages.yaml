  md: '+   - To protect the sender’s and receiver’s transaction records, ring signature
    and zero-knowledge proof protocol can be added to existing work.

    +   - The scalability problem is one of the key issues in the BC system due to
    the limited block size of a transaction.

    +   - An optimal trade-off should exist between the scalability, security, and
    decentralization characteristics during BC development. Figure 10.2 shows the
    relationship between these parameters.


    # 10.6 CONCLUSION


    We have discussed the basic need for multimedia security, challenges in existing
    watermarking methods, and how BC can be used with existing techniques to provide
    security solutions. Some existing joint watermarking-BC-based schemes are reviewed
    and compared in context to their methodology, objectives, cover type, and watermark
    size. Further, we have compared the BC techniques used in the chapter regarding
    BC type, storage type, smart contract, framework type, and consensus algorithm.
    In the end, potential issues and some research directions are suggested. It is
    concluded that the complete security of multimedia is still challenging for researchers.
    Therefore, existing systems indicate that much work is needed to manage the balance
    between security, storage, complexity, and usability for a real-time application.


