    It is clarified that QKD is a method used only for producing and distributing
    a “key.” QKD is not used to send or receive the message; however, the key is used
    to encrypt the message and send it or receive it over a channel.


    # 2.9.1 Types of QKD


    The whole process of quantum key distribution is carried out using qubits. Mostly
    photons are used as qubits, and standard protocols have been discovered to implement
    QKD. This QKD class of protocols can be divided into following categories [53]:


    +   1. Preparation and Measurement-based protocols,

    +   2. Entanglement-based protocols.


    BB84 protocol and E91 protocols are the most famous implementations of QKD, where
    the first corresponds to the Preparation and Measurement-based category and the
    second is based on Entanglement. T22 is the most recent protocol based on Entanglement
    proposed in 2022.


    As BB84 protocol has been widely discussed in the literature and in order to appreciate
    and understand the QKD using Entanglement, we shall discuss the T22 protocol in
    the next section [54].


    # 2.10 T22 PROTOCOL


    T22 is a quantum-resistant key exchange algorithm designed to protect data from
    quantum computing attacks. It is based on post-quantum cryptography and is believed
    to be secure against quantum computing attacks. It allows two parties to securely
    exchange a secret key over an unsecured channel without the risk of an eavesdropper
    intercepting it [54].


    T22 has a close relationship with Quantum Key Distribution (QKD); the T22 protocol
    can be used to implement QKD systems, as it provides a secure way to generate
    and exchange keys without the use of a trusted third party. Additionally, T22
    can be used to securely transmit messages between two parties using the generated
    secret key.


