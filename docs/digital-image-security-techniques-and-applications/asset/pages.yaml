    fusion is proposed for healthcare applications. Initially, NSCT-based fusion is
    applied on CT scan and MRI images to generate a fused image, used as watermark.
    Further, the fused mark is concealed in the NSCT-HDMSVD coefficients of the carrier
    image. The marked image is encrypted with updated stereo image encryption for
