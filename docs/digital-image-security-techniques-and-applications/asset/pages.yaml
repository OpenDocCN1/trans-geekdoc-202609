- pgno: 207
  md: 'sharing data embraces a better awareness of the threat vertical, a profound
    perception of threat actors and their TTPs, and a superior position to protect
    against surfacing risks [29].


    Additionally, sharing threats perks up synchronization for a cooperative knowledge,
    response to original pressure, and reduction of the probability of cascading effects
    across complete sectors, system, industry, or across sectors [29–33]. The major
    benefits of CTI are:


    +   - Offers a greater insight to possible cyber threats.

    +   - Prevents loss of knowledge by identifying cause of knowledge discharge.

    +   - Performs knowledge/data analysis to discover exploitable data points.

    +   - Gathers and shares knowledge to spread threat awareness.

    +   - Identifies security breaches at a preliminary stage.

    +   - Utilizes the compromise indicators for modeling a proactive defense line
    before any system compromise.

    +   - Boosts threat detection through prioritized event inspections.

    +   - Leverages a comprehensive vision to the threat scenario.

    +   - Situational awareness to potential threats in the enterprise.

    +   - Forms a landscape that provides strategic decisions to the threat vertical.

    +   - Associative approach for threat vertical for complete cyber protection.


    CTI supports organizations to overcome severe threat and security breaches, facilitates
    threat information processing to identify and understand threat horizon, quickly
    reacts to any stressed situation, and anticipates any further operation of the
    adversary. It enables investors to intelligently invest in any enterprise by minimizing
    the risk for faster and efficient outcome. Alternatively, it assists the security
    team to make an effective judgement for revealing the approach, movement, techniques,
    and procedures that enable effective security by making the goals of the attackers
    unattainable. Additionally, it decreases the cost and resource requirement and
    thus enhances the accuracy of the analysis.


    # 9.9 CHALLENGES OF CTI


    Generally, security teams cannot formulate valuable use of their threat data because
    it presents lots of threat intelligence, which in turn causes inconvenience. The
    everyday deposit of indicators seems to become much distrustful occurrence in
    internet. It offers approximately 250 million indicators in a single day [30].
    It enables consumers to assemble their own intelligence. The essential brain power
    is always required to examine the production speed of the threat data [34]. Timeliness
    or aptness of threat data is also crucial when defending against destructive attackers
    and zero-day utilizations.'
  merge: -1
  img_proc: true
- pgno: 208
  md: 'A few attractive motivating and challenging results of experiments on attacks
    display are: 75% of attacks spread from Victim 1 to Victim 2 within a time period
    of 24 hours, and larger than 40% strike the next organization in less than an
    hour. These results exert immense pressure on researchers in security to accumulate
    and allocate CIs extremely fast to develop collective attentiveness. This section
    illustrates present issues and challenges that must be faced by producers and
    consumers of CTI [35].


    **Challenge 1: Overburden of Threat Information:** Diverse open and closed sources
    of threat data are available, and they are completely free to be used. Consumers
    must access those data in proper time and find out actionable threat intelligence
    to protect from cyberattacks. However, due to the availability of a huge volume
    of data and a lack of sincerity and ability of the security team, many enterprises
    fail to resist cyber breaches [36, 37].


    **Challenge 2: Quality of Threat Information:** According to a survey, it was
    discovered that approximately 73% of threat data is fake, vague, imprecise, and
    sketchy, and cannot be relied on. These data are irrelevant and of poor quality.
    It is required to assist in making decisions and to enrich the security support
    system.


    **Challenge 3: Legal Issues to Privacy:** To deal with CTI, enterprises must always
    consider the legal issues for sharing CTIs and govern how the data violates privacy
    terms. Many organizations are concerned about negative publicity or legal rules
    of the countries. Most of the time international regulations also prevent diverse
    sensitive information sharing, and thus limit the cooperation of the organizations
    doing information sharing [38].


    **Challenge 4: Lack of knowledge of the Victimized Enterprise:** Sometimes the
    analytics itself does not know about being compromised and occurrence of any cyberattacks.
    In that situation, it is quite natural not to share CTI information [39, 40].


    # 9.10 CONCLUSION


    The innovative incident response viewpoint on CTI widens the scope and reorients
    the focus on standardization approaches that outline how to employ CTI artifacts
    for efficient cyber protection. CTI itself intends to become a dominant weapon
    to defend against adversaries. The motivation for this chapter stems from the
    current emergence of sharing CTI and the involved challenges of automating its
    processes. The comprehensiveness of the CTI paradigm makes it best to muddle through
    threats to information security and information systems. The sharing of CTI is
    a crucial part of multi-layered tools used to defend organizations and systems
    from a variety of threats. Moreover, the nature of data supported by a range of
    formats and languages is linked with'
