    # 2.7 CLASSICAL HASH FUNCTIONS


    A classical hash function is a type of cryptographic function used for data encryption
    and authentication. It is a mathematical algorithm that takes an input of any
    arbitrary length and produces a fixed-length output. The output is known as the
    hash value, which is unique for any given input. A traditional hash function generally
    has three main properties: it must be fast to compute, it must be one-way (i.e.,
    it should not be possible to derive the original message from the computed hash),
    and it should produce different output values for different inputs. The most common
    type of classical hashing functions are Message Digest algorithms (MD). MD take
    messages of arbitrary length and generate a fixed-length output known as a digest
    or a checksum. The resulting digest can then be used to verify the integrity of
    the initial message, since if any change is made to the message, then its digest
    will no longer match that originally provided by a secure source. Examples of
    popular Message Digest algorithms include MD5 (Message Digest 5) and SHA (Secure
    Hash Algorithm) [46].


    Another type of classical hashing functions is based on block cipher operations,
    such as DES or AES. Block ciphers require an input that consists of a sequence
    of blocks with identical size, so these types of algorithms may not always provide
    the best performance when dealing with messages that have variable lengths. Furthermore,
    block ciphers may require more storage space due to their larger input sizes when
    compared to other hashing functions such as MD or cyclic redundancy check (CRC)
    algorithms [47].'
