- pgno: 133
  md: '+   - Inverse MSVD, RDWT, HT transformation results in watermarked image ‘W_I’.


    # 6.3.2 Extraction technique


    +   - HT of ‘W_I’ watermarked image is evaluated, which results in ‘W_IR’ as the
    reflectance component, whereas ‘W_II’ as an illumination component.

    +   - RDWT is applied over ‘W_IR’ as:

    +     $$W_{IR} \xrightarrow{RDWT} [W_{IRLL}, W_{IRHL}, W_{IRLH}, W_{IRHH}] \tag{6.6}$$

    +   - MSVD coefficients of ‘W_IRLH’ are evaluated according to Eq. (6.7):

    +     $$W_{IRLH} \xrightarrow{MSVD} [X_4, U_4] \tag{6.7}$$

    +   - Extraction process is done in accordance with Eq. (6.8):

    +     $$X_5 = (X_4 - X_1)/\beta \tag{6.8}$$

    +   - Inverse MSVD and RDWT of ‘X_5’ is computed to retrieve the watermark image
    ‘W_mk’.


    # 6.4 SIMULATION RESULTS


    The proposed watermarking technique in this chapter is implemented using ‘MATLAB’.
    Several cover images, which comprise standard and medical images [28, 29] of size
    512 × 512, are taken, while a watermark image of size 512 × 512 is chosen. Cover
    images are represented in Figure 6.2(a), and a watermark image in Figure 6.2(b).
    The value of ‘β’ is selected as 0.1 for experimental analysis. Weighted peak signal-to-noise
    ratio (WPSNR) [30, 31], PSNR, structural similarity index (SSIM), and normalized
    correlation (NC) [31] metrics are evaluated for analyzing the proposed technique
    imperceptibility and robustness. The values of these metrics are tabulated in
    Table 6.1, which clearly emphasizes performance of the proposed technique under
    no attacks. 53.22179 dB and 66.17175 dB are the mean values of PSNR and WPSNR,
    respectively, while NC and SSIM values are near to unity.


    Proposed technique robustness is analyzed under several attacks such as sharpening,
    affine, compression, etc. Figure 6.3 illustrates the ‘Airplane’ watermarked image
    subjected to different attacks and corresponding retrieved watermark images. Proposed
    technique is robust toward attacks, as the visual quality of extracted watermark
    images is better. In Tables 6.2, 6.3, 6.4, and 6.5 NC values are computed for
    the proposed technique under different attacks.'
