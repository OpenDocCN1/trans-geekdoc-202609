    32-bit word.


    x_i = [ X / 2^{8i} ] mod 2^8 i = 0, ... 3  (13.14)


    y_i = s_i [x_i] I = 0, ... 3  (13.15)


    (z0 z1 z2 z3)^T = ( ... MDS ... ) . (y0 y1 y2 y3)^T  (13.16)


