  md: '# 9.3 THREAT INTELLIGENCE MODELING


    The fundamental concept of threat analysis by tracing cyberattacks basically depend
    on identification of the initial point of the attack, the path of progress, and
    discovering the attackers. This procedure sends a final proactive response to
    the cyberattack. Large-scale, high-quality security and event data are required
    for a comprehensive threat analysis. A distinctive digital environment includes
    multiple intricate interfaces that explicitly produce heterogonous and complex
    event data. Threat modeling methodology includes defining the characteristics
    of those data and formulation of technically expressing of same.


    The Incident Object Description Exchange Format (IODEF) [21, 22] is the initial
    model that expresses the data associated with the cyberattacks. It is treated
    as the pioneer of this domain. Multiple researches have extended the results for
    interactive data sharing and for combining it with data expressing formats to
    form a further superior CTI system. The present de facto standard for advanced
    CTI and data sharing related to compromised cyberattacks are Structured Threat
    Information Expression (STIX)[23] and Trusted Automated Exchange of Intelligence
    Information (TAXII) [24, 25]. Several industrial data sharing and management are
    handled by these two CTI systems. Automated Threat Intelligence fuSion framework
    (ATIS) is another framework used for CTI implementations in terms of five different
    aspects that are analyzing, gathering, controlling, refining, and finally applying
    the refined data. Each aspect of ATIS peruses a precise role and simultaneously
    investigates heterogeneous data efficiently with the help of interacting among
    every adjacent aspect. Mantis is another platform proposed by Gascon et al. [27]
    that incorporates cyber threat data using diverse standards and recognizes the
    associations between threat data in terms of a correlation determination algorithm
    using an attributed-based graph. It showed on average approximately 80% accuracy
    in detecting single set threat intelligence data. CI Automatic Extractor (iACE)
    [27] is another platform proposed for data extraction utilizing natural language
    processing technology using a mining procedure for perfect analysis of the retrieved
    data. Patterns analysis and cyberattack identification by recognizing the grammatical
    links between the tokens are performed by iACE. This extracted data is then converted
    into the OpenIOC format. Nearly 75,000 articles and technical blogs were searched
    to find cyber threats, among which the accuracy rate of CTI identification is
    around 95%.


    Threat modeling has also stepped forward in the direction of modeling the effectiveness
    and cost of the choices made by the defenders for identifying CTIs through game
    theory fusion. Moving Target Defenses (MTD) [27] procedures model the CTIs by
    the Markov game in a distributed network environment via the relations among the
    digital devices and attackers. In such cases, optimal behavior is determined in
    the zero-knowledge environment of IoT framework. Optimal MTD procedure implements
    the Markov'
