    chapter.


    **Mist Computing (MC):** Edge computing in the form of Mist Computing (MC) is
    simple and light (EC). With this model, networking, storage, and elastic compute
    services are extended from the edge to the absolute edge/endpoints. Modern smart
    endpoints can execute analyses and applications independently with real-time query
    and NoSQL-like files system support because of improved networking stacks, greater
    memory, and more effective CPUs. The mist encompasses smart devices and sensory
    networks, and the paradigm has the advantage of keeping sensor data near to its
    source and avoiding network exchange unless absolutely necessary. To limit the
    power ingestion of the IoT device, it is only employed in the event of a cloud-to-IoT
    device communication failure [16].


