    # 11.1 INTRODUCTION


    Medical image security and authorization ensures integrity, confidentiality, and
    availability of patient medical information. Quality assessment of medical images
    has a great role in evaluating the fidelity of medical images, tamper detection,
    and suitability for the intended purpose. The requirements of quality assessment
    in medical images in security and authentication are [1]:


    +   - **Image Quality:** The quality of the medical images must be verified to
    ensure that the quality is sufficient for disease diagnosis, disease treatment,
    and research.

    +   - **Authenticity:** Medical images must be authenticated that they are genuine
    and not altered or tampered.

    +   - **Integrity:** Medical image integrity should be verified that they are
    not modified and corrupted during transmission, storage, and processing.

    +   - **Confidentiality:** Medical images must be protected from unauthorized
    access and disclosure to maintain patient privacy.


    Image quality is important to ensure that appropriate techniques and standards
    are applied to safeguard patient information and maintaining the trust of patients
    and healthcare providers. It helps in detecting distortions in an image, making
    it easier to analyze and detect any tampering or modifications [2]. Medical image
    authentication and security are important issues in the healthcare industry, as
    they play a crucial role in ensuring the privacy and confidentiality of sensitive
    patient information. Medical images contain a wealth of personal and confidential
    information that must be protected'
  merge: -1
  img_proc: true
- pgno: 238
  md: 'from unauthorized access and manipulation. There are several ways to address
    the challenge of medical image authentication and security [3]:


    +   - **Encryption:** Medical images can be encrypted using various algorithms
    to protect the confidentiality of the information contained in the images. This
    makes it difficult for unauthorized users to access the data [4].

    +   - **Access Control:** An access control mechanism such as user authentication
    and authorization can be put in place to ensure that only authorized individuals
    can access the medical images.

    +   - **Digital Signature:** A digital signature can be used to verify the authenticity
    of medical images and ensure they have not been tampered with.

    +   - **Watermarking:** Watermarking is a technique for embedding information
    in an image that can be used to track the origin and authenticity of the image.

    +   - **Auditing and Logging:** Keeping track of who accesses the medical images,
    when and for what purpose can help detect and prevent unauthorized access.

    +   - **Cloud Storage:** Storing medical images on secure, HIPPA-compliant cloud
    servers can help ensure the security of the data [1].


    Keeping patient information secure and private is a very crucial task when communicating
    medical data through insecure channels. Medical data may be maliciously tampered
    with and illegally copied without authorization. These causes necessitate the
    application of integrity authentication and copyright protection in medical images.
    Many studies have been proposed for medical image authorization and security.
    These methods require a good robustness against noises and distortions like Gaussian
    noise, blur, and channel fading.


    An approach for medical image security was introduced by Alqahtani et al. [4].
    Their approach was based on Fractional Fourier Transform (FFT) and Jigsaw Transform
    (JT). They considered different noise effects like Gaussian noise, Salt and Pepper
    noise, Speckle noise, and Poisson noise in encryption and decryption efficiency.


    A medical image authentication method was proposed by Sun et al. [5] by using
    wavelet packet decomposition. The authors verified the robustness of the result
    in resisting both additive and multiplicative noises.


    The perceptual quality of medical images can be assessed automatically by using
    Image Quality Assessment (IQA) methods. Medical image quality assessment can be
    performed by subjective and objective approaches. A subjective assessment approach
    is carried out by measuring the image quality. Mathematical calculations are required
    for objective assessment approach. The objective approach results should match
    with the subjective approach results. Distortion in medical images may be caused
    due to several factors, such as operator mistake, fault in equipment, acquisition,
    compression,'
  merge: -1
  img_proc: true
- pgno: 239
  md: 'enhancement, and reconstruction process [6]. Due to the above reasons, subjective
    assessment may lead to inappropriate diagnosis. Therefore, objective assessment
    is highly recommended for medical image quality assessment [7]. Objective quality
    assessment can be Full Reference image quality assessment (FR-IQA) [8, 9], Reduced
    Reference image quality assessment (RR-IQA), and No Reference image quality assessment
    (NR-IQA). In FR-IQA, an undistorted image is used to determine the quality assessment.
    In RR-IQA, a part of the undistorted image should be available to determine the
    image quality assessment. In the case of NR-IQA, a reference image is not required
    to find the quality factor. In medical science, it is not possible to obtain an
    undistorted image. Therefore, FR-IQA and RR-IQA methods are not appropriate for
    medical images, while NR-IQA is a suitable technique to predict the quality of
    medical images [10]. Figure 11.1 shows the classification of image quality assessment
    techniques. The comparison of different image quality assessment methods is shown
    in Table 11.1.


    NR-IQA is a method of accessing the quality of a digital image without reference
    to a “ground truth” or reference image. Traditional mage quality assessment methods
    compare an image to a reference image to determine quality. NR-IQA methods analyze
    the specific image features and attributes to impact image quality such as sharpness,
    contrast, and noise [11]. These methods use statistical models and machine learning
    algorithms to predict image quality based on these features. A NR-IQA was proposed
    by Omarova et al. [12] to contrast enhancement of poor quality X-ray image affected
    by environmental noise. They applied CLAHE and Gamma correction method for image
    enhancement and determined the quality of X-ray image by using NIQE and Blind
    Referenceless Image Spatial Quality (BRISQUE) functions. A NR-IQA method is proposed
    by Kumar et al. [13] to determine quality of the image by measuring the image
    sharpness. Difference of difference to edge was calculated to find the quality
    of the image. A NR-IQA method was proposed by Saad et al. [14] that used the Natural
    Scene Statistic (NSS) model for DCT coefficients. The quality score was predicted
    using the


