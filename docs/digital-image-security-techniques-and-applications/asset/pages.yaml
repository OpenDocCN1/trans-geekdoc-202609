  md: '# 5.7 CONCLUSION


    A consistent and undetectable image watermarking method is put forth in this chapter
    using the Hénon map, Chaotic logistic map, LWT, and QR decomposition. BRISK features
    are used for authentication. Dual watermark images are used to further enhance
    the security of the presented work. Both the watermark images are well retrieved.
    All performance parameter values fall well within the permitted range. The proposed
    watermarking method has higher robustness and imperceptibility in comparison with
    other techniques, as shown in Section 5.6. The proposed work can further be improved
    for geometric attacks. The scaling value is crucial to the watermarking process;
    therefore, optimization techniques can further be used to obtain the optimized
    scaling factor to balance between the performance parameters.


