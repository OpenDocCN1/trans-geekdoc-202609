- pgno: 1
  md: '# Digital Image Security


    This book highlights cutting-edge research with a particular emphasis on interdisciplinary
    approaches, novel techniques, and solutions to provide digital image security
    for applications in diverse areas. It further discusses important topics such
    as biometric imaging, big data security and privacy in healthcare, security and
    privacy in the Internet of Things, and security in cloud-based image processing.


    This book


    +   - Presents new ideas, approaches, theories, and practices with a focus on
    digital image security and privacy solutions for real-world applications.

    +   - Discusses security in cloud-based image processing for smart city applications.

    +   - Provides an overview of innovative security techniques that are being developed
    to ensure the guaranteed authenticity of transmitted, shared, or stored digital
    images.

    +   - Highlights approaches such as watermarking, blockchain, and hashing to secure
    digital images in artificial intelligence, machine learning, cloud computing,
    and temper detection environments.

    +   - Explains important topics such as biometric imaging, blockchain for digital
    data security, and protection systems against personal identity theft.


    It will serve as an ideal reference text for senior undergraduate and graduate
    students, academic researchers, and professionals in fields including electrical
    engineering, electronics, communications engineering, and computer engineering.'
