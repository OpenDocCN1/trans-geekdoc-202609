  md: '# 7.5 CONCLUSION AND FUTURE SCOPE


    The rapid development in the field of communication provides abundant availability
    of real-time multimedia data and other streaming services 24/7. This calls for
    innovative approaches to guarantee handling heterogeneous voluminous data, maintaining
    low latency, less bandwidth requirement, and secure transmission with ensuring
    good quality of service (QoS) in real time, which are some of the major problems
    associated with storing, processing, and delivering multimedia data in real time.
    This chapter discusses edge computing technologies, mainly MEC, Fog technology,
    and Cloudlets. These technologies offer promising and workable solutions to handle
    various requirements and overcome challenges mentioned in the chapter by designing
    scalable edge computing infrastructure. The chapter also presents a review of
    work done in this area where edge computing provides a way to reduce transmission
    cost, less latency, low bandwidth utilization, energy-efficient usage, and other
    challenges.


    This chapter also proposes applying Machine Learning and Deep Learning techniques
    for performing data analytics at edges for smooth availability of multimedia services
    to users. DNNs, Reinforcement Learning, and Deep-Q-Learning are some of the commonly
    used cutting-edge solutions to perform data training, inferencing, learning at
    edges, and managing computational offloading, among other challenges to designing
    a scalable edge ecosystem. It also promises another solution using P2P networking
    with edge computing by mixing Content distribution networks (CDN) caching with
    P2P structure to distribute video streaming in real time by lowering download
    time. Analysis based on the result of the simulation reveals that edge computing
    architecture that is distributive in nature with P2P offers a sustainable scalable
    environment to deliver trustworthy services and meets the requirement of low transmission
    rate and network latency. Thus, it may provide high user satisfaction by extending
    unfazed video and multimedia streaming services at a lower cost than conventional
    streaming methods.


    Future chapters will focus more on precisely designing edge infrastructure for
    a specific challenge with some real-world data analysis.


