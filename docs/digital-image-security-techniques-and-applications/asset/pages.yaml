- pgno: 217
  md: 'The rest of this chapter is organized as follows. Section 10.3 details the
    classification of BC framework for digital content protection. Section 10.4 reviews
    the most recent works in the watermarking-blockchain domain using images. In Section
    10.5, based on the survey, we mention some of the identified issues with watermarking-blochchain
    environments. Finally, in Section 10.6, we conclude the chapter.


    # 10.3 CLASSIFICATION OF BC FRAMEWORK FOR DIGITAL CONTENT PROTECTION


    This section describes the essential requirement for classifying the BC framework
    to provide digital content protection. The BC framework comprises seven parts,
    with several sub-divisions if required. The comprehensive classification of the
    BC framework for digital content protection is depicted in Figure 10.6.


    # 10.3.1 Types of blockchain systems


    The three major types of BC systems are as follows:


    +   - **Public:** Any node can join the BC network with read and write access.
    It applies consensus protocol to ensure the BC network is trustworthy. This type
    of BC is termed permission-less. Bitcoin and Ethereum are the most common examples
    of public BC.

    +   - **Private:** Only permissioned nodes can participate in the BC network in
    this mechanism. The trusted third party and encrypted database are performed to
    manage this permissioned node in the BC framework. This type of BC is termed permissioned.
    Multi-chain is an example of a private BC.

    +   - **Hybrid:** This mechanism combines the features of public and private BCs.
    All operations are verified using a multi-party consensus protocol under hybrid
    BC. Hyperledger and Quorum are the most common examples of hybrid BC systems.


    # 10.3.2 Types of transactions


    The transaction signifies a transition state that modifies data from one value
    to another in the BC framework. Here, we have described three types of BC transactions.


    +   - **On-chain:** This transaction type is visible to all the participants in
    the available network, and several details are captured on the blocks and distributed
    among entire BC networks.'
