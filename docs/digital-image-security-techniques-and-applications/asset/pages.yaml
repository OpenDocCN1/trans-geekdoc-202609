    # 11.4 CONCLUSION


    A distortion generic No Reference Image Quality Assessment (NR-IQA) algorithm
    was developed in this chapter that operates in Wavelet domain. A NSS-based no
    reference quality assessment method was proposed for assessing quality of a medical
    image without using a reference image considering various distortions to be applied
    in image security and authorization. First, the features are extracted from the
    distorted image in wavelet domain and is then processed using SVR technique to
    estimate the image quality index. Experiments were performed on NIH database,
    and the proposed algorithm achieved a good performance over existing NR-IQA methods
    in terms of SROCC, PLCC, and RMSE parameters. Simulation results proved that the
    quality index of the proposed method is in line with FR-IQA methods and better
    than existing NR-IQA methods. In the future, a hybrid method may be developed
    considering the image features in various domains to extract more features from
    the medical images to produce a more accurate quality index.


