    OpenFog Reference Architecture is an open and unified architectural framework
    provided by the OpenFog Consortium for fog computing that enables combining edge
    and/or fog environment under defined standards. This reference architecture was
    accepted as an official standard by IEEE Standards Association in 2018 under IEEE
    1934 [14].


    Figure 7.6 displays a general layered architecture for edge computing that is
    simple to understand. The topmost layer shown in Figure 7.6 is made up of various
    sensing pieces of equipment, covering many mobile and cellular sensing devices.
    These devices can be wearables such as smartwatches, smart bands, and other sensing
    devices used in the healthcare industry or we can say the Internet of Medical
    Things (IoMT), transportation, agriculture, weather forecasting, supply chain
    industry, and in many other domains. Here, original data can be produced or sampled,
    which is then sent to the middle layer for subsequent operations. The edge layer,
    which has many edge nodes with computation and storage capabilities, is the middle
    layer. It exists to provide customers with temporary data storage and processing
    offloading, while at the same time lessening the pressure on the cloud. Edge servers,
    which could include mini data centers, routers, and IoT gateways, in mobile network
    base stations, on automobiles, among other places, that'
