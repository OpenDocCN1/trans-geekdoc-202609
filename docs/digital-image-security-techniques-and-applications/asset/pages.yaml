- pgno: 58
  md: 'In fact, if there are multiple receivers, then each can have a different key,
    while the sender’s key can be unique. This is the most basic fundamental behind
    asymmetric key encryption [7].


    # 3.2.1.1 RSA algorithm


    RSA algorithm, named after Rivest-Shamir-Adlemann, its inventors, is a widely
    used encryption algorithm based on the mathematical properties of large prime
    numbers [8]. It is commonly used to secure sensitive information, such as credit
    card numbers and passwords, during online transactions. RSA is an asymmetric algorithm,
    which means that it uses a pair of keys for encryption and decryption: a public
    key, which can be distributed to anyone, and a private key, which is known only
    to the owner of the data. Data encrypted with the public key can only be decrypted
    with the corresponding private key. Despite being in use for approximately three
    decades, RSA algorithms are still some of the most celebrated and used algorithms
    [9].


    # 3.2.2 Image security


    One way to enhance image security is to consider it as data and encrypt the same
    as a substitution/transpositional cipher.


    The next step would be to use asymmetric key encryption. This is useful when the
    image is required to be accessed by multiple receivers simultaneously, and we
    have a method of transmitting the receivers their key in advance through a secure
    channel [3]. The most popular algorithms used for asymmetric key encryption are
    again the RSA as introduced above [8] [10], Digital Signature Algorithm (DSA)
    [11, 12], YAK [13], Diffie Hellman algorithm and its variations [14], El Gamal
    [15] and its variations [16], Merkle’s Puzzles [17], Elliptic Curve Cryptography
    (ECC) [18, 19], Chaotic map [20], and Hyper-chaotic map [21]. These general classes
    of algorithms have multiple specific implementation techniques that perform differently
    on various evaluation parameters. Table 3.1 compares different image encryption
    techniques on a set of parameters [6].


    A comparison of the computation time for these image encryption techniques is
    shown in Table 3.2.


    # 3.2.3 Discussion and analysis


    Classical image encryption techniques unfortunately include the following fundamental
    issues:


    Drawbacks of classical image security algorithms


    +   1. The assumption of a secure channel for the key exchange.

    +   2. There is a no way to detect if an attempt has been made to intercept and
    decode the transmitted message.'
