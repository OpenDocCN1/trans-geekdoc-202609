- pgno: 17
  md: '![](img/6e4271af21d9a195003ab8711aa79d27_17_0.png)


    Figure 1.1 Non-subsampled contourlet transform.


    Here, Z_L(l) and R_L(l) denote the decomposed and reconstructed low-pass filters,
    respectively. Also, decomposed and reconstructed high-pass filters are denoted
    by Z_H(l) and R_H(l).


    In the next stage, NSDFB is implemented on a high-pass sub-band with ‘d’ level
    directionality. It results in total 2^d directional sub-bands whose size is the
    same as that of the input image; it provides more precise directional information.
    The procedure of NSCT decomposition of an input image is shown in Figure 1.1 [23].


    # 1.3.2 Hessenberg Decomposition (HD)


    In linear algebra, the matrix decompositions of square matrix are done with the
    help of HD [25]. It decomposes the square matrix, ‘A’ of size ‘m × m’ into the
    product of three matrices, which is mentioned in Eq. (1.2).


    PHP^T = HD(A)

    (1.2)


    Where, ‘P’ is indicated as orthogonal matrix and ‘H’ is an upper Hessenberg matrix,
    and h_{i,j}=0, where i > j + 1.

    The mathematical computation of HD is obtained with the help of Householder matrices.
    The mathematical equation of Householder matrix, ‘Q’ is described below.

    Q = (I_n - 2 μ μ^T) / μ^T μ

    (1.3)

    Where, ‘I_n’ is denoted as identity matrix with dimension ‘m × m’, and ‘R’ is
    an orthogonal matrix. ‘μ’ is termed as non-zero vector.'
