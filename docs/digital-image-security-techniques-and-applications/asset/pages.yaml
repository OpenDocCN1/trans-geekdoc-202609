    \ D₂W is the diagonal matrix corresponding to d₂W.\n\n[Q₁W,R₁W] = qr(HL₁W) (5.20)\n\
    \n{ d₁W = diag(R₁W) \n  D₁W = diag(d₁W) } (5.21)\n\n[Q₂W,R₂W] = qr(LH₁W) (5.22)\n\
    \n{ d₂W = diag(R₂W) \n  D₂W = diag(d₂W) } (5.23)\n\n**Step 4:** Apply inverse\
    \ process as shown in Eqs. (5.24) and (5.25):\n\nsw₁ = (D₁W − D₁)/α (5.24)\n\n\
    sw₂ = (D₂W − D₂)/α (5.25)\n\nwhere sw₁ and sw₂ are the extracted diagonal components\
    \ corresponding to their watermark images.\n\n**Step 5:** Add the above extracted\
    \ diagonal components corresponding to their components, excluding diagonals (s₁₋W\
    \ and s₂₋W).\n\n**Step 6:** Apply inverse QR decomposition and LWT to get the\
    \ first watermark image back.\n\n**Step 7:** Apply inverse QR decomposition, Hénon\
    \ decryption, and inverse LWT to get the second watermark image back.\n\n# 5.4\
    \ SIMULATION RESULTS AND DISCUSSION\n\nThe proposed algorithm is implemented with\
    \ the help of MATLAB R2017a installed in the system with specifications as Lenovo\
