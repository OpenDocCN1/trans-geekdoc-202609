    or file, running it through a one-way cryptographic hash function, and then using
    the resulting output (called the digest) as an encryption key. By using this technique,
    the same message can be encrypted multiple times but each time with a different
    key, making it virtually impossible to reverse engineer the original message.
    The hash function also ensures that any changes made to the input will produce
    drastically different outputs, making it equally difficult to attempt to tamper
    with or alter the original file without detection [53].


