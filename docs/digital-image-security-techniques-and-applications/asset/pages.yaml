    # 7.4.1 Applying Machine Learning (ML) and Deep Learning (DL) techniques for MM
    data analysis


    In this section, we will present a brief review of Machine Learning, as well as
    Deep Learning methods applied in many works as a means to design an appropriate
    Edge Ecosystem based on achieving the objective of low latency, less bandwidth,
    improved QoE, and QoS and others mentioned in Section 3.2 to process multimedia
    data incoming at edges. We briefly focus on aspects of data analysis, computational
    offloading, and content caching in this chapter for simplicity so that readers
    can understand this complex concept in simple terms in order to design the proposed
    system. These three major concerns have been prioritized, but the content is so
    complex and vast that it cannot be fully covered in one chapter.


    Because of constrained energy budgets and poor computation capacities, edge devices
    have a resource-constrained environment that makes it difficult to install needed
    data analytics, especially in real-time applications, so the main contribution
    here consists of solution provided as services, learning, and inferencing at edges
    using multiple DL techniques for real-time analytics.


    # 7.4.1.1 Services at edge


    Several processes provide various multimedia services carried out at the edge
    network, thanks to multimedia edge computing. These services include sensing or
    identifying data, synthesizing data, and employing Machine Learning techniques
    for training and inferencing at edges, as shown in Figure 7.9.


    ![](img/6e4271af21d9a195003ab8711aa79d27_161_0.png)


    Figure 7.9 Machine and Deep Learning in cloud and edge environment services.'
