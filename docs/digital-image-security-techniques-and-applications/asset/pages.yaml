    Apart from the above challenges, edge computing still faces some challenges, even
    though it shows promising results. These problems are defined below:


    +   - **Naming Schema:** There is no standard format available to name the edge
    computing mechanism. It creates difficulty for the programmer to understand which
    network and communication protocol is used.

    +   - **Programmability:** Edge computing architecture is heterogeneous in nature.
    Programmers use different languages at different levels as compared to cloud computing,
    which is known for its transparency. Therefore, it is difficult to implement and
    understand code for it.

    +   - **Managing edge devices:** Managing devices at the edge is a complex task.
    It involves factors such as mobility (shifting and gathering data from different
    location), scalability, security and privacy, heterogeneity, etc.


