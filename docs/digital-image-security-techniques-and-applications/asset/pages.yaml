  md: '# 5.2.3 Hénon map


    In 1976, Michel Hénon, a French mathematician and astronomer, proposed the Hénon
    map, a two-dimensional map [21]. The following equations can be used to define
    the Hénon map mathematically [22]:


    $$p(j+1)=1+q(j)-a_1 \times p(j)^2 \tag{5.2}$$ $$q(j+1)=a_2 \times p(j) \tag{5.3}$$


    a₁ and a₂ are referred to as bifurcation parameters in Eqs. (5.2) and (5.3). The
    values of p and q have no bearing on the contraction in a 2D Hénon map. The Hénon
    attractor for a₁ = 1.4, and a₂ = 0.3 is shown in Figure 5.4.


    # 5.2.4 Chaotic logistic map


    The behavior of some nonlinear dynamic systems that, under certain circumstances,
    display dynamics that are sensitive to beginning conditions, is described by chaos
    theory [23]. The state evolution [23] can be described as shown in Eq. (5.4).


    $$z(i+1)=r \times z(i) \times (1-z(i)) \tag{5.4}$$


    where r ∈ [0, 4] and Figure 5.5 shows the logistic encrypted watermarked image.


    ![](img/6e4271af21d9a195003ab8711aa79d27_110_0.png)


    Figure 5.4 Hénon attractor.'
