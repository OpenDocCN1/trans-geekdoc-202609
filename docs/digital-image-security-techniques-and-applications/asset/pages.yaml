    # 12.2.3 Deep learning approaches


    Deep learning (DL) is a broad family of machine learning techniques relying on
    deep neural networks (DNN), which comprise multiple processing layers. The stack
    of the processing layers aims to extract progressively higher-level features from
    input data. Deep learning models performed well in almost all domains due to their
    generalization capabilities and automatic feature selection properties. Convolutional
    neural network (CNN) is one of the most successful networks of DL. Over time,
    CNNs have significantly improved due to new experiments, concepts, and the availability
    of processing and computational power. That has led to an increase in the number
    of CNN models and networks that are employed in the literature, such as VGG [37],
    ResNet [38], Efficientnet [39], etc. This section presents various DL-based methods
    for copy-move forgery detection. Krishnaraj et al. [40] developed a fusion model
    for copy-move forgery detection and localization. In particular, they fused GAN
    (Generative Adversarial Network) and DenseNet. An extreme learning classifier
    then ingests the outcomes. The authors performed parameter tuning of the model
    utilizing the Fish Swarm algorithm. Mallick et al. [41] developed a CNN-based
    method for copy-move and splicing forgery detection. First, the authors converted
    the input images to error-level analysis. Then, the feature extraction method
    relies on VGG (16 and 19) models and uses these pre-processed pictures. The pictures
    are finally classified using softmax with root mean squared propagation optimization.
    In another work [42], Chen et al. developed a DL detection and localization model.
    The authors connected two networks: a serial network with a copy-move similarity
    detection network and a source/target region distinguishment network. The first
    model was utilized to detect similar regions in the image, with the second distinguishing
    the tampered portions from the images out of the first model. A team of researchers
    proposed a two-stage copy-move forgery detection method in [43]: first, a self-deep
    matching network is designed as a backbone utilizing convolution integration,
    skip matching, and spatial attention methods. The backbone network generates a
    score map of suspected forged regions in the image. Spatial attention is used
    on self-correlation to strengthen the capacity to identify regions with similar
    appearances. The model is proposed to fix incomplete and eliminate false areas.
    Hosny et al. [44] presented an approach for copy-move forgery detection using
    a customized CNN model consisting of three convolutional layers and two max pooling
    layers for feature extraction. Fully connected layers are used to classify images
