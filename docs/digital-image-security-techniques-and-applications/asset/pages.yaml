    presents the discussion on the significance of cancelable biometrics along with
    the open challenges. The chapter is concluded in Section 14.7.


    # 14.2 CANCELABLE BIOMETRICS


    Cancelable biometrics is one of the categories of fingerprint template protection.
    The concept of template protection approaches based on transformation, i.e., cancelable
    biometrics, was first presented by Ratha et al. [8]. In this work, various points
    of a biometric system were identified as potential points to be attacked, and
    a concept of cancelable biometrics was introduced. In cancelable biometrics, the
    original features extracted from the fingerprint are transformed before storing
    them in the database as a user template. The utilization of transformation is
    done in such a way that the distinctiveness of the unique features of fingerprint
    biometrics should be preserved. In other words, the inter-class dissimilarity
    and intra-class similarity should be preserved when we perform any kind of transformation
    of the actual information of the minutiae points or any texture-based features
    exist in the fingerprint impression. The computed secure template through the
    discussed transformation is stored in the database, which can be considered as
    a protected fingerprint user template. Now, the fingerprint image reconstruction
    should be unachievable by means of the protected template for an adversary even
    though the protected template is leaked from the database. In addition, the constructed
    templates should hold the revocability and diversity properties that enable the
    possibility of replacing a leaked template with the new'
