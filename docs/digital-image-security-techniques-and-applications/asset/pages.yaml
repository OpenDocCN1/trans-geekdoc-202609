    # 2.9 QUANTUM KEY DISTRIBUTION


    A perfect secure key between two communicating parties is what QKD aims to achieve.
    The QKD process typically consists of three steps: privacy amplification, error
    reconciliation, and raw key filtering. Using universal hash functions to implement
    the privacy amplification process is a crucial component of QKD. These hash functions
    are secure in terms of computation because they are often built based on mathematical
    complexity. Numerous quantum cryptographic protocol are guaranteed to be unconditionally
    secure by the underlying principles of quantum mechanics, which prompts us to
    think about the security as in terms of quantum information'
