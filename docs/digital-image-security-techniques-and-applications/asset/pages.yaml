- pgno: 261
  md: 'two examples of copy-move forgery are given. Geometric transformations—such
    as translation, scaling, and rotation—allow moving the copied region somewhere
    else in the image. Some copy-move forgeries are easy to catch at first sight due
    to some artefacts that make them stand out from the image itself. Conversely,
    some more accurate copy fits the pasted region by not leaving any visible traces.


    Copy-move forgery detection (CMFD) algorithms analyze the image for duplicated
    regions, which can then be flagged as potentially tampered areas. These algorithms
    often use feature extraction and pattern-matching techniques to identify duplicated
    regions. They can also be used with other image forensics techniques, such as
    error level analysis or digital watermarking, to increase the accuracy of forgery
    detection [9, 10].


    CMFD methods aim to identify candidate duplicated regions in an image. This is
    typically done by analyzing the image at a pixel level and comparing the various
    regions.


    Several techniques are commonly used in copy-move forgery detection. One of the
    most common sees the image getting divided into smaller regions or segments, which
    are compared using pixel-level feature descriptors (such as statistical moments,
    texture descriptors, contrast, and color). These features are then used in the
    next step, pattern matching. This is done by comparing the features of one segment
    to those of all the other segments in the image to identify any duplicated regions.


    Even though image forensics is an active area of research, with new techniques
    and methods being developed to detect image forgery, no single technique or method
    can guarantee 100% detection of all forms of image forgery.


    The main contribution of this chapter is to survey several CMFD methods spanning
    low-level image processing techniques through the most recent deep learning approaches.
    Since the topic is not new to the scientific literature, the chapter has been
    edited by bringing in the historical progress of methods, approaches, image features
    analysis, and performance assessment over publicly accessible datasets. On top
    of that, further investigations have been pursued about deep learning being or
    not being the top-scoring CMFD approach. The remainder of the chapter is organized
    as follows: Section 12.2 describes related techniques, which are grouped into
    three main categories (image processing, machine learning, and deep learning);
    Section 12.3 introduces some publicly available datasets for CMFD methods; Section
    12.4 discusses the accuracy rates achieved by the SOTA (state-of-the-art) methods;
    Section 12.5 draws a line accounting for conclusions and future challenges in
    the topic.


    # 12.2 RELATED TECHNIQUES


    This section surveys the SOTA methods in CMFD spanning low-level image processing
    techniques, machine learning, and the most recent deep learning approaches.'
