  md: '# Table 11.1 Comparison of image quality assessment approaches


    | Approach | Used methodology to predict Image quality |

    |---|---|

    | Subjective Assessment | Visual Inspection |

    | Single Stimulus | Image is displayed to the observer for a short and fixed time
    |

    | Multi Stimulus | Reference image and test images are displayed to the observer
    randomly |

    | Objective Assessment | Mathematical calculation |

    | Full Reference image quality assessment (FR-IQA) | Undistorted image is compared
    with distorted image |

    | Reduced Reference image quality assessment (RR-IQA) | Part of undistorted image
    is compared with distorted image |

    | No Reference image quality assessment (NR-IQA) | Unnatural image feature extraction
    from distorted image |

    | Opinion aware NR-IQA | Model is trained by a database that is based on subjective
    opinion score of human-rated distorted images |

    | Opinion unaware NR-IQA | Model is not trained by a database that is based on
    subjective opinion score of human-rated distorted images |


    Bayesian inference model. Mittal et al. [15] proposed a NR-IQA method based on
    statistical features, luminance coefficients of the image in statistical domain.
    Generalized Gaussian Distribution (GGD) was used to model the image features.
    This method was further extended by Chow et al. [16] to evaluate features of structural
    Magnetic Resonance Imaging (MRI) images. The MRI image feature was calculated
    from the image luminance coefficient and Difference Mean Opinion Score (DMOS).


    A dual Convolutional Neural Network (CNN) structure-based NR-IQA technique was
    proposed by Li et al. [17]. Their method was based on calculating the quality
    parameter based on gray and color features of the image in Human Visual System
    (HVS) space. The quality assessment parameter was further used for de-noising
    the algorithm for image authorization and security. A blind image quality assessment
    method was proposed by Moorthy et al. [18] to judge the quality of natural scene
    by extracting the features of sub-band wavelet coefficients. Gaussian Scale Mixture
    (GSM) was used to model the wavelet coefficients and find the dependency between
    the wavelet coefficient and the neighbors. The rest of the state-of-the-art methods
    are discussed in Table 11.2.


    The challenging task in the discussed state-of-the art NR-IQA methods is the estimation
    of image quality without any ground truth data. So, it is highly required that
