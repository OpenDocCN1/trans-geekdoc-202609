    # 7.2.1.2 Characteristic features


    This section of the chapter presents characteristic features leading to popularize
    the edge computing ecosystem for multimedia data processing and management. Following
    are some of the major key characteristics among others of edge infrastructure.


    +   1. **Proximity toward end users:** The fundamental goal of edge technologies
    is to expand cloud services closer to the end users and provide computing and
    storage facilities close to their devices to support real-time services and quick
    responses [11].

    +   2. **Minimal latency:** In an edge computing ecosystem, computation typically
    takes place close to the data source, saving a significant amount of time during
    data transfer. Such a network is useful to process huge volumes of multimedia
    data with very less latency. Responses from edge servers to end devices are almost
    instantaneous [15].'
