    # 6.3 PROPOSED WATERMARKING TECHNIQUE


    Watermark embedding and extraction techniques are presented in this section. Initially,
    HT decomposes a cover image into reflectance and illumination components. Further
    multiresolution analysis is attained by decomposing the reflectance component
    using RDWT. Low high (LH) subband is chosen to maintain an adequate balance between
    robustness and perceptual invisibility. MSVD is applied to this LH subband to
    attain better imperceptibility. Similarly, RDWT-MSVD transforms are applied over
    the watermark image. The selection of the optimal scaling factor yields the watermarked
    image. Embedding and extraction watermark procedures are depicted in Figure 6.1(a,
    b).


    ![](img/6e4271af21d9a195003ab8711aa79d27_131_0.png)


