    # 13.3.7 Twofish


    Twofish employs a Feistel-like structure with 16 iterations and additional input
    and output whitening. Only 1-bit rotations can violate the Feistel equations.
    Moving the rotations within F generates Feistel structures without rotations.
    Before whitening the result, the text must be rotated once more.


    Plaintext consists of four 32-bit words. Four keywords are used for input whitening.
    Then there are 16 rounds. The two leftmost words are used by the g functions in
    each cycle. (The first bit is 8-bit rotated.) The right-hand sentences have two
    consequences. To create the ciphertext, the four words are XORed with four new
    key words by inverting the previous round''s swap.


    Using the little-endian byte order, four words of 32 bits each are generated from
    the 16 bytes of plaintext ($p_0, p_1, ..., p_{15}$).


    $P_i = \sum_{j=0}^{3} p(4i + j)^{2^{8i}} \quad i = 0, ..., 3 \quad (13.1)$


    The input whitening process will replace these words with four essential terms
    that are significantly larger.


    $R_{0,i} = P_i \oplus K_i \quad i = 0, ... 3 \quad (13.2)$


    The first two words and the rounded integer are passed to the function F as parameters.
    This technique is repeated with each iteration. The character XORed has been added
    to the third word in place of the letter F, and it has also been slightly shifted
    to the right. The fourth word is XORed with the second word that is generated
    by F after being rotated left one bit. Both halves are switched around.


    $(F_{r,0}, F_{r,1}) = F(R_{r,0}, R_{1,r}) \quad (13.3)$


    $R_{r+1,0} = ROR(R_{r,2} \oplus F_{r,0}, 1) \quad (13.4)$


    $R_{r+1,1} = ROL(R_{r,3},1) \oplus F_{r,1} \quad (13.5)$'
