    contributions of this chapter are listed below.


    +   - A detailed discussion on the working of cancelable biometrics along with
    its subcategories is presented in this chapter. In spite of considering various
    categories of fingerprint template protection approaches, this chapter mainly
    focuses on the discussion of approaches based on one of the prominent categories,
