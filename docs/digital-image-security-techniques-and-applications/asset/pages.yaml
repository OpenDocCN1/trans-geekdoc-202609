- pgno: 94
  md: 'important to keep in mind the specifics of the application used for identification.
    Since a sensor for capturing voice (microphone) is already built into the phone,
    voice biometric is a good choice for authentication applications involving mobile
    phones.


    A practical biometric system must also address a number of other issues, though
    (i.e., a system that uses biometrics for personal recognition), such as:


    +   - The effectiveness of biometric systems banks on multiple aspects, such as
    the precision and speed with which recognition can be done, the resources available
    to accomplish this, and the operational and environmental factors that influence
    these metrics.

    +   - The degree to which individuals are willing to make use of a particular
    biometric characteristic (identifier) in their day-to-day activities is a measurement
    of the acceptability of the biometric system.

    +   - Circumvention is a term used to describe how quickly a system may be made
    to function improperly.


    A viable 3D biometric system should be able to recognize individuals with the
    required precision, speed, and resource efficiency; it should also be safe for
    users, well-liked by the target audience, and resistant to various fraud schemes
    and systemic attacks. Figure 4.1 represents the process flow of a 3D biometric
    system.


    ![](img/6e4271af21d9a195003ab8711aa79d27_94_0.png)


