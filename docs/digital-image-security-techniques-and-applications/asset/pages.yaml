  md: '# 10.5 POTENTIAL CHALLENGES


    Some efficient BC-based digital watermarking techniques are already proposed for
    providing security to various domains. However, some challenges remain that limit
    the practical implementation of these models. Throughout this chapter, we have
    found numerous associated challenges and discussed further research direction
    in this area.


    +   - The computational overhead and the storage demand of the BC model should
    be reduced using appropriate homomorphic encryption techniques.

    +   - Most of the watermarking schemes did not maintain a balance between robustness,
    visual quality, and payload. The three properties of the watermark system contradict
    each other. Should one value increase, then another value must decrease simultaneously.
    Hence, an appropriate balance should be maintained between imperceptibility, embedding
    capacity, and robustness when embedding digital marks on the sender’s side.

    +   - Most authors did not focus on the security and complexity performance of
    the watermark system. The computational cost of the watermark system will increase
    to enhance its security. So, it is not suitable for a real-time-based application.

    +   - The watermarking system must resist all attacks to evaluate its security
    and robustness.

    +   - In permission-less BC frameworks, confidential information can be easily
    accessible in the open channel to different participants. However, the privacy
    of confidential information can be easily compromised.

    +   - Various high programming languages can be applied to generate a smart contract.
    However, generating a programming language that can easily understand a human
    is not easy.

    +   - A user’s identity can be easily compromised in the public BC system.

    +   - Appropriate compression techniques should also be used on the watermarked
    contents before uploading to the BC, as the size of the blocks is predefined.

    +   - The consensus algorithms should be chosen based on the application, as it
    may increase computational expenses.

    +   - A suitable external distributed storage provider (e.g., IPFS) can reduce
    the BC server’s storage pressure.

    +   - For resource-limited applications, using digital signature and encryption
    techniques will not be feasible, as it demands high computational power.

    +   - Adding watermarking and encryption techniques on the BC may increase time
    complexity, as these techniques are time-consuming and complex.'
  merge: -1
