    De-noising convolutional neural network (DnCNN)-based watermarking technique is
    developed in [20] where lifting wavelet transform (LWT), along with Hessenberg
    decomposition and redundant singular value decomposition (RSVD), is employed for
    embedding the watermark. DnCNN is applied to strengthen robustness against attacks,
    whereas encryption succeeded by compression is also done on the watermarked image
    to achieve better results. However, robustness against geometric attacks is not
    reported. Curvelet transform, along with RDWT, is used in [21] to embed the watermark.
    In this methodology the scrambled watermark is embedded along with Pseudo Noise
    (PN) sequences in subbands of the host image. Robustness against filtering and
    scaling attacks is the main shortcoming of the developed method.


    Error correction codes (ECC) and DWT are used for watermark embedding [22]. Dual
    embedding of the watermark is performed to protect sensitive medical information,
    while a comparative analysis among various ECC is also conducted. Embedding of
    the watermark using Walsh Hadamard transform (WHT) is investigated in [23]. In
    this approach, WHT is applied over a segmented block cover image, while shuffling
    of bit information is done to achieve security. However, robustness is weak against
    median filter attack.


    The concept of deep learning is utilized in [24], where robustness is significantly
    improved. The concatenation principle is used for the embedding process, while
