  md: '# 9.5 CYBER THREAT INTELLIGENCE SUB-DOMAINS


    CTI is basically defined as any evidence-based knowledge about threats that may
    occur with the aim of resisting it or even shrinking the gap between identification
    and compromise. It actually assists to illuminate the risk landscape rather than
    taking any explicit decision. It is rigorous actionable information with the extreme
    potentiality for taking prompt response to gain some valuable outcome from business
    organizations [23–25]. It embraces threat indicators, context methods, suggestion,
    and actionable opinion about a preexisting or emerging threat as shown in Figure
    9.4.


    +   - Strategic Threat Intelligence: The purpose of this risk identification is
    to assist strategists to comprehend current risks and recognize additional risks
    about which they are not yet informed. It may have a financial impact on cyber
    activity or attack trends, historical data, or predictions regarding the threat’s
    activity. Consequently, important information is regarded as the possible target
    for attacks. Strategic TI is usually in the form of reports, briefings, or conversations.

    +   - Operational Threat Intelligence: This is information about detailed imminent
    attacks against the organization primarily consumed by high-level security employees,
    officials, or top personnel of an incident response team. Such intelligence is
    very rare. Sometimes it is mainly found in open source intelligence or sources
    with access to secure chat forums [26].

    +   - Tactical Threat Intelligence: It is frequently referred to as Techniques,
    Tactics, and Procedures by the way at which threat actors accomplish attacks.
    Incident responders require this information to guarantee that their defenses
    and investigation are meant for current tactics.

    +   - Technical Threat Intelligence (TTI): It provides the information that is
    generally consumed through technical resources. It typically refers to the investigative
    or monitoring functions of an organization such as mail filtering devices and
    provides some analytic tools for visualization of the logs [27, 28].


