    ROR and ROL rotate their first parameter, which is a 32-bit word, by their second
    argument when r equals 0, 1, ... 15, respectively. The “swap” that was performed
    in the previous round is undone by output whitening, and the expanded key is used
    to XOR the data words.


    ```

    C_i = R_{16,(i+2) mod 4} ⊕ K_{i+4} i = 0, ... 3 (13.8)

