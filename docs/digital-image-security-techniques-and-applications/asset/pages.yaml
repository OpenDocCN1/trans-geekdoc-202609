    The measurement can be either in the qubits state |0⟩ or |1⟩ or in any other orthogonal
    state. Such an orthogonal set of states is called basis. If the basis states are
    |0⟩ and |1⟩, then it is called computation basis or z-basis.


    Another alternative set of orthogonal state is |+⟩ = 1/√2 |0⟩ + 1/√2 |1⟩ and |−⟩
    = 1/√2 |0⟩ − 1/√2 |1⟩. It is called as the x-basis.


    # 3.3.4.4 Single qubit gates


    Now, in order to let the qubit perform certain computation, we must have the methods
    to transform them. There, transformation methods are called “gates” [25].


    Due to the Born rule, the state vector |ψ⟩ always remains on the surface of the
    Bloch sphere as ||ψ|| = 1; however, the statevector is free to rotate on the sphere.
    The single qubit gates are nothing but rotations of the statevector on the Bloch
    sphere. Standard single qubit gates are following:


    +   1. X-gate: Rotates |ψ⟩ to |1⟩ and vice versa. It is rotation by π around the
    x-axis.

    +   2. Y-gate and Z-gate: perform rotations by π radians around y and z-axis of
    the Bloch sphere, respectively.

    +   3. H-gate: This makes a rotation around the line between the x and z-axis.

    +      If applied to |0⟩, generates equal superposition, i.e., 1/√2 |0⟩ + 1/√2
    |1⟩ state.

    +      If applied to |1⟩, generates equal superposition, i.e., 1/√2 |0⟩ − 1/√2
    |1⟩ state.'
