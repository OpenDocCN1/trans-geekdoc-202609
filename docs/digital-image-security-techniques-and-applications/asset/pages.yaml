    a comparison between SOTA approaches is carried out by looking into F1-score and
    two publicly available datasets, such as MICC and CMFD (as in Figures 12.4 and
    12.5). As can be noticed in Section 12.4, discussions and considerations have
    been drawn on the employment of diverse approaches consisting of different pipelines.
    For instance, low-level image feature methods can perform well, especially if
    they rely on robust descriptors such as SIFT and SURF (Figure 12.5) and when tampering
