    In this chapter Section 8.2 is an overview of deepfake detection techniques in
    existing literature, and Section 8.3 covers explainability, its importance, types,
    and methods. Section 8.4 is about methodology, which includes a proposed framework
    in which data-preprocessing, deep learning models and LIME model use is explained.
    Section 8.5 is about metrics and an experimental setup used is mentioned as software
    and hardware specifications. Section 8.6 shows results in forms of graphs and
    table. Section 8.7 concludes the chapter.


    # 8.2 LITERATURE SURVEY


    As stated above, a way to categorize deepfake detection techniques is on the basis
    of the type of media. Most of the methods discussed below are for visual deepfakes.
    But similarly, Explainable Artificial Intelligence (XAI) methods can be applied
    to audio deepfakes such as [9] which is about post-hoc XAI methods for deepfake
    audio detection by analyzing the attribution score patterns. Techniques similar
    to visual explanations were used for audio-related tasks. In [5] authors show
    inter-frame dissimilarities in form of optical flow fields to detect deepfakes.
    Authors in [10] presented a framework that is helpful for deepfake detection not
    just based on one frame but also temporal information among frames. The work in
    [11] is about both audio and visual deepfakes. Such detection approaches are called
    multi-modal approaches.


    Sometimes deepfake detection is approached in sense of media forensics. Just like
    in media forensics, source identification is of concern; similarly, in the sense
    of deepfakes, it is about the model used to generate deepfakes. This type of approach
    has been followed in [12] where the objective was finding the model used to generate
    deepfakes by seeing fingerprints of the models.'
