    # 7.3.1 Why edge processing for multimedia data?


    The concept of cloud computing has evolved to address management, control, coordination,
    storage, computing, and processing limitations of the Internet of Things, but,
    due to the following issues, cloud computing does not effectively support massive
    multimedia data storage in remote IoT and other systems [12].


    +   - The cloud environment cannot meet the real-time responsiveness of data processing,
    as it is located at a greater distance from the sensory devices placed locally.
    Therefore, processing enormous multimedia and other streaming data through cloud
    computing inevitably causes service delays.

    +   - The cloud system lacks in precisely identifying location and mobility requirements
    of mobile sensor applications, again due to being far from local sensory devices.

    +   - As there has been exponential growth in multimedia data that users access,
    secure transmission is also a significant and unimaginable hurdle for cloud services.

    +   - Due to the lack of processing a huge volume of multimedia data in real time,
    presenting satisfying QoS to the end user is another constraint of the cloud environment.

    +   - Cloud data centers are most frequently employed to process IoT data, and
    many IoT applications, such as demand prediction for smart power grids and voice
    response in Apple Siri, are latency sensitive. Carvalho et al. (2019) identified
    a significant issue with cloud architecture that is basically round trip latency
    time (RTT) ranging from edge to cloud is O(100) msec. In light of this, hosting
    analytics and decision-making in the cloud can result in degradation of execution
    [20].


    The above discussion supports that edge processing is an aspect that can either
    supplement or completely replace cloud computing [20].


