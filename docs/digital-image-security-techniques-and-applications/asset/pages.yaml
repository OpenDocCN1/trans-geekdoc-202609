- pgno: 244
  md: 'one resolution can be determined in another resolution. The image features
    are extracted in wavelet domain by statistically modeling the coefficients. This
    chapter designed a NR-IQA method for medical images considering the various distortions
    in the image. The proposed method is based on statistical modeling of wavelet
    transform coefficients and extract features from the sub-band coefficients. Medical
    Image quality score is predicted using a Support Vector Machine Regression (SVR)
    method. The main contribution of the chapter is explained below:


    +   1. A series of statistical feature vectors are extracted from medical image
    that is suitable for medical image security and authentication applications.

    +   2. Wavelet coefficient features are evaluated and analyzed to estimate quality
    of medical image.

    +   3. Noise features are combined with spatial image features that effectively
    estimate medical image quality for further process.


    The remainder of this chapter is organized as mentioned follow. Section 11.2 discusses
    the proposed methodology for extracting feature vectors from medical images. The
    classification and regression procedure is also discussed in this section. Section
    11.3 discusses the performance result of proposed method in NIH database. Finally,
    Section 11.4 concludes the chapter.


    # 11.2 PROPOSED METHODOLOGY


    This section discusses the proposed methodology to extract the medical image distortions
    in wavelet domain. The detailed network structure of the proposed methodology
    is explained in Figure 11.2 shown below. The input


    ![](img/6e4271af21d9a195003ab8711aa79d27_244_0.png)


    Figure 11.2 Proposed NR-IQA block diagram.'
  merge: -1
  img_proc: true
- pgno: 245
  md: '# Table 11.3 List of features used to find IQA


    | Feature | Description | Computational process |

    |---|---|---|

    | F₁ − F₉ | Variance of wavelet distribution in LL, HL, and LH sub-bands in all
    scales | Modeling wavelet sub-bands using NIG PDF |

    | F₁₀ − F₁₈ | Location parameter of wavelet distribution in LL, HL, and LH sub-bands
    in all scales | Modeling wavelet sub-bands using NIG PDF |

    | F₁₉ − F₂₁ | Noise variance in diagonal sub-band | Modeling diagonal sub-bands
    using Gaussian PDF |

    | F₂₂ − F₅₁ | Spatial correlation across sub-bands | Fitting a 3rd order polynomial
    function to the correlation function |

    | F₅₂ − F₆₉ | NSS feature in the Wavelet Domain | Calculating magnitude, variance,
    and entropy |


    distorted medical image is first converted from spatial domain into wavelet domain
    by applying wavelet decomposition technique. Next, a series of statistical features
    are extracted by utilizing the obtained wavelet coefficients in each sub-band.
    Further feature vectors are formed by arranging the calculated statistical features.
    Next, a regression model is designed using the SVM regression method. The regression
    model maps each feature into a quality measure index. Finally, the quality indexes
    resulting from distortion feature vectors are combined to produce a final image
    quality index. The feature vectors are shown in Table 11.3.


    The steps of the proposed methodology are discussed below:


    # Steps:


    +   1. Input distorted medical image I (j,k).

    +   2. Decomposition of medical image by 3 scale wavelet transforms results W(j,
    k).

    +   3. Extraction of features F₁ to F₁₈ considering signal variances and location
    parameters in wavelet domain by modeling W(j, k) using NIG PDF in LL, HL, and
    LH sub-bands.

    +   4. Extraction of features F₁₉ to F₂₁ considering the noise variance in HH
    sub-bands, by modeling W(j, k) using Gaussian PDF.

    +   5. Extraction of features F₂₂ to F₅₁ considering spatial correlation and features
    F₅₂ to F₆₉ considering NSS features in wavelet domain.

    +   6. Application of Support Vector Machine regression to find the final quality
    index.


    # 11.2.1 Two-dimensional wavelet decomposition


    Wavelet decomposition of digital image results in four sub-bands, Approximation
    sub-band (LL), Horizontal sub-band (HL), Vertical Sub-band (LH), and Diagonal
    sub-band (HH) [35], as shown in Figure 11.3 below.'
  merge: -1
  img_proc: true
- pgno: 246
  md: '![](img/6e4271af21d9a195003ab8711aa79d27_246_0.png)


    Figure 11.3 Three scale decomposition of medical image.


    Distribution of wavelet coefficients is utilized to extract features in medical
    image. Empirical distribution of wavelet coefficients in LL, HL, and LH sub-bands
    are heavy tailed in structure. This chapter implements the 3 scale decomposition.
    The wavelet transform is applied in 3 scales, which results 12 sub-bands. The
    distribution of wavelet coefficients for the original medical image is shown in
    Figure 11.4. It can be seen from the figure that a heavy-tailed structure in LL,
    HL, and LH sub-band coefficients and a Gaussian structure in HH sub-band coefficients.
    The wavelet decomposition process for two dimensional of level L can be defined
    as follows:


    $$W(j,k)=\frac{1}{\sqrt{JK}}\left[\sum_{a=1}^{J}\sum_{b=1}^{K}f_L^A(a,b)\times\Phi_L^A(j,k,a,b)
    + \sum_{l=1}^{L}\sum_{M\in H,V,D}\sum_{a=1}^{J}\sum_{b=1}^{M}f_L^M\times(a,b)\Psi_L^M(j,k,a,b)\right]\tag{11.1}$$


    The size of the image I (j,k) is J × K. The approximation coefficients, diagonal
    detail coefficients, vertical detail coefficients, and horizontal detail coefficients
    are denoted by f_L^A, f_L^{M≡D}, f_L^{M≡V}, f_L^{M≡H}, respectively. The scaling
    and wavelet coefficients are denoted by Φ and Ψ and defined as:


    $$\Phi_L^A(j,k,a,b)=2^{L/2}\phi(2^L j - a)\phi(2^L k - b)\tag{11.2}$$'
  merge: -1
  img_proc: true
- pgno: 247
  md: '![](img/6e4271af21d9a195003ab8711aa79d27_247_0.png)


    Figure 11.4 Distribution of wavelet coefficients in sub-bands.


    Ψ_L^H(j,k,a,b) = 2^{1/2} ψ(2^l j - a) φ(2^L k - b)  (11.3)


    Ψ_L^V(j,k,a,b) = 2^{1/2} φ(2^l j - a) ψ(2^L k - b)  (11.4)


    Ψ_L^D(j,k,a,b) = 2^{1/2} ψ(2^l j - a) ψ(2^L k - b)  (11.5)


    # 11.2.2 Wavelet coefficient modeling and feature extraction


    In this chapter, Horizontal and Vertical Sub-bands (LL HL LH) in each scale are
    modeled using a Normal Inverse Gaussian (NIG) Probability Density Function (PDF).
    The diagonal sub-bands (HH) in each scale are modeled using Gaussian PDF, as this
    sub-band consists of all the noisy coefficients. It can find a heavy-tailed distribution
    of the wavelet coefficients, and the noise added to the medical image changes
    the shape of the distribution of wavelet coefficients. The extent of noise added
    can be found from the tail behavior of the distribution. NIG PDF fits the heavy-tailed
    wavelet distribution data'
  merge: -1
  img_proc: true
- pgno: 248
  md: 'and thus analytically tractable [36]. NIG PDF has been implemented in the modeling
    of the sub-band wavelet coefficients and results in effective feature extraction.
    The density function of NIG PDF is defined as:


    $$P(C)=\left(\alpha\delta e^{\alpha\delta}k_i\left(\alpha\sqrt{\delta^2+C^2}\right)\right)/\left(\pi\sqrt{\delta^2+C^2}\right)$$
    (11.6)


    Where C denotes the random variable, k denotes modified Bessel function with j(index)=1.
    Tail heaviness of the distribution is defined by α and can control the steepness
    of the distribution. The scale parameter is denoted by δ. The shape of the distribution
    is controlled by α and δ. α → ∞ and δ → ∞ yields Gaussian distribution, and α
    → 0 yields Cauchy distribution [37]. Distribution parameters are estimated by
    fitting NIG PDF in all sub-bands (LL, LH, HL). Next, the variance information
    σ̂_c² of the sub-bands is calculated using the following equation:


    $$\hat{\sigma}_c^2 = \int_{-\infty}^{+\infty} C^2 P(C) dc - \left(\int_{-\infty}^{+\infty}
    c P(C) dc\right)^2$$ (11.7)


    A total of 18 features F₁ – F₉ are calculated corresponds to variance values,
    and F₁₀ – F₁₈ corresponds to α values across the sub-bands.


    # 11.2.3 Noise variance in diagonal sub-band


    Diagonal sub-band in wavelet decomposition contains all the noisy data and gives
    important information regarding the noise present in the medical image. This concept
    motivates to extract image features F₁₉ – F₂₁ corresponds to noise variance in
    HH sub-band in all scales. Orthogonal property of wavelet decomposition says that
    sub-band diagonal coefficient fits well by zero mean Gaussian PDF. By fitting
    the empirical wavelet distribution using Gaussian PDF, median is calculated from
    the distribution parameter, and next, a median estimator is applied to find the
    noise variance of the medical image. Noise variance (σ̂_n²), calculated using
    a median estimator, is given by [38]:


    $$\hat{\sigma}_n^2 = \left(\frac{\text{Median}(HH)}{0.6745}\right)^2$$ (11.8)


    # 11.2.4 Spatial correlation feature extractor


    Medical images modify their structure in the presence of distortion. The smoothness
    of the image varies over the distance. The correlation between spatial structures
    of the sub-bands can be utilized to evaluate the quality'
  merge: -1
  img_proc: true
- pgno: 249
  md: 'factor. The following steps are implemented to find the correlation between
    the spatial structures.


    **Step 1:** Calculation of joint empirical distribution $f_{x,y}(X,Y)$ between
    the coefficients at $(l,k)$ and $N_8(l,k)$.

    $N_8(i,j)$ is the distance $d \in \{1,2,......25\}$


    **Step 2:** Calculation of correlation between the variables $X$, $Y$ using the
    following equation (11.9).


    $\rho_d = \frac{E_{xy}(X,Y)[X - E_x(X)]^T (Y - E_y(Y))}{\sigma_X \sigma_Y}$  (11.9)


    Where $E$ is the expectation operator and $\sigma_X$, $\sigma_Y$ are the variances
    of X and Y vector, respectively.


    **Step 3:** Parameterize the correlation $\rho_d$ by fitting a $3^{rd}$ order
    polynomial and calculation of coefficient of the polynomial.


    Finally, the empirical value of correlation coefficient, fit error, and coefficient
    of the polynomial form the features $F_{22} - F_{51}$.


    # 11.2.5 NSS feature extraction in the wavelet domain


    Wavelet transform includes properties like multiresolution, locality, Gaussianity,
    and persistency. Self-similarity property of the scene is one of the most important
    properties of wavelet transform. The NSS feature in the wavelet domain changes
    irregularly with artifacts [24]. Magnitude of the wavelet coefficients exponentially
    decay across scale. This feature is utilized in this chapter for implementing
    quality detection. NSS feature is extracted from the image in wavelet domain.
    Sparse representation is implemented in this chapter to extract NSS features.
    Magnitude, variance, and entropy are calculated for the horizontal and vertical
    sub-bands for each scale as shown below:


    $magnitude_s = \frac{1}{N_s \times M_s} \sum_{k=1}^{N_s} \sum_{l=1}^{M_s} \log_2
    |C_s(l,k)|$  (11.10)


    $variance_s = \frac{1}{N_s \times M_s} \sum_{k=1}^{N_s} \sum_{l=1}^{M_s} \log_2
    |C_s(l,k) - magnitude_s|$  (11.11)


    $entropy_s = \sum_{j=1}^{N_s} \sum_{i=1}^{M_s} P(C_s(i,j)) \ln P(C_s(i,j))$  (11.12)'
  merge: -1
  img_proc: true
- pgno: 250
  md: 'Where $N_s$ and $M_s$ are length and width of $s^{th}$ sub-band, $C_s(k, l)$
    is the $(k, l)$ coefficients of the $s^{th}$ sub-band, and $P(.)$ = Probability
    density function of the sub-band.


    These features are averaged in the same sub-band and in the same scale and combined
    into a vector. For six sub-bands in three scales, the vector is defined as below.


    $$f = \begin{bmatrix} m_{LH1}, m_{HL1}, m_{LH2}, m_{HL2}, m_{LH3}, m_{HL3}, \\
    \vartheta_{LH1}, \vartheta_{HL1}, \vartheta_{LH2}, \vartheta_{HL2}, \vartheta_{LH3},
    \vartheta_{HL3}, \\ e_{LH1}, e_{HL1}, e_{LH2}, e_{HL2}, e_{LH3}, e_{HL3} \end{bmatrix}^T$$
    (11.13)


    Where $m_{xy}$ is the magnitude of x sub-band at scale y, $\vartheta_{xy}$ is
    the variance of x sub-band at scale y, and $e_{xy}$ is the entropy of x sub-band
    at scale y. A total of 18 features $F_{52} - F_{69}$ are calculated that correspond
    to magnitude, variance, and entropy values in sub-bands.


    # 11.2.6 SVM regression and parameter selection


    In our work, a standard regression is considered that works under general setting
    for predictive learning [39]. These method estimates a real value function as:


    $$y = r(f) + \delta$$ (11.14)


    Where $\delta$ is the hyper parameter and $f$ is a multi-valued input and $y$
    is the scalar output. Parameter selection is based on the finite number of features
    $f$ and $y$ values.


    Let the features and their corresponding selection parameters are distributed
    jointly and defined by PDF as $P_{f,y}(F, Y)$. It can be written as:


    $$P_{f,y}(F, Y) = P_f(F) P_{f,y}(Y | F)$$ (11.15)


    From equation (11.14) and (11.15) we can write the regression function as:


    $$r(f) = \int y P_{f,y}(Y | F) dy$$ (11.16)


    The prime aim of the estimation procedure is to find the best model $f(f, \omega_0)$
    from a sequence of models $f(f, \omega)$ for $\omega$. The best model can be created
    by minimizing prediction risk as:


    $$R(\omega) = \int \big(L(y, f(f, \omega))\big) P(f, y) df dy$$ (11.17)'
  merge: -1
  img_proc: true
- pgno: 251
  md: 'Where $L(y,f(f,\omega))=(y-f(f,\omega))^2$ defines the loss function (11.18)


    Applying equation (11.18) in equation (11.17) results:


    $R(\omega)=\int (y-f(f,\omega))^2 P(f,y) df dy$ (11.19)


    In SVM regression method, a mapping scheme is used to map the input features to
    a multidimensional feature space. Next, a linear model in the feature space is
    created and can be written as:


    $f(f,\omega)=\sum_{i=1}^{n}\omega_i g_i(f)+b$ (11.20)


    Where $b$ is the bias term, $g_i$ is the non-linear transform function, and $n$
    are the training samples. SVM regression is a linear regression in the high dimensional
    feature space consider the insensitive loss $\varepsilon$, and also reduces the
    complexity of the model $||\omega||^2$. The modified loss function can be written
    as:


    $L_{\varepsilon}(y,f(f,\omega))=\begin{cases}0,\text{if }y-f(f,\omega)\le\varepsilon\\|y-f(f,\omega)|-\varepsilon\text{
    otherwise}\end{cases}$ (11.21)


    The Risk function considering the insensitive loss is given by:


    $R_{\varepsilon}(\omega)=\frac{1}{n}\sum_{i=1}^{n}L_{\varepsilon}(y,f(f,\omega))$
    (11.22)


    Thus, SVM regression minimizes the function $\frac{1}{2}||\omega||^2 + c\sum_{i=1}^{n}\epsilon_i
    + \epsilon_i^*$


    With constraints $\begin{cases}y-f(f,\omega)-b\le\epsilon_i+\epsilon_i^*\\f(f,\omega)+b-y\le\epsilon_i+\epsilon_i^*\\\epsilon_i\epsilon_i^*\ge0\end{cases}$
    (11.23)


    Where $c$ is a positive constant, $\epsilon_i,\epsilon_i^*$ are the slack variables,
    and $n$ are the training samples.


