    # 9.1 INTRODUCTION


    The internet plays a vital role in global communications and has become firmly
    integrated into all aspects of human lives all around the world. The inexpensive
    but highly innovative nature of the internet has built a vast global network for
    communication and exponentially escalated its use and performance that has generated
    billions of dollars annually for the global economy [1]. Today, most of the commercial,
    economic, social, and cultural activities, and interactions among countries, including
    governmental, organizational, and institutional in any platform, are performed
    in cyberspace [2]—which fully controls and manages both vital and sensitive information
    exchange and financial transactions using the internet. While this landscape of
    enormous technological advancement in every domain of operations has helped organizations
    scale their business universally, it also left these organizations vulnerable
    to an emerging risk from cyberattacks through digital interfaces. Cyberattackers
    mostly target organizations’ sensitive information and system resources, not only
    for financial gain but also for achieving geopolitical reasons. According to the
    annual report of Threat Horizon [3], the world’s leading authority on cyber threats,
    information security and risk management reveals that cyberattackers constitute
    a huge likelihood for (i) Disruption – Over-reliance on fragile connectivity heightened
    risk that ransomware by hijacking Internet of things, (ii) Distortion – Compromise
    of automated sources causes trust and integrity issues of information, (iii) Deterioration
    – Negative impact of organizations’ ability to control their own information [3–5].


    The threat of cyberattacks brings with it the potential of an unpredictable impact
    due to the lack of a specific strategy to measure the extent of the'
