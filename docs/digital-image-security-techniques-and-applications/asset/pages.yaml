    # 15.3 CI AND DATA SECURITY


    The health care industry plays a crucial role in promoting people''s well-being,
    but unfortunately, it has become one of the most vulnerable sectors to malicious
    attacks. The impact of these attacks can be detrimental to patients'' lives and
    the overall functioning of the health care environment. To address the pressing
    issue of health care data security, researchers have developed various techniques,
    including watermarking, encryption, compression, and steganography [26–29]. While
    these techniques have been widely researched, few studies have specifically focused
    on securing health care data within the context of IoT networks. One notable work
    in this area is the development of a security microvisor middleware (SμV) for
    IoT devices by Daniels et al. [30]. This middleware utilizes software virtualization
    and low-overhead assembly code verification to enable customized security operations
    and memory isolation, while maintaining minimal impact on memory and battery life.
    Similarly, Manogaran et al. [31] proposed a secure industrial IoT-based Meta cloud
    redirection (MC-R) framework for collecting data from medical sensors embedded
    in patients'' bodies. These sensors collect clinical measurements such as heart
    rate, body temperature, respiratory rate, blood pressure, and blood sugar. If
    these measures exceed their normal value, the framework sends a warning message
    containing these clinical measures to doctors via a wireless sensor network. To
    ensure the secure transmission of large data, the researchers implemented a key
    management security mechanism.'
