    # 13.4 RESULT AND DISCUSSION


    # 13.4.1 Experimental setup


    To put the technology to the test, a human voice was recorded. To put our technique
    to the test, we’ll need numerous recordings of the same screenplay. This chapter
    compares the performance of the proposed scheme to existing schemes on key parameters.
    From the below table, it is clear that the Accuracy, Precision, and Recall values
    of the proposed scheme are high compared to existing methods LSTM, RSA, AES, DES,
    and Blowfish. The tests were carried out using a machine outfitted with a 2.20GHz
    Intel Core i5-5200U processor, 12GB of DRAM, and a 500GB SanDisk drive. There
    were 3,600 paragraphs written in Arabic, Chinese, and English. In English, Arabic,
    and Chinese, precision, recall, F-score, and search time were used. To compare
    with the proposed strategy, the techniques LSTM, RSA, AES, DES, and Blowfish were
