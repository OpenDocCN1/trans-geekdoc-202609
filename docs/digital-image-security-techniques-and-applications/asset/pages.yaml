- pgno: 95
  md: 'Because biometric recognition systems are by nature probabilistic, it is important
    to evaluate their performance in light of this fundamental quality. Within a certain
    tolerance of approximation, biometric recognition entails comparing a subject''s
    observable biometric features to previously gathered data. It is vital to use
    approximate matching because of the disparities in biological traits and behaviors
    that exist both within individuals and across groups of people. As a result, biometric
    systems provide probabilistic outputs rather than the largely binary outputs typical
    of traditional information technology systems. This chapter gives a short and
    constructive review of the different 3D biometric systems.


    # 4.2 3D FACE BIOMETRIC


    Face is the most common and popular 3D biometric category. It is sub divided into
    facial, ear, iris, and skull [10]. 3D face biometric systems have the highest
    penetration in the total 3D biometric system, as their working mechanism is simple
    with the least requirement of hardware and software.


    # 4.2.1 Facial biometric


    This is the most common 3D biometric method used by most 3D biometric systems.
    It solves the problems of 2D face biometrics, which have many issues identifying
    facial images in low light or not proper posture, and it also recognizes the target
    with different angles rather than capturing the straight-on appearance. It is
    helpful to indicate straight borders in 3D spacing, and 3D face images contain
    a handful of focal points that correspond to 2D facial images. The location of
    the surface of the three-dimensional face is determined by hidden aspects of the
    physical anatomy. It is concerned with the development of technologies that (a)
    recognize faces and (b) scan 3D facial models to verify individuals [36, 37].
    Many algorithms have been proposed for 3D facial biometric methods, which broadly
    splits into metric learning, geometric deep learning, biometric fusion, and face-to-DNA
    matching. Among them, deep learning-based algorithms have a high performance with
    low FAR and FRR [38].


    # 4.2.2 Ear biometric


    The development of the ear on a fetus begins between five weeks to seven weeks
    of pregnancy. In five weeks, a cluster of embryonic cells is connected to develop
    the ear. These develop cells in the lower part of the neck and are known as auricular
    hillocks. In the seventh week, the auricular hillocks widen and intertwine to
    form the shape of the ear. The hillocks move to the ear canal in the ninth week
    and become increasingly apparent as the ear develops [38]. After that, the ear
    will almost certainly develop'
  merge: -1
  img_proc: true
- pgno: 96
  md: 'in a linear fashion. Beginning at around four months of age and continuing
    until around eight years, the ear goes through a period of extended development.


    Up to the age of seventy, neither the size nor the form of an individual''s ear
    will change. Before the COVID-19 pandemic, the face-based biometric system was
    used, but because of extensive mask use, facial recognition has been unsuccessful.
    The fact that the human ear is visible makes it more suitable [39]. Ear biometric
    analysis has multiple advantages over other biometric methods such as face, iris,
    fingerprints, and palm prints. These advantages can be attributed to the fact
    that ear biometric analysis is easier to acquire, that facial expressions remain
    consistent over time, and that ear biometric analysis is more stable [10].


    Utilizing 3D data, studies have been done to identify ears in profile images.
    By Chen et al., one of the pioneering works is provided. The scientists used a
    modified iterative closest point (ICP) approach to extract step edges from the
    3D image and to detect the helix and antihelix of the ear. Their method is vulnerable
    to changes in scale and position, however. In order to identify ears from a 3D
    image, Zhou et al. suggested a technique called histograms of classified shapes
    (HCS), which integrated a 3D form model with an SVM classifier. However, when
    prior information about the given ear is not available, their method is unable
    to locate an ear. To identify ears from 3D images, Prakash et al. proposed an
    edge connection graph. As a result, they struggled on the UND J2 dataset and were
    unable to handle the impact of off-plane rotation. Pflug et al. introduced an
    approach based on a binarized mean curvature map for identifying edges in 3D profile
    photos [39].


    # 4.2.3 Iris biometric


    The 3D iris biometric has certain qualities due to a distinctive surface consisting
    of two muscle fibers of the human eye. Iris as a biometric has generally been
    the subject of extensive scientific study; however, this research is only two
    dimensional [17]. According to Bastia et al., this is the first attempt to model
    his 3D iris using near-infrared (NIR) images obtained from a Raspberry Pi v2.1
    camera. In addition, four NIR LEDs produced infrared light. Two white LEDs were
    utilized in tandem to generate a bright atmosphere around the pupil while maintaining
    a relatively tiny pupil. [40]. This is significant because the pupil is eliminated
    prior to the 3D reconstruction, and information about the eye''s depth perception
    is derived from the remainder of the eye.


    The Raspberry Pi 3 Model B system was used to operate the camera and temporarily
    save the photographs in system memory. The VR glass set had all the aforementioned
    components installed. Additionally, a proposed attachment for the camera gave
    it the ability to move in a 40-degree arc. A total of 17 iris images were intended
    to be captured by the device, with a'
  merge: -1
  img_proc: true
- pgno: 97
  md: '2.5-degree angle between each image. The Python photogrammetry toolbox was
    also utilized by the authors to construct the 3D model. The model was built from
    a variety of photos taken from various angles by the open-source toolkit. It is
    also stated that the lack of information on measurements and results made it challenging
    to assess the work’s outcomes and methodology [41].


    Benalcazta et al. decided to use visible light as the source of illumination,
    as opposed to the earlier strategy. They created a unique device that shines lateral
    and frontal visible light onto the iris (LFVL). Six LEDs in the front and two
    more on the sides of each eye provide the light. The varying degrees of incidence
    from the light source are what produce the shadows and information about the depth
    of the iris. By filming each eye for three seconds, 120 different people made
    up the dataset.


    According to the preceding research, facial recognition is the most common method
    for 3D biometric applications. To be utilized as a biometric, a 3D model must
    initially be made, which is trailed by highlight extraction [42]. Computer vision
    methods can be used to finish this. The method of reconstruction is determined
    by how the images are captured. It can be split into the two group active method
    and passive method as mentioned in Table 4.5. Further examination of the passive
    methods reveals three subcategories connected to facial recognition: stereo vision,
    SfS, and SfM. Seven applications made use of SfS, six applications made use of
    stereo vision, and five applications made use of SfM.


    Only one of the active methods made use of transmissive computerized tomography,
    whereas the rest of the active methods relied on reflecting light from a source.
    The percentages were almost the same: six applications used SfM, seven used SfS,
    and five used SfM. The reflective methods can also be further broken down into
    two subcategories: time-of-flight and structured light. These proportions were
    also similar, with four using time-of-flight and five using structured light [43].


    # 4.2.4 Skull biometric


    The skull biometric is the least-used biometric system, as it has high complexity
    in the capturing of a 3D image of a human skull. Its scope is very different than
    other biometric methods, as it usually involves a cadaver, which is very difficult
    to recognize by other human body features [10, 18].


    # 4.3 3D HAND BIOMETRIC


    The user’s hand shape and vascular pattern are measured as part of a proposed
    hand biometric authentication system. The lengths and angles of the finger valleys,
    the lengths and profiles of the fingers, the thickness of the side'
  merge: -1
  img_proc: true
- pgno: 98
  md: 'view of the hand, the K-curvature with a hand-shaped chain code, and the direction-based
    vascular-pattern extraction method were all employed to obtain the hand geometry
    [10].


    # 4.3.1 Fingerprint biometric


    One of the most distinctive biometrics is the fingerprint. For human authentication,
    fingerprints are frequently employed because of their great accuracy and uniqueness.
    Traditional fingerprint scans usually produce fragmentary or poor-quality images
    since they require placing and pressing the fingers against a hard surface, such
    as glass or silicon. Typically, skin deformations, wetness, finger dirt residue,
    finger sweat, finger slips and smear, or sensor noise are to blame for this frequent
    deterioration in fingerprint picture quality. In addition to dealing with the
    leftovers of prior fingerprint impressions, which might constitute a security
    risk, contactless fingerprint systems can offer hygienic solutions to these problems
    [44]. In order to address the shortcomings of the contact-based 2D fingerprint
    identification system and increase recognition accuracy, contactless 3D fingerprint
    reconstruction and recognition techniques have been developed in response to the
    rapid development of 3D scanning and reconstruction technologies. In recent years,
    an increasing number of 3D fingerprint identification technologies have been created.
    The most accurate techniques for contactless 3D fingerprint recognition have been
    found to be minutiae-based fingerprint matching techniques. However, viewpoint
    distortion and reconstruction error during 3D fingerprint capture can greatly
    impair the performance of contactless 3D fingerprint matching and the accuracy
    of minutiae extraction [45].


    # 4.3.2 Finger vein biometric


    Finger vein biometric offers many advantages with reference to other biometric
    methods, as the vein pattern in the finger reveals the vast network of blood vessels.
    It uses ultrasound or optical scanning to record the vein pattern of the finger
    under observation. The vein pattern within a human’s finger is unique and invisible
    from the outside; consequently, it is difficult to replicate [46]. Doppler ultrasound
    has been utilized to identify major blood vessels based on tissue blood flow.
    However, the system’s sensitivity to small vascular structures is inadequate.


    In contrast to pure optical modalities, photoacoustic tomography (PAT) can acquire
    highly detailed images of the vasculature with sufficient depth information. In
    PAT, a laser light pulse illuminates the skin’s surface, causing thermoelastic
    expansion that converts into ultrasonic waves. However, even if quite accurate
    patterns were obtained, the acquisition time was too long for both technologies.
    Veins are utilized in multimodal systems alongside other characteristics, particularly
    the fingerprint. This technique, also known'
  merge: -1
  img_proc: true
- pgno: 99
  md: 'as biometric fusion, enhances the performance of the biometric system in terms
    of recognition accuracy, universality, and security [47].


    # 4.3.3 Palm biometric


    The palm biometric system also uses ultrasound waves to capture the image of a
    human palm. Any effective palm biometric system acquires the 3D image of a human
    palm (dimension for the system should be 50 mm by 30 mm with 15 mm height) for
    5 seconds having the four 10 mW laser [48]. The 3D images are obtained by the
    single transducer performing the mechanical scan in two orthogonal directions.
    In this way, exact palm features (palm line’s depth and curve, as well as creases
    on the surface of the hand) are extracted from the recoded image, and further
    identification or verification process is done. Filters and statistical tools
    and neural network- based algorithms are used for the identification and verification
    of the human palm [49].


    # 4.4 3D GAIT BIOMETRIC


    An application of biometrics known as gait recognition determines a person’s identity
    based on their walking patterns. The fact that a person can be identified from
    a distance using gait as a biometric is its greatest advantage. To put it another
    way, gait can be used with low resolution. Human gait describes human motion’s
    temporal dynamics and spatial statics. Compared to other biometrics, it typically
    takes up significantly more pixels [50].


    Borelli pioneered the idea of step analysis. He provided a description of the
    various gait cycles and muscle movements when a person is walking. He was the
    first scientist to measure the center of gravity of the human body. He described
    when a person walks, how the body balances as the center of gravity moves forward
    outside the area of support. Step detection was first used in the fields of medicine
    and psychology [51]. The 3D method of human movement was introduced by Brown and
    Fisher. Images were generated using luminescent marks with built-in triangulation
    capabilities. Images are generated at a frequency of 26 frames per second. A 3D
    technique examines the angular displacement of the lower extremity joints [22,
    52].


    Yamauchi et al. captured the 3D data using an active vision sensor. Following
    that, he made an effort to include the 3D model into the data so that he could
    acquire information on kinematics. They collected subject poses with the use of
    a laser range sensor. These subject poses solely reflect the critical frames of
    a gait cycle. The standard of excellence of the 3D data is rather good in this
    particular situation. The complete gait sequence is generated by interpolating
    joint locations and motions using body models fitted to a computer. The results
    of the experiments indicate high recognition rates, despite the fact that there
    are currently only six participants [53].'
  merge: -1
  img_proc: true
- pgno: 100
  md: '![](img/6e4271af21d9a195003ab8711aa79d27_100_0.png)


    Figure 4.2 Represents a pie chart of a 3D biometric system with several different
    applications.


    Seely et al. developed the Soton 3D gait dataset, which was then used in a view-invariant
    gait identification experiment employing model-free analysis with great success.
    Simple approaches based on an average silhouette in two dimensions and viewpoint
    projection techniques were used to transform 3D data into 2D data that was unaffected
    by the viewer’s point of view. Three different viewpoint projections were utilized:
    side-on, front-on, and top-down. The results demonstrated that using 3D gait data
    can result in a high degree of accuracy (99.6%), with the best performance achieved
    by combining projected views [54].


    # 4.5 CONCLUSION


    In this chapter, we described the different type of biometrics with their applications.
    After performing an in-depth investigation into the many papers, preliminary statistical
    data indicated that face recognition was the 3D biometric employed most of the
    time in this specific study field. The remaining seven categories were: palm,
    iris, gait, skull, ear, finger vein, and finger. Face, hand, and gait are the
    three basic categories that can be used to group them. Future research should
    be organized according to a framework that includes measurements for the related
    2D photos for every new 3D biometric study. Devices should have 2D capabilities
    to achieve this. In order to facilitate future researchers’ experimentation, more
    datasets for uncommon biometric traits should be produced. These issues must be
    resolved to demonstrate the need for 3D technology, and they will form the foundation
    for future advancements.'
