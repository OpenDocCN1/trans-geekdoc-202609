    # 3.6.8.2 Methodology


    A prime of the form p = l_A^{e_A} · l_B^{e_B} · f ± 1 serves as the setup for
    SIDH, where l_A and l_B are small primes with e_A,e_B as large exponents, f is
    called a small cofactor with an elliptic curve E over field F_p^2.


    Two significant torsion subgroups exist in such a curve, denoted by E[l_A] and
    E[l_B], which are allocated to Alice and Bob, respectively, as hinted by the subscripts.
    The protocol begins with each party computing the relevant (secret) isogeny and
    choosing a (secret) random cyclic subgroup of their respective torsion subgroup.
    The equation for the target curve of their model is then published or otherwise
    made available to the other party.


    In addition to its superior security, SIDH also offers several advantages over
    classical cryptosystems such as better performance and efficiency due to its scalability
    and reduced storage requirements. Furthermore, while all traditional cryptographic
    protocols require some type of trusted third party to provide a secure channel
    for communication, SIDH does not rely on any such third party—instead it provides
    a completely decentralized solution that allows any two parties to communicate
    securely without requiring a centralized authority. Finally, since SIDH does not
    require any large precomputed tables or other complex data structures for its
    operation, it can be implemented easily on resource-constrained devices such as
    embedded systems or mobile phones [67].


    # 3.6.8.3 Image security perspective


    All these features make SIDH an attractive potential candidate for use in post-quantum
    cryptography applications; however, further research needs to be done before it
    can be adopted widely across different platforms and applications. As more cryptanalysts
    continue to study SIDH''s security properties and develop tools that further enhance
    its usefulness in real-world situations, we will hopefully see it become more
    commonplace in years to come. Its applicability for image-based data is subject
    to further research.


    # 3.6.9 Symmetric key quantum resistance


    # 3.6.9.1 Overview


    Symmetric key quantum resistance is a form of cryptography that protects against
    the potential threat posed by quantum computing to existing encryption algorithms.
    This type of encryption is important for organizations and'
  merge: -1
  img_proc: true
- pgno: 82
  md: 'individuals who want to protect their information from attack by malicious
    actors using quantum computers.


    Unlike traditional encryption algorithms, symmetric key quantum-resistant cryptography
    uses a particularly secure algorithm known as a Hash-Based Message Authentication
    Code (HMAC) to ensure the integrity of encrypted data. HMACs use two different
    keys: one used to encrypt data and the other to decrypt it. These keys are never
    stored on the same machine or transmitted together; this ensures that if one key
    is compromised, the other will remain safe. Additionally, a HMAC can be configured
    so that even if an attacker knows both keys, they still won’t be able to access
    the encrypted data [68].


    In addition to providing protection from attacks via quantum computing, symmetric
    key quantum-resistant cryptography also provides better security against traditional
    attacks like brute force attacks as well as side channel attacks such as timing
    attacks and fault injection attacks. This makes these types of crypto algorithms
    especially attractive for organizations who need an extra layer of security on
    top of traditional encryption methods. As an added bonus, symmetric key quantum-resistant
    cryptography does not require complex mathematical operations for it to remain
    effective; this means that it has much lower computational overhead than other
    types of cryptographic techniques. In the latest cutting-edge research, it has
    been shown that symmetric key quantum resistance has potential applications in
    the field of block-chain technology [69].


    # 3.6.9.2 Image security perspective


    Symmetric key quantum-resistant cryptography is an important tool for ensuring
    that sensitive data remains secure in today’s digital world. By its design, this
    type of crypto algorithm greatly reduces the chances that any malicious actor
    will be able to break through its defenses and gain access to confidential information.
    Additionally, because it requires lower computational overhead compared to other
    crypto techniques, it’s ideal for those who may not have access to powerful computing
    resources but still need reliable protection against cyber threats. The low computational
    requirement makes this method suitable for image/2D data.


