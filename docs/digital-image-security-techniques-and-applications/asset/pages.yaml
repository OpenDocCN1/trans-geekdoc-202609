- pgno: 175
  md: 'Even though some researchers have given interpretable solutions to the deepfake
    problem, they have avoided the use of deep learning-based feature extraction and
    stressed on handcrafted features and fusion strategies [4]. However, deep learning-based
    deepfake detection approaches to extract features have proved to be more accurate
    and efficient than conventional approaches [13]. But deep learning approaches
    are black-box in nature and to improve the trustworthiness of deepfake detectors
    by visualizing the results rather than solely focusing on accuracy, some form
    of interpretability is needed. Some approaches have achieved good results but
    lack in explainability, as can be seen in [14], where a deepfake detection based
    on layer aggregation is proposed. The pipeline used by supervised approaches typically
    starts with the extraction of visual features from a deep backbone and ends with
    a binary classification head. The authors fine-tuned the backbone network and
    used a layer importance parameter but didn’t incorporate explainability.


    Recent works have focused on explainable deepfake detection and there are various
    ways to incorporate explainability, some of which are LIME, SHapley Additive exPlanations
    (SHAP), Gradient-weighted Class Activation Mapping (Grad CAM) and other techniques.
    Some authors have used not-so popular techniques such as a CNN-based localization
    method to generate heatmaps [15]. But such an approach will be limited to just
    CNN models, whereas LIME can be used on different types of datasets and is a model-agnostic
    method. The authors in [16] suggested the use of Grad CAM and LIME, among other
    methods for XAI in terms of interpretability.


    Grad CAM is used in [17] for visualizing the predictions of the models: Xception,
    Capsule Network and one more network for deepfake detection in inter-and intra-database
    scenarios. Similarly, an attention-based explainable deepfake detection algorithm
    using Grad-CAM to focus on attention maps is presented in [18] where the authors
    worked on DFDC dataset and got good accuracy value. Also, new explainable methods
    are being developed by researchers, one of which is Score Class Activation Mapping
    (CAM), which has been used in [11]. Authors in [19] present a set of hypotheses
    based on fake, source, and target images and prove them by using Shapley value.
    A deepfake detection algorithm was proposed, which performed well for compressed
    images. However, authors in [20] observed that Shapley values are time-consuming,
    and since LIME is comparatively quicker, that’s why this chapter shows the use
    of LIME in visualizing deepfake detection. There is a need to explore more explainable
    AI approaches from a deepfake forensics perspective and this chapter is an attempt
    towards that.


    # 8.3 EXPLAINABILITY IN DEEPFAKE DETECTION


    This section discusses preliminaries required to understand explainability in
    deepfake detection such as its importance, types and methods, and the LIME tool.'
