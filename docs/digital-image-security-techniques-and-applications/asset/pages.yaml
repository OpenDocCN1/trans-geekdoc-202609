  md: '# 2.4.3 Qubit lattice format


    A qubit lattice is a way of organizing qubits (quantum bits) in a quantum computer.
    In a qubit lattice, qubits are arranged in a grid or lattice structure, with each
    qubit connected to its neighbors in the lattice [33].


    There are several different ways that qubit lattices can be represented, depending
    on the specific needs and goals of the quantum computing system. One common way
    to represent a qubit lattice is as a graph, where the qubits are represented as
    vertices and the connections between qubits are represented as edges. This can
    be done using a variety of graph formats, such as adjacency matrices or adjacency
    lists.


    Other methods for representing qubit lattices include using arrays or matrices
    to represent the positions and connections of the qubits, or using specialized
    file formats or data structures specifically designed for storing and manipulating
    qubit lattices.


    # 2.5 DATA SECURITY IN POST QUANTUM CRYPTOGRAPHY


    Post quantum data security is the study and development of technologies to protect
    data in the event that quantum computing becomes widespread. With advancements
    in technology, it is becoming more likely that quantum computers will become available
    and powerful enough to break current encryption algorithms. This means that the
    confidentiality of information held by organizations and individuals is at risk,
    as any sensitive data stored using traditional methods could be exposed [37].


    The main challenge for post quantum data security lies in developing new types
    of cryptography that can resist being broken by a quantum computer. This requires
    crypto-systems tailored to take advantage of the unique properties of quantum
    mechanics, such as entanglement and superposition. One type of system being studied
    is called Quantum Key Distribution (QKD). QKD uses single photons to generate
    cryptographic keys between two parties. These keys are highly secure since any
    attempt to intercept them causes detectable changes in their state, meaning that
    any malicious attempts to access them can be detected easily [38].


    Another form of post-quantum cryptography being investigated is lattice-based
    cryptography, which leverages various mathematical structures such as lattices
    and error correcting codes [39]. This form of cryptography provides a high level
    of security while also requiring less computation power than other forms such
    as elliptic curve cryptography (ECC), making it suitable for low-power devices
    such as smartphones or IoT devices [40] as in [41].


    In addition to these solutions, various post quantum algorithms are being developed
    that use different techniques like multivariate polynomials [42], supersingular
    elliptic curve Isogenies (SECI) [43], or hash-based signatures (HBS) [44]. By
    applying these techniques with specific parameters, greater levels of security
    can be achieved compared to traditional approaches used'
