    # 10.2 OUR CONTRIBUTION


    Considering that using a combination of watermarking and BC is a relatively new
    area of research, current surveys on watermarking primarily concentrate on traditional
    algorithms. There are many existing surveys available based on watermarking for
    digital images. However, a comprehensive survey regarding digital watermarking
    with BC is still lacking. This study is the first survey to examine image security
    using watermarking with BC, including the extensive range of recent works. The
    contributions of this chapter are summarized as follows:


    +   1. Introduce the background of watermarking and BC, including recent applications
    and essential characteristics.

    +   2. Discuss recent developments and review existing techniques based on watermarking
    and BC for digital images.

    +   3. Summarize and compare the most recent contributions in the literature,
    highlighting the significant challenges and suggestions for future directions
    in research.'
