    Image security can be approached in multiple ways. One method for securing an
    image is image encryption, which involves recreating the original image as an
    encrypted or cypher image that is difficult for unauthorized users to distinguish
    from the original [13]. Only the owner, authorized users, and intended users can
    decrypt an encrypted image. Numerous image encryption techniques have been developed
    and made usable by researchers from around the world. These algorithms can be
    divided into three major categories: position-permutation-based algorithms based
    on transposition, value-substitution-based algorithms based on transformation,
    and position-substitution-based strategies based on transposition [14].


    A quintuple (K, P, C, E, D) represents a symmetric-key crypt-system, where,


    +   - K = finite set of possible keys, which must be shared with legitimate users.

    +   - P = finite set of possible plaintexts,

    +   - C = finite set of possible ciphertexts,

    +   - E and D = encryption algorithm and decryption algorithm.


    The simplest case is two people wishing to interact with one another via an unsafe
    route. Typically, these people are referred to as Alice and Bob. Due to the channel''s
    vulnerability, an eavesdropper under the name of Eve may intercept all messages
    sent over it [15]. By agreeing on a secret key k via another secure communication
    channel, Alice and Bob can utilize a crypt-system to keep their information private
    even in the presence of the eavesdropper [16].


    Alice computes the ciphertext c = e_k(m) using the key k and sends it to Bob across
    the insecure channel in order to send her secret message m.


    Bob can use the decryption technique and uses d_k(c) = d_k, e_k(m) = m to decrypt
    the ciphertext because he also has access to the key k. But there is no simple
    method to get the original message m because Eve wiretaps the ciphertext c but
    is unaware of the key k.


    The symmetric-key crypt-system that achieves perfect secrecy is the one-time pad.
    Let us assume that P = C = K = {0, 1}^n, e_k(m) = m ⊗ k and d_k(c) = c ⊗ k, where
    ⊗ is a bitwise XOR operation [17].


