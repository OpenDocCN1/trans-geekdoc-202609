    # 12.2.5 Research challenges


    This section overviews research questions and challenges involved in CMFD. The
    scientific literature features CMFD techniques accounting for diverse approaches,
    spanning low-level image properties through deep learning methods. Although recent
    progress in artificial intelligence highlights outstanding performances achieved
    by deep learning methods in CMFD, it is worth dissecting the results and the tampering
    transformations to analyze performances according to the following questions:
    Does DL address CMFD better than all other approaches as a whole? Are performances
    consistent over diverse datasets? Are there features or methodologies proving
    more robust against specific tampering transformations? Two publicly and highly
    cited datasets (MICC and CMFD) are employed to run comparisons to answer the research
    questions above.


