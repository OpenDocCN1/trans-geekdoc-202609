  md: 'A brief discussion of some of the prominent existing approaches, which are
    related to salting, is provided as follows. Connie et al. [11] computed the revocable
    user template by means of the biometric salting technique. To construct the revocable
    and secure fingerprint user template, Fisher Discriminant Analysis (FDA) has been
    used for the extraction of features— and to compute the hash code, the binary
    discretization method has been utilized. Teoh et al. [12] presented a new approach
    to prevent the leakage of the original information from the stored fingerprint
    template, and the formulation is called BioPhasor in this work. Essentially, the
    BioPhasor is constructed by combining the fingerprint features with the user-specific
    pseudo-random numbers in an iterative way, and the generated BioPhasor is in the
    form of binary code. Jin et al. [13] presented an approach called Minutia Vicinity
    Decomposition (MVD). In MVD, minutiae triplets were computed, which is, in a way,
    the decomposition of local minutia vicinity. Further, unique features from the
    computed triplets were extracted, which are geometrical invariants. Further, these
    features were secured utilizing a salting-based transformation mechanism.


    In the literature, several approaches utilizing non-invertible transformation
    have been discussed due to the multiple advantages over the salting-based approaches
    as discussed earlier. Hence, to depict the recent development of the approaches
    for protecting the user template based on non-invertible transformation, a few
    of the recent existing works are briefly discussed as follows. Wang et al. [14]
    obtained a secure fingerprint user template using a partial Hadamard transform.
    In this work, the Discrete Fourier Transform (DFT) of binary vectors equivalent
    to fingerprint features was transformed for generating the protected fingerprint
    user template. In [15], a novel technique termed dense registration of the fingerprint
    image was developed to remove intra-subject variances such as distortions caused
    by skin elasticity. The presented technique in this work was also based on a transformation
    function that is non-invertible in nature for the construction of a protected
    fingerprint template. Lee et al. [16] proposed a secure biometric authentication
    mechanism for partial fingerprint biometrics. In this work, a novel feature, i.e.,
    ridge shape features, from the fingerprint image along with the minutiae points
    were considered for computing the secure user template for partial fingerprint
    images. Wang et al. [17] used a unique local structure formed by means of minutiae,
    which is extracted from the zoned minutia-pairs for the purpose of constructing
