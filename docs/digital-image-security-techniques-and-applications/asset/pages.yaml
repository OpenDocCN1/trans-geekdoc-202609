- pgno: 219
  md: '+   - **Off-chain:** This transaction type can occur outside the primary BC
    network, and involved parties can assign the agreement outside the network. Further,
    it includes a guarantor, which aims to ensure the completion of the transaction
    and certify the agreement.

    +   - **Hybrid:** This transaction type combines specific features of both on-chain
    and off-chain transactions.


    # 10.3.3 Data automation


    A smart contract contains codes, account balances, and files. Users can create
    a transaction by applying the consensus protocol to perform various actions based
    on the smart contract code.


    +   - **Smart contract:** Is created when the user uploads the transaction on
    the BC. During the execution of the transaction, a smart contract can efficiently
    perform the read or write operation to the IPFS storage system. The hash value
    of a smart contract is helpful for the identification of authorized users.

    +   - **Distributed application (dApp):** Provides a better user interface, allowing
    the users to perform various operations on different smart contracts available
    in the BC.


    # 10.3.4 Types of cryptocurrencies


    Cryptocurrency has employed the concept of cryptography to verify and secure the
    transactions that the user creates. The idea applied to cryptocurrency is that
    funds can be transferred between two entities in a single transaction, using public
    and private keys to ensure security. In the early days of BC technology, Bitcoin
    and Ethereum were the two most popular cryptocurrencies to ensure transaction
    security, and now Ripple is the third most popular cryptocurrency used in the
    share market [14].


    # 10.3.5 Consensus protocols


    There is a consensus approach to the algorithms and protocols that ensure the
    establishment between two entities while creating a new transaction in the BC.
    Several types of consensus protocols are performed in the BC system.


    +   - **PoW:** Various nodes participate in the procedure to complete the transaction
    to solve a complex problem. The selected node validates the block and establishes
    the transaction. Bitcoin and Ethereum 1.0 are the two most common approaches used
    in PoW.'
  merge: -1
  img_proc: true
- pgno: 220
  md: '+   - **PoS:** In this procedure, each node requires some finite amount of
    currency to claim the ownership of the given block during the mentioned transaction.
    PoW is shifted to the PoS platform to enhance the BC system’s scalability and
    throughput.


    # 10.3.6 Content protection mechanism


    The content protection mechanism is applied to protect multimedia content from
    unauthorized users. This mechanism ensures copy protection, the authenticity of
    the multimedia object, medium transmission security, and digital rights [16].
    It also offers an end-to-end content protection mechanism where only authorized
    users can access multimedia content. There are several types of content protection
    mechanisms.


    +   - **Encryption:** This is one unique approach to data hiding. The original
    message is converted into an unreadable form (a ciphertext message) to maintain
    the confidentiality of multimedia data [17]. Further, the reverse procedure is
    performed on the ciphertext message to decipher the original message, known as
    decryption. This scheme offers the confidentiality, integrity, and authenticity
    of multimedia information.

    +   - **Digital rights management (DRM):** DRM systems encrypt the multimedia
    content so only authorized users can access the confidential information, which
    protects unauthorized access to multimedia content [18]. The content is delivered
    to the authorized user, and it avoids content modification or illegal copying.

    +   - **Digital watermarking:** Watermarking has been a widely used data-hiding
    technique. This protection mechanism hides confidential information in multimedia
    objects to achieve copyright protection [19]. It extracts confidential information
    and can claim ownership and verify the authenticity of a multimedia object. The
    watermarking system focuses on robustness, security, payload, and visual quality
    features.


    # 10.4 JOINT WATERMARKING AND BLOCKCHAIN-BASED TECHNIQUES


    The integration of digital watermarking and BC framework has been used in various
    DRM systems to offer various solutions such as copyright management, content authentications,
    copyright transfers, and tracking the transaction status to digital media [20].
    Digital watermarking plays a significant role in offering multimedia data copyright
    protection. However, a marked image can be tampered with when transmitted through
    an open channel. So, the watermarking method is insufficient to'
  merge: -1
  img_proc: true
- pgno: 221
  md: 'protect multimedia data completely. Nowadays, authors are motivated to exploit
    BC technology and watermarking protocols to solve these issues. This section briefly
    overviews the BC-based watermarking schemes, their attributes, and implementation.


    In [21], Xu et al. proposed a lookup table-based secure watermarking scheme to
    provide secure information transmission and leakage tracking. Here, the BC technique
    is used for the fair distribution of multimedia content among clients without
    help from a trusted third party. Using Paillier encryption before embedding further
    increases the security of the digital marks. Meng et al. [22] presented a secure
    watermarking scheme with BC and perceptual hashing to provide copyright protection
    for digital images. The perceptual hash value of the cover image and the owner''s
    personal information are taken as private marks and converted into QR codes, reducing
    the storage demand and improving robustness. The QR image is concealed within
    the cover image using the discrete cosine transform (DCT) technique, and the final
    marked image and its hash value are stored in the distributed interplanetary file
    system (IPFS) network. Sahoo et al. gave a novel BC-based watermarking scheme,
    BDmark, for providing copyright protection to big data [23]. Personal data are
    embedded at the granularity level of the basic data blocks.


    Further, the given method is also evaluated against several types of attacks.
    The method is suitable for big data monetization and can provide a transparent
    and immutable audit trail on the receiver''s side. In [24], Qureshi and Megias
    presented a multimedia distribution model based on BC and digital fingerprinting,
    which can provide data tracing, copyright protection, and secure data delivery.
    Prior to embedding, the original data is encrypted using the Paillier cryptosystem.
    Further, the fingerprint code words are embedded within the encrypted cover using
    the quantization index modulation-based watermarking scheme. Here, Ethereum smart
    contracts are used to keep all transaction records between the sender and the
    receiver to verify the integrity of the original content. Bhowmik and Feng [25]
    proposed a self-embedding watermark and BC-based framework for tamper-proof multimedia
    transmission. The transaction logs'' cryptographic and image hash is considered
    a private mark.


    Further, the lifting-based wavelet transformation technique embeds the marks within
    the lower frequency bands. Extracting the marks at the receiver''s side will provide
    a transaction trail and details of the tamper regions. The authors of [26] proposed
    a fragile watermarking scheme to detect image tampering based on the localization
    method. Here, the Y component of the cover image is divided into 4 × 4 blocks
    and creates a cyclic chain of blocks with the concept of BC. The private marks
    are concealed within one of the blocks by measuring the information entropy and
    edge entropy values. According to the experimental result, the given method shows
    resistance against vector quantization and collision attacks.'
  merge: -1
  img_proc: true
- pgno: 222
  md: 'Authors of [27] proposed a novel BC-based approach to provide security to the
    X-ray data at the time of storing in the cloud network. Here the cover X-ray image
    and patient personal data image are encrypted before embedding using a uniform
    quantization technique and chaotic encryption technique, respectively. Zhao et
    al. proposed an Ethereum-BC-based model, RobustCPS, to provide multi-platform
    copyright protection to audio signals [28]. The original signal is divided into
    blocks, and DCT-SVD is applied to the blocks to get the embedding coefficients.
    The proposed method provides superior results to existing BC schemes in the presence
    of typical processing and de-synchronization attacks. In [29], the authors developed
    a secure and decentralized IPFS-based model to check the copyright infringement
    of shared multimedia. The DCT technique captures the perceptual hash value from
    the cover image, which is further used as a private mark to detect the copyright.
    Experimental results show that the proposed method provides good resistance against
    different transformation operations. Li et al. [30] proposed a novel BC-based
    watermarking scheme to provide integrity, privacy, and availability of image big
    data. Here, the original cover image is encrypted using compressive sensing and
    then divided into blocks to add the original watermarks. Further, the marked data
    is stored on the IPFS server, and the hash value of the content is created. Finally,
    the hash value is uploaded to the blockchain to protect the privacy of the content.


    In [31], Zhao et al. proposed a music copyright protection scheme, BMCprotector,
    based on BC and smart contracts. Multiple marks are inserted using the vector
    quantization method to verify the legitimate owner and receiver. Further, the
    marked data is encrypted using the AES algorithm before storing into the IPFS
    storage system. Authors of [32] developed an efficient and robust model based
    on BC, neural network, and watermarking schemes to provide copyright protection.
    Here, the convolutional neural network (CNN) is applied to the cover image to
    capture the latent image features, which is used to calculate the perceptual hash
    value. This hash value is used as the fingerprint of the cover image and securely
    stored in the BC. Garba et al. [33] proposed a secure DRM model to provide digital
    content authentication. Before embedding, the digital mark is encrypted using
    SPECK lightweight encryption to increase security and robustness. Further, DCT
    embeds the encrypted marks within the cover image. Finally, the data owner will
    upload the marked data in the cloud, storing the transaction records in the BC
    network.


    The authors of [34] provided a secure watermarking-BC scheme, DRMchain, to detect
    internet misuse in artwork image DRM models. Arnold transformation technique is
    used to secure the watermarks before embedding. Further, a human visual system
    (HVS) is used to find appropriate embedding strength, and using the Watson DCT
    model, the private marks are invisibly concealed within the cover. The marked
    data is stored within the BC to provide access control and protect the users’
    privacy.'
  merge: -1
  img_proc: true
- pgno: 223
  md: 'Franco [35] has presented a novel watermarking scheme combining buyer-friendly
    and mediated approaches and a BC network to avoid the direct involvement of trusted
    third parties in purchase transactions. BC generates the token that identifies
    the purchase of each transaction of digital content over the internet. This scheme
    ensures better security and is well suited for a web context. In [36], Yang et
    al. have illustrated a BC-based watermarking framework to provide copyright protection
    for big data. First, the watermarking scheme embeds the watermark information
    into big data. This scheme stores watermark copyright information and data-sharing
    records inside the BC and resists subset selection, alteration, and mix-and-match
    attacks. Wang et al. [37] have introduced an Ethereum-based watermarking framework
    for protecting digital images. The original image is transformed using DWT and
    SVD. Further, a chaotic map is performed on each original image block to obtain
    a scrambled feature image. The chaotic map scrambles the marked image and then
    inserts the scrambled feature image to obtain a zero watermark. IPFS is applied
    to solve the data expansion problem in the BC framework.


    Wu et al. [38] have introduced a zero watermarking framework using BC technology
    for video copyright in the NSCT-SVD domain. First, a frame is chosen randomly
    in the given video frame and then separated into RGB components. Further, NSCT
    is applied to the scrambled RGB component, and the lower frequency component of
    NSCT is further transformed using SVD. Finally, a scrambled mark image is inserted
    inside a characteristic matrix of the selected frame to obtain the zero-mark image.
    Lou and Lu [39] introduced a data-hiding approach using the BC framework for delivering
    the authenticity and integrity of digital media. Before the embedding process,
    personal data is encrypted and embedded inside the multimedia object using multiple
    transforms (DWT-DCT-SVD). The marked image is transmitted through an open channel
    and stored inside the BC framework. Lastly, the extraction procedure pulls out
    confidential data to verify the authenticity and integrity of digital media.


    Benkhaddra et al. [40] have used an optimization-based data hiding scheme in the
    BC environment to provide the secure transmission of confidential data. FIEO-based
    optimization is employed on the cover image to determine the optimal position
    for an embedding purpose. Wavelet transform is employed to embed the hidden data
    into an optimal position of the cover image. This scheme determines the robustness
    against selected attacks. Horng et al. [41] integrate the reversible watermarking
    scheme and BC technology to secure medical images. A medical record is encrypted
    using a symmetric key hidden inside the medical host image to maintain accepted
    visual quality. Marked data is stored within the consortium BC system to provide
    access control and protect the users’ privacy. The payload of this scheme is extremely
    low. To verify the ownership of big data, Sahoo and Halder [42] proposed a watermarking
    approach using the BC system. LSB operation is'
  merge: -1
  img_proc: true
- pgno: 224
  md: 'performed for embedding the confidential information inside the cover image.
    Further, the marked image is uploaded on IPFS, and then the hash value of the
    marked image is generated for authentication. Xu et al. [43] introduced a watermarking
    scheme with BC and perceptual hashing to provide copyright protection to remote
    sensing images. The scrambled mark is hidden inside the cover image during the
    embedding step. The zero-mark image is stored on the BC, and the hash value of
    the zero-mark image is used for identifying copyright protection. In [44], Wang
    et al. focused on a zero watermarking framework using BC to protect copyright
    information. DWT and SVD transform the host image for the embedding process. A
    cat map and transformed cover images are employed on the mark to ensure additional
    security. The zero-marked image is obtained by performing the ex-or operation
    between the encrypted mark and the cover image. The zero-marked image is stored
    on the BC, and the zero-marked image''s hash value is used to identify copyright
    protection.


    Similarly, Bhadauria et al. [45] illustrated a watermarking scheme for protecting
    intellectual property in the BC environment. The fusion of DWT and SVD embeds
    confidential data inside the multimedia object. The marked image is uploaded inside
    the IPFS, and the hash value marked image is used for identifying the copyright
    protection of intellectual property. Peng et al. [46] introduced a data-hiding
    technique using the BC system to address the copyright issue of digital content.
    Firstly, the hash function is employed on image and text data to obtain a digital
    signature. Secondly, mark information in a QR code is embedded into acceptable
    visual quality cover media. Further, the hash value of the marked image and digital
    signature are uploaded on the smart contract. This scheme did not investigate
    any experimental analysis to measure the effectiveness of this method. In [47],
    Fei discussed a DRM system using the smart contract in the BC environment. This
    method employed the smart contract to ensure copyright management in terms of
    copyright registration and transactions of digital content. The sender creates
    a verified transaction; mark data is concealed inside the multimedia object. Furthermore,
    the encryption scheme is applied to the marked image and then the encrypted marked
    image, along with the private key, is uploaded to the IPFS database. However,
    this method applies to a single content owner.


    Table 10.1 summarizes some notable BC-based watermarking techniques for methodology,
    objectives, cover type, watermark size, and limitations. The peak signal-to-noise
    ratio (PSNR) and structural similarity index (SSIM) were employed to evaluate
    the similarity between the cover and marked media [48]. The normalized correlation
    (NC) and bit error rate (BER) were used to determine the similarity between private
    and recovered marked images [49].


    Further, Table 10.2 summarizes the BC techniques used for storage, consensus algorithm,
    smart contract, and framework.'
