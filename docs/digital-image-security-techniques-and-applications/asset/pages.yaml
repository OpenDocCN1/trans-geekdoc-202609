    Due to its independence from a centralized system, peer-to-peer networking is
    a reliable and dependable solution. This implies that the interconnected and linked
    machines will be able to operate separately from one another. The network will
    not be disrupted even if one component fails. The issue that still persists is
    that only the corresponding user will have access to those files. P2P networking
    has best scalability qualities, which is an additional benefit. The network''s
    performance won''t suffer even if more clients are added. A single file may occasionally
    be shared by several users, in which case the network will make additional bandwidth
    available.'
