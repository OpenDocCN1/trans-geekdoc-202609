  md: 'is evaluated and analyzed by the Performance parameters. Those include Spearman
    Rank Ordered Correlation Coefficient (SROCC), Pearson Linear Correlation Coefficient
    (PLCC), and Root Mean Square Error (RMSE). These parameters are the most significant
    algorithm to evaluate NR-IQA [41]. Prediction monotonicity of the proposed method
    is measured through SROCC parameter and can be defined as:


    SROCC(Q_obj, Q_sub) = 1 - (6 Σ D_i) / [N(N² - 1)] (11.24)


    Where Q_obj and Q_sub are predicted and actual score, respectively. Subjective
    score is the actual score predicted by human eye. D_i is the grade difference
    among Q_obj and Q_sub for sample i. And N is the number of images in the evaluation
    database.


    PLCC defines the correlation between the subjective score and objective prediction
    score. Prediction accuracy is measured through PLCC parameter and can be defined
    as:


    PLCC(Q_obj, Q_sub) = cov(Q_obj, Q_sub) / [σ(Q_obj) σ(Q_sub)] (11.25)


    The absolute deviation between subjective and objective score can be measured
    by RMSE and can be defined as:


    RMSE = √[ (1/N) Σ_{i=1}^N (S_i - O_i)² ] (11.26)


    Where S and O are subjective mean opinion score and objective mean opinion score,
    respectively. Subjective assessment is evaluated by large number of observers.
    Tables 11.4–11.6 show that the performance results of proposed method in terms
    of SROCC, PLCC, and RMSE, respectively, for different destructions include JPEG
    2000 (JP2K), JPEG, additive white noise (WN), Gaussian Blur (GB), and Fast Fading
    (FF). It is observed that the proposed method has a high measure of consistency
    with subjective qualitative assessment of human visual observation. Table 11.4
    shows the performance comparison of the proposed method with respect to SROCC.
    The proposed methods SROCC result is 0.952 considering all the distortions. We
    can see that the FR IQA methods are competitive with the proposed algorithm in
    terms of SROCC performance, and proposed method is statistically efficient than
    the state-of-the-art NR-IQA methods. Our proposed method improvements over SROCC
    score is 1.2% than WLBP [32] method in case of JP2K artifact, 0.73% than WLBP
    [32]'
