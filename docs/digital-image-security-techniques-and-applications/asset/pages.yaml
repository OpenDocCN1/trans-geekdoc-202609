- pgno: 264
  md: '# 12.2.2 Machine learning approaches


    While the previous section is devoted to purely low-level image-processing techniques,
    this section approaches CMFD by surveying Machine Learning methods. For clarity''s
    sake, Machine Learning here refers to AI approaches that do not rely on deep neural
    networks, which will be tackled in the Deep Learning subsection. The current subsection
    is further divided into two paragraphs focused on machine learning methods reliant
    on clustering and local descriptors.


    # 12.2.2.1 Local descriptor-based techniques


    Hussain et al. [24] utilized multiresolution Weber law descriptors as feature
    extractors and then trained support vector machine (SVM) to detect copy-move forgery.
    The approach could achieve about 91 % detection accuracy. A similar approach by
    Muhammad et al. [25] relies on SVM to classify forged and original images. The
    authors used steerable pyramid transform to obtain multiscale and multi-oriented
    subbands. Then, a feature vector is generated by concatenating the histogram of
    sub-bands. Finally, SVM is used for image classification. Daniya et al. [26] proposed
    a method for copy-move forgery detection in videos using machine learning algorithms.
    In particular, they employed the statistical feature of noise remnant to detect
    forgeries in digital videos. The authors analyzed the temporal correlation of
    block-level noise remnants to find tampered sections in the video. Machine learning
    algorithms are then used for the classification process. Ferreira et al. [27]
    posed the issue in a multiscale behavior knowledge space. They combined the many
    aspects of copy-move detection techniques. First, using different scales on the
    training data, the process can encode the outcome combinations of various methods
    as prior probabilities. Then, generative models applied to the training data are
    used to predict the conditional probability of missing items accurately. Eventually,
    they provide several methods that use the data''s multi-directionality to produce
    the final result detection map in a machine-learning decision-making manner. Experimental
    findings on complicated datasets demonstrate the proposed method''s efficacy and
    applicability, which compare the proposed techniques with various copy-move detection
    approaches and other fusion strategies in the literature. Another work [28] proposed
    a two-step forgery detection system. The suggested method divides the suspect
    image into an authentic or counterfeit image in step one. Then, the optional second
    phase is used to identify the forged regions in the picture suspected of being
    fake. Performance of the suggested technique is evaluated using CoMoFoD [29] and
    CASIA [30] Datasets. The performance of the suggested approach demonstrates resilience
    even when post-processing assaults such as JPEG compression, scaling, and rotation
    are applied to the forged picture.'
  merge: -1
  img_proc: true
- pgno: 265
  md: '# 12.2.2.2 Clustering


    A practical, efficient, and automatic copy-move forgery detection system based
    on a hybrid transform and a K-means clustering algorithm is described by the authors
    of [31]. This method operates without the need for prior information about the
    image. Initially, the picture dimensions are reduced using Discrete Wavelet Transform
    (DWT), then the feature vector elements’ range is constrained using Discrete Cosine
    Transform (DCT). Finally, rapid k-means clustering is employed to cut down on
    calculation time. In addition, the FKM clustering algorithm helps avoid needless
    distance calculation by using trio inequality. The results make it evident that
    the provided algorithm overcomes other current and pertinent techniques in terms
    of both detection time and accuracy. In [32], the authors presented a matching
    technique to speed up detection and improve detection precision. This improvement
    is accomplished by grouping picture blocks into clusters and looking for identical
    blocks inside each cluster instead of looking for them all. The picture blocks
    are first clustered using k-means clustering, and then the blocks are matched
    using the Locality Sensitive Hashing (LSH) approach based on Zernike moments.
    According to the experimental findings, the processing time was cut by 10% while
    improving the detection accuracy. The study [33] presented a learning approach
    for forgery detection. The initial phase is image segmentation, where each block’s
    histogram of angled slopes is functional, followed by feature extraction, which
    is concentrated to enable the dimension of similarity. Support vector machines
    are used to do the detection. The findings demonstrate that the proposed technique
    is efficient enough to recognize various examples of copy-move forgeries and be
    able to spot duplicate areas. Prewitt Filter with Generalized Action Selection
    (PFGAS) based Hybrid Artificial Bee Colony African Buffalo Optimization (HABC-ABO)
    technique was developed in the study [34] to detect tampered regions and identify
    forgeries. The CoMoFoD database with five distinct types of forged images was
    utilized in this work. The method would detect forgeries in digital photographs,
    even if they underwent resizing or rotation. According to experimental analysis,
    the suggested ECMFD technique performs better in Precision, F1-measure, and Recall.
    As a result, the proposed methodology has a higher detection accuracy of 99.82%
    than the other cutting-edge methods. An improved copy-move forgery detection pipeline
