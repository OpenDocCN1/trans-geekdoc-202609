  md: 'determine the likelihood that a biometric security system may incorrectly refuse
    access to a valid user [12–14]. Mathematically, FAR and FRR are calculated as
    follows:


    FAR = The total number of erroneous acceptances made during the procedure. / The
    total number of identifications made throughout the procedure


    FRR = The total number of erroneous rejections made during the procedure. / The
    total number of identifications made throughout the procedure


