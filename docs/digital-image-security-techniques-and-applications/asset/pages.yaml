    # 12.4 CONCLUSION


    The primary purpose of this chapter is to let readers approach copy-move forgery
    detection with a bottom-up strategy. Readers are first given an introductory section
    with background and context on the topic. Section 12.2 provides insights into
    the most common methods for CMFD: low-level image feature-based, machine learning,
    and deep learning methods. Each approach is characterized by different steps,
    as depicted in Figures 12.1–12.3. Noticeably, the deep learning pipeline does
    not include image feature extraction, as it is embedded within the convolutional
    layers. Section 12.3 outlines high-level and technical considerations about the
    methods’ performances on publicly available datasets, such as MICC and CMFD, described
    in Section 12.2.4. Research questions are introduced in Section 2.5 to highlight
    the current challenges in the field and prompt readers to key factors concerning'
