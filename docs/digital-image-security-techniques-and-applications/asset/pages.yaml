    # 12.2.4 Datasets


    Several datasets with copy-moved forged images have been presented over the last
    few years. Some of the most popular datasets are described in this section. CASIA
    v2.0 [30] is a popular copy-move forgery detection research dataset. The Chinese
    Academy of Sciences created CASIA v2.0. It consists of 1050 images with copy-move
    forgeries. The dataset is divided into three subsets, each with different transformations.


    The first subset, “CASIA v2.0 Subset 1,” contains 435 images with simple copy-move
    forgeries. These forgeries involve copying a small patch of an image and pasting
    it onto another area of the same image. This subset tests the basic capabilities
    of copy-move forgery detection algorithms.


    The second subset, “CASIA v2.0 Subset 2,” contains 300 images with more complex
    copy-move forgeries. These forgeries involve rotating, scaling, or flipping the
    copied patch before pasting it onto another area of the same image. This subset
    is designed to test the robustness of copy-move forgery detection algorithms.
    The third subset, “CASIA v2.0 Subset 3,” contains 315 images with more challenging
    copy-move forgeries. These forgeries involve copying a patch from one image and
    pasting it onto another. This subset allows testing the generalization ability
    of copy-move forgery detection algorithms. The images in CASIA v2.0 are in JPEG
    format with a resolution of 512×512 pixels. The dataset also includes ground-truth
    annotations specifying each image forgery location and type. Researchers can evaluate
    the performance of their copy-move forgery detection algorithms using objective
    metrics such as precision, recall, and F1 score.


    CoMoFoD dataset [29] consists of 260 forged images grouped into two categories:
    small (512×512 pixels) and large (3000×2000 pixels). Furthermore, images are also
    stored according to the manipulation type: translation, rotation, scaling, combination,
    and distortion. Besides manipulations, different post-processing methods are run
    over the images: JPEG compression, blurring, noise adding, and color reduction.
    The forgeries are visually similar to the original images, and the tampering artefacts
    are not easily noticeable. This dataset is suitable for developing and evaluating
    copy-move forgery detection algorithms that detect visually similar forgeries.


    COVERAGE [54] contains copy-move forged (CMFD) images and their originals with
    similar but genuine objects (SGOs). COVERAGE is designed to highlight and address
    tamper detection ambiguity of popular methods caused by self-similarity within
    natural images. In COVERAGE, forged-original pairs are annotated with (i) the
    duplicated and forged region masks and (ii) the tampering factor/similarity metric.
    For benchmarking, forgery quality is evaluated using (i) computer vision-based
    methods and (ii) human detection performance.'
