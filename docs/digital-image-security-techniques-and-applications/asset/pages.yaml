- pgno: 176
  md: '# 8.3.1 Importance of explainability in deepfake detection


    Many deepfake detectors only provide a binary output, indicating whether the analyzed
    media is real or fake. However, this prediction, even if accurate, does not provide
    any further insight into the reasoning behind it. The absence of explainability
    may hinder the practical use of deepfake detectors, as it makes it difficult for
    users to trust their results [21].


    Despite the ability of deep learning systems to produce reliable predictions,
    their “black-box” nature makes them less trustworthy. Explainability is crucial
    for creating transparency, but the lack of ability for deep learning to explain
    its decisions to humans restricts their effectiveness. Explainable Artificial
    Intelligence (XAI) can address this issue by providing interpretation of the predictions
    made by these systems [22].


    # 8.3.2 Types and methods of explainability in deepfake detection


    There are various types of explainability such as model-level, which provides
    insight into the internal workings of deep learning models; instance level, which
    provides explanations for specific deepfake detection decisions; and feature level,
    which provides explanation based on the most important features for decision.
    The types and various methods used for each type of explainability with respect
    to deepfake detection are given below:


    # Model-level Explainability


    This type of explainability focuses on understanding how the deepfake detection
    model works and what factors it considers in making its predictions through methods
    such as Layer-wise Relevance Propagation (LRP) [23] or gradient-based methods
    [24, 25], which provide insights into how the deepfake detection model is making
    its predictions by highlighting the most important features in the input video.


    # Instance-level Explainability


    This type of explainability focuses on explaining the decisions made by the deepfake
    detection model for a specific instance or video through methods such as saliency
    maps [26], which highlight the regions of the video that are most important for
    the deepfake detection model''s prediction. Attention maps and activation maps
    [14] can also be used to show the regions of the video that the model is focusing
    on when making its predictions.


    # Feature-level Explainability


    This type of explainability focuses on identifying the features or characteristics
    of the video that the deepfake detection model considers most important in making
    its predictions through methods such as feature'
  merge: -1
  img_proc: true
- pgno: 177
  md: 'importance scores or decision trees, which provide insights into the specific
    features of the video that the deepfake detection model is considering in its
    predictions. Additionally, methods such as occlusion experiments can be used to
    show the impact of specific features on the deepfake detection model''s predictions
    [27].


    These methods can be used individually or in combination to provide a comprehensive
    view of how the deepfake detection model is making its predictions, and to build
    trust and credibility in the results produced by deepfake detection systems. These
    techniques can be implemented using open-source libraries and tools such as Matplotlib,
    TensorFlow, PyTorch, LIME and Shapley Additive Explanations (SHAP). LIME is quicker
    than SHAP in terms of cost and calculation time. Shapley values are time-consuming
    to calculate, however, SHAP enables the computation of a large number of Shapley
    values required for global model interpretations [20].


    # 8.3.3 Local Interpretable Model-Agnostic Explanations (LIME)


    In this chapter LIME tool is used. LIME is a type of instance-level explainability
    method used to provide local explanations for the predictions of any machine learning
    model, including deepfake detection models. LIME works by approximating the deepfake
    detection model''s behavior locally around a specific instance or video by generating
    a simplified linear model. This linear model is then used to explain the deepfake
    detection model''s prediction for that instance by highlighting the features that
    had the largest impact on the prediction [28]. LIME can be used with any machine
    learning model, regardless of the specific algorithm or architecture used. It
    does not require access to the underlying model''s internal workings, which makes
    it model-agnostic. The tool works by generating perturbations of the input data
    and observing how the output changes. It then constructs a simpler model around
    the specific instance of interest to explain the behavior of the original model.


    See Figure 8.3, where an example instance marked as the bold red cross is being
    explained. Let''s say, a decision function f shown as pink vs. blue is not known
    to LIME which is the function of a black-box model. This function cannot be approximated
    adequately by a linear model, so the dashed line is used to show local explanation
    rather than global. That''s how LIME tool samples instances, applies f to get
    predictions, and weighs them by nearness to the instance considered for explanation.


    LIME relies on the assumption that every complex model is linear on a local scale
    because a simple model may not be able to approximate the black-box model globally.
    LIME provides explanations in the form of ‘local feature importance’ scores, which
    indicate how much each input feature contributed to the prediction for the specific
    instance being explained. These'
