  md: '![](img/6e4271af21d9a195003ab8711aa79d27_310_0.png)


    Figure 14.2 A generic working of a biometric system based on the cancelable biometrics.


    fingerprint template, which does not have any linkage with the leaked one. Figure
    14.2 shows a schematic block diagram illustrating the general operation of the
    template protection strategy based on cancelable biometrics. It becomes abundantly
    evident from Figure 14.2 that the secured/transformed user template is kept in
    the database and that the matching is carried out in the secured/transformed domain;
    therefore, there is no original information of the fingerprint image involved
    during the verification stage.


    Furthermore, the cancelable biometrics can be categorized into the following types
    [10], i.e., biometric salting and non-invertible transformation, according to
    the existing research in the literature. In the existing approaches based on biometric
    salting [11], a transformation of biometric features is performed using user-specific
    keys/parameters. Reconstructing the original and unique biometric information
    by employing reverse-engineering and the protected template is challenging in
    these findings. However, the nature of the transformation process is invertible;
    therefore, it is necessary to protect the user-specific parameters as well because
    if the parameters are compromised, it is possible to invert the transformation.
    In contrast, when we see existing methods based on non-invertible transformation
    [9], a transformation process of non-invertible nature is adopted to construct
    the secure user template. Consequently, it is not possible to retrieve the original
    biometric data from the leaked user template even if the transformation parameters
    and the secure template are stolen. Due to this advantage of non-invertible transformation-based
    approaches, these are extensively discussed in the literature as compared to the
    biometric salting-based template protection approaches. A few of the prominent
    and recent existing works related to the biometric salting and non-invertible
    transformation-based cancelable biometrics technique for fingerprint biometrics
    are briefly discussed below.


    A very few presented techniques are related to biometric salting in the literature,
    as compared to the approaches utilizing non-invertible transformation.'
