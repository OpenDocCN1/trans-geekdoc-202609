  md: '+   - Biometric systems using 3D biometrics are more resistant to attacks because
    3D data is more difficult to forge or replicate.


    The functioning of the 3D biometric system is the same as 2D biometric, which
    has four modules: User Interface Module, Acquisition Module, Recognition Module,
    and External Module [6]. An interface between the system and users is provided
    by the user interface module to provide efficient authentication. For people to
    enjoy using the device, a suitable user interface must be created. The route through
    which biometric features are obtained for further processing is the acquisition
    module. The crucial component of our system that decides if a user has been authenticated
    is called the Recognition Module. Pre-processing of the images, feature extraction,
    template generation, database updating, and matching are all included. The result
    of identification and verification is then displayed. The signal from the recognition
    module is received by the external module, which decides whether to approve or
    disapprove the requested operations. In reality, this module is an interface that
    can be attached to either other hardware or software components [7].


    Any biometric system works in the three modes of operation: enrollment, identification,
    and verification [8]. In the first step, the user needs to enroll itself to a
    biometric system. The user''s biometric data is recorded, processed accordingly,
    and features are extracted from the recorded data. This is completed in the first
    three modules. After this, captured user data is saved in the concern database.
    In the identification stage, a person whose information is saved in the biometric
    database is identified by the biometric system without any prior knowledge. The
    first three stages of one-to-many matching are completed to produce the identification
    template. For the feature matching procedure, the biometric system will use the
    entire database of existing templates. The result (fail or pass) will turn up
    after that. The verification procedure requires that the person''s identification
    be claimed before the verification template is compared to the database in use
    to validate the person''s claim of identity [9].


    The 3D biometric can be divided into the three major categories named as Face,
    Hand, and Gait [10]. Again, 3D face biometric is sub classified into facial, ear,
    iris, and skull biometrics. In a similar way, 3D hand biometrics is sub classified
    into fingerprint, finger vein, and palm. The gait biometric has no further sub
    classifications. 3D biometric methods can be classified on the basis of the light
    source. These methods can be split into the active method and passive method.
    The light source of the active method directly hits the surface to create the
    3D reconstruction, while the passive method uses ambient light conditions to capture
    the 3D image [11].


    The false acceptance rate, also known as FAR, is a measure that may be used to
    assess the likelihood that an unauthorized user''s attempt to enter the personal
    detail would be wrongly acquired by the biometric security system. The false recognition
    rate, often known as FRR, is a measurement used to'
