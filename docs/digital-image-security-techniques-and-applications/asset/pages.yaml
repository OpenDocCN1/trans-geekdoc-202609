    this is the “natural” mapping because addition in GF (28) corresponds to a XOR
    of the bytes.


    # 13.3.7.3 The key schedule


    In addition to the four key-dependent S-boxes required by the g function, the
    key schedule must include Twofish support keys with N = 128, N = 192, and N =
    256 bits for the four-word key K0, ..., K39. The use of zero padding allows the
    use of keys with less than 256 bits.


    k = N/64. M is made up of 8k bytes, which are m0, ..., m8k1. 2K 32-bit words are
    generated from bytes.


    M_i = sum_{j=0}^{3} m(4i + j) . 2^{8j} i = 0, ... 2k - 1  (13.18)


    M_e = (M0 M2, ..., M_{2k-2})  (13.19)


    M_o = (M0 M3, ..., M_{2k-1})  (13.20)


    The key produces a second k-character word vector. The key bytes are segmented
    into eight-byte chunks, interpreted as vector over GF (28), and then subjected
    to multiplied by a 4 × 8 matrix incorporating a Reed-Solomon code.'
