    insights into the development of innovative techniques for enhancing the security
    of health care data.


    Further, encryption is a commonly used technique to ensure secure storage of sensitive
    data such as medical records and reports. Traditional encryption methods like
    Data Encryption Standard (DES) [35], Triple DES (3DES) [36], and Advanced Encryption
