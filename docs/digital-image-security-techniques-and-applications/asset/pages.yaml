  md: '# Scalable edge computing architecture for multimedia data management


    # Challenges and research avenues


    Jaya Sinha

    Galgotias College of Engineering and Technology, Greater Noida, India


    Nivedita Palia

    Vivekananda Institute of Professional Studies–Technical Campus,

    Delhi, India


    # 7.1 INTRODUCTION TO THE EDGE COMPUTING ECOSYSTEM


    Expansion and development in the domain of Internet of things and achievement
    of cloud services have seen the rise of the innovative computing archetype known
    as Edge Computing. Edge computing means processing data nearer to the edge of
    the network, where it is generated. It enables the user to process a large amount
    of the data at high speed with a faster response time. Currently, Internet of
    things connects a wide variety of electronic and electrical devices that generate
    a huge volume of data. Data volumes will increase substantially as a result of
    technologies like 5G.


    Today, digitalization is sweeping the globe, and an abundance of data is generated
    in various arenas. In most cases, processing of data needs to be done quickly
    to support real-time applications. Cloud computing technologies gradually reduce
    the requirement for small-scale and medium-scale industry to own their own system
    to perform computation tasks. Still, the end user requires transmitting and acquiring
    data to and from where the machine is located. Cloud computing is not always efficient
    to process data produced at the edge of the network, so micro data center [1,
    2], fog computing [3], and Cloudlet [4] have been introduced. In the following
    paragraphs, we will present several reasons for the emergence of edge computing,
    along with a comparative study between them.'
  merge: -1
  img_proc: true
