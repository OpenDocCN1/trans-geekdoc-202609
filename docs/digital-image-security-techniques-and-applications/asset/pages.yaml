    The main points of this chapter are as follows:


    +   - Insights on the importance of explainable deepfake detection approaches
    that place an emphasis on the trustworthiness of the results in addition to accuracy.

    +   - A focus on individual frames of the videos taken from the DFDC dataset.

    +   - Various pre-trained deep learning models are used for training, and evaluation
