  md: '# A Secured Dual Image Watermarking technique using QR decomposition, Hénon
    map, and Chaotic encryption in wavelet domain and its authentication using BRISK


    Divyanshu Awasthi

    MNNIT Allahabad, Allahabad, India


    Priyank Khare

    IIIT Ranchi, Ranchi, India


    Vinay Kumar Srivastava

    MNNIT Allahabad, Allahabad, India


    # 5.1 INTRODUCTION


    The protection of multimedia data is a major problem because of the development
    of computer technology and 5G networking. Speech, video, and image data are all
    examples of multimedia data [1]. Medical data forgery or phishing is an alarming
    situation for researchers to provide higher security. The size of medical data
    is increasing day by day; therefore, the confidentiality and integrity of that
    data are also important. Due to numerous passive (the attacker''s objective is
    to get information) and active (the attacker may change the data or harm the system)
    attacks, the authentication of medical data is also critically important. The
    details of active and passive attacks are shown in Figure 5.1.


    A universal standard for the storage, exchange, and transmission of medical images
    is called DICOM, which stands for Digital Imaging and Communications in Medicine
    [2]. Watermarking systems can be divided into two primary categories based on
    the embedding process: transform domain and spatial domain. In the spatial domain,
    the watermark is embedded into certain host image pixels. Before a watermark is
    introduced to the frequency coefficients in the transform domain, the host picture
    is transformed in frequency domain [3]. According to the computer emergency response
    team (CERT), security breaching trends are increasing drastically. In 2020, the
    security breaching trends were as unauthorized network'
  merge: -1
  img_proc: true
