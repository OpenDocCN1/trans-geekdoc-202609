  md: '# 13.5 CONCLUSION


    This chapter discusses the different structures of Smart Homes and security issues.
    The Internet of Things has countless applications, but it is not without challenges.
    Privacy and security are crucial concerns. These constraints render IoT devices
    unsafe. Without IoT security, the internet is hazardous. We examined IoT security
    and the solutions that must be deployed to persuade customers that IoT is about
    more than simply low-cost gadgets, but also about security and privacy. This chapter
    describes a multi-user searchable encrypted speech system that increases the utility
    of home IoT voice searches while protecting users’ privacy. We propose a Multi-layer
    Encryption with Advanced Encryption Standard (ME-AES) and a Twofish encryption
    algorithm in this chapter. The outline is as follows: The proposed model, ME-AES,
    consists of multiple encryption layers and a security architecture designed for
    the intelligent assistant. The queries directed to the intelligent assistant undergo
    a process of scrambling and encryption, employing key chaining with IBE and BLAKE2.
    IBE requires the gadget serial number and the user’s email address. The sensitive
    data is secured with AES and Twofish, while non-sensitive data is safeguarded
    by the Advanced Encryption Standard (AES). This multilayer technique secures data
    in substantially less time and with significantly higher effectiveness. Our independent
    model ME-AES has conducted studies demonstrating that this threat is far more
    serious and devastating than previously anticipated. This is due to the operating
    system’s functionality, the capabilities of the digital assistant, and the proximity
    of other IoT devices. The proposed model attains the optimal outcome, achieving
    an overall accuracy of 98.45% in predicting whether a user will belong to a specific
    group. We will pay more attention in the future to establishing the best effective
    technique for handling fuzzy queries and diverse keyword searches.


