  md: 'various applications [5]. The advantages of BC technology are decentralization,
    traceability, tamper-proof status, transparency, scalability, and immutability,
    which can resolve the security challenges of media data [6–7]. Each record contains
    a hash value stored in a BC environment, which helps to enhance better security
    in terms of media applications. The current generation of BC systems has been
    widely used in various applications such as Industry 4.0, cryptocurrency, the
    Internet of Things (IoT), information security, data provenance, 5G wireless network,
    healthcare, and the finance industry [8–10]. According to the market analysis
    report, BC technology’s global market value was 10.02 billion dollars in 2022.
    BC technology is predicted to top 2022’s annual growth rate of 87.7% from 2023
    to 2030 [11]. In 2022, a global markets report [12] highlights that BC technology
    significantly improved the pharmaceutical industry. The initial stage of emerging
    BC technology and its development is shown in Figure 10.3.


    This first generation of BC technology was designed and developed for public channels,
    known as Blockchain 1.0. In the initial stage of BC technology, Bitcoin and Cryptocurrency
    are the two most popular cryptocurrencies that ensure transaction security [13].
    In 2013, the second phase of the BC system (Blockchain 2.0) was introduced with
    a smart contract to address the issue of mutual trust and user identity among
    participants [13]. Then the Hyperledger concept was employed in the BC system.
    It was associated with the smart contract to limit access to transactions to authorized
    participants [14].


    Therefore, watermarking with BC is a promising method to achieve image security
    for practical applications.


    The concept of watermarking with BC technology is outlined in Figure 10.4. First,
    the embedding procedure is employed to conceal confidential information inside
    a multimedia object of acceptable visual quality. A new transaction is created
    to store and upload the marked image, with its hash value on the BC framework,
    to enhance the additional security and authenticity.


