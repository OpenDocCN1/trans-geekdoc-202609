  md: '# Cancelable biometrics for fingerprint template protection


    Vivek Singh Baghel and Surya Prakash


    Indian Institute of Technology Indore, Indore, India


    # 14.1 INTRODUCTION


    Biometrics refers to the capability of recognizing an individual by means of physiological
    and behavioral characteristics. The physiological characteristics comprise fingerprint,
    face, ear, etc., whereas behavioral characteristics comprise gait, signature,
    voice, etc. These characteristics exhibit some distinct information for each individual,
    which is used to uniquely identify a person. In biometric systems, there are mainly
    two stages involved, viz., enrollment and verification or identification. At the
    time of enrollment, the biometric data of a person is collected, and a user template
    is constructed utilizing the distinct features present in a biometric trait. The
    computed user template is further stored in the database for verification and
    identification purposes. During the verification, the features extraction is performed
    to extract the features from the probe biometric image, and the user template
    is computed following the same procedure as followed during enrollment. Further,
    the generated probe template is compared/matched with the stored template to verify
    whether the probe user template is genuine or not. The difference between verification
    and identification is that one-to-one matching is performed for verification and
    one-to-many matching is performed for the identification stage.


    Fingerprint biometrics is one of the widely used physiological biometric traits.
    It has been utilized to provide secure authentication in numerous recognition
    applications. The fingerprint data of a person is very distinct, and it remains
    permanent and unique for the complete life span of an individual. In addition,
    fingerprint biometrics provide good recognition performance, and they are easy
    to capture and process as compared to other biometric characteristics. A fingerprint
    constitutes continuous patterns of ridges and valleys. These patterns exhibit
    unique features that distinguish a person’s identity from others. In fingerprint
    biometrics, feature extraction can be performed on three different levels [1],
    viz., global level, very-fine level, and local level. The ridge-flow represents
    a pattern of a fingerprint impression that wrapped around the singular points,
    and these patterns are considered'
  merge: -1
  img_proc: true
- pgno: 307
  md: 'as global-level features. In the second-level features, i.e., very-fine level
    features, intra-ridge information is detected that includes width, curvatures,
    dots, etc., of the ridges in the fingerprint image. A very notable feature is
    sweat pores, which are distinct for identifying an individual. In the third-level
    features, i.e., local level, various minute ridge characteristics are present
    in the fingerprint impression. These minute details are susceptible to changes
    in the quality of fingerprint images. Nevertheless, among these minutiae points
    are prominent feature points in a fingerprint image, and these mainly include
    ridge end and bifurcation points. The points where ridges abruptly end are called
    ridge ends, whereas the points where the ridges bifurcate into two different ridges
    are called bifurcation points. For example, Figure 14.1 depicts an instance of
    a fingerprint image combined with the presentation of minutiae and singular points.
    Minutiae points are found to be very stable and robust against the change in the
    quality of fingerprint impression. Therefore, minutiae points become a natural
    choice to be considered as unique features for the computation of user templates,
    as compared to other features. The computed user templates that mainly constitute
    minutiae information are further stored in the database for identification and
    verification purposes.


    Despite the security provided by a fingerprint authentication system to various
    resources and applications, the protection of the fingerprint user template present
    in the database is also essential, as the leakage of the stored template can cause
    the permanent identity theft of a person. Furthermore, it has been shown through
    various existing studies [2–4] from the literature that the fingerprint image
    reconstruction is feasible utilizing the stored template by employing reverse-engineering,
    if it is stolen by an adversary.


    ![](img/6e4271af21d9a195003ab8711aa79d27_307_0.png)


    Figure 14.1 Representation of various feature points in a fingerprint image.'
