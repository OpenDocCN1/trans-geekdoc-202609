    # 9.2 CTI LIFE CYCLE


    CTI is primarily a data-driven procedure. Similar to the rest of the data analysis
    process, organizational intelligence need is first examined in view of the current
    threat scenario, supervising the cyber assets, and developing potential attack
    vectors. Threat intelligence modeling is complex since threats are constantly
    developing and require rapid adaptation and timely response from enterprises.
    The CTI cycle allows a typical guideline for the analysts to effectively employ
    their resources and acclimatize the current threat landscape. The CTI life cycle
    is depicted in Figure 9.3.


    +   - **Phase 1: Intelligent Planning/Strategies:** In this phase of CTI life
    cycle, the roadmap for any specific threat intelligence operation is established.
    During this stage the stakeholders agree on the purpose, goals, targets, and the
    approach of their program associated with the enterprise policies. The approach
    is based on risk vertical, vulnerability estimation, identification of asset,
    demand simulation, etc.

    +   - **Phase 2: Data Collection/Aggregation:** In this stage of the CTI life
    cycle, the analytics gather the essential data to accomplish the specified'
