    Figure 8.2 Categorization of deepfake detection.


    approaches. Conventional approaches include methods that rely exclusively on the
    media asset under analysis and try to reveal anomalies, which may suggest the
    presence of a manipulation like lens distortion, noise patterns, compression artifacts.
    Whereas in machine learning and deep learning-based detection, features are extracted
    from the media such as facial landmarks [4], optical flow [5, 6], and texture
    analysis [7]. These features are then used to train a classifier to distinguish
    between real and fake videos. The benefit of approaches based on machine learning
    and deep learning is that there is a better grasp of the data and processes. Moreover,
    it is considerably easier to change model designs and tune hyperparameters.


    From a forensics perspective, deepfake detection techniques can be classified
    as explainable or black-box. Nowadays, the use of deep learning algorithms for
    deepfake detection has become a popular area of research, but the lack of transparency
    in these models has raised concerns about their reliability and accountability.
    Therefore, it is important to develop deepfake detection techniques that are not
    only effective but also explainable, so that the underlying decision-making process
    can be transparently understood by human experts. Explainability in deepfake detection
    refers to the ability to understand and interpret the reasoning behind a deepfake
    detection system’s decisions. It is a crucial aspect of deepfake detection as
    it helps establish trust and transparency in the system and enables human users
    to verify the accuracy of its outputs. Explainability also helps to identify any
    biases or errors in the deepfake detection system, which is important for ensuring
    that the system is reliable and trustworthy [8].


    Many deep learning solutions to detect deepfakes have been proposed before but
    with less focus on the explainability perspective. So, to address this issue in
    this chapter, an Explainable Artificial Intelligence (XAI) tool, Local Interpretable
    Model-Agnostic Explanations (LIME), has been used. To demonstrate the effectiveness
    of the use of XAI approaches in deepfake detection, various experiments are done
    on a sample taken from a popular dataset in this field, i.e., the Deepfake Detection
    Challenge (DFDC). Authors in [23] have also used LIME, but they worked on Face
    Forensics dataset and also did not use any pre-trained model comparisons for accuracy.
    Our proposed framework mentioned in Section 8.4 is quite different from that.'
