  md: '![](img/6e4271af21d9a195003ab8711aa79d27_57_0.png)


    Figure 3.1 A general message transfer schematics using key and cipher.


    The above process as summarized in Figure 3.1 requires the following assumptions:


    +   - plaintext/message m

    +   - key k for the sender Alice and key k′ for the receiver Bob

    +   - presence of a secure channel for key transfer

    +   - key k′ has be to be present with the receiver Bob prior to decryption of
    the message

    +   - keys k and k′ need not be same in general


    Traditional cipher-based systems come with multiple variations, the main type
    being the substitution cipher and transpositional ciphers.


    The substitution cipher simply substitutes the units of the plaintext with other
    characters. The transpositional cipher is a technique where the location of the
    units of plaintext are changed based on certain rules, i.e., transposition. This
    transposition can be based on another message.


    The key can be just a function to be applied to the alphabet of the plaintext/message,
    or the key itself can be another plaintext/message to be used in the transformation
    from message m to cipher c. If the key is a another plaintext/message used to
    transform the original message to cipher using transposition, it is called a key-based
    transposition; if the key is a mathematical operation used to achieve the transformation
    of plaintext/message m to cipher c, it is called a keyless transposition cipher.


    # 3.2.1 Asymmetric key encryption


    Most of the later advancements in the area of secure message transfer emerge from
    the diagram in Figure 3.1. Consider the keys k and k′; traditionally these two
    keys used to be the same. However, they need not be. Asymmetric Key Encryption
    uses two (or multiple different) keys. If the keys k and k′ are the same, the
    encryption algorithm is known as symmetric key encryption algorithm.'
