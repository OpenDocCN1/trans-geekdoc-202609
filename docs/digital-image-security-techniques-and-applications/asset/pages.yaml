  md: '# 3.3.4.6 Multi-qubit gates


    Multi-qubit gates are an extension of two-qubit gates. For example, a two-qubit
    C-NOT gate can be defined to have two control-qubits and one output qubit. Thus,
    the state of the output qubit will change only if the two control qubits are in
    |1⟩ state.


    # 3.3.5 Quantum circuit


    So far, we have used the term *quantum circuit* without properly introducing it,
    so we will do so here.


    According to IBM Quantum:


    > > A quantum circuit is an ordered sequence of quantum gates, measurements, and
    resets, all of which may be conditioned on and use data from real-time classical
    computation [26].


    A good example of a quantum circuit, which is also relevant to this chapter, is
    a Quantum teleportation circuit. A quantum teleportation circuit is the method
    by which a state of a qubit can be transferred from a sender (Alice) to a receiver
    (Bob) without violating the fundamentals of quantum mechanics.


    # 3.3.6 Quantum teleportation circuit


    First created in 1993 [27], the quantum teleportation circuit is one of the most
    important components of quantum cryptography. In order to implement quantum teleportation,
    the sender (Alice) and the receiver (Bob) need a third person (often called as
    Telamon) so as to enable them to have one qubit each from a entangled qubit pair.
    Both the sender (Alice) and the receiver (Bob) are required to do certain gate
    operations on their qubits and exchange certain information over a classical channel
    to receive the state of Alice’s qubit at Bob.


    +   **Step 1:** Suppose Alice is trying to send the state |ψ⟩ of her qubit q₀
    to Bob.

    +   **Step 2:** The third party (telemon) creates an entangled pair of qubits
    and gives one qubit (qₐ) to Alice and one qubit (q_b) to Bob.

    +   **Step 3:** Alice is required to apply a CX gate to qₐ with q₀ as the control
    qubit.

    +   **Step 4:** Alice is required to apply an H gate to q₀.

    +   **Step 5:** Alice is required to perform measurement of both her qubits and
    save the result in two classical bits, then send the two classical bits to Bob
    through a classical channel.

    +   **Step 6:** Now the receiver, Bob, who is receiving the qubits q_b, applies
    the gates as per Table 3.4.

    +   **Step 7:** After Step 6, Bob will have the state of his qubit same as |ψ₀⟩.'
