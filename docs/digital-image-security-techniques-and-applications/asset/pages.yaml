    scanning (89%), virus or malicious codes (9%), website defacements (2%), phishing
    (<1%), website intrusion and malware propagation (<1%), others (<1%) [4]. Cybersecurity
    techniques have primarily been used in the e-banking, multimedia, social media,
    e-commerce, defense, and e-healthcare industries [5]. Numerous security objectives
    can be pursued, including authentication (which is a necessary part of nonrepudiation),
    integrity (because information must continually change), confidentiality (to safeguard
    our private information), and availability (the information created and stored
    by an organization needs to be available to authorized entities). The proposed
    watermarking method uses encryption techniques, a Hénon map, and a Chaotic logistic
    map. For authentication, BRISK feature matching is used.


    The comparison of LWT with discrete wavelet transform (DWT) is shown in [1]. To
