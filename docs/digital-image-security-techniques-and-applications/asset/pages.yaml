    We will revisit these issues later in this chapter; but now let''s discuss—an
    introduction to Quantum Computing.


    # 3.3 QUANTUM COMPUTING PRIMER


    # 3.3.1 Emergence of quantum computing


    In 1955, physicist Richard Feynman proposed the idea of a quantum computer, a
    machine that could harness the quirks of quantum mechanics to solve certain problems
    faster than any traditional computer. For decades, physicists have worked on building
    such a device, but the challenges have been daunting. In recent years, however,
    several groups finally succeeded in constructing working prototypes. This has
    led to renewed interest in quantum computing from business and scientific communities
    alike [22].


    Quantum computing models are a relatively new development in the world of computing.
    Unlike classical computers, which rely on transistors to store information, quantum
    computers use qubits, loosely a quantum variation of bits, which can represent
    a 0, a 1, or any combination of the two. This allows quantum computers to solve
    certain problems much faster than classical computers. Three main defining features
    of quantum mechanics make quantum computing a different paradigm of computing.


    # 3.3.2 Quantum mechanics and quantum computing


    Quantum mechanics is the most accurate theory for understanding and predicting
    properties about the physical universe. Quantum interactions are quite unlike
    those experienced by people every day, but some defining principles can be described
    below:


    # 3.3.2.1 Wave-particle duality


    A quantum object generally has both wave like or particle status during its evolution;
    while measurements may give rise to one result depending on what is being measured
    (a measurement will either indicate particlesness or waveness). In a more succinct
    way, we need to invoke both the wave property and particle property of the system
    in a single experiment. Any single property of the object doesn’t exist until
    we observe it!


    # 3.3.2.2 Superposition


    Superposition is a quantum mechanical phenomenon that describes the state of an
    atom or particle that exists in more than one place simultaneously.'
  merge: -1
  img_proc: true
- pgno: 61
  md: 'In other words, it is a state of being in two or more places at the same time.
    The wave function for such superposed states is described by linear combinations
    with a complex coefficient of the “basis” states.


    # 3.3.2.3 Coherence


    Quantum coherence is a quantum phenomenon in which two or more quantum systems
    remain correlated even when they are separated by a distance. This correlation
    is maintained despite any noise or disturbances that may be present. In other
    words, the state of one system can influence the state of the other, even if they
    are not physically connected.


    Quantum coherence is thought to play a role in many quantum phenomena, including
    superpositions and entanglement. It is also considered to be an important resource
    for developing quantum computing and communication technologies.


    # 3.3.2.4 Entanglement


    Quantum entanglement is a phenomenon that occurs when two or more particles are
    closely linked in such a way that the state of one particle can instantaneously
    affect the state of the other, no matter how far apart they are. This strange
    connection seems to defy the laws of physics and has puzzled scientists for years.
    However, recent research has shown that quantum entanglement may help us unlock
    some of the mysteries of the universe, as well as perform faster using quantum
    computing.


    # 3.3.2.5 Measurement


    Quantum measurement is one of the most fundamental and mysterious aspects of quantum
    mechanics. In classical mechanics, a particle’s position, momentum, and energy
    are all well-defined quantities that can be measured with complete accuracy. In
    quantum mechanics, however, the act of measuring a particle changes its properties.
    This phenomenon is known as quantum uncertainty or indeterminacy as encapsulated
    in the Heisenberg Uncertainty Principle. However, once measurement of the quantum
    system is performed, the system, which might have been in superposition of multiple
    states, will collapse into one single state. The probability of the collapse of
    the quantum system into a particular state is given by the Born rule [23].


    There are a number of interpretations of quantum mechanics, and scientists still
    don’t agree on exactly what it all means; all the phenomena mentioned above are
    still an open and active area of research in terms of their applications as well
    as interpretation.


    There are several different quantum computing models currently in use, each with
    its own advantages and disadvantages.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 3.3.3 Continuous Variable Quantum Computing (CVQC)


    CVQCs are different from classical quantum computers in that they use a continuous
    range of qubits, called Qumodes instead of discrete qubits. This makes the system
    smaller and more efficient, and allows for more accurate simulation of physical
    systems. CVQCs have already been used to model molecules and simulate optical
    processes, and there is potential for further application in areas like drug discovery,
    machine learning, and data security.


    The development of CVQCs is still in its early stages, but it holds much promise
    for the future of quantum computing.


    # 3.3.4 Gate-based quantum computing


    This is the usual and most heard of model of quantum computing, i.e., the discrete
    valued qubit-based model. It is called the gate-based model, as the inputs to
    the quantum system, also called “quantum circuits,” are generally (not always)
    modeled as the qubit states, and then these qubit states are transformed using
    different “gates,” as we describe later, so as to reach the solution to the problem
    we want the quantum circuit to solve [24].


    # 3.3.4.1 Qubits


    A qubit (or quantum bit) is the fundamental unit of quantum information. A qubit
    is the quantum mechanical analogue of a classical bit. In classical computing
    the information is encoded in bits, where each bit can have the value zero or
    one. Qubit can represent a zero or a one or a linear combination of the two simultaneously.
    A qubit is a two-level quantum system where the two basis qubit states are usually
    written as |0⟩ and |1⟩. Here, the right-angled bracket is ket, and it represents
    a column vector. This is unlike a classical bit, which can exist in only one state
    at a time. As already explained, this is known as superposition.


    A multi-qubit system is denoted by the tensor product of each individual qubit
    state.


    # 3.3.4.2 Bloch sphere representation


    As noted in the previous subsection, the qubit can be in a state of superposition
    of |0⟩ and |1⟩. This state of the qubit, known as statevector and conventionally
    represented as |ψ⟩, can be written as Eq. 3.1:


    |ψ⟩ = c₀|0⟩ + c₁|1⟩,  (3.1)


    where,


    |0⟩ = [1;0], |1⟩ = [0;1],


    ||c₀||² + ||c₁||² = 1, and c₀, c₁ ∈ ℂ  (3.2)'
