    \ <- Inverse_NSCT (out_FL, out_FH);\nreturn out_Fus\n```\n\n# ALGORITHM 2: NSCT-HD-MSVD-based\
    \ Embedding Procedure\n\n```\nInput: in_Cov, out_Fus, α\nOutput: out_Cov\nBegin\n\
    Step 1: Subsampling of fused image and calculating entropy of each component\n\
    \  1. [c1, c2, c3, c4] <- Subsampling (in_Cov);\n  2. [e1, e2, e3, e4] <- Entropy\
    \ (c1, c2, c3, c4);\n  3. c_max <- Maximum (e1, e2, e3, e4);\nStep 2: Apply NSCT,\
    \ HD, and MSVD on c_max\n  4. c_nsct <- NSCT (c_max);\n  5. [cP, cH] <- HD (c_nsct\
