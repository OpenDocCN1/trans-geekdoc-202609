    the vehicle to make the right decisions [6]. Also, as per reports by Data Age
    2025, approximately more than 5 billion customers are presently interacting with
    data owing to extensive usage of social media services, among others, which is
    expected to increase up to 6 billion, i.e., about 75% of the global populace in
    2025. An enormous rise in worldwide data is again expected in 2025 from 33 zettabytes
    in 2018 to 175 zettabytes with a very significant contribution by IoT instruments
    in terms of data produced globally [7]. It is, therefore, not feasible to send
    all the data to the cloud for processing, as the network bandwidth is a bottleneck.
    Moreover, edge computing processes data efficiently at the edge for shorter response
    time by consuming less energy as compared to cloud technology.


