    # 15.1.2 Security measures of medical data


    Extensive research and development efforts have been dedicated to designing and
    studying various traditional and modern AI schemes with the objective of ensuring
    sensitive data security. In the context of health care organizations, several
    traditional security measures can be employed to safeguard sensitive data. These
    measures include:


    +   - **Access Control:** Access control mechanisms limit access to medical data
    to authorized personnel only. This can be done by implementing role-based access
    control, where users are assigned access privileges based on their job responsibilities.

    +   - **Authentication:** Authentication mechanisms such as passwords, biometrics,
    or smart cards can be used to ensure that only authorized personnel are accessing
    the medical data.

    +   - **Encryption:** Encryption is the process of converting data into a code
    or cipher to prevent unauthorized access. Medical data can be encrypted when stored,
    transferred, or accessed, making it difficult for unauthorized users to understand.

    +   - **Information Hiding:** Information hiding techniques are used to protect
    secret data inside the cover image or video. It also provides content authentication,
    data ownership verification, and copyright protection. Watermarking and steganography
    also come under this scheme.'
