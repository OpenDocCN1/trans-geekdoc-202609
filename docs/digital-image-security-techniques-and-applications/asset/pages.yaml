    When converted to little-endian format, the four ciphertext words result in the
    16-byte sequence c0, ..., c15.


    ```

    c_i = [ C_{⌊i/4⌋} / 2^{8(i mod 4)} ] mod 2^8 i = 0, ..., 15 (13.9)

    ```


    # 13.3.7.1 The function F


    F recursively permutes 64-bit data based on a key. This function takes R0, R1,
    and the round integer r to choose subkeys. They are required for operation. T0
    is obtained by passing R0 through g. After shifting R1 to the left by 8 bits to
    generate T1, the g function is applied to the newly generated value. After T0
    and T1 are merged, two extra terms from the extended key are added to the Pseudo-Hadamard
    Transform (PHT).


    ```

    T0 = g(R0) (13.10)

    T1 = g(ROL(R1,8)) (13.11)

    F0 = (T0 + T1 + K_{2r+8}) mod 2^{32} (13.12)

    F1 = (T0 + 2T1 + K_{2r+9}) mod 2^{32} (13.13)

    ```


    F-result is represented as (F0, F1). In addition to F0, which we define above,
    the analysis will make use of F0. Unlike the F function, the F0 function does
    not include whatever key in its output.


    # 13.3.7.2 The function g


    Twofish relies on g. The word X is divided into four bytes. Each byte is processed
    by its own key-dependent S-box. Each S-box can take an 8-bit'
