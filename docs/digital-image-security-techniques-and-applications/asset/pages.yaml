    # Compromise Indicators (CIs):


    CIs are usually defined as the artifacts that provide real evidence of a breach
    of system security of organizations with high assurance. The patterns that allow
    exposure of suspicious or malicious actions in cyber domains are mostly described
    as CIs and mostly include malicious IP addresses, domain names, email IDs, proxies,
    etc., with some derived indicators such as hash values. Finally, false and malicious
    activities are reported to detect alarming situations. However, taking any initiative
    in the detected CIs is questionable and depends on the use cases available. On
    the other hand, according to Tounsi et al. [17], it is important to take immediate
    action and automatically insert it into IDS. Moreover, CIs are more reactive than
    proactive, because if any CI is identified, it means the system is already infected.
    In another opinion by Rhoades [18], CIs are not dependable enough to rely on to
    detect any complicated suspicious adversarial activity. It is also stated that
    CIs are too simple to ensure any system attack by an adversary if does not have
    any previously existing CIs whose pattern can be matched for attack identification.
    According to'
