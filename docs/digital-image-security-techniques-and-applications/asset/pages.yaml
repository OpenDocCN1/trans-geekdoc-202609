    # 2.3 QUANTUM COMPUTING


    A quantum computer is a device that uses quantum bits or qubits instead of bits
    as with classical computers. The qubits are realized physically in multiple ways
    such as using the quantum state of fundamental particles such as electrons or
    light particles (photons). These particles have the quantum state that exhibits
    the properties of like spin that can be used to define a two-state quantum system
    with one and zero, very much in the same way as in classical computers. Thus,
    qubits are the quantum analogue of the classical bits. However, quantum computing
    differs significantly from conventional computing on a basic level [21].


    Quantum properties such as the Entanglement and Superposition play a fundamental
    role in the quantum computer. Under Superposition, two states can coexist at the
    same time for a quantum system [22]. In superposition, a linear combination of
    basis states with normalized coefficients exists, which is a probability distribution
    of the pure states. The superposition is an inherent property of a quantum system
    [23].


    Under Entanglement, if two qubits are under entanglement, then the two qubits
    have no individual description of state. They can''t be described individually.
    In fact, measuring one qubit will give the state of the other one as well.'
