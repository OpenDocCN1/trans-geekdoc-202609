- pgno: 13
  md: '# COVID-19 electronic health data security for smart hospitals


    Ashima Anand


    Thapar Institute of Engineering and Technology, Patiala, India


    Amit Kumar Singh


    NIT Patna, Patna, India


    Huiyu Zhou


    University of Leicester, Leicester, United Kingdom


    # 1.1 INTRODUCTION


    COVID-19 was a devastating pandemic, and its variants infected millions worldwide
    within only a few days [1]. Large volumes of medical data, called electronic health
    data (EHD), were collected and transmitted among healthcare professionals and
    hospitals to combat the pandemic by ensuring accurate diagnosis. According to
    the report [2], the size of the digital healthcare market was USD 96.5 billion
    in 2020. It is expected to reach USD 295.4 billion in 2028, with a compound annual
    growth rate of about 15%. Also, post-COVID, a remarkable growth of 14.2% in digital
    healthcare market was seen in 2021, owing to the increase in demand of digital
    healthcare solutions [2]. However, the exchange of data, specifically digital
    medical records, led to a significant increase in the unauthorized access and
    illegal distribution of such confidential data [3].


    Therefore, it is important to study the authenticity and the copy-protection of
    the electronic version of patient data.


    Watermarking algorithms are recommended cost-effective solutions to guarantee
    the security of EHD. In watermarking, different kinds of secret mark(s) are imperceptibly
    inserted into media to maintain their security [3,4]. In addition, save bandwidth
    and storage demands, efficient archiving, and fast retrieval are other advantages
    of watermarking in medical domain. Researchers have developed various watermarking
    algorithms based on image fusion to manage security with high diagnostic accuracy
    [5–7]. There are still certain issues related to maintaining a proper balance
    between robustness and invisibility; however, security analyses of some algorithms
    are inadequate.


    Recently, image fusion-based watermarking has been developed for better diagnostic
    accuracy with high security of the digital records in the healthcare domain [5–7].'
  merge: -1
  img_proc: true
- pgno: 14
  md: 'By using the COVID-19 patient image as a mark carrier, this paper develops
    a secure watermarking algorithm using encryption and medical image fusion that
    can offer an excellent balance among the watermark robustness and invisibility.
    In our proposed algorithm, we first obtain the fused image as watermark by applying
    NSCT on the CT scan and MRI image. Then, the combination of NSCT, HD, and MSVD
    is employed to conceal the fused mark image into the carrier media. Finally, an
    encryption scheme is utilized to encrypt the final marked image before being circulated
    online. The major contributions of this work include:


    +   1. The proposed algorithm uses NSCT to fuse the CT scan and MRI images. The
    fused image is considered as mark image, which is useful for better clinical experience.

    +   2. The combination of NSCT, HD, and MSVD is employed to conceal the fused
    image within the carrier image. The combination of these transforms enhances the
    watermark robustness and invisibility at low cost [8, 9].

    +   3. The marked image is further encrypted using modernized stereo image encryption,
    which is useful for enhancing the security of the media data [10].


    The rest of the chapter is divided into the following segments: Section 1.2 discusses
    the recent advances in watermarking-encryption-fusion-based methods, followed
    by a detailed explanation of the preliminary concepts in Section 1.3. The proposed
    methodology is presented in Section 1.4. Section 1.5 is a detailed discussion
    of the experimental results, and the chapter is summarized in Section 1.6.


    # 1.2 LITERATURE SURVEY


    A review of several related watermarking methods using fusion and encryption is
    presented in this section.


    Hemdan developed a robust watermarking approach using the fused image as the watermark
    [5]. The fused image is scrambled using the Arnold and chaotic methods and then
    concealed via the discrete wavelet transform (DWT)-singular value decomposition
    (SVD)-based marking technique. Further, a robust and secure fusion-based watermarking
    method for medical images is developed by the authors of Ref. [6]. It implemented
    a hybrid of transform and spatial domain to improve the robustness, along with
    increasing the message payload. Finally, an advanced encryption using DNA, chaotic
    map, and hash function is used to secure the marked image. Another fusion-based
    watermarking framework is proposed by the authors of Ref. [7] to secure the digital
    healthcare records. It applies NSST-based fusion on'
  merge: -1
  img_proc: true
- pgno: 15
  md: 'a CT scan and MRI image. The fused image is then concealed with the MAC address
    of the sender’s system and image mark using a combination of DWT, Fisher-Yates
    permutation, firefly optimization, and dual tree complex wavelet transform (DTCWT)-SVD.
    Also, the patient’s report is hidden in the marked image for better embedding
    payload, maintaining high visual quality. Finally, the marked image is secured
    using a low-cost encryption method. Compared with other schemes [11–13], this
    framework provides a better solution to ensure higher security for privacy preservation.


    Singh et al. developed a secure watermarking model for copyright protection of
    digital images [14]. Initially, a series of transforms including lifting wavelet
    transform (LWT), Hessenberg decomposition (HD), and randomized SVD (RSVD) is applied
    on the carrier image. Further, the mark is concealed inside the singular values
    of the carrier image using a suitable embedding factor. Finally, the marked image
    is encrypted and then compressed for secure transmission with reduced bandwidth
    demand. During extraction, a convolutional neural network (CNN)-based denoising
    model is applied on the extracted mark for improved robustness. Anand et al. proposed
    a secure watermarking method to authenticate the digital healthcare records [15].
    The proposed work implemented wavelet-based watermarking to generate a dual watermark
    by hiding the encoded MAC address into the mark image. The generated mark is hidden
    in the IWT-Schur-RSVD coefficients of the carrier image using an optimized scaling
    factor. Fuzzy inference system is used to maintain a balance between robustness
    and visual quality by computing the optimal value of the scaling factor. In the
    final stage, chaotic encryption is used to cipher the marked image to improve
    security while transmitting over the open network. A blind watermarking method
    based on Diffie-Hellman and Number Theoretic Transform (NTT) is proposed by Soualmi
    et al. for protection of medical records [16]. Initially, the mark is encrypted
    using Diffie-Hellman for better security of this scheme. In the embedding phase,
    the host image is transformed using NTT, and the resultant coefficients are altered
    to embed the encrypted mark. The performance of this scheme offers better computational
    complexity and visual quality in comparison to many existing methods.


    Yan et al. developed a multiple watermarking technique to verify the integrity
    and authenticity of the digital medical content [17]. The proposed work blended
    watermarking with encryption and compression for better security and compression
    performance. An encrypted image mark is hidden in the ROI of the carrier image
    using fragile watermarking. Further, a compressed text mark is placed in the RONI
    using DWT-SVD and brain storm optimization (BSO) to improve invisibility and robustness.
    The robustness analysis of this work inferred better results when compared with
    similar techniques [15, 18, 19]. A blind and robust watermarking method for medical
    applications is presented by Nguyen-Thanh and Le-Tien [20]. The authors transformed
    the cover image using Scale Invariant Feature Transform'
  merge: -1
  img_proc: true
- pgno: 16
  md: '(SIFT) and applied even-odd quantization to conceal the secret information.
    Further, the security is improved by using a key-based embedding and extraction
    process. Another robust watermarking-encryption-based framework for e-health applications
    is presented by Soualmi et al. [21]. In the pre-processing stage, both the cover
    and image mark are ciphered by XORing with chaotic sequence. Further, the cyphered
    mark is hidden in the Schur coefficient of the encrypted host image. At the receiver
    end, the mark is blindly extracted from the received image. The proposed work
    focused on high security; however, the embedding capacity can be further improved.


    Vaidya proposed a robust watermarking solution for healthcare records in wavelet
    domain [22]. Initially, two-level decomposition using LWT and DWT is applied on
    the host image. Further, the high frequency coefficient of the host image is altered
    using adaptive scaling factors to conceal the fingerprint image. The adaptive
    scaling factors are computed using Local Binary Pattern, which ensures high robustness
    with minimum visual distortion. The author also enhanced the security by encrypting
    the marked image using Arnold transform.


    # 1.3 PRELIMINARY CONCEPTS


    # 1.3.1 Non-Subsampled Contourlet Transform (NSCT)


    Although wavelet transforms offer multiresolution and spatio-frequency properties,
    these transforms suffer from the issues of poor directionality, shift variance,
    and poor capturing of edge information [23]. To overcome these issues, contourlet
    transform (CT) is used, having multiresolution and multidirectional properties.
    However, it uses up- and down-sampling processes, which cause a shift variant
    problem [23].


    Based on CT, NSCT is capable of efficient representation of any image with better
    directionality, with edge and smooth contour information. It holds shift invariant
    property, along with all the advantages of CT. The construction of NSCT includes
    the use of non-subsampled pyramid filter bank (NSPFB) and non-subsampled directional
    filter bank (NSDFB). NSPFB ensures multi-scalability, and NSDFB provides better
    directional information. Both filter banks eliminate the operation of up- and
    down-sampling, confirming shift invariant property [23].


    Initially, the input image is decomposed with NSPFB, which results in high- and
    low-pass sub-bands, with the same size of the input image. Further, NSPFB is applied
    on a low-pass coefficient to achieve multi-scalability. The result has ‘l+1’ count
    of sub-images, where ‘l’ represents the decomposition level. Here, ‘l’ is the
    count of high-pass coefficients, and the rest is the low-pass coefficient. The
    condition for perfect reconstruction is given as [24],


    Z_L(1)×R_L(1)+Z_H(1)×R_H(1)=1 (1.1)'
