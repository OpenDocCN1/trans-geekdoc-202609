- pgno: 308
  md: 'Therefore, it is necessary to protect the fingerprint user template before
    storing it in the database. The secure fingerprint template should be designed
    in a manner that the fingerprint reconstruction and even unauthorized access to
    the system are infeasible to perform utilizing the stolen fingerprint user template.


    To protect the fingerprint template, numerous template protection strategies have
    been presented in the literature. When we look into these approaches, the main
    concept of these methods is to store the transformed/ encrypted fingerprint template
    in the database in place of storing an original fingerprint template exhibiting
    the direct minutiae information. There are four important properties that need
    to be fulfilled by the designed fingerprint template protection approach, viz.,
    revocability (renewability), diversity (unlinkability), security, and recognition
    performance. In an attack scenario, revocability allows the replacement of a compromised/leaked
    template with an entirely new fingerprint template for the same person. To support
    the revocability property, a template protection technique should generate diverse
    or unlinkable templates for the same person; thus, a technique should exhibit
    the property of diversity. Further, it must be infeasible to perform any kind
    of attack and reverse engineering to perform the fingerprint reconstruction from
    the secure fingerprint template; hence, the developed technique should provide
    a high level of protection. Lastly, the performance of the designed fingerprint
    system must not be degraded even after performing the transformation or encryption.


    Furthermore, the methods utilized to protect fingerprint templates can be roughly
    divided into four types, viz., biometric cryptosystems [5, 6], homomorphic encryption
    [7], cancelable biometrics [8, 9], and hybrid approaches. Biometric cryptosystems
    make use of cryptographic keys and the concept of cryptography to secure the fingerprint
    template. In the second category, homomorphic encryption is utilized to secure
    fingerprint templates. In contrast to both categories, cancelable biometrics utilize
    invertible and non-invertible transformation of fingerprint features to compute
    the secure template. A user-defined keyset is usually used as transformation parameters
    in cancelable biometrics. In the fourth category, approaches that combine functionalities
    of more than one category have been explored. In the literature, approaches based
    on cancelable biometrics are extensively discussed template protection approaches.
    The reason is the high-level security of these approaches, along with the high
    performance of the designed system as compared to other categories of template
    protection approaches. In addition, there are many opportunities in cancelable
    biometrics for further developing effective and robust template protection approaches.
    Therefore, considering the significance of cancelable biometrics in fingerprint
    template protection research, this chapter provides a detailed discussion of cancelable
    biometrics, along with a few existing techniques related to cancelable biometrics.
    The discussion on existing techniques provides a comprehensive understanding of
    presented approaches, along with their result analysis'
  merge: -1
  img_proc: true
