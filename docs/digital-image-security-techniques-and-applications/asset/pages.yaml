  md: 'Processing cost, or the computational overheads involved in inserting and detecting
    the watermark, is another problem. The creation of a common strategy for all digital
    media that is resilient to different attacks is another issue. The proposed work
    overcomes all the above-mentioned problems. With the use of Hénon map, chaotic
    logistic encryption, and BRSIK feature authentication, an effective watermarking
    strategy to address the research gaps identified by the overview of the existing
    strategies stated above is presented.


    The main features of the technique proposed in this chapter are listed below:


    +   (1) The diagonal components of the upper triangular matrix resulting from
    the QR decomposed image have a better degree of significance because they are
    used for embedding.

    +   (2) The security of the proposed watermarking approach is further strengthened
    by use of the dual watermark images, which offers better robustness against malicious
    attacks.

    +   (3) A chaotic logistic map is used to transmit the watermarked image securely,
    which ensures better transmission.

    +   (4) Hénon map is used to encrypt the sub-band, which is used for embedding
    dual watermark images, which enhance the security of details of the patient used
    as a watermark image providing better medical treatment.

    +   (5) In this proposed work, we have achieved feature verification using BRISK,
    which facilitates copyright protection in a better way against unwanted attacks.


    The remainder of the chapter is structured as follows: Section 5.2 provides a
    detail of preliminaries. The embedding and extraction process for watermarks is
    described in Section 5.3. In Section 5.4, the discussion and simulation findings
    are mentioned. Section 5.5 discusses BRISK feature matching. Section 5.6 contains
    the comparison of results, and the Conclusion is in Section 5.7.


    # 5.2 PRELIMINARIES


    # 5.2.1 Lifting wavelet transform


    LWT is the second generation transform faster than DWT [1]. It has three main
    steps: Split, Predict, and Update [2, 18]. Split is used to bifurcate the signal
    into even and odd. Predict tries to foresee the odd signal with the help of even,
    and vice versa, and the last step is Updating. In 1998, Sweldens [19] developed
    the lifting wavelet transform. Figure 5.2 shows the schematic diagram of LWT.'
