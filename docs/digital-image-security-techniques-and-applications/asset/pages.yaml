  md: '# b) Learning at Edge using ML and DL Techniques for Real-Time Analysis


    Using a deep neural network (DNN), a cutting-edge Machine Learning technique model
    that outperforms the traditional approaches has lately been used for a variety
    of multimedia data processing problems. Therefore, the edge computing system must
    analyze gathered multimedia data effectively to deploy unique multimedia data
    analysis methods with DNNs. Different compression and acceleration techniques
    have been created and developed to address this issue using DNNs [34, 35, 37].


    +   - DNNs are a perfect solution to accelerate computations by optimizing various
    DMM operators and Artificial Neural Network (ANN) Architecture [34].

    +   - In addition, another advantage of DNN is that it facilitates Computational
    Offloading by permitting inferencing and training of data by partially offloading
    content to remote computing servers that fasten computations and reduce the load
    on the local devices. Distributed DNNs provide a way to group edge devices based
    on the computational tasks performed on them and accordingly distribute the load
    between these groups [34].

    +   - Federated Learning is another technique that helps to reduce concerns over
    data security and privacy problems [34, 35].

    +   - Deep Q-Learning and Reinforcement Learning (RL) accelerates smooth streaming
    of MM Data facilitating offloading and data compression [37]. Chang et al. proposed
    a Deep Q-Learning based model with a bandwidth sharing policy that optimizes data
    allocation so that users achieve satisfactory QoE while video streaming [38].
    Zhou et al. proposed MM segmentation using Deep Q-Learning. Park et al. also employed
