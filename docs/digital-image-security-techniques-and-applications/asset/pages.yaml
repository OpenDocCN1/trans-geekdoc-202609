  md: '# Securing digital images using HT-MSVD in wavelet domain


    Priyank Khare


    IIIT Ranchi, Ranchi, India


    Divyanshu Awasthi and Vinay Kumar Srivastava


    MNNIT Allahabad, Prayagraj, India


    # 6.1 INTRODUCTION


    Radical progress in technologies has made accessibility of multimedia data very
    convenient. The mutual exchange of confidential data becomes easy due to this
    process. So, confidentiality and protection from intruders is a prime goal, especially
    in images where manipulation is easily possible. This problem is rapidly increasing
    at an alarming rate, so researchers have focused their attention on providing
    secure information exchange.


    The remedy for resolving this severe concern is image watermarking in which confidential
    images are concealed in a cover image so that they become perceptually invisible
    to the human visual system [1, 2]. Visually watermarked and cover images should
    be similar. Further, this concealed watermark is retrieved by the legitimate user
    to ensure copyright protection. Visual similarity among images is signified with
    the aid of imperceptibility, whereas resilience of the scheme against attacks
    is highlighted through robustness. The main challenge is to concurrently maintain
    a trade-off between these two attributes while designing an effectual image watermarking
    technique [3, 4]. Typically, image watermarking is performed in either the spatial
    or transform domain. Transform domain watermarking proves to be better in robustness
    and imperceptibility. In contrast, hybrid image transforms watermarking is generally
    employed efficiently so that the features of different image transforms can be
    utilized.


    This chapter presents HT-RDWT-MSVD-based image watermarking for protecting digital
    images. This proposed technique efficiently uses attributes of each transform
    so that a proper balance is maintained among different characteristics of watermarking.
    Vital aspects of the proposed technique are presented below:


    +   - The reflectance component attained from HT [5, 6] of the cover image is
    preferred for watermark embedding, as it provides better robustness and perceptual
    invisibility to the technique.'
  merge: -1
  img_proc: true
- pgno: 129
  md: '+   - RDWT [7–9] provides excellent robustness in comparison to discrete wavelet
    transform (DWT), as it has shift invariance property, whereas capacity also increases
    with its usage.

    +   - MSVD [10, 11] offers better robustness to the scheme against geometric attacks
    compared to singular value decomposition (SVD), and thus, combining it with RDWT
    results in a robust watermarking technique.

    +   - Salient features of these transforms motivate us to propose an effective
    watermarking technique that aims to maximize the various features of watermarking.
    Hence, confidentiality of digital images is retained.


    The structure of the rest of the chapter is as follows: Section 6.2 comprises
    related works, Section 6.3 deals with the proposed watermarking scheme, and simulation
    results are investigated in Section 6.4. Section 6.5 states the Conclusion of
    this chapter.


    # 6.2 RELATED WORKS


    In [10], a multiple image watermarking (MIW) is reported in which non-subsampled
    contourlet transform (NSCT), discrete cosine transform (DCT), and MSVD are employed
    together. But this technique fails to deliver sufficient robustness and imperceptibility
    due to the non-directional property of DCT. An extended version of [10] is developed
    in [12], where robustness is slightly improved due to the usage of RDWT, but this
    scheme still does not provide satisfactory robustness against noise attacks. In
    [13], fusion of DCT-DWT is applied for watermark embedding. In this approach,
    the authors have chosen high-high (HH) subband as the embedding location due to
    which robustness yield is not up to the mark. Analysis against affine and image
    enhancement attacks is also missing.


    A neural network-based image watermarking is developed in [14], in which a watermark
    is embedded into the edges of the color host image. Contourlet transform is used
    for electing directions in which embedding can be performed. However, this scheme
    lacks security. A fragile watermarking using particle swarm bacterial foraging
    optimization (PSBFO) is investigated in [15], where RDWT-QR transforms are applied
    concurrently. This technique provides authenticity against tamper detection for
    vital medical images.


    A DWT-SVD watermarking scheme [16] is proposed in which encryption-compression
    is concurrently applied to the watermarked image. In this methodology, the watermark
    image, along with the text watermark, is concurrently embedded in the desired
    subbands of host image. Encryption is performed using chaotic and hyper-chaotic
    mapping. The proposed scheme seems to be effective, but it appears to offer weak
    robustness against affine transformations. Non-subsampled shearlet transform (NSST)-MSVD
    [17] watermarking algorithm is developed in which embedding of the watermark'
  merge: -1
