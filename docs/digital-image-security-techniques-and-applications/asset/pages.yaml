  img_proc: true
- pgno: 56
  md: 'The main points of this chapter are:


    +   1. An introduction to classical data security protocols for image security
    with comparison based on existing literature.

    +   2. An introduction to the basics of quantum computing.

    +   3. A friendly introduction to quantum cryptography protocols; may serve as
    a reference for the research community engaged in classical methods.

    +   4. A detailed survey of multiple methods that may be suitable to take on challenges
    offered by the quantum computing field, dispelling many myths and unfounded notions.

    +   5. The novelty over the existing literature is the collection of comments
    on each of these methods from the perspective of image security in a post-quantum
    setting.

    +   6. The most significant topic of this chapter is presenting a comprehensive
    survey, as well as an evaluation of multiple methods relevant in a post-quantum
    setting—along with a comprehensive straightforward discussion of the basics of
    quantum computing and classical security methods for the practitioner of classical
    image security.


    # 3.2 CLASSICAL IMAGE SECURITY


    Before embarking on the description of image security methods, we begin with the
    classical data security paradigm. The term/techniques/methods of image security
    are not fundamentally different from standard data security techniques; however,
    we should not forget that the 2-dimensional data (image) presents its own structures
    and peculiarities for the purposes of security.


    Classical data security can be divided into two parts: physical security and encryption.
    Physical security is simply keeping the information under lock and key and hoping
    that no one can find where the information is kept—or even if they do, they won’t
    be able to locate the key. This was quite cumbersome, as it was often required
    to transmit the information from place to place. A better and more reliable scheme
    of data security was required, and thus ciphers were invented.


    Ciphers are akin to lock and key in motion [6]. Ciphers were produced simply by
    applying a transformation, denoted by a crossed circle in Figure 3.1, to the alphabets
    of the message (in literature, a message required to be secured has been called
    plaintext) using a “key” turning the message into cipher or cipher code (cipher
    means zero in Arabic). The sender would have the key in advance and apply the
    inverse transformation on the message to recover its true contents. It is said
    Roman emperor Julius Caesar was a pioneer of ciphers. The army maintained by Caeser
    used ciphers extensively.'
