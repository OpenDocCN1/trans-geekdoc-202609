    Homomorphic Encryption: AI can be used to implement homomorphic encryption, which
    allows data to be encrypted while still being processed. This allows for sensitive
    medical data to be securely analyzed without the need to decrypt it first.


    Data Masking: AI can be used to mask sensitive data in medical records, such as
    names and addresses, while still allowing for other useful information to be analyzed.
    This can be done through techniques such as tokenization or hashing.


    Natural Language Processing (NLP): AI can be used to develop NLP models that can
    scan medical documents for sensitive information such as patient names or addresses
    and redact or remove such information automatically.


    Federated Learning: Federated learning is another paradigm that allows multiple
    clients to train AI models securely without sharing sensitive data with other
    participants [2, 17].


    Advanced AI Models: Instead of sharing original data for model training, artificial
    data can be created and translated from one medical domain to another by cyclic
    GAN and can be further utilized for knowledge distillation purposes [18].


    Optimal Key Generation for Data Encryption: By utilizing CI with appropriate objective
    functions, random and optimal keys can be generated, which are less vulnerable
    to attackers due to the high search space of the key. It can be utilized for encryption
    purposes. They can be further extended to information hiding.


    Overall, AI can be an effective tool to preserve medical data privacy. However,
    it is important to ensure that AI systems are secure and are implemented in accordance
    with privacy regulations and best practices to prevent the misuse of sensitive
    data.


    # 15.2 OVERVIEW OF CI


    CI is a dynamic field encompassing the theory, design, development, and application
    of computational paradigms inspired by biological and linguistic processes. Neural
    Networks [19], Fuzzy systems [20], and EC [6] have traditionally been considered
    the three primary pillars of CI. These paradigms are designed to emulate the behavior
    of natural intelligence and provide powerful tools for solving complex problems
    in a wide range of domains, including machine learning, robotics, data analytics,
    and optimization. By harnessing the power of CI, researchers and practitioners
    can develop novel algorithms and models that can learn, adapt, and evolve in response
    to changing environments and data inputs, leading to new insights'
  merge: -1
  img_proc: true
- pgno: 336
  md: 'and discoveries that can benefit society as a whole. Among all these, our primary
    focus is on EC.


    # 15.2.1 Evolutionary computation


    EC is an exciting subfield of AI that draws inspiration from biological evolution
    and natural events performed by organisms. By modeling the principles of evolution,
    EC methods aim to solve complex optimization problems efficiently. The primary
    goal of EC is to create novel computing methods that mimic natural intelligence
    discovered in physical, chemical, and biological systems. Unlike other optimization
    techniques, EC methods have been proven effective as a global optimization method
    for multiple problems. EC methods are population-based approaches that generate
    a random initial population and utilize variation operators, such as mutation
    and crossover, to create the next population or offspring. The natural selection
    process is then used to refine the population for the next generation. By following
    these steps, EC methods mimic the process of natural selection to create increasingly
    better solutions to the optimization problem at hand.


    EC has a rich history dating back to the 1960s when researchers proposed Genetic
    Algorithms (GA), Genetic Programming (GP), and Evolution Strategies (ES) to solve
    global optimization problems [21]. Since then, other methods such as Differential
    Evolution and Estimation Distribution Algorithms have been developed, all falling
    under the umbrella of evolutionary algorithms. In the 1990s, researchers also
    explored the simulation of natural intelligent phenomena of ants and swarms to
    create optimization methods, giving rise to the field of Swarm Intelligence [22].
    GDWCNPSO [3], QL-SSA [7], MDO [23], and Golden Jackle optimization [24] are a
    few recent developments in this category. These methods are all subclasses of
    EC [25] and have greatly expanded the scope of EC. EC algorithms are particularly
    well-suited to non-convex and black-box optimization problems where the mathematical
    form of the objective function is not known. The mutation and crossover operations
    are based on guided randomness, and the method, as a whole, typically does not
    require any gradient knowledge about the objective function being optimized. Their
    derivative-free nature makes them a popular choice for solving challenging problems.
    Due to the versatility of EC methods, they have become the center of attention
    in the optimization field and have led to numerous innovations. These techniques
    are also effective for solving multi- and many-objective optimization issues.
    A broad overview of these intelligent optimization methods is presented in Figure
    15.3. Further, different subclasses are shown in Figure 15.4.


    Overall, EC is an innovative approach to solving complex optimization problems
    that draws inspiration from biological evolution. Its population-based characteristics
    and natural selection processes make it a powerful tool for creating efficient
    algorithms that can adapt to changing environments. With ongoing research and
    development, the potential for EC to solve increasingly complex problems continues
    to expand.'
