    # 9.4 NEXT-GENERATION THREATS


    Next-generation cyberattacks are normally multi-directional and multi-folded.
    These threats are considered as multi-vectored because they use multiple means
    for propagating themselves like web applications, emails, chats, etc., whereas
    this is considered as multi-folded because it can penetrate networks and eventually
    exfiltrate the important information. Alternatively, next-generation cyber breach
    attackers are equipped with the newest zero-day vulnerabilities, as well as social
    engineering practice. Sophisticated strategies (polymorphic risks and complex
    risks) are applied that are modified in order to appear unknown to signature-based
    tools and yet genuine enough to avoid spam filters. A comprehensive taxonomy study
    of the advanced threat landscape in cyber was performed by European Union Agency
    for Network and Information Security (ENISA) in 2017. The below-mentioned threats
    are discussed in the ENISA report [17].


    +   - Advanced Persistent Threats (APT): One perfect example of multi-vectored
    and multi-folded threats is APT, which is defined as sophisticated network attacks
    in which any attacker continues attempting breach until he gains access to the
    network and remains hidden for a long period of time. The primary intention of
    this attack is to steal crucial data instead of causing any harm to the system.
    The intended enterprises for ATP are those sectors that deal with a huge volume
    of sensitive information like government agencies and monetary organizations.

    +   - Polymorphic Threats: This threat is a type of advanced cyber threat, like
    worms or Trojans, that can transform into a deadly one. Advancement of polymorphic
    threats may take place in diverse instances (e.g., alteration of the filename
    and compression of the files). Due to the evolution of polymorphic threats, it
    is almost impossible to identify by the signature-based defense system.

    +   - Zero-day Threats: These threats are widely unknown to an operating system
    or application. As the name suggests, the attack was initiated on “day zero,”
    which is previous to any public knowledge of the vulnerabilities. In certain circumstances,
    the vendor has previously acknowledged the susceptibilities; however, it has not
    exposed it widely since the vulnerability had not yet been patched. This attack
    is particularly effective, as it can be hidden for long periods and after detection,
    patching of the vulnerability requires days or even weeks.'
