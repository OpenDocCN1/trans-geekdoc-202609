  md: '# Post-quantum image security


    # Challenges and opportunities


    Ashish Arya

    Indian Institute of Information Technology, Sonepat, India


    Arti Ranjan

    IGDTUW, New Delhi, India


    Amrit Kumar Agrawal

    Sharda University, Greater Noida, India


    # 3.1 INTRODUCTION


    The security of communication has been a field of science and technology since
    the advent of electronic communications. The traditional methods of ensuring the
    security of communications were incapable of capturing the various aspects of
    electronic communications as both the message and encryption key were out in the
    open once it left the transmitter. Frequency hopping, channel encoding, etc.,
    were standard techniques of electronic communications [1, 2], but the invention
    of asymmetric key protocols added a new level of complexity to the paradigm [3].
    A rich theory developed after the rise of multimedia transfer through the internet,
    such as for image [4] and video data [5]. Now, as the revolution of Quantum Computing
    redefines the contours of communications security, especially image security,
    we are experiencing this emerging field as the next level of abstraction and complexity
    in the well-established field of communications security, which is eager to demolish
    existing notions and boundaries of what is possible and what is not.


    We begin this chapter with a discussion about classical data security, with special
    reference to image security. A brief introduction to symmetric and asymmetric
    key cryptography follows. Thereafter, we introduce basics of quantum computing—qubit/gate
    model of quantum computing. We describe quantum cryptography methods and connect
    them with the overall problem of image security. In this context, a few image
    representation models in the quantum computing system are also discussed. Subsequent
    to this, the emerging paradigm of post-quantum cryptography is discussed, along
    with its opportunities and challenges. The chapter concludes with a summary of
    the topics discussed and a comment on the current state and future trends of post-quantum
    image security.'
