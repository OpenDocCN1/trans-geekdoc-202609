    # 5.2.2 QR decomposition


    For an input matrix ‘M’ the QR decomposition [9] can be defined as:


    $[Q,R] = qr(M)$


    (5.1)


    In Eq. (5.1), $R$ is an $n\times k$ upper triangular matrix, and $Q$ is an $n\times
