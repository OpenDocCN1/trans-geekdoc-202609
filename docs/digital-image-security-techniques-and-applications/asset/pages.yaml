    computationally expensive, which can be a hindrance when processing large images.

    +   4. Insecurity due to Advanced Attack Techniques: Classical image security
    algorithms can be vulnerable to advanced attack techniques such as differential
    cryptanalysis and linear cryptanalysis.

    +   5. Prone to Key Exhaustion: Classical image security algorithms are prone
    to key exhaustion, which means that the same key is used for encrypting multiple
    images, which can lead to security issues.

    +   6. Limited Security Capabilities: Classical techniques are generally based
    on the assumption that it is computationally difficult to generate the key, i.e.,
    a brute force attack is difficult. Classical image security algorithms usually
    provide limited security capabilities and can be cracked using simple/specialized
    attack techniques.'
