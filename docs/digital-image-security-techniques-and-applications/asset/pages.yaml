    # 6.5 CONCLUSIONS


    This chapter presents a novel image watermarking technique that easily facilitates
    copyright protection of digital images. Fusion of HT-RDWT-MSVD transforms produces
    a better robust and imperceptible watermarking technique. Better imperceptibility
    is ensured by embedding the watermark in the reflectance component, whereas the
    usage of RDWT strengthens robustness. MSVD also provides indispensable aid in
    making the proposed scheme more imperceptible so that confidential information
    remains intact. Results demonstrate the presented work efficacy with other existing
    comparison methods. In the future, we would like to enhance the security of the
    presented'
