    # 4.1 INTRODUCTION


    Biometrics is a Greek term that generally refers to the biological, physical,
    and behavioral traits of people [1]. Biological biometric features are DNA, ECG,
    etc.; physical biometric features include face, ear, iris, fingerprint, and hand
    geometry; and behavioral biometrics features include signatures and gait pattern
    [2]. For the last two decades, personal identification was based on the knowledge-based
    (password, pin, etc.) or physical token-based (ID card, passport, etc.). The physical
    token may be stolen, lost, or exchanged while lengthy passwords/pins are hard
    to remember. Hence, personal biometric (human identity from his unique anatomical
    features) is used to overcome the issues stated above. Initially, the 2D biometric
    system, such as fingerprint and images, is used for personal identification. These
    2D biometrics have simple processing with less requirement of the hardware and
    a unimodal biometric framework (information obtained from the single source).
    Thus, 2D biometric systems have issues of commotion with sensitive information,
    intraclass varieties, etc. To solve the above-mentioned issues, multimodal biometrics
    are required.


    On the other hand, biometrics can be classified based on the touch-based and touchless.
    One of the most widely utilized touch-based biometrics today is the fingerprint.
    But, due to the advancement of technologies, hackers can imitate fingerprints
    to access crucial data. Furthermore, the fingerprint-based security system may
    experience issues whether it is raining, snowing, or humid outside. In addition,
    hardware quality deteriorates over time. Alongside touch-based, facial recognition
    is considered the leading contactless biometric. Although it has advantages over
    fingerprinting, it faces many challenges including lighting, change, and age [3–4].


    3D biometric systems have the following advantages over 1D and 2D biometric systems
    [5]:


    +   - Compared to 2D biometrics, 3D biometrics is far more resistant to changes
    in lighting and position.

    +   - For feature extraction, 3D data range may present a more comprehensive information
    source. Additionally, it may typically be integrated with 2D biometrics to improve
    system accuracy.'
