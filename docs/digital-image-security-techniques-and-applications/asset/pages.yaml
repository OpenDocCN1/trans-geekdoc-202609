  md: '# Watermarking with blockchain


    # A survey


    Om Prakash Singh

    Indian Institute of Information Technology, Bhagalpur, India


    Kedar Nath Singh

    Jaypee Institute of Information Technology, Noida UP, India


    Amit Kumar Singh

    NIT Patna, Patna, India


    Amrit Kumar Agrawal

    Sharda University, Greater Noida, India


    # 10.1 INTRODUCTION


    With the rapid growth of computer and communication technologies, it is possible
    to share multimedia data over the public network for medical diagnosis, research
    and development, defense, business analytics, and more [1]. Images provide more
    critical information than other media data, making them the content format of
    choice. Unfortunately, the leakage of image privacy information and copyright
    violation has become a fundamental problem [2]. Therefore, we urgently need to
    find solutions to protect multimedia data, especially image forms. Digital watermarking
    is one promising method to achieve image data security. Watermarking embeds a
    specific message—a watermark—into a carrier media with remarkable invisibility
    and robustness [3]. By extracting the embedded message from a marked media, we
    can verify the ownership of the media. In this case, marked media may be attacked
    before message recovery; the watermarking system should be robust against attacks
    for reliable ownership verification. The basic concept of the embedding and extraction
    process is outlined in Figure 10.1.


    Robustness, invisibility, and capacity are the basic requirements for watermarking
    systems. However, simultaneously obtaining satisfactory performance in basic requirements
