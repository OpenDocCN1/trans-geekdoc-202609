  md: '# Computational intelligence


    An optimization perspective for data privacy against adversaries


    Vandana Bharti

    Indian Institute of Technology, Dharwad, India


    Anshul Sharma and Amit Kumar Singh

    National Institute of Technology Patna, Patna, India


    # 15.1 INTRODUCTION


    Connectivity plays a pivotal role in the current landscape of smart services and
    digital communication trends, facilitating the rapid exchange of data across various
    communication channels. These data encompass diverse formats, ranging from text
    to video, collected and shared using multiple sensors. Within the health care
    domain, the utilization and sharing of image data are prevalent. However, these
    medical data sets contain private and sensitive patient information, necessitating
    robust measures to ensure protection against unauthorized access. With the increasing
    instances of data breaches, data security has emerged as a critical and challenging
    concern, particularly in industries like health care, where even minor alterations
    in data can lead to erroneous diagnoses and life-threatening consequences.


    To address these challenges, researchers from diverse fields, including Artificial
    Intelligence (AI), Cybersecurity, and optimization, are continuously striving
    to develop efficient solutions for data preservation [1–3]. Computational Intelligence
    (CI) has gained significant popularity in solving optimization problems characterized
    by varying complexities and natures, such as from convex to non-convex, unimodal
    to multi-modal, and single objective to multi-objective [4–7]. The inherent flexibility,
    randomization, derivative-free nature, and ability to handle tasks with incomplete
    information make optimization techniques well-suited for NP-hard problems.


    This chapter provides insights into the application of CI for maintaining data
    privacy. While encryption techniques have been widely employed in data privacy
    preservation, most existing methods are tailored for text data and reliant on
    specific keys. However, in health care, a significant portion of data comprises
    images, necessitating further modifications to encryption schemes to make them
    suitable for image data. Additionally, to enhance security, a shift from fixed
    secret keys, which are vulnerable to adversarial attacks, to an optimization-based
    approach for key generation is recommended.'
