    # 7.4.2 Simulation of edge computing with scalable peer-to-peer (P2P) networking


    In this section, we propose another solution with an objective to reduce download
    time of video streaming using the P2P networking concept in edge infrastructure.
    Edge infrastructure can capture the capabilities of P2P networking by integrating
    Content distribution networks (CDN) caching abilities with P2P system collaboration
    principles to deliver video streaming in real time, even in the case of momentary
    detachment from the cloud or edge structure [44].


    Individual peers’ end devices, such as mobile devices, servers, or other computing
    systems like laptops make up peer-to-peer (P2P) networks. The peers work together
    by sharing resources to fulfill one another’s requests and allows the client to
    download from the source as well as making other people also download the same
    file. P2P systems are frequently used for file sharing and downloading. This concept
    is pictorially presented in Figure 7.10 below.


    The simulation consists of downloading a video of about 208 MB using both normal
    and P2P download to demonstrate reduced download time using P2P in edge infrastructure.
    BitTorrent protocol has been used for P2P file sharing. The input source file
    is retrieved from https://www.youtube.com/watch?v=CSSKNCYaQUA.


    ![](img/6e4271af21d9a195003ab8711aa79d27_164_0.png)


    Figure 7.10 Peer-to-peer networking feature.'
