    # 14.7 CONCLUSION


    Due to the advantages in biometric recognition systems over traditional authentication
    systems—along with a surge in interest—there has been huge growth in the use of
    these systems in the wide variety of multi-functional applications. Meanwhile,
    an evident increase in the problem of identity theft has been seen, which is a
    great security concern regarding biometric recognition systems. In the biometric
    system based on fingerprint biometrics, usually, a user template containing the
    information of minutiae points is stored in the database. It has been quite evident
    from the studies presented in the literature that the fingerprint image reconstruction
    is feasible by means of the stored template if it is compromised by an adversary.
    Therefore, it is necessary to protect the original fingerprint data before storing
    it in the database. To protect the fingerprint template, numerous fingerprint
    template protection methods have been discussed in the literature. Among them,
    cancelable biometrics is one of the categories of fingerprint template protection
    that has been widely discussed as compared to the other categories. This chapter
    has provided a comprehensive understanding of the working of cancelable biometrics,
    including a brief discussion on recent developments in the area of cancelable
    biometrics to protect the fingerprint template. In addition, a detailed discussion
    of three of the recent approaches has been given. These approaches presented the
