  md: '# 13.4.2 Assessment criteria


    +   - True Positives (TP): An event that occurred and confirmed our predictions,
    including the actual yield. Another phrase for this is “good” consequences.

    +   - True Negatives (TN): A situation we expected to be untrue but whose actual
    outcome was likewise false.

    +   - Untrue Positives (FP): When a result was anticipated to be true but turned
    out to be untrue.

    +   - Untrue Negatives (FN): Situations in which the expected conclusion was false
    but the actual outcome was also true.


    Precision: This question is answered by dividing accurate predictions by accurate
    forecasts by the total number of accurate predictions.


    Precision = TP / (TP + FP)  (13.24)


    Recall: It is obtained by dividing the total number of conjugate samples by the
    number of correct positive outcomes (all samples that ought to have been identified
    as sure).


    Recall = TP / (TP + FN)  (13.25)


    F1-score: Computed by dividing conjugate samples by favorable results (all samples
    that ought to have been identified as sure).


    F1 - Score = 2TP / (2TP + FP + FN)  (13.26)


    Accuracy: It estimates the proportion of samples used to create the model that
    match to all accurate predictions.


    Accuracy = (TP + TN) / (TP + TN + FP + FN)  (13.27)


