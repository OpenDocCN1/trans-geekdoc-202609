  md: '# 8.4.1 Data pre-processing


    This sub-section discusses the dataset, its splitting into train, validation and
    test sets and finally the process of building a data pipeline for the models.


    # 8.4.1.1 Dataset


    The dataset used contains face images sized at 224x224 pixels extracted from Deepfake-Detection-Challenge
    (DFDC) [29] taken from Kaggle which is one of the benchmark datasets in this field
    for performance analysis of models on deepfake detection. A sample of the entire
    dataset consisting of 20,000 images was taken for prediction consisting of an
    equal proportion of fake and real images, a few of which are shown in Figure 8.5.


    # 8.4.1.2 Splitting


    The dataset was divided into train, test and validation sets. Out of 20,000 images,
    20% were kept as test set images and from the remaining 80% it was further split
    to train set and validation set in a ratio of 70% and 30%, respectively, as shown
    in Figure 8.6.


    # 8.4.1.3 Building a data pipeline


    Since the implementation was in Tensorflow, the common steps of building a data
    pipeline for Tensorflow were used, such as pre-process, shuffle, pre-fetch, taking
    batch size, i.e., 32 for the pre-trained models. API provided by Keras’ applications
    includes functions to prepare data in a way that a given model may expect.


