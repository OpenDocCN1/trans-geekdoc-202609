    # 12.1 INTRODUCTION


    The advent of digital cameras brought many advantages in terms of the number of
    images and videos users can take due to the digital nature of the information
    stored in electronic devices. On top of that, digital cameras are embedded into
    smartphones, making photo-shooting an easy task. Understandably, many digital
    photos are now available online and on social media. Along with digital cameras,
    several image-editing tools were brought into the market. User-friendly interfaces
    and easy-to-use functions allow users to change image contents effortlessly [1,
    2]. To quote Star Wars: “Twisted by the dark side, young Skywalker has become.
    The boy you trained, gone he is... Consumed by Darth Vader.” Powerful tools may
    twist the proper side of a story, which is in an image and intertwine it with
    unauthentic contents.


    Image tampering can significantly affect the trustworthiness of a digital image.
    When an image has been tampered with, it can no longer accurately represent the
    original scene or event. This can have severe consequences in a wide range of
    fields, such as law enforcement, journalism, and scientific research, where the
    integrity of an image is critical. Tampering can be used to hide or alter objects
    or information within the image, which can disseminate false or misleading information.
    This can sometimes lead to severe consequences, such as disseminating false information
    in news media or misidentifying suspects in criminal investigations [3].'
  merge: -1
  img_proc: true
- pgno: 260
  md: 'In addition, tampered images can negatively impact the credibility and trustworthiness
    of the person or organization that created or distributed the image. This can
    lead to lost credibility and mistrust in their work, which can have long-term
    consequences in many fields.


    Detecting image tampering is critical to maintaining the trustworthiness of digital
    images. Image forensics is a digital image processing field aiming to uncover
    any tampering or manipulation that may have occurred to an image [4]. Copy-move
    forgery (CMF) is one of the most common image-tampering techniques [5], where
    a portion of an image is copied and pasted elsewhere within the same image. This
    can be used to hide or alter objects within the image and can be difficult to
    detect without specialized techniques. Image alterations like CMF may change the
    semantic meaning of a given picture, undermining the reliability of digital images
    as proof. Other image tampering types, such as splicing and cloning, need to be
    mentioned, with the former being used to create a new image by combining two or
    more pictures [6]. Cloning is a process in which a portion of an image is copied
    and pasted elsewhere within the same image, but unlike copy-move forgery, it is
    used to hide or change the image''s original content [7]. In Figure 12.1,


    ![](img/6e4271af21d9a195003ab8711aa79d27_260_0.png)


    ![](img/6e4271af21d9a195003ab8711aa79d27_260_1.png)


    ![](img/6e4271af21d9a195003ab8711aa79d27_260_2.png)


    ![](img/6e4271af21d9a195003ab8711aa79d27_260_3.png)


    Figure 12.1 Some examples from the Copy-Move Forgery Dataset [8] are shown above;
    a) A portion of the image is copied and translated; b) the copy-moved region is
    graphically depicted with a binary mask; c) a region is copied, down-scaled, rotated,
    and pasted into another image area; d) the copy move forgery is shown in the binary
    mask.'
