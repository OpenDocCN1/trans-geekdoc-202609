  md: '![](img/6e4271af21d9a195003ab8711aa79d27_200_0.png)


    Figure 9.5 Indicators of compromise.


    The defenders must be aware of the actor of cyber threats and must also know the
    nature of the risks they are suffering from. They must be knowledgeable about
    the data fundamentals related to these cyber breaches, which is called Compromise
    Indicators (CIs). The defender must be informed of the threat actors and the nature
    of the attacks the organizations will face. They must also be aware of the fundamentals
    of data connected with the cyber threats. These data are referred to as indicators
    of compromise (IOC). IOC is considered as the enabler of the Intelligence production
    and is closely related to CTI. The internal data is fed to the analyzer of the
    relevant organizations, and finally, the actionable decision is recovered. IOC
    is classified into three diverse groups: Network indicators, Host-based indicators,
    and Email indicators as shown in Figure 9.5.


    +   - Network Indicators: These indicators are mostly located in domain names
    or URLs exploited for Command & Control (C&C) and Link-based malware surfing.
    It might be IP addresses required for attack detections from acknowledged compromised
    systems/servers, botnets,'
  merge: -1
  img_proc: true
- pgno: 201
  md: 'etc. Yet, the IOC has a short lifetime since the threat actors shift from one
    compromised server to another for getting hosting services from the cloud.


    +   - Host-based Indicators: These indicators are mostly located in the investigation
    of any infected machine. It might be names of the malware entice documents or
    hashed files. The most frequently used malware IOC are SHA-1 or MD5 hashes of
    binaries. One of the soft targets for Dynamic Link Libraries is the Windows operating
    system, as attackers may restore Windows system files to ensure that the payload
    is executed every time Windows is initialized. Most often, registry keys may be
    added by any malicious code for allowing persistent keys which are adapted in
    computer registry settings. This technique is common for creating Trojans.

    +   - Email indicators: These indicators are formed mostly when attackers use
    free email services to targeted organizations and individuals. These emails might
    be social engineering emails. The source address and subject of the mails appear
    to be of a recognized individual or organization, and the subject line must be
    of any intriguing current event highlighted and lured with featured links and
    attachments. X-originating and X-forwarding IP addresses are email headers categorizing
    the IP address of connecting mail servers, connecting web servers via a HTTP proxy
    server.


    # 9.6 FUNDAMENTAL CONCEPT OF INCIDENT RESPONSE


    The threat landscape is growing day by day, which is imposing additional skill,
    tools, intelligence, and defense policies to face them. Incident response (IR)
    is one of these approaches that can be incorporated to protect organizations from
    CTI. The key concept of each incident response format is briefly discussed here
    that allows categorization and assessment of each in this section. The basic concepts,
    categories, and supplementary capabilities are outlined in Table 9.1 with proper
    examples of IR. Essential requirements related to the core concepts are intended
    as supplementary capabilities, whereas earlier analyses of data formats in CTI
    are treated as diverse comparison criteria. We have emphasized core conceptual
    elements and incorporated the characterization and naming conventions. The incident
    response is a distinct area of identifying CTI and a completely novel and multi-fold
    concept. In this section we have categorized IR into four different building blocks,
    i.e., preliminary level concepts for fundamental understanding, structural level
    concepts for deeper understanding, technological level concepts for technical
    understanding, and finally, the security level concepts that are illustrated in
    Table 9.2. Each concept is described in Table 9.3 in short.'
  merge: -1
