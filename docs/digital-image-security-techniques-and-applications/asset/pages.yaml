  md: 'A two-qubit state will be an entangled state if the state cannot be represented
    as a product of states of the two individual qubits, as in the state in Eq. 2.9.


    $|\psi\rangle = \frac{1}{2}[|00\rangle + |01\rangle + |10\rangle - |11\rangle]$  (2.9)


    Another example of an entangled state is in Eq. 2.10,


    $|\psi\rangle = \frac{1}{\sqrt{2}}[|00\rangle + |11\rangle]$  (2.10)


    # 2.10.2 Bell states


    The bell state is a maximally entangled state, meaning that the two qubits are
    in a state of perfect entanglement. This means that if one qubit is measured to
    be 0, then the other qubit will also be 0, and vice versa. This property makes
    the bell state useful for quantum computing tasks such as teleportation and quantum
    computing algorithms. For a system of two qubits, different bell states are shown
    in the Eqs. 2.11, 2.12, 2.13, and 2.14.


    $|\Phi_+\rangle = \frac{1}{\sqrt{2}}[|00\rangle + |11\rangle]$  (2.11)


    $|\Phi_-\rangle = \frac{1}{\sqrt{2}}[|00\rangle + |11\rangle]$  (2.12)


    $|\Psi_+\rangle = \frac{1}{\sqrt{2}}[|01\rangle + |10\rangle]$  (2.13)


    $|\Psi_-\rangle = \frac{1}{\sqrt{2}}[|01\rangle + |10\rangle]$  (2.14)


    # 2.10.3 T22 methodology


    T22 protocol utilizes the Bell states as described in the section above. It is
    inspired by the approach given by Song and Chen [55].


    Since the Bell state when measured can be used to decisively distinguish between
    the Bell states in Eq. 2.11, 2.12, 2.13, and 2.14, the encoding is based on this
    property. The steps of the T22 protocols are as follows:


    +   1. Let Alice and Bob both have 4 qubits each. They need to choose between
    pairings of qubits and groupings of ‘00’, ‘01’, ‘10’, and ‘11’ for key transfer.'
