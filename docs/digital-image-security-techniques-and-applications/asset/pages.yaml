  md: '# About the editors


    Amit Kumar Singh is an Associate Professor in the Computer Science and Engineering
    Department, National Institute of Technology Patna, Bihar, India. He has authored
    over 250 peer-reviewed journals, conference publications, and book chapters. Dr.
    Singh has been recognized in the “WORLD RANKING OF TOP 2% SCIENTISTS” in “Biomedical
    Research” (2019) and “Artificial Intelligence & Image Processing” (2020), according
    to the survey given by Stanford University, USA. Dr. Singh is the associate editor
    of IEEE Trans. Multimedia, IEEE Trans. Ind. Informat., IEEE Trans. Computat. Social
    Syst., ACM Trans. Multimedia Comput. Commun. Appl., IEEE J. Biomed. Heal. Informatics,
    among others. Dr. Singh is the series editor of The IET International Book Series
    on Multimedia Information Processing and Security. He has edited various international
    journal special issues as a lead guest editor on publications such as ACM Transactions
    on Multimedia Computing, Communications, and Applications; ACM Transactions on
    Internet Technology; IEEE Transactions on Industrial Informatics; IEEE Journal
    of Biomedical and Health Informatics; IEEE Multimedia; IEEE Access; Multimedia
    Tools and Applications, Springer; International Journal of Information Management,
    Elsevier; Journal of Ambient Intelligence and Humanized Computing, among others.
    His research interests include multimedia data hiding, image processing, biometrics,
    and cryptography.


    Stefano Berretti is an Associate Professor at the Media Integration and Communication
    Center (MICC) and at the Department of Information Engineering (DINFO) of the
    University of Florence (UNIFI), Florence, Italy. His research interests are Computer
    Vision, Artificial Intelligence and Multimedia. During his Ph.D. and post-doc,
    he worked on image databases for effective and efficient image retrieval based
    on color, shape attributes, and spatial relationships. He also investigated the
    problem of retrieval from repositories distributed on the net using resource selection
    and results fusion. He provided several contributions on 3D object retrieval and
    partitioning, face biometrics (from 2D and 3D data), facial expression and emotion
    recognition (from 3D and 3D dynamic data), human action recognition from depth
    data, and 3D surface descriptors for relief patterns classification.'
