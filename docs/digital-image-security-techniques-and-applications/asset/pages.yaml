  md: 'Computing or Multi-access Edge Computing (MEC) are the major archetypes under
    the edge computing ecosystem. The above-mentioned technological advances share
    the same features and goal, which basically aims to reduce the proximity among
    service delivery locations and customers by trying to transfer cloud resources
    from remote, enormous cloud data centers to smaller, edges at the network end
    to provide low latency. Therefore, these are termed under the umbrella of Edge
    Computing mechanisms [11, 12].


    Briefly, fog computing refers to a scenario where numerous heterogeneous, decentralized
    base stations and access points serve as fog nodes used to communicate, collaborate,
    process, and store data without the assistance of a third party. MEC refers to
    a model that facilitates smooth management of various time-sensitive applications
    with the help of mobile base stations serving as sensor nodes. Cloudlets are another
    facility that contains strong CPU and abundant storage spaces, in contrast to
    routers, gateways, set-top boxes, and other devices with limited resource availability
    [12]. Although fog and edge computing are substitutable environments, a different
    frame of reference exists. Fog computing views the entire ecosystem with reference
    to the cloud aspect, whereas edge computing refers to a networking viewpoint.
    The uniqueness of edge computing lies in the concept where it involves extending
    storage, computation, and processing resources to the edges of a network, which
    can be a mobile network also [13].


    # 7.2.1 Edge computing architecture and characteristics


