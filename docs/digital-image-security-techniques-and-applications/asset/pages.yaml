    # 14.3 GENERATION OF ALIGNMENT-FREE AND NON-INVERTIBLE FINGERPRINT TEMPLATE USING
    PAIR-POLAR STRUCTURES OF MINUTIAE


    In this work [34], the pair-polar structures of minutiae points are exploited
    to construct a protected fingerprint user template. The presented technique is
    alignment-free and there is no need of a singular point, which is usually utilized
    in existing work for fingerprint alignment purposes. This eliminates the chances
    of incorrect extraction of the singular point due to the change in the quality
    of fingerprint images and due to the type of fingerprint images, i.e., arc-type.
    A schematic block diagram that shows the various steps of this work is shown in
    Figure 14.3. Further, a brief description of how each stage in the transformation
    process works is presented below, starting with the extraction of minutiae and
    ending with the final matching phase. It can be seen from Figure 14.3 that the
    presented technique consists of the following steps: the extraction of minutiae,
    computation of pair-polar structures, the transformation of pair-polar structures,
    and computation of the protected fingerprint template, which is the collection
    of binary vectors.


    **Minutiae extraction:** The presented technique utilizes the minutiae information
    that mainly includes the orientation and location values of minutiae. The minutiae
    locations provide the position of minutiae in Cartesian space,'
