    The first experiments in quantum key distribution were conducted in 1989 by Bennett
    and Brassard, who developed the now-famous BB84 protocol, which is still widely
    used today. The protocol involves sending random bits encoded onto single photons
    over an optical channel from one party (Alice) to another (Bob). Each bit is represented
    by either a vertical or horizontal polarization state of a single photon, and
    Alice randomly selects each polarization state using a device called a quantum
    random number generator (QRNG). Bob then measures each incoming photon with his
    own QRNG and compares his results with those sent by Alice. If they match up,
    he keeps them; otherwise he discards them as errors and resends the bits until
    he receives an exact match. Once all bits are successfully exchanged, both parties
    have established their cryptographic keys with high confidence that they have
    not been intercepted or manipulated in transit.


    From there they can use this secret key for symmetric encryption via an algorithm
    such as AES or 3DES; this encryption method offers much greater security than
    other methods since it relies on keeping the same secret key throughout all communications,
    which makes interception significantly more difficult, if not impossible. Additionally,
    due to its nature as an unbreakable encryption method, even if someone does obtain
    access to the transmitted data, they cannot decrypt it without knowing that exact
    same secret key used during transmission; thus providing unprecedented levels
    of security for sensitive data transmissions even over large distances.


