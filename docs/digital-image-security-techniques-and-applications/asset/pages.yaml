    experiences a bottleneck in the speed of data transmission. For example, a Boeing
    787 will generate 5 Gigabytes (GBs) data per second, and transmitting this data
    between the airplane to a satellite or a base station on the ground is inefficient
    for data processing [5]. Consider another example of autonomous vehicles—it will
