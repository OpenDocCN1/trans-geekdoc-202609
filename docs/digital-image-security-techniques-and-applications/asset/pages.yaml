- pgno: 43
  md: 'The security provided by classical hash functions depends on various factors
    including their ability to resist malicious attacks and collisions. Collisions
    occur when two different messages have the same computed hash value; this can
    lead to potential security issues since an attacker could use this information
    to substitute another malicious message for the original without being detected
    by the recipient. To help mitigate this problem, some hashing functions utilize
    salt values, which help prevent two different messages from having similar outputs
    even if they share some common characters [48].


    In addition, most classical hashing functions also make use of iterative processes
    to increase their resistance towards cryptanalysis—which simply involve analyzing
    a cryptographic system to find weaknesses or vulnerabilities within its design
    structure. By increasing its computational complexity through iterations, an attacker
    would need to spend significantly more time and resources to break into the cryptographic
    system successfully, thereby making it much harder to gain access without authorization
    or permission from legitimate users or sources such as administrators or owners
    [49].


    Mathematically, a hash function can be defined as a function that converts input
    data of any length into output encrypted text of a specific length. A message
    digest, hash value, hash code, or just a hash are all terms used to describe this
    result. A hash function, in more formal terms, is a mathematical function H: D
    ⊗ R where D = 0, 1 and R = 0, 1^n for some n >= 1, and it transforms a numerical
    input value m of any length into a compacted numerical output h of a specific
    length. Therefore, h = H(m).


    # 2.7.1 Cryptographic hash function


    We can define a cryptographic hash function as a hash function that satisfies
    additional conditions to be utilized for cryptographic purposes. These are fundamental
    building blocks with many applications. Their primary areas of use include certificate-based
    digital signatures, authentications, password storage security, and digital signatures
    in general. Cryptographic hash functions can generally be classified as Manipulation
    Detection Code (MDC) or Message Authentication Code (MAC) with a single parameter—an
    input message—and keyed hash functions with two distinct inputs—an input message
    and a secret key—are the two main categories for cryptographic hash functions.
    Hash functions often refer to unkeyed hash functions.


    # 2.8 QUANTUM HASH FUNCTIONS


    A quantum hash function is a cryptographic technique used to protect data against
    malicious tampering. It utilizes properties of quantum computing and an algorithm
    designed to ensure that the integrity of the data is maintained even if an attacker
    attempts to modify it.'
