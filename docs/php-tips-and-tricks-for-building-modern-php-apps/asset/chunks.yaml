    # SELECT TOP Statement


    The `SELECT TOP` statement is used to retrieve the top records that you need to
    return, leaving the rest of the table hidden. You can use it on large-sized tables
    that have thousands of records. This is useful because if you return a large number
    of records, it will impact your performance.


