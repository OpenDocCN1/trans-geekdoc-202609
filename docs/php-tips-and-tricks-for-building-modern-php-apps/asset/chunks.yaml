    # 第一章：安装 PHP


    本章将引导你完成在你的计算机系统上安装 PHP 的过程。如果你是 Linux 或 Mac 用户，你已经通过公司在你的计算机系统中安装了 PHP。然而，有时它没有处于激活模式，但你可以轻松地开启它。在
    Windows 操作系统上安装 PHP 是真正的任务。Windows 电脑上没有预装 `PHP`。当你安装好之后，你需要配置 Web 服务器来处理 `PHP`
    代码。


    ## 安装 Web 服务器


    安装 PHP 的第一步是在你的计算机系统上安装一个 Web 服务器。你必须下载并安装 `Apache`。如果你使用的是托管或公司网站，并且将文件放在他人的服务器上，那么你完全不需要安装
    Web 服务器。你可以使用 `Apache` 的 `httpd`，因为大多数情况下它是免费提供的，而且互联网上广受欢迎的 Web 服务器之一。


    还有许多其他 Web 服务器可供。微软提供了 `Internet Information Services (IIS)`，它还包含一个带有 `Visual
    Studio` 开发应用的开发 Web 服务器。另一个名为 `nginx` 的工具也可以用它来满足你的开发需求。`Apache` 非常流行；这就是为什么我在本章将单独介绍
    `Apache`。


    Windows 操作系统没有预装 `Apache`。你必须自己安装。你可以运行测试来检查计算机系统上是否安装了 Web 服务器。打开你的浏览器，在地址栏输入
    `[`localhost`](http://localhost)`。如果 浏览器已安装并运行正常，你将看到一个网页。可能会显示一个 `Apache` 欢迎界面并带有一些文本。如果你的系统中没有安装
    Web 服务器，页面将显示“无法连接”的字样。


    ## Apache


    `Apache` 是一种开源 Web 服务器，你可以从网上免费下载。有三个版本可供下载：`Apache 2.0`、`Apache 2.2` 和 `Apache
    2.4`。所有版本都得到了良好的支持并定期升级。`PHP` 软件倾向于这些版本上运行。


    你可以从其官方网站下载 `Apache`。你也可以下载源代码并在你的操作系统上进行编译。你可以使用已经编译并处于准备就绪状态的二进制文件复制到当前位置。访问
    `[`httpd.apache.org`](http://httpd.apache.org)` 并向下滚动到你想要在操作系统上安装的版本。Windows 二进制文件通常带有一个安装程序，可以安装、配置并启动
    `Apache`。当你点击 `Win32 Binary MSI Installer` 时，一个安装文件将下载到你的操作系统中。


    ## 文件验证


    `Apache` 网站在你下载软件后提供了几种方法进行软件验证。这是一种安全预防措施，以确保坏人没有修改文件。你可以使用 `MD5` 方法或 `PGP` 方法来运行文件验证。此过程用于对
    `PHP`、`Apache` 和 `MySQL` 进行验证。


    ## 安装


    你可以在任何版本的 Microsoft Windows 上安装 `Apache`。要安装 `Apache`，你需要确保系统上没有正在运行 `IIS`。按照以下步骤确认安装：


    - 文件名通常为 `apache_`，后面跟着其版本号，称为 `win32-x86-no_ssl.msi`。右键点击该文件并选择`以管理员身份运行`。这将启动安装向导。电脑屏幕上会弹出一个欢迎界面。

    - 现在点击`Next`（下一步）。屏幕上将显示许可协议。

    - 现在选择`I Accept`（我接受）`License Agreement`（许可协议）。现在点击`Next`。如果不接受条款，将无法安装此软件。将显示一个带有
    `Apache` 信息的屏幕。

    - 现在点击`Next`，你将看到一个显示 `Apache` 信息的屏幕。

    - 系统会要求你输入必须的信息。你首先需要输入的是 `Domain Name`（域名）。你应该输入像 `qas.com` 这样的域名。如果你是为了测试安装
    `Apache` 并且想从安装了它的机器上访问它，可以输入 `localhost`。

    - 下一个信息是关于 `Server Name`（服务器名称）。在安装 `Apache` 的过程中，你应该输入服务器名称，例如 `[www.localhost.com](http://www.localhost.com)`。如果你是为了测试安装
    `Apache` 并且想从安装了它的机器上访问它，可以输入 `localhost`。

    - 现在是时候输入电子邮件地址了，以便接收有关你 Web 服务器的邮件消息。

    - 在这一步中，你必须选择让 `Apache` 作为服务运行，还是在你需要手动使用它时启动 `Apache`。

    - 安装类型屏幕将显示在电脑屏幕上。

    - 你应该选择一种安装类型然后点击`Next`。在大多数情况下，你应该选择`Complete`（完成）。只有理解 `Apache` 的高级用户才应该选择 `Custom`（自定义），因为如果你选择了它，屏幕将与选择其他选项时不同。

    - 下一步是选择你想要安装 `Apache` 的目录。之后，点击`Next`。

    - 直到这时，你可以在继续安装之前返回并更改已输入的信息。当安装过程完成后，会弹出一个窗口，告诉你向导已完成安装过程。

    - 现在点击`Finish`（完成）以结束安装过程并退出安装向导。


    '
- fmt: "\n# Starting Apache\n\nWhen you have installed it, you might want to start\
    \ Apache. There is a possibility that the Wizard has already started it. However,\
    \ when you change the configuration settings, you ought to restart Apache before\
    \ these new settings start working. Anyways, Apache is ready to use. \n\nYou can\
    \ locate certain menu items of Apache that you can use for stopping or starting\
    \ it. You can reach this menu by clicking on `Start`, entering `Programs`, and\
    \ then opening the `Apache HTTP Server`. Now, click `Control Apache Server` to\
    \ see what the menu has got for you.\n\nThe first option that you can see on the\
    \ menu is `Start`. This option will start Apache when it is not running. If you\
    \ click this item when the Apache is already running, you will see an error message\
    \ that will say that Apache has been started. The second option in the menu is\
    \ `Stop`. You can use it to stop Apache. There is another one that would allow\
    \ you to `Restart` if Apache is already running.\n\nYou can retrieve plenty of\
    \ information from Apache by applying a bunch of commands. You can retrieve information\
    \ by entering the `Command Prompt` window. To get there, click on `Start`, then\
    \ click on `Accessories` and then enter `Command Prompt`. Now change to the `bin`\
    \ directory where you have installed Apache.\n\nIf you want to find out which\
    \ Apache is installed on your computer, you ought to type in the following command\
    \ in the command prompt window:\n```\napache –v\n```\nIf you want to find out\
    \ the modules that are compiled into Apache, you should type the following command:\n\
    ```\napache –1\n```\nYou also can start or stop Apache by the following commands:\n\
    ```\napache -k start\napache –k stop\n```\nYou can see the options that are available\
    \ by typing the following commands:\n```\napache -h\n```\n\n# Configuration of\
    \ Apache\n\nWhen Apache starts, it starts reading information from a particular\
    \ configuration file. If Apache fails to read the configuration file, it will\
    \ not start. Apache behaves as per directives. You can change the behavior of\
    \ Apache by editing the configuration file and then restarting Apache, so it reads\
    \ the new directives. \n\nIf you choose to install PHP, you will need to configure\
    \ Apache to recognize PHP programs. Apache looks out for certain web page files\
    \ in a directory and the subdirectories known as `Document Root`. You can go on\
    \ to change the location of the `Document Root`.\n\n# Installing PHP\n\nThe first\
    \ step in the installation of PHP is to check whether it is already installed\
    \ on your operating system or not. You can search your hard drive to look out\
    \ for any PHP files. If you are using a Windows operating system, you can use\
    \ the `Find` feature to locate PHP in general. Click on `Start` and then press\
    \ `Find`. If you cannot find PHP files on your computer system, PHP is not installed\
    \ yet on the system. You might have PHP files on your system, but they don't need\
    \ to be installed on the system. It is also possible that the PHP version that\
    \ is installed on your computer is not up-to-date.\n\n## Obtain PHP\n\nYou can\
    \ download PHP from the internet. Make sure the version you are downloading is\
    \ the latest. You should only choose to install an older version of PHP if you\
    \ must maintain or modify the existing code of a website. The code you write with\
    \ one version of PHP will need modification to be run on another version of PHP.\
    \ \n\nYou can visit [www.php.net](http://www.php.net) to download PHP for all\
    \ types of operating systems. The source code for the compilation of your operating\
    \ system is also available for download. Compilation and installation of the source\
    \ code are easier on Mac and Linux. As already mentioned, you can download binary\
    \ files to ease off the installation process for Windows. \n\nThere is a zip file\
    \ available on the official site for Windows.\n"
