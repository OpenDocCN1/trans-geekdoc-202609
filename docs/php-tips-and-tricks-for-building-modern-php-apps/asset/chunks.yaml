    # Conclusion


    Now that you have made it to the end of the book, I hope you have learned a lot
    about the basics of `PHP` scripting language. I have given you practical codes,
    instructions, and in-depth explanations in the book so that you can use them to
    understand the scripts, and you can edit them to create unique scripts. If you
    get to apply the lessons that you have studied in the book, you will become a
    skilled user in a short period.


    Apart from brute force attacks that aim at guessing your password by using the
    login screen, bots that work day and night to exploit the vulnerabilities in the
    website’s `PHP` code are considered the most common form of attacks that target
    the vulnerabilities in your websites. You have to keep into consideration the
    vulnerabilities in `PHP` coding so that you can remove them and make your `PHP`
    code stronger.


    ## Remote Code Execution


    Remote Code Execution is the attack that occurs when a hacker uploads malicious
    code to a website and also executes it right away. If there is a bug in `PHP`,
    it will accept malicious input by a user and reads it as a `PHP` code. This allows
    the hacker to instruct the website to create a new file that contains the code
    which will grant the malicious hacker complete access to the website. When the
    hacker sends the code to the web application, and it is executed well in time,
    it will grant access to the hacker to your website. In this way, they can successfully
    exploit an RCE vulnerability.


    ## SQL Injection


    SQL Injection is another vulnerability that a hacker can exploit to attack your
    web application. Through a SQL Injection, a hacker can dispatch malicious instructions
    to the web applications’ database. The web app database executes the instructions
    due to a vulnerability in the code and lets the hacker in. This kind of attack
    generally happens when a web developer does not install a sanitization barrier
    for the input from the users. This allows a malicious user to fill in the web
    app with malicious code.


    SQL Injection will allow a hacker to access the website data. Hackers can create
    new data in the database that may contain links to spam websites. The attacker
    may use SQL Injection to create an administrator account and use it to gain full
    control of your website application. The best way to stay safe from this kind
    of vulnerability is to put in place a barrier for the sanitization of input from
    the users. The input should be verified first and then permitted to enter the
    database of the website.


    ## Cross-Site Scripting (XSS)


    Cross-Site Scripting (XSS) can happen when a malicious hacker finds a way to load
    malicious code on the website and execute it as well. This malicious code can
    grant administrative access to the malicious hacker.


    - **Stored XSS**: A stored XSS happens when a malicious hacker gets the website
    to store malicious code that is later on served up within the browser of another
    user and executed accordingly. A practical example is when the hacker posts a
    comment containing malicious code on a WordPress website.

    - **Reflected XSS**: Reflected XSS happens when an attacker creates a link that
    contains malicious code and loads the link to the browser. The website reads it
    as website content. The code executes in the user’s browser after that and may
    let the hacker steal cookies or perform malicious tasks.


    These are some of the web application vulnerabilities that you should consider
    after you learn `PHP`. This book is the complete package for learning the ins
    and outs of `PHP`. I have explained the main topics in detail so that you get
    to know how a website application works. The two major parts of a website are
    explained in detail. You can leverage on this practical information and enhance
    your knowledge further in the world of web applications.


    ## Resources


    - `https://www.w3schools.com/php/`

    - `https://www.w3schools.com/php/php_intro.asp`

    - `https://www.w3schools.com/php/php_syntax.asp`

    - `https://www.w3schools.com/php/php_variables.asp`

    - `https://www.w3schools.com/php/php_operators.asp`

    - `https://www.w3schools.com/php/php_comparison.asp`

    - `https://www.w3schools.com/php/php_logical.asp`

    - `https://www.w3schools.com/php/php_arrays.asp`

    - `https://www.w3schools.com/php/php_loops.asp`

    - `https://www.w3schools.com/php/php_functions.asp`

    - `https://www.w3schools.com/php/php_classes.asp`

    - `https://www.w3schools.com/php/php_oop.asp`

    - `https://www.w3schools.com/php/php_mysql.asp`

    - `https://www.w3schools.com/php/sql_select.asp`

    - `https://www.w3schools.com/php/sql_insert.asp`

    - `https://www.w3schools.com/php/sql_update.asp`

    - `https://www.w3schools.com/php/sql_delete.asp`

    - `https://www.w3schools.com/php/sql_join.asp`

    '
