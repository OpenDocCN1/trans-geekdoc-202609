    # Chapter One: Installing PHP


    This chapter will walk you through the process of the installation of PHP on your
    computer system. If you are a Linux or Mac user, you will get PHP installed on
    your computer system from the company. However, sometimes it is not in active
    mode, but you can do that easily. The real task to install PHP on a Windows operating
    system. `PHP` is not pre-installed on Windows computers. When you have installed
    it, you are required to configure the webserver for processing the `PHP` code.


    ## Installing a Web Server


    The first step of installing PHP is to install a web server on your computer system.
    You will have to download and install the `Apache`. If you are using a hosted
    or company website and you are placing files on another person’s server, then
    you don’t have to install the webserver at all. You can use `httpd` from `Apache`
    because it comes mostly free and is one of the highly popular web servers that
    are used on the Internet.


    Many other web servers are also available. Microsoft offers `Internet Information
    Services (IIS)`, and it also includes a development web server with `Visual Studio`
    development app. There is another named `nginx` that you can use to fulfill your
    development needs. `Apache` is popular; that’s why I will talk about `Apache`
    alone in this chapter.


    A Windows operating system does not come with `Apache` pre-installed on it. You
    have to install it yourself. You can run a test on whether a web server comes
    installed on your computer system. Open your internet browser and type in `[http://localhost](http://localhost)`
    in the address bar. If the web browser is installed and functional, you will see
    a web page. There can be an `Apache` welcome screen that will display some text.
    If you don’t have a web server installed on your system, the page will display
    the text, ‘unable to connect.’


    ## Apache


    `Apache` is a kind of open-source web server that you can download from the internet
    for free. There are three versions that you can download; `Apache 2.0`, `Apache
    2.2`, and `Apache 2.4`. All of these versions are properly supported and timely
    upgraded. The `PHP` software tends to run with these versions.


    You can download `Apache` from its official website. You can also download the
    source code for compilation on your operating system. You can use binary files
    that are already compiled and in a ready-to-run form to be copied to the current
    location. Go to `[http://httpd.apache.org](http://httpd.apache.org)` and scroll
    down to the version that you want to install on your operating system. The Windows
    binary file usually comes with an installer that will install, configure, and
    start `Apache`. When you click on `Win32 Binary MSI Installer`, an installer file
    will be downloaded on your operating system.


    ## Verification of the File


    The `Apache` website offers several methods for the verification of software after
    you have downloaded it. It comes as a security precaution to make sure that the
    bad guys don’t alter the file. You can use the `MD5` method or the `PGP` method
    to run the verification of the file. This process is used for the verification
    of `PHP`, `Apache`, and `MySQL`.


    ## Installation


    You can install `Apache` on any version of Microsoft Windows. To install `Apache`,
    you need to make sure that `IIS` is not already running on the system. Follow
    the following steps to confirm the installation:


    - The file is usually named `apache_`, which is followed by its version number
    called `win32-x86-no_ssl.msi`. Right-click the file and choose `Run as Administrator`.
    This will kick off the Installation Wizard. A welcome screen will pop up on your
    computer screen.

    - Now click on `Next`. The license agreement will be displayed on the screen.

    - Now select `I Accept` the `License Agreement`. Now click on `Next`. If you opt
    not to accept the terms, you will not be able to install this software. A screen
    that carries information about `Apache` will be displayed.

    - Now click on `Next`, and you will see a screen that will display information
    about `Apache`.

    - You will be requested information that you ought to enter. The first thing you
    will have to enter is the `Domain Name`. You ought to enter the domain name like
    `qas.com`. If you want to install `Apache` for testing and you also want to access
    it from the machine where you have installed it, you can enter `localhost`.

    - The next information is about the `Server Name`. You ought to enter the server
    name when you are in the process of installing `Apache`, such as `[www.localhost.com](http://www.localhost.com)`.
    If you want to install `Apache` for testing and you also want to access it from
    the machine where you have installed it, you can enter `localhost`.

    - Now it is time to type in the email address where you are looking to forward
    to receive the email messages about your web server.

    - In this step, you have to select whether you want `Apache` to run as a service,
    or you need to start `Apache` when you want to use it manually.

    - The installation type screen will be displayed on our computer screen.

    - You ought to select an installation type and then click on `Next`. In most of
    the cases, you ought to select `Complete`. Only the advanced users who understand
    `Apache` should go for `Custom` because if you select it, the screens will differ
    from when you select any other option.

    - The next step is to select the directory where you want to install `Apache`.
    Afterward, click on `Next`.

    - Until this point, you can go back and change the information that you have entered
    before you proceed with the installation. When the process of installation is
    complete, a screen will pop up, which will tell you that the wizard has completed
    the process of installation.

    - Now click on `Finish` to end the installation process and move out of the Installation
    Wizard.

