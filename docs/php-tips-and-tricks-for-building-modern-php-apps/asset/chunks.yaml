    you can use a PHP installer which may be available for the version of Windows
    you are using. Here is a rundown of the steps involved in the process. The first
    step is to extract the files from the .zip file into the directory where you want
    the PHP to be installed. The location can be anything like c:\\php. The zip file
    is usually named php5.4.5-Win32.zip-. If you give the file a double click, it
    will open. Now copy them to an appropriate directory or right away extract them.
    C:\\php is the top choice for installation because a lot of configuration files
    assume that PHP is installed in that location. This will make sure that the default
    settings are correct. You ought not to install PHP in a directory with a space
    in the path like Software Files\\PHP. Now you have a directory and many subdirectories
    that carry the files from the Zip file. Now you must be able to run certain PHP
    programs. PHP needs files that it cannot locate. If it happens, you will see an
    error message, saying that it cannot find the .dll extension. You can find the
    DLL file in the ext subdirectory and then copy it into the major PHP directory.
    The second step is the activation of MySQL support. After that, configure the
    webserver. Finally, it is time to configure the PHP section. Configuration of
    Web Server for PHP Your web server ought to be configured to recognize PHP scripts
    and run them as well. You cannot have Apache and Internet Information Services
    (IIS) both running at the same time and by using the same port number. Either
    you can shut down a web server or direct them to listen on different ports. You
    need to edit the Apache configuration file known as httpd.conf before PHP may
    properly run. PHP also can configure itself to work with Apache. In that case,
    you will see the LoadModule directive that is present and uncommented. However,
    if it is not configured, you can use the following steps to do so. '
