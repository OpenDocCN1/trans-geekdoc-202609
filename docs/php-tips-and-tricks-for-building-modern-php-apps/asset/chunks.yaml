- fmt: "\n# Chapter Eight: Build Web Applications With PHP\n\nYou have seen how to\
    \ program in PHP in the past chapters. You have seen how to create a program,\
    \ set up conditionals, and create a loop, and much more. All that knowledge gives\
    \ you the power to build PHP programs that would work well on the web. However,\
    \ you can make them better and easier to use.\n\nAs the complexity of your programs\
    \ rises, you will find a big number of `require_once()` and `includes` functions.\
    \ Whenever you intend to create a new file or make something in a common function,\
    \ you can add a `require_once` to the program. If you direct a visitor to any\
    \ URL like `[http://www.example.com/login.php](http://www.example.com/login.php)`,\
    \ you can be able to use `auto_prepend_file` to need a helper file before the\
    \ `login.php` code which is being run. This helper file has the power to start\
    \ the session, offer multiple functions that you can use inside of the programs,\
    \ or load multiple files. The `auto_prepend_file` function is an integral part\
    \ of the `php.ini` file, but it is common to set it in the Apache configuration\
    \ by using the `php_value` directive.\n\n## Prepend File\n\nThis section will\
    \ explain that if you are looking forward to using sessions, you ought to call\
    \ the `session_start()` function on all the pages that will be using sessions.\
    \ This can be pretty tough if you are looking forward to tracking down sessions\
    \ onto multiple PHP programs. You can then use an auto-prepend-file to call `session_start`.\n\
    \nCreate two files; one will be the main file, and the other will contain a prepended\
    \ function to start a particular session. Before you perform an exercise, you\
    \ ought to ensure that `.htaccess` files are working or that you can alter the\
    \ Apache webserver configuration. Make sure that you restart Apache if you are\
    \ looking forward to making a change to the configuration.\n\nInside of the `.htaccess`\
    \ file for the root of the document, you need to place the following code:\n\n\
    ```php\nphp_value auto_prepend_file \"prepend.php\"\n```\n\nYou also can add the\
    \ same line inside of the following script:\n\n```apache\n<Directory \"/my/documentroot/path\"\
    >\n    php_value auto_prepend_file \"/my/documentroot/path/prependfile.php\"\n\
    </Directory>\n```\n\nIf the root of the document is `/var/www` you should add\
    \ the line after the `<Directory \"/var/www\">`. Now open your text editor and\
    \ create a fresh empty file. Inside of that file, you need to place the following\
    \ code:\n\n```html\n<html>\n<head>\n    <title>This is PHP</title>\n</head>\n\
    <body>\n    <?php \n    if (isset($_SESSION)) {\n        print \"Your Session\
    \ starts!\";\n    } else {\n        print \"Your session did not start\";\n  \
    \  } \n    ?>\n</body>\n</html>\n```\n\n`php main.php`\n\n```html\n<html>\n<head>\n\
    \    <title>This is PHP</title>\n</head>\n<body>Your session did not start</body>\n\
    </html>\n```\n\nSave the file as `session.php` inside of the document root. You\
    \ can now open the web browser and enter `[http://localhost/session.php](http://localhost/session.php)`.\
    \ You can now minimize the web browser and also create a new file in the text\
    \ editor. Now place the following code inside of the new file:\n\n```php\n<?php\
    \ session_start(); ?>\n```\n\nYou can save this file as `prepend.php` in the document\
    \ root. Inside of the browser, you can reload `session.php` file to view the same\
    \ you created earlier. If you receive a blank page or some kind of error on the\
    \ browser, it means that the prepended file was not there. Go through the spellings\
    \ to verify you have written them correctly. If you see a page that says ‘Session\
    \ has not started,’ chances are that Apache has not detected `auto_prepend_file`\
    \ directive. If you have placed the `.htaccess` file in the document root, you\
    \ ought to make sure that Apache has read it. Read on or check with the hosting\
    \ provider to see if `.htaccess` files have been allowed or not. Some web server\
    \ configurations have no room for `.htaccess` files. You can revise the Apache\
    \ configuration by changing `AllowOverride` to `All`.\n\n## Classes For Efficiency\n\
    \nYou can use classes to make your applications more efficient. You can create\
    \ a class to define a user. After that, you can go on to adding functions, which\
    \ are known as methods, to that class for simple things that users might want\
    \ to do on the web, such as updating passwords. In the absence of classes, you\
    \ might end up with multiple functions scattered around the programs. This will\
    \ complicate the code and make it look like a mess. Also, it will take a longer\
    \ time to write the programs. If you write a program without classes, you will\
    \ have to add a lot of functions to run the program properly. For example, if\
    \ you want to write different management programs with classes, you will have\
    \ to include in its different functions like `setEmail`, `changePassword`, and\
    \ many more. Now you will have to merge that code with another one to add different\
    \ roles. You can write these programs without adding classes, and they will share\
    \ the same names as programs do. An example of the name is `Permission`. When\
    \ you aim at merging them, you will not have any confusion regarding the names,\
    \ as `Permission` would not collide with other functions because `Permission`\
    \ is an integral part of the user class. You can recall it to create a user in\
    \ a certain object-oriented manner, also known as instantiation, by using `new`\
    \ keyword. If the user class were labeled as `User`, you would need to instantiate\
    \ like the following:\n\n```php\n$user = new User;\n```\n\n## Code Reuse\n\nThis\
    \ is one of the most important aspects of programming. A majority of programmers\
    \ keep sets of functions or programs that they frequently reuse whenever they\
    \ need them. Most of reusable codes are to kick off a program to save time. When\
    \ you are building modern applications in PHP, you might find it useful to reuse\
    \ your code. Functions are important parts of PHP coding. This section of the\
    \ books expands on the idea of reusing functions in PHP programming. With the\
    \ help of `auto_prepend_file`, you can create functions that will be included\
    \ in your programs. These functions can be something as simple as kicking off\
    \ a session or as complex as login function. When you think you require a function\
    \ in multiple files, you can use `auto_prepend_file` to convert three-letter abbreviation\
    \ of the name into its full name. You can create a function and integrate it into\
    \ the prepended PHP file. Open the `prepend.php` file that we created in the previous\
    \ section. Now clear the code outside of `prepend.php` and put it in the file:\n\
    \n```html\n<html>\n<head>\n    <title>This is PHP</title>\n</head>\n<body>\n \
    \   <?php \n    if (!isset($_SESSION)) {\n        session_start();\n    } \n \
    \   function convertStateName($nstate) {\n        $thestateList = array(\n   \
    \         \"ALA\" => \"Alabama\",\n            \"AKA\" => \"Alaska\",\n      \
    \      \"ARZ\" => \"Arizona\",\n            \"ARK\" => \"Arkansas\",\n       \
    \     \"CAL\" => \"California\",\n            \"COL\" => \"Colorado\",\n     \
    \       \"CTC\" => \"Connecticut\",\n            \"DEL\" => \"Delaware\",\n  \
    \          \"FLO\" => \"Florida\",\n            \"GGA\" => \"Georgia\",\n    \
    \        \"HWI\" => \"Hawaii\",\n            \"IDA\" => \"Idaho\",\n         \
    \   \"ILI\" => \"Illinois\",\n            \"IND\" => \"Indiana\",\n          \
    \  \"IOA\" => \"Iowa\",\n            \"KAS\" => \"Kansas\",\n            \"KTY\"\
    \ => \"Kentucky\",\n            \"LIA\" => \"Louisiana\",\n            \"MAE\"\
    \ => \"Maine\",\n            \"MLD\" => \"Maryland\",\n            \"MSA\" =>\
    \ \"Massachusetts\",\n            \"MCI\" => \"Michigan\",\n            \"MIN\"\
    \ => \"Minnesota\",\n            \"MIS\" => \"Mississippi\",\n            \"MOI\"\
    \ => \"Missouri\",\n            \"MOT\" => \"Montana\",\n            \"NEB\" =>\
    \ \"Nebraska\",\n            \"NEV\" => \"Nevada\",\n            \"NHM\" => \"\
    New Hampshire\",\n            \"NJY\" => \"New Jersey\",\n            \"NMX\"\
    \ => \"New Mexico\",\n            \"NYC\" => \"New York\",\n            \"NCA\"\
    \ => \"North Carolina\",\n            \"NDA\" => \"North Dakota\",\n         \
    \   \"OHO\" => \"Ohio\",\n            \"OKA\" => \"Oklahoma\",\n            \"\
    ORG\" => \"Oregon\",\n            \"PSA\" => \"Pennsylvania\",\n            \"\
    RDI\" => \"Rhode Island\",\n            \"SCA\" => \"South Carolina\",\n     \
    \       \"SDA\" => \"South Dakota\",\n            \"TNS\" => \"Tennessee\",\n\
    \            \"TXS\" => \"Texas\",\n            \"UTA\" => \"Utah\",\n       \
    \     \"VNT\" => \"Vermont\",\n            \"VGA\" => \"Virginia\",\n        \
    \    \"WSN\" => \"Washington\",\n            \"WVG\" => \"West Virginia\",\n \
    \           \"WIS\" => \"Wisconsin\",\n            \"WYM\" => \"Wyoming\"\n  \
    \      ); \n        if (array_key_exists($nstate, $thestateList)) {\n        \
    \    return $thestateList[$nstate];\n        } else {\n            return false;\n\
    \        }\n    } \n    ?>\n</body>\n</html>\n```\n\nSave it as `prepend.php`\
    \ file in the document root. Now create another file with the following script:\n\
    \n```html\n<html>\n<head>\n    <title>This is PHP</title>\n</head>\n<body>\n \
    \   <?php \n    $stateAbbreviation = \"WIS\";\n    print \"The State abbreviation\
    \ should be \" . $stateAbbreviation . \"<br>\\n\";\n    $stateFull = convertStateName($stateAbbreviation);\
    \ \n    if ($stateFull) { \n        print \"The Full name of the state is \" .\
    \ $stateFull . \"<br>\\n\"; \n    } else { \n        print \"The Full name of\
    \ the state is not found for \" . $stateAbbreviation . \"<br>\\n\"; \n    } \n\
    \    ?>\n</body>\n</html>\n```\n\nYou ought to save this file as `abbreviation.php`\
    \ at the root of the document. Now open up the browser and open `[http://localhost/abbreviation.php](http://localhost/abbreviation.php)`.\
    \ The code will check if the session has started or not. If not, it will display\
    \ an error. The function `convertStateName` will accept some arguments to convert.\
    \ If you have a three-letter abbreviation, you will see an error on the screen.\
    \ Otherwise, you will see the name of the state.\n\n## App\n\nA majority of people\
    \ use PHP to build different types of websites. This language allows programmers\
    \ to create interactive web applications. A dynamic web application can collect\
    \ data from the users using HTML forms. The data procured from the users and saved\
    \ in the database remains confidential, which makes the security of the website\
    \ a grave. PHP has features that allow programmers to harvest and securely store\
    \ data. All you need is to develop applications using PHP and HTML. There is no\
    \ need to embed PHP codes into different files. You can always create PHP files\
    \ that don’t possess any HTML elements. This makes the languages move side by\
    \ side. Let’s dissect the latest example that I have given:\n\n```php\n<html>\n\
    <head>\n    <title>This is PHP</title>\n</head>\n<body>\n    <?php\n    abstract\
    \ class ParentClass {\n        // This is an Abstract method with an argument\n\
    \        abstract protected function prefixName($name);\n    }\n    class ChildClass\
    \ extends ParentClass {\n        public function prefixName($vname, $theseparator\
    \ = \".\", $vgreet = \"My dear \") {\n            if ($vname == \"John Snow\"\
    ) {\n                $prefix = \"Mister.\";\n            } elseif ($vname == \"\
    Jane Snow\") {\n                $prefix = \"Mrs.\";\n            } else {\n  \
    \              $prefix = \"\";\n            }\n            return \"{$vgreet}{$theseparator}{$vname}\"\
    ;\n        }\n    }\n    $class = new ChildClass;\n    echo $class->prefixName(\"\
    John Snow\");\n    echo \"<br>\";\n    echo $class->prefixName(\"Jane Snow\");\n\
    \    ?>\n\n```\n\nIf you analyze the example, you can understand that after the\
    \ `<body>` tags, the tag for PHP starts and it ends where the script ends. In\
    \ the example, `<?php` signifies the beginning of PHP code that has been neatly\
    \ embedded into the HTML body. The `?>` marks the end of PHP script. You might\
    \ notice that this example sends the output through `echo`.\n\n## User Input\n\
    \nNow that you have understood how PHP survives inside an HTML file, all the modern\
    \ web applications require space for user actions. Suppose there is an online\
    \ bookstore which requires a login system and registration. Users ought to perform\
    \ an action like entering the login credentials to reach inside of the online\
    \ shop. This system requires HTML-based forms along with a storage for keeping\
    \ the data in the storage. To create such an application, you need lots of things\
    \ from each user during the registration process such as their usernames, passwords,\
    \ and email IDs. Take a look at the following code that you need to create the\
    \ application’s user-oriented feature. There is no PHP in this example. You will\
    \ only find:\n\n```html\n<html>\n<head>\n    <title>This is a Sign-up app</title>\n\
    </head>\n<body>\n    <h1>You can freely Register Here</h1>\n    <form method=\"\
    get\" action=\"thesignup.php\">\n        <table>\n            <tr>\n         \
    \       <td>You have to fill in your Email Address:</td>\n                <td><input\
    \ type=\"text\" name=\"your email address\"/></td>\n            </tr>\n      \
    \      <tr>\n                <td>Name:</td>\n                <td><input type=\"\
    text\" name=\"first_last_name\"/></td>\n            </tr>\n            <tr>\n\
    \                <td>This is the Space For Your Desired Password:</td>\n     \
    \           <td><input type=\"password\" name=\"desiredpassword\"/></td>\n   \
    \         </tr>\n            <tr>\n                <td colspan=\"5\">\n      \
    \              <input type=\"submit\" name=\"signup\" value=\"Sign up\"/>\n  \
    \              </td>\n            </tr>\n        </table>\n    </form>\n</body>\n\
    </html>\n```\n\n## Building a PHP CMS\n\nIt can be safely said that every website\
    \ is up-to-date is using some kind of content management system (CMS). There are\
    \ a number of great options that offer us CMS to power your WordPress or Drupal.\
    \ However, a simple PHP class can help you create a proficient database. You can\
    \ use PHP to connect your website to the database, display a form, save the data\
    \ that flows through the form, and display the data from the database. Through\
    \ the following class, you will get to know how MySQL and PHP will be interacting\
    \ together. You will also learn about the basics of how to create a CMS.\n\n###\
    \ Class Creation\n\nThe first step in the process is to build a PHP class and\
    \ save it in the `classCMS.php` file. See how to create the class in PHP editor:\n\
    \n```html\n<html>\n<head>\n    <title>This is PHP</title>\n</head>\n<body>\n \
    \   <?php\n    class thisisCMS {\n        var $vhost;\n        var $vusername;\n\
    \        var $vpassword;\n        var $vtable;\n        public function dis_public()\
    \ { }\n        public function dis_admin() { }\n        public function vwrite()\
    \ { }\n        public function vconnect() { }\n        private function vbuildDB()\
    \ { }\n    }\n    ?>\n</body>\n</html>\n```\n\nA class for CMS has been created\
    \ in PHP editor. There are four variables in the class and five methods. I have\
    \ used object-oriented programming to build this app because it helps to keep\
    \ the code clean in big projects. The variables will be used for connecting the\
    \ code to the database. I have left them empty for now. I will not move on to\
    \ the database and construct it with a PHP method.\n\n```php\nprivate function\
    \ vbuildDB() {\n    $sql = \"CREATE TABLE IF NOT EXISTS testDB (\n        title\
    \ VARCHAR(150),\n        bodytext TEXT,\n        created VARCHAR(100)\n    )\"\
    ;\n    return mysql_query($sql);\n}\n```\n\nThere is a `MYSQL` command in the\
    \ function that will check if `testDB` exists or not. If it does, it will pass\
    \ a notification of success and, if not, it will create a table and assign three\
    \ columns that would hold the data. The next step is to create a function that\
    \ will connect to the database:\n\n```php\npublic function vconnect() {\n    mysql_connect($this->vhost,\
    \ $this->vusername, $this->vpassword) or die(\"I am unable to connect. \" . mysql_error());\n\
    \    mysql_select_db($this->vtable) or die(\"I am unable to select the database.\
    \ \" . mysql_error());\n    return $this->vbuildDB();\n}\n```\n\nI have called\
    \ `vconnect()` to connect to the database. After that, I used `mysql_select_db()`\
    \ to ensure I save the data in the right spot. Both of these functions should\
    \ be accompanied by `die()` command. This ensures that if the function fails,\
    \ the execution of the script stops, and the programmer sees a message to decide\
    \ which direction he should move now. The `connect()` function will help you make\
    \ a connection with the database and points you in the right direction. After\
    \ that it runs `buildDB()` function. This function will run every time user loads\
    \ the page. Therefore, we ought to make sure we don’t overwrite the database with\
    \ every function call. When you have created the database, you have to fill it\
    \ with the content:\n\n```php\npublic function dis_public() {\n    $vq = \"SELECT\
    \ * FROM testDB\";\n    $vr = mysql_query($vq);\n    if ($vr !== false && mysql_num_rows($vr)\
    \ > 0) {\n        while ($va = mysql_fetch_assoc($vr)) {\n            $vtitle\
    \ = stripslashes($va['title']);\n            $bodytext = stripslashes($va['bodytext']);\n\
    \            $entry_display .= \"\n            <ENTRY_DISPLAY>\n            <h2>$vtitle</h2>\n\
    \            <p>$bodytext</p>\n            </ENTRY_DISPLAY>\";\n        }\n  \
    \  } else {\n        $entry_display = \"\n        <ENTRY_DISPLAY>\n        <h2>Here\
    \ are building a PHP app</h2>\n        <p>There are no entries on the page. Would\
    \ you like to come back soon, or just click on the link below for the addition\
    \ of a unique entry!</p>\n        </ENTRY_DISPLAY>\";\n    }\n    $entry_display\
    \ .= \"\n        <ADMIN_OPTION>\n        <p class=\\\"admin_link\\\">\n      \
    \      <a href=\\\"$_SERVER['PHP_SELF']?admin=1\\\">Please add a fresh Entry here</a>\n\
    \        </p>\n    </ADMIN_OPTION>\";\n    return $entry_display;\n}\n```\n\n\
    This is a simple function. When you call it, it will simply return the HTML markup\
    \ for the creation of the form. You will notice that in the `action` attribute\
    \ of the form element, the variable `$_SERVER['PHP_SELF']`. There is another method\
    \ known as `write()` that will allow you to save the input information:\n\n```php\n\
    public function vwrite($p) {\n    if ($p['title']) {\n        $vtitle = mysql_real_escape_string($p['title']);\n\
    \    }\n    if ($p['bodytext']) {\n        $bodytext = mysql_real_escape_string($p['bodytext']);\n\
    \    }\n    if ($vtitle && $bodytext) {\n        $vcreated = time();\n       \
    \ $sql = \"INSERT INTO testDB VALUES('$vtitle', '$bodytext', '$vcreated')\";\n\
    \        return mysql_query($sql);\n    } else {\n        return false;\n    }\n\
    }\n```\n\nThis is perhaps the most complex of the methods. You really need to\
    \ figure it out. For the purpose, you can use the `display_public()` function.\n"
  raw: 'Chapter Eight: Build Web Applications With PHP You have seen how to program
    in PHP in the past chapters. You have seen how to create a program, set up conditionals,
    and create a loop, and much more. All that knowledge gives you the power to build
    PHP programs that would work well on the web. However, you can make them better
    and easier to use. As the complexity of your programs rises, you will find a big
    number of require\_once() and includes functions. Whenever you intend to create
    a new file or make something in a common function, you can add a require\_once
    to the program. If you direct a visitor to any URL like [http://www.example.com/login.php](http://www.example.com/login.php)
    , you can be able to use auto\_prepend\_file to need a helper file before the
    login.php code which is being run. This helper file has the power to start the
    session, offer multiple functions that you can use inside of the programs, or
    load multiple files. The auto\_prepend\_file function is an integral part of the
    php.ini file, but it is common to set it in the Apache configuration by using
    the php\_value directive. Prepend File This section will explain that if you are
    looking forward to using sessions, you ought to call the session\_start() function
    on all the pages that will be using sessions. This can be pretty tough if you
    are looking forward to tracking down sessions onto multiple PHP programs. You
    can then use an auto-prepend-file to call session\_start. Create two files; one
    will be the main file, and the other will contain a prepended function to start
    a particular session. Before you perform an exercise, you ought to ensure that
    .htaccess files are working or that you can alter the Apache webserver configuration.
    Make sure that you restart Apache if you are looking forward to making a change
    to the configuration. Inside of the .htaccess file for the root of the document,
    you need to place the following code: php\_value auto\_prepend\_file “prepend.php”
    You also can add the same line inside of the following script. <Directory “/my/documentroot/path”>
    ​ php\_value auto\_prepend\_file “/my/documentroot/path/prependfile.php” </Directory>
    If the root of the document is “/var/www” you should add the line after the <Directory 
    “/var/www”>. Now open your text editor and create a fresh empty file. Inside of
    that file, you need to place the following code. <html> <head> <title>This is
    PHP</title> </head> <body> <?php if (isset($\_SESSION)) { print "Your Session
    starts!"; } else { print "Your session did not start"; } ?> </body> </html> $php
    main.php <html> <head> <title>This is PHP</title> </head> <body> Your session
    did not start</body> </html> Now save the file as session.php inside of the document
    root. You can now open the web browser and enter [http://localhost/session.php](http://localhost/session.php)
    . You can now minimize the web browser and also create a new file in the text
    editor. Now place the following code inside of the new file. <?php session\_start();
    ?> You can save this file as prepend.php in the document root. Inside of the browser,
    you can reload session.php file to view the same you created earlier on. If you
    receive a blank page or some kind of error on the browser, it means that the prepended
    file was not there. Go through the spellings to verify you have written them correctly.
    If you see a page that says, ‘Session has not started,’ chances are that you Apache
    has not detected the auto\_prepend\_file directive. If you have placed the .htaccess
    file in the document root, you ought to make sure that Apache has read the .htaccess
    file. Read on or check with the hosting provider to see if .htaccess files have
    been allowed or not. Some web server configurations have no room for .htaccess
    files. You can revise the Apache configuration to allow these files by changing
    AllowOverride to All for the directory, which has to read .htaccess file. Classes
    For Efficiency You can use classes to make your applications more efficient. You
    can create a class to define a user. After that, you can go on to adding functions,
    which are known as methods, to that user class for simple things that users might
    want to do on the web applications, such as updating the passwords. In the absence
    of classes, you might end up with multiple functions scattered around in the programs.
    This will complicate the code and make it look like a mess. Also, it will take
    a longer time to write the programs. If you write a program without classes, you
    will have to add a lot of functions to run the program properly. For example,
    if you want to write different user management programs with no classes, you will
    have to include in its different functions like setEmail, changePassword, addPermission,
    and many more. Now you will have to merge that code with another one to add different
    roles to your programs. You can write these programs without adding classes, and
    they will share the same function names as your programs do. An example of the
    name is addPermission. When you aim at merging them, you will not have any confusion
    regarding the names. If you, on the other hand, define the programs by using PHP
    classes, the addPermission function would not collide with other functions because
    the addPermission method is an integral part of the user class. You can recall
    it to create a user in a certain object-oriented manner, also known as instantiation,
    by using the New keyword. If the user class were labeled as User, you would need
    to instantiate like the following. $user = new User; Code Reuse This also is one
    of the most important aspects of programming. A majority of programmers keep sets
    of functions or programs that they can frequently reuse whenever they need them.
    Most of the reusable codes are to kick off a program to save time that would be
    spent on creating the start. When you are building modern applications in PHP,
    you might find it useful to reuse your PHP code. Functions Functions are important
    parts of PHP coding. This section of the books expands on the idea of reusing
    functions in PHP programming. With the help of the auto-prepend\_file, you can
    create a functions file that will be included in your PHP programs. These functions
    can be something as simple as kicking off a session or as complex as a login function.
    When you think you require a function in multiple files, you can use the auto\_prepend
    file. One function that you can use in several places is something to convert
    a three-letter abbreviation of the name of a state into its full name. You can
    create a function and integrate it into the prepended PHP file. Open the prepend.php
    file that we have created in the previous section. Now clear the code outside
    of prepend.php and put it in the file. <html> <head> <title>This is PHP</title>
    </head> <body> <?php if (!isset($\_SESSION)) { session\_start(); } function convertStateName($nstate)
    { $thestateList = array( "ALA" => "Alabama", "AKA" => "Alaska", "ARZ" => "Arizona",
    "ARK" => "Arkansas", "CAL" => "California", "COL" => "Colorado", "CTC" => "Connecticut",
    "DEL" => "Delaware", "FLO" => "Florida", "GGA" => "Georgia", "HWI" => "Hawaii",
    "IDA" => "Idaho", "ILI" => "Illinois", "IND" => "Indiana", "IOA" => "Iowa", "KAS"
    => "Kansas", "KTY" => "Kentucky", "LIA" => "Louisiana", "MAE" => "Maine", "MLD"
    => "Maryland", "MSA" => "Massachusetts", "MCI" => "Michigan", "MIN" => "Minnesota",
    "MIS" => "Mississippi", "MOI" => "Missouri", "MOT" => "Montana", "NEB" => "Nebraska",
    "NEV" => "Nevada", "NHM" => "New Hampshire", "NJY" => "New Jersey", "NMX" => "New
    Mexico", "NYC" => "New York", "NCA" => "North Carolina", "NDA" => "North Dakota",
    "OHO" => "Ohio", "OKA" => "Oklahoma", "ORG" => "Oregon", "PSA" => "Pennsylvania",
    "RDI" => "Rhode Island", "SCA" => "South Carolina", "SDA" => "South Dakota", "TNS"
    => "Tennessee", "TXS" => "Texas", "UTA" => "Utah", "VNT" => "Vermont", "VGA" =>
    "Virginia", "WSN" => "Washington", "WVG" => "West Virginia", "WIS" => "Wisconsin",
    "WYM" => "Wyoming" ); if (array\_key\_exists($nstate,$thestateList)) { return
    $thestateList\[$nstate\]; } else { return false; } } ?> </body> </html> Save it
    as prepend.php file in the document root. Now create another file with the following
    script. <html> <head> <title>This is PHP</title> </head> <body> <?php $stateAbbreviation
    = “WIS”; print “The State abbreviation should be “ . $stateAbbreviation . “<br>\\n”;
    $stateFull = convertState($stateAbbreviation); if ($stateFull) { print “The Full
    name of the state is “ . $stateFull . “<br>\\n”; } else { print “The Full name
    of the state is not found for {$stateAbbreviation}<br>\\n”; } ?> </body> </html>
    You ought to save this file as stateabbreviation.php at the root of the document.
    Now open up the browser and open [http://localhost/state.php](http://localhost/state.php)
    . The code will check to see if the session has started or not. If not, it will
    display an error. The function convertState will accept some arguments to convert.
    The function will set up an array that will carry full names of the state. If
    you don’t have a three-letter abbreviation, you will see an error on the screen.
    Otherwise, you will see the name of the state. App Building A majority of people
    use PHP to build different types of websites. This computer language allows programmers
    to create interactive web applications. A dynamic web application can collect
    data from the users by using HTML forms. The data procured from the users and
    saved in the database of the website remains confidential, which makes the security
    of the website a grave concern. PHP has features that allow programmers to harvest
    and securely store data. PHP contains everything a programmer needs to build web
    applications. All you need is to develop applications by using different features
    that are offered by this language. This chapter will walk you through the techniques
    of using PHP to build web applications. PHP And HTML There is no need to embed
    PHP codes into different HTML files. You can always create PHP files that don’t
    possess any HTML elements. When you are creating web applications, you will combine
    these languages into a single file. Computer experts opine that PHP had been created
    for building websites. You can combine PHP and HTML, as you have seen in the past
    examples. These languages move side by side. Let’s dissect the latest example
    that I have given in this book to understand how the two are combined. <html>
    <head> <title>This is PHP</title> </head> <body> <?php abstract class ParentClass
    { // This is an Abstract method with an argument abstract protected function theprefixName($name);
    } class ChildClass extends ParentClass { public function theprefixName($vname,
    $theseparator = ".", $vgreet = "My dear ") { if ($vname == "John Snow") { $theprefix
    = "Mister."; } else-if ($vname == "Jane Snow") { $theprefix = "Mrs."; } else {
    $theprefix = ""; } return "{$vgreet} {$theprefix}{$theseparator} {$vname}"; }
    } $class = new ChildClass; echo $class->theprefixName("John Snow"); echo "<br>";
    echo $class->theprefixName("Jane Snow"); ?> </body> </html> If you analyze the
    example, you can understand that after the body tags, the tag for PHP starts and
    it ends where the PHP script ends. In the example, <?php> signifies the beginning
    of PHP code that has been neatly embedded into the HTML body. The ?> marks the
    end of PHP script. You might notice that this example send the output through
    ‘echo.’ User Input Now that you have understood how PHP survives inside of an
    HTML file. All the modern web applications require space for user specified actions.
    Suppose there is an online bookstore which requires a login system and registration.
    Users ought to perform an action like entering the login credentials to reach
    inside of the online shop. This system requires HTML-based forms along with a
    storage for keeping the data secure in the storage. To create such an application,
    you need lots of things from each user during the registration process such as
    their usernames, passwords, and email IDs. Take a look at the following code that
    you will needing to create the application’s user-oriented feature. There is no
    PHP in this example. You will only find <html> <head><title>This is a Sign-up
    app</title></head> <body> <h1>You can freely Register Here</h1> <form method="get"
    action="thesignup.php"> <table> <tr><td>You have to fill in your Email Address:</td>
    <td><input type="text" name="your email address"/> </td></tr> <tr><td>Name:</td>
    <td><input type="text" name="first\_last\_name"/></td></tr> <tr><td>This is the
    Space For Your Desired Password:</td> <td><input type="password" name="desiredpassword"/></td></tr>
    <tr> <td colspan =‘5’> <input type="submit" name="signup" value="Sign up"/> </td>
    </tr> </table> </form> </body> </html> Building a PHP CMS It can be safely said
    that every website that is up-to-date is using some kind of content management
    system (CMS). There are a number of great options that offer us CMS to power your
    WordPress or Drupal. However, a simple PHP class can help you create a proficient
    database. You can use PHP to connect your website to the database, display a form,
    save the data that flows in through the form, and display the data from the database.
    Through the following class, you will get to know how MySQL and PHP will be interacting
    together. You will also learn about the basics of how to create a CMS. Class Creation
    The first step in the process is to build a PHP class and save it in the classCMS.php
    file. See how to create the class in PHP editor. <html> <head> <title>This is
    PHP</title> </head> <body> <?php class thisisCMS { var $vhost; var $vusername;
    var $vpassword; var $vtable; public function dis\_public() { } public function
    dis\_admin() { } public function vwrite() { } public function vconnect() { } private
    function vbuildDB() { } } ?> </body> </html> A class for CMS has been created
    in PHP editor. There are four variables in the class and five different methods.
    I have used object-oriented programming to build this CMS app because it helps
    to keep the code clean in big projects. It is also easier to approach and practice.
    The four variables will be used for connecting the code to the database. They
    will act as a bridge to access the database on a server. I have left them empty
    for now. I will not move on to the database and construct it with a PHP method.
    private function vbuildDB() { $sql = <<<MySQL\_QUERY CREATE TABLE IF NOT EXISTS
    testDB ( title​ VARCHAR(150), bodytext​ TEXT, created​ VARCHAR(100) ) MySQL\_QUERY;
    return mysql\_query($sql); } There is a MySQL command in the function that will
    check the database to verify if testDB exists or not. If it does, it will pass
    a notification of success and, if not, it will create a table and assign three
    columns that would hold the data. The next step is to create a function that will
    connect to the database. public function vconnect() { mysql\_connect($this->vhost,$this->vusername,$this->vpassword)
    or die("I am unable to connect. " . mysql\_error()); mysql\_select\_db($this->vtable)
    or die("I am unable to select the database. " . mysql\_error()); return $this->vbuildDB();
    } I have called mysql\_connect() to connect to the database. After that, I used
    mysql\_select\_db() to ensure that I save the data in the right spot. Both of
    these functions should be accompanied by the die() command. This ensures that
    if the function fails, the execution of the script stops, and the programmer sees
    a message to decide in which direction he should move now. The connect() function
    will help you make a connection with the database and points you in the right
    direction. After that it runs buildDB() function. This function will run every
    time a user loads the page. Therefore, we ought to make sure that we are don’t
    overwrite the database with every function call. When you have created the database,
    you have to fill it in with the content. public function dis\_admin() { return
    <<<ADMIN\_FORM <form action="{$\_SERVER\[''PHP\_SELF''\]}" method="post"> <label
    for="this is the title">Title:</label> <input name="this is the title" id="title"
    type="text" maxlength="200" /> <label for="bodytext">Body Text:</label> <textarea
    name="bodytext" id="bodytext"></textarea> <input type="submit" value="Please create
    An Entry!" /> </form> ADMIN\_FORM; } This is a simple function. When you call
    it, it will simply return the HTML markup for the creation of the form. You will
    notice that in the action attribute of the form element, the variable $\_SERVER\[‘PHP\_SELF’\].
    There is another method known as writeit() that will allow you to save the input
    information. public function vwrite($p) { if ( $p\[''vtitle''\] ) $vtitle = mysql\_real\_escape\_string($p\[''vtitle''\]);
    if ( $p\[''vbodytext''\]) $vbodytext = mysql\_real\_escape\_string($p\[''vbodytext''\]);
    if ( $vtitle && $vbodytext ) { $vcreated = time(); $sql = "You are required to
    INSERT the testDB VALUES(''$vtitle'',''$vbodytext'',''$vcreated'')"; return mysql\_query($sql);
    } else { return false; } } Through the function call, you are passing a variable.
    The variable $p will hold the information sent from the form with the help of
    the post method. Once you get into the function, you may start with the help of
    a conditional statement. Now that you have put information into the database,
    you may move on to carving out a way to get that information back and display
    it. For the purpose, you can use the display\_public() function. This is perhaps
    the most complex of the methods. You really need to figure it out. public function
    dis\_public() { $vq = "SELECT \* FROM testDB"; $vr = mysql\_query($vq); if ( $vr
    !== false && mysql\_num\_rows($vr) > 0 ) { while ( $va = mysql\_fetch\_assoc($vr)
    ) { $vtitle = stripslashes($va\[''vtitle''\]); $vbodytext = stripslashes($va\[''vbodytext''\]);
    $entry\_display .= <<<ENTRY\_DISPLAY <h2>$vtitle</h2> <p> $vbodytext </p> ENTRY\_DISPLAY;
    } } else { $entry\_display = <<<ENTRY\_DISPLAY <h2>Here we are building a PHP
    app</h2> <p> There are no entries on the page. Would you like to come back soon,
    or just click on the link below for the addition of a unique entry! </p> ENTRY\_DISPLAY;
    } $entry\_display .= <<<ADMIN\_OPTION <p class="admin\_link"> <a href="{$\_SERVER\[''PHP\_SELF''\]}?admin=1">Please
    add a fresh Entry here</a> </p> ADMIN\_OPTION; return $entry\_display; } You can
    see how PHP and MySQL are interacting with each other. I asked the database a
    query to which it replied with a result. The result is not very handy until you
    succeed in decoding it by using a streak of methods that would fetch and organize
    the raw information, contained inside a usable form, otherwise known as an array.
    The query is set up with the $vq variable. In MySQL, the asterisk (\*) operator
    means everything. Hence, the query requests the database to select almost everything
    from the entries in the testDB. The entries will be displayed in reverse chronological
    order. As the query has been defined, we can now send it to the database by using
    the function mysql\_query(). The result will be stored in the variable $vr. The
    conditional statement “IF mysql\_query() in the script runs after that. If the
    variable $vr contains entries from the database, you will have to fetch the data.
    The information will be displayed in the form of an array, which is generally
    organized similarly to the table itself. The function mysql\_fetch\_assoc() will
    analyze the resource and break it down into associative array. The function will
    fetch one entry at a time. If you want to retrieve all the entries, you can use
    a while loop just like I have inserted in the code. The data contains slashed
    that are added after we save the information to the database. That’s why you see
    stripslashes() in the code. There is a link to the bottom of the web app that
    allows users to add a fresh entry to the database when they visit the website.
    You will have to create a new file and save your class in it. Name it displayclass.pgp.
    Save it in the same folder where you have saved classCMS.php. <html lang="en">
    <head> <title>classCMS</title> </head> <body> <?php include\_once(''\_class/classCMS.php'');
    $obj = new classCMS(); $obj->vhost = ''database.host.net''; $obj->vusername =
    ''DB1234567''; $obj->vpassword = ''DBpassword''; $obj->vtable = ''DB1234567'';
    $obj->vconnect(); if ( $\_POST ) $obj->vwrite($\_POST); echo ( $\_GET\[''admin''\]
    == 1 ) ? $obj->dis\_admin() : $obj->dis\_public(); ?> </body> </html> While building
    this kind of application in which you have to handle user input, the foremost
    thing is to keep in mind that you should not trust anyone, especially the people
    who are using your website. People are in the habit of doing some unexpected stuff,
    whether on purpose or by accident, which means that they might hit upon bugs or
    other vulnerabilities in the website and exploit them for their personal benefit.
    Common Errors Programmers tend to make a lot of errors during the scriptwriting
    phase. Here is a rundown of the most common and fatal errors that programmers
    make when they build an application with PHP. Global Variables In some cases,
    programmers fail to initialize global variables in the right way. You may prevent
    the mistake by setting up register\_globals directive to off. The users, whose
    register\_globals are on might be abuse your website application. Customers might
    gain admin-level access to the system by running arbitrary codes on the website. '
