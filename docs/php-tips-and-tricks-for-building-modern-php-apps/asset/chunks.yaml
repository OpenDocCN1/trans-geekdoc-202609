    -   通过开始菜单进入 Apache HTTPD Server 文件夹打开 `httpd.conf`。点击 `Configure Apache Server`，然后选择
    `Edit Configuration`。如果你在开始菜单中没有找到 `Edit Configuration`，可以在硬盘上找到 `httpd.conf`。你可以在安装
    Apache 的目录下找到它。使用记事本（Notepad）等文本编辑器打开该文件。


    -   现在是时候激活 PHP 模块了。在文件中查找 `LoadModule` 语句部分，然后找到以下此行：


    ```apache

    #LoadModule php5_module “c:/php/php5apache2_2.dll.”

    ```

    如果你想激活该模块，可以删除行开头的 `#`。模块名称可能会根据你所使用的 PHP 版本和 Apache 版本而不同。


    -   你需要告诉 Apache 哪些文件是 PHP 程序，哪些不是。找到描述 `AddType` 的部分。该部分可能包含来自其他软件的一行或多个 `AddType`
    行。PHP 的行如下：


    ```apache

    AddType application/x-httpd-php .php

    ```

    找到该行。如果你发现该行开头有井号（#），请将其删除。如果没有该行，你可以将其添加到 `AddType` 语句列表中。


    -   在较新版本的 Windows 中，你可以通过点击开始菜单“程序”，然后是“Apache HTTPD Server”，最后点击 `Control Apache
    Server` 来启动 Apache 服务。现在选择 `Start` 或 `Restart`。


    ## PHP 配置

    PHP 使用名为 `php.ini` 的文件的不同设置来控制其行为。PHP 在启动时会查找 `php.ini` 并使用其设置。除非进行更改，否则 `php.ini`
    的默认位置是以下位置之一。如果尚未安装 `php.ini` 文件，你现在必须安装。你可以寻找带有默认设置的 `php.ini-dist` 文件。该文件包含在
    PHP 分包中。你可以将该文件复制到适当的位置（如上述默认位置），并将文件重命名为 `php.ini`。


    如果你安装了如 `PHP 4.3` 等版本的 PHP，可以为 `PHP 5` 或 `6` 创建备份。然后查看当前正在使用的设置。要配置 PHP，请打开并编辑
    `php.ini` 文件。然后更改你需要修改的设置。


    如果你正在使用 `PHP 5` 或更早版本，需要关闭魔术引号（magic quotes）。搜索以下行：`magic_quotes-gpc On`。将 `On`
    改为 `Off`。如果你在 Windows 上使用 `PHP 5` 或 `PHP 6`，你需要激活 `mysql` 或 `mysqli` 支持。你应该删除分号以使设置生效。此外，将
    `1` 改为 `0`。更改后的行如下所示：


    ```ini

    cgi.force_redirect = 0

    ```

    如果你正在使用 `PHP 5` 或更高版本，你需要设置本地时区。现在保存 `php.ini` 文件并重启你的 Web 服务器。


    ## 第二章：PHP 基础

    PHP 是一种用于 Web 的脚本语言。它具有广泛的功能，可以帮助你完成开发动态 Web 应用所需的任务。本章将带你了解编写 PHP 脚本的基础知识，例如适用于不同
    PHP 语句的规则。你可以将这些规则视为普通的标点符号规则。


    PHP 软件的工作方式就像 Web 服务器。当你在浏览器的地址栏中输入 `URL` 时，你会向 Web 服务器发送一条消息，告诉它发送一个 HTML 文件。Web
    服务器将通过发送你请求的文件来响应。浏览器将读取该 HTML 文件并显示网页。


    当安装 PHP 时，Web 服务器通常配置为期望文件扩展名包含某些 PHP 语句。扩展名通常为 `.phtml` 或 `.php`。当 Web 服务器接收到带有指定扩展名的文件请求时，它将按原处理
    HTML 语句。PHP 语句不是浏览器的一部分，因此 PHP 代码对用户是隐藏的。


    创建 HTML 页面超文本标记语言也是一种 Web 语言。当你在 浏览器（如 Google Chrome、Firefox 和 Safari）中打开网页时，浏览器会下载该页面，你看到的就是
    HTML 页面。HTML 就像文档，与你在文字处理器中创建的文档非常相似。查看和编辑文档需要像 MS Word 这样的程序，因为 MS Processor
    只能读取该格式。在 HTML 的情况下，Web 浏览器就是读取并显示用 HTML 创建的的程序。与文字处理器不同，你不能通过浏览器创建 HTML 文档。你必须借助编辑器来创建
    HTML 文档。编辑器可以是简单的如记事本，也可以复杂的如 Microsoft Visual Studio。我们必须理解 HTML，因为我们需要这种语言来嵌入
    PHP 并在浏览器中运行。所有的 HTML 文档都应该以 `<!DOCTYPE html>` 开头。


