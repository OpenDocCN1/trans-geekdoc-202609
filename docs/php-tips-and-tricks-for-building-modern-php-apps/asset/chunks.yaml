    # PERCENT Clause


    An interesting statement that you can use in a state in which you have to work
    speedily is the `PERCENT` clause. If you don’t know how many records are there
    in the table, you can slice off the table through the middle, carving out the
    bottom 50 percent and displaying the top 50 percent. Here is the table in the
    database.


