    ### This is how you can insert heading 3


    #### Analyzing the Script of PHP

    PHP is well-known as an embedded scripting language when it is used in web pages.
    It means that you have to use it in an embedded form in HTML code. You have to
    use HTML tags to write the PHP language. The process is the same as with other
    HTML documents. You can create and then edit different web pages that contain
    PHP in the same way you create and edit other HTML pages.


    The PHP language statements are generally enclosed in the specific PHP tags. A
    PHP script may be placed at any position in a word document. The script starts
    with `<?php` and it ends with `?>`.


    ```html

    <html>

    <head>

    <title>This is an example of how a PHP script looks like</title>

    </head>

    <body>

    <?php echo "<h1>We are entering the world of app development by PHP!</h1>\n";
    ?>

    </body>

    </html>

    ```


    ```php

    main.php

    ```


    ```html

    <html>

    <head>

    <title>This is an example of how a PHP script looks like</title>

    </head>

    <body>

    <h1>We are entering the world of app development by PHP!</h1>

    </body>

    </html>

    ```


    The browser doesn’t show the PHP script in the code. You also can use a shorter
    version of PHP tags by using just `<?` and `?>`. If you enable short tags, you
    can be able to spare some time. One problem is that your scripts are not going
    to run effectively if you move them to another web host where you have not activated
    PHP short tags.


    All PHP statements are processed in between these PHP tags. After the browser
    has processed the PHP section, it discards it. If there is an output, the PHP
    section is replaced by the output as you have seen in the above-mentioned example.
    There can be more than one section to a PHP script. Here is the example.


    ```html

    <html>

    <head>

    <title>This is an example of how a PHP script looks like</title>

    </head>

    <body>

    <?php echo "<h1>We are entering the world of app development by PHP!</h1>\n";
    ?>

    <?php echo "<h2>I am learning app development by PHP!</h1>\n"; ?>

    </body>

    </html>

    ```


    The result of the above script is as under:


    ```php

    main.php

    ```


    ```html

    <html>

    <head>

    <title>This is an example of how a PHP script looks like</title>

    </head>

    <body>

    <h1>We are entering the world of app development by PHP!</h1>

    <h2>I am learning app development by PHP!</h2>

    </body>

    </html>

    ```


    If you have been acquainted with Python, you might know that Python is case sensitive.
    It means that in Python the two words `class` and `CLASS` are case sensitive.
    Let’s see how PHP deals with the variety of cases.


    ```html

    <html>

    <head>

    <title>This is an example of how a PHP script looks like</title>

    </head>

    <body>

    <?php echo "<h1>We are entering the world of app development by PHP!</h1>\n";
    ?>

    <?php Echo "<h2>I am learning app development by PHP!</h1>\n"; ?>

    <?php ECHO "<h2>I am learning app development by PHP!</h1>\n"; ?>

    </body>

    </html>

    ```


    I have written the same script with three different cases. Let’s see the results
    now.


    ```php

    main.php

    ```


    ```html

    <html>

    <head>

    <title>This is an example of how a PHP script looks like</title>

    </head>

    <body>

    <h1>We are entering the world of app development by PHP!</h1>

    <h2>I am learning app development by PHP!</h2>

    <h2>I am learning app development by PHP!</h2>

    </body>

    </html>

    ```


    All PHP keywords like `if`, `class` and `echo` are not case-sensitive, however,
    PHP variables are.


    ```html

    <html>

    <head>

    <title>This is an example of how a PHP script looks like</title>

    </head>

    <body>

    <?php

    $color = "blue";

    echo "My car is " . $color . "<br>";

    echo "My shoes is " . $COLOR . "<br>";

    echo "My coat is " . $coLOR . "<br>";

    ?>

    </body>

    </html>

    ```


    Browser doesn’t understand when the case is changed. If you are using an editor
    to write your scripts, you will see error messages at the bottom of the page.


    ```php

    main.php

    ```


    ```html

    <html>

    <head>

    <title>This is an example of how a PHP script looks like</title>

    </head>

    <body>

    My car is blue<br>

    My shoes is <br>

    My coat is <br>

    </body>

    </html>

    ```


