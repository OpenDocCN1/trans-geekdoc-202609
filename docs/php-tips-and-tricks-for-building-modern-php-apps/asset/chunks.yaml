    ?> </body> </html> You can add other keywords like fread() and fclose() to read
    a file and close it after that. Exception Handling An exception is a particular
    object that reveals an error or any other unexpected behavior of the PHP script.
    PHP functions or classes are usually carry many exceptions. Exceptions are a better
    way to stop a particular function when it comes across the data that it cannot
    use. The throw statement permits a user defined function or a method to throw
    a particular function. When a particular exception is thrown, the following code
    will not be executed. It the exception is never caught, a fatal error will occur.
    <html> <head> <title>This is PHP</title> </head> <body> <?php function thedivide($thedividend,
    $thedivisor) { if($thedivisor == 0) { throw new Exception("This is a division
    by zero"); } return $thedividend / $thedivisor; } try { echo thedivide(10, 0);
    } catch(Exception $e) { echo "This is something unable to be divided."; } ?> </body>
