    ```


    如果你熟悉 Python，你可能知道 Python 是区分大小大小的。这意味着在 Python 中，`class` 和 `CLASS` 两个单词是大小敏感的。让我们看看
    PHP 如何处理各种大小写情况。


    ```html

    <html>

    <head>

    <title>这是一个 PHP 脚本外观所示的示例</title>

    </head>

    <body>

    <?php echo "<h1>我们正在通过 PHP 进入应用开发的世界！</h1>\n"; ?>

    <?php Echo "<h2>我正在通过 PHP 学习应用开发！</h1>\n"; ?>

    <?php ECHO "<h2>我正在通过 PHP 学习应用开发！</h1>\n"; ?>

