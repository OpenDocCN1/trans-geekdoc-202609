  trans: "\n当用户填写表单并点击提交按钮时，数据将传递到一个名为 `Wewelcomeyou.php` 的 PHP 文件进行处理。表单通过 `HTTP\
    \ POST` 方法发送。如果你想显示提交的数据，可以简单地 `echo` 这些变量。如果你使用 `$GET` 方法发送表单，它对所有人可见。所有的名称和值都将显示在\
    \ URL 中。它还对你想要发送的信息大小有限制。变量将显示在 URL 中，因此无法在该页面上创建书签。你也可以使用 `POST` 方法创建表单，但问题是在此方法中，信息将对其他人可见。\n\
    \n在下一个代码示例中，你将看到新的变量，它们将帮助你为所有必填字段添加错误消息。对于每个 `$_POST` 变量都会有一个 `if-else` 语句。它将检查\
    \ `$_POST` 变量是否为空，如果不为空，你会看到封装在不同错误变量中的错误消息。它通过 `test_input()` 函数发送用户输入。\n\n```html\n\
    <html>\n<head>\n    <title>这是 PHP</title>\n</head>\n<body>\n<?php\n    // 你应该定义变量并将它们置为空\n\
    \    $pnameErr = $pemailErr = $pgenderErr = $pwebsiteErr = \"\";\n    $pname =\
    \ $pemail = $pgender = $pcomment = \"\";\n    if ($_SERVER[\"REQUEST_METHOD\"\
    ] == \"POST\") {\n        if (empty($_POST[\"name\"])) {\n            $pnameErr\
    \ = \"你需要姓名\";\n        } else {\n            $pname = test_input($_POST[\"name\"\
    ]);\n        }\n        if (empty($_POST[\"email\"])) {\n            $pemailErr\
    \ = \"你需要邮箱\";\n        } else {\n            $pemail = test_input($_POST[\"email\"\
    ]);\n        }\n        if (empty($_POST[\"website\"])) {\n            $pwebsiteErr\
    \ = \"\";\n        } else {\n            $pwebsite = test_input($_POST[\"website\"\
    ]);\n        }\n        if (empty($_POST[\"comment\"])) {\n            $pcomment\
    \ = \"\";\n        } else {\n            $pcomment = test_input($_POST[\"comment\"\
    ]);\n        }\n        if (empty($_POST[\"gender\"])) {\n            $pgenderErr\
    \ = \"你需要性别\";\n        }\n else {\n            $pgender = test_input($_POST[\"\
    gender\"]);\n        }\n    }\n?>\n</body>\n</html>\n```\n\n### PHP 文件处理\n异常处理是程序员认为软件开发中最困难的部分。程序错误、网络故障和数据库故障为程序员带来了许多严重问题。开发者应该在编写阶段检测故障，添加检查，并调用相应的函数来管理它们。异常帮助你在无需编写\
    \ `if` 语句的情况下编写强大的程序。\n\nPHP 日期有很多类型。添加到 Web 应用程序中最基本的方法是 PHP `date()` 函数。该函数的格式参数指定了如何格式化日期和时间。查看用于日期的字符：\n\
    - `d` 字符代表每月 01 到 31。\n- `m` 字符代表每年 01 到 12。\n- `Y` 参数代表四位数的年份。\n- `l` 代表星期。\n\
    \n```html\n<html>\n<head>\n    <title>这是 PHP</title>\n</head>\n<body>\n<?php\n\
    \    echo \"日期是 \" . date(\"Y/m/d\") . \"<br>\";\n    echo \"日期是 \" . date(\"\
    Y.m.d\") . \"<br>\";\n    echo \"日期是 \" . date(\"Y-m-d\") . \"<br>\";\n    echo\
    \ \"星期是 \" . date(\"l\");\n?>\n</body>\n</html>\n```\n\n```php\nmain.php\n```\n\
    ```html\n<html>\n<head>\n    <title>这是 PHP</title>\n</head>\n<body>\n    日期是 2020/06/23<br>\n\
    \    日期是 2020.06.23<br>\n    日期是 2020-06-23<br>\n    今天是星期二\n</body>\n</html>\n\
    ```\n\n当新年开始时，你可以通过以下方法更新 Web 应用程序的版权年份：\n`&copy; 2020-<?php echo date(\"Y\");?>`\n\
    \n这是一个让 PHP 估计四个月后准确日期的示例：\n\n```html\n<html>\n<head>\n    <title>这是 PHP</title>\n\
    </head>\n<body>\n<?php\n    $d=strtotime(\" tomorrow \");\n    echo date(\"m-d-y\
    \ h:i:sa\", $d) . \"<br>\";\n    $d=strtotime(\" next Friday \");\n    echo date(\"\
    \ m-d-y h:i:sa \", $d) . \"<br>\";\n    $d=strtotime(\" +4 Months \");\n    echo\
    \ date(\" m-d-y h:i:sa \", $d) . \"<br>\";\n    $d=strtotime(\" +8 Months \");\n\
    \    echo date(\" m-d-y h:i:sa \", $d) . \"<br>\";\n    $d=strtotime(\"+1 Month\
    \ \");\n    echo date(\" m-d-y h:i:sa \", $d) . \"<br>\";\n    $d=strtotime(\"\
    \ next Wednesday \");\n    echo date(\" m-d-y h:i:sa \", $d) . \"<br>\";\n?>\n\
    </body>\n</html>\n```\n\n```php\nmain.php\n```\n```html\n<html\n<head>\n    <title>这是\
    \ PHP</title>\n</head>\n<body>\n    06-24-20 12:00:00am<br>\n    06-26-20 12:00:00am\
    \ <br>\n    10-23-20 05:13:14am<br>\n    02-23-21 05:13:14am<br>\n    07-23-20\
    \ 05:13:14am<br>\n    06-24-20 12:00:00am<br>\n</body>\n</html>\n```\n\n### 更多示例\n\
    ```html\n<html\n<head>\n    <title>这是 PHP</title>\n</head>\n<body>\n<?php\n  \
    \  $thestartdate = strtotime(\"Friday\");\n    $theenddate = strtotime(\"+36 weeks\"\
    , $thestartdate);\n    while ($thestartdate < $theenddate) {\n        echo date(\"\
    M d Y\", $thestartdate) . \"<br>\";\n        $thestartdate = strtotime(\"+1 day\"\
    , $thestartdate);\n    }\n?>\n</body>\n</html>\n```\n\n```php\nmain.php\n```\n\
    ```html\n<html\n<head>\n    <title>这是 PHP</title>\n</head>\n<body>\n    <!-- 为了简洁，省略日期循环的输出\
    \ -->\n</body>\n</html>\n```\n\n### 包含因素\n为了在页面中包含底部文件，你应该使用 `include` 语句。\n\n\
    ```html\n<html\n<head>\n    <title>这是 PHP</title>\n</head>\n<body>\n<?php include\
    \ 'footer.php'; ?>\n</body>\n</html>\n```\n"
