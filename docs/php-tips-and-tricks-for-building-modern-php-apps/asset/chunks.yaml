  trans: "\n\n# 第四章：高级 PHP\n\n应用程序通常需要在脚本的多个位点执行多个任务。PHP 函数允许你根据需要在多个位置复用相同的代码。函数通常来说是\
    \ PHP 中的一组语句，设计用于执行特定的任务。\n\n## PHP 函数\n\n在接下来的示例中，我将创建一个 PHP 函数示例。函数中的大括号标记了函数的开始和结束。当你需要调用函数时，只需简单编写它的名称即可。\n\
    \n```html\n<<html>\n<head>\n    <title>This is PHP function</title>\n</head>\n\
    <body>\n<?php\nfunction greetings() { \n    echo \"Good morning! Hope you are\
    \ fine!\"; \n}\ngreetings(); // 这就是调用函数的方式\n?>\n</body>\n</html>\n```\n\n```bash\n\
    $php main.php\n```\n\n```html\n<html\n<head>\n    <title>This is PHP function</title>\n\
    </head>\n<body>\n    Good morning! Hope you are fine!\n</body>\n</html>\n```\n\
    \n看另一个示例。\n\n```html\n<html\n<head>\n    <title>This is PHP function</title>\n\
    </head>\n<body>\n<?php\nfunction format_your_name() { \n    global $formatted_name;\
    \ \n    $your_first_name = \"Chris\"; \n    $your_last_name = \"Angel\"; \n  \
    \  $formatted_name = $your_last_name. \",\" .$your_first_name; \n}\nformat_your_name();\n\
    echo \"$formatted_name\";\n?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n\
    ```\n\n```html\n<html\n<head>\n    <title>This is PHP function</title>\n</head>\n\
    <body>\n    Angel,Chris\n</body>\n</html>\n```\n\n如果你必须在函数外部创建变量，除非在代码中插入全局变量，否则你无法这样做。请参见变量放置在脚本外部的示例。\n\
    \n## 参数\n\n你可以通过参数向函数传递信息。参数的作用就像变量一样。它们指定在函数名称后面的括号内。你可以向函数中添加任意数量的变量。\n\n```html\n\
    <html\n<head>\n    <title>This is PHP function</title>\n</head>\n<body>\n<?php\n\
    function greetings($name) { \n    echo \"$name, welcome to the bachelor's club.<br>\"\
    ; \n}\ngreetings(\"John\");\ngreetings(\"Sylvia\");\ngreetings(\"Sim\");\ngreetings(\"\
    Kai Jim\");\ngreetings(\"Ben\");\n?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n\
    ```\n\n```html\n<html\n<head>\n    <title>This is PHP function</title>\n</head>\n\
    <body>\n    John, welcome to the bachelor's club.<br>\n    Sylvia, welcome to\
    \ the bachelor's club.<br>\n    Sim, welcome to the bachelor's club.<br>\n   \
    \ Kai Jim, welcome to the bachelor's club.<br>\n    Ben, welcome to the bachelor's\
    \ club.<br>\n</body>\n</html>\n```\n\n你还可以通过添加更多参数来扩展脚本。在下一个示例中，我将在脚本中添加两个参数。\n\
    \n```html\n<html\n<head>\n    <title>This is PHP function</title>\n</head>\n<body>\n\
    <?php\nfunction greetings($name, $year) { \n    echo \"$name, welcome to the adult's\
    \ club. I suppose you are born in $year <br>\"; \n}\ngreetings(\"John\" , \"1999\"\
    );\ngreetings(\"Sylvia\" , \"1988\");\ngreetings(\"Sim\" , \"1995\");\ngreetings(\"\
    Kai Jim\" , \"2001\");\ngreetings(\"Ben\" , \"2002\");\n?>\n</body>\n</html>\n\
    ```\n\n```bash\n$php main.php\n```\n\n```html\n<html\n<head>\n    <title>This\
    \ is PHP function</title>\n</head>\n<body>\n    John, welcome to the adult's club.\
    \ I suppose you are born in 1999 <br>\n    Sylvia, welcome to the adult's club.\
    \ I suppose you are born in 1988 <br>\n    Sim, welcome to the adult's club. I\
    \ suppose you are born in 1995 <br>\n    Kai Jim, welcome to the adult's club.\
    \ I suppose you are born in 2001 <br>\n    Ben, welcome to the adult's club. I\
    \ suppose you are born in 2002 <br>\n</body>\n</html>\n```\n\n## 默认值\n\n你可以为参数使用默认值，这样如果你留空参数部分仍然可以调用函数。\n\
    \n```html\n<html\n<head>\n    <title>This is PHP function</title>\n</head>\n<body>\n\
    <?php\nfunction greetings($name = \"Tom\", $year = 1996) { \n    echo \"$name,\
    \ welcome to the adult's club. I suppose you are born in $year <br>\";\n}\ngreetings(\"\
    John\" , \"1999\");\ngreetings(\"Sylvia\" , \"1988\");\ngreetings();\ngreetings(\"\
    Kai Jim\" , \"2001\");\ngreetings();\n?>\n</body>\n</html>\n```\n\n```bash\n$php\
    \ main.php\n```\n\n```html\n<html\n<head>\n    <title>This is PHP function</title>\n\
    </head>\n<body>\n    John, welcome to the adult's club. I suppose you are born\
    \ in 1999 <br>\n    Sylvia, welcome to the adult's club. I suppose you are born\
    \ in 1988 <br>\n    Tom, welcome to the adult's club. I suppose you are born in\
    \ 1996 <br>\n    Kai Jim, welcome to the adult's club. I suppose you are born\
    \ in 2001 <br>\n    Tom, welcome to the adult's club. I suppose you are born in\
    \ 1996 <br>\n</body>\n</html>\n```\n\n## 返回值\n\n如果你想让函数返回值，必须在代码中插入 `return` 语句。\n\
    \n```html\n<html\n<head>\n    <title>This is PHP function</title>\n</head>\n<body>\n\
    <?php\nfunction sumup(int $a, int $b) { \n    $c = $a + $b; \n    return $c;\n\
    }\necho \"45 + 10 = \" . sumup(45, 10) . \"<br>\";\necho \"57 + 13 = \" . sumup(57,\
    \ 13) . \"<br>\";\necho \"29 + 41 = \" . sumup(29, 41);\n?>\n</body>\n</html>\n\
    ```\n\n```bash\n$php main.php\n```\n\n```html\n<html\n<head>\n    <title>This\
    \ is PHP function</title>\n</head>\n<body>\n    45 + 10 = 55<br>\n    57 + 13\
    \ = 70<br>\n    29 + 41 = 70\n</body>\n</html>\n```\n\n## 插入正确的参数\n\n函数对你需要传递的值非常敏感。如果你发送的值不够，函数将检测到缺失的值。当你执行代码时会看到警告消息。\n\
    \n```html\n<html\n<head>\n    <title>This is PHP function</title>\n</head>\n<body>\n\
    <?php\nfunction greetings($name , $year) { \n    echo \"$name, welcome to the\
    \ adult's club. I suppose you are born in $year <br>\"; \n}\ngreetings(\"John\"\
    \ , 1999);\ngreetings( \"Sim\", 1988);\ngreetings(\"Drake\" , 2000);\ngreetings(\"\
    Kai Jim\" , 2001);\ngreetings( 2002);\n?>\n</body>\n</html>\n```\n\n```bash\n\
    $php main.php\n```\n\n```html\n<html\n<head>\n    <title>This is PHP function</title>\n\
    </head>\n<body>\n    John, welcome to the adult's club. I suppose you are born\
    \ in 1999 <br>\n    Sim, welcome to the adult's club. I suppose you are born in\
    \ 1988 <br>\n    Drake, welcome to the adult's club. I suppose you are born in\
    \ 2000 <br>\n    Kai Jim, welcome to the adult's club. I suppose you are born\
    \ in 2001 <br>\n     PHP Fatal error: Uncaught ArgumentCountError: Too few arguments\
    \ to function greetings(), 1 passed in /home/cg/root/1842013/main.php on line\
    \ 15 and exactly 2 expected in /home/cg/root/1842013/main.php:7 Stack trace: #0\
    \ /home/cg/root/1842013/main.php(15): greetings(2002) #1 {main} thrown in /home/cg/root/1842013/main.php\
    \ on line 7\n</body>\n</html>\n```\n\n你可以看到缺失参数触发的错误。\n\n"
- fmt: "\n# Chapter Five: Object-Oriented Programming\n\nObject-oriented programming\
    \ (OOP) is a particular approach to programming that spans around classes and\
    \ objects. It is one of the most popular uses of PHP nowadays. PHP5 was released\
    \ as an improved version of object-oriented programming. It had more speed and\
    \ improved features. Object-oriented programming, OOP in its short form, is not\
    \ about using a different syntax, it is about giving you a different approach\
    \ to analyze problems and carve out their solutions. In OOP, the script is seen\
    \ as a bunch of different objects, which represent the elements of the problem\
    \ the script has to solve. If the script is about a used-car lot, the objects\
    \ can be customers and cars. OOP has brought to light new concepts and terminology.\n\
    \n## Classes\n\nOne of the basic elements of object-oriented programming is objects.\
    \ You can take them as physical objects in the form of codes. A PHP object can\
    \ be a car, a cat, or a dog. You can give them certain properties, known as attributes\
    \ in the world of programming. For example, a cat can have attributes like sitting\
    \ down, rolling on the ground, etc. A car can have attributes like color, model,\
    \ and company name.\n\nA class in PHP code serves as the template that is used\
    \ for the creation of an object. The class generally defines the attributes, the\
    \ properties of a particular object. It will also define a wide range of things\
    \ that the object does like its responsibilities. You write a class that would\
    \ define a car with an engine and four wheels. The class lists the things that\
    \ a car can do, like it can move forward and park as well.\n\nYou also can write\
    \ a statement like the one as under:\n\n```html\n<html>\n<head>\n<title>This is\
    \ PHP function</title>\n</head>\n<body>\n<?php\nclass Vegetables {\n    // these\
    \ are the Properties\n    public $vname;\n    public $vcolor;\n    // these are\
    \ the Methods\n    function set_name($vname) {\n        $this->vname = $vname;\n\
    \    }\n    function get_name() {\n        return $this->vname;\n    }\n}\n?>\n\
    </body>\n</html>\n```\n\nIn classes, variables are labeled as properties while\
    \ functions are dubbed as methods. Classes are nothing without objects. You can\
    \ have the liberty to create a wide range of objects from a single class. Each\
    \ object contains certain properties and methods that are defined in that class,\
    \ however, they have varying property values. The `new` keyword is used to create\
    \ objects of a class. Then there are instances of the class `Vegetables`.\n\n\
    ```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
    <?php\nclass Vegetables {\n    // these are the Properties\n    public $vname;\n\
    \    public $vcolor;\n    // these are the Methods\n    function set_name($vname)\
    \ {\n        $this->vname = $vname;\n    }\n    function get_name() {\n      \
    \  return $this->vname;\n    }\n}\n$potato = new Vegetables();\n$beet = new Vegetables();\n\
    $potato->set_name('Potato');\n$beet->set_name('Beet');\necho $potato->get_name();\n\
    echo \"<br>\";\necho $beet->get_name();\n?>\n</body>\n</html>\n```\n`$php main.php`\n\
    \n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
    Potato<br>Beet\n</body>\n</html>\n```\n\nIn the next code snippet, I’ll add two\
    \ more methods to the same vegetable class. I have added the methods to add color\
    \ to the object.\n\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n\
    </head>\n<body>\n<?php\nclass Vegetables {\n    // these are the Properties\n\
    \    public $vname;\n    public $vcolor;\n    // these are the Methods\n    function\
    \ set_name($vname) {\n        $this->vname = $vname;\n    }\n    function get_name()\
    \ {\n        return $this->vname;\n    }\n    function set_color($vcolor) {\n\
    \        $this->vcolor = $vcolor;\n    }\n    function get_color() {\n       \
    \ return $this->vcolor;\n    }\n}\n$potato = new Vegetables();\n$beet = new Vegetables();\n\
    $potato->set_name('Potato');\n$potato->set_color('Red');\n$beet->set_name('Beet');\n\
    $beet->set_color('Blue');\necho $potato->get_name();\necho \"Color: \" . $potato->get_color();\n\
    echo \"<br>\";\necho $beet->get_name();\necho \"<br>\";\necho \"Color: \" . $beet->get_color();\n\
    ?>\n</body>\n</html>\n```\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>This\
    \ is PHP function</title>\n</head>\n<body>\nPotatoColor: Red<br>Beet<br>Color:\
    \ Blue\n</body>\n</html>\n```\n\n## Vegetable Class\n\nWhen you have to define\
    \ a class, you should declare the properties right at the top. There is no need\
    \ to declare the variables. You can just use them as you deem fit without declaring\
    \ them. However, it is better to declare the properties when you are creating\
    \ a class. This makes classes much easier to decipher. If you leave it out, it\
    \ will be considered a poor programming practice.\n\nYou will need a keyword for\
    \ each property declaration; that’s how you can access them.\n\n- The first keyword\
    \ is `public` through which you can access the property from outside the class\
    \ from another class or the script.\n- The second keyword is `private` through\
    \ which you cannot access the property from outside of the class.\n- The third\
    \ keyword is `protected` through which you cannot access it from the outside.\n\
    \n## The Constructor Function\n\nA PHP constructor allows you to initialize the\
    \ properties of an object upon the creation of the object. PHP will call the function\
    \ when you make an object from a class.\n\n```html\n<html>\n<head>\n<title>This\
    \ is PHP function</title>\n</head>\n<body>\n<?php\nclass Vegetables {\n    //\
    \ these are the Properties\n    public $vname;\n    public $vcolor;\n    // these\
    \ are the Methods\n    function __construct($vname) {\n        $this->vname =\
    \ $vname;\n    }\n    function get_name() {\n        return $this->vname;\n  \
    \  }\n}\n$potato = new Vegetables(\"Potato\");\necho $potato->get_name();\n?>\n\
    </body>\n</html>\n```\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>This\
    \ is PHP function</title>\n</head>\n<body>\nPotato\n</body>\n</html>\n```\n\n\
    I am going to add another feature of color to the existing code. Take a look at\
    \ the changes in `__construct`.\n\n```html\n<html>\n<head>\n<title>This is PHP\
    \ function</title>\n</head>\n<body>\n<?php\nclass Vegetables {\n    // these are\
    \ the Properties\n    public $vname;\n    public $vcolor;\n    public $weight;\n\
    \    public $shape;\n    // these are the Methods\n    function __construct($vname,\
    \ $vcolor, $weight, $shape) {\n        $this->vname = $vname;\n        $this->vcolor\
    \ = $vcolor;\n        $this->weight = $weight;\n        $this->shape = $shape;\n\
    \    }\n    function get_name() {\n        return $this->vname;\n    }\n    function\
    \ get_color() {\n        return $this->vcolor;\n    }\n    function get_weight()\
    \ {\n        return $this->weight;\n    }\n    function get_shape() {\n      \
    \  return $this->shape;\n    }\n}\n$potato = new Vegetables(\"Potato\", \"Red\"\
    , 50, \"round\");\necho $potato->get_name();\necho \"<br>\";\necho $potato->get_color();\n\
    echo \"<br>\";\necho $potato->get_weight();\necho \"<br>\";\necho $potato->get_shape();\n\
    \n$beet = new Vegetables(\"Beet\", \"Blue\", 50, \"round\");\necho $beet->get_name();\n\
    echo \"<br>\";\necho $beet->get_color();\necho \"<br>\";\necho $beet->get_weight();\n\
    echo \"<br>\";\necho $beet->get_shape();\n\n$tomato = new Vegetables(\"Tomato\"\
    , \"Red\", 100, \"round\");\necho $tomato->get_name();\necho \"<br>\";\necho $tomato->get_color();\n\
    echo \"<br>\";\necho $tomato->get_weight();\necho \"<br>\";\necho $tomato->get_shape();\n\
    \n$turnip = new Vegetables(\"Turnip\", \"White\", 150, \"round\");\necho $turnip->get_name();\n\
    echo \"<br>\";\necho $turnip->get_color();\necho \"<br>\";\necho $turnip->get_weight();\n\
    echo \"<br>\";\necho $turnip->get_shape();\n?>\n</body>\n</html>\n```\n`$php main.php`\n\
    \n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
    Potato\nRed\n50\nround\nBeet\nBlue\n50\nround\nTomato\nRed\n100\nround\nTurnip\n\
    White\n150\nround\n</body>\n</html>\n```\n\n## Destructor\n\nYou have to call\
    \ `__destruct()` when an object gets destructed or the script stops or exits.\
    \ If you get the opportunity to create a `__destruct()` function, PHP will call\
    \ it at the end of the script. Just like the constructor function, destructor\
    \ also starts with two underscores.\n\n```html\n<html>\n<head>\n<title>This is\
    \ PHP function</title>\n</head>\n<body>\n<?php\nclass Vegetables {\n    // these\
    \ are the Properties\n    public $vname;\n    public $vcolor;\n    // these are\
    \ the Methods\n    function __construct($vname, $vcolor) {\n        $this->vname\
    \ = $vname;\n        $this->vcolor = $vcolor;\n    }\n    function __destruct()\
    \ {\n        echo \"The vegetable is {$this->vname} and the color is {$this->vcolor}.\"\
    ;\n    }\n}\n$potato = new Vegetables(\"Potato\", \"Brown\");\n$beet = new Vegetables(\"\
    Beet\", \"Red\");\n?>\n</body>\n</html>\n```\n`$php main.php`\n\n```html\n<html>\n\
    <head>\n<title>This is PHP function</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\nThe vegetable is Beet and the color is Red. The vegetable is Potato and the\
    \ color is Brown.\n\n## PHP Access Modifiers\n\nPHP properties and methods tend\
    \ to have access modifiers that can control where and how they be accessed. Generally,\
    \ there are three access modifiers, `public`, `protected`, and `private`.\n\n\
    - With the `public` modifier, a particular method or property can be accessed\
    \ from anywhere.\n- With the `protected` modifier, a method or property can be\
    \ accessed inside a class and by the classes derived from that class.\n- With\
    \ the `private` modifier, a method of property can be accessed only inside a class.\n\
    \nIn this example, I have added three different access modifiers to the above\
    \ three properties. If you set the name property, you will succeed in that. However,\
    \ if you set the weight and color properties, you will see a fatal error.\n\n\
    ```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
    <?php\nclass Vegetable {\n    public $vname;\n    protected $vcolor;\n    private\
    \ $vweight;\n}\n$beet = new Vegetable();\n$beet->vname = 'Beet'; // OK\n$beet->vcolor\
    \ = 'Purplish Red'; // This will trigger an ERROR\n$beet->vweight = '500'; //\
    \ This will trigger an ERROR\n?>\n</body>\n</html>\n```\n`$php main.php`\n\n```html\n\
    <html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\nPHP Fatal\
    \ error: Uncaught Error: Cannot access protected property Vegetable::$vcolor in\
    \ /home/cg/root/271113/main.php:15\nStack trace: #0 {main} thrown in /home/cg/root/271113/main.php\
    \ on line 15\n</body>\n</html>\n```\n\nIn this next example, I will add access\
    \ modifiers to the two methods. If you try to call the `set_vcolor()` or `set_vweight()`\
    \ functions, it will give fatal error, because the two have been designated as\
    \ protected and private. This will happen despite the fact that we made the properties\
    \ public.\n\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n\
    <body>\n<?php\nclass Vegetable {\n    public $vname;\n    public $vcolor;\n  \
    \  public $vweight;\n    function set_name($n) {\n        // Now this is a public\
    \ function (default)\n        $this->vname = $n;\n    }\n    protected function\
    \ set_color($n) {\n        // This is a protected function\n        $this->vcolor\
    \ = $n;\n    }\n    private function set_weight($n) {\n        // This is a private\
    \ function\n        $this->vweight = $n;\n    }\n}\n$beet = new Vegetable();\n\
    $beet->vname = 'Beet'; // OK\n$beet->set_color = 'Purplish Red'; // This will\
    \ trigger an ERROR\n$beet->set_weight = '500'; // This will trigger an ERROR\n\
    ?>\n</body>\n</html>\n```\n\n## Inheritance\n\nInheritance in OOP means when a\
    \ class is derived from another class. The child class tends to inherit almost\
    \ all the protected and public methods and properties from the parent class. It\
    \ also can have its own methods and properties. You can define it using `extends`\
    \ keyword.\n\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n\
    <body>\n<?php\nclass Vegetable {\n    public $vname;\n    public $vcolor;\n  \
    \  function __construct($vname, $vcolor) {\n        $this->vname = $vname;\n \
    \       $this->vcolor = $vcolor;\n    }\n    public function intro() {\n     \
    \   echo \"The vegetable is {$this->vname} and its color is {$this->vcolor}.\"\
    ;\n    }\n}\n// The beet is inherited from Vegetable\nclass Beet extends Vegetable\
    \ {\n    public function message() {\n        echo \"Does beet taste like fruit\
    \ or vegetable?\";\n    }\n}\n$beet = new Beet(\"Beet\", \"purplish red\");\n\
    $beet->message();\n$beet->intro();\n?>\n</body>\n</html>\n```\n`$php main.php`\n\
    \n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
    The vegetable is Beet and its color is purplish red.\n</body>\n</html>\n```\n\n\
    As `Beet` is inherited from the `Vegetable` class, it can use the `vname` and\
    \ `vcolor` properties and the other methods from the main class. It also has its\
    \ own method namely `message`. In the next example, I will turn the function from\
    \ the main class from public to protected. You will see a fatal on the screen\
    \ of your editor.\n\n```html\n<html>\n<head>\n<title>This is PHP function</title>\n\
    </head>\n<body>\n<?php\nclass Vegetable {\n    public $vname;\n    public $vcolor;\n\
    \    function __construct($vname, $vcolor) {\n        $this->vname = $vname;\n\
    \        $this->vcolor = $vcolor;\n    }\n    protected function intro() {\n \
    \       echo \"The vegetable is {$this->vname} and its color is {$this->vcolor}.\"\
    ;\n    }\n}\n// The beet is inherited from Vegetable\nclass Beet extends Vegetable\
    \ {\n    public function message() {\n        echo \"Does beet taste like fruit\
    \ or vegetable?\";\n    }\n}\n$beet = new Beet(\"Beet\", \"purplish red\");\n\
    $beet->message();\n$beet->intro();\n?>\n</body>\n</html>\n```\n`$php main.php`\n\
    \n```html\n<html>\n<head>\n<title>This is PHP function</title>\n</head>\n<body>\n\
    Does beet taste like fruit or vegetable? PHP Fatal error: Uncaught Error: Call\
    \ to protected method Vegetable::intro() from '' in /home/cg/root/271113/main.php:27\n\
    Stack trace: #0 {main} thrown in /home/cg/root/271113/main.php on line 27\n</body>\n\
    </html>\n```\n\nThere is a solution to fix this problem. We can call the protected\
    \ method `intro()` from inside the derived class.\n\n```html\n<html>\n<head>\n\
    <title>This is PHP function</title>\n</head>\n<body>\n<?php\nclass Vegetable {\n\
    \    public $vname;\n    public $vcolor;\n    function __construct($vname, $vcolor)\
    \ {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n    }\n\
    \    protected function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\n// The beet is inherited from\
    \ Vegetable\nclass Beet extends Vegetable {\n    public function message() {\n\
    \        echo \"Does beet taste like fruit or vegetable?\";\n        // I am calling\
