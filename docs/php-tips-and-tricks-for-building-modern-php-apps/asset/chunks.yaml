    # 通配符用法


    现在我表格上应用 `%` 通配符。


    ```sql

    SELECT * FROM Members WHERE Country LIKE ''%es%'';

    ```


    在接下来的示例中，我将尝试检索以 ''om'' 结尾的记录。查看示例表。


    ```sql

    SELECT * FROM Members WHERE Country LIKE ''%om%'';

    ```


