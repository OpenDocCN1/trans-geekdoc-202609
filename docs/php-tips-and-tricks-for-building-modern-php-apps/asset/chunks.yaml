    # Chapter Seven: MySQL Basics


    Many websites demand a backend database that would contain the information that
    the web pages display to the user or store the information that the users would
    fill in the website. MySQL is a highly popular database that can be used on websites.
    It was developed as a small yet fast system for websites. MySQL is specifically
    popular to be used in websites that are scripted in PHP. In short, MySQL and PHP
    tend to work well together.


    MySQL contains a MySQL server, a bunch of utility programs that would aid in the
    administration of MySQL databases, and some supporting software that the MySQL
    server needs. The MySQL server is considered as the manager of the database system.
    It can handle all the database instructions. MySQL is dubbed as a Relational Database
    System (RDBMS). The MySQL server tends to manage multiple databases right at the
    same time. Many people might in control of different databases that are managed
    by one MySQL server.


    Each of them has a structure that can hold the data. Generally, a database tends
    to exist without data. You can store data inside of a database in the form of
    tables. The tables ought to be created before you can add data to your database.
    Create an empty database in the start and fill it in with data later on. Each
    row of a table acts as an entity such as a book or a project. Each column carries
    an item of information about an entity like the name of a book or a customer.
    A database contains one or more tables, and each table can be identified by a
    particular name. Just like a normal table, MySQL table contains columns and rows.
    I will be using a database in these scripts.


    ## MySQL Queries


    It is mostly English. It is made up of English phrases and sentences. You don’t
    have to see through and learn an arcane tech language to write the queries. The
    first word of the statement is its name. It is an action word that tells MySQL
    what you want it to do. These statements will be discussed in this chapter. You
    cannot install or uninstall MySQL on your system as it runs on a web hosting computer.
    You can access data on MySQL through an account.


    ### SQL SELECT


    The first on the line is the `SQL select` statement. I have a demo database that
    is currently perched in the database. The table that is in your database is as
    under.


    | CustomerID | CustomerName | ContactNumber | SecretCode | Country |

    | --- | --- | --- | --- | --- |

    | 1 | Emily Jack | 55779034 | 45 | United States |

    | 2 | Jason Austin | 34568988 | 2 | United Kingdom |

    | 3 | Amanda McMahon | 34578899 | 1 | Ireland |

    | 4 | Victoria Ann | 23768800 | 67 | Germany |

    | 5 | Simon Wiz | 45327899 | 9 | United States |

    | 6 | Tracy Drupal | 23897609 | 8 | France |

    | 7 | Emilia Tim | 45890093 | 3 | Italy |

    | 8 | Tyson Jackson | 34980900 | 2 | Sweden |


    So this is what we have, and we can access it by SQL statements. If you want to
    display the complete table, you can use the following statement.


    ```sql

    SELECT * FROM Members;

    ```


    In this statement, `Members` is the name of the above table. The rest belongs
    to `SQL`. The `Select` statement is very interesting if you use it properly. You
    can use it to display different columns of the table. For example, work at a firm
    that holds the database above. Your boss asks you to print out the list of the
    members and their country of origin, leaving the rest of the database. You can
    do that in a matter of seconds by using the following statement.


    ```sql

    SELECT CustomerName, Country FROM Members;

    ```


    | CustomerName | Country |

    | --- | --- |

    | Emily Jack | United States |

    | Jason Austin | United Kingdom |

    | Amanda McMahon | Ireland |

    | Victoria Ann | Germany |

    | Simon Wiz | United States |

    | Tracy Drupal | France |

    | Emilia Tim | Italy |

    | Tyson Jackson | Sweden |


    ### DISTINCT Statement


    The `SELECT DISTINCT` statement is often used to return the distinct values only.
    Sometimes, a column contains duplicate values, and you only wish to list the distinct
    values. In this situation, you can opt for the `SELECT DISTINCT` statement. When
    we display the table using the simple `SELECT` statement, it displays all the
    values that are in the columns without discriminating about the duplicate entries.
    The `DISTINCT` statement only displays distinct values from the columns. The demo
    table is as under.


    ```sql

    SELECT DISTINCT Country FROM Members;

    ```


    | Country |

    | --- |

    | United States |

    | United Kingdom |

    | Ireland |

    | Germany |

    | France |

    | Italy |

    | Sweden |


    The United States was duplicated, but here only a single entry is on display.


    ### WHERE Clause


    This particular statement selects the members from a particular location that
    you will mention. Let’s revise the table in the database before applying the `SQL`
    statement on the same.


    | CustomerID | CustomerName | ContactNumber | SecretCode | Country |

    | --- | --- | --- | --- | --- |

    | 1 | Emily Jack | 55779034 | 45 | United States |

    | 2 | Jason Austin | 34568988 | 2 | United Kingdom |

    | 3 | Amanda McMahon | 34578899 | 1 | Ireland |

    | 4 | Victoria Ann | 23768800 | 67 | Germany |

    | 5 | Simon Wiz | 45327899 | 9 | United States |

    | 6 | Tracy Drupal | 23897609 | 8 | France |

    | 7 | Emilia Tim | 45890093 | 3 | Italy |

    | 8 | Tyson Jackson | 34980900 | 2 | Sweden |

    | 9 | Tom Dick | 45980999 | 4 | United States |

    | 10 | Dane harry | 47889933 | 0 | United States |


    This is the table in the database.


    ```sql

    SELECT * FROM Members WHERE Country=''United States'';

    ```


    | CustomerID | CustomerName | ContactNumber | SecretCode | Country |

    | --- | --- | --- | --- | --- |

    | 1 | Emily Jack | 55779034 | 45 | United States |

    | 5 | Simon Wiz | 45327899 | 9 | United States |

    | 9 | Tom Dick | 45980999 | 4 | United States |

    | 10 | Dane harry | 47889933 | 0 | United States |


    Take a look at another example of the `WHERE` statement.


    ```sql

    SELECT * FROM Members WHERE CustomerID=1; WHERE CustomerID=2; WHERE CustomerID=3;
    WHERE CustomerID=4; WHERE CustomerID=5; WHERE CustomerID=6; WHERE CustomerID=7;

    ```


    | CustomerID | CustomerName | ContactNumber | SecretCode | Country |

    | --- | --- | --- | --- | --- |

    | 1 | Emily Jack | 55779034 | 45 | United States |

    | 2 | Jason Austin | 34568988 | 2 | United Kingdom |

    | 3 | Amanda McMahon | 34578899 | 1 | Ireland |

    | 4 | Victoria Ann | 23768800 | 67 | Germany |

    | 5 | Simon Wiz | 45327899 | 9 | United States |

    | 6 | Tracy Drupal | 23897609 | 8 | France |

    | 7 | Emilia Tim | 45890093 | 3 | Italy |

    '
