    - Open `httpd.conf` by reaching into the Apache HTTPD Server folder from the Start
    menu. Click on `Configure Apache Server` and then go for `Edit Configuration`.
    If you cannot find `Edit Configuration` on the Start menu, you can find the `httpd.conf`
    on the hard drive. You can locate it in the directory where you have installed
    Apache. Open the file in a text editor like Notepad.


    - It is time to activate the PHP module. Look out for the module statement section
    in the file and then find out the following line:


    ```apache

    #LoadModule php5_module “c:/php/php5apache2_2.dll.”

    ```

    If you want to activate the module, you can remove `#` from the start of the line.
    The name of the module may differ, depending on the PHP version and Apache version
    that you have been using.


    - You need to tell Apache which files are PHP programs and which are not. Find
    out the section that describes `AddType`. This particular section may contain
    one or more `AddType` lines from the other software. The line for PHP is as under:


    ```apache

    AddType application/x-httpd-php .php

    ```

    Find out the line. If you find it with a pound sign at the start, remove the sign.
    If there is no such file, you can add it to the list of `AddType` statements.


    - You can start Apache as a service in the later versions of Windows by clicking
    on Start then Programs, then Apache HTTPD Server, and then `Control Apache Server`.
    Now select `Start` or `Restart`.


    ## PHP Configuration

    PHP uses different settings of a file named `php.ini` to control its behavior.
    PHP looks for `php.ini` when it starts and uses its settings. The default location
    for `php.ini` is one of the following unless you change them. If the `php.ini`
    file has not already been installed, you have to do that now. You can look out
    for a `php.ini-dist` file that has default settings. The file is included in the
    PHP distribution. You can copy the file to an appropriate location like the default
    locations, as mentioned, changing the file to `php.ini`.


    If you have a version of PHP installed like `PHP 4.3`, you can make a backup copy
    for `PHP 5` or `6`. Then you take a look at the settings you are presently using.
    For the configuration of PHP, open the `php.ini` file and edit it. Then change
    the settings that you need to change.


    If you are using `PHP 5` or earlier, you need to turn off magic quotes. Search
    the following line: `magic_quotes-gpc On`. Change the `On` to `Off`. If you are
    using `PHP 5` or `PHP 6` on Windows, you need to activate `mysql` or `mysqli`
    support. You ought to remove the semicolon so that the setting stays active. Also,
    change `1` to `0`. The line looks as follows after the changes:


    ```ini

    cgi.force_redirect = 0

    ```

    If you are using `PHP 5` or later, you need to set the local time zone. Now save
    `php.ini` file and then restart your web server.


    ## Chapter Two: The Basics of PHP

    PHP is a scripting language that is designed to be used on the web. It has a wide
    range of features to help you in programming different tasks that are needed to
    develop several dynamic web applications. This chapter will walk you through the
    basics of writing PHP scripts, such as the rules that you can apply to different
    PHP statements. You can take these rules as something similar to general punctuation
    rules.


    The PHP software works just like a web server. When you type a `URL` into the
    address bar of the web browser, you will send a message to the web server, telling
    it to send an HTML file. The web server will respond by sending the file you requested.
    The browser will read the HTML file and then display the web page.


    When PHP is installed, the webserver is generally configured to expect file extensions
    to contain certain PHP statements. More often the extension is `.phtml` or `.php`.
    When the webserver receives a request for a file that has the designated extension,
    it will process the HTML statements as they are. The PHP statements are not a
    part of the browser, so the PHP code remains hidden from the user.


    Creating an HTML Page HyperText Markup Language is also a web language. When you
    open a web page in the web browser such as Google Chrome, Firefox, and Safari,
    the browser downloads the page, what you see is the HTML page. HTML is just like
    a document that is much the same as a document you create in a word processor.
    A program, just like MS Word is required to view and word documents because the
    MS Processor can only read that format. In the case of HTML, the web browser is
    a program that reads and displays the documents that are created with HTML. Unlike
    a word processor, you cannot create an HTML document with a browser. You have
    to create HTML documents with the help of an editor. An editor can be a simple
    one like Notepad or a complex one like Microsoft Visual Studio. We have to understand
    HTML because we need this language to embed PHP and run it on a browser. All HTML
    documents ought to start with `<!DOCTYPE html>`.

