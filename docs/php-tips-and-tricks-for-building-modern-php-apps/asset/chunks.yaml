    \    if (isset($_SESSION)) {\n        print \"Your Session starts!\";\n    } else\
    \ {\n        print \"Your session did not start\";\n    } \n    ?>\n</body>\n\
    </html>\n```\n\n`php main.php`\n\n```html\n<html>\n<head>\n    <title>This is\
    \ PHP</title>\n</head>\n<body>Your session did not start</body>\n</html>\n```\n\
    \n将文件保存为 `session.php` 并存放在文档根目录。你现在可以打开 浏览器并输入 `[`localhost/session.php`](http://localhost/session.php)`。你现在可以最小化浏览器，并在文本编辑器中创建一个新文件。现在在新文件中放置以下代码：\n\
    \n```php\n<?php session_start(); ?>\n```\n\n你可以将此文件保存为 `prepend.php` 并存放在文档根目录。在浏览器中，你可以重新加载\
    \ `session.php` 文件以查看你之前创建的内容。如果你在浏览器中看到空白页面或某种错误，这意味着预包含文件不存在。检查拼写以验证你是否书写正确。如果你看到的页面显示“Session\
