    9

    PHP Notice: Undefined variable: coLOR in `/home/cg/root/3268398/main.php` on line
    10


    #### PHP Code

    PHP code ought to be read by humans and the PHP software. When you have written
    a script for a web application, it will have to be modified and maintained in
    a year or two. The person who will be tasked with the modification of the code
    should be able to understand the script. Therefore it must be written in a style
    that is readable by humans and easier for them to understand. Each PHP simple
    statement should be written on a single line and finished with a semicolon. When
    you write block statements, you should indent each block for a clear read.


    #### PHP Variables

    Usually, a PHP variable starts with `$` sign and is followed by the name of the
    variable. The PHP `echo` is used to display the output on the computer screens.
    Take a look at the following example to see how the output text is displayed on
    the computer screens.


    ```html

    <html>

    <head>

    <title>Online PHP Script</title>

    </head>

    <body>

    <?php

    $txt = "amazing";

    echo "PHP is " . $txt . ".";

    ?>

    </body>

    </html>

    ```


    #### Strings

    PHP has strings that are the form of characters. These are numbers, letters, and
    punctuation. When a string is used as a variable, you are telling PHP where it
    begins and where it ends by using double quotes single quotes. It deliver the
    same result with both types.


    ```html

    <html>

    <head>

    <title>Online PHP Script</title>

    </head>

    <body>

    <?php

    $string = "I am invited to dine at Sally''s house.";

    echo $string;

    ?>

    </body>

    </html>

    ```


    #### Joining Strings

    You can join strings through a process known as concatenation using a dot.


    ```html

    <html>

    <head>

    <title>Online PHP Script</title>

    </head>

    <body>

    <?php

    $string1 = "I am invited to dine at Sally''s house.";

    $string2 = " Please join us and fun.";

    $stringall = $string1.$string2;

    echo $stringall;

    ?>

    </body>

    </html>

    ```


    #### Heredoc

    PHP offers a feature that is known as heredoc, which you can use to create longer
    strings that may span over lines. A heredoc will enable you to tell PHP where
    you should start and where you need to end. `ENDSTRING` may include anything you
    need to use. You will enclose the piece of text you want to store in the variable
    `$varname` by putting `ENDSTRING` at the start and the end. When PHP tends to
    process the heredoc, it will read the `ENDSTRING` and will know to begin the test
    into `$varname`.


    ```html

    <html>

    <head>

    <title>Online PHP Script</title>

    </head>

    <body>

    <?php

    $distance = 50;

    $herevariable = <<<ENDOFTEXT

    You will be intrigued to know that the distance between Uganda and Kira Town Is
    $distance kilometers.

    ENDOFTEXT;

    echo $herevariable;

    ?>

    </body>

    </html>

    ```


    #### Arrays

    Arrays are considered complex variables. A particular array tends to store a group
    of values inside of a single variable name. It is quite useful for the storage
    of related values. You can store the information about a certain flower-like color,
    variety, and cost. You can handle that information, modify it, and access it.
    One of the simplest way to creating an array is to assign a value to a particular
    variable with square brackets `[]` at the end of the name.

