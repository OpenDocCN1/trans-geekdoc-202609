    # Chapter Nine: Relevance of PHP in Modern App Development


    PHP is considered one of the highly popular programming languages across the world.
    Most top websites use it, thanks to the immense popularity of Content Management
    Systems like `Drupal` and `WordPress`. PHP has been in demand for developing a
    web application with the help of popular frameworks like `Laravel` and `Symfony`.
    JavaScript-based `Node.js` challenged the existence of PHP. However, it couldn’t
    dislodge it from the imperial position PHP has taken for a while. PHP is still
    being used by a big number of programmers. PHP, even though it is one of the most
    object-oriented and efficient languages, is overlooked more often as an option
    to develop innovative and modern applications. The most common consensus among
    the developers and decision-makers is that it is highly popular among builders
    of CMS software apps that many websites use. It tends to excel in general programming
    projects like CMSes based eCommerce stores and web portals. PHP remains at the
    heart of some of the highly popular and the most successful technology companies
    across the world, such as `Blablacar`, `Facebook`, and `Slack`. Slack is quite
    popular among businesses that have to manage a remote team of hundreds of employees.
    More businesses are opting to use PHP for building modern apps for their startups.
    PHP is getting better with each passing day, and it offers plenty of advantages
    for businesses and developers. Despite the stereotypes, it can work with `WebSocket`;
    however, it has its limitations. You can opt for PHP if you have got a business
    that you wish to bring into the market as quickly as possible. The pace at which
    you launch your idea matters much when you are competing with a big number of
    businesses. To stay ahead of the competition, it is a good idea to be quick. A
    quick start will help you find unique business models that you might not have
    considered previously. If the business idea demands that you create a web application,
    PHP can be a perfect choice. You can use popular PHP framework `Laravel` and `Symfony`
    to create web applications in a really fast manner. You can gauge the popularity
    of PHP from the fact that about 81% of the websites use PHP as a scripting language
    on the server-side. The rising popularity of PHP in modern app development is
    because of certain proven benefits.


    ## Built-in Features

    Unlike many other programming languages, PHP was initially designed for web application
    development. Therefore, the designers, from the very start, crammed it with special
    built-in features that were required to build different types of websites and
    web applications. You can use the built-in features such as `functions` and `classes`
    in PHP to perform a variety of web development operations and tasks. When you
    are building a program, you can call the `classes` and `functions` at any point
    in the code to perform specific tasks. This makes PHP easy and fun for building
