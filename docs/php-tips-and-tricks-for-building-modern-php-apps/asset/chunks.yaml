    ### 这就是你如何插入三级标题


    #### 分析 PHP 脚本

    PHP 在用于网页时，作为一种嵌入式脚本语言而广为人知。这意味着你必须在 HTML 代码中以嵌入式的形式使用它。你必须使用 HTML 标签来编写 PHP 语言。这个过程与其他
    HTML 文档相同。你可以像创建和编辑其他 HTML 页面一样，创建并编辑包含 PHP 的不同网页。


    PHP 语言语句通常包含在特定的 PHP 标签中。PHP 脚本可以放置在文档的任何位置。脚本以 `<?php` 开始，以 `?>` 结束。


    ```html

    <html>

    <head>

    <title>这是一个 PHP 脚本外观所示的示例</title>

    </head>

    <body>

    <?php echo "<h1>我们正在通过 PHP 进入应用开发的世界！</h1>\n"; ?>

    </body>

    </html>

    ```


    ```php

    main.php

    ```


    ```html

    <html>

    <head>

    <title>这是一个 PHP 脚本外观所示的示例</title>

    </head>

    <body>

    <h1>我们正在通过 PHP 进入应用开发的世界！</h1>

    </body>

    </html>

    ```


    浏览器不会在代码中显示 PHP 脚本。你也可以通过仅使用 `<?` 和 `?>` 使用更短版本的 PHP 标签。如果你启用了短标签，就可以节省一些时间。问题是，如果你将脚本移动到另一个未激活
    PHP 短标签的 Web 主机，你的脚本将无法有效运行。


    所有的 PHP 语句都在这些 PHP 标签之间处理。在浏览器处理 PHP 部分之后，它会将其丢弃。如果有输出，PHP 部分将被替换为输出，正如你在上面示例中所示。一个
    PHP 脚本可以有多个部分。这里是示例。


    ```html

    <html>

    <head>

    <title>这是一个 PHP 脚本外观所示的示例</title>

    </head>

    <body>

    <?php echo "<h1>我们正在通过 PHP 进入应用开发的世界！</h1>\n"; ?>

    <?php echo "<h2>我正在通过 PHP 学习应用开发！</h1>\n"; ?>

    </body>

    </html>

    ```


    上述脚本的结果如下：


    ```php

    main.php

