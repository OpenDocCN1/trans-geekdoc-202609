    | 1. | Emilia Jackson | 55779034 | 45 | United States |

    | 5. | Harry Styles | 45327899 | 7 | United States |

    | 9. | Emilia Jackson | 45980999 | 4 | United States |

    | 10. | Harry Styles | 47889933 | 0 | United States |


    Here is the result in a perfectly ascending order. However, you can reverse the
    order by using the `DESC` keyword in the SQL statement. It will select all the
    entries and shuffle it up into descending order by picking up the country column.
    This is the current form of the table.


    | CustomerID | CustomerName | ContactNumber | SecretCode | Country |

    | :--- | :--- | :--- | :--- | :--- |

    | 1. | Emilia Jackson | 55779034 | 45 | United States |

