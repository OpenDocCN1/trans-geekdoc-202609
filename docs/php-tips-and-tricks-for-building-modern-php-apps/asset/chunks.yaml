    # 第十章：PHP 应用开发技巧


    PHP 在过去几年中在速度和性能方面有了显著提高。它的运行速度变得惊人。它为编写方法和返回类型引入了类型提示，并对语言进行了润色，使其更具一致性。有许多辅助方法可以在你编写更少代码的同时实现更多功能。如果你已经决定从现在开始使用
    PHP 来构建网站和应用，你应该迁移到 `PHP 7`。PHP 非常流行，一些大公司已选择它来构建网站和应用，例如 Tumblr、维基百科、Facebook、TED
    和国家地理。是的，Facebook 是运行在 PHP 之上的。开发者们喜欢这种语言，因为它的文档非常出色。社区规模庞大，这意味着如果你在过程中遇到任何问题，你可以随时获得支持。PHP
    高度可靠、成熟且稳定。PHP 团队在发布可能会破坏旧功能的新功能时非常谨慎。此外，他们还为发布制定了专业的路线图。


    PHP 的绝大部分声誉归功于 `PHP 框架`。该领域有两个巨头，在开发者中一直处于势不相让的。两者都非常优秀，并且可以为你提高效率。然而，Laravel
    被认为更受欢迎。


    ## Laravel


    `Laravel` 框架由 Raylor Otwell 创建，被定义为 Web 工匠的最佳选择。它自 2011 年以来一直存在着。Laravel 最棒的一点是它的学习曲线非常平。如果你是一个传统的
    PHP 开发者，你会发现用起来非常顺手。你还可以将其与队列、`Laravel mix` 和缓存集成。它的主要特性包括用户管理、登录、用户注册、通知和身份验证系统。这些特性允许你在构建应用程序时加快进度。`collections`
    辅助方法允许你将数据转化为优雅的形式。


    ## PHP 技巧


    ### 服务端语言

    语言通常被设计得非常复杂，以便网站受到恶意攻击的风险降到最低。然而，PHP 通过简化服务端代码彻底改变了这一领域。由于其开源特性，PHP 已经建立了一个不断增长的
    Web 开发者社区，将其塑造了现在的模样。由于这些开发者的头脑风暴，函数列表是无尽的，而能够简化你编码过程的框架也远不止预期。


    ### 错误报告功能

    首要的是 PHP 的错误报告功能。在开始使用 PHP 开发新项目之前，你应该开启 PHP 的错误报告功能。即使是专业开发者也对此深信不疑。那么，接下来会发生什么？在整个生产过程中，你将看到许多有用的错误信息，而不是每次出现问题时看到空白屏幕。它将帮助你在扫描代码时处理错误。总的来说，它会让编码过程变得高效且快速。在脚本开头包含以下功能，错误报告功能将自动开启。这将节省你在检测错误时扫描成千上万行代码的痛苦之源。


    ```

    display_errors = on

    ```


    ### 代码草图

    与你用 PHP 构建的所有程序一样，最终目标是为代码创建一个可用的界面。在深入开发 Web 应用程序之前，你应该对代码和数据结构画一个草图。在着手之前，你可能需要对自己希望看到的界面有一个清晰的想法。


    ### 保持更新

    PHP 被认为是一种广泛使用的语言。它每天都会接收新的更新。如果你想在这场竞争中保持领先，你应该让自己熟悉这些更新。


    ### 词汇

    在阅读此书时，你会遇到许多如 `constants`（常量）、`functions`（函数）、`classes`（类）和 `interfaces`（接口）之类的术语。这些术语构成了
    PHP 的主体。还有其他术语如 `variables`（变量）、`inheritance`（继承）、`methods`（方法）和 `properties`（属性）。理解这些术语是制作网站的关键。你可以查看官方网站
    `php.net` 手册来扩展你的词汇并深入理解。


    ### OOP（面向对象编程）

    如果你还没有进入面向对象编程的世界，你就处于了不利位置。你最终会迅速落后。正如你在书中之前的章节中学到的，OOP 围绕着 `classes`（类）或 `objects`（对象）展开，将不同的事物结合在一起。它们消除了对代码的需求。对象是集成了不同函数的类，并允许开发者反复使用它们。


    ### 注释

    许多初级开发者认为他们不应该浪费时间写注释。然而，事实是，这是你应该尽早养成的习惯。作为一名开发者，你在写注释时应该像写代码一样专注。每条注释都是你的参考，让你知道自己写了什么。这些注释倾向于解释你的程序或应用程序将采取的方向。但是，给代码添加注释并不意味着让它变得混乱。只需写几个简短的笔记让代码具有可读性即可。另一种方法是对文件中复杂的部分编写文档，以便你可以解读某些极其复杂的细节。当你更改代码时，不要忘记更改注释。


    ### PHP 框架

    PHP 框架的设计旨在帮助开发者。如果你是一个理想的程序员，你可能需要几周或几个月的时间才能从零创建一个 Web 应用程序。大部分时间将被消耗在重复代码的生产上，这是无聊的。如果你愿意投入精力，应该去尝试。否则，请使用框架，如
    `Laravel`，我已经在书中解释过了。框架还确保了你的数据库和应用程序之间的连接。


    '
