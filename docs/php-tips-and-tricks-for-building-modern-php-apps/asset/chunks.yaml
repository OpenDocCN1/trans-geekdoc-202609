  raw: 'Chapter Five: Object-Oriented Programming Object-oriented programming (OOP)
    is a particular approach to programming that spans around classes and objects.
    It is one of the most popular uses of PHP nowadays. PHP5 was released as an improved
    version of object-oriented programming. It had more speed and improved features.
    Object-oriented programming, OOP in its short form, is not about using a different
    syntax, it is about giving you a different approach to analyze problems and carve
    out their solutions. In OOP, the script is seen as a bunch of different objects,
    which represent the elements of the problem the script has to solve. If the script
    is about a used-car lot, the objects can be customers and cars. OOP has brought
    to light new concepts and terminology. Classes One of the basic elements of object-oriented
    programming is objects. You can take them as physical objects in the form of codes.
    A PHP object can be a car, a cat, or a dog. You can give them certain properties,
    known as attributes in the world of programming. For example, a cat can have attributes
    like sitting down, rolling on the ground, etc. A car can have attributes like
    color, model, and company name. A class in PHP code serves as the template that
    is used for the creation of an object. The class generally defines the attributes,
    the properties of a particular object. It will also define a wide range of things
    that the object does like its responsibilities. You write a class that would define
    a car with an engine and four wheels. The class lists the things that a car can
    do, like it can move forward and park as well. You also can write a statement
    like the one as under: <html> <head> <title>This is PHP function</title> </head>
    <body> <?php class Vegetables { // these are the Properties public $vname; public
    $vcolor; // these are the Methods function set\_name($vname) { $this->vname =
    $vname; } function get\_name() { return $this->vname; } } ?> </body> </html> In
    classes, variables are labeled as properties while functions are dubbed as methods.
    Classes are nothing without objects. You can have the liberty to create a wide
    range of objects from a single class. Each object contains certain properties
    and methods that are defined in that class, however, they have varying property
    values. The new keyword is used to create objects of a class. Then there are instances
    of the class Vegetables. <html> <head> <title>This is PHP function</title> </head>
    <body> <?php class Vegetables { // these are the Properties public $vname; public
