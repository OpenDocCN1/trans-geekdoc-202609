    #### PHP 代码

    PHP 代码应当对人类和 PHP 软件可读。当你为 Web 应用程序编写脚本时，你编写的脚本应该是易于维护的。你可以创建并以一种易于理解的方式编写。PHP
    语句应该以单行编写并以分号结束。


    #### PHP 变量

    通常，PHP 变量以 `$` 符号开头，后面跟着变量名。`echo` 用于显示输出。查看以下示例以了解如何在屏幕上显示。


    ```html

    <html>

    <head>

    <title>这是一个 PHP 脚本外观所示的示例</title>

    </head>

    <body>

    <?php

    $txt = "amazing";

    echo "PHP is " . $txt . ".";

    ?>

    </body>

    </html>

    ```


    #### 字符串

    PHP 字符串是字符的形式。这些是数字、字母和标点。当字符串作为变量时，你告诉 PHP 它何时开始以及何时结束。使用双引号或单引号都有相同的结果。


    ```html

    <html>

    <head>

    <title>这是一个 PHP 脚本外观所示的示例</title>

    </head>

    <body>

    <?php

    $string = "I am invited to Sally''s house.";

    echo $string;

    ?>

    </body>

    </html>

    ```


    #### 字符串连接

    你可以通过被称为连接的连接来连接字符串。


    ```html

    <html>

    <head>

    <title>这是一个 PHP 脚本外观所示的示例</title>

    </head>

    <body>

    <?php

    $string1 = "I am invited to Sally''s house.";

    $string2 = " Please join us and fun.";

    $stringall = $string1.$string2;

    echo $stringall;

    ?>

    </body>

    </html>

    ```


    #### Heredoc

    PHP 提供了一种名为 heredoc 的功能，你可以用它来创建跨行的长字符串。Heredoc 允许你告诉 PHP 应该从哪里开始结束。`ENDSTRING`
    可以包含你需要的任何内容。通过将 `ENDSTRING` 放在开头和结尾，你会封装想要存储在变量 `$varname` 中的文本。当 PHP 处理 heredoc
    时，它会读取 `ENDSTRING` 并知道开始测试。


    ```html

    <html>

    <head>

    <title>这是一个 PHP 脚本外观所示的示例</title>

    </head>

    <body>

    <?php

    $distance = 50;

    $herevariable = <<<ENDOFTEXT

    你可能会发现乌干和 Kira 镇之间的距离是 $distance 公里。

    ENDOFTEXT;

    echo $herevariable;

    ?>

    </body>

    </html>

    ```


    #### 数组

    数组被认为是复杂的变量。特定的数组倾向于在一个变量名中存储一组值。这对于存储相关值非常有用。你可以存储关于某种花卉的颜色、品种和成本的信息。你可以处理、修改并访问这些信息。


