    <html>\n<head>\n<title>This is PHP</title>\n</head>\n<body>\nYou are doomed! Your\
    \ grade is F\n</body>\n</html>\n```\n\n### Nested if\n\nYou can put and `if` conditional\
    \ statement inside of another `if` statement. This process is known as nesting.\
    \ Suppose you have to contact your customers living in Minnesota. You are planning\
    \ to send emails to their IDs and then send letters to those who don’t keep addresses.\
    \ You can identify groups of customers by the following method.\n\n```php\nif\
    \ ($thecustState == \"ID\") {\n    if ($theEmailAdd = \"\") {\n        $thecontactMethod\
    \ = \"letter\";\n    } else {\n        $thecontactMethod = \"contact through email\"\
    ;\n    }\n} else {\n    $thecontactMethod = \"there is none needed\";\n}\n```\n\
    \n### Switch Statement\n\nThe `switch` statement is aimed at testing the value\
    \ of `$variablename`. The script moves on to `case` section and executes the statements\
    \ until a `break` statement comes or the `switch` statement reaches it end. You\
    \ are free to use as many sections as you want. If you opt to use `default` section,\
    \ you can put the at the end.\n\n```php\n<?php\n$favoritecolor = \"green\";\n\
    switch ($favoritecolor) {\n    case \"green\":\n        echo \"My favorite color\
    \ is green!\";\n        break;\n    case \"purple\":\n        echo \"My favorite\
    \ color is purple!\";\n        break;\n    case \"violet\":\n        echo \"My\
    \ favorite color is violet!\";\n        break;\n    default:\n        echo \"\
    My favorite color is none of stated!\";\n}\n?>\n```\n\n`$php main.php`\n\n```html\n\
    <html>\n<head>\n<title>This is PHP</title>\n</head>\n<body>\nMy favorite color\
    \ is green!\n</body>\n</html>\n```\n\nLet’s change the name of the color in the\
    \ code and see the results.\n\n```php\n<?php\n$favoritecolor = \"violet\";\nswitch\
    \ ($favoritecolor) {\n    case \"green\":\n        echo \"My favorite color is\
    \ green!\";\n        break;\n    case \"purple\":\n        echo \"My favorite\
    \ color is purple!\";\n        break;\n    case \"violet\":\n        echo \"My\
    \ favorite color is violet!\";\n        break;\n    default:\n        echo \"\
    My favorite color is none of stated!\";\n}\n?>\n```\n\n`$php main.php`\n\n```html\n\
    <html>\n<head>\n<title>This is PHP</title>\n</head>\n<body>\nMy favorite color\
    \ is violet!\n</body>\n</html>\n```\n\nIn the third code snippet, I will choose\
    \ a color that is not in the `case` statements. Let’s see what the result is.\n\
    \n```php\n<?php\n$favoritecolor = \"yellow\";\nswitch ($favoritecolor) {\n   \
    \ case \"green\":\n        echo \"My favorite color is green!\";\n        break;\n\
    \    case \"purple\":\n        echo \"My favorite color is purple!\";\n      \
    \  break;\n    case \"violet\":\n        echo \"My favorite color is violet!\"\
    ;\n        break;\n    default:\n        echo \"My favorite color is none of stated!\"\
    ;\n}\n?>\n```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>This is PHP</title>\n\
    </head>\n<body>\nMy favorite color is none of stated!\n</body>\n</html>\n```\n\
    \n## Loops\n\nLoops are used, in general, in scripts when you have to set up a\
    \ block of different statements that would repeat themselves. The PHP loop can\
    \ repeat itself for an unlimited period. You can create a loop that contains the\
    \ names of the countries of the world. The loop would echo the names of the countries\
    \ until you set a condition which it would meet and stop. A loop can give you\
    \ the names of certain files in a directory until the directory stands empty.\n\
    \n### Loop Types\n\nThe first type is the `for` loop. It sets up a counter that\
    \ would repeat the block of statement that you fill it with until the counter\
    \ reaches a particular number. The second type is the `while` loop. It sets up\
    \ a condition that would check the condition and see if it is true and then repeat\
    \ a certain block of statements until the condition stands false. The third type\
    \ is the `do…while` loop that also sets up a condition. After that it executes\
    \ a block of statements until the condition stands false. There is an `init` counter\
    \ that will initialize the counter value of the loop. Then there is a `test` counter\
    \ that is evaluated for each iteration of the loop. If the evaluation is TRUE,\
    \ the loop goes on. Otherwise, it ends there. The `increment` counter will increase\
    \ the counter value of the loop.\n\n```php\n<?php\nfor ($y = 0; $y <= 20; $y++)\
    \ {\n    echo \"The requisite number is $y\";\n}\n?>\n```\n\n### Nesting Loops\n\
    \nYou can nest one `for` loop inside another `for` loop. We can create the table\
    \ of 12 through multiplication from 1 to 12 using two `for` loops which will work\
    \ together.\n\n```php\n<?php\nfor($a=1;$a<=12;$a++) {\n    echo \"\\nMultiply\
    \ by $a \\n\";\n    for($b=1;$b<=12;$b++) {\n        $result = $a * $b;\n    \
    \    echo \"$a x $b = $result\\n\";\n    }\n}\n?>\n```\n"
