  trans: "\n\n# 第六章：PHP 表单与文件处理\n\nPHP 超全局变量如 `$_POST` 和 `$_GET` 通常用于收集表单数据。本章将带你逐步了解如何创建和处理\
    \ PHP 表单。\n\n我将从一个带有两个输入字段的简单 HTML 表单开始。它还将包含一个提交按钮，用户填写信息并点击提交按钮即可完成操作。你可以构建一个\
    \ Web 应用并将表单集成其中，以便从用户那里获取所需的某些信息。\n\n```html\n<html>\n<body>\n<form action=\"\
    Wewelcomeyou.php\" method=\"post\">\n  Name: <input type=\"text\" name=\"Please\
    \ enter your name\"><br>\n  E-mail: <input type=\"text\" name=\"Please enter your\
    \ email\"><br>\n  <input type=\"submit\">\n</form>\n</body>\n</html>\n```\n\n"
- fmt: "\nWhen a user fills out the form and enters the submit button, the data proceeds\
    \ for processing to a PHP file that is named as `Wewelcomeyou.php`. The form is\
    \ dispatched with the `HTTP POST` method. If you want to display your submitted\
    \ data, you can simply `echo` the variables. If you use the `$GET` method to send\
    \ the form, it will be visible to everyone. All names and values will be displayed\
    \ in the URL. It also has limits on the size of the information you want to send.\
    \ Variables will be displayed in the URL, so it will be impossible to create a\
    \ bookmark on the page. You also can use the `POST` method to create a form, but\
    \ the problem is that in this method, the information will be visible to others.\n\
    \nIn the next code example, you will see new variables that will help you add\
    \ error messages for all the required fields. There will also be an if-else statement\
    \ for each of the `$_POST` variable. It will check if `$_POST` variable is empty\
    \ or not, because if it is not, you will be see an error message, packed in different\
    \ error variables. It will send the user input data through the `test_input()`\
    \ function.\n\n```html\n<html>\n<head>\n    <title>This is PHP</title>\n</head>\n\
    <body>\n<?php\n    // you ought to define variables and set them to empty values\n\
    \    $pnameErr = $pemailErr = $pgenderErr = $pwebsiteErr = \"\";\n    $pname =\
    \ $pemail = $pgender = $pcomment = $pwebsite = \"\";\n    if ($_SERVER[\"REQUEST_METHOD\"\
    ] == \"POST\") {\n        if (empty($_POST[\"name\"])) {\n            $pnameErr\
    \ = \"You will be requiring a name\";\n        } else {\n            $pname =\
    \ test_input($_POST[\"name\"]);\n        }\n        if (empty($_POST[\"email\"\
    ])) {\n            $pemailErr = \"You will be requiring an Email\";\n        }\
    \ else {\n            $pemail = test_input($_POST[\"email\"]);\n        }\n  \
    \      if (empty($_POST[\"website\"])) {\n            $pwebsite = \"\";\n    \
    \    } else {\n            $pwebsite = test_input($_POST[\"website\"]);\n    \
    \    }\n        if (empty($_POST[\"comment\"])) {\n            $pcomment = \"\"\
    ;\n        } else {\n            $pcomment = test_input($_POST[\"comment\"]);\n\
    \        }\n        if (empty($_POST[\"gender\"])) {\n            $pgenderErr\
    \ = \"You will have to enter your Gender\";\n        } else {\n            $pgender\
    \ = test_input($_POST[\"gender\"]);\n        }\n    }\n?>\n</body>\n</html>\n\
    ```\n\n### PHP File Handling\nException handling is something that programmers\
    \ label as the toughest part of software development. Errors such as program bug,\
    \ network failure, and database failure create a bunch of serious problems for\
    \ programmers. Developers ought to make decisions regarding errors that pop up\
    \ during the writing phase, add checks to detect a failure and invoke the perfect\
    \ function for managing it. Programmers also ought to make sure that the programs\
    \ work normally after handling the error. Exceptions help you write powerful programs\
    \ without the need to write ‘if’ statements in the code blocks. This means that\
    \ you can always minimize the codes that you ought to write.\n\nPHP forms are\
    \ of many types. The most basic that you can add to your web application is the\
    \ PHP `date()` function. The required format parameter of the function tends to\
    \ specify how you can format the date and time. Take a look at some characters\
    \ that you can use for dates:\n- The `d` character will represent the days of\
    \ the month from 01 to 31.\n- The `m` character represents months of the year\
    \ from 01 to 12.\n- The `y` parameter represents four digits of the year.\n- The\
    \ `l` represents the day of the week.\n\n```html\n<html>\n<head>\n    <title>This\
    \ is PHP</title>\n</head>\n<body>\n<?php\n    echo \"The date is \" . date(\"\
    Y/m/d\") . \"<br>\";\n    echo \"The date is \" . date(\"Y.m.d\") . \"<br>\";\n\
    \    echo \"The date is \" . date(\"Y-m-d\") . \"<br>\";\n    echo \"The date\
    \ is \" . date(\"l\");\n?>\n</body>\n</html>\n```\n\n```php\nmain.php\n```\n```html\n\
    <html>\n<head>\n    <title>This is PHP</title>\n</head>\n<body>\n    The date\
    \ is 2020/06/23<br>\n    The date is 2020.06.23<br>\n    The date is 2020-06-23<br>\n\
    \    The date is Tuesday\n</body>\n</html>\n```\n\nWhen the new year starts, you\
    \ can update the copyright year of your web application by the following method:\n\
    `&copy; 2020-<?php echo date(\"Y\");?>`\n\nHere is the example of how you can\
    \ ask PHP to estimate the exact date even four months in forward.\n\n```html\n\
    <html>\n<head>\n    <title>This is PHP</title>\n</head>\n<body>\n<?php\n    $d=strtotime(\"\
    \ tomorrow \");\n    echo date(\"m-d-y h:i:sa\", $d) . \"<br>\";\n    $d=strtotime(\"\
    \ next Friday \");\n    echo date(\" m-d-y h:i:sa \", $d) . \"<br>\";\n    $d=strtotime(\"\
    \ +4 Months \");\n    echo date(\" m-d-y h:i:sa \", $d) . \"<br>\";\n    $d=strtotime(\"\
    \ +8 Months \");\n    echo date(\" m-d-y h:i:sa \", $d) . \"<br>\";\n    $d=strtotime(\"\
    +1 Month \");\n    echo date(\" m-d-y h:i:sa \", $d) . \"<br>\";\n    $d=strtotime(\"\
    \ next Wednesday \");\n    echo date(\" m-d-y h:i:sa \", $d) . \"<br>\";\n?>\n\
    </body>\n</html>\n```\n\n```php\nmain.php\n```\n```html\n<html>\n<head>\n    <title>This\
    \ is PHP</title>\n</head>\n<body>\n    06-24-20 12:00:00am<br>\n    06-26-20 12:00:00am\
    \ <br>\n    10-23-20 05:13:14am <br>\n    02-23-21 05:13:14am <br>\n    07-23-20\
    \ 05:13:14am <br>\n    06-24-20 12:00:00am <br>\n</body>\n</html>\n```\n\n###\
    \ More Examples\n```html\n<html>\n<head>\n    <title>This is PHP</title>\n</head>\n\
    <body>\n<?php\n    $thestartdate = strtotime(\"Friday\");\n    $theenddate = strtotime(\"\
    +36 weeks\", $thestartdate);\n    while ($thestartdate < $theenddate) {\n    \
    \    echo date(\"M d Y\", $thestartdate) . \"<br>\";\n        $thestartdate =\
    \ strtotime(\"+1 day\", $thestartdate);\n    }\n?>\n</body>\n</html>\n```\n\n\
    ```php\nmain.php\n```\n```html\n<html>\n<head>\n    <title>This is PHP</title>\n\
    </head>\n<body>\n    <!-- Output of date loop omitted for brevity -->\n</body>\n\
    </html>\n```\n\n### The Include Factor\nIn order to include the footer file in\
    \ the page, you ought to use the `include` statement.\n\n```html\n<html>\n<head>\n\
    \    <title>This is PHP</title>\n</head>\n<body>\n<?php include 'footer.php';\
    \ ?>\n</body>\n</html>\n```\n"
