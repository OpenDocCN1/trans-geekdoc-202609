    Web 应用程序读取它们。如果第一个条件为真，代码就不会继续移动而是直接在那里结束。如果第一个条件结果为假，代码将跳转到下一个条件并运行它。当有 `else-if`
    语句且第一个条件结果为假时，第三个条件就会发挥作用。


