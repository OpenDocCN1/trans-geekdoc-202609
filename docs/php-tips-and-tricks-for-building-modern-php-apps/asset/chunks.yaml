    <head> <title>This is PHP</title> </head> <body> The vegetable is Beet and its
    color is purplish red<br>The vegetable is Onion and its color is white<br>The
    vegetable is Pumpkin and its color is green<br>The vegetable is Radish and its
    color is red<br>The vegetable is Tomato and its color is red and green<br></body>
    </html> Abstract Class Examples <html> <head> <title>This is PHP</title> </head>
    <body> <?php abstract class ParentClass { // This is an Abstract method with an
    argument abstract protected function theprefixName($name); } class ChildClass
    extends ParentClass { public function theprefixName($vname) { if ($vname == "John
    Snow") { $theprefix = "Mister."; } else-if ($vname == "Jane Snow") { $theprefix
    = "Mrs."; } else { $theprefix = ""; } return "{$theprefix} {$vname}"; } } $class
    = new ChildClass; echo $class->theprefixName("John Snow"); echo "<br>"; echo $class->theprefixName("Jane
    Snow"); ?> </body> </html> $php main.php <html> <head> <title>This is PHP</title>
    </head> <body> Mister. John Snow<br>Mrs. Jane Snow</body> </html> Here is another
    example of the same abstract class. <html> <head> <title>This is PHP</title> </head>
    <body> <?php abstract class ParentClass { // This is an Abstract method with an
    argument abstract protected function theprefixName($name); } class ChildClass
    extends ParentClass { public function theprefixName($vname, $theseparator = ".",
    $vgreet = "My dear ") { if ($vname == "John Snow") { $theprefix = "Mister."; }
    else-if ($vname == "Jane Snow") { $theprefix = "Mrs."; } else { $theprefix = "";
    } return "{$vgreet} {$theprefix}{$theseparator} {$vname}"; } } $class = new ChildClass;
    echo $class->theprefixName("John Snow"); echo "<br>"; echo $class->theprefixName("Jane
    Snow"); ?> </body> </html> $php main.php <html> <head> <title>This is PHP</title>
    </head> <body> My dear  Mister.. John Snow<br>My dear  Mrs.. Jane Snow</body>
    </html> '
