    # 结论


    既然你已经读到了这本书的最后，我希望你已经学习了许多关于 `PHP` 脚本语言基础的知识。我在书中为你提供了实用的代码、说明和深入的解释，以便你利用它们来理解脚本，并可以通过编辑它们来创建独特的脚本。如果你能应用书中学到的课程，你将在短时间内成为一名熟练的用户。


    除了旨在通过登录界面猜测你密码的暴力攻击外，24 小时不不停地工作以利用网站 `PHP` 代码中漏洞的机器人（bots），被认为是针对你网站漏洞的攻击常见的攻击形式。你必须不断考虑
    `PHP` 编码中的漏洞，以便消除它们并让你的 `PHP` 代码更加强大。


    ## 远程代码执行 (RCE)


    远程代码执行是指黑客向网站上传恶意代码并立即执行的攻击方式。如果 `PHP` 存在漏洞，它将接受用户的恶意输入并将其作为 `PHP` 代码读取。这允许黑客指示网站创建一个包含该代码的新文件，从而授予恶意黑客对网站的完全访问权限。当黑客将代码发送到
    Web 应用程序并被及时执行时，就会授予黑客访问你网站的权限。通过这种方式，他们可以成功利用 RCE 漏洞。


    ## SQL 注入


    SQL 注入是黑客可以利用来攻击 Web 应用程序的另一种漏洞。通过 SQL 注入，黑客可以向 Web 应用程序的数据库发送恶意指令。Web 应用数据库由于代码漏洞执行这些指令并允许黑客进入。这种攻击通常发生在
    Web 开发人员没有对用户输入安装过滤屏障的情况下。这允许恶意用户在 Web 应用中填充恶意代码。


    SQL 注入允许黑客访问网站数据。黑客可以在数据库中创建新数据，这些数据可能包含指向垃圾邮件网站的链接。攻击者可能使用 SQL 注入创建一个管理员账户，并使用它获得对你网站应用程序的完全控制权。免受此类漏洞最好的方法是为用户输入建立过滤屏障。应该先对输入进行验证，然后允许其进入网站的数据库。


    ## 跨站脚本 (XSS)


    当恶意黑客找到在网站上加载并执行恶意代码的方法时，就会发生跨站脚本（XSS）。这种恶意代码可以授予黑客管理员权限。


    - **存储型 XSS (Stored XSS)**：当恶意黑客让网站存储恶意代码，随后这些代码在另一个用户的浏览器中呈现并被相应执行时，就会发生存储型 XSS。一个实际例子是黑客在
    WordPress 网站上发布包含恶意代码的注释。

    - **反射型 XSS (Reflected XSS)**：当攻击者创建一个包含恶意代码的链接并加载到浏览器时，就会发生反射型 XSS。网站将其读取为网站内容。随后代码在用户的浏览器中执行，并可能让黑客窃取
    Cookie 或执行恶意任务。


    这些是你在学习 `PHP` 后应该考虑的一些 Web 应用程序漏洞。这本书是学习 `PHP` 细节的完整指南。我详细解释了主要主题，让你了解网站应用程序是如何工作的。书中详细介绍了网站的两个主要部分。你可以利用这些实用信息，在
    Web 应用程序领域进一步增强你的知识。


