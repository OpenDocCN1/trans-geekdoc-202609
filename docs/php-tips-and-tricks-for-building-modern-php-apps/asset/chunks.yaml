- fmt: "\n# Chapter Three: Creating PHP Scripts\n\nPHP scripts generally refer to\
    \ a series of instructions in a file with an extension that instructs the webserver\
    \ on looking for PHP sections inside of a file. The extension is usually known\
    \ as `.phtml` and `.php`. Instructions in PHP are labeled as statements that can\
    \ either be simple or complex. Complex statements tend to execute one or more\
    \ blocks of statements.\n\n## Conditions\n\nConditions in PHP are expressions\
    \ that PHP tests or evaluate to verify if the conditions are true and false. PHP\
    \ conditions are generally used in the form of complex statements to check whether\
    \ a block that is filled with simple statements can be executed or not. You have\
    \ to compare different values to set a condition. \n\n### The if Statement\n\n\
    The `if` statement will execute the code if one condition stands true. The first\
    \ part of the `if` statement, which you will see in the example, is the `if` part.\
    \ If the condition is true, the block of statements is executed. When they are\
    \ executed, the script will shift to the next instruction by following the conditional\
    \ statement. If the conditional statement possesses an `else-if` or `else` sections,\
    \ the script will skip over it. If the condition is false, the block of statements\
    \ is not executed. The script will skip over to the next instruction that will\
    \ be an `else-if` or an `else`, or any other next instruction after the `if` conditional\
    \ statement.\n\nAnother keyword in the `if` statement is known as `else`. This\
    \ part is considered optional. Just one `else` can be integrated into the `if`\
    \ statement. It is not meant to test any condition. However, it is aimed at executing\
    \ a block of statements. The script tends to enter the `else` section when the\
    \ `if` section and the `else-if` sections are not true.\n\nLet’s try an `if else`\
    \ statement.\n\n```html\n<html>\n<head>\n<title>This is PHP</title>\n</head>\n\
    <body>\n<?php\n$t = date(\"H\");\nif ($t < \"15\") {\n    echo \"Welcome! I wish\
    \ you a good day!\";\n} else {\n    echo \"Good night! I have to go now!\";\n\
    }\n?>\n</body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>This\
    \ is PHP</title>\n</head>\n<body>\nWelcome! I wish you a good day!\n</body>\n\
    </html>\n```\n\nHere is a block of code that contains the `if-else` statements\
    \ in their entirety.\n\n```html\n<html>\n<head>\n<title>This is PHP</title>\n\
    </head>\n<body>\n<?php\n$thescore = 100;\nif ($thescore > 95 ) {\n    $thegrade\
