    # 启动 Apache


    安装 Apache 后，你可能想要启动它。向导可能已经启动了它。但是，当你更改配置设置时，应当在这些新设置生效之前重启 Apache。无论如何，Apache
    已经准备好就绪。


    你可以找到 Apache 的某些菜单项，用于停止或启动它。你可以点击 `Start`，进入 `Programs`，然后打开 `Apache HTTP Server`
    来进入此菜单。现在，点击 `Control Apache Server` 查看菜单包含哪些功能。


    你在菜单上看到的第一个选项是 `Start`。当 Apache 未在运行时，此选项将启动 Apache。如果你在 Apache 已经在运行时点击此项，你将看到一条错误信息，提示
    Apache 已经启动。菜单中的第二个选项是 `Stop`。你可以用它来停止 Apache。另一个选项允许你在 Apache 已经运行时对其进行 `Restart`（重启）。


    你可以通过一系列命令从 Apache 中获取大量信息。你可以通过进入 `Command Prompt` 窗口获取信息。要到达那里，点击 `Start`，然后点击
    `Accessories`，再进入 `Command Prompt`。现在切换到安装 Apache 的 `bin` 目录。


    如果你想找出计算机上安装的是哪个版本的 Apache，你应当在命令提示符窗口输入以下命令：

    ```

    apache –v

    ```

    如果你想找出编译到 Apache 中的模块，你应该输入以下命令：

    ```

    apache –1

    ```

    你也可以通过以下命令启动或停止 Apache：

    ```

    apache -k start

    apache –k stop

    ```

    你可以通过输入以下命令查看可用的选项：

    ```

    apache -h

    ```


    # Apache 配置


    当 Apache 启动时，它会开始从一个特定的配置文件读取信息。如果 Apache 无法读取配置文件，它将无法启动。Apache 的行为取决于指令。你可以通过编辑配置文件并然后重启
    Apache 来更改 Apache 的行为，使其读取新的指令。


    如果你选择安装 PHP，你需要配置 Apache 以识别 PHP 程序。Apache 会在名为 `Document Root` 的目录及其子目录下查找特定的网页文件。你可以继续更改
    `Document Root` 的位置。


    # 安装 PHP


    安装 PHP 的第一步是检查操作系统是否已经安装了 PHP。你可以搜索硬盘来查找任何 PHP 文件。如果你使用的是 Windows 操作系统，可以使用 `Find`
    功能来定位 PHP。点击 `Start` 然后按 `Find`。如果你在计算机系统上找不到 PHP 文件，则系统尚未安装 PHP。你的系统中可能存在 PHP
    文件，但它们不需要安装在系统上。也可能你计算机上安装的 PHP 版本不是最新的。


    ## 获取 PHP


    你可以从互联网下载 PHP。确保你正在下载的版本是最新版。只有当你必须维护或修改网站的现有代码时，才应该选择安装旧版本的 PHP。你用某一个 PHP 版本编写的代码在另一个版本的
    PHP 上运行可能可能需要进行修改。


    你可以访问 [www.php.net](http://www.php.net) 下载适用于所有类型操作系统的 PHP。还提供用于编译你操作系统的源代码供下载。在
    Mac 和 Linux 上，源代码的编译和安装更加简单。正如前面提到的，你可以下载二进制文件来简化 Windows 的安装过程。


    官方网站提供了 Windows 版本的 zip 压缩包。


    '
