    <?php include ''footer.php'';?> ?> </body> </html> File Handling File handling
    is an integral part of web applications. More often you ought to open and then
    process a particular file for a number of tasks. There are a number of functions
    for reading, creating, editing, and uploading files. When you are trying to manipulate
