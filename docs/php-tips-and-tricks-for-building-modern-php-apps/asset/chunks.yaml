    # 第九章：PHP 在现代应用开发中的性


    PHP 被认为是全球范围内受欢迎的编程语言之一。得益于 `Drupal` 和 `WordPress` 等内容管理系统（CMS）的巨大流行，大多数顶级网站都在使用它。借助
    `Laravel` 和 `Symfony` 等流行框架，PHP 在开发 Web 应用方面需求巨大。基于 JavaScript 的 `Node.js` 曾挑战
    PHP 的地位。然而，它并没有动摇 PHP 长期以来占据的统治地位。仍有大量的程序员在使用 PHP。尽管 PHP 是最面向对象且高效的语言之一，但在开发创新型和现代化应用时，它经常被忽视。开发者和决策者之间最常见的共识是，它在构建许多网站使用的
    CMS 软件应用构建者中非常流行。它倾向于在基于 CMS 的电子商务商店和网络门户等通用编程项目中表现出色。PHP 仍然是全球一些最流行、最成功的科技公司的核心，例如
    `Blablacar`、`Facebook` 和 `Slack`。Slack 对于需要管理数百名员工远程团队的企业来说非常受欢迎。越来越多的企业选择使用 PHP
    为其初创公司构建现代应用。PHP 每天都在变得更好，为企业和开发者提供了许多优势。尽管存在刻板印象，它是可以与 `WebSocket` 工作的；但它也有自己的局限性。如果你有一个希望尽快推向市场的业务，你可以选择
    PHP。当你与大量企业竞争时，你发布想法的速度至关重要。为了保持竞争领先地位，快速启动是一个好主意。快速启动将帮助你发现以前可能没有考虑过的独特业务模式。如果业务构想要求你创建一个
    Web 应用，PHP 可以是一个完美的选择。你可以使用流行的 PHP 框架 `Laravel` 和 `Symfony` 以非常快的方式创建 Web 应用。你可以从这样一个事实中推断出
    PHP 的流行程度：大约 81% 的网站使用 PHP 作为服务器端的脚本语言。PHP 在现代应用开发中日益增长的流行程度是因为某些经过证明的益处。


    ## 内置特性

    与许多其他编程语言不同，PHP 最初是专为 Web 应用开发设计的。因此，设计者从一开始就向它中塞满了许多构建不同类型的网站和 Web 应用所需的特殊内置功能。你可以使用
    PHP 中的内置功能（如 `functions` 和 `classes`）来执行各种 Web 开发操作和任务。在编写程序时，你可以在代码的任何点调用 `classes`
    和 `functions` 来执行特定任务。这使得 PHP 构建应用变得既简单又有趣。PHP 支持多种操作系统，如 `Mac OSX`、`Windows`
    和 `UNIX`。用 PHP 编写的 Web 应用运行在所有主要平台上。你还可以将 PHP 部署在 `IIS`、`Netscape`、`Apache`、`Personal
    Web server` 和 `iPlanet server` 上。因此，你可以构建 PHP 网站和应用，而不必担心其托管选项和部署。


    ## 灵活性

    PHP 是一种高度灵活的语言，基于 `C++` 和 `C` 等流行编程语言设计。你可以轻松地阅读、理解并使用这种服务器端编程语言的语法，而无需任何额外的精力和时间。你还有多种方式编写和使用
    PHP 代码。你可以像我们在书中所有代码中所做将其嵌入 `HTML` 代码中，也可以将代码与 Web 框架结合。你还可以通过命令行界面执行它。


    ## 流行数据库

    现在的大多数 Web 应用都考虑高效快速地访问和交付大量数据。大企业总是希望在后端环境中使用高级数据库。PHP 支持许多广泛使用的数据库，如 `SQLite`、`MySQL`
    和 `Frontbase` 等。这就是你如何满足不同业务客户的需求。如果我们分析 PHP，我们可以发现，通过使用大量的开源库和框架，我们可以大幅缩短编码时间。根据手头项目的需求，你可以从不同的
    PHP 框架中选择，如 `Codelgniter`、`CakePHP` 等许多框架。这些框架使编码变得简单快速。通过使用 `Requests`、`Mink`、`Ratchet`
    和 `Faker` 等常用 PHP 库，你不需要编写冗长的脚本和复杂的代码。PHP 以开源许可发布；因此，你可以在不花费任何许可费用的情况下使用所有组件。


    ## PHP 的益处

    Hypertext Preprocessor（超文本预处理器）或 PHP 开发改变了过去 Web 开发的方式。对于 PHP 软件开发已成为开发动态且精确网站的最敏捷、最先进的系统这一点，是不容疑的。PHP
    可以满足大型企业的需求。集成到网站中的功能必须是流畅的。无疑，这是构建者喜欢为客户定制大型网站的最青睐的方面。这是因为使用 PHP 有许多优势。`Laravel`
    PHP 的内部开发正由于一个出色的身份验证系统而增长。通过使用它，应用身份验证变得简洁。


    ### 简单 API

    `Laravel` Hypertext Preprocessor 提供了一个流畅的平台，通过云服务或本地服务向不同人员发送应用内电子邮件。它还支持通过 `Slack`
    等动态通道推送通知。在专业开发整合公司的帮助下，互联网应用程序在移动时是完全安全的。


    ## 优化

    许多 B2C Web 应用不仅应该非常易用，而且还应该更容易被客户发现。互联网上的电子商务商店只有在拥有顶尖搜索引擎优化（SEO）服务的情况下才能生存。如果你想让你的
    Web 应用在网上排名更高，你必须向它填充最相关的关键词以便在最流行的搜索引擎中排名。在开发阶段，你应该考虑这些事实。搜索引擎爬虫喜欢整洁的 `HTML`，因为更容易阅读。创建简洁的代码是
    PHP 创建的理由之一。以 `Wikipedia` 为例，它每天吸引海流量。它是用 PHP 语言构建的。一些专家认为，在很大程度上，每个吸引流量的文本类网站都是用
    PHP 编写。


    ## 应用稳定性

    PHP 在过去的二十年里表现良好，事实证明是一个稳定的解决方案。`Laravel` 和 `Symfony` 已用于现代应用开发多年。它们随着时间的推移趋于成熟，并消除了曾经困扰这种语言的大多数缺陷。尽管如此，随着技术趋势的改变，这些框架仍在不断改进。


    ## 维护

    与其他编程语言不同，PHP 对代码的可读性和维护性的重视很少。PHP 框架倾向通过支持模型-视图-控制器（MVC）架构来简化应用的开发和维护。开发者可以利用该架构将
    PHP 拆分为视图、模型和控制器。


