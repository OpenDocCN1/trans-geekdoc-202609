  trans: "\n\n# 第五章：面向对象编程\n\n面向对象编程（OOP）是一种围绕类和对象的特殊编程方法。它是目前 PHP 最流行的用法之一。PHP5 的发布是作为面向对象编程的改进版本。它具有更快的速度和更改进的功能。面向对象编程，缩写为\
    \ OOP，并不是关于使用不同的语法，而是关于为你提供一种不同的分析问题并刻画其解决方案的方法。在 OOP 中，脚本被视为一组不同的对象，这些对象代表了脚本必须解决的问题元素。如果脚本是关于一个二手车交易场的，那么对象可以是客户和汽车。OOP\
    \ 带来了新的概念和术语。\n\n## 类 (Classes)\n\n面向对象编程的基本元素之一是对象。你可以将它们看作代码形式的物理对象。一个 PHP 对象可以是一辆汽车、一只猫或一只狗。你可以给它们赋予某些属性，在编程世界中被称为属性（attributes）。例如，猫可以有坐下、在地上滚等属性。汽车可以有颜色、型号和公司名称等属性。\n\
    \nPHP 代码中的类充当用于创建对象的模板。类通常定义了特定对象的属性。它还会定义对象所执行的一系列操作，例如它的职责。你写了一个类来定义一个带有引擎和四个轮子的汽车。该类列出了汽车可以做的事情，比如它可以向前移动也可以停车。\n\
    \n你也可以写像下面这样的语句：\n\n```html\n<html\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n\
    <body>\n<?php\nclass Vegetables {\n    // 这些是属性 (Properties)\n    public $vname;\n\
    \    public $vcolor;\n    // 这些是方法 (Methods)\n    function set_name($vname) {\n\
    \        $this->vname = $vname;\n    }\n    function get_name() {\n        return\
    \ $this->vname;\n    }\n}\n?>\n</body>\n</html>\n```\n\n在类中，变量被标记为属性（properties），而函数被称为方法（methods）。没有对象，类一无是处。你可以自由地从一个类中创建大量的对象。每个对象都包含该类中定义的某些属性和方法，但是它们的属性值是不同的。`new`\
    \ 关键字用于创建类的对象。然后是 `Vegetables` 类的实例。\n\n```html\n<<html>\n<head>\n<title>这是一个\
    \ PHP 函数示例</title>\n</head>\n<body>\n<?php\nclass Vegetables {\n    // 这些是属性 (Properties)\n\
    \    public $vname;\n    public $vcolor;\n    // 这些是方法 (Methods)\n    function\
    \ set_name($vname) {\n        $this->vname = $vname;\n    }\n    function get_name()\
    \ {\n        return $this->vname;\n    }\n}\n$potato = new Vegetables();\n$beet\
    \ = new Vegetables();\n$potato->set_name('Potato');\n$beet->set_name('Beet');\n\
    echo $potato->get_name();\necho \"<br>\";\necho $beet->get_name();\n?>\n</body>\n\
    </html>\n```\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n\
    </head>\n<body>\nPotato<br>Beet\n</body>\n</html>\n```\n\n在下一个代码段中，我将向同一个蔬菜类再添加两个方法。我添加了用于给对象添加颜色的方法。\n\
    \n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\n<?php\n\
    class Vegetables {\n    // 这些是属性 (Properties)\n    public $vname;\n    public\
    \ $vcolor;\n    // 这些是方法 (Methods)\n    function set_name($vname) {\n        $this->vname\
    \ = $vname;\n    }\n    function get_name() {\n        return $this->vname;\n\
    \    }\n    function set_color($vcolor) {\n        $this->vcolor = $vcolor;\n\
    \    }\n    function get_color() {\n        return $this->vcolor;\n    }\n}\n\
    $potato = new Vegetables();\n$beet = new Vegetables();\n$potato->set_name('Potato');\n\
    $potato->set_color('Red');\n$beet->set_name('Beet');\n$beet->set_color('Blue');\n\
    echo $potato->get_name();\necho \"Color: \" . $potato->get_color();\necho \"<br>\"\
    ;\necho $beet->get_name();\necho \"<br>\";\necho \"Color: \" . $beet->get_color();\n\
    ?>\n</body>\n</html>\n```\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是一个\
    \ PHP 函数示例</title>\n</head>\n<body>\nPotatoColor: Red<br>Beet<br>Color: Blue\n\
    </body>\n</html>\n```\n\n## 蔬菜类 (Vegetable Class)\n\n当你必须定义一个类时，你应该在最顶部声明属性。不需要声明变量。你可以根据自己的需要直接使用它们，而无需先声明。然而，在创建类时声明属性会更好。这使得类变得更容易理解。如果你遗漏了，会被认为是一种糟糕的编程习惯。\n\
    \n你为每个属性需要一个关键字，以决定如何访问它们：\n\n- `public` 关键字：可以在类外部的另一个类或脚本中访问。\n- `private` 关键字：无法从类的外部访问属性。\n\
    - `protected` 关键字：可以在类内部或其子类中访问。\n\n## 构造函数 (Constructor Function)\n\nPHP 构造允许你在创建对象时初始化对象的属性。当你从类中创建一个对象时，PHP\
    \ 会调用该函数。\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n\
    <body>\n<?php\nclass Vegetables {\n    // 这些是属性 (Properties)\n    public $vname;\n\
    \    public $vcolor;\n    // 这些是方法 (Methods)\n    function __construct($vname)\
    \ {\n        $this->vname = $vname;\n    }\n    function get_name() {\n      \
    \  return $this->vname;\n    }\n}\n$potato = new Vegetables(\"Potato\");\necho\
    \ $potato->get_name();\n?>\n</body>\n</html>\n```\n`$php main.php`\n\n```html\n\
    <html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\nPotato\n</body>\n\
    </html>\n```\n\n我将向现有代码中添加另一个颜色功能。查看 `__construct` 中的更改。\n\n```html\n<html>\n\
    <head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\n<?php\nclass Vegetables\
    \ {\n    // 这些是属性 (Properties)\n    public $vname;\n    public $vcolor;\n    public\
    \ $weight;\n    public $shape;\n    // 这些是方法 (Methods)\n    function __construct($vname,\
    \ $vcolor, $weight, $shape) {\n        $this->vname = $vname;\n        $this->vcolor\
    \ = $vcolor;\n        $this->weight = $weight;\n        $this->shape = $shape;\n\
    \    }\n    function get_name() {\n        return $this->vname;\n    }\n    function\
    \ get_color() {\n        return $this->vcolor;\n    }\n    function get_weight()\
    \ {\n        return $this->weight;\n    }\n    function get_shape() {\n      \
    \  return $this->shape;\n    }\n}\n$potato = new Vegetables(\"Potato\", \"Red\"\
    , 50, \"round\");\necho $potato->get_name();\necho \"<br>\";\necho $potato->get_color();\n\
    echo \"<br>\";\necho $potato->get_weight();\necho \"<br>\";\necho $potato->get_shape();\n\
    \n$beet = new Vegetables(\"Beet\", \"Blue\", 50, \"round\");\necho $beet->get_name();\n\
    echo \"<br>\";\necho $beet->get_color();\necho \"<br>\";\necho $beet->get_weight();\n\
    echo \"<br>\";\necho $beet->get_shape();\n\n$tomato = new Vegetables(\"Tomato\"\
    , \"Red\", 100, \"round\");\necho $tomato->get_name();\necho \"<br>\";\necho $tomato->get_color();\n\
    echo \"<br>\";\necho $tomato->get_weight();\necho \"<br>\";\necho $tomato->get_shape();\n\
    \n$turnip = new Vegetables(\"Turnip\", \"White\", 150, \"round\");\necho $turnip->get_name();\n\
    echo \"<br>\";\necho $turnip->get_color();\necho \"<br>\";\necho $turnip->get_weight();\n\
    echo \"<br>\";\necho $turnip->get_shape();\n?>\n</body>\n</html>\n```\n`$php main.php`\n\
    \n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\nPotato\n\
    Red\n50\nround\nBeet\nBlue\n50\nround\nTomato\nRed\n100\nround\nTurnip\nWhite\n\
    150\nround\n</body>\n</html>\n```\n\n## 析构函数 (Destructor)\n\n当对象被销毁或脚本停止或退出时，你需要调用\
    \ `__destruct()`。如果你有机会创建一个 `__destruct()` 函数，PHP 在脚本结束时调用它。和构造函数一样，析构函数也以两个下划线开头。\n\
    \n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\n<?php\n\
    class Vegetables {\n    // 这些是属性 (Properties)\n    public $vname;\n    public\
    \ $vcolor;\n    // 这些是方法 (Methods)\n    function __construct($vname, $vcolor)\
    \ {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n    }\n\
    \    function __destruct() {\n        echo \"The vegetable is {$this->vname} and\
    \ the color is {$this->vcolor}.\";\n    }\n}\n$potato = new Vegetables(\"Potato\"\
    , \"Brown\");\n$beet = new Vegetables(\"Beet\", \"Red\");\n?>\n</body>\n</html>\n\
    ```\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n\
    </head>\n<body>\n</body>\n</html>\n```\nThe vegetable is Beet and the color is\
    \ Red. The vegetable is Potato and the color is Brown.\n\n## PHP 访问修饰符 (PHP Access\
    \ Modifiers)\n\nPHP 属性和方法通常有访问修饰符来控制它们如何被访问。通常有三种修饰符：`public`、`protected` 和 `private`。\n\
    \n- `public` 修饰符：可以在任何地方访问。\n- `protected` 修饰符：可以在类内部以及派生自类中访问。\n- `private` 修饰符：只能在类内部访问。\n\
    \n在这个例子中，我为上述属性添加了三种不同的访问修饰符。如果你设置 name 属性将会成功。但是如果你设置 weight 或 color 属性将会报错。\n\
    \n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\n<?php\n\
    class Vegetable {\n    public $vname;\n    protected $vcolor;\n    private $weight;\n\
    }\n$beet = new Vegetable();\n$beet->vname = 'Beet'; // OK\n$beet->vcolor = 'Purplish\
    \ Red'; // 将触发 ERROR\n$beet->weight = '50'; // 将触发 ERROR\n?>\n</body>\n</html>\n\
    ```\nPHP Fatal error: Uncaught Error: Cannot access protected property Vegetable::$vcolor\
    \ in /home/cg/root/27113/main.php:15\nStack trace: #0 {main} thrown in /home/cg/root/27113/main.php\
    \ on 15\n\n## 继承 (Inheritance)\n\nOOP 中的继承意味着一个类派自另一个类。子类倾向于继承父类几乎所有的保护和公共方法及属性。它也可以拥有自己的方法和属性。你可以使用\
    \ `extends` 关键字来定义它。\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n\
    </head>\n<body>\n<?php\nclass Vegetable {\n    public $vname;\n    public $vcolor;\n\
    \    function __construct($vname, $vcolor) {\n        $this->vname = $vname;\n\
    \        $this->vcolor = $vcolor;\n    }\n    public function intro() {\n    \
    \    echo \"The vegetable is {$this->vname} and its color is {$this->vcolor}.\"\
    ;\n    }\n}\n// The beet is inherited from Vegetable\nclass Beet extends Vegetable\
    \ {\n    public function message() {\n        echo \"Does beet taste like fruit\
    \ or vegetable?\";\n    }\n}\n$beet = new Beet(\"Beet\", \"purplish red\");\n\
    $beet->message();\n$beet->intro();\n?>\n</body>\n</html>\n```\n`$php main.php`\n\
    \n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\nThe\
    \ vegetable is Beet and its color is purplish red.\n</body>\n</html>\n```\n\n\
    由于 `Beet` 派自 `Vegetable` 类，它可以使用主类中的 `vname` 和 `vcolor` 属性以及其他方法。它也有自己的名为 `message`\
    \ 的方法。在下一个例子中，我将主类的函数从 `public` 为 `protected`。你将在编辑器屏幕上看到一个致命错误。\n\n```html\n\
    <html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\n<?php\nclass Vegetable\
    \ {\n    public $vname;\n    public $vcolor;\n    function __construct($vname,\
    \ $vcolor) {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n\
    \    }\n    protected function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\n// The beet is inherited from\
    \ Vegetable\nclass Beet extends Vegetable {\n    public function message() {\n\
    \        echo \"Does beet taste like fruit or vegetable?\";\n    }\n}\n$beet =\
    \ new Beet(\"Beet\", \"purplish red\");\n$beet->message();\n$beet->intro();\n\
    ?>\n</body>\n</html>\n```\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是一个\
    \ PHP 函数示例</title>\n</head>\n<body>\nPHP Fatal error: Uncaught Error: Call to\
    \ protected method Vegetable::intro() in /home/cg/root/27113/main.php:27\nStack\
    \ trace: #0 {main} thrown in /home/cg/root/27113/main.php on 27\n```\n\n有一个解决这个问题的方法。我们可以在派生类内部调用保护的\
    \ `intro()` 方法。\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n\
    <body>\n<?php\nclass Vegetable {\n    public $vname;\n    public $vcolor;\n  \
    \  function __construct($vname, $vcolor) {\n        $this->vname = $vname;\n \
    \       $this->vcolor = $vcolor;\n    }\n    protected function intro() {\n  \
    \      echo \"The vegetable is {$this->vname} and its color is {$this->vcolor}.\"\
    ;\n    }\n}\n// The beet is inherited from Vegetable\nclass Beet extends Vegetable\
    \ {\n    public function message() {\n        echo \"Does beet taste like fruit\
    \ or vegetable?\";\n    }\n    public function intro() {\n        // 现在在派生类内部调用该方法\n\
    \        $this->intro();\n    }\n}\n$beet = new Beet(\"Beet\", \"purplish red\"\
    );\n$beet->message();\n$beet->intro();\n?>\n</body>\n</html>\n```\n\n## 重写继承 (Overriding\
    \ Inheritance)\n\n如果在子类中重新定义继承的方法，就可以进行重写。在下面的例子中，我将重写它们。\n\n```html\n<html>\n\
    <head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\n<?php\nclass Vegetable\
    \ {\n    public $vname;\n    public $vcolor;\n    function __construct($vname,\
    \ $vcolor) {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n\
    \    }\n    public function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\n// The beet is inherited from\
    \ Vegetable\nclass Beet extends Vegetable {\n    public $vweight;\n    function\
    \ __construct($vname, $vcolor, $vweight) {\n        $this->vname = $vname;\n \
    \       $this->vcolor = $vcolor;\n        $this->weight = $vweight;\n    }\n \
    \   public function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}, and its size is {$vweight}\";\n    }\n}\n\
    $beet = new Beet(\"Beet\", \"purplish red\", 500);\n$beet->intro();\n?>\n</body>\n\
    </html>\n```\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n\
    </head>\n<body>\nThe vegetable is Beet and its color is purplish red, and its\
    \ size is 500\n</body>\n</html>\n```\n\n你可以通过在脚本中插入 `final` 关键字来防止重写。\n\n```html\n\
    <html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\n<?php\nfinal class\
    \ Vegetable {\n    public $vname;\n    public $vcolor;\n    function __construct($vname,\
    \ $vcolor) {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n\
    \    }\n    public function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\n// The beet is inherited from\
    \ Vegetable\nclass Beet extends Vegetable {\n    public $vweight;\n    function\
    \ __construct($vname, $vcolor, $vweight) {\n        $this->vname = $vname;\n \
    \       $this->vcolor = $vcolor;\n        $this->weight = $vweight;\n    }\n \
    \   public function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\n$beet = new Beet(\"Beet\", \"\
    purplish red\", 500);\n$beet->intro();\n?>\n</body>\n</html>\n```\n`$php main.php`\
    \ PHP Fatal error: Class Beet may not inherit from final class (Vegetable) in\
    \ /home/cg/root/271113/main.php on line 30\n\n## 抽象类 (Abstract Class)\n\n当你继承抽象类时，子类方法应当以相同的名称和限制较少的修饰符定义。如果抽象方法定义为\
    \ `protected`，则子类方法需要定义为 `public` 或 `protected`。所需参数的数量和类型应当相同。\n\n```html\n<html>\n\
    <head>\n<title>这是一个 PHP 函数示例</title>\n</head>\n<body>\n<?php\nabstract class Vegetable\
    \ {\n    public $vname;\n    public $vcolor;\n    function __construct($vname,\
    \ $vcolor) {\n        $this->vname = $vname;\n        $this->vcolor = $vcolor;\n\
    \    }\n    abstract protected function intro();\n}\nclass Beet extends Vegetable\
    \ {\n    public function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\nclass Onion extends Vegetable\
    \ {\n    protected function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\nclass Pumpkin extends Vegetable\
    \ {\n    public function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\nclass Radish extends Vegetable\
    \ {\n    protected function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\nclass Tomato extends Vegetable\
    \ {\n    public function intro() {\n        echo \"The vegetable is {$this->vname}\
    \ and its color is {$this->vcolor}.\";\n    }\n}\n$beet = new Beet(\"Beet\", \"\
    purplish red\");\n$beet->intro();\n$onion = new Onion(\"Onion\", \"white\");\n\
    $onion->intro();\n$pumpkin = new Pumpkin(\"Pumpkin\", \"green\");\n$pumpkin->intro();\n\
    $radish = new Radish(\"Radish\", \"red\");\n$radish->intro();\n$tomato = new Tomato(\"\
    Tomato\", \"red\");\n$tomato->intro();\n?>\n</body>\n</html>\n```\n\n## 抽象类示例\
    \ (Abstract Class Examples)\n\n```html\n<html>\n<head>\n<title>这是一个 PHP 函数示例</title>\n\
    </head>\n<body>\n<?php\nabstract class ParentClass {\n    // This is an Abstract\
    \ method with an argument\n    abstract protected function prefixName($name);\n\
    }\nclass ChildClass extends ParentClass {\n    public function prefixName($vname)\
    \ {\n        if ($vname == \"John Snow\") {\n            $theprefix = \"Mister.\"\
    ;\n        } else-if ($vname == \"Jane Snow\") {\n            $theprefix = \"\
    Mrs.\";\n        } else {\n            $theprefix = \"\";\n        }\n       \
    \ return \"{$theprefix} {$vname}\";\n    }\n}\n$class = new ChildClass();\necho\
