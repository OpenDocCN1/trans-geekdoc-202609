  trans: "\n\n# 第三章：创建 PHP 脚本\n\nPHP 脚本通常指的是具有特定扩展名的文件中的系列指令，这些指令指示 Web 服务器在文件中查找\
    \ PHP 部分。该扩展名通常为 `.phtml` 和 `.php`。PHP 中的指令被标记为语句（statements），这些语句可以是简单的，也可以是复杂的。复杂语句往往执行一个或多个语句块。\n\
    \n## 条件\n\nPHP 中的条件是 PHP 测试或评估的表达式，用以验证条件是否为真或假。PHP 条件通常以复杂语句的形式使用，用于检查填充有简单语句的块是否可以执行。你必须比较不同的值来设置条件。\n\
    \n### if 语句\n\n当其中一个条件为真时，`if` 语句将执行代码。`if` 语句的第一部分（你将在示例中看到的）是 `if` 部分。如果条件为真，则执行该语句块。当它们被执行时，脚本将通过遵循条件语句跳转到下一条指令。如果条件语句拥有\
    \ `else-if` 或 `else` 部分，脚本将跳过它们。如果条件为假，则不执行该语句块。脚本将跳到下一条指令，该指令将是 `else-if`、`else`，或者\
    \ `if` 条件语句之后的任何其他后续指令。\n\n`if` 语句中的另一个关键字是 `else`。这部分被认为是可选的。一个 `else` 可以集成到\
    \ `if` 语句中。它不是为了测试任何条件。然而，它的目的是执行一个语句块。当 `if` 部分和 `else-if` 部分不为真时，脚本往往进入 `else`\
    \ 部分。\n\n让我们尝试一个 `if else` 语句。\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n\
    </head>\n<body>\n<?php\n$t = date(\"H\");\nif ($t < \"15\") {\n    echo \"Welcome!\
    \ I wish you a good day!\";\n} else {\n    echo \"Good night! I have to go now!\"\
    ;\n}\n?>\n</body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n\
    <title>这是 PHP</title>\n</head>\n<body>\nWelcome! I wish you a good day!\n</body>\n\
    </html>\n```\n\n这是一个包含完整 `if-else` 语句的代码块。\n\n```html\n<html>\n<head>\n<title>这是\
    \ PHP</title>\n</head>\n<body>\n<?php\n$thescore = 100;\nif ($thescore > 95 )\
    \ {\n    $thegrade = \"A\";\n    $themessage = \"This is Excellent!\";\n} else-if\
    \ ($thescore <= 95 and $thescore > 85 ) {\n    $thegrade = \"B\";\n    $themessage\
    \ = \"This is Very Good!\";\n} else-if ($thescore <= 85 and $thescore > 75 ) {\n\
    \    $thegrade = \"C\";\n    $themessage = \"This is Okay. Not as much good as\
    \ it should have\";\n} else-if ($thescore <= 75 and $thescore > 65 ) {\n    $thegrade\
    \ = \"D\";\n    $themessage = \"Not good. In fact really bad!\";\n} else {\n \
    \   $thegrade = \"F\";\n    $themessage = \"You are doomed!\";\n}\necho $themessage.\"\
    \\n\";\necho \"Your grade is $thegrade\\n\";\n?>\n</body>\n</html>\n```\n\n`$php\
    \ main.php`\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n\
    This is Excellent! Your grade is A\n</body>\n</html>\n```\n\n现在我将更改分数让第二个代码块工作。这是示例：\n\
    \n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n<?php\n$thescore\
    \ = 90;\nif ($thescore > 95 ) {\n    $thegrade = \"n\";\n    $themessage = \"\
    This is Excellent!\";\n} else-if ($thescore <= 95 and $thescore > 85 ) {\n   \
    \ $thegrade = \"B\";\n    $themessage = \"This is Very Good!\";\n} else-if ($thescore\
    \ <= 85 and $thescore > 75 ) {\n    $thegrade = \"C\";\n    $themessage = \"This\
    \ is Okay. Not as much good as it should have\";\n} else-if ($thescore <= 75 and\
    \ $thescore > 65 ) {\n    $thegrade = \"D\";\n    $themessage = \"Not good. In\
    \ fact really bad!\";\n} else {\n    $thegrade = \"F\";\n    $themessage = \"\
    You are doomed!\";\n}\necho $themessage.\"\\n\";\necho \"Your grade is $thegrade\\\
    n\";\n?>\n</body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n\
    <title>这是 PHP</title>\n</head>\n<body>\nThis is Very Good! Your grade is B\n</body>\n\
    </html>\n```\n\n在下面的示例中，我将输入小于 85 的值，以便第三个 `else-if` 语句生效。浏览器将忽略 `if 语句`和第一个 `else-if`\
    \ 语句。\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n</head>\n<body>\n<?php\n\
    $thescore = 80;\nif ($thescore > 95 ) {\n    $thegrade = \"n\";\n    $themessage\
    \ = \"This is Excellent!\";\n} else-if ($thescore <= 95 and $thescore > 85 ) {\n\
    \    $thegrade = \"B\";\n    $themessage = \"This is Very Good!\";\n} else-if\
    \ ($thescore <= 85 and $thescore > 75 ) {\n    $thegrade = \"C\";\n    $themessage\
    \ = \"This is Okay. Not as much good as it should have\";\n} else-if ($thescore\
    \ <= 75 and $thescore > 65 ) {\n    $thegrade = \"D\";\n    $themessage = \"Not\
    \ good. In fact really bad!\";\n} else {\n    $thegrade = \"F\";\n    $themessage\
    \ = \"You are doomed!\";\n}\necho $themessage.\"\\n\";\necho \"Your grade is $thegrade\\\
    n\";\n?>\n</body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n\
    <title>这是 PHP</title>\n</head>\n<body>\nThis is Okay. Not as much good as it should\
    \ have grade is C\n</body>\n</html>\n```\n\n让我们查看最后一个选项。\n\n```html\n<html>\n\
    <head>\n<title>这是 PHP</title>\n</head>\n<body>\n<?php\n$thescore = 60;\nif ($thescore\
    \ > 95 ) {\n    $thegrade = \"n\";\n    $themessage = \"This is Excellent!\";\n\
    } else-if ($thescore <= 95 and $thescore > 85 ) {\n    $thegrade = \"B\";\n  \
    \  $themessage = \"This is Very Good!\";\n} else-if ($thescore <= 85 and $thescore\
    \ > 75 ) {\n    $thegrade = \"C\";\n    $themessage = \"This is Okay. Not as much\
    \ good as it should have\";\n} else-if ($thescore <= 75 and $thescore > 65 ) {\n\
    \    $thegrade = \"D\";\n    $themessage = \"Not good. In fact really bad!\";\n\
    } else {\n    $thegrade = \"F\";\n    $themessage = \"You are doomed!\";\n}\n\
    echo $themessage.\"\\n\";\necho \"Your grade is $thegrade\\n\";\n?>\n</body>\n\
    </html>\n```\n\n`$php main.php`\n\n```html\n<html>\n<head>\n<title>这是 PHP</title>\n\
    </head>\n<body>\nYou are doomed! Your grade is F\n</body>\n</html>\n```\n\n###\
    \ 嵌套 if\n\n你可以将一个 `if` 条件语句放在另一个 `if` 语句内部。这个过程被称为嵌套。假设你必须联系住在明尼苏达州的客户。你计划向他们的\
    \ ID 发送电子邮件，然后向那些没有地址的人发送信。你可以通过以下方法识别客户群。\n\n```php\nif ($thecustState == \"\
    ID\") {\n    if ($theEmailAdd = \"\") {\n        $thecontactMethod = \"letter\"\
    ;\n    } else {\n        $thecontactMethod = \"contact through email\";\n    }\n\
    } else {\n    $thecontactMethod = \"there is none needed\";\n}\n```\n\n### Switch\
    \ 语句\n\n`switch` 语句旨在测试 `$variablename` 的值。脚本移动到 `case` 部分并执行语句，直到遇到 `break` 语句或\
    \ `switch` 结束。你可以使用 `switch` 语句来执行特定的代码。\n\n```php\n<?php\n$thescore = 5;\nswitch\
    \ ($thescore) {\n    case \"green\":\n        echo \"This is green!\";\n     \
    \   break;\n    case \"yellow\":\n        echo \"This is yellow!\";\n        break;\n\
    \    case \"red\":\n        echo \"This is red!\";\n        break;\n    default:\n\
    \        echo \"This is something else!\";\n}\n?>\n```\n\n## 循环\n\n循环通常用于脚本中，当你需要设置一个重复执行的语句块时。PHP\
    \ 循环可以无限重复。你可以创建一个包含世界国家名称的循环。循环将输出名称，直到满足它会停止的条件。循环可以给你目录中的某些文件名，直到目录为空。\n\n\
    ### 循环类型\n\n第一类型是 `for` 循环。它设置一个计数器来重复填充的语句块，直到计数器达到特定的数字。第二类型是 `while` 循环。它设置一个条件，检查该条件是否为真并重复某些语句直到条件为假。第三类型是\
    \ `do…while` 循环，它也设置一个条件。在之后执行语句块直到条件为假。有一个 `init` 计数器初始化循环的计数器值。然后有一个 `test`\
    \ 计数器在循环的每次迭代中进行评估。如果评估为真，循环继续。否则，它结束。`increment` 计数器增加循环的计数器值。\n\n```php\n<?php\n\
    for ($y = 0; $y <= 20; $y++) {\n    echo \"The requisite number is $y\";\n}\n\
    ?>\n```\n\n### 嵌套循环\n\n你可以将一个 `for` 循环放在另一个 `for` 循环内部。我们可以使用两个 `for` 循环共同工作创建\
    \ 1 到 12 的乘法表。\n\n```php\n<?php\nfor($a=1;$a<=12;$a++) {\n    echo \"\\nMultiply\
    \ by $a \\n\";\n    for($b=1;$b<=12;$b++) {\n        $result = $a * $b;\n    \
    \    echo \"$a x $b = $result\\n\";\n    }\n}\n?>\n```\n\n"
