  trans: "\n\n# 第八章：使用 PHP 构建 Web 应用\n\n在之前的章节中，你已经学习了如何使用 PHP 进行编程。你已经学会了如何创建程序、设置条件判断、创建循环等等。所有这些知识都赋予了你构建在\
    \ Web 上运行良好的的 PHP 程序的能力。然而，你可以让它们变得更好、更易用。\n\n随着程序复杂性的增加，你会发现大量的 `require_once()`\
    \ 和 `includes` 函数。每当你想要创建一个新文件或在公共函数中实现某些功能时，你可以在程序中添加一个 `require_once`。如果你引导访问者访问类似于\
    \ `[`www.example.com/login.php`](http://www.example.com/login.php)` 的 URL，你可以使用\
    \ `auto_prepend_file` 在运行的 `login.php` 代码之前引入一个辅助文件。这个辅助文件有能力启动会话（session）、提供多个可以在程序内部使用的函数，或者加载多个文件。`auto_prepend_file`\
    \ 选项是 `php.ini` 文件的不可或缺的一部分，但在 Apache 配置中通过 `php_value` 指令设置它也是很常见的。\n\n## 预包含文件\
    \ (Prepend File)\n\n本节将解释，如果你打算使用会话，那么在所有将使用会话的页面上都必须调用 `session_start()` 函数。如果你希望在多个\
    \ PHP 程序中跟踪会话，这可能会非常困难。你可以使用自动预包含文件（auto-prepend-file）来调用 `session_start`。\n\n\
    创建两个文件：一个是主文件，另一个包含一个启动特定会话的预包含函数。在执行练习之前，你应该确保 `.htaccess` 文件运行正常，或者你可以修改 Apache\
    \ Web 服务器配置。如果你打算更改配置，请确保重启 Apache。\n\n在文档根目录的 `.htaccess` 文件中，你需要放置以下代码：\n\n\
    ```php\nphp_value auto_prepend_file \"prepend.php\"\n```\n\n你也可以以下脚本中添加相同的行：\n\
    \n```apache\n<Directory \"/my/documentroot/path\">\n    php_value auto_prepend_file\
    \ \"/my/documentroot/path/prependfile.php\"\n</Directory>\n```\n\n如果文档根目录是 `/var/www`，你应该将该行添加到\
    \ `<Directory \"/var/www\">` 之后。现在打开你的文本编辑器并创建一个新的空文件。在该文件内部，你需要放置以下代码：\n\n```html\n\
