    # 第七章：MySQL 基础


    许多网站都需要一个后端数据库，用于存储网页显示给用户的信息，或存储用户在网站上填写的信息。MySQL 是一种非常流行的数据库，可用于网站。它被开发为一种为网站提供的轻量且快速的系统。MySQL
    在使用 PHP 编写的网站中特别受欢迎。简而言之，MySQL 和 PHP 通常配合得很好。


    MySQL 包含一个 MySQL 服务器、一组辅助管理 MySQL 数据库的实用程序，以及 MySQL 服务器需要的一些辅助软件。MySQL 服务器被认为是数据库系统的管理器。它可以处理所有的数据库指令。MySQL
    被称为关系型数据库系统 (RDBMS)。MySQL 服务器倾向于同时管理多个数据库。许多人可能共同控制由一个 MySQL 服务器管理的不同数据库。


    每个数据库都有一个存储数据的结构。通常情况下，数据库在没有数据的情况下存在。你可以以表的形式将数据存储在数据库中。向数据库添加数据之前，必须先创建表。开始时创建一个空数据库，稍后再填充数据。表中的每一行都代表一个实体，例如书籍或项目。每一列承载关于实体的一个信息，例如书名或客户名。一个数据库包含一个或多个表，每个表都可以通过特定的名称来识别。就像普通表一样，MySQL
    表包含列和行。我将在这些脚本中使用一个数据库。


    ## MySQL 查询


    它大部分是英语。由英语短语和句子组成。你不需要看透并学习一种晦涩的技术语言来编写查询。语句的第一个单词是它的名称。它是一个动词，告诉 MySQL 你想让它做什么。本章将讨论这些语句。你无法在系统上安装或卸载
    MySQL，因为它运行在网络托管计算机上。你可以通过账户访问 MySQL 中的数据。


    ### SQL SELECT


    第一行是 `SQL select` 语句。我有一个目前存在于数据库中的演示数据库。你数据库中的表如下所示。


    | CustomerID | CustomerName | ContactNumber | SecretCode | Country |

    | --- | --- | --- | --- | --- |

    | 1 | Emily Jack | 55779034 | 45 | United States |

    | 2 | Jason Austin | 34568988 | 2 | United Kingdom |

    | 3 | Amanda McMahon | 34578899 | 1 | Ireland |

    | 4 | Victoria Ann | 23768800 | 67 | Germany |

    | 5 | Simon Wiz | 45327899 | 9 | United States |

    | 6 | Tracy Drupal | 23897609 | 8 | France |

    | 7 | Emilia Tim | 45890093 | 3 | Italy |

    | 8 | Tyson Jackson | 34980900 | 2 | Sweden |


    这就是我们拥有的内容，我们可以通过 SQL 语句访问它。如果你想显示整个表，可以使用以下语句。


    ```sql

    SELECT * FROM Members;

    ```


    在该语句中，`Members` 是上述表的名字。其余部分属于 `SQL`。如果使用得当，`Select` 语句非常有趣。你可以用它来显示表中不同的列。例如，假设你在一家拥有上述数据库的机构工作。你的老板要求你打印成员列表及其原籍国，而忽略数据库的其他部分。你可以使用以下语句在几秒钟内完成。


    ```sql

    SELECT CustomerName, Country FROM Members;

    ```


    | CustomerName | Country |

    | --- | --- |

    | Emily Jack | United States |

    | Jason Austin | United Kingdom |

    | Amanda McMahon | Ireland |

    | Victoria Ann | Germany |

    | Simon Wiz | United States |

    | Tracy Drupal | France |

    | Emilia Tim | Italy |

    | Tyson Jackson | Sweden |


    ### DISTINCT 语句


    `SELECT DISTINCT` 语句通常用于仅返回唯一值。有时，某一列包含重复值，而你只想列出唯一的值。在这种情况下，你可以选择 `SELECT DISTINCT`
    语句。当我们使用简单的 `SELECT` 语句显示表时，它会显示列中的所有值，而不区分重复条。`DISTINCT` 语句仅显示列中的唯一值。演示表如下。


    ```sql

    SELECT DISTINCT Country FROM Members;

    ```


    | Country |

    | --- |

    | United States |

    | United Kingdom |

    | Ireland |

    | Germany |

    | France |

    | Italy |

    | Sweden |


    United States 重复了，但这里只显示了一个条目。


    ### WHERE 子


    这个特定的语句从你提到的特定位置选择成员。在对数据库应用 `SQL` 语句之前，让我们复习数据库中的表。


    | CustomerID | CustomerName | ContactNumber | SecretCode | Country |

    | --- | --- | --- | --- | --- |

    | 1 | Emily Jack | 55779034 | 45 | United States |

    | 2 | Jason Austin | 34568988 | 2 | United Kingdom |

    | 3 | Amanda McMahon | 34578899 | 1 | Ireland |

    | 4 | Victoria Ann | 23768800 | 67 | Germany |

    | 5 | Simon Wiz | 45327899 | 9 | United States |

    | 6 | Tracy Drupal | 23897609 | 8 | France |

    | 7 | Emilia Tim | 45890093 | 3 | Italy |

    | 8 | Tyson Jackson | 34980900 | 2 | Sweden |

    | 9 | Tom Dick | 45980999 | 4 | United States |

    | 10 | Dane harry | 47889933 | 0 | United States |


    这是数据库中的表。


    ```sql

    SELECT * FROM Members WHERE Country=''United States'';

    ```


    | CustomerID | CustomerName | ContactNumber | SecretCode | Country |

    | --- | --- | --- | --- | --- |

    | 1 | Emily Jack | 55779034 | 45 | United States |

    | 5 | Simon Wiz | 45327899 | 9 | United States |

    | 9 | Tom Dick | 45980999 | 4 | United States |

    | 10 | Dane harry | 47889933 | 0 | United States |


    看另一个 `WHERE` 语句的示例。


    ```sql

    SELECT * FROM Members WHERE CustomerID=1; WHERE CustomerID=2; WHERE CustomerID=3;
    WHERE CustomerID=4; WHERE CustomerID=5; WHERE CustomerID=6; WHERE CustomerID=7;

    ```


    | CustomerID | CustomerName | ContactNumber | SecretCode | Country |

    | --- | --- | --- | --- | --- |

    | 1 | Emily Jack | 55779034 | 45 | United States |

    | 2 | Jason Austin | 34568988 | 2 | United Kingdom |

    | 3 | Amanda McMahon | 34578899 | 1 | Ireland |

    | 4 | Victoria Ann | 23768800 | 67 | Germany |

