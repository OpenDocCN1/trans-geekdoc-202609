- fmt: "\n# Chapter Six: PHP Forms and File Handling\n\nThe PHP superglobal variables\
    \ like `$_POST` and `$_GET` are generally used for the collection of form-data.\
    \ This chapter will walk you through the creation and handling of PHP forms.\n\
    \nI will start with a simple HTML form that has two input fields. It will also\
    \ have a submit button for the users to fill in the information and press the\
    \ submit button to complete the transaction. You can build a web application and\
    \ integrate the form in that to retrieve certain information from the users that\
    \ you need.\n\n```html\n<html>\n<body>\n<form action=\"Wewelcomeyou.php\" method=\"\
    post\">\n  Name: <input type=\"text\" name=\"Please enter your name\"><br>\n \
    \ E-mail: <input type=\"text\" name=\"Please enter your email\"><br>\n  <input\
    \ type=\"submit\">\n</form>\n</body>\n</html>\n```\n"
