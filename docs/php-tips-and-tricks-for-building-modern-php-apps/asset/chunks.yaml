    # 介绍


    本书包含了如何使用 `PHP` 编写 Web 应用程序的经过的步骤和策略。你将通过功能性代码的形式学习 `PHP` 的独特特征，这些代码你可以在 `PHP`
    编辑器中用于练习。我确保你将学习到创建如内容管理系统（CMS）等 Web 应用程序所需的所有基础和高级代码。


    `MySQL` 是 `PHP` 的不可或缺的一部分，我专门用了一个章节来介绍 `MySQL` 的不同语句，你可以使用这些语句来操作数据库。没有 `MySQL`，`PHP`
    就是空虚，因为每个 Web 应用程序都需要数据库来处理用户信息并将其存储以供以后使用。


    `PHP` 并不老；我们可以将它的起源追溯到 1994 年，当时 Rasmus Lerdorf 编写了第一个版本。在最初的阶段，它是基于 `C` 语言构建的，目的是替换他在个人主页上使用的
    `Perl` 代码段。它一直在演变；然而，直到 1995 年，他才发布了该语言的第一个正式公开版本。此时，`PHP` 被称为个人主页工具（Personal
    Homepage Tools）。


    `JavaScript` 必然于 1996 年作为客户端语言发布。`PHP` 在当时作为服务器端语言发布，充分说明了当时互联网工具的巨大增长。1998 年，`PHP`
    接收了由 Andi Gutmans 和 Zeev Suraski 发布的第三版本。新版本有了一个独特的名称 `Hypertext Preprocessor`（超文本预处理器）。这个版本让
    `PHP` 赢得了巨大的人气。`PHP` 第 4 版本于 2000 年推出，被称为 `Zend Engine`。这个版本将 `PHP` 提升到了以前所未过的水平。它消除了
    `PHP` 的某些缺陷并使其成为更完整的语言。`PHP` 第 5 版本于 2004 年发布，具有新功能，如改进的面向对象编程和更好的性能。`PHP 7` 于
    2014 年和 2015 年发布。它进一步更新了 `PHP`，以适应更高水平的 Web 开发。


    当世界知道 Mark Zuckerberg 使用它创建了世界著名的应用程序 Facebook 时，`PHP` 声名大噪。当 Mark 在 2003 年从哈佛退学时，他采用了这种语言来创建该应用，而
    Facebook 应用的后端仍在使用这种语言。Facebook 自此以后开发了名为 `Hack` 的自己的语言，但它是 `PHP` 的一个版本。


    本书包含了实用的步骤，帮助你理解 Web 应用程序服务器端发生了什么。它将帮助你了解 `PHP` 和 `MySQL` 的细节，这两者在创建 Web 应用程序时通常是并行的。为了方便读者阅读，我将这一章分为
    11 章。书的每一章都处理一个独特的话。我建议你在阅读本书时下载并安装一个 `PHP` 编辑器或打开一个在线 `PHP` 编辑器进行练习。你可以使用书中的示例代码，并理解它们在放入编辑器后是如何运行的。我希望你的这段阅读之旅是奇妙的，你将成为一个知识渊博的人。


    ## 第 1 章：PHP 的安装


    书的第一章重点介绍在你的计算机上安装 `PHP`。这是一个复杂的过程。你应该多读几来理解如何操作。这个过程在 `Linux` 和 `Mac OS` 上的难度不会像在
    Windows 操作系统那么大。我按照步骤解释了该主题。第一章是在你的操作系统上安装 Web 服务器，市场上有很多 Web 服务器可用。你可以随心选择。在书中，我选择解释史上最流行的
    Web 服务器，即 `Apache`。`Apache` 是一个出色的 Web 服务器，它与 `PHP` 配对并增强其性能。当你下载它后，你需要验证 `Apache`。下一步是安装过程。你会发现它的解释清晰且全面。安装过程完成后，你可以打开
    `Apache` 并启动操作。关于 Web 服务器的最后一步是 `Apache` 的配置。


    ## 第 2 章：PHP 基础


    本章的后半部分专注于在你的计算机上安装 PHP。作为一种服务器端语言，它的安装有点复杂，而且是个硬骨头。然而，通过遵循正确的步骤，你可以顺风完成。这将一帆顺利。当你获得
    `PHP` 后，你必须验证它。接下来是你的服务器的配置。书的第二章专注于 `PHP` 的基础。我将解释你应该如何创建 HTML 页面，因为它是 `PHP`
    的重要组成部分。你需要将 PHP 代码嵌入到你创建的 HTML 文档中，当你尝试显示它时，它将会在页面可见。所有的代码将保持隐藏；但 HTML 代码将显示。


    ## 第 3 章：变量与字符串


    下一章包含了关于 PHP 变量、PHP 字符串等的宝贵信息。你将学习如何使用 PHP 变量来存储信息并在以后使用。书的第三章专注于创建你构建应用程序时需要的
