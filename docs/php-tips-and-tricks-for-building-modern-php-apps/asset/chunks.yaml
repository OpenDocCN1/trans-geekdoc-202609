    no\"; \n$k = 0; \nwhile ( $testvariable != \"yes\" ) { \n    if ($vegetables[$k]\
    \ == \"tomato\" ) { \n        $testvariable = \"yes\"; \n        echo \"Now we\
    \ have a tomato.\\\\n\"; \n    } else { \n        echo \"$vegetables[$k] is not\
    \ a tomato\\\\n\"; \n    } \n    $k++; \n} \n?> </body>\n</html>\n```\n\n`$php\
    \ main.php`\n\n```html\n<html> <head> <title>This is PHP</title> </head> <body>\
    \ pumpkin is not a tomato carrot is not a tomato radish is not a tomato beet is\
    \ not a tomato Now we have a tomato. </body> </html>\n```\n\n在接下来的示例中，我将改变蔬菜并观察循环是如何工作的。\n\
    \n```html\n<html> <head> <title>This is PHP</title> </head> <body> <?php \n$vegetables\
    \ = array ( \"pumpkin\", \"carrot\", \"radish\", \"beet\", \"tomato\", \"potato\"\
    ); \n$testvariable = \"no\"; \n$k = 0; \nwhile ( $testvariable != \"yes\" ) {\
    \ \n    if ($vegetables[$k] == \"potato\" ) { \n        $testvariable = \"yes\"\
    ; \n        echo \"Now we have a potato.\\\\n\"; \n    } else { \n        echo\
    \ \"$vegetables[$k] is not a potato\\\\n\"; \n    } \n    $k++; \n} \n?> </body>\n\
    </html>\n```\n\n`$php main.php`\n\n```html\n<html> <head> <title>This is PHP</title>\
    \ </head> <body> pumpkin is not a potato carrot is not a potato radish is not\
    \ a potato beet is not a potato tomato is not a potato Now we have a potato. </body>\
    \ </html>\n```\n\n### Do...while 循环\n\ndo…while 循环倾向于在开始时循环一次特定的代码块，只要条件为真，它就会持续重复。它会执行一次代码，检查条件，然后只要条件为真就会重复循环。许多程序员将\
    \ `do...while` 循环和 `while` 循环放在同一个地方，然而，`do...while` 循环在循环底部测试一组条件。如果条件为真，循环就开始重复执行。如果条件为假，`do...while`\
    \ 循环就会停止工作。\n\n```html\n<html> <head> <title>This is PHP</title> </head> <body>\
    \ <?php \n$vegetables = array ( \"pumpkin\", \"carrot\", \"radish\", \"beet\"\
    , \"tomato\", \"potato\"); \n$testvariable = \"no\"; \n$k = 0; \ndo { \n    if\
    \ ($vegetables[$k] == \"beet\" ) { \n        $testvariable = \"yes\"; \n     \
    \   echo \"Now we have a beet.\\\\n\"; \n    } else { \n        echo \"$vegetables[$k]\
    \ is not a potato\\\\n\"; \n    } \n    $k++; \n} while ($testvariable != \"yes\"\
    ); \n?> </body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html> <head> <title>This\
    \ is PHP</title> </head> <body> pumpkin is not a potato carrot is not a potato\
    \ radish is not a potato Now we have a beet. </body> </html>\n```\n\n在下段代码中，我将\
    \ beet 改为 potato。让我们看看代码的结果。\n\n```html\n<html> <head> <title>This is PHP</title>\
    \ </head> <body> <?php \n$vegetables = array ( \"pumpkin\", \"carrot\", \"radish\"\
    , \"beet\", \"tomato\", \"potato\"); \n$testvariable = \"no\"; \n$k = 0; \ndo\
    \ { \n    if ($vegetables[$k] == \"potato\" ) { \n        $testvariable = \"yes\"\
    ; \n        echo \"Now we have a potato.\\\\n\"; \n    } else { \n        echo\
    \ \"$vegetables[$k] is not a potato\\\\n\"; \n    } \n    $k++; \n} while ($testvariable\
    \ != \"yes\"); \n?> </body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html>\
    \ <head> <title>This is PHP</title> </head> <body> pumpkin is not a potato carrot\
    \ is not a potato radish is not a potato tomato is not a potato we have a potato.\
    \ </body> </html>\n```\n\n如果你仔细观察上面的代码，你会发现 `while` 循环和 `do...while` 循环的输出是相同的。它们的区别在于，在\
    \ `while` 循环中条件在代码顶部检查，而在 `do...while` 循环中通常在代码底部检查。如果我们从一开始就将 `testvariable`\
    \ 的值设置为 ‘yes’，那么代码块永远不会运行。\n\n```html\n<html> <head> <title>This is PHP</title>\
    \ </head> <body> <?php \n$vegetables = array ( \"pumpkin\", \"carrot\", \"radish\"\
    , \"beet\", \"tomato\", \"potato\"); \n$testvariable = \"yes\"; \n$k = 0; \ndo\
    \ { \n    if ($vegetables[$k] == \"potato\" ) { \n        $testvariable = \"yes\"\
    ; \n        echo \"Now we have a potato.\\\\n\"; \n    } else { \n        echo\
    \ \"$vegetables[$k] is not a potato\\\\n\"; \n    } \n    $k++; \n} while ($testvariable\
    \ != \"yes\"); \n?> </body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html>\
    \ <head> <title>This is PHP</title> </head> <body> pumpkin is not a potato </body>\
    \ </html>\n```\n\n### 无限循环\n\n你可以设置无限循环。它们会永远运行。无限循环是无意创建的。无限循环会持续下去。无限循环被用于……无限循环的名称是……在代码顶部的循环。\n\
    \n```html\n<html> <head> <title>This is PHP</title> </head> <body> <?php \n$vegetables\
    \ = array ( \"pumpkin\", \"carrot\", \"radish\", \"beet\", \"tomato\", \"potato\"\
    ); \n$testvariable = \"no\"; \n$k = 0; \nwhile ( $testvariable != \"yes\" ) {\
    \ \n    if ($vegetables[$k] == \"tomato\" ) { \n        $testvariable = \"yes\"\
    ; \n        echo \"Now we have a tomato.\\\\n\"; \n    } else { \n        echo\
    \ \"$vegetables[$k] is not a tomato\\\\n\"; \n    } \n    $k++; \n} \n?> </body>\n\
    </html>\n```\n\n### Break 语句\n\nBreak 语句可以帮助你跳出循环。Break 语句更多用于 switch 语句。Break\
    \ 语句在某一点停止了。\n\n```html\n<html> <head> <title>This is PHP</title> </head> <body>\
    \ <?php \n$thecounter = 0; \nwhile ( $thecounter < 15 ) { \n    $thecounter++;\
    \ \n    if ($thecounter == 13 ) { \n        echo \"break\\\\n\"; \n        break;\
    \ \n    } \n    echo \"This is the last line in the loop:$thecounter\\\\n\"; \n\
    } \n?> </body>\n</html>\n```\n\n`$php main.php`\n\n```html\n<html> <head> <title>This\
    \ is PHP</title> </head> <body> This is the last line in the loop: counter=1 This\
    \ is the last line in the loop: counter=2 This is the last line in the loop: counter=3\
    \ This is the last line in the loop: counter=4 This is the last line in the loop:\
    \ counter=5 This is the last line in the loop: counter=6 This is the last line\
    \ in the loop: counter=7 This is the last line in the loop: counter=8 This is\
    \ the last line in the loop: counter=9 This is the last line in the loop: counter=10\
    \ This is the last line in the loop: counter=11 This is the last line in the loop:\
    \ counter=12 This is the last line in the loop: counter=13 break This is the last\
    \ line in the loop: counter=14 </body>\n</</html>\n```\n\n### Continue 语句\n\n\
    Continue 语句可以跳过。Continue 语句将继续循环。\n\n```html\n<html> <head> <title>This is PHP</title>\
    \ </head> <body> <?php \n$thecounter = 0; \nwhile ( $thecounter < 12 ) { \n  \
    \  $thecounter++; \n    if ($thecounter == 10 ) { \n        echo \"this will continue\
    \ the loop\\\\n\"; \n        continue; \n    } \n    echo \"This is the last line\
    \ in the loop:counter=$thecounter\\\\n\"; \n} \n?> </body>\n</html>\n```\n\n`$php\
    \ main.php`\n\n```html\n<html> <head> <title>This is PHP</title> </head> <body>\
    \ This is the last line in the loop: counter=1 This is the last line in the loop:\
    \ counter=2 This is the last line in the loop: counter=3 This is the last line\
    \ in the loop: counter=4 This is the last line in the loop: counter=5 This is\
    \ the last line in the loop: counter=6 This is the last line in the loop: counter=7\
    \ This is the last line in the loop: counter=8 This is the last line in the loop:\
    \ counter=9 this will continue the loop This is the last line in the loop: counter=11\
    \ This is the last line in the loop: counter=12 break </body>\n</</html>\n```\n\
    \n如果你担心无限循环，可以在代码中插入 `break` 语句。\n\n"
- fmt: "\n# Chapter Four: Advanced PHP\n\nMore often, applications have to perform\
    \ several tasks at multiple points in the script. PHP functions let you reuse\
    \ the same code in several locations as per your need. A function generally is\
    \ a group of statements in PHP that are designed as such to perform a particular\
    \ task.\n\n## PHP Functions\n\nIn the following example, I will create a PHP function\
    \ example. Curly braces in a function mark the start and the end of the function.\
    \ When you need to call the function, you can simply write its name.\n\n```html\n\
    <html>\n<head>\n    <title>This is PHP function</title>\n</head>\n<body>\n<?php\n\
    function greetings() { \n    echo \"Good morning! Hope you are fine!\"; \n}\n\
    greetings(); // This is how you can call the function\n?>\n</body>\n</html>\n\
    ```\n\n```bash\n$php main.php\n```\n\n```html\n<html>\n<head>\n    <title>This\
    \ is PHP function</title>\n</head>\n<body>\n    Good morning! Hope you are fine!\n\
    </body>\n</html>\n```\n\nTake a look at another example.\n\n```html\n<html>\n\
    <head>\n    <title>This is PHP function</title>\n</head>\n<body>\n<?php\nfunction\
    \ format_your_name() { \n    global $formatted_name; \n    $your_first_name =\
    \ \"Chris\"; \n    $your_last_name = \"Angel\"; \n    $formatted_name = $your_last_name.\
    \ \",\" .$your_first_name; \n}\nformat_your_name();\necho \"$formatted_name\"\
    ;\n?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n```\n\n```html\n<html>\n\
    <head>\n    <title>This is PHP function</title>\n</head>\n<body>\n    Angel,Chris\n\
    </body>\n</html>\n```\n\nIf you have to create the variables outside of the function,\
    \ you can’t do that unless you insert a global variable in the code. See the example\
    \ in which the variables are placed outside of the script.\n\n## Arguments\n\n\
    You can pass on information to functions with the help of arguments. An argument\
    \ acts just like a variable. They are specified after the name of the function\
    \ inside of the parenthesis. You can add as many variables to a function as you\
    \ want to.\n\n```html\n<html>\n<head>\n    <title>This is PHP function</title>\n\
    </head>\n<body>\n<?php\nfunction greetings($name) { \n    echo \"$name, welcome\
    \ to the bachelor's club.<br>\"; \n}\ngreetings(\"John\");\ngreetings(\"Sylvia\"\
    );\ngreetings(\"Sim\");\ngreetings(\"Kai Jim\");\ngreetings(\"Ben\");\n?>\n</body>\n\
    </html>\n```\n\n```bash\n$php main.php\n```\n\n```html\n<html>\n<head>\n    <title>This\
    \ is PHP function</title>\n</head>\n<body>\n    John, welcome to the bachelor's\
    \ club.<br>\n    Sylvia, welcome to the bachelor's club.<br>\n    Sim, welcome\
    \ to the bachelor's club.<br>\n    Kai Jim, welcome to the bachelor's club.<br>\n\
    \    Ben, welcome to the bachelor's club.<br>\n</body>\n</html>\n```\n\nYou also\
    \ can scale up the script by adding more arguments. In the next example, I will\
    \ add two arguments in the script.\n\n```html\n<html>\n<head>\n    <title>This\
    \ is PHP function</title>\n</head>\n<body>\n<?php\nfunction greetings($name, $year)\
    \ { \n    echo \"$name, welcome to the adult's club. I suppose you are born in\
    \ $year <br>\"; \n}\ngreetings(\"John\" , \"1999\");\ngreetings(\"Sylvia\" , \"\
    1988\");\ngreetings(\"Sim\" , \"1995\");\ngreetings(\"Kai Jim\" , \"2001\");\n\
    greetings(\"Ben\" , \"2002\");\n?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n\
    ```\n\n```html\n<html>\n<head>\n    <title>This is PHP function</title>\n</head>\n\
    <body>\n    John, welcome to the adult's club. I suppose you are born in 1999\
    \ <br>\n    Sylvia, welcome to the adult's club. I suppose you are born in 1988\
    \ <br>\n    Sim, welcome to the adult's club. I suppose you are born in 1995 <br>\n\
    \    Kai Jim, welcome to the adult's club. I suppose you are born in 2001 <br>\n\
    \    Ben, welcome to the adult's club. I suppose you are born in 2002 <br>\n</body>\n\
    </html>\n```\n\n## Default Values\n\nYou can use default values for arguments\
    \ so if you leave the argument section empty, you will still be able to call the\
    \ function.\n\n```html\n<html>\n<head>\n    <title>This is PHP function</title>\n\
    </head>\n<body>\n<?php\nfunction greetings($name = \"Tom\", $year = 1996) { \n\
    \    echo \"$name, welcome to the adult's club. I suppose you are born in $year\
    \ <br>\"; \n}\ngreetings(\"John\" , \"1999\");\ngreetings(\"Sylvia\" , \"1988\"\
    );\ngreetings();\ngreetings(\"Kai Jim\" , \"2001\");\ngreetings();\n?>\n</body>\n\
    </html>\n```\n\n```bash\n$php main.php\n```\n\n```html\n<html>\n<head>\n    <title>This\
    \ is PHP function</title>\n</head>\n<body>\n    John, welcome to the adult's club.\
    \ I suppose you are born in 1999 <br>\n    Sylvia, welcome to the adult's club.\
    \ I suppose you are born in 1988 <br>\n    Tom, welcome to the adult's club. I\
    \ suppose you are born in 1996 <br>\n    Kai Jim, welcome to the adult's club.\
    \ I suppose you are born in 2001 <br>\n    Tom, welcome to the adult's club. I\
    \ suppose you are born in 1996 <br>\n</body>\n</html>\n```\n\n## Return Values\n\
    \nIf you want a function to return values, you have to insert in the code the\
    \ `return` statement.\n\n```html\n<html>\n<head>\n    <title>This is PHP function</title>\n\
    </head>\n<body>\n<?php\nfunction sumup(int $a, int $b) { \n    $c = $a + $b; \n\
    \    return $c; \n}\necho \"45 + 10 = \" . sumup(45, 10) . \"<br>\";\necho \"\
    57 + 13 = \" . sumup(57, 13) . \"<br>\";\necho \"29 + 41 = \" . sumup(29, 41);\n\
    ?>\n</body>\n</html>\n```\n\n```bash\n$php main.php\n```\n\n```html\n<html>\n\
    <head>\n    <title>This is PHP function</title>\n</head>\n<body>\n    45 + 10\
    \ = 55<br>\n    57 + 13 = 70<br>\n    29 + 41 = 70\n</body>\n</html>\n```\n\n\
    ## Insert Right Arguments\n\nFunctions are sensitive in regard to the number of\
    \ values you have to pass on it. If you don’t send enough of them, the function\
    \ will detect the missing values. You will see a warning message when you execute\
    \ the code.\n\n```html\n<html>\n<head>\n    <title>This is PHP function</title>\n\
    </head>\n<body>\n<?php\nfunction greetings($name , $year) { \n    echo \"$name,\
    \ welcome to the adult's club. I suppose you are born in $year <br>\"; \n}\ngreetings(\"\
    John\" , 1999);\ngreetings( \"Sim\", 1988);\ngreetings(\"Drake\" , 2000);\ngreetings(\"\
    Kai Jim\" , 2001);\ngreetings( 2002);\n?>\n</body>\n</html>\n```\n\n```bash\n\
    $php main.php\n```\n\n```html\n<html>\n<head>\n    <title>This is PHP function</title>\n\
    </head>\n<body>\n    John, welcome to the adult's club. I suppose you are born\
    \ in 1999 <br>\n    Sim, welcome to the adult's club. I suppose you are born in\
    \ 1988 <br>\n    Drake, welcome to the adult's club. I suppose you are born in\
    \ 2000 <br>\n    Kai Jim, welcome to the adult's club. I suppose you are born\
    \ in 2001 <br>\n     PHP Fatal error: Uncaught ArgumentCountError: Too few arguments\
    \ to function greetings(), 1 passed in /home/cg/root/1842013/main.php on line\
    \ 15 and exactly 2 expected in /home/cg/root/1842013/main.php:7 Stack trace: #0\
    \ /home/cg/root/1842013/main.php(15): greetings(2002) #1 {main} thrown in /home/cg/root/1842013/main.php\
    \ on line 7\n</body>\n</html>\n```\n\nYou can see the error that the missing argument\
    \ has triggered.\n"
