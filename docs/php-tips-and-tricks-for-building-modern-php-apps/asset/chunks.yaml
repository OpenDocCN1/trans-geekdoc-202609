    is the installation of the webserver on your operating system, and there are many
    web servers available in the market. You can choose at will. In the case of this
    book, I chose to explain the most popular web server of all time that is known
    as Apache. Apache is a brilliant web server that pairs up with PHP and enhances
    its performance. When you have downloaded it, you will have to verify Apache.
    The next step is the installation process. You will find it explained most lucidly
    and comprehensively. After the installation process completes, you can open Apache
    and initiate the operations. The final step regarding the webserver is the configuration
    of Apache. The second half of this chapter focuses on the installation of PHP
    on your computer system. As it is a server-side language, its installation is
    a bit tricky and somewhat a tough nut to crack. However, by following the right
    steps, you can go through it like a breeze. It will be smooth sailing. When you
    have obtained PHP, you have to verify it. Next comes the task of the configuration
    of your web server regarding PHP. The chapter ends on explaining the configuration
    process. The second chapter of the book focuses on the basics of PHP. I will explain
    how you should create an HTML page as it is an essential part of PHP. You will
    be required to embed your PHP code in the HTML document you create. The HTML document
    will help PHP run the web application. The PHP code will not be visible on the
    web page when you try to display it. All the code will remain hidden; however,
    the HTML code will be shown. I will analyze the PHP script for you so that you
    understand it when you read it in the next sections and write it for practice.
    This chapter contains valuable information about PHP variables, PHP strings, etc.
    You will learn how you can use PHP variables for storing information and using
    it later on. The third chapter of the book focuses on creating PHP scripts that
    you would need when you build a web application. The first script, and also one
    of the most popular in many programming languages, is the conditional statement.
    A conditional statement can be identified by the keyword ‘if.’ The if statement
    comes into play when you have to set more than one condition in the code so that
    the web application reads through them and acts on them. If the first condition
    is true, the code doesn’t move further and just ends there. If the first condition
    turns out to be false, the code jumps on to the next condition and runs it. When
    there are ‘else-if’ statements, and the first two conditions turn out to be false,
    the third condition comes into play. The chapter then moves on to the ‘nested
    if’ statements that contain two or more if statements nested inside of one if
    statement. Next comes PHP loops. They are the most interesting features of PHP.
    You can insert a loop inside of the code and make tasks easy and somewhat automated.
    There are three types of loops in PHP. The first that will come under discussion
    is the for loop. I will explain it with an example. Then I will move on to the
    nested for loops. After that, I will explain what a while loop is and how it works.
    You will see a sufficient amount of examples in these sections, which will create
    your concepts about these features of PHP. Sometimes, programmers accidentally
    create infinite loops that make a program run on end. I will explain what an infinite
    loop is and how it can be created accidentally. The next on the line is the Break
    statement. This statement is very important to break the infinite loop. If you
    include it in the code, it will make sure that there are no infinite loops in
    the code. Coupled with the break statement is the continue statement. The fourth
    chapter of the book focuses on the advanced features of PHP language. I will start
    with PHP functions, which are the most amazing features in the world of PHP. A
    PHP function makes the server-side coding smart, brief, and fast. All you need
    is to create a function, and then you can make a function call later on, and all
    the code that the function contains will start running and doing its job. You
    save yourself the hassle of writing the same code over and over again. Everything
    just fits in the right spot when you choose functions to do the job for you. Functions
    should be understood in the right manner. There are arguments that you have to
    pass on to the functions. You can create a function that you can use for the rest
    of the programming session. I will explain with an example of what PHP arguments
    are and how you can pass on these arguments to PHP functions. You can add as many
    arguments to PHP functions as you can. Besides the arguments, you can fill in
    the functions with a bunch of default values. These default values will come into
    play if you leave PHP functions empty of arguments. You can fill your function
    with default values if you are going to use some particular values multiple times
    throughout a function. In the next section of this chapter, I will shed light
    on what return values are and what is their significance in the world of coding.
    The fifth chapter of the book focuses on the object-oriented programming features
    of PHP that make the core of a PHP web application. The first on the line in the
    world of PHP object-oriented programming (OOP) comes classes. PHP classes help
    you model real-life objects in PHP. You can create a class and then add instances
    to it to make it work as a real-life object. I will fill in the chapter with the
    example of a vegetable class. I will define the parameters of the class. Then
    I will add instances to the same class. The instances for the vegetable class
    will be vegetables like potato, tomato, and beet. I will give them color, weight,
    and shape. This kind of program can be effectively used in the creation of an
    online grocery app. You can fill in the database with the right information and
    use it at will. If you are creating a car class for a showroom, you can create
    instances that would fill in a particular object with the name of the model, the
    year of manufacturing, the color of the car, and its value. Object oriented programming
    is the soul of PHP web application development. Next in line is the PHP constructor
    function. The next section is about the destructor function. In the next section,
    I will explain what PHP Access Modifiers and how you can use them in creating
    web applications. The section that contains the topic of inheritance is very important.
    Inheritance means that you are filling in the PHP classes with child classes.
    The main class will become the parent class while the other class with the child
    class. The child class tends to inherit the attributes of the parent class. It
    will enjoy a distinct status in the code as it will inherit the instances of the
    parent class and will also keep up its own. This is how you can create child class
    or small objects inside of the parent class and make the program more complicated
    and amazing. If you don’t want your child class to inherit any of the instances
    of features of the parent class, you can use the override feature of PHP that
    will allow you to create a condition in which the child class will not inherit
    anything from the parent class. The chapter ends on an explanation of the topic
    of abstract classes. The sixth chapter of the book focuses on PHP form making
    and file handling. This chapter is a short one, and it concludes with a brief
    explanation of exception handling. The seventh chapter of the book deals with
    MySQL basics. MySQL and PHP go side by side when you are building a web application.
    Take the example of Facebook. It is built with PHP on the server-side. Have you
    ever wondered where the data goes, which you feed on the platform? You upload
    different types of data such as pictures, videos, text, and numbers, and you can
    access your data from the past ten years. Facebook holds data of billions of users
    presently. That’s huge. PHP works with MySQL to offer developers a platform to
    store data in a database. That database is dubbed as MySQL. You can integrate
    MySQL coding to PHP to channelize your data toward storage. In this chapter, I
    will give you a glimpse of how you can navigate through the database once you
    have built a web application. In the first section, I will give you the know-how
    of SQL queries. I will move on to explaining the SQL SELECT statement as to how
    you can maneuver the data from the database. I will then proceed toward the explanation
    of the DISTINCT statement. Then comes the WHERE clause, which you can use to point
    out the position where you want to implement the code. I will then move on to
    the explanation of the AND statement, OR statement, and NOT statement. You can
    update the database and also delete it at will. Generally, a database in MySQL
    stores the information in the form of tables. The eighth chapter of the book focuses
    on building web applications with the help of PHP. I will first explain the Prepend
    file. Then I will add classes to the code. I will also explain the importance
    of reusing the code and functions. The first step toward the creation of a web
    application is to create a PHP file and an HTML file and combining the two. You
    will learn how to combine the two, as most of the code samples in this book will
    contain both PHP and HTML codes in a combination. The next section of the chapter
    focuses on user input because almost all web apps allow users to fill in their
    information on the website. While you are building a PHP content management system,
    you will have to create a class and add functions and methods to it. The ninth
    chapter of the book focuses on the relevance of PHP in the present day. I will
    explore the topics of certain built-in features. PHP is gaining ground due to
    its flexibility and its capacity to pair up with popular databases, and the next
    section focuses on the benefits of PHP as a developing language. I will explain
    what a simple API is, what is optimal, what app stability means, and what is maintenance.
    The tenth chapter of the book is about the tips on developing app development.
    You will learn about the most popular PHP app developing platform known as Laravel.
    You will also get to know about different PHP tips that you can use to make your
    codes operational and viable. This book is for everyone who is looking forward
    to being an expert in the world of website development. You don’t have to be a
    master in the world of coding. However, basic knowledge can be a big plus. Even
    if you don’t have that basic knowledge, the book contains some simple examples
    which you can understand without any hassle. I recommend that you keep a notebook
    by your side to note down important tricks that you can use later on while developing
    your web app. You are allowed to use the codes to practice and hone your skills.
    I have designed the codes in a way that they have two parts. The first part is
    what I wrote in the PHP editor, while the second part is what was displayed on
    the web browser. If you can’t see the PHP code in the result, it is because PHP
    is a server-side language, and the code is always hidden from the eyes of the
    users. '
