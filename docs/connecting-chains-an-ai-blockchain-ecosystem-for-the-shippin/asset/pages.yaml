  md: 'Ronnie Ninan is enrolled in the Young India Fellowship from Ashoka University,
    Sonipat, India. His areas of interests are science and technology policy, defence
    policy, and supply chain management. He holds a Master''s degree in International
    Studies from the Symbiosis School of International Studies, which is an institute
    under the Symbiosis International University, Pune, India. He has graduated with
    a Bachelors in Physics from St. Xavier''s College (Autonomous), Mumbai, India.


    Aniket Bhavthankar joined SSIS in August 2016. His areas of interest include Indian
    strategic thought, maritime domain, South Asia, the geopolitics of the Arctic
    region. Before joining SSIS he was a Senior Research Associate at the Society
    for Policy Studies (SPS), New Delhi. He has done his Masters in the International
    Relations from the South Asian University, New Delhi.


    In a world where various technological advancements have influenced the way humans
    interact on a global scale, a few disruptive technologies have cleared the path
    for a new chapter in global affairs. Among these technologies is the blockchain
    technology which is a distributed ledger technology (DLT) and artificial intelligence.
    Global logistics, which remains to be the backbone of the entire global supply
    chain, describes the importance of ensuring the optimization of the shipping industry
    challenges. However, the shipping industry is going through some challenges that
    force the industry to reconsider their business model. The shipping industry has
    a lack of visibility due to the opaqueness created by the complex structure of
    the industry, with numerous agents and intermediaries, filing heaps of paperwork
    , which continues to plague the smooth and efficient functioning of the shipping
    industry. Through this book, we are focusing on these aspects of the evolved technologies
    and their applications in the global shipping industry. Emerging and disruptive
    technologies such as blockchain and AI , has been implemented in parts, within
    the shipping industry, however, due to certain challenges, a fully-functional
    implementation has not taken place. This book would be exploring how the integration
    of blockchain technology and artificial intelligence would impact the shipping
    sector and examines the benefits of an integrated ecosystem for the industry.


    # Connecting Chains


    # An AI-Blockchain Ecosystem for the Shipping Industry


    Ronnie Ninan Aniket Bhavthankar


    www.elivapress.com


    ELIVA PRESS'
