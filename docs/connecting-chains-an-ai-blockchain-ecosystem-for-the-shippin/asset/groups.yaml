    ## About the Authors


    Ronnie Ninan is enrolled in the Young India Fellowship from Ashoka University,
    Sonipat, India. His areas of interests are science and technology policy, defence
    policy, and supply chain management. He has been an active contributor to various
    online platforms. He has worked as a research intern in the Centre on Strategic
    Technologies at Manohar Parrikar Institute for Defence Studies and Analyses (MP-IDSA),
    New Delhi. Prior to this he worked as a management intern at the French container
    transportation and shipping company, CMA-CGM, at their Mumbai head office. He
    holds a Master''s degree in International Studies from the Symbiosis School of
    International Studies, which is an institute under the Symbiosis International
    University, Pune, India. He has graduated with a Bachelors in Physics from St.
    Xavier''s College (Autonomous), Mumbai, India.


    Aniket Bhavthankar joined SSIS in August 2016. His areas of interest include Indian
    strategic thought, maritime domain, South Asia, the geopolitics of the Arctic
    region. He has written articles on diverse subjects ranging from the strategic
    interests of India in South Asia to the emerging flux in maritime affairs in the
    Indian Ocean and the Arctic. He is an active contributor to on-line platforms,
    South Asia Monitor and The Indian Diaspora, on issues related to the Indian diaspora,
    maritime affairs and issues pertaining to the Indian foreign policy in South Asia
    and Africa. Before joining SSIS he was a Senior Research Associate at the Society
    for Policy Studies (SPS), New Delhi from June 2013 to July 2016. At the SPS, he
    has demonstrated his ability to organize conferences and roundtables in concert
    with diplomatic missions and other stakeholders. Prior to joining the SPS, he
    was a Research Analyst with Socio-Political Analysis and Research Kendra (SPARK),
    Mumbai. At SPARK, he provided research inputs to members of the Maharashtra legislature
    for the preparation of private member bills. He has done his Masters in the International
    Relations from the South Asian University, New Delhi, established by South Asian
    Association for Regional Cooperation. In 2004, he graduated with a Bachelors of
    Computer Applications from Tilak Maharashtra Vidyapeeth.


