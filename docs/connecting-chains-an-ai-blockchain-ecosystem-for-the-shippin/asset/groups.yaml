    ## 关于作者


    罗尼·宁南正在就读于位于印度松尼帕特的阿育王大学的印度青年奖学金项目。他的兴趣领域包括科学与技术政策、国防政策和供应链管理。他曾活跃于各种在线平台。他曾在新德里曼诺哈尔·帕里卡尔国防研究与分析研究所（MP-IDSA）的战略技术中心担任研究实习生。在此之前，他在法国集装箱运输和航运公司
    CMA-CGM 的孟买总部担任管理实习生。他持有普纳共生国际大学下属的共生国际研究学院的国际研究硕士学位。他毕业于印度孟买圣泽维尔学院（自治）的物理学士学位。


    安尼凯·巴瓦桑卡尔于 2016 年 8 月加入 SSIS。他的兴趣领域包括印度战略思想、海事领域、南亚以及北极地区的地缘政治。他撰写过关于从印度在南亚的战略利益到印度洋和北极地区海事事务新趋势等多样主题的文章。他活跃于在线平台“南亚监测”和“印度散居者”，就与印度散居者、海事事务以及印度在南亚和非洲的外交政策相关问题进行投稿。在加入
    SSIS 之前，他于 2013 年 6 月至 2016 年 7 月期间担任新德里政策研究学会（SPS）的高级研究助理。在 SPS，他展示了与外交使团和其他利益相关方合作组织会议和圆桌会议的能力。在加入
    SPS 之前，他是孟买社会政治分析与研究中心（SPARK）的研究分析师。在 SPARK，他为马哈拉施特拉邦立法议会成员提供研究投入，以编制私人议员法案。他获得由南亚区域联盟成立的新德里南亚大学的国际关系硕士学位。2004
    年，他获得泰拉克马哈拉施特拉教育院的计算机应用学士学位。


