    ## Foreword


    Expressly owing to the COVID-19 crisis, various states in the world have understood
    the importance of living together for their survival and future progress. At the
    same time, the crisis, as worst as the COVID-19 pandemic, that can destroy the
    entire human race, if the appropriate cure is not found in time, has not stopped
    humanity from playing dirty power politics. However, broadly, humans have understood
    that for their safe existence, they need to ensure to retain and enhance their
    ability to innovate and experiment. This process of experimentation would only
    allow them to find solutions for various difficulties, including major crises
    like the pandemics.


    One of the influential technologies which have been dominating the global technology
    spectrum since the second half of the 20th century is the Information Technologies
    (IT). The COVID-19 pandemic and resultant interruptions have conclusively changed
    the approach towards technology adaption in general and digital technology adoption
    in particular, both for consumers as well as corporates. More importantly, several
    governments have also understood that various offshoots of IT, as well as IT-based
    applications, can play a significant role in governance alike, and technology
    is likely to play a vital role in recovery, as well. Broadly, it could be argued
    that the COVID-19 crisis is reclaiming the importance of IT as the ‘mover and
    shaker technology’ for the world. At the same time, it is also necessary to avoid
    the temptation to look at the range of technologies only from the prism of the
    COVID-19 crisis. For centuries the world has witnessed technology as a fundamental
    agent for social change. They offer numerous possibilities to innovate, design,
    and develop new scientific and technological ideas to bring in a change in civilian,
    commercial, and strategic domains.


    Renowned Harvard Business School professor, Clayton Christensen, debated about
    disruptive technology and innovation during the 1990s. During the last few decades,
    the world has witnessed the rise of novel technologies such as artificial intelligence,
    blockchain, the Internet of Things (IoT), robotics, 3D printing, and many more
    that have trodden a new path of innovation, although still in its nascent stages.
    These technologies have showcased the potential applicability it has in many sectors.
    It has been predicted that technologies like these have the potential and capability
    to disrupt the existing technology setup bringing in a sea change in human activities
    for the future. They could bring in lifestyle changes, improve various existing
    commercial practices, and scientifically impact the security apparatus. Disruptive
    technologies tend to be new and aren’t incremental improvements in existing technologies.
    Hence, it is critical to study the possible impact of such technologies on the
    existing industrial setup. It is necessary to undertake such a study for every
    major sector of the industry. Through this book, the authors have attempted to
    focus on the shipping industry, which plays an instrumental role in the global
    economy. Therefore, the shipping industry is a very relevant domain that needs
    attention, especially when a new wave of technological advancements that can ease
    and dissipate the inherent troubles facing the industry looms on the horizon.
    This book and the subject the authors are trying to tackle focuses on understanding
    the impact of specific technologies that are disruptive in nature on the shipping
    industry, including related issues of global supply chain management.


    A force majeure, such as pandemics, natural calamities, and geopolitical instabilities,
    could affect the global supply chain, especially in the future. With an opaque
    supply chain, overpowered by middlemen, and covered with heaps of paperwork, acts
    as a hindrance to the efficient functioning of the global shipping industry. This
    can be addressed by employing innovation afforded by novel technologies, such
    as blockchain and artificial intelligence. The authors, through the book, have
    focussed on two technologies, namely blockchain and artificial intelligence. Analyzing
    the numerous technical aspects, its importance, and applications, the authors
    have furthered this thought, to study an ecosystem, that has integrated the two
    technologies. Furthermore, by exploring this possibility of an integrated ecosystem,
    the shipping industry is brought into focus, eyeballing at the possible applications
    it has on the industry. Through this book, the authors have tried to bring out
    the crux of the issue faced by the shipping industry, eventually finding a plausible
    answer to the problem.


    It is but self-evident that tomorrow’s social and economic issues would be different
    from those of the present day. Hence, priority setting becomes extremely important.
    Various technologies discussed in this book would allow the policymakers to significantly
    improve on their existing structures. For both the near and distant future, the
    shipping industry is expected to remain as a lifeline for the global supply chain.
    With the investor sentiments likely to remain subdued in the near term owing to
    the COVID-19 crisis, the demand for an integrated ecosystem of blockchain and
    artificial intelligence suggested in this book, therefore, necessitates immediate
    attention from the policymakers. They provide opportunities that could prove beneficial
    for the global shipping industry.


