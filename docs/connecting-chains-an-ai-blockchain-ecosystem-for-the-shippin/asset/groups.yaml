    ## 连接链条


    ### 航运业的人工智能-区块链生态系统


    罗尼·宁南

    安尼凯·巴瓦桑卡尔


    www.elivapress.com


    艾利瓦出版社


    罗尼·宁南正在就读于位于印度松尼帕特的阿育王大学的印度青年奖学金项目。他的兴趣领域包括科学与技术政策、国防政策和供应链管理。他持有普纳共生国际大学下属的共生国际研究学院的国际研究硕士学位。他毕业于印度孟买圣泽维尔学院（自治）的物理学士学位。


    安尼凯·巴瓦桑卡尔于 2016 年 8 月加入 SSIS。他的兴趣领域包括印度战略思想、海事领域、南亚以及北极地区的地缘政治。在加入 SSIS 之前，他曾任新德里政策研究学会（SPS）的高级研究助理。他获得新德里南亚大学的国际关系硕士学位。


    在一个各种技术进步影响人类全球互动方式的世界里，少数几种颠覆性技术为全球事务的新篇章铺平了道路。其中包括区块链技术——一种分布式账本技术（DLT）——以及人工智能。作为全球供应链支柱的全球物流，凸显了确保优化航运行业挑战的重要性。然而，航运业正面临一些迫使行业重新审视其商业模式的挑战。由于行业结构复杂，众多代理商和中介机构造成的不透明，以及大量文档工作，航运业缺乏可见性，这些问题继续困扰着航运业的顺畅和高效运作。通过本书，我们聚焦于这些演进技术及其在全球航运业中的应用。区块链和
    AI 等新兴及颠覆性技术已在航运业部分得到实施，但由于某些挑战，完全功能的实施尚未进行。本书将探讨区块链技术与人工智能的整合如何影响航运业，并审视一体化生态系统对行业的好处。


