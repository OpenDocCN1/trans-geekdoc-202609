  \ Poisson 作为参考点。考虑了许多假设和估计，影响了计算的最终输出。Poisson 方法被采用。 | ![图 6.1 提议系统的结构](img/fig0035.jpg)\
  \ | 图 6.1 提议系统的结构 |\n\n## 6.4 提议系统\n\n当用户将卡插入插槽时，会从数据库获取关联数据。如果识别失败，机器将通知持卡者 `PIN`\
  \ 可能泄露。同时，用户进行人脸扫描。扫描时，机器将与卡关联的成员脸进行匹配。如果匹配结果为“成功”，将允许取款。\n\n使用 Python 库 (`OpenCV`)\
  \ 来处理用户捕捉的人脸。如图 6.1 将所有与卡相关的脸发送回 ATM 后端。一旦接收到脸，如果比较结果小于匹配阈值，用户通过验证并允许进一步操作。\n\n\
  ## 6.5 方法论\n\n1. **插入卡片**：首先，使用 ATM 卡取款的用户插入卡片，允许 ATM 读取卡片。在后台，卡号被存储并准备好查询数据库。同时，摄像头准备好捕捉。\n\
  2. **人脸扫描**：用户站在摄像头前，由 ATM 机器捕捉用户的脸部（在该模型中仅使用网络摄像头）。人脸图像被临时存储在磁盘上以便进行处理和比较。\n3.\
  \ **脸图像处理**：现在，系统借助开源计算机视觉库处理用户的扫描脸。使用“Haar 级联（Haar cascades）”算法检测脸是一种基于机器学习的方法，其中级联函数使用输入数据进行训练。`OpenCV`\
  \ 已经包含了许多针对脸、眼睛、微笑等的预训练分类器。在此阶段，在构建模型之前从帧中裁剪、缩放并归一化脸。\n4. **从数据库获取脸**：同时，通过 `TCP`\
  \ 向数据库发送安全加密请求，返回所有与卡相关的脸。数据库包含与单张卡关联的所有成员的脸。脸不作为图像存储，因为这样做效率低下且会导致数据库变慢。相反，脸图像存储在磁盘上，并将图像的路径地址或位置存储在数据库中，用于指向磁盘上的脸。接收数据库数据（包含存储位置列表）后，机器将尝试从这些位置获取脸图像，然后与所有可用脸进行比较。在比较之前，这些脸也经过与一步相同的处理，以便比较更简单并产生更好的结果。例如，令\
  \ `F[1]` 为扫描的脸，令 (`G[1]`, `G[2]`, `G[3]`…`G[n]`) 为从数据库响应中获取的脸列表（路径地址或位置列表 `L[1]`,\
  \ `L[2]`, `L[3]`…`L[n]`）。然后发生如下比较：\n\n* `F[1] × G[1]` → `0.85`\n* `F[1] × G[2]`\
  \ → `0.94`\n* `F[1] × G[3]` → `0.21`\n* `.`\n* `.`\n* `.`\n* `F[1] × G[n]` → `0.54`\n\
  \n其中 `×` 代表比较，关联数字是比较结果。\n5. **脸部比较**：在上一阶段，比较结果表现为扫描脸与数据库中每个存储脸之间的差异，并以数值形式存储在数组中。在尝试从\
  \ `array` 的所有差异中获得最小差异并标记为最佳匹配脸时，被标记为最佳匹配脸的用户正在访问与卡关联的 ATM（记住，可能有很多脸，包括家庭成员，所以最佳匹配可能是尝试访问\
  \ ATM 的家庭成员！）。如果比较达到阈值，则对于此最佳匹配脸，用户通过验证。如果失败（未达到阈值），机器将要求重新扫描脸并重复相同程序。假设连续失败第三次。在这种情况下，机器将通知持卡者卡可能被盗并阻止交易。扫描的脸随后也会存储，以便在发生法律诉讼时识别用户。\n\
  6. **允许操作**：最后，在用户通过验证后，允许其与其账户交互或进行交易。图 6.1 展示了提议系统的概览。\n\n\n\n\n\n如图 6.3 所示，基于\
  \ `PIN` 的交易提供了约 75% 的安全性，因为 `PIN` 的验证是通过手机完成的，而手机一旦被盗，将成为用户的一处重大的漏洞；或者如果用户丢失了手机，则用户将无法从\
  \ ATM 提取现金。这项技术由 Srivatsan Sridharan (2014) 在“改进自动取款机服务的真实性与安全性”论文中提出。\n\n![图 6.3\
  \ ATM 安全中使用的不同技术的比较。](img/fig00037.jpg)\n\n**图 6.3** ATM 安全中使用的不同技术的比较。\n\nPriyanka\
  \ Hemant Kale (2019) 在“基于嵌入式的双重身份识别 ATM 卡安全系统设计”中提出，为了进行身份验证，用户必须获取 `OTP` 或进行指纹识别才能完成交易，这留下了通过被盗手机进行盗窃的可能性，同时也成功避免了使用本可以发现入侵者的生物识别扫描\
  \ \\[18\\]。\n\n2019 年晚些，Sayan Hazra 提出了一种“智能 ATM 服务”。他推广了使用生物识别和基于 `OTP` 的交易进行无卡交易的想法，这非常具有创新性。然而，它也有其缺陷：生物识别仅适用于账户所有人，其他人不行。因此，这使得检测入侵者变得困难，因为子用户必须通过旧的基于\
  \ `OTP` 的交易，而这种交易存在风险 \\[19\\-20\\]。\n\n现在，在所提的系统中，我们提倡在不移除任何其他安全层的情况下，为现有系统增加一层安全防护。在该系统中，创建了一个数据库来存储账户所有及子所有者的所有面部。这使得\
  \ ATM 用户必须通过生物识别扫描，如 \\[19\\-20\\]。因此，面部识别极大地减少了资金被盗的风险。此外，即使入侵者成功盗走了所有者的手机，他们也无法从\
  \ ATM 提取任何资金，因为他们的面部与数据库中存储的面部不匹配。用户首先插入卡片并站在摄像头前，以便扫描用户的面部并使用 `OpenCV` 进行处理。在处理之前，系统将要求数据库返回与该卡片相关的所有面部。面部将经过处理，并与数据库中存储的面部进行对比以验证用户身份。最后，系统将允许用户访问并输入\
  \ `pin`。\n\n当人们尝试使用卡片访问 ATM 时，可能会发生许多场景。下一节涵盖了几乎所有想象到的场景。它详细介绍了该功能如何在后端和前端进行实现。所提的系统涉及用户面部如何与存储在数据库中的图像数据匹配，以及根据结果是否提示用户输入\
  \ `PIN`。\n\n### 案例 1：持卡人访问 ATM\n\n一旦在控制台中输入卡号，面部识别程序立即开始，从数据库中搜索匹配的图像数据。系统在我们的数据库中存储了姓名、匹配面部所需的图像信息和家庭数据等信息。在这种情况下，卡号是主要的识别手段。持卡人正在使用\
  \ ATM，因此在面部匹配后，用户通过了身份验证，并被要求输入 `PIN`。图 6.4 显示了所有者的登录验证页面。\n\n### 案例 2：卡主的家庭成员尝试访问\
  \ ATM\n\n![图 6.4 登录验证。](img/fig0038.jpg)\n\n**图 6.4** 登录验证。\n\n与之前的情况不同，并非原持卡人在尝试访问，而是家庭成员在尝试。因为其家庭成员的信息存储在数据库中，他们通过了身份验证。他们被要求输入\
  \ `PIN`。因此，在面部匹配后，用户通过了身份验证，并被要求输入 `PIN`。图 6.4 显示了所有者的登录验证页面。\n\n### 案例 3：入侵者尝试访问\
  \ ATM\n\n图 6.8 了入侵者尝试使用 ATM 的场景。在这种情况下，一名入侵者正尝试访问 ATM。入侵者输入了正确的卡号，请求发送到我们的数据库，面部识别程序开始。然而，他们的面部与持卡人或家庭成员的图像数据不匹配。结果是入侵者没有被提示输入\
  \ `PIN`，而是显示了一条警告，说明入侵者的面部与数据库中的面部不匹配。图 6.9 显示了入侵者如何被拒绝访问 服务。\n\n## 6.7 未来前景\n\n\
  AI 技术可以通过增加对客户（及员工）服务的个性化来帮助增加收入，并通过提高自动化水平、降低错误率和更好的资源利用带来的效率来降低成本，并基于对海量数据进行处理和生成见解的能力提升，发现新的、此前未实现的机会。\n\
  \n\n\n\n\n云端可以帮助服务的集中化和敏感数据的安全备份。云端还通过高安全性的保护和访问，以及其托管的数据和应用程序的冗余可能性，满足了该领域的安全与防护挑战。\n\
  \n由于生物识别认证可能包括面部识别或指纹技术，在生物识别过程中客户与 ATM 机本身之间的交互需要本地化处理。无论是增强用户体验、提高安全性，还是增加功能元素，边缘计算的实现都有助于这些目标的实现。\n\
  \n## 6.8 结论\n\n在本章中，我们强调了 ATM 安全的重要性，并指出了交易环境需要改进。银行卡插攻击（card shimming）、非法盗刷（card\
  \ skimming）和非法拦截卡（card trapping）等 ATM 欺诈事件激增。因此，必须制定解决方案来解决当前系统的安全担忧。通过面部识别增加额外的安全层进行身份验证，因为它比传统的\
  \ PIN 码验证更安全。这将帮助 ATM 系统判断是否为正确的人在使用卡。此外，这也有助于数字取证，因为可以捕获入侵者的脸部，从而减少欺诈。根据统计，基于 HOG\
  \ 的人脸识别非常准确，需要的计算时间更短，存储空间也更少，因为训练图像是以其在简化基上的投影形式存储的。我们得出结论，与用户尝试与 ATM 交互的其他方式相比，面部识别具有最高的准确率。我们还发现该模型根据现有算法的指标对使用的算法进行了定性分析。\n\
  \n项目软件不仅限于特定用途；它可以扩展到云、区块链、深度学习等领域，使敏感环境更加安全。\n\n### 参考文献\n\n*   1 Sayan Hazra (2019,\
