  \ B. Karthika[4], 和 V. Murugesh[5]\n\n1 计算机科学系教授，Siddhartha Institute of Technology\
  \ and Science，海得拉。\n2 计算机科学与工程教授（人工智能），CMR Technical Campus，海得拉。\n3 电子工程系教授，Nalla\
  \ Narasimha Reddy Group of Institutions，海得拉。\n4 信息技术系助理教授，PSNA College of Engineering\
  \ and Technology，丁迪尔。\n5 计算机科学系助理教授，Bule Hora University，埃塞俄比亚。\n\n### 摘要\n目前，侵犯性消息或文本正在侵蚀互联网用户体验的有效性。随着新出现，滥用技术的人正在增加。本研究的主要目标是防止掠食者参与侵犯行为，同时调查各种侵犯模式。为了解决这个问题，我们使用了自然语言处理\
  \ (`NLP`) 方法来应对文本中侵犯内容的挑战。使用了具有支持向量机 (`SVMs`）、多层感知器 (`MLP`）、卷积神经网络 (`CNN`) 和文本编码器（`词袋`）的机器学习技术进行评估。测试在\
  \ Reddit 网站的一个新可用数据集上进行。集成 `CNN` 分类器和文本编码器根据性能指标产生更有效的结果。\n\n## 4.1 引言\n\n### 4.1.1\
  \ 人类\n人类被分为两部分：男性和女性。在一起，男性和女性可以有效地管理社会。许多存在的恐怖行为是针对女性实施的，男人将女性置于自己的意志之下，利用她促进自我满足，满足其侵犯性快乐，并促进自己的舒适。然而，他从未渴望过将她提升到她本应的位置。\n\
  \n\n\n\n\n![图 4.1 青少年科学化身体发育。](img/fig00020.jpg)\n\n图 4.1 青少年科学化身体发育。\n\n### 4.1.2\
  \ 网络虐性骚扰\n\n虐性骚扰有许多形式；其中一种就是网络虐性骚扰，这也是本文的主题。网络虐性骚扰定义为通过不同的社交媒体平台发送攻击性信息、侮辱性图像、粗俗音频以及带有攻击性内容的色情链接。\n\
  \n虐性骚扰对个人可能产生多种影响，包括身体伤害以及情感痛苦和崩溃。\n\n### 4.1.3 学习算法\n\n近年来，`CNNs` 已实现文本、音频、语言、词汇和说话人识别测试，并显著提高了识别结果。`CNN`\
  \ 元素在改进虐待捕食者方法的环境方面是独特且有效的。该领域的研究人员进行的研究和相关工作非常有限。根据研究背景和对研究问题的回顾，在噪声环境中需要一种有效的虐待捕食者。\n\
  \n所提方法通过识别模式并跟进所有文本消息来处理系统，以防止虐待捕食者。\n\n## 4.2 文献综述\n\n所提出的 `B-Spline` 曲线可以识别泰米语棕榈叶稿中的元音。与\
  \ `BFS` 算法相比，它改进了结果。所提出的基于分割的 `Omni` 字体库使用了字符分割算法、神经网络和特征提取。该方法在字体识别阶段实现了 95% 的准确率。该研究的未来前景包括学习阶段的泛化，以及使用后处理技术降低错误率。未来方向包括除了笔画识别外，还将使用\
  \ `B-Spline` 曲线识别 [1]。\n\n讨论了现有的各种字符识别方法和文献回顾方法，包括人工智能和机器学习。在孟加拉语中进行了 `CNN` 架构与\
  \ `ML` 方法进行字符识别的比较。`CNN` 架构使用孟加拉语数据集中的不同层构建。该研究的未来工作是分析孟加拉语中的复杂字符 [2]，研究各种区域语言，分析区域字符并发明多语言文本识别。\n\
  \n预处理和识别被提出一种模型，其字符识别优于之前的算法。与传统方法相比，所提的 `SVM` 方法具有更高的准确率。研究工作的未来前景涉及现实场景中的字符识别以及使用多语言字符识别\
  \ [3]。\n\n所提方法可以通过扫描车辆车牌并使用自动车牌字符识别来监控交通和拥堵控制，从而防止涉及车辆的犯罪 [4]。首先，目标是建立大型复杂的手写字符数据集\
  \ (`HMBD`)，并使用 `DL` 和 `CNN` 架构结合 `HMB1` 和 `HMB2` 进行分析。从文本数据集阶段到识别阶段，以及经过分割和特征提取阶段的分类阶段。这项工作的工作将有助于防止涉及车辆的犯罪。\n\
  \n它涉及市场上各种类型的 `OCR` 以及客户如何使用它们，并讨论了包括泰米语、泰卢固语、坎纳达语和马拉雅拉语在内的各种南印度语言的字符识别。这项工作还提出了基于神经网络、字符归一化、相关方法和分割的字符识别。作者还得出结论，对于大多数语言，`CNNs`\
  \ 的性能优于其他传统方法。该研究的未来工作是将 `OCR` 应用于网站并使其有效运行 [5]。\n\n对不同的提升算法进行了识别比较研究。输入数据集来自不同个人的手机。研究结果显示，所提策略在分类日常活动方面具有很高的准确率。这些发现支持了所提系统利用传感器数据识别日常活动的能力，并意味着它可以帮助减少日常静止趋势，并辅助积极生活和快乐\
  \ [6]。\n\n人工智能使用不同的机器学习方法来预测机器故障。所提工作根据设备的当前状态预测故障。它确保了卓越的监控和预测准确性以及高水平的置信度 [7]。\n\
  \n调查通过两种方式进行：使用 `Hyper Opt` 框架进行系统的超参数优化 (`HPO`)。展示了四个数据集的准确评分和训练时间 [8]。\n\n在用新技术改变生活的过程中，主要目标是监控社交媒体平台消息中的虐性内容并通过应用程序生成警报。建立了一种算法对文本通信进行分类\
  \ [9]。\n\n目前，网络骚扰是一个日益上升且严重的问题。深度学习和机器学习算法已应用于现有的文本分类方法中。深度学习方法在文本分类方面效果更好。`MaLang`\
  \ 作为一种革命性技术被用于检测虐性文本内容。`MaLang` 以 98.2% 的分类准确率优于对手 [10]。\n\n网络虐性骚扰通常会导致严重的困扰，尤其是对女性和儿童。近期全球范围内发生了多次网络骚扰事件。因此，专家正更加关注社交媒体上的虐性短信检测。这项研究旨在利用自然语言处理和机器学习来创建一种检测在线虐性短信的有效技术\
  \ [11]。\n\n本文通过描述一种识别和防止网络欺凌的方法建立之前研究的基础上。从回顾网络欺凌现有工作开始。随后，分类并评估了一种识别阿拉伯内容中网络欺凌的技术\
  \ [12]。\n\n新的深度学习架构命名为 `convolutional bidirectional LSTM (C-BiLSTM)`，用于识别不当的查询推荐。`C-BiLSTM`\
  \ 在手工特征方面表现优，并具有高精确率 [13]。\n\n已给出了检测虐性语言的所有必要参考文献。它们可以作为其他寻找与其研究领域相关的虐性语言信息的学术者的资源\
  \ [14]。\n\n第一步是创建一个单一分类系统，将所有写作翻译成通用语言，然后对其进行分类。实验结果表明，所提方法获得的 F1 分数准确率分别超过 93%\
  \ 和 91% [15]。\n\n## 4.3 提出的方法\n\n本研究聚焦于文本分类，即根据内容对文本进行分类的过程。这可以应用于各种应用程序以对文本进行分类。内容虐性文本分类是一项具有挑战性的任务。手动过程非常耗时。这项研究工作旨在观察\
  \ `NLP` 和机器学习方法的使用，以帮助虐性文本的检测，如图 4.2 所示 [#Ch04.xhtml#cap_lbl0026]。\n\n### 4.3.1\
  \ 预处理\n\n\n\n\n\n预处理是将给定的文本转换为标记（tokens）的过程。在预处理过程中，文本被转换为小写，并从短语中提取标记。所有的数字和停用词都会被移除。下一步是从预处理后的文本中提取各种特征，并应用分类过程。\n\
  \n![图 4.2 所提方法的框图。](img/fig00021.jpg)\n\n图 4.2 所提方法的框图。\n\n### 4.3.2 特征提取\n\n特征提取器负责将标记转换为学习系统可以使用的数值。所采用的特征提取方法是词袋模型（BoW）。\n\
  \n### 4.3.3 向量空间模型 (VSM)\n\nVSM 是处理文本编码任务的主要技术。VSM 方法将文本文档转换为数值向量。\n\n#### 4.3.3.1\
  \ 词袋模型\n\n特征特征权重策略之一是 BoWs 方案。它也适用于计算机视觉和文档分类等其他不同应用。BoWs 为每个文本分配一个向量，该向量代表词典中的单词出现在文本中的概率。可以使用文本训练集来创建该词典。\n\
  \n### 4.3.4 分类方法\n\n分类通过结合前述阶段提取的特征来实现。分类技术根据已建立的规则识别字符。类成员模式在分类过程中用于决策制定。分类任务具有挑战性。因此，特征提取方法降低了误分类的概率。在此之后完成分类过程，但当字符落入未知模式时，分类就会变成一个问题。\n\
  \n#### 4.3.4.1 支持向量机 (SVM)\n\n支持向量机（SVM）是二分类监督学习分类器之一。SVM 分类器通过评估特征子集确定每个样本属于哪一类。首先选择超平面来划分两个类以避免数据误分类。如果输入文本字符特征为\
  \ `x`，字符类别结果为 `y`，则超平面划分输出类别标签 `y {−1, 1}`，超平面指定如下：\n\n`w.x + b = 0.`(4.1)\n\n然后，\n\
  \n`yi ≥ 1`其中`i = 1, 2, 3,…N`.(4.2)](#Ch04.xhtml#bck_cap_lbl0028)\n\n超平面使用方程 (4.1)\
  \ 和 (4.2) 计算，并用于最小化图 4.3 中数值之间的方差。\n\n超平面之间的差异在以下等式中确定\n$d_{+} + d\\_ = \\frac{2}{|w|}.$(4.3)\n\
  \n然后根据数据将新生成的特征与现有特征空间进行比较。尽管这种基于 SVM 的分类具有高精确值，但其召回率较低。然后利用阈值微调 SVM 以提高召回率和分类性能。结果是创建了最优超平面，并使用迭代方法最小化了误差函数。\n\
  \n#### 4.3.4.2 多层感知器 (MLP)\n\n多层感知器（MLP）将输入数据映射到一组可接受的输出。MLP 是一种改进的线性感知器，可以识别数据。MLP\
  \ 由有向图中的许多层节点组成，每个节点与下一个节点全连接。MLP 的构建包含许多层节点，图 4.4 所示。非线性激活函数用于 MLP 构建。\n\n图 4.3\
  \ 支持向量机。\n\n#### 4.3.4.3 卷积神经网络 (CNN)\n\n卷积神经网络用于图像处理。卷积神经网络由高度、宽度和深度组成。图 4.5 所示。卷积层通过输入进行构建。\n\
  \n## 4.4 性能分析\n\n对不同分类器的性能分析是为了检测抽象消息。以下是性能指标。\n\n![4.4](img/fig00023)\n\n图 4.4\
  \ 多层感知器。\n\n![4.5](img/fig00024)\n\n图 4.5 CNN 架构。\n\n#### 4.4.1 精确率\n\n精确率有时被称为预期值，是衡量检索字符与用户查询匹配程度的指标。精确率值的确定如下：\n\
  $\\text{Precision} = \\frac{|\\text{relevantdocument} \\cap \\text{Retrieved}|}{|\\\
  text{Retrieved}|}$(4.4)\n\n#### 4.4.2 召回率\n\n成功检索的用户查询文档部分被称为召回率。使用以下方程计算召回率：\n\
  $\\text{Recall} = \\frac{|\\text{relevantdocument} \\cap \\text{Retrieved}|}{|\\\
  text{relevantdocument}|}$(4.5)\n\n#### 4.4.3 F 值\n\nF 值通过相加每个类的精确率和召回率来确定。\n\n####\
  \ 4.4.4 准确率\n\n准确率使用以下方程 (4.6) 计算：正样本的数量除以系统观察到的文本总数。\n$\\text{Accuracy} = \\frac{\\\
  text{numberoftruepositive} + \\text{numberoftruenegative}}{\\text{numberoftruepositive}\
  \ + \\text{fa1sepositive} + \\text{fa1senegative} + \\text{truenegative}}.$4.6)\n\
