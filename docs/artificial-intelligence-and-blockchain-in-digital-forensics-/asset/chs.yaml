  \ 2020.\n* [[25]](#Ch08.xhtml#bck_ref0212) Block Steven,无受者犯罪, 75-79, 2015.\n* [[26]](#Ch08.xhtml#bck_ref0213)\
  \ Zhang, X., 等，人工智能在认知心理学中的应用——基于人工智能文献对儿童的影响。,,Agg. and Viol. Behav,101590, 2021.\n\
  * [[27]](#Ch08.xhtml#bck_ref0214) Hsu, Shang Hwa, Ming-Hui Wen, and Muh-Cherng Wu.\
  \ “MMORPG 成瘾的用户体验预测探索”,,Comp. & Edu, 53(3), 990–999, 2009.\n\n\n\n\n\n### 摘要\n数字取证（DF）是一个在收集大量计算密集且复杂的信息方面变得日益重要的领域，并且在全球范围内经常需要进行智能分析。数字取证提供了一种审慎利用科学信息来揭示和理解电子证据的方法。人工智能（AI）技术解决了数字取证中的挑战，并提供了一种在合理时间内处理海量计算或复杂问题的方法。本章概述了一些人工智能的原理和程序。它涵盖了日常面临的困难，包括少数地区数据集的可访问性，以及在使用特定策略时解释结果的明确困难。本章表明，确实需要提高对可用人工智能原理的利用，并讨论了目前使用的调查技术的优点和局限性。本章还提到了在训练信息有限的情况下交付模型面临的困难。因此，在本章中，我们提出了一个带有图表和结果的分类框架，以应对现状并分析数字取证未来的挑战。\n\
  \n# 9.1 引言\n\n数字取证科学包括从先进设备中恢复证据。在某些情况下它被描述为捕捉调查阶段的循环模型。在本节的解释中，循环被分为若干阶段，有助于说明\
  \ AI 方法在高级调查中的应用位置。这些阶段分别是：采集、检查、分析和展示。真正的可解释的人工智能系统开发出一种思维，这种思维涉及输入数据的人类因素，以描述模型的判断过程。为了获得信任，这些平台必须优先考虑终端用户的需求（例如特定行业内的多个用户组或法律体系内的不同参与方）。这些技术的创建者应该与使用它们的人合作，否则将面临组织工作过于透明或难以理解的风险。\n\
  \n![图 9.1 人工智能在数字取证中的未来。](img/fig00055.jpg)\n\n图 9.1 人工智能在数字取证中的未来。\n\n数字取证中人工智能的未来见于图\
  \ 9.1。\n\n人工智能（AI）的最新进展导致此类方法在许多企业和技术领域迅速增加。AI 方法日益复杂使得此类系统安全性和可靠性的保证和测试变得困难。因此，日益发展的\
  \ AI 安全领域试图解决 AI 系统的可靠性和安全性 [8]。数字取证旨在创建对 AI 失败进行取证调查所需的工具、方法和程序。除了检查底层技术缺陷外，此类调查还必须评估故障是否是由故意行为触发的，以及谁对损害负责。技术、立法、犯罪学、心理学等领域都涉及了这一主题\
  \ [9]。\n\n机器学习（ML）经常在数字取证调查中用于数据发现、设备分选和网络取证。任务规范、特征创建以及评估与优化是 ML 应用的三个阶段。根据目标标签的类型，ML\
  \ 任务可以归类为分类/聚类或回归问题。在实验过程中进行特征变换和选择是为了减少过拟合、增强性能并缩短训练时间。正如人类不开发特征一样，深度学习（DL）的数字取证应用也类似于机器学习（ML）。相反，它使用一种通用的学习技术来从数据中学习。优化和推理是\
  \ DL 模型的两个步骤。连接模型中称为“神经元”的单元的值通过训练阶段进行改变。解释则用于根据学习过程中期间不可见的无标记数据做出准确预测 [10]。\n\n\
  根据最新趋势，犯罪发生环境和数字取证的应用范围正在发展和扩大。新技术和潜在网络犯罪环境的出现（例如高性能计算和云的突破，以及社交媒体和通信设备的普及）要求对数字取证使用的工具进行审查。\n\
  \n必须对更高效、合适的实践和技术进行调查 [9]。我们建议使用智能数字取证方法来加速和提高调查的效率。这项研究确定了人工智能工具和数字取证智能理论作为一种可能性\
  \ [11]。\n\n在调查作为犯罪的 AI 时，理解 AI 如何使用至关重要。当局应该收集并解释数据集、学习方法、各种技能、推理模型以及用于法的 AI 系统实施。调查人员应该理解\
  \ AI 的目标是基于评估。在这种情况下，调查人员必须能够区分开发者的意图和 AI 的输出。与传统编程不同，AI 程序经常会有意想不到的结果 [12]。\n\n\
  在传统编程中，数据和代码被处理以产生结果；在 AI 中，信息和生产被用于创建程序。AI 参数通常具有某种随机性，因为许多 AI 模型在训练阶段使用任意值。结果是具有不同参数和结果的算法可以使用相同的信息和训练模型构建。无法证明\
  \ AI 是否被用作武器、AI 如何被部署以及 AI 造成了什么损害，因为调查人员无法重建案件 [11]。\n\n功能性 AI 调查的另一个障碍是复杂性。人工智能模型通常采用多种方法和模块。若干\
  \ AI 设计集成了现代 AI 系统提供的应用程序接口（`APIs`）。由于 AI 系统的复杂性，调查人员必须深入理解 AI 并具备进行反向工程的能力 [12]。\n\
  \n## 9.2 数字取证中的人工智能\n\n数字取证中的人工智能分类于图 9.2。\n\n\n\n\n\n我们将 AI 取证视为数字取证的一个子领域，定义为用于收集、采集、分析和披露与\
  \ AI 支持的故障相关的数字材料的科学和监管工具、技术和程序 [12]。网络攻击的增加以及网络犯罪类型的复杂化，加上在应对网络攻击时超级计算机和人类面临的时间与预算限制，使得数字取证专家在实施取证分析和数字调查过程以获取快速结果方面面临巨大压力。AI\
  \ 在数字取证（DF）中的未来与应用之间的差异见表 9.1。\n\n![图 9.2 人工智能在数字取证中的关键阶段。](img/fig00056.jpg)\n\n\
  **图 9.2** 人工智能在数字取证中的关键阶段。\n\n**表 9.1** AI 在数字取证中的未来与应用之间的差异。\n\n| **AI 在数字取证中的应用**\
  \ | **AI 在数字取证中的未来** |\n| --- | --- |\n| 如果任何信息幸存，一个文件系统内部删除的文档可能被确定性地检索。然而，在某些情况下，这些信息是缺失的，且材料存储在分区的未声明区域。\
  \ | ML 方法通过利用早先计算机取证评估获得的知识，可以加速调查所需核心数据的获取。 |\n| 网络调查通常是更广泛调查的一部分，包括事件响应、移动设备、智能手表、财务欺诈等。此类调查通常涉及多个已连接的设备或技术。\
  \ | 网络活动监控将变得更具分层性，允许跨多个系统或网络改进用户信息的匹配能力。现在可以使用现代网络和设备对单个可疑消费者及其行为进行更广泛的画像分析。 |\n\
  | DL 方法根据事件消息表示中的积极或消面情绪，强调时间范围内的重要时刻，例如“登录丢失”或“验证失败”。 | 动作的时间范围仅是信息收集的一个视角；它可能是访问数据库的有用切入点，因为它允许将视角“切换”到适合分析的文档、相似材料并再次回到时间范围。\
  \ |\n\n### 9.2.1 AI 在数字取证中的应用\n\nAI，或人工智能，研究对环境做出反应的智能体，寻找实现目标的最佳路径。机器学习（`ML`）和深度学习（`DL`）是计算机科学中\
  \ AI 的两个主要学科 [12]。\n\nAI 的成功是数据驱动的，因为没有明确的编码来规定特定的结果。\n\n数字智能通过提供协助计算机化科学空间内信息和数据呈现归一化的能力，可以影响先进的法律科学。文中概述了在数字取证中构建人工智能系统时可用的数据。用于准备模型的数据集是简单的，且数据预处理是机器学习中的一个重要阶段。\n\
  \nAI 是一门巨大的学科，拥有解决各个领域广泛问题的方法。AI 试图模仿人类智能，同时也包含了机器学习这一子领域，机器学习是智能发展的基础。它可以在不需要人类参与的情况下调查信息。\n\
  \n深度学习是机器学习的一个分支，通过多层神经网络运行。这使得系统能够学习数据中的复杂模式。在数字取证中，深度学习可以用于识别恶意软件、检测欺诈活动，甚至恢复被删除的文件。\n\
  \n神经网络是机器学习的一个子集，它创建了一个类似于人类大脑运行的神经元网络。这些网络被用于各种任务，如图像识别、语音识别和语言翻译。在数字取证中，神经网络可以分析大量数据并识别异常。\n\
  \n#### 9.2.1.1 数据发现与恢复\n\n如果文件在记录框架内被擦除后仍有元数据幸存，可以通过算法进行恢复。在某些情况下，这些元数据是缺失，文件存储在卷的未声明区域。然而，当此类记录跨磁盘移动时可能会被破坏并部分重写。这种在没有信息的情况下检索此类文件的技术被称为文件雕刻（file\
  \ carving）。\n\n\n\n\n\n机器学习可用于自动化数字取证调查 [8]。机器学习方法可以通过利用从之前的数字证据分析中获得的知识，加速调查相关信息的获取。开发\
  \ AI 模型面临的困难之一是避免对抗性攻击。攻击者可以干扰源头，导致错误结果。在调查过程中，任何预训练模型都可能失去效力。这是一个需要克服的挑战。\n\n####\
  \ 9.2.1.2 设备分流 (Device triage)\n\n数字证据分流已被提出一种即时识别、分析和解释数字证据的方法。在未来，设备分流在数字调查中的有效性可能会变得至关重要。目前，调查人员决定犯罪现场设备获取和处理的顺序。随着更多基于\
  \ AI 技术的发展，现场初步检查可能能够迅速将分析集中在最可能包含案件进展信息的设备上。由于缺乏足够大且共享的数据集，开发 AI 分流模型存在困难。随着分流准确性的提高，浪费在无关数据上的资源将将会减少。\n\
  \n#### 9.2.1.3 分析网络流量\n\n在许多情况下，系统查询成为更广泛调查的一部分，涵盖了应急响应、云、信息技术、智能手机、可穿戴技术和金融犯罪。事件发生后，调查人员可以获得大量关于离线批处理过程中数据传输中\
  \ AI 的文献 [11]。特征选择程序显著影响 AI 技术生成的模型。在获取网络数据并提取特征后，使用聚类技术来开发用于检测攻击的 IOC（入侵指示指标）指南。事实上，对于加密网络，人工智能方法可以在任何情况下被利用用于展示组织的实证数据。\n\
  \n#### 9.2.1.4 加密信息取证\n\n加密数据是全球数字取证调查人员最关注的问题之一。加密保护设备和数据的泛滥使得数字取证调查变得无法进行 [20]。如果被检查的设备采用了磁盘加密，取证磁盘镜像将变得毫无用。在无法访问加密信息的情况下获取价值信息以及执行加密基础检索攻击，是电磁和功率侧信道分析两种可能的路径，可以通过\
  \ AI 方法提供辅助。通过使用电磁和功率侧信道观测数据，几种 AI 方法已应用于第一个目标。\n\n#### 9.2.1.5 事件恢复\n\n在数字取证中，事件恢复是一个两步程序。第一步仅仅是识别某事的发生，或者更准确地说，某事在特定时刻发生。第二步涉及检查从数字取证证据中恢复的时间戳\
  \ [12]。人们已尝试使用自动化方法分析这些大量的时间戳数据。神经组织由于其并行性和推测能力，适用于管理大量信息。Studiawan 利用深度学习（DL）策略，根据基于消息的事件描述中某些正面或负面情感，在时间表中对收入情况进行特征提取。\n\
  \n#### 9.2.1.6 多媒体取证\n\n音频、视频和图像证据在多媒体调查中接受调查，这是计算机取证的一个子集。这并不局限于智能手机；也可以包括监控分析。欧洲刑警已利用社交媒体众包技术在打击虐待儿童的战斗中追踪证据。在数字取证中，`CNNs`\
  \ 的出现允许了令人惊讶且有前景的发现 [21]。低分辨率下的自动目标识别是必要的。人眼难以识别的低能度图像可以使用定制系统进行处理。科学界对管理良好的数据集有明显的需求。\n\
  \n#### 9.2.1.7 指纹识别 (Fingerprinting)\n\n数字取证正经历指纹识别技术的激增 [22]。它可用于确定源头的型号。指纹识别的工作与\
  \ AI 分类非常契合。例如，恶意软件分类是一个热门的软件话题。了解用于录视频的相机类型在这种情况下非常有帮助。设备和用户行为指纹可能显著协助异常检测。这可能导致更有效的基于主机和网络的恶意软件检测。\n\
  \n### 9.2.2 AI 在数字取证（DF）中的挑战\n\n本章探讨了数字取证面临的各种当前困难。这些问题中的每一个都可能让数字调查人员和侦探在各种情况下难以获取信息。当这些问题结合时，其负面影响可能会被放大。由于这些困难以及缺乏技能和工作量巨大，全球许多执法机构的数字证据积压已达数年。\n\
  \n\n\n\n为了对 AI 失败进行彻底且无争议的根本原因调查，可能有必要对导致非预期行为的决策过程提供清晰、精确的分析。尽管如此，对复杂模拟智能框架逻辑的审查仍处于初始阶段，前沿技术在解决逻辑问题方面还有很长的路要走。此外，一些新的研究者（例如\
  \ Yampolskiy, 2019）认为，随着人工智能创新和能力的长期发展，AI 框架要保持逻辑性可能会变得更加棘手，甚至是不可思议的`[24]`。在这种情况下，对动态交互进行更直接的反映可能会提升对这类失败性结果的科学研究。例如，Behzadan\
  \ 等人（2018）`[24]` 为复杂 AI 提出了心理审议机制。\n\n## 9.2.2 AI 反取证\n\n在数字取证中，犯罪分子正不断适应技术进步，并采用诱饵、伪造证据和取证清理等术术来阻止取证调查。预计犯罪分子将创建并使用此类反取证策略来影响取证调查。因此，主动检测此类方法并开发补救措施将成为一个更重要的研究课题。研究人员最近创建了一种反取证分类法`[21]`。然而，AI\
  \ 反取证尚未被包含在该分类法中。虽然这是一个困难，但对研究人员来说也是机会。\n\n## 9.2.2.3 网络取证与 AI 社区之间的脱节\n\nAI 安全与数字取证之间的差距构成了我们的主要问题之一。由于来自两个领域的研究人员缺乏协作，AI\
  \ 取证领域尚未定义，并有进一步研究的空间。在最近的调查中，大多数数字取证从业人员（67%）对他们在数据科学方面的专业知识表示不同意、同意或中立，这清楚了这种差异（Sanchez\
  \ 等，2019）`[25]`。\n\n### 9.2.3 AI 在 DF 中的未来\n\n在将 AI 应用于数字取证的某些方面已有大量工作进行。本节涵盖了通用问题和可能的可能性，例如\
  \ AI 方法尚未被使用的未知领域。一个突出的重点领域是提高技术的精确性。某些领域缺乏大型、清洁且标注的数据集，使得训练模型和衡量其准确性变得困难。一种特殊情况是\
  \ AI 系统进行实时更新，例如从持续的调查中获益，以便在未来情况下更快地发现。\n\n在这种情况下，方法的输出结果可能会经常更改，造成巨大的困难。此外，考虑模型在特定情况下是否适用也是值得的。DF\
  \ 审查人员可能通过对图像分类从 `XAI` 中获益，同时维护他们的心理安全`[8]`。它可以在不看图片的情况下观察图片的测量，或者可以在不看图片的情况下读取由\
  \ `XAI/ML` 生成的对图片的特定解释。一个例子是 AI 和机器学习如何协助对儿童色情和其他不良图片进行分类`[26]`。\n\n`XAI` 在第一轮支持调查过程方面可能帮助有限。在嫌疑人被捕且假设证据存在后，大部分数字取证调查将开始进行。调查人员经常要求\
  \ DF 专家从设备中提取数据，并以易于报告的方式提交法院`[8]`。`XAI` 处理 DF 中问题提供的替代方案将在接下来的章节中从执法部门的角度进行描述。\n\
  \n前面的章节已经证明，在数字取证的某些方面使用 AI 已经存在大量工作。本节涵盖了通用问题和可能的可能性，例如现有和新的 AI 方法尚未被使用的未知领域。\n\
  \n提高技术可靠性似乎是一个重点。由于某些领域缺乏大型、清洁、标注的数据集，训练模型并确定其准确性非常复杂`[27]`。虽然可以使用许多数据集来训练基于视觉的算法，但像\
  \ `CSEM` 这样的敏感信息受到逻辑限制`[28]`。`DL` 可以检测显著特征。\n\n尽管存在这些障碍，改进 AI 应用及其应用于数字取证的新领域仍有可能。从智能家居、`IoT`\
  \ 传感器、汽车取证等收集的数据中推理行为是其中之一`[29]`。事实上，在需要来自多个嫌疑人、设备或案例数据的任何情况下，AI 方法可能很有帮助`[30]`。`图\
  \ 9.5` 给出了 AI 用于 DF 的未来展望。\n\n![图 9.5 人工智能改进数字取证](img/fig0059.jpg)\n\n图 9.5 人工智能改进数字取证。\n\
  \n数字取证和 AI 的工具及软件，如 `EnCase`、`Forensic Toolkit`、`The Sleuth Kit` 等将在未来使用。\n\n###\
  \ 9.2.3.1 DF 审查人员的变化\n\n如果 `XAI` 广泛使用，DF 人员的工作将发生变化。这将导致 DF 审查人员访问训练 AI 数据的权限至少发生三个微调。我们将逐一介绍这些调整：\n\
  \n1.  获取 `XAI` 模型的训练数据可能困难。在执法环境中，计算机需要对类似于用户信息（例如 `CAMs` 的照片）的数据进行学习，而这有自己的法律限制`[1]`。\n\
  \n2.  主管和其他必要的实验室员工和主管应具备以下资质：在 `AI/ML` 应用于 DF 时，在该领域所需的基础能力、证书和理解。由于智能手机设备迭代快，DF\
  \ 审查人员必须是快速学习者。由于其他薪资更高的行业对同一人才池的竞争，这个问题更加严重`[2]`。\n\n\n\n\n3.  在私营部门，来自无法离线的网络设备等不同来源的数据经常被用于数字取证（DF）。在公立部门，当证据材料在依法扣押后被留存时，通常由调查\
  \ DF 官员来处理个人对其财产被扣押的担忧 [2]。让证据存放在很长时间以等待 DF 探员空档是不可行的。\n\n### 9.2.3.2 等待时间\n\n随着机器和应用程序变得日益先进，DF\
  \ 操作的延迟和时间范围将继续增加。通过较小的数据集可以更快地分析，在短期内对正在进行的调查产生更显著的影响。某些程序尝试通过使用手动预设的文件掩码从目标设备复制详细数据，来处理日益增长的数据负载。某些系统，例如\
  \ Kroll Artifact Parser and Extractor（`KAPE`）[4][5]，尝试通过物理准备的记录覆盖来处理增加的数据量。这可以缩短处理这些记录的时间，但并没有解决数量问题。使用如\
  \ `KAPE` 工具检索的文档必须经过 DF 调查的检查，并按照有意义顺序公布。\n\n### 9.2.3.3 案件管理\n\n案件分类、对特定物品进行取证检查的困难、数据恢复能力、DF\
  \ 探员和调查人员的可访问性以及其他问题，使得 DF 案件管理变成了一种复杂且低效的操作。XAI 可能会帮助 DF 探员更高效地分诊案件，从而更高效地管理资源。XAI\
  \ 还可以帮助确定是否需要通过 DF 分析来判定案件结果 [8]。`XAI/ML` 可以为准备、表征和分组提供信息。它通过对重处理的信息和操作将某些部分计算机化，提高\
  \ DF 案件办理人员的能力。得益于 `XAI/ability ML` 梳理数据并识别上下文的能力，DF 探员可以将制品提取提升到一个全新的水平。这在 DF 案件中将节省大量的时间和精力。`XAI/ML`\
  \ 非常可能有助于推进有效模型，以预测特定物品的位置并进行额外的数据分析。犯罪分子和 DF 调查员一样，根据他们所犯错误的类型使用各种设备和方法。\n\n###\
  \ 9.2.3.4 用于辅助调查的 XAI\n\nXAI 最终可能用于分析来自目标系统的信息，并创建和包含文档，其中关于对调查重要的人、地点、时间/日期和对象之间关系的信息。本节的剩余部分留给\
  \ XAI 用于调查支持，这是此类范式的一种可能实现。\n\n1.  **定义所审查数据的目的**：在进行 DF 检查时，各种证据项将有不同的数据提取方法和可用性。用户首先应指示哪些数据项应该被检查\
  \ [6]。这可能是由于数据质量、嫌疑人对调查的重要性或实际能力造成的。尽管 DF 探员可能被要求在过程中包含所有扣押的文档，但与任何查询一样，必须强调分析目标。\n\
  2.  **收集重要数据**：使用 AI 模型精炼数据会消耗大量资源。正如 `KAPE` 等技术允许 DF 探员加速信息收集并更早开始检查一样，它们也可以被用于减少\
  \ XAI 模型必须分析的数据量 [8]。工具必须能够获取目标数据并为 XAI 系统的处理做好准备。正如任何取证调查一样，数据处理应按照适用法规进行。数据收集应在获得适当许可的情况下进行。\n\
  3.  **向训练好的原型提供数据**：XAI 模型必须能够区分各种形式的数据并对其有意义地解释它们（例如，位于 `JPEG` 文件中的 `EXIF` 数据告诉模型的内容与快捷方式文件有所不同）\
  \ [8]。使用 XAI 模型可以更快速、准确地跟踪人员、地点、时间/日期和物品。`EXIF` 表明 `CAM` 在特定地一起儿童剥削案件中制造的。次要数据（如警方记录）可能告诉\
  \ XAI 谁居住在该地区。`Wi-Fi` 连接记录可能表明另一个嫌疑人使用了相同的地址，浏览数据或对话可能表明发生过会议。XAI 将解释所有这些信息的关联性。精炼可能会超出基本关系，检查在设备上存储特定数据（如电影或照片）的环境。AI\
  \ 以前曾被用于通过证明性分析检测图片和视频中的“深度伪造”（deep fakes）。\n\n4.  **接收自动报告**：XAI 模型的输出应该是一个集成报告，反映案件与研究项目之间的相关性。通过引用特定数据点作为证据，本研究应对对其分析提供不同程度的信度\
  \ [7]。对重要人员、地点、时间/日期、物品以及基于训练数据的任何相关的见解应包含在内。\n\n## 9.3 结论\n\n本章展示了各种 AI 方法现在如何应用于数字取证的方面。它还强调了典型的困难，例如某些领域缺乏数据集、在使用特定方法时展示结果的困难，以及从模型推断出的限制数据。尽管存在这些困难，未来的发展前景广阔。正如之前提到的，这既体现在提高程序的性能，也体现在某些方法尚未在特定地区尝试。\n\
