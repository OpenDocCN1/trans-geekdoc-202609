  \ Computational Social Systems, 6(6), 1433–1441。\n\n# 14 新冠 19 期间医疗数据数字取证的多级共识算法\n\
  \n摘要：本章讨论了结合区块链技术应对医疗和医疗领域的新型方法。在新冠 19 期间，医疗领域在管理医疗记录和收集准确数据方面遇到了困难，这对于政府来说是一个巨大的挑战。所提方法可以管理医疗数据，特别是连接所有政府或私立医院，安全地传输数据并专注于数字取证。同样，所提方法用于跟踪患者、医院详情（如床位）、药物和患者治疗，以便管理机构遵循必要步骤获取准确细节来服务于。多级共识算法用于在区块链分布式网络中添加交易。\n\
  \n## 14.1 引言\n\n\n\n\n在当前的困境下，医疗保健部门在管理病历数据和追踪接触方面面临着困难。由于管理的复杂性和利益相关者的多样性，这项工作也具有挑战性，特别是在基础设施落后的后发达国家（即没有适当的程序来跟踪数据、人力资源等）。人力资源、资金和医疗政策都是需要考虑的因素。最最有前景、广为人知且广泛使用的技术之一是区块链。它于\
  \ 2011 年，为医疗数据管理问题提供了解决方案。在新冠肺炎期间，区块链在设计依赖于更高可靠性的集成且公平的医疗业务方面发挥了关键作用。新型冠病毒（COVID-19）颠覆了全球经济和普通生活，给全球医疗部门带来了巨大压力。\n\
  \n在优化医疗资源和分配生物医学数据的过程中，使用相关的重大开发技术——区块链数字取证——至关重要。交易或资产在账本中验证并记录后，在法律上是不可篡改的。这是区块链最大的优势之一。当设备上的某份数据或数据块被更改时，其他数百个系统上的数百份副本通常保持不变。要更改所有去中心化系统中的数据几乎是不可能的。因为数字证据被直接用于关联犯罪行为，所以它在起诉网络犯罪中至关重要。在网络犯罪调查期间，确保取证证据在通过监管链（CoC）层级层级移动过程中的完整性、可靠性和可审计性至关重要。随着技术的进步，这些方法可以用于数据安全、提高生产力和降低成本。数据加密技术、哈希处理和使用区块链保护证据的结合，是医疗领域最常用的策略。\n\
  \n## 14.2 文献综述\n\n中本聪（Satoshi Nakamoto）被认为是在 2008 年发明了区块链技术的人或团体。中本聪的开创性工作启发了我们利用区块链来保障电子货币交易\
  \ [1]。\n\n作者 Simson L. Garfinkel 为当前的取证研究提供了一个框架，并断言，为了成功，社会必须采用系统且可扩展的方法来处理信息表述和取证程序。如今，数字取证是调查计算机相关犯罪和获取数字证据的必备工具。这项研究表明，我们正处于“数字取证的黄金时代”\
  \ [2]。\n\nCoronel 等人讨论了如何在客户端管理数字证据，包括识别、收集、可识别证明、选择和分析程序。此外，他们对这些概念在网络取证中如何应用进行了审查，并侧重于客户端\
  \ [3]。\n\nBreitinger 等人讨论了两个主要目的。初始目标是总结调查人员可以使用的所有可用数据集以及如何找到它们。第二个目标是强调共享数据集的必要性，以便研究人员重建该方法以改进预期结果。保护现场、调查证据、记录证据和现场、寻找证据以及重建现场是刑事调查的过程。这些步骤至关重要，但保护和记录证据是重中之重。第一响应人员、法医调查人员、警察人员、法庭专家、受害者和嫌疑人是一些可以与数字证据合作的人员。他们中的每个人都有可能影响证据的内容\
  \ [4]。\n\n根据 Flores 和 Jhumka 的观点，监管链（CoC）根据四个原则进行监控：\n\n1. 不允许内部人员更改原始证据。\n2. 当产生原始数据时，必须提供合理的理由。\n\
  3. 无论审计追踪提交的仲裁性质如何，所有事件都应该产生相同的结论。\n4. 调查负责人必须确保遵守所有这些规则 [5]。\n\nPrayudi 总结了监管链的范围、关注的问题和障碍，并为如何处理监管链提供了方向。司法格式、存储、数据安全保障和存储控制都是处理监管链的方面\
  \ [6]。\n\nSelamat 等人展示了追溯数据。他们讨论了与调查过程相关的痕迹和来源。追溯是一种确定问题来源的技术。它识别了留下的痕迹。这些痕迹被收集和存储，随后进行分析。本文提出了一种追溯模型\
  \ [7]。\n\n一种基于区块链的边缘计算范式已用于数据交换和居家治疗管理。对于分布式系统，该模型采用了网络。区块链被用于存储患者数据 [8]。\n\n区块链有助于维护患者数据的机密性。治疗框架利用区块链技术确保数据属于患者。区块链保护数据的隐私和所有权。治疗元数据存储在区块链上。与此同时，实际数据（如多媒体文件）存储在分布式或中央数据库中。现代社会有许多发明\
  \ [9]。\n\n保护知识产权非常重要；区块链是一种安全存储知识产权的数字账本。在这种情况下，区块链的时间标记功能非常有用。因为作品作者是第一个访问知识产权文档的人，所以区块链用于验证知识产权的所有权。这可以通过追溯区块链中的特定时间戳来实现。区块链还用于涉及知识产权的交易。涉及双方是使用知识产权的人和知识产权的所有者\
  \ [10]。\n\nBeck 等人讨论了可靠的分布式存储系统对于他们在组织关系方面至关重要。经济依赖个人和组织之间的信任来创建和存储重要文件。区块链技术可以应用于许多行业和业务，包括货运行业追踪货物、药品行业追踪药物以及医疗行业等。区块链将使这些行业受益，因为它允许安全地维护记录以及每个组织对资产的合法所有。由于第四次工业革命的影响，区块链的重要性和应用大幅增加\
  \ [11]。\n\n\n\n\n本文的研究重点在于将该技术应用于教育领域。学术界目前正利用区块链技术来追踪学生的成就和证书/学位。区块链存储了学生的兴趣、学习经历和学术信息。这有助于对抗在旧系统中日益严峻的学位造假问题。区块链系统的管理非常复杂。由于其不可篡改性，即使是真实用户也无法更改其数据。此外，任何技术故障都可能导致严重的教育忧虑。\n\
  \n收集数字证据和保护数字证据是犯罪现场调查中最重要的两个因素。每件电子证据都具有肉眼可以识别的物理形式。计算机、手机手机、相机、CD、硬盘和其他电子证据都是电子证据的示例。相比之下，数字证据是从电子证据中恢复或提取的证据。文件、电子邮件、短消息、图像、视频、日志或文本均可被使用。物理和数字犯罪现场调查由几个基本的构建要素组成，例如保护犯罪现场、检查证据和记录现场。[12]。\n\
  \n数字证据的管理和处理是一个耗时的过程。因此，执法机构需要一个系统环境，以便于促进管理和处理数字监管链的实施，从而支持网络犯罪操作的管理和处理。当前系统存在缺陷，可以使用区块链来使其防篡改\
  \ [6]。\n\n## 14.3 问题\n\n1. 医务人员数据泄露：医疗保健行业的员工可以接触大量关于患者的敏感和秘密信息，例如信用卡号和其他财务文件。不可信赖的员工可能会利用患者信息来威胁或勒索患者。\n\
  2. 医疗领域的另一个问题是记录值的丢失。有时，特定特征中的某些值将会缺失。这是因为医生并不总是获取所有必要的实验室测量数据，或者数据已经丢失了。\n3. 健康专业人员和医生不是技术专家；因此，数据集描述和特征名称对于不熟悉医学的人来说可能是难以理解的。\n\
  \n## 14.4 方法论\n\n我们针对医疗保健提出了一种多级共识算法。医疗数据分为患者细节、治疗细节、医院细节和药物细节。数据根据多级共识算法被分为两个级别。第一类：患者和治疗细节更加机密和安全。内容隐藏应在较低水平上，通过私有、许可和隐藏区块链来实现。第二类应该是：药物和医院细节，使用公共和开放区块链。两个级别都应由\
  \ `POA` 共识区块链保护以确保高安全性。\n\n流程：医疗数据可以分类为公共数据和私有数据。权威应该控制网络中的所有信息，以避免网络中出现无关信息。所需数据可以进一步分类，并使用区块链多级共识算法进行加密以防止欺诈。如果细节存储在区块链中，则无法进行任何修改作为证明。药物信息和给予患者的治疗类型也可以，以便进一步调查任何复杂案件。通过使用区块链技术存储的证据可以证明患者的死亡原因。图\
  \ 14.1 描述了医疗数据的处理。\n\n![图 14.1](img/#Ch014.xhtml#cap_lbl0111) 描述了医疗数据的处理。\n\n数字证据的管理和处理是一个耗时的过程。因此，执法机构需要一个系统环境，以便于促进管理和处理数字监管链的实施，从而支持网络犯罪操作的管理和处理。当前系统存在缺陷，可以使用区块链来使其防篡改\
  \ [6]。\n\n多级共识算法：设计了一种混合共识机制，其层次如下：\n\n- 高层：应由 `POA` 保护，因为只有限制的公司才能控制区块链网络。\n- 私有、许可和隐藏区块链：第二类：患者和治疗细节。\n\
  - 公共和开放区块链：第一类：患者和治疗细节（私有和隐藏 (ZKP)）。\n- 公共和开放区块链：第二类：药物和医院细节。\n\n![图 14.1](img/#Ch014.xhtml#cap_lbl0111)\
  \ 描述了医疗数据的处理。\n\n![图 14.1](img/#Ch014.xhtml#cap_lbl0111) 描述了医疗数据的处理。\n\n![图 14.1](img/#Ch014.xhtml#cap_lbl0111)\
  \ 描述了医疗数据的处理。\n\n## 14.5 结论\n\n本研究了一种基于区块链技术的数字证据管理新方法。完整性、透明性、安全性、真实性和可审计性都是区块链融入设计的各个方面。因此，它是维护和追踪法医证据链的最优秀选择之一。所提系统将处理从数字证据恢复到其作为证据提交法庭期间的证据。它将确保证据的完整性、可追溯性、真实性和安全性。它有助于此类数字证据在法庭上的可采性。\n\
  \n## 14.6 未来工作\n\n\n\n\n\n未来的工作是建立一种更有效、更实用的区块链相关共识机制，用于处理和存储整个证据文件。需要隐藏的医疗数据应通过零知识证明进行实现。实施多级和混合模式是进一步可以开展的工作，旨在创新并证明新新的共识算法。这将协助调查人员严谨地处理数字证据，确保数字证据的完整性。在区块链技术下，所有证据都将是安全且未被篡改的。\n\
