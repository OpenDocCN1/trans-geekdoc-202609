  \ Chennai 603203 邮箱: dr2402@srmist.edu.in; kavithas@srmist.edu.in\n\n### 摘要\n成瘾被归类为一种大脑疾病，而非人类的缺陷或决策。世界正处于数字技术的手中，大多数人类工作已委托给机器。虚拟系统被用于访问几乎每一个功能，这导致了虚拟成瘾。随着智能系统的成熟，虚拟成瘾在这一数字环境中不断扩大。深度学习已经在许多情况下经过了探索和应用，并取得了显著成效。因此，这一主题值得进一步研究，以便对后续实施产生益处。深度学习的输入和输出之间存在许多层。每一层可能包含数百个甚至数千个神经元单元。输入和输出之间的层是隐藏层，节点被称为隐藏节点。对网络历史上的人类行为系统进行审计对于缓解虚拟成瘾是必要的，本文提供了一个框架，利用基于角色的访问控制（`RBAC`）和网络取证，通过用户权限协议（`UPA`）跟踪用户定期查看应用程序或网站的时长。本章的主要目标是概述深度学习在预防和管理虚拟成瘾方面的应用。\n\
  \n# 2.1 引言\n越来越多的儿童和青少年倾向于生活在由计算机和电视机主导的虚拟世界中，忽视现实世界的问题。计算机和互联网充其量是过度使用的，最坏则是成瘾性的。根据调查\
  \ \\[1\\]，男性似乎比女性更容易产生网络成瘾（`IA`）。因此，男性和女性在特定的在线消费数据、类别以及相关的网络成瘾方面可能存在差异。\n\n将现有的刺激材料、易于获取、便利性、低成本、视觉刺激、自主性和匿名性相结合，创造了一种高度心理活性的体验。这些技术影响着我们的日常生活和关系。其中一些后果并非完全有利，可能会导致各种不良的心理反应。根据中国互网络信息中心（CNNIC）的调查，网络成瘾是中国青少年最关注的心理健康问题之一，2014\
  \ 年超过 17%的人产生了网络成瘾 \\[2\\]。医疗从业人员和人员利用深度学习来识别数据中的隐藏机会并改善医疗保健。深度学习利用神经网络加速处理并提供更准确的结果，并可能揭示医疗保健数据中以前未发现的可能性和趋势。本章探讨了如何利用深度学习技术来克服网络使用，这被认为是一种主要的虚拟成瘾。\n\
  \n# 2.2 网络成瘾 (IA) 类型\n网络成瘾是指各种与在线、计算机和移动技术相关的行为和冲动控制问题。\n\n### 2.2.1 网络欺凌成瘾\n网络欺凌成瘾是最与人格相关的在线成瘾之一。它包括色情材料、与性相关的色情网站、虚构聊天会和色情视频网站。对其中任何服务的痴迷可能会危及在现实世界中建立真实的性、浪漫或个人联系的能力。\n\
  \n### 2.2.2 网络义务\n网络义务是可能具有高度危害的在线互动习惯，包括网络扑克、金融服务、在线市场和强迫性在线下单。这些行为会对个人的经济稳定产生负面影响，并导致工作场所问题。过度消费或财务损失也会给人际关系带来压力。很容易进入在线赌博网站和组织。\n\
  \n### 2.2.3 空间关系成瘾\n网络或在线连接成瘾者忙于在网上建立和维持关系，经常忽视和忘记现实生活中的家庭和朋友。通常，在线连接是在聊天室或其他社交平台上建立的。\n\
  \n### 2.2.4 对内容的焦虑搜索\n互联网用户可以获得大量的统计信息。他们获取信息的效率可能会变成一种痴迷，为某些人收集和整理数据。这种认知过程也可能是潜在严重的征象。\n\
  \n### 2.2.5 游戏成瘾\n无论是现实还是虚拟设备活动都包含在网络游戏障碍定义中。随着机器变得越来越普及，`Chess`、`Sudoku` 和 `Dig\
  \ Dug` 等应用程序被构建在源代码中。\n\n### 2.2.6 智能手机应用成瘾\n我们被连接手机的视频游戏、程序和数字应用程序所吸引。对社交网络应用、约会应用、短信和消息的成瘾会导致虚拟在线友谊比现实联系更重要。社交媒体成瘾可能受到网络过度问题或行为成瘾的推动，通常被称为“手机恐惧症”。\n\
  \n\n\n\n\n根据图 2.1 的语义程度和研究所需的时间，人类行为分析的层次被分为运动、动作、活动和行为。运动检测、背景提取和分割等任务处于运动”层面。人体运动在“动作”层面被感知和识别，以确定某人正在做什么或正在从事的事情。因此，人类行为分析从这一点开始进行。为了理解人类行为，大量的行为组合在“活动”层面被归类。在“行为”层面，高度语义化的理解至关重要。生活方式、个人习惯、时间表和常规可以在几天到几周内进行研究。在此期间可以发现异常行为和异常情况，例如早期诊断痴呆症\
  \ [4]]。\n\n## 2.4 深度学习与人类行为预测的相关性\n\n深度学习是数据科学的重要部分，因为它支持预测分析，并允许数据科学家快速廉价地收集、组织、分析和理解海量数据。在分析人工智能和深度学习算法观察和预测人类行为的能力后，影响算法输出质量的一个重要因素是训练深度学习模型的数据集数量。数据越多、质量越高，结果就越准确、越可靠。\n\
  \n## 2.5 在线挖掘的形式\n\n图 2.2 所示的在线挖掘形式包括 HTML 页面信息提取、关键词、标准关联元数据和自定义用量监控。\n\n### 2.5.1\
  \ HTML 页面信息提取\n\nHTML 页面信息提取是从是从网站材料、元数据或在线资产中提取关键数据。\n\n\n[图 2.2 在线挖掘的形式 [16]]。\n\
  \n### 2.5.2 普通关联元数据提取\n\n常见关联元数据提取旨在发现支持网络链接架构的模型。该模型基于连接架构，可以包含或排除连接细节。这种方法可以对网站内容进行分类，并提供网站相似性和关系等数据。\n\
  \n### 2.5.3 自定义网页使用监控\n\n自定义网页使用监控旨在分析由网页浏览者的活动或习惯提供的信息。网站信息和结构挖掘利用实际或主要的网页内容。相比之下，自定义使用跟踪使用用户在参与网页时活动的二次收集数据。自定义用量监控数据包括来自网站服务器日志数据、浏览器日志、代理服务器日志、登录详情、注册数据、用户会话（或）支付、cookie、用户查询、缓存数据、按钮点击和导航，以及通过交互获取的任何其他信息\
  \ [7]\n\n各种类型的网络挖掘概述在表 2.1 中。从 HTML 站点提取的信息可能包括内容、超链接，甚至是访问者暗示或提供的属性。常见关联元数据提取也是如此，它可能利用超链接和超链接结构信息。用户信息经常被用于用户建模和智能机器等应用。\n\
  \n## 2.6 网页使用挖掘过程\n\n发现相关的趋势和模式是网页使用挖掘的主要目标之一。此类模式和数据通常可以提供关于公司消费者或系统用户的关键信息。预处理、模式识别和模式分析\
  \ [9]是网页使用挖掘的三个关键阶段。预处理与其他数据挖掘应用一样，涉及数据清洗。\n\nWeb cookie 和用户注册等技术已应用于特定场景。通用的机器学习和数据挖掘技术（如关联规则挖掘、聚类和分类）经常用于模式识别和分析。另一方面，网页使用挖掘应用面临许多问题，其中一个是\
  \ Web 服务器日志数据是匿名的，这导致无法从数据中识别个人和用户会话。\n\n[表 2.1 在线挖掘的形式 [7]]。\n\n| | **HTML 页面信息提取**\
