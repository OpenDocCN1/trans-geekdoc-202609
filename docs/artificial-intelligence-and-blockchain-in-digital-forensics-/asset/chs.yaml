  \n### 2.10.1 数字取证\n\n`digital forensics` 是一种对信息进行识别、收集、检查和评估的技术过程，同时保持数据的质量和一致的可追溯性。\n\
  \n### 2.10.2 网络取证\n\n`network forensics` 识别并分析来自网络的证据。它获取有关用于提取内容的访问点的信息。\n\n###\
  \ 2.10.3 网页取证\n\n在使用`website analytics` 时，可以在订阅者的缓存、短期系统日志、数据库、对话记录、会话记录和缓存中找到证据。\n\
  \n\n图 2.7 取证分类。\n\n### 2.10.4 云端取证\n\n`cloud forensics` 是互联网取证的一种类型，涉及基于云的计算机取证服务。示例包括日志文件、用户活动、安全认证日志、`DBMS\
  \ logs` 以及其他信息资源。\n\n### 2.10.5 移动取证\n\n`cellphone forensics` 是计算机取证的一个分支，也识别来自便携设备的证据。对话记录、短信和设备存储器均被用于编制证据。\n\
  \n### 2.10.6 网页浏览器取证\n\n\n\n\n\n由于许多刑事和民事案件可能基于从用户在线活动中获得的证据，因此网络浏览器取证是计算机取证的关键要素。网络浏览器取证最常用于通过监控某些个人电脑或移动手机上的搜索历史和常规互联网使用情况，检查之前出现过的材料。这还涉及检查服务器日志文件，以获取有关特定机器的正确信息并跟踪网站上的活动。检查人员可能会在浏览器的查看历史、收藏夹、下载、Cookies\
  \ 和缓存中寻找证据 [15]。\n\n## 2.11 浏览器产物\n\n每个浏览器都会在不同的位置保存其文件并赋予它们不同的名称，但大多数情况下它们保存的是相同类型的数据（产物）。让我们看看浏览器保存的最常见的产物。\n\
  \n### 2.11.1 导航历史\n\n用户的导航历史存储在导航历史字段中。它可以用于查看用户是否反复访问某些网站。\n\n### 2.11.2 自动填充数据\n\
  \n浏览器根据你最常搜索的内容建议的数据被称为自动填充数据。它可以与导航历史结合使用，以获取额外的视角。\n\n### 2.11.3 缓存\n\n浏览器在访问网站时会产生各种缓存数据（图像、javascript\
  \ 文件等）以加快加载速度。在取证调查期间，这些缓存文件可能是宝贵的数据源。\n\n### 2.11.4 图标 (Favicons)\n\n图标是在标签、URL\
  \ 和书签中常见的微图标。它们可以用于了解更多关于用户访问过的网站或位置。\n\n### 2.11.5 浏览器会话存储\n\n在浏览器中保存数据的典型方法是会话存储，它允许程序员保存和检索多个变量。它一次只保留一个会话的数据，并在浏览器窗口关闭时删除这些数据。\n\
  \n### 2.11.6 表单数据\n\n输入表单的任何内容经常被浏览器保存，允许浏览器在用户填写表单时推荐之前提交的数据。\n\n## 2.12 网站使用历史分析\n\
  \n网站使用历史分析旨在根据用于提取和处理的几个关键变量集，从日志文件中提取有用信息或知识。一些网站应用网站使用历史研究来识别消费者数据，以及在网站优缺点方面的表现。网络日志挖掘的结果可用于多种目的，包括个性化网页内容交付以及通过预取和缓冲提高用户移动性，从而吸引更多客户\
  \ [6]。人类行为也可以被分析，我们可以确定特定人的虚拟成瘾程度。根据图 2.8，以下任务构成了网络日志挖掘的分解 [7]：\n\n*   第一步是资源发现，涉及检索所需的在线内容。\n\
  *   后续任务是信息选择和准备，从网络源自动挑选和准备特定数据的行为。\n*   通过泛化，在单个网站和跨多个网站自动发现通用模式。\n*   最后，检查挖掘模式的有效性和解释性。\n\
  \n\n\n[图 2.9] 描述了分析模型的工作流。网络使用的图形化分析如图 10 所示。x 轴表示 URL，y 轴表示用户访问特定 URL 的次数。根据下面的分析，我们了解到用户通过地址\
  \ `132.466.8` 频繁访问 `GET D.html HTTP/1.0`。\n\n\n## 2.13 结论\n\n本章旨在对不断扩展的定制化网络使用监控和网络取证领域提供更新的概述。此外，本章澄清了关于“网络挖掘”概念的几个误解。此外，定义了三类网站并分析了它们的关系。在线使用数据的探索和用户偏好的分析是本章的重要部分；深度学习技术被用于改进行为检测。使用深度学习分析网络使用的主要目标是更好地理解网络使用并实施它以避免虚拟成瘾。`LSTM`\
  \ 神经网络是处理序列数据或时间序列问题最先进的设计之一。`LSTM` 学习连续数据集之间的长期连接，并在虚拟诊断中表现出持续的有效性。\n\n## 2.14\
