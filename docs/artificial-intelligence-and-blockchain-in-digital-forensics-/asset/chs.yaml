  \ integrity? In Proceedings of the 32nd International Conference on Information\
  \ Interfaces, 429–434, 2010 年。\n\n# 15 基于区块链的身份管理系统\n\n**摘要** 大数据的收集、存储和分析已成为应对网络犯罪和建立法律案件极其重要的解决方案，由于过去二十年信息技术的进步，数字身份已变得日益重要。身份管理解决方案在现实应用中常见，旨在便于管理身份。近期出现了基于区块链的访问控制，使个人能够控制自己的身份。数字取证是收集、分析、存储和报告数字证据的法律技术。这种证据对于调查至关重要，因为它描述了黑客的场景和疑似犯罪活动。因此，必须谨慎处理获取的证据，以确保其在调查和法庭程序中的性，并防止篡改。目前的研究已转向区块链技术，以提高此类身份管理的透明度、不可篡改性和审计性。在本章中，我们创建了一个具体的基于区块链的认证和授权框架。还提供了\
  \ Hyperledger Composer 的概念证明，并对其效率进行了评估。\n\n\n\n\n\n数字取证调查通过研究 `DIM` 中执行的 `DI` 交易，来识别并验证与犯罪相关的嫌疑人身份。在取证调查中验证的身份可以作为法庭上的证据，用于证明嫌疑人的有罪或无罪。`DIM`\
  \ 的设计充分考虑了追溯到犯罪责任人的身份。数字取证负责通过适当的证据无无误地识别参与犯罪的人员。本章探讨了各种身份管理技术，这些技术借助区块链技术保护用户的身份\
  \ [2]。当 `DIM` 的设计目标是以最小成本缩短取证调查的处理时间时，该 `DIM` 被认为是取证的。此外，`DIM` 中存在的 `DIs` 的表示方式在维持证据可信性的同时，便于调查。\n\
  \n## 15.1.2 数字取证\n\n数字取证是取证调查中一个有趣的分支，负责处理与计算机/移动犯罪相关的数字证据。数字取证涉及的过程包括对犯罪相关的数字内容进行恢复、调查、检查和分析\
  \ [3–5]。它通常用于民事或刑事法庭，以支持或反驳任何实体提出的假设。它也常用于企业或私人部门，以确保安全策略的合规。\n\n数字取证通常分为网络取证、计算机取证、移动取证和数据数据分析。所有这些取证调查通常包含以下流程：\n\
  \n* 电子证据的提取\n* 证据的镜像（取证复制）\n* 证据分析\n* 生成取证报告。\n\n### 15.1.2.1 数字取证的用途\n\n数字取证有多种用途，如下所示：\n\
  \n* 识别犯罪中的直接证据\n* 识别支持犯罪中嫌疑人的证据\n* 确认嫌疑人的陈述或不在不在场证明\n* 揭示犯罪意图\n* 揭示犯罪来源\n* 验证并认证与犯罪相关的文档内容。\n\
  \n## 15.1.3 区块链技术\n\n区块链是一种以块的形式存储数字信息的技术。块链接在一起形成一条链，使得块的内容无法更改 [6]。这导致块具有防篡改性。块链在网络所有用户之间共享，从而创建了一个数字信息的共享数据库。块的内容通过挖矿过程进行验证并添加到现有的链中。共享数据库也被称为分布式账本。\n\
  \n## 15.2 DIM 中的区块链\n\n传统的 `DIM` 是不安全的，因为它维护在一个没有关联的孤立框架中。碎片化的 `DIM` 更容易受到任何试图在实施数字犯罪时抹除足迹的攻击者的篡改。为了确保作为法庭证据的\
  \ `DIM` 的可信度，可以使用区块链支持的 `DIM` [7-10]。区块链有助于以互操作的统一方式安全地存储和维护数字身份。\n\n基于区块链的身份管理具有优势处，原因如下：\n\
  \n* 解决无法访问的问题\n* 保护用户身份\n* 防止或检测欺诈身份。\n\n去中心化标识符 (`DID`) 是使用区块链进行数字身份管理最常用的框架。区块链用于为用户创建数字身份，包含以下模块：\n\
  \n* 去中心化标识符\n* 身份管理\n* 嵌入加密。\n\n### 15.2.1 去中心化标识符 (DID)\n\n`DID` 是分配给实体（人、公司、物体等）的伪匿名标识符。当实体注册创建\
  \ `DID` 时，会连同身份一起生成一对私钥和公钥。`DID` 与公钥一起存储在现有的区块链中 [11]。`DIM` 可以选择在区块链中与公钥存储实体的额外信息。私钥永远不会存储在区块链中以确保数据的完整性。实体使用私钥来验证\
  \ `DID` 的所有权。然而，实体可以持有的 `DID` 数量没有限制。一个人或实体可以在多个平台上持有一个或多个 `DID`。通过每个 `DID` 对其他\
  \ `DID` 的证明，实现了所有 `DID` 的完整性链。证明针对实体的年龄、性别和 ID 等特征属性 [12–13]。凭证在获得发行者的加密签名后由其所有者存储。公钥和私钥对的使用确保了\
  \ `DID` 的安全性，并将用户的身份与其行为紧密联系在一起。\n\n## 15.3 DID 的用例\n\n去中心化标识符在 `DIMs` 中用于以下目的之一：\n\
  \n* 自主身份\n* 数据变现\n* 数据可迁移性。\n\n### 15.3.1 身份主身份 (SSI)\n\n`SSI` 是一个框架模型，允许实体在自己的设备上存储身份数据，并控制需要向验证者提供哪些数据\
  \ [14]。该系统将身份数据的存储从中央仓库移动到用户的本地设备，使其与外界完全隔离。\n\n### 15.3.2 数据变现\n\n拥有 `DID` 的实体可以用身份数据交换经济利益，不仅是为了验证访问控制机制，还用于机器学习算法、在线广告等各种目的。\n\
  \n### 15.3.3 数据可迁移性\n\n数据可迁移性允许实体无缝地将身份数据从一个控制器转移到另一个。数据所有者有权选择控制器，并在此类转换时，完全消除了向新控制器验证身份数据的必要性。通过\
  \ `DID`，在控制器之间的切换变得简单，用户可以拥有重复使用的凭证。\n\n## 15.4 DID 的优势\n\n基于区块链的去中心化标识符创建具有以下优势：\n\
  \n* 去中心化公钥基础设施\n* 去中心化存储\n* 可管理性和控制。\n\n### 15.4.1 去中心化公钥基础设施 (DPKI)\n\n`DPKI` 是基于区块链的\
  \ `DIM` 所需的基础模型，用于将私钥分给身份所有者。私钥需要在安全的防篡改网络中传输给所有者以确保其完整性 [15]。当用户创建 `DID` 时，会生成公钥和私钥对。公钥以防篡改的方式添加到现有的区块链中。私钥由所有者持有。公钥纳入公共区块链使得无需任何认证机构的数字证书即可验证身份。\n\
  \n### 15.4.2 去中心化存储\n\n\n\n\n与将身份数据存储在单个远程服务器相比，创建并挂钩到区块链上的身份在某些时更安全。在区块链中，身份数据通过\
  \ `DPKI` 分布，通常存储在所有者的移动手机、笔记本电脑等设备上 [16]]。通过星际文件系统可以存储去中心化的身份数据。当身份以去中心化的方式存储时，实体未经授权访问中央服务器上身份的能力就被消除了。\n\
  \n### 15.4.3 可管理性与控制\n\n传统的身份管理系统将身份数据存储在中央服务器中。它认为身份发布者负责提供安全性。在支持区块链的身份管理系统中，身份的用户或所有者负责安全措施。用户可以通过实施必要的安全技术，或将安全需求外包给数字银行金库、密码管理应用等第三方应用来选择自己的安全机制。\n\
  \n## 15.5 区块链与数字取证\n\n识别、保护、收集和展示数字证据使其适用于法律案件的技术过程被称为数字取证。在现实中，从数字技术中存储或检索的任何信息都可以被视为电子证据，可以在数字取证调查过程中进行分析。因为任何取证检查的目标都是保证产生的数字证据在法庭上是可以接受的，因此保持证据的完整性是整个调查过程中必须维持的关键标准。建立和维持保护数字数据时间历史的过程被称为监管链（`CoC`）\
  \ [17–19]]。为了防止 `CoC` 在未经许可的情况下被篡改或破坏，极端谨慎至关重要。`CoC` 的最终目标是证明怀疑信息足以支持指控的犯罪，而不是被错误放置。数字取证检查需要遵循行业标准、适用法规和组织政策的定义方法。尽管取证调查人员采用各种工具和技术，但调查过程通常涉及组织、收集、保护、检查和展示。\n\
  \n### 15.5.1 Hyperledger composer\n\nHyperledger 既是一个框架，也是一个快速创建区块链应用的开源开发工具包。Hyperledger\
  \ Composer 使设计和部署区块链用例的过程变得变得简单得多，缩短了开发周期。Hyperledger Composer 的主要优势是它是完全开源的，其通信和组织架构允许任何人为开发做出贡献。它支持可重配置的区块链共识协议，这将确保所有交易都经过验证和认证。Hyperledger\
  \ Caliper 是一个多阶段开发工具 [20]]。第一阶段是准备阶段，在此期间通过安装去中心化应用来设置测试环境。第二阶段是测试实施阶段，在此期间赋予客户端任务以执行基于交易数量或长度的特定测试用例。最后阶段是性能评估阶段，收集所有的测试结果以生成报告。图\
  \ 15.1 显示了 hyperledger composer 中的流程。\n\n### 15.5.2 安全取证模型\n\n（注：原文文本在此处存在大量重复和内容混合，已根据要求处理唯一内容部分。）\n\
  \n\n\n\n## 2. 证据维护\n\n证据转移函数接受证据 ID 和一个地址作为输入，并将所有权传输给给定的地址。该函数首先确定是否已提供证据，并且证据的所有者是调用该函数员。证据显示方法接受证据\
  \ ID 作为输入，并从区块链中提供证据数据。该函数的唯一目的是确保证据确实存在。建议的取证链范式基于 Hyperledger Composer，这是一种许可制的比特币\
  \ 协议，运行在由财团或单一组织监管的受监管环境中。因此，有关证明的信息仅对由财团组织控制的管理员允许的区块链参与者可用。通过使用 `Hyperledger fabric/composer`\
  \ 中的 `channel`，个人可以以安全的方式传输信息。\n\n## 3. 证据删除\n\n证据删除方法接受证据 ID 并从取证链中擦除与其关联的证据。它首先确定证据是否存在，以及激活删除的成员是否为证据的作者；如果是，则从区块链中移除该信息条目。证据是取证链概念中的一个属性；因此，证据删除方法会从资源数据库中删除相关的证据。当信息对于待调查的问题不再具有适用性或可靠性时，这种操作是必要的。没有人可以擦除实际证据，但任何人都可以提交交易，表明某条信息不再适用于案件。\n\
  \n### 15.5.2.3 区块链网络\n\n区块链技术是一种允许客户访问账本和加密协议服务的技术结构 [26]。。智能合约主要用于产生操作，这些操作将传输到网络中的每个对等节点，并在它们各自的区块链副本上进行不可篡的记录。\n\
  \n#### A. 区块链的关键组件\n\n*   **智能合约：** 智能合约是存储在网络上的规则集合，通过自动执行来加速操作。智能合约可以指定企业债务转移的要求，以及旅行保险的支付条款\
  \ [27]。\n*   **分布式账本：** 分布式账本及其不可更改的交易记录对网络中的所有参与者均可用。现在交易仅在该公共账本上记录一次，避免了传统企业网络中常见的重复工作。\n\
  *   **不可篡记录：** 一旦交易记录在公共账本上，没有任何用户可以编辑或干预它。如果在交易记录中发现错误，必须进行新的交易来纠正错误，并且这两个操作都必须是可用的。\n\
  \n### 15.5.2.4 安全存储\n\n区块链可以位多种方式用于共享存储软件中。\n\n*   将信息拆分为可管理的部分。\n*   对信息进行加密，使得只有你可以访问它。\n\
  *   将文件分散到网络中，以便即使部分网络不可用，所有文件也是可用的。\n\n每个片段都会复制，以防止在链路故障时发生意外丢失。文件还用加密密钥进行加密，使得其他网络节点难以查看。复制的片段由去中心化节点分散到全球。交互存储在区块链账本中，允许网络验证并同步跨区块链枢纽的活动。区块链存储系统旨在无限跟踪这些交互，且数据永远无法更改\
  \ [28]。。在此过程中复制的海量信息导致了数据过剩。云存储也对其数据中心需要企业级技术。由于这些特性，集中数据存储的成本可能比区块链信息存储高得多。除了上述改进之外，在数十唯一节点之间存储数据可以提高区块链存储的安全性。如果文件被加密并分布在去中心化网络上，黑客访问数据将变得更加困难。没有负责文件访问或解码数据所需密钥的中央权威。用户对私钥拥有完全控制权，使得第三方在实践上难以获取信息。进一步的共享防止了每个节点看到整个文件的内容，从而产生了更高的机密性。数字取证调查的主要安全特性在表\
  \ 15.1 中指定。\n\n表 15.1 安全需求。\n\n| 安全编号 | 安全特性 | 说明 |\n| :--- | :--- | :--- |\n| 1\
  \ | 可追溯性 | 因为每个操作都记录在不可更改的账本中，所以操作可以被追踪。 |\n| 2 | 身份验证 | 使用这些技术时，所有个人应被授权。 |\n|\
  \ 3 | 安全性 | 适当的操作者可以验证交易。 |\n| 4 | 可验证性 | 这种验证可以实时进行。 |\n| 5 | 不否认性 | 每项活动都可能与其源相关联，确保高水平。\
  \ |\n| 6 | 完整性 | 因为使用了哈希值，数据无法被操纵或损坏。 |\n\n## 15.6 性能评估\n\n可以使用以下参数对提出的方法的性能进行分析。\n\
  \n*   吞吐量\n*   延迟\n*   CPU 利用率\n*   内存利用率\n*   Gas。\n\n### 15.6.1 吞吐量\n\n每秒添加到区块链的节点数量被用于计算此项指标。区块链的吞吐量描述为单位时间内的交易数\
  \ [29]。它由所使用的共识机制决定，该机制描述了网络如何交互以确认交易的合法性以及它们在公共账本上的版本完整性。图 15.3 描绘了不同方法的吞吐量分析。\n\
  \n$\\text{Throughput} = \\frac{Tota1numberoftransactions}{Tota1timeforinteractiveness}$(15.1)\n\
  \n### 15.6.2 延迟\n\n从交易开始到交易被包含在区块链之间的时间被称为延迟或交易延迟。区块添加和共识延迟的总和就是交易延迟。图 15.4 描绘了不同方法的延迟分析。\n\
  \n$\\text{Latency} = \\text{Block latency} + \\text{consensus time of that block}(15.2)\n\
  \n### 15.6.3 CPU 利用率\n\n实时应用中 CPU 的使用为服务的效率提供了见解。该使用率以百分比形式表示，表示为了相对于特定参数分析区块链时使用了多少比例的\
  \ CPU 处理单元(图 15.5)。\n\n\n\n\n\n### 15.6.4 内存利用\n\n实时应用中的内存使用情况提供了服务效率的洞察（图 15.6）。该使用率以百分比表示，说明相对于特定参数分析区块链时使用了多少系统内存\
  \ [30]。\n\n![图 15.5 资源利用。](img/fig00093.jpg)\n\n**图 15.5** 资源利用。\n\n### 15.6.5 Gas\n\
  \n以太坊网络上的每笔交易或联盟链都需要 Gas。它是以太坊代币形式存在的，用于补偿矿工在区块链上验证交易的服务费用。Gas 的量与帧的大小以及交易的数量成比例。\n\
  \n## 15.7 总结\n\n真实性、可责性、透明性、可扩展性、密码保护和秘密性都包含在区块链技术中。因此，它展现了前景，并成为改进物联网领域数字取证调查的可行选择。工业\
  \ 4.0 中连接设备数量不断增加，带来了攻击范围和威胁不断扩大风险。此前已经进行了一些研究工作，但每项研究都有自己的局限性。本章为物联网中的数字取证操作提供了答案。在区块链中使用区块链提供验证方法是一个新想法，并在解决方案中进行了尝试。使用智能合约收集取证数据。延迟、吞吐量、Gas\
  \ 消耗、能量和资源使用均已评估，并执行且分析了故障点。后续工作的目标是创建一个完全高效的最终集成系统，用于存储数字信息并维护监管链，该系统获得共享数据和公共区块链的支持。\n\
