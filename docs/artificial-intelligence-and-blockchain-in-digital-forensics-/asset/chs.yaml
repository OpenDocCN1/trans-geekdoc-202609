  ## 13.6 结论\n\n本文探讨了如何利用基于区块链的技术来处理如电子取证安全、用户数据权利和数据完整性等问题。在吞吐量和延迟方面，研究了区块链网络负载对\
  \ `Ethereum` 平台的影响。实验表明，所提的保护法医证据记录的区块链技术优于传统的法医系统。为了加强数字取证系统，我们希望在未来集成基于 SDN 的网络取证以及云端取证。\n\
