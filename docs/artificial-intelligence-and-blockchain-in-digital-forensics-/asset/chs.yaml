  \n# 8 虚拟成瘾对无受害者犯罪现场调查的自我破坏性影响\n\nV. Sabapathi1, 和 J. Selvin Peter2\n\n### 摘要\n由于海量数据交换和智能手机广泛使用，基于虚拟成瘾的活动分析具有挑战性。现实情况是，智能手机是每个人使用的具有多种益处的动态活动平台，人们对其产生了高度依赖。手机中存储了大量的个人数据，利用日志功能和其他关键词存储和映射方法可以预测用户行为。黑客可以通过检查行为模式来解码信息并造成破坏。然而，这属于第三方攻击；我们讨论的是影响网络犯罪的如虚拟成瘾等自我破坏性行为。本研究的主要目标是检查多种成瘾如何影响人类认知，并通过智能手机、虚拟现实游戏和电视等基于虚拟媒体的成瘾性使用损害个人健康。这种虚拟消费与情感连接、人类习惯形成和强制性成瘾行为密切相关。该研究的主要见解是虚拟成瘾是自我破坏性的，导致了许多无受害者犯罪。原始研究假设是，在调查过度成瘾行为时，发现非法活动可能导致自我破坏性行为，如自杀、金钱和财产损失、生理和行为上的负面认知、焦虑、紧张和缺乏自尊。\n\
  \n[1]: 研究生，计算机科学与工程系，SRM 科学技术学院, Kattankulathur, Chennai-603 203\n[2]: 副教授，计算机科学与工程系，SRM\
  \ 科学技术学院, Kattankulathur, Chennai-603 203 邮箱：`selvinpj@srmist.edu.in`\n\n\n\n\n\n\
  本研究的灵感来自于数字平台的快速兴起，这导致了与成瘾相关的自我破坏性行为和无受害者犯罪。此外，开发认知范式以提高对成瘾行为担忧的意识至关重要，因为在认知模型开发方面，人工智能已在各种智能医疗系统中产生了重要影响。几十年来，多种精神疾病影响了人类的认知过程。随着智能手机技术的演进，由于智能手机多种功能的变得日益必要，世界已变得更多地处于虚拟连接而非直接交流。然而，人们陷入了使用智能手机的泥潭，对其产生了虚拟依赖。根据先前的研究，多种虚拟相关的精神疾病已被定义，例如`nomophobia`（手机恐惧症）。`nomophobia`是一种心理疾病，被定义为在没有手机时感到不适。\n\
  \n此外，还识别出了多种负面认知疾病，如精神分裂症、单极抑郁症和双极情感症。与此同时，智能手机的使用继续变成一种成瘾。这类认知疾病会导致学习表现不佳、注意力集中以及自尊心低。由于智能手机的广泛使用，出现了诸如`阿尔茨海默病`等多种认知疾病。根据许多研究，手机恐惧症和智能手机成瘾与共症有关。进食障碍、强迫症、抑郁症和其他行为成瘾疾病（赌博、强迫购物等）都是行为成瘾障碍的例子\
  \ [1––2]。(1)无法交流、(2)失去连接、(3)无法获取信息和(4)放弃便利的担忧都得到了验证 [3]。不交流的体验呼应了即时通信的丧失以及无法设备进行即时通信的能力。身体上孤独但在互联网上社交活跃是有吸引力的。由于平台的多元化，人们越来越依赖虚拟系统。虚拟系统不仅限于智能手机，还扩展到多种设备和电子设备，如`虚拟现实游戏`和电视。然而，这类输入在认知上促使重复使用。这种与成瘾相关的障碍导致了多种网络犯罪。\n\
  \n## 8.2 相关研究\n\n关于一个人是否依赖特定物质仍存在争议。考虑到事物性质的复杂性，对强迫行为做出判断需要意识。正如之前的研究所示，目前还没有被广泛接受的情境衡量标准。根据观察研究，社交恐惧症患者通过移动设备或电脑进行通信来避免直接社交接触\
  \ [4––5]。还发现社交焦虑与抑郁症有高度共病性，它经常出现在不符合诊断标准的抑郁症患者中 [6]。估计美国超过 90%的儿童和青少年玩视频游戏，有相当数量的人花费越来越多的时间在游戏上\
  \ [7––8]。游戏行业在 2020 年创造了 1550 亿美元的收入。分析师估计，该行业到 2025 年将获得超过 2600 亿美元的收入 [9]。不应假设游戏本身具有破坏性。另一方面，视频游戏可能满足用户的某些心理需求，例如身份表达、精任感和成就感，以及逃避现实的需求。\n\
  \n尽管具有一些积极的含义，过度游戏会导致各种负面后果（例如，经济损失，因为在线游戏经常需要钱才能继续玩；心理脱离、睡眠剥夺、饮食和营养问题、缺乏个人和社交互动、抑郁症和焦虑[18]）。抑郁、焦虑、冲动、自我调节能力差、学业挑战、社交参与有限以及缺乏家庭互动都是过度使用智能手机的副作用[18––20]。智能手机使用的增加还与身体活动减少、久坐行为增加、睡眠中断以及各种身体问题（脖子僵硬、视力模糊等）有关[21]。\n\
  \n## 8.3 认知智能在成瘾预测中的作用\n（注：源文件中第 8.3 节提供的文本不完整，但根据可用内容应用了结构。）\n\n\n\n\n多种基于虚拟的成瘾行为会导致自毁性障碍。这种自毁性行为主要影响认知系统，并导致抑郁症和手机恐惧症等精神疾病。然而，这种与成瘾相关的障碍允许对自毁性特征产生多种直接和间接的攻击。认知智能根据对个人报告的自我分析，为自毁性行为的阶段提供了分类。这需要被解决，因为它有助于预测适当的分析。\n\
  \n### 8.3.1 自我分析输入\n\n动态背景和多种形式的成瘾行为导致了执行者不同的特征。由于虚拟应用程序的消费多样性和使用强度在执行者的行为中是动态的，因此对他们执行相似行为的规模进行分析有基本要求。根据输入的准确性，可以有效获得适当的结果、治疗和预测措施。\n\
  \n### 8.3.2 认知智能\n\n认知智能对人类的自毁性行为提供了实用的分析和决策。根据自我分析报告的输入，认知智能可以预测个人的破坏水平，因为认知智能可以分析基于认知的障碍，并帮助人们意识到自己的自毁性行为。此外，许多虚拟和无受害者犯罪可以通过认知智能来解决，并支持预测自毁性行为\
  \ [24]。\n\n### 8.3.3 症状有效性测试\n\n症状有效性测试识别危险区域或正常区域的行为。此外，还需要对更多无受害者犯罪进行分析，以诊断破坏性行为的症状。症状有效性测试有效有助于防止破坏性行为。然而，症状用于识别初始阶段破坏性行为的程度。认知智能系统可以识别这一点。根据症状，可以对物质或相关的行为障碍进行症状有效性测试的跟踪\
  \ [25]。\n\n### 8.3.4 咨询与医疗辅助\n\n认知智能和症状测试可以帮助防止破坏性行为。然而，在达到严重成瘾之前，可以通过咨询和医疗辅助来帮助自毁性行为。认知分析和治疗需要多个社会伙伴，如父母、老师和医疗治疗。此外，我们可以根据自残（作为一种无受害者犯罪和认知障碍的后果）来分析破坏性行为和认知破坏。\n\
  \n### 8.3.5 自毁性行为\n\n存在多种成因因素，成瘾的形成如图图 8.2](#Ch08.xhtml#cap_lbl0072) 所示。虚拟成瘾的危险部分导致身体和心理健康的丧失。此外，已有记录由于多种游戏和赌博成瘾行为导致的自杀倾向。因此，我们根据自毁性行为讨论游戏、赌博、社交媒体和电子商务等成瘾背景。\n\
  \n![图 8.2 自毁性行为的产生与形成](img/fig00051.jpg)\n\n图 8.2 自毁性行为的产生与形成。\n\n## 8.4 自毁性行为的成因\n\
  \n多种因素直接和间接地影响成瘾。之前的研究揭示了导致成瘾的多种因素。我们发现这些因素中的重要影响因素是：\n\n- 同伴压力\n- 媒体广告\n- 家庭\n\n\
  ### 8.4.1 同伴压力\n\n虚拟成瘾的危险部分导致身体和心理健康的丧失。此外，已有记录由于多种游戏和赌博成瘾行为导致的自杀倾向。因此，我们根据自毁性行为讨论游戏、赌博、社交媒体和电子商务等成瘾背景。\n\
  \n### 8.4.2 媒体广告\n\n多种因素直接和间接地影响成瘾。之前的研究揭示了导致成瘾的多种因素。我们发现这些因素中的重要影响因素是：\n\n- 同伴压力\n\
  - 媒体广告\n- 家庭\n\n### 8.4.3 家庭\n\n认知智能和症状测试可以帮助防止破坏性行为。然而，在达到严重成瘾之前，可以通过咨询和医疗辅助来帮助自毁性行为。认知分析和治疗需要多个社会伙伴，如父母、老师和医疗治疗。\n\
  \n### 8.4.4 持续成瘾的背景\n\n由于虚拟应用程序的消费多样性和使用强度在执行者的行为中是动态的，因此对他们执行相似行为的规模进行分析有基本要求。根据输入的准确性，可以有效获得适当的结果、治疗和预测措施。\n\
  \n### 8.4.5 内部信号\n\n认知智能对人类的自毁性行为提供了实用的分析和决策。根据自我分析报告的输入，认知智能可以预测个人的破坏水平，因为认知智能可以分析基于认知的障碍，并帮助人们意识到自己的自毁性行为。\n\
  \n### 8.4.6 认知奖励\n\n认知智能对人类的自毁性行为提供了实用的分析和决策。根据自我分析报告的输入，认知智能可以预测个人的破坏水平，因为认知智能可以分析基于认知的障碍，并帮助人们意识到自己的自毁性行为。\n\
  \n## 8.5 无受害者成瘾犯罪\n\n许多无受害者犯罪已被识别，以及智能手机和虚拟成瘾行为，例如自杀倾向、性骚扰刺激和财务及身体健康损失。无受害者犯罪直接影响这些执行者，间接影响他们的社会。通过基于虚拟平台的成瘾已识别出多种自毁性行为，如图\
  \ 8.4](#Ch08.xhtml#cap_lbl0074) 所示。\n\n![图 8.4 虚拟成瘾的示例](img/fig00053.jpg)\n\n图 8.4\
  \ 虚拟成瘾的示例。\n\n### 8.5.1 游戏成瘾\n\n\n\n\n多种渠道（直接和间接）鼓励了游戏探索，例如同伴压力、媒体广告、社会和家庭。在过去的几十年里，多种虚拟游戏应用让人们及其家人通过在线群组游戏应用共同游戏。由于虚拟应用积分的奖励，大多数玩家经常花时间在虚拟模式中。大脑受到信号刺激，促使他们毫不思索地访问这些应用程序。然而，游戏是一种娱乐，但在极端情况下，在游戏上花费大量时间会让它演变成一种危险的武器。\n\
  \n### 8.5.2 自杀企图犯罪\n\n多种虚拟游戏应用导致了许多情感冲击，例如生活中的不安全感，并引发他们花费更多的注意金钱来使用这些应用程序。由于游戏应用具有吸引人的视觉和虚拟设计，用户经常使用这些应用，并毫无思考地想要玩下一关游戏。例如，在过去的几十年里，记录了许多在玩“蓝鲸”游戏应用时的自杀尝试。与自杀企图类似，多种自残也是认知性的，例如抑郁、焦虑和自信心下降。\n\
  \n### 8.5.3 社交媒体成瘾\n\n在数字时代，有许多用于社交交流的论坛，如 `Facebook`、`Instagram`、`Twitter` 等。这些论坛使用多功能设施的问题在于，它们让使用户反复检查通知并经常使用这些应用。例如，经常在\
  \ `Facebook` 上上传视频和照片，在社交媒体上探索事物，并经常检查社交媒体以查看订阅和共享内容的浏览量。\n\n这使得用户关注他人的寻求关注，并导致了糟糕的口头交流和现实世界社交互动的缺乏。由于虚拟成瘾建立在社交媒体之上，寻求他人认可会导致多种直接和间接的负面心理疾病，如单极抑郁和双极性抑郁。\n\
  \n### 8.5.4 赌博成瘾\n\n数字游戏数量的增加了不可避免的后果 [26]。多种游戏应用导致了赌博成瘾之路，因为娱乐提供了一个付费后玩的机制，用户可以在虚拟世界中输掉这些游戏。赌博应用间接导致玩家财务损失，而奖励和内部暗示通过最初提供微小的认可来刺激，最终将其变为具有财务特征的“无受害者犯罪”。\n\
  \n赌博成瘾导致玩家失去意识。心理疾病、决策以及自我分析的复杂且见的过程导致玩家陷入风险。然而，心理疾病也会影响身体健康。高财务特征导致玩家失去财富、自我伤害，并间接影响他人。在线游戏成瘾（OGA）已经在上升，并产生了严重的后果，包括忽视家庭责任、失业、健康并发症、犯罪，甚至可能死亡\
  \ [27-28](#Ch08.xhtml#ref0215)]。\n\n### 8.5.5 电商成瘾\n\n多种电子商务营销网站倾向于设计成吸引人并使客户经常购买其产品。这种电子商务应用通过在其显示屏幕上通知显示的产品来吸引客户。奖励提供的折扣在认知上刺激客户成为常客。\n\
  \n电子商务成瘾可以使买家经常购买，因为成瘾会导致财务损失。电子商务成瘾使使用户产生强迫性购买，甚至是购买不需要的东西。每件产品、食物和服务都让使用户产生更多的依赖。这些模型更加复杂，但在极端成瘾情况下，会导致大量的财务和心理损失。\n\
  \n## 8.6 虚拟成瘾犯罪\n\n由于成瘾，人际和内在技能被破坏了，因为成瘾导致了对生活其他方面的忘记或隐藏，例如教育、关系和自律。极端程度的成瘾导致意识缺失，并减少了自我分析和建立执行正常活动的内部信号的时间。\n\
  \n图 8.5 说明了基于成瘾行为的无受害者犯罪的后果。负面情绪、自杀念头、低自尊、失眠、专注学习能力下降以及心理健康稳定性的丧失诱发。\n\n![图 8.5\
  \ 无受害者自我破坏性成瘾行为的影响。](img/fig00054.jpg)\n\n图 8.5 无受害者自我破坏性成瘾行为的影响。\n\n这些认知平衡状态为直接和间接攻击和攻击者创造了背景。虚拟成瘾根据消费行为的数量引发认知强迫和渴望。然而，在进入危险区域之前，必须通过基于认知计算的应用采取预测措施。因此，一种基于人工智能的认知系统具有有效准确预测结果的潜力。此外，许多虚拟活动刺激了多种基于自残的疾病，这些疾病可能是无受害者犯罪。法医调查小组在寻找虚拟犯罪方面面临挑战，因为大多数虚拟犯罪是无受害者的。然而，任何如自残和对他人的伤害都会被视为犯罪。在这种背景下，我们的研究工作已经演进，具有无受害者犯罪识别能力的认知智能对于让数字和虚拟世界意识到无受害者犯罪至关重要。\n\
  \n## 8.7 局限性与未来方向\n\n讨论了几种展示物理保健系统和实施的文献。然而，在情感和生理认知护理处理领域仍需要许多调查。我们的研究重点是认知心理无受害者犯罪，这在当的数字系统评估中极其重要。我们的研究将继续投入于开发用于心理保健管理的认知模型，以及基于精神和心理关注的自我破坏行为预防。\n\
  \n研究和自然智能解释以及心理稳定性中的心理连接应作为认知障碍的预处理评估。然而，迫切需要用于认知成瘾模式中自我分析的心理自我测量策略。\n\n## 8.8 结论\n\
  \n基于自我破坏行为的虚拟成瘾导致了多种无受害者犯罪。认知智能提供了一个用于验证症状以防止成瘾危险区域的模型。这种分析模型对行为者的成瘾状态自我分析变得更有益。认知保健和智能系统在高水平上支持成瘾预测。我们在本章中检查了基于成瘾的无受害者犯罪，以及认知智能在开发作为成瘾感知系统的症状有效性测试模型方面。\n\
  \n\n\n\n\n智能手机中计算技术的广泛使用使用户进入了虚拟世界。虚拟平台的多个功能使用户能够持续地接触这些技术。然而，这些设备使得用户对这些应用程序和服务的依赖性加深。此外，智能手机使用量的增加是多种认知影响障碍的根源，这会导致自残行为，并结果间接伤害他人；虚拟认知成瘾会导致用户在成瘾阶段表现出多种特质。这种成瘾演变成了一种自我破坏性行为。\n\
