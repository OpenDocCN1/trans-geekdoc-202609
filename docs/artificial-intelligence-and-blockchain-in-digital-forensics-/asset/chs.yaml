  \ of Engineering, Trichy)\n\n### 摘要\n\n日益使用社交网络和短信服务的女性和儿童构成了威胁，保护儿童已变得迫切。需要有效的机器学习技术来解决这个问题。该问题可以通过文本数据表示。所提方法采用机器学习（ML）保护儿童免受侵害。机器学习（ML）已成功应用于人工分析；但尚无文献显示机器学习如何有助于数字取证。我们的论文重点关注……\n\
  \n# 3.1 引言\n\n网络捕食者对日益使用社交网络与陌生人的女性和儿童构成了威胁。Madigan 等（2018）发现，每十个青少年中有一人收到过不受欢迎的邀请。父母可以监控孩子社交媒体的使用，但由于网络环境及其使用方式之多，这并非易事。监控可以通过安装多种软件工具来观察行为。示例包括\
  \ [2, 3, 4]: FlexiSPY (2019)、Easemon Inc. (2019) 和 Cocospy (2019)。然而，这些监控工具通过检查记录的数据并在发送不受欢迎词汇时发出报警，这变成了一种静态分析方法。这些工具没有使用自然语言处理（NLP），而这有助于理解对话的语义，并增加了父母手动识别捕食者的负担。\n\
  \n从心理角度来看，捕食者的定义包含两个重要组成 [11]: *年龄不平等* 和 *不当关系*。前者取决于各国执行的法律以及儿童与成人的心理水平对比。后者涉及成年人与孩子建立关系的态度，这种关系通常涉及隐藏和公开的情色言论。Olson,\
  \ Daggs, Ellevold & Rogers (2007) 提出了一种基础心理学理论，用于识别在线通信中的捕食者。他们首先尝试接触受害者，通过诱导和情感脑使受害者接受色情骚扰，最后维持这种攻击性关系。\n\
  \n\n\n\n\n在线平台是捕食者识别受害者的来源。之后，他们通过监控捕食者试图让儿童对不当关系脱敏的行为来区分目标。最后，第三步涉及对儿童进行显性的色情剥削。此时，需要一种可靠的在线捕食者识别（OPI）系统来执行法律，防止捕食者接触受害者。\n\
  \n### 3.1.1 OPI 问题定义\n\n文本分析算法擅长识别捕食者以执行法律，并在过去的几十年里已用于自动化的在线捕食者识别。这些算法能够处理大量的聊天日志。这些文本挖掘算法需要解决的两个重要问题是：\n\
  \n![图 3.1 OPI、文本挖掘、模式分类与犯罪心理之间的关系](img/fig00015.jpg)\n\n图 3.1 OPI、文本挖掘、模式分类与犯罪心理之间的关系。\n\
  1. 识别捕食者\n2. 遍历并分析捕食者的非法活动。\n\n为了识别捕食者，可以对聊天进行预处理，并对其模式进行分类以找出犯罪犯的心理（图 3.1）。为了识别捕食者的活动，可以使用图挖掘技术。\n\
  \n文献 \\[28, 29\\]对用于识别捕食者的文本挖掘与模式分类算法的结合进行了详细综述。对聊天中的文本进行分析，并根据所有 OPI 对模式进行分类，如图\
  \ 3.1](#Ch03.xhtml#cap_lbl0015) 所示。图 3.2 展示了在 OPI 中使用的各种技术及其关联的插图版本。\n\n\n![图 3.2\
  \ OPI 中使用的数据挖掘技术及其关系](img/fig00016.jpg)\n\n图 3.2 OPI 中使用的数据挖掘技术及其关系。\n\n针对对话比例增加的解决方案是通过将问题分为两个阶段提供的。第一阶段组织可分离文本的含义，并将其以流水线方式传递到第二阶段以对整个讨论进行分类。可分离文本的摘要从第一阶段传递到第二阶段，以支持对整个讨论的高效分类。第一阶段使用五个文本的框架，其中包括单个消息的局部含义。然后这些信息被传递到第二阶段，第二阶段再检查整个对话中潜在攻击者说的任何文本。\n\
  \n## 3.2 文献综述\n\n几乎所有现有方法都采用深度学习技术来检测捕食性文本。现有研究始于 PJ Foundation 2019 一组志愿者创建的一一转录\
  \ \\[5\\]，他们在聊天室中假装成受害者以诱捕捕食者。他们的研究帮助揭示了约 630 名网络捕食者，与捕食者的对话被记录并作为数据库提供给研究社区。多项研究探索了该数据库\
  \ \\[6\\]的语言属性。Inches 和 Crestani, 2012b \\[8\\] 和 Inches 和 Crestani, 2012c \\[9\\\
  ] 描述了国际性性捕食者识别竞赛 PAN 2012 工作讨会的细节，催化了对该问题的意识，其中 PAN 2012 转录是使用 PJ 数据集、Omegle 聊天和修改为人与人刺激聊天的\
  \ IRC 日志生成的。\n\n在文献中，发现作者使用了各种机器学习技术。支持向量机 \\[7, 11, 12, 13, 14, 15, 16, 和 17\\\
  ]为识别捕食者产生了合理结果。同样，决策树 \\[10, 14, 15, 13, 17, 18, 19, 20, 和 22\\]、k-近邻、逻辑回归、最大熵和多层感知器（MLP`）神经网络在将捕食者从普通人中分类方面产生了合理结果。提出了一种基于规则的启发式方法\
  \ \\[19, 20\\]，其效果优于监督学习方法。文献中讨论的方法需要对代表聊的特征进行详细描述。捕食者所说文本的集合是形成词汇的来源，这些词汇预计指示聊天意图。上述方法遵循了攻击者通常实施的语音中单实体和双体的词汇结构。词汇结构的几个样本包括无意识动词计数（例如\
  \ `kiss`、`suck`）和重构动词计数（例如 `impart`、`rehearsal`） \\[19, 20\\]。其他作者 \\[21\\]使用了将词汇与智力和敏感状态连接的语言学调查和词频计数（PIWC）结构。一些方法使用聊天/通信结构来描述整个对话的原型属性，例如参与聊天的总人数、聊天持续时间\
  \ \\[22\\]、捕食者发起的次数以及捕食者提出的问题 \\[23\\]。\n\n### 3.2.1 网络捕食者意图分类\n\n\n\n\n\nO’Connell\
  \ \\[24\\]将捕食者通过在线社交媒体与儿童进行对话的目的是分为五类：建立友谊、将友谊扩大为关系、威胁评估、独特性，以及最后的色情行为。Olson \\\
  [25\\]将该分类简化为三类，包括指导、隔离和策略。研究人员 \\[20\\]提出了一种名为 `ChatCoder2` 的网络捕食者工具的分类法，该工具通过对规则采用启发式方法，并根据其分组对对话进行分类。这些词汇被放置在下文提到的任何一类别中。我们也遵循相同的方法生成了用于训练的标记数据集。\n\
  \n通过对话获取个人事实 (I)：这一类可能涉及对个人信息的查询，如年龄、性别、居住地或工作地、朋友和兴趣。这是网络捕食者与孩子建立信任关联的关键。\n\n-\
  \ `Mentoring` (II)：这一类使用色情术语，无论对话内容如何。网络捕食者通常擅长在色情对话中安抚孩子。\n- `Attitude` (III)：这一类解释了网络捕食者将如何收集信息来约受害者见面，或让他们对他人保持关系的保密。\n\
  - `Non-predatory` (IV)：这一类包括不属于上述任何一类别的负面信息。\n\n## 3.3 系统架构\n\n所提的方法如图图 3.3 所示，分为两个阶段。初始阶段是“聊天分类”，将来自潜在捕食者的每条聊天按意图进行分类。下一阶段是“聊天分类”，评估来自潜在攻击者的完整聊天内容，以确定预期的攻击者是否为捕食者。它采用上一阶段的标签，而不分析整个对话序列，从而缩短了处理时间。\n\
  \n### 3.3.1 聊天分类\n\n![图 3.3 总体结构。](img/fig00017.jpg)\n\n图 3.3 总体结构。\n\n在聊天分类阶段，对话中来自预期攻击者的每条文本都根据对话的意图进行分类。聊天与类别之间的映射模式在此阶段进行训练。为了准确理解聊的意图，需要分析聊天中的词汇以及对话中之前的聊天。由于我们处理的是自然语言，所有聊天都必须转换为适合训练的向量形式。在此阶段，一种方法是表示消息含义，另一种方法是关联消息上下文的影响。\n\
  \n所提的方法采用使用 `TensorFlow` 的通用句子编码（Universal Sentence Encoding），通过长短期记忆 (`LSTM`）模型实现每个词之间的相关性。消息向量通过通用句子编码器（Cer\
  \ et al., 2018a）的聊天编码生成。这些方法（Mikolov et al., 2013）可以捕捉单个词的含义，但由于没有考虑文本中词汇的顺序，会遗漏信息传达的感。\n\
  \n编码后，消息的含义不仅取决于当前的词汇，还取决于导致它的情况。即使上下文具有相似的陈述，它们的含义也可能不同。例如，“给我打电话（Call me）”这段文本可以是任何亲密伙伴之间的聊天。在另一种情况下，它可能是攻击者用来约他或约她的话。仅凭这段文本很难找到确切的含义或人的意图，这种情况非常麻烦。在对消息分类时，所提的方法考虑了窗口中的前四条文本，将文本纳入考虑，即五条消息的窗口。\n\
  \n![图 3.4 聊天标记结构。](img/fig00018.jpg)\n\n图 3.4 聊天标记结构。\n\n所提的聊天分类训练模型的流程在图 3.4 中所示。网络输入层接收五条消息窗口作为输入，加上末尾待分类的消息，以生成\
  \ `512` 向量输入。它们构成了后续 `LSTM` 以及后续全连接层的输入。\n\n![图 3.5 聊天对话结构。](img/fig00019.jpg)\n\
  \n图 3.5 聊天对话结构。\n\n### 3.3.2 聊天分类\n\n第一阶段产生聊天类别的标签，产生一系列带标记的语句。这些语句的标签被用作聊天分类的输入。第二阶段聊天分类的流程图图\
  \ 3.5 所示。聊天标签的顺序被追加，以使输入长度一致。然而，被添加的标签不被视为标签。我们的网络中有一个掩码层来忽略填充。此外，所提的方法通过 `LSTM`\
  \ 和全连接层进行训练和分类。\n\n## 3.4 实验\n\n所提的方法包含两个阶段。第一阶段通过精确率和召回率评估聊天标记阶段。最后阶段对一组对话的标记和分类阶段进行评估。\n\
  \n表 3.1 用于评估聊天分类（第一阶段）的数据集。\n\n| 使用的数据集 | 数量 |\n| --- | --- |\n| 考虑的聊天数量 | 120 |\n\
  | 总讨论次数 | 5008 |\n| 类别 I 中的讨论次数 | 3120 |\n| 类别 II 中的讨论次数 | 626 |\n| 类别 III 中的讨论次数\
  \ | 626 |\n| 类别 IV 中的讨论次数 | 626 |\n\n### 3.4.1 数据集\n\n为了评估消息标记阶段的第一组结果，所提方法使用了来自\
  \ `ChatCoder2` \\[20\\]和 `PAN2012` \\[8, 9\\]的聊天日志数据。`ChatCoder2`提供了来自 Perverted-Justice\
  \ (PJ) 网站的聊天 \\[5\\]。`ChatCoder2`数据集包含所有的捕食性对话，而 `PAN2012` 数据集结合了捕食性和非捕食性对话。`ChatCoder2`\
  \ 是一种调查工具，自动对每条消息进行意图分类标记（'I', 'II', 'III', 和 'IV'）。`ChatCoder2` 被自动用于自动分类每次对话中的消息。我们从两个数据库中提取了大约\
  \ 5000 条消息用于训练和测试。\n\n\n\n\n\n所提方法的目标是在所有捕食性意图类别（II、III 和 IV）中使用相同数量的消息，即在 `ChatCoder2`\
  \ 数据集的每种类型消息中大约有 600 条。为了保持平衡，从 `ChatCoder2` 数据集中选取了相同数量的非捕食性意图（I）消息。该数量的选择是为了维持每种意图的平衡，而且这也是我们剩余消息的显著数量。这个数字也是\
  \ `ChatCoder2` 数据集中每类消息的极少数量。从 `ChatCoder2` 数据集中选取了 2504（626 × 4）条消息。所提方法被认为是一种有偏的的分类，因为所有的真负句都将取自\
  \ `ChatCoder2` 数据集中的真正对话。出于这个原因，我们还从另一个数据集中选取了另一组约 2000 条非捕食性消息。\n\n对于评估，使用了 `PAN2012`\
  \ 数据集进行训练和测试。所考虑的对话应至少包含 150 条消息。聊天标注生成了一个标注顺序，并作为流水线输入用于聊天分类。Table 3.2 描述了用于评估我们分类的数据集的特征。\n\
  \n### 表 3.2](#Ch03.xhtml#bck_cap_lbl0021) 用于评估聊天分类的数据集（阶段 2）。\n\n| 总数据集 | 数量 |\n\
  | --- | --- |\n| 讨论数量 | 475 |\n| 捕食性讨论 | 130 |\n| 非捕食性讨论 | 350 |\n| 用于评估的聊天数量 |\
  \ 78120 |\n\n### 表 3.3](#Ch03.xhtml#bck_cap_lbl0022) 聊天标注性能（阶段 1）。\n\n| | 标签 | I\
  \ | II | III | IV |\n| --- | --- | --- | --- | --- | --- |\n| **训练** | 精率 | 0.931\
  \ | 0.764 | 0.735 | 0.685 |\n| | 召回率 | 0.912 | 0.782 | 0.799 | 0.658 |\n| **测试**\
  \ | 精率 | 0.916 | 0.778 | 0.734 | 0.681 |\n| | 召回率 | 0.926 | 0.781 | 0.791 | 0.648\
  \ |\n\n### 表 3.4](#Ch03.xhtml#bck_cap_lbl0023) PAN 2012 消息在每个类别下的数量。\n\n| 标签 | I\
  \ | II | III | IV |\n| --- | --- | --- | --- | --- |\n| 总聊天 | 59142 | 7060 | 6262\
  \ | 5666 |\n\n#### 3.4.2 阶段 1 结果：聊天标注\n第一阶段聊天标注分离了每个文本，并对其是否为色情聊天提供了标签。每个聊天的性能指标所示所示\
  \ Table 3.3。该模型构建在频率为 `2.3 GHz` 的 `Intel Xeon CPU` 和 `Google Colab` 内的 `Tesla K80`\
  \ 上。神经网络使用 `15 epochs` 来训练模型，并使用 `80-20` 的训练和测试数据集。训练模型大约需要一分钟，句子嵌入需要半分钟。\n\n####\
  \ 3.4.3 阶段 2 结果：聊天分类\n在阶段 2：聊天分类中，评估基于阶段 1：聊天标注。从训练模型中，PAN212 数据集中每个类别的数值所示 Table\
  \ 3.4。它展示了正性（捕食性）和负性（非捕食性）消息中各种聊天标签的分布。聊天训练序列的上限固定为 `200`，任何小于该数值的输入都将附加通配符。神经网络以\
  \ `32` 的批次大小运行 `15 epochs`。所提方法遵循 `80-20` 规则进行训练和测试模型，这分别包含了来自数据集的 `384` 条和 `96`\
  \ 条消息。\n\n### 表 3.5](#Ch03.xhtml#bck_cap_lbl0024) 分类性能。\n\n| | 实际 |\n| --- | ---\
  \ |\n| 预测 | 捕食性 | 非捕食性 |\n| 捕食性 | 29 | 3 |\n| 非捕食性 | 2 | 62 |\n\n所提模型的性能指标所示 Table\
  \ 3.5。模型具有极好的精率；F1 分数和 F0.5 分数所提方法的性能与 8、9 以及 20 使用 `PAN2012` 和 `ChatCoder2` 数据集进行了比较。其召回率，误报数量较少。\n\
  \n## 3.5 结论\n所提方法提供了一种通过分类对话来检测捕食性对话的方法。所提方法首先分离消息，对它们进行标注，然后对整个 `ChatCoder2` 文本进行分类。结果显示，所提方法在召回率方面优于其他方法，这可能导致部分捕食者未被检测到。\n\
