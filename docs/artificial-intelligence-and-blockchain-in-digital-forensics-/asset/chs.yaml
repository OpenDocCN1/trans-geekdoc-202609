  \ 12.8 展示了恐怖网络结构的犯罪调查。\n\n尽管此类分析至关重要，但目前的数字取证工具（包括商业性和开源工具）都无法进行完整的分析。另一方面，许多研究项目正在开展，以逐案回答这一需求，重点关注特定的事件和情况。\n\
