  \ Appl. 60, C (Jan. 2016), 19–31. [/content]\n\n# **10** **基于区块链的数字取证：基础视角**\n\n\
  **R.** **Biswas, and** **S.** **Biswas**\n\n**摘要** Blockchain technologies have\
  \ come a long way as far as smart healthcare is concerned, and has been slowly entering\
  \ other realms of modern technologies. Of late, smart forensics, or more appropriately,\
  \ digital forensics, has come under the influence of blockchain technology. Being\
  \ endowed with decentralization properties, it has become an excellent match as\
  \ far as integrity and attributes towards the collection of evidence of digital\
  \ forensics is concerned. Accordingly, this chapter discusses a fundamental overview\
  \ of blockchain-based digital forensics. This will be followed by a discussion of\
  \ special features such as digital forensics incident response, a chain of custody\
  \ in the context of the IoT forensic chain. We further aim to include practical\
  \ implementations, with future recommendations.\n\n## **10.1** **引言**\n\n\n\n\n\
  物联网（IoT）已人类文明的多个方面展现了其存在。能够处理海量数据并以最有效的方式进行后续处理，物联网已成为现代计算不可缺的一部分，跨越了电信、汽车及其他行业等多个领域。众所周知，物联网能够降低运营和维护成本。然而，其他因素阻碍了它的充分利用[1–5]]。众所周知，物联网的特点是大量的传感器节点，每个节点都通过各种设备连接。因此，产生了海量待计算/处理的数据，导致了网络空间的复杂性。在发生如拒绝服务（DOS）等意外事件时，我们可以依靠数据访问领域的另一项技术发展，即区块链技术（BCT）。在管理数字证人（DW）时，BCT\
  \ 可以产生巨大的益处，推动尖端数字取证与事件响应（DFIR）的演进[6–15]]。与物联网同步，BCT 可以促进对网络犯罪的高效调查。随着物联网设备产生的日志的出现，重建犯罪现场变得更加容易。然而，如果我们有一个监管链（CC）来监控和维护审判期间发生事件的年代顺序，那么数据的完整性和可采性就可以得到有效执行。在在线监管链的帮助下，可以防止欺诈、滥用和数据伪造[12–20]]。基于区块链的取证示意图见于图\
  \ 10.1]。考虑到所有这些因素，本章概述了 BCT 的特征，这些特征有助于构建高效的 DFIR。从物联网特征到 DFIR 的基础，本文广泛讨论了 BCT 的实现。此外，还概述了监管链，它有助于在审判期间对数字证人/证据进行按顺序记录，并对持续使用\
  \ BCT 以增强其健壮性提供了进一步的见解。我们还强调了这些系统的实际应用和未来建议。\n\n![图 10.1 基于区块链的取证示意图。](img/fig0060.jpg)\n\
  \n图 10.1 基于区块链的取证示意图。\n\n## 10.2 物联网取证\n\n年来物联网技术的使用呈指数级增长。物联网智能设备现在已进入了涵盖交通、医疗、汽车等多个部署领域。因此，物联网技术的激增导致了许多方面的漏洞，引发了网络犯罪[5–15]]。物联网中的威胁和攻击正以惊人的速度增长。危及物联网的主要威胁包括恶意用户、外部攻击者、不良程序等。同样，物联网攻击包括欺骗、隐私泄露、节点篡改、拒绝服务、分布式拒绝服务等。\n\
  \n这需要一种新的调查方法，此时事件响应、数字取证或事件取证的角色应运而生。在物联网背景下设计数字取证有几种方法。在这里，我们可以提到调查前准备和随后的部署物联网取证的实时方法作为主要方法。前者指的是事件发生前的必要组件作为就绪状态，要求准备、收集和评估；就绪对应于管理。同样，后者涵盖了与物联网设备相关的自动化或意识性调查，以有效管理传感器节点/设备的多样性。下一节将涉及数字取证与事件响应（DFIR）的基础知识，并结合\
  \ BCT[18–25]]。\n\n## 10.3 事件响应\n\n如所示，事件响应考虑了发生事件后的所有补充措施。换句话说，响应事件而进行的活动可以归类为事件响应。它的特点是易于访问的警报，随后是问题的解决。在开发事件响应方法时需要考虑特定的措施。假设客户是企业安全人员，事件响应可能会涵盖以下目标[4–17]：\n\
  \n*   防止不协调的\n*   确认或排除事件发生\n*   收集准确信息\n*   对证据进行适当检索和监督\n*   严格遵守法律政策\n*   确保对业务和网络产生的干扰最小\n\
  *   提供准确信息和性建议\n*   快速评估和封锁\n\n![图 10.2 DFIR 系统的能力。](img/fig0061.jpg)\n\n图 10.2\
  \ DFIR 系统的能力。\n\n现在，让我们定义一个重要术语：数字取证。它属于计算机取证的一个分支，通过检查由个人或企业实施或通过各种恶意网络攻击实施的可能数字组件进行适当审查。数字取证技术解决方案帮助客户支持\
  \ DFIR 运营。图 10.2 显示了我们从 DFIR 解决方案中期待的一些能力。所示，DFIR 系统需要配备这些能力。收集多方面的数据至关重要。当我们说多方面时，指的是由各种传感器节点、设备或各种系统产生的数据。同样，维护系统透明度是\
  \ DFIR 应具备的另一个增值点。这确保了操作和管理功能从每个角度可见。这可能导致 DFIR 系统的其他能力，即高效调查。在这种情况下，效率意味着完整性和合规性。一旦完成调查，DFIR\
  \ 必须能够审慎地报告。这可以通过强大的表达/可视化来实现。此外，DFIR 还应该参与迭代过程，这些过程应该是自动的。目标是支持协作人员快速探索所有证物实例。在平稳运行时，DFIR\
  \ 对中、大型企业都有益处。在评估和降低风险时，必须理解 DFIR 所包含的阶段，如下文所示[25–36]。图 10.3 阐明了与 DFIR 和区块链相关的元素。\n\
  \n\n\n\n\n1. **准备 (Preparation)**：企业通过响应式事件经理支持的高效策略和平台软件，做好管理事件响应的准备。\n2. **识别\
  \ (Identification)**：在第二阶段，会对事件进行适当诊断，例如攻击类型和涉及的风险。\n3. **遏制 (Containment)**：这是事件响应的另一个重要阶段。检测到攻击后，事件经理的后续任务是遏制，以避免扩散到其他关键组件。\n\
  4. **补救 (Redressal)**：一旦发现并遏制问题，下一阶段是通过采用取证分析找到问题的最佳解决方案。\n5. **恢复 (Recovery)**：在服务恢复后，企业将坚持这一事件响应（IR）阶段，确保对其进行持续监控和评估。\n\
  6. **广播 (Broadcasting)**：通过这一阶段，指定的事件经理向利益相关者、终端用户和公众更新事件情况。换句话说，这确保了事件响应对外部的透明。\n\
  \n## 10.4 监管链 (Chain of Custody)\n\n监管链（`CC`）是安全措施中一个非常关重要的参数。它指的是对电子证据进行系统性的维护，涵盖了保管、控制、传输和检查。`CC`\
  \ 处理了对应调查以及随后向法庭提交证据的风险阶段。数字证据的保留者必须妥善保管，因为任何手段的篡改都会导致该证据在法庭审判期间失效 [3]。此外，`CC` 涉及保护、包装、运输、存储和清单等组装步骤\
  \ [4]。图 10.4 展示了与监管链相关的框图。\n\n在 `CC` 中，一旦收集了数字证据，应不惜一切代价避免篡改。应为收集的证据确保一个防篡的安全位置，以消除对数据篡改的恐惧，从而便于在法庭上出示而无担心丢失证据。`CC`\
  \ 在识别证据的位置、源头和创建者方面非常有益。此外，它还能提供所用设备的特征。所有这些通过证据引导出的与犯罪相关的线索以及随后的响应调整，为高效调查铺平了道路。正如所述，在\
  \ `CC` 开始时，保持数字证据防篡改是困难的。在这里，`blockchain` 成了救星。收集的证据被上传到 `BC` 中，作为分布式账本存储，保持其真实性完整。每个区块都用哈希值或值进行加密。任何修改尝试都会直接处于监控之下，使整个过程变得非常安全。在审判期间，`CC`\
  \ 有完整的渲染以及相应的证明 [15-25](#Ch010.xhtml#ref0270)]。\n\n![图 10.4 监管链的框图。](img/fig00063.jpg)\n\
  \n图 10.4 监管链的框图。\n\n![图 10.5 基于区块链的监管链流程图。](img/fig00064.jpg)\n\n图 10.5 基于区块链的监管链流程图。\n\
  \n图 10.5 展示了制定有效监管链的连续步骤。主要阶段是数字证据的汇。这可能涵盖从 DNA 分析仪的输出、视听资料、文本或图像到 IoT 设备创建的日志。所有这些都有助于形成时间线。随后是将这些数字证人上传到网络/云服务器，确保案件文件的存储。相应地，创建了\
  \ `URLs`。然后执行这些 `URLs` 的提取，以形成一个 `hash` 以便提交到 `BC`。与 `hash` 同时，`timestamp` 也嵌入了提取的\
  \ `URLs` 中，并最终存储在相应的区块中。`timestamp` 是真实性的标记，因为它有助于获取上传数字证据的实际时间。如果发生篡改，将导致链断裂，从而警报安全违规。在最后阶段，强制执行\
  \ `proof-of-work`，通过对已存在的区块进行重新哈希（rehashing）与当前信息进行交叉引用，确保 `BC` 的完整性。所有这些意味着在 `BC`\
  \ 的帮助下，可以理性地实施 `CC` [20-35](#Ch010.xhtml#ref0280)]。用户友好的方法使其更容易访问，同时概述了其透明性。完整性和真实性都可以通过为用户发放唯一身份标识来维持。区块通过的最终挖矿使得整个\
  \ `CC` 过程变得安全且防篡改。\n\n### 10.4.1 挑战\n\n随着数据量的日益巨大，`CC` 面临着灵活性降低和记录方面的挑战。在生成 `CC`\
  \ 的过程中，证据很有可能从一方流向另一方。此外，要求 `CC` 在审判期间处理这些情况。总而言之，`CC` 应该能够提供与案件相关的所有信息。同时，对于 `CC`\
  \ 提供有关证据收集程序的信息辅助源位置也是至关重要的。这将有助于陪审团成员和其他执法人员更好地理解案件。表 10.1 列出了区块链在数字取证中的一些优点和缺点。\n\
  \n表 10.1 数字取证中的区块链。\n\n| **优点** | **缺点/挑战** |\n| :--- | :--- |\n| 防篡改特性使证据易于追溯 |\
  \ 由于跨边界以及众多利益相关者遵守其当地规则和治理，可能会产生法律、监管和程序方面的挑战 |\n| 作为去中心化系统，区块链具备更好的安全性 | 存在由于数据传输到数字设备而导致丢失个人信息的社会挑战\
  \ |\n| 基于区块链的取证比传统系统具有更好的机密性，因为仅向授权用户提供访问 | 存在涉及多个节点产生的海量数据（即大数据）的技术挑战 |\n| 得益于不可修改的哈希函数形式的加密，从而确保了整体完整性\
  \ | |\n\n\n\n\n\nMahmud 和 Rahman [6]\\] 展示了一种基于 BC 框架的智能手机应用程序的实际应用，该应用能够处理音频剪辑中的心跳信号。生成的\
  \ `python` 脚本通过 `BigchainBC` 帮助实现了绝对点数据的完整性。他们通过虚拟私有网络实验演示了该应用，使患者和医生参与其中，并符合《通用数据保护条例》(GDPR)\
  \ 的规定。这种操作可能会对基于 BC 的数字取证产生深远影响，从而增强安全性、降低成本等。同样，Lone 等人 2019 年 [5\\] 构思了一种基于 BC\
  \ 的数字取证 CC（监管链/取证链）。他们展示了基于 `Hyperledger Composer` 的原型实现并测试了其效率。观察发现，预期的实现实现了稳健的吞吐量和资源的最利用。根据他们的报告，可以进一步针对端到端加密进行优化。同样，Lone\
  \ 和 Mir 2017 年 [7\\] 提出了一种 BC 框架的想法，该框架可以为取证适配铺路，实现谨慎的集成和防篡。根据他们的主张，所提出的框架在事件追溯、具有透明审计追踪的防欺、获取、存储、验证等方面可能具有优势。随着不断的发展和进步，基于\
  \ BC 的数字取证已慢慢渗透到不同的实施领域。此外，基于 BC 的数字取证使用了 `Encase 7.5` 和 `Autopsy Media Viewer`\
  \ 等高级软件/工具。此外，还有一个使用（进行中）`blockhub` 来评估不可信环境的实例。\n\n从讨论中可以看出，BC 在数字取证中的应用正在逐渐演进并达到新的高度。然而，随着更多技术的进步，BC\
  \ 完全可能利用其独特属性彻底改变其他显著的新兴领域。在撇开挑战不谈，未来的一个突出的方向是 BC 与边缘设备及云计算的协同融合。通过将大数据分析与 BC 同步整合，可以有效应对\
  \ BC 在处理海量数据时面临的挑战。得益于匿名性、防篡改和可追溯性，区块链可以增强基于可解释 AI 的系统，以应对更多的数据泄露并更好地解决复杂问题。\n\n\
  ## 10.6 结语\n\n总结来说，本章概述了与数字取证相关的方面。从 IoT 取证开始，强调了数字取证和事件响应的基础知识。我们看到，如果将 BC 协同整合到其中，DFIR\
  \ 将变得非常有效。然而，确保端点的安全性是一项真正的挑战。端点意味着一个节点的终止，随后另一个节点的启动。在确保这些端点的完全安全方面存在着真正的挑战，且这种挑战随着数据量的增加而增大。我们看到，BC\
  \ 的部署能够更有效地处理调查和随后的审判程序。不仅如此，事件的时间顺序也使得所有这些取证工作通过监管链（chain of custody）得到了更好的强调。此外，作为数字证人的\
  \ IoT 智能设备提供了与事件相关的关键信息，尽管 IoT 设备受制于其传感能力。这要求严格谨采用 CC，以保证 IoT 设备生成的数据的可信性。然而，在将这些\
  \ IoT 设备分配为数字证人的角色之前，还需要对它们的标准化进行更多研究。显而易见，BC 润滑了 CC 的整个过程，包括安全性、完整性和透明度。此外，冲突的减少和信任的建立是\
  \ BC 技术的另一项成就。\n\n## 10.7 致谢\n\n作者感谢编辑提供撰写本章的机会。作者还感谢 DST-FIST 对特兹普尔大学物理系提供的支持。\n\
