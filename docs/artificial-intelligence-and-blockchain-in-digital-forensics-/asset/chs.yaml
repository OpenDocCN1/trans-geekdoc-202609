  \n### 2.2.2 社交媒体网站\n\n社交网站易于操作和使用。目前有 33 亿社交媒体用户，取证证据，他们可以花费 33 分钟。社交网络平台已成为非法活动的温床[35][36]。调查人员教导如何收集社交媒体和移动取证应用[37][38]。\n\
  \n在过去的几年中，社交网络通信发生了巨大变化。2018 年 9 月和 10 月使用社交媒体的人比去年增加了 3.2 亿。每秒有 50 万新的社交网络成员。通过\
  \ WhatsApp 和 Facebook Messenger 每天发送 600 亿条消息。\n\n\n\n\n\n社交媒体最早的形态之一是讨论论坛，它们为市场研究提供了理想的平台\
  \ [[45]]。它们提供关于各种话题的信息和讨论。可以使用该服务发现、讨论和交流新闻、信息和观点。`Reddit`、`Quora` 和 `Digg` 就是一些例子。\n\
  \n### 书签和内容策划网络\n\n用户可以研究和讨论当前事件和媒体 [[46]]。对于乐于接受新思想和知识的人来说，这些平台是创新中心。\n\n*   用途：发现新颖和热门的信息及媒体，并对其进行保存、交易和讨论。\n\
  \n### 消费者评论网络\n\n用户可以在消费者评论网络上分享他们对产品、服务、品牌、地点及任何其他事物的想法和经验 [[47]]。\n\n*   用途：通过研究、评价和分享信息及观点，来了解企业、餐厅、产品、服务、旅游目的地和其他话题。`Yelp`、`Zomato`\
  \ 和 `TripAdvisor` 是其中的代表例子。\n\n### 匿名社交网络\n\n顾如其义，这些社交网络允许用户匿名发布材料 [[48]]。因此，犯罪分子越来越多地转向此类论坛进行网络欺凌。他们利用它在偷听对话、他人表达自我、聊天和辱骂他人时保持匿名。一些例子包括\
  \ `Whisper`、`Ask.fm` 和 `After School`。\n\n### 博客和发布网络\n\n得益于博客/发布网络，我们有了一个发布在线内容的平台，这些网络能够实现简单的发现、辩论和分享\
  \ [[49]]。发布平台可以是像 `Blogger` 这样的博客，也可以是像 `Tumblr` 这样的微博。它可以像 `Medium` 那样具有互动性。利用互联网发布、探索和评论素材。`WordPress`、`Tumblr`\
  \ 和 `Medium` 是著名的平台。\n\n### 共享经济网络\n\n“协作经济网络”是它的另一种说法。人们利用这些网络在 `Internet` 上进行广告\
  \ [[50]][[51]]、寻找、分享、交易、购买和出售物品及服务。这是在线搜索、广告、分享和交易商品和服务的一种方式。几个例子包括 `Airbnb`、`Uber`\
  \ 和 `Task Rabbit`。\n\n### 12.2.3 社交媒体犯罪\n\n在本节中，我们将详细介绍各种类型的社交媒体犯罪。在这里我们重点关注六类：网络钓鱼、照片编辑、在线约会诈骗、网络欺凌和链接诱饵。例如，尽管社交媒体网站有严格的法律，`Facebook`\
  \ 仍有约 2.7 亿非法账户。受攻击配置的信息已被黑客访问、操纵并利用于各种恶意目的 [[52]]。在这些平台上，跟踪、欺凌、诽谤以及传播非法或色情材料均属于不道德行为的范例。下面列出了一些社交媒体犯罪的例子。[图\
  \ 12]。\n\n#### 网络钓鱼\n\n受害者收到一个链接，鼓励他们打开账户。该链接将受害者重定向到一个假的落地页，他们在那里被要求输入账户凭据。受害者迅速点击嵌入链接，这带他进入\
  \ `Twitter` 或 `Facebook` 账户登录页面。在受害者提交账户信息后，网络犯罪分子获得了密码并完全控制了账户。\n\n#### 照片编辑\n\n\
  图像可以被转换。根据法医数据，变形的照片数量约为 2.7 亿张 [[53]] [[54]]。这是由于社交媒体的原因。\n\n```\n受害者收到一个链接。\n\
  Images/0007.jpg\n```\nFigure12.6\n\n#### 在线约会诈骗\n\n骗子使用虚身份和照片与受害者互动。在关系初期，他们发送卡片等礼物并要求财务援助\
  \ [[55]][[56]]。\n\n#### 网络欺凌\n\n在网上发送或发布令人厌恶或尴尬的评论及内容，以及发出暴力犯罪的威胁，都是网络欺凌的例子。它涉及发送或传播有关他人的贬低或虚假信息以进行侮辱和诽谤。冒充者通过\
  \ `Facebook` 和 `WhatsApp` 等社交媒体网站传播致命的“蓝鲸挑战”和“莫莫挑战”。\n\n#### 链接诱饵\n\n网络犯罪分子使用导出的图像并创建链接\
  \ [[57]][[58]]。导出的图像包含如“您的电子邮件账户中了一千万美元”等信息。创建的链接被传给受害者。\n\n```\nFigure12.6\n\n\
  ```\n\n\n\n\n识别电子存储证据的重要参与者和位置是分析数字取证的第一步。在识别过程中，必须与用户进行明确沟通。应尽可能对初始范围进行精确界定。然而，情况并非总是如此\
  \ [65]]。此处列出了取证时涉及的人员、内容、时间以及可能的地点和原因。以下项目必须包含在文档和通信中：\n\n*   取证重点\n*   问题的总体性质\n\
  *   事件链的时间范围\n*   逻辑数据或被删除的数据片段\n*   信息泄露\n*   关键词。\n\n让我们逐一解释：\n\n### 取证重点\n在开始数字取证检查之前，必须确定行动范围。谁是关键的利益相关者和保管人？为了收集证据，访问哪个潜在电子证据源最佳？获取这些信息有许多原因，包括：\n\
  \n*   确保不遗漏可能影响案件的必要证据。\n*   允许预估成本，并调整案件范围以满足实际需求。\n\n因此，后期确定的可能来源会对成本增加产生影响。\n\
  \n### 问题的总体性质\n客户列表被视为有价值的知识产权（IP） [66]，也是许多法律冲突的对象。理解情况的整体性质至关重要。这是一个遗嘱、信托还是商业计划？\n\
  \n通过理解事项的性质，取证人员可以确定应该寻找什么数据或文件类型，以及这些数据可能在哪里找到。团队成员行为不当、公司信息盗窃、欺诈和离婚只是其中的例子。\n\n\
  ### 事件链的时间范围\n涉嫌事件发生的时间日期（或一段日期范围）有助于缩小检查范围。涉及员工行为不当时，员工最后一次工作是什么时候？员工最后一次使用或归还公司设备是什么时候？\n\
  \n在此类及类似案例中，请克制进入员工电脑的冲动，因为这将抹除潜在的证据，特别是时间戳。\n\n### 逻辑数据或被删除的数据片段\n逻辑数据是指未删除的数据，可以在不需要数据恢复或特殊工具的情况下访问。确定取证中应包含哪些类型的材料，例如\
  \ Word 文档、Excel 表格、Acrobat PDF 文件、照片和电子邮件。根据情况，可能需要调查 Snapchat、WhatsApp、Facebook\
  \ 和 YouTube 等社交媒体平台[67]。\n\n粉碎机是一个空的回收站或垃圾容器。可以通过被删除的数据和清除的网络记录识别出隐藏的足迹。在删除数据后，我们不能仅局限于特定的逻辑数据收集。必须逐扇区地对整个设备进行取证镜像。在员工离开组织后，积极提取其设备的取证照片/镜像是一项良好的做法。\n\
  \n取证人员必须定义分析范围并了解数据的存储位置，以提供准确且快速的结果。\n\n### 信息泄露\n从组织内部向外部未经授权的信息传输即为数据泄露。\n\n\
  电脑上是否连接了任何设备，例如外部硬盘或其他链接设备？\n\n物联网（IoT）在我们的生活中变得越来越普遍。可穿戴技术、监控摄像头和辅助设备都是例子。\n\n\
  ### 关键词\n你使用哪些名称、短语或关键词来寻找相关数据？个人电子邮件地址、公司项目和名称都是例子。\n\n### 12.2.5 数字环境概述\n云计算、智能手机、平板电脑和闪存驱动正成为更有价值的数据源。不再可以交叉使用“数字取证”和“计算机取证”。通常，数字取证分为以下几类：\n\
  \n#### 计算机取证\n计算机取证是数字取证的一个分支，负责检查来自计算机和其他存储设备的证据。计算机取证涉及对数字数据的识别、保护、分析和展示。它用于涉及计算机的刑事和民事诉讼。数据恢复[69]和概念提供了审计追踪。\n\
  \n#### 移动设备取证\n在移动设备取证中，利用取证方法从移动设备中恢复数字证据。虽然“移动设备”通常与手机相关，它也指的是任何具有内存和通信能力的设备，如\
  \ PDA、GPS 设备和平板电脑。\n\n自 90 年代以来，人们已广泛接受手机用于犯罪；但手机取证科学是较新的。个人和业务信息存储并通过手机传输。手机正被应用于商业领域。\n\
  \n#### 网络取证\n在网络取证中，通过监控和分析计算机网络流量来建立法律证据、收集数据或发现入侵。处理网络数据的数字取证与其他分支不同，因为它具有挥发性和动态性。网络取证[70]通常是一种主动调查，因为数据一旦移动就会丢失。网络取证有两个主要应用：\n\
  \n*   检测入侵者并监视网络异常流量。\n*   作为刑事调查的一部分，执法部门可能会分析获取的网络流量。\n\n#### 取证数据\n取证数据分析（FDA）是数字取证的一个子集，针对金融犯罪背景调查结构化数据。数据结构是指来自数据库或应用程序的数据。这些技术用于识别欺诈模式。\n\
  \n另一方面，通信、办公软件和移动设备提供了非结构化数据。由于缺乏整体框架，非结构化数据分析需要使用关键词或映射模式[71]。计算机取证和移动设备取证人员经常检查非结构化数据。\n\
  \n#### 数据库取证\n数据库取证是电子取证的一种形式，专注于数据库及其相应的元数据。服务器内存中可能存在缓存数据，这需要使用实时分析工具。数据库取证分析包括关系型数据库中记录更新的时间戳，对这些记录进行检查和审查以确认数据库用户的操作。它还关注于发现数据库或应用程序中可证明非法行为（如欺诈）的交易。\n\
