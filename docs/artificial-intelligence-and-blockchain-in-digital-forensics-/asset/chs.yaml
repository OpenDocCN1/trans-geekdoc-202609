  \n# 11 利用人工智能提高区块链技术中的数字取证身份透明\n\nK.S. Niraja¹, Fahmina Taranum², 以及 Gurram Venkata\
  \ Siva Nandan³\n\n**摘要** 由于疫情情况，几乎 90% 的人依赖数字技术来提高他们的技能、业务等。数字身份在工作空间、个人生活和其他专业活动中的应用引发了对身份管理和访问控制的需求。通过基于区块链的身份解决方案用户可以控制自己的身份。存储在公共网络中的大量数据会导致数据泄露。由于缺乏机密性，我们在存储大量数据时无法在单个块中进行，这会导致下降。尽管系统性能可以通过准确性和完整性进行分析，但仍需对区块链技术中的身份管理进行完善，因为它是基于使用私钥/公钥等协议的平台。人工智能（AI）的使用在每个领域都在大幅增加，通过人工智能和区块链，数字取证中的身份管理可以改进，消除重复工作以增加透明度并提高速度。在本章中，我们讨论了用于协议和算法的可能的身份管理技术。\n\
  \n¹ 助理教授，信息技术系，BVRIT 海得拉巴学院，Bachally, 印度\n² 教授，计算机科学与工程系，Muffak Jah 工程学院学院，Banjara\
  \ Hills, 海得拉巴-500034\n³ 高级风险与可靠性工程师，Phillips-Medisize A/S，Struer, 7600 邮箱：niraja.ksce.gmail.com;\
  \ ftaranum.gmail.com; gsvandan.gmail.com\n\n## 11.1 引言\n\n物联网、区块链技术与数字取证的协作有助于为参与者提供信心，使数字取证调查变得更加透明。数字取证的目标是使用最好的技术和工具利用数字证据来解决犯罪。1\n\
  \n### 11.1.1 数字取证\n\n\n\n取证学科的流程如图图 11.1]。其目标是利用先进的人工智能使这些操作透明化。\n\n### 11.1.2 数字取证实践使用的标准\n\
  \n最初处理数字证据的指南由四个阶段定义[3]，如图图 11.2\n\nFigure 11.1 数字取证的流程控制。\n\n![Figure 11.2 Phases\
  \ of digital forensics.](img/fig00066.jpg)\n\nFigure 11.2 数字取证的阶段。\n\n### 11.1.3\
  \ 如图 11.3 所示，现有数字取证调查挑战的总结\n\n1.  **可信性**：在数字取证中应用和提高证据项的可信度是困难的。\n2.  **完整性**：数字调查需要持续的完整性检查。\n\
  3.  **改进的溯源性**：所有证据都使用 `hash functions` 进行验证，这是一项困难且具有挑战的任务。\n4.  **可扩展性**：这是决定每个级别可以存储的数据容量。在数字取证中，每个节点可以持有\
  \ 1000 份证据。\n5.  **可用性与恢复性**：每个节点必须拥有 `hash tree` 的准确且完整的副本，使其具有恢复能力。\n\n![Figure\
  \ 11.3 Challenges of digital forensics.](img/fig00067.jpg)\n\n图 11.3 数字取证的挑战。\n\n\
  其他挑战还包括：定义框架以应对新环境中的新挑战，并确保动态证据的可靠性、可用性、恢复性以及隐私考虑。\n\n### 11.1.4 区块链\n\n区块链技术是一种分布式存档系统，用于在点点网络的去中心化数据库模板中存储链接记录。电子证据是几乎所有犯罪案件的组成部分，数字取证维护对执法部门检查至关重要\
  \ [4]。\n\n### 11.1.5 人工智能\n\n人工智能通过使问题变得更容易解决来解决问题。5] 中的作者将数字取证与数据获取、数据保护、数据分析和统计报告等流程相结合。\n\
  \n### 11.1.6 物联网 (IOT)\n\n物联网指的是植入传感器、具备处理能力的物理实体[6]。\n\n## 11.2 文献综述\n\n7] 中的作者使用数字取证来检查与犯罪相关的合同。许多委员会共同制定一个适应监管策略的模板。首席警官协会\
  \ (`ACPO`) 通过遵循下面列出的原则来控制数字调查。\n\n\n\n\n\n在 [9]中，通过为视频流添加额外的安全概念来增强 IoT 有助于度地减少安全漏洞。作者提出了各种压缩技术来规范保护策略。其目标是使用自动检测过程来检测伪造。\n\
  \n作者 Erika 和 Hanif 等人在 [10]中解释了如 `SENS Investigative Forensic Toolkit (SIFT) Workstation`\
  \ 等工具，该工具定义了一组由 SANS 学院分发的开放基础取证工具。SANS 对文件系统、图像证据和分区表支持等工具特征进行分级。由该工具生成的调查有助于在法庭上分析报告。\n\
  \n计算机取证工具目录 (`CFTC`) 是由美国国家标准与技术研究院开发的在线选择系统工具。该工具基于哈希算法的逻辑生成证据。\n\n该建议通过设计一个具有正向链的专家系统来，该系统基于六个特性三个功能。使用了内存需求、处理速度、输出格式、所需技能、重点和成本等特征。运行的功能包括低、中、高。\n\
  \n作者在 [11]中解释说，IoT 的快速扩张带来了许多安全挑战。随着对取证程序的需求增加，探索和发明新方法来应对创新中复杂性的需求日益增加。该工作强调了快速解决犯罪相关问题的操作干预。在\
  \ IoT 环境中结合数字证据是取证科学中潜在的挑战来源 [12]。识别和分类连接对象以寻找最佳收集证据的方法侧重于技术和数据标准，以成功选择相关的 IoT 设备。本章讨论了识别本地连接对象的困难，以及在\
  \ IoT 基础设施中优先考虑此类证据选择的问题。\n\n作者在 [13]中解释了数字取证的益处。数字取证科学的一个热门研究领域是寻求一种标准方法，使过程更加稳健、高效、准确和快速。使用的步骤是：获取、识别、评估和采纳。随着\
  \ Amazon、Google、Microsoft 和 IBM 等公司引入云计算，将这些服务转向数字取证（DF）被认为是很有利的，因为它可以协助执法人员推进他们的案件。\n\
  \n严谨的方法论是进行数字取证调查的检查程序。研究人员在检查过程中提出了许多新方法、途径、技术和工具，以应对现代调查新世界中遇到的新挑战 [14]。\n\n使用数据精简和数据挖掘框架来过滤不断增长的数据量以减少存储需求。随着对数字证据的需求增加，为安全预测处理问题和挑战提出解决方案所需的工作量也在增加。这被认为是通过深度的历史案例研究和智能分析对关键问题生成多次检查的原因。\n\
  \n[15] 来自 VTO 实验室和萨尔福德大学的作者讨论了执业人员、制造商和法律当局在访问取证方面的问题和挑战。他们共同努力以缩小取证设备连接及其与 IoT\
  \ 之间的差距。\n\n[16] 作者的目标是强调对移动设备所采用的活动和实践进行彻底评估，对移动取证的七年以上数据进行重要调查。该工作强调了移动取证趋势的流动以及为了适应不断变化的生态系统而频繁进行的修改。\n\
  \n## 11.3 IOT 和区块链提高取证透明度的作用\n\n用于获取数字取证透明度的 IoT、区块链和 AI 的应用目标如图 图 11.4 所示。协作用于以提高数字取证身份的功能列举如下：\n\
  \n1. 网络犯罪的增加引发并增加了对 IoT 设备的需求。IoT 设备是 5G 通信的发明，去中心化的区块链技术在多个位置持有副本；这些特征使它们成为当代生活的一部分\
  \ [17]。处理 IoT 相关的网络犯罪调查的数字取证（通过传感器、连接设备和数据备份的帮助完成）被称为 IoT 取证链。这有助于使数据表示透明化，因为它对分布式实体提供了真实性、可追溯性、韧性和信任；同时它有助于追踪与证据相关的推导过程。\n\
  \n2. 区块链有助于获得安全、不可更改的区块，并增加数据的透明度、审计性和责任制。区块链技术可以为数字取证探索的完整过程提供具有重大回报的取证应用，包括数据收集、维护一致性、证据认证、数据调查以及寻找最佳呈现模式的演示\
  \ [18]。区块链通过检查和识别调查中使用的准确数据源，在初始阶段有助于提高透明度，提高效率并降低调查成本。\n\n3. 确保特定证据的完整性是 IoT 设备的一个基本限制，这被视为挑战，并通过使用加密函数对特定证据项进行持续的完整性验证来解决\
  \ [18]。这些证据项在区块链中表示以保证整个推导过程。IoT 设备生成时间戳信息，这些信息被转换为节点并添加到区块链网络以提高安全性。\n\n4. 为了追踪区块链存在某些潜在的隐私问题，通过使用加密得到了解决和保护\
  \ [18]。IoT 的作用是发现易于追踪性以避免故障并限制访问所有机密信息。\n\n5. IoT 的去中心化系统特性支持生成完整证据，区块链为执行调查和维护透明度提供了信任\
  \ [18]。\n\n## 11.4 数字取证框架\n\n传统上用于定义数字取证的框架包括：\n\n1. 数字取证研究工作坊 (`DFRWS`) 模型，这是一个讨论数字取证框架的非营利组织。\n\
  \n2. 集成数字调查过程 (`IDIP`) 有助于自动干预以组织所有隐藏数据，以暴露关键证据并为展示和调查数字取证发现隐藏连接。\n\n3. 增强集成数字调查过程\
  \ (`EIDIP`) 有助于处理计算机和网络滥用相关的犯罪调查。\n\n4. 集成数字取证过程模型 (`IDFP`) 基于四个支柱运行，使用保护、收集、检查和分析阶段生成调查。\n\
  \n## 11.5 建议系统\n\n![图 11.5 集成架构。](img/fig00069.jpg)\n\n**图 11.5** 集成架构。\n\n\n\n\n\
  \n所提系统的目标是识别数字取证对利用 `IoT` 和 `blockchain` 技术改进应用的益处，该系统如 图 11.5 所示。该过程是从多个输入设备收集输入。。输入经过加密以增强消息的安全性。证据初始化通过在存储库中保留备份来实现。身份验证通过从存储库中收集支持性证据完成。数字取证在数字数据上进行编译，以验证处理过的证据。分析过程有助于进行深入研究并检查电子存储数据。统计数据被用于表示分析结果的图形化输出。使用此过程生成的生成结果有助于支持与关键民事问题和刑事调查相关的判决程序。时间戳存储了生成证据的日期和时间。`Autopsy`\
  \ 是一个用于简化多个开源平台安装和部署的程序，插件用于以图形化形式表示从证据处理中提取的海量数据中生成的结果，这有助于取证人员突出数据的相关部分。\n\n另一方面，数字取证为执法部门和希望调查其数字资产遭受攻击的企业业务提供服务。在执法部门，随着网络犯罪的上升，对数字取证专家的需求日益增加。在企业安全方面，企业依赖这些专业人员来确保其业务和客户数据保持安全可用。组件状态监控被用于检查被篡改、损坏或恢复数据的获取、认证和分析状态。这些证据块被传递进行验证，以最好的方式对证据进行验证和解决\
  \ [18]`。\n\n在瞬息万变的世界中，这些最新技术的作用为解决犯罪提供了完美的解决方案。根据美国国家标准与技术研究院（NIST）的说法，针对这些增强策略进行的实验有助于适应不断发展的创新趋势，从而成为提高标准和生活质量的媒介。\n\
  \n作者在 [19]] 中提出的集成方法建议如 图 11.6 所示。该提议的目标是开展工作。\n\n## 硬件与网络面临的挑战\n\n数字取证的新方法涉及 `data`\
  \ 管理，[21]`。`network` 伴随 `data` 存储。`Digital forensics` 应用于许多 `data` 领域。`Privacy`\
  \ 保护也是 `data` 以加密格式存储的挑战任务之一。\n\n## 结论\n\n本章概述了 `digital forensics` 方法及其框架。讨论了不同的现有框架以及所提框架。结合\
  \ `blockchain` 技术的框架提供了大量的应用思路。`Botnets` 已经得到广泛改进以提供更高的安全性，我们未来需要增强算法。\n\n### 参考文献\n\
