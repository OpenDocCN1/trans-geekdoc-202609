  \ |\n| | 准确率 | | 0.88 | 0.86 | 0.92 |\n\n实验结果显示，`ESN` 可以以 92% 的准确率识别洪水攻击。尽管 `RNN`\
  \ 在识别 ARP 洪水攻击方面表现出更好的结果，但它无法检测 TCP、UDP 和普通流量。然而，`ESN` 以更高的准确率对所有流量进行了分类。通过对洪水攻击进行分类，拒绝服务攻击造成了严重损害\
  \ [30]。\n\n![图 7.6 吞吐量与攻击者数量](img/fig00049.jpg)\n\n图 7.6 吞吐量与攻击者数量。\n\n### 7.5.2\
  \ 流表溢出攻击检测的性能分析\n\n通过对交换机设置攻击来进行性能分析。攻击从单个交换机扩展到四个交换机开始。测量了数据包交付率。通过改变受损节点数量对数据包交付率进行的性能分析所示图\
  \ 7.6。通过通过运行流表溢出检测模块和不运行溢出模块来比较结果。\n\n从图 7.6 中观察到，当攻击者很少时，吞吐量较高。吞吐量随着攻击者数量的增加而减少。然而，带有流表溢出检测模块时，吞吐量得到了较改善。由于流表检测模块检测到了受损的交换机，该交换机的异常流量停止，从而保持吞吐量不受影响。\n\
  \n## 7.6 结论\n\n软件定义网络在现代计算机网络的运行中提供了更高的灵活性。其定制性、易性和灵活性使得云数据中心、无线网络和物联网等当前技术能够将其用于网络基础设施。由于\
  \ SDN 承担处理这些网络中海量数据和应用的责任，容易受到各种攻击，如洪水攻击、拒绝服务攻击和流表溢出攻击。这导致了数据传输丢包和延迟。网络取证通过识别、收集和分析网络流量提供了一种安全的解决方案。这项工作提议了一个配备深度神经网络模型的网络取证框架以提供安全性。数据在主机、交换机和控制器中收集。收集的数据通过四次握手协议安全地传输到控制器。数据被用于训练回声状态网络模型。训练后的模型识别网络中可能的洪水攻击，从而阻碍拒绝服务攻击。`CNN`\
  \ 和 `RNN` 架构的性能分析显示，`ESN` 架构具有 92% 的准确率。未来，可以调整深度神经网络参数以提高准确率。将引入更多的攻击场景以构建通用的安全取证架构。\n\
