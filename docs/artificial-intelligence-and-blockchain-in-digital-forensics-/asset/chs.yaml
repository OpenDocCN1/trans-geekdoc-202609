  \n# 13 基于区块链的数字取证记录隐私保护技术\n\nS. Durga*¹, Esther Daniel², S. Deepakanmani¹, T. Mary\
  \ Neeba³ and Vinayakumar Ravi⁴\n\n¹ 哥印巴特尔，斯里克里希纳工程与技术学院 IT 系副教授。\n² 哥印巴特尔，卡鲁尼亚技术学院计算机科学系副教授。\n\
  ³ 哥印巴特尔，卡鲁尼亚技术学院电子与工程系助理教授。\n⁴ 沙特阿拉伯，霍巴尔，穆哈默德·法德大学人工智能中心。\n\n### 摘要\n\n电子记录在法律上是可接受的。电子证据正变得日益共享，但保持记录准确仍然是一项挑战。因此，采用适当的技术至关重要。本研究旨在开发并评估一种解决证据安全、用户数据完整性的区块链技术。在所提出的基于区块链的系统中，使用以太区块链为存储在`IPFS`中的记录创建公钥。代理重加密主题用于保护用户隐私。此外，我们构建并部署了智能合约来管理网络逻辑。此外，本章提出了一种增强部门间访问的策略。已开发了原型系统以测试该技术的性能。执法人员可以使用该系统检索案件数据，并验证其查看权限。访问日志以可见且不可篡改的方式存储在区块链中，以供审计。\n\
  \n## 13.1 引言\n\n数字取证是法科学的一个分支，专注于检测、收集、解释、评估和报告电子存储数据。几乎所有指控犯罪都涉及电子证据，数字取证协助对执法调查至关重要。数字取证在应急响应策略中起着重要作用，因此公司应通过其规则、程序、预算和人员来应对。数字取证深耕网络安全领域，这是应急响应策略的一个必要部分。在欧洲国家，法院已批准最新的民事程序以承认数字信息为可接受的证据形式，并实施了名为`eDiscovery`的强制机制，为这一新法科学提供了基本概念。数字取证的基本目标是在合法框架内对非法行为进行技术调查。为了解决交易双方之间的任何争议，由专业人员使用经过审查和测试的取证工具是必要的。\n\
  \n\n\n\n区块链是一种去中心化的计算和信息交换平台，它使多个领域能够协调协作，以实现理性的决策过程。将区块链技术引入取证应用中，将对数据采集、分析、调查、验证和报告过程产生实质性的收益。区块链技术提高了每笔交易的透明度，从而实现了对数据源的早期和准确识别。这导致了低成本的取证调查。基于区块链的技术确定了交易链以及链中的涉及实体，这影响了数字取证中的调查。区块链通过分布式数据结构实现，该结构涉及遍布在网络中的节点实体，以构建交易，允许分散式计算机网络中的所有参与者构建一个数字账本，用于记录和存储所有活动和事件。账本有助于审计轨迹的调查。区块链中的密码哈希和加密技术可能为交易链中证据的访问访问提供了保障。\n\
  \n通过将区块链整合到数字取证中，可以改进以下功能 [2]：\n\n*   数据可用性与完整性：在多个位置备份记录增加了数据的可用性，并且可以使用区块链独立地验证所存储数据的完整性。\n\
  *   效率：利用区块链验证完整性并不耗费时间，因此通过快速的数据修改验证实现了效率。同时也实现了对数据的快速处理。\n*   欺诈检测：基于区块链的流程自动化和在多个远程位置备份多份数据将实现取证就绪，并降低删除的概率。\n\
  *   可追溯性：所有记录都作为流程自动化的一部分被哈希处理，建立了区块链。因此，不存在数据修改或数据丢失的风险。任何修改或不匹配都可以通过哈希值轻松识别。加密能够保护证据，添加区块链功能允许允许预期的实体访问记录或数据。在访问任何记录或数据时，完整的交易历史（如时间、日期、用户\
  \ ID 和系统 ID）将被记录，并通过智能合约附加到区块链记录中。这使得记录不可篡改，且必须经过法律节点解码后才能使用。本研究重点关注支持区块链的取证调查，该调查可以使用哈希函数对数字证据进行自验证，从而建立证据的可验证性。本章其余部分的结构如下：第\
  \ 13.2 节讨论了所用技术的背景细节。第 13.3 节概述了相关工作。所提出的区块链技术在第 13.4 节中进行了解释。第 13.5 节讨论了实现和性能分析。第\
  \ 13.6 节作为本章结论结束。\n\n## 13.2 背景\n\n区块链是一种分布式账本技术（DLT），具有若干显著特征，包括去中心化且可信的记录账本 [1]。区块链是由连接在一起的区块组成的链，随着交易存储在区块中，链不断增长。该平台采用重新分发的数据传输方法，其中每一比特分散的信息（或知识）都共同所有。点对点网络管理区块链，区块链中包含了一批经过哈希处理以确保安全的交易。在没有任何第三方影响的情况下，区块链具有安全性、隐私性和信息完整性等边界属性。这些属性为存储数据提供了一种成本效益高的方法，由于援助行业的技术进步，敏感数据的安全性已成为首要责任。许多研究人员共同认为，在援助领域利用区块链技术是一种可能的解决方案。区块链是一种去中心化的应用，由巨大的点对点网络中连接在一起的一系列区块组成。区块头包含之前区块的哈希值。一个区块由三个元素组成：知识的范围、当前区块的哈希和前一个区块的哈希。“创世区块”是区块链中的第一个区块，它的前一个哈希值为\
  \ 0，因为没有之前的区块。图 13.1 显示了区块链中的区块。\n\n![图 13.1 区块中的区块。](img/fig00079.jpg)\n\n图 13.1\
  \ 区块中的区块。\n\n由于取决于区块链的类型，信息可以是任何内容。信息由电子货币组成，类似于比特币 [1]。这些区块的哈希包含一种安全的哈希算法（`SHA`）256\
  \ 加密规则，用于唯一标识链上的每个区块。区块链的特征描述如下：\n\n*   去中心化：区块链数据不是存储在单个位置，而是分散在整个网络中。这允许知识管理实现分散，并通过通过网络节点共享输入获得的共识进行处理。以前集中在单一目的的信息现在由多个组织管理。\n\
  *   数据透明度：在任何技术中，都需要实体之间存在信任连接以实现信息透明化。涉及的数据或记录必须是安全且防篡改的。存储在区块链上的任何数据都分散在网络中，而不是集中在一个位置并由单个节点控制。信息现在是共享的，清晰且不受第三方干扰。\n\
  *   安全与隐私：区块链技术采用研究函数为网络节点提供安全性。为了确保知识完整性，采用了 `SHA-256` 来计算保留在区块上的哈希。区块链是一种通过科学方法安全构建的去中心化平台，使其成为隐私信息的可靠选择。\n\
  \n## 13.3 文献综述\n\n世界已转向数字领域，导致了技术的快速创新和进步。然而，由于这种转变，网络犯罪和安全漏洞事件不断出现，影响了用户的隐私和安全。由于隐私和安全，数字取证正发挥着重要作用，包括社交取证、物联网（IoT）和云取证。最近，这些技术帮助网络安全专业通过分析数据处理和存储产生的数字数据来识别黑客。然而，研究已确定数字取证面临的特定挑战，包括操作、实际和人员方面的困难。这些开发的系统、海量数据、证据链、人员安全以及数字取证的可靠性和准确性，都是其广泛应用的重大障碍\
  \ [3]。\n\n\n\n\n为了获取和分发证据以及管理数字取证证据，开发了一种基于区块链的数字取证 IoT 框架 [4]。在整个调查过程中，该框架采用新型联盟链，通过\
  \ `case-chain` 处理安全的监管链。该框架的设计结合了基于格的加密技术与一种新的哈希函数，该哈希函数具有后量子抗性且复杂性较低。基于区块链的 `case-chain`\
  \ 为所有数字调查及其内部操作提供了一种清晰的方法。在评估该框架时，均考虑了延迟、吞吐量、Gas 消耗、能量和资源使用。这项工作的目标是解决数字数据取证领域调查的可访问性问题。\n\
  \n开发了新的区块链基础设施以为事故调查提供全面的取证服务 [5]。为了提供成员身份建立和隐私保护，最初在建议的区块链基础设施中引入了车辆公钥基础设施 (`VPKI`）。它们建立了一个分片账本来记录有关车辆的海量数据，例如存储历史、车辆诊断信息等。此外，使用别名身份有助于用户维护隐私。维护和记录处理数字证据的时间顺序历史的技术被称为数字取证监管链\
  \ (`CoC`) [5]。`CoC` 在任何数字取证调查中都是至关重要的，因为它保留了取证数据在传输不同层级中的每一个细节，例如从第一响应者到负责网络犯罪调查的高级机构。`CoC`\
  \ 跟踪了细节，包括证据是如何获取、分析和维护以供出示，以及何时、何地以及谁接触了证据。Lone 等人提出了 `forensic-chain`：一种基于区块链的数字取证监管链，为数字取证监管链带来了真实性性和防篡改性\
  \ [7]。取证链通过确保调查过程中用于实现预期结果的数字证据操作程序的完整性、透明性、真实性、安全性和可审计性，具有为取证应用特别以及通用的审计追踪提供显著益处的潜力。\n\
  \n开发了一种用于法医学领域数字文件保管和分发的非中心化网络替代方案 [8]。该框架的启动是基于从患者角度考虑主要考量、当局和适用法律的观点，以及当前最主流的官方指南。然而，在维护机密性、医疗专业人员义务和计算机取证困难方面，这些方法有时似乎是不够的。因此，他们提供了一个混合平台，使用共识方法来跟踪访问历史并防止未经授权的访问导致的数据更改。该网络是安全的，可以通过特定的应用程序进行访问。为了避免单点故障，所有信息都在区块链节点上进行决定和分发，通过使用密码学和区块链密钥协议确保对文件的安全访问。结果是创建并实现了一个用于上传、存储和共享数字取证数据的安全且全面的框架。\n\
  \n开发了一种新型且安全的、支持 `Hyperledger Sawtooth` 的多媒体数字取证调查区块链架构 [9]。在收集、维护、分析和理解数字证据的过程中，所建议的\
  \ `MF-Ledger` 架构能够为执行各种活动提供全面的数据溯源、可追溯性和保证，并增强监管链事件之间的信任。建议的架构确保了存储在加密账本分布式数据块中的整个交易证据受到受入保护。建议的架构允许案件相关的投资者使用区块链\
  \ `DApp` 在分布式账本上请求、访问和存储他们的数字交易。选择私有许可链技术 `Hyperledger Sawtooth` 是因为它具有模块化结构，可以将去中心化核心系统与应用领域隔离开\
  \ [11, 12]。\n\n表 13.1 总结了现有方法的核心概念和局限性。\n\n**表 13.1** 现有方法的核心概念和局限性。 \n\n| **先进技术**\
