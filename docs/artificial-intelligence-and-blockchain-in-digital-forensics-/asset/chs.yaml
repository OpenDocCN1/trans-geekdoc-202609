  \n## **13.4** **基于区块链的隐私保护技术**\n\n图 13.2 展示了建议的用于数字取证记录的区块链隐私保护技术框图。如图 13.2 所示，这允许系统构建一个分布式账本来记录数字证据，例如嫌疑人的电子邮件或手机文件、指纹等类型的数字证据。所有授权的证据收集者都将通过区块链网络共享这些证据。证据的完整性、时间戳、韧性、溯性和全球可信度均由区块链的加密特性保证。\n\
  \n该框图包含以下关键组件：\n\n### ***共识算法***\n\n共识协议是任何区块链网络的关键组件，因为它允许网络的所有节点对分布式账本当前状态达成共识\
  \ [10]。比特币（一种去中心化数字货币）使用工作量（PoW）共识机制来确定哪个节点挖掘下一个区块[12]。\n\n\n\n\n以太坊（Ethereum）是一个区块链平台，它拥有自己的货币\
  \ `Ether` (`ETH`) 以及一种编程语言 `Solidity`。以太坊是一个去中心化的公共账本，可以作为区块链网络验证并记录交易。\n\n### 13.4.1\
  \ 信息交易\n\n外部单元与 `Ethereum` 交互的方式被称为交易。它允许外部用户修改以太坊区块链网络上持有的记录或数据状态。从外部账户启动的被称为以太坊交易。以太坊交易\
  \ [16] 包含以下元素：`from`、`to`、`price`、`information`、`gas` 和 `gas value`。前两个元素“from and\
  \ to”代表消息的发送者和接收者。从发送者发送到接收者的金额（`wei`）被称为 `price`。要传递给接收者的消息存储在名为“information”的可选字段中。以太坊区块链上的每笔交易都有一项相关的费用，发送者必须支付。`Gas`\
  \ 是这种费用的名称。`Gas` 是发送者为以太坊网络上的每笔交易必须支付的费用。`Gas` 是该费用的名称。每笔交易的 `gas value` 是发送者愿意在\
  \ gas 上花费的金额。这些交易中可以获得的最大 gas 数量被称为 `gas limit`。\n\n分布式账本系统可以提供证据项的完整概述，并与相关的证据项和来源关联。这在涉及大量证据来源和操作的调查中将非常有用。在建议的技术中，利用区块链为所有取证调查参与者提供全局信任。\n\
  \n### 13.4.2 智能合约周期、用户角色和权限\n\n智能合约是用于在区块链上执行任何操作的软件。一旦用户发送交易，这段代码就不再活跃 [16]。它们立即在区块链上运行，使其无法被篡改或修改。智能合约用\
  \ `solidity` 编程语言编写，用于对区块链上的任何精确函数进行编程。程序员在设计完成后将使用 `EVM` 字节码编译所需的操作，将在下一节中解释。一旦它们被收集，可能会被弃用并放置在以太坊区块链上\
  \ [16]。\n\n一个合理的合约必须在处理交易之前首先发布到区块链上。根据部署机制，所有区块链节点应具有相同的代码。不同区块链类型处理此需求的方式不同，但通常有两种：将合约代码本身保留在区块链中以确保全球一致，或者允许节点所有决定是否在本地安装代码。区块链内部基于哈希的承诺已作为确认代码可靠性的参考。\n\
  \n表 13.2 用户角色和权限。\n\n| 角色 | 权限 |\n| --- | --- |\n| 证据 (Evidence) | • 在权限证据记录上进行读/写\
  \ |\n| 收集者 (collector) | • 请求调查员提供记录访问 |\n| 调查员 (Investigator) | • 读取证据记录 |\n| |\
  \ • 来自法院/辩方/控方的读取/写记录的权限 |\n| | • 撤销权限 |\n| 管理员 (Manager) | • 创建调查员记录 |\n\n除了数据和时间戳，该技术还需要设备的唯一识别信息、用户识别信息和操作细节来证明数据的原始性。所提技术中每个实体的角色和权限所示于\
  \ 表 13.2。\n\n在数字调查中，维护某些证据的完整性、价值和/或所有权仍然是一个问题。攻击是许多案件产生，而且大量的物联网设备联网。首要目标是确保这些证据的完整性。在许多情况下，可信内部人员风险正在增加，证据系统不安全导致证据信息丢失或损坏。为了确保特定证据的完整性，`SHA256`\
  \ 是取证成像过程中常用的加密哈希算法；然而目前全证据链缺乏持续的完整性检查或验证机制。\n\n网络参与者（如证据收集者、调查员和应用程序）首先生成 `RSA`\
  \ 密钥。他们在保持私钥安全的同时将公钥公开。每个参与者都可以有一个公开的公钥和一个对应的私钥。数字内容使用高级加密标准 (`AES`) 算法加密。为了加密这些信息，利用了\
  \ `AES` 双边编码规则并随机生成加密密钥。此外，使用 `IPFS` 来保存加密数据。\n\n当记录保存到 `IPFS` 时，它会为每个新记录生成一个唯一的哈希。任何拥有哈希的人都能访问该信息。这现在已在以太坊上可用。\n\
  \n![图 13.3 调查员序图。](img/fig00081.jpg)\n\n图 13.3 调查员序图。\n\n在注册身份时，认证服务器为调查员提供一个属于国家警察机构同伴的私钥。授权调查员的序图如图\
  \ 图 13.3 所示。\n\n所提技术的伪代码如下。\n\n#### # 调查员注册伪代码\n\n```\ninput: address of the sender,\
  \ image hash, specialization, description\nif sender == manager {\n    create an\
  \ investigator instance and store it in the state of contract\n    push investigator\
  \ to list\n} else {\n    return error\n}\n```\n\n#### # 数字取证记录伪代码\n\n```\ninput:\
  \ details of the accused person\nif sender not in map of accused person {\n    create\
  \ a new record\n    put record to accused person\n    if hash length != 0 {\n  \
  \      set report hash\n    }\n    if forensic record hash length != 0 {\n     \
  \   set forensic record hash\n    }\n}\n```\n\n#### # 设置报告哈希伪代码\n\n```\ninput: access\
  \ id, hash\nif accessid == investigator id {\n    push the hash into the list of\
  \ report hashes\n} else {\n    return error\n}\n```\n\n\n\n### 13.4.3 星际文件系统\n\n\
  `IPFS` 是一种点对点网络协议，用于存储和分发巨大的文件 [17]。由于 `IPFS` 数据受到防篡改保护，它提供了安全的知识存储。它使用密码学符号来保护数据免受篡改，任何修改存储在\
  \ `IPFS` 上数据的尝试只能通过动态更改符号来实现。在所有 `IPFS` 信息文件中都可以找到通过加密生成的哈希值。它是独特的，并被用于区分 `IPFS`\
  \ 留存文件 [17]。`IPFS` 协议的安全存储策略使其成为存储重要和敏感数据的可行替代方案。为了减少跨区块链的总处理操作，可以将生成的加密哈希值维护在边缘化应用中。`IPFS`\
  \ 协议基于点对点网络。关联链接由一组无结构化的二进制知识数组组成 [17]。`IPFS` 协议按以下方式运行：\n\n*   `IPFS` 文件被分配一个唯一的密码学哈希。\n\
  *   在 `IPFS` 网络上，不允许存在重复文件。\n*   网络节点存储节点的内容和索引数据。\n\n`IPFS` 用于本地数据存储。它能够存储和交换广泛的文件，并为每个文件分配一个唯一的哈希值，允许我们根据其哈希值轻松地识别文件。此外，`IPFS`\
  \ 包含一种去重算法，可以高效地避免知识存储重复并节省存储空间。建议的技术利用区块链技术、智能合约和加密货币来创建数字取证应用和服务的方案。这些应用和服务通过数字记录被无缝启用。\n\
  \n## 13.5 性能分析\n\n使用 `Ethereum`（一种具有智能合约能力的分布式开源区块链）来评估所提技术的性能。证据收集器在构建智能合约（取证证据记录）时，将选择一个向其提供查看和编辑写入权限的调查人员。存储在\
  \ `IPFS` 中的记录哈希被存储在区块链中以供以后参考。调查人员可以使用智能合约获取区块链中包含的哈希值，以提取他们的 `IPFS` 记录。`IPFS` 存储调查人员提供的调查细节和证据。\n\
  \n所提基于区块链的隐私保护技术的实现通过图 13.3 中的序列图所示。对于应用分析和测试，使用了 `Apache JMeter` 5.1.1 版本和 `Apache`\
  \ 二.00 版本作为桌面性能测试工具。随着交易数量的，执行时间将会增长。执行这些交易是为了执行敏感合约中包含的功能。每个 `Ethereum` 交易中都有一个信息有效负载字段。该交易具有十六进制序列化格式的知识有效负载，并带有相关的字节。有效负载中必须存在两个元素：1.\
  \ `operate Selector`（操作选择器），2. `carry out Arguments`（执行参数）。`Keccak-256` 哈希的前四个字节用于识别由\
  \ `operate` 选择器正在调用的敏感合约操作。操作参数包括各种静态和动态组件类型，每种类型在写入有效负载时都有自己的一套标准。`operate` 签名包含\
  \ `(string, address)` 对：\n\n*   `Keccak-256` 哈希如下，\n*   `0x6c0abd24edce8ce20a2dfb1cd2026179214466`\n\
  \n\n\n\n\n图 13.7 展示了数据条目总数对平均存储时间的影响。输入数据是从 500 到 5000 K 的大小范围内随机选择的。随着数据块尺寸增大，存储时间随之增加。然而，当使用二维哈希时，所提方法存储数据块所需的时间要少得多。这是因为通过每个关键词同时检索键和值的速度更快。\n\
