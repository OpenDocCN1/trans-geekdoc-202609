  \n\n\n\n\n### 摘要\n软件定义网络（`SDN`）将控制和数据面分离，实现了网络灵活的运行和管理。`SDN` 中的可编程控制器拥有网络的全局信息，并控制网络功能。这为网络运行提供了高灵活性、可扩展性和可靠性。然而，中心化控制、控制器与设备之间复杂的交互、控制面与数据面之间的通信过程，以及缺乏充分设计的安全防御规则，使其容易受到各种类型的攻击。本章讨论了\
  \ SDN 的各个方面、攻击手段以及用于保护 SDN 的缓解技术。它还分析了网络取证在 SDN 中的应用。本文设计了一种基于网络取证的框架，以缓解软件定义网络中的攻击。实验分析证明，所提出的框架能够检测攻击并提供安全的\
  \ SDN。\n\n# 7.1 引言\n传统的网络设备是基于网络操作系统的预定义命令进行配置的。然而，这限制了操作的灵活性，并使网络管理成为了一项挑战。在如数据中心网络、车载网络和物联网等现代基础设施中，人们期望在负载均衡、主动容错、智能迁移和安全方面具有更高的灵活性[1]。软件定义网络（SDNs）通过分离数据面和控制面提供了灵活的网络功能。控制面被分离并挂载为中央控制器，负责收集网络全局信息，根据这些信息优化网络，并将这些信息分发到各个网络交换机以转发数据包。这减少了由于网络交换机之间交换路由控制消息而导致的带宽开销[2]。\n\
  \n使用 SDN 使网络发生了革命性的变化。但这种架构也面临着安全威胁。SDN 主要依赖软件代码，使其更容易受到基于代码注入的攻击。SDN 控制器与网络交换机交换消息以通信优化的路由策略，这使得攻击者能够注入基于路由的攻击。除了这种拒绝服务攻击外，还尝试对控制器进行中间人攻击和伪装攻击[3]。因此，检测网络上可能的攻击并采取适当的缓解措施至关重要。\n\
  \n网络取证是一种捕网络数据并分析数据以识别网络攻击的技术。由于软件定义网络中存在中心化控制器，可以将网络取证功能整合到 SDN 中，以调查网络安全威胁[4]。本章提出了一个基于网络取证的框架用于检测网络中的威胁。本章的其余部分结构如下：第\
  \ 2 节]。\n\n* **数据面**：数据面具有输入和输出端口。每个数据包通过交换机的输入端口到达数据面。通过检查数据包头并引用转发表找到数据包的地。从表中获取下一跳信息后，数据包头被重新封装，数据包被放置在输出端口。\n\
  * **控制面**：控制面的责任是维护更新的转发表。最初，控制面运行路由协议以在网络交换机之间交换消息并计算转发表。控制面维护拓扑结构的最新连接性，以确保无无数据传输。\n\
  * **管理面**：网络管理员使用如简单网络管理协议（`SNMP`）等协议通过该面收集信息，监控网络交换机的正常运行。\n\n最初，在传统的网络交换机中，数据包转发完全基于目的地址[6]。随后，通过引入基于策略的路由对其进行改进，将来自某些目的的流量以流的形式进行隔离，并进行统一处理。然后，为了提高网络安全性，维护访问控制列表，根据端口和地址信息适宜地转发流量[7]。在大多数网络情况下，流量使用防火墙等专用设备进行隔离。入侵检测系统是中心化基于软件的架构的前驱[8]。\n\
  \nSDN 的目标是通过理解网络需求和对故障的恢复能力，在转发表中确定最佳路由设计。因此，控制面从网络交换机中移除并移动到中心位置，以便随时理解网络的视图并做出做出决策。传统与软件定义之间的差异如图图\
  \ 7.1]–[12]。\n\n![ 7.1 软件定义网络架构。](img/fig0004.jpg)\n\n**图 7.1** 软件定义网络架构。\n\n##\
  \ 7.3 软件定义网络中的攻击\n由于 SDN 与传统网络相比具有各种优势，分析这种中心化架构中的安全威胁和影响至关重要。由于 SDN 控制器是控制权威，且网络交换机遵守控制器制定的转发表，它已成为攻击者的目标[3],[13]。本节讨论了\
  \ SDN 环境中的各种威胁。\n\n* SDN 环境容易受到 IP 和 ARP 欺骗攻击。攻击者可以伪造 MAC 和 IP 地址以接收 SDN 的更新，导致流量分析和拒绝服务攻击等攻击[3],[14]。\n\
  * 针对控制器可以执行分布式拒绝服务攻击，阻止其与网络交换机通信。这种攻击可以通过 UDP 洪水攻击、TCP 洪水攻击和 SYN 洪水攻击来执行[15]。\n\n\
  \n\n\n\n*   流表溢出攻击难以检测，并且会影响网络交换机的数据平面。SDN 硬件交换机维护可寻内存来存储转发表。攻击者创建流条目记录并持续将其发送到网络交换机。这会占用内存空间并导致交换机转发表溢出，从而导致网络性能下降[16]。\n\
  *   具有命令和控制机制的僵尸网络在 SDN 等基于流的环境中是严重威胁。受感染的实体入侵许多设备形成一个攻击者网络，对网络造成严重破坏[17]。\n*  \
  \ SDN 控制器获取网络的整体视图并创建转发表。网络交换机向控制器报告其链路连通性状态。拥有这些信息后，控制器计算转发表。然而，受攻击的节点可能会发送虚假的链路信息，导致链路发现攻击，从而导致错误的转发表计算[18]。\n\
  *   交叉攻击（crossfire attack）旨在识别连接目标区域与网络其余部分的关键链路[19]。攻击者通过关键链路发送低强度流量，最终阻塞目标区域的真实流量。由于该区域的交换机被攻击者禁止接收更新的转发表，目标区域将断开连接。\n\
  *   文中讨论了针对上层 API、下层 API、数据平面和控制平面的各种定向攻击，即实现攻击、执行攻击和策略攻击[20]。\n\n上述讨论的攻击对集中控制网络造成了严重破坏并降低了网络性能。这些攻击必须被识别并从网络中隔离。\n\
  \n## 7.4 用于保护 SDN 的网络取证架构\n\n为了缓解针对 SDN 的攻击，提出了一种基于网络取证的架构。网络取证是一门处理监控和分析实时计算机网络流量以检测可能的网络攻击的科学。该过程始于识别阶段，在识别阶段中通过网络指标监控异常网络行为。一旦发现任何异常，就会在该网络位置启动数据收集。对识别出的位置的网络活动进行监控和记录。积累的数据将使用算法进行适当分析，以识别攻击类型和攻击者。最后一步是报告和补救措施。为了确保网络的正常运行，会将攻击者从网络中适当分离[4]\
  \ [21]。所提出的 SDN 网络取证具有以下亮点：\n\n*   从不同区域监控网络并记录活动的能力。\n*   深度学习使分析模块能够识别各种攻击，如拒绝服务、链路发现、交叉攻击和表溢出攻击。\n\
  *   用于将攻击者从网络中分离的分类模块。\n\n所提出的 SDN 架构将网络分为三个区域：网络交换机区域、控制器区域和区域。SDN 网络取证分为多个阶段，即识别、数据收集、数据分析和缓解。下一节提供了对这些阶段的更多见解。\n\
  \n### 7.4.1 识别阶段\n\n在第一个识别阶段，对两个区域的行为进行监控。这实现了网络的分布式监控。识别阶段收集的特征列在表 7.1 中。\n\n每个区域都维护日志并通信到控制器进行进一步分析。日志传输遵循安全的四次握手方法，以强制日志数据的机密性、完整性和身份验证。\n\
  \n### 7.4.2 数据收集阶段\n\n在设备和节点（`M`）收集的数据必须带有机密性和身份验证传输到控制器（`C`），以确保数据的完整性。提出并实现四次握手方法（`FWHM`），在给定环境中提供机密性和身份验证。所提出的\
  \ FWHM 利用了公钥加密系统。它包含两个阶段：(i) 它们之间交换公钥；(ii) 带有机密性和身份验证的数据交换。\n\n表 7.1** 识别阶段收集的数据。\n\
  \n| 序号 | 区域 | 收集的特征 | 含义 |\n| --- | --- | --- | --- |\n| 1 | 控制器区域 | 源 IP | 发送者地址\
  \ |\n| 2 | 目的 IP | 接收者地址 |\n| 3 | 流 ID | 数据流标识符 |\n| 4 | 流长度 | 数据流大小 |\n| 5 | 流会话持续时间\
  \ | 数据流时长 |\n| 6 | 利用率 | 消耗的带宽 |\n| 7 | 资源使用 | 可用的 CPU 和内存 |\n| 8 | 网络设备区域 | 源 IP\
  \ | 接收者地址 |\n| 9 | 流 ID | 数据流标识符 |\n| 10 | 流长度 | 数据流大小 |\n| 11 | 流会话持续时间 | 数据流时长\
  \ |\n| 12 | 利用率 | 消耗的带宽 |\n| 13 | 资源使用 | 可用的 CPU 和内存 |\n| 14 | 流持续时间 | 数据传输时间 |\n\
  | 15 | 包交付率 | 成功的数据传输 |\n| 16 | 丢包率 | 丢弃的数据包 |\n| 17 | 响应时间 | 转发数据包所需 |\n\n####\
  \ (i) 公钥交换\n\n最初，`M` 和 `C` 均交换它们的公钥。也就是说，每个节点或设备独立地与控制器交换其公钥。涉及此协议的步骤如下：\n\n*  \
  \ 步骤 1：`C` 与 `KAS` 交换其公钥。\n*   步骤 2：`M` 与 `KAS` 交换其公钥。\n\n这种初始交换不需要对密钥进行加密或编码，因为后续步骤确保了消息的完整性。\n\
  \n*   步骤 3：`KAS` 分发由其私钥（`PR[KAS]`）加密的令牌（`T[C]`），包含第三条消息的时间戳（`t[3]`）、C 的身份标识（`IP[C]`）和\
  \ C 的公钥（`PU[C]`），给给 C，其中：\n    *   时间戳（`t[3]`）验证令牌（`T[C]`）是否有效。\n    *   C 的身份标识（`IP[C]`）确认了控制器的\
  \ IP 地址。\n*   步骤 4：`KAS` 分发由其私钥（`PR[KAS]`）加密的令牌（`T[M]`），包含第四条消息的时间戳（`t[4]`）、M 的身份标识（`IP[M]`）和\
  \ M 的公钥（`PU[M]`），给节点 `M`，其中：\n    *   时间戳（`t[4]`）验证令牌（`T[M]`）是否有效。\n    *   M 的身份标识（`IP[M]`）确认了节点的\
  \ IP 地址。\n\n这种持有相应公钥的令牌交换确保了节点和控制器之间可以确信地交换公钥。因为令牌 `T[C]` 和 `T[M]` 只能通过 `KAS` 的公钥（`PU[KAS]`）进行解密。这也确认了令牌仅是由受信任实体\
  \ `KAS` 创建的。\n\n对于控制器（`C`），由 `KAS`提供的令牌形式如下控制器（`C`）将此令牌（`T[C]`）分享给设备（`M`）。`M` 利用\
  \ `KAS` 的公钥（`PU[KAS]`）解密令牌 `T`。\n\n*   步骤 5：`C` 与 `M` 交换令牌（`T[C]`）。\n*   步骤 6：`M`\
  \ 与 `C` 交换令牌（`T[M]`）。\n\n在步骤 5 和 6 之后，控制器和所有设备都成功交换了它们的公钥。整个操作见图 7.2。\n\n#### (ii)\
  \ 带有机密性和身份验证的数据交换。\n\n\n\n\n一旦设备的公钥（M）和控制器（C）成功交换，数据就可以在它们之间进行具有机密性和身份验证的交换，以防止对通信设置的主动和被动攻击。数据交换在\
  \ C 和 M 之间通过以下步骤进行。\n\n* 步骤 7：设备（M）使用控制器的公钥（`PU[C]`）加密以下组件并将其发送给 C。这些组件包括 M 的标识符（`IP[M]`）和设备的唯一标识符（`Q[M]`）。\n\
  * 步骤 8：控制器（D）使用设备 M 的公钥（`PU[M]`）加密以下组件并将其发送给设备 M。这些组件包括设备的唯一标识符（`Q[M]`）和控制器的唯一标识符（`Q[C]`）。\n\
  \n唯一标识符由控制器和设备利用*系统时间*和*伪随机数*独立生成。因此，攻击者无法推出这些唯一标识符。\n\n![图 7.2 公钥交换。](img/fig00045.jpg)\n\
  \n图 7.2 公钥交换。\n\n* 步骤 9：设备（M）发回由控制器公钥（`PU[C]`）加密的控制器唯一标识符（`Q[C]`）。\n* 步骤 10：设备（M）现在准备使用交换的密钥将收集的数据（X）发送到控制器（C）。设备（M）使用其私钥（`PR[M]`）加密数据（X），然后使用控制器\
  \ C 的公钥（`PU[C]`）加密。其表示为\n\n由于数据（X）使用 `PR[M]` 加密，因此只能用 `PU[M]` 解密。这证明了数据（X）仅由设备（M）发送。此外，数据通过\
  \ `PU[C]` 加密，限制了控制器可以解密并获取数据（X）。\n\n整个数据交换过程如图图 7.3 所示。一旦完成初始公钥交换，步骤 7–10 将针对不同的数据交换重复执行。\n\
  \n![图 7.3 具有机密性和身份验证的数据交换。](img/fig00046.jpg)\n\n图 7.3 具有机密性和身份验证的数据交换。\n\n### 7.4.3\
  \ 分析阶段\n\n分析是网络取证架构的关键部分。分析可以由第三方服务处理，也可以由控制器内部处理。\n\n#### 7.4.3.1 洪水攻击的检测\n\n由于基于深度学习的方法已被证明在多类分类中具有更高的精度[17],\
  \ [22]]，控制器中的检测模块实现了这些算法以识别潜在威胁。检测模块使用回声态网络检测洪水攻击类型。回声态网络（ESN）是一种先进的循环神经网络，克服了循环神经网络中的问题。ESN\
  \ 由三层组成，即输入层、固定储池层和输出层。实时采集输入数据。令 `S = {S[1], S[2] ....... S[n]}` 为馈入网络的数据。令 `W[in]`\
  \ 为输入与储池之间的权重，`W` 为储池与输出层之间的权重，`W[out]` 为储池与输出层之间的权重。ESN 架构如图图 7.4 所示。\n\n储池隐藏层的输出如方程\
  \ (7.1) 所示。输入层具有 `m` 个单元，储池持有 `K′` 个单元，输出层持有 `C` 个单元，如 (Ch07.xhtml#bck_cap_lbl0063)\
  \ 所示。\n\n```\nh[t] = f(W[in]S[t] + h[t-1])\n```\n网络所示。\n```\ny[t] = f(W[out]h[t])\n\
  ```\n(Ch07.xhtml#bck_cap_lbl0064) 其中 `y[t]` 表示回声态的输出，`f` 表示激活函数。方程 (7.2) 表示回声态。\n\
  \n![图 7.4 回声态架构。](img/fig00047.jpg)\n\n图 7.4 回声态架构。\n\n#### 7.4.3.2 表溢攻击的检测\n\n\
  表溢攻击发生在交换机中。攻击者被假设向交换机发送表项。从每个交换机收集的某些表项如表表 7.2 所示被发送到控制器进行分析。令新添加的表率为 `ri`，其中 `i`\
  \ 表示交换机，`t` 表示时间。如方程 (7.3) 所示，控制器持有 `c` 状态。\n\n```\nif (ri > pi) 检测到攻击\nif (ri <\
  \ pi) 未检测到攻击\nif (ri == pi) 需要进一步调查\n```\n(Ch07.xhtml#bck_cap_lbl0067)\n\n表 7.2\
  \ 条件检查。\n\n| 条件 | 链路损坏 | 添加交换机 | 拓扑变化 |\n| :--- | :--- | :--- | :--- |\n| 1 | 否\
  \ | 否 | 否 |\n| 2 | 否 | 否 | 是 |\n| 3 | 否 | 是 | 否 |\n| 4 | 否 | 是 | 是 |\n| 5 | 是 |\
  \ 否 | 否 |\n| 6 | 是 | 否 | 是 |\n| 7 | 是 | 是 | 否 |\n| 8 | 是 | 是 | 是 |\n\n当交换机被怀疑为受损节点时，采取措施将其从网络中断开。\n\
  \n### 7.5 实验分析\n\n实验分析是在 Mininet 网络上进行的。Mininet 版本 2.3.0 已安装在 Virtual Box 上[23],\
  \ [24]]。实验使用的拓扑结构如图图 7.5 所示。由 Pox 控制器控制的 Open v 连接[25]]。\n\n该拓扑结构包含两层交换机。从 `s1`\
  \ 到 `s5` 的交换机构成接入层，连接主机到网络。`s6` 到 `s8` 交换机连接到控制器，形成分布层，如图图 7.5 所示。\n\n#### 7.5.1\
  \ 洪水攻击的性能分析\n\n链路运行带宽为 100 Mbps，延迟为 5 ms。最初通过生成 TCP、UDP 和 ARP 流量进行期一小时的仿真[14], [26]。表表\
  \ 7.1 中所示的指标从主机、交换机和控制器处收集。在数据清洗后，确定了 64,000 个样本。使用回声态网络对收集的数据进行分析。然后与卷积神经网络和循环神经网络进行对比[27]]。训练阶段使用\
  \ 64,000 个样本进行。测试通过在网络中随机启动正常异常流量来完成。性能指标准确率、精确率、召回率和 F1 分数已经测量[28], [29]]。输出类别为常规流量、TCP\
  \ 洪水、UDP 洪水和 ARP 洪水。此类洪水攻击可能导致用户应用程序拒绝服务。对比分析如表表 7.3 所示。\n\n\n\n\n图 7.5 仿真网络拓扑。\n\
  \n表 7.3 CNN、RNN 和 ESN 的对比分析。\n\n| 攻击类型 | | | CNN | RNN | ESN |\n| --- | --- | ---\
  \ | --- | --- | --- |\n| TCP 洪水攻击 | | | 0.84 | 0.86 | 0.91 |\n| UDP 洪水攻击 | 精率 |\
  \ 0.83 | 0.82 | 0.92 |\n| ARP 洪水攻击 | | | 0.85 | 0.90 | 0.91 |\n| 正常 | | | 0.86 |\
  \ 0.87 | 0.92 |\n| TCP 洪水攻击 | | | 0.83 | 0.85 | 0.90 |\n| UDP 洪水攻击 | 回回率 | 0.82\
  \ | 0.83 | 0.92 |\n| ARP 洪水攻击 | | | 0.83 | 0.90 | 0.93 |\n| 正常 | | | 0.86 | 0.87\
  \ | 0.91 |\n| TCP 洪水攻击 | | | 0.83 | 0.85 | 0.92 |\n| UDP 洪水攻击 | F1 分数 | 0.84 | 0.81\
