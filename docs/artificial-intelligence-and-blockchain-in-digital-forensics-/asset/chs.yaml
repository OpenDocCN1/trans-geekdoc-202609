  \nSaranya 1 研究员，计算机科学学院，计算机技术学院\nUsha 2 副教授，计算机科学学院，计算机技术学院\n\n### 摘要\n社交网络（OSNs）已成为我们生活的一部分。通过数字取证工具将对社交网络中产生的信息进行分析。在移动设备取证领域，数字取证技术有助于计算机犯罪学预测、识别和预防犯罪。本文讨论了社交网络网站上的犯罪、钓鱼和诱骗。我们讨论了用户如何安全地使用社交网络。我们还讨论了取证部门如何创建并提交证据。\n\
  \n## 12.1 引言\n社交媒体产生了大量信息。这些数据由手机、平板电脑和物联网（IoT）设备产生。这些设备连接到公共互联网，与之相关的数据很容易被滥用。1\
  \ 有组织犯罪集团（OCGs）通常以良好的国际或本地组织运作，欺骗并滥用社交网络信息。2\n\n![图 12.1 数字取证分析流程图](img/fig0071.jpg)\n\
  \n图 12.1 数字取证分析流程图\n\n\n\n\n基于网页的媒体客户端：基于网页的媒体客户端被社交媒体中的终端用户使用。基于网页的媒体客户端无法让我们了解网络犯罪分子如何滥用社交媒体。[14]。一些网页媒体媒体记录可能涉及个人、组织、地点以及不同的“非人类”实体。同时，少数群体可能在类似的平台上监控多个一个基于网页的媒体账户。因此，本节背后的概念改变了讨论基于网页媒体客户端数量的方式，以澄清这些数字并非指代“个人”。[15]\
  \ [16] [17]。中国用于基于网页媒体客户端的来源在可验证数据（包括全球总计）方面取得了一定进展，必须进行更改。\n\n![图 12.2 在线社交媒体犯罪分析流程图。](img/fig00072.jpg)\n\
  \n图 12.2 在线社交媒体的犯罪分析流程图。\n\n网页媒体记录：一种基于技术的领域，允许用户创建、发布、协作和共享内容。网页媒体允许双向通信，而电视和广播等传统娱乐形式是单向通信[15]\
  \ [16] [17]。图 12.2 显示了在线社交媒体上的犯罪分析。\n\n数字取证有权根据相似的来源重新计算连续几年的网页客户端数据[21][22][23][24]，且这种方法被应用于今年，因此今年报告中记录的年度和季度发展数据准确地反映了长期以来网页客户端数量的变化情况。如果不是太复杂，请参考社交媒体统计数据的增长情况，并分析时间范围内任何点的变化。\n\
