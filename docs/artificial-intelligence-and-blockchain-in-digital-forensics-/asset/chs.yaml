  \ ATM 安全\n\n### 摘要\n我们几乎每天都会听到有关 ATM 各种欺诈和骗局的新闻。ATM 的出现是对传统银行系统的替代。然而，缺乏安全系统引入了新的威胁。银行在看到交易相关的欺诈增加后，推出了基于一次性密码的交易。尽管这在某些程度上有助于授权交易，但仍有改进空间。本章关注使用人脸识别进行安全。人脸识别是一种非常安全的方法，因为它快速且可靠。根据我们的实验，发现这可以极大提高安全性。误差范围很小，在大多数情况下都是准确的。我们的实验结果显示，对于不同角度的人脸准确率达到\
  \ 95%。我们尝试利用 ATM 人脸识别提供的独特特征。\n\n## 6.1 引言\n数字取证是法科学的一个领域，涉及对移动设备和计算机犯罪常用数字设备中发现数据的恢复、调查、检查和分析\
  \ [1]。\n\n\n\n\n\n得益于 ATM 的出现，人们去银行提取现金的日子已经过去了。ATM 的全称为自动柜员机（automatic teller machine）。ATM\
  \ 是一种电子电信设备，允许客户管理其财务账户、查看账单并提取现金 [2-3]]。ATM 是一种自助终端，它通过互联网使用安全的加密通信方法为客户提供这些设施。为了\
  \ ATM 服务，每位客户都拥有一张由银行发的个人塑料卡片，卡片上有一条称为 `ATM card` 的磁条，用于验证其身份并操作 ATM。ATM 将卡片插入插槽，读卡器会立即读取磁条，并在客户完成账户操作后将卡片退还\
  \ [4-6]]。因此，操作 ATM 的第一步是插入卡片，随后 ATM 会要求用户通过输入 `PIN` 进行身份验证。`PIN` 代表个人识别码，是一个唯一的\
  \ 4-6 位数字，，包含敏感信息，因此必须保密 [8]。如果输入错误 PIN 三次，ATM 卡将被锁定以防止滥用，只有在客户访问银行后才能解锁。在成功验证 PIN\
  \ 后，客户将通过身份验证并显示各种菜单 [9–11]]。\n\n这种系统的主要问题是缺乏安全性的。它只有单层安全防护，可以通过窥视、侧录、盗窃等手段绕过。其他问题之一是当前的\
  \ Covid-19 疫情，客户需要物理地按下键来提供各种输入。使用智能手机取款是克服这一问题的技术之一。客户可以刷卡，ATM 将生成一个临时的 `URL` 或临时\
  \ `QR code`（扫描后将重定向到 `URL`），只有当智能手机连接到 ATM 的 `Wi-Fi` 时才能访问。打开 `URL` 将带你进入到智能手机上的\
  \ ATM 界面。这将显著减少客户接触 ATM 的次数。\n\n在本章中，我们旨在引入一种适当的双级安全机制，用于将 ATM 的安全性提高到显著水平，并减少客户触摸键盘的需求\
  \ 13-[14]。用于人脸识别算法的数字相机将作为实验中使用的数字设备。机器将系统读取的每张图像存储在我们的数据库中。我们将使用告警机制对第三次未能人脸识别算法的记录进行优先级处理。\n\
  \n拥有大量的数据库确保了扫描的面部可以与现有记录匹配，并且可以随时获取所有相关事实，这使得犯罪分子变得极其脆弱。这种策略有助于我们在数字盗窃发生时的调查阶段提供帮助。由于我们已经有了数字证据，相关部门将更容易调查该盗窃案件。用户将立即收到通知。如果用户三次尝试失败，可以包含一个功能来警报保安或播放响亮的警报声\
  \ [16]。\n\n## 6.2 文献综述\n\n在进行彻底搜索和评估后，支持该系统的文档文献综述所示。\n\nSayan Hazra 等得出结论，ATM 服务是最重要的服务之一。根据\
  \ ATM 行业组织（ATMIA）的数据，全球部署了约 350 万台 ATM。由于所提议的模型中交易不需要 ATM 卡，因此建议人脸识别、面部活体检测、指纹验证和\
  \ `OTP`（一次性密码）验证。人脸识别在该系统中通过级联分类器（包括 Haar 特征提取）实现。通过跟踪不同的正方形形状来分析跨图像的帧。论文提出了一种无卡快速取款服务系统，其中安全性通过人脸识别和活体检测提供，并辅以指纹检查。使用账户持有者的存储信息也可以进行次级用户交易，其中\
  \ `OTP` 验证将安全性提高了许多倍。工作模型的演示结果验证了所建议的智能、安全且快速的 ATM 服务理念 [1]。\n\nEgho-Promise 等使用\
  \ `Wireshark` 和数据包捕获工具分析 ATM 流量数据，并确定谁从哪个账户偷取了钱。这种方法有利于数字取证人员创建针对犯罪分子的证据，但使用这种方法非常复杂\
  \ [[2]。\n\nPriyanaka Hemant kale 等得出结论，在从 2016 年到 2018 年的三年里，随着 ATM 日常使用量的增加，犯罪也在迅速增加。此外，欺骗者使用的各种策略之一是在\
  \ ATM 中植入恶意软件，这最终导致用户敏感/关键信息的泄露，这些信息可能被用于多种伤害方式，例如操纵机器将每一分钱都交给欺骗者。还有其他臭名昭著的技术，如银行侧录（card\
  \ skimming）和持卡（card trapping）。在侧录中，侧录设备看起来非常像 ATM 中一直存在的纸板插槽，使其更难发现，导致 ATM 使用不安全。此外，在持卡中，欺骗者巧妙地安装了禁用出钞器的工具，阻止用户拿取从\
  \ ATM 取出的现金。还有类似的方法，如肩后窥视（shoulder surfing）。欺骗者在原始 ATM 输入设备上方安装伪造输入采集设备，使其看起来一切正常。当用户输入\
  \ `PIN` 时，伪造模块会记录 `PIN`，使用户的账户变得脆弱。\n\n为了防止这些犯罪，所提系统使用不依赖处理器的 `microcontroller`，并还可以安装\
  \ `GSM`（其全称为全球移动通信，是一种用于手机的移动系统），它可以与 `microcontroller` 等设备进行串行通信。为了使其更安全，可以安装指纹传感器、键盘和\
  \ `LCD` 来验证并引导用户使用 ATM [3]。\n\nSrivatsan Sridharan 等描述了 ATM 是如何为用户提供即时资金的机器。然而，在用户提取金额之前，他们必须向机器输入安全的\
  \ `PIN`。发明该系统的初要目标是在需要时以闪电速度为银行客户现金。在现有机器中，除了 `PIN` 的保密性外，缺乏安全保障 [4]。表 6.1](#Ch06.xhtml#cap_lbl0048)\
  \ 显示了不同的 ATM 安全模型对比。\n\n## 6.3 问题描述\n\n现在，插卡、侧录、持卡等 ATM 欺诈案件正在增加。ATM 设备无法检测此类欺诈。此外，无法判断是谁从账户提取资金。因此，为了解决这些问题，本章在\
  \ ATM 中引入了生物识别扫描。因此，研究重点是“使用人脸识别实现并增强 ATM 安全”。\n\n| **序号** | **作者 (年份)** | **论文标题**\
  \ | **使用的技术** | **识别出的差距** |\n| --- | --- | --- | --- | --- |\n\n\n\n\n\n| ID |\
  \ 作者 | 标题 | 描述 | 评价 |\n| --- | --- | --- | --- | --- |\n| 1 | Srivatsan Sridharan\
  \ (2014) | 自动取款机（ATM）服务的身份验证安全性 | 该系统提供了以下功能：在远程终端提取货币时，使用 PIN 码和一次性密码（Pk）通过手机验证用户身份。\
  \ | 整个核心思想围绕手机展开，但如果手机被盗，对用户来说将是一个重大的安全漏洞。 |\n| 2 | Priyanka Hemant Kale (2019)\
  \ | 基于嵌入式的 ATM 卡安全设计 | 在本文中包含了两种方案：一次性密码（OTP）和指纹识别以确保交易成功。全球系统（GSM）用于生成 OTP，并将 OTP\
  \ 发送到关联银行账户的手机上。用户的指纹必须与银行账户关联，以便使用完成成功交易。 | 本文的一个显著缺点是它们提供了两种访问 ATM 的方式，而不是增加安全层。如果手机被盗，访问账户仍然存在风险。\
