  \ Journal of Computational Intelligence Systems, Vol. 2020.\n\n\n\n\n\n### 摘要\n\n\
  各种在线消息服务的可用使得任何人都能与所有人进行互动。在这种情况下，儿童甚至青少年正成为网络捕食者的猎物，这些猎者装成无辜的用户，试图为了性目的操纵儿童的情绪。这就是网络儿童剥削发生的方式。因此，有必要分析猎物与捕食者的对话，并将其分类为好或坏。在过去的二十年里，有各种方法被采用，最新的一种方法使用了深度学习的概念。深度学习根于机器学习和神经网络，是一个以人脑结构和功能为灵感演化出的概念。尽管深度学习最初仅用于分类问题，但现在被用于解决各个领域的问题。本章将首先介绍用于识别网络性捕食者的各种机器学习模型，然后介绍解决相同问题的各种深度学习模型。本章的最后一部分将比较深度学习模型与机器学习模型的性能。本章可以被视为走向识别网络捕食者问题以及使用深度学习解决该问题的历程。\n\
  \n# 5.1 引言\n\n除了灾难、犯罪和其他威胁外，公共安全还应该考虑为社交媒体上的儿童提供一个安全的环境。通常情况下，诱导（grooming）是指捕食者利用猎物的情绪来满足其性意图的过程。如果同样的事情在网上发生，那就是网络诱导。分析离线对话以识别聊天捕食者仅仅是事后诸救。因此，需要自动化方法在对话过程中识别捕食者和捕食性聊天。考虑到这一目标，图\
  \ 5.1 展示了所探索的四种假设。\n\n## 5.2 检测网络性捕食聊的机器学习模型\n\n尽管在《联合国儿童权利公约》通过 17 年后，儿童剥削在现实中和网络上都大幅增加。图\
  \ 5.1 展示了目前可用于打击儿童虐待的各种 AI 工具。\n\n![图 5.1 问题的假设。](img/fig00026.jpg)\n\n图 5.1 问题的假设。\n\
  \n这些工具侧重于通过文档、图像、网络流量和广告识别网络儿童虐待。然而，问题在于如何利用捕食者与受害者之间的聊天或文本信息来识别捕食性对话。机器学习和深度学习是解决此类问题最广泛的方法。图\
  \ 5.3 展示了用于解决此问题的各种机器学习模型。以下是使用深度学习解决问题的各种模型：\n\n![图 5.2 检测网络捕食者的 AI 工具。](img/fig00027.jpg)\n\
  \n**图 5.2 检测网络捕食者的 AI 工具。**\n\n1. 递归神经网络\n2. 循环神经网络\n3. 长短期记忆和\n4. 卷积神经网络。\n\n本章展示了深度学习方法如何解决识别网络性捕食性聊天的问题，以及这些方法在解决相同问题时是如何优于机器学习模型的。\n\
  \n### 5.2.1 深度学习\n\n深度学习是研究人员在数据收集、数据分析和数据解释方面的一个近期趋势。深度学习基于人工神经网络，属于机器学习家族。“深度（deep）”一词源于数据穿过多个层级结构的逻辑。每种算法都以非线性方式转换数据以产生输出。深度学习自动化了预测分析过程，从而使其比机器学习模型更简单、更快速。\n\
  \n![图 5.3 检测网络性捕食性聊的机器学习模型。](img/fig00028.jpg)\n\n图 5.3 检测网络性捕食性聊的机器学习模型。\n\n深度学习模型可以架构为深度神经网络、强化学习、卷积神经网络和深度信念网络。每种架构在虚拟助手、医疗健康、娱乐等方面都有自己的应用。特别是针对网络聊天捕食者识别问题，使用了以下架构，并在图\
  \ 5.4 中所示：\n\n* 递归神经网络\n* 循环神经网络\n* 长短期记忆和\n* 卷积神经网络\n\n#### 5.2.1.1 递归神经网络\n\n\
  递归神经网络引入于`1`.识别递归结构是初始任务。它有助于识别片段并形成整体。除了合并图像，该方法也适用于自然语言。测试结果优于以往的方法。\n\n![图 5.4\
  \ 检测网络捕食性聊的深度学习模型。](img/fig00029.jpg)\n\n图 5.4 检测网络捕食性聊的深度学习模型。\n\n表达更长的句子对于语义词仍然是一个挑战。在转向组合性时，需要强大的模型和评估资源来进行情感推断。情感句库引入于`2`以解决这一问题。该句库在\
  \ 1 万万句的解析树中包含 20 万个短语。这是一个另一个威胁，通过引入递归张量网络得到了解决。在引入新的挑战和评估指标后，该模型比之前的方法性能提高了 5.4%。\n\
  \n#### 5.2.1.2 循环神经网络\n\n基于 ANN 的原理，循环神经网络使用序列数据，完成步骤的输出将作为当前步骤的输入。这使得与输入输出相互独立的传统神经网络不同。RNN\
  \ 的核心是隐藏状态，用于记忆序列信息。RNN 还可以处理时间序列数据、自然语言处理、图像描述等。\n\n在模型独立考虑每个单词的词袋方法情况下，RNN 用于处理可变长度的序列输入数据，后续输入受到观测输入的影响。RNN\
  \ 通过简单考虑时间 `t` 的输出依赖于 `t-1` 的输出而变得高效`[3]`。\n\n与其他神经网络不同，RNN 通过拥有保存所有计算值的内存降低了参数复杂度。这种特性使其在处理输入句子时更高效。序列分析中的情感挖掘类型问题也可以通过\
  \ RNN 来处理`[4]`。这被视为一种条件随机场，并被声称优于现有方法。\n\n\n\n\n传统的反向传播算法考虑了每一个之前时间戳的偏导数。`RNN` 使用了一种名为随时间反向传播（back\
  \ propagation through time）的类似算法变体。由于时间戳过多，它需要计算更多的梯度。这个问题通过引入长短期记忆网络 [5] 得到了解决。\n\
  \n在用深度学习处理自然语言时，词嵌入（word embedding）是关于词汇表示的核心思想之一。在此之前，传统的词袋（bag of words）方法通过使用每个单词的频率等特征向量来分析文档。相比之下，`LSTM`\
  \ 被用来用向量表示每个单词。随后，在末尾，通过拼接向量表示形成特征矩阵。这种个体的向量表示被称为嵌入（embedding）。该技术最初是基于反向传播误差引入的\
  \ [6]]。\n\n随着时间的推移，基于词嵌入的技术被称为语言模型。由 [7] 提出的其中一种重要模型已经优于所有其他模型。主要所使用的方法被称为 skip-gram\
  \ 方法，现在以 `word2vec` 之名在研究人员中流行，并用于表示句子和段落。\n\n#### 5.2.1.4 卷积神经网络\n\n卷积神经网络是人工神经网络类的深度学习算法之一。它简称为\
  \ `CNN` 或 `ConvNet`，也称为 `SIANN`，即移动不变 ANN。尽管它最初仅用于图像输入，但现在被广泛应用于音频或语音输入。在自然语言处理（NLP）和文本挖掘领域已取得了理想的结果。`CNN`\
  \ 通过减少对各种数据集所需的预处理，展现了其优于其他 `NNs` 的优越性。`CNN` 通过具有以下三层与其他神经网络区别来：\n\n* 卷积层\n* 池化层\n\
  * 全连接层。\n\n如何分步设计用于句子分类的 `CNN`，最早出现在 [8][9] 中。作者描述了仅用一层卷积和池化的句子分类方法。这在几乎所有的文本分类中都是很常见的，为了帮助读者更好地理解，在此对其进行了描述。它甚至被称为\
  \ `CNN` 历史上的“全百科圣经”。\n\n拼接形式的词嵌入将是输入，它将被分成若干区域，以便每个区域都有自己的过滤器（filters）。这里的过滤器无非线性变换后的特征。然后，输入序列将通过过滤器形成一个向量。实际的卷积发生在过滤器移除一些连接以导致一个部分网络时。然而，实际问题在于输出，因为它的大小会变化。\n\
  \n此外，这时需要池化层通过对所有元素的平均值将其变为单个值。这就是为什么池化层放置在卷积层之后的原因。也有另一个原因。池化有助于 `CNN` 锁定抽象数据的特征。由池化层完成这项工作被称为下采样程序（subsampling\
  \ procedure）。由于这种下采样程序，每一层将捕获到越来越多抽象的特征。因此，输出层将变成一个全连接层。输出值将具有固定的大小 [10]。\n\n[11]\
  \ 提出了一种统一的语言框架。特定的词嵌入方法用于各种 NLP 任务，如分块（chunking）、语义角色标注和词性标记。在该架构中有窗口（window）和句子（sentence）两种方法，主逻辑将类似于第一层的编码，并通过使用字典中的索引完成。在窗口方法的情况下，单词数量是固定的；在句子方法的情况下，单词数量将根据句子的大小而变化。\n\
  \n[12] 的作者使用了词嵌入，特别是 `word2vec` 来获取特征向量，然后应用实际的 `CNN` 进行情感分析和句子分类。仅通过一层卷积和池化，该方法使用\
  \ `SoftMax` 分类器产生了令人惊讶的结果。\n\n[11] 中通过增强池化机制以获取语义关系并形成特征图，动态 `CNNs` 用于句子分类。由于模型的复杂性，它并没有被广泛使用。\n\
  \n[13] 提出的在线捕食者识别的里程碑使用了深度卷积神经网络。研究人员在构建检测捕食性对话的模型时面临的三个重大挑战是：\n\n1. 虽然 `RNN` 对于较小的单词或句子集效果良好，但对于包含大量短语、段落和许多句子的输入序列，它变得难以处理。\n\
  2. 像 `word2vec` 这样的词嵌入技术在通用问题上运行良好，但在在线捕食者识别上并不理想，因为因为它从新闻数据集和网络文档获取训练数据，这会导致误分类。\n\
  3. 使用词袋方法会导致特征空间变得非常稀疏。\n\n为了解决这些挑战，在 [14] 中，特征向量被直接馈入卷积层进行内部学习。\n\n![图 5.5 PAN\
  \ 2012 数据集的特征。](img/fig00030.jpg)\n\n图 5.5 PAN 2012 数据集的特征。\n\n这种特定方法利用硬件级并行性和基于神经网络的学习模型，在配备\
  \ 24 GB 内存的 `K80 GPU` 2496 个处理器核心上处理。感谢 Perverted-Justice，他通过伪装青少年创建了 PAN2012 数据集。该数据集现在已公开，并被几乎所有的在线捕食者识别解决方案所使用。图\
  \ 5.5 显示了 PAN2012 数据集的特征。\n\n![图 5.6 深度学习工具的比较。](img/fig00031.jpg)\n\n图 5.6 显示了深度学习工具及其优点的比较。\n\
  \n数据集被安排为两个 XML 文件，一个用于训练，另一个用于测试。解析 XML 文件以从每个会话中提取每个参与者的消息。这种示例显示在 图 5.7 中。\n\n\
  ![图 5.7 对话的片段。](img/fig00032.jpg)\n\n图 5.7 对话的片段。\n\n## 5.3 结论\n\n\n\n\n本章重点介绍了识别在线掠夺性聊天的问题，然后介绍了用于克服这些问题的各种解决方案。文中非常清晰地阐述了深度学习算法在许多方面都优于机器学习模型。特别是在深度学习中，深度卷积神经网络提供了极具前景的结果。除了算法性能外，还需要关于并行计算的大量硬件支持以获得更好的结果。`RNN`\
  \ 和 `LSTM` 尽管存在局限性，但在语音识别和文本分析中被证明是高效的。由于文本分析是解决掠夺性聊天识别问题的内核，`DCNN` 可以通过监督 `DCNN`\
  \ 进一步扩展。\n\n![图 5.8 分组性能对比。](img/fig00033.jpg)\n\n`图 5.8`](#Ch05.xhtml#bck_cap_lbl0047)\
  \ 分组性能对比。\n\n## 5.4 致谢\n\n我们诚挚地感谢我们所属的机构：班加罗尔的 CMR 理工学院、班加罗尔的总统大学、班加罗尔的 Jain Deemed-to-be\
