    process LCA methods, but IO-LCA models can be useful as screening or model validation
    tools in LCA, provide supplementary data for a process LCA model or, in some cases,
    fulfill both the inventory and impact assessment steps in an LCA. Hybrid LCA is
    the combination of process and IO-LCA methods. Surrogate LCAs, which are described
    with more detail in the ML in LCA section, are ML algorithms trained on process
    LCA data to predict LCA results.


    # Process LCA


    Process LCA, described with more detail in the General Methods for Process LCA
    section, involves modeling the production of a good or service as the sum of “unit
    processes,” which are the LCA-practitioner-defined subsystems that make up the
    system of interest. The guidelines and standards for process LCA practitioners
    are outlined in the International Standards Organization (ISO) 14,040 and 14,044
    (ISO 2006a; ISO 2006b). For each unit process, the LCA practitioner must identify
    and quantify the necessary resource inputs to the process and any outputs generated,
    including products, byproducts, and environmental discharges. Although the impacts
    of services can theoretically be modeled with process LCA methods, process LCA
    generally does not account for the indirect inputs related to human labor (Junnila
    2006).'
  merge: -1
  img_proc: true
- pgno: 3
  md: 'Process LCA databases provide unit process data for a wide range of activities,
    from growing of crops to plastics production. There are many free and commercial
    software packages to support process LCA. This information is presented in more
    detail in the Tools and Data Sources for LCA section.


    # IO-LCA


    Input-Output LCA (IO-LCA) tools can provide quick, inexpensive, holistic estimates
    of resources needed per dollar of economic activity in a sector. Transactions
    between all sectors included in an IO model are represented in an N by N table
    or matrix, where N is the number of sectors. As a result, IO-LCA is capable of
    quantifying all transactions between modeled sectors, even indirect transactions
    such as those that occur through service industries (Hendrickson et al. 1997).
    IO transaction data is extended to produce environmental impact estimates using
    sector-level coefficients corresponding to non-renewable resource use and pollutant
    emissions. One of the weaknesses of IO-LCA is that analyses are limited to the
    sectors specified in the Input-Output tables of each tool, and IO sectors are
    generally aggregated to much larger than product-scale (Castellani et al. 2019).


    For more information on IO-LCA, see Chapter 8 of Life Cycle Assessment: Quantitative
    Approaches for Decisions that Matter (Matthews et al. 2014). Discussion of available
    IO tables and software for IO-LCA is in the Tools and Data Sources for LCA section.


    # Hybrid LCA


    A hybrid LCA is generally a Process LCA in which an IO-LCA model provides input-output
    data or environmental impact data for one or more unit processes, usually because
    the process or processes are not included in LCA databases.


    # Comparison of types


    Both process LCA and IO-LCA have strengths and weaknesses. In general, process
    LCAs strength lies in its flexibility to assess product systems at any desired
    resolution; unfortunately, full process LCAs can be time consuming and expensive.
    In contrast, the resolution of IO-LCA is limited to the sectors defined in a corresponding
    IO table; however, once constructed, an IO table enables generation of LCA results
    for all included sectors are able to account for impacts associated with indirect
    transactions between industries that are often outside the scope of process LCA
    models. Hybrid LCA models allow the LCA practitioner to take advantage of the
    strengths of both process and IO-LCA models. For more comparisons of process and
    IO-LCA methods, see publications from Hendrickson et al. (1997), Junnila (2006),
    and Castellani et al. (2019).'
  merge: -1
  img_proc: true
- pgno: 4
  md: '![](img/ac82f2e55074ec39b384b4e372aab70e_4_0.png)


    Fig. 8.2 Steps of an LCA as defined by International Standards Organization (ISO)
    14040. Adapted from ISO 14040''s Fig. 8.1.


    # General methods for process LCA


    A standard process LCA has four major components: 1) goal and scope definition,
    2) inventory analysis, 3) impact assessment, and 4) interpretation and analysis
    (ISO 2006a). These components are often addressed sequentially and refined iteratively
    throughout the process of building an LCA model (Fig. 8.2).


    # Goal and scope definition


    The first step in LCA is to develop a clearly defined goal that specifies the
    system of interest, the intended use of model results, and the intended audience.
    For example, the goal of an LCA on beef may be “to quantify the environmental
    impacts of beef” to “identify areas of potential improvement in the process” or
    “enable consumers to compare the impacts of beef to those of other foods” (Cederberg
    et al. 2003; Dick et al. 2015). The scope of the LCA is then defined such that
    the goal can be accomplished. Defining the scope means setting the boundaries
    of the system to be modeled (e.g., from raw materials extraction to consumption
    or disposal by the consumer), specifying the level of detail required for the
    analysis, and choosing a functional unit. The level of detail required is defined
    by the scale of the unit processes selected. In a beef LCA, high-level unit processes
    include fertilizer production, crop and pasture farming, cattle raising, and slaughter
    (Fig. 8.3).'
  merge: -1
  img_proc: true
