  md: '![](img/ac82f2e55074ec39b384b4e372aab70e_20_0.png)


    Fig. 8.9 Hypothetical global warming potential (GWP) response surface for feedstock
    conversion efficiency and coproduct utilization rate variables in the ethanol
    production system. The z-axis is GWP, and the x and y axes are feedstock conversion
