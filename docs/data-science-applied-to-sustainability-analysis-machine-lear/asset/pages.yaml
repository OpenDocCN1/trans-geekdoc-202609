    relationships between LCA inputs and outputs. For example, a regression model
    of the relationship between the global warming potential (GWP) of ethanol, the
    efficiency of feedstock conversion, and the rate of ethanol feed coproduct utilization
    might produce a response surface such as the one shown in (Fig. 8.9). Generating
    mathematical representations of LCA models would enable characterization of changes
    in results with changes in multiple input variables at once and might, in some
    cases, indicate an optimized set of production conditions for minimizing an impact
    category of interest, like GWP.


    # Scenario analysis


    As previously discussed in the Estimating Inventory Flows section, supervised
    learning algorithms can be used to produce models that predict system performances,
    and these predictions can be useful in scenario analyses where performance data
    is not available. In the examined building energy consumption study (Deng et al.
    2018), a supervised learning algorithm was trained to estimate system performance,
    in this case building energy consumption. For scenario analysis, system performance
    variables such as energy consumption or emissions could be predicted for modified
    input variables such as light bulb types or climate.


    Complex optimization scenario analyses in LCA could be aided by both unsupervised
    and reinforcement learning algorithms. In order to evaluate the potential for
    near'
  merge: -1
  img_proc: true
- pgno: 21
  md: 'term scale-up of cellulosic fuel production, Mueller-Warrant et al. (2010)
    determined optimal placements of straw-to-energy conversion sites given the location
    and quantity data on straw production using a K-means algorithm, which is a type
    of unsupervised clustering algorithm. Reinforcement learning is often utilized
    to model scenarios with continuous decision making under specific optimization
    constraints, so reinforcement algorithms could also be applied to generate LCI
    data for optimized scenarios. As an example, Wu et al. (2018) use deep Q learning
    (DQL), a type of reinforcement learning, to model optimal energy management strategies
    for hybrid electric buses (HEBs).


    # Conclusion


    LCA relies on inventory and impact characterization data to quantify environmental
    impacts of products and processes. Inventory analysis requires data on a system''s
    life-cycle inputs and outputs, and impact characterization requires us to understand
    how chemical emission and other changes in environmental condition affect human
    health and ecosystems. Where sufficient training data exist, and the more data,
    the better, ML algorithms can be used to model relationships and predict missing
    datapoints. Using ML to enhance environmental data collection and optimize systems
    might also improve availability of inventory and impact characterization data.


    In order to enable future applications of ML in LCA, data collection efforts should
    be focused on system performance (e.g., energy use, emissions, or waste production)
    and the design-phase drivers of performance measures, and on quantifying human
    health and the health of ecosystems under changing environmental conditions. In
    particular, more data characterizing nascent technologies (e.g., space resources)
    will be needed to drive future LCA studies and any corresponding applications
    of ML for these systems.


    # LCA of ML


    Although the focus of this chapter is on ML applications for LCA, it may be of
    interest to data science and sustainability audiences to note that researchers
    have also been working to quantify the environmental impacts of training complex
    ML models, which can demand significant computational resources (Strubell et al.
    2019). Strubell et al. (2019) estimated the greenhouse gas (GHG) emissions associated
    with training, tuning, and experimenting with a natural language processing (NLP)
    algorithm at about 35.7 tons CO₂ equivalents. This is greater than twice the yearly
    GHG emissions of an average American, about 16 tons CO₂ equivalents.


