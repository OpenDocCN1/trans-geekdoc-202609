- pgno: 15
  md: '# Tools for ML


    With an ever-expanding set of ML tools, it is not possible to provide a comprehensive
    list. Some of the most common freely available and open source tools for building
    ML models include python libraries such as PyTorch, Scikit-learn, and Theano;
    Google’s TensorFlow; and Microsoft’s Cognitive Toolkit (CNTK), Weka, and KNIME.
    For those who are just getting started using ML, some good resources are Andrew
    Ng’s Machine Learning course on Coursera, and the OCDevel Machine Learning Guide
    podcast.


    # ML in LCA


    Potential applications of ML in LCA are numerous (Fig. 8.8), but which algorithms
    are useful will depend on the goal, the type of data, and size of the dataset.
    In this review, we found that ML has been applied for LCA in three areas: surrogate
    LCA development using ANN algorithms (Park et al. 2003; Sousa et al. 2006); CF
    estimation with multivariate linear regression (Slapnik et al. 2015); and sensitivity
    analysis with linear regressions (Heath et al. 2009). Additionally, ML has been
    applied outside LCA in data


    ![](img/ac82f2e55074ec39b384b4e372aab70e_15_0.png)


    *Surrogate LCA is not an LCA step, but a method of estimating full LCA results


    Fig. 8.8 Applications of machine learning (ML) in life cycle assessment (LCA).
    Dark green application areas indicate parts of LCA in which we have seen ML algorithms
    applied in our review. Light green applications indicate parts of LCA in which
    ML could be applied in the near future, considering its application in similar
    areas outside of LCA. The ML types specified for each application are general
    recommendations based on the anticipated datasets or goals associated with the
    application.'
  merge: -1
  img_proc: true
- pgno: 16
  md: 'cleaning, predicting system output flows or performance, ecosystem informatics,
    and system optimization. From these methods, ML algorithms could have new applications
    screening or cleaning datasets for LCI, estimating flow data for unit processes,
    improving the quality and quantity of data used to determine CFs, and generating
    optimized scenarios.


    According to ISO 14040 section 4.1.8, LCA data and modeling should be based on
    natural science when possible. Estimates and other information produced using
    machine learning algorithms can certainly fulfill this criterion with sufficient
    quantities of input data and, in the case of supervised learning, model validation.
    Model transparency will also be important for acceptance of ML methods within
    LCA methodology.


    # ML for surrogate LCAs


    Within this space, ML algorithms have been used by LCA practitioners to develop
    surrogate LCA models that use product design parameters to estimate LCA results
    for new products. The term “surrogate LCA” seems to be used exclusively to describe
    ML algorithms trained on process LCA data to predict LCA results. One of the main
    goals of the surrogate LCA is to enable product designers to predict the environmental
    impacts of a new product system or process. Several studies have used ML to develop
    surrogate LCA models using product descriptors and existing LCI or LCA results
    (Sousa et al. 2000; Park et al. 2003; Sousa et al. 2006).


    Sousa et al. (2000) tested the ability of an ANN trained to predict life cycle
    energy consumption from a set of 18 carefully defined project concept descriptors.
    The project concept descriptors were chosen based not only on strength of correlation
    with LCI data, but also on survey results indicating what designers are likely
    to know about a product in the early phases of development. Noting that correlations
    between descriptors and LCI data improved when examined for narrower classes of
    products (e.g., durable products only), they trained two ANN models: one for products
    with high use-phase energy consumption (HUPEC), and another for products with
    low use-phase energy consumption (LUPEC). The recognition that different classes
    of products have distinct relationships between product descriptors and LCI data
    has prompted further research to define appropriate groupings for products (Park
    et al. 2003; Sousa et al. 2006).


    The HUPEC and LUPEC models were trained on the product descriptors and life cycle
    energy consumption data from full LCAs of 103 and 55 products, respectively. These
    included vehicles, plastics, paper products, and more. The models were tested
    using six products with known LCA results that were not in the training dataset:
    an internal combustion vehicle, refrigerator, vacuum, chair, coffee filter, and
    antifreeze. The predicted life cycle energy consumptions of products in the HUPEC
    group were all within +/-40 percent of the life cycle energy consumption estimated
    in the full LCAs for these products. In the context of LCA, where differences
    of this magnitude are common between results for the same product, a maximum error
    of 40 percent is'
  merge: -1
  img_proc: true
- pgno: 17
  md: 'encouraging. Differences between predicted and full LCA results were larger
    for products in the LUPEC group, but still close enough that the ranking of all
    six products from greatest to least energy consumption is the same using the model
    predictions as it is with the full LCA results. These findings led to development
    of the Sustainable Minds tool, which uses design-phase product descriptor inputs
    to produce comprehensive LCA results (Sousa 2008).


    # ML in LCI


    The LCI step focuses on collecting data for the model. ML has not yet been applied
    to LCI, but applications of ML in cleaning sensor data and predicting the performance
    of buildings could inform future ML in LCI for data cleaning and estimating inventory
    flows.


    # Data cleaning


    Automated data collection is susceptible to errors that can be time consuming
    to find and correct. For LCA practitioners using automated data collection for
    their LCI or to inform impact CFs, deep belief networks (DBN) might be useful.
    Dietterich (2009) used a Gaussian DBN to clean temperature sensor network data.
    The Gaussian DBN acted as a filter, labeling incoming data from wireless sensors
    as “valid” or “faulty” using probabilistic inference based on learned correlations
    between sensors in the network and replaced “faulty” values with a predicted most
    likely value.


    # Estimating inventory flows


    ML has been used to predict performance of systems from system properties. Performance
    data, as it relates to material and energy demands or production of waste and
    emissions, is useful in the LCI step. Studies using ML to predict building energy
    use are common (Zhao et al. 2012; Robinson et al. 2017; Deng et al. 2018), and
    their results demonstrate that models developed using ML could be used with current,
    publicly available data to estimate the performance of new buildings in the design
    phase or the performance of existing buildings scenarios with modified input variables.
    It is likely that ML has been used to predict performance data for other systems
    as well.


    Deng et al. (2018) used a variety of ML algorithms to build models to estimate
    energy use intensity (EUI) for US commercial office buildings. The models were
    calibrated with a subset of 2012 Commercial Building Energy Consumption Survey
    (CBECS) microdata, comprised of 19 continuous variables such as square footage,
    occupancy percentage, and daylight percentage, and 56 categorical variables such
    as window glass type, building owner type, and whether there are occupancy sensors.
    The algorithms used were linear regression, lasso regression, Support Vector Machine
    (SVM), ANN, gradient boosting, and random forest.'
  merge: -1
  img_proc: true
- pgno: 18
  md: 'Despite the nonlinearity of input data, which favors the more complex learning
    algorithms, the study found that the different algorithms performed similarly.
    Support Vector Machine and Random Forest models’ prediction errors were only about
    10–15 percent lower than those of multiple linear regression models for Total
    EUI, and linear regression models outperformed other models in prediction of Plug
    Load EUI. Tests of input variable importance also suggested that the CBECS input
    variables used have low predictive power to map actual energy consumption, at
    least for the ML techniques applied. This study underlines the importance of having
    sufficient input data that is well correlated with the value to be predicted;
    although more complex algorithms may be able to improve model performance where
    the relationships between input and output variables are nonlinear, they cannot
    fix problems related to data availability.


    # ML in LCIA


    ML has been used in LCIA to estimate values of ecotoxicity CFs for uncharacterized
    chemical compounds. In the future, ML could also help characterize the environmental
    mechanisms used to define CFs as it improves environmental data collection related
    to ecology and human health impacts. Data collection supported by ML might even
    support development of new LCIA categories.


    # CF estimation


    Slapnik et al. (2015) conducted an LCA of Slovenia to produce region-specific
    normalization factors for LCA practitioners. Of the 440 chemical flows in their
    LCI, 139 had no impact characterization factors. Using the Weka 3.6.10 Java package
    for ML, physical–chemical, toxicological, ecotoxicological, and existing impact
    characterization data at the intersection of three chemical databases (PPDB, ReCiPe
    1.08, and FURS), they were able to train linear regression models for terrestrial,
    freshwater, and marine ecotoxicity, and human toxicity. With limited CF availability
    in ReCiPe, they were able to set up 75 training instances for the ecotoxicity
    categories and 41 training for human toxicity. By training 5 models for each impact
    category that ranged from including the maximum number of available chemical attributes
    to only those attributes available for the most data limited compounds, the researchers
    were able to produce validation CF estimates that were well correlated with existing
    ReCiPe CFs (>0.70 on average). However, the average root relative squared error
    was pretty high—about 70 percent for model predictions—so the researchers note
    that results derived from certain estimated CFs should be taken into consideration
    with care.


    # CF definition


    While estimating CFs using the properties of chemical compounds may be useful
    in cases where environmental data are not available for these compounds, a more
    direct'
  merge: -1
  img_proc: true
- pgno: 19
  md: 'approach to the data gap would be to improve the ways in which we characterize
    environmental impacts, including impacts on human health and on ecosystems. The
    studies reviewed in this section demonstrate applications of ML in improving estimation
    of human health impacts driven by emissions of particulate matter, and in growing
    ecological databases by automating population studies.


    To estimate hospital admissions for respiratory diseases in relationship to by
    particulate matter (PM) concentrations and meteorological variables like humidity,
    researchers have used generalized linear models (GLMs), which are a type of regression
    (Pan et al. 2019), ANNs (Tadano et al. 2016), and ANNs with ensembles (Araujo
    et al. 2020). Results from these studies could contribute to characterization
    of human health effects for LCIA not only of PM emissions but also of emissions
    that contribute to climate change.


    Dieterich (2009) discusses potential for ML in ecosystem informatics and sustainability,
    detailing a study using image recognition to identify different species of stoneflies.
    Standard dictionary image recognition methods were not sufficient to produce reliable,
    unsupervised classification of stoneflies with an error rate of 16.1 percent.
    Alternative methods using stacked random forests and boosted dictionaries performed
    much better, with error rates of 6.4 and 4.9 percent, respectively. Using ML to
    collect ecosystem data could improve characterization of ecosystem health effects
    that occur in relation to environmental conditions.


    # ML in interpretation and analysis


    ML has been used in the interpretation and analysis step of LCA for sensitivity
    analyses and could be used for scenario analyses to generate inventory data corresponding
    to new conditions or constraints on the system of interest.


    # Sensitivity analysis


    Sensitivity analysis in LCA requires varying model inputs, especially those with
    high uncertainty, to understand how the magnitude of each input affects the LCA
    results. This can be as simple as running the model with a particular input adjusted
    +/-50 percent, and as specific as a varying model input over a known distribution
    based on detailed input data. Another approach to sensitivity analysis in LCA
    used by Heath et al. (2009) is to assess the relationships between LCA inputs
    and outputs using regressions.


    Heath et al. (2009) used simple linear regressions in the sensitivity analysis
    of an ethanol LCA. The data for each linear regression was generated by running
    models with a range of input parameter values; the range of input parameters is
    the feature set, and the corresponding outputs are the labels. As an extension
    of this application, multivariate regressions could be used to conduct multivariate
    sensitivity analyses for each environmental impact category. These would enable
    mathematical representation of the'
  merge: -1
  img_proc: true
