- pgno: 6
  md: 'Defining a functional unit is a critical step in LCA. The functional unit is
    the quantified performance of the product system for use as a reference unit (ISO
    2006a). An appropriately defined functional unit allows the impacts of a product
    to be compared fairly to those of other products with the same function. In a
    beef LCA, the appropriate functional unit could be kilograms of beef, or a unit
    that quantifies nutritional content, like calories or protein; in these cases,
    all environmental impacts in the beef LCA would be reported per kilogram beef,
    per calorie, or per protein. The reported impacts could then be compared to environmental
    impacts estimated for other food products, like beans or chicken.


    # Inventory analysis


    The inventory analysis step, also known as the life cycle inventory (LCI), involves
    identifying all the relevant inputs (e.g., energy and resources) and outputs (e.g.,
    products created and emissions) of the system of interest. However, we often want
    to be able to quantify environmental impacts at a finer resolution than for the
    entire system of interest, so inputs and outputs are identified or estimated for
    each unit process within the system of interest. For a corn production unit process,
    inputs might include seeds, water, fertilizers, machinery, and energy. Outputs
    include the corn product, and might also include nutrient losses from the fertilizers,
    and emissions from burning fuel to power agricultural equipment. Taking inventory
    of all the inputs and outputs to every unit process can be a huge endeavor. Luckily
    for LCA practitioners, much work has already been done to build databases of common
    unit processes and their associated inputs and outputs. However, LCA practitioners
    should consider the scope and age of a process dataset, and the location for which
    it was developed when determining whether it is appropriate to use in any particular
    LCA. For more on tools and resources for LCA see the **Tools and Data Sources
    for LCA** section.


    # Impact assessment


    Also known as life cycle impact assessment (LCIA), the impact assessment step
    converts the inventory data into meaningful environmental impacts. LCIA is used
    to improve understanding of the environmental significance of output flows identified
    in the LCI. Typical environmental impact categories in LCA include global warming,
    acidification, eutrophication, ozone depletion, smog formation, ecotoxicity, and
    human health carcinogenics, human health non-carcinogenics, resource depletion,
    and respiratory effects). The LCIA calculations are performed using impact assessment
    tools, which utilize databases of characterization factors (CFs). CFs are based
    on environmental mechanisms and are applied to convert life cycle inventory analysis
    results to the standard units of each impact category. They can be derived such
    that they convert to midpoint or endpoint environmental impact categories (Fig.
    8.4).'
  merge: -1
  img_proc: true
- pgno: 7
  md: '![](img/ac82f2e55074ec39b384b4e372aab70e_7_0.png)


    Fig. 8.4 Relationship between LCI results and environmental impact midpoints and
    endpoints. Characterization factors (CFs) represent environmental mechanisms and
    enable conversion of LCI results to midpoint or endpoint environmental impact
    categories. This figure is a simplified adaption of a figure from the ReCiPe LCIA
    methodology.


    Each chemical or material included in an LCIA database has a separate CF for each
    environmental impact category in the database. The impact calculation method is
    shown in Eqs. (8.1) and 8.2, where c denotes a particular emitted compound (CO₂,
    etc.), and i denotes a particular impact category (global warming, etc.).


    ```

    Impact_{c,i} = mass_c * CF_{c,i} (9.1)

    ```


    ```

    Total_{impact_i} = Σ_{c} Impact_{c,i} (9.2)

    ```


    As shown in Eq. (8.1), the impact of a particular compound (c) in a particular
    impact category (i) is the product of the mass of c emitted and the CF corresponding
    to c and i. The total impact in category i is the sum of all the compound-specific
    impacts within that category (Eq. (8.2)).


    # Interpretation and analysis


    In this step, the LCA practitioner summarizes and discusses the results of an
    LCI or LCIA, and provides recommendations based on these results. This might mean
    identifying “hotspots” of environmental impact in the product system and comparing
    results to other research; in an LCA of grassland beef production in Brazil by
    Dick et al. (2015), authors report that enteric fermentation is responsible for
    about 80 percent of total GHG emissions. Comparing these results to those of other
    beef LCAs, they note that'
  merge: -1
  img_proc: true
- pgno: 8
  md: 'other studies show lower fractions of GHG contributions from enteric fermentation
    because of higher emissions related to manure management and concentrated feeds
    in animal diets.


    LCA practitioners also often conduct sensitivity and scenario analyses. Sensitivity
    analyses are conducted to test assumptions and assess uncertainty in results.
    This is done by varying model inputs over a range of potential values and observing
    how this changes the model results. For example, if the forage to concentrate
    diet ratio in a beef cattle LCA is uncertain, environmental impact results should
    be produced over the range of realistic forage to concentrate ratios. In a scenario
    analysis, process inputs are adjusted to represent conditions different from those
    of the original system of interest in order to assess differences in environmental
    impacts. In the beef LCA example, scenario analysis could be used to predict effects
    of climate change on the environmental impacts associated with beef production.


    # Uses and limitations of LCA


    LCA is applied in product development and improvement, strategic planning, public
    policy making, marketing, and more (ISO 14040, 2006). LCA is generally only relevant
    for comparative analyses, such as assessing the environmental impacts of different
    designs for a particular product or multiple products with the same the function.
    LCA is useful for determining relative, not absolute, environmental sustainability—it
    can help us figure out which decision is better but does not enable us to label
    things as “sustainable” or “unsustainable.”


    # Tools and data sources for LCA


    # Process LCA


    The most popular comprehensive tools for process LCA are OpenLCA (http://www.openlca.org/),
    SimaPro (https://simapro.com/), and GaBi (www.gabi-software.com). Of these, OpenLCA
    is the only open source tool. Other comprehensive LCA tools include umberto (https://www.ifu.com/en/umberto/),
    and Sustainable Minds (http://www.sustainableminds.com/software).


    There are also process LCA tools that are limited to specific types of analyses.
    For construction, these include BEES, Athena LCA, and One Click LCA. BEES, developed
    by the National Institute of Standards and Technology (NIST), and Athena, by the
    Athena Sustainable Materials Institute, are both free software. For energy system
    LCAs, the National Energy Technology Laboratory (NETL) hosts a free LCA of Energy
    Technology and Pathways database, which includes the Grid Mix Explorer, a tool
    that allows users to browse LCI and LCIA data for regional energy mixes and model
    customized energy mixes. For transportation LCAs, Argonne National Laboratory’s'
  merge: -1
  img_proc: true
- pgno: 9
  md: 'GREET (Greenhouse gases, Regulated Emissions, and Energy use in Transportation)
    estimates energy use and emissions of fuel and vehicle technologies. In addition
    of the tools above, researchers conducting LCAs often use spreadsheets or other
    data organization programs to build custom models with data from a variety of
    sources, including process LCA databases, IO-LCA models, and academic literature.


    LCA databases contain complete LCIs for many processes and can be accessed and
    manipulated using the comprehensive LCA tools listed above. OpenLCA Nexus is an
    online repository for LCI data, providing download pathways for both free and
    for-purchase LCA databases, and a search engine that allows users to find relevant
    datasets in any of the LCA databases on Nexus. There are many free LCA databases
    on openLCA Nexus; probably the most comprehensive is the USLCI database, which
    is maintained by the National Renewable Energy Laboratory (NREL), and the USDA
    LCA collection. Popular for-purchase databases on Nexus are ecoinvent and GaBi
    thinkstep, both of which have a wide range of manufacturing process and products.


    Most LCA software packages have built-in LCIA methods. The openLCA LCIA methods
    database, which is also free on openLCA Nexus, includes a variety of impact assessment
    datasets: TRACI, USEtox, ReCiPe, ILCD, eco-indicator 99, Cumulative Energy Demand,
    and CML. Acero et al. (2015) describe these impact assessment datasets in detail
    and Landis et al. (2008) compares the differences in their results.


    # IO-LCA


    There are several freely available IO-LCA tools. These tools are typically developed
    using national-level economic data and each is therefore applicable within a specific
    country or set of countries. The first was developed by Carnegie Mellon University
    (CMU). CMUs Economic Input-Output LCA (EIO-LCA) model includes national-level
    IO tables for the United States (US), Peru, Germany, Spain, Canada, and China,
    and state-level tables for Pennsylvania and West Virginia. Other IO-LCA tools
    include the US Environmental Protection Agency (USEPA)’s Environmentally-Extended
    Input-Output (USEEIO) model for the US, and EXIOBASE, which was developed by a
    European research consortium. The latest version of EXIOBASE includes 43 countries
    and 5 “rest of world” regions. VitalMetrics’ US Comprehensive Environmental Data
    Archive (CEDA) is not free, but university faculty and students can obtain a free
    academic version.


    # Introduction to machine learning (ML)


    Machine learning (ML) is a statistical approach to studying and making inferences
    about data that utilizes a variety of algorithms suited for answering different
    types of questions. There are three main types of ML: supervised, unsupervised,
    and reinforcement learning. In supervised learning, ML algorithms can be used
    to model relationships between'
  merge: -1
  img_proc: true
- pgno: 10
  md: 'one or more independent variables and a dependent variable. In unsupervised
    learning, algorithms find meaningful patterns in datasets or sort data into groups.
    Reinforcement learning ML algorithms produce optimized plans or courses of action
    given a set of constraints or a reward system. These three main types of ML, supervised,
    unsupervised, and reinforcement learning, are described in the following sections.
    Other topics discussed are shallow and deep learning, how to choose between algorithm
    types based on the dataset or intended application, and common machine learning
    tools.


    # Types of ML


    # Supervised learning


    Supervised learning algorithms require that the modeler provide a dataset of one
    or more independent variables, and a corresponding dependent variable. In ML,
    independent variables are called features, and dependent variables are often called
    a labels or targets, but can also be thought of as the answer to a question about
    a datapoint: What is the price of this house? Is this a dog or a cat? What is
    the ecotoxicity impact CF for this substance? Features in these cases could be
    the location of the house, the size of the animal, or the octanol-water partition
    coefficient of the substance, respectively.


    With enough input data, a supervised learning algorithm can produce a model of
    the relationship between features and labels. The model is built and tested using
    at least two randomly selected subsets of the labeled data: the training set and
    the testing set, respectively. A working model can then be used to estimate the
    labels of new datapoints. If you have ever calibrated a model using experimental
    input and output data, you have used a machine learning algorithm; the fit parameters
    of your model are the result of what the algorithm has learned from your training
    data. In fact, the simplest examples of supervised learning algorithms, regressions,
    are likely familiar to most scientists. Linear or polynomial regressions can be
    used to build models for feature data with continuous label values like prices,
    masses, material flows in an LCI, or impact CFs in LCIA. For feature data with
    discrete labels that sort datapoints into categories, like “dog” or “cat,” logistic
    regressions can be useful.


    # Unsupervised learning


    Unsupervised learning algorithms operate without data labels. Instead, the algorithm
    is tasked with sorting datapoints into groups, “cleaning up” data, or finding
    structure within a dataset. One example application of an unsupervised learning
    algorithm is Google News’ grouping of similar stories so that readers can look
    at the same issue as reported by various outlets (Fig. 8.5).


    # Reinforcement learning


    With reinforcement learning, there is no training dataset. Instead, the algorithm
    is designed to try different actions or pathways within a system of rewards, goals,
    or'
  merge: -1
  img_proc: true
