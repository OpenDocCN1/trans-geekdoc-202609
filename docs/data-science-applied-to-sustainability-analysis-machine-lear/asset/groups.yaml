    term scale-up of cellulosic fuel production, Mueller-Warrant et al. (2010) determined
    optimal placements of straw-to-energy conversion sites given the location and
    quantity data on straw production using a K-means algorithm, which is a type of
    unsupervised clustering algorithm. Reinforcement learning is often utilized to
    model scenarios with continuous decision making under specific optimization constraints,
    so reinforcement algorithms could also be applied to generate LCI data for optimized
    scenarios. As an example, Wu et al. (2018) use deep Q learning (DQL), a type of
    reinforcement learning, to model optimal energy management strategies for hybrid
    electric buses (HEBs).


    # Conclusion


    LCA relies on inventory and impact characterization data to quantify environmental
    impacts of products and processes. Inventory analysis requires data on a system''s
    life-cycle inputs and outputs, and impact characterization requires us to understand
    how chemical emission and other changes in environmental condition affect human
    health and ecosystems. Where sufficient training data exist, and the more data,
    the better, ML algorithms can be used to model relationships and predict missing
    datapoints. Using ML to enhance environmental data collection and optimize systems
    might also improve availability of inventory and impact characterization data.


    In order to enable future applications of ML in LCA, data collection efforts should
    be focused on system performance (e.g., energy use, emissions, or waste production)
    and the design-phase drivers of performance measures, and on quantifying human
    health and the health of ecosystems under changing environmental conditions. In
    particular, more data characterizing nascent technologies (e.g., space resources)
    will be needed to drive future LCA studies and any corresponding applications
    of ML for these systems.


    # LCA of ML


    Although the focus of this chapter is on ML applications for LCA, it may be of
    interest to data science and sustainability audiences to note that researchers
    have also been working to quantify the environmental impacts of training complex
    ML models, which can demand significant computational resources (Strubell et al.
    2019). Strubell et al. (2019) estimated the greenhouse gas (GHG) emissions associated
    with training, tuning, and experimenting with a natural language processing (NLP)
    algorithm at about 35.7 tons CO₂ equivalents. This is greater than twice the yearly
    GHG emissions of an average American, about 16 tons CO₂ equivalents.


