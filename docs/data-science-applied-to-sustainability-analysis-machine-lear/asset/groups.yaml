    required to produce the model. The functions of models produced using shallow
    algorithms are completely transparent, but the neural networks that carry out
    feature learning in ANNs are essentially a “black box,” and there is often no
    way to mathematically represent the relationship between model inputs and outputs.
    This may be important to consider for applications like LCA where model transparency
    is highly valued. On the other hand, human effort required to produce a model
    using an ANN can be lower than that required to produce a model using shallow
    learning because feature learning in ANNs eliminates the need for manual expansion
    of the feature set. If a shallow algorithm seems like the right choice for your
    dataset, Scikit-learn’s “Choosing the right estimator” decision tree may be a
    good place to start: https://scikit-learn.org/stable/tutorial/machine_learning_map/.


    As would be done with any data source, the effects of using ML methods on model
    reliability should be considered. Model statistics can provide a starting point
    for propagation of uncertainties into model results, but conservative modeling
    choices should be made when using ML so that overfitting, which may produce artificially
    low uncertainties in model validation and testing phases, is avoided. Useful interpretation
    of LCA relies on model transparency, so extra care should be taken to explain
