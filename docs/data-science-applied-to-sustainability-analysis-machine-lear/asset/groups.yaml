    \ 185\n- 解释与分析中的 ML 186\n  - 敏感性分析 186\n  - 情景分析 187\n- 结论 188\n  - ML 的 LCA 188\n\
    \n生命周期评估（LCA）是一种数据密集型方法，用于量化环境可持续性，使研究人员能够比较和创新工艺。数据科学的快速发展领域，如机器学习（ML），已用于填补\
    \ LCA 中的数据空白，甚至开发替代 LCA 工具，利用设计阶段的产品描述符来预测新设计的环境影响。在本章中，我们介绍 LCA 方法学以及 LCA 实践者使用的工具。接下来，我们探讨不同类型的机器学习（ML）——监督学习、无监督学习、强化学习、浅层和深度学习——并讨论如何确定哪些类型的算法最适合解决特定问题或适用于某些数据集。然后我们研究\
    \ ML 算法已被如何使用，并考虑它们如何在 LCA 中用于数据筛选和清洗、生成清单数据、环境影响表征和敏感性分析。\n\n## 生命周期评估（LCA）简介\n\
    \n生命周期评估（LCA），也称为环境 LCA，是一种系统化、标准化的量化产品或工艺从原材料提取到生命周期结束所产生的潜在环境影响的方法。LCA 的方法由国际标准化组织（ISO）14,040\
    \ 系列定义（ISO 2006a；ISO 2006b）。\n\nLCA 结果可以帮助确定生产工艺的改进领域、辅助战略规划并为公共政策提供信息。LCA 使不同产品的比较成为可能，使从业者能够回答诸如，“豆类的环境影响与牛肉相比如何？”等问题（Harwatt\
    \ et al. 2017）。LCA 也用于改进产品、工艺或系统设计；一个 LCA 可以识别环境负担高的生产领域，从而能够设计和比较替代生产路径。例如，一个\
    \ LCA 可以显示用粪浆系统取代深层秸秆粪肥管理体系可减少氨和硝酸盐排放，从而降低牛肉生产的酸化和富营养化影响（Cederberg et al. 2003）。\n\
    \n## LCA 在可持续性中的作用\n\n环境、社会和经济分析共同可以帮助我们回答关于可持续性的问题（图 8.1）。与环境 LCA 类似的方法已被用于量化社会和经济影响（Lauer\
    \ 2008；UNEP 2009）；这些方法分别称为社会 LCA（S-LCA）和技术经济评估 LCA（TEA-LCA）。与环境 LCA 已有的相比，S-LCA\
    \ 和 TEA-LCA 的标准化指导有限（Landis et al. 2018）。\n\n![](img/ac82f2e55074ec39b384b4e372aab70e_2_0.png)\n\
    \n图 8.1 韦恩图显示环境、社会和经济方法如何汇聚以创建可持续系统。此三支柱可持续性模型版本改编自 Todorov et al. (2011) 中呈现的版本。可持续性三支柱模型的概念起源难以确定，如\
    \ Purvis et al. (2018) 中所述。生命周期评估（LCA）、社会 LCA（S-LCA）和技术经济评估（TEA-LCA）分别用于量化环境、社会和经济可持续性。\n\
    \n## LCA 类型\n\n通常有三种类型的 LCA：过程 LCA、投入产出（IO）LCA 和混合 LCA。国际标准化组织（ISO）14,040 专门描述了过程\
    \ LCA 方法，但 IO-LCA 模型可作为 LCA 中的筛选或模型验证工具使用，为过程 LCA 模型提供补充数据，或在某些情况下完成 LCA 中的清单和影响评价步骤。混合\
    \ LCA 是过程和 IO-LCA 方法的结合。替代 LCA 在 ML in LCA 部分有更详细的描述，是在过程 LCA 数据上训练的 ML 算法，用于预测\
    \ LCA 结果。\n\n## 过程 LCA\n\n过程 LCA 在“过程 LCA 的通用方法”部分有更详细的描述，涉及将商品或服务的生产建模为“单元过程”的总和，这些单元过程是\
    \ LCA 从业者定义的构成研究系统的子系统。过程 LCA 从业者的指南和标准概述于国际标准化组织（ISO）14,040 和 14,044（ISO 2006a；ISO\
    \ 2006b）。对于每个单元过程，LCA 从业者必须识别并量化该过程所需的资源投入以及产生的任何产出，包括产品、副产品和环境排放。虽然服务的影响理论上可以用过程\
    \ LCA 方法建模，但过程 LCA 通常不考虑与人力劳动相关的间接投入（Junnila 2006）。\n\n过程 LCA 数据库为从作物种植到塑料生产等广泛活动提供单元过程数据。有许多免费和商业软件包支持过程\
    \ LCA。这些信息在“ LCA 的工具与数据源”部分有更详细的介绍。\n\n## IO-LCA\n\n投入产出 LCA（IO-LCA）工具可以提供快速、廉价、整体的估算，即某一部门每美元经济活动所需的资源。IO\
    \ 模型中包含的所有部门之间的交易以 N×N 表或矩阵表示，其中 N 为部门数量。因此，IO-LCA 能够量化建模部门之间的所有交易，即使是通过服务行业发生的间接交易（Hendrickson\
    \ et al. 1997）。IO 交易数据通过使用与不可再生资源使用和污染物排放相对应的部门级系数来扩展，以产生环境影响估计。IO-LCA 的弱点之一是分析仅限于每种工具的投入产出表中指定的部门，并且\
    \ IO 部门通常聚合到远大于产品规模（Castellani et al. 2019）。\n\n有关 IO-LCA 的更多信息，请参阅《生命周期评估：定量方法对决策的重要性》（Matthews\
    \ et al. 2014）第 8 章。关于 IO-LCA 可用 IO 表和软件的讨论见“ LCA 的工具与数据源”部分。\n\n## 混合 LCA\n\n\
    混合 LCA 通常是一种过程 LCA，其中 IO-LCA 模型为一个或多个单元过程提供投入产出数据或环境影响数据，通常是因为该过程或这些过程未包含在 LCA\
    \ 数据库中。\n\n## 类型比较\n\n过程 LCA 和 IO-LCA 都有其优势和劣势。一般来说，过程 LCA 的优势在于其灵活性，可在任何所需分辨率下评估产品系统；不幸的是，完整的过程\
    \ LCA 可能耗时且昂贵。相比之下，IO-LCA 的分辨率仅限于相应 IO 表中定义的部门；然而，一旦构建，IO 表即可为所有包含的部门生成 LCA 结果，并能够考虑过程\
