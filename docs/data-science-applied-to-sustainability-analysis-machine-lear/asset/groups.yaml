    # ML in LCIA


    ML has been used in LCIA to estimate values of ecotoxicity CFs for uncharacterized
    chemical compounds. In the future, ML could also help characterize the environmental
    mechanisms used to define CFs as it improves environmental data collection related
    to ecology and human health impacts. Data collection supported by ML might even
    support development of new LCIA categories.


    # CF estimation


    Slapnik et al. (2015) conducted an LCA of Slovenia to produce region-specific
    normalization factors for LCA practitioners. Of the 440 chemical flows in their
    LCI, 139 had no impact characterization factors. Using the Weka 3.6.10 Java package
    for ML, physical–chemical, toxicological, ecotoxicological, and existing impact
    characterization data at the intersection of three chemical databases (PPDB, ReCiPe
    1.08, and FURS), they were able to train linear regression models for terrestrial,
    freshwater, and marine ecotoxicity, and human toxicity. With limited CF availability
    in ReCiPe, they were able to set up 75 training instances for the ecotoxicity
    categories and 41 training for human toxicity. By training 5 models for each impact
    category that ranged from including the maximum number of available chemical attributes
    to only those attributes available for the most data limited compounds, the researchers
    were able to produce validation CF estimates that were well correlated with existing
    ReCiPe CFs (>0.70 on average). However, the average root relative squared error
    was pretty high—about 70 percent for model predictions—so the researchers note
    that results derived from certain estimated CFs should be taken into consideration
    with care.


    # CF definition


