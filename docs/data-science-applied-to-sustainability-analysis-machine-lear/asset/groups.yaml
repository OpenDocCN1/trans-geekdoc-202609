    约束条件系统中尝试不同的行动或路径，这些约束条件为算法提供对其选择质量的反馈。强化学习对于生成逐案响应（无模型强化学习）或计划（基于模型的强化学习）很有用，这些响应或计划能够实现建模者定义的目标。在生命周期评估中，强化学习算法可以为优化某些系统参数的场景生成工艺数据，例如混合动力电动车（HEB）的能源消耗（Wu
    等 2018）。


    ## 浅层和深度学习


    在上述讨论的三种通用机器学习类型中，有许多算法，其中许多针对特定问题类型精心设计，其他则更灵活，能够适应更大的系统复杂性。一般来说，为特定任务设计因此灵活性受限的算法称为“浅层”或分层学习算法。更灵活的机器学习算法被归类为深度或表征学习，主要形式为人工神经网络（ANN）。


    浅层算法与人工神经网络之间的主要区别在于它们如何适应复杂性（即特征与模型输出之间关系的非线性）。


    在浅层学习算法中，通过扩展特征集来建模复杂系统。这意味着建模者使用原始特征来创建新的特征，这些新特征是原始特征的幂、原始特征的乘法组合，或原始特征幂的乘法组合。然后使用此扩展的特征集来训练假设函数并确定模型的拟合参数。人工神经网络通过一个额外的自动化学习任务——特征学习——来支持复杂系统的建模。特征学习发生在神经元系统中，每个神经元都有自己的假设函数，需要确定其拟合参数。该神经网络的产物是对原始特征数据的表征。表征特征集随后用作另一个具有学习拟合参数的假设函数的输入，而该最终假设函数产生人工神经网络算法的输出（图
