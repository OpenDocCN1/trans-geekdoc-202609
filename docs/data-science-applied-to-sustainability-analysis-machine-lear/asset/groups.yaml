  mdcn: "\n## 第8章\n\n## 生命周期评估中的机器学习\n\nMikaela Algren, Wendy Fisher, Amy E. Landis\n\
    \n科罗拉多矿业学院，金色，科罗拉多州，美国\n\n## 章节大纲\n\n- 生命周期评估（LCA）简介 168\n- LCA 在可持续性中的作用 168\n\
