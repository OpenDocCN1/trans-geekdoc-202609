    Life cycle assessment (LCA) is a data-intensive approach to quantifying environmental
    sustainability that enables researchers to compare and innovate processes. Growing
    areas of data science like machine learning (ML) are already being used to fill
    data gaps in LCA and even develop surrogate LCA tools that use design-phase product
    descriptors to predict the environmental impacts of a new design. In this chapter,
    we introduce LCA methodologies and the tools used by LCA practitioners. Next,
    we explore different types of machine learning (ML)—supervised, unsupervised,
    reinforcement learning, shallow and deep learning—and discuss how to determine
    what types of algorithms are best to solve a specific problem or appropriate for
    certain datasets. We then look at how ML algorithms have been used and consider
    how they could be used in LCA for data screening and cleaning, generating inventory
    data, environmental impact characterization, and sensitivity analyses.


    # Introduction to life cycle assessment (LCA)


    Life cycle assessment (LCA), also called environmental LCA, is a systematic, standardized
    approach to quantifying the potential environmental impacts of a product or process
    that occur from raw materials extraction to end of life. The methodologies for
    LCA are defined by the International Organization for Standardization (ISO) 14,040
    series (ISO 2006a; ISO 2006b).


    LCA results can help determine areas of improvement in production processes, aid
    strategic planning, and inform public policy. LCAs enable the comparison of different
    products, allowing practitioners to answer questions like, “How do the environmental
    impacts of beans compare to those of beef?” (Harwatt et al. 2017). LCAs are also
    used to improve product, process, or system design; an LCA can identify the areas
    of production with high environmental burden, enabling the design and comparison
    of alternative production pathways. For example, an LCA can show that replacing
    a deep straw manure management system with a slurry system reduces ammonia and
    nitrate emissions, thereby reducing the acidification and eutrophication impacts
    of beef production (Cederberg et al. 2003).


    # LCAs role in sustainability


    Together, environmental, social, and economic analyses can help us answer questions
    about sustainability (Fig. 8.1). Approaches similar to environmental LCA have
    been used to quantify social and economic impacts (Lauer 2008; UNEP 2009); these
    approaches are termed social LCA (S-LCA) and techno-economic assessment LCA (TEA-LCA),
    respectively. Standardized guidance for both S-LCA and TEA-LCA is limited in comparison
    to that which exists for environmental LCA (Landis et al. 2018).


    # Types of LCA


    Generally, there are three types of LCA: process LCA, input-output (IO) LCA, and
    hybrid LCA. International Standards Organization (ISO) 14,040 specifically describes'
