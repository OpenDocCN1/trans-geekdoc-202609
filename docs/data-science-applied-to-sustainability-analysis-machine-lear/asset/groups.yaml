    # ML in LCI


    The LCI step focuses on collecting data for the model. ML has not yet been applied
    to LCI, but applications of ML in cleaning sensor data and predicting the performance
    of buildings could inform future ML in LCI for data cleaning and estimating inventory
    flows.


    # Data cleaning


    Automated data collection is susceptible to errors that can be time consuming
    to find and correct. For LCA practitioners using automated data collection for
    their LCI or to inform impact CFs, deep belief networks (DBN) might be useful.
    Dietterich (2009) used a Gaussian DBN to clean temperature sensor network data.
    The Gaussian DBN acted as a filter, labeling incoming data from wireless sensors
    as “valid” or “faulty” using probabilistic inference based on learned correlations
    between sensors in the network and replaced “faulty” values with a predicted most
    likely value.


    # Estimating inventory flows


    ML has been used to predict performance of systems from system properties. Performance
    data, as it relates to material and energy demands or production of waste and
    emissions, is useful in the LCI step. Studies using ML to predict building energy
    use are common (Zhao et al. 2012; Robinson et al. 2017; Deng et al. 2018), and
    their results demonstrate that models developed using ML could be used with current,
    publicly available data to estimate the performance of new buildings in the design
    phase or the performance of existing buildings scenarios with modified input variables.
    It is likely that ML has been used to predict performance data for other systems
    as well.


    Deng et al. (2018) used a variety of ML algorithms to build models to estimate
    energy use intensity (EUI) for US commercial office buildings. The models were
    calibrated with a subset of 2012 Commercial Building Energy Consumption Survey
    (CBECS) microdata, comprised of 19 continuous variables such as square footage,
    occupancy percentage, and daylight percentage, and 56 categorical variables such
    as window glass type, building owner type, and whether there are occupancy sensors.
    The algorithms used were linear regression, lasso regression, Support Vector Machine
    (SVM), ANN, gradient boosting, and random forest.'
