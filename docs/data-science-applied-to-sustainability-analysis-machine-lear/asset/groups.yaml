    ## 过程 LCA 的通用方法


    标准的过程 LCA 包含四个主要组成部分：1）目标和范围界定，2）清单分析，3）影响评价，以及 4）解释和分析（ISO 2006a）。这些组成部分通常在构建
    LCA 模型的过程中按顺序处理，并在整个过程中迭代细化（图 8.2）。


    ### 目标和范围界定


    LCA 的第一步是制定一个明确定义的目标，指定所关注的系统、模型结果的预期用途以及预期受众。例如，牛肉 LCA 的目标可能是“量化牛肉的环境影响”以“识别流程中潜在改进领域”或“使消费者能够将牛肉的影响与其他食品的影响进行比较”（Cederberg
    et al. 2003；Dick et al. 2015）。然后定义 LCA 的范围以实现该目标。定义范围意味着设定要建模的系统的边界（例如，从原材料提取到消费者消费或处置），指定分析所需的详细程度，并选择功能单位。所需详细程度由所选单元过程的规模定义。在牛肉
    LCA 中，高层单元过程包括肥料生产、作物和牧场种植、养牛和屠宰（图 8.3）。


    ![](img/ac82f2e55074ec39b384b4e372aab70e_5_0.png)


    图 8.3 相互关联的牛肉、乳制品和玉米乙醇生产系统的示例流程图（PFD）。


    定义功能单位是 LCA 中的关键步骤。功能单位是产品系统量化性能的参考单位（ISO 2006a）。适当定义的功能单位允许以公平的方式将一种产品的影响与其具有相同功能的其他产品进行比较。在牛肉
    LCA 中，适当的功能单位可以是牛肉的千克数，或量化营养含量的单位，如卡路里或蛋白质；在这些情况下，牛肉 LCA 中的所有环境影响都将按每千克牛肉、每卡路里或每蛋白质报告。然后可以将报告的影响与对其他食品产品（如豆类或鸡肉）估计的环境影响进行比较。


    ### 清单分析


    清单分析步骤，也称为生命周期清单（LCI），涉及识别所关注系统相关的所有输入（例如能源和资源）和输出（例如产生的产品和排放物）。然而，我们通常希望能够以比整个所关注系统更精细的分辨率量化环境影响，因此在所关注系统内的每个单元过程中识别或估计输入和输出。对于玉米生产单元过程，输入可能包括种子、水、肥料、机械和能源。输出包括玉米产品，还可能包括肥料的养分流失，以及为农业设备提供动力的燃料燃烧排放。对每个单元过程的所有输入和输出进行清单是一项巨大的工作。幸运的是，对于
    LCA 从业者来说，已经做了大量工作来建立常见单元过程及其相关输入和输出的数据库。然而，LCA 从业者在确定某个特定 LCA 中使用是否合适时，应考虑过程数据集的范围和年代，以及为其开发的位置。有关
    LCA 工具和资源的更多信息，请参阅 **Tools and Data Sources for LCA** 部分。


    ### 影响评价


    也称为生命周期影响评价（LCIA），影响评价步骤将清单数据转换为有意义的环境影响。LCIA 用于提高对 LCI 中识别的输出流环境意义的理解。LCA 中典型的环境影响类别包括全球变暖、酸化、富营养化、臭氧层破坏、烟雾形成、生态毒性、人健康致癌性、人健康非致癌性、资源枯竭和呼吸效应。LCIA
    计算使用影响评价工具进行，该工具利用表征因子（CFs）数据库。CFs 基于环境机制，并应用于将生命周期清单分析结果转换为每个影响类别的标准单位。它们可以被导出为转换为
    midpoint 或 endpoint 环境影响类别（图 8.4）。


    ![](img/ac82f2e55074ec39b384b4e372aab70e_7_0.png)


    图 8.4 LCI 结果与环境影响 midpoint 和 endpoint 之间的关系。表征因子（CFs）代表环境机制，并使 LCI 结果能够转换为 midpoint
