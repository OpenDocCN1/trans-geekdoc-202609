    在输入特征较少或数据集关系大多线性的情况下，浅层算法会更好，而 ANNs 更适合于输入特征数量较大且输入与输出之间关系更复杂（非线性）的应用（例如，图像、音频）（Fig.
    8.7）。


    其他考虑因素可能包括模型透明度和产生模型所需的人力投入程度。使用浅层算法产生的模型函数完全透明，但 ANN 中执行特征学习的神经网络本质上是“黑箱”，通常无法用数学方法表示模型输入与输出之间的关系。这对于像
    LCA 这样高度重视模型透明度的应用而言可能是一个重要考虑因素。另一方面，使用 ANN 产生模型所需的人力投入可能低于使用浅层学习产生模型所需的人力投入，因为
    ANN 中的特征学习消除了手动扩展特征集的需要。如果浅层算法看起来是您数据集的正确选择，Scikit-learn 的“Choosing the right
    estimator”决策树可能是一个不错的起点：https://scikit-learn.org/stable/tutorial/machine_learning_map/。


    如同对任何数据源一样，应考虑使用 ML 方法对模型可靠性产生的影响。模型统计数据可以为将不确定性传播到模型结果提供起点，但在使用 ML 时应做出保守的建模选择，以避免过拟合，从而在模型验证和测试阶段产生人为偏低的不确定性。对
    LCA 的有用解读依赖于模型透明度，因此应特别注意解释使用了哪些 ML 技术以及原因。


    ## Tools for ML


    随着 ML 工具的不断扩展，无法提供全面的清单。一些最常见的免费且开源的构建 ML 模型的工具包括 python 库，如 PyTorch、Scikit-learn
    和 Theano；Google 的 TensorFlow；以及 Microsoft 的认知工具包（CNTK）、Weka 和 KNIME。对于刚开始使用 ML
    的人，一些不错的资源是 Andrew Ng 在 Coursera 上的机器学习课程，以及 OCDevel 机器学习指南播客。


    ## ML in LCA


    ML 在 LCA 中的潜在应用众多（Fig. 8.8），但哪些算法有用将取决于目标、数据类型和数据集大小。在本次综述中，我们发现 ML 已在 LCA 的三个领域得到应用：使用
    ANN 算法开发代理 LCA（Park et al. 2003；Sousa et al. 2006）；使用多元线性回归进行 CF 估计（Slapnik et
    al. 2015）；以及使用线性回归进行敏感性分析（Heath et al. 2009）。此外，ML 已在 LCA 之外应用于数据清洗、预测系统输出流或性能、生态系统信息学和系统优化。从这些方法来看，ML
    算法可在 LCI 数据集筛选或清洗、估算单元过程的流数据、提高用于确定 CF 的数据质量和数量，以及生成优化情景等方面有新的应用。


    ![](img/ac82f2e55074ec39b384b4e372aab70e_15_0.png)


    *代理 LCA 不是 LCA 步骤，而是一种估计完整 LCA 结果的方法


    Fig. 8.8 机器学习（ML）在生命周期评估（LCA）中的应用。深绿色应用领域表示我们在综述中看到 ML 算法已应用于 LCA 的部分。浅绿色应用表示在考虑其在
    LCA 之外类似领域的应用后，ML 在不久的将来可能应用于 LCA 的部分。针对每个应用指定的 ML 类型是基于与该应用相关的预期数据集或目标的一般建议。


    根据 ISO 14040 第 4.1.8 节，LCA 数据和建模在可能的情况下应基于自然科学。使用机器学习算法产生的估计值和其他信息，只要有足够数量的输入数据，并在监督学习的情况下进行模型验证，就完全可以满足这一标准。模型透明度对于
    ML 方法在 LCA 方法学中被接受也将很重要。


    ## ML for surrogate LCAs


    在这一领域，LCA 实践者已使用 ML 算法开发代理 LCA 模型，这些模型使用产品设计参数来估计新产品的 LCA 结果。“代理 LCA”一词似乎专门用于描述在过程
    LCA 数据上训练以预测 LCA 结果的 ML 算法。代理 LCA 的主要目标之一是使产品设计师能够预测新产品系统或过程的环境影响。几项研究已使用 ML 开发代理
    LCA 模型，使用产品描述符和现有的 LCI 或 LCA 结果（Sousa et al. 2000；Park et al. 2003；Sousa et al.
    2006）。


    Sousa et al. (2000) 测试了 ANN 预测生命周期能源消耗的能力，该 ANN 从一组 18 个精心定义的项目概念描述符进行训练。项目概念描述符的选择不仅基于与
    LCI 数据相关性的强度，还基于调查结果，表明设计师在产品开发早期阶段可能了解的产品信息。注意到当针对更窄的产品类别（例如仅耐用产品）检查描述符与 LCI
    数据之间的相关性时相关性有所改善，他们训练了两个 ANN 模型：一个用于高使用阶段能源消耗（HUPEC）产品，另一个用于低使用阶段能源消耗（LUPEC）产品。认识到不同类别的产品在产品描述符与
    LCI 数据之间具有不同的关系，促使进一步研究以定义产品的适当分组（Park et al. 2003；Sousa et al. 2006）。


    HUPEC 和 LUPEC 模型分别在 103 个和 55 个产品的完整 LCA 的产品描述符和生命周期能源消耗数据上进行训练。这些产品包括车辆、塑料、纸制品等。模型使用六种已知
    LCA 结果但不在训练数据集中的产品进行测试：内燃机车辆、冰箱、吸尘器、椅子、咖啡滤纸和防冻液。HUPEC 组中产品的预测生命周期能源消耗均在完整 LCA
    估计的生命周期能源消耗的 +/-40% 范围内。在 LCA 的背景下，相同产品结果之间这种量级的差异很常见，40% 的最大误差令人鼓舞。LUPEC 组产品的预测值与完整
    LCA 结果之间的差异更大，但仍然足够接近，以至于使用模型预测时六种产品从最大到最小能源消耗的排名与使用完整 LCA 结果时的排名相同。这些发现促成了可持续思维工具的开发，该工具使用设计阶段的产品描述符输入来产生全面的
    LCA 结果（Sousa 2008）。


    ## ML in LCI


    LCI 步骤侧重于为模型收集数据。ML 尚未应用于 LCI，但 ML 在清洗传感器数据和预测建筑性能方面的应用可为未来 ML 在 LCI 中的数据清洗和估算清单流提供参考。


    ### Data cleaning


    自动数据收集容易出现错误，这些错误可能耗时去查找和纠正。对于使用自动数据收集进行 LCI 或为影响 CF 提供信息的 LCA 实践者而言，深度信念网络（DBN）可能有用。Dietterich
    (2009) 使用高斯 DBN 清洗温度传感器网络数据。高斯 DBN 充当过滤器，使用基于网络中传感器之间学习相关性的概率推理，将来自无线传感器的传入数据标记为“有效”或“故障”，并用预测的最可能值替换“故障”值。


    ### Estimating inventory flows


    ML 已被用于根据系统属性预测系统的性能。性能数据与材料和能源需求或废物和排放的产生有关，在 LCI 步骤中有用。使用 ML 预测建筑能源使用的研究很常见（Zhao
    et al. 2012；Robinson et al. 2017；Deng et al. 2018），其结果表明，使用 ML 开发的模型可与当前公开可用的数据一起使用，以在设计阶段估计新建筑的性能，或在输入变量修改的情况下估计现有建筑情景的性能。很可能
    ML 也已被用于预测其他系统的性能数据。


    Deng et al. (2018) 使用多种 ML 算法构建模型来估计美国商业办公楼的能源使用强度（EUI）。模型使用 2012 年商业建筑能源消耗调查（CBECS）微数据的子集进行校准，该微数据包括
    19 个连续变量，如建筑面积、占用百分比和采光百分比，以及 56 个分类变量，如窗玻璃类型、建筑物所有者类型以及是否有占用传感器。使用的算法为线性回归、套索回归、支持向量机（SVM）、ANN、梯度提升和随机森林。

