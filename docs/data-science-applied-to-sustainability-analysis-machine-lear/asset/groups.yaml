    process LCA methods, but IO-LCA models can be useful as screening or model validation
    tools in LCA, provide supplementary data for a process LCA model or, in some cases,
    fulfill both the inventory and impact assessment steps in an LCA. Hybrid LCA is
    the combination of process and IO-LCA methods. Surrogate LCAs, which are described
    with more detail in the ML in LCA section, are ML algorithms trained on process
