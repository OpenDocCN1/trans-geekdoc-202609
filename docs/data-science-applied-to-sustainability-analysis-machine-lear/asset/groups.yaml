    GHG emissions of an average American, about 16 tons CO₂ equivalents.


    ## References


    Acero, A.P., Rodriguez, C., Ciroth, A., 2015. LCIA methods: impact assessment
    methods in life cycle assessment and their impact categories. Green Delta Version:
    1.5.4.

    Araujo, L.N., Belotti, J.T., Alves, T.A., d. S. Tadano, Y., Siqueira, H., 2020.
    Ensemble method based on artificial neural networks to estimate air pollution
    health risks. Environ. Modell. Softw. 123, 104567.

