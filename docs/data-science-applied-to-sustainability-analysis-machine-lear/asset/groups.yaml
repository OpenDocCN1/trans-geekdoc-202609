    Process LCA databases provide unit process data for a wide range of activities,
    from growing of crops to plastics production. There are many free and commercial
    software packages to support process LCA. This information is presented in more
    detail in the Tools and Data Sources for LCA section.


    # IO-LCA


    Input-Output LCA (IO-LCA) tools can provide quick, inexpensive, holistic estimates
    of resources needed per dollar of economic activity in a sector. Transactions
    between all sectors included in an IO model are represented in an N by N table
    or matrix, where N is the number of sectors. As a result, IO-LCA is capable of
    quantifying all transactions between modeled sectors, even indirect transactions
    such as those that occur through service industries (Hendrickson et al. 1997).
    IO transaction data is extended to produce environmental impact estimates using
    sector-level coefficients corresponding to non-renewable resource use and pollutant
    emissions. One of the weaknesses of IO-LCA is that analyses are limited to the
    sectors specified in the Input-Output tables of each tool, and IO sectors are
    generally aggregated to much larger than product-scale (Castellani et al. 2019).


    For more information on IO-LCA, see Chapter 8 of Life Cycle Assessment: Quantitative
    Approaches for Decisions that Matter (Matthews et al. 2014). Discussion of available
    IO tables and software for IO-LCA is in the Tools and Data Sources for LCA section.


    # Hybrid LCA


    A hybrid LCA is generally a Process LCA in which an IO-LCA model provides input-output
    data or environmental impact data for one or more unit processes, usually because
    the process or processes are not included in LCA databases.


    # Comparison of types


    Both process LCA and IO-LCA have strengths and weaknesses. In general, process
    LCAs strength lies in its flexibility to assess product systems at any desired
    resolution; unfortunately, full process LCAs can be time consuming and expensive.
    In contrast, the resolution of IO-LCA is limited to the sectors defined in a corresponding
    IO table; however, once constructed, an IO table enables generation of LCA results
    for all included sectors are able to account for impacts associated with indirect
    transactions between industries that are often outside the scope of process LCA
    models. Hybrid LCA models allow the LCA practitioner to take advantage of the
    strengths of both process and IO-LCA models. For more comparisons of process and
    IO-LCA methods, see publications from Hendrickson et al. (1997), Junnila (2006),
    and Castellani et al. (2019).'
