- - '#'
  - 基于人工智能的优化模型在预测结果方面优于基于统计回归的优化技术 (`Haider et al. 2008`; `Nagata and Chu 2003`).
    其神经网络模型的高性能归功于其处理非线性关系的能力 (`Lek et al. 1996`; `Somers and Casal 2009`). 人工神经网络
    (ANN) 在输入和输出之间提供了非线性映射 (`Masoumi et al. 2011`). 多种微生物系统的酶产量表现出可诱导表达的模式 (`Sahu
    et al. 2019`)，其本质上是非线性的。另一种流行的统计优化技术基于对响应的线性二次相关性假设 (`[Sahu et al. 2019](#ch4.xhtml#ref4_4.4
