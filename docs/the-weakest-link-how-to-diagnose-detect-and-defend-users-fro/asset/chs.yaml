  你以及每一位在 IT 领域解决社会工程问题的人员都可以立即实施这些方法。通过这些工具，组织可以将信息优势、知识环境、信息环境以及动机优势从黑客手中夺回，并重新回到自己。


  ## 反转黑客的信息优势


  社会工程工程师的信息优势源于能够获取之前的攻击中获得的特权用户信息。`Pretexting`（预设场景）和 `spear phishing`（鱼叉式网络钓鱼）都是获取并将其武器化的此类信息的来源和渠道。


  `CRS` 方法从三个层面解决了这个问题。首先，它允许 IT 部门识别出哪些人可能成为攻击受害者。这有助于创建基于信息的解决方案和预警系统，以保护高风险或可能成为目标的用户。例如，每当
  `Dark Web` 上出现关于此类用户的信息时，可以向 IT 人员发出警报。为此类人员提供的网络访问也可以被限制并受到更紧密的监控。这样，IT 管理人员在这些用户成为目标之前就知道了威胁，从而采取额外的保护措施。


  其次，一旦确定了最高风险的用户，IT 部门可以在他们周围构建多层技术防御。这迫使那些重用攻击并在多个组织中应用相同攻击的黑客必须针对每个组织及其用户制定特定的攻击。这不仅使得任何范围性攻击成功的概率降低，还增加了攻击的成本，使组织成为一个不那么吸引人的目标。


  第三，`CRS` 允许 IT 人员不仅了解攻击的可能目标，还能了解用户可能需要防范的可能攻击。在这里，`CRS` 基准测试过程发挥了作用。通过使用少数代表性用户，它提供了对任何攻击效力的共识评分。使用
  `V-Triad` 和 `SCAM` 框架，可以理解该评分及其原因，因此如果新闻中出现新形式的攻击，就可以预先确定该攻击对组织内用户的效力。该方法可以扩展到对
  `Wi-Fi spoofing`、`USB drop-offs`（USB 陷阱）以及其他形式的社会工程攻击进行评分。通过这种方式，IT 部门可以判断攻击是否需要紧急电子邮件公告或其他任何反应对措施。反应对措施可以是技术性的，或者再次利用
  `CRS` 风险数据，专门针对薄弱环节。通过这种方式，组织可以为当前、进行和未来的攻击做好准备。通过实施 `CRS`，可以遏制社会工程工程师的信息优势。


  ### 反转黑客的知识优势


  社会工程工程师的知识优势源于黑客拥有更好的技术资源。`CRS` 提供了三个层面的知识来减少社会工程工程师的优势：元（meta）、微（micro）和宏（macro）。在此基础上，`CHI`
  提供了关于用户意识到在做什么、能够做什么、知道做什么以及实际上做了什么安全行为的数据。它们共同提供了对用户的深度洞察。


  首先，`CRS` 提供了关于用户为何沦为社会工程受者的元知识。这与其他任何现有培训方法不同，后者预设用户存在知识漏洞。从 `CRS` 获得的数据可以与每个用户的
  `CHI` 评分进行对比，以确定需要解决的特定安全思维或行为。通过了解“为什么”和具体的“是什么”，IT 部门可以在被利用之前解决问题。


  其次，`CRS` 根据用户对企业构成的风险大小对其进行分类。这种分层提供了关于不同群体及其相关风险的微观知识。它允许 IT 部门采用不同的方法处理个人和风险群体。


  第三，`CRS` 提供了宏观知识，让组织能够理解整体韧性。通过 `CRS` 和 `CHI` 获得的三个级别的知识涵盖了基础的用户层级过程，如认知和行为。


  ### 改变信息环境和激励框架


  今天的信息环境助于保密而非共享。这包括关于泄露、渗透测试、其失败率，以及组织建立的干预措施和政策的信息。由于由于，大多数组织都在不断重复发明所谓的“轮子”。




  如今，企业级 IT 部门正侧重于通过重复测试来提高意识、评估风险并提升就绪状态。由于缺乏统一的框架来指导这些工作，这促使人们实施了更严厉的安全限制，并不可避免地导致了更多的培训。这引发了培训疲劳，导致用户仅从测试中学习、用户寻找规避方法，以及经理向用户通报测试——这一切都是为了降低钓鱼攻击的失败率。这削弱了接受测试的用户和使用这些测试的组织的责任感。


  CRS 方法不需要重复测试，因为它使用了一个有效的渗透测试开发和测量框架，能够通过少得多的测试提供可靠的数据。CHI 也是如此。它每年只需使用一次或两次，即可评估并跟踪用户的网络安全就绪状态。


  最后，可能最重要的是，CRS 的目标并不是降低某项单一统计，而是理解用户。它被设计为一种诊断工具，是一个基于证据的过程，旨在寻找解决用户安全漏洞的可操作解决方案。实施它的动机不是为了欺骗用户掉入钓鱼的陷阱，而是为了理解谁可能会中招以及为什么。它与
  CHI 一起，旨在解释攻击和用户中的哪些因素导致了脆弱性，以及如何修复这些。这创造了责任感——这是促进变革的关键要求——并确保那些脆弱的人不仅被告知他们的弱点，还学会了如何修复它。在使用这些工具时，IT
  部门的动机从“在光线照及的地方寻找钥匙”转变为“在钥匙所在的地方照光”。


  # IT 管理角色的转变


  在本书中，我们讨论了当今企业中 IT 管理角色的变化。IT 部门能够控制用户带入组织的设备以及他们在设备上可以做的事情的时代已经过去了。尽管如此，数据泄露的责任仍然被落在
  IT 经理的肩上。


  这种压力是真实的，而且由于不同的指南、设计糟糕的政策以及以工程为导向、自上而下的用户方法而变得更加巨大。CRS 和 CHI 将 IT 经理的角色转化为变革的代理人。他们不再仅仅是实施解决方案的工程师或约束用户的警察。相反，他们是问题解决者，应用认知和行为科学来解决社会工程中的人的问题。


  我们在第一章中提到了图格格教派（Thuggee cult）的故事，他们最早的社会工程师之一，以及亨利·斯利希曼（Henry Sleeman）的故事。他通过应用当时创新的科学技术，收集了教派成员及其潜在受害者的个人档案数据。他努力理解用户和该教派可能的目标。他让警察伪装成旅行者加入商队，以保护最可能成为目标的人。这帮助他捕获了教派成员，但他必须做更多来消灭他们。他必须影响人们——旅行者、村民、镇民、酋长和当地国家首脑——对教派的看法。为了这一点，他必须成为变革代理人。


  历史已经丢失了斯利希曼实现这一目标的许多细节，但得益于他所写的许多书籍，我们可以拼凑出他的步骤。我们知道他首先从与人们建立关系开始。他学习了当地语言，广泛旅行，并研究了那里的历史、动物学和人口统计学。（他关于丛林中狼群养大的野童的著作启发了鲁德亚亚·金普林写了《丛林之书》。）他努力`建立信任关系`，以便他了解这些人们并理解他们对教派的支持。这对于进入下一个关键步骤是必要的：`诊断问题`。


  斯利希曼随后发现了核心问题，即图格格人有许多支持者，这些关系通过婚姻和联盟得以巩固。为了扭转这一传统，他开始识别最可能支持教派的当地群体和那些不支持的群体。对于后者，他必须`找到捍卫者`来帮助在社区中培养`变革意愿`。他说服一些人渗透教派，另一些人加入警察部队，还有人报告观察到的可疑活动。斯利希曼给予他们工资、头衔、表彰和社会认可作为回报。这说服了许多其他人并帮助将`意愿转化为行动`。斯利希曼还`识别了需要保护的薄弱环节`并在它们周围建立了防御。最后，他制定了政策和流程来`稳定对新方法的采纳`，以确保进展持续，并且没有其他群体出现来填补真空。为了这一点，他通过了禁止图格格行为的新法律，设立了`图格格与盗匪部`，并通过这些部门将他的实践制度化。这有助于促进民众的持续参与，并扼杀了这一数世纪的祸害再次立足的机会。


  斯利希曼所采取的步骤正是如今商学院教科书教授那些对在组织内创造变革感兴趣的高管的。。过去有效的方法在今天也同样有效。


  虽然历史上的图格格人早已死去，但他们在网络世界中的类比者仍然依然活跃。他们以黑客行动主义者、有组织的团伙和黑客的形式出现。许多人同步攻击，协调努力，使用假名和秘密代码，并在黑市中分享他们偷来的财物。他们的首要目标是用户，特别是那些最弱的用户，通过他们进入组织并进行掠夺。


  站在现代社会工程师道路上的是你——IT 经理、首席信息安全官（CISO）、顾问、安全专家、企业主。你需要做斯利希曼做过的事情：与用户建立信任、诊断问题、识别薄弱环节、创造变革意愿、将意愿转化为行动并稳定采纳。你需要应用测量、数据收集和分析的科学来对用户进行画像，找到最薄弱的环节并保护他们。现在，你可以做到了。


