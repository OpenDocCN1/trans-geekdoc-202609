  这种情况不仅出现在日常发明中；科学领域也面临着类似的遭遇。我们大多数人人都熟悉，在超过 1,500 年的时间里，科学家们一直拒绝太阳是宇宙中心的观点，直到`Copernicus`和`Galileo`在
  16 世纪才纠正了这一误解。还有许多其他错误的科学观点，从疾病是由有害空气引起到宇宙充斥着光以，这些观点都持续了几个世纪。科学家们被困在一种思维模式中——即范式。


  托马斯·库恩在他开创性的著作《科学革命的结构》中，将这种范式归因于科学的过程和实践。科学在个体应用上是客观的，但它是由社区进行的一种活动。这个由学者、思想者、教育者和从业人员组成的社区对他们正在研究每种现象进行建模。他们提供了组织现象的语言、支持该现象的数据以及反反对观点的论据。这一框架被传给学生，学生成为该框架的实践者和支持者。这不仅塑造了处理现象的方式，还塑造了看待领域问题的方式。随着时间的推移，即使是该领域的专家也很难意识到自己陷入了范式，更不用说跳出范式思考了。


  但这并非仅影响早期科学思想的现象。当代科学家仍然会被困在范式中。最近最近改变考古学的发现为例。自 16 世纪以来，对古希腊和罗马人的考古研究将他们古典神话中描绘的神灵、巨神、狮鹫和巨人视为一个相对原始的民族生动想象的产物。民俗学家、学者`Adrienne
  Mayor`改变了这一观点。她的研究表明，这些生物神话根源于史前动物的骨骼，而这些化石在这些传说出现的地方可见。


  我们现在意识到，古希腊人是化石猎人，他们收集挖掘出的骨骼并根据他们对动物解剖学的有限知识对其进行解释。因此，一种古代类象的物种`deinotheriidae`的头骨有一个用于容纳象鼻的大中央空腔，这产生了关于巨大的独眼巨人的故事。灭绝的巨型长颈鹿骨激发了荷马史诗中`Heracles`拯救`Hesione`的传说。`mastodon`、`protoceratops`和其他史前动物的化石骨骼导致了关于`Dionysus`的巨大战象、守护黄金的翅膀狮鹫以及咆哮怪物的想法。


  但考古学家一直拥有这些证据。他们不仅在这些地区发现了史前动物的骨骼，许多希腊神庙的遗址中也包含了挖掘期间发现的遗物。然而，由于他们的世界观，考古学家将它们视为偶然发现并将其丢弃了。


  今天，计算领域同样被困在一种范式中：工程范式。它所有的核心原则——从如何定义问题到寻求什么样的解决方案——都是由工程学科驱动的。


  一个说明性的例子是计算机工程师使用的术语，它们被用来指代软件中导致意外或不准确结果的错误：`bug`。软件中的`bug`几乎总是由软件程序设计过程中的人为错误造成的。该领域并没有承认这一点——正如某些人所主张的那样，称之为“失误”——而是将问题界定为有机变异，就像讨厌的小虫子一样出现在软件中。这不仅影响了该领域界定问题的方式，还影响了诸如`debugging`之类的解决方案，它侧重于通过自动化流程和`debugging
  tools`来发现和纠正此类故障的技术过程，而不是专注于改进人类编码。


  工程观点在计算领域的主导地位源于三个层面的影响。首先，从核心上说，计算设备是由电路制成的，这是工程师传统的研究领域。其次，该领域的支持者（无论是创建硬件还是软件）对电子产品和技术有倾向。他们倾向于在关注物理科学原理的工程课程中接受培训，那里的结果是可预测且确定的。他们较少关注人类过程，因为人类过程是不可预测且随机的。这些观点塑造了他们对技术的理解以及对整个世界的预期。第三，该领域通过`computer
  science`和`computer engineering`等学科进行组织，通过这些学科让学生和从业者熟悉领域的规范和处理问题的方法。


  正因如此，该领域将社会工程问题主要视为一个技术问题，即一个可以通过软件或硬件修复的问题。接受过工程训练的`IT managers`要求确定性的解决方案。这本身并没有什么错。工程作为一个领域或工程师作为一个群体也并没有什么错。工程学在人类进步中已经取得了巨大的飞跃，工程师们通过设计和设备帮助实现了这些飞跃。但期望机器表现得可预测，与期望人们表现得像机器一样是另一回事，而问题正存在于此。计算技术的工程导向塑造了对问题的看法以及对解决方案的预期。它导致了人们倾向于可预测、可理解的技术解决方案，而不是不可预测、陌生的以人为本的干预。


  一个巨大的解决方案空间已经出现以满足这一需求。它由软件和硬件产品主导，每种产品都声称是解决社会工程问题的“银弹”。这些产品中的大多数要么完全忽略用户（并提供内部数据和理由），要么将用户边缘化，期望用户仅在某些软件界面上提供几次经过训练的点击。所有的`cybersecurity
  engineers`都在预言那一天——人们总说那一天即将到来——到时这些都不再需要了，技术将完全战胜落入社会工程陷阱的用户，或者让用户完全过时。因此，对于理解用户的兴趣或价值非常有限。


  这些观点激发了两种应对社会工程所利用的人类问题的宽泛方法。一种采取了公开的技术方法，关注于通过硬件和软件来解决用户问题。另一种源于工业时代的车间地面和传送带——人类因素法。它导致了全球组织实施的安全意识和用户培训计划。本章介绍了这两种方法的内在优缺点，并特别强调了用户培训作为创建用户韧性的主动方法的有效性。




  包含和约束解决方案几乎总是涉及软件或硬件。它们源于计算机科学和工程领域的研究，而在这些领域人们倾向于使用此类解决方案。因此，它们是网络安全厂商销售的最常见的解决方案类型。本节并非列出所有解决方案的无限列表，而是对采用这些技术的领先解决方案进行概述，并介绍它们是如何进行包含或约束的。


  ## 包含访问的技术


  最流行的访问包含技术包括物理隔离（Air gapping）、防火墙和沙箱。物理隔离涉及将计算机与网络隔离。其目标是让黑客难以通过破坏连接网络上的任何一个设备来访问网络上的其他计算机。物理隔离可以通过物理方式将一台或一组计算机与其他计算机隔离开来创建。例如，可以通过将电子邮件使用限制在无法访问组织内部任何文件或服务器的计算机上来实现物理隔离。它也可以通过软件来实现，这是更常见的做法。在这种情况下，程序通过电子方式将某些计算机与其他分离。作为一种技术，物理隔离通常用于保护高价值信息免受访问互联网的通用计算机的影响。它们也被用于隔离和保护控制系统，例如管理工业系统、核设施、电网、医院设备和飞机飞行控制系统。


  另一种包含访问的方法是通过防火墙。这是一种电子网络隔离方法，涉及控制进出计算机的数据流量。防火墙在网络和计算机之间建立屏障，可以放置在网络网关处以监控整体流量，也可以放置在主机上以仅保护单个设备。它们还可以被配置为路由流量、阻止可疑的页面或数据包，或监控特定的应用程序和文件类型。


  第三种常用的包含方法是沙箱。它创建了计算机甚至整个网络的虚拟副本或代理，以便应用程序运行在那个虚拟版本中，而不是运行在实际系统中。通过在受限制的虚拟环境中执行软件，沙箱防止任何感染影响整个计算系统。这一过程还可以保护核心系统进程免受其他程序的访问，从而维护整个系统的完整性。苹果的“围墙花园”正是如此。它是一个虚拟沙箱，保护其核心操作系统免受恶意程序的影响——这也是
  iPhone 高可靠性的原因之一。


  ## 约束方法


  与包含技术类似，还有许多流行的约束方法，从我们在第 2 章讨论过的各种身份管理系统开始。这些包括传统的基于登录和密码的认证系统，以及叠加在其上的各种多因素认证系统（2FA、物理令牌、生物识别等），这些系统将访问限制仅限授权用户。之前未涵盖的其他约束机制还包括使用虚拟专用网络（VPN）、白名单和防病毒软件。VPN
  加密网络上计算机之间的通信，以限制未经授权人员捕获传输期间交换的数据。白名单是预先批准的允许访问系统的程序、网站或电子邮件地址列表。列表上的任何内容都会被自动拦截，从而约束用户的访问。


  最后，约束可以使用杀病毒程序来实现，这些程序可以限制或删除病毒、弹出窗口、恶意软件或木马。旧版本的此类软件捕获病毒特征并开发补救补丁，作为更新发送到病毒软件的固件中。较新的防病毒软件结合了机器学习来寻找恶意软件中的共同模式。某些使用基于行为的识别方法，通过跟踪程序的操作来预测其是否偏离轨道，而另一些则使用启发式方法，通过检查程序的软件代码来预测其恶意意图。除了这些，还有许多从高技术到简单不一的技术可以进行包含或约束。


  ## 监控和过滤技术


  在技术端，是各种网络监控技术，它们跟踪网络内的所有数据流并构建用户行为画像，这有助于检测异常活动；以及电子邮件扫描软件，它可以寻找可疑关键词和技术线索来识别电子邮件的欺骗意图。在较低的非技术端，是某些阻止设备上特定类型连接的方法、禁止某些网站（如缺乏特定类型加密的网站）、减少电子邮件中超链接或图像的显示，以及阻止来自未经批准源的邮件发送。


  ## 工程方法的优点与局限性


  旨在包含和约束访问的整系列解决方案具有多个优点，其中最主要的一点是它们涉及可以预测和证明有效的技术。无论是物理隔离、防火墙、沙箱、生物识别、多因素认证还是防病毒软件，都可以通过“红队”攻击模拟看到它们在计算网络上是如何工作的。因此，为实施这些方案提供理由也变得容易。


  这两种方法的另一个优点是它们为 IT 部门对其所辖系统提供了控制。包含解决方案限制了意外事件瘫痪整个企业 IT 系统的可能性。约束解决方案同样有助于移除那些不需要访问关键系统进程和资源的的用户。通过这种方式，它们减少了可能发生的不利
  IT 相关事件的变数。


  每种解决方案还增加了黑客所需的努力和投入。通过设置各种技术障碍，它们增加了攻击成功的难度。这使得该组织成为一个不那么理想的目标。此外，如果系统被攻破，技术解决方案由于它们创建的访问和操作孤岛，有助于快速识别故障位置，有助于提供快速修复。


  外部安全厂商也可以管理许多解决方案。这对组织具有吸引力，因为组织内部用于支持他们的 IT 人员日益有限。这些解决方案的实施对用户的参与要求极小，通常不需要用户在自己的计算机上进行任何操作。这使得向用户部署解决方案并保持计算机补更新至最新状态变得更容易。防病毒、防火墙和弹出窗口拦截器等解决方案也被认为是用户在许多操作系统上计算体验的必要组成部分。它们在实施过程中面临的用户阻力很小。


  最后，每种技术解决方案都配有一个可见的产品。对于首席信息安全官（CISO）来说，这一点很重要，他们必须证明自己采取了切实措施来确保企业安全。


  几乎所有辅助包含或约束访问的产品都能做到这一点。由于许多此类解决方案已被其他组织及其 CISO 实施，因此还具有额外的优势：不仅证明了正在采取某些措施，还证明了这是该领域其他人正在做的做法。在网络安全被视为成本中心的情况下，拥有一个同领域其他组织已经在使用的实体产品，使得该解决方案的合理性变得容易得多。




  虽然这些方法具有许多明显的优势，但它们也存在许多局限性。其一，尽管这些前景良好，但没有任何一种解决方案能够防御所有形式的网络攻击。物理隔离通过防止恶意程序的运行来使网络孤立，但它由于不允许应用保护性补丁和关键更新，也使其处于脆弱状态。同样，白名单可能会阻止未经批准的连接，但无法识别已被攻破的已批准连接。虽然病毒防护和防火墙可以防止恶意软件感染，但它们无法防御诱装陷法或其他形式的社会工程攻击。


  ### 平台限制与局限性


  此外，由于各种平台实施的技术限制，许多解决方案是特定平台的。例如，杀毒软件、电子邮件扫描和大多数邮件标记软件都不支持 Apple iOS Mail 等移动端邮件应用程序。即使是那些跨平台有效的解决方案，其实限制性也比看起来要大。以同形异字攻击为例，邮件或
  URL 的内容包含了看起来像英语字母的其他语言字符。例如，将英文单词 `password` 中的字符替换为西里尔字母“о”，这种细微的改变对于大多数查看的人来说是无法察觉的。问题在于，大多数用于标记邮件中
  `password` 词的反钓鱼软件也无法捕获这种变化。这正是黑客为了规避民主全国大会的钓鱼邮件扫描软件所做的手段——而我们正因为这样才知道了发生了什么。(6)


  其次，许多解决方案还受限于海量数据以及当今组织内用户访问数据方式的多样性。IT 用户包括不同的员工、供应商和监管机构。每个用户在不同的层面、使用不同的设备并从不同的位置与公司网络进行交互。累积起来，即使是一个拥有
  50 名员工的中型组织，用户也可以通过电子邮件、即时消息、视频会议和云服务交换数 PB 字节的数据。(7)


  追踪他们每一个人是一项艰巨的任务，而在隐私法规禁止某些形式监控的组织中，这项任务变得更加困难。这包括联邦政府机构的员工、律师事务所、医疗机构以及受欧盟《通用数据保护条例》约束的组织。因此，组织内部的许多用户交互根本无法进行全面的筛选、追踪和监控。


  ### 新技术与社会工程学


  第三，每种工程化的解决方案都会为工作空间引入一组新技术，而所有技术都可能被社会工程工程师劫持。例如，杀毒软件的定期固件更新会让用户的下载行为变得常规化。社会工程工程师可以模拟或伪造此类更新。习惯性点击并接受此类更新的用户随后很容易被欺骗。朝鲜黑客就是这样用勒索软件感染了索尼影公司的计算机系统。同样，标记外部邮件的邮件软件会让用户习惯性地寻找此类标记，而这些标记也容易被伪造。


  此外，许多在线防护措施产生了一种无可击的感觉，让使用户在在线操作上更加轻率。研究表明，杀毒软件的用户在设备上打开可疑网站和邮件时会更加粗心。(8)同样的问题也困扰着邮件软件的用户，他们同样依赖于系统的判断。这表面上是为什么俄罗斯向约翰·波德斯塔（John
  Podesta）发送的鱼叉式钓鱼邮件会被民主全国大会（DNC）的 IT 服务台员工信任，波德斯塔曾向他们寻求指导。IT 员工信任了那封邮件。


  ### 无可击的感觉


  此外，许多在线防护措施产生了一种无可击的感觉，让使用户在在线操作上更加轻率。研究表明，杀毒软件的用户在设备上打开可疑网站和邮件时会更加粗心。(8)同样的问题也困扰着邮件软件的用户，他们同样依赖于系统的判断。这表面上是为什么俄罗斯向约翰·波德斯塔发送的鱼叉式钓鱼邮件会被民主全国大会（DNC）的
  IT 服务台员工信任，波德斯塔曾向他们寻求指导。IT 员工信任了那封邮件。


  在某些国家，Facebook 和 Amazon 等网站是人们之间基本的纽带，甚至用于货币转账和企业间通信，而这一切是在新冠肺炎使得共享各种视频会议门户和云服务的
  URL 变得必要之前。


  许多由 IT 部门实施的复杂技术解决方案也是如此。例如，阻止某些即时消息、社交媒体和购物网站的严格白名单忽略了这些应用发挥的作用。在许多组织中，员工更倾向于发短信而不是拨打电话。


  最后，所有的技术解决方案都是由工程师通过测试设计的。它们在真实环境中变得非常不便。这导致用户寻找绕过方案，从而使系统面临更大的风险。以新加坡一家安全机构的轶事为例。该机构实施了物理隔离，将检查邮件的计算机隔离开来。其想法是防止钓鱼邮件被传输到他们的中央计算机。然而，当一名授权用户使用
  USB 驱动器将附件从邮件计算机传输到主网络时，他们被攻破了。这种恶意软件就隐藏在附件中。


  (9)




  因此，无论技术手段多么复杂，遏制和约束的技术方法都有其局限性。最大的限制源于用户，以及他们如何与、使用以及体验这些工程化的安全防护措施。就像家庭安防系统一样，所有的网络安全系统都需要用户参与并以最佳方式使用系统。这需要用户的意识和教育，而接下来的工程方法正尝试实现这一点。


  ## 人因素方法


  在 20 世纪初的大量生产时代，人们在工厂车间内组装产品。工业的重点是增加工厂产出。关键在于提高操作员效率并保持传送带运行更快。为了实现这一目标，工程领域开始将科学管理实践引入生产计划中。随之而来的是一种看待用户的新观点：将其视为“人因素”。


  在这种观点下，每个工人被看作另一个齿轮，其性能影响着传送带的整体速度。重点在于每个人做了什么，这些行为如何影响整体生产，以及如何进行改进。他们使用一种在当时非常新颖的方法——时间与动作研究对动作进行分类，对每个操作员的动作都根据最优标准进行跟踪。不符合标准的人会接受培训。这种做法反复进行，直到达到预期的输出效率。


  这里没有任何地方关注个体或他们的动机。从该领域而言，人们工作的根本动力是金钱，因此激励机制的建立是为提高生产的工人提供更多金钱，无论这对他们的生活或身体产生什么后果。他们对工作的想法、能力，甚至是个人安全并不重要，因为他们拿了工资。随着岁月的推移，情况发生了一些变化，法律规定了工作时间限制并实施了安全标准。全球化和竞争加剧也影响了这一点。工厂车间被初创公司和技术驱动型企业取代，领班和日薪工被企业家和拿薪的男女所取代。然而，`human
  factors`这一术被保留了下来，一些关于用户的基础性观点也是如此。


  今天的工程师将`human factors`一词作为流行口号——出现在学术论文、政策规范和招聘公告中——用来描述计算领域几乎所有与用户相关的问题。它涵盖了关于用户脆弱性的整个研究，以及对抗社会工程的主动方法。^(10)


  但是，由于其根源，计算领域人因素研究的焦点仍然在用户行为上。通过不同的方法，各种用户行为被编码、跟踪和监控。其中一些数据为技术设计提供信息，一些识别了用户问题，另一些被汇编，形成了今天所有用户意识和培训解决方案的基础。所有这些方法假设人类行为是人类思维的代理——这一事实从工业车间的最早期开始就是缺陷的。不仅我们的大部分想法没有转化为行动，而且我们的许多行动——我们的习惯、惯例和模式——甚至不是基于深思熟虑的。我们大多数人做的事情比我们想的少，而且经常在不思考的情况下做很多事情。


  所以，虽然计算机科学对软件漏洞有很多称呼——语法漏洞、控制流漏洞、Mandelbug、Heisenbug（海森虫）、Schroedinbug（薛定谔虫）——但人因素的研究很少考虑人类认知、情感、个性、性格或习惯，而这些因素已被证明会影响用户如何遇到、解释和使用技术。换句话说，人因素研究中并没有多少人类科学。^


  ## 人因素方法的优势与局限


  培训用户有许多充分的理由，从培训活动本身开始，这种活动符合工程师的基本世界观。毕竟，这是用于指导不同机器操作员的方法，从汽车司机一直到航天员。那么，为什么它不能帮助进行网络安全培训呢？遵循这一逻辑，嵌入式意识培训被认为更有效，因为它更具操作性，并且类似于工厂车间培训，可以在用户的办公桌前持续应用，而教学式的课堂教育只能在离散的间隔中进行。


  培训也备受推崇。例如，美国国家标准与技术研究院（NIST）的网络安全框架是一份关于组织如何评估和改进其网络安全态势的广泛认可的蓝图（将在下一节中进一步讨论），它支持通过网络安全意识培训来增强用户的韧性。今天的许多培训以包装产品的形式出现，作为一种技术产品。这带来了我们在讨论安全工程方法时已经提到的许多优势。





  ## 培训优势


  还有一个进一步的优势：用户数据。培训包的数据包含了用户的培训完成率、学习花费的时间，以及——最重要的指标之一——关于谁在模拟钓鱼渗透测试中失败的数据。这些失败数据可以作为组织整体网络风险态势的量化指标。例如，美国国土安全部最近实施了持续诊断与缓解（`CDM`）计划——这是一个提供评估联邦政府机构网络风险评估工具的仪表板。`CDM`
  的一个关键产出是每个组织的网络健康评分。该评分部分是根据嵌入安全培训的通过/失败数据得出的。因此，培训具有许多优势，从被推荐的一项活动转变为一种可以提供海量数据的产品，这些数据可以作为评估组织整体韧性的输入。


  尽管有所有这些优势，也存在一些缺点。一方面，培训活动（尤其是当它是强制性的时）可能会迅速演变成一种**合规性行为**，使得每位 IT 管理员仅仅为了勾选其强制安全倡议清单上的项目而参与其中。


  其次，当培训数据成为组织网络健康评分的一部分（正如本文讨论的 `CDM` 那样），它可能会演变成 IT 管理人员和用户共同的焦虑驱动活动。IT 管理人员可能会不断增加培训频率以降低他们的整体风险分。这可能导致惩罚性措施，某些
  IT 管理员已经对用户施加了这些措施，以恐吓用户使其合规。相反，负责降低评分的 IT 人员可能会设计易于检测的测试，以提高整体检测率。


  频繁的强制培训还可能注入其他污染物。在我在组织中进行的调查中，员工抱怨有“培训疲劳”；主管们为了提高团队得分，会预先警告员工将要进行钓鱼测试；而许多员工在知道测试即将来临的日期里会避开打开公司邮件。这些因素不仅没有被衡量，而且对员工士气造成了负面影响。更重要的是，它们破坏了钓鱼测试结果的有效性，以及组织所依赖的相应网络健康评分。


  第三，关于网络安全的的用户培训能传授的知识有一个上限——一个天花板。计算技术极其复杂且多层次。漏洞数不胜数。没有任何一个人，即使是最聪明的计算机科学家，也能声称掌握当今任何计算机上所有的技术和非技术漏洞。因此，将员工培养成完全的网络安全专家是不可能的目标。鉴于此，大多数培训计划在他们认为的紧迫漏洞与用户在工作中遇到这些漏洞的概率之间进行权衡。这些决策基于对已知网络攻击以及工程师认为人们应该具备的技能的先验假设。这随后变成了教学的主题或内容领域。这种方法不仅完全忽略了用户基于任务的培训需求，而且往往导致一个对用户没有吸引力的计划。


  此外，各个操作系统平台和功能的编程差异使得所有培训的范围都非常有限。以简单的鱼叉式钓鱼意识培训为例，用户被教检查邮件的文头头部。邮件标头包含代码片段，可以揭示任何入站邮件的域名、发送者的
  IP 地址以及邮件的真实来源。用户可以通过查看邮件来评估该邮件是真实的还是鱼叉式钓鱼伪装。虽然要求用户这样做是好的，但在实践中即使在单台设备上也很难，更不用说在许多不同的设备上了。以
  iPhone 为例，它默认的 `Mail` 程序不显示邮件标头，而该设备提供的 `Gmail` 应用可以显示。因此，任何接受过这种网络安全技能培训的用户在处理每天收到的大量邮件时，每次都必须切换程序或切换设备。


  这种特定于平台和软件的差异渗透在用户的计算体验中。不同的浏览器有不同的方式展示安全套接层（`SSL`）信息，这揭示了网站安全证书的存在和质量；浏览器以不同的方式处理
  URL 中的同形域名（即使用其他语言字符显示的域名，例如使用西里字母“o”来创建一个伪假的 Google 网页）；邮件程序有各种处理图形图像和跟踪 cookie
  的方法。这些差异源于不同技术公司对待安全的方式，并且它们随着平台持续存在并演变。它们也会随着软件更新、新功能的添加以及新的国家或国际法规迫使改变而发生变化。由于这些原因，所有培训的有效期限都非常短——这种期限由各种应用程序、操作系统、计算设备以及它们如何、何时以及在何处被使用所决定。


  最后，大多数培训计划很少考虑用户如何思考网络安全。对于任何直接从事 IT 安全工作的人来说，网络安全都是事后考虑——是他们很少思考的事情。这是因为在世界各地的组织中，用户因高效和有效获得奖励，而很少因网络安全获得奖励。然而，培训方法却期望持续的警惕，甚至是主动行为，例如始终向
  IT 管理员报告可疑的在线事件。


  大多数培训计划还倡导忽视用户在现实世界中行为的网络安全常规。作为一个案例，一个鱼叉式钓鱼意识计划培训用户查看邮件的几十个不同维度以确定其真实性。对于任何用户来说，在检查单封邮件时执行这些操作已经足够困难了，更不用说他们——像我们今天大多数人一样——一天在多个收件箱中收到数百封邮件，而且他们通常在移动期间使用屏幕尺寸、操作系统环境和视觉布局各异的设备进行回复。





  对于不熟悉 NIST 网络安全框架的人，这里是它的工作原理。


  该框架旨在帮助组织定义其整体网络风险态势并为实现网络韧性制定计划。它包含三个组件：


  -   **核心 (core)**：组织在此处对其目标和活动制定高层战略规划；

  -   **风险概况 (risk profiles)**：组织在此概述其网络安全活动的现状与预期状态的对比；

  -   **实施层级 (implementation tiers)**：组织在此概述在每个关注的功能领域内，其计划参与的特定活动，以实现核心部分设定的目标。


  ## 四个实施层级


  框架进一步规定了四个实施层级。在每个后续的层级中，预计组织通过日益严谨和复杂的安全干预措施，实现更大程度的网络风险降低。


  -   **第 1 层 (Tier 1)**：组织对风险仅部分了解，通常是因为它们拥有临时的网络安全策略。

  -   **第 2 层 (Tier 2)**：组织对自己的网络风险有更深入了解，因为它参与了定义的风险评估过程。

  -   **第 3 层 (Tier 3)**：拥有更正式的风险管理实践，且该实践会定期沟通和更新。

  -   **第 4 层 (Tier 4)**：最高层级，组织的风险管理流程具有敏捷性并能适应变化的威胁。


  在这四个层级中，`Tier 2` 是最低预期目标，而 `Tier 4` 因为预计能实现网络韧性，是最优的。



  图中，英特尔详细介绍了其如何计划在准备员工防范社交工程方面过渡到 NIST 框架风险风险管理层级。


  -   在**第 1 层**中，英特尔识别出员工缺乏网络安全意识且缺乏培训体系。

  -   在**第 2 层**中，英特尔计划通过通用的意识培训，让员工了解风险。

  -   接下来，英特尔计划通过实施定期的培训和简报，以及建立“稳健的培训体系”进入**第 3 层**。

  -   最后，通过定期的网络安全相关培训和简报，并再次建立“稳健的培训体系”，英特尔计划成为风险适应型（`Tier 4`），从而在其人员关注领域实现网络韧性。


  虽然英特尔没有具体说明其计划实施的“稳健培训体系”，但有一点是肯：它计划使用培训——并在每个层级都进行大量培训——来提高员工意识。事实上，`training`
  或 `awareness` 这两个词在其计划中出现了十多次。


  鉴于培训仅存在两种方法（教学式和嵌入式），英特尔的培训体系很可能涉及一些教学式培训和许多重复的嵌入式钓鱼测试。作为全球最大的半导体制造商之一，拥有市值超过 2000
  亿美元和超过 10 万名员工，其做的不仅仅是不断培训员工。可以这样想：英特尔每年在研发上的花费接近 100 亿美元，而这些工作是由人——即在英特尔工作的员工完成的。公司所有的知识产权、产品蓝图和未来的开发周期都可能通过社交工程遭到破坏。一封鱼叉式网络钓鱼邮件就能实现这一点。而英特尔对此唯一的解药就是用户培训。


  ## 培训公理


  但他们的计划中还有另一个值得注意的方面。英特尔的 `Tier 1` 从将用户问题定义为缺乏网络安全培训体系开始。他们的计划始于假设解决方案的缺失就是问题。在甚至没有诊断用户的情况下，更不用考虑是否以及何种网络安全培训方法是必要的或有效的，英特尔就假设用户缺乏培训是他们网络风险的原因。


  而且不仅仅是英特尔。我并不是在针对他们。他们只是 NIST 网站上提供的一个方便的例子，有助于说明一种盛行的公理：*用户之所以脆弱，是因为他们缺乏网络安全培训，而培训可以减少这种缺乏*。


  ## 培训的市场增长


  紧随之后，从华尔街到主街的组织都在盲目地应用培训来降低其用户的网络风险，各组织计划在 2020 年将其网络安全预算的近 40% 用于安全意识培训。根据兰德基金会的一项研究，到
  2023 年，此类成本预计将指数级增长——增长 400%——超过了预计增长 200% 的攻击损失。这种激增的需求催生了培训供应商的产业，从小型作坊到价值数亿美元的企业，甚至连思科和微软等传统技术公司也寻求进入该领域。已经，该领域投资者的兴趣见证了巨大的增长，培训公司获得了数十亿美元的估值，许多公司获得了种子资金。


  ## 效果差距


  但尽管培训被盲目开方且其供应商从中受益，但仍有一个关键问题尚未解答：所有的培训在准备用户防范社交工程攻击方面有多有效？


  这个问题的答案很难找到。因为跨不同组织和行业的培训效果客观数据并不公开。原因在于网络安全领域的竞争性质。大多数公司对其研究数据非常保密，只有不到 15% 的收集原始数据的网络安全研究开放给其他人员。我直接与安全培训公司打道的经验也一样，大多数公司不愿意让产品接受独立评估，更不用允许访问其研究数据。使用培训的组织也出于类似原因拒绝分享内部数据——担心负面声誉、担心吸引监管审查，或者更糟糕，担心被黑客视为脆弱。因此，从网络安全培训公司获得的关于培训有效的客观数据很少。


  ## 学术研究


  因此，我们必须依靠替代来源。可靠的指标来自学术和研究机构开展的研究。。许多研究对不同用户进行了控制实验，让我们了解了培训在不同用户群体中的效果。最早的研究之一是
  2004 年由纽约西点学院美国陆军网络研究所开展的。在这些统称为 `Carronade` 的实验中，五百名从不同班级随机选出的军官接受了钓鱼意识培训，随后收到了钓鱼测试以评估就绪情况。在接受了四小时计算机安全课程后，几乎所有的军官——80%（即四百人）都落入了钓鱼测试的陷阱。





  在另一项研究中，2005 年有 10,000 名纽约州雇员遭受了网络钓鱼攻击。其中，17%的人点击了链接，15%的人开始输入个人信息。尽管他们受到了 IT 经理的训斥，但在两个月后再次遭受钓鱼攻击时，仍有
  15%的员工落入了陷阱。^[21]在另一项研究中，2011 年，联邦资助的研究中心 MITRE 对一家总部位于华盛顿特的中型机构随机抽取的 1,500 名员工测试了嵌入式培训的有效性，方法是先进行钓鱼攻击，然后对中招者进行培训。在一系列试验中，研究发现，无论员工是否接受过培训，均有
  35%到 80%的员工点击了模拟钓鱼邮件中的链接。^[22]


  这些仅仅是现有的少数项研究之一。近期的一项元分析（一种汇总不同研究结果的方法）发现，在过去的 16 年里，仅有 12 篇关于培训研究的发表文章。其中，仅有四项研究比较了培训随时间推移的效果——而其发现越是模棱两可。^[23]
  其中一项显示培训效果在四周后消失，另一项则显示在两周后消失。还有一项发现没有产生任何即时或短期效果，而第四项研究则显示培训在 10 天后无效，但在 63 天后突然有效。


  还有另一类证据指向用户培训的相对无效性。这源于媒体对因社会工程导致的网络泄露和黑客攻击的持续报道。2020 年的几个月内，勒索软件攻击瘫痪了北卡罗来纳州、马里兰州、乔治亚州、德克萨斯州和路易斯安那州市政府的服务器和系统。所有攻击都使用了鱼叉式钓鱼来激活入侵。许多目标属于接受过强制性网络安全意识培训的组织，更不用说那些已经实施了本章前讨论的各种抑制措施的机构。此类报告不仅限于美国，全球范围内都有类似的报道。


  来自所有这些来源的数据质疑了“培训能提高钓鱼防备能力”的流行公理。但还有一个额外来源的数据。这源于我进行钓鱼测试的经验，以及我收到来自银行、联邦政府机构以及来自美国、加拿大、法国、荷兰、新加坡、印度、澳大利亚、新西兰和津巴布韦等地
  IT 经理和首席信息安全官（CISO）的邮件。几乎所有人都在实施各种形式的培训（有些持续了几年）失败后联系我。所以，如果你正在阅读这些并且在培训方法上获得过类似的结果，你并不孤单。


  今天，大多数组织无论拥有多少资金或人力，都开具他们手头的药物——培训——因为他们从公理上认为，问题在于用户由于缺乏培训而缺乏安全意识。这就像一个患者走进医生诊室，被告诉他们是因为没有吃医生桌上的药。大家现在甚至没有考虑培训是否必要，更不用评估谁需要培训以及需要多少培训，每个人都被开具了同样的“药”：培训。糟糕糟糕，组织反复地向所有人分发同样的培训，如果用户没有改进，组织就指责他们并称他们是问题所在，然后发放更多的培训。因此，网络安全中的“人因素”不仅仅是对现状的描述；它更具预言性。


  任何医疗治疗的起点都是理解病人患了什么病，但这一关键步骤被将用户视为机器操作员的安全工程师所回避了。他们从未停下来考虑人们为什么会成为社会工程的受害者——这些是帮助我们准确诊断和治疗他们的关键因素。第四章从我们本应该一直在的地方开始，解释用户为何会陷入钓鱼攻击的陷阱。


