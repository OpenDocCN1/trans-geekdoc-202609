  0–4 量表累计这 25 项的量表时，响应范围为 0 到 100。`CHI` 的早期版本包含 20 个项目，并使用 0–5 响应量表。增加了五个问题以提高覆盖范围并平衡量表。虽然最终的
  25 个问题在大多数情况下已经足够，但可能需要根据组织背景对问题进行重述或添加。尽管这样做可能会提高生态效度，但可能会改变整体结果。


  `CHI` 与任何其他衡量标准都不同。首先，此前没有有效的用户网络卫生衡量标准。它是第一个概念化用户网络卫生并识别其方面和维度的工具。


  其次，`CHI` 可适用于不同的组织和用户群体，无论组织规模大小或用户 IT 功能的复杂程度如何。它提供了最低必要卫生水平基准，并且可以轻松扩展，即通过添加更多问题来衡量特定用户组更复杂的需求。


  第三，`CHI` 不特定于技术和产品。它不衡量针对特定类型浏览器、应用程序、操作系统环境或软件的数字安全。相反，它关注用户的认知和行为准备情况。因此，它可以应用于任何地方并随时间推移衡量基准网络卫生，而无需大量修改。


  第四，`CHI` 使用世界上大多数人知道如何回答的标准调查问题进行衡量。对于 IT 员工和受访者来说，解释调查结果都是直观且简单的。


  第五，`CHI` 在衡量内容和得分方面是透明的。这与国土安全部的网络卫生仪表板等方法形成对比。


  最后，`CHI` 使用了多种类型的问题。该方法不仅限于单一的问题类型或用户安全性能的单一因素。它捕捉了知识、经验和卫生的技术因素。


  ## 网络卫生与网络风险的关系


  现在我们已经了解*网络卫生*术语的起源及其优势，让我们看看网络风险和网络卫生如何协作以实现网络弹性。


  `网络风险调查`衡量了来自网络钓鱼或其他社交工程攻击的风险。此类攻击通过侵入设备和系统直接造成损害。




  相比之下，`网络卫生清单`（Cyber Hygiene Inventory）涵盖了更广泛的保护用户行为。它包含了社会工程学以及其他类型的攻击。例如，`传输卫生`（transmission
  hygiene）追踪用户是否知道如何管理网络上的设备发现。这并不能直接防御基于电子邮件的钓鱼，但可以防止其他社会工程攻击向量，例如`中间人攻击`（黑客窃听通信）和`Wi-Fi
  伪造`（黑客创建虚假访问点）。同样，保持病毒防护程序更新（这是`存储和设备卫生`的一种形式）对防止钓鱼的作用有限，但有助于防止其他形式的设备和网络中断。因此，`CHI`
  涵盖了更宽泛的网络安全思想和行动。


  `CRS` 和 `CHI` 在衡量用户方面也存在差异。由于其侧重点不同，`CRS` 是一项反应性指标。它所衡量的某些内容，如`网络风险信念`和`怀疑`，在短期内保持稳定，但其他指标（如`启发式处理`）完全取决于环境因素。相比之下，`CHI`
  是一个稳定指标，用于衡量用户感知、熟练并有能力处理的网络安全各个方面。


  然而，`CRS` 和 `CHI` 都是互补的指标，共同构成了一个完整的故事。如果我们把钓鱼比作携带流感病毒的咳嗽或喷嚏，那么 `CRS` 捕捉了个体感染流感的倾向；而
  `CHI` 则捕捉了人们为了避免感染或传播流感病毒而可以采取的保护措施。它的保护作用不仅限于流感，还能帮助抵御更多致病菌。


  就像人类健康一样，单靠卫生并不能保证不感染。它只是降低了容易感染的概率。总存在无法防止感染的情况。例如，有些人个人卫生习惯非常好，但可能因为免疫系统受损或疾病通过意外来源（如通过`受污染食物`）而感染流感。在另一个极端，也有人尽管卫生习惯差，但因为没有接触到病毒或拥有强大的免疫系统（产生抗性）而避免了流感。


  `网络卫生`和`网络风险`的情况也是如此。虽然大多数具有良好`网络卫生`的人应该具有较低的`网络风险`，但总会有具有良好`网络卫生`的用户可能因为 `CHI`
  未衡量的无意识行为而沦为钓鱼攻击的受害者。在另一端，也存在`网络卫生`较低的用户免受钓鱼攻击的保护。如果一个组织的 IT 部门创建了`邮件传递规则`（例如，`不传递任何标记为外部的邮件`），用户对此并不知，这些规则保护了用户免受钓鱼攻击，但并未计入
  `CRS`。


  但虽然用户的无意识行为可能会被 `CHI` 遗漏，但会被 `CRS` 考虑到。同样，如果 `CRS` 漏掉了公司范围的`邮件传递规则`，`CHI` 可以在`能力维度`中捕捉到它。通过这种方式，两种衡量方法互为补充——共同捕捉了所有的成因。如果不衡量`网络卫生`和`网络风险`，很难获得这些教训。因此，同时衡量
  `CRS` 和 `CHI` 可以对网络韧性进行全面的估计。


  因此，希望建立用户依赖性的 IT 经理应该同时使用这两项指标。IT 管理层与其仅仅关注`钓鱼测试`正如大多数组织目前所做的那样）甚至是生成`用户风险画像`，不如通过应用
  `CRS` 和 `CHI` 来学习更多。前者的执行频率需要比后者更高。


  ### 用例 1：使用 `CRS` 和 `CHI` 构建用户依赖性


  `CHI` 为意识、知识、能力和执行提供了基准。`CRS` 可用于识别这些领域的差距。通过使用`卫生评分`，IT 经理可以确定谁需要更具体的安全实践。例如，得知`双重身份验证`（`2FA`）未被恰当使用，结合`风险画像`可以帮助理解钓鱼攻击对组织构成了多大的威胁。


  ### 用例 2：使用 `CRS` 和 `CHI` 构建网络安全文化


  `CRS` 为 IT 部门提供了一个衡量和量化的工具。当得到恰当沟通时，这可以帮助建立一种保护企业免受网络攻击的共同责任感。


  通过 `CRS` 的开放式回答，IT 人员还可以识别良好的实践——即那些让人们处于较低钓鱼风险水平的行动——并为组织的其他人员创建最佳实践惯例。此类实践在培养新的网络安全思想和行动方面的有效性可以使用
  `CHI` 进行评估。`网络卫生评分`结合`风险评分`也可以作为讨论的起点。


  告知用户他们的`网络卫生评分`以及`风险画像`，可以帮助他们理解自己的短板、需要思考或做哪些不同的改变，以及他们的行动如何削弱或贡献于组织安全。因此，这些评分可以为与用户的讨论提供基准，并为他们需要去的目标创建路线图。





  # 用例 3：使用 CRS 和 CHI 进行战略规划——决定谁在何时以及为何要获得什么方案


  目前存在数十种不同的网络安全倡议、服务和解决方案，每种方案都有其实施的强有力理由。IT 管理人员面临的问题是如何能够最好地使用这些工具。其中哪些是有效的？组织应该在每项方案上投入多少费用？哪些方案是相关的？组织中谁最需要这些方案？为什么？这些都是战略性问题，可以避免不必要的支出，并节省时间和精力的。


  `CRS` 结合 `CHI` 可以帮助 IT 部门根据其整体风险评估来理解谁需要什么解决方案。随后，可以根据每种解决方案对不同网络卫生水平维度的影响，对每项倡议进行成本效益评估。某些倡议甚至可能对不同卫生维度产生渗透影响，因此尽管它们的成本更高，但影响范围也更广。现在，可以识别出这些倡议了。


  此外，虽然组织会定期开展意识培训计划，但谁需要更多意识以及培训应该侧重于哪些主题仍然尚不明确。许多 IT 部门遵循供应商的引导，并根据其建议制定计划，但此类指导可能并不适用于每个组织。现在，利用卫生清单，IT
  部门可以衡量出最需要的，并仅关注重要的 `SAFETY` 维度。他们甚至可以关注其中的个人因素。例如，得知用户对即时通信卫生的认知很低，且这导致了高网络风险，这可以开发出专门针对这一问题的倡议。或者，由于缺乏执行力（enactment），可能有助于制定出促进更多使用安全技术的倡议，而这可能不需要投入更多的意识培训。


  每一位战略规划者都必须面对的另一个问题是，培训的相对价值（从时间和成本两个角度考虑）与有助于遏制和限制的解决方案（在第 3 章中讨论）相比。目前，还没有一种可衡量的机制来测试各种替代方案的相对效力。IT
  部门拥有的只有供应商提供的数据或他们应对攻击的经验，在这些情况下，单个系统的价值变得显而易见。


  得益于 `CHI`，组织只需要每年进行一次网络卫生评估，并在使用 `CRS` 进行网络钓鱼测试后再次进行一次跟进。假设渗透测试是影响卫生清单两次应用的唯一因素，那么
  `CHI` 的任何变化都可以归因于此。


  与此类似，IT 部门现在不再将所有问题归咎于用户，而是通过对比用户风险与卫生清单的容量衡量，精确地找到问题出在哪里。这可以帮助确定用户缺乏资源来保障网络安全的区域。一旦确定，就可以制定预算、计划资源和安全倡议来改进这一领域。他们的成功也可以通过在年底晚些时候简单地重复整个过程来跟踪。这样做可以在保护用户和提高组织网络韧性方面节省大量的时间、成本和精力。


  ***


  # 用例 4：使用 CRS 和 CHI 跟踪用户随时间推移的改进


  对于 IT 管理人员来说，了解用户的安全态势是否正在改进至关重要。意识倡议往往不尽人意，因为它们过于关注建立意识而非知识；在其他时候，知识和意识可能看起来很高，但网络风险可能会继续上升。目前，还没有机制可以精确定位这些中的任何一种情况。


  网络风险评估过程提供了一种替代方案。通过使用 `CRS`，IT 管理人员可以理解谁需要什么解决方案。`CHI` 更进了一步，允许 IT 管理人员知道谁处于风险之中以及随时间推移的情况。（注：原文此处存在大量重复句子，译文已根据要求去重并保持逻辑连贯）。[此处重复内容已省略]。得益于
  `CHI`，组织只需要每年进行一次网络卫生评估，并在使用 `CRS` 进行网络钓鱼测试后再次进行一次跟进。假设渗透测试是影响卫生清单两次应用的唯一因素，那么 `CHI`
  的任何变化都可以归因于此。


  与此类似，IT 部门现在不再将所有问题归咎于用户，而是通过对比用户风险与卫生清单的容量衡量，精确地找到问题出在哪里。这可以帮助确定用户缺乏资源来保障网络安全的区域。一旦确定，就可以制定预算、计划资源和安全倡议来改进这一领域。他们的成功也可以通过在年底晚些时候简单地重复整个过程来跟踪。这样做可以在保护用户和提高组织网络韧性方面节省大量的时间、成本和精力。






  虽然之前讨论过的导致 `NRS` 的风险评估过程需要每个组织的 IT 部门参与，但卫生状况清单（hygiene inventory）仅需调查，并可以由保险公司直接管理。这提供了两组丰富的数据：风险数据和安全数据。这两条数据流相结合可以揭示一个行业的准备状态，以及不同组织在其中的排名。


  作为替代方案，网络安全保险公司基于 `V-Triad` 开发自己的钓鱼渗透测试范本，并使用其内部的“专家”样本或通过汇总某些当前客户开展的基准测试结果来评估其基准。寻求保险的新机构可以被要求使用该范本进行渗透测试，并将其数据与保险公司的内部基准进行比较。通过这种方式，安全保险公司可以独立地推导出
  `NRS`，并对组织的韧性水平获得更准确的估计。这些数据可以与组织的 `CHI` 结果进行对比，帮助该组织识别可以降低保费的改进领域。


  ## 使用用例 8：使用两种方法比较不同的行业、地区和国家


  最后，执法部门和公共政策制定者可以对样本组织进行卫生状况调查，以了解一个行业甚至整个地区或国家缺乏什么。参与组织的样本可以自愿提供去标识化的内部数据，这些数据可以揭示地区的风险和卫生水平。这些数据可以作为决定理想卫生水平的基准。通过网络或电话调查，可以从地区的受访者样本中收集卫生水平的代表性数据，并与基准进行对比。这有助于建立应对网络攻击的韧性。这些数据可以为政策提供参考，并作为分配执法资源、引导舆论活动以及在该地区开发工具和报告门户的工具。


  这八个用例展示了可能性。它们展示了不同的群体——IT 管理员、政策制定者、保险公司和安全培训组织——如何实施 `CHI` 和 `CRS` 以获得可操作的见解。`CRS`
  可用于开发用户的风险画像并解释其风险产生的原因。`CHI` 也可以单独用于确定用户的卫生水平。但通过将两者结合使用，IT 部门可以获得关于用户脆弱性和准备情况更详细的信息。网络韧性源于智能、基于证据的解决方案的评估、量化和实施。通过
  `CRS` 和 `CHI`，IT 部门可以根据网络风险对用户进行分层，识别薄弱环节，理解其风险原因，并实施、跟踪和改进他们的网络卫生解决方案。换句话说，他们可以实现网络韧性。


  第 9 章提供了组织案例，这些组织遵循书中的方法实现了这种韧性。


