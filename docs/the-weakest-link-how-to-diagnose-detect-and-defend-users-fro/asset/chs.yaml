  # 2 什么使得社会工程学成为可能


  2016 年 3 月 19 日，希拉里·克林顿总统竞选主席约翰·波德塔（John Podesta）收到了谷歌的一封邮件安全警告，要求他重置 Gmail 密码。在与幕僚长确认后，波德塔遵从了要求。


  该警告是针对波德塔邮件账户的鱼叉式钓鱼攻击的一部分。俄罗斯国家支持的黑客利用波德塔的账户下载了 20,000 封与竞选相关的邮件。同样成为目标的还有民主党国家委员会（DNC）和民主党国会竞选委员会的工作人员。许多人遵守了要求，结果发现他们的邮件像波德塔的一样被破解，并通过
  WikiLeaks 等文件共享网站泄露。邮件内容有些被断章取义，有些通过虚假信息运动被放大，最终影响了许多选民——并改变了美国政治历史的进程。


  在另一个没有历史意义上，2018 年 9 月，苹果公司报告称一名来自澳大利亚的人多次入侵了其内部服务器。在此之前，2014 年、2015 年和 2017 年也发生过入侵。2014
  年的入侵是著名的 iCloud 照片泄露，有人非法获取并发布了许多名人的照片。鉴于此，苹果对网络数据访问格外小心。然而，它再次被破解。这一次不是用户的私人照片，而是直接从苹果公司服务器窃取的
  90GB 数据——对于一家以保密文化闻名的公司来说，这是一个沉击。


  克林顿竞选泄密和苹果泄密有两个共同点。两次攻击都是通过鱼叉式钓鱼实施的，而且两个受害者都对这类攻击有预警和处理经验。在苹果案例中，早期的 iCloud 泄露源于鱼叉式钓鱼，而
  FBI 也警告过 DNC 他们可能成为目标。DNC 同样拥有具备技术技能处理此类攻击的 IT 服务台，波德塔的幕僚长也专门询问过那封邮件。


  那么，是什么让网络钓鱼如此难以停止，以至于 FBI 的预警和最顶尖的技术人才都无法阻止它？每当这个问题出现时，通常的答案是社会工程学攻击很容易制作。但这只是直接原因。没错，网络钓鱼因为它利用了电子邮件、电话和短信，所以很容易制作，但其他犯罪也是如此。





  近因通常指向显而易见的影响，这让我们感到满意，因为满足了我们理解的需求。但它们可能会掩盖问题的根本原因，导致我们在错误的地方寻找解决方案。这就是为什么人们投资家用摄像头和安全系统来对付较小的问题，却不愿意花钱保护自己的在线身份，而后者的被盗取风险更大。这种对钓鱼原因的短视，，是钓鱼行为无法阻挡的原因之一。


  本章将解释钓鱼之所以难以停止的根本原因，这些原因与金、凭据、虚拟世界的大小以及网络安全的“人的问题”有关。


  ## 金钱


  2016 年民主党委员会（DNC）黑客事件与 2018 年苹果破解事件之间的共同点不仅在于拥有针对性钓鱼的先验知识和经验。还有另一个相似之处：两次攻击都是由青少年实施的。针对
  Podesta 邮箱的攻击是由 14 岁的哈萨克裔加拿人卡里姆·巴拉托夫（Karim Baratov）实施。针对苹果的攻击则是一个来自澳大利亚墨尔本的 16 岁少年，由于澳大利亚保护青少年罪犯的法律，他的姓名未公开。


  巴拉托夫有两项技能。一个是针对性钓鱼——他在辍学后完善了这项实践。俄罗斯情报机构经常寻求他的帮助来窃取像 Podesta 等用户的邮箱凭据，Podesta 没有使用雅虎邮箱服务，而雅虎已经在
  2013 年通过之前之前的密码泄露攻破了该服务。这就是为什么许多专家认为是巴拉托夫帮助破解了 Podesta。


  巴拉托夫的另一项技能是他了解美国文化、习俗和节日。凭借这些，他能够编写出极具吸引力的钓鱼邮件，并一直这样做，直到他在 21 岁时被美国司法部（DoJ）起诉。


  和巴拉托夫一样，黑进苹果的青少年也是个业余余。他他用一台消费级笔记本电脑进行作案，并将偷取的数据保存在名为“hacky hack hack”的文件夹中。但他们并不是唯一的青少年钓鱼者。


  2020 年 7 月，比尔·盖茨、埃隆·马斯克、巴拉克·奥巴马以及许多政界和科技界知名人士的 Twitter 账户遭到破解。这些黑客从这些账户发布推文，要求捐赠
  1000 美元，他们包括一名来自英国的 19 岁少年、一名来自佛罗里达州的 22 岁青年、一名来自马萨诸塞州的 16 岁少年以及另一名来自佛罗里达州的成年人，他们使用了手机针对性钓鱼进行攻击。之前提到的
  2015 年和 2017 年苹果破解事件也是由来自澳大利亚阿德莱德的 17 岁少年实施的。


  还有 24 岁的马库斯·哈钦斯（Marcus Hutchins），他被誉为阻止了 WannaCry 攻击的人，这次分布式勒索软件攻击在 2017 年 5 月感染了全球约
  30 万台计算机。在因这一成就获得媒体赞誉仅几个月后，美国司法部就起诉他托管钓鱼域名并创建窃取密码的恶意软件。和巴拉托夫一样，哈钦斯在青少年时期就开始从事钓鱼，并一直持续到被捕。


  这种情况在过去并非如此。早期的黑客并没有导致产生更多的黑客。许多人成为了教授、企业家和技术专家。这包括罗伯特·T·莫里斯（Robert T. Morris），他开发了最早的计算机虫之一——莫里斯蠕虫，后来成为麻省理工学院的教员。比尔·盖茨、保罗·艾伦和史蒂夫·乔布斯在青少年时期也参与过电话破解和破解，我们知道他们的结局如何。因此，钓鱼似乎有某些特性鼓励了更多人的参与。理解其原因就能揭示钓鱼的根本原因之一。


  鼓励钓鱼的是用户数据的供需。正是这个市场燃料了钓鱼——并使其无法阻挡。当计算机从主要的业务机器转变为管理人类生活各个方面的工具时，这种情况才成为可能。


  回到 20 世纪 60 年代，计算机极其巨大笨，购买和维护费用数百万美元。使用这些机器也不容易，编程和使用需要专门的编码技能。随着时间的推移，处理芯片、文件管理系统的进步，以及电池和显示技术的创新，导致了更小型个人电脑（PC）的发展。


  PC 是游戏规则的改变者，因为它成本更低、可以直接存储文件并允许处理数据。这促进了用户与计算机交互的简化方法的发展，催生了图形用户界面（GUI）、标准化操作系统和用户友好软件。PC
  的易用性吸引了更多用户，并随之带来了更多使用。最终，个人 PC 和服务器创建了互连的网络，形成了今天的互联网。


  与计算增长并行的是黑客行为的兴起。早期的黑客是技术爱好者，他们展示自己的技术实力，而不是破坏 PC 的运行能力。即使他们想这样做，大多数人也无法造成多大伤害。


  计算机之间缺乏连接限制了这一点。恶意病毒必须通过存储设备在计算机之间进行物理传输。例如，1986 年由两名位于巴基斯坦的程序员开发的第一个 MS-DOS 计算机病毒
  Brain，是通过包含他们软件非法拷贝的软盘进行分发的。同样，第一种勒索软件攻击“艾滋病木马”（AIDS Trojan）是由一位生物学家在 1989 年开发的，通过
  2 万张软盘进行传输，这些软盘是他在世界卫生组织一次艾滋病会议上分发的。但当计算机和服务器互连时——当它们变成互联网时，这种对物理分发的需求改变了。


  互联网使病毒能够通过电子邮件程序广泛分发。其中最早的是 1988 年部署在互联网前身 ARPANET 上的莫里斯蠕虫。这种蠕虫利用 UNIX 邮件系统中的弱密码和其他漏洞来寻找主机、复制并传播。据估计，莫里斯蠕虫感染了
  6000 多台主要的 UNIX 机器和节点（占当时网络的三分之一），并减慢了哈佛、斯坦福、普林斯顿等许多顶尖大学以及劳伦斯利物浦国家实验室的功能运行。停止它需要对整个网络流量进行数日的分区，总成本为
  10 万美元——按通货膨胀调整后，相当于今天的约 22 万美元。因此，虽然莫里斯蠕虫具有重大意义并成为今天许多恶意软件的蓝图，但其破坏力有限。


  随后的许多计算机病毒也是如此。它们可以破坏或干扰，但不能窃取数据。这种现象有三个原因。首先，由于个人 PC 的存储空间很小，实际上并没有多少数据可以窃取。例如，1998
  年的苹果 iMac 仅有 4GB 硬盘。其次，许多数据价值也有限，因为计算在很大程度上仍被企业使用，主要处理行政任务。





  第三，拨号连接的使用（即用户通过电话网络接入互联网）极大地限制了窃取能力。这种在线技术一直持续到新千纪初的早期，它涉及通过互联网服务提供商（ISP）连接到服务器、下载数据然后断开连接。电话公司按分钟收取互联网连接费用，因此用户使用互联网非常节约。他们会断开网络连接并关闭系统。这不仅遏制了蠕虫的传播，而且由于设备不再连接到网络，也限制了从这些设备中提取数据的能力。在很快之后，情况就发生了变化。


  从 2001 年开始，大多数发达国家开始利用现有的电缆电视基础设施，从拨号上网转向宽带。用户不仅享受了更高的互联网连接速度，而且不再需要为上网时长付费。这促使互联网使用时间大幅增加，而在线共享的数据量也随之相应增加。用户的在线频率也更高了，因此他们的设备很少断开网络。随之而来的是一种新的商业模式，它在几年前已经开始，但很快就会主导互联网。


  ### 数据变现的兴起


  这始于 1996 年如 `Hotmail` 等基于网页的电子邮件服务。当时，`AOL` 这样的 ISP 将大多数电子邮件服务作为其付费服务的一部分提供。为了增加注册量，`Hotmail`
  提供免费邮箱，以换取对用户存储或披露的信息变现。用户非常喜欢这种模式。一年内，就有 1000 万订阅者注册了 `Hotmail`。


  其他企业注意到了这一点并纷纷效仿。出现了搜索引擎、地图服务、即时消息平台，以及社交网络服务、照片共享、文件共享，甚至是整个操作系统。随之而来的是更多的用户数据。这包括关于用户通信、私人时刻和生活内部运作的数据（因为电子邮件和消息变得越来越无处不在），以及关于他们所在地、如何移动、遇见了谁以及如何相遇的数据。随着时间的推移，越来越多的业务上线，关于每个人的健康、祖谱甚至
  DNA 的数据也变得可获取。在 21 世纪初，用户提供给在线服务的数据多到公司甚至不知道如何处理。数据仍然是一种大商品，其潜力尚未被完全挖掘。


  随着 `Google` 这样的搜索引擎和 `Facebook` 等社交媒体公司的兴起，情况发生了变化，这些公司想出了如何利用用户数据。`Google` 不仅收集其服务上用户的数据，还对其进行模式分析。这成了向用户投放广告和推广的基础。`Facebook`
  既从其订阅者那里收集他们喜好和讨厌的数据，也从与其关联的人那里收集数据，使得根据偏好对用户细分成为可能。


  ### 数据作为货币


  广告商涌向这些在线业务，是因为它们提供了精细的用户细分机会。他们可以以无数种方式分析其产品的潜在市场，并对用户进行微观定位。用户对在线推广的响应也可以被追踪，从而能够在广告支出上进行水平的衡量，而这是大众媒体（电视、广播、报纸）广告从未能实现的。这使得用户数据成为了互联网的货币。它决定了许多在线业务的市场估值。


  1997 年，`Microsoft` 以 5 亿美元收购了 `Hotmail`，以获取其 850 万电子邮件用户的数据。对用户数据进行变现的能力驱动了 `Google`
  在 2007 年以 31 亿美元购买了 `DoubleClick`，这是它购买 `YouTube` 所花费的两倍。这还导致了大多数消费者一无未知的数据库营销公司
  `Acxiom` 在 2020 年的估值达到了 35 亿美元。


  这种估值导致了更大规模的数据吸取操作。`Facebook` 的专利显示了挖掘设备麦克风的计划，以捕捉环境音，从而揭示用户的媒体使用模式（例如看电视）。像 `Google`
  这样的公司推出了一系列从免费邮箱到地图和照片共享的琳琅满目的服务。包括 `Amazon`、`Microsoft` 和 `Apple` 在内的公司也带着大量产品和服务加入了战。这导致更多关于用户的数据在线上被收集、挖掘和交易。


  到 2020 年，`Facebook` 以其 20 亿用户估值为 7000 亿美元，折合每人约 350 美元。`Google` 以其 40 亿活跃用户估值为 1
  万亿美元，每人约 250 美元。这些估值反映了在线市场上对用户数据的需求，以及这些公司能够提供的关于用户信息的质量。追逐用户数据的资金促使更多机构上线，随之而来的是更细粒的用户数据。


  ### 社会工程与暗网


  这种对数据的需求最终驱动了社会工程。黑客利用那些为了获取用户数据而建立的免费电子邮件和消息服务，就可以访问设备并窃取这些数据。他们可以利用这种访问进入组织服务器，因为现在从会计到财务再到通信的许多事情都已上线，访问组织服务器提供了源源不断的数据供应，黑客可以利用、重新利用或出售这些数据。数据对组织的生存是如此关重要，以至于公司与其冒丢失数据的尴尬风险，甚至愿意支付赎金。


  这一切的润滑剂是一个被称为 `Dark Web`（暗网）的市场。在这里，黑客可以交易偷取的货物并从中获利。恶意软件、黑客技能和用户数据可以在这个市场上购买——价格仅为
  `Facebook` 或 `Google` 可能收费的一分之一。用户被盗的社会安全号码可以每条 4 美元的价格购买，余额高达 1000 美元的信用卡 10 美元一个，余额为
  1 万美元的受损银行账户 25 美元一个。进一步促成这些交易的还有不可追踪的在线支付网关、数字货币和加密通信应用，以及几乎没有监管或法律监督。最后，还有赞助。国家、间谍机构甚至许多国家的执法部门寻求同样的用户数据，用于间谍活动和针对异见人士及敌人的攻击。他们培养了黑客并助长了他们的气焰。


  凭据


  另一个钓鱼被青的原因是：它可以做什么。钓鱼提供了窃取用户凭据最简单、最直接的方法，即登录名和密码。





  凭证被盗取是因为，一旦被获取，任何计算机系统几乎无法将黑客的身份与合法用户区分来。它是任何泄露事件的起点，也是获取计算机网络中所有数据完全访问权限的要素。2016
  年被盗取的是约翰·波德斯塔（John Podesta）的 Gmail 密码，而在 2014 年、2015 年、2017 年和 2018 年，被黑客盗取的则是 iCloud
  用户和苹果员工的凭证。


  我们在计算机上使用凭证进行身份管理的系统始于半个多年前，而且从诞生之初就存在缺陷——这种缺陷在早期就已显而易见，但却被忽视了。因此，它一直在滋滋生长，这也是钓鱼攻击在黑客中盛行的另一个原因。


  ## 凭证系统的起源


  如今的凭证系统开发于大型机计算的早期，即麻省理工学院（MIT）的兼容时间分用系统（`CTSS`）。该项目在 20 世纪 60 年代发明了大型机上的多任务处理技术，并为个人计算铺平了道路。允许多个用户使用使得访问管理变得必要，以便确保每个用户的文件保持相互独立。简单的解决方案是为每个用户提供一个只有他们自己知道的密码，并在登录时输入该密码。计算机系统随后在内部将密码与登录名进行匹配，以验证用户身份并提供访问权限。


  这有一个明显的缺陷：系统无法判断输入登录名和密码的人是否是合法用户。这在当时被认为不是问题，因为该系统本打算仅供少数受信任的用户使用，而这些人都会努力维护大型机的完整性。他们推论认为，毕竟，没有人会从破坏系统中获益。


  当然，他们错了。这一局限性很快被另一位麻省理工的博士生艾兰·谢尔（Allan Scherr）利用了。在历史上首例凭证黑客攻击中，谢尔由于想在 `CTSS` 上获得更长时间的计算时间，他从系统数据库中打印出每个用户的密码，使用他们的凭证进行登录，并窃取了被分配的时间。系统并没有变得更聪明，而他的“原罪”直到直到他在
  20 世纪 90 年代后期承认才被公开证实。但黑客社区的每个人早已对此知情。他盗取凭证的行为激发了许多模仿者，其中最著名的故事是年轻的比尔·盖茨和保罗·艾伦入侵计算机中心公司（CCC）的大型机以获取免费计算时间。


  ## 漠视与密码的传播


  这种黑客尝试并没有引起多少关注。就像电信公司看待电话破解（phone phreaking）一样，最初的凭证泄露被视为急于使用新计算技术的青少年所犯的小规模行为。因此，当在使用盗取的凭证作案被抓获时，15
  岁的比尔·盖茨仅被禁止使用该系统一年。无法访问被认为是足够的惩罚了。因此，从未进行过加强该系统的严肃尝试。


  由于对凭证黑客攻击的集体漠视，随着时间的推移，登录名和密码成了访问所有在线服务的默认方式。今天，从电网到医院系统、水坝控制器、核电站、全球银行系统，甚至位于国际空间站（`ISS`）的系统，每一个计算机网络主要都受密码保护。这一关键信息是每个黑客——即使是最近针对
  `ISS` 的黑客——最终的目标，因为一旦获取了密码，黑客就变成了用户，并享有该用户在计算机系统上的所有虚拟权限。


  ## 改进系统的努力


  近年来，由于凭证泄露导致的大规模数据破解促成了若干改进系统的努力。这些包括：基于知识的身份验证方法，要求用户回答只有他们可能知道答案的问题（例如，母亲的娘姓、第一只宠物的名字等）；双重身份验证（`2FA`），通过短信将数字密码发送到用户持有的手机上，并在登录名和密码凭证之外输入；物理令牌，提供一个需要附上的数字密钥以确认用户的存在；以及生物识别，如面部识别和指纹，在身份验证期间作为用户物理存在的证明进行输入。一些国家（如爱沙尼亚）甚至引入了带有加密芯片的电子身份卡，在线时必须使用它来确认身份。


  这些方法在原始的登录名和密码组合基础上增加了不同层的额外信息，但它们只是减慢了黑客的速度，而不是阻止他们。它们还给用户了一种虚假的安全感，最终让他们变得更加脆弱。


  ## 现代身份验证的局限性


  以 `2FA` 为例，它是保护凭证的最广泛解决方案之一。从 Amazon 到 Zoom 的每一个主要在线服务都对其提供了支持。但 `2FA` 并没有解决身份验证问题。这是因为第二个因素（称为身份验证令牌）必须存储在某处的计算机上。它同样受到另一组凭证（另一个密码组合）的保护。每一个解决方案层都隐藏在另一个遭受着其旨在保护的相同局限性的层之后。


  网络安全公司 Mandiant 在一次使用 `2FA` 保护工作站组织的模拟攻击中证明了这一点。他们直接破解了那台服务器。然后，通过回溯，他们识别了密码所属的工作站，并获得了对它们的完全访问权限。其他模拟还展示了绕过
  `2FA` 不同层次的技术：

  - 发送虚假的短信请求，引导用户提供其第二因素令牌；

  - 伪造或欺骗用户输入第二因素的网页；

  - 伪造用户接收令牌的手机号码；

  - 直接从保持用户登录各种账户的浏览器中窃取会话 Cookie（session cookies），以跳过甚至输入凭证的需求。


  虽然模拟显示了理论上的可能性，但实际上窃取凭证所需的手段要更少。以德勤（Deloitte）为例，它是全球顶尖的安全咨询公司之一，其客户邮箱在 2017 年底被某人直接破解其全球邮箱服务器而泄露，该服务器甚至没有启用多因素身份验证。再考虑最近发生的针对数百万
  Microsoft Outlook、MSN 和 Hotmail 邮箱的破解事件，黑客窃取了微软客户支持代理的凭证。这些代理没有使用双重身份验证，但由于工作需要，他们对客户机器拥有特权访问权限。这意味着黑客通过远程端口获得了对所有客户设备的后门访问。





  在双重身份验证（2FA）之外，许多安全专家主张将生物识别作为安全认证机制。一些未来主义者甚至建议植入生物芯片并使用 DNA 标记来验证用户身份。从上看，这些解决方案似乎是安全的，但并非所有的生物识别都是唯一的，而且随着医学科学的发展，也将不再唯一。即使是长期以来被认为每个人独有的人类
  DNA，现在也可以被改变。这一点在最近的一个案例中变得明显：一个骨髓受者的 DNA 变成了捐赠者的。受者的嘴唇和脸颊仍然保留着自己的 DNA，但他的精液却是捐赠者的。


  面部特征和指纹等生物识别技术还有另一个致命缺陷。如果被盗取，生物标记无法被撤销或更改。因此，一旦丢失，遭受损害的人将永远无法从该损失中恢复。此外，盗取用于身份验证的生物标记并不困难。毕竟，它们是数字化的，并存储在受密码和登录组合保护的计算设备上。就像身份验证令牌一样，它本
  intended 克服的凭据弱点，反而被用来来保护它本身。


  因此，无论系统有多安全，或者有多少层保护，破解它的关键就在于找到授权用户的凭据——即有权访问价值数据的人。这就是鱼叉式钓鱼（spear phishing）和伪装攻击（pretexting）帮助实现的目标。


  ## 世界很小


  找到具有特权访问权限的授权用户比大多数人想象的要容易得多。在互联网出现之前，人们之间隔着大约“六度间隔”，与完全陌生的人联系需要联系至少另外五个作为中间人的的人。在我们所生活的这个超连接的世界里，大多数人之间只需要在正确的搜索门户点击一下。这点击一下就将我们隔离开来。这也是黑客与特权用户之间的区别。


  “六度间隔”概念是由一个涉及演员凯文·培根（Kevin Bacon）的室内游戏普及的。玩家必须在自己的社交圈中找到最少的人数将自己与他隔开。谷歌甚至开发了一种搜索算法，提供“培根数”，显示任何好莱坞演员与凯文·培根之间的间隔度。


  这个游戏的理论是哈佛大学教授斯坦利·米尔格拉（Stanley Milgram）在 20 世纪 60 年代的一项开创性研究。米尔格拉随机从威斯康星州利西达和奥马哈州选择了志愿者，要求他们将一个文件夹手动递送给波士顿的一个目标人物。预期是，文件夹的传输将根据个人的社交连接程度、其地位以及他们居住的地方（相对人口密度、地理稀疏程度、邮政系统等）而异。


  令人惊讶的是，这一切并不重要。无论地位和位置如何差异，每位志愿者都需要通过五个互连的人才能到达目标——这得出的结论是大多数人之间只隔着六度。米尔格拉将其称为“小世界”现象。


  但那是另一个时代了。当时不仅没有区域、国家或全球性的信息库，而且正如我们在第 1 章看到的，州际电话通话也贵得惊人。人们必须旅行到不同的地方，询问人脉较广的当地人，例如邮员、牧师、调酒师或服装商人。这需要时间、精力、金钱和动力。


  现在世界变得更小了。电子邮件、社交媒体、VoIP（网络语音协议）以及搜索引擎、网页和博客等中介，帮助我们在几秒钟内免费定位并联系任何地方的任何人。这不需要与任何人交涉，也不需要花费大量精力四处奔波。你只需动动手指就能了解他人。


  米尔格拉研究的复制数据提供了这一证据。对 Facebook 用户之间相互连接的研究发现，每个人之间只隔着四个人；对 Twitter 的类似研究发现了三三度间隔的证据。请记住，这些只是每个平台内部的连接可能性。它们没有考虑到跨平台搜索，例如当有人在搜索引擎或公共数据库上查询某些内容，并在不同的社交媒体平台上进行跟进时。


  但黑客甚至不需要付出这么多努力。2020 年，在中国运营的网络安全公司“真华”（Zhenhua）被发现系统地收集了来自整个范围内关于美国、英国、澳大利亚和印度政客、记者、反对人士和技术人员的数据。他们爬取了所有在线存储库，使用了社交媒体帖子的数据，还添加了来自暗网（Dark
  Web）的黑客数据。数据库的规模令人震惊。不仅有关于目标人物的大量数据，还有关于他们的家人、亲属和熟人的类似数据。只需点击一下，真华的客户就能找到权力或与他们密切相关的人。他们可以找到关于他们或与他们相关的任何人的私密信息。从那里开始，能够成就的限制取决于客户的动机。


  在当今的网络世界中，黑客找到某人不需要五步。只需要在正确的数据库上点一步。我们与黑客之间只隔着一度。这种定位、了解他人以及访问授权用户的易用性，是钓鱼攻击盛行的另一个原因。


  ## “人的问题”


  “我恨死用户！”“给我一个没有用户的网络，我向你保证安全。”这是某位从事机密研究的美国政府实验室的首席信息安全官（CISO）在我参加的一场会议上，表达他对企业安全的担忧时说的话。这种情绪在安全圈内相当常见，既反映了当今计算空间中用户带来的问题，也反映了
  CISO 在与用户打交道时面临挫败感。但事情是如何变成这样的？为什么 IT 管理人员对用户如此沮丧？答案揭示了钓鱼攻击如此成功的另一个根本原因。


  在大型机计算机早期，IT 管理人员控制着人们在机器上所做的一切的访问。在那时，硬件和软件故障不断出现，必须通过巧妙的设计来解决。因此，大多数早期的 IT 管理人员都是具有电子知识和软件编码技能的工程师。他们也非常受尊重。在某些方面，他们就像
  19 世纪的火车机司机，因为他们对巨大的机器所做的事情而备受尊敬，这在计算机时代意味着输入代码并产出信息。


  随着计算的变化，IT 管理人员的角色也随之改变。在 20 世纪 90 年代的多用户计算和 Windows NT 时代，他们变成了网络经理和工程师。随着万维网和搜索引擎的兴起，主要角色变为信息管理，这体现在新的组织职位如数据库管理员和首席信息官。在史密（SPE）黑客攻击后的十年里，IT
  管理人员的角色和头衔进一步演变。今天他们是 CISO 和安全官，主要负责组织内部的信息安全。





  20 世纪 90 代见证了图形用户界面（GUI）的发展，计算机程序员开发了可以激活软件中不同功能的动作按钮。所有用户只需使用电脑鼠标指向并点击按钮即可。这简化了文字处理、数据库管理和演示文稿的功能。现在，用户可以在计算机上执行复杂的操作，而无需了解任何行代码。


  随着时间的推移，用户可以使用易于使用的、现成的第三方软件和服务，来创建电子邮件账户、开发网页、建立计算机网络并维护个人服务器，而完全不需要与 IT 经理交道。IT
  部门日益成为用户的支持性职能，只有在计算技术出现问题时才会被召唤，例如发生病毒感染或用户无法处理的其他严重硬件或软件故障时。正如机车工程师的价值随着更新型交通工具的演变而降低，IT
  经理在组织内的价值也随之下降。


  到 2006 年，随着高速互联网连接的普及和带宽的增加，这一趋势变得更加恶化。亚马逊以及随后在 2008 年的 Google 和其他供应商推出了服务器农场，提供外部数据仓库、托管和
  IT 管理服务。这些服务帮助外包了许多内部 IT 运营并降低成本——这种需求在随后的金融危机期间表现得尤为强烈。衰退力量与许多低劳动力国家（如印度和菲律宾）的供应商增长相结合，导致了更多内部
  IT 功能被外包。


  尽管外包趋势正在加速，但另一项重大技术创新也接踵而至。这一次来自苹果公司：iPhone。iPhone 于 2007 年发布，iPhone 及其移动应用（或“App”）市场将产品和程序的目标群体转向了普通用户——这些用户被认为具备极少的编码技能，并且需要可靠且易于使用的计算设备。当时，大多数
  PC 甚至像黑莓这样的智能手机都是卖给企业的，但苹果公司专注于销售一种只需开箱即用、不需要过多支持的产品。


  用户可以从 Apple Store 购买 iPhone，并直接从其应用市场下载软件。久而久之，许多大型科技公司也效仿此，通过自己的市场提供其操作系统、硬件和软件。这是
  IT 实践的一项重大变化。不久前，新的操作系统和软件在组织内部会通过内部 IT 质量控制流程进行测试（通常持续至少一年），然后部署并安装到员工的工作站上。这一过程使得更容易识别软件中的根本缺陷，并避免那些连软件创建者都未知的系统缺陷——零日漏洞——在它们泛滥之前被规避。


  在苹果启发的这种范式中，技术供应商和开发者决定了购买哪些设备、哪些内容可以下载，以及何时以及如何使用它们。系统更新甚至关键漏洞很快通过在供应商网站发布的的可下载软件补丁得到修复。IT
  部门过去负责确保的任务，如更新和应用关键补丁，现在变成了用户的责任。随着大多数硬件、软件和疑故障排除功能直接由用户管理或通过供应商帮助热线管理，组织内的 IT
  员工不再被认为是必要的。


  随后的几年，便携式计算领域出现了更多创新，平板电脑、智能手表、可穿戴设备和物联网（IoT）设备都直接向用户推销。用户排队购买这些产品，有时在这些产品正式发布之前，就会通过
  Kickstarter 和 GoFundMe 等网站进行购买。


  媒体进一步推动了这一趋势。他们通过报道产品发布、提供评论和开箱视频，提高了新技术的知名度。与回避技术的人相比，新技术的开发者和用户被描述为创新者和专家，而后者被称为落后者、顽固分子和卢德分子。因此，采用最新、最新颖的技术变成了常态——随着更多技术产品的出现，这对于
  IT 经理来说变成了一个棘手的问题。


  许多用户在不考虑安全影响的情况下采用了了新的、未经测试的技术。他们在这些设备上执行与工作相关的任务，最糟糕的是将它们带入办公室。一方面，这种趋势催生新的组织实践，例如远程办公和
  BYOD（自带设备办公），这降低了企业的资本成本；但对于组织 IT 而言，用户成为了与组织网络连接的最主要来源，也是他们最大的担忧。


  他们的担忧并非空穴来风。许多用户不知道自己的技术使用习惯如何影响组织。我们在本节开头遇到的联邦研究机构首席信息安全官（CISO）讲述了以下故事。由于该机构进行机密研究，他的用户连音乐都不能听，更不用访问任何外部网站、检查电子邮件或带手机上班了。员工经常抱怨与民间组织的同行相比，工作生活质量糟糕。为了提高士气，CISO
  最终决定允许使用个人 iPod。在随后的审计中，他发现用户在安全电脑的 `USB` 端口为这些设备充电。请考虑这其中的安全影响。


  除了此类无意行为外，用户还刻意规避政策。有些人这样做是因为方便，而安全阻碍了他们的工作效率。另一些人这样做仅仅是因为方便。例如，在我参加的另一次会议上，一家领先安全机构的员工承认没有在他政府发放的官方智能手机上应用更新。为什么？因为该设备还兼作他小孩子的娱乐设备，而补丁会阻止那些应用程序。


  最后，许多新技术还存在安全和隐私问题，这些问题即使对于 IT 经理也是完全无法预见的。美国陆在允许人员使用健康应用 `Strava` 跟踪每日锻炼时，吸取了惨痛的教训。该应用在网上发布了用户的锻炼位置，这公开了美军世界各地秘密军事基地的位置。


  因此，在 2014 年索尼影业遭到黑客攻击之前的几年里，留在 IT 人员手中的问题不是技术。那些问题是可以修补、可以保护和可以外包的。问题在于技术用户。对于 IT
  经理来说，用户——那些不遵守 IT 政策或公然违背政策的人——成为了最大的关注点。


  而这是一个 IT 经理最不擅长应对的群体。从大型机时代起，大多数 IT 员工都是从计算机科学和工程专业招募的，而在那里对安全社会科学的培训非常有限。


  由于 IT 队伍已因外包和裁员而缩减，且缺乏处理用户的深度技能，IT 经理感到压力巨大。一方面，他们来自高层高管和新兴保险公司的压力，他们希望获得网络安全的保证；但另一方面，用户是不可预测、不可控且不尊重权威的。IT
  经理提出了一个术语来描述这种困境：“网络安全中的人为问题”。





  这个标签固然贴切，它帮助 IT 工作人员解释了他们的苦恼，但因为他们是在指责用户而不是试图理解用户，导致网络安全的用户问题进一步恶化。它不断增长并演变成更大的问题，导致了索尼泄密事件以及随后的系列事件。IT
  部门对用户理解的缺失（至今依然存在）正是网络钓鱼者所利用的。这是网络钓鱼泛滥盛行的最终原因。


  # 社会工程工程师的优势


  在第一章中，我们讨论了决定社会工程成功的四个因素——信息优势、知识优势、激励框架和信息环境。今天，源自互联网商业模式的四种力量——用户数据变现、薄弱的凭据验证系统、在线定位访问权限人员的便利性，以及网络安全中的“人问题”——已使权力平衡向网络钓鱼者倾斜。


  ## 信息优势


  如今，消费者在社交媒体、搜索引擎、电子邮件服务和移动应用程序上留下了个人数据足迹。有些数据是他们自愿提供的。另一些数据则由于缺乏全球范围内执行的用户追踪法律，被世界各地的在线数据聚合器（如中国的“征华”）在用户不知情的情况下收集。雪上加霜的是，十多年泄密产生的数据——健康记录、登录名和密码、基于知识身份验证问题的答案、私人照片、旅行行程以及银行财务信息——在暗网论坛上随处可见。这些信息中的很大一部分无法被否认、撤销或替换，这意味着任何获取这些信息的人都可以永久地重复使用它们。


  但情况更加糟糕。由于监管机构在数据泄露时如何通知用户的法律各不相同，用户往往对自身被泄露的信息一无所知。这种信息不对称使得黑客重用被盗信息并实现二次攻击变得容易得多。2018
  年发生的一系列针对性钓鱼攻击就证明了这一点，这些攻击重用了从之前的泄密中获取的密码和基于知识的身份验证响应。黑客向用户展示他们的旧密码，作为其账户已被攻破的证明。由于用户并未意识到之前的泄密事件，大多数人最终输入了密码并再次受害。这种信息不对称可能会进一步恶化，因为随着物联网中更多信息的上线，极大地增加了可能被重新利用的个人信息的范围和质量。


  IT 管理人员对此也几乎无能为力。虽然他们可以向组织内部的用户发送预警，告知他们此类攻击，但对于保护在家办公的用户或其家人，他们能做的很少。对于保护在家庭中共享、在工作网络之外使用或由供应商或其扩展网络中的任何人使用的设备，他们能做的更少。最后，他们几乎无法评估用户（即使是组织内部人员）无意中泄露了哪些信息、他们的哪些信息已经泄露，或者哪些信息可能导致未来的攻击。


  虽然 IT 部门的所能为有限，但黑客仅受限于他们寻找信息的动机以及重新利用信息的创造力。因此，今天，海量的可用信息和全球保护用户法律的缺失使得社会工程工程师占据了巨大优势。


  ## 知识优势


  编写网络钓鱼邮件所需的技术知识微乎其微。访问互联网、拥有免费电子邮件帐户以及编写电子邮件的能力就足够了。


  得于计算机科学教育的国际化，全球范围内有一批知识丰富的程序员正在受雇制作恶意软件。暗网上甚至出售着功能完整的钓鱼工具包。这些工具包托管了知名公司（如 `PayPal`）的虚假网站，并提供带有内置跟踪工具的完全品牌化的表格邮件，以评估攻击的成功率。黑客在部署时只需接入目标用户的电子邮件地址即可。


  进一步使他们受益的是少数几个操作系统、设备制造商、电子邮件服务、社交媒体平台以及在线音乐和视频服务的全球主导地位。正因如此，恶意软件创建者可以专业化。他们可以投入精力创建一个全球主要服务网站或应用程序的虚拟副本或仿品，并将其提供给其他威胁者。例如，考虑到这些产品的广泛使用，在
  `Adobe` 的某个软件程序中发现一个弱点，或在 `Microsoft` 的帮助台中发现一个漏洞，就能导致全球范围内的利用。


  `Yahoo` 电子邮件服务的泄密最好地说明了这一点。由一名俄罗斯黑客实施的单次泄密导致全球超过十亿用户的邮件泄露，这些用户不仅邮件内容被泄露，还交出了他们所有使用
  `Yahoo` 凭据认证过的在线服务的访问权限。


  黑客的知识优势通过他们获取从国家安全机构窃取的强大恶意软件得到了进一步增强。一个例子是臭名昭著的 `WannaCry` 和 `NotPetya` 分布式勒索软件攻击，它们在
  2017 年瘫痪了全球数百万台计算机系统，黑客在其中重新使用了他们从美国国家安全局窃取的 `EternalBlu` 漏洞。


  黑客的军库也通过开源人工智能程序和算法得到了增强。这些技术使得黑客能够挖掘被盗的用户信息、寻找模式、猜测密码，并开发出不断适应互联网用户行为的钓鱼攻击。这种自适应攻击可以针对每个用户进行高度个性化，使用户和
  IT 部门难以检测并击败它们。


  另一个使知识优势向黑客倾斜的因素是由于缺乏监管硬件和软件开发的全球网络安全标准。这助生了糟糕的编码习惯，并结合产品上市的竞争，导致现有计算系统的漏洞被源源不断发现。黑客可以使用其中任何一个漏洞来开发利用程序和访问点。


  2019 年，`Intel` 的微处理器被发现了两个重大缺陷：`Spectre` 和 `Meltdown`；`Apache Struts` 的第二个重大漏洞；`USB-C`
  硬件的一个新弱点；以及 `Adobe` 的 `Acrobat Reader` 和 `Flash` 中的 43 个关键弱点。这还包括在较不熟悉的在线系统和服务中识别出的数十个缺陷，以及数百万个仍未知的缺陷。其中一些缺陷有补丁；另一些（特别是许多由低成本制造商和传统上不开发软件的公司构建的
  `IoT` 设备）无法修复；还有一些仍然未打补丁是因为大多数用户没有意识到需要应用补丁。因此，今天在计算技术的每一层都存在许多可用漏洞和后门——多到任何单一 IT
  管理人员都无法防范。





  最后，大多数 IT 行业的人对理解用户更不用说与用户打交道兴趣。IT 管理人员的工程背景，再加上十年的外包导致他们对用户的控制力减弱，使得他们不愿也无法与用户交流。相比之下，钓鱼攻击者（如
  `Baratov`，他曾协助俄罗斯人在民主党全国委员会黑客）非常擅长理解用户。他们通过实施不同的攻击并检查其相对成功率来花费时间了解用户。由于很少采取措施阻止他们，他们可以反复进行这种操作。因此，当今黑客所拥有的技术武器库是无限的，他们持续攻击的动力和能力也是如此。


  ## 信息环境


  信息环境也严重倾向于黑客。组织的运作方式类似于印度次大陆的土邦，这些土邦曾允许我们在第一章中遇到的“盗匪”（Thuggees）进行长达五百年的统治。大多数 IT
  部门只关注组织内部的安全，其动力是遏制有关安全泄露和攻击的消息，而不是分享这些信息。虽然已经开始建立基于部门的信息和分析中心（`ISACs`）以及执法部门领导的信息共享小组，但组织参与这些机构的仍然是自愿的。(34)


  组织对泄露事件也非常保密。这是因为泄露消息后会带来反噬。正如我们在引言中看到的，索尼的许多高层被解雇。这种由媒体而非法院实施的惩罚性措施导致人们倾向于隐瞒泄露信息，而不是保持透明。


  最后，关于谁需要在何时以及如何被通知泄露的泄露通知法律在不同州、地区和国家各异。因此，每当发生泄露时，法律后果加上媒体报道的担忧，导致组织不愿分享网络攻击信息，即使是对他们的用户也是如此，而用户仍然一无所知并容易受到进一步的攻击。


  但由于此类政策，社会工程工程师可以在一个组织使用勒索软件，随后在另一个组织上重复相同的攻击，而完全没有预警对方。这在 2019 年 4 月的一系列勒索软件攻击中为人知，当时攻击瘫痪了北卡罗来纳州格林维尔（Greenville）市政府的所有计算机。5
  月，同一攻击者又针对了马里兰州的巴尔的摩，瘫痪了超过 10,000 台计算机，并影响了其计费系统、市政部门、医院和机场。(35)2020 年春天，该黑客目标了路斯吉亚州的多个教区，(36)，并在
  2021 年持续在全国范围内。通过这种方式，攻击可以不断收编组织。


  相反，即使在那些希望向执法部门报告攻击的组织中，采取行动的途径也是有限的。首先，没有中央门户，没有单一的执法机构或网络安全指挥中心可以帮助处理泄露的所有方面。


  其次，网络安全科学缺乏统一的本体论，即关键术语的共享语言和定义。由于这个原因，即使是报告最基本的元素仍然不明确。例如，数据泄露包含什么，或者它与黑客攻击有何区别，仍然不明。对于攻击或泄露何时发生，也没有科学共识。是黑客找到可以利用的用户信息时吗？还是当黑客实际发送鱼叉式钓鱼邮件或用户接收到邮件时吗？


  第三，网络安全科学更多关注软件和硬件，而不是人为风险。由于缺乏信息的集中化、持续攻击的能力以及针对攻击的保护，许多组织和许多在线服务仍然非常脆弱。信息环境有利于那些想要伤害的人。


  ## 激励框架


  最后，激励框架倾向于黑客。黑客可以协作、外包、在论坛上分享知识并尝试任何攻击。即使攻击失败，失败的成本也微乎其微。受益于数字货币、加密消息和文件共享应用，黑客不仅可以从犯罪获利，还可以洗钱。


  相比之下，由于信息环境激发了保密心理，大多数组织只能孤军奋战，发明所谓的“轮子”。法律后果和泄露损失导致律师、网络安全保险公司和政策制定者的审查增加。这使得 IT
  管理人员不愿尝试大胆的解决方案，以免引发更多审查。


  更糟糕的是，关于 IT 管理人员必须做什么来保护用户的指南各不相同。以 `NIST` 在 2004 年开发的被广泛接受的密码复杂性和过期的指南为例。(37) 这项被
  `Microsoft` 等许多组织广泛实施的指南要求用户想出长且复杂的密码，并被要求每三个月更改一次。


  黑客也意识到了季度更改密码的趋势，并开始向用户发送重置密码的钓鱼邮件，许多用户由于与 IT 部门的此类沟通惯化，服从了这些邮件。直到 2017 年，在无数组织实施这些指南多年之后，`NIST`
  终于扭转了这一政策。(38) 然而，直到今天，许多组织和许多在线服务继续要求用户每几个月更改一次密码。





  由于预算有限、准则不一以及对组织 IT 决策的控制力降低，IT 管理者倾向于实施范围最广、最不容易引起干扰、法律允许且被广泛采用的网络安全倡议。与此同时，黑客正在不断升级技能并演变出日益巧妙的攻击，因此仅仅效仿其他组织正在做法，只会让黑客更容易将相同的成功漏洞应用到许多组织中。


  解决网络安全中的社会工程问题需要 IT 管理者改变思维。这种需求已迫在眉睫。正如第 3 章将讨论的，目前的方法并非如此。


