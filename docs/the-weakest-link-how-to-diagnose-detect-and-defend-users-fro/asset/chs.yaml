  人们被要求佩戴口罩、避免聚集、避免握手并留在室内。^(22)


  ### 向简单解决方案移动


  我们对 COVID-19 和大流感的应对表明，复杂问题可以被有效地遏制，甚至通过简单的解决方案来解决。由于感知到问题的复杂性，我们预期解决方案也应该同样复杂，但复杂的问题真的需要复杂的解决方案吗？悖论的是，并不需要。


  在充满术语的供应商驱动型 IT 解决方案领域，复杂性偏误是导致我们在每次发生重大安全漏洞后，都关注其复杂性并寻找日益复杂的解决方案的原因。`Winds` 这样的攻击仍然会发生。正如阿尔伯特·爱因斯坦所说，我们无法用产生问题的同样思维来解决问题。我们需要不同的思考方式。


  这就是 `CRS` 流程和 `CHI` 所提供的（见图 10.1）。与其使用创建问题的技术来解决网络安全问题，这些工具关注攻击的目标——用户。它们有助于诊断用户，并了解谁面临风险、风险有多大以及为什么面临风险。通过使用独立操作系统或软件的证据方法，它们有助于围绕问题构建解决方案。


