  # 6  进行准确诊断


  听诊器发明于两多年前，是一种简单的测量工具，可用于诊断从呼吸道感染到血压异常的一系列轻症和重症。使用得当，这个 15 美元的设备可以挽救生命，但很容易错误使用。






  # 诊断程序中准确性的性


  在测量血压时，医生会将血压带置在患者的上臂上，同时将听诊器放在患者的前臂上，并在释放袖带压力时听取血液脉动流动的声音。如果袖带过大或过小、放置在手臂上的位置过高或过低，或者患者是躺着而不是坐着，袖带所施加的总压力将是不准确的。听诊器上的读数将会出现偏差。这可能意味着误诊危及疾病与提供及时治疗之间的差别。


  医疗执业人员在学校里需要花费多年时间学习使用听诊器等测量设备的正确程序。这始于对人体解剖学以及模拟不同症状程序的理解。同样，IT 经理也需要理解为什么用户容易受到社会工程学欺骗（我们在第
  4 章和第 5 章中讨论过），并学习评估其用户症状的程序。只有这样，他们才能进行准确的诊断。


  ## 评估用户脆弱性


  我们已经在第 4 章和第 5 章中讨论了攻击的构造以及导致用户容易受到攻击的原因。现在我们来检查准确诊断所需的其余程序。首先，我们需要触发导致用户产生基于社会工程学的欺骗或被检测出的症状。这必须以一种方式进行，以便我们追踪我们的患者——即用户——在想和做什么。最简单、应用广泛的方法是进行社会工程学渗透测试（pen
  test）。


  ## 渗透测试的多样性


  渗透测试差异很大。它们可以模拟鱼叉式网络钓鱼（例如带有超链接或附件的电子邮件）、预设理由邮件（例如某些导致往返交互的骗局）、社交媒体冒充、USB 遗弃攻击、Wi-Fi
  欺骗或任何其他社会工程学方案。攻击还可以在体态上（例如，电子邮件、短信或电话）、欺骗手段（例如，它们可能宣布奖励，或涉及伪造网站或 Wi-Fi 登录过程）、携带的负载（例如，带有超链接、附件或仅是具有说服力的短信）、个性化程度（例如，它们可以点出用户的姓名，或者来自公司
  IT 部门或知名品牌）以及欺骗意图（例如，它们可以触发程序中的宏、打开收集凭据的伪页面，或包含跟踪用户的跟踪 Cookie）。无论采用何种方法，渗透测试的目标对于设计者来说应该是清晰的。它应该是触发用户中的症状，以准确反映他们对社会工程学攻击的反应。


  ## 缺乏标准化测试


  这不是一个微要的问题。设计渗透测试的 IT 人员通常不从诊断的角度关注其质量。相反，大多数人是以临时（ad hoc）的方式创建渗透测试的。这不仅发生在自己编写测试的组织中，也出现在使用成熟的网络安全培训包或聘用顾问的公司中。


  渗透测试之所以是临时开发的，是因为对于一个“适当”的钓鱼测试包含什么，或者一个理想的钓鱼测试必须包含什么，还没有真正的基准。目前没有任何框架，更不用说关于如何最好开发测试或分析其适用性的指导意见。例如，带有附件作为负载的电子邮件与带有超链接的电子邮件是相同的吗？


  来自被劫持账户的真实电子邮件——这是一个大多数渗透测试避免模拟的向量——难道不相关吗？伪造网站或 Wi-Fi 登录过程的电子邮件难道不相关吗？


  ## 临时测试的后果


  缺乏框架，意味着许多问题仍然悬而未决。IT 人员往往依赖任意的基准而不是科学方法。由于没有方法追踪这些测试的有效性，关于用户韧性收集的数据通常是无效的。这导致了这样局面：重点在于达到特定的失败率，而不是测试本身的质量。






  在第 5 章中，我们讨论了源自 SCAM 研究的“怀疑”如何作为用户对社会工程脆弱性的适当衡量标准。单单依靠良好的听诊器并不能保证诊断的准确，单单衡量怀疑也是不够的。我们需要针对一个具有科学性的基准钓鱼渗透测试来对其进行衡量。下一节将介绍你如何设计这样一项测试。


  ## 开发有效钓鱼渗透测试的框架


  由于意识到缺乏指导性框架，我的研究部分重点集中在开发这样一个框架上。考虑到本书的范畴，这里的重点是基于电子邮件的渗透测试，但此处提出的框架也可以扩展到处理其他形式的社会工程。


  用于评估钓鱼渗透测试质量的框架被称为 `Vishwas Triad`（或简称为 `V-Triad`），开发于 2016 年。我分别在 2016 年和 2017
  年的美国 Black Hat 大会上展示过它，这里展示了开发过程的总结。（如果有人对了解更多相关信息感兴趣，可以在网上找到我的演讲视频以及详细阐述开发该框架的研究白皮书。^(2)）


  为了开发该框架，我的研究团队从不同组织收集了五百多份真实的钓鱼测试。这些组织提供了他们所有的样本，例如他们部署的渗透测试邮件，以及最终的用户失败率。这些数据涵盖了多种攻击类型、说服方法和复杂程度。失败数据涵盖了用户的点击情况，详细列出了谁、如何、何时、以多快速度以及从何处点击了每封邮件并通过测试。接受渗透测试的用户人数从一百人到近一千人不等，因此参与者的累计受试群体很大。许多电子邮件与真实世界的攻击相似，或者是实际攻击的仿制品（这是由于我之前提到的那种做法，即
  IT 人员会在网上搜索不同的渗透测试思路）。在攻击模拟了真实世界钓鱼攻击的范围内，我们可以将它们视为对社会工程工程师思维方式的反映。开发该框架的研究过程则反转了这种思维。社会工程工程师发起攻击并根据成功结果收集数据，而我是利用攻击成功的程度的数据，并将其与使其成功的特征相匹配。


  为了理解每次攻击的特征与其成功率之间的关系，研究使用了一种名为 `content analysis`（内容分析）的方法。这是一种分析信息的定量方法，涉及通过被称为
  `coding`（编码）的过程，将电子邮件特征归类为不重叠、独立的类别。内容分析中的 `Coding` 使用人工编码员，他们独立地检查每封邮件，统计其中各种特征的存在和频率，并将它们置于不同的类别中。该过程量化了各种结构特征、其存在性、频率、位置、时间和质量。多名编码员检查同一封邮件，这允许对其准确性进行比较评估。此外，没有人知道渗透测试的成功或失败。他们的编码完全关注每封邮件中的线索。在对所有邮件进行编码后，编码过程的数据将与用户失败数据并列，并对特征集与点击率之间的关系进行统计评估。


  分析过程最终揭示了一个重要的启示：钓鱼邮件中几乎所有关键元素，都是那些能够发出“信任”信号或抑制“怀疑”的元素。成功做到这一点的攻击在最短时间内获得了更多的点击率。


  正如第 5 章讨论的，信任与怀疑不同，信任有许多维度或方面（可信度、真实性、可信性、个性等）。成功的钓鱼邮件整合了这些中的一个或多个，因为有更多的信任信号可用。例如，高点击率的攻击要么拥有知名品牌的名称或标志，暗示邮件来自可信且信誉良好的来源；要么整合了个性化信息，以暗示邮件的说服内容是可信的；或者包含了如“发自我的
  iPhone”之类的短语，以显示邮件来自真实人员而非自动邮件。这些元素通常被结合，并产生减少怀疑的累积效应。高点击率的攻击还整合了熟悉的表单字段和说服性的副调，很好地安排了攻击时机，并利用了用户的习惯和信念。这些因素协同工作，抑制怀疑。


  为了理解所有这些是如何共同工作的，分析将单封钓鱼邮件特征与其各自的点击率进行比较，并向上整合，将特征分组成大类。这导致了所有特征均可其中的三个不重叠的类别。这些类别作为钓鱼邮件中最可能导致欺骗的主要组件的高阶预测指标。它们被组织成一个视觉框架，展示了这三个预测指标如何共同作用建立信任或减少怀疑。该框架的名字是为了反映社会工程工程师的意图。它借用了梵语中“信任”的词，被称为
  `Vishwas Triad` 或简称为 `V-Triad`。该模型连同高阶预测指标一起在图 6.1 所示。


  ![图 6.1 ¶ Vishwas Triad。 ¶ 来源：Vishwanath (2017)。](img/Figure_6-1.png)


  图 6.1 ¶ Vishwas Triad。 ¶ 来源：Vishwanath (2017)。


  `V-Triad` 中的每个顶点都对应钓鱼邮件中的一个主要欺骗特征。双头（即双向）箭头表示鱼叉式钓鱼邮件的关键方面如何相互作用并增强欺骗效果。一个顶点代表指示信任的邮件元素：`credibility
  signals`（可信度信号）。另一个捕捉邮件中可以修改的；我们称之为 `customizability signals`（定制化信号）。第三个顶点涉及邮件对用户的适用性，或其
  `compatibility`（兼容性）。


  `credibility signals` 可以是图标、线索，甚至是文本元素。它们从显而易见的（如使用已知人物的名字）到微妙的都有。例如，主题行中的“Re:”可能会微妙地指示该邮件是正在进行的邮件交换的一部分。由于在线通信中存在许多元素——线索、文本、图形、下拉菜单元素——有更多机会发出可信度信号并使其产生累积。


  电子邮件提供了更多途径。`credibility signals` 可以被引入发送者的姓名、其电子邮件地址、主题行、称呼、签名、正文或附件字段中。正如第 4 章讨论的，它们可以通过附件中的
  PDF 图标进行有影响力的传达，因为许多用户错误地认为此类文档类型是防黑客的；或者通过包含 SSL 图标来传达，因为许多用户错误地认为它是网站真实的标志。`credibility
  signals` 之所以起作用，是因为它们与用户脑海中可用的启发式一致，或者它们直接击中了网络风险信念。因此，当用户在邮件交换中经历过这些信号时，它们在欺骗用户方面更为成功。





  可定制信号（Customizability signals）是在线通信中用户修改过或看到其修改过的方面。与依赖一致性的信誉信号（Credibility signals）不同，可定制性让人对在线通信中的变化感到舒适。它缓解了疑虑。例如，所有在线用户都更改过邮件的主题，并期望它们发生变化。同样，当我们导航到网站主页之外时，URL
  会发生变化，而且许多此类 URL 还包含不常字符。我们在第 4 章中还讨论过，在许多云服务中，虽然邮件看起来来自发送者并带有他们的姓名，但它并非来自他们的收件箱。相反，它来自一个不同的收件箱，该邮箱随服务商而变化。这种差异是大多数用户在线浏览体验的一部分，甚至延伸到电子邮件来源和发送邮件地址。


  在其他情况下，由于 `Gmail` 等邮件客户端的编程方式，邮件是按会话组织的，因此默认会不断插入相同的主题，即使会话的内容可能已经发生了。用户通过忽略主题行或忽视其不匹配来不断适应这种变化。他们也习惯了忽视关于鱼叉式网络钓鱼（spear
  phishing）的教训，因为合法的邮件交换频繁违反即使是最基本的电子邮件安全原则。一个很有说明性的案例是 2013 年 Target 首席执行官 Gregg
  Steinhafel 发送的一封邮件，通知约 5000 万客户个人数据泄露事件。这封邮件包含了用户被警告过的鱼叉式网络钓鱼的所有欺骗迹象。它是从一个“TargetNews@target.bfi0.com”收件箱发送的，Target
  的没有任何客户熟悉熟悉这个邮箱。它甚至包含了一个带有免费信用监控和身份保护提议的超链接，以及注册截止日期。


  除了适应此类差异外，用户还习惯在不断变化的表单字段中输入在不同设备上显示的信息。从鱼叉式网络钓鱼的角度来看，最相关的是凭据——登录名、密码和双重认证（`2FA`）代码。在许多新的在线服务中，用户允许使用单点登录（例如使用
  `Facebook` 或他们的 `Gmail` 账户凭据）。这需要适应多个验证窗口。例如，在登录新服务时，用户必须输入该网站上单点登录提供商的凭据，然后在登录提供商处验证其身份，然后返回新服务的网站，接受其合同条款并进行设置。每个验证提示都根据网站和登录提供商而异。


  `2FA` 代码也是如此。某些服务（如 `Yahoo Mail`）使用特定的代码颜色和布局。其他服务（如 `Apple`）则具有基于设备的认证，提示显示在不同的
  `Apple` 设备上，并且还包含请求代码的设备的位置信息。许多银行和在线服务通过短信或电话提供此类提示。


  这些内容在设计或代码上都不是静态的。它们根据应用程序、服务、用户使用的设备以及他们各自的位置不断演变。由于存在许多变体，在线用户往往会忽略某些看起来与他们通常体验不同或不一致的事物。他们将其归类为另一种定制变体——然后顺从。邮件的这些方面被捕捉在
  V 三角形模型（V-Triad）的第二个顶点中。


  三角形的第三个顶点是邮件的兼容性，或其与用户的相关性。这涵盖了邮件的元素，从内容到结构、主题和时机，以及它们如何与用户通过技术使用社会化的规范、工作模式和惯例相匹配。在最简单的层面，这取决于接收一封声称关于其
  `Instagram` 登录的钓鱼邮件的用户是否真的拥有此类账户。在更高级的层面，兼容性来自于用户看到或经历过的内容与用户在类似通信语境下的预期内容之间的匹配。


  例如，在会计部门工作、经常通过邮件收到首席执行官请求用户信息文件的人，可能不会对从一封索要组织内所有用户薪资数据的钓鱼邮件感到奇怪，尽管这种请求过去可能从未被提出过。这是因为任务的规范使此类请求常态化，而会计人员盲目地顺从了。


  同样，如果用户已经习惯了通过输入电子邮件凭据来访问他们访问的星巴克 Wi-Fi，那么此类请求即使出现在不同的地点，也可能被顺从。作为这种运作方式的一个例子，2019
  年，我在华盛顿特区入住的一家酒店时，其 Wi-Fi 访问提示要求提供 `Gmail` 或 `Yahoo` 邮箱地址——这与任务完全无关。密码字段要求输入房号。我在前台询问了此事，被告诉没有人对此投诉过。每位客人都简单地顺从了。更有可能是，大多数人甚至输入了他们的邮件密码，直到意识到那不是预期的内容。


  当然，没有 `Instagram` 账户、不在会计部门工作或从未用过星巴克的 Wi-Fi 会削弱这些影响，但正如我的示例所示，兼容性往往跨越我们的在线体验流动。虽然我们可能在工作中没有遇到此类请求，但常态化可能发生在工作之外的遭遇中。毕竟，许多通信设备、服务和应用程序在家也会使用，因此对什么是惯例的预期可以在任何地方产生。当这些预期被满足时，兼容性信号会导致欺骗；当它们被违反时，则不会产生。


  ## 使用 V 三角形模型开发理想的钓鱼渗透测试


  V 三角形模型展示了导致欺骗的钓鱼邮件结构特征的顶层视图。钓鱼邮件中的多个子组件或特征集属于每一个顶点。示例特征列在随后的章节中，即“钓鱼邮件中的信誉信号”和“钓鱼邮件中的可定制信号”。


  在大多数有效的钓鱼攻击中，每个顶点内部的组件共同作用。它们之间的相互作用增强了整体效果。例如，让我们看一封鱼叉式钓鱼邮件，它声称包含一系列可以通过 `Google
  Drive` 超链接访问的 `PDF` 文件。黑客可能会在邮件主题行中注入信誉提示，仅使用“Re:”单词，这会引导用户认为这是一个持续通信。邮件正文可能包含 `Google
  Drive` 的颜色和布局，以及附件文件为 `PDF` 的指示。这种邮件很容易创建。它不需要主题行，甚至不需要邮件正文。它可以从任何电子邮件地址发送，因为 `Google
  Drive` 不允许任何个性化，且链接通常是从 `Google` 选择内部收件箱共享的。由于来自相同或相似文件共享程序的邮件，用户可能习惯了这一点，从而引发对此类邮件的高度信任。


  ### 钓鱼邮件中的信誉信号


  - 知名品牌名称（`Apple`、`Amazon`、`Instagram`）

  - 朋友、同事、家人的名字

  - 熟悉人物的照片

  - 模仿熟悉品牌的颜色、字体、图标和文本组合

  - 表明附件类型的视觉提示（`Word`、`PDF` 等）

  - 域名欺骗（即：复制已知网站或 URL）

  - 使用提示词汇或短语（例如“来自 iPhone 发送”、“警告”、“密码”、“截止日期”）

  - 社交媒体上的共同好友数量;





  *   明显的拼写错误和打字错误；请求中包含或缺少收件人姓名；

  *   安全标识（例如 SSL 图标）；

  *   邮件主题行或正文中出现“Re:”或“Fwd”等字样；自动回复通知；图形用户界面元素（例如登录、回复、接受、发送）。


  ## 钓鱼邮件中的定制化信号


  *   主题行、表单字段（例如搜索栏、2FA 输入表单、登录输入窗口）；

  *   URL（包括来自云服务的 URL）；

  *   来自云服务内部的邮件；

  *   不同发送者的电子邮件地址；

  *   发送者姓名；

  *   社交媒体更新、邮件主题行、提示（例如接受 Cookie、合同条款的提示）；

  *   某些登录页的布局和颜色，某些服务的多因素验证提示和布局；

  *   登录通知（告知某人何时何登录了某服务），网站上各异单点登录选项；

  *   请求访问文件、文件夹、设置的提示样式不断变化（例如请求在 Word 中启用宏）；如表情包或梗等图形元素。


  ## 钓鱼邮件中的兼容性


  *   模拟工作相关流程（例如打印机共享、云服务、内部邮件）；

  *   模拟公共场合、节日或活动（例如圣诞购物或报税季）；

  *   时机上与用户的休息时间吻合（例如午餐时间），他们更有可能查看工作邮件的时间（例如周二和周五上午），以及他们更有可能在移动设备上查看邮件的时间（例如夏季的周四晚上、周五晚晚和深夜）；

  *   复刻生活事件、兴趣和情况（例如怀孕、养宠物、政治归属感）；

  *   模拟常规行为（例如早晨查看社交媒体、在周期末支付信用卡账单、购买彩票、在公共场所登录 Wi-Fi）；

  *   曾是针对性培训的主题（例如来自 IT 部门的修改密码邮件、钓鱼渗透测试邮件）；

  *   模拟对补丁、定义文件或软件的更新。


  通过 `V-Triad`，你可以轻松定位这些特定元素以及它们对用户产生的影响来源。这正是它如此强大之处。通过使用它，IT 人员不仅可以锁定钓鱼邮件中使其极具破坏性的特定欺骗元素，还能设计出包含所有已知钓鱼欺骗因素的有效渗透测试。


  `V-Triad` 的解释力源于`怀疑、认知、自动性模型 (SCAM)`。正如你记得的，在第 5 章中我们讨论了 `SCAM` 如何描述决定钓鱼脆弱性的近因因素和最终因素。最终因素包括网络风险信念和人格层面的因素（自我调节），这些因素通过认知处理（启发式处理和系统性处理）以及习惯等中介近因因素触发了怀疑。


  `V-Triad` 每个顶点内每个特征集的影响，可以根据它们如何影响一个或多个 `SCAM` 因素来理解。`V-Triad` 中描述的邮件中的各种信誉线索降低了网络风险感知，并触发了易于获取的启发式捷径。定制化信号通过适应差异性降低了风险感知；它们促进了心理捷径和反应性行为。兼容性降低了风险感知，如果通信是常规的，则会触发习惯反应。


  通过这种方式，`V-Triad` 解释了为什么不同的元素会被注入到钓鱼邮件中，以及它们为什么行之。它解释了为什么钓鱼者使用广知的品牌名称，如 `Microsoft`、`Facebook`、`LinkedIn`、`PayPal`、`IRS`（美国国税务局）等。拥有良好的品牌可以使用更多人熟悉的信誉信号。它们触发了用户脑中广泛存在且易于获取的启发式思维。


  `V-Triad` 还解释了某些攻击相对于其他攻击的相对成功率。例如，在我自己的模拟中，伪造粗糙的 `LinkedIn` 网页的钓鱼攻击获取的受害者比例比伪造粗糙的
  `Facebook` 网站要高。原因是 `LinkedIn` 用户在登录页面上经历的变化比在 `Facebook` 多。这让他们习惯了在不断变化的登录页面上输入凭据。因此，虽然
  `Facebook` 有更多可供目标的用户，但在 `Facebook` 上成功获取相同比例的受害者需要对其服务进行更严密的复制或伪造。


  `V-Triad` 同样解释了为什么某些攻击类型的欺骗价值有限。例如，用彩票奖励奖励用户的攻击只对购买过彩票的小部分用户有效。大多数人很少中奖，或者他们不相信自己会中奖；他们的风险信念并不支持这种行为。同样，引发好奇心的邮件只有短期影响。随着用户对攻击变得更加，并形成促进规避的启发式思维，其影响会迅速消减（例如，`if`
  它好得不可谱，`then` 它很可能真的）。


  这就是最初尼日利亚诈骗邮件的命运，它们最初通过引发好奇心获得成功，随后迅速失去了效力。警告用户账户注销、`IRS` 留置威胁和信用卡违约的邮件也是如此。在用户尚未意识到此类攻击的早期阶段，它们可能会引发信誉感，甚至可能具有兼容性，但一旦欺骗的消息传开来，这些攻击就变得不兼容了。这也是为什么钓鱼攻击不断变化的原因。它们之所以这样做，是因为没有一种单一攻击能一直有效，因为用户会了解它、形成新的启发式思维并发现出它的不兼容性。


  不断变化的社会工程攻击凸显了 `V-Triad` 方法的价值。它的解释不仅限于线索、表单字段和随攻击演变而变化的说性文本。相反，因为它关注这些背后的意图和影响路径，它有助于理解任何钓鱼攻击的欺骗性。这有助于评估不同攻击的威力，并设计出能够相应复制它们的渗透测试。


  那么，什么是理想的钓鱼渗透测试，如何使用 `V-Triad` 来设计它？理想的钓鱼渗透测试涵盖了 `V-Triad` 每个主要顶点的元素。这是为了确保大多数情况下导致欺骗的所有已知因素都包含在内。这意味着要有信誉的线索，要有至少引发定制化且绝不违反定制化的信号，并确保邮件的方面与用户兼容。


  但这些具体的线索应该是什么呢？`V-Triad` 并没有规定它们应该是什么。这是因为任何攻击中的个体侧面都会并随着技术和用户意识的发展而应用程序、服务、操作系统和其他软件、实践、流程、规范和意识水平而改变。因此，理想的线索是适用于用户的线索。不存在通用的、适用于所有人的攻击。我们知道这一点，是因为黑客尝试过创建它们。臭名昭著的尼日利亚诈骗邮件就是这种方法的典型例子——而我们知道它不起。因此，理想的攻击是针对特定时间点、特定组织或行业内特定用户群的攻击。






  好消息是，由于所有的社会工程学攻击都试图建立信任或抑制怀疑，因此，衡量目标是否产生怀疑的相同标准也可以用于衡量渗透测试（pen test）的适用性。这使得量化攻击是否理想以及诊断用户为何被欺骗变得易于许多——因为这些可以通过该标准来实现。而且，这比那还要简单。可靠地评估这些测试，只需要几个问题。下一节将介绍是如何确定这些问题的。


  ## 开发诊断工具


  - 你能在一个 0–10 分的量表上（0 分表示不痛，10 分表示剧痛）描述你的感觉有多疼吗？

  - 在 0–10 分的量表上（0 分非常好，10 分非常不舒服），你今天感觉如何？能解释原因吗？


  这种简单的问题是任何医疗执业者工具箱中的关键部分。这也是医学科学在人体身上比在动物身上有效的原因。可以向人类患者提问，其答案可以帮助识别并治疗他们的疾病。医生在医学训练中花费多年，不仅学习诊断患者，还学习如何提出正确的问题。


  我们社会科学家也依赖向研究受试提问，这些受试者充当患者的代理——即我们研究试图理解的大规模人类社会群体或人口。我们的问题通常通过问卷调查间间的方式进行，由受访者自行提供答案。我们称之为“自我报告”。但因为在受访者回答这些问题时我们不在场，他们误解问题以及偏差和错误渗透进回答中的概率相当高。因此，在社会科学研究中，提出正确的问题并正确地提问更为至关重要。大多数学术科学家在研究生阶段花费多年学习如何创建自我报告问题。


  他们学会编写的自我报告问题分为两种类型。一种是受访者的答案是有界限或结构化的，被称为“闭式问题”。这些是在线民调查中常见的问题，配有各种数字评分量表，例如 1–5
  响应量表，其中 1 = `strongly disagree`，2 = `somewhat disagree`，3 = `neither agree nor disagree`，4
  = `somewhat agree`，5 = `strongly agree`。另一种自我报告是“开放式问题”，受访者对某个主题提供自由的观点或想法，不受响应量表的限制。


  这两种类型自我报告问题的根源可以追溯到 20 世纪初的人类心理学研究。许多原始的人类心理是使用开放式问题开发的。对这些问题的回答为随后提出更直接的问题提供了框架。这导致了结构化的闭式问题，并随着更好的统计分析工具和技术的发展，产生了今天使用的
  1–5 型比例量表问题。例如，西格蒙德·弗洛伊德的工作始于对患者关于童年和父母经历的非结构化访谈，这项工作需要时间来开发，并且对人类行为有深刻洞察才能识别出回答中的共同模式。这项工作催生了如弗洛伊德人格测试之类的测试，这是一个由约
  50 个结构化闭式问题组成的组合，个人使用 `strongly agree` 到 `strongly disagree` 的评分量表进行回答。


  在接下来的一个世纪里，出现了更多的自我报告测试，从衡量障碍到衡量智力。大多数测试始于开放式问题，并随着时间被许多闭式问题取代。这些问题随后通过各种统计程序进行进一步的精炼和纯化，最终缩减为少数。智力测量就是一个绝佳的例子。早期的智力测试需要回答数百个问题。现在，只需三个问题，就可以通过`Cognitive
  Reflection Test` 可靠地衡量智力。


  问题如此之少使得捕捉更多人的想法成为可能。闭式自我报告还允许使用数字评分量表，其答案可以进行统计分析。这可以通过问卷软件实时完成，使得快速、高效地研究大规模现象成为可能。这就是为什么民意调查和大部分学术社会科学研究依赖于此类问题的原因。


  当然，并不是所有内容都能通过结构化和闭式的响应量表来捕捉。发生在人类身体和大脑深处的某些事情太微妙了，无法做到，因此仍然依赖开放式问题。例如，关于人类如何在大脑中处理视觉信息的认知研究。这项工作使人们理解到人们应用启发式经验法则或系统地处理信息（这是
  `SCAM` 解释框架的一部分）。导致这种理解的实证研究流完全基于开放式回答。


  在典型的认知处理研究中，参与者会看到来自各种来源的说服性信息（例如，来自 `CNN` 的新闻文章和来自未知博客）。然后要求个人参与者回忆他们读过的任何内容。他们的自我报告、开放式回答将使用与开发
  `V-Triad` 相同的内容分析方法进行分析。人类编码员阅读每个回答，并评估个人是使用了启发式还是系统地处理了文章。


  虽然认知心理学长期以来以此方式使用开放式问题，但针对用户的安全研究很少利用它。部分原因在于研究人员的工程背景。大多数人并没有接受过实证社会科学的训练。即使安全研究人员在调查中包含开放式问题，他们也倾向于忽略回答，或用它们来加强他们已经通过闭式衡量得出的结论。


  其中一个典型的例子就是我在第 4 节中讨论的 `MITRE` 用户培训研究。正如你记得的，他们的团队进行了一系列实验来检查培训的价值，并发现意识培训在很大程度上是无效的。这一结论基于各种闭式问题的行为和自我报告数据。然而，他们的研究还包括一个开放式问题，邀请用户评论他们为何中入钓鱼渗透测试。一位受访者表示：“我无意中点击了它，并不是为了解释他们研究设计中的潜在污染因素，而是为了对用户得出结论。对于这一点，他们完全依赖于他们的闭式回答。”


  当然，他们忽略开放式回答的另一个原因是 `MITRE` 团队缺乏一个解释它们的框架。如果团队使用了 `SCAM`，他们会很快注意到第一个回答中习惯性自动化的影响，以及第二个回答中网络风险信念的影响。事实上，用户甚至说明了怀疑的影响。如果研究人员使用了
  `SCAM` 框架，闭式问题和开放式回答本可以互为补充。





  本示例演示了封闭式问题和开放式问题的价值。封闭式问题允许量化，而开放式问题能获得丰富的回答。封闭式问题允许高层次的统计分析。开放式问题则允许对用户进行细粒度的理解；但它们需要量化以便进行统计分析。在实践中，由于用户回答花费的时间很短，问卷可以包含更多的封闭式问题，而开放式问题由于回答需要时间，则需要限制数量。当它们的设计受全面的解释性框架指导时，它们是相辅相成的。完成这一点后，它们可以对人类的思想和行为提供深刻的洞察。


  在处理欺骗或其检测等心理层现象时，同时使用这两种类型是有必要的。在此类研究中，行为（即人们所做的事情）通过点击追踪很容易捕获。挑战在于心理层面的过程——用户导致其行为的想法、阻止其行为的想法，以及在无意间发生的行为。此外，这些还必须易于解释，以便
  IT 员工和用户都能理解结果并采取行动。


  为了实现这些目标，我的研究团队进行了一个规模化的纯化过程。这是一个迭代过程，将来自 `SCAM` 核心问题的不同变体引入我在不同组织中进行的渗透测试中。通过对比每个问题对个人钓鱼欺骗或其检测的预测准确程度，检查了每个问题的相对贡献。这一迭代过程有助于剔除杂质，并识别出“最合适”的问题——即那些预测性最多、引入偏差最少且最易于通过问卷实施的问题。在所有问题中，有一个问题始终脱而出，捕捉了用户对钓鱼易感性的广度。这一个问题最能指示用户在攻击结果产生之前所考虑或所做的一切。这个问题衡量的是“怀疑程度”。它是一个封闭式问题，并且可以跟进一个与
  `MITRE` 使用的无异的开放式问题。这两个问题结合起来可以取代几十其他问题。最棒的是，无论组织的规模、位置或用户群体如何，它们都可以在组织进行渗透测试后实施。这些问题也易于理解，大多数用户可以快速回答。换句话说，在短短几秒钟内，它们就能帮助确定钓鱼测试的质量，以及有人检测到或被欺骗的概率。封闭式问题所示
  `图 6.2`。


  ![图 6.2 ¶ 来自网络风险调查的封闭式问题。](img/Figure_6-2.png)


  图 6.2 ¶ 来自网络风险调查的封闭式问题。


  受访者可以选择 0 到 10 之间的任何数字，以表示渗透测试触发他们怀疑的程度。虽然这个问题量化衡量了用户对任何攻击的脆弱性，但后续问题可以衡量他们的原因。这可以通过一个开放式问题（`图
  6.3`）简单完成。


  ![图 6.3 ¶ 来自网络风险调查的开放式问题。](img/Figure_6-3.png)


  图 6.3 ¶ 来自网络风险调查的开放式问题。


  ## 三角测量


  三角测量是一个简单的概念，但具有深远的影响。在最基础的层，它涉及使用不同的方法来研究问题并评估其有效性。其核心思想是，如果不同的科学家使用不同的方法和数据得出相同的结论，那么该结论很有可能是有效的。如果这些科学家来自不同的领域且相互独立工作，效果会更好。这样，范式（即由于处于一个每个人想法都相似的领域而导致的思维定式）就不那么容易影响工作。





  我们可以采用类似的标准来评估 `V-Triad` 和 `CRS` 测量方法的有效性。正如我提到的，`SCAM` 的模型开发于 2015 年左右，而 `V-Triad`
  则开发于 2016 年。2020 年，来自 `NIST` 的团队开发了他们所谓的 `Phish Scale`。该量表的建立是为了像开发 `V-Triad` 的初衷一样，提高所有钓鱼渗透测试的质量。`NIST`
  团队采取的方法也是完全相同的。他们检查了不同的钓鱼邮件，并将其特征与点击率进行关联分析。当然，他们使用了不同的渗透测试语料库，但其结论大相异。相比 `V-Triad`
  的三个顶点，他们发现了两个：邮件中的线索以及它们与用户习惯的兼容性或匹配度。


  但不仅如此。甚至他们量表的实现方式也是相似的。他们要求 IT 人列出邮件中的线索，并使用一系列闭式问题对感知难度和整体匹配度进行评分。因此，`NIST` 团队针对相同的问题，使用了相同的方法，并得相似的结论。由于他们使用了不同的邮件语料库且独立工作，这些发现的一致性有助于研究的三角验证。这有助于牢固地建立
  `V-Triad` 的有效性。


  然而，它们之间存在差异，这解释了为什么 `V-Triad` 在开发理想的渗透测试方面更为优。首先，`Phish Scale` 对线索的视角非常广泛。根据 `NIST`
  的定义，线索是攻击中任何具有视觉锚点。这种对线索的概念化与认知科学原理不一致，在认知科学中，线索有明确的定义并与文本内容区分来。


  这一点很重要，因为在使用 `Phish Scale` 时，IT 部门必须列出每一个线索。这意味着要识别表面任何内容（从显示名称和主题行到说服性诉求，到附件标识、品牌名称）。正如我们在第
  4 章中讨论的，在线通信界面充满了图形、文本和图标。使用 `NIST` 方法需要列出大量的线索，然后对每一个进行单独评分。这不能只做一次，而是要做两次：首先针对它们的感知难度，其次针对它们的匹配度。


  这在实践中非常困难，因为很难确定为什么某些东西是线索，以及何时不是。例如，用于输入凭据的表单字段是线索吗？某些邮件应用自动填充的发送者个人照片呢？当它出现时，它无疑是一个线索，但如果它缺失了呢？如果用户预期它的存在，那难道就不是线索吗？


  在处理邮件中的文本元素时，问题变得更加复杂，`NIST` 方法同样不准确地将这些元素视作线索。正如近一个世纪的认知研究所示所示，文本诉求与线索相比具有不同的认知效应。正如你可能记得的，前者触发系统性处理，后者触发启发式处理。这就是为什么作为
  `V-Triad` 解释框架基础的 `SCAM` 区分了不同的认知处理风格。


  然而，将线索与文本混为一谈会引发另一个问题。邮件的文本通常包含多个线索，有时甚至出现在同一个句子中。一个句子可能包含一个警告、一个截止日期和语法错误。这些是应该算作一个线索还是三个？语法错误和拼写错误又怎么算？是算一个还是两个？


  说服性短语和诉求让情况变得更加复杂。让我们来看一个例子：一封看起来来自美国红十字会的钓鱼邮件，它要求捐款并有截止日期且很少拼写错误，甚至还包含一条防范钓鱼的警告（许多攻击者引入这一点是为了增强信任）。在这里使用
  `NIST` 方法意味着要么忽略某些线索（例如忽略红十字会钓鱼邮件中的诉求，而关注截止日期、美国红十字会名称和拼写错误），要么计算诉求及其其中包含的所有元素——这会导致其影响被翻倍或三倍计算。这可能取决于编码人员，从而在数据中引入了更多污染物。因此，将文本广泛视为线索的观点导致了一个极度不可靠的评分系统。


  最后，`Phish Scale` 忽略了定制性——这是钓鱼所利用的一个重要因素，而 `V-Triad` 包含了这一点。正如本章早些讨论的，定制性捕捉了钓鱼攻击利用用户在在线环境中进行心理适应的侧面。正如我们每个人都能证实的那样，我们在网上进行的大部分活动涉及将知识从一个表面经验转移到另一个。由于操作系统环境和用户界面的不断更新，我们必须这样做。而且我们对这一切都没有使用说明书。忽略网络用户行为的这一关键维度，就错过了导致用户易受攻击的根本方面。因此，`Phish
  Scale` 对用户的看法有限，认为他们仅仅是对线索做出反应，而不是适应性的。


  尽管有这些局限性，`Phish Scale` 发现攻击的可信度和兼容性与实际钓鱼点击率之间存在强关联。总体而言，它支持了 `V-Triad` 并找到了支持其维度的证据。三元法要全面得多且更容易实施。它不是通过数线索并反复对每个维度的复杂组成部分进行评分，而是直击问题核心——钓鱼邮件中的欺骗元素单独或整体上引起了多少怀疑。毕竟，是邮件中所有因素的协同作用导致了欺骗。`CRS`
  还汇总了 IT 员工的估计值。这捕捉了组织内专家用户的共识观点，有助于减少变性和偏差。因此，该方法考虑了用户在科学上被证明能预测钓鱼欺骗或其检测的认知、行为和经验因素。现在你已经知道它是有多有效了，在第
  7 章中我们可以把它们整合在一起并进行网络风险评估。


