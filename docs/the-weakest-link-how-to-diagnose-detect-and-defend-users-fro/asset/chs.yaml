  # 8 从网络风险到网络卫生


  任何关于用户网络风险的对话，如果没有讨论网络卫生都是不完整的。改进网络卫生是许多以用户为中心的倡议的合理依据。从意识培训到渗透测试、补丁管理、`VPN` 使用、强密码使用、双重身份验证以及杀病毒软件的使用，所有都被认为是必要的，因为它们改善了用户的网络卫生。


  但什么是网络卫生？它的组成部分是什么？我们应该如何衡量它？为什么要衡量它？网络卫生如何与基于 `CRS` 的评估相结合？所有这些问题的答案都在本章中。


  ## 什么是网络卫生？


  从概念上来说，网络卫生很容易理解。它在逻辑上人们为了保护其数据和设备免受损害而可能采取的行动，与人们为了保护和改善健康而经常执行的个人卫生行动结合在一起。`cyber
  hygiene` 这个术语具有某种朗口性和易见性。这驱动了它的广泛采用，在线搜索该词返回了超过 3000 万页结果。对网络卫生的追求出现在新闻文章、政策手册、国会证词、倡议网站甚至军事条文中。


  但尽管有数百万页面使用了这个术语，直到最近，对其真实含义仍然并不清楚。在定义它或澄清导致它的行动方面，并没有做多少工作。在一项比较欧盟成员国网络卫生实践的研究中，欧盟网络和信息安全局（`ENISA`）发现，虽然网络卫生被认为类比于个人卫生，但
  1 尽管网络卫生被认为类比于个人卫生，但 2 得益于此，飞机制造商关注了薄机翼和康复 3 我将简要介绍其中的一些原因。


  首先，在概念层面，我们思考问题的方式会影响我们解决问题的方式。飞机的发展就是一个很好的例子。因为鸟类的飞行能力看起来是显而易见的，自古以来，我们对飞行的心理模型一直基于此。这启发了关于代达洛斯和伊卡洛斯的古代故事，使对翅膀的使用神话化，并塑造了
  20 世纪制造带扇翼飞机的尝试，结果却以失败告终。





  为了跟上要求，许多用户重复使用密码，而另一些用户则盲目听从。这为网络钓鱼攻击提供了完美的切入点，攻击开始模拟密码过期通知。意识到这一点，美国国家标准与技术研究院（NIST）最终在
  2017 年扭转了这一指南，但此时已是在损害造成的十年之后。用户已经习惯了相信密码过期警告、重复使用密码并点击此类邮件中的链接。直到今天，全球许多机构仍坚持要求用户每隔几个月更改一次密码，这导致钓鱼攻击者持续利用这一切入点，并可能在未来几年内继续这样做。


  第三个问题随之而来。它们既独立运行，不受我们的控制，又同时协同工作。我们在一生中会产生免疫力，有时是在感染之后。我们还受到大脑智能控制的进一步保护（例如，当某人冲动地拍掉咬人的昆虫，或因为觉得脏而洗手时）。正因为这些保护，我们大多数人都能过上相对没有疾病的生活。


  相比之下，虽然技术整体能够胜任极其复杂的计算任务，但其核心组件却是愚笨的电路。它们不仅在构建时没有任何有效的保护，而且其中许多组件还存在缺陷。


  ### 现代硬件中的漏洞


  2019 年发现的 `Meltdown` 和 `Spectre` 证明了几乎每一台制造的计算机其核心存在缺陷。同样，`D-RAM` 单元也容易受到电荷泄漏的影响——被称为
  `rowhammer`——这可以被用来获取 root 权限。计算设备的“感官器官”也是如此：触控板、麦克风、摄像头和输入设备。每一个都极易被记录器和其他程序进行破坏。


  ### 缺乏演化


  技术的任何内部或外部“器官”都无法学习保护自己，这意味着对某层的攻击可以反复进行，直到被发现并开发出修复方案。这需要时间。黑客在网络中平均潜伏大约六个月才会被发现，
  50% 受到社会工程学攻击的机构在一年内再次受到攻击。这些之所以可能，是因为与人类体不同，技术无法产生免疫力或抗性。黑客可以一次又一次地攻击同一个机构。


  网络卫生不应等同于个人卫生习惯的最后一个原因是，安全错误的累积方式不同。由于计算领域缺乏进化的保护，一封带有恶意软件负载的简单钓鱼邮件就可以欺骗用户、绕过许多终端防护，进入系统核心并建立脚点，而无需在每个阶段进行演化。相比之下，看看不断演变的流感病毒，它每年在全球范围内导致超过
  60 万死亡，数百万人住院。并不是每个感染它的人都会去世。有些人对某些病毒毒株具有抗性，而另一些则具有不同水平的免疫力和先天保护。





  相比之下，`SSL` 证书 10% 的失败率可能会导致完全不同的结果。如果这些证书被用于相关性为 10%（即内容与用户相关的比例）的电子邮件钓鱼攻击，且在一个允许
  10% 的此类邮件送达终端用户的电子邮件网络上，仅有 10% 的用户点击并启用了恶意软件，那么每个错误发生的概率将呈几何倍数增长。它变成可以通过公式 `(1−.90^k)`
  计算的依赖概率，其中 `k` 是漏洞的层数。发生泄露的概率将是 34%。这些都是保守估计。正如我在书开头提到的，实际上通常有 30–70% 的钓鱼邮件会被打开，而且互联网上有很多恶意的
  `SSL` 证书和虚假网页。因此，与人体不同，在计算领域，由于不良卫生习惯导致的每种潜在失败都会显著放大整体风险。


  从这些论点可以清楚地看出，个人卫生和网络卫生完全没有可比性。我们无法在网络卫生上给予同样的宽限度。我们需要在定义它时具有更高的精确性，并识别它的含义以及它不包含什么。


  然而，因为在概念上与个人卫生相似，并没有人真正停下来解释它或深入思考它。相反，我们得到的是一些从未经过深思熟虑的笼政策建议。大家都认为自己理解了网络卫生的概念，因此没有人为它开发出有效的衡量标准。正如此，没有人知道谁拥有网络卫生，谁缺乏网络卫生，甚至不知道他们缺乏了什么。


  由于网络卫生是一个用来指责和归咎用户的流行词（通常在泄露发生后），这一切变得无足轻。它是集体意识的一部分。你总是可以指着网络上的某人做某事不正确或做得不够，并说他们缺乏网络卫生。这就是为什么尽管我对这个术语持批评态度，但在这里不得不使用它。


  但我并不乐意忽视网络卫生的缺陷。我选择了纠正它们。我将我的研究计划部分致力于改进网络卫生的概念化和衡量。这从该概念的基础开始。


  # 网络卫生的根源


  为了追溯根源，我采访了各种组织的 `CISOs`（首席信息官）、安全倡导者、技术人员和 IT Staff。我要求每人都列出他们认为体现了网络卫生的特定用户活动，以及这些活动如何帮助组织安全。他们的回答各不相同。对于某些人来说，良好的实践包括特定的行动，如安装补丁和更新杀病毒软件。对于另一些人，网络卫生涉及用户的思考，例如检查
  `SSL` 加密图标或检查以确保网页真实性。对于另一些人，它涉及培训、意识培养、`pen-testing`（渗透测试）和推广网络安全。对还有一些人来说，它涵盖了用户为了保护企业免受网络攻击所做或应该知道要做的一切。但虽然他们列出的活动有所不同，但他们都同意一点：网络卫生活动有助于建立网络韧性。


  网络韧性——使组织对网络攻击无于形——是唯一的驱动力。它是每种网络卫生实践、行动、思想和过程的预期结果。它处于根源。这意味着对网络卫生的任何定义和衡量都必须与这一最终目标保持一致。它必须帮助建立组织的网络韧性。这意味着要用卫生的替代方案来改变用户糟糕的思维模式。这需要管理变革。


  为了理解如何最好地做到，我转向了对组织设计的研究——这是由麻省理工学院的 Kurt Levin 在 20 世纪 40 年代开发的一个管理科学领域。该领域已经许多许多组织变革解决方案，如
  `Total Quality Management`（全面质量管理）和 `Six Sigma`（六西格玛），全球领先组织已应用于管理变革，但从未扩展到网络安全规划。根据文献，我确定了构建网络韧性的五个原则，每个原则代表网络卫生活动必须满足的最低要求层级（[图
  8.1]）。


  ![图 8.1 ¶ 构建网络韧性的五个原则。](img/Figure_8-1.png)


  [图 8.1] 构建网络韧性的五个原则。


  ## 原则 1：构建韧性不仅仅是建立意识


  最近，我在英国的一场会议上讨论安全意识培训的局限性。观众中的某人问我，为什么当他母亲现在知道尼日利亚钓鱼攻击时，我却声称意识培训不起作用。他的论点是，这足以证明她对此类攻击具有韧性，这是人们常犯的错误。意识虽然是必要的，但远非足够的。它涉及到对某个概念的熟悉，这并不等同于知识或理解。


  你可以意识到某事（例如龙卷风），但不知道它意味着什么，或者当你处于它的路径上时该做什么。同样，你可以意识到一封尼日利亚钓鱼邮件，但对其潜在能力毫无理解。这很重要，因为并不是所有的尼日利亚钓鱼邮件都是借口攻击（pretexting
  attacks）。许多已经演变为伪装东欧钓鱼邮件、`Microsoft` 服务台邮件或基于电话的攻击。有些用于收集信息，这意味着即使打开邮件也信号该电子邮件账户是活跃且使用的。知识对于妥善处理这些威胁至关重要。打开、回答、点击、删除或在另一个设备上打开将分别决定结果是有害还是无的。它们为黑客提供了有关用户行为的洞察，可能导致更有针对性的攻击。因此，意识对于构建网络韧性是必要的，但它是最低要求。


  ## 原则 2：构建韧性不仅仅是传授知识


  每当意识不足时，大多数人脑海中自然的下一个想法是用户需要知识。然而，知识是一个广泛的概念。它的范围从操作方法（know-how）到深层专业知识。对于网络安全，根据所使用的技术，所需的知识范围可能更广。正如第
  4 章关于网络风险信念的讨论中提到的，计算技术有太多层了，任何人都不可能掌握所有它们。相反，实现网络卫生需要恰好满足任务的知识。它要求用户具备“足够的（sufficiently）”知识，以达到“满意的（satisfactory）”韧性水平。也就是说，用户需要“折中（satisfices）”的知识——这是认知科学中的一个术语，结合了上述两个词。


  这与目前某些网络卫生方法有所不同，在那些方法中，意识培训计划要求用户通过检查邮件中的数十种（一个培训计划中超过 40 种）不同特征来达到精通，以判断邮件是否具有欺骗性。对于处理多个电子邮件、电子邮件账户、设备和竞争性认知任务的用户来说，这样做是不切行的。这种知识密集型方法无非是让用户面对一个他们无法实现的标准。随着时间的推移，这会降低他们甚至尝试在网上保持安全的动力，从而降低韧性。





  相反，构建网络韧性需要对每项决策的“满足标准”进行审查。这必须在用户层面完成，通过研究用户正在做什么，并将任务需求与安全知识相匹配。在电子邮件安全方面，用户不需要理解
  `IP addresses`、`malware signatures`、`ports`、`macros` 以及 `transmission protocols`。他们需要知道在邮件中从哪里寻找应该引起怀疑的重大信号，并知道在那之后应该采取的步骤。这就满足了。


  ### 原则 3：构建韧性是一个过程


  构建韧性是一个过程。第三项原则超越了意识和知识，转向了实际行为。韧性不是单一的，而是安全部门可以培养的各种结果。韧性包含了意识和知识，这些维度需要被确认、验证并不断更新，以应对不断变化的威胁环境。韧性并非二元化的。它是一个随时间推移的、用户如何思考和行动的过程。这种变化是程度性的，通过培养用户的网络安全文化来实现。这种方式，这种网络安全文化是让用户意识到并采取的，并通过满足这些标准来构建韧性。


  ### 原则 4：构建韧性需要衡量


  如果我们希望通过用户的思考和行动来构建韧性，我们需要对这些行为进行衡量。构建韧性需要衡量。这种衡量是全面的，涵盖了用户的各种行为，并发现问题。通过 `pen-test`（渗透测试）结果，我们可以衡量并分类这些问题。这种衡量是持续性的。为了构建韧性，我们需要对网络安全文化进行衡量，这实际上是用户需要培养的。这种衡量涵盖了用户的意识、知识和能力。因此，通过衡量这些维度来构建韧性。


  ### 原则 5：构建韧性需要问责


  构建韧性需要问责。培养网络安全文化需要用户参与其中，这并非自上而下实现的，而是让员工防范 `phishing`（钓鱼攻击）。我们需要的是一种数据驱动、透明且有效的问责机制，这种机制影响用户的思考和行动。当这些标准被用户共享，问责就得到了体现。


  这五个原则得出的结论是，实现韧性不仅需要意识，还需要衡量。2020 年，我开发了一项名为 `Cyber Hygiene Inventory` 的衡量工具。


  ## 衡量网络卫生


  开发这项衡量工具的过程涉及多个阶段。首先，由不同的安全专家独立定义了“网络卫生”的概念。其次，开发了反映该概念的个体问题。这些数百个潜在问题，随后由 IT 专业人员进行分类，并进行了不同层级的统计分析。这一过程使用了
  `nonmetric multidimensional scaling`（非度多维尺度）和 `cluster analysis`（聚类分析）。最后通过对不同用户群体进行系列调查对单个问题进行了测试、修订、验证和最终确定。


  最终得出的网络卫生定义为：“在线用户应采取的网络安全实践，以保护其联网设备上的个人信息免受网络攻击。”


  在操作或衡量层面，这发生在四个层次：`awareness`、`knowledge`、`technical capacity` 和 `enactment`。首先，网络卫生需要
  `awareness`，这涉及到对威胁及相关实践的熟悉。它需要 `knowledge`，即足够的理解。这些是认知层面的因素。它们需要补充相应的 `technical
  capacity`。最后一个层次是 `enactment`，即实际的执行。


  网络卫生的每个层次都建立在其他层次之上，`awareness` 是最低要求，而 `enactment` 是最理想的状态。它们也呈程度性，因此你可以在不同程度上拥有每一个维度。总而言之，它们解决了构建网络韧性所需的原则。




  总而言，在四个维度上衡量的 25 项最佳网络安全思想和行动被称为`网络卫生清单`（`Cyber Hygiene Inventory`）。`CHI` 中的每项网络卫生实践都是一个调查问题。用户使用五级
  0–4 响应量表来回答每个问题。这使得累计 `CHI` 分数的范围在 0 到 100 之间，分数越高越理想。在 25 个问题中，每 5 个问题分别衡量存储与设备卫生、传输卫生、朋友连接与社交媒体卫生、身份验证与凭据卫生以及电子邮件和消息卫生。`CHI`
  如表 8.1 所示。


  | 表 8.1 网络卫生清单 |

  | --- |

  | 问题 || 网络卫生清单 (CHI) || 每个问题衡量的内容 |

  | --- | --- | --- |

  | 1 || 如何检查您的设备以确保其具有最新的操作系统、软件更新或补丁 || 存储与设备卫生 |

  | 2 || 如何删除存储在您的设备上的敏感数据 || 存储与设备卫生 |

  | 3 || 如何对任何新的 USB 驱动器或外部存储设备运行病毒扫描 || 存储与设备卫生 |

  | 4 || 如何保持病毒防护软件更新 || 存储与设备卫生 |

  | 5 || 如何在您的计算设备上启用防火墙 || 存储与设备卫生 |

