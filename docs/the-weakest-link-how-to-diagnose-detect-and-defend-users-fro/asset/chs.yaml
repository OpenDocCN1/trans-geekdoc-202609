  为什么要进行钓鱼渗透测试？


  如果你到目前为止遵循了书中的逻辑，那么你已经知道它的目的并不是为了培训用户。虽然渗透测试可以帮助识别用户中哪些可能需要培训，但它并不能培训他们，尤其是当采用“震慑与恐惧”的方法时——即仅仅设计渗透测试来欺骗用户，然后对被欺骗的用户进行惩罚。相反，我们进行渗透测试是为了了解用户中哪些正面临风险。我们这样做是为了量化他们的风险水平，诊断风险产生的原因，并识别我们可以采取哪些措施来保护他们。我们这样做是为了理解谁需要培训，以及谁可能需要培训以外的东西。我们这样做是为了识别用户中最薄弱的环节并保护他们。使用
  `网络风险调查 (CRS)` 开发和实施的钓鱼渗透测试可以做到这一切。


  但还有其他更高层次的理由。渗透测试的目的不仅仅是识别单个用户带来的网络风险。它们还需要帮助评估社会工程对整个组织或企业的威胁严严重性。测试还需量化组织的风险态势。如果这种量化评估能够扩展到整个企业甚至整个行业，将会非常有帮助。这样，政策制定者或保险公司就可以比较不同层级的风险。他们随后可以通过实施保护措施、分配资本和在必要时部署资源来缓解钓鱼威胁。他们还可以高效地分配培训，跟踪各种缓解措施的成效，并更好地部署资本和资源。


  通过使用 `CRS`，IT 部门还可以计算净韧性评分 (`NRS`)，该评分量化了企业层面的风险和就绪状态。`NRS` 源自 `CRS`，是一个汇总估计值，用于量化在一次或一系列钓鱼渗透测试中，一组用户面临的钓鱼网络风险。`NRS`
  的最大值为 100，并且可以向上扩展到组织部门甚至整个组织。这使得比较实施该标准的组织之间的相对风险成为可能。它可以进行扩展，以便理解整个行业、一个地区或跨国家的整体风险。因此，`CRS`
  及其相关指标的广泛使用有助于微观和宏观层面的战略规划和政策制定。本章将解释 `CRS` 如何实现这一切。


  ## 认识医生


  首先，让我们扩展一种我们都熟悉的方法——患者就医。世界各地的医生在这些诊疗期间遵循以下大步骤：


  *   患者带着基础疾病就诊；

  *   医生在受控条件下进行操作以评估或触发疾病的症状；

  *   医生使用诊断或测试来衡量患者对操作的反应；

  *   诊断具有基准或性能标准；

  *   将患者的表现与此基准进行比较以评估疾病；

  *   根据评估结果对患者进行诊断，并推导出治疗方案或解决方案；

  *   医生向患者传达诊断结果。


  这种基础医学诊断方法也是进行用户网络风险评估的基础（[图 7.1]）。


  ![图 7.1 进行用户网络风险评估的步骤。](img/Figure_7-1.png)


  图 7.1 ¶ 进行用户网络风险评估的步骤。


  ### 步骤 1：用户遭受网络脆弱性


  用户网络风险评估的基础假设是，所有用户都容易受到社会工程学的影响。另一个假设是这种脆弱性在用户之间存在差异。虽然说明这一点似乎显而易见，但要注意，这并不是如今嵌入式培训方法的假设。大多数测试只针对用户的子集（通常忽略
  IT 部门和高层管理人员），使用通过/失败的衡量标准，并且只关注失败的人。这些方法忘记了每个人都是社会工程学的目标，即使是 IT 部门和高层管理人员，他们往往因为拥有核心权限而成为受青睐的目标。如今的嵌入式方法忽略了每个人都是社会工程学的目标，只关注失败的人，并且本质上假设用户要么通过要么失败。


  `CRS` 源于一个正确的假设：每个人都面临社会工程学的风险；每个人都应该接受测试，包括 IT 部门和高层管理人员；渗透测试揭示的不仅仅是失败的人；渗透测试的目的不是忽略通过或失败的人；而且对于两者都有多种原因。`CRS`
  的核心重点是以最有效可靠的方法发现并捕捉用户钓鱼脆弱性的所有原因。


  ### 步骤 2：IT 管理人员设计鱼叉式钓鱼渗透测试


  `CRS` 要求 IT 人员使用 `三角模型` 制作一个理想的钓鱼渗透测试（或一系列测试）。有必要代表三角模型每个顶点的包含一个主要元素——可信度、定制性和兼容性。两个主要考虑指导了从每个顶点内选择元素的标准。首先，每个元素应该对邮件的生态效性做出贡献。它应该有助于使测试尽可能真实。因此，一个模仿
  iTunes 邮件的渗透测试可能包含苹果标志并使用其字体和颜色，但目标并不是为了每个顶点不断添加图标和表单字段。所有的添加都需要与上下文相关；否则产生的数据是不可靠的。其次，必须了解渗透测试的质量。在部署之前必须量化其欺骗能力。实现这一点的方法是通过实证检查，这将在步骤
  3 中完成。


  ### 步骤 3：建立渗透测试基准


  设计完成后，IT 部门需要确定渗透测试的质量。可以使用组织的代表性用户子集完成，甚至可以使用几位 IT 员工作为“专家”样本。基准是通过让子集中的每个用户独立地对渗透测试进行评分建立的。每个人回答两个
  `CRS` 基准问题，衡量组织平均用户会有多大的怀疑以及评分的原因。


  基准评分的有效性取决于作为其他用户代理的用户的诚信。如果对他们如何代表测试目标有任何担心，简单的解决方法是让他们评估自己与组织内用户的相似性。这样一个问题就足够了：*Q*。*在
  0-10 的量表上，0 表示“完全相似”* *而 10 表示“完全不同”，* *你与组织的平均用户有多相似？* 通常，在该量表上得 8 分或以上的人被认为与平均用户太不像，他们的回答将从基准中排除。





  基准分的生成在较小的组织中仅需一名 IT 人员作为专家，而在较大的组织中则可能需要多达 25 名用户。除非组织内部用户的差异巨大，否则不需要大量的样本。然而，至关重要的一点是，担任专家的个人必须被明确告知，他们的任务是评估组织内`an
  average user`可能会做什么，而不是他们自己会做什么。此外，专家们必须独立完成评估，不能相互商量，这一点也同样重要。基准分可以在渗透测试部署之前计算，也可以在考虑的多个示例中选择某一项测试时计算。它也可以在渗透测试部署到组织内所有用户时同时评估。


  随后，对专家小组提供的回答进行平均处理，从而得出渗透测试的基准预期。例如，如果小组对某项测试的平均分为 6，那么结论是：组织中的大多数用户应被视为低风险，理想情况下在该渗透测试中应获得超过
  6 分。


  ### 第 4 步：将渗透测试部署给组织用户


  接下来，使用电子邮件营销软件或渗透测试软件，将钓鱼邮件部署给组织内的用户。渗透测试应用程序和邮件营销软件可以跟踪任何用户何时打开邮件以及他们点击了什么。这提供了一个行为衡量标准，可以作为交叉参考，以检查他们调查回答的真实性。如果
  IT 人人员没有权限渗透测试软件，可以使用任何标准的白名单邮件账户发送邮件，并在其中嵌入一个清晰的 GIF 跟踪 Cookie。所有这些都可以使用免费提供的邮件跟踪工具实现。


  无论最终如何部署渗透测试，确保拥有一份准确的目标用户列表是至关重要的。在许多大型组织中，存在着离职员工的邮箱账户。在某些情况下，用户拥有多个邮箱账户，甚至将个人邮箱账户用于工作。确保攻击发送的邮箱是有效的，并准确统计任何用户被攻击目标的次数，这非常重要。


  ### 第 5 步：部署网络风险调查


  渗透测试部署之后，将部署包含两个问题的网络风险调查（CRS）。由于风险诊断基于绝对数据和比较数据，因此问卷需要发送给所有人，包括那些受害者（打开了邮件并点击了超链接或附件的人）以及那些识别出欺骗的人。


  CRS 可以通过两种方式之一部署。它可以嵌入钓鱼测试的链接中。在这种情况下，与其在渗透测试中发送虚假的钓鱼链接，不如将链接指向调查问，每当用户点击并落入测试时，调查问就会打开。对于那些没有中招钓鱼测试的人，可以在攻击后一周内向他们发送
  CRS，并在调查问中附上钓鱼渗透测试邮件的图片以帮助其回忆。或者，所有用户（包括识别出威胁的用户和被欺骗的用户）都可以在渗透测试一周后收到 CRS。这两种方法都能获得可比的数据，在我的测试中，我发现从立即到七天的窗口内，回忆的差异有限。


  总体目标是让所有攻击目标用户中至少有 60% 的人回答 CRS，这一回复率是确保数据有效性所必需的。为了确保这一回复率，IT 经理必须多次尝试获取所有目标用户的答复。


  ### 第 6 步：识别薄弱环节，并诊断其脆弱性原因


  使用 CRS，将用户在渗透测试中的表现与基准数值截分点进行比较。参考之前的示例，我们得到的基准分为 6，任何得分小于或等于 6 的用户都被视为较高风险。这些用户就是薄弱环节，而在他们中得分最低的用户是最薄弱的环节。任何超过阈值的人（在我们的示例中得
  7 分或以上）将被认为风险较低（请参见 图 7.2）。




  结果沟通在这一过程中至关重要。它让用户知道他们为何处于风险之中、做错了什么，以及他们的社交群体中的其他人做了哪些正确的做法，他们也可以这样做来降低风险。如果没有沟通，网络风险评估过程就是不完整的。在这个阶段，IT
  管理人员可以决定是否需要更多测试、这些测试可能评估什么（例如目标用户习惯与风险信念或启发式思维）、测试难度是否需要增加，以及下一次测试的针对对象是谁。然后我们将从第
  1 步重新开始该过程。


  总而言之，基于 `CRS` 的诊断组织薄弱环节流程遵循以下步骤：


  *   从所有用户都是脆弱的假设开始；

  *   使用 `V-Triad` 框架开发一个有效的鱼叉式钓鱼渗透测试；

  *   确定网络钓鱼渗透测试的基准性能预期；

  *   在目标用户身上部署渗透测试；

  *   使用 `CRS` 测量对渗透测试的响应；

  *   比较用户在渗透测试中的表现与基准，识别低风险和高风险用户；

  *   通过比较低风险用户的开放式回答与高风险用户的回答，诊断用户高风险的原因；

  *   通过从每次测试的高风险用户百分比中减去低风险用户百分比来计算 `NRS`，并进行持续汇总。


  一旦诊断出薄弱环节，就有许多可以应用的干预和解决方案。其中许多内容将在第 9 章中讨论。现在，让我们留在 `CRS` 上，讨论它为什么有效以及为什么比我们目前在网络安全领域做的任何事情都要。


  ## CRS 方法的优势


  `CRS` 结合使用 `V-Triad` 设计的渗透测试，捕捉了导致社会工程受害过程的广度和深度。由于以下原因，该方法远优于现有方法。


  首先，正如之前讨论的，几乎所有的鱼叉式钓鱼测试都是随机的，没有设计依据的依据。它们在复杂程度、质量、内容和结构上各不相同，使得它们变得不可靠。相比之下，`CRS`
  中的每个元素都有安全科学的依据。


  其次，目前不存在确定渗透测试质量的机制。正因如此，无法知道一项渗透测试是否有效，甚至是否适用于测试。然而，`CRS` 方法得出的渗透测试优点是可以量化确定的，这使得能够知道某项测试是否适用于组织，以及它在多大与其他测试具有可比性。


  第三，评估渗透测试质量的 `CRS` 方法可以在部署到实际用户之前预先。这意味着如果渗透测试不符合正确的标准，可以对其进行修正且不使用。此外，测试的质量可以量化确定，因此我们知道测试在不同执行过程中的可比性。


  第四，所有社会工程渗透测试都聚焦于通过或失败的结果。没有一个测试能提供关于用户为何落入或未落入测试陷阱，或者他们与其他用户相比表现如何的见解。`CRS` 让我们能够理解用户受欺骗的程度。来自
  `CRS` 的数据对风险人群提供了量化估计，帮助确定用户中最薄弱的环节。它还以粒度水平捕捉了深层原因，从而阐明了每个用户风险或韧性的底层原因。


  第六，在所有渗透测试中，只有受害者才会被记录和处理，通常是给予更多的培训。其根本假设是，只有测试的受害者才容易受到网络钓鱼攻击。测试还假设所有没有中招的人都是因为他们理智且谨慎。`CRS`
  对谁需要被治疗不做任何先验假设。它将他们的风险或韧性定位在认知、行为和基于性格的触发因素中。它进入用户的内心，并根据他们如何思考和行动提供风险估计，从而全面解释了为什么某人中了钓鱼或检测到了它。


  第七，由于缺乏用于执行渗透测试的技术之外的框架，所有实施渗透测试的培训方案都在技术中寻找解决方案。许多方案由具有工程导向的 IT 人员进行，他们延伸了对用户的机械论假设，最终要么提倡更多的培训，要么要求进一步的技术保护。测试数据缺乏理解或诊断每个用户风险原因所需的细粒度和丰富性。


  相比之下，`SCAM` 的认知行为框架构成了 `CRS` 的基础。这有助于揭示可能用户特有的或存在于特定组织中的问题。例如，可能存在一种独特的启发式思维、一种缺陷的网络风险信念，或者一种在组织或用户类型中根深蒂固的仪式。`CRS`
  让 IT 人员能够发现并修复这些问题。在许多情况下，这可以导致甚至不需要更多培训的解决方案。（这些示例在第 9 章中给出。）


  第八，`CRS` 能够通过更少的渗透测试提供对用户网络风险的稳健估计，而目前的做法是组织反复进行许多渗透测试。`CRS` 使这成为可能，因为它的测试基于 `V-Triad`，而它是建立在
  `SCAM` 的科学框架之上的。正如此，IT 人员可以创建几个可靠的测试（每个测试都有已知的难度），并仅实施它们，而不是必须创建许多测试来调整它们的不可靠性。测试还可以穿插于全年，随后进行各种干预，其效力可以使用
  `CRS` 的另一个应用来判断。这将有助于识别每项干预的影响以及它们成功或失败的原因。


  第九，`CRS` 的结果有助于计算整个组织的 `NRS`，这提供了其对社会工程整体韧性的快照。由于该指标易于计算和理解，可以与其他组织共享。他们可以分享使用的测试数据、采取的干预措施以及在这些过程中
  `NRS` 的变化。这可以帮助组织理解他们的相对就绪水平，并定位行的解决方案，而无需每次都重新发明。


  最后，`CRS` 及其相关指标可以很容易地传给用户。今天，任何此类沟通都是针对渗透测试失败的用户。这样做是为了制造恐惧，而不是建立责任感。部分原因是测试范式使用了震惊和威慑的方法——通过触发事故来强化用户。在这种观点下，IT
  管理人员像警察一样，旨在发放罚单和严厉处罚，而不是鼓励更好的行为。即使是如 `Phish Scale` 这样的开发也是给 IT 人员的。它们不是为通信设计的工具，而是为了更好地进行监管的指标。


  `CRS` 反转了这一点。它通过简化结果来促进沟通。任何拥有有限统计知识的人都可以响应 `CRS`、实施它、得出 `NRS` 分数并解释它。这使得该方法易于实施，并且是共享和沟通的理想选择。


  一旦用户知道了自己的分数，就可以了解自己与组织内其他人的关系。他们可以理解自己做对了哪些，哪些没对，以及他们需要做出哪些改变。他们甚至可以理解 IT 部门的期望及其原因。通过这种方式，`CRS`
  促进了透明度和共同理解。





  # 就像烘焙蛋糕


  烤蛋糕无疑非常简单。准备面粉、鸡蛋、黄油、盐、糖和泡打粉，加入牛奶，混合并加热直到完成。这七种原料在经验丰富的糕点师手中可以变成一件杰作，而在新手手中则可能变成一场灾难。区分两者的区别在于通过多年试错积累的专业知识。对于新手来说，这种试错可能会无休止下去，因为从烘焙到写音乐，任何事情都有许多种实现方式。而专家则凭借经验知道哪些方法是有效的，并用更少的尝试就能做出优秀的产品。


  `CRS` 的应用也是如此。它虽然简单，但有许多应用方式，会导致各种不同的结果。坦率地说，多年来，`SCAM` 研究和 `CRS` 应用已经让我们了解了哪些方法是有效的，哪些是无效。你也可以从那些已经实施并解决了其盲点的人的试错中学习。这样一来，你就不必自己去走不同的死胡同。你可以快速应用
  `CRS` 并获得你理想的网络风险估值。以下是针对实施 `CRS` 时最常见问题的解答。


  *   **Q**：两个问题足够了吗？还有其他这种通过少数问题就能获得有效结果的吗？

  *   **A**：大多数民意调查在评估公众观点时使用单一指标。即使是第 6 章讨论的认知反射测试（`CRT`）等智能测试，也仅通过三个问题就能提供有效的估值。此外，还有贝恩公司开发的净推荐值（`Net
  Promoter Score`），它被财富 500 强强公司广泛用于战略决策。它同样只使用了一个问题。


  *   **Q**：IT 部门的人会回答问卷并对开放式回答分析吗？先例在哪里？

  *   **A**：问卷在 IT 部门已经使用了很段时间。`SANS` 网络安全模型采用了闭式问题来衡量用户态度。即使钓鱼指数（`Phish Scale`）也要求
  IT 人回答关于钓鱼邮件特征的问题。用户不仅习惯回答此类问题，IT 部门也习惯分析此类回复。


  *   **Q**：我想要更多的定量数据，希望使用定量的闭式问题来代替开放式回答。我该如何做？

  *   **A**：在介绍 `SCAM` 模型的研究中提供了闭式问题。有一个更新版本使用了 `20` 个问题，可以用于多元回归（例如使用 `Lens Model`）来衡量个人风险预测因子。请记住，使用这些模型并不会改变我们通过
  `CRS` 方法确定的风险概况。它只是为这些预测因子提供了一个统计模型。我们可以通过为 `CRS` 中用户的开放式回答分配数字代码来达到相同的结果。这些代码也对影响怀疑程度的认知行为因素提供了量化分析。


  *   **Q**：我们已经从渗透测试软件中获得的其他指标呢？

  *   **A**：我们从渗透测试软件中获得的其他指标可以整合到 `CRS` 中。然而，`CRS` 侧于于因素，而渗透测试识别的是技术漏洞。通过将两者结合，你可以获得组织风险态的更全面的视图。渗透测试的指标可以为
  `CRS` 的结果提供背景。例如，如果渗透测试显示特定应用程序存在漏洞，`CRS` 可以揭示该应用程序的用户是否特别容易受到针对该程序的社交工程攻击。


  （注：原文提供的后半部分包含重复/损坏的占位符风格句子。我已清理结构，在遵循所要求的格式规则的同时，保持了核心问答逻辑。）






  ### 回：要让用户参与，首先要确保他们认可参与 CRS（网络钓鱼测试）的价值。这种价值需要被传达，而且如果这种沟通来自用户信任和尊重的内部人员，效果会更好。此外，IT
  人员也应该将每一次渗透测试视为一个了解用户的机会，而不是为了欺骗他们或向他们展示其无能。这需要鼓励参与而非强制要求。最后，确保参与还需要以一种改进的方式传达 CRS
  的结果，以提高用户的知识水平和对组织网络安全就绪的投入。这开启了一种共同网络安全责任的文化，并有助于提高组织的网络态势。


  ### 问：我需要多少份 CRS 响应？


  ### 回：

  理想情况下，你需要从接受过渗透测试的 10 名用户中获得至少 6 个人的响应。这并不是一项硬性要求，而且必须对数据进行评估，以确保响应的 60% 人员大部分来自某一个群体（即：仅仅是那些没有中招的用户）。通常，只要你做到以下几点，达到这种比例并不困难：(1)
  获得领导支持；(2) 告知用户组织对 CRS 的支持；(3) 传达 CRS 的价值；(4) 每年仅进行几次 CRS；(5) 向用户传达 CRS 及其结果；以及
  (6) 建立促进沟通、透明度和参与的文化。


  ### 问：我应该花多久时间追踪响应，或者一直要求用户完成 CRS？


  ### 回：

  良好的做法是在首次收集响应的一周后，向所有尚未响应 CRS 的用户发送至少两次提醒。如果你在周一部署渗透测试，并在周五发送 CRS，那么应该在下下周二发送一次提醒，然后在周五再发送一次。提醒应只发送给尚未响应的用户。根据我的经验，如果提醒来自组织的内部领导层，在获取参与度方面会有效得多。


  ### 问：我应该将评估结果传达给终端用户吗？


  ### 回：

  大多数 IT 经理很少向用户告知其个人的测试结果。在目前的意识培训方案中，IT 人员往往只与那些测试失败并需要补救培训的人交流。CRS 是一个从用户那里获取信息的工具，其设计足够简单，以便分享信息。与每个用户分享结果也是必要的，以鼓励他们未来参与
  CRS 的应用。正如第 9 章介绍的一个案例研究所所示的，CRS 的开放式回答可以提供丰富的见解，并能提供更容易被用户接受的最佳实践，因为这些见解来自其他用户。这一切都始于
  CRS 结果的传达。传达 CRS 结果还有助于用户反思他们在线思想和行为的内在风险，从而随着时间的推移采取更加谨慎的。


  ### 问：我可以在哪里找到渗透测试的示例，我应该在网上下载它们吗？


  ### 回：

  你可以创建自己的，或者复用在网上找到的，但通用原则是确保它们符合 V 三元组（V-Triad）的最低要求。无论你如何开发测试，都必须确保使用 CRS 评估其基准价值。这确保了测试的整体适用性。你还可以创建多个渗透测试并同时评估所有测试。这有助于开发难度逐渐递增的测试，也能确保专家子集中的用户不知道哪些示例将用于最终的渗透测试。这样，他们就不会告诉其他用户即将进行什么测试。


  ### 问：我可以复用已经部署过的同一个渗透测试吗？


  ### 回：

  复用相同的攻击有两种方法。一种是在同一次测试周期内复用。这意味着在周一部署相同的测试，然后在周五再次部署。我过去做过这种尝试，并发现有些人会多次点击同一种攻击——这种问题在单周期的渗透测试中是捕捉到的。另一种复用测试的方法是在几个月后进行相同的攻击。


  ### 问：我应该进行多少次评估，它们之间应该隔多久？


  ### 回：

  调查应该每隔几个月进行一次，特别是如果它们之间有干预措施。这样，数据就可以捕捉到收益或损失。大多数组织应该每年重复三次方法——即每季度一次——以捕捉不断变化的常规习惯。


  ### 问：我每年应该进行多少次渗透测试，它们之间应该隔多久？


  ### 回：

  虽然有些组织全年都会进行测试，但次数过多的实际上会降低测试的质量和准确性。相反，重点应该放在进行更少但质量更好的测试。这可以通过每季度部署一次测试来实现，每次都增加难度。


  ### 问：有哪些方法可以确保响应质量？


  ### 回：

  确保调查卷上的说明清晰。必须要求受访者诚实作答，并提供完整的句子解释他们为什么怀疑或不怀疑该攻击。预先获得支持会有帮助。这可以通过传达 CRS 的价值并且不给予惩罚来实现。


  ### 问：如果测试难度增加了，我应该在分析中对此进行调整吗？考虑到 CRS 使用的闭式 0–10 分量表是分类衡量，我该如何做呢？


  ### 回：

  你不需要这样做，因为即使测试难度增加了，基准调查已经捕捉到了这一点。此外，请记住，虽然 CRS 中的 0–10 响应量表是分类衡量，但我们正在利用离差分来建立阈值。这些是比例级衡量——意味着它们可以接受各种统计操作。


  ### 问：我该如何防止社会偏见和结果的污染？


  ### 回：

  如果担心提供基准的用户子集可能会无意中泄露测试，一种隐藏它的方法是开发许多渗透测试，但只部署其中一个。另一方面，如果你认为用户不太可能诚实回答，请确保你将 CRS
  数据与其他行为数据（例如邮件打开率到点击率）进行对比，以交叉检查他们的响应。此外，无法获得诚实的响应是一个信号，表明组织内的用户可能并不信任 IT 部门。






  *   **A**: 你的角色是一名医生，致力于理解用户并为他们制定有效的解决方案。你的角色还是变革者，负责提出对终端用户有效的解决方案，并通过通过有效实施这些解决方案帮助他们在工作中取得成功。`CRS`
  允许你完成所有这一切。它提供了获取用户反馈的工具包、诊断的框架、用于促进问责的量化数据，并最终作为帮助用户实现网络安全的解决方案源头。它还允许你制定解决方案并跟踪它们的成功情况。


  *   **Q**: 一个良好的 `NRS` 意味着我实现了网络韧性吗？


  *   **A**: 不完全是。如果钓鱼攻击是你组织安全的唯一威胁，那么你确实实现了针对该威胁的韧性，但网络攻击针对的是其他用户弱点。用户的行为会产生许多漏洞，其中任何一个都可能被社会工程工程师所利用。为了挫败这些攻击，用户必须具备良好的网络卫生。但良好的网络卫生究竟包含什么？组织如何评估用户需要什么以及已经拥有什么？这些将在第
  8 章中讨论。


