- '# 最弱环节：如何诊断、检测并防御用户免受钓鱼攻击


















  d_r0


  # 致谢


  这本书是一段历程的结晶，这段程始于十多年前我机构遭受的一次针对性钓鱼攻击。在当时，这是一种新的攻击形式，与常见的尼日利亚式钓鱼邮件不同。攻击发生时，我正在研究技术使用的心理学，并测试不同的信息框架方式以说服用户优化地使用他们的设备。正是这种偶然的时机让我意识到了这种新攻击向量的潜力，并开启了我对用户钓鱼攻击风险的整体研究，并最终促成了这本书。


  随后的研究历程经历了多年的尝试与失败。在此期间许多人给予了帮助。其中包括许多参与我研究的学生。有些人为了获得学分而工作，有些人与我共同合著论文，还有人作为受试者自愿提供他们的数据。没有他们的贡献，这本书是不可能实现的。一些机构和组织也提供了宝贵的支持。美国国家科学基金会提供了部分初始资金。其他组织允许我在他们的员工身上测试我的方法。他们提供了数据以及对他们所面临挑战的见解，这指导了网络风险评估方法的发展。我感谢他们每一个人。


  还有许多其他人。最引人注目的是哈佛肯尼迪学院的布鲁斯·施奈尔（Bruce Schneier），他在艰辛的写书过程中启发并指导了我；还有我曾在哈佛大学出版社的前任编辑杰夫·迪恩（Jeff
  Dean），他是最早看出这本书潜力的人之一。我永远感谢他们。感谢麻省理工出版社整个编辑团队，他们站出来并引导书籍完成了出版过程。其他人还包括曾任新加坡内政部的刘森森（Loo
  Seng Neo，以及 Majeed Khader 博士领导的行为科学研究团队），以及英国国防部的西蒙·帕维特（Simon Pavitt），他们帮助完善了网络卫生清单。他们与美国、英国、欧洲和澳大利亚的安全及执法专业人士社区共同塑造了这本书，我感谢他们所有人。


  我最后、最深的谢意给我的家人。我的妻子莱塞尔（Leslie）以及我的孩子们 Vera 和 Dean，耐心地忍受了我多年的研究和写作。没有了他们的支持，这本书就不会诞生。谢谢你们！


  # 引言


  2014 年 11 月 24 日，周一。登录电脑的员工看到的是一个被锁定的屏幕，屏幕上闪烁着一个威胁性的图像：一个长着长触角的红色骷髅，上面写着“被 `GOP`
  劫持”。伴随的是枪击声、一段措辞拙劣的暗示所有内部数据被盗的警告，以及一个 16 小时的配合期限。这是一场人质事件的开始——一个将永远改写网络规则的事件。


  遭受围困的公司是索尼影业娱乐（SPE）。当忙碌的 SPE 员工重启电脑时，恶意软件不断寻找新的宿主机，从一台电脑向另一台电脑跳跃，穿过网络然后进入服务器。在一个小时内，攻击就感染了洛杉矶的
  SPE 电脑，然后是纽约，很快蔓延到整个大陆。在几小时后，所有的数字内容——文件、数据、电子邮件、消息、脚本、分镜脚本都丢失了。


  为《财富》杂志撰稿的 Peter Elkind 详细描述了破坏规模：“它删除了公司 6797 台个人电脑中的 3262 台以及 1555 台服务器中的 837
  台存储的所有内容。为了确保没有任何东西可以恢复，攻击者甚至额外加了一点‘毒’：一种特殊的删除算法，以七种不同的方式覆盖数据。完成后，代码限制了每台电脑的启动软件，使其处于脑死状态。”


  在接下来的几周里，黑客在公开的文件共享中心倾倒了一批机密文件。这些包括 SPE 领导团队之间的电子邮件、47,000 名员工的工资和社安号、各种演职职人员的护照和签证、尚未上映电影的未完成和完成脚本，甚至关于
  SPE 供应商的信息，例如其会计事务所德勤（Deloitte）30,000 多名员工的工资数据。总之，黑客窃取并发布了超过 100 TB 的数据。


  到 12 月中，联邦调查局（FBI）正式将此次入侵事件归因于朝鲜。系统清理和恢复的总成本将是惊人的 4500 万美元。这还不包括开除 SPE 制片主任艾米·帕斯卡（Amy
  Pascal）及其他高管的成本；泄漏电影和脚本带来的收入损失；来自员工和供应商的集体诉讼；以及由于大量机密邮件带来的数月尴尬——这些邮件不仅揭露了电影行业的内部情况，还揭露了
  SPE 高管对巴拉克·奥巴马总统以及各种好莱坞影星的反感。





  但当媒体正忙于报道那些艳俗的八闻时，有一个关键问题无人问及：像朝鲜这样的国家是如何实现如此重大的网络入侵的？为了方便理解，朝鲜全部 2400 万人口只能访问约
  28 个网站，而其总人口的 0.3%（即 7200 人）拥有不受限制的网络访问权限。相比之下，`SPE` 的母公司 `Sony Group` 在全球雇了 11.4
  万员工，所有人都享有不受限制的网络访问权限。单是 `SPE` 高达 80 亿美元的收入就超过了朝鲜的进出口总额。那么，这个技术落后的国家是如何将全球最顶尖的科技公司之一推回前计算机时代，让员工们现在不得不诉诸使用便利贴和公告板通信的？答案是鱼叉式网络钓鱼——这是一种病毒性的、基于互联网的社会工程攻击，我已经追踪、研究并警告了它近十年。


  鱼叉式网络钓鱼利用老式的信任骗术，让毫无防备的用户在虚假网站上提供其在线账户密码，或点击可以直接访问其设备的恶意超链接和附件。攻击通过电子邮件发送，但也可以同样容易通过社交媒体、短信、USB
  存储设备、Wi-Fi 网络或蓝牙连接发送。


  利用这些权限，黑客可以潜伏在受害者的计算机中，在组织的计算机网络中虚拟移动，并安装破坏性程序来窃取数据或阻止他人访问。基本的编程技能和一个用于部署的免费电子邮件账户就能制作出此类攻击之一；而且，由于攻击者承担了系统授权用户的虚拟身份，一旦他们进入系统，没有任何办法识别并拦截他们。


  `Sony` 与世界上几乎其他每一家公司一样，为所有员工提供了电子邮件和互联网访问权限。这使得鱼叉式网络钓鱼成为像朝鲜这样技术发展不发达的对手的完美攻击向量。他们需要一个免费的电子邮件账户，需要一个可以隐藏在超链接中的恶意软件。一个出站的互联网连接就能获取这些。利用它，他们可以制作攻击并发送给
  `Sony` 的每一个人——他们可以反复这样做。启动入侵只需要 `SPE` 成千上万名邮件用户中的某一个目标用户点击恶意软件即可。邮件用户是入侵的触纽——他们是最薄弱的环。。


  `SPE` 攻击是一个游戏规则改变者，因为它展示了鱼叉式网络钓鱼如何轻易误用用户并给组织造成破坏。得益于电子邮件的无处不在，任何组织网络基础设施内部这种用于利用的虚拟表面是巨大且易于的。既然发起
  `SPE` 攻击的黑客暴露了这种潜力，各地的黑客开始模仿他们。各处的薄弱环节正成为目标，不再有任何组织是安全的。


  ## 无处不在鱼叉式网络钓鱼攻击


  在 `SPE` 攻击发生不久后，即 2015 年 2 月，另一个重大入侵的消息传出。黑客盗取了美国最大的医疗保险供应商 `Anthem, Inc.` 8000
  万客户的个人健康数据。紧随其后的是 6 月份，媒体报道了一场规模更大的入侵。这一次，中国军方黑客从人事管理局（`OPM`）外泄了 2150 万份用户记录——该机构负责管理人力资源并对所有美国政府员工进行安全审查。许多人认为这是美国现代史上最敏感联邦政府数据的大规模入侵事件。


  2015 年 7 月，传针对成人约会网站 `Ashley Madison` 的攻击消息。这一次，一个自称 `The Impact Team` 的黑客组从该网站服务器上取了
  25 GB 数据，其中包括用户的个人细节。由于电子邮件的普及，任何组织网络基础设施内部这种可供利用的虚拟表面区域都是巨大的且易于访问的。黑客利用这种方式可以轻易劫持用户。然而，该网站所有者
  `Avid Life Media` 对持了 3700 万用户的人质，要求其关闭 `Ashley Madison` 及其姐妹网站 `Established Men`。


  正如 `Sony` 的事件一样，其影响导致 `ALM` 许多人员离职，引发了巨额的集体诉讼以及 1000 万美元的清理费用。遗憾的是，几名用户因此自杀。这种攻击夺了生命。攻击的消息很快从世界各地涌入。到
  2017 年，鱼叉式网络钓鱼已成为全球网络安全的主要威胁，造成了 93% 的入侵。它被用于从收集信息到安装恶意软件、后门以及外取数据的各种活动，并被活动黑客、不满员工、恐怖组织、有组织犯罪网络以及国家的支持间谍集团（来自俄罗斯、中国、伊朗和其他国家）。


  在 `SPE` 攻击后的几年里，鱼叉式网络钓鱼针对了世界上每一个拥有电子邮件账户的人。许多人已经成为受害者——大多数人还没有意识到这一点。


  对于组织来说，情况更加严峻。许多组织不断受到攻击，攻击的猛烈程度令人震惊。在我参加的一次会议上，美国参议院侍长报告称，2017 年拦截了 2300 万封邮件；众议院报告拦截了更多。那一年，国防部每天收到
  3600 万封带有恶意软件的邮件，每天 130 亿封。停止这种洪流的责任落在信息技术（`IT`）经理身上——由他们承担。


  ## “人的问题”


  全球 `IT` 经理采取了两种方法。第一种方法根于工程传统，侧重于利用技术来阻止攻击。这里的目标是减少到达鱼叉式网络钓鱼邮件的数量，如果邮件确实到达了用户，则限制损害。


  人们使用的许多设备上电子邮件交换的总量限制了这种方法。`IT` 很难读取所有的在线通信、监控所有的设备，并在不侵犯隐私的情况下有效限制所有的鱼叉式网络钓鱼邮件到达用户。另一个限制来自于计算创新的速度，其变化之快，以至于主动发现每项新技术的漏洞——更不用说紧紧关闭所有虚拟舱门以防止所有入侵——是不可能的。


  这种领悟导致了第二种方法：“硬化”人。组织通过不同的意识培训方法来硬化员工，或使他们对鱼叉式网络钓鱼更有抵抗力，这些方法旨在教育用户并提高他们检测邮件中欺骗线索的能力。


  大多数网络安全培训有两种形式。一种是教学式培训，涉及在在线或教室环境中进行的深入、专注的教育课程。大多数此类培训在培训结束后使用考试或测试来证明终端用户的就绪状态。第二种培训形式是让员工接受模拟鱼叉式网络钓鱼攻击（称为
  `pen tests`），随后在攻击中嵌入一个简短的教育模块。在大多数此类“嵌入式培训计划”中，教育模块只提供失败测试的用户，揭示他们在邮件中错过的欺骗线索。这里的假设是，被欺骗会让用户震惊，并让他们更容易接受随后的培训。





  如今，在受黑客攻击的恐惧驱动下，几乎每一个美国以及全球范围内越来越多的组织——都部署了某种或两种形式的培训。对于许多联邦和州政府员工以及在特定行业工作的人来说，完成网络安全培训是强制性的，因此组织不仅在实际费用上投入了大量资源，在培训时间上也花费了巨大精力。


  然而，关于培训效果的客观数据描绘了一幅阴暗的图景，显示培训要么无效，要么仅对用户行为产生短期影响。在学术研究实验中，用户在接受培训后的几天内、有时仅几小时后，就会恢复到原有的邮件使用模式，并受害于他们受过训练能够的同样的钓鱼攻击。


  其他证据源于我与组织领导者的私下交流，他们向我表达了对培训对用户效力有限的沮丧。也许最好的证据来自于关于科技公司不断泄露事件的新闻报道（例如 2013 年的 Adobe、2017
  年的德勤、2018 年的金融服务信息共享与分析中心以及从 2019 年起每年的微软），在这里的用户不仅接受了高强度培训，而且在技术上也非常精通。因此，即使是那些人们向其寻求鱼叉式钓鱼建议的公司的用户也会受其害。


  面对此类数据，组织 IT 领导者的通常反应是对手用户进行更多培训。每当培训失败，组织就会诉诸更多的培训。这是因为 IT 部门的每个人都相信培训是有效的。大多数人认为培训非常有效，以至于他们认为惩罚培训测试的用户的。美国国家安全局（NSA）前局长迈克尔·罗杰斯（Michael
  Rogers）曾著名地表示，需要对未能通过鱼叉式钓鱼测试的用户进行军事法。虽然大多数组织没有采取这一步，但许多组织使用了从轻微警告到对失败的用户进行批评、孤立或羞辱不等的惩罚。这种羞辱和指责的策略通常会导致对用户施加更多的培训，如果这些手段仍然不能提高员工对鱼叉式钓鱼的意识——这种情况发生的频率比承认的要高——IT
  经理通常会归咎于用户“不可教”。他们称之为“人为问题”，这是一个涵盖用户所有可能导致组织安全泄露行为的万能术语。


  ### 但情况变得更糟了


  如今的培训不仅被盲目地规定用于解决安全领域的“人为问题”，IT 经理还将其作为衡量组织整体网络就绪能力的指标。这种压力来自监管机构和政策制定者，还来自网络安全保险公司，他们一直在要求提供定量网络风险指标以供精算计算。为了刺激更多销售，许多培训公司也倡导这种方法。结果，组织越来越多地使用用户培训数据——教学式培训的通过或失败，或嵌入式钓鱼渗透测试的失败率——作为其组织内用户网络风险的指标。这在至少五个重要方面损害了这种本就有缺陷的方法。


  1. **结果 vs. 原因**：首先，目前将渗透测试的成功或失败率作为网络风险诊断工具的范式，将结果与原因混淆了一。。失败钓鱼测试是一个结果，与发生汽车事故没有区别。正如汽车事故可能因为驾驶员控制范围内的因素（例如速度、专注程度、车辆质量）和外部因素（例如路标质量、其他驾驶员）而发生一样，失败鱼叉式钓鱼测试也仅仅是由许多因素导致的结果。


  2. **惩罚性方法**：其次，如果我们的目标是减少一群易事故个体的事故率，我们最不会做的事情就是通过让他们发生事故并对之进行惩罚来试图教导他们。但这正是所有许多钓鱼测试所做的：他们寻找巧妙的方法让用户在测试失败，然后对失败给予惩罚性待遇。如果这是我们对驾驶教育的方法，它会导致更多偏执的驾驶员，而不是更安全的驾驶员。


  3. **个体差异**：第三，如果我们的目标是提高易事故驾驶员的驾驶水平，我们直接的假设不会是他们都只是简单地缺乏安全驾驶意识。毕竟，我们小组中的某些人可能因为视力不好而发生事故，另一些可能因为体内某种物质的影响导致驾驶异常，还有一些人可能因为开车时说话或发短信而分心。简单地传授更严谨的知识对于那些知识或意识并非其驾驶糟糕原因的人来说是没有帮助的。同样，通过使用相同的方法对每个人反复进行意识培训，如果钓鱼易感性的根本原因因人而异，这对保护组织几乎意义不大。


  4. **复杂环境**：第四，如果我们的目标是让用户能够在最可预测的情况下在一段道路上安全地驾驶一辆汽车，那么也许让他们遵守同一组有限指令就是我们需要的全部。但驾驶要复杂得多，需要根据汽车类型、交通、路面和天气进行调整。汽车安全需要一些合规性，例如始终系安全带，但还需要很大程度的“内化”——这是一个社会科学术语，意味着将信息融入个人的意识，并将其作为指导决策的原则。它还需要良好的驾驶习惯，例如经常检查后视镜、在汇入时向后看，以及在转弯前发信号。灌输所有这些需要的不仅仅是培训。它需要传授知识、激发动力和培养良好的驾驶习惯。


  5. **信息高速公路**：与道路相比，信息高速公路更广阔、更无结构化。网络攻击不仅更频繁，而且更不可预测，因为它们随着新软件发生变异。某些漏洞（被称为“零日漏洞”）在黑客利用它们之前甚至是未知的。然而，我们对网络安全的方法并不发达。我们在单一假设——即他们缺乏意识的情况下培训每个人。每个人都获得相同的意识知识，无论其与其需求是否相关或契合。然后，每个人都接受了更多的测试——当许多用户不可避免地失败时，这会导致更多同样的培训。在这一过程中，没有任何地方衡量过用户需要什么、缺乏什么或他们为何失败。如果我们在汽车安全方面未能考虑驾驶员的视力问题，而是专注于反复教他们如何阅读路标，结果将同样糟糕。


  **最后**，汽车安全的目标不仅是让某一个驾驶员安全，而是让整个系统变得安全。实现这一点的很大动力之一一直是汽车保险系统，它对安全驾驶进行奖励和惩罚。但这个系统并不是任意的。有保险理赔和执法人员调查事故原因、访谈驾驶员并获取反馈。系统允许获取这些信息，创造了问责制。它提供了反馈，允许用户降低保费，让他们拥有自主权。这推动了对具有更多安全汽车的需求，推动了制造商的创新，并让用户在驾驶时更加小心——这些因素共同使汽车安全常态而非例外。






  我们现行的网络安全用户培训方案中缺乏一种类似的方法。虽然我们使用不同的网络钓鱼攻击模拟测试，并对通过或失败的用户进行评分，但我们惩罚那些失败的人（通常是增加额外的培训），而忽略那些通过的人。如今，保险公司会为组织的网络损失提供赔偿，但它们也同样依赖于组织
  IT 部门提供的培训数据来决定保费。


  问题在于，没有人真正知道，也不在乎用户为什么通过或失败了测试——既不是设计测试的 IT 人员，甚至用户本人（因为他们既没有被询问过表现，也不理解自己的表现）。因此，尚不清楚测试本身是否存在缺陷、通过或失败是否只是偶然，还是结果源于用户某些有意识或无意识的思想或习惯性行为。正因为如此，很难信任此类培训的评分，这些评分对于建立问责制或让用户对自己的安全态势产生自主感作用有限。


  构建网络安全文化需要我们让用户对安全负责——包括他们自己以及整个组织的安全。这意味着不仅仅是简单的对渗透测试失败进行评分。它意味着要理解导致用户失败或成功的思想和行为、他们再次采取此类行为的概率，以及其他人产生类似结果的概率。它意味着既要接收关于测试的反馈，也要接收关于用户的反馈。它还意味着给用户反馈，以及改进其安全态势的路线图。如果坚持执行，这有助于建立用户对评分过程的信任，建立问责制，并培养网络安全文化。这样做不仅能让一个用户安全，还能让每个人安全，从组织中的其他成员到该用户将这些学习带给的人——供应商、客户，甚至是他们的家庭成员。这样，网络安全才能从一种由
  IT 经理强制的指令转变为一种文化和社会现实。


  实现这一目标需要一种能够准确捕捉导致用户风险的思想、行为和习惯的方法。这种方法需要独立于操作系统、他们使用的其他软件以及他们正在的工作。通过这种方式，我们可以评估并跟踪任何人、任何地方的网络风险，并为他们应对当前、潜在甚至零日攻击做好准备。该方法还需要一个所有用户都易于使用且易于理解的风险分类系统。这样，我们就可以告诉他们他们所构的网络风险，并帮助他们降低这些风险。


  对于组织而言，了解用户风险的原因可以带来更有效的政策。了解为什么他们某些用户没有面临风险（这意味着他们做对了某些事——这是我们目前所有方法中都被忽略的因素），可以产生新颖的可以学习的解决方案或干预措施，并在此基础上构建知识。由于此类解决方案是有机地产生于用户群体内部，它们能够以任何外部开发的供应商培训方法都无法实现的方式，解决组织内部的用户风险问题。这从上确保了政策和安全态势与用户执行工作相关任务的方式保持一致。它进一步确保了用户不会为阻碍工作的政策寻找绕过方法，因此
  IT 人员可以减少监管工作。组织随后可以重新分配这些安全资源，并以极小的精力和成本实现网络韧性。


  实施这种风险评估方法需要一种可靠、透明且与目前正在的工作兼容的方法。这样，任何组织（无论是在华尔街还是普通商业街）都可以使用它。这种风险分类系统和评分方法正是本书所提供的。


  ## 识别最薄弱环节的诊断工具


  进行一项符合上述所有标准的网络风险评估可能看起来很艰巨，但并非如此。在十年的时间里，我对技术用户的研究揭示了为什么有些人会成为鱼叉式钓鱼的受害者，而另一些则不会。它识别了衡量这些原因的指标，并开发了衡量这些原因的方法。


  我的研究对不同用户使用了模拟的社会工程攻击，并弄清楚了人们的*如何*以及*什么样的*思想让他们变得容易受到攻击或具有韧性。它开发了一种可靠捕捉这些思想和行为的方法。


  这项工作导致了一个重要的发现：导致欺骗或被发现的用户级因素寥寥无几。通过仅衡量这些因素，任何组织都可以确定他们的用户中谁对企业构成了风险并理解原因。


  但这种方法面临一个重要的局限性，因为它需要 40 个或更多调查问题。问题也很复杂，有些术语只有英语流的用户才能理解。许多组织环境中的员工不能或不愿回答问题。


  我的重点转向开发一种实用的、全球通用的标准。我们需要一种高效的衡量方法，让任何组织、任何地方的任何人都能几秒钟内轻松理解并回答。通过另一系列研究，，这一探索最终确定了两个简单的问题，其回答同样有效。这两个问题以及提问它们的方法就是我所说的`网络风险调查
  (CRS)`。


  `CRS` 紧跟在网络钓鱼渗透测试之后，许多组织已经作为培训协议的一部分在进行测试。但与目前正在进行的测试不同，它使用一个定义的框架来编写和部署电子邮件。我在
  2017 年开发了这种名为 `V-Triad` 的框架，并在 Black Hat USA 上进行了演示。（完整演示文可在 YouTube 上查看。）^(11)
  2020 年，美国国家标准与技术研究院 (`NIST`) 的研究人员使用了我使用的方法，并对网络钓鱼渗透测试得类似的结论——独立地强调了 `V-Triad` 的有效性。^(12)


  但 `CRS` 的作用不仅仅是渗透测试质量评分。它有助于设计最佳的网络钓鱼渗透测试、收集关于它的反馈、将其部署给用户并捕捉用户对其的敏感性。这些衡量有助于理解现在面临风险的人以及未来可能面临风险的人。这使得
  IT 经理能够确定每个用户相对于其他人构成了多少风险，并定位用户中的薄弱环节。


  `CRS` 还有另一个框架的支持：`怀疑、认知、自动性模型 (SCAM)`。该模型由我的研究团队于 2016 年开发，全面解释了导致社会工程欺骗或被发现的用户思想和行为。该模型建立在多年对接受各种类型模拟社会工程攻击的用户进行测试的基础上。


  `SCAM` 为 `CRS` 提供了解释框架。通过使用它指导分析，IT 经理可以超越仅仅定位薄弱环节阶段；他们现在可以解释为什么这些环节是薄弱的。他们还可以识别低风险用户，并理解减轻他们风险的具体思想和行为。他们可以使用这些信息来制定特别适用于该组织且受用户阻力较小的最佳实践。


  关于用户风险原因的解释可以与用户进行沟通。这可以建立一种对安全问题的共同理解、解决方案的内化以及一种网络安全文化。最后，`CRS` 为整个组织提供了一个`净韧性评分
  (NRS)`。该分作为衡量组织应对未来社会工程攻击准备情况的指标，可用于比较组织小组的表现，并跟踪其韧性随时间推移的改进。






  因此，CRS 是一种应对社会工程学威胁的综合方法。IT 管理人员不再需要担心其以用户为中心的方法是否充分，也不再需要猜测组织中哪一个用户对组织的网络安全构成了最大的风险。他们可以使用
  `CRS` 及其相关指标来识别高风险用户、建立问责机制、根据这些结果制定政策和保护措施，并培养网络安全文化。通过使用书中的信息，IT 管理人员可以解决社会工程方面的人员问题。


  ## 本书的目标


  本书为读者提供了必要的的知识，使其能够通过使用网络风险调查（Cyber Risk Survey）方法来检测、诊断和防御网络攻击。书中详细说明了实施该方法的步骤，从
  IT 部门应如何进行理想的钓鱼渗透测试，到他们应如何管理 `CRS` 并生成净韧性得分（net resilience score）。


  生成有效的 `NRS` 要求管理者理解社会和认知科学、实证研究以及分析行为数据的方法。它还需要理解社会工程的基础知识和渗透测试开发。本书涵盖了所有这些主题。它提供了认知和行为科学理论的实用知识，解释了人们如何以及为何通过社会工程被欺骗。书中介绍了
  `CRS` 问卷、用于分析回答的 `SCAM` 框架，以及将用户的渗透测试响应转换为 `NRS` 的机制。它还涵盖了 `V-Triad`，并教授如何设计理想的钓鱼渗透测试并评估其质量。


  本书进一步探讨了网络卫生（cyber hygiene）——这是一个在安全领域广泛使用但未被很好理解的语——阐明了网络健康的含义、包含的内容以及不包含的内容。它介绍了网络卫生清单（`CHI`），这是一个用于量化用户网络卫生的科学工具。书中提供了该清单，并讨论了
  `CHI` 和 `CRS` 如何协作来量化用户风险。最后，书中介绍了不同组织如何使用 `CRS` 和 `CHI` 实现网络韧性的案例研究。简而言之，本书为读者提供了解决社会工程学问题的所有工具。


  ## 我为什么写写这本书


  我写这本书最主要的驱动力是挫败感。你看，2014 年 11 月针对 `SPE` 的勒索软件攻击不仅是网络安全史上的一个分水岭，也标志着我职业生涯的转折点。在此之前，我是一名社会行为科学家，研究用户以及社会工程攻击如何欺骗他们。这是在多年探索用户心理以及驱动他们采用和使用技术之后的结果。


  我之所以被社会工程学吸引，是因为 2009 年针对我大学电子邮件用户的一系列鱼叉式钓鱼攻击（spear phishing）。攻击者要求用户更新密码，否则将面临失去电子邮件访问权限的风险——这在今天很常见，但在那时并不常见。这与典型的措辞拙劣的“尼日利亚王子”邮件不同。攻击者关注的是核心问题：相关的主题行、大胆的警告、简短的截止日期以及一个用于更改密码的高亮超链接。


  主题行是大多数人首先看到的内容；其相关性吸引了他们。警告和截止日期完成了剩下的工作。语法和拼写错误确实存在，但丢失电子邮件访问权限的威胁导致所有人忽略了这些缺陷并被诱套。他们急忙地点击位于中心的蓝色超链接，该链接将他们带到另一个看起来官方的网站并捕获了他们的密码。攻击者设计这封邮件是为了利用人们在网络上的思维运作方式——它是由一个了解用户心理以及如何利用这种心理的人设计的。


  并没有人真正注意到或在意这些：不是用户（其中大多数人都顺从了），甚至不是 IT 部门的人，他们只是要求用户更改密码——当然，是通过另一封邮件——然后继续工作。问题在于，正在使用导致问题产生的相同方法来解决它，这种“解决方案”许多组织（如零售连锁
  `Target` 和信用监控机构 `Equifax`）在多年后实施了它，并导致了可怕的后果。


  回到 2009 年，我正在对用户测试不同的基于内容的说服方法，寻找方法让他们优化地使用电子邮件、社交媒体和移动设备，以发挥其最大的潜力。鱼叉式钓鱼攻击似乎有类似的关注点，但意图更为阴暗。他们也在使用内容和其他说服技术来让在线用户做某些事情——打开、点击、启用、接受——只是他们的目标是收买用户并滥用访问权限。


  我从调查受害者开始。我想了解他们的思考方式、所采取的行动以及这些行动产生的影响。攻击的压倒性成功很快显而易见。不仅大多数用户顺从了，而且根本没有人意识到自己被欺骗了。许多人在这种毫无防备的情况下，使用不同的设备（例如
  `USB 盘`、短信应用）来诱导使用，并伪造或模仿不同的网页来欺骗用户。在获得研究人类受体的必要批准后，我实验性地重新创建了许多此类攻击。目标不仅是检查每次攻击是如何成功的，还为了识别导致欺骗的特定方面。


  这些测试最初使用了美国和国外的学生，然后是自愿组织的员工。随着每项研究，我改进了我的方法，迭代地精炼了测量技术，并更好地理解了问题。每项研究都让我更好地理解黑客在做什么，他们的攻击是如何演变的，以及组织对这种新形式的攻击到底有多脆弱。


  到 2014 年，我是少数几个从用户欺骗的角度广泛研究了鱼叉式钓鱼现象的研究人员之一。因此，当当年 11 月发生臭名昭彰的 `Sony` 攻击时，我不仅知道朝鲜人做了什么，而且确切他们是如何实现的。我还知道即将发生什么——因为现在那个谚语中的魔鬼已经破出了瓶子。


  但媒体完全忽略了这一点。他们关注的是猎奇、好莱坞内部八卦：关注邮件说了什么，而不是攻击代表了什么。我想引起人们对真正重要问题的关注——鱼叉式钓鱼攻击、它为何成功，以及即将来临的更多类似攻击的威胁。


  为此，2014 年 12 月，我写了我的第一篇 CNN 评论文章，讨论了朝鲜人如何通过破坏用户来实现 `SPE` 泄露，以及组织和政策制定者必须做什么来阻止此类攻击。这将是此类攻击中的第一个，因为正如我预期的那样，全世界的黑客开始发起规模更大、胆子更大、后果更严重的攻击。






  因此，我跟进了更多的媒体报道。过去我仅仅关注于应对研究社区，而现在我侧重于直接与网络安全专业人员、技术用户、IT 管理员和政策制定者交流。我成了一名为了公共利益而写作的技术人员。我的目标是引起人们对网络安全中以用户为核心问题的关注，并提供解决方案。我希望通过关注这些问题，让组织和政策制定者能够在问题蔓延并变得不可收拾之前对其重视。


  我是最早倡导“用户网络卫生”（user cyber hygiene）的人之一——这一术语后来在该领域内变得非常常见——也是第一个开发出衡量方法的人。我主张将双因子身份验证作为默认设置，并指出了单点登录和虚假社交媒体资料的危险。我呼吁建立全国性的系统来预警其他网络攻击，要求隐私应用拥有更好的“警告标签”和五星级评分系统，并希望我们关注移动端攻击、物联网（`IoT`）和人工智能的兴起。这些观点曾出现在
  CNN、`Wired` 杂志、《华盛顿邮报》、《Politico》、《美国今日报》、《芝加哥判读报》、《科学美国人》以及其他领先媒体上。


  我成为了人类网络漏洞领域的顶尖专家之一。我曾受邀在国会山的国家科学资助联盟（`C-NSF`）展示我的研究，多次受参议院侍从官在美国参议院和众议院演讲，并在 `Black
  Hat` 等领先的安全会议上发表。我曾在纽约西点的美国陆军网络学院、约翰斯·霍普金斯大学演讲，并向国家安全局（`NSA`）、联邦调查局（`FBI`）、国土安全部（`DHS`）以及白宫科技政策办公室（`OSTP`）的网络安全思想领袖进行介绍。但尽管有了媒体报道、出版物和演讲，社会工程的核心问题依然存在。一切都没有真正改变。攻击持续发生，且变得越来越频繁和严重。


  我所暴露的许多问题被忽视了——在随后的几年里变得更大。例如，在 2016 年美国医院遭受一系列攻击后，我写了关于勒索软件兴起的文章，将其称为“勒索软件之年”。我错了。这不仅是在
  2016 年，从那以后每年都是如此。2021 年，我们目证了一些规模最大的勒索软件劫持案：供应美国东海岸一半汽油的 `Colonial Pipeline`；全球最大的肉类供应商
  `JBS`；以及为全球一千多个中小型企业提供远程监控软件的供应商 `Kaseya`。在 2016 年还仅为几百美元的勒索要求，现在在 `Kaseya` 案例中已高达
  7000 万美元。当时本可以被阻止的问题，现在需要花费数百万美元来清理。


  更令人沮丧的是，我一直提供的解决方案本可以防止其中的许多问题。我曾提出过一种用于评估用户网络风险信念、认知行为模式和习惯的诊断方案；我开发了一种利用这些内容来训练用户的机制；我甚至设计了一个衡量网络卫生的工具，并开发了一套进行网络卫生评估的方法，而所有这些都是公开的。


  大多数安全公司选择忽视这些。他们加倍投入到自己的产品中，这些产品他们已经花费了数百万美元进行开发。安全研究人员则恰恰相反。他们重新包装了我的建议。有些人将“风险信念”重新标记为“过度自信”，另一些人称之为“用户好奇心”，还有人称为“用户缺乏技术效能”。这种现象用马克·吐温的话说最好，那就是给所有新事物起旧名字的习惯。这种习惯在学术界是根深性的，学者的评价标准是原创性，而非实质或价值，因此每位学者都有动力去重新发明、重命名和重构一个问题，而不是去测试或改进现有的问题。此外，他们追求的代价较低。无论是泄露、数据丢失还是其后果，对他们个人或职业都没有影响。


  但对于全球的 IT 管理员和组织来说，这很重要。他们一端受限于供应商，另一端受限于监管机构，贯穿其客户。他们困于无法离开的技术和不断发现这些技术漏洞的攻击者之间。对他们来说，社会工程不是一个产品问题或辩论课题。它是一个清晰且持续的问题——一个威胁到其组织生存的问题。


  正如我之前提到的，对社会科学进程和安全供应商领域的这种挫败感促使我写了这本书。如果你正在阅读这本书，你可能也有许多类似的挫败感。这本书是我基于原则的挫败感的产物，也是对你挫败感的回答。


  ## 这本书是写的？


  如果你致力于阻止社会工程，这本书就是写给你的。如果你是正在制定政策以提高网络韧性的 IT 管理员，是致力于减少组织遭受社会工程攻击风险的安全人员，或者是帮助他们实现这一目标的顾问，那么这本书正是为你为你准备的。如果你为赔付组织损失的保险公司、致力于保护他们的执法机构，以及为支持他们的地区和国家级政策制定者工作，这本书对你也有价值。


  `Cyber Risk Survey`（网络风险调查）方法补充了现有的用户培训方法，并显著改进了现状。`Cyber Hygiene Inventory`（网络卫生清单）提供了量化和跟踪用户与数字安全相关的想法和行为所需的工具包。`CRS`
  和 `CHI` 都非常适合许多已经拥有渗透测试培训流程的组织。


  对于此类组织，这本书提供了理解和量化用户风险的缺失框架。对于尚未建立培训方案的组织，它提供了一个创建方案的框架，包括从零开始开发渗透测试方法所需的信息。


  书的内容对于希望在市场中脱颖而出的顾问和培训机构也具有价值。通过使用这种方法，顾问可以识别风险用户并诊断原因。他们不需要像其他顾问那样仅仅开开更多的用户培训，而是可以帮助组织开发新颖的、基于证据的解决方案。


  这本书对网络安全保险公司也有价值。通过在不同组织中实施 `CRS`，保险公司可以评估整个行业的网络风险。他们不仅仅是审计目前面临社会工程风险的组织。现在他们可以解释为什么客户组织面临风险，并提供改进方法。这有助于保险公司做出更可靠的精算估计，并与所投保组织建立更好的关系。




  最后，本书的内容对于寻求提高网络韧性的国家安全和公共政策制定者来说也具有价值。通过衡量整个区域的网络风险和网络卫生状况，他们可以制定出适用的法律政策。他们可以识别并针对执法和调查资源将其投入到最需要的地区。这比目前那些未能交付预期效果的供应商提供的估算要有效得多。


  考虑到受众的广泛性，本书侧重于提供可操作的知识。它没有了对社会科学理论和各种恶意软件的复杂性进行长篇大论，而是使用了案例研究和短篇描写。书中没有冗长的参考文献和大量的实证数据，而是强调简洁和解释。贯穿始终的目标是引导
  IT 管理人员走向 `CRS` 的实施——以便他们能够在下一次社会工程攻击发生之前，对他们的用户进行诊断、检测和防御。


  # 本书的结构安排


  本书将带你开启一段通往网络韧性的旅程。发现始于第 1 章，概述了社会工程是如何演变成今天今日的。我们将追溯这种欺骗手段的根源——攻击向量——到达意想不到的地方。我们发现它在前殖民时期印度的公路上蔓延。我们将讨论为什么会这样，以及如何通过当时萌芽的犯罪学科学，一位年轻的英国东公司上校最终击败了它。那个时代的教训虽然随时间流逝了，但在今天甚至更具相关性——我们将看到为什么。


  第 2 章考察了基于电子邮件的社会工程学的泛滥。大多数将这种攻击向量的成功归因于电子邮件的易用性和互联网的无处不在，但这些只是近因解释。它们并没有解释为什么其他形式的在线攻击没有取得类似的成功。本章将电子邮件社会工程学流行的根本原因归结为用户数据的供需、互联网认证系统的根本性缺陷、在网上寻找用户的易用性以及
  IT 部门权力的衰减。这些都是短期内不会消失的系统级原因。随后，本章解释了这些因素如何为社会工程工程师提供了便利。


  第 3 章详细介绍了组织为对抗社会工程学所采取的各种方法。它涵盖了不同的技术方法，以及更常见的通过钓鱼渗透测试（或 `pen-test`）来提高安全意识的方法。如果你从事
  IT 工作，你对这些大部分内容都很熟悉，尤其是技术方法。本本书的精神是本章并没有深入探讨每种保护技术，而是更广泛地关注每种方法及其内在的缺陷和优势。本章以对安全意识培训的深入观察以及我们对其有效性的认知作为终结。


  第 4 章提供了缺失的科学框架——这个框架从来应该是对抗社会工程学的起点：理解人们为何会成为其受害者。本章解释了人们在网上是如何思考和行动的，以及攻击中的元素是如何设计用来欺骗他们的。对人们如何思考的解释集中在他们的认知处理风格和对在线风险的信念上。对人们如何行动的解释侧重于反应、无意识的习惯及其前兆。我们将讨论这些因素是如何相互作用的，并解释*为什么*人们会受害。


  第 5 章更进了一步。它提出了怀疑-认知-自动性模型（`SCAM`）框架，并讨论了在线思考和行为模式如何从因果上决定对钓鱼的易感性。本章解释了受害*是如何*发生的。正如咳嗽的深度和强度是潜在人类疾病的标记，本章讨论了
  `SCAM` 中的一个关键症状，它作为用户对钓鱼易感性的标记。该标记作为检测欺骗的一种单一、方便且可量化的标准。


  第 6 章关注网络风险评估的另一个缺失部分：可靠的渗透测试。本章解释了当的渗透测试没有遵循任何理论、指导框架或逻辑。除了试图诱骗人们点击之外，任何测试开发都没有太多的主导原理。由于此，渗透测试的大部分数据是不可比的，且不应被用于诊断风险。本章为这个问题提供了一个解决方案：维瓦拉斯三元组（`V-Triad`）——一个基于实证得出的框架，有助于设计可靠的渗透测试。你还将接触网络风险调查（`CRS`）。


  第 7 章整合了前面的章节。它展示了 IT 部门如何通过实施 `CRS` 来进行全面的风险评估。它详细介绍了从假设到创建合适的测试、部署、评估结果的步骤。章节解释了如何使用测试数据生成整体韧性评分。


  第 8 章探讨了网络卫生——这在政策制定和 IT 领域通常被视为减少用户风险的解决方案。但网络卫生是一个缺乏指导原则的想法。关于它包含什么、不包含什么，以及我们何时知道它足够了，尚没有明确的定义。我们将讨论这一点。随后，本章深入探讨组织设计理论，并提出了有助于定义网络卫生并塑造我们预期的五个指导原则。我们将讨论一种衡量工具——25
  问题的网络卫生清单（`CHI`），它可以追踪卫生状况。


  第 9 章提供了风险评估过程实施的真实案例。它展示了不同规模、面临各种挑战的组织如何实施 `CRS` 和 `CHI` 来评估社会工程学风险、建立安全文化并实现针对网络攻击的用户韧性。本章提供的工作案例阐明了组织如何处理用户风险并实现韧性。在本章结束时，你将认识道路面前的可能性。


  本书在第 10 章结束，展望未来。它审视了不断变化的 IT 格局，并讨论了我们目前的用户安全方法可能会使企业安全变得糟糕。我们将看到有利于黑客的优势将如何进一步倾斜。随后我们将评估
  `CRS` 和 `CHI` 如何帮助缓解这种不平衡并减少这些优势。本书的旅程结束于讨论：实施书中提倡的内容将如何使 IT 的角色从一个冲出来灭火的响应者转变为变革的代理人。


  这本书将改变你诊断、检测和防御用户的方式。它将彻底改变你对抗社会工程学的方式。让我们开始这段旅程。


