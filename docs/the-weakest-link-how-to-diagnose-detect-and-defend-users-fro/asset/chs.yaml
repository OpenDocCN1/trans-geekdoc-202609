  ## 为什么人们会中当？


  渗透测试的结果是，总体有 21% 的受访者中了网络钓鱼攻击。这与 Marks 习惯看到的低于 1% 的比例有着巨大的差异。事实上，甚至有一小部分用户反复点击了网络钓鱼邮件。


  我预料到了这一点。这是我在实施过这种方法的其他组织中经历过的。但有一件事让 Marks 感到困扰。总有一些用户——是不同的几个人——未能通过测试。那 1% 太太多了。他想要零——一个一直无法触及的数字。他听说了我的方法并联系了我。给我的任务很简单：将这个数字降为零，否则告诉我们为什么做不到。我同意了，唯一的条件是由我而不是他的团队来编写内容。


  我编写了一封用户经常从内部云共享门户发送和接收的邮件。这封邮件并非系统的精确复制。相反，它仅包含了布局和颜色，甚至还有拼写和语法错误。通过云链接共享的文件（用户被要求打开）是一个大型
  PDF 文档，上面显眼显示着 Adobe PDF 图标。


  渗透测试是在三个连续天内发送的，每封邮件都经过跟踪，以查看谁打开了它、何时打开、如何打开（即什么设备、浏览器或 IP 地址）、频率如何以及打开后做了什么。攻击两周后，所有用户都被要求回答几个调查问题。


  渗透测试的结果是，总体有 21% 的受访者中了网络钓鱼攻击。这与 Marks 习惯看到的低于 1% 的比例有着巨大的差异。事实上，甚至有一小部分用户反复点击了网络钓鱼邮件。


  我预料到了这一点。这是我在实施过这种方法的其他组织中经历过的。为了帮助解释结果，我在调查中加入了一些额外问题。其中一个是网络钓鱼知识测验，要求受访者识别一系列邮件示例中哪些是网络钓鱼邮件。NAA
  大多数用户的得分处于中位数附近（正确回答了一半的答案）。更重要的是，他们的知识水平并没有让他们在统计上更容易避中网络钓鱼渗透测试——另一个意料之中的结果。


  额外问题询问用户是否能够识别出组织内发送的网络钓鱼测试，以及他们是否能预判测试何时到来。绝大多数人表示他们可以。重复的嵌入式培训并没有让 NAA 的用户更擅长检测网络钓鱼。它只是让他们更擅长检测测试。





  还有更糟糕的消息。对一小组被保证保密的随机选定用户进行访谈后揭露，他们的主管会在测试即将发送时告知他们；某些用户得到了团队内其他成员的帮助，而该组织的几乎每个人都改变了邮件使用行为。这包括推迟和重新安排邮件发送，使其在一天的不同时间出现，这解释了为什么某些用户会多次点击邮件；询问他人确认邮件是否为测试；在其他设备（智能手机和平板电脑）上打开可疑邮件；或者简单地忽略邮件，等待重发（因为他们的逻辑是，黑客永远不会这样做）。这些行为不仅降低了效率，还让
  NAA 面临着更大的钓鱼攻击风险。用户与 24 个月前开始嵌入式培训计划之前一样容易受到影响，甚至更甚，不同的是 NAA 的 IT 团队对用户的防钓鱼能力存有盲目的自信。那么，到底是谁陷害了谁呢？


  NAA 是一个真实的组织，但为了保密，我修改了案例中的许多细节。当面对调查结果时，马克斯（Marks）就像所有其他面临类似结果的首席信息安全官（CISO）一样，意识到他对待用户培训的方法完全错误。他承认自己从未真正理解过用户，但他准备好学习了。他想知道用户为什么会陷入社会工程的陷阱。我像往常的那样，从视觉错觉说起。


  # 看见我们看不见的东西


  这是一件白金色的连衣裙吗？还是黑蓝色的？


  那是一只鸟吗？也许是一只兔子？


  那是人脸的阴影还是仅仅一座山？


  得益于社交媒体，我们现在数百万人见过这些视觉错觉——可以从多种方式解读的视觉图像。它们是许多风靡全球的话题。当然，这种错觉并不新鲜。萨尔瓦多·达利（Salvador
  Dalí）等艺术家曾以此为职业。他的一件著名作品之一描绘了一位尊贵老人的肖像，但仔细观察，会发现一对夫妇和一只睡觉的狗。


  神经科学家已经研究了为什么此类图像会欺骗我们的眼睛。大脑从环境中接收不同的输入，并创建一个事物如何运作的模型。随着时间的推移，当输入与事件的关系变得稳定并持续产生相同的结果时，该模型就成为了该背景下未来解释的框架。


  但大脑对框架的依赖也存在一些局限性。它高估了某些因素，尤其是那些对生命和身体有价值的因素——帮助我们在复杂的社会生活中生活的眼睛和面部；指示血液和危险的颜色（如红色）；甚至某些某些声音频率和音调。这就是为什么达利肖像中老人的脸会脱颖而出，而其中的夫妇除非你被告知，否则并不明显。但一旦你被展示了隐藏的图像，大脑现在就会精炼旧的框架，并在背景再次出现时应用新框架。这就是为什么一旦视觉错觉（即使是魔术）被揭穿，你下次看到它出现时就能识破破绽。你无法假装看不见。


  这种识别需要洞察力，需要某人或某个事件来揭开幻象。在此之前，大脑继续应用它所拥有的任何框架，即使它不符合该背景。问题在于，当你应用的框架不再适用时——例如，你没有看到图片中的夫妇——你无法知道它是一个低效且无效的框架并对其进行完善。但这种完善只有在有人指出你框架中的缺陷时才会发生，就像字面上地向你展示达利肖像中的夫妇那样。


  如果你周围的人都拥有相同的缺陷框架，这就很难了。它变成了一种所有人共有的偏见，这就是文化和社会奇特的产生方式。例如，在印度的部分地区，人们左右点头表示赞同，这让习惯于只通过这种方式表示不同意的人感到措手无策。但这是小组内其他人也遵循的反应。没有人能指出这种奇特，它就变成了常态。因此，在当今复杂的社会、文化和组织背景中生存，拥有有效且最优的框架至关重要。


  意识到这一点，人类社会演化出了一种开发有效框架的机制。这就是科学的活动——其目的是为理解现实开发最优框架。科学通过调查和反复测试，开发出最好描述或预测个体和集体现象的模型，然后这些模型通过我们的教育系统进行传播。物理科学关注自然现象；社会科学关注人类过程。总而言之，它们为解释和预测各种背景下的人和过程提供了稳健的框架。没有它们，我们目睹的大部分事情将根据个人或集体的偏见来解释。我们的解读与一个看达利肖像的幼稚观众并无区别。我们有时可能是对的，但往往会错过那些显而易见的事物。


  但即使科学提供了稳健的框架，人类过程的复杂性也导致科学变得高度专业化。这导致了数百个科学子学科——这些在 19 世纪初仅仅是几个感兴趣领域——每个学科都有自己的期刊、引用要求和世界观。这些创建了严格的学科边界，科学家很少跨越边界，并让他们更容易陷入学科内部集体的奇特或以特定方式做事和思考某事的范式中。


  在第 3 章中，我讨论了主导安全领域用户观工程范式。虽然大多数安全工程师在讨论研究用户时会点头赞同，但大多数人应用人类因素研究的框架，无论其是否合适。他们对待用户就像
  20 世纪初对待机器操作员一样，侧重于通过反复意识培训来改进行为。这阻碍了像马克斯这样的 CISO 如何应对用户。


  为了理解这一点，让我们看看 NAA 员工提供的以下 12 条陈述，它们解释了他们为什么（或没有落入我开发的渗透测试陷阱：


  1. `我快速扫了一眼邮件，它看起来很正常。`

  2. `颜色和图形与我们的文件系统相似。`

  3. `我以为发送者是公司里的同事，所以我只关注了页面上的几个图形来确认。`

  4. `我在手机上打开了它，我知道这样更安全。`

  5. `我看到一个 PDF 并打开了它。`

  6. `我什么都没下载。打开一个链接有什么大吗？`

  7. `我甚至没有想过我在做什么。`

  8. `邮件就在我停车时发过来，我无法忍受未读邮件计数。`

  9. `我看到账户被扣了某个金额，立刻做出了反应。`

  10. `我读了邮件，并注意其中的拼写错误和语法问题。`

  11. `当然是假的——我记得有人告诉过我们不要打开不是个人称呼我们的邮件。`

  12. `我仔细看了邮件，没有发现任何问题。`






  根据你对人类心理和行为的经验和理解，这些回复可能看起来合理，也可能看起来不遵循任何逻辑模式。你可能识别出用户试图确保安全，使用了一些复杂的逻辑（例如：我在手机上打开了它……），或者可能是某种你未曾考虑过的思维模式（例如：我无法忍受未读邮件计数）。你也可能忽略了用户正试图确保安全的实（例如：我看到一个
  PDF 并打开了它），或者他们在使用一个逻辑严密的思维过程（例如：颜色和图形很相似……文件共享系统），因为在这些几十条陈述中包含了更多的信息——其中某些信息比表面看起来没那么明显。事实上，每一条陈述中都隐藏着目的、推理和理据。


  就像达利肖像中隐藏的幻影夫妇一样，人们落入钓鱼陷阱的原因也往往隐藏于眼皮底下。你只需要一个合适的框架来改变你的视角，一旦被揭示，你将无法再次视而不见。接下来的章节将提供这一框架。


  ## 我们如何估计风险


  我们从风险开始——这是我们大脑设计用于估计的大部分内容。我们大脑进化是为了预测风险，以避免受伤或死亡的可能性。这些预测基于情境刺激，并利用通过在类似情况下的先验经验形成的风险信念进行分析。因此，风险信念是揭示用户为何容易受到社会工程攻击的起点。


  总来说，风险信念可以是对风险的准确估计、高估或低估。估计偏离的程度取决于三个因素。第一个是**感知任务复杂度**。某些任务（例如：跑步）显然是简单的，而其他任务（如驾驶飞机）显然是复杂的。问题通常位于这两个极点之间。这些是可能`看起来简单`的任务。当人们拥有可以应用于这些任务的类似经验时，情况通常如此。例如，弹钢琴看起来很简单，因为它和在键盘上打字相似，这也是为什么钢琴是人们学习的最受欢迎的乐器之一的原因。在另一个极端是`看起来复杂`的任务。我们在生活中学到的许多技能，从骑自行车到到学习数学，都属于这一类。它们看起来很复杂，是因为脑海中没有现成的参考物可以应用于这些任务。


  这种表象模糊了我们对风险、任务所需的精力以及其能带来的回报的估计。例如，许多人低估了学习钢琴实际上所需的精力，正如任何钢琴老师都会告诉你的那样，这就是大多数人放弃的原因。在另一端，美国大多数学生最初就抱着数学很困难的信念，这模糊了他们对该学科的体验，以及他们追求需要高级数学知识职业的意愿。


  影响风险信念准确性的第二个因素是**专业知识**。这是一个人对任务执行的精通程度。专业知识可以来自正式的教育和培训，也可以通过间接学习或寻求他人指导来获得。在很大程度上，专业知识取决于任务的复杂度。简单的任务可以通过观察和少许指导学习。跑步、烹饪、骑自行车和许多运动都是例子。更难的任务需要高级的培训和练习。你显然无法在没有指导和练习的情况下学会开飞机或潜水。


  最后一个因素，也是一个经常被忽视的因素，是**元认知**。这是对自己认知过程的自我认知。它是知道自己知道什么以及不知道什么的能力。这种元认知区分了意识到自己局限性的人和不意识到的人。


  这方面的一个例子是邓宁-克鲁格效应，该效应以康奈尔大学心理学家大卫·邓宁和研究生贾斯汀·克鲁格命名，他们发现在某一领域能力低的人往往高估自己的能力，因为他们缺乏识别自己无能的元认知技能。这种优越感的幻觉在许多领域都很常见，特别是是那些看起来更容易掌握的领域。


  作为一个例子，以游泳为例。发达国家的人通常通过封闭水池的课程学习游泳。但很容易低估水池可预测边界之外的开放水域游泳的风险，根据疾病控制与预防中心（CDC）的数据，50%的涉及
  15 岁及以上人群的致命和非致命溺水事故发生在开放水域，是因为游泳者低估了自己的能力。


  或者以骑自行车为例，这是一个相对容易掌握的技能。自行车事故是美国急诊室治疗的头部受伤数量最多的。绝大多数受伤发生在 45 岁及以上的成年男性身上，他们精通骑自行车但没有戴头盔。在这里，我们也有一个看似欺骗性简单且可预测的技能，它诱导个人（尤其是元认知较低的人）采取冒险行动。


  互联网的情况也是如此。用户执行的许多社会工程攻击针对的在线行为——电子邮件、消息传递、浏览、打开附件和超链接、使用优存盘——都是欺骗性的简单。它们之所以呈现这样，部分是因为它们的复杂度被刻意简化，以促进采用和使用。这是通过开发带有菜单和用户友好提示的图形用户界面（`GUIs`）实现的，这些界面将机器语言、操作系统、软件和硬件之间复杂的协作简化了。正因如此，大多数用户认为自己理解计算技术，并擅长使用它们。这让他们放松了警惕，并降低了对风险的感知。





  麦阿瑟·惠勒（McArthur Wheeler）的行为基于类似的联系。他认为自己理解了柠檬汁制成的墨水如何在纸上消失，这很可能是在某档电视节目中看到的（考虑到那是
  1995 年），但他又产生了一个认知跳跃：从摄像头中看到的纸上墨水隐形，跳跃到摄像头中看到的自己脸隐形——将两个完全无关的因素联系了一起。这与用户将“无法在`PDF`上写字”与“恶意软件无法注入此类文件”建立联系的行为无异。


  惠勒风险感知降低让他失去了抑制，因此他没有一次停下来仔细思考过自己的行为。这些行为短路了可能导致有效决策的认知过程。在惠勒的案例中，这些行为影响了他是否愿意投入认知精力去深思或测试柠檬汁的消失能力。在在线案例中，较低的网络风险信念（`CRB`）估计同样会影响用户是否愿意投入认知精力去检查细节，例如邮件中的
  `PDF` 文档，或者在被认为安全的网络、设备、系统或软件上打开的任何电子邮件。


  正如在监控摄像头系统上测试隐形墨水的有效性超出了惠勒的能力范围一样，普通计算机用户来说，将恶意软件注入 `PDF` 或不同的操作系统并评估其相对韧性是非常困难的，甚至是可能的。因此，那些低估风险的具有
  `CRBs`的用户在在线行动中往往更加草率。一旦他们认为风险较低，他们就可能在工作电脑上、某些操作系统上，或在使用某些类型的有线或无线连接时打开邮件，即使是他们认为可疑的邮件。


  如果你进行渗透测试（`pen tests`），你可能想过为什么有些用户在被反复告知不要打开可疑网站或不要重复使用密码后，仍然这样做；或者为什么无论如何训练，用户仍然会打开钓鱼类的渗透测试邮件。你现在知道为什么了。用户低估了此类行为的网络风险。因此，`CRB`
  揭示了用户在面对钓鱼攻击时，可能会选择评估邮件的哪些内容，可能会投入多少认知精力，以及最后，他们是如何看待这种攻击的。


  但自信或技术熟练度呢？难道人们仅仅因为过度自信和缺乏技术而掉入钓鱼陷阱吗？这难道不正是我们应该通过`钓鱼渗透测试`来恐吓他们并反复训练他们的原因吗？


  自信和技术熟练度只是表层解释。它们是事后用来指责他人的依据。例如，每当一个会游泳的成年人在开阔水域意外溺水时，很容易归咎于他们的过度自信或缺乏“足够”的熟练度，但很难解释他们的自信中有多少是“超过”了必要的阈值，或者什么程度的游泳熟练度才足够。简单来说，它们提供了方便的答案，而不是可操作的解决方案。


  技术用户的情况也是如此。目前没有关于安全自信或技术熟练度的准确、客观指标，因此无法判断一个人的安全自信何时过度，更不用说他们的技术熟练度何时足够。正因如此，没有办法训练用户来满足这些要求。相比之下，`CRBs`
  解释了导致风险高估、掌控感或虚假能力感的特定心理层面活动。它是在解释而非惩罚，更重要的是，它精确地指出了导致这些估值的特定信念，使我们能够开发出从源头上解决问题——即从用户的脑海中解决问题的解决方案。


  ## 我们如何思考


  世界各地的人都吃早餐、午餐和晚餐；之间有零食，全天都会摄入液体。其中三分是为了供应大脑的能量需求，而大脑仅占成年人体体重的 2–3%。当这个微小器官活跃地利用其能力进行思考和应对刺激时，这些能量需求会进一步增加。因此，我们进化出了在部署资源方面实现效率的策略。


  一种策略涉及适应信息并将其整合到现有的结构中。这发生在我们的成长过程中。例如，闪闪卡教孩子们将字母 `Z` 与斑马的图像联系起来。这种联系通过接触照片、视频和访问动物园得到强化。大脑随后在动物与其颜色、形状、大小、移动方式、进食内容以及居住地之间建立联系。重复和持续的接触强化了这些连接。一旦建立了这些连接，每当想起它的名字或类似事物时，孩子就不再再次创建关于斑马的每一个视觉细节，那样的话太耗费能量了。相反，大脑形成了一种启发式（一种经验法则），将动物的颜色、形状、外观和感觉与“斑马”这一概念联系起来，以此来节省认知能量。


  启发式是以“如果……那么……”陈述的形式存在的，例如“如果一种蹄动物有黑白条纹，那么它很可能是斑马”。所以，每当孩子们看到与斑马相关的几个线索——外观、感觉、颜色、形状时，他们就能很快得出很可能是斑马的逻辑结论。


  我们一生中形成许多这样的启发式，有些简单，有些则复杂。例如，触发斑马的相同黑白条纹也连接到行人横道，在某些国家被形象地称为“斑马线”。许多启发式是在青少年时期学习的，通过教育和生活经历。随着生活的进行，我们可能会将
  `zebra` 这个词连接到一种淡水鱼、一种成人服装、一个乐队等等，不断叠加和混合日益复杂的线索。


  大脑在决策过程中触发任何此类启发式都需要三个条件。首先，线索必须在信息空间内存在或可用的（`available`）。在斑马线的案例中，需要存在与黑白条纹相关的东西，才能触发“如果是黑白条纹，那么过路是安全的”这一启发式。这可能是外观、其他线索的存在（例如交通灯），甚至是某种描述。其次，启发式需要在用户的记忆中是可提取的（`accessible`）。也就是说，在人的记忆中已经形成了一个将街道上的此类条纹与“如果……那么……”决策联系起来的启发式；如果没有它，线索将毫无意义。当然，如果用户没有动力去注意这些线索，即使“可用”且“可提取”也没有意义。因此，最后的要求是用户能够感知到某些风险，例如认为穿过街道是有危险的，这使他们寻找安全的过马路。






  启发式判断可以通过线索的简单提示被触发。它们帮助我们做出快速决策，使大脑能够节省认知能量。线索作为行动快速信号的重要性，促使人类社会演化出标准化它们。我们为警察、飞行员和医生开发了制服；我们设计了紧急车辆的警报声、灯光和符号；我们开发了交通灯和斑马线标记，并在范围内或或一致地应用了这些标志。公司更进一步，开发了品牌标志和商标，以及伴随其的视觉、听觉色彩。例如，在世界各地的星巴克咖啡店里，标志、颜色、家具、墙上的海报、灯光、店铺氛围甚至音乐都经过了刻意且苦心的维护保持一致。这一切只有一个原因：作为对星巴克产品预期的线索。通过这种方式，消费者无论身处何地，都不需要过多思考即将体验的产品质量。


  ## 虚拟空间与离线空间


  虚拟空间与离线空间相似，但感官输入较少。我们大多数人很少在网上接收独特的听觉信号，至少自 `AOL` 的“您收到邮件！”语音邮件提示声过时以来便是如此。嗅觉或基于气味的信号是不存在的，而运动信号则限于通过触控板的触觉反馈以及传入的消息指示，而这些指示缺乏区分且没有细微差别。在线区分主要依赖于视觉线索，其中许多涉及信号动作的
  `GUI` 按钮或图形图标。（我们在第 2 章中讨论了 `GUI` 如何发展并改变计算体验。）今天，无论是通过鼠标点击还是触摸，用户在计算设备上进行的任何都是通过与此类图标的交互完成的。


  ## 图标的作用


  图标触发程序的打开；图标内部启动带有更多图标的下拉菜单。它们还作为产品或体验的信号。这些包括单一图标，例如浏览器网站名称旁 `SSL` 锁图标，它用于表示网站流量已加密。不同的图标与颜色、字体、文本、布局、表单字段和图形以一致的方式组织在一起，协同工作。正如星巴克在其店内所做的那样，在线图标的排列是为了区分空间，并就用户在点击不同线索时即将体验到的内容形成一种启发式判断。例如，`Facebook`
  标志、标志颜色、页面颜色、字体和页面布局一直保持一致，因此用户现在将它们与该品牌的社交媒体体验联系起来。每个图标都有关于 `Facebook` 体验的相关启发式判断。这就是为什么当用户被要求在不同的网站上使用社交媒体凭据登录（例如评论新闻故事或登录另一个服务）时，他们只需要看到来自
  `Facebook` 品牌的几个线索即可输入他们的 `Facebook` 凭据。完全不同的颜色、布局、字体和标志与 `LinkedIn` 网站相关，并触发一组与该体验相关的独特启发式判断。


  ## 虚拟线索的复杂性


  但事情在这里变得更加复杂了。在现实世界中，指向启发式关系的线索可以被审查和确认。你可以确定判断一匹马是否与斑马不同。它们相关的线索和启发式判断可以被体验、验证和完善。然而，计算大部分利用了建立在更多线索之上的视觉线索。每一个都是一个在现实中没有根据的虚拟构建。


  以之前提到的 `SSL` 锁图标为例，安全领域的许多人检查它来识别网站流量是否加密。假设该符号是`可用的`、`可访问的`的，并且用户是有动机的，例如拥有网络风险观念，驱动他们在浏览器上寻找它。现在评估
  `SSL` 就等同于虚拟检查斑马是否真的是斑马，而不只是一只涂了条纹的马。检查网站流量是否加密涉及查看网站地址是否以 `https` 开头。进一步评估涉及点击浏览器中网站名称旁锁图标。这样做会打开一个窗口，告诉你证书类型和发行它的证书颁发机构
  (`CA`)，并带有通向 `CA` 网站的超链接。进一步，你会被引导到更多提供 `CA` 信息的网页。每一步都通向一个构建，一个我们都已认可的虚拟概念：`http`
  代表什么、在它后面添加“s”代表什么、什么是证书、`CA` 是谁以及他们如何对网站认证、谁允许他们这样做、持续多久，以及此类比比。每一个都是一系列通向其他线索的线索，但在证书评估过程中使用的线索中，没有任何一个能提供网站确实已加密的绝对确定性。


  ## 虚拟环境中的挑战


  但这并不是唯一的问题。虚拟空间中的线索到启发式关系由于计算中线索的性质以多种不同的方式变得更加复杂。


  ### 1. 线索的高密度

  首先，在线环境充满了线索。不仅浏览器上有 `SSL` 线索，浏览器上、浏览器打开的网站、设备上的其他程序以及设备本身还有几十个线索。许多线索出现在同一个视觉平面上，意味着它们同时出现，每个都在竞争用户的注意力。


  ### 2. 显著性与相关性

  其次，虽然存在许多线索，但某些线索由于其显著性以及在决策背景-前背景（等等，背景）背景中的相关性而比其他的更明显。例如，当 `Google` 搜索网站打开时，搜索栏表单字段变得非常显著，用户的注意力立即转向它，但当返回搜索结果时，单个搜索页面、推广的链接和图像就成了中心。在所有这些位置显著且可见度高的线索背景下，域名旁指示
  `SSL` 的微小锁头在竞争注意力。


  ### 3. 隐性线索

  第三，许多线索是隐性的。这既是界面演变的结果，也是程序员的设计选择。看 2000 年后后的任何电子邮件程序，你会发现即使是简单的“回复”或“转发”图标也有标签和拼写。现在查看如今的
  `Yahoo` 门户网站和大多数浏览器。`Yahoo` 的程序员提供了小的用户界面图标（例如屏幕底部的弯箭头），他们假设用户能识别。这种使图标变为隐性的趋势在移动应用程序中更为明显，因为屏幕尺寸有限，更多信息需要适应视觉空间。正因如此，用户根据细微线索形成启发式判断，并利用它们直观地导航网站。


  ### 4. 可变的位置

  第四，线索的位置，即使是相同的线索，有时也会大不同。例如，每个浏览器显示 `SSL` 符号的位置都不同。即使是同一个浏览器在不同的使用实例上也允许不同的操作。例如，`Google`
  的 `Chrome` 浏览器允许用户通过触摸或点击计算机和移动设备上的锁图标来评估 SSL 证书的质量。相比之下，`Apple` 的 `Safari` 浏览器可以在计算机上点击并检查
  `SSL` 图标，但在 `iOS` 设备上不行。






  使“线索-启发式”关系变得复杂的第五个因素是线索的放置方式。在用户界面开发过程中，程序员会对哪些 GUI 元素是最必要的做出明确选择。在几乎所有情况下，这些元素往往是产品性能核心的动作按钮。电子邮件应用（无论是网页版还是移动端应用）都优先考虑打开和回复邮件；社交媒体应用优先考虑接受连接请求；浏览器则优先考虑打开和导航网站，而不是评估它们的
  `SSL` 证书。极少有应用将延迟回复、验证发送者、查看源代码、评估发送者 IP 地址或检查 `SSL` 或其 `CA` 的质量作为核心功能。


  第六个复杂因素是，即使线索的缺失也会触发启发式。以 `SSL` 图标为例。大多数安全培训计划都会训练用户寻找图标，并绝不在没有该图标的网站上输入敏感信息，因此
  `SSL` 图标的缺失与它的出现一样，都会产生相关的启发式。


  影响“线索-启发式”关系的第七个因素是，并没有一个守门人或高阶的信誉权威能够以合理的确定性为电子邮件地址、网站、在线服务、补丁或更新的真实性背书。在线的真实性只能通过点击引导更多线索的线索来评估，而这些线索又引导出更多线索。


  使 GUI-线索-启发式关系复杂的最后一个因素是，在线上进行的许多工作对有机体——即用户——的生活几乎完全没有直接影响。与“斑马线”线索不同（错过它可能导致潜在的生命损失），打开未加密页面的后果似乎微不足道且是间接的。因此，人类大脑对现实世界中的危险信号更加关注。相比之下，由于虚拟环境的新颖性，也因为演进这些能力似乎并不紧迫，用户的网络风险感知既缺乏细微差别也缺乏敏锐度。


  因此，我们在虚拟线索、其呈现方式、显著性、放置位置、定位、总体目的以及对计算机用户的价值方面存在许多问题。用户的大脑已经过条件训练，能够在虚拟空间内几秒钟内适应各种此类与线索相关的问题。为了适应这些问题，大多数用户依赖启发式，有时在面对多个冲突线索时会使用同一种启发式。例如，一位苹果客户得知，来自多个冲突电子邮件地址的邮件都是与苹果的合法通信。例如，来自苹果新信用卡系统的通信邮件是从“@post.applecard.apple”域名发送的，而其
  iTunes 音乐商店收据则来自“@itunes.com”邮箱箱。其中一些邮件带有附件文档，另一些链接到外部网站，还有一些带有图像文件。同样，使用任何云共享服务发送和接收文件的用户很快就会发现，链接（甚至是用于共享的电子邮件地址）也包含广泛的符号和字符。例如，Google
  Drive 通知来自“drive-share-noreply@google.com”收件箱，而 Dropbox 通知来自“no-reply@dropbox.com”收件箱。有时，如
  Google Photos 示例所示，通过其分享功能通过电子邮件分享照片的人员名称显示并保持不变。然而，每封分享邮件都来自“noreply-010203c023b2d094394a@google.com”，其中的字母和数字（本例中随机选择）每次都会发生变化。


  这些例子并不是特例。由于 Google、Apple、Amazon 等公司提供的各种附加服务，这些现象在线用户体验中是普遍存在的。在所有此类情况下，用户的大脑必须不断适应高度细微的差异。与其这样做，大多数不认为有很大网络风险的人更倾向于最大限度地减少认知努力。他们诉诸于广泛通用的启发式。“*如果
  Apple/Google/Amazon 或其他人使用其他电子邮件地址，那么它就是真实的。’”


  他们很少停下来考虑此类启发式是否恰当或充分。回想一下最后一次输入完短信后停下来并推迟发送，或者输入了网站名称后没有进入，或者在输入搜索词后放弃了搜索。我们大多数人很少做这些事情，因为这些功能促进了前进。它们就像机场的扶梯和体育场馆的通道，旨在引导你走向目的地。在这种情况下，它是为了让你不要停下来观察细节。在线界面设计不仅呈现线索并触发各种启发式，它们促进了对这些启发式的行动。


  这使得社会工程人员欺骗用户变得容易。他们只需要注入某些服务的显著线索或复制几个关键词来触发相关的启发式。他们只需要做足够触发启发式的动作。


  例如，他们可以使用 Amazon 的名称、字体、颜色和布局创建一个钓鱼邮件，并轻易地欺骗用户相信它是可信的。他们可以模仿各种邮箱中的云文件共享链接，而无需关心发送者的电子邮件地址，因为他们知道用户会适应甚至预期此类差异；或者他们只需在登录页面上注入一个表单字段（例如
  Gmail 的颜色），发现用户乐意输入凭据。其余部分——即网站或应用程序——通过了线索与启发式的关联并使其变得可用且易用，确保了这一点，因为它通过让你点击、打开、下载或输入凭据来推动你做出决策。这就是你成为鱼叉式攻击受害者的原因。





  但正如早些讨论的，在日常计算中，用户在电子邮件、消息和通信中面临无数线索。与文本相比，线索更加显著、具有图形化且色彩丰富。它们带有关联的启发式，每个线索都信号着移动和动作（发送、回复、编辑等）。相比之下，阅读文本是多变的，且对内容的实质性解释需要专注的阅读和理解。提取意义需要投入认知资源，取决于具体情况，有时需要投入大量的资源，而大脑的设计初衷是吝啬地使用这些资源。这就是为什么系统性处理发生得偶然且持续很短。即使发生了这种情况，系统性处理的努力也是在启发式之后进行的，由环境中的线索触发，而这些线索往往更显著且更容易解释，它们已经对解释任务产生了偏见。


  例如，当遇到一封来自比如 Apple 的陌生邮件时，很容易看出邮件中的 `Apple` 标志（它通常比周围所有内容都大，字体和颜色也不同）是如何影响对发送邮件域名的后续系统性评估的。一个陌生的域名甚至会被`如果它有
  Apple 标志，甚至仅仅是包含 Apple 这个词，那么它就可能来自他们的许多服务邮箱之一`这一启发式规则所忽略。


  此外，系统性地检查源 IP 或域名之外的任何详细信息可能是困难的，因为某些程序并不鼓励这样做。事实上，Apple 的 `iOS Mail` 甚至不显示源标头，因此在
  `iPhone` 上完成这一操作需要用户切换到另一台设备或另一个邮件客户端。大多数用户很少做这一切。绝大多数人已被网站和 App 的“传送带式”设计所习惯，会在面前的设备或
  App 上完成已经开始的在线互动，而不是评估、推迟、阅读或修改。他们完成自己开始的事情。他们并不认为这样做是有风险的，也不认为他们正要做的事情会损害他们。他们的网络风险信念并没有促使他们进行系统性检查。因此，尽管理论上系统性处理可以增加对欺骗的检测，但用户很少愿意或能够参与。


  社会工程工程师了解这一点。他们意识到用户在认知努力上是吝啬的，并且他们被训练成对线索做出反应并做出断判断。这就是为什么他们专注于模仿在线品牌、App、服务和动作的图形线索。这也是为什么他们很少担心此类攻击中的文本和语法错误——因为他们知道用户很少仔细通读它们。


  在许多方面，黑客就像认知科学家。他们尝试不同的攻击以评估哪种效果最好，他们测试不同的线索组合以识别关键线索，并通过不断研究用户的反应来改进他们的攻击。


  了解人类大脑如何处理信息可以告诉我们许多关于社会工程学为何成功以及人们为何会受害的信息，但了解大脑在异常情况下如何运作会告诉我们更多。


  # 在不思考的情况下行动


  医学文献中用首字母 `DF` 标识的一位患者遭受了一氧化碳中毒导致的严重脑损伤。这导致她产生了一种独特的视觉症，她能看到颜色和视觉纹理，但无法通过形状识别即使是最简单的几何图形。然而，当她伸手去拿这类物体时，她的拇指和手指之间的间距与它们的理想抓取点匹配。她对光滑物体也可以这样做。她还能准确地调整手腕，通过信投口寄信——所有任务都是需要视觉敏锐度的.^(9)


  在另一个案例中，病毒性脑脑炎破坏了 Pauly 的大脑，使他无法调整手腕通过信投口寄信——这项任务需要视觉敏锐度.^(10)


  `DF` 和 `Pauly` 等患者表明，大脑可以在没有意识的情况下执行复杂任务。这是因为大脑有两个处理系统：其中一个是缓慢且费力的，另一个是快速且自动的。自动系统用于熟悉且熟练过的任务，而费力的系统则用于新任务或复杂任务。在这些情况下，自动系统仍在运行，但费力的系统已经受损了。


  这解释了为什么许多人可以在不经思考的情况下完成例行任务。它也解释了为什么学习新技能或改变旧习惯是如此困难。我们大脑的设计是为了节省能量，因此尽可能地使用自动系统。为了学习这些或跟上新信息，我们必须愿意使用费力的系统。





  # 智能手机习惯


  在现代计算设备中，智能手机尤其是便携式计算设备的频繁使用导致了习惯的养成。这部分归因于它们的设计，部分则是由于偶然。


  ## 设计的影响

  斯蒂夫·乔斯（Steve Jobs）被推向了设计的。在最初的 `iPhone` 中，他刻意排除了来电消息通知 `LED`，而这在当时的 `Blackberry`
  等智能手机品牌中非常常见。`LED` 的颜色和闪烁频率可以进行编程，用户只需在手机亮起时才与手机进行交互。乔斯的这一设计决策被所有领先的智能手机制造商所效仿，使得用户必须拿起手机检查屏幕上的新收件邮件和消息。这创造了一种检查手机的新模式，随着越来越多的开始发送通知的应用程序出现，这种检查的频率也随之增加。


  ## 偶然的作用

  随后偶然降临了。随着 `iPhone` 的成功和面向消费者的电子邮件服务的兴起，曾经以业务为核心的、“推送”式电子邮件服务和消息应用程序（在邮件到达时将其发送到设备）取代了从服务器“拉取”邮件，并根据设备或邮件提供者定义的间隔进行递送的服务。这使得检查手机的结果变得不可预测。它促使人们为了偶尔收到消息而不断地检查手机。


  ## 服务的扩展

  加入其中的下一个元素是几乎涵盖了每种服务的应用程序，而这些服务以前仅限于基于浏览器的交互。从购物到拍卖、游戏和照片分享，现在检查手机有了更多令人感到愉悦的理由。得益于此，手机不再仅仅是通信设备。它们成为了享受、幻想和逃避现实的渠道。许多应用开始呈现出社交属性——展示用户评论、允许用户举报，并向用户设备推送通知。


  最后加入的是仅限移动端的服务，如网约车、游戏和支付系统，这些服务专为为智能手机设计，并通过智能手机通知、电子邮件和短信进行通信。频繁检查手机从一种受控的控制变成了一种乐趣，最后演变成了必需品。


  ## 帕尔洛夫循环

  得益于此，触发反应性响应的通知随着各种应用程序、消息和更新出现。有提供娱乐、社交认可和逃避现实的应用程序，而通知将用户与它们连接起来。总而言之，它们创造了一个帕尔洛夫学习过程：人们对不同的声音和符号做出持续检查，从而偶尔获得令人愉悦的回馈——相关的消息、邮件、新闻故事或状态更新。这创造了一个可变强化循环，与赌场老虎机背后的系统并无区别（后者会导致赌博习惯），而这种循环发生在用户随身携带的、时刻开启的智能手机上。


  随着时间的推移，这一过程导致用户习惯性地检查手机，甚至减少了对通知的需求，使得仅仅为了检查消息而拿起手机变成了一种习惯。这种智能手机习惯变得如此普遍，以至于导致重大事故和公共安全问题。一些城市开始对边走路或开车边检查设备的人罚单。甚至智能手机制造商也承认了这个问题，并开发了限制设备使用的应用程序。


  ## 习惯的持续性

  但这种习惯并不止于检查手机。它们延伸到了用户对手机通知的响应方式。由于大部分通知源自电子邮件、消息应用程序和社交媒体，用户对这些应用程序上的请求做出反应，而没有过多思考请求本身。原因之一是通知实在太多了，至少在应用程序发展的早期，限制通知的系统尚未建立。另一个原因是，大多数请求虽然令人愉悦，但都是常规的——比如
  `something`、`rate something`、`upvote something`——而且大多数无关紧要。另一个原因是，用户在检查这些应用程序的同时还在做其他事情。





  但并非每个人都能养成这样的习惯。某些性格因素使得一些人更容易产生这种倾向。其中一个因素似乎是**责任心**（conscientiousness），即一个人对自己的行为进行自律的程度。另一个因素似乎是**情绪稳定性**（emotional
  stability），即一个人控制自己冲动的能力。这两个因素共同决定了思想诱发反应的程度。它们决定了一个人是否会（比如）看到设备上未读邮件的计数并决定忽略它，而另一个人可能感到强迫去查看消息。它们告诉我们，哪个用户可能会对电子邮件中的威胁或警告产生不利反应，而谁可能选择做出合理的反应。因此，情绪稳定性和责任心较低的个体会表现出冲动行为。他们被称为`自我调节缺陷`（`DSR`）。


  研究表明，DSR 是用户养成强烈媒体习惯概率的一个指标。它与他们所寻求的满足感共同作用。对于那些在媒体使用中寻求娱乐、认可和逃避的 DSR 用户来说，这些满足感就像是他们无法停止尝试抓取的胡萝卜。由于手机和应用程序的设计，他们的冲动行为变成了强迫行为，因为这些设计促进了反复的反应。DSR、个人获得的满足感和设备设计这三重影响创造了愈发冲动且缺乏理性的行为循环，随着时间的推移，这会导致此类用户养成更强的媒体习惯。


  强烈的习惯并不一定是坏事。它们只是被盲目地执行，这使得黑客可能利用这些习惯，并让用户在网上做出可能导致泄露的事情。它们可能会变成坏习惯。


  在我进行的实验中，那些有强烈社交媒体习惯的人更有可能在看似常规请求的社会工程请求下提供个人信息。这包括接受虚假的社交媒体好友请求、遵守内部信息请求，以及点击通过社交媒体发送给他们的超链接和附件。在基于电子邮件的网络钓鱼受害者身上也可以发现同样的趋势。具有强力电子邮件习惯的用户与习惯较弱的用户相比，他们更有可能点击邮件中的网络钓鱼链接或打开恶意附件。


  因此，习惯是一组重要的冲动集合，直接影响用户对社会工程攻击的脆弱性。它们的影响范围从通过诱发反应性反应使人们仓忙做出判断，到根据习惯的强弱，完全在点击网络钓鱼邮件中的超链接或恶意附件之前完全消除了任何预思考。


  ## 解析国家会计机构 (NAA) 用户的响应


  让我们回顾一下在本章中为止讨论的内容。认知启发（Cognitive heuristics）是由线索触发的直觉决策；它们以“如果……那么……”规则的形式存在。系统化处理要求在信息上下文的元素与知识之间建立语义连接。这两者的前提都是用户对在线行动风险的信念：**网络风险信念**（cyber
  risk beliefs）。这些是定义用户如何响应社会工程攻击的主要认知因素。我们还有习惯性反应，其前提是基于性格的调节能力（如自我调节缺陷），导致对社会工程攻击产生自动的、反应性的响应。


  现在让我们重新审 NAA 用户提供的响应，解释他们为何会成为网络钓鱼测试攻击的受害者。使用该框架检查每个陈述。


  第一个响应“我快速扫了一眼页面，它看起来很对”来自一个将邮件的“外观”与其真实性联系起来的用户。该用户有一个被应用的心理规则：“`if` 它看起来像我通常看到的一样，`then`
  它必须是真实的。”记得我编写的封邮件借用了官方文件共享系统的视觉元素，如颜色、字体类型和布局。该用户的启发来自于对邮件的快速瞥，以及它与他们关于此类邮件通常如何出现的心理图式相符。因此，该用户应用了一种认知启发。


  第二个响应“颜色和图形与我们的内部文件共享系统相似”更显式地反映了这种启发：“`if` 颜色和图形相似，`then` 它必须是真实的。”


  第三个用户查看了邮件的来源，并将其作为引导后续审查的启发。该用户的“`if` 它来自我认识的人，`then` 它很可能是真实的”这种启发偏向了评估的其余部分。


  下一个用户表示：“我在我的 iPhone 上打开它，我知道这样更安全。”这个用户显然调用了对其设备操作系统安全的信念，这是一种网络风险信念。


  在接下来的两个用户响应中也是显而易见的，每位用户都对引导他们决策的技术或行为的内在风险持有信念。一个人看到了 PDF——我们知道用户是如何看待这类文档的——另一个人则认为点击链接没有下载东西那么危险。到目前为止，这些用户的响应揭示了是由邮件中的某些元素触发的思考，要么是预先存在的信念。


  下一组用户陈述表明决策缺乏留心。一个用户说：“我根本没有考虑过我在做什么”；另一个说：“邮件在我刚停好车时发到手机上的”，揭示了局限在于用户不知道要在邮件中寻找什么。他们的响应证明了仅靠系统化处理并不能欺骗。只有当人具备准确知识时，它才有帮助。


  因此，每个响应都揭示了许多关于用户的信息。每个响应都提供了关于用户信念、想法、方式的见解，这些信息并不难收集。事实上，我们一直在收集此类情感。例如，我在第 3
  章中讨论的由 MITRE 进行的意识培训研究以及许多其他研究项目中的，用户提供了开放式响应，解释了他们为何落入鱼叉式网络钓鱼测试的陷阱。问题在于，这些响应从未使用基于社会科学或认知科学的理论框架进行检查。这些响应仅受到了草率关注，并且就像我们在第
  3 章讨论的古希腊遗址中化石骨的考古发现一样，被当作偶然丢弃了。





  在忽视那些显而易见的问题时，网络安全领域反而将重点放在训练用户去完成一些他们在认知上无法完成的事情上——长时间系统性地检查邮件；检查每封邮件中的几十个元素；或者对针对电子邮件、即时消息或社交媒体的攻击保持警惕。用户被要求在那些专为快速思考、多任务处理、习惯性检查和反应性响应而设计的设备、应用程序和操作系统上执行这些任务，而当用户在社会工程学面前依然表现脆弱时，他们会受到重新培训、重新测试、告诫，并为自己的失败遭受指责。


  但现在，你已经理解得更透彻了。你了解了驱动用户导致社会工程欺骗的思维和行为的因素是什么。你了解他们是如何思考的，为什么会那样思考，以及他们何时可能会做出不应该做的行为。你了解在线线索如何触发用户的思维，设备如何影响他们的行为，以及网络风险信念如何激励他们。第
  5 章更进了一步，提供了一种简单的机制，可以量化地确定最脆弱的用户——即最薄弱的环节。掌握了这些知识，IT 经理不再是说“抓到你了”，而是可以对他们的用户说“我帮到你了！”


