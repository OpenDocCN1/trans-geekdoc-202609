  本章探讨了五家组织网络韧性的实施情况：Masonry Inc.，一家大型区域银行，由富有魅力的首席信息安全官（CISO）David Marcus（大卫·马库）领导；Ashmore
  Medical Center，康涅狄格州的一家医院，由医生安全专家 Alex Sanchez（亚历克斯·桑奇）领导；关税咨询委员会（TAC），一家位于华盛顿特区、拥有五多名员工的中型政府机构，由
  CISO Elaine Banks（伊莱恩·银行）领导；Amazing Income Inc.，一家快速增长的动态财富管理公司，拥有 20 个区域办事处，由 CISO
  Amy Craft（艾米·手工）保护；以及 Akron House，位于宾夕法尼亚州北部拥有 45 名员工的小型非营利组织，由 Jake Traposh（杰克·特朗普）领导。


  每个片段都是 `CRS` 实施案例研究，展示了组织如何应对并从中受益。某些案例详尽且冗长，而另一些则刻意保持简短。其目的是展示多样化的实施方法，为需要的人提供详细内容，为追求简洁的人提供易于理解的内容。每个案例都是真实的组织，但为了保护机密，标识符和数据经过了修改。案例证明了
  `CRS` 和 `CHI` 如何适用于大小不同的组织，以制定并非总是以增加培训为终点的解决方案。正如你将看到的，某些解决方案是用户自发产生的，并转化为适用于组织的最佳实践；另一些则源于在安全领域极少扩展的社会科学理论。读完这些案例后，你肯定会像案例中介绍的
  CISO 们一样，意识到这种仅通过 `CRS` 才可能获得的洞察和解决方案，比任何安全供应商所提供的要好得多。


  ## Masonry Inc. 的正念


  Masonry Inc. 是一家大型区域银行，在全美拥有六百多家分行，在中西部和大西洋沿岸地区拥有强大的影响力。其业务涵盖了银业务的各个方面，其中零售银业务最为突出，其
  10,000 多名员工中的大多数在此工作。其中许多人与客户直接接触并处理客户数据，这使得每个人都成为社会工程攻击的潜在目标。丢失数据（任何数据）不仅是一个处理起来的噩梦，而且可能会破坏银行一个世纪以来努力赢得信誉。加强他们的防御不仅重要，而且至关重要。确保这一任务落在其
  CISO David Marcus 的肩上。


  Marcus 曾在国家情报部门工作过，并在互联网早期通过运行进攻性行动积累了经验。在千禧虫漏洞（Y2K）期间他转变为防御方，并在企业阶梯中不断晋升。得益于这些化的经验，他理解技术的弱点，这使得他用自己的话说，“非常擅长知道如何做好防御”。但困扰他的唯一一个方面是针对技术的社会威胁，这种威胁似乎没有解决方案，因为是由用户造成的——而他对用户的控制是有限的，特别是在私营部门。


  自 2010 年加入 Masonry 以来，Marcus 实施了多项保护措施，应用了许多著名的技术限制来限制员工对服务器的访问，并启动了一项大规模的意识运动。作为该运动的一部分，他建立了一个中心化的帮助台，设有电子邮件和电话号码，并配备专门的
  IT 人员值守。员工可以向帮助台报告他们认为任何异常的 IT 相关问题并获得帮助。Marcus 还引入了频繁的渗透测试，向用户发送模拟钓鱼邮件。虽然其中许多攻击最初是在内部进行的，但在过去的五年里，他寻求了伦理安全黑客（即白帽客）和其他供应商的帮助。


  测试结果总是参差不齐的。每次都有 2% 到 15% 的不同用户组落入不同的攻击，而且这种现象的发生没有任何逻辑模式，更不用说解释。用户在渗透测试后向帮助台寻求帮助的报告率也低得惊人，只有一两个个人甚至愿意报告。


  这一切中最令人不安的部分是，Marcus 不知道为什么会发生这些。意识水平（使用他可用的指标——渗透测试失败来衡量）很高，但却表现出恼人的不一致：每次攻击都有一小部分但不同的用户群落入陷阱。


  没有什么比这更让 David Marcus 困扰了。他喜欢一致性，并想确切知道为什么没有发生这种情况。比起其他任何，他更想要一个不仅仅涉及更多培训、威胁或激励的解决方案。相反，他想知道发生了什么、为什么以及他可以如何修复它。他听说过我开发的风险评估方法，并想看看它是否有帮助。


  按照第 6 章和第 7 章概述的方法，我使用 Vishwas 三元组（`V-Triad`）开发了一个基准攻击。根据 Marcus IT 团队的输入，我开发了八种攻击，每种攻击改变银行内部通信的一个特定方面，对应三元组的每一个顶点。从
  `compatibility`（兼容性）开始，我们专注于重建内部惯例——打印和文件共享系统、检查客户账户——并引入了 `credibility`（信誉）符号，例如网络打印机的名称、其标志、文件共享门户的颜色以及用于标记内部客户账户门户登录页的字体。


  这些示例在意义上都是虚假的，因为这些系统实际上并没有交换此类通信。即使字体或颜色是准确的，单封邮件也有明显的错误，例如显示了错误的文件共享门户名称、显示了未批准浏览器的标志等。邮件还经过了
  `customized`（定制），并专门写给每位用户。


  接下来，使用来自总部的 25 名员工，根据网络风险调查（`CRS`）中的三个问题计算出每次测试的基准。在排除掉那些不能代表组织普通用户的受访者的回答后，对专家样本提供的答案进行了汇总，并将这八个示例按质量从最易检测到最难检测或能力欺骗的程度进行排序。有两个示例的得分处于中位数，被大多数人认为既不是太难也不太容易检测。这些攻击中的第一个被用于基准渗透测试。第二个用于下个季度的随访测试。难度排名次高的测试用于在第二次渗透测试三个月后进行的最终随访中。按照第
  7 章概述的程序，在每次攻击后使用 `CRS` 作为衡量工具，并利用诊断结果开发干预措施，其实施的成功否在随后的每次测试中进行评估，再次使用 `CRS`。


  为了简单起见，第一次渗透测试发送给工作在同一时区的 18 个不同分行的员工。这使得能够更好地管理 `CRS` 的部署，并通过将那些排除在评估之外的人视为留存组或对照组来跟踪干预措施的成功。攻击模拟了内部云文件共享门户，并要求受访者下载嵌入的
  zip 文件以检查他们的网络打印机使用量。


  总共有 1,500 名用户成为目标。在攻击后的一周内，每个成为目标的用户都收到了 David Marcus 发送的一封个性化电子邮件请求，并附有 `CRS`。他恳请用户在回答中保持诚实，以提高组织的网络就绪性。`CRS`
  包含渗透测试的副本和另一封未用于测试的邮件副本，并询问用户是否记得在渗透测试中收到过任何邮件，并识别出他们收到的那封邮件。






  共有 1,289 名用户（85%）响应了网络韧性调查（CRS）。根据行为跟踪数据，任何未打开渗透测试邮件的用户，或在调查中无法从两个示例中准确识别出正确邮件的用户均被排除在分析之外。这最终获得了
  1,003 名受访者，其中 38% 处于基准阈值判定的高风险类别。其余 622 名受访者（62%）处于低风险组。计算出的净韧性评分（NRS）为 24（即 62–38）。


  随后，所有用户对 CRS 开放问题的回答都使用第 4 章讨论的数值分类方案进行了编码。简而言，这涉及统计回答中显示用户使用了启发式规则（`if-then rule`）的次数，以及为了报告组织内可疑在线活动而设立的帮助台邮箱账户的深度系统化，该账户现在也兼作他们的培训门户。


  ### 第二次渗透测试


  在第一次渗透测试三个月后，发送了第二封渗透测试邮件。这次攻击警告用户的网络浏览历史违反了 IT 策略。该邮件从一个虚假的帮助台邮箱账户发送，要求用户点击嵌入的超链接以检查其浏览历史。只有第一次渗透测试中针对的
  1,500 名用户收到了这次攻击。与第一次测试一样，在攻击一周后，所有目标用户都收到了 CRS。


  查看在第一次 CRS 测试中评估的 1,003 名用户的数据，仅有 11% 被判定为高风险。此时的 `NRS` 为 `89–11 = 78`，较上一次测试的 24
  分有了显著提高。再次遵循诊断方案，对开放式回答进行了量化和对比。在检查他们的回答时，许多风险最高的人除了继续保持着糟糕的启发式方法外，还遭受了不良习惯的影响。因此，计划了一项习惯干预措施，针对所有具有不良习惯的高风险类别人员，并与启发式改进计划一同实施。


  ### 正念干预


  该干预侧重于培养网络正念。正念的根源在于深奥东方精神传统，虽然社会科学领域的许多人曾将其作为解决用户疏忽的方案，但尚未有人开发出实施程序。也没有人识别出用户中哪些易感群体最适合用此治疗。在我过去对大学生的工作中，那些技术习惯较差的学生对某些关注正念的干预反应良好——我将其中一些方法扩展，以处理
  Masonry Inc. 用户的不良习惯。


  作为正念干预的一部分，用户被要求执行以下任务：(1) 访问邮箱账户，并在电脑或移动设备上报告每周接收并回复的外部邮件数量；(2) 跟踪浏览器数据并报告每周浏览历史；(3)
  利用终端的资源监视器跟踪其数据使用情况；(4) 跟踪任何或所有系统通知（例如操作系统和其他软件更新提示、杀毒病毒定义更新）。这些信息连同任何此类更新的截图必须通过链接到帮助台页面的在线门户提交。


  每位用户被要求在每周的不同日期执行一项不同的操作，这些操作已预设在他们的共享日历中。报告应每周进行一次（如果用户需要，可以更多），持续四周，先前的关于习惯的研究表明，这是建立新常规所需的时间。该干预的目标是提高用户对计算机和设备上执行的系统级常规工作的监控，并打破他们的自动反应。除了这些特定的干预外，包括被判定为低风险在内的所有用户都接受了简短的在线培训方案，用户被告知在网络钓鱼攻击中要寻找什么——这是之前培训中经常使用的内容——并向他们展示了各种攻击样本，告诉他们样本中的哪些特征揭示了其非法性。


  随后，针对之前测试的目标用户实施了被认为对用户更难发现的渗透测试。根据方案，用户在测试一周后发送了 CRS。总体而言，6% 的用户被判定为高风险。整体 `NRS`
  现在为 88（即 94−6）。更令人鼓舞的是，4% 的用户报告了攻击，且高风险组和低风险组的报告人数相同。





  Alex Sanchez（MD, MBA）曾是康涅狄格州一家拥有 450 张床位的医院——阿什莫尔医疗中心（AMC）的首席信息安全官（CISO）。该医院在多个专业领域雇佣了
  2,500 名医生、护士和支持人员。Sanchez 属于那种罕见的、既年长又精通技术的资深医生。他是许多技术的早期采用者，这不仅适用于他的专业领域，也适用于计算领域。早在
  20 世纪 90 年代（智能手机出现很久），他就医院里首批使用个人数字助理（`PDAs`）开处方的人了。在这些成为主流之前，他就开发了数据库、组建了虚拟医疗团队，并开始尝试远程医疗、电子健康记录（`EMRs`）和电子处方。他对技术的渴望使他从医院休假，在一家
  `EMR` 系统开发商处工作了一段时间。在此期间，他获得了信息学学位和多项安全类证书，并引起了医院领导层的关注——他们将“所有 IT 事务”都托付给了他。这带来了许多头衔；有人称他为
  CISO，但他自己自称为首席信息官——一个负责管理人员以及他们利用技术所执行流程的人。


  医疗保健行业意味着受到监管，这促使了 Sanchez 团队的许多运营工作。尽管有许多强制性的 IT 保护措施，但这些都是为人知的，这意味着他由 18 名全职和另外十余名兼职员工组成的
  IT 团队可以为此制定计划。未知性才是他首要担忧。其中就是勒索软件，它正瘫痪全国各地的医院。从洛杉矶到路易斯安那州，医院正遭受袭击并丢失信息；最近，它们甚至击中了纽约的一家大型医院。Sanchez
  知道自己的医院可能随时成为攻击目标，因此他一直在做准备，创建系统备份，并寻找黑客可能利用的每一个弱点。但他知道，即使是准备最充分的医院在重新上线时也会遇到问题——因为许多医疗
  IT 系统都很老旧，为了支持遗留软件而保留，因此停机不仅关乎数据恢复。许多系统中的数据无法按照现代系统允许的方式进行备份。他们持有的数据质量、丢失数据的责任，以及长期停机对医院信誉造成的无法估量的损害，都让
  Sanchez 感到担忧。


  他进行巡视，与 `AMC` 工作的不同医生和护理人员交谈，并很快意识到问题需要的不仅仅是技术上的修复；用户需要更擅长识别社会工程攻击。他向医院执行领导层提出的论点是：“新的、闪亮的汽车在粗心大意司机手中，并不比旧车更不容易出事故。我们需要驾驶培训，让每个人都更擅长开车。我们需要网络卫生培训。”


  “但培训他们什么呢？做什么呢？”他们问道，“成本是多少？为什么不直接创建更好的备份就完事了？”以及“阻力和停机时间怎么办？这一切真的值得吗？”由于在该系统中工作了多年，Sanchez
  知道在医院里推行任何新技术都不容易。每个人都喜欢技术的想法，但没有人想学一些新东西，特别是当这些新东西与他们的核心业务无关时。Sanchez 已经在 `EMRs`
  身上吸过惨痛的教训：“告诉他们关于一台新的 CT 扫描仪，许多人都会听；但告诉他们如何在线开处方，他们就会离开房间。”起初，医生、护士和其他员工非常厌恶 `EMRs`。





  ## 网络卫生评估


  我们首先使用 `CHI` 进行了基准网络卫生评估。Sanchez 在 `SAFETY` 维度（存储和设备卫生、身份验证和凭据卫生、朋友和社交媒体卫生、电子邮件和消息卫生以及传输卫生）上衡量了网络卫生的四个方面（意识、知识、能力和执行）。问卷通过电子邮件发送给一个包含两千名员工的样本，并根据其总比例将其分为四组：医生、护士、行政/管理人员和普通员工。问卷数据收集了八周，其间
  Sanchez 向受访者发送了个人邮件，甚至进行了一些面对面的访问，以帮助那些忙于无法回复的人员。


  ## 钓鱼测试开发


  接下来，使用 `V-Triad` 和 `Cyber Risk Survey` 开发了一项网络钓鱼测试。根据第 7 章详述的设计步骤，我们开发了四种不同的网络钓鱼测试。每个测试至少包含三角形每个顶点的一个元素，并遵循了与上一个案例概述类似的开发流程。该流程的最终产物是两个可以部署的网络钓鱼测试：


  1.  **针对性网络钓鱼邮件**：一封包含病理取件通知链接的邮件。它模仿了地区医院用于收集生物样本的专门服务，并借用了他们通知邮件中的某些字体和颜色。主题行提供了取件时间，并要求用户点击链接以阅读特殊的包裹准备说明。

  2.  **患者沟通邮件**：一封看起来像是与患者进行持续交流的邮件，患者附上了他们的健康检查结果。邮件主题行包含“Re”（回复），后跟跟“如之前讨论的，测试结果”（as
  discussed, test results）。邮件正文称呼普通护理人员，并要求读者打开链接。


  对 35 名全职和兼职 IT 人员，以及技术咨询委员会的另外 15 名成员（医生和护士）进行基准测试的结果显示：投递邮件在 `CRS` 中的得分为 9 分，而患者沟通邮件的得分为
  5 分。结果差异的原因是，病理取件邮件可能与用户已经接受过培训的其他钓鱼测试没有区别。考虑到其难度评分，发现患者邮件更为合适，并用于首次测试。


  ## 部署与风险分析


  由于已经建立了内部钓鱼测试计划，利用 IT 团队开发的现有流程部署钓鱼邮件变得非常容易。测试部署到两千名受访者的样本中，并遵循了第 8 章详述的许多 `CRS`
  协议。


  总体而言，根据对 `CRS` 的响应，有 625 名受访者处于高风险类别，`NRS` 为 37.50（即 68.75–31.25）。`CRS` 的答案让 Sanchez
  明白了为什么高风险用户最终会中招钓鱼。为了简洁起见，我将略过 `CRS` 开放式分析的发现，但可以说，就像上一个案例中的 David Marcus 一样，Alex
  Sanchez 可以分析用户为什么会陷入钓鱼攻击。


  ## 差距分析结果


  接下来，Sanchez 根据对 `CHI` 的响应进行了缺口分析。这基本上涉及比较 `CHI` 中 `SAFETY` 维度下意识、知识、执行和能力水平的差异。在此基础上，Sanchez
  叠加了基于 `CRS` 的高风险与低风险分级。图 9.1 中的图表显示了整体差距。


  ![图 9.1 ¶ AMC 网络卫生差距分析结果。¶ 注意：x 轴包括 CHI 的五个维度每一个，y 轴代表员工的汇总响应。](img/Figure_9-1.png)


  `[图 9.1]` 显示了高风险和低风险用户在每个网络卫生维度平均意识和执行水平之间的差距（响应使用 0–5 分量表进行测量并取平均值）。让我们检查每一个：


  *   **存储卫生**：与低风险用户相比，高风险用户在意识和执行方面的得分均较低。

  *   **身份验证卫生**：Sanchez 发现高风险用户的意识水平更低，但与执行力之间的差距在 1 左右。

  *   **朋友和社交媒体卫生**：两组的意识和执行力都较高，但用户之间的差距是相同的。

  *   **电子邮件卫生**：与高风险用户相比，低风险用户的整体意识较低，且执行卫生极低（平均执行差距为 0.76），后者的差距为 0.49。

  *   **传输卫生**：高风险和低风险用户的得分都相对较高，执行方面的差距较小。


  ## 核心问题与解决方案


  通过这些数据，Sanchez 了解了问题的核心。高风险用户在意识和执行方面存在相当显著的差距。这些差距根据卫生因素而异，在`电子邮件卫生`和`身份验证卫生`方面差距尤大；对于前者，整体意识本身就很低，执行力也是如此。


  分析仅仅是 `CRS` 和 `CHI` 结合使用所获得的信息宝库的一冰角：

  *   **下钻分析**：`CHI` 中的单独问题帮助 Sanchez 深入分析到差距最大的地方。

  *   **开放式分析**：`CRS` 中的开放式问题，他可以将这些问题映射到卫生差距上，以更准确地定义问题区域。

  *   **解决方案识别**：通过检查低风险用户的响应，他识别了解决方案。


  因此，通过 `CRS`，他识别出哪些用户可能中勒索软件攻击，而通过 `CHI`，他知道自己需要为此做什么。


  ## 能力限制与未来展望


  分析进一步检查了能力限制，这让 Sanchez 能够识别出用户认为缺乏了什么。例如，数据显示：

  *   没有提供密码箱。

  *   没有提供官方 VPN 服务。

  *   没有个人设备备份系统。

  *   没有转发可疑邮件或钓鱼尝试的帮助台。

  *   没有用于共享信息的统一平台。


  `NRS` 结合网络卫生清单数据让 Sanchez 能够寻找并识别解决特定问题的供应商。他可以向医院院长申请资本支出，并向他们展示医院将受益。他现在有一套流程来检查和评估整体就绪情况。他有了评分、需要达到的目标分，以及执行的时间表和行动计划。


  通过 `CHS` 和 `CHI`，Sanchez 可以进行衡量、评估、跟踪、沟通、校准，以及最重要的说服。Sanchez 终于可以建立基于证据的网络卫生模型，并毫无疑问地为
  Ashmore 医学中心进行网络净化。






  # Elaine Banks 与关税咨询委员会


  `Tariff Advisory Commission`（TAC）的首席信息安全官（CISO）Elaine Banks 实施了许多以用户为中心的倡议，从培训到渗透测试等应有。其中一些是强制性要求，而另一些则是由于她认为必要而实施的。她的职责范围相对容易管理。`TAC`
  总部位于华盛顿特区，是一个拥有 500 名员工的政府机构；与其他政府机构相比，规模很小，在其他机构中这种人数仅相当于一个部门。但考虑到她涵盖的范围较小，她希望确保组织中的每一个人都具有韧性。“没有什么比一家小型机构因被攻破而登上新闻更糟糕了……你最终会成为网络漏洞的典型案例，”她说。


  Banks 知道某些解决方案比其他方案更有效，但具体是哪些呢？有一种培训是大家都在抱怨的，但在 `TAC` 实施两年后，其失败率低于 1%。此外还有邮件标记，这是一种突出显示哪些邮件是外部邮件的简单协议，没人抱怨，但看起来很有用。但这些中哪些是重要的，重要程度又是如何？这些问题引导
  Banks 应用了 `CRS` 协议。


  作为计划的一部分，我们使用 `V-Triad` 开发了一封网络钓鱼渗透测试邮件。该邮件将“外部”标记更改为“内部”标记，并称“内部邮件应该是信任的”。这反转了通常警告用户怀疑外部邮件链接的标记。这满足了
  `V-Triad` 的 `compatibility`（兼容性）顶点。为了让邮件具有 `credible`（可信度），我们模拟了内部日历系统，并发送了一个会议请求，将材料以
  `PDF` 格式附在邮件中。最后，每封邮件都经过了 `customized`（定制），在邀请列表中包含了几个其他人员的名字（当然，这些都不是真实的员工），因此看起来组织中的其他人也收到了邀请。


  由于 `TAC` IT 部门规模较小，`CRS` 基准测试由五名 IT 人员提供。`CRS` 基准测试在 `CRI` 上获得了 8 分，表明这种攻击对用户来说应该相当容易检测。主要原因是“内部”这一兼容性信号的显而易见，几乎每个人都应该注意到。


  攻击后的 `CRS` 部署导致响应率接近 97%，考虑到组织用户群规模较小，这并不意外。在回想起曾收到该邮件的人中，约 18% 的受访者被评为高风险——远高于该机构过去一年经历的低于
  2–3% 的渗透测试失败率。`NRS` 为 64（即 82–18）。


  对他们风险原因的诊断指向了两个主要问题：启发式和风险信念。许多用户将主题行视为内部邮件的新指标。他们推理认为，IT 经理可能更改了政策以突出显示内部邮件，而他们错过了关于该变更的公告。在邮件正文中，大多数人注意到了日历邀请，只是扫了一眼列表上的其他名字，并认为他们是组织中他们不熟悉的其他人。虽然大多数名字是虚假的，但他们推断，由于*确实*（*were*）其他名字，这使得邀请看起来是真实的。正如一个用户在
  `CRS` 上写道：“我猜我不可能认识组织里的每个人，而且列表上至少有几个看起来熟悉的名字。如果不是我，列表里的某个人肯定会告诉别人这是假的！”


  随后的分析帮助 Elaine Banks 理解了……（（此处已省略后续重复排版逻辑，将根据用户要求的文本格式进行排版）





  在实施了一项耗时一个月才涵盖所有分公司的公司级培训计划后，Craft 想知道还需要什么。“钱花花了，指令执行了，时间也浪费了，但准备情况如何呢？我们到位了吗？”公司领导层问道，“为了达到那个……无论那是什么状态，我们还要额外投入多少钱？”


  虽然高层人员都希望每个人都接受培训并确保网络安全——无论这让 Craft 付出什么代价——但每个团队经理都对培训表示不满，认为这是在浪费时间。“我们大家都知道不要打开某些邮件……而且，你正在浪费我和我分公司员工的时间，他们本该去开发客户，现在却在做关于如何安全使用电子邮件的培训！”一位年轻的分公司主管评价道。因此，Craft
  想知道谁需要培训、他们需要什么，以及除了培训之外是否也可能足够。她还想知道 `Amazing Income` 作为一个组织处于什么水平，以及他们面临社会工程攻击的风险如何。


  我们开始使用 `V-Triad` 开发钓鱼测试，以评估用户的准备情况。这一过程导致了四次基准 `pen tests`，并由 25 名 IT 人员组成的小组进行评分。根据他们的评估，我们挑选了两个测试，一个基准得分为
  `6`，另一个得分为 `5`。两者被认为在难度上是平齐的。


  第一个测试在第一季度初部署给 330 名员工，随后在测试一周后进行了 `CRS` 评估。在剔除不记得测试的受访者后，净响应率为 80%。最终的 `CRS` 显示
  33% 的用户处于高风险，其 `NRS` 值为 `34`（即 `67–33`）。


  分析表明，大多数高风险用户正受到缺乏良好的启发式思维、糟糕的风险信念以及更差习惯的影响。将高风险分为中等风险和最高风险（通过对用户进行排序并取中位数）表明，风险最高的人主要受到糟糕的风险信念和坏习惯的影响。


  显然需要一种习惯干预和一项改进风险信念的计划。根据诊断，显然需要并建议一种关注正念的干预，以及类似于 `Masonry Inc.` 所使用的、旨在提高风险信念和启发式思维的培训计划。


  但在低风险用户的回答中隐藏着一个惊喜。一些处于最低风险水平的用户想出了有趣的邮件使用仪式和做法。例如，一个用户创建了独立的收件箱并设置了邮件投递规则，使 IT
  邮件显示在特定的收件箱中，所有客户邮件在一个文件夹中，所有直属员工在另一个文件夹中。这些邮件有自定义的图标和颜色。另一个用户也创建了自己的流程。她设置了规则，根据优先级级别，只允许在工作期间显示某些跨部门邮件。她指导的每位员工都接受了使用优先级系统的培训，如果没有该系统，邮件就不会被处理，而是会被留在不同的基于优先级的文件夹中。该部门大多数用户的风险水平较低，而且习惯问题比那些没有建立此类变通方案的部门的人要少。


  Craft 利用这些发现设计了一套全公司的邮件投递规则系统和一个根据重要性标记邮件的系统，组织中的每个人都接受了使用该系统的培训。该系统在半数分公司中小范围推出。




  在审查响应结果时，整体问题不仅在于缺乏足够的知识（这导致了糟糕的风险观念和更糟糕的启发式判断），还在于糟糕习惯的占主地位。高风险用户的糟糕邮件习惯明显更高，这源于他们使用统一的收件箱，在收件箱中填充了多个个人邮箱账户以及工作账户。这增加了收件箱中显示的邮件数量。许多用户使用允许推迟邮件的客户端，使得邮件会在不同的时间重新出现。此类行为导致邮件在收件箱中反复出现，从而增加了受害的几率。


  我们首先通过开展培训活动来解决良好启发式判断和风险观念缺乏的问题，活动涉及教授每个人关于在线操作可以记住的简单规则。这些规则被张在组织内的各个位置。此外，Traposh
  聘请了一家培训机构，对用户进行安全数据处理和邮件使用的培训。


  除此之外，Akron House 使用了基于 `CRS` 的风险评估分级，并将其映射到组织架构图中，Traposh 在此推断出每个用户在功能上在做什么。这有助于定义数据限制，并区分出谁需要访问不同的组织材料，谁不需要。接下来，我们禁用了所有内部计算机对邮件的访问。相反，我们给每个人发放了苹果品牌的平板电脑和手机，通过这些设备访问邮件。这创建了一个简单的物理隔离（air
  gap），使得社交工程攻击难以瘫痪整个组织。


  在攻击后的几个月里，我们进行了第二次测试，结果显示点击率显著下降，只有 8% 的用户处于高风险。`NRS` 达到了惊人的 84（即 92–8）。多次点击的情况完全停止，整体风险性降低了。所有点击都限制在移动设备内。尽管一些风险观念问题仍然存在，但这些通过与前两个案例中讨论的类似的方法，即结合技术干预和个性化解决方案得到了解决。在年底，发生了第三次攻击，其复杂高得多。它捕获的受害者比第二次还要少，考虑到攻击难度的增加和时间跨度的短暂，这将是令人惊叹的。更好的是，受害者是在移动设备上点击链接的，攻击的潜在影响被控制在了范围内。得益于这些简单的干预措施，该组织的风险态势已从“糟糕”转变为“防御”。


  每个案例都展示了你如何以一种针对性强、成本效益高、基于证据且集中的方式应用干预，以提高用户的网络韧性。这一切之所以可能，仅仅是因为 `CRS` 及其相关指标。但这些并不是最佳实践。它们仅仅展示了可能性的。当然，如果你实施了
  `CRS`，会有更多可能，而到书的这一部分，你已经准备好这样做了。


  # 10   反转社交工程人员的优势


  有这样一个寓言：一个男人在深夜在路灯下疯狂地寻找他的车钥匙，这时一名警察停下来帮助他，并询问钥匙是在哪里丢的。男人回答说：“在那那边，小巷里，我的车旁边。”“但是，你为什么在这儿找呢？”警察问道。男人回答说：“因为这里的光线更好。”^(1)


  他的回答指示了“路灯效应”——一种观察性偏差，人们倾向于在容易找到的地方寻找，而不是问题真正存在的地方寻找。


  在攻击后的几个月里，我们进行了第二次测试，结果显示点击率显著下降，只有 8% 的用户处于高风险。`NRS` 达到了惊人的 84（即 92–8）。多次点击的情况完全停止，整体风险性降低了。所有点击都限制在移动设备内。尽管一些风险观念问题仍然存在，但这些通过与前两个案例中讨论的类似的方法，即结合技术干预和个性化解决方案得到了解决。在年底，发生了第三次攻击，其复杂高得多。它捕获的受害者比第二次还要少，考虑到攻击难度的增加和时间跨度的短暂，这将是令人惊叹的。更好的是，受害者是在移动设备上点击链接的，攻击的潜在影响被控制在了范围内。得益于这些简单的干预措施，该组织的风险态势已从“糟糕”转变为“防御”。


  这种趋势一直持续到 2019 年和 2020 年，美国中西部和南部市政府都因针对知名科技公司的勒索软件攻击而瘫痪，例如 GPS 供应商 `Garmin`，它遭受了导致其产品和服务业务中断的攻击。攻击者索要
  1000 万赎金，报告显示 `Garmin` 支付了这笔钱。美国许多顶尖大学也支付了类似的费用，包括哥伦比亚学院、芝加哥大学、密歇根州立大学和加州大学。这种情况在
  2021 年持续，并出现了更大的攻击。攻击瘫痪了全球最大的肉类加工商 `JBS`（它支付了 1100 万），以及向美国东海岸大部分地区供应石油的 `Colonial
  Pipeline`（也支付了赎金）。总之，这些说明了即使在应用培训以及第 3 章讨论的所有许多抑制和限制解决方案后，组织在社交工程面前仍然无能为力。每个案例都展示了你如何以一种针对性强、成本效益高、基于证据且集中的方式应用干预，以提高用户的网络韧性。这一切之所以可能，仅仅是因为
  `CRS` 及其相关指标。但这些并不是最佳实践。它们仅仅展示了可能性的。当然，如果你实施了 `CRS`，会有更多可能，而到书的这一部分，你已经准备好这样做了。


  本章将讨论为什么这些趋势正在恶化。我们将检查宏观环境长期变化，这些变化改变了黑客的需求。我们还将讨论“路灯效应”和对复杂的偏好是如何加剧这一问题的。最后，我们将看到网络风险调查（Cyber
  Risk Survey）如何帮助修正并将优势重新转向 IT 管理者。


  ## 优势的倾斜


  在第 2 章中，我们讨论了社交工程人员相对于组织 IT 管理者的四种优势。回顾一下，黑客拥有*信息优势*，这种优势源于他们掌握关于用户的非对称信息。这源于暗网上已存在的大量的用户个人信息，随着泄露和攻击的不断发生，更多的信息被加入。黑客的*知识优势*源于制作引人钓鱼攻击所需的精力较低。它也源于技术资源的可用性，包括程序员和雇佣恶意软件。借此，即使是业余黑客也能设计极其复杂的攻击。




  组织 IT 运营所处的流行信息环境进一步加剧了这些优势。由于各国通知法律的差异以及与泄露相关的法律责任，大多数组织都维持着众所周知的 IT 安全“孤岛状态”，每个人都保持着操作上的沉默。他们从内部的尝试和错误中汲取教训，但很少为他人提供可操作的信息。因此，每个组织在防御每种攻击时都必须经历一条陡峭的学习曲线。


  激励机制让情况变得更加糟糕。组织会因为遭受泄露而受到指责，其 IT 部门和 CEO 会遭到公开羞辱，许多人因此失去了工作。这催生了秘密主义和规避风险心理。它促使组织顺从黑客的要求，甚至支付赎金，并助长了一种“推卸责任”（CYA）文化——在这种文化下，实施某种解决方案仅仅是因为联邦机构建议使用它，或者因为大型组织正在使用，即使该方案缺乏效力。通过这种方式，一旦发生泄露，机构的建议或该方案的先例就可以作为已努力过的证明。


  相比之下，就像涂鸦艺术家展示他们的设计一样，黑客乐于甚至渴望公开他们的利用手段。这为他们带来了更多名声、更多信誉，以及更多愿意为他们的技能付费的客户。黑客不断尝试不同的攻击类型，因为他们不需要承担任何成本或后果。他们在专门的市场和加密平台上使用难以追踪的数字货币交易他们的商品。黑客在学习、分享、协作、适应并繁荣。由于信息和知识上的优势，以及由于信息环境和激励机制有利于他们（就像我们在第一章中遇到的“突格盗帮”（Thuggees）一样），如今的黑客在虚拟抢劫中屡获成功。


  ### 网络安全的未来


  但网络安全的未来看起来更加不乐观。我们还没有修复从根本上就有缺陷的基于密码的认证系统（正如第 2 章提到的，这就是社会工程攻击开始并繁盛的原因）。我们还没有承认这样一个事实：我们目前所进行的安全培训是无效的，而且我们缺乏任何其他通用的、主动解决方案来保护用户免受社会工程攻击的侵害。这吸引了更多实体从事鱼叉式钓鱼。更多的投资、创新和新的人才正涌入黑客领域。市场的变化也增加了复杂性。优势正进一步向社会工程攻击倾斜。


  首先，世界上每个政府现在都意识到了社会工程的价值。他们看到了其在攻击异见人士和对手方面的潜力。过去大多由北朝鲜等流氓国家实施，随后是由于受俄罗斯克里姆林宫、中国共产党、伊朗和叙利亚支持的黑客实施，而现在正由几乎每个主要国家在进行。每个国家都在社会工程方面投入了巨额资金，有些甚至专门设立了整个间谍部门来进行此类行动。


  这助长了营利性黑客服务的兴起，例如以色列私营安全公司 `NSO Group Technologies`、位于尼日利亚的 `Black Axe Syndicate`
  以及位于意大利的 `Hacking Team`。这些机构为各种政府背景的实体执行高度复杂的社会工程攻击。因此，任何人都可能成为目标并被黑入。


  ### 国家支持的社会工程


  这最显而易见的证据是沙特阿拉伯政府穆罕默德·本·萨尔曼对杰夫·贝佐斯发起的社会工程攻击。该攻击表面上是由 `NSO` 使用 `Pegasus`（飞马）进行的，这是一种强大的恶意软件，能够访问手机的麦克风和摄像头，并读取手机上的每一比特数据。`Pegasus`
  是一种“零点击”漏洞，可以通过信息传递感染任何手机，即使使用户没有点击或打开信息。通过使用它，贝佐斯设备中的所有数据都被提取出来，并被用于嘲讽和影响他。这直到贝佐斯在媒体上公开这一事宜后才为人知。这表明，即使是地球上最富有的人，拥有所有可用资源，也无法保护自己免受社会工程攻击。


  当然，穆罕默德·本·萨尔曼并不是唯一使用 `NSO` 工具的国家首。2021 年，一项国际调查新闻计划发现，`Pegasus` 已被世界不同地区的政党和政府机构用于监视超过
  50,000 多名记者、反对政党、活动人士和商人。


  这显示了国家的参与如何改变了社会工程背后的动机。早期更多是由利益驱动的，现在则是为了维护主权和实现国家自豪感。这加强了技术开发者与黑客之间的联系，并创造了一个受保护的技能和供应商的生态系统。另一个例子是
  2019 年的警告，称中国军在华为提供的设备中创建了后门，华为是全球最大的电信设备供应商之一。如果这未被发现，将使中国军队能够访问全球大部分移动通信。


  此类案例揭示了社会工程投资的巨大规模和高风险。开发深度漏洞有大量资源可用，黑客能力有巨大需求，且黑客服务有现成的市场——这激励了更多黑客开发鱼叉式钓鱼和伪装攻击。


  ### 市场主地位与脆弱性


  使天平向社会工程倾斜的第二个因素是技术产品领域少数全球市场领导者的出现。正如我在第 2 章中讨论的，拥有几个主系统使得投入资源为它们开发漏洞变得更具价值。例如，通过开发一种可以通过弹出广告黑入
  `Windows` 机器的勒索软件，多年来印度新德里的一个社会工程团伙利用十几个电话中心诈骗了全球计算机用户数百万美元。他们花费精力只开发这一个漏洞，因为该系统在全球范围内重复使用。这个勒索软件团没有被
  `Microsoft` 检测到。直到 2020 年 3 月，当《BBC 新闻》的一份卧调查报告揭露它后才被停止。此类漏洞可能会持续存在，因为世界技术领域似乎正在向少数几个主导全球的玩家集中（例如用于社交媒体的
  `Facebook`、用于零售的 `Amazon` 和用于搜索的 `Google`）。


  此类攻击由于缺乏保护用户数据或强制安全标准的通用法律而变得便利。随着越来越多的硬件和软件产品在全球遥远的国家进行编程或组装，违职员工盗取数据、外国对手注入恶意软件以及组织在不考虑产品实际使用地法律的情况下挖掘用户数据的几率已经增加。数百万美元的
  `IRS` 电话诈骗案也是如此，该诈骗也是另一个黑客小组在印度实施的（见第 2 章）。这些诈骗者拥有从印度外包供应商那里获取的美国消费者机密信息。





  进一步推波助澜的是缺乏全球通用的泄露通知标准。这意味着，存储在发展中国家的美国消费者数据泄露可能永远不会曝光——使消费者暴露在未来的风险之中。因此，当美国消费者的数据从
  `India` 的一家后台外包商处被盗时，我们可能在美国永远听不到相关消息。此外，由于各州对泄露通知的指令性规定，即使美国的一家机构获知泄露，他们也可能永远不会向客户坦白。随着机构继续将编码、产品开发、后台运营甚至托管安全服务外包给低成本国家，这种趋势可能会变得恶化。


  每一个中间环节都增加了数据通过的设备数量，这显著增加了黑客可以利用的潜在位点，以及拥有特权访问权限的用户数量。这缩短了黑客与授权用户之间的距离——正如我们在第
  2 章中所知，这是一个关键问题——并降低了成功泄露的概率。


  第三使天平向社会工程倾斜的因素是不断扩张的技术能力。这包括对现有能力的挖掘以及新发明的利用，这些发明正在改变捕获用户数据的范围和规模。以相机为例。在 21 世纪
  10 年初，`iPhone` 前后均带有摄像头是革命性的。今天，几乎每个电子设备都包含一个或两个摄像头。平板电脑、智能街道、家用安全系统、汽车、车库门开启器、冰箱、手表和门铃都有多个摄像头和麦克风。它们捕捉用户数据、照片、视频、环境音和生物识别信息，并将其存储在各种设备、服务服务器上。正如我们所知，用户数据是互联网的货币，而这些现有技术正在收集日益细粒化的用户数据。它们显著扩大了用户数据的整体市场供应，并随之增加了对利用这些数据的需求。


  量子计算、机器学习 (`ML`) 和人工智能 (`AI`) 的发展正在丰富黑客的技术武器库。许多技术仍处于开发早期，但能够改变威胁格局。例如，已经处于高级开发阶段的量子计算，将使基于
  `Turing systems` 的加密协议失效。它们将使得无视密码和加密级别，破解所有现有计算机都成为可能。目前，量子计算的成本仍然高得惊人，只有财力的国家才能负担。但正如我们从许多技术漏洞的历史中中学到的（例如
  `NSA` 的 `EternalBlue`，它被窃取并在黑客手中引发了 `WannaCry`），量子计算最终也将导致流氓国家和黑客组织在未来的攻击。


  支持这一趋势的证据日益增，表明一些黑客正在使用开源的 `AI` 和 `ML` 程序来个性化鱼叉式钓鱼攻击。此类攻击可以根据每个用户的浏览习惯和在线数据轨迹实时改变其说服力。因此，黑客使用量子系统破解密码只是时间问题——这将永远改变网络安全的面貌。^(9)


  使天平向社会工程工程师倾斜的最后一个因素是新型组织实践的兴起。这些做法在环境不确定性的推动下被迫引入现实。`COVID-19` 疫情就是一个说明性的例子。它证明了远程工作对于组织连续性和生存的重要性，并在全球范围内开启了虚拟工作模式。即使在传统上不允许这种做法的公司中（例如律师事务所和医疗诊所），用户现在也被允许在消费级计算网络上，通过家用互联网接入门户和设备在家办公，而这些设备位于组织网络的安全防护之外。用户还无顾忌地被他们自己选择的物联网
  (`IoT`) 设备包围，使用共享设备，并在完全脱离受过训练的 IT 人员范围内执行网络操作。IT 管理对用户的控制（正如我们所知，这种控制早已被侵蚀）现在几乎完全丧失。那些曾经挡在社会工程工程师道路上的人已不复存在。


  但尽管趋势表明社会工程的威力日益增强，但其势头是可以受到抑制的。为了这一点，我们需要改变现有的观念，即认为一刀性的培训或技术“万灵药”可以解决问题。但我们为什么继续用这些术语来思考呢？下一节将解释原因。


  ## 复杂性偏误 (THE SOPHISTICATION BIAS)


  1990 年 3 月 18 日圣帕里克节午夜，两个个人进入了位于马萨诸塞州波士顿的 `Isabella Stewart Gardner Museum`。在这场演变为美国历史上最大的艺术品案中，他们偷走了价值
  5 亿亿美元的无价艺术品，这些作品至今未被追回。


  盗犯的目标是非常具体的艺术品，并且完全清楚它们的位置。这对双人首先前往二楼的 `Dutch Room`，偷走了 `Rembrandt` 的五幅著名作品（包括一幅自画像），然后是一幅
  `Vermeer` 的杰作，那是他一生中仅画作的 36 幅作品之一。他们走到同一楼层另一侧的另一个房间，拿走了五幅 `Degas` 的作品和一个装饰在旗杆上的鹰形顶饰。在途中，他们路过了
  `Michelangelo` 和 `Raphael` 的作品，但没有触碰它们。最后，他们来到一楼，偷走了一幅 `Manet` 的作品。


  盗犯了解博物馆的运作机制、安全系统和守卫。他们知道晚上有两名守卫，并将他们锁在地下室里。他们知道红外运动检测设备和闭路电视摄像头是如何运作的。在离开之前，他们拿走了录像带，摧毁了报警器，并移除了运动检测设备上的打印输出。在偷取
  `Manet` 作品时，他们甚至设法规避了一楼的运动传感器。我们之所以知道这些，仅仅是因为在电脑硬盘上发现了一份红外运动数据的备份。现场没有任何其他东西：没有指纹，没有影像，没有线索。只有破碎的画框和碎裂的玻璃。


  但这场劫持是复杂的吗？初看之下，是的。它必须是复杂的。它是经过严密计划和执行的。博物馆配备了先进的传感器和摄像头，并有守卫巡逻。然而，盗犯他们设法绕过了这一切。他们花了
  81 分钟作窃——这对于平均只需 5-7 分钟的艺术窃窃来说是一个世纪。他们还成功逃避了三十多年。由于艺术品如此著名，如果没有人认出它们的来源，是不可能出售或展示它们的。策划这场劫持的人不仅要知道如何偷，还要知道如何卖艺术品。


  盗犯是如何做到的？通过先响门铃。盗犯伪装成波士顿警察，声称正在检查报告的骚乱。安全守卫为他们开了门。根据博物馆安全主管兼首席调查员 Anthony Amore
  的说法，“马萨诸塞州其他所有拥有伦勃朗画作的博物馆都曾被劫过。”^(10) 加德纳博物馆甚至知道自己的收藏品是一个目标。然而，当晚只有两名安全守卫在保护它。那里有一个报警警察的按机，位于守卫桌旁。一旦这个守卫离开桌子去开门，他就再也无法使用它。盗犯制服了他，要求他呼叫另一名巡逻的守卫，并将他们都铐在了一起。然后他们就可以在博物馆里横行。整个盗窃之所以可能，是因为守卫相信真的是警察并让盗犯进入了。。美国史上最大的艺术品盗案是简单社会工程的结果。






  除非你关注细节，否则这一点并不显而易见。我们倾向于思考这起抢劫案的复杂性：它是如何被计划和执行的，艺术品又发生了什么。这导致了**复杂性偏差**（sophistication
  bias），即问题、事件或情况的复杂性压倒了我们的推理能力。有时，这种偏差是故意的，因为调查人员或媒体呈现情况的方式如此。而在其他时候，事件中的某些特性将我们引入其复杂性之中，使我们难以看到本质。结果就是产生了一种远离简单的偏见，而且这种情况在网络安全领域发生得更为频繁。


  ### SolarWinds 入侵事件

  让我们来看看现在被称为本世纪最大的网络泄露事件。2020 年 12 月 8 日，网络安全公司 `FireEye` 宣布，其用于全球数千家机构进行渗透测试的工具被一个俄罗斯国家支持的黑客行动所盗取。在调查盗窃事件时，他们发现了黑客使用的通道。那是一个由
  `SolarWinds` 开发的名为 `Orion` 的网络监控软件程序。`Orion` 被其他 33,000 家机构使用，包括美国财政部、国务院、商务部、能源部以及
  250 个其他联邦政府机构和国防承包商。它还被 `NATO`、欧洲议会、`Microsoft`、`Intel`、`Nvidia`、`Cisco`、`Belkin`
  和 `VMWare` 使用。


  出于某种原因，黑客渗透了 `Orion` 的软件并在其核心构建中注入了恶意软件。随后，它作为 `Orion`软件更新的一部分进入了用户网络。由于恶意软件现在是官方软件的一部分，该软件可以访问的任何内容黑客都可以访问。例如，由于
  `Orion` 与 `Microsoft Office 365` 集成，黑客可以访问所有的电子邮件和 Office 文档。


  该恶意软件的设计也非常精妙。它在静默数日之后，才会安装额外的漏洞利用工具，允许黑客在网络中移动。它搜索单个设备内的证书，并获取了存储文件的云服务的官方访问权限。然后，恶意软件会小量加密并外泄数据以避免检测。它甚至将文件存储在位于美国的服务器上（如
  `Amazon` 的 `AWS`），以此规避美国国土安全部开发的更先进的早期警报系统，这些系统会追踪文件的最终去地。


  这使得攻击规避了长达九个月的检测。虽然我们仍然不知道——可能永远不知道被盗取数据的真实规模，但据认为这次泄露影响了 18,000 家机构。`Microsoft`
  对泄露事件进行了分析，并得出结论：这是史上最复杂的攻击，需要至少千名软件工程师的努力才能完成。


  ### 分析复杂性

  但它到底有多复杂？诚然，编写这种恶意软件需要大量的技巧和能力，但即使是我们在介绍中讨论过的索尼影视娱乐（SPE）恶意软件，也需要索尼内部任何人都都无法比拟的编码技能。此外，参与
  `SolarWinds` 攻击的俄罗斯黑客被认为与 2016 年入侵民主全国委员会（DNC）的是同一小组。正如你可能从第二章记得的，他们曾使用一个 14 岁的加拿大青少年来实施鱼叉式钓鱼攻击。我们尚不清楚他们是否再次使用了这种策略。毕竟，这在过去对他们是有效的。但根据我们所知，他们可能根本不需要它。


  攻击的复杂性往往与执行该攻击所需的技能相混淆。然而，许多高的泄露事件依赖于简单的方法。复杂性往往在于交付方式和环境，而不是代码本身。





  复杂性偏误（sophistication bias）在网络安全领域之所以常见，第三个原因是我们在第三章中讨论过的——该领域由热衷于关注计算技术及其硬件、软件的工程师主导。工程师们喜欢在自己擅长的范围内寻找解决方案，而不一定是在问题所在的地方。这就是“路灯效应”。


  第四个原因是，没有人愿意承认自己很容易被黑入，尤其是安全和技术公司，这些公司被认为应该比街头普通的科技店更懂行、更有水平。许多安全公司的公司的价值高达数亿美元，它们的市值关乎着巨大的大利亡。


  大多数公司也由男性运营，他们在该领域占据主导地位。事实上，10 位网络安全专业人士中，有 8 位是男性。^(15) 许多人不喜欢在被一个使用简单攻击向量的青少年欺骗时感到尴尬并承认这一点。将其归类为“复杂的攻击”甚至是“来自国家的攻击”，可以消除他们承认自身做法存在缺陷的负担。这使得推卸责任变得更容易，也让要求更复杂防御措施的建议变得容易得多。


  这导致了复杂性偏误在网络安全中根深蒂固的最后一个原因——有助于销售更多的计算和安全产品。拥有一场虚拟军备竞赛，其价值比进行基于 `CRS` 的风险评估或使用 `CHI`
  进行网络卫生评估等简单修复方法高出数十亿。根据 Gartner 公司的估计，到 2026 年，AI 增强预计将创造 2.9 万亿美元的业务价值，而区块链技术预计将增长到
  3600 亿美元。^(16) 没有人愿意错过这种增长——无论是技术公司、投资者，也绝不是从推广此类新闻中获益的媒体。他们可以报告新产品的发布，并对下一个将解决我们所有安全忧虑的、高度复杂的“灵丹丸”进行评测。


  网络安全中的复杂性偏误是一个自我服务的循环，它不仅影响我们对事件起因的理解，还延伸到了我们考虑的解决方案上。由于感知到问题的复杂性，我们预期解决方案也应该同样复杂，但复杂的问题真的需要复杂的解决方案吗？悖论的是，并不需要。


  ### COVID-19 与复杂性悖论


  以 2019 年 12 月开始的肺炎 COVID-19 例。它是由病毒的一个更新版本引起的，该病毒在 2003 年的另一次疫情——严重急性呼吸综合征（SARS）中被发现，当时全球范围内感染了
  8,500 人，导致约 495 人死亡。^(17) 命名为 `SARS-COV-2` 的变异株是更强大的杀手。^(18) 到 2021 年底，它感染了全球 28.5
  亿人，导致约 550 万人死亡。^(19) 它毁灭了生命、家庭、经济和国家。


  这种破坏性的在于冠状病毒的复杂性。它们是少数具有基因组校对机制的 RNA 病毒之一。这保护冠状病毒免受可能削弱它们的变异，同时也帮助它们抵抗抗病毒药物。此外，`SARS-COV-2`
  具有特殊的受体，帮助它附着在下呼吸系统。一位病毒学家估计，它进入肺部深处的概率是 SARS 病毒的百倍到千倍。^(20) 考虑到冠状病毒的复杂性，`mRNA`
  产生了一种基于证据的方法。^(21) 这种复杂性导致了……（注：此处原文逻辑似乎存在部分跳跃或重复，已按原意翻译）……它毁灭了生命、家庭、经济和国家。


