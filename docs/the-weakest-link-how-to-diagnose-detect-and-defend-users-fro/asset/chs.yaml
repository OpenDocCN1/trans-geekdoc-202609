  # 5 关键症状


  美国大多数的交通事故都是由驾驶错误引起的。驾驶员犯的错误导致了路口事故的 96% 以及开放路段事故的 92%（1）。


  考虑到这一点，请看看纽约州 198 号公路，也称为 Scaquada 高速公路，它穿过布法罗。如果你在这条高速公路上行驶，极有可能会目睹一起事故，或者如果你运气不好的话，自己也会遭遇事故。这是因为该高速公路
  50% 的开放路段和四分之一之一的交叉口的事故发生率均高于纽约州任何其他道路的平均水平（2）。





  事故就像人心停止泵血一样。这种情况发生在所有人都死掉时（除非他们已经脑死亡），但这并不是死亡的真正原因。它是死亡的症状，而不是关于如何不死的以及长寿的诊断。同样，发生车祸，即使是很多次，也仅仅是一个症状。虽然驾驶员错误可能导致像
  `Scajaquada` 这样的道路发生事故，但其根本原因可能是任何因素，从内部分心到监控不足以及对其他驾驶员行为的错误假设。它也可能由用户无法的外部因素引起，例如天气、能见度、汽车设计、限速和糟糕的街道指示牌。仅仅统计事故数量并不能指责用户的理由。它无助于理解事故为何会发生，或者我们该如何避免它们。然而，这正是我们今天在网络安全领域所做的事情。我们不仅在
  `pen tests` 之后统计用户的“事故”，而且还利用这些事故来诊断并降低网络风险。


  以 `SANS Institute` 为例，它是领先的网络安全培训提供商，在全球范围内认证了超过 165,000 名安全专业人员。`SANS` 开发了一份《安全意识路线图》，其中提供了组织应如何衡量用户网络风险的指南。它要求全球的
  IT 经理追踪一项指标，他们称之为影响指标：未能通过 `phishing pen test` 的人数。这等同于衡量组织内发生的钓鱼事故数量。该指标没有没有其他其他内容——没有原因、没有起因、没有诱发因素，只有事故率。


  此外，`SANS road map` 还要求 IT 经理追踪他们所谓的合规性指标。这包括完成培训的用户数、签署了 `acceptable use policy`（可接受使用政策）的用户数，以及他们完成的现场培训课程次数。它提倡统计垃圾桶中的敏感文件数量、带有密码的移动设备数量以及每个月感染的系统数量。它还包含了两个通过问卷评估的态度问题，衡量用户对信息安全的总体态度，以及用户是否认为他们的同事可能分享过他们的密码。


  这些指标中，没有一个对于诊断导致用户在 `phishing pen test` 中失败的原因有太大价值。它们要么衡量的是不变的行为（例如，每个人都必须签署 `acceptable
  use policy`，而且只需签一次），要么是 IT 部门严格管辖之外的行为（例如，大多数智能手机都需要密码，而 IT 部门并不控制这些密码），而且它们与用户韧性以及在钓鱼测试中失败之间的关系是令人怀疑的（例如：将敏感文件放在垃圾桶里会减少钓鱼失败率吗？对网络安全的积极感受或对同事的不信任会转化为网络安全吗？）。如果我们用纽约州布法罗的汽车驾驶员来类比，我们的合规数据就是获得驾照的驾驶员人数——即每个人——而影响指标就是他们是否发生了事故。因此，`SANS
  road map` 的核心是对钓鱼事故率的衡量。它是网络风险的衡量标准，也是对 `phishing pen test` 影响的诊断。


  `SANS` 在提倡这一指标方面并非孤单。它通过汇集积极参与安全意识培训的安全专业人士的建议制定了该指南，因此该路线图是一份共识文件，反映了网络安全专业社区的判断。在第
  3 章中，我们讨论了像 `Intel` 和 `Department of Homeland Security` 等组织如何同样将 `pen-test failures`
  作为用户脆弱性和风险的主要指标。因此，组织无论大小或地位如何，都依赖于同一个指标。它们仅仅是统计事故，仅此而已。它们不仅统计事故，还把症状作为用户风险的诊断。因此，世界上没有任何一家大小的组织能够有效诊断出为什么他们的用户会对钓鱼攻击产生脆弱。结果是，他们仍然处于脆弱状态。


  有一种好得多的方法诊断用户为何会对钓鱼攻击产生脆弱。在第 4 章中，我们讨论了这种研究发现了一个重要的发现，即某种认知过程可以捕捉人们是否会受到网络工程的欺骗。这种过程基于因素。更好的是，它可以作为衡量网络工程脆弱性的指标，正如熟悉的
  `Jenna` 和 `Carson` 的故事。


  ## JENNA 与 CARSON 的故事





  珍娜和卡森之间存在着一条共同的线。这是一种触发在他们身上的怀疑心理过程：在珍娜身上，这种怀疑源于对被背叛的恐惧；而在卡森身上，则是源于停放的警车和救援车辆。


  怀疑是由环境中的信息线索引发的不安感。线索的范围从显而易见的（警车和救援车辆）到细微的（票根和香水味）不等。这些线索可能是视觉的（如卡森那样），也可能是听觉的甚至是嗅觉的（如珍娜那样）。它们单独或共同触发了与记忆中某段经历的联系——那些经历在类似的情况下导致了不愉快的结果。这种在特定情境下由视、听、嗅觉引发的不安感，就是怀疑。


  怀疑一旦被激发，它就会引导大脑寻找信息——而且是大量的信息。这是因为怀疑的触发因素根植于负面事件，而人类天生就为了从中学习并避免它们，因此一旦它被激活，减少不安感就成了驱动力。我们通过唯一的方式来追求这一点：通过获取信息。但由于有经验可以借鉴，所获取的信息会更加细致和经过深熟。我们在珍娜和卡森身上都看到了这一点，他们的触发因素都是过去中学到的。两种情况下，怀疑都增加了他们对信息的敏感性。这种敏感性增强了信息获取的量和质，从而增加了个体检测到欺骗的机会。


  怀疑不仅作用于个体，也作用于群体。想想陪审团审判，这是美国刑事司法体系的基石原则，一个由 12 名成员组成的群体代表社区意愿，负责判别一个人是否有罪。审判律师认为，陪审团讨论的时间越长，他们做出有利于被告判决（即判定无罪）的机会就越高。任何审判都需要辩方呈现信息，并对原告律师向陪审团陈述的内容寻找漏洞。请记住，双方都呈现了大量信息，这些信息通常是冲突的，需要经过集中的解读才能得出真相。但无论呈现了什么，不论是为了支持还是反对律师的客户，只要陪审团不情愿审查这些信息，它们就毫无意义。


  那么，律师如何确保一群完全陌生的人对与他们没有直接关系的信息进行审议呢？一个优秀的辩护律师会激发陪审团的怀疑，因为一旦怀疑被激发，他们更有可能评估这些信息。


  怀疑是一个人类心理过程，我们每个人作为个体以及在大小不同的群体中都经历过。它的影响不仅局限于定位危险的街道、寻找受骗者、识破谎言或抓捕罪犯，而是渗透到我们所处的所有空间。这包括网络空间，它在检测钓鱼欺骗中起着关键作用。然而，如果你去寻找关于怀疑的发表研究，会发现寥不多。相反，你能找到的将是心理障碍领域，而非欺骗检测领域。在安全和欺骗研究中，你读到的大部分内容将关于信任的作用，这有许多原因。


  ## 信任的作用


  “你认为总统对美国民众是诚实的吗？”“CNN 或福克斯新闻哪一个作为政治新闻的来源更可靠？”“你认为像 Facebook 这样的科技公司缺乏诚信吗？”如果你曾经参加过民意调查，很可能遇到过这类问题之一。它们衡量的是诚实性、可靠性、可信度和诚信——这些都是信任的不同维度。但你很少被问过是否对总统、媒体或各种组织表示怀疑。为什么，鉴于怀疑具有关键作用，它却没有被更多地询问或研究呢？


  一个答案可以在调查问题的措辞中找到。每个问题衡量的都是信任，因为它有多个方面或维度。除了上述提到的信任类型，还有公信力、真实性、真诚性、信赖、诚意和可靠性。其中许多受到社会学因素（家庭动态、人口统计特征、宗教和文化）的影响，这使得从公共政策的角度来看询问信任变得更有趣。相比之下，怀疑是一个单一且细微的过程。你要么在某种程度上拥有它，要么没有，而且它的影响正如本章后面解释的那样——是在个体内部，而不是跨越社会学因素。


  怀疑没有被询问的另一个原因是信任更为普遍。如果没有对他人的信任，我们就不会离开家，不会在社区里散步，也不会在马路上开车。我们不会去餐厅点陌生人准备的食物，并期望它是安全的，然后使用某个我们只知道名字的实体发行的现金或信用卡进行支付。餐厅及其员工并不知道我们的钱是否具有实际价值，因此不知道他们工作是否值得。信任是使现代社会成为可能的胶水。为了确保信任，我们演化出了法律、政策、货币体系以及警察和法院等机构，正因如此，我们天生就倾向于信任而非不信任。这是一个默认状态。这使得向公众提出关于信任的问题并找到关于某些方面的答案变得更容易。相比之下，怀疑是在特定情境下被触发的，这使得在语境之外对其进行研究变得更加困难。


  第三个原因是怀疑带有负面内涵。问人们是否对某个人、政党或组织表示怀疑被认为是不礼貌的。一直怀疑甚至被视为精神疾病的迹象。因此，怀疑通常在心理障碍的语境下被研究，而不是从检测的角度。


  最后，信任更为稳定。信任他人是我们核心价值观的一部分。每种主要宗教以及许多文化都宣扬信任与宽恕的价值。正因如此，信任一旦形成就会持久。人们因为忠诚、信义和信仰，更容易宽恕违规行为并维持信任。信任的持久性使我们更容易通过调查和投票来衡量它，这些手段要求受访者事后回想想法。这正是怀疑所缺乏的——怀疑受限于情境，对信息触发因素和个人冲动敏感。这使得研究怀疑变得繁琐。它需要仔细且完全模拟情境的实验。它还需要控制变量来识别怀疑所起的作用及其触发因素。与怀疑相比，信任可以通过横断面调查更更容易进行研究，这也是许多关于钓鱼的研究忽略了怀疑而关注信任的另一个原因。




  这是因为尚不清楚信任的哪个维度是问题的根源。人们不信任警察是因为担心他们的专业素养，是因为警察不礼貌，还是因为警察缺乏诚信？除了这些元素之外，是否还有其他重要的信任因素？如果没有一个涵盖信任所有层面的总括性框架，就无法清楚这些因素是什么。这也使得解决信任问题变得困难，因为有太多的子维度未被考虑到和未解决。最后，更重要的一点是，由于信任的多方面性，没有单一的指标可以衡量信任。因此，甚至无法对比不同的建立信任的干预措施的成败，以了解缺失了什么。正因如此，关于不信任警察的辩论已经持续了近二十年。


  解决问题需要一个单一框架的衡量标准来解释它是如何以及为何被触发的。这有助于解释发生了什么以及如何修复。它有助于比较不同的干预措施并校准它们的优缺点。


  这就是怀疑再次发挥作用的地方。无论信任还是不信任，无论其维度如何，都会触发怀疑，而且有一个单一的框架可以全面解释怀疑是如何触发的，以及在不同语境下什么触发了怀疑。接下来将讨论这一在网络钓鱼欺骗背景下开发的框架。


  ## 研究怀疑在网络钓鱼欺骗与检测中的作用


  用户如何区分真品与伪品？真实与伪造之间的区分发生在用户的脑海中，体现在他们的认知和行为中（点击、打开等）。某些线索有助于攻击者，而另一些则会令他们挫败。理解这一过程并识别辅助欺骗和检测的用户级因素，成为我长达十年网络钓鱼研究计划的唯一目标。


  正如我在第 4 章中解释的那样，在线线索大部分是视觉的。它们的范围从文本（输入的单词和短语）到图形（从 GUI 到标志的所有所有内容），再到偶尔出现的通知音和警报声。此类线索存在于网站、电子邮件和应用程序中。它们存在于真实的网站和通信中，也存在于社会工程的邮件、消息和请求中。我的研究模拟了不同的社会工程攻击，每种攻击都由不同的线索构建而成，并在不同的用户上通过控制实验对其进行了测试。


  这是一项枯燥的工作。它需要捕捉用户内部的认知行为过程，通过这些过程，在不同设备（平板电脑、智能手机、个人电脑、笔记本电脑）上接收到的不同线索（视觉图形、通知、通知音、交互图标、按钮、语音）和通信，通过不同的攻击网关（电子邮件、短信、社交媒体、USB
  丢弃、电话），导致欺骗或被检测。这无法通过单项研究完成。它需要多项研究，每项研究都对不同目标小组（这些小组已加入并获得人类受者审查委员会批准参加测试）模拟实际攻击。


  每项研究环环相扣。发现为完善下一次攻击和下次研究提供了起点和脚架。例如，在我的某些社会工程攻击中，向不同组织的大学生和成年员工发送了网络钓鱼攻击，这些邮件中仅有文本信息（类似于尼日利亚类型的预设攻击），或者另一种仅有图形线索。这有助于识别线索是否重要，或者邮件中仅凭文本是否足够。另一组研究伪造或创建了知名品牌的假网站和表单邮件，在保持内容不变的情况下，更改了颜色、标志和图形等各种视觉元素。视觉效果中包含了早先研究中的线索，以及关于用户对调查问卷（询问他们是否这样做）的回答的衡量，这有助于理解用户在回答时是否诚实。这确保了得出的结论是有效的。


  这花费了多年，而且并非没有失误。有些研究导致了死胡同。例如，用户的性格因素、性别和地理位置并不重要。邮件中文本的说服力、拼写情况，甚至好奇心等因素也微乎其微，但它们是重要的路标。它们引导研究走向最终终点——揭示用户内部欺骗或其检测的机制。迭代的研究过程确保了通过这一过程识别出的机制体现了攻击内部和用户内部最重要的因素。它有助于确定攻击为何成功、用户如何对其做出反应，以及他们反应的显著认知行为预测因素。





  所有这些相互关系及其影响都可以通过单一的研究框架来捕捉，该框架全面解释了用户是如何被各种钓鱼攻击欺骗的。我将其称为“怀疑-认知-自动化模型”（Suspicion,
  Cognition, Automaticity Model，简称 SCAM），如图 5.1 所示。(6)


  ![图 5.1 ¶ 怀疑-认知-自动化模型 (SCAM)。 来源：Vishwanath 等人 (2016)。](img/Figure_5-1.png)


  图 5.1 ¶ 怀疑-认知-自动化模型 (SCAM)。 来源：Vishwanath 等人 (2016)。


  ## SCAM 框架展示了什么


  总的来说，`SCAM`框架中一致出现的一个用户级因素是：产生怀疑的用户遭受社会工程攻击的概率显著更低。怀疑是由支持性思维触发的，而这些方式是指由媒体使用的仪式和模式触发的自动、无意识的反应。这些反应基于用户在在线时可以行行的自我调节或自我控制。


  这些因素如何影响用户受欺骗和检测在模型中所示，模型从左到右读取，影响通过 `CRBs` 和自我调节对认知处理和习惯的影响进行流动。认知因素和习惯因素最直接地触发怀疑。因此，它们是影响链中的直接或近端因素。`CRBs`
  和自我调节源于更长期的力量，例如对技术和一般生活的以往经验，这些经验导致了性格以及技术信念的形成。它们是模型中的最终因素。


  近端因素也具有情境性，因为情境变量会影响它们。攻击中呈现的线索（如其可用性 `availability`）以及它们与用户的相关性（如其在记忆中的可提取性 `accessibility`）会直接触发用户脑中的启发式法。（我们在第四章关于启发式处理的讨论中讨论过它们为什么重要。）关于社会工程的知识和先验经验会影响系统化处理的质量。使用智能手机以及相关因素（如使用的操作系统、组织内部文件传输的工作规范，或媒体使用仪式，例如将多个不同的电子邮件账户合并到一个邮件应用程序中，或不想看到未读邮件计数）会影响习惯显现的程度。


  所有这些过程都在几秒钟内响应意识反应或通过习惯无意识地发生。模型中的因素也会相互递归影响。这意味着尽管模型被显示为单向流动且只发生一次，但事实并非如此。我们思考、看到证据，然后根据所看到的再次思考。这些是在循环中发生的。针对怀疑，用户可能会投入认知努力来发现欺骗，这可能会增加怀疑，并可能进一步增加怀疑。




  首先，怀疑不需要多次测量。在本章开头介绍的珍娜和卡森的故事中，他们都产生了怀疑，但将此与“信任”进行对比——信任是研究人员在检查欺骗时最倾向于衡量的因素。在珍娜的案例中，她的怀疑源于对浪漫关系中诚实和正直的需求；而卡森的怀疑则源于信任的另一个侧面，即他对对社会机构（如维护公共安全的警察）的信任。这是三种不同的信任类型，而且背后可能还有更深层的类型。可能存在詹姆斯对种族的信任，或珍娜对男性伴侣的信任，而对这三个明显的信任维度的测量无法捕捉这些。然而，即使我们测量了信任的所有五个维度，问题也会变成可比性问题。珍娜和卡森经历的是相同的信任维度——这意味着测量结果混淆了不同类型的信任。相比之下，怀疑是一个单一的过程。我们可以通过单一简单的测量方法来捕捉它，并理解珍娜和卡森的心理过程。


  其次，怀疑会在各种环境下被触发。因此，作为一种跨攻击背景的衡量标准它是有效的。这一点非常重要，因为社会工程攻击涵盖不同的媒体。它们主要使用电子邮件和即时消息平台，但也使用电话、USB
  盘、Wi-Fi 欺骗和其他手段获取用户或其凭据。


  第三，怀疑的先决因素不在技术中，而是在用户身上。怀疑的最终影响局限于用户的脑海。它们存在于用户的习惯、内部调节过程、认知处理方法以及他们的网络风险信念中。当我们衡量怀疑时，考虑了所有这些因素。技术对欺骗的影响通过这些本地化的影响因素产生，这意味着它也被考虑在内。此外，某个组织今天拥有什么技术，或者明天会演变成什么样，并不重要——怀疑的测量不需要为了适应技术而改变。


  第四，怀疑是一个非常敏感的心理过程。正如我们在珍娜和卡森身上看到的，少量的怀疑就足以启动它。这使得该指标成为捕捉环境细微变化或失误的理想工具，这些变化可能会揭露欺骗。这是必要的，因为许多社会工程攻击（尤其是那些复杂的攻击）都经过精心设计。衡量怀疑允许我们捕捉这些攻击中导致欺骗的即使是最细微元素的影响。


  第五，一旦触发，怀疑会导致信息获取和相关行为不成比例的增加。因此，衡量它允许我们不仅评估任何个人对社会工程攻击的脆弱程度，还能评估他们对攻击的可能反应。我们可以识别出用户可能寻求的内容类型、他们可能会在哪里寻找这些内容，以及如何包装以满足他们的信息胃口。然后，我们可以帮助在已知用户会寻找的地方提供此类解决方案。


  第六，怀疑会在不同的类比场景中再次发生。就像珍娜一样，一旦浪漫伴侣经历过不忠，他们在下一段关系中就会变得更加谨慎，甚至能更快地发现欺骗的迹象。对于那些不幸在城市街道上遭遇过犯罪的人来说也是如此。他们正如俗所说的，“一朝被蛇咬”。因此，怀疑是预测某人在未来类似情况下可能如何思考和行动的一个很好的指标。


  此外，由于怀疑的触发因素是通过先前的不愉快经历学到的，为了避免重复这些经历，其线索会被牢牢地刻在用户的记忆中并易于提取。这使得人们能够准确地回忆起他们依赖的特定线索——卡森和珍娜都做到了。因此，怀疑的单一测量不仅可以用于确定谁可能落入社会工程陷，还可以识别他们错过的、本该触发怀疑的线索。这些知识可以用于开发新的干预措施，从源头上（即用户的认知或行为）修复此类缺陷。


  最后，由于怀疑可以可靠地回想起，因此可以基于自我报告进行测量。由于其表现的单一性，我们可以使用一个从“完全不怀疑”到“非常怀疑”的标准调查问题来衡量。这使得以一种明确且直接的方式捕捉怀疑被唤起的程度成为可能。这与现有的通过计算渗透测试失败来提供二元通过失败数据的方法形成了鲜明对比。


  因此，衡量怀疑解释了用户脆弱性的如何和为什么。它告诉我们用户如何联系攻击中的线索，以及哪些线索和内部过程导致了欺骗或检测。这解释了为什么有些人落入了陷阱而另一些没有。它还帮助我们预测谁可能陷入类似的攻击。通过解释和预测，怀疑允许我们识别出需要保护的弱环节。通过告诉我们如何以及是谁，它允许我们开发适用于他们的解决方案，并在用户寻找的地方提供。通过这种方式，衡量怀疑允许我们诊断用户对网络钓鱼的脆弱性。我们如何做到这一点将在第
  6 章中解释。


