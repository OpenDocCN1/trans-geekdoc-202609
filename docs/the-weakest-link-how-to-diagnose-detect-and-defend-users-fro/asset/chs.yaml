  ## 社会工程学的演变


  是什么将图格教（Thuggee）与 21 世纪联系在一起的？要回答这个问题，我们需要回到 19 世纪。那是工业革命时期，图格教已经兴起。


  并不是所有人对此都感到高兴。那是 AT&T 垄断时期，整个美国电信网络由贝尔系统运营。当时人们无能为力，但有一个群体做到了。他们开始抢劫这些公司。他们自称为“电话诈骗者”（Phreakers）。他们的手艺“电话工程”涉及通过绕过电话费拨打未经授权的本地和长途电话。


  20 世纪 50 年代，从纽约到洛杉矶的 10 分钟电话费用为 6.70 美元，折合今天的价值为 70.18 美元。根据美国海军学院的网络科学计划，*社会工程*（social
  engineering）一词大约是在那时首次出现。英国经济学家约翰·格雷（John Gray）在他 1842 年的著作《解决国家困境的有效良方》中使用该词，描述工程师如何处理社会问题。通过利用他们的先进知识进行研究、影响和注入纠正措施，他们可以工程化地解决难题，就像修理蒸汽机一样。这就是亨利·斯莱曼（Henry
  Sleeman）刚刚用于图格教的方法，这也是社会工程学在未来一个世纪的定义，直到另一群在另一个革命（这次是由电信引领的）中的劫重新定义了它。


  斯莱曼对抗费林格亚的成功被英国媒体大报道。它丰富了深受殖民掠夺的英国读者的想象。斯莱曼的报告甚至启发了菲利普·梅多斯·泰勒（Philip Meadows Taylor）在
  1839 年撰写的畅销民族虚构小说《图格者的自白》。他建立了图格教与盗匪部门，并任命威廉·亨利·斯莱曼为首任。斯莱曼是一位对语言天赋的天军上尉，开发了情报收集技术。他培养线人、绘制家族谱，并最终破解了他们的。在几年内，运行了近几个世纪的图格教派被完全消灭。不久后，他抓获了
  1400 名其他教派成员并随后将其处绞。





  大多数电话黑客（phreakers）都是工程专业的学生——这一领域在 20 世纪 50 年和 60 年代兴趣蓬勃增长。在过去的几十年里，工程师约占学生总数的 3%，而现在已超过了
  12%。该领域培养的学生人数也是以前的两倍，其中大多数人计划在蓬勃发展的电信行业工作。初出茅道的电话黑客在课堂上学习了电话信号系统——即脉冲、调音和频率如何工作以拨打电话。


  他们开始通过不同的方法模仿在学校学到的信号系统。例如，一位名叫乔·恩格雷西亚亚（Joe Engressia）的电话黑客虽然是个盲人，但他能吹口哨并模仿音调。其他人则尝试不同的乐器。关于哪些方法有效的信息通过通宵电话会议和诸如
  `TEL`（电话电子线路）之类的通讯进行分享。他们就像涂鸦艺术家一样，自豪地展示自己的技能。随着时间的推移，这导致了不同类型的电子设备，被称为“黑盒、蓝盒和红盒”，这些设备可以记录并出售用于免费拨打的不同音调。他们将这些卖给其他电话黑客和消费者，激发了更多对电话黑客的兴趣。


  起初，电话公司并不在乎。他们试图通过法律手段来恐吓电话黑客。在失败后，他们开发了内部欺诈监控系统。一个名为 `Project Greenstar` 的系统在 1964
  年到 1970 年间监控了 3300 万通电话，并监听了超过 200 万次对话——这在今天被认为是是非法的。但它帮助他们最终掌握了电话黑客的真实规模。


  这引发了一场猫鼠游戏，电话公司（在 `AT&T` 分拆后变为复数）利用更新的频率、通话跟踪器和执法开发了技术反制措施。反之，电话黑客变成了 `Thuggees`（街头党）。他们潜入
  `Bell South` 办公室，接上自己的电话线，伪装成员工参加电话公司的会议，并翻找公司的垃圾桶以寻找秘密信息。他们发现某些频率（例如美国网络上的 `2,600
  Hz`）可以提供操作员访问网络的权限——这比于获取当今计算机网络的管理员权限。当电话公司使用数字滤波器并屏蔽这些频率时，电话黑客开发了战争拨号技术，创建了自动扫描器持续探测全球网络，寻找仍然易受电话黑客攻击的开放频率，然后通过这些频率进行路由通话。


  随着 20 世纪 80 年代大型机的出现，电话网络开始采用加密协议和更复杂的验证方法。作为回应，电话黑客开始与新兴计算机科学领域的学生合作，这些学生和他们一样，想要破解或黑入系统。他们在诸如
  `2600: The Hacker Quarterly` 等杂志上记录了他们的努力，该杂志的标题反映了电话黑客与新一代黑客之间新兴的纽带。正是在这个群体中，`social
  engineering`（社会工程）这一术语在 1984 年再次出现——这一次是用来描述欺骗某人使其在无意中泄露技术信息的行为。这也是社会工程获得其更阴暗的含义并进入黑客词汇表的地方。


  这种合作一直持续，直到互联网电话消除了长途通话费用并使电话黑客过时，但到那时它已经影响了许多年轻黑客，包括比尔·盖茨、史夫·沃兹尼亚克和史夫·乔布斯。随着时间的推移，计算机系统变得越来越复杂，黑客回到从电话黑客那里学到的技术——通过社会工程获取对计算机系统的未经授权访问。


  在追踪社会工程演变的过程中，Hatfield 发现了两个新兴的视角。一个受 `John Gray` 等经济学家的启发，关注政府、政党和政府部门通过中心化规划来管理社会变迁并影响社会中人的行为。第二个源于电话黑客。它意味着利用欺骗来获取计算机系统和网络的访问。


  第一种观点导致了经济学、社会学、人类学和政治科学的研究，最终在 20 世纪 90 年代失去青宠，因为苏联证明了宏观层面社会工程的巨大失败。但它的原则仍然非常活跃。从那些旨在戒烟的健康干预到那些让人们运动的干预，它们是今天
  IT 经理正在尝试的基石。


  然而，目前主导地位的是第二种负面观点。从媒体报道到全球范围的讨论，`social engineering` 通常指的是在线欺骗。


  根据 Hatfield 的说法，社会工程的正面和负面概念化许多共同点。它们都涉及到拥有 `information advantage` 和 `knowledge
  advantage` 的个人或群体。信息优势来自于拥有更好的数据和洞察，知识优势来自于拥有卓越的技术。这些使得优势群体取代了其他群体的目标。


  例如，电话黑客最初是从他们参加的课程中学技能的，他们通过通宵会议和通讯互相分享信息。这带给了他们信息优势和知识优势。克服技术问题的快感激励了电话黑客与外部群体合作并分享这些新解决方案——这进一步启发了其他群体这样做。


  但不可否认，电话公司拥有受过更好培训的人员和更的资金，他们本可以借此更早地阻止电话黑客。那么他们为什么没有这样做呢？答案可以在两个额外的因素中找到：`incentive
  framework` 和 `information environment`。


  在 1984 年 `AT&T` 分拆之前，美国的电话系统是垄断。这是一个没有竞争且通过高额溢价获得巨额收入的公司——这种心态在分拆后并没有改变。正如 `Qwest
  Communications Corporation` 总裁兼首席执行官 Joseph Nacchio 在 1997 年接受《商业周刊》采访时所说：“长途电话仍然是美国利润最丰厚的业务，仅次于走私毒毒。”


  因此，没有动力阻止电话黑客。电话公司根本不认为电话黑客会对他们的收入产生影响。直到电话黑客引起媒体关注，电话公司才开始委托进行研究以了解问题的规模。





  然而，这些因素不仅限于电信领域。它们在所有形式的社会工程中都很常见，并决定了欺骗版本或纠正版本的成功。例如，图格教（Thuggees）曾使用伪装技术收集有关他们计划抢劫的商队的信息。他们的信息优势源于他们作为一个教派的组织，拥有秘密仪式、密码语言和信号。这使他们能够在整个印度次大陆的大部分地区共享信息并避免被发现。许多人还来自当地军队的不满士兵。就像
  2003 年美国入侵伊拉克后解散的伊拉克军队中形成了伊斯兰国（ISIS）士兵一样，许多图格教通过军事训练学会了致命技能，这使他们拥有了优势。


  相比之下，商队由于处于不断移动状态，对边界之外的情况了解极少。大多数旅行者的目标是短期的：到达目的地，这一点之后他们的兴趣就结束了。他们从不在意商道的长期安全。


  进一步使商队处于劣势的是缺乏守卫以及能够识别隐藏在图格教的专家。这是因为沿途王国一直处于冲突之中，这为图格教提供了特殊的便利。缺陷在于他们携带武器极少，这是自特洛伊战争以来学到的教训。这扭曲了图格教的信息和知识优势，使其成为容易攻击的目标。


  增加这一切的是商队的业务模式。就像今天的社交媒体平台一样，他们的业务模式是规模。更大的商队吸引了更多寻求安全的游客，这意味着商队聚集了人口——这是一个关键方面——使得图格教更容易加入并利用他们。


  最后，在殖民时代，印度次大陆有近两百种语言和一些方言。商队运输来自不同族群的人并穿过由不同统治者管理的王国。缺乏统一语言和高度碎片化的行政结构使得记录变得困难。许多王国为了保护自己而保留了记录——在现代交通出现之前，没有人真正关心商道发生了什么。事实上，有些统治者甚至雇佣图格教作为佣兵，这减少了他们的暴露。他们故意保持信息环境封闭且私有。这就是为什么几个世纪以来一直有图格教的传闻，直到英国人的到来他们才得到证实。


  亨利·斯莱曼（Henry Sleeman）对图格教的快速成功源于对这些因素的逆转。殖民官员在阿迪斯康伯（Addiscombe）东印度公司军事学院接受过教育，吸收了世界各地的经验。正因如此，斯莱曼精通工程、语言学和调查技术。这种知识优势使他能够设计出新的犯罪画像，并破解图格教的密码。所有殖民者共享英语统一了信息的收集和共享。图格教不知道这种语言，而英语系统教会了斯莱曼，这给了他优势。


  英国人还实行中央管理。这为斯莱曼提供了追踪跨次大陆活动和破解密码的信息环境。他的最后优势是激励机制。虽然每个王国都致力于维护边界完整性，但英国人重视跨国的贸易路线。在铁路发展之前，这是从殖民内陆运回英国的主要机制。换句话说，商道从起点到终点的安全性（而不只是沿途站点）对他们的业务模式至关重要。最终，积极的环境和信息不对称让英国人战胜了印度的图格教。


  ## 网络钓鱼的进化


  猴子很难捕捉。它们比我们更快、更敏捷，并且有对指，这使得大多数动物陷阱很难捕捉。在印度南部，村民使用一种巧妙的技巧来捕捉它们。他们在猴子栖息的树上系上涂有甜米的椰子，等候好奇的猴子被它们吸引。椰子被掏空，开口刚好足够猴子的手掌伸进去抓住米，但小到无法让它抓着满手的米出去。一旦猴子去拿那个无法拒绝的奖励，它就会过度投入任务，以至于忘记松开拳头。猴子最终因为沉没成本谬误而被困住，因为它关注的仅仅是回收已经投入的那块美味。南印度猴子陷阱（在罗伯特·皮西格的哲学小说《禅与摩托车维修术》中普及）的作用并不是通过物理捕捉猴子，而是通过利用它的思维习惯。


  尽管我们人类进化得得多，但我们仍然容易类似的心理陷阱的影响，一些骗子已经开发出巧妙的方法利用信息和知识不对称来创造这样的陷阱。像图格教这样的教派直接利用了战争、动荡和革命，而这些骗子则间接利用了它们。


  在现代国家出现之前，王国之间的边界以及居住在里面的人的财富不断变动。当新的、更强大的领主上台时，总会有附近土地的人失去某人的青睐。在全球新闻服务出现之前，人们通常通过口头、街巷或信件听到此类事件，但没有客观的方法来确认新闻。这种信息和知识的缺口为机会主义者提供了素材。他们围绕这些事件开发了骗局，并利用蓬勃发展的邮政服务执行。


  他们的诈骗信内容如下：“这封信……写得像受过良好教育的外国人写的英语一样，处处有拼写错误，并偶尔用用外语习语。作者因为某些政治罪行身陷监狱。他总是藏有一笔巨款，并总是担心它被找回来……他愿意将隐藏财富的三分之一给找回它的人。”虽然你可能认出这是尼日利亚钓鱼邮件，但这是
  1896 年《纽约时报》的一份报告，描述了美西战争期间针对美国人的诈骗信。






  这些诈骗之所以能成功，是因为人们被暴富的承诺以及获取这些财富所需支付的小额“预付费”所诱惑。一旦受害者提供了预付款，他们就陷入了与困住好奇猴子相同的陷阱中：他们不愿松开陷阱中那具有比喻意义的拳头。潜在奖金的大小以及收回已付费用（即沉没成本）的念头成了他们主要的心理焦点，为此他们愿意多支付一些费用。而诈骗者则不断推迟，并向受害者索要更多钱，受害者也随之加大投入，随着时间的推移，为了追回他们预付的费用而花费了多得资金。


  研究预付费诈骗历史的 `Finn Brunton` 发现，从法国大革命时期就有此类诈骗的报道。^(11)那个时代一个引人入胜的人物——法国罪犯转任侦探 `Eugene
  Vidocq` 描述了这种手段的使用及其相对成功率。他声称：“在一百封这样的信中，总有二十封会收到回复。”^(12)这是一场概率博弈，随着邮政和银行服务的演进，成功率随之提高，诈骗也可以针对更远地区的人。


  从法国开始，预付费诈骗蔓延到不同的战争地区。它们出现在美西战争、俄国革命以及两次世界大战期间。大多数仍然针对地理位置上邻近交战国家的人。但随着电报和无线电的发展，情况发生了变化。诈骗开始利用遥远土地的人，只要新闻在那里能引起共鸣或回应。例如，1922
  年，美国人利用德国战后重建努力的新闻作为目标，他们收到传单，诱骗他们支付小额预付费，以从德国急需投资的破产蒸馏酒厂那里获得家庭酿酒设备。随着国际邮政和全球银的发展，所有此类诈骗的规模进一步扩大。到
  20 世纪 80 年代，诸如 `CNN` 这样的全球新闻网络通过报道世界各地战争和腐败政府的新闻，增加了诈骗的范围。现在，世界上有更多的人熟悉此类事件。


  `尼日利亚`的诈骗者特别利用了这一点，在国家贫困和系统性腐败的驱动下，他们发起了最高产的版本之一。^(13)这种通常被称为`尼日利亚诈骗`的信件自称来自一名下台部长，他在该国近期石油热潮的某些资金中拥有数百万美元的非法回扣，这些信使用伪造邮票寄往全球。故事情节与旧版本的诈骗相似：提供一个当地银行账户并支付小额费用以结算资金，从而换取数百万美元的百分比。和早期的诈骗一样，这也是一种概率博弈，诈骗者向全球寄出数百万封信，希望能诱导少数回复。


  不同之处在于规模。在 1998 年的三个月里，美国邮政检查员在纽约的 `John F. Kennedy` 机场拦截了 250 万封`尼日利亚诈骗`信件；`英国`的检查员拦截了
  150 万封。2009 年，美国邮政检查员在一个包裹中拦截了来自`尼日利亚`的近 50 万美元伪造邮政汇票。^(14)这种巨大的规模使得即使只有一小比例的受害者汇款，也是有利的。


  巨大的规模使得即使只有一小比例的受害者汇款，也是有利的。


  巨大的规模使得即使只有一小比例的受害者汇款，也是有利的。


  巨大的规模使得即使只有一小比例的受害者汇款，也是有利的。





  根据 FBI 网络犯罪投诉中心（`IC3`）的数据，2017 年美国人在在线预付诈骗中损失了近 5 亿美元。其他追踪能力较差、执法力度薄弱、公民知识水平较低以及帮助受害者途径较少的国家，遭受的损失显然更为严重。尼日利亚式诈骗的全球损失估计每年超过
  120 亿美元，可能还有数十亿资金未被报告，因为受害者往往因创伤太深或害羞而未报告损失。在广为人知的报道中，有一位日本商人被诱骗至南非并绑架并索要赎金；有一位捷克退休人员在诈骗中损失了
  60 万美元后，最终杀杀了当地尼日利亚大使馆的一名官员。徒党（Thuggees）、电话黑客（phone phreakers）和预付诈骗在互联网上真正走向成熟。


  与尼日利亚诈骗并行的是另一种攻击。它要简单得多，但也更阴险。它于 1996 年左右在美国在线（`AOL`）上悄悄出现，当时它是全球最大的互联网服务提供商（`ISP`），拥有
  500 万用户。攻击者专注于通过 `AOL` 流行的即时消息服务窃取用户密码，他们冒充 `AOL` 员工并要求用户验证登录和账户密码——即他们的凭据。这种攻击利用了许多由徒党和电话黑客开发的社会工程策略。它采用了身份冒充、使用受信赖的名字作为诱饵，并直接针对用户。新的消息平台让犯罪者保持匿名状态并避免被捕。由于该平台免费使用，他们可以尽可能地撒网，尝试各种信息请求，不断重复并完善，直到捕获到受害者。他们可以收集受害者的凭据创建新的
  `AOL` 配置文件，并利用它们诱捕更多的用户。这种诈骗被称为 `phishing`（网络钓鱼）——表明该攻击根源于电话黑客，并与钓鱼行为相似。


  即使是像 `AOL` 这种每个互联网连接都通过中心化服务基础设施的地方，也无法阻止“钓鱼者”（`phishers`，对犯罪者的称呼）。这个国家最大的 `ISP`
  不得通过在电子邮件和即时消息客户端上放置警告，要求用户保持警惕。当时的领先互联网公司的行为就像是试图阻止尼日利亚诈骗受害者的邮局和银行。`AOL` 社区是网络钓鱼首次出现的地方，也是我们看到组织专注于提高用户意识的地方——这种范式与网络钓鱼一样，持续至今。


  到 2004 年，得益于互联网技术的爆炸式增长——高带宽连接、免费电子邮件服务以及在线购物网站的兴起——钓鱼者开始在 `Yahoo` 和 `Hotmail` 等新的、流行的电子邮件服务上窃取凭据。旧的
  `AOL` 攻击正在迅速演变。攻击者现在正在伪造或欺骗性的电子邮件登录页面虚假网站，并重建在线购物门户网站、银行网站和支付网关，以窃取用户的信用卡和身份信息。


  新旧诈骗者都被这种攻击向量所吸引。尼日利亚的一些预付诈骗者开始组织成网络钓鱼团伙。其中一个团伙是 `Black Axe Syndicate`（黑斧辛迪加）——臭名昭彰的犯罪兄弟会，类似于徒党，专门创建高度可信的、针对性的网络钓鱼活动。与他们合作的是不同的计算机程序员，直到最近他们一直在创建破坏性病毒，但由于防病毒软件的成功，他们失去了主导地位。对他们来说，基于电子邮件的攻击向量非常有吸引力，因为这允许他们专注于构建恶意软件的技艺，同时让像
  `Black Axe` 这样的人使用它。这使得病毒制造者变成了创建“租赁恶意软件”的专家。


  低技术网络钓鱼与高技术租赁恶意软件的结合，形成了一种强大的组合。它将致力于诈骗人的阴险大脑与能够开发复杂漏洞以实现其目标的技术人才汇聚在一起。这吸引了各种类型的攻击者，从小偷和有组织的犯罪团伙到不满的员工、在线活动分子（“黑客活动主义者”）、恐怖组织，最终还有政府间谍机构甚至执法部门。


  一个指示性的例子是 `BellTroX InfoTech Services`，这是一家鲜为人知的印度 IT 公司，向全球实体提供黑客服务。根据 2020 年的一项调查，在七年的时间里，这家公司监视了
  10,000 多人，其中包括 `NSO Group`，后者开发了 `Pegasus`（飞马），这是一种功能强大的恶意软件，可以通过消息应用传输到手机上。攻击始于电子邮件，升级为恶意软件，最终进化为鱼叉式钓鱼（spear
  phishing）。


  ## 网络钓鱼分类


  今天黑客针对组织的基于电子邮件的攻击大致分为两类。一种涉及与受害者进行某种形式的互动、往返通信。这些攻击是预付诈骗的衍生物，使用借口或托词作为诱饵，因此通常被称为
  `pretexting`（预设诈骗）。第二种攻击形式要求受害者打开邮件附件以部署恶意软件、访问掉恶意软件的虚假或欺骗页面，或者在欺骗页面上输入他们的登录和密码凭据。这些攻击利用不同的请求，但与发送者之间几乎没有通信交换。此类攻击通常被称为
  `spear phishing`（鱼叉式钓鱼）。





  # 针对性网络钓鱼与假托借装攻击


  在这两种攻击形式中，针对性网络钓鱼（spear phishing）更具破坏性，因为它携带的负载巨大，而且受害者落网付出的努力极小。用户只需点击恶意超链接或附件即可。在低端，隐藏在附件和网站上的恶意软件可用于收集情报，这随后可能导致更具针对性的攻击。在高端，恶意软件可以提供对用户设备的直接访问，黑客借此在计算机网络中进行横向移动，收集更多信息，泄露数据，甚至锁定网络中所有连接设备，并在“勒索软件”攻击中将整个企业作为人质。


  近十年来，针对性网络钓鱼攻击已经实现了这一切，甚至更多。中国黑客利用它们从洛克希德德（Lockheed）、波音（Boeing）以及其他国防承包商处盗取战斗机蓝图，从安泰健康保险公司（Anthem
  Inc.）等美国大公司以及美国政府人事管理局（OPM）窃取敏感信息。伊朗特工也曾利用其黑入纽约地区的大坝控制器；叙利亚电子军利用其入侵了奥巴马白宫的推特账号；俄罗斯和其他特工则利用其对加利福尼亚和纽约的医院发起了勒索软件攻击。全球媒体报道记录了
  ISIS 恐怖分子利用针对性网络钓鱼定位并暗杀叙利亚同情者，朝鲜黑客则利用其攻击全球银行。它还被用于攻击德国的工业控制系统、乌克兰和以色列的电网、沙特阿拉伯的采石油业务，以及亚洲、欧洲和拉丁美洲的政党。


  虽然针对性网络钓鱼是最受青爱的攻击手段，但假托攻击（pretexting attacks）也变得更加强大。尼日利亚邮件诈骗已演变为通过冒充公司员工或伪装成外部供应商来危及企业。这些攻击更具针对性，黑客会研究目标组织及其运作方式。在一个引人注目的案例中，电视节目《鲨鱼坦克》（*Shark
  Tank*）的主持人芭芭·柯兰（Barbara Corcoran）因一封假托邮件损失了近五十万美元，该邮件伪装了她助手的邮箱，并向会计师发送了一张 40 万美元的发票。由于她的助手习惯在收到邮件后几秒钟内发送此类发票，会计师便汇了款。攻击者知道发票是如何生成的、柯兰的助手是如何发送它们的，以及柯兰的会计师是如何工作的。在另一次攻击中，2016
  年一名黑客假装成 Snapchat 首席执行官埃文·斯皮格（Evan Spiegel），获取了所有现任和前员工的工资数据。在又一起，美国司法部起诉了一立陶宛公民利用虚假供应商发票邮件从
  Google 和 Facebook 收取了价值 1 亿美元的款项。


  当此类攻击与针对性网络钓鱼结合使用时会更加成功。例如针对全球银行金融电信协会（SWIFT）网络的网络攻击，该网络是全球 200 国家 1100 多家银行用于执行银行间交易的专有通信系统。联合国将这些黑客行为归于朝鲜政权，他们从世界各银行盗走了超过
  20 亿美元。


  为了实现这一目标，黑客首先对银行进行针对性钓鱼，并安装后门以秘密潜入其计算网络。接下来，在每个网络中潜留了超过 155 天（其中一个案例甚至超过 678 天），黑客学习了每个银行个人员工的行为模式。利用这些知识，他们使用`SWIFT`消息系统生成邮件，要求银行员工向其他成员银行转账巨额资金。从此，钱款被取走，再也没有出现。这些攻击的策划得如此周密，黑客甚至关闭了这些组织的打印机以消除纸质痕迹。


  如今，钓鱼——包括针对性钓鱼和假托攻击——占据了所有社会工程攻击的近 90%。*Verizon 数据泄露调查报告》（DBIR）是一项追踪两千家机构网络攻击的年度研究，发现
  2019 年报告的泄露事件中，每三分之一是因为钓鱼——这一趋势自 2015 年以来基本保持不变。另一项追踪研究 FireEye-Mandiant 的 2018
  年*趋势报告》（MTrends Report）显示，50%受到社会工程攻击针对的组织似乎在一年内再次受到攻击，表面上精度更高，因为黑客从组织对上一次攻击的反应中汲取了经验。糟糕的是，全球平均停留时间（即成功攻击被发现所需的时间）增加到
  186 天——另一个令人震惊且未改变的趋势。因此，社会工程师继续肆无忌惮地工作，反复攻击，并在大多数设备和网络中隐藏约六个月后才被发现。


  挡在他们路上的是如今的 IT 经理。他们就像亨利·斯里曼（Henry Sleeman），试图保护组织用户并击败虚拟的土匪盗（Thuggees）。但正如我们在第二章中看到的，所有的优势——信息优势、知识优势、信息环境和激励框架——都处于他们的对面。


