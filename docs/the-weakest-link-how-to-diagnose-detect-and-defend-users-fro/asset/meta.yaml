  - 就像烘焙蛋糕
- - '###'
  - 回：要让用户参与，首先要确保他们认可参与 CRS（网络钓鱼测试）的价值。这种价值需要被传达，而且如果这种沟通来自用户信任和尊重的内部人员，效果会更好。此外，IT
    人员也应该将每一次渗透测试视为一个了解用户的机会，而不是为了欺骗他们或向他们展示其无能。这需要鼓励参与而非强制要求。最后，确保参与还需要以一种改进的方式传达
    CRS 的结果，以提高用户的知识水平和对组织网络安全就绪的投入。这开启了一种共同网络安全责任的文化，并有助于提高组织的网络态势。
