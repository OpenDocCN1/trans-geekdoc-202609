  md: 'concept. The business logic of DApp is governed by one or several smart contracts
    with the underlying blockchain. Since the data is decentralized, if one point
    or node in the network is breached, other nodes in the network securely reinstate
    the data. DApps have demonstrated their potential in a big spectrum of applications,
    including IoT [4], financial [5], logistics [6] and social networks [7]. Quality
    business applications consider quality of service (QoS) or user experience, equity,
    or time delay; any failure results in severe loss of trust. Time-critical applications
    distinguish two classes: 1) speed critical (latency) relying on system optimization
    to reach as fast as possible, and 2) timely relying on real-time tracking [8].
    When using virtualised infrastructures, the uncertainty of network infrastructure
    makes it difficult to guarantee the time-critical results.


    Trustworthiness is considered a non-functional requirement for the quality of
    software with user assessments. Trust is commonly assessed through reputation
    systems [9], however, relying on ratings provided by consensus, which can lead
    to mere evaluation results. Other approaches use computational models based on
    sociological and factors of reputation concepts, or formalism [10]. It is still
    very challenging to measure the general trustworthiness of software over the complex
    context of different environments.


    Privacy is another fundamental research challenge in distributed applications,
    Cloud, or Edge computing [11]; diverse privacy regulations involve rules and regulations
    in the same area. Particular quality constraints include energy consumption, e.g.,
    power limits of edge nodes [12], security, e.g., cyber attacks [13].


    The status of Quality Assurance in DApps faces challenges not only of decentralization,
    but also performance criteria:


    +   1) An effective incentive model is needed to credit participants to ensure
    they maintain the fairness of the system. A type has two sides: can prevent malicious
    execution of contracts, however it may become a barrier if there is proportion
    difference between the monetary values and operational overloads.

    2) Decentralised consensus among participants establishes trust to achieve consensus
    (permission) for many public blockchains, the average time for a Bitcoin node
    to make a block is 10 minutes, the average transaction confirmation time is an
    hour (as required 6 blocks). Even with significant response latency reduction
    in Ethereum, such small latency to support interactions of general applications
    is yet to be achieved in public blockchains. Longer


    delays frustrate users, making DApps less competitive with non-blockchain alternatives.


    +   3) Sequential Performance of DApp is determined by the response delays from
    all nodes in the network, since all transactions/operations should be executed
    and verified by all nodes. However, dependencies on software components or logic
    blocks often exist in an application and restrict parallel executions; thus there
    is a need to provide fast sequence processing in order.


    +   4) Blockchain evaluation, e.g., hard fork, is the only current approach in
    order to enable a system wide upgrade, which may result in the limit of participating
    nodes, due to the nature of P2P consensus in blockchain. Another potential issue
    is for a hard fork that involves multiple followers sharing a common origin, which
    will cause conflicts.


    +   5) Security issues in smart contracts are enforced by careful implementation
    and unit testing. Nevertheless, it is hard to guarantee a bug-free non-trivial
    smart contract due to the high complexity in many DApps. However, any bug delivery
    may run into conflict with the immutable nature of blockchain. Here, the related
    plan may provide flexibility in supporting app developers, especially for critical
