    Abstract—Quality Decentralised Applications (DApp) have requirements for performance
    and service quality, involving heterogeneous infrastructures (Clouds, Edges, IoT),
    and rely on the trustless contracts among participants of data sources and infrastructure
    providers. The DApp has to tackle the performance-challenge of blockchain technologies
    due to low collaborative efficiency. On the other hand, the resilience of the
    Cloud has enabled significant advances in software-defined storage, networking,
    infrastructure, and ever. However, the advantages of new hardware accelerators
    (in the infrastructures) can not be effectively utilised for DApp due to lack
    of suitable architecture and programming.


    Index Terms—DevOps, Cloud Computing, Blockchain


    # I. INTRODUCTION


    The recent advances in Cloud computing, IoT, Artificial Intelligence and Big data
    greatly accelerate the digitalisation of business applications towards Next Generation
    Internet ([1]), which


    +   - Seamelessly processing dynamic events when automating business processes
    (e.g., extensive supply chains);

    - Reliability online operations (e.g., crowd story telling current delivery (e.g.,
    in events);

    - Business operations (e.g., risk assessment) during complex decision making (e.g.,
    for financial investment).


    These innovations provide a new paradigm of applications, which have requirements
    for performance and service quality, involving heterogeneous infrastructures (Clouds,
    Edges, IoT), and rely on the trustless contracts among data sources and providers
    to deliver their best value, which can be fully supported by the classical centred
    architecture. We thus call such new paradigm as Quality Decentralised Applications
    (QDApp). Blockchain technologies have demonstrated great potential for realising
    trust (via immutable ledgers and consensus among peers); fault tolerance (no single
    point failure among decentralised nodes) in business applications, and have a
    basis for


    for Decentralised Applications (DApp). However, the current blockchain technologies
    suffer from high cost of ledgers, low collaborative efficiency among peers for
    consensus, and insecure off data sources for blockchain transactions.


    On the other hand, Cloud computing has a major disruptive providing resources-as-service
    for diverse Internet applications. Cloud environments provide not only capacity,
    but also consumability, cost virtual information, over large networks, the resilience
    of the Cloud has enabled significant advances in software-defined storage, networking,
    infrastructure, and every technology, which promotes emergence of heterogeneous
    programmable infrastructures and software frameworks that are interchangeable,
    different Clouds, and to devices, this richness of infrastructure, in particular,
    the advantages of new hardware accelerators in the infrastructures, can not be
    effectively utilized in the development and operations (DevOps) of Quality Decentralised
