    needed in certain circumstances. This has also been recent to work on the ability
    for anonymity on top of blockchains, through regulation and Know Your Customer
    (KYC) and Anti Money Laundering (AML) check without giving up the identity of
    the contributor to the entire global network.


    We can see that DApps demonstrate the potential for applications in the next generation
