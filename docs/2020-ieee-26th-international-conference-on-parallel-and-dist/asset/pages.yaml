    # II. BACKGROUND


    Quality Decentralised Applications (QDApp) focus on software architectures and
    three domains: Decentralised Applications, quality critical systems and programmable
    infrastructures. In this section, we review the state of the art ([1]) DApps and
    quality DApps ([2]), trustworthiness and privacy in digital applications, and
    software technologies for QDApp development, and infrastructure of heterogeneous
    hardware.


    Decentralised Applications (DApp) focus on technologies to realising trust among
    peers, and provide entryless logic at the backend. Blockchain main systems (e.g.,
    transactions among participants) maintain a worldwide and decentralised ledger,
    which updates the ledger through consensus mechanisms among peers (e.g., Proof
    of Work as in Bitcoin ([2]). All the transactions stored on the blockchain are
    public, and immutable. Ethereum is a second-generation blockchain which allows
    a general-purpose program (called a smart contract) to be stored on the blockchain,
    and to be executed through the Ethereum VM'
