  mdcn: "\n\n# 云端可信的基于区块链去中心化资源管理系统\n\nZiming Zhao¹, Chunming Rong¹, 和 Martin Gilje\
    \ Jaatun*\n¹荷兰阿姆斯特丹大学，z.hao@uva.nl\n*挪威斯塔万格大学 [chunming.rong, martin.j.jaatun]@uis.no\n\
    \n 摘要—高质量的去中心化应用（DApp）对性能和服务质量有要求，涉及异构基础设施（云端、边缘计算、物联网），并依赖于数据源参与者与基础设施提供者之间的无信任合约。DApp\
    \ 必须解决区块链技术由于协作效率低带来的性能挑战。另一方面，云端的韧性使得软件定义存储、网络、基础设施和每项技术取得了显著进展。然而，由于缺乏合适的架构和编程方法，新硬件加速器（基础设施中）的优势无法在\
    \ DApp 中得到有效利用。\n\n索引术语—DevOps，云计算，区块链\n\n# I. 引言\n\n云计算、物联网（IoT）、人工智能和大数据的最新进展极大加速了业务应用向下一代互联网（[1]）的数字化进程，这使得：\n\
    \n- 在自动化业务流程（例如广泛的供应链）时无缝处理动态事件；\n- 保证在线运营的可靠性（例如活动中的实时众故事）；\n- 在复杂决策（例如金融投资）期间进行业务运营（例如风险评估）。\n\
    \n这些创新提供了一种新的应用范式，这些应用对性能和服务质量有要求，涉及异构基础设施（云、边缘、物联网），并依赖数据源与提供者之间的无信任合约来交付最佳价值，而这被经典的中心化架构完全支持。因此，我们将这种新范式称为高质量去中心化应用（QDApp）。区块链技术在实现业务应用中的信任（通过不可变账本和点对共识）、容错（去中心化节点间无单点故障）方面展现了巨大潜力，并去中心化应用（DApp）提供了基础。然而，目前的区块链技术面临账本成本高、节点间共识协作效率低以及区块链交易离线数据源不安全的问题。\n\
    \n另一方面，云计算具有重大的颠覆性，为各种互联网应用提供资源即服务。云环境不仅提供了容量，还提供了大型网络上虚拟信息的可消费性和成本。云端的韧性使得软件定义存储、网络、基础设施和每项技术取得了显著进展，促进了可交换的异构可编程基础设施和软件框架的出现。不同的云和设备之间，这种基础设施的丰富性，特别是基础设施中新硬件加速器的优势，在高质量去中心化应用的开发和运维（DevOps）中无法被有效利用。\n\
    \n# II. 背景\n\n高质量去中心化应用（QDApp）关注软件架构和三个领域：去中心化应用、质量关键系统和可编程基础设施。在本节中，我们回顾了最先进的\
    \ DApp（[1]）、高质量 DApp（[2]）、数字应用中的可信性和隐私、用于 QDApp 开发的软件技术，以及异构硬件基础设施。\n\n去中心化应用（DApp）专注于实现点对点信任的技术，并在后端提供无许可的逻辑。区块链主系统（例如参与者之间的交易）维护一个全球且去中心化的账本，通过点对点共识机制（例如比特币中的工作量证明\
    \ [2]）来更新账本。存储在区块链上的所有交易都是公开且不可篡改的。以太坊是二代区块链，允许将通用程序（称为智能合约）存储在区块链上，并通过以太坊虚拟机（VM）概念执行。DApp\
    \ 的业务逻辑由底层区块链的一个或多个智能合约管理。由于数据是去中心化的，如果网络中的某点或节点被破坏，网络中的其他节点将安全地恢复数据。DApps 在广泛的应用领域展示了其潜力，包括物联网\
    \ [4]、金融 [5]、物流 [6] 和社交网络 [7]。高质量业务应用考虑服务质量（QoS）或用户体验、公平性或延迟。由于网络的不确定性，使得在时间关键应用中，满足实时性以延迟的要求是困难的。\n\
    \n可信性被认为是软件的非功能性需求，在复杂应用中通常通过信誉系统进行评估 [9]，但其他方法基于信誉概念或形式化方法 [10]。 隐私是分布式应用（云、边缘计算）中的另一个基础性挑战；特定的质量限制包括能耗\
    \ [12]、安全性（例如网络攻击）[13]。\n\nDApp 的质量保证状态不仅面临去中心化的挑战，还面临性能标准：\n\n- 1) 需要一种有效的激励模型来维护系统的公平性。这种类型可以防止恶意执行合约；\n\
    - 2) 参与者之间的去中心化共识为许多公共区块链建立了信任（许可），但比特币产生区块的平均时间为 10 分钟，交易确认时间达到一小时（需要 6 个区块）。即使以太坊显著降低了延迟，公共区块链尚未实现支持通用交互的小延迟。\n\
    - 3) DApp 的顺序性能取决于网络中所有节点的延迟，因为所有交易/操作都应由所有节点执行和验证。然而，应用中软件组件或逻辑的依赖限制了并行执行；因此需要提供快速处理。\n\
    - 4) 区块链评估（例如硬分叉）是目前实现系统级升级的唯一方法，由于区块链 P2P 共识的性质，这可能导致参与节点限制。另一个潜在问题是涉及共同源的硬分叉，会导致冲突。\n\
    - 5) 智能合约的安全问题通过仔细的实现和单元测试来强制。然而，由于许多 DApp 的高复杂性，很难保证非平凡智能合约无漏洞。在这里，任何漏洞的交付可能与区块链的不可变性发生冲突。\n\
    - 6) 用户和交易的身份很重要，但在某些情况下可能需要匿名性。这最近也致力于在区块链上实现匿名能力，通过监管和了解您的客户（KYC）以及反洗钱（AML）检查，而无需放弃对整个全球网络的贡献身份。\n\
    \n我们可以看到 DApp 在下一代互联网应用中具有潜力；DApp 开发面临着阻碍应用质量需求实现的挑战：\n\n开发和运维（DevOps）工程实现了软件产品的持续开发、测试、集成、部署和运行。它允许团队有效地响应新需求和运营需求，通过自动化整个生命周期的集成、测试和部署过程，不断为应用开发和交付新功能\
    \ [15]。目前有很多理想的 DevOps 解决方案用于此类场景（如 Truffle Suite），但大多数现有工具和技术仅针对特定阶段设计：架构的\n\n"
