    security, trustworthiness, cost and energy. Interactive GUI framework for enabling
    different roles involved in the DApps lifecycle to cooperatively program and manage
    will also be provided:


    The QDDApp Reference Model (QDDApp-RM) provides a multi-viewpoint (by the extending
    OD model) common vocabulary for modelling requirements, modelling architecture,
    and for designing different stakeholders in the development of QDDApp; business
    operators, application component developers, DevOps managers, information specialists,
    and infrastructure providers. Microservices are used to model the functional components
    in a QDDApp for: Functional Units (Units), service quality and performance optimisation
    Units (Units), decentralised Trustworthiness Units (TUnits), Infrastructure Units
    (Units),


