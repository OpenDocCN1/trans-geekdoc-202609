    # A Trustworthy Blockchain-based Decentralised Resource Management System in the
    Cloud


    Ziming Zhao¹, Chunming Rong¹, and Martin Gilje Jaatun*

    ¹University of Amsterdam, Netherlands, z.hao@uva.nl

    *University of Stavanger, Norway [chunming.rong, martin.j.jaatun]@uis.no


    Abstract—Quality Decentralised Applications (DApp) have requirements for performance
    and service quality, involving heterogeneous infrastructures (Clouds, Edges, IoT),
    and rely on the trustless contracts among participants of data sources and infrastructure
    providers. The DApp has to tackle the performance-challenge of blockchain technologies
    due to low collaborative efficiency. On the other hand, the resilience of the
    Cloud has enabled significant advances in software-defined storage, networking,
    infrastructure, and ever. However, the advantages of new hardware accelerators
    (in the infrastructures) can not be effectively utilised for DApp due to lack
    of suitable architecture and programming.


    Index Terms—DevOps, Cloud Computing, Blockchain


    # I. INTRODUCTION


    The recent advances in Cloud computing, IoT, Artificial Intelligence and Big data
    greatly accelerate the digitalisation of business applications towards Next Generation
    Internet ([1]), which


    - Seamelessly processing dynamic events when automating business processes (e.g.,
    extensive supply chains);

    - Reliability online operations (e.g., crowd story telling current delivery (e.g.,
    in events);

    - Business operations (e.g., risk assessment) during complex decision making (e.g.,
    for financial investment).


    These innovations provide a new paradigm of applications, which have requirements
    for performance and service quality, involving heterogeneous infrastructures (Clouds,
    Edges, IoT), and rely on the trustless contracts among data sources and providers
    to deliver their best value, which can be fully supported by the classical centred
    architecture. We thus call such new paradigm as Quality Decentralised Applications
    (QDApp). Blockchain technologies have demonstrated great potential for realising
    trust (via immutable ledgers and consensus among peers); fault tolerance (no single
    point failure among decentralised nodes) in business applications, and have a
    basis for for Decentralised Applications (DApp). However, the current blockchain
    technologies suffer from high cost of ledgers, low collaborative efficiency among
    peers for consensus, and insecure off data sources for blockchain transactions.


    On the other hand, Cloud computing has a major disruptive providing resources-as-service
    for diverse Internet applications. Cloud environments provide not only capacity,
    but also consumability, cost virtual information, over large networks, the resilience
    of the Cloud has enabled significant advances in software-defined storage, networking,
    infrastructure, and every technology, which promotes emergence of heterogeneous
    programmable infrastructures and software frameworks that are interchangeable,
    different Clouds, and to devices, this richness of infrastructure, in particular,
    the advantages of new hardware accelerators in the infrastructures, can not be
    effectively utilized in the development and operations (DevOps) of Quality Decentralised
    Applications.


    # II. BACKGROUND


    Quality Decentralised Applications (QDApp) focus on software architectures and
    three domains: Decentralised Applications, quality critical systems and programmable
    infrastructures. In this section, we review the state of the art ([1]) DApps and
    quality DApps ([2]), trustworthiness and privacy in digital applications, and
    software technologies for QDApp development, and infrastructure of heterogeneous
    hardware.


    Decentralised Applications (DApp) focus on technologies to realising trust among
    peers, and provide entryless logic at the backend. Blockchain main systems (e.g.,
    transactions among participants) maintain a worldwide and decentralised ledger,
    which updates the ledger through consensus mechanisms among peers (e.g., Proof
    of Work as in Bitcoin ([2]). All the transactions stored on the blockchain are
    public, and immutable. Ethereum is a second-generation blockchain which allows
    a general-purpose program (called a smart contract) to be stored on the blockchain,
    and to be executed through the Ethereum VM concept. The business logic of DApp
    is governed by one or several smart contracts with the underlying blockchain.
    Since the data is decentralized, if one point or node in the network is breached,
    other nodes in the network securely reinstate the data. DApps have demonstrated
    their potential in a big spectrum of applications, including IoT [4], financial
    [5], logistics [6] and social networks [7]. Quality business applications consider
    quality of service (QoS) or user experience, equity, or time delay; any failure
    results in severe loss of trust. Time-critical applications distinguish two classes:
    1) speed critical (latency) relying on system optimization to reach as fast as
    possible, and 2) timely relying on real-time tracking [8]. When using virtualised
    infrastructures, the uncertainty of network infrastructure makes it difficult
    to guarantee the time-critical results.


    Trustworthiness is considered a non-functional requirement for the quality of
    software with user assessments. Trust is commonly assessed through reputation
    systems [9], however, relying on ratings provided by consensus, which can lead
    to mere evaluation results. Other approaches use computational models based on
    sociological and factors of reputation concepts, or formalism [10]. It is still
    very challenging to measure the general trustworthiness of software over the complex
    context of different environments.


    Privacy is another fundamental research challenge in distributed applications,
    Cloud, or Edge computing [11]; diverse privacy regulations involve rules and regulations
    in the same area. Particular quality constraints include energy consumption, e.g.,
    power limits of edge nodes [12], security, e.g., cyber attacks [13].


    The status of Quality Assurance in DApps faces challenges not only of decentralization,
    but also performance criteria:


    - 1) An effective incentive model is needed to credit participants to ensure they
    maintain the fairness of the system. A type has two sides: can prevent malicious
    execution of contracts, however it may become a barrier if there is proportion
    difference between the monetary values and operational overloads.

    - 2) Decentralised consensus among participants establishes trust to achieve consensus
    (permission) for many public blockchains, the average time for a Bitcoin node
    to make a block is 10 minutes, the average transaction confirmation time is an
    hour (as required 6 blocks). Even with significant response latency reduction
    in Ethereum, such small latency to support interactions of general applications
    is yet to be achieved in public blockchains. Longer delays frustrate users, making
    DApps less competitive with non-blockchain alternatives.

    - 3) Sequential Performance of DApp is determined by the response delays from
    all nodes in the network, since all transactions/operations should be executed
    and verified by all nodes. However, dependencies on software components or logic
    blocks often exist in an application and restrict parallel executions; thus there
    is a need to provide fast sequence processing in order.

    - 4) Blockchain evaluation, e.g., hard fork, is the only current approach in order
    to enable a system wide upgrade, which may result in the limit of participating
    nodes, due to the nature of P2P consensus in blockchain. Another potential issue
    is for a hard fork that involves multiple followers sharing a common origin, which
    will cause conflicts.

    - 5) Security issues in smart contracts are enforced by careful implementation
    and unit testing. Nevertheless, it is hard to guarantee a bug-free non-trivial
    smart contract due to the high complexity in many DApps. However, any bug delivery
    may run into conflict with the immutable nature of blockchain. Here, the related
    plan may provide flexibility in supporting app developers, especially for critical
    issues that may have system wide

    - 6) Identity of users and transactions is important while anonymity may be needed
    in certain circumstances. This has also been recent to work on the ability for
    anonymity on top of blockchains, through regulation and Know Your Customer (KYC)
    and Anti Money Laundering (AML) check without giving up the identity of the contributor
    to the entire global network.


    We can see that DApps demonstrate the potential for applications in the next generation
    internet; DApp development faces different challenges that hamper the realisation
    of quality requirements for applications needs


    The development and operations (DevOps) engineering enables continuous development,
    testing, integration, deployment and operation of the software products. It allows
