    1) 以知识为中心的应用-质量-基础设施协同开发工具包（KatQDevKit）为 QDDApp 的逻辑和底层虚拟基础设施的设计提供了参考模型、建模工具以及设计工具，并针对性能、可信度、安全性和能耗等约束进行了优化。


    操作单元（KUnits）。一种认知编排器，能够根据性能、能量和安全约束，对异构基础设施中的功能单元进行弹性编排，并具备特定场景下的的自学习能力。DAppsOpsML
    提供了一种了一种开放的描述语言，用于指定 QDDApps（例如去中心化、共识和激励模型）和基础设施（例如资源类型、设备和网络）中的关键服务，以及元素和访问级别（例如服务质量和用户体验）。该语言研究了用于云边计算基础设施的工业标准（如
    TOSCA）和云本体（Cloud ontologies，如 noSAIC），并通过灵活的语义链接对其进行扩展，以识别 QDDApps 的属性和特征。去中心化知识利用底层的跨链机制（将在
    1.3.2 中进行讨论）管理去中心化生态系统中的知识，1) 智能合约基础设施；2) 价格、数据特征的市场；3) 用于开发者、代码和部署以及应用管理的 DApps
    仓库。


    下一节将对这些子系统进行详细解释。


    2) 服务联邦命运信赖跨链（SEFIC）提供了一个基于区块链去中心化的跨链机制和工具，供 DApps 开发者、用户和操作人员以可信的方式有效共享数字资产。


    3) 硬件协同可视化框架（HAR）提供了一个框架，通过虚拟基础设施有效地虚拟化硬件架构（如 GPU 和 FPGA）和架构特性（如 CPU 硬件），以优化 QDDApp
    的运行时性能、安全能耗。


    4) 跨异构基础设施去中心化服务编排器（CEISOR）为开发者提供了工具和 API（应用程序接口），用于在 QDDApp 的生命周期内管理虚拟基础设施的规划、配置、监控和运行。


    # IV. 技术考虑因素


    ## A. 知识应用-信誉-质量-基础设施协同开发工具包 (KATQDEV)。


    以知识为中心的应用-信誉-开发工具包（KatQDevKit）提供了一个可选的关键去中心化应用参考模型（QDDApp-RM），以及另一种名为 DAppsOps
    的开放描述语言（DAppsOps-ML）；2) 一个去中心化的进化知识库；3) 语义搜索和重构工具；以及 4) 约束应用逻辑-质量-基础设施的协同建模。


    语义组件可以有效利用去中心化知识库的各种组件，使软件开发更加灵活（soft in opens）。


    这种用于有效构建质量关键去中心化应用的协同编程模型，它不仅考虑了仅具有应用逻辑和底层硬件特征的应用，还考虑了性能、安全、可信度、成本和能量的约束。还将提供一个交互式
    GUI 框架，以便参与 DApps 生命周期的不同角色能够协作编程和管理：


    QDDApp 参考模型（QDDApp-RM）提供了一个多视角（通过扩展 OD 模型）的通用词汇，用于需求建模、架构建模，以及为 QDDApp 开发过程中的不同利益相关者提供设计：业务运营方、应用组件开发者、DevOps
    管理员、信息专家和基础设施提供者。微服务被用于建模 QDDApp 中的功能组件，包括：功能单元（Units）、服务质量和性能优化单元（Units）、去中心化可信度单元（TUnits）、基础设施单元（Units）。


    ## B. 服务联邦命运信赖跨链 (SEFIC)


    服务联邦定义的跨链机制（SEFIC）平台为构建可信的 QDDApps 生态系统提供了底层账本和智能支持，在该生态系统中，参与者在不依赖中心化权威的情况下进行协作。基础设施提供者可以动态加入或离开生态系统，并将资源作为服务提供给应用开发者和运营。


    服务联邦定义的跨链机制提供了开发和运行 QDDApp 所需的自定义服务工作。它提供了：用于 DApps 之间交易和交互的去中心化账本，包括基础设施资源和资源；2)
    为 QDDApp 提供定制的区块链即服务（blockchain-as-service），通过结合不同的链，根据需求在系统性能之间进行有效权衡。


    ## D. 跨边异构基础设施去中心化服务编排器 (CEIS)


    基于群的可信智能合约为生态系统中的服务提供者和消费者提供了自动执行应用程序所需的机制（例如价格谈判、支付条件和验证条件），并带有激励模型创建可靠性。该模块的结果对于生成提供者的声誉具有重要作用。


    跨边异构基础设施服务编排器（CEISER）为 QDDApp 所需的跨异构云和边缘资源提供了统一且稳健的接口。CEISER 赋予 DApps 智能基础设施规划和管理能力。它利用各种基础设施特性来简化扩展和配置，并提高运营效率。


    生态系统声誉审计器（Reputation auditor ecosystem）提供了一个关注体验和历史的声誉模型，以审计生态系统参与者的行为。结果不仅基于用户反馈，还基于跨云违规报告。


    质量 DAApp 虚拟基础设施容量规划器确保跨软件开发生命周期的持续配置、部署和测试。规划器拥有多种由中心化提供者（如 Amazon 或 Azure）或去中心化提供者提供的基础设施模型。规划器必须根据应用对性能、可信度和伦理的要求执行计划（包括容量和拓扑）。


    ## C. 硬件特性化虚拟化框架 (HAFIR)


    硬件特性化虚拟化框架（HAFIR）为 QCDApp 应用提供了硬件虚拟化和功能容器化。通过采用适当的虚拟化水平（如虚拟机、容器），它为功能提供了自包含的可迁移组件，考虑了需求和可用硬件加速能力（如
    Intel、Nvidia、GPU、FPGA），并帮助他们了解 DApps-ML Schema 的知识库。HAFIR 还为 CEISER 提供了硬件加速支持以实现高效的应用部署。硬件虚拟功能规划器支持加速器（如
    GPU 和 FPGA）的虚拟化，并能够根据应用需求（例如工作负载）暴露正确的开发。


