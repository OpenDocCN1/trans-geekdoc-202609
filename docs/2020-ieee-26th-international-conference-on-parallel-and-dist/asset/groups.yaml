  - '[PAGE 6]


    # V. SYSTEM INFORMATION


    The DApps framework integrates the KATQDEVKIT, SEFTIC, HAFIR and the core DApps
    components shown in Fig. 2 where each subsystem encapsulates the functionality
    as microservices, ensuring a high degree of modularity. The integration provides
    a high-level abstract and generic application-programming interface (API) to ensure
    portability and scalability, so that new implementations are able to operate with
    the existing technologies as above.


    In the application development phase, for a decentralized crowd story scenario:


    +   1) Developer first describes the requirements of the application (e.g., locations,
    users and max video selection for story component), using the GCDAppRM provided
    by the KATQDEVKit story; the best representative and interactive development from
    MOG can specify the user story constraints using different requirements;


    +   2) Developer uses the KATQDEVKIT to create the knowledge base, and discoverable
    source assets (e.g., video metadata for story telling), based on constraints of
    performance (e.g., quality of video, and max delay for the online story telling),
    operation modes (model for engaging participants), and privacy and security (e.g.,
    ethics of the story).


    +   3) Based on the developed assets (e.g., code, algorithms or services), the
    developers follow the reference model, and apply the cooperative programming model
    to optimize the application (components) design logic, performance, transparency
    and infrastructure.


    +   4) During the deployment phase the infrastructure code will be developed cooperatively,
    selecting providers, capacity, virtual infrastructure topology, and specific function
    to be deployed on the virtual infrastructure


    +   5) Based on the infrastructure code. HAFIR will virtualize specific infrastructure,
    in particular, when specific characteristics are


    +   6) and in the meantime, HAFIR will encapsulate the application function and
    the components as mobile components.


    +   7) The SLA among infrastructure will be automated via the smart contracts
    SEFTIC,


    +   8) and the CEISOR will automate the infrastructure provisioning, software
    deployment, and the application framework.


    +   9) If the user requires blockchains for the internal use, the SEFTIC will
    dynamically provide the provisioned blockchains, and deploy on the virtual infrastructure
    initialized at the first step.


    +   10) During the runtime of the application, CEISOR continuously monitor the
    execution of the application, diagnose the system status, identify the bottlenecks
    or potential problems, and decide on the system control, and finally the CEISOR
    should also conduct the control decision, adapt the system behavior with learning
    capability.


    # VI. CONCLUSION


    Current blockchain technologies suffer from the lack of resilience among peers
    consensus, but the development of advanced architectures, software-defined infrastructure,
    and network, will make the DApps effective. We have proposed a system to be used
    for quality management of decentralized resources with trust on blockchain.


