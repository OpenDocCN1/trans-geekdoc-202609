    for QCDApp to instantiate the blockchain or new smart contracts on demand. Through
    combining different chains, the faible effectively makes trade-off between the
    system performance and consensus mechanisms during the transaction types, and
    application requirements.


    # D. CROSS-EDGE HETEROGENEOUS INFRASTRUCTURE DECENTRALSED SERVICE ORCHESTRATOR
    (CEIS)


    The Crowd-based trustworthy smart contract enforces a trustworthy mechanism for
    service providers and consumers to automate service transactions, required by
    the applications in the ecosystem (e.g., negotiating prices, payment conditions,
    and validation conditions), with incentivized models to create reliability about
    the chain events. The result of this module also play an important role in generating
    the providers'' reputation.


    The Cross-Edge heterogeneous infrastructure Decentralised Service Orchestrator
    (CEISER) provides a unified and robust interface for agile and seamless application
    infrastructure consideration across heterogeneous Cloud and Edge resources needed
    by a QCDApp. CEISER empowers DAApps with smart, infrastructure capacity planning,
    and management. It employs various infrastructure-features to simplify scaling
    and provisioning with improved operational efficiency), and also manage minimise
    costs.


    The Reputation auditor ecosystem participants provides a reputation model focused
    on QDS experiences and history to audit the behaviour of the ecosystem participants.
    The results are not only based on users feedback, but also on violation detection
    reports during the cross-cloud SLI enforcement.


    The quality DAApp virtual infrastructure capacity planner ensures the continuous
    provisioning, deployment, testing, and intra-service processes across the software
    development lifecycle. The planner has various models of infrastructure which
    might be provided by centralized providers, e.g., Amazon or Azure, or by decentralised
    smart providers. The planner has to execute the plan (including capacity, and
    topology) according to the application requirements for performance, trustworthiness,
    and ethics.


    # C. HARDWARE CHARACTERSED FUNCTION VIRTUALISATION FRAMEWORK (HAFIR)


    The Hardised function Virtualisation framework (HAFIR) provides hardware virtualisation
    and function containerisation for QCDApp applications. By adopting proper level
    of virtualisation (e.g., VM, container), it enables self-contained portable components
    for application functions considering the requirements and available hardware
    accelerator capacity (e.g., Intel, Nvidia, GPU, FPGA), and helps them to know
    the knowledge base on the DAApps-ML schema. HAFIR also provides CEISER with leveraging
    hardware acceleration support for efficient application deployment. Hardware virtual
    function planner supports virtualisation of hardware accelerators (e.g., GPU and
    FPGA), is also able to expose the correct development on the application demands
    (e.g., application workloads).


    The Seamless cross-edge infrastructure orchestrator manages the geographically
    dispersed and fragmented infrastructures within and across Cloud data, and Fog/Edge.
    It simplifies and accelerates the transition from manual to automated service
    deployment across the feeders through their vigorous function and infrastructure
    services, and applications. CEISER utilises the existing infrastructure and DevOps
    tools (like Kubernetes, Puppet and Chef) and provides AI-driven services to automate
    the data analysis and orchestration (e.g., application selection, provisioning,
    deployment, testing, and delivery) with efficient usage statistic.


    The Quality and energy function composer allows developers to iteratively strengthen
    the integration of applications and optimise them based on the energy and performance
    constraints, and the availability of the hardware accelerators choosing the suitable
    level of virtualisation (e.g., container, VM, or unknown) for different performance
    and security requirements.


    The Complex QCDApp application-infrastructure controller allows complex systems
    theories, such as (probabilistic) Boolean networks and dynamics, to validate the
    decision what may cause the graph representation of the runtime infrastructure
    status. Efficient control algorithms detects the factors driving the infrastructure
    into a critical state, which may affect the overall performance and stability
    of the application. Furthermore, it provides solutions in case of identified problems.'
