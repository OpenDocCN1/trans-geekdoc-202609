  md: "# 432\n\n# 11 Tell Your Story with Data\n\nNext, see in the histogram for price\
    \ (the top-left plot) that a majority of houses is less than two million dollars.\
    \ Observe also that the x-axis stretches out to 8 million dollars, even though\
    \ there does not appear to be any houses close to that price. This is because\
    \ there are a very small number of houses prices closer to 8 million as noted\
    \ in the tidy_summary(). These are the outlier prices we mentioned earlier. We\
    \ say that the variable is right-skewed as exhibited by the long right tail.\n\
    \nFurther, the histogram of sqft_living in the middle plot shows that most houses\
    \ appear to have less than 5000 square feet of living space. For comparison, an\
    \ American football field in the US is about 57,600 square feet, whereas a standard\
    \ soccer/association football field is about 64,000 square feet. Observe also\
    \ that this variable is also right-skewed, not as drastically as the price variable.\n\
    \nFor both price and sqft variables, the right-skew makes distinguishing houses\
    \ at the lower end of the x-axis hard. This is because the scale of the x-axis\
    \ is compressed by the small number of quite expensive and immensely-sized houses.\n\
    \nSo what can we do about this skew? Let's apply a log10 transformation to these\
    \ variables.\n\nIn summary, log transformations allow us to alter the scale of\
    \ a variable to focus on multiplicative changes instead of additive changes. In\
    \ other words, we shift the view to be relative changes instead of absolute changes.\
    \ Such multiplicative/relative changes are also changed in orders of magnitude.\n\
    \nLet's create new log10 versions of the right-skewed price variable and sqft_living\
    \ using the mutate() function from Section 3.5, but we'll give the latter name\
    \ log10_size, which is shorter and easier to understand than the log10_sqft_living.\n\
    \n```\nhouse_prices <- house_prices |>\nmmutate(\n  log10_price = log10(price),\n\
    \  log10_size = log10(sqft_living)\n)\n```\n\nLet's display the before and after\
    \ effects of this transformation on these variables for the first 10 rows of house_prices:\n\
    \n```\nhouse_prices |>\nselect(price, log10_price, sqft_living, log10_size)\n\
    ```\n\n```\n# A tibble: 21,613 x 4\nlog10_price sqft_living log10_size\n<dbl>\
    \       <dbl>      <int> <dbl>\n```"
  merge: -1
  img_proc: true
