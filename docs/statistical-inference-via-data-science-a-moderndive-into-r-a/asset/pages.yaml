    # 2.8.2 Must avoid pie charts!


    One of the most common plots used to visualize the distribution of categorical
    data is the pie chart. While they may seem harmless enough, pie charts actually
    present a problem in humans that are unable to judge angles well.


    As Naomi Robbins describes in her book, Creating More Effective Graphs (Robbins,
    2013), we overestimate angles greater than 90 degrees and underestimate angles
    less than 90 degrees. In other words, it is difficult for us to determine the
    relative size of one piece of the pie compared to another.


