  md: '230 Sampling distribution for two samples


    # 7.5.1 Comparing distributions


    Assume that we would like to compare the parameters of two populations, for example,
    the means or proportion of those populations. To do this a random sample is taken
    from the first population and another random sample, independent from the first,
    is retrieved from the second population. Then we can use a statistic from each
    sample, such as the sample mean or sample proportion, and use them to produce
    sampling distributions that depend on two independent samples. We provide two
    examples to illustrate how the sampling distributions are affected.


    ![](img/445742518041017e8f01f11b0c3190d9_264_0.png)


    **FIGURE 7.25:** The distribution of the sample mean (n=25).


    ![](img/445742518041017e8f01f11b0c3190d9_264_1.png)


    **FIGURE 7.26:** The distribution of the sample mean (n=100).'
  merge: -1
  img_proc: true
- pgno: 265
  md: "# Difference in sample means\n\nThe problem at hand could be that the chocolate-covered\
    \ almonds' weight for almonds in a bowl needs to be compared with the chocolate-covered\
    \ coffee beans' weight for coffee beans in a different bowl. The statistic we\
    \ now consider is the difference in the sample means for samples taken from these\
    \ two bowls. As it happens, most of the properties we have presented for a single\
    \ sample mean or sample proportion can be extended directly to two-sample problems.\n\
    \nWe now provide the mathematical details for this problem. We assume that for\
    \ the chocolate-covered almonds' weight the population mean and standard deviation\
    \ are given by $\\mu_1$ and $\\sigma_1$ and for the chocolate-covered coffee beans'\
    \ weight the population mean and standard deviation are given by $\\mu_2$ and\
    \ $\\sigma_2$.\n\nOur sampling exercise has two components. First, we take a random\
    \ sample of size $n_1$ from the almonds' bowl and find the sample mean. Let $\b\
    ar{X}_1$ represent the possible sample mean values for each possible sample. Then,\
    \ we let $n_2$ and $\bar{X}_2$ represent similar quantities for the coffee beans'\
    \ bowl. To compare these two-sample means, we look at the difference, $\\bar{X}_1\
    \ - \bar{X}_2$. The distribution of $\\bar{X}_1 - \bar{X}_2$ is the sampling distribution\
    \ of the difference in sample means.\n\nThe expected value and standard error\
    \ of $\\bar{X}_1 - \bar{X}_2$ is given by $\\mu_1 - \\mu_2$\n\n```\n$$\\sqrt{\\\
    frac{\\sigma_1^2}{n_1} + \\frac{\\sigma_2^2}{n_2}}$\n```\n\nrespectively. If the\
    \ distributions of $\\bar{X}_1$ and $\\bar{X}_2$ are approximately normal due\
    \ to the CLT, so is the distribution of $\\bar{X}_1 - \\\bar{X}_2$. We can write\
    \ all these properties at once:\n\n```\n$$\\bar{X} - \\bar{Y} \\sim Normal(\\\\\
    mu_1 - \\mu_2, \\sqrt{\\frac{\\sigma_1^2}{n_1} + \\frac{\\sigma_2^2}{n_2}})$\n\
    ```\n\nObserve how the standard deviation of the difference is the sum of squared\
    \ standard deviations from each sample mean. The reason we add standard deviations\
    \ instead of subtract is whether you add or subtract statistics, you are effectively\
    \ adding more uncertainty into your results and the dispersion increases because\
    \ of it.\n\n# Learning check\n\n**(LC7.17)** In the context of comparing two samples,\
    \ why do we add variances (squared standard deviations) instead of subtracting\
    \ them when finding the standard error of the difference?\n\n+   - Because variances\
    \ always cancel each other out\n- Because adding variances reflects the total\
    \ uncertainty from both samples"
  merge: -1
  img_proc: true
- pgno: 266
  md: "+   C. Because subtracting variances always gives negative results\n\n+   D.\
    \ Because variances are not related to the standard error\n\n# Difference in sample\
    \ proportions\n\nComparing two sample proportions can be very useful. We may be\
    \ interested in comparing the proportion of patients that improve using one treatment\
    \ versus the proportion of patients who improve using a different treatment, or\
    \ the proportion of winter accidents on a highway using one type of tire versus\
    \ another.\n\nTo illustrate how the sampling distribution works for the difference\
    \ in sample proportions, we modify the examples used earlier. Assume that we want\
    \ to compare the proportion of red balls in the first bowl with the proportion\
    \ of almonds that are heavier than 3.8 grams in the second bowl. This example\
    \ shows one to convert numeric data like almond weights into a Boolean result\
    \ instead. The statistic we now consider is the difference in sample proportions\
    \ for samples retrieved from two bowls. The samples from each bowl do not need\
    \ to be of the same size; for example, we can take samples of size $n_1 = 50$\
    \ from the first bowl and samples of size $n_2 = 60$ from the second bowl.\n\n\
    We proceed by\n\n+   taking a random sample from the first bowl,\n\n+   calculating\
    \ the sample proportion of red balls,\n\n+   getting a random sample from the\
    \ second bowl,\n\n+   calculating the proportion of almonds heavier than 3.8 grams,\
    \ and\n\n+   finding the difference in sample proportion of red balls minus the\
    \ sample proportion of almonds greater than 3.8 grams (the resulting statistic).\n\
    \nWe can use R to produce the virtual samples and differences. We then use them\
    \ to approximate the sampling distribution of the difference in sample proportions.\n\
    \nOur sampling exercise has two components. First, we take a random sample of\
    \ $n_1 = 50$ balls from the bowl of red balls and calculate the sample proportion\
    \ of red balls. As we did before, let $\bar{X}_1$ represent the possible values\
    \ that the sample proportion can take for each sample. Recall that $\bar{X}_1$\
    \ is the sample proportion in this context, which is also the sample mean of Bernoulli\
    \ trials. Second, we let $n_2 = 60$ represent the sample size used for samples\
    \ from the almonds' bowl and the random variable $\bar{X}_2$ represent the possible\
    \ values that the sample proportion of almonds greater than 3.8 grams can take\
    \ for each possible sample.\n\nTo compare these two sample proportions, we find\
    \ the difference, $\bar{X}_1 - \bar{X}_2$. The distribution of $\bar{X}_1 - \b\
    ar{X}_2$ is the sampling distribution of the difference in sample proportions.\
    \ We use virtual sampling to approximate this distribution. We use the $rep\\\
    _slice\\_sample"
  merge: -1
  img_proc: true
