    \ Describe in a paragraph how we used Allen Downey’s diagram to conclude if a\
    \ statistical difference existed between the popularity rate of metal and deep\
    \ house for the Spotify example.\n\n# 9.5 Interpreting hypothesis tests\n\nInterpreting\
    \ the results of hypothesis tests is one of the more challenging aspects of this\
    \ method for statistical inference. In this section, we will focus on ways to\
    \ deciphering the process and address some common misconceptions.\n\n# 9.5.1 Two\
    \ possible outcomes\n\nIn Section 9.3, we mentioned that given a pre-specified\
    \ significance level $\\alpha$ there are two possible outcomes of a hypothesis\
    \ test:\n\n+   * If the p-value is less than $\\alpha$, then we *reject* the null\
    \ hypothesis $H_0$ in favor of $H_A$.\n* If the p-value is greater than or equal\
    \ to $\\alpha$, then we *fail to reject* the null hypothesis $H_0$.\n\nUnfortunately,\
    \ the latter result is often misinterpreted as “accepting the null hypothesis\
    \ $H_0$. While at first glance it may seem that the statements “failing to reject\
    \ $H_0$” and “accepting $H_0$” are equivalent, there is actually a subtle difference.\
    \ Saying that we “accept the null hypothesis $H_0$” is equivalent to stating “we\
    \ think the null hypothesis $H_0$ is true.” However, saying that we “fail to reject\
    \ the null hypothesis $H_0$” is saying something else: “While $H_0$ might still\
    \ be false, we do not have enough"
