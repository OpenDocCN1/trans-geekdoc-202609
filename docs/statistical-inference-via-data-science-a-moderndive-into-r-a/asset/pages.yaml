- pgno: 312
  md: "# 8.2.4 Confidence intervals using bootstrap samples with infer\n\nWe are ready\
    \ to introduce confidence intervals using the bootstrap via infer. We present\
    \ two different methods for constructing 95% confidence intervals as interval\
    \ estimates of an unknown parameter: the percentile method and the standard-error\
    \ method[Bootstrap!standard error method]. Let's check out the infer package code\
    \ that explicitly constructs these. There are also some neat functions to visualize\
    \ the resulting confidence intervals built-in to the infer.\n\n# Percentile method\n\
    \nRecall that in Subsection 8.2.3 we have generated 1000 bootstrap samples and\
    \ stored them in data frame bootstrap_means:\n\n```\nbootstrap_means\nnResponse:\
    \ weight (numeric)\n# A tibble: 1,000 x 2\n  replicate stat\n  <int> <dbl>\n1\
    \         1.368\n2         2.688\n3         3.632\n4         3.688\n5        \
    \ 3.679\n6         3.675\n7         3.768\n8         3.706\n9         3.643\n\
    10        3.688\n# i 990 rows\n```\n\nThe means stored in bootstrap_means represent\
    \ a good approximation to the bootstrap distribution of all possible bootstrap\
    \ samples. The percentile method for constructing 95% confidence intervals sets\
    \ the lower endpoint of the confidence interval at the 2.5th percentile of bootstrap_means\
    \ and similarly sets the upper endpoint at the 97.5th percentile. The resulting\
    \ interval captures the middle 95% of the values of the sample mean weights of\
    \ almonds in bootstrap_means. This is the interval estimate of the population\
    \ mean weight of almonds in the entire bowl.\n\nWe can compute the 95% confidence\
    \ interval by piping bootstrap_means into the get_confidence_interval() function\
    \ from the infer package, with the confidence level set to 0.95 and the confidence\
    \ interval type to “percentile\". We save the results in percentile_ci."
  merge: -1
