  md: '# 8 Estimation, Confidence Intervals, Bootstrapping


    We make a couple of important notes. First, for the comparison between the "seed"
    and "control" groups to make sense, however, both groups need to be independent
    from each other. Otherwise, they could influence each other''s results. This means
    that a participant selected for the "seed" or "control" group has no influence
    on another participant assigned to one of the two groups. As an example, if there
    were a mother and her child as participants in the study, they wouldn''t necessarily
    be in the same group. They would each be assigned randomly to one of the two groups
    of the explanatory variable.


    Second, the order of substraction in the difference doesn''t matter so long as
    you are consistent and tailor your interpretations accordingly. In other words,
    using a point estimate of $\hat{p}_{seed}-\hat{p}_{control}$ or $\hat{p}_{control}-\hat{p}_{seed}$
    does not make a material difference, you just need to stay consistent and interpret
    your results accordingly.


    # 8.4.3 Constructing the confidence interval


    As we did in Subsection 8.2.3, let''s first construct the bootstrap distribution
    for $\hat{p}_{seed}-\hat{p}_{control}$ and then use this to construct 95% confidence
    intervals for $p_{seed}-p_{control}$. We''ll do this using the infer workflow
    again. However, since the difference in proportions is a new scenario for inference,
    we''ll need to use some new arguments in the infer functions along the way.


    +   1. specify variables


    Let''s take our mythbusters_yawn data frame and specify() which variables are
    of interest using the $y \sim x$ formula interface:


    +   - Our response variable is yawn: whether or not a participant yawned. It has
    levels "yes" and "no".

    - The explanatory variable is group. It has levels "seed" (exposed to yawning)
    and "control" (not exposed to yawning).


    ```

    mythbusters_yawn |>

    specify(formula = yawn ~ group)

    ```


