    \n**FIGURE 5.8:** Life expectancy in 2022 by continent (boxplot).\n\nSome people\
    \ prefer comparing the distributions of a numerical variable between different\
    \ levels of a categorical variable using a boxplot instead of a faceted histogram.\
    \ This is because we can make quick comparisons between the categorical variable's\
    \ levels with imaginary horizontal lines. For example, observe in Figure 5.8 that\
    \ we can quickly convince ourselves that Europe has the highest median life expectancies\
    \ by drawing an imaginary line near y = 81. Furthermore, as we observed in the\
    \ faceted histogram Figure 5.7, Africa and Asia have the largest variation in\
    \ life expectancy as evidenced by their high interquartile ranges (the size of\
    \ the boxes).\n\nIt's important to remember, that the solid lines in the middle\
    \ of the boxes correspond to the medians (the middle value) rather than the mean\
    \ (the average). So, for example, if you look at Asia, the solid line denotes\
    \ the median life expectancy of around 75 years. This tells us that half of all\
    \ countries in Asia have a life expectancy below 75 years, whereas half have a\
    \ life expectancy above 75 years. We compute the median and mean life expectancy\
    \ for each continent with a little data wrangling and display the results in Table\
    \ 5.6."
