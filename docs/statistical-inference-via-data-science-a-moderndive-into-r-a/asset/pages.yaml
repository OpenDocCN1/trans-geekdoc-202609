  md: '# 10.1 The simple linear regression model 355


    Finally, we review how to determine the fitted values and residuals for observations
    in the dataset. France is one of the UN member states, and suppose we want to
    determine the fitted fertility rate for France based on the linear regression.
    We start by determining where is the location of France in the UN_data_ch10 data
    frame, using rowid_to_column() and filter() with the variable country equal to
    "France." The pull() function converts the row number as a data frame to a single
    value:


    ```

    UN_data_ch10 |>

    rowid_to_column() |>

    filter(country == "France") |>

    pull(rowid)

    ```


    [1] 57


    France is the 57th member state in UN_data_ch10. Its observed fertility rate and
    life expectancy are:


    ```

    UN_data_ch10 |>

    filter(country == "France")

    ```


    ```

    # A tibble: 1 x 3

    country life_exp fert_rate

    <chr> <dbl> <dbl>

    1 France 82.59 1.8

    ```


    France''s life expectancy is $x_{57} = 82.59$ years and the fertility rate is
    $y_{57} = 1.8$. Using the regression line from earlier, we can determine France''s
    fitted fertility rate:


    > $\hat{y}_{57} = 12.613 - 0.137 \cdot x_{57}$\n$= 12.613 - 0.137 \cdot 82.59$\n$=
    1.258$.


    Based on our regression line we would expect France''s fertility rate to be 1.258.
    The observed fertility rate for France was 1.8, so the residual for France is
    $y_{57} - \hat{y}_{57} = 1.8 - 1.258 = 0.542.


    Using R we are not required to manually calculate the fitted values and residuals
    for each UN member state. We do this directly using the regression model simple_model
    and the get_regression_points() function. To do this only for France, we filter()
    the 57th observation in the data frame.'
