    \ 0.127 | -2.150 | 0.033 | -0.524 | -0.023 |\n| continent_of_origin: South America\
    \ | -0.478 | 0.142 | -3.380 | 0.001 | -0.757 | -0.199 |\n\nWe can see that the\
    \ standard error for the numerical regressors $SE(\\hat{b}_1) = 0.22$, $SE(\\\
    hat{b}_2) = 0.23$, and $SE(\\hat{b}_3) = 0.03$."
