  md: '# 118


    # 5 Simple Linear Regression


    of the individual variables in your data, whether any potential relationships
    exist between variables, whether there are outliers and/or missing values, and
    (most importantly) how to build your model. Here are three common steps in an
    EDA:


    +   1. Most Crucially, looking at the raw data values.

    2. Computing summary statistics, such as means, medians, and maximums.

    3. Creating visualizations.


    We perform the first common step in an exploratory data analysis: looking at the
    raw data values. Because this seems so trivial, unfortunately many analysts ignore
    it. However, getting an early sense of what your raw data looks like can often
    prevent many issues down the road.


    You can do this using RStudio''s spreadsheet viewer or by using the glimpse()
    function as introduced in Subsection 1.4.3 on exploring data frames:


    ```

    glimpse(UN_data_ch5)


    Rows: 181

    Columns: 4

    $ iso <chr>"AFG", "ALB", "DZA", "AGO", "ATG", "ARG", "ARM", "AUS",~

