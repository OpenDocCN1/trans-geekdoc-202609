  md: "# 10.1 The linear regression model\n\n```\nUN_data_ch10 <- un_member_states_2024\
    \ |\nselect(country,\n  life_exp = life_expectancy_2022,\n  fert_rate = fertility_rate_2022)|\n\
    a.omit()\n```\n\nUN_data_ch10\n\n| column | n | group | type | min | Q1 | mean\
    \ | 73.66 | median | Q3 | max | sd |\n|---|---|---|---|---|---|---|---|---|---|--|\n\
    | life_exp | 183 | | numeric | 53.6 | 69.4 | | 75.2 | 78.3 | 86.4 | 6.84 |\n|\
    \ fert_rate | 183 | | numeric | 0.9 | 1.6 | | 2.0 | 3.2 | 6.6 | 1.15 |\n\nAbove\
    \ we the summary of the two numerical variables. Observe that there are 183 observations\
    \ without missing values. Using simple linear regression between the response\
    \ variable fertility rate ($fert\\_rate$) or $y$, and the regression life expectancy\
    \ ($life\\_exp$) or $x$, the regression line is:\n\n> $$\\hat{y}_i = b_0 + b_1\
    \ \\cdot x_i.$\n\nWe have presented this equation in Section 5.1, but we now add\
    \ the subscript $i$ to represent the $ith$ observation or country in the UN dataset,\
    \ and we let $i = 1, \\dots, n$ with $n = 183$ for this UN data. The value $x$\
    \ represents the life expectancy value for the $ith$ member state, and $\\hat{y}_i$\
    \ is the fitted fertility rate for the $ith$ member state. The fitted fertility\
    \ rate is the result of the regression line and is typically different than the\
    \ observed response $y_i$. The residual is the difference between $y_i - \\hat{y}_i$.\n\
    \nAs discussed in Subsection 5.3.2, the intercept ($b_0$) and slope ($b_1$) are\
    \ the regression coefficients, that the regression line is the \"best-fitting\"\
    \ line based on least-squares. In order, the fitted values $\\hat{y}$ calculated\
    \ using the least-squares coefficients ($b_0$ and $b_1$) minimize the sum of $squared\
    \ residuals$:\n\n> $$\\sum_{i=1}^{n} (y_i - \\hat{y}_i)^2$$\n\nAs we did in Section\
    \ 5.1, we fit the linear regression model. By \"fit\" we mean to calculate the\
    \ regression coefficients, $b_0$ and $b_1$, that minimize the sum of squared residuals.\
    \ To do this in R, we use the $lm()$ function with the formula $fert\\_rate \\\
    sim life\\_exp$ and save the solution in $simple\\_model:$"
