  md: "# 10.5 Theory-based inference for multiple linear regression\n\nfor $i=1,...,n$.\
    \ We also assume that $\\epsilon_i$ and $\\epsilon_j$ are independent, and $y_i$\
    \ and $y_j$ are also for $i \neq j$. Moreover, the least-squares estimators $(\\\
    hat{b}_0, \\hat{b}_1, \\dots, \\hat{b}_p)$ are linear combinations of the random\
    \ variables $y_1, \\dots, y_n$, which are normally distributed, as shown above.\
    \ Again, following properties of the normal distribution, the expected value,\
    \ and the variance it can be shown that\n\n+   - the (least-square) estimators\
    \ follow a normal distribution,\n- the estimators are unbiased, meaning the expected\
    \ value for each estimator is the parameter they are estimating; for example,\
    \ $E(\\hat{b}_1) = \beta_1$, or in general $E(\\hat{b}_j) = \beta_j$ for $j=0,1,...,p$.\n\
    - the variance and standard deviation of each estimator $(\\hat{b}_j)$, is a function\
    \ of $\\sigma$, and the observed data for the explanatory variable (the values\
    \ of the regressors in the sample). For simplicity, the standard deviation of\
    \ the estimator $\\hat{b}_j$ is denoted by $SD(\\hat{b}_j)$ but remember that\
    \ it is a function of the standard deviation of the response $(\\sigma)$.\n- Using\
    \ the information above, the distribution of the (least-squares) estimator $\\\
    hat{b}_j$ is given by\n\n$$\\hat{b}_j \\sim Normal(\\beta_j, SD(\\hat{b}_j))$\n\
    \nfor $j=1,...,p$. Note also that $\\sigma$ is typically unknown, and it is estimated\
    \ using the estimated standard deviation $s$ instead of $\\sigma$. The estimated\
    \ standard deviation for $b_j$ is called the standard error of $b_j$ and written\
    \ as $SE(b_j)$. Again, remember that the standard error is a function of $s$.\n\
    \nThe standard errors are shown when applying the get_regression_table() function\
    \ on a regression model. This is the output for mod_mult:\n\n```\nget_regression_table(mod_mult)\n\
    ```\n\nTABLE 10.9: The regression table for mod_mult\n| term | estimate | std_error\
