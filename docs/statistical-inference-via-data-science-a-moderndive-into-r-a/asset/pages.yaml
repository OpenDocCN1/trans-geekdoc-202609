- pgno: 210
  md: '# 176 6 Multiple Regression


    levels of credit_limit and income. This is not the case in our data and the intercept
    has no practical interpretation; it is mainly used to determine where the plane
    should cut the y-intercept to produce the smallest sum of squared residuals.


    Each slope in a multiple linear regression is considered a partial slope and represents
    the marginal or additional contribution of a regressor when it is added to a model
    that already contains other regressors. This partial slope is particularly different
    than the slope we may find in a simple linear regression for the same regressor.
    The reason is that, typically, regressors are correlated, so when one regressor
    is part of a model, indirectly it''s also explaining the part of other regressor.
    When the second regressor is added to the model, it helps explain only changes
    in the response that were not already accounted for by the first regressor. For
    example, the slope for credit_limit is $0.264. Keeping income fixed to value,
    for an additional increase of credit limit debt increases, on average, by $0.264.
    Similarly, the slope of income is -$7.66. For one unit increase of income ($1000
    in actual income), there is an associated decrease of $7.66 in credit debt, on
    average.


    Putting these results together, the equation of the regression plane that gives
    us fitted values $\hat{y}$ is:


    ```

    $\hat{y} = b_0 + b_1 \cdot x_1 + b_2 \cdot x_2 = -335.179 + 0.263 \cdot x_1 -
    7.663 \cdot x_2$

    ```


    where $x_1$ represents credit limit and $x_2$ income.


    To illustrate the role of partial slopes further, observe that the right plot
    in Figure 6.5 shows the relationship between debt and income in isolation, a positive
    relationship, so the slope of income is positive. We can determine the value of
    this slope by constructing a simple linear regression using income as the only
    regressor:


    ```

    # Fit regression model and get the coefficients of the model

    simple_model <- lm(debt - income, data = credit_ch6)

    coef(simple_model)

    ```


    | | Coefficients | Values |

    |---|---||

    | (Intercept) | b0'' | 246.51 |

    | income | b2'' | 6.05 |


    The regression line is given by the following with the coefficients denoted using
    the prime ('''') designation since they are different values than what we saw
    previously


    ```

    $\hat{y} = b_0'' + b_2'' \cdot x_2 = 246.515 + 6.048 \cdot x_2$

    ```


    where $x_2$ is income. By contrast, credit_limit and income are considered jointly
    to explain changes in debt, the equation for the multiple linear regression was:'
