  md: "# 8.4 Case study: is yawning contagious? 289\n\nsample of 50 bowls using the\
    \ shovel and computed the relevant point estimate: the sample proportion that\
    \ were red, denoted mathematically by $\\hat{p}$.\n\nWho is the study population\
    \ here? All humans? All the people who watch the show Mythbusters? It's hard to\
    \ say! This question can only be answered if we know how the show's recruited\
    \ participants! In other words, was the sampling methodology used by the Mythbusters\
    \ to recruit participants? We are not provided with this information. Only for\
    \ the purposes of this case study, we'll assume that the 50 participants are a\
    \ representative sample of all Americans who follow this show. Then, we'll be\
    \ assuming that any results of this experiment generalize to all $N = 346$ Americans\
    \ (2024 population estimate).\n\nJust like our sampling bowl, the population parameter\
    \ here will involve proportions. In this case, it will be the difference in population\
    \ proportions $P_{seed} - P_{control}$, where $P_{seed}$ is the proportion of\
    \ all Americans who were exposed to yawning yawn themselves and $P_{control}$\
    \ is the proportion of all Americans who were not exposed to yawning still themselves.\
    \ Corresponding, the point estimate/sample statistic based on the Mythbusters'\
    \ sample of participants will be the difference in sample proportions $\\hat{p}_{seed}\
    \ - \\hat{p}_{control}$. Let's extend Table 8.1 of scenarios of sampling for inference\
    \ to include our latest scenario.\n\n# TABLE 8.1: Scenarios of sampling for inference\n\
    \n| Scenario | Population parameter | Notation | Point estimate | Symbol(s) |\n\
    |---|---|---|---|--|\n| 1 | Population proportion | $p$ | Sample proportion |\
    \ $\\hat{p}$ |\n| 2 | Population mean | $\\mu$ | Sample mean | $\bar{x}$ or $\\\
    hat{\\mu}$ |\n| 3 | Difference in population proportions | $p_1 - p_2$ | Difference\
    \ in sample | $\\hat{p}_1 - \\hat{p}_2$ |\n\nThis is known as a two-sample inference\
    \ situation since we have two separate samples. Based on the two samples of size\
    \ $n_{seed} = 34$ and $n_{control} = 16$, the point estimate is\n\n```\n$\\hat{p}_{seed}\
    \ - \\hat{p}_{control} = \\frac{24}{34} - \\frac{12}{16} = 0.0441765 \\approx\
    \ 4.4%\n```\n\nHowever, the Mythbusters repeated this experiment. In other words,\
    \ they say they recruited 50 new participants and exposed 34 of them to yawning\
    \ and 16 did not. Would they find the exact same estimated difference of 4.4%?\
    \ Probably not, again, because of sampling variation.\n\nHow does this sampling\
    \ variance affect their estimate of 4.4%? What would be a plausible range of values\
    \ for this difference that accounts for this sampling variation? We can answer\
    \ this question with confidence intervals! Furthermore, since the Mythbusters\
    \ only have a single-sample of 50 participants, they would have to construct a\
    \ 95% confidence interval for $P_{seed} - P_{control}$ using bootstrap resampling\
    \ with replacement."
