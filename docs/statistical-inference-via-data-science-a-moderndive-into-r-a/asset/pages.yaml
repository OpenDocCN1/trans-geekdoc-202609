- pgno: 277
  md: '# 8.1 Tying the sampling distribution to estimation


    The histogram in Figure 8.1 is drawn using many sample mean weights from random
    samples of size $n=100$. The added smooth curve is the density curve for the normal
    distribution with the appropriate expected value and standard error calculated
    from the sample distribution. The left dot represents the population mean $\mu$,
    the unknown parameter we are trying to estimate. The right sample is the sample
    mean $\bar{X} = 3.682$ from the random sample stored in almonds\_sample\_100.


    In real-applications, a sample mean is taken from a sample, but the distribution
    of the population and the population mean are unknown, so the location of the
    right dot with respect to the left dot is also unknown. However, if we construct
    an interval centered on the right dot, as long as it is wide enough the interval
    will contain the left dot. To understand this better, we need to learn a few additional
    properties of the normal distribution.


    # 8.1.2 The normal distribution


    A random variable can take on different values. When those values can be represented
    by one or more integers, the likelihood of those values can be expressed graphically
    by a density curve on a Cartesian coordinate system in two dimensions. The horizontal
    axis (X-axis) represents the values that the random variable can take and the
    height of density curve (Y-axis) provides a graphical representation of the likelihood
    of those values; the higher the curve the more likely values are. In addition,
    the total area under a density curve is always equal to 1. The set of values a
    random variable can take alongside their likelihood is what we call the distribution
    of a random variable.


    The normal distribution is the distribution of a special type of random variable.
    Its density curve has a distinctive shape, and it is fully defined by two values:
    (1) the mean or expected value of the random variable, $\mu$, which is located
    on the X-axis at the center of the density curve (its highest point), and (2)
    the standard deviation, $\sigma$, which reflects the dispersion of the random
    variable; the greater the standard deviation the wider the curve appears. In Figure
    8.2, we plot the density curves of three random variables, all following normal
    distributions:


    +   1. The solid line represents a normal distribution with $\mu=5$ & $\sigma=2$.

    2. The dotted line represents a normal distribution with $\mu=5$ & $\sigma=5$.

    3. The dashed line represents a normal distribution with $\mu=15$ & $\sigma=2$.


    ![](img/445742518041017e8f01f11b0c3190d9_277_0.png)


    FIGURE 8.2: Three normal distributions.'
  merge: -1
  img_proc: true
- pgno: 278
  md: '# 244 8 Estimation, Confidence Intervals, and Bootstrapping


    random variable that follows a normal distribution can take any values in the
    real line, but those values (on the X-axis) that correspond to the peak of the
    density curve are more likely than those corresponding to the tails. The density
    curve drawn with a solid line has the same mean as the one with a dotted line,
    $\mu=5$, but the former exhibits less dispersion, measured by the standard deviation
    $\sigma=2$, than the latter, $\sigma=5$. Since the total area under any density
    curve is equal to 1, the wider curve has to be shorter in height to preserve this
    property. On the other hand, density curve drawn with a solid line has the same
    standard deviation as the one drawn with a dashed line, $\sigma=2$, but the latter
    has a greater mean, $\mu=15$, than the former, $\mu=5$, so they do look the same
    but the latter is centered farther to the right on the X-axis than the former.


    # The standard normal distribution


    A special normal distribution has mean $\mu=0$ and standard deviation $\sigma=1$.
    It is called the standard normal distribution, and it is represented by a density
    curve z-curve. If a random variable $Z$ follows the standard normal distribution,
    a realization of this random variable is called a standard value or z-value. The
    z-value represents the number of standard deviations above the mean, if positive,
    or below the mean, negative. For example, if $z=5$, the value observed represents
    five standard deviations above the mean, $\mu=0$.


    # Linear transformations of random variables that follow the normal distribution


    A linear transformation of a random variable transforms the original variable
    into a new random variable by adding, subtracting, multiplying, or dividing constants
    to the original values. The resulting random variable could have a different mean
    and standard deviation. The most interesting transformation is turning a random
    variable into another with $\mu=0$ and $\sigma=1$. When this happens we say that
    the random variable has been standardized.


    A property of the normal distribution is that any linear transformation of a random
    variable that follows the normal distribution also follows a normal distribution,
    potentially with different mean and standard deviation. In particular, we can
    turn any random variable into a random variable that follows the standard normal
    distribution. For example, if a value $x=11$ comes from a normal distribution
    with mean $\mu=5$ and standard deviation $\sigma=2$, the z-value


    ```

    $z = \frac{x-\mu}{\sigma} = \frac{11-5}{2} = 3$

    ```


    is the corresponding value in a standard normal curve. Moreover, we have determined
    that $x=11$ for this example is precisely 3 standard deviations above the mean.'
  merge: -1
  img_proc: true
- pgno: 279
  md: '# 8.1 Tying the sampling distribution to estimation


    # Finding probabilities under a density curve


    When a random variable can be represented by a density curve, the probability
    that the random variable takes a value in any given interval (on the X-axis) is
    equal to the area under the density curve for interval. If we know the equation
    that represents the density curve, we could use the mathematical technique of
    calculus known as integration to determine this. In the case of the normal curve,
    the integral for any interval does not have a close-form solution, and the solution
    is calculated using numerical approximations.


    We assume that a random variable Z follows a standard normal distribution. We
    would like to know how likely it is for this random variable to take a value that
    is within one standard deviation from the mean. Equivalently, what is the probability
    that the observed value z (in the X-axis) is between -1 and 1 as shown in Figure
    8.3?


    ![](img/445742518041017e8f01f11b0c3190d9_279_0.png)


    **FIGURE 8.3:** Normal area within one standard deviation.


    Calculations show that this area is 0.6827 or about 68.27% of the total area under
    the curve. This is equivalent to saying that the probability of getting a value
    between -1 and 1 on a standard normal is 68.27%. This also means that if a random
    variable representing an experiment follows a normal distribution, the probability
    that the outcome of this experiment is within one standard deviation from the
    mean is 68.27%. Similarly, the area under the standard normal density curve between
    -2 and 2 is shown in Figure 8.4.


    ![](img/445742518041017e8f01f11b0c3190d9_279_1.png)


    **FIGURE 8.4:** Normal area within two standard deviations.'
  merge: -1
  img_proc: true
- pgno: 280
  md: 'Calculations show that this area is equal to 0.9545 or 95.46%. If a random
    representing an experiment follows a normal distribution, the probability that
    the outcome of this experiment is within two standard deviations from the mean
    is 95.45%. It is also common practice to use the exact number of standard deviations
    that correspond to an area around the mean exactly equal to 95% (instead of 95.45%).


    The result is that the area under the density curve around the mean is exactly
    equal to 0.95, or 95%, which is the area within 1.96 standard deviation from the
    mean. Remember this number as it will be used a few times in future sections.


    In summary, the possible outcomes of an experiment can be expressed as a random
    variable that follows the normal distribution, the probability of getting a result
    that is within one standard deviation from the mean is about 68.27%, within 2
    deviations form the mean is 95.45%, within 1.96 standard deviations from the mean
    is 95%, and within 3 standard deviations from the mean is about 99.73%, to name
    a few. Spend a few moments grasping this idea; observe, for example, it is almost
    impossible to observe an outcome represented by a number that is five standard
    deviations above the mean as the chances of that happening are near zero. We are
    now ready to return to our main goal: how to find an interval estimate of the
    population mean based on a single sample.


