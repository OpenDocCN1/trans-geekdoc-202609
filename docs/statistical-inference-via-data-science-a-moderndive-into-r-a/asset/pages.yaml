  md: "# 7.3 The Central Limit Theorem\n\nThe curves in red seem to be a good representation\
    \ of the top bars of the histograms. However, we have not used the simulated data\
    \ to draw these curves, these bell-shaped curves were extracted from the normal\
    \ distribution with mean equal to $p=0.375$ and standard deviation equal to $\\\
    sqrt{p(1-p)/n}$ where $n$ changes for each histogram. This is a fascinating result\
    \ due to an application of one of the most important results in Statistics: the\
    \ Central Limit Theorem (CLT).\n\nThe CLT states that when the sample size, $n$,\
    \ tends to infinity, the distribution of $\bar{X}$ tends to the normal distribution\
    \ (with the appropriate mean and standard deviation). Moreover, it does not depend\
    \ on the population distribution; the population can be a bowl with red and white\
    \ bands or anything else.\n\nThe observant reader might have noticed that, in\
    \ practice, we cannot take samples of size equal to infinity. What makes the CLT\
    \ even more relevant for practical purposes is that the distribution of $\bar{X}$\
    \ approximates normal even when the sample size used is fairly small. As you can\
    \ see in Figure 7.14, when random samples of size $n=25$ are used, the distribution\
    \ of $\bar{X}$ already follows a normal distribution.\n\nObserve also that all\
    \ the curves follow the bell-shaped form of the normal curve but the spread is\
    \ greater when a smaller sample size has been used and is consistent with the\
    \ standard error for $\bar{X}$ found earlier for each case.\n\n# Learning check\n\
    \n**LC7.13)** What is the role of the Central Limit Theorem (CLT) in statistical\
    \ inference?\n\n+   * A. It provides the formula for calculating the standard\
    \ deviation of any given sample, allowing for an understanding of the sample's\
    \ spread or variability.\n* B. It states that the sampling distribution of the\
    \ sample mean will approach a normal distribution, regardless of the population's\
    \ distribution, as the sample size becomes large.\n* C. It determines the actual\
    \ mean of the population directly by calculating it from a randomly selected sample,\
    \ without needing additional data or assumptions.\n* D. It is a principle that\
    \ applies strictly and exclusively to populations that are normally distributed,\
    \ ensuring that only in such cases the sample mean will follow a normal distribution\
    \ pattern.\n\n**LC7.14)** What does the term \"sampling variation\" refer to?\n\
    \n+   * A. Variability in the population data.\n* B. Differences in sample statistics\
    \ due to random sampling.\n* C. Changes in the population parameter over time.\n\
    * D. Variation caused by errors in data collection."
  merge: -1
