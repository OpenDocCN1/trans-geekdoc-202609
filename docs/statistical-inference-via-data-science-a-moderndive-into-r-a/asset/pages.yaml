  md: 'Preface


    xxiii


    better understand whether these claims should be trusted or whether we should
    be wary. Inside data analysis are many sub-fields we will discuss throughout this
    book (though not necessarily in this order):


    +   - data collection

    - data wrangling

    - data visualization

    - statistical modeling

    - inference

    - correlation and regression

    - data communication/storytelling


    These sub-fields are summarized in what Garrett Grolemund and Hadley Wick have
    previously termed the “data/science pipeline”⁶ in Figure 2.


    ![](img/445742518041017e8f01f11b0c3190d9_23_0.png)


    We will begin by digging into the grey Understand portion of the cycle with data
    visualization, then with a discussion on what is meant by tidy data and data wrangling,
    and then conclude by talking about interpreting and discussing the results of
    our models via Communication. These steps are vital to any statistical analysis.
    But, why should you care about statistics?


    There''s a reason many fields require a statistics course. Scientific knowledge
    grows through an understanding of statistical significance and data analysis.
    You needn''t be intimidated by statistics. It''s not the beast that it used to
    be, and paired with computation, you''ll see how reproducible research in the
    sciences particularly increases scientific knowledge.


    > ⁶http://r4ds.had.co.nz/explore-intro.html'
