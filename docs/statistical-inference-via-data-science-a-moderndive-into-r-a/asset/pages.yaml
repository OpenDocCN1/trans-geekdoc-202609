  md: '# 4.3 Case study: Democracy in Guatemala


    (long/narrow) format. We''ll do this using the pivot_longer() function from the
    tidyr package again.


    Furthermore, we''ll make use of functions from the ggplot and dplyr packages to
    produce a time-series plot showing how the democracy scores have changed over
    the 40 years from 1952 to 1992 for Guatemala. Recall that we saw time-series plots
    in Section 2.4 creating linegraphs using geom_line().


    Let''s use the dem_score data frame we imported in Section 4.1, but focus on only
    data corresponding to Guatemala.


    ```

    guat_dem <- dem_score |

    filter(country == "Guatemala")

    guat_dem

    ```


    # tibble: 1 x 10

    | country | 1952* | 1957* | 1962* | 1972* | 1977* | 1982* | 1987* | 1992* |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | <chr> | <dbl> | <dbl> | <dbl> | <dbl> | <dbl> | <dbl> | <dbl> | <dbl> |

    | Guatemala | 2 | -6 | -5 | 3 | 1 | -3 | -7 | 3


    Let''s look at the grammar of graphics we saw in Section 2.1.


    First now we need to set data = guat_dem and use a geom_line() layer, but what
    is the aesthetic mapping of variables? We''d like to see how the democracy score
    has changed over the years, so we need to map


    +   - year to the x-position aesthetic and

    - democracy_score to the y-position aesthetic


    Now we are stuck in a predicament, much like with our variable named country,
    but its only value is "Guatemala". We have other variables denoted by different
    year values. Unfortunately, the guat_dem data frame is not "tidy" and hence not
    in the appropriate format to apply the grammar of graphics, and thus we cannot
    use the ggplot2 package just yet.


    We need to take the values of the columns corresponding to years in guat_dem and
    convert them into a new "names" variable called year. Furthermore, we need to
    take the democracy score values in the inside of the data frame and turn them
    into a new "values" variable called democracy_score. Our resulting data frame
    will have three columns: country, year, and democracy_score. Recall that the pivot_longer()
    function in the tidyr package does this for us:'
