  md: "# 2.3 5NG#1: Scatterplots\n\n# 2.3.2 Overplotting\n\nThe large mass of points\
    \ near (0, 0) in Figure 2.2 can cause some confusion since it is hard to tell\
    \ the true number of points that are plotted. This is the result of a phenomenon\
    \ overplotting. As one may guess, this corresponds to points being plotted on\
    \ top of each other over and again. When overplotting occurs, it is difficult\
    \ to know the number of points being plotted. There are two methods to address\
    \ the issue of overplotting. Either by\n\n+   1. Adjusting the transparency of\
    \ the points or\n2. Adding a little random “jitter,” or random “nudges,” to each\
    \ of the points.\n\n# Method 1: Changing the transparency\n\nThe first way of\
    \ addressing overplotting is to change the transparency/opacity of the points\
    \ by setting the alpha argument in geom_point(). We can change the alpha argument\
    \ to be any value between 0 and 1, where alpha sets the points to be 100% transparent\
    \ and By default, alpha is set to 1. In other words, if we don't explicitly set\
    \ an alpha value, R will use alpha = 1.\n\nNote how the following code is identical\
    \ to the code in Section 2.3 that created the scatterplot with overplotting, with\
    \ alpha = 0.2 added to the geom_point() function:\n\n```\nggplot(data = envoy_flights,\
    \ mapping = aes(x = dep_delay, y = arr_delay)) + \ngeom_point(alpha = 0.2)\n```\n\
    \n![](img/445742518041017e8f01f11b0c3190d9_65_0.png)\n\nFIGURE 2.4: Arrival vs.\
    \ departure delays scatterplot with alpha = 0.2."
  merge: -1
  img_proc: true
- pgno: 66
  md: '# 32


    # 2 Data Visualization


    The key feature to note in Figure 2.4 is that the transparency of the points is
    cumulative: areas with a high-degree of overplotting are darker, whereas areas
    with a lower degree are less dark. Note furthermore that there is no aes surrounding
    alpha = 0.2. This is because we are not mapping a variable to a aesthetic attribute,
    but rather changing the default setting of alpha. In fact, you''ll receive an
    error if you try to change the second line to read geom_point(aes(alpha = 0.2)).


    # Method 2: Jittering the points


    The second way of addressing overplotting is by jittering all the points. This
    means giving each point a small "nudge" in a random direction. You can think of
    "jittering" as shaking the points around a bit on the plot. Let''s illustrate
    using a simple example first. We have a data frame with 4 identical rows of x
    and y values: (0,0), (0,0), (0,0), and (0,0). In Figure 2.5, we present both the
    regular scatterplot of these 4 points (on the left) and its jittered counterpart
    (on the right).


    ![](img/445742518041017e8f01f11b0c3190d9_66_0.png)


    FIGURE 2.5: Regular and jittered scatterplot.


    In the left-hand regular scatterplot, observe that the 4 points are superimposed
    on top of each other. While we know there are 4 values being plotted, this fact
    might not be apparent to others. In the right-hand jittered scatterplot, it is
    now plainly evident that this plot involves four points since each point is given
    a random "nudge."'
  merge: -1
  img_proc: true
