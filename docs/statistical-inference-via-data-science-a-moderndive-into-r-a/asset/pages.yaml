    \ In this context, a researcher who wants to show some results or conclusions\
    \ for new findings, needs to prove that the null hypothesis is not true by finding\
    \ evidence against it. We often say that the researcher bears the burden of proof.\n\
    \nThe hypothesis shown above represents a two-sided test because evidence against\
    \ the null hypothesis could come from either direction (greater or less). Sometimes\
    \ it is convenient to work with a left-sided test. In our example, the claim under\
    \ the null hypothesis becomes: \"the average weight is at least 3.6 grams\" and\
    \ the researcher's goal is to find evidence against this claim in favor of the\
    \ competing claim. The competing hypotheses can now be written as as $H_0: \\\
    mu \\geq 3.6$ and $H_A: \\mu < 3.6$ or $H_0: \\mu = 3.6$ and $H_A: \\mu > 3.6$.\
    \ Notice that we can drop the inequality part from the null hypothesis. This simplification\
    \ convenient as we focus on the equal part of the null hypothesis only and becomes\
    \ clearer that evidence against the null hypothesis may only come with values\
    \ less than 3.6, a left-sided test.\n\nSimilarly, a right-sided test can be stated\
    \ $H_0: \\mu = 3.6$ and $H_A: \\mu > 3.6$. Claims under the null hypothesis for\
