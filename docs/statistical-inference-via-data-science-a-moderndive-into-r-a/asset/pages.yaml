  md: 'xxii


    Preface


    In particular, this book will lean heavily on data visualization. In today''s
    world, we are bombarded with graphics that attempt to convey ideas. We will explore
    what makes a good graphic and what standard ways are used to convey relationships
    within data. In general, we''ll use visualization as a way of building almost
    all the ideas in this book.


    To impart the statistical lessons of this book, we have intentionally minimized
    the number of mathematical formulas used. Instead, you''ll develop a conceptual
    understanding of statistics using data visualization and computer simulations.
    We hope this is a more intuitive experience than the way statistics has traditionally
    been taught in the past and how it is commonly perceived.


    Finally, you''ll learn the importance of literate programming. By this mean you''ll
    learn how to write code that is useful not just for a computer to execute, but
    also for readers to understand exactly what your analysis is doing and how you
    did it. This is part of a greater effort to encourage reproducible research (see
    the “Reproducible research”subsection in this Preface for more details). Abelson
    coined the phrase that we will follow throughout this book:


    Programs must be written for people to read, and only incidentally for machines
    to execute.


    We understand that there may be challenging moments as you learn to program. Both
    of us continue to struggle and find ourselves often using web searches to find
    answers and reach out to colleagues for help. In the long though, we can all solve
    problems faster and more elegantly via programming. We wrote this book as our
    way to help you get started and you should know that there is a huge community
    of R users who are happy to help everyone along as. This community exists in particular
    on the internet on various forums and websites as stackoverflow.com.


    # Data/science pipeline


    You might think of statistics as just being a bunch of numbers. We commonly hear
    the phrase “statistician” when listening to broadcasts of sports events. Statistics
    (in particular, data analysis), in addition to describing numbers like those used
    with baseball batting averages, plays a vital role in all of the scenes.


    You''ll commonly hear the phrase “statistically significant” thrown around in
    the media. You''ll see articles that say “Science now shows that chocolate is
    good for you.” Underning these claims is data analysis. By the end of this book,
    you''ll be able to


