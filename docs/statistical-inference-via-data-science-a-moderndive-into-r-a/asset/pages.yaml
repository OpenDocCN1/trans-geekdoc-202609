    # 4.1 Importing data


    Up this point, we''ve almost entirely used data stored inside of an R package.
    Say instead you have your own data saved on your computer or somewhere online.
    How can you analyze this data in R? Spreadsheet data is often saved in one of
    the following three formats:


    First, Comma Separated Values .csv file. You can think of a .csv file as a bare-bones
    spreadsheet where:


    +   - Each line in the file corresponds to one row of data/one observation.

    - Values for each line are separated by commas. In other words, the values of
    different variables are separated by commas, in each row.

    - The first line is often, but not always, a header indicating the names of the
    columns/variables.


    Second, an .xlsx spreadsheet file. This format is based on Microsoft’s proprietary
    Excel software. As opposed to bare-bones .csv files, .xlsx Excel files contain
    a lot of meta-data (data about data). We recall a previous example of meta-data
    in Section 3.4 when adding “group structure” meta-data to a data frame by using
    group_by() verb. Some examples of Excel meta-data include the use of bold and
    italic fonts, colored cells, different column widths, and formula macros.


    Third, a Google Sheets'' file, which is a “cloud” or online-based way to work
    with a spreadsheet. Google Sheets allows you to download your data in both comma-separated
    values .csv and Excel .xlsx formats. One way to import Google Sheets data in R


    > https://www.google.com/sheets/about/'
