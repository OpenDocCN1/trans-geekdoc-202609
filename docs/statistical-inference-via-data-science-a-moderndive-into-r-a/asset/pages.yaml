  md: '26


    2 Data Visualization


    Let''s view this plot through the grammar of graphics:


    +   1. The data variable **GDP per Capita** gets mapped to the x-position aesthetic
    of the points.

    2. The data variable **Life Expectancy** gets mapped to the y-position aesthetic
    of the points.

    3. The data variable **Population** gets mapped to the size aesthetic of the points.

    4. The data variable **Continent** gets mapped to the color aesthetic of the points.


    We''ll see shortly that data corresponds to the particular data frame where our
    data is saved and "data variables" correspond to particular columns in the data.
    Furthermore, the type of geometric object considered in this plot are points.
    That being said, while in this example we are considering points, graphics are
    not limited to just points. We can also use lines, bars, and other geometric objects.


    Let''s summarize the three essential components of the grammar of graphics for
    Table 2.2.


    # TABLE 2.2: Summary of the grammar of graphics for this plot


    | data variable | aes | geom |

    |---|---|---|

    | GDP per Capita | x | point |

    | Life Expectancy | y | point |

    | Population | size | point |

    | Continent | color | point |


    # 2.1.3 Other components


    There are other components of the grammar of graphics we can control as well.
    As you start to delve deeper into the grammar of graphics, you''ll start to encounter
    these topics more frequently. In this book, we''ll keep things simple and only
    work with these additional components:


    +   -ing breaks up a plot into several splits by the values of another variable
    (Section 2.6)

    - position adjustments for barplots (Section 2.8)


    Other more complex components like size and coordinate systems are left for a
    more advanced text such as R for Data Science* (Grolemund and Wickham, 2017).
    Generally speaking, the grammar of graphics allows for a high degree of customization
    of points and also a consistent framework for easily updating and modifying them.


    > 5http://r4ds.had.co.nz/data-visualisation.html#aesthetic-mappings'
  merge: -1
  img_proc: true
- pgno: 61
  md: '# 2.2 Five named graphs – the 5NG


    # 2.1.4 ggplot2 package


    In this book, we will use the ggplot2 package for data visualization, which is
    an implementation of the grammar of graphics for R (Wickham et al., 2024a). As
    we noted earlier, a lot of the previous section was written in a computer code-type
    font. This is because the various components of the grammar of graphics are specified
    in the `ggplot()` function included in the ggplot2 package. For the purposes of
    this book, we will always provide the `ggplot()` function with the following arguments
    (i.e., inputs) at a minimum:


    +   - The data frame where the variables exist: the data argument.

    - The mapping of the variables to aesthetic attributes: the `mapping` argument
    which specifies the `aesthetic` attributes involved.


    After we''ve specified these components, we then add layers to the plot using
    the + sign. The most essential layer to add to a plot is the layer that specifies
    which type of geometric object we want to plot: points, lines, bars, and others.
    Other layers we can add to a plot that include the plot title, axes, labels, visual
    themes for the plots, and facets (which we see in Section 2.6).


    Let''s now put the theory of the grammar of graphics into practice.


    # 2.2 Five named graphs – the 5NG


    In order to keep things simple in this book, we will only focus on five different
    types of graphics, each with a commonly given name. We term these “five named
    graphs” or in abbreviated form, the **5NG**:


    +   1. scatterplots

    2. linegraphs

    3. histograms

    4. boxplots

    5. barplots


    We''ll also present some variations of these plots, but with this basic repertoire
    of graphics in your toolbox, you can visualize a wide array of different variable
    types. Note that certain plots are only appropriate for categorical variables,
    while others are only appropriate for numerical variables.'
  merge: -1
  img_proc: true
- pgno: 62
  md: '# 2.3 5NG#1: Scatterplots


    The simplest of the 5NG are scatterplots, also called bivariate plots. They allow
    you to visualize the relationship between two numerical variables. While you may
