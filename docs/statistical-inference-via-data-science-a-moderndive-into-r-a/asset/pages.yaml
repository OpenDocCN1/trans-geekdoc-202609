  md: '# 9.4 Conducting hypothesis tests


    (LC9.2) Why are we relatively confident that the distributions of the sample proportions
    will be good approximations of the population distributions of popularity for
    the two genres?


    (LC9.3) Using the definition of p-value, write in words what the p-value represents
    for the hypothesis test comparing the popularity rates for metal and deep house.


    # 9.4.3 There is only one test


    Let''s recap the steps necessary to conduct a hypothesis test using the terminology,
    notation, and definitions related to sampling you saw in Section 9.3 and the infer
    workflow from Subsection 9.4:1:


    +   - specify() the variables of interest your data frame.

    - hypothesize() the null hypothesis H₀. In other words, say a “model for the universe”
    assuming H₀ is true.

    - generate() assumes H₀ is true. In other words, simulate data assuming H₀ is
    true.

    - calculate() the test statistic of interest, both for the observed data and your
    simulated data.

    - visualize() the resulting null distribution and compute the p-value by comparing
    the null distribution to the observed test statistic.


    While this is a lot to digest, especially the first time you encounter this general
    framework, the nice thing is that once you understand this general framework,
    you can understand any hypothesis test. In a famous blog post, computer scientist
    Allen Downey called the “There is only one test” framework, by which he created
    the flowchart displayed in Figure 9.11.


    ![](img/445742518041017e8f01f11b0c3190d9_363_0.png)


    > ¹http://allendowney.blogspot.com/2016/06/there-is-still-only-one-test.html'
  merge: -1
  img_proc: true
