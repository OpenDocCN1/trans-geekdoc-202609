  md: '# 3


    # Data Wrangling


    So far in our journey, we''ve seen how to look at data saved in data frames using
    the glimpse() and View() functions in Chapter 1, and how to create data visualizations
    using the ggplot2 package in Chapter 2. In particular, we studied what we term
    the "five named graphs" (5NG):


    +   1. scatterplots via geom_point()

    2. linegraphs via geom_line()

    3. boxplots via geom_boxplot()

    4. histograms via geom_histogram()

    5. barplots via geom_bar() or geom_col()


    We created these visualizations using the grammar of graphics, which maps variables
    in a data frame to the aesthetic attributes of one of the 5 geometric objects.
    We can also control other aesthetic attributes of the geometric objects such as
    the size and color in the Gapminder data example in Figure 2.1.


    In this chapter, we''ll introduce a series of functions from the dplyr package
    for data wrangling that will allow you to take a data frame and "wrangle" it to
    suit your needs. Such functions include:


    +   1. filter() a data frame''s existing rows to pick out a subset of them. For
    example, the alaska_flights data frame.

    2. summarize() one or more of its columns/variables with a summary statistic.
    Examples of summary statistics include the median and interquartile range of temperatures
    as we saw in Section 2.7 on boxplots.

    3. group_by() assign different rows to be part of the same group. We can then
    combine group_by() with summarize() to report summary statistics for each group
    separately. For example, say you don''t want a single overall average departure
    dep_delay for all origins combined, but rather three separate average departure
    times, computed for each of the three origin airports.

    4. mutate() its existing columns/variables to create new ones. For example, convert
    hourly temperature readings from Fahrenheit to Celsius.

    5. arrange() its rows. For example, sort the rows of weather in ascending or descending
    order of temp.

    6. join() with another data frame by matching along a "key" variable. In other
    words, merge these two data frames together.


    DOI: 10.12011/9781032724546-3


    61'
