    setting.


    We will end with a discussion on what it means to “tell your story with data”
    in Chapter 11 by presenting example studies.3


    # What we hope you will learn from this book


    We hope by the end of this book, you''ll have learned how to:


    +   1. Use R and the tidyverse suite of R packages for data science.

    2. Fit your models to data, using a method known as linear regression.

    3. Perform statistical inference using sampling, confidence intervals, and hypothesis
    tests.

    4. Tell your story with data using these tools.


    What do we mean by data stories? We mean any analysis involving data with careful
    visuals and thoughtful discussion. Further discussions on data stories can be
    found in the blog post “Tell a Meaning Story With Data.”4


    Over the course of this book, you will develop your “data science toolbox,” equipping
    yourself with tools such as data visualization, data formatting, data wrangling,
    and statistical/data modeling using regression.


    > 3Note that you''ll see different versions of “Modernive” in this book: (1) modernive
    refers to the R package. (2) ModernDev is an abbreviation of Statistical Inference
    via Data Science: A ModernDev into the Tidyverse. It''s essentially a nickname
    we gave the book. (3) ModernDev (without italics) corrects both the book and the
    corresponding R package together as an entity.


