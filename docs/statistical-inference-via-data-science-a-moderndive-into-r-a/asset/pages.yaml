    glimpse(flights_reorder)

    ```


    # ### 3.8.2 relocate variables


    Another (usally shorter) case to reorder variables is by using relocate() function.

    This function allows you to move variables to a new position in the data frame.

    For example, if we want to move the hour, minute, and time_hour variables to appear

    immediately after the year, month, and day variables, we can use the following
    code:


    ```

    flights_relocate <- flights |>

    relocate(hour, minute, time_hour, .after = day)

    glimpse(flights_relocate)

    ```


    # ### 3.8.3 rename variables


    One more useful function is rename(), which as you may have guessed changes the

    ame of variables. Suppose we want to only focus on dep_time and arr_time and

    change dep_time and arr_time to be departure_time and arrival_time instead of
    the

    flights_time_new data frame:


    ```

    flights_time_new <- flights |>

    select(dep_time, arr_time) |>

    rename(departure_time = dep_time, arrival_time = arr_time)

    glimpse(flights_time_new)

    ```


    Note in this case we used a sign = sign within the rename(). For example,

    departure_time = dep_time renames the dep_time variable to have the new name de-

    art_time. This is because we are not testing for equality like we would using
    ==.

    Instead we want to assign a new variable departure_time to have the same values
    as

    dep_time and then delete the variable dep_time. Note that new dplyr users forget

    that the new variable name comes before the equal sign.'
