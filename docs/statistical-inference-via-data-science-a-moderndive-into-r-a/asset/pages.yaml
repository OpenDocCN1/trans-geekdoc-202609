    # 11.2.3 Regression modeling


    Which of the two models in Figure 11.6 is “better”? The interaction model in the
    left-hand plot or the parallel slopes model in the right-hand plot?

    With model selection, we should only favor more complex models if the additional
    complexity is warranted. In this case, the more complex model is the interaction
    model since it considers five intercepts and five slopes total. This is in contrast
    to the parallel slopes model which considers five intercepts but only one common
    slope.'
