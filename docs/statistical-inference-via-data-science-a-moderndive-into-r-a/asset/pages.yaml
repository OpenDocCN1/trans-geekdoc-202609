  md: "# 10 Inference for Regression\n\n# 10.2.1 Conceptual framework\n\nWe start\
    \ by reviewing the assumptions of the linear model. We continue using the old_faithful_2024\
    \ to illustrate some of this framework. Recall that we have a random sample of\
    \ $n = 114$ observations. Since we assume a linear relationship between the duration\
    \ of an eruption and the waiting time to the next, we can extract the linear relationship\
    \ for the $i$th observation with $y_i = \beta_0 + \beta_1 \\cdot x_i$ for $i =\
    \ 1, \\dots, n$. Observe that $x_i$ is the duration of the $i$th eruption in the\
    \ sample, and $\beta_0$ and $\beta_1$ are the population parameters that are considered\
    \ constant. The error term $\\epsilon_i$ is a random variable that represents\
    \ how different the observed response $y_i$ is from the expected response $\b\
    eta_0 + \beta_1 \\cdot x_i$.\n\nWe can illustrate the role of the error term using\
    \ two observations from our old_faithful_2024 dataset. We assume for now that\
    \ the linear model is appropriate and truly represents the relationship between\
    \ duration and waiting times. We select the 49th and 51st observations in our\
    \ sample by using the function slice() with the corresponding rows:\n\n```\n```\n\
    old_faithful_2024 |>\nslice(c(49, 51))\n# tibble: 2 x 6\nerruption_id date time\
    \ waiting duration\n<dbl><date> <dbl><chr>\n1 146954 2024-07-18 1117 139 236\n\
    2 146943 2024-07-17 1157 176 236\n```\n```\n\nObserve that the duration is the\
    \ same for both observations, but the response waiting time is different. Assuming\
    \ that the linear model is appropriate, both responses can be expressed as:\n\n\
    > $y_{49} = \beta_0 + \beta_1 \\cdot 236 + \\epsilon_{49}$\nny_{51} = \beta_0\
    \ + \beta_1 \\cdot 236 + \\epsilon_{51}$\n\n$y_{49} = 139$ and $y_{51} = 176$.\
    \ The difference in response is due to the error term as it accounts for variation\
    \ in the response not accounted for by the linear model.\n\nIn the linear model\
    \ the error term $\\epsilon_i$ has expected value $E(\\epsilon_i) = 0$ and standard\
    \ deviation $SD(\\epsilon_i) = \\sigma$. Since a random sample is taken, we assume\
    \ that any two error terms $\\epsilon_i$ and $\\epsilon_j$ for any two different\
    \ eruptions $i$ and $j$ are independent.\n\nIn order to perform the theory-based\
    \ inference we require one additional assumption. Let the error term be normally\
    \ distributed with an expected value (mean) equal to zero and a standard deviation\
    \ equal to $\\sigma$:\n\n$\\epsilon_i \\sim \\text{Normal}(0, \\sigma)$."
  merge: -1
