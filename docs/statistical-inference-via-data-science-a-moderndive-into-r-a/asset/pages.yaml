  img_proc: true
- pgno: 175
  md: '# 5.2 One categorical explanatory variable


    $\hat{y} = life \exp = b_0 + b_{Asia} \cdot \mathbb{1}_{Asia}(x) + b_{Europe}
    \cdot \mathbb{1}_{Europe}(x)\n$+ b_{NorthAmerica} \cdot \mathbb{1}_{NorthAmerica}(x)
    + b_{Oceania} \cdot \mathbb{1}_{Oceania}(x)\n$+ b_{SouthAmerica} \cdot \mathbb{1}_{SouthAmerica}(x)\n$=
    66.31 + 8.64 \cdot \mathbb{1}_{Asia}(x) + 13.6 \cdot \mathbb{1}_{Europe}(x)$\n$+
    9.98 \cdot \mathbb{1}_{NorthAmerica}(x) + 8.11 \cdot \mathbb{1}_{Oceania}(x)$\n$+
    8.92 \cdot \mathbb{1}_{SouthAmerica}(x)$


    Whoa! That looks daunting! Don''t fret, however, as you understand what all the
    elements mean, dauntings simplify greatly. First, $\mathbb{1}_A(x)$ is what''s
    known in mathematics as an "indicator function." It returns one of two possible
    values, 0 and 1, where


    ```

    $$\mathbb{1}_A(x) = \begin{cases} 1 & \text{if } x \text{ is in } A \ 0 & \text{otherwise}
    \end{cases}$

    ```


    In a statistical modeling context, this is also known as a dummy variable. In
    our case, we consider the first such indicator variable $\mathbb{1}_{Amer}(x)$.
    This indicator returns 1 if a country is in the Asia, 0 otherwise


    ```

    $$\mathbb{1}_{Amer}(x) = \begin{cases} 1 & \text{if } x \text{ is in Asia} \ 0
    & \text{otherwise} \end{cases}$

    ```


    Second, $b_0$ corresponds to the intercept as before; in this case, it is the
    mean expectancy of all countries in Africa. Third, $b_{Asia}, b_{Europe}, b_{NorthAmerica},
    b_{Oceania},$ and $b_{SouthAmerica}$ represent the 5 "offsets relative to the
    baseline for comparison" in the regression coefficients.


    We put this all together and compute the fitted value $\hat{y} = life \exp$ for
    a country in Africa. Since the country is in Africa, all five indicator functions
    $\mathbb{1}_{Asia}(x), \mathbb{1}_{Europe}(x), \mathbb{1}_{NorthAmerica}(x), \mathbb{1}_{Oceania}(x),$
    and $\mathbb{1}_{SouthAmerica}(x)$ will equal 0, and thus:


    ```

    $$\hat{y} = b_0 + b_{Asia} \cdot \mathbb{1}_{Asia}(x) + b_{Europe} \cdot \mathbb{1}_{Europe}(x)\n$+
    b_{NorthAmerica} \cdot \mathbb{1}_{NorthAmerica}(x) + b_{Oceania} \cdot \mathbb{1}_{Oceania}(x)\n$+
    b_{SouthAmerica} \cdot \mathbb{1}_{SouthAmerica}(x)\n$= 66.31 + 8.64 \cdot \mathbb{1}_{Asia}(x)
    + 13.6 \cdot \mathbb{1}_{Europe}(x)\n$+ 9.98 \cdot \mathbb{1}_{NorthAmerica}(x)
    + 8.11 \cdot \mathbb{1}_{Oceania}(x)\n$+ 8.92 \cdot \mathbb{1}_{SouthAmerica}(x)\n$=
    66.31 + 8.64 \cdot 0 + 13.6 \cdot 0 + 9.98 \cdot 0 + 8.11 \cdot 0 + 8.92 \cdot
    0\n$= 66.31$

    ```


    In other words, all that left is the intercept $b_0$, corresponding to the life
    expectancy of African countries of 66.31 years. Next, say we are considering a
    country in Asia. In this case, only the indicator $\mathbb{1}_{Asia}(x)$ for Asia
    will equal 1, while all the others will equal 0, and thus:'
  merge: -1
  img_proc: true
- pgno: 176
  md: "# 142\n5 Simple Linear Regression\n\n```\n$life \\exp = b_0 + b_{Asia} \\cdot\
    \ \\mathbb{1}_{Asia}(x) + b_{Europe} \\cdot \\mathbb{1}_{Europe}(x)\\n+ b_{North\
    \ America} \\cdot \\mathbb{1}_{North America}(x) + b_{Oceania} \\cdot \\mathbb{1}_{Oceania}(x)\\\
    n+ b_{South America} \\cdot \\mathbb{1}_{South America}(x)\\n= 66.31 + 8.64 \\\
    cdot \\mathbb{1}_{Asia}(x) + 13.6 \\cdot \\mathbb{1}_{Europe}(x)\\n+ 9.98 \\cdot\
    \ \\mathbb{1}_{North America}(x) + 8.11 \\cdot \\mathbb{1}_{Oceania}(x)\\n+ 8.92\
    \ \\cdot \\mathbb{1}_{South America}(x)\\n= 66.31 + 8.64 \\cdot 13.6 + 9.98 \\\
    cdot 0.81 \\cdot 0.81 \\cdot 8.92\\n= 66.31 + 8.64\\n= 74.95$\n```\n\nwhich is\
    \ the mean life expectancy for countries in Asia of 74.9 years in Table 5.7. Note\
    \ the \"offset from the baseline for comparison\" is +86.4 years.\n\n do one more.\
    \ We are considering a country in South America. In this case, the only indicator\
    \ $\\mathbb{1}_{South America}(x)$ for South America will be one, while the others\
    \ will be zero, and thus:\n\n```\n$life \\exp = b_0 + b_{Asia} \\cdot \\mathbb{1}_{Asia}(x)\
    \ + b_{Europe} \\cdot \\mathbb{1}_{Europe}(x)\\n+ b_{North America} \\cdot \\\
    mathbb{1}_{North America}(x) + b_{Oceania} \\cdot \\mathbb{1}_{Oceania}(x)\\n+\
    \ b_{South America} \\cdot \\mathbb{1}_{South America}(x)\\n= 66.31 + 8.64 \\\
    cdot \\mathbb{1}_{Asia}(x) + 13.6 \\cdot \\mathbb{1}_{Europe}(x)\\n+ 9.98 \\cdot\
    \ \\mathbb{1}_{North America}(x) + 8.11 \\cdot \\mathbb{1}_{Oceania}(x) + 8.92\
    \ \\cdot \\mathbb{1}_{South America}(x)\\n= 66.31 + 8.64 \\cdot 0 + 13.6 \\cdot\
    \ 0 + 9.98 \\cdot 0 \\ 0 + 8.92 \\cdot 1\\n= 66.31 + 8.92\\n= 75.23$\n```\n\n\
    which is the mean life expectancy for South American countries of 75.23 years\
    \ in Table 5.7. The \"offset from the baseline for comparison\" is +86.4 years.\n\
    \nWe generalize this idea. If we fit a regression model using a categorical explanatory\
    \ variable $x$ with $k$ possible countries, the regression will return an intercept\
    \ and $k-1$ \"offsets.\" In our case, since there are $k=6$ continents, the regression\
    \ model returns an intercept corresponding to the baseline for comparison group\
    \ of Africa and $k-1=5$ offsets corresponding to Asia, Europe, North America,\
    \ Oceania, and South America.\n\nUnderstanding a regression table output when\
    \ you are using a categorical explanatory variable is a topic new to regression\
    \ often struggle with. The real remedy for these struggles is practice, practice,\
    \ practice. However, once once once yourself yourself with how to of regression\
    \ models using categorical explanatory variables, you'll be able to incorporate\
    \ many new variables into your models, given the large amount of world's data\
    \ that is categorical."
