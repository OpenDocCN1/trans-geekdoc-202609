    and others are greater than 45%, but most of the sample proportions are between
    30% and 45%.


    We can also use this activity to introduce some statistical terminology. The process
    of taking repeated samples of 50 balls and finding the corresponding sample proportions
    is called sampling. If we returned the observed balls to the bowl before getting
    another sample, we say that we performed sampling with replacement and because
    we mixed the balls before taking a new sample, the samples were randomly drawn
    and are called random samples.


    As shown in Figure 7.7, different random samples produce different sample proportions.
    This phenomenon is called sampling variation. Furthermore, the histogram is a
    graphical representation of the distribution of sample proportions; it describes
    the sample proportions determined and how often they appear. The distribution
    of all possible sample proportions that can be found from random samples is called,
    appropriately, the sampling distribution of the sample proportion. The sampling
    distribution is central to the ideas we develop in this chapter.'
