- pgno: 38
  md: '# 1.2 How do I set up with R and RStudio?


    Now that you''re with R and RStudio, you are probably asking yourself, "OK. Now
    how do I use R?\ The first thing to note is that unlike other statistical software
    programs like Excel, SPSS, or Minitab that provide point-and-click¹ interfaces,
    R is an interpreted language². This means you have to type in commands written
    in R *code*. In other words, you have to code/program in R. Note that we will
    use the terms "coding" and "programming" interchangeably in this book.


    While it is not required to be a seasoned code/computer programmer to use R, there
    is still a set of basic programming concepts that R users need to understand.
    Consequently, while this book is not a book on programming, you will still learn
    enough of these basic programming concepts needed to explore and analyze data
    effectively.


    # 1.2.1 Basic programming concepts and terminology


    We introduce some basic programming concepts and terminology. Instead of asking
    you to memorize all these concepts and terminology right now, we''ll guide you
    so that you "learn by doing." To help you learn, we will always use a different
    font to distinguish regular text from *computer_code*. The best way to master
    these topics is, in our opinion, deliberate³ with R and lots of repetition.


    +   Basics:

    - *Console pane*: where you enter in commands.

    - *Running code*: the act of telling R to perform an act by giving commands in
    the console.

    - *Objects*: where values are saved in R. We''ll show you how to *assign* values
    to objects and how to display the contents of objects.

    - *Data types*: doubles/numerics, logicals, characters. Integers are values like
    -1, 0, 2, 4092. Doubles or numerics are a larger set of values containing both
    the integers but also fractions and decimal values like -24.932 and 0.8. Logicals
    are either `TRUE` or `FALSE` while characters are text such as "cabbage," "Hamilton,"
    "The Wire is the greatest TV show ever," and "This ramen is delicious." Note that
    characters are often denoted with the quotation marks around them.


    +   *Vectors*: a series of values. These are created using the c() function, where
    c() stands for "combine" or "concatenate." For example, c(6, 11, 13, 31, 90, 92)
    creates a series of elements of positive integer values.


    ¹https://en.wikipedia.org/wiki/Point_and_click

    ²https://en.wikipedia.org/wiki/Interpreted_language

    ³https://jamesclear.com/deliberate-practice-theory'
  merge: -1
  img_proc: true
- pgno: 39
  md: '+   Factors: categorical data are commonly represented in R as factors. Categorical
    data can also be represented as strings. We''ll study this difference as we progress
    through the book.


    +   Data frames: rectangular spreadsheets. They are representations of datasets
    in R where the rows correspond to observations and the columns correspond to variables
    that describe the observations. We''ll cover data frames later in Section 1.4.


    +   Conditionals:

    - Testing for equality in R == (and not !=, which is typically used for assignment).
    For example, 2 + 1 == 3 compares 2 + 1 to 3 and returns correct code, while 2
    + 1 = 3 will return an error.

    - Boolean algebra: TRUE/FALSE statements and mathematical operators such as <
    (less than), <= (less than equal to), != (not equal to). For example, 4 + 2 >=
    return TRUE, 3 + 5 == 1 will return FALSE.

    - Logical operators: representing “and” and “or” as well as representing “or”.
    For example, (2 + 1 == 3) and (2 + 1 == 4) returns FALSE because both are not
    TRUE (only the first is TRUE). On the other hand, (2 + 1 == 3) | (2 + 1 == 4)
    returns TRUE since one of the clauses is TRUE.


    +   Functions, also called commands: Functions perform tasks in R. They take in
    arguments and return outputs. You can manually specify a function''s arguments
    or use the function''s default values.


    +   - For example, the function seq in R generates sequences of numbers. If you
    just run seq() it will return the value 1. That doesn''t seem very useful! This
    is because the default arguments are set as seq(from = 1, to = 1). Thus, if you
    don''t pass in different values for from and to change this, R assumes all you
    want is the number 1. You can change the argument values by updating the values
    after the = sign. If we try seq(from = 2, to = 5) we get the result 2 3 4 5 which
    we might expect.

    - We''ll work with functions a lot throughout this book and you''ll get lots of
    practice in understanding their behaviors. To assist you in understanding when
    a function is mentioned in the book, we''ll also include the () after as we did
    with seq().


    This list is by no means an exhaustive list of all the programming concepts and
    terminology to become a savvy R user; such a list would be so large it wouldn''t
    be very useful, for novices. Rather, we feel this is a minimally viable list of
    programming concepts and terminology you need to know before starting. We feel
    that you can learn the rest as we go. Remember that mastery of all of these concepts
    and terminology will build as you practice more and more.


    # ## 1.2.2 Errors, warnings, and messages


    One that intimidates new R and RStudio users is how it reports errors, warnings,
    and messages. R reports errors, warnings, and messages in a glaring red font,
    which'
