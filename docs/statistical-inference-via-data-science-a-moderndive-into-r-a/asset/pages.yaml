- pgno: 185
  md: '# 5.3 Related topics


    Any other straight line in the figure would yield a sum of squared residuals greater
    than 81.265. This is a mathematically guaranteed fact that you can prove using
    calculus and linear algebra. That’s why alternative names for the linear regression
    line are the best-fitting line and the least-squares line.


    Why do we square the residuals (i.e., the arrow lengths?) So that both positive
    and negative deviations of the same amount are treated equally. (That being said,
    while taking the absolute value of the residuals would also treat both positive
    and negative deviations of the same amount equally, squaring the residuals is
    used for reasons related to calculus: taking derivatives and minimizing functions.
    To learn more suggest consult a textbook on mathematical statistics.)


