  md: '# 1

    Getting Started with Data in R


    Before we can start exploring data in R, there are some key concepts to understand
    first:


    +   1. What are R and RStudio?

    2. How do I code in R?

    3. What are R packages?


    We''ll introduce these concepts in the upcoming Sections 1.1–1.3. If you are already
    somewhat familiar with these concepts, feel free to skip to Section 1.4 where
    we''ll introduce our first dataset: all domestic flights departing out of the
    three main New York City (NYC) airports in 2023. We will explore this dataset
    in depth for much of the rest of this book.


    # 1.1 What are R and RStudio?


    Throughout this book, we will assume that you are using R via RStudio. First time
    users often confuse the two. At its simplest, R is like a car''s engine while
    RStudio is like a car''s dashboard as illustrated in Figure 1.1.


    ![](img/445742518041017e8f01f11b0c3190d9_35_0.png)


    FIGURE 1.1: Analogy of difference between R and RStudio.'
