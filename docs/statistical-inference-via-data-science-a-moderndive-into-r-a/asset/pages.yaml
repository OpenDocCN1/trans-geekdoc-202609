    # 5.2.3 Observed/fitted values and residuals


    Recall in Subsection 5.1.3, we defined the following three concepts:


    +   1. Observed values $y$, or the observed value of the outcome variable

    2. Fitted values $\hat{y}$, or the value on the regression line for a given $x$
    value

    3. Residuals $y-\hat{y}$, or the error between the observed value and the fitted
    value


    We obtained these values and other values using the `get_regression_points()`
    function from the `modndrive` package. This time, however, we add an argument
    ID = "country": this is telling the function to use the variable country in gapminder(2022)
    as an `identification variable` in the output. This will help contextualize our
    analysis matching values to countries.


    ```

    regression_points <- get_regression_points(life_exp_model, ID = "country")

    ression_points

    ```'
