  md: "# 10 Inference for Regression\n\nThis is an optimization problem and to solve\
    \ it analytically requires calculus and the topic goes beyond the scope of this\
    \ book. We provide a sketch of the solution here for those familiar with the method:\
    \ using the expression above we find the partial derivative with respect to $\b\
    eta_0$ and equate that expression to zero, the partial derivative with respect\
    \ to $\\beta_1$ and equate that expression to zero, and use those two equations\
    \ to solve for $\\hat{\beta}_0$ and $\\hat{\beta}_1$. The solutions are the regression\
    \ coefficients introduced in Section 5.1: $\\hat{\beta}_0$ is the estimator of\
    \ $\beta_0$ and $\\hat{\beta}_1$ is the estimator of $\beta_1$. They are called\
    \ the least squares estimators and their mathematical expressions are:\n\n```\n\
    $b_1 = \\frac{\\sum_{i=1}^n (x_i - \\bar{x})(y_i - \\bar{y})}{\\sum_{i=1}^n (x_i\
    \ - \\bar{x})^2} \\quad b_0 = \\bar{y} - b_1 \\cdot \\bar{x}.$\n```\n\nFurthermore,\
    \ as *estimator* for the standard deviation of $\\epsilon_i$ is given by\n\n```\n\
    $s = \\sqrt{\\frac{\\sum_{i=1}^n [y_i - (b_0 + b_1 \\cdot x_i)]^2}{n-2}} = \\\
    sqrt{\\frac{\\sum_{i=1}^n (y_i - \\hat{y}_i)^2}{n-2}}\n```\n\nThese equivalent\
    \ calculations are done in R when using the lm() function. old_faithful_2024 we\
    \ get:\n\n```\n# Fit regression model:\nmodel_1 <- lm(waiting ~ duration, data\
    \ = old_faithful_2024)\n\n# Get the coefficients and standard deviation for the\
    \ model\ncoef(model_1)\nsigma(model_1)\n```\n\n# Table 10.1: Old faithful geyser\
    \ linear regression coefficients\n\n| Coefficients | Values |\n|---|---|\n| (Intercept)\
    \ b0 | 79.459 |\n| duration b1 | 0.371 |\n| s | 20.370 |\n\nBased on these data\
    \ and assuming the linear model is appropriate, we can say for every additional\
    \ second that an eruption lasts, the waiting to the next eruption increases, on\
    \ average, 0.37 minutes. Any eruption lasts longer than zero seconds, so the intercept\
    \ has no meaningful interpretation in this example. Finally, we roughly expect\
    \ the waiting time for the next eruption to be 20.37 minutes away from the regression\
    \ line value, on average."
