  md: "# 10.1 The simple linear regression model\n\nis the observed value of the response\
    \ variable $Y$. Since the sample has $n$ observations we let $i = 1, ..., n$.\n\
    \nIn our example $n = 114$, and $(x_2, y_2) = (259, 184)$. Figure 10.2 shows the\
    \ scatterplot for the entire sample with some transparency set to check for overplotting:\n\
    \n![](img/445742518041017e8f01f11b0c3190d9_393_0.png)\n\n**FIGURE 10.2: Scatterplot\
    \ of relationship of eruption duration and waiting time.\n\nThe relationship seems\
    \ positive and, to some extent, linear.\n\n# 10.1.4 The method of least squares\n\
    \nIf the association of these variables is linear or approximately linear, we\
    \ can apply the linear model described in Subsection 10.1.2 to each observation\
    \ in the sample:\n\n```\n$$y_1 = \\beta_0 + \\beta_1 \\cdot x_1 + \\epsilon_1$\\\
    n$y_2 = \\beta_0 + \\beta_1 \\cdot x_2 + \\epsilon_2$\\n$\\vdots$\\n$\\vdots$\\\
    n$y_n = \\beta_0 + \\beta_1 \\cdot x_n + \\epsilon_n$\n```\n\nWe want to be able\
    \ to use this model to describe the relationship between the explanatory variable\
    \ and the response, but the parameters $\beta_0$ and $\beta_1$ are unknown to\
    \ us. We estimate these parameters using the random sample by applying the *least-squares*\
    \ method introduced in Section 5.1. We compute the estimators for the intercept\
    \ $(\beta_0)$ and slope $(\beta_1)$ that minimize the *sum of squared residuals*:\n\
    \n```\n$$\\sum_{i=1}^{n} [y_i - (\\beta_0 + \\beta_1 \\cdot x_i)]^2$\n```"
