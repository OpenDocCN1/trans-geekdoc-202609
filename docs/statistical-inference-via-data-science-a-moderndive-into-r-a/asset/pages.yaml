    # 5.2 One categorical explanatory variable


    It is an unfortunate truth that life expectancy is not the same across all countries
    in the world. International development agencies are interested in studying these
    differences in life expectancy in the hopes of identifying where governments should
    allocate resources to this problem. In this section, we explore differences in
    life expectancy in two ways:


    +   - Differences between continents: Are there significant differences in average
    life expectancy between the six populated continents of the world: Africa, North
    America, South America, Asia, Europe, and Oceania?

    - Differences within continents: How does life expectancy vary within the world''s
    five continents? For example, is the spread of life expectancy among the countries
    of Africa larger than the spread of life expectancy among the countries of Asia?


    To answer such questions, we use an updated version of the gampinder data frame
    we visualized in Figure 2.1 in Subsection 2.1.2 on the grammar of graphics. This
    updated data un_member_states_2024 we worked with earlier in this chapter, and
    it is included in the modernverse package. This dataset has international development
    statistics such as life expectancy, GDP per capita, and population for 193 countries
    for years near 2024.


    We use this data for basic regression again, but now using an explanatory variable
    x that is categorical, as opposed to the numerical explanatory variable model
    we used in the previous Section 5.1.


    +   - A numerical outcome variable y (a country''s life expectancy) and

    - A single categorical explanatory variable x (the continent that the country
    is a part of).'
  merge: -1
  img_proc: true
- pgno: 167
  md: '# 5.2 One categorical explanatory variable


    When the explanatory variable $x$ is categorical, the concept of a "best-fitting"
    regression is a little different than the one we saw previously in Section 5.1
    where the explanatory variable $x$ was numerical. We study these differences shortly
    in Subsection 5.2.2, but we first conduct an exploratory data analysis.


    # 5.2.1 Exploratory data analysis


    Data on the 193 countries can be found in the `un_member_states_2024` data frame
    included in the moderndive package. However


    ```

    gapminder2022 <- un_member_states_2024 |

    select(country, life_exp = life_expectancy_2022, continent,

    gdp_per_capita) |>

    a.omit()

    ```


    We perform the first common step in an exploratory data analysis: looking at the
    raw data values. You can do this by using RStudio''s spreadsheet viewer or by
    using the `glimpse()` command as introduced in Subsection 1.4.3 on exploring data
    frames:


    ```

