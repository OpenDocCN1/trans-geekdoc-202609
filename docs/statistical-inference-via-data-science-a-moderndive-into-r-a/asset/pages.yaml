    # 2.8.4 Summary


    Barplots are a common way of displaying the distribution of a categorical variable,
    or in other words the frequency with which the different categories (also called
    levels) occur. They are easy to understand and make it easy to make comparisons
    across levels. Furthermore, when trying to visualize the relationship of two categorical
    variables, you have many options: stacked barplots, side-by-side barplots, and
    faceted barplots. Depending on what aspect of the relationship you are trying
    to emphasize, you will need to make a choice between these three types of barplots
    and own that choice.


    # 2.9 Conclusion


    # 2.9.1 Summary table


    Let''s recap all of the five named graphs (5NG) in Table 2.4 summarizing their
    differences. Using these 5NG, you''ll be able to visualize the distributions and
    relationships of variables contained in a wide array of datasets. This will be
    even more the case as we start to map more variables to more of each geometric
    object''s aesthetic attribute options, further unlocking the awesome power of
    the ggplot2 package.'
