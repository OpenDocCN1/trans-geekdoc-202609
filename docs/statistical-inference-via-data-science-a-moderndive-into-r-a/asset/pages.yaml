    +   - Y is a response variable; here it is “waking up with a headache.”

    - X is a treatment variable whose causal effect we are interested in; here it
    is “sleeping with shoes on.”


    ![](img/445742518041017e8f01f11b0c3190d9_180_0.png)


    # FIGURE 5.10: Causal graph.


    To study the relationship between Y and X, we could use a regression model where
    the outcome is set to Y and the explanatory variable is set to X, as you''ve been
    doing throughout this chapter. Figure 5.10 also includes a third variable with
    arrows pointing at both X and Y:


    +   - Z is a confounding variable that affects both X and Y, and thereby “confounding”
    their relationship. The confounding variable is alcohol.


    Alcohol will cause people to be more likely to sleep with their shoes on as well
    as be more likely to wake up with a headache. Thus any regression model of the
    relationship between X and Y should also use Z as an explanatory variable. In
    other words, our doctor needs to take into account who had been drinking the night
    before. In the next chapter, we''ll start covering multiple regression models
    that allow us to to incorporate more than one variable in our regression models.


    Establishing causation is a tricky problem and frequently takes either carefully-designed
    experiments or methods to control the effects of confounding variables. Both these
    approaches attempt, as they can, either to take all possible confounding variables
    into account or neglect their impact. This allows researchers to focus only on
    the relationship of interest: the relationship between the outcome variable Y
    and the treatment X.


    As you read news stories, be careful not to fall into the trap of thinking that
    correlation implies causation. Check out the Spurious Correlations website for
    some radical examples of variables that are correlated, but are definitely not
    caused.


