  md: '# 10


    # Inference for Regression


    In this chapter, we revisit the regression model studied in Chapters 5 and 6.
    We do it by taking into account the inferential statistics methods introduced
    in Chapters 8 and 9. We will show that when applying the linear regression methods
    introduced earlier on sample data, we can gain insight into the relationships
    between the response and explanatory variables of an entire population.


    # Needed packages


    If needed, read Section 1.3 for information on how to install and load R packages.


    ```

    library(tidyverse)

    library(modndrive)

    library(infer)

    library(gridExtra)

    ```


    Recall that loading the tidyverse package loads many packages that we have encountered
    earlier. For details refer to Section 4.4. The packages moderndrive and infer
    contain functions and data frames that will be used in this chapter.


    # 10.1 The simple linear regression model


    # 10.1.1 UN member states revisited


