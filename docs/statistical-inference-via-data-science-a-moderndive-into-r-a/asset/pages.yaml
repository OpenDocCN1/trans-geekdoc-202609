- pgno: 97
  md: '# 3.1 The pipe operator: |>


    +   1. Take x then

    2. Use x as an input to a function f() *then*

    3. Use the output of f(x) as an input to a function g()

    4. Use the output of g(f(x)) as an input to a function h()


    One way to achieve this sequence of operations is by nesting parentheses as follows:


    ```

    h(g(f(x)))

    ```


    This code isn’t so hard to read since we are applying only three functions: f(),
    then g(), h() and each of the functions is short in its name. Further, each of
    these functions only has one argument. However, you can imagine that this will
    get progressively harder to read as the number of functions applied in your sequence
    increases and the arguments in each function increase as well. This is where the
    pipe operator | comes handy. |> takes the output of one function and then “pipes”
    it to be the input of the next function. Furthermore, a helpful trick is to read
    |> as “then” or “and then.” For example, you can obtain the same output as the
    hypothetical sequence of functions as:


    ```

    x |>

    f() |>

    g() |>

    h()

    ```


    You would read this sequence as:


    +   1. Take x *then*

    2. Use this output as the input to the next function f() *then*

    3. Use this output as the input to the next function g() *then*

    4. Use this output as the input to the next function h()


    While both approaches achieve the same goal, the latter is much more human readable
    we can clearly see the sequence of operations line-by-line. But what are the hypothetical
    x, f(), g(), and h()? Throughout this chapter on data wrangling:


    +   1. The starting value x will be a data frame. For example, the flights data
    we explored in Section 1.4.

    2. The sequence of functions, here f(), g(), and h(), will mostly be a sequence
    of any number of the six data-wrangling verb-named functions we listed in the
    introduction to this chapter. For example, the filter(carrier == "MQ") function
    and argument specified we previewed earlier.'
