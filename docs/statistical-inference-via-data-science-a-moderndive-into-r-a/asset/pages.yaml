  md: "This data frame is not in \"tidy\" format. How would you convert this data\
    \ frame to\n in \"tidy\" format, in particular so that it has a variable fatalities_years\
    \ indicating\nt incident year and a variable count of the fatality counts?\n\n\
    # 4.2.3 nycflights23 package\n\nRecall the nycflights23 package introduced in\
    \ Section 1.4 with data about all\ndomestic flights departing from New City in\
    \ 2023. Let's revisit the flights\ndata frame by running View(flights). We saw\
    \ that flights has a rectangular shape,\nwith each of its 435,352 rows corresponding\
    \ to a flight and each of its 22 columns\ndependent on different characteristics/measurements\
    \ of each data. This satisfied\nt first two criteria of the definition of \"tidy\"\
    \ data from Subsection 4.2.1: \"Each\nforms a column\" and \"Each observation\
    \ forms a row.\" But what about the\nthird property of \"tidy\" data that \"Each\
    \ type of observational unit forms a table?\"\n\nRecall that we saw in Subsection\
    \ 1.4.3 the observational unit for the flights data\nframe is an individual unit.\
    \ In other words, the rows of the flights data frame refer to\ncharacteristics/measurements\
    \ of individual flights. Also included in the nycflights23\npackage are other\
    \ data frames with their rows representing different observational\nunits (Ismay\
    \ et al., 2024):\n\n+   - airlines: translation between two IATA carrier codes\
    \ and airline company\nnames (14 in total). The observational unit is an airline\
    \ company.\n- planes: aircraft information about each of 4,840 planes used, i.e.,\
    \ the observational\nunit is an aircraft.\n- weather: hourly meteorological data\
    \ (about 8,735 observations) for each of the three\nNYC airports, the observational\
    \ unit is an hourly measurement of weather at\none of the airports.\n- airports:\
    \ airport names and locations. The observational unit is an airport.\n\nThe organization\
    \ of the information into these five data frames follows the third \"tidy\"\n\
    data property: observations corresponding to the same observational unit should\
    \ be\nsaved in the same table, i.e., data frame. You could think of this property\
    \ as the old\nEnglish expression: \"birds of a feather together.\"\n\n# 4.3 Case\
    \ study: Democracy in Guatemala\n\nIn this section, we'll show you another example\
    \ of how to convert a data frame\ntat isn't in \"tidy\" format (\"wide\" format)\
    \ to a data frame that is in \"tidy\" format"
