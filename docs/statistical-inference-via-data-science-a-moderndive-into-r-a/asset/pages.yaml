  md: '# 7.1 First activity: Red balls


    This type of calculation will be used often in the next subsections.


    # 7.1.2 Manual sampling


    In the previous sampling we were able to find the proportion of red balls in the
    bowl using R only because we had the information of the entire bowl as a data
    frame. Otherwise, we would have to retrieve this manually. If the bowl contained
    a large number of balls, this could be a long and tedious process. How long do
    you think it would take to do this manually if the bowl had tens of thousands
    of balls? Or millions? Or even more?


    In real-life situations, we are often interested in finding the proportion of
    a very large number of objects, or subjects, and performing an exhaustive count
    could be tedious, impractical, or even impossible. Because of these limitations,
    we typically do not perform exhaustive counts. Rather, for this balls example,
    we randomly select a sample of balls from the bowl, find the proportion of red
    balls in this sample, and use this proportion to learn more about the proportion
    of red balls in the entire bowl.


    # One sample


    We start by inserting a shovel into the bowl as seen in Figure 7.2 and collect
    $5\cdot10 = 50$ balls as shown in Figure 7.3. The set of balls retrieved is called
    a *sample*.


    ![](img/445742518041017e8f01f11b0c3190d9_221_0.png)


    **FIGURE 7.2:** Inserting a shovel into the bowl.'
  merge: -1
  img_proc: true
- pgno: 222
  md: '![](img/445742518041017e8f01f11b0c3190d9_222_0.png)


    **FIGURE 7.3:** Taking a sample of 50 balls from the bowl.


    Observe that 17 of the balls are red, and thus the proportion of red balls in
    the sample is 17/50 = 0.34 or 34%. Compare this to the proportion of red balls
    in the entire bowl. 0.375, that we found in Subsection 7.1.1. The proportion from
    the sample seems actually pretty good, and it did not take much time or energy
    to get. But, was this approximate proportion just a lucky outcome? Could we be
    this lucky the next time we take a sample from the bowl? Next we take more samples
    from the bowl and calculate the proportions of red balls.


    # Thirty-three samples


    We now take many more random samples as shown in Figure 7.4. Each time we do the
    following:


    +   - Return the 50 balls used earlier back into the bowl and mix the contents
    of the bowl to ensure that each new sample is not influenced by the previous sample.

    - Take a new sample with the shovel and determine a new proportion of red balls.


    ![](img/445742518041017e8f01f11b0c3190d9_222_1.png)


    **FIGURE 7.4:** Repeating sampling activity.'
