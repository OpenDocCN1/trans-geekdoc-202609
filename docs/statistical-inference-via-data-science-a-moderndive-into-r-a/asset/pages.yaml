  md: '# Preface


    ![](img/445742518041017e8f01f11b0c3190d9_19_0.png)


    Help! I''m completely new to coding and I need to learn R and RStudio!

    What do I do?


    If you''re asking yourself this question, then you''ve come to the right place!
    Start with the “Introduction for students” section.


    +   - Are you an instructor hoping to use this book in your courses? We recommend
    reading the “Introduction for students” section first. Then, read the “Introduction
    for instructors” section for more information on how to teach with this book.

    - Are you looking to connect with and contribute to ModernDive? Then, read the
    “Connect and contribute” section for information on how.

    - Are you curious about the publishing of this book? Then, read the “About this
    book” section for more information on the open-source technology, in particular
    R Markdown and the bookdown package.


    # Introduction for students


    This book assumes no prerequisites: no algebra, no calculus, and no prior programming/coding
    experience. This is intended to be a gentle introduction to the practice of analyzing
    data and answering questions using data the way data scientists, statisticians,
    data journalists, and other researchers would.


    We present a map of your upcoming journey in Figure 1.'
