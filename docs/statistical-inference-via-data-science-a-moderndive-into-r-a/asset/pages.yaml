- pgno: 250
  md: '# 7.3.5 Summary


    Let''s look at what we have learned about the sampling distribution of the sample
    proportion:


    +   1. The mean of all the sample proportions will be exactly the same as the
    population proportion.

    2. The standard deviation of the sample proportions, also called the standard
    error, is inversely proportional to the square root of the sample size: the larger
    the size used to calculate sample proportions, the closer the sample proportions
    will be from the population proportion, on average.

    3. As long as the random samples are large enough, the sampling distribution of
    the sample proportion, or simply the distribution of $X$, will approximate the
    normal distribution. This is true for sample proportions regardless of the structure
    of the underlying population distribution; regardless of how many red and white
    balls are in the bowl, or whether you are performing any other experiment that
    deals with sample proportions.


    If you want to reinforce these ideas a little more, Shui Chiu, Casey Dunn, and
    Pathikrit Bhattacharyya created a 3-minute and 38-second video at https://youtube.be/jvoxEYmQNHNM
    explaining this crucial statistical theorem using the average weight of wild rabbits
    and the average wingspan of dragons as examples. Figure 7.17 shows a preview of
    this video.


    ![](img/445742518041017e8f01f11b0c3190d9_250_0.png)


    FIGURE 7.17: Preview of Central Limit Theorem video.


    # 7.4 Second activity: Chocolate-covered almonds


    We want to extend the results achieve for the sample proportion to a more general
    case: the sample mean. In this section we show how most of the results for sample
    proportions extend directly to sample means, but we also highlight important differences
    when working with the sampling distribution of the sample mean.'
  merge: -1
  img_proc: true
