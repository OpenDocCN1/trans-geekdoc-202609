- pgno: 243
  md: "# 7.3 The Central Limit Theorem\n\n# Learning check\n\n**(LC7.12)** What is\
    \ the expected value of the sample mean in the context of sampling distributions?\n\
    \n+   - A. The observed value of the sample mean\n- B. The population mean\n-\
    \ C. The median of the sample distribution\n- D. The midpoint of the range\n\n\
    # 7.3.4 Sampling variation: Standard deviation and standard error\n\nAnother relevant\
    \ characteristic observed in Figure 7.13 is how the amount of dispersion or *sampling\
    \ variation* changes when the sample size changes. While all the histograms have\
    \ a similar bell-shaped configuration and are centered at the same value, observe\
    \ when...\n\n+   - the sample size is $n = 25$ (left histogram) the observed sample\
    \ proportions are about low as 0.1 and as high as 0.65.\n- the sample size is\
    \ $n = 50$ (middle histogram) the observed sample proportions are about low as\
    \ 0.15 and as high as 0.55.\n- the sample size is $n = 100$ (right histogram)\
    \ the observed sample proportions are about low as 0.20 and as high as 0.55.\n\
    \nAs the sample size $n$ increases from 25 to 50 to 100, the variation of the\
    \ sampling distribution decreases. Thus, the values are clustered more and more\
    \ tightly around the center of the distribution. In other words, the histogram\
    \ on Figure 7.13 is more spread out than the one in the middle, which in turn\
    \ is more spread out than the one on the right.\n\nWe know that the center of\
    \ the distribution is the expected value of $\bar{X}$, which is the population\
    \ proportion. From this, we can quantify this by calculating how far the sample\
    \ proportions are, on average, from the population proportion. A well-known statistical\
    \ measurement to quantify dispersion is the *standard deviation*. We discuss how\
    \ it works before we continue with the sampling variation problem.\n\n# The standard\
    \ deviation\n\nWe start with an example and introduce some notation. As an illustration,\
    \ given four values $y_1 = 3, y_2 = -1, y_3 = 5$, and $y_4 = 9$, their average\
    \ is given by"
  merge: -1
  img_proc: true
- pgno: 244
  md: "The Greek letter Σ represents summation of values, and it is useful when a\
    \ large number of values needs to be added. The letter $i$ underneath is the index\
    \ of summation. It starts at $i=1$, the first value we are adding is $y_1=3$.\
    \ Afterwards $i=2$, so we add $y_2=-1$ to our previous result, and so on, as shown\
    \ in the equation above. The summation symbol can be very useful when adding numbers\
    \ or making more complicated operations, such as defining the standard deviation.\n\
    \nTo construct the standard deviation of a list of values, we\n\n+   - first find\
    \ the deviations of each value from their average,\n- then square those deviations,\n\
    - then find the average of the squared deviations, and\n- take the square root\
    \ of this average to finish.\n\nIn our example, the standard deviation is given\
    \ by\n\n```\n$SD = \\sqrt{\\frac{\\sum_{i=1}^{4}(y_i-\\bar{y})^2}{4}} = \\sqrt{\\\
    frac{(3-2)^2+(-1-2)^2+(5-2)^2+(9-2)^2}{4}} = \\sqrt{\\frac{1+9+9+49}{4}} = \\\
    sqrt{17}=4.12$\n```\n\nWe present another example, this using R. We use again\
    \ our bowl activity with red and white balls in the bowl. We create a Boolean\
    \ variable `is_red` that corresponds to TRUEs for red balls or FALSEs for white\
    \ balls using these numbers, we compute the proportion (average of 1s and 0s)\
    \ using the `mean()` function and the standard deviation using the `sd()` function\
    \ inside `summarize())\n\n```\nbowl |>\nmutate(is_red = color == \"red\") |>\n\
    summarize(p = mean(is_red), st_dev = sd(is_red))\n```\n\n```\n# A tibble: 1 x\
    \ 2\n p st_dev\ndbl <dbl>\n1 0.375 0.484\n```\n\nThe `sd()` function actually\
    \ calculates the sample standard deviation, which divides the sum of squared deviations\
    \ by $n-1$ instead of $n$. The difference is noticeable for small numbers of values\
    \ but almost irrelevant, for practical purposes, when using a large number of\
    \ values. It is used for simplicity."
  merge: -1
  img_proc: true
- pgno: 245
  md: "# 7.3 The Central Limit Theorem\n\nSo, the proportion of red balls is 0.375\
    \ with a standard deviation of 0.484. The intuition behind the standard deviation\
    \ can be expressed as follows: if you were to select many balls, with replacement,\
    \ from the bowl, we would expect the proportion of red balls to be about 0.375\
    \ or give over 0.484.\n\nIn addition, when dealing with proportions, the formula\
    \ for the standard deviation can be expressed directly in terms of the population\
    \ proportion, $p$, using the formula:\n\n```\n$SD = \\sqrt{p(1 - p)}$\n```\n\n\
    Here is the value of the standard deviation using this alternative formula in\
    \ R:\n\n```\np <- 0.375\nsqrt(p * (1 - p))\n\n[1] 0.484\n```\n\nThe value is the\
    \ same as using the general formula. Now that we have gained a better understanding\
    \ of the standard deviation, we can discuss the standard deviation in the context\
    \ of sampling variation for the sample proportion.\n\n# The standard error\n\n\
    Recall that we want to measure the magnitude of the sampling variation for the\
    \ distribution of $X$ (the sampling distribution of the sample proportion) and\
    \ want to use standard deviation for this purpose. We have shown earlier that\
    \ the center of the distribution of $\bar{X}$ is the expected value of $\bar{X}$.\
    \ In our case, this is the population proportion $p = 0.375$. The standard deviation\
    \ will indicate how far, on average, each possible sample proportion roughly is\
    \ from the population proportion. If we were to consider using a sample proportion\
    \ as an estimate of the population proportion, this deviation could be considered\
    \ the error in estimation. Because of this particular relationship, the standard\
    \ deviation receives a special name: the **standard error**. Note that all *standard\
    \ errors* are standard deviations but not all standard deviations are errors.\n\
    \nWe work again with simulations and the bowl of red and white balls. We take\
    \ 10,000 random samples of size $n=100$, find the sample proportion for each sample,\
    \ and calculate the average and standard deviation for these proportions. This\
    \ simulation produces a histogram similar to the one presented on the right in\
    \ Figure 7.13. To produce this data we use the `rep_slice_sample()` function and\
    \ `mean()` and `sd()` function inside summarize() to produce the desired results:\n\
    \n```\nbowl |>\nrep_slice_sample(n = 100\n```"
  merge: -1
  img_proc: true
