- pgno: 282
  md: "# 8 Estimation, Confidence Intervals, and Bootstrapping\n\nthe distribution.\
    \ The density curve's height can be thought of as how likely those sample means\
    \ are to be observed. For example, it is more likely to get a random sample with\
    \ a sample mean around 3.645 grams (which corresponds to the highest point of\
    \ the curve) than it is to get a sample with a sample mean around 3.5 grams, since\
    \ the curve's height is almost zero at that value. The right dot is the sample\
    \ mean from our sample of 100 almonds, $\\bar{x} = 3.682$ grams. It is located\
    \ 0.37 grams above the population mean weight. How far is 0.037 grams? It is helpful\
    \ to express this distance in standardized values:\n\n$\\frac{3.682 - 3.645}{0.039}\
    \ = 0.945$$\n\nso 0.037 grams is about 0.945 standard errors above the population\
    \ mean.\nIn real-life situations, the population mean, $\\mu$, is unknown so the\
    \ distance from the sample mean to $\\mu$ is unknown. On the other hand, the sampling\
    \ distribution of the sample mean follows a normal distribution. Based on our\
    \ earlier discussion about areas under the normal curve, there is a 95% chance\
    \ that the value observed is within 1.96 standard deviations from the mean. In\
    \ the context of our problem, there is a 95% chance that the sample mean is within\
    \ 1.96 standard errors from the population mean. As shown earlier, the sample\
    \ mean calculated in our example was 0.945 standard errors above the population\
    \ mean, well within the reasonable range.\n\nThink about this result. If we were\
    \ to take a different sample of 100 almonds, the sample mean will likely be different,\
    \ but you still have a 95% chance that the new sample mean will be within 1.96\
    \ standard errors from the population mean.\n\nWe can finally construct an interval\
