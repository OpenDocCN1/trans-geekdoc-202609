- pgno: 24
  md: '# Reproducible research


    > The most important tool is the mindset, when starting, that the end product
    will be reproducible. – Keith Baggerly


    Another goal of this book is to help readers understand the importance of reproducible
    analyses. The hope is to get readers into the habit of making their analyses reproducible
    from the very beginning. This means we''ll be trying to help you build new habits.
    This will take practice and be difficult at times. You''ll see why it is so important
    for you to keep track of your code and document it will well to help yourself
    later and any potential collaborators as well.


    Copying and pasting results from one program into a word processor is not an ideal
    way to conduct efficient and effective scientific research. It''s much more important
    for time to be spent on data collection and data analysis and not on copying and
    pasting blocks back and forth across a variety of programs.


    In traditional analyses, if an error was made with the original data, we''d need
    to step through the entire process again: recreate the plots and copy-and-paste
    all of the new plots and our statistical analysis into our document. This is error
    prone and a frustrating use of time. We want to help you get away from this tedious
    activity so that we can spend more time doing science.


    > We are talking about computational reproducibility. – Yihui Xie


    Reproducibility means a lot of things in different scientific fields. Are experiments
    conducted in a way that another researcher could follow the steps and get similar
    results? In this book, we will focus on what is known as computational reproducibility.
    This refers to being able to pass all of one''s data analysis, datasets, and conclusions
    to someone else and have them get exactly the same results on their machine. This
    allows for time to be spent interpreting results and considering assumptions instead
    of the more error prone way of starting from scratch or following a list of steps
    that may be different machine to machine.


    # Final note for students


    At this point, if you are interested in instructor perspectives on this book,
    ways to contribute and collaborate, or the technical details of this book''s construction
    and'
