  md: '# Preface


    xxvii


    David Robinson¹11, are much more optimistic and found our stuents have been largely
    successful in learning it.


    +   - dplyr has made data wrangling much more accessible¹12 to novices, and hence
    much more interesting datasets can be explored.


    +   Use simulation/resampling to introduce statistical inference, not probability/mathematical
    formulas


    +   - Instead of using formulas, large-sample approximations, and probability,
    we teach statistical concepts using simulation-based inference.


    +   - This allows for a de-emphasis of traditional probability topics, freeing
    up room in the syllabus for other topics. Bridges to these mathematical concepts
    are given as well to help with relation of these traditional topics with much
    more modern approaches.


    +   Don''t fence students off the computation pool. Throw them in!


    +   - Computing skills are essential to working with data in the 21st century.
    Given this fact, we feel that to shield students from computing is to ultimately
    do them a disservice.


    +   - We are not teaching a course on coding/programming per se, but rather just
    enough of the computational and algorithmic thinking necessary for data analysis.


    +   Complete reproducibility and customizability


    +   - We are frustrated when textbooks give examples, but not the source code
    and the data itself. We give you the source code for all examples as well as the
    whole book! While we have made choices to occasionally hide the code that produces
    more complicated figures, reviewing the book''s GitHub repository will provide
    you with all the code (see below).


    +   - Ultimately the best textbook is the one you''ve written yourself. You know
    your audience, their background, and their priorities. You know your own style
    and the types of examples and problems you like best. Customization is the ultimate
    end. We encourage you to take what we''ve provided and make it work for your own
    needs. For more about how to make this book your own, see “About this book” later
    in this Preface.


    > ¹http://varianceexplained.org/r/teach_ggplot2_to_beginners/


    > ¹²http://chance.amstat.org/2015/04/setting-the-stage/'
