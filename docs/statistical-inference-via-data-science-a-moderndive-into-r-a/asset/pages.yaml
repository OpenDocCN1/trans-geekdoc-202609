  md: '# Statistical Inference via Data Science


    Statistical Inference via Data Science: A Modern Dive into R and the Tidyverse,
    Second Edition offers a comprehensive guide to learning statistical inference
    with data science tools widely used in industry, academia, and government. The
    first part of this book introduces the tidyverse of R packages, including ggplot2
    for data visualization and dplyr for data wrangling. The second part introduces
    data modeling via simple and multiple linear regression. The third part presents
    statistical inference using simulation-based methods within a general framework
    implemented in R via the infer package, a suitable complement to the tidyverse.
    By working with these methods, readers can implement effective exploratory data
    analyses, conduct statistical modeling with data, and carry out statistical inference
    via confidence intervals and hypothesis testing. All of these tasks are performed
    by strongly emphasizing data visualization.


    Key Features in the Second Edition:


    +   * Minimal Prerequisites: No prior calculus or coding expertise is needed,
    making it accessible to a wide audience.

    * Real-World Data: Learn with real-world datasets, including all domestic flights
    leaving New York City in 2023, the Gasminder project, FiveThirtyEight.com, and
    new datasets on health, global development, music, coffee quality, and geyser
    eruptions.

    * Simulation-Based Inference: Statistical inference through simulation-based methods.

    * Expanded Theoretical Discussions: Includes deeper coverage of theory-based approaches,
    their connection to simulation-based approaches, and a presentation of intuitive
    and formal aspects of these methods.

    * Enhanced Use of the infer Package: Leverages the infer package for “tidy” and
    transparent statistical inference, enabling readers to construct confidence intervals
    and conduct hypothesis tests through multiple linear regression and beyond.

    * Dynamic Online Resources: All code and output are embedded in the text, with
    interactive exercises, discussions, and solutions available online.

    * Broadened Applications: Suitable for undergraduate and graduate courses, including
    statistics, data science, and courses reproducible research.


    The first edition of the book has been used in so many different way—for courses
    in statistical inference, statistical programming, business analytics, and data
    science for social policy, and for professionals in many other means. Ideal for
    those new to statistics or looking to deepen their knowledge, this edition provides
    a clear entry point into data science and modern methods.'
