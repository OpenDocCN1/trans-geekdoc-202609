    to any statistic function in R is set to FALSE by default. In other words, R does
    not ignore rows with missing values by default. It is alerting you to the presence
    of missing data and you should be mindful of this missingness and any potential
    causes of this missingness throughout your analysis.


    What are other summary functions we can use inside the summarize() verb to compute
