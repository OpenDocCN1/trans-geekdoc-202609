  md: '# 3.7 join data frames


    Another common data transformation task is "joining" or "merging" two different
    datasets. For example, in the flights data frame, the variable carrier lists the
    code for the different flights. While the corresponding airline names for "UA"
    and "AA" might be somewhat easy to guess (United and American Airlines), what
    airlines codes "VW", "HA", and "B6"? This information is provided in a separate
    data frame airlines.


    ```

    View(airlines)

    ```


    We see that in airlines, carrier is the code, while name is the full name of the
    airline company. Using this table, we can see that "G4", "HA", and "B6" correspond
    to Allegiant Air, Hawaiian Airlines, and JetBlue, respectively. However, it wouldn''t
    be nice to have all this information in a single data frame instead of two data
    frames? We can do this by "joining" the flights and airlines data frames.


    The values in the variable carrier in the flights data frame match the values
    in the variable carrier in the airlines data frame. In this case, we can use the
    carrier as a key to match the rows of the two data frames. Key variables are almost
    always identification variables that uniquely identify the observational units
    as we saw in Subsection 1.4.4. This ensures that rows in both data frames are
    appropriately matched during the join. Hadley and Garrett (Grolemund and Wickham,
    2017) created the diagram in Figure 3.7 to show how the different data frames
    in the nyflights23 package are linked by various key variables:


    ![](img/445742518041017e8f01f11b0c3190d9_116_0.png)


    FIGURE 3.7: Data relationships in nyflights from R for Data Science.'
  merge: -1
  img_proc: true
- pgno: 117
  md: '# 3.7 join data frames


    # 3.7.1 Matching key variable names


    In the flights and airlines data frames, the key variable we want to join/merge/match
    the rows by the same name: carrier. Let''s use the inner_join() function to join
    the two data frames, where the rows will be matched by the variable carrier, and
    then compare the resulting data frames:


    ```

    flights_joined <- flights |>

    inner_join(airlines, by = "carrier")nView(flights)

    View(flights_joined)

    ```


    Observe that the flights and flights_joined data frames are identical except that
    flights_joined has an additional variable name. The values of name correspond
    to the airline companies'' names as indicated in the airlines data frame.


    A visual representation of the inner_join() is shown in Figure 3.8 (Grolemund
    and Wickham, 2017). There are other types of joins available (such as left_join(),
    right_join(), outer_join(), and anti_join())), but the inner_join() will solve
    nearly all of the problems you will encounter in this book.


    ![](img/445742518041017e8f01f11b0c3190d9_117_0.png)


    FIGURE 3.8: Diagram of inner join from R for Data Science.


    # 3.7.2 Different key variable names


    Say instead you are interested in the destinations of all domestic flights departing
    NYC in 2023, and you ask questions like: "What cities are these airports in?",
    or "Is "ORD?, Orlando?," or "Where is "FLL?"


    The airports data frame contains the airport codes for each airport:


    ```

    View(airports)

    ```'
