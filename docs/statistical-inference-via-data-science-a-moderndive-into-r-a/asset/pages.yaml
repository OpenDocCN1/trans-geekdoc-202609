    # 9.6.2 Sampling scenario


    Let''s revisit this study in terms of terminology and notation related to sampling
    we studied in Subsection 7.2.1. The study population is all movies in the IMDb
    database that are either action or romance (but not both). The sample from this
    population is the 68 movies included in the movies_sample dataset.


    Since this sample was randomly taken from the population movies, it is representative
    of all romance and action movies on IMDb. Thus, any analysis and results based
    on movies_sample can generalize to the entire population. What are the relevant
    parameter and point estimates? We introduce the fourth sampling scenario in Table
    9.6.'
