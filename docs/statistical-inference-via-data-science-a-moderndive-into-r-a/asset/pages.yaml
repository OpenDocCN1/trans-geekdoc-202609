  md: '# 8.1 Tying the sampling distribution to estimation 253


    The confidence interval computed here, using the sample standard deviation and
    a $t$ distribution, is almost the same as the one attained using the population
    standard deviation and the normal distribution, the difference is about 0.005
    units for the upper and lower bound. This happens because a sample size of 100,
    the $t$-curve and $z$-curve are almost identical and also because the sample standard
    deviation was very similar to the population standard deviation. This does not
    have to be always the case and occasionally we can observe greater differences;
    but, in general, the results are fairly similar.


    More importantly, the confidence interval constructed contains the population
    mean of $\mu = 3.645$, which is the result we needed. Recall that a confidence
    interval is an interval estimate of the parameter of interest, the population
    mean weight of almonds. We can summarize the results so:


    +   * The size used for your random sample is large enough, the sampling distribution
    of the sample mean follows, approximately, the normal distribution.

    * Using the sample mean observed and the standard error of the sampling distribution,
    we can construct 95% confidence intervals for the population mean. The formula
    for these intervals is given by


    $$\bar{x} - 1.96\frac{\sigma}{\sqrt{n}}, \bar{x} + 1.96\frac{\sigma}{\sqrt{n}}$


    where $n$ is the sample size used.


    +   * When the population standard deviation is unknown (which is almost always
    the case), the sample standard deviation is used to estimate this standard error.
    This produces additional variability and the standardized values follow a $t$
    distribution with $n-1$ degrees of freedom. The formula for 95% confidence intervals
    when the sample size is $n=100$ is given by


    $$\bar{x} - 1.98\frac{s}{\sqrt{100}}, \bar{x} + 1.98\frac{s}{\sqrt{100}}$


    +   * The method to construct 95% confidence intervals guarantees that in the
    long-run for 95% of the possible samples, the intervals determined will include
    the population mean. It also guarantees 5% of the possible samples will lead to
    intervals that do not include the population mean.

    * As we have constructed intervals with a 95% level of confidence, we can construct
    intervals with any level of confidence. The only change in the equations will
    be the number of standard errors needed.'
