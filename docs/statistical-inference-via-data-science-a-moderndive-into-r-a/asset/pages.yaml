    # 8.3 Additional remarks about the bootstrap


    This section expands explanations on the bootstrap-methods, provides historical
    context, gives a comparison between the theory-approach and the simulation-based
    approach when working with confidence intervals, and provides reasons for using
    the bootstrap. The presentation is more theoretical than other sections in this
    chapter, and you are welcome to skip to Section 8.4 if you want to go directly
    another application of the bootstrap methods in R. Additional theoretical explanations
    are available in the Appendices of the online version of the book¹.


    # 8.3.1 The bootstrap and other resampling methods


    The bootstrap is one of resampling methods. Chernick and LaBudde noted that the
    bootstrap''s roots trace back to the development of similar techniques like permutations
    and the jackknife (Chernick and LaBudde, 2011). The bootstrap was initially conceived
    as an approximation to another resampling method called the


    > ¹https://moderndive.com/v2/appendixa'
  merge: -1
  img_proc: true
- pgno: 318
  md: '# 8 Estimation, Confidence Intervals, and Bootstrapping


    jackknife but quickly gained recognition for its broader applicability and efficiency.
    Since then, it has been shown in multiple contexts that the bootstrap performs
    at least as well as traditional methods in estimating standard errors, constructing
    confidence intervals, performing hypothesis testing, and many other statistical
    techniques.


    Furthermore, the 1980s (but even more in the last two decades), the use of simulations
    to compare advanced bootstrap methods against other techniques, such as cross-validation,
    further established its superiority in specific contexts, particularly when dealing
    with small sample sizes. The use of the bootstrap and bootstrap-related methods
    has become a cornerstone in modern statistical and science practices.


    In this section, we introduce additional details about the bootstrap, and explain
    the advantages and limitations of using bootstrap.


    # 8.3.2 Confidence intervals and rate of convergence


    We want to compare how the bootstrap performs when building confidence intervals
    with respect to the theory-based approach discussed in Section 8.1. The formal
    comparison requires mathematical concepts beyond the scope of this book, and it
    is not pursued. Instead, we provide just enough elements to help you with the
    intuition of how this comparison is made and why bootstrap-related methods can
    be as strong as or even stronger than theory-based or alternative methods.


    Let''s start with an illustration using the theory-based confidence interval.
    A 95% confidence interval for $\mu$, when a sample size of $n = 100$ is used,
    is given by


    > $$\mu \pm 1.96\frac{\sigma}{\sqrt{n}}$


    when $\sigma$ is unknown or


    > $$\mu \pm 1.98\frac{s}{\sqrt{n}}$


    when $\sigma$ is unknown. We use 95% and $n = 100$ for this illustration, but
    the exposition is also true with any other confidence level or other sample sizes.
    We understand that 95% of all the possible samples would lead to an interval that
    contains $\mu$. This statement is exactly true if the distribution of $\bar{X}$
    is precisely normal, and we say that 95% is the true coverage probability. In
    reality, we do not know what the distribution of the population is, but because
    of the Central Limit Theorem we know that for a large sample size $n$ the distribution
    of $\bar{X}$ is approximately normal. In this case, the 95% is an approximate
    coverage probability. This means that if we were to take every possible sample
    of size $n$ and construct a confidence interval using the formulas above, nearly
    95% of the intervals will include $\mu$. Again, this happens because $X$ is not
    exactly, but approximately, normal. Still, the Central Limit Theorem states that
    when $n$ tends to infinity, the distribution of $X$ tends to normal, so the larger
    the'
  merge: -1
  img_proc: true
- pgno: 319
  md: '# 8.3 Additional remarks about the bootstrap


    sample size $n$ closer the distribution of $\overline{X}$ is to the normal distribution,
    and the smaller difference between the true and the approximate coverage probability.


    Given that we make $n$ infinity in real-life applications, we would like to produce
    95% confidence intervals that make the difference between the approximate coverage
    probability and the true coverage probability as small as possible when we increase
    the sample size of our sample. A sequence of sample sizes $n_1, n_2, n_3,\dots$
    that gets bigger and bigger. The rate at which the corresponding differences in
    confidence intervals'' coverage probability decreases is called the rate of convergence
    of the difference between approximate and true coverage probabilities.


    In the case of a 95% confidence interval for $\mu$ using the theory-based approach,
    the rate of convergence for difference is $1/\sqrt{n}$. This means that if we
    increase $n$ from 100 to 400, the difference between the approximate and true
    coverage goes down from a factor of $1/\sqrt{100}=0.1$ to a factor of $1/\sqrt{400}=0.05$.
    Thus, increasing $n$ four times leads to a decrease of the difference about two
    times. In the statistical literature, a method that has this rate of convergence
    is called a first-order correct (Hall, 1992) or first-order accurate (Chernik
    and LaBoudelle, 2011).


    The bootstrap percentile method described in 8.2.4, in the case of a 95% confidence
    interval for $\mu$, is also first-order accurate. Thus, confidence calculated
    using the theory-based and the bootstrap percentile method are comparable. This
    is consistent with the results obtained earlier in this chapter.


    In general, if you have two methods that produce similar 95% confidence intervals
    and need to choose one of them, we would choose the one that has a faster rate
    of convergence. As we discuss in the next subsection, other bootstrap methods
    have, in certain contexts, faster rates of convergence.


    # 8.3.3 Why bootstrap methods


    Why is it suitable to learn and use bootstrap methods for confidence intervals?
    The most important reason is that bootstrap methods, in particular advanced bootstrap
    methods, can deal with many limitations of the theory-based approach. Let''s discuss
    three of these limitations.


    First, a 95% confidence interval for $\mu$ is appropriate if the population distribution
    is not too extreme and the sample size is large enough for the distribution of
    $\overline{X}$ to be approximately normal. But there are situations where these
    conditions are not satisfied, for example, if the population distribution is highly
    skewed to the right, or in the case of income or wealth; or the distribution is
    constructed from only two values (1 or 0) but the chances of getting zero are
    much greater than the ones of getting one (for example, chance of getting zero
    is 0.999 and chance of getting 1 is 0.001) as it is the case in lottery outcomes
    or the presence of some disease in a population. When these situations are present,
    the confidence intervals would be inaccurate because the sample mean $\overline{X}$
    is biased when $n$ is not too large. This means that if you were to take a large
    number of random samples and construct the sample mean of these'
  merge: -1
  img_proc: true
- pgno: 320
  md: '# 8 Estimation, Confidence Intervals, and Bootstrapping


    samples, their average will be clearly different than $\mu$, breaking down the
    theory developed in Subsection 8.1. This problem may be fixed if the sample size
    is large, but, depending on how extreme the population distribution is, the sample
    size may need to be extremely large; perhaps in the order of thousands, tens of
    thousands, or even more. Getting samples of those sizes may not be doable in real-life
    situations.


    Second, in this chapter, we study confidence intervals for the population mean
    $\mu$ because it is a fundamental quantity and it is the foundation for other
    cases. However, building confidence intervals for the other parameters using the
    theory-based approach (for example, for the median, the first quartile, the standard
    deviation, etc.) becomes more complicated or unfeasible.


    Third, when working with estimators more complicated than X it is often impossible
    to deliver the standard error with a formula as clean as $\sigma/\sqrt{n}$. Sometimes,
    there is no formula for the standard error and alternative methods have to be
    used to estimate it. This can create an additional source of bias. When bias is
    present, the confidence intervals created using the theory-based approach in Subsection
    8.1.3 could be suspect, completely useless.


    The bootstrap percentile method is not affected directly by the second and third
    limitations. It can be implemented for any information needed beyond the population
    mean, as long as all the information can be extracted from each bootstrap sample.
    On the other hand, the first limitation listed above can also affect the accuracy
    of this method.


    Fortunately, since the inception of the bootstrap, many improvements have been
    made to to the percentile method. Bootstrap methods have been proposed to address
    the presence of bias either by the limitations discussed above or the bias created
    when obtaining estimators or incorporating these methods. In addition, in contexts,
    these methods also improve the rate of convergence of the difference between the
    approximate and true coverage probability. Some of these methods are the percentile-t
    and the Bias Correction and Acceleration bootstrap method (BCa). In terms of convergence,
    these methods are second-order accurate; they have a rate of convergence about
    $1/n$. Another method called the double bootstrap (or more generally, the iterated
    bootstrap) can be a third-order accurate.


    We have not included these methods directly here because the theory that justifies
    them goes beyond the scope of this book, and when dealing with confidence intervals
    for $\mu$ from populations that are not extreme, there are not real gains in using
    them over the theory-based approach or the percentile method. (We encourage you
    to check out implementation by setting type = "bias-corrected" in the get_confidence_interval()
    function.)


    To summarize, when working with skewed distributions, small sample sizes, estimators
    of parameters other than $\mu$ (such as the median), or the estimation of the
    standard error when there are no formulas to obtain them, many advanced bootstrap
    methods would be preferred over the theory-based approach. In the Appendices of
    the online'
  merge: -1
  img_proc: true
