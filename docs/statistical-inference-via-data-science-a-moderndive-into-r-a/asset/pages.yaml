  md: "The additional complexity of the interaction model warranted? Looking at the\
    \ left\nhand plot in Figure 11.6, we're of the opinion that it is, as evidenced\
    \ by the slight\nx-like (crossing) pattern to some of the lines. Therefore, we\
    \ will focus on the rest of this\nanalysis only on the interaction model. (This\
    \ visual approach is somewhat subjective,\nhowever feel free to disagree!) What\
    \ are the different slopes and five different\nintercepts for the interaction\
