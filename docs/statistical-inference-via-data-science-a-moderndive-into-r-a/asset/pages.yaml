    $ life_exp <dbl> 53.6, 79.5, 78.0, 83.4, 62.1, 77.8, 78.3, 76.1, 83~

    $ continent <fct> Asia, Europe, Africa, Europe, North America-

    $ gdp_per_capita <dbl> 356, 6810, 4343, 41993, 3000, 19260, 13651, 7018 ~


    Observe that Rows: 188 indicates there are 188 rows/observations in gapminder2022,
    where each row corresponds to one country. In other words, the *observational
    unit* is an individual country. Furthermore, observe that the variable continent
    is of type `<fct>`, which stands for *factor*, that is R''s way of encoding categorical
