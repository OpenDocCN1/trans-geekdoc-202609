  md: '# 5 Simple Linear Regression


    The four plots refer to:


    +   1. The country of Bosnia and Herzegovina had a life expectancy $x = 77.98$
    and fertility rate $y = 1.3$. The residual in this case is $1.3 - 1.894 = -0.594$,
    which we mark with an arrow in the top-left plot.

    2. The addition of Chad, which had a life expectancy $x = 59.15$ and fertility
    rate $y = 6$. The residual in this case is $6 - 4.479 = 1.521$, which we mark
    with a new arrow in the top-right plot.

    3. The addition of India, which had a life expectancy $x = 67.22$ and fertility
    rate $y = 2$. The residual in this case is $2 - 3.371 = -1.371$, which we mark
    with a new arrow in the bottom-left plot.

    4. The addition of the Solomon Islands, which had a life expectancy $x = 76.7$
    and fertility rate $y = 3.8$. The residual in this case is $3.8 - 2.069 = 1.731$,
    which we mark with a new arrow in the bottom-right plot.


    Now we repeated this process of computing residuals for all 181 countries with
    complete information, then we squared all of squared residuals, and then summed
    them. We call this the *sum of squared residuals*; it is a measure of the *lack
    of fit* of a model. Larger values of the sum of squared residuals indicate a bigger
    lack of fit. This corresponds to a worse-fitting model.


    If the regression line fits all points perfectly, then the sum of squared residuals
    is 0. This is because if the regression line fits all points perfectly, then the
    fitted $\hat{y}$ equals the observed value $y$ in all cases, and the residual
    $y - \hat{y} = 0$ in all cases, and the sum of a large number of 0''s is still
    0.


    Furthermore, of all possible lines we can draw through the cloud of 181 points,
    the regression line minimizes this value. In other words, the regression and its
    corresponding fitted values $\hat{y}$ minimizes the sum of squared residuals:


    > $$\sum_{i=1}^{n}(y_i - \hat{y}_i)^2$


    We use our data-wrangling tools to compute the sum of squared residuals exactly:


    ```

    # Fit regression model and regression points

    demographics_points <- lm(fert_rate ~ life_exp, data = UN_data_ch5)

    regression_points <- get_regression_points(demographics_model)

    ```


    ```

    # Compute sum of squared residuals

    regression_points |>

    mmutate(squared_residuals = residual^2) |>

    summarize(sum_of_squared_residuals = sum(squared_residuals))

    ```


    [1] 81.3'
