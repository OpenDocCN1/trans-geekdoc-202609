  md: '# 254 8 Estimation, Confidence Intervals, and Bootstrapping


    # 8.1.5 Interpreting confidence intervals


    We have used the sample almonds_sample_100, constructed a 95% confidence interval
    for the population mean weight of almonds, and showed that the interval contained
    this population. This result is not as surprising as we expect intervals such
    as to include the population mean for 95% of the possible random samples. We repeat
    this interval construction for many random samples. Figure 8.8 presents the results
    for one hundred 95% confidence intervals.


    ![](img/445742518041017e8f01f11b0c3190d9_288_0.png)


    **FIGURE 8.8:** One hundred 95% confidence intervals and whether the population
    mean is captured in each.


    Note that each interval was built using a different random sample. The vertical
    line is drawn at the location of the population mean weight, $\mu = 3.645$. The
    horizontal lines represent the one hundred 95% confidence intervals found. The
    gray confidence intervals cross the vertical line so they contain the population
    mean. The black confidence intervals do not.


    This result motivates the meaning of a 95% confidence interval: if you could construct
    intervals using the procedure described earlier for every possible random sample,
    95% of these intervals will include the population mean and 5% of them will not.


    Of course, in most situations, it would be impractical or impossible to take every
    possible random sample. Still, for a large number of random samples, this result
    is approximately correct. Figure 8.8, for example, 5 out of 100 confidence intervals'
