  md: '# 9.1 Tying confidence intervals to hypothesis testing


    ![](img/445742518041017e8f01f11b0c3190d9_337_0.png)


    FIGURE 9.1: The tails of a t curve for this hypothesis test.


    The function pt() finds the area under a t curve to the left of a given value.
    The probability requires the argument q (quantile) that in our example is the
    value of t on the left part of the plot (-2.26) and the argument df, the degrees
    of freedom that for a one-sample test are n - 1. The sample size of almonds_sample_100
    was n = 100. Finally, since we need the area on both tails and the t distribution
    is symmetric, we simply multiply the results by 2:


    ```

    2 * pt(q = -2.26, df = 100 - 1)

    ```


    We have determined that, assuming that the null hypothesis is true, the probability
    of getting a sample as extreme as or more extreme than almonds_sample_100 is 0.026.
    This probability is called the p-value.


    What does this mean? Most statistics textbooks will state, given a significance
    level, often set as α = 0.05, if the p-value is less than α, we reject the null
    hypothesis. While technically not incorrect, this type of statement does not provide
    enough insight for students to fully understand the conclusion.


    Let’s unpack some of these elements and provide additional context to them:


    The key element of the conclusion is to determine whether the null hypothesis
    is true, if assuming that the null hypothesis is true, it is very unlikely (almost
    impossible) to observe a random sample such as the one we have observed, we need
    to reject the null hypothesis, but we would not reject the hypothesis in any other
    situation. In that sense, the null hypothesis has a privileged status. The reason
    for this is that we do not want to make a mistake and reject the null hypothesis
    when the claim under it is actually true. In statistics, making this mistake is
    called a Type I Error. So, we only reject the null hypothesis if the chances of
    committing a Type I Error are truly small. The significance level, denoted by
    the Greek letter α (pronounced “alpha”), is precisely the probability of committing
    a Type I Error.'
  merge: -1
  img_proc: true
- pgno: 338
  md: '# 9 Hypothesis Testing


    What are the chances you are willing to take? Again, $\alpha=0.05$ is what most
    textbooks use and many research communities have adopted for decades. While we
    should be to work with this number, after all we may need to interact with people
    that are used to it, we may not treat it as one of many possible numbers.


    The significance level, $\alpha$, is a predefined level of accepted uncertainty.
    This value should be well defined before the $p$-value has been calculated, or
    even before data has been collected. Ideally, it should represent our tolerance
    for uncertainty. But, how can we determine what this value should be?


    We provide an example. Assume that you are a student and have to take a test in
    your statistics class worth 100 points. You have studied for it, and you expect
    to get a passing grade (score in the 80s) but not better than that. The day of
    the exam the instructor gives you one additional option. You can take the exam
    and receive a grade based on your performance or you can play the game: the instructor
    rolls a six-sided die. If the top shows "one" you zero on your test, otherwise
    you score 100. There is a 1 6 chance that you get zero. Would you play this game?


    If you would not play the game, let''s change it. Now the instructor rolls the
    die twice, you score 0 in the test if both rolls are "one". Otherwise, you score
    100. There is only 1 in 36 chance to get zero. Would you play this game?


    What if the instructor rolls the five times and give you zero in the test if each
    roll is a "one," and you score 100 otherwise. The is only a 1 in 7776 chance to
    get zero. Would you play this game?


    Converted to probabilities, the three games shown above give you the probabilities
    of getting a zero equal to 1/6=0.167, 1/36=0.028, 1/7776=0.0001, respectively.
    Think of these as $p$-values and getting a zero in the test as committing a Type
    I Error.


    In the context of a hypothesis test, when the random sample collected is extreme,
    the $p$-value is really small, and we reject the null hypothesis, there is a chance
    that the null hypothesis was true, the random sample collected was always atypical,
    and results led us to commit a Type I Error. There is always uncertainty when
    using random samples to make inferences about populations. All we do decide what
    is our level of tolerance for this uncertainty. Is $1/6=0.167, 1/36=0.028, 1/7776=0.0001$,
    or some other level? This is precisely the significance level $\alpha$.


    Returning to the almond example, if we set $\alpha=0.04$ and we observed the $p$-value=0.026,
    we would reject the null hypothesis and conclude that the population mean $\mu$
    is not equal to 3.6 grams. When the null hypothesis is rejected we say that the
    result of the test is **statistically significant.**


    Let''s summarize the steps for hypothesis testing:


    +   1. Based on the claim we are planning to state, state the null and alternative
    hypothesis in terms of $\mu$.'
  merge: -1
  img_proc: true
