- pgno: 436
  md: "# 10.5.1 Model dependency estimators\n\nMany inference methods and results\
    \ for multiple linear regression are a direct extension of the methods and results\
    \ discussed in simple linear regression. The most important difference is the\
    \ fact that the least-square estimators represent partial slopes and their values\
    \ are dependent on the other regressors in the model. If we change the set of\
    \ regressors used in a model, the least-squares estimates and its standard errors\
    \ will likely change as well. And these changes will lead to different confidence\
    \ interval limits, different test statistics for hypothesis tests, and potentially\
    \ different conclusions about these regressors.\n\nUsing the coffee_data example,\
    \ suppose that we consider the model:\n\n$y_i = \beta_0 + \beta_1 \\cdot x_{i1}\
    \ + \beta_2 \\cdot x_{i2} + \beta_3 \\cdot x_{i3} + \\epsilon_i$$\n\n$\beta_1,\
    \ \beta_2$, and $\beta_3$, are the parameters for the partial slopes of aroma,\
    \ flavor, and moisture_percentage, respectively. Recall that we assume that the\
    \ parameters $\beta_1, \beta_2$, and $\beta_3$ are constants, unknown to us, but\
    \ constants. We use multiple linear regression and find the least-square estimates\
    \ $b_1, b_2$, and $b_3$, respectively. The results using the coffee_data are calculated\
    \ and stored in the object mod_mult_1 and shown below:\n\n```\n# Fit regression\
    \ model:\nmod_mult_1 <- lm(\ntotal_cup_points ~ aroma + flavor + moisture_percentage,\n\
    data = coffee_data)\n```\n\n```\n# Get the coefficients of the model\ncoef(mod_mult_1)\n\
    sigma(mod_mult_1)\n```\n\n# TABLE 10.10: Coffee example linear regression coefficients\n\
    \n| | Coefficients | |\n|---|---||\n| (Intercept) | b0 | 36.778 |\n| aroma | b1\
    \ | 1.800 |\n| flavor | b2 | 4.285 |\n| moisture_percentage | b3 | -0.015 |\n\
    | | s | 0.521 |\n\nNow, assume that we decide to construct a model without the\
    \ regressor flavor, so our model is\n\n$y_i = \beta_0 + \beta_1 \\cdot x_{i1}\
    \ + \beta_3 \\cdot x_{i3} + \\epsilon_i$$"
  merge: -1
  img_proc: true
- pgno: 437
  md: "# 10.5 Theory-based inference for multiple linear regression\n\nUsing multiple\
    \ regression we compute the least-square estimates $b'_1$ and $b'_3$, respectively,\
    \ with the'$ denoting potentially different coefficient values in this different\
    \ model. The results using the $coffee\\_data$ are calculated and stored in the\
    \ $mod\\_mult\\_2$ and shown below:\n\n```\n# Fit regression model:\nmod_mult_2\
    \ <- lm(\n  total_cup_points ~ aroma + moisture_percentage, data = coffee_data)\n\
    ```\n\n```\n# Get the coefficients of the model\ncoef(mod_mult_2)\nsigma(mod_mult_2)\n\
    ```\n\n# **TABLE 10.11:** Coffee example linear regression coefficients\n\n| (Intercept)\
    \ | | | |\n|---|---|---|\n| | b'0 | 44.010 |\n| aroma | b'1 | 5.227 |\n| moisture_percentage\
    \ | b'3 | -0.062 |\n| | s' | 0.857 |\n\nWe focus on the partial slope for aroma\
    \ using both models. Observe that in $mod\\_mult\\_1$, the partial slope for aroma\
    \ is $b_1 = 1.8$. In model $mod\\_mult\\_2$, the slope for aroma is $b'_1 = 5.23$.\
    \ The results are truly different because the models used in each case are different.\
    \ Similarly, every other coefficient found is different, and it is possible the\
    \ inferential results for confidence intervals or hypothesis tests are different\
    \ too!\n\nAny results, conclusions, and interpretations of a regressor are only\
    \ valid for the model used. For example, interpretations or conclusions about\
    \ aroma and its effects or influence in $total\\_cup\\_points$ are entirely dependent\
    \ on whether we have used $mod\\_mult\\_1, mod\\_mult\\_2$, or another model.\
    \ Never assume that a conclusion from one model can translate to a different model.\n\
    \nIn addition, it is important to determine which model is the most adequate.\
    \ Clearly, not both $mod\\_mult\\_1$ and $mod\\_mult\\_2$ are correct, and we\
    \ would like to use the one that is most appropriate. What if neither $mod\\_mult\\\
    _1$ nor $mod\\_mult\\_2$ are adequate, and we should use another model instead?\
    \ There are two areas in inferential statistics that address these questions.\
    \ The first area involves comparisons between regressors from the other, as in\
    \ the coffee example where $mod\\_mult\\_1$ used the regressors aroma and moisture\\\
    _percentage while $mod\\_mult\\_2$ used only two of these regressors: aroma and\
    \ moisture\\_percentage. We discuss methods addressing this comparison in Subsection\
    \ 10.5.3. The second area is called model selection or variable selection and\
    \ uses alternative methods to determine which model, out of the possible available\
    \ is the most adequate."
  merge: -1
  img_proc: true
- pgno: 438
  md: "# 10.5.2 Confidence intervals\n\nA 95% confidence interval for any coefficient\
    \ in multiple linear regression is constructed exactly the same way as we did\
    \ for simple linear regression, but we should always interpret them as dependent\
    \ on the model for which they were attained.\n\nFor example, the formula for a\
    \ 95% confidence interval for $\beta_1$ is given by $b_1 \\pm q \\cdot SE(b_1)$\
    \ where the critical value $q$ is determined by the level of confidence required,\
    \ the sample size used $(n)$, and the corresponding degrees of freedom needed\
    \ for the $t$-distribution $(n-p)$. In the coffee example, the $model\\_mod\\\
    _mult$ contains\n\n+   - three numerical regressors (aroma, flavor, and moisture_content),\n\
    - one factor (continent_of_origin),\n- the confidence level is 95%,\n- the sample\
    \ size is $n=207,\n- the number of regression coefficients is $p=7$:\n- three\
    \ partial slopes for aroma, flavor and moisture_content ($b_1, b_2,$ and $b_3$),\n\
    - three coefficients for the factor levels in the model ($b_{02}, b_{03},$ and\
    \ $b_{04}$).\n\nSo the degrees of freedom are $n-p=207-7=200$.\n\nThe 95% confidence\
    \ interval for the partial slope of $b_1$ aroma is determined\n\n> $b_1 \\pm q\
    \ \\cdot SE(b_1)\n= 1.73 \\pm 1.97 - 0.22\n= (1.29, 2.17)$\n\nThe interpretation\
    \ of this interval is the customary: “We are 95% confident that the population\
    \ partial slope for aroma $(\beta_1)$ in the model $mod\\_mult$ is a number between\
    \ 1.29 and 2.17.\"\n\nWe find these values using $regression\\_table(mod\\_mult,\
    \ table)$. This time, however, we use the argument $conf.level=0.98$ to get 98%\
    \ confidence intervals.\n\n```\nget_regression_table(mod_mult, conf.level = 0.98)\n\
    ```\n\n# TABLE 10.12: The regression table for mod_mult with 98% level\n\n| term\
    \ | estimate | std_error | statistic | p_value | lower_ci | upper_ci |\n|---|---|---|---|---|---|--|\n\
    | intercept | 37.321 | 1.116 | 33.445 | 0.000 | 34.705 | 39.938 |\n| aroma | 1.732\
    \ | 0.222 | 7.800 | 0.000 | 1.211 | 2.252 |\n| flavor | 4.316 | 0.226 | 19.090\
    \ | 0.000 | 3.786 | 4.846 |\n| moisture_percentage | -0.008 | 0.030 | -0.277 |\
    \ 0.781 | -0.078 | 0.062 |\n| continent_of_origin: Asia | -0.393 | 0.121 | -3.244\
