    \ to match the “There is only one test” framework. So if you can generalize these\
    \ ideas for all hypothesis-testing scenarios. Whether for population proportions\
    \ $p$, population means $\\mu$, differences in population proportions $p_1-p_2$,\
    \ differences in population means $\\mu_1-\\mu_2$, and as you will see in Chapter\
    \ 10 on inference for regression, population regression slopes $\beta_1$ as well.\
    \ In fact, it applies more generally than just these examples to more complicated\
