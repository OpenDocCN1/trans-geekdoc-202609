    chain of data wrangling operations by combining verb-named functions into a single
    sequence using the pipe operator |. Furthermore, much like the + sign has to come
    at the end of lines when constructing plots, the pipe operator | has to come at
    the end of lines as well.


    Keep in mind, there are many more advanced data-wrangling functions than just
