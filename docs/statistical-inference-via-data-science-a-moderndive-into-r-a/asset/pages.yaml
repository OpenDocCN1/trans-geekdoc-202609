  md: '# 9 Hypothesis Testing


    you performed in Section 9.2 several times on the full dataset of 2000 rows.

    Let''s use the computer to repeat this 1000 times by setting reps = 1000 in the
    gener-ate() function. However, unlike confidence intervals which we generated
    replicates using type = "bootstrap" resampling with replacement, we will now perform
    shuffles/- permutations by setting type = "permute". Recall that shuffles/permutations
    are a kind of resampling, but unlike the bootstrap method, involve resampling
    with-out replacement.


    ```

    spotify_generate <- spotify_material_deephouse |

    specify(formula = popular_or_not ~ track_genre, success = "popular") |

    hypothesize(null = "independence") |

    generate(reps = 1000, type = "permute") |

    row(spotify_generate)

    ```


    +   [1] 2000000


    The resulting data frame has 2,000 rows. This is because we performed shuffles/-permutations
    for each of the 2000 rows 1000 times and 2,000,000 = 1000 * 2000.

    If you explore the spotify_generate data frame with view(), you will notice that
    the variable replicate indicates which each row belongs to. So it has the value
    1 2000 times, the value 2 2000 times, all the way through to the value 1000 2000
    times.


    # 4. calculate summary statistics


    Now that we have generated 1000 replicates of "shuffles" assuming the null hypothesis
    is true, let''s calculate() the appropriate summary statistic for each of our
    1000 shuffles.

    From Section 9.3, point estimates related to hypothesis testing have a specific
    name: test statistics. Since the unknown population parameter of interest is the
    difference in population proportions $p_m - p_d$, the test statistic here is the
    difference in sample proportions $\hat{p}_m - \hat{p}_f$.


    For each of our 1000 shuffles, we can calculate this statistic by setting stat
    = "diff in props". Furthermore, we are interested in $\hat{p}_m - \hat{p}_d$ we
    set order = c("metal", "deep-house").\ As we stated earlier, the order of the
    subtraction does not matter, as long as you stay consistent throughout your analysis
    and tailor your interpretations accordingly. Let''s see the result in a data frame
    named null_distribution:


    ```

    null_distribution <- spotify_material_deephouse |

    specify(formula = popular_or_not ~ track_genre, success = "popular") |

    hypothesize(null = "independence") |

    generate(reps = 1000, type = "permute") |

    calculate(stat = "diff in props", order = c("metal", "deep-house\))

    null_distribution

    ```'
