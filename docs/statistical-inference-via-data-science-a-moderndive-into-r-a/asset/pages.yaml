- pgno: 413
  md: '# 10.2 Theory-based inference for simple linear regression


    ![](img/445742518041017e8f01f11b0c3190d9_413_0.png)


    **FIGURE 10.8:** Scatterplot of date (time) vs residuals for the Old Faithful.


    The plot of residuals against time (date) seems to be a null plot. Based on this
    plot we could say that the residuals do not exhibit any evidence of dependency.


    Now, the observations in this dataset are a subset of all the Old Faithful eruptions
    that happen during this time frame and all of them are erptions that do not happened
    sequentially, one after the next. Each observation in this dataset represents
    a unique eruption of Old Faithful, with waiting times and duration recorded for
    each event. Since these eruptions occur independently of one another, the residuals
    derived from the regression of waiting versus duration are also expected to be
    independent. As discussed in Subsection 10.1.3, we can consider this a random
    sample.


    In this case, the assumption of independence seems acceptable. Note that the old_faithful_2024
    data do not involve repeated measurements or grouped observations that could lead
    to dependency issues. Therefore, we can proceed with trusting the regression analysis
    as we believe that the error terms are not systematically related to one another.
    While determining lack of independence may not be easy in certain settings, in
    particular if no time sequence or other sequence measurements are involved, taking
    a random sample is the golden standard.


    Normality of the error terms


    The third assumption we want to check is whether the error terms follow Normal
    distributions with expected value equal to zero. Using the residuals as a rough
    estimate of the error term values, we have seen in the right plot of Figure 10.6
    that sometimes the residuals are positive and other time negative. We want to
    see if, *on average*, the errors equal zero and the shape of their distribution
    approximate a bell shaped curve.'
