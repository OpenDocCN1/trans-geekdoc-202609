- pgno: 75
  md: '# 2.5 NG#3: Histograms


    +   1. By adjusting the number of bins via the bins argument to geom_histogram().

    2. By adjusting the width of the bins via the binwidth argument to geom_histogram().


    Using the first method, we have the power to specify how many bins we would like
    to cut the x-axis up. As mentioned in the previous section, the default number
    of bins is 20. We can override this default, to say 20 bins, as follows:


    ```

    ggplot(data = weather, mapping = aes(x = wind_speed)) +

    geom_histogram(bins = 20, color = "white")

    ```


    Using the second method, instead of specifying the number of bins, we specify
    the width of the bins by using the binwidth argument in the geom_histogram() layer.
    For example, let''s set the width of each bin to be five mph.


    ```

    ggplot(data = weather, mapping = aes(x = wind_speed)) +

    geom_histogram(binwidth = 5, color = "white")

    ```


    We compare both resulting histograms side-by-side in Figure 2.12.


    ![](img/445742518041017e8f01f11b0c3190d9_75_0.png)


