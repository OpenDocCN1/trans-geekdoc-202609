  md: '368


    10 Inference for Regression


    We can also standardize the least-squares estimators such that


    ```

    $z_0 = \left(\sigma\sqrt{\frac{1}{n} + \frac{x^2}{\sum_{i=1}^n(x_i-\bar{x})^2}}\right)
    \quad \text{and} \quad z_1 = \left(\frac{b_1-\beta_1}{\sigma\sqrt{\sum_{i=1}^n(x_i-\bar{x})^2}}\right)$

    ```


    are the corresponding standard normal distributions.


    # 10.2.2 Standard errors for least-squares estimators


    Recall that in Chapter 7 and in Subsection 7.4.6 we discussed that, due to the
    Central Limit Theorem, the distribution of the sample mean $\bar{X}$ was approximately
    normal with mean equal to the parameter $\mu$ and standard deviation equal to
    $\sigma/\sqrt{n}$. We then used the estimated standard error of $\bar{X}$ to construct
    confidence intervals and hypothesis tests.


    An analogous treatment is used to construct confidence intervals and hypothesis
    tests for $b_0$ and $b_1$. Observe in the equations above that the standard deviations
    of $b_0$ and $b_1$ are constructed using the sample size $n$, the values of the
    explanatory variables, their means, and the standard deviation of $y_i(\sigma)$.
    While most of these values are known to us, $\sigma$ is typically not.


    Instead, we estimate $\sigma$ using the standard deviation, $s$, introduced in
    Subsection 10.1.4. The estimated standard deviation of $b_1$ is called the *standard
    error* of $b_1$, and it is given by:


    ```

    $SE(b_1) = \frac{s}{\sqrt{\sum_{i=1}^n(x_i-\bar{x})^2}}$

    ```


    Recall that the *standard error* is the standard deviation of any point estimated
    from a sample. The *standard error* of $b_1$ quantifies how much variation the
    estimator of the slope $b_1$ may have from different random samples. The larger
    the standard error, the more variation we would expect in the estimated slope
    $b_1$. Similarly, the *standard error* of $b_0$ is:


    ```

