  md: '# Definition of tidy data


    # 4.2.1 Definition of tidy data


    You have surely heard the word “tidy” in your life:


    +   - “Tidy your up room!”

    - “Write your homework in a tidy way, so it is easier to provide feedback.”

    - Marie Kondo’s best-selling book, *The Life-Changing Magic of Tidying Up: The
    Japanese Art of Decluttering and Organizing*, and Netflix TV series Tidying Up
    with Marie Kondo⁸


    What does it mean for your data to be “tidy”? While “tidy” has a clear English
    meaning of “organized,” the word “tidy” in science using R means that your data
    follows a standardized format. We follow Hadley Wickham’s definition of “tidy”
    data (Wickham, 2014) also shown in Figure 4:3:


    A dataset is a collection of values, usually numbers (if quantitative) or strings
    text data (if qualitative/categorical). Values are organised in two ways. Every
    value belongs to a variable and an observation. A variable contains all values
    that measure the same underlying attribute (like height, temperature, duration)
    across units. An observation contains all values measured on the same unit (like
    a person, a day, or a city) across attributes.

    “Tidy” data is a standard way of mapping the meaning of a dataset to its structure.
    A dataset is messy or tidy depending on how rows, columns and tables are matched
    up with observations, variables and types. In tidy data:


    +   1. Each variable forms a column.

    2. Each observation forms a row.

    3. Each type of observational unit forms a table.


    ![](img/445742518041017e8f01f11b0c3190d9_134_0.png)


    FIGURE 4.3: tidy data graphic from R for Data Science.


    > ⁷https://www.powells.com/book/-9781607747307


    > ⁸https://www.netflix.com/title/80209379'
  merge: -1
  img_proc: true
- pgno: 135
  md: '# 4.2 Tidy data


    For example, say you have the following table of stock prices in Table 4.1:


    # TABLE 4.1: Stock prices (non-tidy format)


    | Date | Boec stock price | Amazon stock price | Google stock price |

    | --- | --- | --- | --- |

    | 2009-01-01 | $173.55 | $174.90 | $174.34 |

    | 2009-01-02 | $172.61 | $171.42 | $170.04 |


    Although the data is in a rectangular spreadsheet format, it is not “tidy.” There
    are three variables (date, stock name, and stock price), but not three separate
    columns. In tidy data, each variable should have its own column, as shown in Table
    4.2. Both tables present the same information, but in different formats.


    # TABLE 4.2: Stock prices (tidy format)


    | Date | Stock Name | Stock Price |

    | --- | --- | --- |

    | 2009-01-01 | Boeing | $173.55 |

    | 2009-01-01 | Amazon | $174.90 |

    | 2009-01-01 | Google | $174.34 |

    | 2009-01-02 | Boeing | $172.61 |

    | 2009-01-02 | Amazon | $171.42 |

    | 2009-01-02 | Google | $170.04 |


    On the other hand, consider the data in Table 4.3.


    # TABLE 4.3: Example of tidy data


    | Date | Boeing Price | Weather |

    | --- | --- | --- |

    | 2009-01-01 | $173.55 | Sunny |

    | 2009-01-02 | $172.61 | Overcast |


    In this case, even though the variable “Boeing Price” occurs just like in our
    non—“tidy” data in Table 4.1, the data is “tidy” since there are three variables
    for each of three unique pieces of information: Date, Boeing price, and the Weather
    that day.


