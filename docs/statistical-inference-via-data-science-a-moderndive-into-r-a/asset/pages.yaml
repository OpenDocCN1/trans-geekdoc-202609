- pgno: 384
  md: '# 350 9 Hypothesis Testing


    It turns out from New York City in 2023 Alaska fly to seven airports on the West
    Coast region of the US while Hawaiian only fly to HNL (Honolulu) NYC. Given the
    clear difference in distance from New York City to the West Coast versus New York
    to Honolulu, it is not surprising that we observe different (statistically significantly
    different, in fact) air times in flights.


    This is a clear example of needing to do anything than a simple exploratory data
    analysis using data visualization and descriptive statistics to get an appropriate
    conclusion. This is why we highly recommend you perform an EDA of any sample data
    before running statistical inference methods like confidence intervals and hypothesis
    tests.


    # 9.7.3 Problems with p-values


    On top of the many misunderstandings about hypothesis testing and p-values we
    listed in Section 9.5, another unfortunate consequence of the expanded use of
    p-values and hypothesis testing is a phenomenon known as “p-hacking.” phacking
    is the act of “cherry-picking” only results that are “statistically significant”
    while dismissing those that are not, even at the expense of the scientific ideas.
    There are lots of articles written regarding misunderstandings and the problems
    with p-values. We encourage you to check some of them:


    +   1. Misuse of p-values⁴

    2. What a nerdy debate about p-values shows about science and how to fix it⁵

    3. Statisticians issue warning over misuse of P values⁶

    4. You Cannot Trust What You Read About Nutrition⁷

    5. A Litany of Problems with p-values⁸


    Such issues are so problematic that the American Statistical Association (ASA)
    put out a statement in 2016 titled, “The ASA Statement on Statistical Significance
    and P-Values,”⁹ with six principles governing the proper use and interpretation
    of p-values. The ASA released guidance on p-values to improve the conduct and
    interpretation of quantitative science and to inform the growing emphasis on reproducibility
    of science.


    We as authors prefer the use of confidence intervals for statistical inference,
    since in our opinion they are much prone to large misinterpretation. However,
    many fields still use p-values for statistical inference and this is one reason


    > ⁴https://en.wikipedia.org/wiki/Misuse_of_p-values

    ⁵https://www.vox.com/science-and-health/2017/7/31/16021654/p-values-statistical-significant-redefine-0005

    ⁶https://www.nature.com/news/statisticians-issue-warning-over-misuse-of-p-values.19503

    ⁷https://fivirtyeight.com/features/what-cant-trust-what-you-read-about-nutrition/

    ⁸https://www.ffharell.com/post/pval-litany/

    ⁹https://www.amstat.org/asa/files/P-ValueStatement.pdf'
