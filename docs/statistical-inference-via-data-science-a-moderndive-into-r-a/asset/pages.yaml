  md: '# 8.2 Estimation with the bootstrap


    0.2, and if we draw a sample of size 100, $1/\sqrt{100} = 0.1$. By choosing a
    larger size, four times larger, we produce a confidence interval that is half
    the width. This result is worth considering.


    A confidence interval is an estimator of the parameter of interest, such as the
    population mean weight of almonds. Ideally, we would like to build a confidence
    interval with a high level of confidence, for example, 95% confidence. But we
    also want an interval that is narrow enough to provide useful information. For
    example, assume we get the 95% confidence intervals for the population mean weight
    of almonds:


    +   - between 2 and 4 grams,

    - between 3.51 and 3.64 grams,or

    - between 3.539 and 3.545 grams.


    The first interval does not seem useful at all, the second works better, and the
    third is tremendously accurate, as we are 95% confident that the population is
    within 0.006 grams. Obviously, we always prefer narrower intervals, but there
    are trade-offs we need to consider. We prefer higher levels of confidence, but
    the more confident we want to be the wider the interval will be. In addition,
    the larger the random sample used, the narrower confidence interval will be. While
    the trade-offs are often external; collecting large samples could be expensive
    and time-consuming. The construction of confidence intervals needs to take into
    account all considerations.


    We have concluded the theory-based approach to construct confidence intervals.
    In the next section we explore a completely different approach to construct confidence
    intervals and in later sections we will make comparisons of these methods.


    # 8.2 Estimation with the bootstrap


    In 1979 Brad Efron published an article introducing a method called the bootstrap(Efron,
    1979) that is next summarized. A random sample of size $n$ is taken from the population.
    This sample is used to find another sample, with replacement, also of size $n$.
    This is called *resampling with replacement* and the resulting sample is called
    a bootstrap sample. For example, if the original sample is $\{4, 2, 5, 4, 1, 3,
    7, 4, 6, 1\}$, one particular bootstrap sample could be $\{6,4,7,2,7,2,5,4,1\}$.
    Observe that the number 7 appears once in the original sample, but twice in the
    bootstrap sample; similarly, the number 3 in the original sample does not appear
    in the bootstrap sample. This is not uncommon for a bootstrap sample, some of
    the numbers in the original are repeated and others not included.


    The basic idea of the bootstrap is to gain a large number of bootstrap samples,
    all drawn from the same original sample. Then, we use all these bootstrap samples
    to'
  merge: -1
  img_proc: true
- pgno: 294
  md: '# 260 8 Estimation, Confidence Intervals, and Bootstrapping


    find estimates of population parameters, standard errors, or even the density
    curve of the population. Using them we can construct confidence intervals, perform
    hypothesis testing, and other inferential methods.


    This method takes advantage of the large number of bootstrap samples that can
    be determined. In several respects, this exercise is not different from the sampling
    distribution explained in Chapter 7. The only difference, albeit an important
    one, is that we are not sampling from the population, we are sampling from the
    original sample. How many different bootstrap samples could we get from a single
    sample? A very large number, actually. If the original sample has 10 numbers,
    as the one shown above, each possible bootstrap sample of size 10 is determined
    by sampling 10 times with replacement, so the total number of bootstrap samples
    is $10^{10}$ or 10 billion different samples. If the original sample has 20 numbers,
    the number of bootstrap samples is $2^{20}$, a number greater than the total number
    of stars in the universe. With even modern powers, it would be an onerous task
    to calculate every possible bootstrap sample. Instead, a thousand or so bootstrap
    samples are retrieved, to the simulations performed in Chapter 7, and this number
    is often large enough to provide useful results.


    Since Efron (1979) proposed the bootstrap, the statistical community embraced
    this method. During the 1980s and 1990s, many theoretical and empirical results
    were presented showing the strength of bootstrap methods. An illustration, Efron
    (1979), Hall (Hall, 1986), Efron and Tibshirani (Efron and Tibshirani, 1986),
    and Hall (Hall, 1988) showed that bootstrapping was at least as good if not better
    than existent methods, when the goal was to estimate the standard error of an
    estimator or find the confidence intervals of a parameter. Modifications were
    proposed to improve the algorithm in situations where the basic method was not
    producing accurate results. With the continuous improvement of computing power
    and speed, and the advantages of having ready-to-use statistical software for
    its implementation, the use of the bootstrap has become more and more popular
    in many fields.


    As an illustration, if we are interested in the mean of the population, $\mu$,
    and we have collected one random sample, we can gain a large number of bootstrap
    samples from this original sample, use them to calculate means, order the sample
    means from smallest to largest, and choose the interval that contains the middle
    95% of these samples. This will be the simplest way to find a confidence interval
    based on the bootstrap. In the next few subsections, we explore how to incorporate
    this and similar methods to construct confidence intervals.


    # 8.2.1 Bootstrap samples: Revisiting the almond activity


    To study and understand the behavior of bootstrap samples, we return to our example
    of the chocolate-covered almonds in a bowl. Recall that the bowl is considered
    the population of almonds, and we are interested in estimating the population
    mean weight of almonds.'
