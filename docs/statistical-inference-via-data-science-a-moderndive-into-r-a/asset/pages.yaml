    \ distribution. As we did with proportions, in Figures 7.25 and 7.26 we compare\
    \ our histograms with the theoretical curve for the normal distribution.\n\nWe\
    \ conclude that the distribution of $\bar{X}$, that is, the sampling distribution\
    \ of the sample mean, when the sample size is large enough, follows approximately\
    \ a normal distribution with mean equal to the population mean, $\\mu$, and standard\
    \ deviation equal to the population standard deviation divided by the square root\
    \ of the sample size, $\\sigma/\\sqrt{n}$. We can write this as\n\n```\n$$\\bar{X}\
    \ \\sim \\text{Normal} \\left(\\\\mu, \\frac{\\sigma}{\\sqrt{n}}\\right)$\n```\n\
    \n> Learning check\n\n**(LC7.16)** For each of the following cases, explain whether\
    \ the sampling distribution of the sample mean approximates a normal distribution.\n\
    \n+   * When the population distribution is normal.\n* When the sample size is\
    \ very large.\n* When the sample size is sufficiently large, regardless of the\
    \ population distribution.\n* When the population distribution is uniform.\n\n\
    # 7.5 The sampling distribution in other scenarios\n\nIn Sections 7.1, 7.3, and\
    \ 7.4, we have provided information about the expected value, the standard error,\
