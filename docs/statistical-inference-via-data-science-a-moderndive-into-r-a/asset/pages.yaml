  md: '# 11.2 Case study: Seattle house prices


    +   Condition 1:


    log 10(price) = 3.33 + 0.69 \cdot log 10(size)


    +   Condition 2:


    log 10(price) = (3.33 + 0.047) + (0.69 - 0.024) \cdot log 10(size)

    = 3.377 + 0.666 \cdot log 10(size)


    +   Condition 3:


    log 10(price) = (3.33 - 0.367) + (0.69 + 0.133) \cdot log 10(size)

    = 2.963 + 0.823 \cdot log 10(size)


    +   Condition 4:


    log 10(price) = (3.33 - 0.398) + (0.69 + 0.146) \cdot log 10(size)

    = 2.932 + 0.836 \cdot log 10(size)


    +   Condition 5:


    log 10(price) = (3.33 - 0.883) + (0.69 + 0.31) \cdot log 10(size)

    = 2.447 + 1 \cdot log 10(size)


    These correspond to the regression lines in the left-hand plot of Figure 11.6
    and the faceted plot in Figure 11.7. For homes of all condition types, as the
    size of the house increases, the price increases. This is what most would expect.
    However, the rate of increase with price is fastest for the houses with conditions
    3, 4, and 5 of 0.823, 0.836, and 1, respectively. These are the three largest
    slopes out of the five.


    # 11.2.4 Making predictions


    Say you''re a realtor and someone calls you asking how much their home will sell
    for. They tell you it''s in condition = 5 and is sized 1900 square feet. What
    do you tell them? Let''s use the interaction model to make predictions!


    We first make this prediction visually in Figure 11.8. The predicted log10_price
    of this house is marked with a black dot. This is where the two lines intersect:


    +   - The regression line for the condition = 5 homes and


    +   - vertical dashed black line at log10_size equals 3.28, since our predictor
    variable is the log10 transformed square feet of living space of log 10(1900)
    = 3.28.'
