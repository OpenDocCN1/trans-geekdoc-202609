  md: '# 10.5 Theory-based inference for multiple linear regression


    ![](img/445742518041017e8f01f11b0c3190d9_443_0.png)


    **FIGURE 10.17:** Residuals vs. fitted values plot and QQ-plot for the multiple
    regression model.


    The plot of residuals against fitted values (left) appears to be close to a null
    point. This result is desirable because it supports the Linearity condition as
    no patterns are observed in this plot. The Equal or constant variance also holds
    as the vertical dispersion seems to be fairly uniform for any fitted values. Since
    we have assumed the data collected was random and there are no time sequences
    or other sequences to consider, the assumption of Independence seems to be acceptable
    too. Finally, the QQ-plot suggests (with the exception of one or two observations)
    that the residuals follow approximately the normal distribution. We can conclude
    that this model seems to be good enough to hold the assumptions of the model.


    This example concludes our treatment of theory-based inference. We now proceed
    to study the simulation-based inference.


