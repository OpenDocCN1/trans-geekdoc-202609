  md: "# 224\n\n# 7 Sampling\n\nof any of the almonds to be selected is the same every\
    \ time we choose one. Getting\na sample of 25 almonds is performing trials 25\
    \ times to get 25 weights. Then,\naverage of these 25 numbers is the average weight\
    \ or mean weight of a sample of\n25 almonds. This is what we call a sample mean.\n\
    \nUsing random variables, we now let $X_1$ to be the random variable that\represents\
    \ the weight of the first almond before it has been selected, $X_2$ the weight\n\
    of the second almond. These are random variables because they can take\npossible\
    \ almond weight value from the bowl. After the first trial is completed,\nt value\
    \ of $X_1$ is realized as the weight in grams of the first almond selected. We\n\
    represent this value by we can write $X_1 = x_1$, After the second trial is completed,\
    \ $X_2 = x_2$,nwhere $x_2$ is the observed almond weight, and so on. Since our\
    \ experiment is\nto perform 25 trials and then find the average of them, this\
    \ average or mean, before\nthe trials are carried out, can also be expressed as\
    \ a random variable:\n\n```\n$\\overline{X} = \\frac{X_1 + X_2 + \\dots + X_{25}}{25}$\n\
    ```\n\nObserve that $\\overline{X}$ is the average, or mean, of these 25 trials.\
    \ This is why $\\overline{X}\nis called the sample mean. Recall that dealing with\
    \ proportions, the trials\nBernoulli trials, represented only with zeros or ones.\
    \ In this context, sample\nproportions are a special case of sample means. The\
    \ trials we use now are not\nrestricted to zeros and ones, and the sample means\
    \ are no longer sample proportions.\n\nFor example, let's focus on the sample\
    \ of 25 almond weights used earlier and their\nsample mean:\n\nalmonds_sample\n\
    \n```\n# A tibble: 25 x 3\n# Groups: replicate [1]\nreplicate  ID weight\n<int>\
    \ <int> <dbl>\n1       1 4645 3\n2       1 3629 3.9\n3       1 4796 4\n4     \
