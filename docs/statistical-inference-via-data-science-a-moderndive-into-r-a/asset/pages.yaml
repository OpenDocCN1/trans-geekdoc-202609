- pgno: 350
  md: "316\n\n9 Hypothesis Testing\n\nFirst, a hypothesis is a statement about the\
    \ value of an unknown parameter. In our genre popularity activity, our population\
    \ parameter of interest is the difference in population proportions $p_m - p_d$.\
    \ Hypothesis tests can involve any of the population parameters in Table 8.1 of\
    \ the five inference scenarios we will cover in this book and also advanced types\
    \ we will not cover here.\n\nSecond, a hypothesis test consists of a test between\
    \ two competing hypotheses: (1) a null hypothesis $H_0$ (pronounced “H-naught”)\
    \ versus (2) an alternative hypothesis $H_A$ (also denoted $H_1$).\n\nWhen working\
    \ with the comparison of two populations, typically, the null hypothesis is a\
    \ claim that there is “no effect” or “no difference of interest.” In many cases,\
    \ the null hypothesis represents the status quo. Furthermore, the alternative\
    \ hypothesis is the claim the experimenter or researcher wants to establish or\
    \ find evidence to support. It is viewed as a “challenger” hypothesis to the null\
    \ hypothesis $H_0$. In our popularity activity, an appropriate test would:\n\n\
    $H_0$: metal and deep house have the same popularity rate vs $H_A$: metal is popular\
    \ at a higher rate than deep house\n\nNote of the choices we have made. First,\
    \ we use the null hypothesis $H_0$ to be that there is no difference in popularity\
    \ and the “challenger” alternative hypothesis $H_A$ to be that there is a difference\
    \ in favor of metal. As discussed earlier, in this case, $H_0$ corresponds to\
    \ there being no difference in popularity. Furthermore, we use $H_A$ to be metal\
    \ popular at a higher rate, a subjective choice reflecting our suspicion that\
    \ we have this case. As discussed earlier this is a one-sided test. It can be\
    \ left- or right-sided, and this becomes clear once we express it in terms of\
    \ proportions. If someone else does not share such suspicions and only wants to\
    \ investigate that there is a difference, higher or lower, we would construct\
    \ a two-sided test.\n\nWe can re-express the formulation of our hypothesis test\
    \ using the mathematical notation for our population parameter of interest, the\
    \ difference in population proportions $p_m - p_d$:\n\n$H_0: p_m - p_d = 0$ vs\
    \ $H_A: p_m - p_d > 0$\n\nObserve how the alternative hypothesis $H_A$ is written\
    \ $p_m - p_d > 0$. Since we have chosen this particular formulation, the one-sided\
    \ test becomes right-sided because we are looking for a difference that is greater\
    \ than zero as evidence to reject the null hypothesis. Had we opted for a two-sided\
    \ alternative, we would have set $p_m - p_d \neq 0$. We work here with the right-sided\
    \ test and present an example of a two-sided test\n\nThird, a test statistic is\
    \ a point estimate/sample statistic formula used for testing. Note that a sample\
    \ statistic is merely a summary statistic based on a sample"
  merge: -1
  img_proc: true
- pgno: 351
  md: '# 9.3 Understanding hypothesis tests


    of observations. We recall we in Section 3.3 that a summary statistic takes many
    values and returns only one. Here, the samples would be the $n_m=100$ metal songs
    and the $n_f=1200$ deep house songs; Hence, the point of interest is the difference
    in sample proportions $\hat{p}_m - \hat{p}_d$.


    Fourth, the **observed test statistic** is the value of the test statistic we
    observed in real life. In our case, we computed this value using the data saved
    in the $spotify\_metal\_deephouse$ frame. It was the observed difference of $\hat{p}_m
    - \hat{p}_d = 0.563 - 0.529 = 0.034 = 3.4\%$ in favor of metal songs.


    Fifth, the **null distribution** is the sampling distribution of the test statistic
    **assuming the null hypothesis $H_0$ is true**. Let''s unpack these ideas slowly.
    The key to understanding the null distribution is that the null hypothesis $H_0$
    is *assumed* to be true. We are not saying that $H_0$ is true at this point, we
    are only assuming it to be true for hypothesis-testing purposes. In our case,
    this corresponds to our hypothesis sized of no difference in popularity rates.
    Assuming the null hypothesis $H_0$, also stated as "$H_0$\,” does the test statistic
    vary due to sampling? In our case, will the difference in sample proportions $\hat{p}_m
    - \hat{p}_d$ vary due to sampling under $H_0$? Recall from Subsection 7.3.4 that
    distributions displaying how point estimates vary due to sampling are called *sampling
    distributions*. The only thing to keep in mind about null distributions is that
    they are sampling distributions **assuming the null hypothesis $H_0$ is true**.


    Sixth, the **p-value** is the probability of obtaining a test statistic as extreme
    or more extreme than the observed test statistic assuming the null hypothesis
    $H_0$ is true. You can think of the $p$-value as a quantification of "surprise":
    assuming $H_0$ is true, how surprised are we with what we observed? Or in our
    case, in our universe of no difference in genre popularity, how surprised are
    we that we observed higher popularity rates of 0.034 from our collected samples
    if no difference in genre popularity exists? Very surprised? Somewhat surprised?


    The $p$-value quantifies this probability, or what proportion had "extreme" result?
    Here, it is defined in terms of the alternative hypothesis $H_1$, that metal popularity
    is at a higher rate than deep. In other words, how is the popularity of metal
    *even more* pronounced than $0.563 - 0.529 = 0.034 = 3.4\%?


    Seventh and last, in many hypothesis testing procedures, it is recommended to
    set the **significance level** of the test beforehand. It is denoted by $\alpha$.
    Please review our discussion of $\alpha$ in Section 9.1.1 when we were discussing
    the theory-based approach. For now, it is sufficient to recall that if the $p$-value
    is less or equal to $\alpha$, we reject the null hypothesis $H_0$.


    Alternatively, if the $p$-value is greater than $\alpha$, we would say "fail to
    reject $H_0$." Note the latter statement is not quite the same as saying we "accept
    $H_0$." This distinction is subtle and not immediately obvious. So we will revisit
    it in Section 9.5.


