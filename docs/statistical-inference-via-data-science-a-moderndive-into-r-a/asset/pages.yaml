    11 Tell Your Story with Data


    case studies to you because we believe that you should not only be able to “think
    with data,” but also be able to “tell your story with data.” Let’s explore how
    to do this!


    # Needed packages


    Let’s load all the packages needed for this chapter (this assumes you’ve already
    installed them). Read Section 1.3 for information on how to install and load R
    packages.


    # 11.2 Case study: Seattle house prices


    Kaggle.com⁷ is a machine learning and predictive modeling competition that hosts
    datasets uploaded by companies, governmental organizations, and other individuals.
    One of their datasets is the “House Sales in King County, USA”⁸. It consists of
    sale prices of houses sold between May 2014 and May 2015 in King County, Washington,
    USA, which includes the greater Seattle metropolitan area. This dataset is in
    the house_prices data frame included in the predictive package.


    The dataset consists of 21,613 houses and 21 variables describing these houses
    (for a full list and description of these variables, see the help file by running
    house_prices in the console). In this study, we’ll create a multiple regression
    model where:


    +   - The outcome y is the sale price of houses.

    - Two explanatory variables:


    +   1. A numerical explanatory variable x₁: house size sqft_living as measured
    in square feet of living space. Note that 1 square foot is about 0.09 square meters.


    +   2. A categorical explanatory variable x₂: house condition, a categorical variable
    with five levels where 1 indicates “poor” and 5 indicates “excellent.”


    # 11.2.1 Exploratory data analysis: Part I


    As we’ve said numerous times throughout this book, a critical first step when
    presented with data is to perform an exploratory data analysis (EDA). Exploratory
    data analysis can give you a sense of your data, identify issues with your data,
    bring to light any outliers, and help model construction. The recall common steps
    in exploratory data analysis we introduced in Subsection 5.1.1:


    > ⁷https://www.kaggle.com/

    ⁸https://www.kaggle.com/harlfoxem/housesalesprediction'
