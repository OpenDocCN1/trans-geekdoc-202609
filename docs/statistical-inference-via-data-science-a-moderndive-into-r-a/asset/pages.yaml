    transformations; this means that the correlation between two variables, $x$ and
    $y$, will be the same as the correlation between $(a \cdot x + b)$ and $y$ for
    any constants $a$ and $b$. To illustrate this, observe that the correlation between
    income in thousands of dollars and credit card debt was 0.464. If we now find
    the correlation income in, by multiplying by 1000, and credit card debt we get:


