    \ we reviewed before. Let's focus just on discussing the results for the categorical\
    \ factor continent:\n\n+   - n: The number of non-missing entries for each group\n\
    * group: Breaks down a categorical variable into its unique levels. For this variable,\
    \ it is corresponding to Africa, Asia, North and South America, Europe, and Oceania.\n\
    * type: The data type of the variable. Here, it is a factor.\n* min to sd: These\
    \ are missing since calculating the five-number summary, the mean, and standard\
    \ deviation for categorical variables doesn't make sense.\n\nTurning our attention\
    \ to the summary statistics of the numerical variable `life_exp`, we observe that\
    \ the global median life expectancy in 2022 was 75.14. Thus, half of the world's\
    \ countries (96 countries) had a life expectancy of less than 75.14. The mean\
    \ life expectancy of 73.55 is lower, however. Why is the mean life expectancy\
    \ lower than the median?\n\nWe can answer this question by performing the last\
    \ of the three common steps in an exploratory data analysis: creating data visualizations.\
    \ We visualize the distribution of our output variable $y = life\\_exp$ in Figure\
    \ 5.6.\n\n```\nggplot(gapminder2022, aes(x = life_exp) +\n  geom_histogram(binwidth\
    \ = 5, color = \"white\") +\n  labs(x = \"Life expectancy\",\n       y = \"Number\
    \ of countries\",\n       title = \"Histogram of distribution of worldwide life\
    \ expectancies\")\n```\n\n![](img/445742518041017e8f01f11b0c3190d9_169_0.png)\n\
    \nFIGURE 5.6: Histogram of life expectancy in 2022."
