    \ II errors in hypothesis tests.\n\n# 9.5.3 How do we choose alpha?\n\nIf we are\
    \ using a sample to make inferences about a population, we are operating under\
    \ uncertainty and run the risk of making statistical errors. These are not errors\
    \ in calculations or in the procedure used, but errors in the sense that the sample\
    \ used may lead us to construct a confidence interval that does not contain the\
    \ true value of the population parameter, for example. In the case of hypothesis\
    \ testing, there are two well-defined errors: A Type I and a Type II error:\n\n\
    +   * A Type I is rejecting the null hypothesis when it is true. The probability\
    \ of a Type I Error occurring is $\\alpha$, the *significance level*, which we\
    \ defined in [Subsection 9.1.1](#) and in [Section 9.3](#).\n* A Type II is failing\
    \ to reject the null hypothesis when it is false. The probability of a Type II\
    \ Error is denoted by $\beta$. The value of $1-\beta$ is known as the *power*\
    \ of the test.\n\nIdeally, we would like to minimize the errors, and we would\
    \ like $\\alpha = 0$ and $\beta = 0$. However, this is not possible as there will\
    \ always be the possibility of committing one of these error when making a decision\
    \ based on sample data. Furthermore, these two errors are inversely related. As\
    \ the probability of a Type I error goes down, the probability of a Type II error\
    \ goes up.\n\nWhen constructing a hypothesis test, we have control of the probability\
    \ of committing a Type I Error because we can decide what the significance level\
    \ $\\alpha$ we want to use. Once $\\alpha$ has been pre-specified, we to minimize\
    \ $\beta$, the fraction of incorrect non-rejections of the null hypothesis.\n\n\
    So for example if we used $\\alpha = 0.01$, we would be using a hypothesis testing\
    \ procedure that in the long run would incorrectly reject the null hypothesis\
    \ $H_0$ one percent of the time. This is analogous to setting the confidence level\
    \ of a confidence interval.\n\nSo what value should you use for $\\alpha$? While\
    \ different fields of study have adopted different conventions, although $\\alpha\
    \ = 0.05$ is perhaps the most popular threshold, there"
