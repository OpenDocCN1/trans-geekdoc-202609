    \ topics into their syllabus.\nRStudio can be used in either the server version\
    \ or the desktop version. (This is\ndiscussed further in Section 1.1.1.) We assume\
    \ that students taking the class will\nhave no prior algebra, calculus, or programming/coding\
    \ experience.\n\nHere are some principles and beliefs we keep in mind while writing\
    \ this text. If you\nage with them, this is the book for you.\n\n+   1. Blur the\
