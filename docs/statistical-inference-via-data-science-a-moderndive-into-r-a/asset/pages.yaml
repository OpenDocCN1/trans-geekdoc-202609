    Recall that loading the tidyverse package loads many packages that we have encountered
    earlier. For details refer to Section 4.4. The packages moderive and infer contain
    functions and data frames that will be used in this chapter.


    # 9.1 Tying confidence intervals to hypothesis testing


    In Chapter 8, we used a random sample to construct an interval estimate of the
    population mean. When using the theory-based approach, we relied on the Central
    Limit Theorem to form these intervals and when using the simulation-based approach
    we do it, for example, using the bootstrap percentile method. Hypothesis testing
    takes advantages of similar tools but the nature and the goal of the problem are
    different. Still, there is a direct link between confidence intervals and hypothesis
    testing.


    In this section, we first describe the one-sample hypothesis test for the population
    mean. We then establish the connection between confidence intervals and hypothesis
    test. This connection is direct when using the theory-based approach but requires
    careful consideration when using the simulation-based approach.


    We proceed by describing hypothesis testing in the case of two-sample problems.


    # 9.1.1 The one-sample hypothesis test for the population mean


    Let''s continue working with the population mean, $\mu$. In Chapter 8, we used
    a random sample to construct a 95% confidence interval for $\mu$.


    When performing hypothesis testing, we test a claim about $\mu$ by collecting
    a random sample and using it to determine if the sample obtained is consistent
    with the claim made. To illustrate this idea we return to the chocolate-covered
    almonds activity. Assume that the almonds'' company has stated on its website
    that the average weight'
