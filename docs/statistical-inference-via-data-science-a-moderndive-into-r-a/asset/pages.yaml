    # 2.3.3 Summary


    Scatterplots display the relationship between two numerical variables. They are
    among the most commonly used plots because they can provide an immediate way to
    see the trend in one numerical variable versus another. However, if you try to
    create a scatterplot where one of the variables is not numerical, you might get
    strange results. Be careful!


    With medium to large datasets, you may need to play around with the different
    modifications to scatterplots we saw as changing the transparency/opacity of the
    points or by jittering the points. This tweaking is often fun part of data visualization,
    since you''ll have the chance to see different relationships emerge as you tinker
    with your plots.


    # 2.4 5NG#2: Linegraphs


    The next of the five graphs are linegraphs. Linegraphs show the relationship between
    two numerical variables when the variable on the x-axis, also called the explanatory
    variable, is of a sequential nature. In other words, there is an inherent ordering
    to the variable.'
