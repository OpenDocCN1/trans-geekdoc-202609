  md: '# 8.1 Tying the sampling distribution to estimation


    do not include the population mean, and 95% do. It won''t always match up perfectly
    like, but the proportions should match pretty close to the confidence level chosen.


    The term “95% confidence” invites us to think we are talking about probabilities
    or chances. Indeed we are, but in a subtle way. Before a random sample has been
    procured, there is a 95% chance that when confidence interval is constructed using
    the prospective random sample, this interval will contain the population mean.
    The moment a random sample has been attained, the interval constructed contains
    either the population mean or it does not; with certainty, it is no longer a chance
    involved. This is true if we do not know what the population mean is. So the 95%
    confidence refers to the method or process to be used on a prospective sample.
    We are confident that if we follow the process to construct the interval, 95%
    of the random sample attained will lead us to produce an interval that contains
    the population mean.


    On the other hand, it would be improper to say that…there is a 95% chance that
    the confidence interval contains the population mean.” Looking at Figure 8.8,
    of the confidence intervals either does or not contain $\mu$. Once the confidence
    interval is determined, either the population mean is included or not.


    In the literature, this explanation has been encapsulated in a short-hand version:
    we 95% confident that the interval contains the population parameter. For example,
    in Subsection 8.1.4 the 95% confidence for the population mean weight of almonds
    was (3.498, 3.846), and we would say: “We are 95% confident that the population
    mean weight of almonds is between 3.498 and 3.846 grams.”


    It is perfectly acceptable to use the short-hand statement, but always remember
    that the 95% confidence refers to the process, or method, and can be thought of
    as a chance or probability only before the random sample has been acquired. To
    ensure that the probability-type of language is not misused, quotation marks are
    sometimes sometimes “95% confident” to emphasize that it is a short-hand version
    of the more accurate explanation.


