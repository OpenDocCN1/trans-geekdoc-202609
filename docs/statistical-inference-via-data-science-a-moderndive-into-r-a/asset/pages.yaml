  md: '# 2.5 NG#3: Histograms


    # 2.5.1 Histograms via geom_histogram


    Let''s now present the ggplot() code to plot your first histogram! Unlike scat-terplots
    and linegraphs, there is now only one variable being mapped in aes(): the single
    numerical variable wind_speed. The y-aesthetic of a histogram, the count of the
    observations in each bin, gets computed for you automatically. Furthermore, the
    geometric object layer is now a geom_histogram(). After running the following
    code, you''ll see the histogram in Figure 2.10 as well as warning messages. We''ll
    discuss the warning messages first.


    ```

    ggplot(data = weather, mapping = aes(x = wind_speed)) +

    geom_histogram())

    ```


    `stat_bin()` using `bins = 30`. Better value with `binwidth`.


    Warning: Removed 1033 rows containing non-finite outside the scale range (`stat_bin()`).


    ![](img/445742518041017e8f01f11b0c3190d9_73_0.png)


    **FIGURE 2.10:** Histogram of hourly wind speeds at three NYC airports.


    The first message is telling us that the histogram was constructed using bins
    = 30 for 30 equally spaced bins. This is known in computer programming as a default
    value; unless you override this default number of bins with a number you specify,
    R will choose 30 by default. We''ll see in the next section how to change the
    number of bins to another value than the default.


    The second message is telling us something similar to the warning message we received
    when we ran the code to create a scatterplot of departure and arrival delays for
    Envoy Air flights in Figure 2.2: that some rows have missing NA value for wind_speed,
    they were omitted from the histogram. R is just giving us a friendly heads-up
    that this was the case.'
