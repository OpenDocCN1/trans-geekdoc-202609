    7 182 244 170.006 11.994

    8 190 278 182.623 7.377

    9 138 249 171.861 -33.861

    10 186 262 176.686 9.314

    ```


    # Residual diagnostics


    Residual diagnostics are used to verify conditions L, N, and E. While there are
    more sophisticated statistical approaches that can be used, we focus on data visualization.
    One of the most useful plots is a residual plot, which is a scatterplot of the
    residuals against the fitted values. The fitted_and_residuals object to draw the
    scatterplot using geom_point() with the fitted values (waiting_hat) on the x-axis
    and the residuals (residual) on the y-axis. In addition, we add titles to our
    axes with labs() and draw a horizontal line at 0 for reference using geom_hline()
    and yintercept = 0, as shown in the following code:


    ```

    fitted_and_residuals |>

    gggplot(aes(x = waiting_hat, y = residual)) +

    geom_point() +

    labs(x = "duration", y = "residual") +

    geom_hline(yintercept = 0, col = "blue")

    ```'
