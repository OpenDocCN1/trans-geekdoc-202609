    # 5.3 Related topics


    # 5.3.1 Correlation is not necessarily causation


    Throughout this chapter we have been cautious when interpreting regression slope
    coefficients. We always discussed the “associated” effect of an explanatory variable
    x on an outcome variable y. For example, our statement from Subsection 5.1.2 “for
    every increase of 1 unit in life_exp, there is an associated decrease of average
    0.137 units of fert_rate.” We include the “associated” to be extra careful not
    to suggest that we are making a causal statement. While life_exp is negatively
    correlated with fert_rate, we can’t necessarily make any statements about life
    expectancy’s direct causal effect on fertility rates without more information.


    Here is another example: a not-so-great medical doctor goes through medical records
    and finds that patients who slept with their shoes on tended to wake up more with
    headaches. So this doctor declares, “Sleeping with shoes causes headaches!”


    ![](img/445742518041017e8f01f11b0c3190d9_179_0.png)


    FIGURE 5.9: Does sleeping with shoes on cause headaches?


    However, there is a good chance that if someone is sleeping with their shoes on,
    it is potentially because they are intoxicated by alcohol. Furthermore, higher
    levels of drinking leads to more hangovers, and more headaches. The amount of
    alcohol consumption here is what’s known as a confounding/lurking variable. It
    “lurks” behind the scenes, confounding the causal relationship (if any) of “sleeping
    with shoes on” with “waking up with a headache.” We can summarize this in Figure
    5.10 with a causal graph where:'
