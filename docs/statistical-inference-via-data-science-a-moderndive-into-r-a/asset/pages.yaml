    # 6.2.2 Multiple regression with two numerical regressors


    As shown in Figure 6.6, the linear regression with two numerical regressors produces
    the ''best-fitting'' plane. We start with a model with no interactions for the
    two numerical explanatory variables income and credit_limit. In R we consider
    a model with a formula of the form y ~ x1 + x2. We retrieve the regression coefficients
    using the lm function and the coef() to get the coefficients of the linear regression.
    The regression coefficients are shown in the following:


    ```

    debt_model <- lm(debt ~ credit_limit + income, data = credit_ch6)

    coef(debt_model)

    ```


    We present these results in a table with the mathematical notation used above:


    | | Coefficients | Values |

    |---|---||

    | (Intercept) | b0 | -385.179 |

    | credit_limit | b1 | 0.264 |

    | income | b2 | -7.663 |


    +   1. We determine the linear regression coefficients using lm(y ~ x1 + x2, data)
    where x1 and x2 are the two numerical explanatory variables.

    2. We extract the coefficients from the output using the coef() command.


    Let''s interpret the coefficients. The intercept value is -$385.179. If the range
    of values that the regressors could take include a credit_limit of $0 and an income
    of $0, the intercept would represent the average credit debt for an individual
    with those


