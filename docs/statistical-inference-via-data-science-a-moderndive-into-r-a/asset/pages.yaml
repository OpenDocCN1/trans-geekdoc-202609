  md: 'studied. If information of the weights is not available, some methods can be
    used to provide an estimator for the internal structure of the variance in the
    model. One of the most popular of these methods is called the sandwich estimator.


    Checking that the assumptions of the model is satisfied is a key component of
    regression analysis. Constructing and interpreting confidence intervals as well
    as conducting hypothesis tests and providing conclusions from the results of hypothesis
    tests are directly affected by whether or not assumptions are satisfied. At the
    same time, it is often the case with regression analysis a level of subjectivity
    when visualizing and interpreting plots is present, and sometimes we are faced
    with difficult statistical decisions.


    So what can be done? We suggest transparency and clarity in communicating results.
    It is important to highlight important elements that may suggest from relevant
    assumptions, and then provide pertinent conclusions. In this way, stakeholders
    of any analysis are aware of the model''s shortcomings and can decide whether
    or not to agree with the conclusions presented to them.


