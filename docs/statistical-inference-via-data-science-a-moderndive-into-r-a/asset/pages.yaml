  md: '# 10.6 Simulation-based inference for multiple linear regression


    From these visualizations, we can discern that aroma and flavor are statistically
    significant, as their observed statistics fall far to the right of the null distribution.
    On the other hand, moisture_percentage is not statistically significant, as its
    observed test statistic falls within the null distribution. We can also compute
    the numerical p-values using the get_p_value() function.


