    # 5.3.2 Best-fitting line


    Regression lines are also known as “best-fitting”-lines. But what do we mean by
    “best?” We unpack the criteria that is used in regression to determine “best.”
    Recall Figure 5.4, where for Bosnia and Herzegovina we marked the observed value
    $y$ with a circle, the fitted value $\hat{y}$ with a square, and the residual
    $y-\hat{y}$ with an arrow. We re-display Figure 5.4 in the top-left plot of Figure
    5.11 in addition to three arbitrarily chosen countries:


