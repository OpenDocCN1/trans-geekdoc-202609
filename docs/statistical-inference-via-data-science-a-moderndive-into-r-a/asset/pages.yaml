  md: '# 8 Estimation, Confidence Intervals, and Bootstrapping


    # 8.2.2 Confidence intervals and the bootstrap: Original workflow


    The process of determining bootstrap samples using them for estimation is called
    bootstrapping. We can estimate population parameters such as the mean, median,
    or standard deviation. We can also construct confidence intervals.


    In this subsection, we focus on the latter and construct confidence intervals
    based on bootstrap samples. For this, we review the R syntax and workflow we have
    already used in previous sections and also introduce a new package: the infer
    package for tidy and transparent statistical inference.


    # Original workflow


    Recall how we use bootstrap samples, then calculated the sample means from these
    samples. Let''s revisit the original workflow using dplyr verbs and the |> operator.


    First, we use rep_sample_n() to resample from the original sample almonds_sample_100
    of 5000 almonds. We set size = 100 to generate bootstrap samples of the same size
    as the original, and we resample with replacement by setting replace = TRUE. We
    create 1000 bootstrap samples by setting reps = 1000:


    ```

    almonds_sample_100 |>

    rep_sample_n(size = 100, replace = TRUE, reps = 1000)

    ```


    Second, we add another pipe followed by summarize() to compute the sample mean
    weight for each replicate:


    ```

    almonds_sample_100 |>

    rep_sample_n(size = 100, replace = TRUE, reps = 1000) |>

    summarize(mean_weight = mean(weight))

    ```


    For this simple case, all we needed to use the rep_sample_n() function and a dplyr
    verb. However, using only dplyr verbs provides us with a limited set of tools
    that is not ideal when working with more complicated situations. This is the reason
    we introduce the infer package.


    # 8.2.3 The infer package workflow


    The infer package is an R package for statistical inference. It makes efficient
    use of the |> pipe operator we introduced in Section 3.1 to spell out the sequence
    of steps necessary to perform statistical inference in a “tidy” and transparent
    fashion. Just as the dplyr package provides functions with verb-like names to
    perform data wrangling, the infer package provides functions with intuitive verb-like
    names to'
  merge: -1
  img_proc: true
- pgno: 305
  md: '# 8.2 Estimation with the bootstrap 271


    perform statistical inference, such as constructing confidence intervals or performing
    hypothesis testing. We have discussed the theory-based implementation of the former
    in section 8.1.3 and we introduce the latter in Chapter 9.


    Using the example of almonds'' weights, we infer first by comparing its implementation
    with dplyr. Recall that to calculate a sample statistic or point estimate from
    a sample, such as the sample mean, when using dplyr summarize() and mean():


    ```

    almonds_sample_100 |>

    summarize(stat = mean(weight))

    ```


    If we use to infer instead, we use the functions specify() and calculate() as
    shown below:


    ```

    almonds_sample_100 |>

    specify(response = weight) |

    calculate(stat = "mean")

    ```


    The new structure using infer seems slightly more complicated than the one using
    dplyr for this simple calculation. These functions will provide three chief benefits
    moving forward.


    +   First, the infer verb names better align with the overall simulation-based
    framework you need to understand construct confidence intervals and conduct hypothesis
    tests (in Chapter 9). We will see flowchart diagrams of this framework in the
    upcoming Figure 8.20 and in Chapter 9 with Figure 9.11.


    +   Second, you can transition seamlessly between confidence intervals and hypothesis
    testing with minimal changes to code. This becomes apparent in Section 9.4.2 when
    we compare the infer code for both of these inferential methods.


    +   Third, the infer workflow is much simpler for conducting inference when you
    have more than one variable. We introduce two-sample inference where the sample
    data is collected from two groups, as in Section 8.4 where we study the connectedness
    of yawning and in Section 9.2 where we compare the popularity of music genres.
    Then in Section 10.3, we see situations of inference for regression using the
    regression models you fit in Chapter 5.


    We now illustrate the sequence of verbs necessary to construct a confidence interval
    for $\mu$, the population mean weight of almonds.'
