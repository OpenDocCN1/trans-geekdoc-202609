    \ geom_jitter(). This corresponds to how hard you'd like to shake the plot in\
    \ horizontal x-axis units and vertical y-axis units, respectively. In this case,\
    \ both axes are in minutes. How much jitter should we add using the width and\
    \ height arguments? On the one hand, it is important to add just enough jitter\
    \ to break any overlap in points, but on the other hand, not so much that we completely\
    \ alter the original pattern in points."
