    of a chocolate-covered almond is exactly 3.6 grams. We are not so sure about this
    claim and as researchers believe that it is different from 3.6 grams on average.
    To test these competing claims, we again use the random sample almonds_sample_100
    from the modnerivndive package, and the first 10 lines are shown below:


    ```

    almonds_sample_100

    ```


    ```

    # A tibble: 100 x 2

    ID weight

    <int> <dbl>

    1 166 4.2

    2 1215 4.2

    3 1899 3.9

    4 1912 3.8

    5 4637 3.3

    6 511 3.5

    7 127 4

    8 4419 3.5

    9 4729 4.2

    10 2574 4.1

    # i i 90 more rows

    ```


    The goal of hypothesis testing is to answer the question: “Assuming that this
    claim is true, how likely is it to observe a sample as extreme as or more than
    the one we have observed?” When the answer to the question is: “If the claim was
    true, it would be very unlikely to observe a sample as the one we have obtained”
    we would conclude that the claim cannot be true and we would reject it. Otherwise,
    we would fail to reject the claim.


    The claim is a statement called the null hypothesis, $H_0$. It is a statement
    about $\mu$, and it is initially assumed to be true. A competing statement called
    the alternative hypothesis, $H_A$, is also a statement about $\mu$ and contains
    all the possible values not included under the null hypothesis. In the almonds''
    activity the hypotheses are:


    > $H_0 : \mu = 3.6$

    $H_A : \mu \neq 3.6$


    Evidence against the null may appear if the estimate of $\mu$ in the random sample
    collected, the sample mean, is much greater or much less than the value of $\mu$
    under the null hypothesis.


    How do we determine which claim should be the null hypothesis and which one the
    alternative hypothesis? Always remember that the null hypothesis has a privileged'
