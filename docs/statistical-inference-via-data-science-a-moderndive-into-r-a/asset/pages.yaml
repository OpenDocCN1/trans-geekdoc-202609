- pgno: 285
  md: '# 8.1 Tying the sampling distribution to estimation


    interval. Nevertheless, in real-life applications, the population standard deviation
    is also unknown. Instead, we use the sample standard deviation, $s$, from the
    sample we have, as an estimator of the population standard deviation $\sigma$.
    Our estimated standard error is given by


    ```

    $$\widehat{SE}(\bar{X}) = \frac{s}{\sqrt{n}}$

    ```


    When using the sample standard deviation to estimate the standard error, we are
    introducing additional uncertainty in our model. For example, if we try to standardize
    this value, we get


    ```

    $t = \frac{\bar{X} - \mu}{\sqrt{n}}$

    ```


    Because we are using the sample standard deviation in this equation and since
    the sample standard deviation changes from sample to sample, the additional uncertainty
    makes the values $t$ no longer normal. Instead they follow a new distribution
    called the $t$ distribution.


    The $t$ distribution is similar to the standard normal; its density curve is also
    bellshaped, and is symmetric around zero, the tails of the $t$ distribution are
    a little thicker than those of the standard normal. In addition, the $t$ distribution
    requires one additional parameter, the degrees of freedom. For sample mean problems,
    the degrees of freedom needed are exactly $n-1$, the size of the sample minus
    one. Figure 8.7 shows the density curves


    +   - the standard normal density curve, in black,

    - a $t$ density curve for a $t$ distribution with 2 degrees of freedom, dotted,
    and

    - a $t$ density curve for a $t$ distribution with 10 degrees of freedom, dashed.


    ![](img/445742518041017e8f01f11b0c3190d9_285_0.png)


    **FIGURE 8.7:** The standard normal and two t-distributions.'
  merge: -1
  img_proc: true
