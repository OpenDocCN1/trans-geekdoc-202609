    Why are the values returned NA? NA how R encodes missing values where NA indicates

    “not available” or “not applicable.” If a value for a particular row and a particular

    column does not exist, NA is stored instead. Values can be missing for many reasons.

    Perhaps the data was collected but someone forgot to enter it. Perhaps there was
    an

    erroneous value that someone entered that has been corrected to read as missing.

    You''ll often encounter issues with missing values when working with real data.


    Going back to our summary_windspeed output, by default you will try to calculate

    a summary statistic of a variable that has one or more NA missing values in R,
    NA is

    returned. To work around this, you can set the na.rm argument to TRUE, where

    rm is short for “remove”; this will ignore any NA missing values and only return
    the

    summary value for all non-missing values.


