    TED talk titled “The best stats you''ve ever seen”3 where he presented global
    economic, health, and development data from the website gapminder.org4. For example,
    data on 142 countries in 2007, let''s consider only a few countries in Table 2.1
    as a peek into the data.


    **TABLE 2.1:** Gapminder 2007 data: First 3 of 142 countries


    | Country | Continent | Life Expectancy | Population | GDP per Capita |

    |---|---|---|---|--|

    | Afghanistan | Asia | 43.8 | 31889923 | 975 |

    | Albania | Europe | 76.4 | 3600523 | 5937 |

    | Algeria | Africa | 72.3 | 3333216 | 6223 |


    Each row in this table corresponds to a country in 2007. For each row, we have
    5 columns:


    +   1. **Country**: Name of country.

    2. **Continent**: Which of the five continents the country is part of. Note that
    “Americas” includes countries in both North and South America and that Antarctica
    is excluded.

    3. **Life Expectancy**: Life expectancy in years.

    4. **Population**: Number of people living in the country.

    5. **GDP per capita**: Gross domestic product (in US dollars).


    Now consider Figure 2.1, which plots this for all 142 of the data''s countries.


    ![](img/445742518041017e8f01f11b0c3190d9_59_0.png)


    **FIGURE 2.1:** Life expectancy over GDP per capita in 2007.


    > 3https://www.ted.com/talks/hans_rosling_showing_the_best_stats_you_ve_ever_seen

