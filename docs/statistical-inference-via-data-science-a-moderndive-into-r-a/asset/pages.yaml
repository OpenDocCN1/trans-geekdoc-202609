  md: '# 10 Getting Started with Data in R


    An alternative but slightly convenient way to install a package is by typing `packages("ggplot2")`
    in the console pane of RStudio and pressing Return/Enter on your keyboard. Note
    you must include the quotation marks around the name of the package.


    Much like an app on your phone, you only have to install a package once. However,
    if you want to update a previously installed package to a newer version, you need
    to re-install it by repeating the earlier steps.


    # Learning check


    (LC1.1) Repeat the earlier installation steps, but for the `dplyr`, `nycflights23`
    and `knitr` packages. This will install the earlier mentioned `dplyr` package
    for data wrangling, `nycflights23` package containing all domestic flights leaving
    an NYC airport in 2023, and the `knitr` package for generating easy-to-read tables
    in R. We’ll use these packages in the next section.


    # 1.3.2 Package loading


    Recall after you''ve installed a package, you need to “load it.” In other words,
    you need to “open it.” We do this using the `library()` command.


    For example, to load the `ggplot2` package, run the following code in the console
    pane. What do we mean by “run the following code?” Either type or copy-and-paste
    the following code into the console pane and hit the Enter key.


    ```

    library(ggplot2)

    ```


