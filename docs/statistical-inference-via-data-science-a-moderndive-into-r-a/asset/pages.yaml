    # 3.2 filter rows


    # Subset Observations (Rows)


    ![](img/445742518041017e8f01f11b0c3190d9_98_0.png)


    The filter() function works much like the “Filter” option in Microsoft Excel;
    it allows you to specify criteria about the values of a variable in your dataset
    and then filters out the rows that match that criteria.


    We begin by focusing on flights from New York City to Phoenix, Arizona. The dest
    destination code (or airport code) for Phoenix, Arizona is “PHX”. Run the following
    and look at the results in RStudio’s spreadsheet viewer to ensure that only flights
    heading to Phoenix are chosen here:'
  merge: -1
  img_proc: true
- pgno: 99
  md: '# 3.2 filter rows


    ```

    phoenix_flights <- flights |

    filter(dest == "PHX")

    View(phoenix_flights)

    ```


    Note the order of the code. First, take the flights data frame flights then filter()
    the data frame so that only where the dest equals "PHX" are included. We test
    for equality using the double sign == and not a single sign ==. In words, filter(dest
    = "PHX") will yield an error. This is a convention across many programming languages.
    If you are new to coding, you''ll probably forget to use the double sign == a
    few times before you get the hang of it.


    You can use other operators besides the == operator that tests for equality:


    +   * corresponds to "greater than"

    * corresponds to "less than"

    * >= corresponds to "greater or equal to"

    * <= corresponds to "less or equal to"

    * != corresponds to "not equal to." The ! is used in many programming languages
    to indicate "not."


    Furthermore, you can combine multiple criteria using operators that make comparisons:


    +   * corresponds to "or"

    * corresponds to "and"


    To see many of these in action, let''s filter flights for all rows that departed
    from JFK and were heading to Burlington, Vermont ("BTV") or Seattle, Washington
    ("SEA") and departed in the months of October, November, or December. Run the
    following:


    ```

    btv_sea_flights_fall <- flights |

    filter(origin == "JFK" & dest == "BTV" | dest == "SEA" & month > 10)

    View(btv_sea_flights_fall)

    ```


    Note that even when colloquially one might say "all flights leaving Burlington,
    Vermont and Seattle," in terms of operations, we mean "all flights leaving Burlington,
    Vermont or leaving Seattle, Washington." For a given row in the data, dest can
    be "BTV", "SEA", or something else, but not both "BTV" and "SEA" at the same time,
    note the careful use of parents around dest == == "BTV" | dest == "SEA".


    We can often skip the use of & just separate our conditions with a comma, the
    previous code will return the identical output btv_sea_flights_fall as the following
    code:'
