- pgno: 404
  md: "The construction of a 95% confidence interval for $\beta_0$ follows exactly\
    \ the same steps using $b_0, SE(b_0)$, and the same critical value $q$ as the\
    \ degrees of freedom for the $t$-distribution are exactly the same, $n-2$:\n\n\
    ```\n$b_0 \\pm q \\cdot SE(b_0) =79.459 \\pm 1.981 \\cdot 7.311 ==(-14.112, 14.854)$\n\
    ```\n\nThe results of the confidence intervals are valid only if the linear model\
    \ assumptions are satisfied. We discuss these assumptions in Section 10.2.6.\n\
    \n# 10.2.4 Hypothesis test for population slope\n\nTo perform a hypothesis test\
    \ for $\beta_1$, the general formulation of a two-sided test is\n\n```\n$H_0 :\
    \ \\beta_1 = B \\nH_A : \\beta_1 \\neq B$\n```\n\nWhen $B$ is the hypothesized\
    \ value for $\beta_1$. Recall the terminology, notation, and definitions related\
    \ to hypothesis tests we introduced in Section 9.3. A hypothesis test consists\
    \ of a test between two competing hypotheses: (1) a *null hypothesis* $H_0$ versus\
    \ (2) an *alternative hypothesis* $H_A$.\n\n# Test statistic\n\nA *test statistic*\
    \ is a point estimator used for hypothesis testing. Here, the $t$-test statistic\
    \ is given by\n\n```\n$t = \\frac{b_1 - B}{SE(b_1)}$\n```\n\nThis test statistic\
    \ follows, under the null hypothesis, a $t$-distribution with $n-2$ degrees of\
    \ freedom. A particularly useful test is whether there is a linear association\
    \ between the explanatory variable and the response, which is equivalent to testing:\n\
    \n```\n$H_0 : \\beta_1 = 0 \\nH_1 : \\beta_1 \\neq 0$\n```\n\nFor example, we\
    \ may use this to determine whether there is a linear relationship between the\
    \ duration of the Old Faithful geyser eruptions (*duration*) and the waiting time\
    \ to the next eruption (*waiting*). The *null hypothesis* $H_0$ assumes that the\
    \ population slope $\beta_1$ is 0. If this is true, there is *no linear relationship*\
    \ between the *duration* and waiting times. When performing a hypothesis test,\
    \ we assume that the null hypothesis $H_0 : \\beta_1 = 0$ is true and try to find\
    \ evidence against it based on the data observed."
  merge: -1
  img_proc: true
- pgno: 405
  md: "# 10.2 Theory-based inference for simple regression\n\nThe alternative hypothesis\
    \ $H_A$, on the other hand, states that the population slope $\beta_1$ is not\
    \ 0, meaning that longer eruption duration may result in greater or smaller waiting\
    \ times to the next eruption. This suggests either a positive or negative linear\
    \ relationship between the explanatory variable and the response. Since evidence\
    \ against the null hypothesis may happen in either direction in this context,\
    \ we call this a two-sided test. The t-test statistic for this problem is given\
    \ by:\n\n```\n$t = \\frac{b_1 - 0}{SE(b_1)} = \\frac{0.371 - 0}{0.032} = 11.594$$\n\
    ```\n\n# The p-value\n\nRecall the terminology, notation, and definitions related\
    \ to hypothesis tests were introduced in Section 9.3. The definition of the p-value\
    \ is the probability of obtaining a test statistic as extreme or more extreme\
    \ than one observed, assuming the null hypothesis $H_0$ is true. We intuitively\
    \ think of the p-value as quantifying how \"extreme\" the estimated slope $(b_1\
    \ = 0.371)$, assuming there is no relationship between duration and waiting times.\n\
    \nFor a two-sided test, if the test statistic is $t = 2$ for example, the p-value\
    \ is calculated as the area under the $t$-curve to the left of $-2$ and to the\
    \ right of 2 is shown in Figure 10.4.\n\n![](img/445742518041017e8f01f11b0c3190d9_405_0.png)\n\
    \nIn our Old Faithful geyser eruptions example, the test statistic for the test\
    \ $H_0 : \\beta_1 = 0$ was $t = 11.594$. The p-value was so small that R simply\
    \ shows that it is equal to zero."
  merge: -1
  img_proc: true
- pgno: 406
  md: '# Interpretation


    Following the hypothesis testing procedure we outlined in Section 9.5, since the
    $p$-value was practically 0, for any choice of significance level $\alpha$, we
    would reject $H_0$ in favor of $H_1$. In other words, assuming that there is no
    linear association between duration and waiting times, the probability of observing
    a slope as extreme as the one we have attained using our random sample, was practically
    0. In conclusion, we reject the null hypothesis that there is no linear relationship
    between duration and waiting times. We have enough statistical evidence to conclude
    that there is a linear relationship between these variables.


    # Learning check


    (LC10.4) In the context of a linear regression model, what does the null hypothesis
    $H_0 : \beta_1 = 0$ represent?


    +   - A. There is no linear association between the response and the explanatory
    variable.

    - B. The difference between the observed and predicted values is zero.

    - C. The linear association between response and explanatory variable crosses
    the origin.

    - D. The probability of committing a Type II Error is zero.


    (LC10.5) Which of the following is an assumption of the linear regression model?


    +   - A. The error terms $\epsilon_i$ are normally distributed with constant variance.

    - B. The error terms $\epsilon_i$ have a non-zero mean.

    - C. The error terms $\epsilon_i$ are dependent on each other.

    - D. The explanatory variable must be normally distributed.


    (LC10.6) What does it mean when we say that the slope estimator $b_1$ is a random
    variable?


    +   - A. $b_1$ will be the same for every sample taken from the population.

    - B. $b_1$ is a fixed value that does not change with different samples.

    - C. $b_1$ can vary from sample to sample due to sampling variation.

    - D. $b_1$ is always equal to the population slope $\beta_1$.'
