  md: '# 7.4 Second activity: Chocolate-covered almonds


    As we did with sample proportions, we start by illustrating these results with
    another activity: sampling from a bowl of chocolate-covered almonds, as seen in
    Figure 7.18.


    ![](img/445742518041017e8f01f11b0c3190d9_251_0.png)


    FIGURE 7.18: A bowl of chocolate-covered almonds.


    For ease of exposition we refer to each chocolate-covered almond simply as an
    almond. We are now interested in the average weight in grams of all the almonds
    in the bowl; this is the population average weight or population mean weight.


    # 7.4.1 The population mean weight of almonds in the bowl


    The population of interest is given by all the almonds in the bowl. The bowl is
    represented virtually by the data frame almonds_bowl included in the modernrive
    package. The first ten rows are shown here for illustration purposes:


    ```

