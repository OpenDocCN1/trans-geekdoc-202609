  md: "# 11.2 Case study: Seattle prices\n\n# 11.2.2 Exploratory data analysis: Part\
    \ II\n\nLet's continue our EDA by creating multivariate visualizations. Unlike\
    \ the univariate histograms and barplot in the earlier Figures 11.3, 11.4, and\
    \ 11.5, multivariate visualizations show relationships between more than one variable.\
    \ This is an important step of an EDA to perform since the goal of modeling is\
    \ to explore relationships between variables.\n\nSince our model involves a numerical\
    \ outcome, and a categorical explanatory variable, we are in a similar regression\
    \ modeling situation as in Section 6.1 where we studied the UN members dataset.\
    \ Recall in that case the numerical outcome was fertility, the numerical explanatory\
    \ variable was life expectancy, and the categorical explanatory variable was income\
    \ group.\n\nWe have two choices of models we can fit: either (1) an interaction\
    \ model where the regression line for each condition level will have a different\
    \ slope and a different intercept or (2) a parallel slopes model where the regression\
    \ line for each condition level have same slope but different intercepts.\n\n\
