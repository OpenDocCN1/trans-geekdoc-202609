- pgno: 40
  md: '# 1 Getting Started with Data in R


    makes it seem like it is scolding you. However, seeing red text in the console
    is not always bad.


    R will show red text in the console in three different situations:


    +   **Errors**: when the red text is a legitimate error, it will be preceded with
    "Error in..." and will try to explain what went wrong. Generally when there''s
    an error, the code will not run. For example, we''ll see in [Subsection 1.3.3](https://example.com)
    if you see Error in `ggplot()` : code not find function `ggplot`, it means that
    the `ggplot()` function is not accessible the package that contains the function
    `ggplot2` was not loaded with `library(ggplot2)`. Thus you cannot use the `ggplot()`
    function without the `ggplot2` package being loaded.

    **Warnings**: when the red text is a warning, it will be preceded with "Warning:"
    and R will try to explain why there is a warning. Generally your code will still
    work, but with some caveats. For example, you will see in [Chapter 2](https://example.com)
    a scatterplot based on a dataset where two rows of data has missing entries that
    would be needed to create points in the scatterplot, you will see this: *Warning:
    Removed 2 rows missing values (geom_point)*. R will still produce the scatterplot
    with all the remaining non-missing values, but it is warning that two of the points
    aren''t there.

    **Messages**: when the red text doesn''t start with "Error" or "Warning", it''s
    just a *friendly message*. You''ll see these messages when you load R packages
    in the upcoming [Subsection 1.3.2](https://example.com) or when you read data
    in spreadsheet files with the `read_csv()` function as you will see in [Chapter
    4](https://example.com). These are helpful diagnostic messages and they don''t
    stop your code from running. When you install packages too using `install.packages()`
    as discussed in [Subsection 1.3.1](https://example.com).


    Remember, when you see red text in the console, *don''t panic*. It doesn''t necessarily
    mean anything is wrong. Rather:


    +   - If the text starts with "Error", figure out what''s causing it. Think of
    errors as a red traffic light: something is wrong!

    - If the text starts with "Warning", figure out if it''s something to worry about.
    For instance, if you get a warning about missing values in a scatterplot and you
    know there are missing values, you''re fine. That''s surprising, look at your
    data and see what''s missing. Think of warnings as a yellow traffic light: everything
    is working fine, but watch out/pay attention.

    - Otherwise, the text is just a message. Read it, wave back at R, and thank it
    for talking to you. Think of messages as a green traffic light: everything is
    working and keep going!'
  merge: -1
  img_proc: true
- pgno: 41
  md: '# 1.3 What are R packages?


    # 1.2.3 Tips on learning to code


    Learning to code/program is quite similar to learning a foreign language. It can
    be daunting and frustrating at first. Such frustrations are common and it is normal
    to feel discouraged as you learn. However, just as with learning a foreign language,
    if you put in the effort and are not afraid to make mistakes, anybody can learn
    and improve.


    Here are a few useful tips to keep in mind as you learn to program:


    +   - Remember that computers are not actually smart: but really people spend
    a lot of time and energy designing them to appear "smart." In reality, you have
    to tell a computer everything it needs to do. Furthermore, the instructions you
    give your computer can''t make any mistakes in them, nor can they be ambiguous
    in any way.


    +   - Take the "copy, paste, and tweak" approach: Especially when you learn your
    first programming language or you need to understand particularly complicated
    code, it is often much easier to take existing code that you know and modify it
    to suit your ends. We call this the "copy, paste, and tweak" approach. It is as
    opposed to trying to out the code from scratch. Early on, we suggest not trying
    to write code from memory, but rather take existing examples we have provided
    you, then copy, paste, and tweak them to suit your goals. After you feel more
    confident, you can slowly move away from this approach and write code from scratch.
    Think of the "copy, paste, and tweak" approach as training wheels for a child
    learning to ride a bike. After getting comfortable, they won''t need them anymore.


    +   - The best way to learn to code is by doing: Rather than learning to code
    for its own sake, we find that learning to code goes much smoother when you have
    a goal in mind or when you are working on a particular project, like analyzing
    data that you are interested in and that is important to you.


    +   - Practice is key: Just as the only method to improve your foreign language
    skills is through lots of practice and speaking, the only method to improving
    your code is through lots of practice. Don''t worry, however, we''ll give you
    plenty of opportunities to do so!


    # 1.3 What are R packages?


    Another point of confusion with many new R users is the idea of an R package.
    packages extend the functionality of R by providing additional functions, data,
    and documentation. They are written by a worldwide community of R users and can
    be downloaded for free from the internet.


    For example, among the many packages we use in this book is the ggplot package
    (Wickham et al., 2024a) for data visualization in Chapter 2, the dplyr package'
