    \ that will contain the column names of the original data. Observe how we set\
    \ names_to = \"type\". In the resulting drinks_smaller_tidy, the column type contains\
    \ the three types of alcohol beer, spirit, and wine. Since type is a variable\
    \ that doesn't appear in drinks_smaller, we use quotation marks around it. You\
    \ will receive an error if you just use names_to = type here.\n2. values_to here\
    \ is the name of the variable in the new \"tidy\" data frame that will contain\
    \ the values of the original data. Observe how we set values_to = \"servings\"\
    \ each of the numeric values in each of the beer, wine, and spirit columns of\
    \ the drinks_smaller data corresponds to a value of servings. In the resulting\
    \ drinks_smaller_tidy, the column contains the 4 × 12 numerical values. Note again\
    \ that servings do not appear as a variable in drinks_smaller so it needs quotation\
    \ marks around it for the values_to argument.\n3. The third argument cols is the\
    \ columns in the drinks_smaller data frame we either want to or don't want to\
    \ \"tidy.\" Observe how we set this to -country indicating that we don't want\
