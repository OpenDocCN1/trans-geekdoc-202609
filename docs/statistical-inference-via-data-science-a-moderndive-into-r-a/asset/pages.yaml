  md: "# 10.2 Theory-based inference for simple linear regression\n\n# Learning check\n\
    \n(LC10.1) What does the error term $\\epsilon$ in the linear model $Y = \beta_0\
    \ + \beta_1 \\cdot X + \\epsilon$ represent?\n\n+   - A. The exact value of the\
    \ response variable.\n- B. The predicted value of the response variable based\
    \ on the model.\n- C. The part of the response variable not explained by the line.\n\
    - D. The slope of the linear relationship between $X$ and $Y$.\n\n(LC10.2) Which\
    \ of the following is a property of the least squares estimators $b_0$ and $b_1$?\n\
    \n+   - A. They are biased estimators of the population parameters $\\beta_0$\
    \ and $\\beta_1$.\n- B. They are linear combinations of the observed responses\
    \ $y_1, y_2, \\dots, y_n$.\n- C. They are always equal to the population parameters\
    \ $\\beta_0$ and $\\beta_1$.\n- D. They depend on the specific values of the explanatory\
    \ variable $X$.\n\n(LC10.3) How can the difference in means between two groups\
    \ be represented in a linear regression model?\n\n+   - A. By adding an interaction\
    \ term between the groups and the response variable.\n- B. By fitting separate\
    \ regression lines for each group and comparing their slopes.\n- C. By including\
    \ a dummy variable to represent the groups.\n- D. By subtracting the mean of one\
    \ group from the mean of the other and using this difference as the predictor.\n\
    \n# 10.2 Theory-based inference for simple linear regression\n\nThis section introduces\
    \ the conceptual framework needed for theory-based inference for regression (see\
    \ Subsections 10.2.1 and 10.2.2) and discusses the two prominent methods for inference:\
    \ confidence intervals (Subsection 10.2.3) and hypothesis tests (Subsection 10.2.4).\
    \ Some of this material is slightly more technical than other sections in this\
    \ chapter, but most of the material is illustrated by working with a real example\
    \ and interpretations and explanations complement the theory. Subsection 10.2.5\
    \ presents the R code needed to calculate relevant quantities for inference. Feel\
    \ free to read this section first."
