    \ they are visualizations of the distribution of the numerical variable in question.\n\
    \n# 2.6 Facets\n\nBefore continuing with the next of the 5NG, let’s briefly introduce\
    \ a new concept called faceting. Faceting is used when we’d like to split a particular\
    \ visualization by the values of another variable. This will create multiple copies\
    \ of the same type of plot with matching x and y axes, but whose content will\
    \ differ.\n\nFor example, suppose we were interested in looking at how the histogram\
    \ of wind speed records in the three NYC airports we saw in Figure 2.9 differed\
    \ in each month. We could “split” this histogram by the 12 months given in a year.\
    \ In other words, we would plot histograms of wind_speed for each month separately.\
    \ We do this by adding facet_wrap(~ month) layer. Note the ~ is a tilde—“1” key\
    \ on US keyboards. The tilde is required and you will receive the Error in as.quoted(facets)\
    \ : object ‘month’ not found if you don’t include it here.\n\n```\nggplot(data\
    \ = weather, mapping = aes(x = wind_speed) +\n  geom_histogram(binwidth = 5, color\
    \ = \"white\") +\n  facet_wrap(~ month)\n```"
