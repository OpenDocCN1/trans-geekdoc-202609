    Observe that p is the estimated expected value and SE_Xbar is the estimated standard
    error based on the simulation of taking sample proportions for random samples
    of size n = 100. Compare this value with the standard deviation for the entire
    bowl, discovered earlier. It is one-tenth the size! This is not a coincidence:
    the standard error of X is equal to the standard deviation of the population (the
    bowl) divided by the square root of the sample size. In the case of sample proportions,
    the standard error of X can also be determined using the formula:


    ```

    $SE(\bar{X}) = \sqrt{\frac{p(1-p)}{n}}$

    ```


    where p is the population proportion and n is the size of our sample. This formula
    shows that the standard error is inversely proportional to the square root of
    the sample size: as the sample size increases, the standard error decreases. In
    our example, the standard error is


    ```

    $SE(\bar{X}) = \sqrt{\frac{0.375 \cdot (1 - 0.375)}{100}} = 0.0484$

    ```


