  md: '# 8.1 Tying the sampling distribution estimation


    +   - A. Because the sample mean is always larger than the population mean.

    - B. Because the sample mean is a good estimator of the population mean due to
    its unbiasedness.

    - C. Because the sample mean requires less computational effort than the population
