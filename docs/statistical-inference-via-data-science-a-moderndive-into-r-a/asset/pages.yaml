  md: "# 10.2 Theory-based inference for simple linear regression\n\ntest statistic\
    \ $t$ no longer normal. Instead, it follows a $t$-distribution with $n-2$ degrees\
    \ of freedom. The loss of two degrees of freedom relates to the fact that we are\
    \ trying to estimate two parameters in the linear model: $\beta_0$ and $\beta_1$.\
    \ We are ready to use this information to perform inference for the least-squares\
    \ estimators, $b_0$ and $b_1$.\n\n# 10.2.3 Confidence intervals for the least-squares\
    \ estimators\n\nA 95% confidence interval for $\beta_1$ can be thought of as a\
    \ range of plausible values for the population slope $\beta_1$ of the linear relationship\
    \ between duration and waiting times. In general, if the sampling distribution\
    \ of an estimator is normal or approximately normal, the confidence interval for\
    \ the relevant parameter is\n\npoint estimate $\\pm$ margin of error = point estimate\
    \ $\\pm$ (critical value·standard error).\n\nThe formula for a 95% confidence\
    \ interval for $\beta_1$ is given by $b_1 \\pm q \\cdot SE(b_1)$ where the critical\
    \ value $q$ is determined by the level of confidence required, the sample size\
    \ used, and the corresponding degrees of freedom needed for the $t$-distribution.\
    \ We illustrate how to find the 95% confidence interval for the slope in the Old\
    \ Faithful example manually, but we show later how to do this directly in R using\
    \ the function $get\\_regression\\_table$. First, observe that $n=114$, so the\
    \ degrees of freedom are $n-2=112$. The critical value for a 95% confidence interval\
    \ on a $t$-distribution with 112 degrees of freedom is $q=1.981$. The estimates\
    \ $b_0$, $b_1$, and $s$ were found earlier and shown here again:\n\n# TABLE 10.5:\
    \ Old Faithful linear regression coefficients\n\n| Coefficients | Values |\n|---|---|\n\
    | (Intercept) b0 | 79.459 |\n| duration b1 | 0.371 |\n| s | 20.370 |\n\nThird,\
    \ the standard error for $b_1$ using the formula presented here is:\n\n```\n$SE(b_1)\
    \ = \\frac{s}{\\sqrt{\\sum_{i=1}^{n}(x_i-\\\bar{x})^2}} = \\frac{20.37}{627.583}\
    \ = 0.032$.\n```\n\nFinally, the 95% confidence interval for $\beta_1$ is given\
    \ by:\n\n```\n$b_1 \\pm q \\cdot SE(b_1)\\n$= 0.371 \\pm 1.981 \\cdot 0.032$\\\
    n$= (0.308, 0.434)$\n```\n\nWe are 95% confident that the population slope $\b\
    eta_1$ is a number between 0.308 and 0.434."
