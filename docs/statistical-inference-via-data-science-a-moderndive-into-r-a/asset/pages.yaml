    # 9.2 Music popularity activity


    Let''s start with an activity studying the effect of music genre on Spotify song
    popularity.


    # 9.2.1 Is metal music more popular than deep house music?


    Imagine you are a music analyst for Spotify, and you are curious whether fans
    of metal or deep house are more passionate about their favorite genres. You want
    to determine if there''s a significant difference in the popularity of these two
    genres. Popularity, in this case, is measured by Spotify, say, the average number
    of streams and recent user interactions on tracks classified under each genre.(Note
    that Spotify does not actually disclose how this metric is calculated, so we have
    to take our best guess.) This question sets the stage for our exploration into
    hypothesis testing.


    Metal music, characterized by its aggressive sounds, powerful vocals, and complex
    instruments, has cultivated a loyal fanbase that often prides itself on its deep
    appreciation for the genre''s intensity and technical skill. On the other hand,
    deep house music, with its smooth, soulful rhythms and steady beats, attracts
    listeners who enjoy the genre''s calming and immersive vibe, often associated
    with late-night clubs and chill-out sessions.


    By comparing the popularity metrics between these two genres, we can determine
    if truly resonates with listeners on Spotify. This exploration not only deepens
    our understanding of musical preferences but also serves as a practical introduction
    to the principles of hypothesis testing.


    To begin the analysis


    The modernrive package contains the data on the songs by genre in the spotify_by_genre
    data frame. There are six genres selected in that data (country, deep-house, dubstep,
    hip-hop, metal, and rock). You will have the opportunity to explore relationships
    with'
