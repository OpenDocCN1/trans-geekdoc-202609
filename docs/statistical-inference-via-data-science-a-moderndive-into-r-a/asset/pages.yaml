  md: '# 274 8 Estimation, Confidence Intervals, and Bootstrapping


    After we specify() the variables of interest, we put the results into the generate()
    function to generate replicates. This is the function that produces the bootstrap
    samples or performs the bootstrap resampling process a large number of times,
    based on the variable(s) specified previously, as shown in Figure 8.16. Recall
    we did this 1000 times.


    The generate() function''s first argument is reps, which sets the number of replicates
    we would like to generate. Since we want to resample the 100 almonds in almonds_sample_100
    with replacement 1000 times, we set reps = 1000.


    The second argument determines the type of computer simulation. Setting this to
    type = "bootstrap" produces bootstrap samples using resampling with replacement.
    We present different options for type in Chapter 9.


    ```

    almonds_sample_100 |>

    specific(response = weight) |

    generate(reps = 1000, type = "bootstrap")

