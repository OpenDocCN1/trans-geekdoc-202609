    grams and $\sigma = 0.32$, so the standard error for the sampling distribution
    is


    $SE(\bar{x}) = \frac{\sigma}{\sqrt{100}} = \frac{0.392}{\sqrt{100}} = 0.039$


    grams. In Figure 8.5 we plot the density curve for this distribution using these
