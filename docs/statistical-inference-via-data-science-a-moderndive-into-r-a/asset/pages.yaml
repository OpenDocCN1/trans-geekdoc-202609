  md: '# 2 Getting Started with Data in R


    More precisely, R is a programming language that runs computations, while RStudio
    is an integrated development environment (IDE) that provides an interface by adding
    many convenient features and tools. So just as the way of having access to a speedometer,
    rear-view mirrors, and a navigation system makes driving much easier, using RStudio''s
    interface makes R much easier as well.


    # 1.1.1 Installing R and RStudio


