    # 3.3 summarize variables


    The next common task when working with data frames is to compute summary statistics
    are single numerical values that summarize a large number of values. Commonly
    known examples of summary statistics include the mean (also called the average)
    and the median (the middle value). Other examples of summary statistics that might
    not immediately come to mind include the sum, the smallest value also called the
    minimum, the largest value also called the maximum and the standard deviation.


    Let''s calculate two summary statistics of the wind_speed temperature variable
    in the weather data frame: the mean and standard deviation (recall from Section
    1.4 that the weather data frame is included in the nycflights23 package). To compute
    these summary statistics, we need the mean() and sd() summary functions in R.
    Summary functions in R take many values and return a single value, as illustrated
    in Figure 3.2.


    ![](img/445742518041017e8f01f11b0c3190d9_101_0.png)


    FIGURE 3.2: Diagram illustrating a summary function in R.'
