    \ As it happened with the sampling distribution of the sample proportion, the\
    \ measures of center and dispersion of these distributions are directly related\
    \ to the parameters of the population: the population mean, $\\mu$, and the population\
    \ standard deviation, $\\sigma$. We print these parameters one more time here:\n\
    \n```\nalmonds_bowl |>\nsummarize(mu = mean(weight), sigma = sd(weight))\n```\n\
    \n```\n# A tibble: 1 x 2\nmu sigma\n<dbl>\n1 3.64 0.392\n```\n\nAnd we do the\
    \ same for our simulations next. Recall that the expected value of $\bar{X}$ is\
    \ the value we want to observe, on average, when we take many sample means from\
    \ random samples of a given size. It is located at the center of the distribution\
    \ of $\bar{X}$. Similarly, the standard error of $\bar{X}$ is the measure or magnitude\
    \ of sampling variation. It is the standard deviation of the sample means calculated\
    \ from all possible random samples of a given size. Using the data wrangling code\
    \ `mean()` and `sd()` functions inside `summarize()` and applied to our simulation,\
    \ we can estimate the expected value and standard error of $\bar{X}$. Three sets\
    \ of values are found, for each of the corresponding sample sizes and presented\
    \ in Table 7.1."
