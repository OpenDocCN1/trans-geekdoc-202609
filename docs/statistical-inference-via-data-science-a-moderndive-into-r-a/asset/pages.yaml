  md: '# (LC10.20) Why do the least-squares estimates of coefficients change when
    different sets of regressors are used in multiple linear regression?


    +   - A. Because the coefficients are recalculated each time, irrespective of
    the regressors.

    - B. Because the residuals are always zero when regressors are changed.

    - C. Because the value of each coefficient depends on the specific combination
    of regressors included in the model.

    - D. Because all models with different regressors will produce identical estimates.


    # (LC10.21) How is a 95% confidence interval for a coefficient in multiple linear
    regression constructed?


    +   - A. By using the point estimate, the critical value from the t-distribution,
    and the standard error of the coefficient.

    - B. By taking the standard deviation of the coefficients only.

    - C. By resampling the data without replacement.

    - D. By calculating the mean of all the coefficients.


    # (LC10.22) What does the ANOVA test for comparing two models in multiple linear
    regression evaluate?


    +   - A. Whether all regressors in both models have the same coefficients.

    - B. Whether the reduced model is adequate or if the full model is needed.

    - C. Whether the residuals of the two models follow a normal distribution.

    - D. Whether the regression coefficients of one model are unbiased estimators.


