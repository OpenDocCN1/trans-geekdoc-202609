  md: "# 5.1 One numerical explanatory variable\n\nBefore we introduce the model needed\
    \ for simple linear regression, we present an example. Why do some countries exhibit\
    \ high fertility rates while others have significantly lower ones? Are there correlations\
    \ between fertility rates and life expectancy across different continents and\
    \ nations? Could underlying socioeconomic factors be influencing these trends?\n\
    \nThese are all questions that are of interest to demographers and policy makers,\
    \ as understanding fertility rates is important for planning and development.\
    \ By analyzing the dataset of UN member states, which includes variables such\
    \ as country codes (ISO), fertility rates, and life expectancy for 2022, researchers\
    \ can uncover patterns and make predictions about fertility rates based on life\
    \ expectancy.\n\nIn this section, we will explain differences in fertility rates\
    \ as a function of one numerical variable: life expectancy. Could it be that countries\
    \ with higher life expectancy have lower fertility rates? Could it be that countries\
    \ with higher life expectancy tend to have higher fertility rates? Or could it\
    \ be that is no relationship between life expectancy and fertility rates? We answer\
    \ these questions by modeling the relationship between fertility rates and life\
    \ expectancy using simple linear regression, where we have:\n\n+   1. A numerical\
    \ outcome variable y (the country's fertility rate) and\n2. A single numerical\
    \ explanatory variable x (the country's life expectancy).\n\n# 5.1.1 Exploratory\
    \ data analysis\n\nThe data on the 193 current UN member states (as of 2024) can\
    \ be found in the un_member_states_2024 data frame included in the moderndify\
    \ package. However, to keep things simple we include those rows that don't missing\
    \ data with na.omit() and select() only the subset of the variables we'll consider\
    \ in this chapter, and save this data in a new data frame called UN_data_ch5:\n\
    \n```\nUN_data_ch5 <- un_member_states_2024 |>\nselect(iso,\n  life_exp = life_expectancy_2022,\n\
    \  fert_rate = fertility_rate_2022,\n  obes_rate = obesity_rate_2016)|>\n  na.omit()\n\
    ```\n\nA crucial step before doing any kind of analysis or modeling is performing\
    \ an exploratory data analysis, or EDA for short. EDA gives you a sense of the\
    \ distributions"
  merge: -1
  img_proc: true
