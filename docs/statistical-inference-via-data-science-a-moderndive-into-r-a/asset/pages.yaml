    # ANOVA


    ANOVA, or analysis of variance, is a statistical technique used to compare the
    means of three or more groups by seeing if there is a statistically significant
    difference between multiple groups. ANOVA can be represented in the regression
    framework by dummy variables to represent the genres. Lets say we wanted to compare
