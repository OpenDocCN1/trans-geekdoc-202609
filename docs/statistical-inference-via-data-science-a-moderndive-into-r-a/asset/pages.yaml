    # Understanding the width of a confidence interval


    A confidence interval is an estimator of a population parameter. In the case of
    the almonds'' bowl we constructed a confidence interval for the population mean.
    The equation to construct a 95% confidence interval was


    $$\bar{x} - 1.96\frac{\sigma}{\sqrt{n}}, \bar{x} + 1.96\frac{\sigma}{\sqrt{n}}$


    Observe that the confidence interval is centered at the sample mean and extends
    to each side 1.96 standard errors $1.96 \cdot \sigma/\sqrt{n}$. This quantity
    is exactly half the width of your confidence interval, and it is called the **margin
    of error**. The value of the population standard deviation, $\sigma$, is beyond
    our control, as is determined by the distribution of the experiment or phenomenon.
    The sample mean, $\bar{x}$, is a result that depends on your random sample exclusively.
    On the other hand, the 1.96 and the sample size, $n$, are values that can be changed
    by the researcher or practitioner. They play an important role on the width of
    the confidence interval. We study each of them separately.


    # The confidence level


    We mentioned earlier that the 1.96 relates to a 95% confidence process but we
    did not show how to determine this value. The level of confidence is a decision
    of the practitioner. If you want to be more confident, 98% or 99% confident, you
    just need to adjust the appropriate number of standard errors needed. We show
    this using Figure 8.9 to illustrate this process.


    +   - If the confidence level is 0.95 (or 95%), in the middle of the standard
    normal distribution is 0.95. This area is shaded in Figure 8.9.

    - We construct $\alpha = 1 - confidence level = 1 - 0.95 = 0.05$. Think of $\alpha$
    as the total area on both tails.

    - Since the normal distribution is symmetric, the area on each tail is $\alpha/2
    = 0.05/2 = 0.025$.

    - We need the exact number of standard deviations that produces the shaded area.
    Since the center of the normal density curve is zero, as shown in Figure 8.9,
    and the normal curve is symmetric, the number of standard deviations can'
