  md: "# 5.2 One categorical variable\n\nRecall that an alternative method to visualize\
    \ the distribution of a numerical split by a categorical variable is by using\
    \ a side-by-side boxplot. We map the categorical variable continent to the x-axis\
    \ and the life expectancies within each continent on the y-axis in Figure 5.8.\n\
    \n```\nggplot(gapminder2022, aes(x = continent, y = life_exp)) +\ngeom_boxplot(x)\
    \ + \nlabs(x = \"Continent\",\n  y = \"Life expectancy\",\n  title = \"Life expectancy\
