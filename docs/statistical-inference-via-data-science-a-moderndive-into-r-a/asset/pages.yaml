- pgno: 271
  md: '# Estimation, Confidence Intervals, and Bootstrapping


    We studied sampling in Chapter 7. Recall, for example, getting many random samples
    of red and white balls from a bowl, finding the sample proportions of red balls
    from each of those samples, and studying the distribution of the sample proportions.
    We can summarize our findings as follows:


    +   - the sampling distribution of the sample proportion follows, approximately,
    the normal distribution;

    - the expected value of the sample proportion, located at the center of the distribution,
    and

    - the sampling variation, measured by the standard error of the sample proportion,
    is equal to the standard deviation of the population divided by the square root
    of the sample size used to collect the samples.


    Similarly, when sampling chocolate-covered almonds and getting the sample mean
    weight from each sample, the characteristics described above are also encountered
    in the sampling distribution of the sample mean; namely,


    +   - the sampling distribution of the sample mean follows, approximately, the
    normal distribution;

    - the expected value of the sample mean is the population mean, and

    - the standard error of the sample mean is the standard deviation of the population
    divided by the square root of the sample size.


    Moreover, these characteristics also apply to sampling distributions for the difference
    in sample means, the difference of sample proportions, and others. Recall that
    the sampling distribution is not restricted by the distribution of the population.
    As long as the samples taken are fairly large and we use the appropriate standard
    error, we can generalize these results appropriately.


    The study of sampling distribution is motivated by another question we have not
    yet answered: how can we determine the average weight of all the almonds if we
    do not have access to the entire bowl? We have seen by using simulations in Chapter
    7 that the average of the sample means, derived from many random samples, will
    be close to the expected value of the sample mean, which is precisely the population
    mean.


    DOI: 10.1201/97810322724546-8'
  merge: -1
  img_proc: true
- pgno: 272
  md: '# 8 Estimation, Confidence Intervals, and Bootstrapping


    However, in real-situations, we do not have access to random samples, only to
    a single random sample. This chapter introduces methods and techniques that can
    help us approximate the information of the entire population, such as the mean
    weight, by using a single random sample from this population. This undertaking
    is called **estimation**, and it is central to Statistics and Data Science.


    We introduce statistical jargon about estimation. If we are using a sample statistic
    to **estimate** a population parameter, e.g., using the sample from a random sample
    to estimate the population mean, we call this statistic a **point estimate** to
    emphasize that it is a single value that is used to estimate the parameter of
    interest. Now, you may recall that, due to sampling variation, the sample mean
    typically not match the population mean exactly, even if the sample is large.
    To account for this variation, we use an interval to estimate the parameter instead
    of a single value, and appropriately call it an **interval estimate** or, if some
    level of accuracy, a **confidence interval** of the population parameter. In this
    chapter, we explain how to find confidence intervals, the advantages of using
    them, and the different methods that can be used to determine them.


    In Section 8.1 we introduce a method to build a confidence interval for the population
    that uses the random sample taken and theoretical characteristics of the sampling
    distribution discussed in Chapter 7. We call this theory-based approach for constructing
    intervals. In Section 8.2 we introduce another method, called the bootstrap, that
    produces confidence intervals by resampling a large number of times from the original
    sample. Since resampling is done via simulations, the simulation-based approach
    for constructing confidence intervals. Finally, in Section 8.5 we summarize and
    present extensions of these methods.


    # Needed packages


    If needed, read Section 1.3 for information on how to install and load R packages.


    ```

    library(tidyverse)

    library(modndrive)

    library(infer)

    ```


    Recall that loading the tidyverse package loads many packages that we have encountered
    earlier. For details refer to Section 4.4. The packages modndrive and infer contain
    functions and data frames that will be used in this chapter.'
  merge: -1
  img_proc: true
- pgno: 273
  md: "8.1 Tying the sampling distribution to estimation\n\n# 8.1 Tying the sampling\
    \ distribution to estimation\n\nIn this section we revisit the chocolate-covered\
    \ almonds example introduced in Chapter 7 and the results from the sampling distribution\
    \ of the sample mean weight of almonds, but by this time we use this information\
    \ in the context of estimation.\n\nWe start by introducing or reviewing some terminology\
    \ using the almonds example. The bowl of chocolate-covered almonds is the population\
    \ of interest. The parameter of interest is the population mean weight of almonds\
    \ in the bowl, $\\mu$. This is the quantity we want to estimate.\n\nWe want to\
    \ use the sample mean to estimate this parameter. So we call the sample mean an\
    \ estimator or an estimate of $\\mu$, the population mean weight. The difference\
    \ between estimator and estimate is worth discussing.\n\nAs an illustration, we\
    \ decide to take a random sample of 100 almonds from the bowl and use its sample\
    \ mean to estimate the population mean weight. In other words, we intend to sum\
    \ 100 almonds' weights, divide this sum by 100, and use this value to estimate\
    \ the population mean weight. When we refer to the sample mean we call an estimator\
    \ of the population mean weight. Since different samples produce different sample\
    \ means, the sample mean as an estimator is the random variable $\bar{X}$ described\
    \ in Section 7.4.5. As we have learned the sampling distribution in Chapter 7,\
    \ we know that this estimator follows, approximately, a normal distribution; its\
    \ expected value is equal to the population mean weight. Its standard deviation,\
    \ also called standard error, is\n\n> $SE(\\bar{x}) = \\frac{\\sigma}{\\sqrt{n}}$$\n\
    \n$n = 100$ in this example and $\\sigma$ is the population standard deviation\
    \ of almonds' weights.\n\nWe took a random sample of 100 almonds' weights such\
    \ as the one shown here and stored it in the modernrive package with the same\
    \ name:\n\n```\nalmonds_sample_100\n```\n\n```\n# A tibble: 100 x 3\n# Groups:\
    \ replicate [1]\nreplicate ID weight\n<int> <int> <dbl>\n1 1 166 4.2\n2 1 1215\
    \ 4.2\n```"
  merge: -1
  img_proc: true
