    rate = b_0 + b_{life\\expectancy} \\cdot life\\expectancy\\n=12.599 + (-0.137)\
    \ \\cdot life\\expectancy$$\n\nThe intercept $b_0 = 12.599$ is the average fertility\
    \ rate $\\hat{y} = fertility\\_rate$ for countries that have a $life\\_exp$ of\
    \ 0. In graphical terms, where the line intersects the $y$ axis for $x = 0$. However,\
    \ that while the intercept of the regression line has a $life\\_exp$ of 0 is impossible.\
    \ Furthermore, looking at the scatterplot with the regression line in Figure 5.3,\
    \ no countries have a life expectancy anywhere near 0.\n\nOf interest is the slope\
    \ $b_1 = b_{life\\_expectancy}$ for $life\\_exp$ of -0.137. This measures the\
    \ relationship between the fertility rate and life expectancy variables. Note\
    \ that the sign is negative, suggesting a negative relationship between these\
    \ two variables. This means countries with higher life expectancies tend to have\
    \ lower fertility rates. Recall from earlier that the correlation coefficient\
    \ is -0.812. They both have the same negative sign, but a different value. Recall\
    \ further that the correlation's interpretation is the \"strength of linear association.\"\
    \ The slope's interpretation is a little different:\n\nFor every increase of 1\
