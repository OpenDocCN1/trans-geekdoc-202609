  md: "# 9.3 Understanding hypothesis tests\n\ndifferent songs, but the same ideas\
    \ can be applied to each of the 2000 tracks in spotify_metal_deephouse data. We\
    \ can think of this data about an inference about an unknown difference in population\
    \ proportions with the 2000 tracks being our sample. We denote this as $p_m -\
    \ p_d$, where $p_m$ is the population proportion of songs with metal names being\
    \ popular and $p_d$ is the equivalent for deep house songs. Recall that this is\
    \ one of the scenarios for inference we have seen so far in Table 9.5.\n\n# TABLE\
    \ 9.5: Scenarios of sampling for inference\n\n| Scenario | Population parameter\
    \ | Notation | Point estimate | Symbol(s) |\n|---|---|---|---||\n| 1 | Population\
    \ proportion | $p$ | Sample proportion | $\\hat{p}$ |\n| 2 | Population mean |\
    \ $\\mu$ | Sample mean | $\bar{X}$ or $\\hat{\\mu}$ |\n| 3 | Difference in population\
    \ proportions | $p_1 - p_2$ | Difference in sample proportions | $\\hat{p}_1 -\
    \ \\hat{p}_2$ |\n\nSo, based on our sample of $n_m = 1000$ metal tracks and $n_f\
    \ = 1000$ deep house tracks, the point estimate for $p_m - p_d$ is the *difference\
    \ in sample proportions*\n\n> $\\hat{p}_m - \\hat{p}_f = 0.563 - 0.529 = 0.034\
    \ = 3.4\\%$.\n\nThis difference in favor of metal songs of 0.034 is greater than\
    \ 0, suggesting metal songs are more popular than deep house songs.\n\nHowever,\
    \ the question we ask ourselves “is this difference meaningfully greater than\
    \ 0?”, or can we just attribute it to *sampling variation*? In other words, is\
    \ that difference indicative of true population, or can we just to make such distinctions.\n\
    \n# 9.3 Understanding hypothesis tests\n\nMuch like the terminology, notation,\
    \ and definitions relating to sampling you saw in Section 7.2, there are a lot\
    \ of terminology, notation, and definitions related to hypothesis testing as well.\
    \ Some of this was introduced in Section 9.1. Learning this may seem like a very\
    \ daunting task at first. However, with practice, practice, and more practice,\
    \ anyone can master them."
