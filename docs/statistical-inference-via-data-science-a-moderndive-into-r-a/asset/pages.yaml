- pgno: 401
  md: "# 10.2 Theory-based inference for simple linear regression\n\nThe population\
    \ parameters $\beta_0$ and $\beta_1$ are constants. Similarly, the duration of\
    \ the $i$th eruption, $x_i$, is known and also constant. Therefore, the expression\
    \ $\beta_0 + \beta_1 \\cdot x_i$ is a constant. By contrast, $\\epsilon_i$ is\
    \ a normally distributed random variable.\n\nThe response $y_i$ (the waiting time\
    \ for the $i$th eruption to the next) is sum of the constant $\beta_0 + \beta_1\
    \ \\cdot x_i$ and the normally distributed random variable $\\epsilon_i$. Based\
    \ on properties of random variables and the normal distribution, we can state\
    \ that $y_i$ is also a normal distribution random variable with mean equal to\
    \ $\beta_0 + \beta_1 \\cdot x_i$ and standard deviation equal to $\\sigma:\n\n\
    $y_i \\sim Normal(\\beta_0 + \\beta_1 x_i, \\sigma)$\n\nfor $i = 1, \\dots, n$.\
    \ Since $\\epsilon_i$ and $\\epsilon_j$ are independent, $y_i$ and $y_j$ are also\
    \ independent for any $i \\neq j$.\n\nIn addition, to Subsection 10.1.5, the least-squares\
    \ estimator $b_1$ is a linear combination of the random variables $y_1, \\dots,\
    \ y_n$. So $b_1$ is also a random variable! What does this mean? The coefficient\
    \ for the slope from a *particular sample* of $n$ pairs of duration and waiting\
    \ times. If we collected a different sample of $n$ pairs, the coefficient for\
    \ the slope would be different due to *sampling variation*.\n\nSay we hypothetically\
    \ collect many random samples of duration and waiting times, and using the least-squares\
    \ method compute the slope $b_1$ for each of these samples. These slopes would\
    \ form the sampling distribution of $b_1$, which we discussed in Subsection 7.3.4\
    \ in the context of sample proportions. What would we learn is that, because $y_1,\
    \ \\dots, y_n$ are normally distributed, $b_1$ is also normally distributed linear\
    \ combination of random variables. After some calculations that go beyond the\
    \ scope of this book take into account properties of the expected value and standard\
    \ deviation of the responses $y_1, \\dots, y_n$, it can be shown that:\n\n$b_1\
    \ \\sim Normal(\\beta_1, \\frac{\\sigma}{\\sqrt{\\sum_{i=1}^n(x_i - \\bar{x})^2}})$\n\
    \nThat is, $b_1$ is normally distributed with expected value $\beta_1$ and standard\
    \ deviation equal to the expression above (inside the parentheses and after the\
    \ comma). Similarly, $b_0$ is a linear combination of $y_1, \\dots, y_n$ and using\
    \ properties of the expected value and standard deviation of the responses, we\
    \ get:\n\n$b_0 \\sim Normal(\\beta_0, \\sigma \\sqrt{\\frac{\\bar{x}^2}{\\sum_{i=1}^n(x_i\
    \ - \\bar{x})^2}})$"
  merge: -1
