- pgno: 381
  md: "# 9.7 Summary and final remarks\n\nInstead, we use the function t_test() from\
    \ the package infer with the appropriate formula and order, as we did for the\
    \ simulation-based approach.\n\nThe results are shown below:\n\n```\nmovies_sample\
    \ |>\nt_test(formula = rating ~ genre,\n  order = c(\"Action\", \"Romance\"),\n\
    \  alternative = \"two-sided\")\n```\n\nA tibble: 1 x 7\n\n| statistic | t_df\
    \ | p_value | alternative | lower_ci | upper_ci |\n|---|---|---|---|---|--|\n\
    | -2.09856 | 65.84931 | 0.00498319 | two-sided | -1.04722 | -1.76677 -0.326711\
    \ |\n\nBased on the p-value = 0.005 we reject the null hypothesis, the average\
    \ rating for the Romance movies is not the same as the average rating for action\
    \ movies. The result is similar to the one calculated using the simulation-based\
    \ approach.\n\nTo be able to use the Welch's t-test, there are some conditions\
    \ that are necessary that the underlying mathematical theory holds:\n\n+   1.\
    \ The populations should be close to normal or the samples should be large. Many\
    \ textbooks suggest the sample sizes to be greater than 30, but there is no clear\
    \ mathematical foundation for this rule of thumb. In general, as long as the distribution\
    \ of the samples appear to be close to symmetric, the Welch's t-test may provide\
    \ useful results.\n2. The samples should be random samples.\n3. The sample of\
    \ one population should be independent from the sample of the other population.\n\
    \nLet's see if these conditions hold for our movies_sample_data:\n\n+   1. This\
    \ is met since n_a = 32 and n_r = 36 do not seem to be highly skewed and therefore\
    \ are somewhat symmetric.\n2. This is met we sampled the action and romance movies\
    \ at random and in an unbiased fashion from the database of all IMDb movies.\n\
    3. Unfortunately, we do not know how IMDb computes the ratings. For example, if\
    \ the same person can rate multiple movies, then those observations may be related.\
    \ This does not appear to a major problem in this context though.\n\nAssuming\
    \ all three conditions are not clearly broken, we can be reasonably certain that\
    \ the theory-based t-test results are valid."
  merge: -1
  img_proc: true
- pgno: 382
  md: "348 9 Hypothesis Testing\n\n# 9.7.2 When inference is not needed\n\nWe have\
    \ walked through several different examples of how to use the inference package\
    \ to perform statistical inference: constructing confidence intervals and conducting\
    \ hypothesis tests. For each of these examples, we make it point to always perform\
    \ an exploratory data analysis (EDA); specifically, by looking at the raw data\
    \ values, by data visualization with ggplot2, and by data wrangling with dplyr.\
    \ We highly encourage you to do the same. As a beginner to statistics, EDA helps\
    \ you develop intuition as to what statistical methods like confidence intervals\
    \ and hypothesis tests can tell you. Even as a seasoned practitioner of statistics,\
    \ EDA helps guide your statistical investigations. In particular, is inference\
    \ even needed?\n\nLet's consider an example. We are interested in the following\
    \ question: Of all flights leaving a New York City airport, are Hawaiian Airlines\
    \ flights in the air longer than Alaska Airlines flights? Furthermore, let's assume\
    \ that 2023 flights are a representative sample of all such flights. Then we can\
    \ use the flights frame in the nycflights23 package we introduced in Section 1.4\
    \ to answer our question. Let's filter this data to include Hawaiian and Alaska\
    \ Airlines using their carrier codes HA and AS:\n\n```\nflights_sample <- flights\
    \ |>\nfilter(carrier %in% c(\"HA\", \"AS\"))\n```\n\nThere are two possible statistical\
    \ methods we could use to answer such questions. First, we could construct a 95%\
    \ confidence interval for the difference in population means $\\mu_{HA} - \\mu_{AS}$,\
    \ where $\\mu_{HA}$ is the mean air time of all Hawaiian Airlines flights and\
    \ $\\mu_{AS}$ is the mean air time of all Alaska Airlines flights. We could then\
    \ check if the entirety of the interval is greater than 0, suggesting that $\\\
    mu_{HA} - \\mu_{AS} > 0$, or in other words suggesting that $\\mu_{HA} > \\mu_{AS}$.\
    \ Second, we perform a hypothesis test of the null hypothesis $H_0 : \\mu_{HA}\
    \ - \\mu_{AS} = 0$ versus the alternative hypothesis $H_A : \\mu_{HA} - \\mu_{AS}\
    \ > 0$.\n\nHowever, let's first construct an exploratory visualization as we suggested\
    \ earlier. Since air_time is numerical and carrier is categorical, a boxplot can\
    \ display the relationship between these two variables, which we display in Figure\
    \ 9.16.\n\n```\nggplot(data = flights_sample, mapping = aes(x = carrier, y = air_time))\
    \ +\ngeom_boxplot() + \nlabs(x = \"Carrier\", y = \"Air Time\")\n```"
  merge: -1
  img_proc: true
