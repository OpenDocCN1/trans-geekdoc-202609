- pgno: 408
  md: '# 10.2.6 Model fit and model assumptions


    We have introduced the linear model along assumptions about many of its elements
    and assumed all along that this is an appropriate representation of the relationship
    between the response and the explanatory variable. In real-life applications,
    it is uncertain whether the relationship is appropriately described by the linear
    model or whether all the assumptions we have introduced are satisfied.


    Of course, we do not expect the linear model described in this chapter, or any
    other model, to be a perfect representation of a phenomenon presented in nature.
    Models are simplifications of reality that do not intend to represent exactly
    the relationship in question but rather provide useful approximations that improve
    our understanding of this relationship. Even more, we want models that are as
    simple as possible and still capture relevant features of the natural phenomenon
    we are studying. This approach is known as the *principle of parsimony* or *Occam’s
    razor*.


    But even with a simple model like a linear one, we still want to know if it accurately
    represents the relationship in the data. This is called *model fit*. In addition,
    we want to determine whether not the model assumptions have been met.


    There are four elements in the linear model we want to check. An acrostic is a
    composition in which certain letters from each piece form a word or words. To
    help you remember the four elements, we can use the following acrostic:


    +   - Linearity of relationship between variables

    * The relationship between $y_i$ and $x_i$ truly linear for any $i = 1, \dots,
    n$?nIn other words, the linear model is $y_i = \beta_0 + \beta_1 \cdot x_i + \epsilon_i$
    a good fit?

    - Independence of each of the response values $y_i

    * Are $y_i$ and $y_j$ independent for any $i \neq j$?

    - Normality of the error terms

    * The distribution of the error terms at at least approximately normal?

    - Equality or variance of the value $y_i$ (and for the error term $\epsilon_i$)

    * The variance, or equivalently standard deviation, of the response $y_i$ always
    the same, regardless of the fitted value $(\hat{y}_i)$ or the regressor value
    $(x_i)$?


    In this case, our acrostic follows the word **LINE**. This can serve as a nice
    reminder of what to check when using linear regression. To check for *Linearity*,
    *Normality*, and *Equal* constant variance, we use the residuals of the linear
    regression via *residual diagnostics* as we explain in the next subsection. To
    check for Independence we can use the residuals if the data was collected using
    a time sequence or other type of sequences. Otherwise, independence may be achieved
    by taking a random sample, which eliminates a sequential type of dependency.'
  merge: -1
  img_proc: true
- pgno: 409
  md: '# 10.2 Theory-based inference for simple linear regression


    We start reviewing how residuals are calculated, introduce residual diagnostics
    via visualizations, use the example of the Old Faithful geyser eruptions to determine
    whether each of the four elements are met, and discuss the implications.


    # Residuals


    Recall that given a random sample of n pairs $(x_1, y_1), \dots, (x_n, y_n)$ the
    linear regression was given by:


    $$\hat{y}_i = b_0 + b_1 \cdot x_i$$


    for all the observations $i = 1, dots, n$. Recall that the residual as defined
    in Subsection 5.1.3, is the observed response minus the fitted value. If we denote
    the residuals with the letter $e$ we get:


    $$$e_i = y_i - \hat{y}_i$$


    for $i = 1, \dots, n$. Combining these two formulas we get


    $$$y_i = \hat{y}_i + e_i = b_0 + b_1 \cdot x_i + e_i$$


    the resulting formula looks very similar to our linear model:


    $$$y_i = \beta_0 + \beta_1 \cdot x_i + e_i$$


    In this context, residuals can be thought of as rough estimates of the error terms.
    Since many of the assumptions of the linear model are related to the error terms,
    we can check these assumptions by studying the residuals.


    In Figure 10.5, we illustrate one particular residual for the Old Faithful geyser
    eruption where duration time is the explanatory variable and waiting time is the
    response. We use an arrow to connect the observed waiting time (a circle) with
    the fitted waiting time (a square). The vertical distance between these two points
    (or equivalently, the magnitude of the arrow) is the value of the residual for
    this observation.


    # Relationship of duration and waiting times


    ![](img/445742518041017e8f01f11b0c3190d9_409_0.png)


    **FIGURE 10.5:** Example of observed value, fitted value, and residual.'
  merge: -1
  img_proc: true
