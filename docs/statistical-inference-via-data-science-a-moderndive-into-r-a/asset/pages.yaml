  md: '# Relationship of life expectancy and fertility rate


    ![](img/445742518041017e8f01f11b0c3190d9_158_0.png)


    **FIGURE 5.3:** Scatterplot of life expectancy and fertility rate with regression
    line.


    The line in the resulting Figure 5.3 is called a “regression line.” The regression
    line is a visual summary of the relationship between two numerical variables,
    in our case the outcome variable *fert_rate* and the explanatory variable *life_exp*.
    The negative slope of the blue line is consistent with our early observed correlation
    coefficient of -0.812 suggesting that there is a negative relationship between
    these two variables: as a country’s population has higher life expectancy it tends
    to have a lower fertility rate. We’ll see later, however, while the correlation
    coefficient and the slope of a regression line always have the same sign (positive
    or negative), they typically do not have the same value.


    Furthermore, a regression line is “best-fitting” in that it minimizes some mathematical
    criteria. We present these mathematical criteria in Subsection 5.3.2, but we suggest
    you read this subsection only after first reading the rest of this section on
    regression with one numerical explanatory variable.


