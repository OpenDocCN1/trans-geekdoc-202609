    visual-ization purposes to producing a plot of residuals ($e_i$) against the fitted
    values ($\hat{y}_i$) or the regressor values ($x_i$). This happens because the
    fitted values are a linear transformation of the regressor values, $\hat{y}_i
    = b_0 + b_1x_i$.


    Observe the vertical dispersion or spread of the residuals for different values
    of duration:


    +   - For duration values between 100 and 150, the residual values are somewhere
    between -25 and 40, a spread of about 65 units.

    - For duration values between 150 and 200 seconds, there are only a handful of
    observations and it is not clear what the spread is.

    - For duration values between 200 and 250 seconds, the residual values are somewhere
    between -37 and 32, a spread of about 69 units.

    - For duration values between 250 and 300 seconds, the residual values are somewhere
    between -42 and 27, a spread of about 69 units.


    The spread is not exactly across all values of duration. It seems to be slightly
    higher for greater values of duration, but there seems to be a larger number of
    observations for higher values of duration as well. Also observe that there are
    two or three cluster of points and the dispersion of residuals is not completely
    uniform. While the residual plot is not exactly a null plot, there is no clear
    evidence against the assumption of homoskedasticity.


    We are not surprised to see plots such as one when dealing with real data. It
    is possible that the residual plot is not exactly a null plot, because there may
    be some information we are missing that could improve our model. For example,
    we could include another regressor in our model. Do not forget that we are using
    a linear model to approximate the relationship between duration and waiting times,
    and we do not expect the model to perfectly describe this relationship. When you
    look at these plots, you are trying to find clear evidence of the data not meeting
    the assumptions used. This example does not appear to violate constant variance.


    In Figure 10.12 we present an example using simulated data with non-constant variance.


    ![](img/445742518041017e8f01f11b0c3190d9_416_0.png)


    FIGURE 10.12: Example of clearly non-equal variance.'
