  md: "# 9.6: Scenarios of sampling for inference\n\nTABLE 9.6 Population Notation\
    \ Point estimate Symbol(s)\n\n| Scenario | Population parameter | Notation | Point\
    \ estimate | Symbol(s) |\n|---|---|---|---|--|\n| 1 | Population proportion |\
    \ $p$ | Sample proportion | $\\hat{p}$ |\n| 2 | Population mean | $\\mu$ | Sample\
    \ mean | $\\hat{x}$ or $\\hat{\\mu}$ |\n| 3 | Difference in population proportions\
    \ | $p_1 - p_2$ | Difference in sample | $\\hat{p}_1 - \\hat{p}_2$ |\n| 4 | Difference\
    \ in population means | $\\mu_1 - \\mu_2$ | Difference in sample means | $\bar{x}_1\
    \ - \bar{x}_2$ or $\\hat{\\mu}_1 - \\hat{\\mu}_2$ |\n\nSo, whereas the sampling\
    \ bowl exercise in Section 7.1 concerned proportions, the almost exercise in Section\
    \ 8.2.1 concerned means, the case study on utterly yawning is contagious in Section\
    \ 8.4 and the music genre activity in Section 9.2 concerned differences in proportions,\
    \ we are now concerned with differences in means.\n\nIn other words, the population\
    \ parameter of interest is the difference in population mean ratings $\\mu_a -\
    \ \\mu_r$, where $\\mu_a$ is the mean rating of all movies on IMDb and similarly\
    \ $\\mu_r$ is the mean rating of romance movies. Additionally the point estimate/sample\
    \ statistic of interest is the difference in sample means $\bar{x}_a - \bar{x}_r$,\
    \ where $\bar{x}_a$ is the mean rating of the $n_a=32$ movies in action movies\
    \ and $\bar{x}_r$ is the mean rating of the $n_r=36$ in our sample. Based on our\
    \ earlier exploratory data analysis, our estimate $\bar{x}_a - \bar{x}_r = 5.275\
    \ - 1.047$.\n\nSo appears to be a slight difference of -1.047 in favor of romance\
    \ movies. The question is, however, could this difference of -1.047 be merely\
    \ to chance and sampling variation? Are these results indicative of a true difference\
    \ in mean ratings for all romance and action movies on IMDb? To answer this question,\
    \ we will use hypothesis testing.\n\n# 9.6.3 Conducting the hypothesis test\n\n\
    We will be testing:\n\n$H_0 : \\mu_a - \\mu_r = 0$\nvs $H_A : \\mu_a - \\mu_r\
    \ \neq 0$\n\nIn other words, the null hypothesis $H_0$ suggests that both romance\
    \ and action movies have the same mean rating. This is the “hypothesized universe”\
    \ we will *assume* is to be true. On the other hand, the alternative hypothesis\
    \ $H_A$ suggests that there is a difference."
