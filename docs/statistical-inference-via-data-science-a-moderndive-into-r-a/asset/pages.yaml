- pgno: 161
  md: '# 5.1 One numerical explanatory variable


    We only state that there is an associated increase and not necessarily a causal
    For example, perhaps it may not be that higher life expectancies directly cause
    lower fertility rates. Instead, the following could hold true: wealthy countries
    tend to have stronger backgrounds, improved health, a higher standard of living,
    and lower fertility rates, at the same time these wealthy countries also tend
    to have higher life expectancies. In other words, just because two variables are
    strongly associated, it does not necessarily mean that one causes the other. This
    is summed up in the often-quoted phrase, "correlation is not causation." We discuss
    this idea further in Subsection 5.3.1.


    Furthermore, we say that this associated decrease is on average 0.137 units of
    fert_rate, because you might have two countries whose life_exp values differ by
    1, but their difference in fertility rates may not be exactly -0.137. What the
    slope of -0.137 is saying is that across all possible countries, the average difference
    in fertility rate between two countries whose life expectancies differ by one
    is -0.137.


    Now that we have learned how to compute the equation for the regression line in
    Figure 5.3 using the model values and how to interpret the resulting intercept
    and slope, revisit the code that generated these coefficients:


    ```

    # Fit regression model;

    demographics <- lm(fert_rate ~ life_exp,

    ndata = UN_data_ch5)


    # Get regression coefficients;

    coef(demographics_model)

    ```


    We, "fit" the linear regression model to the data using the lm() function and
    save this as demographics_model. When we say "fit", we mean "find the best fitting
    line to this data." lm() stands for "linear model" and is used as follows: lm(y
    ~ x, data = data_frame_name) where:


    +   - y is the outcome variable, followed by a tilde ~. y is set to fert_rate.

    - x is the explanatory variable. In our case, x is set to life_exp.

    - The combination of y ~ x is called a model formula. (Note the order of y and
    x.) In our case, the model formula is fert_rate ~ life_exp. We saw such formulas
    earlier when we used the correlation coefficient using the get_correlation() function
    in Subsection 5.1.1.

    - data_frame_name is the name of the data frame that contains the variables y
    and x. In our case, is the UN_data_ch5 data frame.


    Second, we take the saved model in demographics_model and apply the coef() function
    to obtain the regression coefficients. This gives us the components of the regression
    equation line: the intercept b0 and the slope b1.'
