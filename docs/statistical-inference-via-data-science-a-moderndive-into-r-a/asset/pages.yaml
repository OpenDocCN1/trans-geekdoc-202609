    do not contain $\mu = 3.6$ grams. Recall that when performing hypothesis testing
    we reject the null hypothesis, $H_0 : \mu = 3.6$. The results obtained using confidence
    intervals are consistent to the conclusions of hypothesis testing.


    In general, if the values for $\mu$ under the null hypothesis are not part of
    the confidence interval, the null hypothesis is rejected. Note, that when constructing
    the interval, 95% in our example, need to be consistent with the significance
    level, $\alpha$, used for the hypothesis test. In particular, when the hypothesis
    test is two-sided and a significance level $\alpha$ is used, we calculate a confidence
