  md: '164 6 Multiple Regression


    For High income countries, every additional year of life expectancy reduces the
    average fertility rate by 0.05 units. The intercepts and slopes for other income
    levels are calculated similarly.


    Since the life expectancy for Low income countries has a steeper slope than High
