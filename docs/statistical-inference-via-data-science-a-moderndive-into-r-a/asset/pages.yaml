  md: '# 430 11 Tell Your Story with Data


    Let''s now perform the second step in an EDA: computing summary statistics. Recall
    from Section 3.3 that summary statistics are single numerical values that summarize
    a large number of values. Examples of summary statistics include the mean, median,
    the standard deviation, and various percentiles.


    Let''s use the convenient tidy_summary() function from the moderndrive package
    we first used in Subsection 6.1.1, being sure to only select() the variables of
    interest for our model:


    ```

    house_prices |>

    select(price, sqft_living, condition) |>

    tidy_summary()

    ```


    # TABLE 11.1: Summary of house_prices variables.


    | column | group | type | min | Q1 | mean | median | Q3 | max | sd |

    |---|---|---|---|---|---|---|---|---||

    | price | 21613 | | numeric | 75000 | 321950 | 540088 | 450000 | 645000 | 7700000
    | 367127 |

    | sqft_living | 21613 | | numeric | 290 | 1427 | 2080 | 1910 | 2550 | 13540 |
    |

    | condition | 30 | 1 | factor | | | | | | | |

    | condition | 172 | 2 | factor | | | | | | | |

    | condition | 14031 | 3 | factor | | | | | | | |

    | condition | 5679 | 4 | factor | | | | | | | |

    | condition | 1701 | 5 | factor | | | | | | | |


    Observe that the mean price of $540,088 is larger than the median of $450,000.
    This is because a small number of very expensive houses are inflating the average.
    In other words, there are “outlier” houses in our dataset. (This fact will become
    more apparent when we create our visualizations next.)


    However, the median is not as sensitive to such outlier house prices. This is
    why news about the real estate market generally reports house prices and not mean/average
    house prices. We say that the mean is more robust to outliers than the mean. Similarly,
    while both the standard deviation and interquartile-range (IQR) are both measures
    of spread and variability, the IQR being based on quantiles as Q3 - Q1 is more
    robust to outliers.


