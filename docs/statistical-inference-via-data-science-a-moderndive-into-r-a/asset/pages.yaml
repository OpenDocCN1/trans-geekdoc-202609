    frames. These data frames were saved in a spreadsheet-like format: in a rectangular
    shape with a certain number of rows corresponding to observations and a certain
    number of columns corresponding to variables describing these observations.


    We''ll see in the upcoming Chapter 4 that there are actually two ways to represent
    data in spreadsheet-type rectangular format: (1) "wide" format and (2) "tall/narrow"
    format. The tall/narrow format is also known as "tidy" format in R user circles.
    While the distinction between "tidy" and "non-tidy" formatted data is subtle,
    it has immense implications for our data science work. This is because almost
    all the packages used in this book, including the ggplot package for data visualization
    and the dplyr package for data wrangling, all assume that all data frames are
    in "tidy" format.


    Furthermore, up until now we''ve only explored, visualized, and wrangled data
