- pgno: 194
  md: '# 160 6 Multiple Regression


    We do this, however, we review a linear regression with only one categorical explanatory
    variable. Recall in Subsection 5.2.2 we fit a regression model for each country
    life expectancy as a function of the corresponding continent. We produce the corresponding
    analysis here, now using the fertility rate as the response variable and the income
    group as the categorical explanatory variable. We''ll use slightly different notation
    than what was done previously to make the model more general.


    A linear model with a categorical explanatory variable is a one-factor model where
    factor refers to the categorical explanatory variable and the categories are also
    factor vectors. We represent the categories using indicator functions or dummy
    variables. In our UN data example, The variable has four categories or levels:
    Low income, Lower middle income, Upper middle income, and High income. The corresponding
    dummy variables are needed:


    ```

    $D_1 = \begin{cases} 1 & \text{if the UN member state has low income} \ 0 & \text{otherwise}
    \end{cases}

    nD_2 = \begin{cases} 1 & \text{if the UN member state has lower middle income}
    \ 0 & \text{otherwise} \end{cases}

    D_3 = \begin{cases} 1 & \text{if the UN member state has high middle income} \
    0 & \text{otherwise} \end{cases}

    D_4 = \begin{cases} 1 & \text{if the UN member state has high income} \ 0 & \text{otherwise}
    \end{cases}$

    ```


    So, for example, if a UN member state has *Low income*, its dummy variables are
    $D_1 = 1$ and $D_2 = D_3 = D_4 = 0$. Similarly, if another UN member state has
    *high middle income*, then its dummy variables would be $D_1 = D_2 = D_4 = 0$
    and $D_3 = 1$. Using dummy variables, the mathematical formulation of the linear
    regression for our example is:


    ```

    $\hat{y} = \text{fert rate} = b_0 + b_2D_2 + b_3D_3 + b_4D_4$

    ```


    or if we want to express it in terms of the ith observation in our dataset, we
    can include the ith subscript:


    ```

    $\hat{y}_i = \text{fert rate} = b_0 + b_2D_{2i} + b_3D_{3i} + b_4D_{4i}$

    ```


    Recall that the coefficient $b_0$ represents the intercept and the coefficients
    offset the appropriate category. The dummy variables, $D_2, D_3$, and $D_4$ take
    the values of zero or one depending on the corresponding category of any given
    country. Also observe that $D_1$ does not appear in the model. The reason for
    this is entirely mathematical: if the model would contain an intercept and all
    the dummy variables, the model would be over-specified, it would contain one redundant
    explanatory variable. The solution is to drop one of the variables. We keep the
    intercept because it provides flexibility when interpreting more complicated models,
    and we drop one of the dummy variables which, by default in R, is the first'
  merge: -1
  img_proc: true
- pgno: 195
  md: '# 6.1 One numerical and one categorical explanatory variable


    dummy variable, $D_1$. This does not mean that are losing information of the first
    level $D_1$. If a country is part of the *Low income* level, $D_1 = 1, D_2 = D_3
    = D_4 = 0$, so most of the terms in the regression are zero and the linear regression
    becomes:


    $$\hat{y} = \text{fert rate} = b_0$$


    The intercept represents the average fertility rate when a country is a *Low income*
    country. Similarly, if another country is part of the *High middle income* level,
    then $D_1=D_2=D_4=0$ and $D_3=1$ so the linear regression becomes:


    $$\hat{y} = \text{fert rate} = b_0 + b_3$$


    The average fertility rate for a *High middle income* country is $b_0 + b_3$.
    Observe that $b_3$ is an offset for life expectancy between the baseline level
    and the *High middle income* level. The same logic applies to the model for each
    possible income category.


    We calculate the regression coefficients using the $lm()$ function and the command
    $coef()$ to retrieve the coefficients of the linear regression:


    ```

    one_factor_model <- lm(fert_rate ~ income, data = UN_data_ch6)

    coef(one_factor_model)

    ```


    We present these results on a table with the mathematical notation used above:


    | Coefficients | Values |

    |---|---||

    | (Intercept) | b0 | 4.28 |

    | incomeLower income | b2 | -1.30 |

    | incomeUpper middle income | b3 | -2.25 |

    | incomeHigh income | b4 | -2.65 |


    The first level, *Low income*, is the "baseline" group. The average fertility
    rate for Low income UN members is 4.28. Similarly, the average fertility rate
    for Upper middle income members is 4.28 + (-2.25) = 2.03.


    We are now ready to study the multiple linear regression model with interactions
    shown in Figure 6.1. In this figure we identify three different effects. First,
    for any fixed level of life expectancy, observe that there are four different
    fertility rates. They represent the effect of the categorical explanatory variable.
    Second, for any given regression, the slope represents the change in average fertility
    rate to changes on life expectancy. This is the effect of the numerical explanatory
    variable $life\_exp$. Third, observe that the slope of the line depends on the
    income level; as an illustration, observe for *high income* member states the
    slope is less steep than for Low income members. When the slope changes to changes
    in the explanatory variable, we call this an **interaction** effect.


    The mathematical formulation of the linear regression model with two explanatory
    variables, one numerical and one categorical, and interactions is:'
  merge: -1
  img_proc: true
- pgno: 196
  md: '$\tilde{y} = b_0 + b_{02}D_2 + b_{03}D_3 + b_{04}D_4$\n+ b_1x$\n+ b_{12}xD_2
    + b_{13}xD_3 + b_{14}xD_4$


    The linear regression shows how the average life expectancy is affected by the
    categorical variables, the numerical variable, and the interaction effects. There
    are eight coefficients in our model and we have separated their coefficients into
    three lines to highlight their roles. The first line shows the intercept and the
    effects of the categorical explanatory variables. Recall that $D_2, D_3,$ and
    $D_4$ are the dummy variables in the model and each is equal to one or zero depending
    on the category of the country and at hand; correspondingly, the coefficients
    $b_{02}, b_{03},$ and $b_{04}$ are the offsets with respect to the baseline level
    of the intercept, $b_0$. Recall that the first dummy variable has been dropped
    and the intercept captures this effect. The second line in the equation represents
    the numerical variable, $x$. In our example $x$ is the value of life expectancy.
    The coefficient $b_1$ is the slope of the line and represents the change in fertility
    rate due to one change in life expectancy. The third line in the equation represents
    the interaction effects on the slopes. Observe that they are a combination of
    life expectancy, $x$, and income level, $D_2, D_3,$ and $D_4$. What interaction
    effects does is to modify the slope for different levels of income. For a low
    income member state, the dummy variables are $D_1=1, D_2=D_3=D_4=0$ and our linear
    regression is:


    ```

    $\tilde{y} = b_0 + b_{02} \cdot 0 + b_{03} \cdot 0 + b_{04} \cdot 0 + b_1x + b_{12}
    \cdot 0 + b_{13} \cdot 0 + b_{14} \cdot 0$\n$= b_0 + b_1x$

    ```


    Similarly, for a high income member state, the dummy variables are $D_1=D_2=D_3=0,$
    and $D_4=1$. We take into account the offsets for the intercept, $b_{04},$ and
    the slope, $b_{14}$; and the linear regression becomes:


    ```

    $\tilde{y} = b_0 + b_{02} \cdot 0 + b_{03} \cdot 0 + b_{04} \cdot 1 + b_1x + b_{12}
    \cdot 0 + b_{13} \cdot 0 + b_{14} \cdot 1$\n$= b_0 + b_{04} + b_1x + b_{14}x$\n$=
    (b_0 + b_{04}) + (b_1 + b_{14}) \cdot x$

    ```


    Observe how the intercept and the slope are different for a high income member
    state compared to the baseline low income member state. As an illustration, we
    construct this multiple linear regression for the UN member dataset in R. We first
    “fit” the model using the `\``linear model\` function and then find the coefficients
    using the function `coef()`. In R, the formula is used $y = x1 + x2$ where $x1$
    and $x2$ are the reality variables in the dataset and represent the main effects
    while $x1:x2$ is the interaction term. For simplicity, we can also write $y \sim
    x1 * x2$ for both, main effects and interaction effects. R would let both x1 and
    x2 be either explanatory or numerical, and to make sure the dataset is appropriate
    for the regression we want to run. Here is the code for our example:'
  merge: -1
  img_proc: true
