  md: '# 5.1 One numerical explanatory variable


    +   - Q3: the 3rd quartile: the value at 75% of observations are smaller than
    it (the 75th percentile)

    - max: the maximum value

    - sd: the standard deviation value for measuring spread


    Looking at this output, we can see how the values of both variables distribute.
    For example, the median fertility rate was 2, whereas the median life expectancy
    was 75.14 years. The middle 50% of fertility rates was between 1.6 and 3.2 (the
    first and third quadrants), and the middle 50% of life expectations was between
    69.36 to 78.31.


    The tidy_summary() function returns only what are known as univariate summary
    statistics: functions that take a single variable and return some numerical summary
    of that variable. However, there also exist bivariate summary statistics: functions
    that take in two variables and return some summary of those variables.


    In particular, when the two variables are numerical, we can compute the correlation
    coefficient. Generally speaking, coefficients are quantitative expressions of
    a specific phenomenon. A correlation coefficient is a quantitative expression
    of the strength of the linear relationship between two numerical variables. Its
    value goes from -1 and 1 where:


    +   - -1 indicates a perfect negative relationship: As one variable increases,
    the value of the other variable tends to go down, following a straight line.

    - 0 indicates no relationship: The values of both variables go up/down independently
    of each other.

    - +1 indicates a perfect positive relationship: As the value of one variable goes
    up, the value of the other variable tends to go up as well in a linear fashion.


    Figure 5.1 gives examples of nine different correlation coefficient values for
    hypothetical numerical variables x and y.


    ![](img/445742518041017e8f01f11b0c3190d9_155_0.png)


    FIGURE 5.1: Nine different correlation coefficients.'
