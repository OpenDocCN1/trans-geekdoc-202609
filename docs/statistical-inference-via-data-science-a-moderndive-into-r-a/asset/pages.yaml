    in degrees Celsius (°C) instead of degrees Fahrenheit (°F). The formula to convert
    temperatures from °F to °C is


    ```

    temp in C = (temp in F - 32) / 1.8

    ```


    We can apply this formula to the temp variable using the mutate() function from
    the dplyr package, which takes existing variables and mutates them to create new
    ones.'
