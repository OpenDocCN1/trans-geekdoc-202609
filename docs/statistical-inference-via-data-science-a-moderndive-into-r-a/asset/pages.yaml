    cup than the others. It is often useful to find any linear associations between
    numerical regressors as is the case for the scatterplot for aroma against flavor
    which suggests a strong positive linear association. By contrast, almost no relationship
    can be found when observing moisture_percentage against either aroma or flavor.


    The function only produces these plots, but includes the correlation coefficient
    for any pair of numerical variables. In this example, the correlation coefficients
    support the findings using the scatterplot matrix. The correlations between total_cup_points
    and aroma (0.87) and total_cup_points and flavor (0.94) are positive and close
    to one, suggesting a strong positive linear association. Recall that the correlation
    coefficient is relevant if the association is approximately linear. The correlation
    between moisture_percentage and any other variable is close to zero, suggesting
    that moisture_percentage is likely not associated with any other variable (either
    response or regressor). Note also that the correlation between aroma and flavor
    (0.82) supports our conclusion of a strong positive association.


