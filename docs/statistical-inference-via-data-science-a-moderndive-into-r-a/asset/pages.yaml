  md: "# 10.6 Simulation-based inference for multiple linear regression\n\n# 10.6.2\
    \ Hypothesis testing for the partial slopes using infer\n\nWe can also conduct\
    \ hypothesis tests for the partial slopes in multiple linear regression. We use\
    \ the permutation test to null the hypothesis $H_0 : \beta_i = 0$ versus the alternative\
    \ hypothesis $H_A : \beta_i \neq 0$ for each of the partial slopes. The infer\
    \ package constructs the null distribution of the partial slopes under the null\
    \ hypothesis of independence.\n\n# Null distribution for the partial slopes\n\n\
    We can also compute the null distribution for the partial slopes using the infer\
    \ workflow. We will shuffle the values of the response variable total_cup_points\
    \ across the values of the regressors continent_of_origin, aroma, flavor, and\
    \ moisture_percentage in the coffee_data dataset. This is done under the assumption\
    \ of independence between the response and the regressors. The syntax is similar\
    \ to constructing the bootstrap distribution, but we use type=\"permute\" and\
    \ set hypothesis to null=\"independence\". We set our pseudo-random number generation\
    \ to 2024 in order for the reader to get the results with the shuffling.\n\n```\n\
    set.seed(2024)\nnull_distribution_mlr <- coffee_quality |>\nspecific(total_cup_points\
    \ - continent_of_origin + aroma +\nflavor + moisture_percentage) |>\nhypothesize(null\
    \ = \"independence\") |>\ngenerate(reps = 1000, type = \"permute\") |>\nfit()\n\
    ull_distribution_mlr\n```\n\n```\n# A tibble: 7,000 x 3\n# Groups: replicate [1,000]\n\
