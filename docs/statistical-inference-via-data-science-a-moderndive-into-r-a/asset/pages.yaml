    is -0.9 or -1.


    The correlation coefficient can be computed using the get_correlation() function
    in the modernive package. In this case, the inputs to the function are two numerical
    variables for which we want to calculate the correlation coefficient.


    We put the name of the outcome variable on the left-hand side of the ~ “tilde”
