    on your computer. It is important that you install R first and then install RStudio.


    +   **You must do this first:** Download and install R by going to https://cloud.r-project.org/.

    * If you are a Windows user: Click on "Download R for Windows", then click on
    "base", then click on the Download link.

    * If you are macOS user: Click on "Download R for macOS", then under "Latest release":
    click on R-X.X.X.pkg, where R-X-X.X is the version number. For example, the latest
    version of R as of May 24, 2024, was R-4.4.0.

    * If you are a Linux user: Click on "Download R for Linux" and choose your distribution
    for more information on installing R for your setup.


    +   **You must do this second:** Download and install RStudio at https://www.rstudio.com/products/rstudio/download/.

    * Scroll down to "Installers for Supported Platforms" near the bottom of the page.

    * Click on the download link corresponding to your computer''s operating system.


    # 1.1.2 Using R via RStudio


    Recall our car analogy from earlier. Much as we don''t drive a car by interacting
    directly with the engine but rather interacting with elements on the car''s dashboard,
    we won''t be using R directly but rather we will use RStudio''s interface. After
    you'
