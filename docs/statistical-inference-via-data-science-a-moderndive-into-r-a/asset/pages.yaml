    \ to add the factor continent_of_origin to a model that already has aroma, flavor,\
    \ and moisture_percentage.\n\n# 10.5.5 Model fit and diagnostics\n\nAs we did\
    \ for simple linear regression we use the residuals to determine the fit of the\
    \ model and whether some of the assumptions are met. In particular, we continue\
    \ using the plot of residuals against the fitted values and if no model violations\
    \ present the plot should be close to a null plot.\n\nWhile most of the treatment\
    \ and interpretations are similar to those presented for simple linear regression,\
    \ when the plot of residuals against fitted values is not a null plot, we know\
    \ that there is some sort of violation of one or more of the assumptions of the\
    \ model. It is not met. There is no longer clear what the reason for this is,\
    \ but at least one assumption is not met. On the other hand, if the residuals\
    \ against fitted values plot appears to be close to a null plot, none of the assumptions\
    \ have been broken and we can proceed with the use of this model.\n\n```\n# Fit\
    \ regression model:\nmod_mult_final <- lm(total_cup_points ~ aroma + flavor +\
    \ continent_of_origin)\n# Fitted values and residuals:\nfit_and_res_mult <- get_regression_points(mod_mult_final)\n\
