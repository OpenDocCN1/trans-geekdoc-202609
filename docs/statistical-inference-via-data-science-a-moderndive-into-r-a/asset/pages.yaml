  md: '# 6


    # Multiple Regression


    In Chapter 5, we studied simple linear regression as a model that represents the
    relationship between two variables: an outcome variable or response y and an explanatory
    variable or regressor x. Furthermore, to keep things simple, we only considered
    models with one explanatory x that was either numerical in Section 5.1 or categorical
    in Section 5.2.


    In this chapter, we introduce multiple regression, the direct extension to simple
    linear regression when more than one explanatory variable is taken into account
    to explain the changes in the outcome variable. As we show in the next sections,
    much of the material developed for simple linear regression translates directly
    into multiple linear regression, but the interpretation of the associated effect
    of any one explanatory variable must be made making taking into account the other
    explanatory variables included in the model.


