    ```

    many_airports <- flights |>

    filter(dest == "SEA" | dest == "SFO" | dest == "PHX" |

    dest == "BTV" | dest == "BDL")

    ```


    As we progressively include more airports, this will get unwieldy to write. A
    shorter approach using the %in% operator along with the c() function. Recall from
    Subsection 1.2.1 that the c() function "combines" or "concatenates" values into
    a single vector of values.


    ```

    many_airports <- flights |>

    filter(dest %in% c("SEA", "SFO", "PHX", "BTV", "BDL")

    View(many_airports)

    ```


    What this code doing is filtering flights for all flights where dest is in the
