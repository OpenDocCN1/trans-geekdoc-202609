    # 11.3 Case study: Effective data storytelling


    As we''ve progressed throughout this book, you''ve seen how to work with data
    in a variety of ways. You''ve learned effective strategies for plotting data by
    understanding which types of plots work best for which combinations of variable
    types. You''ve summarized data in spreadsheet format and calculated summary statistics
    for a variety of different variables. Furthermore, you''ve seen the value of statistical
    inference as a process to come to conclusions about a population using sampling.
    Lastly, you''ve explored how to fit linear regression models and the importance
    of checking the conditions required so that all confidence intervals and hypothesis
    tests have valid interpretation. All throughout, you''ve learned many computational
    techniques and focused on writing R that''s reproducible.


    We now present another of case studies, but this time on the "effective data storytelling"
    done by data journalists around the world. Great data stories don''t mislead the
    reader, but rather them in understanding the importance that data plays in our
    lives through storytelling.


    # 11.3.1 Bechdel test for Hollywood gender representation


    We recommend you read and analyze Walt Hickey''s FiveThirtyEight.com article,
    "The Dollar-And-Cents Case Against Hollywood''s Exclusion of Women.\^9 In it,
    Walt completed a multi-decade study of how many movies pass the Bechdel test^10,
    an informal test of gender representation in a movie that was created by Alison
    Bechdel.


    As you read over the article, think carefully about how Walt Hickey is using data,
    graphics, and analyses to tell a story. In spirit of reproducibility, FiveThirtyEight
    also shared the data and R code^11 that they used for this article. You can also
    use the data in many more of their articles on their GitHub^12.


    > ^9https://fivethirtyeight.com/features/the-dollar-and-cents-case-against-hollywood-exclusion-women/


    > ^10https://bechdeltest.com/


    > ^11https://github.com/fivethirtyeight/data/tree/master/bechdel


    > ^12https://github.com/fivethirtyeight/data'
  merge: -1
  img_proc: true
