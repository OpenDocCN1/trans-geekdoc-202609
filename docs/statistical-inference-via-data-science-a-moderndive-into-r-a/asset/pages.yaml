    # 3.1 The pipe operator: |>


    Before we start data wrangling, let’s first introduce a nifty tool that the pipe
    operator |> has been a part of R since May 2021; the native pipe operator | allows
    us to combine multiple operations in R into a single sequential chain of actions.
    In modern R, the native pipe operator |> is now the default for chaining functions,
    replacing the previously tidyverse %>% that was loaded with the dplyr package.
    Introduced in R 4.1.0 in May 2021, |> offers a more intuitive and readable syntax
    for data wrangling and other tasks, eliminating the need for additional package
    dependencies.


    You''ll still see R code using %>% in older scripts or searches online, but we''ll
    use |> in this book. The tidyverse pipe still works, so don''t worry if you see
    it in other code.


    Let''s start with a hypothetical example. Say you would like to perform a hypothetical
    sequence of operations on a hypothetical data frame x using hypothetical functions
    f(), g(), and h():


    > ¹https://en.wikipedia.org/wiki/SQL'
