  md: "# 10.1 The simple regression model\n\n$Y = \beta_0 + \beta_1 \\cdot X + \\\
    epsilon,$$\n\n$\beta_0$ is the population intercept and $\beta_1$ is the population\
    \ slope. These are now the parameters of the model alongside the explanatory variable\
    \ $(X)$ produce the equation of a line. The statistical part of this relationship\
    \ is given by $\\epsilon$, a random variable called the *error term*. The error\
    \ term accounts for the portion of $Y$ that is not explained by the line.\n\n\
    We make additional assumptions about the distribution of the error term, $\\epsilon$.\
    \ The expected value of the error term is zero, and the assumed standard deviation\
    \ is equal to a positive constant $\\sigma$, or in mathematical terms: $E(\\epsilon)\
    \ = 0$ and $SD(\\epsilon) = \\sigma$.\n\nWe review the meaning of these quantities.\
    \ If you were to take a large number of observations from this population, we\
    \ would expect the error terms to be greater than zero and sometimes less than\
    \ zero, but on average, equal to zero. Similarly, some error will be very close\
    \ to zero and others very far from zero, but on average, we would expect them\
    \ to be roughly $\\sigma$ units away from zero.\n\nRecall the square of the standard\
    \ deviation is called the variance, $Var(\\epsilon) = \\sigma^2$. The variance\
    \ of the error term is equal to $\\sigma^2$ regardless of the $X$. This property\
    \ is called *homoskedasticity* or constancy of the variance. It will be useful\
    \ later in our analysis.\n\n# 10.1.3 Using a sample for inference\n\nAs we did\
    \ in Chapters 8 and 9, we use a sample to estimate the parameters in the population.\
    \ We use data collected from the Old Faithful Geyser in Yellowstone National Park\
    \ in Wyoming, USA. This dataset contains the duration of the geyser eruption in\
    \ seconds and the waiting time to the next eruption. The duration of the current\
    \ eruption can help determine fairly well the waiting time to the next eruption.\
    \ For this example, we use a sample of data collected by volunteers and saved\
    \ on the website https://geysertimes.org/$1$ between June 1st, 2024 and August\
    \ 19th, 2024.\n\nThese data are stored in the `old_faithful_2024` data frame in\
    \ the modernive package. While data collected by volunteers are not a random sample,\
    \ the eruptions could introduce some sort of bias, the eruptions selected by the\
    \ volunteers had no specific patterns. Further, beyond the individual skill of\
    \ each volunteer measuring the times appropriately, no response bias or preference\
    \ seems to be present. Therefore, it seems safe to consider the data a random\
    \ sample. The first ten rows are shown here:\n\n> https://geysertimes.org/"
