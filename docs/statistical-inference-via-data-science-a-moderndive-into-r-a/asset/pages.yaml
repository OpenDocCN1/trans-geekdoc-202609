  md: "400\n\n10 Inference for Regression\n\n+   - B. To test for normality of the\
    \ residuals.\n- C. To examine linear relationships between all variable pairs\
    \ and identify multi-collinearity among regressors.\n- D. To determine the appropriate\
    \ number of dummy variables.\n\n**LC10.18)** In the multiple regression model\
    \ for the coffee_data, what is the role of dummy variables for continent_of_origin?\n\
    \n+   - A. They are used to predict the values of the numerical regressors.\n\
    - B. They modify the intercept based on the specific category of continent_of_origin.\n\
    - C. They serve to test the independence of residuals.\n- D. They indicate which\
    \ observations should be excluded from the model.\n\n# 10.5 Theory-based inference\
    \ for multiple linear regression\n\nIn this section, we introduce some of the\
    \ conceptual framework needed to understand inference in multiple linear regression.\
    \ We illustrate this framework using the coffee example and the R function get_regression_table()\
    \ introduced in Subsection 10.2.5.\n\nInference for multiple linear regression\
    \ is a natural extension of inference for simple linear regression. Recall that\
    \ the i-th observation is given by\n\n> $y_i = \beta_0 + \beta_1 \\cdot x_{i1}\
    \ + \\cdots + \\beta_p x_{ip} + \\epsilon_i.$\n\nWe assume again that the error\
    \ term is normally distributed with an expected value (mean) equal to zero and\
    \ a standard deviation equal to $\\sigma$:\n\n> $\\epsilon_i \\sim \\text{Normal}(0,\
    \ \\sigma).$\n\nSince the error term is the only random element in the linear\
    \ model, the response $y_i$ results from a constant\n\n> $\\beta_0 + \\beta_1\
    \ \\cdot x_{i1} + \\cdots + \\beta_p x_{ip}$\n\nand a random variable: the error\
    \ term $\\epsilon_i$. Using properties of the normal distribution, the expected\
    \ value, and the variance (and standard deviation), it can be shown that $y_i$\
    \ is also normally distributed with mean equal to $\beta_0 + \\beta_1 \\cdot x_{i1}\
    \ + \\cdots + \\beta_p x_{ip}$ and standard deviation equal to $\\sigma$:\n\n\
    > $y_i \\sim \\text{Normal}(\\beta_0 + \\beta_1 \\cdot x_{i1} + \\cdots + \\beta_p\
    \ x_{ip}, \\sigma)$"
