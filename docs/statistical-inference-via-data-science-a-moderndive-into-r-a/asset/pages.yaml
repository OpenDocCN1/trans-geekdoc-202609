    # 1.3.3 Package use


    One very common mistake we R users make when wanting to use particular packages
    is they forget to “load” them first by using library() command we just saw. Remember:
    you have to load each package you want to use every time you start RStudio. If
    you don’t “load” a package, but attempt to use one of its features, you’ll see
    an error message similar to:


    ```

    Error: could not find function

    ```


    This is a different error message than the one you just saw on a package not having
    installed yet. R is telling you that you are trying to use a function in a package
    that has not yet been “loaded.” R doesn’t know where to find the function you
    are using. Almost all new users forget to do this when starting out, and it is
    a little annoying to get used to doing it. However, you’ll remember with practice
    and after some time it will become second nature for you.


    # 1.4 Explore your first datasets


    Let’s put everything we’ve learned so far into practice and start exploring some
    real data! Data comes to us in a variety of formats, from pictures to text to
    numbers. Throughout this book, we’ll focus on datasets that are saved in “spreadsheet”-type
    format. This is probably the most common way data are collected and saved in many
    fields. Remember from Subsection 1.2.1 that these “spreadsheet”-type datasets
    are called data frames in R. We’ll focus on working with data saved as data frames
    throughout this book.


    Let’s first load all the packages needed for this chapter, assuming you’ve already
    installed them. Read Section 1.3 for information on how to install and load R
    packages if you haven’t already.'
