    \ for getting the regression table:\n\n```\nprice_interaction <- lm(log10_price\
    \ ~ log10_size * condition,\ndata = house_prices)\nget_regression_table(price_interaction)\n\
    ```\n\n# TABLE 11.2: Regression table for interaction model\n\n| term | estimate\
    \ | std_error | statistic | p_value | lower_ci | upper_ci |\n|---|---|---|---|---|---||}{\n\
    | intercept | 3.330 | 0.451 | 7.380 | 0.000 | 2.446 | 4.215 |\n| log10_size |\
    \ 0.690 | 0.148 | 4.652 | 0.000 | 0.399 | 0.980 |\n| condition: 2 | 0.047 | 0.498\
    \ | 0.094 | 0.925 | -0.930 | 1.024 |\n| condition: 3 | -0.367 | 0.452 | -0.812\
    \ | 0.417 | -1.265 | 0.519 |\n| condition: 4 | -0.398 | 0.453 | -0.879 | 0.380\
    \ | -1.286 | 0.490 |\n| condition: 5 | -0.883 | 0.457 | -1.931 | 0.053 | -1.777\
    \ | 0.013 |\n| log10_size:condition2 | -0.024 | 0.163 | -0.148 | 0.882 | -0.344\
    \ | 0.295 |\n| log10_size:condition3 | 0.133 | 0.148 | 0.893 | 0.372 | -0.158\
    \ | 0.424 |\n| log10_size:condition4 | 0.146 | 0.149 | 0.979 | 0.328 | -0.146\
    \ | 0.437 |\n| log10_size:condition5 | 0.310 | 0.150 | 2.067 | 0.039 | 0.016 |\
    \ 0.604 |\n\nRecall we saw in Subsection 6.1.2 how to interpret a regression table\
    \ when there are\nboth numerical and categorical explanatory variables. Let's\
    \ do the same for all\n10 values in the estimate of Table 11.2.\n\nIn this case,\
    \ the \"baseline for comparison\"group for the categorical variable condi-\nt\
    \ the condition 1 houses, since \"1\" comes first alphanumerically. Thus the\n\
