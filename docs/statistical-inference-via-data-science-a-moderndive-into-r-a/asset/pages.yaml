- pgno: 411
  md: '# 10.2 Theory-based inference for simple linear regression


    In Figure 10.6 we show the residual plot (right plot) alongside the scatterplot
    for duration waiting (left plot). Note how the residuals on the left plot are
    determined by the vertical distance between the observed response and the linear
    regression. On the right plot (residuals), we have removed the effect of the linear
    regression and the effect of the residuals is seen as the distance from each point
    to the zero line (y-axis). Using these residuals plot, it is easier to spot patterns
    or trends that may be in conflict with the assumptions of the model, as we describe
    below.


    ![](img/445742518041017e8f01f11b0c3190d9_411_0.png)


    FIGURE 10.6: the scatterplot and residual plot for the Old Faithful data.


    In what follows we show how the residual plot can be used to determine whether
    the linear model assumptions are met.


    Linearity of relationship


    We want to check the association between the response $y_i$ and the explanatory
    variable $x_i$ is linear. We expect, due to the error term in the model, that
    the scatterplot of residuals against fitted values shows some random variation,
    but the variation should not be systematic in any direction and the trend should
    not show non-linear patterns.


    A scatterplot of residuals against fitted values showing no patterns but simply
    a cloud of points that seems randomly assigned in every direction with the residuals''
    variation (y-axis) as much for any fitted values (x-axis) and points located as
    much above as below the zero line is called a *null plot*. Plots of residuals
    against fitted values or regressors are *null plots* do not show any evidence
    against the assumptions of the model. In other words, if we want our linear model
    to be adequate, we hope to see *null* points when plotting residuals against fitted
    values.


    This is largely for the Old Faithful geyser with the residuals against the fitted
    values (waiting,hat) shown in the right-plot of Figure 10.6. The residual plot
    is not a *null* plot as it appears there are clusters of points as opposed to
    a complete random assignment, but there are not clear systematic trends in any
    direction or the appearance of a non-linear relationship. So, based on this plot,
    we believe that the data does not violate the assumption of linearity.'
  merge: -1
  img_proc: true
- pgno: 412
  md: 'By contrast, assume now that the scatterplot of waiting duration and its associated
    residual plot are shown in Figure 10.7. We are not using the real data here, but
    simulated data. A quick at the scatterplot and regression line (left plot) could
    lead us to believe that the regression line is an appropriate summary of the relationship.
    But if we look carefully, you may notice that the residuals for duration are mostly
    below the regression line, residuals for values in the middle range of duration
    are mostly above the regression line, and residuals for large values of duration
    are again below the regression line.


    This is the reason we prefer to use plots of residuals against fitted values (right
    plot) as we have removed the effect of the regression and can focus entirely on
    the residuals. The points clearly do not form a line, but rather a U-shaped curve.
    If this was the real data observed, using the linear regression with these data
    would produce results that are not valid or adequate.


    ![](img/445742518041017e8f01f11b0c3190d9_412_0.png)


    Figure 10.7: Example of a non-linear relationship.


    Independence of the error terms and the response


    Another assumption we want to check is the Independence of the response values.
    If they are not independent, some patterns of dependency may appear in the observed
    data.


    The residuals could be used for this purpose too as they are a rough approximation
    of the error terms. If data was collected in a time sequence or other type of
    sequence, the residuals may also help us determine lack of independence by plotting
    the residuals against time. As it happens, the Old Faithful geyser eruption example
    does have a time component we can use: the old_faithful_2024 dataset contains
    the date variable. We show the plot of residuals against date (time):'
  merge: -1
