    \ the two-sided hypothesis test comparing the mean rating of romance to action\
    \ movies?\n\n(LC.9.15) Test your data-wrangling knowledge and EDA skills:\n\n\
    +   - Use dplyr and tidy to create the necessary data frame focused on only action\
    \ and romance movies (not both) from the movies data frame in the ggplot2 package.\n\
    - Make a boxplot and a faceted histogram of this population data comparing rates\
    \ of action and romance movies from IMDb.\n- Discuss how these plots compare to\
    \ the similar plots produced for the movies_sample data.\n\n# 9.7 Summary and\
    \ final remarks\n\n# 9.7.1 Theory-based approach for two-sample hypothesis tests\n\
    \nAs we did previously when we discussed the theory-based approach for confidence\
    \ intervals or hypothesis tests for the one-sample problem, we discuss now some\
    \ of the theory needed to perform two-sample hypothesis tests. We present an example\
    \ of a traditional theory-based method to conduct hypothesis tests. This method\
    \ relies on the Central Limit Theorem and properties of random variables, expected\
    \ value, variance, and standard deviation. It is also a direct extension of the\
    \ one-sample problem discussed in Section 9.1.\n\nTheory-based methods have been\
    \ used for decades when researchers did not have access to computers that could\
    \ run thousands of calculations quickly and efficiently. Now computing power is\
    \ more accessible and simulation-based methods are becoming more popular, but\
    \ researchers in many fields continue to use theory-based methods.\n\nThe theory-based\
    \ method we focus on is known as the Welch’s two-sample t-test for testing differences\
    \ in sample means. The test statistic we use is the two-sample t-statistic, a\
    \ standardized version of the difference in sample means $\bar{X}_1 - \bar{X}_2$.\
    \ The data we use once again the movies_sample data of action and romance movies\
    \ from Section 9.6.\n\n# Welch's two-sample t-statistic\n\nIn Section 7.5 we introduced\
    \ the sampling distribution for the difference of two sample means. If we let\
    \ $\bar{X}_a$ be the random variable for the sample mean of action films' rating"
  merge: -1
  img_proc: true
- pgno: 379
  md: "# 9.7 Summary and final remarks\n\nand $\bar{X}_r$, the one for romance film’s\
    \ rating, the distribution of the difference of the random variables is\n\n```\n\
    $$\\bar{X}_a - \\bar{X}_r \\sim Normal\\left(\\mu_a - \\mu_r, \\sqrt{\\frac{\\\
    sigma_a^2}{n_a} + \\frac{\\sigma_r^2}{n_r}}\\right)$\n```\n\nWhen $\\mu_a$ and\
    \ $\\mu_r$ are the population mean ratings, $\\sigma_a$ and $\\sigma_r$, the population\
    \ standard deviations, and $n_a$ and $n_r$, the sample sizes for action and romance\
    \ genres, respectively.\n\nWhen using the samples, as we did for one-sample problems,\
    \ we standardize the difference in sample means, $\bar{X}_a - \bar{X}_r$, by subtracting\
    \ its mean (the differences in population means) and dividing by its standard\
    \ error. This construct a test statistic known as the Welch’s two-sample t-test:\n\
    \n```\n$t = \\frac{(\\bar{X}_a - \\bar{X}_r) - (\\mu_a - \\mu_r)}{SE(\\\bar{X}_a\
    \ - \\bar{X}_r)} = \\frac{(\\bar{X}_a - \\bar{X}_r) - (\\mu_a - \\mu_r)}{\\sqrt{\\\
    frac{s_a^2}{n_a} + \\frac{s_r^2}{n_r}}}$\n```\n\nObserve that the formula for\
    \ $SE(\\bar{X}_a - \\bar{X}_r)$ has the sample sizes $n_a$ and $n_r$ in them.\
    \ So as the sample size increases, the standard error goes down. We have seen\
    \ this characteristic for one-sample problems in Subsections 7.3.4 and 7.4.5 when\
    \ describing the sample distribution of the sample mean or the sample proportion\
    \ and in Section 8.1 when discussing the sample size effect on confidence intervals.\n\
    \nLet’s state the null and alternative hypotheses for this test:\n\n```\n$H_0:\
    \ \\mu_a - \\mu_r = 0\\nH_A: \\mu_a - \\mu_r \\neq 0$\n```\n\nThe claim under\
    \ the null hypothesis is that the difference between the population means is zero.\
    \ This is equivalent to claiming that the differences are the same, $\\mu_a =\
    \ \\mu_r$, which is the typical test, as we try to determine whether not the population\
    \ means are different. Yet, the structure of the test allows for testing other\
    \ differences as well, needed.\n\nThe Welch’s two-sample t-test becomes:\n\n```\n\
    $t = \\frac{\\bar{X}_a - \\bar{X}_r - 0}{\\sqrt{\\frac{s_a^2}{n_a} + \\frac{s_r^2}{n_r}}}$\n\
    ```\n\nUsing results based on the Central Limit Theorem, linear combinations of\
    \ independent variables, and properties of the expected value, variance and standard\
    \ deviation, it can be shown that the Welch’s test statistic follows a $t$ distribution.\n\
    \nIn Section 8.1.4 we have discussed the properties of the $t$ distribution and\
    \ in Figure 8.7 we have shown different $t$ distributions with different degrees\
    \ of freedom. Recall"
  merge: -1
  img_proc: true
- pgno: 380
  md: "# 346 9 Hypothesis Testing\n\nthat the $t$ distribution is similar to the standard\
    \ normal; its density curve is bell-shaped, and it is symmetric around zero, and\
    \ the tails of the $t$ distribution are a little thicker (or heavier) than those\
    \ of the standard normal. This is important for hypothesis testing, since the\
    \ $p$-value is calculated from the areas on tails. Also recall that as the degrees\
    \ of freedom increase, the $t$-distribution more and approximates the standard\
    \ normal curve.\n\nIn terms of the Welch's two-sample $t$-test, it has been shown\
    \ that the test statistics follows a $t$ distribution with degrees of freedom\
    \ that can be approximated by\n\n```\n$$\\hat{df} = \\frac{\\left(\\frac{s_a^2}{n_a}\
    \ + \\frac{s_r^2}{n_r}\right)^2}{\\frac{s_a^4}{n_a-1} + \\frac{s_r^4}{n_r-1}}$\n\
    ```\n\nThis formula is too long to enter manually every time that is needed. (A\
    \ suitable approximation for the degrees of freedom using $n_a + n_r - 2$ is often\
    \ used instead for reasonably large sample sizes.) But fortunately, R and other\
    \ statistical software have already done the formula inputting for us by introducing\
    \ relevant functions. While it is important to get good approximations to the\
    \ degrees of freedom in order to get the appropriate $p$-values, learning this\
    \ formula goes beyond the reach of those who need to trust the t-test. Therefore,\
    \ we will trust that R or other statistical packages provide for us.\n\nLet's\
    \ compute the $t$-test statistic. Recall the summary statistics we computed during\
    \ our exploratory data analysis in Section 9.6.1.\n\n```\nmovies_sample |>\ngroup_by(genre)\
    \ |>\nsummarize(n = n(), mean_rating = mean(rating), std_dev = sd(rating))\n```\n\
    \n```\n# A tibble: 2 x 4\ngenre mean_rating std_dev\n<chr> <int> <dbl> <dbl>\n\
    1 Action 32 5.275 1.36121\n2 Romance 36 6.32222 1.60963\n```\n\nUsing these values,\
    \ the observed two-sample $t$-test statistic is\n\n```\n$$\\frac{\bar{x}_a - \b\
    ar{x}_r}{\\sqrt{\\frac{s_a^2}{n_a} + \\frac{s_r^2}{n_r}}} = -2.906$\n```\n\nHow\
    \ can we compute the $p$-value using this theory-based test statistic? Could do\
    \ it by calculating the degrees of freedom and using the function pt() as we did\
    \ earlier."
  merge: -1
