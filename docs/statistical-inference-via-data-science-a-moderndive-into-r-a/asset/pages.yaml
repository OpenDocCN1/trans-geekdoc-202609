- pgno: 252
  md: "The first variable ID represents a virtual ID number given to each almond,\
    \ and the variable weight contains the weight in grams for each almond in the\
    \ bowl. The population mean weight of almonds, a parameter can be calculated in\
    \ R using again the dplyr wrangling verbs presented in Chapter 3. In particular,\
    \ inside the function summarize() the use of the mean(), sd(), and n() functions\
    \ for the mean weight, the weight's standard deviation,4 and the number of almonds\
    \ in the bowl:\n\nalmonds_bowl |>\n\n```\nsummarize(mean_weight = mean(weight),\n\
    \  sd_weight = sd(weight),\n  length = n())\n```\n\n# A tibble: 1 x 3\n\n```\n\
    mean_weight sd_weight <dbl> <int>\n1 3.64 0.392 5000\n```\n\nWe have 5000 almonds,\
    \ the population mean weight is 3.64 grams, and the weight's standard deviation\
    \ is 0.392 grams. We used R to compute the mean and standard deviation, but we\
    \ could have used the formulas instead. If we call $x_1$ the first almond in the\
    \ bowl, $x_2$ the second, and so one is given by\n\n$$\\mu = \\sum_{i=1}^{5000}\
    \ x_i = 3.64.$\n\nand the standard deviation is given by\n\n$$\\sigma = \\sum_{i=1}^{5000}\
    \ \\frac{(x_i - \\mu)^2}{5000} = 0.392.$\n\nThe Greek letters $\\mu$ and $\\sigma$\
    \ are used to represent the population mean and population standard deviation\
    \ (parameters of interest). In addition, since we know the information of the\
    \ entire bowl, we can draw the distribution of weights of the entire population\
    \ (bowl) using a histogram:\n\n```\nggplot(almonds_bowl, aes(x = weight)) +\n\
    geom_histogram(binwidth = 0.1, color = \"white\")\n```\n\n> As explained earlier,\
    \ this function produces the sample standard deviation, which divides the sum\
    \ of square deviations by $n-1$ instead of $n$, but for a list of 5000 observations\
    \ the difference is not relevant, for practical purposes."
