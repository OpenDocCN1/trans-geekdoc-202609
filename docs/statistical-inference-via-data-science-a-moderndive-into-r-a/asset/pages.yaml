  md: "# 10.1 The simple linear regression model\n\n# 10.1.5 Properties of the least\
    \ squares estimators\n\nThe least squares method produces the best-fitting line\
    \ by selecting the least squares estimators, $b_0$ and $b_1$, that make the sum\
    \ of residual squares the smallest possible. The choice of $b_0$ and $b_1$ depends\
    \ on the sample observed. For every random sample taken, different values for\
    \ $b_0$ and $b_1$ will be determined. In that sense, the least squares estimators,\
    \ $b_0$ and $b_1$, are random variables and as such, they have very useful properties:\n\
    \n+   * $b_0$ and $b_1$ are unbiased estimators of $\beta_0$ and $\beta_1$, or\
    \ using mathematical notation: $E(b_0) = \beta_0$ and $E(b_1) = \beta_1$. This\
    \ means that, for random samples, $b_1$ will be greater than $\beta_1$ and for\
    \ others less than $\beta_1$. On average, $b_1$ will be equal to $\beta_1$.\n\
    * $b_0$ and $b_1$ are linear combinations of the observed responses $y_1, y_2,\
    \ ..., y_n$. This means that, for example for $b_1$, there are known constants\
    \ $c_1, c_2, ..., c_n$ such that $b_1 = \\sum_{i=1}^n c_i y_i$.\n* $s^2$ is an\
    \ unbiased estimator of the variance $\\sigma^2$.\n\nThese properties will be\
    \ useful in the next subsection, once we perform theory-based inference for regression.\n\
    \n# 10.1.6 Relating basic regression to other methods\n\nTo wrap-up this section,\
    \ we'll be investigating how regression relates to two different statistical techniques.\
    \ One of them was covered already in this book, the difference in sample means,\
    \ and the other is new to the text but is related, ANOVA. We'll see how both can\
    \ be represented in the regression framework.\n\n# Two-sample difference in means\n\
    \nThe two-sample difference in means is a common statistical technique used to\
    \ compare the means of two groups as seen in Section 9.6. It is often used to\
    \ determine if there a significant difference in the mean response between two\
    \ groups, such as a treatment group and a control group. The two-sample difference\
    \ in means can be represented in the regression framework using a dummy variable\
    \ to represent the two groups.\n\nLet's again consider the `movies_sample` data\
    \ frame in the modernverse package. We will compare once more the average rating\
    \ for the genres of “Action”versus “Romance.” We can use the `lm()` to fit a linear\
    \ model with a dummy variable for the genre and then use `get_regression_table()`:\n\
    \n```\nmod_diff_means <- lm(rating ~ genre, data = movies_sample)\nget_regression_table(mod_diff_means)\n\
    ```"
  merge: -1
  img_proc: true
