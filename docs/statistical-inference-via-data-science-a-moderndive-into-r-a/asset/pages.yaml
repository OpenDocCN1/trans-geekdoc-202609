    \ = mean(weight))\n```\n\n```\n# A tibble: 1 x 2\nreplicate sample_mean_weight\n\
    <int>dbl\n1 3.67\n```\n\nSo, once this sample was observed, the random variable\
    \ $\bar{X}$ was realized as $\bar{X} = 3.67$, the **sample mean** was 3.67 grams.\
    \ Note that the possible values that $\bar{X}$ can take are all the possible sample\
    \ means from samples of 25 almonds from the bowl. The chances of getting these\
    \ sample means are determined by the configuration of almond weights in the bowl.\n\
    \nWhen $\bar{X}$ is constructed as the sample mean of a given random sample, the\
    \ sampling distribution of the sample mean is precisely the distribution of $\b\
