  md: '# 8.5 Summary and final remarks


    the true value of $p_{seed}-p_{control}$. In other words, if we gathered 100 samples
    of $n = 50$ participants from a similar pool of people and constructed 100 confidence
    intervals each based on each of the 100 samples, about 95 of them will contain
    the true value of $p_{seed}-p_{control}$ while not given. Given that this is a
    little winded, we use the shorthand interpretation: we are 95% “confident” that
    the true difference in proportions $p_{seed}-p_{control}$ is between (-0.238,
    0.302).


    There is one value of particular interest that this 95% confidence interval contains:
    zero. If $p_{seed}-p_{control}$ were equal to 0, then there would be no difference
    in proportion yawning between the two. This would suggest that there is no associated
    effect of being exposed to a yawning recruiter on whether you yawn yourself.


    In our case, since the 95% confidence interval includes 0, we cannot conclusively
    say either proportion is larger. Of our 1000 bootstrap samples with replacement,
    sometimes $p_{seed}$ was higher and those exposed to yawning yawned themselves
    more often. At other times, the reverse happened.


    Say, on the other hand, the 95% confidence interval was entirely above zero. This
    would suggest that $p_{seed}-p_{control} > 0$, or, in other words $p_{seed} >
    p_{control}$, and thus we''d have evidence suggesting those exposed to yawning
    yawn more often.


