    \ is related to the method used more than the semantics of the test. Let's break\
    \ this down: If, under the null hypothesis, the average weight is less than 3.6\
    \ grams, we can only find evidence against the null if we sample means are much\
    \ greater than 3.6 grams, hence the alternative hypothesis is $H_A: \\mu > 3.6$.\
