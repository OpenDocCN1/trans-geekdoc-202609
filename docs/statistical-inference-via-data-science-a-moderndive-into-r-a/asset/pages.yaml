    Notice how the data itself does not change, the Response: weight (numeric) metadata
    does. This is similar to how the group_by verb from dplyr doesn''t change the
    data, but only adds "grouping" meta-data, as we saw in Section 3.4.


    We can also specify which variables are the focus of the study by introducing
    a formula = y ~ x in specify(). This is the same formula notation you you saw
    in Chapters 5 and 6 on regression models: the response variable y is separated
    from the explanatory variable x by a ~ (tilde). The following use of specify()
    with the formula argument yields the same result previously:


    ```

    almonds_sample_100 |>

    specify(formula = weight ~ NULL)

    ```


    In cases of almonds we only have a response variable and no explanatory variable
    of interest. Thus, we set the x on the right-hand side of the ~ to be NULL.


    In cases where inference is focused on a single sample, as it is the almonds''
    weights example, either specification works. In the examples we present in future
    sections, the formula specification is simpler and more flexible. In particular,
    this comes up in the upcoming Section 8.4 on comparing two proportions and Section
