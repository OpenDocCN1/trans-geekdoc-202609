- "# 初学者 Python 机器学习：神经网络入门指南以及 Python 编程与编码时需要了解的流程概述\n\n\n\n![](img/rsrc7.jpg)\n\
  ![](img/rsrc7.jpg)\n\n\n关于神经网络的介绍，以及在使用 Python 进行计算机编程和编码时需要了解的流程简要概述 [Michael Learn]\n\
  \n\n\n\n\n\n\n\n\n\n\n\n# 引言\n\n机器学习已经渗透到我们日常生活的许多方面，从优化 Netflix 推荐到 Google 搜索不一。机器学习有助于改进智能建筑空间中建筑构造的不同方面，并提升居住者的体验。你不需要拥有博士学位就能理解机器学习的不同方面和功能。本节涵盖了关于机器学习的一些非常基础且重要需要了解的事实。\n\
  \n## 机器学习的分支\n\n监督学习和无监督机器学习是程序员和科学家用来帮助机器学习的两种技术。智能建筑结合了这两种类型。以下是关于这些机器学习类型形式的简单示例：\n\
  \n假设你想教计算机识别蚂蚁。当你使用监督学习方法时，你会告诉计算机蚂蚁是一种昆虫，可以是小小的也可以是大的。你还需要告诉计算机蚂蚁可以是红色的也可以是黑色的。当你使用无监督方法时，你需要向计算机展示不同的动物组，然后告诉计算机蚂蚁长什么样，再向计算机展示另一组图片并要求计算机识别蚂蚁，直到计算机学会了蚂蚁特有的特征。\n\
  \n智能建筑空间同时使用监督和无监督机器学习技术。这些智能建筑中的应用允许用户向建筑提供反馈，以提高建筑的效率。\n\n## 机器并非全自动的\n\n机器学习帮助计算机实现自动化、预测和进化，但这并不意味着它们可以接管世界。机器学习使用的是人类开发的算法。因此，机器学习仍然需要人类，因为人类需要设置参数并使用不同的训练数据集来训练机器。\n\
  \n机器学习帮助计算机发现人类无法观察的模式。然后计算机将对系统进行调整。然而，识别和理解为什么存在这些模式并不是件容易的事。例如，在智能建筑中，人类创造智能建筑是为了确保建筑内的人能够帮助改善人们的生活条件。但是，不能指望机器会学会变得更有生产力。人类必须设定建筑需要遵循的定义和规则。\n\
  \n## 任何人都可以使用机器学习\n\n编写机器学习算法与学习如何使用该算法有很大不同。毕竟，当你使用手机上的 App 时，不需要学习如何编程。最好的平台总是会创建程序的抽象，为用户提供界面，这种界面只需要极少的培训即可使用。如果你了解机器学习的基本概念，你就可以出发了！而数据科学家则必须编辑或更改算法。\n\
  \n机器学习已经进入了时代并正在快速增长。建筑正在以不同的方式使用机器学习，使现有基础设施更加高效，并帮助增强建筑内居住者的体验。从能源使用的角度来看，建筑始终在学习和分析居住者的需求。\n\
  \n## 这对我们未来产生什么影响？\n\n机器学习的这一进展意味着大多数事情将在我们不需要询问的情况下发生。机器学习工程可能超出照明和温度管理的范围。机器学习意味着未来将存在某种多层、多级的自动化状态，并根据当前的活动进行调整。\n\
  \n## 数据转换是工作的所在\n\n当你阅读机器学习的各种技术时，你可能会认为机器学习主要关于选择正确的算法并调整该算法使其准确运行。现实是平淡的——你的大部分时间都花在了清洗数据上，然后将这些数据转换为原始特征，这些特征将定义你的数据之间的关系。\n\
  \n## 机器学习的革命已经开始\n\n在 20 世纪 80 年代，计算能力和计算机经历了快速的发展和进步。这引发了对人工智能、计算机和机器学习的巨大恐惧和兴奋，它们可以帮助世界解决各种问题——从家务的单调劳动到疾病。随着人工智能和机器学习作为正式的研究领域而发展，要将这些想法和希望变为现实变得更加困难，人工智能因此退缩到了理论和幻幻的世界。然而，在过去的十十年里，数据存储和计算的进步再次改变了局面。机器现在能够处理那些曾经对它们来说难以学习的任务。\n\
  \n\n\n\n\n# 第一章：Python 机器学习简介 ![](img/rsrc3D.jpg)\n\n机器学习既是能够从数据得出意义的算法的应用，也是一门科学。它是计算机科学领域一个极令人兴奋的部分，无论你是否认同，它都会一直存在。当今世界充满了数据，并且使用了具有学习能力的算法。这意味着这些数据可以被用来创造知识。在过去的几年里，已经开发了许多开源库，其中一些非常强大，这意味着我们可能正处于开始真正理解机器学习的最佳时期，开始学习如何使用这些算法来发现数据模式并预测未来事件。\n\
  \n你还记得你获得第一台电脑的时候吗？对于大多数人来说，那个设备对他们来说如此陌生，以至于他们不知道该用它做什么。毫无疑问，对于许多人来说，即使不知道它的真实用途，他们仍然想要一台。即使在今天，仍许多人发现电脑只不过是一个玩游戏、狂看喜欢的电视节目或流媒体心仪音乐的绝佳设备。但如果你知道如何挖掘这些妙设备的真正潜力，你可以做很多惊人的事情。一旦一个人知道该如何操作现代机器，事情就会开始发生巨大的变化。我们可以轻松地处理一项任务并超越基础。当这种情况发生时，计算机就远比一个能在几秒内破解计算和数字的华丽计算器要有用得多。要达到这一点，你必须理解几点。\n\
  \n机器现在不需要自动编写其功能的每一个细节。它们可以被编程为学习许多任务，并进行必要的调整以执行功能，从而使其工作得更高效。坦率地说，许多人认为某些计算机功能是先进技术，实际上只是可以很快完成的内容。例如，每台电脑的核心都是一个非常复杂的计算器。当计算机执行我们认为迷人的操作时，它只是机器在执行许多数学方程以产生我们想要的结果。你可能想把喜欢的电影流到电脑上。你点击几个按钮，几秒钟后，场景就开始在你眼前播放。实际上，这个功能只不过是计算机在后台运行一系列基础数学题，计算总和并将它们重构为屏幕上的视频。\n\
  \n这听起来像科幻小说，但由于神经网络的创建，这种可能性是完全真实的。简单来说，神经网络是一系列称为算法的数学公式，用于识别一组数据中的关系。网络可以通过模拟人类大脑及其工作方式来实现这一点。这些是复杂的网络，能够适应不断变化的数据，以便在不需要重新设计获得最佳输出所需的标准的情况下，获得尽可能好的结果。更简单地说，神经网络向计算机系统注入灵活性的手段，使其处理数据的方式类似于人类大脑的工作方式。当然，计算机仍然将以与其他机器相同的方式制造，但随着每一次改进，它们正变得越来越接近**[我们可以通过寻找变量之间的关系来预测结果]**。让我举个例子吧。我们有一级学生，我们想要尝试预测他们的\
  \ SAT 分数。如果我们能找到每个学生学习时长与分数之间的联系，那么我们就可以使用这些数据来学习模型，利用学习时长来预测未来学生获得的分数。\n\n\n\n\n\
  \n# 机器学习系统——构建路线图\n\n到目前为止，我们已经查看了基础机器学习概念和不同类型的机器学习。现在，我们需要查看机器学习系统的其余部分，即与算法配合的重要组成部分。有三个重要的子部分需要考虑。\n\
  \n## 预处理\n\n预处理是将我们的数据处理成特定形状的行为。原始数据很少具有学习算法正常工作所需的正确格式或形状。花卉图像就是原始数据，我们将从中寻找有意义的特征。这些特征可以是颜色、强度、色调、高度、花朵长度、花朵宽度等。许多机器学习算法为了获得最佳性能，还要求所选特征处于相同的尺度上，这通过将特征转换到某个范围或使用具有“零均值单位方差”的标准分布来实现。\n\
  \n所选择的某些特征可能存在相关性，这意味着在某种程度上它们是冗余的。在这种情况下，我们可以使用维度还原来将这些特征压缩到较低的子空间中。通过这样做，我们不需要大量的存储空间，算法运行速度也会显著加快。在某些情况下，降维还可以使预测模型的性能更高效，特别是当数据集包含多个噪声实例（不相关的特征）时——你经常会看到信噪比很低。\n\
  \n为了查看算法在训练数据集上的表现是否符合预期，同时对新数据做出积极反应，我们需要将数据集随机划分为两组——训练集和测试集。训练数据集用于训练模型并优化性能，而测试集在最后用于评估完成的模型。\n\
  \n## 训练和选择预测模型\n\n你将在整个指南中看到，许多算法都是为了解决特定问题设计的。有一点重要的需要记住——学习不是免费的。这个概念很容易联系到亚伯拉罕·马斯洛（Abraham\
  \ Maslow）在 1966 年的另一句流行名言——“我想，如果你手有的工具是一把锤子，那么把一切都看作钉子是很诱惑人的”。让我们结合语境来看待这一点。每一个分类算法都内置了偏差。只要我们不对任务做出任何假设，没有哪一个分类模型是优于其他任何模型的。在实际操作中，比较几个算法至关重要，以便选择并训练出最佳模型。\n\
  \n然而，在我们这样做之前，我们需要决定使用哪种指标来衡量性能。最常见的指标之一是分类准确率，它被定义为分类正确的实例比例。但但是（这是一个合理的问题），如果测试集仅用于最终评估，而不用于模型选择测试，那么我们又如何知道哪一个模型在最终测试和真实世界数据上表现最好呢？为了解决这个问题，我们可以使用多种交叉验证技术——将训练数据集分为两个子集：训练集和验证集。这样做是为了估计模型的泛化性能。\n\
  \n最后，尽管许多软件库提供了学习算法，但我们不应该理所当然认为这些算法的默认参数会适用于我们正在尝试解决的特定问题。相反，我们将使用称为“超参数优化”的技术来微调模型性能，我们稍后会看到是如何做的。基本上，超参数可以被看作无法从数据集中学习的参数，相反，它们代表了我们可以旋转以提高模型性能的“旋钮”。\n\
  \n## 模型评估和对未见数据的预测\n\n一旦我们有了模型，就可以测试数据集来估计模型在未见数据上的表现。通过这种方式，我们可以获得误差的估计。如果我们对模型的性能表示满意，就可以用它来预测未来数据。请注意一点——至关重要的是，我们提到的参数（如维度还原和特征缩放）必须从训练数据集中获得，然后应用于测试集对其进行转换。如果我们不遵守这一点，性能可能会过于乐观。\n\
  \n### 机器学习的问题\n\n机器学习仍在演变，并且每天都在被使用。随着使用频率的增加，我们会发现更多待解决的问题。虽然其中一些问题尚未解决，但并不意味着未来没有解决方案。一个问题是自然语言处理和语言理解仍然是一个难题。由于语言语言，机器很难解码所说的话，但这并没有阻止它们的尝试。诸如\
  \ `Alexa`、`Siri` 和 `Cortana` 这样的程序正在不断更新，以便更好地服务用户。\n\n图像可以通过机器学习进行分类，但机器无法理解图像中发生了什么。通过理解图像中发生了什么，这导致了语义分割。机器应该被教会如何识别图像中的像素，以便我们可以更好地理解。\n\
  \n深度学习也需要稳定。如果某物是坏的，为什么要去尝试修复它？有时候旧的方法是有效的。随着深度学习的稳定，这将是可能的。这将允许深度学习处理尚未触及的难题，例如\
  \ `Montezuma's revenge`。此外，控制人的能力将呈指数级增长，可能性是无限的。无法预测机器人将发展到什么程度，因为它们能够找到获得奖励的方法；换句话说，它们将被赋予像人类一样的选择权。GANs（生成对抗网络）是与特定类别工作的一类算法，它们将使用无监督学习。虽然它们对于使用机器学习的游戏来说很棒，但它们会让游戏变得困难，因为它们经常崩溃。训练深度网络也是一个问题，这已被“梯度破碎”（shattering\
  \ of gradients）论文所证明。这还导致没有人完全理解深度网络在做什么。关于深度网络是什么以及为什么需要它们，有些人认为它们倾向于让生活变得复杂。那么，为什么会有深度网络？我们真的需要它们吗？\n\
  \n最后，人们应该停止担心像 `Skynet` 之类的事情及其经济影响。首先，`Skynet` 是电影《终结者》（Terminator）中的一个虚构公司，并且不会发生。在机器人做出自己的决定之前，无疑会有一套安全措施确保机器人不会反抗人类并试图杀掉他们。所有\
  \ `Skynet` 的事情都是人们喜爱的电影情节。其次，机器学习的经济影响是什么？通过机器学习，公司将能够发现赚更多钱，这意味着更多的资金将投入经济！除了机器学习中的某些事情尚未稳定并没有很多问题。很难忘记，机器学习仍处于婴儿阶段，并随着技术的演变仍在训练，所以我们必须保持耐心，并记住在它们被修复之前会有更多问题。\n\
  \n## 尚未解决的机器学习问题\n\n机器学习随着技术的发展而演变，因此在找到答案之前，总会有问题需要处理。会有这些问题的解决方法，即使没有，你也可以分析并获得数据。一个，变量事件空间尚未解决。为了解决这个问题，我们需要能够以有效且有意义的方式响应分类系统，即使事件空间与训练数据不同。\n\
  \n另一个问题是处理语言时缺乏上下文理解。上下文分析对机器学习来说很重要，因为它留下了大量被误解的空间。一种可能的解决方案是 `open AI` 团队应该提出的解决方案，允许代理创建自己的规则，而不是让它们寻找模式。\n\
  \n面部识别正迅速成为人们解锁设备的流行方式，因为它是一种快速且半安全的防止设备被破解的方法。然而，这并不意味着完美，因为具有相似特征的人进入你的手机。不仅如此，面部识别对于外观不起作用。\n\
  \n自动学习是机器学习的大部分，如果机器不能自动学习它应该学习的内容，那么它将毫无用。学习必须来自各种资源，当这些资源缺失时，自动学习将会遇到障碍。例如，`IBM's\
  \ Watson` 表现出色，但仍然需要一个倾向于通用智能的系统。\n\n在某些机器学习中，机器将根据偏离空间做出自己的决定；但那不会包括这些。这也是一个问题，因为解决它的技术尚不存在。\n\
  \n## 可以解决的问题\n\n机器学习正在帮助许多公司以及人们的日常生活。在这一节中，你将看到上面提到的尚未被机器学习解决的一些点。尽管该特定的机器学习部分存在问题，但并不意味着它不起作用。有时这些问题可以在开发者没有发现的稍后日期进行补丁或修复。\n\
  \n机器学习有助于垃圾邮件检测。当你进入收件箱时，总会有邮件由于关键词被自动路由到垃圾箱。然而有些垃圾邮件漏掉了。垃圾邮件检测还有很长的路要走，但随着规则的制定它正在变得更好。你是否想过信用卡公司是如何知道有人使用了你的卡的？这是因为他们保留了交易记录！每个月，信用卡公司都知道你常去的商店和消费金额。如果他们发现任何超出你通常区域或通常消费金额的活动，他们会认为卡片被盗并报告。通过机器学习，公司将发现赚更多钱的方法，这意味着更多的资金将投入经济！\n\
  \n请记住，在它们被修复之前，会有更多问题。\n\n\n\n\n\n# 第 2 章：神经网络的过程 ![](img/rsrc7W.jpg)\n\n既然你已经对深度学习及其应用有了更多的了解，我们现在就可以讨论神经网络架构了。对于机器来说，神经网络非常重要。一个编程良好的神经网络将帮助机器像人一样思考并以这种方式处理信息。这些网络由层组成。这些层可以处理许多类型的信息。每一层由神经元组成，神经元共同工作以解决问题。由于神经网络帮助机器像人类一样思考，因此带有神经网络的机器具备学习能力是合理的。模式识别和数据分类是这些机器的用途之一。当神经元发生变化和调整时，网络就能像人类一样进行学习。\n\
  \n一个不涉足 AI 的人，也就是你在街上可能会交到的人，在得知他们已经遇到过很多人工智能和其他各种机器学习时可能会感到震惊。一些最受欢迎的公司投入了数百万美元用于能够改进其业务的研发。其中一些公司是\
  \ Apple、Google、Facebook、Amazon 和 IBM。尽管你可能不知道，我们的日常生活可能已经受到了这些研究的影响。例如，通过互联网搜索，你将在网站和搜索结果中看到与你输入的关键词匹配的选项。机器学习对这一点非常重要，因为它是允许浏览器过滤数百万种可能推荐的主要手段。同样的原理也用于\
  \ Netflix 推荐或帮助过滤邮件的垃圾邮件过滤器。在医学行业，这被用于药物分类，并在人类基因组计划中起着重要作用，它会处理 DNA 中数无数的模式组合，这些组合可以告诉你关于你的家族史、风险因素或健康前景的状况。\n\
  \n这些系统适用于大多数行业，因为它们具有高度的适应性和复杂性。这是通过引导计算机完成许多学习过程的算法实现的。通过正确的算法，你可以教会系统检测模式中可能发生的异常行为。这有助于系统学习预测在各种情况下可能出现的可能结果。\n\
  \n人工神经网络是包含不同类型算法、数据接收器以及许多其他元素的产物。自 20 世纪 50 年代引入以来，人工神经网络一直是科学未来问题的一种解决办法。它们的结构模式与人类大脑非常相似。它们允许机器在编程的训练阶段进行学习。这些知识随后被作为应用于未来问题的解决方案的基础。\n\
  \n## 历史背景\n\n神经网络在计算机出现之前就已经存在了。问题在于人们还不够熟练到可以利用它们。这就是为什么最近神经网络领域取得的进展如此重要的原因。计算机技术的任何发展都有助于神经网络的研究。一种狂热开始了，人们开始对该领域充满热情。然而，大多数尝试都是徒劳的，因为没有出现能够提高我们机器效率和准确性的进展。热情开始减少。然而，一些研究人员坚持不并继续他们的研究。他们努力工作开发出了我们现在拥有的——一种被行业内大多数人接受的技术模型。\n\
  \n第一个人工神经网络是由 Warren McColloch 和 Walter Pitts 在 1943 年制造的。这被称为 `McCulloch-Pitts`\
  \ 神经元。该网络并未被用于执行或自动化复杂任务，因为这对组合缺乏进一步开发网络所需的技术。\n\n## 它们是什么？它们是如何工作的？\n\n人工智能、机器学习和深度学习等术语都是指神经网络中正在发生的过程。在机器学习的方式上，人们可能会持怀疑态度。然而，我们向你保证，这确实意味着它们像人类大脑一样被训练。一个由具有大量微小连接的简单处理器组成的计算分布式模型是思考这些网络的一种好方法。人类大脑由许多许多神经元组成，这些神经元通过突触连接在一起，允许它们在大脑皮层进行分析。学习是通过大脑中连接的变化实现的，这让我们能够习得新技能并学习新技能，从而解决问题。思考这些网络的一种好方法是将其想象为由数百（或成千上万）个微连接集成的许多并行处理器。在人类大脑中，有数百万个神经元通过突触相互连接，允许它们在大脑皮层进行计算和分析。随着这些连接的形成，学习得以实现，让个人获得新技能以解决问题。通过链接连接的数百个同类单元是神经网络的元素。连接的独特配置和简单性使得这种设计非常美丽。数据通过输入层进入网络并到达输出层。同时，数据通过中间的许多层进行处理，直到计算出并执行最终解决方案。在早期，传输信息的少数单元是简单神经网络的核心。然而，今天，一个网络可以由数百万个交织并共同工作的不同单元组成，以模拟学习过程。更现代的网络能够许多方式解决非常困难和复杂的问题。\n\
  \n## 为什么要使用神经网络？\n\n大量的数据被用于改进行业本身。这些数据集中有许多变量，这使得人类难以发现出现的模式。通过神经网络，我们可以更容易地识别这些模式。没有它们，计算机识别数据集中的趋势将是一项艰巨的任务。通过花时间训练神经网络，工程师可以向网络输入巨大的数据集，使其成为特定领域的专家。通过这个训练过的网络，工程师可以预测任何可能输入的输出。这也让工程师能够回答一些关于未来的问题。神经网络有许多优点，以下是其中一些：\n\
  \n- 由于使用了监督机器学习，神经网络可以适应新任务并学习如何做新事情。\n- 网络可以报告在学习阶段喂给它的任何信息。\n- 具有神经网络架构的机器工作速度快得多，提供的结果更准确。这是因为并行计算数据的能力。\n\
  - 神经网络可以很容易修复。虽然如果网络损坏性能会受到影响，但网络仍然记得某些属性。\n\n## McCulloch-Pitts 神经元 - 它是什么？\n\n\
  人类大脑和人工神经网络之间有许多相似之处。这是合理的，因为这些网络是为了模拟人类大脑而制造的。很容易理解。以下是它们之间的一些相似之处：\n\n- 数百万个人工神经元构成了它们，每一个都可以计算并解决问题。\n\
  - 每个神经元都有许多不同的连接。\n- 它们是非线性和并行的。\n- 它们可以通过单元之间连接的变化来学习。\n- 它们在发现错误时会适应新知识，而不是惩罚自己。\n\
  - 根据它们从未遇到过的数据，它们可以产生输出。\n\n这些都描述了神经网络如何工作。虽然它们在表面上非常相似，但我们应该看神经网络整体是如何工作的。McCulloch-Pitts\
  \ 神经元是神经网络的单元。连接的独特配置和简单性是这种设计美丽的原因。数据通过输入层进入网络并到达输出层。在大脑中，处理的基本单元是神经元。人工神经网络由以下三个元素组成：\n\
  \n- 连接的权重和突触\n- 总结并处理输入信号的代理\n- 限制神经元输出的系统\n\n1940 年代是`MCP`神经元首次引入的时间。这种神经元源于逻辑学家\
  \ Walter Pitts 和神经科学家 Warren S. McCulloch。他们试图理解人类大脑内部发生了什么，通过连接产生并复制复杂的模式。旧系统的设计非常简单。输入被量化为\
  \ 0 到 1，输出被限制在相同。每个输入都是抑制性的或兴奋性的。这种简单性限制了机器的学习能力。虽然有时简单性很棒，但它也有它的缺点。理解复杂话题的能力。`MCP`神经元本应该汇总所有输入，如果输入为正则加\
  \ 1，如果为负则减去 1。\n\n## 神经网络对比计算机\n\n神经网络和计算机对每个问题都应用相同的解决方案。后者通常使用算法来寻找解决方案。这告诉我们人类和计算机可以解决类似的问题。计算机闪光的地方在于解决人们不能解决的问题。正如我们多次提到的，人类大脑和神经网络以类似的方式工作：通过相互连接的神经元网络。这些网络通常并行工作以达到最佳效率。工程师可以通过给出一个示例来完成任务，这意味着喂给系统的数据选择非常重要。如果你在选择数据时不小心，可能会让系统更难学习。由于喂给的数据，过程是不可预测的。使用高级编程语言，只需要几步就能为计算机提供指令，随后将这些指令翻译成计算机可以理解的语言。如果计算机在处理时出现问题，它与神经网络协同工作。算术计算是神经网络最好解决的任务。\n\
  \n## 神经网络的类型\n\n### 全连接网络\n\n神经网络是最基本的类型。它由相互连接的神经元层组成。输入层是第一层。它连接到隐藏层，然后到输出层。输入层是工程师向系统提供数据。输出取决于隐藏层之间的权重。这种架构很简单，但仍然有趣，因为隐藏层可以用许多方式表示数据。之前提到的权重是连接层的神经元。它们还决定了这些层何时被激活。工程师可以修改这些权重并改变层相互作用的方式。多层和单层架构很容易区分。由于层相互连接，网络的处理能力最大化。在这里神经元不是相互连接的，但层是。\n\
  \n### 前馈网络\n\n这种网络有几个名称。自下向上或自上向下都是馈馈网络的替代名称。这意味着信号和数据只向一个方向流动，从输入点到输出点。这个网络没有反馈回路。这意味着一个实例的输出不会影响另一层的输出。这是最简单的网络之一，因为输入直接与输出。这种网络通常用于识别模式。\n\
  \n### 卷积神经网络\n\n全连接网络与卷积神经网络最相似。由许多神经元组成的许多层构成了这个系统。每个神经元被分配了一个权重。这是由于教学阶段使用的训练数据。当给神经元输入时，它们将进行点积，随后是非线性。`CNN`\
  \ 查看原始数据集中的每个输入，使得网络更容易使用向前函数。这些类型的神经网络被大多数深度学习程序使用。\n\n### 反馈网络\n\n反馈网络由于信号的移动而具有特殊性。它们向两个方向流动并在网络中产生循环。这些网络极难制造，但非常强大。网络将在绝对平衡状态下运行，直到你产生变化。这种不断变化的状态将持续到系统再次平衡。如果工程师向系统提供一个新的数据集，它将尝试寻找一个新的平衡点。这就是反馈网络是循环和交互性的原因。\n\
  \n### 循环神经网络\n\n循环神经网络是特殊的，因为信息总是循环。网络会考虑输入并在一旦决定后评估它所学到的内容。`RNN` 通常具有短期记忆。结合长短期记忆（`Long\
  \ Short-term memory`），它获得了长期记忆。不使用示例很难解释 `RNN`。假设你使用的网络是普通的馈馈神经网络。假设你输入单词“brain（大脑）”。系统会将单词拆分为字符并逐个处理它们，总是忘记之前的字符。这意味着这个模型无法预测下一个字符是哪个，除非它已经出现。由于其内部内存，`RNN`\
  \ 记得之前的字符并预测下一个。在产生输出时，它将其复制并放回网络本身。遵循：\n\n- 当前数据\n- 最近数据\n\n### 生成对抗网络\n\n`GAN`\
  \ 也称为生成对抗网络，由两个相互对斗的网络组成。因此，我们称其为对抗网络。`GAN` 可以被系统中的大多数工程师使用，因为它可以学习模仿任何分布或数据集。它可以被用于在许多领域构建独特的东西。它可以同时处理图片、语音等。你一定会被这些网络的输出感到惊讶。生成器和判别器是这个网络的部分。判别器评估生成器创建的实例，而生成器创建数据实例。\n\
  \n\n\n\n\n\n当 Guido van Rossum 在 20 世纪 80 年代后期开发第一个 Python 语言编译器时，他万万没想到这种语言在机器学习和人工智能领域的知名度将超过许多流行的语言。事实是——在过去的几年里，Python\
  \ 语言已成为成为解决大多数机器学习问题的解决方案。Python 语言对初学者非常友好，却又强大。难怪 Python 语言在 Google、Pinterest、Mozilla、Survey\
  \ Monkey、Slideshare、YouTube 和 Reddit 等一些最流行的系统中，作为核心开发语言被广泛应用。\n\n此外，无论你是初学者还是高级程序员，Python\
  \ 的语法都极其易于理解和遵循。如果你是 `C`、`C++`、`Java` 或 `Perl` 的高级开发者，你会发现在 Python 中进行编程极其简单。如果你是一个经验丰富的开发者，你可以用\
  \ Python 成就巨大的事业。除了开发游戏、数据分析和机器学习之外，Python 语言还可以用于编写通用 AI 系统和图形用户界面（GUI）的开发。本章将探索你如何用\
  \ Python 语言工程化机器学习系统。让我们开始吧。\n\n## 开始使用 Python\n\n显然，要在 Python 中启动机器学习系统的开发，你需要在你的电脑上安装它并设置编程环境。如果你是一个新手\
  \ Python 程序员，学习 Python 安装的基础知识和环境搭建将对提升你的水平大有裨益。\n\n### 安装过程\n\n下载和安装 Python 语言解释器的过程非常简单。如果你使用的是最新的\
  \ Linux 发行版——无论是 `Ubuntu`、`Fedora` 还是 `Mint`——你会发现系统中已经安装了最新版本的 Python。你只需要更新你的系统即可。\n\
  \n如果你使用的是基于 Debian 的 Linux 发行版，请按照以下步骤更新系统：\n- 启动终端（Terminal）应用并在命令行提示符输入以下命令：`su\
  \ apt-get update`\n- 输入你的 root 密码并按回车\n- 等待更新过程完成\n\n如果你使用的是基于 Redhat 的 Linux 发行版（如\
  \ `Fedora`），请按照以下步骤更新系统：\n- 启动终端（Terminal）应用并在命令行提示符输入以下命令：`su apt-get update`（注：此处原文命令可能存在误误，通常\
  \ Redhat 系使用 `yum update`）\n- 输入你的 root 密码并按回车\n- 等待更新过程完成\n\n另一方面，如果你使用的是 Linux\
  \ 以外的其他操作系统，你必须下载并安装 Python。此外，如果你使用的是没有 Python 的旧版本 Linux，你必须手动安装。请按照下面的步骤在 Linux\
  \ 上安装 Python：\n- 启动终端（Terminal）应用（确保你已连接网络）\n- 在命令行提示符输入 `su` 并按回车\n- 输入你的 root\
  \ 密码并按回车\n- 如果你使用的是基于 Debian 的 Linux（如 `Ubuntu`），在命令行提示符输入：`apt-get install python`\
  \ 并按回车\n- 另一方面，如果你使用的是 Red Hat/RHEL/CentOS Linux 发行版（如 `Fedora`），在命令行提示符输入：`yum\
  \ install python` 并按回车\n- 等待安装完成。如果是基于 Debian 的 Linux，输入 `su apt-get update`；如果是\
  \ Redhat/RHEL/CentOS Linux，输入 `su yum update`。\n\n### Windows 系统呢？\n\n在下载和安装 Python\
  \ 之前，先决定你想安装的 Python 版本。根据经验，始终选择最新版本。写本书时，最新版本是 3.6。以下是帮助你在 Windows 上安装 Python\
  \ 的步骤：\n- 访问 `www.python.org` 并下载当前版本的 Python。根据你操作系统的位数（32 位或 64 位）选择合适的版本。\n-\
  \ 打开下载的 Python 文件\n- 点击屏幕上的“接受设置（Accept the settings）”并等待安装过程完成\n\n如果你是 Mac 用户，你会发现系统已自带\
  \ Python 2.7。因此，如果你想开始使用 Python，不需要安装任何内容。如果你想安装最新版本的 Python，需要使用 Homebrew。\n- 打开终端或你喜欢的模拟器\n\
  - 在命令行提示符输入以下命令：`/user/bin/ruby -e \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/install)\"\
  `\n- 现在在命令行提示符输入 `brew install python` 安装 Python 解释器\n- 等待安装过程完成\n\n## 安装好 Python\
  \ 后做什么？\n\n现在是时候开始开发机器学习系统了。但现在要决定使用哪种文本编辑器。你可以选择合适的编辑器来帮助编码和执行程序。一些流行的编辑器有 `Emacs`、`Geany`、`Komodo\
  \ Edit` 和 `Sublime Text`。由于我们都知道这些文本编辑器的缺点——我不建议你使用它们。相反，请使用 Python IDE（集成开发环境）。IDE\
  \ 具有以下功能：\n- 语法高亮\n- 代码语句自动补全\n- 智能缩进\n- 带有单步、持久断点和调用栈可见性的调试器\n\n### 启动 Python\n\
  \n要开始，必须学会如何启动 Python。你可以从终端启动 Python，或者使用桌面环境启动 IDLE。只需启动终端并在命令行提示符输入 `idle`。现在你已经启动了\
  \ Python，是时候开始编码了。按照以下步骤编写你的第一个 Python 程序：\n- 打开 Python IDLE\n- 在 IDLE 窗口中编写 Python\
  \ 语言语句（指令）\n- 运行程序\n\n就是这样！简单吧？现在有一个查看编程过程运行的快捷方法……将以下代码复制并粘贴到你的 Python IDLE 窗口中。\n\
  \n```python\nprint (\"Hello World! This is first Machine Learning program\")\n```\n\
  \n运行程序。你看到了什么输出？“Hello World! This is first Machine Learning program”。恭喜！你刚刚写了第一个\
  \ Python 代码。我知道你现在急于开始编写机器学习系统了。不用太担心语句的含义。如果你是机器学习新手，掌握一些 Python 编程概念将帮助你理解如何设计机器学习应用。接下来，让我们一起深入学习\
  \ Python 编程的基础。\n\n## Python 概述\n\n现在你已经执行了第一个程序，还需要了解什么？现在是时候理解任何 Python 代码的关键组成部分，包括它的结构了。所有的\
  \ Python 程序都具有以下结构：\n\n```python\nimport sys\ndef main ():\n    if len(sys.argv)\
  \ == 10:\n        name = sys.argv[2]\n    else:\n        name = “Introduction to\
  \ Machine Learning.” print (“Hello”), name\n```\n\n从这个程序可以看出，所有的 Python 代码都应该以 `import`\
  \ 开始。现在，我们在导入什么？Python 语言是面向对象的，因此它具有所有面向对象语言的组件。其中一个属性是继承，简单来说就是代码重用。继承代码的功能允许程序员重用其他编写的代码。从技术上说，`import`\
  \ 语句告诉 Python 解释器声明已使用的类，无需引用它们的全名。例如，`import sys` 语句在 Python 程序启动时告知包含所有系统库。`def\
  \ main ():` 语句是什么意思？每当 Python 程序加载并执行时，计算机的内存（随机存存储器 RAM）都包含函数定义的对象。函数定义为程序员提供了指令控制单元将函数对象放入计算机内存适当部分的能力。换句话说，这就像指令控制单元检查主内存并初始化需要执行的程序。例如，下面的\
  \ Python 代码创建了一个函数对象并将其命名为 `main`：\n\nPython 的不同元素有哪些？所有的 Python 程序都包含以下内容：\n- **程序语句（Program\
  \ statements）**：程序语句是告诉控制单元执行给定操作的句子或指令。与大多数编程语言不同，Python 语句末不需要分号。\n- **空白符（Whitespace）**：空白符是制表符、空格和换行符/回车符的总称。Python\
  \ 语言对空白符在代码中的位置有严格要求。\n- **转义序列（Escape sequences）**：转义序列是用于输出的特殊字符。例如，程序中的 `\\n`\
  \ 告诉 Python 在新行输出。\n- **程序注释（Documenting the program）**：程序中除第一行外的任何以 `#` 开头的语句都被视为注释，并在执行期间被忽略。这允许你对代码部分进行说明。\n\
  - **关键字（Keywords）**：关键字是解释器识别并理解的指令。例如，`print` 词就是一个关键字。在 Python 中，有两种主要类型：函数（functions）和控制（control）。函数是简单的动词，如\
  \ `print`，告诉解释器做什么；控制执行流。\n- **模块（Modules）**：Python 程序带有很多模块，这增加了其功能性。模块将帮助你以易于调试的方式组织代码。\n\
  \n## 变量\n\n在运行程序时，计算机内存中发生了很多事情。理解变量和数据类型将帮助你编写高效的程序。程序简单的一一组指令（语句），引导计算机执行特定任务。例如，之前的程序打印了“Hello\
  \ World! This is first program”，在屏幕上输出之前，有些数据必须保存在内存中。数据类型适用于所有编程语言——包括 Python——因此，理解内存中的数据管理是开发稳健、强大应用程序的第一步。变量可以被视为计算机内存中的临时存储位置，特别是随机存存储器\
  \ RAM。这种临时存储位置包含了你想在程序中使用的数据。换句话说，当你定义变量时，必须给它赋值。例如，下面的语句为两个变量分配了临时存储空间：`age, count=30`。\n\
  \n```python\nage = 10\ncount=30\n```\n\nPython 语言有不同的数据类型分类用于定义存储方法和数学操作。以下是 Python\
  \ 中的数据类型示例：\n- 数字（Numbers）\n- 字符串（String）\n- 列表（List）\n- 元组（Tuple）\n- 字典（Dictionary）\n\
  \n### a) 数字\n\n数据类型存储数值。每当你为变量分配特定值时，数字对象会自动初始化。例如，下面的代码创建了变量对象：\n\nPython 语言支持四种不同的数字类型，这些是：\n\
  - `int`：在声明时指有符号整数。这些包括从 8 位到 32 位的整数。\n- `long`：这些长整数。可以使用八进制和十六进制表示法。\n- `float`：这些是浮点数。它们的范围可能从\
  \ 8 位到 64 位。\n- `complex`：这些复数。\n\n### b) 字符串\n\n字符串作为计算机内存位置中连续字符集存储。Python 语言允许在定义字符串时使用单引号或双引号。字符串变量类型的子集可以使用切片运算符\
  \ `[]` 和 `[:]` 指定，索引从字符串开头的 0 开始。`+` 运算符执行字符串拼接（两个或多个字符串的连接），而 `*` 运算符执行字符串重复。\n\
  \n## Python 中的文件处理\n\n文件只是磁盘上存储了相关信息的命名位置。文件用于在硬盘等非易失性存储设备上永久地存储数据。你知道主内存——特别是 RAM——不能用于永久存储数据。因此，文件必须存储在永久存储设备上。当在辅助存储设备上创建文件时，相应的操作系统会自动生成以下文件信息：\n\
  - 文件名\n- 位置\n- 文件大小\n- 文件属性，如读/写、只读和存档（当你处理图像等非文本数据时使用此模式）\n\n### 文件对象属性\n\n一旦打开文件，就会自动创建一个与文件相关的此类文件对象。下面的\
  \ Python 代码说明了如何操作文件对象属性的示例：\n\n```python\nmyfile = open(\"Readme.txt\", \"wb\"\
  )\nprint \"The name of the file is: \", myfile.name\nprint \"Is the file closed\
  \ or not? : \", myfile.closed\nprint \"The opening mode is:\", myfile.mode\n```\n\
  \n上面的代码会输出：如果你想删除对数字对象的引用，可以使用单词 `del` 加上你想要删除的变量名。考虑下面的代码，它删除了两个已声明并使用的变量：`age`\
  \ 和 `count`：\n\n```python\ndel age, count\n```\n\n\n\n\n\n\n机器学习有很多模型。这些理论描述了为了实现理想目标而使用的启发式方法，允许机器自主学习。以下是一些最流行的模型列表和描述。\n\
  \n## 决策树\n\n几乎每个人都用过决策树技术。无论是正式还是非正式，我们都会根据以往经验从许多可能性中决定唯一的行动方案。这些可能性看起来像分支，我们选择其中一个并拒绝其他的。决策树模型因其决策过程以图形化绘制时形成的形状而得名。\n\
  \n决策树在接收输入值方面具有极大的灵活性。同样，树的输出可以是类别、二值化或数值形式。决策树的另一个优势在于，不同输入变量的影响程度可以通过它们被考虑的决策节点层级来确定。\n\
  \n决策树的缺点是，每个决策边界都是强制性的二分拆分。它没有细微差别。每个决策要么是是，要么是否，要么是 1 或 0。此外，决策标准一次只能考虑单个变量，不能是多个输入变量的组合。决策树无法进行增量更新。这意味着，一旦在训练集上训练了树，就必须将其丢弃并创建一个新树来处理新的训练数据。\n\
  \n## 集成方法\n\n集成方法解决了许多树的局限性。本质上，集成方法使用多棵树来提高输出的准确性。有两种主要的集成方法——包法（bagging）和提升（boosting）。\n\
  \n包法集成方法（称为自助聚合）旨在减少决策树的方差。训练数据被随机分成若干子集，每个子集用于训练一棵决策树。所有树的结果取平均值，提供了比任何单一树更稳健的预测准确性。\n\
  \n提升集成方法类似于多级火箭。火箭的主助推器为车辆提供大量的惯性。当燃料耗尽时，它会分离，第二级将其加速度与已经赋予火箭的惯性相结合，依此类推。对于决策树来说，第一棵树在训练数据上运行并产生输出。下一棵树使用前一树的输出作为其输入。当输入存在误差时，赋予它的权重使得下一个树更有可能识别并至少部分缓解这一错误。运行的最终结果是从一系列弱学习器中产生一个强学习器。\n\
  \n## 线性回归\n\n线性回归方法的基础是假设输出（数值）可以表示为输入变量集（也是数值）的组合。一个简单的例子可能像这样：\n\n```\nx = a1y1,\
  \ a2y2, a3y3…\n```\n\n其中 `x` 是输出，`a1...an` 是赋予每个输入的权重，`y1...yn` 是输入。\n\n线性回归模型的优势在于它在评分和性能方面可以表现良好。它还具备增量学习的能力。线性回归模型的缺点是它假设输入特征是线性的，而事实可能并非如此。必须通过数学对输入进行线性测试。\n\
  \n## K-Means 聚类算法\n\nK-Means 聚类算法可对讨论相似概念的结果进行分组。因此，算法会将所有讨论作为动物的洲洲豹的结果归类为一类，将讨论作为汽车的\
  \ Jaguar 归类为另一类，将讨论作为操作系统的 Jaguar 归类为第三类，依此类推。\n\n## 神经网络\n\n我们在上面已经详细介绍了神经网络。神经网络的优势在于它们能够学习输入和输出之间的非线性关系。\n\
  \n## 贝叶斯网络\n\n贝叶斯网络产生输出和输入之间的概率关系。这种网络要求所有数据都是二值化的。贝叶斯网络的优势包括高可扩展性和支持增量学习。我们在书的前早期部分更详细地讨论了贝叶斯模型。特别是这种机器学习方法特别擅长分类任务，例如检测邮件是否为垃圾邮件。\n\
  \n## Python 命名规范\n\nPython 编程语言不允许在标识符中使用 `@`、`$`、`/` 和 `%` 等特殊字符。Python 是一种大小敏感的编程语言。因此，在\
  \ Python 编程中，`Python` 和 `python` 是两个不同的标识符。以下是 Python 标识符的命名规范。\n\n- 类名始终以大写字母开头，所有其他\
  \ Python 标识符以小写字母开头。\n- 当 Python 标识符以单个下划线开头时，该标识符是私有的。\n- 当 Python 标识符以两个下划线开头时，该标识符是强私有的。\n\
  - 当 Python 标识符以两个下划线结尾时，该标识符是语言定义的特殊名称。\n\n\n\n\n\n\n## 保留字\n任何编程语言中的保留字都是编译器或解释器理解的特殊命令，这些保留字不能被用作常量、变量或该编程语言中的任何其他标识符名称。Python\
  \ 具有以下保留字，且所有此类关键字仅包含小写字母。\n\n## 表示多行语句的关键字\nPython 语言以换行符结束。如果需要将语句延续到下一行，则在 Python\
  \ 语言中使用行续符字符 `\\`。此行续符字符 `\\` 表示语句行应该如下方截图所示继续。\n\n在下面的示例中，我们有三个变量 `result1`、`result2`\
  \ 和 `result3`，最终输出被复制到名为 `result` 的变量中。这里没有单行写等语句（`result=result1+result2+result3`），而是使用了行续符字符\
  \ `\\`，这样就可以分成三行编写，但在 Python 语言中表示单个语句。此外，定义在括号 `()`、`{}` 和 `[]` 内的 Python 语句在写成多行语句时不需要行续符字符\
  \ `\\`。这类 Python 语句在不使用行续符字符 `\\` 的情况下仍然被解释为单个语句。\n\n## Python 中的引号\nPython 语言允许使用单引号（`'`）、双引号（`\"\
  `）和三引号（`'''` 或 `\"\"\"`）来表示字符串字面量，确保相同类型的引号开始并结束该字符串。在下面的示例中，单引号、双引号和三引号被用于表示单词、句子或段落中的字符串。当我们打印这个变量时，无论\
  \ Python 语言中表示字符串字面量使用的是单引号、双引号还是三引号，都会打印字符串。\n\n## Python 中的注释\nPython 语言中的任何注释都由哈号\
  \ `#` 表示，前提是它没有用于代码之间的字符串字面量（单、双或三引号）。哈号 `#` 之后到物理行末尾的所有字符都是注释的一部分，Python 解释器在解释整个程序时会忽略该语句。在下面的示例中，解释器将打印\
  \ `print` 命令内部的字符串，并忽略符号之前之后作为注释提到的部分。\n\n## 使用空行\nPython 语言中的空行可以是包含空格的行，也可以是包含注释的行（即以哈号\
  \ `#` 开头的语句）。Python 解释器在解释空行时会忽略它，且不会生成机器可读的代码。Python 中的多行语句在进入一个空物理行后终止。\n\n##\
  \ 等待用户输入\n使用 Python 编程语言，我们可以设置一个可以接受用户输入的提示符。程序的下一行将显示一个提示符，显示“按任意键退出”，并等待用户输入或操作。\n\
  \n## 单行上的多个语句\nPython 语言允许在语句之间用分号（`;`）分隔的情况下，在单行上编写多个语句，如下面的示例所示。\n\n## 命令行参数\n\
  在安装了 Python 解释器的 UNIX 操作系统上，我们可以寻求帮助查看所有函数列表。这些是基础函数。下面的截图演示了 UNIX 系统上的 `help` 命令以及使用的所有函数或短代码。\n\
  \n# 机器学习与机器人技术\n首先，我们需要定义一个机器人。它们是机器，通常可以通过计算机进行编程，能够在没有干预的情况下执行一系列复杂的动作。机器人可以嵌入其控制系统，也可以由外部设备控制。在流行文学和电影中，许多机器人被设计得像人类，但事实上，它们通常是为了执行特定任务而设计的，这种需求决定了它们的外观。机器人伴我们我们几乎和计算机一样久。乔治·德沃尔在\
  \ 1954 年发明了第一种数字操作和可编程的机器人，称为 `Unimate`。1961 年，通用汽车购买了它用于抬运热金属压铸件。就像计算机一样，机器人改变了我们的社会。它们的力量、灵活性以及持续完美执行重复任务的能力证明了巨大的收益。尽管它们对制造业造成了某些冲击，导致许多人失业，但它们在社会中的崛起提供的就业机会远大于夺取的。\n\
  \n目前使用的机器人可以分为几类：\n\n## 工业机器人/服务机器人\n这些机器人可能很熟悉。你可能在电视或自动化工厂的视频中见过它们。它们通常由一个一个或多个关节的“手臂”组成，末端带有夹爪或操作设备。它们最早出现在汽车工厂。它们被固定在一个位置，无法移动。工业机器人见于制造和工业场所。服务机器人的设计与工业机器人基本相同，但出现在制造领域之外。\n\
  \n### 教育机器人\n这些机器人被用作教学工具或用于教育目的。早在 20 世纪 80 代，教室就带着“乌龟”引入了机器人，学生可以在那里使用 `Lego`\
  \ 编程语言对它们进行训练。还有可以购买的机器人套装，如 `Lego Mindstorm`。\n\n### 模块机器人\n模块机器人由几个协同工作的独立单元组成。它们可以是相同的，也可以在设计上有一个或多个变化。模块机器人能够组合形成允许它们执行任务的形状。模块机器人系统的编程当然比单个机器人复杂，但大学和企业环境的持续研究表明，这种设计方法在许多应用中优于单一大型机器人。与群体智能（见下文）相结合，模块机器人证明非常擅长解决问题。\n\
  \n### 协作机器人\n协作机器人设计用于与人类工作。它们大部分是工业机器人，包含了安全功能，以确保它们在执行分配的任务时不会伤害任何人。这种协作机器人的极佳例子是\
  \ `Baxter`。Baxter 于 2012 年引入，被设计为编程完成简单任务，但在与人类接触时会停止移动。当然，上述所有示例都不需要人工智能。当机器人结合机器学习时，研究人员使用术语“机器人学习”。这一领域在至少四个重要领域具有深远影响：\n\
  \n- **视觉**：机器学习允许机器人视觉上感知环境并理解它们所看到的内容。不需要预先编程，机器人就可以理解并分类新物品。\n- **抓取**：结合视觉，机器学习允许机器人处理它们从未见过的环境物品。过去，在工厂里，每当机器人预计与不同形状的物体交互时，都需要编程如何处理。有了机器学习，机器人具备自动导航新形状和大小的能力。\n\
  - **运动控制**：借助机器学习，机器人能够在环境中移动并避开障碍以继续执行它们分配的任务。\n- **数据**：机器人现在能够理解物理和逻辑数据模式，并根据这些模式做出反应。\n\
  \n## 工业机器人的示例\n将机器学习应用于机器人的一个例子是沿着传送带接收箱的工业机器人。因为是固定的，这些箱往往会有偏差。传统上，对这些形状容差较小的机器人将无法正确抓取。通过机器学习算法，机器人现在能够实时适应不同的形状并成功抓取箱。另一个工业示例是拥有\
  \ 90000 个不同零件的工厂。教机器人如何处理这么多物品是不可能的。通过机器学习，机器人可以接收它将要处理的新零件图像，并自己确定处理它们的方法。2019\
  \ 年，预计全球有 600 万机器人正在服务。这比 2015 年有所增加。随着越来越多的机器人结合机器学习算法，这个数字肯定会爆炸。\n\n## 开始学习 Python\n\
  你有很多理由可能想要学习 Python，或者你只是在广阔的编程世界中寻找一个起点。无论你的具体目的和目标是什么，我向你保证 Python 语言将为你提供执行你想执行的操作所需的所有工具。如果你正在浏览这本书的介绍页面，我可以告诉你，你可能应该看到在基础概念上要简单得多。当你进入变量、函数等更深层次的编程概念时，Python\
  \ 实际上会特意让它们变得非常容易处理。此外，正如我已经说的，Python 是一种具有无限使用和增长机会的语言。Python 的这种情况很少。\n\n### 安装\n\
  你首先需要的是 Python 本身。你可以通过访问 Python 网站 `http://python.org` 获取它。你可以为你相应的操作系统下载并安装。请注意，如果你在\
  \ Linux 或 macOS 上工作，这并不完全相关。这些操作系统的大多数版本通常自带一个 Python 版本。但你可能需要下载。如果是这样，你需要搜索与你特定操作系统相关的说明，因为说明随你正在使用的操作系统而异。如果你不知道\
  \ Python 是否已预安装，可以通过进入 `Terminal`（macOS 或 Linux）或 `Powershell`（Windows）并运行命令 `python`\
  \ 来确定。如果你的 `Terminal` 或 `Powershell` 实例显示类似“无法识别命令”的内容，那么你需要安装 Python。如果识别命令并显示\
  \ `Python 3.x`，你需要下载。\n\n总之，在 Python 网站上，你需要确保获取的是 Python 2.7 版本而不是 3 版本。这是由于一个简单的原因：Python\
  \ 2 和 3 在处理某些函数方面略有不同。虽然如此，但人们学习编程的原因之一是为了能够与计算机直接交流。学习 Python 2 将为你提供更多做此的机会。这是因为存在时间更长。Python\
  \ 2 的代码比 Python 3 多得多。如果你先学习使用 Python 2，你将处理更多的代码。现在，诚然，Python 3 是最前沿的。但在学习编程时，前沿并不总是最好的。学习阅读和编写更多代码比其他情况要好。基本上，在开始阶段，你试图尽可能地涵盖更多范围，而\
  \ Python 2 完美契合这一目标。一旦你对 Python 或通用的编程更有经验，Python 3 中需要学习或重新学习的内容，与尝试理解不相关的的 Python\
  \ 2 代码示例相比将是不足道的。\n\n### 编辑器\n一旦你安装了 Python `2.7.13`（或可用的最新 Python 2 版本），你需要一个文本编辑器。具体使用哪种文本编辑器并不重要，有几个很好的选择。我特别推荐使用的是名为\
  \ `Atom`，你可以在 `http://atom.io` 获取它。我推荐这一个几个原因：首先，它是免费的。还有比免费更好的呢？其次，它非常易用且功能丰富。第三，它具有极强的扩展性：可以通过各种插件支持它。最后但不是最重要的，你可以在每个主要的操作系统上都获取它。\n\
  \n### 第一个程序\n一旦你安装了 Atom 和 Python，让我们开始你的第一个程序。我建议你首先在电脑上创建一个易于访问的文件夹，比如桌面或 C 盘。命名为\
  \ Python 之类的。不要在名称中添加空格，因为这会减慢处理过程。总之，在那之后，你需要打开 Atom。一旦打开，右键点击侧边栏“添加文件夹（Add Folder）”。然后导航到你的项目文件夹并选择它。双击侧边栏中的文件夹以进入活动状态，然后在侧边栏右键点击“新建文件（New\
  \ File）”。然后，你将输入 `hello.py`。在文件中，你输入以下内容：\n\n```python\nprint(\"hello world!\")\n\
  ```\n\n然后保存。打开你的 `Terminal` 或 `Powershell` 来运行它。导航到你创建的文件所在并使用以下命令运行：\n\n```bash\n\
  python hello.py\n```\n\n如果一切按照计划进行，你将得到如下输出：\nhello world!\n\n\n\n\n\n\n数据处理是将数据的本质转变为更有用且更理想的形式的过程。换句话说，就是让数据更有意义和信息量。通过应用机器学习算法、统计学知识和数学建模，可以实现整个过程的自动化。根据所进行的活动和机器的需求，整个过程的输出可以是任何形式，如表格、图表、统计图、图像等。这看起来可能很简单，但对于\
  \ Facebook、Twitter、联合国教科文组织以及健康部门等大型机构和公司来说，整个过程必须以结构化的方式进行。下面的图显示了遵循的某些步骤：\n\n\
  让我们详细查看每个步骤：\n\n### 收集\n在开始机器学习时，最重要的一步是确保可用数据具有高质量。你可以从真实来源收集数据，例如 `Kaggle`、`data.gov.in`\
  \ 和 `UCI dataset repository` 存储库。例如，当学生准备参加竞争性考试时，他们总是寻找最好的资源来确保获得良好的成绩。同样，准确且高质量的数据将简化模型的学习过程。这意味着在测试期间，模型将输出最佳结果。数据收集涉及了大量的时间、资本和资源。这意味着机构和研究人员必须选择他们想要实施或研究的正确类型的数据。例如，面部表情识别需要大量具有不同人类表情的图像。良好的数据将确保模型的输出是准确且真实的。\n\
  \n### 准备\n收集到的数据可能是原始形式。原始数据不能直接喂给机器。相反，必须先对数据进行一些处理。准备阶段涉及从广泛的来源收集数据、分析数据集，然后构建一个新的数据集以便额外的处理和探索。准备可以手动或自动完成，并且数据应该被制成数值形式，以提高模型的学习率。\n\
  \n### 输入\n有时，已经准备好的数据可能是机器无法读取的形式，在这种情况下，必须将其转换为可读的形式。为了进行转换，存在特定的算法至关重要。执行此任务需要密集的计算和高准确性。例如，你可以通过\
  \ `MNIST`、音频文件、Twitter 评论和视频片段等来源收集数据。\n\n### 处理\n在这一阶段，需要机器学习技术和算法在大量数据上执行指令，并保持良好的准确性和更好的计算能力。\n\
  \n### 输出\n在这一阶段，机器以合理的方式获取结果，以便用户决定是否引用它。输出可以以视频、图表和报告的形式出现。\n\n### 存储\n这是最后一个阶段，生成的输出、数据模型和任何其他重要信息将被保存以供将来使用。\n\
  \n## Python 中的数据处理\n在查看如何使用 Python 处理和分析数据之前，让我们学习一些 Python 库的知识。第一件事是熟悉一些重要的库。你需要知道如何将它们导入到环境中。在\
  \ Python 中有不同的方法可以实现这一点。你可以输入：\n\n```python\nfrom math import *\n```\n\n在第一种方法中，你为库\
  \ `math` 定义了一个别名 `m`。你可以通过创建别名 `m` 使用 `math` 库中的不同函数。在第二种方法中，你导入了整个 `math` 命名空间。你可以选择直接\
  \ `math.func()` 而不使用别名。\n\n注意：Google 推荐第一种方法，因为它有助于你了解函数的来源。下面的列表列出了你需要的库：\n\n-\
  \ `NumPy`：代表 `Numerical Python`。`NumPy` 最先进的特性是 `n`-维数组。该库具有标准的线性代数、高级的随机数能力以及与低级编程语言集成的工具。\n\
  - `SciPy`：它是 `Scientific Python` 的缩写。`SciPy` 基于 `NumPy` 设计。它是线性代数、稀疏矩阵和傅里叶变换等高级科学工程的重要库。\n\
  - `scikit-learn`：它是为机器学习设计的。它是基于 `matplotlib`、`NumPy` 和 `SciPy` 创建的。这个特定库具有许多用于机器学习和统计建模的高效工具。\n\
  - `StatsModels`：该库为统计建模设计。`Statsmodels` 是允许用户探索数据、近似统计模型并实现统计的 Python 模块。\n\n其他库：\n\
  - `Requests`：用于访问网络。\n- `Blaze`：用于支持 `NumPy` 和 `Pandas` 的功能。\n- `Bokeh`：用于在当前的浏览器中创建仪表板、交互式图形和数据应用程序。\n\
  - `Seaborn`：用于统计数据可视化。\n- 正则表达式：用于发现文本数据中的模式。\n- `NetworkX` 和 `Igraph`：应用于图数据操作。\n\
  \n### 使用 Pandas 进行 Python 探索分析\n如果你不知道，Pandas 是 Python 中一个重要的数据分析库。该库在数据科学社区的应用起了关键作用。我们的示例使用\
  \ `Pandas` 从 analytics Vidhya 竞赛读取数据集，运行探索性分析，并创建一个分类分类算法来解决这个问题。\n\n在加载数据之前，了解\
  \ `Pandas` 中的两种主要数据结构是非常重要的。那就是 `Series` 和 `DataFrame`。\n\n### Series 和 DataFrame\n\
  你可以将 `Series` 视为一个带标签的一维数组。这些标签帮助你通过标签来理解该系列中的单个元素。\n\n`DataFrame` 类似于 Excel 工作簿，包含列名（引用列）以及也可以通过行号访问的行。主要的区别是列名和行号被称为列索引和行索引。\n\
