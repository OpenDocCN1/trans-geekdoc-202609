  \n在涉及 Python 数据处理时，这只是冰山一角。让我们来看：\n\n### Python 中的数据预处理技术\n以下是 Python 中数据预处理的最佳技术。\n\
  \n#### 1. 数据缩放 (Rescaling Data)\n当你处理具有不同尺度的数据时，需要缩放属性以具有相同的尺度。这些属性被缩放到 0 到 1 的范围之间，这被称为归一化（normalization）。为了实现这一点，使用了\
  \ `scikit-learn` 中的 `MinMaxScaler` 类。\n\n![Description: 00033.jpeg](img/rsrcVE.jpg)\n\
  \n例如：\n\n![Description: 00034.gif](img/rsrcVJ.jpg)\n\n缩放后，你会得到 0 到 1 之间的值。通过缩放数据，可以确认神经网络、优化算法以及那些具有距离度量的算法（如\
  \ `k-nearest neighbors`）的使用。\n\n#### 2. 数据归一化 (Normalizing Data)\n在后续的任务中，你将每个观测值缩放到特定的长度\
  \ 1。在这种情况下，你使用 `Normalizer` 类。这是一个示例：\n\n![Description: 00035.jpeg](img/rsrcVW.jpg)\n\
  ![Description: 00036.gif](img/rsrcW2.jpg)\n\n#### 3. 数据二值化 (Binarizing Data)\n如果你使用二值阈值，可以更改数据并将高于阈值的值设为\
  \ 1，而将等于或低于阈值的值设为 0。对于这项任务，你使用 `Binarized` 类。\n\n![Description: 00037.jpeg](img/rsrcWB.jpg)\n\
  ![Description: 00038.gif](img/rsrcWG.jpg)\n\n如所示，Python 代码会将所有等于或小于 0 的值标记为 0，将其余部分标记为\
  \ 1。\n\n#### 4. 均值移除 (Mean Removal)\n这是你从每个属性中移除均值以使其中心零的操作。\n\n#### 5. 独热编码 (One\
  \ Hot Encoding)\n当你处理少数且离散的数值时，在执行独热编码之前可能需要对它们进行存储。对于 `k` 个不同的值，你可以将特征转换为 `k` 维向量，其中一个值为\
  \ 1，其余值为 0。\n\n![Description: 00039.jpeg](img/rsrcWX.jpg)\n\n#### 6. 标签编码 (Label\
  \ Encoding)\n\n\n\n\n有时标签可以是单词或数字。如果你想对训练数据标记，你需要使用单词来增加其可读性。标签编码（Label encoding）将单词标签转换为数字，以便算法对其进行操作。这是一个示例：![Description:\
  \ 00040.jpeg](img/rsrcX6.jpg)\n\n## 机器学习项目\n你可以阅读大量的理论，但与实践实践相比，这永远无法帮助你建立对该领域的信心。大多数人认为通过阅读教科书和文章就能成为大师。但是，当他们尝试应用理论时，他们发现这比看起来要困难得多。当你从事项目时，你会提高自己的技能，并获得探索有趣话题的机会。你还可以将这些项目加入到你的作品集中，这将使你更容易找到工作。\n\
  \n## 数据分析\n数据分析项目是大多数人开始上手的项目，因为它有助于磨练一些统计技能。通过研究这个项目，你可以建立对机器学习的实践直觉。这个练习的目标是帮助你使用不同的模型，并将这些模型应用于各种数据集。你应该从这个项目开始的三个原因：\n\
  \n- 你将学会识别哪个模型适合你的问题。例如，某些数据集可能包含缺失信息。当你进行这个项目时，你会知道对于此类数据集应该使用哪个模型。你总是可以翻阅文本和文章来学习哪个模型更好，但看到它的实际运行效果更好。\n\
  - 你将开发创建模型模型的艺术。在不尝试的情况下，通常很难识别某个模型是否最适用于该问题。\n- 在构建模型时，你必须记住机器的流程或工作流。当你进行这个项目时，你将掌握这项技术。例如，你可以练习：\n\
  - 如何导入数据\n- 应该使用哪些工具来清洗数据\n- 如何将数据划分为训练集\n- 数据预处理\n- 你必须对数据进行哪些转换\n\n由于你使用了不同的模型，你可以专注于上述技能的开发。有关说明，你可以查看\
  \ Python (`sklearn`) 和 R (`caret`) 的文档页面。你还必须练习分类、聚类和回归算法。\n\n## 社交媒体\n由于用户生成的内容体量巨大，社交媒体是大数据的同义词。你可以挖掘这些数据并跟踪趋势、公众情感和观点。Facebook、YouTube、WhatsApp、Instagram\
  \ 以及许多其他平台的数据都可以被用来来实现你的目标。\n\n社交媒体数据对于品牌、营销和企业来说非常重要，因为与上一代人相比，每一代人花在社交媒体上的时间都更多。Twitter\
  \ 是你开始练习机器学习时应该从手的平台之一。你拥有有趣的数据集和元数据，它们为分析开启了无限路径。\n\n## 幻想联盟或体育博彩\n如果你读过《点球小子》一书，你就知道奥克兰运动人队如何通过他们的分析球探改变了棒球运动的面貌。根据分析，球队建立了一支非常有竞争力的球队，并且购买球员的价格几乎是洋基队球员的三分之一。如果你还没有读过这本书，现在必须买一本来读。\n\
  \n体育世界有大量数据可以让你玩。可以使用游戏、团队、玩家和得分的数据来分析模式。这些数据可以在网上获得。例如，你可以尝试以下项目并看看它们将带你走向哪里：\n\
  \n- 你根据比赛开始前互联网上的可用数据对不同比赛的特定得分进行投注。你可以分析数据并识别应该在哪里投注以增加胜算。\n- 你可以使用不同球员的统计数据在学校和大学挖掘人才。这种分析可以帮助大学球探识别他们想要加入球队的球员。\n\
  - 你可以成为幻想队的经理，并利用你的分析赢得比赛和联赛。\n\n体育领域特别有用，因为它帮助初学者练习探索性分析和数据可视化。这些技能将帮助你识别分析中应该包含哪些类型的数据。\n\
  \n## 股票市场\n一个有志的数据科学家总是会将他的项目建立在股市基础上，因为对他们来说那里就像迪士尼乐园。股市是一个有趣的研究领域，因为你有不同类型的数据可用。你可以找到关于基本面、价格、股票、经济情景、宏观和微观经济指标、波动性等的数据。\n\
  \n可用数据是细粒度的，使得人们更容易获取每家公司的历史数据（也称为时间序列数据）。使用这些数据，你可以构建创新的交易策略。由于金融市场周期短，你可以立即验证你做的任何预测。\n\
  \n- 你可以分析数据并评估 6 个月内不同股票波动。你应该使用公司提供的季度报告来进行此预测。\n- 你可以使用时间序列模型和循环神经网络模型预测预测价格之间的相关性。你还可以评估价格的波动性。\n\
  \n建立一个金融交易模型来提高你的机器学习技能很容易。然而，在这里从这些模型获利是很困难的。专家建议在完善模型之前不要使用真钱进行交易。\n\n## 编写机器学习算法\n\
  对于初学者来说，学习从零开始编写机器学习算法是非常重要的，原因有两个：\n\n- 没有比这更好的方法来理解算法的机制了，因为你必须思考算法的流程，从而帮助你掌握算法。\n\
  - 你可以将统计和数学指令转换为可运行的代码，这允许你在学术研究中应用算法。最好从更简单的算法开始，因为你必须做出数百个决定。一旦你熟悉了简单算法，就可以将这些算法的功能扩展到回归和聚类等复杂算法。你的包可能很慢，可能没有现有包中的算法那么花哨。开发者花费花了多年才构建了这些包。\n\
  \n\n\n\n\n机器学习的技术方法与公司传统利用数据的方式截然不同。机器学习技术不是从业务逻辑开始并应用数据，而是允许数据来创建逻辑。这种方法的核心优势之一是消除了商业假设和偏见，这些偏见可能导致管理人员制定出并非最佳的定制策略。\n\
  \n## 机器学习对应用的影响\n\n我们大胆地声称，通过机器学习，你从数据开始，让数据引导你走向逻辑。公司是如何实现这一目标的呢？与所有复杂应用的开发和部署一样，你需要一个规划过程来理解理解要解决的业务问题，并收集适当的数据源。\n\
  \n所使用的公式非常基础，其中大多数与你在高中学到的并无异。区别在于，计算机处理这些公式的速度比我们人类的大脑快得多。即使我们最擅长解决这类数学题，人类也永远无法像计算机那样快速进行计算。我们的大脑构造并非如此。虽然我们在脑海中计算几个数字可能需要一分钟左右，但计算机能够在极短的时间内算出数百万个方程。\n\
  \n但这并不意味着计算机是人类大脑的改进版。有些事情人类大脑可以同样快速地完成，而计算机尚未攻克，例如：模式识别、非结构化问题的解决以及在三维空间中运行。是的，更先进的计算机可以执行这类任务并解决问题，但在必须遵循规则的领域，必须为它们提供结构和参数。人类的大脑足够灵活，能够适应各种领域中不同情况的思维。是的，计算机可以驾驶汽车并得出结论，但它们在多任务处理以及在不发生碰撞或遇到错误的情况下进行操纵方面存在困难。\n\
  \n然而，随着时间的推移，最新的计算机能够做到越来越多它们在过去永远无法做的事情。这似乎只是时间问题，它们终有一天能够做到人类能做的一切，而且速度快得多，效率高得多。\n\
  \n\n\n\n\n\n你会发现，在机器学习中，认识到这一过程与概率论之间会形成一种关系是非常关重要的。机器学习是一个广阔的领域，这意味着它可以与其他某些领域产生交集。它所交互的领域取决于你将从事的特定项目。概率和统计学通常与机器学习融合，因此理解这三者如何协同工作对你的项目至关重要。统计学和概率论有几种不同的方式对机器学习中进行的整个学习过程至关重要。首先，你必须能够挑选出正确的算法，正如我们在稍后学习这本书的进展过程中将会看到的，有很多有很多不同的算法供你选择。你最终选择的算法需要在准确性、训练时间、复杂性以及参数数量之间取得良好的平衡。随着你参与机器学习的实践越多，你会发现每个项目都需要这些因素的不同组合。通过概率论和统计学，你可以更好地为程序选择合适的参数、验证策略，并确保你为自己的需求选择了正确的算法。它们还可以帮助你了解你的选择中存在多大程度的不确定性，从而让你判断你可以在多大程度上信任所发生的事情。在进行机器学习工作时，概率论和统计学会提供很大的帮助，并帮助你理解你正在从事的项目是如何运作。\n\
  \n## 观察随机变量\n\n现在，当我们涉及到统计学时，我们需要观察第一个主题是随机变量。在概率论中，这些随机变量用 `X` 符号表示，它是一个所有可能的变量都表现为你在某次随机实验中出现的数值结果变量。随机变量有连续或离散两种选择。这意味着，有时你的随机变量是函数，将结果映射到其空间内部的实值。我们将看看这方面的几个例子，以便稍后理解它。我们将从一个掷骰子的随机变量示例开始。我们要观察的随机变量将用\
  \ `X` 表示，它将取决于你投掷骰子后得到的结果。这里自然产生的 `X` 的选择将把标记为 `1` 的结果映射到值 `i`。这意味着，如果 `X` 等于 `1`，你就会把在骰子上掷出\
  \ `1` 的事件映射为值 `i`。你可以对骰子上的任何数字进行这种映射，甚至可以更进一步，选出一些有点奇怪的映射。例如，你可以将 `Y` 映射为结果 `0`。这个过程可能很困难，我们不会花太多时间，但它可以帮助你看到它是如何运作的。当我们准备好写出这个时，会有概率，显示为随机变量\
  \ `X` 的结果 1 的概率 `P`。它看起来如下：\n\n```\nPX(i) or (x=i)\n```\n\n## 分布\n\n现在我们需要观察这个过程中的概率分布是什么样的。我们在这里的意思是，查看随机变量每个结果的概率是多少。或者简单来说，我们将看到在掷骰子时得到某个特定数字（如六或三）的概率有多大。为了开始，我们需要看一个例子。让\
  \ `X`（或随机变量）作为我们投掷骰子后得到的结果。我们还假设骰子是没有经过手脚的，因此在每次投掷骰子时，六个面中概率概率都是相同的。掷骰子并获得特定数字的概率分布包括：\n\
  \n```\nPX(1) = PX(2) = … = PX(6) = 1/6\n```\n\n在这个例子中，它与我们对随机变量的操作是一样的，但它具有不同类型的含义。你的概率分布更多是关于可能发生的事件的光谱，而我们的随机变量示例完全关于存在哪些变量。通过概率论，`P(X)`\
  \ 部分将指出我们正在处理随机变量 `X` 的概率分布。在查看这些例子时，你可以注意到你的分布有时会同时包含两个或多个变量。当这种情况发生时，我们称之为联合分布。如果涉及多一个变量，你的概率现在将由每个变量决定。\n\
  \n## 独立性\n\n在机器学习中，你可以处理的另一个变量是确定问题具有多大的独立性。一个例子是，当标签样本 `i` 不受 `j` 的影响时，训练样本 `j`\
  \ 和 `i` 与底层空间是独立的。无论一个变量的结果如何，回想掷骰子和抛硬币的例子。骰子上出现什么数字都没关系。硬币会有自己的结果。反之亦然。随机变量 `X`\
  \ 总是与变量 `Y` 独立。无论 `Y` 的值是什么，但以下代码需要成立：\n\n```\nP(X|Y) = P(X)\n```\n\n在上述情况下，`X`\
  \ 和 `Y` 出现的值被忽略了，因为在此时这些变量的值将不再重要。\n\n## 机器学习所需的构建模块\n\n在工作时，你想要学会如何良好使用一些算法。但在我们在此之前，学习一些基础构建模块是非常重要的。这些算法非常棒，因为它们帮助你在机器学习中做很多事情，它们也是你想要使用它们的主要原因。\n\
  \n## 学习框架\n\n假设你决定是时候去一个新岛屿了。岛屿上的原住民对吃木瓜非常感兴趣，但你这方面的经验非常有限。弄清楚哪些木瓜是好吃的……\n\n（注：此处原文似乎中断，以下根据上下文逻辑翻译）\n\
  \n### 输入\n\n当你开始工作时，你需要查看的是输入。这被称为学习器输入。……（注：此处原文似乎中断）\n\n### 训练数据\n\n从这里开始，你可以机器学习机器学习中数据数据。数据数据数据数据数据，，预测的预测数据。在当你工作时，你将需要获得预测的分布。……（注：此处原文似乎中断）\n\
  \n### 学习器输出\n\n一旦你完成了输入和输出，你需要查看什么是输出。输出基本上是预测的创建。通常被称为预测器（predictor）、分类器（classifier）或假设（hypothesis），你将使用它们来处理。在开始时，你可能没有主意，因为你无法判断哪些木瓜是好吃的。你可以利用过去的一些经验来帮助，但由于你以前没有尝试过木瓜，很难判断好坏。但当你尝试木瓜并获得更多经验时，你会发现你未来的预测会好得多。\n\
  \n## 数据泛化模型\n\n一旦你有了学习器的输入和输出，你就需要查看数据泛化模型。这个模型很有用，它可以帮助你根据你使用的数据集的概率分布创建自己的训练数据。在这个例子中，模型将是你决定在市场上购买哪些木瓜进行测试的方法。在开始时，你可能没有任何主意，但泛化模型的设计是为了帮助你发现……\n\
  \n## 成功的标准\n\n在你投入工作之前，有很多种颜色和不同的软度程度，所以很难知道什么效果最好。这总是与另一个变量（即 `Y` 随机变量）独立的。点在于你需要查看它的准确性。\n\
  \n## 机器学习中的泛化模型\n\n在机器学习中，当你考虑泛化的概念时，你基本上是看到它有两个组件，而且你在处理所有数据之前需要使用这两种部分。需要存在的组件包括可靠性假设和真实错误率。任何时候你可以处理这种情况，并且能够满足可靠性假设，你就可以预期你在机器学习中使用的算法对于帮助你了解分布是相当可靠的。但是，也有某些你在这里所做的假设是非常不实际的。\n\
  \n\n\n\n\n\n感谢你读到本书的最后。`Machine Learning`对我们世界的影响无处不在。我们的`cars`、`phones`、`houses`以及更多已经在通过`Machine\
  \ Learning`系统进行控制和维护。\n\n在未来，`Machine Learning`将彻底改变世界。其中一些变化是容易预测的。在未来十年或二十年内，人们将不再开车，相反，`automated\
  \ cars`将开车。但在许多其他方面，`Machine Learning`对我们世界的影响是难以预测的。\n\n`Machine Learning`算法将取代许多工作，从卡车运输到会计以及许多其他学科，以至于人们将没有多少工作要做？一百年后，是否还有人的工作可做？我们不知道这些问题的答案，因为考虑到时间、数据以及实现特定任务的意愿，`Machine\
  \ Learning`所成就的能力没有限制。\n\n未来并不可怕。如果未来没有了工作，并不意味着事情将停止进行。食物仍然会被种植、采摘、运输到市场并陈放在商店里，只是人们不再需要完成这些劳动。事实上，商店也将不再需要，因为我们订购的食物可以直接送到家中。\n\
  \n如果人类拥有几乎无限的空闲时间，世界会变成什么样？这是一种可能的未来吗？无法预知这项技术未来将我们带向何方。现在，它是 IT 领域最受关注的话题之一，这主要因为它在许多领域具有巨大的潜力。如果技术继续以如此之快的速度改进，那么很有可能在不远的将来，机器本身将编写其他机器。届那时，最好的问题不是机器未来将做什么，而是我们将做什么？本书提供了关于什么是`machine\
  \ learning`以及`machine learning`类型的信息。它还提供了关于为`machine learning`奠定的基础的信息。你将获得用于`machine\
  \ learning`的不同算法的信息。作为初学者，练习一些`machine learning`的算法有助于增强你的理解。书中有些项目你可以在周末完成，或者如果你想，也可以扩展它们。多加练习对提高你`machine\
  \ learning`的知识至关重要。记住`machine learning`中使用的许多词汇是很困难的。\n\n"
