- raw: 'Chapter 3:Learn coding with python When Guido van Rossum developed the first
    Python language compiler in the late 1980s, little did he know that the language
    will be more famous than popular languages in machine learning and Artificial
    Intelligence. The fact is—in the last couple of years; Python language has emerged
    as a solution for most machine learning problems. Python language is beginner-friendly,
    yet very powerful.  It is no wonder that Python language is finding its applications
    in some of the most popular systems such as Google, Pinterest, Mozilla, Survey
    Monkey, Slideshare, YouTube, and Reddit as a core developer language. Also, Python’s
    syntax is extremely simple to understand and follow if you’re a beginner or advanced
    programmer. If you’re an advanced developer of C, C++, Java or Perl, you’ll find
    programming in Python to be extremely simple.  If you’re an experienced developer,
    you can accomplish great things with Python. Besides developing games, data analysis,
    and machine learning, Python language can also be used to code general AI systems
    and development of GUIs. This chapter explores how you can engineer ML systems
    in Python language. Let’s get started. Getting started with Python Obviously,
    to kick start developing machine learning systems in Python, you need to install
    it on your computer and set the programming environment. If you’re a novice Python
    programmer, learning basics of Python installation and setting up the environment
    will go a long way in promoting your bottom line. The installation process The
    process of downloading and installing the Python language interpreter is pretty
    simple. If you’re using the latest Linux distribution—whether it’s Ubuntu, Fedora
    or Mint—then you’ll find the most recent version of Python already installed.
    All you have to do is to update your system. If you’re using a Debian-based Linux
    distribution, follow these steps to update your system: ·         Launch the Terminal
    app and type the following command at the command prompt: su apt-get update ·         Type
    your root password and press the Enter key ·         Wait for the update process
    to be completed. If you’re using a Redhat-based Linux distribution such as Fedora,
    follow these steps to update your system: ·         Launch the Terminal app and
    type the following command at the command prompt: su apt-get update ·         Type
    your root password and press the Enter key ·         Wait for the update process
    to be completed. On the other hand, if you’re using other OS’s apart from Linux,
    you have to download and install Python yourself. Also, if you’re using an older
    version of Linux that has no Python, then you have to install it manually. Follow
    the steps outlined below to install Python on Linux distributions: ·         Launch
    the Terminal app (Ensure that you’re connected to the internet) ·         Type
    “su” at the command prompt and press the enter key ·         Type your root password
    and hit the enter key ·         If you’re using Debian-based Linux distribution
    such as Ubuntu, then type: “apt-get install python” at the command prompt and
    press the enter key ·         On the other hand, if you’re using the Red Hat/
    RHEL / CentOS Linux distributions such as Fedora, then type: “yum install python”
    at the command prompt and hit the Enter key. ·         Wait for the installation
    to complete. ·         Update the system by typing: “su apt-get update” if you’re
    using Debian-based Linux distributions or “su yum update” if you’re a Redhat/
    RHEL / CentOS Linux distribution user. What about Windows OS? Before you download
    and install Python, decide on the version of Python language that you would want
    to install. As a rule of thumb, always go for the latest version. As of writing
    this book, the latest version was 3.6.2.  Here are steps that can help you install
    Python on Windows OS: ·         Go to [www.python.org](http://www.python.org)
    and download the current version of Python. Select the appropriate version depending
    on the nature of your OS (32 bit, or 64 bit). ·         Open the Python file that
    you’ve just downloaded ·         Click on the “Accept the default settings” from
    the on-screen instructions and wait for the installation process to complete.
    If you’re a Mac OS X or Sierra user, then you’ll find Python 2.7 already portedto
    the OS. Therefore, you don’t have to install or configure anything if you want
    to begin using Python.   However, if you wish to install the latest version of
    Python, you need to use the Homebrew. Here are steps that can help install Python
    on your Mac OS: ·         Open your Terminal or any of your favorite OSX terminal
    emulator ·         Type the following command at the command prompt:“/user/bin/ruby-e"$(curl-fsSL
    [https://raw.githubusercontent.com/Homebrew/install/master/install)](https://raw.githubusercontent.com/Homebrew/install/master/install\))
    ". ·         Now proceed to install Python language interpreter by typing the
    following command at the command prompt: “brew install python.” ·         Wait
    for the installation process to complete. Now that you’ve installed Python, what
    next? It’s now time to begin developing your ML systems. But not that fast! You
    should decide on what text editor you’ll use.  You can opt to select your best
    editors to help you code and execute your program. Some of the most popular Text
    Editors are Emacs, Geany, Komodo Edit and Sublime Text. But since we all know
    the pitfalls of the Text Editors—such as running the code manually from the Python
    Shell—I won’t advise you to use them. Instead, use the Python IDLE (Integrated
    Development Environment). I have been using it ever since without problems. However,
    you can choose an IDE that suits you. Python IDLE has the following features:
    ·         Syntax highlighting ·         Auto-completion of code statements ·         Smart
    indentation ·         Integrated debugger with the stepping, persistent breakpoints,
    and call stack visibility features. Launching Python To get started, you have
    to understand how to launch the Python app. You can launch Python from the Terminal
    or use the desktop environment for starting the IDLE app.   Simply launch the
    Terminal and type: “idle” at the command prompt. Now that you’ve launched the
    Python, it’s now time to begin coding. Let’s now create our first program in Python.
    Follow these steps to write your first Python program: ·         Open the Python
    IDLE. ·         Write the Python language statements (instructions) in the IDLE
    window. ·         Run the program That’s it! Simple. Isn’t it? Now, here’s a quick
    way to see the programming process in action...Proceed and copy/paste the following
    code into your Python IDLE window.  print (“Hello World! This is my first Machine
    Learning program”) Run the program. What do you see as the output? Well, the phrase
    “Hello World! This is my first Machine Learning program” appears. Congratulations!
    You’ve just written your first Python code. I know you’re now excited to begin
    coding ML systems. Don’t worry so much about the meaning of statements. If you
    are a machine learning novice, mastering some Python programming concepts will
    help you understand how to design ML applications. Next up, let’s dive in together
    and get to the basics of Python programming. An Overview of Python Now that you
    have executed your first Python program, what else do you need to know?  Well,
    it’s now time to understand the vital components of any Python code including
    its structure. All Python programs have the following structure: import sys def
    main (): main () { Program statements } As you can see from this program structure,
    all Python codes should always start with the keyword “import.” Now, what are
    we importing? Python language is object-oriented. Therefore, it has components
    of all the object-oriented programming languages. One such property is inheritance
    or in simple terms; code reuse. The ability to inherit features of codes in Python
    allows programmers to reuse pieces of codes that had been written elsewhere. Technically
    speaking, the import statement tells the Python interpreter to declare classes
    that have already been used in other Python packages without referring to their
    full package names.  For instance, the statement: “import sys” informs the interpreter
    to include all the system libraries such as print whenever the Python program
    is starting. What does the statement “def main ( ):” mean? Whenever a Python program
    is loaded and executed, the computer’s memory—the Random Access Memory—contains
    the objects with function definitions. The function definitions provide the programmers
    with the capabilities of instructing the control unit to place the function object
    into the appropriate section of the computer’s memory. In other words, it’s like
    instructing the control unit to check the main memory and initialize the program
    that needs to be executed. The function objects in the memory can be specified
    using names. That’s where the statement “def main ( ):” comes in. It simply tells
    the control unit to start executing the Python code statements that are placed
    immediately after the statement “def main ( ):” For example, the Python code below
    creates a function object and assigns it the name “main”: def main (): if len
    (sys.argv) == 10: name = sys.argv \[2\] else: name = “Introduction to Machine
    Learning.” print (“Hello”), name In the above code, the Python interpreter will
    run all the function statements in the Python file by placing the set of functions
    objects in the memory and linking each of them with the namespace. This will happen
    when the program is initialized with the import statement. But more fundamentally,
    “What are the different elements of Python code?” Well, all Python programs have
    the following components: ·         Documenting the program. Any statement in
    the program (except the first) that starts with “#” is treated as a command line
    or comment line and will be ignored during execution. This will allow you to comment
    on sections of the code for proper documentation. ·         Keywords. The keywords
    are instructions that the interpreter recognizes and understands. For instance,
    the word “print” in the earlier program is a keyword.  In Python, there are two
    main types of keywords: the functions and the control keywords. Functions are
    simple verbs such as print that tell the interpreter what to do while the control
    keywords control the flow of execution. ·         Modules. Python program is shipped
    with a large list of modules that increase its functionality. The modules will
    help you to organize your code in a manner that’s easy to debug and control the
    code. ·         Program statements. The program statements are sentences or instructions
    that tell the control unit to perform a given operation. Unlike most programming
    languages, the Python statements don’t need a semicolon at the end. ·        
    Whitespace. The white spaces are a collective name that given to tabs, the spaces,
    and newlines/carriage returns. The Python language is strict on where the white
    space should be placed in the code. ·         Escape sequences. The Escape sequences
    are special characters that are used for output. For instance: the sequence “\\n”
    in the program tells Python to output on a new line.  Python variables There’s
    so much that goes on in the main memory of the computer whenever you run a program.
    Understanding the concept of variables and data types will help you to write efficient
    programs. A program is simply a sequence of instructions (statements) that directs
    your computer to perform a particular task. For instance, the previous program
    printed the phrase “Hello World! This is my first program” on the screen when
    it was executed. But before you could see the output on the screen some data had
    to be kept in computer’s memory. The use of data applies to all programming languages—Python
    included—therefore, understanding the mechanisms of data management in the computer’s
    memory is the first step towards developing robust, efficient and powerful applications.
    A variable can be conceived as a temporary storage location in the computer’s
    main memory and specifically the Random Access Memory. This temporary storage
    location is what will hold the data that you would like to use in the program.
    In other words, the variable location of memory that holds data whenever your
    program is executing. So, whenever you define a variable, you’ll actually be reserving
    a temporary storage location in the computer’s memory. All the variables that
    you define must have names and an equivalent data type— a sort of classification
    of the variable that specifies the type of value the variable should hold. The
    data types help to specify what sort of mathematical, relational or even logical
    operations that you can apply to the variable without causing an error. Ideally,
    when you assign variables to data types, you can begin to store numbers, characters,
    and even constants in the computer’s main memory. Since Python language is an
    oriented programming language, it is not “statically typed.” This means that the
    interpreter regards every variable as an object. Therefore, you have to declare
    the variables before using them in your program. So, how can you declare variables
    in Python? Names or identifiers usually declare Python variables. Just like any
    other programming languages that you have so far learned, the conventions for
    naming the variables must strictly be adhered to.  Below are some naming conventions
    that you should follow when declaring variables: ·         All variable names
    should always begin with a letter (A to Z and a to z) or an underscore. For instance,
    “age” is a valid variable name while “–age” isn’t a valid variable name. ·        
    Any variable name you declare cannot start with a number. For instance, 9age is
    not a valid variable name. ·         Special symbols shouldn’t be used when declaring
    variable names. For instance, @name isn’t allowed as a variable name. ·         The
    maximum number of characters to use for your variable name shouldn’t exceed 255.
    To reserve a temporary memory location in the name of a variable, you don’t have
    to use the explicit declaration like other programming languages. If you’ve had
    experience in other programming languages such as Pascal or C, I am sure you know
    that declaring a variable explicitly before assigning any value is a must. In
    Python, the declaration of variables usually occurs automatically the moment you
    assign a value to it. For instance, the statement; age=10 Automatically reserves
    a temporary storage location in memory space called “age” and assigns 10 to it.
    It is also possible to assign a single value to several variables simultaneously.
    For instance, the statement below reserves temporary memory spaces for 2 variables
    namely: age and count and assigns the value 30: age, count=30 Python language
    has different categories of data types that are used to define the storage methods
    and mathematical operations.  Below are examples data types in Python language:
    ·         Numbers ·         String ·         List ·         Tuple ·         Dictionary
    a)       Numbers The Number data types stores numeric values. The number objects
    will automatically be initialized whenever you assign a specific value to the
    variable.  For instance, the code illustrated below creates 2 variable objects
    (age and count) and assigns them the values 10 and 30 respectively: age = 10 count=
    30 If you want to delete reference to the Number object, you’ll use the word “del”
    followed by the variable name that you wish to delete. Consider the code below
    that deletes two variables: age and count that have already been declared and
    used.” del age, count Python language supports four different categories of number
    types. These are: ·         int. when used in a declaration it refers to signed
    integers. These include those whole numbers that range from 8 bits to 32 bits.
    ·         long. These are long integers. They can be represented either in octal
    and hexadecimal numbering notation. ·         float. These are floating real point
    values. They may range from 8 bits to 64 bits long. ·         complex. These are
    complex numbers. b)       Strings Strings are stored as consecutive sets of characters
    in the computer’s memory locations. Python language allows you to use either pair
    of single or double quotes when defining the strings. Other subsets of string
    variable types can be specified using the slice operator (\[ \] and the \[:\])
    with the indexes that range from 0 at the beginning of the string. The plus (+)
    operator performs string concatenation (joining of two or more strings) while
    the asterisk (\*) operator performs string repetition. File Handling in Python
    A file is simply a named location on disk that has stored related information.
    Files are used to store data on a permanent basis on a non-volatile storage device
    such as a hard disk. You are aware that the main memory—and specifically the RAM—can’t
    be used to store data on a permanent basis. Therefore, files must always be stored
    on a permanent storage device. When a file is created on a secondary storage device,
