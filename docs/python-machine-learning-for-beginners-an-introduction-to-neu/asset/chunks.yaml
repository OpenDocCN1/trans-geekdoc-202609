- raw: 'Python Reserve Words Reserve words in any programming language are special
    commands that compiler or interpreters understands, and these reserve words cannot
    be used as a constant or variable, or any other identifier names in that programming
    language. Python has the following reserve words, and all such keywords contain
    lowercase letters only. Python Keywords Representing a Statement as Multi-Line
    Statements in the Python language ends with a new line. If the statement is required
    to be continued into the next line, then the line continuation character (\\)
    is used in Python language. This line continuation character (\\) denotes that
    the statement line should continue as shown in the below screenshot. In the below
    example, we have three variables result1, result2 and result3 and the final output
    is copied to the variable named result. Instead of writing the equation statement
    in a single line (result=result1+result2+result3), here, we have used line continuation
    character (\\) so that, it could be written in three lines but represents a single
    statement in Python language. Also, a Python statement which is defined within
    braces (), {} and \[\] does not require the line continuation character (\\) when
    written as a multi-line statement. This kind of Python statements are still interpreted
    as a single statement without the use of the line continuation character (\\).
    Quotation in Python The Python language permits the use of single (''), double
    (") and triple ('''''' or """) codes to represent a string literal, making sure
    that the same type of quote begins and ends that string. In the below example,
    single, double and triple codes are used to represent a string in a word, sentence
    or paragraph. When we print this variable, they print the string irrespective
    of single, double and triple codes used for representing string literal in Python
    language. Comments in Python Any comment in the Python language is represented
    by a hash sign (#) provided it is not used inside a string literal between codes
    (single, double or triple). All characters after the hash sign (#) and up to the
    end of the physical line are the part of comment and Python interpreter ignores
    this statement while interpreting the whole program. In the below example, the
    interpreter will just print the string present inside the print command and will
    ignore the parts mentioned after a sign before and after as comments. Using Blank
    Lines A blank line in the Python language is either a line with white spaces or
    a line with comments (i.e. statement starting with a hash sign (#)). The Python
    interpreter while interpreting a blank line, ignores it and no machine readable
    code will be generated. A multiline statement in Python is terminated after entering
    an empty physical line. Waiting for the User Using the Python programming language,
    we can set up the prompt which can accept a user’s input. The following line of
    the program will display a prompt, which says “Press any key to exit”, and waits
    for the user input or action. Multiple Statements on a Single Line The Python
    language allows to write multiple statements on a single line if they are separated
    by a semicolon (;) as demonstrated in the example below. Command Line Arguments
    On UNIX OS, which has Python interpreter installed, we can take help and see all
    the lists of the functions. These are the basic ones. The below screenshot demonstrates
    the help command on the UNIX system and all the functions or short codes used.
    Machine Learning and Robotics  First, we need to define a robot. They are machines,
    often programmable by a computer, that are able to carry out a series of complex
    actions without intervention. A robot can have its controls systems embedded or
    be controlled by an external device. In popular literature and film, many robots
    are designed to look like people, but in fact, they are usually designed to perform
    a task and that requirement determines how they appear. Robots have been with
    us for almost as long as computers. George Devol invented the first digitally
    operated and programmable one in 1954, called Unimate. In 1961, General Motors
    bought it to use for lifting hot metal die castings. And like computers, robots
    have changed our society. Their strength, agility, and ability to continue to
    perfectly execute the same repetitive tasks have proved an enormous benefit. And
    while they did cause some serious disruption to the manufacturing industries,
    putting many people out of work, their ascension in our societies has provided
    far more employment opportunities than they have taken. Robots in current use
    can be broken down into several categories: Industrial Robots/Service Robots These
    robots are probably familiar. You have likely seen them on the television or streaming
    video of automated factories. They usually consist of an “arm” with one or more
    joints, which ends with a gripper or manipulating device. They first took hold
    in automobile factories. They are fixed in one location and are unable to move
    about. Industrial robots will be found in manufacturing and industrial locations.
    Service robots are basically the same in design as industrial robots but are found
    outside of manufacturing concerns. Educational Robots These are robots used as
    teacher aids or for educational purposes on their own. As early as the 1980s,
    robots were introduced in classrooms with the turtles, which were used in classrooms
    where students could train them using the Lego programming language. There are
    also robot kits available for purchase like the Lego Mindstorm. Modular Robots
    Modular robots are consisted of several independent units that work together.
    They can be identical or have one or more variation in design. Modular robots
    are able to attach together to form shapes that allow them to perform tasks. The
    programming of modular robotic systems is of course, more complex than a single
    robot, but ongoing research in many universities and corporate settings is proving
    that this design approach is superior to single large robots for many types of
    applications. When combined with Swarm Intelligence (see below), modular robots
    are proving quite adept at creative problem-solving. Collaborative Robots Collaborative
    robots are designed to work with human beings. They are mostly industrial robots
    that include safety features to ensure they do not harm anyone as they go about
    their assigned tasks. An excellent example of this kind of collaborative robot
    is Baxter. Introduced in 2012, Baxter is an industrial robot designed to be programmed
    to accomplish simple tasks but is able to sense when it comes into contact with
    a human being and stops moving. Of course, all the examples above do not require
    any artificial intelligence. When robots are coupled with machine learning, researchers
    use the term “Robotic Learning”. This field has a contemporary impact in at least
    four important areas: Vision Machine Learning has allowed robots to visually sense
    their environment and to make sense of what they are seeing. New items can be
    understood and classified without the need to program into the robot ahead of
    time what it is looking at. Grasping Coupled with vision, Machine Learning allows
    robots to manipulate items in their environment that they have never seen before.
    In the past, in an industrial factory, each time a robot was expected to interact
    with a different-shaped object, it would have to be programmed to know how to
    manipulate this new object before it could be put to work. With Machine Learning,
    the robot comes equipped with the ability to navigate new item shapes and sizes
    automatically. Motion Control With the aid of Machine Learning, robots are able
    to move about their environments and avoid obstacles in order to continue their
    assigned tasks. Data Robots are now able to understand patterns in data, both
    physical and logistical, and act accordingly on those patterns. Example of Industrial
    Robots and Machine Learning   One example of the benefit of applying Machine Learning
    to robots is of an industrial robot which receives boxes of frozen food along
    a conveyor. Because it is frozen, these boxes often have frost, sometimes quite
    a lot of frost. This actually changes the shape of the box randomly. Thus, a traditionally-trained
    robot with very little tolerance for these shape changes would fail to grasp the
    boxes correctly. With Machine Learning algorithms, the robot is now able to adapt
    to different shapes, random as they are and in real time, and successfully grasp
    the boxes. Another industrial example includes a factory with over 90,000 different
    parts. It would not be possible to teach a robot how to manipulate these many
    items. With Machine Learning, the robot is able to be fed images of new parts
    it will be dealing with and it can determine its own method to manipulate them.
    In 2019, there will be an estimated 2.6 million robots in service on the planet.
    That’s up a million from 2015. As more and more robots are combined with Machine
    Learning algorithms, this number is sure to explode. There are a lot of reasons
    you may want to Python. Or, you may just be looking for a place to start with
    the wide, wide world of programming. Regardless of your specific purpose and goal,
    I can guarantee you that the Python programming language will provide you with
    all of the tools that you need to do exactly what it is that you want to do. If
    you’re browsing the introductory pages of this book on a preview or something
    of the like, on the fence as to whether or not you want to learn Python, well,
    I can tell you that you probably should. See how much easier it is? And this is
    just with rudimentary programming concepts. When you get into heavier programming
    concepts like variables, functions, and other things of that nature, Python actually
    goes out of the way to make them really simple and functional to handle. We’ll
    get more into this in the other chapters, of course. On top of this, Python, as
    I’ve already said, is a language which has endless opportunity for usage and growth.
    There are very few explicitly bad situations for Python. This makes it a great
    language to learn initially for the simple fact that you’ll be able to get a ton
    of mileage out of it. There will be very few times where, as a beginning programmer,
    you’ll come up with a concept you’d like to carry out that you won’t be able to
