    \ to look like people, but in fact, they are usually designed to perform a task\
    \ and that requirement determines how they appear. Robots have been with us for\
    \ almost as long as computers. George Devol invented the first digitally operated\
    \ and programmable one in 1954, called `Unimate`. In 1961, General Motors bought\
    \ it to use for lifting hot metal die castings. And like computers, robots have\
    \ changed our society. Their strength, agility, and ability to continue to perfectly\
    \ execute the same repetitive tasks have proved an enormous benefit. And while\
    \ they did cause some serious disruption to the manufacturing industries, putting\
    \ many people out of work, their ascension in our societies has provided far more\
    \ employment opportunities than they have taken.\n\nRobots in current use can\
    \ be broken down into several categories:\n\n### Industrial Robots/Service Robots\n\
    These robots are probably familiar. You have likely seen them on the television\
    \ or streaming video of automated factories. They usually consist of an “arm”\
    \ with one or more joints, which ends with a gripper or manipulating device. They\
    \ first took hold in automobile factories. They are fixed in one location and\
    \ are unable to move about. Industrial robots will be found in manufacturing and\
    \ industrial locations. Service robots are basically the same in design as industrial\
    \ robots but are found outside of manufacturing concerns.\n\n### Educational Robots\n\
    These are robots used as teacher aids or for educational purposes on their own.\
    \ As early as the 1980s, robots were introduced in classrooms with the turtles,\
    \ which were used in classrooms where students could train them using the `Lego`\
    \ programming language. There are also robot kits available for purchase like\
    \ the `Lego Mindstorm`.\n\n### Modular Robots\nModular robots are consisted of\
    \ several independent units that work together. They can be identical or have\
    \ one or more variation in design. Modular robots are able to attach together\
    \ to form shapes that allow them to perform tasks. The programming of modular\
    \ robotic systems is of course, more complex than a single robot, but ongoing\
    \ research in many universities and corporate settings is proving that this design\
    \ approach is superior to single large robots for many types of applications.\
