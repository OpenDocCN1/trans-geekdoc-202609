    ## Machine Learning Projects

    You can read volumes of theory, but that can never help you build confidence in
    the subject when compared to hands-on practice. Most people believe that they
    become masters when they read textbooks and articles. But, when they try to apply
    the theory, they notice that it is harder than it looks. When you work on projects,
    you improve your skills and have the chance to explore interesting topics. You
    can also add these projects to your portfolio, which will make it easier for you
    to land a job.


    ## Data Analysis

    The data analysis project is one that most people begin with since it helps to
    hone some statistical skills. By working on this project, you can build your practical
    intuition around machine learning. The goal of this exercise is to help you use
    different models and apply those models to a variety of datasets. There are three
    reasons why you should begin with this project:


    - You will learn to identify which model will fit your problem. For example, some
    datasets may have missing information. When you work on this project, you will
    know which model you should use for such datasets. You can always dig through
    texts and articles to learn which model is better, but it is better to see it
    in action.

    - You will develop the art of creating prototypes of models. It is often difficult
    to identify if a model will work best for the problem without trying it.

    - You must keep the process flow or workflow of the machine in mind when you build
    a model. You will master this technique when you work on this project. For example,
    you can practice:

    - How to import data

    - Which tools should you use to clean data

    - How to split the data into training sets

    - Pre-processing of data

    - What transformations must you make to the data


    Since you use different models, you can focus on the development of the skills
    mentioned above. For instructions, you can look at the Python (`sklearn`) and
    R (`caret`) documentation pages. You must also practice classification, clustering
    and regression algorithms.


    ## Social Media

    Social media is synonymous with big data because of the volumes of content that
    users generate. You can mine this data and keep tabs on trends, public sentiments
    and opinions. Facebook, YouTube, WhatsApp, Instagram and many other platforms
    have data that you can use to achieve your objective.


    Social media data is important for branding, marketing and for a business since
    every generation spends more time on social media when compared to its preceding
    generation. Twitter is one of the platforms you should start with when you begin
    to practice machine learning. You have interesting data sets and metadata that
    can open an endless path for analysis.


    ## Fantasy Leagues or Sports Betting

    If you have read the book `Moneyball`, you know how the Oakland A’s changed the
    face of baseball through their analytical scouting. Based on the analysis, the
    team built a highly competitive squad and bought the players for almost a third
    of the price when compared to the Yankees players. If you have not read the book
    yet, you must grab a copy and read it now.


    There are large volumes of data in the sports world that you can play with. You
    can use data for games, teams, players and scores to analyze patterns. These data
    are available online. For instance, you can try the following projects and see
    where they lead you:


    - You can bet on specific box scores in different games based on the data available
    on the Internet right before a game begins. You can analyze the data and identify
    where you should place your bets to increase your chances of winning.

    - You can scout for talent in schools and colleges using the statistics for different
    players. This analysis can help college scouts identify the players they want
    on their team.

    - You can become a manager for a fantasy team and use your analysis to win games
    and leagues.


    The sports domain is especially useful since it helps a beginner practice exploratory
    analysis and data visualization. These skills will help you identify what types
    of data you should include in your analysis.


    ## Stock Market

    An aspiring data scientist will always base his projects on the stock market since
    that is like Disneyland for them. The stock market is an interesting area to work
    on since you have different types of data available. You can find data on fundamentals,
    prices, stocks, economic scenarios, macroeconomic and microeconomic indicators,
    volatilities and many more.


    The data available is granular which makes it easier for people to obtain historical
    data, also called time series data, for every company. Using this data, you can
    build creative trading strategies. Since financial markets have small cycles,
    you can validate any prediction you make immediately.


    - You can analyze the data and assess the movement of prices for different stocks
    for a period of 6 months. You should use the quarterly reports provided by the
    company to make this prediction.

    - You can use a time series models and recurrent neural network models to forecast
    the correlation between the stock prices. You can also assess the volatility of
    the prices.


    It is simple to build a financial trading model to improve your skills in machine
    learning. However, it is difficult to profit from these models here. Experts recommend
    that you do not use real money to trade until you have perfected the model.


    ## Writing Machine Learning Algorithms

    It is important for a beginner to learn how to write machine learning algorithms
    from scratch for two reasons:


    - There is no better way to understand the mechanics of the algorithms since you
    must think about the process flow of the algorithm thereby helping you master
    algorithms.

    - You can translate statistical and mathematical instructions into working code,
    which allows you to apply algorithms in your academic research. It is best to
    start off with simpler algorithms since you must make hundreds of decisions. Once
    you are comfortable with simple algorithms, you can extend the functionality of
    those algorithms to complex algorithms like regression and clustering. Your packages
    may be slow and may not be as fancy as the algorithms in existing packages. It
    took the developers years to build these packages.

