    # 机器学习系统——构建路线图


    到目前为止，我们已经查看了基础机器学习概念和不同类型的机器学习。现在，我们需要查看机器学习系统的其余部分，即与算法配合的重要组成部分。有三个重要的子部分需要考虑。


    ## 预处理


    预处理是将我们的数据处理成特定形状的行为。原始数据很少具有学习算法正常工作所需的正确格式或形状。花卉图像就是原始数据，我们将从中寻找有意义的特征。这些特征可以是颜色、强度、色调、高度、花朵长度、花朵宽度等。许多机器学习算法为了获得最佳性能，还要求所选特征处于相同的尺度上，这通过将特征转换到某个范围或使用具有“零均值单位方差”的标准分布来实现。


    所选择的某些特征可能存在相关性，这意味着在某种程度上它们是冗余的。在这种情况下，我们可以使用维度还原来将这些特征压缩到较低的子空间中。通过这样做，我们不需要大量的存储空间，算法运行速度也会显著加快。在某些情况下，降维还可以使预测模型的性能更高效，特别是当数据集包含多个噪声实例（不相关的特征）时——你经常会看到信噪比很低。


    为了查看算法在训练数据集上的表现是否符合预期，同时对新数据做出积极反应，我们需要将数据集随机划分为两组——训练集和测试集。训练数据集用于训练模型并优化性能，而测试集在最后用于评估完成的模型。


    ## 训练和选择预测模型


    你将在整个指南中看到，许多算法都是为了解决特定问题设计的。有一点重要的需要记住——学习不是免费的。这个概念很容易联系到亚伯拉罕·马斯洛（Abraham Maslow）在
    1966 年的另一句流行名言——“我想，如果你手有的工具是一把锤子，那么把一切都看作钉子是很诱惑人的”。让我们结合语境来看待这一点。每一个分类算法都内置了偏差。只要我们不对任务做出任何假设，没有哪一个分类模型是优于其他任何模型的。在实际操作中，比较几个算法至关重要，以便选择并训练出最佳模型。


    然而，在我们这样做之前，我们需要决定使用哪种指标来衡量性能。最常见的指标之一是分类准确率，它被定义为分类正确的实例比例。但但是（这是一个合理的问题），如果测试集仅用于最终评估，而不用于模型选择测试，那么我们又如何知道哪一个模型在最终测试和真实世界数据上表现最好呢？为了解决这个问题，我们可以使用多种交叉验证技术——将训练数据集分为两个子集：训练集和验证集。这样做是为了估计模型的泛化性能。


    最后，尽管许多软件库提供了学习算法，但我们不应该理所当然认为这些算法的默认参数会适用于我们正在尝试解决的特定问题。相反，我们将使用称为“超参数优化”的技术来微调模型性能，我们稍后会看到是如何做的。基本上，超参数可以被看作无法从数据集中学习的参数，相反，它们代表了我们可以旋转以提高模型性能的“旋钮”。


    ## 模型评估和对未见数据的预测


    一旦我们有了模型，就可以测试数据集来估计模型在未见数据上的表现。通过这种方式，我们可以获得误差的估计。如果我们对模型的性能表示满意，就可以用它来预测未来数据。请注意一点——至关重要的是，我们提到的参数（如维度还原和特征缩放）必须从训练数据集中获得，然后应用于测试集对其进行转换。如果我们不遵守这一点，性能可能会过于乐观。


    ### 机器学习的问题


    机器学习仍在演变，并且每天都在被使用。随着使用频率的增加，我们会发现更多待解决的问题。虽然其中一些问题尚未解决，但并不意味着未来没有解决方案。一个问题是自然语言处理和语言理解仍然是一个难题。由于语言语言，机器很难解码所说的话，但这并没有阻止它们的尝试。诸如
    `Alexa`、`Siri` 和 `Cortana` 这样的程序正在不断更新，以便更好地服务用户。


    图像可以通过机器学习进行分类，但机器无法理解图像中发生了什么。通过理解图像中发生了什么，这导致了语义分割。机器应该被教会如何识别图像中的像素，以便我们可以更好地理解。


    深度学习也需要稳定。如果某物是坏的，为什么要去尝试修复它？有时候旧的方法是有效的。随着深度学习的稳定，这将是可能的。这将允许深度学习处理尚未触及的难题，例如
    `Montezuma''s revenge`。此外，控制人的能力将呈指数级增长，可能性是无限的。无法预测机器人将发展到什么程度，因为它们能够找到获得奖励的方法；换句话说，它们将被赋予像人类一样的选择权。GANs（生成对抗网络）是与特定类别工作的一类算法，它们将使用无监督学习。虽然它们对于使用机器学习的游戏来说很棒，但它们会让游戏变得困难，因为它们经常崩溃。训练深度网络也是一个问题，这已被“梯度破碎”（shattering
    of gradients）论文所证明。这还导致没有人完全理解深度网络在做什么。关于深度网络是什么以及为什么需要它们，有些人认为它们倾向于让生活变得复杂。那么，为什么会有深度网络？我们真的需要它们吗？


    最后，人们应该停止担心像 `Skynet` 之类的事情及其经济影响。首先，`Skynet` 是电影《终结者》（Terminator）中的一个虚构公司，并且不会发生。在机器人做出自己的决定之前，无疑会有一套安全措施确保机器人不会反抗人类并试图杀掉他们。所有
    `Skynet` 的事情都是人们喜爱的电影情节。其次，机器学习的经济影响是什么？通过机器学习，公司将能够发现赚更多钱，这意味着更多的资金将投入经济！除了机器学习中的某些事情尚未稳定并没有很多问题。很难忘记，机器学习仍处于婴儿阶段，并随着技术的演变仍在训练，所以我们必须保持耐心，并记住在它们被修复之前会有更多问题。


    ## 尚未解决的机器学习问题


    机器学习随着技术的发展而演变，因此在找到答案之前，总会有问题需要处理。会有这些问题的解决方法，即使没有，你也可以分析并获得数据。一个，变量事件空间尚未解决。为了解决这个问题，我们需要能够以有效且有意义的方式响应分类系统，即使事件空间与训练数据不同。


    另一个问题是处理语言时缺乏上下文理解。上下文分析对机器学习来说很重要，因为它留下了大量被误解的空间。一种可能的解决方案是 `open AI` 团队应该提出的解决方案，允许代理创建自己的规则，而不是让它们寻找模式。


    面部识别正迅速成为人们解锁设备的流行方式，因为它是一种快速且半安全的防止设备被破解的方法。然而，这并不意味着完美，因为具有相似特征的人进入你的手机。不仅如此，面部识别对于外观不起作用。


    自动学习是机器学习的大部分，如果机器不能自动学习它应该学习的内容，那么它将毫无用。学习必须来自各种资源，当这些资源缺失时，自动学习将会遇到障碍。例如，`IBM''s
    Watson` 表现出色，但仍然需要一个倾向于通用智能的系统。


    在某些机器学习中，机器将根据偏离空间做出自己的决定；但那不会包括这些。这也是一个问题，因为解决它的技术尚不存在。


    ## 可以解决的问题


    机器学习正在帮助许多公司以及人们的日常生活。在这一节中，你将看到上面提到的尚未被机器学习解决的一些点。尽管该特定的机器学习部分存在问题，但并不意味着它不起作用。有时这些问题可以在开发者没有发现的稍后日期进行补丁或修复。


    机器学习有助于垃圾邮件检测。当你进入收件箱时，总会有邮件由于关键词被自动路由到垃圾箱。然而有些垃圾邮件漏掉了。垃圾邮件检测还有很长的路要走，但随着规则的制定它正在变得更好。你是否想过信用卡公司是如何知道有人使用了你的卡的？这是因为他们保留了交易记录！每个月，信用卡公司都知道你常去的商店和消费金额。如果他们发现任何超出你通常区域或通常消费金额的活动，他们会认为卡片被盗并报告。通过机器学习，公司将发现赚更多钱的方法，这意味着更多的资金将投入经济！


    请记住，在它们被修复之前，会有更多问题。


    '
