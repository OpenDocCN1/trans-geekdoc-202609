    # Introduction


    Machine learning is permeating numerous aspects of our everyday lives, right from
    optimizing Netflix recommendations to Google searches. Machine learning has contributed
    to improving different facets of building mechanics in smart building space and
    the experiences of the occupant. You do not have to have a Ph.D. to understand
    the different facets and functions of machine learning. This section covers some
    facts about machine learning that are very basic and important to know.


    ## Bifurcation of Machine Learning


    Supervised and unsupervised machine learning are two techniques that programmers
    and scientists use to help machines learn. Smart buildings incorporate both types.
    Here is a simple example of how these types of machine learning look like:


    Let us assume that you want to teach a computer to recognize an ant. When you
    use a supervised approach, you will tell the computer that an ant is an insect
    that could either be small or big. You will also need to tell the computer that
    the ant could either be red or black. When you use an unsupervised approach, you
    will need to show the computer different animal groups and then tell the computer
    what an ant looks like and then show the computer another set of pictures and
    ask the computer to identify the ant until the computer learns the features specific
    to an ant.


    Smart building spaces use both supervised and unsupervised machine learning techniques.
    The applications in these smart buildings allow the users to provide feedback
    to the building to improve the efficiency of the building.


    ## Machines are not fully automatic


    Machine learning helps computers automate, anticipate and evolve but that does
    not mean that they can take over the world. Machine learning uses algorithms that
    human beings develop. Therefore, machine learning still needs human beings since
    they will need to set parameters and train the machine with different training
    datasets.


    Machine learning helps a computer discover patterns that are not possible for
    human beings to see. The computer will then make an adjustment to the system.
    However, it is not good to identify and understand why those patterns exist. For
    instance, smart buildings human beings created smart buildings to ensure that
    the people inside the building help to improve the living conditions of the people.
    However, one cannot expect that a machine will learn to become more productive.
    A human must set up the definitions and rules that the building will need to follow.


    ## Anyone can use machine learning


    Writing a machine learning algorithm is very different from learning how to use
    that algorithm. After all, you do not need to learn how to program when you use
    an app on your phone. The best platforms always create an abstract of the program
    to present the users with an interface, which need minimal training to use. If
    you do know the basic concepts of machine learning, you are ready to go! Data
    scientists must edit or change the algorithms.


    Machine learning has come of this age and is growing quickly. Buildings are using
    machine learning in different ways to make the existing infrastructure efficient
    and help to enhance the experience of the occupants residing in the building.
    Right from an energy usage standpoint, buildings are always learning and analyzing
    the needs of the occupants.


    ## How does this affect us going forward?


    This advance in machine learning goes to say that most things will happen without
    the need for us to ask. Machine learning engineering could go beyond managing
    lighting and temperature. Machine learning implies that there will be some future
    state of multiple layers and levels of automation adjusting based on the current
    activity.


    ## Data Transformation is where the work lies


    When you read through the different techniques of machine learning, you will probably
    assume that machine learning is mostly about selecting the right algorithm and
    tuning that algorithm to function accurately. The reality is prosaic – a large
    chunk of your time goes into cleansing the data and then transforming that data
    into raw features that will define the relationship between your data.


    ## Revolution of Machine Learning has begun


    During the 1980s there was a rapid development and advancement in computing power
    and computers. This gave rise to enormous amount of fear and excitement around
    artificial intelligence, computers and machine learning which could help the world
    solves a variety of ailments – right from household drudgery to diseases. As artificial
    intelligence and machine learning developed as formal fields of study, turning
    these ideas and hopes into reality was more difficult to achieve and artificial
    intelligence retreated into the world of theory and fantasy. However, in the last
    decade, the advances in data storage and computing have changed the game again.
    Machines are now able to work on tasks that once were difficult for them to learn.

    '
