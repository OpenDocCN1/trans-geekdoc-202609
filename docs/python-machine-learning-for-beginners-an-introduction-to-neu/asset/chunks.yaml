    # 第 2 章：神经网络的过程 ![](img/rsrc7W.jpg)


    既然你已经对深度学习及其应用有了更多的了解，我们现在就可以讨论神经网络架构了。对于机器来说，神经网络非常重要。一个编程良好的神经网络将帮助机器像人一样思考并以这种方式处理信息。这些网络由层组成。这些层可以处理许多类型的信息。每一层由神经元组成，神经元共同工作以解决问题。由于神经网络帮助机器像人类一样思考，因此带有神经网络的机器具备学习能力是合理的。模式识别和数据分类是这些机器的用途之一。当神经元发生变化和调整时，网络就能像人类一样进行学习。


    一个不涉足 AI 的人，也就是你在街上可能会交到的人，在得知他们已经遇到过很多人工智能和其他各种机器学习时可能会感到震惊。一些最受欢迎的公司投入了数百万美元用于能够改进其业务的研发。其中一些公司是
    Apple、Google、Facebook、Amazon 和 IBM。尽管你可能不知道，我们的日常生活可能已经受到了这些研究的影响。例如，通过互联网搜索，你将在网站和搜索结果中看到与你输入的关键词匹配的选项。机器学习对这一点非常重要，因为它是允许浏览器过滤数百万种可能推荐的主要手段。同样的原理也用于
    Netflix 推荐或帮助过滤邮件的垃圾邮件过滤器。在医学行业，这被用于药物分类，并在人类基因组计划中起着重要作用，它会处理 DNA 中数无数的模式组合，这些组合可以告诉你关于你的家族史、风险因素或健康前景的状况。


    这些系统适用于大多数行业，因为它们具有高度的适应性和复杂性。这是通过引导计算机完成许多学习过程的算法实现的。通过正确的算法，你可以教会系统检测模式中可能发生的异常行为。这有助于系统学习预测在各种情况下可能出现的可能结果。


    人工神经网络是包含不同类型算法、数据接收器以及许多其他元素的产物。自 20 世纪 50 年代引入以来，人工神经网络一直是科学未来问题的一种解决办法。它们的结构模式与人类大脑非常相似。它们允许机器在编程的训练阶段进行学习。这些知识随后被作为应用于未来问题的解决方案的基础。


    ## 历史背景


    神经网络在计算机出现之前就已经存在了。问题在于人们还不够熟练到可以利用它们。这就是为什么最近神经网络领域取得的进展如此重要的原因。计算机技术的任何发展都有助于神经网络的研究。一种狂热开始了，人们开始对该领域充满热情。然而，大多数尝试都是徒劳的，因为没有出现能够提高我们机器效率和准确性的进展。热情开始减少。然而，一些研究人员坚持不并继续他们的研究。他们努力工作开发出了我们现在拥有的——一种被行业内大多数人接受的技术模型。


    第一个人工神经网络是由 Warren McColloch 和 Walter Pitts 在 1943 年制造的。这被称为 `McCulloch-Pitts`
    神经元。该网络并未被用于执行或自动化复杂任务，因为这对组合缺乏进一步开发网络所需的技术。


    ## 它们是什么？它们是如何工作的？


    人工智能、机器学习和深度学习等术语都是指神经网络中正在发生的过程。在机器学习的方式上，人们可能会持怀疑态度。然而，我们向你保证，这确实意味着它们像人类大脑一样被训练。一个由具有大量微小连接的简单处理器组成的计算分布式模型是思考这些网络的一种好方法。人类大脑由许多许多神经元组成，这些神经元通过突触连接在一起，允许它们在大脑皮层进行分析。学习是通过大脑中连接的变化实现的，这让我们能够习得新技能并学习新技能，从而解决问题。思考这些网络的一种好方法是将其想象为由数百（或成千上万）个微连接集成的许多并行处理器。在人类大脑中，有数百万个神经元通过突触相互连接，允许它们在大脑皮层进行计算和分析。随着这些连接的形成，学习得以实现，让个人获得新技能以解决问题。通过链接连接的数百个同类单元是神经网络的元素。连接的独特配置和简单性使得这种设计非常美丽。数据通过输入层进入网络并到达输出层。同时，数据通过中间的许多层进行处理，直到计算出并执行最终解决方案。在早期，传输信息的少数单元是简单神经网络的核心。然而，今天，一个网络可以由数百万个交织并共同工作的不同单元组成，以模拟学习过程。更现代的网络能够许多方式解决非常困难和复杂的问题。


    ## 为什么要使用神经网络？


    大量的数据被用于改进行业本身。这些数据集中有许多变量，这使得人类难以发现出现的模式。通过神经网络，我们可以更容易地识别这些模式。没有它们，计算机识别数据集中的趋势将是一项艰巨的任务。通过花时间训练神经网络，工程师可以向网络输入巨大的数据集，使其成为特定领域的专家。通过这个训练过的网络，工程师可以预测任何可能输入的输出。这也让工程师能够回答一些关于未来的问题。神经网络有许多优点，以下是其中一些：


    - 由于使用了监督机器学习，神经网络可以适应新任务并学习如何做新事情。

    - 网络可以报告在学习阶段喂给它的任何信息。

    - 具有神经网络架构的机器工作速度快得多，提供的结果更准确。这是因为并行计算数据的能力。

    - 神经网络可以很容易修复。虽然如果网络损坏性能会受到影响，但网络仍然记得某些属性。


    ## McCulloch-Pitts 神经元 - 它是什么？


    人类大脑和人工神经网络之间有许多相似之处。这是合理的，因为这些网络是为了模拟人类大脑而制造的。很容易理解。以下是它们之间的一些相似之处：


    - 数百万个人工神经元构成了它们，每一个都可以计算并解决问题。

    - 每个神经元都有许多不同的连接。

    - 它们是非线性和并行的。

    - 它们可以通过单元之间连接的变化来学习。

    - 它们在发现错误时会适应新知识，而不是惩罚自己。

    - 根据它们从未遇到过的数据，它们可以产生输出。


    这些都描述了神经网络如何工作。虽然它们在表面上非常相似，但我们应该看神经网络整体是如何工作的。McCulloch-Pitts 神经元是神经网络的单元。连接的独特配置和简单性是这种设计美丽的原因。数据通过输入层进入网络并到达输出层。在大脑中，处理的基本单元是神经元。人工神经网络由以下三个元素组成：


    - 连接的权重和突触

    - 总结并处理输入信号的代理

    - 限制神经元输出的系统


    1940 年代是`MCP`神经元首次引入的时间。这种神经元源于逻辑学家 Walter Pitts 和神经科学家 Warren S. McCulloch。他们试图理解人类大脑内部发生了什么，通过连接产生并复制复杂的模式。旧系统的设计非常简单。输入被量化为
    0 到 1，输出被限制在相同。每个输入都是抑制性的或兴奋性的。这种简单性限制了机器的学习能力。虽然有时简单性很棒，但它也有它的缺点。理解复杂话题的能力。`MCP`神经元本应该汇总所有输入，如果输入为正则加
    1，如果为负则减去 1。


    ## 神经网络对比计算机


    神经网络和计算机对每个问题都应用相同的解决方案。后者通常使用算法来寻找解决方案。这告诉我们人类和计算机可以解决类似的问题。计算机闪光的地方在于解决人们不能解决的问题。正如我们多次提到的，人类大脑和神经网络以类似的方式工作：通过相互连接的神经元网络。这些网络通常并行工作以达到最佳效率。工程师可以通过给出一个示例来完成任务，这意味着喂给系统的数据选择非常重要。如果你在选择数据时不小心，可能会让系统更难学习。由于喂给的数据，过程是不可预测的。使用高级编程语言，只需要几步就能为计算机提供指令，随后将这些指令翻译成计算机可以理解的语言。如果计算机在处理时出现问题，它与神经网络协同工作。算术计算是神经网络最好解决的任务。


    ## 神经网络的类型


    ### 全连接网络


    神经网络是最基本的类型。它由相互连接的神经元层组成。输入层是第一层。它连接到隐藏层，然后到输出层。输入层是工程师向系统提供数据。输出取决于隐藏层之间的权重。这种架构很简单，但仍然有趣，因为隐藏层可以用许多方式表示数据。之前提到的权重是连接层的神经元。它们还决定了这些层何时被激活。工程师可以修改这些权重并改变层相互作用的方式。多层和单层架构很容易区分。由于层相互连接，网络的处理能力最大化。在这里神经元不是相互连接的，但层是。


    ### 前馈网络


    这种网络有几个名称。自下向上或自上向下都是馈馈网络的替代名称。这意味着信号和数据只向一个方向流动，从输入点到输出点。这个网络没有反馈回路。这意味着一个实例的输出不会影响另一层的输出。这是最简单的网络之一，因为输入直接与输出。这种网络通常用于识别模式。


    ### 卷积神经网络


    全连接网络与卷积神经网络最相似。由许多神经元组成的许多层构成了这个系统。每个神经元被分配了一个权重。这是由于教学阶段使用的训练数据。当给神经元输入时，它们将进行点积，随后是非线性。`CNN`
    查看原始数据集中的每个输入，使得网络更容易使用向前函数。这些类型的神经网络被大多数深度学习程序使用。


    ### 反馈网络


    反馈网络由于信号的移动而具有特殊性。它们向两个方向流动并在网络中产生循环。这些网络极难制造，但非常强大。网络将在绝对平衡状态下运行，直到你产生变化。这种不断变化的状态将持续到系统再次平衡。如果工程师向系统提供一个新的数据集，它将尝试寻找一个新的平衡点。这就是反馈网络是循环和交互性的原因。


    ### 循环神经网络


    循环神经网络是特殊的，因为信息总是循环。网络会考虑输入并在一旦决定后评估它所学到的内容。`RNN` 通常具有短期记忆。结合长短期记忆（`Long Short-term
    memory`），它获得了长期记忆。不使用示例很难解释 `RNN`。假设你使用的网络是普通的馈馈神经网络。假设你输入单词“brain（大脑）”。系统会将单词拆分为字符并逐个处理它们，总是忘记之前的字符。这意味着这个模型无法预测下一个字符是哪个，除非它已经出现。由于其内部内存，`RNN`
    记得之前的字符并预测下一个。在产生输出时，它将其复制并放回网络本身。遵循：


    - 当前数据

    - 最近数据


    ### 生成对抗网络


    `GAN` 也称为生成对抗网络，由两个相互对斗的网络组成。因此，我们称其为对抗网络。`GAN` 可以被系统中的大多数工程师使用，因为它可以学习模仿任何分布或数据集。它可以被用于在许多领域构建独特的东西。它可以同时处理图片、语音等。你一定会被这些网络的输出感到惊讶。生成器和判别器是这个网络的部分。判别器评估生成器创建的实例，而生成器创建数据实例。


