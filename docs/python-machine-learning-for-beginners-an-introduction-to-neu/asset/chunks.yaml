    # 第 5 章：使用有效的预处理技术组织数据


    数据处理是将数据的本质转变为更有用且更理想的形式的过程。换句话说，就是让数据更有意义和信息量。通过应用机器学习算法、统计学知识和数学建模，可以实现整个过程的自动化。根据所进行的活动和机器的需求，整个过程的输出可以是任何形式，如表格、图表、统计图、图像等。这看起来可能很简单，但对于
    Facebook、Twitter、联合国教科文组织以及健康部门等大型机构和公司来说，整个过程必须以结构化的方式进行。下面的图显示了遵循的某些步骤：


    让我们详细查看每个步骤：


    ### 收集

    在开始机器学习时，最重要的一步是确保可用数据具有高质量。你可以从真实来源收集数据，例如 `Kaggle`、`data.gov.in` 和 `UCI dataset
    repository` 存储库。例如，当学生准备参加竞争性考试时，他们总是寻找最好的资源来确保获得良好的成绩。同样，准确且高质量的数据将简化模型的学习过程。这意味着在测试期间，模型将输出最佳结果。数据收集涉及了大量的时间、资本和资源。这意味着机构和研究人员必须选择他们想要实施或研究的正确类型的数据。例如，面部表情识别需要大量具有不同人类表情的图像。良好的数据将确保模型的输出是准确且真实的。


    ### 准备

    收集到的数据可能是原始形式。原始数据不能直接喂给机器。相反，必须先对数据进行一些处理。准备阶段涉及从广泛的来源收集数据、分析数据集，然后构建一个新的数据集以便额外的处理和探索。准备可以手动或自动完成，并且数据应该被制成数值形式，以提高模型的学习率。


    ### 输入

    有时，已经准备好的数据可能是机器无法读取的形式，在这种情况下，必须将其转换为可读的形式。为了进行转换，存在特定的算法至关重要。执行此任务需要密集的计算和高准确性。例如，你可以通过
    `MNIST`、音频文件、Twitter 评论和视频片段等来源收集数据。


    ### 处理

    在这一阶段，需要机器学习技术和算法在大量数据上执行指令，并保持良好的准确性和更好的计算能力。


    ### 输出

    在这一阶段，机器以合理的方式获取结果，以便用户决定是否引用它。输出可以以视频、图表和报告的形式出现。


    ### 存储

    这是最后一个阶段，生成的输出、数据模型和任何其他重要信息将被保存以供将来使用。


    ## Python 中的数据处理

    在查看如何使用 Python 处理和分析数据之前，让我们学习一些 Python 库的知识。第一件事是熟悉一些重要的库。你需要知道如何将它们导入到环境中。在
    Python 中有不同的方法可以实现这一点。你可以输入：


    ```python

    from math import *

    ```


    在第一种方法中，你为库 `math` 定义了一个别名 `m`。你可以通过创建别名 `m` 使用 `math` 库中的不同函数。在第二种方法中，你导入了整个
    `math` 命名空间。你可以选择直接 `math.func()` 而不使用别名。


    注意：Google 推荐第一种方法，因为它有助于你了解函数的来源。下面的列表列出了你需要的库：


    - `NumPy`：代表 `Numerical Python`。`NumPy` 最先进的特性是 `n`-维数组。该库具有标准的线性代数、高级的随机数能力以及与低级编程语言集成的工具。

    - `SciPy`：它是 `Scientific Python` 的缩写。`SciPy` 基于 `NumPy` 设计。它是线性代数、稀疏矩阵和傅里叶变换等高级科学工程的重要库。

    - `scikit-learn`：它是为机器学习设计的。它是基于 `matplotlib`、`NumPy` 和 `SciPy` 创建的。这个特定库具有许多用于机器学习和统计建模的高效工具。

    - `StatsModels`：该库为统计建模设计。`Statsmodels` 是允许用户探索数据、近似统计模型并实现统计的 Python 模块。


    其他库：

    - `Requests`：用于访问网络。

    - `Blaze`：用于支持 `NumPy` 和 `Pandas` 的功能。

    - `Bokeh`：用于在当前的浏览器中创建仪表板、交互式图形和数据应用程序。

    - `Seaborn`：用于统计数据可视化。

    - 正则表达式：用于发现文本数据中的模式。

    - `NetworkX` 和 `Igraph`：应用于图数据操作。


    ### 使用 Pandas 进行 Python 探索分析

    如果你不知道，Pandas 是 Python 中一个重要的数据分析库。该库在数据科学社区的应用起了关键作用。我们的示例使用 `Pandas` 从 analytics
    Vidhya 竞赛读取数据集，运行探索性分析，并创建一个分类分类算法来解决这个问题。


    在加载数据之前，了解 `Pandas` 中的两种主要数据结构是非常重要的。那就是 `Series` 和 `DataFrame`。


    ### Series 和 DataFrame

    你可以将 `Series` 视为一个带标签的一维数组。这些标签帮助你通过标签来理解该系列中的单个元素。


    `DataFrame` 类似于 Excel 工作簿，包含列名（引用列）以及也可以通过行号访问的行。主要的区别是列名和行号被称为列索引和行索引。


    '
