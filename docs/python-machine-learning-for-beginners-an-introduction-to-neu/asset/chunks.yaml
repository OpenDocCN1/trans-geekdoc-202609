    \ Python statement which is defined within braces `()`, `{}` and `[]` does not\
    \ require the line continuation character `\\` when written as a multi-line statement.\
    \ This kind of Python statements are still interpreted as a single statement without\
    \ the use of the line continuation character `\\`.\n\n## Quotation in Python\n\
