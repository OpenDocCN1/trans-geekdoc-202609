    一旦导入了库，你就可以继续使用 `read_csv()` 函数读取数据集了。以下是目前为止的代码样式。


    ![Description: 00028.jpeg](img/rsrcU3.jpg)


    注意数据集的存储位置。一旦读取了数据集，你可以决定使用 `head()` 函数检查前几行。接下来，你可以使用 `describe()` 函数查看数值型字段的摘要信息。


    ### 分布分析

    由于你已经熟悉数据的基本特征，现在是时候查看不同变量的分布了。让我们从数值变量——`ApplicantIncome` 和 `LoanAmount` 开始。


    首先，输入以下命令来绘制 `ApplicantIncome` 的直方图。


    ![Description: 00029.jpeg](img/rsrcUE.jpg)

    ![Description: 00030.jpeg](img/rsrcUK.jpg)


    注意，这里有几个极值。这就是为什么需要 50 个箱体（bins）来清晰地表示分布。下一个关注点是箱线图。`fare` 的箱线图通过以下代码绘制：


    ![Description: 00031.jpeg](img/rsrcUU.jpg)

    ![Description: 00032.jpeg](img/rsrcUY.jpg)


    在涉及 Python 数据处理时，这只是冰山一角。让我们来看：


    ### Python 中的数据预处理技术

    以下是 Python 中数据预处理的最佳技术。


    #### 1. 数据缩放 (Rescaling Data)

    当你处理具有不同尺度的数据时，需要缩放属性以具有相同的尺度。这些属性被缩放到 0 到 1 的范围之间，这被称为归一化（normalization）。为了实现这一点，使用了
    `scikit-learn` 中的 `MinMaxScaler` 类。


    ![Description: 00033.jpeg](img/rsrcVE.jpg)


    例如：


    ![Description: 00034.gif](img/rsrcVJ.jpg)


    缩放后，你会得到 0 到 1 之间的值。通过缩放数据，可以确认神经网络、优化算法以及那些具有距离度量的算法（如 `k-nearest neighbors`）的使用。


    #### 2. 数据归一化 (Normalizing Data)

    在后续的任务中，你将每个观测值缩放到特定的长度 1。在这种情况下，你使用 `Normalizer` 类。这是一个示例：


    ![Description: 00035.jpeg](img/rsrcVW.jpg)

    ![Description: 00036.gif](img/rsrcW2.jpg)


    #### 3. 数据二值化 (Binarizing Data)

    如果你使用二值阈值，可以更改数据并将高于阈值的值设为 1，而将等于或低于阈值的值设为 0。对于这项任务，你使用 `Binarized` 类。


    ![Description: 00037.jpeg](img/rsrcWB.jpg)

    ![Description: 00038.gif](img/rsrcWG.jpg)


    如所示，Python 代码会将所有等于或小于 0 的值标记为 0，将其余部分标记为 1。


    #### 4. 均值移除 (Mean Removal)

    这是你从每个属性中移除均值以使其中心零的操作。


    #### 5. 独热编码 (One Hot Encoding)

    当你处理少数且离散的数值时，在执行独热编码之前可能需要对它们进行存储。对于 `k` 个不同的值，你可以将特征转换为 `k` 维向量，其中一个值为 1，其余值为
    0。


    ![Description: 00039.jpeg](img/rsrcWX.jpg)


    #### 6. 标签编码 (Label Encoding)


