- raw: '  Machine Learning Systems – Building a Roadmap Up to this point, we have
    looked at the basic machine learning concepts and the different machine learning
    types. Now we need to look at the rest of a machine learning system, the important
    parts that go with the algorithm. There are three important subsections to consider. 
    Preprocessing Preprocessing is the act of getting our data into shape. Raw data
    is very rarely in the right format or shape required for the learning algorithm
    to work properly. The images of the flowers are the raw data from which we will
    be looking for meaningful features. Those features could be color, intensity,
    hue, height, length of the flower, width of the flower, and so on. A lot of machine
    learning algorithms will also require the chosen features to be on identical scales
    for the best performance and this is achieved by transforming features in a range
    or by using standard distribution with “zero mean and unit variance”.  Some of
    the features selected may be correlated and that means, to a certain extent, they
    are redundant. In these cases, we can use the dimensionality reduction to compress
    those features down to a lower subspace. By doing this, we don’t need as much
    storage space and the algorithm is significantly faster. In some cases, reduction
    can also make the predictive model performance more efficient, especially if the
    dataset has got multiple instances of noise (features that are not relevant) –
    you will often see this as having a low ratio of signal to noise.  To see if the
    algorithm is performing as it should on the training dataset while reacting positively
    to new data, we will need to divide the dataset randomly into two sets – training
    and test. The training dataset trains the model and optimizes performance, while
    the test set is used last to evaluate the finished model. Training and Choosing
    Predictive Models You will see throughout this guide that many of the algorithms
    are designed to solve specific problems. There is one important thing to remember
    – learning is not free. This concept can easily be related to another popular
    saying by Abraham Maslow in 1966 – “I suppose it is tempting, if the only tool
    you have is a hammer, to treat everything as if it were a nail”. Let’s put this
    into context. Every one of the classification algorithms has got biases built
    into it. No one classification model is superior to any other provided we make
    no assumptions regarding the task. In practical terms, it is vital that several
    algorithms are compared so that the best model can be selected and trained. However,
    before we can do this, we need to decide which metric we are using to measure
    the performance. One of the most common metrics is classification accuracy and
    this is defined as a set proportion of instances that have been classified correctly. 
    But, and this is a legitimate question, how will we know which of the models will
    perform the best on the final test and on real-world data if the test set is used
    ONLY for the final evaluation and NOT on the model selection tests? To address
    this issue, we can use multiple techniques for cross-validation – the training
    dataset is split into two subsets: training and validation. This is done so that
    the model’s generalization performance can be estimated. Lastly, although many
    software libraries offer learning algorithms, we should not take it for granted
    that the default parameters of these algorithms will fit the specific problem
    we are trying to solve. Instead, we will use techniques called hyperparameter
    optimization to fine-tune our model’s performance and we’ll see how this is done
    later. Basically, the hyperparameters can be thought of as parameters that cannot
    be learned from the dataset but instead, they represent dials that we can turn
    to improve the performance of the model. Model Evaluation and Prediction of Unseen
    Data Instances Once we have our model, the test dataset can be used to estimate
    how the model performs on unseen data. In this way, we can gain an estimation
    of the generalization error percentage. If we are happy with the way the model
    performs, we can use it for predicting future data. Be aware of one thing – it
    is vital that the parameters for the procedures we talked about, like dimensionality
    reduction and feature scaling, are obtained ONLY from the training dataset and
    are then applied to the test dataset to transform it. They are also applied to
    new samples of data. If we don’t adhere to this, the test data may produce an
    overly-optimistic performance measurement. Problems Of Machine Learning Machine
    Learning is still evolving and still being used every day. As it is used more,
    the more we are going to be able to figure out where the problems are and what
    needs to be done to fix them. Some of these problems are yet to be solved, but
    that does not mean that there will not be a solution later in the future.    One
    problem is that natural language processing and understanding language is still
    a problem when it comes to Machine Learning, even with the deepest networks. Because
    of the many different languages and dialects, it is hard for machines to decipher
    what is being said. But that does not stop them from trying. Programs such as
    Alexa, Siri and Cortana are constantly being updated so that they can better serve
    their users.  Images can be classified with Machine Learning, but it cannot figure
    out what is going on in the image. By understanding what is going on in an image,
    it cannot be further classified. But we are going to have the option to figure
    out where the influences in the image lie and how we would be able to recreate
    the work in the same style. This also leads to solving semantic segmentation.
    Machines should be taught how to identify what is going on in each pixel so that
    we can better understand what is going on in the image.    Deep reinforcement
    needs to be stabilized as well. If something is not broken, why attempt to fix
    it? Sometimes the old ways work the best, and there is no reason to be messing
    with the model that already works. With deep reinforcement being stabilized, this
    would be possible. This is then going to allow deep reinforcement to tackle harder
    problems that have yet to be touched by Machine Learning such as Montezuma''s
    revenge.  On top of that, with stabilized reinforcement, learning the ability
    to control robotics would open up exponentially, and the possibilities would be
    endless. There is no telling how far robotics would go because they would be able
    to figure out the best way to receive their reward; in other words, they would
    be given the option to act like humans but have an incentive as to what they should
    do to get that reward.    GANs are generative adversarial networks that are going
    to work with a specific class of artificial intelligence. It is a set of algorithms
    that will be used with unsupervised learning which will then be implemented on
    a system of two neural networks working against each other in a zero-sum game
    framework. While they are great for those who use Machine Learning for games,
    they are highly stabilized and make gaming harder because they are known to frequently
    crash.  Training deep nets is an issue as well because it has been proven by the
    shattering of gradients paper that those that use Machine Learning do not understand
    yet how to train their nets properly. That also leads to the fact that no one
    quite understands what deep nets do in general. There have been those that have
    written papers on what deep nets are and why they are required, but then there
    have been those that have written papers on how deep nets are not needed, and
    they tend to make life more complicated. So, why are deep nets there? And do we
    actually need them?  Lastly, there has to be a way to get people to stop worrying
    so much about things such as Skynet and the economic impact. First of all, Skynet
    is a fictional company in the movie Terminator and is not going to happen. Before
    robots are able to make their own decisions if ever, there will no doubt be a
    failsafe in place that is going to ensure that the robots do not rise up against
    humans and try to kill them. All Skynet is, is a good plot for a movie franchise
    that millions of people love. Secondly, what is the economic impact of Machine
    Learning? With Machine Learning, companies are going to have the ability to figure
    out where they are going to make more money and that means that more money is
    going to be put into the economy!  Besides certain things in Machine Learning
    not being stabilized, Machine Learning does not have that many problems. It is
    hard to remember that Machine Learning is still in its infancy and is still being
    trained as technology evolves, so we have to be patient and keep in mind that
    there are going to be more problems before they are to be fixed.  Problems with
    Machine Learning That Have Not Been Solved   Machine Learning is evolving as technology
    evolves, so it is highly likely that there are always going to be issues that
    will have to be dealt with before an answer is found. There are going to be ways
    around these issues, and even if there are not, there are going to be ways for
    you to analyze and get your data results despite these issues. Below, are a few
    issues that have yet to be solved by Machine Learning.    One, the variable event
    space has not been solved yet to solve this, we are going to need to be able to
    create a classification system that is going to respond in an efficient and meaningful
    way even if the event space is varying from the training data.  Another one is
    that there is no context understanding when it comes to the processing languages.
    Context analysis is a big deal for Machine Learning because it leaves a large
    hole open for things to be misunderstood. One possible solution is that the open
    AI team should come up with a solution that allows the agents to create their
    own rules instead of making it to where they need to find patterns.    Facial
    identification is quickly becoming a popular way for people to unlock their device
    because it is quick and a semi-secure way to keep your device from being hacked.
    However, it is by no means perfect because people with similar facial features
    will be able to get into each other’s phone. Not only that but if a female wears
    makeup and does not for the facial recognition picture, then she is not going
    to be able to get into her phone because she altered her appearance.  Automated
    learning is a big part of Machine Learning, and if a machine cannot automatically
    learn what it is supposed to, then it is not going to be useful to the company
    that is using it. Learning has to come from a variety of resources, and when a
    graph is being made based on the connected sense that is missing, then the automated
    learning is going to hit a snag and is going to have gaps in what it is able to
    do. For example, IBM''s Watson has been doing an excellent job, but it still requires
    a system that is more geared toward automated general intelligence.    In some
    Machine Learning, the machine is going to need to make its own decisions based
    on its reasoning over a deviating test space; but this is not going to include
    the rule-based engines. To make the reasoning that is required, Machine Learning
    will need to have space for reasoning or debatable agents that will help with
    its reasoning.    Have you ever talked to Siri and she got confused if you are
    trying to talk to her or if you are talking to someone else? This is an issue
    that Machine Learning has with its efficient repose generation. In other words,
    Siri cannot create a contextual response when you are talking to her unless it
    is already programmed in or if she can look it up on the internet.  The three-way
    human rule is an issue with Machine Learning as well. Machines cannot always comprehend
    the knowledge that humanity has a three-way rule that takes an image, gives it
    a type, and then gives it a description. If Machine Learning could comprehend
    the three-way human rule, then classifying art, music, and others would be an
    easier task.  Another issue that Machine Learning has shown is its memory networks.
    Many people believe that working with technology means that you do not need a
    lot of space. However, this is far from true because to store all of the data
    that is collected, there needs to be a lot of space available.  Machines are not
    humans, so they are not going to be able to come up with the thoughts that a human
    is able to come up with. But machines can be taught as long as we do not push
    them past their limits, but we do not limit them to where all of the work still
    needs to be done by a human. Technology is going to have its hold-ups, but eventually,
    they can be solved. One reason they may not be solved yet is that the technology
    needed to solve it does not exist yet.  Problems That Can Be Solved Machine Learning
    is helping out a lot of companies as well as individuals in their daily lives.
    In this section, you will see some points that were mentioned above as problems
    that have not been solved by Machine Learning just yet. Even though there are
    issues with that particular piece of Machine Learning, that does not mean that
    it does not work. Sometimes, these issues can be patched or fixed at a later date
    while the software is put out for users to use and discover what issues there
    may be with the software that the developers did not catch.  Machine Learning
    helps with spam detection. When you get into your inbox, there are always emails
    that automatically gets routed to your spam box because of keywords that are detected
    in other emails. Yet some spam is allowed through because these keywords have
    been found in your inbox. It is going to filter those keywords to your inbox on
    the slight chance that you are going to want the emails even though they are spam.
    Spam detection still has a long way to go, but it is getting better as more rules
    are made.  Have you ever wondered how the credit card companies are able to know
    when someone has used your card? It is because of the transaction record that
    they keep! Every month, the credit card company knows your usual stores and about
    how much is going to be spent. If they see any activity outside of your usual
    area or outside of how much you usually spend, they are going to say that the
    card was stolen and report it as such. This can cause problems later on if you
    decide to go on a trip or if you spend over what you normally spend.  It is not
    perfect, but Machine Learning is learning how to recognize zip codes written on
    envelopes so that they are able to sort the envelopes out into geographical locations
    and that way the mail is sorted faster and is delivered faster. There are still
    some issues with this as machines are not always able to read a person''s handwriting
    since everyone writes in a different manner.  As mentioned, Siri or Cortana is
    able to understand what you are saying. But, what if other machines were also
    capable of doing this? Thanks to Machine Learning, this is now becoming a reality.
    The biggest issue is that everyone has different dialects and speaks a different
    language. Not only that, but new words are being added to the dictionary almost
    daily. But, even with there being issues in machine’s understanding of what is
    being said to them, this does not stop them from trying to fulfill the request
    that is made.  When you upload a picture on Facebook, there is an algorithm that
    looks at the facial features of those in the picture and asks you if you would
    like to tag that person. This allows the person to see the picture where they
    were tagged and allows them to decide if they want it on their profile or not.
    The same algorithm is used when a user decides to use the facial recognition software
    on their phone or computer to unlock their device.  Everyone knows when they log
    into websites such as Amazon, there is a list of products that are recommended
    to you because of your past purchases or because of things that you have looked
    at. There is a model that is built-in to the code of the website that allows it
    to figure out ways to target you specifically as an individual so that you are
    given a more personalized shopping experience. In doing this, Amazon and other
    websites that use the same algorithm are hoping that they are going to be able
    to keep you coming back to spend money with them. This algorithm can also be seen
    in Facebook because it allows you to log into other websites so that it can provide
    you with ads that you may want to see instead of generic ads that are not going
    to catch your attention.  The medical field has to advance with technology, or
    else it falls behind. Because of Machine Learning, the medical field is able to
    take the symptoms that a patient is feeling. This allows them to plug the symptoms
    into their computer and get a list of diagnosis. This is not going to be perfect,
    but it is going to point the healthcare provider in the right direction so that
    they are able to figure out what is wrong with the patient.  When it comes to
    trading stock, it is vital to know when you are going to trade or hold on to your
    stock so can make more money. Machine Learning has come up with an algorithm that
    looks at the financial information and analyzes it so that stockbrokers are able
    to know when they should trade and when they should let their stocks go. This
    is helping many companies save money, so they are not buying useless stocks or
    so that they are not holding onto a stock that is about to lose all of its value. 
    Data entry by humans is going to have issues such as duplication and inaccurate
    data. But, with Machine Learning, algorithms work with predictive modeling algorithms
    to improve these issues. They learn how to perform time-intensive documentation
    and other data entry tasks. This opens up more free time for those with the proper
    knowledge to be able to work on the more intensive problem-solving tasks because
    they do not need to deal with the menial data entry jobs that machines are able
    to do.    Machine Learning is used by most of the companies that are in business
    today. It may not be used in a way that is automatically visible to the general
    public or even their employees, but it is being used even in the simple way of
    analyzing data. This aids them in making better decisions in gaining money rather
    than losing money. Where And How Machine Learning Is Used Machine learning is
    already in widespread use in many different industries. It''s used for anti-lock
    braking, autopilot in airplanes, search engines, product recommendations, maps,
    and driving directions, spam screeners, language translation, personal digital
    assistants, weather maps, and more. Any organization that has a lot of data and
    is looking for better ways to understand and use that data can benefit from this
    technology. Several companies have used machine learning to build some of the
    most lucrative businesses on a getting-to-know-you-better platform. Google, Facebook,
    Apple, LinkedIn, and Twitter are all using machine learning to make sure you have
    access to relevant data. Some companies are even pushing the envelope of privacy
    by analyzing your search history or personal or professional connections. By learning
    more about you they can personalize their service for you. That''s why your Facebook
    newsfeed is completely unique to you. It''s also why two people googling the exact
    same search term may get completely different results. Any time you''re on a website
    and you see something like "recommended for you," you''re probably benefiting
    from machine learning. Amazon may examine your previous purchases and then use
    machine learning to recommend other products you might like. Netflix tries to
    figure out your taste in movies to suggest other shows you might enjoy. YouTube
    tracks what you watch and recommends related videos. Each of these online services
    uses machine learning to try to turn you into a long-term customer or user. Other
    organizations are using machine learning for automatic translation. YouTube might
    use it to transcribe video and generate captions. Some sites use a very similar
    machine learning technology to translate captions into different languages. Through
    natural language processing (NLP), powered by machine learning, some services
    translate captions into a synthesized voice that sounds similar to a human being.
    With machine learning, computers tap the power of artificial intelligence to process
    massive data sets and extract valuable information from that data. They can find
    connections in the data that humans could never detect on their own and may never
    think to look for. Sometimes we can understand how these intelligent computers
    made the connection and other times we cannot. One of the most interesting aspects
    of machine learning is that it doesn''t replicate human learning; it''s a completely
    different way to find connections, make decisions and gain greater understanding.
    So if you''re planning to use machine learning in your organization, you have
    to start thinking about how machines learn, so you can start to collect data that
    will help the machine learn to perform the task you need it to perform. Machine
    learning didn''t start to really gather steam until companies had large datasets,
    and that''s not a coincidence; data is the fuel that drives machine learning.
    That''s why some of the first companies that benefited from machine learning were
    the ones that had access to massive datasets. Data plays a crucial role in what
    the machine learns, how well it learns, and how fast it learns. Usually, the more
    data you have, and the better that data is, the sooner the machine will start
    delivering useful insights. So before you start your machine learning project
    you should think about your data. Is it high quality? Do you have enough for the
    computer to learn something new? Is the dataset broad enough to accurately represent
    whatever you''re asking the machine to examine? The broader the view, the more
    likely it is to find something interesting. You don''t want your program looking
    through a keyhole. If you plan to use this technology, think about some strategies
    for collecting diverse, high-quality datasets. '
