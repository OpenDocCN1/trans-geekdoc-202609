- raw: 'Chapter 2: The process of neural networks ![](rsrc7W.jpg)We can talk about
    neural network architecture now that you know more about deep learning and its
    applications. Neural networks are very important for machines. A properly programmed
    neural network will help the machine think like a person and process information
    in that way. These networks are made out of layers. These layers can process many
    kinds of information. Each layer is made out of neurons that all work together
    to solve problems. Since neural networks help machines think like humans, it makes
    sense that machines with neural networks are capable of learning. Pattern recognition
    and data classification are some of the things that these machines are used for.
    When neurons change and adjust, the network can learn, similar to human beings.
    A person who does not dabble with AI, somebody that you may talk to on the street,
    could be shocked to learn that they have encountered a lot of artificial intelligence
    and other kinds of machine learning. Millions of dollars are spent by some of
    the most popular companies in order to research that will improve their business.
    Some of these companies are Apple, Google, Facebook, Amazon, and IBM. Our day
    to day lives might be impacted by this research already, even though you might
    not know it. With internet searches, for example, you will be shown options on
    websites and searches that match the keywords you typed in.  Machine learning
    is important for this as it is the main thing that allows your browser to filter
    through the millions of possible recommendations. The same principle is used in
    Netflix recommendations or spam filters that help filter through your emails.
    In the medical industry, this is used for the classification of medication and
    has an important role in the Human Genome Project where it goes through the countless
    combinations of patterns in DNA that can tell you something about your family
    history, risk factors, or health prospects. These systems are applicable in most
    industries as they are highly adaptable and sophisticated. This is made possible
    through algorithms that guide the computer through many learning processes. With
    the correct algorithms, you can teach a system to detect abnormal behaviors that
    can happen within a pattern. This helps the system learn how to predict possible
    outcomes that may occur in a wide variety of situations.   An artificial neural
    network is something that contains algorithms of different kinds, data receptors
    and a plethora of other elements. Ever since they were introduced during the 1950s,
    artificial neural networks have been a remedy when it comes to the future of science.
    They are patterned similarly to the human brain. They allow the machine to learn
    during the training phase of programming. This knowledge is then used as a foundation
    for solutions that would be applied to problems in the future. Historical Background
    Neural networks have been a thing since before computers. The problem was that
    people were not proficient enough for utilizing them. This is why the recent advances
    made in the field of neural networks are so important. Any developments in computer
    technologies help the research of neural networks. A craze started and people
    started being enthusiastic over the field. However, most attempts were fruitless,
    as no advancements that could help to improve the efficiency and accuracy of our
    machines. The enthusiasm started to decrease. However, some of the researchers
    remained steadfast and continued their studies. They worked hard in order to develop
    what we have now, a technology model that is accepted by most people in the industry.
    The first artificial neural network was made by Warren McColloch and Walter Pitts
    in the year 1943. This was called the McCulloch-Pitts neurons. The network was
    not used to perform or automate complex tasks as the duo did not have the technology
    needed for the further development of the network.  What Are They and How Do They
    Work? Terms like artificial intelligence, machine learning, and deep learning
    are all terms that refer to processes that are happening in and to the neural
    network. People might be skeptical when it comes to the way machines learn. However,
    we assure you that it really means that they are trained like human minds are. 
    A computational distributed model is made up of simple parallel processors with
    a plethora of tiny connections is a good way to think about these networks. The
    human brain is made from many, many neurons that are interconnected via synapses
    which allow them to make analysis and computations in our cerebral cortex. Learning
    is achieved with the change in the connections in our brains allow us to acquire
    new skills and learn new skills so that we can solve difficult problems.  A good
    way to think of these networks is to think of many simple parallel processors
    integrated with hundreds (or thousands) of tiny connections that make up a computational
    distributed model. In the human brain, there are millions of neurons all interconnected
    by synapses that allow them to make computations and analysis in the cerebral
    cortex. As these connections are made, learning is achieved allowing the person
    to acquire new skills so they can accomplish complex problems. Hundreds of homogenous
    processing units that are interconnected through links are elements of a neural
    network. The unique configurations of connections and simplicity are what make
    this design truly beautiful. Data goes into the network through an input layer
    and goes to the output layer. In the meantime, the data is processed through the
    many layers in between until the problem is computed and a final solution is carried
    out. Only a few units that transfer information were the gist of the structure
    of the simple neural networks in their earlier days. Today, however, a network
    could be made up of millions of different units that are intertwined and work
    together in order to emulate the process of learning. More modern networks are
    able to solve very difficult and complex problems in many ways. Why use Neural
    Networks? Large volumes of data are dedicated to making improvements to the industry
    by the industry itself. There are many variables in these datasets that can make
    it difficult for humans to find patterns in that appear in the datasets themselves.
    Via neural networks, we can recognize these patterns more easily. Without them,
    computers could find it to be a difficult task to identify trends in the dataset.
    By taking the time to train a neural network, an engineer can feed the network
    huge datasets in order to turn it into an expert in a selected area. With this
    trained network, the engineer can predict the output for any possible input. This
    also allows the engineer to be able to answer some questions about the future.
    Neural networks have many advantages and here are some of them: •         A neural
    network can adapt to new tasks and learn how to do new things because of it using
    supervised machine learning  •         The network can be used to report back
    any information that was fed to it during the learning stage •         Machines
    with neural network architecture work far faster and provide more accurate results.
    This is because of the ability to compute data in parallel. •         Neural networks
    can be fixed fairly easily. While performance will be affected if the network
    is damaged, the network will still remember some of the properties. The McCulloch-Pitts
    Neuron - What is It? There are a lot of similarities between the human brain and
    artificial neural networks. This makes sense due to the fact that these networks
    were made to emulate how the human brain This much is easy to understand. The
    following are some of the similarities between them: •          Millions of artificial
    neurons make them up and each one of them can compute problems and solve them
    •          Each neuron has many different connections •          They are both
    non-linear and parallel •          They can learn through the change in the connection
    between units •          They adapt to new knowledge when they find an error instead
    of penalizing themselves •          Based on the data that they never came across
    before, they can produce outputs These all describe how the neural network, as
    a whole, works. While the two are very similar on the surface, we should look
    into how the smallest of the units work. The McCulloch-Pitts neuron is the smallest
    part of the network. In the brain, the basic unit of processing is a neuron. In
    the artificial neural network, this unit is the main part of processing any type
    of information and calculations of any kind. It is made from the following three
    elements: •          The weight and synaptic efficacy of connections, as well
    as the connections themselves •          An agent that summarizes and processes
    input signals and outputs linear combinations •          A system that limits
    the neuron’s output The 1940s was the first time that the MCP neuron was introduced.
    This neuron got its name from the logician Walter Pitts and the neuroscientist
    Warren S. McCulloch. They tried to understand what happens inside of the human
    brain when we try to produce and understand complex patterns and replicate them
    through the connections between the many basic cells. The design of old systems
    was very simple. The input was quantified from zero to one and the output was
    limited to the same domain. Every input was either inhibitory or excitatory. This
    simplicity made the design limited the learning capabilities of the machine. While
    sometimes simplicity can be great, it also has its downfalls. It costs the computational
    ability to comprehend complex topics. The MCP neuron was supposed to sum up all
    of the inputs. The neuron takes all of the positives and negatives that appear
    and compiles them, adding plus one if an input is positive and taking one away
    if the input is negative. Neural Networks versus Conventional Computers Neural
    networks and computers do not apply the same kind of solution to every problem.
    The latter usually use algorithms in order to find solutions. Conventional computers
    also have another method of solving a problem. If you taught it the steps that
    it should follow it should do good by them in order to find a solution. What this
    tells us is that humans and computers can solve similar problems. Where computers
    shine is solving problems that people can’t. As we have said numerous times, the
    human brain and neural networks work in a similar manner: through a network of
    interconnected neurons. These networks usually work in parallel for the best efficiency.
    An engineer can teach a network to complete a task by giving it an example of
    how it should approach the solution. This means that selecting the data you feed
    to the system is very important. If you are not careful when selecting the data
    you might make it harder for the system to learn the process. The networks are
    unpredictable as, due to the data they are fed, it might learn to solve problems
    that the engineer didn’t foresee. Computers apply some cognitive approaches when
    solving problems, as well. If the engineer gives the computer proper instructions
    the computer can act on them and solve problems. Using a high-level programming
    language, it takes only a few steps for the engineer to provide the instructions
    to the computer. The computer, later, takes these instructions and translates
    it into a language that the computer can understand. This process allows the engineer
    to predict how the computer will go about solving certain problems. If the computer
    reports a problem while processing, the engineer can conclude that there should
    be an error in the software or hardware. Conventional computers work in tandem
    with neural networks. Arithmetic calculations are a kind of task that is best
    solved by conventional algorithmic computers. On the other hand, other, more complex
    tasks, can be solved by neural networks most efficiently. Most tasks are best
    solved by combining the two approaches so that the machine can work at peak efficiency,
    Types of Neural Networks Fully connected neural network A network layer is the
    most basic type of neural network architecture. It is composed out of three layers
    of neurons which are interconnected. The input layer is the first layer. It is
    connected to a hidden layer of neurons which then proceed to the output layer.
    The input layer is where the engineer gives data to the system. The nodes that
    connect the hidden layer and the input layer dictate how the input layer views
    the data it is given. What kind of data outputted depends on the weights and connections
    between the secret layer and output layer.  This kind of architecture is simple,
    but still interesting because the hidden layers can represent data in many ways.
    The weights mentioned before are nodes that connect layers. They also determine
    when these layers need to be activated. An engineer can modify these weights and
    change the way the layers interact. He can do this to ensure the way the hidden
    layer shows data is conducted the correct way. It is fairly easy to tell a multilayer
    and single-layer architecture apart. When it comes to single-layer architecture,
    neurons are connected at the nodes. This means that the processing power of the
    network is maximized due to all of the layer being interconnected. When it comes
    to multilayer architecture there are more layers to the system. Here neurons are
    not interconnected, but the layers are. Perceptrons The term perception was coined
    in 1960 by Frank Rosenblatt. This happened during a time where neural network
    architecture developed greatly. Perceptions represent a kind of McCulloch and
    Pitts model which is assigned a pre-processing and fixed weight.  This makes the
    system easier to use when it comes to recognizing the patterns, resembling the
    function in human beings. This network can be used in other processes too. Feed-forward
    Networks There are several names for this kind of network. Bottom-up or top-down
    are both alternative names for feed-forward networks. This means that signals
    and data will flow in only one direction, from the input point to the output point.
    This network does not have a feedback loop. This means that output gotten in one
    instance will not affect output that comes in another layer. This is one of the
    simplest networks to make as input is directly associated with output. This network
    is often used in recognizing patterns. Convolutional neural networks Fully connected
    neural networks are what convolutional neural networks bears the most similarity
    to. Many layers made from many neurons are what makes up this system. Each neuron
    is assigned with a weight. This is due to the training data that was used during
    the teaching phase. When input is given to a neuron they will make a dot product,
    which is followed by a non-linearity. You might wonder what the difference between
    a fully connected neural network and a convolutional network is. A CNN views each
    input in the original dataset to be an image which an engineer can encode properties
    of the system into. This reduces the number of instances in the original dataset
    and it makes it easier for the network to use the forward function. These types
    of neural networks are used by most deep learning programs. Feedback networks
    Feedback networks are specific due to the movement of the signals. They flow in
    both directions and induce a loop into the network. These networks are extremely
    difficult to make, but are very powerful. The network will function in a state
    of absolute equilibrium until you create a change. This state of constant change
    will continue until the system equalizes again. If an engineer feeds a new dataset
    to the system, it will try to find a new point of equilibrium. This is the reason
    why feedback networks are recurrent and interactive. Below we will discuss recurrent
    neural networks. Recurrent neural networks Recurrent neural networks are special
    because the information always loops. The network will consider the input and
    asses what it has learned, once it decides. RNN usually has short-term memory.
    In combination with Long Short-term memory, it gains long-term memory. We will
    further discuss this bellow. It is difficult to explain RNN without using an example.
    Let’s say that the network you are using is a regular feed-forward neural network.
    Let’s say that you input the word “brain”. The system will separate the word into
    characters and go over them one by one, always forgetting the previous characters.
    This means that this model cannot be used to predict which character is next unless
    it has already been gone over. Due to its internal memory, an RNN remembers previous
    characters and predicts the next ones. While producing outputs, it copies them
    and puts them back into the network itself. This means that RNNs will produce,
    on top of the present information, five immediate past information. Due to all
    of this, the following inputs are all a part of an RNN: •          The Present
    Data •          The Recent Data As always, the dataset selection is very important.
    The dataset used to teach the model will affect how the system uses sequences
    while predicting upcoming characters in a text. This places RNN in front of most
    algorithms when it comes to the functions they can perform. Unlike a feed-forward
    network, RNN applies weight to both the previous and current input data and shifts
    the weights that have already been assigned, while a feed-forward network assigns
    weights to neurons in each layer in order to produce and output.  Generative adversarial
    network A GAN, also known as a generative adversarial network, is made up of two
    networks that have been pitted against each other. Due to this, we call it an
    adversarial network. GAN can be used by most engineers in a system, because it
    can learn to mimic any distribution or dataset. GAN can be used to build something
    that is unique to you in many domains. It can simultaneously process pictures,
    prose, speech, etc. You are bound to be impressed by the output of these networks.
    A generator and a discriminator are parts of this network. The discriminator evaluates
    instances made by the generator, while the generator creates the data instances
    themselves. The discriminator''s job is to identify if a new instance is from
    a premade training dataset or not. Training the Neural network Training your neural
    network is one of the most important parts of making a neural network. There are
    a few methods to do this, however, only one method has the most positive results.
    Error backpropagation, also known as the error propagation algorithm, symmetrically
    adjusts the weights on connections and neurons. This means that if the system
    makes a mistake it will learn from it and come closer to the correct solution
    every time. This kind of training has two stages: stage 1, also known as the forward
    propagation, and stage 2, also known as back propagation. In stage 1, a calculation
    of all of the activated neurons in all of the layers is performed. During this
    stage, there is no change to synaptic connection weights. What this means is that
    the default values will be used in the first iteration of the system. During phase
    2, however, we are given an actual answer from the network and we can compare
    the output to the expected output in order to determine the error rate. The error
    rate is then taken into account and it is returned to one of the synaptic connections.
    Modifying the weights then decreases the difference between the expected value
    and the value we got. This process happens on and on until the error margin is
    decreased to the point where it can’t be decreased anymore. •         Forward
    Propagation: in forward propagation, the first input is the initial data that
    is then transferred to the hidden layers where it is processed until an output
    is produced. The activation functions, the depth of the data, and the width of
    the data all depend on the basic architecture of the network. Depth tells us how
    many hidden layers exist within the system. The width tells us the number of neurons
    in each layer and the activation functions instruct the system on exactly what
    to do. •         Backward Propagation: It allows for the weight of the connections
    to be adjusted via a supervised learning algorithm. This is done in order to reduce
    the difference between the solution we got and the expected solution. Neural networks
    are a very interesting field of study and keeps getting more and more intricate,
    now using machine learning. It has a huge amount of potential to aid the creation
    of future developments in computer science. •          They are adept at solving
    problems whose solutions require a certain degree of error •          They can
    use experience from solving previous problems and use it to solve problems it
    encounters for the first time.   •         Their implementation is a piece of
    cake as the definitions for duplication, neurons, and creating connections are
    easy to understand •          It completes operations fairly quickly as every
    neuron operates on only the value it received as input •          Stable outputs
    directly relate to the input values •          Before producing a result, they
    can take all of the inputs into accounts Neural networks still have a few drawbacks,
    even with all of those advantages. Some of them are: •         It has a certain
    similarity to black boxes. You can determine what happened, but there is no way
    to determine why a certain result was produced •          The memory cannot be
    described or localized in the network itself •          They can only be used
    by computers with compatible hardware as they have unique computer needs •        
    Producing proper calculations can be very time consuming, however, as the training
    techniques are extensive and can take a while to execute.  •          The only
    method of solving problems is algorithms and you have to give them the correct
    one for the problem   •          The accuracy of the output values can vary •        
    A large number of examples is needed for a good learning process that can produce
    solutions to be made Neural networks are completely capable of independent decision
    making based on the number of inputs and variables. Because of this, they can
    create an unlimited number of recurring iterations to solve problems without human
    interference. When we see these networks in action, you’ll find a numeric vector
    that represents the various types of input data. These vectors could be anything
    from pixels, audio and/or video signals, or just plain words. These vectors can
    be adjusted via a series of functions producing an output result. At first glance,
    you might think that there is not that much to say about neural networks. However,
    when you look into it a bit more, you start to see the intricacies behind it.
    The same system can be used to handle the most basic of problems and the most
    complex alike. The only thing that changes is the number of weights that are placed
    on each value. We have already pointed out that these algorithms are an integral
    part of machine learning. They are used to sift through all sorts of data, pull
    out any information that could be useful to reach the targeted goal and bring
    you to the closest possible solution to a problem. All of this is done without
    having to write a specific code for the computer to actually solve the problem
    because of something called a ‘neural network’.  But what exactly is a neural
    network? Let’s go back and take another look at the human brain so we can get
    a better understanding of this new technology.   The brain holds billions of tiny
    little neurons that are poised to receive data and process it. These neurons are
    all interconnected through a complex web with each neuron holding a certain amount
    of information. These neurons send signals to each other as they process the data
    they receive.  In a computer, a neural network is created artificially. The architecture
    has been around for decades but the technology has advanced enough just recently
    for it to be implemented into any usable and functional form.  In an artificial
    neural network (ANN) these neurons are mimicked by thousands (sometimes millions)
    of tiny little processing units, all linked together. Each one of these artificial
    neurons has a purpose, which is determined by the configuration or the topology
    of the network.   There are several layers of these neurons and each layer has
    its own specific purpose. There is the input layer, where all the data flows into
    the network, the output layer where the solution is produced, and there could
    be numerous hidden layers where much of the processing work is done. Training
    and Selection of a Predictive Model As we will see in the next sections, various
    machine learning algorithms have been developed with the aim of solving different
    problems. An important element that can be drawn from David Wolpert''s well-known
    No Free Lunch Theorems is that there is no "free" learning. For example, each
    classification algorithm has its inherent flaws, and no classification model can
    claim absolute superiority if we have no information on the task at hand. In practice,
    it is therefore essential to compare at least a certain group of different algorithms,
    so as to train them and then select the model that offers the best performance.
    But before we can compare different models, we need to decide which metrics to
    use to measure performance. A commonly used metric is the accuracy of the classification,
    which is defined as the proportion between the instances correctly classified.
    A legitimate question arises: how can we understand which model performs better
    on the final test dataset and on the real data if we do not use this test dataset
    for choosing the model, but we keep it for the final evaluation of the model itself?
    In order to solve the problem inherent in this question, various cross-validation
    techniques can be used, in which the training dataset is further subdivided into
    subsets of validation training, in order to estimate the performance of generalization
    of the model. Finally, we cannot even expect that the standard parameters of the
    various learning algorithms provided by software libraries are optimal for our
    specific problem. Therefore, we will frequently use hyper-parameter optimization
    techniques, which will help us optimize the performance of the model. Intuitively,
    we can consider these hyper-parameters as parameters that are not learned from
    the data but represent the "knobs" of the model, on which we can intervene to
    improve their performance, as we will see with greater clarity in the next sections
    when we will put them to work on examples effectively. Evaluation of Models and
    Forecasting Of Data Instances Never Seen Before It is important to note that the
    parameters of the procedures we have just discussed (reduction of the scale and
    size of the features) can only be obtained from the training dataset and that
    these same parameters are then reapplied to transform the test dataset and also
    each new sample some data. Otherwise, the performance measured on the test data
    could be overly optimistic. '
  fmt: "\n# Chapter 2: The process of neural networks ![](rsrc7W.jpg)\n\nWe can talk\
    \ about neural network architecture now that you know more about deep learning\
    \ and its applications. Neural networks are very important for machines. A properly\
    \ programmed neural network will help the machine think like a person and process\
    \ information in that way. These networks are made out of layers. These layers\
    \ can process many kinds of information. Each layer is made out of neurons that\
    \ all work together to solve problems. Since neural networks help machines think\
    \ like humans, it makes sense that machines with neural networks are capable of\
    \ learning. Pattern recognition and data classification are some of the things\
    \ that these machines are used for. When neurons change and adjust, the network\
    \ can learn, similar to human beings. \n\nA person who does not dabble with AI,\
    \ somebody that you may talk to on the street, could be shocked to learn that\
    \ they have encountered a lot of artificial intelligence and other kinds of machine\
    \ learning. Millions of dollars are spent by some of the most popular companies\
    \ in order to research that will improve their business. Some of these companies\
    \ are Apple, Google, Facebook, Amazon, and IBM. Our day to day lives might be\
    \ impacted by this research already, even though you might not know it. With internet\
    \ searches, for example, you will be shown options on websites and searches that\
    \ match the keywords you typed in. Machine learning is important for this as it\
    \ is the main thing that allows your browser to filter through the millions of\
    \ possible recommendations. The same principle is used in Netflix recommendations\
    \ or spam filters that help filter through your emails. In the medical industry,\
    \ this is used for the classification of medication and has an important role\
    \ in the Human Genome Project where it goes through the countless combinations\
    \ of patterns in DNA that can tell you something about your family history, risk\
    \ factors, or health prospects. \n\nThese systems are applicable in most industries\
    \ as they are highly adaptable and sophisticated. This is made possible through\
    \ algorithms that guide the computer through many learning processes. With the\
    \ correct algorithms, you can teach a system to detect abnormal behaviors that\
    \ can happen within a pattern. This helps the system learn how to predict possible\
    \ outcomes that may occur in a wide variety of situations.\n\nAn artificial neural\
    \ network is something that contains algorithms of different kinds, data receptors\
    \ and a plethora of other elements. Ever since they were introduced during the\
    \ 1950s, artificial neural networks have been a remedy when it comes to the future\
    \ of science. They are patterned similarly to the human brain. They allow the\
    \ machine to learn during the training phase of programming. This knowledge is\
    \ then used as a foundation for solutions that would be applied to problems in\
    \ the future.\n\n## Historical Background\n\nNeural networks have been a thing\
    \ since before computers. The problem was that people were not proficient enough\
    \ for utilizing them. This is why the recent advances made in the field of neural\
    \ networks are so important. Any developments in computer technologies help the\
    \ research of neural networks. A craze started and people started being enthusiastic\
    \ over the field. However, most attempts were fruitless, as no advancements that\
    \ could help to improve the efficiency and accuracy of our machines. The enthusiasm\
    \ started to decrease. However, some of the researchers remained steadfast and\
    \ continued their studies. They worked hard in order to develop what we have now,\
    \ a technology model that is accepted by most people in the industry. \n\nThe\
    \ first artificial neural network was made by Warren McColloch and Walter Pitts\
    \ in the year 1943. This was called the `McCulloch-Pitts` neurons. The network\
    \ was not used to perform or automate complex tasks as the duo did not have the\
    \ technology needed for the further development of the network.\n\n## What Are\
    \ They and How Do They Work?\n\nTerms like artificial intelligence, machine learning,\
    \ and deep learning are all terms that refer to processes that are happening in\
    \ the neural network. People might be skeptical when it comes to the way machines\
    \ learn. However, we assure you that it really means they are trained like human\
    \ minds are. A computational distributed model is made up of simple processors\
    \ with a plethora of tiny connections is a good way to think about these networks.\
    \ The human brain is made from many, many neurons that are interconnected via\
    \ synapses which allow them to make analysis in cerebral cortex. Learning is achieved\
    \ with the change in the connections in our brains allow us to acquire new skills\
    \ and learn new skills so that we can solve problems. A good way to think of these\
    \ networks is to think of many parallel processors integrated with hundreds (or\
    \ thousands) of tiny connections that make up a computational model. In the human\
    \ brain, there are millions of neurons all interconnected by synapses that allow\
    \ them to make computations and analysis in cerebral cortex. As these connections\
    \ are made, learning is achieved allowing the person to acquire new skills so\
    \ they can accomplish problems. Hundreds of homogenous units that are interconnected\
    \ through links are elements of a neural network. The unique configurations of\
    \ connections and simplicity are what make this design beautiful. Data goes into\
    \ the network through an input layer and goes to the output layer. In the meantime,\
    \ the data is processed through the many layers in between until the problem is\
    \ computed and a final solution is carried out. Only a few units that transfer\
    \ information were the gist of the simple neural networks in their earlier days.\
    \ Today, however, a network could be made up of millions of different units that\
    \ are intertwined and work together in order to emulate the process of learning.\
    \ More modern networks are able to solve very difficult and complex problems in\
    \ many ways.\n\n## Why use Neural Networks?\n\nLarge volumes of data are dedicated\
    \ to making improvements to the industry itself. There are many variables in these\
    \ datasets that can make it difficult for humans to find patterns that appear.\
    \ Via neural networks, we can recognize these patterns more easily. Without them,\
    \ computers could find it a difficult task to identify trends in the dataset.\
    \ By taking the time to train a neural network, an engineer can feed the network\
    \ huge datasets in order to turn it into an expert in selected area. With this\
    \ trained network, the engineer can predict the output for any possible input.\
    \ This also allows the engineer to be able to answer some questions about the\
    \ future. Neural networks have many advantages and here are some of them:\n\n\
    - A neural network can adapt to new tasks and learn how to do new things because\
    \ of it using supervised machine learning.\n- The network can be used to report\
    \ back any information that was fed to it during the learning stage.\n- Machines\
    \ with neural network architecture work far faster and provide more accurate results.\
    \ This is because of the ability to compute data in parallel.\n- Neural networks\
    \ can be fixed easily. While performance will be affected if the network is damaged,\
    \ the network will still remember some the properties.\n\n## The McCulloch-Pitts\
    \ Neuron - What is It?\n\nThere are a lot of similarities between the human brain\
    \ and artificial neural networks. This makes sense due to the fact that these\
    \ networks were made to emulate the human brain. This much is easy to understand.\
    \ The following are some of the similarities between them:\n\n- Millions of artificial\
    \ neurons make them up and each one of them can compute problems and solve them.\n\
    - Each neuron has many different connections.\n- They are both non-linear and\
    \ parallel.\n- They can learn through the change in the connection between units.\n\
    - They adapt to new knowledge when they find an error instead of penalizing themselves.\n\
    - Based on the data that they never came across before, they can produce outputs.\n\
    \nThese all describe how the neural network, as a whole, works. While the two\
    \ are very similar on the surface, we should look into how the smallest of the\
    \ units work. The McCulloch-Pitts neuron is the smallest part of the network.\
    \ In the brain, the basic unit of processing is a neuron. In the artificial neural\
    \ network, this unit is the main part of processing any type of information and\
    \ calculations of any kind. It is made from the following three elements:\n\n\
    - The weight and synaptic efficacy of connections, as well as the connections\
    \ themselves.\n- An agent that summarizes and processes input signals and outputs\
    \ linear combinations.\n- A system that limits the neuron’s output\n\nThe 1940s\
    \ was the first time that the `MCP` neuron was introduced. This neuron got its\
    \ name from the logician `Walter Pitts` and the neuroscientist `Warren S. McCulloch`.\
    \ They tried to understand what happens inside of the human brain when we try\
    \ to produce and understand complex patterns and replicate them through the connections\
    \ between the many basic cells. The design of old systems was very simple. The\
    \ input was quantified from zero to one and the output was limited to the same\
    \ domain. Every input was either inhibitory or excitatory. This simplicity made\
    \ the design limited the learning capabilities of the machine. While sometimes\
    \ simplicity can be great, it also has its downfalls. It costs the computational\
    \ ability to comprehend complex topics. The `MCP` neuron was supposed to sum up\
    \ all of the inputs, adding `1` if an input is positive and taking `1` away if\
    \ the input is negative.\n\n## Neural Networks versus Conventional Computers\n\
    \nNeural networks and computers do not apply the same kind of solution to every\
    \ problem. The latter usually use algorithms in order to find solutions. What\
    \ this tells us is that humans and computers can solve similar problems. Where\
    \ computers shine is solving problems that people can’t. As we have said numerous\
    \ times, the human brain and neural networks work in a similar manner: through\
    \ a network of interconnected neurons. These networks usually work in parallel\
    \ for the best efficiency. An engineer can teach a network to complete a task\
    \ by giving it an example of how it should. This means that selecting the data\
    \ you feed to the system is very important. If you are not careful when selecting\
    \ the data you might make it harder for the system to learn. The process are unpredictable\
    \ as, due to the data they are fed, it might learn to foresee. Using a high-level\
    \ programming language, it takes only a few steps for the engineer to provide\
    \ the instructions to the computer, later, takes these instructions and translates\
    \ it into a language that the computer can understand. This process allows the\
    \ engineer to predict how the computer will go about solving problems. If the\
    \ computer reports a problem while processing, the engineer can conclude that\
    \ there should be an error in the software or hardware. Conventional computers\
    \ work in tandem with neural networks. Arithmetic calculations are a kind of task\
    \ that is best solved by.\n\n## Types of Neural Networks\n\n### Fully connected\
    \ network\n\nA network layer is the most basic type of neural architecture. It\
    \ is composed out of layers of neurons which are interconnected. The input layer\
    \ is the first layer. It is connected to a hidden layer of neurons which then\
    \ proceed to the output layer. The input layer is where the engineer gives data\
    \ to the system. What kind of data outputted depends on the weights and connections\
    \ between the secret layer. This kind of architecture is simple, but still interesting\
    \ because the hidden layers can represent data in many ways. The weights mentioned\
    \ before are nodes that connect layers. They also determine when these layers\
    \ need to be activated. An engineer can modify these weights and change the way\
    \ the layers interact. He can do this to ensure the way the hidden layer shows\
    \ data is conducted the correct way. It is fairly easy to tell a multilayer and\
    \ single-layer architecture apart. When it comes to single-layer architecture,\
    \ neurons are connected at the nodes. This means that the processing power of\
    \ the network is maximized due to all of the layer being interconnected. When\
    \ it comes to multilayer architecture there are more layers to the system. Here\
    \ neurons are not interconnected, but the layers are.\n\n### Feed-forward Networks\n\
    \nThere are several names for this kind of network. Bottom-up or top-down are\
    \ both alternative names for feed-forward networks. This means that signals and\
    \ data will flow in only one direction, from the input point to the output point.\
    \ This network does not have a feedback loop. This means that output gotten in\
    \ one instance will not affect output that comes in another layer. This is one\
    \ of the simplest networks to make as input is directly associated with output.\
    \ This network is often used in recognizing patterns.\n\n### Convolutional neural\
    \ networks\n\nFully connected networks are what convolutional neural networks\
    \ bears the most similarity to. Many layers made from many neurons are what makes\
    \ up this system. Each neuron is assigned with a weight. This is due to the training\
    \ data that was used during the teaching phase. When input is given to a neuron\
    \ they will make a dot product, which is followed by a non-linearity. You might\
    \ wonder what the difference between a fully connected network and a convolutional\
    \ network is. A `CNN` views each input in the original dataset to be an image\
    \ which an engineer can encode properties of the system into. This reduces the\
    \ number of instances in the original dataset and it makes it easier for the network\
    \ to use the forward function. These types of neural networks are used by most\
    \ deep learning programs.\n\n### Feedback networks\n\nFeedback networks are specific\
    \ due to the movement of the signals. They flow in both directions and induce\
    \ a loop into the network. These networks are extremely difficult to make, but\
    \ are very powerful. The network will function in a state of absolute equilibrium\
    \ until you create a change. This state of constant change will continue until\
    \ the system equalizes again. If an engineer feeds a new dataset to the system,\
    \ it will try to find a new point of equilibrium. This is the reason why feedback\
    \ networks are recurrent and interactive.\n\n### Recurrent neural networks\n\n\
    Recurrent neural networks are special because the information always loops. The\
    \ network will consider the input and asses what it has learned, once it decides.\
    \ `RNN` usually has short-term memory. In combination with `Long Short-term memory`,\
    \ it gains long-term memory. It is difficult to explain `RNN` without using an\
    \ example. Let’s say that the network you are using is a regular feed-forward\
    \ neural network. Let’s say that you input the word “brain”. The system will separate\
    \ the word into characters and go over them one by one, always forgetting the\
    \ previous characters. This means that this model cannot be used to predict which\
    \ character is next unless it has already gone. Due to its internal memory, `RNN`\
    \ remembers previous characters and predicts the next ones. While producing outputs,\
    \ it copies them and puts them back into the network itself. Following:\n\n- The\
    \ Present Data\n- The Recent Data\n\n### Generative adversarial network\n\nA `GAN`,\
    \ also known as generative adversarial network, is made up of two networks that\
    \ have been pitted against each other. Due to this, we call it an adversarial\
    \ network. `GAN` can be used by most engineers in system because it can learn\
    \ to mimic any distribution or dataset. It can be used to build something that\
    \ is unique to in many domains. It can simultaneously process pictures, speech,\
    \ etc. You are bound to be impressed by the output of these networks. A generator\
    \ and discriminator are parts of this network. The discriminator evaluates instances\
    \ made by the generator, while the generator creates the data instances themselves.\n\
    \n## Training the Neural network\n\nTraining your neural network is one of the\
    \ most important parts of making neural network. There are a few methods to do\
    \ this, however, only one method has the positive results. `backpropagation`,\
    \ also known as error propagation algorithm, symmetrically adjusts the weights\
    \ on connections and neurons. This means that if the system makes a mistake it\
    \ will learn from it and come closer to the correct solution every time. This\
    \ kind of training has two stages: stage 1, also known as forward propagation,\
    \ and stage 2, also known as back propagation. In stage 1, a calculation of all\
    \ the activated neurons in all the layers is performed.\n\n- Forward Propagation:\
    \ the first input is the initial data that is then transferred to the hidden layers\
    \ where it is processed until an output is produced. The activation functions,\
    \ the depth of the data, and the width of the data all depend on the basic architecture\
    \ of the network. Depth tells us how many hidden layers exist within the system.\
    \ The width tells us the number of neurons in each layer and the activation functions\
    \ instruct the system on exactly what do.\n- Backward Propagation: allows for\
    \ the weight of the connections to be adjusted via a supervised learning algorithm.\
    \ This is done in order to reduce the difference between the solution we got and\
    \ the expected solution.\n\nNeural networks are a very interesting field of study\
    \ and keeps getting more and intricate, now using machine learning. It has a huge\
    \ amount of potential to aid the creation of future developments in computer science.\n\
    \n- They are adept at solving problems whose solutions require a certain degree\
    \ of error.\n- They can use experience from solving previous problems and use\
    \ it to solve problems it encounters for the first time.\n- Their implementation\
    \ is a piece of cake as the definitions for duplication, neurons, and creating\
    \ connections are easy to understand.\n- It completes operations fairly quickly\
    \ as every neuron operates on only the value it received as input.\n- Stable outputs\
    \ directly relate to the input values.\n- Before producing a result, they can\
    \ take all of the inputs into accounts Neural networks still have a few drawbacks,\
    \ even with all of those advantages. Some of them are:\n\n- It has a certain similarity\
    \ to black boxes. You can determine what happened, but there is no way to determine\
    \ why a certain result was produced\n- The memory cannot be described or localized\
    \ in the network itself.\n- They can only be used by computers with compatible\
    \ hardware as they have unique computer needs.\n- Producing proper calculations\
    \ can be very time consuming, however, as the training techniques are extensive\
    \ and can take a while to execute.\n"
