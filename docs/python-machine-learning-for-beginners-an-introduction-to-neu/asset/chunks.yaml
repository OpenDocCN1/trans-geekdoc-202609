    # Python 基础


    ## 保留字

    任何编程语言中的保留字都是编译器或解释器理解的特殊命令，这些保留字不能被用作常量、变量或该编程语言中的任何其他标识符名称。Python 具有以下保留字，且所有此类关键字仅包含小写字母。


    ## 表示多行语句的关键字

    Python 语言以换行符结束。如果需要将语句延续到下一行，则在 Python 语言中使用行续符字符 `\`。此行续符字符 `\` 表示语句行应该如下方截图所示继续。


    在下面的示例中，我们有三个变量 `result1`、`result2` 和 `result3`，最终输出被复制到名为 `result` 的变量中。这里没有单行写等语句（`result=result1+result2+result3`），而是使用了行续符字符
    `\`，这样就可以分成三行编写，但在 Python 语言中表示单个语句。此外，定义在括号 `()`、`{}` 和 `[]` 内的 Python 语句在写成多行语句时不需要行续符字符
    `\`。这类 Python 语句在不使用行续符字符 `\` 的情况下仍然被解释为单个语句。


    ## Python 中的引号

    Python 语言允许使用单引号（`''`）、双引号（`"`）和三引号（`''''''` 或 `"""`）来表示字符串字面量，确保相同类型的引号开始并结束该字符串。在下面的示例中，单引号、双引号和三引号被用于表示单词、句子或段落中的字符串。当我们打印这个变量时，无论
    Python 语言中表示字符串字面量使用的是单引号、双引号还是三引号，都会打印字符串。


    ## Python 中的注释

    Python 语言中的任何注释都由哈号 `#` 表示，前提是它没有用于代码之间的字符串字面量（单、双或三引号）。哈号 `#` 之后到物理行末尾的所有字符都是注释的一部分，Python
    解释器在解释整个程序时会忽略该语句。在下面的示例中，解释器将打印 `print` 命令内部的字符串，并忽略符号之前之后作为注释提到的部分。


    ## 使用空行

    Python 语言中的空行可以是包含空格的行，也可以是包含注释的行（即以哈号 `#` 开头的语句）。Python 解释器在解释空行时会忽略它，且不会生成机器可读的代码。Python
    中的多行语句在进入一个空物理行后终止。


    ## 等待用户输入

    使用 Python 编程语言，我们可以设置一个可以接受用户输入的提示符。程序的下一行将显示一个提示符，显示“按任意键退出”，并等待用户输入或操作。


    ## 单行上的多个语句

    Python 语言允许在语句之间用分号（`;`）分隔的情况下，在单行上编写多个语句，如下面的示例所示。


    ## 命令行参数

    在安装了 Python 解释器的 UNIX 操作系统上，我们可以寻求帮助查看所有函数列表。这些是基础函数。下面的截图演示了 UNIX 系统上的 `help`
    命令以及使用的所有函数或短代码。


    # 机器学习与机器人技术

    首先，我们需要定义一个机器人。它们是机器，通常可以通过计算机进行编程，能够在没有干预的情况下执行一系列复杂的动作。机器人可以嵌入其控制系统，也可以由外部设备控制。在流行文学和电影中，许多机器人被设计得像人类，但事实上，它们通常是为了执行特定任务而设计的，这种需求决定了它们的外观。机器人伴我们我们几乎和计算机一样久。乔治·德沃尔在
    1954 年发明了第一种数字操作和可编程的机器人，称为 `Unimate`。1961 年，通用汽车购买了它用于抬运热金属压铸件。就像计算机一样，机器人改变了我们的社会。它们的力量、灵活性以及持续完美执行重复任务的能力证明了巨大的收益。尽管它们对制造业造成了某些冲击，导致许多人失业，但它们在社会中的崛起提供的就业机会远大于夺取的。


    目前使用的机器人可以分为几类：


    ### 工业机器人/服务机器人

    这些机器人可能很熟悉。你可能在电视或自动化工厂的视频中见过它们。它们通常由一个一个或多个关节的“手臂”组成，末端带有夹爪或操作设备。它们最早出现在汽车工厂。它们被固定在一个位置，无法移动。工业机器人见于制造和工业场所。服务机器人的设计与工业机器人基本相同，但出现在制造领域之外。


    ### 教育机器人

    这些机器人被用作教学工具或用于教育目的。早在 20 世纪 80 代，教室就带着“乌龟”引入了机器人，学生可以在那里使用 `Lego` 编程语言对它们进行训练。还有可以购买的机器人套装，如
    `Lego Mindstorm`。


    ### 模块机器人

    模块机器人由几个协同工作的独立单元组成。它们可以是相同的，也可以在设计上有一个或多个变化。模块机器人能够组合形成允许它们执行任务的形状。模块机器人系统的编程当然比单个机器人复杂，但大学和企业环境的持续研究表明，这种设计方法在许多应用中优于单一大型机器人。与群体智能（见下文）相结合，模块机器人证明非常擅长解决问题。


    ### 协作机器人

    协作机器人设计用于与人类工作。它们大部分是工业机器人，包含了安全功能，以确保它们在执行分配的任务时不会伤害任何人。这种协作机器人的极佳例子是 `Baxter`。Baxter
    于 2012 年引入，被设计为编程完成简单任务，但在与人类接触时会停止移动。当然，上述所有示例都不需要人工智能。当机器人结合机器学习时，研究人员使用术语“机器人学习”。这一领域在至少四个重要领域具有深远影响：


    - **视觉**：机器学习允许机器人视觉上感知环境并理解它们所看到的内容。不需要预先编程，机器人就可以理解并分类新物品。

    - **抓取**：结合视觉，机器学习允许机器人处理它们从未见过的环境物品。过去，在工厂里，每当机器人预计与不同形状的物体交互时，都需要编程如何处理。有了机器学习，机器人具备自动导航新形状和大小的能力。

    - **运动控制**：借助机器学习，机器人能够在环境中移动并避开障碍以继续执行它们分配的任务。

    - **数据**：机器人现在能够理解物理和逻辑数据模式，并根据这些模式做出反应。


    ## 工业机器人的示例

    将机器学习应用于机器人的一个例子是沿着传送带接收箱的工业机器人。因为是固定的，这些箱往往会有偏差。传统上，对这些形状容差较小的机器人将无法正确抓取。通过机器学习算法，机器人现在能够实时适应不同的形状并成功抓取箱。另一个工业示例是拥有
    90000 个不同零件的工厂。教机器人如何处理这么多物品是不可能的。通过机器学习，机器人可以接收它将要处理的新零件图像，并自己确定处理它们的方法。2019
    年，预计全球有 600 万机器人正在服务。这比 2015 年有所增加。随着越来越多的机器人结合机器学习算法，这个数字肯定会爆炸。


    ## 开始学习 Python

    你有很多理由可能想要学习 Python，或者你只是在广阔的编程世界中寻找一个起点。无论你的具体目的和目标是什么，我向你保证 Python 语言将为你提供执行你想执行的操作所需的所有工具。如果你正在浏览这本书的介绍页面，我可以告诉你，你可能应该看到在基础概念上要简单得多。当你进入变量、函数等更深层次的编程概念时，Python
    实际上会特意让它们变得非常容易处理。此外，正如我已经说的，Python 是一种具有无限使用和增长机会的语言。Python 的这种情况很少。


    ### 安装

    你首先需要的是 Python 本身。你可以通过访问 Python 网站 `http://python.org` 获取它。你可以为你相应的操作系统下载并安装。请注意，如果你在
    Linux 或 macOS 上工作，这并不完全相关。这些操作系统的大多数版本通常自带一个 Python 版本。但你可能需要下载。如果是这样，你需要搜索与你特定操作系统相关的说明，因为说明随你正在使用的操作系统而异。如果你不知道
    Python 是否已预安装，可以通过进入 `Terminal`（macOS 或 Linux）或 `Powershell`（Windows）并运行命令 `python`
    来确定。如果你的 `Terminal` 或 `Powershell` 实例显示类似“无法识别命令”的内容，那么你需要安装 Python。如果识别命令并显示
    `Python 3.x`，你需要下载。


    总之，在 Python 网站上，你需要确保获取的是 Python 2.7 版本而不是 3 版本。这是由于一个简单的原因：Python 2 和 3 在处理某些函数方面略有不同。虽然如此，但人们学习编程的原因之一是为了能够与计算机直接交流。学习
    Python 2 将为你提供更多做此的机会。这是因为存在时间更长。Python 2 的代码比 Python 3 多得多。如果你先学习使用 Python 2，你将处理更多的代码。现在，诚然，Python
    3 是最前沿的。但在学习编程时，前沿并不总是最好的。学习阅读和编写更多代码比其他情况要好。基本上，在开始阶段，你试图尽可能地涵盖更多范围，而 Python
    2 完美契合这一目标。一旦你对 Python 或通用的编程更有经验，Python 3 中需要学习或重新学习的内容，与尝试理解不相关的的 Python 2 代码示例相比将是不足道的。


    ### 编辑器

    一旦你安装了 Python `2.7.13`（或可用的最新 Python 2 版本），你需要一个文本编辑器。具体使用哪种文本编辑器并不重要，有几个很好的选择。我特别推荐使用的是名为
    `Atom`，你可以在 `http://atom.io` 获取它。我推荐这一个几个原因：首先，它是免费的。还有比免费更好的呢？其次，它非常易用且功能丰富。第三，它具有极强的扩展性：可以通过各种插件支持它。最后但不是最重要的，你可以在每个主要的操作系统上都获取它。


    ### 第一个程序

    一旦你安装了 Atom 和 Python，让我们开始你的第一个程序。我建议你首先在电脑上创建一个易于访问的文件夹，比如桌面或 C 盘。命名为 Python
    之类的。不要在名称中添加空格，因为这会减慢处理过程。总之，在那之后，你需要打开 Atom。一旦打开，右键点击侧边栏“添加文件夹（Add Folder）”。然后导航到你的项目文件夹并选择它。双击侧边栏中的文件夹以进入活动状态，然后在侧边栏右键点击“新建文件（New
    File）”。然后，你将输入 `hello.py`。在文件中，你输入以下内容：


    ```python

    print("hello world!")

    ```


    然后保存。打开你的 `Terminal` 或 `Powershell` 来运行它。导航到你创建的文件所在并使用以下命令运行：


    ```bash

    python hello.py

    ```


    如果一切按照计划进行，你将得到如下输出：

    hello world!


    '
