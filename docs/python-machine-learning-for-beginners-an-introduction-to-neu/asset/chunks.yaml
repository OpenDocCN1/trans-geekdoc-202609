    # Chapter 4: The programmatic way ![](rsrcMC.jpg)


    There are many models of Machine Learning. These theoretical describe the heuristics
    used to accomplish the ideal, allowing the machine to learn on their own. Below
    is a list and description of some of the most popular.


    ## Decision Tree


    Just about everyone has used the decision tree technique. Either formally or informally,
    we decide on a single course of action from many possibilities based on previous
    experience. The possibilities look like branches and we take one of them and reject
    the others. The decision tree model gets its name from the shape created when
    its decision processes are drawn out graphically.


    A decision tree offers a great deal of flexibility in terms of what input values
    it can receive. As well, a tree’s outputs can take the form of a category, binary,
    or numerical. Another strength of decision trees is how the degree of influence
    of different input variables can be determined by the level of decision node in
    which they are considered.


    A weakness of decision trees is the fact that every decision boundary is a forced
    binary split. There is no nuance. Each decision is either yes or no, one or zero.
    As well, the decision criteria can consider only a single variable at a time.
    There cannot be a combination of more than one input variable. Decision trees
    cannot be updated incrementally. That is to say, once a tree has been trained
    on a training set, it must be thrown out and a new one created to tackle new training
    data.


    ## Ensemble Methods


    Ensemble Methods address many tree limitations. In essence, the ensemble method
    uses more than one tree to increase output accuracy. There are two main ensemble
    methods — bagging and boosting.


    The bagging ensemble method (known as Bootstrap Aggregation) is mean to reduce
    decision tree variance. The training data is broken up randomly into subsets and
    each subset is used to train a decision tree. The results from all trees are averaged,
    providing a more robust predictive accuracy than any single tree on its own.


    The boosting ensemble method resembles a multi-stage rocket. The main booster
    of a rocket supplies the vehicle with a large amount of inertia. When its fuel
    is spent, it detaches and the second stage combines its acceleration to the inertia
    already imparted to the rocket and so on. For decision trees, the first tree operates
    on the training data and produces its outputs. The next tree uses the earlier
    tree’s output as its input. When the input is in error the weighting it is given,
    makes it more likely the next tree will identify and at least partially mitigate
    this error. The end result of the run is a strong learner emerging from a series
    of weaker learners.


    ## Linear Regression


    The premise of linear regression methods rests on the assumption that the output
    (numeric value) may be expressed as a combination of the input variable set (also
    numeric). A simple example might look like this:


    ```

    x = a1y1, a2y2, a3y3…

    ```


    Where `x` is the output, `a1...an` are the weights accorded to each input, and
    `y1...yn` are the inputs.


    The strength of a linear regression model lies in the fact it can produce well
    in terms of scores and performance. It is also capable of incremental learning.
    A weakness of the linear regression model is the fact that it assumes linear input
    features, which might not be the case. Inputs must be tested mathematically for
    linearity.


    ## K-Means Clustering Algorithm


    K-Means clustering algorithms can be used to group results that talk about similar
    concepts. So, the algorithm will group all results that discuss jaguar as an animal
    into one cluster, discussions of Jaguar as a car into another cluster, and discussions
    of Jaguar as an operating system into a third. And so on.


    ## Neural Network


    We have covered neural networks in detail above. The strengths of neural networks
    are their ability to learn non-linear relationships between inputs and outputs.


    ## Bayesian Network


    Bayesian networks produce probabilistic relationships between outputs and inputs.
    This type of network requires all data to be binary. The strengths of the Bayesian
    network include high scalability and support for incremental learning. We discussed
    Bayesian models in more detail earlier in the book. In particular, this Machine
    Learning method is particularly good at classification tasks such as detecting
    if an email is or not spam.


    ## Python Naming Conventions


    Python programming language does not allow special characters such as `@`, `$`,
    `/`, and `%` within identifiers. Python is a case sensitive programming language.
    Therefore, identifiers such as `Python` and `python` are two different identifiers
    in Python programming language. Below are the naming conventions for identifiers
    in Python.


    - Class name in Python always begins with an uppercase letter and all other Python
    identifiers starts with a lowercase letter.

    - A Python identifier is private when such identifier begins with a single leading
    underscore.

    - A Python identifier is strongly private when such identifier begins with two
    leading underscores.

    - A Python identifier is a language-defined special name when such identifier
    ends with two trailing underscores.

    '
