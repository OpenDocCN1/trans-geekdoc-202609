    \ With Machine Learning algorithms, the robot is now able to adapt to different\
    \ shapes in real time and successfully grasp the boxes. Another industrial example\
    \ includes a factory with over 90000 different parts. It would not be possible\
    \ to teach a robot how to manipulate these many items. With Machine Learning the\
    \ robot is able to be fed images of new parts it will be dealing with and it can\
    \ determine its own method to manipulate them. In 2019, there will be an estimated\
    \ 6 million robots in service on the planet. That’s up from 2015. As more and\
    \ more robots are combined with Machine Learning algorithms, this number is sure\
    \ to explode.\n\n## Getting Started with Python\nThere are a lot of reasons you\
    \ may want to learn Python Or you may just be looking for a place to start with\
    \ the wide world of programming. Regardless of your specific purpose and goal,\
    \ I can guarantee you that the Python language will provide you with all of the\
    \ tools that you need to do exactly what you want to do. If you’re browsing the\
    \ introductory pages of this book, I can tell you you probably should see how\
    \ much easier it is with rudimentary concepts. When you get into heavier programming\
    \ concepts like variables, functions, and other things, Python actually goes out\
    \ of the way to make them really simple to handle. On top of this, Python, as\
    \ I’ve already said, is a language which has endless opportunity for usage and\
    \ growth. There are very few bad situations for Python.\n\n### Installation\n\
    The first thing that you’re going to need is Python itself. You can get it by\
    \ going to the Python website at `http://python.org`. You’ll be able to download\
    \ and install it for your respective operating system. Note that this isn’t entirely\
    \ relevant if you’re working on Linux or macOS. Most versions of these operating\
    \ systems will generally have a version of Python on it. You may, though, need\
    \ to download. If so, you’re going to need to search for instructions which are\
    \ relevant to your specific operating system because the instructions can vary\
    \ upon which operating system you’re using. If you don’t know whether Python is\
    \ pre-installed or not, you can figure it out by going to either `Terminal` (in\
    \ macOS or Linux) or `Powershell` (in Windows) and running the command `python`.\
    \ If your instance of `Terminal` or `Powershell` says something along the lines\
    \ of “command not recognized”, then you need to install Python. If recognizes\
    \ the command and says `Python 3.x`, you need to download.\n\nAnyway, on the Python\
    \ site, you need to be certain that you’re getting Python version 2.7 and not\
    \ version 3. This is for one simple reason: Python 2 and 3 are a bit different\
    \ in the way they handle certain functions. Not glaringly so, but one of the reasons\
    \ someone learns to program is so they can speak directly to the computer. Learning\
    \ Python 2 will give you many more opportunities to do this. This is for the simple\
    \ reason that it’s been around longer. There’s much more code written for Python\
    \ 2 than Python 3. You’ll be able to work with a lot more code if you learn to\
    \ work with Python 2 first. Now, granted, Python 3 is of course bleeding edge.\
    \ But when you’re learning to program, bleeding edge is not always best. It’s\
    \ preferable that you learn how to read and write more code than you would otherwise.\
    \ Basically, you’re trying to cover as much ground with as little as possible\
    \ when you’re starting out, and Python 2 accommodates you for that goal perfectly.\
    \ The few things you’ll have to learn or relearn for Python 3 once you’re more\
    \ experienced with Python or programming in general will be non-factors compared\
    \ to trying to understand code samples from Python 2 which aren’t relevant to\
    \ the code you’re trying to write.\n\n### Editor\nOnce you have Python `2.7.13`\
    \ (or the latest version of Python 2 available) installed, you’re going to need\
    \ a text editor. It doesn’t matter exactly what text editor you use, there are\
    \ several good candidates. The one I specifically recommend to use is called `Atom`,\
    \ and you can get it at `http://atom.io`. There are a few reasons that I recommend\
    \ this one. Firstly, it’s free. What’s better than high quality free software?\
    \ Secondly, it’s super simple to use and jam packed with features right of the\
    \ box, yet without being a sort of bloated and ugly software. Thirdly, it’s incredibly\
    \ extensible: there’s nigh endless support for it through various different extensions\
    \ and things of the sort online. There’s so much you can do with Atom. The endless\
    \ possibilities of it and Python complement each other perfectly. And last but\
    \ not least, you can get it for every major operating system.\n\n### First Program\n\
    Once you have Atom and Python installed, let’s get right down to business on your\
    \ first program. I’d recommend firstly that you create a new folder on your computer\
    \ in an easily accessible place like the desktop or high up on your C drive. Name\
    \ it something along the lines of Python. I don’t recommend adding spaces in the\
    \ name because it will slow down the process of navigating to it by just a little\
    \ bit. Anyway, after you do that, you’re going to open Atom. Once it’s open, you’re\
    \ going to right click on the sidebar and click “Add Project Folder”. Then you\
    \ navigate to the project folder on your computer and select it. Then, you double\
    \ click the folder in the sidebar in order to make it the active folder, and you\
    \ right click on the sidebar and select “New File”. Then after that, you’re going\
    \ to type `hello.py`. In the file, you’re going to type the following:\n\n```python\n\
    print(\"hello world!\")\n```\n\nThen go ahead and save. Open up your `Terminal`\
    \ or `Powershell` in order to run this. Navigate to the file you just made and\
    \ run it with the following command:\n\n```bash\npython hello.py\n```\n\nIf everything\
    \ goes according to plan, then you should get an output just like this:\nhello\
    \ world!\n"
