    \ section of the computer’s memory. In other words, it’s like instructing the\
    \ control unit to check the main memory and initialize the program that needs\
    \ to be executed. For example, the Python code below creates a function object\
    \ and assigns it the name `main`:\n\nWhat are the different elements of Python?\
    \ Well, all Python programs have the following:\n- **Program statements**: The\
    \ program statements are sentences or instructions that tell the control unit\
    \ to perform a given operation. Unlike most programming languages, the Python\
    \ statements don’t need a semicolon at the end.\n- **Whitespace**: The white spaces\
    \ are a collective name given to tabs, the spaces, and newlines/carriage returns.\
    \ The Python language is strict on where the white space should be placed in the\
    \ code.\n- **Escape sequences**: The Escape sequences are special characters that\
    \ are used for output. For instance: the sequence `\\n` in the program tells Python\
    \ to output on a new line.\n- **Documenting the program**: Any statement in the\
    \ program (except the first) that starts with `#` is treated as a command line\
    \ and will be ignored during execution. This will allow you to comment on sections\
    \ of the code for documentation.\n- **Keywords**: The keywords are instructions\
    \ that the interpreter recognizes and understands. For instance, the word `print`\
    \ in the earlier program is a keyword. In Python, there are two main types of\
    \ keywords: the functions and the control. Functions are simple verbs such as\
    \ `print` that tell the interpreter what to do while the control control the flow\
    \ of execution.\n- **Modules**: Python program is shipped with a large list of\
    \ modules that increase its functionality. The modules will help you organize\
    \ your code in a manner that’s easy to debug and control the code.\n\n## Python\
    \ variables\n\nThere’s so much that goes on in the main memory of the computer\
    \ whenever you run a program. Understanding the concept of variables and data\
    \ types will help you write efficient programs. A program is simply a sequence\
    \ of instructions (statements) that directs your computer to perform a particular\
    \ task. For instance, the previous program printed the phrase “Hello World! This\
    \ is my first program” on the screen when it was executed. But before you could\
    \ see the output on the screen some data had to be kept in computer’s memory.\
    \ The use of data applies to all programming languages—Python included—therefore,\
    \ understanding the mechanisms of data management in the computer’s memory is\
    \ the first step towards developing robust, efficient and powerful applications.\n\
    \nA variable can be conceived as a temporary storage location in the computer’s\
    \ main memory and specifically the Random Access Memory. This temporary storage\
    \ location is what will hold the data that you like to use in the program. In\
    \ other words, the variable location of memory that holds data whenever your program\
    \ is executing. So, whenever you define a variable, you’ll actually be reserving\
    \ a temporary storage location in the computer’s memory. All the variables that\
    \ you define must have names and an equivalent data type—a sort of classification\
    \ of the variable that specifies the type of value the variable should hold. The\
    \ data types help to specify what sort of mathematical, relational or even logical\
    \ operations that you can apply to the variable without causing an error. Ideally,\
    \ when you assign variables to data types, you can begin to store numbers, characters,\
    \ and even constants in the computer’s main memory.\n\nSince Python language is\
    \ an oriented programming language, it is not “statically typed.” This means that\
    \ the interpreter regards every variable as an object. Therefore, you have to\
    \ declare the variables before using them in your program. So, how can you declare\
    \ variables in Python? Names or identifiers usually declare Python variables.\
    \ Just like any other programming languages that you have so far learned, the\
    \ conventions for naming the variables must be adhered to. Below are some naming\
    \ conventions you should follow when declaring variables:\n- All variable names\
    \ should always begin with a letter (A to Z) or an underscore. For instance, `age`\
    \ is a valid variable name while `_age` isn’t a valid name.\n- Any variable name\
    \ you declare cannot start with a number. For instance, `9age` is not a valid\
    \ name.\n- Special symbols shouldn’t be used when declaring variable names. For\
    \ instance, `@name` isn’t allowed as a variable name.\n- The maximum number of\
    \ characters to use for your variable name shouldn’t exceed 255.\n\nTo reserve\
    \ a temporary memory location in the name of a variable, don’t have to use the\
    \ explicit declaration like other programming languages. If you’ve had experience\
    \ in other programming languages such as `Pascal`, I am sure that declaring a\
    \ variable explicitly before assigning any value is a must. In Python, the declaration\
    \ of variables usually occurs the moment you assign a value to it. For instance,\
    \ the statement `age=10` reserves temporary storage location in space called `age`\
    \ and assigns 10 to it. It is also possible to assign a single value to several\
    \ variables. For instance, the statement below reserves temporary spaces for 2\
    \ variables namely: `age, count=30`.\n\nPython language has different categories\
    \ of data types that are used to define the storage methods and mathematical operations.\
    \ Below are examples data types in Python:\n- Numbers\n- String\n- List\n- Tuple\n\
    - Dictionary\n\n### a) Numbers\n\nThe data types stores numeric values. The number\
    \ objects will automatically be initialized whenever you assign a specific value\
    \ to the variable. For instance, the code below creates 2 variable objects (`age`\
    \ and `count`) and assigns them the values 10 and 30 respectively:\n\n```python\n\
    age = 10\ncount=30\n```\n\nIf you want to delete reference to the Number object,\
    \ you’ll use the word `del` followed by the variable name that you wish to delete.\
    \ Consider the code below that deletes two variables: `age` and `count` that have\
    \ been declared and used.\n\n```python\ndel age, count\n```\n\nPython language\
    \ supports four different categories of number types. These are:\n- `int`: when\
    \ used in a declaration it refers to signed integers. These include those whole\
    \ numbers that range from 8 bits to 32 bits.\n- `long`: These are long integers.\
    \ They can be represented either in octal and hexadecimal numbering notation.\n\
    - `float`: These are floating real point values. They may range from 8 bits to\
    \ 64 bits long.\n- `complex`: These are complex numbers.\n\n### b) Strings\n\n\
    Strings are stored as consecutive sets of characters in the computer’s memory\
    \ locations. Python language allows you to use either pair of single or double\
    \ quotes when defining the strings. Other subsets of string variable types can\
    \ be specified using the slice operator `[]` and `[:]` with the indexes that range\
    \ from 0 at the beginning of the string. The `+` operator performs string concatenation\
    \ (joining of two or more strings) while the `*` operator performs string repetition.\n\
    \n## File Handling in Python\n\nA file is simply a named location on disk that\
    \ has stored related information. Files are used to store data on a permanent\
    \ basis on a non-volatile storage device such as a hard disk. You are aware that\
    \ the main memory—and specifically the RAM—can’t be used to store data on a permanent\
    \ basis. Therefore, files must always be stored on a permanent storage device.\
    \ When a file is created on a secondary storage device, the following file information\
    \ is automatically generated by the respective OS:\n- Name of the file\n- Its\
    \ location\n- File size\n- File attributes such as read/write read only and archive\
    \ you use this mode if you are dealing with non-text data such as images.\n\n\
    ### File Object Attributes\n\nOnce you’ve opened a file, the file object is created\
    \ automatically with the following information that is related to the file. The\
    \ Python code below illustrates an example of how you can work with file object\
    \ attributes:\n\n```python\nmyfile = open(\"Readme.txt\", \"wb\")\nprint \"The\
    \ name of the file is: \", myfile.name\nprint \"Is the file closed or not? : \"\
    , myfile.closed\nprint \"The opening mode of the file is: \", myfile.mode\nprint\
    \ \"The Softspace flag of the file is: ,\" myfile.softspace\n```\n\nThe above\
    \ code will produce the following output:\nThe name of the file is: Readme.txt\n\
    Is the file closed or not? : False\nThe opening mode of the file is: wb\nThe Softspace\
    \ flag of the file is:\n\n### The `close()` Method\n\nThe `close()` method of\
    \ a file object is used to flush any unwritten information and close the file.\
    \ When the file been closed, no more writing can take place. You should note that\
    \ Python automatically closes the file when the reference of the file is reassigned\
    \ to another file. This is why it is good practice to use `close()` method to\
    \ close a file. Below is an example of how you can close a file in:\n\n```python\n\
    myfile = open(\"Readme.txt\", \"wb\")\nprint \"The name of the file is: \", myfile.name\n\
    myfile.close()\n```\n\n### Reading and Writing Files\n\nThe file object gives\
    \ a set of access methods that make the process of reading and writing to files\
    \ much easier. In particular, the two methods that you’ll need are `read()` and\
    \ `write()`. The write method here’s the syntax for `write()` method:\n\n```python\n\
    myfile = open(\"Readme.txt\", \"wb\")\nmyfile.write(\"I have learned several aspects\
    \ of Python Programming in this book. The book is great for Advancedmers!\\n\"\
    )\nmyfile.close()\n```\n\n### The `read()` method\n\nThe `read()` method is used\
    \ to read a string from a file that you opened. In the above example, the passed\
    \ `count` parameter is the number of bytes that are supposed to be read from the\
    \ file. Below is an example:\n\n```python\nmyfile = open(\"Readme.txt\", \"r+\"\
    )\nprint myfile.read(count)\nmyfile.close()\n```\n\n### The `tell()` method\n\n\
    Check current position using the `tell()` method. Below is an example of how you\
    \ can close the file in Python:\n\n```python\nmyfile = open(\"Readme.txt\", \"\
    r\")\nprint \"Current position : \", myfile.tell()\nmyfile.close()\n```\n\n###\
    \ The `seek()` method\n\nReposition the pointer at the start once again using\
    \ the `seek(0, 0)` method:\n\n```python\nmyfile = open(\"Readme.txt\", \"r\")\n\
    myfile.seek(0, 0)\nprint \"Again string: \", myfile.read(10)\nmyfile.close()\n\
    ```\n\n### The `readlines()` method\n\nThe `readlines()` reads every data in the\
    \ text file. This is an easy way to read the entire string. Here is an example:\n\
    \n```python\nmyfile = open(\"Readme.txt\", \"r\")\nlines = myfile.readlines()\n\
    myfile.close()\n```\n\n### The `readline()` method\n\nNow the above code reads\
    \ the entire file by line. You can use the `while` statement to help you read\
    \ file by line. Below is an example:\n\n```python\nmyfile = open(\"Readme.txt\"\
    , \"r\")\nline = myfile.readline()\nwhile line:\n    print line\n    line = myfile.readline()\n\
    myfile.close()\n```\n\n## Important Considerations\n\nBesides the basic attributes\
    \ of Data Science modeling, there are other important things that a Data Scientist\
    \ must know to create something valuable. Things as in-depth testing using specialized\
    \ sampling, sensitivity analysis, and different aspects of the model performance\
    \ to improve a given performance aspect belong to Data Science modeling. To help\
    \ you understand how deep the field of deep learning goes and just how much it\
    \ has changed everyone’s lives already, I will dedicate this section to showing\
    \ you specific examples of deep learning and how it is used in its myriad of applications.\
    \ Keep in mind, this is not meant to advertise any kind of product or service,\
    \ but to show you that deep learning is far more common than many people think\
    \ and that it is not a field pertaining to the higher levels of each industry,\
    \ but one that belongs to all of us to some extent. So, without further ado, let’s\
    \ dive in:\n\n### Image curation on Yelp\n\nAlthough Yelp may not be as popular\
    \ as it used to be, it still has a very important role to play in how people experience\
    \ the new places in their living areas (or the different locations they visit\
    \ as tourists, for example). At first, Yelp may seem like anything but a tech\
    \ company - but they are using actual machine learning to make sure their users\
    \ come back to the site because it provides them with actual, helpful information.\
    \ More specifically, Yelp has developed a machine learning system capable of classifying,\
    \ categorizing, and labeling images submitted by users - but more importantly,\
    \ this system helps Yelp do this in a genuinely efficient way. This is extremely\
    \ important for the company, given the huge amounts of image data they receive\
    \ every.\n\n### Pinterest Content\n\nWho knew searching for wedding ideas on Pinterest\
    \ is machine learning.\n\n"
  trans: "\n\n# 第 3 章：用 Python 学习编程\n\n当 Guido van Rossum 在 20 世纪 80 年代后期开发第一个 Python\
    \ 语言编译器时，他万万没想到这种语言在机器学习和人工智能领域的知名度将超过许多流行的语言。事实是——在过去的几年里，Python 语言已成为成为解决大多数机器学习问题的解决方案。Python\
    \ 语言对初学者非常友好，却又强大。难怪 Python 语言在 Google、Pinterest、Mozilla、Survey Monkey、Slideshare、YouTube\
    \ 和 Reddit 等一些最流行的系统中，作为核心开发语言被广泛应用。\n\n此外，无论你是初学者还是高级程序员，Python 的语法都极其易于理解和遵循。如果你是\
    \ `C`、`C++`、`Java` 或 `Perl` 的高级开发者，你会发现在 Python 中进行编程极其简单。如果你是一个经验丰富的开发者，你可以用\
    \ Python 成就巨大的事业。除了开发游戏、数据分析和机器学习之外，Python 语言还可以用于编写通用 AI 系统和图形用户界面（GUI）的开发。本章将探索你如何用\
    \ Python 语言工程化机器学习系统。让我们开始吧。\n\n## 开始使用 Python\n\n显然，要在 Python 中启动机器学习系统的开发，你需要在你的电脑上安装它并设置编程环境。如果你是一个新手\
    \ Python 程序员，学习 Python 安装的基础知识和环境搭建将对提升你的水平大有裨益。\n\n### 安装过程\n\n下载和安装 Python 语言解释器的过程非常简单。如果你使用的是最新的\
    \ Linux 发行版——无论是 `Ubuntu`、`Fedora` 还是 `Mint`——你会发现系统中已经安装了最新版本的 Python。你只需要更新你的系统即可。\n\
    \n如果你使用的是基于 Debian 的 Linux 发行版，请按照以下步骤更新系统：\n- 启动终端（Terminal）应用并在命令行提示符输入以下命令：`su\
    \ apt-get update`\n- 输入你的 root 密码并按回车\n- 等待更新过程完成\n\n如果你使用的是基于 Redhat 的 Linux\
    \ 发行版（如 `Fedora`），请按照以下步骤更新系统：\n- 启动终端（Terminal）应用并在命令行提示符输入以下命令：`su apt-get update`（注：此处原文命令可能存在误误，通常\
    \ Redhat 系使用 `yum update`）\n- 输入你的 root 密码并按回车\n- 等待更新过程完成\n\n另一方面，如果你使用的是 Linux\
    \ 以外的其他操作系统，你必须下载并安装 Python。此外，如果你使用的是没有 Python 的旧版本 Linux，你必须手动安装。请按照下面的步骤在 Linux\
    \ 上安装 Python：\n- 启动终端（Terminal）应用（确保你已连接网络）\n- 在命令行提示符输入 `su` 并按回车\n- 输入你的 root\
    \ 密码并按回车\n- 如果你使用的是基于 Debian 的 Linux（如 `Ubuntu`），在命令行提示符输入：`apt-get install python`\
    \ 并按回车\n- 另一方面，如果你使用的是 Red Hat/RHEL/CentOS Linux 发行版（如 `Fedora`），在命令行提示符输入：`yum\
    \ install python` 并按回车\n- 等待安装完成。如果是基于 Debian 的 Linux，输入 `su apt-get update`；如果是\
    \ Redhat/RHEL/CentOS Linux，输入 `su yum update`。\n\n### Windows 系统呢？\n\n在下载和安装 Python\
    \ 之前，先决定你想安装的 Python 版本。根据经验，始终选择最新版本。写本书时，最新版本是 3.6。以下是帮助你在 Windows 上安装 Python\
    \ 的步骤：\n- 访问 `www.python.org` 并下载当前版本的 Python。根据你操作系统的位数（32 位或 64 位）选择合适的版本。\n\
    - 打开下载的 Python 文件\n- 点击屏幕上的“接受设置（Accept the settings）”并等待安装过程完成\n\n如果你是 Mac 用户，你会发现系统已自带\
    \ Python 2.7。因此，如果你想开始使用 Python，不需要安装任何内容。如果你想安装最新版本的 Python，需要使用 Homebrew。\n\
    - 打开终端或你喜欢的模拟器\n- 在命令行提示符输入以下命令：`/user/bin/ruby -e \"$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/install)\"\
    `\n- 现在在命令行提示符输入 `brew install python` 安装 Python 解释器\n- 等待安装过程完成\n\n## 安装好 Python\
    \ 后做什么？\n\n现在是时候开始开发机器学习系统了。但现在要决定使用哪种文本编辑器。你可以选择合适的编辑器来帮助编码和执行程序。一些流行的编辑器有 `Emacs`、`Geany`、`Komodo\
    \ Edit` 和 `Sublime Text`。由于我们都知道这些文本编辑器的缺点——我不建议你使用它们。相反，请使用 Python IDE（集成开发环境）。IDE\
    \ 具有以下功能：\n- 语法高亮\n- 代码语句自动补全\n- 智能缩进\n- 带有单步、持久断点和调用栈可见性的调试器\n\n### 启动 Python\n\
    \n要开始，必须学会如何启动 Python。你可以从终端启动 Python，或者使用桌面环境启动 IDLE。只需启动终端并在命令行提示符输入 `idle`。现在你已经启动了\
    \ Python，是时候开始编码了。按照以下步骤编写你的第一个 Python 程序：\n- 打开 Python IDLE\n- 在 IDLE 窗口中编写 Python\
    \ 语言语句（指令）\n- 运行程序\n\n就是这样！简单吧？现在有一个查看编程过程运行的快捷方法……将以下代码复制并粘贴到你的 Python IDLE 窗口中。\n\
    \n```python\nprint (\"Hello World! This is first Machine Learning program\")\n\
    ```\n\n运行程序。你看到了什么输出？“Hello World! This is first Machine Learning program”。恭喜！你刚刚写了第一个\
    \ Python 代码。我知道你现在急于开始编写机器学习系统了。不用太担心语句的含义。如果你是机器学习新手，掌握一些 Python 编程概念将帮助你理解如何设计机器学习应用。接下来，让我们一起深入学习\
    \ Python 编程的基础。\n\n## Python 概述\n\n现在你已经执行了第一个程序，还需要了解什么？现在是时候理解任何 Python 代码的关键组成部分，包括它的结构了。所有的\
    \ Python 程序都具有以下结构：\n\n```python\nimport sys\ndef main ():\n    if len(sys.argv)\
    \ == 10:\n        name = sys.argv[2]\n    else:\n        name = “Introduction\
    \ to Machine Learning.” print (“Hello”), name\n```\n\n从这个程序可以看出，所有的 Python 代码都应该以\
    \ `import` 开始。现在，我们在导入什么？Python 语言是面向对象的，因此它具有所有面向对象语言的组件。其中一个属性是继承，简单来说就是代码重用。继承代码的功能允许程序员重用其他编写的代码。从技术上说，`import`\
    \ 语句告诉 Python 解释器声明已使用的类，无需引用它们的全名。例如，`import sys` 语句在 Python 程序启动时告知包含所有系统库。`def\
    \ main ():` 语句是什么意思？每当 Python 程序加载并执行时，计算机的内存（随机存存储器 RAM）都包含函数定义的对象。函数定义为程序员提供了指令控制单元将函数对象放入计算机内存适当部分的能力。换句话说，这就像指令控制单元检查主内存并初始化需要执行的程序。例如，下面的\
    \ Python 代码创建了一个函数对象并将其命名为 `main`：\n\nPython 的不同元素有哪些？所有的 Python 程序都包含以下内容：\n\
    - **程序语句（Program statements）**：程序语句是告诉控制单元执行给定操作的句子或指令。与大多数编程语言不同，Python 语句末不需要分号。\n\
    - **空白符（Whitespace）**：空白符是制表符、空格和换行符/回车符的总称。Python 语言对空白符在代码中的位置有严格要求。\n- **转义序列（Escape\
    \ sequences）**：转义序列是用于输出的特殊字符。例如，程序中的 `\\n` 告诉 Python 在新行输出。\n- **程序注释（Documenting\
    \ the program）**：程序中除第一行外的任何以 `#` 开头的语句都被视为注释，并在执行期间被忽略。这允许你对代码部分进行说明。\n- **关键字（Keywords）**：关键字是解释器识别并理解的指令。例如，`print`\
    \ 词就是一个关键字。在 Python 中，有两种主要类型：函数（functions）和控制（control）。函数是简单的动词，如 `print`，告诉解释器做什么；控制执行流。\n\
    - **模块（Modules）**：Python 程序带有很多模块，这增加了其功能性。模块将帮助你以易于调试的方式组织代码。\n\n## 变量\n\n在运行程序时，计算机内存中发生了很多事情。理解变量和数据类型将帮助你编写高效的程序。程序简单的一一组指令（语句），引导计算机执行特定任务。例如，之前的程序打印了“Hello\
    \ World! This is first program”，在屏幕上输出之前，有些数据必须保存在内存中。数据类型适用于所有编程语言——包括 Python——因此，理解内存中的数据管理是开发稳健、强大应用程序的第一步。变量可以被视为计算机内存中的临时存储位置，特别是随机存存储器\
    \ RAM。这种临时存储位置包含了你想在程序中使用的数据。换句话说，当你定义变量时，必须给它赋值。例如，下面的语句为两个变量分配了临时存储空间：`age,\
    \ count=30`。\n\n```python\nage = 10\ncount=30\n```\n\nPython 语言有不同的数据类型分类用于定义存储方法和数学操作。以下是\
    \ Python 中的数据类型示例：\n- 数字（Numbers）\n- 字符串（String）\n- 列表（List）\n- 元组（Tuple）\n- 字典（Dictionary）\n\
    \n### a) 数字\n\n数据类型存储数值。每当你为变量分配特定值时，数字对象会自动初始化。例如，下面的代码创建了变量对象：\n\nPython 语言支持四种不同的数字类型，这些是：\n\
    - `int`：在声明时指有符号整数。这些包括从 8 位到 32 位的整数。\n- `long`：这些长整数。可以使用八进制和十六进制表示法。\n- `float`：这些是浮点数。它们的范围可能从\
    \ 8 位到 64 位。\n- `complex`：这些复数。\n\n### b) 字符串\n\n字符串作为计算机内存位置中连续字符集存储。Python 语言允许在定义字符串时使用单引号或双引号。字符串变量类型的子集可以使用切片运算符\
    \ `[]` 和 `[:]` 指定，索引从字符串开头的 0 开始。`+` 运算符执行字符串拼接（两个或多个字符串的连接），而 `*` 运算符执行字符串重复。\n\
