    ·         Name of the file ·         Its location ·         File size ·         File
    attributes such as read/write read only and archive You can use this mode if you
    are dealing with non-text data such as images. The File Object Attributes Once
    you’ve opened a file, the file object is created automatically with the following
    information that is related to the file. The Python code below illustrates an
    example of how you can work with file object attributes: myfile = open("Readme.txt",
    "wb") print "The name of the file is: ", myfile.name print "Is the file closed
    or not? : ", myfile.closed print "The opening mode of the file is: ", myfile.mode
    print "The Softspace flag of the file is: ," myfile.softspace The above code will
    produce the following output: The name of the file is: Readme.txt Is the file
    closed or not? : False The opening mode  of the file is: wb The Softspace flag
    of the file is: The close() Method The close() method of a file object is used
    to flush any unwritten information and close the file object. When the file has
    been closed, no more writing can take place.  You should note that Python automatically
    closes the file when the reference object of the file is reassigned to another
    file. That is why it is a good programming practice to use the close() method
    to close a file. Below is the syntax for closing a file: fileObject.close() Below
    is an example code of how you can close a file in Python: myfile = open("Readme.txt",
    "wb") print "The name of the file is: ", Readme.name myfile.close() Reading and
    Writing Files The file object gives a set of access methods that make the process
